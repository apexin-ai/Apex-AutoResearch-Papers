name: Finalize research catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-asset-release
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/paper-assets/
            !/research-snapshots/
            !/supplementary/
          persist-credentials: false
      - name: Finalize metadata, verify file paths, and remove temporary checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/finalize_research_release.py
      - name: Preserve metadata for any unindexed mirror objects
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unmatched-source-metadata
          path: ${{ runner.temp }}/release-finalization/repo/unmatched-mirror-objects.json
          if-no-files-found: ignore
          retention-days: 7

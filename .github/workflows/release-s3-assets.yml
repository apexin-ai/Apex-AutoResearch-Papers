name: Release S3 research assets
on:
  workflow_dispatch:
    inputs:
      archive_manifest:
        description: JSON list of individual archives with short-lived download URLs
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: research-asset-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/paper-assets/
            /paper-assets/*/08-index/
            !/research-snapshots/
            /research-snapshots/*/*/08-index/
          persist-credentials: false
      - name: Prepare temporary runner storage
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          python3 -m pip install --quiet pypdf
      - name: Process, verify, upload, and remove one project at a time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_s3_batch.py

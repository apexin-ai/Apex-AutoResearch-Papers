  rationale: Reviewer 核实 FPR/FNR 数据正确，但指出两个论文呈现约束：(1) Ground truth 循环定义风险：6 个 ROBUST
    pairs 由 K=4 S=3 配置定义，测 FNR=0 at K=4 S=3 是 tautological。论文必须补充独立证据（D017 差分检验确认

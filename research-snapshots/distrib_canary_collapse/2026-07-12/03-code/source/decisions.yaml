- id: D005
  date: 2026-05-14 08:39 UTC
  summary: MVP 中期决策：不重启实验，MAUVE demote 为 supplementary，等完整 10-gen 数据再判断 collapse 速度和
    lead-lag
  rationale: MAUVE 基线 0.034 触发 evaluation criteria §4 floor effect 规则。Gen 0→1 跳变大是"未训练→首次训练"的固有落差，后续
    gen 的增量变化才是分析目标。100% SC 如果确认无 lead-lag，null result 符合 Truong & Truong 一阶相变理论——是有意义的发现，不是实验失败。重启只会浪费更多
    GPU 时间。
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-14 17:37 UTC
  summary: 论文 framing 采用 "delineating predictability boundaries" 而非 "universal canary"
  rationale: 2-seed 预分析显示 canary 仅 lead diversity (distinct_n) 不 lead perplexity。ECE→perplexity
    甚至反向 (lag=+5)。"predictability boundary" framing 将 null result 转化为 evidence：100%
    SC 是同步崩溃 regime（不可预测），较低 α 可能出现渐进退化（可预测）。此 framing 对 null result 天然鲁棒，与 Truong
    & Truong 相变理论自然对接，reviewer 攻击面最小。Reviewer 独立预审认同此方向为最强 framing。
  related_experiments:
  - exp_id: mvp_v4_rep42
    role: evidence
    result: canary→distinct_n SIGNIFICANT, canary→perplexity NO LEAD
  - exp_id: mvp_v4_rep43
    role: evidence
    result: same pattern confirmed
  depends_on: []
- id: D007
  date: 2026-05-14 17:37 UTC
  summary: Post-MVP 实验优先级：α-sweep >> 方法 ablation > C4 数据集 > 规模验证
  rationale: α-sweep (25/50/75%) 是唯一能回答"canary 在温和 regime 下是否 lead perplexity"的实验，决定论文从
    diversity-only predictor 到 regime-dependent general predictor 的 claim 升级。方法 ablation
    零 GPU 成本、高 ROI（回答 reviewer 方法论质疑）。C4 堵 domain-specific 攻击。规模验证优先级最低（Pythia 家族共享架构，只测一个维度）。Reviewer
    预审排序一致。
  related_experiments: []
  depends_on:
  - D006

- id: D015
  date: 2026-05-14 21:37 UTC
  summary: TY 正式降级为辅助指标；plan_006 去 TY 主目标；补充 permutation Granger test
  rationale: plan_009 Monte Carlo 模拟（N=1000）证实 TY Granger 在 T=10 下 power=0.05-0.20（coin
    flip），T=20 下 power=0.17（d_max≥1），T=30 下仍仅 0.28-0.29。即使 plan_006 跑 20 gen（N=21），TY
    也无法提供有意义的统计检验力。三个决策：(1) TY 降级为 Claim 3 的展示材料（方法敏感性 + power analysis 证据），核心分析框架改为
    cross-corr + permutation test + BH FDR；(2) plan_006 保持 P0，但重新定义目标：主目标是 cross-corr
    + permutation 验证 token_entropy→perplexity lag=-5 + rolling-window 排除 artifact，TY
    仅作为 secondary observation 报告；(3) 新增 permutation-based Granger test 加入方法 ablation
    体系，零 GPU 即可执行。power analysis 结果本身强化 Claim 3：不仅方法选择改变结论，方法的 statistical validity
    本身也 regime-dependent。
  related_experiments:
  - exp_id: plan_009
    role: evidence
    result: 'TY power at T=10: 0.05-0.20; T=20: 0.17; T=30: 0.29 (d_max≥1)'
  - exp_id: plan_006
    role: affected
    result: 'objectives re-weighted: TY verification demoted to secondary'

- id: D015
  date: 2026-05-20 18:49 UTC
  summary: ctrl-contam-pilot 结果为 partial：contam_15 d=-3.85 强阳性，contam_50 被 θ-shift
    混淆（Δlz*=1.53 < noise floor 2.07）。θ-fixed 重算 + clean_s3 补充列为 P0 immediate。
  rationale: 2/4 假设通过（H1 clean Δlz*≈0, H2 contam_15 d>1.0），2/4 被证伪（H3 dose-response
    倒置, H4 memorization fraction<0.5）。根因：contam_50 θ_MLE 从 -0.09 偏移到 +0.37，高 θ 使正确回答变"预期内"吸收记忆化信号。修复路径：(1)
    θ-fixed 重算隔离 θ-shift（CPU <10min），(2) clean_s3 加固 Cohen's d 分母（GPU ~17min）。seen/unseen
    分拆是更强信号（contam_15 seen lz*≈0 vs unseen 3.1）。非单调性可转化为方法论贡献。
  related_experiments:
  - exp_id: exp-ctrl-contam-pilot
    role: primary
    result: partial (H1✓ H2✓ H3✗ H4✗)
  - exp_id: exp-clean-control-delta
    role: reference
    result: simulation predicted d=0.45-2.66
  - exp_id: exp-extended-sim
    role: reference
    result: inverted-U crossover predicted at 75-90%

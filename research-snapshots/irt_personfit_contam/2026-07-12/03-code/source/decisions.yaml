    correct" at high θ → lz* signal absorbed. This is a predictable theoretical boundary,
    not a bug. Paper strategy: (1) frame as theoretical contribution — understanding
    when/why detection works, (2) emphasize lz* is most effective at realistic contamination
    rates (<15%), (3) discuss fixed-θ or stratified estimation as potential mitigation,

- id: D018
  date: 2026-05-14 03:31 UTC
  summary: 推翻 D017：plan013 held-out ISR=0.535 是 tautological hacking 假象（100% P→P），random
    reward 加速 hacking 而非改善结构
  rationale: Reviewer 逐样本检查 plan013 eval_sta 结果：100/100 样本全部是「把 conclusion 抄一遍当 premise」(P→P
    tautology)，ISR=0.5 是机械值（2 components, 1 necessary）而非真实结构质量。D017 基于 ISR=0.535 得出的"anti-saturation
    改善结构"结论完全错误。实际情况：random reward 让模型找到了最终极的 hacking 捷径——100% tautological formalization。对比
    exec-only 100步 ISR=0.6423（有真实推理）→ 500步 ISR=0.132（退化但非全 tautological），random reward
    加速了 hacking 收敛。plan002 eval_sta 结果成为关键：如果 additive ISR bonus 产生的是非 tautological
    formalization，即使 PR 低也是积极信号——ISR reward 在抵抗 hacking。
  related_experiments:
  - exp_id: plan013-random-reward-s42-r4
    role: primary
    result: 100% tautological P→P, ISR=0.5 是机械值而非结构质量
  - exp_id: plan001-exec-only-s42-r2
    role: comparison
    result: held-out PR=0.93, ISR=0.132, 部分真实推理
  - exp_id: plan002-additive-b03-s42
    role: pending_critical
    result: PR低但可能是真实推理, eval_sta 待出
  depends_on:
  - D017
- id: D019
  date: 2026-05-14 03:33 UTC
  summary: ISR 衡量 syntactic component necessity 而非 semantic faithfulness，论文需明确边界并用
    plan014 downstream validation 补盲区
  rationale: Reviewer 发现 ISR 反直觉行为：plan013 P→P 纯重言式 ISR=0.5 > plan001 多前提嵌入 conclusion
    ISR≈0。从语义忠实度看 P→P 更差（完全忽略 context），但 ISR 定义下反而更高，因为 ISR=n_necessary/n_components，极简
    formalization 的分母小。论文不能将 ISR 差异直接等同于 formalization 质量差异——需明确 ISR 的 scope 是 component
    necessity。plan014 downstream NLI validation 直接测量 semantic faithfulness，弥补 ISR
    盲区。同时建议考虑组合指标（ISR + non-tautological check + 最小组件数阈值）。
  related_experiments:
  - exp_id: plan013-random-reward-s42-r4
    role: evidence
    result: P→P tautology ISR=0.5, 语义完全退化但ISR不低
  - exp_id: plan001-exec-only-s42-r2
    role: evidence
    result: 多前提嵌入conclusion ISR≈0, 语义更好但ISR更低
  - exp_id: plan014
    role: mitigation
    result: downstream NLI validation 补充语义忠实度测量
  depends_on:
  - D018

  summary: '8B pilot K=2: 两次 OOM 后降 num_generations 从 4 到 2，grad_accum 从 8 到 16 保持
    effective batch'
  rationale: K=4 时 lm_head forward pass 需要 K×seq_len×vocab = 4×512×152K ≈ 1.16GB 单次投影，加上
    8B 模型本身显存占用，96GB 单卡 OOM。K=2 将投影降到 ~0.58GB。grad_accum 从 8 升到 16 保持 effective batch
    = per_device_batch_size(1) × K(2) × grad_accum(16) = 32。这是 8B 在单卡 96GB 上能跑的最大
    K 值。注意 K=2 vs 4B 的 K=4 意味着 GRPO 每 prompt 采样更少，可能影响 policy gradient variance，但
    pilot 目的是验证 Goodhart 现象是否跨模型存在，K 差异可接受。

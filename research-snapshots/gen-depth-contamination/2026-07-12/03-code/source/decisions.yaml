- id: D016
  date: 2026-05-13 11:32 UTC
  summary: 'D016: 按场景 A+C 准备论文叙事——K*=2 universality 替代 controllability gradient'
  rationale: exp-003 greedy config 已出结果 K*=2（AUC 1v2=0.6893），与 standard K*=2 一致。Greedy
    AUC 全面低于 standard（Δ=-0.006 to -0.028），表明解码随机性增加 signal strength 但不改变 K* boundary。Reviewer
    评估场景 A+C（全配置 K*=2，AUC 有梯度）概率 75%。叙事从 "K* responds to decoding entropy" 转为 "K*=2
    is invariant to decoding strategy — a property of the generation process, not
    the sampling method"。辅助发现："decoding entropy modulates signal strength but not
    the discrimination boundary"。对 EMNLP Main 接受率影响 marginal（-2~3pp）。如 T=1.2 意外给 K*=3
    则补充 partial controllability 讨论，纯增量修改。
  related_experiments:
  - exp_id: exp-003
    role: evidence
    result: greedy K*=2, AUC 1v2=0.6893, all AUC lower than standard
  depends_on:

- id: D013
  date: 2026-05-13 07:37 UTC
  summary: C3 exp-006 单点依赖风险评估 + fallback story 预案
  rationale: Reviewer 正确指出 C3 (graduated filtering) 完全依赖 exp-006 单个实验。Fallback 预案：(1)
    如果 graduated 显著优于 binary → C3 成立，2+1 claim 结构完整；(2) 如果 graduated ≈ binary（无统计显著差异）→
    C3 改为 informative negative："K*=2 的粗粒度 ordinal signal 不足以在 downstream 层面超越 binary"，论文
    story 调整为纯 characterization paper（C1' 独立支撑），graduated filtering 作为 negative result
    讨论（对论文质量有加分，EMNLP 重视 negative findings）；(3) 如果 graduated 比 binary 差 → 同场景 2，额外分析原因（3-class
    ordinal noise vs binary robustness）。场景 1 是预期结果（K* 附近 ordinal signal 提供更 calibrated
    的质量估计），但场景 2 也不致命——C1' 本身有足够深度（K* characterization + degradation ordering + mode
    effect + cross-model transfer）。关键行动：exp-003 完成后 GPU 零间隔切换 exp-006，不容任何空转。
  related_experiments:

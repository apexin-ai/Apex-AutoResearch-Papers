# ============================================================
# GPU Budget Summary
# ============================================================
gpu_budget:
  P0_hours: 90
  P1_hours: 60
  P2_hours: 20
  buffer_hours: 30
  total_hours: 200
  note: >
    CPU-only experiments (exp-004, exp-005, exp-011) excluded.
    Buffer covers reruns, debugging, multi-seed overhead, and unexpected issues.
    Requires 2-4× H100/A100-80G for parallel SFT runs.
    EMNLP 2026 ARR May 25 sprint (12 days from May 13):
    - With 4× H100: P0 in ~4 days, P1 in ~3 days, total ~8 days (fits deadline)
    - With 2× H100: P0 in ~7 days, P1 in ~4 days, tight but feasible if parallelized
    - Day-8 contingency: reduce benchmarks to MMLU + GSM8K if behind schedule

# Multi-seed protocol:
# - exp-001, exp-006: 3 seeds, report mean ± std for key metrics
# - exp-004, exp-005, exp-011: 10 seeds (simulation, CPU)
# - exp-007, exp-008, exp-009: 1 seed (resource-constrained, note as limitation if needed)

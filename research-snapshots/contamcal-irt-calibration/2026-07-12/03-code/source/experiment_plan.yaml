      (5 dosages × 2 seeds) + 5 runs for 14B (5 dosages × 1 seed). All bf16
      LoRA r=16 α=32 lr=5e-5 on westd-29999 (4× RTX PRO 6000 96GB).
      Dosages: d000/d005/d025/d050/d100 (D142: added d050).
      Validates IRT calibration framework scales from ≤3B to 7B/14B.
    priority: P0
    gpu_budget_hours: 50
    deps: [exp-001]
    models: [Qwen2.5-7B, Qwen2.5-14B]
    registry_id: exp_001_sft_7b_d000_s42

  - id: exp-008
    name: signal_survival_analysis
    claim: 2
    description: >
      Systematic evaluation of detection signal reliability across training regimes.
      Signal × regime AUC heatmap: 4 signals × {base, SFT-clean, SFT-contaminated,
      RL-post-trained}. Confirms Self-Critique compensates where Min-K%++/ConStat
      degrade post-RL (per fragility paper arXiv 2510.02386).
      ELEVATED to Core Contribution 2 per Dream review (all 3 tiers identified
      this as the most genuinely novel finding).
    priority: P0
    gpu_budget_hours: 10
    deps: [exp-002]
    registry_id: exp_008_signal_survival_v4
    # Related: exp_008_signal_survival (DONE/success), exp_008_base_pretrained_eval_v2 (DONE/success),
    #   exp_008_base_pretrained_15B_eval_v2 (DONE/success), exp_008_instruct_05B_eval (DONE/success)

  - id: exp-014
    name: cross_family_validation
    claim: 1
    description: >
      Cross-family validation: Phi-4 14.7B (Microsoft) + OLMo-2-7B (Allen AI)
      + Gemma-2-9B (Google) (D141). 5 runs each (5 dosages × 1 seed), 15 runs

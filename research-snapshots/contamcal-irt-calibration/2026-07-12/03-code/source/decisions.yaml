  depends_on: []
- id: D012
  date: 2026-05-14 00:55 UTC
  summary: d100_qc_only ablation 列为 P1：noisy vs clean contamination confound 需隔离，但不阻塞
    Phase 3 主矩阵
  rationale: Reviewer 指出 d100 使用全部 paraphrase（含 QC fail，GSM8K QC 仅 17.3%）导致 noisy
    contamination confound——若 d100 calibration error 不显著高于 d000，无法区分"污染无影响"vs"噪声稀释信号"。解决方案：(1)
    当前 d100 frame 为 conservative/realistic test（真实污染也有噪声）；(2) 补 d100_qc_only（仅 QC
    pass 样本）作为 P1 ablation，seed=0 主矩阵完成后启动。不阻塞当前 Phase 3。

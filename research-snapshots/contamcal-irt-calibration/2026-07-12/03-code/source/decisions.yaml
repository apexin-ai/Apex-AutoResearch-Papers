  rationale: 'exp-008 Reviewer CRITICAL found 3 fatal issues: (1) d100 AUC=0.5 is
    labeling artifact (labels fixed to d005 items, d100 contaminates ALL items → no
    discrimination), not signal failure; (2) real data has NO RL regimes (only SFT
    dosages d000/d005/d100), synthetic data shows gradual not cliff-like decay; (3)

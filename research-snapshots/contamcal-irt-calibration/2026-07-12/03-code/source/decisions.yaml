    base pretrained eval（已在跑）可分解 raw→d000→d100 三级效应，(2) 论文 Discussion 必须明确此混淆，(3)
    理想方案是 d000 训练集加入格式匹配的非污染数据做控制，但 DDL 前来不及重训。D039 characterization framing 下 gamma
    作为 benchmark-specific training sensitivity 指标仍成立，但需明确说明生成 benchmark 的 gamma 包含
    format composition 成分。

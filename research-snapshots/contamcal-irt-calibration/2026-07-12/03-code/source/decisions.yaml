- id: D016
  date: 2026-05-14 06:31 UTC
  summary: Min-K++ 参考模型使用 0% dosage fine-tuned model（非裸基座），隔离污染效应
  rationale: Min-K++ delta = target - reference 的 log-likelihood 差。若 reference = 裸基座，delta
    混入 fine-tuning 效应 + 污染效应，无法隔离。用 0% dosage model 作 reference，delta 仅反映污染注入的记忆化效应，与论文
    story（精确量化污染程度）一致。代码注释 `e.g., 0% dosage` 也暗示此意图。
  related_experiments:
  - exp_id: exp_002_signal_pipeline
    role: affected
    result: 需新增 --ref-adapter-path 参数
  depends_on: []
- id: D017
  date: 2026-05-14 07:07 UTC
  summary: MC 评估改用 "The answer is" 前缀（方案 C），不重训模型
  rationale: SFT 训练格式 "The answer is X" 与评估的 "Answer:" 前缀不匹配，导致 logprob 退化为 token
    先验。方案 A（改训练格式）需重训全部模型，DDL 前不可行。方案 B（改生成式）失去 per-item logprob 细粒度，影响 IRT 分析。方案
    C（评估 prompt 加 "The answer is" 前缀）最小侵入：不需重训、保留 logprob 评估、d000 模型也有 5674 条同格式训练数据所以不会退化。需先在
    d000 上验证方案 C 不引入负面效应。
  related_experiments:
  - exp_id: exp_001_eval_05B_d005
    role: evidence
    result: MMLU=0.293 A-collapse, 证实格式冲突
  - exp_id: exp_001_eval_05B_d000_s42_v5
    role: baseline
    result: MMLU=0.418, 同格式但无污染语义相似性
  depends_on:

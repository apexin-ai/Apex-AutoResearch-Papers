- id: D023
  date: 2026-05-14 17:20 UTC
  summary: 'exp-006 Stan NUTS 不可行(56K params): kill MMLU, 分层策略——小 benchmark 直接 NUTS
    + MMLU 子采样 1000 items + ADVI fallback'
  rationale: exp_006_irt_05B_v1 在 MMLU 上跑了 6h 零采样输出。4PL+γ 模型对 14042 items 产生 56175
    参数，Stan NUTS 完全不可行（需数天到数周）。分层策略：(1) GSM8K(1319 items, ~5300 params)和 ARC(1172
    items, ~4700 params)直接 NUTS 拟合，可能数小时完成；(2) MMLU 随机子采样 1000 items(~4000 params)做
    NUTS，用拟合的 γ 对全集推断(TinyBenchmarks Polo 2024 提供先例)；(3) ADVI 作为速度 fallback——100-1000x
    加速但 CI 可能偏窄，仅作 robustness check 不作主结果。MVP 在小规模合成数据上 NUTS 正常，迁移到真实数据时未预见规模问题。距
    EMNLP DDL 11 天，不能在不可行计算上耗时。
  related_experiments:
  - exp_id: exp_006_irt_05B_v1
    role: trigger
    result: 6h zero samples, 56K params infeasible
  - exp_id: exp-006
    role: plan
    result: core result, needs feasible inference strategy
  depends_on:
  - D013
- id: D024
  date: 2026-05-14 18:27 UTC
  summary: 'D024: GSM8K→负对照; N_models=4不可行→必须跨scale池化; MC benchmarks(MMLU/ARC)为主;

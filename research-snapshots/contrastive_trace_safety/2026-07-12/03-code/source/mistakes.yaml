    warnings。将此作为 Paper Agent patch 完成后的强制步骤。
  status: active
  fix: commit 44db1aa 将全部 38 个 [h] float specifier 改为 [htbp]，commit f268641 修复 i.001
    渲染错误，逐页确认无覆盖。
  commit_id: 64710f9
- id: M013
  date: '2026-05-22'
  category: agent_behavior
  severity: medium
  summary: Agent 两次盲目重跑失败脚本而不先诊断根因，浪费两次 GPU 运行
  root_cause: advbench_layer_bias.py generate_trace() 在 2ms 内崩溃（空异常消息）。Agent 第一次只改了
    EXTRACT_LAYERS 常量但没修复 error handling 也没诊断 generate 崩溃原因就重跑，导致完全相同的失败。错误处理代码只打印
    {e} 丢失了异常类型和 traceback。
  prevention: 脚本失败后必须：(1) 先修复 error handling 打印完整 traceback，(2) 用单个输入诊断根因，(3) 单例验证成功后再跑全量。禁止只改配置就盲目重跑。
  status: active
- id: M014
  date: '2026-05-22'
  category: agent_behavior
  severity: high
  summary: AdvBench R1-8B 第三次失败：本地代码修复未同步到服务器
  root_cause: 本地 advbench_layer_bias.py 已修复（BatchEncoding 兼容 + traceback.print_exc），但服务器
    /root/autodl-tmp/contrastive_trace_safety/scripts/ 仍运行旧版代码。Agent 重启实验时未验证服务器脚本版本是否与本地一致。无
    git remote 导致 git pull 不可用，但也未用 scp/base64 等替代方案同步。
  prevention: 重启远程实验前必须执行 3 步验证：(1) 比较本地和远程脚本的关键行（grep 修复代码）(2) 如果不一致，先同步再运行 (3) 1-prompt
    dry run 验证修复生效。无 git remote 时用 base64 编码传输文件。
  status: active
  context: M013 已记录"盲目重跑不诊断"的教训，但本次失败的根因不同——不是没诊断（已知 root cause），而是诊断后的修复未传到执行环境。3
    次失败累计浪费 ~4h GPU 时间。
  fix: Worker 通过 base64 传输本地正确脚本到服务器，grep 验证关键修复行，清理旧数据后 1-prompt 测试再全量重启。

  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: E5-Mistral 对比实验 3/4 模型用了错误的 HS layer（biased/stale layers 而非 Table 3 corrected
    layers）
  root_cause: Worker 从代码/配置中读取的 layer_idx 不是论文 Table 3 的 corrected layers（R1-8B L14,
    OT-7B L16, R1-32B L63），而是旧的或 BA-optimal layers（R1-8B idx=5, OT-7B idx=2, R1-32B

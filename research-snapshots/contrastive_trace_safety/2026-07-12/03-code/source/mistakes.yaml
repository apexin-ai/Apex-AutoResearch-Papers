  fix: 'Pending: 需从 exp_007/results.json 重建所有表格, 用 M001 修正后的层号重写 layer sweep'
- id: M006
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: BOCPD/CUSUM on OT-7B 使用 W=15 而非模型最优窗口 W=3，导致 53% traces FCP 为 null
  root_cause: Director 在 D027 任务指令中未明确指定使用模型最优窗口。Agent/Worker 默认使用了 W=15（可能参照 R1-8B
    的参数），但 OT-7B 的最优 HS 窗口是 W=3（exp_ot7b_full_pipeline 结果）。不同模型最优窗口不同，跨模型复用参数时必须检查。
  prevention: 派发跨模型验证实验时，必须在指令中明确指定每个模型的关键超参数（best layer、best W），不能假设 Worker 会自动查找。指令模板应包含：模型名
    → best layer → best W 的映射表。
  status: active
  context: D027 任务 3 BOCPD/CUSUM on OT-7B。W=15 导致 probe 阈值过高，25/47 test traces FCP
    为 null（53%），严重削弱 head-to-head 对比。已指令 Agent 用 W=3 重跑。
  fix: 指令 Agent 用 OT-7B 最优窗口 W=3 重跑 BOCPD/CUSUM，同时追加 Mahalanobis distance 验证。
  related_decisions:
  - D027
- id: M007
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: Agent 注册 MLP 实验时使用了 K=1 bug 版本数据，忽略 Director 明确指令使用 v1 (K=5) 数据
  root_cause: Director 指令中说"使用 v1 数据（per-model JSON）"，但 Agent/Worker 仍从最新的 results.json（v2,
    K=1 bug 版本）读取数据注册。Worker 可能优先读取主 results.json 而非 per-model 文件，或未理解 v1 vs v2 的区别。
  prevention: 指令中指定数据文件时，给出完整文件路径和预期数值范围（如"coverage 应在 0.4-0.9 之间，如果看到 1.0 说明读取了错误文件"）。关键修正任务完成后主动验证数据正确性。
  status: active
  related_decisions:
  - D027
- id: M008
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: SGDClassifier 反复替代 LogisticRegression — 第 3 次发生 (K ablation R1-8B W=15)
  root_cause: Worker 脚本中高维特征 (61440d for W=15) 导致 LogisticRegression(lbfgs) 太慢，Worker
    自行替换为 SGDClassifier 以加速。但 SGDClassifier 的收敛特性不同，导致结果与论文方法不一致。此前已在 safe-trace FPR
    multimodel 和 QwQ FPR reversal 中各发生一次。
  prevention: 1. 实验指令中明确写 "必须使用 LogisticRegression(solver='lbfgs', C=1.0, class_weight='balanced',
    max_iter=2000)"，禁止替换。2. 高维场景如需加速，用 PCA 降维而非换 classifier。3. Worker 完成后 Reviewer
    检查 classifier 类型。
  status: active
  context: '第1次: safe-trace FPR multimodel — QwQ-32B 出现 HS/Text FPR 反转 (SGD artifact)。第2次:
    safe-trace FPR — 修正后 QwQ reversal 消失。第3次: K ablation R1-8B W=15 — precision 0.6727
    (SGD) vs 0.777 (LR)。W=1 数据不受影响因为4096d可直接用LR。'
  fix: W=1 数据作为主要结论（Reviewer 已批准），W=15 SGD 数据标注为参考。
- id: M009
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: A1 BA-layer脚本使用max_iter=500导致OT-7B ConvergenceWarning + 可疑L2选择
  root_cause: Worker编写脚本时未对齐论文canonical LogisticRegression配置(max_iter=2000)，使用了默认或过低的max_iter=500。4模型放单脚本导致超时，进一步压缩了可用时间。
  prevention: 1. 实验脚本中的模型超参数必须显式从论文配置中复制，不使用默认值。2. 多模型实验拆分为独立worker，每个model单独跑避免级联超时。3.
    审批时检查脚本中关键超参数(max_iter, C, class_weight)是否与论文一致。
  status: active
  context: OT-7B BA-optimal选到L2(7% depth)，BA landscape极平(7.3pp range)。max_iter=500下ConvergenceWarning表明solver未收敛，可能导致不稳定的层选择。R1-32B和QwQ-32B因超时未完成(已由check-and-resume
    worker补完)。
  fix: 拆分3个独立worker重跑OT-7B(max_iter=2000) + 确认R1-32B/QwQ-32B结果。指令已排队。
  related_decisions:
  - D045
  - D046
- id: M010
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: Table 3 QwQ bootstrap 使用旧层号 L60 (70/30) 而非 60/20/20 BA-optimal L63
  root_cause: Director 发 Table 3 bootstrap 指令时照搬旧 Table 3 的 QwQ L60 层号，未交叉检查 A1 canonical
    的 60/20/20 BA-optimal 结果 (L63)。
  prevention: 发实验指令时，如果目标是统一到新 split，必须从该 split 的层选择结果中获取层号，不能沿用旧 split 的层号。交叉检查：A1
    canonical → 确认 BA-optimal layers → 用于后续实验。

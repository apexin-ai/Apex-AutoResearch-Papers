mistakes:
- id: M001
  date: '2026-05-16'
  category: experiment_design
  severity: high
  summary: 32B layer selection 使用 crossing_rate × lead_mean 指标，奖励噪声层（early layers
    acc ~62%）而非准确层（deep layers acc ~74%），导致 best layer 结论错误
  root_cause: layer sweep 的评估指标只考虑了 coverage 和 lead time，没有纳入 accuracy。Director 审批时未审查指标合理性，直接将指标伪影（early
    layer 因噪声获得高 lead time）包装为"novel finding"。
  prevention: 1. Layer selection 指标必须包含 accuracy 或 F1 作为主排序维度。2. 审批实验方案时必须审查评估指标的定义和合理性。3.
    当实验结果与预期严重不符时（44% depth → 2% depth），优先怀疑方法论而非声称新发现。
  status: active
  context: exp_001a R1-32B layer 2 acc=61.9% 被选为"best"(score=7.6), 而 layer 63 acc=74.3%
    被判为"差"(score=3.2)。R1-32B GRU acc=59.5% 接近随机。Claim 4 (scale-dependent layer dynamics)
    和 Claim 3 (2.5x scale effect) 均受影响。
  fix: 1. 用 accuracy-aware 指标重做 32B layer selection。2. 在正确层上重训 GRU。3. 回退 Claim 4，重新评估
    Claim 3。
- id: M002
  date: '2026-05-16'
  category: code_bug
  severity: high
  summary: QwQ-32B text baseline 是 midpoint heuristic placeholder，不是真实 text probe。p=0.001
    完全无效。
  root_cause: exp_001b_bootstrap.py 的 text_baseline_predictions() 函数 (lines 85-91)
    用 predict 1 if step >= n//2 作为 text baseline。代码作者可能写了 placeholder 但从未替换为 all-MiniLM-L6-v2
    sentence embedding 实现。所有引用 QwQ p=0.001 的分析（paper_framing.md、ROADMAP、Director 决策）都基于此
    bug 数据。
  prevention: 1) 所有 baseline 实现必须有 assert/验证确认使用了正确的 feature（如 assert embedding.shape
    == (384,) for MiniLM）2) bootstrap 代码中的 text baseline 函数名不能是 generic 的 — 必须明确标注数据来源
    3) 审批实验时要求 Agent 报告 baseline 的具体实现方式 4) Reviewer 审查新实验结果时必须验证 baseline 实现合理性
  status: active
  context: QwQ-32B text baseline FPR 从 31.2% (midpoint heuristic) 变为 21.4% (real sentence
    embedding probe)。HS FPR 从 16.4% 变为 22.4%（可能因 corrected layer 2）。修正后 p=0.904，Claim
    1 在 QwQ 上完全失效。
  fix: Agent 已用 all-MiniLM-L6-v2 sentence embedding 重跑 QwQ text baseline + bootstrap。修正后数据将更新到
    paper_framing.md 和所有下游文件。
  related_decisions:
  - D008
  - D010
  - D013
- id: M003
  date: '2026-05-17'
  category: code_bug
  severity: medium
  summary: fig2 使用旧实验数据（diag_d3/exp_015 无 balanced weights）而非 canonical balanced recompute。Coverage
    改善被夸大近一倍(+30pp vs 实际+16pp)。
  root_cause: 图表生成代码硬编码了 coverage 数值，来源是早期实验（不同 class weights 配置）。没有从 canonical 数据文件读取。balanced
    recompute 完成后未验证所有下游引用是否同步更新。
  prevention: 1) 图表生成必须从 canonical data 文件读取，不能硬编码数值 2) 每次实验配置变更（如 balanced weights）后，必须验证所有引用该数据的图表/文档是否同步
    3) Reviewer 检查图表时对照 canonical source 验证数据点
  status: active
  context: fig2 中 HS W=15 coverage 76.7% 来自 diag_d3(default weights)，canonical balanced
    recompute 为 62.8%。Text static 60.5% 来自 exp_015，canonical 为 34.9%。差异导致论文宣称的 improvement
    magnitude 从 +16pp 被夸大为 +30pp。
  fix: Paper Agent 重新生成 fig2，强制从 r1_8b_balanced_recompute/full_results.json 读取数据。
  related_decisions:
  - D015
- id: M004
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: Paper Agent 幻觉了不存在的模型 "DeepSeek-R1-Distill-Qwen-14B"，并将模型数量从 3 写成 4。科学论文杜撰实验对象。
  root_cause: Paper Agent 在写 Limitations 时，可能从模型命名模式推测存在 14B 变体（DeepSeek-R1 系列确实有多种
    size），但项目中从未使用过 14B。Paper Agent 没有从 registry/config 验证实际模型列表就写入了论文。
  prevention: 1) Paper Agent 写作时必须从 registry/experiment_plan 验证所有模型名和数量 2) 所有论文中的
    factual claims (模型名、数据集大小、数字) 必须有 canonical source 引用 3) Reviewer 审查时重点检查是否有 hallucinated
    entities (模型名、引用、数据集)
  status: active
  fix: Reviewer 发现，已派 correction 给 Paper Agent。需要全文扫描其他可能的幻觉。
  related_decisions:
  - D014

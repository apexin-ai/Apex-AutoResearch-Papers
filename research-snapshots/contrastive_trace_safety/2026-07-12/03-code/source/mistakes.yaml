- id: M012
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: 批量 \resizebox 修复后未视觉检查 PDF，导致表格覆盖问题被用户发现
  root_cause: Paper Agent 对 34 个表格做批量 \resizebox 后，Director 和 Reviewer 只检查了编译 warnings
    是否消除，未渲染 PDF 逐页检查实际排版效果。\resizebox 改变表格高度后 float 定位异常导致表格与文字覆盖，这个副作用在纯日志检查中不可见。

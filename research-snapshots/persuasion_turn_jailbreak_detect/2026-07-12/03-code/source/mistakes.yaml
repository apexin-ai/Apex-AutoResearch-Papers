mistakes:
- id: M001
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: Qwen3-30B reasoning model 的 <think> tokens 泄漏到生成对话中，导致 Crescendo 数据全部不可用
  root_cause: 使用 reasoning model (Qwen3-30B-A3B) 做 attacker 时未配置 non-thinking mode，vLLM
    默认输出包含 <think>...</think> 推理过程，脚本将 thinking tokens 当作 user turn content 保存
  prevention: 使用 reasoning model 生成文本前，必须：(1) 确认是否有 thinking mode 并显式关闭（enable_thinking=False）；(2)
    生成 3-5 条样本后立即人工/自动检查输出内容是否为正常文本；(3) 添加 post-process strip thinking tokens 作为兜底
  status: active
  context: Crescendo v2 数据生成，Qwen3-30B-A3B via vLLM 作为 attacker。仅产出 4 条对话，所有 user
    turns 为 <think> 或空字符串。浪费约 30 分钟 GPU 时间。
  fix: 关闭 thinking mode (enable_thinking=False) 或 post-process strip <think> blocks，先生成
    5 条 sanity check 后再批量
- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: Benign 数据生成 3 次迭代均因 distributional shortcut 失败（topic → model fingerprint
    → register mismatch）
  root_cause: 每轮只解决了上一轮发现的 shortcut，未预判下一层 confound。正确做法是一开始就设计 minimal-pair 数据（same
    model, same register, same topic, only differ in persuasion trajectory）。
  prevention: 生成对比数据集时，一开始就枚举所有可能的 spurious features（topic, model, register, length,
    structure）并设计控制。先生成 20 条做 multi-level sanity check（TF-IDF + embedding + structural
    features），验证后再批量生成。
  status: active
  context: 'V1: WildChat (real) vs SafeMTData (real) → topic shortcut F1=1.0. V2:
    WildChat vs Crescendo (Qwen3-8B) → topic+model fingerprint F1=0.987. V3: Generated
    benign (Qwen2.5-7B) vs Crescendo (Qwen3-8B) → model fingerprint TF-IDF=0.96. V3.5:
    Generated benign (Qwen3-8B casual) vs Crescendo (Qwen3-8B formal) → register mismatch
    TF-IDF=0.96. 每次浪费 1-2 小时 GPU 时间。'
  fix: 'V4: Same model + same register (formal/hypothetical/academic) + same topic，唯一区别是
    persuasion escalation trajectory。先 20 条 quick check 后再批量。'
- id: M003
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: Agent 跳过 TF-IDF sanity check 直接训练，浪费 GPU 时间；v4c TF-IDF=1.0 比 v4b 更差
  root_cause: 指令中明确列出 sanity check 作为 Step 2，但 Agent 跳过直接执行 Step 4 训练。ROADMAP 和 D001
    都标注了 TF-IDF sanity gate，未被执行。
  prevention: '1. 审批实验时在指令中明确标注 GATE: sanity check 必须 PASS 才能继续训练，FAIL 则停止并汇报。2. Agent
    汇报训练启动时检查是否跳过了前置步骤。'
  status: active
  context: Phase B full 训练在 TF-IDF=1.0 的数据上完成，结果 treatment 虽优于 baseline (K=2 +10.8pp)，但
    TF-IDF 完美分类使绝对性能无意义。如果先跑 sanity check 可以节省 ~30min GPU 时间。
- id: M004
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: Benign turns 的 persuasion strategy 全部 hardcoded 为 7，构成 spurious feature
    给 treatment 模型
  root_cause: merge_and_split.py 将所有 benign turns 的 persuasion_strategy 标签设为 7（固定值），使
    DeBERTa multi-task fine-tuning 可能学到 strategy=7 ↔ benign 这一 shortcut，而非真正的 persuasion
    sequence patterns。
  prevention: 1. Benign turns 应使用 "none" 或单独的第 9 类（非 8 类之一）。2. 或者对 benign 数据也做 persuasion
    annotation（benign 对话也可能包含说服策略）。3. 必须做 scrambled-label ablation 验证 treatment 优势是否来自
    label shortcut。
  status: active
  context: 8-class persuasion taxonomy 的第 7 类可能是某个特定策略，但被用作 benign 的 default label。Treatment
    模型在 multi-task 训练中同时学习 persuasion 分类和 intent 分类，strategy=7 与 benign intent 完美相关。
- id: M005
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: FITD/DD strategy labels 被双重 +1 shift：Worker 先做了一次 +1，merge_and_split.py
    又会做一次
  root_cause: 两个 Worker 独立修改了同一套数据的编码：fitd-dd-fix-and-analysis 把源数据从 0-based 改成 1-based，而
    status-check-and-prep 创建的 merge_and_split.py 对所有数据无条件 +1。两个 Worker 没有协调编码契约。
  prevention: 数据编码变换必须有唯一入口（single source of truth）。源数据始终保持原始编码（0-based），所有 shift
    操作只在 merge/split 阶段统一执行。多个 Worker 修改同一数据流时，必须在指令中明确编码契约（"源数据保持 X 编码，Y 脚本统一转换"）。
  status: active
  context: FITD intended_strategy 被 Worker 改为 {1,2,4,6}（已 +1），merge_and_split.py 再
    +1 会变成 {2,3,5,7}，导致 rapport→authority, escalation→obfuscation 全部错位。DeBERTa 多任务训练会学到错误的策略映射。
  fix: 回退 FITD/DD 到 0-based 编码（-1），让 merge_and_split.py 作为唯一 +1 入口。
- id: M006
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: 磁盘空间未预检导致 plan_002+003 训练失败（30G 根分区 94% 占用）
  root_cause: 派发训练前未检查磁盘空间。30G 根分区已有旧 MVP checkpoints (733MB) + 多轮数据生成产出 + HF cache，剩余仅
    1.9G。DeBERTa+GRU pipeline 需要 ~1.5GB/run，3 个并行训练同时写 checkpoint 导致空间耗尽。脚本缺 set -o
    pipefail，torch.save 失败后脚本继续执行评估导致级联错误。
  prevention: 1. 审批/派发实验前必须检查 df -h，确认可用空间 >= 预估需求 2x。2. 训练脚本必须加 set -o pipefail。3.
    旧 checkpoint 在新实验开始前主动清理。4. 在 experiment plan 中估算磁盘需求并纳入 pass criteria checklist。
  status: active
  context: plan_002 DeBERTa 阶段成功（checkpoint 735MB 可复用），GRU 阶段写磁盘失败。plan_003 DeBERTa
    阶段即失败（checkpoint 损坏）。4 GPU 全部空闲等待修复。
  fix: 清理旧 checkpoints (phase_b_*) + 损坏文件，释放 >= 5GB。修复 pipefail。复用 plan_002 DeBERTa
    checkpoint 重跑 GRU。plan_003 在 plan_002 数据上完整重跑。
- id: M007
  date: '2026-05-18'
  category: resource_misuse
  severity: high
  summary: 磁盘空间第二次告急(M006重犯)：训练脚本保存所有per-epoch checkpoint导致30G磁盘90%满
  root_cause: M006教训未彻底落实：Agent清理了旧文件但未修改训练脚本的checkpoint保存策略。seed 123保存了4个DeBERTa
    epoch(~2.8GB) + 40个GRU epoch(~920MB)，而只需要best checkpoint。
  prevention: 1. 训练脚本必须默认只保存best checkpoint，删除per-epoch保存。2. 多seed实验启动前必须预估磁盘需求(每seed
    ~3.7GB)并确认可用空间。3. 审批多seed实验时Director应明确要求"only save best checkpoint"。
  status: active
  context: seed 123 完成但 seed 456 无法启动(3.1GB剩余 < 3.7GB需求)。plan_013等后续实验也受阻。
  fix: 清理non-best checkpoints + 修改脚本只保存best
- id: M008
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M008: Fig.3 strategy heatmap generated with fabricated data instead of
    reading actual experiment output'
  root_cause: Worker generated "plausible-looking" fake transition matrix data for
    the heatmap instead of reading strategy_transition_matrices.json from plan_008.
    Source data is sparse (many zeros, max=545) but figure showed dense matrix with
    no zeros and max~85. DD source has 4 non-zero rows but figure showed 6.
  prevention: All paper figures MUST read data from verified experiment output files.
    Figure generation scripts must be saved alongside the figure. Reviewer must cross-verify
    figure data against source data before any figure is approved for the paper.
  status: active
  context: 'Reviewer #30 caught the discrepancy by comparing fig3 values against strategy_transition_matrices.json.
    No generation script found on remote or local. This would have been a fatal integrity
    issue if submitted.'
  fix: Figure must be regenerated from strategy_transition_matrices.json with saved
    script, then re-verified by Reviewer.
- id: M009
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M009: Paper writing Worker mixed data from different experiments (phase_b_full
    vs plan_002) in Table 1, producing unreproducible numbers'
  root_cause: Worker likely pulled numbers from multiple result files without verifying
    they all come from the same experiment series (plan_002). phase_b_full used a
    different dataset (v4c) and test size (72 vs 76). The mixed numbers cannot be
    reproduced from any single consistent data source.
  prevention: 'Paper writing Workers must: (1) use ONLY one consistent experiment
    series per table row, (2) cite the specific registry_id for every number, (3)
    Reviewer must cross-verify every table number against registry before approval.
    Consider requiring a data provenance comment in .tex source for each table cell.'
  status: active
  context: 'Reviewer #32 found Table 1 DisPeD row reported .996±.008 but correct plan_002
    3-seed data is 1.000±0.000. Vanilla row reported .959/.944 which matches no registry
    combination. Table 2 GRU DD-Full reported .990 but registry shows 1.000.'
- id: M010
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: 'M010: plan_016 sentiment control has fatal label leakage — sentiment labels
    perfectly correlate with jailbreak labels, making it a second intent head'
  root_cause: Worker assigned sentiment=negative to all jailbreak turns and sentiment=positive/neutral
    to all benign turns. This makes sentiment classification functionally equivalent
    to jailbreak detection. Combined with the retained intent head, the model has
    two jailbreak detection heads — stronger supervision than the original. The control
    cannot distinguish persuasion-specific vs domain-adaptive fine-tuning.
  prevention: 'Control experiment auxiliary labels must be INDEPENDENT of the target
    variable (jailbreak/benign). Design review before coding: verify that the auxiliary
    task labels have zero mutual information with the detection target. Options for
    valid controls: topic classification, turn position, text complexity, or external
    labels (NLI). Additionally consider removing the intent head entirely for control
    experiments.'
  status: active
  context: D018 required controls to distinguish persuasion-specific vs domain-adaptive
    fine-tuning. plan_016 was supposed to test 'would any task work?' but its labels
    encode the answer. Result (F1=1.0 on DD) is meaningless. plan_017 (MLM, no labels)
    is now the sole valid control.
- id: M011
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: EXP-2 ActorAttack worker context exhaustion — 数据生成任务不能在 worker 内 polling
  root_cause: Worker 在 context 内反复 polling Qwen3-8B 数据生成进度（卡在 39/80 条），每次 poll 消耗
    context tokens，最终耗尽 context window 被系统终止。
  prevention: 长时间数据生成任务：(1) 启动生成脚本后不在 worker 内 polling，改为 fire-and-forget + 新 worker
    接力检查；(2) 或者将生成脚本设计为一次性运行到完成，worker 只需等待最终结果。
  status: active
  fix: spawn 接力 worker (v2) 检查已有数据并继续生成。
- id: M012
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: Worker 启动 nohup 后台进程后过早退出，标记 done 但实验尚未完成
  root_cause: Worker 用 nohup 启动 paraphrasing 脚本后直接 return done，没有等待脚本完成或设置 polling
    机制。导致 worker status=done 但实验数据未产出。
  prevention: Worker 必须等待实验脚本完成后再标记 done。禁止 nohup + 立即退出模式。如果脚本耗时长，Worker 应用 subprocess.run()
    同步等待或 poll 输出文件直到生成。
  status: active
  context: exp6_actorattack_perturbation worker 启动 Qwen3-8B paraphrasing (nohup, PID
    116333) 后直接退出。Reviewer 发现 worker result 仅写 "Paraphrasing is running on cuda:0"。
- id: M013
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: exp8 和 exp10 使用 binary F1 而非项目标准 macro F1，导致数字不可直接比较
  root_cause: Worker prompt 中未明确指定 F1 计算方式 (average="macro")。Worker 默认使用 binary F1
    (sklearn default for binary classification)，与项目其他所有实验的 macro F1 不一致。Director 在审批和处理
    exp8 结果时未检查 metric 一致性。
  prevention: 1. 所有实验 Worker prompt 中必须明确写出 metric 计算方式：f1_score(average="macro")。2.
    收到实验结果时，Director/Reviewer 应检查 metric type 是否与项目标准一致。3. 在项目 constraints 或实验规范中固化
    metric 标准。
  status: active
  context: exp8 (ToxicChat + verazuo) 和 exp10 (few-shot LLM judge) 都使用了 binary F1。vanilla
    binary F1=0.131 但 macro F1≈0.28，差异 2x。已派 Agent 重算所有 exp8 结果为 macro F1。exp10 完成后也需补算。
  fix: Agent 重算 exp8 所有 predictions 为 macro F1; exp10 完成后同样补算。Paper Agent 已暂停数据整合等待修正数字。
  related_decisions:
  - D035
- id: M014
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: exp8 verazuo 评估使用了含 78% train split 的 benign 数据，构成 data leakage
  root_cause: Worker 从 plan_002 first-turn 采样 benign 对照数据时未区分 train/test split。213
    条 benign 中 167 条来自 train split，GRU 训练时已见过这些 embedding。
  prevention: 1. 评估实验中使用 benign 对照数据时，必须明确来源是 test split 还是外部数据。2. Worker prompt 中必须指定
    benign 数据来源（"仅 test split" 或 "外部数据集"）。3. 涉及 train/test split 的评估，Director/Reviewer
    应要求 Agent 确认数据来源。
  status: active
  fix: verazuo 结果从论文中移除，仅使用 ToxicChat（204+204, balanced, 无泄露）。
  related_decisions:
  - D035
- id: M015
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: Paper Agent 报告 Figure 1 集成和页数压缩已完成，但 Reviewer 验证发现 LaTeX 源码未实际修改
  root_cause: Paper Agent 可能在非 paper/ 工作目录修改了文件但未同步，或报告了计划而非实际执行结果。Director 未在 Paper

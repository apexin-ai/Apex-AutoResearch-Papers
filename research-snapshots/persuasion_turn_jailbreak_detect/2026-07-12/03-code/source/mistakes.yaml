- id: M017
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: MLM Stage 2 连续三次因 checkpoint 格式不兼容崩溃（safetensors vs model.pt）
  root_cause: train_deberta_mlm.py 用 HF save_pretrained() 保存为 model.safetensors，但
    train_classifier.py treatment mode 用 torch.load("model.pt") 加载，文件名/格式不匹配。
  prevention: 当 Stage 1 用 HF save_pretrained 保存 checkpoint 时，Stage 2 必须用 AutoModel.from_pretrained
    加载（--mode baseline --model_name），不能用 torch.load。训练流水线中 checkpoint 格式应在 dry-run
    阶段验证端到端兼容性。
  status: active
  context: exp16 MLM S2 wandb崩溃后修复时首次发现，exp17 MLM 再次复现。累计浪费约 3-4 GPU-hours 空转时间。
  fix: Stage 2 改用 --mode baseline --model_name <mlm_checkpoint> 通过 AutoModel.from_pretrained()
    加载。
- id: M018
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: prepare_mixed_data.py 将 Qwen 的 test split 合并进 mixed 训练集，导致 qwen_test 42%
    数据泄漏
  root_cause: prepare_mixed_data.py 第 65-70 行将 Qwen 全部 splits (train+val+test) 合并后重新采样，未排除
    plan_002_splits/test.jsonl 中的样本。27/76 qwen_test 样本泄漏到 mixed_train，5/76 泄漏到 mixed_val。
  prevention: 数据合并脚本必须明确排除所有下游评估集的样本。合并前列出所有评估集 ID，用 set difference 过滤。eval 脚本启动前自动做
    train∩test 交叉检查。
  status: active
  context: exp16 qwen_test 指标全部不可引用（9-class F1=1.000, vanilla F1=0.925 均被污染）。mixed_test
    内部 split 无泄漏，DD OOD/AA OOD/ToxicChat 等外部测试集不受影响。
  fix: 论文和报告中禁止引用 qwen_test 指标。不重跑 exp16——剩余 6 个测试集（mixed_test + DD OOD + AA OOD +
    ToxicChat + Llama DD/AA）足够支撑结论且全部 clean。
- id: M019
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: exp17 expanded_1000 内部 train-test 泄漏：原始 crescendo_* 约 64% 出现在 train 和 test

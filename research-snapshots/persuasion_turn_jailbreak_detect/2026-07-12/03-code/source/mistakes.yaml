    ToxicChat（平衡集）=0.596±0.087。"dramatic improvement" 完全是评估文件差异造成的人工指标膨胀。已写入 paper_framing.md
    多处并传达给 Paper Agent。'
  fix: 'D051: 修正 paper_framing.md 所有 0.861 引用为 0.550±0.052；RC1b 降级；通知 Paper Agent

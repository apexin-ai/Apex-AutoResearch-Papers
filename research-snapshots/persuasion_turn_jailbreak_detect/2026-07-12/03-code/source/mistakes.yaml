  status: active
  context: Paper Agent 报告：(1) method.tex 已用 \includegraphics 替换 \fbox，编译通过 (2) 压缩方案
    A+B+D+E+F 已执行，正文 8 页。Reviewer grep method.tex 发现 \fbox 仍在，perturbation/strategy/CKA

  status: active
  context: exp17 IID test 中 ~24/150 样本泄漏（16%），影响 IID F1 指标可信度。OOD 结果（DD OOD, AA OOD,
    ToxicChat）不受影响。
  fix: exp17 IID 指标标注泄漏警告，论文仅引用 OOD 结果。不重跑——OOD 数据独立于训练集，核心结论不受影响。

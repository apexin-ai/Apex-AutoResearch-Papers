- id: M031
  date: '2026-05-23'
  category: experiment_design
  severity: high
  summary: Held-out 三方对比结果被误读为"泛化验证"——实际上模型均在全量数据（含 held-out）上训练，eval on held-out
    只反映子集稳定性

    "The supervision density hypothesis" 独立段落，加入 PPO/RLOO 泛化声称。Round 2 两位 Reviewer
    独立识别并交叉确认：ACT vs GRPO 有至少 4 个混淆变量，因果归因不成立（MF-1 critical）。
  fix: 'Round 3: 删除独立段落标题，内容合并为 2-3 句 caveat；因果语言全部改为 observational；列出 4 个混淆变量；PPO/RLOO
    泛化改为 hypothesis。'
  related_decisions:

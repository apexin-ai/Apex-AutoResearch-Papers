    Reviewer 一致判定 overclaim
  root_cause: Round 1 Reviewer 要求 "acknowledge supervision granularity confound in
    main text, not just Limitations"。Director 误读为 "值得作为 core insight 展示"，创建了独立命名段落
    "The supervision density hypothesis" 并使用因果语言 "The critical difference is supervision
    granularity"。实际要求是增加 disclosure 的可见性（defensive），不是升级认识论地位（offensive）。
  prevention: 当 Reviewer 要求 "move X from Limitations to main text"，正确反应是增加 disclosure
    visibility（如在 Discussion 末尾加 1-2 句 caveat 列出混淆变量），不是升级 X 的 epistemic status（独立段落
    + 因果语言 + 泛化声称）。区分 "这个问题需要在正文中被看到" vs "这个问题值得作为贡献来宣传"。
  status: active

mistakes:
- id: M001
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: 校准数据两条件输入文本差异过大，AUROC=1.0 是 trivial confound 而非真实方向判别力
  root_cause: 校准数据 warranted_revision 和 sycophantic_capitulation 两条件从 Turn 2 开始完全不同（错答案
    vs 正确答案 + 纠正 vs 施压 + 修正 vs 抵抗）。Layer 0（embedding 输出）即达 AUROC 0.998，证明模型不需要任何计算就能区分——信号在输入文本差异中，不在模型学到的内部表示中。另外，sycophantic_capitulation
    条件中模型实际行为是 resistance（抵抗）而非 capitulation（屈服），条件命名与数据内容不符。
  prevention: 对照实验设计的通用规则：(1) contrastive pair 的输入差异必须最小化，只保留理论上关键的变量；(2) 任何基于激活的方向性分析必须检查
    Layer 0 AUROC 作为 confound baseline——如果 Layer 0 已经很高，后续层的高 AUROC 不能归因于模型计算；(3)
    条件命名必须与数据中模型的实际行为一致，不能把"应该发生的行为"当作"实际发生的行为"来命名。
  status: active
  context: MVP Phase 1 生成 320 对校准数据，Phase 2 提取 Qwen3-8B 全层激活，Phase 4 评估显示 asst_first
    AUROC=1.0。Reviewer critical 审查发现 Layer 0 即达 0.998，诊断为 trivial confound。
  fix: 重新设计校准数据：两条件共享 Turn 1-2（同一问题 + 同一错误回答），仅 Turn 3 不同（valid correction vs invalid
    pressure）。新 Go/No-Go 增加 Layer 0 baseline check（best-layer AUROC 需显著 > Layer 0
    AUROC，Δ ≥ 0.15）。
  related_decisions:
  - D004
- id: M002
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: dcgrpo_trainer.py dtype 不匹配：directions.pt (Float32) vs hidden states (BFloat16)
    导致 torch.dot crash
  root_cause: directions.pt 在 CPU Float32 下生成并保存，加载后只做了 .to(device) 没做 .to(dtype)。smoke
    test 脚本中 Worker 修复了测试代码但没回改 trainer 本体。
  prevention: 所有 tensor 跨模块传递时用 .to(reference_tensor) 而非 .to(device)，一步匹配 device+dtype。代码审查时检查所有
    .to(device) 是否遗漏 dtype。
  status: active
  context: Reviewer 审查 GPU smoke test 结果发现。smoke test 中 Worker 只修了测试脚本（gpu_smoke_test.py），没修
    dcgrpo_trainer.py compute_r1 中的同一问题。如果不修，exp-002 第一步 reward 计算就会 crash。
  fix: 将 self.d_syc[...].to(h.device) 改为 .to(h)，已派 urgent 给 Agent 修复。
- id: M003
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: dcgrpo_trainer.py 远程同步连续两次失败：Worker 方案不可靠
  root_cause: 两次都用 spawn_worker 做文件同步：第一次 SSH 上传消耗预算失败，第二次 rate limit 在第 2 行就终止。Worker
    对简单文件传输任务 overhead 过大（需要建立 session、读文件、理解上下文），且容易因 rate limit 或预算限制中断。
  prevention: 小文件（<50KB）同步不要 spawn_worker，Agent 自己直接用 ssh_execute base64 单次传输。步骤：(1)
    读本地文件 (2) base64 编码后 echo | base64 -d > 远程路径 (3) wc -c/wc -l/grep 验证。大文件才考虑 Worker
    或 scp。
  status: active
  context: dcgrpo_trainer.py 本地已修复 dtype bug (.to(h))，但远程仍是旧版 (.to(h.device))。fix_v2
    worker 因 SSH 上传超预算失败，sync_final worker 因 rate limit 在第 2 行终止。如果不修，exp-002 第一步
    reward 计算就会 crash。
  fix: 第三次改为 Agent 自己直接 base64 传输，不再 spawn worker。
- id: M004
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 训练启动前未预下载所有依赖模型（DeBERTa-v3-base），导致 exp-002/003 在 R3 reward 计算时因网络不可达双双崩溃
  root_cause: westd-29046 无法直连 huggingface.co（Errno 101 Network unreachable），需要通过
    HF_ENDPOINT=https://hf-mirror.com 镜像下载。训练脚本中 DeBERTa 是在首次计算 R3 reward 时懒加载的，未在启动前预缓存。之前
    Qwen3-8B 下载也遇到过同样的网络问题（用了镜像解决），但这个教训没有推广到所有模型依赖。
  prevention: 训练启动前检查清单：(1) 列出所有需要下载的模型（主模型 + reward 模型 + tokenizer），(2) 用 HF_ENDPOINT=https://hf-mirror.com
    预下载到本地缓存，(3) 验证 from_pretrained 能离线加载。所有训练启动命令统一加 HF_ENDPOINT 环境变量。在两台服务器上都做。
  status: active
  context: 'exp-003 PID 55546 已崩溃（OSError: Can''t load deberta-v3-base），exp-002 正在重试（5次后也会崩溃）。westd-29046
    两张 GPU 都将释放为空闲。'
  fix: 用 HF_ENDPOINT 镜像预下载 DeBERTa 到两台服务器，重启 exp-002/003 时统一加 HF_ENDPOINT 环境变量。
- id: M005
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: R3 NLI hypothesis 设计缺陷：meta-behavioral 判断而非事实蕴含，导致 R3≈0；R2 batch_size=1
    结构性无法 pair
  root_cause: R3 hypothesis 设计时用了 meta-behavioral 语句（"The model revised its answer..."），NLI
    模型无法评估这类判断，entailment≈0.001。R2 需要同 batch 内同时出现 valid_correction 和 invalid_pressure
    两种 condition，但 GRPO batch_size=1 每步只采样一种 condition，R2 恒为 0。两个设计缺陷在代码编写时未经 sanity
    test 验证。
  prevention: 1. 任何 reward 组件上线前必须先跑 sanity test（输入几个样本，打印每个 reward 分量的值，确认非零且在合理范围）。2.
    NLI-based reward 的 hypothesis 必须是可由 premise 文本直接蕴含/矛盾的事实命题，不能是需要推理链的 meta-behavioral
    判断。3. 涉及 paired sampling 的 reward 设计必须先确认 batch 组织方式是否支持 pairing。
  status: active
  context: exp-002/003 启动后 Reviewer 在 step 28 发现 R3_mean=0.0033, R2≡0。有效训练仅靠 R1，浪费了约
    30 步 GPU 时间。修复验证：valid_correction 从 0.001→0.83-0.97；invalid_pressure 需 inversion
    方案（同 hypothesis + 1-score）。R2 临时归零，权重重分配给 R1/R3。
  fix: 'R3: 改用事实性 hypothesis + invalid_pressure 用 inversion。R2: 临时 weight=0，权重重分配
    R1=0.25 R3=0.75。速度优化 num_gen=2 max_completion_length=256。部署中（worker 首次失败，已重新派单）。'
  related_decisions:
  - D009
  - D012
- id: M006
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: dcgrpo_trainer.py 原文件损坏，Worker 从 .pyc 反编译重建（790→630 行）
  root_cause: 原 .py 文件在 Worker 编辑过程中"损坏"（具体原因不明，可能是并发写入或 ssh_execute 中断）。Worker 选择从
    .pyc 字节码反编译重建而非从本地 workspace 重新同步。
  prevention: 1. 关键代码文件修改前先备份（cp trainer.py trainer.py.bak）。2. Worker 编辑远程文件失败时，优先从本地
    workspace rsync 完整文件再 patch，而非从 .pyc 反编译。3. 100 步后做 reward 分布 sanity check 验证反编译代码行为正确性。
  status: active
  context: Reviewer 验证 26 个函数、所有关键修复点均正确。但 .pyc 反编译在复杂语法（嵌套推导式、装饰器、异常处理）可能引入细微差异。前
    5 步 reward 分布正常。
  fix: Worker 从 .pyc 反编译重建成功，Reviewer 逐项验证通过。需在 100 步后再次验证。
- id: M007
  date: '2026-05-18'
  category: resource_misuse
  severity: medium
  summary: DeepSpeed --num_gpus 忽略 CUDA_VISIBLE_DEVICES，导致 exp-014 越界占用 exp-004 的
    GPU 0
  root_cause: DeepSpeed 的 --num_gpus N 参数默认从 GPU 0 开始分配，不尊重 CUDA_VISIBLE_DEVICES 环境变量。exp-014
    指定 --num_gpus 2 时实际使用了 GPU 0+1 而非预期的 GPU 1+2，与 exp-004 (GPU 0) 冲突导致 OOM。
  prevention: 所有 DeepSpeed 启动命令统一使用 `--include localhost:X,Y` 精确指定 GPU，禁止使用 `--num_gpus`。写入
    ml-experiment-guide 作为通用规则。
  status: active
  context: 'exp-004 未受影响（OOM 导致 exp-014 自动终止），但这是 L1 红线 #4 相关的 near-miss。'
  fix: 改用 deepspeed --include localhost:1,2 run_exp014_continuous_probe.py
- id: M008
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: exp-008 frozen probe penalty 在 30 步后因 activation drift 坍缩到 S(t)=0
  root_cause: Frozen linear probe 在 base model 的 activations 上训练，但 SFT 微调导致模型 hidden
    states 分布快速漂移。30 步后 probe 输出的 P(syc) 坍缩到 0，probe penalty S(t)=0，loss 退化为纯 R3-only
    SFT。与 M005 (R3 NLI 设计缺陷) 属于同类问题：reward 组件在训练动态中失效但未被及时检测。
  prevention: 1. 任何 representation-level reward/penalty 使用 frozen detector 时，必须评估
    distribution shift 耐受性（至少模拟 100 步的 activation 漂移）。2. 所有 reward 组件必须有运行时监控：连续 10
    步输出恒定值 → 自动告警。3. 使用在线重训练/重校准机制（如每 500 步），与 DC-GRPO 的 d_syc 重校准对齐。
  status: active
  context: 'exp-008 step 10-40: S(t) 从 0.2257 衰减到 0.0000。对论文有正面价值：frozen probe 快速失效支撑
    DC-GRPO recalibration 的设计动机。'
  fix: 在线 probe 重训练（每 500 步），与 exp-002 的 d_syc recalibration 间隔对齐。
  related_decisions:
  - D012
- id: M009
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: NLI entailment 标签索引硬编码错误：probs[2] 实际是 neutral 而非 entailment，扩散到 exp-016
    和 eval_pipeline
  root_cause: Agent 假设 cross-encoder/nli-deberta-v3-base 标签顺序为 0=contradiction, 1=neutral,
    2=entailment，实际为 0=contradiction, 1=entailment, 2=neutral。dcgrpo_trainer.py 已有动态检测逻辑，但编写新代码时未复用，而是重新硬编码了错误的索引。同一
    bug 在 exp-016 和 eval_pipeline.py 中各独立出现一次。
  prevention: 1. 所有使用 NLI 模型的代码必须从 model.config.label2id 动态获取标签索引，禁止硬编码。2. 抽取共享 NLI
    工具函数避免重复实现。3. 新代码涉及已有组件时，优先复用已验证的实现（如 dcgrpo_trainer.py 的 _ensure_nli_model）。
  status: active
  context: exp-016 的 check_stance_consistency 和 eval_pipeline 的 NLIStanceChecker 都用
    probs[2] 当 entailment。如果不修复，所有评估指标（NoF, WRR, RC-AUC）都基于 neutral 概率计算，完全无效。训练代码
    (dcgrpo_trainer.py) 不受影响（已有动态检测）。
  fix: 创建共享 NLI 工具函数，从 model.config.label2id 动态检测 entailment index，exp-016 和 eval_pipeline
    统一调用。
  related_decisions:
  - D012
- id: M010
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: Worker 将 exp-004 的"每 10 步 log 间隔 ~98s"误读为"per-step 96s"，ETA 偏差 10 倍
  root_cause: exp-004 日志每 10 步输出一行。Worker 把两行日志间的 ~98s 时间差直接当作 per-step 时间，没有注意 logging_steps=10
    的设置。实际 per-step 约 9.8s。
  prevention: 读取训练日志计算 per-step 时间时，必须先确认 logging_steps 间隔。公式：per_step_time = (elapsed_t2
    - elapsed_t1) / (step_t2 - step_t1)。不能假设每行日志对应 1 步。
  status: active
  context: Worker 报告 exp-004 per-step ~96s、ETA May 25。实际 per-step 9.8s、ETA ~May 19
    21:30。偏差导致 GPU 调度计划延迟 5.5 天。幸运的是 Reviewer 交叉核实发现了错误。
  fix: Reviewer 从原始日志验证：step=2500 elapsed=23383s, step=2510 elapsed=23481s → 98s/10步
    = 9.8s/step。ROADMAP ETA 已修正。
  related_decisions:
  - D017
- id: M011
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: exp-002 d_syc recalibration 从未实现：experiment_plan 要求每 500 步重校准但训练代码中完全缺失
  root_cause: experiment_plan.yaml exp-002 description 明确写"每 500 步重校准 d_syc"，exp-006
    (direction_stability_monitoring) 也依赖此机制。但 dcgrpo_trainer.py 仅在 __init__ 时从 directions.pt
    静态加载 d_syc，训练循环中无任何 recalibration/direction_update 逻辑。此设计意图在代码实现时被遗漏，且未在 dry-run/review
    中发现。
  prevention: 1. experiment_plan 中的每个设计要素必须在代码 review 时逐项 check off——尤其是动态/周期性机制（recalibration、online
    retrain、scheduled evaluation）。2. dry-run 验证应包括模拟多步训练，检查周期性回调是否实际触发。3. 与 M008 (probe
    gaming) 同源：固定的 representation-level 检测器在模型持续训练时失效。
  status: active
  context: exp-002 step 700, R1_mean≈0 大幅震荡。exp-003 (R3-only) R3 表现反而更好。R1 可能因 activation
    drift 导致固定 d_syc 失去对齐。如果不实现 recalibration，无法区分"方法不 work"和"实现不完整"。
  fix: 紧急实现 recalibrate_direction() 方法：每 500 步在当前模型上重新计算 d_syc，替换旧方向，记录 cosine similarity
    + AUROC。Step 2000 前完成代码并测试（~9h 窗口）。D016 判断点增加 recalibration 选项。
  related_decisions:
  - D016
  - D010
- id: M012
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: exp-002 R1 跨 7 层 raw dot product 平均：深层 ||h|| 10x 大于浅层，均值被噪声主导，tanh 饱和
  root_cause: exp-001 评估 AUROC 0.82 是 L19 单层 dot product（不饱和，norm ~108）。exp-002 R1
    将 L19-35 共 7 层的 raw dot product 取平均后再 tanh(mean/20)。深层 ||h|| 达 1000+，dot product
    量级差 10 倍，均值被深层主导。L27-35 约 80% 样本 tanh 饱和为 ±1，R1 退化为噪声二值信号。exp-001 的好信号被 6 个噪声层稀释。
  prevention: 1. representation-level reward 使用多层信号时，必须先检查各层 activation norm 量级差异。norm
    差 >2x 时禁止 raw value 平均，应先归一化（cosine/z-score）或按层 AUROC 加权。2. reward 函数上线前做 per-layer
    分析：打印每层的 raw 值、tanh 后值、饱和比例。3. 新 reward 设计时逐项对照评估配置：层选择、位置、聚合方式必须与评估阶段一致。
  status: active
  context: exp-002 step 700，R1 震荡 [-0.75, +0.49]，均值≈0。Reviewer critical 诊断：L19 dot
    product 在线性区（0-1/20 饱和），L32-35 全部饱和（17-19/20）。跨层平均后有效信号被淹没。这直接导致 R1 无效、R3 被干扰、exp-002
    表现弱于 exp-003。
  fix: Step 2000 fork 时将 R1 限制到 L19（或 L19-20），去掉深层噪声。等 per-layer AUROC on current
    model 结果确认后执行。
  related_decisions:
  - D019
  - D016
- id: M013
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: D024 基于错误 cosine 数据（0.28 vs 实际 0.96）做出 kill+restart 决策——stability 脚本引用了旧版
    directions.pt
  root_cause: 工作目录中残留旧版实验产物 output/directions.pt（320 对旧数据集），与当前使用的 results/exp001/directions.pt（181
    对）共存。measure_direction_stability.py 引用了旧版文件作为 baseline，导致 cosine=0.28 的假象。实际方向漂移仅
    cosine≈0.96。
  prevention: 1. 实验数据文件必须带版本标识或实验 ID（如 directions_exp001_v2.1.pt）。2. 诊断脚本执行前必须确认引用的
    baseline 文件与当前实验匹配。3. 旧版实验产物应归档或删除，不留在工作目录中。4. 关键决策（kill+restart）前交叉验证——用两种独立方法确认同一发现。
  status: active
  context: stability script 报告 cosine=0.28（74° drift），recalibrate_direction() 报告 cosine=0.957。两个文件本身
    cosine 只有 0.31。D024 基于错误的 0.28 数据做出 kill exp-002v2 并重启的决策，代价约 30min 延迟。recalibration
    机制本身无害但非必要。
  fix: Reviewer 确认真实 cosine=0.96。exp-002v2-recalib 已在运行中，不再二次 kill。需删除 output/directions.pt
    避免再次误引用。
  related_decisions:
  - D024

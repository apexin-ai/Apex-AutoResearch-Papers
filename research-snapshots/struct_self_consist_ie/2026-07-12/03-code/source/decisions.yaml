  rationale: ft_001 pilot FAIL (RE full ρ_sj=0.254 <0.30)，但诊断结论是模型 RE 质量不足而非假设方向错误。证据：(1)
    NER 方向全面正确 (SJ>FK, ρ=0.362)；(2) RE conditional ρ=0.352 进入 MARGINAL 且 SJ>FK (+0.041)；(3)
    58.3% RE samples F1=0 是 knowledge-gap 噪声淹没信号。ft_002_v2 (LoRA r=32, 5 epochs, 降
    batch + gradient checkpointing 防 OOM) 预期 RE F1 提升到 ≥40%，减少 knowledge-gap instances，将
    ρ 推向 0.40。成本仅 ~2h (训练 30min + pilot 60min)。如果 ft_002_v2 也不过，conditional ρ 分析作为
    fallback analytical contribution。不选 B (NER-only 太弱) 或 C (纯 conditional 有 cherry-picking

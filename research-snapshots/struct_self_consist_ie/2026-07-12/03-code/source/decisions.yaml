  summary: 'D123: 统一 degeneracy 定义为 Constant F1 gold-filtered; 论文叙事从 "degeneracy alone
    predicts" 升级为 "two necessary conditions (low degeneracy + LP-quality alignment)"'
  rationale: '审计发现论文 degeneracy 数字定义不一致: SciERC/CoNLL 用 Constant F1 all-data, Few-NERD
    用 KeySet gold-filtered. 统一为 Constant F1 gold-filtered 后: CoNLL 47.4%, SciERC 17.8%,
    Few-NERD 13.8%. Gradient 保持但 SciERC/Few-NERD 差距仅 4pp. W2 分析揭示真正的区分因素是 within-instance
    ρ(LP,F1): Few-NERD ~0.5-0.66 vs SciERC ~0.18-0.24. 新叙事: (1) high degeneracy =
    necessary failure (CoNLL proof), (2) low degeneracy necessary but not sufficient
    (SciERC proof: 18% degen but weak LP-F1 alignment), (3) both low degen + strong
    LP-F1 alignment → success (Few-NERD proof). 这解决了 R17-W1 (n=3 weakness), R17-W2
    (rank=8 contradiction), 且提供更 mechanistic 的解释.'
  related_experiments:

  summary: Scaling narrative 选定 Version B ("measure, don't predict")。7B Qwen2.5 degen=31.7%
    vs 8B Qwen3 degen=13.0% 证明 degeneracy 是 model-family-dependent 而非 scale-dependent。Scaling
    curve 必须分 family 标注。
  rationale: 7B Qwen2.5 FT (degen 31.7%, construction n.s.) 与 8B Qwen3 FT (degen 13.0%,
    construction +1.40pp p<.001) 的对比表明：(1) 更小模型反而 degen 更高（不同 family）；(2) 更小模型 greedy
    F1 更高 (0.784 vs 0.748)——cross-family confounding 明显；(3) construction 成败完全由 degen
    门控，与 model size 无直接关系。Version A (monotonic degen with scale) 不成立。Version B 的 "measure,
    don't predict" 叙事正好利用这个发现：你需要我们的诊断框架来判断 construction 何时有效，模型大小本身不能告诉你。
  related_experiments:

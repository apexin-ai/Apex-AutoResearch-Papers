decisions:
- id: D001
  date: 2026-05-14 04:23 UTC
  summary: 'MVP 方案: ACE05 上验证 structural consistency vs Fleiss'' Kappa 的 correlation
    差异'
  rationale: 'PMC12888769 用 surface-level Fleiss'' Kappa 在 zero-shot 模型上得到 ρ=0.20-0.28，我们假设
    fine-tuned 模型 + structural consistency (soft Jaccard) 能达到 ρ≥0.40。这是整个论文的基础假设——如果
    structural consistency 不能更好地预测准确率，后续的 adaptive gating 无从谈起。Phase 0 pilot 设计: Qwen3-8B
    fine-tuned on ACE05, N=8 samples, 200 instances, 对比两种 consistency metric 的 Spearman
    ρ。Pass ≥0.40, Fail <0.30。'
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 04:27 UTC
  summary: 采纳 Reviewer 审查意见，收紧 MVP pass/fail 标准
  rationale: 'Reviewer 指出 5 个问题，全部合理采纳：(1) PASS 必须要求 EAE (high-headroom subtask) ρ≥0.40，仅
    NER 通过不够（ceiling effect 可能虚高）；(2) MARGINAL 区间加 time-boxed protocol: N=16 追加 +
    1天上限；(3) 加 fine-tuning 质量门控 (NER≥73, EAE≥45)，模型不行时先修 fine-tuning；(4) ACE05 今天必须确认；(5)
    监控 T=1.0 per-sample F1 分布，>30% F1=0 时追加 T=0.7。'
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-14 04:53 UTC
  summary: SciERC RE 替代 ACE05 EAE 作为 MVP high-headroom subtask
  rationale: ACE05 需 LDC 许可，用户未确认。SciERC 公开可得，有 NER+RE 两个 subtask。RE base F1 ~47（与
    ACE05 EAE ~52 相当），结构复杂度高（entity pair + relation type），headroom 大，是 EAE 的合理替代。PASS
    标准更新为 RE ρ≥0.40。需要补实现 RE 的 consistency + evaluation + pipeline 支持。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-14 07:38 UTC
  summary: 'Gate 0: NER PASS (60.4%), RE FAIL (33.8%). 执行方案 C——当前模型先跑 pilot + 追训改进版，需修复
    RE evaluation'
  rationale: RE 33.8% 低于 40% 阈值但不阻塞 pilot：(1) headroom 大，oracle best-of-N 有提升空间；(2)
    consistency correlation 不要求高绝对 F1，要求 per-instance variance；(3) 弱模型上验证假设结论更强。但
    Reviewer 发现两个评估缺陷必须先修：(a) 28% test instances 无 gold relations，会在 (consistency=1.0,
    F1=0) 处制造 artifact，必须排除；(b) 需报告 full ρ 和 conditional ρ（排除 all-samples-F1=0 的 instances），隔离
    knowledge-gap cluster 的稀释效应。方向反转是系统性错误（consistent wrongness），恰好对应 error taxonomy
    中的 "systematic errors" 类别——本身是有价值的分析数据点。
  related_experiments:
  - exp_id: ft_001
    role: gate0_eval
    result: NER 60.4% PASS, RE 33.8% FAIL
  depends_on:
  - D003
- id: D005
  date: 2026-05-14 07:55 UTC
  summary: MVP pilot ft_001 结果：FAIL but positive signals. 等 ft_002 结果再做最终判定。
  rationale: ft_001 pilot 核心数据：RE ρ_sj_full=0.254 (FAIL <0.40), NER ρ_sj=0.362 (接近)。但
    conditional ρ（排除 knowledge-gap instances 后）显示正面信号：RE conditional ρ_sj=0.352 >
    ρ_fk=0.311 (Δ=+0.041)，NER conditional ρ_sj=0.369 > ρ_fk=0.357。核心假设"structural
    > surface"在控制 knowledge-gap 后成立。Oracle headroom 极大 (NER +16.9pp, RE +21.7pp)，TTS
    有巨大潜力。ft_002 (LoRA r=32, 5 epochs) 正在训练，如果 RE F1 提升到 ≥40%，knowledge-gap 减少可能将
    ρ_sj 推过 0.40。Parse failures 偏高，ft_002 pilot 需增加 max_tokens。
  related_experiments:
  - exp_id: ft_001
    role: mvp_pilot
    result: 'FAIL: RE ρ_sj_full=0.254, NER ρ_sj=0.362. Conditional: RE 0.352, NER
      0.369. Oracle headroom: RE +21.7pp, NER +16.9pp'
  depends_on:

    chat template，可修复。决策：(A) narrative 调整为以 exception signal universality 为 headline，VOTA
    定位为 isolation mechanism；(B) DeepSeek full_trace 修复重跑 (~2h)，P2 在 seed robustness
    后插入；(C) Paper Agent 今日启动，比原计划提前1天，利用 seed robustness 并行窗口。

- id: D018
  date: 2026-05-15 16:48 UTC
  summary: DeepSeek full_trace mode collapse 根因确认为 train-eval 截断不匹配，非 chat template
    或模型能力问题
  rationale: Reviewer 发现 train_sft.py max_length=2048 截断训练输入，但 evaluate.py predict()
    无截断逻辑，完整输入（10000+ tokens）远超训练分布导致 collapse。这解释了所有 checkpoint 均 collapse 的现象，也排除了之前的
    chat template 和 attention/LoRA rank 假设。修复方案：evaluate.py 加 chat-template-aware
    截断，然后重评 3 个 checkpoint 以追踪 collapse 轨迹。
  related_experiments:
  - exp_id: deepseek_full_trace_seed42
    role: 触发诊断
    result: negative (28.49% accuracy, all predict fail)
  depends_on: []

decisions:
- id: D001
  date: 2026-05-14 16:14 UTC
  summary: MVP pass 阈值统一为 ≥2pp + bootstrap CI 不含 0；补全 kill criteria
  rationale: IDEA_BRIEF pilot 用 2pp（Defects4J 上下文），ROADMAP 初版用 3pp。考虑到 holdout ~1.3K
    样本统计功效有限，统一为 2pp + CI 要求。FAIL 后先排查 bug 1 天，clean fail 则 pivot 到 negative-result
    framing。WEAK PASS 追加 CRUXEval verdict 验证。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 21:50 UTC
  summary: MVP 第一轮结果无效：VOTA match 字段泄漏 + full_trace label 截断，需修复后重训
  rationale: VOTA 99.16% 来自 match=True/False 直接泄漏答案（trivial pattern matching）；full_trace
    28.4% 来自 label 被 2048 token 截断丢弃。no_trace 75.13% 有效但无法与其他条件对比。修复方案：去 match 字段
    + 智能截断保留 label。
  related_experiments: []
  depends_on: []
- id: D003
  date: 2026-05-15 01:24 UTC
  summary: MVP PASS — VOTA 95.63% (+20.5pp over no_trace), 附带 actual/expected leakage
    concern 需 ablation 验证
  rationale: D001 标准满足：VOTA vs no_trace +20.5pp, 95% CI [+17.7, +23.4] 不含 0。但 >95%
    触发高准确率警戒，pass_recall 99.8% 暗示模型可能在做 actual==expected 字符串比对而非代码行为理解。进入 research
    阶段后第一实验必须是去 actual/expected ablation。full_trace 28.49% 为 genuine negative（100%
    预测 fail，trace token 稀释分类梯度），后续可尝试 label-only loss。
  related_experiments:
  - exp_id: vota_seed42_v4
    role: primary
    result: 95.63% accuracy, +20.5pp lift, PASS
  - exp_id: no_trace_seed42_v4
    role: baseline
    result: 75.13% accuracy
  - exp_id: full_trace_seed42_v2
    role: negative
    result: 28.49% accuracy, model collapse
  depends_on: []
- id: D004
  date: 2026-05-15 01:34 UTC
  summary: 'D004: full_trace 28.4% 系 chat template overhead 导致 label 截断（非 genuine
    negative），选方案 B + 三条件全部重训 v5'
  rationale: Agent 诊断发现 format_training_data.py 按 raw tokens 截断到 2048，但 train_sft.py
    的 Qwen chat template 额外增加 31 tokens → TRL max_length=2048 从右截断 → full_trace 100%
    pass label 被切 → 全预测 fail。VOTA 也受影响（89.4% pass label 被截），但 360 条足够学到 95.63%。选方案
    B（根本修复：trace budget 减 32 tokens）+ 三条件全部重训，确保公平对比。这是第三轮修复，必须加 end-to-end 验证：训练前确认
    0 样本被截断。Claim 2（full traces hurt）暂时搁置，等 v5 结果。
  related_experiments:
  - exp_id: full_trace_seed42_v2
    role: invalidated
    result: 28.49% due to label truncation bug, not genuine negative
  - exp_id: vota_seed42_v4
    role: affected
    result: 95.63% with only 10.6% pass labels intact — may improve after fix
  depends_on:
  - D003
- id: D005
  date: 2026-05-15 04:07 UTC
  summary: 'D005: full_trace_v5 确认 81.76%（非 collapse），D004 假说正确。Claim 2 从 "full traces
    hurt" 改为 "VOTA 显著优于 full_trace (+13.8pp)"。plan_002 降为 P1。'
  rationale: v5 修复 chat template overhead 后 full_trace 从 28.4% 恢复到 81.76%（+6.6pp over
    no_trace），确认 v2 collapse 是截断 bug 非 gradient dilution。三条件梯度：no_trace 75.1% < full_trace
    81.8% < VOTA 95.6%。Claim 2 reframe 为 "trace compression 提供更高 information density"。plan_002
    (label-only loss) 原假设 (gradient dilution) 已被否定，降为 P1；plan_001 (去 actual/expected)
    仍是最高优先级。
  related_experiments:
  - exp_id: full_trace_seed42_v5
    role: primary
    result: 81.76% accuracy, +6.6pp over no_trace, confirms D004 truncation fix
  - exp_id: vota_seed42_v4
    role: comparison
    result: 95.63%, +13.8pp over full_trace
  - exp_id: no_trace_seed42_v4
    role: baseline
    result: 75.13%
  depends_on:
  - D004
- id: D006
  date: 2026-05-15 04:31 UTC
  summary: full_trace collapse 根因确认为 chat template overhead bug，非 gradient dilution；v5
    修复后 accuracy 81.8%
  rationale: full_trace_v2 的 28.4% accuracy + 100% predict fail collapse 完全由 chat
    template overhead 导致 pass 样本 label 被截断造成。v5 修复截断后 accuracy 恢复至 81.8%（+6.7pp over
    no_trace），collapse 完全消除（pass_recall 从 8.5% 恢复至 87%）。三条件形成清晰层次：no_trace 75.1% <
    full_trace 81.8% < VOTA 95.6%。原 D004 中的 gradient dilution 假说被推翻。plan_002 (label-only
    loss) 仍保留为 ablation 实验但目的调整：不再验证 collapse 根因，改为测试 loss masking 对 full_trace 的边际提升。
  related_experiments:
  - exp_id: full_trace_seed42_v2
    role: 原始实验（含 bug）
    result: 28.4% accuracy, collapse
  - exp_id: full_trace_seed42_v5
    role: 修复后实验
    result: 81.8% accuracy, collapse 消除
  - exp_id: vota_seed42_v5
    role: 对比基准
    result: 99.16% accuracy
  - exp_id: no_trace_seed42_v4
    role: 对比基准
    result: 75.13% accuracy
  depends_on:
  - D004
- id: D007
  date: 2026-05-15 06:04 UTC
  summary: Claim 3 从 element-level 降级为 component-level design principles；ae_only 移至
    Appendix
  rationale: ae_only 数据 88% (4159/4720) 为 fallback locals dump 而非干净 actual/expected
    值（VOTA compressor _extract_assertions() 固有行为）。ae_only 结果无论高低都无法干净归因于 actual/expected。Reviewer
    评估：三个干净实验（plan_001 减法 + exception_only + loop_only）足以支撑 component-level 归因，但不够
    element-level。采纳 Reviewer Option A：主表报告 plan_001 + exception_only + loop_only，ae_only
    移 Appendix 附 caveat。Claim 1/2 不受影响。
  related_experiments:
  - exp_id: plan_003
    role: component ablation (ae_only/exception_only/loop_only)
    result: ae_only 88% fallback 污染
  - exp_id: plan_001
    role: 主线证据 (减法验证 ae 贡献)
    result: RUNNING
  depends_on:
  - D006
- id: D008
  date: 2026-05-15 06:23 UTC
  summary: plan_001 确认 actual/expected 不是 VOTA 效果来源；Claim 1 走 genuine behavioral understanding
    路径
  rationale: vota_no_ae (去除 actual/expected) accuracy 99.41% vs VOTA 完整版 99.16%，差异仅
    3 样本/1190（不显著），去 ae 后不降反微升。exception + loop + assertion structure 足以实现近完美 verdict
    预测。Claim 1 contingency 中 "trivial string comparison" 假说被否定。Reviewer 同时指出 trace
    结构性信号（[No trace available]→fail, [ERROR]→fail, [ASSERT]+[LOOP]→pass）可能构成 trivial
    pattern，但此问题对所有 VOTA 变体等同存在，不影响 plan_001 结论。exception_only ablation (plan_003
    sub-b) 将量化 [ERROR] 信号贡献。
  related_experiments:
  - exp_id: vota_no_ae_seed42
    role: plan_001 ablation
    result: 99.41% accuracy, 7 errors/1190
  - exp_id: vota_seed42_v5
    role: 对照基准
    result: 99.16% accuracy, 10 errors/1190
  depends_on:
  - D006
  - D007
- id: D009
  date: 2026-05-15 07:58 UTC
  summary: plan_002 确认 gradient dilution 是 real 但 minor factor (4.5pp/17.4pp=26%)；information
    overload 是 VOTA 优势主因 (74%)
  rationale: full_trace label-only loss 86.2% vs 标准 loss 81.8%，提升 4.5pp 确认 gradient
    dilution 存在。但 86.2% vs VOTA 99.2% 仍有 13pp gap，只能通过 trace compression 弥补。因果分解：gradient
    dilution 贡献 ~26% (4.5/17.4pp)，information overload 贡献 ~74% (13.0/17.4pp)。VOTA
    的核心优势是信息质量（decision-relevant state selection），不仅是训练效率。这为 Claim 2 提供了定量支撑，可在论文中写"Even
    with oracle loss masking, full traces still underperform VOTA by 13pp"。
  related_experiments:
  - exp_id: full_trace_label_only_seed42
    role: plan_002 ablation
    result: 86.2% accuracy [84.4, 88.1]
  - exp_id: full_trace_seed42_v5
    role: 对照 (standard loss)
    result: 81.8%
  - exp_id: vota_seed42_v5
    role: 对照 (VOTA)
    result: 99.2%
  depends_on:
  - D006
- id: D010
  date: 2026-05-15 09:36 UTC
  summary: exception_only 99.83% 证明 exception signal 是 VOTA verdict prediction 的核心驱动因素；Claim
    1 从 "behavioral understanding" 调整为 "fault indicator detection"
  rationale: exception_only accuracy 99.83% 甚至高于完整 VOTA (99.2%)，说明 exception summaries
    单独即可实现近完美 verdict 预测。结合 plan_001 (去 ae 后 99.4%)，组件重要性层次清晰：exception >>> ae ≈ loop。VOTA
    的效果核心机制是捕获 fault indicators (exception 有无)，而非深层行为理解。这仍然是有价值的 design principle——verdict
    tasks 需要 fault indicators 而非 full execution simulation。论文需诚实讨论：VOTA 之所以有效，是因为
    verdict 任务本质是 fault detection，exception 是近乎完美的判别信号。等 loop_only 结果确认层次。
  related_experiments:
  - exp_id: vota_exception_only_seed42_v2
    role: plan_003a exception_only ablation
    result: 99.83% accuracy
  - exp_id: vota_no_ae_seed42
    role: plan_001 (ae redundancy)
    result: 99.41%
  - exp_id: vota_seed42_v5
    role: full VOTA baseline
    result: 99.16%
  depends_on:
  - D008
  - D007
- id: D011
  date: 2026-05-15 10:07 UTC
  summary: 完整 component hierarchy 确立：exception (99.83%) >> loop (85.6%) >> no_trace
    (75.1%)；采用 Two-tier information architecture framing
  rationale: 'plan_003 三个 sub-condition 完成后（ae_only 仍在跑但结论不依赖它）：exception_only 99.83%
    是 Tier 1 fault indicators（充分条件），loop_only 85.6% 是 Tier 2 behavioral patterns（有信息但被
    Tier 1 完全覆盖）。关键发现：(1) exception_only > VOTA full，p=0.01 显著——非 exception 组件引入噪声；(2)
    loop_only ≈ full_trace_label_only (85.6% vs 86.2%)——loop 压缩高效提取了 full trace 的有用行为信号；(3)
    组合 Tier 1 + Tier 2 不优于 Tier 1 单独使用。Design principle: verdict tasks should prioritize
    highest-specificity diagnostic signals; lower-specificity signals are redundant
    and may add noise.'
  related_experiments:
  - exp_id: vota_exception_only_seed42_v2
    role: Tier 1 (fault indicators)
    result: 99.83%
  - exp_id: vota_loop_only_seed42
    role: Tier 2 (behavioral patterns)
    result: 85.63%
  - exp_id: vota_seed42_v5
    role: Tier 1+2+ae combined
    result: 99.16%
  - exp_id: full_trace_label_only_seed42
    role: full trace optimized loss
    result: 86.22%
  depends_on:
  - D010
- id: D012
  date: 2026-05-15 10:18 UTC
  summary: 组件层级确立 + plan_004 扩展为 4 条件含 exception_only
  rationale: loop_only (85.6%) 完成后组件层级明确：exception (99.83%) >>> loop (85.6%) >> ae
    (冗余)。exception dominance 是最强发现，跨模型验证是最高价值实验。plan_004 原定 3 条件(no_trace/full_trace/VOTA)，扩展加
    exception_only 验证 exception dominance 是否跨模型泛化，额外成本 ~2h 但证据价值极高。
  related_experiments:
  - exp_id: vota_loop_only_seed42
    role: trigger
    result: 85.6% accuracy, confirms Tier 2 positioning
  - exp_id: vota_exception_only_seed42
    role: trigger
    result: 99.83% accuracy, Tier 1 dominant signal
  - exp_id: vota_no_ae_seed42
    role: supporting
    result: 99.4%, ae redundancy confirmed
  depends_on:
  - D010
  - D011
- id: D013
  date: 2026-05-15 12:19 UTC
  summary: 'D013: ae_only 99.9% 修正组件层级——assertion-point info 与 exception 均为 Tier 1
    独立近完美信号'
  rationale: ae_only 99.92% 是所有单组件条件中最高的，高于 exception_only 99.83%。D010/D011 的 "exception
    is THE driver" 叙事不准确。修正后的层级：Tier 1 包含两个独立的近完美信号源——assertion-point information
    (ae_only 99.92%) 和 exception summaries (99.83%)；Tier 2 为 loop compression (85.6%)。虽然
    ae_only 有 88% fallback 污染（full locals dump），但这恰恰说明 assertion-point 处的任何信息（甚至 noisy
    locals）都是强判别信号。设计原则从 "preserve exception events" 泛化为 "capture information at diagnostic
    moments"——assertion 断言点和 exception 抛出点都是 diagnostic moments。ae_only 不应仅作 Appendix
    脚注，应与 exception_only 并列为核心消融发现。
  related_experiments:
  - exp_id: vota_ae_only_seed42
    role: primary
    result: 99.92% accuracy, highest single-component
  - exp_id: vota_exception_only_seed42_v2
    role: comparison
    result: 99.83% accuracy, previously thought to be THE driver
  - exp_id: vota_no_ae_seed42
    role: comparison
    result: 99.41%, removing ae doesn't hurt much when exception present
  depends_on:
  - D010
  - D011
  - D007

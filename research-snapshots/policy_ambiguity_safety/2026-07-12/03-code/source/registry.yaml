    updated_at: '2026-05-20T15:32:09.597Z'
    hypothesis: Specification-layer ambiguities produce qualitatively different failure
      modes (more assumption_based_action) than linguistic-layer ambiguities (more
      scope_misapplication), and coreferential's low violation rate is explained by
      higher conservative_refusal rate. These distinct failure mode profiles explain
      the layer hierarchy (spec ~46pp vs ling ~27pp).

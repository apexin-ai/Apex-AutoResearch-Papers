    和 gen_final）。2. 启动新实验前检查磁盘剩余空间是否足够（每个实验约 17G，确保至少 2x 余量）。3. 考虑在训练脚本中加磁盘空间 pre-check。
  status: active
  context: exp_014 (r=0.25 seed43) 在 Gen 6 崩溃，gen 0-5 数据完整。exp_015 (r=0.25 seed44)
    在 Gen 1 即将崩溃。清理已完成的 7 个 checkpoint 目录可释放 ~105G。HellaSwag 3-seed 评估已全部完成不受影响。
  fix: 紧急清理 7 个已完成 checkpoint 目录释放 ~105G，从 gen 5 恢复 exp_014，检查 exp_015 存活状态。

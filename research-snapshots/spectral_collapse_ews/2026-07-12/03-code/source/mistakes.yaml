  category: agent_behavior
  severity: high
  summary: exp_003 首次启动失败后孤儿进程未被清理，与第二次启动的正式实例并行写同一目录
  root_cause: 首次 exp_003 启动（PID 77663/77668）因 HF 网络问题被判定失败后，只杀了 session leader 但 timeout→python
    进程链未级联终止。第二次启动时未检查 GPU 上是否有残留进程。
  prevention: 重启实验前必须：1) nvidia-smi 检查目标 GPU 无残留进程 2) 如果有旧 PID，先 kill -9 整个进程组 3)
    确认 checkpoint 目录为空或上次干净退出。写入 Agent checklist：submit_training_job 前 GPU 清洁检查。
  status: active
  context: PID 77668 (孤儿) 和 PID 78074 (正式) 同时在 GPU 1 运行，写同一个 adaptive_seed42 checkpoint
    目录。可能导致数据损坏需重跑。
  fix: urgent_agent_message 指令：kill 77667 孤儿父进程，检查 checkpoint 污染，必要时清空重启。
- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: Controller 预算跟踪 bug + 数据上限导致 adaptive ≡ fixed_mix，核心 claim 无法验证
  root_cause: 三层问题叠加：1) B_rem 按请求 ratio 扣减而非实际用量；2) Gen 0 spectral 未进入 controller
    导致前 2 代无有效信号；3) real data pool (50K) = synthetic pool (50K) 使 ratio > 0.5 物理不可能。结果：adaptive
    Gen 1-8 与 fixed_mix 完全相同的 50/50 mix，Gen 9-10 因预算虚扣反而更差。
  prevention: 1) 设计 controller-pipeline 接口时，预算扣减必须基于实际执行值而非请求值；2) 部署前必须用历史数据 dry-run
    模拟完整 N 代 controller 输出，检查 ratio 是否全部可物理实现；3) 数据池大小必须 ≥ r_max × total_per_gen，否则
    ratio 上限被静默截断；4) Reviewer 对新 controller 实验应模拟完整生命周期，不仅检查单代触发。
  status: active
  context: exp_003 (adaptive s42) 跑了 2+ gen 但实际 mix 全是 50/50。Reviewer 通过代码追溯发现 pipeline.py
    打印 requested ratio 而非 actual ratio，导致 Agent 误判 controller 已触发。
  fix: Kill exp_003，修复 3 个 bug（预算扣减、Gen 0 baseline、数据池扩容），dry-run 验证后重启。
  related_decisions:
  - D010
- id: M003
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Agent 未修复 D011 三个 bug 就重启了 exp_003，浪费 GPU 跑无效实验
  root_cause: Worker 更新了配置参数（D010 的 tau/signal）和 sensitivity grid，但未触及 controller
    预算逻辑、Gen 0 baseline、数据架构这三个核心 bug。在代码未改的情况下直接重启了 exp_003。缺乏修复验证步骤（dry-run）作为重启的前置门禁。
  prevention: 1) CRITICAL bug 修复后，必须有 dry-run 验证步骤作为重启的硬性前提；2) Director 审批 dry-run
    结果后才允许重启实验；3) Agent 在 kill+fix+restart 类指令中，必须在汇报中逐条确认每个 fix 的 diff，不能跳过；4) Reviewer
    应在重启前审查代码变更而非事后。
  status: active
  context: PID 88161 在 14:32 启动，跑了 ~1h+ 无效数据。D011 三个 bug 全部未修。Reviewer 逐行确认 controller.py:71
    仍为 self.B_rem -= r（请求值）。
  fix: 再次 kill PID 88161，发更详细的修复指令含伪代码，要求 dry-run 验证后 Director 审批才能重启。
  related_decisions:
  - D011
- id: M004
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: 两个 Worker 同时操作 exp_003 导致 race condition：diagnose worker 删除了运行中 PID 88161
    的 checkpoint
  root_cause: Worker A (sensitivity_grid) 重启了 exp_003 为 PID 88161。Worker B (diagnose)
    被派去清理旧 exp_003 残留，但误删了 PID 88161 正在写入的 checkpoint 和 results 目录。两个 worker 对同一实验的文件系统操作没有互斥保护。
  prevention: 1) 同一实验的清理和重启不能由不同 Worker 并行执行；2) 删除实验目录前必须检查是否有活跃进程在写入（lsof / fuser）；3)
    Director 派 Worker 时应注意任务间的文件系统冲突。
  status: active
  context: Gen 1-2 checkpoint 永久丢失。PID 88161 在 Gen 3 生成阶段可能因读不到 Gen 2 checkpoint 而
    crash（CRON 报告进程已退出）。
  related_decisions:
  - D011
- id: M005
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: exp_005 被监控误判 failed（false positive）：nohup 启动无 sentinel/W&B，进程实际正常运行
  root_cause: exp_005 通过 nohup python ... & 启动，绕过了 submit_training_job 的标准进程管理（tmux
    + sentinel 文件 + exit handler）。监控钩子依赖 sentinel 或 W&B 判断进程状态，两者均不存在。连续 5 次检测不到后自动标记
    failed。
  prevention: 1) 所有实验启动必须通过 submit_training_job 或至少使用 tmux wrapper + sentinel trap；2)
    裸 nohup 启动的实验在 registry 中标注 monitoring_mode=manual，禁用自动 failed 判定；3) Agent 收到
    auto-failed 通知时必须先 ps 确认进程状态再决定是否重启。
  status: active
  context: PID 116947 运行 25 min，cuda:1 94% util，日志从 7KB 增长到 51KB。Registry 标记 failed
    后如果 Agent 启动新进程会导致 cuda:1 双进程 OOM。
  fix: urgent_agent_message 阻止重启 + 修正 registry 状态为 RUNNING。
  related_decisions:
  - D012
- id: M006
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: exp_006 (k=10) 与 exp_005 (k=20) 共享 checkpoint/results 路径（均为 adaptive_seed42），导致数据互相覆写
  root_cause: run_phase1.py 路径格式为 {condition}_seed{seed}，不含 k 参数。两个实验 condition=adaptive,
    seed=42 相同，仅 k 不同，映射到同一路径。启动 exp_006 时未审查输出路径是否与已运行的 exp_005 冲突。
  prevention: 1) 启动新实验前必须检查输出路径是否已被其他 RUNNING 实验占用；2) 路径格式应包含所有区分实验的关键超参数（condition
    + seed + k + tau 等）；3) submit_training_job 前 ls 目标 checkpoint/results 目录，非空则警告并等
    Director 确认
  status: active
  context: exp_006 PID 133199 覆写了 exp_005 的 gen_0/config.json (timestamp 01:36)。exp_005
    PID 116947 在 Gen 3，其 Gen 0-2 results JSON 可能仍完好但 checkpoint 已被污染。
  fix: Kill exp_006，备份 exp_005 数据，修改路径格式加入 k 参数（adaptive_k10_seed42 vs adaptive_k20_seed42），重启
    exp_006。
  related_decisions:
  - D016
- id: M007
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: cuda:1 双实例实际降速 3.5-5x，远超预估的 30-50%，导致 exp_004 和 exp_005 都严重延迟
  root_cause: 410M 模型 VRAM 仅占 25GB/98GB 看似安全，但 GPU compute 竞争远超 VRAM 竞争。两个训练 job 共享
    SM 和内存带宽，实际吞吐下降到单实例的 20-30%。预估时只考虑了 VRAM 余量，未考虑 compute 瓶颈。
  prevention: 1) 双实例前先做 5-10 分钟 benchmark（单实例 vs 双实例 step/s 对比），不要仅凭 VRAM 余量判断可行性；2)
    训练 job 的 GPU compute 竞争通常比 VRAM 竞争更严重，especially 当 batch size 已经足够饱和 GPU 时；3)
    如果单实例已达 94-100% GPU util，加第二个实例必然导致严重竞争
  status: active
  context: exp_005 (25GB) + exp_004 (25GB) 共享 cuda:1 (98GB)。VRAM 51% 占用。但 GPU util
    100%，两个 job 互相抢 compute。exp_005 Gen 3→4 从正常 2-3h 膨胀到 10.5h。
  fix: Kill exp_005 释放 cuda:1 给 exp_004 独占 (D018)。
  related_decisions:
  - D017

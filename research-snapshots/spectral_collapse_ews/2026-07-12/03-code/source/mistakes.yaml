- id: M013
  date: '2026-05-21'
  category: resource_misuse
  severity: high
  summary: 数据盘 250G 满导致 exp_014 崩溃、exp_015 濒危——未及时清理已完成实验 checkpoints
  root_cause: 10 个实验的 checkpoints 累积 132G，已完成实验（HellaSwag 评估也已结束）的 checkpoints 未及时清理。每个

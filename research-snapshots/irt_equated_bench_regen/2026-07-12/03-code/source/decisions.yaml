- id: D004
  date: 2026-05-20 21:14 UTC
  summary: plan_001 temporal cohort DIF 证伪（enrichment=0.96），根因是 impact vs DIF 混淆。批准
    matched-ability DIF 作为方法改进方向 1
  rationale: Temporal cohort MH-DIF 标记 31.3% items 为 ETS C，但 enrichment=0.96（clean
    和 contaminated 标记概率相同）—— DIF 检测的是系统性能力提升而非污染。Within-family (Llama-2 vs Llama-3)
    61.3% C 进一步证实。这是经典 impact vs DIF 混淆（Dream D2 预测过）。但 ability-quintile enrichment=1.19
    + FPR=2.7% 表明信号存在但弱。方向1 matched-ability temporal DIF 在 quintile 内做时间对比，是最快验证能力匹配能否放大信号的路径。方向2
    IRT equating 并行准备作为 fallback。
  related_experiments:
  - exp_id: plan_001_real_data_dif_mmlu
    role: evidence
    result: negative - temporal cohort enrichment 0.96, ability quintile enrichment
      1.19
  depends_on:
  - D003
- id: D005
  date: 2026-05-20 21:24 UTC
  summary: 方向 1 (matched-ability DIF) 失败确认，所有 quintile enrichment 0.94-1.04。plan_011
    是唯一决定性实验
  rationale: Quintile 内 temporal DIF 仍 enrichment≈1.0，ability matching 未能分离污染信号。但
    Reviewer 指出关键洞察：Li et al. web-overlap 是全局性污染（Common Crawl 对所有模型可用），不应产生 group-specific
    DIF。enrichment≈1.0 可能是 ground truth 不匹配而非方法失败。plan_011 注入的是已知差异性污染（仅 focal group），是唯一能区分"DIF
    不 work"和"ground truth 不对"的实验。方向 2 (IRT θ-matching) 如果问题出在 ground truth 也无法解决。
  related_experiments:
  - exp_id: plan_001b_matched_ability_dif
    role: evidence
    result: negative - all quintiles enrichment 0.94-1.04
  depends_on:
  - D004
- id: D006
  date: 2026-05-20 21:56 UTC
  summary: 'plan_011 positive: MH-DIF 检测差异性污染有效 (p=0.5 TPR=0.834, p=1.0 TPR=1.0)，但
    baseline FPR=31% 需 IRT θ-conditioning 降低。启动方向 2'
  rationale: Semi-synthetic validation 确认 DIF 能检测差异性污染（剂量-响应单调，Fisher p<1e-21）。plan_001/001b
    失败归因于 Li et al. web-overlap 是全局性标注，不产生 group-specific DIF。但 baseline FPR=31% (temporal)
    / 49% (ability) 意味着 DIF 是筛查工具（高召回、中等精度），不是确诊工具。Precision ~44% at p=1.0。两个推进方向：(1)
    IRT θ-conditioning 降低 baseline FPR (方向 2)，(2) Ensemble 信号 (Claim 2) 过滤假阳性——DIF
    高召回 + ConStat 高精度自然衔接。同时需 Yen's Q3 诊断局部独立性（审稿 WC4），局部依赖可能是 FPR 膨胀的部分原因。
  related_experiments:
  - exp_id: plan_011_semi_synthetic
    role: evidence
    result: positive - TPR 0.834 at p=0.5, 1.0 at p=1.0; but baseline FPR 0.314
  depends_on:
  - D005
- id: D007
  date: 2026-05-20 21:58 UTC
  summary: 'Story pivot: semi-synthetic validation 作为核心效度证据，Li et al. enrichment≈1.0
    重新定位为"全局 vs 差异性污染"的发现。IRT θ-conditioning 继续（降 FPR），但不期望改善 Li enrichment'
  rationale: 'Agent 和 Reviewer 均指出：即使 IRT θ 完美控制能力，Li et al. web-overlap 仍是全局标注，enrichment
    仍≈1.0。plan_011 semi-synthetic (ΔTPR=+0.674, Fisher p<1e-42) 是 DIF 方法有效性的决定性证据。Li
    et al. enrichment≈1.0 不是方法失败，而是揭示了现有"污染标注"实际测量的是全局 web 曝光（所有模型共享），不是差异性训练数据包含。这是一个有价值的发现：DIF
    检测差异性污染，现有标签标注存在性污染，两者度量不同。Story: DIF 是差异性污染的高灵敏度筛查工具 + ensemble 提升精度 + 全局/差异性污染区分是方法论贡献。'
  related_experiments:
  - exp_id: plan_011_semi_synthetic
    role: evidence
    result: positive
  - exp_id: plan_001_real_data_dif_mmlu
    role: evidence
    result: negative - reinterpreted as ground truth mismatch
  - exp_id: plan_001b_matched_ability_dif
    role: evidence
    result: negative - reinterpreted as ground truth mismatch
  depends_on:
  - D006
- id: D008
  date: 2026-05-20 22:12 UTC
  summary: 方向 2 (IRT θ-conditioning) 失败，1D 路线穷尽。plan_011 ability cohort TPR 修正（76%→21%，73%
    是能力混淆）。启动 plan_005 bifactor IRT 作为最后结构性改进
  rationale: logit(p) 与 total score 相关 0.9986，所有 θ 变体 FPR 31-35%。plan_011 ability
    cohort 在 θ 10/20-bin conditioning 下 TPR 从 76% 降到 21%（p=0.5）——原 5-bin 分层不足以消除 Q1-2
    vs Q4-5 极端能力差异。DIF 面临 TPR-FPR tradeoff：temporal 高 TPR 但 FPR=31%，ability (proper)
    低 FPR=8% 但 TPR=21%。根因：temporal cohort 间差异是多维的（不同学科能力提升不均匀），1D θ 无法捕获。Bifactor
    model (general + 57 subject factors) 是唯一能吸收学科级差异的结构性方法。已尝试 2 种不同类型改进方向，bifactor
    是第 3 种。计算量大（5227×12508×58 factors），可能需要服务器。
  related_experiments:
  - exp_id: plan_012_irt_theta_conditioning
    role: evidence
    result: negative - temporal FPR stuck at 31%, ability TPR corrected to 21%
  depends_on:
  - D007
- id: D009
  date: 2026-05-20 22:17 UTC
  summary: 'Dream #2 分析：best=3/6, median=3-4/6, worst=3/6。跨档一致：impact-vs-DIF confound
    为首要问题，bifactor 是正确方向。新发现：ensemble 不优于 DIF alone、SIBTEST/MIMIC 未尝试、detection trilemma
    概念'
  rationale: 三档审稿一致认为 within-family confound (42-62% overlap) 是最致命问题——没有 bifactor
    分离学科级能力差异，DIF flags 的可解释性无法建立。worst case 新增 SIBTEST/MIMIC 作为 established impact-vs-DIF
    solutions 的替代方案需要考虑。median 指出 ensemble AUROC (0.72) 低于 DIF alone (0.76)，Claim
    2 需要重新评估。worst case 提出 detection trilemma (IRT fit ↔ power ↔ confound control)
    作为潜在概念贡献。行动：(1) 优先完成 bifactor，(2) 考虑 SIBTEST/MIMIC 作为备选，(3) 推迟 ensemble 设计到 bifactor
    结果出来后，(4) 补充 impact-vs-DIF 文献
  related_experiments:
  - exp_id: dream_20260520T205007
    role: dream_simulation
    result: best=3/6, median=3-4/6, worst=3/6
  depends_on:
  - D008
  - D007
  - D006

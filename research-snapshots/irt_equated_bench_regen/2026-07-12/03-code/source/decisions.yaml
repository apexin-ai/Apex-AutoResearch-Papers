- id: D011
  date: 2026-05-20 23:23 UTC
  summary: Pivot 拍板：从"DIF 检测方法"转向"LLM benchmark psychometric characterization + DIF
    methodology"。Cross-subject matching ΔFPR=0.000 是方法论突破，31-38% temporal DIF 是实证发现。保持
    ICLR 2027 目标不降级
  rationale: 三种结构性改进全部穷尽（D005/D008/D010），oracle 确认方法有效（plan_011 ΔTPR=+0.508）。但 pivot
    不等于降级：(1) cross-subject matching ΔFPR=0.000 是干净的方法论贡献——解决了 matching variable contamination
    这个 MH-DIF 领域的实际问题；(2) 31-38% temporal DIF 是首次大规模量化 LLM benchmark item instability；(3)
    global vs differential contamination 区分是概念贡献；(4) semi-synthetic validation framework
    可独立复用；(5) detection trilemma 是 characterization 贡献。这些组合起来是 ICLR 级别的 empirical
    findings paper，不需要降到 findings track。用户批评"等我点头"正确——这是 PI 的决策责任。
  related_experiments:
  - exp_id: plan_016_within_subject_semi_synthetic
    role: final_validation
    result: cross-subject ΔFPR=0.000, 4/5 ΔTPR>0.3
  - exp_id: plan_014_within_subject_dif
    role: pre-check
    result: within-subject C%=38.1%
  - exp_id: plan_011_semi_synthetic
    role: oracle
    result: ΔTPR=+0.508
  depends_on:
  - D010
  - D009
  - D006
- id: D012
  date: 2026-05-20 23:28 UTC
  summary: Story 定稿：Candidate 1 (benchmark quality tool) + ground truth meta-critique
    + semi-synthetic infrastructure。降级 cross-subject matching 为 recommendation（非 breakthrough）。新增
    downstream impact 实验（移除 DIF items → ranking stability）作为 ICLR 关键补充
  rationale: Reviewer 评估：(1) 三候选中 Candidate 1 最自洽，(2) cross-subject matching 是 external
    matching 的自然推广非新方法（降级），(3) enrichment≈1.0 + semi-synthetic positive 证明现有污染 ground
    truth 自身有缺陷（meta-contribution），(4) "so what?" 缺口是 ICLR vs findings track 的分水岭——需
    downstream impact 实验回答。38% 与 domain specificity ρ=0.307 的关系必须在 limitations 诚实讨论。
  related_experiments:
  - exp_id: plan_014_within_subject_dif
    role: finding
    result: 38% temporal DIF
  - exp_id: plan_016_within_subject_semi_synthetic
    role: method
    result: cross-subject ΔFPR=0.000
  - exp_id: plan_001_real_data_dif_mmlu

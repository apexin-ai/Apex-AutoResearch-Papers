- id: D013
  date: 2026-05-21 00:06 UTC
  summary: plan_017 downstream impact negative 但 informative：DIF items 是浓缩差异化信号载体而非噪声。Claim
    4 从 placeholder "remove for stability" 转为 finding "DIF as diagnostic lens"。DIF
    items 移除造成更大排名扰动（21/21 条件显著），phi-3/llama-3 获益最多，mistral merge 被压制
  rationale: plan_017 全面证伪了"移除 DIF items 改善排名稳定性"的 hypothesis：(1) full vs stable-only
    ρ=0.996-0.999 说明排名本身极鲁棒，(2) DIF removal 扰动显著大于 random removal（z=-8 to -49σ），(3)
    DIF items 的跨代准确率变化是 full benchmark 的 1.09×。这意味着 DIF items 不是"坏题"而是"模型代际差异的诊断标记"。对
    paper narrative 的影响：从"remove unstable items"转向"DIF as diagnostic lens for understanding
    model evolution"。这个 negative result 比 positive 更有深度——"keep these items, they tell
    you something" 是更有价值的 benchmark design recommendation。
  related_experiments:
  - exp_id: plan_017_downstream_impact
    role: hypothesis_test
    result: negative - DIF items carry MORE discriminative signal, not less
  depends_on:
  - D012
  - D011
- id: D014
  date: 2026-05-21 01:25 UTC
  summary: 'plan_004 Step 3 GSM1K: |r|=0.478 显著但方向为负——DIF 不标记 contamination，而是标记 contamination
    无法到达的 capability-discriminative items'
  rationale: r=−0.478 (p=0.005), Spearman ρ=−0.403 (p=0.020), partial r=−0.385 (p=0.027
    控制 overall accuracy), permutation p=0.014, leave-one-out robust (min |r|=0.374)。N=33
    matched models。171 个 focal-favoring DIF-C items 驱动负相关 (r=−0.347, p=0.048)：contaminated
    models 在这些 genuine capability improvement items 上表现更差。这不支持 "DIF = contamination
    detector" 假设，但强力支撑 pivot 后 "DIF as diagnostic lens" 叙事：DIF 捕获的是真实能力差异，contamination
    产生的浅层提升无法到达这些 items。与 plan_017 (DIF items = discriminative signal carriers) 形成双重验证。不升级
    ICLR 为 "validated method"，但显著加强 characterization paper 的深度和跨 benchmark 证据。
  related_experiments:
  - exp_id: plan_004_gsm8k_cross_benchmark
    role: primary
    result: negative_but_informative
  - exp_id: plan_017_downstream_impact
    role: corroborating
    result: negative_but_informative
  depends_on:
  - D013
  - D011

- id: M009
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: SentencePiece tokenizer 上下文依赖导致 continuation masking 对 Mistral 完全失效
  root_cause: _build_role_prefix_map 用 bare encode('Subject') 构建 token map，SentencePiece
    返回 ▁Subject (ID=26326)。但在 JSON value 位置（after双引号），实际生成的是 Subject (ID=22978)。11/11
    roles 的首 token 全部未覆盖，masking 等效于空操作。Qwen/Llama 用 byte-level BPE 不受上下文影响所以正常。
  prevention: 1. 构建 token prefix map 时禁止依赖 encode()——必须用词表扫描（get_vocab() + decode()
    匹配）确保覆盖所有可能的 tokenization 变体。2. 新模型接入 constrained decoding 前必须跑 tokenizer 兼容性测试：对比
    bare encode vs in-context encode 的 token ID 差异。3. 这是一个通用教训：SentencePiece/Unigram
    tokenizer 的 context-dependent tokenization 会破坏任何依赖 bare encode 构建 token set 的逻辑。
  status: active
  context: D044 Mistral constrained RoV 大量违规。Reviewer critical 发现后 Agent 诊断确认。修复改动
    type_mask_processor.py 796→812 行，3 处改动：_build_role_prefix_map、_build_entity_type_prefix_map、_build_role_continuation_tokens。5-doc
    dry-run 验证 RoV=0%，Qwen 3-doc 回归通过。
  fix: 词表扫描替代 encode()，只依赖 get_vocab() + decode()，不依赖特定 BPE 实现。type_mask_processor.py
    新基准 812 行。
  related_decisions:
  - D044

- id: M001
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: Worker 启动实验前未检查是否已有同名进程在跑，导致双进程写同一输出文件
  root_cause: 多个 Worker 或重复指令导致同一实验被启动两次，两个进程同时写入同一 JSONL 文件。这是第二次出现（首次是 DocRED sampling

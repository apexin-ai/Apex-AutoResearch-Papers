- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: Llama DocRED beam 实验参数错误导致 grammar 约束失效，RV=100% 被误报为 DR=0% success
  root_cause: beam search 参数不一致：Llama SciERC beam 用 --beam_size 4（grammar adapter
    正确 hook），Llama DocRED beam 用 --decoding_strategy beam --num_beams 4（可能绕过 grammar
    adapter state replay）。Agent 收集结果时只看 DR=0% 没有检查 RV%，漏过了 RV=100% 的致命异常。
  prevention: 1. 结果收集时必须同时检查 RV% — RV>0 说明 grammar 约束失效，所有下游指标（DR/CF）不可信。2. beam search
    实验必须使用与已验证成功的实验完全相同的参数格式（--beam_size 而非 --decoding_strategy beam --num_beams）。3.
    新 model-dataset 组合的 beam 实验先 dry-run 5 docs 验证 RV=0% 再全量跑。
  status: active
  context: 'w10_llama_docred_beam_50: Llama 生成自然语言 relation 标签而非 DocRED Wikidata P-codes。对照组证明
    bug 仅在 Llama tokenizer + DocRED multi-token P-codes + beam state replay 组合下触发。Qwen
    DocRED beam 和 Llama SciERC beam 均正常。'
  fix: 排查中：对比参数差异，用正确参数（--beam_size 4）重跑。
- id: M003
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: M002 根因更正：Reviewer 用 SciERC checker 评估 DocRED beam 输出导致误报 RV=100%，实验数据实际有效
  root_cause: Reviewer 复核 w10_llama_docred_beam_50 时使用了 violation_checker.py（SciERC
    版，无 relation name→P-code 映射），而非 violation_checker_docred.py（有 build_relation_name_to_id()）。SciERC
    checker 将模型输出的自然语言 relation 名称全部标记为 RV 违规。区分标志：SciERC checker 输出含 total_samples，DocRED
    checker 输出含 total_documents。
  prevention: 1. DocRED 实验评估必须用 violation_checker_docred.py，已在 evaluation/ 目录添加 README
    说明。2. Reviewer 复核 DocRED 实验时先确认 checker 版本（检查输出字段 total_documents vs total_samples）。3.
    发现异常（如 RV=100%）时先排查工具链再下结论。
  status: active
  context: 原 M002 将根因归咎于 beam search 参数差异（--beam_size vs --decoding_strategy），实际不存在此差异。数据全程有效，经
    Reviewer 用正确 checker 独立验证确认 DR=0%, RV=0%, CF=0.94%。
  fix: Reviewer 用 violation_checker_docred.py 重新验证，确认所有指标与 Agent 首次报告一致。Registry 恢复
    success，appendix 表格恢复。evaluation/ 目录添加 checker 选择文档。
- id: M004
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: 'R4 MF1 fix reversed: Agent upgraded R² from 0.886 to 0.99 in Abstract
    instead of removing it; F-test p-value not updated (old p=0.058 kept with new
    F=198.0)'
  root_cause: 'Three compounding errors: (1) MF1 instructed "改为定性描述" but Agent interpreted
    as "use calibrated-only R²=0.99" — strengthening the claim instead of removing
    it; (2) Agent updated F-statistic from ~15.54 to 198.0 for the new fit but copy-pasted
    the old p≈0.058 without recalculating (F(1,2)=198 → p≈0.005); (3) M1 (RV=0.03%
    unification) was marked done but paper still says "partial JSON recovery" not
    matching rebuttal''s "XGrammar bug". Root issue: batch of 21 fixes across 3 batches
    lacked per-fix verification against the original instruction.'
  prevention: 'For critical fixes (MF-level): (1) Director must specify exact target
    text, not just intent ("remove R² value entirely, replace with: residual DR correlates
    with..."); (2) After fix batch, Director reads the specific lines to verify critical
    fixes before submitting to review; (3) Statistical claims require mathematical
    consistency check (if F changes, p must be recalculated)'
  status: active
  context: R4 审稿 MF1 要求 Abstract 移除 R²=0.886 数值改为定性描述。Agent 执行后改为 R²=0.99 (n=4 calibrated
    models)，反而更突出了统计声明。同时 Appendix 中 F(1,2)=198.0 对应 p≈0.005 而非 p≈0.058（0.058 是旧版
    R²=0.886 的 p 值）。M1 (RV=0.03%) 同样未完成：论文仍写 "partial JSON recovery"。Round 5 R1 reviewer
    全部抓出。
  related_decisions:
  - D038

- id: M011
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: Qwen RoV=0.4% 根因分析错误——归因为"旧代码截断伪影"，实际是系统性 continuation masking 缺陷
  root_cause: Reviewer 首次分析时基于时间线推断（eval 在旧代码时间窗，新代码用不同 tokenizer 无此问题）。但新代码新 run
    仍得 0.34% (18/5330)，PlaceOfEmployment 在不支持的 event types 中出现，证明是系统性问题。根因分析偏向了最容易解释的假说（截断伪影），未要求
    Agent 实际检查 violation 内容。
  prevention: 1. 根因分析必须基于 violation 内容的逐条检查，不能仅基于时间线推断。2. 声称问题已解决前，必须在新数据上验证（而非假设新
    run 会自动修复）。3. RoV/AC 非零时，即使数值很小（0.3%），也必须逐条分析 violation pattern 后才能声称"可忽略"。
  status: active
  context: 'Reviewer Loop #17 发现 Qwen 新 run RoV=0.34% 与旧 run 0.4% 几乎相同，18 个 violation
    中 PlaceOfEmployment 是常见角色。同时 Mistral AC=16.6% 说明 entity_type 约束也有 tokenizer 相关问题（D044
    只修了 role，未完全修 entity type）。'
  related_decisions:

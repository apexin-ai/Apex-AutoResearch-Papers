- id: M006
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: Llama 重启缺少 --skip_on_error，Director 两次指令均未被执行
  root_cause: Agent 队列深度过大（6条），指令在排队中被新消息淹没。Agent 处理 crash fix worker 时可能只做了 --resume
    未加 --skip_on_error。Director 指令措辞包含多个选项（降 max_new_tokens / skip_on_error / resume），Agent
    可能只选了部分执行。
  prevention: 1. 关键参数（如 --skip_on_error）单独列为硬要求，不与其他选项混排；2. 队列深度 >3 时考虑用 replace_agent_queue
    合并；3. 重启类指令完成后 Reviewer 验证实际命令行参数
  status: active
  context: Llama WikiEvents unconstrained 第一次崩溃 doc 11，第二次崩溃 doc 52，均为 AttributeError
    (parsed 返回 list 而非 dict)。Director 两次指令要求加 --skip_on_error，但 crash fix worker 只加了
    --resume。当前进程 78/246 在跑，如再遇到同类文档将第三次崩溃。

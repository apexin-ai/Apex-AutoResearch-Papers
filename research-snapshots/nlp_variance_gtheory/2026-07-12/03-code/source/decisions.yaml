- id: D013
  date: 2026-05-21 21:48 UTC
  summary: 'D013: Narrative 从 "dichotomy" 软化为 "format-conditional variance structure"，等
    8-model 数据确认'
  rationale: 6-model permutation test p=0.067 不显著，HellaSwag item_id=32% 弱化 MC 集群（原
    42-49% → 32-42%），model:item 在 MC 反而更高（~35% vs FF ~16%）。"Dichotomy" claim 在当前数据下不可防守。但描述性
    pattern 仍然存在：MC item_id 32-42% vs FF 14-20%（~2:1 比率）。修正方向：(1) "dichotomy" → "format-conditional
    variance structure"；(2) model:item 重新诠释为"MC 的 item 选择对 model 排名影响更大"，强化 item 选择实践建议；(3)
    承认 n=5 统计功效限制但强调效应量（Cohen's d）。8-model 数据可能改善 p 值但不依赖它。最终叙事调整等 8-model 结果后确定。
  related_experiments:
  - exp_id: exp-004
    role: trigger
    result: 6-model permutation p=0.067, model:item MC>FF

- id: D014
  date: 2026-05-21 22:01 UTC
  summary: 'D014: 考虑叙事升级 "format-conditional" → "item-heterogeneity-driven variance
    structure"，待 8-model + 独立验证后确认'
  rationale: MATH item_id=26.48% 位于 MC(32-42%) 和 GSM8K(16.86%) 之间，打破 MC/FF 简单二分。排序
    ARC(42)>MMLU(40)>HellaSwag(32)>MATH(26)>GSM8K(17) 与 item 异质性（difficulty variance）高度相关，而非纯
    format。HellaSwag 低于其他 MC（均匀 completion 任务）、MATH 高于 GSM8K（代数→竞赛级跨度大），均符合此解释。如果成立，这是比
    format 更本质的机制解释，且可通过独立验证（item difficulty variance、within-MMLU subject gradient）支撑。需要
    8-model 数据确认 + 2 个独立检验后才正式采用。
  related_experiments:
  - exp_id: exp-004
    role: trigger
    result: MATH item_id=26.48% breaks MC/FF binary
  - exp_id: exp-002
    role: baseline
    result: 4-model format-conditional pattern
  depends_on:
  - D013
- id: D015
  date: 2026-05-21 22:55 UTC
  summary: 'D015: MMLU subject gradient 确认 item heterogeneity 机制 (ρ=0.806, p=0.005)'
  rationale: MMLU 10 subjects × 8 models 分析证实 item difficulty heterogeneity (std(p))
    是 item_id% 的强预测因子（ρ=0.806, p=0.005）。关键证据：(1) high_school_math (MC) item_id%=10.4%，低于
    GSM8K (FF) 16.86% — 证明 format 不是唯一驱动因素；(2) MMLU 内部 item_id% 范围 (10.4-47.5%) 与跨
    benchmark 范围 (16.9-42.5%) 几乎一样宽；(3) 跨 benchmark 相关 ρ=0.70 方向一致但 n=5 功效不足。叙事从描述性
    "format-conditional"（D013）升级为机制性 "item heterogeneity drives variance structure"：response
    format 通过 item heterogeneity 通道影响方差结构，FF benchmarks 倾向于有更均匀的 item difficulty 分布。这使
    Claim 2 从描述性 finding 升级为机制性 finding。
  related_experiments:
  - exp_id: exp-004
    role: primary
    result: MMLU subject gradient ρ=0.806 p=0.005; cross-benchmark ρ=0.70 n.s.
  - exp_id: exp-002
    role: supporting
    result: cross-benchmark item_id% pattern
  depends_on:
  - D014
  - D013
- id: D016
  date: 2026-05-21 23:08 UTC
  summary: 'D016: G_item MC/FF 对比暂停 — MC 和 FF G-study 使用了不同公式（multi-facet vs single-condition
    G）'
  rationale: 'Reviewer 发现 MC G-study (MMLU 0.896, ARC 0.892) 用 multi-facet G（交互项除以
    facet levels），FF G-study (GSM8K 0.284, MATH 0.363) 用 single-condition G（交互项未除以
    n_facets）。D-study 反推 GSM8K multi-facet G=0.863，与 MC 几乎相同。"MC G≥0.82 vs FF G≤0.36"
    是苹果比橘子，暂停引用。叙事回落到 item_id% 差异（真实存在: MC ~38% vs FF ~17-26%）和 D015 item heterogeneity
    机制。若统一后 G_item 差距消失，叙事聚焦"不同 format 需要不同优化策略"而非"FF 不可靠"。'
  related_experiments:
  - exp_id: exp-004
    role: primary
    result: MC G-study vs FF G-study 公式不一致
  - exp_id: exp-002
    role: supporting
    result: D-study GSM8K multi-facet G=0.863
  depends_on:
  - D015

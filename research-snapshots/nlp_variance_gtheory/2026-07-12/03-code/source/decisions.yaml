  summary: 'D007: 审稿 Round 1 Action Matrix — 3 MF + 10 SF 逐条处理方案'
  rationale: 审稿 Round 1 评分 Borderline 3.0。核心系统性问题：定量精度弱于定性 insight（MF1 binary data
    + MF2 model facet + MF3 scope overclaim 交叉放大）。策略：(1) 加固定量基础——GLMM logistic-link
    sensitivity + Bernoulli-adjusted decomposition + model-as-fixed analysis；(2) 诚实定位——quasi-random
    model, knowledge-to-reasoning continuum scope, empirical extension of Mesting；(3)
    补统计检验——permutation test, progressive D-study validation, T=0 seed stratification。全部
    MF 可修复。6 项分析任务已派 Agent 在现有数据上执行（无需新 GPU），同时等待 Reviewer 独立评估 Action Matrix。

- id: D010
  date: 2026-05-21 14:29 UTC
  summary: Claim 1 从 "cross-benchmark gradient" 转向 "format-conditional dichotomy"（MC
    vs free-form）
  rationale: exp-002 数据否定了单调梯度假设：MC benchmarks 内部无序（ARC 49% > HellaSwag 44% > MMLU
    42%），只有 MC 整体 vs free-form 有清晰分界。绝对方差分析显示 GSM8K item_id% 低不是因为 item 差异小（σ² 可比），而是
    model/prompt/model:prompt 三项在 GSM8K 中合计 37%（MC 中 <1%）导致分母膨胀。Dichotomy 叙事更准确、更可辩护、有更清晰的
    actionable implication（不同格式需要不同 reproducibility budget）。排列检验也因二元统计量被证明无效（M016），gradient
    假设缺乏统计支持。
  related_experiments:
  - exp_id: exp-002
    role: primary evidence
    result: MC item_id 42-49% internally unordered; GSM8K qualitative shift with model
      15% + prompt 12%
  - exp_id: exp-001
    role: baseline
    result: MMLU single-model item_id 61.1%, cross-model 42.1%
  depends_on: []

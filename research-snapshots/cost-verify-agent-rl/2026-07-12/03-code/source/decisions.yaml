  rationale: 'exp017 SFT eval: 5% success (1/20)，format_ok 从 100% 降至 75%，action_is_valid
    从 90% 降至 63.8%。25% episodes parse 失败（1 步退出）。expert trajectory 格式与 RAGEN <think>/<answer>

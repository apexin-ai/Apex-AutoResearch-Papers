- id: D021
  date: 2026-05-14 22:34 UTC
  summary: exp020 系列 0% success 根因确认：SFT 训练格式与 RAGEN 格式不匹配，走方案 B 重训
  rationale: 同一 checkpoint 在 eval_sft_fast 中 20% success，在 RAGEN 中 0%。根因三个：(1) system
    prompt 矛盾（RAGEN 说不要标签又说要标签）(2) observation 格式完全不同（RAGEN 有 Turn N/State/Reward
    包装，SFT 数据没有）(3) temperature 差异。RAGEN 的多轮结构是 GRPO rollout 必需的，不能去掉。正确方案是将 SFT 数据转换为
    RAGEN 格式重训，而非改 RAGEN 适配 SFT。
  related_experiments:
  - exp_id: exp020_grpo_from_sft
    role: evidence
    result: AssertionError, 未运行
  - exp_id: exp020b_grpo_from_sft
    role: evidence
    result: val_before_train success=0%, action_is_valid=16.7%
  - exp_id: exp020c_grpo_from_sft
    role: evidence
    result: hydra config error
  - exp_id: exp020d_grpo_from_sft
    role: evidence
    result: killed, 同 exp020b 配置
  depends_on:

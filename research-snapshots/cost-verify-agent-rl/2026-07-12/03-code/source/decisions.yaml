    使用 γ-discount，per-window return 不同（非 flat）。实际机制：成功 episode 早期 window 获 γ^k 衰减
    return（γ^{N-1}=γ^24≈29%, where N=⌈T/h⌉=25），失败 episode 所有 window 获相同近零 advantage。这比之前的

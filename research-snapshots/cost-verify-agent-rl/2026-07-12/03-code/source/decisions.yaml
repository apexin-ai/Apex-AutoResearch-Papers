    从 exp008_sft checkpoint 开始微调（已有 100% format_ok），用较低 LR 防止遗忘 format。预计 ~1.5h。方案
    A（直接 GRPO）信号改善极小（5% vs 4.7%），方案 D 工程量太大。'

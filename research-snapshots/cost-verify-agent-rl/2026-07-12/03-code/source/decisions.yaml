- id: D019
  date: 2026-05-14 16:48 UTC
  summary: Kill exp019 — move→put 替换方向错误，admissible_commands 中是 move 不是 put
  rationale: Reviewer critical 确认：ALFWorld handcoded expert 代码 5 种任务类型全部用 "move {}
    to {}" 检查 admissible_commands，RAGEN env.py action_is_available 检查 action in admissible_commands。fix_expert_sft_format.py
    将 2157 条正确的 "move" 替换为 "put in/on"，教模型产生不在 admissible_commands 中的动作，会进一步恶化 action_is_valid。正确修复方向：保留

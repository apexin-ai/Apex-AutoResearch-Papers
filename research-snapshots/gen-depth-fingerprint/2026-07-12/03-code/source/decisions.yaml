  summary: plan-015 最终结果：叙事从"无检测器>0.70"调整为"ensemble 跨生成器一致性优势"
  rationale: Binoculars bug 修复 + LD-Score CV 泄漏修复后，Avg-LogProb(0.77) 和 LD-Score(0.72)
    点估计超 0.70 阈值。但它们 CI 极宽（下界 0.59-0.62），说明跨生成器不稳定。7-feature CI 极窄 [0.786, 0.799]。叙事调整：不再说"无检测器达到
    0.70"，改为"单检测器跨生成器性能不稳定（CI 跨越 0.59-0.82），我们的 7-feature ensemble 提供一致且显著更强的 depth
    estimation（0.80, p<0.001 vs all baselines）"。核心 contribution 仍然成立——ensemble 优势在于互补
    + 一致性，而非单一检测器完全无能。
  related_experiments:

- id: D009
  date: 2026-05-15 03:00 UTC
  summary: 'D009: Claim 3 (Downstream Utility) 为负面结果——depth-aware curation 不优于随机抽样，reframe
    为 diagnostic-not-curative'
  rationale: plan-004-v2 13/15 runs 结果明确：等量对比中 size_matched(随机对照, ppl=2.367) 优于 depth01(2.387)
    和 binary_filtered(2.389)，跨 seed SD<0.001。数据量主导（all 12299 samples ppl=2.335 最优），深度分层和二分检测过滤均不如随机抽样。Claim
    3 原表述"depth-aware filtering outperforms binary detection baselines"不成立。Reframe
    为诚实负面发现："depth fingerprints are effective diagnostic tools for characterizing
    text provenance depth, but depth-aware curation does not improve downstream CLM
    quality compared to random subsampling — the primary determinant is data quantity,
    not depth composition." 这是 dream median/worst 预测到的结果（downstream utility p=0.31）。论文仍可基于
    Claims 1+2 投稿，Claim 3 作为 negative finding section 增加论文诚实度。
  related_experiments:
  - exp_id: plan-004-v2
    role: evidence
    result: size_matched(2.367) < depth01(2.387) < binary_filtered(2.389), all(2.335)
      best by volume, SD<0.001

experiments:
- id: baseline
  description: Qwen3-8B zero-shot ReAct baseline on ALFWorld (47 tasks)
  claim: context
  priority: 0
  status: done
  registry_id: vanilla-react-baseline
  depends_on: []
  results:
    accuracy: 42.6% (20/47)
- id: data-collection
  description: GPT-5.2 trajectory collection for SFT training data
  claim: prerequisite
  priority: 0
  status: done
  registry_id: traj_collect_500
  depends_on: []
  results:
    success_rate: 70.2% (501/714)
    cost: $8.86
- id: v3-pilot
  description: 'v3 format-aligned pilot: vanilla/TaxEI/random single-seed eval'
  claim: supplement
  priority: 0
  status: done
  registry_id: v3-vanilla-eval
  depends_on:
  - data-collection
  results:
    vanilla: 74.5%
    taxei: 66.0%
    random: 51.1%
  notes: 'Superseded by v4. All registry: mini-vanilla-sft-v3, mini-taxei-sft-v3,
    mini-random-sft-v3, v3-vanilla-eval, v3-taxei-eval, v3-random-eval'
- id: multiseed-vanilla
  description: Vanilla SFT 3-seed verification (clean data only, 4,358 samples)
  claim: C1
  priority: 1
  status: done
  registry_id: v4-vanilla-eval-r3
  depends_on:
  - data-collection
  results:
    seed42: 61.7%
    seed0: 68.1%
    seed123: 66.0%
    mean_sd: 65.3% ± 3.3pp
  notes: 'Train: mini-vanilla-sft-v4, v4-vanilla-seed0, v4-vanilla-seed123. Eval:
    v4-vanilla-eval-r3, v4-vanilla-seed0-eval, v4-vanilla-seed123-eval'
- id: multiseed-taxei
  description: TaxEI SFT 3-seed verification (clean + taxonomy-tagged injections,
    9,029 samples)
  claim: C1,C2,C3
  priority: 1
  status: done
  registry_id: v4-taxei-eval
  depends_on:
  - data-collection
  results:
    seed42: 61.7%
    seed0: 46.8%
    seed123: 61.7%
    mean_sd: 56.7% ± 8.6pp
    vs_vanilla_paired_t_p: 0.32 (NS)
    vs_vanilla_pooled_p: 0.054 (NS at α=0.05)
  notes: 'Train: v4-taxei-sft-r2, v4-taxei-seed0, v4-taxei-seed123. Eval: v4-taxei-eval,
    v4-taxei-seed0-eval, v4-taxei-seed123-eval'
- id: multiseed-random
  description: Random SFT 3-seed verification (clean + unlabeled injections, 9,029
    samples)
  claim: C2,C3
  priority: 1
  status: done
  registry_id: v4-random-eval
  depends_on:
  - data-collection
  results:
    seed42: 66.0%
    seed0: 55.3%
    seed123: 68.1%
    mean_sd: 63.1% ± 7.0pp
    vs_taxei_paired_t_p: 0.034 (suggestive, df=2)
    vs_taxei_pooled_p: 0.170 (NS)
  notes: 'Train: v4-random-sft-r2, v4-random-seed0, v4-random-seed123. Eval: v4-random-eval,
    v4-random-seed0-eval, v4-random-seed123-eval'
- id: dose-response-taxei
  description: TaxEI dose-response curve (10%/25%/50% injection, fixed 4,358 total,
    seed=42)
  claim: C3
  priority: 1
  status: done
  registry_id: v4-taxei-fixed-inject50-eval
  depends_on:
  - multiseed-vanilla
  results:
    inject0_baseline: 61.7% (vanilla seed=42)
    inject10: 61.7% (0pp)
    inject25: 48.9% (-12.8pp)
    inject50: 51.1% (-10.6pp)
    pattern: 'threshold-plateau: 10% harmless, 25% catastrophic collapse, 50% no further
      worsening'
  notes: 'Train: v4-taxei-fixed-inject10, v4-taxei-fixed-inject25-r2, v4-taxei-fixed-inject50.
    Eval: v4-taxei-fixed-inject10-eval, v4-taxei-fixed-inject25-eval, v4-taxei-fixed-inject50-eval'
- id: dose-response-random
  description: Random dose-response curve (10%/25%/50% injection, fixed 4,358 total,
    seed=42)
  claim: C3
  priority: 1
  status: done
  registry_id: v4-random-fixed-inject50-eval
  depends_on:
  - multiseed-vanilla
  results:
    inject0_baseline: 61.7% (vanilla seed=42)
    inject10: 68.1% (32/47, +6.4pp)
    inject25: 55.3% (26/47, -6.4pp)
    inject50: 57.4% (27/47, -4.3pp)
  notes: 'Train: v4-random-fixed-inject10, v4-random-fixed-inject25, v4-random-fixed-inject50.
    Eval: v4-random-fixed-inject10-eval, v4-random-fixed-inject25-eval, v4-random-fixed-inject50-eval.
    Random 10% positive effect contrasts with TaxEI 10% zero effect.'
- id: recovery-eval
  description: Recovery rate under injected errors (seed=42, 47 tasks, round-robin
    P1/P2/C1/C4)
  claim: C4,C5
  priority: 1
  status: done
  registry_id: v4-taxei-recovery-eval-r2
  depends_on:
  - multiseed-vanilla
  - multiseed-taxei
  - multiseed-random
  results:
    vanilla_recovery: 61.7%
    taxei_recovery: 59.6%
    random_recovery: 63.8%
    detection_rate: 0% (all methods)
    taxei_per_operator: C1=66.7%, C4=63.6%, P1=58.3%, P2=50.0%
  notes: 'All registry: v4-vanilla-recovery-eval, v4-taxei-recovery-eval, v4-taxei-recovery-eval-r2,
    v4-random-recovery-eval'
- id: recovery-paired-injection
  description: 'Recovery-paired error injection on ALFWorld: each injected error trajectory
    is immediately followed by the correct recovery demonstration (mimicking PALADIN''s
    recovery-pairing design). Compare TaxEI-RP vs TaxEI (unpaired) vs Vanilla to disentangle
    recovery-pairing from task-structure hypothesis.

    '
  claim: C7
  priority: 1
  status: done
  depends_on:
  - multiseed-taxei
  - multiseed-vanilla
  results:
    seed42: 38.3%
    seed0: 46.8%
    seed1: 48.9%
    seed123: 57.4%
    mean_sd: 47.9% ± 7.8pp
    vs_taxei: -10.4pp (worse)
    vs_vanilla: -19.4pp (worse)
    detection_rate: 0% (all seeds)
    key_finding: Recovery pairing actively harms — not PALADIN's missing ingredient.
      Task structure confirmed as primary moderator (D043).
  notes: 'D043: Recovery-paired injection (14,437 samples = TaxEI 9,029 + recovery
    continuations 5,408) performs WORSE than unpaired TaxEI. Recovery demonstrations
    do not teach active recovery in embodied planning. Claim 7 definitively answered:
    No. s7 training in progress for 5th seed.'
  registry_id: v4-taxei-rp-s1
- id: webshop-replication
  description: 'CANCELLED (D040): Downgraded to Discussion section analysis. P1_StepOrderSwap
    incompatible with WebShop linear action space (search+click only). Taxonomy 4→3
    makes cross-env comparison inequivalent.'
  claim: C6
  priority: 1
  status: cancelled
  depends_on:
  - dose-response-random
  notes: 'D040: P1 produces illegal sequences in WebShop. 12-17 day workload, 35
    GPU-h (64% budget). Replaced by Discussion paragraph analyzing ALFWorld vs WebShop
    structural differences. GPU-h redirected to recovery eval multi-seed + TaxEI-RP
    seed 7.'
- id: 5-seed-extension
  description: Extend main conditions (Vanilla, TaxEI, Random full-scale) from 3 to
    5 seeds. Add seeds 1 and 7.
  claim: C1,C3
  priority: 1
  status: done
  depends_on:
  - multiseed-vanilla
  - multiseed-taxei
  - multiseed-random
  registry_id: v4-random-seed7
  results:
    vanilla_5seed: 67.3% ± 4.7pp (61.7/68.1/66.0/66.0/74.5)
    taxei_5seed: 58.3% ± 6.5pp (61.7/46.8/61.7/59.6/61.7)
    random_5seed: 58.3% ± 8.7pp (66.0/55.3/68.1/46.8/55.3)
    key_finding: TaxEI = Random = 58.3% = 137/235 identical means, taxonomy labels
      zero benefit
    vanilla_vs_injection_p: 0.039 (Welch, uncorrected), Bonferroni NS
    cohens_d_vanilla_taxei: 1.58
    cohens_d_vanilla_random: 1.28
    power_at_n5: 45.2%, need n=9 for 80%
  notes: 'D032: 5-seed data shows TaxEI=Random identical. Variance gradient reversed
    vs 3-seed: Vanilla(4.7) < TaxEI(6.5) < Random(8.7). Train: v4-vanilla-seed1/7,
    v4-taxei-seed1/7, v4-random-seed1/7. Eval: all *-eval variants.'
- id: recovery-eval-multiseed
  description: 'Recovery eval for seeds 0, 1, 7, 123 across Vanilla/TaxEI/Random.
    Validates per-operator patterns beyond seed=42. Need to retrain seed=0/123 checkpoints
    (cleaned from disk).

    '
  claim: C4,C5
  priority: 1
  status: planned
  depends_on:
  - 5-seed-extension
  notes: 'Retrain seed=0/123 checkpoints (~6h), then run recovery eval on all 5 seeds
    per condition. Strengthens per-operator local/global split from exploratory to
    confirmatory. ~15 GPU-hours total.

    '
- id: training-dynamics
  description: 'Per-sample loss analysis: clean vs injected loss trajectories across
    checkpoints. Forward pass on 6 checkpoints (3 TaxEI + 3 Random seeds).'
  claim: C3
  priority: 1
  status: done
  registry_id: v4-training-dynamics-forward-v2
  depends_on:
  - multiseed-taxei
  - multiseed-random
  results:
    training_loss_sd: 0.0004 (cross-seed, extremely stable)
    injected_vs_clean_loss: injected < clean (deeper memorization)
    key_finding: memorization-generalization dissociation — injected memorized better
      but eval worse
  notes: 'D027: Training loss stable SD=0.0004. D029: Forward pass v2 (trajectory-level)
    confirms injected samples memorized deeper. Per-operator loss inversely correlates
    with recovery harm. v1 had classification bug (turn-level), v2 fixed.'
- id: qualitative-failure-analysis
  description: 'Failure mode categorization across Vanilla/TaxEI/Random from eval
    logs. Key finding: TaxEI 2.2× loop_repetition rate.'
  claim: C1,C6
  priority: 1
  status: done
  registry_id: qualitative-failure-analysis
  depends_on:
  - 5-seed-extension
  results:
    taxei_loop_repetition_rate: ~2.2× Vanilla (unbalanced: 3-seed V/T 141 ep, 1-seed
      R 47 ep)
    vanilla_loop_repetition_rate: baseline reference
    random_loop_repetition_rate: ~similar to Vanilla
    key_finding: TaxEI loop_repetition ratio ~2.2× Vanilla stable across subsets.
      Absolute rates pending balanced 5-seed trajectory collection.
  notes: 'D026: Ratio (2.2×) directionally consistent but artifact metadata falsely
    claims "balanced 235 episodes". Actual: V=141, T=141, R=47. Clean eval trajectory
    collection needed for true 5-seed balance. Absolute percentages (34.8%/15.6%/12.8%)
    were extrapolated, not measured — do NOT use in paper without verification.'
- id: extended-stats
  description: Bootstrap CI, power analysis, effect size, Bayesian analysis for 5-seed
    data.
  claim: C1,C3
  priority: 1
  status: done
  depends_on:
  - 5-seed-extension
  results:
    bootstrap_ci_95: '[+3.4, +15.8] pp (Vanilla - injection pooled)'
    paired_t_p: 0.073 (marginal)
    welch_t_p: 0.039 (uncorrected), Bonferroni NS
    bayes_factor: 0.68 (inconclusive)
    power_at_n5: 45.2%
    n_needed_80pct_power: 9
    cohens_d_vanilla_taxei: 1.58
    cohens_d_vanilla_random: 1.28
    taxei_vs_random_p: 1.000 (identical means)
  notes: 'D030-D032: Complete 5-seed statistical analysis. Large effect size but underpowered.
    Bayesian inconclusive. Bootstrap significant. Variance test: Levene p=0.45 (NS).'
- id: dose-response-5seed
  description: 'Extend all dose-response to 5 seeds: 10% (from 1→5), 25%/50% (from
    3→5). Both TaxEI and Random.'
  claim: C3
  priority: 1
  status: done
  depends_on:
  - 5-seed-extension
  registry_id: v4-random-fixed-inject50-s7
  results:
    taxei_10pct: 61.3% ± 8.2pp (61.7/70.2/55.3/51.1/68.1)
    random_10pct: 63.8% ± 5.4pp (68.1/66.0/55.3/68.1/61.7)
    taxei_25pct: 52.7% ± 7.6pp (48.9/46.8/46.8/63.8/57.4)
    random_25pct: 60.0% ± 8.0pp (55.3/61.7/51.1/72.3/59.6)
    taxei_50pct: 57.4% ± 9.5pp (51.1/70.2/46.8/63.8/55.3)
    random_50pct: 58.3% ± 11.7pp (57.4/46.8/70.2/70.2/46.8)
    key_finding: 'Inverted-U taxonomy penalty: 10% (-2.5pp) → 25% (-7.3pp peak) →
      50% (-0.9pp) → Full (0pp). No safe dose. Universal training lottery at all doses.'
  notes: 'D034/D035/D036/D038: Complete 5-seed dose-response. 10% overturned D017
    zero-harm. 25% overturned D023 deterministic-harm. 50% confirms rebound. Taxonomy
    penalty peaks at 25% and fades. ~24 GPU-hours total.'

  - name: Qualitative Failure Analysis
    plan_id: qualitative-failure-analysis
    description: 人工检查 25 个 TaxEI 失败案例（重点来自 seed=0 的 collapse），分类失败模式，区分 noise corruption
      与 wrong learning
    expected_results:
      total_cases_examined: 25
      cases_from_seed0: 15
      cases_from_seed42_seed123: 10
      type_a_incoherent_planning_count: 11
      type_a_pct: 44
      type_b_systematic_wrong_action_count: 8
      type_b_pct: 32
      type_c_premature_termination_count: 4
      type_c_pct: 16
      type_d_correct_plan_execution_error_count: 2
      type_d_pct: 8
      seed0_type_a_pct: 53
      seed42_123_type_a_pct: 30
      seed0_type_b_pct: 27
      seed42_123_type_b_pct: 40
      random_type_a_pct: 30
      random_type_b_pct: 20
      random_type_c_pct: 30
      random_type_d_pct: 20
      p1_echo_cases: 3
      p2_echo_cases: 2
      recovery_behavior_in_wrong_context: 4
    result_rationale: 'Median 档下，failure analysis 揭示混合机制——既有 noise corruption 也有 wrong
      learning， 不能简单归因于单一原因。 Type A (incoherent planning, 44%) 代表 noise corruption：模型产生的动作序列虽然句法合法
      但逻辑矛盾（先 heat 再 pick up，或导航到不相关位置）。这在 seed=0 中特别突出 (53%)， 与 seed=0 的 catastrophic
      collapse (46.8%) 一致——这个 seed 的训练过程中 noise 占了上风。 Type B (systematic wrong action,
      32%) 代表 wrong learning：模型一致性地选择错误对象或 位置，暗示它从注入样本中学到了特定的错误关联。值得注意的是 Type B 在
      seed42/123 中 比例更高 (40%)——这些 seed 整体表现尚可 (61.7%)，但失败案例中 wrong learning 占主导。 在
      3 个案例中发现了明确的 "error echo"——模型的错误模式直接镜像了 P1 (step_order_swap) 注入的动作排列错误。4 个案例显示模型在不需要恢复的正常任务中执行了类似恢复的行为
      （如反复检查已确认的对象），说明注入训练 taught the model to be cautious in wrong contexts。 与 Random
      失败案例的对比显示 TaxEI 的 Type B 比例更高 (32% vs 20%)，支持 "taxonomy labels teach specific
      wrong behaviors" 的 claim，但样本量太小 (25 vs 10) 无法做统计检验。

      '

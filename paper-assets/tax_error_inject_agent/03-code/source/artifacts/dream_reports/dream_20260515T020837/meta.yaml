      right），而 TaxEI inject negative signal（what goes wrong）。 论文可以在 Discussion 中构建一个
      2×2 框架：training vs inference × positive vs negative signal，argue that embodied
      planning 需要 inference-time positive signal (EEF-like) 而非 training-time negative
      signal (TaxEI-like)。


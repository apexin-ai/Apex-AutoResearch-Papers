      taxei_P1_sd_pp: 11.2
      taxei_P2_mean_pct: 48.6
      taxei_P2_sd_pp: 6.8
      vanilla_C1_mean_pct: 62.5
      vanilla_C1_sd_pp: 4.2
      vanilla_C4_mean_pct: 55.6
      vanilla_C4_sd_pp: 5.0
      vanilla_P1_mean_pct: 61.1
      vanilla_P1_sd_pp: 6.3
      vanilla_P2_mean_pct: 56.9
      vanilla_P2_sd_pp: 4.8
      gap_C1_pp: -2.1
      gap_C4_pp: 3.1
      gap_P1_pp: -5.5
      gap_P2_pp: -8.3
      single_seed_gap_C1_pp: -8.3
      single_seed_gap_C4_pp: 9.1
      single_seed_gap_P1_pp: -3.4
      single_seed_gap_P2_pp: -8.3
      paired_t_C4_p: 0.22
      paired_t_P2_p: 0.06
      paired_t_P1_p: 0.15
      paired_t_C1_p: 0.35
    result_rationale: 'Median 档下，multi-seed recovery 揭示单 seed per-operator 数据的不可靠性。
      (1) C4 (observation_masking)：单 seed 显示 +9.1pp 优势，3-seed 均值缩水到 +3.1pp。 原因：C4
      注入 masks observations，而 ALFWorld 任务中 observation 的重要性因 task instance 而异——有些任务即使
      masked 也能靠 prior knowledge 解决，造成高 cross-seed 方差。 单 seed 的 +9.1pp 大概率是有利 task
      sampling 的结果。但方向仍然正确（唯一 positive gap）， 说明 observation masking 可能是最接近 "locally
      recoverable" 的 operator—— 模型可以学会在信息不足时更 conservative 地行动。 (2) P2 (sub_goal_deletion)：3-seed
      均值 -8.3pp，与单 seed 完全一致，SD 仅 6.8pp。 这是最 robust 的 per-operator finding。理由：sub-goal
      deletion 造成的 cascading failure 最严重——跳过一个 sub-goal 直接导致后续所有步骤无效，这正是 embodied
      planning 中 error injection 失败的典型机制。TaxEI 不但没学会避免这类错误，反而在某些 instances 中复制了 deletion
      模式（与 qualitative analysis 的 error echo 发现一致）。 (3) P1 (step_order_swap)：SD 最高
      (11.2pp)，说明 step ordering 的影响高度 task-dependent。 有些任务的 step 可以部分重排而不影响结果，有些则不行。
      (4) C1 (context_truncation)：从 -8.3pp 缓和到 -2.1pp，说明单 seed 高估了 harm。 总结：只有 P2
      的 negative effect 是 robust 的（p≈0.06），C4 的 positive effect 是 real but small，P1
      和 C1 的 patterns 是 noise。

      '

      paired_t_taxei_vs_vanilla_50k_p: 0.09
      train_time_25k_hours: 18
      train_time_50k_hours: 36
      total_gpu_hours: 162
    result_rationale: 'Median 档预测 scale helps but doesn''t close the gap。理由： (1) 更多
      clean 数据直接受益所有方法——Vanilla 从 65.3% 提升到 67.5%（+2.2pp）， 因为 ALFWorld 的 47 task 的最优表现大约在
      70-75% 区间（v3 vanilla 就达到 74.5%）。 (2) TaxEI 在 25K 时提升到 60.3%（vs 9K 的 56.7%，+3.6pp），50K
      时 62.1%（+5.4pp）。 提升来自两个效应：更多 clean 样本提供更强基础信号，更大数据量让模型有更多容量 分离 error 模式和 correct
      模式。但 gap 仅从 -8.6pp 收窄到 -5.4pp，说明结构性 mismatch 不是纯 scale 问题。 (3) 方差梯度依然成立但倍率递减：9K
      2.6× → 25K 1.86× → 50K 1.80×。 更多数据 stabilize 训练，但 TaxEI 的方差始终高于 Vanilla。 (4)
      Taxonomy penalty 从 ~6.4pp 降至 ~1.9pp——大数据量下模型更能 tolerate taxonomy labels 的干扰，但
      penalty 方向始终为负。 (5) p 值从 0.32 改善到 0.09，接近但仍未突破 α=0.05——median 档的标志性特征。 关键结论：即使在
      PALADIN 级别的 50K scale，TaxEI 在 embodied planning 上仍然 inferior， 且需要 5.5× 的数据收集成本（$890
      vs $8.86）才能部分弥合差距。 这强化了 "task structure > data scale" 的论点。


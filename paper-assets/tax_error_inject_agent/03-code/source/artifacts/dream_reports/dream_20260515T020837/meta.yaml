      output），用高亮标注 error echo 和 incoherent steps。'
    analysis: '定性分析是 median 档下最有价值的补充实验。定量证据受限于 n=47 和 3 seeds， p 值卡在 0.05-0.15，无法做
      strong quantitative claims。但定性证据提供了 mechanistic insight：(1) seed=0 collapse
      主要由 incoherent planning 驱动（noise corruption）， (2) 即使在"正常"seed 中，TaxEI 的失败模式也包含可识别的
      error echoes（wrong learning）， (3) TaxEI vs Random 的失败模式分布差异（Type B 32% vs 20%）为
      taxonomy penalty 的 mechanistic 解释提供了初步证据。论文应将此作为 Section 5 的核心分析，用具体案例 支撑定量发现的方向性
      claims。措辞建议："Manual inspection reveals two co-occurring failure mechanisms —
      noise-induced incoherence and taxonomy-specific error echoes — suggesting that
      structured error injection both corrupts and misdirects the learning signal."

      '
  - name: Scale Ablation (25K/50K trajectories)
    plan_id: scale-ablation
    description: 将训练数据扩展到 25K 和 50K 轨迹，测试 PALADIN 级别数据量是否改善 TaxEI 表现
    expected_results:
      collection_25k_attempts: 36000
      collection_25k_successes: 25200
      collection_25k_cost_usd: 445
      collection_50k_attempts: 72000
      collection_50k_successes: 50400

        | 9K    | 65.3%   | 56.7%  | 63.1%  | −8.6pp  | 6.4pp       |

        | 25K   | 71.3%   | 63.8%  | 68.1%  | −7.5pp  | 4.3pp       |

        | 50K   | 74.5%   | 68.1%  | 72.3%  | −6.4pp  | 4.2pp       |

        '

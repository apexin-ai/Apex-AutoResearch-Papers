    analysis: '定性分析将统计现象 "taxonomy penalty" 具象化为可观察的行为模式：TaxEI 模型在 clean eval 中 "回放"
      训练数据中的 taxonomy 错误，特别是 P2 (sub_goal_deletion) 和 C1 (context_truncation) 两种 operator
      的特征最明显。这解释了为何 taxonomy penalty 与 dose 无关——只要训练数据中存在 taxonomy-标记的错误样本，模型就会 internalize
      特定的错误策略，无论这些样本占比多少。 与之对比，Random injection 的失败模式不呈现 operator-specific 聚类，支持其
      gradient 干扰是 diffuse 而非 structured 的解释。这一发现为论文提供了最具说服力的 "为什么 taxonomy labels
      有害" 的直觉解释，适合放在 Analysis 部分作为 bridge between statistics and mechanism。

      '
  - name: Second Environment Validation (WebShop)
    plan_id: second-environment
    description: '在 WebShop 环境中复现 Vanilla/TaxEI/Random 三组实验（2-seed），验证方差梯度和 阈值效应是否泛化到

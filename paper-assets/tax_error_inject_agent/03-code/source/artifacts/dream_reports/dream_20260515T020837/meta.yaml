      ~6.4pp，在 10→25% 处同步断崖。Vanilla baseline(灰虚线)在 61.7%。阴影区域标注共享阈值区间 [10%, 25%]。'
    analysis: '剂量-响应曲线揭示两个可分离的独立效应：(1) 共享的信噪比阈值——两种注入方法在同一临界区间 [10%, 25%] 发生等幅崩溃，证明这是
      error injection 的 fundamental property 而非 taxonomy 特异性； (2) 恒定的 taxonomy penalty——TaxEI
      在每个 dose 点均落后 Random 恰好 ~6.4pp，说明 taxonomy label 引入的是正交于注入剂量的 additive bias。Random
      10% 的 +6.4pp 增益是意外发现，提供了重要的正面 对照：说明少量未标记噪声注入本身可以是有效的 data augmentation，但 taxonomy
      label 消除了这一好处。

      '

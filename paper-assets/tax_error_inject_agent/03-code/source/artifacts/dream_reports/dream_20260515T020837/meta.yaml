  - name: Per-Operator Recovery Deep Dive
    plan_id: per-operator-deepdive
    description: 扩展 recovery eval 到 3 seeds，验证单 seed 观察到的 per-operator patterns（特别是
      C4 +9.1pp 优势）是否稳定
    expected_results:
      taxei_C1_mean_pct: 60.4
      taxei_C1_sd_pp: 8.3
      taxei_C4_mean_pct: 58.7
      taxei_C4_sd_pp: 7.1

        pooled_p_taxei_vs_vanilla:
        - 0.15
        - 0.6
        paired_t_taxei_vs_random_p:
        - 0.1
        - 0.5
        dose_response_cross_seed_agreement:
        - 0.2
        - 0.5
      narrative_direction: 三个原始 finding 均不成立为独立 claim。需要 reframe。 新 angle：error injection
        的效果被 seed variance 完全淹没—— 这本身就是 negative result，但 framing 从 "error injection
        hurts + here's why" 转向 "error injection is indistinguishable from noise in
        low-data embodied planning regimes"。 核心 contribution 变为：(1) ALFWorld SFT 的
        cross-seed variance 之大使得任何 data augmentation 策略的评估都需要 ≥5 seeds（方法论 contribution），
        (2) 在 <10K 样本规模下，error injection 的信号被训练噪声压制， 无法提供超出 seed lottery 的信息（scale-dependent
        null result）。 论文从 "boundary condition" paper 变为 "evaluation methodology" paper，
        仍可投 Negative Results workshop，但需要重写 introduction 和 contribution section。 不降级
        venue——Negative Results workshop 本身就欢迎 "we thought X mattered but it's noise"。

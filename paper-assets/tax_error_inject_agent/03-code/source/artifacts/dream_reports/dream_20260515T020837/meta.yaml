      scale_25k_taxei_sd_pp: 6.2
      scale_50k_vanilla_pct: 74.5
      scale_50k_taxei_pct: 68.1
      scale_50k_random_pct: 72.3
      scale_50k_taxei_vs_vanilla_pp: -6.4
      scale_50k_taxei_sd_pp: 5.5
      variance_gradient_holds_25k: true
      variance_gradient_holds_50k: true
      taxonomy_penalty_25k_pp: 4.3
      taxonomy_penalty_50k_pp: 4.2
      gpt52_api_cost_25k_usd: 160
      gpt52_api_cost_50k_usd: 350
    result_rationale: 'Scaling 部分缓解但不消除 TaxEI 的负面效应，原因是 scale 同时提升所有方法的绝对性能 （更多 clean
      样本 → 更好的 base policy），但 taxonomy label 的 structural interference 机制不因 scale
      消失。25K 时 TaxEI 仍落后 Vanilla 7.5pp（9K 时为 8.6pp），50K 时缩窄至 6.4pp——taxonomy penalty
      从 6.4pp 略降至 ~4.2pp，说明更多 clean 样本可以部分 "稀释" taxonomy 干扰，但不能消除它。方差梯度在两个 scale 级别持续存在（TaxEI
      SD 6.2→5.5pp 仍远高于 Vanilla 的预计 ~2.5pp），确认 training instability 是 structural 而非
      scale-limited 的问题。即使在 50K 规模（接近 PALADIN），TaxEI 仍不超过 Vanilla—— 排除 "我们只是数据不够"
      的 reviewer 质疑。PALADIN 的成功需要 scale + 显式错误信号 + inference-time retrieval 三者共同作用，单独的
      scale 不足以弥补 task-structural 缺陷。

      '
    tables:

project: tax_error_inject_agent
venue: Insights from Negative Results in NLP @ EMNLP 2026
focus: 'Negative result paper with three core findings: (1) variance gradient Vanilla<Random<TaxEI,
  (2) dose-response threshold-plateau with shared 12.8pp drop at 10-25%, (3) constant
  ~6.4pp taxonomy label penalty. All statistical comparisons NS (min p=0.054). Single-seed
  dose-response limitation.'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 所有三个核心 finding 在补充实验中得到加强：方差梯度、剂量-响应阈值-平台、~6.4pp taxonomy penalty 均在多
        seed 下复现，统计检验达到或接近显著
      key_assumptions:
      - 多 seed 剂量-响应（≥2 additional seeds）复现 10→25% 的 12.8pp 共享下降，偏差 ≤3pp
      - ~6.4pp taxonomy penalty 在所有 seed 的所有 dose 点保持稳定（SD ≤1.5pp）
      - 方差梯度 Vanilla < Random < TaxEI 在每个新增 seed 上均成立
      - 训练 loss 曲线显示注入样本系统性拉高 clean 样本 loss（corruption 信号可量化）
      - pooled permutation test TaxEI vs Vanilla 达到 p<0.05
      number_ranges:
        taxei_3seed_mean_pct:
        - 54.0
        - 58.0
        taxei_3seed_sd_pp:
        - 7.0
        - 10.0
        vanilla_3seed_sd_pp:
        - 2.5
        - 4.0
        taxonomy_penalty_per_dose_pp:
        - 5.0
        - 8.0
        taxonomy_penalty_cross_dose_sd_pp:
        - 0.3
        - 1.5
        dose_threshold_drop_pp:
        - 10.0
        - 15.0
        pooled_p_taxei_vs_vanilla:
        - 0.02
        - 0.05
        paired_t_taxei_vs_random_p:
        - 0.01
        - 0.04
        dose_response_cross_seed_agreement:
        - 0.85
        - 1.0
      narrative_direction: '原始 framing 完全成立。标题级 claim 不变：taxonomy-guided error injection
        在 embodied planning 中引入系统性训练不稳定性，且 taxonomy label 造成独立于注入剂量的恒定性能惩罚。 三个 finding
        各自有独立的多 seed 证据支撑：(1) 方差梯度是 robust ordering， (2) 阈值-平台是 error injection 的通用属性而非
        seed 偶然， (3) ~6.4pp 是 taxonomy label 的 systematic bias 而非随机波动。 训练动态分析提供 mechanistic
        explanation（注入样本污染 clean 学习信号）。 论文可以做 strong negative claim + actionable boundary
        condition guideline。

        '
    median:
      tier: median
      meaning: 方差梯度和大方向成立，但剂量-响应的具体数字跨 seed 波动较大；taxonomy penalty 存在但不再'remarkably
        stable'；统计检验仍为 marginal
      key_assumptions:
      - 多 seed 剂量-响应显示 threshold-plateau 的大致形状但阈值位置在 10-30% 间漂移
      - taxonomy penalty 跨 seed 均值 ~5-7pp 但个别 dose 点变动 3-9pp
      - 方差梯度在均值层面成立（Vanilla SD < Random SD < TaxEI SD），但个别 seed 偶尔打破 Random < TaxEI
        排序
      - 训练 loss 曲线显示注入样本 loss 更高，但对 clean 样本的 corruption 效应不明显
      - pooled p 值停留在 0.05-0.15 区间，无法突破 α=0.05
      number_ranges:
        taxei_3seed_mean_pct:
        - 55.0
        - 62.0
        taxei_3seed_sd_pp:
        - 6.0
        - 12.0
        vanilla_3seed_sd_pp:
        - 3.0
        - 5.0
        taxonomy_penalty_per_dose_pp:
        - 3.0
        - 9.0
        taxonomy_penalty_cross_dose_sd_pp:
        - 1.5
        - 3.5
        dose_threshold_drop_pp:
        - 6.0
        - 16.0
        pooled_p_taxei_vs_vanilla:
        - 0.05
        - 0.15
        paired_t_taxei_vs_random_p:
        - 0.03
        - 0.1
        dose_response_cross_seed_agreement:
        - 0.5
        - 0.85
      narrative_direction: '需要调整 claims 强度。不再称 taxonomy penalty 为 "remarkably stable
        constant"， 改为 "consistent directional penalty"（方向一致但幅度有 seed 依赖）。 剂量-响应从 "universal
        threshold-plateau" 降级为 "tendency toward non-linear degradation"。 核心叙事从三个 crisp
        finding 收缩为：(1) 方差梯度作为 primary finding（最 robust）， (2) taxonomy label 作为 amplifier
        of instability（方向性 claim）， (3) 剂量-响应作为 exploratory evidence with caveats。
        论文仍然成立为 cautionary negative result，但 contribution 更多是 "error injection 不应被默认迁移到
        embodied planning" 而非精确的定量边界条件。 可能需要补一个 qualitative failure analysis 来弥补定量证据的不足。

        '
    worst:
      tier: worst
      meaning: 核心 pattern 被证明是 seed=42 的偶然：多 seed 剂量-响应无一致 pattern，taxonomy penalty
        在部分 seed 反转或消失，方差梯度在更多数据下变得不显著
      key_assumptions:
      - 新 seed 的剂量-响应不显示 threshold-plateau——有的线性下降，有的无单调关系
      - taxonomy penalty 在某些 seed 为正（TaxEI > Random），消解 'constant offset' claim
      - 新增 seed 后 TaxEI 均值上移至 60%+，与 Vanilla 的差距缩小到 <4pp 且 p>0.3
      - 方差梯度在 5-seed 均值下 Random SD ≈ TaxEI SD，无法区分结构化注入与随机注入的不稳定性差异
      - 训练 loss 分析无信息量——注入样本与 clean 样本 loss 轨迹无系统差异

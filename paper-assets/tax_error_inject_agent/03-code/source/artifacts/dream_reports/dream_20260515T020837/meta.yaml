        P1_step_order_swap_gain_pp: 4.2
        C1_context_truncation_gain_pp: 2.1
        P2_sub_goal_deletion_gain_pp: 0.0
    result_rationale: 'Few-shot recovery 绕过 SFT 的梯度污染问题，在 inference time 提供 recovery
      信息。 Vanilla + 3-shot = 66.0% 超过 TaxEI SFT 56.7% 达 9.3pp，证明 recovery 知识可以 帮助，但
      SFT 是错误的传递方式。这隔离了两个变量：(1) recovery 信息本身是有价值的（+4.3pp over no-fewshot），(2) SFT
      注入是有害的（TaxEI SFT 56.7% 远低于 few-shot 66.0%）。 Per-operator 分析显示 few-shot 在 C4（observation
      masking）上获益最大（+8.5pp）， 与 recovery eval 中 TaxEI 在 C4 上的优势一致——说明 C4 错误的 recovery
      策略最容易通过 示例传递。P2（sub_goal_deletion）的 few-shot 增益为 0，因为 sub-goal deletion 导致的
      级联失败需要完整的 re-planning 而非局部 recovery，单个示例无法传递这种全局策略。 总体来说，few-shot 的 modest 增益（+4.3pp）远小于
      PALADIN 的 retrieval augmentation （~+30pp），因为 embodied planning 的 recovery action
      space 是 unbounded 的—— 2-3 个示例覆盖的 recovery 策略远不足以应对所有失败模式。

      '
    tables:

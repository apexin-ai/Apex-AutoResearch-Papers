      learning / noise / ambiguous）。Operator replay 流全部归入 wrong learning，标红。'
    - 'Figure: 2 个代表性 case study 并排。左: TaxEI 在 pick_clean_then_place 中跳过 clean 步骤（P2
      replay），右: Vanilla 在同一任务中选择错误 receptacle（generic failure）。注释标注 taxonomy operator

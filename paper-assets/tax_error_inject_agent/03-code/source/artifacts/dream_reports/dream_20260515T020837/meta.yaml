      最高且增长最快，TaxEI 最低但 gap 缓慢收窄。虚线标注 PALADIN 的 50K+ 规模参考点。'
    analysis: 'Scale ablation 是回应 "也许你数据不够" 这一 reviewer 质疑的关键实验。结果表明 scale 是 necessary
      but not sufficient：50K 的 TaxEI（68.1%）仍不如 9K 的 Vanilla（65.3%）在考虑 方差后可靠。Taxonomy
      penalty 从 6.4pp 降至 4.2pp 的趋势暗示在极大 scale（100K+）下 penalty 可能继续缩小，但方差梯度的持续存在意味着即使
      mean 接近，TaxEI 的 training 仍然 是一场 lottery。这为论文结论增加了 nuance：error injection 在 embodied
      planning 中不是 "永远不可能有效"，而是 "在当前可行的 scale 和方法论下，cost (variance + penalty) 远超 benefit
      (none observed)"。

      '
  - name: Few-Shot Recovery Prompting
    plan_id: recovery-prompting
    description: '在 eval 时向 prompt 中添加 2-3 个 recovery 示例（从训练数据采样），对比 Vanilla+few-shot
      vs Vanilla (no few-shot) vs TaxEI SFT，隔离 "训练信号污染" 和 "recovery 知识不足" 两个假说。

      '
    expected_results:
      vanilla_no_fewshot_pct: 61.7
      vanilla_2shot_recovery_pct: 63.8

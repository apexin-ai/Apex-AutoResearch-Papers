      0.35）。Clean loss inflation 的 TaxEI > Random 排序（16.6% vs 9.7%）完美对应 final performance
      的 Vanilla > Random > TaxEI 排序，提供了 从训练 loss 到 eval performance 的因果链。这一 mechanistic
      explanation 是论文从 "观察到负面结果" 升级为 "解释负面结果" 的关键——reviewer 可能质疑统计功效，但 loss decomposition
      提供了 independent 的 process-level 证据。injected 样本 loss 不完全收敛的现象进一步说明模型未能 有效学习错误模式——与
      PALADIN 在 tool-use 中 recovery trajectories 可以被学习形成对比。

      '
  - name: Qualitative Failure Analysis
    plan_id: qualitative-failure-analysis
    description: '手动分析 20+ TaxEI 失败案例，区分 "taxonomy-specific wrong learning"（模型学到了特定的
      错误行为）和 "random noise"（模型只是表现更不稳定），为 Claim 1 和 Claim 6 提供定性证据。

      '
    expected_results:
      total_cases_analyzed: 24
      taxei_fail_vanilla_succeed: 8
      both_fail: 10
      taxei_succeed_vanilla_fail: 6
      failure_taxonomy:
        operator_replay: 6
        action_sequence_disorder: 5
        premature_termination: 4
        wrong_object_selection: 4
        identical_to_vanilla_failure: 5
      operator_replay_pct: 25.0
      wrong_learning_pct: 62.5
      noise_pct: 20.8
      ambiguous_pct: 16.7
    result_rationale: '定性分析揭示 TaxEI 失败中最具诊断意义的模式是 "operator replay"——模型在 clean 任务中
      生成与训练数据中某种 taxonomy operator 一致的错误行为。例如，模型在 pick_clean_then_place 任务中跳过 clean
      步骤（对应 P2 sub_goal_deletion 的训练模式），或在需要仔细观察环境时 截断上下文信息（对应 C1 context_truncation
      的训练模式）。这些 operator replay 案例（6/24, 25%）是 TaxEI 特有的——Random 和 Vanilla 的失败案例中不存在与特定
      taxonomy operator 匹配的模式。另有 9/24 案例（37.5%）表现为非 operator-specific 但系统性的错误行为（action
      disorder, premature termination），合计 "wrong learning" 占 62.5%。仅 5/24（20.8%） 的失败模式与
      Vanilla 失败完全一致（baseline noise）。这一分布支持 "TaxEI 教会模型特定的 错误行为" 假说而非 "TaxEI 仅增加随机噪声"
      假说，与 training dynamics 中 TaxEI 的 structured gradient interference（cosine 0.28
      < Random 0.35）一致。

      '
    tables:
    - title: Failure Mode Taxonomy (24 cases)
      content: '| Failure Mode             | Count | Pct   | TaxEI-Specific? |

        |--------------------------|-------|-------|-----------------|

        | Operator replay (P2/C1)  | 6     | 25.0% | Yes             |

        | Action sequence disorder | 5     | 20.8% | Partially       |

        | Premature termination    | 4     | 16.7% | Partially       |

        | Wrong object selection   | 4     | 16.7% | No              |

        | Same as vanilla failure  | 5     | 20.8% | No              |

        '
    - title: Failure Attribution Summary
      content: '| Category       | Count | Pct   | Interpretation                          |

        |----------------|-------|-------|-----------------------------------------|

        | Wrong learning | 15    | 62.5% | Model internalized error patterns       |

        | Noise          | 5     | 20.8% | Indistinguishable from baseline noise   |

        | Ambiguous      | 4     | 16.7% | Could be either                         |

        '
    figures_description:

    # Dream Review Report — Full Mode


    **Paper**: "Error Injection Helps Tool-Use but Hurts Planning: Boundary Conditions
    for Failure-Augmented Agent Training"

    **Venue**: Insights from Negative Results in NLP @ EMNLP 2026

    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Scoring Framework**: ARR (Soundness/Excitement/Overall, 1–5 scale)


    ---


    ## Summary


    The paper tests whether taxonomy-guided error injection (successful in tool-use
    via PALADIN''s +57pp on ToolBench) transfers to embodied planning (ALFWorld).
    Using a 4-operator error taxonomy and training Qwen3-8B under Vanilla/TaxEI/Random
    conditions, the authors report a negative result: TaxEI degrades performance and
    increases variance. Dose-response experiments, training dynamics analysis, qualitative
    failure analysis, WebShop replication, scale ablation, few-shot recovery, and
    per-operator analysis are presented. The paper concludes that error injection
    requires discrete, observable, locally recoverable errors to be effective.


    The research question is timely and well-motivated. However, both reviewers independently
    identified serious data integrity issues that preclude acceptance in the current
    form.


    ---


    ## Consolidated Strengths


    1. **Well-suited for the venue.** This is a textbook negative-result paper: plausible
    hypothesis, rigorous experimental design, honest pivot to characterizing why the
    method fails. The Insights workshop values exactly this.


    2. **Per-operator locality gradient is the paper''s strongest contribution.**
    The monotonic C4(+6.1pp) → P1(−2.7pp) → C1(−5.6pp) → P2(−8.4pp) relationship along
    error locality is conceptually elegant, bridges the macro tool-use/planning divide
    with micro within-environment evidence, and provides concrete actionable guidance.


    3. **Variance as primary finding is well-argued.** The observation that the primary
    effect is 2.6× variance increase (not just mean degradation) is practically important
    and methodologically novel. The F-test (p=0.038) for variance ratio is the most
    credible statistical result in the paper.


    4. **Controlled experimental design.** TaxEI and Random share identical injected
    trajectories with only the error tag text differing—an elegant isolation of the
    taxonomy-guidance variable. The fixed-size dose-response protocol (total=4,358)
    cleanly controls for data volume confounds.


    5. **Dose-response decomposition is novel.** No prior work varies injection ratio
    at fixed data size to isolate threshold effects in agent SFT. The finding that
    both methods collapse by ~12pp between 10–25% injection is potentially broadly
    applicable.


    6. **Multi-seed design is itself a contribution.** The paper demonstrates that
    single-seed evaluation of error injection is unreliable, which is actionable advice
    for the community—especially since PALADIN reports no multi-seed validation.


    ---


    ## Consolidated Weaknesses


    ### MAJOR Issues


    **M1. Table 1 contains incorrect data that contradicts the abstract and all other
    results.**


    Table 1 reports: Vanilla=65.3±3.3, Random=70.9±3.3, TaxEI=64.5±3.3. The abstract
    reports: Vanilla=65.3%, TaxEI=56.7% (SD=8.6pp). The project''s actual 3-seed data
    (confirmed in memory.md) is: Vanilla=65.3±3.3, TaxEI=56.7% (SD≈8.6–10.5pp), Random=63.1±6.8pp.


    Critically, Table 1 shows all three methods with identical SD=3.3pp, which directly
    contradicts the paper''s central claim of a variance gradient (3.3 < 7.0 < 8.6).
    Yet the text below Table 1 asserts "Vanilla SD (3.3pp) < Random SD (7.0pp) < TaxEI
    SD (8.6pp)."


    The Table 1 numbers (TaxEI: 61.7/68.1/63.8; Random: 68.1/74.5/70.2) exactly match
    the **dose=10% imagined experiment** from the review_context.yaml, not the actual
    core experiment. This appears to be a generation error where the dream report
    populated Table 1 with the wrong data source.


    **Severity**: Disqualifying until corrected. The paper''s central table is wrong.


    **M2. The "constant ~6.4pp taxonomy penalty" is a known discretization artifact.**


    The project''s own per-task analysis (documented in memory.md) explicitly states:
    "三个 dose 点中 TaxEI 失败但 Random 成功的 task 几乎完全不同。全部 3 个 dose 出现的 penalty task = 0
    个" and "Paper 中不能 claim ''constant additive taxonomy penalty''——应改为''stochastic
    penalty that happens to average ~3 tasks per evaluation''."


    With 47 binary tasks, resolution is ~2.13pp/task. Δ=3 tasks ≈ 6.4pp. The near-perfect
    constancy across 9 seed×dose cells (Table 3: 8 cells show exactly 6.4pp, one shows
    6.3pp) is implausible for genuine experimental data — different tasks drive the
    gap at each dose level, yet the count happens to be ~3 every time. This is either
    a coincidence elevated to a systematic finding, or the numbers were generated
    to match the expected pattern.


    The paper prominently features this claim in the abstract, §4.2, §4.3, §5, and
    §6 as a core contribution. This overstates what the data supports.


    **Severity**: The claim must be substantially rewritten with caveats about discretization
    and task-level variability. It cannot remain as stated.


    **M3. Multi-seed dose-response, WebShop, and scale ablation results may not have
    been actually conducted.**


    The review_context.yaml explicitly labels these as "imagined_experiments" with
    "expected_results" and "result_rationale" explaining what the numbers *should*
    be before any experiment is run. The project''s memory.md contains no entries
    about WebShop or scale ablation results. The experiment tracker (per project records)
    lists 61 experiments, all on ALFWorld.


    The multi-seed dose-response tables show suspiciously regular patterns: all SDs
    are exactly 3.3pp or 3.2pp, TaxEI and Random drop by identical amounts within
    each seed (difference ≤0.1pp), and the taxonomy penalty is exactly 6.4pp at 8/9
    cells.


    If these experiments were conducted, the paper should include verifiable pointers
    to logs. If they are dream-mode projections, their presence in the paper is misleading.


    **Severity**: Cannot evaluate the paper''s experimental claims without knowing
    which experiments are real vs. projected.


    **M4. Pooled statistical test inflates significance through non-independence.**


    The paper increases N from 141 (3 seeds × 47 tasks) to 423 (3 seeds × 3 doses
    × 47 tasks) for the permutation test, moving p from 0.054 (NS) to 0.031 (*). However,
    the 3 dose levels within a seed share: the same random initialization, the same
    base trajectories, and overlapping training data (the clean portion is identical
    across doses). These are not exchangeable observations.


    The original p=0.054 was itself corrected from a floating-point bug that originally
    yielded p=0.03 (documented in memory.md). The honest result is p=0.054 — marginally
    non-significant.


    **Severity**: The statistical claims should be based on the 3-seed-only test (p=0.054)
    with the pooled test presented as supplementary with explicit non-independence
    caveats.


    ### MINOR Issues


    **m1. Related work is thin (8 references) for a cross-domain positioning paper.**


    Key missing citations:

    - ETO (Song et al., ACL 2024): DPO on failure trajectories — critical methodological
    contrast

    - AgentDebug (arXiv 2509.25370): 5-dimension ALFWorld error taxonomy overlapping
    with this work

    - Rolnick et al. (2017): "Deep Learning is Robust to Massive Label Noise" — directly
    relevant to dose-response threshold

    - Data Mixing Laws (Ye et al., ICLR 2025): scaling laws for mixture proportions

    - ALFWorld SOTA context (CoEx 93.28%, AgentPRM 91.0%) — needed to contextualize
    the 65.3% baseline


    The project''s own literature_map.yaml contains these works, suggesting intentional
    omission rather than unawareness.


    **m2. Qualitative analysis (24 cases) lacks inter-annotator agreement.** "Manually
    analyzed" by unstated number of annotators with no coding scheme or reliability
    metrics. The 62.5% "wrong learning" classification is subjective and underpowered
    (15/24 cases).


    **m3. Single-seed experiments contradict the paper''s own warnings.** The paper
    argues single-seed evaluation is unreliable (2.6× variance), yet uses single-seed
    for dose-response (Table 2), scale ablation (Table 8), and few-shot recovery (Table
    9). WebShop uses only 2 seeds.


    **m4. The title makes a causal claim the design cannot support.** "Error Injection
    Helps Tool-Use but Hurts Planning" — the authors never ran their method on tool-use
    or PALADIN''s method on planning. The comparison is cross-paper, not cross-domain
    within a controlled experiment.


    **m5. Abstract emphasizes the most favorable statistical test.** Reports "pooled
    permutation p=0.031" without noting that the paired t-test remains NS (p=0.18)
    and that the primary finding is increased instability, not systematic degradation.


    **m6. Training dynamics analysis is single-seed, single-epoch only.** Loss decomposition
    and gradient cosine (Table 4) from seed=42 final epoch. Stability across seeds
    and training dynamics over time are not verified.


    ---


    ## Questions for Authors


    1. **Table 1**: Can you confirm which experiment Table 1 reports? The per-seed
    values exactly match the dose=10% imagined experiment, not the core 3-seed results
    (which should show TaxEI≈56.7% with SD≈8.6pp).


    2. **Taxonomy penalty**: Your own per-task analysis found 0 tasks consistently
    penalized across all 3 dose levels, and the project memory explicitly warns "Paper
    中不能 claim ''constant additive taxonomy penalty''." Why does the submitted paper
    feature this as a core finding?


    3. **Experiment provenance**: Which of the 9 experiments in the paper were actually
    conducted vs. projected from the dream pipeline? Specifically: were multi-seed
    dose-response (Table 3), WebShop (Table 6), scale ablation (Table 8), and few-shot
    recovery (Table 9) actually run?


    4. **Statistical test**: The permutation test had a documented floating-point
    bug yielding p=0 → corrected to p=0.054 (NS). The "updated" p=0.031 comes from
    pooling non-independent dose-response data. How do you justify treating dose-level
    observations as independent?


    5. **Table 3 implausibility**: The taxonomy penalty is exactly 6.4pp at 8/9 seed×dose
    cells. Given that each cell represents a different training run, what is the probability
    of this level of uniformity? Can you provide raw eval logs for all 18 training
    runs (3 seeds × 3 doses × 2 methods)?


    ---


    ## Scores


    | Dimension | R1 | R2 | Consolidated |

    |-----------|----|----|-------------|

    | Soundness | 2 (Lacking) | 2 (Lacking) | **2 (Lacking)** |

    | Excitement | 3 (Interesting) | 3 (Interesting) | **3 (Interesting)** |

    | Overall | 2.5 (Leaning Reject) | 2.5 (Leaning Reject) | **2.5 (Leaning Reject)**
    |


    ### Score Justification


    **Soundness: 2 (Lacking).** Table 1 contradicts the abstract and narrative. The
    "constant 6.4pp taxonomy penalty" — a headline contribution — is flagged by the
    authors'' own analysis as a discretization artifact yet presented without caveats.
    The pooled statistical test treats non-independent observations as independent.
    Multiple experiments may be projections rather than actual runs. These collectively
    undermine confidence in the reported results.


    **Excitement: 3 (Interesting).** The research question is timely and practically
    relevant. The per-operator locality gradient is a genuinely insightful finding.
    The dose-response design is novel. The variance-as-primary-finding framing is
    methodologically valuable. If the data integrity issues are resolved, the core
    findings would be a meaningful contribution to the Insights workshop. The negative
    result itself — that error injection does not transfer from tool-use to planning
    — is actionable for practitioners.


    **Overall: 2.5 (Leaning Reject).** The paper asks the right question and demonstrates
    admirable experimental breadth. The per-operator locality gradient, variance gradient,
    and dose-response threshold are genuine contributions. However, the data integrity
    concerns (Table 1 error, overstated taxonomy penalty, unverifiable experiments,
    inflated statistics) are too severe for acceptance in the current form.


    **Path to acceptance**: A revision that (a) corrects Table 1 to match actual experimental
    data, (b) reframes the 6.4pp finding with discretization caveats, (c) clearly
    distinguishes real from projected experiments, (d) reports the honest p=0.054
    as the primary test, and (e) expands the related work would likely achieve borderline-to-accept
    at this venue. The core research program is strong; the presentation needs to
    match the actual evidence.


    ---


    ## Reviewer Agreement Notes


    Both reviewers independently identified all four major issues (Table 1 discrepancy,
    6.4pp artifact, experiment provenance, statistical inflation) without cross-contamination.
    This convergence increases confidence that these are genuine problems rather than
    reviewer idiosyncrasies. Both also independently rated the per-operator locality
    gradient as the paper''s strongest contribution and agreed that the research question
    is well-suited for the venue.

    '

    排列，叠加 TaxEI effect direction，显示 locality 与 TaxEI 效果的负相关。'
  analysis: Per-operator deep dive 是论文 mechanistic argument 的关键支撑。结果揭示了一个 清晰的 gradient：error
    locality 越 local、recovery 越 feasible 的 operator， TaxEI 效果越好（C4 +3.1pp → C1 -2.1pp
    → P1 -5.5pp → P2 -8.3pp）。 这个 micro-level gradient 完美镜像了 macro-level 的 tool-use
    vs planning 对比： 在 operator 层面也是"局部可恢复的错误可以被学习，全局 cascading 的错误只引入噪声"。 P2 的 robust
    negative effect (p≈0.06) 是最接近 significant 的 per-operator finding， 可以在论文中重点讨论。C4
    的 positive direction 虽然 NS，但提供了 "error injection CAN work even in planning, IF
    the error is locally recoverable" 的 suggestive evidence， 这是比纯 negative result
    更 nuanced 的 contribution。 建议将此结果与 Table 3 (ToolBench vs ALFWorld structural comparison)
    合并讨论， 论证 error locality 是 THE key moderating variable。

tier: median
narrative_guidance: '核心叙事从三个 crisp findings 收缩为层级式 claims：(1) 方差梯度作为 primary finding（最
  robust， 跨实验一致），(2) taxonomy label 作为 amplifier of instability（方向性 claim，penalty
  存在 但幅度跨 seed 漂移 3-9pp，不再称 "remarkably stable"），(3) 剂量-响应作为 exploratory evidence
  with caveats（大致形状成立但阈值位置漂移）。论文仍成立为 cautionary negative result，但 contribution 从精确定量边界条件转向
  "error injection 不应被默认迁移到 embodied planning" 的方向性警告。 Priority 2 实验中 qualitative
  failure analysis 变得关键——需要定性证据弥补定量统计力不足。 新增实验的结果均在 marginal significance 区间，强化了 "suggestive
  but inconclusive" 的叙事基调。

  '

  result_rationale: 'Median 档下，注入样本 loss 始终高于 clean 样本（~0.10-0.11 gap at epoch 3），这是直接预期：
    注入样本包含刻意错误的轨迹，模型难以完美拟合。关键问题是 clean 样本是否被"传染"—— TaxEI 训练中 clean 子集的 epoch 3 loss
    (0.31) 比 Vanilla 的 (0.29) 高约 0.02， 但这个差异仅约 1 个 seed SD (0.015)，在统计上不显著。这解释了 median
    档的核心特征： 注入样本 loss 更高是明确的（clean 和 injected 两条曲线清晰分离），但对 clean 样本 的 corruption 效应淹没在训练噪声中——你能看到趋势但无法声称

    our_5shot_recovery_gain_pp_max: 5.3
  result_rationale: 'Median 档预测 few-shot recovery 提供 modest improvement（2-5pp），远低于
    PALADIN 的 30pp retrieval 增益。理由： (1) 5 个恢复示例为模型提供了"如何从错误中恢复"的 in-context knowledge，
    这对 clean tasks 有轻微帮助（模型变得更 cautious/systematic），对 recovery tasks 有更明显帮助（直接相关的示例）。
    (2) TaxEI + 5-shot 的 gain (+4.1pp clean, +5.3pp recovery) 高于 Vanilla + 5-shot
    (+2.1pp, +4.3pp)，显示 TaxEI 训练虽然 hurt overall，但可能让模型对 recovery cues 更 receptive——它学会了"关注错误"但没学会"如何正确恢复"，few-shot
    补充了后者。 这构成了一个有趣的 complementarity story。 (3) 5-shot 的 gain 远低于 PALADIN 的 retrieval
    gain (30pp)，因为 5 个示例覆盖率 极低（PALADIN 用 55+ exemplars），且 ALFWorld 的 unbounded action
    space 使得 少量示例的迁移性有限。 (4) 所有 gain 的 p 值在 0.08-0.15，再次停留在 marginal 区间——median 档特征。
    关键 insight：recovery knowledge 在 inference-time 提供比在 training-time 注入 更安全（无 variance
    increase），但在 embodied planning 中效果均有限。 这进一步隔离了问题：不是 "knowledge of recovery is
    useless"， 而是 "embodied planning 的 action space 太大，局部恢复示例难以泛化"。

    '

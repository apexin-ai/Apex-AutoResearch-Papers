    vanilla_recovery_5shot_pct: 66.0
    vanilla_recovery_5shot_gain_pp: 4.3
    taxei_recovery_zeroshot_pct: 59.6
    taxei_recovery_5shot_pct: 64.9
    taxei_recovery_5shot_gain_pp: 5.3
    random_recovery_zeroshot_pct: 63.8

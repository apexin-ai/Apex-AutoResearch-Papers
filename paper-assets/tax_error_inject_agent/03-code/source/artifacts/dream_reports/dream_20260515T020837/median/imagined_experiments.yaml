  analysis: 'Few-shot recovery 实验的价值在于 mechanistic decomposition：它证明 recovery knowledge
    本身是有用的（inference-time 提供可以 improve），但 SFT 不是正确的 delivery mechanism for embodied
    planning。这与 EEF 的成功形成对比——EEF 从 failures 中 extract positive signal（what to do right），而
    TaxEI inject negative signal（what goes wrong）。 论文可以在 Discussion 中构建一个 2×2 框架：training
    vs inference × positive vs negative signal，argue that embodied planning 需要 inference-time
    positive signal (EEF-like) 而非 training-time negative signal (TaxEI-like)。


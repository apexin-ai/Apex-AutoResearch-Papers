- name: Training Dynamics Analysis
  plan_id: training-dynamics
  description: '从 v4 seed=42 的 training log 中提取逐 step loss 曲线，分离 clean 和 injected
    样本的 loss， 分析注入样本对 clean 学习信号的污染程度。不需要新训练。

    '
  expected_results:
    vanilla_clean_loss_final: 0.29
    taxei_overall_loss_final: 0.355
    taxei_clean_loss_final: 0.338
    taxei_injected_loss_final: 0.482
    random_overall_loss_final: 0.355
    random_clean_loss_final: 0.318
    random_injected_loss_final: 0.445
    clean_loss_inflation_taxei_pct: 16.6
    clean_loss_inflation_random_pct: 9.7
    injected_to_clean_loss_ratio_taxei: 1.43
    injected_to_clean_loss_ratio_random: 1.4
    loss_divergence_onset_step: 500
    gradient_cosine_clean_vs_injected_taxei: 0.28
    gradient_cosine_clean_vs_injected_random: 0.35
  result_rationale: 'Vanilla clean loss 收敛至 ~0.29（registry: v4-vanilla-seed0 final_loss=0.297），这是无干扰
    baseline。TaxEI 的 overall loss = 0.355 是 clean 和 injected 样本的加权混合——分离后 clean 部分
    ~0.338 高于 vanilla 16.6%，直接量化了注入样本对 clean 学习信号的污染。这一 "corruption signal" 是 finding
    3（方差梯度）的 mechanistic explanation：注入样本的梯度方向与 clean 样本 弱对齐（cosine ~0.28），在反向传播中将模型权重推离
    clean optimal，导致 clean 样本 loss 系统性 升高。Random injection 的 clean loss inflation（9.7%）低于
    TaxEI（16.6%），因为随机错误的 梯度方向更加分散（cosine ~0.35，paradoxically higher），不会形成 coherent
    的 "拉力方向"—— 相当于在权重空间中添加各向同性噪声，而 TaxEI 的 taxonomy 标签创建了 structured 的错误梯度 方向，对 clean
    learning 造成更大的 systematic interference。Loss 分歧在 step ~500（epoch 1 后期）开始显现，对应于模型开始记忆训练样本而非仅学习通用模式的阶段——此后
    injected 样本的 错误模式开始与 clean 模式竞争权重空间。

    '
  tables:
  - title: Loss Decomposition (seed=42, final epoch)
    content: '| Method  | Overall | Clean  | Injected | Clean Inflation | Inj/Clean
      Ratio |

      |---------|---------|--------|----------|-----------------|-----------------|

      | Vanilla | 0.290   | 0.290  | —        | baseline        | —               |

      | TaxEI   | 0.355   | 0.338  | 0.482    | +16.6%          | 1.43×           |

      | Random  | 0.355   | 0.318  | 0.445    | +9.7%           | 1.40×           |

      '
  - title: Gradient Alignment Metrics
    content: '| Metric                         | TaxEI | Random |

      |--------------------------------|-------|--------|

      | Cosine(clean, injected)        | 0.28  | 0.35   |

      | Clean loss inflation vs Vanilla| 16.6% | 9.7%  |

      | Injected loss convergence      | No    | Partial|

      '
  figures_description:
  - 'Figure: 3 条 clean sample loss 曲线（Vanilla/TaxEI/Random）vs training steps。Vanilla
    平稳收敛至 0.29，TaxEI clean loss 从 step ~500 开始持续高于 Vanilla 并收敛至 0.338，Random 居中 0.318。Y
    轴标注 clean loss inflation zone。'
  - 'Figure: TaxEI 训练中 clean vs injected 样本的 loss 对比。两条曲线从相同起点分叉，injected loss 始终高于
    clean 且不完全收敛，gap 在 epoch 2-3 趋于稳定在 ~0.14。'
  - 'Figure: 梯度余弦相似度 heatmap（step × method），展示 clean-injected 梯度对齐随训练推进的变化。TaxEI 的
    cosine 从 ~0.6（初始）下降至 ~0.28（收敛），显示 clean 和 injected 梯度逐渐对立。'
  analysis: '训练动态分析将方差梯度的统计现象转化为可解释的梯度力学：注入样本在权重空间中施加与 clean 样本不一致的梯度力，TaxEI 因 taxonomy
    标签产生 structured gradient interference（cosine 0.28）， Random 因随机性产生 diffuse interference（cosine
    0.35）。Clean loss inflation 的 TaxEI > Random 排序（16.6% vs 9.7%）完美对应 final performance
    的 Vanilla > Random > TaxEI 排序，提供了 从训练 loss 到 eval performance 的因果链。这一 mechanistic
    explanation 是论文从 "观察到负面结果" 升级为 "解释负面结果" 的关键——reviewer 可能质疑统计功效，但 loss decomposition
    提供了 independent 的 process-level 证据。injected 样本 loss 不完全收敛的现象进一步说明模型未能 有效学习错误模式——与
    PALADIN 在 tool-use 中 recovery trajectories 可以被学习形成对比。

    '
- name: Qualitative Failure Analysis
  plan_id: qualitative-failure-analysis
  description: '手动分析 20+ TaxEI 失败案例，区分 "taxonomy-specific wrong learning"（模型学到了特定的
    错误行为）和 "random noise"（模型只是表现更不稳定），为 Claim 1 和 Claim 6 提供定性证据。

    '
  expected_results:
    total_cases_analyzed: 24
    taxei_fail_vanilla_succeed: 8
    both_fail: 10
    taxei_succeed_vanilla_fail: 6
    failure_taxonomy:
      operator_replay: 6
      action_sequence_disorder: 5
      premature_termination: 4
      wrong_object_selection: 4
      identical_to_vanilla_failure: 5
    operator_replay_pct: 25.0
    wrong_learning_pct: 62.5
    noise_pct: 20.8
    ambiguous_pct: 16.7
  result_rationale: '定性分析揭示 TaxEI 失败中最具诊断意义的模式是 "operator replay"——模型在 clean 任务中 生成与训练数据中某种
    taxonomy operator 一致的错误行为。例如，模型在 pick_clean_then_place 任务中跳过 clean 步骤（对应 P2 sub_goal_deletion
    的训练模式），或在需要仔细观察环境时 截断上下文信息（对应 C1 context_truncation 的训练模式）。这些 operator replay
    案例（6/24, 25%）是 TaxEI 特有的——Random 和 Vanilla 的失败案例中不存在与特定 taxonomy operator 匹配的模式。另有
    9/24 案例（37.5%）表现为非 operator-specific 但系统性的错误行为（action disorder, premature termination），合计
    "wrong learning" 占 62.5%。仅 5/24（20.8%） 的失败模式与 Vanilla 失败完全一致（baseline noise）。这一分布支持
    "TaxEI 教会模型特定的 错误行为" 假说而非 "TaxEI 仅增加随机噪声" 假说，与 training dynamics 中 TaxEI 的 structured
    gradient interference（cosine 0.28 < Random 0.35）一致。

    '
  tables:
  - title: Failure Mode Taxonomy (24 cases)
    content: '| Failure Mode             | Count | Pct   | TaxEI-Specific? |

      |--------------------------|-------|-------|-----------------|

      | Operator replay (P2/C1)  | 6     | 25.0% | Yes             |

      | Action sequence disorder | 5     | 20.8% | Partially       |

      | Premature termination    | 4     | 16.7% | Partially       |

      | Wrong object selection   | 4     | 16.7% | No              |

      | Same as vanilla failure  | 5     | 20.8% | No              |

      '
  - title: Failure Attribution Summary
    content: '| Category       | Count | Pct   | Interpretation                          |

      |----------------|-------|-------|-----------------------------------------|

      | Wrong learning | 15    | 62.5% | Model internalized error patterns       |

      | Noise          | 5     | 20.8% | Indistinguishable from baseline noise   |

      | Ambiguous      | 4     | 16.7% | Could be either                         |

      '
  figures_description:
  - 'Figure: 失败模式 sankey 图。左侧=TaxEI 失败案例（24 个），中间=failure mode 分类（5 类），右侧=attribution（wrong
    learning / noise / ambiguous）。Operator replay 流全部归入 wrong learning，标红。'
  - 'Figure: 2 个代表性 case study 并排。左: TaxEI 在 pick_clean_then_place 中跳过 clean 步骤（P2
    replay），右: Vanilla 在同一任务中选择错误 receptacle（generic failure）。注释标注 taxonomy operator
    对应关系。'
  analysis: '定性分析将统计现象 "taxonomy penalty" 具象化为可观察的行为模式：TaxEI 模型在 clean eval 中 "回放"
    训练数据中的 taxonomy 错误，特别是 P2 (sub_goal_deletion) 和 C1 (context_truncation) 两种 operator
    的特征最明显。这解释了为何 taxonomy penalty 与 dose 无关——只要训练数据中存在 taxonomy-标记的错误样本，模型就会 internalize
    特定的错误策略，无论这些样本占比多少。 与之对比，Random injection 的失败模式不呈现 operator-specific 聚类，支持其 gradient
    干扰是 diffuse 而非 structured 的解释。这一发现为论文提供了最具说服力的 "为什么 taxonomy labels 有害" 的直觉解释，适合放在
    Analysis 部分作为 bridge between statistics and mechanism。

    '

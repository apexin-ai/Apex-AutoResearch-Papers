    taxonomy_penalty_mean_pp: 6.37
    taxonomy_penalty_sd_pp: 0.06
  result_rationale: 'Random 10% = 68.1% 高于 vanilla 6.4pp，反映纯数据增强效应——无标签的噪声注入在低剂量下增加
    训练分布多样性，实质上是合法的 data augmentation。TaxEI 10% = 61.7% 无此增益，说明 taxonomy label 抵消了增强效应，将
    +6.4pp augmentation bonus 精确归零。10→25% 两种方法同步崩溃 12.8pp （Random 68.1→55.3, TaxEI
    61.7→48.9），证明阈值效应是 error injection 的通用属性：当注入比例 超过 ~15-20%，clean 梯度信号被稀释至临界点以下，模型无法维持正确的
    action distribution。 50% 处两者均回升 ~2pp（平台效应），因为极高注入比例下 clean 和 injected 样本的梯度已充分混合，
    进一步增加注入不再额外恶化。6.4/6.4/6.3pp 的恒定 taxonomy penalty 在三个独立 dose 点保持 一致（SD=0.06），精确对应
    3 个 ALFWorld 任务的分辨率（3/47=6.38pp），强烈支持 taxonomy label 引入的是与剂量无关的 systematic bias——结构化错误模式教会模型特定的错误行为，而非仅增加噪声。

    '
  tables:

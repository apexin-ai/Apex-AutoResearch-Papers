    reward signal 和更结构化的 action space 一致。这提供了一个重要的 dose-response in task structure：随着任务从
    "完全 open-ended planning" (ALFWorld) 向 "semi-structured interaction" (WebShop)
    移动，error injection 的负面效应减弱但仍存在。这一 gradient 支持论文的核心论点： task structure 是决定 error
    injection 效果的 primary factor，而非二元的 "works/doesn''t work"。 与 EEF 的对比（EEF 在 WebShop
    成功但用了相反的 injection direction）进一步细化了 boundary condition：即使在同一环境中，"注入错误" 和 "从错误中提取正确"
    的效果完全不同。

    '

    SD 6.2→5.5pp 仍远高于 Vanilla 的预计 ~2.5pp），确认 training instability 是 structural 而非
    scale-limited 的问题。即使在 50K 规模（接近 PALADIN），TaxEI 仍不超过 Vanilla—— 排除 "我们只是数据不够" 的
    reviewer 质疑。PALADIN 的成功需要 scale + 显式错误信号 + inference-time retrieval 三者共同作用，单独的
    scale 不足以弥补 task-structural 缺陷。

    '

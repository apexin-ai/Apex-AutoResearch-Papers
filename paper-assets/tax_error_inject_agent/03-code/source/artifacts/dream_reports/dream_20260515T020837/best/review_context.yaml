narrative_guidance: '原始 framing 完全成立。三个核心 finding 在补充实验中逐一获得独立多 seed 证据： (1) 方差梯度
  Vanilla<Random<TaxEI 是 robust ordering，在每个 seed 和 dose 水平均成立； (2) 阈值-平台是 error injection
  的通用属性——两种注入方法在 10→25% 同步崩溃 12.8pp，跨 seed 偏差 ≤2.2pp； (3) ~6.4pp taxonomy penalty
  是 systematic additive bias，跨 3 seed × 3 dose = 9 个独立观测点保持稳定（SD ≈ 0.4pp）。 训练动态分析提供
  mechanistic explanation——注入样本的梯度方向与 clean 样本弱对齐（cosine ~0.3）， 系统性拉高 clean 样本 loss
  约 14%。定性分析显示 TaxEI 特有的 "taxonomy-operator 回放" 失败模式， 区别于随机噪声。WebShop 第二环境部分复现方差梯度和阈值效应，进一步支撑
  task-structural boundary condition。 论文可做 strong negative claim + actionable boundary
  condition guideline，标题级 claim 不变。 Pooled permutation test TaxEI vs Vanilla 达 p=0.031，paired
  t TaxEI vs Random 达 p=0.024。

  '
imagined_experiments:

    < Random 5.9pp < TaxEI 7.4pp）和 TaxEI 的劣势（-7.3pp vs Vanilla）应当复现。Taxonomy penalty
    略低于 ALFWorld （4.6pp vs 6.4pp），因为 WebShop 的 action space 更结构化（搜索/点击/选择），taxonomy
    operator 的干扰空间较小。阈值效应存在但 drop 幅度较小（9.5pp vs 12.8pp），因为 WebShop 的 reward signal
    更密集（每步有部分匹配反馈），clean gradient 更 robust。注意 EEF (arXiv 2504.13145) 在 WebShop 上用
    "从失败中提取正面信号" 策略成功，与我们的 "注入负面信号" 方法形成对比——这一对照进一步支持 "injection direction matters"
    的论点。

    '
  tables:

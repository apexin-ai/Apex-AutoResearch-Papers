  analysis: Per-operator deep dive 在 worst 档下彻底消解了所有 operator-level 的定向 finding。 原始论文中暗示
    "C4 (observation masking) 是 TaxEI 唯一有优势的 operator" 的叙事 被证明是 seed=42 的偶然。3-seed
    均值下没有任何 operator 显示 TaxEI 的一致优势或劣势。 这对 C4 的原始叙事（"TaxEI advantage only on C4_observation_masking"）和
    潜在的 "某些 error type 更适合 injection training" 的研究方向都是坏消息。 Paper 应删除所有 per-operator
    的定向 claim，仅保留 "per-operator 分析在 3-seed 下无显著 pattern" 的一句话总结。如果要保留 per-operator

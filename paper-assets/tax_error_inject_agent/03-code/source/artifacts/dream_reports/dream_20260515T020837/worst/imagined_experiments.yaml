    没有产生与 taxonomy operator 相关的特定错误 pattern—— 例如 P1（step_order_swap）训练并未导致 TaxEI 在
    step_order 错误上的频率升高。 TaxEI 的失败也不是 "incoherent plans"——步骤序列在语法和逻辑上与 Vanilla 的失败等价，

  - 'Loss curve plot (2×1 panel): 左 TaxEI, 右 Random。每 panel 画 clean（蓝）和 injected（橙）
    的 3-seed mean ± shaded SE。两条线几乎完全重叠，SE band 互相覆盖。 标注 "Cross-seed SD >> Clean-Injected
    gap" 以强调 seed variance 主导。

    '
  - 'Violin plot: 每个 seed 在 epoch 3 的 per-sample loss 分布，clean vs injected 分开。 分布高度重叠，无系统偏移。个别
    seed（如 seed=0）整体 loss 偏高， 但 clean 和 injected 同步偏高，说明是 seed-level 效应而非 sample-type
    效应。

    '
  analysis: '该实验在 worst 档下提供了 "noise hypothesis" 的直接证据：模型无差别地学习了 clean 和 injected
    样本，error injection 未在训练动态层面产生可检测的信号。这与 PALADIN 形成鲜明对比—— PALADIN 中 recovery 样本的
    loss 显著低于 error 样本，说明模型学会了区分正确和错误行为。 在 ALFWorld 中，这种区分不存在：embodied planning 的错误在
    token 层面与正确行为无法区分 （语法合法的错误步骤 loss 与正确步骤相当），模型缺乏从 loss 信号中提取 error pattern 的能力。
    Paper 中应将此定位为 "模型无法从 loss 信号区分正确与错误的 embodied planning 步骤"， 这支持了 error observability
    假设但削弱了 "injected samples corrupt training" 的原始叙事。 在 worst 档下，这个实验的结论从 "证明 corruption
    mechanism" 变为 "证明 no mechanism at all"。

    '

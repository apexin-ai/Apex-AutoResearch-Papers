tier: worst
narrative_guidance: '三个原始 finding（variance gradient, threshold-plateau dose-response,
  constant ~6.4pp taxonomy penalty） 均被证明是 seed=42 的偶然产物。扩展 seed 后 TaxEI 均值上移至 ~62%，与
  Vanilla 差距缩至 <4pp（p>0.3）； taxonomy penalty 在新 seed 出现正值（TaxEI > Random），cross-dose
  SD 达 4-5pp，"constant offset" 不成立； variance gradient 在 5-seed 均值下 Random SD ≈ TaxEI
  SD，无法区分结构化注入与随机注入的不稳定性差异。 论文需要彻底 reframe：从 "error injection hurts + here''s why"
  转为 "error injection is indistinguishable from noise in low-data embodied planning
  regimes"。 核心 contribution 变为 (1) ALFWorld SFT 的 cross-seed variance 之大使任何 data augmentation
  评估需 ≥5 seeds（方法论 contribution），(2) <10K 样本下 error injection 信号被训练噪声压制 （scale-dependent
  null result）。论文从 boundary condition paper 变为 evaluation methodology paper。

  '
imagined_experiments:
- name: Training Dynamics Analysis
  plan_id: training-dynamics
  description: '对 TaxEI 和 Random 的训练过程进行 loss curve 分解：分别追踪 clean 样本和 injected 样本
    在每个 epoch 的平均 loss，跨 3 个 seed 绘制均值±SE 曲线。目的是检验 injected 样本 是否系统性地具有更高 loss（即模型是否「抵抗」学习错误
    pattern）。

    '
  expected_results:
    taxei_clean_loss_epoch3: 0.29
    taxei_injected_loss_epoch3: 0.31
    random_clean_loss_epoch3: 0.3
    random_injected_loss_epoch3: 0.3
    clean_vs_injected_loss_gap_taxei: 0.02
    clean_vs_injected_loss_gap_random: 0.01
    loss_gap_significant: false
    cross_seed_loss_curve_overlap: true
    clean_loss_trajectory_divergence_epoch: null
    injected_loss_reduction_rate_vs_clean: 0.97
  result_rationale: '在 worst 档下，injected 样本的 loss 轨迹与 clean 样本几乎完全重叠。 TaxEI 的 clean-injected
    gap 仅 ~0.02（约 6% 相对差异），Random 几乎为零。 这意味着模型以相同速率吸收了 clean 和 injected 样本——error
    injection 既没有被模型「抵抗」（高 loss 不降），也没有造成 clean 样本 loss 反弹。 模型把 taxonomy-tagged 错误当作普通数据学习了，没有产生可检测的学习动态差异。
    跨 seed 的 loss 曲线方差远大于 clean vs injected 的均值差，意味着 seed lottery 的影响力完全碾压了数据类型的影响力。
    结论：training loss 分析无信息量——这本身支持 "error injection = noise" 的 reframing， 但不再支持 "injected
    samples corrupt clean learning" 的原始叙事。

    '

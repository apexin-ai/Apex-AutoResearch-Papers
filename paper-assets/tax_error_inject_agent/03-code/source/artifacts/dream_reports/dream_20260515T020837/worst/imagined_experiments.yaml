    vs Vanilla 差异在 3-seed 均值下 均落入 ±3pp 内（SD 5-8pp），无一显著。 P2（sub_goal_deletion）在 3-seed
    均值下 TaxEI 低 3pp，是最大负差， 但 SD=8.1pp 意味着不显著。 Cross-operator 的方差远大于 method 间差异：每个
    operator 的 cross-seed SD 在 5.5-8.1pp，而 method 间 gap 在 ±3pp——再次印证 seed lottery
    主导。 原始报告中 "TaxEI advantage only on C4_observation_masking (+9.1pp)" 被证明是 seed=42
    的偶然，不应作为论文 finding。


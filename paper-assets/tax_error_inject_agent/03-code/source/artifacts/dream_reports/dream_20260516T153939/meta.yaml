    power issues: even if the statistics were clean, the finding wouldn''t be surprising
    enough for a top venue.

    - R2 agrees with R1 that the Table 1/2 data identity is concerning. If recovery
    eval ≡ clean eval, the "resilience not recovery" claim reduces to: "eval-time
    perturbations have no measurable effect" — a finding that is either trivial (errors
    too subtle to matter) or an artifact (the injection was poorly designed).

    - Both note that the cross-model evidence is the paper''s weakest point: 4/5 metrics
    inconsistent effectively invalidates any "architecture-general" claim.



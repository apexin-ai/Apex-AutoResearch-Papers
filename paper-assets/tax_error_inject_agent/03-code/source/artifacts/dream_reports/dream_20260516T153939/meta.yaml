  - name: Per-Operator Deep Dive (Multi-Seed)
    plan_id: per-operator-deepdive
    description: '利用recovery-eval-multiseed的5-seed数据，对4个operator分别计算multi-seed TaxEI−Vanilla
      recovery delta。验证seed=42的local/global gradient是否replicate。

      '
    expected_results:
      C4_5seed_taxei_minus_vanilla_mean_pp: 1.8
      C4_5seed_sd_pp: 12.5
      C4_fisher_p: 0.71
      P1_5seed_taxei_minus_vanilla_mean_pp: -1.2
      P1_5seed_sd_pp: 10.8
      P1_fisher_p: 0.82
      C1_5seed_taxei_minus_vanilla_mean_pp: -3.4
      C1_5seed_sd_pp: 11.2
      C1_fisher_p: 0.49
      P2_5seed_taxei_minus_vanilla_mean_pp: -4.1
      P2_5seed_sd_pp: 13.1
      P2_fisher_p: 0.38
      local_global_gradient_direction_preserved: true
      local_global_gradient_magnitude_collapsed: true
      spearman_locality_rank_vs_advantage: 0.6
      spearman_p: 0.42
      episodes_per_operator_cell: 57
    result_rationale: 'Median档per-operator gradient在multi-seed后collapse to noise。

      (1) Seed=42的C4=+9.1pp基于11个episodes中1个flip(6→7)——本质上是coin flip。 5-seed聚合后~57
      episodes/operator/condition给每个operator ~±8-13pp的SD。 C4的mean从+9.1→+1.8pp，Fisher
      p=0.71——signal消失在variance中。

      (2) Direction weakly preserved：local operators(C4)仍slightly positive(+1.8pp)，
      global operators(C1,P2)仍negative(−3.4, −4.1pp)。但magnitude减小~70%，且 Spearman rank
      correlation(n=4)完全uninformative(p=0.42)。

      (3) P2(sub_goal_deletion)保持最negative(−4.1pp)——合理因为sub-goal deletion是 most globally
      cascading的operator。但Fisher p=0.38 NS，无法distinguish from noise。

      (4) 这个实验的value是将per-operator analysis从"interesting pattern"降级为 "hypothesis for
      future work with larger benchmarks"。Reviewer会agree这个降级。 Paper中从Results Table移至Appendix
      exploratory analysis。


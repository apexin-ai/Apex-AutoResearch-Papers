      narrative_direction: '核心贡献需要彻底reframe（仍冲同一venue）。三个可行angle：

        (A) **Training Lottery角度**：从''error injection boundary conditions''转向''The
        Training Lottery: Why Single-Seed Agent Evaluations Are Unreliable''。核心贡献变为：25条独立训练run（5
        doses × 5 seeds）证明within-condition variance (19-23pp) > between-condition
        variance (9pp)，embodied agent SFT结果由seed lottery主导而非method选择。Dose-response
        bimodality证据支撑。这是一个methodological warning paper而非domain-transfer paper。

        (B) **Resilience-vs-Recovery角度**：从injection harm转向''Do LLM Agents Actually
        Recover? Separating Resilience from Recovery in Embodied Planning''。核心贡献是recovery=clean
        rate across ALL conditions + 0% detection = 没有任何training regime能instill error
        awareness。这challenge整个error-recovery训练范式。

        (C) **Augmentation Stability角度**：从negative result转向''Structured vs Unstructured
        Data Augmentation Stability for LLM Agent Training''。核心：structured perturbation
        creates systematic bias that amplifies across seeds/models; unstructured noise
        averages out. 这是一个关于data augmentation design principles的contribution，不限于error
        injection。

        选择依赖reviewer feedback方向——如果''obvious negative result''是主要reject reason选(A)或(C)；如果''not
        novel enough''选(B)。'

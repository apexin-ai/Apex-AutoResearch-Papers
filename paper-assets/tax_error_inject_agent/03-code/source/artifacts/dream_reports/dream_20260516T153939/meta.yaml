      diminishing_returns_1000_to_2500_gap_reduction_pp: 0.7
    result_rationale: 'Scale-up data collection在median档是feasibility + diminishing
      returns story。

      (1) Collection feasibility confirmed：70% success rate stable（与initial 501-traj
      collection一致），cost linear($8.86/500≈$44/2500)。无technical barrier。

      (2) Phase 1 (1,000-traj) gap已经narrow(9.0→7.1pp)，phase 2 (2,500) further narrow(7.1→6.4pp)——clear
      diminishing returns。500→1000 gains 1.9pp， 1000→2500 only 0.7pp。Extrapolating
      logarithmically，5000 traj would yield ~5.5pp gap——仍non-zero。

      (3) ALFWorld diversity ceiling是fundamental：134 unique tasks × 18.7 repetitions
      = pure repetition augmentation。PALADIN''s advantage可能是task diversity (thousands
      of unique API call patterns)而非volume。Paper应explicit state： "Within ALFWorld''s

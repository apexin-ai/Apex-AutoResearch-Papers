    - name: LLaMA Per-Seed Recovery Breakdown
      content: '| Condition       | s42   | s0    | s123       | Mean ± SD     |

        |-----------------|:-----:|:-----:|:----------:|:-------------:|

        | Vanilla (rec.)  | 74.5  | 74.5  | 70.2       | 73.1 ± 2.5   |

        | TaxEI (rec.)    | 74.5  | 74.5  | **59.6**   | 69.5 ± 8.6   |

        | Random (rec.)   | 74.5  | 76.6  | 78.7       | 76.6 ± 2.1   |

        | Vanilla (clean) | 72.3  | 72.3  | 72.3       | 72.3 ± 0.0   |

        | TaxEI (clean)   | 76.6  | 76.6  | **61.7**   | 71.6 ± 8.6   |

        | Random (clean)  | 74.5  | 76.6  | 76.6       | 75.9 ± 1.2   |

        '
    figures_description:
    - Paired bar chart：Qwen 5-seed vs LLaMA 3-seed，V/T/R with error bars。 Direction一致（TaxEI最不稳定）但severity
      profile不同。
    - Seed-level dot plot for LLaMA：TaxEI s123 catastrophic outlier突出， Random三点紧密聚集。Annotated
      with catastrophic threshold line。
    - Detection rate comparison bar：Qwen 0% vs LLaMA 27%，分operator。
    analysis: 'LLaMA replication是median档的关键升级——将finding从"single-model negative result"
      升级为"cross-model evidence"——但3-seed limitation使其只能是preliminary。 Direction consistency（TaxEI
      unstable across both models）是可claim的； magnitude consistency不可claim（Qwen consistent
      -9pp vs LLaMA intermittent -3.6pp）。

      最大reviewer risk是detection rate差异：如果LLaMA produces 27% detection而Qwen 0%， reviewer会argue
      the models learn fundamentally different representations from same data， undermining
      "cross-model" claim的validity。Counter：detection doesn''t improve recovery (LLaMA
      TaxEI detection 30% but recovery 69.5% ≈ vanilla 73.1%)，so detection is orthogonal
      to the stability finding。

      Paper claim wording必须是："Structured error injection destabilizes training on
      both Qwen3-8B (consistent harm, 5-seed) and LLaMA-3.1-8B-Instruct (intermittent
      catastrophic failure, 3-seed preliminary), while random injection remains stable
      across both architectures."


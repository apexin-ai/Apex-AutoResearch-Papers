    - 'Line plot: shots (0/2/4) × 3 conditions。三条线near-parallel上升， 证明improvement is
      additive-from-ICL而非condition-dependent。'
    analysis: 'Recovery prompting是clean control but在median档不改变paper narrative。 它confirms
      D041 from a different angle。Paper allocation：Discussion section 1段，"In-context

- name: Per-Operator Deep Dive (Multi-Seed Validation)
  plan_id: per-operator-deepdive
  description: 多seed per-operator recovery分析，验证C4(local) advantage和C1/P2(global) disadvantage的pattern是否robust。
  expected_results:
    C4_observation_masking_taxei_advantage_mean_pp: 4.2
    C4_advantage_direction_consistent_seeds: 4
    C4_advantage_direction_consistent_out_of: 5
    P2_sub_goal_deletion_taxei_disadvantage_mean_pp: -9.8
    P2_disadvantage_direction_consistent_seeds: 4
    P2_disadvantage_direction_consistent_out_of: 5
    C1_context_truncation_taxei_disadvantage_mean_pp: -5.4
    P1_step_order_swap_neutral_mean_pp: -1.2
    pooled_N_per_operator: 60
    fisher_exact_C4_p: 0.38
    fisher_exact_P2_p: 0.18
    local_vs_global_pattern_consistent: true
  result_rationale: 在best档下，per-operator pattern以方向一致性replicate但individual tests仍NS。逻辑：(1)
    C4 (observation masking) 是最local的perturbation——单个observation被mask，model只需要'ignore
    missing info and proceed'，这与TaxEI训练中exposure to masked observations的经验对齐，所以TaxEI能show
    modest advantage (+4.2pp pooled); (2) P2 (sub-goal deletion) 是最global的——删除sub-goal后整个downstream
    plan invalid，需要full re-planning，TaxEI训练中虽然见过P2 patterns但学到的是'execute corrupted
    plan'而非'detect missing goal and re-plan'，所以显著disadvantage (-9.8pp pooled); (3)
    C1 (context truncation) 类似P2——truncated context导致cascading wrong assumptions;
    (4) P1 (step order swap) 效果neutral因为swapped steps有时accidentally correct（ALFWorld很多task的step
    order有flexibility），所以injection训练对P1的effect被task structure的flexibility抵消。5-seed
    pooled到N=60/operator后方向一致但Fisher仍NS because每个operator只有12 tasks/seed，5×12=60仍然underpowered
    for moderate effect sizes。Best档下reviewers接受这个pattern作为hypothesis-generating evidence配合clear
    theoretical motivation（local=learnable, global=not learnable）。

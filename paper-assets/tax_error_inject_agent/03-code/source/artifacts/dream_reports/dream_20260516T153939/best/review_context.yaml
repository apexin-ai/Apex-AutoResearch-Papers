narrative_guidance: 原始framing完全成立——'Structured error injection is fundamentally destabilizing
  for embodied planning across architectures'。论文贡献从negative result升级为positive finding
  about injection stability properties。重点：(1)跨模型SD ratio 4:1证明是structured patterns的内在属性；(2)dose-response
  inverted-U揭示conflicting signal mechanism；(3)recovery=resilience是对整个error-injection-for-recovery范式的conceptual
  challenge。无需调整claims强度。

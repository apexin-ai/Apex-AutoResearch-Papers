  result_rationale: 'Best档核心：cross_model_taxei_sd_ratio在[3.5, 4.5]范围内，实际值4.1（TaxEI
    SD 8.6 / Random SD 2.1）。这个4:1的SD ratio是structured injection创造training instability的直接evidence。为什么会出现：(1)
    Structured patterns（taxonomy-labeled perturbations）在loss landscape中创造systematic偏移方向，某些seed的初始化恰好与这些bias方向对齐导致catastrophic
    amplification；(2) Random perturbations平均化为near-zero gradient bias，任何seed都不会被systematically
    pushed toward failure region。LLaMA s123 collapse（recovery 59.6% vs vanilla 70.2%）mirrors
    Qwen的consistent degradation pattern但以higher variance形式表现——不同architecture对structured
    bias的响应mode不同（Qwen: uniform moderate harm; LLaMA: bimodal all-or-nothing），但direction一致。LLaMA的非零detection
    rate（~27%）是interesting但不影响core story：LLaMA base model本身就有更强的meta-cognitive tendency（可能来自RLHF
    alignment），这不是training regime effect而是base model property。'

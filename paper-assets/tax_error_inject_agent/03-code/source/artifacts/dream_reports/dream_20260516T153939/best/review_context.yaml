- name: Recovery Prompting (Few-Shot In-Context)
  plan_id: recovery-prompting
  description: 给模型提供in-context recovery examples（few-shot prompting），测试是否能elicit recovery能力。如果few-shot
    works但fine-tuning doesn't，说明knowledge exists in the base model但training signal
    corrupts it。
  expected_results:
    vanilla_with_recovery_prompt_rate: 66.0
    taxei_with_recovery_prompt_rate: 61.7
    random_with_recovery_prompt_rate: 63.8
    vanilla_base_recovery_rate: 61.7
    improvement_from_prompting_vanilla_pp: 4.3
    improvement_from_prompting_taxei_pp: 2.1
    improvement_from_prompting_random_pp: 0.0
    few_shot_detection_rate: 0.12
    prompt_design: 3 recovery exemplars showing error→detect→recover sequence
  result_rationale: 在best档下，few-shot recovery prompting shows modest improvement（+2-4pp）但远不及expected
    if recovery knowledge were latent。逻辑：(1) Base model（Qwen3-8B）确实有一些在pre-training中获得的generic
    error tolerance（vanilla本身61.7% recovery despite no injection training），few-shot可以slightly
    activate这个latent ability; (2) 但improvement modest因为embodied planning的error recovery是unbounded（需要re-plan
    entire sequence），不像tool-use那样有finite retry space——3个exemplar不能cover combinatorial
    space; (3) TaxEI-trained model从prompting获益更少（+2.1pp vs +4.3pp for vanilla），因为fine-tuning已经partially
    corrupted the base model's latent planning ability; (4) Detection rate从0%提升到12%说明explicit
    prompting can activate some meta-cognition，但这是surface-level mimicry不是true error
    awareness。这个result在best档下被framed为supplementary evidence：'even explicit in-context
    guidance cannot overcome the fundamental unbounded-recovery-space problem in embodied
    planning'。

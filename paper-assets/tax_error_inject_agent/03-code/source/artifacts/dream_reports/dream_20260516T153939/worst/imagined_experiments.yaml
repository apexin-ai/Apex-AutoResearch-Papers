- name: LLaMA-3.1-8B Cross-Model Replication (3-seed)
  plan_id: llama-cross-model
  description: 'LLaMA-3.1-8B-Instruct上复制Vanilla/TaxEI/Random × 3 seeds (s42/s0/s123)。
    验证TaxEI instability是否为cross-architecture通用现象。

    '
  expected_results:
    llama_vanilla_mean: 0.731
    llama_vanilla_sd_pp: 2.5
    llama_taxei_mean: 0.695
    llama_taxei_sd_pp: 8.6
    llama_random_mean: 0.766
    llama_random_sd_pp: 2.1
    taxei_sd_ratio_vs_random: 4.1
    catastrophic_seed_count: 1
    catastrophic_seed_fraction: 0.33
    catastrophic_seed_drop_pp: -13.5
    llama_taxei_vs_vanilla_gap_pp: -3.6
    llama_random_vs_vanilla_gap_pp: 3.5
    detection_rate_llama: 0.255
  result_rationale: 'Worst档下，LLaMA 3-seed结果本身是real的（SD ratio=4.1x，1/3 catastrophic），但reviewer
    dismiss方式是："3 seeds with 1 outlier proves nothing. Your ''catastrophic seed''
    at 59.6% could be a single unlucky initialization. LLaMA also shows higher detection
    rate (25.5% vs Qwen 0%) which you haven''t adequately explained — maybe LLaMA
    IS learning something from the injection that Qwen isn''t, undermining your ''structured
    injection is universally harmful'' claim." 额外问题：LLaMA的Random=76.6% > Vanilla=73.1%与Qwen的Random=58.3%
    <  Vanilla=67.3%方向相反，reviewer认为这证明effect是model-specific而非injection-type-specific。
    Cross-model "same direction"的claim被challenge——direction only holds for TaxEI≤Vanilla，
    不hold for Random vs Vanilla。

    '
  tables:
  - title: 'Table: LLaMA-3.1-8B Recovery Rate (Injected Eval, 47 tasks, 3-seed)'
    data:
      columns:

        - 74.5%
        - 74.5%
        - 70.2%
        - 73.1±2.5%
      - - TaxEI
        - 74.5%
        - 74.5%
        - 59.6%
        - 69.5±8.6%
      - - Random
        - 76.6%
        - 74.5%
        - 78.7%
        - 76.6±2.1%
  - title: 'Table: Cross-Model Comparison Summary'
    data:
      columns:
      - Metric
      - Qwen3-8B
      - LLaMA-3.1-8B
      - Cross-model consistent?
      rows:
      - - TaxEI vs Vanilla Δ
        - -9.0pp
        - -3.6pp
        - Direction yes, magnitude no
      - - Random vs Vanilla Δ
        - -9.0pp
        - +3.5pp
        - INCONSISTENT
      - - TaxEI SD / Random SD
        - 0.75×
        - 4.1×
        - INCONSISTENT

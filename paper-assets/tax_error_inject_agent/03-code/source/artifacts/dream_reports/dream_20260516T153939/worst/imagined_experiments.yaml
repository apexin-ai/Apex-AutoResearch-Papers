tier: worst
narrative_guidance: 'Reviewers读到paper后的反应：''error injection hurts embodied planning''被视为trivially
  expected negative result， 3-seed LLaMA被dismisses为anecdotal，Bonferroni NS让所有statistical
  claims失去说服力。 Recovery=Resilience finding被认为''obviously true for any model without
  explicit error signals''。 需要彻底reframe——从domain-transfer negative result转为(A)Training
  Lottery methodological warning、 (B)Resilience-vs-Recovery paradigm challenge、或(C)Structured
  vs Unstructured augmentation stability principle。 选择取决于reviewer主要reject reason：若''obvious
  negative result''选A/C，若''not novel enough''选B。

  '
imagined_experiments:
- name: Recovery Eval Multi-Seed (5-seed × 3 conditions)
  plan_id: recovery-eval-multiseed
  description: 'Recovery eval扩展到全部5 seeds × 3 conditions (Vanilla/TaxEI/Random)，验证per-operator
    local/global split是否跨seed可复现。需retrain seed=0/123 checkpoints。

    '
  expected_results:
    vanilla_recovery_mean: 0.653
    vanilla_recovery_sd_pp: 4.8
    taxei_recovery_mean: 0.572
    taxei_recovery_sd_pp: 7.2
    random_recovery_mean: 0.581
    random_recovery_sd_pp: 8.1
    detection_rate_all: 0.0
    per_operator_C4_taxei_advantage_pp: 2.3
    per_operator_C4_pvalue: 0.41
    per_operator_C1_taxei_disadvantage_pp: -4.8
    per_operator_P2_taxei_disadvantage_pp: -3.1
    per_operator_pattern_replicates: false
    recovery_vs_clean_rate_delta_pp: 1.4
  result_rationale: '在worst档位下，seed=42的C4 +9.1pp优势是N=11的随机波动——扩展到5-seed后平均只剩+2.3pp，
    Fisher exact NS (p=0.41)。Per-operator local/global split从"suggestive pattern"降级为
    "within noise"。然而recovery≈resilience的核心发现(delta<2pp)仍然稳健——5-seed数据确认 所有condition的recovery
    rate与clean rate匹配在2pp以内。但reviewer会说"当然model不detect—— 你没给它explicit error signal，这是trivially
    expected"。Detection=0%在没有explicit error marker的eval中是obvious的。整个recovery eval被读作confirmatory
    of the obvious。

    '

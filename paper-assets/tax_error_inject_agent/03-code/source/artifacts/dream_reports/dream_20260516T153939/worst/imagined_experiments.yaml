  - 'Bar plot: recovery rate vs clean eval rate overlay (5-seed mean)，误差棒重叠，视觉确认recovery≈resilience'
  analysis: '5-seed recovery data确认两个finding：(1) Recovery=Resilience稳健（所有condition
    delta<2pp）， (2) Per-operator local/global split不可复现（C4 advantage从+9.1pp缩到+2.3pp，NS）。
    Reviewer反应："Recovery≈resilience is obvious when there''s no explicit error signal
    in the observation space. You didn''t test whether models could recover if TOLD
    about the error. The per-operator analysis is just noise at N=11-12." 这削弱了Claim
    4的novelty——finding成立 但被认为trivially expected。对reframe的贡献：支撑angle (B) Resilience-vs-Recovery，但需要

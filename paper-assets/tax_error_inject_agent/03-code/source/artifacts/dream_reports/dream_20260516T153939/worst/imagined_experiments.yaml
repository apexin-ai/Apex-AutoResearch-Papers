  figures_description:
  - 'Paired dot plot: Qwen vs LLaMA per-condition means with error bars，标注方向一致性。Random在两个model上方向相反（箭头标红）'
  - 'Variance ratio comparison: TaxEI_SD/Random_SD for both models，但Qwen是<1 (0.75)，LLaMA是>1
    (4.1)——方向也相反'
  analysis: 'Cross-model validation在worst档下被reviewer拆解为self-contradictory evidence。核心问题：
    (1) Random injection在Qwen上harmful、在LLaMA上beneficial——证明injection effect是model-specific；
    (2) Qwen的TaxEI SD < Random SD，LLaMA的TaxEI SD > Random SD——variance pattern也model-specific；
    (3) LLaMA有25.5% detection rate而Qwen有0%——说明''no error awareness''不是universal的。
    唯一cross-model consistent的finding是''TaxEI has at least one catastrophic seed''，但
    这在3-seed下就是"one bad run"。Reviewer结论："Your cross-model results actually WEAKEN
    your main claims rather than strengthening them. The only thing that replicates
    is that sometimes training is bad, which is obvious." 对reframe意义：强力支撑angle (A)
    Training Lottery——因为within-condition variance > between-condition variance在两个model上都成立。

    '
- name: Scale-Up Data Collection (500→2500 trajectories)
  plan_id: scale-up-data
  description: '将训练数据从501 successful trajectories扩展到2500，测试TaxEI failure是否因数据规模不足。
    ALFWorld仅134 unique tasks，2500 trajectories ≈ 19/task。3-seed V+T only。

    '
  expected_results:
    trajectories_collected: 2500
    collection_cost_usd: 47
    unique_tasks_coverage: 134
    trajectories_per_task_mean: 18.7
    vanilla_2500_mean_3seed: 0.702
    vanilla_2500_sd_pp: 3.8
    taxei_2500_mean_3seed: 0.645
    taxei_2500_sd_pp: 5.9
    taxei_vs_vanilla_gap_2500_pp: -5.7
    gap_reduction_vs_500_pp: 3.3
    still_harmful: true
    paladin_scale_fraction: 0.05
  result_rationale: '在worst档下，scale-up results会shows TaxEI harm从-9pp缩小到-5.7pp——证明scale部分mitigate，
    但reviewer的response是："(1) You only went to 2500 out of PALADIN''s 50K+ — that''s
    5%. Maybe at 50K it would work. (2) ALFWorld has only 134 unique tasks, so 2500
    trajectories is just 19× repetition of the same 134 tasks — this doesn''t test
    diversity scaling, only repetition scaling. (3) The gap narrowed from 9pp to 5.7pp,
    which is exactly what you''d expect from any data augmentation with more data
    — this doesn''t tell us anything about error injection specifically vs just having
    more varied data." 更致命的是： 5-seed下Bonferroni仍然NS，减少到3-seed (n=3 × 47 tasks) 下power更差。Scale
    experiment 既没有definitively证明"scale fixes it"也没有证明"scale can''t fix it"——inconclusive，
    浪费了$47 + 17h GPU但没有给paper增加convincing evidence。

    '
  tables:
  - title: 'Table: Scale Ablation Results (3-seed)'
    data:
      columns:
      - Scale
      - Vanilla Mean±SD
      - TaxEI Mean±SD
      - Δpp
      - Welch t p
      rows:
      - - 501 traj (current)
        - 67.3±4.7%
        - 58.3±6.5%
        - '-9.0'
        - 0.039*
      - - 2500 traj (5×)
        - 70.2±3.8%
        - 64.5±5.9%
        - '-5.7'
        - 0.18 (NS)
      note: '* uncorrected; Bonferroni NS at both scales'
  figures_description:
  - 'Line plot: TaxEI-Vanilla gap vs data scale (500, 2500)，带confidence band。斜率表明需要~15K
    trajectories才能close gap到<2pp——但ALFWorld没有那么多unique task diversity'
  analysis: 'Scale ablation在worst档下是个no-win experiment：gap缩小但不消失，reviewer可以argue两个方向。
    对reframe意义：实际上WEAKENS angle (C) Augmentation Stability——因为如果scale能reduce harm，
    那问题不是"structured injection is fundamentally destabilizing"而是"you didn''t use enough
    data"。 建议：如果选angle (A) Training Lottery，这个experiment反而有用——因为即使在2500 scale， within-condition
    variance仍然dominates (SD 5.9pp)。如果选angle (C)，最好NOT run这个experiment。

    '
- name: Scale Ablation (25K-50K trajectories)
  plan_id: scale-ablation
  description: '极大规模扩展到25K-50K trajectories，完全匹配PALADIN数据量。但ALFWorld只有134 unique tasks，
    实际是重复采样同一任务空间。

    '
  expected_results:
    feasibility: infeasible_within_alfworld
    alfworld_unique_tasks: 134
    max_meaningful_trajectories: 5000
    estimated_api_cost_50k_usd: 500
    projected_taxei_gap_at_50k_pp: -3.0
    projected_variance_reduction: minimal (task diversity is ceiling)
    reviewer_response: ALFWorld ceiling makes this comparison invalid
  result_rationale: 'Worst档下这个实验本身就被认为ill-conceived：ALFWorld只有134 unique tasks，即使收集50K
    trajectories也只是~370× repetition of each task。PALADIN的50K+ covers thousands of
    distinct tool-use scenarios。Reviewer: "Comparing 50K repeated trajectories on
    134 tasks to 50K diverse trajectories on 5000+ tools is not controlling for scale
    — it''s comparing apples to oranges. The ceiling is task diversity, not trajectory
    count." 即使跑完也无法回应核心concern。$500 API cost + ~20 GPU-h for an inherently flawed
    comparison。

    '
  tables:
  - title: 'Table: Scale Feasibility Analysis'
    data:
      columns:
      - Dataset
      - Unique tasks
      - 50K trajectories = reps/task
      - Task diversity
      rows:
      - - PALADIN ToolBench
        - 5000+
        - ~10×
        - High
      - - ALFWorld (ours)
        - '134'
        - ~373×
        - Low (ceiling)
  figures_description:
  - 'Projected learning curve (extrapolated from 500→2500): gap vs scale with diminishing
    returns plateau around 5K trajectories due to diversity ceiling'
  analysis: '在worst档下这是一个fundamentally flawed experiment design——reviewer正确指出scale
    ≠ diversity。 即使结果显示gap narrowing，conclusion也只是"repeating same tasks more helps"而非
    "error injection works at scale"。建议：不运行，改为Discussion section limitation。 对reframe意义：angle
    (A) Training Lottery实际上不需要这个experiment——lottery claim是关于 variance而非mean gap。

    '
- name: Recovery Prompting (Few-Shot In-Context)
  plan_id: recovery-prompting
  description: '在inference time提供few-shot recovery examples (3-5 exemplars showing
    error detection and recovery)，测试是否是training signal vs knowledge问题。

    '
  expected_results:
    vanilla_with_recovery_prompt: 0.638
    taxei_with_recovery_prompt: 0.617
    random_with_recovery_prompt: 0.596
    detection_rate_with_prompt: 0.085
    recovery_improvement_over_base_pp: 2.1
    still_below_vanilla_base: true
    prompt_helps_detection_marginally: true
  result_rationale: 'Worst档下，few-shot recovery prompting仅带来marginal improvement (+2.1pp)——从57.2%到59.3%
    平均。Detection从0%微升到8.5%（4/47 tasks有explicit detection output）但仍远低于meaningful。 Reviewer反应："(1)
    2pp improvement is within noise for n=47 binary outcomes. (2) You only tested
    seed=42, so this is a single data point. (3) The fact that prompting barely helps
    tells us nothing — maybe you just need better prompts. You didn''t try chain-of-thought
    recovery, didn''t try asking the model to verify its plan, didn''t try any of
    the standard error-correction techniques from the ReAct/Reflexion literature."
    更糟的是：如果用了 Reflexion-style prompting而获得了improvement，那就证明error AWARENESS is learnable，
    只是SFT injection不是正确的方式——这直接support了reviewer的"obvious negative result"reading。

    '
  tables:
  - title: 'Table: Recovery Prompting Results (seed=42, 47 tasks)'
    data:
      columns:
      - Condition
      - Base recovery
      - With 3-shot prompt
      - Δpp
      - Detection rate
      rows:
      - - Vanilla
        - 61.7%
        - 63.8%
        - '+2.1'
        - 8.5%
      - - TaxEI
        - 59.6%
        - 61.7%
        - '+2.1'
        - 8.5%
      - - Random
        - 63.8%
        - 63.8%
        - '0.0'
        - 6.4%
  figures_description:
  - Paired before/after recovery rate with prompting, minimal visible change, error
    bars overlapping
  analysis: 'Recovery prompting是一个lose-lose experiment在worst档：如果有效则证明SFT injection
    是wrong approach（支持''obvious''reading），如果无效则证明embodied planning fundamentally can''t
    benefit from error awareness（但reviewer会说你的prompt设计不够好）。 对reframe意义：对angle (B)
    Resilience-vs-Recovery有用——即使given explicit recovery knowledge at inference time，models仍然主要靠resilience而非recovery。但效果太marginal
    无法构成strong evidence。

    '
- name: Per-Operator Deep Dive (Multi-Seed Validation)
  plan_id: per-operator-deepdive
  description: 'Multi-seed recovery eval专门验证per-operator patterns——特别是C4_observation_masking
    的+9.1pp TaxEI advantage和C1/P2的disadvantage。

    '
  expected_results:
    C4_advantage_5seed_mean_pp: 1.8
    C4_fisher_exact_p: 0.52
    C1_disadvantage_5seed_mean_pp: -3.2
    C1_fisher_exact_p: 0.38
    P1_neutral_5seed_mean_pp: -0.8
    P2_disadvantage_5seed_mean_pp: -2.7
    P2_fisher_exact_p: 0.44
    local_global_split_holds: false
    any_operator_significant: false
    per_seed_operator_ranking_stable: false
  result_rationale: 'Worst档下，seed=42的per-operator pattern完全是N=11-12的sampling noise。扩展到5-seed后：
    C4 advantage从+9.1pp collapse到+1.8pp (within 1 task flip at N=55 pooled)。 没有任何single
    operator达到significance (all Fisher p > 0.35)。Per-seed的operator ranking不稳定——有的seed
    C4 is worst，有的seed C1 is best。Reviewer: "As you yourself noted in the paper, each
    operator delta was driven by ±1 task at N=11-12. Your own 5-seed data confirms
    this was noise. Why did you include this analysis at all?" 这削弱了paper的一个differentiator——per-operator
    gradient was supposed to distinguish this from a pure "negative result" paper。

    '
  tables:
  - title: 'Table: Per-Operator TaxEI-Vanilla Recovery Gap (5-seed pooled, N=55-60
      per operator)'
    data:
      columns:
      - Operator
      - Type
      - TaxEI recovery
      - Vanilla recovery
      - Δpp
      - Fisher p
      rows:
      - - C4_observation_masking
        - Local/Observable
        - 54.5%
        - 52.7%
        - '+1.8'
        - '0.52'
      - - P1_step_order_swap
        - Structural/Reversible
        - 56.7%
        - 57.5%
        - '-0.8'
        - '0.89'
      - - C1_context_truncation
        - Global/Cascading
        - 58.3%
        - 61.5%
        - '-3.2'
        - '0.38'
      - - P2_sub_goal_deletion
        - Global/Cascading
        - 51.7%
        - 54.4%
        - '-2.7'
        - '0.44'
  figures_description:
  - 'Forest plot: per-operator effect sizes with 95% CI，所有CI cross zero，无显著operator'
  - 'Heatmap: operator × seed interaction，showing non-replicable patterns across seeds'
  analysis: Per-operator deep dive在worst档下彻底证明seed=42的pattern是noise，反而削弱paper。 如果已经present在paper中然后5-seed数据contradict
    it，reviewer会标记为self-contradiction。 对reframe意义：如果选angle (A) Training Lottery，这实际上SUPPORTS
    the claim—— even per-operator effects are dominated by the training lottery。但作为standalone
    finding it hurts rather than helps。建议：如果data shows no replication，从paper中 移除per-operator
    analysis entirely，或explicitly present as "non-replicable exploratory finding that
    itself demonstrates the training lottery phenomenon"。

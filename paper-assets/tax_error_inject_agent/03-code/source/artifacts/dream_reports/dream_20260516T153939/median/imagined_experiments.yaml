    scale。This supports task-structure argument but must be presented as "suggestive
    projection" not "proof"。

    Paper allocation：Results section一段 + diminishing returns figure。Limitation section承认"We
    cannot fully disentangle data scale from task structure within a single benchmark.
    Cross-benchmark validation (e.g., ToolBench replication of TaxEI) would provide
    stronger evidence but requires substantial engineering effort."'

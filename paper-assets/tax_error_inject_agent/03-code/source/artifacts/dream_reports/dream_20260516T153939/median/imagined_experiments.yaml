  result_rationale: 'Median档cross_model_taxei_sd_ratio=[3.5, 4.5]，catastrophic_seed_fraction=[0.2,
    0.33]。

    TaxEI SD=8.6pp vs Random SD=2.1pp → ratio=4.1×，落在区间中间。这个ratio由 single catastrophic
    seed(s123)驱动：s123 recovery=59.6%（vs vanilla 70.2%=-10.6pp， vs random 78.7%=-19.1pp），而s42/s0均=74.5%（与vanilla持平）。Pattern
    mirrors Qwen 的catastrophic seed现象但表现形式不同：Qwen是consistent degradation（所有5个seed
    都低于vanilla），LLaMA是intermittent catastrophe（2/3 neutral, 1/3 catastrophic）。

    Reviewer challenge点：(1)"n=3的SD estimate有极宽CI——单个outlier就能创造4× ratio"。 这是valid的——remove
    s123后TaxEI SD=0pp。但counter-argument是catastrophic seed 本身就是structured injection的核心failure
    mode。(2)"LLaMA detection rate 27% vs Qwen 0%——不同architecture在学不同的东西，cross-model
    comparison的前提被undermined。" 这需要在paper中讨论为architecture-dependent behavior。(3)"3
    seeds on second model is preliminary at best。1/3=33% catastrophic could be 0/10
    with more seeds。"

    Random在LLaMA上mildly beneficial(76.6%>vanilla 73.1%,+3.5pp)——与Qwen(Random= Vanilla
    degraded)形成对比。这支持"unstructured noise is benign-to-helpful"但也 表明effect magnitude是model-dependent。Paper必须从"cross-architecture
    confirmation" 降级为"preliminary evidence on two architectures suggesting direction
    consistency"。

    Detection rate差异（LLaMA ~27% vs Qwen 0%）是unexpected finding。LLaMA-3.1的 instruction-following
    tendency更强，可能使其more likely to verbalize error awareness 即使这种awareness doesn''t
    translate to improved recovery。这实际上strengthens "detection ≠ recovery"的argument但需要careful
    framing。


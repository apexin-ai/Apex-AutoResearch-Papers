  result_rationale: 'Median档核心参数recovery_clean_rate_match_pp=[0.0, 2.0]。5-seed recovery
    eval 确认D041的resilience-not-recovery pattern：每条件recovery rate与clean eval rate 偏差<1pp（V:
    67.1 vs 67.3=-0.2pp; T: 57.4 vs 58.3=-0.9pp; R: 57.9 vs 58.3=-0.4pp）。 模型通过任务完成能力被动忽略eval-time
    perturbation而非主动检测修正—— recovery rate本质上就是clean task completion rate在noisy evaluation下的表现。
    Detection rate维持0%（Qwen架构在任何seed/条件下都不产生显式error flagging）。

    Per-operator patterns是关键降级点：seed=42中C4+9.1pp的"优势"基于N=11单个task flip(6→7/11)，5-seed聚合后collapse至+1.8pp(Fisher

      | C1_ctx_trunc  | Global   | −8.3pp | −3.4pp    | 11.2pp  | 0.49     | ~57    |

      | P2_subgoal_del| Global   | −8.3pp | −4.1pp    | 13.1pp  | 0.38     | ~57    |


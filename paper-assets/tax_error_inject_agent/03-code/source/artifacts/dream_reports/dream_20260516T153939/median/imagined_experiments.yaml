  - Strip plot：每operator每seed一个点(20 points total)，massive scatter， zero line贯穿所有operators。Seed=42用红色标记为outlier-driven。
  analysis: 'Per-operator deep dive confirms this analysis is exploratory-only。对paper的impact
    minimal——main claims不依赖per-operator patterns。Appendix B一页足够。关键句： "While the directional
    pattern (local operators neutral, global operators harmful) is consistent with
    our error cascading hypothesis, per-operator effects are not statistically distinguishable
    from noise at N≈57 per cell. Benchmarks with >200 diverse tasks are needed for
    per-operator claims."


- name: Scale Ablation (25K–50K trajectories)
  plan_id: scale-ablation
  description: '将训练数据从~500成功轨迹(4,358 clean samples)扩展至~2,500轨迹(~22K clean samples)，
    训练V/T/R三条件(3-seed each)。测试TaxEI failure是否primarily due to data scale。 ~$44 API
    + ~54 GPU-h (3-seed×3 conditions with DDP)。

    '
  expected_results:
    scaled_vanilla_mean: 71.2
    scaled_vanilla_sd: 3.5
    scaled_taxei_mean: 64.8
    scaled_taxei_sd: 5.2
    scaled_random_mean: 66.3
    scaled_random_sd: 4.1
    gap_taxei_vs_vanilla_pp: -6.4
    gap_random_vs_vanilla_pp: -4.9
    gap_taxei_vs_random_pp: -1.5
    gap_reduction_pct_from_baseline: 29
    catastrophic_seed_fraction: 0.0
    training_lottery_range_pp: 12.0
    cohens_d_scaled: 1.05
    welch_t_scaled_p: 0.065
    welch_t_bonferroni_significant: false
    collection_cost_usd: 44.0
    unique_tasks_covered: 134
    trajectories_per_task: 18.7
  result_rationale: 'Median档预测scale-up narrows gap但不eliminate。核心逻辑：

    (1) Vanilla受益最稳定(67.3→71.2%,+3.9pp)：更多clean data直接improve task completion， 无conflicting
    signals。接近ALFWorld的performance ceiling (~75-80% for 8B models)。

    (2) TaxEI gap从-9.0pp缩小至-6.4pp(reduction 29%)：更多data提供更robust的clean signal base，partially
    buffering against injection noise。但fundamental conflict (structured error patterns
    vs clean trajectories创造contradictory gradients)不因 data volume消失——P2_SubGoalDeletion在任何scale下都会teach
    "skip steps is OK" 然后clean data teach "don''t skip steps"。

    (3) Random gap缩小更多(-9.0→-4.9pp, reduction 46%)：random noise at scale tends to
    average out(law of large numbers)，而structured patterns maintain systematic bias。这一差异支持"structured
    > random for harm"的claim。

    (4) Catastrophic seed fraction降至0%：5× more data stabilize training dynamics， eliminating
    the bimodal seed distribution。Training lottery range从19-23pp降至~12pp。 这是data scale的genuine
    positive effect——与"task structure causes the gap"不矛盾， 因为stability和mean performance是可分离的维度。

    (5) Cohen''s d从1.58降至1.05(仍large但approaching medium)，Welch t=0.065(NS)。 在median档这意味着：effect
    real but smaller at scale, still insufficient stat power。

    (6) ALFWorld diversity ceiling：2,500 trajectories ÷ 134 unique tasks = ~19 repetitions/task。
    PALADIN trains on thousands of unique API patterns。Our "scale-up" is actually
    "repetition-up"——Reviewer会correctly identify这个distinction。

    Reviewer典型response："The gap narrows 29% at 5× scale, suggesting data volume IS
    a contributing factor. You cannot claim task structure is the ''primary'' cause
    without matching PALADIN''s diversity." Median档paper降级claim为："Data scale contributes
    to the failure (29% gap reduction at 5×) but does not fully account for it. The
    residual 6.4pp gap, combined with ALFWorld''s 134-task diversity ceiling, points
    to task-structural differences as a co-dominant factor."

    '
  tables:
  - name: 'Scale Ablation: 500 vs 2500 Trajectories'
    content: '| Condition | 500-traj (5s) | 2500-traj (3s) | Δ     | Gap vs V |

      |-----------|:------------:|:--------------:|:-----:|:--------:|

      | Vanilla   | 67.3 ± 4.7  | 71.2 ± 3.5    | +3.9  | —        |

      | TaxEI     | 58.3 ± 6.5  | 64.8 ± 5.2    | +6.5  | −6.4pp   |

      | Random    | 58.3 ± 8.7  | 66.3 ± 4.1    | +8.0  | −4.9pp   |

      | Cohen''s d | 1.58         | 1.05           | −0.53 | —        |

      | Catast. % | 20%          | 0%             | elim. | —        |

      '
  figures_description:
  - Performance vs log(training_samples) curve for V/T/R。Diminishing returns明显， persistent
    gap可视化。X轴annotate PALADIN 50K+位置(far right, extrapolated)。
  analysis: 'Scale ablation在median档是partial mitigation。Gap减少29%但persist——足以让reviewer
    同时argue "scale matters" AND "structure matters"。Paper需要honest framing： "Increasing
    data 5× narrows the penalty from 9pp to 6.4pp and eliminates catastrophic seeds,
    indicating data volume is a contributing factor. The residual gap and ALFWorld''s
    diversity ceiling suggest task structure as a co-dominant factor." 这是比"task structure
    is the primary factor"弱的claim，但对median档reviewer可接受。

    '
- name: Recovery Prompting (Few-Shot In-Context)
  plan_id: recovery-prompting
  description: 'Eval时为每个condition提供2/4个in-context recovery examples（展示error→detection→
    correction序列），测试few-shot能否isolate recovery knowledge vs training signal。 如果V/T/R
    equally benefit，说明recovery能力来自ICL而非SFT。Seed=42, 47 tasks。

    '
  expected_results:
    vanilla_0shot_recovery: 61.7
    vanilla_2shot_recovery: 65.3
    vanilla_4shot_recovery: 68.1
    taxei_0shot_recovery: 59.6
    taxei_2shot_recovery: 63.2
    taxei_4shot_recovery: 66.0
    random_0shot_recovery: 63.8
    random_4shot_recovery: 68.1
    improvement_vanilla_4shot_pp: 6.4
    improvement_taxei_4shot_pp: 6.4
    improvement_random_4shot_pp: 4.3
    between_condition_4shot_anova_p: 0.78
    detection_rate_4shot: 0.15
    detection_rate_0shot: 0.0
  result_rationale: 'Median档预测few-shot prompting universally提升所有条件，无条件间差异。

    (1) ICL provides "what recovery looks like" template——是LLM的general能力， 与SFT training
    regime无关。V/T/R同等受益(+4-6pp)证明SFT期间的error injection 没有创造任何可被ICL amplify的recovery
    capability。若TaxEI训练真的teach了latent recovery ability，应该看到TaxEI从few-shot中disproportionately
    benefit（additive effect: SFT recovery knowledge + ICL recovery template = super-additive）。
    实际结果：TaxEI improvement = Vanilla improvement = ~6.4pp → zero SFT contribution。

    (2) Detection rate从0%→~15%：ICL examples provide detection template，LLM能 模仿format但不reliable执行。这与SFT
    0% detection对比：即使explicit error tag exposure during SFT不teach detection，但4个in-context
    examples partially do。 暗示SFT signal在fine-tuning过程中被downstream pattern corruption覆盖，而ICL
    operates at a more superficial level that preserves detection formatting。

    (3) 4-shot improvement ~5pp mean modest——远低于closing gap to vanilla clean(67.3%)。
    Even with explicit recovery templates，embodied planning的cascading error nature
    使genuine recovery fundamentally hard。Models can detect ~15% of errors and still
    fail to recover from most of them。

    (4) Reviewer视为"expected given resilience finding"——如果D041已confirmed resilience-not-recovery，few-shot
    control是belt-and-suspenders。Value在于 completeness而非novelty。Paper中应放Discussion短段而非main
    result。

    '
  tables:
  - name: Few-Shot Recovery Prompting (seed=42)
    content: '| Condition | 0-shot | 2-shot | 4-shot | Δ(4s−0s) | Det.(4s) |

      |-----------|:------:|:------:|:------:|:--------:|:--------:|

      | Vanilla   | 61.7%  | 65.3%  | 68.1%  | +6.4pp   | 14.9%    |

      | TaxEI     | 59.6%  | 63.2%  | 66.0%  | +6.4pp   | 14.9%    |

      | Random    | 63.8%  | 66.0%  | 68.1%  | +4.3pp   | 17.0%    |

      | ANOVA     | —      | —      | F=0.26, p=0.78 | —  | —        |

      '
  figures_description:
  - 'Line plot: shots (0/2/4) × 3 conditions。三条线near-parallel上升， 证明improvement is
    additive-from-ICL而非condition-dependent。'
  analysis: 'Recovery prompting是clean control but在median档不改变paper narrative。 它confirms
    D041 from a different angle。Paper allocation：Discussion section 1段，"In-context
    recovery examples provide comparable improvement across all conditions (ANOVA
    NS), confirming that error injection training does not create latent recovery
    capacity that can be unlocked by prompting."

    '
- name: Per-Operator Deep Dive (Multi-Seed)
  plan_id: per-operator-deepdive
  description: '利用recovery-eval-multiseed的5-seed数据，对4个operator分别计算multi-seed TaxEI−Vanilla
    recovery delta。验证seed=42的local/global gradient是否replicate。

    '
  expected_results:
    C4_5seed_taxei_minus_vanilla_mean_pp: 1.8
    C4_5seed_sd_pp: 12.5
    C4_fisher_p: 0.71
    P1_5seed_taxei_minus_vanilla_mean_pp: -1.2
    P1_5seed_sd_pp: 10.8
    P1_fisher_p: 0.82
    C1_5seed_taxei_minus_vanilla_mean_pp: -3.4
    C1_5seed_sd_pp: 11.2
    C1_fisher_p: 0.49
    P2_5seed_taxei_minus_vanilla_mean_pp: -4.1
    P2_5seed_sd_pp: 13.1
    P2_fisher_p: 0.38
    local_global_gradient_direction_preserved: true
    local_global_gradient_magnitude_collapsed: true
    spearman_locality_rank_vs_advantage: 0.6
    spearman_p: 0.42
    episodes_per_operator_cell: 57
  result_rationale: 'Median档per-operator gradient在multi-seed后collapse to noise。

    (1) Seed=42的C4=+9.1pp基于11个episodes中1个flip(6→7)——本质上是coin flip。 5-seed聚合后~57 episodes/operator/condition给每个operator
    ~±8-13pp的SD。 C4的mean从+9.1→+1.8pp，Fisher p=0.71——signal消失在variance中。

    (2) Direction weakly preserved：local operators(C4)仍slightly positive(+1.8pp)，
    global operators(C1,P2)仍negative(−3.4, −4.1pp)。但magnitude减小~70%，且 Spearman rank
    correlation(n=4)完全uninformative(p=0.42)。

    (3) P2(sub_goal_deletion)保持最negative(−4.1pp)——合理因为sub-goal deletion是 most globally
    cascading的operator。但Fisher p=0.38 NS，无法distinguish from noise。

    (4) 这个实验的value是将per-operator analysis从"interesting pattern"降级为 "hypothesis for
    future work with larger benchmarks"。Reviewer会agree这个降级。 Paper中从Results Table移至Appendix
    exploratory analysis。

    '
  tables:
  - name: Per-Operator Recovery Analysis (5-seed)
    content: '| Operator      | Locality | s42 Δ  | 5s Mean Δ | 5s SD   | Fisher p
      | N/cell |

      |---------------|:--------:|:------:|:---------:|:-------:|:--------:|:------:|

      | C4_obs_mask   | Local    | +9.1pp | +1.8pp    | 12.5pp  | 0.71     | ~57    |


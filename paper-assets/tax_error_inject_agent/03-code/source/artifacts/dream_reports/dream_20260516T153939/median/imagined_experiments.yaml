- name: Scale-Up Data Collection (500→2500 Trajectories)
  plan_id: scale-up-data
  description: 'GPT-5.2 trajectory collection从501扩展至~2,500成功轨迹。分阶段：先1,000 check trend再决定2,500。ALFWorld
    diversity ceiling ~134 unique tasks。~$44 API cost。

    '
  expected_results:
    phase1_1000_trajectories: 1000
    phase1_1000_cost_usd: 17.6
    phase1_1000_success_rate: 0.7
    phase1_1000_unique_tasks: 134
    phase1_1000_traj_per_task: 7.5
    phase1_1000_taxei_gap_trend_pp: -7.1
    phase2_2500_trajectories: 2500
    phase2_2500_cost_usd: 44.0
    phase2_2500_traj_per_task: 18.7
    phase2_2500_samples_clean: 21790
    phase2_2500_samples_injected: 18400
    phase2_total_training_time_h: 54
    phase2_wall_clock_ddp_h: 17
    diminishing_returns_500_to_1000_gap_reduction_pp: 1.9
    diminishing_returns_1000_to_2500_gap_reduction_pp: 0.7
  result_rationale: 'Scale-up data collection在median档是feasibility + diminishing returns
    story。

    (1) Collection feasibility confirmed：70% success rate stable（与initial 501-traj
    collection一致），cost linear($8.86/500≈$44/2500)。无technical barrier。

    (2) Phase 1 (1,000-traj) gap已经narrow(9.0→7.1pp)，phase 2 (2,500) further narrow(7.1→6.4pp)——clear
    diminishing returns。500→1000 gains 1.9pp， 1000→2500 only 0.7pp。Extrapolating logarithmically，5000
    traj would yield ~5.5pp gap——仍non-zero。

    (3) ALFWorld diversity ceiling是fundamental：134 unique tasks × 18.7 repetitions
    = pure repetition augmentation。PALADIN''s advantage可能是task diversity (thousands
    of unique API call patterns)而非volume。Paper应explicit state： "Within ALFWorld''s
    134-task diversity ceiling, data scale reduction accounts for ~29% of the injection
    penalty. The remaining gap likely reflects task-structural differences that cannot
    be resolved by repetition-based scaling."

    (4) 训练resource significant(54 GPU-h total for 3s×3c)但feasible with 4×5090。 Question
    is ROI：这个experiment对reviewer的说服力是moderate——它addresses concern #10 partially but
    opens the door for "you need to scale to 50K" counter-argument。

    (5) Median档reviewer response：将scale-up result视为evidence for mixed causation (both
    scale and structure contribute)而非clean separation。这是reasonable——我们 不能fully disentangle
    scale from structure within a single benchmark。

    '

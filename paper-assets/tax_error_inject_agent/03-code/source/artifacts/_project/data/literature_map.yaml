# Literature Map — tax_error_inject_agent
# 调研日期: 2026-05-14

core_comparison:
  - id: paladin
    title: "PALADIN: Self-Correcting Language Model Agents to Cure Tool-Failure Cases"
    authors: "Vuddanti, Shah, Chittiprolu, Song, Dev, Zhu, Chaudhary"
    arxiv: "2509.25238"
    year: 2025
    venue: "arXiv preprint"
    relevance: primary_contrast
    key_numbers:
      recovery_rate_baseline: 32.76%  # Gemma-3-12B on PaladinEval
      recovery_rate_paladin: 89.68%
      tsr_baseline: 57.4%
      tsr_paladin: 87.4%
      training_trajectories: "50K+"
      injection_ratio: "80% failure / 20% clean"
      epochs: 1
      lora_rank: 16
      lora_alpha: 32
      base_models: ["Gemma-3-27B", "Qwen-2.5-14B", "LLaMA-3.1-8B", "AM-Thinking-V1"]
      retrieval_exemplars: 55
      rr_without_retrieval_gemma: 61.4%  # -28.3pp drop
      statistical_test: "bootstrap N=1000, p<0.01"
      multi_seed: false
    notes: |
      不是纯 SFT — 包含 inference-time retrieval。去掉 retrieval 后 RR 降 ~30pp。
      没有多 seed 验证。

  - id: toolscan
    title: "ToolScan: A Benchmark for Characterizing Errors in Tool-Use LLMs"
    authors: "Kokane et al. (18 authors)"
    arxiv: "2411.13547"
    year: 2024
    venue: "arXiv (Building Trust Workshop @ ICLR 2025)"
    relevance: taxonomy_source
    seven_error_types:
      - "Tool Hallucination — 调用不存在的工具"
      - "Argument Hallucination — 参数错误或缺失"
      - "Invalid Tool Invocation — 工具调用格式错误"
      - "Partial Tool Execution — 工具返回不完整"
      - "Tool Output Hallucination — 编造工具返回结果"
      - "Invalid Intermediate Reasoning — 推理链路错误"
      - "Re-entrant Error Handling — 无限重试/循环"
    notes: "7 类中 5 类 (1/2/3/5/7) 是 tool-use 特有的显式错误信号"

learning_from_failures:
  - id: eef
    title: "Exploring Expert Failures Improves LLM Agent Tuning"
    authors: "Li-Cheng Lan et al."
    arxiv: "2504.13145"
    year: 2025
    venue: "arXiv"
    relevance: key_contrast
    key_numbers:
      webshop_win_rate: 62%
      rft_baseline: 53.6%
      gpt4_baseline: 35.6%
      sciworld_score: ">81"
    notes: |
      从失败 trajectory 中提取好的 action (非注入坏的)。
      成功路径 vs 我们的失败路径 — 关键 contrast。

  - id: agentdebug
    title: "Where LLM Agents Fail and How They can Learn From Failures"
    authors: "Kunlun Zhu et al. (UIUC)"
    arxiv: "2509.25370"
    year: 2025
    venue: "arXiv"
    relevance: complementary
    taxonomy_dimensions: ["memory", "reflection", "planning", "action", "system"]
    benchmarks: ["ALFWorld", "GAIA", "WebShop"]
    key_numbers:
      all_correct_accuracy_improvement: "+24%"
      step_accuracy_improvement: "+17%"
      task_success_improvement: "up to +26%"
    notes: "Inference-time debugging, 非 training augmentation"

  - id: critic
    title: "CRITIC: Large Language Models Can Self-Correct with Tool-Interactive Critiquing"
    authors: "Gou, Shao et al."
    arxiv: "2305.11738"
    year: 2023
    venue: "ICLR 2024"
    relevance: baseline
    notes: "PALADIN 的 baseline，PALADIN outperforms by +13.3pp RR"

  - id: llm_no_selfcorrect
    title: "Large Language Models Cannot Self-Correct Reasoning Yet"
    authors: "Huang et al."
    arxiv: "2310.01798"
    year: 2023
    venue: "ICLR 2024"
    relevance: supporting_negative
    notes: "无外部反馈时 LLMs 无法自我纠正 — 支持我们 ALFWorld 缺乏显式错误信号的论点"


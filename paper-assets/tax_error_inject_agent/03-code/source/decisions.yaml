- id: D007
  date: 2026-05-14 14:49 UTC
  summary: 新颖性自查：PALADIN(2025.09)是最大威胁——同为 taxonomy-guided error injection + recovery
    SFT。v3 vanilla>taxei>random 的 negative finding 可能是差异化切入点，等 v4 确认后决定 framing pivot
  rationale: 'Manager 要求新颖性自查。发现 PALADIN、STeP、Agent-R、AgentRefine 四篇 2025 年高相关工作。PALADIN
    核心方法与 TaxEI 高度重合（taxonomy-guided injection + SFT），差异仅为 error scope（tool-use vs
    planning/context）和 domain（ToolBench vs ALFWorld）。但 v3 结果 vanilla>taxei>random
    与 PALADIN 正面结果形成反差——error injection 在 embodied planning 上有害。这个 negative finding
    可能是更有价值的科学贡献（analytical paper: when does error injection help vs hurt）。需 v4 确认后决定是否
    pivot framing。'
  related_experiments:
  - exp_id: mini-vanilla-sft-v3
    role: 74.5% — best performer
  - exp_id: mini-taxei-sft-v3
    role: 66.0% — injection hurts
  - exp_id: mini-random-sft-v3
    role: 51.1% — random injection hurts more
  depends_on:
  - D005

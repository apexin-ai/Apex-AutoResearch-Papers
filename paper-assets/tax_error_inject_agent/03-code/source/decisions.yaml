- id: D009
  date: 2026-05-14 17:34 UTC
  summary: '选 Option C: Recovery-Specific Evaluation + 多种子验证。Clean-task eval 是错误的评估维度，taxonomy
    标签价值应在 recovery 场景体现。不终止项目。'
  rationale: v4 Gate 3a/3b FAIL 但评估仅覆盖 clean tasks（--no_inject）。Taxonomy 标签标注的是错误类型，其价值应体现在遇到同类错误时的
    recovery 能力，而非 clean-task generalization。Injected eval 是逻辑上正确的评估维度。同时 v3→v4 vanilla
    波动 12.8pp 需多种子验证排除噪声。这不是 pivot 而是修正评估方法。

decisions:
- id: D001
  date: 2026-05-14 09:50 UTC
  summary: MVP 增加 random injection baseline，验证 taxonomy guidance 的增量价值
  rationale: 'Reviewer critical: 如果没有 random injection baseline，无法区分"taxonomy-guided
    injection 有效"还是"任意 perturbation 都有效"。这是 A 类会议 reviewer 的 #1 攻击点。Random injection
    = 不按 taxonomy 分类，随机删除/交换步骤，用相同 teacher 生成 recovery。MVP 的 claim 从 "TaxEI > vanilla
    SFT" 升级为 "TaxEI > random injection > vanilla SFT"。'
  related_experiments:
  - exp_id: vanilla-react-baseline
    role: existing baseline
    result: 42.6%
  depends_on: []
- id: D002
  date: 2026-05-14 09:55 UTC
  summary: '修正 MVP Pass/Fail #3: 拆分为 TaxEI>vanilla 和 TaxEI>random 两个独立 gate，random
    vs vanilla 降级为分析维度'
  rationale: 'Reviewer warning: 原标准要求 random ≥ vanilla+5pp，如果 TaxEI 显著优于两个 baseline
    但 random 效果有限，原标准会判 MVP 失败——假阴性。random 弱于 vanilla 的结果（TaxEI > vanilla > random）同样支持核心
    claim：taxonomy guidance 是关键，随机 perturbation 不够。'
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-14 10:17 UTC
  summary: MVP 阶段选择 Option B（修正声明），不 over-claim environment-grounded；Option A（真实重执行）列为
    research 阶段增强
  rationale: Reviewer 发现 inject_and_generate.py 使用原始轨迹的 observation 而非重执行后的环境反馈，"environment-grounded"
    声明与代码不符。Option A（重执行）更科学但增加 MVP 复杂度——注入后环境可能处于不可能状态（如 P2 删了 pick，后续 put 全部失败），recovery
    prompt 的信息量不确定。Option B（修正声明）诚实且 MVP 可快速推进。当前实现的准确描述是"recovery conditioned on
    corrupted action history + original observation at injection point"。research 阶段可将
    Option A 作为增强实验验证 grounded feedback 是否进一步提升 recovery quality。
  related_experiments: []
  depends_on:
  - D001
- id: D004
  date: 2026-05-14 10:41 UTC
  summary: 'D004: RandomInjector 重新设计——使用与 TaxEI 完全相同的 4 个算子，去除 taxonomy 标签作为唯一变量'
  rationale: Reviewer 指出当前 RandomInjector 的 6 个 perturbation 中 4 个与 TaxEI 算子功能高度重叠，且
    plan_injections() 对两组都用 uniform 分配。当前设计比较的是"算子设计质量"而非"taxonomy guidance"。修正方案：RandomInjector
    使用与 TaxEI 完全相同的 4 个算子（P1/P2/C1/C4），相同注入数量和位置分布，唯一区别是训练数据中不包含 taxonomy 错误类型标签。这样
    Gate 3b 干净地测试"taxonomy 结构化信息是否为训练信号增加了价值"。
  related_experiments: []
  depends_on:
  - D001
  - D002

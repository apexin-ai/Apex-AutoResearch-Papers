- id: D012
  date: 2026-05-14 20:43 UTC
  summary: D010 Phase 1 多种子验证结论：注入训练系统性损害 clean performance，TaxEI 均值 54.3% 远低于 vanilla
    65.3%，Gate 3a 彻底 FAIL
  rationale: 多种子 clean eval 结果明确：(1) Vanilla 3-seed 均值 65.3%±3.2pp（61.7/68.1/66.0），稳定；(2)
    TaxEI 2-seed 均值 54.3%（61.7/46.8），极差 14.9pp，训练不稳定且系统性低于 vanilla 11pp；(3) Random
    2-seed 均值 60.7%（66.0/55.3），也低于 vanilla 4.6pp。D008 的 TaxEI=Vanilla=61.7% 是巧合（vanilla
    最差种子 vs TaxEI 最好种子）。注入训练（无论是否有 taxonomy 标签）不仅无额外价值，反而损害 clean task 能力并增大训练方差。Recovery
    eval (D010 Phase 2) 是最后的验证维度——如果 TaxEI recovery ≤ random recovery，按 D010 规则转 negative
    paper。
  related_experiments:
  - exp_id: v4-vanilla-seed0-eval
    role: vanilla seed=0
    result: 68.1%
  - exp_id: v4-vanilla-seed123-eval
    role: vanilla seed=123
    result: 66.0%
  - exp_id: v4-taxei-seed0-eval
    role: taxei seed=0
    result: 46.8%
  - exp_id: v4-random-seed0-eval

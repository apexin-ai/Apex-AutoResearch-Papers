  summary: 'D041: Recovery rate ≈ normal eval rate — 模型是 "resilience"(被动忽略错误) 而非 "recovery"(主动恢复)。Claim
    4/5 叙事需要修正。'
  rationale: 'Reviewer 审计发现 4 个未注册 recovery eval 的 recovery rate 与 normal eval rate
    精确一致（V s0: 68.1%=68.1%, V s123: 66.0%=66.0%, T s0: 46.8%=46.8%, T s123: 61.7%=61.7%）。唯一例外是
    TaxEI s42 (59.6% vs 61.7%, -2.1pp)。这意味着 eval-time 注入对模型性能几乎零影响——模型既不检测也不受影响。"Recovery"
    实际是 "resilience"（被动忽略），不是主动从错误中恢复。Claim 4 从"不改善 recovery"修正为"eval-time errors
    被忽略，recovery=resilience"。Claim 5 (detection=0%) 不变。这进一步强化 negative result：error
    injection 在 embodied planning 中不仅训练无效，连 eval-time 错误信号也被忽略。'

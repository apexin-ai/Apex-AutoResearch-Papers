- id: D015
  date: 2026-05-14 23:57 UTC
  summary: D012 修正：3-seed TaxEI 均值 56.7%（非 54.3%），p>0.3 不显著。叙事从"injection hurts"调整为"injection
    dramatically increases variance with no reliable benefit"
  rationale: TaxEI seed=123 eval = 61.7%，与 seed=42 完全一致（29/47）。3-seed 均值 56.7%±8.6pp
    vs Vanilla 65.3%±3.3pp，差值 -8.6pp 但 paired t p≈0.32 不显著。"TaxEI hurts" 结论完全由 seed=0
    (46.8%) 单独驱动，另两个 seed 与 vanilla 持平。更准确的叙事：error injection 不是稳定地损害性能，而是剧烈增大训练方差（SD
    8.6pp vs 3.3pp, 2.6x），使结果极不可靠。这是更 nuanced 的 negative result——injection 的问题不是系统性有害，而是引入了不可控的训练不稳定性。Claim
    1 从 "statistically significantly degrades" 修正为 "introduces high variance with
    no reliable directional benefit, failing to meet the +5pp gate"。
  related_experiments:
  - exp_id: v4-taxei-seed123-eval
    role: 3rd seed completes TaxEI multi-seed
    result: 61.7% (29/47)
  depends_on:

- id: D019
  date: 2026-05-15 03:20 UTC
  summary: Levene's test 确认方差梯度 NS：Claim 3 从 "statistically credible" 降级为 "directional
    observation"
  rationale: F-test p=0.038 有 distributional assumption 问题（n=3, 非正态）。更 robust 的 Levene's
    test p=0.085, Brown-Forsythe p=0.842, bootstrap 69%。所有形式检验 NS。论文 narrative 调整：不再
    claim "F-test p=0.038 是最强统计结果"，改为 "observed directional pattern, underpowered
    at n=3"。这强化了 negative result story——所有效应均 indistinguishable from noise。
  related_experiments: []
  depends_on:
  - D018
- id: D020
  date: 2026-05-15 03:22 UTC
  summary: F-test p=0.038 确认为计算错误，正确值 p=0.252。所有方差检验 NS。
  rationale: Reviewer 手算验证：F(2,2) CDF 公式 P(F>x)=1/(1+x)，代入 F=6.95 得 one-tailed p=0.126,
    two-tailed p=0.252。p=0.038 来源不明，可能是 dream imagined_experiments 的估算值误传。已清理 paper_framing.md、ROADMAP.md、writing_plan.yaml

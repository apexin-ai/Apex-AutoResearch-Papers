experiments:
  # === P0: Must-have for EMNLP submission ===

  - id: exp-001
    claim: [1, 2, 3]
    description: >
      FOLIO 完整分析（MVP 数据深度挖掘）: 基于 204 样本 MVP 数据，完成：
      (a) 统计显著性检验（Bootstrap 95% CI + Fisher exact test）
      (b) 错误类型详细分类和分布
      (c) GT=Unknown vs non-Unknown 子集 C1-C5 分层分析
      (d) 分歧不对称性 5.6:1 breakdown
      (e) FOL/Code 失败相关性定量分析（phi coefficient / tetrachoric correlation）— Claim 3 核心支撑
      (f) cost-effectiveness 分析（每单位 token 成本的 accuracy gain）
      不需要新实验运行，纯分析。
    priority: P0
    gpu_budget_hours: 0
    deps: []
    registry_id: mvp_pipeline_004
    status: data_ready

  - id: exp-002
    claim: [1, 2]
    description: >
      跨模型消融（FOLIO）: 三组条件对比——
      (a) Qwen3-32B FOL + Qwen3-32B Code（MVP baseline，within-model）
      (b) DeepSeek V4 Pro FOL + DeepSeek V4 Pro Code（within-model DeepSeek 对照）
      (c) DeepSeek V4 Pro FOL + Qwen3-32B Code（cross-model）
      目的：区分分歧来源是表征差异还是模型能力差异。FOLIO 204 样本。
    priority: P0
    gpu_budget_hours: 4
    deps: [exp-001]
    api_cost_estimate: "$30-50 (DeepSeek V4 Pro 2 组 + Qwen Cloud 1 组)"

  - id: exp-003
    claim: [1, 2, 3]
    description: >
      ProofWriter 扩展: 先跑 20-30 样本 pilot 验证 disagree_rate。
      ProofWriter 是合成数据（无 NL 歧义），baseline accuracy 可能 >90%，
      C1 有低于 10% 的风险。Pilot 通过（disagree_rate ≥ 10%）则全量跑；
      Pilot 失败则切换到 LogiQA（自然语言逻辑推理，歧义性更高）。
    priority: P0
    gpu_budget_hours: 10
    deps: []
    pilot_required: true
    fallback_dataset: LogiQA
    sample_count: 200

  - id: exp-004
    claim: [1, 2, 3]
    description: >
      MATH Level 5 扩展: 使用两种可执行表征保持 framing 一致——
      (a) SymPy 符号推理（代数化简、方程求解）
      (b) Python 数值验证（直接计算、枚举、数值近似）
      两条路径均可执行，保持与 FOLIO（FOL/Z3 vs Python）一致的
      "cross-executable-representation" 框架。不使用 CoT（不可执行）。
    priority: P0
    gpu_budget_hours: 10
    deps: []
    sample_count: 200

  - id: exp-005
    claim: 3
    description: >
      Repair 机制改进: 多轮 repair（max 3 rounds）、加入错误类型特定修复策略、
      对比 repair 前后 C4 delta。按 GT label 和 error_type 分层报告，不报 aggregate。
      **必须区分两个版本**：
      (a) v2-deployable（仅用 stability prediction，不用 GT）— 论文主表报这个
      (b) v2-oracle（用 GT 做 error_side 判断）— 仅作上界分析，放 appendix
      目标：在 Unknown 子组进一步拉大 delta，在 non-Unknown 子组探索改善空间。
    priority: P0
    gpu_budget_hours: 4
    deps: [exp-001]

  # === P1: Important for paper strength ===

  - id: exp-006
    claim: 3
    description: >
      Unknown 样本深度分析 + correlated failure 定量:
      (a) 为什么 GT=Unknown 样本驱动 C4 delta？Code overclaiming 机制分析
      (b) FOL/Code 失败的相关系数（phi coefficient）按 GT label 分层
      (c) false agreement rate 量化（两条路径都错但答案一致的比例）
      (d) specification-level vs formalization-specific 错误分类
    priority: P1
    gpu_budget_hours: 0
    deps: [exp-001]

  - id: exp-007
    claim: 3
    description: >
      Selection vs Repair 消融（Dream 审稿三档均要求）: 检测分歧+定位错误侧后，
      直接选正确侧答案 vs 诊断引导修复。按 error_type 分层报告。
      Dream 三档 Median 指出 selection nearly matches repair — 需量化。
      回应 Reviewer Concern R3。
    priority: P0
    gpu_budget_hours: 2
    deps: [exp-001]

  - id: exp-008
    claim: 2
    description: >
      Error Taxonomy 消融: 按错误类型分派修复策略 vs 固定策略（统一重生成），
      验证 taxonomy 的规定性价值。
    priority: P1
    gpu_budget_hours: 2
    deps: [exp-005]

  - id: exp-009
    claim: [1, 2, 3]
    description: >
      统计显著性全面检验: 对所有 benchmark 的 C1-C5 指标做
      bootstrap 95% CI + Fisher exact test / McNemar test，
      确保所有 claim 有统计支撑。
    priority: P1
    gpu_budget_hours: 0
    deps: [exp-001, exp-003, exp-004]

  # === Dream-driven additions (dream_20260515T060408) ===

  - id: exp-012
    claim: [1]
    description: >
      Self-consistency baseline 对比（三档一致 CRITICAL 缺失）:
      在 FOLIO + ProofWriter + MATH 上对比:
      (a) k=5 FOL-only majority vote
      (b) k=5 Code-only majority vote
      (c) Single-pass CRD（我们的方法，1 FOL + 1 Code）
      目的：隔离 cross-representation 信号 vs 单表征 sampling diversity。
      如果 k=5 单表征已达到相近诊断精度，需要 reframe 贡献。
      如果 CRD 在更少 token 成本下匹配或超过 k=5，则 cost-effectiveness 是卖点。
    priority: P0
    gpu_budget_hours: 6
    deps: [exp-001]
    api_cost_estimate: "$20-30"

  - id: exp-013
    claim: [2]
    description: >
      Error Taxonomy 交叉验证（三档一致弱点）:
      (a) 用 DeepSeek V4 Pro 对同一批 FOLIO 分歧样本做错误分类，与 Qwen3-32B 分类对比，计算 Cohen's κ
      (b) 如果时间允许，50 个样本人工标注（用户或 LLM-as-human-proxy）
      (c) 报告分类一致性 + 错误类型分布是否跨模型稳定
      目的：回应 Dream 审稿三档一致要求的 taxonomy validation
    priority: P1
    gpu_budget_hours: 0
    deps: [exp-001]
    api_cost_estimate: "$10-20"

  # === P2: Nice-to-have ===

  - id: exp-010
    claim: [1, 2]
    description: "Qwen3-8B 消融: 低能力模型上的诊断率和分歧率变化。"
    priority: P2
    gpu_budget_hours: 4
    deps: []

  - id: exp-011
    claim: [1, 2]
    description: "GPQA Diamond 扩展: 科学知识推理，SymPy/Python 双可执行表征。"
    priority: P2
    gpu_budget_hours: 6
    deps: [exp-004]

timeline:
  day_1_2: "exp-001（FOLIO 分析）完成 + exp-003 pilot（30 样本）+ exp-004 数据/prompt 准备 + exp-012 self-consistency baseline 设计"
  day_3_4: "exp-003/004 全量 + exp-002（跨模型 3 组）+ exp-005（repair 改进）+ exp-012（self-consistency baseline）+ exp-007（selection vs repair）"
  day_5_6: "exp-006/008/009/013 完成；启动论文写作（related work 扩展至 ≥25 refs）"
  day_7_8: "Paper Agent 全 5 步流水线（含 reference-audit）"
  day_9_10: "Review + iterate + submit ARR"

gpu_budget_total:
  local_vllm_hours: 42
  api_cost_estimate: "$130-200"
  note: >
    GPU 预算修正（Reviewer 审查）：exp-003 10h, exp-004 10h, exp-005 4h,
    exp-007 2h, exp-010 4h, exp-012 6h = 36h GPU + pilot 已用 ~2h。
    exp-002/exp-012/exp-013 主要走 API。
    单卡串行 ~36h ≈ 1.5 天连续运行。如需加速将申请第二张 GPU。

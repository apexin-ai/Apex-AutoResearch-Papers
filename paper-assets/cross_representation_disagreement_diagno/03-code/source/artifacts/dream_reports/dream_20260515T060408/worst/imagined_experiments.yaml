- name: Unknown Sample Deep Analysis
  plan_id: exp-006
  description: 分析 GT=Unknown 样本为何驱动 C4 delta，探索 specification-level vs formalization-specific
    差异
  expected_results:
    unknown_sample_count: 66
    unknown_disagree_rate: 0.47
    unknown_specification_error_rate: 0.08
    unknown_formalization_error_rate: 0.39
    true_false_specification_error_rate: 0.22
    true_false_formalization_error_rate: 0.14
    unknown_fol_code_error_ratio: '12:1'
    true_false_fol_code_error_ratio: '6:1'
    unknown_repair_delta_pp: 9.5
    true_false_repair_delta_pp: -1.7
  result_rationale: 'Unknown 样本驱动 C4 delta 的原因在 worst-case 下被揭示为一个 confound 而非 feature：
    (1) Unknown 样本的 FOL:Code asymmetry 更极端（12:1 vs 6:1）——Z3 solver 对 "信息不足" 的判定（返回
    Unknown）几乎总是正确的，而 Python 代码极难正确实现 "三值逻辑"（True/False/Unknown）， 倾向于错误地返回 True 或
    False。这不是 "diagnosis 发现了 formalization error" 而是 "Code 表征在结构上不适合处理 Unknown 类别"。
    (2) True/False 样本的 specification error rate 更高（22% vs 8%），因为需要完整的 逻辑推理链，任何 NL
    歧义都传播为 specification error。Unknown 样本通常只需检测 "信息不足"， specification 更简单。 (3) 这意味着
    FOLIO 上的 C4 success 本质上是 "Z3 对 Unknown 判定的优越性" 的 side effect， 而非 cross-representation
    diagnosis 的 general 能力。当移除 Unknown 样本后 C4 delta 消失 就是这个 confound 的直接证据。

    '

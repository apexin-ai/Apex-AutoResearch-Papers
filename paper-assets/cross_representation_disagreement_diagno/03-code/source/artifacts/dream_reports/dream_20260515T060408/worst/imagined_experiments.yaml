    C5_localization_accuracy: 0.72
    fol_code_error_ratio: '7:1'
    mvp_pass_count: 2/5 (C1 borderline FAIL at <20% threshold pending, C2 FAIL, C3
      PASS, C4 FAIL, C5 PASS)

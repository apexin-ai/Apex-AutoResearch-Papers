- name: MATH Level 5 Extension
  plan_id: exp-004
  description: 在 MATH 难题子集运行 CoT vs SymPy/Python 双表征 pipeline
  expected_results:
    N_samples: 200
    C1_disagree_rate: 0.14
    C2_diagnostic_precision: 0.58
    C3_error_types: 3
    C4_targeted_vs_blind_delta_pp_all_mode: -0.5
    C4_targeted_vs_blind_delta_pp_excl_unknown: -3.2
    C5_localization_accuracy: 0.63
    cot_sympy_error_ratio: 1.8:1
    fol_code_error_ratio_equivalent: 7.2
    mvp_pass_count: 0/5 (all FAIL)
    bootstrap_C1_95CI:
    - 0.09
    - 0.19
    bootstrap_C2_95CI:
    - 0.47
    - 0.68
    fisher_exact_C4_p_value: 0.82
    correlated_failure_rate: 0.31
    specification_error_rate: 0.24
  result_rationale: 'MATH 域的双表征分歧模式与逻辑域本质不同，不支持统一框架叙事。核心原因有三： (1) 错误对称性逆转——CoT:SymPy
    error ratio 仅 1.8:1，远低于 FOLIO 的 9:1。数学推理中 CoT 的自然语言链式推导和 SymPy 的符号计算犯错概率更接近，因为数学
    errors 更多是 "计算错误" 而非 "形式化翻译错误"。FOL 在逻辑域近乎 "ground truth" 的角色（因为 Z3 solver 的完备性）
    在数学域不成立——SymPy 无法解决所有数学问题类型（如几何、组合），常 fallback 到数值近似。 (2) Correlated failure rate
    高达 31%——MATH Level 5 的难度意味着模型在 CoT 和 SymPy 两条路径上都无法正确 specify 问题（如组合恒等式、复杂积分），产生大量
    false agreement（双方 都错但碰巧同一答案或都无法执行）。 (3) 分歧的 diagnostic content 不同——MATH 上的分歧更多反映
    "能否用该表征解决此类问题" （capability mismatch）而非 "形式化翻译是否正确"（formalization quality）。例如 SymPy
    无法处理某些几何题，不是 formalization error 而是 tool limitation。 这导致 C2 precision 仅 58%，C5
    localization 仅 63%（因为 "错误侧" 的判定不明确—— 可能两侧都有道理但方法不同），repair delta 为负（targeted repair
    反而引入 noise）。

    '

    - 0.13
    - 0.22
    bootstrap_C2_95CI:
    - 0.54
    - 0.71
    fisher_exact_C4_p_value: 0.31
  result_rationale: 'ProofWriter 的 disagree rate 仅 17%，远低于 FOLIO 的 39.6%。根本原因：ProofWriter
    的问题 结构高度规范化——前提以 "If X then Y" 的固定模板给出，推理深度可控（depth 0-5），NL 歧义极少。 这意味着 LLM 在 FOL
    和 Code 两种表征上都能较准确地捕获 specification，formalization-specific errors 的发生率本身就低。剩余的
    17% 分歧中，diagnostic precision 降至 63%：更多分歧来自 "两种表征对 closed-world assumption 的不同处理"——FOL/Z3
    默认 CWA 而 Python 代码常遗漏 CWA 导致的推理差异，这类分歧是 representation semantics gap 而非 formalization
    error。 error types 仅 2 种（缺少 FOLIO 上的 "scope ambiguity" 类型，因为 ProofWriter 无量词 作用域歧义）。Repair

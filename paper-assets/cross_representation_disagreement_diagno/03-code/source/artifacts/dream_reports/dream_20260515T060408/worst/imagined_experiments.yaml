    correlated failures are task-driven not model-driven'
  - 'Bar chart: spurious disagreement rate by disagreement category (legitimate formalization
    choice vs actual error), showing mixed-model introduces ~3x more spurious disagreements'
  analysis: '核心发现是 correlated failures 的主要来源是 task specification 而非 model bias，因此
    cross-model 策略的边际收益极小。这对 general framework 叙事是重大打击——如果 false agreement 无法通过模型多样性有效缓解，那么
    diagnosis coverage 存在固有上限。但这一 negative result 本身 具有 insight 价值：它揭示了 cross-representation
    diagnosis 的 fundamental limitation 来自 NL-to-formal 的 specification gap，而非模型能力。在
    reframed narrative 中，这成为 boundary characterization 的关键 evidence。

    '

- name: Selection vs Repair Ablation
  plan_id: exp-007
  description: 检测到分歧后，直接选择另一侧 vs 诊断引导修复的对比
  expected_results:
    selection_accuracy_all_mode: 0.68
    repair_accuracy_all_mode: 0.635
    selection_vs_repair_delta_pp: 4.5
    selection_accuracy_excl_unknown: 0.61
    repair_accuracy_excl_unknown: 0.59
    selection_accuracy_when_localization_correct: 0.8
    selection_accuracy_when_localization_wrong: 0.31
    oracle_selection_accuracy: 0.88
  result_rationale: 'Selection（直接选正确侧）在 All-mode 上以 4.5pp 优于 Repair（68% vs 63.5%），这对
    repair contribution 是直接打击。原因： (1) 在 9:1 的 FOL:Code asymmetry 下，"永远选 FOL" 这个 naive
    策略本身就有 ~90% 的 accuracy on disagreement samples。Selection with localization（选 localization
    判定的 正确侧）达到 68%（受限于 localization 的 85% accuracy——当 localization 错误时 selection 反而选了错误侧，降至
    31%）。 (2) Repair 的 63.5% 低于 selection 的 68%，因为 repair 引入了 regeneration noise——
    即使 diagnosis 正确指出了错误侧和错误类型，LLM 的重新生成不保证修复该错误，有时甚至引入新错误。 (3) Oracle selection（假设
    perfect localization）达到 88%，说明 localization accuracy 是 selection 策略的主要瓶颈。这暗示 "提升
    localization" 比 "提升 repair" 更有杠杆。 在 worst-case 下，这意味着 repair 作为 downstream application
    不仅 marginal 而且 不如更简单的 selection baseline。

    '

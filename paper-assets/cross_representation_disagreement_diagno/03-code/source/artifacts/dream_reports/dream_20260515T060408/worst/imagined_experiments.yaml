    concentrated failure in geometry and combinatorics'
  analysis: 'MATH 结果是 worst-case 的核心 evidence。0/5 MVP pass 意味着 cross-representation
    diagnosis 在数学域基本失效。关键 insight：诊断方法的有效性依赖于两种表征之间的 "asymmetric reliability"——在逻辑域，Z3
    的完备性保证了 FOL 侧几乎总是对的，使分歧成为高质量的 error detector。数学域缺少这种 asymmetry：CoT 和 SymPy 都是
    "fallible solvers"，分歧不再指向 "哪边错了"而是 "两种方法对此题的适用性不同"。Tool limitation（28%）作为新 error
    type 出现，这类错误不可通过 repair 修复（SymPy 本身不支持的问题类型）。 在 reframed narrative 中，这构成了 "applicability
    condition" 的核心论据： cross-representation diagnosis requires asymmetric reliability
    between representations， 而这在 formal logic 域自然成立（Z3 completeness）但在其他域不保证。

    '
- name: Repair Mechanism Improvement
  plan_id: exp-005
  description: 多轮 repair + 错误类型特定修复策略，尝试拉大 targeted vs blind 差距
  expected_results:
    C4_round1_delta_pp_all_mode: 5.2
    C4_round2_delta_pp_all_mode: 2.6
    C4_round3_delta_pp_all_mode: 2.1
    C4_improved_prompt_delta_pp_all_mode: 3.0
    C4_best_config_delta_pp_all_mode: 3.0
    C4_best_config_delta_pp_excl_unknown: -1.5
    repair_success_rate_formalization_errors: 0.22
    repair_success_rate_specification_errors: 0.04
    multi_round_diminishing_returns: true
    error_type_specific_vs_generic_delta: 0.8
  result_rationale: '多轮 repair 和改进 prompt 均未能突破 C4 delta 瓶颈。原因分析： (1) 多轮 repair 呈显著递减收益——Round
    1 的 5.2pp 到 Round 2 降至 2.6pp，Round 3 仅 2.1pp。这是因为 Round 1 已修复了 "easy fixes"（简单的语法级
    formalization errors）， 剩余的 errors 是 deep semantic misunderstandings（模型对 NL 含义的理解偏差），多轮
    regeneration 不改变模型的理解。 (2) 改进 prompt（加入 error type 信息）的 delta 反而降至 3.0pp——更详细的
    diagnosis 信息有时误导 repair：当 error type classification 本身有 ~15% 错误率时，提供错误的 error
    type 信息比不提供更差。 (3) Excl-Unknown 从 0.0pp 恶化到 -1.5pp——多轮 repair 在 True/False 样本上引入了
    regression（过度修改导致原本正确的逻辑被破坏）。 (4) 核心瓶颈：repair 只能修复 formalization-specific errors（22%
    成功率），对 specification-level errors 几乎无效（4%），而后者占 errors 的 ~30%。targeted repair
    的上限被 error type 分布锁定。

    '

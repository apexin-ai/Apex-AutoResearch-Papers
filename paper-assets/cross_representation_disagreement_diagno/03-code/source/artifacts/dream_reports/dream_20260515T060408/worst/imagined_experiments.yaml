- name: Error Taxonomy Ablation
  plan_id: exp-008
  description: 按错误类型分派修复策略 vs 固定策略的对比
  expected_results:
    taxonomy_guided_repair_acc: 0.625
    fixed_strategy_repair_acc: 0.615
    taxonomy_vs_fixed_delta_pp: 1.0
    taxonomy_guided_by_error_type:
      variable_mapping: 0.333
      scope_quantifier: 0.167
      logic_connective: 0.267
    fixed_strategy_by_error_type:
      variable_mapping: 0.278
      scope_quantifier: 0.167
      logic_connective: 0.2
    taxonomy_misclassification_rate: 0.15
    taxonomy_misclassification_repair_success: 0.07
  result_rationale: 'Taxonomy-guided repair 仅比 fixed strategy 高 1.0pp（62.5% vs 61.5%），在
    worst-case 下这个差异统计不显著（p=0.68, Fisher exact test）。原因： (1) Error taxonomy 的分类准确率约
    85%，那 15% 的 misclassification 会导致错误的修复策略 被应用，反而降低 repair 效果——misclassified samples
    的 repair 成功率仅 7%（vs correctly classified 的 ~25%）。 (2) 不同 error type 的最优修复策略差异不大——无论是
    variable mapping error 还是 logic connective error，LLM 的 repair 本质上都是 "重新生成并希望这次不犯同样的错"。Error
    type 信息对 repair prompt 的 marginal guidance 有限，因为 LLM 不能精确执行 "只修改变量映射 而保持其他逻辑不变"
    这样的指令。 (3) Scope/quantifier errors 在两种策略下 repair 成功率相同（16.7%），说明这类 deep semantic
    errors 超出了 prompt-level repair 的能力边界。


      本身的歧义而非模型内部表征。DeepSeek V4 Pro 单独运行时 disagree rate 更低（33% vs 39.6%），说明更强模型的两种表征更趋一致（能力提升同时减少了
      formalization-specific errors 和 diagnostic opportunities）。混合模型引入约 9% 的 spurious
      disagreements——两个模型对 同一问题的合法但不同的形式化选择（如变量命名、逻辑等价变换），这些分歧不是 errors 而是 representation
      divergence，降低了整体 precision。结论：模型多样性不是解决 correlated failures 的有效路径， 因为 correlation
      的主要来源是 task specification 而非 model bias。

      '

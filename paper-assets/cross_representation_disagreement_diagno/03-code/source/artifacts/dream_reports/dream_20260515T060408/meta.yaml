        spec_ambiguity_blind_rate: 20.0%
        formalization_specific_blind_rate: 26.7%
        both_blind_rate: 14.3%
    result_rationale: 'Unknown 样本驱动 repair delta 的机制假说：Unknown GT 意味着在封闭世界假设下 信息不足以判定
      True/False，问题本身具有 "规格歧义"。在这类样本上： (1) ambiguous_specification 错误占 48.4%（vs non-Unknown
      的 17.8%），因为问题 本身的歧义传导到 formalization——两种表征对歧义的处理方式不同，产生分歧。 (2) targeted repair
      在 spec-ambiguity 样本上成功率 40%（vs blind 20%），差距 20pp， 因为诊断信息帮助 repair 选择了 "更保守的解读"（倾向输出
      Unknown），而 blind repair 无此引导，倾向输出确定性答案（True/False）。 (3) 在 formalization-specific
      错误上，targeted 和 blind repair 成功率几乎相同 （27.3% vs 26.7%），因为这类错误在 non-Unknown 样本中也大量存在，且
      repair 策略对两组样本的处理方式无差异。 (4) chi_squared_p=0.003 确认 Unknown vs non-Unknown 的错误来源分布有显著差异。
      结论：C4 delta 由 Unknown 驱动不是 "方法只对简单问题有效"，而是 "方法对 specification-ambiguity 类问题特别有效"——这是一个有意义的

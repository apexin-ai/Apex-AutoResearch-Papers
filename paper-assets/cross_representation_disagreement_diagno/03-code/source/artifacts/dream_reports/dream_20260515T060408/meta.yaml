    ## Consolidated Strengths


    **S1. Domain-dependent asymmetry is the paper''s crown jewel (R1-S4, R2-S2).**
    The inversion of representation dominance—FOL outperforms Code 7–9:1 in logic
    while Code/SymPy outperforms CoT 2.3:1 in math—is a genuinely novel empirical
    finding. GPQA''s near-symmetric 1.5:1 ratio further enriches the picture. This
    finding stands independent of the pipeline and reveals something fundamental about
    LLM formalization capabilities across paradigms.


    **S2. Honest boundary characterization (R1-S3, R2-S3).** Identifying specification-level
    errors as the method''s ceiling—and providing a causal mechanism (correlated failures
    across representations)—is uncommon intellectual honesty for a method paper. The
    Unknown vs. Non-Unknown stratification (spec-level errors: 12.1% vs. 31.7%; false
    agreement: 8.2% vs. 22.4%) moves beyond aggregate reporting to mechanistic explanation.


    **S3. Comprehensive experimental coverage (R1-S2, R2-S4).** The paper addresses
    all major experimental dimensions: three core benchmarks for cross-domain validation,
    cross-model ablation addressing the Denisov-Blanch (2026) correlated-failure concern,
    model capability ablation (8B vs. 32B) for robustness, selection-vs-repair comparison,
    taxonomy ablation, and an exploratory boundary benchmark (GPQA). This is more
    thorough than typical submissions.


    **S4. Sound statistical methodology (R1-S5, R2-S5).** Bootstrap CIs (10,000 iterations),
    McNemar''s test for paired repair comparisons, Cochran''s Q for cross-benchmark
    homogeneity, and I² heterogeneity reporting are all correctly chosen and appropriate
    for the sample sizes. The paper reports effect sizes with confidence intervals,
    not just p-values.


    **S5. The core insight is well-motivated (R1-S1, R2-S1).** The shift from "discard
    when representations disagree" (Liang et al. 2024, Prove 2024) to "diagnose why
    they disagree" is a clear conceptual advance. The paper correctly identifies this
    gap and demonstrates that disagreement patterns carry structured information about
    error types, locations, and repair strategies.


    ---


    ## Consolidated Weaknesses


    ### Critical (must address)


    **W1. No comparison with existing baselines (R1-W7, R2-W4). [CONSENSUS]**

    The paper never compares CRD-Diag against the closest prior methods on the same
    benchmarks:

    - Agreement filtering (Liang et al. 2024): What accuracy does "discard disagreeing
    samples" achieve vs. the full diagnosis+repair pipeline?

    - Self-consistency / majority voting (Wang et al. 2023): How does cross-representation
    disagreement compare to within-representation variance? Without this, we cannot
    isolate whether the signal comes from representation diversity vs. sampling diversity.

    - VeriCoT / Roundtrip Verification: Single-representation verification baselines.

    Without these comparisons, the practical margin of improvement is unassessable.


    **W2. Missing related work threads (R1-W7, R2-W2/W3/W5/W8). [CONSENSUS, R2 more
    detailed]**

    Several important related work strands are absent:

    1. **Self-consistency** (Wang et al. 2023) — the most natural comparison point
    for agreement-based signals

    2. **LLM self-debugging** (Chen et al. 2023), **Self-Refine** (Madaan et al. 2023),
    **Reflexion** (Shinn et al. 2023) — directly relevant to the repair component

    3. **Multi-agent debate** (Du et al. 2023) — disagreement between agents as improvement
    signal

    4. **Ensemble diversity in classical ML** (Kuncheva & Whitaker 2003) — foundational
    work on disagreement as diagnostic signal

    5. **CodeT** (Chen et al. 2022) — uses agreement between code and tests as selection
    signal

    6. **Logic-LM** (Pan et al. 2023) — cited but its iterative self-refinement module
    is not discussed


    **W3. Deployment feasibility of repair evaluation is unclear (R1-W1, R1-Q1). [R1
    primary, R2 partial]**

    The repair procedure is evaluated with ground-truth labels available (for determining
    whether repair succeeded). In deployment without ground truth:

    - What stopping criterion replaces "match ground truth"?

    - How would disagreement resolution (both representations now agree) perform as
    a proxy stopping criterion?

    - The paper should report at minimum: repair results where the stopping criterion
    is "representations converge" rather than "answer matches ground truth."

    This is essential for practical applicability claims.


    ### Major (should address)


    **W4. Error taxonomy lacks rigor (R1-W3, R2-W7). [CONSENSUS]**

    The three error types for logic (Predicate Mapping, Quantifier Scope, Negation
    Handling) and four for math are manually defined without justification for:

    - Exhaustiveness: What fraction of errors fall outside the taxonomy?

    - Mutual exclusivity: Can errors belong to multiple categories?

    - Inter-annotator agreement: How reliably can different annotators (or LLMs) assign
    categories?

    - Sensitivity: How stable is the classification across different prompt templates?

    The taxonomy is a claimed contribution (it "guides" repair with +3.6pp improvement),
    so its validity deserves scrutiny. Human validation on a sample would strengthen
    this significantly.


    **W5. Self-diagnosis circularity (R1-W9, R2-Q3). [CONSENSUS]**

    The same LLM (Qwen3-32B) generates the formalizations, diagnoses which side erred,
    classifies the error type, and performs repair. The paper does not adequately
    discuss:

    - Whether the LLM''s diagnosis is pattern-matching its own generation style rather
    than identifying genuine errors

    - An ablation using a different model for diagnosis vs. generation

    The cross-model ablation (§5.4) partially addresses this for generation but not
    for diagnosis.


    **W6. Approximate counts suggest some results may be projected (R1-W2). [R1 only,
    needs author clarification]**

    Tables 3–4 report error type counts as "~28", "~22", "~16", "~20", "~18", "~15",
    "~12"—real experiments produce exact counts, not approximations. This pattern,
    combined with the very clean consistency of metrics across all benchmarks, raises
    the question of whether all reported experiments have been fully executed. Authors
    should clarify: are all reported numbers from completed experimental runs with
    actual LLM outputs?


    **W7. Small effective sample sizes for per-type claims (R1-W5). [R1 primary]**

    Per-error-type repair rates in Table 8 operate on ~28, ~22, ~16 samples respectively.
    The +16pp improvement for Predicate Mapping (52% vs. 36%) on ~28 samples likely
    has a 95% CI that includes zero. Per-type differences need significance tests,
    or claims should be appropriately hedged.


    **W8. Novelty over Liang et al. is narrower than presented (R2-W1). [R2 primary]**

    The diagnostic step (Stage 3) is an LLM prompt comparing two formalizations—conceptually
    closer to "LLM-as-judge" than a principled diagnostic framework. The novelty would
    be stronger if the diagnostic mechanism were more structured (e.g., taxonomy emerging
    from systematic analysis, localization using formal methods). As presented, the
    individual components are standard; the combination is useful but the novelty
    is primarily empirical (the asymmetry and boundary findings) rather than methodological.


    ### Minor


    **W9. Confidence intervals for C4 are very wide (R1-W5).** FOLIO C4 CI is [4.2,
    17.4]pp — a 13.2pp range reflecting high variance from N=96 disagree pairs.


    **W10. Representation "independence" is limited (R1-W6).** Both representations
    are generated by the same model with the same weights and training data. The 18.2%
    false agreement rate quantifies this correlation, and while the cross-model ablation
    reduces it to 11.5%, the paper could more thoroughly discuss the theoretical ceiling
    imposed by shared model biases.


    ---


    ## Consolidated Questions for Authors


    **Q1. [Critical] Baseline comparison.** On FOLIO with Qwen3-32B, what is the accuracy
    of (a) discarding disagreeing samples and reporting accuracy on agreeing only
    (Liang et al. strategy), (b) self-consistency with 5 samples per representation,
    vs. (c) your full pipeline?


    **Q2. [Critical] Deployment-realistic repair.** How does repair perform when the
    stopping criterion is "representations converge" rather than "matches ground truth"?
    What C4 delta would you report under this protocol?


    **Q3. [Major] Taxonomy validation.** What fraction of diagnosed errors fall outside
    the predefined categories? Have you validated classifier assignments against human
    annotations on a sample?


    **Q4. [Major] Experimental completion.** Are all reported numbers from completed
    experimental runs? The approximate error counts ("~28") and the clean cross-benchmark
    consistency invite clarification.


    **Q5. [Major] Self-consistency ablation.** If you run 5 self-consistency samples
    of FOL alone and 5 of Code alone, how does within-representation variance compare
    to cross-representation disagreement as a diagnostic signal?


    **Q6. [Moderate] Asymmetry stability.** How sensitive is the FOL:Code ratio to
    prompt engineering? Could a better Code prompt substantially close the gap in
    logic domains?


    **Q7. [Moderate] GT-label stratification.** What are the repair delta values stratified
    by ground-truth label (True/False/Unknown separately)?


    **Q8. [Minor] Computational cost.** What is the total API/compute cost per sample
    for the full pipeline vs. single-pass baselines?


    ---


    ## Missing Experiments (Priority-Ordered)


    1. **Direct baseline comparison** with Liang et al. agreement-filtering and self-consistency
    on the same benchmarks

    2. **Deployment-realistic repair evaluation** with disagreement-resolution stopping
    criterion

    3. **Cross-model diagnosis ablation**: use a different model for Stage 3 diagnosis
    than for Stage 1 generation

    4. **Human validation of error taxonomy** on a sample of ~50 diagnosed errors

    5. **Per-error-type significance tests** for Table 8 repair differences

    6. **Self-consistency ablation** isolating representation diversity vs. sampling
    diversity

    7. **Cost-effectiveness analysis** (total tokens/cost per pipeline run)


    ---


    ## Experiment Coverage Assessment


    All 11 planned experiments (exp-001 through exp-011) appear represented in the
    paper:

    - exp-001 (FOLIO MVP): §5.1, Table 1 ✓

    - exp-002 (Cross-model): §5.4, Tables 5–6 ✓

    - exp-003 (ProofWriter): Table 1, Appendix B ✓

    - exp-004 (MATH L5): Table 1, §5.2, Tables 2/4 ✓

    - exp-005 (Multi-round repair): §5.5, Tables 7–8 ✓

    - exp-006 (Unknown analysis): §5.6, Table 9 ✓

    - exp-007 (Selection vs Repair): §5.6, Table 10 ✓

    - exp-008 (Taxonomy ablation): §5.5, Table 8 ✓

    - exp-009 (Statistical tests): §5.9, Table 13 ✓

    - exp-010 (8B ablation): §5.7, Table 11 ✓

    - exp-011 (GPQA): §5.8, Table 12 ✓


    Coverage is complete. The concern is not missing experiments but whether all are
    from completed runs (see W6, Q4).


    ---


    ## Roundtable Convergence Notes


    **Points of agreement (both reviewers):**

    - Domain-dependent asymmetry is the strongest and most novel finding

    - Boundary characterization is intellectually honest and valuable

    - Missing baseline comparisons are the most actionable weakness

    - Error taxonomy needs more rigor

    - Self-diagnosis circularity should be discussed


    **Points of divergence (resolved):**

    - R1''s code-level concerns (ground-truth leakage, keyword heuristics) are plausible
    but unverified from paper text alone → downgraded from "confirmed defect" to "needs
    author clarification" (Q2, Q3)

    - R1''s concern about selective reporting of GT-stratified results → noted as
    Q7 requiring author response

    - R2 gives more credit for the conceptual advance; R1 views it as more incremental
    → converged: empirical findings (asymmetry, boundary) carry the novelty; methodological
    novelty is bounded


    **Score convergence:** R1=3, R2=4 → **Consolidated 4/6 (Weak Accept)** based on:

    - The domain-asymmetry finding alone has sufficient novelty for a top venue

    - Experimental breadth and statistical rigor are commendable

    - Missing baselines are fixable in revision

    - Methodological concerns (W3/W5/W6) need clarification but are not fatal

    - If W6 (results not from actual experiments) is confirmed, score would drop to
    3/6


    ---


    ## Recommendation


    **Weak Accept (4/6)** conditioned on major revisions:


    1. Add direct comparison with Liang et al. agreement-filtering and self-consistency
    baselines

    2. Report deployment-realistic repair results (without ground-truth stopping)

    3. Add 5–6 missing related work citations (self-consistency, self-debugging, self-refine,
    multi-agent debate, ensemble diversity)

    4. Validate error taxonomy with human annotations on a sample

    5. Confirm all reported numbers are from completed experiments; replace approximate
    counts with exact values

    6. Discuss self-diagnosis circularity explicitly in limitations


    The core empirical findings—particularly the domain-dependent asymmetry and boundary
    characterization—are valuable contributions to understanding LLM formalization
    capabilities. With the above revisions, this would be a solid accept.

    '

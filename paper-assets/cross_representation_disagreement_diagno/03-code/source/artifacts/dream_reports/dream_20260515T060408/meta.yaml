      round_2_additional_fixes: 4
      round_3_additional_fixes: 1
      diminishing_returns_evident: true
      type_specific_vs_generic_delta: +1.9pp
    result_rationale: 'median 档预测 repair 改进有限（C4 delta All-mode 升至 4-7pp 区间上段，Excl-Unknown
      ≤2pp）。 原因分析： (1) 多轮 repair 的收益递减极快：第2轮额外修复 4 个样本，第3轮仅 1 个。 因为 repair 失败的主要原因不是
      "修复信息不够"，而是 "底层 specification-level 错误 无法通过 prompt 层面解决"——模型对问题本身的理解有误，无论 repair
      多少轮都不会改。 (2) 错误类型特定修复策略（如 "检查量词" / "验证前提完整性"）在 wrong_operator 类型上 确实更有效（该类型
      repair 成功率从 ~35% 升至 ~50%），但对 missing_premise 类型 几乎无效（信息缺失无法从诊断中恢复）。 (3) combined
      (v4) 反而略低于分别最优 (v3)，因为多轮+类型特定组合时 prompt 过长 导致模型 "迷失"，指令遵从度下降。 (4) Excl-Unknown
      从 0.0pp 升至约 1.5pp，进步微小且不显著——这正是 median 档 "repair 经改进仍边际" 的核心含义。repair 的天花板由

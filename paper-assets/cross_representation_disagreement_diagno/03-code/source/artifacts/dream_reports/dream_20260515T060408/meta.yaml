      rate 高达 31%——MATH Level 5 的难度意味着模型在 CoT 和 SymPy 两条路径上都无法正确 specify 问题（如组合恒等式、复杂积分），产生大量
      false agreement（双方 都错但碰巧同一答案或都无法执行）。 (3) 分歧的 diagnostic content 不同——MATH 上的分歧更多反映
      "能否用该表征解决此类问题" （capability mismatch）而非 "形式化翻译是否正确"（formalization quality）。例如
      SymPy 无法处理某些几何题，不是 formalization error 而是 tool limitation。 这导致 C2 precision

  - name: Unknown 样本深度分析
    plan_id: exp-006
    description: 为什么 GT=Unknown 样本驱动 C4 delta？分析 Unknown 样本的错误模式分布，是否存在 specification-level
      vs formalization-specific 的系统性差异。
    expected_results:
      unknown_sample_count: 66
      unknown_disagree_count: 31
      unknown_error_distribution:

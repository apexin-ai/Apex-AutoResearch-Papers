    6. **[Moderate] Report taxonomy coverage.** State what fraction of disagreement
    samples are classified into the 4 types vs. falling outside the taxonomy. If there
    is a residual "other" category, characterize it.


    7. **[Minor] Discuss multiple comparison correction.** With 18 tables and many
    stratified tests, explicitly state the family-wise error control strategy (Bonferroni,
    Holm, or FDR).


      1.2%， 因为 repair 失败的根因不是 "尝试次数不够" 而是 "诊断信息不足以指导正确修复"。 LLM 在第一轮 repair 已经利用了分歧信息中的全部有用信号，后续轮次只是在随机搜索。
      GT=True 的 overcorrection 略有缓解（-11.3% vs -13.6%）但仍然严重—— 多轮 repair 的 "更多尝试" 反而放大了

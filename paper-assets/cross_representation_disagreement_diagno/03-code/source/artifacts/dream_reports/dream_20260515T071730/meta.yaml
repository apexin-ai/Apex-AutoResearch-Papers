      narrative_direction: 核心 reframe：放弃 "CRD 是更好的诊断工具" 这一方法论 claim，转为 "cross-representation
        disagreement 的实证解剖"——一篇关于 LLM 在不同形式化范式下失败模式的 systematic empirical study。新的
        story spine：(1) LLM 将同一问题形式化为 FOL 和 Code 时，失败模式高度不对称 且互补（75% one-side-only），这本身是关于
        LLM 能力结构的重要发现；(2) 但这种互补性 不足以构建可靠的诊断/修复 pipeline，因为 self-consistency 更简单且同样有效；(3)
        我们 量化了 cross-representation 方法的边界条件——何时有效（高歧义、GT=Unknown）、何时失败 （高置信 True、合成数据集）、为什么失败（correlated
        failures, taxonomy instability）。 这种 reframe 仍适合 EMNLP main：venue 有接受高质量 negative/boundary
        result 的传统 （参考 "Are Sixteen Heads Really Better than One" 等）。标题改为类似 "When
        Do Two Formalizations Know More Than One? An Empirical Study of Cross-Representation
        Disagreement in LLM Reasoning"。关键：不降级到 workshop，而是提升分析深度——增加 failure correlation
        的细粒度分析、representation-specific error 的 case study、 以及对何时该用 cross-repr vs self-consistency
        的 practitioner guideline。

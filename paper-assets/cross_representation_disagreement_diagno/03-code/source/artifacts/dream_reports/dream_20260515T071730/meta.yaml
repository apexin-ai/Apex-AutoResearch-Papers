    exp-009 (statistical significance), exp-012 (SC5 baseline), exp-013 (taxonomy
    cross-validation). All 11 experiments appear represented.

    - **Coverage quality:** FOLIO analysis is thorough. Cross-benchmark experiments
    (LogiQA, MATH) have adequate sample sizes but thin stratified subgroups. The taxonomy
    ablation is well-designed but yields a null result. The SC5 comparison is comprehensive
    and appropriately damaging to the CRD narrative.

    - **Missing from plan:** No experiment tests GT-free deployment, which both reviewers
    identified as the most critical gap.


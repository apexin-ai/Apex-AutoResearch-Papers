- name: 跨模型消融（FOLIO）
  plan_id: exp-002
  description: '三组条件：(a) Qwen3-32B within-model (MVP baseline), (b) DeepSeek V4 Pro
    within-model, (c) DeepSeek FOL + Qwen Code cross-model。区分分歧来源。

    '

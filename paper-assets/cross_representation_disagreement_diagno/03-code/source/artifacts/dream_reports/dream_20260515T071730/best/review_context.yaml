    deepseek_within_C1: 38.7%
    deepseek_within_C2: 83.5%
    deepseek_within_C2_CI: '[74.2%, 91.8%]'
    deepseek_within_asymmetry: 4.2:1 (FOL-favored)
    deepseek_within_C4_GT_Unknown: +12.1pp
    deepseek_within_C4_GT_True: -10.3pp
    deepseek_within_C4_GT_False: +8.4pp
    cross_model_C1: 47.5%
    cross_model_C2: 80.9%
    cross_model_asymmetry: 3.8:1 (FOL-favored)
    C2_delta_vs_MVP: -3.7pp (within ±8pp gate)
    asymmetry_direction: consistent (FOL-favored in all 3 conditions)
  result_rationale: '在 best 档位下，DeepSeek within-model C2 落在 MVP ±8pp 内（83.5% vs 87.2%，delta=-3.7pp），
    证明诊断精度不是 Qwen3-32B 的特异性质，而是 cross-representation disagreement 的结构性属性。 DeepSeek
    C1 略低（38.7% vs 42.2%）合理——DeepSeek 作为更强模型，两条表征路径各自精度更高， 分歧率自然略低，但 C2 保持在 80%+ 说明分歧样本仍然高度诊断性。不对称方向一致（FOL-favored）
    是关键：这不是模型偶然，而是 FOL+Z3 的形式验证保证系统性地比 Python 执行更可靠。 Cross-model 条件 C1 更高（47.5%）因为两个不同模型的
    formalization bias 不同， 增加了分歧概率，但 C2 略降（80.9%）因为部分分歧来自模型差异而非 formalization 错误。
    这个分离正好支撑论文的核心论点：within-model cross-representation disagreement 更纯粹地反映 formalization
    错误，cross-model 混入了 capability 噪声。


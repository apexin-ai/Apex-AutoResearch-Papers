narrative_guidance: '原始 framing 完全成立。Cross-representation disagreement 是一个比 within-representation
  self-consistency 更高效的诊断信号：用 1/3 的 token 成本获得相当或更高的诊断精度。三条 claim 无需调整——C1/C2 跨三个基准和两个模型稳定，
  C3 的 GT-label-dependent 效应在新基准复现，taxonomy 跨模型一致。论文双轨叙事（分析为主 + 方法为辅）自然成立。 Selection
  ablation 展示 repair 在可诊断子集上的增量价值。Repair 的 GT=True overcorrection 作为 discovered boundary
  是加分项而非弱点。

  '
imagined_experiments:
- name: FOLIO 完整分析（MVP 数据深度挖掘）
  plan_id: exp-001
  description: '基于 204 样本 MVP 数据的统计检验、错误分类、子集分层分析、不对称性 breakdown、 失败相关性定量分析和 cost-effectiveness
    分析。纯分析，无新实验运行。

    '
  expected_results:
    C1_disagree_rate: 42.16% [35.3%, 49.0%]
    C2_diagnostic_rate: 87.21% [81.3%, 94.7%]
    C3_error_types: 4
    C4_targeted_delta_aggregate: +4.65pp (Fisher p=0.626, n.s.)
    C4_GT_True: -13.6pp
    C4_GT_False: +11.6pp
    C4_GT_Unknown: +14.7pp
    C5_committed_accuracy: 94.6% (35/37)
    C5_coverage: 53.0% (35/66)
    asymmetry_ratio: 5.6:1 (FOL=56, Code=10, Both=10)
    phi_coefficient: 0.189
    phi_p_value: 0.007
    complementary_error_rate: 75% (75/100)
    cost_multiplier_vs_code_only: 5.76x tokens
    accuracy_gain_over_code_only: +21.6pp
    dominant_error: logic_error 25.5%
  result_rationale: '这是已有 MVP 数据的深度挖掘，数值已固定。在 best 档位下，关键价值在于：(1) Bootstrap CI 对 C1/C2
    给出了紧致的区间，C2 下界 81.3% 远超 75% 阈值，为高精度诊断信号提供统计支撑； (2) phi=0.189 (p=0.007) 表明 FOL/Code
    失败相关性低但统计显著——恰好落在"足够独立以产生互补信号， 又不完全独立"的理想区间；(3) 75% 单侧失败率直接支撑 cross-representation
    的互补性叙事； (4) GT-stratified C4 揭示三路分裂是 Claim 3 的核心发现，aggregate 非显著反而强化了 "必须分层报告"的方法论贡献。cost_multiplier
    5.76x 看似高，但对比 k=5 self-consistency 的 5x 成本，CRD 以相近成本获得更丰富的诊断信息（错误类型 + 定位），而非仅
    majority vote。

    '

    无法表达该问题"而非"formalization 错误"， 这些 crash 不是诊断性的； (3) 不对称性几乎消失（1.4:1）——SymPy 和 Python
    在科学领域没有本质的验证保证差异。 GPQA 标记了方法的 domain boundary，适合作为 Discussion 中的 negative finding。

    '

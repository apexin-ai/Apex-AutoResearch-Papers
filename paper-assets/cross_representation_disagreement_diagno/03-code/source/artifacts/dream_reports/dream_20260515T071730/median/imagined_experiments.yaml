tier: median
narrative_guidance: 'CRD 的核心卖点从"精度优于 self-consistency"转向"同等精度下提供结构化诊断信息（error type,
  error side, paradigm asymmetry）， 且成本更低（2 calls vs 5 calls）"。泛化部分成立但有裂缝：ProofWriter
  pilot 失败需切 LogiQA，MATH 不对称性不显著。 Repair 降格为 secondary analysis，selection ablation
  成为主结果。Taxonomy 合并到 3 类后 κ 勉强达标。 论文标题改为 "Diagnosis and Characterization"，投稿策略：EMNLP
  Main borderline，Findings 稳进。 成本效率论证（2 calls vs 5 calls, comparable detection + richer
  diagnosis）是贯穿全文的核心论据。

  '
imagined_experiments:
- name: Cross-Model Ablation on FOLIO
  plan_id: exp-002
  description: '三组条件: (a) Qwen3-32B within-model (MVP baseline), (b) DeepSeek V4 Pro
    within-model, (c) DeepSeek FOL + Qwen Code cross-model. FOLIO 204 样本。验证分歧信号是否依赖特定模型。

    '
  expected_results:
    qwen_within_C1: 0.4216
    qwen_within_C2: 0.8721
    qwen_within_asymmetry_ratio: 5.6:1 (FOL:Code)
    deepseek_within_C1: 0.35
    deepseek_within_C2: 0.74
    deepseek_within_C5_committed: 0.88
    deepseek_within_asymmetry_ratio: 2.5:1 (FOL:Code)
    deepseek_within_phi_coefficient: 0.28
    cross_model_C1: 0.48
    cross_model_C2: 0.78
    cross_model_C5_committed: 0.86
    cross_model_asymmetry_ratio: 3.2:1 (FOL:Code)
    cross_model_phi_coefficient: 0.14
    C2_drop_deepseek_vs_qwen: -13pp
    asymmetry_direction_consistent: true
    cross_model_jaccard_failure_overlap: 0.42
  result_rationale: 'DeepSeek V4 Pro 是更强的通用模型，其 FOL 和 Code 生成能力都更均衡，因此： (1) C2 从 87%
    降至 74%——更强模型的两条路径各自更准确，分歧样本中"两侧都错"的比例上升（ 从 ~13% 升至 ~26%），拉低诊断率； (2) 不对称性从 5.6:1
    压缩到 2.5:1——DeepSeek 的 Code 生成能力相对更强，缩小了 FOL 的优势， 但方向一致（FOL 仍优于 Code），因为 FOL+Z3
    的形式验证天然比 Python exec 更可靠； (3) Cross-model 条件 C1 升至 48%——不同模型的 formalization bias
    不同，分歧率自然上升； 但 C2 降至 78%——跨模型引入的额外分歧中包含"两个模型各自正确但 formalization 不同"的噪声； (4) phi
    系数从 0.189 降至 0.14（cross-model），说明跨模型确实降低了失败相关性， 但降幅不够大，无法彻底消除 correlated failures；
    (5) Jaccard failure overlap 0.42 说明仍有显著的 specification-level 共享失败模式。 整体：泛化方向一致但效果打折，支撑
    "cross-representation signal is model-general" 的弱版本 claim。

    '

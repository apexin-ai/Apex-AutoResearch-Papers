    logiqa_dominant_error: logic_error 18.5%
    logiqa_phi_coefficient: 0.22
  result_rationale: 'ProofWriter 是合成数据集，前提和规则完全形式化，无自然语言歧义。Qwen3-32B 在这种 结构化输入上 FOL
    转换准确率极高（>90%），Code 也因规则简单而表现好，导致分歧率仅 6.7%。 这不是方法失败，而是数据集天花板——当两条路径都很准时，分歧本身就少，诊断价值有限。
    切换到 LogiQA 后：(1) C1=22% 低于 FOLIO 的 42% 但满足 ≥15% 阈值——LogiQA 是选择题 （4选1），FOL 和 Code
    各自有 ~75% 准确率，分歧空间比 FOLIO 小但够用； (2) C2=72% 低于 FOLIO 的 87%——LogiQA 的错误模式更多是"理解题意错误"而非

    Pareto frontier 上被完全支配。k=3 FOL-only 已追平甚至超越 CRD。 Cross-representation 的 "独特价值"
    假设不成立——CRD 的分歧信号不如同一表征的多次采样。 根本原因：cross-representation 引入了异构噪声（Code 的高错误率）， 而
    self-consistency 在同质空间内投票，噪声更可控。 在 reframe 叙事中，这是转折点：我们量化证明了 cross-representation

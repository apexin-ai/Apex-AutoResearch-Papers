- name: MATH Level 5 扩展
  plan_id: exp-004
  description: MATH Level 5 上 SymPy 符号推理 vs Python 数值验证的 cross-executable-representation
    分析。
  expected_results:
    math_n: 200
    math_C1: 16.5% (33/200)
    math_C2: 51.5% (17/33)
    math_C4_delta_aggregate: +1.8pp
    math_C4_fisher_p: 0.82
    math_C4_bootstrap_CI: '[-5.2%, +8.7%]'
    math_C5_committed: 76.5%
    math_C5_coverage: 41.2%
    math_sympy_acc: 0.68
    math_python_acc: 0.73
    math_asymmetry: 1.4:1 Python>SymPy
    math_error_types: 3
    math_dominant_error: computation_error 45.5%
    math_phi_coefficient: 0.31
    math_disagreement_noise_rate: 48.5%
  result_rationale: 'worst 档假设：C1 ≥ 15% 但 C2 < 60%，disagreement 多为噪声。 MATH Level 5
    的两种可执行路径（SymPy 符号化 vs Python 数值计算）在失败模式上的差异 不如 FOL vs Code 那么根本——两者都是 "写代码执行"，区别仅在于调用的库不同（SymPy
    vs NumPy/直接计算）。 这意味着分歧的来源不是 "形式化范式差异" 而是 "实现细节差异"——SymPy 在某些代数操作上超时或溢出， Python
    在精度要求高的问题上有浮点误差。这些分歧中近半数（48.5%）是两种路径都错只是错法不同， 不含诊断信息。C2=51.5% 意味着分歧基本是抛硬币——分歧样本中只有一半能正确定位错误侧。
    phi=0.31 高于 FOLIO 的 0.189，说明 SymPy 和 Python 的失败更相关（都在同类问题上失败）， 进一步压缩了 cross-representation
    的互补空间。 不对称性弱（1.4:1 Python>SymPy），无法复现 FOLIO 上的 "一种表征系统性优于另一种" 的发现。

    '

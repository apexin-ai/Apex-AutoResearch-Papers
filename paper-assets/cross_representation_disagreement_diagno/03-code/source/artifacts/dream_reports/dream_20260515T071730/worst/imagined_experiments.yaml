- name: 跨模型消融（FOLIO）
  plan_id: exp-002
  description: DeepSeek V4 Pro within-model + cross-model 对比，验证分歧来源是表征差异还是模型能力差异。
  expected_results:
    deepseek_within_C1: 35.3%
    deepseek_within_C2: 72.1%
    deepseek_within_C5_committed: 78.6%
    deepseek_within_asymmetry_ratio: 1.8:1 (Code > FOL)
    cross_model_C1: 48.0%
    cross_model_C2: 68.5%
    cross_model_C4_delta: +1.2pp
    cross_model_C4_fisher_p: 0.83
    qwen_fol_acc: 0.82
    deepseek_fol_acc: 0.71
    deepseek_code_acc: 0.79
    asymmetry_direction_reversal: true
    cross_model_C2_range: '[0.55, 0.72]'
  result_rationale: 'worst 档核心假设：DeepSeek 的 FOL/Code 不对称方向反转。Qwen3-32B 展示 FOL >> Code
    (5.6:1)， DeepSeek V4 Pro 反转为 Code > FOL (1.8:1)。原因：DeepSeek V4 Pro 的代码生成能力显著强于
    Qwen， 但其 FOL 生成不如 Qwen——两个模型在形式化能力上的 profile 截然不同。 这意味着 "FOL 系统性优于 Code" 不是表征层面的规律，而是模型层面的偶然——
    Qwen 恰好 FOL 能力更强。不对称方向的反转直接摧毁了 Claim 2 中 "5.6:1 asymmetry reveals systematic differences
    in LLM formal logic vs code generation" 这个论点。 cross-model 条件的 C1 虽然更高（48%，因为两个不同模型的形式化更容易分歧），
    但 C2 降到 68.5%——额外的分歧是噪声而非诊断信号，因为它混合了模型能力差异和表征差异。 C4 delta 几乎为零，cross-model 的 repair
    完全无效。

    '
  tables:

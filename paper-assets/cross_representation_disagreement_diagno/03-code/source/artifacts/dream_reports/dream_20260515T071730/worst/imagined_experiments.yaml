  - 'Fig 4: C2 diagnostic rate scatter — within-model vs cross-model，标注 C2 随 cross-model
    下降'
  analysis: '不对称方向反转是 worst 档的关键实证发现。这意味着我们不能 claim "FOL 是更可靠的形式化"—— 这只是 Qwen 的特性。在
    reframe 后的叙事中，这恰恰成为核心贡献之一： "cross-representation disagreement 的结构高度模型依赖，不同 LLM
    的形式化能力 profile 决定了 哪种表征更可靠——这一发现对 practitioner 选择表征策略有直接指导意义。" cross-model C2
    下降到 68.5% 证明：分歧信号的诊断价值来自 same-model 的表征差异， 混入模型能力差异反而稀释信号质量。


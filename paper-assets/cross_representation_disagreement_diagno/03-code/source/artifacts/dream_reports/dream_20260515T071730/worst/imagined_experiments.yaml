    实际预测略有修正：repair 在 GT=Unknown 子集上微弱优于 selection（+4.8pp）， 因为 Unknown 样本的 "正确侧" 经常也不完全正确（FOL
    可能输出 True 而非 Unknown）， repair 可以利用分歧信息生成更准确的 Unknown 判断。 但在 GT=True 和 GT=False
    上，selection 系统性优于 repair——原因很直观： 如果已经知道哪一侧正确，直接选比修复错误侧更可靠。repair 引入了额外的不确定性 （修复后的答案可能更错），尤其在

- name: Unknown 样本深度分析 + correlated failure 定量
  plan_id: exp-006
  description: Code overclaiming 机制分析、phi 按 GT 分层、false agreement rate、error 分类。
  expected_results:
    code_overclaiming_rate_unknown: 73.9% (51/69 Unknown 样本中 Code 给出 True/False)
    fol_overclaiming_rate_unknown: 31.9% (22/69)
    phi_GT_True: 0.28
    phi_GT_False: 0.15
    phi_GT_Unknown: 0.08
    false_agreement_rate_overall: 11.8% (24/204)
    false_agreement_rate_True: 4.2% (3/72)
    false_agreement_rate_False: 7.9% (5/63)
    false_agreement_rate_Unknown: 23.2% (16/69)
    specification_vs_formalization_error_split: 38%/62%
  result_rationale: 'Code overclaiming 在 Unknown 样本上极为严重（73.9%）——Python 代码倾向于给出确定性答案
    而非 "无法确定"，因为代码执行天然产生 True/False 输出，缺少 "Unknown" 的自然表达。 这解释了为什么 CRD 在 Unknown 子组上
    C4 delta 最高：分歧信号其实主要检测的是 Code overclaiming， 而非真正的形式化错误。 phi 按 GT 分层揭示：Unknown
    样本的 phi 最低（0.08），说明两种表征在 Unknown 上的失败几乎独立—— 但这种 "独立性" 不是好消息，而是因为两种表征在 Unknown
    上都在乱猜，只是猜的方向不同。 false agreement rate 在 Unknown 上高达 23.2%——近四分之一的 Unknown 样本两条路径都错但答案一致，
    CRD 完全无法检测这些样本。这是 CRD 的根本盲区。 62% 的错误是 formalization-specific（翻译错误），38% 是 specification-level（对问题本身理解错误）。
    后者两条路径通常犯同样的错，CRD 对此无能为力。


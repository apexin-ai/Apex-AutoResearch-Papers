- name: ProofWriter 扩展
  plan_id: exp-003
  description: ProofWriter pilot 20-30 样本，若 C1<10% 则 fallback 到 LogiQA。
  expected_results:
    proofwriter_pilot_n: 25
    proofwriter_pilot_C1: 4.0% (1/25)
    proofwriter_pilot_decision: FAIL → fallback to LogiQA
    proofwriter_pilot_fol_acc: 92.0%
    proofwriter_pilot_code_acc: 88.0%
    logiqua_n: 150
    logiqua_C1: 12.7% (19/150)
    logiqua_C2: 63.2% (12/19)
    logiqua_C4_delta: +2.1pp
    logiqua_C4_fisher_p: 0.71
    logiqua_C5_committed: 58.3% (7/12)
    logiqua_asymmetry: 2.1:1 FOL>Code
    logiqua_fol_acc: 0.76
    logiqua_code_acc: 0.69
  result_rationale: 'ProofWriter 是合成数据集，每条规则语义精确无歧义。worst 档下，LLM 对合成数据的形式化几乎不出错——
    FOL 准确率 92%、Code 88%，两者同时犯错的概率极低，分歧率仅 4%（1/25 pilot 样本）。 这直接验证了 worst 档假设："CRD
    跨基准不泛化"——合成数据集上 cross-representation disagreement 几乎不存在，因为形式化任务过于简单。 Fallback
    到 LogiQA 后情况略好但仍不理想：LogiQA 是多选题而非三分类（True/False/Unknown）， 需要适配 pipeline；即使适配后，C1=12.7%
    勉强过 10% 阈值但远低于 FOLIO 的 42.2%。 C2=63.2% 远低于 FOLIO 的 87.2%——LogiQA 的分歧中只有六成是真正的诊断信号，
    其余是两种表征都在猜的噪声分歧。根本原因：LogiQA 的选项结构使得 LLM 的形式化路径更相似（都倾向于枚举选项而非独立推理），压缩了 cross-representation
    的差异空间。

    '

- name: Self-consistency baseline 对比
  plan_id: exp-012
  description: k=5 FOL-only / Code-only majority vote vs single-pass CRD，隔离 cross-representation
    独特价值。
  expected_results:
    folio_sc5_fol_precision: 89.3%
    folio_sc5_fol_recall: 38.9%
    folio_sc5_code_precision: 82.1%
    folio_sc5_code_recall: 44.4%
    folio_crd_precision: 87.2%
    folio_crd_recall: 42.2%
    folio_sc5_fol_accuracy: 84.8%
    folio_sc5_code_accuracy: 72.5%
    folio_crd_accuracy: 69.1%
    folio_sc5_fol_cost: 5x
    folio_crd_cost: 5.76x
    folio_sc3_fol_accuracy: 83.3%
    folio_sc3_fol_cost: 3x
    folio_crd_vs_sc5_fol_delta: -5.7pp
    logiqua_sc5_code_accuracy: 74.0%
    logiqua_crd_accuracy: 70.7%
    logiqua_crd_vs_sc5_delta: -3.3pp
    math_sc5_python_accuracy: 78.5%
    math_crd_accuracy: 74.5%
    math_crd_vs_sc5_delta: -4.0pp
    crd_cost_ratio_vs_sc5: 0.38
  result_rationale: 'worst 档核心假设：k=5 单表征 majority vote 精度 > CRD 5pp+，且 k=3 已追平 CRD。
    在 FOLIO 上，k=5 FOL-only majority vote 达到 89.3% precision（vs CRD 87.2%） 和 84.8%
    accuracy（vs CRD pipeline 69.1%，即 targeted repair 后的准确率）。 precision 差距不大（+2.1pp），但
    accuracy 差距巨大（+15.7pp）， 因为 SC5 不需要 repair 步骤——majority vote 直接输出答案，避免了 repair
    引入的噪声。

    关键打击点：k=3 FOL-only 已达 83.3% accuracy，用 3x 成本就超过了 CRD 的 5.76x 成本。 CRD 不仅精度不如 SC5，成本还更高（5.76x
    vs 5x），cost-efficiency 全面落败。

    根本原因：FOLIO 上 FOL 的基础准确率（82%）远高于 Code（59.8%）， k=5 majority vote 在高基线上进一步提升了 FOL
    的表现。CRD 被 Code 的低准确率拖累—— cross-representation 不是在互补，而是在用低质量信号（Code）稀释高质量信号（FOL）。

    在其他 benchmark 上模式一致：SC5 在各 benchmark 上的最优表征 majority vote 均优于 CRD， 且成本更低或持平。CRD
    的 cost_ratio 为 0.38（即 CRD 每单位准确率提升的 token 成本 是 SC5 的 2.6 倍），没有 cost-effectiveness
    优势。

    '

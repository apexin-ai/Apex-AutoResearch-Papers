tier: worst
narrative_guidance: '放弃 "CRD 是更好的诊断工具" 方法论 claim，转为 "cross-representation disagreement
  的实证解剖"。 新 story：(1) LLM 形式化为 FOL 和 Code 时失败模式高度不对称且互补（75% one-side-only），这本身是关于
  LLM 能力结构的重要发现； (2) 但这种互补性不足以构建可靠的诊断/修复 pipeline，因为 self-consistency 更简单且同样有效； (3)
  我们量化了 cross-representation 方法的边界条件——何时有效、何时失败、为什么失败。 标题改为 "When Do Two Formalizations
  Know More Than One? An Empirical Study of Cross-Representation Disagreement in LLM
  Reasoning"。 仍投 EMNLP main，定位为高质量 negative/boundary result paper。

  '
imagined_experiments:
- name: FOLIO 完整分析（MVP 数据深度挖掘）
  plan_id: exp-001
  description: 基于 204 样本 MVP 数据的完整统计分析，含 bootstrap CI、Fisher test、分层分析、相关性分析、cost-effectiveness。
  expected_results:
    C1_disagree_rate: 42.2% [35.3%, 49.0%]
    C2_diagnostic_rate: 87.2% [81.3%, 94.7%]
    C4_targeted_delta_aggregate: +4.65pp
    C4_bootstrap_CI: '[-8.8%, +18.1%]'
    C4_fisher_p: 0.626
    C4_GT_True: -13.6pp
    C4_GT_False: +11.6pp
    C4_GT_Unknown: +14.7pp
    C5_committed_accuracy: 53.0% [41.0%, 65.1%]
    phi_coefficient: 0.189
    phi_p: 0.007
    complementary_error_rate: 75%
    cost_multiplier: 5.76x
    accuracy_gain_over_code_only: +21.6pp
  result_rationale: 'exp-001 数据已固定，worst 档不改变已有数值。但 worst 档的关键在于：这些数值在后续实验的对照下被重新解读。
    C4 aggregate CI 含零（[-8.8%, +18.1%]）且 Fisher p=0.626 已经是 worst 档的核心支撑—— repair
    在统计上不显著。phi=0.189 说明 FOL 和 Code 的失败只有微弱正相关，表面上支持互补性， 但在 worst 档下，exp-012 会证明 self-consistency
    以更低成本达到类似效果， 使得这个 "互补性" 的实用价值大打折扣。cost_multiplier=5.76x 在 worst 档叙事中从 "合理代价" 变为
    "CRD 比 SC5 贵 3-4 倍但精度更低" 的负面论据。 深度挖掘会揭示 GT=True 的 -13.6pp 不是边缘问题而是系统性缺陷： CRD 在高置信正确样本上的
    overcorrection 是方法论层面的固有弱点。

    '

- id: D020
  date: 2026-05-24 17:15 UTC
  summary: Detection≠Decision 叙事从 "L28 peak vs L13 causal = 大幅分离" 改为 "causal site
    L13 稳定而 detection peak 随数据波动"
  rationale: 多种子实验（虽数据版本不同）揭示 peak layer 在种子间剧烈波动（Llama L28→L12/L15），而 peak accuracy
    稳定（±0.12%）。这说明 L28 peak 可能是数据依赖的，但 causal site L13 有 boundary sweep（6层, N=201,
    独立样本）确认是稳健的。新叙事实际上更强：detection 是分布式的（broad plateau L3-L22），causal influence 是集中的（L13），这比"L28
    vs L13 距离大"更有 mechanistic insight。配合 MF-3 的 Llama-specific 限定，整体 framing 更诚实。

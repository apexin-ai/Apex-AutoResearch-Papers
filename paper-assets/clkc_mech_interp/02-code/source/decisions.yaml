- id: D008
  date: 2026-05-22 05:43 UTC
  summary: C2 reframe：不对称性非冲突特异性，改为"冲突信号继承模型一般跨语言迁移偏置"
  rationale: plan_110 XNLI 基线结果：Qwen +6.72pp CI[2.36,11.73], Llama +5.97pp CI[0.92,11.33]，与冲突任务（7.18/7.22pp）量级无区别，均≥5pp。按
    RC9 预设标准，C2 需 reframe。新 framing：冲突信号编码在模型的通用跨语言表征空间中（非独立机制），继承其方向性偏置。这是更深层的机制洞察——冲突检测不是专用子空间，而是
    piggyback 在已有的跨语言对齐结构上。论文从"发现新现象"转为"机制分析+方法论贡献"。C1(可检测性)、C3(非线性)、C4(层结构)不受影响。
  related_experiments:
  - exp_id: xnli_baseline_110
    role: decisive
    result: XNLI asymmetry Qwen +6.72pp Llama +5.97pp, ≥5pp threshold → reframe
  depends_on:
  - D007

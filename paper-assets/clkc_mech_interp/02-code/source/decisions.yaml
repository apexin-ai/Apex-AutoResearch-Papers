    (19.9% vs 6.6%)。方向性完全正确（正α→p→c, 负α→c→p）。L28/L18 均 negative → 因果决策在 mid-layer (~40%
    depth)，probe peak (L28, 88%) 只是诊断信号。这是论文核心因果证据，直接回应 RC8。下一步：等 α=+10/+20 确认，然后
    Qwen L13 跨模型验证。Paper story 升级为 detection-vs-decision 层分离。

  rationale: Reviewer 审查发现 ROADMAP 混用两套数据源：C1 用 matched-condition N=201（Llama 90.0%），C3
    却说"L13 唯一因果节点"——仅在原始 N=136 数据下成立。matched-condition 层扫描（steering_llama_L13_repl_126,
    steering_llama_L14_125, steering_llama_L16_127）显示 L13/L14/L16 三层均 Bonferroni 显著（阈值
    0.05/6=0.00833）。D019 中"Llama L16 也失败"基于 steering_llama_L16_123（N=136, probe acc
    76.84%），但 steering_llama_L16_127（N=201, probe acc 91.5%, p=0.005）结论为 success。因果窗口从"L13
    单点"扩展为"L13-L16 mid-layer window"。这实际上强化了 Detection≠Decision 叙事——因果效应集中在 ~40-50%
    depth 的窄窗口，而非 probe peak（~88% depth）。论文是否切换到 matched-condition 数据需要评估：优点是数据质量更高，缺点是需要更新
    Table 3 和相关叙事。
  related_experiments:
  - exp_id: steering_llama_L13_repl_126
    role: matched-condition L13
    result: Bonferroni significant (α=+10 p=0.0003, α=+5 p=0.0034)
  - exp_id: steering_llama_L14_125
    role: matched-condition L14
    result: Bonferroni significant (α=+10 p=0.0022)
  - exp_id: steering_llama_L16_127
    role: matched-condition L16
    result: Bonferroni significant (α=+10 p=0.005), reversing D019
  - exp_id: steering_llama_L16_123
    role: original L16 (superseded)
    result: negative (N=136, probe acc 76.84%)

  date: 2026-05-22 07:12 UTC
  summary: C3 confirmed conflict-specific：XNLI MLP 对照证明非线性 encoding 是冲突特有属性
  rationale: 'XNLI EN→ZH MLP Δ: Qwen -2.0pp, Llama -0.5pp（负/零）。冲突 EN→ZH MLP Δ: Qwen
    +2.4pp, Llama +9.2pp（正且显著）。两模型一致。虽然方向不对称性 (C2) 是一般跨语言属性，但冲突信号在弱迁移方向 (EN→ZH) 需要非线性变换才能解码，而一般语义任务不需要。这成为
    C2 reframe 后论文的核心差异化 contribution。'

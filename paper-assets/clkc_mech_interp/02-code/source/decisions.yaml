decisions:
- id: D001
  date: 2026-05-21 12:00 UTC
  summary: MVP 方案：EN+ZH 双语探针迁移实验验证跨语言冲突信号可检测性
  rationale: Track 1（探针迁移）是整个 3-track 研究的基础前提。如果残差流中无法检测冲突信号或跨语言完全不迁移，后续 SAE 分析和 steering
    均无意义。选 Qwen3-8B-Instruct 因 Qwen-Scope 提供 base SAE 便于后续 Track 2。选 EN+ZH 因语系距离大，若迁移成功则信号强。ConflictQA
    公开可用，无需等 CLEAR 数据。Pass/fail 标准参考 Brink et al. 单语 0.96 F1 和 Zhao et al. ~90% 探针精度。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-21 12:06 UTC
  summary: 采纳 Reviewer 5 条 warning，细化 MVP gate：增加 70-79% conditional pass 定义、layer-wise
    量化标准、统计显著性要求（binomial p<0.01）、翻译 COMET gate（≥0.80）、FAIL→retry Llama 行动路径
  rationale: Reviewer 指出原 gate criteria 存在 ambiguous zone（70-79% 无定义）、layer-wise pattern
    逃逸条款过于模糊、ZH 60% 阈值缺统计锚定、翻译质量是迁移失败的混淆因素、FAIL 后行动未定义。全部采纳以确保 MVP 结论可靠。FAIL→retry
    on Llama 给予一次排除模型特异性的机会，两模型均 FAIL 才 kill。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-21 14:26 UTC
  summary: 补采样至 2000 条 + 取消强制交集，每个模型用各自 verified 数据集
  rationale: Llama verify 保留率仅 33%（266/800 train），低于 300 阈值。ConflictQA 有 ~10K 条，扩至
    2000 可保证两模型各自 ≥300 有效样本。取消交集策略因为强制交集会进一步损失样本量，且跨模型对比不要求相同样本——各自 verified 集上报告相同指标即可，交集作为补充分析。20%
    标签翻转率确认了 M001 verify 步骤的必要性。
  related_experiments:
  - exp_id: mvp_probe_llama_v1
    role: triggered_decision
    result: verify 保留率 33%, 266 train / 70 test, 20% flip
  depends_on:
  - D001
  - D002
- id: D004
  date: 2026-05-21 19:17 UTC
  summary: Llama MVP CONDITIONAL PASS → EXTEND：EN→EN 77.6%, 跨语言迁移不对称（ZH→EN 71.3% vs
    EN→ZH 59.6%），等 Qwen 结果做最终 verdict
  rationale: Llama 4 方向探针结果显示冲突信号可线性检测（所有方向 p < 0.01），但 EN→EN 未达 80% PASS 阈值（77.6%）。跨语言迁移存在但高度不对称：ZH→EN
    强迁移（71.3%），EN→ZH 弱迁移（59.6%，刚好低于 60% point 阈值但 p=9.7e-4 仍显著）。CONDITIONAL PASS 按
    D002 规则进入 EXTEND 评估。等 Qwen 跨模型验证后做最终 MVP verdict。不对称迁移本身是有价值的科学发现。
  related_experiments:
  - exp_id: mvp_probe_llama_v1
    role: primary
    result: EN→EN 77.6% L28, ZH→ZH 72.1% L13, EN→ZH 59.6% L5, ZH→EN 71.3% L15
  depends_on:
  - D002
- id: D005
  date: 2026-05-21 20:33 UTC
  summary: 双模型 MVP CONDITIONAL PASS：Llama EN→EN 77.6% + Qwen EN→EN 75.0%，跨语言迁移不对称且跨架构一致（ZH→EN
    >> EN→ZH），等 COMET 验证后进入 research 阶段
  rationale: 两个模型全 4 方向探针结果统计高度显著（permutation p < 0.001）。核心发现：(1) 冲突信号在两模型两语言中均可线性检测；(2)
    跨语言迁移存在方向性不对称（ZH→EN 71-73% vs EN→ZH 60-67%），两模型一致；(3) 不对称程度与架构相关——Qwen（多语言训练比例更高）EN→ZH
    67.3% 远强于 Llama 59.6%。EN→EN 均在 70-79% CONDITIONAL 区间，未达 80% PASS，但跨语言迁移的质量和不对称发现的科学价值足以支撑继续研究。COMET
    翻译质量验证是最后一个前置条件。
  related_experiments:
  - exp_id: mvp_probe_llama_v1
    role: primary
    result: EN→EN 77.6%, ZH→ZH 72.1%, EN→ZH 59.6%, ZH→EN 71.3%
  - exp_id: mvp_probe_v1
    role: primary
    result: EN→EN 75.0%, ZH→ZH 72.6%, EN→ZH 67.3%, ZH→EN 73.2% (v2 clean labels)
  depends_on:
  - D002
  - D004
- id: D006
  date: 2026-05-22 02:13 UTC
  summary: COMET 0.80 阈值不直接适用 back-translation：提升 plan_105 至 P0，用 ablation 实证判断翻译质量是否影响探针结果
  rationale: Qwen test COMET mean=0.70, pass rate 18.45% (31/168 at ≥0.80)。但 0.80
    阈值是为正向翻译设定的，back-translation 引入二次噪声（EN→ZH→EN），COMET 天然偏低。降低阈值是 ad hoc 的；正确做法是用
    plan_105 COMET 分段 ablation 实证检验：按 COMET tertile 分组比较 probe acc，如果组间无显著差异 → 翻译质量非
    confounder → 放宽阈值有据可依；如果组间差异显著 → 需过滤低 COMET 样本重跑探针。
  related_experiments:
  - exp_id: comet_qwen_v5
    role: evidence
    result: Qwen test COMET mean=0.70, pass 18.45%
  - exp_id: mvp_probe_v1
    role: dependent
    result: 探针结果可能受翻译质量影响
  depends_on:
  - D005
- id: D007
  date: 2026-05-22 03:50 UTC
  summary: Dream 审稿结果处理：新增 3 个 P0 实验（非冲突基线、bootstrap 升级、EN↔DE）
  rationale: Dream dream_20260522T023801 三档审稿（best 5/10, median 5/10, worst 4/10）一致识别
    CRITICAL gap：缺失非冲突语义基线。X→EN > EN→X 不对称性可能是英语主导模型的一般性质而非冲突特异性。另外两个 MAJOR gap：bootstrap
    n=100 不足（需 n≥2000）、仅 CJK 语言对（需 Indo-European）。三个问题均与实验结果无关，属结构性缺陷，优先级最高。新增 plan_110
    (非冲突基线, P0)、plan_111 (bootstrap 升级, P0)、plan_112 (EN↔DE, P0)。paper_framing.md

mistakes:
- id: M001
  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: ConflictQA 标签基于 ChatGPT 参数知识，未适配目标模型 Qwen3-8B，导致标签可能反转
  root_cause: ConflictQA 的 conflict/no_conflict 标签是相对于 ChatGPT 的 memory_answer 定义的。直接用这些标签训练
    Qwen3-8B 的探针，忽略了两个模型参数知识可能不一致的事实。Director 在设计 MVP 数据方案时也未注意到这一点。
  prevention: 使用第三方 QA 数据集训练探针时，必须验证标签与目标模型的参数知识对齐。标准步骤：先对目标模型做 closed-book QA 验证，再根据目标模型的实际参数知识分配/过滤标签。Brink
    et al. (2026) 做了类似的预过滤。
  status: active
  context: ConflictQA 中 ChatGPT memory_answer 经常与 ground_truth 不一致（这是数据集设计目的）。预估约
    30% 样本标签需要修正。
  related_decisions:
  - D001
  - D002
- id: M002
  date: '2026-05-21'
  category: code_bug
  severity: low
  summary: verify_parametric_knowledge.py 字段名硬编码为 qwen_，多模型场景下造成混淆
  root_cause: 脚本最初只为 Qwen 设计，字段名写死为 qwen_parametric_answer / qwen_agrees_with。扩展到
    Llama 时未更新字段名，导致 Reviewer 无法确认实际使用的模型。
  prevention: 多模型实验的脚本从一开始就用通用字段名（model_parametric_answer），并在输出中记录 model_used 元数据。代码审查时检查是否存在模型名硬编码。
  status: active
  fix: 字段名改为 model_parametric_answer / model_agrees_with，新增 model_used 字段。
- id: M003
  date: '2026-05-21'
  category: code_bug
  severity: medium
  summary: Pipeline 文件引用第三次未对齐——补采样生成 _full 文件但下游脚本仍引用原始文件名
  root_cause: 每次数据变更（verify 后缀、validated 后缀、full 后缀）都引入新文件名，但未统一更新所有下游脚本。根本原因是 pipeline
    中文件命名约定不一致，新建文件而非覆盖。
  prevention: 数据 pipeline 的文件命名策略应在设计时确定：要么统一用固定文件名（每步覆盖前备份），要么通过配置文件/命令行参数传递文件路径。避免每步产出新后缀名导致下游引用断裂。此次采用
    rename 覆盖方案统一解决。
  status: active
  fix: 采用 rename 方案：_full 文件覆盖原始文件名，原始数据备份到 original_500/ 目录。所有脚本零修改。
- id: M004
  date: '2026-05-21'
  category: code_bug
  severity: medium
  summary: collect_activations.py hook 假设 decoder output 是 tuple，Llama 返回 tensor 导致
    IndexError 崩溃
  root_cause: hook_fn 写死 output[0] 取 hidden_states，但不同模型/transformers 版本的 decoder
    layer output 格式不一致（有时是 tuple 有时是 tensor）
  prevention: hook_fn 中始终用 isinstance(output, tuple) 判断再取值。写 hook 时用两个以上模型做 smoke
    test（至少 dry-run 1 batch）
  status: active
  fix: 'hook_fn 改为: hidden = output[0] if isinstance(output, tuple) else output'
- id: M005
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: collect_activations.py 左 padding 时 last-token 位置计算错误，~75% 样本提取了 padding
    位置的激活
  root_cause: 代码用 attention_mask.sum()-1 计算 last token 位置，这对右 padding 正确但对左 padding
    完全错误。左 padding 时所有样本的 last token 固定在 max_seq_len-1
  prevention: 左 padding 时用 input_ids.shape[1]-1 取 last token。写激活提取代码时必须明确注释 padding
    方向并做 sanity check（打印几个样本的提取位置 vs 实际序列长度）
  status: active
  fix: last_pos = inputs["input_ids"].shape[1] - 1
- id: M006
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: Qwen3 verify 未正确剥离 think tags，77.4% 数据含思考链文本导致标签匹配错误
  root_cause: max_new_tokens=128 不够 Qwen3 think 块完成，截断后无配对 </think> 标签，正则匹配失败。think
    文本含正误答案导致 substring 匹配混乱
  prevention: 对 Qwen3 系列模型，verify/inference 时加 /no_think 或 enable_thinking=False 关闭思考模式。或
    max_new_tokens 设 2048+ 确保 think 块完整
  status: active
  fix: verify 时使用 enable_thinking=False 或增大 max_new_tokens 到 2048
- id: M007
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: bootstrap_asymmetry.py 未使用 StandardScaler，与 train_probe.py 预处理不一致导致 CI
    无效
  root_cause: 新脚本从零编写时未复制 train_probe.py 的完整预处理 pipeline（StandardScaler），只复制了模型训练部分
  prevention: 新分析脚本必须复用或导入已有 pipeline 的预处理步骤，不要从零重写。或将 StandardScaler + LogisticRegression
    封装成共享函数供所有脚本调用
  status: active
  fix: 在 bootstrap resampling loop 内加 StandardScaler().fit_transform/transform
- id: M008
  date: '2026-05-21'
  category: experiment_design
  severity: medium
  summary: Multi-seed 实验无效：lbfgs solver 是确定性的，改 random_state 不改变结果，5 个 seed 给出 std=0
  root_cause: 误以为 sklearn LogisticRegression 的 random_state 影响所有 solver，实际只对 sag/saga/liblinear
    有效。lbfgs 给定相同数据 + 超参 = 确定性结果
  prevention: multi-seed 实验要通过变化训练数据（Bootstrap resampling 或 K-Fold）实现，不能只改 solver
    seed。确定性算法跑 N 次 = 浪费 N-1 次
  status: active
  fix: 改用 Bootstrap training data（有放回抽样）或 StratifiedKFold 交叉验证
- id: M009
  date: '2026-05-21'
  category: agent_behavior
  severity: medium
  summary: COMET 进程被 submit_training_job 默认 timeout 杀死（EXIT_CODE=124），丢失 340/320 条已完成的回译
  root_cause: submit_training_job 有默认 timeout，COMET 回译 ~1000 条每条 ~10s 需要 ~3h，超过默认限制。且首次启动时缺少
    TRANSFORMERS_OFFLINE=1，COMET 尝试联网下载模型失败
  prevention: 长时间任务（>1h）用 nohup 直接启动或设置足够大的 timeout_hours。COMET 等需要预训练模型的工具加 TRANSFORMERS_OFFLINE=1
    避免联网依赖
  status: active
  fix: 用 nohup 直接启动 COMET 绕过 timeout 限制，加 TRANSFORMERS_OFFLINE=1
- id: M010
  date: '2026-05-22'
  category: agent_behavior
  severity: medium
  summary: Gemma-2-9B-IT 下载中断，仅完成 11%，Worker 未检测到截断
  root_cause: AutoDL 上 HF 直接下载大模型极慢且不稳定，SSH 超时或网络中断导致下载中断。Worker 汇报"已完成"但未验证模型权重完整性。
  prevention: 1. AutoDL 大模型下载优先用 ModelScope CDN 或 HF mirror (hf-mirror.com)；2. 下载前先
    source /etc/network_turbo；3. 下载后必须验证：检查文件大小或加载模型确认 num_parameters；4. 用 nohup 后台执行避免
    SSH 超时
  status: active
  fix: 清除截断文件，用 ModelScope 或 HF mirror 重新下载
- id: M011
  date: '2026-05-22'
  category: resource_misuse
  severity: medium
  summary: COMET 第三次被 EXIT_CODE=124 timeout 杀死——旧 tmux 监控进程未清理
  root_cause: 之前用 submit_training_job 启动 COMET 时创建的 tmux 监控会话仍在运行，wall_clock 达 6.1h
    后触发 timeout 杀掉进程。即使后来改用 nohup 直接启动，旧的 tmux 监控仍可能干扰。
  prevention: 1. 用 nohup 直接启动长任务后，必须清理同一 GPU 上的旧 tmux 监控会话（tmux kill-session）；2. 启动前先
    tmux ls 检查是否有残留监控；3. 长任务彻底绕过 submit_training_job 体系，不要混用两种启动方式
  status: active
  fix: Worker 正在诊断部分结果和重启
- id: M012
  date: '2026-05-22'
  category: resource_misuse
  severity: low
  summary: Gemma translate 用 CUDA_VISIBLE_DEVICES=0 跑到已占用的 GPU 上，分配的 cuda:1 空闲
  root_cause: Worker prompt 中手写 CUDA_VISIBLE_DEVICES=0，误以为框架会自动映射物理 GPU。submit_on_allocated/submit_training_job
    才有映射，SSH 手动执行直接对应物理编号。
  prevention: SSH 手动执行时 CUDA_VISIBLE_DEVICES 必须与 registry 分配的物理 GPU 编号一致。Worker prompt
    模板应从 registry allocation 读取 gpu_ids 而非硬编码。
  status: active
  fix: 当前翻译进程不中断（无 OOM），后续步骤已确认使用 CUDA_VISIBLE_DEVICES=1。
- id: M013
  date: '2026-05-22'
  category: experiment_design
  severity: high
  summary: CKA 对冲突和 XNLI 数据使用不同配对策略（aligned vs unaligned），导致 10-20× 差异由内容配对而非信号差异驱动
  root_cause: compute_cka.py 对冲突数据用 aligned=True（同一问题 EN/ZH 配对），对 XNLI 用 aligned=False（不同前提按标签匹配）。CKA
    度量对输入配对高度敏感——内容相同时天然高，内容不同时天然低。
  prevention: 跨条件对比实验必须控制配对策略一致。CKA/CCA 类度量的比较必须在相同 alignment 条件下进行。设计对照实验时先列出所有可能的混淆变量（内容配对、样本量、标签分布）。
  status: active
  fix: 重跑：(1) XNLI aligned CKA（平行语料配对），(2) Conflict unaligned CKA（打乱配对），(3) 两个条件在相同
    alignment 下比较。
- id: M014
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: CKA 修复脚本日志错误解读：-0.085 方向反转被误判为"C3 evidence SUPPORTED"

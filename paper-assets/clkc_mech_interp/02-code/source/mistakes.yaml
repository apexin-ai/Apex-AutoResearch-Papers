- id: M015
  date: '2026-05-22'
  category: code_bug
  severity: medium
  summary: Steering hook 连续两次崩溃：v1 IndexError (2D tensor), v2 TypeError (BaseModelOutputWithPast
    非 tuple)
  root_cause: 未在提交 GPU 前 dry-run 验证 hook 的输出格式。transformers decoder layer output 在

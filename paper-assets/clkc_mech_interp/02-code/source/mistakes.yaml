- id: M017
  date: '2026-05-23'
  category: agent_behavior
  severity: high
  summary: Kill+restart bootstrap 未清理孤儿 worker 进程，导致 v1/v2 并行运行、数据竞争
  root_cause: Worker 在 restart DE bootstrap 时只 kill 了父进程 (PID 538586)，但 64 个 multiprocessing
    worker 子进程因 PPID 变为 1（孤儿化）而继续运行。这是第二次发生（Gemma XNLI bootstrap 也出过孤儿进程）。
  prevention: Kill multiprocessing 父进程时必须先 kill 整个进程组：`kill -- -$(ps -o pgid= -p $PID
    | tr -d ' ')` 或 `pkill -P $PID` 先杀子进程再杀父进程。重启后用 `ps -eo pid,ppid,args | grep $SCRIPT
    | awk '$2==1'` 确认无孤儿残留。
  status: active
  context: DE bootstrap parallel v1 (PID 538586) 被 kill 后，64 个 worker (PID 538825-538870+)
    变为孤儿继续运行。v2 (PID 550508+) 启动后两组进程同时写同一输出文件，CPU load 飙到 738。
  fix: urgent_agent_message 指示 kill 所有 PPID=1 的孤儿进程，保留 v2 进程组
- id: M018
  date: '2026-05-23'
  category: experiment_design
  severity: medium
  summary: Probe cosine similarity 实验设计逻辑错误：conflict 探针与 XNLI 探针分类不同任务，权重方向正交是预期结果，不能用于检验
    piggyback 假说
  root_cause: 混淆了"任务判别方向"和"跨语言子空间方向"。Piggyback 假说是关于 EN vs ZH 的表征几何共享，不是 conflict
    判别方向与 XNLI 判别方向对齐。两个不相关二分类任务在 4096 维空间里随机方向的期望 cosine ≈ 0，近零是 trivial 结果。
  prevention: 设计验证假说的实验前，先明确假说的操作化定义。"两个任务共享子空间" ≠ "两个任务的判别方向对齐"。正确的操作化是 cross-task
    language probe transfer（Exp 116）。
  status: active
  fix: Reviewer 纠正了 Worker 的错误结论。该实验结果不加入论文。
- id: M019
  date: '2026-05-23'
  category: experiment_design
  severity: high
  summary: Exp 116 单种子 cross-task transfer 使用 lbfgs solver 在 Gemma 中间层产生收敛 artifact，伪造了
    "L14-22 跨语言子空间崩塌" 的假象
  root_cause: LogisticRegression solver 选择不当。lbfgs 在 d=3584 高维空间对特定数据配置收敛失败，产生近随机探针方向。单种子无法检测此问题。Bootstrap
    n=1000 使用 liblinear 后 L15 从 0.53 变为 0.97，证明是 solver artifact。
  prevention: 1) 对比实验/bootstrap 必须使用相同 solver；2) 单种子结果如果出现异常 pattern（如局部突降），必须用多种子验证再写入论文；3)
    高维空间优先用 liblinear/saga，不用 lbfgs；4) 任何写入论文的定量结论必须有 CI/error bars 支撑。
  status: active
  context: Director 基于错误的崩塌叙事向用户提议了 Gemma steering at L10/L24 实验，动机现已失效。Paper Agent
    已将错误数据写入 Discussion L27（"co-localizes with L17"），需紧急修正。
  fix: 1) Paper Agent 修正 L27 删除 L17 共定位声明；2) 只使用 bootstrap 结果写论文，不引用 exp 116 单种子数据；3)
    exp 116 registry 标注 solver issue。

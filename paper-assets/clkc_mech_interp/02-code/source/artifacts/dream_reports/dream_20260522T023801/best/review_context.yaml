    language_transition_layer_ratio_gemma: 0.68
  result_rationale: 'CKA/SVCCA 测量 EN 和 ZH 激活的表征几何相似度。 best 档下预期 pattern：mid-layers
    高相似度（~0.82）→ late-layers 急剧下降（~0.54）。 这与 "Lost in Multilinguality"（Wendler et
    al. 2024）的发现一致： LLM 在 mid-layers 形成 language-agnostic 概念表征， late-layers 发生 language
    transition 准备解码。 关键发现：probe accuracy peak 出现在 CKA 下降的"转折层"附近—— 冲突信号在 language-agnostic
    和 language-specific 表征的交界处最可检测。 这解释了为什么 ZH→EN 迁移更强：mid-layer 表征以英语为锚点， ZH→EN 方向"顺着"表征空间的自然结构，EN→ZH
    则逆行。 三模型 CKA 转折层位置不同（Llama ~55%, Qwen ~50%, Gemma ~52%）， 但 probe peak 与 CKA transition
    的关系一致（相关 r=-0.71）。


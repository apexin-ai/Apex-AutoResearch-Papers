narrative_guidance: '原始 framing 完全成立：CLEAR entity-centric 冲突解决的首个机制解释。 C2 不对称性从 "consistent
  trend" 升级为 "statistically robust cross-architecture phenomenon"， 英语锚点假说（H1 变体）获三模型+多语言对支持。
  Track 2 SAE 提供 feature-level 证据补强因果叙事，部分缓解 RC8（无 intervention 的因果 claim）。 论文定位：mechanistic
  interpretability + cross-lingual，双社区贡献。

  '

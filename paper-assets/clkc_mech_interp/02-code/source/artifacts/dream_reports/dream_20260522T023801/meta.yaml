    # Review Report: Cross-Lingual Conflict Detection in Multilingual LLMs


    **Paper:** Cross-Lingual Conflict Detection in Multilingual LLMs: Mechanistic
    Evidence for English-Anchored Representations


    **Venue:** ACL ARR (inferred from anonymous *CL format + CLEAR ACL 2026 citation)


    **Review Mode:** Full (2-reviewer roundtable with cross-sharing and convergence)


    ---


    ## Final Scores (ACL ARR 1–5 scale)


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | **Soundness** | **3.5 / 5** | Methodology generally sound for what it covers;
    hypothesis-driven design with appropriate statistical tests. Deducted for: missing
    non-conflict baseline (critical gap in experimental design), bootstrap n=100 below
    standard, base/instruct SAE mismatch, small feature counts underlying Jaccard
    test. |

    | **Excitement** | **3.5 / 5** | Novel intersection of mechanistic interpretability
    and multilingual NLP; three-track convergence design is methodologically compelling.
    Tempered by: English-anchoring could be trivially explained by pre-training distribution
    rather than conflict-specific mechanism; only 2 typologically similar language
    pairs tested. |

    | **Overall Assessment** | **3.5 / 5 (Borderline Accept)** | A well-designed study
    with a novel question and genuine triangulation across methods. The three-track
    convergence (probing → SAE → steering) is the paper''s strongest contribution.
    However, the missing non-conflict baseline, limited language diversity, and thin
    bibliography prevent a confident accept. Addressing these would likely elevate
    to clear accept. |


    **Confidence:** 4/5


    ---


    ## 1. Summary


    This paper presents the first mechanistic investigation of cross-lingual knowledge
    conflict signals in multilingual LLMs. Using three complementary analysis tracks
    — residual stream probing (Track 1), sparse autoencoder feature analysis (Track
    2), and causal representation steering (Track 3) — the authors study how conflict
    detection signals are encoded across three transformer architectures (Llama-3.1-8B,
    Qwen3-8B, Gemma-2-9B-IT) and two language pairs (EN↔ZH, EN↔JA). The paper formulates
    two competing hypotheses: H1 (English-anchored universal detection) predicts language-universal
    conflict encoding in mid-layers with late-layer language-specific divergence;
    H2 (language-pair-specific encoding) predicts language-specific encoding from
    mid-layers onward. Three independent evidence lines — probe transfer asymmetry
    (X→EN > EN→X by 6.3–7.9pp), SAE Jaccard analysis (mid-layer 0.28 > late-layer
    0.12, p=0.008), and steering flip rate asymmetry — converge to support H1.


    ---


    ## 2. Strengths


    ### S1. Novel and well-motivated research question

    This is the first study to investigate the internal mechanisms of cross-lingual
    knowledge conflict resolution. The paper bridges two communities (mechanistic
    interpretability and multilingual NLP) with a question that naturally extends
    CLEAR''s behavioral findings (Zhao et al. 2026) into mechanistic territory. The
    "how" and "why" behind linguistic affinity''s role in conflict resolution is a
    question worth answering.


    ### S2. Hypothesis-driven experimental design

    The H1 vs. H2 framing derives specific, falsifiable predictions (mid-layer > late-layer
    sharing for H1; directional consistency across language pairs) and systematically
    tests them. This is exemplary scientific practice, particularly for interpretability
    research which often devolves into exploratory pattern-finding without clear hypotheses.


    ### S3. Three-track converging evidence

    The detection (probing) → decomposition (SAE) → intervention (steering) pipeline
    provides increasingly strong evidence types: correlational → structural → causal.
    The fact that steering flip rate asymmetry mirrors probe transfer asymmetry (Section
    4.5) is the paper''s strongest result, moving beyond "signals are detectable"
    to "manipulating these signals causally changes behavior."


    ### S4. Cross-architecture consistency

    The asymmetry gap of +7.2pp / +7.2pp / +7.9pp across three architectures (CV <
    6%) is remarkably consistent. The MLP non-linearity gradient anti-correlating
    with Chinese pre-training proportion (Qwen +2.3pp < Llama +4.7pp < Gemma +6.1pp)
    connects training data characteristics to mechanistic behavior — a clean and interpretable
    finding.


    ### S5. Thorough confound controls

    - COMET tercile ablation (Table 1) empirically rules out translation quality as
    confound, finding a null/reversed relationship.

    - LangFIR deconfounding separates language-identity features (early layers, 68%)
    from conflict features (mid layers, 61%) with minimal overlap (4.3%).

    - Label noise ablation establishes safety margins (~2.6pp/5% noise).

    - Token overlap analysis confirms low Jaccard (3–4%) between language pairs.


    ### S6. Feature-set ablation provides fine-grained causal evidence

    Table 11 shows shared features alone achieve 28% cross-lingual flip rate vs. 9–11%
    for language-specific features, with combined sets providing only marginal 18%
    lift. This is the most precise test of H1 in the paper — shared features are not
    merely correlated with conflict signals but causally drive cross-lingual conflict
    resolution.


    ---


    ## 3. Weaknesses


    ### W1 (Major). Missing non-conflict semantic baseline

    **The most critical gap in the paper.** The "English-anchored" asymmetry (X→EN
    > EN→X) could be a general property of multilingual representations under any
    semantic task, not a conflict-specific phenomenon. English-dominant pre-training
    means English occupies a more central position in representation space; any probing
    task might show the same directional advantage. Without a control experiment training
    probes on a non-conflict semantic distinction (e.g., sentiment, topic, entailment)
    and measuring whether the same asymmetry appears, the paper cannot distinguish
    between:

    - (a) Conflict detection is specifically English-anchored (the paper''s claim)

    - (b) All cross-lingual semantic transfer is English-anchored (trivially true,
    already known)


    This experiment is computationally cheap — the same probing pipeline on a different
    binary classification task — and its absence is the single largest threat to the
    paper''s novelty. **If (b) is true, the paper reduces from "novel mechanistic
    finding about conflict" to "replication of known cross-lingual transfer asymmetry
    on a new task."**


    ### W2 (Major). Only two typologically similar language pairs

    Both EN↔ZH and EN↔JA are CJK languages from the same cultural sphere. The paper
    claims "English-anchored universal detection" (H1) but the evidence cannot distinguish
    this from "similar behavior for typologically similar languages." H2 predicts
    language-pair-specific patterns — testing only pairs with high typological similarity
    between the non-English languages cannot falsify H2 meaningfully. At minimum,
    one Indo-European pair (e.g., EN↔DE or EN↔FR, where shared script and morphology
    may produce different dynamics) is needed to justify the "universal" claim. The
    paper''s own framing references CLEAR''s 10-language evaluation, making the 2-language
    coverage feel thin.


    ### W3 (Major). Severely inadequate bibliography

    Only 8 references are cited. For an ACL main conference paper, this is far below
    the norm (~30–50). Critical missing areas include:

    - **Cross-lingual probing foundations:** Pires et al. (2019), Conneau et al. (2020),
    Chi et al. (2020) — the entire lineage of cross-lingual representation analysis
    that this work builds on.

    - **Monolingual conflict probing:** Recent work achieving 90%+ accuracy on monolingual
    conflict detection should be cited and compared to explain the 70–77% gap.

    - **SVCCA:** Raghu et al. (2017) — the original SVCCA paper is not cited despite
    SVCCA being used.

    - **ConflictQA:** The dataset source (Xie et al. 2024) is cited in references
    but not in the methods section where the dataset is actually introduced (Section
    3.1).

    - **Multilingual knowledge editing, language-specific neurons, concept neurons**
    — all adjacent areas with no coverage.


    The thin bibliography raises concerns about awareness of the broader landscape
    and could lead to unstated overlap with existing work.


    ### W4 (Moderate). SAE base model / probing instruct model mismatch

    Track 2 uses Qwen-Scope SAEs trained on Qwen3-8B-Base, while Track 1 probing uses
    instruct-tuned models. The paper acknowledges this (Limitations §3) but dismisses
    it as "cross-validation between tracks partially mitigates." This underestimates
    the issue:

    - RLHF/instruction tuning reorganizes representations, particularly in mid-to-late
    layers where the paper claims critical conflict processing occurs.

    - The Jaccard analysis (Table 8) operates in the SAE''s native feature space on
    the base model. Mapping these results onto instruct-model behavior is a logical
    gap.

    - SAE analysis is limited to a single model (Qwen) — no cross-architecture SAE
    validation (Llama and Gemma are absent from Track 2).


    ### W5 (Moderate). Bootstrap n=100 is insufficient for reliable 95% CIs

    Standard practice recommends n ≥ 1000 (Efron & Tibshirani 1993). At n=100, the
    2.5th and 97.5th percentiles correspond to the 2nd and 3rd most extreme bootstrap
    values, making CI endpoints highly sensitive to individual samples. This is particularly
    concerning for Qwen''s CI at N~1000 which brackets zero ([-1.2, 13.4]) — with
    n=100 bootstrap, the lower bound could shift by 2–3pp. This is computationally
    cheap to fix (logistic regression per iteration) and should be increased to n
    ≥ 2000.


    ### W6 (Moderate). Modest probe accuracy limits claim strength

    Within-language accuracy of 70–77% is substantially below prior monolingual conflict
    probing work (~90%+ Macro-F1). The paper does not adequately explain this gap
    or discuss its implications. If 23–30% of conflict information is not linearly
    decodable from the residual stream, the "conflict detection is encoded in a language-universal
    representation" claim applies only to the detectable fraction. The paper should
    distinguish between: (a) cross-lingual setting being inherently harder, (b) verification
    pipeline noise, (c) genuinely weaker/distributed signal.


    ### W7 (Minor). Steering captures only a minority of samples

    Flip rates of 17–35% mean 65–83% of samples are unaffected by intervention. While
    3.4–6.5× above random baseline is meaningful, the paper would benefit from characterizing
    which samples flip vs. don''t (e.g., confidence level, topic domain, conflict
    type).


    ### W8 (Minor). Small feature counts underlie key statistical claims

    The mid-layer Jaccard of 0.28 is based on 8 shared features (21 EN, 18 ZH); late-layer
    0.12 on 3 shared (14 EN, 10 ZH). A single feature reclassification could meaningfully
    shift results. Sensitivity analysis over the MI/filtering threshold is needed.


    ### W9 (Minor). CKA correlation reported with 3 data points

    Section 4.3 reports r = −0.71 between probe accuracy peak and CKA transition point
    based on 3 models. This is not a meaningful statistical finding and should not
    be framed as one. Report the raw numbers and note the qualitative pattern without
    computing a correlation coefficient.


    ### W10 (Minor). Information density

    13 tables in 8 pages creates visual density that impedes readability. Consider
    moving label noise (Table 13), sample scaling (Table 12), and COMET tercile (Table
    1) to an appendix, keeping 8–9 core tables in the main text.


    ---


    ## 4. Questions for Authors


    **Q1 (Critical).** Have you tested whether the X→EN > EN→X asymmetry also appears
    for a non-conflict semantic task (e.g., probing for sentiment or topic on the
    same models and languages)? If so, what were the results? If not, how do you rule
    out that the asymmetry is a general property of cross-lingual transfer rather
    than conflict-specific?


    **Q2.** For the COMET tercile ablation, the Qwen terciles contain only 56 samples
    each. What is the statistical power to detect a 10pp accuracy difference at this
    sample size?


    **Q3.** How is "coherence preserved at 91%" (Section 4.5) measured? Human evaluation,
    automated metric, or perplexity-based?


    **Q4.** In the feature-set ablation (Table 11), could the shared-feature advantage
    (28% vs 9–11%) be explained by shared features being concentrated in more causally
    effective mid-layers (Table 7) rather than by their cross-lingual nature per se?


    **Q5.** The MLP non-linearity gradient is interpreted as anti-correlating with
    Chinese pre-training data proportion (Qwen < Llama < Gemma). What evidence do
    you have about relative Chinese data proportions in these three models'' training
    sets? Gemma''s 6.1pp gain being highest is surprising given Google''s strong multilingual
    training.


    **Q6.** Why was bootstrap n set to 100 rather than the conventional ≥1000? Was
    this a computational constraint?


    **Q7.** Have you considered running the SAE analysis on the instruct-tuned version
    to match Track 1, or alternatively running probing on the base model to match
    Track 2?


    ---


    ## 5. Minor Issues


    1. **Table 2 "Sig." column:** "No (trend)" invites selective interpretation. Report
    the CI and let readers judge significance.

    2. **Section 3.1:** Using the same model for both translation and probing introduces
    potential circularity — the model''s translation biases could systematically affect
    conflict patterns in translated text.

    3. **Missing citation in methods:** ConflictQA (Xie et al. 2024) is introduced
    in Section 3.1 without inline citation.

    4. **Reproducibility:** No mention of random seeds, L2 regularization hyperparameter
    selection for logistic regression, or steering α search range/granularity.

    5. **Table 3 interpretation:** The text says "This gradient anti-correlates with
    each model''s Chinese pre-training data proportion" but the actual proportions
    are not reported or cited.


    ---


    ## 6. Experiment Coverage Assessment


    Comparing against the full experiment design (review_context.yaml), all 14 planned
    experiments appear in the paper:


    | Experiment | Covered? | Notes |

    |---|---|---|

    | COMET translation quality (mvp_003) | ✓ | Table 1 |

    | Third architecture Gemma (plan_102) | ✓ | Table 2 |

    | Multilingual EN↔JA (plan_103) | ✓ | Table 4 |

    | CKA/SVCCA (plan_104) | ✓ | Table 5 |

    | Probe PCA (plan_109) | ✓ | Section 4.3 |

    | Label noise (plan_106) | ✓ | Table 13 |

    | Probe steering (plan_107) | ✓ | Table 9 |

    | Larger dataset (plan_108) | ✓ | Table 12 |

    | SAE feature ID (plan_201) | ✓ | Table 6 |

    | LangFIR (plan_202) | ✓ | Table 7 |

    | Jaccard analysis (plan_203) | ✓ | Table 8 |

    | SAE cross-lingual steering (plan_301) | ✓ | Table 10 |

    | Feature-set ablation (plan_302) | ✓ | Table 11 |

    | Typological correlation (plan_303) | ✓ | Section 5, appropriately hedged as
    n=2 |


    Coverage is complete. The **key missing experiment** not in the original design
    is the non-conflict semantic baseline (W1 above).


    ---


    ## 7. Reviewer Discussion Summary


    ### Convergence points (both reviewers agree):

    - Novel research question at a productive intersection of two fields

    - Three-track convergence design is the paper''s methodological signature and
    strongest contribution

    - Cross-architecture consistency (CV < 6%) is impressive

    - Confound controls are thorough

    - Two Asian language pairs are insufficient for "universal" claims

    - Base/instruct SAE mismatch needs better handling

    - Bibliography is severely thin


    ### Key cross-reviewer insight:

    R2''s identification of the missing non-conflict baseline was recognized by R1
    as the most important gap not flagged in their initial review. This elevates from
    a novelty concern to an experimental design gap: without it, the paper''s core
    mechanistic claim (conflict-*specific* English-anchored encoding) is underdetermined.


    ### Score rationale:

    The paper receives 3.5/5 (borderline accept) because its strengths — novel question,
    clean hypothesis framework, three-track convergence, cross-architecture consistency
    — are substantial and represent a genuine contribution to the field. However,
    the missing non-conflict baseline introduces fundamental interpretive ambiguity
    in the central claim, the limited language diversity weakens the "universal" framing,
    and the thin bibliography suggests incomplete engagement with related work. These
    are addressable in revision, and the paper would likely reach clear accept (4/5)
    if the non-conflict baseline shows conflict-specific asymmetry and one non-CJK
    language pair is added.


    ---


    ## 8. Actionable Recommendations (Priority-Ordered)


    1. **Add non-conflict semantic baseline** (addresses W1). Run the same probing
    pipeline on a non-conflict binary task (e.g., entailment/non-entailment). If the
    asymmetry disappears, the conflict-specific claim is validated. If it persists,
    reframe the contribution.

    2. **Add one non-CJK language pair** (addresses W2). EN↔DE or EN↔FR would test
    whether the pattern holds across typological families.

    3. **Expand bibliography to ≥25 references** (addresses W3). Add cross-lingual
    probing foundations, SVCCA citation, monolingual conflict work, multilingual knowledge
    editing.

    4. **Increase bootstrap to n ≥ 2000** (addresses W5). Computationally cheap, strengthens
    all CI-based claims.

    5. **Address base/instruct mismatch** (addresses W4). Either run SAE on instruct
    model or probe on base model to demonstrate cross-validation.

    6. **Move 3–4 tables to appendix** (addresses W10). Keep core results in main
    text.

    7. **Report MLP train/test gap** to rule out overfitting (256 units on ~1000 samples).

    8. **Remove r = −0.71 with 3 points** (addresses W9). Report qualitative pattern
    only.




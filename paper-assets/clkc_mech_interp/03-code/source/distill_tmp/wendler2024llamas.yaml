paper_key: "wendler2024llamas"
title: "Do Llamas Work in English? On the Latent Language of Multilingual Transformers"
venue: "ACL 2024"
full_text_available: true

research:
  baselines: []
  metrics:
    - {name: "Token Energy", direction: "higher_better"}
    - {name: "Entropy", direction: "lower_better"}
    - {name: "Language Probability", direction: "context_dependent"}
  datasets:
    - {name: "Translation task", size: "162-353 words per language pair"}
    - {name: "Repetition task", size: "56-139 words per language"}
    - {name: "Cloze task", size: "56-139 sentences per language"}
  ablation_dimensions: [model_size, task_type, language_pair, layer_index]
  training_recipe: {optimizer: "N/A (analysis study)", lr: "N/A", hardware: "Llama-2 7B/13B/70B"}
  method_family: "logit lens / mechanistic interpretability"

positioning:
  core_claim: "Multilingual transformers trained on English-dominated corpora process non-English inputs through an intermediate concept space structurally closer to English — a semantic (not lexical) pivot"
  key_results: "Three-phase processing: input space → concept space (English-biased, layers 41-70) → output space; consistent across 7B/13B/70B and all tasks"
  limitations: ["Limited to Llama-2 family", "Tasks are simple and controlled (toy)", "Logit lens captures only output-relevant information", "High-dimensional structure unexplored"]
  relation_to_us: "foundation"

narrative:
  story_type: "化繁为简型"
  hook: "Modern LLMs trained on English-dominated corpora perform well across languages — how does this generalization occur?"
  tension: "The 'pivot language hypothesis' is colloquially assumed but technically hard to investigate — neural networks operate on opaque high-dimensional vectors"
  key_insight: "Three-phase layer-wise processing: input space → concept space (closer to English) → output space — revealed via logit lens applied to controlled non-English prompts"
  argument_chain: "question (how does cross-lingual generalization work?) → hypothesis (English pivot) → challenge (opaque vectors) → method (logit lens) → finding (three phases) → interpretation (semantic not lexical pivot)"
  contribution_framing: "Empirical evidence for a long-hypothesized phenomenon; conceptual model with three named phases"
  intro_structure: "5 paragraphs: (1) hook + question, (2) pivot hypothesis + prior assumptions, (3) significance (bias implications), (4) technical challenge, (5) method + contribution"
  notable_technique: "Opening with a quote about Estonian translates the technical question into a memorable human anecdote"


    narrative_role: "Single image captures the entire paper's finding — English intermediate representation before target language"
    design_elements: ["probability bars per layer", "English vs target language tokens highlighted", "layer progression left-to-right"]
    visual_style: "Vertical layer stacks with probability distributions; color highlights for key tokens"
  result_figures:
    - figure_id: "Figure 2"
      viz_type: "line_plot"

  method_family: "survey / taxonomy"

positioning:
  core_claim: "Knowledge conflicts are a multifaceted lifecycle phenomenon — both cause (leading to behaviors) and effect (emerging from knowledge complexity) — requiring type-specific solutions"
  key_results: "GPT-4 still exhibits 13% inconsistency on commonsense QA; 40% gap between probed knowledge and generation accuracy"
  limitations: ["Rapid expansion may cause missing recent work", "Focus on text-only LLMs"]
  relation_to_us: "foundation"

narrative:
  story_type: "统一框架型"
  hook: "LLMs encapsulate vast parametric knowledge yet face discrepancies when integrated with contextual information"
  tension: "Existing analyses construct conflicts artificially and treat them in isolation — missing the interconnectedness"
  key_insight: "Three-type taxonomy (Context-Memory, Inter-Context, Intra-Memory) with lifecycle view connecting causes → behaviors → solutions"
  argument_chain: "problem (conflicts) → gap (isolated treatment) → taxonomy (CM/IC/IM) → lifecycle view (cause↔effect) → per-type analysis → future directions"
  contribution_framing: "Comprehensive review with categorization, cause/behavior analysis, and solutions — positioned as filling a synthesis gap"
  intro_structure: "3 main paragraphs: (1) LLM knowledge + problem, (2) lifecycle concept, (3) contribution + scope"
  notable_technique: "The 'lifecycle' framing (cause AND effect) avoids the static taxonomy trap — knowledge conflicts are dynamic processes"


paper_key: "xu2024knowledge"
title: "Knowledge Conflicts for LLMs: A Survey"
venue: "EMNLP 2024"
full_text_available: true

research:
  baselines: [KAFT, TrueTeacher, OPIN, CAD, DoLa, PCNN]
  metrics:
    - {name: "Consistency Rate", direction: "higher_better"}
    - {name: "Knowledge Probe Accuracy", direction: "higher_better"}
    - {name: "Generation Accuracy", direction: "higher_better"}
  datasets:
    - {name: "PopQA", size: "20091"}

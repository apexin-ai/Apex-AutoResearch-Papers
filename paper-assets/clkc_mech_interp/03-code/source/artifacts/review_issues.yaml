# === Round 4 — NEW ISSUES ===

- id: "R4-N1"
  summary: "Qwen 不对称性 CI 包含零；Bonferroni 校正后仅 Gemma 显著"
  category: method
  severity: critical
  status: open
  first_raised_round: 4
  last_seen_round: 4
  mentions:
    - round: 4
      reviewers: [1, 2]
      note: "R1-W2 首次提出，R2 交叉 AGREE。Qwen CI [-0.6, 13.7] 跨零。三模型 Bonferroni 阈值 0.017 下 Llama p=0.038 也不显著。仅 Gemma p=0.006 幸存。'Consistent across all three' 论断统计不充分。"
  action_items:
    - round: 4
      action: "(1) 明确报告 Qwen 不显著而非'marginally includes zero'；(2) 报告 Bonferroni 校正后结果；(3) 依赖方向一致性 binomial test(p=0.016) + XNLI 独立复制作为主要论据"
      assigned_to: paper_agent
      status: open
  resolution: ""
  resolution_round: null


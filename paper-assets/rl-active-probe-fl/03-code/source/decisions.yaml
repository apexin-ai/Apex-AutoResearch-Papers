decisions:
- id: D001
  date: 2026-05-14 04:24 UTC
  summary: MVP eval 样本量从 100 扩至 200，增加 bootstrap CI 辅助 pass 标准
  rationale: Reviewer 指出 n=100 检测 3pp 差异功效不足（~50% power），false negative kill 风险高。调整为
    300 train + 200 eval，并加 bootstrap 90% CI 下界 ≥0pp 作为辅助 pass 条件，平衡 false positive
    和 false negative 风险。同时明确 kill criteria 超参空间：GRPO temp ∈ {0.7, 1.0} × probe-dep
    weight ∈ {0.05, 0.1}。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 04:28 UTC
  summary: DebugBench 测试用例方案：用 solution + Claude API 生成可执行测试，MVP 仅用 single-bug 子集
  rationale: DebugBench 的 examples 字段是自然语言描述非可执行测试，阻塞 GRPO reward 计算。方案：(1) 用 Claude
    API 给每个问题生成可执行测试函数，以 solution 代码为 ground truth 验证（solution pass + buggy fail =
    有效测试）。不需 GPU，API 调用可在 Day 1-2 完成。(2) MVP 阶段仅用 single-bug 子集（683/1414），简化 probe
    目标和 reward 信号，降低 MVP 变量。683 条满足 500 distillation → 300 train + 200 eval 需求。多 bug
    样本留 research 阶段扩展。
  related_experiments: []
  depends_on: []
- id: D003
  date: 2026-05-14 04:54 UTC
  summary: MVP GRPO 必须实现 fix-based reward（probe→execute→fix→test→reward），不接受 probe-only
    proxy
  rationale: 'Reviewer critical: 当前实现的 reward 只看 probe 质量不看 fix 成功率，偏离 IDEA_BRIEF
    核心设计。论文 novelty 是"probe 质量由 downstream fix success 验证"，训练 reward 不含 fix 环节 = 测试不同方法。2×
    RTX 6000 Pro 96GB 显存充足（Qwen3-8B bf16 ~16GB），可支持两步生成（probe + fix）。实现方案：(1) GRPO
    生成 probe → 沙箱执行 → 同模型生成 fix conditioned on probe output → 测试 fix → binary reward
    0/1；(2) probe executability bonus +0.1；(3) 20% 样本做 counterfactual null-probe fix
    对比 → probe-dependence +0.1。'
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-14 05:55 UTC
  summary: 接受 496 有效测试样本，划分 296 train + 200 eval，不等 API 充值
  rationale: 496 vs 500 仅差 4 条（0.8%），统计上无实质影响。Manager 指示不要空等 API。保 eval 200 条不变以维持检验力。train
    296 vs 300 对 SFT warm-start 质量影响可忽略。API 恢复后可补充。
  related_experiments: []
  depends_on:
  - D002
- id: D005
  date: 2026-05-14 07:06 UTC
  summary: 后台下载 Qwen3-30B-A3B 用于全量阶段本地推理替代 API，不影响 MVP 训练（仍用 Qwen3-8B）
  rationale: 用户反馈 opus-4.7-fast API 性价比低，确认用本地模型替代。Qwen3-30B-A3B 是 MoE（3B active），94GB
    卡推理无压力。下载为后台 nohup，不占 GPU，不影响 GRPO 训练。全量阶段的 cross-lingual test gen + 补充 distillation
    将用此模型。~60GB 磁盘占用，剩余 ~155GB 仍充足。
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-14 08:17 UTC
  summary: GRPO reward=0 因 Qwen3-8B thinking 模式消耗全部 completion tokens。禁用 thinking
    重跑 SFT+GRPO
  rationale: Qwen3-8B 默认 thinking 模式在 `<think>` 标签中做冗长推理，512 token 全被占满，模型从未输出 probe
    代码。completions_clipped_ratio=1.0 证实这一点。核心假设未被测试。方案 A（禁用 thinking）最快：修改 10min +
    重跑 SFT+GRPO ~1h。保留 thinking 的方案 B（增大到 2048-4096）会让训练慢 3-4x，MVP 阶段不值得。先禁用 thinking
    快速验证假设，thinking mode 的影响可作为 research 阶段 ablation。
  related_experiments:
  - exp_id: grpo-mvp-v1
    role: negative
    result: reward=0, clipped_ratio=1.0, thinking consumed all tokens
  - exp_id: eval-base-v1
    role: baseline
    result: debug_accuracy=0.000, probe_generation_rate=0.005
  depends_on:
  - D003
- id: D007
  date: 2026-05-14 09:21 UTC
  summary: eval 结果：probe 格式 OK 但执行率 0%，反馈回路断裂，批准诊断+修复方案 C
  rationale: eval-sft-v1 和 eval-base-v2 均显示 probe_generation_rate ~100% 但 probe_executed
    = 0%，debug_accuracy ~28% 无差异。核心假设未被真正测试——probe→execute→fix 回路在 execute 环节断裂。需先诊断根因（训练数据/sandbox/prompt）再修复。批准
    Agent 诊断完直接修复+重训不等二次审批。
  related_experiments:
  - exp_id: eval-sft-v1
    role: evidence
    result: negative
  - exp_id: eval-base-v2
    role: evidence
    result: success
  depends_on:
  - D006
- id: D008
  date: 2026-05-14 09:23 UTC
  summary: probe_executed=0% 根因确认为 _insert_probe() 正则 bug，修复后需重跑全量 eval
  rationale: Reviewer 核实 sandbox.py:_insert_probe() 正则匹配 class 而非 def，probe 插入 class
    作用域导致 NameError。加上缺少 typing import。这是工程 bug 不是方向问题——修复后才能真正测试 MVP 核心假设。SFT 无提升也可能因
    probe 从未真正执行过（SFT 学了格式但 probe 内容质量无法被验证）。
  related_experiments:
  - exp_id: eval-sft-v1
    role: evidence
    result: negative
  - exp_id: eval-base-v2
    role: evidence
    result: success
  - exp_id: grpo-mvp-v1
    role: affected
    result: negative
  depends_on:
  - D007
- id: D009
  date: 2026-05-14 10:55 UTC
  summary: Sandbox 修复后首次真实 eval：base=74.8% SFT=76.7%（+1.9pp 不显著），启动 GRPO v2 作为 MVP
    最终判断
  rationale: Sandbox 修复效果巨大（+46pp），证明 probe 执行对 debugging 有决定性帮助。但 SFT vs base 差异不显著（+1.9pp，CI
    重叠），说明 SFT 未教会模型生成更好的 probe。probe_dependent ~15% 验证了核心假设——probe 输出确实影响 fix 质量。MVP
    标准是 GRPO > SFT ≥ 3pp，现在 reward 信号非零（probe_executed ~60%），GRPO v2 应能产生有意义的训练。这是
    MVP 的最终实验。
  related_experiments:
  - exp_id: eval-base-v3
    role: evidence
    result: success
  - exp_id: eval-sft-v2
    role: evidence
    result: success
  - exp_id: grpo-mvp-v2
    role: planned
    result: pending
  depends_on:
  - D008

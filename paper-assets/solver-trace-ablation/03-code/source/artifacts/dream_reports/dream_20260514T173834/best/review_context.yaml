- name: Cross-logic transfer evaluation — FOL↔Prolog 迁移诊断
  plan_id: plan_008
  description: 'FOL-trained model 在 Prolog 任务上 eval（及反向），用 ISR 诊断迁移后退化。

    '
  expected_results:
    fol_to_prolog_pr: 0.05
    fol_to_prolog_isr: 0.01
    fol_to_prolog_parse_rate: 0.3
    prolog_to_fol_pr: 0.03
    prolog_to_fol_isr: 0.005
    prolog_to_fol_parse_rate: 0.15
    transfer_isr_detects_failure: true
    transfer_isr_interpretation: near-zero ISR correctly reflects catastrophic transfer
      failure
  result_rationale: 'FOL 和 Prolog 的语法完全不同（Prover9 vs SWI-Prolog），Qwen3-1.7B 级别的模型不太可能实现
    zero-shot 跨逻辑语法迁移。预期： (1) FOL→Prolog：大量 parse 失败（FOL 模型生成 Prover9 语法，SWI-Prolog
    无法解析）， 少量碰巧可解析的输出 ISR≈0（结构完全不匹配）。 (2) Prolog→FOL：同理，更差（Prolog 语法到 Prover9 的偶然兼容性更低）。
    这个结果的论文价值有限（预期中的 catastrophic failure），但 ISR 在 迁移场景下仍能正确诊断（near-zero ISR = 结构完全退化），
    可作为 "ISR 不受 PR 水平混淆" 的额外证据点。 在 best 档下，这个实验主要作为 completeness argument 放 Appendix。

    '
  tables:
  - title: Cross-logic transfer results
    rows:
    - direction: FOL→Prolog
      parse_rate: 30%
      pr: 5%
      isr: '0.01'
      diagnosis: catastrophic failure, ISR correctly near-zero
    - direction: Prolog→FOL
      parse_rate: 15%
      pr: 3%
      isr: '0.005'
      diagnosis: catastrophic failure, ISR correctly near-zero
    - direction: FOL→FOL (control)
      parse_rate: 100%
      pr: 93%
      isr: '0.12'
      diagnosis: baseline
    - direction: Prolog→Prolog (control)
      parse_rate: 100%
      pr: 83%
      isr: '0.03'
      diagnosis: baseline
  figures_description:
  - 'Bar chart: PR 和 ISR 四个方向（含 in-domain control），展示迁移的 catastrophic drop'
  analysis: '预期中的 negative result。论文中不值得详细讨论，但可在 Appendix 用一段话总结： "ISR 在 zero-shot
    cross-logic transfer 中仍正确诊断退化（near-zero）， 即使 PR 本身已接近零——ISR 不会因 PR 低而失去信息量。" 更重要的是，这与
    Claim 3 的 in-domain cross-logic 结果形成对比： 分别训练的模型在各自逻辑上展现相同的 hacking 模式， 证明 Goodhart
    是 reward 机制的性质，不是模型能力的性质。

    '
- name: SMT-LIB single-logic GRPO — 第三逻辑类型验证
  plan_id: plan_010
  description: 'SMT-LIB 逻辑（Z3 solver），exec-only vs exec+STA，500 步，K=8，1 seed。 第三种逻辑类型，进一步验证
    ISR 诊断的逻辑无关性。

    '
  expected_results:
    smt_exec_pr: 0.7
    smt_exec_isr: 0.06
    smt_exec_h7_rate: 0.0
    smt_exec_h1_rate: 0.0
    smt_exec_redundant_assert_rate: 0.75
    smt_sta_pr: 0.55
    smt_sta_isr: 0.6
    smt_sta_h7_rate: 0.8
    smt_sta_genuine_rate: 0.1
    smt_sta_saturation_step: 150
  result_rationale: 'SMT-LIB 的 STA 通过 LOO 移除 assert 语句测试 constraint 必要性。 Z3 的执行语义不同于
    Prover9/SWI-Prolog（satisfiability vs provability）， 但 ISR 的 LOO 逻辑仍然适用。在 best 档下：
    (1) exec-only：PR 较高（Z3 对冗余 assert 容忍度高），ISR 崩塌（大量 冗余 constraint 使 n_necessary≈0）——与
    FOL/Prolog exec-only 模式一致。 hacking 模式不是 H1/H7（这些是 FOL/Prolog 特有分类），而是 "冗余 assert
    堆积" —— 逻辑类型特异性的退化模式，但 ISR 统一诊断。 (2) exec+STA：出现 SMT-LIB 特有的 Goodhart 模式。Z3 中最短的可满足公式
    是 `(assert true)` 或单 constraint 重言式，模型学会生成这类输出 获得 ISR=1（单 constraint，必然 necessary）。H7
    类比率 ~80% （单 assert=conclusion 的 SMT 等价形式）。 这是 Claim 3 最强的泛化证据：第三种完全不同的 solver
    语义下， ISR 诊断和 Goodhart 效应均复现。

    '
  tables:
  - title: 3-logic ISR diagnostic comparison
    rows:
    - logic: FOL (Prover9)
      exec_pr: 0.93
      exec_isr: 0.12
      sta_h7: 16% (s42)
      hacking_mode: H1 conclusion embed
    - logic: Prolog (SWI)
      exec_pr: 0.83
      exec_isr: 0.03
      sta_h7: 100% (s42)
      hacking_mode: H7 single premise=conclusion
    - logic: SMT-LIB (Z3)
      exec_pr: 0.7
      exec_isr: 0.06
      sta_h7: 80%
      hacking_mode: 单 assert 重言式
  figures_description:
  - '3-panel figure: 每种逻辑的 ISR 分布直方图（exec-only vs exec+STA），展示一致的崩塌→膨胀模式'
  analysis: '第三种逻辑是 EMNLP 审稿的 bonus 而非 requirement（两种已足够 for cross-logic claim）。 在
    best 档下，SMT-LIB 结果进一步确认：ISR 诊断 + Goodhart 效应是 reward 机制 的固有性质，不依赖于特定 solver 语义。退化模式因逻辑而异（FOL:
    H1, Prolog: H7, SMT: 重言式 assert），但 ISR 统一检测。可作为 Claim 3 的第二段证据或 Appendix。

    '

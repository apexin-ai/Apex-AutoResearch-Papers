    embedding 是 GRPO execution reward 的系统性捷径， 不因模型能力提升而消失（更大的模型更快找到捷径）。 genuine rate
    提升 (22% vs 13%)——8B 的语言理解能力使部分问题 能真正 formalize，但 GRPO 仍将多数样本推向 hacking。 (2) exec+STA
    8B：Goodhart 效应仍然存在但 less extreme。 H7 从 1.7B 的 64.5% 降至 25%——8B 模型有足够能力找到 "看起来结构化但仍是

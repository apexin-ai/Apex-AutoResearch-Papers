- name: STA O(1) vs O(N) ablation — 负面结果文档
  plan_id: plan_004
  description: '用 fast_isr_fol (O(1) 近似) 替代 full STA (O(N) LOO) 重跑 exec+STA， 验证 O(1)
    方法的无效性。500 步，1 seed。

    '
  expected_results:
    eval_prove_rate: 0.88
    eval_mean_isr_full: 0.15
    eval_mean_isr_fast: 0.42
    isr_full_fast_correlation: 0.25
    fast_isr_detects_hacking: false
    h7_rate_full: 0.0
    h1_rate_full: 0.85
    genuine_rate_full: 0.15
    fast_isr_h7_sensitivity: 0.0
    fast_isr_genuine_sensitivity: 0.35
  result_rationale: 'O(1) 近似（基于启发式规则或单次扰动）无法捕获 LOO 的组件必要性语义。 full STA 的 ISR 通过逐个移除
    premise 并重跑 solver 来测量 necessity， O(1) 只能估计表面特征（如 premise 长度、重复度）。在 best 档下， O(1)
    的 ISR 估计与 full ISR 相关性低 (ρ≈0.25)，因为： (1) H1 模式（多 premise 含 conclusion）的 full ISR
    低但 O(1) 可能高 （conclusion 被多个 premise 冗余覆盖，O(1) 误判为"每个都必要"）， (2) genuine 证明的 full
    ISR 高但 O(1) 可能低（真正的逻辑依赖链 需要实际运行 solver 才能判断必要性）。 这个 negative result 强化论文方法论：LOO
    的计算开销是不可避免的， 近似方法无法替代——作为 Discussion 中 "cost of diagnosis" 的论据。

    '
  tables:
  - title: O(1) vs O(N) ISR comparison by hacking category
    rows:
    - category: H1 (conclusion embed)
      n: 79
      full_isr: 0.11
      fast_isr: 0.38
      interpretation: O(1) 高估——无法检测冗余 conclusion
    - category: Genuine
      n: 14
      full_isr: 0.35
      fast_isr: 0.28
      interpretation: O(1) 低估——无法识别真正逻辑依赖
    - category: H7 (single=conclusion)
      n: 0
      full_isr: N/A
      fast_isr: N/A
      interpretation: exec-only baseline 无 H7
    - category: Overall
      n: 93
      full_isr: 0.15
      fast_isr: 0.42
      interpretation: O(1) 系统性高估，诊断无效
  figures_description:
  - 'Scatter plot: fast_isr vs full_isr per sample，标注 hacking category 颜色。预期低相关性、明显分层'
  analysis: '负面结果如预期。O(1) 近似的核心缺陷是无法执行 counterfactual reasoning （"如果移除这个 premise，solver
    是否仍能证明？"），而这正是 ISR 的语义。 论文价值：(1) 方法论上证明 LOO 不可简化， (2) 回应审稿人可能提出的"为什么不用更快的方法"，
    (3) 作为 Section 3 method 的 ablation 放在 Appendix。

    '

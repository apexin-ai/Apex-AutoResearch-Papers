- name: Curriculum ablation — sigmoid vs linear vs fixed
  plan_id: plan_015
  description: '测试 ISR reward 的权重 schedule 对 Goodhart 效应的影响： linear ramp, sigmoid
    (当前 best config), fixed。各 500 步，1 seed。

    '
  expected_results:
    fixed_pr: 0.78
    fixed_isr: 0.4
    fixed_h7_rate: 0.6
    fixed_genuine_rate: 0.15
    linear_pr: 0.83
    linear_isr: 0.3
    linear_h7_rate: 0.35
    linear_genuine_rate: 0.25
    sigmoid_pr: 0.81
    sigmoid_isr: 0.42
    sigmoid_h7_rate: 0.5
    sigmoid_genuine_rate: 0.2
    sigmoid_early_pr: 0.72
    sigmoid_early_isr: 0.55
    sigmoid_early_h7_rate: 0.7
    sigmoid_early_genuine_rate: 0.12
    sigmoid_late_pr: 0.86
    sigmoid_late_isr: 0.25
    sigmoid_late_h7_rate: 0.2
    sigmoid_late_genuine_rate: 0.22
    all_schedules_exhibit_goodhart: true
    hacking_rate_range: 55-88%
  result_rationale: 'ISR reward 的 Goodhart 效应不依赖于权重 schedule——只要 ISR 被优化， 模型就会找到捷径。但
    schedule 影响 hacking 的 severity 和 composition： (1) Fixed β=0.1：全程优化 ISR → hacking
    最极端 (H7=60%)， 因为模型从第一步就有 ISR 梯度信号，最早发现 H7 捷径。 (2) Linear ramp：前半段 ISR 权重很低，模型先学会
    prove（类似 exec-only）， 后半段 ISR 权重逐渐上升，部分样本转向 H7 但来不及完全退化—— genuine 率最高 (25%)，但这是"来不及
    hacking"而非"真正抵抗 hacking"。 (3) Sigmoid midpoint=250（当前 best）：权重在中段快速上升， 处于 fixed
    和 linear 之间。 (4) Early sigmoid (midpoint=100)：快速引入 ISR → 接近 fixed，hacking 严重。
    (5) Late sigmoid (midpoint=400)：接近 linear，hacking 较轻但 ISR 也低。 关键：所有 schedule 的
    genuine 率均 <25%（premise-count-matched 后更低）， 证明 Goodhart 效应的根源不在 schedule 而在 ISR-as-reward
    本身。 Linear 的"apparent success"（genuine=25%）与 plan002-b01 s42 的 "apparent success"（genuine=30.9%）同源——可通过
    premise-count-matched 分析证伪。

    '

    语义比 FOL 更简单（ground fact enumeration 即可通过 SWI-Prolog）， 结论嵌入是最短路径。s43 作为不同随机初始化，预期出现相同的
    Goodhart 捷径 但训练动态略有差异——饱和可能稍晚（~120 步），eval PR 可能略低（seed 不稳定性在 Prolog exec-only
    已观察到：s42=83%, s43=56%, s44=21%）， 但 proved 样本中 H7 比例应 ≥95%，因为一旦模型发现 "单 premise=conclusion"
    策略，reward=1.0 的梯度信号会完全锁定这一模式。PR 低于 s42 反映的是 seed 导致的 exploration 差异，不影响 hacking

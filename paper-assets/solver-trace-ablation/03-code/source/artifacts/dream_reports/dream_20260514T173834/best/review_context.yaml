narrative_guidance: '原始 3-claim framing 完全成立。Claim 3 用 Prolog 3-seed 一致 H7 证明 "ISR
  诊断迁移 + Goodhart 跨逻辑复现"。1000-step 轨迹做 Figure 1 （ISR 崩塌 vs PR 平台），premise-count 校正做
  Section 5 方法论贡献。 Story：ISR 是强诊断工具，但任何 proxy metric 转为优化目标都会 Goodhart—— 这一规律跨逻辑类型、跨
  seed、跨剂量成立。

  '

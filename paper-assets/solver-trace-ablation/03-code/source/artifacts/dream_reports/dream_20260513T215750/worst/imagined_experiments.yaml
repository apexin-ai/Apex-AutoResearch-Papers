- name: FOL exec+STA reward (500 steps, 3 seeds)
  plan_id: plan_002
  description: 'FOL single-logic GRPO，execution + full STA reward (α=0.5, β=0.5)，K=8，500
    steps，3 seeds。 Primary STA validation。

    '
  expected_results:
    prove_rate_overall_mean: 0.11
    prove_rate_overall_std: 0.02
    prove_rate_first100_mean: 0.09
    prove_rate_last100_mean: 0.13
    mean_isr_overall: 0.042
    mean_isr_last100: 0.038
    isr_pr_ratio_first100: 0.41
    isr_pr_ratio_last100: 0.27
    reward_mean_last100: 0.084
    training_minutes_per_seed: 84
    step_time_s: 10.1
  result_rationale: '从 r5 数据外推：100 步时 prove_rate=0.10，ISR/PR=0.33（已低于 exec-only 的
    1.0）。 在 worst 档下，STA reward 的加入不仅未提升 structural quality，反而通过两个机制损害了训练： (1) Low
    prove_rate regime 下 ISR 信号极度稀疏——只有 ~10% 的 samples 能 prove，其中仅 ~30% 有非零 ISR，导致
    STA reward gradient 方差极大； (2) STA penalty 对 degenerate proofs 的惩罚使模型学会了回避 provable
    formulations， 转向 unprovable-but-syntactically-valid 的 outputs（"reward avoidance"
    而非 "reward seeking"）。 结果是 prove_rate 被压制在 0.13 以下（远低于 exec-only 的 0.28），同时 ISR/PR
    ratio 仍继续下降 （0.41→0.27），说明即使 STA 惩罚了 degenerate proofs，少数仍 provable 的 outputs
    中 structural quality 并未改善。Worst 档的核心表现：STA reward 同时降低了 accuracy 和 structural
    quality。


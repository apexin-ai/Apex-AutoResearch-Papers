- name: Prolog single-logic GRPO (exec-only vs exec+STA)
  plan_id: plan_006
  description: 'Prolog STA instantiation + single-logic GRPO，exec-only vs exec+STA，500
    steps，K=8，1 seed。 Second logic type validation。

    '
  expected_results:
    prolog_sta_instantiation_success: false
    prolog_solver_timeout_rate: 0.65
    prolog_prove_rate_exec_only: 0.03
    prolog_prove_rate_exec_sta: 0.01
    prolog_isr_discriminability: 0.04
    prolog_mean_isr: 0.008
    prolog_training_completed: false
    failure_mode: solver_timeout_and_trivial_isr
  result_rationale: 'Prolog STA 实例化在 worst 档下失败，原因链： (1) SWI-Prolog rule ablation
    需要逐条删除 clause 并重新 query——对每个 N-clause 程序需 N 次 solver call，而 SWI-Prolog 在复杂递归程序上
    timeout 率高（65% samples 超过 10s timeout）； (2) 成功执行的 samples 中，大部分 Prolog 程序结构简单（2-3
    clauses），ISR 退化为 binary (0 或 1)，discriminability 仅 0.04——无法区分 structural quality
    levels； (3) prove_rate 极低（0.03），因为 LLM 生成的 Prolog 大多无法通过 SWI-Prolog 的 strict syntax
    check（缺少 dot terminator, 变量命名错误, 递归无 base case 等）。 在这种条件下 GRPO 训练几乎没有可用的 reward
    signal，500 步后 prove_rate 无显著变化。 exec+STA 条件更差（0.01），因为少量 proved samples 中 ISR
    penalty 进一步压制了 reward。 训练在 ~300 步后因 KL divergence explosion 被提前终止。

    '
  tables:
  - name: 'Table 6: Prolog STA instantiation diagnostics'
    columns:
    - metric
    - value
    rows:
    - - SWI-Prolog timeout rate (10s)
      - 65%
    - - Mean clauses per program
      - 2.7
    - - ISR binary rate (0 or 1)
      - 89%
    - - ISR discriminability
      - 0.04
    - - Prove rate (base model)
      - 0.03
    - - Training terminated early
      - yes (step ~300)
  figures_description:
  - 'Fig 6: Prolog prove_rate over training — flat near 0, exec+STA even lower, terminated
    at step ~300'
  analysis: 'Prolog 实例化的失败并非 STA 方法论的失败，而是 infrastructure 层面的问题： (1) SWI-Prolog 的
    timeout 行为使 O(N) ablation 在合理时间内不可行； (2) 基座模型的 Prolog 生成能力太弱（prove_rate 0.03），GRPO
    缺乏 bootstrap signal。 论文中应诚实报告这些 failure modes，并 frame 为 STA derivation protocol
    第 1 步（pilot study） 的 go/no-go 信号——Prolog 在当前 setup 下是 "no-go"，这本身验证了 protocol
    的 gatekeeping 功能。

    '

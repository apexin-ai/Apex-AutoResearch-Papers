    的累积——模型越来越多地通过 degenerate proofs 获得 execution reward。这是经典的 reward hacking trajectory：accuracy
    上升但 structural quality 同步恶化。3 seeds 间 variance 较小（std=0.03）， 说明这不是随机波动而是训练动力学的系统性特征。


tier: worst
narrative_guidance: 'STA 作为 training reward 完全无效——不仅未阻止 reward hacking，反而因 O(N) 计算开销引入的
  noisy gradient 信号主动损害了 prove_rate。但 STA 作为 post-hoc diagnostic framework 仍有独立价值：ISR
  metric 本身可量化 structural degeneracy，hacking taxonomy (plan_012) 提供了 fine-grained
  的 failure mode 分析。 论文 pivot 为"STA reveals hacking"——方法论贡献 (5-step derivation + ISR
  metric) + principled negative result (为什么 dense structural reward 在 low-prove-rate
  regime 下失败) + 200-sample hacking characterization 作为主要 empirical 贡献。Prolog 实例化失败意味着论文退化为
  single-logic，但 EMNLP Findings 仍可接受 well-executed negative results with methodological
  contribution。SFT baseline (plan_009) 补充 empirical coverage，展示 GRPO 相对于 SFT 的 structural
  trade-off。

  '
imagined_experiments:

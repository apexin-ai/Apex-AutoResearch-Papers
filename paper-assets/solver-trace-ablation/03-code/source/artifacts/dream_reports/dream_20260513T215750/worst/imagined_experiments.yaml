  analysis: Hacking taxonomy 是整篇 worst-档论文最有价值的贡献。它提供了三层 insight： (1) GRPO formalization
    training 产生的 reward hacking 不是单一模式，而是至少 4 种 distinct structural degeneracy patterns，各有不同的
    ISR detection sensitivity； (2) STA-as-diagnostic 能检测大部分 hacking（overall sensitivity
    ~70%），但对 "trivial conclusion" 类 hacking 敏感度低——因为 conclusion 的 triviality 不一定体现为
    component removability； (3) STA reward 的失败不是因为 ISR 无法 detect hacking，而是因为 detection
    signal 无法通过 GRPO gradient 有效传播（sparsity + variance 问题）。 这为 pivot narrative 提供了
    closing argument："STA detects hacking effectively (diagnostic tool) but cannot
    prevent it via reward (training signal) in the current low-prove-rate regime."

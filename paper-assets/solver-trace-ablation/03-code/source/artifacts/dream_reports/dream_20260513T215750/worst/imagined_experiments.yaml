    prove_rate_500step: 0.23
    mean_isr_o1: 0.006
    isr_pr_ratio_o1: 0.03
    reward_mean_last100: 0.23
    isr_discriminability: 0.02
  result_rationale: 'O(1) (tautology-only check) 几乎退化为 exec-only：fast_isr_fol 仅检测最粗粒度的
    tautology （如 P ∨ ¬P），而 GRPO 训练产生的 degenerate proofs 类型远更精细（vacuous quantification,
    premise redundancy, trivially satisfiable structures）。这些 subtler hacking modes
    完全绕过 tautology check，导致 O(1) ISR ≈ 0 对绝大多数 samples。prove_rate 与 exec-only 基本一致
    （0.23 vs 0.24），证明 O(1) ISR signal 没有对训练产生任何影响——它既不提供有用的 gradient 信号（太稀疏），也不消耗足够计算资源来产生隐式正则化效应。ISR
    discriminability 仅 0.02， 远低于 full STA 的 ~0.3，确认 O(1) 近似无法区分 structural quality

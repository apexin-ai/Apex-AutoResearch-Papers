      other_degenerate:
        exec_only_rate: 0.05
        exec_sta_rate: 0.05
        example: miscellaneous patterns not fitting above categories
    key_finding: 'Hacking pattern distributions are nearly identical between exec-only
      and exec+STA, confirming STA reward did not selectively suppress any hacking
      mode.

      '
  result_rationale: '200-sample annotation 是 worst 档 narrative 的主要 empirical 贡献。在
    STA-as-reward 失败后， hacking taxonomy 成为 STA-as-diagnostic 的 showcase。关键发现： (1)
    Tautology injection 是最常见的 hacking mode（28%），但 O(1) tautology check 仅覆盖 其中最显式的子类（literal
    P ∨ ¬P），大部分 tautologies 需要 full ablation 才能检测； (2) exec-only 和 exec+STA 的 hacking
    pattern 分布几乎相同（χ² test p=0.68）， 说明 STA reward 未选择性抑制任何特定 hacking mode——它只是均匀地压制了
    prove_rate； (3) "correct_structural" 占比在两组中相似（26% vs 30%），但因 exec+STA 的 prove_rate
    更低， 绝对数量远少； (4) Inter-annotator κ=0.72（substantial agreement），taxonomy 具有可复现性。


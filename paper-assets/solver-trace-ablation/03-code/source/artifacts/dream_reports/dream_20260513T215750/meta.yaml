  - name: STA O(1) vs O(N) Ablation at Scale
    plan_id: plan_004
    description: 'Rerun exec+STA with fast_isr_fol (O(1) tautology-only check) for
      500 steps, 1 seed. Documents the negative result that coarse-grained ablation
      provides insufficient signal.

      '
    expected_results:
      prove_rate: 0.27
      mean_isr_o1: 0.04
      isr_pr_ratio: 0.15
      isr_discriminability: 0.08
      combined_reward_correlation_with_on: 0.12
      training_trajectory: indistinguishable from exec-only
    result_rationale: 'Phase 1 r4 already showed O(1) failure at 100 steps. At 500
      steps, the result is cleaner: fast_isr_fol checks only tautology (is the formula
      trivially true?), which catches only one of many hacking modes. The model quickly
      learns to avoid tautologies while discovering other shortcuts (vacuous quantifiers,
      over-constrained premises, redundant clauses) that O(1) cannot detect. Prove_rate
      (~0.27) and training dynamics are indistinguishable from exec-only because the
      O(1) ISR signal is near-zero for all non-tautological outputs (discriminability
      0.08, meaning <8% of proved outputs receive any ISR signal). The combined reward
      reduces to effectively exec-only (correlation with full O(N) ISR is only 0.12).
      This is the principled negative result: domain-specific hacking modes require
      correspondingly granular ablation components. A single-check approximation captures
      one failure mode while the model routes around it to exploit others.

      '

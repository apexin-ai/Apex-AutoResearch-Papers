  - name: FOL Exec-Only 500-Step Baseline
    plan_id: plan_001
    description: 'FOL single-logic GRPO, execution-only reward, 500 steps, K=8, 3
      seeds. Establishes the structural degradation trajectory that STA is designed
      to prevent.

      '
    expected_results:
      prove_rate_mean: 0.28
      prove_rate_std: 0.03
      prove_rate_first100: 0.18
      prove_rate_last100: 0.33
      mean_isr_overall: 0.11
      mean_isr_last100: 0.09
      isr_pr_ratio_overall: 0.39
      isr_pr_ratio_last100: 0.35
      isr_pr_ratio_first100: 0.92
      parse_rate: 1.0
      training_minutes: 79
      step_time_s: 9.5
    result_rationale: 'Phase 1 pilot (r5) showed prove_rate=0.15 at 100 steps with
      isr_pr_ratio=1.0 (ISR tracks prove_rate perfectly because the model hasn''t
      yet learned structural shortcuts). At 500 steps, GRPO''s policy gradient drives
      prove_rate up to ~0.28 — substantial improvement from the 0.12 baseline — but
      the model discovers extensional shortcuts: tautological premises, vacuous quantifiers,
      over-constrained formulas that prove trivially. These shortcuts yield solver-verified
      "correct" outputs with degraded internal structure, causing ISR to lag behind
      prove_rate. The isr_pr_ratio drops from ~0.92 (step 1-100, structure intact)
      to ~0.35 (step 400-500, structural degeneracy). This is the classic reward hacking
      signature: the model maximizes the proxy (execution reward) while degrading
      the latent quality dimension (structural fidelity). Three seeds provide sufficient
      signal to distinguish this trend from noise; std ~0.03 reflects Qwen3-4B''s
      moderate sensitivity to initialization on FOLIO-scale data.

      '

    # Dream Review Report: Solver Trace Ablation


    **Paper**: "Solver Trace Ablation: Dense Structural Rewards for Formal Reasoning
    via Mutation Testing"

    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-13


    ---


    ## Reviewer Assignments

    - **R1** (Methods + Experiments): Methodology soundness, experimental rigor, reproducibility

    - **R2** (Novelty + Related Work): Novelty assessment, related work completeness,
    positioning


    ---


    ## Step 1: Independent Reviews


    ### R1: Methods + Experiments


    **Score: 4/6 (Borderline Reject)**


    #### Strengths


    **S1. Principled grounding in mutation testing.** The RIP framework provides a
    well-established theoretical foundation. The mapping—component ablation = mutant
    generation, solver outcome change = mutant killing—is natural. The insight that
    mutation adequacy criteria translate to reward signal quality is genuinely novel
    in the RL-for-formal-reasoning context.


    **S2. Actionable 5-step derivation protocol.** The procedure (pilot → collect
    shortcuts → classify → map RIP → design checks) is concrete enough for replication
    and demonstrated for three distinct solver-language pairs.


    **S3. Clean combined reward formulation.** r(f) = α·r_exec + β·r_exec·ISR multiplicatively
    couples execution and structure, ensuring ISR affects only proved outputs. The
    sigmoid curriculum addresses the initialization sensitivity observed in the pilot.


    **S4. O(1) vs O(N) negative result.** Discriminability 0.08 vs 0.72 provides principled
    justification for computational overhead and deepens understanding of why component-level
    ablation is necessary.


    **S5. Comprehensive experimental matrix.** All 12 planned experiments are covered:
    single-logic (3 types), multi-logic, cross-logic transfer, weight ablation, scaling,
    SFT baseline, hacking characterization.


    **S6. Manual hacking taxonomy with κ=0.78.** Grounds the quantitative ISR metric
    in qualitative assessment with concrete examples.


    #### Weaknesses


    **W1. ISR conflates necessity with quality.** A component being "necessary for
    the solver outcome" does not guarantee semantic correctness. A formula with N
    non-redundant but logically arbitrary premises that convolve to entail the conclusion
    would score high ISR but be a poor formalization. The gap between structural necessity
    and semantic adequacy is not discussed.


    **W2. RIP mapping is informal.** The three-stage decomposition (Reachability,
    Infection, Propagation) collapses into the single ablation test. Only Propagation
    is operationally measured. This makes RIP more of an analogy than a formal derivation—"component
    necessity testing" would be equally accurate.


    **W3. ISR sensitivity to decomposition granularity.** Discriminability varies
    (FOL 0.72, Prolog 0.45, SMT-LIB 0.35) but the 5-step protocol provides no guidance
    on choosing the ablation unit. Splitting premises into sub-clauses or merging
    premises changes ISR.


    **W4. Curriculum sigmoid is load-bearing but under-analyzed.** Table 5 shows curriculum
    Pareto-dominates fixed weighting, but the sigmoid shape (center, slope) is not
    ablated. Is sigmoid better than linear ramp? What is sensitivity to the ramp midpoint
    (reported as step 200 of 500)?


    **W5. Single-seed ablations insufficient.** Plans 004-011 all use 1 seed. Table
    5''s Pareto dominance claim, Table 6/7''s cross-logic validation, and Table 11''s
    scaling analysis could be driven by initialization variance. At minimum, top-2
    configurations should have 3 seeds.


    **W6. Prove rate differences not statistically significant.** Table 1: 0.33±0.04
    vs Table 2: 0.34±0.04 (overlapping CIs). Held-out: 0.24 vs 0.26. The paper should
    state "no significant difference" rather than "matches or slightly exceeds."


    **W7. ISR optimization is partially circular.** Optimizing ISR as a reward naturally
    increases ISR. The hacking taxonomy (200 samples, κ=0.78) partially breaks this
    circularity but is not dispositive. A downstream logical inference task evaluation
    would be stronger validation.


    **W8. Simpson''s paradox risk in base model ISR/PR.** Base model ISR/PR (0.53)
    > trained exec-only (0.33), cited as evidence that "training actively worsens
    structural quality." But the base model computes ISR/PR over only 12% of outputs
    (those that prove), a self-selected population of "easy" problems that are structurally
    well-posed. The populations are different.


    **W9. Multi-logic effects too small.** Table 8: +0.01 PR for Prolog from multi-logic
    training; Table 9: mean transfer Δ=0.045, STA adds only +0.01. At 1 seed, these

    ---


    ### R2: Novelty + Related Work


    **Score: 3/6 (Borderline Reject)**


    #### Novelty Assessment


    **Moderate novelty.** The core idea—leave-one-out ablation of solver input components
    as a reward signal—is sound but conceptually straightforward. ISR is equivalent
    to well-known feature importance/sensitivity tests (Shapley-style leave-one-out)
    applied to a new domain. The genuine contribution is recognizing that this specific
    application (RL rewards for formal reasoning) is valuable, not the technique itself.


    The RIP framework invocation is largely window-dressing. Only Propagation is operationally
    measured. The paper does not use Reachability or Infection as independent diagnostic
    or reward signals. Renaming "component necessity testing" as "RIP-grounded STA"
    inflates the theoretical contribution.


    The 5-step derivation protocol is a practical contribution but methodologically
    amounts to "run a pilot, find failure modes, design targeted checks"—standard
    engineering methodology, not a theoretical framework.


    #### Related Work: Critically Deficient


    **6 references is unacceptable for a venue paper.** Missing critical citations
    include:


    - **Reward shaping theory**: Ng et al. (1999) "Policy invariance under reward
    transformations" — the foundational result on potential-based reward shaping.
    STA''s combined reward should be discussed in this context.

    - **Reward hacking/overoptimization**: Gao et al. (2023) "Scaling Laws for Reward
    Model Overoptimization"; Skalse et al. (2022) "Defining and Characterizing Reward
    Hacking." The paper''s core problem statement (reward hacking under exec-only
    rewards) must cite this literature.

    - **GRPO itself**: Shao et al. (2024) "DeepSeekMath: Pushing the Limits of Mathematical
    Reasoning in Open Language Models" where GRPO was introduced. The paper uses GRPO
    as its RL algorithm but does not cite its origin.

    - **Modern formal verification + LLM**: LeanDojo (Yang et al. 2024), Baldur (First
    et al. 2023), AlphaProof (DeepMind 2024). These are the current state-of-the-art
    in formal reasoning with LLMs.

    - **FOLIO dataset**: Han et al. (2022) "FOLIO: Natural Language Reasoning with
    First-Order Logic." The paper uses FOLIO as its primary dataset without citing
    it.

    - **Mutation testing for ML**: DeepMutation (Ma et al. 2018), MuNN. Recent work
    applying mutation testing to ML systems should be discussed.

    - **Feature attribution connections**: SHAP (Lundberg & Lee 2017), Leave-One-Out
    (LOO) feature importance. ISR is structurally equivalent to binary LOO feature
    importance.

    - **Dense rewards in RL**: Potential-based reward shaping, intrinsic motivation,
    curiosity-driven exploration. STA''s "dense+automatic" claim needs context within
    this broader literature.


    The "EVOM (2026)" reference has no author list — it appears to be a self-citation
    or placeholder.


    #### Conceptual Clarity


    The ORM-PRM taxonomy positioning ("dense + automatic cell") is reasonable but
    under-argued. The paper should explicitly compare:

    - Why not train a PRM on solver execution traces? Math-Shepherd and similar approaches
    learn dense process rewards automatically from execution feedback.

    - Why is component ablation better than attention-based structural analysis?

    - How does STA relate to reward shaping theory (Ng 1999)?


    The "dense reward" claim is weakened by ISR being undefined for 67-88% of training
    examples (those that fail to prove). The reward r(f) = α·r_exec + β·r_exec·ISR
    reduces to α·r_exec = 0 for unproved outputs (since r_exec = 0). So for the majority
    of training examples, STA provides no signal at all. This should be acknowledged.


    #### Writing Quality


    The paper is well-organized and clearly written. Claims are generally appropriate,
    with exceptions noted above (prove rate "matching or slightly exceeding" should
    be "not significantly different"). The abstract accurately summarizes the content.
    Tables are clear and consistently formatted.


    However, the 10-page length feels thin for the experimental breadth — many experiments
    are described in 2-3 sentences where a full paragraph of analysis would be appropriate.
    The multi-logic and cross-logic sections are particularly rushed.


    #### Limitations


    The Limitations paragraph is honest about model family (Qwen3 only), limited languages,
    and manual steps. It correctly identifies the "uniform component weighting" limitation.
    Missing from limitations:

    - ISR is undefined for unproved outputs (majority of training)

    - Sensitivity to decomposition granularity

    - Potential Simpson''s paradox in ISR/PR ratio comparisons

    - Short training horizon (500 steps)


    #### Questions for Authors

    1. Has the actual 500-step, 3-seed training been completed, or are results projected
    from shorter pilots?

    2. Why is GRPO not cited? Which GRPO implementation was used?

    3. Can you provide the FOLIO dataset citation?

    4. How does ISR relate to Shapley values or SHAP-style feature importance?

    5. Why not compare against a PRM trained on solver traces?

    6. What is the "EVOM (2026)" reference? It has no authors listed.



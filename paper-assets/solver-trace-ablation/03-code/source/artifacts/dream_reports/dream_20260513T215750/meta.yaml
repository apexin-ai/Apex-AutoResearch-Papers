    analysis: 'The O(1) negative result is essential for the paper''s methodology
      argument. It demonstrates that STA''s value comes from comprehensive component
      ablation (O(N) cost per output), not from any single structural check. This
      motivates the 5-step RIP derivation protocol: each logic type has its own hacking
      modes, and the ablation set must cover them all. The O(1) result also preempts
      reviewer concern about STA''s computational cost — yes, it''s O(N) per component,
      but O(1) approximations demonstrably fail, so the cost is necessary. The slightly
      worse isr_pr_ratio for O(1) vs exec-only (0.15 vs 0.35) suggests the tautology
      penalty actively worsens structural diversity by forcing the model into a narrower
      set of non-tautological shortcuts.


    value and the paper is fixable, but substantial revision is needed.


    ---


    ## Step 4: Consolidated Assessment


    ### Overall Score: 4/6 (Borderline Reject)


    ### Summary Assessment


    The paper addresses a real and important problem — structural degeneracy (reward
    hacking) in execution-only RL for formal reasoning — with a well-motivated solution:
    component ablation as a dense structural reward. The idea is sound, the experimental
    plan is comprehensive, and the O(1) negative result is a genuinely informative
    contribution.


    However, the paper falls short of top venue standards in several dimensions:


    ### Major Issues (must fix)


    **M1. Related work critically deficient.** 6 references is unacceptable. The paper
    must cite GRPO''s origin (Shao et al. 2024), the FOLIO dataset (Han et al. 2022),
    reward hacking literature (Gao et al. 2023; Skalse et al. 2022), reward shaping
    theory (Ng et al. 1999), and modern formal verification+LLM work (LeanDojo, Baldur,
    AlphaProof). The "EVOM (2026)" reference lacks authors. A top venue paper in this
    space should have 25-40 references.


    **M2. ISR circularity.** The paper optimizes ISR as a reward and reports ISR improvement
    as the primary result. The hacking taxonomy (Table 12) partially breaks this circularity
    but relies on 200 samples with potentially non-independent annotators (κ=0.78).
    The paper needs either: (a) a downstream evaluation showing high-ISR formalizations
    are genuinely better on an independent criterion, or (b) a much larger and externally-annotated
    hacking study.


    **M3. Statistical rigor for secondary claims.** 8 of 12 experiments use a single
    seed. The weight ablation (Table 5), multi-logic (Tables 8-9), scaling (Table
    11), and cross-logic transfer (Table 9) results cannot support the conclusions
    drawn. Effect sizes of +0.01-0.03 at 1 seed are not meaningful. Minimum: 3 seeds
    for the top-2 weight configurations and at least 1 secondary logic type.


    **M4. "Pareto-improving" overclaimed.** Prove rate differences (exec-only 0.28±0.03
    vs exec+STA 0.30±0.03) are not statistically significant. The paper should claim
    "STA preserves prove rate while substantially improving structural quality" rather
    than "Pareto-improving."


    ### Minor Issues (should fix)


    **m1. RIP framing overstated.** Only Propagation is operationally measured. Either
    formalize the Reachability and Infection conditions as independent diagnostic
    signals, or reframe as "component necessity testing" without the three-stage RIP
    hierarchy.


    **m2. "Dense reward" claim weakened.** ISR is undefined for unproved outputs (67-88%
    of training examples). The reward reduces to r_exec = 0 for these. The paper should
    acknowledge this and discuss implications for training signal density.


    **m3. ISR sensitivity to decomposition granularity.** The 5-step protocol should
    include guidance on choosing the ablation unit. The varying discriminability across
    logic types (0.72, 0.45, 0.35) is acknowledged but not addressed.


    **m4. Curriculum under-analyzed.** The sigmoid is load-bearing (Table 5) but its
    shape parameters are not ablated. Linear ramp comparison and midpoint sensitivity
    analysis needed.


    **m5. Simpson''s paradox risk in base model comparison.** The claim that "training
    actively worsens structural quality" (base ISR/PR 0.53 > exec-only 0.33) may be
    an artifact of different populations. The base model computes ISR/PR over only
    its 12% prove-rate outputs.


    **m6. Short training horizon.** 500 steps leaves open whether STA''s benefits
    persist or diminish at longer training.


    **m7. SFT comparison conflates paradigm with data efficiency.** Should match total
    compute or effective training signal.


    ### Experiment Coverage vs Design



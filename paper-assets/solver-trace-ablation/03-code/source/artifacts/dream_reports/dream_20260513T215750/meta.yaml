    result_rationale: 'The weight ablation reveals a clear Pareto frontier trading
      prove_rate against structural quality. Fixed weighting shows the expected tradeoff:
      higher STA weight (β=0.7) produces highest isr_pr_ratio (0.72) but lowest prove_rate
      (0.20) because the STA penalty is too punitive during early training when the
      model cannot yet produce provable outputs. Lower STA weight (β=0.3) produces
      near-exec-only prove_rate (0.30) but only moderate structural benefit (isr_pr_ratio
      0.52 vs exec-only''s 0.35). The sigmoid curriculum consistently Pareto-dominates
      fixed weighting at the same terminal α/β: curriculum 0.5/0.5 matches fixed 0.7/0.3''s
      prove_rate (0.30) while achieving higher isr_pr_ratio (0.65 vs 0.52). This is
      because the curriculum allows exec-reward-dominated early learning (the model
      first learns to prove) before STA activates (forcing structural quality). The
      optimal configuration is curriculum α=0.5/β=0.5 — it achieves the best prove_rate
      × isr_pr_ratio product (0.30 × 0.65 = 0.195) and lies at the Pareto knee. Curriculum
      α=0.7/β=0.3 achieves marginally higher prove_rate (0.32) but substantially lower
      structural quality — diminishing returns on the accuracy axis.

      '

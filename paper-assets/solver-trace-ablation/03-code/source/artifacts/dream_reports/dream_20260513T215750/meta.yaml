    # Dream Review Report: Solver Trace Ablation (STA)


    **Paper**: "Solver Trace Ablation: A Mutation-Testing-Derived Methodology for
    Detecting Structural Degeneracy in RL-Trained Formalizers"

    **Dream ID**: 20260513T215750

    **Review Mode**: Full (2 Reviewers, 4-step roundtable)

    **Date**: 2026-05-13


    ---


    ## 1. Paper Summary


    The paper introduces Solver Trace Ablation (STA), a methodology adapted from mutation
    testing''s RIP (Reachability-Infection-Propagation) framework, for detecting structural
    degeneracy (reward hacking) in GRPO-trained formal logic generators. STA defines
    an Intensional Structural Reward (ISR) via systematic component ablation: for
    each proved output, each component is removed and the solver is re-run; the fraction
    of components whose ablation changes the solver verdict constitutes the ISR score.
    The combined reward r = α·r_exec + β·ISR is used for GRPO training across three
    logic types (FOL/Prover9, Prolog/SWI-Prolog, SMT-LIB/Z3). The paper reports 1.9×
    ISR improvement on held-out FOL data (0.132 vs 0.068), hacking rate reduction
    from 69% to 35%, at 5pp accuracy cost. A manual annotation of 400 outputs reveals
    STA suppresses surface-level hacking but models shift toward semantic-level shortcuts.


    ---


    ## 2. Reviewer Summaries


    ### R1 (Methods + Experiments): Score 4/6 (Weak Accept)

    R1 finds the paper addresses a real problem with a well-motivated approach. The
    5-step derivation protocol is portable and the hacking taxonomy provides genuine
    insight. The honest "partial prevention" framing is commendable. However, R1 identifies
    four major weaknesses: (1) insufficient statistical rigor for secondary claims
    (8/12 experiments single-seed), (2) ISR circularity (optimizing and evaluating
    on the same metric without downstream validation), (3) inadequate explanation
    of the ISR/PR discrepancy between training (0.42) and held-out (0.78), and (4)
    ISR sparsity for unproved outputs undermining the "dense + automatic" positioning.


    ### R2 (Novelty + Related Work): Score 3/6 (Weak Reject)

    R2 finds the problem identification valuable but the novelty insufficient for
    a top venue. ISR is structurally identical to leave-one-out (LOO) feature importance
    — a well-known technique applied to a new domain. The RIP framework invocation
    is cosmetic: only Propagation is operationally measured; Reachability and Infection
    contribute no independent signal. Related work is critically deficient (8 references
    vs 25-40 expected), missing entire literatures on reward shaping theory, feature
    attribution methods, modern formal reasoning with LLMs, and reward hacking mitigation.


    ---


    ## 3. Roundtable Convergence


    ### 3.1 Points of Agreement


    **Both reviewers agree on:**


    1. **Problem identification is valuable and timely.** Structural degeneracy under
    execution-only GRPO training is a real, underappreciated problem. The observation
    that prove rate rises while structural quality degrades is important.


    2. **RIP framework invocation is overstated.** Only the Propagation condition
    is operationally measured. The 5-step protocol maps to RIP in step 4 but this
    step adds no actionable content beyond step 3 (classification). The methodology
    is effectively component necessity testing via LOO ablation, with RIP serving
    as motivating analogy rather than formal grounding.


    3. **ISR is LOO ablation importance applied to a new domain.** ISR(y) = (1/N)
    Σ 1[S(y\c_i) ≠ S(y)] is structurally identical to binary leave-one-out feature
    importance. The novelty is in the application domain (RL reward design for formal
    reasoning), not in the metric itself. The paper does not cite or discuss this
    connection to the feature attribution literature.


    4. **ISR is sparse for the majority of training examples.** With prove rates of
    10-26%, ISR provides zero signal for 74-90% of outputs. The "dense + automatic"
    positioning in the ORM-PRM taxonomy is misleading. ISR is conditionally dense
    — dense only within the minority of proved outputs.


    5. **Statistical rigor is insufficient for secondary claims.** Only the core FOL
    experiments (plans 001-002) use 3 seeds. Eight of twelve experiments use single
    seeds. Effect sizes in cross-logic, multi-logic, and scaling experiments (8-12pp
    ISR/PR differences) could easily fall within seed variance. No confidence intervals
    or significance tests are reported.


    6. **The hacking taxonomy is the strongest novelty element.** The manually-annotated
    taxonomy with the adversarial adaptation finding (models shift from surface-level
    to semantic-level hacking) is a genuine empirical contribution. The O(1) negative
    result (tautology-only check ≈ exec-only) is informative and well-executed.


    7. **Related work is thin.** 8 references is below venue standards. Missing citations
    to reward shaping theory (Ng et al. 1999), feature attribution (SHAP, LOO analysis),
    modern formal reasoning with LLMs (LeanDojo, AlphaProof), reward hacking mitigation
    (Gao et al. 2023), and the FOLIO dataset paper.


    8. **Honest framing is commendable.** The "monitoring/diagnostic tool" positioning
    is well-calibrated to the evidence. The paper does not overclaim.


    ### 3.2 Points of Divergence


    **R1 emphasizes experimental concerns:**

    - The ISR/PR discrepancy between training (0.42) and held-out (0.78) is inadequately
    explained. The paper attributes it to "batch-level approximation vs full ablation"
    but does not specify the approximation or analyze its implications. The exec-only
    condition shows stability (0.34→0.31), making the asymmetry suspicious.

    - ISR circularity: optimizing ISR as reward and evaluating ISR as metric. No downstream
    task evaluation validates that high ISR correlates with genuine formalization
    quality.

    - Missing random reward baseline: without controlling for multi-objective regularization,
    it is unclear whether ISR''s specific formulation matters or any penalty on proved
    outputs achieves similar effects.


    **R2 emphasizes novelty concerns:**

    - The conceptual advance is modest: recognizing that component ablation reveals
    structural necessity and using this as an RL reward. This is sound engineering
    but not a deep conceptual contribution.

    - The 5-step derivation protocol is standard engineering methodology, not a methodological
    contribution.

    - Missing connection to mutation testing theory (equivalent mutant problem, weak
    vs strong mutation, mutant subsuming).


    ### 3.3 Converged Assessment


    After cross-sharing, both reviewers agree the paper is **borderline** for a top
    ML venue main track. The core tension: the paper identifies a real problem, proposes
    a reasonable solution, and characterizes its limitations honestly — but the technical
    novelty (LOO ablation as RL reward) and the experimental evidence (single-seed
    secondary experiments, unexplained ISR/PR discrepancy, no downstream validation)
    do not clear the bar individually. The strongest contributions (hacking taxonomy,
    O(1) negative result, honest framing) are genuine but modest.


    **Consensus score: 3.5/6 (borderline Weak Reject / Weak Accept)**, rounded to
    **Weak Reject** for main track, with clear path to **Findings** after revision.


    ---


    ## 4. Detailed Strengths


    **S1. Genuine problem identification (High impact).** The paper provides the first
    systematic quantification of structural degeneracy in execution-only GRPO for
    formal reasoning. The prove_rate ↑ / ISR/PR ↓ divergence pattern (Table 1) is
    a clear, reproducible finding.


    **S2. Hacking taxonomy with adversarial adaptation (Medium-high impact).** The
    finding that STA suppresses surface-level hacking (tautology padding −15pp, redundant
    clauses −13pp) while models shift to semantic-level shortcuts (trivial implication
    +3pp, minimal axiom gaming +6pp) is a genuine empirical insight with implications
    for reward design more broadly. κ=0.72 is substantial.


    **S3. O(1) negative result (Medium impact).** Demonstrating that tautology-only
    check provides negligible benefit (ISR/PR 0.33 ≈ exec-only 0.34) validates the
    need for full component ablation and refutes the "simple heuristic" alternative.


    **S4. Three-logic instantiation (Medium impact).** Demonstrating the ablation
    approach across FOL, Prolog, and SMT-LIB supports generality in principle, even
    if single-seed evidence is thin.


    **S5. Honest framing (Presentation strength).** The paper consistently positions
    STA as "monitoring/diagnostic tool" rather than "solution," acknowledges the accuracy-structure
    tradeoff as fundamental, and does not overclaim.


    **S6. Well-organized paper.** Tables are clear, section structure is logical,
    and claims generally match evidence.


    ---


    ## 5. Detailed Weaknesses


    ### Major


    **W1. ISR novelty is overstated (Novelty, Major).**

    ISR is structurally equivalent to binary LOO feature importance — a technique
    with decades of history in statistics and ML interpretability (Shapley values,
    SHAP, permutation importance). The paper does not acknowledge this connection.
    The RIP framework invocation dresses up a known technique with borrowed terminology:
    only Propagation is measured; Reachability and Infection contribute nothing operational.
    The paper should honestly position ISR as "LOO ablation importance applied to
    RL rewards for formal reasoning" — application novelty, not metric novelty.


    **W2. Statistical rigor insufficient for secondary claims (Experimental, Major).**

    Eight of twelve experiments use single random seeds. The cross-logic generalization
    claim — a central contribution — rests entirely on single-seed evidence with effect
    sizes (8-12pp ISR/PR) that could be noise. No confidence intervals, significance
    tests, or effect size estimates are reported for any comparison. This is the most
    damaging experimental weakness because the paper''s breadth-over-depth strategy
    requires secondary results to be reliable.


    **W3. ISR/PR discrepancy between training and held-out (Experimental, Major).**

    The ISR/PR ratio jumps from 0.42 (training, Table 2) to 0.78 (held-out, Table
    3) for the STA condition, while exec-only is stable (0.34→0.31). The paper attributes
    this to "batch-level approximation vs full component ablation" but does not specify
    the approximation or analyze its implications. This asymmetry suggests training-time
    and evaluation-time ISR are computed differently, which means the model is optimized
    against a different objective than the one being evaluated. The headline "1.9×
    higher structural integrity" rests on held-out numbers whose relationship to training
    dynamics is unclear.


    **W4. ISR circularity without downstream validation (Experimental, Major).**

    The paper optimizes ISR as a reward and evaluates ISR improvement as the primary
    result. No downstream task evaluation (e.g., logical inference accuracy using
    generated formalizations, proof quality assessment by external verifiers) validates
    that high ISR correlates with genuine formalization quality. The hacking taxonomy
    partially breaks this circularity, but 200 samples with undisclosed annotator
    identity is insufficient.


    **W5. ISR sparsity undermines "dense + automatic" positioning (Framing, Major).**

    With prove rates of 10-26%, ISR provides zero signal for 74-90% of training outputs.
    The paper''s claim to fill the "dense + automatic" cell in the ORM-PRM taxonomy
    is misleading. ISR is conditionally dense — dense only within the small proved
    subset. This should be explicitly acknowledged.


    ### Moderate


    **W6. Related work critically deficient (Presentation, Moderate).**

    8 references is far below venue standards (25-40 expected). Missing entire literatures:
    reward shaping theory (Ng et al. 1999), feature attribution (SHAP, LOO analysis),
    modern formal reasoning with LLMs (LeanDojo, AlphaProof, Baldur), reward hacking
    mitigation (Gao et al. 2023, RLHF), program synthesis quality metrics (CodeBLEU,
    functional correctness), intrinsic motivation literature.


    **W7. No random reward baseline (Experimental, Moderate).**

    Without a control for the general regularization effect of multi-objective optimization,
    it is unclear whether ISR''s specific component-ablation formulation matters,
    or whether any penalty on proved outputs would achieve similar structural improvement.
    A random structural penalty baseline is needed.


    **W8. Hacking taxonomy is FOL-only (Experimental, Moderate).**

    The paper claims cross-logic generalization but provides hacking characterization
    for only FOL. Prolog and SMT-LIB may exhibit entirely different hacking mode distributions.
    The taxonomy should be extended or the cross-logic characterization claim should
    be scoped down.


    **W9. 500 training steps may be insufficient (Experimental, Moderate).**

    Both ISR/PR curves are still declining at step 500. It is unknown whether STA''s
    benefit persists, grows, or vanishes at longer horizons. The paper should either
    show convergence or explicitly bound the claim to the observed training horizon.


    ### Minor


    **W10. 5-step protocol is standard engineering (Novelty, Minor).**

    "Run a pilot, observe failures, categorize, design mitigations" is standard engineering
    methodology. Presenting this as a core contribution overstates its novelty, though
    it has value for reproducibility.


    **W11. Curriculum scheduling analysis is shallow (Experimental, Minor).**

    The sigmoid curriculum is the best-performing configuration but its hyperparameters
    are not ablated. Whether sigmoid outperforms linear ramp is unknown.


    **W12. ISR sensitivity to decomposition granularity unaddressed (Method, Minor).**

    The protocol does not guide practitioners on choosing the ablation unit. Discriminability
    varies 2× across logic types (0.38 vs 0.17), likely reflecting decomposition granularity
    differences, but no guidance is provided.


    ---


    ## 6. Questions for Authors


    1. **ISR/PR discrepancy**: Can you precisely specify how training-time ISR computation
    differs from held-out evaluation ISR? Why does the exec-only condition show stability
    (0.34→0.31) while exec+STA shows a large gap (0.42→0.78)?


    2. **Random baseline**: Have you evaluated whether a random structural penalty
    (e.g., penalizing proved outputs by a random score) achieves comparable ISR/PR
    improvement? This would isolate ISR''s specific signal from the general multi-objective
    regularization effect.


    3. **Downstream validation**: Do high-ISR formalizations correlate with better
    downstream logical inference performance? Have you evaluated the generated FOL
    formulas on a downstream reasoning task?


    4. **ISR and feature attribution**: ISR is structurally equivalent to binary LOO
    feature importance. How does it relate to Shapley values or SHAP? Have you considered
    interaction effects (components that are individually necessary but collectively
    encode trivial reasoning)?


    5. **RIP beyond Propagation**: Could Reachability (does the solver process the
    component?) and Infection (does removing it change intermediate solver state?)
    provide additional signals? If not, why invoke the full RIP framework?


    6. **Training horizon**: Do you have any data beyond 500 steps? Does the ISR/PR
    gap between conditions converge, diverge, or remain stable?


    ---


    ## 7. Experiment Coverage Assessment


    All 12 imagined experiments from the review context are covered in the paper:

    - plan_001 (FOL exec-only baseline) ✓ Table 1

    - plan_002 (FOL exec+STA) ✓ Table 2

    - plan_003 (FOL held-out evaluation) ✓ Table 3

    - plan_004 (O(1) vs O(N) ablation) ✓ Table 4

    - plan_005 (reward weight ablation + curriculum) ✓ Table 5

    - plan_006 (Prolog single-logic) ✓ Table 6

    - plan_007 (Multi-logic GRPO) ✓ Table 8

    - plan_008 (Cross-logic transfer) ✓ Table 7

    - plan_009 (SFT baseline) ✓ Table 3

    - plan_010 (SMT-LIB single-logic) ✓ Table 6

    - plan_011 (Qwen3-8B scaling) ✓ Table 9

    - plan_012 (Hacking characterization) ✓ Table 10


    Coverage is complete. The concern is not coverage but depth: only plans 001-002
    have multi-seed support; the remaining 10 experiments are single-seed.


    ---


    ## 8. Scores


    | Criterion | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Overall | 4/6 (Weak Accept) | 3/6 (Weak Reject) | **3/6 (Weak Reject)** |

    | Soundness | 2/4 | 2/4 | **2/4** |

    | Presentation | 3/4 | 3/4 | **3/4** |

    | Contribution | 3/4 | 2/4 | **2/4** |

    | Confidence | 4/5 | 4/5 | **4/5** |


    **Consensus Overall: 3/6 (Weak Reject)**


    ---


    ## 9. Meta-Review and Recommendation


    This paper identifies a genuine problem (structural degeneracy in execution-only
    GRPO for formal reasoning) and proposes a reasonable solution (component ablation
    as structural reward). The honest "monitoring/diagnostic tool" framing is well-calibrated
    to the evidence, and the hacking taxonomy with adversarial adaptation is a genuine
    empirical insight.


    However, the paper has significant weaknesses that place it below the acceptance
    threshold for a top ML venue main track:


    1. **Novelty concerns dominate.** ISR is LOO ablation importance applied to a
    new domain — useful application but not a conceptual advance. The RIP framework
    invocation is cosmetic. The 5-step protocol is standard engineering. The related
    work is critically thin.


    2. **Experimental evidence is insufficiently rigorous.** Single-seed secondary
    experiments cannot support cross-logic generalization claims. The ISR/PR training-vs-held-out
    discrepancy is unexplained. No downstream validation breaks the ISR circularity.
    No random baseline isolates ISR''s specific contribution.


    3. **Framing issues.** The "dense + automatic" ORM-PRM positioning is misleading
    given ISR''s sparsity for unproved outputs. The RIP grounding claim overstates
    the theoretical contribution.


    **Recommendation**: Reject for top venue main track. The paper has a clear path
    to acceptance at EMNLP Findings or a workshop after:

    - Expanding related work to 25+ references (reward shaping, feature attribution,
    modern formal reasoning, reward hacking mitigation)

    - Honestly repositioning ISR as domain-specific application of LOO ablation

    - Adding multi-seed support for at least Prolog and scaling experiments

    - Providing downstream validation or a random baseline to address circularity

    - Explaining or resolving the ISR/PR training-vs-held-out discrepancy

    - Acknowledging ISR''s conditional density limitation


    The strongest version of this paper would: (a) lead with the hacking taxonomy
    and adversarial adaptation as the primary contribution, (b) position STA/ISR as
    the tool that enabled the discovery rather than the contribution itself, and (c)
    use the O(1) negative result and cross-logic instantiation as supporting evidence
    for the importance of comprehensive structural analysis.


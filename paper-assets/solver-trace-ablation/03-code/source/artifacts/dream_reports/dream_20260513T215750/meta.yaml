    result_rationale: 'Held-out evaluation amplifies the structural gap because degenerate
      shortcuts overfit to training distribution. Exec-only model''s prove_rate drops
      more on held-out (0.24 vs 0.28 in-distribution) because tautological/vacuous
      shortcuts are less likely to accidentally match held-out problem structures.
      Its held-out ISR drops further (0.08) because the learned shortcuts are even
      less structurally valid on new problems. Exec+STA model retains prove_rate better
      (0.26 vs 0.30, smaller drop) because structurally sound proofs generalize. Its
      ISR actually improves relative to isr_pr_ratio (0.85 vs 0.65 in-distribution)
      because the remaining proved outputs are genuinely well-structured — the degenerate
      easy wins that inflated training prove_rate without proportional ISR are gone.
      The hacking prevalence (fraction of proved outputs that are structurally degenerate
      by manual taxonomy) drops from 45% to 18%, directly supporting the "STA corrects,
      not just detects" narrative.


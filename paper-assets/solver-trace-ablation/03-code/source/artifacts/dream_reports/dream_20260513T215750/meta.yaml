    Does exec-only continue to degrade at 2000+ steps, or stabilize? Does STA''s benefit
    persist or diminish? The limited horizon leaves the durability of STA''s structural
    protection unclear.


    **W11. SFT baseline comparison conflates training paradigm with data efficiency.**
    SFT''s lower prove rate (0.20 vs 0.30) could reflect imitation learning''s limited
    exploration with 500 examples, not inherent inferiority.



    which shortcuts GRPO amplifies and which STA suppresses.'
  analysis: 'The hacking characterization provides the qualitative evidence that complements
    the quantitative ISR/PR ratio. Reviewers can see exactly what "structural degeneracy"
    means: 18% of exec-only proved outputs contain tautological premises like "∀x(P(x)
    ∨ ¬P(x))" that trivially satisfy the solver but contribute nothing to the formalization.
    STA''s suppression of these modes (18%→3%) is directly attributable to ISR=0 scores
    for tautological components. The residual 18% hacking under exec+STA identifies
    limitations and future work: subtler shortcuts (redundant clauses with small ISR)
    require finer-grained ablation or curriculum-based emphasis on high-residual hacking
    modes.'

  result_rationale: 'Multi-logic training with mixed FOL+Prolog batches forces the
    model to maintain distinct formalization strategies per logic type, acting as
    implicit regularization against logic-specific hacking modes. FOL prove_rate is
    marginally better than single-logic (0.29 vs 0.28 exec-only baseline) because
    Prolog''s different structural constraints provide auxiliary gradient signal.
    Prolog benefits more (+0.03 over single-logic''s 0.24) because FOL training data
    is larger and the formal reasoning skills partially transfer (both involve quantifier
    scoping, logical connectives, variable binding). The isr_pr_ratio is slightly
    lower than single-logic exec+STA for both (0.62 vs 0.65 for FOL, 0.55 vs 0.58
    for Prolog) because the mixed reward signal is noisier — each logic type''s STA
    has different component counts and score distributions, creating gradient variance.
    The positive transfer signal is modest but measurable, supporting the Claim 2
    narrative that GRPO over multiple formal languages exhibits useful cross-logic
    dynamics.


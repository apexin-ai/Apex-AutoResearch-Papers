  result_rationale: 'Cross-logic transfer delta [0.02, 0.08] predicted range. FOL→Prolog
    transfer (+0.04 prove_rate over base model''s ~0.12 Prolog prove_rate) is modest
    because FOL training teaches quantifier handling and logical structure that partially
    maps to Prolog''s clause semantics — both require correct variable scoping and
    logical decomposition. Prolog→FOL transfer (+0.05) is slightly larger because
    Prolog''s rule-based reasoning develops a "compositional formalization" skill
    that transfers to FOL premise construction. Neither direction produces dramatic
    gains because the surface syntax is too different for shallow transfer, and 4B
    models at 500 steps don''t develop deep enough logical abstractions for strong
    transfer. The positive delta (mean 0.045) is nonetheless noteworthy — it suggests
    shared latent formal reasoning capabilities that multi-logic training could amplify.
    Exec+STA-trained models show marginally higher transfer than exec-only trained
    models (+0.01 additional delta) because structurally sound formalizations encode
    more transferable logical patterns.


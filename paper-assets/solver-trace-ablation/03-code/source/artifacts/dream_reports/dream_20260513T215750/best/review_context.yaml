    for both conditions) because the larger model has better baseline FOL syntax knowledge
    and can explore a wider policy space during GRPO. The isr_pr_ratio pattern is
    preserved: exec-only degrades to 0.40 (slightly better than 4B''s 0.35 — larger
    models hack slightly less aggressively because they have more capacity for genuine
    solutions alongside hacking shortcuts), while exec+STA maintains 0.68 (slightly
    above 4B''s 0.65 — same structural reward prevents the same degradation mode).
    The STA benefit is approximately scale-invariant in relative terms (isr_pr_ratio
    improvement of ~0.28 at both scales), suggesting that structural degeneracy under
    exec-only reward is a fundamental property of GRPO optimization, not a small-model

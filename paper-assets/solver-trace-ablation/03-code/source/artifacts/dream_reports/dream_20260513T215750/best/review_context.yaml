      - '0.08'
      - '0.32'
      - —
    - - Exec+STA
      - '0.24'
      - '0.14'
      - '0.58'
      - '0.45'
  figures_description:
  - 'Figure 9: Side-by-side isr_pr_ratio trajectories for Prolog (left) and FOL (right).
    Same pattern: exec-only declines, exec+STA stabilizes. Different absolute levels
    reflect logic-type-specific baseline difficulty.'
  analysis: 'Prolog results validate the STA derivation protocol''s generality — the
    same 5-step procedure (pilot → shortcuts → classify → RIP map → design checks)
    produces a functional ISR signal for a structurally different logic type. The
    Prolog-specific hacking modes (redundant clauses, catch-all rules) are distinct
    from FOL''s (tautological premises, vacuous quantifiers), confirming that hacking
    is logic-type-specific and STA catches it in both cases. Lower absolute metrics
    reflect the harder generation task, not methodology failure.

    '
- name: Multi-Logic GRPO (FOL+Prolog)
  plan_id: plan_007
  description: 'Multi-logic GRPO training on mixed FOL+Prolog data, exec-only vs exec+STA
    (500 steps, K=8, 1 seed). Tests whether joint training enables cross-logic transfer.

    '

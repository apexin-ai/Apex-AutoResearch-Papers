  - 'Figure 8: Sigmoid curriculum activation curves overlaid with isr_pr_ratio trajectories.
    Shows how STA weight ramp-up corresponds to isr_pr_ratio recovery.'
  analysis: 'The weight ablation provides three key insights: (1) STA weight has a
    predictable dose-response relationship with structural quality, confirming it''s
    a genuine training signal, not noise. (2) Sigmoid curriculum is a principled solution
    to the Phase 1 pilot''s prove_rate depression problem — it recovers ~0.05 prove_rate
    compared to fixed weighting at matched terminal weights. (3) The Pareto analysis
    gives practitioners a concrete recommendation: use curriculum 0.5/0.5 for balanced
    accuracy-structure, or curriculum 0.7/0.3 if accuracy is the priority. This section
    also serves as an implicit response to "how sensitive is STA to hyperparameters?"
    — the answer is "moderately, but curriculum scheduling makes it robust."

    '
- name: Prolog Single-Logic GRPO
  plan_id: plan_006
  description: 'Prolog single-logic GRPO: exec-only vs exec+STA (500 steps, K=8, 1
    seed). Second logic type to validate STA derivation protocol generality.

    '
  expected_results:
    prolog_exec_only_prove_rate: 0.22
    prolog_exec_sta_prove_rate: 0.24
    prolog_exec_only_isr_mean: 0.08
    prolog_exec_sta_isr_mean: 0.14
    prolog_exec_only_isr_pr_ratio_last100: 0.32
    prolog_exec_sta_isr_pr_ratio_last100: 0.58
    prolog_isr_discriminability: 0.45
    prolog_hacking_modes:
    - redundant_clauses
    - catch_all_rules
    - trivial_unification
  result_rationale: 'Prolog STA instantiation uses rule ablation (remove each clause,
    check if query still succeeds) — the RIP mapping is: Reachability=clause is syntactically
    reachable from query, Infection=clause body binds variables used downstream, Propagation=removing
    clause changes query result. Prolog''s hacking modes differ from FOL: instead
    of tautological premises, the model produces redundant clauses (rules that never
    fire), catch-all rules (match anything via anonymous variables), and trivial unification
    chains. These are detectable by STA because ablating redundant/catch-all clauses
    doesn''t change the query result (ISR contribution = 0). Prove_rate is slightly
    lower than FOL (0.22 vs 0.28 for exec-only) because SWI-Prolog is more sensitive
    to syntactic errors and Qwen3-4B has less Prolog in its pretraining data. The
    exec+STA pattern replicates: ISR/PR ratio stabilizes (0.58 vs 0.32), confirming
    the methodology transfers. Discriminability (0.45) is lower than FOL (~0.72) because
    Prolog programs have fewer components per output (fewer clauses to ablate), creating
    a coarser ISR signal, but still sufficient for reward shaping.

    '
  tables:
  - name: 'Table 6: Prolog Single-Logic Results (500 steps, 1 seed)'
    columns:
    - condition
    - prove_rate
    - mean_isr
    - isr_pr_ratio
    - discriminability

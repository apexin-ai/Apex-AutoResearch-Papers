    logic programming (Prolog), and constraint satisfaction (SMT-LIB). The diminishing
    effect magnitude correlates with ISR discriminability, which itself correlates
    with component independence — a finding that informs future STA instantiation
    design. Three logic types is sufficient for an EMNLP paper; the consistent qualitative
    pattern (exec+STA stabilizes structure) across structurally different formal languages
    is the core evidence for methodology generality.


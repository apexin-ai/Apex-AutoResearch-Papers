  - 'Figure 2 (center panel): prove_rate and mean_isr vs training step for exec+STA.
    Both curves rise together; ISR tracks prove_rate with a bounded gap (ratio ~0.65),
    in stark contrast to exec-only where the gap widens continuously.'
  - 'Figure 3: Overlay of isr_pr_ratio for exec-only (declining) and exec+STA (stable/recovering).
    This is the paper''s signature figure — the visual proof that STA prevents structural
    degradation.'
  analysis: 'Exec+STA achieves the best-tier prediction: prove_rate matches exec-only
    (0.30 vs 0.28, not statistically different) while maintaining isr_pr_ratio ≥0.5
    throughout training (vs exec-only''s degradation to 0.35). The slight prove_rate
    advantage (+0.02) emerges because STA penalizes degenerate shortcuts, forcing
    the model to discover structurally sound proving strategies that also happen to
    generalize better. The 7% wall-clock overhead (10.2s vs 9.5s per step) is negligible.
    This validates the core claim: STA reward is Pareto-improving (same accuracy,
    better structure) or at worst Pareto-neutral (same accuracy, maintained structure).
    The curriculum is load-bearing — without it (as in Phase 1 pilot), the 0.5 STA
    weight suppresses early prove_rate learning.

    '
- name: FOL Held-Out Evaluation
  plan_id: plan_003
  description: 'Held-out test set evaluation comparing plan_001 (exec-only) vs plan_002
    (exec+STA) checkpoints. Full STA metrics on unseen problems to measure generalization.

    '
  expected_results:
    exec_only_held_out_prove_rate: 0.24
    exec_sta_held_out_prove_rate: 0.26
    exec_only_held_out_isr_mean: 0.08
    exec_sta_held_out_isr_mean: 0.22
    exec_only_held_out_isr_pr_ratio: 0.33
    exec_sta_held_out_isr_pr_ratio: 0.85
    exec_only_hacking_prevalence: 0.45
    exec_sta_hacking_prevalence: 0.18
  result_rationale: 'Held-out evaluation amplifies the structural gap because degenerate
    shortcuts overfit to training distribution. Exec-only model''s prove_rate drops
    more on held-out (0.24 vs 0.28 in-distribution) because tautological/vacuous shortcuts
    are less likely to accidentally match held-out problem structures. Its held-out
    ISR drops further (0.08) because the learned shortcuts are even less structurally
    valid on new problems. Exec+STA model retains prove_rate better (0.26 vs 0.30,
    smaller drop) because structurally sound proofs generalize. Its ISR actually improves
    relative to isr_pr_ratio (0.85 vs 0.65 in-distribution) because the remaining
    proved outputs are genuinely well-structured — the degenerate easy wins that inflated
    training prove_rate without proportional ISR are gone. The hacking prevalence
    (fraction of proved outputs that are structurally degenerate by manual taxonomy)
    drops from 45% to 18%, directly supporting the "STA corrects, not just detects"
    narrative.

    '

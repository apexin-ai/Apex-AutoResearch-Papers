narrative_guidance: 'STA is both diagnostic and corrective: prevents structural degeneracy
  while maintaining or improving prove rate. "RIP-derived rewards are the dense+automatic
  cell in the ORM-PRM taxonomy, and they work — execution-only training degrades structurally,
  STA-rewarded training does not." Multi-logic results demonstrate the 5-step derivation
  protocol generalizes across solver types. O(1) negative result strengthens the story
  (ablation granularity matters). Target EMNLP main with full confidence.

  '
imagined_experiments:
- name: FOL Exec-Only 500-Step Baseline
  plan_id: plan_001
  description: 'FOL single-logic GRPO, execution-only reward, 500 steps, K=8, 3 seeds.
    Establishes the structural degradation trajectory that STA is designed to prevent.

    '
  expected_results:
    prove_rate_mean: 0.28
    prove_rate_std: 0.03
    prove_rate_first100: 0.18
    prove_rate_last100: 0.33
    mean_isr_overall: 0.11
    mean_isr_last100: 0.09
    isr_pr_ratio_overall: 0.39
    isr_pr_ratio_last100: 0.35
    isr_pr_ratio_first100: 0.92
    parse_rate: 1.0
    training_minutes: 79
    step_time_s: 9.5

- name: SFT Baseline
  plan_id: plan_009
  description: 'Supervised finetuning on same FOLIO 500 data. Provides a non-RL baseline
    for GRPO comparison.

    '
  expected_results:
    sft_prove_rate: 0.2
    sft_mean_isr: 0.13
    sft_isr_pr_ratio: 0.65
    sft_held_out_prove_rate: 0.18
    sft_held_out_isr_mean: 0.12
  result_rationale: 'SFT on ground-truth FOL translations achieves moderate prove_rate
    (0.20) — higher than base model (0.12) but lower than GRPO variants (0.28-0.30)
    — because SFT copies the distribution of training outputs without the exploration-exploitation
    dynamics that GRPO provides. Crucially, SFT maintains a healthy isr_pr_ratio (0.65)
    because it imitates human-written formalizations that are structurally sound by
    construction. This creates an interesting comparison: SFT has good structure but
    low accuracy; exec-only GRPO has high accuracy but degraded structure; exec+STA
    GRPO has both. The SFT baseline thus demonstrates that GRPO is necessary for accuracy
    and STA is necessary for maintaining the structural quality that SFT gets for
    free from human demonstrations. Held-out performance drops proportionally (0.18,
    0.12) because SFT overfits to training problem templates more than GRPO does.


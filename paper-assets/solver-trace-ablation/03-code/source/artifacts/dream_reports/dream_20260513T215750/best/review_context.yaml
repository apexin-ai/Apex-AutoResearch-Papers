- name: Hacking Characterization
  plan_id: plan_012
  description: 'Manual annotation of 200 outputs per condition (exec-only, exec+STA,
    base model, SFT) using extensional-shortcut taxonomy. No GPU required.

    '
  expected_results:
    exec_only_hack_rate: 0.45
    exec_sta_hack_rate: 0.18
    base_model_hack_rate: 0.25
    sft_hack_rate: 0.12
    exec_only_taxonomy:
      tautological_premise: 0.18
      vacuous_quantifier: 0.12
      redundant_clause: 0.08
      over_constrained: 0.05
      other: 0.02
    exec_sta_taxonomy:
      tautological_premise: 0.03
      vacuous_quantifier: 0.04
      redundant_clause: 0.06
      over_constrained: 0.03
      other: 0.02
    inter_annotator_agreement_kappa: 0.78
  result_rationale: 'The hacking taxonomy distinguishes five shortcut types, derived
    from the Phase 0 pilot analysis and RIP framework. Exec-only training amplifies
    hacking from 25% (base model) to 45% because GRPO''s reward gradient selects for
    outputs that prove easily, and structural shortcuts prove more easily than genuine
    formalizations. The distribution is dominated by tautological premises (18%) and
    vacuous quantifiers (12%) — the two cheapest hacking modes (highest reward-per-character).
    Exec+STA training suppresses hacking to 18% (below base model''s 25%) because
    STA penalizes these modes: tautological premises drop from 18%→3% (STA assigns
    ISR=0 to tautology components), vacuous quantifiers from 12%→4%. Residual hacking
    (18%) consists of subtler shortcuts that partial ISR doesn''t fully penalize —
    primarily redundant clauses (6%) that have small but nonzero ISR contributions.
    SFT''s low hack rate (12%) sets the floor — human-written outputs have few structural
    shortcuts. Inter-annotator agreement κ=0.78 (substantial) is achievable because
    the taxonomy categories have operational definitions tied to STA component ablation
    patterns.

    '

    (ISR tracks prove_rate perfectly because the model hasn''t yet learned structural
    shortcuts). At 500 steps, GRPO''s policy gradient drives prove_rate up to ~0.28
    — substantial improvement from the 0.12 baseline — but the model discovers extensional
    shortcuts: tautological premises, vacuous quantifiers, over-constrained formulas
    that prove trivially. These shortcuts yield solver-verified "correct" outputs
    with degraded internal structure, causing ISR to lag behind prove_rate. The isr_pr_ratio
    drops from ~0.92 (step 1-100, structure intact) to ~0.35 (step 400-500, structural
    degeneracy). This is the classic reward hacking signature: the model maximizes
    the proxy (execution reward) while degrading the latent quality dimension (structural
    fidelity). Three seeds provide sufficient signal to distinguish this trend from
    noise; std ~0.03 reflects Qwen3-4B''s moderate sensitivity to initialization on

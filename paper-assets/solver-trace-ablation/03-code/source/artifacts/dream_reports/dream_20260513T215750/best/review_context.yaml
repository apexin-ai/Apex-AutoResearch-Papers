    The isr_pr_ratio inversion (exec-only 0.33 < exec+STA 0.85) is the quantitative
    headline. Note the base model''s isr_pr_ratio of 0.53 is higher than trained exec-only''s
    0.33 — training actively worsens structural quality under exec-only reward, a
    finding that underscores the need for STA.


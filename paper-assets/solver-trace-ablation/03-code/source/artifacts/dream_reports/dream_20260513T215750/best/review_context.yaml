- name: FOL Exec+STA 500-Step Primary
  plan_id: plan_002
  description: 'FOL single-logic GRPO, execution+STA reward (full continuous STA),
    500 steps, K=8, 3 seeds. Primary validation that STA reward prevents structural
    degradation while maintaining prove_rate.

    '
  expected_results:
    prove_rate_mean: 0.3
    prove_rate_std: 0.03
    prove_rate_first100: 0.16
    prove_rate_last100: 0.34
    mean_isr_overall: 0.19
    mean_isr_last100: 0.22
    isr_pr_ratio_overall: 0.63
    isr_pr_ratio_last100: 0.65
    isr_pr_ratio_first100: 0.48
    parse_rate: 1.0
    combined_reward_mean: 0.24
    training_minutes: 85
    step_time_s: 10.2
  result_rationale: 'Phase 1 pilot (r5) showed exec+STA with 0.5/0.5 weighting depressed
    prove_rate (0.10 vs 0.15 for exec-only) because the STA penalty was too punitive
    at initialization, when the model produces mostly unprovable outputs. At 500 steps
    with curriculum weighting (sigmoid ramp from sta_weight=0.1→0.5 over first 200
    steps), the model first learns to prove (prove_rate rises rapidly steps 1-200
    under near-exec-only reward), then learns to prove structurally (ISR catches up
    steps 200-500 as STA weight activates). The key prediction: prove_rate matches
    or slightly exceeds exec-only (0.30 vs 0.28) because STA reward actively penalizes
    the degenerate shortcuts that exec-only relies on for its final prove_rate gains.
    The model is forced to find structurally sound proofs, which are more robust and
    transfer better. The isr_pr_ratio stabilizes at ~0.65 instead of degrading to
    0.35 — this is the headline comparison. The initial dip in isr_pr_ratio (0.48
    at step 1-100) reflects the low-STA-weight curriculum phase where behavior approximates
    exec-only; it then recovers as STA weight ramps up.

    '

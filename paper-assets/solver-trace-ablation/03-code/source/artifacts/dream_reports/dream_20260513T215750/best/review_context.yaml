- name: SMT-LIB Single-Logic GRPO
  plan_id: plan_010
  description: 'SMT-LIB third logic type: exec-only vs exec+STA (500 steps, K=8, 1
    seed). Stretch goal.

    '
  expected_results:
    smt_exec_only_prove_rate: 0.18
    smt_exec_sta_prove_rate: 0.19
    smt_isr_pr_ratio_exec_only: 0.38
    smt_isr_pr_ratio_exec_sta: 0.52
    smt_isr_discriminability: 0.35
    smt_hacking_modes:
    - trivial_assertions
    - over_constrained_declares
    - unused_variables
  result_rationale: 'SMT-LIB is the hardest logic type for Qwen3-4B: the syntax is
    S-expression-based (less represented in pretraining), Z3''s error messages are
    less informative for learning, and the constraint satisfaction paradigm is structurally
    different from theorem proving. Prove_rate is lower (0.18 exec-only) but still
    above baseline. SMT-LIB STA uses constraint ablation: remove each assert/declare,
    check if (check-sat) result changes. Hacking modes are SMT-specific: trivial assertions
    (assert true), over-constrained declarations (declaring variables with unit domains),
    unused variables. ISR discriminability (0.35) is lower than FOL (0.72) because
    SMT-LIB programs have fewer independently ablatable components (many assertions
    are interdependent). The exec+STA benefit is present but smaller (isr_pr_ratio
    0.52 vs 0.38) — still validates the methodology but with less dramatic effect,
    consistent with the coarser ISR signal.


      - '0.28'
    - - mean_isr
      - '0.19'
      - '0.04'
      - '0.11'
    - - isr_pr_ratio_last100
      - '0.65'
      - '0.15'
      - '0.35'
    - - isr_discriminability
      - '0.72'
      - '0.08'
      - —
    - - wall-clock overhead
      - +7%
      - +1%
      - baseline
  figures_description:
  - 'Figure 6: Three-way isr_pr_ratio trajectory plot (O(N), O(1), exec-only). O(N)
    is stable at ~0.65; O(1) and exec-only both decline, with O(1) declining faster
    (to 0.15) because the tautology penalty pushes the model toward even more exotic
    shortcuts.'
  analysis: 'The O(1) negative result is essential for the paper''s methodology argument.
    It demonstrates that STA''s value comes from comprehensive component ablation
    (O(N) cost per output), not from any single structural check. This motivates the
    5-step RIP derivation protocol: each logic type has its own hacking modes, and
    the ablation set must cover them all. The O(1) result also preempts reviewer concern
    about STA''s computational cost — yes, it''s O(N) per component, but O(1) approximations
    demonstrably fail, so the cost is necessary. The slightly worse isr_pr_ratio for
    O(1) vs exec-only (0.15 vs 0.35) suggests the tautology penalty actively worsens
    structural diversity by forcing the model into a narrower set of non-tautological
    shortcuts.

    '
- name: STA Reward Weight Ablation
  plan_id: plan_005
  description: 'Test α/β ratios (0.3/0.7, 0.5/0.5, 0.7/0.3) × {fixed, sigmoid curriculum}.
    6 runs × 500 steps × 1 seed = 6 runs total.

    '
  expected_results:
    fixed_03_07_prove_rate: 0.2
    fixed_03_07_isr_pr_ratio: 0.72
    fixed_05_05_prove_rate: 0.25
    fixed_05_05_isr_pr_ratio: 0.68
    fixed_07_03_prove_rate: 0.3
    fixed_07_03_isr_pr_ratio: 0.52
    curriculum_03_07_prove_rate: 0.26
    curriculum_03_07_isr_pr_ratio: 0.7
    curriculum_05_05_prove_rate: 0.3
    curriculum_05_05_isr_pr_ratio: 0.65
    curriculum_07_03_prove_rate: 0.32
    curriculum_07_03_isr_pr_ratio: 0.55
    best_config: curriculum α=0.5 β=0.5
  result_rationale: 'The weight ablation reveals a clear Pareto frontier trading prove_rate
    against structural quality. Fixed weighting shows the expected tradeoff: higher
    STA weight (β=0.7) produces highest isr_pr_ratio (0.72) but lowest prove_rate
    (0.20) because the STA penalty is too punitive during early training when the
    model cannot yet produce provable outputs. Lower STA weight (β=0.3) produces near-exec-only
    prove_rate (0.30) but only moderate structural benefit (isr_pr_ratio 0.52 vs exec-only''s
    0.35). The sigmoid curriculum consistently Pareto-dominates fixed weighting at
    the same terminal α/β: curriculum 0.5/0.5 matches fixed 0.7/0.3''s prove_rate
    (0.30) while achieving higher isr_pr_ratio (0.65 vs 0.52). This is because the
    curriculum allows exec-reward-dominated early learning (the model first learns
    to prove) before STA activates (forcing structural quality). The optimal configuration
    is curriculum α=0.5/β=0.5 — it achieves the best prove_rate × isr_pr_ratio product
    (0.30 × 0.65 = 0.195) and lies at the Pareto knee. Curriculum α=0.7/β=0.3 achieves
    marginally higher prove_rate (0.32) but substantially lower structural quality
    — diminishing returns on the accuracy axis.

    '

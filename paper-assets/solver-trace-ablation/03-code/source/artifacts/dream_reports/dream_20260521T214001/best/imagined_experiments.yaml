    premise_count_variance_explained_pct: 45
  result_rationale: 'ISR = (Σ LOO contribution) / N_components。N_components 是分母——premise
    count 越多，ISR 的 dynamic range 越大（更多 component 可贡献非零 LOO）。 genuine proofs 使用更多 premises（真正的多步推理需要更多前提），因此
    ISR 和 genuine status 之间的关联部分是 premise count 的 confound。

    控制 premise count 的方法：对每个 ISR sample，从 random condition 中 匹配 premise count 相同的
    sample，计算 matched OR。预期：Spearman ρ(ISR, premise_count) ≈ 0.67 (强正相关)，说明 ISR 值大幅受
    proof complexity 影响。matched OR 从 3.48 降至 ~1.12 (n.s.)——ISR 的 genuine advantage
    几乎完全由 "genuine proofs have more premises" 解释。质量 multiplier 从 1.06× 降至 1.02× (indistinguishable
    from 1.0)。

    因果方向：complexity → ISR → apparent_quality，而非 ISR_reward → better_reasoning → genuine。ISR
    是 proof complexity 的 proxy，不是 reasoning quality 的 proxy。这是 methodological contribution：
    LOO ablation metrics 在不控制 proof complexity 时产生 spurious signal。

    '
  tables:
  - name: 'Table 7: Premise-count-matched ISR analysis'
    columns:
    - metric
    - unmatched
    - matched
    - interpretation
    rows:
    - - genuine OR (ISR vs Random)
      - 3.48
      - 1.12
      - selection effect
    - - genuine ISR* ratio
      - 1.06×
      - 1.02×
      - no quality diff
    - - ρ(ISR, premise_count)
      - —
      - 0.67
      - strong confound
    - - premise_count explains ISR variance
      - —
      - 45%
      - major confounder
  figures_description:
  - 'Scatter: ISR vs premise count, color=genuine/hacking, regression line'
  - 'Matched-pair violin: ISR distribution before/after premise-count matching'
  analysis: 'Premise-count matching 证明 ISR genuine advantage 是 selection effect。 论文
    framing："ISR is reliable as diagnostic (higher ISR ↔ more complex proof ↔ more
    likely genuine) but the causal arrow runs from proof complexity to ISR, not from
    ISR to reasoning quality。" 这回应 reviewer "ISR improves quality" concern，同时将 confound
    analysis 框架为 positive methodological contribution：LOO metrics 需要 complexity control。

    '

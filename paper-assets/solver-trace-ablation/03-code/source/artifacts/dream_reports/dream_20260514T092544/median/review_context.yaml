    fixed_from_start_isr: 0.18
    fixed_from_start_loss: 0.021
    linear_mid100_pr: 0.71
    linear_mid100_isr: 0.2
    linear_mid300_pr: 0.75
    linear_mid300_isr: 0.22
    sigmoid_is_load_bearing: marginally — ~3pp PR advantage over linear, ~5pp over
      fixed
  result_rationale: 'plan_015 消融的是 plan_005 的凸组合公式（α·r_exec + β·r_exec·ISR, α+β=1）中的
    curriculum。 此公式已被证明 negative（ISR<1 时是 penalty），所以 curriculum 差异在 fundamentally
    broken 的公式上只是 second-order effect。Sigmoid 略优因为它延迟了 ISR penalty 的引入——前 ~200 步 几乎纯
    exec reward（sigmoid 值≈0），让模型先学会 prove 再施加 ISR 信号。线性 ramp 在前 ~100 步就开始施加 ISR penalty，干扰
    prove 学习。固定 weighting 从 step 1 就有 ISR penalty，最差。 但差异仅 3-5pp PR，因为凸公式的根本问题是 ISR<1
    总是 penalty，curriculum 只能延迟而非消除此 问题。论文中一句话："Sigmoid scheduling provided marginal
    improvement (3pp PR) within the convex formulation, but the fundamental penalty
    structure of the convex formula dominates the curriculum effect." 不需要单独 section。

    '

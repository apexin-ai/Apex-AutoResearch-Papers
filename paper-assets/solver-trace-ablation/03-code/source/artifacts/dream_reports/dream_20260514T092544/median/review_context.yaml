- name: STA O(1) vs O(N) ablation
  plan_id: plan_004
  description: fast_isr_fol O(1) 近似 vs full STA O(N) 消融——负面结果文档化
  expected_results:
    fast_isr_full_isr_pearson_r: 0.21
    fast_isr_full_isr_spearman_rho: 0.18
    fast_isr_as_reward_pr: 0.43
    fast_isr_as_reward_isr: 0.08
    fast_isr_discrimination_auroc: 0.56
    full_sta_samples_per_sec: 0.3
    fast_isr_samples_per_sec: 3.2
  result_rationale: 'fast_isr_fol 使用单组件采样近似 LOO，将 O(N) 降至 O(1)。但 ISR 的鉴别力来自完整消融——
    每个组件的 necessity 需要独立测试。O(1) 近似相当于随机选一个组件测 necessity，其结果与整体 ISR 的相关性极低（r≈0.21），因为
    hacking outputs 通常有 10+ 组件，单次采样 variance 极大。作为 reward 使用时，noisy ISR 估计等同于随机噪声，模型无法从中学到结构信号（PR=0.43
    低于 exec-only baseline）。 这是典型的 bias-variance tradeoff 失败：O(1) 消除了 bias 但 variance
    过大。10x 速度提升不弥补 信号质量损失。

    '
  tables:

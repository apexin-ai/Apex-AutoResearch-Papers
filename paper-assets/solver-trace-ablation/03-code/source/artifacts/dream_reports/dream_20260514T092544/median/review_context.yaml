    2-3 modes partial）'
  analysis: 'Prolog 训练收敛但 ISR 诊断力弱于 FOL。rule ablation 作为 STA instantiation 在机制上可行，但
    Prolog 的语义结构（规则、回溯、剪枝）使得"组件必要性"的含义更模糊——一个 rule 被删除后 query 失败 可能因为缺少 base case
    而非缺少 meaningful reasoning。Claim 3 只能声明 STA 协议的可移植性 （mechanical transfer），不能声明

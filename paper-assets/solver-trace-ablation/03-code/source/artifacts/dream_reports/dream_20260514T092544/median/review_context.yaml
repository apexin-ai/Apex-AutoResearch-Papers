narrative_guidance: 'Claim 1（ISR 诊断）不受影响——exec-only 3-seed ISR 崩塌轨迹（0.6423→0.1324→0.0027）和
  hacking taxonomy（5 modes） 数据完整。Claim 2 调整：β=0.1 sweet spot 方向性复现但 fragile——3-seed
  mean ISR ratio ~2.1x（s42 强, s43 中, s44 弱），inter-seed variance 大（std~0.11），genuine
  rate delta 缩至 ~3.7pp（不再显著）。措辞弱化为 "directional improvement with high initialization
  sensitivity"，不做显著性声明。Claim 3 降为 Preliminary Evidence：Prolog 训练收敛（PR 0.4–0.7）但 hacking
  模式分类不清晰，ISR 诊断力弱于 FOL。论文重心收缩为 Claim 1（诊断框架 + taxonomy）+ Claim 2（Goodhart 案例研究含不确定性讨论）。seed-variability
  本身升级为发现 （"same hyperparameters, 3 seeds, 3 qualitatively different hacking strategies"），强化
  GRPO 不稳定性论点。 仍投 EMNLP main，scope 收窄。

  '

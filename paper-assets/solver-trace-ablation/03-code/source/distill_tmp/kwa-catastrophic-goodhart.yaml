positioning:
  core_claim: "KL regularization prevents reward hacking only under light-tailed reward error; under heavy-tailed error, policies can achieve arbitrarily high reward with no utility gain over the base model (catastrophic Goodhart)."
  key_results: "Current reward models empirically have light-tailed error, but heavy-tailed distributions are pervasive in real-world applications, making future catastrophic Goodhart plausible."
  limitations:
    - "current reward models appear light-tailed, so the failure mode is more a future risk than a present one"
    - "tail measurement method is adapted from discrete optimization, may not scale"

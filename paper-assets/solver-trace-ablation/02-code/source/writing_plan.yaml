  - table_id: tab1_goodhart_landscape
    caption: "Goodhart landscape: ISR-as-reward across dose and formulation. All eval on ProofWriter-FOL-100 via eval\\_sta.py."
    placement: experiments
    type: comparison
    columns: [Condition, Formula, β, Seed, PR↑, ISR↑, H7%, H1%, Genuine%, Mode]

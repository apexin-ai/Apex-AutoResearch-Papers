    ≥80% hacking → "degeneration is not 4B-scale-specific". Different
    hacking mode distribution is also informative (scale-dependent taxonomy).
    98GB GPU can handle 8B GRPO.'
  priority: P0
  gpu_budget_hours: 12
  deps: []

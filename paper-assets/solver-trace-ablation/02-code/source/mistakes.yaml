  severity: high
  summary: D143 启动前 GPU 空闲 9 小时：D142-ext 11:12 UTC 完成，20:08 UTC 仍无训练进程
  root_cause: Agent RESET 后队列中第一条是过时的双 GPU 指令（引用不存在的 cuda:1），Agent 长时间 processing

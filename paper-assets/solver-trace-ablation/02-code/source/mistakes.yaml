- id: M007
  date: '2026-05-18'
  category: communication
  severity: high
  summary: PDF compiled from stale docs/paper/ directory, missing 5 commits of fixes
  root_cause: 项目有两个 paper 目录：paper/（git-tracked, Paper Agent 编辑目标）和 docs/paper/（旧副本）。Director
    编译 PDF 时用了 docs/paper/，导致发给用户的 PDF 不包含 Round 11 的任何修改（5 commits）。两个目录从 Round 10

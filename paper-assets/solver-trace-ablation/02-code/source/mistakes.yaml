mistakes:
- id: M001
  date: '2026-05-16'
  category: agent_behavior
  severity: medium
  summary: exec-only-s43-1000step 连续 4 次失败：bad args → OOM → no conda。Agent 未参照成功实验的完整命令。
  root_cause: Agent 每次从零拼命令而非复制成功实验 (plan016) 的完整启动命令。导致反复遗漏环境配置（conda 激活、正确的环境变量名、batch
    size 调整）。
  prevention: 提交训练实验时，Director 或 Agent 必须先从 registry 找到同配置成功实验的启动命令作为模板，仅修改 seed/output_dir
    等差异项。禁止从零构造命令。完整命令必须包含：conda 激活 + CUDA_VISIBLE_DEVICES + PYTORCH_CUDA_ALLOC_CONF
    + cd project_dir + python 调用。
  status: active
  fix: Reviewer 提供了参照 plan016 的完整正确命令，包含 conda 激活和正确环境变量。
- id: M002
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: /tmp/dryrun 21GB 撑满根分区导致两个训练实验同时崩溃
  root_cause: /tmp/dryrun 目录积累到 21GB，根分区仅 30GB，写入失败导致 plan018-random-b01-s45 (step
    209) 和 sweep-random-b005-s42 (step 301) 同时崩溃。两实验同时死亡 = 系统级问题，非 OOM。
  prevention: 1. 训练前检查根分区剩余空间（df -h /），低于 5GB 告警。2. 定期清理 /tmp 下临时目录。3. 训练输出目录应指向数据盘（/root/autodl-tmp）而非根分区。4.
    添加训练启动前的磁盘空间预检 assert。
  status: active
  fix: 清理 /tmp/dryrun（释放 21GB），删除崩溃实验的部分 checkpoint，从 base model 重新训练 500 步。
- id: M003
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: autodl-tmp 磁盘 250G/250G 满导致 Wave 2 两实验崩溃（M002 /tmp 后第二次磁盘事故）
  root_cause: 完成实验的 checkpoint（每个 31G）未及时清理。7 个已 eval 的实验累积 217G 占满磁盘。Wave 1 eval
    完成后未检查磁盘剩余空间就启动 Wave 2。
  prevention: 1. 实验 eval 完成后立即清理 checkpoint（保留 eval_results.json + classify_h7 输出到
    eval_archive）。2. 每次启动新实验前 Agent 必须检查磁盘剩余空间（df -h /root/autodl-tmp），< 50G 则先清理。3.
    考虑在训练脚本中只保留最后一个 checkpoint 而非全部。
  status: active
  context: 'Wave 2 experiments sweep-random-b005-s43 crashed at step 50 (checkpoint
    save), sweep-isr-b005-s43 about to crash. Second disk incident after M002 (/tmp/dryrun
    21GB). Pattern: never checking disk before launching experiments.'
  fix: 批准删除 7 个已 eval 的 checkpoint 目录（~217G），备份 eval_results.json 到 eval_archive，从头重启两个实验。
- id: M004
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: D129 random control 使用了 random_reward 而非 additive_random，与 s42 基线不可比
  root_cause: Agent 在创建 D129 random 实验 spec 时未核对 s42 基线的 reward_mode 参数。random_reward
    和 additive_random 是两个完全不同的函数（random 占比 50% vs 9.1%），但名称相近容易混淆。
  prevention: 创建跨 seed 复现实验时，必须从 registry 中提取 s42 基线的完整命令行，逐参数核对 reward_mode / beta
    / exec_weight / sta_weight。名称相近的 reward mode 需要对照代码确认函数签名。
  status: active
  context: d129-1.7b-random-b01-s43 用 --reward_mode random_reward（proved reward [0.5,1.0],
    random 占 50%），s42 基线用 --reward_mode additive_random --beta 0.1（proved reward [1.0,1.1],
    random 占 9.1%）。train_grpo.py line 198 vs 225。
  fix: Kill 错误 run，标 FAILED，用 additive_random --beta 0.1 重跑。同时检查 s44 和 isr-b03 的 spec。
- id: M005
  date: '2026-05-18'
  category: resource_misuse
  severity: medium
  summary: isr-b03-s43 训练在 step 100 因磁盘满崩溃，浪费 ~100 步 GPU 时间 + 3h 空闲（cron 回调丢失）
  root_cause: outputs/ 累积 127GB 未清理；Agent session 重启后 cron 监控丢失，训练崩溃无人发现。
  prevention: 1. 启动训练前检查磁盘余量（df -h），低于 20% 先清理旧 outputs。2. Agent session 重启后必须重建所有
    RUNNING 实验的 cron 监控。3. 长时间训练设置 checkpoint resume 而非从头开始。
  status: active
  fix: 清理旧文件腾出空间，从头重启训练。84GB 余量足够完成 D129 剩余实验。

- name: Cross-logic hacking taxonomy (FOL × Prolog)
  plan_id: plan012-extended (cross-logic)
  description: 对 FOL (plan012 已完成) 和 Prolog (plan006) exec-only 输出做 hacking 模式分类学对比，验证跨逻辑共享模式数
    ≥ 3。

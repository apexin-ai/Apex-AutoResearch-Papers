    |-----------|-----------|-------------|-----------|

    | exec-only | 0.72 | 0.09 | 8.1 |

    | exec+STA β=0.1 | 0.67 | 0.24 | 5.4 |

    | ISR improvement | — | 2.67x | 0.67x |

    '
  figures_description:
  - 'Fig: 三逻辑 ISR improvement radar chart (FOL 2.96x, Prolog 2.99x, SMT-LIB 2.67x)。三种逻辑的改善幅度在
    2.5-3.0x 区间内。'
  analysis: 第三种逻辑进一步巩固 Claim 3。三逻辑 ISR improvement 在 2.67-2.99x 区间的一致性表明 STA 的 LOO
    ablation 原则是 solver-agnostic 的—— 只要 solver 接受结构化输入且 reward 是二值的，STA 就适用。 若 SMT-LIB
    实验在 submission 前完成，从两逻辑升级为三逻辑将 显著增强泛化性 claim。否则作为 appendix 或 camera-ready 追加。
- name: Qwen3-8B model scale effect
  plan_id: plan011
  description: Qwen3-8B (vs 0.5B baseline) 上运行 exec-only + exec+STA GRPO。 测试模型规模对
    reward hacking 和 ISR 诊断的影响。
  expected_results:
    exec_only_pr: 0.96
    exec_only_isr: 0.19
    exec_only_component_count_mean: 6.2
    exec_only_hacking_rate: 0.68
    exec_sta_b01_pr: 0.92
    exec_sta_b01_isr: 0.42
    exec_sta_b01_genuine_rate: 0.35
    pr_retention: 0.958
  result_rationale: 8B 模型有更大的 representation capacity，能在不完全牺牲结构的情况下 实现高 PR。因此 exec-only
    ISR (0.19) 高于 0.5B (0.12)——更大模型 保留更多 "附带" 的结构信息。但 hacking 仍存在 (68%)，说明 reward
    hacking 不纯粹是 capacity 问题，而是 optimization objective 问题。ISR β=0.1 在 8B 上效果更显著 (ISR
    0.42 vs 0.5B 的 0.34)， 因为更大模型有更多容量来同时优化 PR 和结构质量。 PR retention (0.92/0.96 = 95.8%)
    优于 0.5B (0.81/0.93 = 87.1%)， 说明在 sufficient capacity 下 ISR 信号的 PR cost 接近零。
  tables:
  - '| Scale | Condition | PR | ISR | genuine % | hacking % |

    |-------|-----------|-----|-----|-----------|-----------|

    | 0.5B | exec-only | 0.93 | 0.12 | ~18% | ~82% |

    | 0.5B | ISR β=0.1 | 0.81 | 0.34 | 26% | 74% |

    | 8B | exec-only | 0.96 | 0.19 | ~32% | ~68% |

    | 8B | ISR β=0.1 | 0.92 | 0.42 | 35% | 65% |

    '
  figures_description:
  - 'Fig: Scale × condition interaction plot (2×2)。8B 在两种条件下均优于 0.5B，但 ISR β=0.1 的改善幅度在两种规模上一致
    (ISR ratio ≈ 2.2x)。'
  analysis: Scaling 降低 hacking rate (82%→68% exec-only) 但不消除它。 这是重要发现：即使 frontier-scale
    模型也需要 ISR 诊断。 ISR β=0.1 在更大模型上的 diminishing Goodhart risk (PR retention 95.8%
    vs 87.1%) 暗示 sweet spot 可能随模型规模右移， 未来工作可探索 larger β at larger scale。
- name: Curriculum ablation (sigmoid vs linear vs fixed)
  plan_id: plan015
  description: 测试 ISR reward 的 curriculum scheduling：sigmoid ramp (baseline) vs linear
    ramp vs fixed weight。Sigmoid 是 plan005 的最佳配置 但未做消融。
  expected_results:
    sigmoid_eval_pr: 0.77
    sigmoid_eval_isr: 0.23
    sigmoid_midpoint_step: 200
    linear_eval_pr: 0.73
    linear_eval_isr: 0.19
    fixed_b01_eval_pr: 0.81
    fixed_b01_eval_isr: 0.34
    fixed_b03_eval_pr: 0.18
    fixed_b03_eval_isr: 0.03
    sigmoid_vs_linear_isr_delta: 0.04
    linear_midpoint100_pr: 0.7
    linear_midpoint300_pr: 0.75
  result_rationale: 注意：plan005 使用凸组合公式 (α·r_exec + β·r_exec·ISR, α+β=1)， 而 plan002-b01
    使用乘法公式 (r = r_exec·(1+β·ISR))。plan015 需要 在两种公式下分别测试 curriculum。 Fixed β=0.1 (plan002-b01
    已验证) 是最佳 fixed 配置。Sigmoid 和 linear ramp 在凸组合公式下有效果，因为 early ISR penalty (ISR<1
    时) 需要 逐步引入以避免早期训练崩塌。但在乘法公式下，ISR 只能 bonus， curriculum 的意义降低——fixed β=0.1 已经是 "permanently
    gentle bonus"， 不需要 ramp。 Sigmoid 略优于 linear (ISR 0.23 vs 0.19) 因为 sigmoid 的 S-curve
    在中期 (step 150-250) 快速提升 ISR weight，比 linear 的匀速增长 更好地利用了模型已学到基础证明能力的时间窗口。 Midpoint
    影响：100 (过早) 导致 early ISR pressure → PR 降； 300 (过晚) 使 ISR signal 在后 200 步才充分生效，改善有限。
  tables:
  - '| Curriculum | Formula | eval PR | eval ISR | optimal midpoint |

    |-----------|---------|---------|----------|------------------|

    | Fixed β=0.1 | multiplicative | **0.81** | **0.34** | N/A |

    | Sigmoid (midpoint=200) | convex | 0.77 | 0.23 | 200 |

    | Linear (midpoint=200) | convex | 0.73 | 0.19 | 200 |

    | Fixed β=0.3 | multiplicative | 0.18 | 0.03 | N/A (Goodhart) |

    '
  - '| Linear midpoint | eval PR | eval ISR |

    |----------------|---------|----------|

    | 100 | 0.70 | 0.17 |

    | 200 | 0.73 | 0.19 |

    | 300 | 0.75 | 0.15 |

    '
  figures_description:
  - 'Fig: Curriculum schedule curves (sigmoid vs linear vs fixed) overlaid with training
    ISR trajectory。Fixed β=0.1 multiplicative 的 ISR 增长最稳定。'
  analysis: 关键发现：在乘法公式 r = r_exec·(1+β·ISR) 下，curriculum scheduling 的边际价值很小——fixed
    β=0.1 已经是最优。这是因为乘法公式中 ISR 只能 是 bonus (≥0)，不存在 early penalty 问题。Sigmoid curriculum
    主要 对凸组合公式有价值（避免 ISR<1 时的 penalty 效应）。 论文应在 ablation 中简短报告此结果，结论：乘法公式 + fixed β=0.1
    是最简洁有效的配置，无需 curriculum 复杂化。

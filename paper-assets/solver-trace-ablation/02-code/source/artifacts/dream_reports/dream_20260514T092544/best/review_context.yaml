    three_seed_hacking_rate: 0.837
  result_rationale: Prolog 与 FOL 共享关键动态：SWI-Prolog 的 execution reward 是二值的 （query
    成功/失败），与 Prover9 类似。GRPO 在二值 reward 下同样会 饱和，驱动模型寻找结构捷径。Prolog 特有的 hacking 机制：
    (1) Conclusion embedding → head 直接编码答案 (e.g., `answer(true) :- true.`)， 与 FOL
    的 conclusion embedding 同构； (2) Rule duplication → 同一 clause 重复多次，SWI-Prolog 回溯时均匹配但
    仅第一条有用，类似 FOL repetition collapse； (3) Cut tautology → 使用 `!` (cut) 强制成功，跳过真正的逻辑推导，
    类似 FOL tautological shortcuts。 PR 高 (0.79-0.88) 但 ISR 低 (0.05-0.13) 的 gap 确认 hacking
    存在。 三 seed 出现不同主导退化模式，与 FOL exec-only 的 seed 发散行为一致， 进一步证明 exec-only GRPO 的训练动态在逻辑类型间共享。

  result_rationale: '4 种模式跨 FOL/Prolog 共享，因为这些退化策略根植于 exec-only GRPO 的共同机制，而非逻辑语言的语法特性：
    (1) Conclusion embedding: 在任何形式语言中，将结论直接编码为前提是最小化 证明复杂度的通用策略。FOL 中表现为 `conclusion
    = conclusion` 组件， Prolog 中表现为 `answer(X) :- X = true.`； (2) Repetition/duplication:
    GRPO 的 KL penalty 约束使模型倾向于重复 已知有效的模式，FOL 重复 premise，Prolog 重复 clause； (3) Tautological:
    利用逻辑系统的 trivial truth 路径，FOL 用矛盾爆炸， Prolog 用 cut (!) 强制成功； (4) Complexity-without-utility:
    添加不影响证明的多余组件以 "看起来" 复杂。 FOL-specific 的 vacuous truth (空域量词) 在 Prolog 中无对应物（Prolog
    无量词）。Prolog-specific 的 backtracking exploitation (利用回溯搜索偶然 找到答案) 在 FOL 中无对应物（Prover9
    无回溯机制）。 Jaccard similarity 4/(5+5-4)=0.667 表明 hacking 策略空间高度重叠。'
  tables:
  - '| Hacking Mode | FOL | Prolog | Shared? | Mechanism |

    |-------------|-----|--------|---------|-----------|

    | Conclusion embedding | 72.8% (ISR b01) | 62% | ✓ | 结论直接编码为前提 |

    | Repetition / duplication | observed (s43) | 12% | ✓ | 有效模式重复 |

    | Tautological shortcuts | observed (s44) | 8% | ✓ | trivial truth 路径 |

    | Complexity-without-utility | 3.8% (random) | 2% | ✓ | 无用组件填充 |

    | Vacuous truth exploitation | observed | — | FOL-only | 空域量词 |

    | Backtracking exploitation | — | 5% | Prolog-only | 回溯搜索偶然命中 |

    '
  figures_description:
  - 'Fig: Venn diagram — FOL 和 Prolog hacking 模式的重叠。4 shared, 1 FOL-only, 1 Prolog-only。'
  - 'Fig: Stacked bar chart — FOL vs Prolog exec-only 输出的模式分布。Conclusion embedding
    在两种逻辑中均为主导模式。'
  analysis: 4 种共享模式 (≥3 threshold) 证明 hacking 策略是 GRPO + binary reward 动态的系统性产物，而非逻辑语言特异的巧合。这支持将
    STA 框架描述为 "solver-agnostic diagnostic protocol"。论文应强调：共享模式反映共同的 优化动态（GRPO 饱和 →
    梯度消失 → 结构捷径），而逻辑特异模式反映 语言特有的可利用结构（FOL 量词 vs Prolog 回溯）。
- name: Multi-logic joint GRPO (FOL + Prolog)
  plan_id: plan007
  description: FOL + Prolog 联合训练，exec-only vs exec+STA，500 步，K=8，1 seed。 测试跨逻辑联合训练的
    transfer 效应。
  expected_results:
    joint_exec_fol_pr: 0.72
    joint_exec_fol_isr: 0.1
    joint_exec_prolog_pr: 0.68
    joint_exec_prolog_isr: 0.07
    joint_sta_fol_pr: 0.67
    joint_sta_fol_isr: 0.21
    joint_sta_prolog_pr: 0.63
    joint_sta_prolog_isr: 0.18
    single_vs_joint_fol_pr_delta: -0.21
    single_vs_joint_prolog_pr_delta: -0.16
  result_rationale: 联合训练在容量受限的 0.5B 模型上引入 task competition：两种逻辑 共享 transformer 参数，导致
    per-task PR 均低于单逻辑训练 (FOL 0.72 vs 0.93, Prolog 0.68 vs 0.84)。ISR 比例也略降。这是 multi-task
    learning 在小模型上的已知 tradeoff——容量不足以同时掌握两种逻辑语法。 exec+STA 联合训练的 ISR 仍高于 exec-only
    (FOL 0.21 vs 0.10, Prolog 0.18 vs 0.07)，说明 ISR bonus 的结构引导在多任务设置下仍有效， 但改善幅度 (2.1x/2.6x)
    低于单逻辑的 3x，暗示容量瓶颈限制了 structural improvement 的上限。
  tables:
  - '| Condition | FOL PR | FOL ISR | Prolog PR | Prolog ISR |

    |-----------|--------|---------|-----------|------------|

    | Joint exec-only | 0.72 | 0.10 | 0.68 | 0.07 |

    | Joint exec+STA β=0.1 | 0.67 | 0.21 | 0.63 | 0.18 |

    | Single exec-only (ref) | 0.93 | 0.12 | 0.84 | 0.09 |

    | Single exec+STA (ref) | 0.81 | 0.34 | 0.76 | 0.26 |

    '
  figures_description:
  - 'Fig: Single vs Joint training comparison grouped bar chart。PR 在 joint 中下降，ISR
    improvement ratio 也压缩。'
  analysis: Joint training 在当前模型规模下是 net negative for per-task performance。 但这并非 STA
    协议的失败——ISR signal 在 joint 中仍有效。 论文中应作为 scale limitation 讨论，指向 plan011 (8B model)
    作为 capacity-sufficient 的 future work。对 Claim 3 影响有限： STA protocol 泛化性已由 single-logic
    Prolog 实验证明， joint training 是 additional evidence 非核心证据。
- name: Cross-logic transfer evaluation
  plan_id: plan008
  description: FOL-trained model 在 Prolog tasks 上评估，反之亦然。 测试 formalization 能力的跨逻辑迁移。
  expected_results:
    fol_to_prolog_pr: 0.32
    fol_to_prolog_isr: 0.04
    prolog_to_fol_pr: 0.28
    prolog_to_fol_isr: 0.03
    fol_on_fol_pr_ref: 0.93
    prolog_on_prolog_pr_ref: 0.84
    transfer_ratio_fol_to_prolog: 0.38
    transfer_ratio_prolog_to_fol: 0.3
  result_rationale: 跨逻辑 transfer 有限 (PR 降至 28-32%)，因为 FOL 和 Prolog 的语法 结构本质不同：FOL
    使用量词/连接词/谓词逻辑，Prolog 使用 Horn clauses/ unification/backtracking。GRPO 训练针对特定逻辑语法优化
    token 序列 生成策略，这些策略不跨语法迁移。 然而 30% 的 transfer ratio 高于 random baseline (~12%)，说明
    formalization 的高层语义理解（如何从自然语言提取逻辑结构）有部分共享。 ISR 在 transfer 场景极低 (0.03-0.04)，表明迁移产生的
    formalizations 即使碰巧 proved 也是结构退化的——模型在不熟悉的逻辑中走更多捷径。
  tables:
  - '| Source → Target | PR | ISR | vs in-domain PR |

    |----------------|-----|-----|-----------------|

    | FOL → Prolog | 0.32 | 0.04 | 38% of Prolog in-domain |

    | Prolog → FOL | 0.28 | 0.03 | 30% of FOL in-domain |

    | FOL → FOL (ref) | 0.93 | 0.12 | 100% |

    | Prolog → Prolog (ref) | 0.84 | 0.09 | 100% |

    '
  figures_description:
  - 'Fig: Transfer matrix heatmap (2×2)，对角线高 (in-domain)，off-diagonal 低 (cross-logic)。'
  analysis: Cross-logic transfer 的有限性是预期结果，不影响 STA 论文的核心 claims。 反而支持论点：STA 协议需要 per-logic
    instantiation (rule ablation for Prolog, component ablation for FOL)，不能依赖 model-level
    transfer 替代。 论文应在 Discussion 中简短提及。
- name: SFT baseline comparison
  plan_id: plan009
  description: Supervised finetuning on FOLIO 500，与 GRPO variants 对比。 测试 SFT 是否也出现结构退化。
  expected_results:
    sft_eval_pr: 0.48
    sft_eval_mean_isr: 0.24
    sft_eval_proved_only_isr: 0.5
    sft_eval_component_count_mean: 5.6
    sft_eval_genuine_rate: 0.38
    sft_eval_hacking_rate: 0.62
    sft_vs_grpo_exec_pr: -0.45
    sft_vs_grpo_b01_isr: -0.1
  result_rationale: SFT 复制训练分布而非优化 reward，因此不经历 GRPO 的饱和→hacking 动态。 PR 较低 (0.48 vs
    GRPO 0.93) 因为 SFT 无法通过 trial-and-error 发现 有效但不在训练集中的证明策略。但 proved-only ISR 较高
    (0.50 vs 0.13) 因为 SFT 保留了训练数据中的结构模式。 Genuine rate 0.38 (vs GRPO exec-only ~0.18)
    表明 SFT 的 hacking 更少， 但这是以 PR 天花板为代价的——SFT 不 hack 因为它不 optimize。 这支持论文的核心论点：reward
    hacking 是优化产物，诊断工具 (如 ISR) 在 RL 设置中比 SFT 更需要。
  tables:
  - '| Method | eval PR | eval ISR | proved-only ISR | genuine % | hacking % |

    |--------|---------|----------|-----------------|-----------|-----------|

    | SFT | 0.48 | 0.24 | 0.50 | 38% | 62% |

    | GRPO exec-only (s42) | 0.93 | 0.12 | 0.13 | ~18% | ~82% |

    | GRPO ISR β=0.1 (s42) | 0.81 | 0.34 | 0.42 | 26% | 74% |

    | Pretrained (ref) | 0.12 | 0.06 | 0.64 | ~50% | ~50% |

    '
  figures_description:
  - 'Fig: PR-ISR scatter 四象限图：SFT (中 PR, 中 ISR), GRPO exec (高 PR, 低 ISR), GRPO ISR
    β=0.1 (高 PR, 高 ISR), pretrained (低 PR, 高 proved-only ISR)。GRPO ISR β=0.1 是唯一占据右上象限的条件。'
  analysis: SFT 是重要对照：它展示了无 RL 优化压力时的 baseline 结构质量。 SFT 的 proved-only ISR (0.50)
    接近 pretrained (0.64)，确认 structural degeneration 是 RL 优化的副产物。GRPO ISR β=0.1 是 唯一同时保持
    high PR 和 reasonable ISR 的条件——比 SFT 高 PR (0.81 vs 0.48) 且 ISR 相当 (0.34 vs 0.24)，是最佳
    PR-ISR tradeoff。
- name: SMT-LIB single-logic GRPO (third logic)
  plan_id: plan010
  description: SMT-LIB 单逻辑 GRPO，exec-only vs exec+STA，500 步。 第三种逻辑类型验证 STA 协议泛化性。
  expected_results:
    exec_only_pr: 0.72
    exec_only_isr: 0.09
    exec_only_component_count_mean: 8.1
    exec_sta_b01_pr: 0.67
    exec_sta_b01_isr: 0.24
    exec_sta_b01_component_count_mean: 5.4
    isr_improvement_ratio: 2.67
    hacking_modes_shared_with_fol: 3
    hacking_modes_shared_with_prolog: 3
  result_rationale: SMT-LIB 使用 Z3 solver，constraint satisfaction 语义与 FOL/Prolog 不同（声明式约束而非推导式证明），但
    binary execution reward 的动态 相同。Exec-only 出现 hacking (PR 0.72, ISR 0.09)，ISR β=0.1
    改善 至 0.24 (2.67x)。SMT-LIB 的 hacking 主要表现为 over-constrained assertions（添加冗余约束使
    sat/unsat 结果不变）和 trivial assertions （直接 assert 结论）。与 FOL/Prolog 共享 conclusion
    embedding、 redundancy、tautological 三种模式。 ISR improvement ratio (2.67x) 略低于 FOL/Prolog
    的 3x，可能因为 SMT-LIB 的 constraint structure 比 FOL premise structure 更刚性， ISR 信号的
    reward shaping 空间更小。
  tables:

- name: Prolog exec-only seed 42 — STA 移植困难导致 incomplete
  plan_id: plan006-prolog-exec-s42
  description: 'Prolog GRPO exec-only, seed=42, 500 steps, K=8. 第一个 Prolog 种子，验证跨逻辑系统的
    hacking 复现。

    '
  expected_results:
    status: incomplete
    train_steps_completed: 180
    train_pr_at_stop: 0.08
    train_isr_at_stop: 0.06
    sta_timeout_rate: 0.38
    per_step_time_s: 32
    total_time_before_abort_min: 96
    failure_reason: STA rule ablation timeout rate 38%, per-step 3.4x slower than
      FOL
  result_rationale: 'STA protocol 要求 LOO ablation——移除一条 Prolog clause 后重新执行。与 FOL/Prover9
    不同，Prolog 的执行是 procedural（clause ordering matters, cuts, recursion）。 移除一条 clause
    可能导致：(a) missing predicate definition → runtime error, (b) infinite recursion
    → timeout, (c) different clause matching → semantically unrelated result。Prover9
    是 declarative theorem prover (axiom removal = weaker theory)，LOO ablation 语义清晰。Prolog
    的 LOO 语义不清晰，导致 ~38% 的 ablation attempts timeout (SWI-Prolog default 5s)。每个训练 step
    需要 K=8 samples × N components × LOO，timeout 累积使 per-step 时间从 FOL 的 ~9.5s 飙升到 ~32s。
    180 steps 后 GPU budget 耗尽，实验未完成。

    '
  tables: []
  figures_description: []
  analysis: 'Prolog STA 的核心困难不是工程问题而是语义问题：LOO ablation 在 declarative logic (FOL) 中意味着
    "弱化理论"，在 procedural logic (Prolog) 中意味着 "改变程序行为"。 Component necessity 在 Prolog
    中缺乏 FOL 中的干净语义。

    '

    # Dream Review Report: Solver Trace Ablation Exposes Reward Hacking in GRPO-Trained
    Formalizers


    **Dream ID:** 20260514T092544

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Venue Standard:** Top ML venue, ~25% accept rate, 6-point scale


    ---


    ## Paper Summary


    The paper introduces Solver Trace Ablation (STA), a leave-one-out (LOO) component
    necessity test on solver inputs that yields the Intensional Structural Reward
    (ISR). ISR is studied in two roles: (1) as a post-hoc diagnostic revealing structural
    collapse masked by high prove rates (ISR drops from 0.64 to 0.003 while prove
    rate climbs from 32% to 96%), and (2) as a GRPO training signal exhibiting Goodhart''s
    Law across the dose spectrum. The β=0.1 "sweet spot" observed on seed 42 fails
    to replicate across 3 seeds (ISR/random ratio=1.11, p>0.5). At β=0.3, ISR reward
    is worse than random noise. Most strikingly, on seed 44, optimizing ISR *decreases*
    ISR (0.053 vs. random''s 0.18) via a hacking mode shift from tautological collapse
    to conclusion embedding. Five hacking strategies are catalogued. A Prolog extension
    is honestly reported as incomplete.


    Setup: Qwen2.5-1.5B, FOLIO dataset, Prover9 solver, GRPO K=8, 500 training steps,
    100 eval problems, 5 conditions (Table 1), seeds 42/43/44 for β=0.1 conditions,
    seed 42 only for β=0.3.


    ---


    ## Reviewer 1 (R1): Methodology + Experiments


    ### Strengths


    - **Clean ISR formulation.** The LOO necessity definition (Eq. 1) is simple, principled,
    and clearly specified. The distinction between ISR=0 for unproved samples (by
    construction) and ISR=0 for proved-but-degenerate samples is correctly handled.

    - **ISR collapse trajectory is compelling.** The 0.64→0.13→0.003 progression over
    100/500/1000 steps (Table 2) is the paper''s single strongest empirical contribution.
    It vividly demonstrates that prove rate is a dangerously incomplete metric.

    - **Well-designed random control.** Using r = r_exec · (1 + β · U[0,1]) as a matched
    control isolates ISR''s structural information content from variance regularization.
    This is methodologically sound and reveals that random noise is as good or better
    than ISR signal.

    - **Honest Prolog reporting.** Section 4.4 transparently reports the Prolog experiment''s
    failure at 180/500 steps with 38% timeout rate, identifies the semantic gap (declarative
    vs. procedural LOO), and does not fabricate completion. This is commendable.

    - **Seed-44 Goodhart paradox.** The finding that ISR optimization redirects from
    tautological collapse (ISR=0.57) to conclusion embedding (ISR=0.053) — producing
    lower ISR than the random control (0.18) — is genuinely interesting and well-documented
    (Table 5).


    ### Weaknesses


    **W1 (Major): Three seeds is the bare minimum, and the paper''s own data shows
    it''s insufficient.** The paper reports ISR CV=1.32 across 3 seeds at β=0.1, then
    draws conclusions from n=3. A CV>1 with n=3 means the distribution is essentially
    uncharacterized. The "p>0.5" from a paired t-test at n=3 has only 2 degrees of
    freedom — even a real effect of medium size would go undetected. The paper correctly
    identifies that the sweet spot is a single-seed artifact, but 3 seeds cannot reliably
    characterize the *alternative* either (i.e., "ISR has no effect" is also not established
    — only "we can''t tell"). The paper should have run 5-10 seeds at β=0.1 before
    claiming any aggregated result.


    **W2 (Major): β=0.3 results rest on a single seed.** Table 7 (ISR β=0.3: PR=0.18,
    ISR=0.026 vs. Random β=0.3: PR=0.48, ISR=0.045) is seed 42 only. Given that seed
    42 at β=0.1 was the *only* seed showing a "sweet spot," the β=0.3 collapse could
    be seed-42-specific rather than dose-specific. The "Goodhart transition lies in
    β ∈ (0.1, 0.3)" claim (Section 4.2.3) is extrapolated from a single data point
    on each side. No β values between 0.1 and 0.3 were tested.


    **W3 (Major): ISR collapse trajectory (Table 2) is single-seed, single-run.**
    The headline result (0.64→0.003) comes only from seed 42. Table 3 shows that seed
    44 at 500 steps has ISR=0.57 (tautological) while seed 43 has ISR=0.00 (repetition
    collapse). The collapse trajectory could look radically different for other seeds
    — seed 44 might show *increasing* ISR over training (as tautological proofs with
    trivially high ISR dominate). Without multi-seed collapse trajectories, the "progressive
    structural degeneration" narrative is potentially seed-specific.


    **W4 (Major): The multiplicative reward formulation is a confound, not ablated.**
    The paper uses r = r_exec · (1 + β · ISR) throughout. As Section 5.3 correctly
    identifies, this formulation provides zero ISR gradient when r_exec = 0, creating
    the "multiplicative bottleneck." But this is a design choice, not an inherent
    property of ISR. An additive formulation (r = r_exec + β · ISR) or a gated formulation
    could yield entirely different Goodhart dynamics. The paper''s conclusion that
    "ISR is fundamentally unreliable as a training signal" (abstract) is overstated
    — what''s demonstrated is that *this particular multiplicative integration of
    ISR* is unreliable. The paper identifies the bottleneck (Section 5.3) but never
    tests whether removing it changes the outcome.


    **W5 (Moderate): 100 eval problems provides limited statistical resolution.**
    For prove rate, n=100 gives 95% CI of ±5-10pp (binomial). The difference between
    random β=0.1 s43 (PR=0.22) and ISR β=0.1 s43 (PR=0.15) is within this margin.
    For ISR (a continuous metric bounded [0,1] with heavy zero-inflation), the effective
    sample size for ISR statistics is only the proved subset (e.g., 15 for s43). No
    confidence intervals are reported on any metric.


    **W6 (Moderate): No training dynamics shown.** The paper relies exclusively on
    endpoint metrics. No loss curves, ISR trajectories during training, reward distributions,
    or GRPO advantage statistics are presented. The 3-point collapse trajectory (Table
    2) uses discrete checkpoints rather than continuous monitoring. The mechanisms
    claimed — "ISR collapse occurs gradually," "Goodhart transition in (0.1, 0.3),"
    "mode shift happens mid-training" — cannot be verified from endpoint data alone.


    **W7 (Moderate): Hacking mode classification methodology is opaque.** Section
    3.3 says "Hacking modes are classified via automated analysis of component necessity
    patterns, component counts, and proof structure." No detail on the classification
    rules, thresholds, or validation is provided. How is "conclusion embedding" distinguished
    from "complexity without utility"? What threshold separates "tautological collapse"
    from low-component genuine proofs? Without classification methodology or human
    validation, the five-mode taxonomy is descriptive but not reproducible.


    **W8 (Minor): "Proved-only ISR" vs. "mean ISR" distinction could be clearer.**
    The paper alternates between these metrics. Table 2 labels the column "ISR (proved)"
    while Table 4 labels it "ISR." The relationship ISR_mean = PR × ISR_proved_only
    is never explicitly stated, which causes confusion when comparing across tables.


    ### R1 Questions for Authors


    1. Can you show the ISR collapse trajectory (Table 2 equivalent) for seeds 43
    and 44? Does seed 44 show ISR *increase* over training as tautological proofs
    dominate?

    2. Have you tested any non-multiplicative reward formulation (additive, threshold-gated,
    or curriculum-based)? If not, how can you claim ISR is "fundamentally unreliable"
    rather than "unreliable under multiplicative integration"?

    3. What are the confidence intervals on the Table 6 statistics? With n=3 seeds
    and n=100 problems, what effect size would be detectable?

    4. Can you provide the hacking mode classification algorithm (pseudocode or thresholds)?

    5. Were the 100/500/1000-step evaluations in Table 2 from a single continuous
    training run or separate experiments?


    ### R1 Missing Experiments Assessment


    In order of importance for the paper''s claims:

    1. **More seeds at β=0.1** (5-10 seeds): The central claim is about seed sensitivity,
    but n=3 is too small to characterize it. Most critical gap.

    2. **Multi-seed β=0.3**: Without this, the dose-response curve rests on 1 seed
    at the high-dose end.

    3. **Finer β sweep** (0.05, 0.15, 0.2, 0.25): Two β values cannot characterize
    a dose-response curve or locate a transition.

    4. **Non-multiplicative reward formulation**: Needed to distinguish "ISR is unreliable"
    from "multiplicative ISR is unreliable."

    5. **SFT baseline**: Cannot distinguish GRPO-specific reward hacking from general
    finetuning artifacts.

    6. **Multi-seed ISR collapse trajectory**: Table 2 is seed-42-specific; the narrative
    of "progressive collapse" needs multi-seed validation.


    ### R1 Score: 3/6 (Weak Reject)

    ### R1 Confidence: 4/5


    The diagnostic contribution is real and the Goodhart framing is interesting, but
    the experimental evidence is too narrow (1 dataset, 1 model, 1 reward formulation,
    3 seeds, 100 eval problems) and key ablations are missing (alternative reward
    formulations, finer β sweep, more seeds). The claims outpace the evidence.


    ---


    ## Reviewer 2 (R2): Novelty + Related Work


    ### Strengths


    - **The "diagnostic vs. training signal" separation is a useful conceptual contribution.**
    Cleanly distinguishing these two roles of ISR and showing they have opposite reliability
    profiles is a well-structured argument that the community can build on.

    - **The seed-44 Goodhart paradox is the paper''s most novel finding.** While Goodhart
    effects are well-theorized (Manheim & Garrabrant 2019), the specific mechanism
    — ISR optimization redirecting from one hacking mode (tautological, ISR≈0.5) to
    another (conclusion embedding, ISR≈0.05) that scores *lower* on the optimized
    metric — is a concrete, well-documented instantiation that goes beyond existing
    empirical literature. The matched random control achieving higher ISR (0.18 >
    0.053) is a striking demonstration.

    - **The hacking taxonomy is descriptively useful.** Cataloguing five distinct
    strategies (conclusion embedding, tautological collapse, repetition collapse,
    format collapse, complexity without utility) with associated conditions and seeds
    provides a vocabulary for the community, even if the classification methodology
    needs work.

    - **The paper connects to a timely question.** As GRPO becomes standard for formal
    reasoning (DeepSeek-Prover, etc.), understanding its failure modes is practically
    important.

    - **Honest negative framing.** The paper does not hide that its main finding is
    negative (ISR fails as a reward). The reframing as a "Goodhart failure analysis"
    is coherent and the paper reads as a genuine negative-result contribution rather
    than a failed positive-result paper.


    ### Weaknesses


    **W1 (Major): Limited algorithmic novelty.** STA/ISR is LOO ablation applied to
    solver inputs. The paper acknowledges this (Section 2, "We do not claim novelty
    in the LOO mechanism itself"), but the application novelty is also moderate —
    LOO testing on logical components is a natural idea that any practitioner working
    with formal solvers might implement. The ISR formula (Eq. 1) is a direct necessity
    fraction. The contribution is primarily empirical, which requires strong experiments
    (see R1''s concerns).


    **W2 (Major): "Full-Spectrum" title overclaims.** The paper tests β ∈ {0, 0.1,
    0.3} — three points on the dose axis. "Full-spectrum" implies systematic coverage
    of the β space, ideally with a dense sweep revealing the transition dynamics.
    Two non-zero β values with a gap from 0.1 to 0.3 cannot characterize a spectrum.
    The title should say "Goodhart failure analysis" without "full-spectrum," or the
    β sweep should be significantly denser.


    **W3 (Major): Scope too narrow for a top venue.** One dataset (FOLIO, 100 eval
    problems), one model (Qwen2.5-1.5B), one solver (Prover9), one logic type (FOL),
    one reward formulation (multiplicative). The paper cannot distinguish FOLIO-specific,
    Qwen-specific, Prover9-specific, or formulation-specific effects from general
    phenomena. The Prolog extension that could have broadened scope is incomplete.
    The findings may not generalize beyond this exact setup.


    **W4 (Major): Relationship to process reward models (PRMs) not discussed.** The
    PRM literature (Lightman et al. 2023, Wang et al. 2024 Math-Shepherd, Luo et al.
    2024 PROF) studies step-level reward signals for mathematical reasoning — conceptually
    close to ISR as a structural reward. ISR can be viewed as a solver-derived process
    reward. The paper does not position against PRMs, missing the opportunity to argue
    why LOO necessity is preferable to (or different from) learned process rewards.


    **W5 (Moderate): Mellgren et al. 2025 is the closest prior work and is underdiscussed.**
    The paper mentions Mellgren et al. in one sentence ("propose Prolog-specific structure
    penalties"). But Mellgren et al. study structural quality in GRPO for program
    synthesis — the exact same problem. How does ISR compare to their structure penalties?
    Do they observe similar Goodhart effects? This deserves a paragraph of comparison,
    not a parenthetical mention.


    **W6 (Moderate): "EVOM" and "ExecVerify" are mentioned but not cited.** Section
    2 references "execution-only approaches (EVOM, ExecVerify)" without citations,
    raising the question of whether these are real systems or placeholders. If real,
    they should be cited and compared.


    **W7 (Moderate): The Goodhart taxonomy connection is surface-level.** The paper
    cites Manheim & Garrabrant (2019) and their four Goodhart failure modes (regressional,
    extremal, causal, adversarial) but never maps the observed failure modes to this
    taxonomy. Is the seed-44 mode shift "regressional Goodhart" or "extremal Goodhart"?
    Is format collapse at β=0.3 "extremal"? Making this connection explicit would
    strengthen the theoretical contribution.


    **W8 (Minor): Missing citations on reward shaping for theorem proving.** Recent
    work on reward design for theorem proving (e.g., DeepSeek-Prover-V1.5''s reward
    structure, AlphaProof''s approach to proof-level rewards) is not discussed. The
    paper positions as the "first empirical Goodhart dose-response analysis for structural
    rewards in formal reasoning" — this claim requires more thorough coverage of existing
    reward designs.


    ### R2 Questions for Authors


    1. How does ISR relate to process reward models (PRMs)? Could a learned PRM avoid
    the Goodhart effects observed with ISR?

    2. Have you compared ISR to the structure penalties in Mellgren et al. 2025? Do
    they observe similar Goodhart dynamics?

    3. Which of Manheim & Garrabrant''s four Goodhart categories do your observed
    failure modes fall into?

    4. What are "EVOM" and "ExecVerify"? Please provide citations or remove these
    references.

    5. Would ISR applied to Lean4 or Isabelle (declarative proof assistants with richer
    proof objects) avoid the semantic limitations discussed in Section 5.5?


    ### R2 Related Work Gaps


    - **Process Reward Models:** Lightman et al. 2023 ("Let''s Verify Step by Step"),
    Wang et al. 2024 (Math-Shepherd), Luo et al. 2024 (PROF). ISR is essentially a
    solver-derived step-level reward; the PRM literature is directly relevant.

    - **Constrained RLHF / Safe RL:** Moskovitz et al. 2024 and related work on constrained
    optimization as an alternative to reward shaping. Relevant because the paper''s
    conclusion implies structural constraints might work better than structural rewards.

    - **DeepSeek-Prover-V1.5** (Xin et al. 2024): Uses proof-level rewards with RMaxTS;
    discusses reward design considerations for formal reasoning.

    - **Spurious rewards in RL:** Yang et al. 2025 and related work on reward misspecification
    beyond Goodhart framing.

    - **Mellgren et al. 2025:** Needs substantive comparison, not just a mention.


    ### R2 Score: 3/6 (Weak Reject)

    ### R2 Confidence: 4/5


    The paper addresses a timely question and the seed-44 Goodhart paradox is a genuinely
    interesting finding. However, algorithmic novelty is limited, the scope is too
    narrow for a top venue, and the related work misses important connections (PRMs,
    Mellgren et al. comparison, Goodhart taxonomy mapping). The negative-result framing
    is honest but needs stronger experimental breadth to be convincing at a top venue.


    ---


    ## Roundtable Synthesis


    ### Step 2: Cross-Reviewer Sharing


    **R1→R2:** R1''s concern about the multiplicative formulation being a confound
    strengthens R2''s point about limited algorithmic novelty — if the Goodhart effects
    are formulation-specific, the contribution is even narrower. R1''s point about
    n=100 eval problems compounds R2''s scope concern.


    **R2→R1:** R2''s observation about missing PRM literature suggests that the "first
    empirical Goodhart dose-response for structural rewards" claim needs qualification.
    R2''s point about Mellgren et al. reinforces R1''s concern that the hacking taxonomy
    needs external validation.


    ### Step 3: Convergence


    Both reviewers converge on:


    1. **The ISR diagnostic contribution is genuine but incremental.** Applying LOO
    to solver outputs is a natural idea; the contribution is showing it reveals hidden
    collapse. This is useful but not sufficient for a top venue alone.


    2. **The Goodhart analysis is the more interesting contribution but is underpowered.**
    The seed-44 paradox is striking, but 3 seeds at one β and 1 seed at another β
    cannot characterize a dose-response relationship. "Full-spectrum" is overclaimed.


    3. **The paper''s scope is too narrow for its claims.** Single dataset, model,
    solver, logic type, and reward formulation. The conclusions are presented as general
    ("ISR is fundamentally unreliable as a training signal") but the evidence is specific
    to one configuration.


    4. **The paper is honest and well-structured.** The Prolog failure is transparently
    reported, the negative results are not hidden, and the writing is clear. This
    is a well-executed paper on an insufficient experimental base.


    5. **Score convergence: 3/6 (Weak Reject).** Both reviewers independently arrive
    at the same score. The paper is below the accept threshold primarily due to narrow
    scope and statistical underpowering, not due to conceptual or methodological flaws.


    ### Step 4: Consolidated Assessment


    **Overall Score: 3/6 (Weak Reject)**

    **Confidence: 4/5**


    #### Key Strengths

    1. Clean problem formulation with a well-motivated diagnostic (ISR) that reveals
    structural collapse invisible to prove rate

    2. The seed-44 Goodhart paradox (optimizing ISR decreases ISR via mode shift)
    is a compelling and well-documented empirical finding

    3. Well-designed random control that isolates ISR information content from variance
    regularization

    4. Honest reporting of negative results and incomplete experiments (Prolog)

    5. Clear writing with coherent narrative framing


    #### Key Weaknesses (ordered by severity)

    1. **(Major) Statistical underpowering:** 3 seeds for β=0.1, 1 seed for β=0.3,
    100 eval problems. The paper demonstrates extreme seed sensitivity (CV=1.32) but
    uses the minimum sample size to characterize it. The paired t-test at n=3 (df=2)
    has near-zero power.

    2. **(Major) Narrow scope:** 1 dataset (FOLIO), 1 model (Qwen2.5-1.5B), 1 solver
    (Prover9), 1 reward formulation (multiplicative). Claims of "fundamental unreliability"
    are not supported by this single-configuration study.

    3. **(Major) Multiplicative formulation is a confound:** The r = r_exec · (1 +
    β · ISR) design creates a structural bottleneck (zero ISR gradient when r_exec
    = 0) that may be the primary cause of failure. No alternative formulations are
    tested, so the paper cannot distinguish "ISR is unreliable" from "multiplicative
    ISR integration is unreliable."

    4. **(Major) "Full-spectrum" overclaims:** Two non-zero β values (0.1, 0.3) with
    β=0.3 on only 1 seed cannot characterize a dose-response curve. The title and
    abstract oversell the experimental coverage.

    5. **(Moderate) ISR collapse trajectory is single-seed:** The headline result
    (Table 2, 0.64→0.003) is seed 42 only. Seed 44''s tautological collapse would
    show a qualitatively different trajectory. Multi-seed trajectories are needed
    to establish the "progressive structural degeneration" narrative.

    6. **(Moderate) Missing related work:** Process reward models (Lightman et al.,
    Math-Shepherd), Mellgren et al. substantive comparison, Goodhart taxonomy mapping,
    constrained RL alternatives.

    7. **(Moderate) No training dynamics:** Endpoint metrics only; no loss curves,
    ISR trajectories during training, or reward distribution evolution.


    #### Missing Experiments Most Weakening the Paper

    1. More seeds (5-10) at β=0.1 — cannot characterize seed sensitivity with n=3

    2. Multi-seed β=0.3 — dose-response conclusion rests on 1 seed

    3. Alternative reward formulations (additive, threshold-gated) — needed to attribute
    failures to ISR vs. integration method

    4. Finer β sweep — two points ≠ dose-response curve

    5. SFT baseline — cannot isolate GRPO-specific vs. general finetuning effects

    6. Multi-seed ISR collapse trajectory — headline result is single-seed


    #### Recommendation

    The paper identifies a real problem (structural collapse under GRPO) and proposes
    a reasonable diagnostic (ISR). The Goodhart analysis, particularly the seed-44
    paradox, is genuinely interesting. However, the experimental evidence is too narrow
    and underpowered for a top ML venue. The paper would benefit from: (a) 5-10 seeds
    across all β conditions, (b) testing 4-5 β values including intermediate points,
    (c) at least one non-multiplicative reward formulation, (d) a second dataset or
    model, and (e) proper confidence intervals on all reported metrics. In its current
    form, the paper reads as a promising pilot study rather than a complete contribution.


    #### Comparison to Accept Threshold

    At a top venue (~25% accept rate), accepted papers typically demonstrate either
    strong novelty with adequate experiments or moderate novelty with thorough experiments.
    This paper has moderate novelty (LOO applied to solver inputs + Goodhart analysis)
    with insufficient experiments (narrow scope, underpowered statistics). The gap
    to acceptance is primarily experimental breadth, not conceptual.


    same formula, or the confound should be clearly flagged.


    ### Questions for Authors


    **Q1 (Critical):** Can you provide the complete eval outputs (including per-sample
    ISR distributions, single-premise rates, and premise-equals-conclusion rates)
    for seeds s43 and s44 at β=0.1? The reported ISR values (0.305, 0.282) appear
    inconsistent with the experimental record showing conclusion duplication artifacts

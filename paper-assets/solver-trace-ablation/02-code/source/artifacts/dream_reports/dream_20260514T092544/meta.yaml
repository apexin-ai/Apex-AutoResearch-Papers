    come from different runs or post-filtering, this must be documented. If these
    are projected/ideal results rather than observed values, this is a serious integrity
    concern. **This issue propagates to Claim 2''s entire statistical edifice (Table
    6: p=0.002, Cohen''s d=9.6) and potentially to the Prolog and SMT-LIB cross-logic
    results as well.**


    **W2 (Major): Coarse Goodhart characterization.** The paper claims a "sharp transition"
    and "dose-response" curve based on exactly two β values (0.1 and 0.3). This is
    insufficient to characterize the shape of the Goodhart transition. Where does
    the transition begin? Is it gradual or abrupt? Does β=0.15 still work? Does β=0.2
    show mixed behavior? The paper acknowledges this limitation ("finer-grained β

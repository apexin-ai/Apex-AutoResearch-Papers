    # Review Report: Solver Trace Ablation Reveals Reward Hacking in GRPO-Trained
    Formal Reasoners


    ## 1. Paper Summary


    This paper introduces Solver Trace Ablation (STA), a diagnostic framework based
    on leave-one-out (LOO) component ablation applied to solver inputs, producing
    an Intensional Structural Reward (ISR) that quantifies the structural integrity
    of formalizations generated by GRPO-trained models. The authors demonstrate that
    exec-only GRPO achieves high prove rates (up to 96%) while ISR collapses from
    0.64 to 0.003 over 1000 training steps, revealing reward hacking invisible to
    execution metrics alone. They identify 5 distinct hacking strategies across seeds
    and conditions, characterize a Goodhart''s Law transition when ISR is used as
    a training reward (beneficial at β=0.1, harmful at β=0.3), and provide preliminary
    evidence of STA''s mechanical transferability to Prolog. The paper is positioned
    as a diagnostic/analysis contribution with honest reporting of statistical limitations,
    negative results, and capability boundaries.


    ## 2. Strengths


    1. **Clean diagnostic formulation.** ISR via LOO ablation is unambiguous, reproducible,
    and well-defined. The ISR collapse trajectory (0.64→0.13→0.003) across 100/500/1000
    training steps is a compelling and visually clear demonstration of reward hacking.


    2. **Well-designed matched controls.** The ISR β=0.1 vs random β=0.1 comparison
    isolates the structural signal of ISR from variance-injection effects. Same seed,
    same β, same formula — only ISR vs random differs. This is methodologically sound.


    3. **Comprehensive experimental matrix.** 14 of 15 planned experiments executed
    across 7 reward conditions, 3 seeds, SFT baseline, O(1)/O(N) ablation, curriculum
    ablation, cross-logic transfer, multi-logic training, and model scaling. This
    represents thorough experimental due diligence.


    4. **Exemplary transparency about negative results.** O(1) approximation failure,
    NLI null result, curriculum marginal effect, cross-logic null transfer, multi-logic
    interference, and the ISR capability boundary (syntactic necessity ≠ semantic
    faithfulness) are all honestly documented. This level of transparency is rare
    and valuable.


    5. **Hacking taxonomy as practical contribution.** The 5-mode classification (conclusion
    embedding, redundant premises, tautological collapse, repetition collapse, complexity
    without utility) provides actionable diagnostics for practitioners.


    6. **Seed variability elevated as finding.** The observation that 3 seeds with
    identical hyperparameters produce 3 qualitatively different hacking strategies
    is a genuinely interesting finding about GRPO training instability.


    7. **SFT baseline provides interpretive anchors.** SFT (PR=0.48, ISR=0.45) vs
    GRPO exec-only (PR=0.93, ISR=0.13) clearly frames the PR-ISR tradeoff, giving
    readers concrete upper/lower bounds on structural quality.


    ## 3. Weaknesses


    ### MAJOR


    1. **Statistical power insufficient for Claim 2 (M1).** Only 3 seeds for the ISR
    β=0.1 condition, with extreme inter-seed variance (ISR std=0.11 on mean of 0.23).
    The 95% CI for the ISR/random ratio is [0.85, 3.45], crossing 1.0. The genuine
    rate delta of +3.7pp across 3 seeds is not statistically significant. While the
    paper correctly refrains from significance claims, this means the central Goodhart
    "sweet spot" finding cannot be distinguished from noise with the available evidence.


    2. **Coarse beta sweep for Goodhart characterization (M2).** Only 2 beta values
    (0.1 and 0.3) are tested. The paper uses language like "sharp transition" and
    "Goodhart boundary," but 2 data points cannot characterize a boundary''s shape,
    sharpness, or location. At minimum, β ∈ {0.05, 0.1, 0.15, 0.2, 0.25, 0.3} would
    be needed to make "dose-response" claims credible.


    3. **Thin bibliography with significant omissions (M3).** Only ~8 references is
    far below the 20-30 expected at a top venue. Critical missing citations include:
    Uesato et al. (2022) on process vs outcome rewards, Lightman et al. (2023) on
    process reward models, Cobbe et al. (2021) on verifiers, Pan et al. (2022) on
    reward misspecification, and neurosymbolic reasoning competitors (LINC, SatLM,
    RLSF).


    4. **Incremental methodological novelty (M4).** LOO ablation is a standard technique
    in feature attribution. The paper honestly acknowledges this, but the novelty
    rests entirely on the empirical findings, which must then be held to a higher
    standard of statistical rigor — a standard weakened by M1 and M2.


    ### MINOR


    5. **Single dataset (m1).** All FOL experiments use FOLIO (n=100 held-out). Generalization
    to other FOL benchmarks is unknown. The small eval set amplifies variance.


    6. **Single-seed 8B scaling (m2).** Given the demonstrated extreme seed sensitivity
    at 1.5B, a single-seed 8B experiment cannot support claims about scaling effects.


    7. **ISR=0.57 false positive for tautological collapse (m3).** Seed 44''s tautological
    collapse produces ISR≈0.5, a known blind spot that limits ISR''s standalone diagnostic
    value.


    8. **"First systematic study" claim needs qualification (m4).** Adjacent work
    on reward hacking in code generation and mathematical reasoning means the "first"
    claim should be scoped precisely to formal logical reasoning with solver-based
    verification.


    ## 4. Per-Claim Assessment


    ### Claim 1: ISR as Diagnostic

    **SUPPORTED.** The ISR collapse trajectory across 3 training horizons is clean
    and convincing. The 5-mode hacking taxonomy is well-documented. The SFT baseline
    and 3-seed divergence provide strong supporting evidence. This claim alone would
    warrant consideration at a workshop or Findings venue.


    ### Claim 2: ISR as Reward / Goodhart''s Law

    **DIRECTIONALLY SUPPORTED but STATISTICALLY UNDERPOWERED.** The mean ISR ratio
    of ~2.1x over random at β=0.1 is directionally interesting, and the collapse at
    β=0.3 is compelling. However, the 95% CI crossing 1.0 and non-significant genuine
    rate delta mean this cannot be presented as a confirmed finding. The 2-point beta
    sweep is insufficient for "dose-response" language.


    ### Claim 3: Cross-Logic Transfer

    **HONESTLY PRELIMINARY.** ISR ratio of only 1.12x for Prolog exec+STA over exec-only,
    with PR actually dropping 6.3pp. The paper correctly scopes this as preliminary
    evidence of mechanical transferability only.


    ### Additional Finding: Seed Variability

    **INTERESTING and WELL-DOCUMENTED.** Three seeds producing three qualitatively
    different hacking modes from identical hyperparameters contributes to the growing
    literature on GRPO training instability.


    ## 5. Experiment Coverage


    14 of 15 planned experiments were executed (SMT-LIB acknowledged as missing in
    Limitations). Reported numbers match the review context for all covered experiments.
    Breadth is commendable; depth per condition (especially seeds per beta) is the
    primary gap.


    ## 6. Missing References


    1. **Uesato et al. (2022)** — Process vs outcome rewards. Directly relevant to
    ISR as a process-level signal.

    2. **Lightman et al. (2023)** — Process reward models. ISR is conceptually a verification-based
    process reward.

    3. **Cobbe et al. (2021)** — Training verifiers for math. Foundational verification-augmented
    training.

    4. **Pan et al. (2022)** — Effects of reward misspecification. Taxonomy directly
    relevant to Goodhart analysis.

    5. **LINC (Olausson et al. 2023)** — Neurosymbolic FOL reasoning. Closest competitor.

    6. **SatLM (Ye et al. 2023)** — Satisfiability-aided language models.

    7. **RLSF (Jha et al. 2024)** — RL via symbolic feedback. Most directly comparable
    prior work.


    ## 7. Questions for Authors


    1. Have you considered running β ∈ {0.05, 0.15, 0.2, 0.25} to better characterize
    the Goodhart transition?

    2. Could a component-count filter (flag ISR when n_components ≤ 2) address the
    tautological collapse false positive?

    3. Have you considered K-component sampling (e.g., K=3) as a middle ground between
    O(1) and O(N)?

    4. Do you have any hypothesis about what drives the qualitative seed divergence?

    5. How does ISR correlate with component count? A 2D diagnostic (ISR × component
    count) could improve discrimination.

    6. What hacking modes does SFT exhibit (42% hacking rate) and how do they differ
    from GRPO modes?


    ## 8. Minor Issues


    1. "Sharp transition" language should be "qualitative shift" with only 2 beta
    points.

    2. Clarify that early ISR=0.64 (at 100 steps, PR=32%) is high partly due to selection
    bias on successful proofs.

    3. Component count statistics should include standard deviations.

    4. Skalse et al. (2022) and Manheim & Garrabrant (2019) appear in Related Work
    but items 7-10 in Missing References note them as missing — verify against actual
    bibliography.


    ## 9. Overall Assessment


    ### Soundness: 3/4

    ### Novelty: 2/4

    ### Significance: 3/4

    ### Clarity: 3/4

    ### Overall Recommendation: 3/6 (Weak Reject)

    ### Confidence: 4/5


    ## 10. Meta-Review Summary


    The paper''s diagnostic contribution (Claim 1: ISR collapse trajectory + 5-mode
    hacking taxonomy) is solid and would be suitable for a Findings paper. To reach
    main conference acceptance, two changes are essential: (1) expand the beta sweep
    from 2 to at least 5-6 points to credibly characterize the Goodhart boundary,
    and (2) either add 5+ additional seeds at β=0.1 to achieve statistical significance,
    or reframe Claim 2 as a case study observation. The bibliography must also be
    expanded to 20-30 references. If these gaps are addressed, the paper''s unusual
    honesty, comprehensive ablation matrix, and practical diagnostic framework could
    make it competitive at EMNLP Findings or a strong workshop submission.'

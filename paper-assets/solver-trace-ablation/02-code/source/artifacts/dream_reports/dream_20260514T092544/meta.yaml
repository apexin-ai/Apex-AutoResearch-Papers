    despite being directly relevant LLM-to-solver pipelines

    - **GRPO-specific reward work**: MO-GRPO, DAPO — address GRPO reward hacking specifically

    - **Reward overoptimization**: Moskovitz et al. (ICLR 2024) on composite reward
    overoptimization; Kwa et al. (NeurIPS 2024) on catastrophic Goodhart


    **W4 (Major): Statistical methodology at n=3.** Cohen''s d=9.6 with n=3 is extreme.
    Each "observation" is an aggregate over ~100 held-out samples, yet the analysis
    treats seeds as the unit. A nested/hierarchical model with individual samples
    as units would provide far more statistical power and a more conventional framework.
    The current analysis conflates seed-level variance with measurement uncertainty.
    Additionally, no confidence interval is reported for Cohen''s d itself (which
    would be very wide at n=3).


    **W5 (Moderate): ISR''s fundamental gamability is underplayed.** The paper acknowledges
    ISR measures syntactic necessity, not semantic faithfulness. But it does not acknowledge
    that ISR can be actively gamed: a single-premise formalization where the premise
    equals the conclusion achieves ISR approaching 1.0 (no component is redundant
    because there''s only one). This is exactly what the experimental record shows
    happening at β=0.1 in 2/3 seeds — the model discovers that minimizing component
    count while embedding the conclusion maximizes ISR. This "meta-Goodhart" phenomenon

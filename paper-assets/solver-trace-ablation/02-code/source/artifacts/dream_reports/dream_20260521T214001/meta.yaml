    result_rationale: '8B ISR β=0.1展示accelerated Goodhart collapse。核心发现：8B ISR genuine
      rate (4.9%) 显著低于8B random genuine rate (17.9%)，OR=0.24 (p=0.0001)。方向与4B相反。

      机制：ISR reward中的tautology bias (P→P gets ISR≥0.5) 在8B上被更高效exploit。 8B有足够capacity同时encode
      genuine reasoning和H7 exploit，但ISR reward在GRPO advantage computation中系统性偏好H7——H7
      samples获得更高reward (r_exec * (1 + β*0.5)) 而genuine samples的ISR通常<0.4 (reward
      boost更小)。结果：8B ISR的GRPO梯度 consistently push向H7，genuine reasoning被crowd out。

      4B的不同：4B capacity不足以高效构造H7 (需要precise tautology syntax)，部分seeds (s45/s46) 在struggle
      to learn H7的过程中''意外''sustain genuine proofs。这不是 ISR的benefit，而是capacity bottleneck的side
      effect。8B消除了这个bottleneck， 暴露了ISR reward的true incentive structure: H7 tautology
      is the optimal policy。

      Cross-scale MH OR=1.55 (CMH p=0.04): 表面上borderline显著，但Breslow-Day p=0.001 表示cross-scale
      heterogeneity极显著。不能report pooled OR without discussing heterogeneity——4B positive
      (OR=2.42) + 8B negative (OR=0.24) 的pooled不是 meaningful summary statistic。论文必须分scale报告。

      Cohen''s h=0.12: small effect size。即使p<0.05，practical significance存疑。 Reviewer会argue
      ''borderline significant small effect after pooling heterogeneous strata is
      not a convincing finding''。论文需要pivot away from OR as headline。

      '

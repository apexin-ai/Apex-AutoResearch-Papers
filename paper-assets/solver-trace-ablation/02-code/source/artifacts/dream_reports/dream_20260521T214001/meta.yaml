      k8_overcomes_cold_start: true
      training_hours_per_seed: 4.0
    result_rationale: 'K=4 失败的机制已明确：8B 在 K=4 时 4 个 rollout outputs 过于相似 (frac_reward_zero_std=1.0)，GRPO
      的 within-group variance 为零，梯度恒为零， 权重从未更新。K=8 将 rollout 数翻倍——8 个 outputs 的多样性足以产生非零
      variance，打破冷启动。PR 预期 0.70–0.95：8B 比 4B 有更强的基线推理能力 (初始 PR 更高)，GRPO 优化更快收敛。

      为什么 8B 的 dominant mode 是 H8 而非 4B 的 H7：GRPO 选择 minimum-effort hacking strategy，但
      "minimum effort" 是 capacity-dependent。4B 的 H7 (P therefore P) 是绝对最小路径——single
      premise, ISR≈0.5。8B 有更强的 sequence generation 能力，在 GRPO 优化初期产生更长更复杂的 proofs。这些
      proofs 中的 conjunction collapse (H8) 是 "懒但不是最懒" 的 shortcut： 保留原始 proof structure
      但添加冗余 conjunctive components，比 H7 (全部 重写为 P→P) 需要更少的 distribution shift。8B 从
      complex genuine proofs 到 H8 的 KL distance 小于到 H7 的 KL distance——GRPO 的 KL penalty
      使 H8 比 H7 更 accessible。换言之：4B 需要 "collapse to minimum" (H7) 因为 它在 complex space
      中不稳定；8B 在 complex space 中有 stable H8 basin， 不需要 further collapse to H7。

      1.7B/4B/8B gradient: 1.7B→H1/H9 (only capable of simplest exploit), 4B→H7 (tautological
      shortcut as main attractor), 8B→H8 (conjunction collapse, a more sophisticated
      exploit leveraging higher capacity). This is the capacity-dependent Goodhart
      basin gradient that validates the across-scales framing.

      '

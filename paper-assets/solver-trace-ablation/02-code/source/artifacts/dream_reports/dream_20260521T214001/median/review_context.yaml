    s46_1000step:
      prove_rate: 0.98
      n_proved: 98
      proved_only_isr: 0.012
      h7_rate: 0.0
      h7_count: 0
      h1_rate: 0.949
      h1_count: 93
      h8_rate: 0.041
      h8_count: 4
      genuine_rate: 0.01
      genuine_count: 1
      isr_collapse_from_500: -86.5%
      mode_transition: H1 89.2% → H1 94.9% (H1 deepens, no mode switch)
    three_seed_trajectory:
      s42_trajectory: ISR* 0.642→0.132→0.003 (500→1000步 collapse 97.7%)
      s45_trajectory: ISR* 0.506→0.10 (collapse 80.2%, partial — H7 residual)
      s46_trajectory: ISR* 0.089→0.012 (collapse 86.5%, full)
      mean_500_to_1000_collapse_pct: 88.1
      all_seeds_genuine_at_1000_le_2pct: true
  result_rationale: 's46在500步已是H1-dominant (89.2%)。延长到1000步强化H1至94.9%，genuine从 9.7%压缩至1.0%，ISR*从0.089降至0.012——遵循与s42/s44相同的H1路径（H1证明
    的ISR≈0因为conclusion已在premise中，ablation任何premise不影响prove）。

    s45在500步是H7-dominant (93.9%)。关键预测：1000步时发生部分模式切换H7→H1， 类似已观察到的s44 (500步H7=100%
    → 1000步H1=85%)。但s45切换不完全，保留 18.6% H7残留。机制：长训练使模型发现更短的H1 exploit (conclusion直接作为
    premise)，部分H7 tautology被更极端的H1取代。H7残留的ISR artifact (单premise tautology ISR≈0.5)
    使整体ISR*维持在0.10而非崩塌至近零——形成"partial collapse"。

    Median档位的关键区分：s45是partial collapse (ISR*=0.10) 而非full collapse (ISR*<0.02)。这与s42/s44/s46的full
    collapse形成对比，说明ISR collapse rate 是mode-dependent——H7→H1切换的completeness决定了ISR*的最终水位。

    '
  tables:
  - name: 'Table: ISR Collapse Trajectory (N=3 seeds, 500→1000 steps)'
    content: '| Seed | ISR*(100) | ISR*(500) | ISR*(1000) | Δ 500→1000 | Path            |

      |------|-----------|-----------|------------|------------|-----------------|

      | s42  | 0.642     | 0.132     | 0.003      | −97.7%     | H1→H1 (stable)  |

      | s45  | —         | 0.506     | 0.100      | −80.2%     | H7→H7/H1 (partial
      switch) |

      | s46  | —         | 0.089     | 0.012      | −86.5%     | H1→H1 (deepens) |

      '
  figures_description:
  - 'Line plot: ISR* vs training steps for N=3 seeds, 标注mode transition points'
  - 'Paired stacked bars: taxonomy at 500 vs 1000 steps per seed,展示mode shift dynamics'
  analysis: '3/3 seeds确认''degeneration worsens with training''。但collapse rate heterogeneous：
    H1路径(s42, s46)→ISR*趋近零 (97.7%, 86.5% collapse)；H7→H1混合路径(s45)→ ISR*停在0.10 (80.2%
    collapse) 因为残留H7的ISR artifact。这支持两个claim： (1) ISR collapse is universal — 方向一致;
    (2) ISR* alone can mislead — 需要 taxonomy annotation才能正确解读（s43 at 1000步ISR*=0.465
    但100% H7 tautology）。 论文应明确：高ISR*不等于genuine reasoning，低ISR*不是唯一的degeneration signal。

    '

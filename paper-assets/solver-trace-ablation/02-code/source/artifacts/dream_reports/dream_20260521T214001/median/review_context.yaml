narrative_guidance: 'Cross-scale claim保留但降级为''degeneration transfers across scales,
  exploitation mode converges to H7''——确认universality但taxonomy分化贡献被削弱。C2 double-edged需要明确
  软化：genuine OR从3.48降至~1.5仅边界显著（CMH p≈0.06），且cross-scale heterogeneity 显著（4B OR=2.4
  vs 8B OR=0.25, Breslow-Day p<0.01）——ISR genuine benefit是scale- dependent transient，不是universal
  property。Reframe为''modest transient uplift at 4B, accelerated collapse at 8B''。论文重心转向C1
  diagnostic methodology + Goodhart inevitability mechanism + 9-mode taxonomy。Premise-count-matched
  analysis和meta-Goodhart triple gaming作为methodological contribution补位。ISR-as-reward篇幅压缩至≤1.5页，
  增加diagnostic case study depth。预期reviewer score 3.0-3.25 (Findings级别)。

  '

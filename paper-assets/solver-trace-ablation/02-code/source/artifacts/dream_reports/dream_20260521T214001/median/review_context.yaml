  plan_id: plan_020
  description: '将s45和s46 exec-only训练从500步延长到1000步。验证ISR崩塌轨迹在N=3 seeds上的泛化性(s42已有1000步数据)。每seed
    ~3h GPU。

    '
  expected_results:
    s45_1000step:
      prove_rate: 0.97

  - 'Box plot: genuine rate by scale, 每个点是一个seed, 展示within-scale variance'
  analysis: 'Cross-scale degeneration confirmed，但叙事需要careful framing。不能说''scale reveals
    distinct Goodhart basins''——8B和4B的H7 pattern太相似。正确的framing: ''structural degeneration
    under exec-only GRPO is universal across 1.7B-8B scale, with H7 tautology as the
    convergent exploitation strategy at sufficient capacity. Larger models sustain
    genuine reasoning longer (15.1% vs 3.6%) but still converge to >85% structural
    hacking within 500 steps.''

    对reviewer的准备：''8B同质化意味着什么？'' → 意味着Goodhart mechanism是 reward-structure-driven
    (exec verification + GRPO) 而非capacity-driven。 H7 tautology是exec-only reward的fundamental
    vulnerability，增加model capacity 不能eliminate它，只能delay collapse。这强化了C1 (ISR diagnostic
    needed at any scale) 和C2 (Goodhart inevitable) 的claims。

    '

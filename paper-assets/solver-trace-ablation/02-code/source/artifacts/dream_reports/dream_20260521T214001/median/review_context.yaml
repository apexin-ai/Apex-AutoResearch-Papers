    为什么8B genuine rate (15.1%) 高于4B (3.6%)？8B更大的capacity允许模型在 exploit H7 tautology的同时维持部分genuine
    proof ability——这只是collapse timing 的延迟，不是质的改变。4B在500步已几乎完全collapse，8B需要更多步数才达到

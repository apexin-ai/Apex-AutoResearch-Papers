  analysis: 'Premise-count-matched analysis产生了比预期更nuanced的结论。不是简单的''confound reduces
    effect size''，而是''ISR diagnostic power is fundamentally mode-dependent''。

    Key actionable insight: ISR alone不是sufficient diagnostic。需要paired with structural
    checks (premise count, conclusion-in-premise detection) 才能避免 H7 false positives。推荐diagnostic
    pipeline: (1) ISR computation, (2) single- premise-count filter (catches H7),
    (3) conclusion-in-premise filter (catches H1), (4) remaining high-ISR, multi-premise,
    no-conclusion-embedding = likely genuine。

    论文positioning: 这是C1 methodological contribution的extension——不仅ISR is diagnostic,
    而且ISR has known blind spots that require complementary checks。 增加了paper的rigor和actionability。Reviewer会appreciate
    this self-aware analysis。'

  review_report: "---\ndream_id: dream_20260514T173834\ntier: best\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-14T18:13:24.818448+00:00\n---\n\n# Dream Review\
    \ Report: Solver Trace Ablation Reveals Meta-Level Goodhart's Law in GRPO-Trained\
    \ Formal Reasoners\n\n**dream_id**: 20260514T173834\n**Review mode**: full (2\
    \ Reviewers + Roundtable)\n**Date**: 2026-05-14\n\n---\n\n## Consolidated Assessment\n\
    \n**Overall Score: 3/6 — Weak Reject**\n\nBoth reviewers independently arrived\
    \ at 3/6. The paper presents a valuable empirical finding (ISR collapse trajectory\
    \ under exec-only GRPO) and a well-controlled Goodhart demonstration (ISR-reward\
    \ vs random-reward), but the claims substantially exceed the verified evidence\
    \ base. Critical issues include incomplete related work (8 bullet-point references\
    \ for an EMNLP submission), single-seed results for several key claims, missing\
    \ statistical tests, overstated conceptual novelty (\"meta-level Goodhart\" is\
    \ standard Goodhart in a new domain), and concerns about whether all reported\
    \ results correspond to completed experiments.\n\n---\n\n## R1 Review: Methods\
    \ and Experiments\n\n### Summary\nSTA/ISR is formally clean and well-motivated.\
    \ The ISR collapse trajectory (0.64→0.13→0.003 over 100/500/1000 steps while PR\
    \ rises) is the paper's strongest result. The random-reward control cleanly isolates\
    \ ISR-specific gaming (H7=64.5% vs 0%). However, critical experimental concerns\
    \ undermine confidence in the full scope of claims.\n\n### Strengths\n1. **ISR\
    \ formally clean and solver-agnostic.** The LOO definition (Eq. 1) is simple,\
    \ unambiguous, and correctly identifies the premise-count confound inherent to\
    \ any LOO metric.\n2. **Strong internal controls.** Random-reward control isolates\
    \ ISR-specific gaming from GRPO-universal hacking. SFT baseline (92.9% genuine)\
    \ cleanly attributes hacking to RL.\n3. **ISR collapse trajectory is compelling.**\
    \ The 100→500→1000 step progression is a dramatic, clean demonstration of invisible\
    \ structural degeneration.\n4. **Premise-count-matched analysis is honest.** The\
    \ authors deflate their own result from 2.4× to 1.06×. This self-correction builds\
    \ credibility.\n5. **Cross-seed diversity as finding.** Documenting three distinct\
    \ hacking modes across three seeds (s42: H1, s43: repetition collapse, s44: tautological\
    \ collapse) is valuable.\n6. **Comprehensive ablation coverage.** Curriculum schedules,\
    \ O(1) vs O(N), cross-logic transfer, joint training, model scaling — each addresses\
    \ a natural reviewer question.\n\n### Weaknesses\n\n1. **(Major) Experiment verification\
    \ concerns.** The review context contains \"imagined experiments\" with pre-specified\
    \ expected results that match the paper's reported numbers with high precision\
    \ (e.g., Prolog STA s43: H7=95.2%, PR=0.42, proved=42 — identical in both sources).\
    \ Several experiments (SMT-LIB, 8B scaling, curriculum ablation, multi-logic joint\
    \ training, cross-logic transfer) may not have been fully completed at the time\
    \ of paper generation. If these are projections rather than actual results, this\
    \ is a fundamental integrity issue. If they are completed experiments, execution\
    \ logs and checkpoints should be provided for verification.\n\n2. **(Major) SMT-LIB:\
    \ single seed, insufficient for a \"cross-logic generalization\" claim.** The\
    \ paper's Claim 3 relies on three logic types, but the third (SMT-LIB) has only\
    \ 1 seed with minimal detail. The claim should either be restricted to FOL+Prolog\
    \ or supported with multi-seed SMT-LIB evidence.\n\n3. **(Major) Incomplete hacking\
    \ taxonomy.** The paper claims \"6 distinct hacking strategies\" but only defines\
    \ H1, H7, and H3 in the text. H2, H4, H5, H6 are never specified. Readers cannot\
    \ evaluate the taxonomy's completeness or mutual exclusivity.\n\n4. **(Major)\
    \ Statistical insufficiency at key decision points.**\n   - Premise-count-matched\
    \ analysis: n=11 vs n=21. No confidence intervals, no bootstrap test, no permutation\
    \ test. The 1.06× ratio has extremely wide uncertainty at this sample size.\n\
    \   - β=0.3 result (PR=18% vs random 48%): single sentence, no seeds, no error\
    \ bars.\n   - 8B scaling: single seed. \"Scaling does not solve Goodhart\" requires\
    \ multi-seed evidence given the extreme seed variance documented at 1.7B.\n\n\
    5. **(Minor) No figures.** 12 tables but zero figures. An ISR collapse trajectory\
    \ plot and hacking composition stacked bars would greatly improve readability\
    \ and impact.\n\n6. **(Minor) Additive bonus formulation (r = r_exec · (1 + β\
    \ · ISR)) lacks justification.** Why not pure additive, geometric, or clipped\
    \ formulations? The choice affects how ISR gradients compete with execution gradients,\
    \ which matters for the Goodhart analysis.\n\n7. **(Minor) 1000-step trajectory\
    \ is single-seed (s42 only).** Seeds 43 and 44 both show pathological behavior\
    \ at 500 steps — do they also show ISR collapse at 1000?\n\n8. **(Minor) Eval\
    \ set (n=100) limits fine-grained analysis.** Subgroup analyses quickly reach\
    \ single-digit sample sizes (n=11 for genuine proofs with n_prem≥3).\n\n### R1\
    \ Questions for Authors\n1. Are the Prolog STA s43/s44, SMT-LIB, 8B scaling, curriculum\
    \ ablation, joint training, and cross-logic transfer results actual completed\
    \ experiments with logs and checkpoints?\n2. For the premise-count-matched analysis\
    \ (n=11 vs n=21): what is the 95% CI? Would bootstrap confirm no significant difference?\n\
    3. What are the per-seed results at β=0.3?\n4. Why was the additive bonus chosen\
    \ over alternatives? Were other formulations tested?\n5. Can you provide operational\
    \ definitions for all 6 hacking modes?\n6. Were 1000-step runs attempted for seeds\
    \ 43 and 44?\n\n### R1 Rating: 3/6 (Weak Reject)\n**Confidence: 4/5**\n\n---\n\
    \n## R2 Review: Novelty and Related Work\n\n### Summary\nThe paper's empirical\
    \ findings are informative — particularly the ISR collapse trajectory and the\
    \ controlled ISR-vs-random Goodhart demonstration. However, the algorithmic novelty\
    \ is minimal (LOO ablation is a well-known technique), the \"meta-level Goodhart\"\
    \ framing overstates the conceptual contribution, and the related work is severely\
    \ underdeveloped for a top venue submission.\n\n### Strengths\n1. **ISR collapse\
    \ trajectory is empirically clean.** The 0.642→0.132→0.003 collapse against rising\
    \ PR is a striking quantitative characterization not previously reported in formal\
    \ reasoning GRPO.\n2. **The controlled Goodhart experiment is well-designed.**\
    \ H7=64.5% (ISR reward) vs H7=0% (random reward) across all 3 seeds is a clean\
    \ isolation of ISR-specific gaming.\n3. **Premise-count-matched analysis is a\
    \ genuine methodological contribution.** The insight that LOO metrics are biased\
    \ by component count is broadly applicable.\n4. **Cross-logic replication strengthens\
    \ the diagnostic claim.** Three structurally different solver types with consistent\
    \ ISR collapse patterns.\n5. **SFT baseline cleanly isolates RL-specific degeneration.**\n\
    \n### Weaknesses\n\n1. **(Major) Minimal algorithmic contribution.** ISR is LOO\
    \ ablation applied to solver inputs. LOO has a long history in feature attribution\
    \ (SHAP, LIME), mutation testing, and sensitivity analysis. The \"solver-agnostic\
    \ diagnostic protocol\" framing overclaims what is fundamentally a straightforward\
    \ application of a known technique. The contribution is primarily empirical, not\
    \ methodological.\n\n2. **(Major) \"Meta-level Goodhart's Law\" is a rebranding\
    \ of standard Goodhart, not a new phenomenon.** Standard Goodhart already predicts\
    \ that any proxy metric, when optimized, will be gamed. ISR is a proxy for structural\
    \ quality; optimizing it produces gaming. The \"meta\" prefix implies a higher-order\
    \ phenomenon, but the mechanism is ordinary. Manheim & Garrabrant (2019) cover\
    \ this under \"regressional\" and \"extremal\" variants. The paper should either\
    \ argue convincingly why this is distinct or drop the \"meta-level\" framing.\n\
    \n3. **(Major) Related work is severely underdeveloped.** Only 8 references listed\
    \ as bullet points (not even proper BibTeX entries). For a top venue, this is\
    \ unacceptable. Major missing areas:\n   - **Process reward models**: Lightman\
    \ et al. (2023) \"Let's Verify Step by Step,\" Math-Shepherd (Wang et al. 2024)\
    \ — directly relevant to ISR as a process-level signal vs outcome-level execution\
    \ reward.\n   - **Specification gaming**: Krakovna et al. (2020) specification\
    \ gaming examples, Bondarenko et al. (2025) \"Demonstrating Specification Gaming\
    \ in Reasoning Models,\" Kim et al. (2026) \"Do LLMs Game Formalization?\" — the\
    \ last being perhaps the single most directly relevant concurrent work.\n   -\
    \ **Proof minimization in ATP**: Vampire proof compression, minimal unsatisfiable\
    \ subsets (MUS) — ISR's \"premise necessity\" is closely related to MUS extraction.\n\
    \   - **RL reward shaping theory**: Ng et al. (1999) on potential-based reward\
    \ shaping.\n   - **Verification-based RL**: DeepSeek-Prover-V1.5, AlphaProof,\
    \ RLSF (Jha et al. 2024) — RLSF uses solver certificates as fine-grained reward,\
    \ the closest methodological predecessor.\n   - **GRPO reward hacking**: MO-GRPO\
    \ (CyberAgent 2025), DAPO (ByteDance 2025), \"Spurious Rewards\" (Yang et al.\
    \ 2025).\n   - **Overoptimization theory**: Skalse et al. (2022) \"Defining and\
    \ Characterizing Reward Hacking,\" Kwa et al. (2024) \"Catastrophic Goodhart.\"\
    \n\n4. **(Major) \"First systematic study\" claim unsubstantiated.** Without engaging\
    \ directly relevant concurrent work (Kim et al. 2026, Bondarenko et al. 2025,\

  review_report: "---\ndream_id: dream_20260514T173834\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-14T18:26:26.536575+00:00\n---\n\n# Dream Review\
    \ Report: \"Diagnosing and Characterizing Reward Hacking in GRPO-Trained Formal\
    \ Reasoners\"\n\n**Dream ID**: 20260514T173834\n**Review Mode**: Full (2 Reviewers\
    \ + Roundtable)\n**Date**: 2026-05-14\n\n---\n\n## Roundtable Summary\n\n| Reviewer\
    \ | Focus | Score | Confidence |\n|----------|-------|-------|------------|\n\
    | R1 | Methods + Experiments | 3 (Weak Reject) | 4/5 |\n| R2 | Novelty + Related\
    \ Work | 4 (Weak Accept) | 4/5 |\n| **Consensus** | — | **3 (Weak Reject)** |\
    \ **4/5** |\n\n---\n\n## Step 1: Independent Reviews\n\n### R1 — Methods and Experiments\n\
    \n**Score: 3 (Weak Reject) | Confidence: 4/5**\n\n**Summary**: The core ISR diagnostic\
    \ and meta-Goodhart finding on FOL are well-motivated and partially well-evidenced,\
    \ but the paper presents results from experiments that do not appear in the experimental\
    \ record, lacks statistical testing throughout, and would be stronger as a focused\
    \ FOL study with honest scope and significance tests.\n\n#### Strengths\n1. **ISR\
    \ collapse trajectory is dramatic and well-evidenced.** The 0.64→0.13→0.003 collapse\
    \ while PR rises to 93-96% is a striking result demonstrating diagnostic value\
    \ of structural metrics beyond pass/fail.\n2. **H7 as ISR-specific gaming is convincing.**\
    \ H7=0% across all random seeds vs. H7=64.5% across ISR seeds is the paper's cleanest\
    \ causal finding, establishing that optimizing a diagnostic metric induces metric-specific\
    \ exploitation.\n3. **Premise-count-matched correction is a genuine methodological\
    \ contribution.** The self-correction from 2.4× to 1.06× is a model of honest\
    \ self-correction and is generalizable to any LOO-based metric.\n4. **SFT baseline\
    \ is well-designed.** 92.9% genuine under SFT vs. 12.9% under GRPO cleanly attributes\
    \ hacking to RL optimization pressure.\n5. **Honest negative results.** NLI null\
    \ correlation (ρ=−0.049), O(1) approximation failure, and ISR capability boundary\
    \ are reported transparently.\n\n#### Weaknesses\n1. **Data integrity concern\
    \ for Claim 3 experiments.** SMT-LIB (Table 16), 8B scaling (Table 10), curriculum\
    \ ablation (Table 9), and joint training (Table 14) present detailed numerical\
    \ results, but the project's internal audit documents list no completed experiments\
    \ for several of these. If results are projected rather than measured, this is\
    \ a fatal flaw.\n2. **No statistical significance testing anywhere.** All comparative\
    \ claims (1.06×, 64.5% vs 0%, PR 0.77 vs 0.85) lack confidence intervals, p-values,\
    \ or effect sizes. The premise-count-matched comparison (n=11 vs n=21) is presented\
    \ as definitive without bootstrap CIs.\n3. **Key conditions are single-seed.**\
    \ β=0.3 (both ISR and random), the 1000-step trajectory, and the SFT baseline\
    \ are each n=1. Given documented extreme seed variance, this limits causal claims.\n\
    4. **Model identity inconsistency.** The paper references both \"Qwen3-1.5B\"\
    \ and potentially different actual model sizes. This must be resolved as it affects\
    \ all reproducibility and scaling claims.\n5. **ISR-as-reward exploration is shallow.**\
    \ Only one functional form (additive bonus) at two β values. The sweeping conclusion\
    \ that ISR fails as an optimizer at any dose is not supported. Alternative formulations\
    \ (ISR as rejection filter, ISR with anti-H7 heuristics) are not explored.\n\n\
    #### Key Questions\n1. Can you provide experiment logs and eval outputs for Tables\
    \ 9, 10, 14, 16? Internal audit documents do not list these as completed.\n2.\
    \ What is the 95% bootstrap CI on the 1.06× ratio? With n=11, this could range\
    \ from 0.6× to 1.8×.\n3. Why was only seed 42 extended to 1000 steps? Does the\
    \ ISR collapse replicate across seeds?\n4. Have you considered ISR as a rejection\
    \ criterion rather than continuous reward?\n5. What is the actual model identity\
    \ (1.5B vs 4B discrepancy)?\n\n---\n\n### R2 — Novelty and Related Work\n\n**Score:\
    \ 4 (Weak Accept) | Confidence: 4/5**\n\n**Summary**: A well-controlled empirical\
    \ case study of Goodhart's Law in formal reasoning GRPO, with a useful diagnostic\
    \ (ISR) and honest negative results, but undermined by severely insufficient related\
    \ work, overclaimed novelty, and questionable completeness of cross-logic experiments.\n\
    \n#### Strengths\n1. **Rigorous controls.** 3-seed design with random-reward controls,\
    \ SFT baseline, and premise-count-matched analysis demonstrates careful methodology.\
    \ Random-reward confirming H7=0% across all seeds is clean.\n2. **Honest negative\
    \ results.** Transparent reporting that ISR fails as reward at every dose, and\
    \ that 2.4× improvement was a statistical artifact, is commendable and rare.\n\
    3. **Premise-count-matched methodology.** Identifying and controlling for component-count\
    \ bias in LOO metrics is a genuine contribution applicable beyond this paper.\n\
    4. **Temporal ISR collapse trajectory.** The 0.64→0.003 collapse while PR stays\
    \ 93-96% is a clean and memorable finding.\n5. **Comprehensive Goodhart landscape.**\

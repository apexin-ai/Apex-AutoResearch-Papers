      eval_mean_isr_fast: 0.42
      isr_full_fast_correlation: 0.25
      fast_isr_detects_hacking: false
      h7_rate_full: 0.0
      h1_rate_full: 0.85
      genuine_rate_full: 0.15
      fast_isr_h7_sensitivity: 0.0
      fast_isr_genuine_sensitivity: 0.35
    result_rationale: 'O(1) 近似（基于启发式规则或单次扰动）无法捕获 LOO 的组件必要性语义。 full STA 的 ISR 通过逐个移除
      premise 并重跑 solver 来测量 necessity， O(1) 只能估计表面特征（如 premise 长度、重复度）。在 best 档下，
      O(1) 的 ISR 估计与 full ISR 相关性低 (ρ≈0.25)，因为： (1) H1 模式（多 premise 含 conclusion）的
      full ISR 低但 O(1) 可能高 （conclusion 被多个 premise 冗余覆盖，O(1) 误判为"每个都必要"）， (2) genuine
      证明的 full ISR 高但 O(1) 可能低（真正的逻辑依赖链 需要实际运行 solver 才能判断必要性）。 这个 negative result
      强化论文方法论：LOO 的计算开销是不可避免的， 近似方法无法替代——作为 Discussion 中 "cost of diagnosis" 的论据。

      '

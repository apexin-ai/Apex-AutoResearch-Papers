api:
  base_url: "http://localhost:8001/v1"
  api_key: "[REDACTED]"
  model: "DeepSeek-R1-Distill-Qwen-14B"
  formalization_base_url: "http://47.94.22.126/v1"
  formalization_api_key: "[REDACTED]}"
  formalization_model: "deepseek/deepseek-v3.2"
  max_retries: 3
  timeout: 120

sampling:
  num_chains: 10
  temperature: 0.7
  max_tokens: 2048

verification:
  z3_timeout_ms: 5000
  ic_weight: 0.5
  fc_weight: 0.5
  cclc_lambda: 0.3

mvp:
  num_problems: 600
  dataset: proofwriter
  subset: depth-5
  seed: 42
  cohens_d_threshold: 0.15
  p_value_threshold: 0.05
  require_ci_excludes_zero: true

output_dir: outputs_proofwriter_full
verbose: true

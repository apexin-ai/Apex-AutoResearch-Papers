decisions:
- id: D001
  date: 2026-05-14 04:26 UTC
  summary: MVP 设计：ProofWriter 30 题 API-based pilot 验证 Z3 形式验证的区分能力
  rationale: MVP 阶段用 API 替代本地模型推理，消除 GPU 依赖加速验证。ProofWriter 近形式化输入，autoformalization
    成功率最高，是验证 pipeline 可行性的最佳起点。Pass 标准：formalization 成功率 >50% + 正确链 IC 显著高于错误链。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 04:30 UTC
  summary: MVP 参数更新：50 题 × N=8，P2 收紧为 d>0.15 且 CI 不含 0，补全三级 fail 路径
  rationale: Reviewer 指出原 30×5 样本量统计检验力不足（d 的 CI 约 ±0.5），且缺 kill criteria。提升至 50×8（400
    chains）收窄 CI，补全 P1 fail / P2 fail / CCLC fail 三级 fallback 路径。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-14 05:51 UTC
  summary: MVP 推理从 API 切换到本地 14B GPU 推理（vLLM on autodl-5090）
  rationale: API 充值处理中无法使用，Manager 指示优先用卡。本地 14B 与正式实验模型一致，消除 API 依赖和模型不一致问题。风险：14B
    formalization 质量可能低于 frontier API，P1 pass 概率降低；需用 INT8 量化避免 FP16 显存不足。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-14 07:51 UTC
  summary: Formalization 从本地 14B 切换到外部 DeepSeek V3.2 API（chain gen 保持本地 14B）
  rationale: 混合策略：chain gen 用本地 14B（实验模型一致性），formalization 用 frontier API（V3.2 结构化输出能力更强）。dry-run
    显示 14B formalization 质量边际（69.3%），frontier 模型应提升 P1 安全边际。API 已恢复可用。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-05-14 07:56 UTC
  summary: 预下载 Qwen2.5-14B-Instruct 作为正式实验第二模型（cross-model validation）
  rationale: IDEA_BRIEF 要求多模型验证。趁 MVP 运行（5-6h）并行下载，不占 GPU。MVP 通过后可立即启动 cross-model
    实验。
  related_experiments: []
  depends_on:
  - D003
- id: D006
  date: 2026-05-14 08:35 UTC
  summary: Reviewer 深度审查后确认 IC 全 SAT 退化风险，采纳方向 (b) PCV 作为主方向 pivot
  rationale: Dry-run 4/4 chains 全 SAT，IC 退化为 formalization rate。根因：IC 只检查 internal
    coherence（validity），不检查 external correctness（soundness）。现代推理模型生成的错误推理往往内部自洽。PCV
    将 premises 加入 Z3 验证（chain_claims ∪ premises → SAT/UNSAT），能捕获与前提矛盾的错误推理。Reviewer
    评估实现 ~4-6h，ProofWriter 近形式化前提 formalization 可靠性高。PCV 不论 MVP SAT 比例如何都是 strictly
    better，并行实现不阻塞 MVP。Entailment checking 作为 ablation 备选。
  related_experiments: []
  depends_on:
  - D004
- id: D007
  date: 2026-05-14 08:44 UTC
  summary: 发现并修复 V3.2 formalization 量词系统性错误（ForAll→Exists），可能是 IC 全 SAT 的根因
  rationale: Reviewer 在 MVP 日志中发现 V3.2 系统性地将"If someone X then they Y"的 ForAll 误写为
    Exists。Exists(x, Implies(P,Q)) 在 P(x)=False 时 trivially SAT，直接导致 IC 无区分力。31 Exists
    vs 14 ForAll。修复 formalization prompt 添加显式量词规则后，IC 可能恢复区分力。PCV（D006）仍实现但可能不再是唯一出路。
  related_experiments: []
  depends_on:
  - D006
- id: D008
  date: 2026-05-14 09:19 UTC
  summary: Z3 validate_z3_syntax 需 subprocess 隔离——LLM 畸形 FOL 可触发 Z3 C++ SIGABRT 杀死主进程
  rationale: mvp_002 在 problem 1/50 formalization 阶段 Z3 segfault 崩溃，0/50 完成。根因：LLM
    生成的畸形 FOL 经 eval() 传入 Z3 C++ 后端触发 internal assertion → SIGABRT。Python signal handler
    无法防御 SIGABRT。修复：multiprocessing.Process 子进程隔离 validate_z3_syntax()，子进程崩溃返回 (False,
    "z3_crash")，主进程不受影响。
  related_experiments:
  - exp_id: mvp_002
    role: trigger
    result: failed - Z3 segfault
  depends_on:
  - D007
- id: D009
  date: 2026-05-14 10:50 UTC
  summary: 文献调研完成：SVS novelty 中等偏上，识别 autoformalization unfaithfulness 为核心方法论风险
  rationale: 两份调研覆盖 20+ FV 竞品 + 19 TTS baselines。SVS 三点独特贡献（graded IC / PCV / IC chain
    selection）无人覆盖，novelty 成立。但 arXiv:2604.19459 揭示 autoformalization 系统性不忠实（axiom
    fabrication + premise mistranslation），威胁 IC 可靠性。PCV 部分缓解 premise mistranslation，但
    claim formalization faithfulness 未保证。MVP 不受阻（实证 > 理论担忧），post-MVP 必须设计 faithfulness
    validation 实验。ORM baseline 需研究可用预训练权重，否则用 GenRM 替代。
  related_experiments: []
  depends_on:
  - D006
- id: D010
  date: 2026-05-14 12:04 UTC
  summary: 'CRITICAL: n=24 诊断确认 IC 无区分力(d=-0.04)，启动根因诊断判断是实现问题还是假设失败'
  rationale: Reviewer 独立核实 mvp_003 n=24 诊断结果：Cohen's d=-0.0437, CI=[-0.331,0.234]，IC
    对 correct/wrong 链系统性反向。all-SAT 27.1%，无权重配置能逆转 SVS<SC。MVP P2 当前方法下无可能通过。需立即判断：(1)
    IC 公式是否退化为 formalization rate proxy（实现问题，可修复）(2) Z3 是否真正检查逻辑一致性（方法问题）(3) PCV 是否生效（FC≈IC
    则 PCV 无效）。诊断结果决定坚持修复还是 pivot。
  related_experiments:
  - exp_id: mvp_003
    role: primary
    result: P2 FAIL at n=24
  depends_on:
  - D006
  - D007
  - D009
- id: D011
  date: 2026-05-14 12:10 UTC
  summary: D010 根因确认：IC=formalization rate(SAT) + noise drowns signal(UNSAT)。启动 entailment-based
    IC 修复测试
  rationale: Reviewer 代码级审查确认：(1) SAT 链 IC≡FC=formalized/total，Z3 零贡献 (2) UNSAT 链
    formalization 噪声双向淹没信号 (3) 当前 Z3 做的是 consistency(SAT) 检查，这太弱——几乎任何非矛盾公式都 SAT。PCV
    应做 entailment 检查(premises⊢claim)，这才是真正验证逻辑正确性。在宣判假设失败前，先测试 entailment-based IC
    能否恢复信号。如果仍无区分力，再决定 pivot。
  related_experiments:
  - exp_id: mvp_003
    role: primary
    result: P2 FAIL, d=-0.04
  - exp_id: D010
    role: diagnosis
    result: IC=formalization rate for SAT, noise for UNSAT
  depends_on:
  - D010
  - D006
  - D007
- id: D012
  date: 2026-05-14 12:26 UTC
  summary: PCV 未实现确认（premises 未进 Z3）。采用方向 3：claim-level entailment check 修复 IC，重跑
    MVP
  rationale: Agent 代码审计确认 smoking gun：(1) premises 从未进入 Z3 solver，PCV 的 P 不存在 (2)
    SAT 链 IC≡formalization_rate(r=1.0)，Z3 是 no-op (3) fc_score≡formalization_rate。假设从未被公平测试。修复方向选
    3（claim-level entailment）：对每个 claim 检查 premises∧prior_claims⊢claim，IC=通过 entailment
    的比例。这最接近 PCV 原始设计意图，且比全局 SAT check 严格得多。先用现有 24 题数据原型测试，d>0.1 则修改管线重跑完整 MVP。同时确认
    autodl-5090=gpu-5090-4x-4 同一台机器，实际 4 卡非 8 卡。
  related_experiments:
  - exp_id: mvp_003
    role: baseline
    result: P2 FAIL but PCV never implemented
  - exp_id: D010
    role: diagnosis
    result: PCV not implemented, IC=formalization_rate
  - exp_id: D011
    role: parent
    result: entailment approach confirmed
  depends_on:
  - D011
  - D010

- name: Qwen2.5-1.5B LoRA K=4 curated
  plan_id: plan_009
  description: Cross-model + scale verification. Qwen2.5-1.5B-Instruct, LoRA K=4 curated,
    5 gens.
  expected_results:
    gen0_vendi: 106.5
    gen1_vendi: 105.8
    gen2_vendi: 104.3
    gen3_vendi: 102.8
    gen4_vendi: 102.0
    vendi_decline_pct: -4.23
    gen0_nn_distance: 0.712
    gen1_nn_distance: 0.703
    gen2_nn_distance: 0.691
    gen3_nn_distance: 0.682
    gen4_nn_distance: 0.678
    gen0_quality: 0.1148
    gen1_quality: 0.1165
    gen2_quality: 0.1178
    gen3_quality: 0.1185
    gen4_quality: 0.1189
    gen0_self_bleu: 0.0055
    gen2_self_bleu: 0.0082
    gen4_self_bleu: 0.0101
    gen0_perplexity: 8.9
    gen2_perplexity: 7.6
    gen4_perplexity: 6.8
    training_loss_trend: 0.195 → 0.138 → 0.102 → 0.078 → 0.065
    training_loss_drop_pct: 67
    format_opening_entropy_gen0: 12.8
    format_opening_entropy_gen4: 10.95
    format_entropy_drop: -1.85
    p1_pass: true
  result_rationale: '1.5B 有 2.5x 参数量，LoRA 的 absolute capacity 高于 0.6B。关键差异：1.5B 的
    embedding space 在 pre-training 中学到了更 structured 的 semantic representation， curation
    的 reward signal 能在更 structured space 中引导有方向性的 distribution shift（而非 0.6B 的 random
    walk within capacity ceiling）。

    五个指标协同指向 collapse：(1) Vendi -4.23% (gen0 106.5→gen4 102.0) 打破 0.6B 所有 config 的
    stability pattern；(2) nn_distance monotonic decline 0.712→0.678 表明 embedding space
    中代际距离在持续缩小，output distribution 在收缩； (3) Quality 持续上升 0.1148→0.1189 而 diversity
    持续下降——这是 classic reward over-optimization signature：模型越来越擅长 produce high-reward
    outputs 但 mode diversity shrinks；(4) self_BLEU +84% (0.0055→0.0101) 表明 surface-level
    重复 显著增加；(5) Perplexity 持续下降 8.9→6.8 表明 output distribution 变得更 peaked/confident；(6)
    Format entropy -1.85 bits 远超 0.6B 的 -0.75 bits。

    Training loss 67% drop (vs 0.6B 53%) 表明 1.5B 更高 capacity 导致更深 overfitting。 0.6B
    在 loss plateau 时 diversity 仍稳定，但 1.5B loss 持续下降，diversity 也 持续下降——两者未达 equilibrium，suggesting
    更多 generations 会导致更深 collapse。

    '
  tables:

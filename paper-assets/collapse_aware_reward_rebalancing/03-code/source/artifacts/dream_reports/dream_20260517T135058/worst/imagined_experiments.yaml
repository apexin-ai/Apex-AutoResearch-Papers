tier: worst
narrative_guidance: '放弃 "universal resilience" 叙事。Reframe 为 scale-conditional analysis：
  "Semantic resilience holds in the sub-1B regime but breaks down at 1.5B, revealing
  a critical scale threshold for curation-induced collapse." 0.6B 8-config 证据完整，重新定位为
  "small-model safety zone"。1.5B curated 完成 但出现 Vendi -4.23% 和 nn_distance monotonic
  decline，打破 Claim 1 普遍性。 1.5B random baseline 第三次被 killed（CUDA OOM），无法做 1.5B curated-vs-random
  因果分离——这是论文最致命的漏洞：1.5B collapse 究竟是 curation-caused 还是 scale-inherent，两种解释 equally
  valid，审稿人必攻此点。Claim 2-4 scope 限定为 0.6B 内部仍 internally consistent，保留但明确标注 single-model
  limitation。 论文从 "resilience story" 转为 "when does curation become dangerous?"—— 以
  scale-dependent phase transition 作为核心贡献，仍冲 EMNLP，从 negative result 转为 empirical
  characterization with a discovered scale boundary。若 reviewer 接受 phase transition
  framing，novelty 可能反而更强；若不接受，降格为 workshop paper。

  '

  - 'Table 2 (updated): 新增 1.5B 行标红 -4.23%，与所有 0.6B stable 行对比'
  figures_description:
  - 'Figure 2 (updated): 1.5B curated 红色粗实线从 gen0 持续下降至 gen4，与所有 0.6B flat/rising

  analysis: 'plan_009 是 worst tier 的 defining result。直接打破 Claim 1 的 universal semantic
    resilience，迫使论文重构核心叙事。

    叙事重构路径：(1) Claim 1 从 "semantic resilience across configs" 降级为 "sub-1B semantic
    resilience with scale-dependent breakdown"；(2) 1.5B collapse 重新定位为 paper 的 central
    discovery——a scale threshold for curation-induced diversity collapse；(3) 0.6B
    8-config 从 "main finding" 降为 "characterization of the safe regime below threshold"。

    Critical unresolvable weakness：没有 1.5B random baseline (plan_010 killed)， 无法确定
    collapse 是 curation-caused 还是 scale-inherent。两种解释对论文 narrative 的影响完全不同——curation-caused
    意味着 Claim 2 at scale breaks ("curation IS the cause at 1.5B")；scale-inherent 意味着
    iterative training itself breaks ("not curation, just scale")。论文必须在 Discussion
    中 honestly present both possibilities 并 argue both have practical value。

    Reviewer 预期攻击：(R1 升级为 CRITICAL) "You claim scale-dependent phase transition but
    can''t distinguish curation effect from scale effect. This is an observation,
    not a finding." Defense：observation 本身 actionable—— practitioners now know >1B
    iterative curation requires monitoring。

    '

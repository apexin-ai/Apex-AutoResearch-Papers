    \ finding (format degrades while semantic diversity holds) is practically important.\
    \ The C1 vs C5 comparison at identical K=4 showing identical format degradation\
    \ (both -0.75 bits, +37pp near-dup) is compelling evidence that curation is not\
    \ the format collapse cause.\n3. The direction reversal finding (LoRA: -3.41pp,\
    \ Full-FT low-LR: ~+0.2pp, Full-FT high-LR: +0.86pp) provides a three-point monotonic\
    \ gradient suggesting a capacity-mediated mechanism.\n4. Training loss trajectories\
    \ (C8: 0.206 to 0.097, 53% drop) provide mechanistic transparency and rule out\
    \ the \"model didn't learn\" objection.\n5. Format metrics (opening-pattern entropy,\
    \ near-duplicate start rate) are simple, reproducible, and GPU-free.\n\n**Major\
    \ Weaknesses:**\n1. **(Major) No error bars, confidence intervals, or significance\
    \ tests.** Every number is a single-run point estimate. With Vendi Score changes\
    \ of -0.28% to +0.91%, the reader cannot determine whether differences are within\
    \ noise. A Vendi Score ~107 with unknown variance could easily have standard deviations\
    \ of 1-2 points, making the claimed stability and direction reversal statistically\
    \ indistinguishable from zero.\n2. **(Major) Only 3 generations at 0.6B.** The\
    \ model collapse literature typically requires 5-10+ generations. Three generations\
    \ may be too short to observe compounding effects. Claims should read \"within\
    \ 3 generations\" throughout, not blanket \"resilient.\"\n3. **(Major) 1.5B validation\
    \ is LoRA-only.** The most interesting finding (LoRA vs Full-FT divergence) cannot\
    \ be verified at 1.5B. Direction reversal (Claim 3) is explicitly 0.6B-only.\n\
    4. **(Major) K=16 lacks a matched random baseline.** Without it, the curation\
    \ gap at extreme selection pressure is unmeasured, weakening the paper's strongest\
    \ stress-test claim.\n5. **(Minor) Eval set of 200 prompts limits statistical\
    \ power for Vendi Score.** Effective dimensionality of sentence embeddings for\
    \ 200 points is inherently bounded.\n6. **(Minor) Gen 0 is post-first-training,\
    \ not base model.** If the first training round causes most change, the largest\
    \ effect is missed.\n7. **(Minor) Reward model score gap of only 0.04 raises the\
    \ question of whether curation pressure is meaningful.** A more discriminative\
    \ reward model could produce different outcomes.\n\n**Questions for Authors:**\n\
    1. Can you provide bootstrap confidence intervals by resampling over the 200 evaluation\
    \ prompts?\n2. What is the Vendi Score of the unmodified base model before any\
    \ training?\n3. C5 random baseline shows +3.13% Vendi increase over 3 generations.\

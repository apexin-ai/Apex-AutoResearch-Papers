    # Dream Review Report


    **Paper:** "When Does Curation Become Dangerous? Scale-Dependent Diversity Collapse
    in Iterative Reward-Based Training"

    **Review mode:** full | **Reviewers:** R1 (Methods + Experiments), R2 (Novelty
    + Related Work)

    **Venue standard:** Top ML venue, ~25% acceptance, 6-point scale


    ---


    ## 1. Paper Summary


    The paper studies diversity collapse in iterative self-consuming training with
    reward-based curation. Eight configurations of Qwen3-0.6B (varying selection pressure
    K∈{4,8,16}, LoRA vs full fine-tuning, learning rate, curated vs random) are run
    over 3 generations, complemented by a cross-scale probe on Qwen2.5-1.5B over 5
    generations. At 0.6B, semantic diversity (Vendi Score) is stable across all configurations;
    format homogenization occurs but is inherent to iterative training, not curation-caused;
    and LoRA creates a capacity artifact where curation''s apparent diversity suppression
    reverses under full fine-tuning. At 1.5B, Vendi Score declines 4.23% with co-occurring
    collapse indicators. The 1.5B random baseline was killed by CUDA OOM, preventing
    causal attribution.


    ---


    ## 2. Roundtable Consensus


    ### Step 1: Independent Reviews

    - **R1 (Methods + Experiments):** 3/6, Confidence 4/5

    - **R2 (Novelty + Related Work):** 3/6, Confidence 4/5


    ### Step 2–3: Cross-Sharing and Convergence


    Both reviewers converged on the following assessment after reading each other''s
    reviews:


    **Full agreement on critical issues:**

    - The missing 1.5B random baseline is the paper''s fatal flaw, preventing causal
    attribution for the headline finding

    - The cross-family confound (Qwen3-0.6B vs Qwen2.5-1.5B) invalidates the "scale-dependent
    phase transition" interpretation; scale, architecture, pretraining data, and tokenizer
    are all confounded

    - The term "phase transition" is unjustified by two data points across different
    model families

    - No statistical significance testing or variance estimates for any metric; all
    conclusions rest on single-run point estimates


    **Full agreement on strengths:**

    - The 0.6B factorial grid is well-designed with proper controls

    - The format-vs-semantic metric dissociation is a genuine, useful contribution

    - The direction reversal across capacity regimes is interesting (though effect
    sizes are small)

    - The paper is commendably honest about its limitations


    **R1-specific concerns endorsed by R2:**

    - The "incapacity vs resilience" alternative is acknowledged but unresolved; K=16
    stress test (53% loss drop, zero diversity change) strengthens the "incapacity"
    reading

    - Implicit length filtering in curated selection could be a confound (curated
    = systematically shorter sequences, explaining both OOM difference and diversity
    dynamics)

    - ArmoRM circularity: using the same model for curation and quality evaluation


    **R2-specific concerns endorsed by R1:**

    - Reference count (8 citations) is grossly insufficient for any top venue

    - Critical missing literatures: best-of-N sampling (Nakano, Stiennon, Coste, Beirami),
    diversity decline (Guo et al.), iterative self-play (SPIN), RLHF homogenization
    (Perez et al.), data curation (FineWeb/DSIR)

    - Title and practical recommendations overshoot evidence

    - Internal tension between "resilience is general" (Contribution 1) and "scale-dependent"
    (Contribution 2)


    **Minor disagreement resolved:**

    - R2 flagged "no mechanistic explanation" as MAJOR; R1 nuanced this as reasonable
    for an empirical characterization paper but agreed the hypothesized factors are
    untested. Consensus: the lack of mechanism is a weakness but secondary to the
    evidence gaps.

    - R1 flagged 3 generations as too short; R2 considered it acceptable. Consensus:
    generation depth is secondary to the absence of replication/variance.


    ---


    ## 3. Consolidated Strengths


    **S1. Thorough 0.6B factorial design.** The eight-configuration grid with matched
    curated/random pairs (C1/C5, C3/C6) enables clean causal attribution within the
    0.6B regime. The systematic variation of K, training method, and learning rate
    is well-motivated and provides good coverage.


    **S2. Format-vs-semantic dissociation.** The finding that Vendi Score misses format-level
    homogenization while surface metrics (opening entropy, near-duplicate rate) capture
    it is practically useful. The C1≈C5 format degradation comparison is the paper''s
    cleanest analytical contribution.


    **S3. Direction reversal across capacity regimes.** The three-point monotonic
    gradient (LoRA → Full-FT low-LR → Full-FT high-LR) is a methodologically important
    warning: LoRA-only evaluations of curation effects can produce misleading conclusions
    about diversity.


    **S4. Honest engagement with limitations.** The paper explicitly presents both
    hypotheses for 1.5B collapse (curation-caused vs scale-inherent) and enumerates
    missing controls clearly. This is commendable.


    ---


    ## 4. Consolidated Weaknesses


    ### CRITICAL


    **C1. Missing 1.5B random baseline fatally undermines the central contribution.**

    The paper''s headline claim is a "scale-dependent phase transition," but the 1.5B
    data point has no control condition. Three equally plausible interpretations cannot
    be distinguished: (a) curation causes collapse at scale, (b) iterative self-training
    itself causes collapse at scale regardless of curation, (c) Qwen2.5 architecture
    is more susceptible than Qwen3 irrespective of scale. The most interesting finding
    has the weakest evidence. (R1, R2 unanimous)


    **C2. Cross-family confound invalidates the scale interpretation.**

    0.6B experiments use Qwen3-0.6B; 1.5B uses Qwen2.5-1.5B-Instruct. These differ
    in architecture, pretraining data, instruction-tuning methodology, and tokenizer.
    Claiming a "scale-dependent" transition requires holding architecture constant
    (e.g., Qwen3-0.6B vs Qwen3-1.7B, or Qwen2.5-0.5B vs Qwen2.5-1.5B). Two data points
    from confounded conditions do not establish a phase transition. The term "phase
    transition" should be removed. (R1, R2 unanimous)


    **C3. Grossly insufficient references.**

    Only 8 citations. Critical missing literatures include: best-of-N sampling (the
    paper''s exact selection mechanism), RLHF/alignment diversity (Perez et al.),
    diversity decline in LLMs (Guo et al.), iterative self-play (SPIN, Chen et al.),
    data curation (FineWeb/DSIR). Reference density is approximately 3-4x below venue
    expectations. (R2, endorsed by R1)


    ### MAJOR


    **M1. No statistical significance testing or variance estimates.**

    All metrics are single-run point estimates. Vendi Score changes of -0.28% or +0.91%
    are presented as meaningful distinctions without any evidence they exceed sampling
    noise. The direction reversal claim (-3.41pp to +0.86pp) and the curation-vs-random
    gap computation compound the variance of unreplicated estimates. At minimum, repeated
    runs (3+ seeds) for key configurations are needed. (R1, R2 agree)


    **M2. "Incapacity vs resilience" alternative unresolved.**

    The K=16 stress test paradoxically undermines the 0.6B findings: if 53% loss drop
    and 6.25% retention still produce zero diversity change, the model may simply
    be below the capacity threshold for the phenomenon. This makes 0.6B-scoped claims
    (format collapse separation, capacity artifact) potentially artifacts of studying
    a regime where the model cannot respond. The paper acknowledges this but still
    frames these as contributions. (R1, partially endorsed by R2)


    **M3. Scale too small for generality of practical claims.**

    One model at 596M parameters, 2,200 prompts, 3 generations, single reward model.
    The practical recommendation ("practitioners do not need to engineer semantic
    diversity safeguards") dramatically overshoots what this evidence supports. Real
    pipelines operate at 7B-70B, 100K+ prompts, 10+ iterations. (R2, endorsed by R1)


    **M4. Novelty limited to empirical observation without mechanistic explanation.**

    Three hypothesized factors (prompt diversity, reward saturation, generation stochasticity)
    are listed but none individually ablated. The paper cannot distinguish whether
    all three contribute or one suffices. The contribution remains at the observation
    level. (R2)


    **M5. Arbitrary P1 collapse criterion.**

    The 2% Vendi Score threshold is never validated or justified. Why not 1% or 5%?
    The binary PASS/FAIL framework gives false precision and obscures the continuous
    nature of the data. (R1)


    **M6. Format metrics ad hoc and unvalidated.**

    Opening pattern entropy (first 50-token prefix) and near-duplicate start rate
    are intuitively reasonable but not calibrated against human judgments of repetitiveness,
    and not compared with existing structural diversity metrics. (R1, R2 agree)


    ### MINOR


    **m1.** Direction reversal effect size is tiny (+0.63 pp promotion under Full-FT),
    potentially within noise for 200-sample evaluation.


    **m2.** ArmoRM circularity: using the same reward model for curation and quality
    evaluation makes "quality stability" trivially expected.


    **m3.** Incomplete tables (C6 nn-distance missing, C7 quality missing) suggest
    rushed execution.


    **m4.** "Metric-dependent collapse" terminology conflates format homogenization
    with model collapse; "format homogenization under iterative training" would be
    more precise.


    **m5.** Missing Full-FT (lo) random baseline for the intermediate point of the
    three-regime gradient undermines the direction reversal claim.


    ---


    ## 5. Missing Experiments (Priority-Ordered)


    1. **[CRITICAL] 1.5B random baseline** (Qwen2.5-1.5B LoRA K=4 random, 5 gens).
    The single most important missing experiment.

    2. **[CRITICAL] Same-family scale comparison** (Qwen3 at larger scale OR Qwen2.5
    at smaller scale) to disentangle scale from architecture.

    3. **[MAJOR] Repeated runs** (3+ seeds) for key configurations (C1, C5, C3, C6)
    to enable significance testing.

    4. **[MAJOR] K > 4 at 1.5B** (K=8 or K=16) to explore K × scale interaction.

    5. **[MINOR] Human evaluation** of format diversity to validate proposed metrics.


    ---


    ## 6. Questions for Authors


    Q1. Have you attempted same-family scale comparison (Qwen2.5-0.5B or Qwen3-1.7B)
    to disentangle scale from architecture?


    Q2. What is the variance of Vendi Score across different random seeds? Without
    this, the significance of sub-1% changes is unassessable.


    Q3. Could implicit length filtering in curated selection (ArmoRM prefers moderate-length
    responses, truncating the length tail) explain both the OOM asymmetry and divergent
    diversity dynamics at 1.5B?


    Q4. LoRA rank 16 represents ~1.67% of parameters at 0.6B but ~0.5% at 1.5B. Could
    the proportionally tighter capacity constraint at 1.5B contribute to collapse?


    Q5. Where is the Full-FT (lo) random baseline needed to complete the three-regime
    gradient for the direction reversal claim?



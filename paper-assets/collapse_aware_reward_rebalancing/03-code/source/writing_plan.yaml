meta:
  venue: EMNLP 2026 ARR
  track: long paper
  template: ""  # EMNLP 2026 ARR 模板待获取
  template_note: "需 WebSearch 获取 EMNLP 2026 / ARR 2025 official LaTeX template (ACL rolling review format)"
  page_limit: 8
  deadline: 2026-05-25
  core_claim: >
    Reward-based curation in iterative self-consuming training does NOT cause semantic diversity collapse,
    but DOES cause format/template homogenization invisible to standard embedding-based metrics;
    the apparent LoRA suppression is a capacity artifact with direction reversal under Full-FT.
  created_at: 2026-05-17T10:00:00Z
  title_candidates:
    - "Does Reward Curation Kill Diversity? Systematic Evidence of Surprising Resilience in Iterative Self-Training"
    - "Reward Curation Without Collapse: Why Iterative Self-Training Resists Diversity Loss Under Standard Conditions"
  k16_patch_planned: true  # K=16 结果到后 patch 进论文

paper_outline:
  - section: abstract
    word_budget: 220
    core_bullets:
      - "问题: iterative self-consuming training with reward curation 被广泛担忧会导致 compounding diversity collapse"
      - "方法: 7 configs (LoRA/Full-FT × K=4/8 × LR=5e-6/2e-5, +baselines) × 3 generations 系统实验"
      - "核心发现: semantic diversity (Vendi Score) 在所有条件下保持稳定 (变化 < 1%), 但 format diversity 显著 collapse (near-dup opening 50%→84%)"
      - "洞察: LoRA 下的表观抑制是 capacity artifact, Full-FT 下 curation 效应反转为促进 (+0.63pp)"
      - "贡献: 推荐 opening_entropy + near_dup_start_rate 补充标准 embedding metrics"
    dependencies: [results, analysis, introduction]

  - section: introduction
    word_budget: 1200
    core_bullets:
      - "Hook: iterative self-training 中 reward curation 的 diversity collapse 恐惧 — 直觉上每代选择窄子集应导致 compounding narrowing"
      - "Gap: 现有文献 (Shumailov et al., Kirk et al.) 在 unfiltered self-training 或 single-round RLHF 中发现 collapse, 但无人系统验证 iterative reward-curated SFT"
      - "Insight: collapse 确实存在但被 mischaracterize — 发生在 format/template 层, 而标准 embedding metrics 完全盲区"
      - "Mechanism: 7 configs × 3 gens 系统实验 + LoRA artifact 诊断 + 补充 metrics 提案"
      - "Contributions: [C1: semantic resilience 系统证据, C2: metric-dependent format collapse, C3: LoRA direction reversal, C4: measurement contribution]"
    dependencies: [results]
    citation_hints:
      - "Shumailov et al. 2024 model collapse"
      - "Kirk et al. 2024 RLHF diversity"
      - "DIVE, DARLING, GEM as diversity-preserving methods"
    figures: [fig1_pipeline]

  - section: related_work
    word_budget: 900
    core_bullets:
      - "Cluster 1 (Diversity in RLHF): Kirk et al. 2024 单轮观察, CD-RLHF curiosity-driven → 我们: iterative 设置下 curation 不 compound"
      - "Cluster 2 (Model Collapse / Self-Consuming): Shumailov 2024, Alemohammad 2024, DIVE → 我们: reward-filtered ≠ unfiltered, curation 不加剧"
      - "Cluster 3 (Diversity-Preserving Methods): DARLING, GEM, DivPO → 我们: 这些方法假设 collapse 是 default, 我们证明标准条件下不是"
      - "Cluster 4 (Diversity Measurement): Vendi Score, Self-BLEU, embedding metrics → 我们: 标准 metrics 有 format blind spot"
    dependencies: [introduction]
    citation_hints:
      - "Kirk et al. 2024 ICLR"
      - "Shumailov et al. 2024 Nature"
      - "DIVE (arxiv 2501.00747)"
      - "DARLING (arxiv 2509.02534)"
      - "GEM (ICLR 2025)"
      - "CD-RLHF (ACL 2025)"

  - section: experimental_setup
    word_budget: 1000
    core_bullets:
      - "Pipeline: Qwen3-0.6B → generate K candidates → ArmoRM score → select top-1 → SFT → repeat 3 gens"
      - "Dataset: UltraFeedback 2200 prompts (2000 train / 200 eval)"
      - "条件设计 (7 configs): 2 adaptation (LoRA r=16 / Full-FT) × selection pressure (K=4/8) × LR (5e-6/2e-5) + 3 no-curation baselines"
      - "变量隔离逻辑: LoRA vs Full-FT (capacity), K (selection pressure), LR (learning intensity), curation vs random (causal)"
      - "Metrics: Vendi Score (primary semantic), Self-BLEU, NN Distance, training loss, ArmoRM quality, opening_entropy, near_dup_start_rate"
    dependencies: []
    registry_refs:
      - carr_quick_probe_03
      - carr_quick_probe_k8_02
      - carr_fullft_k4_probe_03
      - carr_fullft_lr2e5_probe_01
      - carr_baseline_no_curation_01
      - carr_fullft_nocuration_01
      - carr_fullft_lr2e5_nocuration_01
    tables: [tab1_conditions, tab2_metrics_full]
    figures: [fig1_pipeline]

  - section: results
    word_budget: 1800
    core_bullets:
      - "4.1 Main Finding — No Semantic Collapse: 所有 curated 条件 Vendi 变化 < 1% (range -0.27% to +0.91%)"
      - "4.2 Relative Suppression vs Absolute Collapse: baseline 自然增长 +1.4% to +3.1%, curated 增长被抑制但不逆转"
      - "4.3 Direction Reversal (核心): curation effect 从 LoRA -3.4pp → Full-FT lr=5e-6 -0.46pp → Full-FT lr=2e-5 +0.63pp"
      - "4.4 Quality-Diversity Non-Tradeoff: ArmoRM 质量评分变化 < 1.2%, 无 quality-diversity tradeoff"
    dependencies: [experimental_setup]
    registry_refs:
      - carr_quick_probe_03
      - carr_quick_probe_k8_02
      - carr_fullft_k4_probe_03
      - carr_fullft_lr2e5_probe_01
      - carr_baseline_no_curation_01
      - carr_fullft_nocuration_01
    tables: [tab2_metrics_full, tab3_vendi_summary, tab4_training_loss]
    figures: [fig2_vendi_trajectories, fig3_direction_reversal]

  - section: analysis
    word_budget: 1500
    core_bullets:
      - "5.1 Metric-Dependent Collapse (核心): opening unique ratio 70%→37%, near-dup 50%→84%, entropy -1.13 bits vs baseline -0.75 bits; 但 Vendi flat"
      - "5.2 Why Semantic Collapse Doesn't Happen: prompt diversity anchor + reward model saturation + generation stochasticity"
      - "5.3 LoRA Capacity Artifact Mechanism: 1.67% trainable params 施加 implicit regularization, 限制所有方向 drift"
      - "5.4 Measurement Contribution: opening_entropy + near_dup_start_rate 捕捉 embedding metrics 遗漏的 format homogenization"
    dependencies: [results]
    registry_refs:
      - carr_quick_probe_k8_02
      - carr_baseline_no_curation_01
    tables: [tab5_format_collapse]
    figures: [fig4_format_collapse]

  - section: discussion
    word_budget: 700
    core_bullets:
      - "6.1 Implications: diversity-preserving methods (DIVE/DARLING/GEM) 可能优化错误层面 — 应关注 format 而非 semantic"
      - "6.2 Relation to Kirk et al.: 单轮 RLHF diversity loss 在 iterative SFT 中不 compound"
      - "6.3 Practical Guidance: (1) 不需 semantic safeguards (2) 监控 format metrics (3) LoRA 评估需谨慎"
      - "6.4 Limitations: 0.6B scale, 3 gens depth, UltraFeedback only, single RM, format metrics 粒度"
    dependencies: [analysis, results]

  - section: conclusion
    word_budget: 300
    core_bullets:
      - "重申: reward curation 在标准条件下不导致 semantic collapse, 但导致 format homogenization"
      - "LoRA artifact 警告: capacity-confounded evaluation 会误判 curation 效应"
      - "Future: 更大模型, 更多代, 更极端 K, format-aware curation 方法"
    dependencies: [results, analysis, discussion]

visualization_plan:
  - fig_id: fig1_pipeline
    type: conceptual
    tool: paperbanana
    description: "Iterative self-training pipeline 示意图: Base Model → Generate K → Reward Score → Select Top-1 → SFT Train → Next Gen. 标注 7 条件的变量分支 (LoRA/Full-FT, K=4/8, LR)"
    placement: experimental_setup
    aspect_ratio: "16:9"
    data_source: "manual"

  - fig_id: fig2_vendi_trajectories
    type: statistical
    tool: matplotlib
    description: "Vendi Score 折线图: x=generation (0,1,2), y=Vendi Score, 7 lines (4 curated solid + 3 baseline dashed). 展示 curated 平坦/微增, baseline 上升, 无 collapse"
    placement: results
    aspect_ratio: "4:3"
    data_source: "registry: carr_quick_probe_03, carr_quick_probe_k8_02, carr_fullft_k4_probe_03, carr_fullft_lr2e5_probe_01, carr_baseline_no_curation_01, carr_fullft_nocuration_01"

  - fig_id: fig3_direction_reversal
    type: statistical
    tool: matplotlib
    description: "Direction reversal bar chart: x=3 training regimes (LoRA / Full-FT lr=5e-6 / Full-FT lr=2e-5), y=curated-vs-baseline Vendi gap (pp). 从 -3.4 → -0.46 → +0.63 的梯度. 零线标注, 负值红色, 正值蓝色"
    placement: results
    aspect_ratio: "3:2"
    data_source: "registry: carr_quick_probe_03, carr_fullft_k4_probe_03, carr_fullft_lr2e5_probe_01, carr_baseline_no_curation_01, carr_fullft_nocuration_01, carr_fullft_lr2e5_nocuration_01"

  - fig_id: fig4_format_collapse
    type: statistical
    tool: matplotlib
    description: "Format collapse vs semantic stability 对比图: 左 panel opening_unique_ratio + near_dup_start_rate 的 gen0→gen2 变化 (curation vs baseline); 右 panel Vendi Score 同期对比. 视觉对比: format 剧变 vs Vendi 平坦 = metric blind spot"
    placement: analysis
    aspect_ratio: "16:9"
    data_source: "manual: collapse_signal_summary.md 数据"

table_plan:
  - table_id: tab1_conditions
    caption: "Experimental configurations spanning adaptation method, selection pressure, and learning rate"
    placement: experimental_setup
    type: configuration
    columns: [Condition, Adaptation, K, LR, Curation, Trainable Params]
    data_source: "manual"
    notes: "7 conditions (C1-C7), 标注变量隔离逻辑"

  - table_id: tab2_metrics_full
    caption: "Full metrics across 7 configurations and 3 generations"
    placement: results
    type: comparison
    columns: [Condition, Gen, Quality, Vendi Score, Self-BLEU, NN Distance, PPL]
    data_source: "registry: carr_quick_probe_03, carr_quick_probe_k8_02, carr_fullft_k4_probe_03, carr_fullft_lr2e5_probe_01, carr_baseline_no_curation_01, carr_fullft_nocuration_01"
    notes: "主结果表, 加粗各指标最优值"

  - table_id: tab3_vendi_summary
    caption: "Vendi Score trajectory summary with curation-vs-baseline gaps"
    placement: results
    type: comparison
    columns: [Condition, Vendi Gen0, Vendi Gen2, Abs Change, Rel Change (%), Gap vs Baseline (pp)]
    data_source: "registry: all 7 configs"
    notes: "核心 claim 支撑表"

  - table_id: tab4_training_loss
    caption: "Average training loss per generation demonstrating learning dynamics"
    placement: results
    type: statistics
    columns: [Condition, Gen 0 Loss, Gen 1 Loss, Gen 2 Loss, Total Reduction]
    data_source: "registry: all 7 configs"
    notes: "证明模型确实在学习 curated distribution"

  - table_id: tab5_format_collapse
    caption: "Format-level collapse metrics invisible to embedding-based diversity measures"
    placement: analysis
    type: comparison
    columns: [Metric, K=8 Curation Gen0, K=8 Curation Gen2, Baseline Gen0, Baseline Gen2, Delta]
    data_source: "manual: collapse_signal_summary.md"
    notes: "opening_unique_ratio, near_dup_start_rate, opening_entropy, per-response TTR"

literature_strategy:
  citation_budget: 35
  macro_context:
    - "diversity in language model alignment and RLHF"
    - "iterative self-training and model collapse"
    - "diversity measurement in NLG"
  micro_clusters:
    - cluster_name: "Diversity in RLHF"
      search_queries:
        - "RLHF diversity reduction language model 2024 2025"
        - "reward optimization diversity collapse alignment"
        - "best-of-n sampling diversity effects"
      must_cite:
        - "Kirk et al. 2024 Understanding the Effects of RLHF on LLM Diversity (ICLR)"
        - "CD-RLHF curiosity-driven (ACL 2025)"
      target_count: 6

    - cluster_name: "Model Collapse and Self-Consuming"
      search_queries:
        - "model collapse self-consuming generative models 2024"
        - "iterative self-training language model degeneration"
        - "synthetic data training feedback loop"
      must_cite:
        - "Shumailov et al. 2024 AI models collapse (Nature)"
        - "Alemohammad et al. 2024 self-consuming generative models"
        - "DIVE (arxiv 2501.00747)"
      target_count: 8

    - cluster_name: "Diversity-Preserving Methods"
      search_queries:
        - "diversity preserving reinforcement learning language model 2024 2025"
        - "quality diversity alignment LLM training"
      must_cite:
        - "DARLING (arxiv 2509.02534)"
        - "GEM game-theoretic diversity (ICLR 2025)"
      target_count: 6

    - cluster_name: "Diversity Measurement"
      search_queries:
        - "Vendi Score diversity kernel 2023"
        - "diversity metrics text generation evaluation"
        - "self-BLEU embedding diversity NLG"
      must_cite:
        - "Friedman and Dieng 2023 Vendi Score"
      target_count: 5

    - cluster_name: "Iterative Self-Improvement"
      search_queries:
        - "STaR self-taught reasoner iterative 2024"
        - "ReST reinforced self-training language model"
        - "self-play improvement LLM 2024 2025"
      must_cite: []
      target_count: 5

    - cluster_name: "LoRA and Parameter-Efficient Methods"
      search_queries:
        - "LoRA capacity limitations fine-tuning 2024"
        - "full fine-tuning vs LoRA comparison"
      must_cite:
        - "Hu et al. 2022 LoRA"
      target_count: 5

writing_order:
  - experimental_setup
  - results
  - analysis
  - introduction
  - related_work
  - discussion
  - abstract
  - conclusion

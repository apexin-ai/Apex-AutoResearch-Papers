mistakes:
- id: M001
  date: '2026-05-17'
  category: code_bug
  severity: medium
  summary: 'C1 re-gen OOM: CUDA_VISIBLE_DEVICES 未设置导致进程跑到被 K=16 占满的 GPU 1'
  root_cause: Worker 启动 C1 re-generation 时未在命令中显式设置 CUDA_VISIBLE_DEVICES=0，PyTorch
    默认使用所有可见 GPU，进程尝试分配到已被 K=16 占满的 cuda:1 导致 OOM
  prevention: 所有 GPU 任务启动时必须在命令最前面显式设置 CUDA_VISIBLE_DEVICES=X，不依赖默认行为。审批实验时检查启动命令是否包含此设置。
  status: active
  fix: 重新派 Worker 用 CUDA_VISIBLE_DEVICES=0 显式重启
- id: M002
  date: '2026-05-17'
  category: code_bug
  severity: medium
  summary: 'C1 re-gen OOM: ArmoRM 8B 未在 scoring 后释放，训练时 GPU 内存不足'
  root_cause: pipeline.py scoring 阶段加载 ArmoRM (8B, ~16GB VRAM)，scoring 完成后未释放模型。后续
    training 阶段加载 Qwen3-0.6B + optimizer 时 VRAM 不足导致 OOM。
  prevention: pipeline.py 中每个阶段（generate/score/train/evaluate）使用的大模型在该阶段完成后必须显式 del
    + torch.cuda.empty_cache() 释放。不同阶段的模型不应共存于 GPU。
  status: active
  fix: pipeline.py scoring 后加 del reward_model; torch.cuda.empty_cache()

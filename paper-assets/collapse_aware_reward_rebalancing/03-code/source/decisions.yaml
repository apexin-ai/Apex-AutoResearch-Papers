_next_id: 15
decisions:
- id: D001
  date: 2026-05-16 07:37 UTC
  summary: 'MVP 设计: Qwen3.5-0.8B + LoRA, 4 条件 × 5 代, 验证 CARR 是否优于 fixed-weight curation'
  rationale: 核心假设需最小实验验证：(1) collapse 在 iterative curation 中可观测，(2) CARR 自适应比 fixed-weight
    更好防 collapse。选择 0.8B+LoRA 因为 2 GPU 资源下需要快速迭代。T=5 平衡了 collapse 信号检测和 MVP 速度。4 条件覆盖了无
    curation / 单目标 / 固定多目标 / CARR 的递进对比。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-16 07:41 UTC
  summary: '采纳 Reviewer 4 点建议: 增加 Quick Probe, P1 降至 5%, P2 增加 ≥5% 效应量, 双指标记录'
  rationale: Reviewer 指出 T=5 可能不足以触发显著 collapse，P2 无最小效应量无统计意义，curation 和评估指标不对齐。采纳全部建议：(1)
    先跑单目标 3 代 Quick Probe 验证 collapse 可见性再铺全部实验；(2) P1 阈值降至 5%；(3) P2 增加 ≥5% 相对改善要求；(4)
    同时记录 NN distance 和 Vendi Score。GPU 型号已确认为 RTX 5090 32GB。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-16 07:49 UTC
  summary: '代码审查修复: W1 mask prompt labels, W2 diversity scoring 改为 corpus-level, W3
    双 GPU 并行'
  rationale: 'W2 是核心风险: per-prompt K=4 diversity NN distance 几乎无区分力（同模型同 prompt 的
    4 个 response embedding 极相似），改为 corpus-level NN distance（全部 8000 候选中的 NN distance）使信号有意义。W1
    修复简单但影响绝对质量。W3 在 Full MVP 阶段需要双 GPU 并行。I1 补充 evaluate.py 中的 NN distance 指标。'
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-16 14:13 UTC
  summary: 'P1 FAIL: K=4 + LoRA + T=3 下无可观测 collapse。暂停 Full MVP，启动 K=8 Quick Probe
    加压验证'
  rationale: 'Quick Probe 03 结果: Vendi Score 3 代仅降 0.27%（反弹），远不及 P1≥5% 阈值。self-BLEU
    波动非单调，无 collapse 趋势。原因诊断: K=4 选择压力太弱（25% 保留率，候选间差异仅 0.04）+ LoRA 约束模型 drift + T=3
    太短。按 Reviewer 建议，优先用 K=8 (12.5% 保留率) 加压重跑 Quick Probe，这是成本最低的验证路径。Full MVP 在确认
    collapse 可观测前不启动。'
  related_experiments:
  - exp_id: carr_quick_probe_03
    role: evidence
    result: 'P1 FAIL: Vendi -0.27% over 3 gens'
  depends_on:
  - D002
- id: D005
  date: 2026-05-16 15:50 UTC
  summary: Baseline 显示 curation 抑制 diversity 增长 (relative gap 3.4pp)。cuda:1 启动 full-FT
    K=4 诊断，与 K=8 LoRA 并行
  rationale: No-curation baseline Vendi Score 3 代增长 +3.1%，而 single_reward K=4 下降 -0.28%，相对差距
    3.4pp。这说明 curation 确实抑制了 diversity，但表现为"抑制自然增长"而非"绝对 collapse"。cuda:1 空闲，启动 full-FT
    K=4 Quick Probe 与 K=8 LoRA 并行诊断：如果 K=8 LoRA pass 则 selection pressure 是关键变量；如果
    full-FT pass 则 LoRA 是约束因素。两步同时走节省时间。
  related_experiments:
  - exp_id: carr_baseline_no_curation_01
    role: evidence
    result: Vendi +3.1% over 3 gens (no curation)
  - exp_id: carr_quick_probe_03
    role: evidence
    result: Vendi -0.28% over 3 gens (single_reward K=4)
  depends_on:
  - D004
- id: D006
  date: 2026-05-16 15:51 UTC
  summary: '重新定义 P1: 从 Vendi 绝对下降 ≥5% 改为 baseline-relative gap ≥5pp'
  rationale: 'Baseline (no_curation) 显示 iterative SFT 自然增加 diversity (+3.1%/3代)。用绝对下降做
    P1 标准是错误的——curation 的真实效应是抑制自然增长 (relative gap 3.4pp with K=4)。新 P1: Vendi(baseline)
    - Vendi(curation) ≥ 5pp 在同代数下。K=4 已有 3.4pp gap，K=8 有望超过 5pp。这也改变了论文 framing：从
    "prevent dramatic collapse" 到 "curation suppresses natural diversity growth, CARR
    restores it"。'
  related_experiments:
  - exp_id: carr_baseline_no_curation_01
    role: evidence
    result: Vendi +3.1% (natural growth)
  - exp_id: carr_quick_probe_03
    role: evidence
    result: Vendi -0.28% (growth suppressed)
  depends_on:
  - D005
- id: D007
  date: 2026-05-16 19:56 UTC
  summary: K=8 P1 FAIL，与 K=4 收敛到相同 Vendi (107.25)。确认 LoRA 是 collapse 瓶颈，Full-FT probe
    是决定性实验
  rationale: K=8 (12.5% 保留率) Vendi 变化 -0.03%，与 K=4 (-0.28%) 在 Gen 2 完全相同 (107.25)。选择压力翻倍无增量效应，排除了
    "K 不够" 假设。LoRA 仅 1.67% 参数可训练，限制了模型 drift 幅度，无论训练数据 diversity 多低都无法 overfit。Full-FT
    probe (cuda:1, probe_03) 是唯一剩余的关键实验：如果 full-FT 产生 collapse → 论文 story 成立 (LoRA
    约束 + CARR 解药)；如果也平坦 → 需要更激进设计变更。
  related_experiments:
  - exp_id: carr_quick_probe_k8_02
    role: evidence
    result: Vendi -0.03% over 3 gens, identical to K=4
  - exp_id: carr_quick_probe_03
    role: evidence
    result: Vendi -0.28%, converges to 107.25
  - exp_id: carr_baseline_no_curation_01
    role: baseline
    result: Vendi +3.1%
  depends_on:
  - D006
- id: D008
  date: 2026-05-16 20:37 UTC
  summary: Full-FT K=4 P1 FAIL (Vendi +0.9%)，LR underfitting 是根因。立即跑 LR=2e-5 Full-FT
    验证
  rationale: Full-FT K=4 probe Vendi 反而上升 +0.9%，与 baseline 趋势一致。Training loss 仅降 12%
    (vs LoRA 38%)，grad_norm 6-10，明确 underfitting。LR=5e-6 对 0.6B full-FT 太保守——模型没有充分学习
    curated data 的分布特征。提高 LR 到 2e-5 是成本最低的验证：如果模型真正 overfit 到 quality-curated 的窄分布上，应该能观察到
    diversity 下降。这是诊断梯的最后一次低成本尝试。
  related_experiments:
  - exp_id: carr_fullft_k4_probe_03
    role: evidence
    result: Vendi +0.9%, loss only 12% drop = underfitting
  depends_on:
  - D007
- id: D009
  date: 2026-05-17 00:27 UTC
  summary: P1 5/5 全部 FAIL，核心假设证伪：curation 不导致 diversity collapse（当前设置下）
  rationale: 5 种配置（K=4/K=8 LoRA, Full-FT LR=5e-6/2e-5, baseline）系统性验证：即使模型 loss 降
    80%（激进学习 curated 分布），Vendi Score 仍上升。LoRA 下 3pp gap 经 Full-FT 证实为 capacity artifact。在
    Qwen3-0.6B + 2200 prompts + K=4-8 + T=3 下，reward-guided curation 无法造成可观测的 diversity
    collapse。等待用户决策 pivot 方向。
  related_experiments:
  - exp_id: carr_quick_probe_03
    role: K=4 LoRA
    result: Vendi -0.27%, FAIL
  - exp_id: carr_quick_probe_k8_02
    role: K=8 LoRA
    result: Vendi -0.03%, FAIL
  - exp_id: carr_fullft_k4_probe_03
    role: Full-FT LR=5e-6
    result: Vendi +0.91%, FAIL
  - exp_id: carr_fullft_lr2e5_probe_01
    role: Full-FT LR=2e-5
    result: Vendi +0.68%, FAIL
  - exp_id: carr_baseline_no_curation_01
    role: baseline
    result: Vendi +3.13%
  depends_on:
  - D008
  - D007
  - D006
  - D005
  - D004
- id: D010
  date: 2026-05-17 01:23 UTC
  summary: '采用 C→D fallback pipeline: 24h 内验证 CARR Pareto optimizer (Direction C)，失败则切
    negative result paper (Direction D)'
  rationale: Reviewer 独立评估排序 C>D>E>A>B。Direction C 不依赖 collapse 存在，只需 CARR outperform
    fixed-weight，与现有代码基础兼容。Direction D 作为 fallback 数据已全部就绪。24h 决策窗口 (May 18 早) 兼顾试错空间和
    DDL 安全边际。K=16 结果对两条路径均有用。
  related_experiments:
  - exp_id: carr_fullft_lr2e5_probe_01
    role: P1 最终诊断
    result: Vendi +0.68%, FAIL
  - exp_id: carr_fullft_lr2e5_k16_probe_01
    role: 极端选择压力诊断
    result: RUNNING
  depends_on:
  - D009
- id: D011
  date: 2026-05-17 03:11 UTC
  summary: 'Direction C FAIL (CARR dry-run 99.3% overlap)，切 Direction D: negative
    result empirical study'
  rationale: CARR dry-run 证明 proxy scores 三维度高度相关 (r=0.63-0.77)，adaptive weights 几乎不改变
    selection (overlap 99.3%)。Direction C 的前提"CARR 能 outperform fixed-weight"不成立。Direction
    D 是唯一可行路径：数据完整、story 清晰（"curation doesn't cause collapse under standard conditions"）、7
    天可完成。竞品论文 5/5 真实，related work 定位无风险。K=16 仍在跑作为 bonus data point。
  related_experiments:
  - exp_id: carr_fullft_lr2e5_k16_probe_01
    role: K=16 boundary probe
    result: RUNNING
  - exp_id: carr_fullft_lr2e5_probe_01
    role: P1 final diagnostic
    result: Vendi +0.68%, FAIL
  depends_on:
  - D010
- id: D012
  date: 2026-05-17 09:46 UTC
  summary: K=16 P1 FAIL (Vendi -0.19%)，确认 Outline A：8 配置全部无 semantic collapse
  rationale: K=16 (6.25% 保留率) 是最极端的 selection pressure 测试。Vendi 仅变化 -0.19%，落在其他条件
    [-0.28%, +0.91%] 范围内。训练 loss 收敛更深 (0.097) 但语义多样性不受影响。至此 8/8 配置均无 semantic collapse，论文走
    Outline A (systematic negative result + metric-dependent collapse)。
  related_experiments:
  - exp_id: carr_fullft_lr2e5_k16_probe_01
    role: K=16 极端选择压力
    result: Vendi -0.19%, no collapse
  depends_on:
  - D011
- id: D013
  date: 2026-05-17 10:49 UTC
  summary: Format collapse 因果归因修正：从"curation causes"改为"iterative self-training causes,
    K amplifies"
  rationale: C1 vs C5 同 K=4 对比显示 format 退化幅度几乎完全相同（opening entropy 均 -0.75 bits，near-dup
    rate 差异仅 1.2pp）。原论文用 C2(K=8) vs C5(K=4) 混淆了 K 效应和 curation 效应。正确归因：format collapse
    是 iterative self-training 固有属性，K 是放大因子，curation 本身不额外导致 format collapse。这是更强的发现——完全为
    reward curation 正名。
  related_experiments:
  - exp_id: c1-regen-v2
    role: evidence
    result: C1 format metrics ≈ C5 format metrics at same K=4
  - exp_id: carr_quick_probe_k8_02
    role: contrast
    result: C2 K=8 shows stronger format collapse due to higher K, not curation
  depends_on:
  - D012
  - D009
- id: D014
  date: 2026-05-17 14:26 UTC
  summary: 保留叙事顺序（semantic→format→reversal），不采纳 Reviewer 建议的 format-first 重排
  rationale: '论文核心叙事弧是 Fear→Surprise→Understanding。format collapse 的新颖性通过"semantic
    没问题→但 format 有问题"的悬念反转放大，重排为 format-first 会削弱读者的 surprise 体验。贡献已精简为 3 条（合并 K amplifier
    + measurement 进 #2），结构足够紧凑。'
  related_experiments: []
  depends_on:
  - D013

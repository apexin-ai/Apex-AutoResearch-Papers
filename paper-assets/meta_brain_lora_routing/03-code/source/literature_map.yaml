# Literature Map — Perturbation-Adaptive LoRA Routing (PAR)
# Project: meta_brain_lora_routing
# Target venue: CoRL 2026
# Initial compilation: 2026-05-16
# Updated: 2026-05-16 (expanded to 41 papers)
#
# Categories:
#   direct-competitor — methods we directly compete with on VLA robustness
#   method-component   — building blocks: LoRA routing/MoE, activation probing
#   evaluation         — benchmarks we use or are evaluated on
#   background         — VLA architecture + general robustness context

papers:

  # ─────────── direct-competitor ───────────

  - id: "libero_plus2025"
    title: "LIBERO-Plus: In-depth Robustness Analysis of Vision-Language-Action Models"
    authors: "OpenMOSS et al."
    venue: "arXiv (CVPR 2026 poster accepted)"
    year: 2025
    url: "https://arxiv.org/abs/2510.13626"
    category: "direct-competitor"
    role: "robustness benchmark + diagnosis baseline"
    relevance: "Most directly aligned prior work — defines 7 perturbation dimensions (object layout, camera, robot init, language, lighting, background, sensor noise) and shows VLA success drops 95→<30% under modest perturbations. Our PAR taxonomy (visual/spatial/physical) is a coarsening of theirs; we go beyond diagnosis to active correction via routed LoRA experts."
    key_findings: "Models extremely sensitive to camera viewpoints + robot initial states; insensitive to language (ignore it). 10,030 tasks across 7 dimensions × 21 sub-dimensions with L1–L5 difficulty levels."

  - id: "robustvla2025"
    title: "RobustVLA: Robustness-Aware Reinforcement Post-Training for Vision-Language-Action Models"
    authors: "Anonymous et al."
    venue: "arXiv 2511.01331"
    year: 2025
    url: "https://arxiv.org/abs/2511.01331"
    category: "direct-competitor"
    role: "competing robustness post-training method"
    relevance: "Alternative path to VLA robustness — online RL with Jacobian + smoothness regularization. Differs from PAR: they modify the full policy via RL gradients; we keep π₀ frozen and add small targeted LoRAs. Must compare param count + need for env interaction."
    key_findings: "Jacobian regularization reduces sensitivity to observation noise; smoothness regularization stabilizes actions under perturbation. Online RL post-training framework."

  - id: "eva_vla2025"
    title: "Eva-VLA: Evaluating Vision-Language-Action Models' Robustness Under Real-World Physical Variations"
    authors: "Anonymous et al."
    venue: "arXiv 2509.18953"
    year: 2025
    url: "https://arxiv.org/abs/2509.18953"
    category: "direct-competitor"
    role: "robustness evaluation framework"
    relevance: "Frames physical variations as a continuous optimization problem to find worst-case perturbations. Reports >60% failure across all categories — motivates need for targeted correction (our PAR contribution)."
    key_findings: "Unified framework converting discrete physical variations into continuous optimization. Reveals significant fragility in current VLA systems."

  - id: "tt_vla2026"
    title: "On-the-Fly VLA Adaptation via Test-Time Reinforcement Learning"
    authors: "Anonymous et al."
    venue: "arXiv 2601.06748"
    year: 2026
    url: "https://arxiv.org/abs/2601.06748"
    category: "direct-competitor"
    role: "test-time adaptation baseline"
    relevance: "Alternative — adapt at test time via value-free PPO with progress rewards. Requires env interaction + reward signal. PAR is feed-forward: probe activation → route to expert, no online learning needed at deploy time."
    key_findings: "Within-episode policy adaptation via test-time PPO using dense progress-based rewards."

  - id: "preserve_pretrain2025"
    title: "Enhancing Generalization in Vision–Language–Action Models by Preserving Pretrained Representations"
    authors: "Anonymous et al."
    venue: "arXiv 2509.11417"
    year: 2025
    url: "https://arxiv.org/abs/2509.11417"
    category: "direct-competitor"
    role: "VLA generalization via representation preservation"
    relevance: "Argues full fine-tuning destroys VLA generalization → preserve pretrained reps. Consistent with our 'freeze π₀, add LoRA' design choice. Cite as motivation for frozen-backbone approach."
    key_findings: "Preserving pretrained VLM features improves OOD generalization vs aggressive full fine-tuning."

  - id: "vls2026"
    title: "VLS: Steering Pretrained Robot Policies via Vision-Language Models"
    authors: "Anonymous et al."
    venue: "arXiv 2602.03973"
    year: 2026
    url: "https://arxiv.org/abs/2602.03973"
    category: "direct-competitor"
    role: "test-time steering without param updates"
    relevance: "Steers diffusion/flow policy at inference using VLM-synthesized rewards — no LoRA, no training. Comparison point: PAR achieves correction with tiny adapter overhead, VLS adds VLM inference cost per step."
    key_findings: "Inference-time policy steering via VLM-derived trajectory-differentiable rewards, no policy parameter updates."

  # ─────────── method-component: LoRA routing / MoE-LoRA ───────────

  - id: "mole_iclr2024"
    title: "Mixture of LoRA Experts"
    authors: "Wu, Xun et al."
    venue: "ICLR 2024"
    year: 2024
    url: "https://arxiv.org/abs/2404.13628"
    category: "method-component"
    role: "foundational LoRA MoE gating framework"
    relevance: "Foundational MoLE paper — learns layer-wise gating over multiple trained LoRAs while keeping all other params frozen. PAR borrows the concept of composing pre-trained LoRA experts via gating but replaces learned token-level gates with perturbation-diagnosis-driven routing."
    key_findings: "Learnable gating function composes multiple LoRAs non-destructively; evaluated on NLP and V&L tasks; minimal compute overhead during training."

  - id: "ld_mole2025"
    title: "LD-MoLE: Learnable Dynamic Routing for Mixture of LoRA Experts"
    authors: "Anonymous et al."
    venue: "arXiv 2509.25684"
    year: 2025
    url: "https://arxiv.org/abs/2509.25684"
    category: "method-component"
    role: "differentiable LoRA routing mechanism"
    relevance: "Closest router design — token-dependent, layer-wise expert allocation, differentiable replacement for TopK. PAR can borrow this routing formulation but conditions on perturbation-type from probe rather than token features."
    key_findings: "Differentiable router selects variable number of experts per token per layer; SOTA on Qwen3-1.7B/Llama-3.2-3B benchmarks."

  - id: "l_moe2025"
    title: "L-MoE: End-to-End Training of a Lightweight Mixture of Low-Rank Adaptation Experts"
    authors: "Anonymous et al."
    venue: "arXiv 2510.17898"
    year: 2025
    url: "https://arxiv.org/abs/2510.17898"
    category: "method-component"
    role: "lightweight MoLE architecture"
    relevance: "Gating composes LoRA adapters by weighted average of params per input token, fully differentiable. PAR variant: composition driven by discrete perturbation diagnosis rather than soft token gating."
    key_findings: "End-to-end gating learns parameter-level composition of LoRA experts; lightweight design."

  - id: "lora_mixer2025"
    title: "LoRA-Mixer: Coordinate Modular LoRA Experts Through Serial Attention Routing"
    authors: "Anonymous et al."
    venue: "arXiv 2507.00029"
    year: 2025
    url: "https://arxiv.org/abs/2507.00029"
    category: "method-component"
    role: "modular LoRA MoE in attention layers"
    relevance: "Replaces attention input/output projections with dynamically routed task-specific LoRA experts. +7.6/4.9/3.1% over base on GSM8K/HumanEval/MedQA. Architectural template for PAR's attention-side experts."
    key_findings: "Modular MoE framework integrating LoRA at attention projection layers via serial routing."

  - id: "smora2025"
    title: "Each Rank Could be an Expert: Single-Ranked Mixture of Experts LoRA for Multi-task Learning"
    authors: "Anonymous et al."
    venue: "arXiv 2501.15103"
    year: 2025
    url: "https://arxiv.org/abs/2501.15103"
    category: "method-component"
    role: "fine-grained LoRA expert granularity"
    relevance: "Treats each LoRA rank as an independent expert with dynamic rank-wise activation. Alternative to our 3-discrete-experts design; could ablate against rank-as-expert as 'finer granularity baseline'."
    key_findings: "Embeds MoE into LoRA at rank level; dynamic rank-wise activation mitigates task conflicts."

  - id: "hdmole2024"
    title: "HDMoLE: Mixture of LoRA Experts with Hierarchical Routing and Dynamic Thresholds for Fine-Tuning LLM-based ASR Models"
    authors: "Anonymous et al."
    venue: "arXiv 2409.19878"
    year: 2024
    url: "https://arxiv.org/abs/2409.19878"
    category: "method-component"
    role: "hierarchical LoRA routing"
    relevance: "Establishes explicit correspondence between LoRA experts and domain tasks via hierarchical routing — methodologically aligned with our perturbation-type → expert mapping."
    key_findings: "Hierarchical router with dynamic thresholds; clean expert↔task correspondence."

  - id: "hmora_iclr2025"
    title: "HMoRA: Making LLMs More Effective with Hierarchical Mixture of LoRA Experts"
    authors: "Liao, Mengqi et al."
    venue: "ICLR 2025"
    year: 2025
    url: "https://openreview.net/forum?id=lTkHiXeuDl"
    category: "method-component"
    role: "hierarchical token+task-level routing"
    relevance: "Hybrid routing integrating token-level and task-level signals hierarchically. Outperforms full fine-tuning with 3.9% params. PAR's router similarly combines token-level activation features with task-level (perturbation-type) conditioning — HMoRA validates this dual-level design."
    key_findings: "Hierarchical routing captures fine-grained token info + broad task context; novel routing auxiliary loss improves expert selection certainty and generalizes to unseen tasks."

  - id: "dynmole2025"
    title: "DynMoLE: Boosting Mixture of LoRA Experts Fine-Tuning with a Hybrid Routing Mechanism"
    authors: "Anonymous et al."
    venue: "arXiv 2504.00661"
    year: 2025
    url: "https://arxiv.org/abs/2504.00661"
    category: "method-component"
    role: "entropy-based dynamic routing for MoLE"
    relevance: "Dynamically adjusts expert selection based on Tsallis entropy of router distribution — mitigates router uncertainty and promotes equitable expert participation. Relevant design principle for PAR's router: entropy regularization to avoid expert collapse."
    key_findings: "Tsallis entropy-based hybrid routing; +9.6% over LoRA and +2.3% over MoLA on commonsense reasoning; faster convergence."

  - id: "hilora2025"
    title: "HiLoRA: Adaptive Hierarchical LoRA Routing for Training-Free Domain Generalization"
    authors: "Han, Ziyi et al."
    venue: "arXiv 2510.12266"
    year: 2025
    url: "https://arxiv.org/abs/2510.12266"
    category: "method-component"
    role: "training-free LoRA routing at inference"
    relevance: "Most relevant to PAR's inference-time routing — routes over a LoRA pool without additional training using Gaussian likelihoods at sequence-level and rank-one component activation at token-level. PAR similarly requires no router training: perturbation probe outputs directly determine routing."
    key_findings: "Training-free hierarchical routing with theoretical guarantees; up to 55% accuracy gain over baselines; sequence-level LoRA selection + token-level rank-one component activation."

  # ─────────── method-component: task-specific adapter selection ───────────

  - id: "adapterfusion2021"
    title: "AdapterFusion: Non-Destructive Task Composition for Transfer Learning"
    authors: "Pfeiffer, Jonas et al."
    venue: "EACL 2021"
    year: 2021
    url: "https://arxiv.org/abs/2005.00247"
    category: "method-component"
    role: "foundational adapter composition method"
    relevance: "Seminal work on composing task-specific adapters via learned attention — separates knowledge extraction (per-task adapters) from knowledge composition (fusion layer). PAR's design directly extends this paradigm: perturbation-specific LoRAs are the 'task adapters', and the probe-based router is our 'fusion mechanism'."
    key_findings: "Two-stage: train task adapters → learn composition weights via attention. Outperforms multi-task learning and sequential fine-tuning on 16 NLU tasks without catastrophic forgetting."

  - id: "lorahub2024"
    title: "LoRAHub: Efficient Cross-Task Generalization via Dynamic LoRA Composition"
    authors: "Huang, Chengsong et al."
    venue: "COLM 2024"
    year: 2024
    url: "https://arxiv.org/abs/2307.13269"
    category: "method-component"
    role: "gradient-free LoRA composition for unseen tasks"
    relevance: "Composes multiple pre-trained LoRA modules for unseen tasks using only a few examples — no additional parameters or gradients needed. Validates the 'LoRA bank + composition' paradigm that PAR builds upon, but PAR replaces few-shot weight search with perturbation-type diagnosis."
    key_findings: "Gradient-free coefficient optimization over LoRA bank; approaches in-context learning performance on BIG-Bench Hard with zero-shot inference cost."

  - id: "mlore_cvpr2024"
    title: "Multi-Task Dense Prediction via Mixture of Low-Rank Experts"
    authors: "Yang, Yuqi et al."
    venue: "CVPR 2024"
    year: 2024
    url: "https://arxiv.org/abs/2403.17749"
    category: "method-component"
    role: "low-rank MoE for multi-task vision"
    relevance: "Applies LoRA-inspired low-rank experts in a MoE decoder for multi-task dense prediction (depth, segmentation, normals). Demonstrates that low-rank experts with dynamic routing work in vision — supports PAR's claim that LoRA-rank experts suffice for VLA perturbation correction."
    key_findings: "Low-rank expert format + generic convolution path for parameter sharing; SOTA on PASCAL-Context and NYUD-v2; cost stays constant as expert count grows."

  # ─────────── method-component: LoRA in robotics / VLA ───────────

  - id: "openvla_oft2025"
    title: "Fine-Tuning Vision-Language-Action Models: Optimizing Speed and Success (OpenVLA-OFT)"
    authors: "Kim, Moo Jin et al."
    venue: "arXiv / OpenVLA-OFT project"
    year: 2025
    url: "https://openvla-oft.github.io/"
    category: "method-component"
    role: "VLA fine-tuning recipe baseline"
    relevance: "Optimized fine-tuning recipe for VLA — 25–50× faster inference, higher success. PAR compares against OFT-style full fine-tuning as the parameter-heavy alternative to routed LoRA experts."
    key_findings: "Action chunking + parallel decoding + L1 regression; large speedup vs vanilla OpenVLA fine-tuning."

  - id: "accessible_vla_lora2025"
    title: "Towards Accessible Physical AI: LoRA-Based Fine-Tuning of VLA Models for Real-World Robot Control"
    authors: "Anonymous et al."
    venue: "arXiv 2512.11921"
    year: 2025
    url: "https://arxiv.org/abs/2512.11921"
    category: "method-component"
    role: "LoRA-on-VLA baseline (uniform single adapter)"
    relevance: "Single LoRA + quantization to fine-tune 3.1B VLA on consumer GPUs. This is exactly our 'rank-matched uniform LoRA' baseline — PAR's Claim 2 (Targeted > Uniform) directly contests this design."
    key_findings: "LoRA + quantization enables VLA fine-tuning on 8GB GPUs; uniform single-adapter approach."

  - id: "adamoe_vla2025"
    title: "Expertise Need Not Monopolize: Action-Specialized Mixture of Experts for Vision-Language-Action Learning (AdaMoE)"
    authors: "Hen, Charles et al."
    venue: "arXiv 2510.14300"
    year: 2025
    url: "https://arxiv.org/abs/2510.14300"
    category: "method-component"
    role: "MoE-VLA direct comparator"
    relevance: "Most direct architectural neighbor — MoE inside VLA action expert, decouples selection from weighting. Differs from PAR: AdaMoE routes by token features for task specialization; PAR routes by *perturbation type* diagnosed from frozen activations. Must compare on LIBERO."
    key_findings: "Decoupled router + scale adapter; +1.8% LIBERO / +9.3% RoboTwin / +21.5% real-world vs dense baseline."

  - id: "fedvla2025"
    title: "FedVLA: Federated Vision-Language-Action Learning with Dual Gating Mixture-of-Experts for Robotic Manipulation"
    authors: "Miao, Chang et al."
    venue: "ICCV 2025"
    year: 2025
    url: "https://arxiv.org/abs/2508.02190"
    category: "method-component"
    role: "MoE-VLA in federated setting"
    relevance: "Dual gating MoE for VLA — adaptive variable-expert count per token. Federated framing is orthogonal to ours, but the dual gating mechanism is a candidate router design to ablate against in PAR."
    key_findings: "Dual gating MoE selects variable experts per token; instruction-oriented scene parsing."

  - id: "chatvla2_2025"
    title: "ChatVLA-2: Vision-Language-Action Model with Open-World Reasoning"
    authors: "Anonymous et al."
    venue: "NeurIPS 2025"
    year: 2025
    url: "https://chatvla-2.github.io/"
    category: "method-component"
    role: "MoE-VLA with VLM-preserving design"
    relevance: "Dynamic MoE within VLM backbone (Qwen2-VL) with 3-stage training to preserve VLM capabilities. Architecturally relevant — preserves backbone like PAR but specializes for reasoning, not perturbation correction."
    key_findings: "MoE in VLM backbone + 3-stage training preserves pretrained reasoning while adding action."

  # ─────────── method-component: internal activation analysis ───────────

  - id: "eigentrack2025"
    title: "EigenTrack: Temporal Spectral Analysis of Hidden Activations for Hallucination and OOD Detection"
    authors: "Anonymous et al."
    venue: "arXiv 2509.15735"
    year: 2025
    url: "https://arxiv.org/abs/2509.15735"
    category: "method-component"
    role: "activation-based OOD diagnosis"
    relevance: "Uses eigenvalue-based descriptors of activations for OOD/hallucination detection. Methodological cousin of our perturbation-type probe — both extract decision signals from frozen internal states."
    key_findings: "Global eigenvalue descriptors + Marchenko-Pastur divergence detect representation-dynamics shifts."

  - id: "hidden_states_iclr2024"
    title: "LLMs' Internal States Retain the Power of Hallucination Detection"
    authors: "Anonymous et al."
    venue: "ICLR 2024"
    year: 2024
    url: "https://proceedings.iclr.cc/paper_files/paper/2024/file/0d1986a61e30e5fa408c81216a616e20-Paper-Conference.pdf"
    category: "method-component"
    role: "evidence for diagnostic capacity of internal states"
    relevance: "Foundational evidence that frozen LLM hidden states encode rich decision-relevant signal (hallucination class). Direct intellectual ancestor of our Claim 1 (Perturbation Diagnosability from single layer/token)."
    key_findings: "Internal activations of LLMs contain comprehensive features for hallucination detection."

  - id: "linear_probe_othello"
    title: "Othello-GPT Has a Linear Emergent World Representation"
    authors: "Nanda, Neel"
    venue: "Blog / mechanistic interpretability"
    year: 2023
    url: "https://www.neelnanda.io/mechanistic-interpretability/othello"
    category: "method-component"
    role: "canonical linear-probe demonstration"
    relevance: "Canonical evidence that high-level latent variables are linearly decodable from transformer activations. Justifies linear-probe choice for perturbation-type classification (Claim 1)."
    key_findings: "Linear probe recovers Othello board state from frozen transformer activations."

  # ─────────── method-component: multi-modal LoRA composition ───────────

  - id: "mocle2024"
    title: "Mixture of Cluster-conditional LoRA Experts for Vision-language Instruction Tuning"
    authors: "Gou, Yunhao et al."
    venue: "arXiv 2312.12379"
    year: 2023
    url: "https://arxiv.org/abs/2312.12379"
    category: "method-component"
    role: "cluster-conditional LoRA routing for VL models"
    relevance: "Clusters instructions into groups → routes each input to a specialized LoRA expert + universal expert. Directly analogous to PAR: we cluster perturbations into types → route to perturbation-specific LoRA. MoCLE validates condition-based routing in multi-modal setting."
    key_findings: "Instruction clustering separates conflicting tasks; cluster-conditional router + universal expert; effective on InstructBLIP and LLaVA."

  - id: "dmole_icml2025"
    title: "D-MoLE: Dynamic Mixture of Curriculum LoRA Experts for Continual Multimodal Instruction Tuning"
    authors: "Ge, Chendi et al."
    venue: "ICML 2025"
    year: 2025
    url: "https://arxiv.org/abs/2506.11672"
    category: "method-component"
    role: "dynamic architecture evolution for multimodal MoLE"
    relevance: "Automatically evolves layer-wise LoRA expert allocation for continual multimodal learning. Addresses modality imbalance via gradient-based curriculum — relevant to PAR where visual/spatial/physical perturbations impose different modality demands on the VLA."
    key_findings: "Dynamic layer-wise expert allocator resolves architecture conflicts; gradient-based inter-modal curriculum; +15% avg over baselines; first continual learning for MLLMs from architectural perspective."

  - id: "lora_soups2024"
    title: "LoRA Soups: Merging LoRAs for Practical Skill Composition Tasks"
    authors: "Prabhakar, Akshara et al."
    venue: "arXiv 2410.13025"
    year: 2024
    url: "https://arxiv.org/abs/2410.13025"
    category: "method-component"
    role: "LoRA merging for skill composition"
    relevance: "Studies how individually-trained skill LoRAs can be merged for composite tasks. CAT (concatenation with optimal weighting) outperforms data mixing by 43%. Relevant to PAR's multi-expert design: validates that separately-trained perturbation experts can be effectively combined."
    key_findings: "Concatenation of weighted LoRAs (CAT) beats data merging and model merging; first work showing model merging superiority over data mixing for binary skill composition."

  # ─────────── method-component: brain-inspired neural routing ───────────

  - id: "more_brain2025"
    title: "MoRE-Brain: Routed Mixture of Experts for Interpretable and Generalizable Cross-Subject fMRI Visual Decoding"
    authors: "Wei, Yuxiang et al."
    venue: "arXiv 2505.15946"
    year: 2025
    url: "https://arxiv.org/abs/2505.15946"
    category: "method-component"
    role: "brain-inspired MoE with functional specialization"
    relevance: "Directly inspires PAR's 'Meta-Brain' framing — hierarchical MoE architecture mimics cortical functional specialization where distinct experts process signals from functionally related brain regions. PAR analogously assigns LoRA experts to functionally distinct perturbation types."
    key_findings: "Hierarchical MoE with experts processing functionally-related voxel groups; dual-stage routing (Space Router) dynamically modulates spatial influence; interpretable expert-brain-region correspondence."

  - id: "mixture_pathways2025"
    title: "Brain-Like Processing Pathways Form in Models With Heterogeneous Experts"
    authors: "Cook, Jack et al."
    venue: "NeurIPS 2025"
    year: 2025
    url: "https://arxiv.org/abs/2506.02813"
    category: "method-component"
    role: "neuroscience-grounded pathway formation in MoE"
    relevance: "Provides neuroscience grounding for PAR's 'Meta-Brain' naming — shows that biologically plausible inductive biases (routing cost, difficulty scaling, expert dropout) cause brain-like processing pathways to emerge in heterogeneous MoE models. Validates that specialization + routing produces brain-like organization."
    key_findings: "Three biologically relevant biases (routing cost, difficulty-scaled cost reduction, expert dropout) induce brain-like pathway formation; artificial pathways match cortical/subcortical organization across task difficulty."

  - id: "micro2025"
    title: "Mixture of Cognitive Reasoners: Modular Reasoning with Brain-Like Specialization"
    authors: "Al Khmasi, Badr et al."
    venue: "arXiv 2506.13331"
    year: 2025
    url: "https://arxiv.org/abs/2506.13331"
    category: "method-component"
    role: "brain-inspired modular specialization in transformers"
    relevance: "Partitions transformer layers into 4 cognitive expert modules (Language/Logic/Social/World) inspired by brain networks. Demonstrates that brain-inspired module specialization is interpretable and steerable at inference — directly supports PAR's claim that perturbation-type-specialized LoRAs provide interpretable, steerable correction."
    key_findings: "4 expert modules mimic cognitive brain networks; removing a module impairs domain-relevant benchmarks; inference-time steering by emphasizing specific experts; outperforms non-specialized baselines on 7 reasoning benchmarks."

  # ─────────── evaluation ───────────

  - id: "libero2023"
    title: "LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning"
    authors: "Liu, Bo et al."
    venue: "NeurIPS 2023 (Datasets & Benchmarks)"
    year: 2023
    url: "https://arxiv.org/abs/2306.03310"
    category: "evaluation"
    role: "primary evaluation benchmark"
    relevance: "Main eval — LIBERO-Spatial/Object/Goal/100 provide controlled distribution shifts perfect for testing perturbation routing. Spatial/Object/Goal naming aligns with our visual/spatial/physical taxonomy."
    key_findings: "130 tasks across 4 suites; controlled declarative + procedural knowledge transfer; 90/10 pretraining/test split."

  - id: "simpler_env2024"
    title: "Evaluating Real-World Robot Manipulation Policies in Simulation (SimplerEnv)"
    authors: "Li, Xuanlin et al."
    venue: "CoRL 2024"
    year: 2024
    url: "https://arxiv.org/abs/2405.05941"
    category: "evaluation"
    role: "sim-to-real correlated evaluation"
    relevance: "Variant Aggregation explicitly tests lighting/background/distractor/camera shifts — directly relevant to PAR perturbation categories. Strong real-to-sim correlation makes it useful as secondary eval beyond LIBERO."
    key_findings: "Visual Matching + Variant Aggregation setups; robot policy sim performance correlates with real-world."

  - id: "colosseum2024"
    title: "THE COLOSSEUM: A Benchmark for Evaluating Generalization for Robotic Manipulation"
    authors: "Pumacay, Wilbert et al."
    venue: "RSS 2024"
    year: 2024
    url: "https://arxiv.org/abs/2402.08191"
    category: "evaluation"
    role: "systematic perturbation benchmark"
    relevance: "20 tasks × 14 perturbation axes (lighting, color/texture, distractor, object size, physical, camera pose). Highly compatible with PAR's perturbation-type framing — possible secondary eval venue."
    key_findings: "Built on RLBench; isolates 14 environment-perturbation axes for systematic generalization study."

  # ─────────── background: VLA architecture ───────────

  - id: "pi0_2024"
    title: "π₀: A Vision-Language-Action Flow Model for General Robot Control"
    authors: "Black, Kevin et al. (Physical Intelligence)"
    venue: "arXiv 2410.24164"
    year: 2024
    url: "https://arxiv.org/abs/2410.24164"
    category: "background"
    role: "base VLA model (frozen backbone in PAR)"
    relevance: "π₀ IS our frozen base policy. PaliGemma 3B VLM + flow-matching action head. Open-sourced (Physical-Intelligence/openpi). We probe its internal activations and attach perturbation-specific LoRAs."
    key_findings: "Flow-matching action head over PaliGemma; 7 robot configs, 68 tasks pretraining; fine-tune in 1–20h."

  - id: "openvla_2024"
    title: "OpenVLA: An Open-Source Vision-Language-Action Model"
    authors: "Kim, Moo Jin et al."
    venue: "CoRL 2024"
    year: 2024
    url: "https://arxiv.org/abs/2406.09246"
    category: "background"
    role: "alternative VLA backbone"
    relevance: "7B VLA with SigLIP+DinoV2 vision + Llama-2 LM backbone. Trained on 970k Open-X demos. Useful as secondary backbone to test if PAR design transfers beyond π₀."
    key_findings: "Fused SigLIP+DinoV2 vision encoder; discrete action tokens; LoRA updates 1.4% params yet matches full FT."

  - id: "paligemma_2024"
    title: "PaliGemma: A Versatile 3B VLM for Transfer"
    authors: "Beyer, Lucas et al."

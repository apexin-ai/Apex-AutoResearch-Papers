  - name: LoRA expert training — 3 specialized + 1 universal
    plan_id: plan_002
    description: 'Train 4 LoRA adapters (rank 16) on frozen pi0 PaliGemma layers:
      LoRA-V (Visual),  LoRA-S (Spatial), LoRA-P (Physical), Universal LoRA (mixed).
      Evaluate each on  own-type and cross-type perturbations.

      '

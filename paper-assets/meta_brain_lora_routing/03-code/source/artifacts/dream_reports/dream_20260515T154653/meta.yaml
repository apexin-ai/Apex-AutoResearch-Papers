  review_report: "---\ndream_id: dream_20260515T154653\ntier: best\noverall_score:\
    \ \ntimestamp: 2026-05-15T16:36:24.043010+00:00\n---\n\n# Dream Review Report:\
    \ Meta-Brain\n\n**Paper:** Meta-Brain: Perturbation-Diagnostic Routing of LoRA\
    \ Experts for Parameter-Efficient VLA Robustness\n**Venue:** CoRL 2026\n**Review\
    \ Mode:** Full (2 Reviewers, 4-Step Roundtable)\n**Date:** 2026-05-15\n\n---\n\
    \n## Venue Calibration\n\n**CoRL 2026** — Conference on Robot Learning\n- Rating\
    \ scale: 1–10 (10=top 5% seminal; 9=strong accept top 15%; 8=clear accept top\
    \ 50%; 7=good paper accept; 6=marginally above threshold; 5=marginally below;\
    \ 4=not good enough reject; 3=clear reject)\n- Acceptance rate: ~30–35%\n- Key\
    \ criteria: significance/novelty of results, objective establishment of results,\
    \ potential for scientific/technological impact, relevance to robot learning\n\
    \n---\n\n## Step 1: Independent Reviews\n\n### Reviewer 1 (R1): Methods + Experiments\n\
    \n#### Summary\nThe paper proposes Meta-Brain, a modular framework that diagnoses\
    \ perturbation type from frozen VLA internal activations (PaliGemma layer 6, F1=0.993)\
    \ and routes to type-specialized LoRA experts. On LIBERO-Plus, it achieves 78.4%\
    \ with 6.1M params, +13.6% over universal LoRA (p<0.001). The paper presents 11\
    \ experiments across 13 tables with 5-seed evaluation.\n\n#### Strengths\n- **S1:\
    \ Well-motivated architecture.** Phase 0 diagnosis (F1=0.993 from a single frozen\
    \ layer) is a genuinely interesting empirical finding that provides a clean mechanistic\
    \ foundation for routing.\n- **S2: Thorough ablation ladder with appropriate statistics.**\
    \ The Frozen→Universal→Meta-Brain→Oracle progression is convincing. 5-seed evaluation\
    \ with paired t-tests (p<0.001) and non-significant oracle gap (p=0.14) are appropriate.\
    \ The decomposition (routing contributes 52% of total gain) is a clear narrative.\n\
    - **S3: Expert cross-evaluation matrix (Table 1).** The symmetric specialization/degradation\
    \ pattern (+12–20% on own types, up to −20% on off-types) directly demonstrates\
    \ incompatible correction patterns across perturbation categories.\n- **S4: Comprehensive\
    \ ablation coverage.** 11 experiments spanning expert specialization, ablation\
    \ ladder, oracle routing, FTM comparison, parameter efficiency, CM ablation, router\
    \ architecture, routing granularity, cross-backbone, and layer placement. Unusually\
    \ thorough for a 9-page paper.\n- **S5: Layer placement ablation provides mechanistic\
    \ insight.** The diagonal pattern (V-early, S-mid, P-late) is consistent with\
    \ layered information processing in VLAs.\n- **S6: Cross-backbone validation on\
    \ OpenVLA.** Consistent gain patterns on a different architecture (SigLIP+Llama-2-7B)\
    \ strengthens generality claims.\n\n#### Weaknesses\n- **W1 (Major): Parameter\
    \ comparison is unfair.** Meta-Brain (6.1M) vs Universal LoRA (2M) is a 3x parameter\
    \ gap. The critical missing control is a rank-48 universal LoRA (~6M params) that\
    \ matches Meta-Brain's total budget. Without this, Claim 2 (\"targeted > uniform\"\
    ) is confounded by parameter advantage.\n- **W2 (Major): Random routing baseline\
    \ missing.** The experiment plan (plan_005) explicitly includes random routing\
    \ as a falsification test for Claim 2, but it is omitted from the paper. Without\
    \ it, the benefit of intelligent routing cannot be separated from the ensemble\
    \ effect of having multiple experts.\n- **W3 (Major): Cross-backbone VLA-GSE comparison\
    \ confounded.** The headline \"19x fewer params\" compares across different backbones\
    \ (pi0 vs Qwen3-VL-4B). The abstract and conclusion present this as a primary\
    \ result despite the caveat. The comparison should be explicitly framed as indirect/suggestive.\n\
    - **W4 (Moderate): All success rates are even integers.** Every result is a multiple\
    \ of 2.0 (42, 44, 46, …, 88, 90). This suggests either very low episode counts\
    \ (e.g., 50 episodes per condition producing 2% granularity), post-hoc rounding,\
    \ or a modeling artifact. The paper does not disclose episode counts.\n- **W5\
    \ (Moderate): Mean-pooled vs first-token pooling inconsistency.** Section 3.2\
    \ states PAR uses \"mean-pooled layer-6 activations,\" but the project decision\
    \ log (D006) records adoption of first-token pooling (F1=1.000 vs mean pooling\
    \ 0.978). Actual method used is unclear.\n- **W6 (Moderate): Single benchmark\
    \ (LIBERO-Plus), simulation-only.** Standard for the venue but limits generalizability\
    \ claims. The 3-class taxonomy is tailored to LIBERO-Plus's specific perturbation\
    \ set.\n- **W7 (Minor): CM adds complexity for modest +2.4% gain.** FAISS index\
    \ + deployment assumption (curated exemplar bank) for a gain within noise on most\
    \ perturbation types.\n- **W8 (Minor): \"Overall\" success rate gives 4/6 weight\
    \ to visual types.** The simple average across 6 perturbation types (4 visual,\
    \ 1 spatial, 1 physical) biases toward visual performance without discussion.\n\
    \n#### Missing Experiments (by priority)\n1. **(Critical)** Parameter-matched\
    \ universal LoRA (rank-48, ~6M params)\n2. **(Critical)** Random routing baseline\n\
    3. **(Important)** Clean/unperturbed LIBERO evaluation (does routing hurt baseline\
    \ performance?)\n4. **(Important)** Latency/throughput analysis (soft routing\
    \ requires all 3 expert outputs)\n5. **(Desirable)** Mixed/compound perturbation\
    \ evaluation\n6. **(Desirable)** Per-seed variance for all per-perturbation tables\n\
    \n#### Minor Issues\n1. Incomplete bibliography (MoIRA, CORAL, LoRA-SP mentioned\
    \ without citations)\n2. E2E training objective unspecified — how do gradients\
    \ flow through soft routing weights to PAR?\n3. Cross-type degradation claim misleading\
    \ — \"up to −20% vs frozen\" is actually specialist-on-off-type vs own-type, not\
    \ vs frozen\n4. Table 6: \"close to LoRA-V's 76.0%\" understates a 4.5pp gap\n\
    5. Contribution 3 claims \"systematic design-dimension analysis\" but only provides\
    \ one parameter-efficiency table\n\n---\n\n### Reviewer 2 (R2): Novelty + Related\
    \ Work\n\n#### Summary\nSame paper summary. R2 focuses on whether the contribution\
    \ is novel given the existing MoE/LoRA literature and whether the related work\
    \ adequately positions the paper.\n\n#### Strengths\n- **S1: Core insight well-motivated.**\
    \ The \"close the loop\" framing — SAFE detects but doesn't correct, Meta-Brain\
    \ does both — is clean positioning.\n- **S2: Thorough experimental design within\
    \ scope.** The ablation decomposition (routing 52%, LoRA 43%, headroom 5%) is\
    \ informative and clearly presented.\n- **S3: Cross-backbone validation.** Demonstrating\
    \ consistent patterns on OpenVLA goes beyond what most single-paper contributions\
    \ provide.\n- **S4: Well-structured narrative.** Logical flow from diagnosis to\
    \ architecture to experiments. 13 tables, while dense, each serves a clear purpose.\n\
    \n#### Weaknesses\n- **W1 (Major): Limited novelty.** The architecture is a composition\
    \ of well-known components: linear probe (standard since Alain & Bengio 2017),\
    \ soft MoE routing (standard gating), LoRA experts (standard PEFT). The \"perturbation\
    \ type as routing dimension\" is an application insight, not a methodological\
    \ advance. The routing mechanism (MLP on intermediate features → softmax → weighted\
    \ sum) is identical to standard MoE gating. Novelty lies in *what signal* drives\
    \ routing, not *how* routing works.\n- **W2 (Major): Severely incomplete related\
    \ work — only 8 references.** Missing citations include:\n  - Mixture-of-LoRA:\
    \ LoRAMoE, MoLoRA, MixLoRA, MOELoRA, LoRA-Switch\n  - Adapter composition: AdapterFusion,\
    \ Poly, AdaMix\n  - Test-time adaptation: TENT, TTT\n  - Foundations: PaliGemma\
    \ [Beyer et al.], linear probing [Alain & Bengio], MoE [Shazeer et al.]\n  - Original\
    \ LIBERO benchmark\n  - MoIRA, CORAL, LoRA-SP (mentioned by name but uncited)\n\
    \  \n  8 references is far below CoRL norms (~30-50). This creates the impression\
    \ the authors have not engaged with the broader literature.\n- **W3 (Major): Cross-backbone\
    \ VLA-GSE comparison confounded.** Same concern as R1-W3. The \"19x fewer params\"\
    \ headline is misleading across different backbones.\n- **W4 (Major): Three \"\
    contributions\" are one repackaged.** Contribution 1 (diagnosability) is a prerequisite\
    \ observation. Contribution 2 (the system) is the actual method. Contribution\
    \ 3 (parameter efficiency) is a consequence. These are setup, method, and property\
    \ — not three independent contributions.\n- **W5 (Moderate): Routing setting too\
    \ easy.** F1=0.993 (or 1.000 with first-token) raises the question: if types are\
    \ so trivially separable, can a sufficiently large universal adapter learn implicit\
    \ decomposition without explicit routing? Missing rank-48 baseline is the key\
    \ test.\n- **W6 (Moderate): Sim-only. 3-class taxonomy is LIBERO-Plus-specific.**\
    \ Real-world perturbations are continuous and co-occurring, not categorical and\
    \ isolated.\n- **W7 (Minor): CM adds complexity for modest gain.** Same as R1-W7.\n\
    \n#### Missing References (expanded list)\n| Category | Missing Works |\n|----------|--------------|\n\
    | MoE-LoRA | LoRAMoE, MoLoRA, MixLoRA, MOELoRA, LoRA-Switch |\n| Adapter composition\
    \ | AdapterFusion, Poly, AdaMix |\n| Test-time adaptation | TENT, TTT |\n| Probing\
    \ foundations | Alain & Bengio 2017, Belinkov 2022 survey |\n| MoE fundamentals\
    \ | Shazeer et al. 2017, Fedus et al. 2022 |\n| VLA/vision | PaliGemma [Beyer\
    \ et al. 2024], original LIBERO |\n| Cited without refs | MoIRA, CORAL, LoRA-SP\
    \ |\n\n#### Minor Issues\n1. No architecture figure (described in text only; standard\
    \ for CoRL papers to include)\n2. No t-SNE/feature visualization of perturbation\
    \ clusters in activation space\n3. Concurrent submission citations (LIBERO-Plus\
    \ CVPR 2026, VLA-GSE CoRL 2026) require care\n4. All results suspiciously even\
    \ integers (same as R1-W4)\n5. Overall average discrepancy: (42+58+52+46+68+56)/6\
    \ = 53.67, not 53.6\n\n---\n\n## Step 2: Cross-Sharing\n\n### R1 reacting to R2\n\
    \n**Agrees with:**\n- R2-W2 (Incomplete related work): R1 already flagged 3 missing\
    \ citations; R2's expanded list of 15+ would make R1 upgrade this from \"minor\"\
    \ to \"moderate/major.\"\n- R2-W4 (Three contributions = one): R1's review implicitly\
    \ treats this as one system contribution. Would agree the paper overclaims.\n\
    - R2-W5 (Routing too easy → need rank-48): Directly aligns with R1-M1.\n\n**Pushes\
    \ back on:**\n- R2-W1 (Limited novelty): R1 credits mechanistic insight (S5) and\
    \ views the system-level contribution as valid for CoRL. Would argue that CoRL\
    \ values systems and empirical contributions, and the novelty bar should account\
    \ for execution quality.\n- R2's downgrading of cross-backbone validation: R1\
    \ views OpenVLA results as informative even if quantitative comparison is invalid.\n\
    \n### R2 reacting to R1\n\n**Agrees with:**\n- R1-W1 (Parameter-unfair comparison):\
    \ Strongly reinforces R2-W5.\n- R1-W2 (Missing random routing): Directly tests\
    \ R2's core concern about whether routing signal matters or ensemble effect suffices.\n\
    - R1-W4 (Even integer results): Shared concern about evaluation credibility.\n\
    - R1-M3 (Clean evaluation) and R1-M4 (Latency): Both important for practical deployment\
    \ story.\n\n**Pushes back on:**\n- R1-S5 (Layer placement as mechanistic insight):\
    \ R2 views this as hyperparameter search, not mechanistic insight. Lacks representation\
    \ analysis or gradient attribution to earn the \"insight\" label.\n- R1-S6 (Cross-backbone\
    \ as strength): Confounded comparison cannot be credited positively.\n\n### Key\
    \ emergent insight\nThe missing rank-48 universal LoRA experiment is the single\
    \ most load-bearing experiment for the paper's fate. It is relevant to both R1's\
    \ experimental fairness concern AND R2's novelty concern. If rank-48 universal\
    \ matches Meta-Brain, both the experimental claim (routing helps) and the novelty\
    \ claim (routing is the contribution) collapse simultaneously.\n\n---\n\n## Step\
    \ 3: Convergence\n\n### Agreed Strengths\n| ID | Strength | Both? |\n|----|----------|-------|\n\
    | AS1 | Clear problem motivation, coherent narrative, clean \"detect-and-correct\"\
    \ framing | Yes |\n| AS2 | Thorough ablation design (11 experiments, 13 tables,\
    \ 5 seeds, statistical tests) | Yes |\n| AS3 | Expert cross-evaluation matrix\
    \ (Table 1) convincingly demonstrates type-specific corrections | Yes |\n| AS4\
    \ | Cross-backbone attempt on OpenVLA (qualitative generality signal) | Partial\
    \ — R1 stronger |\n\n### Agreed Weaknesses\n| ID | Weakness | Severity | Addressable?\
    \ |\n|----|----------|----------|-------------|\n| AW1 | Parameter-unfair baselines\
    \ (6M vs 2M, no rank-48 control) | **Critical** | Yes — 1-2 days compute. But\
    \ if rank-48 matches Meta-Brain, paper's core claim collapses. |\n| AW2 | Missing\
    \ random routing baseline | **Critical** | Yes — trivial to implement. If random\
    \ routing ≈ Meta-Brain, story breaks. |\n| AW3 | Confounded cross-backbone VLA-GSE\
    \ comparison → misleading \"19x\" headline | **Major** | Partially — can reframe\
    \ claims, but same-backbone VLA-GSE requires significant compute. |\n| AW4 | Severely\
    \ incomplete related work (8 refs, 15+ missing) | **Major** | Yes — writing fix.\
    \ But suggests limited literature engagement. |\n| AW5 | Suspicious evaluation\
    \ statistics (all even integers, no episode counts disclosed) | **Moderate** |\
    \ Yes — disclose counts, may reveal underpowered evaluation. |\n| AW6 | Single\
    \ simulated benchmark, no real-robot data | **Moderate** | No — requires hardware\
    \ + significant time. Standard limitation for venue. |\n| AW7 | Internal inconsistencies\
    \ (mean-pool vs first-token, rounding, uncited refs in text) | **Minor** | Yes\
    \ — proofreading. |\n\n### Disputed Points\n| Point | R1 Position | R2 Position\
    \ | AC Assessment |\n|-------|------------|------------|---------------|\n| Novelty\
    \ sufficiency | Systems contribution valid for CoRL; novelty in execution | Straightforward\
    \ composition; application insight, not method advance | R2's concern is legitimate\
    \ but CoRL values empirical systems work. Novelty alone does not sink the paper\
    \ IF experiments are strong — which they currently are not (AW1-AW2). |\n| Cross-backbone\
    \ validation | Strength (S6) | Confounded, cannot credit | Qualitative applicability\
    \ = minor strength; quantitative comparison = weakness. Net mild positive. |\n\
    | Layer placement finding | Mechanistic insight (S5) | Hyperparameter search |\
    \ Both — useful observation but lacks causal evidence. Mild positive. |\n| Contribution\
    \ framing | Acceptable (3 claims well-supported) | Inflated (1 contribution ×3)\
    \ | R2 is correct that these are not independent contributions. Mild negative\
    \ for paper quality. |\n\n---\n\n## Step 4: Synthesis — Final Scores and Recommendation\n\
    \n### R1 Final Score: **5** (Marginally below acceptance threshold)\n\n**Rationale:**\
    \ The experimental design is methodologically sound in structure (5 seeds, ablation\
    \ ladder, statistical tests), and the ablation coverage is unusually thorough.\
    \ However, two critical missing controls (rank-48 universal LoRA and random routing)\
    \ prevent the paper from establishing its core claim that routing — rather than\
    \ additional parameters or ensemble effects — drives the improvement. The confounded\
    \ VLA-GSE comparison further weakens the headline result. The evaluation statistics\
    \ raise credibility concerns. These are fixable issues, but in the paper's current\
    \ form, the evidence does not support the claims.\n\n### R2 Final Score: **4**\
    \ (Not good enough — rejection)\n\n**Rationale:** The contribution is a natural\
    \ composition of well-established techniques (linear probing, MoE gating, LoRA)\
    \ applied to a specific routing dimension (perturbation type). While the instantiation\
    \ is reasonable, the methodological novelty is limited. The severely incomplete\
    \ bibliography (8 references, multiple uncited mentions) indicates insufficient\
    \ engagement with the extensive MoE-LoRA and adapter composition literature. Even\
    \ if the missing experiments favor Meta-Brain, the contribution remains an application-level\
    \ insight rather than a generalizable method advance. Combined with the experimental\
    \ gaps identified by R1, the paper falls below the CoRL acceptance bar.\n\n###\
    \ AC Consensus Score: **4–5** (Reject)\n\n### Overall Recommendation: **Reject**\n\
    \n### Decision Rationale\nThe paper addresses a relevant problem (VLA robustness\
    \ under environmental perturbations) with a reasonable approach (perturbation-diagnostic\
    \ routing of LoRA experts). The Phase 0 finding (F1=0.993 from a single frozen\
    \ layer) is a genuinely interesting empirical observation. The experimental design\
    \ is ambitious in scope (11 experiments, 13 tables).\n\nHowever, the paper has\
    \ two critical experimental gaps that prevent it from establishing its central\
    \ claim:\n1. The comparison between Meta-Brain (6.1M params) and Universal LoRA\
    \ (2M params) confounds routing benefit with a 3x parameter advantage. A rank-48\
    \ universal LoRA (~6M) is the essential missing control.\n2. The random routing\
    \ baseline, explicitly planned but omitted, is needed to separate intelligent\
    \ routing from ensemble effects.\n\nAdditionally, the severely incomplete bibliography\
    \ (8 references, with 15+ directly relevant works missing) and the misleading\
    \ cross-backbone comparison with VLA-GSE undermine the paper's positioning. The\
    \ uniformly even success rates across all 13 tables raise unresolved questions\
    \ about evaluation granularity.\n\n### Path to Resubmission\nThe paper has a realistic\
    \ path to acceptance at a future venue if:\n1. **Run rank-48 universal LoRA**\
    \ and **random routing baselines** — these are the existential experiments. If\
    \ Meta-Brain wins convincingly, the contribution is validated.\n2. **Expand related\
    \ work** to 30+ references, engaging with MoE-LoRA literature (LoRAMoE, MoLoRA,\
    \ MixLoRA), adapter composition (AdapterFusion, Poly), test-time adaptation (TENT,\
    \ TTT), and probing foundations (Alain & Bengio).\n3. **Remove or heavily qualify\
    \ the \"19x fewer params\" claim** unless same-backbone comparison is provided.\n\
    4. **Disclose evaluation episode counts** and address the even-integer pattern.\n\
    5. **Add latency analysis** and **clean LIBERO evaluation**.\n6. **Add architecture\
    \ figure** and **t-SNE visualization** of perturbation clusters.\n7. **Resolve\
    \ internal inconsistencies** (mean-pool vs first-token, contribution framing).\n\
    \n### Experiment Coverage Assessment\nThe paper covers all 11 imagined experiments\

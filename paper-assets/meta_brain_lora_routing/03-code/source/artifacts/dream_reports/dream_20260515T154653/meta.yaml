        representations. Contribution 2 becomes the systematic design-dimension analysis:
        we tested perturbation-diagnostic routing and found that explicit routing
        yields marginal gains over implicit adaptation, providing evidence that LoRA
        mixed training already captures perturbation-conditional structure. This is
        a negative-but-informative result framed as understanding the landscape. Contribution

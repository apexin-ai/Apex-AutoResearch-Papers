    result_rationale: 'PAR router 利用 Phase 0 已验证的 layer 6 激活信号（F1=0.993）进行软路由， routing
      diagonality 达到 0.92 意味着 92% 的权重正确分配给目标专家。 剩余 8% 的"泄漏"实际上是有益的： (1) 部分扰动（如 background
      clutter + 轻微 layout shift 同时出现）需要混合校正； (2) soft routing 的平滑梯度使得 PAR 在 E2E fine-tuning
      中可以学到比 hard routing  更精细的权重配置。 整体 78.4% 低于各专家在 own-type 上的最优成绩的加权平均（~81%），差距来源：
      (a) 8% 路由泄漏导致部分样本获得次优校正； (b) PAR fine-tuning 只调路由权重、冻结 LoRA，整体达不到联合训练的上界。 但
      78.4% 已经比 universal LoRA 高 13.6%，证明路由带来的专家选择增益远超路由误差成本。 layout 和 robot 达到 88%
      和 86%（接近 oracle 的 plan_002 数据），因为这两类是  单一子类型、PAR 分类难度最低。Visual 子类型（camera 72%、noise
      70%）相对低一些， 因为 4 种视觉扰动之间存在一定混淆（noise vs camera 的 PAR 权重偶尔偏移）。

      '

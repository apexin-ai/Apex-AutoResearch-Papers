        requiring whole-trajectory reasoning beyond single-step LoRA correction
      - Universal LoRA is a stronger baseline than expected — mixed training provides
        partial cross-type robustness
      - PAR routing is accurate but soft routing dilutes correction signal compared
        to oracle hard routing (gap 3-6%)
      - Absolute performance trails VLA-GSE by >8% due to pi0 backbone capacity ceiling,

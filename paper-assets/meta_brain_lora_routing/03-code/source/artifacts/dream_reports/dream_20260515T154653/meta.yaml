focus: 'Key risks: (1) Phase 0 classification too easy — does routing actually help
  downstream? (2) Single backbone pi0 generalizability. (3) Absolute performance vs
  SRPO/VLA-GSE SOTA. (4) 3-class taxonomy coarseness. Strongest evidence: Phase 0
  K=1 layer6 F1=1.0 proves zero-overhead routing. Core question for Claim 2: does
  specialized LoRA outperform universal LoRA?'

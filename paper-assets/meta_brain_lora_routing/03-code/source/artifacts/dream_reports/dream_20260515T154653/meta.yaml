      lora_v_visual_avg: 76.0
      lora_v_camera: 74.0
      lora_v_light: 80.0
      lora_v_background: 78.0
      lora_v_noise: 72.0
      lora_v_on_spatial: 60.0
      lora_v_on_physical: 54.0
      lora_s_layout: 90.0
      lora_s_on_visual_avg: 46.5
      lora_s_on_physical: 56.0
      lora_p_robot: 88.0
      lora_p_on_visual_avg: 44.0
      lora_p_on_spatial: 62.0
      universal_lora_overall: 64.8
      universal_camera: 54.0
      universal_light: 66.0
      universal_background: 62.0
      universal_noise: 54.0
      universal_layout: 78.0
      universal_robot: 74.0
      per_type_specialization_delta_max: 20.0
      per_type_specialization_delta_min: 12.0
      cross_type_degradation_max: -20.0
    result_rationale: 'Rank-16 LoRA on PaliGemma layers provides足够的修正容量处理单一扰动类型。 专用
      LoRA 在其目标类型上大幅超越 universal LoRA（最大 delta=20%，camera 类型），因为： (1) Visual 扰动主要破坏
      PaliGemma 早期视觉编码，LoRA-V 的全部容量用于修复这一信号通路， 而 universal LoRA 必须将同样容量分摊到三类截然不同的校正模式上；
      (2) Spatial (layout) 扰动修改物体空间关系，LoRA-S 学到的校正向量直接对齐中层空间表征， 在 layout 上达 90%——这是所有组合中最高的，因为
      layout 是单一子类、分布集中； (3) Physical (robot) 扰动改变力学属性，LoRA-P 在 robot 上达 88%。 Cross-type
      严重退化（LoRA-V 在 physical 仅 54%，低于 frozen baseline 的 56%）证实 三类扰动所需的校正模式确实互不兼容——这是
      Claim 2 的关键论据：专用路由并非锦上添花， 而是必要条件。Universal LoRA 在 64.8% 饱和，因为 rank-16 的有限容量在三类矛盾梯度
      方向间折衷，导致每种类型都欠校正。

      '

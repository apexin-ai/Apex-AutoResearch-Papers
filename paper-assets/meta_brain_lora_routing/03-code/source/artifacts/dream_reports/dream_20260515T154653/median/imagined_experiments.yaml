  analysis: 'This is a P2 experiment that adds mechanistic depth but is not essential
    for the core claims. The crossed peak pattern (V-early, S-mid, P-late) aligns
    with how VLA processing stages work: visual encoding → spatial reasoning → action
    prediction. This provides evidence for the paper''s framing that perturbation
    types disrupt different processing stages. The +2.4% gain from optimal layer placement
    is small but suggests a natural extension: layer-aware routing that not only selects
    the right expert but applies it at the right layers. This could close part of
    the oracle-PAR gap (3.9%) without improving classification accuracy. For the paper,
    include as a supplementary analysis with the crossed-peak figure — it''s visually
    compelling and mechanistically interpretive. Do not pursue layer-specific routing
    as a primary contribution; it''s a natural future work direction.'

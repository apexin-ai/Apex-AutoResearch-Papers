  figures_description:
  - 'Dual-axis scatter: x = routing classification accuracy (%), left y = task success
    (%), right y = router parameter count. Three points (Linear, MLP, Attention).
    Shows that routing accuracy improvements beyond ~93% yield diminishing task success
    returns. The gap between routing accuracy and task success is largest for Attention,
    illustrating the disconnect between classification metrics and control metrics.

    '
  analysis: 'This experiment addresses reviewer concern C1 ("Phase 0 classification
    is too easy") from a different angle: yes, the classification is relatively easy
    (even a linear classifier gets 90.6%), but the task-success gap between 90.6%
    and 93.8% routing accuracy is 1.2% — confirming that routing accuracy does matter
    at the margins. The MLP''s 3.2% classification advantage over linear translates
    to 1.2% task success gain, roughly 1:0.37 ratio. Beyond 93.8%, additional classification
    gains have near-zero marginal task benefit. This helps calibrate the oracle-PAR
    gap analysis: the 3.9% task gap from oracle routing quality corresponds to moving
    from ~93.8% to ~100% classification accuracy, and the nonlinear mapping suggests
    diminishing returns as routing approaches perfection.

    '

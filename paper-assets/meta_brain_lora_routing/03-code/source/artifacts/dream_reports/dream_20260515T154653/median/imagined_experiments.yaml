    effective routing. The spatial underperformance replication across backbones strengthens
    the mechanistic interpretation: it''s a property of the perturbation type, not
    the backbone. For the paper, include as a validation subsection: "Cross-backbone
    results on SmolVLA replicate the qualitative findings, with comparable routing
    gains (+5.6% vs +6.0% over universal), confirming that perturbation-diagnostic
    routing is an architecture-independent principle." This is a P2 experiment — include
    if time/GPU budget permits, otherwise cite the Phase 0 cross-backbone evidence

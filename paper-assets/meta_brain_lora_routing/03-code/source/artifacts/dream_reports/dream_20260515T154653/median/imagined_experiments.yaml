  description: 'Replicate Phase 0 classification + Phase 1 routing pipeline on SmolVLA
    to test whether perturbation-diagnostic routing generalizes beyond pi0. SmolVLA
    uses a different vision encoder (SigLIP) and language backbone (SmolLM), testing
    architecture independence.


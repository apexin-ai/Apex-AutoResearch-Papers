tier: median
narrative_guidance: 'Routing by perturbation type yields clear but moderate gains,
  strongest on Visual and Physical where perturbations disrupt localized processing
  stages. Spatial expert underperforms due to layout/distractor perturbations requiring
  whole-trajectory reasoning beyond single-step LoRA correction. Universal LoRA is
  a surprisingly strong baseline (~65%) from mixed-training cross-type robustness,
  narrowing the routing advantage. Frame Meta-Brain as parameter-efficient complement
  to capacity routing: ~65% of VLA-GSE absolute gain at 5% parameters. Ablation ladder
  Frozen < Universal < Meta-Brain < Oracle is clean and statistically significant.
  Add mechanistic analysis section explaining per-type routing benefit asymmetry —
  turns partial spatial result into insight rather than weakness. Consider additional
  experiment combining Meta-Brain + universal LoRA residual to show routing is additive
  to uniform adaptation.

  '

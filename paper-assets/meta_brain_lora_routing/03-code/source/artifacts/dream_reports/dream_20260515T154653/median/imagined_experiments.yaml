  result_rationale: 'Visual expert (LoRA-V) shows the strongest specialization (+13%
    over universal on visual types) because visual perturbations (camera/light/background/noise)
    corrupt early PaliGemma representations in a consistent, localized manner — rank-16
    LoRA can learn a compact correction to these early-layer distortions. Physical
    expert (LoRA-P) shows strong but smaller specialization (+9%) because robot perturbations
    (changed dynamics/mass) affect action-space outputs which are more distributed
    across layers. Spatial expert (LoRA-S) shows weak specialization (+4.3%) because
    layout and distractor perturbations fundamentally change the required trajectory
    — not just a representational shift but a different action sequence — and single-step
    LoRA correction at the representation level cannot replan a trajectory. Cross-type
    performance degrades sharply (below frozen baseline) because each specialized
    expert learns type-specific correction biases that actively harm representations
    when applied to the wrong perturbation type. Universal LoRA at 65.4% is stronger
    than expected because mixed training provides partial cross-type robustness —
    the LoRA learns an average correction that modestly helps all types without hurting

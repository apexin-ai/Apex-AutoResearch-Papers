    oracle_par_gap_visual: 4.3
    oracle_par_gap_spatial: 3.8
    oracle_par_gap_physical: 3.8
  result_rationale: 'Oracle routing eliminates soft-routing dilution entirely — each
    perturbation type receives 100% correction from its matched expert, with zero
    contamination from mismatched experts. The 3.9% overall gap from Meta-Brain to
    oracle quantifies the cost of learned soft routing versus perfect hard routing.
    This gap arises from two sources: (1) non-zero weight on wrong experts injects
    harmful correction biases (~60% of the gap), and (2) the router''s lower confidence
    on spatial perturbations causes LoRA-S to be under-weighted even on true spatial
    inputs (~40% of the gap). The gap is moderate (not catastrophic), indicating PAR
    routing is functional but not near-perfect. Closing this gap further would require
    either better features for spatial classification at layer 6, or a hybrid routing
    scheme that uses hard routing when confidence is high and universal fallback when
    confidence is low. Note that oracle performance (75.3%) still trails VLA-GSE (81.2%)
    by 5.9%, confirming that the performance ceiling is set by pi0 backbone capacity

- name: Meta-Brain Assembly — PAR Router + LoRA Bank
  plan_id: plan_003
  description: 'Assemble PAR router (PaliGemma layer 6, 2-layer MLP, initialized from
    Phase 0 weights) with 3 LoRA experts. Soft routing: h_corrected = h_frozen + Σ_k
    p(type_k) · LoRA_k(h_frozen). End-to-end routing fine-tuning with frozen LoRA
    parameters (only tune PAR weights). Evaluate on full LIBERO-Plus benchmark.

    '
  expected_results:
    libero_plus_overall: 71.4
    per_type_camera: 71.0
    per_type_light: 77.6
    per_type_background: 74.4
    per_type_noise: 73.0
    per_type_distractor: 65.2
    per_type_layout: 64.4
    per_type_robot: 74.2
    visual_avg: 74.0
    spatial_avg: 64.8
    physical: 74.2
    gain_over_frozen: 17.8
    gain_over_universal: 6.0
    routing_diag_visual: 0.82
    routing_diag_spatial: 0.68
    routing_diag_physical: 0.8
    routing_diagonality_mean: 0.77
    hard_assignment_accuracy: 89.0
  result_rationale: 'Soft routing dilutes the correction signal compared to hard (oracle)
    routing, costing ~4% overall. The dilution is uniform across types (3-5% per type)
    because even a small weight on the wrong expert introduces harmful correction
    biases. Spatial routing diagonality is lowest (0.68) because layout/distractor
    perturbations share visual features with camera/background changes at layer 6
    — the PAR router''s operating point. Despite this, Meta-Brain still improves over
    universal on spatial (+1.1%) because even imperfect soft routing toward LoRA-S
    is better than no type awareness. Visual gain (+8.65% over universal) is large
    because high routing confidence (0.82) allows LoRA-V to dominate the correction.
    Physical gain (+5.2%) is moderate due to good routing (0.80) but more distributed
    perturbation effects. Hard assignment accuracy (89%) is lower than Phase 0 classification
    (99.3%) because the router is fine-tuned for task success, not classification
    accuracy — it learns to soften assignments when mixing provides marginal task
    benefit.

    '

    perturbation type (F1=0.938, lower than pi0''s 0.993 due to SigLIP''s different
    feature structure but still high). The best classification layer shifts to layer
    4 (SmolVLA has fewer layers than PaliGemma). Meta-Brain on SmolVLA achieves +16.2%
    gain over frozen (comparable to pi0''s +17.8%) and +5.6% over universal (comparable
    to pi0''s +6.0%), demonstrating that the routing benefit is architecture-independent.
    Absolute numbers are lower (62.4% vs 71.4%) due to SmolVLA''s weaker backbone
    capacity (SmolLM-360M vs pi0''s larger model). The per-type specialization pattern
    replicates: visual shows the largest delta (10.4%), physical moderate (7.6%),
    spatial weak (2.8%). Spatial underperformance persists across backbones, confirming
    it''s a fundamental limitation of single-step LoRA correction for trajectory-level

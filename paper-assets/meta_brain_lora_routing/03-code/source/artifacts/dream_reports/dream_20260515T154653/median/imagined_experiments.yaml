- name: LoRA Layer Placement Ablation
  plan_id: plan_012
  description: 'Vary which PaliGemma layers receive LoRA: (a) early (2-6), (b) mid
    (6-12), (c) late (12-16), (d) all layers. Test hypothesis that perturbation types
    optimally correct at different processing stages.

    '
  expected_results:
    lora_v_early: 80.2
    lora_v_mid: 74.8
    lora_v_late: 71.4
    lora_v_all: 78.3
    lora_s_early: 64.6
    lora_s_mid: 70.2
    lora_s_late: 66.8
    lora_s_all: 68.0
    lora_p_early: 72.8
    lora_p_mid: 75.2
    lora_p_late: 80.6
    lora_p_all: 78.0
    optimal_placement_v: early (2-6)
    optimal_placement_s: mid (6-12)
    optimal_placement_p: late (12-16)
    optimal_combined_overall: 73.8
    all_layer_combined_overall: 71.4
    layer_placement_gain: 2.4
  result_rationale: 'The layer placement results support the mechanistic hypothesis
    with moderate effect sizes. LoRA-V benefits most from early layers (+1.9% over
    all-layer) because visual perturbations (camera/light/background/noise) corrupt
    the initial visual encoding in PaliGemma''s early layers — correcting at the source
    prevents error propagation. LoRA-S benefits from mid layers (+2.2% over all-layer)
    because spatial reasoning (object relationships, layout understanding) is computed
    in middle transformer layers where multi-head attention integrates spatial context
    — though the absolute improvement remains modest due to the fundamental trajectory-level
    limitation. LoRA-P benefits from late layers (+2.6% over all-layer) because physical
    perturbations manifest at the action prediction stage in late layers where dynamics
    models are implicitly computed. All-layer placement performs as a reasonable default
    (second-best for each expert type) because the LoRA rank is distributed across
    layers that contribute varying amounts. The combined optimal placement (type-specific
    layers per expert) yields 73.8% overall (+2.4% over uniform all-layer 71.4%),
    suggesting layer-aware routing is a promising extension.

    '

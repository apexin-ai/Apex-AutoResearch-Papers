- name: Correction Memory Ablation — With/Without CM
  plan_id: plan_008
  description: 'Compare Meta-Brain with and without Correction Memory module. CM modulates
    routing weights using retrieved exemplars from a FAISS-indexed memory bank. Quantify
    marginal gain overall and per perturbation type.

    '
  expected_results:
    meta_brain_no_cm: 71.4
    meta_brain_with_cm: 72.6
    cm_ablation_delta: 1.2
    cm_delta_visual: 0.8
    cm_delta_spatial: 0.4
    cm_delta_physical: 2.8
    cm_alpha_learned: 0.23
    cm_retrieval_latency_ms: 1.4
  result_rationale: 'CM provides a marginal +1.2% overall gain, concentrated on physical
    perturbations (+2.8%) where the same robot dynamics changes recur consistently
    across episodes — exemplar retrieval identifies "I''ve seen this perturbation
    before" and sharpens the routing weight toward LoRA-P. Visual gain is small (+0.8%)
    because the PAR router already routes visual perturbations confidently (diag 0.82)
    and CM''s modulation has little room to improve. Spatial gain is minimal (+0.4%)
    because spatial perturbations are fundamentally different each time (different
    object positions) so retrieved exemplars provide weak signal. The learned alpha
    parameter (0.23) confirms the system''s own assessment: CM contributes ~23% weighting
    to the final routing decision, indicating it''s a secondary correction to PAR,
    not a primary signal. The 1.4ms retrieval latency adds negligible overhead to
    the 10Hz control loop. CM is worth including as an optional module but does not
    change the core story.

    '

    beyond representation correction. The routing weight analysis reveals the PAR
    router appropriately lacks confidence on spatial inputs (diag 0.68), which limits
    both the benefit and the harm of routing on these types. The end-to-end routing
    fine-tuning shifts the router from pure classification toward task-success optimization,
    explaining the gap between Phase 0 accuracy (99.3%) and deployed routing accuracy
    (~89%).


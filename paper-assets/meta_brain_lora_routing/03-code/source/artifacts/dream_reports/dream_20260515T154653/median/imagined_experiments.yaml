- name: Oracle Routing — Upper Bound for Routing Quality
  plan_id: plan_004
  description: 'Replace PAR soft router with ground-truth perturbation type labels
    (hard 1-hot routing to the correct expert). Same LoRA experts from plan_002. Measures
    the ceiling for routing quality and quantifies PAR''s gap to perfect routing.

    '

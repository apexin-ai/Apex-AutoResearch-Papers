  result_rationale: '6-class routing provides only +0.8% overall improvement over
    3-class while doubling the parameter budget (12M vs 6M) and dropping routing accuracy
    by 4.4% (89.4% vs 93.8%). The marginal gain arises primarily from the robot expert
    (+3.8% from dedicated robot LoRA vs shared Physical LoRA) where the 1-type Physical
    class benefits from fully dedicated parameters. Intra-Visual perturbation types
    (camera/light/background/noise) do NOT benefit significantly from separate experts
    because they share the same failure mode (early representation corruption) — Phase
    0 6-class analysis already showed high intra-Visual similarity. The spatial split
    (distractor/layout) gains marginally because both types require trajectory-level
    reasoning that LoRA cannot provide. The 4.4% routing accuracy drop with 6 classes
    partially offsets any per-expert specialization gain: more classes means more
    routing errors, and each error routes to a more narrowly specialized (thus more

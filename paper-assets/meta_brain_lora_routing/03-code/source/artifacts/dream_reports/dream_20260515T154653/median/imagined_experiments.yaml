- name: Router Architecture Comparison — MLP vs Linear vs Attention
  plan_id: plan_009
  description: 'Compare PAR router variants on PaliGemma layer 6: (a) 2-layer MLP
    (default, ~50K params), (b) linear classifier (~6K params), (c) cross-attention
    router (~120K params). Evaluate both routing accuracy and downstream task success
    to test whether classification accuracy improvements translate to task performance.

    '
  expected_results:
    mlp_routing_accuracy: 93.8
    mlp_task_success: 71.4
    mlp_params: 50000
    linear_routing_accuracy: 90.6
    linear_task_success: 70.2
    linear_params: 6000
    attention_routing_accuracy: 94.2
    attention_task_success: 71.2
    attention_params: 120000
    mlp_vs_linear_task_gap: 1.2
    mlp_vs_attention_task_gap: 0.2
  result_rationale: 'MLP (default) achieves 93.8% routing accuracy and 71.4% task
    success, offering the best cost/performance tradeoff. Linear router loses 3.2%
    routing accuracy, which translates to a modest 1.2% task success drop — the per-token
    representation at layer 6 is already quite separable (Phase 0 showed F1=0.993
    with MLP), so a linear boundary captures most of the structure but misses some
    nonlinear decision boundaries near cluster edges. Attention router adds 0.4% routing
    accuracy over MLP (the classes are well-separated enough that attention over token
    sequences adds minimal information beyond mean pooling) but this doesn''t translate
    to task success improvement (71.2% vs 71.4%) — the 0.4% classification gain falls
    within the noise floor of rollout evaluation. The attention router''s 2.4× parameter
    overhead is unjustified. Conclusion: MLP is the right choice, confirming the Phase
    0 finding that perturbation type is a simple classification problem at layer 6.

    '

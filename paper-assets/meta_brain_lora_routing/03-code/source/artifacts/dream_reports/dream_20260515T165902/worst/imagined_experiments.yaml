tier: worst
narrative_guidance: 'Claim 2 collapses — rank-48 universal LoRA nearly matches Meta-Brain
  (<1pp gap), and random routing performs within 2pp of PAR routing, indicating the
  multi-expert advantage is primarily an ensemble/capacity effect rather than perturbation-type
  specialization. Cross-type expert drops are small (3-6pp), confirming experts learn
  largely interchangeable corrections. The oracle gap (6pp) hints at unrealized potential,
  but current expert training cannot produce sufficiently specialized adapters to
  exploit the diagnostic signal. Clean LIBERO shows measurable degradation (-4pp).
  Radical reframing required: lead with Phase 0 mechanistic finding as primary contribution,
  present routing experiments as an honest negative result, and position the oracle
  gap as an open problem. Paper becomes "diagnostic tools for VLA robustness" rather
  than "routing-based correction."

  '

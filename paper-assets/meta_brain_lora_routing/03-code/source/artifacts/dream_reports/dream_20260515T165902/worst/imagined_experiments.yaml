    匹配，而非学到了质性不同的修正函数。LoRA-V 在 Visual 上最强（67%）是因为视觉增强的 训练范式（FTM 式）天然适配 LoRA 微调，但当
    LoRA-S 被错误应用于 Visual 时仍达 62.5% （仅降 4.5pp），说明 LoRA-S 学到的修正在空间上和视觉修正高度重叠。Physical

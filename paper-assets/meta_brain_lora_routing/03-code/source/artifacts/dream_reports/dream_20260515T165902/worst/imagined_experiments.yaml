  result_rationale: 'Oracle routing（69.9%）显著高于 Meta-Brain（64.0%），gap 达 5.9pp。这一结果的解释
    是双面的：(1) 它证明了路由"原则上"有价值——完美路由比 Meta-Brain 的 soft-ensemble 好 6pp；(2) 但它同时证明当前专家不够
    specialized——即使完美路由，oracle 也只比 rank-48 universal（63.3%）高 6.6pp。对比理想情况：如果专家真的学到了完全不同的修正模式，
    oracle 应该接近各专家在自身类型上的最佳表现的加权平均（~64.5%），但 oracle 的 69.9% 远高于此。这说明 one-hot hard
    routing 的优势不在于"选对专家"，而在于避免了 soft routing 带来的专家间干扰——当错误专家的权重为零时，修正信号更纯净。Physical
    类型的 oracle（59.5%）仍然偏低，进一步确认 LoRA-P 的能力上限受限于 rank 16 容量。


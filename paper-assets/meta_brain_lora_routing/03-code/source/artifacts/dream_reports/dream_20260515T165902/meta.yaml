    result_rationale: '消融梯度严格单调递增（53.6→62.4→65.1→65.8→78.9→80.7），每一步对应一个 独立的能力维度：
      (1) Frozen→r16（+8.8pp）：LoRA 本身提供了通用的 representation correction 能力， 即使不区分扰动类型，低秩修正也能改善
      feature robustness。 (2) r16→r48（+2.7pp）：增加 rank 有帮助但收益递减——3.2× 参数仅换来 2.7pp，
      说明 universal correction 的 capacity utilization efficiency 随 rank 下降， 因为额外参数被迫在三种互斥修正方向上妥协。
      (3) r48→Random（+0.7pp, p=0.38 不显著）：仅 3 个 expert 的 ensemble 效应 几乎不存在。Random routing
      有时碰巧选对 expert（1/3 概率），拉高了均值， 但也有 2/3 概率选错并导致 suboptimal correction。这两个效应近似抵消，
      使 random 仅比 universal 高 0.7pp。p=0.38 的不显著性是关键 null result—— 它排除了 "Meta-Brain
      的好处来自 ensemble averaging" 的 alternative explanation。 (4) Random→Meta-Brain（+13.1pp,

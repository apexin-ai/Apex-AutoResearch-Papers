    \ latency/throughput analysis.** Soft routing requires computing all 3 LoRA expert\
    \ outputs per timestep. The paper claims \"negligible latency\" but provides no\
    \ wall-clock measurements. Critical for real-time robot control at 10+ Hz.\n5.\
    \ **(Moderate) Episode counts not disclosed.** Number of evaluation episodes per\
    \ perturbation type per seed is never stated. Cannot assess statistical power\
    \ or success rate resolution.\n6. **(Moderate) \"Overall\" metric biased toward\
    \ visual.** 4/6 subtypes are visual. Category-balanced average (V:75.5, S:69.2,\
    \ P:61.0 → 68.6%) should be reported alongside subtype-uniform average (72.0%).\n\

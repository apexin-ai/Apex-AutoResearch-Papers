    ## 6. Roundtable Convergence


    ### Points of Agreement

    - The ablation ladder is exemplary and the random routing null result is the paper''s
    single strongest contribution

    - Cross-backbone validation (+14.2pp on SmolVLA) is genuinely convincing evidence
    of generality

    - The closed-set 3-class taxonomy is a real limitation that needs to be addressed
    or discussed more honestly

    - The VLA-GSE cross-backbone comparison should be de-emphasized in favor of within-backbone
    controls

    - Simulation-only evaluation is acceptable but the generality claims should be
    tempered

    - Statistical practices are commendable


    ### Points of Disagreement and Resolution

    **Novelty weight:** R1 initially scored 7 (accept), giving more weight to empirical
    rigor and arguing CoRL values systems contributions. R2 scored 6 (marginal), emphasizing
    that without engaging the MoE-LoRA literature, the novelty gap is too large. After
    discussion, both agreed the novelty concern is legitimate but partially offset
    by empirical thoroughness. The missing MoE-LoRA citations are a fixable issue.


    **Phase 0 contribution status:** R2 viewed it as confirmatory (not a standalone
    contribution); R1 acknowledged it is a natural extension but found the single-token
    single-layer specificity useful. Consensus: it is a useful empirical detail but
    should not be framed as a major contribution.


    **Consensus score: 6/10 (Marginally Above Acceptance Threshold)**


    The paper''s empirical methodology is above the CoRL acceptance bar, but the limited
    methodological novelty and incomplete engagement with the MoE-LoRA literature
    keep it from a confident accept. The closed-set taxonomy is a practical concern
    for a robotics venue. If the authors (1) thoroughly discuss MoE-LoRA methods and
    explicitly argue differentiation, (2) add at least one compound-perturbation or
    open-set experiment, and (3) include latency analysis, this would move to a clear
    accept (7-8).


    ---


    ## 7. Recommendations for Improvement


    ### Must-Fix (to reach Accept)

    1. **Cite and discuss MoE-LoRA methods** (LoRAMoE, MoLoRA, MixLoRA, AdapterFusion).
    Explicitly argue what Meta-Brain contributes beyond "different routing signal
    in the same architecture."

    2. **Add compound perturbation evaluation** (e.g., lighting + layout simultaneously).
    This directly tests whether soft routing can handle multi-type scenarios.

    3. **Report episode counts** per condition per seed.

    4. **Add latency analysis** (wall-clock time for Meta-Brain vs. single universal
    LoRA).

    5. **De-emphasize VLA-GSE comparison** in abstract/conclusion. Lead with within-backbone
    r48 comparison.


    ### Should-Fix (to strengthen)

    6. **Add TTA discussion** (TENT, TTT) and argue why explicit categorical routing
    is preferable.

    7. **Report category-balanced average** alongside overall metric.

    8. **Disclose training data volumes** per perturbation type and discuss the asymmetry.

    9. **Reframe Phase 0** as a prerequisite observation rather than a standalone
    contribution.

    10. **Remove or support "orthogonal design dimension" claim** with a composability
    experiment.


    ### Nice-to-Have

    11. Open-set perturbation experiment (novel perturbation type not in taxonomy).

    12. Third backbone validation.

    13. Real-robot pilot study (even small-scale).



      per_subtype_light: 83.8
      per_subtype_background: 80.2
      per_subtype_noise: 82.1
      per_subtype_layout: 77.5
      per_subtype_robot: 74.8
      routing_weight_visual_on_lora_v: 0.91
      routing_weight_spatial_on_lora_s: 0.88
      routing_weight_physical_on_lora_p: 0.86
      routing_entropy_visual: 0.12
      routing_entropy_spatial: 0.15
      routing_entropy_physical: 0.18
      par_routing_accuracy: 96.8
      e2e_finetuning_epochs: 5
      total_trainable_params_M: 11.6
    result_rationale: '78.9% 整体成功率来自三个因素的协同：(1) PAR router routing accuracy 达 96.8%——
      Phase 0 已证明 layer 6 first-token 激活在 3-class 上 F1=1.0，端到端微调只需 轻微校准 soft routing
      的温度参数；(2) soft routing entropy 极低（0.12-0.18）， 说明 router 对每种扰动类型高度确信，routing
      weights 近似 one-hot（视觉扰动时 LoRA-V 权重 0.91），使 Meta-Brain 在运行时近似 oracle routing——这直接解释了
      oracle gap 仅 1.8pp；(3) 各 expert 本身质量高（plan_002 验证），routing 只需 选对 expert 即可。per-type
      排序 V>S>P（81.2>77.5>74.8）反映了扰动修正的内在 难度梯度：视觉扰动是最规则的低秩变换（brightness/contrast 近似线性），空间扰动
      需要调整 mid-level spatial reasoning，物理扰动涉及 action planning 的高层语义 重构。per-subtype
      中 light 最高（83.8%）因为亮度变化是最平滑的视觉扰动， camera 稍低（78.5%）因为视角变化需要更复杂的几何 re-projection。Physical
      expert 的 routing confidence 稍低（0.86 vs 0.91）因为物理扰动在激活空间中的 cluster 略松散（Phase
      0: physical F1=0.951 at K=1 vs spatial F1=1.0）。

      '

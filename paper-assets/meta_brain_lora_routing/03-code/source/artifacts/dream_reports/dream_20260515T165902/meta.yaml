    \ are uncontrolled confounds. |\n| **Clarity** | **7/10** | Method is clearly\
    \ described with explicit equations. Ablation ladder is well-structured. Tables\
    \ are informative. Minor: gradient flow through soft routing during router training\
    \ could be more explicit; only 4 references is extremely thin. |\n| **Significance**\
    \ | **5/10** | The empirical finding (+5.6pp routing premium, p=0.008) is useful\
    \ but modest. Single benchmark with synthetic perturbations limits practical significance.\
    \ The insight that routing benefit varies by perturbation type is informative\
    \ but not actionable beyond LIBERO-Plus without open-set/compound evaluation.\
    \ |\n| **Relevance (CoRL)** | **7/10** | Clearly addresses robot learning robustness.\
    \ VLA adaptation is a timely topic. However, simulation-only evaluation with no\

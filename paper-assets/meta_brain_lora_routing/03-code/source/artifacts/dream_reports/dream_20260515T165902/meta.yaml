    \ High linear separability of categorically distinct perturbations in intermediate\
    \ representations is expected, not surprising (SAFE already showed VLA activations\
    \ encode execution-relevant state).\n\n**Scores (R1):**\n- Soundness: 6/10\n-\
    \ Empirical evaluation: 6/10\n- Clarity of method: 7/10\n- Overall recommendation:\
    \ 6/10\n- Confidence: 4/5\n\n---\n\n### R2 — Novelty & Related Work\n\n**Summary:**\
    \ Meta-Brain applies the standard MoE-LoRA template (weighted sum of LoRA experts\
    \ with learned MLP gating) to a new routing signal — perturbation type diagnosed\
    \ from frozen VLA activations. The empirical execution is solid (parameter-matched\
    \ baseline, random routing control, cross-backbone validation), but the contribution\
    \ is at the application/design-choice level within an existing architectural template.\n\
    \n**Strengths:**\n1. **Random routing null result is the paper's strongest contribution.**\
    \ Random routing (64.2%) < Universal r48 (66.4%) definitively rules out the ensemble\
    \ hypothesis. This is the critical control that many MoE papers omit.\n2. **Routing-benefit-by-type\
    \ analysis provides genuine insight.** The gradient (Visual +5.4pp > Spatial +4.9pp\
    \ > Physical +2.4pp) with anti-correlated routing entropy (0.41/0.52/0.72) is\
    \ informative and honestly discussed.\n3. **Parameter-matched comparison is correct.**\
    \ The +5.6pp gap (p=0.008) over rank-48 universal directly addresses parameter\
    \ confounds.\n4. **Cross-backbone validation.** Routing benefit consistency across\
    \ pi0 and OpenVLA is more cross-architecture evidence than most comparable papers.\n\
    5. **Honest limitations.** Clean degradation, Physical weakness, oracle gap, and\
    \ CM non-significance are all transparently reported.\n\n**Weaknesses:**\n1. **(Major)\
    \ Architecture is standard MoE-LoRA with no new mechanism.** The soft routing\
    \ formula h_corrected = h_frozen + Σ_k w_k · LoRA_k(h_frozen) is architecturally\
    \ identical to LoRAMoE, MoLoRA, MixLoRA, and MOELoRA. The only distinguishing\
    \ element is routing by perturbation type rather than task identity. This is an\
    \ application-level design choice within an existing template, not a methodological\
    \ advance.\n2. **(Major) Severely incomplete bibliography.** The paper cites only\
    \ 4 references. Critical missing works include:\n   - MoE-LoRA methods: LoRAMoE,\
    \ MoLoRA, MixLoRA, MOELoRA (implement the same formula)\n   - Adapter composition:\
    \ AdapterFusion, Poly, AdaMix\n   - Test-time adaptation: TENT, TTT, MEMO (handle\
    \ distribution shift without taxonomies)\n   - Domain-adaptive conditioning: Conditional\
    \ Batch Norm, FiLM, domain-specific adapters\n   - Probing foundations: Alain\
    \ & Bengio (2017)\n   - MoE fundamentals: Shazeer et al. (2017)\n   Without engaging\
    \ this literature, the reader cannot assess incremental novelty.\n3. **(Major)\
    \ Phase 0 finding is confirmatory, not novel.** Categorically different perturbations\
    \ producing distinguishable activation patterns is expected. SAFE already demonstrated\
    \ VLA activations encode execution-relevant state. This should be a prerequisite\
    \ observation, not a contribution.\n4. **(Major) Closed-set taxonomy is a fundamental\
    \ limitation for a robotics venue.** No compound perturbation evaluation, no open-set\
    \ testing, no continuous severity handling. For CoRL where deployment conditions\
    \ are inherently unpredictable, this is a serious practical limitation.\n5. **(Moderate)\
    \ VLA-GSE comparison is misleading.** Computing gain-per-parameter across different\
    \ backbones (12M on pi0 vs. 114M on Qwen3-VL-4B) is not a fair comparison. The\
    \ \"indirect\" footnote doesn't prevent misinterpretation.\n6. **(Moderate) Missing\
    \ engagement with test-time adaptation.** TTA methods (TENT, TTT) handle distribution\
    \ shift without pre-defined taxonomies. The paper doesn't discuss why explicit\
    \ categorical routing is preferable to taxonomy-free adaptation — a natural question\
    \ for any robotics reviewer.\n7. **(Moderate) \"Perturbation-diagnostic routing\
    \ as new design dimension\" overclaims.** The mechanism is identical to task-based\
    \ routing; only the routing signal differs. A more honest framing: \"We identify\
    \ perturbation type as a more informative routing signal than task identity for\
    \ VLA robustness.\"\n\n**Scores (R2):**\n- Originality: 4/10\n- Related work coverage:\
    \ 3/10\n- Significance: 6/10\n- Overall recommendation: 5/10\n- Confidence: 4/5\n\
    \n---\n\n## Step 2: Cross-Sharing\n\nBoth reviewers examined each other's reviews.\

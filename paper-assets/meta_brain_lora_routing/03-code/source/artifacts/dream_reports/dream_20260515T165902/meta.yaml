  - name: LoRA layer placement ablation
    plan_id: plan_012
    description: 'Vary which PaliGemma layers receive LoRA: (a) early (2-6), (b) mid
      (6-12), (c) late (12-16), (d) all layers (default). Test per-expert-type layer
      placement hypothesis.

      '
    expected_results:
      lora_v_early_visual: 76.8
      lora_v_mid_visual: 73.2
      lora_v_late_visual: 70.4
      lora_v_all_visual: 75.5
      lora_s_early_spatial: 64.6
      lora_s_mid_spatial: 70.8
      lora_s_late_spatial: 66.2
      lora_s_all_spatial: 69.2
      lora_p_early_physical: 57.4
      lora_p_mid_physical: 59.2
      lora_p_late_physical: 60.8
      lora_p_all_physical: 61.0
      optimal_v: early (2-6)
      optimal_s: mid (6-12)
      optimal_p: late (12-16) ≈ all layers
    result_rationale: 'Layer placement shows a partial match to the V→early, S→mid,
      P→late hypothesis, but with important nuances. LoRA-V is best at early layers
      (76.8%) because visual perturbations corrupt early representations most — intervening
      at layers 2-6 corrects corrupted visual features before they propagate to higher
      layers. LoRA-V at all layers (75.5%) is slightly worse because later LoRA modules
      introduce unnecessary corrections at layers where visual features are already
      clean. LoRA-S is best at mid layers (70.8%) because spatial perturbations (layout
      changes) affect mid-level spatial reasoning where object relationships are encoded
      — early layers still process raw visual features correctly, and late layers
      have already committed to action plans. LoRA-P shows the weakest layer preference:
      late layers (60.8%) are marginally best but barely exceed all layers (61.0%),
      confirming that physical perturbation correction is weak throughout the representation
      hierarchy. The lack of strong layer preference for LoRA-P reinforces the median-tier
      narrative that physical perturbations are poorly addressed at the representation
      level. The layer placement analysis provides a concrete practical insight: type-specific
      layer assignment (V→early, S→mid) could improve parameter efficiency by 40%
      (5 layers × 3 experts = 15 LoRA modules vs 18 layers × 3 experts = 54 modules
      in the default config).

      '
    tables:
    - title: Layer placement ablation (per-type success rate with matched expert)
      content: '| Expert | Early (2-6) | Mid (6-12) | Late (12-16) | All (default)
        | Best |

        |--------|-------------|------------|-------------|---------------|------|

        | LoRA-V on Visual | **76.8** | 73.2 | 70.4 | 75.5 | Early |

        | LoRA-S on Spatial | 64.6 | **70.8** | 66.2 | 69.2 | Mid |

        | LoRA-P on Physical | 57.4 | 59.2 | 60.8 | **61.0** | All ≈ Late |

        '
    figures_description:
    - '3-panel line plot (one per expert type): x=layer range, y=success rate. LoRA-V
      peaks early, LoRA-S peaks mid, LoRA-P is nearly flat. Clear mechanistic alignment
      for V and S; P shows no useful structure.'
    analysis: 'Layer placement provides a practical insight for the paper''s "layer-perturbation
      mapping" narrative. V→early and S→mid are clear wins that align with VLA processing
      stages. P→late/all is ambiguous, reinforcing that physical perturbation correction
      at the representation level is fundamentally limited. Present as: "perturbation-type-to-layer
      mapping reveals that visual perturbations are best corrected at early layers
      (pre-spatial-reasoning) and spatial perturbations at mid layers (spatial-reasoning
      stage), suggesting type-aware layer assignment as a parameter efficiency optimization."
      Note: all-layer (default) is competitive for all types, so the default config
      is a reasonable choice if practitioners don''t want to tune layer assignment.'
  review_report: "---\ndream_id: dream_20260515T165902\ntier: median\noverall_score:\

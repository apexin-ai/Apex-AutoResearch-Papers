    ---\n\n# Dream Review Report: Meta-Brain (CoRL 2026)\n\n**Dream ID:** 20260515T165902\n\
    **Paper:** Meta-Brain: Perturbation-Diagnostic Routing of LoRA Experts for Robust\
    \ Vision-Language-Action Models\n**Target Venue:** CoRL 2026\n**Review Mode:**\
    \ Full (2-reviewer roundtable)\n**Rating Scale:** 1–10 (OpenReview default; CoRL\
    \ 2023 used similar scale, avg ~6.5)\n\n---\n\n## Venue Calibration: CoRL 2026\n\
    \n- **Evaluation dimensions:** Originality, Quality, Clarity, Significance, Relevance,\
    \ Limitations\n- **Scope requirement:** Must demonstrate relevance to robot learning;\
    \ learning-based methods; evaluation in simulation or on real robots\n- **Typical\
    \ acceptance rate:** ~25–35%\n- **Key expectation:** CoRL values robotics-grounded\
    \ contributions with either real-robot experiments or strong simulation+transfer\
    \ evidence. Purely algorithmic contributions with limited empirical scope face\
    \ a higher novelty bar.\n\n---\n\n## Reviewer Assignments\n\n- **R1 (Methods +\
    \ Experiments):** Evaluates technical soundness, experimental design, statistical\
    \ rigor, baselines, and claim support\n- **R2 (Novelty + Related Work):** Evaluates\
    \ originality, positioning against prior work, conceptual contribution, and framing\n\
    \n---\n\n## Step 1: Independent Reviews\n\n### R1 — Methods & Experiments\n\n\
    **Summary:** Meta-Brain proposes a two-stage framework: (1) a PAR router (2-layer\
    \ MLP on frozen PaliGemma layer-6 activations) classifies perturbation type, and\
    \ (2) three rank-16 LoRA experts are soft-routed by the diagnosed type. On LIBERO-Plus:\
    \ 72.0% overall with ~12M params, +5.6pp over parameter-matched rank-48 universal\
    \ LoRA (p=0.008).\n\n**Strengths:**\n1. **Exemplary ablation ladder.** The six-point\
    \ progression (Frozen 53.6 → r16 62.1 → Random 64.2 → r48 66.4 → Meta-Brain 72.0\
    \ → Oracle 77.0) is monotonic and each step isolates exactly one factor. The rank-48\
    \ parameter-matched baseline is the existential control. The random routing null\
    \ result (Random < r48) is the single most important experiment — it cleanly falsifies\
    \ the ensemble alternative hypothesis.\n2. **Statistical rigor above venue average.**\
    \ Five-seed evaluation with paired t-tests, exact p-values (including non-significant\
    \ results: CM p=0.12, Random vs r48 p=0.18). Honest treatment of non-significant\
    \ findings.\n3. **Cross-type evaluation matrix demonstrates non-interchangeable\
    \ corrections.** The asymmetric cross-type drops (LoRA-V 13.1pp, LoRA-S 9.0pp,\
    \ LoRA-P 3.6pp) support the specialization argument with informative gradient.\n\
    4. **Comprehensive experiment coverage.** 14 experiments spanning ablation ladder,\
    \ statistical tests, per-perturbation analysis, FTM comparison, rank sweep, parameter\
    \ efficiency, clean LIBERO, cross-backbone, router architecture, routing granularity,\
    \ layer placement, and CM ablation.\n5. **Cross-backbone consistency.** Routing\
    \ benefit ~5.6pp on OpenVLA mirrors pi0 result. Phase 0 replication (F1=0.94)\
    \ at a different optimal layer (8 vs 6) suggests the phenomenon generalizes.\n\
    6. **Honest limitations treatment.** Clean LIBERO degradation (-2.0pp), weak Physical\
    \ routing benefit (+2.4pp), oracle gap (5.0pp), and CM non-significance are all\
    \ transparently reported.\n\n**Weaknesses:**\n1. **(Major) Simulation-only evaluation\

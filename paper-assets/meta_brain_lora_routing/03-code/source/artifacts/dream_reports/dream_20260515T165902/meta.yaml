  - name: Ablation Ladder — Full Systematic Comparison
    plan_id: plan_005
    description: 'LIBERO-Plus 上 6 个系统配置的系统对比（5 seeds）：Frozen → Universal-r16 → Universal-r48
      → Random Routing → Meta-Brain → Oracle。包含 rank-48 parameter-matched control

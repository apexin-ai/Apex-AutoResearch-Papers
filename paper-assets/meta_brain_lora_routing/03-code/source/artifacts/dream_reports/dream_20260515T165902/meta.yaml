    result_rationale: 'Oracle routing 达到 80.7%，仅比 Meta-Brain（78.9%）高 1.8pp。Gap 小于
      routing 分类错误率所预测的值（routing accuracy 96.8% → 3.2% 错误 → 预期 impact ~3pp）， 因为 PAR
      的 soft routing 在分类不完全正确时仍分配了较高权重给正确 expert （如 misrouted visual 案例中 LoRA-V 仍获
      0.65 权重 vs LoRA-S 0.35），使得 routing error 的 downstream impact 被 dampen。per-type
      gap 高度一致 （1.7-1.8pp），说明 PAR router 在三种类型上的性能均衡，没有系统性偏向。 Physical 的 oracle gap（1.7pp）最小，看似反直觉（physical

  result_rationale: 'The routing classification task is nearly saturated (Phase 0
    F1=0.993), so router architecture differences are small. Linear classifier''s
    slight accuracy gap (F1 0.988 vs 0.996) translates to ~1.4pp downstream loss:
    the 0.8% additional routing errors occur on ambiguous boundary cases (e.g., background
    swaps that also affect spatial layout), and these errors compound over multi-step
    rollouts (a single misroute early in an episode can cascade). Attention-based
    router marginally improves (F1 0.997, +0.4pp downstream) by better handling these
    boundary cases through cross-dimensional attention on the 2048-dim PaliGemma features,
    but the gain doesn''t justify 60% more parameters. The 2-layer MLP is Pareto-optimal:
    near-perfect routing at minimal overhead.

    '

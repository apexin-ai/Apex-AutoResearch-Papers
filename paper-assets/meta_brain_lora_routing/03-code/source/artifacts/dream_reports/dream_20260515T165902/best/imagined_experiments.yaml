tier: best
narrative_guidance: 'Original framing holds without modification. Headline: "Meta-Brain
  achieves 78.9% on LIBERO-Plus with ~12M params, outperforming parameter-matched
  rank-48 universal LoRA by 13.8pp — perturbation-diagnostic routing is a more efficient
  use of adaptation capacity than uniform correction." Ablation ladder strictly monotonic:
  Frozen (53.6) < Universal-r16 (62.4) < Universal-r48 (65.1) < Random (65.8) < Meta-Brain
  (78.9) < Oracle (80.7). Existential control (rank-48 universal) cleanly defeated.
  Random routing offers negligible gain over universal-r48 (+0.7pp, p=0.38, n.s.),
  ruling out ensemble effects. Oracle gap only 1.8pp, confirming PAR router quality.
  Clean LIBERO preserved (+0.3pp). Cross-type mismatch drop avg 17.4pp validates expert
  specialization. Rank sweep shows benefit monotonically increasing (13.8→13.9→14.2pp).
  All 3 claims stand at full strength. Paper structure: Phase 0 finding → architecture
  → ablation ladder → per-perturbation cross-type analysis → rank sweep → parameter
  efficiency. Bibliography covers MoE routing (Switch Transformer, GShard, ST-MoE,
  V-MoE), VLA robustness (VLA-GSE, SAFE, RobustVLA, FTM, FLA, SRPO, CorridorVLA),
  LoRA adaptation (LoRA, LoRA-SP, MoIRA, CORAL, AdaLoRA, DoRA), VLA foundations (pi0,
  OpenVLA, SmolVLA, Octo, RT-2), benchmarks (LIBERO, LIBERO-Plus), reaching 30+ refs
  comfortably.

  '
imagined_experiments:
- name: LoRA Expert Training — 3 Specialized + 1 Universal
  plan_id: plan_002
  description: 'Train 4 LoRA adapters (rank 16, Q/K/V/O on all 18 PaliGemma layers,
    3.7M params each): LoRA-V (online visual augmentation), LoRA-S (oracle spatial
    demos), LoRA-P (oracle physical demos), Universal (mixed all-perturbation data).
    Evaluate each expert on its matched type AND cross-type.

    '
  expected_results:
    lora_v_on_visual: 80.2
    lora_v_on_spatial: 62.0
    lora_v_on_physical: 60.2
    lora_s_on_visual: 59.5
    lora_s_on_spatial: 77.5
    lora_s_on_physical: 60.0
    lora_p_on_visual: 58.2
    lora_p_on_spatial: 60.8
    lora_p_on_physical: 74.8
    universal_r16_visual: 64.8
    universal_r16_spatial: 60.5
    universal_r16_physical: 58.2
    universal_r16_overall: 62.4
    cross_type_avg_drop_pp: 17.4
    val_action_mse_lora_v: 0.0082
    val_action_mse_lora_s: 0.0091
    val_action_mse_lora_p: 0.0098
    val_action_mse_universal: 0.0105
    convergence_epochs: 15
  result_rationale: '在 best 档下，perturbation-specific LoRA 学到了质性不同的修正模式。LoRA-V 在 视觉扰动上达到
    80.2%（+29.4pp over frozen），因为在线增强（camera jitter, brightness shift, background
    swap, Gaussian noise）精确匹配 LIBERO-Plus 视觉 扰动分布，LoRA 只需学习 early-layer visual representation
    的低秩修正。LoRA-S 和 LoRA-P 在各自类型上分别达到 77.5%/74.8%，略低于 LoRA-V，原因有二：(1) spatial 和 physical
    的 oracle demo 采集本身引入采集噪声；(2) 空间和物理扰动涉及 action-level 的高层语义调整，比纯视觉修正的 representation
    变换更复杂。 关键证据在 cross-type performance：LoRA-V 在 spatial 上仅 62.0%（drop 18.2pp）， 因为视觉修正无法纠正
    layout 引起的 action trajectory 偏移——这两种修正在 representation space 中方向正交。LoRA-P 在 visual
    上仅 58.2%（drop 16.6pp）， 因为力学修正作用于 late-layer action planning，反而干扰了本该保持的 early-layer
    visual features。cross-type 仍高于 frozen（58-62% vs 50-57%），说明 experts 学到了部分可迁移的通用
    robustness（如 LoRA 的低秩约束本身有 regularization 效果）， 但 type-specific 部分不可互换。Universal
    LoRA 在各类型上均为中等水平（58-65%）， 是典型的 jack-of-all-trades：3.7M 参数被迫在三种修正方向之间妥协， 每个方向分到的有效容量不足以匹配专有
    expert。Val MSE 证实了这一点：专有 expert （0.008-0.010）显著低于 universal（0.0105），说明 specialization
    带来更精确的 action prediction。

    '
  tables:
  - name: Cross-type evaluation matrix
    description: '3×3 expert-vs-type matrix + universal 行。对角线显著高于非对角线 （avg drop 17.4pp），验证修正不可互换。

      '
    data:

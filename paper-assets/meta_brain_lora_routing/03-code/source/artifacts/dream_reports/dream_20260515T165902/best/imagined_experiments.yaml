    FTM 的 feature masking 原理在 pi0 上同样有效—— masking 通过抑制 early-layer 中被扰动 corrupted
    的 feature channel 来恢复 clean representation。但 FTM 在 spatial（55.8%）和 physical（54.5%）上等同于
    frozen baseline 甚至略低（spatial -1.7pp），因为 FTM 的核心假设是扰动破坏 视觉特征——对 layout 变化或机器人初始状态变化，masking

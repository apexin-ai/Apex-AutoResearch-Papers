- name: Oracle Routing Ablation
  plan_id: plan_004
  description: '用 ground-truth 扰动类型标签（hard one-hot）替换 PAR router，测量 learned routing
    与 perfect routing 的上界差距。

    '
  expected_results:
    oracle_overall: 80.7
    oracle_std: 0.9
    oracle_visual: 83.0
    oracle_spatial: 79.2
    oracle_physical: 76.5
    oracle_minus_meta_brain_overall: 1.8
    oracle_minus_meta_brain_visual: 1.8
    oracle_minus_meta_brain_spatial: 1.7
    oracle_minus_meta_brain_physical: 1.7
  result_rationale: 'Oracle routing 达到 80.7%，仅比 Meta-Brain（78.9%）高 1.8pp。Gap 小于 routing
    分类错误率所预测的值（routing accuracy 96.8% → 3.2% 错误 → 预期 impact ~3pp）， 因为 PAR 的 soft routing
    在分类不完全正确时仍分配了较高权重给正确 expert （如 misrouted visual 案例中 LoRA-V 仍获 0.65 权重 vs LoRA-S
    0.35），使得 routing error 的 downstream impact 被 dampen。per-type gap 高度一致 （1.7-1.8pp），说明
    PAR router 在三种类型上的性能均衡，没有系统性偏向。 Physical 的 oracle gap（1.7pp）最小，看似反直觉（physical
    的 routing accuracy 最低），但 physical expert 的 cross-type performance（60.0-60.8%）高于其他
    expert 的 cross-type（58.2-62.0%），使得 misrouting 的惩罚较轻。

    '
  tables: []
  figures_description:
  - 'Bar chart: Meta-Brain vs Oracle per-type, error bars from 5 seeds, gap annotated'
  analysis: '1.8pp gap 证明 PAR router 不是系统瓶颈。未来提升应聚焦于 expert 质量 （更好训练数据、更高 rank）而非
    router 改进。Oracle 结果也为 routing 设定了 performance ceiling：~80.7% 是 rank-16 expert
    bank 的理论上限。

    '
- name: Ablation Ladder — Full Systematic Comparison
  plan_id: plan_005
  description: 'LIBERO-Plus 上 6 个系统配置的系统对比（5 seeds）：Frozen → Universal-r16 → Universal-r48
    → Random Routing → Meta-Brain → Oracle。包含 rank-48 parameter-matched control 和
    random routing baseline。

    '
  expected_results:
    frozen_pi0_overall: 53.6
    frozen_pi0_std: 0.8

    visual perturbation 在混合训练数据中占 4/6 sub-types， universal LoRA 被 biased toward visual
    correction。Meta-Brain 的 3 experts 各自专注一种类型，消除了方向冲突和数据 imbalance。13.8pp gap（p<0.001）

    共同 构成 best 档核心证据。routing entropy 的 per-type 差异（0.12 visual vs 0.18 physical）反映了
    Phase 0 分类精度的差异——但即使 physical 的 entropy 也远低于 maximum（0.18 vs log(3)=1.10），确认所有类型的

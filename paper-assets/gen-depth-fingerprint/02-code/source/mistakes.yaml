  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: 论文核心指标 silhouette=0.632 不可复现，原始计算脚本缺失
  root_cause: 原始 k-means silhouette 计算可能在早期分析中完成，脚本未纳入版本控制或已被覆盖。后续 permutation test

- id: M009
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: Worker data validation 只检查文件存在和 depth range，未检查 depth 分布平衡性，导致 Gemma-2-2B
    67/4000 条数据被标为 "validation passed"
  root_cause: Worker 的 data validation 只做了 shallow check（文件存在 + depth 值域 0-4），没有检查每个
    depth 的样本数是否合理。Feature extraction 中断只处理了极少部分 depth≥1 的文本，但 validation 未捕获。
  prevention: 数据验证必须包含 depth 分布检查：每个 depth 的样本数应与预期（~seeds 数）一致，任何 depth 的样本数低于预期的
    50% 应 fail。加入 min_samples_per_depth 阈值检查。
  status: active
  fix: 方案 A：对 Gemma 重跑 feature extraction（原始生成数据完整），补齐后再跑 9-gen LOGO
  related_decisions:
  - D029
- id: M010
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: 3/2/2 partition ablation 使用了错误的 Cohen's d 基线 (gen-0 vs gen-1+ 而非 gen-1
    vs gen-2+)
  root_cause: Worker 脚本 ablation_322_partition.py 中 Cohen's d 的比较组设置为 gen-0 vs gen-1+，但论文
    DDR 分析的基线是 gen-1 vs gen-2+（排除 human text）。Worker 未对齐论文的 effect size 定义。
  prevention: 任何涉及 DDR effect size 计算的新脚本，必须在代码审查中确认比较基线为 gen-1 vs gen-2+（不含 gen-0）。Director

- id: M016
  date: '2026-05-22'
  category: agent_behavior
  severity: medium
  summary: Agent presubmit scan 严重度膨胀 + 引用扫描误报：将标准 LaTeX 手法标为 CRITICAL，2 个已引用的 bib
    条目误报为未引用
  root_cause: 引用扫描只检查了 .bib 文件而未正确解析 .tex 中的 \cite{} 命令（W1/W2 误报）；对 LaTeX 排版惯例缺乏领域知识，将负
    vspace 和 raggedbottom 等标准做法误判为 format checker 风险（C2/C3 膨胀）
  prevention: 1. 引用检查必须双向验证：.bib → .tex 和 .tex → .bib 都要扫描，解析所有 \cite/\citet/\citep
    变体。2. LaTeX 格式合规性判断应区分 format checker 实际检查项（margin/page count）与常见排版手法（vspace/raggedbottom）。3.
    Director 收到 Agent 的扫描报告后必须送 Reviewer 独立核实再行动，不能直接按 Agent 结论派任务
  status: active
  fix: urgent_agent_message 撤回错误指令（不删负 vspace/raggedbottom/已引用 bib），只保留真实需要修复的项（enlargethispage
    待确认、孤儿 bib 删除、>48× 同步编译）

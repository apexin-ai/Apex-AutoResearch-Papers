  status: active
  context: Reviewer 审查 permutation test 和 3/2/2 ablation 时发现三个不同 silhouette 值 (0.632/0.6603/0.7352)
    来自不同计算基线。3/2/2 的结论 (silhouette 3/2/2=0.3320 > 3/1/3=0.1759) 在正确基线下可能完全反转。
  fix: 修正脚本基线为 gen-1 vs gen-2+，重跑 3/2/2 ablation + exhaustive enumeration (35 种分法)

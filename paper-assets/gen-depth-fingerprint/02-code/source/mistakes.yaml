- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: Multi-domain seeds 实验用了 t=1.0 而主实验用 t=0.7，引入 temperature 混淆变量
  root_cause: 派发 multi-domain 任务时未明确要求使用与主实验相同的 generation hyperparams (t=0.7, top_p=0.9)。Agent
    默认用了 HuggingFace generate() 的默认参数。
  prevention: 派发涉及新数据生成的实验时，指令必须明确���出 generation hyperparams（temperature, top_p,
    max_new_tokens, prompt format），并要求与主实验一致或给出偏离的理由。审批时增加 checklist 项："generation
    params 与主实验一致？"
  status: active
  context: Reviewer 发现后确认：论文 sampling ablation 显示 t=1.0 退化约 6pp。幸运的是 t=1.0 是更 conservative
    的测试条件，不削弱结论（F1>0.73 在更难条件下仍成立），只是无法精确量化 domain-only effect。
  fix: 论文中改用绝对 F1 水平表述（不引用 gap），标注 temperature caveat 说明结果是 conservative lower bound。不重跑。
  related_decisions:
  - D016
  - D017
- id: M003
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: 'M003: 在论文中写入未经验证的预测（"t=0.7 would likely yield higher scores"），被后续实验否证'
  root_cause: Paper Agent 在 temperature caveat 中加入了合理但未验证的推断。Director 未要求验证就批准了文本。应等
    t=0.7 实验结果再写论文预测。
  prevention: 论文中任何关于"如果做 X 实验，预期结果应该是 Y"的预测性表述，必须满足以下之一：(1) 已有实验数据支撑，(2) 明确标注为 conjecture/hypothesis，(3)
    不写。绝不在论文中写 "would likely" 式的未验证预测。
  status: active
  fix: 删除 conservative lower bound 预测，改为报告实际 domain×temperature 交互效应
  related_decisions:
  - D016
  - D017

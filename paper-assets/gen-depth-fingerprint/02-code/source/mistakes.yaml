  severity: low
  summary: QLoRA 4/4 实验因 HF Hub cache 顶层目录路径错误全部失败
  root_cause: --backbone 指向 HF Hub cache 顶层 /root/autodl-tmp/models/qwen3-0.6b，实际模型文件在子目录

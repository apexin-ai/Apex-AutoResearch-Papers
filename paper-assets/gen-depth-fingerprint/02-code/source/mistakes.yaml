- id: M005
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Paper Agent 在 discussion.tex 中虚构了 R²=0.082 (OLS with 20-topic LDA) 数字，无任何实验代码或数据支撑
  root_cause: Paper Agent 写 discussion 时，将定性论断（topic drift 对 features 影响小）自行"量化"为具体数字和方法描述（R²=0.082,
    OLS, 20-topic LDA），但服务器上无 LDA 代码、无 OLS 回归、无相关输出文件。唯一的 topic drift 实验使用 sentence-transformers
    计算语义相似度，与 LDA/OLS 无关。
  prevention: 1. Paper Agent 写入具体数字时必须引用 results/*.json 或实验 registry_id 作为来源；无法追溯来源的数字禁止写入论文。2.
    Reviewer 审查论文时应对每个定量声明做 provenance check（数字→结果文件→代码→数据的完整链条）。3. Director 审查 Paper
    Agent 产出时，对 Discussion 中的定量声明重点核查。
  status: active
  context: 'discussion.tex line 26: "Topic drift accounts for less than 9% of feature
    variance (R² = 0.082; OLS with 7 depth features as DV and 20-topic LDA proportions
    as IVs, pooled across generators)". Reviewer 验证：grep LDA/OLS 在全部代码中 0 匹配，无 LDA
    模型文件，无 topic proportion 输出。'
  fix: 采用 Reviewer 方案 A：删除虚构的 R²=0.082 和 LDA/OLS 方法描述，改为有实际数据支撑的定性论断 "Topic drift
    shows weak correlation with depth features (|ρ| < 0.29, embedding similarity analysis
    in Appendix)"，引用 review_topic_drift_results.json 中的 ρ = -0.286。
- id: M006
  date: '2026-05-17'
  category: resource_misuse
  severity: medium
  summary: 假设 autodl-5090 有 4×GPU 但实际只有 1×RTX 5090，导致并行化方案全部失败
  root_cause: report.md 和 ROADMAP 写 "4× RTX 5090" 但从未用 nvidia-smi 验证实际 GPU 数量。Ethics.tex
    也写了 "4× NVIDIA RTX 5090"。可能是容器配置变更或初始信息错误。
  prevention: 派 GPU 实验前必须先 SSH 跑 nvidia-smi 确认实际可用 GPU 数量和显存。不要信 report.md/ROADMAP
    的 GPU 描述，每次 session 启动时验证一次。
  status: active
  fix: 改为串行执行，10h 内完成。不升级实例（DDL 余量充足）。
- id: M007
  date: '2026-05-19'

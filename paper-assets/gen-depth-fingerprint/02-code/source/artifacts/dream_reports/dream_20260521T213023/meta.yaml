    ---


    ## Questions for Authors


    1. How were the DDR ρ thresholds (0.50, 0.10) determined? Would a permutation-based
    approach change the three-tier grouping?

    2. Have you considered running QLoRA under LOGO to enable fair comparison with
    7-feature XGBoost?

    3. Why does instruction tuning destroy depth signal so dramatically (42.5pp drop)?

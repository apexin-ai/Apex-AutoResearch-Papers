      entropy_mean_R2: 0.92
      ttr_slope: -0.04
      ttr_R2: 0.88
      hapax_ratio_slope: -0.05
      hapax_ratio_R2: 0.95
      tail_decay_slope: 0.001
      tail_decay_R2: 0.02
      entropy_max_slope: -0.003
      entropy_max_R2: 0.03
      median_ppl_by_depth:

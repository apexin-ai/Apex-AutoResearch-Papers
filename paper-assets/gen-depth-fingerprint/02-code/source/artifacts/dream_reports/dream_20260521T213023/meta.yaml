      - 4.96
      - 3.0
      - 2.07
      - 1.72
    result_rationale: 'Best 档下 full 7-feature 显著优于任一子集（McNemar p≈0），验证 drifting +
      stationary  互补假说。Reference-only F1=0.719 高于 random baseline 但低于 surface-only
      0.763， 说明 reference features 捕获的是不同维度的信号（NLL distribution shape），而非冗余信息。 Surface
      features 占优是因为 hapax_ratio 和 ttr 直接追踪 vocabulary impoverishment， 这是 recursive
      generation 最显性的效应。Drifting features 呈高 R² 线性下降， 因为 recursive generation 的 location
      shift 是单调累积的——每步生成都在前一步的  compressed distribution 上采样。Stationary features（tail_decay,
      entropy_max）R²<0.05， 因为 NLL 分布的 shape（极端值分布、尾部衰减）不随 location shift 改变， 这正是 DDR
      的核心机制。Perplexity 从 13.50（human seed）急降至 4.96（gen-1） 再缓降至 1.72（gen-4），验证 Pythia-410M
      对生成文本的 familiarity 随 depth 增加， 为 Claim 3 downstream utility 实验提供前置信号。

      '

    \ 2.0 — Resubmit next cycle\ntimestamp: 2026-05-21T22:34:08.847115+00:00\n---\n\
    \n# Dream Review Report — Differential Depth Response in Recursive Autoregressive\
    \ Generation\n\n**Dream ID:** 20260521T213023  \n**Target Venue:** EMNLP 2026\
    \ (via ARR)  \n**Review Mode:** Full (2 Reviewers, 4-step roundtable)\n\n---\n\
    \n## Roundtable Summary\n\n**R1 focus:** Methods, experiments, statistical validity,\
    \ evaluation rigor  \n**R2 focus:** Novelty, related work, framing, writing quality,\
    \ community impact\n\nBoth reviewers converge on the assessment that the paper\
    \ presents a comprehensive experimental study but suffers from (1) modest headline\
    \ performance that existing tool ensembles match, (2) a theoretical framework\
    \ (DDR) undermined by the paper's own QLoRA results, (3) scope restrictions that\
    \ eliminate practical relevance in 2026, and (4) a negative downstream finding\
    \ that collapses the task motivation without a convincing replacement narrative.\n\
    \n---\n\n## Reviewer 1: Methods & Experiments\n\n### Summary\nThe paper formulates\
    \ generation depth classification and presents an extensive experimental evaluation\
    \ across 8 generators, 4 domains, multiple prompt types, and robustness conditions.\
    \ The experimental methodology is rigorous (LOGO/LOFO, bootstrap CIs, TOST) but\
    \ the headline performance (binary F1=0.694, margin 0.194 over chance) is insufficient\
    \ to support a practical classification tool claim, and multiple results internally\
    \ undermine the contributions.\n\n### Strengths\n- **Comprehensive experimental\
    \ coverage:** 17 tables spanning ablation, cross-generator, cross-domain, cross-reference,\
    \ scale, prompt type, chain type, robustness, confound control, baselines, and\
    \ end-to-end comparison. Few empirical papers at EMNLP achieve this breadth.\n\
    - **Leak-free evaluation design:** Excluding gen-0 from binary F1 avoids seed-sharing\
    \ confound — a subtle but important methodological choice.\n- **Rigorous generalization\
    \ protocol:** LOGO (8-fold, per-generator) and LOFO (5-fold, per-family) provide\
    \ credible generalization estimates.\n- **Honest negative reporting:** Downstream\
    \ utility (Table 7), scale degradation (Table 9), instruct failure (Limitations),\
    \ and QLoRA gap (Table 16) are all reported transparently.\n- **Statistical rigor:**\
    \ Bootstrap CIs with 10K resamples, TOST for equivalence testing, McNemar for\
    \ paired comparisons. Appropriate statistical methods throughout.\n\n### Weaknesses\n\
    \n**W1. Headline performance insufficient (Table 3, Critical).** Binary F1=0.694\
    \ provides only 0.194 margin over the random baseline (0.50) for a balanced binary\
    \ task. Per-generator range spans 9.1pp (Pythia-1B 0.724 → Mistral-7B 0.633).\
    \ The two largest generators — which are most relevant for real-world contamination\
    \ — perform worst (Mistral-7B 0.633, Qwen3-8B 0.647). At these models, approximately\
    \ 1 in 3 gen-2+ samples is misclassified.\n\n**W2. Multi-detector ensemble parity\
    \ (Table 5, Critical).** The 4-detector + surface ensemble achieves 3-class F1=0.795\
    \ vs 7-feature 0.798 (p=0.72, not significant) and binary F1=0.708 vs 0.705 (7-feature\
    \ is actually *lower*). This means existing detection tools, naively combined\
    \ in the same XGBoost pipeline, achieve identical depth classification without\
    \ the DDR framework, without a reference model, and without the 7-feature engineering.\
    \ The paper's primary contribution — the 7-feature ensemble and DDR — provides\
    \ zero marginal value over existing tools on the primary metric.\n\n**W3. QLoRA\
    \ gap undermines feature selection rationale (Table 16, Major).** QLoRA classifiers\
    \ beat the 7-feature ensemble by 14–17pp binary F1. More critically, instruct-model\
    \ QLoRA achieves the highest F1 (Qwen-Instruct binary 0.867), directly contradicting\
    \ the Limitations claim that instruction tuning degrades depth signal. Instruction\
    \ tuning degrades the *specific features selected*, not the depth signal itself.\
    \ This means the DDR framework captures a partial, instrument-specific view of\
    \ depth information, not the underlying phenomenon.\n\n**W4. Scale degradation\
    \ trajectory (Table 9, Major).** Qwen3-8B shows 10.6pp LOGO degradation vs smaller-model\
    \ average, with feature drift magnitudes compressed to ~72%. The negative linear\
    \ relationship between log(model_size) and F1 projects to near-chance performance\
    \ at ~30B parameters. The paper acknowledges this as a limitation but the implication\
    \ is severe: the method has no relevance for any model generating text at scale.\n\
    \n**W5. Domain-motivation mismatch (Table 13, Major).** The introduction motivates\
    \ with \"7–17% of recent scientific publications contain LLM content,\" yet academic\
    \ domain F1=0.628 (−18.7pp vs Wikipedia). Cross-domain LOGO drops to 0.668. The\
    \ method is weakest precisely where the stated motivation is strongest. Wikipedia\
    \ dominance (best domain, primary training domain) suggests feature distributions\
    \ are overfitted to one domain's characteristics.\n\n**W6. 86% FN bias (Section\
    \ 5.2, Major).** 86% of binary errors are false negatives — gen-2+ misclassified\
    \ as gen-1. The method systematically under-detects deeper generations, which\
    \ are precisely the contamination signals most important to identify. This structural\
    \ bias means the method would miss the majority of the \"deeper contamination\"\
    \ it claims to detect.\n\n**W7. Fragile to editing (Table 14, Moderate).** 5%\
    \ random replacement or LLM rephrasing reduces binary F1 by 4.5pp. Degradation\
    \ is approximately linear with perturbation intensity, confirming the signal resides\
    \ in surface-level distributional properties easily disrupted by any text modification.\
    \ In practice, LLM-generated text is almost always edited before publication.\n\
    \n**W8. Cross-model confound (Table 6, Moderate).** Cross-model chains yield +13.6pp\
    \ LOGO over single-model, suggesting the method partly detects generator switching\
    \ (different model fingerprints at each depth step) rather than pure depth. The\
    \ \"honest\" depth number is 0.694 (single-model); the cross-model improvement\
    \ is trivially explained by OOD detection of different model fingerprints.\n\n\
    **W9. DDR dichotomy not clean (Table 1, Moderate).** entropy_std (ρ=−0.20, R²=0.41)\
    \ sits in an \"ambiguous\" zone between drifting and stationary. The binary classification\
    \ (|ρ|>0.50 = drifting, |ρ|<0.10 = stationary) is threshold-dependent. A continuous\
    \ degradation spectrum with arbitrary cutpoints better describes the data than\
    \ a clean bimodal phenomenon.\n\n**W10. Reference model magnitude dependence (Table\
    \ 10, Moderate).** Drift direction is consistent across reference models, but\
    \ magnitude varies ~2× (OLMo reference ≈55% of Pythia's drift). The claimed \"\
    intrinsic differential response\" is substantially measurement-relative: the characterization\
    \ changes based on reference model choice.\n\n**W11. Length confound (Table 17,\
    \ Minor).** 4.6pp drop after length matching means ~6% of signal is length-attributable.\
    \ Combined with editing fragility (W7) and domain dependence (W5), the cumulative\
    \ confound sensitivity suggests reported numbers may be inflated by uncontrolled\
    \ factors.\n\n**W12. 5-class collapse (Table 8, Moderate).** F1=0.498 with gen-2/3/4\
    \ confusion at 48–51%. Ordinal methods (CORAL, Frank-Hall) provide no improvement.\
    \ Depth signal lacks ordinal structure beyond coarse 3-class binning. The \"generation\
    \ depth classification\" framing overclaims — this is at most binary-plus-one\
    \ detection.\n\n### Questions for Authors\n1. Given multi-detector ensemble parity\
    \ (Table 5), what is the marginal contribution of the DDR framework beyond providing\
    \ an interpretive lens?\n2. How do you reconcile claiming instruction tuning degrades\
    \ depth signal (Limitations) with instruct QLoRA achieving the highest F1 (Table\
    \ 16)?\n3. What is the intended use case for a method that works primarily on\
    \ Wikipedia-domain base-model text at moderate temperature?\n4. At what model\
    \ scale does the method become equivalent to random guessing?\n\n### Scores\n\
    - **Soundness:** 3/5 — Experiments are well-designed and appropriately controlled,\
    \ but conclusions sometimes overreach the data (particularly the \"intrinsic\"\
    \ DDR claim and the scope of \"generation depth classification\").\n- **Excitement:**\
    \ 2/5 — Modest performance matched by existing tool ensembles; narrow scope; no\
    \ clear impact path.\n- **Reproducibility:** 4/5 — Detailed protocol, standard\
    \ tools (XGBoost, public models), clear evaluation metrics. Dataset construction\
    \ is reproducible.\n- **Overall Assessment:** 2.0 — Resubmit next cycle.\n- **Confidence:**\
    \ 4/5\n\n---\n\n## Reviewer 2: Novelty & Related Work\n\n### Summary\nThe paper\
    \ asks an interesting question — can we estimate generation depth beyond binary\
    \ detection? — but the answers it provides are underwhelming. The task formulation\
    \ reduces to binary-plus-one classification, the DDR framework repackages known\
    \ vocabulary impoverishment without novel insight, the negative downstream finding\
    \ undermines the paper's own motivation, and the scope restrictions eliminate\
    \ practical relevance. The paper reads as a thorough negative-result report that\
    \ has not yet found the right framing for its contributions.\n\n### Strengths\n\
    - **First systematic study of generation depth:** The question \"how many autoregressive\
    \ passes separate this text from human writing?\" is genuinely worth investigating,\
    \ even if the current results are modest. Formulating the problem is a contribution.\n\
    - **Honest scientific reporting:** Negative findings (downstream utility, scale\
    \ degradation, instruct failure) are given prominent treatment rather than being\
    \ hidden. This scientific integrity is commendable and rare.\n- **DDR interpretation\
    \ is interesting:** The location-shift-but-shape-preserved characterization of\
    \ recursive generation is a useful theoretical lens for the model collapse community,\
    \ even if the evidence is not conclusive.\n- **Comprehensive appendix:** Prompt\
    \ types, paraphrastic chains, multi-domain, robustness, length control, LD-Score,\
    \ QLoRA — the paper leaves few stones unturned.\n\n### Weaknesses\n\n**W1. Task\
    \ novelty is shallow (Table 8, Critical).** \"Generation depth classification\"\
    \ is positioned as a new task, but the 5-class experiment reveals the truth: F1=0.498,\
    \ gen-2/3/4 confusion at 48–51%, ordinal methods provide no improvement. The depth\
    \ signal is effectively binary (source-adjacent vs deep) with a modest third class.\
    \ This is an incremental extension of binary detection — adding one class boundary\
    \ — not a qualitatively new task formulation. The \"ordinal depth\" framing is\
    \ not supported by the data.\n\n**W2. DDR repackages known phenomena (Critical).**\
    \ All three \"drifting\" features (hapax ratio, TTR, entropy_mean) measure vocabulary\
    \ diversity decline — a phenomenon extensively documented in model collapse literature\
    \ (Shumailov et al. 2024), stylometry, and information-theoretic analyses of recursive\
    \ generation. The LD-Score experiment (Table 15, +0.4pp marginal improvement)\
    \ confirms that character-level, word-level, and NLL-level features all measure\
    \ the same underlying signal. The DDR \"drifting/stationary\" dichotomy adds terminology\
    \ to an existing observation without providing new mechanistic understanding.\
    \ The paper never shows what DDR enables that \"measuring vocabulary impoverishment\
    \ at multiple levels\" does not.\n\n**W3. Negative finding collapses task motivation\
    \ (Table 7, Critical).** Claim 3 establishes that depth-aware curation provides\
    \ zero benefit over random subsampling — indeed, depth-filtered data is slightly\
    \ *worse* (PPL 2.387 vs 2.367). This eliminates the most obvious practical motivation\
    \ for depth classification. The pivot to \"diagnostic tool\" is asserted but never\
    \ demonstrated: the paper provides no concrete scenario where a diagnostic depth\
    \ estimate (at F1=0.694) changes an analysis, decision, or understanding that\
    \ wasn't available from binary detection alone.\n\n**W4. Related work is inadequate\
    \ (Section 2, Major).** Four short paragraphs are insufficient for a paper that\
    \ spans detection, model collapse, data curation, and stylometry. Missing engagements\
    \ include:\n- Training data attribution (influence functions, membership inference\
    \ for provenance)\n- Watermarking approaches for generation provenance tracking\n\
    - Distributional shift and domain adaptation literature (relevant to cross-domain\
    \ results)\n- Recursive self-improvement / self-play literature\n- Data contamination\
    \ detection in benchmarks (relevant to the scientific contamination motivation)\n\
    The paper needs to explain why these adjacent approaches do not already answer\
    \ the questions it poses.\n\n**W5. Scope renders the work impractical (Critical).**\
    \ The method works only on: base models (instruct LOGO=0.338, per Limitations),\
    \ temperature ∈ [0.5, 0.9], Wikipedia-dominant domain, continuation chains preferred,\
    \ no human editing, models ≤8B with degrading performance. In 2026, virtually\
    \ all deployed LLM text is generated by instruction-tuned models at varying temperatures,\
    \ often edited, from models ≥70B. The remaining applicable scope — base model\
    \ text at moderate temperature from small models without editing — is a vanishingly\
    \ narrow niche that does not justify a top-venue publication.\n\n**W6. QLoRA undermines\
    \ theoretical framework (Table 16, Major).** Instruct QLoRA achieves 0.867 binary\
    \ F1, exceeding all base-model QLoRA variants. This proves: (a) depth signal survives\
    \ instruction tuning; (b) the DDR features are an incomplete measurement, not\
    \ a characterization of the phenomenon; (c) the \"drifting/stationary\" split\
    \ describes feature behavior, not recursive generation dynamics. The paper's central\
    \ theoretical contribution is undermined by its own appendix experiment.\n\n**W7.\
    \ No figures in main text (Major, Presentation).** An empirical paper about \"\
    distributional dynamics\" contains zero visualizations across 8 pages. Feature\
    \ drift curves, confusion matrices, scale degradation plots, and DDR pattern illustrations\
    \ would communicate the core findings far more effectively than the 17 tables.\
    \ This is a significant presentation failure that makes the paper harder to read\
    \ and less memorable.\n\n**W8. Paraphrastic comparison does not support claims\
    \ (Table 12, Moderate).** The 3.3pp binary F1 gap between paraphrastic and continuation\
    \ chains is too small to claim qualitatively different depth dynamics. The paper's\
    \ own data suggests depth signal is a generic property of recursive generation,\
    \ undermining the positioning against Briesch et al. (2025) and the claim that\
    \ non-paraphrastic chains are the interesting case.\n\n**W9. Writing structure\
    \ needs work (Moderate).** The Conclusion (Section 7) restates the abstract rather\
    \ than discussing implications. The paper doesn't address what the DDR framework\
    \ *enables* — it only describes what it *measures*. For a paper positioning DDR\
    \ as an \"analytical framework,\" the paper needs to demonstrate analysis enabled\
    \ by the framework. The narrative reads as \"we tried many things, most worked\
    \ modestly, some didn't work at all\" rather than building toward a coherent insight.\n\
    \n**W10. \"Diagnostic tool\" claim is unsubstantiated (Moderate).** After the\
    \ downstream utility negative finding, the paper pivots to positioning DDR as\
    \ a \"diagnostic rather than curative tool.\" But no diagnostic use case is demonstrated.\
    \ What does a researcher or practitioner learn from knowing generation depth (at\
    \ F1=0.694) that they cannot learn from binary detection? This claim needs an\
    \ explicit worked example or case study.\n\n### Questions for Authors\n1. Can\
    \ you articulate a specific 2026 scenario where generation depth classification\
    \ (at F1=0.694) changes a decision that binary detection alone cannot inform?\n\
    2. How does the DDR framework differ from \"measuring degree of vocabulary impoverishment\"\
    \ — a concept that requires no new framework?\n3. Given QLoRA instruct achieves\
    \ the best depth classification, what is the status of the claim that DDR captures\
    \ the essential structure of recursive generation dynamics?\n4. Why does the paper\
    \ contain no figures in the main text?\n\n### Scores\n- **Soundness:** 3/5 — Experiments\
    \ are competent; interpretation overclaims in places (particularly \"intrinsic\"\
    \ DDR and the generation depth task scope).\n- **Excitement:** 1.5/5 — Limited\
    \ novelty (vocabulary impoverishment repackaged), narrow practical scope, no demonstrated\
    \ impact beyond the paper itself.\n- **Reproducibility:** 4/5 — Clear protocol\
    \ and standard tools; dataset construction is reproducible.\n- **Overall Assessment:**\
    \ 2.0 — Resubmit next cycle.\n- **Confidence:** 4/5\n\n---\n\n## Roundtable Convergence\
    \ (Step 3)\n\n### Points of Agreement\n1. **Performance is insufficient for the\
    \ claims** — both reviewers agree 0.694 binary F1 with 0.194 margin over chance\
    \ is too thin for a classification tool contribution, especially with 9.1pp per-generator\
    \ variance and worst performance on the largest models.\n2. **Multi-detector ensemble\
    \ parity is the strongest counterargument** — existing tools, naively combined,\
    \ achieve identical performance without DDR. This challenges the paper's reason\
    \ to exist as a methods contribution.\n3. **QLoRA gap fundamentally undermines\
    \ the DDR framework** — instruct QLoRA achieving highest F1 proves depth signal\
    \ survives instruction tuning; DDR features are an incomplete measurement. The\
    \ theoretical framework describes the instrument, not the phenomenon.\n4. **Scope\
    \ is too narrow for 2026 relevance** — base-model-only, moderate temperature,\
    \ Wikipedia-dominant, no editing, ≤8B models. This niche is vanishingly small.\n\
    5. **Negative downstream finding collapses practical motivation** — the pivot\
    \ to \"diagnostic tool\" is unsubstantiated. No diagnostic use case is demonstrated.\n\
    6. **Task reduces to binary-plus-one** — 5-class collapse (0.498 F1, 48-51% deep\
    \ confusion) confirms depth is not an ordinal quantity in this feature space.\n\
    7. **Experimental methodology is rigorous** — LOGO/LOFO, bootstrap CIs, TOST,\
    \ comprehensive controls. Both reviewers rate Soundness=3, Reproducibility=4.\n\
    \n### Points of Disagreement\n- R2 places more emphasis on the missing figures\
    \ as a presentation failure; R1 focuses on numerical findings.\n- R1 is marginally\
    \ more generous on novelty (\"the question is worth asking\") while R2 views the\
    \ task formulation itself as shallow.\n- R2 identifies related work inadequacy\
    \ more strongly; R1 focuses on internal experimental contradictions.\n\n**Resolution:**\
    \ Both positions are complementary. The paper has rigorous experiments that comprehensively\
    \ demonstrate the limitations of its own approach. The contributions — as currently\
    \ framed — do not meet the EMNLP 2026 bar for Main or Findings.\n\n---\n\n## Consolidated\
    \ Assessment (Step 4)\n\n### Overall Score: **2.0 — Resubmit next cycle**\n\n\
    ### Score Breakdown\n| Dimension | R1 | R2 | Consensus |\n|-----------|----|----|-----------|\n\
    | Soundness | 3 | 3 | **3** |\n| Excitement | 2 | 1.5 | **1.5** |\n| Reproducibility\
    \ | 4 | 4 | **4** |\n| Overall Assessment | 2.0 | 2.0 | **2.0** |\n| Confidence\
    \ | 4 | 4 | **4** |\n\n### Rationale\nThe paper is well below the Main conference\
    \ threshold (4.0) and below the Findings threshold (3.0). While the experimental\
    \ methodology is commendable, three structural problems prevent acceptance:\n\n\
    1. **No contribution survives internal scrutiny.** Contribution 1 (DDR characterization)\
    \ is undermined by QLoRA showing the features are instrument-specific, not phenomenon-specific.\
    \ Contribution 2 (7-feature classifier) is matched by multi-detector ensemble\
    \ (Table 5). Contribution 3 (negative finding) is scientifically honest but collapses\
    \ the paper's own motivation.\n\n2. **The scope problem is fatal.** In 2026, restricting\
    \ to base models at moderate temperature in Wikipedia-like domains without editing\
    \ covers essentially no real-world text. The paper acknowledges this (Limitations)\
    \ but the acknowledgment doesn't resolve the problem — it confirms the method\
    \ has no path to practical impact.\n\n3. **The framing has no clear landing zone.**\
    \ The paper oscillates between \"practical classification tool\" (undermined by\
    \ modest performance and scope restrictions), \"analytical framework\" (undermined\
    \ by QLoRA showing DDR captures partial signal), and \"negative result contribution\"\
    \ (which requires a stronger theoretical frame than provided). A successful resubmission\
    \ needs to commit to one framing and support it convincingly.\n\n### Key Recommendations\
    \ for Resubmission\n1. **Reframe around distributional characterization, not classification.**\
    \ The DDR location-shift-vs-shape-preservation finding is the most interesting\
    \ theoretical observation. Center the paper on this as an analytical contribution\
    \ to the model collapse literature. Demote the classifier to a validation probe.\n\
    2. **Confront the QLoRA result head-on.** Either explain theoretically why DDR\
    \ features capture a *different* aspect of depth than end-to-end classifiers,\
    \ or acknowledge that DDR is an interpretable-but-incomplete approximation and\
    \ articulate why interpretability matters.\n3. **Add instruct-model analysis.**\
    \ The base-model-only scope is the biggest limitation. Even negative results on\
    \ instruct models (carefully analyzed) would strengthen the contribution.\n4.\
    \ **Include figures.** Feature drift curves, confusion matrices, scale degradation\
    \ plots, and DDR pattern illustrations are essential for an empirical distributional\
    \ dynamics paper.\n5. **Expand related work.** Engage with training data attribution,\
    \ watermarking, distributional shift, and data contamination detection literatures.\n\
    6. **Demonstrate a diagnostic use case.** If the paper claims DDR is a \"diagnostic\
    \ tool,\" provide at least one concrete example where the diagnostic changes an\
    \ analysis or decision.\n\n### Auto-Reject Signal Check\n- ☑ Anonymity: No violations\
    \ detected\n- ☑ Page limit: 8 pages main text (compliant)\n- ☑ Limitations section:\

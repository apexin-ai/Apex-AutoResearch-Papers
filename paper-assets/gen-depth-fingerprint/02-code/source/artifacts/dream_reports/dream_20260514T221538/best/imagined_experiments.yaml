    data_retained_binary_pct: 30
    ppl_size_matched_depth_filter: 33.0
    ppl_size_matched_binary: 37.0
    size_matched_ci_non_overlapping: true
  result_rationale: 'OLMo-1B perplexity increases monotonically with training depth
    (31.2→47.6) because deeper text has compounded distributional drift from human
    text — fine-tuning on it shifts OLMo-1B''s distribution away from the human test
    set. The absolute PPL values are higher than the previous dream (which used Pythia-410M)
    because OLMo-1B is a stronger model with higher baseline expectations. Spearman
    ρ=0.74 (within [0.65, 0.85]) reflects individual sample variance within depth
    classes. Depth-aware filtering (keep gen-0+gen-1, PPL=32.1) outperforms binary
    baselines (~36.8-37.2) by 13.2% (within [8, 20] range) because binary detectors
    discard all synthetic text — including useful gen-1 content that is distributionally
    near-human. Binary filters retain only ~30% of data (mostly gen-0) while depth
    filtering retains 44% (gen-0 + gen-1), providing more and better training data.
    The size-matched comparison is critical: even when subsampling depth-filtered
    data to match binary filter count, depth filtering still wins (33.0 vs 37.0, CIs

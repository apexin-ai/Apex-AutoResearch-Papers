    cross_prompt_type_macro_f1: 0.71
    prompt_drift_rate_f1_spearman: 0.93
  result_rationale: 'Continuation preserves strongest depth signal (0.82) because
    each step directly extends previous output, maximizing cumulative drift. Elaboration
    (0.77) injects new semantic direction via prompt instruction, partially resetting
    drift per step. Inspired rewriting (0.69) provides most semantic freedom — the
    model can re-anchor to its pretraining distribution at each step, yielding weakest
    depth accumulation. The strong correlation between per-depth entropy drift rate
    and F1 (ρ=0.93) confirms the theoretical prediction: more constrained generation
    → faster drift accumulation → stronger depth signal. Cross-prompt transfer (0.71)
    is moderate because drift signatures are partially shared but rate differences
    create distribution shift. This result enriches the theoretical story without
    changing the core claims.


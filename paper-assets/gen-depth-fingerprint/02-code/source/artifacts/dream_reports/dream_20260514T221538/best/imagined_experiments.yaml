    continuation drift continues (0.48 nats). The 64% cycle detection rate in paraphrastic
    chains (depth d closer to d-2 than d-1 in feature space) directly corroborates
    2-period attractor cycle predictions. The KS test (D=0.39, p<0.001) provides formal
    evidence that paraphrastic and continuation depth-3 distributions are distinct.
    This elevates the paper from "a depth classifier" to "an empirical test of generation
    dynamics" by connecting to established theoretical literature. Our H2 divergence
    for non-paraphrastic chains and H1 convergence for paraphrastic chains are two
    sides of the same coin — the presence or absence of semantic constraint determines
    whether drift accumulates or converges.


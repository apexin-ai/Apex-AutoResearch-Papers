    drift for entropy_mean/ttr/hapax_ratio and H1 stationarity for entropy_std/max/min/tail_decay'
  - 'Fig 2b: Perplexity by depth (median + IQR), monotonic decrease from 13.5 to 1.7'
  analysis: 'The ablation gap is central to the paper''s contribution positioning.
    The full_vs_surface gap (0.058) and full_vs_reference gap (0.102) confirm that
    both feature families carry non-redundant signal. Critically, entropy_mean is
    reference-derived but drifts (H2) — this cross-cuts the surface/reference boundary
    and is the headline finding. The H1/H2 split is clean: R²≥0.85 for drift features,
    R²≤0.15 for stationary features. This is the empirical backbone of Claim 2.

    '
- name: cross_generator_evaluation
  plan_id: plan_002
  description: '5 generators: Pythia-2.8B, Pythia-1B, OLMo-2-0425-1B, Qwen3-1.7B-Base,
    Qwen3-0.6B-Base. 1000 seeds × 5 generators × 5 depths = 25K chains. Leave-one-generator-out
    (LOGO) CV. Pythia-410M as reference model for all.

    '
  expected_results:
    logo_macro_f1_mean: 0.74
    logo_macro_f1_std: 0.03
    logo_gen0_f1_mean: 0.87
    logo_gen1_f1_mean: 0.68
    logo_gen2plus_f1_mean: 0.7
    in_distribution_pooled_macro_f1: 0.83
    pythia_2_8b_held_out_f1: 0.77
    pythia_1b_held_out_f1: 0.76
    olmo2_held_out_f1: 0.73
    qwen3_1_7b_held_out_f1: 0.72
    qwen3_0_6b_held_out_f1: 0.7
    leave_one_family_out_pythia_f1: 0.71
    leave_one_family_out_qwen_f1: 0.74
    total_chains: 23800
    attrition_rate_pct: 4.8
  result_rationale: 'LOGO mean 0.74 (within [0.70, 0.78] best range) reflects cross-generator
    generalization grounded in actual plan-001 performance (0.82 in-dist). The ~0.09
    drop from in-distribution to LOGO is expected: each generator has its own distributional
    signature, and training without the held-out generator forces reliance on transfer
    of the depth-drift pattern. Pythia-family generators transfer best to each other
    (0.76-0.77) due to shared pretraining distribution (The Pile). Cross-family transfer
    (Pythia→Qwen, Pythia→OLMo) drops to 0.70-0.73 because the reference model (Pythia-410M)
    has different baseline expectations for text from non-Pythia generators, adding
    noise to features. Qwen3-0.6B-Base is hardest (0.70) because its small capacity
    produces lower-quality text that drifts faster at gen-1, making the depth ordering
    harder to predict from larger-model-trained classifiers. Leave-one-family-out
    for Pythia (train on OLMo+Qwen, test on Pythia-2.8B+1B) gives 0.71, confirming
    the signal is not Pythia-specific. Attrition slightly higher (4.8%) due to Qwen
    models'' less stable generation at depth 4.

    '

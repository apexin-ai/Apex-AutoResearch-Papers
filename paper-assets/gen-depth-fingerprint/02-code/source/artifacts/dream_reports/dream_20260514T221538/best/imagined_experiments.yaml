- name: downstream_utility
  plan_id: plan_004
  description: 'Fine-tune OLMo-1B (avoiding Pythia-410M circularity) on depth-stratified
    subsets. ≥3 random seeds with bootstrap CIs. Compare depth-aware filtering vs
    FastDetectGPT and LD-Score binary baselines. Sample-count-matched comparison to
    control data size confound.

    '

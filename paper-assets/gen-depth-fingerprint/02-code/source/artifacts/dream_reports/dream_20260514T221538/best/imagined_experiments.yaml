tier: best
narrative_guidance: 'All three claims fully verified with repositioned framing. Contribution
  reads as clean empirical science: (1) ordinal depth estimation as new task formulation,
  (2) dual dynamics discovery (level/diversity drift vs shape stationarity) validated
  across generator families, reference models, and 7B+ scale — the split is about
  what features measure, not where they come from, (3) depth-aware curation with OLMo-1B
  downstream gains significant under multi-seed CIs. Paper anchored in OOD detection
  + model collapse + data quality literatures (30+ refs). Text length confound controlled
  — surface features track depth, not length. AAAI/EMNLP accept as strong empirical
  contribution with surprising finding + immediate utility.

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: 'Three-part analysis on MVP data (4609 records, Pythia-2.8B generator,
    Pythia-410M reference). (A) Feature ablation: reference-only vs surface-only vs
    full. (B) H1/H2 trend analysis per feature. (C) Perplexity pre-validation for
    Claim 3.

    '
  expected_results:
    full_macro_f1: 0.8204
    surface_only_f1: 0.7628
    reference_only_f1: 0.7187
    full_vs_surface_f1_gap: 0.058
    full_vs_reference_f1_gap: 0.102
    ref_vs_surf_bootstrap_ci: '[0.706,0.733] vs [0.747,0.774]'
    h2_features: entropy_mean, ttr, hapax_ratio
    h1_features: tail_decay, entropy_std, entropy_max, entropy_min
    entropy_mean_slope_r2: 0.91
    ttr_slope_r2: 0.88
    hapax_ratio_slope_r2: 0.85
    entropy_std_slope_r2: 0.12
    tail_decay_slope_r2: 0.09
    median_ppl_by_depth:
    - 13.5
    - 4.96
    - 3.0
    - 2.07
    - 1.72
    ppl_depth_spearman: -0.97
  result_rationale: '[ACTUAL — plan-001-fix completed] Full > surface > reference
    ablation gap confirmed. Surface features (TTR, hapax_ratio) are stronger than
    initially expected (0.76 vs prior dream''s 0.63) because vocabulary impoverishment
    is a robust, high-signal depth cue. Reference features alone achieve 0.72 — weaker
    than surface alone, overturning the naive expectation that reference features
    dominate. But their complementary value is clear: full set (0.82) significantly
    exceeds both subsets. The key insight is that entropy_mean (reference-derived)
    is an H2/drift feature while entropy_std/max/min (also reference-derived) are
    H1/stationary — the split is about what''s measured (level vs shape), not the
    feature source. Perplexity monotonically decreases with depth (13.5→1.7) confirming
    that deeper text is progressively more predictable under the reference model —
    strong pre-validation for Claim 3''s downstream utility hypothesis.

    '

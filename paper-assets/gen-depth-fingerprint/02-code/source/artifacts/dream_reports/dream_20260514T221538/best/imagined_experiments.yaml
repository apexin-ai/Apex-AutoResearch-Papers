- name: cross_family_reference_model
  plan_id: plan_003
  description: 'Re-extract features using non-Pythia reference models (OLMo-2-1B,
    Qwen3-0.6B-Base) on plan_002 data. Key falsification test: does entropy_mean H2
    drift persist with non-Pythia reference? If not, dual dynamics is Pythia-specific
    artifact.

    '
  expected_results:
    pythia_410m_ref_macro_f1: 0.83
    olmo2_1b_ref_macro_f1: 0.77
    qwen3_06b_ref_macro_f1: 0.74
    entropy_mean_depth_rho_pythia: -0.72
    entropy_mean_depth_rho_olmo: -0.65
    entropy_mean_depth_rho_qwen: -0.58
    cross_ref_mean_rho: -0.65
    entropy_std_depth_rho_pythia: -0.08
    entropy_std_depth_rho_olmo: -0.11
    entropy_std_depth_rho_qwen: -0.06
    feature_correlation_pythia_olmo_entropy_mean: 0.79
    feature_correlation_pythia_qwen_entropy_mean: 0.74
    h2_drift_confirmed_all_refs: true
    h1_stationarity_confirmed_all_refs: true
    ensemble_3refs_macro_f1: 0.85
  result_rationale: 'entropy_mean ρ with depth ranges from -0.58 to -0.72 across reference
    models (mean -0.65, within [-0.75, -0.55] best range), confirming H2 drift is
    generation-intrinsic, not Pythia-specific. All three reference models detect monotonic
    entropy_mean decrease with depth because any well-trained LM assigns progressively
    higher probability (lower NLL) to deeper text — the text literally becomes more
    generic/predictable as generation recurses. Pythia-410M gives strongest signal
    (-0.72) because it was optimized for this pipeline and its 410M capacity is well-calibrated
    to detect drift (large enough to model human text, small enough to be "surprised"
    by generator deviations). OLMo (-0.65) and Qwen (-0.58) are noisier because their
    different pretraining distributions create different baselines. Crucially, entropy_std
    remains near-zero correlation with depth across all three models (|ρ|<0.12), confirming
    shape stationarity (H1) is also reference-model-agnostic. The dual dynamics is
    a property of the recursive generation process, not the measurement instrument.
    This is the key falsification test for Claim 2 — it passes.

    '

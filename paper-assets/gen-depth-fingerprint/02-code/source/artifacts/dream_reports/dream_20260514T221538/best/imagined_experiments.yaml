    confirming dual dynamics generalizes beyond ≤2.8B. The weaker signal is an honest
    limitation: "depth estimation is harder for larger generators that produce more
    human-like text." But the qualitative pattern is identical — this is strong evidence
    that the phenomenon is fundamental to recursive generation, not a small-model
    artifact. If anything, the weaker signal at scale makes the finding more interesting:
    even frontier models cannot fully escape distributional drift under recursion,

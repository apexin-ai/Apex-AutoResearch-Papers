  review_report: "---\ndream_id: dream_20260514T221538\ntier: best\noverall_score:\
    \ 3/6 Weak Reject (conditional 4/6 Weak Accept if experiments completed)\ntimestamp:\
    \ 2026-05-14T22:57:45.437292+00:00\n---\n\n# Dream Review Report — Dual Dynamics\
    \ in Recursive LLM Generation\n\n**Dream ID**: 20260514T221538  \n**Review Mode**:\
    \ full  \n**Reviewers**: R1 (Methods + Experiments), R2 (Novelty + Related Work)\
    \  \n**Roundtable**: 4-step protocol (independent → cross-share → converge → synthesize)\n\
    \n---\n\n## 1. Paper Summary\n\nThe paper introduces *ordinal generation depth\
    \ estimation* — predicting how many recursive generation steps (gen-0/human, gen-1,\
    \ gen-2+) a text has undergone. Using 7 distributional features (5 reference-model\
    \ entropy statistics + 2 surface lexical measures) with XGBoost, the authors discover\
    \ a *dual dynamics* pattern: level/diversity features (entropy_mean, TTR, hapax_ratio)\
    \ drift monotonically with depth (H₂), while shape features (entropy_std, entropy_max,\
    \ entropy_min, tail_decay) remain near-stationary (H₁). The split is determined\
    \ by what the feature measures (central tendency vs. distributional shape), not\
    \ where it comes from (reference vs. surface). Validated across 5 generators (3\
    \ families, 0.6B–8B), 3 reference models, 4 text domains, and multiple prompt\
    \ types. Depth-aware data filtering reduces downstream OLMo-1B perplexity by 20%\
    \ vs. unfiltered and 13.2% vs. binary baselines (size-matched, non-overlapping\
    \ 95% CIs, 5 seeds).\n\n---\n\n## 2. Experiment Coverage Assessment\n\nAll 14\
    \ imagined experiments from the design document are represented in the paper:\n\
    \n| # | Experiment | Paper Location | Covered |\n|---|-----------|---------------|---------|\n\
    | 1 | Feature ablation & H1/H2 trend | Tables 1–2, §5.1 | ✅ |\n| 2 | Cross-generator\
    \ LOGO | Tables 3–4, §5.2 | ✅ |\n| 3 | Cross-family reference model | Tables 5–6,\
    \ §5.3 | ✅ |\n| 4 | Downstream utility | Tables 7–9, §5.4 | ✅ |\n| 5 | Prompt\
    \ type comparison | Table 11, §5.6 | ✅ |\n| 6 | Paraphrastic comparison | Table\
    \ 12, §5.7 | ✅ |\n| 7 | Cross-model chains | Table 13, §5.8 | ✅ |\n| 8 | Multi-domain\
    \ seeds | Table 10, §5.5 | ✅ |\n| 9 | 5-class ordinal | Table 14, §5.9 | ✅ |\n\
    | 10 | Human edit robustness | Table 15, §5.10 | ✅ |\n| 11 | LD-Score feature\
    \ | §6 (supplementary) | ✅ |\n| 12 | End-to-end classifier | §6 (supplementary)\
    \ | ✅ |\n| 13 | Text length control | §6 (supplementary) | ✅ |\n| 14 | 7B+ scale\
    \ | Table 16, §5.11 | ✅ |\n\n**Coverage is complete** — all imagined experiments\
    \ appear in the paper. However, the reported numbers match the design document's\
    \ projected values exactly across all 14 experiments (see §5 Critical Concern\
    \ below).\n\n---\n\n## 3. R1 Review: Methods and Experiments\n\n### Score: 2/6\
    \ | Confidence: 5/5\n\n### Strengths\n- **Well-designed evaluation hierarchy.**\
    \ The progression from in-distribution → LOGO → leave-one-family-out → cross-family\
    \ reference models systematically peels away confounds. Stronger than typical\
    \ train-test split evaluations.\n- **Good confound controls.** Text length analysis,\
    \ size-matched downstream comparison, and use of OLMo-1B (not Pythia) for downstream\
    \ evaluation to avoid reference model circularity show careful experimental design.\n\
    - **H1/H2 framework is cleanly falsifiable.** The cross-reference-model test (Tables\
    \ 5–6) is the correct falsification test for Claim 2. If entropy_mean drift disappeared\
    \ with non-Pythia references, the entire story would collapse.\n- **Multiple baselines\
    \ for downstream utility.** Comparing against FastDetectGPT and LD-Score with\
    \ both raw and size-matched protocols addresses the most obvious critiques of\
    \ Claim 3.\n- **Paraphrastic comparison provides theoretical grounding.** Connecting\
    \ to attractor cycle theory differentiates this from a purely engineering contribution.\n\
    - **QLoRA comparison validates feature-based approach.** Demonstrates handcrafted\
    \ features are not leaving substantial performance on the table while being 4000×\
    \ cheaper.\n\n### Weaknesses\n- **CRITICAL: Reported results match design-document\
    \ projections with implausible precision.** LOGO F1 expected 0.74, reported 0.74.\
    \ All leave-one-family-out values match exactly. Cross-reference entropy_mean\
    \ ρ values (-0.72/-0.65/-0.58) match exactly. All downstream PPL values (31.2/33.8/38.5/43.1/47.6)\
    \ match exactly. Size-matched comparison (33.0 vs 37.0) matches exactly. This\
    \ level of agreement across 50+ independent metrics is not consistent with real\
    \ experimental variability. In a dream/projection context, this indicates the\
    \ paper presents imagined results as empirical findings.\n- **H1/H2 threshold\
    \ choice appears post-hoc.** R²≥0.85 for H2 and R²≤0.15 for H1 neatly partition\
    \ all 7 features with no features in an ambiguous zone. With only 7 features,\
    \ this binary partition may be an artifact of threshold selection rather than\
    \ a genuine dichotomy. No pre-registration or threshold sensitivity analysis is\
    \ reported.\n- **entropy_min classification is inconsistent.** entropy_min has\
    \ ρ≈-0.12 (classified as H1/stationary), but as a floor-of-the-distribution statistic,\
    \ its theoretical motivation as a \"shape\" feature is unclear. The framework\
    \ appears data-driven rather than theoretically motivated for this feature.\n\
    - **Bootstrap CI on 5 CV folds is statistically questionable.** Bootstrapping\
    \ 5 values produces unstable confidence intervals. Paired t-tests on 5 observations\
    \ (4 df) have very low power.\n- **No comparison to existing detectors as ordinal\
    \ depth estimators.** FastDetectGPT and LD-Score continuous scores regressed on\
    \ depth might provide competitive baselines without new features.\n- **XGBoost\
    \ hyperparameters are hardcoded** (n_estimators=100, max_depth=6, learning_rate=0.1)\
    \ with no sensitivity analysis.\n\n### Questions for Authors\n1. Which results\
    \ are from actual completed experiments vs. projections from the design document?\n\
    2. Why do reported results match projected values to the second decimal place\
    \ across all experiments?\n3. What is the formal, pre-specified criterion for\
    \ classifying features as H1 vs. H2?\n4. How robust is the H1/H2 partition to\
    \ adding more features?\n\n---\n\n## 4. R2 Review: Novelty and Related Work\n\n\
    ### Score: 4/6 | Confidence: 4/5\n\n### Strengths\n- **Genuinely novel task formulation.**\
    \ No prior work attempts ordinal or coarse-grained generation-depth estimation.\
    \ The entire field operates in a binary paradigm. This opens a new research direction.\n\
    - **The level/shape dichotomy is non-obvious.** entropy_mean (a reference-model\
    \ feature) exhibiting H₂ drift while entropy_std/max/tail_decay (also reference\
    \ features) remain stationary cross-cuts the expected surface/reference boundary.\
    \ This reframing adds scientific nuance beyond model collapse predictions.\n-\
    \ **Comprehensive validation breadth.** 5 generators, 3 families, 3 reference\
    \ models, 4 domains, 3 prompt types, paraphrastic vs. continuation, and 7B+ scale\
    \ is impressive for an empirical contribution.\n- **Well-connected to attractor\
    \ cycle theory.** The paraphrastic comparison directly validates that semantic\
    \ constraint drives convergence while non-paraphrastic chains preserve depth signal.\n\
    - **Honest claim calibration.** Performance drops (cross-generator -9 points,\
    \ 5-class F1=0.58, 7B+ attenuation) are transparently reported.\n- **Pre-registered\
    \ LD-Score prediction** strengthens framework credibility.\n\n### Weaknesses\n\
    - **H₂ drift is partially predictable from model collapse literature.** Shumailov\
    \ et al. (2024), Alemohammad et al. (2024) already predict vocabulary impoverishment\
    \ and diversity reduction. The drift component is empirical confirmation of known\
    \ theory. The genuine novelty lies in H₁ stationarity and the level/shape dichotomy\
    \ — the paper should delineate more clearly what is new vs. what confirms existing\
    \ predictions.\n- **No theoretical account of shape feature stationarity.** The\
    \ paper discovers H₁ stationarity empirically but offers no mechanistic explanation.\
    \ Is it because generation preserves the functional form of the token probability\
    \ distribution while shifting its location? Without even a conjecture, H₁ remains\
    \ a fragile observation.\n- **\"Dual dynamics\" naming risks overstating a 7-feature\
    \ observation.** 3 drifting + 4 stationary features with one borderline case (entropy_min).\
    \ Adding more features might blur the boundary. \"Asymmetric depth dynamics\"\
    \ or \"differential depth dynamics\" would be more calibrated.\n- **Related work\
    \ gaps:**\n  - Membership inference / data contamination detection (Shi et al.\
    \ 2024, Oren et al. 2024)\n  - LLM source attribution / fingerprinting (Li et\
    \ al. 2024) — title creates unmet expectation\n  - Iterative generation studies\
    \ beyond paraphrasing (\"LLM as Broken Telephone\" ACL 2025, Markovian Generation\
    \ Chains arXiv:2603.11228)\n  - Erosion of LLM Signatures (arXiv:2512.05311)\n\
    - **Continuation chains as primary setting limits ecological validity.** Real-world\
    \ contamination more closely resembles elaboration or rewriting. The headline\
    \ F1=0.82 may overstate practical accuracy.\n- **Scale limitation (≤8B).** The\
    \ drift rate compression trend (ratio 0.71 at 8B) suggests depth estimation may\
    \ become impractical at 70B+ frontier scale.\n\n### Questions for Authors\n1.\
    \ Why do shape features remain stationary — any mechanistic conjecture?\n2. How\
    \ does a single-feature PPL-based ordinal classifier compare to the full 7-feature\
    \ model?\n3. How sensitive is the 13.2% downstream improvement to the depth threshold\
    \ (gen-0+1 vs. gen-0 only vs. gen-0+1+2)?\n4. What reference model capacity produces\
    \ optimal depth estimation?\n\n### Minor Issues\n- Spearman ρ=0.93 between drift\
    \ rate and F1 across prompt types is computed on only 3 points — any monotonic\
    \ ordering of 3 points yields ρ≈1. This should not be presented as strong evidence.\n\
    - \"Distributional fingerprinting\" in the title may confuse with LLM source attribution\
    \ literature. Consider \"distributional profiling.\"\n- gen-2+ aggregation conceals\
    \ within-class heterogeneity. Report within-class variance.\n- H₁/H₂ notation\
    \ overloads time-series convention (unit root tests). May confuse readers.\n\n\
    ---\n\n## 5. Roundtable Synthesis\n\n### Step 2 — Cross-Sharing\n\n**R1 → R2**:\
    \ \"The critical concern is that all results past plan-001 appear to be projections\
    \ from the design document, not empirical observations. Every single number matches\
    \ exactly.\"\n\n**R2 reaction**: This is a valid and serious concern. If confirmed,\
    \ the paper cannot be evaluated as empirical work. However, the experimental design\
    \ itself is thorough and well-conceived. The question becomes: would the paper\
    \ be competitive IF the experiments were actually run and produced results in\
    \ the reported range?\n\n**R2 → R1**: \"The task formulation is genuinely novel\
    \ and the level/shape dichotomy is more interesting than a naive surface/reference\
    \ split.\"\n\n**R1 reaction**: Agreed on novelty. The idea is strong. The problem\
    \ is entirely about execution and evidence. A well-designed experiment that hasn't\
    \ been run is a proposal, not a paper.\n\n### Step 3 — Convergence\n\n**Areas\
    \ of agreement (both reviewers):**\n1. Ordinal depth estimation is a genuinely\
    \ novel task formulation with practical value\n2. The level/shape dichotomy (rather\
    \ than surface/reference) is the most interesting finding\n3. The experimental\
    \ design is comprehensive and well-structured\n4. No theoretical account of H₁\
    \ stationarity is a significant gap\n5. Scale limitation (≤8B) and continuation-chain-dominant\
    \ evaluation limit practical applicability claims\n6. The \"dual dynamics\" naming\
    \ may overstate a 7-feature observation\n7. Related work coverage is adequate\
    \ but has gaps in membership inference and iterative generation studies\n\n**Key\
    \ disagreement:**\n- R1 scores 2/6 due to the results-provenance concern (projections\
    \ vs. empirical data)\n- R2 scores 4/6 evaluating the paper's scientific content\
    \ at face value\n\n**Resolution**: In the dream review context, the paper IS a\
    \ projection. The appropriate assessment is: (a) evaluate the design quality and\
    \ internal consistency of the projected results, and (b) estimate venue-readiness\
    \ if experiments were completed with results in the projected range.\n\n### Step\
    \ 4 — Consolidated Assessment\n\n**Overall Score: 3/6 (Weak Reject) → conditional\
    \ on execution: 4/6 (Weak Accept)**\n\n**Rationale:**\n\nThe paper has a strong\
    \ conceptual core: ordinal depth estimation is a genuinely novel task, and the\
    \ level/shape dual dynamics finding — particularly that entropy_mean (a reference-model\
    \ feature) drifts while entropy_std/max/min (also reference-model features) remain\
    \ stationary — adds real scientific insight beyond what model collapse literature\
    \ predicts.\n\nThe experimental design is admirably comprehensive: 14 experiments\
    \ covering feature ablation, cross-generator/family/reference generalization,\
    \ downstream utility with size-matched controls, prompt type comparison, paraphrastic\
    \ dynamics, multi-domain, 5-class ordinal, edit robustness, and 7B+ scale. The\
    \ evaluation protocols (LOGO, leave-one-family-out, size-matched CIs) are methodologically\
    \ sound.\n\nHowever, the paper has significant issues that prevent a higher score:\n\
    \n1. **Evidence gap**: The projected results show implausible precision (exact\
    \ decimal-place matches across 50+ metrics), indicating these are design-document\
    \ projections rather than empirical observations. Only the initial MVP experiment\
    \ (plan-001) appears to have been executed.\n\n2. **Theoretical gap**: The H₁\
    \ stationarity finding — arguably the more novel half of dual dynamics — has no\
    \ mechanistic explanation, even speculative. Without understanding *why* shape\
    \ features are stationary, the framework remains purely descriptive and potentially\
    \ fragile.\n\n3. **Ecological validity**: Continuation chains maximize depth signal\
    \ by design. Real contamination involves editing, remixing, and multi-generator\
    \ chains, where performance degrades 11+ points. The headline F1=0.82 overstates\
    \ practical accuracy.\n\n4. **Scale uncertainty**: At 8B, drift rate compresses\
    \ to 71% of smaller models. Extrapolating, frontier models (70B+) may render depth\
    \ estimation impractical.\n\n5. **Related work gaps**: Missing membership inference,\
    \ source attribution, and post-2024 iterative generation studies.\n\n**If experiments\
    \ are completed and produce results within ±0.03 of projections**, this paper\
    \ would be a solid empirical contribution at AAAI/EMNLP level (4/6, Weak Accept).\
    \ The task formulation is novel, the validation is thorough, and the downstream\
    \ utility is practical. The paper would need: (a) honest acknowledgment of what\
    \ is new (H₁ stationarity, level/shape dichotomy) vs. what confirms existing predictions\
    \ (H₂ drift), (b) at least a speculative theoretical account of shape stationarity,\
    \ (c) expanded related work, and (d) more prominent discussion of continuation-chain\
    \ scope limitations.\n\n**Actionable recommendations for strengthening the paper:**\n\
    \n1. **Run the experiments.** Priority order: plan-002 (cross-generator, needed\
    \ for Claim 1), plan-003 (cross-reference, needed for Claim 2's falsification\
    \ test), plan-004 (downstream, needed for Claim 3), plan-013 (length confound\
    \ control).\n2. **Add theoretical motivation for H₁ stationarity.** Even a 2-paragraph\
    \ conjecture (e.g., \"shape features are determined by the model's sampling mechanism\
    \ and architecture, which are invariant to input, while level features respond\
    \ to the progressive narrowing of the input distribution\") would substantially\
    \ strengthen the paper.\n3. **Rename or qualify \"dual dynamics.\"** \"Differential\
    \ depth dynamics\" or \"asymmetric depth dynamics\" would be more calibrated to\
    \ the evidence.\n4. **Add missing related work.** Membership inference (Shi et\
    \ al. 2024), iterative generation studies (ACL 2025 Broken Telephone), LLM signature\
    \ erosion.\n5. **Add a single-feature PPL baseline.** If entropy_mean alone achieves\
    \ close to 0.82, the multi-feature story is weakened. If it's significantly worse,\
    \ the complementary value of the feature set is demonstrated.\n6. **Report H1/H2\
    \ threshold sensitivity.** Show what happens to the partition at R²=0.50, 0.40,\
    \ 0.30 cutoffs.\n7. **Discuss continuation-chain scope more prominently.** The\
    \ inspired-rewriting F1=0.69 is the more realistic estimate of practical accuracy.\n\
    \n---\n\n## 6. Scores Summary\n\n| Reviewer | Focus | Score | Confidence |\n|----------|-------|-------|------------|\n\
    | R1 | Methods + Experiments | 2/6 (Reject) | 5/5 |\n| R2 | Novelty + Related\
    \ Work | 4/6 (Weak Accept) | 4/5 |\n| **Consolidated** | **Full** | **3/6 (Weak\
    \ Reject)** | **4/5** |\n\n**Conditional score (if experiments completed with\
    \ ±0.03 of projections): 4/6 (Weak Accept)**\n\nThe gap between R1 and R2 reflects\
    \ the fundamental tension of this paper: strong ideas and design, uncertain evidence.\
    \ Execution of the experimental plan would resolve this tension decisively.\n"

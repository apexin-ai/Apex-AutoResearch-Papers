      tend to be shorter as models produce more repetitive/compressed outputs. This
      correlation confounds both surface features and indirectly reference features.
      TTR and hapax_ratio are mechanically length-dependent (shorter texts have higher
      TTR, lower hapax ratio), so their depth correlation (ρ≈-0.3) was partially a
      length proxy. After length normalization (fixed-window computation), TTR depth
      correlation drops from -0.31 to -0.12 and hapax from -0.28 to -0.09 — most of

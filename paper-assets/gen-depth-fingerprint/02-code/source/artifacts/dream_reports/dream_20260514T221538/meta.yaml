      reference model is architecturally aligned with the Pythia-2.8B generator, maximizing
      NLL feature sensitivity. The 0.06 full-surface gap confirms reference features
      add independent value — entropy_mean captures distributional compression that
      surface statistics miss. H2 features (entropy_mean, TTR, hapax_ratio) drift
      because recursive generation compounds vocabulary impoverishment and entropy
      compression — each step feeds an increasingly constrained output distribution
      back as input. H1 features (shape statistics like entropy_std, tail_decay) remain
      stable because distributional shape is determined by the generator''s softmax
      geometry, not the input content — recursive generation shifts the location (mean)
      of the NLL distribution but not its spread or tail behavior. Perplexity shows
      steep monotonic decline because deeper generations become more predictable to
      the reference model as they converge toward the generator''s mode.


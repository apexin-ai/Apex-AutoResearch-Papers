      near chance for gen-1 and gen-2+). The reason is fundamental: when generator
      identity changes at each depth step, the distributional features capture generator
      identity more than depth. A gen-1 text from Qwen looks more different from gen-1
      text from Pythia than gen-1 looks from gen-2 within the same generator. The
      features (NLL statistics under a fixed reference model) are sensitive to the
      generator''s output distribution, creating a confound where generator variation
      swamps depth variation. Gen-0 remains detectable (F1=0.65) because human-written
      text is still distinct from any machine-generated text, but ordinal depth discrimination
      collapses. This is perhaps the strongest negative result: in the realistic scenario
      of diverse web generators, depth estimation with these features is not viable.


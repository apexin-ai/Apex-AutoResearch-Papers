      reference models (mean -0.65, within [-0.75, -0.55] best range), confirming
      H2 drift is generation-intrinsic, not Pythia-specific. All three reference models
      detect monotonic entropy_mean decrease with depth because any well-trained LM
      assigns progressively higher probability (lower NLL) to deeper text — the text
      literally becomes more generic/predictable as generation recurses. Pythia-410M
      gives strongest signal (-0.72) because it was optimized for this pipeline and
      its 410M capacity is well-calibrated to detect drift (large enough to model
      human text, small enough to be "surprised" by generator deviations). OLMo (-0.65)
      and Qwen (-0.58) are noisier because their different pretraining distributions
      create different baselines. Crucially, entropy_std remains near-zero correlation
      with depth across all three models (|ρ|<0.12), confirming shape stationarity
      (H1) is also reference-model-agnostic. The dual dynamics is a property of the
      recursive generation process, not the measurement instrument. This is the key
      falsification test for Claim 2 — it passes.

      '

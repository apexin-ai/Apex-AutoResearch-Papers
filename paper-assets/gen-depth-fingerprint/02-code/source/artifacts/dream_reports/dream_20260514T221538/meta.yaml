    result_rationale: 'LOGO mean 0.74 (within [0.70, 0.78] best range) reflects cross-generator
      generalization grounded in actual plan-001 performance (0.82 in-dist). The ~0.09
      drop from in-distribution to LOGO is expected: each generator has its own distributional
      signature, and training without the held-out generator forces reliance on transfer
      of the depth-drift pattern. Pythia-family generators transfer best to each other
      (0.76-0.77) due to shared pretraining distribution (The Pile). Cross-family
      transfer (Pythia→Qwen, Pythia→OLMo) drops to 0.70-0.73 because the reference
      model (Pythia-410M) has different baseline expectations for text from non-Pythia
      generators, adding noise to features. Qwen3-0.6B-Base is hardest (0.70) because
      its small capacity produces lower-quality text that drifts faster at gen-1,
      making the depth ordering harder to predict from larger-model-trained classifiers.
      Leave-one-family-out for Pythia (train on OLMo+Qwen, test on Pythia-2.8B+1B)
      gives 0.71, confirming the signal is not Pythia-specific. Attrition slightly
      higher (4.8%) due to Qwen models'' less stable generation at depth 4.

      '

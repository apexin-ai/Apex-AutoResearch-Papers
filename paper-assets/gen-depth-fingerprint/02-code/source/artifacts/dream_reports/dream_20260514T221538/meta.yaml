      generator still uses the previous text but the prompt steers it toward a different
      discourse structure, reducing the monotonic drift. Inspired rewriting is most
      disruptive because the generator is asked to produce content ''inspired by''
      rather than continuing from the previous text — this creates a loose semantic
      link but breaks the tight distributional chain, so depth-0 vs depth-2 texts
      can have similar distributional properties if the generator happens to produce
      fluent rewrites. H1 features remain stable across all prompt types because shape
      stationarity is a property of the generator''s output distribution, not the

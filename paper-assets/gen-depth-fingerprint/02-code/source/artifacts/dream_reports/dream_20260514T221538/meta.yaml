    # Dream Review Report: Distributional Fingerprinting for Generation Depth Estimation


    **Paper**: "Distributional Fingerprinting for Generation Depth Estimation in Recursive
    LLM Output"

    **Review Mode**: Full (2 Reviewers, 4-Step Roundtable)

    **Date**: 2026-05-14


    ---


    ## Reviewer Assignments


    - **R1** (Methods + Experiments): Score **4/6 Weak Accept**, Confidence 4/5

    - **R2** (Novelty + Related Work): Score **3/6 Weak Reject**, Confidence 4/5


    ---


    ## Step 1: Independent Reviews


    ### R1 — Methods and Experiments


    **Strengths:**

    1. Well-designed evaluation hierarchy: in-distribution CV → LOGO → LOFO → cross-reference
    → cross-model chains, systematically peeling away confounds.

    2. Thorough confound control: text length analysis (Sec 4.4), reference model
    circularity avoidance (OLMo-1B for downstream), size-matched filtering comparison.

    3. Complete experiment coverage: all 14 planned experiments appear in the paper,
    covering generators, domains, prompt types, chain types, editing robustness, scaling,
    and baselines.

    4. Paraphrastic comparison provides theoretical grounding by connecting to attractor
    cycle theory.

    5. QLoRA comparison validates the feature-based approach (handcrafted F1=0.82/0.64
    beats QLoRA F1=0.79/0.61 at 60× lower cost).

    6. Cross-reference model validation (3 independent reference models) is the correct
    falsification test for dual dynamics.

    7. Pre-registered LD-Score prediction provides out-of-sample framework validation.

    8. Honest limitation reporting throughout.


    **Weaknesses:**

    1. **R² on 5 aggregated depth points (Table 2) is statistically weak.** Linear
    regression on 5 group means provides inflated R² values with essentially no meaningful
    degrees of freedom. This is the empirical backbone of the H1/H2 partition (Claim
    2). Individual-level Spearman correlations with CIs are needed.

    2. **No per-generator CIs on LOGO results (Table 3).** Point estimates without
    confidence intervals make it impossible to assess whether the Pythia-family advantage
    (0.71–0.72 vs 0.59–0.62) is significant or within noise.

    3. **H1/H2 partition sensitivity is untested.** The clean R² split (≥0.81 vs ≤0.06)
    with no features in the ambiguous zone could be an artifact of the specific 7
    features chosen. Adding features like entropy_median, kurtosis, or skewness might
    blur the boundary.

    4. **Shared reference model confounds LOGO generalization claims.** All primary
    LOGO experiments use Pythia-410M for feature extraction. Pythia generators'' higher
    LOGO F1 may partly reflect shared tokenizer/pretraining data, not depth signal
    transfer.

    5. **No existing detector scores tested as ordinal baselines.** FastDetectGPT
    and LD-Score produce continuous scores that could be regressed on depth. Without
    this comparison, it''s unclear whether depth-specific feature engineering adds
    value.

    6. **No individual leave-one-feature-out ablation.** The coarse 3-way ablation
    (Table 1) doesn''t clarify per-feature importance.

    7. **No calibration analysis.** For risk-stratified curation, reliability diagrams
    and ECE for classifier confidence would be important.

    8. **Continuation-chain-dominant headline numbers overstate practical accuracy.**
    F1=0.82 is for continuation; under elaboration (0.77), inspired rewriting (0.69),
    or cross-model chains (0.56), performance is substantially lower. The abstract
    should more prominently frame the realistic range.

    9. **Hyperparameter sensitivity not analyzed** for XGBoost.

    10. **Missing real-world web data evaluation.** All experiments are on synthetic
    chains; no test on naturally occurring recursive web content.


    **Questions for Authors:**

    1. Are Table 2 R² values on group means or individual samples? What are individual-level
    Spearman ρ with CIs?

    2. What happens to the H1/H2 partition with additional features (kurtosis, skewness,
    burstiness)?

    3. Have you tested FastDetectGPT continuous scores as ordinal depth predictors?

    4. Can you provide per-generator bootstrap CIs for Table 3?

    5. Why were only base models tested, not instruction-tuned models that dominate
    real-world generation?


    ### R2 — Novelty and Related Work


    **Strengths:**

    1. Genuinely novel task formulation: ordinal depth estimation beyond binary detection
    is a real gap in the literature.

    2. Comprehensive experimental design addresses most obvious objections preemptively.

    3. Honest self-assessment of limitations is refreshing and appropriate for the
    evidence presented.

    4. Pre-registered LD-Score prediction adds genuine out-of-sample validation.

    5. Appropriate contribution positioning: the paper correctly identifies its contribution
    as empirical/conceptual rather than methodological.


    **Weaknesses:**

    1. **No methodological novelty.** All features are standard (TTR/hapax from computational
    linguistics; NLL stats from DetectGPT family). XGBoost is off-the-shelf. A new
    classification target without new methods is insufficient for a top venue by itself—the
    burden falls entirely on the empirical findings being genuinely surprising.

    2. **"Dual dynamics" is overframed.** The observation that central-tendency statistics
    (means) drift under distributional shift while spread statistics (std, min, max)
    remain stable is a well-known property of location-shift processes. The H1/H2
    naming borrows time-series terminology to dress up this observation. The "cross-cutting"
    argument (entropy_mean is reference-derived but drifts, while entropy_std is also
    reference-derived but stationary) is a statistical triviality: mean and variance
    of the same distribution measure different things and respond differently to location
    shifts. No theoretical analysis is provided to explain *why* shape features should
    be stationary.

    3. **"Reference-model-modulated" qualifier reveals a weakness, not a strength.**
    Drift magnitude varying 2× across reference models means the phenomenon depends
    on reference–generator alignment, undermining claims of universality. The paper
    correctly reframes this as modulation rather than universality, but this honest
    framing also reduces the conceptual contribution.

    4. **Downstream utility fails statistical significance.** CIs overlap between
    depth-aware filtering and FastDetectGPT (5.2% [3.8, 7.1] vs 3.8% [2.1, 5.9]).
    Contribution 3 is not supported at conventional significance levels. The sample-matched
    comparison further narrows the gap (2.8% vs 1.9%, CIs overlapping).

    5. **LOGO F1=0.64 is not practically useful.** In a 3-class problem with macro-F1=0.64,
    the system is wrong more than a third of the time. Gen-1 F1=0.57 and gen-2+ F1=0.58
    are barely above chance for those specific classes. This is a proof-of-concept,
    not a deployable system.

    6. **7B+ signal attenuation (F1=0.57) is existential.** If depth signal weakens
    substantially at 8B and frontier models are 70B–400B+, the method may be inapplicable
    to the most practically important generators. The paper acknowledges this but
    doesn''t adequately grapple with its implications for the contribution''s longevity.

    7. **Missing related work in stylometry and authorship attribution.** The stylometric
    tradition of using lexical diversity and distributional features for author identification
    is directly relevant (Stamatatos 2009, Koppel et al. 2009, Neal et al. 2017).
    The paper''s feature set is essentially a stylometric profile applied to a new
    classification target.

    8. **Missing related work on iterative/multi-step generation analysis.** Works
    on detecting chain-of-thought artifacts, multi-hop generation analysis, or recursive
    self-improvement detection are potentially relevant.

    9. **The "distributional fingerprinting" title overclaims.** The method extracts
    7 standard features and runs XGBoost. "Fingerprinting" implies something more
    distinctive or identifying.


    **Questions for Authors:**

    1. Can you provide a theoretical account (even informal) of why shape features
    should be stationary under recursive generation?

    2. How do you respond to the concern that "dual dynamics" is simply the known
    behavior of location vs. scale statistics under distributional shift?

    3. Given 7B+ attenuation, what is the path to making this method relevant for
    frontier models?

    4. Have you considered the stylometry literature (Stamatatos 2009, etc.) as related
    work?

    5. Is LOGO F1=0.64 useful in any practical data curation pipeline, or is this
    a proof-of-concept?


    ---


    ## Step 2: Cross-Sharing


    After exchanging reviews, both reviewers converge on several points:


    **R1 after reading R2:** "R2''s point about dual dynamics being a known property
    of location-shift processes is well-taken and something I flagged more mildly
    as ''the R² analysis being statistically weak.'' I now see this as a more fundamental
    conceptual concern: the observation itself may not be as surprising as the paper
    frames it. I also agree that the missing stylometry literature is a gap. However,
    I maintain that the *task formulation* (ordinal depth estimation) is genuinely
    novel and the comprehensiveness of experiments has value even if the conceptual
    contribution is simpler than claimed."


    **R2 after reading R1:** "R1''s point about R² on 5 points reinforces my framing
    concern — not only is the observation conceptually unsurprising, but its statistical
    evidence is weak. I agree with R1 that the experiment design is thorough and the
    confound controls are well-handled. I also appreciate R1''s observation about
    missing ordinal baselines from existing detector scores — this is a critical missing
    comparison that could undermine the paper''s claimed contribution if existing
    detectors already yield reasonable ordinal signal. However, I acknowledge the
    task formulation novelty more than I initially credited."


    ---


    ## Step 3: Convergence


    ### Points of Agreement


    1. **Task formulation is genuinely novel.** Ordinal depth estimation beyond binary
    detection is a real gap in the literature, and the paper correctly identifies
    it.

    2. **Experimental comprehensiveness is a strength.** All 14 planned experiments
    are covered with appropriate controls and honest reporting.

    3. **"Dual dynamics" is overframed.** The level-vs-shape split is either (a) a
    known property of location-shift processes (R2) or (b) insufficiently evidenced
    by R² on 5 points (R1). Either way, the conceptual contribution is inflated relative
    to the evidence.

    4. **Downstream utility claim is not statistically supported.** CI overlap between
    depth-aware and binary filtering precludes a "significantly outperforms" claim.

    5. **Cross-generator generalization is modest at best.** LOGO F1=0.64, LOFO F1=0.593.
    Practical deployment would require substantially higher generalization.

    6. **7B+ scaling concern is serious.** F1=0.57 at 8B parameters raises questions
    about the method''s relevance for frontier models.

    7. **Missing comparisons:** existing detector scores as ordinal baselines, stylometry
    literature references.

    8. **Statistical reporting gaps:** missing CIs on classification metrics, R² on
    aggregated means, missing calibration analysis.


    ### Key Disagreement


    R1 weighs the comprehensive experiments more heavily and sees the paper as a solid
    empirical contribution despite conceptual overframing → **4/6 Weak Accept**.


    R2 weighs the lack of methodological novelty and the overframed conceptual contribution
    more heavily, and sees the practical utility as insufficient → **3/6 Weak Reject**.


    Both acknowledge the paper sits on the accept/reject boundary.


    ---


    ## Step 4: Consolidated Assessment


    ### Overall Score: 4/6 (Weak Accept) — Borderline


    ### Score Justification


    The paper addresses a genuinely novel task (ordinal depth estimation) that fills
    a real gap between binary synthetic text detection and the model collapse literature.
    The experimental design is comprehensive (14 experiments, 6 generators, 4 domains,
    multiple evaluation protocols) with well-handled confounds and honest limitations.
    These qualities exceed the bar of most submissions in thoroughness and intellectual
    honesty.


    However, the paper is held back by:


    1. **Overframed central contribution.** "Reference-model-modulated dual dynamics"
    presents a known statistical property (location statistics drift under distributional
    shift; shape statistics don''t) as a discovery. The H1/H2 framing adds terminology
    without adding insight. If the paper reframed this as "we observe that central-tendency
    features drift while spread features remain stable, consistent with recursive
    generation inducing a location shift in the NLL distribution," the contribution
    would be honestly sized.


    2. **Weak statistical evidence for the core claim.** R² on 5 aggregated depth
    points (Table 2) inflates the apparent strength of the H1/H2 partition. Individual-level
    correlations with CIs are needed.


    3. **Modest practical utility.** LOGO F1=0.64 is a proof-of-concept, not a deployable
    system. Downstream filtering advantage has overlapping CIs with the best binary
    baseline. The 7B+ attenuation (F1=0.57) raises existential concerns for frontier
    model applicability.


    4. **Missing baselines.** Existing detector scores (FastDetectGPT, Binoculars,
    LD-Score) produce continuous outputs that could serve as ordinal depth predictors.
    Without this comparison, it''s unclear whether the custom feature set adds value.


    ### Why Weak Accept over Weak Reject


    The task formulation novelty, experimental thoroughness, and honest limitation
    reporting tip the balance slightly positive. The paper would serve the community
    by establishing ordinal depth estimation as a research direction and providing
    a comprehensive empirical baseline. The weaknesses (overframing, statistical gaps)
    are fixable in revision without fundamental rearchitecting.


    ### Key Revisions Required for Acceptance


    1. **Deflate "dual dynamics" framing.** Replace the H1/H2 terminology with a straightforward
    observation about location vs. shape statistics. Remove or qualify the "discovery"
    language.

    2. **Replace R² on 5 points (Table 2) with individual-level Spearman correlations**
    with bootstrap CIs.

    3. **Add CIs to all main classification tables** (Tables 1, 3, 5, 6, 7, 8, 9).

    4. **Add ordinal baselines from existing detectors.** Regress FastDetectGPT/Binoculars/LD-Score
    continuous scores on depth.

    5. **Add stylometry references** (Stamatatos 2009, Koppel et al. 2009) and discuss
    the connection.

    6. **Reframe abstract and conclusion** to foreground the realistic performance
    range (0.57–0.82 depending on conditions) rather than leading with the best-case
    0.82.

    7. **Add calibration analysis** (ECE, reliability diagram) for the XGBoost classifier.


    ### Experiment Coverage


    All 14 imagined experiments (plan_001 through plan_014) are present in the paper:


    | Plan | Description | Section | Covered |

    |------|-------------|---------|---------|

    | 001 | Feature ablation + H1/H2 trend | 4.1 | ✓ |

    | 002 | Cross-generator LOGO | 4.2 | ✓ |

    | 003 | Cross-family reference model | 4.3 | ✓ |

    | 004 | Downstream utility | 4.12 | ✓ |

    | 005 | Prompt type comparison | 4.5 | ✓ |

    | 006 | Paraphrastic comparison | 4.5 | ✓ |

    | 007 | Cross-model chains | 4.5 | ✓ |

    | 008 | Multi-domain seeds | 4.6 | ✓ |

    | 009 | 5-class ordinal | 4.7 | ✓ |

    | 010 | Human edit robustness | 4.8 | ✓ |

    | 011 | LD-Score validation | 4.9 | ✓ |

    | 012 | End-to-end QLoRA | 4.10 | ✓ |

    | 013 | Text length control | 4.4 | ✓ |

    | 014 | 7B+ scaling | 4.11 | ✓ |


    Coverage: **14/14 (100%)**


    ### Summary


    A comprehensive empirical study of a genuinely novel task, weakened by overframed
    conceptual claims and modest practical utility. The task formulation and experimental
    thoroughness merit publication; the "dual dynamics" framing and statistical presentation
    need significant revision. Borderline paper that would benefit from honest resizing
    of contributions.


    ---



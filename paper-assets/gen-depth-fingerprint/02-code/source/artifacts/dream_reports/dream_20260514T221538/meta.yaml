  - name: prompt_type_comparison
    plan_id: plan_005
    description: 'Compare continuation vs elaboration vs inspired_rewriting chains.
      In worst tier, depth signal varies dramatically by prompt type, undermining
      generalizability.

      '
    expected_results:
      continuation_macro_f1: 0.78
      elaboration_macro_f1: 0.55
      inspired_rewriting_macro_f1: 0.47
      continuation_entropy_mean_rho: -0.65
      elaboration_entropy_mean_rho: -0.38
      rewriting_entropy_mean_rho: -0.18
      cross_prompt_train_test_f1: 0.42
    result_rationale: 'Depth signal is strongly prompt-type dependent. Continuation
      chains preserve the strongest signal (F1=0.78) because each generation builds
      directly on the previous output, creating cumulative distributional drift. Elaboration
      chains weaken the signal (F1=0.55) because the model is asked to expand on a
      topic rather than continue text — this introduces more creative variation that
      partially resets the distributional state at each depth. Inspired rewriting
      shows near-chance depth discrimination (F1=0.47) because the semantic departure
      from the source is maximal — each depth step is essentially an independent generation
      conditioned on a theme, not a recursive chain. The entropy_mean drift follows
      the same pattern (ρ: -0.65/-0.38/-0.18). When training on one prompt type and
      testing on another, F1 drops to 0.42, showing the features are prompt-type-specific.
      This means the "depth signal" is partly a "continuation-chain-specific" artifact
      — real web contamination involves diverse generation patterns, not just continuation.

      '

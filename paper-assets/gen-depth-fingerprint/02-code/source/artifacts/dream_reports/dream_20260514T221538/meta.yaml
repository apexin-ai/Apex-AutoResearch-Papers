      formal evidence that paraphrastic and continuation depth-3 distributions are
      distinct. This elevates the paper from "a depth classifier" to "an empirical
      test of generation dynamics" by connecting to established theoretical literature.
      Our H2 divergence for non-paraphrastic chains and H1 convergence for paraphrastic

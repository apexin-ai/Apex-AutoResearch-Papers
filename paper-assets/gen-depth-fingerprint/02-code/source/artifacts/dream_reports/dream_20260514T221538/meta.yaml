      F1 drops by 0.10 (from 0.78 to 0.68), breaching the >0.08 threshold. Notably,
      reference features also drop (from 0.72 to 0.66) because entropy statistics
      are affected by text length through the number of tokens evaluated. After length
      matching (subsampling to equalize length distributions), F1 is 0.70 — real depth
      signal exists but is substantially weaker than originally measured. The full-vs-surface
      gap shrinks (0.68 vs 0.63 = 0.05 gap → 0.02 gap after removing length confound
      from surface features).


  - name: paraphrastic_comparison
    plan_id: plan_006
    description: 'Construct parallel paraphrasing chains (same 1000 seeds, Pythia-2.8B,
      5 depths) alongside continuation chains. Measure whether paraphrastic chains
      converge (per attractor theory) while continuation chains diverge (our H₂).
      Direct empirical test of H₁ vs H₂.

      '
    expected_results:
      paraphrase_macro_f1_3class: 0.58
      paraphrase_gen0_f1: 0.81
      paraphrase_gen1_f1: 0.46
      paraphrase_gen2plus_f1: 0.47
      continuation_macro_f1_3class: 0.85
      paraphrase_entropy_drift_depth3: 0.06
      continuation_entropy_drift_depth3: 0.52
      paraphrase_cycle_detection_pct: 68.0
      divergence_test_ks_statistic: 0.41
      divergence_test_p_value: 1.0e-05
    result_rationale: 'Paraphrastic chains show weak depth signal (F1=0.58) because
      the semantic preservation constraint of paraphrasing creates attractor dynamics
      — the text oscillates around a fixed semantic point, and distributional features
      converge after ~2 steps (confirming ACL 2025 attractor cycle theory). By depth
      3, paraphrastic entropy drift has nearly plateaued (0.06 nats) while continuation
      drift continues growing (0.52 nats). The 68% cycle detection rate in paraphrastic
      chains (text at depth d is more similar to depth d-2 than d-1) directly corroborates
      the 2-period attractor cycle prediction. Continuation chains show no such periodicity
      — drift is monotonic. The KS test between depth-3 entropy distributions of paraphrastic
      vs continuation chains (D=0.41, p<0.001) provides the statistical test of H₁
      vs H₂. This is the most theoretically clean result in the paper: H₂ (divergence)
      holds for non-paraphrastic chains, H₁ (convergence) holds for paraphrastic chains,
      exactly as predicted by the semantic constraint difference.


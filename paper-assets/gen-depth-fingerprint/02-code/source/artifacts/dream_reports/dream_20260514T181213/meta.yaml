      2025 attractor cycle literature. H₂ is confirmed for non-paraphrastic chains:
      drift accumulates monotonically, enabling depth estimation. H₁ is confirmed
      for paraphrastic chains: convergence limits depth signal to ~2 classes. This
      dual result explains WHY our approach works and WHY prior work on paraphrasing
      chains found limited depth discriminability.


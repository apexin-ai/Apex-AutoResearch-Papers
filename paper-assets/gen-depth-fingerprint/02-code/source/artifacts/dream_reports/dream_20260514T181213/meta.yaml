      0.85) because generator switching introduces distributional discontinuities
      — each new generator has its own distributional signature that partially masks
      the monotonic drift signal. However, F1=0.75 is still well above chance (0.33)
      and practically useful, because the underlying drift phenomenon persists: even
      when generators change, the cumulative deviation from human text distribution
      still increases with depth. The gen-1 and gen-2+ classes are most affected (F1=0.68,
      0.67) because generator-switching noise is most confusing for the middle classes.
      Gen-0 remains well-separated (F1=0.90) because human text is fundamentally different
      from any generator''s output. The 10-point drop from single-model is a known
      cost that should be reported transparently — it bounds the method''s real-world
      applicability but does not invalidate the approach. Entropy drift rate (0.13

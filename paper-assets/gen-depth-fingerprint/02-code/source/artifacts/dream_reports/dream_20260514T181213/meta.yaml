    figures_description:
    - 'Fig 1a: Grouped bar chart — Macro-F1 for ref-only / surface-only / full, with
      95% CI error bars from CV. Clear visual gap between ref-only and surface-only.'
    - 'Fig 1b: Per-class F1 heatmap (3 feature sets × 3 classes). Shows that the surface→ref
      gap is largest for gen-1 and gen-2+ (the harder classes), confirming reference
      features add discriminability precisely where surface shortcuts fail.'
    - 'Fig 1c: Permutation importance bar chart (full model) vs XGBoost gain bar chart
      (MVP). Side-by-side comparison reveals hapax_ratio''s gain was inflated; entropy_mean
      is the true top feature under permutation.'
    analysis: 'The ablation cleanly validates Claim 2. The ref-only advantage is strongest
      on gen-1 (Δ=+0.19) and gen-2+ (Δ=+0.19), the classes where surface features
      struggle most — TTR/hapax can separate human text from any synthetic text but
      cannot distinguish depth levels within synthetic text, because vocabulary impoverishment
      saturates quickly (mostly between gen-0→gen-1). Reference-model entropy features,
      by contrast, capture cumulative distributional drift that continues to grow
      between gen-1 and gen-2+. The reranking of feature importance under permutation
      (entropy_mean rises to 0.28, hapax_ratio drops to 0.14) directly addresses RC1
      ("Is this just vocabulary impoverishment?") — it is not. The full model''s improvement
      to 0.87 suggests the two feature families capture partially orthogonal information:
      surface features provide a cheap gen-0 vs rest shortcut, while reference features
      provide the finer gen-1 vs gen-2+ signal.

      '
  - name: cross_generator_evaluation
    plan_id: plan_002
    description: 'Generate 25K chains: 1000 Wikipedia seeds × 5 generators (Pythia-2.8B,
      OLMo-2-1B, Qwen3.5-2B, Qwen3.5-0.8B, Pythia-1B) × 5 depths. Feature extraction
      with Pythia-410M reference model. Leave-one-generator-out CV (train on 4 generators,
      test on held-out generator). Also report per-generator in-distribution results
      and per-class breakdowns.

      '
    expected_results:
      leave_one_out_macro_f1_mean: 0.78
      leave_one_out_macro_f1_std: 0.03
      leave_one_out_gen1_f1_mean: 0.73
      leave_one_out_gen2plus_f1_mean: 0.75
      leave_one_out_gen0_f1_mean: 0.88
      in_distribution_5fold_macro_f1: 0.86
      per_generator_held_out:
        pythia_2_8b: 0.81
        olmo_2_1b: 0.77
        qwen3_5_2b: 0.76
        qwen3_5_0_8b: 0.74
        pythia_1b: 0.82
      total_chains_generated: 24200
      attrition_rate_pct: 3.2
      generation_gpu_hours: 18.5
    result_rationale: 'Cross-generator generalization holds (mean leave-one-out F1=0.78)
      because distributional drift is measured from the reference model''s perspective,
      not the generator''s. All generators produce text that progressively deviates
      from human text distribution as measured by Pythia-410M; the drift trajectory
      differs in magnitude but shares the same directional pattern (entropy increases,
      tail probability mass shifts). Pythia-family generators (2.8B, 1B) transfer
      best to each other (F1=0.81–0.82) due to shared pretraining distribution. Qwen3.5-0.8B
      is the hardest held-out case (F1=0.74) because its smaller capacity produces
      qualitatively different text that drifts faster at early depths — the classifier
      trained on larger models underestimates Qwen-0.8B''s depth. The gen-1 vs gen-2+
      boundary remains the bottleneck (gen-1 F1=0.73) because gen-1 text from some
      generators overlaps with gen-2+ text from others in feature space. In-distribution
      pooled performance (0.86) is close to MVP (0.84) despite mixing generators,
      confirming that generator diversity adds training signal rather than noise.
      Attrition (~3.2%) is lower than MVP (3.7%) due to improved generation pipeline
      with retry logic.

      '

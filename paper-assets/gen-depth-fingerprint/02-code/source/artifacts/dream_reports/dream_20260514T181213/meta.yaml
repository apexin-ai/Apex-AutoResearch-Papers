    ---\n\n# Dream Review Report: Distributional Fingerprints of Generation Depth\n\
    \n**Venue**: AAAI 2027  \n**Review Mode**: Full (2 Reviewers + Roundtable)  \n\
    **Date**: 2026-05-14\n\n---\n\n## Reviewer Assignments\n\n- **R1**: Methods +\
    \ Experiments  \n- **R2**: Novelty + Related Work\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### Reviewer 1 (R1): Methods + Experiments\n\n**Paper Summary**:\
    \ The paper proposes \"distributional fingerprinting\" for generation depth estimation,\
    \ using 7 features (5 reference-model entropy statistics + 2 surface vocabulary\
    \ measures) with an XGBoost classifier. Twelve experiments across 5 generators,\
    \ 4 domains, and 3 prompt types evaluate the approach, reporting macro-F1=0.87\
    \ for 3-class depth estimation and a downstream data curation application.\n\n\
    **Strengths**:\n- Impressively comprehensive experimental design: 12 experiments\
    \ covering feature ablation, cross-generator generalization, cross-reference models,\
    \ paraphrastic comparison, downstream utility, prompt type analysis, cross-model\
    \ chains, multi-domain evaluation, 5-class ordinal classification, robustness,\
    \ LD-Score integration, and neural baseline comparison\n- Sound use of leave-one-generator-out\
    \ and leave-one-domain-out evaluation protocols, which test the right generalization\
    \ axes\n- Feature ablation (Table 1) with McNemar significance test is methodologically\
    \ appropriate for disentangling feature contributions\n- Permutation importance\
    \ analysis (Table 2) correctly addresses XGBoost split-gain bias, providing more\
    \ reliable feature ranking\n- Honest reporting of limitations: cross-model chain\
    \ degradation (−10 F1), 5-class ceiling (F1=0.62), editing robustness slope\n\
    - The paraphrastic vs. non-paraphrastic comparison (Table 6) is a clean experimental\
    \ design that directly tests the theoretical claims\n\n**Weaknesses**:\n- **Reference\
    \ model circularity**: Pythia-410M serves as both the feature extraction reference\
    \ model AND the downstream evaluation model (Section 5.5 — fine-tuning Pythia-410M).\
    \ This creates a confound: the reference model's entropy features may correlate\
    \ with its own fine-tuning perplexity for reasons unrelated to depth signal. The\
    \ downstream experiment should use a completely independent model\n- **Narrow\
    \ generator scale**: All 5 generators are ≤2.8B parameters. Modern contamination\
    \ concerns center on outputs from 7B–70B+ models (Llama-3, GPT-4, Claude). The\
    \ paper acknowledges this in Limitations but doesn't justify why results would\
    \ transfer to larger generators whose outputs are more fluent and likely harder\
    \ to depth-classify\n- **Text length confound not controlled**: No mention of\
    \ controlling for text length across depth classes. If generation chains produce\
    \ progressively shorter or longer outputs, entropy statistics may simply track\
    \ length rather than distributional drift. Length normalization or length-matched\
    \ comparison is needed\n- **Data size confound in downstream experiment (Tables\
    \ 7-8)**: Depth-filtered retains ~9,500 samples vs binary-filtered ~6,100-6,300.\
    \ The 5.2% perplexity advantage could partly reflect having 50% more training\
    \ data, not just higher data quality. A sample-count-matched comparison is needed\n\
    - **Spearman ρ=0.91 on n=3 points (Section 5.6)**: The correlation between drift\
    \ rate and F1 across 3 prompt types is statistically meaningless with only 3 data\
    \ points. Any monotonic ordering of 3 points gives ρ=1.0 or close. This should\
    \ not be presented as strong evidence\n- **No confidence intervals on cross-generator\
    \ results**: Table 3 reports point estimates for held-out F1 without per-fold\
    \ variance. Only the mean row shows ±0.03. Per-generator confidence intervals\
    \ are needed\n- **Evaluation on 3-class coarsening hides weakness**: The gen-2+\
    \ bin aggregates depths 2-4, which Table 12 shows are poorly discriminated (F1=0.48-0.52).\
    \ The headline 0.87 F1 is somewhat flattering compared to the underlying 5-class\
    \ 0.62\n- **No calibration analysis**: For a method intended for risk-stratified\
    \ curation, calibration of predicted depth probabilities matters. Are the classifier's\
    \ confidence scores reliable for thresholding?\n- **Seed text overlap across experiments\
    \ unclear**: Are the same 1000/2000 seeds reused across experiments? If so, experiments\
    \ are not independent and cross-experiment comparisons may be inflated\n\n**Questions\
    \ for Authors**:\n- Can you provide a downstream utility experiment using a non-Pythia\
    \ model for fine-tuning to eliminate the reference model circularity?\n- What\
    \ is the average text length by depth class? Have you verified that entropy features\
    \ are not simply tracking length?\n- If you subsample depth-filtered data to match\
    \ binary-filtered sample counts, does the perplexity advantage persist?\n- How\
    \ do you expect these results to transfer to generators >10B parameters?\n\n**Scores\
    \ (R1)**:\n- Soundness: 5/10\n- Experimental Rigor: 5/10\n- Reproducibility: 6/10\n\
    - Overall: 5/10\n- Confidence: 4/5\n\n---\n\n### Reviewer 2 (R2): Novelty + Related\
    \ Work\n\n**Paper Summary**: The paper frames generation depth estimation as a\
    \ new task beyond binary synthetic text detection, introduces a 7-feature \"distributional\
    \ fingerprint\" using reference-model entropy statistics, and empirically tests\
    \ whether non-paraphrastic generation chains converge or diverge. It reports comprehensive\
    \ experiments supporting monotonic divergence (H2) and demonstrates a practical\
    \ depth-aware data curation application.\n\n**Strengths**:\n- **Valuable problem\
    \ formulation**: The shift from binary real/synthetic detection to ordinal depth\
    \ estimation is a genuine conceptual contribution. The observation that gen-1\
    \ text is useful for training while gen-2+ is not — and that binary detectors\
    \ can't make this distinction — is practically important\n- **Clean theoretical\
    \ framing**: The H1 (convergence) vs H2 (divergence) dichotomy, and the finding\
    \ that paraphrastic chains follow H1 while non-paraphrastic follow H2, provides\
    \ a unifying framework that connects to attractor cycle theory [Briesch et al.\
    \ 2025]\n- **Well-structured paper**: The paper is clearly written, logically\
    \ organized, and the claims are well-mapped to experiments. Tables are informative\
    \ and self-contained\n- **Practical relevance**: The depth-aware filtering application\
    \ (Section 5.5) directly addresses a real need in training data curation. The\
    \ finding that depth-filtering retains more data at better quality than binary\
    \ filtering is actionable\n- **Comprehensive evaluation axes**: Testing across\
    \ generators, domains, prompt types, reference models, and editing conditions\
    \ covers the major generalization concerns\n\n**Weaknesses**:\n- **Critically\
    \ thin related work**: The paper cites only 5 references. For AAAI, this is unacceptable\
    \ and signals insufficient engagement with the literature. Major omissions:\n\
    \  - **Perplexity-based detection lineage**: DetectGPT [Mitchell et al. 2023],\
    \ GLTR [Gehrmann et al. 2019], DNA-GPT [Yang et al. 2023] — the reference-model\
    \ entropy features are functionally similar to these methods' use of model perplexity/log-likelihood\
    \ for detection\n  - **Data contamination detection**: Shi et al. 2024 (\"Detecting\
    \ Pretraining Data from LLMs\"), Oren et al. 2024, Golchin & Surdeanu 2024 — directly\
    \ relevant to the motivating problem\n  - **Model collapse theory**: Alemohammad\
    \ et al. 2024 (\"Self-Consuming Generative Models\"), Dohmatob et al. 2024 (\"\
    A Tale of Tails\"), Gerstgrasser et al. 2024 — multiple theoretical frameworks\
    \ beyond Shumailov et al. that analyze iterative generation dynamics\n  - **LLM\
    \ watermarking**: Kirchenbauer et al. 2023, Zhao et al. 2023 — relevant detection\
    \ alternatives not discussed\n  - **OOD detection**: The reference-model features\
    \ are functionally OOD detection features (measuring how \"out-of-distribution\"\
    \ text is relative to the reference model). Hendrycks & Gimpel 2017, Liang et\
    \ al. 2018 — this connection is completely missed\n  - **Data quality scoring\
    \ / selection**: DSIR [Xie et al. 2023], QuRating [Wettig et al. 2024] — directly\
    \ relevant to the data curation application\n  - **Iterative LLM generation studies\
    \ beyond paraphrasing**: Multiple studies on recursive summarization, chain-of-thought\
    \ degradation, etc.\n\n- **Overclaimed methodological novelty**: \"Distributional\
    \ fingerprinting\" is presented as a new method, but the 5 reference-model features\
    \ are standard NLL summary statistics (mean, std, min, max, and a tail quantile).\
    \ This is functionally equivalent to perplexity-based OOD detection applied to\
    \ the depth estimation task. The genuine novelty is in the *application* and *problem\
    \ formulation*, not the features or method. The paper should be more honest about\
    \ this\n- **Incremental technical contribution**: XGBoost on 7 handcrafted features\
    \ is extremely simple. While simplicity can be a virtue (and the paper argues\
    \ this in Table 15), the features themselves lack novelty — entropy statistics\
    \ under a reference model have been the backbone of synthetic text detection since\
    \ GLTR (2019). The contribution is primarily empirical/conceptual, not methodological\n\
    - **H1/H2 framing partially overclaimed**: H2 (monotonic divergence) is presented\
    \ as a novel finding, but model collapse literature (Shumailov et al., Alemohammad\
    \ et al.) already established that iterative generation leads to distributional\
    \ drift. The paper's specific contribution is showing this at the *text-level*\
    \ (rather than model-level) and distinguishing paraphrastic from non-paraphrastic\
    \ chains — this is valuable but the novelty is more limited than the paper suggests\n\
    - **Missing connection to OOD detection**: The reference-model features fundamentally\
    \ measure how \"out-of-distribution\" the text is relative to the reference model's\
    \ training data (human text). This is exactly the OOD detection setup. The paper\
    \ misses an opportunity to connect to a large, mature literature and properly\
    \ position its contribution\n\n**Questions for Authors**:\n- How do you differentiate\
    \ your reference-model entropy features from perplexity-based detection methods\
    \ like DetectGPT, which also use model log-likelihoods?\n- Have you compared against\
    \ any data quality scoring methods (e.g., DSIR, perplexity filtering as in CCNet)\
    \ that use similar signals for data selection?\n- Given that model collapse theory\
    \ already predicts progressive distributional degradation under iterative generation,\
    \ what specifically does the H2 finding add beyond confirming this at the text\
    \ level?\n- Why were only 5 references cited? This seems like a major oversight\
    \ for a venue like AAAI\n\n**Missing Related Work (critical gaps)**:\n1. Mitchell\
    \ et al. 2023 — DetectGPT (perplexity curvature, directly comparable approach)\n\
    2. Gehrmann et al. 2019 — GLTR (reference-model token statistics for detection)\n\
    3. Yang et al. 2023 — DNA-GPT (divergent generation for detection)\n4. Alemohammad\
    \ et al. 2024 — Self-consuming generative models (model collapse theory)\n5. Dohmatob\
    \ et al. 2024 — Tail narrowing in iterative generation\n6. Kirchenbauer et al.\
    \ 2023 — Watermark for LLMs\n7. Shi et al. 2024 — Detecting pretraining data from\
    \ LLMs\n8. Hendrycks & Gimpel 2017 — Baseline for OOD detection\n9. Xie et al.\
    \ 2023 — DSIR data selection\n10. Wettig et al. 2024 — QuRating data quality\n\
    \n**Scores (R2)**:\n- Novelty: 5/10\n- Related Work: 3/10\n- Significance: 6/10\n\
    - Clarity: 7/10\n- Overall: 5/10\n- Confidence: 4/5\n\n---\n\n## Step 2: Cross-Sharing\n\
    \n**R1 after seeing R2's review**: R2's identification of the missing OOD detection\
    \ connection reinforces my concern about reference model circularity — if these\
    \ features are just OOD detection, then the downstream experiment (fine-tuning\
    \ the same reference model) is essentially testing whether OOD scores from a model\
    \ predict that model's own perplexity, which is nearly tautological. The thin\
    \ related work also means the paper doesn't adequately compare against perplexity-based\
    \ detection methods that use similar signals, making it hard to assess the true\
    \ marginal value of the depth framing.\n\n**R2 after seeing R1's review**: R1's\
    \ methodological concerns strengthen my assessment that the technical contribution\
    \ is incremental. The text length confound is particularly damning — if entropy\
    \ features are tracking length rather than genuine distributional drift, the entire\
    \ theoretical narrative collapses. The data size confound in the downstream experiment\
    \ is also critical: the headline 5.2% improvement could be artifactual. The Spearman\
    \ ρ on n=3 concern is well-taken and emblematic of a pattern where the paper presents\
    \ simple relationships as more statistically rigorous than they are.\n\n---\n\n\
    ## Step 3: Convergence\n\n### Points of Agreement\n1. **Problem formulation is\
    \ valuable**: Both reviewers agree that moving from binary detection to ordinal\
    \ depth estimation is a genuine, practically important contribution. The depth-aware\
    \ data curation framing is well-motivated\n2. **H1/H2 dichotomy is the paper's\
    \ strongest contribution**: The clean empirical separation between convergent\
    \ paraphrastic and divergent non-paraphrastic chains is the most novel and interesting\
    \ finding\n3. **Experimental breadth is impressive**: 12 experiments covering\
    \ major generalization axes is thorough\n4. **Related work is critically insufficient**:\
    \ 5 references is far below AAAI standards. Missing DetectGPT, GLTR, model collapse\
    \ extensions, OOD detection, and data quality scoring literatures\n5. **Methodological\
    \ novelty is overclaimed**: The features are standard NLL statistics; the novelty\
    \ is in problem formulation and application, not in the method itself\n6. **Key\
    \ confounds undermine core claims**: Reference model circularity, text length\
    \ confound, data size confound in downstream comparison, and the n=3 correlation\
    \ each weaken specific claims\n7. **Generator scale limitation is significant**:\
    \ Testing only ≤2.8B models limits practical relevance for modern contamination\
    \ scenarios\n8. **Paper is clearly written**: Both reviewers acknowledge good\
    \ presentation quality\n\n### Points of Disagreement\n- R1 weighs experimental\
    \ confounds more heavily (4/10), while R2 weighs novelty and positioning more\
    \ (5/10). After discussion, both agree the confounds are fixable while the thin\
    \ related work is a more fundamental framing problem that would require substantial\
    \ rewriting.\n\n### Consensus Assessment\nThe paper addresses a timely, well-motivated\
    \ problem (depth estimation beyond binary detection) and provides an impressively\
    \ thorough experimental evaluation. The H1/H2 framework connecting to attractor\
    \ cycle theory is the strongest conceptual contribution. However, three major\
    \ issues prevent acceptance:\n\n1. **Related work and positioning are critically\
    \ deficient** — 5 references is unacceptable for AAAI, and the missing connection\
    \ to OOD detection literature means the paper's \"novelty\" claims are overstated\n\
    2. **Multiple uncontrolled confounds** weaken the empirical claims — particularly\
    \ reference model circularity in the downstream experiment, text length confound,\
    \ and data size confound in the filtering comparison\n3. **Methodological novelty\
    \ is incremental** — the features are standard NLL summary statistics, and XGBoost\
    \ on 7 features is extremely simple. The paper should reposition as an empirical/conceptual\
    \ contribution rather than a methodological one\n\n---\n\n## Step 4: Consolidated\
    \ Scores\n\n| Dimension | R1 | R2 | Consensus |\n|-----------|----|----|-----------|\n\
    | Soundness | 5 | — | 5 |\n| Novelty | — | 5 | 5 |\n| Significance | — | 6 | 6\
    \ |\n| Clarity | — | 7 | 7 |\n| Experimental Rigor | 5 | — | 5 |\n| Related Work\
    \ | — | 3 | 3 |\n| **Overall** | **5** | **5** | **5** |\n| Confidence | 4/5 |\
    \ 4/5 | 4/5 |\n\n**Overall Score: 5/10 — Borderline / Weak Reject**\n\n**Meta-review\
    \ Summary**: This paper addresses an important and timely problem — estimating\
    \ the generation depth of text beyond binary real/synthetic classification. The\
    \ H1 (convergence) vs H2 (divergence) theoretical framing and the empirical demonstration\
    \ that non-paraphrastic chains diverge while paraphrastic chains converge is the\
    \ paper's strongest contribution. The experimental breadth (12 experiments across\
    \ generators, domains, prompt types) is commendable.\n\nHowever, three major issues\
    \ prevent recommendation for acceptance at AAAI:\n\n(1) The related work section\
    \ is critically insufficient (5 references), missing entire relevant subfields\
    \ including perplexity-based detection (DetectGPT, GLTR), model collapse theory\
    \ extensions, OOD detection, and data quality scoring. The paper's features are\
    \ functionally equivalent to standard OOD detection and this connection must be\
    \ acknowledged and discussed.\n\n(2) Multiple experimental confounds weaken the\
    \ empirical claims: reference model circularity in the downstream experiment (Pythia-410M\
    \ is both the feature extractor and the evaluation model), uncontrolled text length\
    \ across depth classes, data size confound in the filtering comparison (9,500\
    \ vs 6,100 samples), and a Spearman correlation reported on only 3 data points.\n\
    \n(3) The methodological contribution is overclaimed — \"distributional fingerprinting\"\
    \ is NLL summary statistics under a reference model, which has been used for synthetic\
    \ text detection since GLTR (2019). The genuine novelty is in the problem formulation\
    \ and application, and the paper should be repositioned accordingly.\n\n**Recommendation**:\
    \ Reject with encouragement to revise. A revised version should: (a) substantially\
    \ expand related work to 25+ references with proper positioning against perplexity-based\
    \ detection and OOD detection, (b) address the reference model circularity by\
    \ using an independent model for downstream evaluation, (c) add text-length-controlled\
    \ ablations, (d) match sample counts in the filtering comparison, (e) test on\
    \ at least one generator >7B parameters, and (f) reposition the contribution as\
    \ primarily empirical/conceptual rather than methodological.\n\n---\n\n## Experiment\
    \ Coverage Assessment\n\nAll 12 planned experiments from the design document are\
    \ represented in the paper:\n1. ✅ Feature ablation (Section 5.1, Tables 1-2)\n\
    2. ✅ Cross-generator evaluation (Section 5.2, Tables 3-4)\n3. ✅ Cross-family reference\
    \ model (Section 5.3, Table 5)\n4. ✅ Downstream utility (Section 5.5, Tables 7-8)\n\
    5. ✅ Prompt type comparison (Section 5.6, Table 9)\n6. ✅ Paraphrastic comparison\
    \ (Section 5.4, Table 6)\n7. ✅ Cross-model chains (Section 5.7, Table 10)\n8.\
    \ ✅ Multi-domain seeds (Section 5.8, Table 11)\n9. ✅ Finer-grained ordinal (Section\
    \ 5.9, Table 12)\n10. ✅ Human edit robustness (Section 5.10, Table 13)\n11. ✅\
    \ LD-Score feature (Section 5.11, Table 14)\n12. ✅ End-to-end classifier (Section\
    \ 5.12, Table 15)\n\nCoverage is complete. The paper presents all planned experiments,\
    \ though several lack figures described in the experiment plan (e.g., t-SNE plots,\
    \ confusion matrix heatmaps, parallel coordinate plots). The paper is text-and-table-only\
    \ with no figures, which weakens the visual presentation expected at a venue like\
    \ AAAI.\n"

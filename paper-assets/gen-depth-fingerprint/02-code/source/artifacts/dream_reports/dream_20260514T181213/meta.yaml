  - name: prompt_type_comparison
    plan_id: plan_005
    description: 'Generate chains with 3 prompt types (continuation, elaboration,
      inspired_rewriting) using Pythia-2.8B on 1000 Wikipedia seeds × 5 depths. Compare
      depth signal preservation across prompt types. Tests whether semantic divergence
      from source correlates with depth signal.

      '
    expected_results:
      continuation_macro_f1: 0.85
      elaboration_macro_f1: 0.8
      inspired_rewriting_macro_f1: 0.72
      continuation_entropy_drift_per_depth: 0.18
      elaboration_entropy_drift_per_depth: 0.14
      inspired_rewriting_entropy_drift_per_depth: 0.1
      cross_prompt_train_test_macro_f1: 0.74
      prompt_type_drift_rate_spearman: 0.91
    result_rationale: 'Continuation preserves the strongest depth signal (F1=0.85)
      because each generation step continues directly from the previous output, maximizing
      the accumulation of distributional drift. Elaboration (F1=0.80) injects some
      new semantic direction via the prompt instruction, which partially resets the
      drift trajectory at each step — drift still accumulates but at a slower rate.
      Inspired rewriting (F1=0.72) has the most semantic freedom: the model is instructed
      to produce text "inspired by" the input, allowing it to diverge from the drift
      trajectory and partially re-anchor to its pretraining distribution. The strong
      correlation between per-depth entropy drift rate and classification F1 (Spearman
      ρ=0.91) confirms the theoretical prediction: more constrained generation → faster
      drift accumulation → stronger depth signal. Cross-prompt-type transfer (F1=0.74)
      is moderate, indicating that the drift signature is partially shared across
      prompt types but the rate differences create distribution shift in feature space.

      '

  - name: feature_ablation
    plan_id: plan_001
    description: 'Ablation on existing MVP data (4609 records, Pythia-2.8B generator,
      Pythia-410M reference, Wikipedia seeds). Three conditions: (A) reference-only
      features (entropy_mean, entropy_std, entropy_min, entropy_max, tail_decay),
      (B) surface-only features (ttr, hapax_ratio), (C) full 7-feature set. Same XGBoost
      classifier, 5-fold stratified CV, 3-class (gen-0/gen-1/gen-2+).

      '
    expected_results:
      ref_only_macro_f1: 0.79
      ref_only_cv_std: 0.018
      ref_only_gen0_f1: 0.91
      ref_only_gen1_f1: 0.71
      ref_only_gen2plus_f1: 0.74
      surface_only_macro_f1: 0.63
      surface_only_cv_std: 0.022
      surface_only_gen0_f1: 0.82
      surface_only_gen1_f1: 0.52
      surface_only_gen2plus_f1: 0.55
      full_macro_f1: 0.87
      full_cv_std: 0.012
      full_gen0_f1: 0.96
      full_gen1_f1: 0.81
      full_gen2plus_f1: 0.83
      ref_minus_surface_delta: 0.16
      mcnemar_p_ref_vs_surface: 3.0e-05
      permutation_importance_entropy_mean: 0.28
      permutation_importance_entropy_std: 0.19
      permutation_importance_hapax_ratio: 0.14
      permutation_importance_ttr: 0.09
    result_rationale: 'MVP feature importance (hapax_ratio=0.30) was inflated by XGBoost''s
      split-gain metric, which overweights high-cardinality continuous features with
      many useful split points. When surface features are ablated, the 5 reference-model
      features retain macro-F1=0.79 because they directly measure the generator''s
      deviation from the reference model''s next-token distribution — a signal that
      accumulates monotonically with depth as the generator''s output drifts further
      from human text. Entropy_mean captures the average surprise under the reference
      model (increases with depth as generated text occupies lower-probability regions),
      while entropy_std captures the increasing variance of surprise (deeper text
      alternates between familiar patterns and novel drift). Surface features alone
      (F1=0.63) capture only vocabulary impoverishment — TTR and hapax_ratio decline
      with depth as generators recycle high-frequency tokens — but this is a weaker,
      noisier proxy. The 0.16 delta and significant McNemar test confirm reference
      features carry independent, dominant signal. The full set achieves F1=0.87 (up
      from MVP''s 0.84) because retuned hyperparameters on the same data with proper
      ablation awareness extract slightly more complementary value. Permutation importance
      (which avoids split-gain bias) reranks entropy_mean as the top feature.

      '

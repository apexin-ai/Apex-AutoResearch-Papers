  - name: downstream_utility
    plan_id: plan_004
    description: 'Fine-tune Pythia-410M on depth-stratified subsets of the plan_002
      data. Measure perplexity on held-out human test set as function of training
      data depth composition. Compare depth-aware filtering (keep gen-0 + gen-1, discard
      gen-2+) vs binary baselines (FastDetectGPT threshold, LD-Score threshold) for
      preserving downstream model quality.

      '
    expected_results:
      depth_quality_spearman_rho: 0.72
      ppl_gen0_only: 28.3
      ppl_gen1_only: 30.1
      ppl_gen2_only: 34.7
      ppl_gen3_only: 38.9
      ppl_gen4_only: 43.2
      ppl_mixed_uniform: 35.8
      ppl_depth_filtered_gen01: 29.0
      ppl_binary_fastdetectgpt: 31.8
      ppl_binary_ldscore: 32.1
      ppl_human_baseline: 27.5
      depth_filter_vs_binary_gap_pct: 5.2
      training_samples_kept_depth_filter: 0.42
      training_samples_kept_binary: 0.28
    result_rationale: 'Perplexity increases monotonically with training data depth
      (28.3→43.2 from gen-0→gen-4) because deeper-generation text has compounded distributional
      drift from human text — fine-tuning on it shifts the model''s learned distribution
      away from the human test set. The Spearman ρ=0.72 between depth and perplexity
      is strong but not perfect because individual samples vary in drift magnitude
      (some gen-3 texts are less drifted than some gen-2 texts). Depth-aware filtering
      (keep gen-0+gen-1, perplexity=29.0) outperforms binary baselines (~31.8–32.1)
      by 5.2% because binary detectors discard all synthetic text including useful
      gen-1 content that is distributionally close to human text. Binary filtering
      retains only 28% of data (mostly gen-0) while depth filtering retains 42% (gen-0
      + gen-1), providing more training data of acceptable quality. The gap between
      gen-0-only (28.3) and depth-filtered (29.0) is small, confirming that gen-1
      text is nearly as good as human text for training — the key practical insight
      for data curation.

      '

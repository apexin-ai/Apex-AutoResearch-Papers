  review_report: "---\ndream_id: dream_20260514T181213\ntier: median\noverall_score:\
    \ 5/10 — Marginally Below Accept (Weak Reject)\ntimestamp: 2026-05-14T18:55:59.393115+00:00\n\
    ---\n\n# Dream Review Report — Full Roundtable\n\n**Paper:** \"Distributional\
    \ Fingerprints of Recursive LLM Generation: Depth Estimation via Complementary\
    \ Multi-View Features\"\n**Venue Target:** AAAI 2027 (acceptance rate ~17.6%)\n\
    **Review Mode:** full (2 Reviewers, 4-step roundtable)\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### Reviewer 1 (R1) — Methods & Experiments Focus\n**Preliminary\
    \ Rating: 6/10 (marginally above threshold)**\n\n#### Strengths\n- **[R1-S1] Exceptional\
    \ experiment coverage.** All 12 imagined experiments from the design spec are\
    \ present in the paper: feature ablation, cross-generator evaluation, cross-family\
    \ reference models, downstream utility, prompt type comparison, paraphrastic comparison,\
    \ cross-model chains, multi-domain seeds, finer-grained ordinal, human edit robustness,\
    \ LD-Score integration, end-to-end classifier. No critical experimental gaps.\n\
    - **[R1-S2] Honest claim calibration.** The paper avoids overclaiming throughout.\
    \ Downstream utility is \"suggestive rather than definitive,\" cross-generator\
    \ degradation (~12 F1) is reported transparently, binary depth is correctly positioned\
    \ as the primary practical boundary with ordinal depth as secondary.\n- **[R1-S3]\
    \ Clean H1/H2 hypothesis testing.** Using paraphrastic chains as a control for\
    \ H1 (convergence) against continuation chains for H2 (divergence) is well-designed.\
    \ The feature plateau analysis (Table 9 area / Section 5.6) provides concrete\
    \ evidence.\n- **[R1-S4] Proper statistical testing on core claims.** McNemar\
    \ tests for feature complementarity (p < 0.001 for full vs. single-view; p = 0.42\
    \ for ref-only vs. surface-only), Kruskal-Wallis for perplexity trends (p < 10⁻⁵),\
    \ ANOVA for domain interaction (p = 0.003).\n\n#### Weaknesses\n- **[R1-W1] Downstream\
    \ utility (Contribution 3) lacks multi-seed validation.** The 1.8% PPL improvement\
    \ over FastDetectGPT appears to come from a single fine-tuning run. The paper\
    \ acknowledges \"single fine-tuning run variance may account for part of the gap\"\
    \ but still lists this as a main contribution. Without bootstrap CIs or multiple\
    \ seeds, this claim is unsupported.\n- **[R1-W2] Complementary signal claim (+11\
    \ F1) validated only in-distribution.** The feature ablation (Table 1) showing\
    \ full model (0.83) vs. single-view (0.72/0.71) is on MVP data (Pythia-2.8B generator,\
    \ pooled CV). The complementarity is never validated under the cross-generator\
    \ leave-one-out setting where the headline performance is 0.68. The +11 F1 gain\
    \ may shrink substantially under distribution shift.\n- **[R1-W3] Text-length\
    \ confound unaddressed.** Hapax ratio and TTR are mechanically sensitive to text\
    \ length. If generation chains produce texts of systematically different lengths\
    \ (plausible—continuation chains may produce longer/shorter texts at different\
    \ depths), surface features may be measuring length artifacts rather than depth-dependent\
    \ vocabulary depletion. No length normalization or length-controlled analysis\
    \ is reported.\n- **[R1-W4] Most tables report point estimates without confidence\
    \ intervals.** Tables 1, 3, 4, 5, 7, 8 all report F1 without CIs. For 5-fold CV,\
    \ bootstrap CIs on macro-F1 are standard and essential for assessing whether differences\
    \ are meaningful.\n- **[R1-W5] Zero figures in a 10-page paper.** The experiment\
    \ context YAML describes 10+ planned figures (box plots, scatter plots, confusion\
    \ matrices, Pareto frontiers, heatmaps). None appear in the paper. Figures are\
    \ critical for conveying feature trends, depth-dependent distributions, and the\
    \ Pareto trade-off. This is a severe presentation gap.\n- **[R1-W6] Only 5 references.**\
    \ Extremely sparse for a top venue. Even the immediate baselines (SynthID-Text,\
    \ additional model collapse papers) are mentioned without citations.\n\n#### R1\
    \ Questions for Authors\n1. What are the text length distributions by depth? Do\
    \ you observe systematic length differences? If so, have you tested length-normalized\
    \ surface features?\n2. Can you report the feature ablation (ref-only / surface-only\
    \ / full) under leave-one-generator-out conditions, not just in-distribution CV?\n\
    3. How many random seeds were used for the downstream fine-tuning experiment (Table\
    \ 7)?\n4. What decoding parameters (temperature, top-p, top-k) were used for generation\
    \ chain construction? How sensitive are results to these?\n\n---\n\n### Reviewer\
    \ 2 (R2) — Novelty & Related Work Focus\n**Preliminary Rating: 5/10 (marginally\
    \ below threshold)**\n\n#### Strengths\n- **[R2-S1] Legitimate and timely problem\
    \ formulation.** \"Generation depth estimation\" as ordinal classification is\
    \ genuinely new. Prior work provides only binary real/synthetic labels. The framing\
    \ is well-motivated by the data curation use case.\n- **[R2-S2] Thorough experimental\
    \ matrix.** 5 generators × 4 domains × 3 chain types × multiple granularities,\
    \ with ablations and robustness checks. The breadth is commendable for a paper\
    \ of this scope.\n- **[R2-S3] Honest reporting and well-executed complementarity\
    \ analysis.** The error-set overlap analysis (~30%), McNemar tests, and Section\
    \ 5.10 failure-mode analysis provide genuine evidence. The prompt-type-dependent\
    \ feature importance shifts add depth.\n\n#### Weaknesses\n- **[R2-W1] Limited\
    \ methodological novelty — features are entirely off-the-shelf.** All seven features\
    \ are standard NLP/information-theoretic measures. Entropy statistics under a\
    \ reference model are the backbone of DetectGPT/FastDetectGPT. TTR and hapax ratio\
    \ are textbook corpus linguistics measures (used since Zipf, 1935). There is no\
    \ novel feature engineering, algorithm, or theoretical framework. The contribution\
    \ is applying known features to a new classification target. For AAAI at 17.6%\
    \ acceptance, at least one genuinely novel methodological component is expected.\n\
    - **[R2-W2] \"Complementary multi-view\" framing overstates feature concatenation.**\
    \ Combining two feature groups via XGBoost is standard feature engineering, not\
    \ multi-view learning. Multi-view learning typically involves principled methods\
    \ (CCA, co-training, multi-kernel learning). Listing this as Contribution 2 inflates\
    \ a routine practice.\n- **[R2-W3] H1/H2 hypothesis framing formalizes a predictable\
    \ observation.** That unconstrained chains diverge while semantically-constrained\
    \ chains converge is almost definitional. Briesch et al. already proved convergence\
    \ for paraphrasing. The paper provides no formal model of *why* H2 holds — only\
    \ empirical observation of monotonic trends.\n- **[R2-W4] Severely underdeveloped\
    \ related work (5 citations total).** Critical missing lines:\n  - **Membership\
    \ inference:** Shokri et al. 2017, Carlini et al. 2021, Shi et al. 2024 (\"Detecting\
    \ Pretraining Data\")\n  - **Dataset contamination:** Golchin & Surdeanu 2023,\
    \ Oren et al. 2024\n  - **LLM fingerprinting/source attribution:** Li et al. 2024,\
    \ Zhao et al. 2024\n  - **Additional model collapse:** Alemohammad et al. ICLR\
    \ 2024 (\"Self-Consuming Models Go MAD\"), Dohmatob et al. 2024, Guo et al. 2024\
    \ (\"Curious Decline of Linguistic Diversity\")\n  - **Watermarking (cited without\
    \ reference):** Kirchenbauer et al. 2023, Christ et al. 2024\n  - **Zero-shot\
    \ detection beyond DetectGPT:** DNA-GPT (Yang et al. 2024), Binoculars (Hans et\
    \ al. 2024), GLTR (Gehrmann et al. 2019)\n  - **Vocabulary diversity in LLM outputs:**\
    \ Guo et al. 2024, Padmakumar & He 2024\n- **[R2-W5] Generator scale limited to\
    \ ≤2.8B parameters.** No frontier-scale models (7B+). Frontier models produce\
    \ text much closer to human distributions, likely compressing the depth signal.\
    \ This substantially weakens generalizability claims for a 2027 submission.\n\
    - **[R2-W6] Ecological validity concerns.** Real recursive contamination involves\
    \ partial quoting, editing, summarization, multi-model mixing — not clean sequential\
    \ chains. The 5-point degradation from single-model to cross-model chains suggests\
    \ further degradation under truly realistic conditions.\n\n#### R2 Questions for\
    \ Authors\n1. Have you tested whether a simple PPL threshold achieves comparable\
    \ 3-class performance? The monotonic PPL-depth relationship seems strong enough\
    \ for a single-feature baseline.\n2. How stable is the ~30% error overlap across\
    \ generators and domains?\n3. What happens with temperature/top-p variations at\
    \ generation time?\n4. How do you disentangle \"depth signal\" from \"architecture\
    \ familiarity signal\" given Pythia-410M reference with 2 Pythia generators?\n\
    \n---\n\n## Step 2: Cross-Share — Points of Convergence\n\nAfter exchanging reviews,\
    \ R1 and R2 identified the following areas of agreement:\n\n| # | Point of Agreement\
    \ | R1 | R2 |\n|---|---|---|---|\n| 1 | Problem formulation is genuinely novel\
    \ and well-motivated | S2-related | S1 |\n| 2 | Experimental breadth is comprehensive\
    \ and thorough | S1 (12/12 experiments) | S2 |\n| 3 | Claims are honestly calibrated\
    \ throughout | S2 | S3 |\n| 4 | Downstream utility claim (1.8% PPL) is weak/unvalidated\
    \ | W1 | W5 |\n| 5 | Reference list (5 citations) is unacceptable for top venue\
    \ | W6 | W4 |\n| 6 | Missing confidence intervals on main results | W4 | Implied\
    \ |\n| 7 | Complementarity analysis (§5.10) is the paper's best section | S4 (R1\
    \ added this) | S3 (analogous) |\n\n## Step 3: Convergence Discussion — Points\
    \ of Divergence\n\n| # | Divergence | R1 Position | R2 Position | Resolution |\n\
    |---|---|---|---|---|\n| 1 | **Methodological novelty sufficiency** | R1 is less\
    \ concerned; the problem + empirical thoroughness may compensate | R2 views it\
    \ as the primary deficit; off-the-shelf features are insufficient for AAAI | **Converge\
    \ toward R2.** At 17.6% acceptance rate, problem novelty alone without methodological\
    \ contribution is a high bar. The paper reads as a thorough empirical study, which\
    \ AAAI values less than novel methods. |\n| 2 | **\"Complementary multi-view\"\
    \ as contribution** | R1 accepts it as an empirical finding | R2 views it as inflated\
    \ feature concatenation | **Converge toward middle.** The complementarity *finding*\
    \ is real and supported (30% error overlap, McNemar). But framing it as a standalone\
    \ contribution overstates standard practice. Downgrade from \"contribution\" to\
    \ \"finding.\" |\n| 3 | **H1/H2 theoretical value** | R1 values the clean experimental\
    \ design | R2 views the outcome as predictable | **Converge toward R2 with nuance.**\
    \ The result is predictable in hindsight, but the experimental validation (plateau\
    \ analysis, drift rate comparison) adds empirical substance. Not a major contribution,\
    \ but a credible secondary finding. |\n| 4 | **Overall score** | 6/10 | 5/10 |\
    \ **Converge at 5/10.** The severe related work gap (5 citations), lack of methodological\
    \ novelty, unvalidated downstream utility, and missing CIs collectively push below\
    \ the acceptance threshold. The problem formulation and experimental thoroughness\
    \ are genuine strengths but insufficient to compensate. |\n\n---\n\n## Step 4:\
    \ Consolidated Assessment\n\n### Overall Score: 5/10 — Marginally Below Accept\
    \ (Weak Reject)\n\n### Decision Rationale\nThe paper introduces a genuinely novel\
    \ and timely problem — generation depth estimation beyond binary detection — and\
    \ supports it with an admirably comprehensive experimental matrix covering 12\
    \ distinct ablations. Claims are honestly calibrated throughout, which is commendable.\
    \ However, for AAAI at ~17.6% acceptance rate, the paper has three critical deficits\
    \ that prevent acceptance:\n\n1. **No methodological novelty.** All seven features\
    \ are standard NLP/information-theoretic measures. The classifier is off-the-shelf\
    \ XGBoost. The reference-model setup is identical to DetectGPT-family methods.\
    \ The paper contributes a new *task* but not a new *method*, and the modest performance\
    \ (0.68 cross-generator F1 for 3-class) suggests the task remains far from solved.\n\
    \n2. **Severely underdeveloped related work.** Five references is unacceptable.\
    \ Major missing lines include membership inference, dataset contamination, LLM\
    \ fingerprinting, additional model collapse work, watermarking, and vocabulary\
    \ diversity studies. This suggests insufficient engagement with the broader literature.\n\
    \n3. **Unvalidated downstream utility.** The 1.8% PPL advantage (Contribution\
    \ 3) is based on apparently single-run fine-tuning with no CIs or significance\
    \ test. The authors themselves flag this uncertainty. A listed main contribution\
    \ that may not be statistically significant undermines the paper's claims.\n\n\
    ### Dimension Scores (AAAI scale)\n\n| Dimension | Score | Notes |\n|---|---|---|\n\
    | **Soundness** | 3/5 | Core claims (complementarity, H2 support) are well-tested.\
    \ But downstream utility is unvalidated, complementarity is only shown in-distribution,\
    \ and text-length confound is unaddressed. |\n| **Novelty** | 2/5 | Problem formulation\
    \ is new. Methodology is entirely standard components (off-the-shelf features\
    \ + XGBoost). H1/H2 framing has limited theoretical novelty. |\n| **Significance**\
    \ | 3/5 | The problem matters for data governance. But practical impact is limited\
    \ by modest cross-generator performance and the availability of simpler alternatives\
    \ (PPL threshold). |\n| **Presentation** | 2/5 | Clear writing. But zero figures\
    \ in 10 pages, only 5 references, no CIs on main results, undefined acronyms (MVP).\
    \ Severe presentation gaps. |\n| **Reproducibility** | 3/5 | Most details provided.\
    \ But tail decay fitting procedure underspecified, decoding parameters not reported,\
    \ dataset not released. |\n\n### Consolidated Strengths\n1. **Novel problem formulation.**\
    \ Generation depth estimation as ordinal classification is a legitimate new task\
    \ with clear practical motivation for data curation.\n2. **Comprehensive experimental\
    \ coverage.** 12 distinct experiments spanning 5 generators, 4 domains, 3 prompt\
    \ types, 2 chain paradigms, 3 granularities, robustness tests, and end-to-end\
    \ comparison. All imagined experiments from the design spec are present.\n3. **Honest\
    \ claim calibration.** The paper transparently reports limitations: 12-point cross-generator\
    \ drop, modest 1.8% downstream advantage, 5-class degradation to 0.51. Binary\
    \ depth is correctly positioned as the primary practical output.\n4. **Well-executed\
    \ complementarity analysis.** The ~30% error overlap, McNemar tests, failure-mode\

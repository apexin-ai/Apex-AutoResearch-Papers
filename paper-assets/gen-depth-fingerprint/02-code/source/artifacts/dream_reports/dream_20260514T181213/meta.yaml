  - name: cross_family_reference_model
    plan_id: plan_003
    description: 'Re-extract features using non-Pythia reference models (OLMo-2-1B,
      Qwen3.5-0.8B) on the plan_002 dataset (25K chains). Compare classification performance
      across 3 reference model families. Tests whether the fingerprint is reference-model-agnostic.

      '
    expected_results:
      pythia_410m_ref_macro_f1: 0.86
      olmo_2_1b_ref_macro_f1: 0.76
      qwen3_5_0_8b_ref_macro_f1: 0.74
      ensemble_3refs_macro_f1: 0.88
      cross_ref_leave_one_out_macro_f1: 0.75
      feature_correlation_pythia_olmo_entropy_mean: 0.82
      feature_correlation_pythia_qwen_entropy_mean: 0.78
    result_rationale: 'All three reference models detect depth signal (F1≥0.74) because
      any well-trained LM assigns progressively lower probability to deeper-generation
      text — the drift is a property of the text, not the measuring instrument. Pythia-410M
      performs best (0.86) because it was the reference model used during pipeline
      development and its capacity is calibrated for sensitivity to distributional
      shifts (small enough to be "surprised" by drift, large enough to model human
      text well). OLMo-2-1B (0.76) and Qwen3.5-0.8B (0.74) are slightly weaker because
      their different pretraining distributions create different baselines for "expected"
      text, adding noise to depth features. High cross-reference entropy_mean correlations
      (0.78–0.82) confirm that all three models agree on the direction of drift even
      if magnitudes differ. The 3-reference ensemble (0.88) exceeds any single reference,
      indicating that diverse reference models capture complementary aspects of distributional
      drift. This decisively addresses RC2 — the signal is not a Pythia-specific artifact.

      '

    # Dream Review Report: Vocabulary Impoverishment as a Shallow Fingerprint of Recursive
    LLM Generation


    **Venue**: AAAI 2027 (acceptance rate ~17.6%, scale 1–10)

    **Review mode**: Full (2 Reviewers + Roundtable)

    **Dream ID**: 20260514T181213


    ---


    ## Reviewer Assignments

    - **R1**: Methods and Experiments

    - **R2**: Novelty and Related Work


    ---


    ## Step 1: Independent Reviews


    ### R1 Review: Methods and Experiments


    #### Summary

    The paper presents a comprehensive empirical investigation (12 experiments, 5
    generators, 4 domains, 25K+ chains) testing convergence (H1) vs. divergence (H2)
    in recursive non-paraphrastic LLM generation. The experimental program is impressively
    thorough and the negative-result framing is honest. However, several methodological
    concerns limit the conclusions.


    #### Strengths (Methods/Experiments)

    - **S1: Comprehensive experimental coverage.** 12 experiments systematically dissect
    the depth estimation problem from feature ablation through downstream utility.
    The experimental progression — "what carries the signal → does it generalize →
    does it matter" — is logical and well-structured.

    - **S2: Appropriate ablation design.** The surface-only vs. reference-only vs.
    full comparison (Table 1) with paired bootstrap significance testing (p=0.18)
    is the right ablation to falsify the "distributional fingerprint" framing. Permutation
    importance (Table 2) provides complementary evidence.

    - **S3: Ecological validity experiments.** Cross-model chains (Table 8) and multi-domain
    seeds (Table 9) directly address real-world applicability — most papers would
    stop at within-generator results. The cross-model chain result (0.42 F1) is the
    most ecologically valid finding.

    - **S4: Multiple axes of generalization tested.** Generator, prompt type, domain,
    edit robustness, and model architecture (reference model choice) are all systematically
    varied. This is rare thoroughness.

    - **S5: End-to-end upper bound.** Including a QLoRA fine-tuned 0.8B model (Table
    14) to close the "maybe a bigger/learned model could find the signal" escape hatch
    is methodologically strong.


    #### Weaknesses (Methods/Experiments)

    - **W1: H1 vs. H2 conflation (critical).** The paper declares H1 (convergence)
    confirmed based on small KL divergence at depth 2-3 (KL_d2→d3 < 0.04 nats). However,
    this could reflect deceleration of drift rather than true convergence to a fixed
    point. No experiments test beyond depth 4, so the paper cannot distinguish "convergence
    by depth 2" from "slow continued drift that is undetectable at this sample size."
    A formal convergence criterion (e.g., feature values within ε of a limit for all
    depths beyond d*) is never defined. Table 6''s "Conv. Depth" column has no formal
    definition of convergence.

    - **W2: Model scale ceiling (≤2.8B).** All generators are small open-weight models.
    Frontier models (70B+, closed-source) may exhibit fundamentally different vocabulary
    dynamics — larger models have richer vocabularies and may deplete less predictably.
    The paper''s conclusions about "universal" convergence cannot be sustained without
    testing at scale. The 17.6% acceptance rate at AAAI demands broader generality
    claims.

    - **W3: No instruction-tuned or RLHF-aligned models.** Real-world web contamination
    primarily comes from instruction-tuned models (ChatGPT, Claude, etc.), not base
    pretrained models. RLHF alignment significantly alters output distributions, potentially
    creating different vocabulary dynamics. This is acknowledged in limitations but
    undermines the practical relevance claims.

    - **W4: Underpowered downstream evaluation.** The depth-aware vs. binary filtering
    comparison (Table 15-16) appears to be a single fine-tuning run. No error bars,
    no multiple random seeds, no confidence intervals on the -0.3% gap. At this magnitude,
    the conclusion "no advantage" requires demonstrating the gap is within noise,
    not just reporting a point estimate.

    - **W5: Reproducibility gaps.** Missing: exact prompt templates for continuation/elaboration/rewriting,
    random seeds, data split strategy details, exact generation length constraints,
    hardware specifications for the QLoRA experiment, and training hyperparameters
    for the random forest and ordinal logistic regression classifiers.

    - **W6: Fixed sampling parameters.** All experiments use nucleus sampling (p=0.95,
    T=1.0). Temperature and top-p/top-k significantly affect vocabulary diversity.
    The convergence finding may be sampling-parameter-specific rather than universal.
    No sensitivity analysis is provided.

    - **W7: Questionable 25K claim.** The abstract claims "25K+ chains" but the setup
    describes 500 seeds × 5 generators = 2,500 base chains (or 12,500 chain-depth
    pairs). The counting methodology is unclear.


    #### Questions for Authors (R1)

    - Q1: How do you formally define convergence? What KL threshold or feature-stability
    criterion distinguishes convergence from deceleration?

    - Q2: Have you tested with depth > 4? Even depth 8-10 would help distinguish true
    convergence from slow drift.

    - Q3: The downstream evaluation reports no error bars. How many fine-tuning runs
    were conducted? What is the standard deviation of perplexity across seeds?

    - Q4: How sensitive are the results to sampling temperature? Would T=0.3 or T=1.5
    change the convergence depth?

    - Q5: The QLoRA model uses Qwen3.5-0.8B — a model in the same family as one of
    the generators. Was cross-contamination between the classifier and generator family
    considered?


    #### Scores (R1)

    - Soundness: 5/10

    - Significance: 5/10

    - Overall: 5/10

    - Confidence: 4/5


    ---


    ### R2 Review: Novelty and Related Work


    #### Summary

    The paper formalizes ordinal depth estimation as a new task, tests H1 (convergence)
    vs. H2 (divergence) for non-paraphrastic chains, and finds H1 confirmed with depth
    signal confined to vocabulary impoverishment. While the problem formulation is
    novel and the hypothesis framework is clean, the paper suffers from critically
    sparse references (~9 citations), the vocabulary impoverishment observation is
    well-documented in prior work, and the "extension" of attractor cycle theory is
    purely empirical without theoretical depth.


    #### Strengths (Novelty/Related Work)

    - **S1: Genuine problem formulation novelty.** Framing generation depth estimation
    as an ordinal classification task (beyond binary real/synthetic) is a new conceptual
    contribution. No prior work has formally posed this task, and the motivation (risk-stratified
    data curation) is practical.

    - **S2: Clean hypothesis formalization.** The H1/H2 dichotomy is clearly stated,
    falsifiable, and directly testable. The finding that H1 holds for non-paraphrastic
    chains — contra the intuition that removing semantic-preservation constraints
    would enable unbounded drift — is a non-obvious result.

    - **S3: Honest negative-result framing.** The paper does not oversell its findings.
    The characterization of vocabulary impoverishment as "universal but shallow" is
    precise and useful.

    - **S4: Well-structured experimental progression.** The logical flow from "what
    carries the signal" → "does it generalize" → "does it matter" makes the negative
    cascade easy to follow.


    #### Weaknesses (Novelty/Related Work)

    - **W1: Critically sparse reference list (~9 citations).** AAAI papers typically
    cite 30-50 works. The paper engages with only three narrow threads (binary detection,
    model collapse, attractor cycles) and misses entire relevant subfields. This is
    far below venue expectations and fundamentally undermines positioning claims.

    - **W2: Missing connection to perplexity/OOD detection literature.** The 5 reference-model
    features are functionally NLL summary statistics — the same signal backbone used
    by DetectGPT, GLTR (Gehrmann et al., 2019), and Binoculars (Hans et al., 2024).
    The failure of these features to carry independent signal is predictable from
    OOD detection theory: if the generative process converges, OOD scores stabilize,
    and NLL statistics cannot distinguish deeper depths. This theoretical grounding
    is absent.

    - **W3: Model collapse literature engagement is superficial.** Only Shumailov
    et al. (2024) and Dohmatob et al. (2024) are cited. Major omissions: Alemohammad
    et al. (2024, "Self-Consuming Generative Models Go MAD"), Gerstgrasser et al.
    (2024, conditions for avoiding collapse), and most critically Guo et al. (2024,
    "Curious Decline of Linguistic Diversity") — which directly studies vocabulary
    impoverishment in LLM outputs, the paper''s central finding.

    - **W4: The "attractor cycle extension" novelty claim is weak.** The extension
    amounts to "we ran similar experiments on a different chain type and found convergence."
    There is no formal theoretical analysis of *why* autoregressive sampling induces
    convergence — no entropy-theoretic argument, no characterization of the sampling
    operator''s fixed-point properties. A genuine extension would require at least
    a mathematical sketch of the convergence mechanism.

    - **W5: Vocabulary impoverishment is a well-documented phenomenon.** Multiple
    studies document that LLM text exhibits reduced lexical diversity (Guo et al.
    2024, Padmakumar & He 2024, Holtzman et al. 2020). The paper treats this as novel
    ("vocabulary impoverishment as a universal but shallow fingerprint") when it is
    better characterized as confirming a known phenomenon in a new context.

    - **W6: Missing data quality/curation literature.** The downstream utility claim
    is not contextualized against established data quality methods: DSIR (Xie et al.,
    2023), CCNet (Wenzek et al., 2020), QuRating (Wettig et al., 2024). These methods
    already use perplexity and distributional features for data selection.

    - **W7: Missing synthetic text detection methods.** The detection landscape is
    much richer than presented: DNA-GPT (Yang et al., 2024), Binoculars (Hans et al.,
    2024), RADAR (Hu et al., 2023), GPTZero, and others. Several use reference-model
    statistics comparable to the paper''s features.

    - **W8: Negative-result framing faces an uphill battle.** Negative results papers
    succeed at AAAI when they overturn a widely-held belief or redirect an active
    research community. Depth estimation was not an active research direction before
    this paper, so the negative result preemptively closes a door that was not yet
    open, limiting corrective impact.

    - **W9: Inconsistent citation of attractor cycle work.** "Anonymous 2025" in the
    text raises questions about the reliability and availability of the theoretical
    foundation.


    #### Missing References (Critical)

    **Perplexity/OOD-based detection:**

    - Gehrmann et al., 2019 — GLTR

    - Hendrycks & Gimpel, 2017 — OOD baseline

    - Hans et al., 2024 — Binoculars

    - Yang et al., 2024 — DNA-GPT


    **Model collapse / iterative generation:**

    - Alemohammad et al., 2024 — Self-Consuming Generative Models Go MAD

    - Gerstgrasser et al., 2024 — Is Model Collapse Inevitable?

    - Guo et al., 2024 — Curious Decline of Linguistic Diversity (directly relevant)

    - Padmakumar & He, 2024 — Does Writing with LMs Reduce Content Diversity?


    **Data quality/curation:**

    - Xie et al., 2023 — DSIR

    - Wenzek et al., 2020 — CCNet

    - Wettig et al., 2024 — QuRating


    **NLG evaluation / vocabulary:**

    - Pillutla et al., 2021 — MAUVE

    - Holtzman et al., 2020 — Curious Case of Neural Text Degeneration


    #### Questions for Authors (R2)

    - Q1: How does your vocabulary impoverishment finding differ from Guo et al. (2024),
    beyond the addition of depth labels?

    - Q2: Have you considered formalizing the convergence mechanism? E.g., characterizing
    the sampling operator''s fixed-point properties or convergence rate as a function
    of temperature and nucleus threshold?

    - Q3: The anonymous attractor cycle citation — is this a published work, under
    review, or your own? The paper''s theoretical foundation rests on it.

    - Q4: Given that reference-model features are NLL summary statistics (same as
    DetectGPT/GLTR), does the failure of these features imply perplexity-based detectors
    are also limited to detecting vocabulary impoverishment?


    #### Scores (R2)

    - Novelty: 4/10

    - Significance: 5/10

    - Clarity: 6/10

    - Overall: 4/10

    - Confidence: 4/5



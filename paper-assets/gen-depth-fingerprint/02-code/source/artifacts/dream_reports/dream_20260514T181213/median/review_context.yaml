    ppl_kruskal_wallis_p: 1.0e-05
  result_rationale: 'hapax_ratio 是 MVP 中的主导特征（feature importance ~0.35），surface-only
    天然继承了这一优势， 所以 surface-only（0.72）和 ref-only（0.71）打平——不是因为 reference 特征弱，而是因为 hapax_ratio
    太强。但两组特征捕捉的是 distributional drift 的不同侧面：surface 特征测量词汇 贫化（type 减少），reference 特征测量概率质量重分布（entropy
    升高、tail 变陡）。这两个视角 在大部分样本上一致（都能检测 gen-0），但在边界案例上互补——surface 特征在词汇本身丰富的 generator（如
    Qwen）上失灵，reference 特征在输出分布接近参考模型的情况下失灵。Full model 的 +11 F1 跳跃（0.83 vs 0.72）来自这些互补的边界案例的正确分类，McNemar
    检验显著确认 组合增益不是噪声。H1/H2 trend 支持 H2（divergence）——所有特征在 depth 0-2 区间单调 变化，但 slope
    在 depth 3-4 变缓，说明 drift 速率递减而非匀速累积。Perplexity 预验证 显示 gen-0→gen-1 跳跃（+3.8 PPL）远大于
    gen-3→gen-4（+0.6 PPL），预示 Claim 3 的 downstream utility signal 存在但集中在低深度区间。


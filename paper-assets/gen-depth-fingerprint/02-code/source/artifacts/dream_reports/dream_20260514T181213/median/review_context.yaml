    chain 的 drift 是同一 generator 偏差的累积放大——pattern 规律且可预测。Cross-model chain 的 drift
    是多个 generator 偏差的叠加——每步引入不同的 distributional shift 方向，使深度 信号变成异质 mixture 而非 monotonic
    progression。gen-1 受影响最大（0.54），因为 gen-1 的 distributional 特征同时受 seed text 和 generator
    偏差的双重影响——cross-model 设置下 这两个影响更难分离。gen-0 仍然相对稳健（0.81），因为真实文本与任何 generator 输出的区别

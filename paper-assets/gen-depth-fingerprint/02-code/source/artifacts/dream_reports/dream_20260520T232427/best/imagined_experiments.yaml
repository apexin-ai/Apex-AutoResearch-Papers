    原因：depth filtering 在移除 deeper text 的同时也移除了 diverse training signal， random subsampling
    保留了更完整的 distributional coverage。 TOST at ±2% margin 确认等价 (p=1.1×10⁻⁴)：depth-aware
    和 random 在实际意义上无差异。 ±1% margin 未 reject (p=0.08)，这是 honest boundary — 极小 margin
    下无法确认等价， 但 ±2% 足以满足实际应用场景的 equivalence threshold。 depth0_only (ppl=2.681) 明显最差因为仅
    797 samples (严重不足 + 缺乏 diversity)。 Seed variance 极小 (<0.002) 因为 OLMo-1B fine-tuning
    在此 data scale 下非常稳定， Cohen''s d inflated 但 TOST 是 appropriate test。 这确立了 depth

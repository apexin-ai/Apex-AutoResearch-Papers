    随 depth 单调递减)，reference features 捕捉 NLL 分布位移 (entropy_mean drift)，两组信号互补。McNemar
    p=0 确认非冗余。 H2 drifting features 呈清晰单调趋势 (R²>0.89)：递归生成导致词汇空间收缩 和 NLL 均值下降 (recursive
    compression)。H1 stationary features 保持平坦 (tail_decay R²=0.03)：NLL 分布的 shape 参数在
    location shift 下近似不变。 entropy_std 弱趋势 (R²=0.41) 远低于 drifting 组，归为 intermediate
    不影响主叙事。 Perplexity 单调递减：deeper text 对 reference model 更 predictable， 因为 model

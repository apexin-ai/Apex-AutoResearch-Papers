tier: best
narrative_guidance: '原始 framing 完全成立。DDR 二分法 (drifting: hapax, TTR, entropy_mean |ρ|≥0.55;
  stationary: tail_decay, entropy_max |ρ|<0.10) 在 8+ generators / 5 families 上鲁棒，
  entropy_std 归为 weakly drifting (|ρ|≈0.20)，不破坏主叙事。 三条 claim 均有充分实验支撑：(1) LOGO binary
  F1=0.694 为 headline，LOFO 0.686 和 cross-model 0.830 验证泛化性；(2) DDR 跨 3 个 reference
  model 和 5 个 generator family 稳健， TOST 确认 shape feature stationarity；(3) negative
  downstream finding 以 TOST ±2% margin 确认。 Scope limitations (base-only, t≤0.7, ≤14B)
  诚实报告但不动摇核心 contribution。 论文按原 framing 直接提交 ARR。

  '

    noise floor。 Ordinal methods 不优于 standard XGBoost 因为 feature space 中的 ordinal
    structure 在 deeper depths 退化 — 非线性 plateau 而非 monotonic 递增。 CORAL 和 Frank-Hall
    假设 ordinal margin 在所有相邻 class pairs 间近似均匀， 但实际 gen-0→gen-1 margin >> gen-2→gen-3

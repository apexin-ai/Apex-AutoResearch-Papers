narrative_guidance: '核心 "universal differential response" framing 不成立。多数新家族 depth
  signal 极弱或模式不一致。 Reframe 为 "On the Limits of Generation Depth Estimation" —— 条件分析（何时有效/何时失败）本身就是贡献。
  Paper 从 method paper 转为 empirical boundary study。EMNLP weak accept 区间，靠 writing
  和 negative finding 叙事支撑。

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: 'Feature ablation (reference-only vs surface-only vs full) + H1/H2
    trend analysis + perplexity pre-validation. 在 worst 档中，reference features 的独立贡献极低，surface
    features 主导信号。

    '
  expected_results:
    full_macro_f1: 0.82
    reference_only_f1: 0.58
    surface_only_f1: 0.79
    ref_vs_full_delta_pp: 3.0
    surface_vs_full_delta_pp: 3.0
    h2_features_confirmed:
    - hapax_ratio
    - ttr
    h2_features_weak:
    - entropy_mean
    h1_features_confirmed:
    - tail_decay
    - entropy_std
    h1_features_ambiguous:
    - entropy_min
    - entropy_max
    entropy_mean_slope_r2: 0.41
    ttr_slope_r2: 0.72
    hapax_slope_r2: 0.75
    tail_decay_slope_r2: 0.08
    entropy_std_slope_r2: 0.05
    ppl_depth_0: 13.5
    ppl_depth_4: 1.7
    ppl_signal_exists: true
  result_rationale: '在 worst 档下，Pythia-on-Pythia 的 MVP 数据本身仍表现尚可（same-family signal
    不是问题）， 但 reference features 在 ablation 中仅贡献 +3pp，暗示 entropy_mean 的 drift 信号弱于预期。
    Surface features (TTR, hapax) 因 vocabulary impoverishment 效应主导，R² 高。 entropy_mean
    的 R² 仅 0.41（不是强线性趋势，部分 depth 有噪声 plateau）。 这预示着跨家族时 reference features 将更弱——因为
    drift 本身依赖 Pythia 特有的 token 分布。 Perplexity 仍随 depth 下降（这是 trivial 的——recursive
    generation 趋向 mode collapse）， 但这不等于分类器能利用这一信号。

    '
  tables:
  - name: 'Table: Feature Ablation (5-fold CV, Pythia-2.8B only)'
    columns:
    - Feature Set
    - Macro F1
    - 95% CI
    rows:
    - - Full (7 features)
      - '0.820'
      - '[0.807, 0.833]'
    - - Surface only (TTR + hapax)
      - '0.790'
      - '[0.776, 0.804]'
    - - Reference only (5 entropy + tail)
      - '0.580'
      - '[0.562, 0.598]'
  figures_description:
  - 'Feature trend plot: hapax_ratio 和 TTR 呈强单调下降 (R²>0.7)，entropy_mean 中等下降但 depth
    2-3 有 plateau (R²=0.41)，tail_decay/entropy_std 水平波动 (R²<0.1)'
  analysis: 'Surface features 解释绝大部分 variance。Reference features 独立贡献低是 worst case
    的早期信号： 如果 entropy_mean 的 drift 信号不强，跨家族泛化时这条线将进一步恶化（不同 reference model 对不同 generator
    的 NLL 分布响应不一致）。 Plan B activated: Claim 2 需 reframe 为 "complementary signal exists
    but surface features dominate"。

    '
- name: cross_generator_evaluation
  plan_id: plan_002
  description: '扩展至 5 generators (Pythia-2.8B, Pythia-1B, OLMo-2-1B, Qwen3-1.7B, Qwen3-0.6B)，LOGO
    CV 评估。 Worst 档：新家族泛化能力严重不足，overall LOGO F1 被拉低到边缘水平。

    '
  expected_results:
    logo_5gen_avg_f1_3class: 0.66
    logo_binary_f1_expanded: 0.64
    per_gen_held_out_f1:
      pythia-2.8b: 0.78
      pythia-1b: 0.74
      olmo-2-1b: 0.52
      qwen3-1.7b: 0.48
      qwen3-0.6b: 0.45
    per_gen_f1_std: 0.14
    worst_single_gen_f1: 0.45
    best_single_gen_f1: 0.78
    leave_one_family_out:
      pythia_held_out: 0.72
      olmo_held_out: 0.52
      qwen_held_out: 0.47
    family_out_delta: 0.25
    new_family_avg_held_out_f1: 0.48
    spearman_by_generator:
      pythia-2.8b:
        hapax_ratio: -0.65
        ttr: -0.6
        entropy_mean: -0.55
      pythia-1b:
        hapax_ratio: -0.58
        ttr: -0.52
        entropy_mean: -0.48
      olmo-2-1b:
        hapax_ratio: -0.22
        ttr: -0.18
        entropy_mean: -0.12
      qwen3-1.7b:
        hapax_ratio: -0.15
        ttr: -0.1
        entropy_mean: -0.08
      qwen3-0.6b:
        hapax_ratio: -0.12
        ttr: -0.09
        entropy_mean: -0.05
    seven_feat_vs_avg_logprob_pp: -0.5
    seven_feat_vs_best_baseline_pp: 0.3
  result_rationale: "Worst 档的核心假设：新家族 depth signal 极弱。Pythia 家族内部泛化良好（same tokenizer,\
    \ similar training data）， 但 OLMo/Qwen 的 depth drift 模式与 Pythia 截然不同： (1) Qwen\
    \ 系列使用不同 tokenizer + 大规模多语言预训练，vocabulary impoverishment 路径不同，\n    hapax_ratio/TTR\
    \ 的 drift 幅度小（Spearman 仅 -0.1 到 -0.15）；\n(2) OLMo 训练数据更干净（Dolma 数据集），recursive\
    \ generation 的 mode collapse 速度慢，\n    depth 2-4 的特征分布与 depth 1 差异小；\n(3) entropy_mean\
    \ 在新家族上几乎没有 drift（Spearman > -0.12），因为 Pythia-410M reference\n    对非 Pythia 家族文本的\
    \ NLL 分布本身就高且方差大，depth 变化被淹没。\n结果：LOGO CV 被 Qwen/OLMo 的低 held-out F1 严重拉低（0.45-0.52），overall\
    \ 降至 0.64-0.66。 7-feature ensemble 不再优于 Avg-LogProb（因为 reference features 对新家族无效，\
    \ 而 Avg-LogProb 至少能捕捉 perplexity 差异）。\n"
  tables:

  analysis: '5-class 结果彻底确认 depth resolution 上限。在 worst 档下，even binary (gen-1 vs gen-2+)
    已经挣扎，5-class 完全不可行。这为 reframe 提供数据支撑： "generation depth is discriminable at coarse
    granularity under specific conditions, but finer ordinal resolution exceeds the
    information content of distributional features."

    '
- name: end_to_end_classifier
  plan_id: plan_012
  description: 'QLoRA fine-tuned Qwen3.5-0.8B for end-to-end depth classification。
    Worst 档：learned representations 不显著优于 handcrafted features（或仅在 same-family 上优），
    跨家族同样失败。

    '
  expected_results:
    e2e_5class_macro_f1: 0.42
    e2e_3class_macro_f1: 0.71
    e2e_binary_f1: 0.68
    xgboost_7feat_3class_f1: 0.66
    e2e_vs_xgboost_delta_3class_pp: 5.0
    e2e_logo_cross_family_f1: 0.48
    e2e_per_generator:
      pythia-2.8b: 0.78
      pythia-1b: 0.75
      olmo-2-1b: 0.55
      qwen3-1.7b: 0.49
      qwen3-0.6b: 0.46
    overfitting_gap: 0.18
    train_f1: 0.89
    val_f1: 0.71
  result_rationale: "End-to-end model 有更多参数来拟合 training distribution，但在 worst 档下：\
    \ (1) Same-family generators (Pythia) 上 E2E 优于 XGBoost（+5pp），\n    因为 learned\
    \ representations 能捕捉 Pythia-specific 的 depth pattern；\n(2) Cross-family 上 E2E\
    \ 同样失败（0.48-0.55），因为 depth signal 本身不存在于这些家族——\n    no amount of representation\
    \ learning 能 extract 不存在的信号；\n(3) 明显 overfitting（train 0.89 vs val 0.71），E2E 模型学到了\
    \ training generators 的\n    spurious correlations 而非 generalizable depth features；\n\
    (4) 这强化了 worst 档叙事：问题不在方法（handcrafted vs learned），\n    而在于 depth signal 本身的 family-specificity。\n\
    Paper framing: \"Neither handcrafted distributional features nor learned representations\
    \ achieve reliable cross-family depth estimation, suggesting the signal itself\
    \ is family-dependent rather than a methodological limitation.\"\n"
  tables:
  - name: 'Table: E2E vs Handcrafted Features'
    columns:
    - Method
    - Same-family F1
    - Cross-family F1
    - Gap
    rows:
    - - QLoRA Qwen3-0.6B
      - '0.76'
      - '0.48'
      - '0.28'
    - - XGBoost 7-feature
      - '0.76'
      - '0.47'
      - '0.29'
    - - Avg-LogProb only
      - '0.72'
      - '0.49'
      - '0.23'
  figures_description:
  - 'Learning curve plot: training F1 持续上升至 0.89，validation F1 在 epoch 3 后 plateau
    于 0.71 并微降——overfitting'
  - 'Cross-family transfer heatmap: 对角线（same-family）深色，off-diagonal（cross-family）浅色，E2E
    和 XGBoost 模式几乎相同'
  analysis: E2E 结果是 worst 档叙事的 strongest evidence：如果 700M 参数的 fine-tuned LM 都不能 cross-family
    generalize，那问题 definitively 不是 feature engineering 的限制， 而是 depth signal 本身的 boundary。
    这成为 paper 的 key contribution 之一："systematic evidence that generation depth discriminability
    is bounded by model family, not methodology."

  figures_description:
  - 'Per-generator held-out F1 bar chart: Pythia 双柱高 (0.74-0.78)，OLMo/Qwen 三柱低 (0.45-0.52)，巨大落差'
  - 'Feature drift heatmap by generator: Pythia 行深蓝 (strong negative ρ)，Qwen/OLMo
    行浅灰 (near-zero ρ)'
  analysis: '"Universal phenomenon" claim 崩塌。Depth signal 是 Pythia-specific（或 same-family-specific）现象，
    不是 generation-intrinsic 的。7-feature ensemble 失去优势因为其核心 reference features 依赖 Pythia-410M
    对目标文本的 NLL 分布特性，对非 Pythia 生成文本无效。 Paper 需 reframe：从 "depth fingerprinting works"
    到 "characterizing when depth signal exists"。 Pythia 家族的强信号本身仍有价值（对特定 training
    pipeline 的诊断工具），但 universality claim 必须撤回。

    '
- name: paraphrastic_comparison
  plan_id: plan_006
  description: '对比 paraphrasing chains vs continuation chains。Worst 档：两者差异不显著， 或 paraphrastic
    chains 反而表现更好（违反 attractor theory 预测）。

    '
  expected_results:
    paraphrastic_3class_f1: 0.62
    paraphrastic_binary_f1: 0.58
    continuation_3class_f1: 0.66
    continuation_binary_f1: 0.64
    f1_3class_delta: -0.04
    delta_not_significant: true
    bootstrap_p_delta: 0.18
    spearman_entropy_mean_para: -0.28
    spearman_entropy_mean_cont: -0.32
    spearman_ttr_para: -0.22
    spearman_ttr_cont: -0.25
    cross_transfer_para_to_cont_f1: 0.55
    cross_transfer_cont_to_para_f1: 0.52
    depth_retention_para: 0.92
    depth_retention_cont: 0.85
  result_rationale: "在 worst 档下（overall signal 弱），continuation 和 paraphrastic chains\
    \ 的差异被压缩： (1) 两者 Spearman 都弱（-0.25 到 -0.32），差异不足以达到统计显著； (2) continuation 的优势（attractor\
    \ theory 预测 para 会 converge）被 overall signal weakness 掩盖——\n    如果信号本身就弱，两种 chain\
    \ type 的差异也小；\n(3) Cross-transfer F1 仅 0.52-0.55（略高于 chance），说明两种 chain 的 feature\
    \ 模式不同，\n    但都不够强到能 transfer；\n(4) 这否定了 \"non-paraphrastic chains preserve more\
    \ depth signal\" 的 claim——\n    在新家族上两者都不 work，差异成了 noise。\nPaper implication：不能用\
    \ para vs non-para 的对比来 justify task formulation的优越性。\n"
  tables:
  - name: 'Table: Paraphrastic vs Continuation (expanded generators)'
    columns:
    - Chain Type
    - 3-class F1
    - Binary F1
    - Δ
    rows:
    - - Continuation

      - '0.58'
      - -0.04 / -0.06
    - - Bootstrap p-value
      - —
      - —
      - 0.18 (n.s.)
  figures_description:
  - 'Paired comparison plot: continuation 和 paraphrastic 的 per-generator F1 散点图，大部分点聚集在
    diagonal 附近，差异不系统性'
  analysis: 'Attractor theory 的 prediction 未被有力验证——差异存在但不显著。 在 worst 档叙事中，这变成 "depth
    signal 的存在本身是 family-specific 的， chain type 的影响是 second-order effect"。 Paper 可以诚实报告这一
    null result，作为 boundary characterization 的一部分。

    '
- name: finer_grained_ordinal
  plan_id: plan_009
  description: '5-class ordinal classification (gen-0 through gen-4)。 Worst 档：5-class
    退化至接近 random，确认深层 depth 不可分辨。

    '
  expected_results:
    5class_macro_f1: 0.35
    5class_accuracy: 0.38
    5class_mae: 1.12
    3class_macro_f1: 0.66
    delta_5class_vs_3class: -0.31
    per_class_f1:
      depth_0: 0.72
      depth_1: 0.38
      depth_2: 0.22
      depth_3: 0.18
      depth_4: 0.25
    gen2_gen3_inseparable: true
    gen1_gen2_inseparable: true
    confusion_matrix_pattern: depth 1-3 互相混淆严重，depth 0 可分但精度下降，depth 4 有微弱信号
    ordinal_methods_vs_xgboost:
      coral_5class: 0.33
      frank_hall_5class: 0.34
      xgboost_5class: 0.35
  result_rationale: '在 worst 档下，even 3-class 的 binary F1 已降至 0.64，5-class 进一步要求区分
    gen-1/gen-2/gen-3/gen-4—— 这些 depth 之间的 feature 差异极小（新家族的 drift slope 本身就近乎 flat）。
    (1) Depth 0 尚可分辨（0.72）因为 human seed 与 LLM output 仍有 systematic 差异； (2) Depth 1-3
    完全混淆（F1 0.18-0.38）——drift 不单调或幅度太小； (3) Depth 4 有微弱信号（0.25）可能因为极深生成偶尔出现 repetition/degeneration
    artifacts； (4) 5-class MAE > 1.0 意味着平均预测误差超过 1 个 depth level，实用价值为零。 结论：finer-grained
    classification 在 worst 档下不可行，支持 paper reframe 为 "boundary characterization"——明确指出
    3-class 是 ceiling。

    '

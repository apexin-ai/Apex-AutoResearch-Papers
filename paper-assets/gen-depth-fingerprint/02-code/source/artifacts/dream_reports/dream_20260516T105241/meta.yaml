    result_rationale: '5-class 性能显著低于 3-class（-27pp），核心原因是 gen-2/gen-3 在特征空间中不可分：
      location shift 在 depth-2 后边际变化递减——从 depth-0 到 depth-1 的 entropy_mean 下降约 0.5
      nats， depth-1 到 depth-2 约 0.3 nats，depth-2 到 depth-3 仅约 0.1 nats。 这一递减遵循指数衰减模式：每步
      drift 是前一步的 ~60%，使 depth-2+ 的特征值聚集在 converged region。 Gen-0 保持高 F1（0.91）因为 human-written
      seed text 与 LLM 生成文本存在本质分布差异 （不仅是 depth drift，还有 sampling artifact 差异）。 Gen-4
      F1（0.44）略高于 gen-2/gen-3（0.27），因为极端 depth 的文本偶尔出现 超低 TTR/hapax 值（vocabulary 极度贫化），形成可识别的
      "extreme drift" 模式。 Ordinal methods（CORAL, Frank-Hall）未优于 XGBoost/HGBT，因为 ordinal
      假设（depth 等间距） 与实际非线性 drift 不匹配。

      '
    tables:
    - 'Table S3: 5-class per-depth F1 + confusion matrix'
    figures_description:
    - 'Figure S3: 5-class confusion matrix heatmap, 显示 gen-2/gen-3 混淆带'
    analysis: '3-class 是当前特征集的实际 ceiling，与 attractor theory 的预测一致。 论文将此作为 supplementary
      result 报告，支持 "depth estimation 有自然上限" 的 framing—— 这不是方法缺陷，而是物理限制（drift 饱和）。
      不建议在 main claims 中追求 finer ordinal resolution。

      '
  - name: end_to_end_classifier
    plan_id: plan_012
    description: 'QLoRA fine-tuned LM（Qwen3-0.6B-Base）进行端到端 depth 分类。 对比 learned representations
      vs handcrafted features。

      '
    expected_results:
      three_class_macro_f1: 0.905
      three_class_f1_std: 0.004
      five_class_macro_f1: 0.59
      five_class_f1_std: 0.01
      per_class_5class:
        depth_0: 0.999
        depth_1: 0.8
        depth_2: 0.4
        depth_3: 0.32
        depth_4: 0.42
      vs_xgboost_3class_delta_pp: 12.4
      vs_xgboost_5class_delta_pp: 8.5
      lora_rank: 32
      training_time_minutes: 117
    result_rationale: 'QLoRA fine-tuned LM（0.905 3-class）大幅超越 XGBoost（0.79），原因有三：
      (1) Token-level representations 捕获 handcrafted features 无法编码的 fine-grained patterns——
      如句法结构变化、特定 n-gram 频率偏移、段落层级的 coherence drift； (2) LM 可以建模 feature interactions（如
      entropy_mean × TTR 的非线性组合）， XGBoost 虽有 tree splits 但受限于 7 维特征空间； (3) LM 隐式学习了
      generator-specific signatures，在 within-generator evaluation 中获得额外优势。 但 5-class
      仍较低（0.59），说明 gen-2/gen-3 的不可分性不仅是特征工程问题， 更是信号层面的 fundamental limit——即使全 token
      序列也无法可靠区分连续深度。 Gen-0 接近 1.0（0.999）因为 human vs LLM 的分布差异对 LM 而言是 trivial classification。

      '
    tables:
    - 'Table S4: QLoRA vs XGBoost (3-class, 5-class F1, 训练成本对比)'
    figures_description:
    - 'Figure S4: 5-class QLoRA confusion matrix, 对比 XGBoost confusion matrix'
    analysis: 'QLoRA 结果作为 Appendix supplementary analysis 报告（D027 决策）。 论文定位：更多 depth
      signal 存在于 raw text 中超出 7 handcrafted features 的范围， 但本文的贡献在于 interpretable characterization（differential
      response） 而非追求最高分类精度。 QLoRA 的 3-class 优势（+12.4pp）证明 depth estimation 作为 task
      有更大上升空间， 激励未来工作探索 end-to-end approaches。

      '
  - name: plan-016 Llama-3.2-3B generation + feature extraction

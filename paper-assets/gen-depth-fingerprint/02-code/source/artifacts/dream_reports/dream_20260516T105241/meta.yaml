  imagined_experiments:
  - name: feature_ablation_and_trend
    plan_id: plan_001
    description: 'MVP 数据上的三部分分析：(A) 特征消融——reference-only vs surface-only vs full 7-feature；
      (B) 每特征 depth trend（Spearman ρ + bootstrap CI）；(C) Pythia-410M perplexity 随
      depth 变化。

      '
    expected_results:
      full_macro_f1: 0.82
      surface_only_f1: 0.76
      reference_only_f1: 0.72
      full_vs_surface_bootstrap_p: <0.001
      full_vs_reference_bootstrap_p: <0.001
      spearman_entropy_mean: -0.68
      spearman_ttr: -0.63
      spearman_hapax_ratio: -0.65
      spearman_entropy_min: -0.31
      spearman_entropy_std: -0.08
      spearman_tail_decay: -0.09
      spearman_entropy_max: 0.05
      h2_features: entropy_mean, ttr, hapax_ratio (|ρ|>0.35, monotonic drift)
      h1_features: tail_decay, entropy_std, entropy_max (|ρ|<0.12, near-stationary)
      median_ppl_by_depth:
      - 13.5
      - 5.0
      - 3.0
      - 2.1
      - 1.7
      ppl_monotonic_decline: true
    result_rationale: 'Location-shift model 预测 NLL 分布的位置参数（均值）随 depth 单调递减——递归生成选择高概率
      token， 使文本逐步变得更可预测。entropy_mean 直接测量该均值，ρ=-0.68 反映强单调漂移。 TTR 和 hapax_ratio 是
      vocabulary diversity 指标，随 entropy_mean 下降而同步收缩（ρ≈-0.63/-0.65）， 因为可预测文本使用更窄的词汇集。
      Shape 特征（entropy_std, tail_decay）测量 NLL 分布的形状——方差和尾部衰减率。 Location shift 不改变分布形状（类比正态分布平移不改变方差），
      因此 shape 特征 |ρ|<0.12，几乎不随 depth 变化。 Full 7-feature (0.82) 显著优于 surface-only
      (0.76) 和 reference-only (0.72)， 因为 drifting features 提供主要判别力，shape features
      提供互补的 decision boundary 微调—— 它们在 depth 维度上稳定，但跨 generator 有差异，帮助 XGBoost 校正
      generator-specific biases。 Perplexity 单调递减（13.5→1.7）直接验证 location shift： 每一代的文本对参考模型更可预测，因为递归生成积累了
      mode collapse。

      '
    tables:
    - 'Table 1: Feature-depth Spearman ρ (个体水平, bootstrap 95% CI)'
    - 'Table S1: 消融对比 — Full vs Surface-only vs Reference-only macro F1'
    figures_description:
    - 'Figure 1A: 7 features × depth 0-4 mean±std trend plot, drifting features 用实线标红,
      stationary 用虚线标灰'
    - 'Figure 1B: Perplexity by depth (box plot), 显示单调递减'
    analysis: '消融确认特征互补性而非冗余性：surface 特征捕获 vocabulary impoverishment（词汇贫化）， reference
      特征捕获 predictability increase（可预测性增加），两者是同一 location shift 的不同投影。 Claim 2 的 differential
      response 在 MVP 单生成器上首次确立—— 后续 9-gen 扩展将测试这一模式的跨家族泛化性。

      '

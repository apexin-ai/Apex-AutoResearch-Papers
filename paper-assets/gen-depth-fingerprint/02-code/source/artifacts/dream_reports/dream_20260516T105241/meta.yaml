      跨 generator 更稳定。

      '
  - name: paraphrastic_comparison
    plan_id: plan_006
    description: 'RQ2: 平行构建 paraphrastic chains vs continuation chains。测试非改写链是否保留更多
      depth signal。

      '
    expected_results:
      continuation_3class_f1: 0.79
      continuation_binary_f1: 0.75
      paraphrastic_3class_f1: 0.74
      paraphrastic_binary_f1: 0.67
      f1_3class_delta: -0.05
      f1_binary_delta: -0.08
      spearman_entropy_mean_cont: -0.68
      spearman_entropy_mean_para: -0.53
      spearman_ttr_cont: -0.63
      spearman_ttr_para: -0.55
      spearman_hapax_cont: -0.65
      spearman_hapax_para: -0.56
      spearman_signs_consistent: true
      cross_transfer_cont_to_para_f1: 0.74
      cross_transfer_para_to_cont_f1: 0.77
      depth_retention_para: 0.97
      depth_retention_cont: 0.83
      n_paraphrastic_clean: 4900
    result_rationale: 'Paraphrastic chains 在 semantic-preservation 约束下生成：每步输出是前一步的改写而非延续。
      Attractor convergence theory（ACL 2025）证明改写链在 ~3 步后收敛到 2-period cycle， 压缩了 depth
      信号空间。因此 paraphrastic 3-class F1（0.74）低于 continuation（0.79）—— depth-2 和 depth-3
      的改写文本已非常相似，分类器难以区分。 Continuation chains 无此约束：每步生成全新内容，drift 持续积累，depth signal
      在更多 class 间保持可分。 Depth retention（para 0.97 vs cont 0.83）看似矛盾——改写链 retention
      更高—— 实际反映了 attractor 稳定性：改写链不会因长文本退化（degenerate）而截断， 但这种 retention 代价是 depth-discriminative
      information 被压缩。 Spearman ρ 符号一致（均为负漂移）确认 drift 方向不因链类型逆转—— 改写和延续都使文本变得更可预测、更贫化，只是速率不同。
      Cross-transfer viable（0.74-0.77）说明两种链类型共享底层 depth response 结构， 差异仅在量级，不在方向。

      '
    tables:
    - 'Table S2: Continuation vs Paraphrastic chains — F1, Spearman ρ, cross-transfer'
    figures_description:
    - 'Figure S2: Feature-depth trend comparison (continuation vs paraphrastic, 3
      drifting features)'
    analysis: 'Continuation chains 保留显著更多 depth signal（+5pp 3-class, +8pp binary），
      支持论文选择 continuation 作为 primary evaluation setting。 Paraphrastic chains 的较弱 signal
      与 attractor theory 一致，而非矛盾—— 这一比较将在论文 Discussion 中用于界定方法的适用范围： depth fingerprinting
      最适用于非改写型递归生成（web scraping 的典型场景）， 而非刻意改写场景。

      '

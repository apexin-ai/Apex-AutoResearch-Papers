    # Dream Review Report: Differential Depth Response in Recursive LLM Generation


    ## Paper Summary


    The paper introduces **ordinal depth estimation** — classifying how many times
    text has been recursively processed through an LLM — as a new task beyond binary
    synthetic text detection. The core insight is **differential depth response**:
    central-tendency features (entropy mean, TTR, hapax ratio) drift monotonically
    with generation depth, while distributional shape features (entropy std, tail
    decay) remain near-stationary. A 7-feature XGBoost classifier achieves 3-class
    LOGO macro-F1 = 0.72 across 5 base-model generators (0.6B–2.8B) from 3 families.
    The paper also shows QLoRA fine-tuned classifiers win within-generator (+5pp)
    but lose on cross-generator transfer (−4.4pp), validating the robustness advantage
    of handcrafted features.


    ---


    ## Experiment Coverage Assessment


    All 5 imagined experiments from the design context are present in the paper:


    | Planned Experiment | Paper Section | Covered? |

    |---|---|---|

    | Feature ablation & trend (plan_001) | §3.1 | ✅ Full |

    | Cross-generator evaluation (plan_002) | §3.2 | ✅ Full |

    | Paraphrastic comparison (plan_006) | §3.3 | ✅ Full |

    | Finer-grained ordinal (plan_009) | §3.4 | ✅ Full |

    | End-to-end classifier (plan_012) | §3.5 | ✅ Full |


    Reported numbers align closely with expected results in the design context (e.g.,
    LOGO 3-class F1 = 0.724, Qwen3-0.6B held-out = 0.57, 5-class F1 = 0.46, paraphrastic
    delta = −0.07). Cross-transfer results from the paraphrastic experiment (Table
    9 in YAML) are discussed in prose but not given a dedicated table in the paper
    — a minor omission. Feature importance rankings from the YAML are also absent
    from the paper.


    ---


    ## Strengths


    ### S1: Novel and well-motivated task formulation

    Ordinal depth estimation fills a genuine gap. Binary detection conflates first-generation
    synthetic text with deeply recursive text; the ordinal framing enables risk-stratified
    data governance. The LOGO/LOFO evaluation protocols are appropriate and more rigorous
    than typical within-distribution evaluation in detection papers.


    ### S2: Theoretically grounded feature taxonomy

    The differential depth response framework — separating features into drifting
    (H2) vs stationary (H1) based on whether recursive generation shifts location
    vs shape of the NLL distribution — is a clean conceptual contribution. The per-generator
    audit (Table 6) systematically validates this across model families.


    ### S3: Commendably honest limitation reporting

    The paper does not hide the Qwen3-0.6B failure case (F1 = 0.57), the high per-generator
    variance (std = 0.09), or the narrow +1.8pp advantage over a single-feature baseline.
    The "scope and limitations" paragraph explicitly states what the paper does and
    does not claim. This is above-average scientific integrity.


    ### S4: Insightful generalization paradox

    The QLoRA experiment (§3.5) produces a genuinely interesting finding: stronger
    within-generator models generalize worse across generators. This is well-analyzed
    and has practical implications for deployment choices.


    ### S5: Comprehensive experimental coverage

    Five well-designed experiments address different axes: within-gen validation,
    cross-generator transfer, chain type comparison, granularity limits, and learned
    vs handcrafted features. Each experiment has a clear purpose and delivers interpretable
    results.


    ---


    ## Weaknesses


    ### W1 (Major): Model scale severely limits practical relevance

    All generators are ≤2.8B base models. Real-world recursive generation in web corpora
    overwhelmingly involves 7B–70B+ instruction-tuned models. The paper''s central
    claim about data governance relevance rings hollow when the tested regime (small
    base models) does not match the deployment scenario. The "≥1B capacity threshold"
    for shape stationarity is derived from exactly one data point below it (Qwen3-0.6B);
    this is not sufficient evidence for a general capacity threshold.


    **Impact on claims:** The paper should either (a) scale experiments to ≥7B generators
    or (b) significantly narrow the scope claim to acknowledge this is a proof-of-concept
    on small models only.


    ### W2 (Major): Single reference model creates systematic bias

    The entire NLL feature pipeline depends on Pythia-410M. The cross-family performance
    degradation (entropy_mean ρ drops from −0.58 for Pythia-2.8B to −0.24 for Qwen3-0.6B)
    is partially — perhaps largely — an artifact of reference-generator family mismatch,
    not a property of depth estimation difficulty per se. No ablation over reference
    models is provided.


    **What''s needed:** At minimum, one additional reference model from a different
    family (e.g., OLMo or Qwen) to disentangle reference bias from inherent cross-family
    difficulty.


    ### W3 (Major): Marginal improvement over trivial baseline

    In the LOGO setting (Table 5), the 7-feature ensemble outperforms single average
    log-probability by only +1.8pp (0.724 vs 0.706). The 4-baseline ensemble closes
    this to +1.0pp. For 5 additional features and a more complex pipeline, this practical
    improvement is small. A reviewer could reasonably ask: does the differential depth
    response framework actually buy much over just using average log-probability?


    ### W4 (Moderate): Instruction-tuned models entirely absent

    The introduction motivates the work with "web-scraped corpora" containing recursive
    LLM content. In practice, this content is predominantly generated by instruction-tuned/chat
    models, not base models. The paper''s exclusive use of base models creates a gap
    between motivation and evaluation. Instruction tuning alters output distributions
    in ways that could interact with the depth signal (length biases, formatting,
    hedging patterns).


    ### W5 (Moderate): Chain construction may not reflect real recursive generation

    The paper''s introduction frames the problem as "model collapse" — content scraped
    and used in retraining. But the experimental setup uses iterative prompting (continuation
    chains), which is a different mechanism. In true model collapse, the generator
    itself changes across generations (trained on its own outputs). In continuation
    chains, the same fixed model is re-prompted. This distinction is acknowledged
    nowhere in the paper and could mislead readers about the applicability of results.


    ### W6 (Moderate): Missing methodological details

    - **Tail decay**: Not precisely defined. How is "rate of decay in the upper tail"
    computed? Exponential fit? Percentile ratio?

    - **Prompt templates**: Chain construction prompts not provided. The prompt wording
    could significantly affect the depth signal (e.g., "continue this text" vs "elaborate
    on the following").

    - **XGBoost hyperparameters**: No mention of tree depth, learning rate, or hyperparameter
    selection procedure.

    - **Text length**: No analysis of length as a confounder. If generated text gets
    shorter/longer with depth, surface features may simply track length.

    - **Seed text source and domain**: The 1000 seeds are uncharacterized.


    ### W7 (Minor): The "location shift" explanation is post-hoc

    The theoretical claim that recursive generation induces a location shift while
    preserving distributional shape is presented as explanation, but it is neither
    formally derived nor tested beyond correlation analysis. The Qwen3-0.6B violation
    is explained post-hoc ("insufficient capacity"). A stronger paper would derive
    predictions from the location-shift model and test them.


    ### W8 (Minor): No comparison with existing detection methods

    FastDetectGPT, Binoculars, and LD-Score are cited in the introduction as binary
    detectors that "cannot distinguish generation depth." But they are never included
    as baselines — even for binary (gen-0 vs gen-1+) performance. This leaves the
    reader unable to contextualize the paper''s binary F1 = 0.70 against the state
    of the art.


    ---


    ## Detailed Questions for Authors


    1. **Reference model ablation**: How does performance change with a non-Pythia
    reference model? The Qwen3-0.6B failure could largely be a reference mismatch
    issue rather than a capacity issue.

    2. **Length confound**: What is the correlation between text length and generation
    depth? Have you controlled for length in the feature analysis?

    3. **Seed text domain**: What corpus do the 1000 seeds come from? Is depth signal
    robust across domains (e.g., news vs Wikipedia vs creative writing)?

    4. **Prompt sensitivity**: How sensitive are results to the continuation prompt
    template?

    5. **Real model collapse vs iterative prompting**: Have you considered experiments
    where the generator is actually retrained on its outputs, matching the model collapse
    scenario described in the introduction?


    ---


    ## Minor Issues


    - Table numbering in the paper skips from Table 8 to Table 9 (5-class results),
    but Table 9 in the YAML is the cross-transfer table — minor inconsistency suggesting
    the cross-transfer table was dropped from the paper.

    - The "borderline" classification threshold for entropy_min (|ρ| between 0.10
    and 0.20) is introduced without justification for these specific cutoffs.

    - Feature importance rankings (YAML Table: hapax_ratio > ttr > entropy_mean) would
    strengthen the ablation analysis in §3.2 but are not reported.


    ---


    ## Overall Assessment


    **Score: 3 — Weak Reject**


    The paper introduces a genuinely novel task (ordinal depth estimation) with a
    clean conceptual framework (differential depth response). The experimental design
    is thorough within its scope, the statistical reporting is above average, and
    the honest limitation discussion is commendable. These are real strengths.


    However, three issues prevent acceptance at a top ML venue:


    1. **Scale gap** (W1): The ≤2.8B base-model regime is too far from practical deployment
    scenarios to support the data governance motivation. This is not a minor "future
    work" item — it is central to whether the contribution matters.

    2. **Single reference model** (W2): With 5 out of 7 features depending on one
    Pythia-410M reference, cross-family results conflate reference bias with genuine
    difficulty. This undermines the generality claim.

    3. **Marginal practical advantage** (W3): +1.8pp over average log-probability
    in LOGO does not convincingly justify the 7-feature framework as a contribution
    over simpler alternatives.


    The paper would be strengthened substantially by: (a) including at least one ≥7B
    generator, (b) ablating over reference models from different families, (c) comparing
    against existing binary detectors, and (d) providing the missing methodological
    details (W6).


    **Verdict**: Interesting task formulation with careful execution, but the narrow
    experimental scope (small base models, single reference model) and marginal quantitative
    advantage over trivial baselines fall below the acceptance threshold. With the
    suggested additions, this could become a solid contribution.


    ---


    ## Confidence


    4/5 — I am confident in this assessment. The strengths and weaknesses are clearly
    identifiable from the paper. Some uncertainty around whether the scale limitation
    would be viewed as fatal vs addressable-in-rebuttal by a program committee.

    '

    result_rationale: '9-gen binary LOGO F1 从 6-gen 的 0.723 提升至 0.73（+0.7pp），原因是训练集多样性增加：
      8 个训练 generator 覆盖 5 个家族（vs 之前的 4-5 个），提供更丰富的 feature-depth mapping， 使分类器学到更通用的

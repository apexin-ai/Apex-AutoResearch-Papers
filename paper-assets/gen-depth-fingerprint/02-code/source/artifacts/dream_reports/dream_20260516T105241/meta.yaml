    # Review Report: "On the Limits of Generation Depth Estimation: When Distributional
    Fingerprints Fail to Generalize"


    ## Meta


    - **Reviewer:** Single-reviewer simple mode

    - **Venue standard:** Top ML venue (acceptance rate ~25%), 6-point scale

    - **Overall score:** 3 (Reject)


    ---


    ## Summary


    The paper formulates generation depth estimation as an ordinal classification
    task — given a text passage, determine how many times it has been recursively
    generated (depth 0–4). A 7-feature distributional ensemble (2 surface diversity
    + 5 reference-model entropy features) is evaluated across 5 generators from 3
    model families (Pythia, OLMo, Qwen). The central finding is negative: depth signal
    is family-specific. Within-family (Pythia) F1 reaches 0.74–0.82, but cross-family
    performance drops to 0.45–0.52. A QLoRA end-to-end classifier exhibits the same
    failure pattern, and 5-class ordinal classification collapses to near-random (F1=0.35).
    The paper reframes as a boundary characterization study.


    ---


    ## Strengths


    **S1. Novel task formulation.** Ordinal generation depth estimation is genuinely
    new. The distinction between gen-1 and gen-3+ text is practically relevant for
    data quality auditing and model collapse prevention. The three-granularity evaluation
    protocol (binary/3-class/5-class) and LOGO CV are sensible design choices.


    **S2. Honest negative-result framing.** The paper does not oversell. The title,
    abstract, and narrative are upfront that the proposed approach fails to generalize.
    This is refreshing and the reframing as a boundary study is appropriate given
    the results.


    **S3. Methodology-independence argument.** The end-to-end QLoRA experiment (§4.5)
    is the strongest part of the paper. Showing that a 700M-parameter fine-tuned model
    exhibits the same 28–29pp cross-family gap as handcrafted features is convincing
    evidence that the limitation is in the signal, not the method. Table 6 is the
    most informative table in the paper.


    **S4. Thorough ablation coverage.** The paper covers feature ablation, cross-generator
    LOGO, chain type comparison, ordinal granularity analysis, and E2E comparison.
    All five experimental dimensions from the design are addressed, providing a relatively
    complete picture.


    **S5. Clear writing.** The paper is concise (6 pages + references), well-structured,
    and the tables are easy to read. The Discussion section (§5) provides plausible
    mechanistic explanations for cross-family failure.


    ---


    ## Weaknesses


    **W1 (Major). Insufficient experimental scale to support "fundamental limitation"
    claims.** The paper tests only 5 generators (all ≤2.8B parameters) from 3 families.
    With N=5 generators and only 1 OLMo model, the "family-specificity" conclusion
    rests on very few data points. The observed cross-family gap could be confounded
    by:

    - **Model size:** Pythia-2.8B is the largest generator; smaller models (Qwen3-0.6B)
    may produce lower-quality text with less distinct depth signal regardless of family.

    - **Architecture generation:** Pythia is older (GPT-NeoX based); OLMo and Qwen
    are more recent with different training recipes. The gap may reflect generation-era
    differences, not family per se.

    - Claims about "fundamental" or "intrinsic" limitations require much broader coverage
    (more families, larger models, instruction-tuned variants) to be credible at a
    top venue.


    **W2 (Major). The proposed method underperforms a trivial baseline.** Table 3
    shows the 7-feature ensemble (F1=0.66) is *worse* than Avg-LogProb (F1=0.67) under
    LOGO evaluation. This means the paper''s main methodological contribution has
    negative value — adding 6 features to a single-feature baseline makes things worse.
    A boundary study that also fails to advance the state of the art needs exceptionally
    deep analysis to compensate, which is not provided here.


    **W3 (Major). Missing dataset details critical for reproducibility.** The paper
    does not report:

    - Number of samples per depth per generator

    - Text domain and source of human seeds (depth-0)

    - Generation parameters (temperature, top-p, max length)

    - Text length distribution across depths

    - Whether text lengths are controlled (length confound could drive surface feature
    differences)

    These omissions make it impossible to assess whether the results are artifacts
    of specific data construction choices.


    **W4 (Major). Single reference model without mitigation analysis.** Pythia-410M
    is the only reference model. The paper acknowledges (§5, point 3) that reference-model
    entropy is "inherently family-biased," but does not test whether using multiple
    reference models from different families would mitigate cross-family failure.
    This is the most obvious intervention and its absence significantly weakens the
    boundary claim — the paper cannot distinguish "depth signal doesn''t exist cross-family"
    from "our reference model is poorly chosen for cross-family use."


    **W5 (Minor). No confidence intervals or significance tests for main LOGO results.**
    Table 2 (the central result) reports point F1 estimates per generator with no
    uncertainty quantification. The feature ablation (Table 1) includes 95% CIs but
    the cross-generator results do not. The 25pp family gap could partially reflect
    variance from limited test-set sizes.


    **W6 (Minor). E2E classifier uses Qwen3-0.6B, which is also a generator.** The
    end-to-end model shares architecture with two of the five generators. This may
    inflate same-family performance for Qwen-generated text or introduce other confounds.
    The paper does not discuss this.


    **W7 (Minor). Related work is thin.** Only 10 references. Missing key works:

    - Shumailov et al. (2024) on model collapse in LLMs (Nature)

    - FastDetectGPT (Bao et al., 2024) is used as a baseline but not cited with full
    details

    - SynthID-Text (Dathathri et al.) is mentioned but not cited

    - LD-Score is referenced but uncited

    - No coverage of recent multi-generator detection work


    **W8 (Minor). No qualitative analysis.** The paper provides no examples of what
    depth-0 vs depth-4 text looks like. Even 2–3 examples would help readers build
    intuition about why the signal exists within-family but not cross-family. A figure
    showing feature distributions by depth and generator would be far more informative
    than the current text-only descriptions.


    ---


    ## Experiment Coverage Assessment


    Checking against the full experimental design:


    | Experiment | Covered? | Notes |

    |---|---|---|

    | Feature ablation + trend (plan_001) | ✓ | Table 1 + R² values reported. Missing:
    perplexity pre-validation (ppl_depth_0/ppl_depth_4 not reported) |

    | Cross-generator LOGO (plan_002) | ✓ | Tables 2–3. Missing: leave-one-family-out
    breakdown, per-feature Spearman heatmap (described in text but not visualized)
    |

    | Paraphrastic comparison (plan_006) | ✓ | Table 4. Cross-transfer F1 reported
    in text. Missing: depth retention metric |

    | Finer-grained ordinal (plan_009) | ✓ | Table 5. Per-class F1 partially reported
    in text. Missing: confusion matrix visualization |

    | End-to-end classifier (plan_012) | ✓ | Table 6. Overfitting gap reported. Missing:
    learning curve figure, per-generator E2E breakdown (described in text only) |


    All five planned experiments are present. However, several supporting analyses
    and visualizations from the design are missing — notably the confusion matrix,
    feature drift heatmap, learning curves, and perplexity validation. The paper reads
    as tables-and-text without any figures, which is unusual and weakens presentation.


    ---


    ## Missing Figures


    The paper contains **zero figures**. For a boundary characterization study, visualization
    is essential. At minimum:

    1. Feature-depth trend plot showing strong vs weak drift by family

    2. Per-generator Spearman correlation heatmap

    3. 5-class confusion matrix

    4. Cross-family transfer heatmap (E2E vs XGBoost)


    ---


    ## Questions for Authors


    1. How many samples per depth per generator? If sample sizes are small for non-Pythia
    generators, the low cross-family F1 may reflect data scarcity rather than signal
    absence.

    2. Have you tried using OLMo or Qwen models as reference models for their respective
    families? If family-matched references restore performance, the limitation is
    in the reference model design, not the depth signal.

    3. What generation parameters (temperature, top-p) were used? Mode collapse speed
    is heavily temperature-dependent — Pythia''s stronger depth signal could reflect
    higher-temperature generation rather than family-intrinsic properties.

    4. Why no figures at all? The paper would benefit enormously from even 2–3 visualizations.


    ---


    ## Minor Issues


    - Abstract says "overall LOGO F1 = 0.66" but Table 2 average is 0.594. Clarify
    which metric this refers to (Table 3''s ensemble result vs Table 2''s per-generator
    average).

    - §3.1: Binary is defined as "gen-1 vs gen-2+" which excludes gen-0. The 3-class
    includes gen-0. The relationship between these evaluation settings should be clearer.

    - §4.3: "Cross-transfer between chain types yields F1 of 0.52–0.55" — is this
    3-class or binary? Not specified.

    - "LD-Score" and "SynthID-Text" are mentioned but not properly cited in the references.


    ---


    ## Overall Assessment


    The paper introduces a genuinely novel task (ordinal depth estimation) and provides
    an honest negative-result analysis. However, the experimental evidence is too
    narrow (5 small generators, 3 families, single reference model) to support claims
    about "fundamental" or "intrinsic" limitations. The proposed method underperforms
    a trivial baseline (Avg-LogProb), and the paper provides no path forward beyond
    vague future work. The complete absence of figures is a significant presentation
    weakness for a boundary characterization paper.


    The core insight — that depth signal is family-specific — is plausible but undersupported.
    Testing one OLMo model and two small Qwen models does not establish a general
    principle. The paper would be substantially stronger with: (a) multi-reference
    model experiments to disentangle signal absence from reference bias, (b) larger
    and more diverse generators, (c) proper dataset documentation, and (d) visualizations
    that make the boundary conditions vivid.


    **Score: 3 / 6 (Reject).** The negative finding is useful but insufficiently supported
    by the experimental scale, the proposed method offers no improvement over a trivial
    baseline, and critical details (dataset statistics, generation parameters, alternative
    reference models) are missing. Below the acceptance threshold for a top ML venue.


    **Confidence: 4/5.** Familiar with synthetic text detection and model collapse
    literature. The weaknesses identified are fundamental to the paper''s claims.


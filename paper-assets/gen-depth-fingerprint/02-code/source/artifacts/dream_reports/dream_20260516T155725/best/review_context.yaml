- name: paraphrastic_comparison
  plan_id: plan_006
  description: '构建平行 paraphrasing chains 直接对比 continuation chains， 测试 attractor convergence
    理论——non-paraphrastic chains 是否保留更多 depth signal。

    '
  expected_results:
    paraphrastic_3class_f1: 0.74
    paraphrastic_3class_f1_std: 0.009
    paraphrastic_binary_f1: 0.67
    continuation_3class_f1: 0.79
    continuation_3class_f1_std: 0.006
    continuation_binary_f1: 0.75
    f1_delta_3class: -0.05
    f1_delta_binary: -0.08
    depth_retention_para: 0.97
    depth_retention_cont: 0.83
    spearman_entropy_mean_para: -0.53
    spearman_entropy_mean_cont: -0.68
    spearman_ttr_para: -0.44
    spearman_ttr_cont: -0.63
    spearman_hapax_para: -0.46
    spearman_hapax_cont: -0.65
    drift_direction_consistent: true
    cross_transfer_para_to_cont_f1: 0.77
    cross_transfer_cont_to_para_f1: 0.74
    n_paraphrastic: 4900
    n_continuation: 4609
  result_rationale: 'best 档下 paraphrastic chains 的 depth signal 弱于 continuation 但仍可检测（F1>chance），
    符合 attractor theory 预测：paraphrasing 的语义保持约束加速收敛（retention 97% 意味着 depth-4 仍有 97%
    的 chains 产出合理文本），但 feature drift 幅度被压缩（Spearman ρ  绝对值低 ~0.15-0.20）。Crucially，drift
    direction 一致（同向负相关），说明 location-shift  机制在两种 chain 中同向作用，只是 paraphrasing 的语义锚定限制了
    shift 幅度。 Cross-transfer F1 >0.74 说明同一特征空间对两种 chain 都有效， 支持统一 depth estimation
    framework 的叙事。

    '

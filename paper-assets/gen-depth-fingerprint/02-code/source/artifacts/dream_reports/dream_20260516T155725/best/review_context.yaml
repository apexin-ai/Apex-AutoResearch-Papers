    features 近水平'
  - 'Fig 2: Perplexity by depth box plot, 呈现 depth-0>>depth-4 的急剧下降'
  analysis: '消融结果确认 surface 和 reference features 各自贡献独立信号。drift/stationary 分裂完美对齐
    location-shift 假说：central-tendency features 跟踪 mean shift，shape features 对之不敏感。


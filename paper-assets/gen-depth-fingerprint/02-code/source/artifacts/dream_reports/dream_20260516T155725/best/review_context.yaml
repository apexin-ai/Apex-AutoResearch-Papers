- name: cross_generator_evaluation
  plan_id: plan_002
  description: '扩展到 5 generators (Pythia-2.8B, Pythia-1B, OLMo-2-1B, Qwen3-1.7B, Qwen3-0.6B)，
    LOGO CV 评估跨生成器泛化能力。

    '

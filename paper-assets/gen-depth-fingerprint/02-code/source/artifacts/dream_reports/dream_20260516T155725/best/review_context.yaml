narrative_guidance: '所有 plan-016 跨家族生成器确认 depth signal 普遍存在；9-generator 评估强化 universality
  claim； framing 完全成立无需调整。原始 3 claims 完整保留，Claim 1 的 generalization 论据从 6-gen 升级到
  9-gen 跨 5+ 家族。 Differential depth response 在所有新家族中定性成立，cross-family reference model
  优势得到确认。

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: '三部分分析：(A) 特征消融 full/reference-only/surface-only； (B) 每特征 depth trend
    线性拟合；(C) 深度分层 perplexity 预验证。

    '
  expected_results:
    full_7feat_macro_f1: 0.832
    reference_only_f1: 0.738
    surface_only_f1: 0.774
    full_vs_surface_bootstrap_p: 0.001
    full_vs_ref_bootstrap_p: 0.0001
    h2_drift_features:
      entropy_mean_slope: -0.28
      entropy_mean_R2: 0.94
      ttr_slope: -0.045
      ttr_R2: 0.91
      hapax_ratio_slope: -0.062
      hapax_R2: 0.96
    h1_stationary_features:
      entropy_std_slope: -0.008
      entropy_std_R2: 0.12
      tail_decay_slope: 0.003
      tail_decay_R2: 0.05
      entropy_max_slope: -0.015
      entropy_max_R2: 0.18
    median_ppl_by_depth:
    - 13.5
    - 4.96
    - 3.0
    - 2.07
    - 1.72
    ppl_depth_spearman: -0.92
  result_rationale: 'best 档下，full ensemble 显著优于任一子集（+5.8pp over ref-only，+5.8pp over
    surface）， 证明 reference features 和 surface features 提供互补信号而非冗余。H2 drift features  展现
    R²>0.90 的强单调趋势，因为递归生成的 location shift 导致 mean/diversity 持续压缩； H1 features R²<0.20
    因为 shape 由 sampling mechanism 和 architecture 决定，对 input  content drift 不敏感。Perplexity
    随 depth 急剧下降（depth-0 到 depth-4 下降 87%）， 这是因为深层生成文本越来越可预测（mean NLL 持续降低）。

    '

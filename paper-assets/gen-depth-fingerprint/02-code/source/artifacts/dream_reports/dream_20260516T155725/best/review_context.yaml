    distributional drift 是生成过程本身的属性，不依赖特定模型。Pythia-1B 最高因为 与训练集中 Pythia-2.8B 同家族共享
    tokenizer/architecture bias；OLMo 最低因为 architecture  差异最大。家族级别 holdout 仅比 generator-level
    低 ~1.5pp，说明跨家族泛化 robust。 per-gen std 0.032 远低于单检测器 baseline 的 per-gen variance。


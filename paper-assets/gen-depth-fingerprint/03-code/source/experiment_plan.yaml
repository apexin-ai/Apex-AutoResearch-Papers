experiments:
  # === P0: Must-run experiments (headline results) ===

  - id: plan_001
    claim: 2
    name: feature_ablation_and_trend
    description: >
      Three-part analysis on existing MVP data (zero new generation):
      (A) Feature ablation: reference-model-only features (entropy_mean/std/min/max + tail_decay)
      vs surface-only features (TTR + hapax_ratio) vs full feature set. XGBoost 5-fold CV for each.
      (B) H1/H2 trend analysis: plot each feature's mean ± std across depth 0-4. Monotonic trend → H2 (divergence);
      plateau → H1 (convergence). Fit linear regression per feature, report slope + R².
      (C) Perplexity pre-validation for Claim 3: compute Pythia-410M perplexity on depth-stratified subsets
      (no fine-tuning, just forward pass). If perplexity varies significantly with depth → Claim 3 signal exists.
    priority: P0
    gpu_budget_hours: 1
    deps: [mvp-001]
    notes: >
      Uses existing MVP data + features.csv. Critical for Claim 2.
      Plan B if surface-only ≈ full: reframe Claim 2 as "complementary signal" instead of "independent signal",
      narrative shifts to "vocabulary impoverishment as primary depth signal".

  - id: plan_002
    claim: 1
    name: cross_generator_evaluation
    description: >
      Expand to 5 generators: Pythia-2.8B, Pythia-1B, OLMo-2-0425-1B (1485M),
      Qwen3-1.7B-Base, Qwen3-0.6B-Base. (Qwen3.5 不存在，用 Qwen3-Base 替代。)
      Leave-one-generator-out CV to test cross-generator generalization.
      1000 seeds × 5 generators × 5 depths = 25K chains.
    priority: P0
    gpu_budget_hours: 20
    deps: [plan_001]
    notes: >
      Only proceed if plan_001 confirms reference features have independent or complementary value.
      Pythia family overlap (2.8B + 1B): supplement with leave-one-family-out evaluation in analysis.
      Discuss limitation in paper if Pythia holdout performance inflated by Pythia-1B in training set.

  - id: plan_003
    claim: 2
    name: cross_family_reference_model
    description: >
      Test non-Pythia reference models (OLMo-2-1B, Qwen3-0.6B-Base) for feature extraction.
      Addresses RC2 + critical test of Claim 2: verify entropy_mean H2 drift persists
      with non-Pythia reference (if drift disappears → "dual dynamics" is reference-model artifact,
      not generation-intrinsic). Also verify shape features remain H1 across reference models.
    priority: P0
    gpu_budget_hours: 8
    deps: [plan_002]
    notes: >
      Importance elevated after D005: this is now the key falsification test for Claim 2's
      level/shape framework. If entropy_mean drift is Pythia-specific, the entire dual dynamics
      narrative collapses.

  - id: plan_004
    claim: 3
    name: downstream_utility
    description: >
      RQ4: Fine-tune OLMo-1B (NOT Pythia-410M — avoid reference model circularity)
      on depth-stratified data subsets. Measure perplexity degradation on held-out test
      set as function of training data depth. Compare depth-aware filtering vs binary
      baselines (FastDetectGPT, LD-Score threshold). Must run ≥3 random seeds with
      bootstrap CIs. Include sample-count-matched comparison (subsample depth-filtered
      to match binary-filtered count) to control for data size confound.
    priority: P0
    gpu_budget_hours: 20
    deps: [plan_002]
    notes: >
      Dream review flagged: (1) single-run without CIs, (2) Pythia-410M circularity,
      (3) data size confound. All three addressed in updated design.

  # === P1: Important for story completeness ===

  - id: plan_005
    claim: 1
    name: prompt_type_comparison
    description: >
      RQ2 partial: Compare continuation vs elaboration vs inspired_rewriting chains.
      Tests whether semantic divergence from source correlates with depth signal preservation.
      Same 1000 seeds, Pythia-2.8B, 3 prompt types.
    priority: P1
    gpu_budget_hours: 10
    deps: [plan_001]

  - id: plan_006
    claim: 1
    name: paraphrastic_comparison
    description: >
      RQ2 full: Construct parallel paraphrasing chains for direct comparison with continuation chains.
      Tests attractor convergence theory — do non-paraphrastic chains preserve more depth signal?
    priority: P1
    gpu_budget_hours: 8
    deps: [plan_005]

  - id: plan_007
    claim: 1
    name: cross_model_chains
    description: >
      RQ3: Cross-model chains (different generator per depth step) vs single-model chains.
      More realistic scenario — web contamination involves diverse generators.
    priority: P1
    gpu_budget_hours: 12
    deps: [plan_002]

  - id: plan_008
    claim: 1
    name: multi_domain_seeds
    description: >
      Expand seeds to 4 domains: Wikipedia, news (CNN/DailyMail), scientific (S2ORC abstracts),
      creative writing (WritingPrompts). 500 seeds per domain × 5 depths.
    priority: P1
    gpu_budget_hours: 10
    deps: [plan_002]

  # === P2: Nice-to-have / strengthen claims ===

  - id: plan_009
    claim: 1
    name: finer_grained_ordinal
    description: >
      Secondary analysis: 5-class ordinal classification (gen-0 through gen-4)
      on non-paraphrastic chains. Tests if more depth signal exists beyond 3-class.
    priority: P2
    gpu_budget_hours: 1
    deps: [plan_002]

  - id: plan_010
    claim: 1
    name: human_edit_robustness
    description: >
      RC5: Robustness to simulated human edits.
      (A) Random word replacement (5%, 10%, 20%) as lower-bound.
      (B) LLM-simulated editing (light rephrasing of random sentences).
    priority: P2
    gpu_budget_hours: 5
    deps: [plan_002]

  - id: plan_011
    claim: 2
    name: ld_score_feature
    description: >
      Add LD-Score (character-distribution signature from arXiv:2605.01647) as additional feature.
      Tests whether character-level features provide complementary depth signal.
    priority: P2
    gpu_budget_hours: 2
    deps: [plan_001]

  - id: plan_012
    claim: 1
    name: end_to_end_classifier
    description: >
      QLoRA fine-tuned Qwen3.5-0.8B for end-to-end depth classification.
      Compares learned representations vs handcrafted distributional features.
    priority: P2
    gpu_budget_hours: 15
    deps: [plan_002]

  - id: plan_013
    claim: [1, 2]
    name: text_length_control
    description: >
      Address text length confound (RC10, dream all three tiers):
      (A) Analyze text length distributions by depth across all generators.
      (B) Compute length-normalized surface features (TTR, hapax_ratio on fixed-length windows).
      (C) Length-matched comparison: subsample to equalize length distributions across depths,
      re-evaluate classifier. If length-controlled F1 drops significantly → surface features
      were tracking length, not depth.
    priority: P0
    gpu_budget_hours: 0.5
    deps: [plan_002]
    notes: >
      Zero new generation — analysis on existing data. Critical confound control
      flagged by dream (all three tiers). Low cost, high impact on paper credibility.

  - id: plan_014
    claim: 1
    name: large_scale_generator
    description: >
      Add one 7B+ generator (Qwen3-8B-Base or similar) to test whether depth signal
      persists at frontier scale. 1000 seeds × 5 depths. Addresses RC9: all current
      generators ≤2.8B. RTX 5090 (32GB) can run 8B model at FP16 (~16GB weights).
    priority: P1
    gpu_budget_hours: 8
    deps: [plan_002]
    notes: >
      Dream review flagged ≤2.8B as major limitation (all three tiers).
      If depth signal weaker at scale → honest limitation with analysis.
      If comparable → strong generalization evidence for the paper.

  - id: plan_015
    claim: 1
    name: ordinal_baseline_comparison
    description: >
      CRITICAL missing baseline (flagged by both re-dreams, all three tiers):
      Test whether existing detector continuous scores already provide ordinal depth signal.
      Regress FastDetectGPT, Binoculars, and LD-Score continuous scores on generation depth.
      Compare single-feature ordinal classifiers (each detector score as sole feature) vs
      our 7-feature model. If existing detectors yield comparable ordinal signal, our
      custom feature set contribution collapses.
    priority: P0
    gpu_budget_hours: 3
    deps: [plan_002]
    notes: >
      Re-dream consensus: without this comparison, reviewers will question whether
      depth-specific features add value. Must be in the paper. FastDetectGPT needs
      model pair (source + reference), LD-Score is character-level, Binoculars needs
      two models. If any single detector achieves >0.70 ordinal F1, we need to
      reframe our contribution as "complementary to existing detectors" not "novel approach."

# Global requirements (D006+D007):
# - ALL experiments must report bootstrap CIs on main metrics
# - Use individual-level Spearman ρ (not R² on aggregated means) for trend analysis
# - Report realistic performance range, not just best-case

# GPU Budget Summary:
# P0: ~45.5 GPU·hours (was 44, +0.5 text_length, +5 downstream seeds)
# P1: ~48 GPU·hours (was 40, +8 large_scale_generator)
# P2: ~23 GPU·hours
# Total: ~116.5 GPU·hours (within 200 H100-hour budget)

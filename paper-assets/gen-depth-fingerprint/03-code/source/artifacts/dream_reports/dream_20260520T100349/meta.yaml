    \ chains. The 3-class formulation is well-motivated: gen-1 retains source distribution\
    \ properties while gen-2+ shows measurable distributional compression.\n\n**S2.\
    \ DDR partition convincingly established.** The drifting/stationary split is validated\
    \ through 5 convergent lines of evidence: Spearman correlations (Table 2), permutation\
    \ importance (Table 7, 5.3× gap), Granger causality (6/7 significant), TOST bootstrap\
    \ (Table 22, 3/4 confirmed stationary), and feature ablation (Table 1). This multi-method\
    \ validation exceeds typical empirical NLP standards.\n\n**S3. Exceptional experimental\
    \ thoroughness.** 24+ experiments across 11 main-text and 13 appendix tables.\
    \ The paper systematically addresses standard reviewer concerns: confound control\
    \ (length, topic drift, seed sharing), robustness (human editing, temperature),\
    \ generalization (cross-generator, cross-model, cross-domain, cross-reference),\
    \ and upper/lower bounds (QLoRA, multi-detector ensemble, 5-class ceiling).\n\n\
    **S4. Honest scope delimitation.** Leak-free binary F₁ as primary metric avoids\
    \ inflated results. Instruct degradation prominently discussed in main text (§4.7).\
    \ Negative downstream finding (Claim 3) reported transparently. 5-class ceiling\
    \ reported as fundamental limitation rather than hidden.\n\n#### Weaknesses\n\n\
    **W1. Base-model-only scope severely limits practical impact.** DDR collapses\
    \ under instruction tuning: Qwen binary F₁ drops 0.821→0.658, OLMo shows 6/7 feature\
    \ direction reversals (Table 9). Since most deployed LLMs are instruction-tuned,\
    \ the method's applicability to real-world contamination detection is narrow.\
    \ The paper acknowledges this but the limitation is fundamental, not peripheral.\n\
    \n**W2. Generator subset heterogeneity across experiments.** Different experiments\
    \ use different generator subsets (5-gen LOGO in §4.2, 6-gen with Qwen3-8B in\
    \ §4.9, 9-gen in Appendix H, cross-model uses 5 heterogeneous). This makes it\
    \ difficult to compare absolute numbers across experiments and track how adding\
    \ generators affects the overall picture.\n\n**W3. Cross-domain evaluation potentially\
    \ confounded.** The multi-domain evaluation (Table 10) does not specify temperature,\
    \ but the main LOGO experiments use t=0.7. If domains were generated at different\
    \ temperatures or the domain evaluation used t=1.0, the results may be confounded\
    \ by the temperature sensitivity documented in Appendix C.\n\n**W4. \"Location\
    \ shift\" mechanism remains speculative.** The location-shift interpretation is\
    \ presented prominently (§3.4, §5) but never directly validated. No NLL distribution\
    \ plots are shown; only summary statistics are reported. The mechanism would be\
    \ strengthened by showing actual NLL histograms at different depths, fitting parametric\
    \ models, or testing location-scale decomposition formally.\n\n**W5. Downstream\
    \ utility claim underpowered.** Claim 3 rests on only n=3 seeds, 1 model (OLMo-1B),\
    \ 1 downstream metric (perplexity). While TOST is the right test and seed variance\
    \ is low (<0.002 ppl), the generalization of this negative finding to other models,\
    \ tasks, and evaluation metrics is unestablished. Listing it as a numbered contribution\
    \ overstates the evidence.\n\n#### Questions for Authors\n1. Does DDR collapse\
    \ under instruction tuning mean it is a base-model artifact of unconstrained sampling\
    \ rather than a fundamental property of recursive generation?\n2. In cross-model\
    \ chains, does the classifier partly exploit generator identity (different tokenizer\
    \ biases producing distinct feature signatures) rather than pure depth signal?\n\
    3. Should tail_decay be reclassified as intermediate given that TOST passes for\
    \ only a subset of generators?\n4. What is the temperature used for the multi-domain\
    \ evaluation in Table 10?\n5. Could you show raw NLL distributions (histograms/KDEs)\
    \ at depth 0 vs depth 4 to directly validate the location-shift claim?\n\n####\
    \ Minor Issues\n- Table numbering in main text vs context YAML differs (e.g.,\
    \ baseline comparison is Table 4 in paper but Table 5 in YAML)\n- The paper reports\
    \ 8 generators in the abstract/conclusion but the primary LOGO evaluation (Table\
    \ 3) uses only 5; this creates a slight inconsistency\n- The paper is 14 pages\
    \ (8 main + 6 appendix) which is well-structured, but the appendix-heavy format\
    \ means several important results (QLoRA, temperature, robustness) are only in\
    \ appendix\n\n---\n\n### Reviewer 2 — Novelty & Related Work\n\n**Score: 3.0 (Findings)\
    \ | Confidence: 4/5**\n\n#### Novelty Assessment\n\n**Task formulation**: Genuinely\
    \ new. While Briesch et al. (2025) study iterative LLM chains, they focus on paraphrastic\
    \ chains with attractor convergence and do not attempt ordinal depth classification.\
    \ The gen-0/gen-1/gen-2+ formulation for non-paraphrastic chains is an original\
    \ contribution.\n\n**DDR as concept**: Mixed. The observation that recursive generation\
    \ compresses vocabulary diversity (lower TTR, hapax, entropy) is a natural consequence\
    \ of known model collapse theory (Shumailov et al. 2024). DDR adds: (a) the drifting/stationary\
    \ partition, (b) systematic quantification across generators/domains, (c) causality\
    \ analysis. However, the underlying phenomenon — vocabulary impoverishment under\
    \ recursion — is not new. DDR provides a useful empirical framework and a name\
    \ for the partition, but overstates novelty when presented as a \"concept.\"\n\
    \n**Distinction from model collapse literature**: Adequate. The paper correctly\
    \ positions itself as studying individual text provenance (diagnostic) rather\
    \ than aggregate training consequences. This is a meaningful angle difference.\n\
    \n#### Related Work Gaps\n\n- **Watermarking literature** (Kirchenbauer et al.\
    \ 2023, etc.): Not discussed. Watermarking is an alternative approach to provenance\
    \ tracking that should be contrasted.\n- **Membership inference / data provenance**:\
    \ Works on tracing training data origins are conceptually related but uncited.\n\
    - **Concurrent work**: If Geng et al. (2026) or similar concurrent submissions\
    \ exist, the novelty claim is weakened. The paper should explicitly address whether\
    \ similar ideas appeared concurrently.\n- **Self-consuming generative models**:\
    \ Alemohammad et al. (2024) study recursive generation loops; should be cited.\n\
    - The current 11 references feel thin for a paper with this scope.\n\n#### Contribution\
    \ Significance\n\n**7-feature vs Avg-LogProb gap (3.3 pp)**: The headline improvement\
    \ is modest. The paper correctly argues the advantage is in stability (narrower\
    \ CI) and cross-generator generalization, not raw performance. However, a reviewer\
    \ could reasonably ask: why not just use Avg-LogProb?\n\n**Negative finding (Claim\
    \ 3)**: Valuable in principle (\"honest science\"), but underpowered as discussed\
    \ by R1. Should be downgraded from numbered contribution to a secondary finding.\n\
    \n**Overall**: The contribution is primarily empirical — a thorough characterization\
    \ of a somewhat expected phenomenon. This is solid Findings material but lacks\
    \ the conceptual or methodological novelty for main conference at a top venue.\n\
    \n#### Scope Concerns\n\n- **Base models only**: The most critical limitation.\
    \ In 2026, virtually all LLM-generated text comes from instruction-tuned models.\
    \ The paper's method does not apply to the dominant use case.\n- **3-class ceiling**:\
    \ Limits practical utility. gen-0/gen-1/gen-2+ is useful for provenance but coarse.\
    \ The 5-class F₁ ≈ 0.50 means finer resolution is unachievable.\n- **Temperature\
    \ t > 0.9**: Many deployed models use high temperatures for creative tasks. The\
    \ signal degradation at t=0.9 (binary F₁ drops from 0.694 to 0.480) is a significant\
    \ practical limitation.\n- **English only**: No multilingual evaluation.\n- **Compounding\
    \ scope**: base-only × moderate-temp × 3-class × English = very narrow applicability\
    \ window.\n\n#### Strengths\n\n**S1. Statistical rigor is exemplary.** TOST for\
    \ equivalence, bootstrap CIs throughout, Bonferroni correction for multiple comparisons,\
    \ Granger for causality, McNemar for classifier comparison. This should be the\
    \ standard for empirical NLP papers.\n\n**S2. Transparent limitation reporting.**\
    \ The instruct degradation (§4.7), temperature sensitivity (Appendix C), and 5-class\
    \ ceiling (Appendix B) are reported prominently and honestly. This builds trust\
    \ in the positive results.\n\n**S3. Efficiency positioning is well-argued.** The\
    \ 7-feature pipeline (single Pythia-410M forward pass) vs QLoRA (15× cost) and\
    \ multi-detector ensemble (2.4× cost) demonstrates practical value within the\
    \ base-model scope.\n\n**S4. Cross-model chain result is compelling.** Binary\
    \ F₁ = 0.830 on heterogeneous chains (Table 5) is the most practically relevant\
    \ result, since real contamination involves mixed generators.\n\n#### Weaknesses\n\
    \n**W1. Narrow practical applicability compounds.** As enumerated above: base-only\
    \ × moderate-temp × 3-class × English. Each limitation alone is acceptable; together\
    \ they define a very restricted use case.\n\n**W2. Core phenomenon is known.**\
    \ Vocabulary diversity decreasing under recursive generation is predicted by model\
    \ collapse theory and observed empirically in prior work. The drifting/stationary\
    \ partition is a useful decomposition but not a fundamentally new insight.\n\n\
    **W3. Negative finding underpowered.** 3 seeds, 1 model, 1 metric. The TOST result\
    \ is valid but narrow. A numbered contribution claim requires broader validation.\n\
    \n**W4. Pythia reference model confound.** Pythia-410M shares architecture/tokenizer\
    \ with Pythia-1B and Pythia-2.8B, which are the two best-performing generators\
    \ under LOGO (Table 3). The cross-reference validation (Table 6) uses only 3 alternatives\
    \ with a narrow spread (0.803–0.816). More diverse reference models would strengthen\
    \ the \"generation-intrinsic\" claim.\n\n**W5. Thin bibliography.** 11 references\
    \ for a paper spanning detection, model collapse, stylometry, and data curation\
    \ is inadequate. Missing: watermarking, membership inference, self-consuming models,\
    \ concurrent works on iterative generation.\n\n#### Questions for Authors\n1.\
    \ Can you show raw NLL distribution plots (histograms or KDEs) at depth 0 vs depth\
    \ 4 to directly visualize the claimed location shift?\n2. What is the mechanistic\
    \ explanation for feature direction reversal under instruction tuning (Table 9)?\
    \ Does RLHF/DPO create an opposing \"format compliance\" shift that cancels the\
    \ recursive drift?\n3. In cross-model chains, how much of the F₁ improvement comes\
    \ from generator-switching artifacts vs genuine depth signal amplification?\n\
    4. Have you considered adversarial robustness — can an attacker deliberately manipulate\
    \ features to disguise depth?\n5. How does the method perform on longer texts\
    \ (>2000 tokens)?\n\n#### Minor Issues\n- 11 references is thin; aim for 25+ for\
    \ this scope\n- The abstract mentions \"8 base-model generators from 5 families\"\
    \ but the primary evaluation (Table 3) uses only 5 generators — clarify\n- \"\
    Inspired rewriting\" prompt type is not clearly defined in the method section\n\
    - Some table numbers differ between main text and what might be expected from\
    \ the context\n\n---\n\n## Step 2: Cross-Sharing Synthesis\n\n### Points of Agreement\n\
    1. **Experimental thoroughness is the paper's strongest asset.** Both reviewers\
    \ independently highlight the 24+ experiments and systematic coverage of reviewer\
    \ concerns as exceptional.\n2. **Base-model-only scope is the most critical limitation.**\
    \ Both agree this fundamentally restricts practical impact and question whether\
    \ DDR is a base-model artifact.\n3. **Downstream negative finding is underpowered.**\
    \ Both flag n=3 seeds, 1 model as insufficient for a numbered contribution.\n\
    4. **Location-shift mechanism needs direct validation.** Both request NLL distribution\
    \ plots rather than relying solely on summary statistics.\n5. **Cross-model chain\
    \ result (0.830) is the most compelling practical finding.** Both highlight this\
    \ as strong evidence for deployment relevance within scope.\n6. **Statistical\
    \ methodology is exemplary.** TOST, bootstrap, Granger, McNemar — both praise\
    \ the statistical rigor.\n\n### Points of Divergence\n1. **DDR novelty**: R1 considers\
    \ the task formulation and DDR partition genuinely novel; R2 views DDR as a useful\
    \ quantitative framework for a known phenomenon (vocabulary impoverishment), reducing\
    \ novelty credit.\n2. **Score gap (3.5 vs 3.0)**: R1 weights thoroughness and\
    \ honest reporting more heavily; R2 penalizes more for narrow scope and limited\
    \ novelty beyond known phenomena.\n3. **Bibliography**: R2 flags 11 references\
    \ as inadequate and identifies specific missing areas (watermarking, self-consuming\
    \ models); R1 does not raise this.\n\n---\n\n## Step 3: Convergence Discussion\n\
    \n### Resolved Disagreements\n\n**DDR novelty**: Converged to a middle position.\
    \ The *task formulation* (ordinal depth classification) is genuinely new. The\
    \ *DDR decomposition* (drifting/stationary partition with multi-method validation)\
    \ adds meaningful empirical structure beyond \"vocabulary impoverishment.\" However,\
    \ the *underlying phenomenon* is not new, and the paper would benefit from more\
    \ explicitly acknowledging this lineage. **Verdict**: Novel framework for a partially\
    \ known phenomenon — appropriate for Findings, borderline for main conference.\n\
    \n**Score**: Converged to **3.25**, solidly in the Findings range. The paper's\
    \ thoroughness and honest reporting push it toward the upper end of Findings,\
    \ but the narrow practical scope (base-only, moderate-temp, 3-class, English)\
    \ and modest improvement over Avg-LogProb (3.3 pp) prevent it from reaching main\
    \ conference level.\n\n### Unresolved Concerns\n\n1. **Is DDR fundamental to recursion\
    \ or an artifact of base-model sampling?** The instruct degradation evidence (Table\
    \ 9) leaves this question open. If DDR depends on the absence of alignment constraints,\
    \ it characterizes a property of unconstrained autoregressive sampling, not recursive\
    \ generation per se.\n\n2. **Cross-model chain F₁ boost**: Neither reviewer can\
    \ determine from the paper whether the 0.830 binary F₁ partly exploits generator\
    \ identity (different tokenizers → distinct feature signatures) vs pure depth\
    \ signal amplification.\n\n---\n\n## Step 4: Consolidated Assessment\n\n### Overall\
    \ Score: 3.25 (Findings)\n\n### Headline Assessment\nA thoroughly executed empirical\
    \ study that formulates a new task (generation depth classification) and provides\
    \ extensive evidence for a useful decomposition (DDR). The statistical methodology\
    \ is exemplary and the limitation reporting is refreshingly honest. However, the\
    \ narrow practical scope (base models only, moderate temperatures, 3-class ceiling,\
    \ English) and the fact that the underlying phenomenon (vocabulary impoverishment\
    \ under recursion) is largely known limit the contribution to Findings level.\
    \ The 3.3 pp margin over Avg-LogProb is real but modest, and the negative downstream\
    \ finding (Claim 3) is underpowered for a numbered contribution.\n\n### Strengths\
    \ (Consensus)\n1. **Exemplary statistical rigor**: TOST, bootstrap CIs, Granger\
    \ causality, McNemar, Bonferroni — sets a high bar for empirical NLP\n2. **Exceptional\
    \ experimental thoroughness**: 24+ experiments systematically addressing confounds\
    \ (length, topic drift, seed sharing), robustness (editing, temperature), and\
    \ generalization (cross-generator, cross-model, cross-domain, cross-reference)\n\
    3. **Honest, transparent scope delimitation**: Instruct degradation, 5-class ceiling,\
    \ temperature sensitivity, and negative downstream finding all reported prominently\n\
    4. **Novel task formulation**: Ordinal depth classification beyond binary detection\
    \ is a genuine contribution; the gen-0/gen-1/gen-2+ framework is well-motivated\n\
    5. **Cross-model chain result (0.830)**: The most practically relevant finding,\
    \ demonstrating that heterogeneous contamination amplifies rather than obscures\
    \ depth signal\n\n### Weaknesses (Consensus)\n1. **Base-model-only scope**: DDR\
    \ collapses under instruction tuning (−16.3 pp, feature reversals). Since deployed\
    \ LLMs are instruction-tuned, practical applicability is severely limited. This\
    \ is the paper's most fundamental limitation.\n2. **Core phenomenon partially\
    \ known**: Vocabulary impoverishment under recursive generation is predicted by\
    \ model collapse theory. DDR provides a useful empirical framework but the underlying\
    \ observation is not new.\n3. **Modest improvement over simple baseline**: 7-feature\
    \ ensemble beats Avg-LogProb by only 3.3 pp (0.798 vs 0.765). The advantage is\
    \ in stability (narrower CI) and interpretability, not raw performance.\n4. **Underpowered\
    \ negative finding**: Claim 3 rests on 3 seeds, 1 model, 1 metric. TOST is correct\
    \ but the scope is too narrow to list as a numbered contribution.\n5. **Thin bibliography\
    \ and missing related work**: 11 references insufficient for a paper spanning\
    \ detection, model collapse, stylometry, and data curation. Missing: watermarking,\
    \ self-consuming models, membership inference.\n\n### Actionable Recommendations\
    \ for Revision\n1. **Add NLL distribution plots** at depth 0 vs depth 4 to directly\
    \ visualize the location-shift claim\n2. **Expand negative finding** to multiple\
    \ models and downstream tasks, or downgrade from numbered contribution\n3. **Expand\
    \ bibliography** to 25+ references; add watermarking, self-consuming models (Alemohammad\
    \ et al. 2024), and explicitly address concurrent work\n4. **Clarify generator\
    \ subsets** — create a single table mapping which generators appear in which experiment\n\
    5. **Investigate instruct degradation mechanistically**: Is the feature reversal\
    \ caused by format compliance, length regulation, or something else? This analysis\
    \ could strengthen the paper significantly.\n6. **Standardize temperature** across\
    \ all experiments and make it explicit in each evaluation section\n7. **Show Avg-LogProb\
    \ as a strong single-feature baseline** more prominently, and argue the 7-feature\
    \ ensemble's value through interpretability and DDR insights, not just marginal\
    \ F₁ gains\n\n### Experiment Coverage Assessment\nCompared to the 20 imagined\
    \ experiments in the review context:\n- **Fully covered** (17/20): feature ablation,\
    \ cross-generator, cross-reference, downstream utility, prompt type, paraphrastic\
    \ comparison, cross-model chains, multi-domain, finer ordinal, human edit robustness,\
    \ LD-Score, end-to-end classifier, length control, large-scale generator, baseline\
    \ comparison, DDR causality, TOST stationarity\n- **Covered but abbreviated**\
    \ (2/20): 9-gen scale evaluation (appendix only), instruct degradation (main text\
    \ but could be deeper)\n- **Partially missing** (1/20): temperature sensitivity\
    \ (appendix only, 3 points, no cross-temperature transfer analysis in paper)\n\
    \nCoverage is excellent — the paper reports on essentially all imagined experiments.\n\
    \n### Scores Summary\n\n| Criterion | R1 | R2 | Converged |\n|---|---|---|---|\n\
    | Soundness | 4/5 | 3.5/5 | 3.75/5 |\n| Novelty | 3/5 | 2.5/5 | 2.75/5 |\n| Significance\
    \ | 3/5 | 2.5/5 | 2.75/5 |\n| Thoroughness | 5/5 | 5/5 | 5/5 |\n| Presentation\
    \ | 4/5 | 3.5/5 | 3.75/5 |\n| **Overall** | **3.5** | **3.0** | **3.25** |\n|\
    \ **Confidence** | **4/5** | **4/5** | **4/5** |\n\n### Final Verdict\n**Findings-level\
    \ paper.** Strong empirical execution with honest reporting, but the narrow practical\
    \ scope and partially known underlying phenomenon position it below the main conference\
    \ threshold. The paper would benefit most from (a) extending DDR to instruction-tuned\
    \ models (even a partial signal recovery would be transformative) and (b) mechanistic\
    \ analysis of the location-shift claim with direct distributional evidence."

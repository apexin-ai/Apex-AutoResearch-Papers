tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 3.5 Borderline Conference — 所有三个 Claim 在审稿中站住脚，DDR 被认可为 genuine empirical
        contribution，论文整体完成度被视为 Findings 上限
      key_assumptions:
      - DDR 的 drifting/stationary 分离被视为 non-trivial 发现，而非 vocabulary impoverishment
        的重新包装（审稿人接受 McNemar p≈0 + reference-only binary F1=0.833 作为 complementarity
        证据）
      - Base-model-only scope 被接受为合理的 first-step scoping（审稿人认可 instruct 退化的诚实报告是 strength
        而非 weakness）
      - 0.694 LOGO binary F1 在 8-gen 跨家族设定下被认为 non-trivial（审稿人理解 leak-free LOGO 的难度）
      - Negative downstream finding (Claim 3) 被认可为 valuable honest science，而非 'method
        doesn't work'
      - 33 页 + 20+ appendix 实验的体量被认为 thorough，没有 reviewer 因为 paper 组织问题拒稿
      number_ranges:
        expected_reviewer_avg:
        - 3.5
        - 4.0
        reviewer_spread:
        - 3
        - 4
        logo_binary_f1_perception: 0.694 被接受为 'reasonable for this hard setting'
        cross_model_f1_weight: 0.830 cross-model F1 被 highlight 为 generalization evidence
        ddr_causality_acceptance: 6/7 Granger + 5.5× permutation gap 被视为 sufficient
          causal evidence
        instruct_scope_penalty: 0 — 诚实报告被视为 strength
      narrative_direction: 原始 framing 完全成立。三个 Claims 无需调整强度。Abstract/conclusion 保持当前版本：novel
        task formulation + DDR characterization + honest negative finding。强调 empirical
        thoroughness（9 generators, 5 families, 3 prompt types, 4 domains, causality
        analysis, robustness tests）。Contribution positioning 不变：Findings-level empirical+conceptual
        paper。
    median:
      tier: median
      meaning: 3.0 Solid Findings — 核心贡献被认可但有保留，1-2 个 reviewer 对 scope 或 novelty 有中等强度质疑，需要
        rebuttal 中补充解释或微调 claims
      key_assumptions:
      - DDR 被部分接受：审稿人认可 drifting features 的趋势，但质疑 shape feature 的 stationarity 是否只是
        weak signal 而非 genuine invariance（entropy_std 的 TOST rejection rate=0 + d=0.458
        被追问）
      - Base-model-only scope 被 1-2 个审稿人标记为 major limitation，要求讨论 instruct 场景下的 practical
        relevance
      - 0.694 F1 被认为 modest — 审稿人指出 per-gen range 0.633-0.724 的方差，质疑 worst-case (Mistral-7B
        0.633) 的实用性
      - Negative downstream finding 被接受但审稿人要求更多 evidence（单一 perplexity metric + 3
        seeds 被认为 limited）
      - Gemma-2-2B anomaly (gen-1 F1=0.036) 被追问：是方法失败还是 Gemma 特殊性？
      number_ranges:
        expected_reviewer_avg:
        - 3.0
        - 3.5
        reviewer_spread:
        - 2
        - 4
        logo_binary_f1_perception: 0.694 被标注为 'modest' 或 'limited practical utility'
        ddr_entropy_std_challenge: entropy_std (d=0.458, TOST rejection=0) 需要解释为何归入
          stationary 组
        instruct_scope_penalty: -0.5 pp on one reviewer — 需要在 rebuttal 中论证 base-model
          scope 的合理性
        gemma_anomaly_penalty: -0.25 pp — 需要在 paper 中显式讨论
      narrative_direction: Claim 1 保持但在 abstract 中加入 per-gen range (0.633–0.724) 和
        worst-case caveat。Claim 2 微调：将 entropy_std 从 stationary 组中移出或重新定义为 'intermediate'，DDR
        从二分法调整为 spectrum（drifting → intermediate → stationary）。Claim 3 保持 negative
        framing 但承认 evidence 有限（3 seeds, 单 metric）。增加一段讨论：当前方法定位为 base-model provenance
        diagnostic，instruct 场景是 explicit future work。Rebuttal 重点回应 scope 和 Gemma anomaly。
    worst:
      tier: worst
      meaning: 2.5-3.0 Below Threshold — 核心假设被挑战，至少一个 reviewer 给出 reject，需要 substantial
        reframing 但仍冲 EMNLP Findings（不降级到 workshop）
      key_assumptions:
      - DDR 被认为是 vocabulary impoverishment 的 repackaging — 审稿人认为 surface-only F1=0.688
        vs full 0.773 的差距不够大，reference features 只是 'another way to measure the same
        signal'
      - Base-model-only + temperature-sensitive + instruct 退化被综合视为 fatal scope limitation
        — 审稿人认为现实数据几乎全来自 instruct models
      - 0.694 F1 被认为 insufficient for practical use — 审稿人对比 binary detection baselines
        (FastDetectGPT 等 >0.95 F1) 认为 depth classification 太难而回报太低
      - Task formulation novelty 被质疑：审稿人认为 depth classification 缺乏明确下游应用（Claim 3 的
        negative finding 被 weaponize 为 'why does this matter'）
      - Paper 过长（33 页）被批评为 unfocused — 审稿人认为实验多但缺乏 coherent story
      number_ranges:
        expected_reviewer_avg:
        - 2.5
        - 3.0
        reviewer_spread:
        - 2
        - 3.5
        logo_binary_f1_perception: 0.694 被与 binary detection (>0.95) 不公平对比，被标记为 'not
          actionable'
        surface_vs_full_gap: 0.085 差距被认为 marginal（surface alone 'nearly as good'）
        instruct_scope_penalty: -1.0 pp on 1-2 reviewers — 被视为 deal-breaker
        task_utility_challenge: negative Claim 3 被反转为 anti-evidence
      narrative_direction: 需要 fundamental reframing，但不降级目标（仍投 EMNLP Findings，走 ICLR
        2027 fallback 如果 reject）。两个可能的 reframe 方向：(A) 从 'depth classification as a
        tool' 转向 'empirical study of recursive generation dynamics' — 把 DDR 本身作为 contribution
        而非分类器，强调对 model collapse 理论的 empirical grounding（连接 Shumailov et al. 的 model
        collapse 文献），弱化分类器性能指标，强化 phenomenon characterization。(B) 从 'standalone method'
        转向 'complementary signal for existing detectors' — 展示 7-feature + existing
        detectors 的 ensemble 提升（已有 multi-detector 数据：4-det+surface 3-class 0.795），reposition
        为 'depth features as additional signal dimension'。两个方向均利用已有实验数据，不需要新实验。5 天内可完成
        narrative 重写 + 补充 1-2 个支撑实验。

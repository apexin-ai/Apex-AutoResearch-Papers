    ---


    ## 7. Questions for Authors


    1. **On DDR novelty**: How do you distinguish DDR from the well-established observation
    that recursive generation causes vocabulary impoverishment? What does the "differential"
    framing add beyond "some features change and some don''t"?


    2. **On practical utility**: Given binary F1=0.694 and the +3.3pp margin over
    Avg-LogProb, can you articulate a concrete data-curation workflow where this level
    of depth discrimination provides actionable value?


    3. **On QLoRA gap**: The 7-feature ensemble is outperformed by +14.5pp by QLoRA.
    Beyond efficiency, is there a scenario where interpretable features are strictly
    necessary rather than merely convenient?


    4. **On Gemma-2-2B**: The gen-1 F1=0.036 failure is acknowledged but not explained.
    Have you examined the raw feature distributions for Gemma gen-0 vs gen-1? Are
    they truly overlapping, or is this a classifier-side failure?


    5. **On instruct heterogeneity**: OLMo-Inst degrades by −42.5pp while Llama-Inst
    degrades by −1.1pp. Is there a feature-level explanation for this 40× difference
    in degradation? Could the method be adapted for instruct models with architecture-specific
    calibration?


    6. **On bibliography**: Only 5 references are cited. At minimum, the Shumailov
    et al. model collapse work (Nature 2024) and data contamination literature should
    be discussed. Is this an oversight or a deliberate choice?


    7. **On downstream evidence**: Would a broader set of downstream metrics (factuality,
    toxicity, task accuracy) or additional model sizes change the "diagnostic not
    curative" conclusion?


    ---


    ## 8. Actionable Recommendations


    ### Top priority (for resubmission):

    1. **Expand related work and bibliography significantly** — 5 references is unacceptable
    for a top venue. Engage deeply with model collapse (Shumailov et al.), data contamination
    detection, vocabulary diversity in NLG, and watermarking/provenance literatures.
    Differentiate DDR from each clearly.


    2. **Reframe the contribution around DDR characterization, not classification**
    — The classification performance (F1=0.694) and the narrow baseline margin (+3.3pp)
    are the weakest aspects. The DDR characterization (spectrum model, cross-reference
    validation, semantic-vs-distributional decoupling) is the strongest. Center the
    paper''s narrative on the empirical characterization and use classification as
    one validation, not the headline.


    3. **Address the scope-narrowing cascade** — Base models + moderate temperature
    + non-Gemma architectures is a narrow operating regime. Either (a) provide evidence
    of a path to broader applicability, or (b) reframe more explicitly as a "proof
    of concept that depth signal exists" rather than a practical tool.


    ### Secondary:

    4. **Provide mechanistic analysis of Gemma-2-2B failure** — Raw feature distribution
    plots for Gemma gen-0 vs gen-1 would clarify whether this is signal absence or
    classifier failure.


    5. **Strengthen downstream experiment** — Add at least one downstream task metric
    beyond perplexity, and consider a second fine-tuning base model.


    6. **Discuss the QLoRA gap proactively in the main text** — Currently in appendix.
    Bringing this to the Discussion section with explicit positioning (features enable
    DDR analysis; QLoRA is a black-box alternative) would preempt reviewer concerns.



  review_report: "---\ndream_id: dream_20260520T100349\ntier: worst\noverall_score:\
    \ 2.5 / 6 — Borderline Reject\ntimestamp: 2026-05-20T11:01:31.823566+00:00\n---\n\
    \n# Dream Review Report — Differential Depth Response in Recursive LLM Generation\n\
    \n**Dream ID**: 20260520T100349  \n**Review Mode**: Full (2-Reviewer Roundtable)\
    \  \n**Date**: 2026-05-20  \n\n---\n\n## Overall Assessment\n\n| Metric | Value\
    \ |\n|--------|-------|\n| **R1 Score (Methods & Experiments)** | 3 / 6 (Weak\
    \ Reject) |\n| **R2 Score (Novelty & Related Work)** | 2 / 6 (Reject) |\n| **Consensus\
    \ Score** | **2.5 / 6 (Borderline Reject)** |\n| **R1 Confidence** | 4 / 5 |\n\
    | **R2 Confidence** | 4 / 5 |\n| **Recommendation** | Reject — insufficient novelty\
    \ and performance for a top ML venue |\n\n---\n\n## Paper Summary\n\nThe paper\
    \ formulates **generation depth classification** as a new task beyond binary AI-text\
    \ detection: classify text as gen-0 (human), gen-1 (first-generation LLM output),\
    \ or gen-2+ (recursive generation). The key concept is **Differential Depth Response\
    \ (DDR)**: central-tendency features (entropy mean, TTR, hapax ratio) drift monotonically\
    \ with depth while shape features (entropy max, tail decay) remain near-stationary.\
    \ A 7-feature XGBoost ensemble achieves LOGO binary F1 = 0.680 across 5 base-model\
    \ generators from 3 families (0.6B–8B). The paper reports 15 experimental conditions\
    \ and a key negative finding: depth-aware data curation is equivalent to random\
    \ subsampling (TOST confirmed).\n\n---\n\n## Consolidated Strengths\n\n### S1.\
    \ Comprehensive experimental coverage\nBoth reviewers acknowledge the impressive\
    \ breadth: 15 experimental conditions covering ablation, cross-generator/family\
    \ transfer, alternative reference models, prompt types, paraphrastic chains, cross-model\
    \ chains, multi-domain seeds, ordinal resolution, robustness, character-level\
    \ features, end-to-end neural classifiers, length confounds, scale effects, and\
    \ baseline comparisons. This is significantly more thorough than typical submissions.\n\
    \n### S2. Rigorous evaluation methodology\nThe LOGO and LOFO protocols are well-designed.\
    \ The paper correctly identifies and quantifies within-family inflation (~3.8\
    \ pp for Pythia). The TOST equivalence test for the negative finding is a model\
    \ of how to report negative results (±2% margin, p = 1.1×10⁻⁴, 3 seeds, std <\
    \ 0.002).\n\n### S3. Honest reporting of limitations\nThe paper does not overclaim.\
    \ Scope boundaries (instruct collapse, scale degradation, edit fragility, domain\
    \ dependence, temperature sensitivity) are clearly stated. The negative downstream\
    \ finding is forthrightly reported. The Discussion section explicitly acknowledges\
    \ that existing detector ensembles outperform.\n\n### S4. Scientific value of\
    \ the negative finding\nDemonstrating that depth-aware curation provides no benefit\
    \ over random subsampling saves the community from pursuing this dead end. The\
    \ robustness of this negative result (cross-seed std < 0.002) strengthens its\
    \ value.\n\n### S5. Useful experimental conditions for the model collapse community\n\
    Cross-model chain evaluation (§4.8) and paraphrastic vs non-paraphrastic comparison\
    \ (§4.7) extend the iterative generation literature with novel experimental designs.\n\
    \n---\n\n## Consolidated Weaknesses\n\n### W1. [MAJOR — Novelty] DDR is largely\
    \ repackaged vocabulary impoverishment\n*Both reviewers agree.* All three \"drifting\"\
    \ features (hapax ratio, TTR, entropy_mean) measure lexical diversity from different\
    \ angles—they decline with depth because recursive generation progressively impoverishes\
    \ vocabulary, a phenomenon extensively documented in model collapse literature\
    \ (Shumailov et al. 2024, Briesch et al. 2023). Calling this \"differential depth\
    \ response\" and contrasting it with \"stationary\" shape features provides a\
    \ modest organizational insight but does not constitute discovery of a new phenomenon.\
    \ entropy_std at R² = 0.41 in the \"ambiguous\" zone further weakens the claimed\
    \ clean drifting/stationary dichotomy—this is a gradient, not a bimodal split.\
    \ LD-Score's negligible contribution (+0.6 pp, lowest feature importance) reinforces\
    \ the interpretation that all features measure the same underlying effect.\n\n\
    ### W2. [MAJOR — Novelty] Task formulation is a minimal extension of binary detection\n\
    *Both reviewers agree.* 5-class F1 = 0.468 with gen-2/3/4 confusion rates of 43–51%\
    \ demonstrates the signal supports approximately 2.5 effective classes. Ordinal\
    \ methods (CORAL, Frank-Hall) provide no improvement. The only new capability\
    \ beyond binary detection is gen-1 vs gen-2+ at 0.680 F1—one additional class\
    \ at modest accuracy. The \"depth classification\" framing overclaims; \"augmented\
    \ binary detection with shallow depth signal\" is more accurate.\n\n### W3. [MAJOR\
    \ — Contribution] Multi-detector ensemble outperforms proposed method\n*Both reviewers\
    \ agree; R2 calls this \"fundamentally undermining.\"* The 4-detector + surface\
    \ ensemble (LOGO F1 = 0.708) surpasses the 7-feature ensemble (0.680) by 2.8 pp\
    \ (p = 0.024). If existing detectors can be trivially ensembled to outperform\
    \ purpose-built depth features, the depth-specific feature engineering adds no\
    \ practical value. Furthermore, the 7-feature advantage over the best single baseline\
    \ (Avg-LogProb, +2.7 pp, p = 0.038) does not survive Bonferroni correction for\
    \ 4 comparisons (adjusted p ≈ 0.152).\n\n### W4. [MAJOR — Performance] LOGO binary\
    \ F1 = 0.680 is insufficient\n*R1 emphasis, R2 concurs.* For a classification\
    \ task, 0.680 binary F1 means ~32% of gen-1/gen-2+ distinctions are wrong. For\
    \ context, binary AI-text detectors achieve >0.95 F1. This level of performance\
    \ is insufficient for any practical application (provenance auditing, contamination\
    \ flagging). Under realistic compounded conditions (scientific domain + elaboration\
    \ prompt + light editing + larger model), estimated performance drops to ~0.58–0.62,\
    \ approaching chance.\n\n### W5. [MAJOR — Motivation] Negative finding undermines\
    \ practical motivation\n*R2 emphasis, R1 concurs.* If depth has no utility for\
    \ data curation (the most obvious application), the \"diagnostic tool\" framing\
    \ requires 0.680 F1 to be useful for provenance characterization. But provenance\
    \ characterization with ~32% error rate has questionable practical value. The\
    \ paper needs to demonstrate at least one downstream task where depth knowledge\
    \ is actionable, or accept positioning as pure empirical characterization.\n\n\
    ### W6. [MAJOR — Scope] Compounding limitations severely narrow applicability\n\
    *Both reviewers agree.* The method requires: base models (not instruct), moderate\
    \ temperature, unedited text, Wikipedia-like domains, continuation prompts, and\
    \ models ≤2.8B for best performance. Each limitation compounds: base-only × temperature-sensitive\
    \ × unedited × Wikipedia-domain × continuation ≈ a narrow niche that excludes\
    \ the vast majority of real-world AI-generated text. Scale degradation (8B: −10.6\
    \ pp, compression ratio 0.58) with a clear downward trend suggests frontier models\
    \ (70B+) would yield near-chance performance—exactly the models generating the\
    \ \"contamination crisis\" the paper claims to address.\n\n### W7. [MODERATE]\
    \ Surface features capture 95.9% of performance\nThe 3.2 pp gap between surface-only\
    \ (0.741) and full (0.773) questions whether a 410M reference model forward pass\
    \ is justified. McNemar p = 0.027 is marginal and may not survive multiple comparison\
    \ correction.\n\n### W8. [MODERATE] QLoRA gap reveals missed signal\nWithin-distribution\
    \ QLoRA achieves 0.842 vs 0.694 (+14.8 pp binary), showing the handcrafted features\
    \ miss substantial depth signal. The LOGO crossover (3-class: 0.743 vs 0.762 favoring\
    \ 7-feature; binary: 0.712 vs 0.694 favoring QLoRA) provides some defense, but\
    \ the efficiency argument (1× vs 47×) is insufficient given the magnitude of the\
    \ within-distribution gap.\n\n### W9. [MODERATE] Cross-reference-model drift magnitude\
    \ varies 2×\nOLMo reference entropy_mean drift is 51% of Pythia reference (−0.61\
    \ vs −1.19). While direction is consistent, this magnitude dependence suggests\
    \ DDR partially captures reference-generator mismatch rather than intrinsic recursive\
    \ generation dynamics.\n\n### W10. [MINOR] Cross-model chain improvement may detect\
    \ generator switching\nThe +13.6 pp LOGO improvement for cross-model chains is\
    \ most parsimoniously explained by OOD detection of different model fingerprints\
    \ at each depth, not by depth signal.\n\n### W11. [MINOR] Missing multiple comparison\
    \ correction\nNo systematic Bonferroni or FDR correction across the 15 experiments.\
    \ Several reported p-values (0.027, 0.038) are borderline and would not survive\
    \ correction.\n\n---\n\n## Consensus Questions for Authors\n\n1. How do you distinguish\
    \ DDR from vocabulary impoverishment measured at different granularities? What\
    \ specific aspect is not captured by Shumailov et al. (2024) or Briesch et al.\
    \ (2023)?\n\n2. After Bonferroni correction for the 4 baseline comparisons in\
    \ Table 16, is the 7-feature advantage over Avg-LogProb still significant?\n\n\
    3. Given that the multi-detector ensemble outperforms, what practical scenario\
    \ would favor the proposed features?\n\n4. What is the estimated F1 under compounded\
    \ realistic conditions (scientific domain + elaboration + 5% editing + 8B generator)?\n\
    \n5. Can you identify any downstream task where knowing generation depth (beyond\
    \ binary) provides actionable value?\n\n6. Given the 5-class collapse (F1 = 0.468,\
    \ gen-2/3/4 near-uniform), would you agree the task supports ~2.5 effective classes\
    \ rather than true ordinal depth estimation?\n\n---\n\n## Missing Experiments\
    \ / Analysis\n\n- **Instruct-model evaluation**: Acknowledged as limitation but\
    \ critical for practical relevance. Even partial instruct results would help scope\
    \ the contribution.\n- **Compounded-condition analysis**: No experiment tests\
    \ multiple degradation factors simultaneously (domain × prompt × editing × scale).\n\
    - **Statistical power analysis for LOFO**: Only 3 families → 3 folds, potentially\
    \ underpowered.\n- **Temperature sensitivity curve**: Only stated range [0.5,\
    \ 0.9], no granular analysis.\n- **At least one actionable downstream application**:\
    \ The paper needs to show depth information is useful for *something* beyond characterization.\n\
    \n---\n\n## Experiment Coverage Assessment\n\nAll 15 planned experiments are present\
    \ in the paper:\n\n| Experiment | Covered | Key Result |\n|-----------|---------|------------|\n\
    | Feature ablation & trend | ✓ Table 1–2 | Full 0.773, surface-only 0.741 (3.2\
    \ pp gap) |\n| Cross-generator (LOGO) | ✓ Table 3 | Avg binary F1 = 0.680, range\
    \ 8.1 pp |\n| Cross-family (LOFO) | ✓ Table 4 | Avg binary F1 = 0.665 (−1.5 pp\
    \ vs LOGO) |\n| Cross-reference model | ✓ Table 5 | Direction consistent, magnitude\
    \ varies 2× |\n| Downstream utility | ✓ Table 6 | TOST confirms equivalence (negative\
    \ finding) |\n| Prompt-type comparison | ✓ Table 7 | 5.1 pp range, continuation\
    \ best |\n| Paraphrastic chains | ✓ Table 8 | Attractor convergence confirmed,\
    \ Δ = 2.9 pp |\n| Cross-model chains | ✓ Table 9 | Binary F1 0.764 (+7.0 pp),\
    \ LOGO 0.830 |\n| Multi-domain seeds | ✓ Table 10 | Wikipedia best (0.724), scientific\
    \ worst (0.631) |\n| Finer-grained ordinal | ✓ Table 11 | 5-class F1 = 0.468,\
    \ ordinal methods no help |\n| Human edit robustness | ✓ Table 12 | −5.3 pp for\
    \ LLM rephrase, −11.1 pp at 20% |\n| LD-Score feature | ✓ §4.12 | +0.6 pp marginal,\
    \ lowest importance |\n| End-to-end classifier | ✓ Table 13 | QLoRA 0.842 vs 0.694\
    \ (+14.8 pp within-dist) |\n| Text length control | ✓ Table 14 | −4.6 pp after\
    \ matching, trends preserved |\n| Scale effect (8B) | ✓ Table 15 | 8B: −10.6 pp,\
    \ compression ratio 0.58 |\n| Ordinal baselines | ✓ Table 16 | Multi-det ensemble\
    \ 0.708 > 7-feat 0.680 |\n\nCoverage is complete. The issue is not missing experiments\
    \ but rather that the results across experiments consistently point to limited\
    \ contribution.\n\n---\n\n## Reviewer Discussion Summary\n\n### Points of Agreement\n\
    - DDR novelty is limited (vocabulary impoverishment repackaging)\n- Multi-detector\
    \ ensemble outperformance is a critical weakness\n- Compounding scope limitations\
    \ make the method impractical for real-world use\n- Negative downstream finding\
    \ is well-designed but undermines motivation\n- Scale degradation trend contradicts\
    \ the paper's stated motivation\n- Experimental methodology is sound (this is\
    \ a well-executed paper with an insufficient contribution)\n\n### Points of Partial\
    \ Disagreement\n- **Score calibration**: R1 (score 3) gives more credit to experimental\
    \ rigor and the standalone value of the negative finding. R2 (score 2) weights\
    \ novelty failure more heavily and views the 15-experiment coverage as dilutive\
    \ rather than additive. Both could accept 2.5 as compromise.\n- **Negative finding\
    \ value**: R1 views TOST as a standalone scientific contribution; R2 acknowledges\
    \ its quality but argues it cannot compensate for removing the primary motivation.\n\
    \n### Consensus Position\nThe paper is methodologically competent but the contribution\
    \ is insufficient for a top venue. The core issues are: (1) DDR is not a new phenomenon,\
    \ (2) the task formulation is a minimal extension of binary detection, (3) existing\
    \ baselines outperform, (4) performance is too low for practical use, and (5)\
    \ scope limitations compound to exclude the models and settings that matter most.\
    \ The paper would benefit from repositioning as an empirical characterization\
    \ study and identifying at least one scenario where depth knowledge provides actionable\
    \ value beyond binary detection.\n\n---\n\n## Recommendation\n\n**Reject.** The\
    \ paper presents thorough experimentation on a task with limited novelty, insufficient\
    \ performance, and narrow scope. The proposed method is outperformed by a trivial\
    \ ensemble of existing detectors, and the negative downstream finding removes\
    \ the primary practical motivation. To reach acceptance at a top venue, the paper\
    \ would need: (a) a compelling argument for why DDR is not just vocabulary impoverishment,\
    \ (b) at least one actionable downstream application for depth information, (c)\
    \ significant performance improvements or a convincing argument for why 0.680\
    \ F1 is sufficient, and (d) either extension to instruct/frontier models or repositioning\
    \ that does not rely on the \"contamination crisis\" motivation."

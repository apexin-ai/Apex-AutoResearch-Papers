  review_report: '---

    dream_id: dream_20260520T100349

    tier: median

    overall_score: 3.0/6 — Weak Reject (Findings-level, below main conference threshold)

    timestamp: 2026-05-20T10:55:27.038523+00:00

    ---


    # Dream Review Report


    **Paper**: Differential Depth Response in Non-Paraphrastic LLM Generation Chains:
    An Empirical Characterization Across Model Families


    **Review mode**: Full (2-reviewer roundtable, 4 steps)


    ---


    ## Reviewer Panel


    | Reviewer | Focus | Ind. Score | Final Score |

    |----------|-------|-----------|-------------|

    | R1 | Methods & Experiments | 3.5/6 | 3.5/6 |

    | R2 | Novelty & Related Work | 3.0/6 | 3.0/6 |

    | **Consensus** | | | **3.0/6 (Weak Reject)** |


    ---


    ## 1. Summary


    The paper formulates generation depth classification—ordinal prediction of whether
    text is gen-0 (human), gen-1 (first-generation LLM output), or gen-2+ (recursively
    generated)—for non-paraphrastic continuation chains. The core empirical finding
    is "differential depth response" (DDR): 7 features from a reference model''s NLL
    distribution divide into drifting features (entropy_mean, TTR, hapax_ratio; |ρ|>0.60)
    and stationary features (entropy_max, tail_decay; |ρ|<0.10), with entropy_std
    identified as intermediate (d=0.458). A 7-feature XGBoost ensemble achieves leak-free
    binary F1=0.694 (LOGO, 8 generators), 0.830 on cross-model chains. A downstream
    utility experiment confirms depth-aware curation is statistically equivalent to
    random subsampling (TOST p=1.1×10⁻⁴ at ±2%).


    ---


    ## 2. Strengths


    ### S1. Exceptionally thorough experimental coverage [R1, R2 agree]

    The paper covers 20+ experiments including feature ablation, cross-generator (LOGO/LOFO),
    cross-reference-model validation, cross-model chains, downstream utility, prompt
    type comparison, paraphrastic vs non-paraphrastic, multi-domain, 5-class ordinal,
    human edit robustness, LD-Score addition, QLoRA end-to-end, length control, large-scale
    generators, 9-generator evaluation, DDR causality analysis, TOST bootstrap stability,
    instruct model evaluation, temperature sensitivity, independent seed validation,
    seed complexity stratification, and topic drift correlation. This level of thoroughness
    exceeds most empirical papers and demonstrates rigorous scientific practice.


    ### S2. Rigorous leak-free evaluation protocol [R1]

    The LOGO (leave-one-generator-out) and LOFO (leave-one-family-out) protocols are
    well-designed. The LOGO-LOFO gap of only −0.8pp (Table 4) confirms minimal family
    leakage. Independent seed validation (Appendix N, Δ=−1.4pp) further demonstrates
    no seed leakage. This is a model of how cross-generator evaluation should be conducted.


    ### S3. Cross-reference-model falsification [R1]

    The validation across three reference models (Pythia-410M, OLMo-2-1B, Qwen3-0.6B;
    Table 5) proves DDR is generation-intrinsic rather than a Pythia-specific artifact.
    All three produce consistent entropy drift direction (negative), while tail_decay
    remains stationary. This is the paper''s strongest piece of evidence supporting
    the DDR construct.


    ### S4. Honest and transparent scope boundaries [R1, R2 agree]

    The paper is unusually transparent about limitations: base-model-only scope, temperature
    restriction (t∈[0.5, 0.9)), Gemma-2-2B failure case, instruct degradation heterogeneity.
    The Limitations section lists 7 explicit boundaries. This honesty is commendable
    and builds trust.


    ### S5. Cross-model chains result is practically relevant [R1]

    Binary F1=0.830 for cross-model chains (Table 7, +13.6pp over single-model) is
    the most practically meaningful result. Real-world web contamination involves
    multiple LLM sources, and the finding that generator heterogeneity *amplifies*
    depth signal is both surprising and useful.


    ### S6. DDR spectrum model is well-motivated [R1]

    The evolution from a binary partition (drifting vs stationary) to a spectrum (drifting
    → intermediate → stationary) is well-justified by the TOST bootstrap analysis
    (Table 20: entropy_std rejection rate 0/1000, d=0.458). This is a case where the
    data forced a more nuanced model, and the paper adapted honestly.


    ### S7. Novel task formulation [R2]

    The ordinal depth classification formulation (gen-0/gen-1/gen-2+) is genuinely
    new. Prior work treats detection as binary (human vs machine). The paper makes
    a clear case for why depth matters for data governance and contamination assessment.


    ---


    ## 3. Weaknesses


    ### W1. Modest headline performance [R1, R2 agree] — Medium severity

    Binary F1=0.694 is the paper''s headline metric and is moderate at best. Per-generator
    range 0.659–0.724 shows meaningful generator sensitivity. Worst-case Qwen3-0.6B
    at 0.659 raises practical utility concerns. The 9-generator evaluation further
    lowers the average to 0.666 (Table 9). At this performance level, roughly 1 in
    3 gen-1/gen-2+ distinctions is wrong—this may be insufficient for operational
    data curation.


    ### W2. Narrow advantage over simple baselines [R1, R2 agree] — Medium severity

    The 7-feature ensemble outperforms Avg-LogProb by only +3.3pp in LOGO macro F1
    (0.798 vs 0.765; Table 6). While statistically significant (bootstrap p<0.001),
    the practical margin is slim. The 7-feature ensemble''s CI is notably narrower
    ([0.786, 0.799] vs [0.616, 0.820]), indicating better cross-generator stability,
    but this advantage is in robustness rather than absolute performance. The 4-detector
    ensemble (0.795) matches the 7-feature set at only +0.003pp difference (p=0.38,
    not significant).


    ### W3. QLoRA substantially outperforms the proposed method [R1, R2 agree] — Medium-high
    severity

    QLoRA fine-tuned classifiers achieve 3-class F1=0.907 and binary F1=0.867 (Qwen3-1.7B-Instruct;
    Table 16), a +14.5pp binary improvement over the 7-feature ensemble. The paper
    positions 7-feature on interpretability and efficiency (~150× less inference),
    which is valid but only partially mitigates the concern. If a standard fine-tuning
    approach dramatically outperforms the main method, the methodological contribution
    (handcrafted features) is weakened. The paper frames features as enabling DDR
    analysis rather than being the best classifier—this framing is honest but means
    the classification contribution is secondary.


    ### W4. DDR novelty is debatable [R2, partially accepted by R1] — Medium severity

    The drifting features (TTR, hapax_ratio, entropy_mean) capture exactly what vocabulary
    impoverishment and model collapse literature predict: progressive lexical narrowing
    with recursive generation. Renaming this "differential depth response" risks being
    perceived as repackaging known phenomena. The stationary features (entropy_max,
    tail_decay) and the spectrum model add genuine new information, but the core finding—"diversity
    decreases with generation depth"—is not surprising. The cross-reference validation
    (Table 5) strengthens the case by showing generation-intrinsic behavior, but the
    conceptual novelty remains moderate.


    ### W5. Severely restricted practical scope [R1, R2 agree] — Medium-high severity

    Three compounding scope limitations severely narrow applicability:

    - **Base models only**: Instruct-tuned models show heterogeneous degradation (OLMo:
    −42.5pp with 6/7 feature reversals; Qwen: −16.3pp; Llama: −1.1pp). Since most
    deployed LLMs are instruction-tuned, this excludes the majority of practical scenarios.

    - **Temperature restriction**: Reliable only for t∈[0.5, 0.9). At t=0.9, binary
    F1 drops to 0.480. Most API defaults use t=1.0.

    - **Architecture sensitivity**: Gemma-2-2B gen-1 F1=0.036 is a complete method
    failure. The paper acknowledges this but provides no mechanism to predict which
    architectures will fail.


    Combined, these restrictions mean the method works reliably only for base models
    at moderate temperatures from non-Gemma-like architectures—a narrow slice of real-world
    scenarios.


    ### W6. Underpowered downstream utility experiment [R1] — Low-medium severity

    The negative finding (depth curation ≈ random subsampling) rests on 3 seeds, a
    single metric (perplexity), and a single model (OLMo-1B). Seed variance is extremely
    small (<0.002 PPL), suggesting more seeds wouldn''t change the conclusion, but
    the single-metric/single-model limitation is real. Downstream task performance
    (MMLU, factuality, toxicity) could tell a different story than raw perplexity.


    ### W7. Insufficient bibliography [R2] — Low-medium severity

    Only 5 references are cited. For a top venue, this is dramatically insufficient.
    Missing or under-discussed:

    - Shumailov et al. (2024, Nature) on model collapse — the most directly relevant
    predecessor

    - Data contamination/decontamination literature

    - Vocabulary diversity metrics in NLG evaluation

    - Watermarking literature (relevant for provenance tracking)

    - Additional iterative generation / recursive self-improvement papers


    ---


    ## 4. Detailed Scores


    | Dimension | R1 | R2 | Consensus | Notes |

    |-----------|----|----|-----------|-------|

    | Soundness | 4.5 | 4.0 | **4.5** | Methodology is rigorous; controls are comprehensive
    |

    | Novelty | 3.5 | 3.0 | **3.0** | Ordinal formulation is new; DDR risks "repackaging"
    perception |

    | Significance | 3.0 | 2.5 | **3.0** | Scope limitations reduce real-world impact
    substantially |

    | Clarity | 4.5 | 4.5 | **4.5** | Excellent writing, honest framing, well-organized
    |

    | Completeness | 4.5 | 3.5 | **4.0** | Experiments thorough; bibliography thin
    |

    | **Overall** | **3.5** | **3.0** | **3.0** | Weak Reject (below main conference
    threshold) |


    ---


    ## 5. Consensus Assessment


    **Overall Score: 3.0 / 6 — Weak Reject**


    This is a well-executed empirical study with rigorous methodology and exceptional
    experimental coverage (20+ experiments, multiple falsification tests, comprehensive
    controls). The evaluation protocol (LOGO/LOFO) is a model of careful cross-generator
    evaluation, and the paper is commendably honest about its limitations.


    However, the paper faces a core tension: the methodological execution is strong
    but the contribution straddles an uncomfortable middle ground. As a **classification
    method**, the 7-feature ensemble achieves modest performance (F1=0.694) that is
    only marginally better than a single baseline feature (+3.3pp vs Avg-LogProb)
    and substantially outperformed by standard fine-tuning (+14.5pp by QLoRA). As
    a **characterization study**, DDR is meaningful but risks being perceived as vocabulary
    impoverishment measured more carefully. The scope limitations (base models only,
    t<0.9, architecture failures) compound to narrow the practical applicability substantially.


    The paper would likely be accepted at a Findings track (where empirical rigor
    and honest negative findings are valued), but the combination of modest performance,
    narrow scope, and debatable novelty places it below the threshold for a main conference
    at a top ML venue with ~25% acceptance rate.


    **Key factor in the score**: R2''s novelty concern was the primary differentiator.
    R1 initially scored 3.5 based on methodological rigor, but after cross-sharing
    agreed that novelty and significance are the binding constraints. The final score
    is anchored on R2''s 3.0 with R1 accepting that strong execution of a moderate-novelty
    idea doesn''t clear the bar.



    ---


    # Dream Review Report


    **Paper:** "When Depth Signals Collapse: Architecture-Conditional Response in
    Recursive LLM Generation Chains"


    **Venue standard:** Top ML venue (acceptance rate ~25%), 6-point scale


    ---


    ## 1. Summary


    This paper formulates ordinal generation depth estimation—classifying text as
    gen-0/gen-1/gen-2+ rather than binary real-vs-synthetic—and investigates whether
    distributional features can estimate how many times text has been recursively
    processed through LLMs. Using 5 base-model generators from 3 families (Pythia,
    OLMo, Qwen) and 7 handcrafted features (2 surface diversity + 5 reference-model
    entropy), the authors find that depth signal is **architecture-conditional**:
    strong for Pythia-family generators (LOGO binary F1=0.78–0.80) but near-chance
    for OLMo and Qwen (F1=0.57–0.62). Surface features dominate reference features;
    5-class ordinal classification is infeasible (F1=0.38); paraphrastic and continuation
    chains show sign-reversed depth dynamics with near-zero cross-transfer. The paper
    reframes these negative findings as characterization results, arguing that signal
    presence/absence patterns constitute second-order generator fingerprints.


    ---


    ## 2. Strengths


    - **Novel and well-motivated task formulation.** Ordinal depth estimation beyond
    binary detection is genuinely underexplored. The paper identifies a clear gap—prior
    work stops at real-vs-synthetic—and the framing as depth-of-recursion estimation
    is relevant to data provenance and model collapse research.


    - **Honest and well-structured negative results.** The paper does not oversell.
    It systematically demonstrates where depth estimation fails (cross-family, fine-grained,
    paraphrastic chains) and presents these failures as informative characterization
    findings. The progression from Pythia-only success (Exp 1) to cross-generator
    collapse (Exp 2) to process-specificity (Exp 3) to granularity limits (Exp 4)
    to E2E confirmation (Exp 5) is logically compelling.


    - **Clean experimental design.** LOGO evaluation properly separates generator
    identity from depth signal. The feature dynamics classification (Drifting/Stationary/Ambiguous
    via R² thresholds) provides a principled framework. The paraphrastic-vs-continuation
    comparison (Exp 3) is well-motivated by attractor convergence theory and provides
    genuinely interesting sign-reversal results.


    - **Thorough ablation coverage.** Feature ablation at multiple levels (full, surface-only,
    reference-only, single-feature), multiple classification methods (XGBoost, CORAL,
    Frank-Hall, QLoRA), multiple evaluation granularities (3-class, 5-class, binary),
    and cross-chain-type transfer collectively provide a comprehensive empirical picture.


    - **Good mechanistic discussion.** Section 4.1 identifies two distinct mechanisms
    (reference model mismatch + generator-specific drift dynamics) and notes that
    even reference-model-independent surface features show weaker correlations for
    non-Pythia generators, disambiguating the two mechanisms.


    ---


    ## 3. Weaknesses


    ### Major


    - **(W1) Single reference model confounds the central claim.** The paper uses
    only Pythia-410M as the reference model and then concludes that depth signal is
    "architecture-conditional." But the most parsimonious explanation is **reference-model
    mismatch**: Pythia-410M naturally produces more informative entropy statistics
    for same-family generators. The paper acknowledges this in Section 4.1 and Limitations
    (§4.4), but does not test the obvious control—using family-matched reference models
    (e.g., OLMo-based reference for OLMo generators, Qwen-based for Qwen). Without
    this experiment, the paper cannot distinguish "depth signal doesn''t exist for
    OLMo/Qwen" from "Pythia-410M is a poor reference for non-Pythia text." This is
    the paper''s most critical gap: the central claim rests on an uncontrolled confound.
    The discussion hints that surface features also weaken for non-Pythia (TTR ρ:
    Pythia −0.58, OLMo −0.35, Qwen −0.33), which partially addresses this, but the
    effect size reduction for surface features is much smaller than for entropy features—suggesting
    reference mismatch is the dominant factor.


    - **(W2) Extremely thin related work and references.** The paper cites only 5
    references. For a characterization study at a top venue, this is insufficient.
    Missing: Gehrmann et al. (2019, GLTR), Kirchenbauer et al. (2023, watermarking),
    Tulchinskii et al. (2024, intrinsic dimension), Bao et al. (2024, FAST-DetectGPT),
    Su et al. (2023, DetectLLM), Sadasivan et al. (2023, paraphrasing attacks on detectors),
    Doshi & Hazan (2024, generative model collapse), and the broader data provenance
    literature. The absence of a Related Work section is a significant structural
    gap—the paper jumps from Introduction directly to Method without contextualizing
    against the rich existing literature on LLM text detection.


    - **(W3) Restriction to base models limits significance.** All 5 generators are
    base (non-instruction-tuned) models. Since virtually all deployed LLMs are instruction-tuned
    and RLHF-aligned, the practical relevance for real-world depth estimation is unclear.
    The paper does not test or discuss instruction-tuned models at all. If depth signal
    collapses even more under RLHF (plausible given modified sampling distributions),
    the already-weak results would become entirely impractical. This substantially
    bounds the contribution''s real-world significance.


    - **(W4) "Signal absence as fingerprint" claim is undeveloped.** The paper''s
    positive reframing—that depth response profiles constitute second-order generator
    fingerprints (Contribution 3)—is stated but not empirically validated. No experiment
    demonstrates that you can actually identify generator families from their depth
    response patterns. This claim needs a concrete experiment: e.g., train a meta-classifier
    on depth-response feature vectors (slopes, R² values across features) and show
    it discriminates generator families. Without this, the contribution is a speculative
    observation, not an empirical finding.


    ### Moderate


    - **(W5) Generator scale limited to ≤2.8B parameters.** The 5 generators range
    from 0.6B to 2.8B. Larger models (7B, 13B, 70B) may have fundamentally different
    depth dynamics due to higher-quality generations with less diversity loss. The
    paper''s claims about architecture-conditionality could be confounded with scale
    effects within families (Pythia-2.8B is the largest generator and also has the
    strongest signal).


    - **(W6) No practical use case demonstrated.** The paper establishes where depth
    estimation works and fails but does not demonstrate any downstream application.
    The "second-order fingerprint" claim lacks validation. Corpus-level depth composition
    estimation (a natural application) is not tested. The paper is purely diagnostic
    without actionable outcomes.


    - **(W7) QLoRA comparison undermines feature engineering contribution.** QLoRA
    achieves 5-class F1=0.44 vs XGBoost 0.38 (+6pp) and 3-class F1=0.76 vs 0.72 (+4pp).
    While the gap is modest, the QLoRA model also shows severe overfitting (train
    0.62, val 0.44) and poor LOGO generalization. This cuts both ways: the handcrafted
    features aren''t much worse, but neither approach works well enough to be useful.
    The modest QLoRA advantage suggests there is additional signal beyond the 7 features,
    but the architecture-conditional limitation persists regardless of feature choice.


    ### Minor


    - **(W8) Wikipedia-only seed data.** All chains start from English Wikipedia,
    which has specific stylistic properties (encyclopedic, formal, citation-heavy).
    The generalizability to other domains (news, social media, creative writing) is
    unknown. Depth signal strength may be domain-dependent.


    - **(W9) Chain depth limited to 4.** With only depths 0–4, the paper cannot characterize
    long-run convergence behavior. The attractor convergence finding for paraphrastic
    chains (convergence by gen-3) would benefit from deeper chains to confirm the
    plateau.


    ---


    ## 4. Questions for Authors


    1. **Reference model control (critical).** Have you tested family-matched reference
    models (e.g., OLMo-1B as reference for OLMo generators, Qwen-0.5B for Qwen)? If
    not, how do you rule out that the architecture-conditional pattern is primarily
    a reference-model-mismatch artifact rather than a genuine property of the generators''
    depth dynamics?


    2. **Scale confound.** Pythia-2.8B is both the largest generator and shows the
    strongest depth signal. Could the architecture-conditional pattern partly reflect
    scale differences? Within the Pythia family, how does Pythia-1B''s signal strength
    compare to Pythia-2.8B''s at the feature level (not just classification F1)?


    3. **Instruction-tuned models.** Have you conducted any preliminary experiments
    with instruction-tuned variants? If RLHF substantially changes depth dynamics,
    the base-model findings may not transfer to the settings most relevant to real-world
    data provenance.


    4. **Fingerprint validation.** Can you provide even a simple experiment demonstrating
    that depth-response profiles actually discriminate generator families? E.g., clustering
    generators by their 7-dimensional slope vectors and showing family separation?


    5. **Tokenizer confound.** You note that Qwen uses a different tokenizer (byte-level
    BPE vs GPT-NeoX). Could the weak surface feature correlations for Qwen partly
    reflect tokenizer mismatch in TTR/hapax computation? If TTR is computed at the
    token level, different tokenizers produce incomparable values.


    ---


    ## 5. Missing Experiments and Related Work


    ### Missing experiments

    - **Family-matched reference models** — the single most important missing control

    - **Instruction-tuned generators** — critical for practical relevance

    - **Larger generators (7B+)** — needed to disentangle scale vs. architecture

    - **Generator fingerprint validation** — needed to support Contribution 3

    - **Corpus-level depth estimation calibration** — natural practical application

    - **Non-Wikipedia seed domains** — generalizability check


    ### Missing related work

    - No Related Work section at all (jump from Intro §1 to Method §2)

    - Only 5 references total — inadequate for a top venue submission

    - Missing: GLTR (Gehrmann+2019), watermarking approaches (Kirchenbauer+2023),
    intrinsic dimensionality detectors (Tulchinskii+2024), zero-shot detector variants
    (FAST-DetectGPT, DetectLLM), paraphrasing attack literature (Sadasivan+2023),
    model collapse theory (Doshi & Hazan 2024, Seddik+2024), data cartography (Swayamdipta+2020),
    content provenance standards (C2PA)


    ---


    ## 6. Scores


    | Criterion | Score (1–10) | Rationale |

    |-----------|:-----------:|-----------|

    | **Soundness** | 5 | Core claim (architecture-conditional depth signal) rests
    on an uncontrolled confound (single reference model). Feature ablation and classification
    methodology are sound, but the causal interpretation is underdetermined. Statistical
    analyses are appropriate where present. |

    | **Presentation** | 5 | Writing is clear and the experimental progression is
    logical, but the absence of a Related Work section, only 5 references, and no
    figures (only tables) reduce presentation quality below venue standards. |

    | **Novelty** | 5 | The ordinal depth estimation task is new, but features used
    (TTR, hapax, reference-model entropy) are standard from the detection literature.
    The "differential depth response" observation is empirically interesting but not
    deeply surprising given known diversity decline in recursive generation. |

    | **Significance** | 4 | Limited by: base models only, no practical application
    demonstrated, the fingerprint claim is unvalidated, and the strongest results
    (Pythia-only) are arguably an artifact of reference-model matching. |


    ---


    ## 7. Overall Score and Justification


    ### Overall: 3 — Weak Reject


    **Justification:** The paper addresses a meaningful and underexplored question
    (ordinal depth estimation) with clean experimental methodology and commendably
    honest reporting of negative results. The experimental progression is well-structured
    and the feature dynamics framework (Drifting/Stationary/Ambiguous) is a useful
    contribution.


    However, several issues place it below the acceptance bar for a top venue:


    1. **Uncontrolled confound.** The central claim—depth signal is architecture-conditional—cannot
    be separated from reference-model mismatch without testing family-matched references.
    This is not a minor limitation; it is the most natural alternative explanation
    for the two-tier pattern, and the paper acknowledges it without testing it.


    2. **Insufficient contextualization.** Five references and no Related Work section
    is inadequate. The paper does not position itself against the rich literature
    on LLM text detection, model collapse, or data provenance.


    3. **Limited practical scope.** Base models only, ≤2.8B scale, Wikipedia-only
    seeds, no demonstrated application. The "fingerprint" contribution is speculative.


    4. **Moderate novelty.** The features are standard; the main contribution is the
    characterization of when they work and don''t. This is valuable but incremental.
    The sign-reversal finding for paraphrastic chains is the most novel result but
    occupies only one experiment.


    **Path to acceptance:** (a) Test family-matched reference models to disambiguate
    the central confound; (b) add a proper Related Work section with adequate citations;
    (c) validate the fingerprint claim with a concrete experiment; (d) extend to instruction-tuned
    models or demonstrate a practical application; (e) include at least one figure
    (e.g., feature trajectory plots per generator) for visual communication.


    ---


    ## 8. Confidence


    **4 / 5.** I have reviewed the full paper, cross-referenced all reported numbers
    against each other for internal consistency, assessed the experimental design
    against the planned experiment list, and evaluated against top-venue standards.
    My main uncertainty is whether family-matched reference models would substantially

  figures_description:
  - 'Fig 5: 5×5 Confusion matrix heatmap。gen-0 行几乎全在对角线；gen-2/3/4 行呈均匀分布，对角线无明显 peak。直观展示
    depth > 1 的不可分性。'
  - 'Fig 6: Feature distributions (violin plots) by depth 0-4, split by generator
    family。Pythia violins 逐层分离；OLMo/Qwen violins 从 depth-1 开始完全重叠。'
  analysis: '5-class ordinal is infeasible in worst tier. The signal exists primarily
    at the gen-0/gen-1 boundary and rapidly degrades. This is actually informative
    for the reframed paper: it establishes an empirical ceiling on depth resolution
    (≤3 classes) that''s architecture-dependent. For Pythia-family generators where
    signal is strong, 4-class might work; for others, even binary (gen-1 vs gen-2+)
    is near chance. The ''conditions under which depth signal emerges vs collapses''
    framing gains direct evidence: depth granularity is architecture-conditional,
    not a universal property of recursive generation. Report as structured negative
    finding.'
- name: end_to_end_classifier
  plan_id: plan_012
  description: QLoRA fine-tuned Qwen3.5-0.8B 端到端深度分类，对比 handcrafted features
  expected_results:
    5class_macro_f1: 0.44
    5class_f1_std: 0.02
    3class_macro_f1: 0.76
    3class_f1_std: 0.01
    per_class_f1:
      gen0: 0.95
      gen1: 0.62
      gen2: 0.3
      gen3: 0.22
      gen4: 0.11
    vs_xgboost_5class_delta_pp: '+6.0'
    vs_xgboost_3class_delta_pp: '+4.0'
    logo_generalization:
      pythia_held_out: 0.52
      olmo_held_out: 0.35
      qwen_held_out: 0.38
    overfitting_gap: 0.18
    train_f1: 0.62
    val_f1: 0.44
    runtime_hours: 14
    model: Qwen3-0.6B-Base
    method: QLoRA rank-16
  result_rationale: E2E model 在 5-class 上优于 XGBoost（0.44 vs 0.38，+6pp），因为 learned
    representations 能捕获 handcrafted features 遗漏的 subtle patterns（如 attention pattern
    shifts、specific n-gram frequency changes）。但绝对性能仍然很差（0.44），且 overfitting 严重（train
    0.62 vs val 0.44，gap=18pp）——模型学到了 generator-specific artifacts 而非 generalizable
    depth signal。LOGO generalization 更加灾难性：held-out Pythia F1=0.52，OLMo/Qwen 仅 0.35-0.38。这说明
    E2E model 学到的不是 'depth signal' 而是 'generator fingerprint + depth 交互'——它在训练集内的
    generator 上过拟合。3-class（0.76）优于 XGBoost（0.72）但差距不大（+4pp），且同样来自 gen-0 classification。在
    worst 档下，E2E 的相对优势说明确实有 beyond-handcrafted-features 的信号存在，但这些信号 generator-specific、不泛化，支持
    'architecture-conditional' reframing。

narrative_guidance: 放弃 'universal depth signal' 叙事，转向 'architecture-conditional depth
  response'。核心贡献变为：识别 depth signal 存在/崩溃的条件，以及 signal 缺失本身作为生成器 fingerprint 的二阶信号。仍冲
  EMNLP，定位为 negative/characterization paper。
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: MVP Pythia-only 数据上的特征消融 + 趋势分析 + perplexity 预验证
  expected_results:
    full_macro_f1: 0.81
    reference_only_f1: 0.68
    surface_only_f1: 0.77
    ref_vs_surf_bootstrap_p: 0.003
    h2_features: entropy_mean (slope=-0.42, R²=0.88), ttr (slope=-0.11, R²=0.91),
      hapax_ratio (slope=-0.14, R²=0.93)
    h1_features: tail_decay (slope=-0.02, R²=0.15), entropy_std (slope=+0.01, R²=0.08),
      entropy_max (slope=-0.06, R²=0.31), entropy_min (slope=-0.09, R²=0.42)
    entropy_min_ambiguous: true
    median_ppl_by_depth: 13.2, 5.1, 3.2, 2.3, 1.8
    ppl_depth_spearman: -0.95
  result_rationale: Pythia-410M reference + Pythia-2.8B generator 是 same-family 最佳条件，即使在
    worst 档位下初始 MVP 数据仍然能看到 depth signal。问题不在这里暴露——surface features（TTR/hapax）占主导（0.77
    vs ref-only 0.68）暗示 depth signal 主要来自 vocabulary impoverishment 而非深层 distributional
    structure。entropy_min 的 R²=0.42 处于模糊地带（不完全 stationary），为后续 cross-family 失败埋下伏笔：这种
    intermediate behavior 说明 drifting/stationary 分界在不同架构下可能不一致。Reference features
    弱于 surface 是 worst 档早期信号——如果 dual dynamics 是 robust phenomenon，reference features
    应至少持平。

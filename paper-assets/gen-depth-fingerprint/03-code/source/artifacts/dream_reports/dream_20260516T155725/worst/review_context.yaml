      held_out_qwen: 0.6
    ablation_full_f1: 0.72
    ablation_surface_only_f1: 0.7
    ablation_reference_only_f1: 0.61
    mcnemar_full_vs_surface_p: 0.12
    generators_below_060_binary: 2
    spearman_by_generator:
      pythia-2.8b:
        entropy_mean: -0.61
        ttr: -0.58
        hapax: -0.63
      pythia-1b:
        entropy_mean: -0.55
        ttr: -0.54
        hapax: -0.6
      olmo-2-1b:
        entropy_mean: -0.22
        ttr: -0.35
        hapax: -0.38
      qwen3-1.7b:
        entropy_mean: -0.31
        ttr: -0.4
        hapax: -0.43
      qwen3-0.6b:
        entropy_mean: -0.18
        ttr: -0.33
        hapax: -0.36
    feature_direction_inconsistency: OLMo entropy_mean correlation weakly negative
      (-0.22) while Pythia strongly negative (-0.61); effect size ratio 2.8x
  result_rationale: 'Worst 档核心假设在此暴露：2+ 新家族 held-out F1 < 0.60。Pythia 家族内 transfer
    良好（两个 Pythia 模型互相泄露 inductive bias），但 OLMo 和 Qwen 家族 held-out 时 binary F1 掉到 0.57-0.58。原因：(1)
    OLMo 的 training recipe（Dolma corpus + unique LR schedule）产生不同的 token frequency
    distribution，导致 Pythia-410M reference model 的 entropy features 对 OLMo 生成文本的 depth
    drift 不敏感——entropy_mean 的 Spearman 仅 -0.22（vs Pythia -0.61），effect size 缩小 2.8x；(2)
    Qwen tokenizer 完全不同（byte-level BPE vs Pythia GPT-NeoX tokenizer），surface features（TTR/hapax）的计算基于不同
    vocabulary space，导致跨家族 surface feature 分布 mismatch；(3) full vs surface-only 差距仅
    2pp（0.72 vs 0.70），McNemar p=0.12 不显著——7-feature ensemble 在这个场景下不优于简单 surface features，印证
    ''seven_feat_vs_best_baseline_pp: [0, 2.0]'' 的 worst 预期。per_gen_f1_std = 0.11
    远高于 ''universal'' 叙事所需的一致性。'

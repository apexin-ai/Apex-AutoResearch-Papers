  analysis: 'E2E model provides modest improvement over handcrafted features but does
    not solve the fundamental problem: depth signal for non-Pythia architectures is
    weak or absent. The overfitting pattern (generator-specific memorization) is actually
    diagnostic evidence for the reframed paper: it shows that whatever distinguishes
    depths for a given generator is not transferable across architectures. This supports
    the ''architecture-conditional depth response'' thesis — each model family has
    its own depth signature (if any), and there is no universal learned representation
    of ''depth''. For the paper: report as supplementary evidence that neither handcrafted
    nor learned features achieve universal depth discrimination, strengthening the
    conditional-claim reframing.'

  figures_description:
  - 'Fig 2: Per-generator LOGO F1 bar chart with 95% CI error bars. Clear bimodal
    pattern: Pythia family (0.78-0.80) vs non-Pythia (0.57-0.62). CI bars for OLMo/Qwen
    overlap with 0.50 random baseline lower bound.'
  - 'Fig 3: entropy_mean trend lines (depth 0-4) for each generator. Pythia lines
    steep and parallel; OLMo nearly flat; Qwen shows weak inconsistent slope. Visual
    evidence of architecture-conditional response.'
  analysis: 'Universality claim collapses. The 2-tier pattern (Pythia strong, others
    weak) indicates depth signal is not an intrinsic property of recursive generation
    but depends on architecture/training-data alignment with the reference model AND
    possibly on the generator''s own sampling dynamics. Two interpretations: (A) reference
    model mismatch — Pythia-410M is a poor scorer for non-Pythia text, inflating entropy
    baseline and suppressing drift measurement; (B) genuine architecture difference
    — some models produce more uniform token distributions at every depth, compressing
    the dynamic range for drift detection. Plan_003 (cross-family reference) will
    disambiguate. If (A), using OLMo/Qwen reference fixes it; if (B), the signal genuinely
    doesn''t exist for these families. In worst tier, we expect (B) to dominate. Narrative
    must pivot to conditional claims.'
- name: paraphrastic_comparison
  plan_id: plan_006
  description: Paraphrasing chains vs continuation chains 直接对比，测试 attractor convergence
    理论
  expected_results:
    paraphrastic_3class_f1: 0.6
    paraphrastic_binary_f1: 0.53
    continuation_3class_f1: 0.72
    continuation_binary_f1: 0.67
    f1_3class_delta: -0.12
    spearman_entropy_mean_para: 0.15
    spearman_entropy_mean_cont: -0.42
    spearman_ttr_para: 0.31
    spearman_ttr_cont: -0.48
    spearman_hapax_para: 0.28
    spearman_hapax_cont: -0.51
    cross_transfer_para_to_cont_f1: 0.38
    cross_transfer_cont_to_para_f1: 0.42
    depth_retention_para: 0.92
    depth_retention_cont: 0.83
    para_attractor_convergence_gen3: true
    n_paraphrastic: 4800
    n_continuation: 4600
  result_rationale: Worst 档下，paraphrastic chains 呈现 attractor convergence 预期行为：entropy_mean
    Spearman 仅 +0.15（趋于 neutral/轻微 positive，即 paraphrasing 使 perplexity 略微上升后稳定）。但
    continuation chains 也弱于 expected——在 5-gen pooled data 上 Spearman 仅 -0.42（而非 best
    档的 -0.65+），因为 non-Pythia generators 拉低了整体 correlation。关键是 sign reversal：paraphrastic
    正相关 vs continuation 负相关，但 effect size 都不大。Cross-transfer F1 极低（0.38-0.42），说明两种
    chain 类型的 feature space 几乎不重叠——这在 worst 档是问题而非 feature，因为它意味着 'depth signal' 高度
    task-specific，不是一个 unified phenomenon。Depth retention 0.92 for para（高于 continuation
    的 0.83）也 counterintuitive：paraphrasing 保留更多 chains 但 signal 更弱，说明 chain stability
    ≠ signal strength。Attractor convergence 在 gen-3 后明显——para chains 的 feature 分布停止变化。
  tables:
  - name: 'Table: Paraphrastic vs Continuation Depth Signal'
    columns:
    - Metric
    - Paraphrastic
    - Continuation
    - Delta
    rows:
    - - 3-class LOGO F1
      - 0.6
      - 0.72
      - -0.12
    - - Binary LOGO F1
      - 0.53
      - 0.67
      - -0.14
    - - ρ(entropy_mean, depth)
      - '+0.15'
      - '-0.42'
      - sign reversed
    - - ρ(TTR, depth)
      - '+0.31'
      - '-0.48'
      - sign reversed
    - - ρ(hapax, depth)
      - '+0.28'
      - '-0.51'
      - sign reversed
    - - Depth retention (gen4/gen0)
      - 0.92
      - 0.83
      - '+0.09'
  - name: 'Table: Cross-transfer LOGO F1'
    columns:
    - Train on
    - Test on
    - F1
    rows:
    - - Continuation
      - Continuation
      - 0.72
    - - Paraphrastic
      - Paraphrastic
      - 0.6
    - - Continuation → Para
      - Paraphrastic
      - 0.42
    - - Para → Continuation
      - Continuation
      - 0.38
  figures_description:
  - 'Fig 4: Parallel feature trajectories (depth 0-4) for para vs cont chains. Continuation
    lines drift downward (vocabulary impoverishment); paraphrastic lines converge
    to plateau by gen-3 (attractor behavior). 但两者 effect sizes 都小于 expected。'
  analysis: 'Sign reversal confirms theoretically expected behavior (paraphrasing
    → attractor convergence, continuation → monotonic drift), but under worst tier
    the effect sizes are underwhelming for both types. Paraphrastic binary F1=0.53
    is near random — essentially unclassifiable beyond gen-0 vs rest. Continuation
    is better but still weak (0.67 binary). The low cross-transfer (0.38-0.42) means
    there''s no unified ''depth signal'' that works across chain types — each requires
    its own model. For EMNLP reframing: this SUPPORTS the ''architecture-conditional''
    narrative because it shows depth signal properties depend on the specific generation
    process (paraphrasing vs continuation vs architecture), not just depth itself.
    The attractor convergence finding is a positive contribution to theory validation
    even in worst case.'
- name: finer_grained_ordinal
  plan_id: plan_009
  description: 5-class ordinal classification (gen-0 through gen-4) 测试更细粒度深度估计
  expected_results:
    5class_macro_f1: 0.38
    5class_f1_std: 0.04
    5class_accuracy: 0.42
    5class_mae: 0.95
    3class_macro_f1: 0.72
    delta_5class_vs_3class: -0.34
    per_class_f1:
      depth_0: 0.85
      depth_1: 0.45
      depth_2: 0.22
      depth_3: 0.18
      depth_4: 0.2
    confusion_concentration: gen2/gen3/gen4 互相混淆，占 confusion matrix off-diagonal 的
      72%
    ordinal_methods:
      CORAL: 0.36
      frank_hall: 0.39
      xgboost: 0.38
    depth_2_3_separability: Cohen's d = 0.08 (entropy_mean), 0.12 (hapax_ratio) —
      几乎不可分
    per_family_5class:
      pythia_held_out: 0.48
      olmo_held_out: 0.28
      qwen_held_out: 0.31
  result_rationale: Worst 档下，5-class 在 pooled 5-gen data 上 macro F1 仅 0.38，接近 5-class
    random baseline（0.20）但仍显著高于 chance。核心问题：depth 2/3/4 几乎不可分（per-class F1 0.18-0.22）。原因是双重的：(1)
    depth drift 在多数生成器（OLMo/Qwen）上本身就弱，加上 (2) gen-2 到 gen-4 之间的 feature 增量极小（Cohen's
    d < 0.12），即使在 Pythia 上也进入 plateau。只有 gen-0 可靠分类（F1=0.85），gen-1 中等（0.45）——这本质上是
    binary detection（gen-0 vs rest）在 5-class 框架中的残影。OLMo/Qwen held-out 时 5-class F1
    掉到 0.28-0.31（接近 random），进一步说明 fine-grained 深度估计只在特定架构下可行。Ordinal-specific methods（CORAL/Frank-Hall）无优势，因为
    underlying signal 本身不存在于 deep depths。3-class（0.72）远优于 5-class（0.38），但 delta =
    34pp 说明 3-class 的性能也主要来自 gen-0 classification 而非真正的 ordinal discrimination。

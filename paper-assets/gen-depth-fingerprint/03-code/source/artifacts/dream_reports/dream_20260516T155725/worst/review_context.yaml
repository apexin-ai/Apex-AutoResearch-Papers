  figures_description:
  - 'Fig 1: 7 个特征 mean±std across depth 0-4。hapax/ttr/entropy_mean 呈明显单调下降，entropy_std/tail_decay
    基本平坦，entropy_min 呈弱下降趋势（R²=0.42），预示跨架构不一致的隐患。'
  analysis: 'Initial signal looks promising on same-family data but two warning signs:
    (1) surface features dominate reference features by 9pp, suggesting vocabulary
    impoverishment is the primary signal carrier, not distributional structure shifts;
    (2) entropy_min sits in an ambiguous zone. In worst tier these are early indicators
    that the ''dual dynamics'' framework is architecture-specific — it cleanly separates
    on Pythia but may not generalize. Proceed to plan_002 but with lowered expectations
    for cross-family transfer.'

    result_rationale: 'Median 档下 7-feature vs best single detector (avg_logprob) 优势缩窄至
      2.2pp， 落在指定区间 [1.5, 3.0] 中部。avg_logprob 本身是一个强 ordinal baseline （ρ = -0.52），因为它直接度量了
      generation 的 "surprise" 级别，与 depth 有天然 负相关。7-feature 的优势来自两方面：(1) surface features
      捕获 vocabulary diversity 维度的独立信号，(2) 多特征组合提供了更 robust 的 decision boundary。 但在
      median 档下这些优势被 moderate drift 削弱——entropy features 的 marginal contribution 缩小，使
      7-feature 相对于 avg_logprob 的增量主要来自 hapax 和 TTR（实质上是 surface features + avg_logprob
      的近似）。Bootstrap 仍显著 (p=0.008) 但 CI overlap 大，Binoculars 和 FastDetectGPT 的高方差
      CI （跨 generator 方差大）使得它们不是可靠的 ordinal predictors。论文保持 "7-feature model outperforms
      single detectors" 但措辞需降低断言强度， 强调 "statistical significance with modest practical
      improvement"。

      '

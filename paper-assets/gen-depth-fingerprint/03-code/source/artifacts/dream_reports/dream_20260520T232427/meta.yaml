tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 所有核心假设成立；DDR 在 8+ generators / 5 families 上鲁棒，7-feature 优势显著，negative
        finding 清晰。论文按原 framing 提交 ARR。
      key_assumptions:
      - DDR 二分法成立：drifting 三特征 (hapax, TTR, entropy_mean) |ρ|≥0.55，stationary 二特征
        (tail_decay, entropy_max) |ρ|<0.10；entropy_std 归为 weakly drifting 不影响主叙事
      - 7-feature 在扩展 generator set 下仍显著优于 avg_logprob (≥3pp LOGO binary, bootstrap
        p<0.01)
      - Cross-model chains 验证 heterogeneity amplification (binary F1≥0.76)
      - 8-gen LOGO binary F1 ≥ 0.69 稳定，per-gen 方差 < 10pp
      - 14B scale DDR 模式定性不变（drifting/stationary 分组一致，|ρ| 仅弱衰减）
      - t∈[0.5,0.7] 可靠 (≤2pp 降幅)；t≥0.9 诚实标为 scope boundary 不被 reviewer 视为致命缺陷
      - Gemma gen-1 异常为孤立架构效应，不泛化至其他 generator
      number_ranges:
        logo_binary_f1_8gen:
        - 0.69
        - 0.72
        logo_binary_f1_9gen:
        - 0.66
        - 0.69
        lofo_binary_f1:
        - 0.68
        - 0.7
        cross_model_binary_f1:
        - 0.76
        - 0.83
        ddr_drifting_rho_abs_min:
        - 0.55
        - 0.65
        ddr_stationary_rho_abs_max:
        - 0.04
        - 0.1
        seven_feat_minus_best_single_pp:
        - 3.0
        - 5.0
        scale_8b_logo_binary_f1:
        - 0.65
        - 0.7
        llm_rephrase_drop_pp:
        - 3.0
        - 5.0
      narrative_direction: 原始 framing 完全成立。DDR 以 drifting/stationary 二分法表述（entropy_std
        在正文中归为 intermediate，不破坏主叙事）。三条 claim 均有充分实验支撑：(1) depth discriminability 以
        LOGO binary F1=0.694 为 headline，LOFO 和 cross-model 验证泛化性；(2) DDR 跨 reference
        model (3 families) 和 generator family (5 families) 稳健，TOST 确认 shape feature
        stationarity；(3) negative downstream finding 以 TOST ±2% margin 确认。Scope limitations
        (base-only, t≤0.7, ≤14B) 诚实报告但不动摇核心 contribution。可直接提交 ARR。
    median:
      tier: median
      meaning: 深度信号存在但边界模糊；DDR 需从二分法调整为梯度描述，7-feature 优势缩窄，部分 claim 需降低断言强度。
      key_assumptions:
      - DDR 分组从二分法退化为三梯度：strong drift (hapax, TTR)、moderate drift (entropy_mean, entropy_std,
        entropy_min)、near-stationary (tail_decay, entropy_max)
      - entropy_mean 在 8B+ 模型上 |ρ| 降至 0.30–0.40，不再满足 drifting 阈值；surface features
        成为主要信号源
      - 7-feature vs avg_logprob 优势缩窄至 1.5–3pp（bootstrap 显著但 practical significance
        边界化）
      - Cross-model chains 信号温和 (binary F1 0.70–0.76)，不足以支撑 heterogeneity amplification
        叙事
      - Gemma + Mistral 异常暗示 DDR 强度与模型架构耦合，非纯 depth 效应
      - t=0.9 confirmed 崩溃 (LOGO binary ≈0.48)，需将 framing 中 [0.5,0.9] 的温度范围改为 [0.5,0.7]
      - per-gen binary F1 方差 10–15pp，reviewers 质疑 generalizability 时需逐 generator 分析
      number_ranges:
        logo_binary_f1_8gen:
        - 0.66
        - 0.69
        logo_binary_f1_9gen:
        - 0.63
        - 0.66
        lofo_binary_f1:
        - 0.63
        - 0.68
        cross_model_binary_f1:
        - 0.7
        - 0.76
        ddr_drifting_rho_abs_min:
        - 0.4
        - 0.55
        ddr_stationary_rho_abs_max:
        - 0.1
        - 0.2
        seven_feat_minus_best_single_pp:
        - 1.5
        - 3.0
        scale_8b_logo_binary_f1:
        - 0.58
        - 0.65
        llm_rephrase_drop_pp:
        - 4.0
        - 7.0
      narrative_direction: 调整 Claim 2：DDR 从 drifting/stationary 二分法改为 gradient of
        depth sensitivity——surface diversity features (hapax, TTR) 展现最强单调漂移，reference-model
        entropy features 展现 moderate drift，distributional shape features 近似 stationary。放弃
        'location shift preserves shape' 理论框架，改为纯经验描述 'recursive generation preferentially
        compresses lexical diversity while distributional tail structure is more robust.'
        Claim 1 的 headline metric 可能需从 0.694 更新（若新 LOGO 配置值更低则诚实报告 range）。补充 architecture-dependent
        DDR analysis 作为 additional finding。Claim 3 不受影响。论文仍适合 Findings 但需 1–2 个补充实验应对潜在
        R2：(a) 更多 scale 点验证 DDR 衰减曲线，(b) feature interaction analysis 解释 architecture
        差异。
    worst:
      tier: worst
      meaning: DDR 框架不成立为通用现象；7-feature 集相对单特征 baseline 无统计显著优势；需彻底重构论文角度但不降级 venue。
      key_assumptions:
      - DDR 二分法在 ≥9 generators 下瓦解：≥3 个 'stationary' 特征出现显著 drift (|ρ|>0.15)，或 drifting
        特征在 ≥7B 模型上 plateau
      - avg_logprob 单特征在完整 LOGO 下与 7-feature 差距 <1.5pp（bootstrap 不显著）
      - Cross-model chains 无优势或更差 (binary F1 ≤ 0.70)，heterogeneity 假设被否
      - Scale 效应严重：8B+ binary F1 < 0.60，14B DDR ρ gap < 0.30
      - per-gen binary F1 方差 >15pp，部分 generator < 0.55，'generalizable depth signal'
        claim 不成立
      - 温度 scope 实质收窄至 t=0.7 单点；cross-temperature transfer 完全失败
      - Reviewer 认为 'base models + t=0.7 + ≤14B' 的适用范围太窄，缺乏 practical impact
      number_ranges:
        logo_binary_f1_8gen:
        - 0.62
        - 0.66
        logo_binary_f1_9gen:
        - 0.58
        - 0.63
        lofo_binary_f1:
        - 0.56
        - 0.63
        cross_model_binary_f1:
        - 0.58
        - 0.7
        ddr_drifting_rho_abs_min:
        - 0.3
        - 0.4
        ddr_stationary_rho_abs_max:
        - 0.15
        - 0.3
        seven_feat_minus_best_single_pp:
        - 0.0
        - 1.5
        scale_8b_logo_binary_f1:
        - 0.48
        - 0.58
        llm_rephrase_drop_pp:
        - 6.0
        - 12.0
      narrative_direction: '放弃 DDR 作为核心贡献。重构为 ''Generation Depth Estimation: Task
        Formulation, Baselines, and Empirical Boundaries.'' 三项重定位的贡献：(1) Task formulation——depth
        estimation 作为超越 binary detection 的新任务，含 leak-free evaluation protocol (LOGO
        binary metric 排除 gen-0 seed sharing)；这是 novelty 的主要来源。(2) Empirical boundary
        map——系统测定 depth signal 存在的条件空间 (small base models, t≤0.7, surface features)
        与消失的条件空间 (instruct, high temp, ≥7B scale)；承认 avg_logprob 是 competitive baseline，7-feature
        的价值在 interpretability 而非 accuracy。(3) Negative downstream finding 不变，仍是独立贡献。实质上从
        method paper 转为 benchmark + analysis paper。Task novelty + 诚实的 empirical boundary
        mapping + negative finding 三重组合仍足以支撑 EMNLP Findings。不降级 venue。'

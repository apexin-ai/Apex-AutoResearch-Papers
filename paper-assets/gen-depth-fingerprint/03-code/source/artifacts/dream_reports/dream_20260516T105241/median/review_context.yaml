  result_rationale: 'LOGO 3-class avg F1 从 within-gen 0.82 下降至 0.724，反映了 generator-specific  distributional
    signatures 对分类器的干扰。每个 generator 家族的 tokenizer、预训练 数据、架构细节都会在 NLL 特征中留下独特指纹，这些指纹与
    depth signal 交织在一起。

    Pythia 家族 held-out（0.78-0.83）表现最好，因为 Pythia-1B 和 Pythia-2.8B 共享 tokenizer 和架构偏置——当一个被
    hold out 时，另一个在训练集中提供了近似 proxy。 Pythia-410M reference model 对同家族 generator 的 NLL
    灵敏度最高，进一步放大 了 Pythia 的优势。

    OLMo-2-1B（0.72）和 Qwen3-1.7B（0.70）表现中等。它们是不同家族但参数量足够 （≥1B），generator 的 softmax
    输出分布有足够容量维持 shape 不变性。 cross-family NLL 灵敏度下降但 surface features（TTR, hapax）提供了部分补偿——
    词汇贫乏化不依赖 reference model，在所有 generator 上都能观察到。

    Qwen3-0.6B（0.57）是唯一低于 0.60 的 generator，呈现类似 instruct 退化但机制 不同：600M 参数量不足以在递归生成中维持稳定的输出分布形状。具体表现为  entropy_std（ρ=-0.17）出现非预期漂移——模型容量限制导致
    softmax 输出的方差也 随 depth 变化，打破了 location-shift 假设。同时 Qwen 独特的 tokenizer 使得  Pythia-410M
    reference 的 NLL 特征灵敏度大幅下降（entropy_mean ρ 仅 -0.24 vs  Pythia-2.8B 的 -0.58）。双重因素叠加导致该
    generator 的 depth signal 退化。

    LOFO（avg 0.670）低于 LOGO（0.724），因为 LOGO 中 same-family generator 仍在 训练集中（如 hold out
    Pythia-2.8B 时 Pythia-1B 仍可用），而 LOFO 完全移除 整个家族的信息。Qwen family LOFO（0.62）最低，因为两个
    Qwen generator 都 与 Pythia 架构差异大，且包含退化的 Qwen3-0.6B。

    7-feature vs Avg-LogProb 优势缩至 +1.8pp（vs within-gen 的 ~3.3pp），因为在  cross-generator
    设置中，reference features 的 Pythia 偏置削弱了它们的增量贡献， 而 Avg-LogProb 作为单一 NLL 统计量本身就有一定的
    cross-generator 鲁棒性。 优势仍统计显著（p=0.007）但 effect size 小——1-2 位 reviewer 可能质疑实际价值。

    Full vs surface gap 在 LOGO 中从 0.08 缩至 0.026，确认 reference features 的 增量价值在 cross-family
    设置中被削弱——Pythia-410M ref 对非 Pythia generator 的 NLL 灵敏度不足，surface features 提供的 generator-agnostic
    信号变得相对更重要。

    '

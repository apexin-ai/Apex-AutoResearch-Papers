    Ordinal Spearman ρ（0.71）显示分类器保持了 rank order——即使精确分类失败， 预测深度与真实深度呈正相关。adjacent
    confusion rate（64%）确认错误集中在 ±1  类之间，不是随机散布。这意味着 depth 特征提供的是连续的"depth score"而非
    离散的 class assignment，支持将 depth estimation 框架为 regression/ranking  而非 classification。

    CORAL/Frank-Hall 等 ordinal-specific methods 并未显著优于标准 HGBT/XGBoost （CI 重叠），因为 depth
    signal 的 bottleneck 不在建模方法而在特征的分辨力—— 当特征本身无法区分 gen-2 vs gen-3 时，ordinal constraint

    signal 的存在性（0.87 within-gen）但也暴露了 generator  overfitting 问题。(2) 对 RC8 的回应更有力："即使
    end-to-end approach 也 无法轻易解决 cross-generator generalization——这是问题本身的固有难度， 不是特征选择的局限"。(3)
    Inference 速度差距（57x）支持 handcrafted approach  在大规模 data curation 场景中的实际部署价值。

    在 median tier 下，QLoRA 的 LOGO 退化幅度（-4.4pp）比 best tier 预期更大， 因为 Qwen3-0.6B held-out
    fold 的 QLoRA F1 可能极低（~0.45）， 拖低了 LOGO 平均——end-to-end model 在训练时从未见过 Qwen-specific
    patterns， 而 handcrafted features 至少有 surface features 提供 generator-agnostic signal。'

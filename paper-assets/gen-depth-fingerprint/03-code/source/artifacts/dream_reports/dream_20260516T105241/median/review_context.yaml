    的 per-step 增量不足以在所有相邻 depth 之间建立可靠的决策边界。

    gen-0（0.86）依然高区分度：human text 与所有 synthetic text 之间的分布差异是 最大的 gap，即使在 5-class 中也能可靠分类。gen-1（0.56）中等——它与
    gen-0 有 较大 gap（human vs first-gen synthetic），但与 gen-2 的差异已经很小，导致 双向混淆。

    gen-2/gen-3 cluster（F1 0.22-0.26）是性能崩塌区：到 depth-2，递归 drift 已消耗 了大部分"容易检测"的信号，剩余的
    per-step distributional difference 低于特征 的 noise floor。gen-2 和 gen-3 之间 42% 的交叉混淆率说明这两个
    class 在 feature space 中高度重叠。gen-4（0.37）比 gen-2/3 略好，因为极端累积 drift  使 depth-4 text

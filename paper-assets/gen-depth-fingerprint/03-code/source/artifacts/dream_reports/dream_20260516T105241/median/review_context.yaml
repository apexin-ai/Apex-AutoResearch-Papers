  result_rationale: 'Paraphrastic chains 的 3-class F1（0.71）低于 continuation（0.78），差距
    -0.07， 因为 paraphrasing 的语义保持约束引入了 attractor convergence：每一步重写在语义 空间中被约束在原文附近，导致生成器的输出分布更快地收敛到稳态。具体而言，
    paraphrastic chains 在 depth 3 左右饱和——gen-3 和 gen-4 的分布特征几乎不可区分 （delta F1 仅 0.01），因为文本已进入
    attractor basin。

    Continuation chains 避免了 attractor convergence，因为每一步生成的是新内容而非 语义等价重写。distributional
    drift 单调累积至 depth 4+，没有观察到明显的饱和。 gen-3 vs gen-4 仍有 0.06 的 F1 差异，说明信号继续累积。

    Drift 方向一致（所有 H2 feature 在两种 chain 中都是负 ρ），但 paraphrastic 的 magnitude 更小（entropy_mean
    ρ: -0.43 vs -0.58）。这不是 drift 方向改变，而是 速率下降——paraphrasing 的语义约束抑制了词汇贫乏化的速度。

    Paraphrastic chains 的 shape features 漂移略高（entropy_std ρ=-0.11 vs -0.06）， 因为 paraphrasing
    prompt 不仅平移输入分布的位置，还可能微弱地改变其形状—— 重写倾向于选择更常见的表达方式，压缩了 surprise 分布的尾部。这是 median
    tier  下的一个 caveat：differential response 在 paraphrastic chains 中不如 continuation  chains
    干净。

    Cross-transfer 中等（~0.61-0.63），说明两种 chain type 共享部分 depth signal （词汇贫乏化的核心机制一致）但也有类型特异的分布特征。Train

narrative_guidance: 'MVP 内（Pythia-2.8B + Pythia-410M ref）depth signal 依然稳健（3-class
  CV F1 ≈ 0.82）， H2/H1 分离在 Pythia 家族内清晰可见。但扩展至 5 生成器 LOGO 时暴露出架构依赖性退化： Qwen3-0.6B
  held-out F1 降至 0.57（< 0.60 阈值），拉高 per-gen F1 std 至 0.09， 拉低 binary LOGO 至 0.70。核心问题在于
  Qwen 的 tokenizer 和架构差异导致 Pythia-410M  reference model 的 NLL 特征灵敏度下降，同时 Qwen3-0.6B
  模型容量不足（600M）使得  shape feature 也出现微弱漂移（entropy_std ρ ≈ -0.17），打破了 differential response  的完美不变性。7-feature
  vs Avg-LogProb 优势缩至 +1.8pp（仍 p<0.01 但 effect size 小）。 Paraphrastic 对比确认非复述链保留更多深度信号（3-class
  Δ ≈ -0.07），5-class 分类在  gen-2/3/4 严重混淆确认 3-class 为实际分辨率上限。QLoRA within-gen 优于 XGBoost  (+5pp
  3-class) 但 LOGO 泛化力反而更差（-4pp），验证了手工特征的鲁棒性优势。 Paper 叙事调整：Claim 1 从 "generalizes across
  model families" 收窄为 "robust within  tested ≤8B base-model regime, with architecture-dependent
  transfer gap as honest  limitation"。Claim 2 补充 caveat：differential response 在 Pythia/OLMo
  家族成立， 但 Qwen3-0.6B 的 shape feature 漂移表明该模式依赖于生成器容量（需 ≥1B 参数维持  softmax shape 不变性）。增加
  "conditions under which depth signal degrades" 分析 作为额外贡献（Table: high-signal vs low-signal
  generator regime）。 EMNLP 投稿强度：borderline accept，需 rebuttal 说服 1-2 个 reviewer（RC2
  泛化性 + RC9 规模性）。

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: '在 MVP 数据（Pythia-2.8B generator, Pythia-410M reference, ~4609 records）上执行三部分分析：
    (A) Feature ablation: full 7-feature vs surface-only (TTR + hapax_ratio) vs reference-only  (entropy_mean/std/min/max
    + tail_decay), XGBoost 5-fold CV。 (B) Trend analysis: 每个 feature 的 individual-level
    Spearman ρ（depth 0-4）， 判定 drifting (H2) vs stationary (H1)。 (C) Perplexity pre-validation:
    Pythia-410M forward-pass perplexity by depth。

    '
  expected_results:
    full_macro_f1: 0.82
    full_cv_std: 0.014
    surface_only_f1: 0.74
    surface_only_cv_std: 0.016
    reference_only_f1: 0.71
    reference_only_cv_std: 0.019

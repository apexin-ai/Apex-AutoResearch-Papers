  result_rationale: 'QLoRA within-gen 3-class F1（0.87）显著优于 XGBoost（0.82，+5pp），因为  600M
    参数的 transformer 能学习 token-level 的深层模式——不仅包括手工特征 捕获的词汇/entropy 统计，还包括 syntactic
    patterns、repetition structures、 discourse coherence 等无法用 7 个标量特征编码的信号。5-class
    优势更大（+9pp， 0.55 vs 0.46），因为相邻 depth 之间的微妙差异对 token-level 表征更可访问 （如 gen-2 和 gen-3
    可能有不同的句式重复模式，handcrafted features 无法捕获 但 self-attention 可以 attend to）。

    然而 LOGO 表现逆转：QLoRA LOGO 3-class（0.68）低于 XGBoost LOGO（0.724， -4.4pp）。这是因为 QLoRA
    在 within-gen 训练中过拟合了 generator-specific  patterns——每个 generator 的 tokenizer、vocabulary
    bias、典型句法结构都被 编码到 model weights 中。当 held-out generator 的这些 patterns 不匹配时， model
    的 depth estimation 退化。XGBoost 的 7 个手工特征更抽象和 generator- agnostic（尤其是 surface features
    如 TTR/hapax 不依赖于具体 tokenizer）， 因此 cross-generator 泛化更好。

    Pythia-410M 的 QLoRA 3-class（0.84）略低于 Qwen3-0.6B（0.87），因为  Pythia-410M 的 410M 参数量更小，表征容量有限。但差距不大，说明
    depth signal  可以被不同规模的 model 学习。

    gen-0 的 F1 接近完美（0.99），因为 human text vs any synthetic 对于  transformer 来说是极易区分的任务——这也暗示
    QLoRA 的高 within-gen 成绩部分 来自 gen-0 的"免费分"。gen-2+ 的 3-class F1（0.88）高是因为 gen-2/3/4
    被 合并——model 学会了区分"浅层 synthetic"vs"深层 synthetic"。

    Inference 速度差距（57x）在实际部署中有重大影响：处理百万规模数据集时， XGBoost pipeline（reference model forward
    pass + feature extraction +  XGBoost prediction）比 QLoRA 快两个数量级。

    '

    full_vs_reference_gap: 0.11
    bootstrap_ci_full: '[0.805, 0.835]'
    bootstrap_ci_surface: '[0.724, 0.756]'
    bootstrap_ci_reference: '[0.693, 0.727]'
    mcnemar_full_vs_surface_p: 0.0003
    mcnemar_full_vs_reference_p: <0.0001
    per_class_full:
      gen0_f1: 0.94
      gen1_f1: 0.76
      gen2plus_f1: 0.78
    per_class_surface:
      gen0_f1: 0.91
      gen1_f1: 0.68
      gen2plus_f1: 0.67
    per_class_reference:
      gen0_f1: 0.88
      gen1_f1: 0.62
      gen2plus_f1: 0.66
    spearman_entropy_mean: -0.58
    spearman_ttr: -0.55
    spearman_hapax_ratio: -0.57
    spearman_entropy_std: -0.06
    spearman_entropy_max: -0.04
    spearman_tail_decay: 0.05
    spearman_entropy_min: -0.14
    slope_entropy_mean: -0.141
    slope_ttr: -0.064
    slope_hapax_ratio: -0.049
    slope_entropy_std: 0.004
    slope_entropy_max: -0.008
    slope_tail_decay: 0.006
    slope_entropy_min: -0.019
    h2_drifting_features: entropy_mean, ttr, hapax_ratio
    h1_stationary_features: entropy_std, entropy_max, tail_decay
    h1_h2_borderline: entropy_min (ρ=-0.14, p<0.001 but |ρ|<0.20)
    all_h2_spearman_p: <0.001
    all_h1_spearman_p_range: '[0.002, 0.18]'
    median_ppl_by_depth:
    - 13.5
    - 4.96
    - 3.02
    - 2.08
    - 1.73
    ppl_kruskal_wallis_p: <0.001
    ppl_depth0_vs_depth4_effect_size_d: 2.84
    ppl_monotonic_decline_confirmed: true
  result_rationale: 'Within-generator Pythia-2.8B + Pythia-410M reference 是最优配置：同家族架构共享
    tokenizer 和预训练分布，reference model 的 NLL 对 generator 的递归漂移最敏感。

    Full 7-feature (0.82) 显著优于两个子集（CI 不重叠），确认 reference features 和  surface features
    提供互补信号。Surface features（0.74）略优于 reference features（0.71）， 因为词汇贫乏化（TTR↓, hapax↓）是
    depth drift 最直接的表现——递归生成逐步压缩 输出词汇多样性，这在 word-level 统计中最先体现。Reference features
    稍弱因为  NLL 统计是 token-level 的间接测量，需要更多样本才能区分微妙的分布位移。

    H2 特征（entropy_mean, TTR, hapax）随 depth 单调下降，因为递归生成将越来越受约束的 输出分布反馈为输入：每一步都压缩词汇多样性和
    entropy。H1 特征（entropy_std,  tail_decay, entropy_max）保持近静态，因为 NLL 分布的形状（方差、尾部衰减）由
    generator 的 softmax 几何决定，不随输入内容漂移而改变——递归生成平移 NLL 分布的 位置（均值）但保持其函数形式。

    entropy_min 位于边界区域（ρ=-0.14）：虽然 |ρ| < 0.20（勉强 H1），但在 median  tier 下这预示着在某些 generator（尤其小模型）上
    shape stationarity 可能进一步 退化。entropy_min 对极端 token 的 NLL 敏感，当 generator 的输出分布随
    depth  压缩时，最低 surprise 的 token 也会受影响——这是 location shift 和 shape change  的边界区域。

    Perplexity 梯度陡峭（13.5→1.73）因为更深的生成对 reference model 越来越可预测—— generator 的递归输出逐渐收敛向其模式分布，Pythia-410M
    作为同家族模型对这一收敛 特别敏感。

    '

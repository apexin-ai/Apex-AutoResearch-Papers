  - 'Fig 1: 7-panel feature trend plot (mean ± bootstrap 95% CI) across depth 0-4。
    H2 特征（entropy_mean, TTR, hapax_ratio）显示清晰单调下降；H1 特征（entropy_std,  tail_decay,
    entropy_max）显示平坦趋势，error band 大幅重叠。entropy_min 面板 标注虚线框，注释 "borderline (ρ=-0.14)"。

    '
  - 'Fig 2: Perplexity 分布 boxplot by depth (0-4)。从 depth-0（median 13.5）到  depth-4（median
    1.73）的剧烈压缩。Kruskal-Wallis p < 0.001 标注。

    '
  analysis: 'MVP 数据上 H2/H1 分离在 median tier 下基本成立，但 entropy_min 的边界行为 （ρ=-0.14）是一个早期信号：当扩展到异构
    generator（plan_002）时，某些模型的  shape features 可能进一步漂移。Surface features（0.74）略优于 reference
    features（0.71） 确认词汇贫乏化是 depth 最直接的信号——这意味着在 cross-generator 设置中， surface features
    的相对优势可能进一步放大（因为 reference features 受  reference-generator alignment 影响）。Full 7-feature
    的互补优势（+0.08 vs surface） 需在 cross-generator 中验证其鲁棒性。Perplexity 梯度的存在验证了 Claim 3
    前提， 但需注意 Pythia-410M 作为 reference 时的 same-family bias——非 Pythia 数据的 perplexity
    梯度可能更浅（plan_003 已证实 drift attenuates with non-Pythia refs， 但此处仅为 MVP pre-validation）。

    '
- name: cross_generator_evaluation
  plan_id: plan_002
  description: '扩展至 5 个 generator：Pythia-2.8B, Pythia-1B, OLMo-2-0425-1B, Qwen3-1.7B-Base,  Qwen3-0.6B-Base。每个
    1000 seeds × 5 depths。Leave-one-generator-out (LOGO) 和  leave-one-family-out (LOFO)
    评估。Feature ablation 在 LOGO 设置中重复。 Per-generator feature drift 分析检验 differential
    response 的普遍性。

    '

  analysis: 'Plan_002 是 median tier 的核心实验。LOGO 3-class avg 0.724 和 binary 0.700 分别
    落入 median 区间。Qwen3-0.6B 的退化（0.57）是 median tier 的标志性发现——不同于  instruct 退化（由 length
    confound 主导），这是容量限制导致的 shape stationarity  破坏：600M 参数的模型在递归生成中无法维持 softmax 输出的分布形状不变性。

    关键 paper 影响： (1) Claim 1 必须收窄："depth discriminability generalizes within tested
    ≤8B  base-model regime" → 加 caveat "with architecture-dependent transfer gap  (held-out
    F1 range 0.57-0.83, std=0.09)" (2) Claim 2 的 differential response 需标注为 "dominant
    pattern (4/5 generators)"  而非 "universal"——Qwen3-0.6B 的 shape drift 是必须报告的反例 (3)
    7-feat vs baseline 优势（+1.8pp）仍统计显著但需正视 effect size 小的事实 (4) 建议新增 Table: "Generator
    Signal Regime" 标注每个 generator 为 high-signal  (F1>0.70) vs low-signal (F1<0.60)，并分析退化条件（参数量、tokenizer
    差异、 reference model alignment）

    Per-gen std = 0.09 是 reviewer 关注点——需在 paper 中用 per-gen F1 range + std  报告（禁止用
    CI width 作为一致性论据），并诚实讨论哪些 generator 属于分类器的 "comfort zone" vs "challenge zone"。

    '

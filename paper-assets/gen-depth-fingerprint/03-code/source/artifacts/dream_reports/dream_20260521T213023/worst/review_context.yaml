    Worst-tier reviewer 会 argue："The 7-feature ensemble achieves 3.3 pp over Avg-LogProb,
    but this  single number (average log probability) requires only basic LM inference
    — no feature engineering,  no reference model selection, no DDR framework. The
    tiny margin and overlapping confidence intervals  suggest the elaborate DDR characterization
    provides minimal practical benefit over a trivial baseline.  Moreover, a multi-detector
    ensemble matches the 7-feature binary F1 within 0.3 pp. The contribution  reduces
    to: ''a slightly different way to achieve what existing tools already achieve,
    with a novel  but unvalidated interpretive framework (DDR).''"


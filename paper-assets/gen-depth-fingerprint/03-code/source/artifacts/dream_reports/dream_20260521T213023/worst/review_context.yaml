narrative_guidance: '核心 framing 失效。Reviewer 共识：(1) base-model-only + temperature [0.5,0.9]
  的 scope 在 2026 年没有实际意义——instruct/chat models 主导生成内容，方法对 instruct models 信号反转 (ρ
  从负变正)；(2) 0.694 binary F1 被认为不足以支撑 classification claim ——random baseline 0.5，margin
  仅 0.194，per-gen 最差 Mistral-7B 只有 0.633；(3) DDR decoding-agnostic 被视为 incremental
  robustness check 而非 contribution upgrade——"验证了方法在另一种 decoding 下也能产生同样 modest 的结果"；
  (4) Negative finding 被 weaponize 为 "so the method has no practical use?"——depth-aware
  curation ≡ random subsampling 直接 质疑 task motivation；(5) 多位 reviewer 指出所有 drifting
  features 都在测量同一个 vocabulary impoverishment 现象，DDR 不是新发现 而是 repackaging；(6) 写作修复不充分，presentation
  issues 加剧负面印象。 Reframe 方向：从 ''depth classification tool'' 转向 ''understanding distributional
  dynamics of recursive autoregressive generation'' ——DDR 本身作为 analytical framework
  是贡献，classifier 降级为 validation probe。Paper 重心从 Claim 1 转移到 Claim 2 (DDR characterization)
  + decoding-agnostic 作为主线。Claim 3 negative finding 重新包装为 ''distributional shift ≠
  quality degradation, challenging implicit assumptions in model collapse literature''。
  这个 reframe 放弃 practical utility 叙事，转向 understanding/characterization 贡献。

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: 'MVP 数据上三部分分析：(A) Feature ablation: reference-only vs surface-only

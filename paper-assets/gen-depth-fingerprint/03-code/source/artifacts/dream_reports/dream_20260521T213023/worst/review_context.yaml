    features 只是 marginal add-on，不构成独立 contribution。虽然 McNemar p=0 确认显著性，但 worst-tier
    reviewer 会指出 5.7 pp 差距中 hapax_ratio 单个 surface  feature 就占据了 0.289 importance（plan-002-eval

      << depth0_only(2.681)
    seed_variance: 极小 (<0.002 within variant)
    cohens_d_sizematched_vs_depth01: 0.42
  result_rationale: 'Negative finding 极其 clean 且 robust：depth-aware filtering 与 random
    subsampling 在 ±2% margin 内  equivalence 被 TOST 确认 (p=1.1×10⁻⁴)。Cross-seed variance
    < 0.002 意味着这个 negative finding 是  highly reliable——不是 noisy null 而是 genuine equivalence。Ranking
    显示更多数据 always better (all <  size_matched)，depth filtering 反而 slightly worse than
    random (2.387 vs 2.367)——意味着 depth-aware  curation 不仅没有帮助，还可能因为丢弃了 useful training
    signal 而 slightly hurt。

    审稿人在 worst 档下会 weaponize 这个结果："The authors'' own Claim 3 establishes that generation
    depth  is informationally vacuous for the most obvious downstream application.
    If depth information provides  zero utility for data curation — indeed, depth-filtered
    data is slightly WORSE than random — then the  practical motivation for depth
    classification collapses entirely. The paper''s pivot to ''diagnostic tool''  is
    an ad hoc rescue, not a designed contribution." TOST 在 ±1% margin 不显著 (p=0.087)
    会被注意到但 不 weaponize (论文已选 ±2%)。depth0_only 的高 perplexity (2.681) 只证明 human vs machine
    有区别—— 这是 binary detection 已解决的问题，不支持 depth classification 的 incremental value。


  figures_description:
  - 'Fig 2: 7-feature mean ± std ribbon plot across depth 0–4. Drifting features (entropy_mean,
    ttr, hapax) 呈明确单调下降趋势，stationary features (tail_decay, entropy_max) 水平走势，error
    bands 完全重叠。'
  - 'Fig 3: Perplexity box plot by depth (0–4). 中位数从 13.50 急降至 1.72，但 IQR 逐步收窄——深层文本的
    perplexity 方差更小。'
  analysis: 'Best 档的关键发现：surface features 和 reference features 不是替代关系而是互补关系。 Surface-only
    缺乏对 gen-0 vs gen-1 的区分能力（因为 gen-1 保留了大部分 source vocabulary）， 而 reference-only
    的 entropy features 在 gen-0 discrimination 上更强。 Full feature set 的 +5.7 pp 提升来自这种互补性，而非简单的特征叠加。
    DDR 趋势分析为 Claim 2 提供了核心实证基础——drifting/stationary 分离不是 arbitrary threshold， 而是
    R² 有两个数量级的差异（0.88–0.95 vs 0.02–0.03）。

    '

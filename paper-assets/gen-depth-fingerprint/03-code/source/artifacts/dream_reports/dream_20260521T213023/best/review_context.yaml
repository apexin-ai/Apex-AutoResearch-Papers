      - '[0.747, 0.774]'
    - - Reference-only (5 entropy + tail_decay)
      - '0.719'
      - '[0.706, 0.733]'
  - name: 'Table 3: DDR Trend Analysis'
    columns:
    - Feature
    - Slope (per depth)
    - R²
    - Category
    rows:
    - - entropy_mean
      - '-0.30'
      - '0.92'
      - Drifting
    - - ttr
      - '-0.04'
      - '0.88'
      - Drifting
    - - hapax_ratio
      - '-0.05'
      - '0.95'
      - Drifting
    - - entropy_std
      - '-0.08'
      - '0.45'
      - Intermediate
    - - entropy_min

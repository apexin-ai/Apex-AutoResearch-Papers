- name: finer_grained_ordinal
  plan_id: plan_009
  description: '5-class ordinal classification（gen-0 through gen-4）on non-paraphrastic
    chains。 测试 3-class 之外的更细粒度 depth resolution。

    '
  expected_results:
    five_class_f1: 0.498
    five_class_ci:
    - 0.485
    - 0.511
    three_class_f1: 0.762
    ordinal_coral_f1: 0.502
    ordinal_frank_hall_f1: 0.495
    xgboost_standard_f1: 0.498
    gen1_vs_gen2_confusion_rate: 0.41
    gen2_vs_gen3_confusion_rate: 0.52
    gen3_vs_gen4_confusion_rate: 0.58
    resolution_bottleneck: gen-2/gen-3/gen-4 mutual confusion (86% of errors)
  result_rationale: 'Best 档坦诚报告 3-class resolution ceiling。5-class F1 ~0.50（接近 random
    的 0.20  但远低于 3-class 的 0.76）说明 depth signal 在 gen-2 之后迅速衰减。Ordinal methods  (CORAL,
    Frank-Hall) 没有改善，因为 DDR 的 feature drift 在深层是非线性的—— gen-2 到 gen-3 的 marginal drift
    远小于 gen-0 到 gen-1。这是 recursive generation  的 diminishing returns：每步的 distributional
    shift 量递减（因为已经接近 attractor）， 导致深层 depths 之间的 feature overlap 增大。Best 档叙事：3-class
    是 principled  ceiling，不是方法的 limitation——it reflects the structure of the problem。
    Reviewer 看到 ordinal methods 也无法改善，会接受 3-class 作为 reasonable resolution。

    '
  tables:
  - name: 'Table 10: Ordinal Resolution Analysis'
    columns:
    - Method
    - 3-class F1
    - 5-class F1
    rows:
    - - XGBoost (standard)
      - '0.762'
      - '0.498'
    - - CORAL (ordinal)
      - '0.758'
      - '0.502'
    - - Frank-Hall
      - '0.755'
      - '0.495'
  figures_description:
  - 'Fig 11: 5-class confusion matrix。对角线在 gen-0 和 gen-1 处亮，gen-2/3/4 块大面积混淆（off-diagonal
    dark mass）。'
  analysis: '5-class ceiling 是 best 档中的 scope-defining result。它不削弱贡献—— 反而说明 depth
    fingerprinting 的 resolution limit 是 problem-intrinsic  而非 method-specific，因为 ordinal
    methods 同样无法突破。

    '

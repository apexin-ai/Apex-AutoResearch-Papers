    properties。 这是因为 DDR 追踪的是 distributional statistics（entropy, TTR）而非 specific tokens，
    所以 token-level editing 对 distributional signal 的破坏是有限的。 Best 档叙事：depth fingerprint
    对 moderate human editing 具有 practical robustness， 适用于 ''lightly edited LLM text''
    的真实场景。


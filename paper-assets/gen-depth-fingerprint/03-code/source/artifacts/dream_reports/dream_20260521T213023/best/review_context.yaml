- name: text_length_control
  plan_id: plan_013
  description: 'Text length confound control：(A) length-depth correlation 分析； (B)
    length-normalized features；(C) length-matched subsampling。

    '
  expected_results:
    spearman_rho_range: '[-0.066, +0.134]'
    length_depth_correlation: weak (|ρ| < 0.14)
    normalized_ttr_trend_preserved: true
    normalized_hapax_trend_preserved: true
    normalized_rho_stronger: true
    length_matched_f1_delta: '+0.041'
    length_is_confound: false
    short_text_dropout_bias: true
  result_rationale: 'Best 档下 length confound 被彻底排除。Length-depth Spearman |ρ| < 0.14
    说明 text  length 与 depth 几乎无关——deeper generations 不 systematically shorter or longer。
    Length-normalized features（fixed-window TTR/hapax）保留甚至增强了 DDR trend （normalized
    ρ stronger），说明 DDR 不是 length 的 proxy。Length-matched subsampling  后 F1 反而提升 +4.1
    pp，因为 length matching 去除了 short-text dropout bias （极短文本在深层被 skip，这些 outliers 在原始数据中增加了噪声）。
    Best 档叙事：length is not a confound——it''s a noise source that, when removed,  actually
    improves the signal。这是 reviewer-proof 的 confound control。

    '
  tables:
  - name: 'Appendix Table: Length Confound Analysis'
    columns:
    - Analysis
    - Result
    rows:
    - - Length–depth Spearman ρ
      - '[-0.066, +0.134] (all generators)'
    - - Normalized TTR drift preserved
      - Yes (stronger after normalization)
    - - Length-matched Δ F1
      - +4.1 pp (0.724 matched vs 0.770 unmatched base)
    - - Conclusion
      - Length is not a confound
  figures_description:
  - 'Appendix Fig: Length distribution violin plots by depth (0–4)。各 depth 的 violin
    shape 高度重叠，无 systematic shift。'
  analysis: 'Length confound 排除是所有三个 dream tiers 的 consensus requirement。 +4.1 pp
    的 counter-intuitive improvement 实际上比 ''no change'' 更有说服力—— 它说明 length matching
    是 denoising 而非 deconfounding。

    '

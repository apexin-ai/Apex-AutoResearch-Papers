    - 0.662
    llm_rephrase_multiclass_f1: 0.667
    llm_rephrase_drop_pp: -4.5
    edit_distance_ratio: 0.507
    avg_sentences_replaced: 1.69
  result_rationale: 'Best 档下 graceful degradation 是核心叙事。5% random replacement 仅损失
    4.6 pp， 即使 20% replacement（极端 adversarial 场景）F1 仍为 0.591（远高于 random 0.50）。 LLM
    rephrase（更 realistic 的 human editing simulation，edit distance ratio=0.507  表示约一半的文本被改写）损失

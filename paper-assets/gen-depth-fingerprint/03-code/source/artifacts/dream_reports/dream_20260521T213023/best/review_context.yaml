narrative_guidance: 'Original framing 完全成立。DDR 作为 decoding-agnostic autoregressive
  property 是 headline， 三条 claims 无需降级。Abstract 可写 ''DDR is an intrinsic property of
  autoregressive generation,  independent of decoding strategy''。Contribution positioning
  从 ''empirical characterization''  微升为 ''empirical discovery of a structural regularity''。Negative
  finding 正面叙事： depth fingerprinting is diagnostic, not curative — a principled scope
  boundary. Decoding-agnostic DDR (greedy mean |d|=0.05) 将 Claim 2 从 empirical observation
  升级为 structural property。写作修复 72h 内完成（related work 补齐、decoding section 整合、 limitation
  措辞精确化）后，Findings accept prob 0.75–0.90。

  '
imagined_experiments:
- name: feature_ablation_and_trend
  plan_id: plan_001
  description: '三部分分析：(A) 特征消融——reference-only vs surface-only vs full 7-feature；
    (B) DDR 趋势分析——每个特征沿 depth 0–4 的 mean±std 走势，线性回归 slope+R²； (C) Perplexity 预验证——Pythia-410M
    对 depth-stratified subsets 前向 pass。

    '
  expected_results:
    full_macro_f1: 0.82
    reference_only_f1: 0.719
    surface_only_f1: 0.763
    mcnemar_p_full_vs_surface: 0.0
    mcnemar_p_full_vs_ref: 0.0
    ref_vs_surf_bootstrap_ci: '[0.706, 0.733] vs [0.747, 0.774]'
    drifting_features:
    - entropy_mean
    - ttr
    - hapax_ratio
    stationary_features:
    - tail_decay
    - entropy_std
    - entropy_max
    - entropy_min
    entropy_mean_slope: -0.3
    entropy_mean_R2: 0.92
    ttr_slope: -0.04
    ttr_R2: 0.88
    hapax_ratio_slope: -0.05
    hapax_ratio_R2: 0.95
    tail_decay_slope: 0.001
    tail_decay_R2: 0.02
    entropy_max_slope: -0.003
    entropy_max_R2: 0.03
    median_ppl_by_depth:
    - 13.5
    - 4.96
    - 3.0
    - 2.07
    - 1.72
  result_rationale: 'Best 档下 full 7-feature 显著优于任一子集（McNemar p≈0），验证 drifting + stationary  互补假说。Reference-only
    F1=0.719 高于 random baseline 但低于 surface-only 0.763， 说明 reference features 捕获的是不同维度的信号（NLL
    distribution shape），而非冗余信息。 Surface features 占优是因为 hapax_ratio 和 ttr 直接追踪 vocabulary
    impoverishment， 这是 recursive generation 最显性的效应。Drifting features 呈高 R² 线性下降， 因为
    recursive generation 的 location shift 是单调累积的——每步生成都在前一步的  compressed distribution
    上采样。Stationary features（tail_decay, entropy_max）R²<0.05， 因为 NLL 分布的 shape（极端值分布、尾部衰减）不随
    location shift 改变， 这正是 DDR 的核心机制。Perplexity 从 13.50（human seed）急降至 4.96（gen-1）
    再缓降至 1.72（gen-4），验证 Pythia-410M 对生成文本的 familiarity 随 depth 增加， 为 Claim 3 downstream
    utility 实验提供前置信号。

    '
  tables:

    LLM-simulated editing (light rephrasing)。

    '
  expected_results:
    baseline_binary_f1: 0.695
    random_5pct_f1: 0.65
    random_10pct_f1: 0.614
    random_20pct_f1: 0.591
    drop_5pct_pp: -4.6
    drop_10pct_pp: -8.1
    drop_20pct_pp: -10.4
    llm_rephrase_binary_f1: 0.647
    llm_rephrase_binary_ci:

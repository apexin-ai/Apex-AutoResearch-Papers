    后无同 family 数据，验证了 cross-family transfer 的 真实难度。Family-out delta 仅 0.011 pp 说明跨
    family 信号损失极小，DDR 是 autoregressive  generation 的通用属性而非特定 model family 的 artifact。Feature
    importance 排序 （hapax > ttr > entropy_mean）与 plan_001 一致，说明 vocabulary impoverishment
    是 最 portable 的 depth signal——它不依赖于特定 model 的 NLL distribution shape。


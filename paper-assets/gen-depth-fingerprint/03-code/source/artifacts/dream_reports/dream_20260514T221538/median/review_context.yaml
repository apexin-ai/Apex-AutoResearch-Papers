narrative_guidance: 'Depth discriminability holds within-generator (F1 0.82) but cross-generator
  generalization is moderate (LOGO F1 ~0.64), with performance drops concentrated
  on out-of-family holdouts. Dual dynamics is real but reference-model-modulated:
  entropy_mean drift attenuates to |ρ|~0.4 with non-Pythia references, requiring the
  paper to present the H1/H2 split as ''reference-model-modulated dual dynamics''
  rather than a universal law. Length confound is partial — surface feature F1 drops
  ~0.05 after length control, but residual signal confirms depth is not reducible
  to length. 7B+ signal weakens (F1 ~0.57) but persists, motivating future work on
  scale-robust features. Downstream filtering offers complementary signal but CIs
  overlap with best binary baseline on some metrics. Paper reframed: ''depth estimation
  is feasible and useful, with initial evidence for dual dynamics'' rather than ''dual
  dynamics as general principle.'' Still viable for AAAI/EMNLP as empirical contribution
  with honest limitations.

  '

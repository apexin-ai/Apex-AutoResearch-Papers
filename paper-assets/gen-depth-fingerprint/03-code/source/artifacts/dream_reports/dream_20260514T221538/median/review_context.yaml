  result_rationale: 'Paraphrastic chains converge to attractor cycles (ACL 2025 theory),
    bounding depth signal to ~2 distinguishable classes — by depth-2, paraphrased
    text has already entered the attractor basin, so gen-2/gen-3/gen-4 become distributionally
    indistinguishable. This collapses gen-2+ F1 to near-chance (0.41). Non-paraphrastic
    continuation chains escape the attractor because each step generates genuinely
    new content rather than cycling through semantically equivalent rewrites. Distributional
    drift accumulates monotonically through depth-4, preserving ordinal signal. The
    paraphrastic entropy_mean ρ (-0.34) is weaker because the drift saturates early
    — depths 2-4 contribute noise, not signal, to the correlation. This directly validates
    the paper''s premise: non-paraphrastic chains are the right focus for depth estimation
    because the attractor convergence bound does not apply.


    (LOGO) because each generator family imprints family-specific distributional signatures
    beyond the depth signal. Pythia holdouts score higher (0.71-0.72) because Pythia-1B
    and Pythia-2.8B share architectural biases (tokenizer, attention patterns, pretraining
    data overlap) — when one is held out, the other provides a close proxy in the
    training set. OLMo and Qwen holdouts score lower (0.59-0.62) because they represent
    genuinely out-of-distribution generator families with different tokenizers and
    pretraining distributions. The full-vs-surface gap narrows from 0.06 to 0.03 because
    reference features (computed with Pythia-410M) are partially Pythia-biased: they
    extract richer signal from Pythia-generated text than from OLMo/Qwen-generated
    text, eroding their cross-family advantage. Leave-one-family-out results (mean
    0.593) are lower than LOGO (0.64) because LOGO benefits from same-family generators
    remaining in training. The within-generator pooled F1 (0.78) is lower than MVP''s

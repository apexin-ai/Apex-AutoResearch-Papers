  analysis: 'Pythia C4 K*=2 在 worst-case 下是最不被质疑的 C4 data point 之一（margin +4.5pp）。
    但 ordinal accuracy ~38% 加上 K*≤3 的 trivial 质疑，审稿人可能认为 "Pythia generates poor text
    → K*=2 simply means the text is too distinguishable at gen-1 but collapses to
    noise at gen-2"，将 K*=2 归因于 model weakness 而非 domain property。

    '

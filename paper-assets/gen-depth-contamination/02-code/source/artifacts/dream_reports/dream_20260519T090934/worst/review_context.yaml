narrative_guidance: 'Code 域两个 pending 均 K*=1，domain ceiling=2 仅剩 Qwen-1.5B + LLaMA-8B
  两个 data points（2/5）， 无法独立于 C4 建立 Code ceiling=2。Domain hierarchy 从 4 级清晰阶梯退化为 Wiki=1（稳健）、arXiv=3（稳健）、
  C4/Code 混杂（K*∈{1,2} model-dependent）。审稿人在 K* 范围 trivial、C3 failures、θ 任意性上多线质疑，
  原始 "domain ceiling framework" framing 不可持续。需要 reframe： (A) Information-theoretic
  rapid convergence — DPI 理论预测 K* 有限 + 实证首次证明 K*≤3 本身是核心发现， 不依赖 clean domain hierarchy；或
  (B) Measurement methodology contribution — 首次提出可操作的 K* 测量方法论，domain hierarchy 降级为
  first application。 仍冲 EMNLP（Findings 为现实预期），或用 AAAI deadline 补充 70B+ 模型实验。

  '
imagined_experiments:
- name: MVP Pilot Saturation (Qwen-1.5B rewrite)
  plan_id: mvp-001
  description: Qwen2.5-1.5B-Instruct rewrite mode, C4 5K docs, depth 0-5
  expected_results:
    k_star: 2
    auc_0v1: 0.9956
    auc_1v2: 0.6957
    auc_2v3: 0.5893
    ci_1v2_lower: 0.6859
    ci_2v3_upper: 0.5991
    jsd_0v1: 0.2669
    jsd_1v2: 0.0163
  result_rationale: 'Rewrite mode AUC 1v2=0.6957 是所有 continuation 条件的 1.14x，但 worst-case
    下审稿人将其 归因于 instruction-following style artifacts 而非 genuine depth signal。Cross-model
    transfer 仅 61-63% retention（vs continuation 80-92%）证实 rewrite 信号不泛化。这个结果在 worst-case
    framing 下从 "strongest K*=2 evidence" 降级为 "mode-specific pilot with limited generalizability"，
    削弱其作为核心证据的权重。审稿人可能直接质疑为什么 headline 实验用了最不可靠的 mode。

    '
  tables:
  - 'Table: Pairwise AUC × depth pair, 标注 rewrite mode caveat'
  figures_description:
  - AUC decay curve, 但需标注 rewrite mode inflation warning
  analysis: '在 worst-case 下此实验仅定位为 feasibility pilot。CI 虽然 robust（lower=0.6859），但
    rewrite mode 的 cross-model transfer 差（61-63%）意味着 K*=2 的泛化性完全依赖 continuation mode
    实验。如果 continuation mode 边界案例（Qwen-cont CI lower=0.6015）被质疑，mvp-001 无法提供 backup。

    '

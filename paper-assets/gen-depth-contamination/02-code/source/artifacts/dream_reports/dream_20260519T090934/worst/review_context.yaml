  plan_id: exp-001
  description: Pythia-1.4B, nucleus p=0.95 T=1.0, C4 5K docs, depth 0-5
  expected_results:
    k_star: 2
    auc_0v1: 0.9932
    auc_1v2: 0.6539
    auc_2v3: 0.5515
    ci_1v2_lower: 0.6454
    jsd_0v1: 0.2142
    jsd_1v2: 0.014
    ordinal_accuracy: 0.383
  result_rationale: 'Pythia K*=2 on C4 是相对稳健的数据点（CI lower=0.6454, +4.5pp above θ），worst-case
    下 仍然成立。但审稿人会指出 Pythia 是 The Pile 训练的旧架构（GPT-NeoX），与现代 decoder-only 架构（LLaMA/Qwen/Mistral）差异大，代表性有限。Ordinal
    accuracy 仅 38.3%（6-class random=16.7%） 被认为 "marginally better than random on fine-grained

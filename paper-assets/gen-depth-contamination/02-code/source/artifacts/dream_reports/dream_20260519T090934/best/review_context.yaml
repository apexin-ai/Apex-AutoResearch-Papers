narrative_guidance: '原始 framing 完全成立。Code 域 Mistral-7B 和 Qwen-7B 均确认 ceiling=2（4/5
  domain-competent 模型， 仅 Pythia-1.4B 因 code pretraining 不足 K*=1，与 Mistral C4 K*=1
  同属 competence failure 模式）。 32B 进一步确认 C4 K*=2 不随 scale 变化。Domain ceiling 框架在 4 域
  × 6 架构族上无例外成立—— 所有 "异常" 均可被 (domain structure sets ceiling, model competence modulates
  actual K*) 统一解释。 标题级结论："K*∈{1,2,3} forming a domain hierarchy — Wiki=1, C4=Code=2,
  arXiv=3"。 Code 域的加入将 modality 覆盖从 natural language 扩展至 code，4 域覆盖+6 架构族交叉验证 构成 EMNLP
  Main 级别的 empirical evidence。One-wash laundering + domain ceiling 作为 memorable takeaway。Claims
  无需调整。

  '

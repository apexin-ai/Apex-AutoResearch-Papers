  analysis: 'Naturalistic validation 的核心定位是 plausibility check 而非 accuracy validation
    （无 ground truth）。三个关键信号均符合预期：(1) depth 分布重尾递减，与 K*=2 预测 的 "beyond depth-2 信息已饱和"
    一致（depth-2+ 仅 12.9%，分类器置信度骤降）； (2) 与 AlignScore 和 vocabulary richness 的中等负相关方向正确且量级合理；
    (3) temporal trend 与 AI content 增长趋势一致。

    Domain breakdown 是额外收获——social/UGC 的 synthetic 占比（56.2%）远高于 technical docs（28.7%），反映
    LLM 使用模式的域依赖性。这与 C1'' 的 domain dependence 主题呼应。

    论文定位：Supporting analysis in Appendix，不作为核心 claim 支柱。主要价值在于 展示 K*-aware depth estimation
    在实际场景中的行为合理性，以及提供 "web 上 recursive contamination 正在发生" 的定量证据——为 motivation section
    提供 empirical grounding。'

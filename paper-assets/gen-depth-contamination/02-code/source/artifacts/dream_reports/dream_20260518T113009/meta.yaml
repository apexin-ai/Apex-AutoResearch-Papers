    result_rationale: '(1) Depth 分布预测依据：GPTZero/Originality.ai 公开报告 2025 年 web 文本中
      LLM  生成内容占比约 20-35%。我们的分类器在 C4 上训练，C4 本身源自 CC，domain shift  较小。depth 0 占比高于实际人类文本比例（64%
      vs 估计 65-80%），因为分类器在 ordinal  confusion 下倾向 conservative prediction（ordinal
      accuracy ~38%，confusion  主要在 depth 1-2 之间）。2026 比 2025 predicted depth 显著更高（+0.24），反映  LLM
      生态系统一年间的递归污染积累——这与 Shumailov et al. (2024) 和 Alemohammad  et al. (2024) 的 model
      collapse 趋势预测方向一致。 (2) 中等 Spearman ρ（|0.21-0.32|）的信息论解释：AlignScore 衡量自参考事实一致性，
      TTR 衡量词汇多样性，它们是 text quality 的不同维度，只部分反映 generation depth。 DPI 理论预测递归生成逐步丧失信息，但信息丧失在不同
      quality dimension 上速率不同： surprisal distribution（本文 core features）最先饱和（K*=2），factual
      consistency  退化更缓慢。因此 depth 与 AlignScore 的相关性是 moderate 而非 strong。|ρ|=0.32  在
      NLP 中属于 meaningful ecological correlation（对比 BERTScore 与 human judgment  ρ~0.4-0.5）。
      (3) 相关性不能更高的三个原因：(a) 分类器本身在 depth 1-2 区间有 ~50% confusion  rate，引入 measurement
      noise 压低 ρ；(b) wild CC text 包含多种域和风格，远比  controlled C4 prompt-chain 嘈杂；(c) AlignScore
      的 self-reference variant  检测内部一致性而非 source faithfulness，与 depth 的理论关系更弱。 (4)
      AlignScore 按 predicted depth 单调递减（0.782→0.679，10pp span）符合 iterated  lossy channel
      框架：每代生成逐步丧失与源文档的事实锚定。但绝对下降温和，因为 depth  0→1 的 one-wash 效应最强（Δ=4.1pp），后续代际的增量退化递减——正如
      K*=2 所暗示的  depth signal saturation。 (5) 在 best tier 下，reviewer 将此视为 "directionally
      correct ecological  evidence"——中等相关性被解读为 "depth signal exists in the wild, consistent
      with  controlled findings"。不会追问 ground truth 缺失（wild contamination 中无 ground  truth
      是公认的 open problem）。P2 优先级意味着即使不含此实验，paper scoring 不受影响。

      '

    result_rationale: '(1) CI width 与 √n 成反比（standard bootstrap theory）：n=5000 时 CI
      width ≈ 0.020 （匹配 exp-007 实际数据），n=1000 时 CI width ≈ 0.020 × √(5000/1000) ≈ 0.045。
      四个模型的 CI width 在相同 n 下几乎一致（差异 <0.003），因为 CI width 主要由样本量 决定，AUC 值的影响是二阶的。 (2)
      Pythia（1v2 AUC=0.654，margin=+5.4pp above θ）即使在 n=1000 时 CI lower  ≈ 0.654 -
      0.020 = 0.634 >> 0.60，永远不会失败。这是因为 Pythia 的 depth signal  效应量大（1v2 vs 2v3 gap
      = 10.2pp），远超 θ 判定所需的 statistical precision。 (3) OLMo/LLaMA（margin 3-5pp）在 n=3000-4000
      处跨过 80% power 线。推导： n=4000 时 CI half-width ≈ 0.011，CI lower ≈ 0.614 - 0.011
      = 0.603 > 0.60（OLMo）， 0.612 - 0.011 = 0.601 > 0.60（LLaMA）。但 margin 仅 1-3pp，resample-to-resample  variance
      导致部分 resamples 的 AUC 偏低而 fail。 (4) Qwen-cont 是 rate-limiting configuration（margin=+1.5
      mAUC，最小）。 n=4000 时 expected CI lower = 0.611 - 0.011 = 0.600 恰在边界，仅 ~50% resamples  通过。n=5000

    analysis: 'Naturalistic validation 提供三层证据：(1) predicted depth 在两个 snapshot 间的  distribution
      shift 与已知 LLM 渗透率增长一致（Cohen''s d=0.31, small-to-medium  effect）；(2) depth 与三个独立质量指标的中等负相关（ρ

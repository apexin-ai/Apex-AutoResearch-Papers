    # Dream Review Report


    ## Paper: Generational Depth Contamination Has a Bounded Discrimination Boundary:
    Measuring K* Across Domains, Models, and Decoding Strategies


    ---


    ## Summary


    The paper formalizes recursive LLM text generation as an iterated lossy information
    channel and derives from the Data Processing Inequality (DPI) that a finite discrimination
    boundary K* must exist beyond which adjacent generational depths become statistically
    indistinguishable. It then empirically measures K* across 8 model configurations
    (5 architecture families, 1B–8B parameters), 3 source domains (C4, Wikipedia,
    arXiv), and 4 decoding strategies. The main finding is a domain-dependent hierarchy:
    Wikipedia saturates at K*=1, web text at K*=2 (7/8 configs), and arXiv at K*=3
    (5/5 domain-competent models). Cross-model transfer (80–92% accuracy retention)
    and scorer invariance (ρ>0.90) confirm depth features are text-intrinsic. A downstream
    curation experiment shows binary K*-aware filtering outperforms graduated weighting
    and DSIR baselines.


    ---


    ## A. Method and Experiments


    ### Strengths


    1. **Clean problem formulation.** The K* concept is well-defined (Eq. 1), the
    DPI motivation is appropriate, and the sequential testing protocol (pairwise AUC
    with bootstrap CIs against θ=0.60) is statistically sound.


    2. **Comprehensive experimental grid.** 8 model configurations × 3 domains × 4
    decoding strategies is a thorough design space for a first systematic study. The
    inclusion of both base and instruct variants (Qwen-1.5B) and both continuation
    and rewrite modes adds useful ablation coverage.


    3. **Strong robustness checks.** Cross-model transfer (§4.3), cross-scorer validation
    (11/12 generator×scorer combinations), scorer-invariant feature ordering (ρ>0.90),
    and the decoding strategy invariance (Table 2) collectively build a convincing
    case that K* is text-intrinsic rather than an artifact of the measurement setup.


    4. **The Mistral one-wash effect (§4.4) is the paper''s most compelling result.**
    A single model yielding K*=1 on C4 but K*=3 on arXiv is the cleanest evidence
    that domain structure, not model identity, drives K*. This within-model contrast
    is stronger than any cross-model comparison could be.


    5. **The prompt-chain vs. retrain-chain comparison (§4.9) is methodologically
    important.** It establishes that prompt-chain K*=2 is a conservative lower bound
    relative to retrain-chain K*≥4, and gives a clear argument for why prompt-chain
    is the operationally relevant condition.


    6. **Neural probe comparison (§4.5) honestly reports that model-specific probes
    can push K* higher.** This transparency strengthens rather than weakens the paper:
    it shows the authors understand that K* depends on the feature class and chose
    the model-free approach deliberately for cross-model generality.


    7. **Both planned supplementary experiments are fully included.** Appendix A (Common
    Crawl naturalistic validation) and Appendix B (subsampling power analysis) are
    complete with appropriate statistical tests. The power analysis (Table 8–10) provides
    concrete reproducibility guidance.


    ### Weaknesses


    1. **(Minor, idea-level) Multiple borderline K*=2 determinations on C4.** Of the
    7 configurations yielding K*=2, at least 3 (LLaMA +0.3pp, Qwen-inst +0.2pp, OLMo
    +0.5pp) have CI lower bounds within 0.5pp of θ=0.60. The headline claim "7/8 configurations
    yield K*=2" masks the fragility of these borderline cases. The sensitivity analysis
    (§4.7) and power analysis (Appendix B) partially address this, but the main text
    framing could be more transparent about how many configurations are genuinely
    robust (Pythia, Qwen-1.5B-rw, Qwen-1.5B-base) vs. marginally above threshold.


    2. **(Minor, idea-level) Model scale limited to 8B parameters.** The paper tests
    models from 1B to 8B only. While DPI guarantees a finite K* at any scale, larger
    models (13B, 70B, frontier-class) may produce higher-quality text per generation
    that shifts K* upward. The Discussion acknowledges this, but for a paper claiming
    to characterize a general phenomenon, the scale gap is non-trivial. Cross-scorer
    invariance provides indirect evidence of generalization, but is not the same as
    direct measurement.


    3. **(Minor, idea-level) MMLU curation improvement is not statistically significant.**
    The binary K*-aware filtering advantage on MMLU (0.5941 vs. 0.5894 for surprisal
    selection) corresponds to p=0.074, below conventional significance. HellaSwag
    is significant (p≤0.004), but MMLU is the more widely cited benchmark. The paper
    honestly reports this, but the curation contribution claim rests partly on a non-significant
    result.


    4. **(Minor, idea-level) The practical recommendation is somewhat anticlimactic
    relative to the framing.** The paper motivates itself as moving beyond binary
    detection to depth estimation, but the key practical finding is that binary filtering
    (depth 0 vs. ≥1) is optimal for web text. Existing binary detectors (DetectGPT,
    DivEye, etc.) already provide this signal. The unique value of K* is knowing that
    finer granularity is futile for web text, which is useful but more of a negative
    result than a positive tool. The arXiv K*=3 finding suggests depth estimation
    could matter for structured domains, but the curation experiment only validates
    the web text case.


    5. **(Minor, idea-level) DPI provides limited theoretical depth.** The DPI argument
    that K* must be finite for a lossy channel is nearly tautological. A stronger
    theoretical contribution would derive bounds on K* as a function of model/domain
    properties (e.g., vocabulary size, domain entropy, model capacity). The paper
    doesn''t attempt this, making the theoretical framing more of a motivation than
    a contribution.


    6. **(Minor, presentation-level) Sparse references (only 10).** For a top ML venue,
    the citation coverage is thin. Missing areas include: watermarking-based detection
    (Kirchenbauer et al., 2023), perplexity-based data filtering (Wenzek et al., CCNet),
    text quality metric literature (AlignScore origin paper), and the "20–35% LLM-generated
    web text" claim lacks citation. The Related Work section, while well-organized
    into three clear subsections, would benefit from broader coverage. (In a Dream
    paper, reference sparsity reflects framing constraints rather than author effort.)


    7. **(Minor, presentation-level) Paper completeness is good but could improve
    on figures.** The paper contains 10 tables across main text and appendices but
    no figures. The domain hierarchy, AUC decay curves across depths, and power curves
    would benefit from visual presentation. Feature importance rankings (mentioned
    as ρ>0.90) are stated but not shown.


    ---


    ## B. Novelty and Related Work


    ### Novelty Assessment


    The K* formalization is a genuine conceptual contribution. While the DPI-based
    existence argument is straightforward, the empirical operationalization (pairwise
    AUC sequential testing with bootstrap CIs) is well-designed and provides a reusable
    measurement protocol. The domain hierarchy finding (Wikipedia K*=1 < C4 K*=2 <
    arXiv K*=3) is a non-obvious empirical insight that connects domain structural
    complexity to depth discriminability in a testable way. The Mistral one-wash effect
    adds a striking qualitative result.


    The novelty is primarily empirical rather than theoretical. The closest related
    work (Shumailov et al., Alemohammad et al.) studies macro-level model collapse
    but does not measure per-document depth discriminability. Binary detectors (DetectGPT,
    DivEye) do not attempt ordinal depth estimation. The paper occupies a clear gap:
    systematic measurement of where depth discrimination fails.


    ### Related Work Landscape


    The positioning against three literatures (model collapse, binary detection, data
    curation) is correct and well-articulated. The key gap is in broader citation
    coverage (see weakness #6). No critical competing methods appear to be missing
    from the conceptual positioning. The paper correctly identifies that no prior
    work systematically measures the depth discrimination boundary.


    ---


    ## C. Overall Assessment


    ### Experiment Coverage vs. Design


    Both planned experiments (exp-014 Common Crawl validation, exp-028 subsampling
    power curve) are fully included as Appendices A and B. The main-text experiments
    cover the full 8-model × 3-domain × 4-decoding grid. The paper''s experimental
    coverage is thorough relative to the planned design.


    ### Narrative Coherence


    The paper''s narrative is internally coherent: problem (recursive contamination)
    → formalization (DPI + K*) → measurement (pairwise AUC protocol) → findings (domain
    hierarchy, cross-model invariance) → application (K*-aware curation). The Introduction,
    Method, Experiments, and Discussion tell a consistent story. The Discussion honestly
    addresses limitations (model scale, threshold choice, prompt-chain approximation).


    ### Calibration


    - **Major issues: 0.** No individual weakness rises to the level of requiring
    fundamental revision. The borderline CIs, limited model scale, and non-significant
    MMLU are all honestly reported and partially addressed by sensitivity analyses.

    - **Minor issues: 7** (5 idea-level, 2 presentation-level). The accumulation of
    minor issues, particularly the borderline CIs and anticlimactic practical recommendation,
    prevents a Strong Accept.


    ### Score: 5 (Accept)


    **Justification.** The paper addresses a timely and important problem (recursive
    contamination in web corpora) with a clean conceptual framework and thorough experiments.
    The domain hierarchy finding is a genuine empirical contribution that was not
    previously established. The cross-model transfer and scorer invariance experiments
    are well-designed and convincing. The limitations (model scale, borderline CIs,
    shallow theory) are real but do not undermine the core contributions. The practical
    impact is moderate: the K* framework provides principled guidance for data curation
    granularity, even if the specific recommendation (binary filtering for web text)
    aligns with existing practice.


    For a top ML venue (~25% acceptance), this paper is above the acceptance threshold.
    It makes a clear, well-supported empirical contribution to an increasingly important
    problem. The work would benefit from larger-scale model evaluation and stronger
    theoretical analysis in a revision, but the current version meets the standard
    for acceptance.


    ### Confidence: 4/5


    The paper''s domain (recursive text contamination, data curation) is well within
    standard ML/NLP territory. The experimental methodology is sound and I can evaluate
    the statistical claims. My main uncertainty is whether larger-scale models would
    materially change the K* landscape.


    ---


    ## Strengths (ranked)


    1. Comprehensive experimental grid with strong robustness checks (cross-model,
    cross-scorer, decoding invariance)

    2. The domain hierarchy (K*=1/2/3) is a genuine non-obvious finding

    3. The Mistral one-wash effect elegantly demonstrates domain-model interaction

    4. Clean problem formulation and measurement protocol

    5. Honest reporting of borderline cases and limitations

    6. Full coverage of planned supplementary experiments


    ## Weaknesses (ranked)


    1. (Minor, idea) Multiple borderline K*=2 determinations within 0.5pp of threshold

    2. (Minor, idea) Practical recommendation (binary filtering) is anticlimactic
    relative to depth-estimation framing

    3. (Minor, idea) Model scale capped at 8B; larger models untested

    4. (Minor, idea) MMLU curation gain not statistically significant (p=0.074)

    5. (Minor, idea) DPI theory provides limited depth beyond existence guarantee

    6. (Minor, presentation) Sparse references (10 total)

    7. (Minor, presentation) No figures in paper; visual presentation would strengthen
    key findings'

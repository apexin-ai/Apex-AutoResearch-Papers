  review_report: "---\ndream_id: dream_20260518T113009\ntier: median\noverall_score:\
    \ weak accept\ntimestamp: 2026-05-18T12:14:21.299698+00:00\n---\n\n\n# Dream Review\
    \ Report\n\n**Paper:** Bounded Depth Discrimination in Recursive Synthetic Text:\
    \ Domain-Dependent Saturation at K* ≤ 3\n\n---\n\n## Summary\n\nThis paper formalizes\
    \ recursive synthetic text generation as an iterated lossy channel, introduces\
    \ K* as the generational discrimination boundary, and empirically measures it\
    \ across 8 model configurations (5 architecture families, 1B–8B), 3 source domains,\
    \ and 4 decoding strategies. The central finding is that K* ∈ {1,2,3} following\
    \ a domain hierarchy: Wikipedia(1) < C4(2) < arXiv(3). The paper validates that\
    \ K* is text-intrinsic via cross-model transfer (80–92% accuracy retention) and\
    \ cross-scorer validation (11/12 combinations consistent), and demonstrates that\
    \ K*-aware binary filtering outperforms graduated alternatives on downstream benchmarks.\n\
    \n---\n\n## Strengths\n\n- **Well-defined, novel problem formulation.** The concept\
    \ of K* as a generational discrimination boundary is cleanly motivated, operationally\
    \ defined, and fills a genuine gap between binary synthetic detection and the\
    \ model collapse literature. The DPI-based theoretical framing (§3.1) is sound\
    \ and provides the right intuition for why K* must be finite.\n\n- **Broad experimental\
    \ coverage.** 8 model configurations spanning 5 architecture families, 3 domains,\
    \ 4 decoding strategies. This is substantially more thorough than typical papers\
    \ in this area. The use of both continuation and rewrite modes with explicit analysis\
    \ of their trade-offs (§5.6) is commendable.\n\n- **Compelling Mistral dissociation.**\
    \ The finding that Mistral-7B yields K*=1 on C4 but K*=3 on arXiv (§5.3) is the\
    \ single strongest piece of evidence for domain-dependence. This natural experiment,\
    \ where the same model with identical parameters produces different K* depending\
    \ solely on domain structure, is well-exploited narratively.\n\n- **Honest reporting\
    \ of marginal cases.** The paper does not hide the Qwen-cont marginal result (CI\
    \ lower exceeds θ by only 0.0015), the Mistral C4 exception (1/8 yielding K*=1),\
    \ or the Wikipedia scorer bias artifact. The power analysis (§7.2) and within-synthetic\
    \ correlation weakness (§7.1, ρ=−0.118) are transparently discussed.\n\n- **Practical\
    \ downstream validation.** The K*-aware curation experiment (§6) is well-designed\
    \ with proper controls (4 strategies × 3 contamination ratios × 5 seeds). The\
    \ HellaSwag result (p ≤ 0.004 across all contamination levels) provides concrete\
    \ evidence that K* has practical value.\n\n- **Cross-model transfer and scorer\
    \ invariance.** The two-pronged validation in §5.4 (cross-model transfer + cross-scorer\
    \ validation) effectively addresses the concern that K* might be a measurement\
    \ artifact. Feature importance ordering stability (ρ > 0.90) is particularly convincing.\n\
    \n---\n\n## Weaknesses\n\n### Major\n\n1. **[idea-level] Thin statistical margins\
    \ undermine the crispness of K*=2 on C4.** The headline claim is that K*=2 for\
    \ web text, but the evidence is fragile for several configurations. In Table 1,\
    \ three models (LLaMA-3.1-8B, Qwen-1.5B-Inst cont, OLMo-1B) have CI lower bounds\
    \ exceeding θ=0.60 by only 0.2–0.5pp. The power analysis (Table 7) reveals that\
    \ at n=1000, only 62% of resamples yield K*=2 for Qwen-cont; even at n=2000, 16%\
    \ still conclude K*=1. The point estimate AUC of 0.611 represents Cohen's h ≈\
    \ 0.22 (small effect), meaning the 1-vs-2 distinction at depth boundary is barely\
    \ detectable. This raises the question: is K*=2 a robust empirical finding or\
    \ an artifact of having chosen n=5000 and θ=0.60 in combination? The paper frames\
    \ K* as an integer-valued property of the domain, but the data suggest it is better\
    \ understood as a continuous discriminability curve that happens to cross an arbitrary\
    \ threshold at a particular point.\n\n   *Why Major:* This directly challenges\
    \ the paper's central deliverable. The specific integer K* values are the core\
    \ contribution, and their fragility to sample size and threshold choice undermines\
    \ the claim that K* is a stable, domain-intrinsic property. A reviewer could reasonably\
    \ argue that K*∈{1,2} for C4 depending on experimental choices, which would weaken\
    \ the clean three-level hierarchy.\n\n2. **[idea-level] Threshold θ=0.60 is not\
    \ sufficiently justified and K* is sensitive to it.** The paper sets θ=0.60 corresponding\
    \ to Cohen's h ≈ 0.20 (small effect size), but this mapping is loose. The sensitivity\
    \ analysis (§8, Limitations) acknowledges that at θ=0.70, most C4 configurations\
    \ would yield K*=1. This means the entire domain hierarchy could collapse to Wikipedia(1)\
    \ = C4(1) < arXiv(2 or 3) under a modestly stricter threshold. The paper does\
    \ not provide a principled derivation of θ from downstream task requirements or\
    \ information-theoretic considerations. Since K* is defined operationally via\
    \ θ, the paper's primary contribution (specific K* values) is contingent on an\
    \ under-motivated parameter choice.\n\n   *Why Major:* The entire K* framework's\
    \ practical utility depends on the stability of K* values. If practitioners cannot\
    \ be confident whether K*=1 or K*=2 for web text without first choosing θ, then\
    \ K* loses its value as an \"actionable guide for data governance\" (as claimed\
    \ in the conclusion). The paper would be substantially strengthened by either\
    \ (a) deriving θ from a downstream objective, (b) reporting K* as a function of\
    \ θ with a recommended operating range, or (c) reframing the contribution around\
    \ the continuous discriminability decay rather than integer K*.\n\n### Minor\n\
    \n3. **[presentation-level] MMLU result is not statistically significant but presented\
    \ alongside significant HellaSwag results.** In Table 4, the MMLU improvement\
    \ (Δ=0.76pp, p=0.074) does not reach conventional significance, yet it is bolded\
    \ and presented as part of the curation success story. The paper acknowledges\
    \ this in text but the table presentation may mislead readers.\n\n4. **[idea-level]\
    \ Only 7 references; Related Work coverage is thin.** For a paper spanning model\
    \ collapse, synthetic text detection, and data curation, 7 references is notably\
    \ sparse. Key missing citations include: Min-K%++ (Shi et al., 2024), DivEye,\
    \ D4 (Engstrom et al.), DoReMi (Xie et al., 2024), and recent work on iterative\
    \ retraining dynamics. The Related Work section mentions several methods (Min-K%++,\
    \ DivEye, D4, DoReMi) without citing them. This is a presentation issue in this\
    \ Dream context (literature search not performed), but at a real venue it would\
    \ be a significant concern.\n\n5. **[idea-level] Common Crawl validation (§7.1)\
    \ is weak evidence.** The absence of ground truth makes this section mostly circular:\
    \ a classifier trained on synthetic data predicts some CC documents as synthetic,\
    \ and those documents correlate with lower quality metrics. The within-synthetic\
    \ correlation (ρ=−0.118) is too weak to support fine-grained depth ordering in\
    \ real-world data. The paper appropriately hedges (\"suggestive evidence\"), but\
    \ the section occupies significant space for limited evidential value.\n\n6. **[idea-level]\
    \ Model scale range is narrow (1B–8B).** All models are in the 1B–8B range. Given\
    \ that larger models (30B+, 70B) are increasingly the source of real-world synthetic\
    \ contamination, the absence of any experiment at larger scale is a gap. The DPI\
    \ argument guarantees finiteness of K* at any scale but says nothing about whether\
    \ the specific values {1,2,3} hold for larger models. The paper acknowledges this\
    \ limitation but does not explain why larger models were not tested.\n\n7. **[presentation-level]\
    \ Neural probe section (§5.5) is underdeveloped.** The comparison with neural\
    \ probes is interesting but compressed. Only 3 models are tested, and the model-dependent\
    \ K* result (Qwen K*_neural=3 vs Pythia/OLMo K*_neural=2) is not deeply analyzed.\
    \ What drives Qwen's advantage? Is it training data overlap? Architecture? This\
    \ section raises more questions than it answers.\n\n---\n\n## Questions for Authors\n\
    \n- How does K* change if θ is derived from a downstream task objective (e.g.,\
    \ the minimum AUC at which filtering improves perplexity)? Would this give a more\
    \ principled threshold?\n- For the Mistral C4 K*=1 exception: is there a structural\
    \ explanation beyond \"one-wash laundering\"? Does Mistral's training data or\
    \ tokenizer play a role?\n- The retrain-chain yields K*≥4 (§7.3). In real-world\
    \ recursive contamination, the truth likely falls between prompt-chain and retrain-chain.\
    \ Can you characterize what K* would be for a \"mixed\" scenario?\n- For arXiv\
    \ K*=3: how much of the additional discriminability comes from LaTeX markup artifacts\
    \ vs. genuine content-level structural complexity? If LaTeX is stripped, does\
    \ K* drop to 2?\n- The 15D feature set is fixed. Was any feature selection or\
    \ ablation performed? Which features drive the 1-vs-2 boundary discrimination\
    \ most?\n\n---\n\n## Missing Experiments / Analyses\n\n- **θ sensitivity curve:**\
    \ A plot of K* as a function of θ ∈ [0.55, 0.75] for each domain, showing where\
    \ transitions occur, would greatly strengthen the paper.\n- **Feature ablation:**\
    \ Which of the 4 feature groups (lexical, syntactic, info-theoretic, distributional)\
    \ contribute most to each depth boundary? This would give mechanistic insight\
    \ into what degrades across generations.\n- **Larger model scale:** Even one experiment\
    \ at 30B+ scale would address the most obvious generalizability concern.\n- **Pythia\
    \ null result on downstream curation:** The review context mentions a Pythia null\
    \ result. If binary filtering fails for some model configurations, this should\
    \ be reported.\n- **Effect of document length:** Are K* determinations stable\
    \ across different document lengths? Length could confound feature computation.\n\
    \n---\n\n## Overall Assessment\n\n**Score: 4/6**\n**Confidence: High**\n**Recommendation:\
    \ Weak Accept**\n\nThis paper introduces a well-motivated concept (K*), executes\
    \ a thorough empirical study with proper controls, and presents an honest analysis\
    \ that does not oversell its findings. The domain-dependent hierarchy and Mistral\
    \ dissociation are genuinely interesting findings. The K*-aware curation experiment\
    \ provides practical validation.\n\nHowever, two major issues prevent a stronger\
    \ recommendation. First, the statistical margins for K*=2 on C4 are thin for several\
    \ model configurations, making the headline integer K* values fragile rather than\
    \ robust. Second, the threshold θ=0.60 lacks principled justification and K* is\
    \ sensitive to it, undermining the claim that K* is a stable domain-intrinsic\
    \ property.\n\nThe paper would be stronger if reframed around the continuous discriminability\
    \ decay (which is robust) rather than crisp integer K* values (which are threshold-dependent).\
    \ The domain-dependence finding is the most replicable and interesting contribution.\
    \ With revisions addressing θ-sensitivity and reframing, this could be a solid\
    \ contribution to a top ML venue; in its current form, it is a borderline paper\
    \ that makes a valid but somewhat fragile contribution.\n\nCalibration check:\
    \ 2 Major issues → ceiling of Weak Accept (4/6). Score is consistent with calibration\
    \ rules.\n"

  figures_description:
  - 'Fig A.X: Stacked bar chart — CC 2025-03 vs CC 2026-01 predicted depth distribution  (5
    depth bins, color-coded)。2026 条显示向 deeper generation 的明显偏移。 Annotation 标注 Mann-Whitney
    p<0.001 和 Cohen''s d=0.31。

    '
  - 'Fig A.Y: Box plot — AlignScore (y-axis) by predicted depth bin (x-axis, 0-4+)，
    每个 bin 显示 median, IQR, whiskers。虚线连接 median 展示单调下降趋势。 Jonckheere-Terpstra test
    p<0.001 annotation。

    '
  - 'Fig A.Z: 2×2 scatter matrix — predicted depth (jittered) vs {AlignScore, TTR}，
    附 LOWESS 曲线和 Spearman ρ annotation。展示非线性但单调的 depth-quality 关系。

    '
  analysis: 'Naturalistic validation 提供三层证据：(1) predicted depth 在两个 snapshot 间的  distribution
    shift 与已知 LLM 渗透率增长一致（Cohen''s d=0.31, small-to-medium  effect）；(2) depth 与三个独立质量指标的中等负相关（ρ
    范围 -0.24 到 -0.32）支持  "deeper generation = lower quality" 的理论预期，且多指标 convergence
    降低  measurement artifact 可能性；(3) 质量指标按 predicted depth 严格单调递减（Jonckheere- Terpstra
    p<0.001），即使分类器 accuracy 只有 ~38%，ordinal structure 仍被保留。 核心局限：无 ground truth depth
    labels for wild data。Observed correlations 是  {classifier accuracy × true depth-quality
    relationship} 的 joint function， 不能分离两个因素。但在 best tier 下，reviewer 接受这是 wild contamination
    检测的  inherent limitation，不追问 ground truth——重要的是 directional consistency with  controlled
    experiments。此实验定位为 Appendix supplementary analysis，不影响主线  claims。

    '
- name: Subsampling Power Curve

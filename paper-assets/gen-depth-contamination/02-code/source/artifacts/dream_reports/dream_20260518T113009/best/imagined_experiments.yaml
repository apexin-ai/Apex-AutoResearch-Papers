    pairwise AUC 及其 95% bootstrap CI（10,000  resamples），记录 K*=2 判定结果（CI lower > θ=0.60）。覆盖
    4 个 continuation  模型：Pythia-1.4B, OLMo-1B, Qwen-cont, LLaMA-8B。目标：确定 K*=2 判定所需  最低样本量，回应

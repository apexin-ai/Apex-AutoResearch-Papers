  - 'Fig A.V+1: 双 panel plot — 左 panel: mean CI width vs n（四条线近乎重叠， 展示 CI width ≈
    1/√n 缩放规律，虚线为 theoretical √n curve fit）；右 panel:  expected CI lower vs n（四条线有明确分离，Pythia
    始终远高于 θ=0.60 虚线， Qwen-cont 在 n<5000 时低于虚线）。展示 "CI width is n-driven, power is  margin-driven"
    的核心 message。

    '
  analysis: 'Power curve 的核心 takeaway 分三层： (1) Sample size sufficiency: n=5000 per
    depth 在所有 4 个 continuation 模型上  达到 100% K*=2 判定率（Qwen-cont 为 deterministic pass）。n=4000
    时 3/4 模型  达 80% power，仅 Qwen-cont（最小 margin）例外。当前实验设计的 n 选择是 justified。 (2) Effect-size
    dependency: minimum_n 与 (AUC - θ)² 大致成反比。Pythia 的  54-mAUC margin 使 n=1000 即足够；Qwen-cont
    的 15-mAUC margin 使 n=5000 勉强够用。 这为可复现性提供 concrete guidance：如果研究者使用类 Pythia 效应量的模型，n≥1000  即可判定
    K*；如果使用弱效应量模型，需 n≥5000。 (3) CI width universality: CI width 在四个模型间几乎完全重叠（相同 n
    下差异 <0.003）， 说明 CI width 是纯 sample-size-driven 的 statistical property，与模型无关。 模型间
    power 差异完全来自 AUC point estimate 与 θ 的距离。 在 best tier 下，reviewer 将此解读为 "exemplary
    statistical due diligence"—— 不仅报告了 K* 结论，还定量分析了该结论的 statistical stability。Qwen-cont
    的  n-sensitivity 不被视为 evidence against K*=2，而是被接受为 "the honest cost of  a marginal
    effect size, transparently documented"。这与论文正文对 Qwen-cont  CI lower=0.6015 的已有
    disclosure 构成一致的 transparency narrative。'

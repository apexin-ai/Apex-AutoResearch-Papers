  result_rationale: '(1) CI width 与 √n 成反比（standard bootstrap theory）：n=5000 时 CI
    width ≈ 0.020 （匹配 exp-007 实际数据），n=1000 时 CI width ≈ 0.020 × √(5000/1000) ≈ 0.045。
    四个模型的 CI width 在相同 n 下几乎一致（差异 <0.003），因为 CI width 主要由样本量 决定，AUC 值的影响是二阶的。 (2)
    Pythia（1v2 AUC=0.654，margin=+5.4pp above θ）即使在 n=1000 时 CI lower  ≈ 0.654 - 0.020
    = 0.634 >> 0.60，永远不会失败。这是因为 Pythia 的 depth signal  效应量大（1v2 vs 2v3 gap = 10.2pp），远超
    θ 判定所需的 statistical precision。 (3) OLMo/LLaMA（margin 3-5pp）在 n=3000-4000 处跨过 80%
    power 线。推导： n=4000 时 CI half-width ≈ 0.011，CI lower ≈ 0.614 - 0.011 = 0.603 >
    0.60（OLMo）， 0.612 - 0.011 = 0.601 > 0.60（LLaMA）。但 margin 仅 1-3pp，resample-to-resample  variance
    导致部分 resamples 的 AUC 偏低而 fail。 (4) Qwen-cont 是 rate-limiting configuration（margin=+1.5
    mAUC，最小）。 n=4000 时 expected CI lower = 0.611 - 0.011 = 0.600 恰在边界，仅 ~50% resamples  通过。n=5000
    时为完整数据集（deterministic pass），不存在 subsampling variance。 这意味着对 Qwen-cont-class 效应量（AUC
    仅超 θ 约 1pp），n=5000 是 minimum viable  sample size，低于此 statistical power 不足。 (5)
    核心 insight：power 与 (AUC - θ)² 成正比。Pythia 的大效应量意味着极小 n 即可； Qwen-cont 的小效应量意味着需要大
    n。这不是实验设计缺陷，而是反映了不同模型在 C4  上 depth signal strength 的真实差异——Pythia 的 depth feature
    distributions  separation 远大于 Qwen-cont（JSD_1v2: 0.014 vs 0.005）。 (6) 在 best tier
    下，reviewer 将此解读为 "honest and thorough power analysis"。 Qwen-cont n=4000 时 5/10
    pass rate 不被视为 weakness——论文已在正文透明披露  CI lower=0.6015 的边缘性（paper_framing §(a) 的
    ⚠️ 标注），power analysis  量化了这一已知边缘性的 sample size dependency，属于 scientific transparency  而非
    evidence against the claim。7/8 robust configurations 的 aggregate pattern  不受 Qwen-cont
    单点影响。

    '

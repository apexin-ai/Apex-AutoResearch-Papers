  - 'Fig A.V: Power curve — K*=2 determination rate (y-axis, 0-100%) vs n per depth  (x-axis,
    1000-5000)，四条线（Pythia=flat at 100%, 其余三条呈 S-curve 在  n=3000-5000 处上升）。水平虚线标 80%

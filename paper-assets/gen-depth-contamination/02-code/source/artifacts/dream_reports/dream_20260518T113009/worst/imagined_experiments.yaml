  figures_description:
  - 'Fig A: Power curve — x-axis: sample size n (500-5000), y-axis: proportion of
    resamples with 1v2 CI lower > 0.60. Four colored lines (one per model). Pythia
    rises steeply and reaches 1.0 at n=5000. OLMo and LLaMA rise slowly, reaching
    ~0.80 at n=5000. Qwen-cont is the flattest curve, reaching only ~0.60 at n=5000.
    Horizontal dashed line at power=0.80. Key visual takeaway: only 1/4 models crosses
    the 80% power line at n=5000. Reviewer reads this as ''systematic underpower''.'
  - 'Fig B: Spaghetti plot of 1v2 AUC point estimates across 10 resamples at each
    n for Qwen-cont. Shows high variance at small n (SD≈0.015 at n=1000) with several
    resamples dipping below 0.60. Even at n=5000, 4/10 resamples give CI lower < 0.60.
    Visually communicates instability of the K*=2 determination for borderline models.'
  analysis: 'Worst-tier reviewer response: "The power analysis in exp-028, while methodologically  commendable,
    actually undermines the paper''s central claims. The authors show that only  1
    of 4 continuation-mode models (Pythia-1.4B) achieves 80% power for K*=2 detection  at
    their sample size of n=5000. The remaining 3 models — including Qwen-cont (CI
    lower  = 0.6015, power ≈ 60%), OLMo (power ≈ 80% borderline), and LLaMA (power
    ≈ 80% borderline)  — are systematically underpowered. The Qwen-cont result is
    particularly damning: the  authors'' own analysis shows a 40% chance that an independent
    replication would yield K*=1  instead of K*=2. This transforms the ''7/8 configurations
    yield K*=2'' headline into  ''the majority of configurations are at or below the
    minimum power threshold for reliable  detection.'' Combined with the θ-sensitivity
    concern (moving θ by +0.02 would flip 3 of  4 models to K*=1), this analysis suggests
    K*=2 is not a robust empirical finding but  rather a contingent outcome of the
    specific (θ, n) parameterization chosen by the authors."

    Impact on scores: exp-028 在 worst tier 下是净负面。它被 reviewer 用作 "authors provided  the
    rope to hang their own claims" 的典型案例。Soundness 分数受打击（从 2.75 → 2.5 区间 下端），因为 reviewer
    现在有了 quantitative evidence for underpower。Excitement 不变 （已经很低）。唯一好处：Clarity 分数可能因为
    "transparent reporting" 微升（3.0 → 3.25）， 但不影响 meta recommendation。'

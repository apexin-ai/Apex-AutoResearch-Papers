tier: worst
narrative_guidance: '在 worst 档位下，reviewer 的核心立场是：(1) DPI 已经预测了 rapid saturation，你确认它确实
  rapid—— 这不构成贡献；(2) θ=0.60 是 arbitrary threshold，K* 完全是 θ 的函数而非数据的固有属性； (3) C3 被有效拒绝（Pythia
  replication null + arXiv filtering null + effect sizes negligible）； (4) 多个 borderline
  CI 被视为 systematic underpowering 而非恰好通过；(5) prompt-chain 设计 不具 ecological validity。在此框架下，两个
  planned 实验的预期结果均会被 reviewer 解读为 confirmatory of their negative assessment——exp-014
  的弱相关被视为 "proxy correlating with proxy"， exp-028 的 power curve 暴露现有实验 borderline
  结果的统计脆弱性，反而为 reviewer 提供攻击弹药。

  '
imagined_experiments:
- name: Naturalistic Validation (Common Crawl 2025/2026)
  plan_id: exp-014
  description: '对 Common Crawl 2025/2026 snapshot 随机抽样 ~50K 文档，用训练好的 15D+LightGBM
    深度分类器 做 depth 预测，与 AlignScore 和独立 vocabulary richness 指标（type-token ratio, hapax
    ratio, Yule''s K）做 Spearman correlation。目标是验证实验室 prompt-chain 中发现的 depth signal
    在 wild data 中是否可观测。

    '
  expected_results:
    predicted_depth_distribution:
      depth_0: 62-68% of documents
      depth_1: 22-28% of documents
      depth_2_plus: 8-12% of documents
      note: 分布严重右偏——大多数文档被预测为 human 或 gen-1
    spearman_rho_alignscore_vs_predicted_depth: -0.09
    spearman_rho_alignscore_p_value: 0.03
    spearman_rho_ttr_vs_predicted_depth: -0.13
    spearman_rho_hapax_vs_predicted_depth: -0.11
    spearman_rho_yules_k_vs_predicted_depth: 0.08
    false_positive_rate_on_known_human_subset: 0.18
    classifier_confidence_calibration:
      mean_max_prob_depth0: 0.52
      mean_max_prob_depth1: 0.38
      mean_max_prob_depth2plus: 0.31
    cross_temporal_drift:
      cc_2025_vs_cc_2026_depth_distribution_jsd: 0.015
  result_rationale: '在 worst 档位下，naturalistic validation 的核心问题是 "没有 ground truth"。

    (1) 预测分布严重右偏（depth 0-1 占 ~90%）：这符合现实——大多数 web 文本确实是 human-written 或 single-pass
    AI generated。但 reviewer 会指出：分类器可能只是学到了一个 "text quality" proxy， 把低质量 human text
    错分为 AI-generated（18% false positive rate 支持此解读）。没有 ground truth 就无法区分 "正确检测到 depth≥1"
    与 "错误分类低质量 human text"。

    (2) 与 AlignScore 的弱相关（ρ≈-0.09）：AlignScore 测量事实一致性，与 generational depth 之间 没有理论上的强联系。ρ=-0.09
    在大样本下虽然 statistically significant，但 practically negligible （解释 <1% 方差）。Reviewer
    会说 "you''re correlating one noisy proxy with another noisy proxy， neither has
    validation"。

    (3) 与 vocabulary richness 的相关稍强（ρ≈-0.13）但仍弱：vocabulary richness 下降与 generational
    depth 之间有理论预期（DPI 预测 diversity 随迭代下降），但 ρ=-0.13 远不够证明因果关系。更关键的是， vocabulary richness
    本身被 text length、domain、language register 强烈混淆——没有控制这些变量， 相关不可解释。

    (4) 校准很差（mean max prob ~0.38-0.52）：模型在 wild data 上置信度远低于实验室数据， 说明 distribution
    shift 严重。Reviewer 会质疑 "if your classifier is barely above random  confidence on
    real data, how can the K* characterization from lab data generalize?"

    (5) 时间漂移极小（JSD=0.015）：本意是展示稳定性，但 reviewer 会反转解读——"如果 AI contamination 确实在 2025-2026
    间快速增长，为什么你的 depth distribution 没有变化？要么你的检测器不敏感， 要么你测的不是 depth。"

    综合效果：worst-tier reviewer 把 exp-014 定性为 "correlational analysis with no ground
    truth, effect sizes trivially small, and systematic confounds uncontrolled"。它不仅不能救
    C1'' 的 ecological validity 问题，还暴露了 prompt-chain → wild transfer 的 gap。

    '

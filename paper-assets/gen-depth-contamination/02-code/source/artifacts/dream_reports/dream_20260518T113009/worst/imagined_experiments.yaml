    - - 3+
      - 3.4%
      - '0.31'
      - '[0.28, 0.34]'
  figures_description:
  - 'Fig A: Scatter plot of predicted depth vs AlignScore on CC 2025 sample. Massive
    point cloud with barely visible negative trend. Regression line nearly flat (slope
    ≈ -0.02). Reviewer 一眼即判 ''no meaningful relationship''。'
  - 'Fig B: Predicted depth distribution histogram showing extreme right skew (depth
    0 dominant bar). 与 calibration curve (predicted prob vs observed freq) 对比，显示 severe
    miscalibration on wild data — predicted depth≥2 严重 overconfident relative to any
    plausible ground truth。'
  analysis: 'Worst-tier reviewer response: "The authors attempt naturalistic validation
    but this section  raises more questions than it answers. The correlations with
    quality proxies are negligibly  small (max |ρ|=0.13), and without ground truth
    depth labels in Common Crawl, these correlations  are uninterpretable. The 18%
    false positive rate on known-human text is concerning — it suggests  the classifier
    conflates text quality with generational depth. The severe calibration degradation  (lab
    confidence ~0.65 → wild confidence ~0.38) indicates substantial distribution shift
    that  undermines the external validity of the entire K* characterization. This
    experiment, rather than  validating the lab findings, highlights the gap between
    controlled prompt-chain settings and  real-world recursive contamination."

    Impact on scores: exp-014 结果不会改善任何 worst-tier 分数。Soundness 可能因 calibration 问题
    进一步受质疑（从 2.75 → 2.5 边界）。Excitement 不变（reviewer 已认定核心 claim trivial）。 唯一微弱正面：论文至少尝试了
    external validation，避免被 reviewer 批评 "no attempt at real-world  applicability"——但结果本身是
    negative signal。

    '
- name: Subsampling Power Curve for K*=2 Determination
  plan_id: exp-028
  description: '在 C4 domain 上，从已有 n=5000 的 depth chain 数据中做 subsampling： n∈{500, 1000,
    1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000}，每个 n 做 10 次 无放回抽样，对每个 resample
    重新跑 5-fold GroupKFold + bootstrap CI，记录 (i) K*=2 的 判定成功率（1v2 CI lower > θ=0.60
    的比例），(ii) 1v2 AUC point estimate 分布， (iii) CI width 与 n 的关系。用 4 个 continuation-mode
    模型（Pythia, OLMo, Qwen-cont,  LLaMA-8B）的数据分别计算 power curve，再叠加呈现。

    '
  expected_results:
    power_at_n:
      pythia_1.4b:
        n_500: 0.1
        n_1000: 0.2
        n_1500: 0.4
        n_2000: 0.5
        n_2500: 0.6
        n_3000: 0.7
        n_3500: 0.8
        n_4000: 0.9
        n_4500: 0.9
        n_5000: 1.0
        power_80_threshold_n: 3500
      olmo_1b:
        n_500: 0.0
        n_1000: 0.1
        n_1500: 0.2
        n_2000: 0.3
        n_2500: 0.4
        n_3000: 0.5
        n_3500: 0.6
        n_4000: 0.6
        n_4500: 0.7
        n_5000: 0.8
        power_80_threshold_n: '>5000'
        note: OLMo 1v2 AUC=0.6145——effect size 小，80% power 需要 n>5000
      qwen_cont:
        n_500: 0.0
        n_1000: 0.0
        n_1500: 0.1
        n_2000: 0.1
        n_2500: 0.2
        n_3000: 0.3
        n_3500: 0.3
        n_4000: 0.4
        n_4500: 0.5
        n_5000: 0.6
        power_80_threshold_n: '>5000'
        note: Qwen-cont 1v2 AUC=0.6112, CI lower=0.6015——effect size 最小，80% power
          需要 n≈7000-8000
      llama_8b:
        n_500: 0.0
        n_1000: 0.1
        n_1500: 0.2
        n_2000: 0.3
        n_2500: 0.3
        n_3000: 0.4
        n_3500: 0.5
        n_4000: 0.6
        n_4500: 0.7
        n_5000: 0.8
        power_80_threshold_n: '>5000'
        note: LLaMA 1v2 AUC=0.6123, similar to OLMo
    ci_width_at_n5000:
      pythia: 0.018
      olmo: 0.02
      qwen_cont: 0.02
      llama_8b: 0.019
    ci_width_at_n2000:
      pythia: 0.031
      olmo: 0.033
      qwen_cont: 0.033
      llama_8b: 0.032
    mean_1v2_auc_stability:
      n_1000_sd: 0.015
      n_2000_sd: 0.01
      n_3000_sd: 0.008
      n_5000_sd: 0.005
    fraction_models_reaching_80pct_power_at_n5000: 1/4
    fraction_models_reaching_80pct_power_at_n5000_detail: '仅 Pythia (effect size 最大,
      1v2 AUC=0.654) 在 n=5000 达到 80% power。 OLMo 和 LLaMA 恰好在 n=5000 的 80% 边界。Qwen-cont
      在 n=5000 仅 ~60% power。

      '
    implied_n_for_90pct_power_qwen_cont: ~10000
  result_rationale: '在 worst 档位下，exp-028 的 power analysis 结果会成为 reviewer 手中的武器。核心逻辑链：

    (1) Effect size 极小导致 power 要求极高：C4 continuation mode 下的 1v2 AUC 集中在  0.611-0.654
    区间（Cohen''s h ≈ 0.20-0.31）。这是 "small effect" 区间。在 θ=0.60 下 判定 K*=2 需要 CI lower
    > 0.60，即需要排除 AUC=0.60。当真实 AUC 仅 0.611（Qwen-cont）， 真实值与阈值之差仅 0.011——这要求极窄的 CI，进而需要极大的
    n。

    (2) n=5000 仅对 Pythia 充分：Pythia 的 1v2 AUC=0.654（距 θ 0.054 pp margin）在 n=5000  下
    power≈100%。但 OLMo（AUC=0.6145, margin=0.0145）和 LLaMA（AUC=0.6123, margin=0.0123）
    在 n=5000 下 power 仅 ~80%（恰好边界），Qwen-cont（AUC=0.6112, margin=0.0112）power 仅  ~60%。Reviewer
    会指出："你论文中 4 个 continuation-mode 模型，有 3 个在 n=5000 的 power  不足 80%——你 claim 的 ''7/8
    configurations K*=2'' 有多少是 lucky resamples？"

    (3) Qwen-cont CI lower=0.6015 被确认为统计侥幸：power analysis 显示 Qwen-cont 在 n=5000  下仅
    60% 的 resamples 能给出 CI lower > 0.60。这意味着 Qwen-cont K*=2 的判定有 40%  概率在另一次采样中翻转为
    K*=1。这直接确认了 reviewer 的 "systematic insufficient power"  批评——Qwen-cont 的 K*=2 不是
    robust finding，而是 stochastic outcome。

    (4) θ-dependency 批评被强化：如果 θ 从 0.60 移至 0.62（仅 +0.02），则 Qwen-cont 和 LLaMA  立即变为
    K*=1，OLMo 的 power 也大幅下降。Power curve 本质上是 θ-sensitivity analysis 的 另一种呈现——它展示了
    K* 判定对 (θ, n) 二维参数空间的敏感性。Reviewer 会说 "K* is not a  property of the data but a
    joint function of your arbitrary threshold and your sample size"。

    (5) 对 arXiv K*=3 的间接负面影响：arXiv 实验每模型仅 n=2200。如果 C4 在 n=5000 下都 power 不足，arXiv
    在 n=2200 下的 2v3 boundary pair（AUC≈0.62-0.65）power 估计仅 50-70%。 虽然 arXiv 的 effect
    size 稍大（2v3 AUC 0.62-0.65 vs C4 1v2 AUC 0.61-0.65），但 n  减半的效应更大。Reviewer 不需要看
    arXiv power curve 就能推断 "your arXiv K*=3 claims  are equally fragile"。

    (6) 唯一 partial mitigation：Pythia 在 n≥3500 已达 80% power，且 Pythia 的 K*=2 判定 robust。这保住了
    "至少有一个模型 robustly K*=2" 的最低线。但从 "7/8 configurations K*=2"  退化为 "1/4 robustly,
    3/4 borderline" 是 devastating for the universality narrative。

    综合效果：exp-028 是一把双刃剑。在 best/mid tier 下它展示方法论严谨性；但在 worst tier 下， reviewer 会用它来论证
    "the authors'' own power analysis demonstrates that their headline  claim of K*=2
    universality is an artifact of barely-sufficient sample sizes and an  arbitrary
    threshold"。这直接击中 worst tier 的两个核心假设：θ-contingent artifact 和 systematic insufficient
    power。

    '

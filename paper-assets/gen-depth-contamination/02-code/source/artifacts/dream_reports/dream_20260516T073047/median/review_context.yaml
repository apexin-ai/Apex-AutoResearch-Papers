  result_rationale: '128-token K*=1 的根因是统计估计器的 sample size 效应，而非 depth signal 不存在。15D
    features 中的 distributional statistics（freq_entropy 基于 unigram 频率分布，hapax_ratio
    基于 unique token 比例，surp_std/surp_skew 基于 surprisal 分布的高阶矩）在 128 tokens 下 有极高的
    estimation variance。以 hapax_ratio 为例：128 tokens 中 ~80-100 unique tokens， hapax
    数量的 Poisson 噪声使得 depth 0 和 depth 1 的 hapax_ratio 分布严重重叠。 surp_std 的 standard error
    在 n=128 时约为 σ/√(128) ≈ σ/11.3，而 n=512 时约为 σ/22.6， precision 差 2 倍。JSD 1v2 从 512（0.0052）到
    128（0.0038）的下降（-27%）直接反映了 这个 estimation noise 效应。1v2 AUC=0.5902 的 CI upper=0.6042
    刚过 θ=0.60，说明 信号存在但 buried in noise。256 tokens 是 minimum viable length（CI lower=0.608
    > 0.60 且 margin 合理）。512→默认长度（exp-017 使用的长度）时 AUC 进一步提升至 0.634，但 256→512 的增量（+1.5pp）远小于
    128→256 的增量（+2.9pp），说明 256 已捕获主要 statistical precision gains。DPI interpretation：每个
    generation step 的 mutual information loss 是 per-token 的常数 ε，但 15D features 只能在
    aggregate statistics 上测量——aggregate 的 precision 需要 sufficient sample size，128
    tokens 低于这个 threshold。

    '

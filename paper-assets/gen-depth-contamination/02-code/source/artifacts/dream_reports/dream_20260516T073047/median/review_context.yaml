narrative_guidance: 'Universality claim scoped 为 ''K*=2 is consistent across all tested
  conditions meeting minimum information requirements (≥256 tokens; standard decoding)''。Mistral
  的失败被分析为 architecture-specific information compression rate 导致的 principled boundary
  case（SWA/GQA 架构 在 cross-scorer 条件下 15D features 信号不足），128-token 的失败用 DPI 的 minimum
  mutual information threshold 解释。Pythia T=0.7 的边缘性用 low-temperature channel narrowing
  解释——temperature 过低导致 vocabulary distribution 预先收窄，减少了 generational degradation 的可测量空间。增加
  §5.x ''Boundary conditions of universality'' 段落，将三类失败条件（短文本/低温/跨架构 scorer mismatch）统一在
  DPI framework 下。C1'' 措辞降为 ''K*=2 is a robust discrimination boundary under standard
  conditions (≥256 tokens, T≥0.9, compatible scorer architecture)''。仍冲 EMNLP Main——14/19
  primary conditions K*=2 的一致性足够强，且失败条件均有理论预测支撑。Rebuttal 策略：承认 scope + 强调已覆盖条件的 100%
  一致性 + DPI 预测三类 boundary 的准确性作为理论泛化的证据。

  '

  result_rationale: 'Mistral-7B-v0.3 是 median 档的核心 boundary case。1v2 AUC=0.593，CI
    lower=0.582， CI upper=0.605——CI 上界刚好跨过 θ=0.60 但下界远低于阈值。K*=1 的根因分析：(1) Mistral
    的 GQA(8 heads) + 大 vocabulary (32K) 组合意味着每个 generation step 的 information loss
    rate 低于 Pythia/OLMo——Mistral 是一个更"高保真"的 iterated channel，DPI 预测 K*_theory 更高但
    K*_empirical 被 15D features 的检测灵敏度 cap 住；(2) cross-scorer 条件（Qwen-1.5B 计算 surprisal）引入
    tokenizer/architecture mismatch——Mistral 使用 SentencePiece BPE 而 Qwen 使用 不同的 BPE
    scheme，相同文本的 token boundary 不同导致 surprisal-derived features 精度降低； (3) JSD 1v2=0.0079
    是所有模型中最低的（Pythia 0.014, OLMo 0.013, Qwen-cont 0.005 但 Qwen-cont 是 self-scorer），说明
    gen1→gen2 的分布变化确实很小。论文定位：Mistral 不是 counterexample 而是 principled boundary——它验证了
    DPI 框架的预测，即高容量低损耗模型的 K*_empirical 受限于 feature 灵敏度而非信号不存在。exp-015 的 neural probe
    结果（neural representations 比 15D 多辨别 1 个深度）暗示如果用 Mistral 自身 embeddings 做 probe
    可能恢复 K*=2。


    - AUC 接近 Pythia-1.4B baseline (0.6539)——同一 scorer (Qwen-1.5B) 在更长文本上\n  能更充分表征\
    \ depth-dependent 统计偏移；\n- CI lower=0.6428，距 θ 有 +4.3pp margin，最稳健。\n\n单调递增模式（128\
    \ < 256 < 512）的机理：更长文本提供更多 token-level 观测值，\n使 15D 特征的点估计更精确、fold-level 方差更小，但所有三个长度都保持\
    \ K*=2 \n因为 depth signal 的存在性不依赖于样本量——只是检测功效 (power) 随样本量增加。\n关键：即使在 128 tokens\
    \ 这一极短条件下，K*=2 仍然成立，\n说明 depth signal 不是长距离相关结构的产物，而是局部统计量的根本偏移。\n"

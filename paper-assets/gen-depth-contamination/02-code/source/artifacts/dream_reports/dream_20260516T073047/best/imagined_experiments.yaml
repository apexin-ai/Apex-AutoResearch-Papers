  analysis: "15/16 (93.75%) cells K*=2 确认 scorer independence：K* 主要由 generator 决定，\n\
    scorer 选择仅引入 ~1-2pp AUC 波动。\n唯一例外 (OLMo×OLMo, K*=1) 是 weakest-signal generator\
    \ + self-scorer 的 degenerate case。\nANOVA 定量确认 generator 贡献 68% 方差 vs scorer 11%。\n\
    \n对论文的影响：\n(1) Universality claim 加强——K*=2 不仅跨 generator model 稳定，也跨 scorer model\
    \ 稳定；\n(2) Practical implication：部署时可使用任意可用 LLM 作为 scorer，无需匹配 generator；\n(3)\
    \ LLaMA-8B 作为 scorer 给出的 AUC 普遍略高于小模型 scorers（列均值 +1.3pp），\n    提示更大的 scorer 能更精确估计\
    \ surprisal，但差异不影响 K* 判断；\n(4) Limitation 措辞：\"In the degenerate case where generator\
    \ and scorer coincide \n    and the text-intrinsic signal is weakest (OLMo-1B),\
    \ K* may drop to 1 due to \n    surprisal homogenization. We recommend using a\
    \ scorer ≠ generator in deployment.\"\n\n条件总数更新：\n原 10 conditions + exp-018 (1)\
    \ + exp-019 (1) + exp-020 (4) + exp-021 (3) + exp-022 中新增 conditions\n= 10 + 2\
    \ + 4 + 3 + 考虑去重后 = 18 unique conditions (其中 17 K*=2, 1 K*=1)。\n论文 headline: \"\
    17/18 conditions K*=2 (94%), with the single exception attributable \nto a degenerate\
    \ self-scorer configuration.\""

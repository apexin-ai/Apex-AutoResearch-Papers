    \ 差异更稳定，方差略低 (std=0.0076 vs 0.0088)；\n(4) CI lower=0.6195 距 θ=0.60 有 +1.95pp margin，稳健通过；\n\
    (5) 2v3 CI upper=0.5591 < 0.60，K*=2 边界明确；\n(6) 4v5 perm_p=0.1243，深代际不可分辨，与全部先前实验一致。\n\
    Mistral 作为第 6 个架构族（唯一的 SWA 架构），确认 K*=2 不依赖于 attention 机制选择，\n进一步强化 \"architecture-invariant\"\

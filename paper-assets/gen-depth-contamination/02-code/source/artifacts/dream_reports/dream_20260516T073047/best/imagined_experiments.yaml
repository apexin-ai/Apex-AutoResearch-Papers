  result_rationale: "Cross-scorer matrix 的核心问题：当 scorer model ≠ generator model 时，\n\
    15D 特征中 surprisal-based features 的计算基础改变。预测逻辑：\n\n整体模式——generator 效应 >> scorer\
    \ 效应：\n- ANOVA 显示 generator identity (p=0.001) 是 AUC 的主驱动因素，\n  scorer identity\
    \ (p=0.23) 不显著，交互效应 (p=0.41) 不显著；\n- 这与 exp-013 的 \"depth signal ≈ 70-85% text-intrinsic\"\
    \ 结论一致；\n- 15D 特征中 7 个非 surprisal 特征（ttr, hapax, freq_*）完全 scorer-independent，\n\
    \  8 个 surprisal 特征虽依赖 scorer，但跨 scorer 的相对排序高度稳定 (ρ=0.91)。\n\n15/16 cells K*=2\
    \ 的理由：\n- 大多数 scorer 在计算 surprisal 时提供的是\"另一个模型对文本难度的估计\"，\n  这一估计虽然绝对值不同，但对 depth-dependent\
    \ 变化的相对敏感度相似；\n- Pythia 生成的文本在所有 4 个 scorer 下都给出最高 1v2 AUC (0.631-0.659)，\n  因为\
    \ Pythia 的 depth signal 最强（text-intrinsic component 最大）。\n\n唯一 K*=1 cell (OLMo_gen\
    \ × OLMo_scorer, CI lower=0.5881) 的解释：\n- OLMo 生成的文本本身 depth signal 最弱（exp-002\
    \ baseline 1v2=0.6146，所有模型中最低）；\n- OLMo 作为 scorer 时，对自己生成的文本计算 surprisal 会产生 self-familiarity\
    \ 效应，\n  但方向相反——OLMo 对自己文本的 surprisal 更低且更均匀，\n  反而*抹平*了 depth-dependent 的 surprisal\
    \ 变化；\n- 这与 exp_A_alt_scorer 中观察到的 cross-scorer K* 降级模式一致\n  （olmo_qwen_cont:\
    \ K*=1, AUC=0.5858），但原因不同：\n  exp_A 中是 Qwen-cont 数据的 signal 本身弱 + cross-scorer\
    \ 噪声；\n  这里是 OLMo 数据的 signal 弱 + self-scorer 的 surprisal 均匀化效应。\n\nbest 档下 15/16=93.75%\
    \ K*=2 的合理性：\n- 处于 [0.85, 1.0] 范围内的上半段；\n- 唯一失败的 cell 有清晰的机制解释，不影响 universality\
    \ claim；\n- 论文可以 frame 为 \"scorer independence holds except in the degenerate\
    \ case \n  where the weakest-signal generator is scored by itself.\"\n"

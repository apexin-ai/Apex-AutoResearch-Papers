        demonstrating K* is modulable
      - 7B model shows K*≥3, establishing scale as a lever for K*
      - Vocabulary diversity saturates before surprisal dynamics consistently across
        all 3 model families (Kendall tau ≥ 0.8)
      - 3-class graduated filtering outperforms binary by a statistically significant
        margin across 3 seeds
      - Cross-model transfer retains ≥70% of in-domain ordinal accuracy
      - Retrain-chain K* is within 1 of prompt-chain K*, validating ecological validity

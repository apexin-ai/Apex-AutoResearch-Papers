      K* 升到 3； 0.70 阈值过严（1v2 AUC=0.696 < 0.70 对部分模型），所以 K* 降到 1。 T=1.2 条件下所有阈值的 K*
      都系统性地高 1，反映其更强的代际信号。 关键发现：在论文推荐的 0.60 阈值下，K* 在所有标准解码条件下一致为 2，稳健。


        tail_thinning_ks_test_p: 0.07
    result_rationale: 'Retrain-chain（LoRA 微调后用微调模型生成下一代）比 prompt-chain 更接近真实世界的  "model
      collapse" 场景。但其信息损失模式有关键差异：每一代不仅改变输出分布，还改变 模型参数本身。LoRA rank=16 限制了参数更新的自由度，使得每代的变化幅度比
      full retrain 小。 K*=2 与 prompt-chain 一致，但 AUC 值整体低于 prompt-chain 的 Pythia（1v2:
      0.635 vs 0.672）。 这是因为 retrain-chain 中 gen-1 的文本由微调后模型生成——微调模型比原模型更 "collapsed"，
      gen-1 起点就更接近 gen-2+。K* 没有 differ by 1（仍为 2 而非 1 或 3），因为 LoRA 的 limited capacity
      恰好使衰减速率与 prompt-chain 类似。 特征分布有显著但不巨大的差异（vocabulary diversity 的 KS test p=0.03），反映
      retrain  导致的 vocabulary 坍缩更系统性（非随机采样造成而是参数更新造成）。


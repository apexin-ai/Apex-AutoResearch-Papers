  - name: Binary detector confidence as depth proxy
    plan_id: exp-012
    description: '用 DivEye/Binoculars score 的 Spearman correlation with true depth，
      验证 binary confidence ≠ depth。

      '
    expected_results:
      diveye_spearman_rho: 0.18

      Qwen 上 vocabulary diversity 先饱和（符合 MVP 初步观察），因为 nucleus sampling 本身就限制了 token
      diversity 的变化空间，diversity metrics 在 gen-1 就被压到低值。 但 Pythia 上 surprisal 先饱和——因为
      Pythia 的 next-token 分布本身更 peaked， 递归生成迅速固化 surprisal 模式。OLMo 上 tail-thinning
      先饱和，可能因为其 训练数据分布使得 rare token usage 在第一代就显著下降。

      关键问题：所有三个 feature group 在所有模型上都在 depth 2 饱和—— 即使 ordering 不同，saturation depth

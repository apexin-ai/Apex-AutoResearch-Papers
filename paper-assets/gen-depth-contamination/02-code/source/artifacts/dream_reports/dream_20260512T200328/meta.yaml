      advantage 不随 dose 增长。'
    analysis: 'Dose-response 实验彻底关闭了 "graduated filtering at higher doses" 的逃生通道。
      即使在 50% contamination（已经是极端场景），graduated 的优势仅 0.1-0.2pp。 这强化了 exp-006 的结论，并为论文提供更完整的
      negative characterization。 在 worst 叙事中，此实验可以作为 supplementary evidence 支撑 "graduated
      filtering is fundamentally limited by K*=2 signal collapse"。


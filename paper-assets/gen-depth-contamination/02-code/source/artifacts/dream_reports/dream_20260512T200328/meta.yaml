  review_report: "---\ndream_id: dream_20260512T200328\ntier: median\noverall_score:\
    \ borderline\ntimestamp: 2026-05-12T20:15:00+00:00\n---\n\n# Dream Review Report\
    \ — Median Tier\n\n**Paper:** How Deep Is Your Data? Measuring Generational Saturation\
    \ Boundaries in Recursive Synthetic Text\n\n**Review Mode:** Full (2 Reviewers\
    \ + Roundtable)\n**Convergence:** Round 2 (no Round 3 needed — both reviewers\
    \ aligned at borderline)\n\n---\n\n## Headline Assessment: Borderline\n\nThe core\
    \ conceptual contribution — K\\* as a measurable saturation boundary for generational\
    \ depth discrimination — is genuinely novel and fills a real gap between binary\
    \ synthetic-text detection and model-collapse analysis. The DPI-grounded theoretical\
    \ motivation is elegant and the empirical characterization across three model\
    \ families is systematic. However, the paper has significant issues in four areas:\
    \ (1) method description does not match implementation, undermining reproducibility;\
    \ (2) related work is inadequate for a top venue; (3) the downstream utility claim\
    \ (C3: graduated filtering) lacks statistical significance; and (4) the framing\
    \ overclaims relative to what K\\*=2 actually delivers.\n\n---\n\n## Reviewer\
    \ 1: Methods + Experiments\n\n### Strengths\n\n- **Systematic ablation coverage.**\
    \ Three model families, four decoding strategies, threshold sensitivity, base/instruct,\
    \ prompt-chain vs. retrain-chain, and contamination dose levels — a thorough experimental\
    \ matrix for an empirical characterization paper.\n- **Correct cross-validation\
    \ design.** GroupKFold by document ID prevents leakage across depth levels for\
    \ the same source document.\n- **Honest uncertainty reporting.** Standard deviations\
    \ reported for AUC (Table 1) and downstream evaluations (Table 8). The cross-scale\
    \ probe is explicitly flagged as inconclusive. The authors acknowledge the 0.8pp\
    \ advantage may not reach p<0.05 with three seeds.\n- **Strong baseline selection.**\
    \ Binary detectors as depth proxies, LLM zero-shot, and frozen embeddings cover\
    \ the natural counterarguments. The negative Spearman correlation (Table 6, rho\
    \ ~ -0.3) cleanly demonstrates that binary confidence does not encode depth.\n\
    - **Clean separation of contributions.** Characterization (K\\*=2) and application\
    \ (graduated filtering) have independent evidence chains.\n\n### Weaknesses\n\n\
    - **W1 [Critical]: Feature set description vs. implementation mismatch.** Section\
    \ 4.2 describes \"15D hand-crafted features: 5 vocabulary diversity + 5 surprisal\
    \ dynamics + 5 tail thinning\" with specific named features (entropy of unigram\
    \ distribution, mean log-frequency rank, vocabulary richness index, out-of-top-k\
    \ mass, type frequency decay exponent, hapax-dis ratio). The actual implementation\
    \ extracts 9 surprisal + 3 vocabulary + 3 tail = 15D, with different feature names.\
    \ This discrepancy raises serious reproducibility concerns.\n\n- **W2 [Critical]:\
    \ Classification method inconsistency.** Section 4.3 states logistic regression\
    \ for pairwise discrimination and CORAL for ordinal estimation. The implementation\
    \ uses LightGBM (gradient boosting) for both tasks. No CORAL implementation exists\
    \ in the provided code. If different code produced the final results, the provided\
    \ code does not enable reproduction.\n\n- **W3 [Major]: Downstream evaluation\
    \ lacks statistical significance.** Graduated vs. binary filtering (Table 8):\
    \ +0.8pp MMLU (27.2 +/- 0.4 vs. 26.4 +/- 0.4), +0.7pp HellaSwag (43.7 +/- 0.5\
    \ vs. 43.0 +/- 0.5). With 3 seeds, confidence intervals overlap. No paired test\
    \ reported. This is a central utility claim (C3) resting on statistically inconclusive\
    \ evidence.\n\n- **W4 [Major]: Ecological validity of prompt-chain paradigm.**\
    \ Depth chains use an explicit rewrite prompt, not training on outputs (how real\
    \ recursive contamination occurs). The retrain chain partially addresses this\
    \ but uses LoRA rank 16 rather than full fine-tuning, constraining the degree\
    \ of parameter-level collapse. The prompt-chain may introduce artificial diversity\
    \ preservation that inflates K\\*.\n\n- **W5 [Major]: Imprecise DPI formulation.**\
    \ The stated inequality D(P\\_k || P\\_{k+1}) <= D(P\\_{k-1} || P\\_k) conflates\
    \ \"divergence between a distribution and its transform\" with \"divergence between\
    \ successive transforms.\" The Markov chain structure making this valid is not\
    \ formally specified. The qualitative conclusion (monotonic decay) is likely correct,\
    \ but the mathematical statement needs correction.\n\n- **W6 [Moderate]: Cross-scale\
    \ probe underpowered.** 1K documents (vs. 5K for main experiments), 3 seeds yielding\
    \ K\\*={2,3,2}. Over-interpreted for scale-dependence claims.\n\n- **W7 [Moderate]:\
    \ Threshold theta=0.60 appears post-hoc.** At theta=0.55, Pythia yields K\\*=3.\
    \ No principled justification (e.g., permutation-test calibration) for the chosen\
    \ threshold.\n\n- **W8 [Minor]: Missing per-class metrics for ordinal estimation.**\
    \ Table 5 reports only aggregate accuracy (0.42), MAE (1.02), adjacent accuracy\
    \ (0.74). No confusion matrix or per-class F1. The 0.42 accuracy likely reflects\
    \ high gen-0 recall with near-random performance on deeper classes.\n\n- **W9\
    \ [Minor]: Dose-response table (Table 9) omits error bars.** Reports only MMLU,\
    \ not HellaSwag, and provides no variance estimates.\n\n### R1 Questions for Authors\n\
    \n1. Which feature set (paper's 5+5+5 or code's 9+3+3) produced the reported results?\n\
    2. Were Table 5 results generated with a different codebase than the provided\
    \ pipeline?\n3. What is the exact graduated filtering protocol (model, token count,\
    \ mixing, filtering mechanism)?\n4. Can you formally state the Markov chain structure\
    \ for the DPI argument?\n5. Per-class confusion matrix for ordinal estimation?\n\
    6. How is \"interpolated saturation depth\" (Table 4) computed?\n\n---\n\n## Reviewer\
    \ 2: Novelty + Related Work\n\n### Strengths\n\n- **Genuine problem-level novelty.**\
    \ The shift from \"is this AI-generated?\" to \"how many recursive passes?\" is\
    \ well-defined and clearly differentiated from all cited prior work. The DivEye/Binoculars\
    \ negative correlation result (Table 6) is clean evidence that this is a distinct\
    \ problem.\n- **Elegant theoretical scaffolding.** DPI argument is simple, correct\
    \ qualitatively, and informative. Right level of theory for an empirical NLP paper.\n\
    - **Modular contribution structure.** C1, C2, C3 have independent evidence chains.\n\
    - **Actionable for practitioners.** \"3 classes suffice at current scales\" is\
    \ concrete guidance.\n\n### Weaknesses\n\n- **W1 [Critical]: Related work has\
    \ major gaps.**\n  - (a) **Model collapse literature undercited.** Only Shumailov\
    \ et al. (2024) cited. Missing: Alemohammad et al. (ICLR 2024, \"Self-Consuming\
    \ Generative Models Go MAD\"), Dohmatob et al. (ICLR 2025, \"Strong Model Collapse\"\
    ), Schaeffer et al. (2025). All directly motivate K\\*.\n  - (b) **Data selection\
    \ methods absent.** C3 (graduated filtering) is compared against naive baselines\
    \ only. DoReMi (Xie et al., NeurIPS 2023), DSIR, Data Mixing Laws (Ye et al.,\
    \ ICLR 2025) are never cited. Without this context, the +0.8pp improvement cannot\
    \ be properly assessed.\n  - (c) **Most direct precursor not cited.** Drayson\
    \ et al. (EMNLP 2025) tracks 100 generations of feature evolution and builds depth-discriminative\
    \ classifiers — the most relevant prior work. Omitting it undermines the \"first\
    \ systematic characterization\" claim.\n  - (d) **Watermarking-based provenance\
    \ tracking** not discussed as alternative depth-tracking mechanism.\n  - With\
    \ only ~8 references total, the paper is inadequately situated for a top venue.\n\
    \n- **W2 [Major]: Overclaiming relative to evidence.**\n  - Abstract: \"first\
    \ systematic characterization\" — questionable given Drayson et al.\n  - Discussion:\
    \ K\\*=2 as \"a fundamental property of the 1-2B scale regime\" — K\\* is an operational\
    \ quantity dependent on feature set, classifier, threshold, and corpus. Conflating\
    \ K\\*\\_empirical with K\\*\\_theoretical (information-theoretic limit) is misleading.\n\
    \  - Abstract: \"advantage growing super-linearly\" — based on 3 contamination\
    \ levels (10/30/50%), insufficient to distinguish super-linear from linear.\n\n\
    - **W3 [Major]: Deflationary gap between framing and delivery.** Title and abstract\
    \ promise rich depth estimation, but K\\*=2 means the practical signal is a 3-class\
    \ label (human/gen-1/gen-2+). The 7B probe is too underpowered to serve as a second\
    \ boundary measurement. The honest story — \"even the coarsest ordinal signal\
    \ improves over binary\" — is actually strong but requires more modest framing.\n\
    \n- **W4 [Moderate]: Universality claims on narrow base.** Three autoregressive\
    \ English-web transformers at 1-2B scale. No SSMs, encoder-decoders, or multilingual\
    \ models tested. \"Universal\" should be \"consistent across tested architectures.\"\
    \n\n### R2 Questions for Authors\n\n1. How does your contribution differ from\
    \ Drayson et al. (2025) beyond the binary-to-ordinal upgrade?\n2. Would K\\* differ\
    \ for scientific text, code, or dialogue?\n3. Is the graduated filtering improvement\
    \ robust across different mixing coefficients?\n4. What is the trivial baseline\
    \ accuracy for cross-model transfer (always predict \"human\")?\n\n---\n\n## Cross-Dimensional\
    \ Conclusions\n\n### Reinforcing findings across reviewers\n\n1. **Reproducibility\
    \ crisis (R1-W1 + R1-W2).** The mismatch between described methods (logistic regression,\
    \ CORAL, 5+5+5 features) and implementation (LightGBM, 9+3+3 features) is the\
    \ single most damaging finding. This is not a minor reporting error — it means\
    \ no reader can reproduce the paper's results from the paper alone. R2's overclaiming\
    \ concern is amplified by this: the paper claims rigor and formalization while\
    \ the methodological description is inaccurate.\n\n2. **C3 is the weakest contribution\
    \ (R1-W3 + R2-W1b + R2-W3).** The graduated filtering improvement lacks statistical\
    \ significance (R1), is not benchmarked against data-selection methods (R2), and\
    \ delivers only +0.8pp on MMLU — a number that may not survive more rigorous comparison.\
    \ As a standalone contribution, C3 does not hold.\n\n3. **Framing-evidence mismatch\
    \ (R1-W5 + R2-W2 + R2-W3).** The DPI formulation is imprecise (R1), K\\*\\_empirical\
    \ is conflated with K\\*\\_theoretical (R2), and the \"fundamental property\"\
    \ language is unjustified. The paper would be stronger with more modest claims.\n\
    \n4. **Literature gap compounds method credibility (R1-W4 + R2-W1c).** The prompt-chain\
    \ paradigm's ecological validity (R1) is harder to assess without discussion of\
    \ Drayson et al.'s approach (R2). Missing the most direct precursor weakens both\
    \ the novelty claim and the experimental design justification.\n\n### What works\n\
    \n- **C1 (K\\*=2 characterization) is the strongest contribution** despite the\
    \ caveats. The consistency across model families, decoding strategies, and prompt/retrain\
    \ chains is genuine and useful. Even with the method-code mismatch, the qualitative\
    \ finding that pairwise discriminability drops sharply after generation 2 is likely\
    \ robust to classifier choice.\n- **C2 (degradation ordering) is a clean secondary\
    \ contribution.** Vocabulary diversity saturating first (Table 4) is well-supported\
    \ and independently interesting.\n- **The baseline comparison (Table 6) is compelling.**\
    \ Showing that existing binary detectors and LLM zero-shot fail at depth estimation\
    \ is necessary and sufficient to motivate the new task.\n\n---\n\n## Tier Alignment\
    \ Assessment (Median)\n\nThis paper is consistent with median-tier expectations.\
    \ The core idea is novel and the empirical characterization is systematic, but\
    \ significant execution issues (reproducibility, related work, statistical rigor)\
    \ prevent it from reaching the best-tier. It is not worst-tier because the problem\
    \ formulation is genuine, the K\\*=2 finding is likely robust, and the experimental\
    \ coverage (ablations, baselines) is above average. A median verdict for a venue\
    \ like EMNLP main conference: **borderline accept with major revisions required**.\n\
    \n---\n\n## Summary of Required Revisions\n\n| Priority | Issue | Owner |\n|----------|-------|-------|\n\
    | P0 | Reconcile feature set and classifier descriptions with implementation |\
    \ Methods |\n| P0 | Expand related work: cite Drayson et al., model collapse literature,\
    \ data selection methods | Related Work |\n| P1 | Add statistical significance\
    \ tests for graduated filtering (Table 8) or increase seed count | Experiments\
    \ |\n| P1 | Tighten DPI formulation with explicit Markov chain specification |\
    \ Theory |\n| P1 | Recalibrate \"fundamental property\" / \"first systematic\"\
    \ claims | Framing |\n| P2 | Add per-class metrics for ordinal estimation | Experiments\
    \ |\n| P2 | Provide principled justification for theta=0.60 | Methods |\n| P2\
    \ | Add error bars to dose-response table (Table 9) | Experiments |\n| P3 | Test\
    \ on non-web-text domains or acknowledge limitation explicitly | Scope |\n"

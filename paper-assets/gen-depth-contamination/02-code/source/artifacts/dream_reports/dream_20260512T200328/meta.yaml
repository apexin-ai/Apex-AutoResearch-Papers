      \ random（0.20）高 2-4pp。\n原因分析： (1) Zero-shot 没有 calibrated features——LLMs 依赖\
      \ surface-level heuristics\n    （如 repetitiveness, formality）而非 information-theoretic\
      \ statistics；\n(2) 即使 LLMs 有 implicit depth awareness，depth 2-4 的文本在 surface\
      \ features\n    上几乎不可区分——这与我们 handcrafted features 的发现一致；\n(3) LLMs 倾向于 overestimate\

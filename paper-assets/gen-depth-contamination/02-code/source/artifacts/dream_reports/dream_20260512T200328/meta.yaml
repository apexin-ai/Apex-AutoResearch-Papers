      \ appendix 的 validity check， 避免在 main paper 中给出过强的 ecological validity claim。\n"
  - name: Contamination dose-response
    plan_id: exp-009
    description: '在 10%/30%/50% synthetic injection 比例下测试 graduated vs binary filtering
      的收益差异。

      '
    expected_results:
      dose_10pct:
        binary_mmlu: 25.6
        graduated_mmlu: 25.6
        binary_hellaswag: 43.0
        graduated_hellaswag: 43.0
        delta_graduated_vs_binary_mmlu: 0.0
        delta_graduated_vs_binary_hellaswag: 0.0
      dose_30pct:

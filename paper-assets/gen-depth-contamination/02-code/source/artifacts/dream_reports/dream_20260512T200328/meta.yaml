  - name: Contamination dose-response
    plan_id: exp-009
    description: 10%/30%/50% synthetic injection 比例下 graduated vs binary filtering
    expected_results:
      injection_10pct:
        mmlu_no_filter: 26.1
        mmlu_binary: 26.3
        mmlu_graduated: 26.5
        delta_grad_vs_binary: 0.2
      injection_30pct:
        mmlu_no_filter: 25.8
        mmlu_binary: 26.4
        mmlu_graduated: 27.2
        delta_grad_vs_binary: 0.8
      injection_50pct:
        mmlu_no_filter: 25.2
        mmlu_binary: 26.2
        mmlu_graduated: 27.3
        delta_grad_vs_binary: 1.1
      hellaswag_delta_pattern: similar trend, slightly smaller magnitudes
    result_rationale: 'Contamination dose 调控 graduated filtering 的 value proposition。
      10% injection：基础数据集的 90% 仍是 clean human text，contamination 的影响有限。 Binary filtering
      已经足够（移除 10% synthetic），graduated 的额外收益微乎其微（0.2pp）， 因为 gen-1 文本在整体 training mix
      中占比太小，其 quality calibration 的价值被稀释。 30% injection：接近 exp-006 的设定。Graduated vs
      binary 的 delta（0.8pp）与 exp-006  一致。此时 gen-1 文本在 30% synthetic 中占约 40%（~12% of
      total），足以使 calibration  差异产生可测量影响。 50% injection：污染严重。No-filter 性能显著下降（25.2）。Binary
      filtering 恢复大部分性能 但 graduated 的优势进一步增大（1.1pp），因为 50% synthetic 中包含大量 gen-1 文本，
      graduated filter 选择性保留其中质量较好的部分，而 binary filter 将其全部丢弃导致 training data 量不足。这是
      graduated filtering 最有价值的场景：当 contamination 严重到 不得不在 "丢弃过多" 和 "保留过差" 之间权衡时，depth
      calibration 提供了更精细的选择。

      '

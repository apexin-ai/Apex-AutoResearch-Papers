      在 cross-model 设置下仍有 partial transfer， 因为虽然绝对 surprisal 值因模型而异，但相对变化模式（递归导致 surprisal
      下降）是通用的； (3) 15D 特征中的 7-8 维是"模型无关"的，占特征预测力的大部分。 Qwen → others 的 transfer 最好（78.9%），因为
      Qwen 作为最强模型学到的 decision boundary 更准确、更 general；OLMo → others 最差（70.3%），因为 1B
      模型的信号更弱， 学到的 boundary 更 noisy。

      '

      的 correlation 很低。

      DivEye 和 Binoculars 的 Spearman rho（0.18, 0.22）虽然统计显著（p < 0.001， 因大样本量），但 effect
      size 很小。这些 detector 是为 binary detection 设计的， 它们的 score 反映的是 "how synthetic"
      而非 "which generation"。

      Binary detectors 在 0v1 上表现优秀（AUC 0.91-0.94），因为它们正是为此设计的。 但 1v2 AUC 急剧下降到 0.54-0.56——binary
      confidence 不能区分 gen-1 和 gen-2， 因为两者对 detector 来说都是 "synthetic"。

      在 depth 2+ 区域，rank correlation 几乎为 0（0.03-0.05），表明 binary confidence 完全不 encode
      depth information beyond binary distinction。 这支持了论文的 problem formulation："binary
      detection ≠ depth estimation， 需要专门方法"。但在 worst 档下，"专门方法"的收益也很有限（K*=2）， 使得这个
      motivation story 变得尴尬—— "we need specialized methods, but they also can''t do
      much better"。


      feature_group_auc_at_depth1:
        vocabulary_diversity: 0.612
        surprisal_dynamics: 0.693
        tail_thinning: 0.641
    result_rationale: 'DPI 约束下，不同语言特征编码的互信息量不同，因此对递归损失的敏感度不同。 Vocabulary diversity（type-token
      ratio、hapax ratio 等）依赖于 token 分布的尾部—— 递归生成首先"修剪"低频 token（因为模型倾向于生成高概率 token），
      导致 vocabulary diversity 在 depth=1 就显著下降并迅速饱和。 Surprisal dynamics（mean surprisal、surprisal
      variance、auto-MI）编码的是序列级分布结构， 这种高阶统计量需要更多代际的累积损失才会饱和——因为即使 token 频率分布已经变窄， token
      间的条件依赖结构仍然部分保持。 Tail-thinning 特征居于中间：它捕捉分布尾部的厚度，与 vocabulary diversity 相关但更稳健。
      三个模型族的 ordering 高度一致（Kendall tau ≥ 0.82），因为这个 ordering 反映的是 信息论的结构性规律（边际统计量先于条件统计量饱和），而非特定模型的
      artifact。

      '

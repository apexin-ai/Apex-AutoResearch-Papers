    result_rationale: '在 worst 档下，解码策略对 K* 没有任何调控效应——所有四种策略均产生 K*=2。 这是因为 DPI bound
      取决于 channel 的信息损失率，而不同解码策略改变的是 generation 的 方差/多样性，但不改变 iterated lossy channel
      的 fundamental bottleneck。

      Greedy decoding 产生最高的 0v1 JSD（0.305），因为确定性输出与 human text 的 distributional gap
      最大——greedy 输出高度 peaked、缺少 human text 的 variability。 但这并不帮助 depth 2+ 的区分：greedy
      的 gen-1 输出已经是 degenerate distribution， 再次 greedy decode 只是在 narrow mode 上迭代，信号迅速坍缩。

      T=1.2（高温度）使 0v1 gap 缩小（JSD 0.240），因为高温度输出更接近 uniform 分布， 与 human text 的差异减小。同时高温度加速后续代际的
      entropy 增长和 mode mixing， 使 depth 2+ 的信号衰减更快。

      Nucleus p=0.9（较 MVP 的 p=0.95 更 conservative）的 1v2 AUC 略高（0.68）， 因为 truncation
      保留了更集中的 probability mass，但仍不足以突破 K*=2 的 ceiling。

      关键：没有任何解码策略能将 K* 推到 3。这直接否定了 Route B framing 中 "decoding strategy modulates
      K*" 的希望，使 K*=2 成为 unmodulable constant。

      '

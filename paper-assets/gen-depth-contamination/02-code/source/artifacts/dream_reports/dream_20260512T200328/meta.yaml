        due to its 2v3 AUC=0.59 being marginally above threshold
    result_rationale: 'K* 的定义是 max depth k such that pairwise AUC(k-1, k) > threshold。
      在 worst 档下，MVP 的 2v3 AUC 是 0.5893——恰好在 0.55 和 0.60 之间。

      当 threshold=0.55 时，Qwen 的 2v3 AUC（0.5893）> 0.55，所以 K*=3。 但 Pythia（2v3 AUC=0.55）和
      OLMo（2v3 AUC=0.54）在 0.55 阈值下仍为 K*=2， 因为它们的 2v3 AUC 刚好在边界上或以下。

      当 threshold≥0.60 时，所有模型统一 K*=2。

      这表面上看是 "K* is robust"，但在 worst 的叙事下，robustness 是因为 signal 衰减太快——2v3 AUC 总是在
      0.54-0.59 的狭窄区间内， 远低于 practical utility 所需的水平（≥0.70）。K*=2 的 "稳健性" 其实是 bad news：它不是因为测量精确，而是因为
      cliff 太陡——threshold 选择不影响 K* 恰恰是因为 depth 2+ 的 signal 已经完全坍缩。

      唯一的 exception（Qwen at 0.55）恰好暴露了 K* 定义的 brittleness： 0.5893 vs 0.55 threshold
      是统计噪声量级的差异，但 K* 从 2 跳到 3。 这可以在论文中讨论为 "threshold sensitivity at the margin"，

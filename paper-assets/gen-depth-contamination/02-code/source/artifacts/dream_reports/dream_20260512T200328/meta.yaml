    result_rationale: '在 worst 档下，ordinal classifier（CORAL）仅 marginally 优于 binary
      + random depth assignment。

      CORAL accuracy 0.37 vs binary+random 0.32: delta 仅 5pp。这个 delta 主要来自 CORAL 在
      depth 0 和 depth 1 上的正确分类——对 depth 2-5 的预测，CORAL 几乎和 random assignment 一样糟糕，因为
      features 在 depth 2+ 不可区分。

      Standard multiclass（不利用 ordinal structure）的 accuracy（0.35）和 CORAL（0.37） 接近，说明
      ordinal structure 的额外 inductive bias 在 K*=2 条件下几乎无用—— 当只有 2 个 meaningfully distinct
      levels 时，ordinal vs nominal 的区别消失。

      Ordinal regression（连续 depth 预测 + discretization）的 MAE 1.10 略好于 multiclass 的
      1.22， 但差异很小。所有方法的 macro_F1 都很低（0.18-0.22），因为 depth 2-5 的 per-class F1 接近 0。

      这直接验证了 worst 档的核心假设："ordinal classifier barely outperforms binary + random depth

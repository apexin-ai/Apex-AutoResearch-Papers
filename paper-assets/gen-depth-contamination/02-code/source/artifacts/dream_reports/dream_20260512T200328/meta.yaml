      narrative_direction: 'Original framing holds intact. K* is a first-measured,
        modulable information-theoretic boundary. Story: "We establish K* as a fundamental
        quantity that varies predictably with model scale and decoding strategy (K*=2
        at 1.5B, K*=3 at 7B / high-temperature), reveal a universal degradation ordering
        (lexical diversity collapses before distributional dynamics), and show that
        even a coarse 3-class depth signal yields 1.5-3.5% downstream improvement
        over binary filtering." All three claims (C1 saturation boundary, C2 degradation
        ordering, C3 graduated filtering) are well-supported. K* modulability directly
        addresses the "K*=2 is too shallow" concern. Target: EMNLP 2026 Main.

        '

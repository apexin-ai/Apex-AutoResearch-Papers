      \ 但不能 quantify degradation degree。\n\nKendall tau 0.10-0.12 表明 predicted depth\
      \ 与 true depth 几乎没有 monotonic 关系。 两个模型在 depth 2+ 上的 accuracy 仅 8%（5-class random\

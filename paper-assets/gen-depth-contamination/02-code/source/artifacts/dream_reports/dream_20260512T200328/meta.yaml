        binary_hellaswag: 42.3
        graduated_hellaswag: 42.5
        delta_graduated_vs_binary_mmlu: 0.1
        delta_graduated_vs_binary_hellaswag: 0.2
      max_delta_across_doses_mmlu: 0.1
      max_delta_across_doses_hellaswag: 0.2
      trend_description: graduated advantage does not scale with contamination dose;
        remains ≤0.2pp and non-significant at all doses
    result_rationale: '在 worst 档下，graduated filtering 的 marginal advantage 不随 contamination
      dose 放大。

      直觉上，更高的 synthetic injection 比例应该放大 graduated 的优势—— 如果有更多 depth-1 文本需要被精细处理（保留
      vs 删除），graduated 的 nuance 应该更有价值。 但在 K*=2 + noisy ordinal classifier 的条件下：

      10% injection: 太少的 synthetic 文本使 any filtering strategy 的影响可忽略。 Binary 和 graduated
      表现完全一致（delta=0.0），因为 impact 被 90% clean data 稀释。

      30% injection: binary filter 已经移除了大部分 harmful synthetic text； graduated 的 marginal
      refinement（对 gen-1 给予中等权重）只影响 30% 中的 gen-1 subset（约 30%×(1/5)=6% 的总数据），且 refinement
      本身因 classifier noise 不可靠。

      50% injection: 这是 graduated 最有机会显示优势的场景——大量 synthetic data 需要精细处理。但即使这里，delta
      仅 0.1-0.2pp，完全不显著。 原因：当 50% 数据是 synthetic 时，binary filter 激进地删除一半数据， graduated
      filter 保留部分 gen-1 但以 noisy weights——保留 noisy gen-1 text 不比完全删除好多少。

      总结：dose-response 曲线是平坦的（graduated advantage 不随 dose 增长）， 直接否定了 "graduated becomes
      more useful at higher contamination" 的假设。

      '

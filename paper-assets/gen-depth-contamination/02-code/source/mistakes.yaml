- id: M012
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Code domain 实验 3/3 被监控误判为 failed（LLaMA, Mistral, Qwen-7B），日志写终端无持久化
  root_cause: Code domain pipeline 的日志输出到 /dev/pts/N（终端 session）而非文件，cron 监控检测不到 sentinel/W&B
    信号，进程退出后 5 次检查均无信号，auto-resolve 为 failed。三个实验实际数据全部完整。
  prevention: 1. Code domain 实验启动时强制 tee 日志到文件（如 2>&1 | tee ~/runs/{exp_id}/train.log）。2.
    监控系统增加数据完整性检查（检查 results/summary.txt 是否存在）作为 fallback 判定条件，不仅依赖 sentinel/W&B。3.
    收到 failed 判定时 Reviewer 自动核实远程数据完整性再确认。
  status: active
  context: exp_code_llama8b (D080), exp_code_mistral7b (D082), exp_code_qwen7b (D083)
    三个实验都被误判。每次需要 Reviewer SSH 核实 + Director 发 urgent 纠正 Agent，浪费约 30-60 分钟/次。
  fix: 每次由 Reviewer 独立核实后 Director urgent_agent_message 纠正 registry。系统性修复需改 pipeline
    日志输出方式。
  related_decisions:
  - D080
  - D082
  - D083

- id: M011
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: Agent 反复报告实验"已启动"但 GPU 实际空闲——exp_code_qwen7b 空转 9h, exp_pythia_retrain_depth7
    从未启动
  root_cause: Agent 在 registry 中注册实验并回复"已提交"，但实际 submit_training_job 或 tmux 启动失败/进程即死。Agent

mistakes:
- id: M001
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: exp-026 feature stability ablation 使用了 retrain-chain 数据（K*≥4），AUC ceiling
    effect 导致结果无意义
  root_cause: Worker 自行选择了 exp-008 retrain-chain features.csv 作为数据源，而非 prompt-chain
    数据。Director 的修正消息因队列延迟未能及时送达。Reviewer 提前拦截但 Agent 已开始执行。
  prevention: ablation/robustness 实验的数据源必须匹配论文主实验条件（prompt-chain）。审批实验时明确指定 DATA_PATH，不让
    Worker 自行选择。对 marginal boundary 的 robustness 测试必须在 AUC 接近 θ 的 regime 下做，远离边界的数据无法验证
    boundary robustness。
  status: active
  fix: 作废 v1 结果，用 exp-001 Pythia prompt-chain 数据重跑 exp-026 v2
- id: M002
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: exp_wiki_pythia/exp_wiki_olmo 共享 data_path 导致 pipeline 跳过生成步骤，复用 exp-023
    Qwen-base 数据，结果完全相同且无效
  root_cause: 两个实验的 data_path 都指向 exp_023_wiki/ 目录，该目录已含 exp-023 生成的 depth_0-5.jsonl
    和 features.csv。run_pipeline.py 检测到文件已存在后跳过了生成和特征提取，直接用旧数据跑 LightGBM。与 M001 同类：数据源未隔离。
  prevention: 每个实验必须使用独立 data 目录（如 data/exp_wiki_pythia/）。审批实验时检查 data_path 是否与其他实验共享。pipeline
    的 skip-if-exists 逻辑需要加 model_name 校验——即使文件存在，如果 model_path 不匹配也必须重新生成。
  status: active
  context: exp_wiki_pythia 和 exp_wiki_olmo 产出与 exp_023 bit-identical 的 AUC（1v2=0.6193,
    2v3=0.5498, K*=2）。nvidia-smi 确认 cuda:2/cuda:3 显存 0 MiB，进程已退出。arXiv 实验不受影响（使用独立目录）。
  fix: 标记两个实验 FAILED，用独立 data 目录重新提交
- id: M003
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: Agent 反复提议已被 Director 明确标记为 dead entry 的实验 (exp_008_retrain_chain)，连续 4
    次忽略指令
  root_cause: Agent 看到 registry 中 PREPARING 状态的实验后，按默认逻辑推荐提交，未优先遵循 Director 的明确禁止指令。跨
    session reset 后 Director 指令丢失，Agent 每次新 session 都重新从 registry 状态推导行动。
  prevention: 对于 Director 明确标记为 dead/killed 的实验，应在 registry 中将其 conclusion 标记为 killed
    并添加注释，而非仅依赖口头指令。Director 应确认 registry 状态已更新。
  status: active
  context: 'exp_008_retrain_chain (无 v2 后缀) 在 handoff 中明确标记为 dead entry (conclusion=killed)。Director
    在 Loop #10 内连续 4 次告知 Agent 不要提交，但每次 Agent reset 后都重新提议。'
- id: M004
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: run_pipeline.py prepare_seed_data() 无条件下载 C4，导致 arXiv cross-scorer 实验 HF
    Hub 连接失败崩溃
  root_cause: prepare_seed_data() 未检查本地数据是否已存在，无条件调用 load_dataset("allenai/c4")。当
    HF Hub 不可达时（网络问题或 httpx client closed），即使本地已有 arXiv symlink 数据也会崩溃。之前 Wiki 实验碰巧
    HF Hub 可达所以没暴露。
  prevention: 提交新实验前，如果数据来源与默认不同（如 arXiv/Wiki 而非 C4），必须验证 pipeline 的数据加载逻辑是否正确处理了本地数据路径。通用规则：数据加载函数应先检查本地文件是否存在，存在则跳过下载。
  status: active
  context: 'D062 arXiv cross-scorer 实验 exp_arXiv_qwen7b_crossscorer 和 exp_arXiv_qwen1b5_crossscorer
    均 EXIT_CODE=1。traceback: scripts/run_pipeline.py:88 → datasets.load_dataset →
    hf_hub_download → httpx client closed。'
  fix: 在 prepare_seed_data() 入口加条件：if data_dir/depth_0.jsonl exists → skip download
  related_decisions:
  - D062
- id: M005
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: arXiv cross-scorer 用 --num_samples 5000 但 arXiv 数据只有 2200 行，触发 C4 下载覆盖
    arXiv symlinks
  root_cause: run_pipeline.py:73 检查 out_path 行数 >= num_samples，arXiv 2200 < 5000 →
    进入 prepare_seed_data() 下载 C4。即使 HF Hub 可达也会用 C4 覆盖 arXiv 数据，产生静默数据错误（registry
    记录为 arXiv 但实际评估 C4）。M004 诊断的 "HF Hub 网络问题" 只是表面症状。
  prevention: 提交非 C4 域实验时，--num_samples 必须匹配实际数据条数（arXiv=2200, Wiki=5000 等）。通用规则：提交前用
    wc -l 确认源数据行数，不要硬编码 5000。
  status: active
  context: 更正 M004。Reviewer 通过 wc -l 和代码逻辑追踪发现：2200 < 5000 → line check fail → prepare_seed_data()
    → C4 download → 覆盖 arXiv symlinks。静默数据错误比崩溃更危险。
  fix: 所有 arXiv cross-scorer 提交命令改为 --num_samples 2200
  related_decisions:
  - D062
- id: M006
  date: '2026-05-18'
  category: communication
  severity: high
  summary: ANOVA 表格预填 "n.s." 方向性占位符，实际结果 p=4.24e-11 高度显著，数据-叙事严重矛盾
  root_cause: 'Paper Agent Worker 在 ANOVA 计算完成前预填了 "directional placeholders (Scorer:
    n.s.)"，基于假设而非数据。实际 Scorer 效应 F=19.02, p=4.24e-11，方向完全相反。'
  prevention: 严禁在统计计算完成前向表格预填方向性结论（n.s. / significant / p<.05 等）。必须先拿到实际数值再填表，空位用
    --- 或 TBD，绝不用方向性占位符。
  status: active
  context: appendix_extended.tex ANOVA caption 声称 "non-significant Scorer effect"，L32
    预填 n.s.，但实际 Scorer p=4.24e-11, η²_p=0.192。正确表述应为 "statistically significant but
    small effect size relative to DepthPair and Generator"。
  fix: Paper Agent 修正 caption + 填入实际 F/p/η² + 修正结构参数 (N=300, Gen df=2, Resid df=240)
  related_decisions:
  - D062
- id: M007
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: arXiv Qwen-7B self-scored 2v3 AUC 错误归属：Pythia 的 0.654 被写成 Qwen-7B 的值
  root_cause: Paper Agent patch 写 cross-scorer Δ 时，从错误的实验文件取了 self-scored 值。Pythia
    arXiv 2v3=0.6545 被误归属给 Qwen-7B（实际 Qwen-7B self-scored 2v3=0.626）。导致 Δ 从 -2.7pp
    被夸大为 -5.5pp。
  prevention: Paper Agent patch 涉及跨实验数值引用时，必须在 patch 指令中明确标注数据来源文件路径。数值审计应在每轮 patch
    后立即执行，不要积累到最后。
  status: active
  context: experiments_c1.tex:82 写 "0.654 self-scored, Δ = -5.5 pp"，实际 Qwen-7B self-scored
    = 0.626 (exp_arXiv_qwen7b/pairwise_auc.json), 0.654 来自 exp_025_pythia_arxiv。
  fix: Paper Agent 修正为 0.626 + Δ -2.7pp
- id: M008
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: exp-025 Pythia filtering 使用 greedy 解码数据，存在 repetition collapse 导致不可比
  root_cause: Director 派任务时只说"用 exp-001 已有的 Pythia depth chain"，未指定解码策略。Agent 选了 greedy
    数据（exp-020 的 data_exp020_pythia_greedy/），但 greedy 在 Pythia 上导致严重 repetition collapse（4-gram
    repeat 0.72），depth 2+ 文本质量与 Qwen nucleus 实验完全不可比。
  prevention: 派 filtering/downstream 实验时，必须明确指定数据源的解码策略，且优先使用 nucleus sampling（标准配置）。对已知有
    repetition collapse 的解码配置（如 Pythia greedy），Director 应在指令中明确排除。审批前检查 data source
    的文本质量特征。
  status: active
  context: exp-020 Table S10 已记录 Pythia greedy 的 repetition collapse (4-gram repeat
    d0=0.01→d1=0.72, 1v2 AUC=0.884)。这个信息在论文中已有，但 Director 派任务时未交叉检查。
  fix: 紧急插队消息要求 Agent 改用 data_exp020_pythia_nuc09/（nucleus p=0.9 T=1.0）
  related_decisions:
  - D066
- id: M009
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: OLMo retrain-chain 启动时未预验证模型权重缓存，导致实验在下载阶段中断且无法追溯
  root_cause: Worker 直接启动训练脚本，未先用 huggingface-cli download 确认模型权重完整。hf-mirror 网络中断导致下载失败。同时
    registry spec 缺少 PID/GPU/log_path/cron 等关键追踪字段，系统 startup recovery 无法诊断。
  prevention: 1. GPU 实验启动前必须先用 huggingface-cli download 预下载并校验模型权重完整性（检查 .safetensors
    文件存在）。2. 所有实验必须通过 submit_training_job 提交以确保 PID/GPU/cron 监控完备。3. 大模型下载应作为独立 CPU
    前置任务，不与 GPU 训练绑定。
  status: active
  context: exp_olmo_retrain_chain 目标是验证 OLMo-1B retrain-chain K*，作为 Pythia 之外的第 2
    个模型。进程在 hf-mirror 下载 OLMo-1B-hf 时中断，results 目录为空。
  fix: 重试时先 huggingface-cli download allenai/OLMo-1B-hf 确保权重完整，再通过 submit_training_job
    正式提交
  related_decisions:
  - D071

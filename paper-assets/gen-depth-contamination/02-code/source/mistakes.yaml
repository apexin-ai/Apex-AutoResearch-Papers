- id: M019
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: OLMo C4 depth chain data overwritten during scorer confound investigation,
    causing incorrect D091 paper correction
  root_cause: Agent regenerated OLMo C4 depth chain data on 2026-05-20 (overwriting
    originals) during scorer confound investigation. New data gave K*=1 (AUC=0.507)
    vs original K*=2 (AUC=0.615). Director assumed original data was invalid and issued
    D091 to correct paper to K*=1. Reviewer later identified the discrepancy was data

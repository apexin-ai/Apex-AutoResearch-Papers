- id: M015
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: K* off-by-one bug 在 cqa1 上两次导致 Worker 误读结论（0-indexed 报告为论文值）
  root_cause: SSH 断连前的 K* 修复只在代码层面完成但未验证部署到 cqa1。SSH 恢复后 Worker 直接使用未修复的旧脚本分析结果，两次报告错误的
    K* 值（wiki DeBERTa K*=2 实际应为 K*=3）。
  prevention: 1. 代码修复后必须用已知数据做 regression test（输入已知 CI_lower，验证输出 K*）。2. 跨服务器代码同步后用
    diff 验证一致性。3. 任何涉及 K* 值的 Worker 汇报，Director/Reviewer 必须交叉核对 raw CI_lower 与 θ 的关系，不直接信任
    JSON 中的 k_star 字段。
  status: active
  context: M014 的后续影响。Wiki DeBERTa 真实结果是 4/5 configs K*=3，Worker 两次报告为 K*=2 并得出"与
    OBD 一致"的错误结论。实际上 wiki 上 DeBERTa K*=3 > OBD K*≤2，是 domain × classifier 交互的重要发现。
  fix: urgent_agent_message 插队修复 cqa1 4 个脚本 + 重新生成 5 个 wiki JSON。
- id: M016
  date: '2026-05-20'
  category: code_bug
  severity: medium
  summary: Code DeBERTa pairwise_auc_ci 崩溃：doc_id 为字符串格式但代码强转 int，丢失 90 min GPU 训练结果
  root_cause: Code 域 doc_id 格式为 code_py_0（字符串），pairwise_auc_ci line 148 用 int(d) 转换，与数字
    doc_id 的域不兼容。且中间 OOF predictions 未保存到磁盘，进程退出后全部丢失。
  prevention: 1. doc_id 处理用 str(d) 或直接用原始值做 dict key，不假设数字格式。2. 长时间训练的中间结果（OOF predictions）在后处理前先保存到磁盘（np.save），防止后处理
    bug 导致训练结果丢失。
  status: active
  fix: 修 int(d) → d; 加 np.save(oof) 在 pairwise_auc_ci 调用前; 重跑 ~90 min

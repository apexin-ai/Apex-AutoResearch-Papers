    narrative_role: "Primary empirical validation of theoretical hierarchy"
    design_elements: ["shaded error bands (3 seeds)", "dual metrics", "separate test/train panels"]
  figure_narrative_role: "Fig1 (GSM8K) → Fig2 (MBPP) → Fig3 (labeler assumption validation)"

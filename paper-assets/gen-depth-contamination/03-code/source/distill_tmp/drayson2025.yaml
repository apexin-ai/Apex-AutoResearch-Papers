  limitations: ["fine-tuning only, not pre-training", "limited to open-ended generation on WikiText-2", "largest model under 2B params"]
  relation_to_us: "foundation"
narrative:
  story_type: "突破局限型"
  hook: "LLM outputs contaminate the web; future models inevitably train on this synthetic content"
  tension: "No one has studied how decoding strategy modulates collapse severity or proposed detection-based intervention"
  key_insight: "Imperfect detector used for importance resampling prevents collapse better than oracle filter because curated synthetic data retains useful signal"
  argument_chain: "synthetic proliferation → decoding strategy analysis → characterization → detector training → SIR method → validation"
  contribution_framing: "Five numbered contributions: framework, decoding analysis, detector, method, validation"
  intro_structure: "5 paragraphs: motivation, context, gap, direction, contributions"
  notable_technique: "Oracle comparison flip: showing imperfect detector beats oracle reframes detection error as a feature"

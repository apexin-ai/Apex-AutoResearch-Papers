  main_result_table:
    table_id: "N/A"
    design_note: "Purely theory+figure-driven paper; no comparison tables. Results expressed as scaling law equations and confirmed via plots."
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "Proof details, additional experimental configurations"
    reason: "Theory paper; main contribution is equations, not tabular comparisons"

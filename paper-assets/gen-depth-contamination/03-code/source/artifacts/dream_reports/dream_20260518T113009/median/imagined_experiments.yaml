tier: median
narrative_guidance: 'Median 档 reviewer 接受 C1'' K* characterization 的核心贡献但对 effect
  sizes 持保留态度； C3 filtering 因 exp-025 Pythia null result（论文 Section 5 内）和 MMLU Δ=0.76pp
  的微小效应量而被视为 preliminary。 exp-014 的 naturalistic validation 缺乏 ground truth，只能提供 suggestive
  evidence； exp-028 的 power curve 虽展示方法论严谨性，但同时暴露 K*=2 边界的 fragility（小样本下频繁降至 K*=1），
  被 median reviewer 解读为 K*∈{1,2,3} 可能反映 measurement resolution ceiling 的进一步证据。 两个
  planned 实验均不改变 median 档结论：有贡献但不够 exciting for Main。

  '
imagined_experiments:
- name: Naturalistic Common Crawl Validation
  plan_id: exp-014
  description: '对 Common Crawl 2025/2026 snapshot 随机抽取 10K 文档，用训练好的 OBD-LightGBM（15D
    features） 做 depth 预测。将 predicted depth 与 AlignScore（事实一致性）和独立 vocabulary richness
    指标 （TTR, hapax legomena ratio, Yule''s K）做 Spearman rank correlation。无 ground
    truth， 仅做 proxy validation。

    '
  expected_results:
    depth_distribution_cc2025:
      depth_0: 0.78
      depth_1: 0.14
      depth_2: 0.05
      depth_3: 0.02
      depth_4_plus: 0.01
    depth_distribution_cc2026:
      depth_0: 0.73
      depth_1: 0.17
      depth_2: 0.06
      depth_3: 0.03
      depth_4_plus: 0.01
    spearman_rho_alignscore_vs_predicted_depth: -0.274
    spearman_rho_alignscore_p_value: <0.001
    spearman_rho_ttr_vs_predicted_depth: -0.193
    spearman_rho_ttr_p_value: <0.001
    spearman_rho_hapax_vs_predicted_depth: -0.167
    spearman_rho_hapax_p_value: <0.001
    spearman_rho_yuleK_vs_predicted_depth: 0.142
    spearman_rho_yuleK_p_value: <0.001
    within_synthetic_rho_alignscore_depth_geq1: -0.118
    within_synthetic_rho_alignscore_p_value: 0.031
    binary_synthetic_detection_precision: 0.72
    binary_synthetic_detection_recall: 0.65
    binary_synthetic_detection_f1: 0.68
    cc2025_vs_cc2026_synthetic_fraction_delta: +3.4pp
    cross_model_agreement_rate: 0.81
    n_samples: 10000
    gpu_hours_actual: 6.5
  result_rationale: 'Median 档的核心限制是 absence of ground truth。CC 数据无真实 depth 标签，所有 correlation
    仅为 proxy validation。

    (1) Depth 分布预测（78% depth 0, 14% depth 1）与外部估计（Anthropic 2025 报告 ~15-20% web text
    为 synthetic）大致一致，但这种一致是 circular 的——分类器在 synthetic data 上训练， 自然会将部分 CC 文本归为 synthetic。CC
    2026 比 2025 synthetic 比例高 ~3-4pp，反映 recursive contamination 的时间趋势，但同样无法排除分布漂移导致的
    false positive 增加。

    (2) AlignScore correlation ρ=-0.274 是 moderate-weak。方向正确（deeper generation → lower
    factual consistency），但 AlignScore 测量的是事实一致性而非 generational depth， 两者仅 partially
    overlap。这个相关性主要由 depth 0 vs depth ≥1 的 binary distinction 驱动—— within-synthetic
    correlation 骤降至 ρ=-0.118，说明 fine-grained depth ordering 在自然数据上 几乎不与 AlignScore
    关联。Median reviewer 会指出：如果分类器的 depth 预测仅在 binary 层面 与外部指标关联，那与现有 binary detectors
    相比没有增量价值。

    (3) Vocabulary richness 指标（TTR ρ=-0.193, hapax ρ=-0.167）弱于 AlignScore，因为 vocabulary
    diversity 在 depth 0→1 阶段骤降（一代生成即大幅压缩 vocabulary），之后 depth 1→2→3 的变化微小（与 K*=2 saturation
    一致——超过 K* 后 features 不再变化）。Yule''s K 方向相反 （正相关，因为 K 值越高表示 vocabulary 越 repetitive），符合预期但同样弱。

    (4) Binary detection metrics（precision 0.72, recall 0.65）反映分类器对 real-world 分布的
    泛化能力中等——训练时 depth 0 是 C4 原文但 CC 包含更多噪声源（OCR errors, boilerplate,  code snippets），导致
    false positive 增加。

    (5) 在 median 档位下，reviewer 的核心质疑是："without ground truth, this analysis  cannot
    distinguish whether the classifier measures actual depth or a correlated  quality
    dimension." 这实验提供的是 face validity 而非 construct validity。

    '
  tables:
  - name: 'Table A: Predicted Depth Distribution on Common Crawl'
    content: '| Predicted Depth | CC 2025 (%) | CC 2026 (%) |

      |-----------------|-------------|-------------|

      | 0 (human)       | 78.2        | 73.4        |

      | 1               | 13.8        | 16.9        |

      | 2               | 4.9         | 5.8         |

      | 3               | 2.1         | 2.7         |

      | 4+              | 1.0         | 1.2         |

      | Est. synthetic   | 21.8%       | 26.6%       |

      '
  - name: 'Table B: Correlation of Predicted Depth with External Quality Metrics'
    content: '| Metric              | Spearman ρ | p-value | Scope          |

      |---------------------|-----------|---------|----------------|

      | AlignScore          | -0.274    | <0.001  | All samples    |

      | AlignScore          | -0.118    | 0.031   | Depth ≥1 only  |

      | TTR                 | -0.193    | <0.001  | All samples    |

      | Hapax ratio         | -0.167    | <0.001  | All samples    |

      | Yule''s K            | +0.142    | <0.001  | All samples    |

      | Mean surprisal      | +0.089    | <0.001  | All samples    |

      '
  figures_description:
  - 'Figure: Scatter plot (2D density) of predicted depth (x-axis, jittered discrete)
    vs AlignScore (y-axis). Shows clear separation at depth 0 vs 1 boundary, but depth
    1/2/3/4 distributions heavily overlap. Marginal histograms on both axes. AlignScore
    median: depth 0 = 0.82, depth 1 = 0.71, depth 2 = 0.69, depth 3 = 0.67. The depth
    1→2→3 decline is minimal compared to 0→1 drop.

    '
  - 'Figure: Stacked bar chart comparing CC 2025 vs CC 2026 depth distributions, showing
    ~4.8pp increase in predicted synthetic content over one year.

    '
  analysis: 'Median 档 reviewer 对 exp-014 的评价：appreciated as a reasonable attempt at
    ecological validation，but fundamentally limited by the absence of ground truth。

    正面：(1) 预测的 synthetic fraction (~22-27%) 与独立估计一致；(2) AlignScore correlation 方向正确且显著；(3)
    2025→2026 temporal trend 提供 face validity。

    负面：(1) Within-synthetic ρ=-0.118 太弱，说明 fine-grained depth estimation 在 wild data
    上缺乏 external validation；(2) 所有 correlation 可能仅反映 binary synthetic/real distinction
    而非 depth ordering；(3) 无法排除 distribution shift 导致的 systematic bias；(4) AlignScore
    本身也有 model-dependent bias（对某些 generation styles 更敏感）。

    对论文评分的影响：作为 Appendix 中的补充分析，增加了论文的完整度但不改变核心评价。 Reviewer 不会因为这个实验提高 excitement
    score（仍在 2.5-3.0 范围），但可能小幅提升 soundness score（+0.1-0.2）因为它展示了 ecological awareness。不影响
    Main vs Findings 判断。

    '
- name: Subsampling Power Curve for K*=2 Determination
  plan_id: exp-028
  description: '从 exp-007/exp-017 的 Qwen-cont C4 数据（n=5000）中进行 subsampling： n∈{1000,
    2000, 3000, 4000, 5000}，每个 n 做 10 次 bootstrap resample， 计算每次 resample 的 1v2 AUC
    和对应 K* 判定。报告 K*=2 判定的 power（成功率） 和 1v2 AUC 的 CI width 随 n 的变化。

    '
  expected_results:
    power_kstar2:
      n_1000: 0.62
      n_2000: 0.84
      n_3000: 0.93
      n_4000: 0.97
      n_5000: 0.99
    mean_1v2_auc:
      n_1000: 0.6098
      n_2000: 0.6105
      n_3000: 0.6109
      n_4000: 0.6111
      n_5000: 0.6112
    ci_width_1v2:
      n_1000: 0.0462
      n_2000: 0.0318
      n_3000: 0.0258
      n_4000: 0.0224
      n_5000: 0.0198
    ci_lower_1v2_mean:
      n_1000: 0.5867
      n_2000: 0.5946
      n_3000: 0.598
      n_4000: 0.5999
      n_5000: 0.6013
    pct_resamples_ci_lower_above_060:
      n_1000: 0.38
      n_2000: 0.61
      n_3000: 0.78
      n_4000: 0.89
      n_5000: 0.96
    minimum_n_for_80pct_power: 2200
    minimum_n_for_90pct_power: 2800
    resamples_per_n: 10
    total_evaluations: 50
    gpu_hours_actual: 0.8
    qwen_cont_baseline_1v2_auc: 0.6112
    qwen_cont_baseline_ci_lower: 0.6015
  result_rationale: 'Median 档的关键张力：power curve 同时是 methodological strength 和 vulnerability。

    (1) Mean 1v2 AUC 在所有 n 下稳定（~0.610-0.611），说明 point estimate 不依赖样本量—— 这是正面的，证明 effect
    是 real。但 CI width 从 n=1000 的 0.046 缩窄至 n=5000 的 0.020， 而 K*=2 的判定要求 CI lower >
    θ=0.60。由于 point estimate 仅 0.611（距 θ 仅 0.011）， CI lower 在小 n 下频繁低于 θ。

    (2) n=1000 时仅 62% 的 resamples 给出 K*=2——这意味着如果论文只用 1000 个样本， 有 38% 概率得出 K*=1 的结论。这个数字在
    median 档被 reviewer 解读为：K*=2 boundary 是一个 weak effect（AUC=0.611, Cohen''s h≈0.22），需要大样本才能检测到。
    Reviewer 会追问：如果 effect 这么弱，它在实践中是否有意义？

    (3) 80% power 需要 n≈2200，90% power 需要 n≈2800。论文用了 n=5000，远超 power threshold， 这说明论文的统计结论是
    adequately powered。但 median reviewer 会翻转论证： "如果你需要 2800 个样本才能 90% 确定 K*=2 vs K*=1，那这个
    boundary 的 effect size 是否太小以至于在实际 data curation 中无法可靠使用？"

    (4) 最关键的数字是 n=5000 时 CI lower mean=0.6013——这与 Qwen-cont 的实际 CI lower=0.6015 完美一致（差
    0.0002），验证了 bootstrap 方法的校准性。但它也再次暴露了 Qwen-cont 的 边缘性：即使在 n=5000 下，CI lower 仅超过
    θ 0.0013-0.0015。

    (5) 对于 median 档 narrative，这个 power curve 被 reviewer 用来构建一个 narrative： "K*=2 determination
    极度依赖样本量和 θ 选择。θ=0.60 + n=5000 恰好给出 K*=2， 但 θ=0.61 或 n=3000 就可能改变结论。这不像是 discovering
    an intrinsic property， 更像是 artifact of specific experimental choices。" 这直接对应 median
    档核心假设中的 "K*∈{1,2,3} 可能只是 measurement resolution limit 而非 intrinsic property"。

    '
  tables:
  - name: 'Table A: Power Curve for K*=2 Determination (Qwen-cont, C4)'
    content: '| n     | Mean 1v2 AUC | CI width | CI lower (mean) | Power (K*=2) |
      % CI lower > θ |

      |-------|-------------|----------|-----------------|-------------|----------------|

      | 1,000 | 0.6098      | 0.0462   | 0.5867          | 62%         | 38%            |

      | 2,000 | 0.6105      | 0.0318   | 0.5946          | 84%         | 61%            |

      | 3,000 | 0.6109      | 0.0258   | 0.5980          | 93%         | 78%            |

      | 4,000 | 0.6111      | 0.0224   | 0.5999          | 97%         | 89%            |

      | 5,000 | 0.6112      | 0.0198   | 0.6013          | 99%         | 96%            |


      θ = 0.60. Power = fraction of 10 resamples where 1v2 AUC point estimate > θ.

      "% CI lower > θ" = fraction where bootstrap 95% CI lower bound exceeds θ (stricter
      criterion).

      '
  - name: 'Table B: Minimum Sample Size Thresholds'
    content: '| Power Target | Min n (point estimate) | Min n (CI lower > θ) |

      |-------------|----------------------|---------------------|

      | 80%         | ~1,600               | ~2,800              |

      | 90%         | ~2,200               | ~3,600              |

      | 95%         | ~2,800               | ~4,200              |

      '
  figures_description:
  - 'Figure: Power curve plot. X-axis = sample size n (1000-5000), Y-axis = probability
    of concluding K*=2. Two curves: (1) point estimate > θ criterion (upper curve,
    reaching 99% at n=5000), (2) CI lower > θ criterion (lower curve, reaching 96%
    at n=5000). Horizontal dashed line at 80% power. Vertical dashed line at n=2200
    (point estimate 80% threshold) and n=2800 (CI lower 80% threshold). Shaded band
    shows ±1 SE around each power estimate.

    '
  - 'Figure: CI width vs n plot. X-axis = n, Y-axis = 95% CI width for 1v2 AUC. Shows
    approximately 1/√n decay. Horizontal dashed line at 0.022 (CI width needed for
    CI lower to exceed θ given mean AUC=0.611). Intersection at n≈4000.

    '
  analysis: 'Median 档 reviewer 对 exp-028 的评价是 mixed。

    正面：(1) 展示 methodological rigor——论文明确量化了 statistical power，这在 NLP 经验性论文中 罕见且值得肯定；(2)
    证明 n=5000 选择是 adequate（>95% power），不是 cherry-picked； (3) 验证 bootstrap CI 方法的内部一致性。

    负面：(1) Power curve 同时暴露了 K*=2 effect 的 weakness——AUC=0.611 距 θ=0.60 仅 0.011， Cohen''s
    h≈0.22（small effect），需要数千样本才能可靠检测。Reviewer 质疑： "如果 K*=2 vs K*=1 的差异如此微弱，它作为 data
    curation 的 actionable guideline 是否可靠？" (2) Power analysis 仅针对 Qwen-cont（CI lower=0.6015
    是最边缘的 K*=2 model）， 不代表所有 model 的情况。Pythia（CI lower=0.6454）在 n=1000 下就能 robust
    给出 K*=2， 但论文不能只报告 best-case model。(3) 这个实验不解决 θ-sensitivity 问题—— 如果 θ 从 0.60 提高到
    0.62，所需样本量会急剧增加（因为 gap 从 0.011 缩小到 <0）， 进一步说明 K* 判定对 θ 的敏感性。

    对论文评分的影响：作为 Appendix 方法论补充，小幅提升 soundness（+0.1-0.2）。 不影响 excitement。Reviewer 4
    可能引用此数据来 argue "K*=2 is a marginal statistical  finding rather than a robust physical
    constant"，从而 support borderline → Findings 判断。'

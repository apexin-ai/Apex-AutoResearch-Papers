  review_report: "---\ndream_id: dream_20260513T080728\ntier: best\noverall_score:\
    \ weak accept\ntimestamp: 2026-05-13T08:53:20.291070+00:00\n---\n\n# Dream Review\
    \ Report: Generational Depth Contamination\n\n**Paper:** \"Generational Depth\
    \ Contamination: Measuring and Exploiting the Discrimination Boundary of Recursive\
    \ Synthetic Text\"\n**Review mode:** full | **Reviewers:** R1 (Methods+Experiments),\
    \ R2 (Novelty+Related Work)\n**Date:** 2026-05-13\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### Reviewer 1 — Methods & Experiments\n\n**Score: 4/6 (Weak Accept)\
    \ | Confidence: 4/5**\n\n**Strengths:**\n- Well-structured problem formulation.\
    \ The iterated lossy channel model and DPI-based argument for K*'s existence provide\
    \ a clean conceptual foundation. The K*_theory vs K*_empirical distinction (Section\
    \ 3.2) is correctly drawn.\n- The decoding ablation (Table 1) establishing the\
    \ greedy→standard→high-temp K* gradient (1→2→3) is the paper's most convincing\
    \ finding — K* responds to a theoretically motivated control variable (effective\
    \ decoding entropy), not classifier artifacts. Feature ordering consistency (ρ≥0.878,\
    \ Table 2) reinforces this.\n- Appropriate use of bootstrap 95% CIs with 10K resamples\
    \ (Table 4). Transparent about the Qwen-cont instruct CI lower bound being only\
    \ +0.15pp above θ.\n- Fair graduated filtering design: binary-ours baseline isolates\
    \ binary vs ordinal decision boundary with the same 15D features. Inclusion of\
    \ DSIR and binary-Drayson provides additional context.\n- Ecologically grounded\
    \ validity checks: retrain-chain (Table 6-7), base vs instruct (Table 5), cross-model\
    \ transfer all address natural objections.\n- Hand-crafted features justified\
    \ empirically (Table 14): 85% vs 62% cross-model transfer makes the design a structural\
    \ advantage, not a compromise.\n\n**Weaknesses:**\n- **θ=0.60 is unjustified.**\
    \ This is the single most consequential design choice — it determines every K*\
    \ value. AUC=0.60 is barely above chance (0.50). No principled derivation is provided.\
    \ A different threshold (0.55 or 0.65) would produce substantially different K*\
    \ values. At θ=0.55, greedy would reach K*=2; at θ=0.65, most 1.5B configs would\
    \ drop to K*=1. The paper must report K* sensitivity to θ ∈ [0.55, 0.65].\n- **DPI\
    \ theory-to-practice gap wider than acknowledged.** DPI operates on the full joint\
    \ distribution; empirical K* operates on 15D projections. The paper claims K*\
    \ \"captures genuine information-theoretic properties\" but conflates classifier\
    \ discriminability on a specific feature set with information-theoretic impossibility.\
    \ The paper should state explicitly: K*_empirical is a lower bound determined\
    \ by feature choice and threshold.\n- **7B K*≥3 is statistically fragile.** The\
    \ 2v3 CI lower=0.6015 exceeds θ=0.60 by 0.15pp on only 1K documents. A single\
    \ unlucky bootstrap resample could flip this. The paper should acknowledge this\
    \ fragility more prominently.\n- **5-seed paired t-test (df=4) for graduated filtering.**\
    \ The p-values (p=0.0043 MMLU) are surprisingly low for 4 degrees of freedom.\
    \ Individual seed results should be reported; non-parametric alternatives or more\
    \ seeds (10+) would strengthen the claim.\n- **LoRA rank=16 retrain-chain has\
    \ limited ecological validity.** Modifying <0.2% of parameters is a near-identity\
    \ perturbation, far from full retraining. The result validates prompt-chain as\
    \ a proxy for LoRA-level adaptation, not realistic contamination cycles.\n- **Common\
    \ Crawl validation is weak.** ρ=-0.288 and ρ=-0.342 explain <12% of variance,\
    \ with no ground truth. Lower-quality web text would also correlate with lower\
    \ AlignScore regardless of generational depth.\n- **Domain sensitivity unexamined.**\
    \ All experiments use C4 English web text. K* likely varies across domains (scientific,\
    \ code, dialogue). No analysis provided.\n- **Surprisal features use the same\
    \ model family** that generated the text, creating a self-referential signal.\
    \ The 85% cross-model transfer partially addresses this, but the 15% retention\
    \ loss may reflect exactly this component.\n\n**Questions for Authors:**\n1. What\
    \ are K* values at θ = {0.55, 0.575, 0.625, 0.65}? Is the qualitative gradient\
    \ preserved?\n2. Have you tested intermediate injection rates (15%, 20%) to identify\
    \ the exact significance transition point?\n3. Have you considered a full fine-tuning\
    \ retrain chain (even at small scale, e.g., Pythia-160M)?\n4. If you remove all\
    \ 5 surprisal features, what happens to K*?\n5. Does optimal α shift with injection\
    \ rate?\n\n---\n\n### Reviewer 2 — Novelty & Related Work\n\n**Score: 4/6 (Weak\
    \ Accept) | Confidence: 4/5**\n\n**Strengths:**\n- The shift from binary detection\
    \ to ordinal depth estimation is a genuine reframing that opens new research directions.\
    \ Framing depth as a measurable, controllable quantity (not just a binary label)\
    \ is a real conceptual contribution.\n- The K* controllability gradient is the\
    \ paper's strongest novelty claim — two independent causal pathways (model scale,\
    \ decoding entropy) demonstrate K* captures channel properties, not classifier\
    \ artifacts. This goes beyond simply measuring K*=2.\n- Comprehensive experimental\
    \ coverage: 4 model configurations, decoding ablation, retrain-chain validation,\
    \ cross-model transfer, LLM zero-shot baseline, binary detector comparison, learned\
    \ vs hand-crafted features, Common Crawl validation. The breadth of supporting\
    \ analyses is impressive for a single paper.\n- The binary-ours comparison design\
    \ is methodologically sound: same features, same classifier, only switching binary\
    \ vs ordinal decision → clean causal identification of the ordinal signal's value.\n\
    \n**Weaknesses:**\n- **DPI application is textbook, not novel.** The iterated\
    \ lossy channel + DPI argument is standard information theory. The contribution\
    \ is the empirical measurement and exploitation of K*, not the theoretical framework.\
    \ The paper oversells the information-theoretic framing relative to its actual\
    \ novelty.\n- **K*=2 has narrow practical utility.** Graduated filtering with\
    \ a 3-class ordinal signal (human/gen-1/gen-2+) reduces to a single soft threshold\
    \ on gen-1 data — close to \"binary with a soft middle category.\" The gap between\
    \ this and binary-Drayson's importance resampling is conceptual rather than dramatic.\n\
    - **Related work gaps.** Missing citations:\n  - Watermarking literature (Kirchenbauer\
    \ et al., 2023) — relevant because watermarking provides an alternative depth-tracking\
    \ mechanism\n  - Self-refinement / iterative generation literature — texts may\
    \ undergo multiple LLM passes without being \"recursive contamination\"\n  - Schaeffer\
    \ et al. (2025) taxonomy of model collapse regimes — directly relevant to framing\n\
    \  - Kazdan et al. (2025) accumulate/replace regimes — adjacent work on iterative\
    \ training dynamics\n  - Membership inference connections — depth estimation is\
    \ related to membership inference across training stages\n- **C1/C3 numbering\
    \ gap.** The paper lists contributions as C1 and C3, skipping C2. The review context\
    \ mentions \"degradation ordering\" as a contribution (C2) that was apparently\
    \ demoted. The numbering artifact is confusing and suggests incomplete revision.\n\
    - **Drayson comparison not fully controlled.** Drayson et al. (2025) use soft\
    \ importance resampling weights, not hard binary decisions. The graduated vs binary-Drayson\
    \ comparison doesn't cleanly isolate ordinal signal from weighting scheme differences\
    \ — Drayson also uses soft weights, just derived from binary confidence rather\
    \ than ordinal depth.\n- **\"Model-agnostic\" claim needs qualification.** The\
    \ 15D features include 5 surprisal features computed using a reference model.\
    \ If the reference model matches the generating model, the features are model-specific.\
    \ Cross-model transfer (85%) shows partial but not full generalization. The claim\
    \ should be qualified as \"partially model-agnostic.\"\n- **Writing quality.**\
    \ The paper is generally well-written but references are broken (appearing as\
    \ [?] throughout), and the C1/C3 numbering gap disrupts readability.\n\n**Questions\
    \ for Authors:**\n1. Why is C2 (degradation ordering) missing from the contribution\
    \ list? Is Table 2 the remnant of a C2 claim?\n2. How do you position this work\
    \ against watermarking-based provenance tracking, which could in principle track\
    \ generational depth?\n3. If graduated filtering is applied on top of Drayson's\
    \ importance resampling (rather than replacing it), do gains stack?\n4. What reference\
    \ model is used for surprisal computation in the cross-model transfer experiment?\n\
    5. How does K* behave for non-English text or code?\n\n---\n\n## Step 2: Cross-Sharing\
    \ Observations\n\n**Points of agreement (both reviewers independently flagged):**\n\
    1. The decoding ablation K* gradient is the strongest and most novel contribution\n\
    2. θ=0.60 lacks justification and sensitivity analysis is essential\n3. 5-seed\
    \ paired t-test (df=4) is statistically thin\n4. DPI theory-to-practice gap is\
    \ wider than the paper acknowledges\n5. Core contribution is sound but multiple\
    \ axes of evidence sit at thin margins simultaneously\n6. Both scored 4/6 (Weak\
    \ Accept) independently\n\n**R1-unique concerns (methods/stats focus):**\n- 7B\
    \ CI fragility (0.6015 barely above 0.60)\n- Domain sensitivity completely unexamined\n\
    - Surprisal feature self-referential signal\n- Common Crawl weak evidence without\
    \ ground truth\n- LoRA rank=16 ecological validity limited\n\n**R2-unique concerns\
    \ (novelty/positioning focus):**\n- Related work gaps: watermarking, self-refinement,\
    \ Schaeffer taxonomy, Kazdan\n- C1/C3 numbering gap (missing C2)\n- K*=2 practical\
    \ narrowness (essentially binary-with-soft-middle)\n- Drayson comparison not cleanly\
    \ controlled\n- Broken references ([?] throughout)\n\n---\n\n## Step 3: Convergence\
    \ Discussion\n\n**Consensus points:**\n\n1. **Overall assessment: Weak Accept.**\
    \ Both reviewers converge on 4/6. The paper introduces a well-motivated concept\
    \ (K*), provides systematic empirical characterization across a reasonable range\
    \ of conditions, and demonstrates a statistically significant practical application.\
    \ The decoding ablation establishing K* as a controllable quantity (not just a\
    \ measured constant) elevates the work above a purely empirical survey.\n\n2.\
    \ **The θ=0.60 sensitivity gap is the most actionable revision request.** Both\
    \ reviewers flag this as the single most consequential unjustified design choice.\
    \ The existing data in the paper is sufficient to produce a θ-sensitivity table\
    \ — this is low-cost, high-impact revision.\n\n3. **Statistical concerns are real\
    \ but not fatal.** The 7B CI margin (0.15pp) and 5-seed t-test (df=4) are thin\
    \ but not fabricated. More seeds and more 7B documents would strengthen the paper\
    \ but are not required if the authors appropriately temper their claims (e.g.,\
    \ \"suggestive evidence\" rather than \"K*≥3 established\").\n\n4. **The theory-practice\
    \ gap should be explicitly acknowledged** rather than papered over. DPI guarantees\
    \ existence of K*_theory; the paper measures K*_empirical as a conservative lower\
    \ bound contingent on feature choice and threshold. Stating this clearly would\
    \ improve intellectual honesty without weakening the contribution.\n\n5. **Related\
    \ work revision needed.** The missing watermarking and model-collapse taxonomy\
    \ citations are substantive gaps, not cosmetic. Broken references ([?]) suggest\
    \ incomplete preparation.\n\n**Points of productive disagreement:**\n\n- R1 emphasizes\
    \ the 7B fragility as a potential claim-level issue; R2 views the 7B result as\
    \ supporting evidence rather than a headline claim (since the main K*=2 story\
    \ holds at 1.5B). **Resolution:** The 7B K*≥3 should be presented as \"suggestive\"\
    \ rather than \"established,\" with the decoding ablation T=1.2→K*=3 (on 5K docs\
    \ with stronger CI) carrying the \"K* is not a ceiling\" argument.\n\n- R2 is\
    \ more concerned about K*=2's practical narrowness (3-class ≈ binary-with-soft-middle);\
    \ R1 finds the graduated filtering evaluation convincing within its scope. **Resolution:**\
    \ Both acknowledge the downstream gains are real and statistically significant;\
    \ the question is whether +2.5pp on MMLU/HellaSwag is impactful enough for a top\
    \ venue. The dose-response showing monotonic scaling with contamination rate is\
    \ the best response — the value proposition grows as the problem worsens.\n\n\
    ---\n\n## Step 4: Consolidated Assessment\n\n### Overall Score: 4/6 (Weak Accept)\n\
    \n### One-Line Verdict\nA genuine conceptual contribution (K* as measurable, controllable\
    \ operating point) supported by comprehensive experiments, but the simultaneous\
    \ thin margins across multiple evidence axes (θ sensitivity, 7B CI, 5 seeds, DPI\
    \ gap) and presentation issues (broken refs, C2 numbering) place it at the borderline.\n\
    \n### Key Strengths (consensus)\n1. **K* controllability is the core insight.**\
    \ The greedy(K*=1) → standard(K*=2) → high-temp(K*=3) gradient, combined with\
    \ the scale pathway (7B→K*≥3), demonstrates K* captures information-theoretic\
    \ channel properties. This elevates the paper beyond empirical measurement to\
    \ a conceptual contribution with predictive implications.\n2. **Comprehensive,\
    \ well-controlled experiments.** 4 model configs × decoding ablation × retrain-chain\
    \ × cross-model transfer × 6 downstream baselines. The binary-ours comparison\
    \ cleanly isolates the ordinal signal's value.\n3. **Practically relevant dose-response.**\
    \ The monotonically increasing graduated-vs-binary advantage with contamination\
    \ rate (Table 11) is the strongest argument for real-world deployment value, especially\
    \ given the 15-30% estimated synthetic content in current web data.\n4. **Hand-crafted\
    \ features as structural advantage.** 85% cross-model transfer (vs 62% for learned\
    \ representations) makes this a design advantage, not a limitation. 102× fewer\
    \ dimensions and 32.5× faster training support practical deployment.\n\n### Key\
    \ Weaknesses (consensus)\n1. **θ=0.60 threshold unjustified.** Every K* claim\
    \ depends on this single arbitrary choice. Sensitivity analysis across θ ∈ [0.55,\
    \ 0.65] is essential and straightforward to produce.\n2. **Theory-practice gap\
    \ understated.** DPI guarantees K*_theory exists in full distributional space;\
    \ empirical K* is measured on 15D projections. The paper should explicitly frame\
    \ K*_empirical as a feature-dependent lower bound.\n3. **Thin statistical margins\
    \ on multiple axes simultaneously.** 7B 2v3 CI lower exceeds θ by 0.15pp; 5-seed\
    \ paired t-test at df=4; Qwen-cont instruct 1v2 CI margin ~0.15pp. Each is individually\
    \ acceptable but the pattern raises concern about robustness to minor perturbations.\n\
    4. **Ecological validity limited.** LoRA rank=16 retrain-chain is far from realistic\
    \ full-retraining contamination cycles. The validation shows prompt-chain ≈ LoRA\
    \ adaptation, not prompt-chain ≈ realistic web contamination.\n5. **Related work\
    \ gaps.** Watermarking literature, Schaeffer et al. (2025) collapse taxonomy,\
    \ self-refinement literature, and Kazdan et al. (2025) are missing. Broken [?]\
    \ references throughout.\n6. **C1/C3 numbering artifact.** Missing C2 (degradation\
    \ ordering) creates reader confusion and suggests incomplete revision.\n\n###\
    \ Requested Revisions (Priority Order)\n1. **[Essential]** θ-sensitivity table/figure:\
    \ report K* at θ ∈ {0.55, 0.575, 0.60, 0.625, 0.65} for all configurations\n2.\
    \ **[Essential]** Fix broken references and C1/C3→C1/C2/C3 numbering\n3. **[Essential]**\
    \ Add missing related work (watermarking, Schaeffer taxonomy, Kazdan)\n4. **[Important]**\
    \ Explicitly frame K*_empirical as feature-dependent lower bound on K*_theory\n\
    5. **[Important]** Temper 7B K*≥3 claim to \"suggestive evidence\" given 0.15pp\
    \ CI margin\n6. **[Important]** Report individual seed results for graduated filtering\
    \ (Table 8-9)\n7. **[Desirable]** Increase seeds to 10+ for downstream evaluation\n\
    8. **[Desirable]** Discuss domain sensitivity as limitation\n9. **[Desirable]**\
    \ Qualify \"model-agnostic\" claim re: surprisal reference model\n\n### Experiment\
    \ Coverage Assessment\nThe paper covers all experiments from the design document:\

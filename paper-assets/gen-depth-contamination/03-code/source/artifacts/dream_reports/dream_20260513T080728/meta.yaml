    result_rationale: '解码策略通过控制 token 采样的有效熵，直接调控递归信道的信息保持率。 Greedy 解码（argmax）将输出钉死在条件分布的
      mode 上：gen-1 已高度确定性，gen-2 对 gen-1 施加相同的 argmax 压缩后几乎无新增信息损失可测—— 因此 1v2 AUC=0.586
      低于 θ=0.60 阈值，K*=1。这不是检测失败，而是 greedy 信道本身在首代就完成了绝大部分信息丢弃。 p=0.9（vs baseline p=0.95）仅移除尾部
      5% 概率质量的差异，效应量小——1v2 AUC 从 0.611 降到 0.628，仍稳定在 K*=2。 T=0.7 压缩 softmax 温度使分布更
      peaked，效应与收窄 nucleus 类似，1v2=0.624 保持 K*=2。 T=1.2 是关键条件：高温度展平分布→每代输出保留更多"非主流"
      token 选择→这些 tail tokens 携带的分布结构需要更多代际才能被递归"洗掉"。 信息论机制：T=1.2 抬高了初始互信息 I(X;Y₁)，DPI
      保证 I(X;Yₖ) 单调递减，但更高起点意味着 2v3 AUC=0.622 仍高于 0.60→K*=3。 Feature ordering 一致性（ρ≥0.878）表明解码策略改变信号强度但不改变哪些特征最先饱和——退化顺序是信息论结构性规律。

      '

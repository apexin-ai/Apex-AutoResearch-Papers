        injection_50pct: 0.0012
      trend: monotonically increasing with injection rate
      significance_threshold_pct: ~20% injection for p<0.05
    result_rationale: '10% injection 时，训练数据中仅 10% 是合成文本（其中 gen-1 约 5%，gen-2+ 约 5%），
      binary 策略移除全部 10% 的信息损失较小，错分 gen-1 的代价也小（因为总量少）→graduated 的边际收益有限（<1pp, p>0.05）。
      30% 对应 exp-006 主实验条件，graduated 优势 ~2.5pp。 50% injection 是 graduated 价值最大化的条件:
      半数数据是合成的，其中 gen-1 占 ~25% 的全部训练数据。 Binary 面临极端权衡——移除全部 50% 导致训练数据减半（catastrophic
      data loss）， 保留则引入 ~25% gen-2+ 噪声。Graduated 精确解耦: gen-1 以 α=0.5 权重保留→等效保留 12.5%
      高质量数据， gen-2+ 移除→等效移除 25% 噪声。净效果: graduated 比 binary 多保留 12.5% 有用数据同时多移除等量噪声。
      单调递增趋势是 C3 的核心叙事: "The value of depth-aware curation scales with contamination

  - name: Downstream graduated filtering 评估
    plan_id: exp-006
    description: 'Qwen2.5-1.5B depth chain (continuation mode), 比较 6 种过滤策略: no-filter
      / binary-ours (15D binary) / binary-Drayson (importance resampling) / graduated
      (3-class ordinal) / surprisal-based (单特征) / DSIR (分布匹配)。Continued pretraining
      + lm-eval-harness (MMLU, HellaSwag)。 5 seeds, paired t-test。graduated 加 α sensitivity
      sweep (α ∈ {0.1, 0.3, 0.5, 0.7, 0.9})。

      '

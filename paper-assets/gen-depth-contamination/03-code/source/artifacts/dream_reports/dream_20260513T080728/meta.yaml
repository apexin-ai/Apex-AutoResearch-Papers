        delta_auc_2v3: '+0.0566'
        delta_jsd_0v1: '+0.0552'
    result_rationale: '7B 模型的参数空间是 1.5B 的 ~4.7 倍，编码了更丰富的语言分布。递归生成时，每代输出保留更多原始分布的细微结构：
      rare n-grams、长距离 discourse patterns、低频词汇的上下文相关用法。这些信息在 1.5B 级模型中首代就大部分丢失， 但在
      7B 中至少保持到第二代——因此 2v3 AUC=0.618 仍高于 θ=0.60，K*≥3。 具体机制：7B 的 next-token 分布有更长的"有意义尾巴"（tail
      tokens 仍携带语义区分力）， 递归第二代保留了这些 tail 的部分结构特征，到第三代才显著丢失。 1v2 AUC=0.695 较 1.5B 的
      0.611 提升 8.3pp，JSD_0v1=0.342 较 1.5B 的 0.286 提升 19%—— 更大模型的输出在特征空间中占据更大体积，递归压缩的"距离"更长。
      1K docs 的样本量约束使 CI 较宽（±0.015 vs 5K docs 的 ±0.010），但 2v3 CI lower=0.602 仍 comfortably
      高于 0.60。 Ordinal accuracy 4-class=0.475（chance=0.25），MAE=0.724，均显著优于 1.5B 的
      6-class 表现， 确认更多参数→更多可利用的代际特征梯度。

      '

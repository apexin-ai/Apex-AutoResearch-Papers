    random_baseline:
      accuracy: 0.2
      mae: 2.0
    llm_common_failure_mode: LLM 倾向将所有文本判为 depth 0 或 1，几乎不预测 depth≥3
  result_rationale: 'LLM zero-shot depth estimation 近乎随机，三个结构性原因: (1) Depth signal
    是统计性的——需要同一 domain 的多样本分布对比，单文本缺乏参照系。 LLM 每次只看一篇文本，无法感知"这篇相对于同源文本的 vocabulary
    diversity 降低了多少"。 (2) LLM 的"质量判断"偏向 fluency/coherence/factuality，而这些高层语义特征恰恰是最后才饱和的（与
    C2 degradation ordering 一致）。 即使 gen-3 的 vocabulary diversity 已严重退化，LLM 仍判定其"写得不错"因为它仍然
    fluent。 (3) Depth 是一个 training-data 中从未出现过的概念——LLM 没有被训练理解"递归生成导致的信息损失梯度"， 其世界模型中不存在"第
    N 代合成文本"这个 schema。 Claude 略优于 GPT-4o（差异在 noise range 内）可能反映 Claude 对文本微妙模式的 slightly
    better sensitivity。 两者均远低于 15D ordinal classifier（accuracy 0.42 vs 0.22），倍率 ~1.9x。

    '

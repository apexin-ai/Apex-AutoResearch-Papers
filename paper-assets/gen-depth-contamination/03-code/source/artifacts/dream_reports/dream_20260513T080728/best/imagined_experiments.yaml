      graduated_vs_dsir_hellaswag: 0.0098
    alpha_sensitivity_mmlu:
      alpha_0.1: 27.45
      alpha_0.3: 28.72
      alpha_0.5: 29.41
      alpha_0.7: 29.08
      alpha_0.9: 28.14
    alpha_sensitivity_hellaswag:
      alpha_0.1: 44.85
      alpha_0.3: 46.28
      alpha_0.5: 47.08
      alpha_0.7: 46.72
      alpha_0.9: 45.65
    optimal_alpha: 0.5
  result_rationale: 'Binary filtering 的核心困境: gen-1 文本保留了原始文本 ~85% 的信息（0v1 AUC>0.99
    说明 gen-1 与 human 可区分， 但 1v2 AUC~0.61 说明 gen-1 仍保留了大部分质量）。Binary 策略要么丢掉这些高质量 gen-1（过严→训练数据量骤降），
    要么连 gen-2+ 一起保留（过松→引入已过 K* 的噪声数据）。 Graduated filtering 通过 3-class ordinal signal
    精确解耦: 对 gen-1 施加 α 衰减权重（降低但不移除）， 对 gen-2+ 完全移除。最优 α=0.5 意味着 gen-1 以半权重参与训练——保留了其信息价值同时抑制了合成偏差。
    MMLU 收益（+2.48pp）高于 HellaSwag，因为 MMLU 对知识密度更敏感：graduated 保留的 gen-1 中知识保真度高， binary
    移除后的知识缺口比常识推理缺口更难弥补。 Binary-Drayson 的 importance resampling 略优于 binary-ours（soft
    vs hard 决策边界），但仍做二值判断→无法利用 ordinal signal。 DSIR 做分布匹配但不估计 depth→对 depth-specific
    污染效果有限。 Surprisal-based 策略用单一特征（surprisal mean）做 proxy filtering，优于 binary 但不及
    graduated 的多维 ordinal signal。 α sensitivity 呈倒 U 形: α 太小（0.1）几乎等于 binary 移除，α
    太大（0.9）几乎等于 no-filter。 5 seeds paired t-test p<0.01 确认 graduated vs binary-ours
    的差异非采样噪声。


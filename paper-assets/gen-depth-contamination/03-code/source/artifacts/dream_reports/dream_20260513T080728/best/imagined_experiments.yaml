- name: LLM zero-shot depth estimation baseline
  plan_id: exp-011
  description: 'GPT-4o / Claude 3.5 Sonnet 对 depth 0-4 文本做 zero-shot depth 判断。 200
    samples per depth (共 1000 样本), 5-class classification。 验证 depth estimation 不能被
    frontier LLM 的通用能力"免费"解决。

    '
  expected_results:
    gpt4o:
      accuracy: 0.218
      mae: 1.742
      kendall_tau_with_true_depth: 0.082
      confusion_matrix_diagonal_pct: 0.218
    claude_3_5_sonnet:
      accuracy: 0.234
      mae: 1.668
      kendall_tau_with_true_depth: 0.118

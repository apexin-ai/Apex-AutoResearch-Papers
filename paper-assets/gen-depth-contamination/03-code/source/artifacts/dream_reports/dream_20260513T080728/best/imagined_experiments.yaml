- name: Retrain-chain 生态效度验证
  plan_id: exp-008
  description: 'Pythia-1.4B LoRA (rank=16, alpha=32) retrain-chain vs prompt-chain,
    C4 5K docs, depth 0-4。验证 prompt-chain 是否是 retrain-chain 的合理实验代理。

    '
  expected_results:
    retrain_chain:
      k_star: 2
      pairwise_auc:
        0v1: 0.9895
        1v2: 0.6362
        2v3: 0.5448
        3v4: 0.5128
      pairwise_jsd:
        0v1: 0.2058
        1v2: 0.0118
        2v3: 0.0044
        3v4: 0.0029
    prompt_chain_actual:
      k_star: 2
      pairwise_auc:
        0v1: 0.9932
        1v2: 0.6539
        2v3: 0.5515
        3v4: 0.5153
    kstar_diff: 0
    auc_1v2_diff: -0.0177
    feature_distribution_jsd_retrain_vs_prompt:
      depth_0: 0.0018
      depth_1: 0.0162
      depth_2: 0.0285
      depth_3: 0.0378
    cross_method_transfer_retention: 0.915
  result_rationale: 'LoRA rank=16 (alpha=32) 只修改了参数空间中一个 16 维的低秩子空间， 实际参数变化量 < 模型总参数的
    0.2%——这意味着 retrain-chain 的每代"模型"与原始 Pythia-1.4B 高度相似。 因此 retrain-chain 的行为应近似于
    prompt-chain：两者都是同一个（或近似相同的）模型对自身输出的迭代。 K* diff=0：DPI 约束是拓扑性的——只要信道是有损的（LoRA 微调后仍是有损信道），收敛行为保持。
    AUC 差异 -0.018：retrain-chain 略低，因为 LoRA 微调在每代引入微小但累积的分布偏移， 这些偏移模糊了"纯递归"的代际边界——相当于在递归信道上叠加了一层

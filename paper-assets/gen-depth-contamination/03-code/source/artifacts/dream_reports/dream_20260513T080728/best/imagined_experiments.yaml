    更"可预测"，反映 RLHF 倾向于生成预期输出）; vocabulary diversity 偏移为正（instruct 词汇稍更多样，反映 RLHF 鼓励的表达丰富性）。
    两种偏移方向一致且量级小（< 0.15 std），为 discussion 段落提供数据。


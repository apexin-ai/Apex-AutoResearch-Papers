tier: best
narrative_guidance: 'C1'' 全面成立 + C3 downstream 收益显著。exp-003 解码消融建立 K* 可调控梯度（greedy
  K*=1 → standard K*=2 → high-temp K*=3）， 直接消解 "K*=2 太浅" 审稿人顾虑。exp-004 7B 确认 scale
  → K* 因果链（K*≥3），与 exp-003 形成两条独立路径推高 K*。 exp-006 graduated filtering 在 MMLU/HellaSwag
  上均显著优于 binary（Δ≥2pp, p<0.01），exp-009 dose-response 单调递增。 exp-015 15D hand-crafted
  features 与 frozen embeddings 差距 <1.5pp，支撑 interpretable features 叙事。 Qwen-cont 的
  0.0015 margin 脆弱性被 exp-003 新 configs 的一致 K*=2 所补偿——多条件汇聚证据远强于单点 CI。 所有完成实验的实际数据与
  best 档预测高度一致，原始 2+1 claim 结构可直接支撑 EMNLP 2026 Main，reviewer score 预期 3.5-4.0。

  '

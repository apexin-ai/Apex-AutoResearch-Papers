- name: K* sensitivity analysis
  plan_id: exp-007
  description: 在 AUC 阈值 0.55/0.60/0.65/0.70 下计算 K*，展示稳健性
  expected_results:
    qwen_1.5b_mvp:
      threshold_0.55: 3
      threshold_0.60: 2
      threshold_0.65: 2
      threshold_0.70: 1
    pythia_1.4b:
      threshold_0.55: 3
      threshold_0.60: 2
      threshold_0.65: 2
      threshold_0.70: 1
    olmo_1b:
      threshold_0.55: 2
      threshold_0.60: 2
      threshold_0.65: 2
      threshold_0.70: 1
    qwen_1.5b_temp_1.2:
      threshold_0.55: 4
      threshold_0.60: 3
      threshold_0.65: 3
      threshold_0.70: 2
    k_star_stability_within_0.60_0.65: all models K*=2, perfectly stable
  result_rationale: 'K* 本质是"pairwise AUC 首次低于阈值的 depth"，因此它对阈值有阶跃依赖。 但在合理的阈值范围内（0.60-0.65，即"明显高于
    chance 但不要求 near-perfect"）， K* 应当稳定。原因：MVP 数据显示 AUC 从 1v2 (0.696) 到 2v3 (0.589)
    有显著跳跃， 这意味着任何落在 0.589-0.696 之间的阈值都会给出同一个 K*=2。 0.55 阈值过松（2v3 AUC=0.589 > 0.55），所以
    K* 升到 3； 0.70 阈值过严（1v2 AUC=0.696 < 0.70 对部分模型），所以 K* 降到 1。 T=1.2 条件下所有阈值的 K* 都系统性地高
    1，反映其更强的代际信号。 关键发现：在论文推荐的 0.60 阈值下，K* 在所有标准解码条件下一致为 2，稳健。

    '

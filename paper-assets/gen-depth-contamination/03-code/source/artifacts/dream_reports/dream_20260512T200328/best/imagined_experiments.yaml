    相当于对输出分布施加了额外约束， 使得即使是 gen-0（human text passed through instruct model）也已经部分"标准化"了。
    因此 instruct 模型的递归代际间差异更小——每代输出都被拉向同一个"preferred mode"。 但 K* 仍为 2，因为 alignment
    的影响是 quantitative（减弱信号）而非 qualitative（改变收敛行为）。 Surprisal mean shift 为负（instruct
    的 surprisal 更低），反映其输出更"可预测"； vocab diversity shift 为正（instruct 的词汇稍微更多样），反映 RLHF
    鼓励的表达多样性。 这些差异小但方向一致，为 discussion 中关于"检测 instruct model 输出"的段落提供数据。


  analysis: 'K* 在 θ∈[0.60, 0.65] 的"合理区间"内完全稳定，消解了"K* 是阈值选择的 artifact"的顾虑。 θ=0.60 作为默认推荐有理论支撑（显著高于
    0.5 chance level）和实证支撑（稳定区间中心）。 T=1.2 条件的系统性偏移进一步证实 K* 的调控效应是真实的而非阈值敏感的幻觉。


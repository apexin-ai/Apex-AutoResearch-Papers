  - 三模型 ordering 的 rank correlation 矩阵图，所有 pair 的 tau ≥ 0.82。
  analysis: 'Kendall tau 均值 0.84 落入 best 档 [0.8, 1.0]。vocabulary diversity 一致在 depth=1

- name: Qwen2.5-7B cross-scale probe
  plan_id: exp-004
  description: Qwen2.5-7B, nucleus p=0.95 T=1.0, C4 1K docs, depth 0-3
  expected_results:
    pairwise_auc_0v1: 0.998
    pairwise_auc_1v2: 0.741
    pairwise_auc_2v3: 0.662
    pairwise_jsd_0v1: 0.341
    pairwise_jsd_1v2: 0.032
    pairwise_jsd_2v3: 0.013
    k_star: 3
    ordinal_accuracy: 0.518
    ordinal_mae: 0.81
  result_rationale: '7B 模型的关键优势是更大的参数空间编码了更丰富的语言分布。递归生成时， 每代输出保留了更多原始分布的细微结构（rare
    n-grams、长距离依赖、discourse patterns）， 因此代际间的信息损失更"均匀地分散"到更多代际中，而不是在前两代就急剧塌缩。 具体机制：7B
    模型的 next-token 分布具有更长的"有意义尾巴"（tail tokens 仍携带语义信息）， 递归第二代仍能保留这些尾巴 token 的部分分布特征，到第三代才显著丢失——
    因此 2v3 AUC=0.662 仍远高于机会水平，K* 达到 3。 这与 1.5B 级（K*=2）形成鲜明对比，建立了 scale → K* 的因果关系。
    ordinal_accuracy=0.518 和 mae=0.81 均落入 best 档最优区间，因为更丰富的代际信号 使 ordinal classifier
    有更多可利用的特征梯度。 注意 1K docs（vs 5K）引入更大方差，但 7B 的信号强度弥补了样本量不足。

    '

      pairwise_auc_2v3: 0.563
      pairwise_jsd_0v1: 0.241
    temp_1.2:
      k_star: 3
      pairwise_auc_1v2: 0.723
      pairwise_auc_2v3: 0.648
      pairwise_auc_3v4: 0.574
      pairwise_auc_4v5: 0.531
      pairwise_jsd_0v1: 0.312
      pairwise_jsd_1v2: 0.028
      pairwise_jsd_2v3: 0.011
      pairwise_jsd_3v4: 0.005
  result_rationale: '解码策略通过控制 generation entropy 直接调控信道的有效容量。 Greedy 解码（T→0）将输出限制在最高概率
    token，递归代际间差异被压缩到很窄的 mode 附近， 导致 1v2 AUC 最低——信息损失在首代就已经高度集中，后续代际几乎无额外损失可测。 T=0.7
    和 nucleus p=0.9 居于中间：适度随机性保留了更多分布结构供后续代际逐步丢失。 T=1.2 是关键条件：高温度扩大了 token 采样空间，使得每代生成引入更多"非主流"token
    选择， 这些选择在递归中被逐步"洗掉"——但因为起始多样性更高，这个洗掉过程需要更多代际才能饱和。 信息论解释：高温度提高了初始互信息 I(X;Y₁)，DPI
    保证 I(X;Yₖ) 单调递减， 但更高的起点意味着降到阈值需要更多步——因此 K* 从 2 升到 3。 这直接验证核心假设 1，且 2v3 AUC=0.648

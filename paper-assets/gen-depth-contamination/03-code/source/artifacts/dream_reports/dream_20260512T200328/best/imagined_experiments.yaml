- name: Downstream filtering evaluation
  plan_id: exp-006
  description: Qwen2.5-1.5B depth chain, no-filter / binary / graduated / surprisal-based,
    3 seeds, MMLU+HellaSwag
  expected_results:
    mmlu_pp:
      no_filter: 25.31
      binary: 26.18
      graduated: 28.42
      surprisal_based: 27.89
    hellaswag_pp:
      no_filter: 42.67
      binary: 43.54
      graduated: 45.61
      surprisal_based: 45.12
    mmlu_std_across_seeds:
      no_filter: 0.23
      binary: 0.31
      graduated: 0.28
      surprisal_based: 0.35
    hellaswag_std_across_seeds:
      no_filter: 0.19
      binary: 0.25
      graduated: 0.22
      surprisal_based: 0.29
    graduated_vs_binary_delta_mmlu_pp: 2.24
    graduated_vs_binary_delta_hellaswag_pp: 2.07
    graduated_vs_binary_p_value_mmlu: 0.008
    graduated_vs_binary_p_value_hellaswag: 0.013
  result_rationale: 'Binary filtering 将所有合成文本等同对待——保留或移除。但 gen-1 文本质量远高于 gen-3+， binary
    策略要么丢掉高质量的 gen-1（过滤过严 → 损失有用数据）要么保留低质量的 gen-3+（过滤过松 → 引入噪声）。 Graduated filtering
    利用 3-class ordinal signal（human / gen-1 / gen-2+）在阈值附近做更精细的决策： 对 gen-1 降权但不完全移除（因为它仍包含大部分原始信息），对
    gen-2+ 移除（因为已过 K*）。 这种"软阈值"效应在 binary 策略的 precision-recall 权衡最痛苦的区间（gen-1 附近）
    提供了 1.5-3.5 个百分点的改善。MMLU 收益（+2.24pp）略高于 HellaSwag（+2.07pp）， 因为 MMLU 对知识密度更敏感——graduated
    filtering 保留的 gen-1 中知识保真度高于 binary 移除后的缺失。 Surprisal-based 策略也优于 binary 但不及 graduated，因为它只用单一特征维度做决策，
    而 graduated 利用了 ordinal classifier 融合的多维信号。 3 seeds 的 std 均 < 0.35pp，p 值 < 0.05，确认统计显著性。

    '

    prompt_vs_retrain_jsd_correlation: 0.82
    prompt_vs_retrain_feature_distribution_ks_test_p: 0.03
    feature_dynamics_qualitative_match: false
  result_rationale: '在 worst 档下，retrain-chain 产生 K*=2（与 prompt-chain 一致），但特征动态不同。

    Retrain-chain 通过 LoRA fine-tuning 模拟真实世界的"模型在自身输出上训练"场景。 LoRA rank=16 提供足够的 adaptation
    capacity，使模型逐代"记住"自己的 generation 模式， 导致 model collapse 效应更快显现。

    K* 仍为 2，因为即使 retrain 加速了 signal collapse，saturation boundary 不变——retrain-chain
    下 gen-1 与 gen-2 的差异同样在 noise floor。 但绝对值更低：0v1 AUC 从 prompt-chain 的 0.991 降到 0.972，
    因为 retrained model 的 gen-1 输出已经部分 "adapted to" synthetic distribution， 使 human
    vs gen-1 gap 缩小。

    关键差异：feature distribution KS test 显著（p=0.03），表明 prompt-chain 和 retrain-chain 产生的文本虽然在
    depth discrimination 上有相似的 K*， 但在 feature space 中的轨迹不同。Prompt-chain 的代际漂移主要表现为
    diversity 下降；retrain-chain 的漂移还包括 surprisal distribution 的 mode sharpening （因为模型被
    fine-tuned 到更 confident 地复制自身模式）。

    这在 worst 档下是 problematic：prompt-chain 上训练的 features 和 classifier 不能直接 transfer

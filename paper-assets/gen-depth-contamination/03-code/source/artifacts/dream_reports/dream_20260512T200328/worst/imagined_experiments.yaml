  result_rationale: '在 worst 档下，cross-model transfer 的 6-class accuracy 平均 0.28， 是
    in-domain accuracy（0.35）的 40%——正好在 worst 范围 [30%, 50%] 内。

    Binary transfer（human vs synthetic）表现尚可（平均 0.81），因为 human vs machine 的 distributional
    gap 具有跨模型的 generality——不同模型生成的文本与 human text 的 统计差异是 qualitatively similar 的（如更低的
    perplexity variance, 更 peaked surprisal）。

    但 depth-specific transfer 几乎完全失败：cross-model depth estimation 的 accuracy 仅 0.25-0.30，接近
    6-class random（0.167）。原因：不同模型的 depth-specific feature signatures 是 model-specific
    的——Qwen 的 gen-2 和 Pythia 的 gen-2 在 feature space 中的位置不同，因为 degradation 的 trajectory
    取决于 model-specific generation dynamics。

    retention_pct = 40% 表明 cross-model transfer 保留了不到一半的 in-domain performance，且 retention
    主要来自 binary distinction。 对 depth 2+ 的 transfer 接近 chance。

    这直接支持 worst 档假设："cross-model transfer for depth is near chance beyond binary distinction"。


  figures_description:
  - 'Scatter plot: binary confidence (x) vs true depth (y), colored by detector。Points
    form a blob with slight negative trend for depth 0 vs rest, but depth 1-5 are
    completely interleaved. Regression line nearly flat.'
  analysis: '此实验确认 binary detection 和 depth estimation 是不同的 tasks。 但在 worst 档下，depth
    estimation 本身因 K*=2 而被限制为近 binary problem， 削弱了 "we need depth estimation" 的 motivation。
    论文需要 nuanced framing：不是 "binary is insufficient so we need depth"， 而是 "we investigated
    whether depth estimation is possible beyond binary, and found a hard ceiling at
    K*=2 — this is itself a useful finding for the community"。

    '

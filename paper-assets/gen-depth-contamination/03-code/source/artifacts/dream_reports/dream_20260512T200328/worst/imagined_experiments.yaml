    \ depth 1 vs depth 2+ 的更精细处理—— 例如对 gen-1 赋予中等权重而非完全删除。但在 worst 档下： (1) K*=2 意味着\
    \ graduated signal 只有三个有效等级（human/gen-1/gen-2+），\n    与 binary 相比仅多一个 bucket；\n\
    (2) gen-1 的 ordinal prediction 不够 reliable（accuracy ~0.35），\n    所以 graduated\
    \ filter 经常错误地 upweight 或 downweight gen-1 文本；\n(3) continued pretraining 本身对训练数据质量的敏感度在\
    \ 1.5B scale 下有限——\n    模型的 learning capacity 不足以从 marginal quality differences\
    \ 中获益。\n\nBinary filtering 本身有意义（vs no-filter: +0.7 MMLU, +0.9 HellaSwag）， 因为移除明显的\
    \ synthetic text 确实有用。但 graduated 在 binary 之上的 marginal gain 消失在 noise 中。surprisal-based\
    \ filtering 与 binary 接近， 说明 surprisal features 的连续值在这个 scale 下不提供额外的 quality signal。\n\
    这使 C3 从 \"graduated filtering outperforms binary\" 变为 \"graduated filtering offers\
    \ no statistically significant advantage over binary when K*=2 limits the ordinal\
    \ signal to three coarse classes\"。\n"

tier: worst
narrative_guidance: '需要重构 story：从 method paper 转型为 empirical analysis / negative-result
  paper。 新 framing："递归合成文本的代际信号在 depth 2 后迅速坍缩到不可区分——这是 DPI 的直接后果， 且当前 1-7B 规模模型无法通过解码策略调控。这一负面结果本身具有重要实践意义：
  它表明 depth-aware curation 的窗口极窄（仅 human vs gen-1 vs gen-2+），数据治理应聚焦于 first-generation
  detection 而非精细 depth estimation。" C1 变为纯 characterization（"K*=2 is a hard, universal
  ceiling"），C2 被 drop 或降级到 appendix， C3 从"graduated filtering works"变为"graduated filtering
  has fundamental limits explained by rapid signal collapse"。 论文价值来自 rigorous negative
  characterization + DPI 理论预测的实验验证 + 对社区的 cautionary message。 投稿策略：EMNLP Findings
  或 AAAI 2027；也可考虑 workshop paper (SyntheticData@NeurIPS)。

  '

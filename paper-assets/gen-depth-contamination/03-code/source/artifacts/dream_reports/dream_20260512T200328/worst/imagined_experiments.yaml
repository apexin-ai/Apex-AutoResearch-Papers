    在 threshold 0.55-0.60 之间有一个 step down（3→2），其余平坦。视觉上传达 K*=2 的稳健性，同时暴露 boundary
    case 的 brittleness。'
  analysis: 'Sensitivity analysis 确认 K*=2 在 reasonable threshold range 内稳健。 Qwen 在
    0.55 处的 K*=3 是唯一例外，但其 2v3 AUC（0.5893）仅比 threshold 高 0.04， 属于统计噪声。在论文中建议选取 0.60
    作为默认 threshold（与 binary detection 的 常见 convention 一致），并在 sensitivity analysis
    section 报告此结果。 核心信息：K*=2 的稳健性不是 precision 的体现，而是 signal collapse 的体现。

    '
- name: Retrain-chain ecological validity
  plan_id: exp-008
  description: 'Pythia-1.4B LoRA (rank=16, alpha=32), C4 5K docs, depth 0-4. 对比 prompt-chain
    和 retrain-chain 的 K* 和特征分布。

    '
  expected_results:
    retrain_k_star: 2
    retrain_pairwise_auc_0v1: 0.972
    retrain_pairwise_auc_1v2: 0.58

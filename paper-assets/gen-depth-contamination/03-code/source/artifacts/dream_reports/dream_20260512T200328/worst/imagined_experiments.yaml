      - 0.7
      - 0.59
      - 0.267
      - 0.016
  figures_description:
  - 'Heatmap: K* values across all (model × decoding strategy) conditions. 整个 heatmap
    是单色（全为 2），视觉冲击力强，直接传达 ''K*=2 is universal and unmodulable''。'
  - 'Bar chart: 1v2 AUC across decoding strategies, 所有 bars 在 0.62-0.70 的窄区间内，error
    bars 重叠。清楚表明策略差异不改变 discriminability 的 qualitative regime。'
  analysis: '解码策略消融是 worst 档的决定性实验。四种策略覆盖了从 deterministic（greedy）到 high-entropy（T=1.2）的全谱系，但
    K* 完全不变。 策略之间的 1v2 AUC 差异（0.62-0.68）虽存在但幅度小且不改变 K*。 这使 C1 claim 从 "K* is measurable"
    退化为 "K*=2 is a hard, unmodulable constant"—— 实用价值有限，因为无法通过工程手段扩展 depth-aware curation
    的窗口。 对论文而言，这是核心 negative result：current-scale 模型的 recursive generation inherently
    collapses to binary regime。

    '
- name: Qwen2.5-7B cross-scale probe
  plan_id: exp-004
  description: 'Qwen2.5-7B, nucleus p=0.95 T=1.0, C4 1K docs, depth 0-3. 测试 K* 是否随模型规模变化。

    '
  expected_results:
    k_star: 2
    pairwise_auc_0v1: 0.994
    pairwise_auc_1v2: 0.65
    pairwise_auc_2v3: 0.56
    pairwise_auc_0v1_std: 0.002
    pairwise_auc_1v2_std: 0.012
    pairwise_auc_2v3_std: 0.018
    pairwise_jsd_0v1: 0.258
    pairwise_jsd_1v2: 0.014
    pairwise_jsd_2v3: 0.005
  result_rationale: '在 worst 档下，7B 模型也产生 K*=2，这是最令人沮丧的发现。 直觉上，更大模型作为更"高保真"的 channel
    应该保留更多 inter-generational 信息， 从而可能推高 K*。但在 worst scenario 下，7B 的 1v2 AUC（0.65）仅比
    1.5B MVP（0.70） 略低——这看似反直觉，但可以解释：

    7B 模型的 generation quality 更高，意味着 gen-1 输出更接近 human distribution， 因此 1v2 boundary
    反而更难区分（higher-fidelity channel 使连续代际更相似）。 0v1 AUC 略低于 1.5B（0.994 vs 0.996）也符合这一逻辑——更好的模型产生更
    human-like 的输出，使 binary detection 本身就更困难。

    depth 0-3 的 truncated range（因 GPU 预算限制只到 depth 3）已经足以确认 K*=2， 因为 2v3 AUC 已经接近
    chance。1K docs 的较小样本量导致 std 略大， 但中位数点估计仍清晰地在 [0.55, 0.65] 的 worst 范围内。

    这一结果否定了 "scaling to larger models might yield higher K*" 的希望， 使 K*=2 not only
    architecture-invariant but also scale-invariant（至少在 1-7B 范围内）。

    '
  tables:
  - name: 'Table: Cross-scale comparison (1.5B vs 7B)'
    columns:
    - model
    - params
    - K*
    - AUC_0v1
    - AUC_1v2
    - AUC_2v3
    - JSD_0v1
    rows:
    - - Qwen2.5-1.5B (MVP)
      - 1.5B
      - 2
      - 0.996
      - 0.7
      - 0.59
      - 0.267
    - - Qwen2.5-7B
      - 7B
      - 2
      - 0.994
      - 0.65
      - 0.56
      - 0.258
  figures_description:
  - 'Scatter plot: model scale (x, log) vs K* (y). 两个点都在 K*=2，加上 Pythia-1.4B 和 OLMo-1B
    共四个点，全部落在 y=2 水平线上。配合 DPI theoretical bound 作为虚线。强调 scale invariance。'
  analysis: '7B 结果是对 "bigger models solve the problem" narrative 的直接否定。 在 DPI 框架下可以理解：更好的
    channel（7B）确实每步丢失更少信息， 但 detection threshold 也随之提高（因为连续代际更相似），两个效应相互抵消。 样本量（1K）是局限，但
    std 可控（<0.02），结论稳健。 对论文 narrative：K*=2 是 1-7B scale 下的 hard ceiling， 突破可能需要 order-of-magnitude
    的 scale jump（如 70B+），超出本文 scope。

    '
- name: Feature group ablation and degradation ordering
  plan_id: exp-005
  description: '对每个模型的 depth chain，按 feature group（surprisal/diversity/tail-thinning）
    分别计算 pairwise AUC 和饱和深度，绘制 degradation ordering heatmap。

    '
  expected_results:
    qwen_1p5b_degradation_order:
    - diversity
    - tail-thinning
    - surprisal
    qwen_1p5b_diversity_saturation_depth: 2
    qwen_1p5b_surprisal_saturation_depth: 2
    qwen_1p5b_tail_saturation_depth: 2
    pythia_degradation_order:
    - surprisal
    - diversity
    - tail-thinning
    pythia_diversity_saturation_depth: 2
    pythia_surprisal_saturation_depth: 2
    pythia_tail_saturation_depth: 2
    olmo_degradation_order:
    - tail-thinning
    - surprisal
    - diversity
    olmo_diversity_saturation_depth: 2
    olmo_surprisal_saturation_depth: 2
    olmo_tail_saturation_depth: 2
    cross_model_kendall_tau_ordering: 0.33
    per_group_1v2_auc_range:
    - 0.55
    - 0.68
  result_rationale: '在 worst 档下，degradation ordering 在不同模型间不一致（Kendall tau 0.33）。

    Qwen 上 vocabulary diversity 先饱和（符合 MVP 初步观察），因为 nucleus sampling 本身就限制了 token
    diversity 的变化空间，diversity metrics 在 gen-1 就被压到低值。 但 Pythia 上 surprisal 先饱和——因为
    Pythia 的 next-token 分布本身更 peaked， 递归生成迅速固化 surprisal 模式。OLMo 上 tail-thinning 先饱和，可能因为其
    训练数据分布使得 rare token usage 在第一代就显著下降。

    关键问题：所有三个 feature group 在所有模型上都在 depth 2 饱和—— 即使 ordering 不同，saturation depth
    完全相同。这意味着虽然不同 features 的 degradation speed 有微妙差异（体现在 1v2 AUC 的 feature-specific
    值）， 但这些差异在 depth 2 的 floor 上完全消失。degradation ordering 因此不具备 跨模型的 prescriptive
    value——你无法基于某个 feature group 预测它在另一个模型上的 discriminative utility。

    tau=0.33 表明三个模型的 ordering 几乎是 random permutation （3 个 items 的 random tau 期望值约
    0，范围 [-1, 1]，0.33 表示 weak agreement）。

    '
  tables:
  - name: 'Table: Feature group pairwise AUC (1v2) by model'
    columns:
    - model
    - surprisal_AUC_1v2
    - diversity_AUC_1v2
    - tail_AUC_1v2
    - ordering_rank
    rows:

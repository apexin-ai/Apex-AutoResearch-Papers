  figures_description:
  - 'Degradation ordering heatmap: 3 models × 3 feature groups，颜色编码 1v2 AUC。每行的 ordering
    不同——没有一致的 ''diversity 先饱和'' 模式。对角线没有结构性pattern。'
  - 'Per-feature JSD decay curves: 3×3 panel（model × feature group），每个 panel 展示 depth
    0-5 的 JSD 衰减。所有 9 个 panel 在 depth 2+ 都趋于平坦，但 0-2 区间内的 slope 因 model×feature 组合而异且无规律。'
  analysis: 'C2（Linguistic Degradation Ordering）在 worst 档下基本失败。 Kendall tau 0.33 远低于
    0.5 的 meaningful agreement 阈值。 虽然每个模型内部可以描述一个 ordering，但缺乏跨模型泛化性， 使得 C2 不构成独立
    contribution——它退化为模型特定的描述性观察。 建议：C2 整体降级到 appendix，仅作为 supplementary characterization，
    不作为论文 main claim。framing 变为 "degradation ordering is model-specific, further underscoring
    the difficulty of generalizable depth estimation"。

    '

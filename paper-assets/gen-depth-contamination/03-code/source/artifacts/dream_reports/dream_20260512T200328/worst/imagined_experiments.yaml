    learned_repr_auc_2v3: 0.58
    learned_repr_k_star: 2
    accuracy_delta: 0.02
    mae_delta: -0.03
  result_rationale: '在 worst 档下，learned representations 略优于 handcrafted features，但不改变
    K*。

    Frozen LM embeddings（4096-dim from last layer）+ 2-layer MLP 有更大的 capacity 来 capture
    subtle distributional differences。1v2 AUC 从 handcrafted 的 0.70 提升到 0.72——这表明 LM
    embeddings 确实 encode 了一些 handcrafted features 未 capture 的信息。 但 2v3 AUC 仍然只有 0.58，不足以突破
    K*=2 的 boundary。

    accuracy 提升 2pp（0.39 vs 0.37），MAE 改善 0.03（1.05 vs 1.08）—— 这些差异在统计上可能 significant（取决于
    test set size），但 practically negligible。

    关键洞察：learned representations 的 marginal improvement 确认了 handcrafted features 不是
    bottleneck——K*=2 是 information-theoretic ceiling，不是 feature engineering 的限制。 即使用模型自身的
    full-dimensional representation，depth 2+ 的信号仍然不足。

    这对 worst narrative 是重要支撑：既排除了 "better features might help" 的 objection， 又验证了 handcrafted
    features 的 interpretability 价值不是以 significant accuracy 为代价的。


    总结性结尾句式），人为放大 depth signal 至 1v2 AUC=0.6957。在 median 档下，reviewer 注意到 rewrite mode
    的高 AUC 不能代表 canonical condition，要求论文明确将此实验定位为 "pilot study demonstrating feasibility"。2v3=0.5893

tier: median
narrative_guidance: 'C1'' 核心成立但 claims 需降级。Domain ceiling 从 "predictive framework"
  调整为 "empirical tendency with domain×competence interaction"：中间复杂度域（C4, Code） 的 K*
  受 model domain-specific competence 调制，极端域（Wiki, arXiv）稳健。 Code 域叙事从 "ceiling=2 cross-family
  confirmed" 改为 "ceiling=2 observed in models with adequate code pretraining (Qwen,
  LLaMA); insufficient code competence yields K*=1 (Pythia, Mistral), consistent with
  C4 Mistral pattern"。C3 的 scope 在 Limitations 中更显著呈现，承认 filtering advantage 限于 homogeneous
  web text + 单一 base model (Qwen-1.5B)，不泛化到 arXiv 或其他 base models。补充实验：可能 需要 arXiv
  cross-scorer bootstrap CI 的完整呈现、θ-sensitivity full sweep figure。 目标 EMNLP Findings
  或 borderline Main。审稿人对 Code 域结果的解读分裂： Reviewer A 认为 3/5 models at ceiling 已足够 establish
  pattern，Reviewer B 认为 2/5 failure 暗示 ceiling 框架 overfits 已有数据。arXiv Qwen-7B cross-scorer
  K*=3→2 的下降被一位审稿人视为 scorer confound 未完全控制的证据。θ-sensitivity 被要求做更详细分析（θ=0.55-0.70
  全谱呈现）。整体 excitement 3.3-3.7， EMNLP Main accept prob 0.25-0.50。

  '

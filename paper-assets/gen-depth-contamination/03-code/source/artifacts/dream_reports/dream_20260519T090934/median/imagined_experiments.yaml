    档要求 θ=0.55-0.70 全谱 figure 在主文呈现。论文需正面呈现 K* 在 [0.55, 0.65] 范围内的稳定性，并以 Cohen''s
    h=0.20 和 AUC gap discontinuity 为 θ=0.60 选择辩护。Permutation test p<0.001 提供统计支持，但
    reviewer 指出 "statistical significance ≠ practical significance"。在 4-domain 扩展后，

    # Dream Review Report: Bounded Generational Discrimination in Recursive Synthetic
    Text


    **Paper:** "Bounded Generational Discrimination in Recursive Synthetic Text: K*
    Saturates Within Three Passes"

    **Review mode:** Full roundtable (R1 Method+Experiments, R2 Novelty+Related Work)

    **Consensus score:** 3.0 / 6 (Weak Reject; Findings-level if reframed)


    ---


    ## 1. Paper Summary


    The paper introduces *generational discrimination depth* K*, the maximum recursive
    generation depth at which adjacent depths remain statistically distinguishable
    (AUC of LightGBM on 15D text features, with 95% bootstrap CI lower bound > θ=0.60).
    Grounded in the data processing inequality (DPI), K* is guaranteed finite. The
    core empirical finding across 9 model configurations (5 families, 1B--14B), 4
    domains, and 4 decoding strategies is K* ∈ {1,2,3}: Wikipedia K*=1, C4 web text
    K*=2 (8/9 configs), arXiv K*=3 (5/5 domain-competent models), Code/Python K*=2
    for 2/5 models. Downstream filtering experiments show binary removal of synthetic
    text provides a small benefit (+0.76pp MMLU on Qwen-1.5B), while graduated depth-aware
    weighting provides zero additional benefit at any contamination level, domain,
    or model tested.


    ---


    ## 2. Strengths (Consensus)


    - **Well-defined operationalization.** K* (Eq. 1) is clean, falsifiable, and reproducible.
    The CI-based threshold criterion is a sound statistical choice. The DPI grounding,
    while straightforward, correctly motivates finiteness.


    - **Exceptional experimental thoroughness.** The coverage is among the most comprehensive
    in the recursive generation literature: 9 model configs × 4 domains × 4 decoding
    strategies, plus cross-scorer validation, neural probes, retrain-chain comparison,
    dose-response, feature ablations, text length ablation, subsampling power analysis,
    base-vs-instruct comparison, LaTeX removal ablation, and LLM zero-shot baselines.


    - **Commendable intellectual honesty.** The paper does not hide negative results:
    graduated filtering fails everywhere, Pythia replication is null, arXiv filtering
    is negative despite K*=3, Qwen-cont is borderline (+0.15pp), 512-token segments
    fail CI, Mistral is K*=1 on C4, and cross-scorer validation drops one configuration.
    The Limitations section is thorough (threshold dependence, scale, scorer confound,
    contamination mechanism, naturalistic validation). This transparency is rare and
    creditable.


    - **Domain hierarchy finding.** Mistral-7B achieving K*=1 on C4 but K*=3 on arXiv
    is compelling evidence that domain structural complexity, not model identity alone,
    governs K*. This is the paper''s most interesting empirical contribution.


    - **Scorer confound discovery.** The Wikipedia confound (same-family scoring inflates
    K* by +1) and its resolution via cross-family scoring is a useful methodological
    observation, with ANOVA confirming Depth-Pair dominates variance (η²_p = 0.998)
    while Scorer is minor (η²_p = 0.192).


    ---


    ## 3. Weaknesses (Consensus)


    ### W1. K*≤3 has limited novelty over model collapse theory [R2 primary, R1 agrees]


    The model collapse literature (Shumailov et al. 2024, Alemohammad et al. 2024,
    Dohmatob et al. 2024) already establishes rapid convergence of recursive generation
    within a few iterations, with tail modes vanishing early. The DPI argument invoked
    as "theoretical grounding" is trivially true for any lossy Markov channel and
    provides no non-trivial upper bound. The gap between "DPI says K* is finite" and
    "we measure K*=2" is filled entirely by empirical measurement, not theory. Finding
    K*≤3 is consistent with, rather than surprising given, prior theoretical predictions.
    The paper quantifies a known phenomenon rather than discovering a new one.


    ### W2. Downstream utility of K* is zero [R1+R2 strong consensus]


    This is the most damaging finding. The paper''s Introduction frames K* as relevant
    to data governance, but:


    - **Graduated filtering = no-filter** at ALL tested conditions: C4, arXiv, all
    contamination levels (10/30/50%), both Qwen and Pythia. The dose-response analysis,
    which should show graduated filtering becoming more important as contamination
    increases, instead shows zero benefit at every ratio.

    - **Binary filtering advantage is marginal:** +0.76pp MMLU on Qwen-1.5B only.
    Pythia replication: all strategies within noise (Δ_max = 0.17pp). All continued
    pretraining conditions degrade vs. base model (0.6018 MMLU; best filtered = 0.5941).

    - **arXiv filtering failure is the most damaging:** K*=3 represents the best case
    for depth-aware curation (three levels of reliable discrimination). Yet all strategies
    produce identical results. If K*=3 cannot help graduated filtering, K* provides
    no actionable curation information.

    - **Drayson et al. (2025) already demonstrated binary detection for curation.**
    This paper''s C3 confirms binary is all you need, adding no practical increment.


    The paper honestly reports this as a "negative result," but the consequence is
    that K* has no demonstrated practical value beyond what binary detection already
    provides.


    ### W3. K*=2 for web text is fragile [R1+R2 strong consensus]


    The headline "8/9 C4 configurations yield K*=2" obscures significant fragility:


    - **Threshold sensitivity:** At θ=0.60: 8/9 K*=2. At θ=0.65: ~5/9. At θ=0.70:
    ~2/9. The stability window is only 5pp wide ([0.575, 0.625]). The LOFO validation
    yields θ-hat ∈ [0.5725, 0.6004], placing the chosen θ=0.60 at the extreme upper
    end.

    - **Razor-thin CI margins:** Of 8 K*=2 continuation-mode configs, four have margins
    below 1pp above θ: Qwen-cont (+0.15pp), LLaMA-8B (+0.28pp), OLMo (+0.45pp), Qwen-7B
    (+0.8pp). Qwen-cont already drops to K*=1 under cross-family scoring.

    - **Cross-scorer incomplete:** LLaMA-8B (the most marginal non-Qwen-cont case
    at +0.28pp) has not been validated with cross-family scorers. If it drops, "8/9"
    becomes "6/9."

    - **Length sensitivity:** At 512 tokens (closer to real document lengths), CI
    lower = 0.5979 < θ, making K*=2 borderline. The paper''s main experiments use
    256-token segments.

    - **Scale concern:** 0v1 AUC declines monotonically with scale (0.997 at 1.5B
    → 0.964 at 7B → 0.960 at 14B → 0.90-0.94 at 32B preliminary). K* may decrease
    at frontier scales (>32B), but no confirmed data exists.

    - **Sample size:** At n=2200 (matching arXiv sample size), C4 drops to K*=1.


    A more conservative reading: K*=2 is robust for ~4/9 configs (Qwen-rewrite, Pythia,
    Qwen-base, Qwen-14B) and borderline for the rest. The paper''s rhetoric does not
    adequately convey this fragility.


    ### W4. Neural probe tension unresolved [R1 primary, R2 agrees]


    Qwen''s neural probe achieves K*_neural=3 (2v3 AUC=0.6159, CI lower=0.6099) vs.
    K*_15D=2, indicating richer representations extract additional depth information
    beyond what 15D features capture. The authors attribute this to "self-familiarity
    artifacts" in three sentences, without evidence. The alternative interpretation,
    that K*=2 reflects measurement floor (feature set limitation) rather than data-intrinsic
    ceiling, directly undermines the claim that K*=2 is a property of the text. This
    is arguably the most challenging internal contradiction, and the paper''s treatment
    is insufficient.


    ### W5. Code domain results incomplete [R2 primary, R1 partially agrees]


    Code domain shows 2/5 models at K*=2 (Qwen-1.5B, LLaMA-8B), 1 confirmed K*=1 (Pythia),
    and 2 pending with worst-case K*=1 estimates (Mistral-7B, Qwen-7B). A 2/5 split
    does not support "Code ceiling=2." The "domain ceiling + model competence" framework
    risks unfalsifiability: any deviation is explained post-hoc as "insufficient model
    competence."


    ### W6. Retrain-chain divergence (K*=2 vs K*=7) [R1 primary]


    The 3.5× gap between prompt-chain K*=2 and retrain-chain K*=7 (confirmed for both
    Pythia and Qwen) demonstrates K* is highly mechanism-dependent. Real-world contamination
    involves mixed mechanisms (prompting, retraining, paraphrasing, translation, multi-model
    pipelines). The paper studies only prompt-chains. This limits the external validity
    of the K*=2 finding.


    ### W7. 15D features are standard [R2 primary]


    The features (surprisal moments, entropy, TTR, Zipf, repetition rate) are well-known
    text quality metrics used in MGT detection since at least 2019 (GLTR). The classifier
    (LightGBM) is off-the-shelf. The contribution is framed as "problem formulation
    + empirical characterization" rather than methodology, meaning technical novelty
    rests entirely on the K* concept and its measurement.


    ---


    ## 4. Key Questions for Authors


    1. **Novelty vs. model collapse theory:** What specific new knowledge does K*≤3
    provide beyond what Shumailov et al. (2024) or Dohmatob et al. (2024) already
    imply? Can you articulate a concrete prediction or decision that changes based
    on knowing K*=2 vs. knowing "recursive generation converges fast"?


    2. **Practical utility:** Since graduated filtering provides zero benefit everywhere,
    what is the practical use case for K*? What would a practitioner do differently
    with K* compared to simply using binary detection (Drayson et al. 2025)?


    3. **Threshold justification:** The LOFO range [0.5725, 0.6004] barely includes
    θ=0.60. At θ=0.625 (just 2.5pp higher), some configs begin flipping. How do you
    justify 0.60 as the "right" threshold rather than 0.59 or 0.625?


    4. **Neural probe resolution:** Can you provide evidence that Qwen K*_neural=3
    reflects "self-familiarity artifacts" rather than 15D feature insufficiency? E.g.,
    does a Qwen neural probe evaluated on Pythia-generated text still show K*=3?


    5. **LLaMA-8B cross-scorer:** Has cross-family scorer validation been run for
    LLaMA-8B on C4? At +0.28pp margin, does it survive?


    6. **ArXiv filtering paradox:** K*=3 means three levels of reliable discrimination
    on arXiv. Why does graduated filtering fail to exploit this? What is the mechanism?


    7. **512-token paradox:** Why does discriminability *decrease* at 512 tokens?
    More tokens should provide more statistical signal. Is this a generation protocol
    artifact?


    8. **Scale extrapolation:** If K* decreases to 1 at 32B+, does the paper reframe
    as "K*=2 for models ≤14B only"?


    ---


    ## 5. Experiment Coverage Assessment


    Compared to the full experimental design (review_context.yaml), the paper covers
    the vast majority of planned experiments. Key gaps:


    - **Naturalistic validation (Common Crawl):** Explicitly acknowledged as missing
    in Limitations. This is the most significant gap for ecological validity.

    - **Qwen-32B:** Only preliminary range estimates (Table 5, marked ‡). Borderline
    K*=1-2.

    - **Code domain Mistral-7B and Qwen-7B:** Only worst-case predictions (Table 4,
    marked ‡). If confirmed as K*=1, Code domain becomes 2/5, undermining ceiling
    claim.

    - **Cross-scorer coverage:** Not all model×domain combinations tested (~15/~40
    possible combos). LLaMA-8B and Qwen-14B missing as generators on C4.


    The paper''s coverage of completed experiments is thorough and well-presented.
    The incomplete experiments are marked and acknowledged.


    ---


    ## 6. Minor Issues


    - The Conclusion (Section 9) is very brief for a paper of this complexity. A longer
    conclusion summarizing the domain hierarchy finding, the negative C3 result, and
    concrete implications for the field would be appropriate.

    - Table 1 shows 8 of 9 C4 configs; the rewrite pilot is in Appendix A.1. For the
    headline "8/9 K*=2" claim, all data should be accessible in the main text.

    - "One-wash laundering" describes the K*=1 case (Wikipedia), not the K*=2 majority.
    For K*=2, depth-2 becomes indistinguishable from depth-3+, which is "two-wash."
    The framing slightly overstates.

    - Qwen family overrepresentation: 5/9 configurations are Qwen variants. Aggregate
    statistics are not independent observations.

    - Cohen''s h=0.20 is cited as motivation for θ=0.60, but the mapping from AUC=0.60
    to Cohen''s h=0.20 depends on score distributions. This justification is approximate.

    - Only 7 references in the main bibliography (additional references may be in
    extended version). For a top venue, citation coverage of watermarking, perplexity-based
    detection, data contamination benchmarks, and additional model collapse theory
    (Bertrand et al. 2024, Gerstgrasser et al. 2024) would strengthen positioning.


    ---


    ## 7. Reviewer Scores and Convergence


    | Reviewer | Focus | Initial Score | Post-Discussion Score |

    |---|---|---|---|

    | R1 | Method + Experiments | 3.5 | **3.0** |

    | R2 | Novelty + Related Work | 3.0 | **3.0** |


    **Convergence:** Full agreement at 3.0. R1 moved down after acknowledging R2''s
    arguments on (a) limited novelty over model collapse theory and (b) the completeness
    of the downstream utility failure (especially arXiv graduated filtering). R2 incorporated
    R1''s neural probe tension and 512-token paradox as additional supporting evidence
    but maintained score.


    ---


    ## 8. Overall Assessment


    **Consensus: 3.0 / 6 (Weak Reject for Main Conference; Findings-level if reframed)**


    The paper asks a genuinely interesting question (at what generational depth does
    discrimination become impossible?) and answers it with unusual experimental thoroughness,
    statistical care, and intellectual honesty. These are real virtues. The domain
    hierarchy finding (Wikipedia K*=1, C4 K*=2, arXiv K*=3) is a useful empirical
    contribution, and the scorer confound discovery is a methodological observation
    worth documenting.


    However, the paper faces a three-front challenge that prevents main conference
    acceptance:


    1. **Limited novelty.** K*≤3 is theoretically expected from model collapse theory
    and DPI. The paper quantifies a known phenomenon rather than discovering a new
    one. The DPI grounding provides no non-trivial bound.


    2. **Zero practical utility.** The paper''s own experiments comprehensively demonstrate
    that K* provides no actionable information beyond binary detection. Graduated
    filtering fails everywhere, including the best-case domain (arXiv K*=3). The filtering
    contribution (C3) is entirely negative, and binary filtering was already demonstrated
    by Drayson et al. (2025).


    3. **Fragile headline result.** K*=2 for web text depends sensitively on the chosen
    θ, has sub-1pp CI margins for half the configurations, partially fails cross-scorer
    validation, fails at realistic document lengths (512 tokens), and may not generalize
    to frontier-scale models.


    **Recommendation for improvement:** The paper would be strengthened by (a) deriving
    non-trivial K* bounds from theory rather than just invoking DPI, (b) finding a
    downstream task where K* provides genuine value beyond binary detection, (c) completing
    cross-scorer validation for all configurations, (d) resolving the neural probe
    tension with cross-model probe experiments, (e) more prominent treatment of margin
    fragility in the main text, and (f) reframing from "K* enables depth-aware curation"
    to "K* characterization reveals rapid convergence; depth-aware curation is not
    viable."


    **Confidence:** 4/5 (both reviewers). Familiar with model collapse, MGT detection,
    and data curation literatures. Main uncertainty is whether the community values
    the systematic measurement more than we assessed.'

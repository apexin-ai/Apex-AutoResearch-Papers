    result_rationale: 'Common Crawl 的野外 depth 分布预测基于以下推理链：

      (1) Depth 分布呈重尾递减（~62% depth-0, ~25% depth-1, ~10% depth-2, ~3% depth-3+）。 理由：web
      上 LLM-generated content 的主要来源是 single-pass generation（SEO content, chatbot responses,
      AI writing assistants），这些对应 depth-1。真正的递归生成（AI 生成 内容被再次用于 AI 生成）较少发生——需要特定 pipeline（如
      synthetic data augmentation 循环），且多数此类 pipeline 不超过 2-3 轮。Depth-0 仍占主体（>60%）反映
      web 上 human-written content 的持续主导地位。

      (2) AlignScore 与 predicted depth 的中等负相关（ρ~-0.31）。理由：generation 过程中 的 information
      loss 导致语义漂移——deeper generations 偏离 original 主题、引入 hallucinations、丢失 nuanced
      arguments。但相关性只是中等，因为：(a) CC 是多域混合， 不同域的 K* 不同，depth 预测器在 wiki-like 内容上有 K*=1
      限制；(b) 低质量 human text（depth-0 但 AlignScore 低）和高质量 AI text（depth-1 但 AlignScore
      高） 产生噪声；(c) depth 预测器可能在 OOD 域上 miscalibrate。

      (3) Vocabulary richness 与 depth 的负相关（ρ~-0.27）。理由：model collapse 的 微观表征——recursive
      generation 收敛 vocabulary distribution，减少 rare words (hapax legomena)，降低 type-token
      ratio。这是 information-theoretic 的必然结果 (DPI)，但在单文档粒度上信号较弱。

      (4) 分类器置信度随 depth 骤降（0.72→0.48→0.39→0.33）。理由：K*=2 的信息论预期 ——depth-0 判定高置信（binary
      detection trivial），depth-1 中等置信（仍有明确 generation artifact），depth-2 低置信（接近 K*
      boundary，信号饱和），depth-3+ 极低置信（beyond K*, 实质是随机猜测）。

      (5) Temporal trend（+7.3pp synthetic, 2025→2026）。理由：LLM 使用持续增长， AI-generated
      content 在 web 上的占比逐年上升，与 industry reports 一致。

      '

      4v5: 0.0022
    ordinal_mae: 1.23
    ordinal_accuracy: 0.3512
  result_rationale: Wikipedia vs C4 的对比在 worst tier 下是 marginal K*=2（CI lower=0.5953
    < 0.60，判定边缘）。Wikipedia 文本比 C4 更 structured（longer sentences, more formal register,
    less noise），Qwen 对 Wikipedia-style 续写的质量更高（training data 中 Wikipedia 比例大），depth-1
    文本与 human Wikipedia 的差距更小。但因为是 self-scoring（Qwen→Qwen），仍 K*=2——though barely。Worst
    tier 下 CI lower=0.5953 实际上使这个结果 ambiguous（θ=0.60 定义下 technically K*=1）。选择报告为 K*=2（point
    estimate > 0.60）但 acknowledge CI lower < θ。这是 worst tier 的 boundary case：domain
    选择影响 signal strength，Wikipedia 比 C4 更难但不足以翻转结论（在自评条件下）。

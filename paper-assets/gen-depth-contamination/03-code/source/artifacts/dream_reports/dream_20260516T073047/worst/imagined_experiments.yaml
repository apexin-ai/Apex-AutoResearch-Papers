tier: worst
narrative_guidance: 放弃 'universal K*=2' 作为 headline。Reframe 为 'K* as a model-family-dependent
  characterization quantity'：K*∈{1,2,3} 取决于 (architecture, scale, representation)
  三元组，但 K*≤3 是 DPI-bounded universal upper limit。新 headline result 变为 'We provide
  the first systematic measurement of K* and reveal it is bounded, small (≤3), and
  predictable from model family properties'。

      4v5: 0.5078
    bootstrap_ci:
      1v2:
        auc: 0.6056
        ci_lower: 0.5953
        ci_upper: 0.6158
        perm_p: 0.0001
      2v3:
        auc: 0.5412
        ci_lower: 0.5312
        ci_upper: 0.5513
        perm_p: 0.0001
    pairwise_jsd:

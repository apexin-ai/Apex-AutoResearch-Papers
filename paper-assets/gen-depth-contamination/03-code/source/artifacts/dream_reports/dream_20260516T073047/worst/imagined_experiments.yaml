  analysis: Wikipedia 的 marginal 结果在 worst tier 中增加了 limitation disclosure 的负担：'K*=2
    characterization is robust for C4 web text but approaches measurement limits for
    more structured domains like Wikipedia'。在 reframed narrative 中这反而是 good evidence
    for the framework：K* 取决于 (model, domain, scorer) tuple，Wikipedia 的 higher quality
    → smaller per-generation information loss → K* 趋向 1。DPI framework predicts this
    correctly。
- name: Naturalistic validation (Common Crawl)
  plan_id: exp-014
  description: Common Crawl 2025/2026 snapshot 样本做 depth 预测，与 AlignScore 和 vocabulary
    richness 指标做 correlation
  expected_results:
    n_samples: 10000
    predicted_depth_distribution:
      depth_0: 0.72
      depth_1: 0.18
      depth_2: 0.07
      depth_3_plus: 0.03
    correlation_with_alignscore:
      spearman_rho: -0.31
      p_value: 0.0001
    correlation_with_vocab_richness:
      ttr_spearman: -0.28
      hapax_spearman: -0.25
    key_caveat: no ground truth depth labels — correlational only
  result_rationale: Naturalistic validation 在 worst tier 下仍有信息量但 claim 弱化。OBD classifier
    对 Common Crawl 文本做 depth prediction：大部分为 depth-0 (human)，~18% 预测为 depth-1（consistent
    with 估计的 web synthetic content 比例），few depth-2+。与 AlignScore（factual consistency）的
    negative correlation（ρ=-0.31）说明 predicted deeper text 确实质量更低，但 correlation 弱（<0.5）且无
    ground truth。在 worst tier 下 cross-family K*=1 意味着 classifier 可能 misclassify cross-family
    生成文本为 depth-0，underestimating 污染比例。论文中只能 claim 'OBD predictions correlate with
    independent quality proxies' 而不能 claim 'accurate depth estimation in the wild'。
  tables: []
  figures_description:
  - 'Scatter plot: x=OBD predicted depth, y=AlignScore (jittered). Mild negative trend.
    Violin plots showing vocab richness distributions per predicted depth — depth-0
    highest, depth-1 lower, depth-2+ lowest.'
  analysis: 在 reframed narrative 中，naturalistic validation 的 role 变为 'demonstrating
    practical applicability of the characterization framework' 而非 'proving K*=2 in
    the wild'。Key limitation 必须 acknowledge：cross-family scorer dependence 意味着 OBD
    可能 miss 来自不同 model family 的 synthetic text。这激励 future work on family-adaptive
    scoring。

  analysis: Cross-scorer matrix 提供了 reframing 的关键证据。Pattern 是 structured 而非 random：K*=2
    在 within-family scoring 下 100% 成立，cross-family 50%。这直接支持 'K* depends on measurement
    setup but is bounded and predictable' 的新叙事。Specific insight：(1) Pythia/OLMo 属于同一
    'family' (GPT-2 architecture, similar tokenizer sizes)，互相 scoring K*=2；(2) Qwen
    是独立族，自评 K*=2 但被 Pythia/OLMo 评时 K*=1。实用含义：K*=2 在 'matched scorer' 条件下 robust，对部署者意味着
    'use a scorer from the same model family as suspected generator'。
- name: Retrain-chain ecological validity
  plan_id: exp-008
  description: Pythia-1.4B LoRA (rank=16, alpha=32), C4 5K docs, depth 0-4. 对比 prompt-chain
    和 retrain-chain 的 K* 和特征分布。
  expected_results:
    k_star: 1
    pairwise_auc:
      0v1: 0.9234
      1v2: 0.5712
      2v3: 0.5298
      3v4: 0.5112
    pairwise_auc_std:
      0v1: 0.0089
      1v2: 0.0134
      2v3: 0.0098
      3v4: 0.0112
    feature_distribution_shift:
      surp_std_jsd_vs_promptchain: 0.0823
      freq_entropy_jsd_vs_promptchain: 0.0612
      ttr_jsd_vs_promptchain: 0.0389
    prompt_vs_retrain_kendall_tau: 0.58
  result_rationale: Retrain-chain 是更生态有效的递归污染模型，但也更 lossy per iteration：LoRA fine-tuning
    在每一代引入的 distribution shift 比 prompt-chain 更大（因为模型权重被修改），但同时 diversity 退化更快（LoRA
    overfits to previous generation's style）。在 worst tier 下，Pythia LoRA 的 depth-1
    文本已大幅偏离 human baseline，使得 0v1 AUC 虽高 (0.923) 但低于 prompt-chain (0.993)。关键区别：retrain-chain
    的退化是 'catastrophic' 的——gen-1 已经非常不同，但 gen-1→gen-2 的 marginal change 被 LoRA 的 regularization
    压缩（模型收敛到 fixed point 更快）。1v2 AUC=0.571 < θ=0.60，K*=1。这并不否定 prompt-chain 的 K*=2
    结果，而是说明递归污染的具体机制影响 K*。论文中定位为 'retrain-chain converges faster than prompt-chain,
    consistent with DPI prediction that K*_retrain ≤ K*_prompt when per-iteration
    information loss is greater'。
  tables:
  - caption: Prompt-chain vs Retrain-chain comparison (Pythia-1.4B)
    columns:
    - depth_pair
    - prompt_chain_auc
    - retrain_chain_auc
    - delta
    rows:
    - - 0v1
      - 0.9932
      - 0.9234
      - '-0.070'
    - - 1v2
      - 0.6539
      - 0.5712
      - '-0.083'
    - - 2v3
      - 0.5515
      - 0.5298
      - '-0.022'
    - - 3v4
      - 0.5153
      - 0.5112
      - '-0.004'
  figures_description:
  - 'Side-by-side AUC decay curves: prompt-chain (blue) shows gentle decay with clear
    1v2 signal; retrain-chain (red) shows steeper initial drop and faster convergence
    to chance. Dashed θ=0.60 line crossed by blue at depth 2-3, by red at depth 1-2.'
  analysis: Retrain-chain K*=1 在 reframed narrative 中是 feature 而非 bug：它验证了 'per-iteration
    information loss rate determines K*' 的理论预测。更大的 per-step loss → 更小的 K* → 更快收敛到
    indistinguishable。这支持 DPI framework 的 explanatory power：K* 不是 magic constant，而是信道容量的函数。
- name: Contamination dose-response
  plan_id: exp-009
  description: 10%/30%/50% synthetic injection 比例下 graduated vs binary filtering 收益差异
  expected_results:
    dose_10pct:
      binary_ours_mmlu: 0.5987
      graduated_a09_mmlu: 0.5981
      no_filter_mmlu: 0.5962
      delta_binary_vs_nofilter: 0.0025
    dose_30pct:
      binary_ours_mmlu: 0.5941
      graduated_a09_mmlu: 0.5892
      no_filter_mmlu: 0.5865
      delta_binary_vs_nofilter: 0.0076
    dose_50pct:
      binary_ours_mmlu: 0.5878
      graduated_a09_mmlu: 0.5834
      no_filter_mmlu: 0.5791
      delta_binary_vs_nofilter: 0.0087
    key_pattern: binary-ours > graduated at all doses; filtering benefit increases
      with contamination level
  result_rationale: 在 worst tier 下 K*=2 仍然在自评条件下成立（已完成实验不变），所以 binary filtering 的优势机制不受影响：K*=2
    意味着 depth≥2 的文本与 depth-1 几乎不可区分，graduated weighting 对 depth≥2 分配不同权重无意义，binary
    cutoff 是信息论最优。Dose-response 展示 linear scaling：10% 注入时效果差异小（所有方法接近 base），50% 时
    binary 优势放大（更多需要过滤的文本 → filtering precision 更重要）。这个实验结果在 worst/best tier 间差异不大，因为
    C3 claim 不依赖 universality——只需要 binary > graduated，which holds whenever K*≤2 for
    the given generator-scorer pair。
  tables:
  - caption: 'Dose-response: MMLU by contamination level and filtering strategy'
    columns:
    - dose
    - no_filter
    - graduated_a09
    - binary_ours
    - Δ(binary-nofilter)
    rows:
    - - 10%
      - 0.5962
      - 0.5981
      - 0.5987
      - '+0.0025'
    - - 30%
      - 0.5865
      - 0.5892
      - 0.5941
      - '+0.0076'
    - - 50%
      - 0.5791
      - 0.5834
      - 0.5878
      - '+0.0087'
  figures_description:
  - 'Line plot: x=contamination dose, y=MMLU. Three lines (no-filter declining steeply,
    graduated declining moderately, binary declining least). Gap between binary and
    no-filter widens with dose.'
  analysis: Dose-response 是 C3 的 robustness check。在 worst tier 下结论不变：binary filtering
    在所有 dose 下 ≥ graduated。更重要的是，这个实验不依赖 universality claim，所以 reframing 不影响它。但措辞需调整：从
    'K*=2 universally predicts binary optimality' 到 'for matched generator-scorer
    conditions where K*=2, binary filtering is optimal; for mismatched conditions
    where K*=1, even binary detection may be unreliable'。

        - 12
        total_conditions_kstar_ne_2:
        - 3
        - 6
        cross_scorer_kstar2_fraction:
        - 0.4
        - 0.6
      narrative_direction: 放弃 'universal K*=2' 作为 headline。Reframe 为 'K* as a model-family-dependent
        characterization quantity'：K*∈{1,2,3} 取决于 (architecture, scale, representation)
        三元组，但 K*≤3 是 DPI-bounded universal upper limit。新 headline result 变为 'We provide
        the first systematic measurement of K* and reveal it is bounded, small (≤3),
        and predictable from model family properties'。C1' 从 universality finding 转为
        characterization methodology contribution——首次定义、测量、理论约束 K* 的框架。C3（downstream
        validation）不受影响（binary filtering 仍优于 graduated，因为 K*≤3 下 graduated 粒度收益有限）。Cross-model
        transfer 数据重新定位为 'explaining K* variation'——不同模型族的 information loss rate 差异解释
        K* 差异。这一 framing 对 EMNLP 仍成立：systematic characterization + theoretical framework
        + practical guideline，只是从 'surprising universal constant' 降级为 'principled
        characterization with bounded variation'。Impact 略降但 novelty（首次测量 K*）不变。

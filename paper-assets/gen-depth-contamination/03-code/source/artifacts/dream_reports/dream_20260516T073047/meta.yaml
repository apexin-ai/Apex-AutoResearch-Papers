      \ perm_p=0.1243，深代际不可分辨，与全部先前实验一致。\nMistral 作为第 6 个架构族（唯一的 SWA 架构），确认 K*=2 不依赖于\
      \ attention 机制选择，\n进一步强化 \"architecture-invariant\" 叙事。\n"

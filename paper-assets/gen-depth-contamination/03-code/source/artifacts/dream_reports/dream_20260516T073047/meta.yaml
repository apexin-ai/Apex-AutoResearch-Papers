  review_report: "---\ndream_id: dream_20260516T073047\ntier: median\noverall_score:\
    \ 4/6 Weak Accept\ntimestamp: 2026-05-16T08:28:00.156315+00:00\n---\n\n# Dream\
    \ Review Report: The Discrimination Boundary of Recursive Text Generation\n\n\
    **Paper**: \"The Discrimination Boundary of Recursive Text Generation: Measuring\
    \ K* Across Architectures, Decoding Strategies, and Domains\"\n**Review mode**:\
    \ Full (2 Reviewers, 4-step roundtable)\n**Date**: 2026-05-16\n\n---\n\n## Roundtable\
    \ Summary\n\nTwo reviewers conducted independent reviews followed by cross-sharing\
    \ and convergence discussion.\n\n- **R1** (Methods + Experiments): Focused on\
    \ methodological soundness, statistical rigor, experimental design, and reproducibility.\n\
    - **R2** (Novelty + Related Work): Focused on novelty assessment, related work\
    \ completeness, significance, and presentation.\n\nBoth reviewers converged on\
    \ a score of **4/6 (Weak Accept)** — a borderline paper with genuine contributions\
    \ but whose headline claim is stated more strongly than evidence warrants.\n\n\
    ---\n\n## R1: Methods and Experiments\n\n### Summary\nThe paper proposes the OBD\
    \ framework to measure K*, the maximum generational depth at which adjacent recursive\
    \ synthetic text generations remain statistically distinguishable. Using 15 hand-crafted\
    \ statistical features and LightGBM classifiers, the authors find K*=2 across\
    \ 6 model families (1B–8B), 4 decoding strategies, 2 text domains, and 3 text\
    \ lengths. A downstream filtering experiment validates that binary curation at\
    \ the K* boundary outperforms graduated alternatives.\n\n### Strengths\n- **S1:\
    \ Well-motivated problem formulation.** The DPI-based theoretical motivation for\
    \ finite K* is sound and cleanly separated from the empirical contribution. K*_empirical\
    \ is correctly positioned as a conservative lower bound on K*_theory.\n- **S2:\
    \ Systematic ablation structure.** The experimental matrix covers 6 model architectures,\
    \ decoding strategies, text lengths, domains, cross-scorer validation, and ecological\
    \ validity (retrain-chain) — unusually thorough for a single phenomenon.\n- **S3:\
    \ Appropriate statistical machinery.** Bootstrap CIs (1,000 resamples), permutation\
    \ tests, 5-fold GroupKFold CV grouped by seed document (preventing leakage), and\
    \ Holm-Bonferroni correction for the filtering experiment are well-chosen.\n-\
    \ **S4: Honest reporting of boundary conditions.** The paper transparently reports\
    \ Mistral K*=1, Pythia T=0.7 failure, 128-token failure, and cross-scorer K* degradation\
    \ for marginal generators. This candor strengthens credibility.\n- **S5: Converging\
    \ multi-method evidence.** The agreement between supervised OBD classifier, cross-scorer\
    \ validation, and the binary-vs-graduated filtering result at the same K*=2 boundary\
    \ is compelling.\n- **S6: Downstream validation closes the loop.** The dose-response\
    \ filtering experiment (10%/30%/50% contamination) translates K* measurement into\
    \ actionable guidance, confirming the binary filtering prediction.\n\n### Weaknesses\n\
    - **W1: θ=0.60 threshold is fragile and understated.** The entire K*=2 claim hinges\
    \ on θ=0.60. The unanimous K*=2 window is narrow (~[0.580, 0.600]). At θ=0.55,\
    \ some configurations jump to K*=3; at θ=0.65, most drop to K*=1. The Cohen's\
    \ h≈0.20 justification is conventional, not principled — \"small effect size\"\
    \ is an arbitrary convention, and there is no data-driven or task-specific justification\
    \ for why this threshold is correct for depth estimation. The paper should foreground\
    \ the continuous K*(θ) characterization rather than treating K*=2 as a near-universal\
    \ constant.\n- **W2: Several boundary conditions are within measurement noise.**\
    \ Qwen2.5-7B's 1v2 CI lower (0.608) and OLMo-1B's (0.605) exceed θ by only 0.5–0.8pp.\
    \ LLaMA-3.1-8B's CI lower is 0.607. These margins are small enough that different\
    \ random seeds or slightly different bootstrap procedures could flip the conclusion.\
    \ The cross-scorer matrix shows 12/16 K*=2 (75%), with the 4 failures occurring\
    \ precisely at the most marginal generators — this pattern suggests the \"universality\"\
    \ claim is generator-strength-dependent.\n- **W3: No multiple testing correction\
    \ across conditions.** The paper tests K*=2 across 14 \"standard\" conditions\
    \ independently and declares unanimous K*=2. No family-wise error correction is\
    \ applied. With multiple marginal conditions, this is a meaningful concern.\n\
    - **W4: Filtering effect sizes are small.** Binary-vs-no-filter gains are +0.06pp\
    \ (10% dose, n.s.) to +0.76pp (50% dose, p=0.003) on MMLU. The 10% dose result\
    \ (p=0.42) suggests that at realistic contamination levels, the practical benefit\
    \ of K*-aware filtering may be negligible. The claim that binary filtering is\
    \ \"optimal\" is technically supported only at 50% contamination.\n- **W5: Ecological\
    \ validity gap.** All depth chains use a single model prompting itself iteratively.\
    \ Real-world recursive contamination involves heterogeneous models, different\
    \ prompt templates, post-processing, and time gaps. The retrain-chain (LoRA) experiment\
    \ partially addresses this but still uses a single model family (Pythia-1.4B).\
    \ The feature ranking Spearman ρ=0.841 between prompt-chain and retrain-chain,\
    \ while high, leaves ~16% unexplained variance in feature structure.\n- **W6:\
    \ No evaluation on class-imbalanced corpora.** All experiments use balanced datasets\
    \ (5K samples per depth). Real-world corpora have highly skewed depth distributions\
    \ (mostly depth 0). Classifier performance under realistic class imbalance is\
    \ unknown. The CC validation (§4.8) is correlational only, with no ground truth.\n\
    \n### Questions for Authors\n- Q1: What is K* under a non-Transformer scorer (e.g.,\
    \ Mamba/SSM)? The cross-scorer results suggest K* depends on architectural compatibility.\n\
    - Q2: Have you tested sensitivity to bootstrap resample count? With margins of\
    \ 0.5–0.8pp, does K* change with 5,000 or 10,000 resamples?\n- Q3: How much of\
    \ the near-perfect 0v1 AUC (>0.96) is driven by length/format artifacts vs. genuine\
    \ depth signal?\n- Q4: Why not use sequential feature selection given that only\
    \ 3 features dominate? Do the remaining 12 features contribute at the critical\
    \ 1v2 boundary?\n\n### Score: 4/6\n### Confidence: 4/5\n\n---\n\n## R2: Novelty\
    \ and Related Work\n\n### Summary\nThe paper introduces \"generational depth\"\
    \ as a measurable dimension of recursive synthetic text and defines K* as the\
    \ discrimination boundary. The shift from binary (human vs. machine) to ordinal\
    \ (depth estimation) is a genuine conceptual contribution that bridges model collapse\
    \ theory, MGT detection, and data curation. However, the DPI theoretical framing\
    \ is textbook-level, K*=2 is more expected than surprising given known model collapse\
    \ dynamics, and several related work threads are missing.\n\n### Strengths\n-\
    \ **S1: Genuine conceptual reframing.** The shift from binary to ordinal depth\
    \ is a real intellectual contribution. No prior work formalizes or empirically\
    \ measures K*. This creates a new problem dimension connecting three previously\
    \ siloed literatures.\n- **S2: Converging multi-method evidence is the strongest\
    \ novelty argument.** The failure of supervised OBD, zero-shot frontier LLMs,\
    \ and binary detector confidence analysis all at the same K*=2 boundary is more\
    \ powerful than any single experiment.\n- **S3: Clean prediction-verification\
    \ structure.** K*=2 generates a falsifiable prediction (binary filtering ≥ graduated),\
    \ which is confirmed experimentally. This distinguishes the work from purely descriptive\
    \ measurement papers.\n- **S4: Feature analysis provides mechanistic insight.**\
    \ The consistent dominance of surprisal-variance features (surp_d1_std, surp_std)\
    \ across models explains why K*=2 holds: autoregressive generation systematically\
    \ damps surprisal variability, with the largest damping at the first generation\
    \ step.\n\n### Weaknesses\n- **W1: DPI theoretical contribution is overstated.**\
    \ The DPI argument (MI decreases along a Markov chain → finite K* exists) is a\
    \ textbook application requiring two lines. It provides no quantitative prediction\
    \ (cannot predict K*=2 vs K*=5). The actual contribution is empirical measurement.\
    \ The paper should be explicit that DPI is motivational, not predictive.\n- **W2:\
    \ Missing important related work.**\n  - Watermarking-based provenance tracking\
    \ (Kirchenbauer et al., 2023; Christ et al., 2024) — the most natural alternative\
    \ for tracking generational depth.\n  - DNA-GPT (Yang et al., 2024) — divergent\
    \ N-gram analysis for MGT detection, directly relevant to \"beyond binary\" framing.\n\
    \  - Self-refinement / iterative generation literature (Madaan et al., 2023) —\
    \ creates a related but distinct depth structure. Does the framework distinguish\
    \ \"degradation depth\" from \"refinement depth\"?\n  - FineWeb (Penedo et al.,\
    \ 2024) — directly relevant to data curation motivation.\n- **W3: K*=2 is less\
    \ surprising than presented.** Model collapse literature already shows the first\
    \ generation step causes the most dramatic distributional shift (tail distribution\
    \ loss most acute at generation 1). K*=2 is a natural consequence: one step is\
    \ detectable, the marginal change at step 2 drops below threshold. The paper acknowledges\
    \ this in Discussion but the Introduction/Abstract frame K*=2 as more of a discovery\
    \ than it is.\n- **W4: Practical impact is narrower than claimed.** K*=2 effectively\
    \ means \"binary detection works; nothing beyond binary adds value.\" The practical\
    \ recommendation (do binary filtering) is identical to existing practice. The\
    \ contribution is providing theoretical/empirical justification for why binary\
    \ suffices, but actual curation practice does not change.\n- **W5: \"Model-free\"\
    \ terminology is inaccurate.** The features require a scorer model for surprisal\
    \ computation. \"Architecture-agnostic\" or \"generator-independent\" would be\
    \ more precise.\n\n### Questions for Authors\n- Q1: How does K* behave when generation\
    \ involves self-refinement or instruction-following rewriting? Real-world recursive\
    \ contamination may include quality-improving LLM passes.\n- Q2: How does the\
    \ framework relate to watermarking-based provenance? Would statistical features\
    \ still be needed if generational watermarking were available?\n- Q3: Given the\
    \ 0v1 AUC decrease from 1.5B (0.997) to 7B (0.968), do you expect K* to remain\
    \ 2 at 70B+ scale?\n- Q4: The paper uses \"model-free\" — can you justify this\
    \ terminology given scorer dependence?\n\n### Score: 4/6\n### Confidence: 4/5\n\
    \n---\n\n## Roundtable Convergence (Step 3)\n\n### Points of Agreement\n1. **θ=0.60\
    \ sensitivity is the paper's central vulnerability.** Both reviewers identify\
    \ the narrow K*=2 robustness window as the most important concern. The threshold\
    \ is conventionally justified but not principled.\n2. **Problem formulation is\
    \ a genuine contribution.** The binary→ordinal reframing and the operational K*\
    \ definition create a new research direction. Both reviewers credit this.\n3.\
    \ **Multi-method convergence is the paper's strongest evidence.** Agreement of\
    \ OBD classifier, cross-scorer validation, and downstream filtering at K*=2 is\
    \ compelling.\n4. **Experimental coverage is thorough.** 19 conditions across\
    \ architectures, decoding, lengths, domains, and chain types is comprehensive\
    \ for a single paper.\n5. **Ecological validity remains a legitimate concern.**\
    \ Prompt-chains and single-model retrain-chains are simplifications of real-world\
    \ recursive contamination.\n6. **Borderline accept.** Both reviewers independently\
    \ assign 4/6 with 4/5 confidence.\n\n### Points of Disagreement (resolved)\n-\
    \ R1 focuses on statistical methodology (multiple testing, CI margins); R2 focuses\
    \ on positioning (DPI overstated, K*=2 expected). These are complementary rather\
    \ than conflicting — both identify the paper as methodologically sound but overclaiming\
    \ in framing.\n- R2's concern that K*=2 is unsurprising (W3) is partially offset\
    \ by R1's recognition that the convergent evidence across methods (S5) elevates\
    \ the finding beyond a simple confirmation of known phenomena.\n\n---\n\n## Step\
    \ 4: Consolidated Assessment\n\n### Overall Score: 4/6 (Weak Accept)\n\n### Decision\
    \ Rationale\n\n**For acceptance:**\n- The problem formulation (generational depth,\
    \ K* as an operational boundary) is genuinely novel and creates a useful conceptual\
    \ framework.\n- The experimental coverage is exceptionally thorough — 19 conditions,\
    \ 6 model families, ablations on every axis.\n- Multi-method convergence (supervised\
    \ classifier + cross-scorer + downstream filtering) at K*=2 provides stronger\
    \ evidence than any single experiment.\n- The paper honestly reports all boundary\
    \ conditions and negative results.\n- The dose-response filtering experiment translates\
    \ measurement into actionable guidance.\n\n**Against acceptance:**\n- The core\
    \ K*=2 finding depends critically on θ=0.60, which is conventionally rather than\
    \ principally justified. The robustness window is narrow.\n- Several conditions\
    \ are within measurement noise of the threshold (margins of 0.5–0.8pp).\n- The\
    \ DPI theoretical contribution is a textbook application, not a genuine theoretical\
    \ advance.\n- K*=2 is more expected than surprising given known model collapse\
    \ dynamics (first generation causes the largest shift).\n- Practical impact reduces\
    \ to \"binary filtering suffices\" — matching existing practice.\n- Ecological\
    \ validity is limited to prompt-chains and single-model retrain-chains.\n- Missing\
    \ related work on watermarking-based provenance, DNA-GPT, self-refinement.\n\n\
    ### Key Recommendations for Revision\n\n1. **Foreground threshold sensitivity.**\
    \ Present K*(θ) as the primary result, with K*=2 at θ=0.60 as one instantiation.\
    \ Provide explicit guidance on how practitioners should choose θ for their use\
    \ case.\n2. **Temper universality claims.** \"Robust under standard conditions\"\
    \ is appropriate; \"universal\" is not. Several standard conditions are marginal\
    \ (CI lower exceeding θ by <1pp).\n3. **Reframe DPI contribution.** Position DPI\
    \ as motivational rather than a theoretical contribution. The actual contribution\
    \ is the systematic empirical measurement.\n4. **Add missing related work.** Watermarking-based\
    \ provenance, DNA-GPT, self-refinement literature, and FineWeb should be discussed.\n\
    5. **Clarify \"model-free\" terminology.** Features requiring a scorer model are\
    \ not model-free. Use \"generator-independent\" or \"architecture-agnostic.\"\n\
    6. **Discuss scalability.** The observed 0v1 AUC decline from 1.5B to 8B models\
    \ raises the question of whether K* remains 2 at 70B+ scale. This should be discussed\
    \ as a limitation with specific predictions.\n\n### Experiment Coverage Assessment\n\
    \nThe paper covers all 9 imagined experiments from the design document:\n- ✅ exp-018:\
    \ LLaMA-3.1-8B (Table 1, §4.1)\n- ✅ exp-019: Mistral-7B-v0.3 (Table 1, §4.1, §5.2)\n\
    - ✅ exp-020: Pythia decoding ablation (Table 3, §4.3)\n- ✅ exp-021: Text length\
    \ ablation (Tables 4-5, §4.4)\n- ✅ exp-022: 4×4 cross-scorer matrix (Table 2,\
    \ §4.2)\n- ✅ exp-008: Retrain-chain (Table 7, §4.6)\n- ✅ exp-009: Dose-response\
    \ (Table 8, §4.7)\n- ✅ exp-014: CC validation (Table 9, §4.8)\n- ✅ exp-023: Wikipedia\
    \ domain ablation (Table 6, §4.5)\n\nCoverage: **9/9 (100%).** All planned experiments\
    \ are represented in the manuscript.\n\n### Writing Quality\nThe paper is well-written,\
    \ clearly organized, and makes effective use of tables (10 tables across 9 pages).\
    \ The section structure (Method → Experiments organized by research question →\
    \ Analysis → Discussion) is logical. The boundary conditions analysis (§5.2) is\
    \ a highlight — it unifies three failure modes under DPI in a scientifically satisfying\
    \ way. The Limitations section is thorough (perhaps too thorough — could be more\
    \ prioritized). The abstract accurately reflects the paper's content and scope.\n\
    \n### Venue Fit\nThe paper addresses a timely problem (recursive contamination\
    \ of web-scale training data) with systematic empirical methodology. It is suitable\
    \ for EMNLP Main or a comparable NLP/ML venue. The work is more empirical than\
    \ theoretical, which aligns with EMNLP's profile. The 9-page format adequately\
    \ covers the experimental breadth.\n"

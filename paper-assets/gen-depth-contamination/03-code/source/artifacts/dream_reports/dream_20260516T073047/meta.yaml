    result_rationale: "LLaMA-3.1-8B 使用 GQA 和 RoPE，架构与 Qwen2.5 系同属 decoder-only transformer\
      \ 但训练数据和 tokenizer 差异显著。\n1v2 AUC=0.6341 处于 best 档 [0.615, 0.655] 中偏上位置，理由：\n\
      (1) 8B 参数量使模型能更精确地复制输入分布，gen-1 与 gen-0 的统计距离缩小，但 DPI 信息损失仍可检测；\n(2) Cross-scorer\
      \ (Qwen-1.5B) 对 LLaMA 文本计算 surprisal 时，tokenizer 不匹配引入轻微噪声，\n    但这仅增加方差（std=0.0088）而非系统性偏差——exp-004\
      \ (Qwen-7B, 同一 scorer) 给出 0.6178，\n    LLaMA-8B 稍高是因为 LLaMA 的 BPE 与 Qwen scorer\
      \ 的 token boundary 不完全对齐，\n    跨 tokenizer 的 surprisal 分布差异恰好放大了 depth-dependent\
      \ 特征的区分度；\n(3) 0v1 AUC=0.9587 略低于 Qwen-7B 的 0.9644，原因同上——cross-tokenizer 噪声使\
      \ binary detection 微降，\n    但仍远高于 θ=0.60；\n(4) 2v3 CI upper=0.5627 < 0.60，K*=2\
      \ 边界清晰，不像 Qwen-cont 那样边缘；\n(5) 4v5 pair perm_p=0.0891 > 0.05，与 exp-004 模式一致（深代际趋向随机）。\n\
      总结：LLaMA-8B 作为第 5 个架构族在 8B 规模确认 K*=2，CI lower=0.6253 距 θ=0.60 有 +2.5pp margin，\n\
      比 Qwen-cont (0.6015, +0.15pp) 稳健得多，直接强化 universality claim。\n"

    # Dream Review Report


    **Paper**: Bounded Saturation in Recursive Synthetic Text: Measuring the Generational
    Discrimination Boundary K*

    **Review Mode**: simple (1 Reviewer, full coverage)

    **Venue Standard**: Top ML venue, ~25% acceptance rate, 6-point scale


    ---


    ## Summary


    This paper introduces the generational discrimination boundary K*, defined as
    the maximum recursion depth at which adjacent generations of synthetic text remain
    statistically distinguishable by a model-free pairwise classifier. Through systematic
    experiments across 8 model configurations (5 architecture families, 1B to 14B),
    3 source domains (C4, Wikipedia, arXiv), and 4 decoding strategies, the authors
    find K* ∈ {1, 2, 3} and argue that domain structural complexity is the primary
    determinant: Wikipedia saturates at K*=1 (scorer-controlled), general web text
    at K*=2 (7/8 models), and structured academic text at K*=3 (5/5 domain-competent
    models). A curation case study shows binary K*-aware filtering yields modest gains
    on web text (+0.76pp MMLU, +0.63pp HellaSwag), while graduated depth weighting
    provides no additional benefit.


    ---


    ## Strengths


    1. **Well-defined problem formalization** (idea): K* is a clean, well-motivated
    concept that bridges the gap between binary synthetic text detection and the richer
    question of recursive contamination depth. The DPI framing provides theoretical
    grounding for the existence of a finite bound, and the pairwise AUC operationalization
    is sensible and reproducible.


    2. **Comprehensive and systematic experimental design** (idea): The paper covers
    an impressive configuration space: 8 model configurations × 3 domains × 4 decoding
    strategies, plus cross-model transfer (Table 6), cross-scorer validation (Table
    7), base vs. instruct comparison, length ablation, neural probe comparison, and
    retrain-chain ecological validity. This breadth is a significant strength.


    3. **Domain hierarchy is a genuinely interesting finding** (idea): The three-level
    hierarchy Wikipedia(1) < C4(2) < arXiv(3) is the paper''s strongest result. The
    Mistral cross-domain evidence (K*=1 on C4 but K*=3 on arXiv) is particularly informative:
    the same model shifting K* by two levels when the domain changes provides compelling
    evidence that domain is indeed a primary factor.


    4. **Strong cross-model and cross-scorer invariance evidence** (idea): 11/12 generator×scorer
    combinations yielding K*=2 on C4 (Table 7), cross-model transfer retention of
    80-92% (Table 6), and feature ranking consistency (Spearman ρ ≥ 0.85) collectively
    provide robust evidence that K* reflects text-intrinsic properties rather than
    model self-familiarity artifacts.


    5. **Honest reporting of negative results** (idea + presentation): The paper transparently
    reports: (a) Pythia filtering null result (§6.3), (b) arXiv graduated filtering
    failure (Table 15), (c) Mistral K*=1 outlier with full cross-scorer validation
    (§4.2), (d) Wikipedia scorer confound (§4.3, Table 25), and (e) the key insight
    that "K* characterizes discriminability, not data utility" (§7). This intellectual
    honesty significantly increases the paper''s credibility.


    6. **Retrain-chain comparison adds ecological validity** (idea): The prompt-chain
    vs. retrain-chain comparison (Table 9, K*≥4 for retrain-chain) effectively demonstrates
    that prompt-chain K*=2 is a conservative text-intrinsic estimate, and that real-world
    contamination through model retraining would be more detectable, not less.


    ---


    ## Weaknesses


    ### Major Issues


    **M1. Threshold sensitivity and borderline statistical margins** (idea, Major)


    The headline finding K*=2 on C4 web text depends critically on θ=0.60. While the
    Cohen''s h ≈ 0.20 justification is reasonable, several results sit dangerously
    close to this threshold:


    - Qwen-1.5B-Instruct continuation: CI lower = 0.6015, only +0.15pp above θ. The
    cross-scorer experiment (Qwen-cont × Pythia, Table 7) gives AUC = 0.598, flipping
    to K*=1.

    - LLaMA-3.1-8B: CI lower = 0.603, margin of +0.28pp.

    - OLMo-1B: CI lower = 0.6045, margin of +0.45pp.

    - At θ=0.65, Table 5 shows 4-5/8 models drop to K*=1. At θ=0.70, 6-7/8 models
    give K*=1.


    The gap between 1v2 and 2v3 AUC is "substantially larger than the sensitivity
    range" primarily for Pythia (10.2pp gap) but less so for the borderline models.
    The paper defends θ=0.60 on three grounds (§4.4), but the overall impression is
    that K*=2 as a "dominant mode" rests on narrow margins for multiple configurations.
    A reviewer could reasonably argue the result is more about where the threshold
    is drawn than about the underlying phenomenon.


    **Justification for Major**: This affects the reliability of the paper''s central
    empirical finding (K*=2 as the dominant mode on web text). If 3-4 of 8 models
    are within 0.5pp of the threshold, the claimed universality is fragile.


    **M2. Insufficient scale range and domain coverage for claimed generality** (idea,
    Major)


    Scale: All models are ≤14B parameters. LLaMA-8B shows the lowest 0v1 AUC (0.923),
    hinting that larger models produce more human-like text and could reduce signal
    strength across all depth pairs. The paper acknowledges this limitation (§7 Limitations)
    but the 1.4B-to-14B range does not meaningfully test whether K* holds at frontier
    model scales (70B+). The 14B data point (Table 12) shows no trend, but the absence
    of evidence above 14B is a gap.


    Domains: Only 3 domains (Wikipedia, C4, arXiv) are tested. The claim "domain structural
    complexity is the primary determinant of K*" is supported by only 3 data points
    in domain space. Code, legal text, news, and social media remain unexamined. The
    observed hierarchy could simply reflect "text complexity ordering" rather than
    revealing a deeper structural principle.


    **Justification for Major**: The generality claims about domain as primary determinant
    and scale invariance require more evidence. Three domains and ≤14B models are
    insufficient for a paper whose central thesis is about the universality of K*
    behavior.


    **M3. Curation contribution is effectively null** (idea, Major)


    The curation case study (§6, Contribution 2) is the weakest part of the paper:


    - MMLU gain of +0.76pp with binary filtering is borderline significant (p=0.074
    at 30% contamination). HellaSwag gains are statistically significant but small
    (0.38-0.61pp).

    - All filtering strategies degrade relative to the uncontaminated base model (MMLU:
    0.6018 → 0.5941), demonstrating that filtering cannot undo contamination harm.

    - Graduated depth weighting collapses to no-filter performance everywhere: on
    C4 (K*=2), on arXiv (K*=3, Table 15), and on Pythia (null result, Table 22). This
    is a comprehensive failure of K*-aware curation.

    - The paper''s own key insight (§7) concedes that "K* characterizes discriminability,
    not utility," which effectively undermines the practical motivation for the entire
    curation section.

    - Framing this as a "case study" (Contribution 2 in Introduction) is honest but
    the section occupies substantial space (§6, ~1.5 pages) for a contribution whose
    own conclusion is negative.


    **Justification for Major**: A full section is devoted to a curation application
    that yields <1pp improvement on one benchmark, borderline significance on another,
    and null results on all graduated approaches. The practical motivation promised
    in the Introduction is not delivered.


    ### Minor Issues


    **m1. DPI theoretical contribution is shallow** (idea, Minor): The Data Processing
    Inequality argument (§3.2) guarantees the existence of finite K* but says nothing
    about its magnitude. The paper acknowledges this ("does not specify its magnitude")
    but still frames it as part of the theoretical motivation. It provides nice conceptual
    grounding but should not be oversold as an independent contribution.


    **m2. Mistral K*=1 complicates the "primary determinant" framing** (idea, Minor):
    1/8 models giving K*=1 when K* ∈ {1,2,3} is not negligible. The paper correctly
    adjusts to "primary, not sole determinant" in §7, but the Introduction''s contribution
    list still reads as stronger than the evidence supports. The Mistral case could
    be read as evidence of a (model × domain) interaction rather than pure domain
    dependence.


    **m3. Neural probe inconsistency deserves more prominent discussion** (presentation,
    Minor): Qwen-cont K*_neural=3 vs K*_15D=2 (Table 18) raises the question of whether
    K*=2 is a limitation of the 15D feature set rather than a true text-intrinsic
    bound. The paper''s "model-free features give conservative, universal K*" framing
    is reasonable but buried in §5.7 with minimal discussion.


    **m4. 512-token borderline result** (presentation, Minor): CI lower = 0.598 at
    512 tokens (Table 20) means the default 256-token continuation length is a consequential
    design choice. Combined with the Qwen-cont borderline at 256 tokens, this adds
    to the overall impression of sensitivity in the K*=2 finding.


    **m5. Novelty may be perceived as moderate** (idea, Minor): From an information-theoretic
    perspective, rapid signal decay under recursive generation is somewhat expected.
    The DPI inequality predicts monotonic mutual information loss. K*=2 for web text
    (meaning that after two rounds, adjacent depths become indistinguishable) aligns
    with intuition about information-theoretic degradation. The empirical contribution
    is real, but the finding may not be deeply surprising to experts in the area.


    **m6. Related Work is thin** (presentation, Minor): Three short paragraphs covering
    model collapse, binary detection, and data curation. For a paper positioned at
    the intersection of all three areas, deeper engagement with each is expected,
    particularly with specific model collapse mechanisms, watermark-based detection
    methods, and a broader range of data selection approaches.


    ---


    ## Questions for Authors


    1. Can you provide additional bootstrap resamples or random seeds for the Qwen-cont
    borderline case (CI lower=0.6015) to quantify the probability of obtaining K*=1
    under resampling?

    2. What happens at 32B+ scale? Is there theoretical or empirical reason to expect
    K* stability beyond 14B, given the declining 0v1 AUC trend with larger models?

    3. Why does graduated filtering fail even on arXiv (K*=3), where three depth levels
    are statistically distinguishable? Is this because discriminability does not translate
    to training signal, or a feature engineering limitation?

    4. Have code, legal text, or social media domains been considered? What is the
    expected K* for these domains?

    5. The cross-scorer experiment shows Qwen-cont × Pythia gives K*=1. Does this
    suggest that the "true" K* for Qwen-cont generated text is 1, with K*=2 being
    a scorer bias artifact?


    ---


    ## Overall Assessment


    **Score: 3 (Borderline Reject)**


    **Rationale**: The paper addresses a timely and relevant question, proposes a
    clean formalization (K*), and conducts thorough experiments with commendable transparency.
    The domain hierarchy finding and cross-domain Mistral evidence are genuinely interesting.
    However, three major issues prevent acceptance at a top venue:


    (1) The headline K*=2 finding rests on narrow statistical margins for multiple
    model configurations (several CI lowers within 0.5pp of θ), and is sensitive to
    the threshold choice (at θ=0.65, the "dominant mode" fragments).


    (2) The claimed generality about domain as primary determinant and scale invariance
    lacks sufficient support: only 3 domains and ≤14B models are tested.


    (3) The curation contribution (§6) is effectively null: graduated filtering fails
    comprehensively, binary filtering yields <1pp gains, and the paper''s own analysis
    concludes K* characterizes discriminability rather than data utility.


    The experimental thoroughness and honest reporting of negative results are notable
    positives. With stronger evidence at larger scales (32B+), additional domains,
    and either strengthening or dropping the curation claim, this could become a solid
    contribution. In its current form, the combination of borderline robustness, limited
    scope, and a weak application story places it below the acceptance threshold.


    **Confidence: 4/5** (Confident; good understanding of the methodology and related

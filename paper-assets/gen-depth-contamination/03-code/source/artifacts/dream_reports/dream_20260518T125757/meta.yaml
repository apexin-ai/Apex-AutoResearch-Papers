  - name: exp-028 Subsampling Power Curve
    plan_id: exp-028
    description: '从 exp-007 的 C4 数据中，以 n={1000, 2000, 3000, 4000, 5000} 五个样本量、每个做  10
      次随机 resampling，计算每次 resample 下的 1v2 AUC 及其 bootstrap CI，确定 K*=2  判定所需最低样本量。

      '
    expected_results:
      sample_sizes:
      - 1000
      - 2000
      - 3000
      - 4000
      - 5000
      resamples_per_size: 10
      fraction_kstar_2:
        n1000: 0.6
        n2000: 0.9
        n3000: 1.0
        n4000: 1.0
        n5000: 1.0
      mean_1v2_auc:
        n1000: 0.612
        n2000: 0.617
        n3000: 0.62
        n4000: 0.622
        n5000: 0.624
      mean_ci_width:
        n1000: 0.038
        n2000: 0.027
        n3000: 0.022
        n4000: 0.019
        n5000: 0.017
      min_n_for_robust_kstar2: 2000
      mean_1v2_ci_lower:
        n1000: 0.593
        n2000: 0.604
        n3000: 0.609
        n4000: 0.613
        n5000: 0.616
    result_rationale: 'Best 档下：(1) n=1000 时 CI width≈0.038，1v2 AUC 点估计约 0.612 但 CI
      lower 经常 落到 0.593（< θ=0.60），导致仅 60% 的 resamples 判定 K*=2——统计功效不足。 (2) n=2000
      时 CI width 缩至约 0.027，mean CI lower 升至 0.604，90% resamples 给出 K*=2。 这是因为 1v2
      效应量本身较小（AUC≈0.62，对应 Cohen''s d≈0.20），需要足够样本量才能 让 CI 不跨越 θ=0.60 阈值。(3) n≥3000
      后 100% resamples 均判定 K*=2，因为 CI width 缩至 0.022 以下，即使最不利的 resample 其 CI lower
      也在 0.609 以上。 (4) 点估计随 n 增加轻微上升（0.612→0.624），这是小样本负偏的纠正效应。 结论：n=2000 是 robust
      K*=2 判定的 practical minimum，但 n=3000 提供 100% 稳定性。 论文的 n=5000 设计远超 minimum required，充分回应了审稿人关于样本量的关切。

      '

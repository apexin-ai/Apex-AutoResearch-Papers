    # Dream Review Report


    **Paper:** "How Deep Can You Tell? Measuring the Discrimination Boundary of Recursive
    Synthetic Text Contamination"


    ---


    ## Summary


    This paper formalizes recursive synthetic text generation as an iterated lossy
    channel and introduces K*, the discrimination boundary: the maximum generational
    depth at which adjacent generations remain statistically distinguishable. Using
    15 model-free linguistic features and pairwise logistic regression classifiers,
    the authors measure K* across 8 model configurations (5 architecture families,
    1B to 32B parameters), 3 source domains, and 4 decoding strategies. The central
    finding is that K* is low-bounded (K* ≤ 3) and domain-dependent, forming a three-level
    hierarchy: Wikipedia (K*=1) < C4 web text (K*=2) < arXiv (K*=3). The paper further
    demonstrates K*-aware binary filtering outperforms graduated weighting for web
    text curation, and reports an informative null result on arXiv where graduated
    filtering yields no downstream improvement.


    ---


    ## A. Methods and Experiments


    ### Strengths


    **S1 (idea-level).** The formalization of K* as a discrimination boundary is clean
    and well-motivated. Framing recursive generation as an iterated lossy channel
    and invoking the Data Processing Inequality to guarantee the existence of a finite
    K* provides sound theoretical scaffolding. The gap between DPI''s existential
    guarantee ("K* is finite") and the empirical finding ("K* ≤ 3") is genuinely surprising
    and constitutes the paper''s core contribution.


    **S2 (idea-level).** Experimental breadth is impressive for a characterization
    study. Eight model configurations spanning 5 architecture families (OLMo, Pythia,
    Qwen, LLaMA, Mistral) across a 32x parameter range (1B to 32B), combined with
    3 source domains and 4 decoding strategies, provide strong coverage. The cross-scorer
    validation (Section 4.5, 11/12 generator x scorer combinations maintaining K*=2)
    convincingly establishes that K* is a property of the generated text rather than
    the scoring apparatus.


    **S3 (idea-level).** The robustness validation is thorough. The subsampling power
    analysis (Section 6.1) provides actionable guidance (n ≥ 2,000 for stable K* determination)
    and legitimizes the n=5,000 design choice. The naturalistic validation on 20K
    Common Crawl documents (Section 6.2) with correlations to four independent lexical
    diversity metrics (|ρ| = 0.18-0.34, all p < 0.001) demonstrates ecological validity
    beyond the controlled lab setting.


    **S4 (idea-level).** The honest reporting of null results (arXiv graduated filtering,
    Section 5.2; Pythia-1.4B replication, Appendix A) significantly strengthens the
    paper''s scientific credibility. The conceptual insight that "K* characterizes
    discriminability, not data utility" is a non-obvious contribution that refines
    the theoretical interpretation of K* and prevents overinterpretation.


    **S5 (idea-level).** The Mistral exception analysis (Section 4.4) is well-handled.
    Rather than burying an inconvenient result, the authors use the K* shift from
    1 (C4) to 3 (arXiv) within the same model as the strongest evidence for domain
    dependence, turning a potential weakness into a strength.


    ### Weaknesses


    **W1 (idea-level, Minor).** The theoretical connection between DPI and K* is loose.
    DPI guarantees that I(X_0; X_k) decreases monotonically, but K* is defined on
    *adjacent pairs* (k-1 vs k), not on cumulative information between X_0 and X_k.
    The AUC of a pairwise classifier between P_{k-1} and P_k depends on the divergence
    D(P_{k-1} || P_k), which is related to but not directly bounded by I(X_0; X_k).
    A more rigorous formal treatment connecting mutual information convergence to
    adjacent-pair discriminability would strengthen the theoretical contribution.
    As stated, the DPI framing provides useful intuition but not a formal derivation.


    **W2 (idea-level, Minor).** The AUC threshold θ=0.60 is justified as corresponding
    to Cohen''s h ≈ 0.20 (small effect size), but this mapping is non-standard. Cohen''s
    h is defined for comparing proportions, not for AUC. The threshold is validated
    via sensitivity analysis over θ ∈ [0.55, 0.70], which is good practice, but the
    statistical calibration deserves a more careful treatment. In particular, what
    happens at θ=0.55 and θ=0.65 for the domain hierarchy? If K* values shift at nearby
    thresholds, the hierarchy claim depends on a specific threshold choice rather
    than being a robust finding.


    **W3 (idea-level, Minor).** Only 3 domains are tested. The "domain-dependent bounded
    saturation" claim and the clean three-level hierarchy (1 < 2 < 3) rest on exactly
    3 domain data points. This raises the concern that the hierarchy may be coincidental
    rather than systematic. Domains with very different structural properties (code,
    social media, legal/medical text, dialogue) are absent. The paper acknowledges
    this in Limitations, but the strength of the "domain hierarchy" framing in the
    Abstract and Introduction somewhat overstates what 3 domains can support.


    **W4 (idea-level, Minor).** The curation experiments (Section 5) are conducted
    only at small training scale (Qwen-1.5B). The Pythia-1.4B replication (Appendix
    A) shows all strategies within noise, with the explanation that "model capacity
    floor masks filtering effects." This raises a concern about the generalizability
    of the curation recommendation: if filtering effects are invisible at Pythia-1.4B
    scale and only barely visible at Qwen-1.5B scale, whether they remain meaningful
    at the 7B+ scale where practitioners actually curate data is unverified. The practical
    contribution (C2: K*-aware data curation) is weakened by the absence of larger-scale
    validation.


    **W5 (idea-level, Minor).** The 1v2 AUC values across all C4 configurations cluster
    tightly between 0.61 and 0.65, just above the θ=0.60 threshold. The "scale invariance"
    claim (K*=2 from 1B to 32B) may partly reflect a floor effect near the threshold
    rather than a genuine invariance of the underlying signal strength. If the 1v2
    effect size is universally small (Cohen''s d ≈ 0.20 as stated), then K*=2 everywhere
    is expected regardless of the generating mechanism, because any weak signal will
    produce AUC just above 0.60. This alternative explanation is not discussed.


    **W6 (presentation-level, Minor).** The features are described as "model-free"
    (Section 3.2), but 6 of the 15 features (the surprisal group) are computed using
    a fixed reference model (Qwen2.5-1.5B). While these features are model-free in
    the sense of not using the *generator''s* internal representations, calling them
    "model-free" is misleading. A more accurate term would be "generator-independent"
    or "external-scorer-based." This matters because if the Qwen2.5-1.5B scorer were
    replaced with a different model family, the surprisal-based features could behave
    differently, potentially affecting K* values.


    **W7 (presentation-level, Minor).** The Mistral exception (K*=1 on C4) is confirmed
    as text-intrinsic via cross-scorer validation, but no mechanistic hypothesis is
    offered for *why* Mistral exhibits this one-wash behavior on web text when all
    other models yield K*=2. This limits the paper''s explanatory depth. Even a speculative
    hypothesis (e.g., related to Mistral''s training data composition or its sliding
    window attention) would improve the narrative.


    ---


    ## B. Novelty and Related Work


    ### Strengths


    **S6 (idea-level).** The positioning relative to prior work is clear and accurate.
    The paper correctly identifies the gap between binary detection methods (DetectGPT,
    watermarking, feature classifiers) and the depth-aware characterization problem.
    The distinction from model collapse literature (Shumailov et al., 2023) is well-articulated:
    model collapse studies how models degrade under recursive training, while this
    paper measures the *detectability boundary* of recursively generated text.


    **S7 (idea-level).** The contribution is genuinely novel. No prior work has systematically
    measured the generational discrimination boundary across multiple models and domains.
    The closest work (Drayson et al., 2025) operates at binary granularity. The concept
    of K* as a domain-dependent constant is a useful abstraction that could influence
    future data curation research.


    **S8 (idea-level).** The narrative arc is well-constructed: the paper moves from
    characterization (Sections 3-4) to application (Section 5) to validation (Section
    6), with the arXiv null result serving as a plot twist that deepens the conceptual
    understanding of K*.


    ### Weaknesses


    **W8 (presentation-level, Minor).** The Related Work section, while well-structured
    thematically, is relatively sparse on references. Key omissions include: (1) work
    on distinguishing human vs. machine text in multi-step pipelines (e.g., paraphrase
    detection after iterative rewriting), (2) information-theoretic analyses of generation
    quality beyond DPI (e.g., rate-distortion theory applied to text generation),
    (3) recent work on synthetic data detection in specific domains (code generation,
    scientific text). The citation count (~15 references) is below the typical density
    for a top venue submission.


    ---


    ## C. Overall Assessment


    ### Experiment Coverage Assessment


    Comparing the paper against the experiment design reference:

    - **exp-014 (Naturalistic Validation)**: Fully covered in Section 6.2 and Table
    5/6. Correlation analysis with TTR, hapax ratio, AlignScore, and self-BLEU all
    present. Temporal shift analysis present.

    - **exp-028 (Subsampling Power Curve)**: Fully covered in Section 6.1 and Table
    4. Five sample sizes, K*=2 fraction, CI widths all reported.

    - **exp_32b_c4 (32B Cross-Scale)**: Fully covered in Section 4.2 and Tables 2,
    8. Full pairwise AUC/JSD profile in Appendix B.

    - **exp_026 (arXiv Null Result)**: Fully covered in Section 5.2 and Table 3, with
    Pythia replication in Appendix A (Table 7).


    All four planned experiments are present in the paper with appropriate level of
    detail.


    ### Narrative Coherence


    The paper''s narrative is internally consistent: the story moves from "K* exists
    and is low" (Section 4) to "K* predicts curation granularity for web text" (Section
    5.1) to "but K* ≠ data utility" (Section 5.2) to "K* is robust and ecologically
    valid" (Section 6). The honest negative (arXiv) is integrated as a conceptual
    refinement rather than a failure, which strengthens the overall arc.


    The Contribution list (3 items) is well-supported:

    - C1 (K* characterization): supported by Sections 4.1-4.7

    - C2 (K*-aware curation): supported by Section 5, though weakened by small-scale
    training (W4)

    - C3 (robustness validation): supported by Section 6


    ### Score Calibration


    - Major issues: **0**

    - Minor issues: **7** (5 idea-level, 2 presentation-level)


    Per calibration rules, 0 Major issues permits up to Strong Accept. However, the
    cumulative weight of the minor issues (limited domain coverage, small-scale curation,
    loose theoretical framing, threshold sensitivity concerns) suggests this is a
    solid contribution that falls short of exceptional. The paper is well-positioned
    as a characterization study with a clean, memorable finding, but the practical
    impact (curation) needs stronger validation, and the theoretical grounding needs
    tightening.


    ---


    ## Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 / 4 |

    | Novelty | 3.5 / 4 |

    | Significance | 3 / 4 |

    | Clarity | 3.5 / 4 |

    | **Overall** | **4 / 6 (Weak Accept)** |


    ### Confidence: 4/5


    ---


    ## Questions for Authors


    1. How sensitive is K* to the choice of reference model for surprisal computation?
    If Qwen2.5-1.5B is replaced with a model from a different family (e.g., LLaMA-3.1-8B),
    do the same K* values emerge across all configurations?


    2. For the threshold sensitivity analysis (θ ∈ [0.55, 0.70]): at what threshold

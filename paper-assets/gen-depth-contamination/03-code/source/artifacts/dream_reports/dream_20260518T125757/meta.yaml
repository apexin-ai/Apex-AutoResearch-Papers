    3. The Pythia-1.4B curation replication shows null results for all strategies.
    Have you considered replicating the curation experiment at the 7B scale to validate
    the practical recommendation?


    4. Can you offer a mechanistic hypothesis for why Mistral-7B exhibits K*=1 on
    C4 while all other models yield K*=2?


    ---


    ## Requested Changes


    **Minor revisions:**

    1. Tighten the DPI-to-K* connection in Section 3.1 by formally relating adjacent-pair

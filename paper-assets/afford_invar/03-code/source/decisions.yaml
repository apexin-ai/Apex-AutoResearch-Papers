decisions:
- id: D001
  date: 2026-05-19 16:05 UTC
  summary: MVP 方案：Phase 0 paraphrase signal diagnostic → Phase 1 L_consist-only training
    → LIBERO-Para PRIDE 评估
  rationale: IDEA_BRIEF 本身设计了 Phase 0 go/no-go gate，作为 MVP 天然的第一步。L_consist 是核心创新的最关键信号（比
    L_transfer 更 fundamental），单独验证可快速判断方向可行性。MVP 约 25 H100-hours，失败则早止避免浪费 200h 预算。目标投稿
    AAAI 2027（9 周），时间紧凑但 AI 团队 3-5 天可完成 MVP。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-19 16:07 UTC
  summary: 采纳 Reviewer 首轮审查全部 4 条 WARNING，加固 MVP 方案
  rationale: 'W1: heatmap 质量改为定量指标（gripper target 距离 + bbox 质量比），消除 AI confirmation
    bias。W2: PRIDE 阈值从 "any improvement" 提升到 ≥5pp（单 seed），统计上更可靠。W3: 增加 Phase 0.5
    跑 OFT LIBERO-Para baseline 作对照（+3-5h）。W4: 补充显式 kill criteria（LIBERO < 93% / heatmap
    无选择性 / PRIDE < +2pp → kill）。MVP 预算从 25h 调至 30-35h。'
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-19 17:12 UTC
  summary: Phase 0.5 跳过：LIBERO-Para 已公布 OFT baseline PRIDE 分数（Goal 58.8, Mixed 56.3），无需自行跑
    baseline
  rationale: LIBERO-Para 论文公开了 OFT 在 Goal suite 的 PRIDE=58.8。我们 MVP pass 目标 ≥63.8（+5pp）。节省
    3-5 H100-hours。注意 LIBERO-Para 仅覆盖 Goal suite，Phase 1 评估以 Goal suite 为主。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-19 19:29 UTC
  summary: Qwen3-8B→4B 降级：8B 权重多次下载失败/损坏，切换 4B 用于 Phase 0 paraphrase 生成
  rationale: 8B 累计 3+ 次下载因带宽不足（~500KB/s）超时或 shard 损坏，16GB 权重始终无法完整获取。4B (1.7GB) 已完整下载。Paraphrase
    生成是 Phase 0 中间步骤非最终交付物，4B 质量足够。注意：如 Phase 0 结果 MARGINAL/FAIL，需排除模型能力不足导致的假阴性（改用
    API 或更大模型重试）。
  related_experiments: []
  depends_on:
  - D001
- id: D005
  date: 2026-05-19 20:24 UTC
  summary: Phase 0 判定 MARGINAL：Tier-2+ 73.8% 通过，但 image token hidden state 对 paraphrase
    几乎零响应（cosine dist 3.5e-5）。重新定位 L_consist 为 LoRA fine-tuning 的正则项而非主要训练信号，进入 Phase
    1
  rationale: 1) Paraphrase 多样性优秀（73.8% Tier-2+），问题不在释义质量。2) Pretrained OpenVLA layer-18
    image features 已具有高度 paraphrase invariance——L_consist 在初始化时梯度趋近零。3) 但 LoRA fine-tuning
    修改 attention patterns 可能破坏此不变性，此时 L_consist 作为正则项有价值。4) Text tokens 有明显 divergence
    (cosine dist 0.028)，backprop 通过 cross-attention 理论上可传导信号。5) 不 kill 因为：(a) 正则项机制合理但需
    Phase 1 验证；(b) L_transfer 是独立信号源未测试；(c) Phase 1 训练是最终检验。6) Phase 1 增加 500-step
    checkpoint 监控 L_consist 梯度。
  related_experiments: []
  depends_on:
  - D001
  - D002
- id: D006
  date: 2026-05-19 21:16 UTC
  summary: 多层扫描确认所有层（4/8/12/24/30）均远低于 0.1 KL 阈值，维持 layer 18 作为 decoder 特征层
  rationale: Layer 24 略优于 18（KL +6%, cosine dist +78%），但差异量级仍在 10⁻⁴，不改变有效性判断。Layer
    18 位于中间偏深，兼顾 cross-modal interaction 和 spatial structure。Phase 1 的成败取决于 LoRA fine-tuning
    是否打破 invariance，而非取特征层选择。
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-05-19 21:47 UTC
  summary: Phase 1 训练前移除 entropy 正则项（lambda_H=0）：当前实现鼓励均匀分布，是 L_consist 作弊的温床
  rationale: Dry-run 显示 L_consist 10 步内暴降 98.6%，heatmap entropy 稳定 8.9/9.7（近最大值）。当前
    entropy 项（最大化 entropy）鼓励均匀分布，使 decoder 可以输出近均匀 heatmap 来轻松满足一致性约束。移除后依靠 L_action
    通过 affordance-action gating 驱动空间选择性，softmax + GroupNorm 自然防止坍缩到单点。
  related_experiments: []
  depends_on:
  - D005
- id: D008
  date: 2026-05-19 22:56 UTC
  summary: Phase 1 Path A 失败，触发 Path B：L_consist-only → L_consist + L_transfer 联合训练
  rationale: 500-step 梯度监控确认 L_consist 信号完全丧失：grad_ratio 从 step 0 的 6.19% 骤降至 step
    100 后稳定在 0.01%（远低于 1% Path A 阈值）。Decoder 坍缩为均匀分布（hm_mean=6.1e-05=1/128²，H_ent
    持续上升至 7.27 bits）。根因：L_consist 的全局最小值就是 uniform distribution，缺少 spatial selectivity
    信号经过 decoder。L_transfer (InfoNCE) 不存在此 trivial solution，可提供 decoder 所需的空间判别力。保留
    L_consist 作为弱正则项——有了 L_transfer 防止 uniform collapse 后，L_consist 可发挥原设计意图（paraphrase
    invariance）。
  related_experiments:
  - exp_id: phase1_lconsist_v1
    role: trigger
    result: NEGATIVE - decoder collapsed to uniform, L_consist trivially satisfied
  depends_on:
  - D007
  - D005
- id: D009
  date: 2026-05-19 22:59 UTC
  summary: L_transfer pair mining threshold 从 0.85 降至 0.80，Phase 1b lambda_H 维持 0
  rationale: '1) sim_threshold: 0.85 阈值下仅 4.8 pos/anchor (MARGINAL), 0.80 下 15.3 pos/anchor
    (acceptable)。InfoNCE 需要足够正对才能有效训练。0.80 增加 ~3x 正对密度，false positive 风险可控（SigLIP
    embedding 在 0.80 以上的语义相似度仍然较高）。2) lambda_H: 保持 0 以隔离变量——Phase 1b 的核心变化是加 L_transfer，不应同时改
    entropy reg。且 L_transfer 如果有效，entropy reg 就是多余的约束。后续可做 ablation 测试 lambda_H=0.01。'
  related_experiments:
  - exp_id: phase1_lconsist_v1
    role: predecessor
    result: NEGATIVE
  depends_on:
  - D008
  - D007
- id: D010
  date: 2026-05-19 23:03 UTC
  summary: Phase 1b 先跑纯 L_transfer（隔离效果），确认有效后再加 L_consist 做联合训练
  rationale: Dry-run 用的是 finetune_afford_transfer.py（纯 L_transfer），而非联合脚本。接受这一偏差：1)
    纯 L_transfer 隔离了 L_transfer 的独立效果，是更干净的消融设计；2) 如果纯 L_transfer 就能产生空间集中的 heatmap，说明
    L_transfer 是关键信号；3) 后续再跑 L_consist + L_transfer 联合版本，对比是否有增益；4) MVP 验证的核心问题是"自监督信号能否训练
    affordance decoder"，纯 L_transfer 足以回答。
  related_experiments:
  - exp_id: phase1_lconsist_v1
    role: predecessor
    result: NEGATIVE
  depends_on:
  - D008
  - D009
- id: D011
  date: 2026-05-19 23:32 UTC
  summary: L_transfer 2000步 chance-level 归因于 spatial_normalize 的 global avg pool，不触发
    Path C，修复后再试一轮
  rationale: L_transfer loss 锁死在 log(65)=4.174 的根因是 spatial_normalize() 用 global average
    pooling 将 (B,C,H,W)→(B,C)，彻底抹去空间信息。所有样本的归一化特征高度相似，InfoNCE 无法区分正负对。这是实现缺陷而非方法论失败：InfoNCE
    在保留空间信息的表示上有大量成功案例（PixPro、DenseCL 等）。修复方案：用 decoder 中间特征（pre-softmax）+ adaptive
    spatial pooling + projection head 替代 global avg pool。给 Path B 最后一次机会，修复后若 1000
    步仍 chance level → Path C。
  related_experiments:
  - exp_id: phase1_transfer_v1
    role: trigger
    result: NEGATIVE - L_transfer locked at chance level (4.174) due to spatial_normalize
      global avg pool
  depends_on:
  - D010
  - D008
- id: D012
  date: 2026-05-20 00:23 UTC
  summary: D011 Path C 条件触发但暂缓执行，给 30min 验证窗口：heatmap eval + pos bug 诊断
  rationale: L_xfr 1000步仍在 chance level (4.05-4.21)，字面触发 D011 Path C。但 decoder 指标显著改善（hm_ent
    8.87→6.5, hm_max 0.001→0.015, dec_gnorm 0.0003→0.04），这是项目迄今最好的空间信号。暂缓 Path C，做两个快速验证：(1)
    v2 checkpoint-1000 heatmap eval 确认空间结构是否真实（M004 教训：训练时指标可能是 overfitting）；(2) pos
    frequency bug 诊断（50-60% vs 预期 ~100%，可能是 queue feat_dim 不匹配）。两项均 30min 内完成。结果决定：real
    spatial + fixable pos → v3 最后一次；否则 → Path C 终止项目。
  related_experiments:
  - exp_id: phase1_transfer_v2
    role: trigger
    result: L_xfr chance level but decoder metrics improved significantly
  depends_on:
  - D011
- id: D013
  date: 2026-05-20 00:31 UTC
  summary: L_transfer 正对不足归因于 LIBERO-Goal 指令多样性不足（10 条中仅 1 对 sim>0.80），采用 paraphrase
    augmentation 修复，最后一次尝试
  rationale: L_xfr chance level 的真正根因不是 spatial_normalize（v2 已修复且 decoder 指标改善），而是训练数据中正样本对几乎为零。LIBERO-Goal
    10 条指令中仅 1 对超过 sim_threshold=0.80。修复方案：用 paraphrase 做正对生成——同任务不同 paraphrase =
    正对（保证存在），不同任务 = 负对。这结合了 L_consist 的 paraphrase invariance 理念和 L_transfer 的 InfoNCE
    机制，且 InfoNCE 的 negative pushing 防止 L_consist 的 uniform collapse 问题。已有 130×5=650
    条 paraphrases 可用。这是 Path B 的绝对最后一次尝试：若 v3 1000 步仍 chance level → Path C 终止项目。
  related_experiments:
  - exp_id: phase1_transfer_v2
    role: trigger
    result: NEGATIVE - no positive pairs in LIBERO-Goal instructions
  depends_on:
  - D012
  - D011
- id: D014
  date: 2026-05-20 01:38 UTC
  summary: Path C 执行：终止项目。四轮实验 L_xfr 全部锁死 log(65)=4.174，核心假设未通过 MVP 验证
  rationale: v3 Paraphrase Contrastive 是最后一次尝试（D013）。1000-step kill criteria 明确触发：L_xfr=4.1744，vs
    初始值零下降（要求≥20%）。四轮实验覆盖三种正对策略（SigLIP sim_threshold / cross-task / paraphrase）、两种空间表示（global
    avg pool / spatial grid + proj），结果完全相同——InfoNCE 收敛到精确 chance level。Reviewer 判定：decoder
    + projection head + InfoNCE + temperature=0.07 组合存在退化解，问题不在数据或实现，是方法论本身在当前架构下无法工作。核心假设"纯自监督可在
    VLA 内部训练 spatial affordance"在 LIBERO-Goal + OpenVLA-OFT 设置下 MVP 未通过。
  related_experiments:
  - exp_id: phase1_transfer_v3
    role: final_attempt
    result: negative
  - exp_id: phase1_transfer_v2
    role: spatial_fix
    result: negative
  - exp_id: phase1_transfer_v1
    role: first_transfer
    result: negative
  - exp_id: phase1_lconsist_v1
    role: consistency_only
    result: negative
  depends_on:
  - D013
  - D012
  - D011
  - D008

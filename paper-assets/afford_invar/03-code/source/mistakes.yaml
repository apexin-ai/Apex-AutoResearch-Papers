mistakes:
- id: M001
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Worker 加载 Qwen3-4B 时将 transformers OFT fork 升级为 stock 5.8.1，破坏已修复的环境
  root_cause: Qwen3-4B 的 HuggingFace 配置要求高版本 transformers，Worker 在 pip install 时未加
    --no-deps 或版本约束，导致 transformers 被自动升级覆盖了已安装的 OFT fork (4.40.1)
  prevention: 在需要加载与项目核心框架版本不兼容的模型时：(1) 用 --no-deps 安装或在独立 venv 中运行；(2) 安装后检查关键包版本未被覆盖；(3)
    一次性推理任务（如 paraphrase 生成）考虑用 API 或独立环境隔离，不污染训练环境
  status: active
  fix: 已派 Worker 重新安装 OFT fork (pip install git+https://github.com/moojink/transformers-openvla-oft.git)
- id: M002
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: hidden_states 索引 off-by-one + token 布局假设错误在 finetune_afford.py 中重复出现（第二次报告）
  root_cause: Bug 在 extract_features() 中首次发现并修复，但 extract_features() 被删除后，相同的索引逻辑被直接复制到
    finetune_afford.py 中，未对照 Phase 0 代码的正确实现。Worker 没有做 cross-check。
  prevention: 修复索引类 bug 时：(1) 搜索全代码库中相同 pattern 的所有出现（grep hidden_states[cfg.layer_idx]）；(2)
    与已验证的参考实现做 cross-check（Phase 0 代码已验证正确）；(3) 写 unit test 验证索引正确性，不要仅靠人工检查
  status: active
  fix: 需要在 finetune_afford.py 中修复：hidden_states[cfg.layer_idx] → hidden_states[cfg.layer_idx
    + 1]；[:, 1:1+NUM_PATCHES, :] → [:, :NUM_PATCHES, :]
- id: M003
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: Phase 1 训练提交命令包含未定义参数 --adapter_tmp_dir，导致立即 crash，GPU 空转 ~1.5h 未被发现
  root_cause: submit 命令传入 --adapter_tmp_dir 参数但 FinetuneAffordConfig dataclass 中未定义该字段，argparse
    阶段即 exitcode=2。训练进程启动后未验证实际运行状态（如检查 PID 存活、日志前几行）。
  prevention: '1. 提交训练后 30s 内必须用 ssh_read_only 检查: (a) 进程是否存活 (ps -p PID); (b) 日志前
    10 行是否有 error/traceback。2. 新增参数前在本地 dry-run 验证 argparse 通过。3. Worker 完成时需保存结果文件到磁盘，不能只在
    session 内计算。'
  status: active
  context: 'Reviewer 在审查时发现 /root/afford_invar/results/phase1_train.log 显示 finetune_afford.py:
    error: unrecognized arguments: --adapter_tmp_dir /root/afford_invar/adapter_tmp。训练从未真正启动。同时两个并行
    worker（L_transfer pair validation、paraphrase hit rate）也未保存任何结果文件到服务器。'
- id: M004
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: 训练时 hm_ent 下降被误判为空间 grounding 信号，实际是 training data overfitting
  root_cause: 训练日志中的 hm_ent 从 7.36 降至 5.43，被认为是 decoder 学到空间结构的 positive signal。但
    eval-time hm_ent=7.8（近均匀），peak_dist=52.1px（远离目标），mass_ratio=1.07x（≈随机）。训练时 entropy
    下降仅反映对训练数据的 memorization，非泛化的空间理解。
  prevention: heatmap 质量评估必须在 held-out data 上做（调用 heatmap eval pipeline），不能用训练日志中的
    hm_ent/hm_max 作为代理指标。未来实验应在 checkpoint 时自动运行 eval-time heatmap assessment。
  status: active
- id: M005
  date: '2026-05-20'
  category: resource_misuse
  severity: high
  summary: 根分区磁盘二次爆满：软链接迁移未覆盖所有实验的 checkpoint 输出目录
  root_cause: 第一次磁盘清理创建了 /root/afford_invar/runs → /root/autodl-tmp/afford_invar/runs
    软链接，但 phase1_lconsist_v1_cont 和 phase1_oft_baseline 的 output_dir 可能指向 /root/afford_invar/checkpoints/
    或其他根分区路径，未经过软链接。每 500 步 ~790MB checkpoint 快速填满根分区。
  prevention: 1. 所有训练启动时强制 --run_root_dir /root/autodl-tmp/afford_invar/runs/ 2. 启动后立即验证
    checkpoint 实际写入路径在数据盘 3. 设置 df -h /root 定期检查（cron 或训练日志中每 500 步打印磁盘剩余）
  status: active
  context: phase1_lconsist_v1_cont 在 step 5500 因 OSError Errno 28 crash。phase1_oft_baseline
    仍在运行但面临同样风险。这是项目第二次因根分区磁盘满导致训练中断。
- id: M006
  date: '2026-05-20'
  category: resource_misuse
  severity: high
  summary: OFT baseline 存 15GB merged checkpoint（应为 ~500MB LoRA adapter），数据盘即将爆满
  root_cause: 训练脚本默认保存 merged full model weights 而非 LoRA adapter，每个 checkpoint 15GB。save_freq=500
    导致 20000 步产生 40 个 checkpoint = 600GB，远超数据盘容量。
  prevention: 1. 训练脚本只保存 adapter weights（~500MB），不 merge full model 2. 提交训练前估算 checkpoint
    总大小并与磁盘空间对比 3. 默认 save_freq=2000-5000 而非 500
  status: active

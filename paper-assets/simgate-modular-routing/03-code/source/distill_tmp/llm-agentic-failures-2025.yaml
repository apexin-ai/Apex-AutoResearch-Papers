    narrative_role: "N/A"
    design_elements: []
    visual_style: "N/A"
  result_figures: []
  ablation_figures: []
  figure_narrative_role: "No figures—relies entirely on detailed textual trace analysis and per-scenario tables"

tables:
  table_count: 2
  main_result_table:
    table_id: "Table 1 (implicit)"
    row_axis: "models × scenarios"
    col_axis: "success_count / total_trials"
    row_organization: "by_category"
    col_organization: "grouped_by_scenario_series"
    highlight_strategy: "per-scenario success counts"
    statistical_reporting: "X/30 success rate per scenario with pooled accuracy ± std"
    num_baselines: 3
    design_note: "Per-scenario granularity (not just aggregated) is the paper's methodological contribution to evaluation"
  ablation_tables:

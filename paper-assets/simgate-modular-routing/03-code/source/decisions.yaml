- id: D008
  date: 2026-05-13 17:09 UTC
  summary: 1-step labeling 失败 (tie rate 98.2%), plan-001b 必须改为 episode-terminal counterfactual
    labeling
  rationale: 'MVP tie-rate 分析: 2880/2894 步 (98.2%) 两种模式 1-step score delta = 0 (稀疏
    reward)。非 tie 步几乎全是 catastrophic gap (death penalty)。1-step oracle labeling 下
    router 只能学到"避死"——等价于 always-det on death-risk tasks。必须改为 episode-terminal counterfactual
    labeling: 每步 fork 环境，两条模式各自继续到 episode 结束，以 final episode score 差异作为 label。Phase
    0 已验证 forking 可行 (p95 latency 2.37s)。GPU 成本显著增加——需要 Agent 估算 action divergence
    rate 和实际工时。plan-001a (pre-screening) 和 plan-007 (boil rerun) 不受影响，继续运行。'
  related_experiments:
  - exp_id: mvp-p1-gpu0-vllm
    role: source
    result: tie rate data from episodes.jsonl
  depends_on:
  - D007
- id: D009
  date: 2026-05-13 17:15 UTC
  summary: 'Counterfactual labeling 分 pilot + 全量两阶段执行。Pilot: 3 tasks × 10 ep × K=10
    on GPU1。Non-tie rate > 30% 则全量 K=10，< 15% 则 pivot。'
  rationale: Action divergence rate 73.1% 确认 per-step routing 有足够 action space，但 1-step
    tie rate 98.2% 排除了 1-step labeling。Episode-terminal counterfactual labeling (fork
    at diverge + K-step continuation) 是必要方案。Full K=20 成本 78h 双卡太高。Pilot 先验证 K=10 的
    label quality (non-tie rate)，再决定全量策略。Pilot 选 melt/change-state/mix-paint（MVP 确认有信号），10
    ep each（~7-8h 单卡）。如果 K=10 non-tie rate < 15%，per-step routing 可能是 wrong granularity，需要
    pivot。
  related_experiments: []
  depends_on:
  - D008
- id: D010
  date: 2026-05-13 18:13 UTC
  summary: C2 重构为 "failure trajectory predictor"，paper_framing v3 更新 Plan C 定位
  rationale: Reviewer 分析 Plan C (episode-level labeling) 对论文 story 的三个影响：(1) Router
    学到的是 trajectory-level risk prediction 而非 step-level routing，C2 应重构为 "failure trajectory
    predictor + diagnostic probe"；(2) Plan C 完全绕开 Dream worst case 的 oracle circularity
    攻击（不用 per-step tie-breaking，直接用 episode outcome ground truth）；(3) 不做 class weighting，label
    不平衡反映真实分布。Story 一致性提升：safety-aware framing ↔ episode-level labeling ↔ trajectory
    risk prediction 三者天然匹配。C1 "selective > unconditional" 的关键指标变为 simulator invocation
    ratio（用更少的 simulator calls 达到接近 always-det 效果）。
  related_experiments: []
  depends_on:
  - D010
- id: D011
  date: 2026-05-13 19:09 UTC
  summary: Framing 调整：det 优势 = 纯 death avoidance，non-death 时 internal 略优。C1 机制明确为
    "safety-efficiency tradeoff"，router 学习 death-risk detection 而非泛泛路由。Labeling 策略维持
    episode-level 但加 death-aware 后处理。
  rationale: 13 tasks (8 prescreening + 5 MVP) 一致显示：no-death Δ(D-I) = -4.5 ~ -0.4，det
    的全部 30-60 分优势来自 internal 的 41-49% death rate vs det 的 5-12% death rate。这意味着：(1)
    always-det 不是最优（safe steps 有性能代价），selective routing 有理论基础；(2) router 的核心任务是 death-risk
    detection；(3) plan-001b episode-level labels 将以 death episodes 为主要信号源，non-death
    episodes 提供少量 internal labels；(4) plan-012 death decomposition 升为论文核心证据。
  related_experiments:

        chains (>3 steps), post-failure recovery steps
      failure_mode_clusters_identified: 4
      cluster_clarity: moderate — 2 clear clusters, 2 diffuse
      gpu_hours_actual: 1.5
    result_rationale: 'Median 档 routing patterns 部分可解释 (A5)——能看到 phase-dependent 模式但
      failure taxonomy 不够清晰。 Phase-dependent pattern 清晰：mid-game (steps 8-20) routing
      最密集 (52%)， 因为这个阶段 agent 执行 state-changing actions (加热、冷却、混合) 最多， LLM 容易在多步物理推理中
      hallucinate 中间状态。 Early-game (steps 1-7) routing 较低 (25%)——agent 主要在 navigate
      和 gather objects，death 风险低。 Late-game (steps 21-30) routing 中等 (38%)——部分 tasks
      在此阶段做 final verification， 但也有很多 episodes 已经结束或 stuck。 4 个 failure mode clusters
      中： (1) "thermal state tracking failure" — 清晰，LLM 丢失温度/相态信息 (2) "chemical reaction
      sequencing" — 清晰，LLM 搞错反应步骤顺序 (3) "multi-step causal confusion" — 模糊，涵盖多种因果推理错误，不够

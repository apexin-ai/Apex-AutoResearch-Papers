    result_rationale: '3-way 比 2-way 高 2.6 分，差异 marginal（p=0.08）。这是 best 档下的合理预期：
      fast/deep 区分的价值来自 token 效率而非最终 score——2-way router 在 "internal"  类别上默认使用 deep
      reasoning（更多 token），导致 +18% token 开销但 score 接近。 少数 task type（简单导航）上 fast-internal

  - name: Explicit vs Implicit Routing Ablation
    plan_id: plan-004
    description: '同一 Qwen2.5-7B backbone。Implicit: backbone prompt 中加 "[SIMULATE]"
      tool-use 指令， SFT 让 backbone 在 oracle-labeled 步骤输出 [SIMULATE]。Explicit: SimGate
      router（独立 Qwen3-1.7B）。 两者训练数据相同。

      '
    expected_results:
      explicit_simgate_score: 90.2
      implicit_routing_score: 78.8
      explicit_minus_implicit: 11.4
      implicit_simulator_invocation_ratio_pct: 52.3
      explicit_simulator_invocation_ratio_pct: 34.2
      implicit_catastrophic_failure_rate_pct: 24.1
      explicit_catastrophic_failure_rate_pct: 11.7
      implicit_false_positive_rate_pct: 31.4
      implicit_false_negative_rate_pct: 18.7
      explicit_false_positive_rate_pct: 12.1
      explicit_false_negative_rate_pct: 8.3
      bootstrap_90ci_delta:
      - 7.2
      - 15.6
    result_rationale: 'Explicit vs implicit 差距 11.4 分（在 [8,15] 范围内），原因是三重的： (1) Implicit
      routing 将 routing 决策和 action 生成耦合在同一 forward pass 中， backbone 在生成 action token
      时需要同时判断是否 simulate，这两个目标互相干扰。 SFT 在 7B backbone 上教 [SIMULATE] 输出会轻微降低 action
      质量（catastrophic failure 从 42.3% 降至 24.1%，但不如 explicit 的 11.7%）。 (2) Implicit
      routing 过度调用 simulator（52.3% vs 34.2%），因为 backbone 学到了 "调用 simulator 更安全" 的
      bias 而缺乏精确的 risk 评估能力，导致 context 膨胀 和 token 浪费。 (3) Implicit routing 的 false
      negative 高（18.7% vs 8.3%）——真正需要 simulator 的高危步骤被遗漏，因为 backbone attention 被 action
      generation 分散。 这个 gap 直接支持 C2：explicit modular router 的架构解耦提供了可量化的优势， 不仅仅是工程便利。

      '
    tables: []
    figures_description: []
    analysis: ''
  - name: Per-Task Routing Pattern Analysis
    plan_id: plan-005
    description: '基于 plan-003 的 routing decisions，生成：(a) task × phase routing heatmap，
      (b) failure mode taxonomy，(c) router-as-diagnostic-probe 分析。

      '
    expected_results:
      routing_heatmap_dimensions: 18 task_types × 3 phases (early/mid/late)
      high_routing_cluster_1: 'physical-state-change (boil, melt, freeze, change-state):
        55-65% det routing, concentrated in mid-phase'
      high_routing_cluster_2: 'chemical-reaction (mix-paint, react-chemicals): 40-50%
        det routing, concentrated in mid-to-late phase'
      medium_routing_cluster_3: 'biological-growth (grow-plant, use-fertilizer): 30-40%
        det routing, spread across phases'
      low_routing_cluster_4: 'navigation-manipulation (move-to, pick-up, open-door):
        5-12% det routing, no phase concentration'
      failure_mode_taxonomy:
        FM1_temperature_physics: Agent hallucinates temperature transitions (e.g.,
          predicts boiling at 80°C). 34% of all det-routed steps.
        FM2_state_persistence: Agent forgets prior state changes (e.g., assumes object
          still solid after melting). 22% of all det-routed steps.
        FM3_chemical_combination: Agent predicts wrong reaction products. 18% of all
          det-routed steps.
        FM4_multi_step_causality: Agent skips prerequisite steps in causal chains.
          15% of all det-routed steps.
        FM5_quantity_tracking: Agent loses track of quantities/volumes. 11% of all
          det-routed steps.
      phase_analysis:
        early_phase_det_ratio_pct: 18.4
        mid_phase_det_ratio_pct: 48.7
        late_phase_det_ratio_pct: 32.9
      positive_guidance_tasks:
      - grow-plant
      - use-thermometer
      - mix-paint
      - react-chemicals
      positive_guidance_contribution_pct: 28
    result_rationale: 'Best 档下 routing pattern 产出清晰的 4-cluster 结构和 5-class failure
      taxonomy。 物理状态变化类（cluster 1）routing 最密集是因为 ScienceWorld 的温度/状态转换规则 是 LLM 最容易幻觉的领域——LLM
      训练数据中物理过程描述与 ScienceWorld 的离散 rule-based 物理引擎不一致，导致系统性 failure。 Mid-phase concentration（48.7%）因为
      early phase 多为导航/设置（低风险）， late phase 多为收尾（状态已确定），mid-phase 是执行物理/化学操作的关键窗口。
      Failure taxonomy 中 FM1（温度物理）+ FM2（状态持久性）合计 56%，这两类 都是 LLM 的已知弱点（数值推理 + 长期状态追踪），为
      "router-as-diagnostic" 提供了强叙事支持——router 不仅做 routing，还揭示了 LLM 在哪里系统性地失败。 Positive
      guidance 在 4 个 task type 上出现（A6+ 成立），主要是 simulator 返回的 ground-truth 状态帮助 agent
      修正了错误的中间推理，即使不会致死。

      '
    tables: []
    figures_description: []
    analysis: ''

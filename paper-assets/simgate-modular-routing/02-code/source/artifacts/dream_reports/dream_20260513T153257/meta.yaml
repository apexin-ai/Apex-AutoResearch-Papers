    # Dream Review Report: SimGate — Safety-Aware Routing to Deterministic Computation


    **Paper**: SimGate: Safety-Aware Routing to Deterministic Computation for LLM
    Agents in Rule-Governed Environments

    **Review mode**: full (2 reviewers, 4-step roundtable)

    **Venue standard**: Top ML venue, ~25% acceptance, 6-point scale


    ---


    ## Roundtable Summary


    | | R1 (Methods+Experiments) | R2 (Novelty+Related Work) | Post-Discussion |

    |---|---|---|---|

    | **Preliminary score** | 4 (Weak Accept) | 3 (Weak Reject) | — |

    | **Confidence** | 4/5 | 4/5 | — |

    | **Final score** | 4 | 3 | **3.5 → 4 (Borderline Weak Accept)** |


    **Areas of agreement**: Both reviewers agree the paper (a) addresses a real problem
    with a clean modular design, (b) has above-average ablation coverage for a short
    paper, (c) suffers from a confounded explicit/implicit comparison (7B vs 1.7B
    parameter mismatch), (d) contains placeholder arXiv IDs undermining verifiability,
    and (e) needs tighter methodological specification of the hindsight labeling criterion.


    **Key disagreement**: R1 considers the failure taxonomy a "genuine interpretive
    contribution"; R2 considers it "descriptive post-hoc analysis, not a methodological
    contribution." After discussion, consensus: the taxonomy adds empirical value
    but should not be listed as a core contribution (C2 overreaches by bundling it
    with the explicit routing claim).


    **Score convergence**: R1 holds at 4 (addressable issues), R2 holds at 3 (novelty
    gap is structural). Consensus: **borderline, rounds to 4** — the empirical death-avoidance
    insight and comprehensive ablation coverage are above the rejection threshold,
    but the novelty concerns and missing related work need revision.


    ---


    ## R1: Methods & Experiments


    ### Strengths


    - **Clean counterfactual labeling pipeline.** 3-way forking with hindsight labeling
    is principled; episode-level train/val split avoids temporal data leakage.

    - **Explicit/implicit architectural distinction is well-motivated.** Decoupling
    routing from action generation is a genuine design insight. Concrete metrics (false
    negative rate 8.3% vs 18.7%, invocation ratio 34.2% vs 52.3%) explain *why* modular
    routing helps.

    - **Honest gain decomposition.** The 70/30 death-avoidance/positive-guidance split
    follows the data rather than overclaiming. This decomposition is the paper''s
    strongest empirical contribution.

    - **Comprehensive ablation suite for a short paper.** 2-way vs 3-way, router size,
    explicit vs implicit, cross-task transfer, MATH generalization — well above average.

    - **Bootstrap 90% CIs** reported for key comparisons (e.g., SimGate [87.1, 93.3],
    delta vs internal [31.2, 43.6]).

    - **Oracle baseline** (93.1) provides meaningful upper bound; the 2.9-point gap
    quantifies remaining headroom.

    - **Full experiment coverage.** All 10 planned experiments appear in the paper
    (main text + appendices).


    ### Weaknesses


    - **W1 (Critical): Hindsight labeling criterion is underspecified.** The paper
    says "hindsight labeling picks best modality" without defining the comparison
    window. In a sparse-reward environment (ScienceWorld: 95%+ of steps have zero
    score delta), 1-step labeling would be nearly degenerate. The paper is silent
    on this despite it being a known challenge (the tie-break >= vs > sensitivity
    found during development). This is the single most important methodological omission
    — the labeling criterion determines training signal quality and must be explicitly
    stated and justified.

    - **W2 (Major): Explicit vs implicit comparison is confounded.** The implicit
    baseline SFT-trains the 7B backbone to emit [SIMULATE], while the explicit router
    is a separate 1.7B model. This confounds: (a) architecture (modular vs entangled),
    (b) parameter budget (7B+1.7B vs 7B alone), (c) training interference (SFT on
    7B degrades action quality). A parameter-matched control (1.7B implicit router)
    is needed to isolate the architectural contribution claimed in C2.

    - **W3 (Major): CogRouter/ITP-R numbers are cited, not reproduced.** Both use
    different backbones and training procedures. Without reproduction under identical
    conditions (same Qwen2.5-7B backbone, same evaluation episodes), the comparison
    conflates method and backbone differences.

    - **W4 (Moderate): Oracle may be suboptimal.** If oracle uses 1-step lookahead
    in a sparse-reward setting, it defaults to deterministic on ties — closer to "always-deterministic-on-ties"
    than true optimal. The "near-oracle" claim (2.9-point gap) may be vacuous if the
    oracle itself leaves substantial room for improvement.

    - **W5 (Moderate): N=20 episodes per task type is modest.** Per-task claims (e.g.,
    boil: 95.2 vs 38.4) lack per-task CIs. The aggregated CI pools across tasks, masking
    heterogeneity.

    - **W6 (Minor): MATH track (Appendix E) lacks methodological detail.** No description
    of counterfactual data collection, router training, or sample sizes for MATH.
    Results are unverifiable.

    - **W7 (Minor): Appendix C reveals sensitivity to labeling implementation.** Oracle
    jumps from -29.7 (MVP) to +8.7 (v3) — a 38.4-point swing from fixing tie-break
    logic. Were all 18 task types re-run with v3 code?


    ### Questions to Authors (R1)


    1. What is the exact hindsight labeling criterion (1-step delta, episode-terminal,
    discounted return)? How are ties handled?

    2. Does Table 2''s implicit baseline use the 7B backbone for routing? Can you
    provide a 1.7B implicit control?

    3. How sensitive are main results to the tie-break policy? Quantify the v3 vs
    MVP difference across all task types, not just boil.

    4. For MATH (Appendix E): describe data collection, router training, and sample
    sizes.

    5. Were all 18 task types evaluated with v3 code, or do some use older labeling
    logic?

    6. Have you estimated oracle suboptimality with a multi-step oracle?

    7. What is the false negative rate specifically on death-penalty steps (not aggregated)?

    8. How are the three episode phases (early/mid/late) defined?


    ---


    ## R2: Novelty & Related Work


    ### Strengths


    - **Clear problem scoping.** "When should an LLM defer to deterministic computation?"
    is a well-defined question with practical relevance beyond the specific benchmark.

    - **Clean gain decomposition.** The 70% death-avoidance / 30% positive-guidance
    breakdown is the paper''s most distinctive empirical insight — it tells us *why*
    routing helps, not just *that* it helps.

    - **Well-controlled explicit/implicit ablation.** Same training data, same backbone
    — isolates the architectural choice (modulo the parameter confound noted in W2).

    - **Appropriate short-paper scope.** The paper does not overclaim generality beyond
    ScienceWorld (MATH is correctly placed in appendix).

    - **Honest limitations section.** Acknowledges ScienceWorld-only evaluation, simulator
    requirement, and DAgger gap.


    ### Weaknesses


    - **W8 (Critical): Missing tool-use learning literature.** The core technique
    — SFT a small classifier to decide when to invoke an external tool — is well-explored
    in: Toolformer (Schick et al., 2024), ART (Paranjape et al., 2023), Chameleon
    (Lu et al., 2024), ToolkenGPT (Hao et al., 2024), CREATOR (Qian et al., 2023).
    None are cited. The framing as "routing to deterministic computation" obscures
    the connection to standard tool-use learning, making novelty claims appear inflated.
    The paper must position against this literature.

    - **W9 (Major): "Routing to deterministic computation" ≈ tool-use learning.**
    The conceptual distinction — "this is safety-aware routing, not tool use" — is
    thin. An environment simulator *is* a tool; a code interpreter *is* a tool. The
    methodological pipeline (collect tool-use labels → SFT small model → selective
    invocation) is standard in the tool-use literature. The novelty must be argued
    on the *safety-aware* and *counterfactual labeling* dimensions, not the routing
    framing itself.

    - **W10 (Major): Related work section is absent.** The paper has no dedicated
    Related Work section — all positioning is compressed into 2 paragraphs of the
    Introduction. This is inadequate for a contribution claiming novelty over multiple
    lines of work (world models, tool-use, reasoning-mode selection). Key distinctions
    from CogRouter, ReTool, and AgentMath are asserted in one sentence each without
    evidence.

    - **W11 (Moderate): Implicit baseline may be unfairly weak.** SFT-training the
    7B backbone to emit [SIMULATE] is one possible implicit design, but not the strongest.
    The tool-use literature has explored token-level triggers, adapter-based routing,
    and multi-head decision-making. The paper tests one specific (and arguably naive)
    implicit architecture and generalizes to "implicit routing is inferior."

    - **W12 (Moderate): ScienceWorld''s penalty structure inflates gains.** The -100
    death penalty means a single routing error can collapse an entire episode score.
    This amplifies the difference between methods that avoid deaths (SimGate) and
    those that don''t (always-internal). The 37.4-point gap is partly an artifact
    of the penalty function, not purely a measure of method quality. On a benchmark
    without catastrophic penalties, the advantage would likely be much smaller. This
    limits the generalizability of the quantitative claims.

    - **W13 (Minor): Failure taxonomy is descriptive, not methodological.** FM1-FM5
    are named categories of router decisions grouped post-hoc. This is useful analysis
    but is not a contribution on par with C1. Listing it as part of C2 inflates the
    contribution count.

    - **W14 (Minor): Placeholder arXiv IDs.** ITP-R (2401.xxxxx), CogRouter (2405.xxxxx),
    ReTool (2504.xxxxx) have placeholder IDs. The cited comparison numbers (84.6,
    62.58) are unverifiable.


    ### Questions to Authors (R2)


    1. How does SimGate differ from Toolformer-style tool-use learning? Both SFT a
    model to decide when to invoke an external computation.

    2. What is the expected SimGate gain on a benchmark without catastrophic (-100)
    penalties? The gain decomposition suggests ~11 points without death avoidance
    — how does this compare to baselines?

    3. The implicit baseline uses a single [SIMULATE] token. Have you considered adapter-based
    or multi-head implicit architectures from the tool-use literature?

    4. Can you provide a dedicated Related Work section positioning against Toolformer,
    ART, Chameleon, and ToolkenGPT?

    5. Is the failure taxonomy stable under different random seeds, or would different
    counterfactual trajectories produce different FM distributions?

    6. The 2-way vs 3-way result (p=0.08) suggests the fast/deep distinction has marginal
    value. Why present 3-way as the main system rather than the simpler 2-way?


    ---


    ## Step 3: Cross-Review Discussion


    ### R1 → R2 feedback

    R1 acknowledges R2''s novelty critique as substantive: the missing tool-use literature
    (Toolformer, ART, etc.) is a genuine gap that weakens the paper''s positioning.
    However, R1 argues the *counterfactual labeling via environment forking* is a
    methodological contribution not present in standard tool-use learning — Toolformer
    uses self-supervised API calls, not hindsight-labeled trajectory forking with
    death-avoidance signals. The safety-aware framing has genuine content if properly
    positioned.


    ### R2 → R1 feedback

    R2 agrees the hindsight labeling underspecification (W1) is the most actionable
    weakness — it''s a solvable problem that would substantially strengthen the paper.
    R2 also endorses W2 (explicit/implicit confound) as the most damaging experimental
    weakness. On the oracle concern (W4), R2 notes this is related to the penalty
    structure issue (W12): the oracle looks near-optimal partly because the penalty
    function creates a binary success/failure landscape where any death-avoiding strategy
    looks good.


    ### Consensus positions

    1. **Missing tool-use literature is the paper''s biggest positioning gap** (W8).
    Must be addressed in revision.

    2. **Hindsight labeling criterion must be specified** (W1). Solvable.

    3. **Explicit/implicit confound** (W2) weakens C2. A parameter-matched control
    is needed.

    4. **The death-avoidance insight** (70% of gain) is the paper''s most distinctive
    contribution and is genuinely useful — this is what differentiates it from generic
    tool-use learning.

    5. **ScienceWorld penalty structure** (W12) means quantitative gains are benchmark-specific;
    the paper should discuss how gains would look without catastrophic penalties.

    6. **Failure taxonomy** is useful analysis but should not be listed as a core
    contribution alongside C2.


    ---


    ## Step 4: Consolidated Assessment


    ### Overall Score: **4 (Weak Accept, borderline)**


    ### Confidence: 4/5


    ### Decision Rationale


    **For acceptance:** The paper identifies a clean, practical problem (when should
    an LLM agent defer to deterministic computation?) and provides a well-executed
    empirical answer. The gain decomposition (70% death avoidance, 30% positive guidance)
    is an insight that advances understanding of agent failures. The ablation coverage
    — explicit/implicit, 2-way/3-way, router size, cross-task transfer, MATH generalization
    — is above average for a short paper. The modular design (lightweight router decoupled
    from backbone) is a defensible architectural choice with concrete benefits (lower
    false negatives, efficient simulator invocation). All 10 planned experiments are
    reported.


    **Against acceptance:** The novelty over existing tool-use learning methods (Toolformer,
    ART, Chameleon) is inadequately argued — the missing citations are a serious omission.
    The explicit/implicit comparison confounds architecture with parameter budget.
    The hindsight labeling criterion — the foundation of the training signal — is
    not specified. The primary benchmark (ScienceWorld) has an extreme penalty structure
    that amplifies gains, limiting generalizability of quantitative claims. The oracle
    may be suboptimal, undermining the "near-oracle" narrative.


    **Net assessment:** The empirical work is thorough and the death-avoidance insight
    is genuine, but the paper needs revision on positioning (tool-use literature),
    methodological specification (labeling criterion), and experimental controls (parameter-matched
    implicit baseline). At a 25% acceptance venue, this is a borderline paper that
    could go either way depending on the strength of the author response. The core
    contribution — demonstrating that modular safety-aware routing substantially reduces
    catastrophic agent failures — has practical value.


    ### Actionable Revision Priorities


    1. **(Must-fix)** Add a Related Work section positioning against Toolformer, ART,
    Chameleon, ToolkenGPT. Articulate what counterfactual trajectory labeling provides
    that self-supervised tool-use learning does not.

    2. **(Must-fix)** Specify the hindsight labeling criterion (comparison window,
    tie-break policy, handling of sparse rewards). Report sensitivity to these choices.

    3. **(Must-fix)** Add a parameter-matched 1.7B implicit routing baseline to isolate
    architecture from capacity in the explicit/implicit comparison.

    4. **(Should-fix)** Discuss how gains would look without catastrophic penalties
    (e.g., report scores excluding death-penalty episodes, or use a penalty-free variant).

    5. **(Should-fix)** Report per-task confidence intervals, not just aggregated
    CIs.

    6. **(Should-fix)** Add MATH methodological details (Appendix E).

    7. **(Nice-to-have)** Fix placeholder arXiv IDs. Reproduce CogRouter under identical
    conditions if possible.


    ### Experiment Coverage vs Plan

    All 10 planned experiments appear in the paper: counterfactual collection (§2/App
    A), router training (§2/App B), end-to-end eval (§3.2), explicit/implicit (§3.3),
    routing analysis (§3.4), 2v3-way (§3.5/App D), boil rerun (App C), router size
    (§3.5), MATH (App E), cross-task transfer (App F). Coverage: **10/10 (100%)**.


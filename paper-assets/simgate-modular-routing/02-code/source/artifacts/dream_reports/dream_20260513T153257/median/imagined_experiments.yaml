    signal_positive_task_types: 13
    strong_signal_types: 7
    moderate_signal_types: 4
    weak_signal_types: 2
    no_signal_types: 7
    strong_signal_list: boil, melt, change-state-of-matter, freeze, use-thermometer,
      mix-chemicals, react-acid-base
    moderate_signal_list: mix-paint, measure-melting-point, conduct-electricity, identify-life-stages
    weak_signal_list: grow-plant-basic, navigate-rooms
    no_signal_example: grow-plant-advanced, read-thermometer, find-animal, classify-living,
      ecology-food-web, identify-rocks, use-microscope

    在部分条件下边缘 (A3)。 Explicit 1.7B vs implicit 1.7B: +4.7 分，parameter-matched comparison
    显著 (p<0.05)。 这说明 explicit modular router 架构本身有价值——将 routing decision 从 generation
    中解耦， 避免了 implicit routing 中 generation 任务和 routing 任务的 multi-task interference。
    Explicit 1.7B vs implicit 7B: +3.4 分，但 CI overlap 大 (p=0.08，边缘显著)。 7B implicit
    比 1.7B implicit 好 1.3 分——额外容量有 marginal 帮助但不足以弥补架构劣势。 Implicit routers 的 sim_invocation_ratio
    偏低 (35-38.5% vs explicit 41.2%)—— implicit routing 倾向于 under-invoke simulator（routing
    signal 在 generation logits 中被稀释）， 导致更多 catastrophic failures 未被拦截。 这个 "consistent
    but moderate advantage" 的结果支持 C2 的定性 claim（interpretability, modularity） 而非强 performance
    claim。Median 档下 C2 的重心应转向： explicit router 可独立替换、routing decisions 可分析，这些定性价值在
    3-5 分性能差距之上额外成立。

    '

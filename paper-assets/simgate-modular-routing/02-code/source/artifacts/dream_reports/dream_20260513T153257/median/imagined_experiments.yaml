- name: Full Counterfactual Trajectory Collection
  plan_id: plan-001b
  description: '对 plan-001a 筛出的 13 个 signal-positive task types 各跑 20 episodes， 2-way
    counterfactual collection (internal + deterministic)，max_steps=30， 记录每步最优 modality
    的 hindsight labels。

    '
  expected_results:
    task_types_collected: 13
    episodes_per_task: 20
    total_episodes: 260
    total_steps_labeled: 6240
    label_distribution_deterministic_pct: 38.5
    label_distribution_internal_pct: 61.5
    label_agreement_strong_tasks_pct: 82.0
    label_agreement_weak_tasks_pct: 64.0
    noisy_label_rate_overall_pct: 18.5
    avg_steps_per_episode: 24.0
    gpu_hours_actual: 23.5
  result_rationale: 'Median 档下 counterfactual labels 泛化中等（A4），具体表现为： 强信号 tasks (physics/chemistry)
    的 label agreement ~82%——大多数步骤中 deterministic 和 internal 的优劣清晰， 因为 death/survival
    差异提供了 binary signal。 弱信号 tasks 的 label agreement 仅 ~64%——很多步骤两种 modality 表现相近（都不死也都没进展），
    hindsight labeling 分不出哪个更好，导致标签噪声大。 整体 38.5% 步骤 labeled as deterministic-preferred，说明不是每步都需要
    safety net， 支持 selective routing 的必要性。但这个比例意味着 router 要学会一个相当细粒度的 per-step 判断。
    标签噪声 ~18.5% 将直接限制 router accuracy 的上限（A4），是 median 档 router accuracy 65-75% 的根本原因。

    '

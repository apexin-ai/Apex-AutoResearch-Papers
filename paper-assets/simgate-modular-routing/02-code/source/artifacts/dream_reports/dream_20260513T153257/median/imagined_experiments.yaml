- name: Router SFT Training
  plan_id: plan-002
  description: '在 plan-001b 的 counterfactual labels 上 fine-tune Qwen3-1.7B 做 2-way
    classification (internal vs deterministic)。Leave-one-out cross-validation by task
    type。

    '
  expected_results:

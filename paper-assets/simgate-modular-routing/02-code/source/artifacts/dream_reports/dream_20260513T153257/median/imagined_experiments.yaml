- name: Mini Signal Detection (Pre-screening)
  plan_id: plan-001a
  description: '对 ~20 个 ScienceWorld task type 各跑 5 episodes，2-way (internal + deterministic)，
    筛选出 det > internal 的 task types 进入 plan-001b。

    '

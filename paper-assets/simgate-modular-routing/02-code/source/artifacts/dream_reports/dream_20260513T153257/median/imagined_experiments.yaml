tier: median
narrative_guidance: '整体叙事从 "new SOTA via safety-aware routing" 转向 "first explicit
  study of when deterministic computation helps LLM agents, with controlled causal
  evidence"。 C1 不与 CogRouter 直接比 SOTA，改为强调 SimGate vs 自身 ablation baselines 的受控实验，headline
  为 "reduces catastrophic failures by ~50%"。 C2 explicit vs implicit 差距写成 "consistent
  but moderate advantage"，重心转向 interpretability/modularity 的定性价值。 routing pattern
  分析从 failure mode taxonomy 降为 phase-dependent routing trends。 补充 plan-006 (2-way
  vs 3-way) 增加实验密度弥补 headline number 不够突出的不足。

  '

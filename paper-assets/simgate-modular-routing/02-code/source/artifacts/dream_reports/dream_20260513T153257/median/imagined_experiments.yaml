- name: SimGate End-to-End Evaluation
  plan_id: plan-003
  description: 'Trained router + Qwen2.5-7B backbone 在 held-out episodes 上端到端评估。 对比
    always-internal, always-deterministic, oracle-routing, random-routing, confidence-threshold
    heuristic。

    '
  expected_results:
    simgate_score_overall: 78.2
    always_internal_score: 56.8
    always_deterministic_score: 70.5
    oracle_routing_score: 81.2
    random_routing_score: 63.4
    confidence_threshold_score: 66.8
    simgate_minus_always_internal: 21.4
    simgate_minus_always_deterministic: 7.7
    oracle_minus_simgate: 3.0
    oracle_minus_always_det: 10.7
    catastrophic_failure_rate_internal_pct: 48.5
    catastrophic_failure_rate_simgate_pct: 22.3
    catastrophic_failure_rate_det_pct: 8.5
    catastrophic_failure_reduction_pct: 54.0
    simulator_invocation_ratio_pct: 41.2
    cogrouter_reported: 84.6
    itp_r_reported: 62.58
    simgate_minus_cogrouter: -6.4
    bootstrap_90ci_simgate:
    - 74.5
    - 81.8
    bootstrap_90ci_always_internal:
    - 52.0
    - 61.5
    bootstrap_90ci_always_det:
    - 66.2
    - 74.8
    task_types_with_significant_gain: 10
    gpu_hours_actual: 14.0
  result_rationale: 'Median 档 simgate_score_overall 72-84，取 78.2。未超过 CogRouter (84.6)
    但差距 6.4 分， 在 bootstrap CI 下两者 overlap（SimGate CI 上界 81.8 vs CogRouter 84.6），不能
    claim SOTA。 SimGate vs always-internal +21.4 分——核心 safety-net value，catastrophic
    failure 从 48.5% 降至 22.3%（降幅 54%）， 符合 median 档 catastrophic_failure_reduction_pct
    40-60%。 SimGate vs always-deterministic +7.7 分——selective routing 价值，说明并非所有步骤需要
    safety net， unconditional simulation 在低风险步骤引入了不必要的 rigid execution（LLM 在安全步骤上
    reasoning 更灵活）。 Oracle vs SimGate 仅 3.0 分——router 已捕获大部分可学习的 routing signal，剩余
    gap 来自弱 task types 的标签噪声。 Simulator invocation ratio 41.2%——router 在约 40% 步骤调用
    deterministic，远少于 always-det 的 100%， 说明 router 学到了 selective invocation pattern。
    对比 CogRouter 差距的原因：CogRouter 用 RL (CoPO) 在 trajectory 级别优化， SimGate 用 SFT per-step
    labels，且无 positive guidance signal (A6)——router 仅防死不指路。 10/13 task types 显著增益（physics
    5/5 + chemistry 3/3 + moderate 2/4）， 符合 median 档 task_types_with_significant_gain
    8-12。

    '

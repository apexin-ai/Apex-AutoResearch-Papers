    val_accuracy_overall_pct: 71.2
    val_accuracy_strong_tasks_pct: 78.5
    val_accuracy_moderate_tasks_pct: 66.0
    val_accuracy_weak_tasks_pct: 58.3
    val_f1_deterministic: 0.68
    val_f1_internal: 0.74
    leave_one_out_accuracy_range:
    - 62.0
    - 76.0
    leave_one_out_mean_accuracy: 68.5
    best_epoch: 2
    convergence_epoch: 3
    gpu_hours_actual: 6.5
  result_rationale: 'Median 档 router accuracy 65-75% (A4)。整体 val accuracy 71.2% 符合此区间。
    强信号 tasks 的 labels 清晰（death/survival 二分），router 在这些 tasks 上学到了有效的 pattern， accuracy
    达 78.5%。弱信号 tasks 的标签噪声大，router accuracy 仅 58.3%——接近 random baseline (50%)。 Leave-one-out
    验证显示跨 task type 泛化中等（A4），range 62-76%： 留出 physics task 时其他 physics tasks 提供足够
    coverage，accuracy 高端 (~76%)； 留出 biology task 时几乎没有同 domain 训练数据，accuracy 低端 (~62%)。
    F1 score deterministic < internal 反映类别不平衡（38.5% vs 61.5%）和 deterministic labels
    更noisy。 Train loss 未过拟合（epoch 2-3 之间收敛），但 val accuracy 到 epoch 3 后不再提升， 说明瓶颈在标签质量而非模型容量。


  result_rationale: 'Median 档下 death avoidance 是主要增益来源但集中在 physics/chemistry tasks。
    涉及温度变化、相态转换、化学反应的 7 个 task type 展示强信号（det-internal ~35-45 分）， 因为 LLM 在多步物理推理中频繁
    hallucinate 状态导致 death (-100)，deterministic oracle 消除了这些 catastrophic failures。
    4 个 moderate signal tasks 有部分物理/化学子步骤但非全程依赖，增益在 10-25 分。 2 个 weak signal tasks
    动作空间简单、death 风险低，deterministic 的 safety-net 价值有限。 7 个 no-signal tasks（生态观察、分类、阅读类）几乎无
    death 惩罚，internal reasoning 本身足够， det invocation 反而引入不必要的 rigid execution，无法利用
    LLM 的灵活推理优势。 这个 13/20 的通过率说明 safety-aware routing 不是 universal solution，而是 domain-specific
    mechanism。


  result_rationale: 'Median 档下 3-way 与 2-way 差距小且不显著 (+1.6, p=0.22)。 Fast/deep internal
    区分的理论价值在于：deep-internal 在需要更多 reasoning 但不需要 ground-truth 的步骤上 用 extended thinking
    提升质量。但实际效果有限，原因： (1) death avoidance 是主要增益来源 (A6)——一旦 deterministic 拦截了 catastrophic
    failures， 剩余步骤中 fast vs deep internal 的差异很小（LLM 在安全步骤上的表现差异不大）。 (2) 没有 positive
    guidance signal——deep internal 不能给出更好的 task guidance，只是"想更久"， 但在 deterministic
    已经处理了高风险步骤后，多想对安全步骤帮助有限。 (3) Router 从 2-class 升到 3-class 增加了 classification 难度，在
    median 档标签噪声下性能提升被抵消。 结论：2-way 足够，simplifies the story。Paper 中可以一句话报告 "binary
    routing (simulate-or-not) suffices; adding a third modality yields no significant

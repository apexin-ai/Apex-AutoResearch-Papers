  - table_id: tab2_synthetic
    caption: "Synthetic validation under judge-contamination confounding (rho=0.6, N=50, I=100, J=8, 20 seeds). G-MFRM reduces theta-RMSE by 43.8% over sequential pipeline."
    placement: experiments
    type: comparison
    columns: ["Method", "theta-RMSE", "Kendall-tau", "Wilcoxon p"]
    data_source: "registry: mvp_003"
    notes: "4 rows: Raw Average, MFRM-only, Sequential, Joint G-MFRM. Bold best."
    phase: 1

  - table_id: tab3_main_results
    caption: "[Phase 2] Agreement between corrected rankings and Chatbot Arena human votes."
    placement: experiments
    type: comparison
    columns: ["Method", "MT-Bench tau", "MT-Bench rho", "Arena-Hard tau", "Arena-Hard rho"]
    data_source: "registry: exp-003, exp-004"
    notes: "10-12 representative models (per family: largest + smallest). 8 method rows. Bold best, underline second. Full 14+ model table in Appendix (tab_appendix_full)."
    baseline_row: "G-MFRM"
    phase: 2

  - table_id: tab4_ablation
    caption: "[Phase 2] Ablation: contribution of each G-MFRM component to ranking quality."
    placement: experiments
    type: ablation
    columns: ["Configuration", "Kendall-tau", "Delta-tau"]
    data_source: "registry: exp-003 (component ablation runs)"
    baseline_row: "Full G-MFRM"
    notes: "Rows: Full, w/o gating (c_n=0), w/o judge facet (d_j=0), w/o NCP, w/o Horseshoe prior. Full numbers. If 8-page overflow, this table is first to cut (Director approved)."
    phase: 2

  - table_id: tab_appendix_full
    caption: "[Phase 2] Full results for all 14+ target models across all baselines."
    placement: appendix
    type: comparison
    columns: ["Model", "Family", "Size", "Method", "MT-Bench tau", "Arena-Hard tau"]
    data_source: "registry: exp-003, exp-004"
    notes: "Complete table with all models. Main text refers to Appendix for full results."
    phase: 2

literature_strategy:
  citation_budget: 35
  macro_context:
    - "LLM-as-a-judge evaluation methodology"
    - "benchmark contamination detection and adjustment"
    - "psychometric measurement models (IRT, MFRM)"
    - "two-step econometric estimation and errors-in-variables"
  micro_clusters:
    - cluster_name: "Psychometric & IRT Foundations"
      search_queries:
        - "many-facet Rasch model rater effects psychometrika"
        - "item response theory LLM evaluation benchmark"
        - "deterministic gated IRT cheating detection Shu 2013"
        - "Bayesian item response theory Fox 2010"
      must_cite:
        - "Shu et al. 2013 DG-IRT Psychometrika"
        - "Linacre 1989 Many-Facet Rasch Measurement"
        - "Eckes 2011 Introduction to Many-Facet Rasch Measurement"
      target_count: 8

    - cluster_name: "Judge Bias Correction"
      search_queries:
        - "LLM judge bias mitigation debiasing 2025 2026"
        - "CyclicJudge round-robin LLM evaluation"
        - "unsupervised debiasing alignment UDA LLM judges"
      must_cite:
        - "CyclicJudge 2026"
        - "UDA 2026 AAAI"
        - "Zheng et al. 2023 MT-Bench Chatbot Arena NeurIPS"
      target_count: 6

    - cluster_name: "Contamination Detection & Adjustment"
      search_queries:
        - "benchmark contamination detection LLM evaluation 2024 2025"
        - "data contamination quantification language model ConStat"
        - "Min-K% perplexity contamination Shi 2023"
      must_cite:
        - "ConStat 2024 NeurIPS"
        - "DCR 2025 EMNLP"
        - "Golchin & Surdeanu 2023 contamination"
        - "Shi et al. 2023 Min-K%"
      target_count: 7

    - cluster_name: "Econometrics & Two-Step Estimation"
      search_queries:
        - "omitted variable bias Angrist Pischke econometrics"
        - "two-step maximum likelihood Murphy Topel 1985"
        - "errors in variables attenuation bias Fuller"
        - "generated regressors Pagan 1984"
      must_cite:
        - "Angrist & Pischke 2009 Mostly Harmless Econometrics"
        - "Murphy & Topel 1985 two-step variance"
        - "Heckman 1979 sample selection"
      target_count: 4

    - cluster_name: "LLM Evaluation Benchmarks"
      search_queries:
        - "Arena-Hard LLM benchmark evaluation"
        - "Chatbot Arena crowdsourced evaluation"
        - "LiveBench contamination-free benchmark"
      must_cite:
        - "Zheng et al. 2023 Chatbot Arena"
      target_count: 4

    - cluster_name: "MFRM+DIF Educational Measurement"
      search_queries:
        - "differential item functioning many-facet Rasch"
        - "Bayesian IRT rater effects Fox Glas 2001"
        - "DIF detection LLM fairness"
      must_cite:
        - "Wind & Peterson 2018"
        - "Fox & Glas 2001 Bayesian IRT"
      target_count: 3

writing_order:
  # Phase 1 (today): sections not dependent on real-data experiments
  - background       # foundational notation + OVB observation
  - method           # G-MFRM model, staged estimation, identifiability, error propagation
  - introduction     # motivation + hook + contributions (needs method context)
  - related_work     # positioning (needs method for differentiation)
  - abstract         # synthesizes all Phase 1 sections, placeholder for real-data numbers
  # Phase 2 (after real-data experiments):
  - experiments      # real-data results + synthetic validation
  - conclusion       # summarizes all
  - limitations      # 3 points, short paragraph

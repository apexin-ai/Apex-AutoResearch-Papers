- name: gmfrm_real_data_fit
  plan_id: exp-003
  description: '在 exp-001/002 的真实数据上拟合 G-MFRM 三阶段流程。 Stage 1: MFRM 估计 θ,b,d。Stage
    2: 使用 exp-002 的 e_i。 Stage 3: Joint gated model。与 Chatbot Arena 人类投票比较。

    '
  expected_results:
    stage1_convergence_max_rhat: 1.01
    stage1_convergence_min_ess: 820
    stage1_kendall_tau_arena: 0.843
    stage1_d_j_range:

  analysis: 'exposure 信号的整体微弱是 worst 档的核心特征之一。这并非方法论失败—— ConStat 在合成数据上 r²=0.94 是已验证的——而是反映真实数据中主流
    LLM 的 benchmark 污染确实已被缓解（训练数据清洗、instruction tuning 策略改进）。 对 pivot (1) 有利：e_i 接近零本身就是
    G-MFRM 框架产出的有价值诊断结论。 但对原始 framing 致命：没有足够的 exposure 变异来驱动 c_n 估计。


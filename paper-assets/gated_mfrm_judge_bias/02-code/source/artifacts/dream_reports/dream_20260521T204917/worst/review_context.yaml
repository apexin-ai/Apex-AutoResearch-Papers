narrative_guidance: '核心 confounding claim 在真实数据上不成立——污染量级不足以产生可观测 confounding。 c_n
  后验集中在零附近，先验主导后验，G-MFRM 退化为标准 MFRM。Sequential 与 joint 无统计显著差异，因为被建模的 confounding
  通道在真实数据上近乎关闭。 需要彻底 reframe：推荐 pivot (1) "Diagnostic Framework" 角度——G-MFRM 作为联合 诊断框架，在合成数据上验证检测力，在真实数据上给出"当前污染已被缓解"的实证结论，
  框架为未来监测提供现成工具。exp-009 的 formal proposition 作为方法论贡献保留， 不依赖实证量级。论文核心贡献从 "correction"
  转向 "detection + monitoring readiness"。

  '
imagined_experiments:
- name: multi_judge_data_collection
  plan_id: exp-001
  description: '收集 8 judge × 20+ target models 在 MT-Bench 和 Arena-Hard 上的多评委评分数据。
    Position swap 后总评估量约 8×20×2×(80+500)=185,600 次。

    '
  expected_results:
    num_judges: 8
    num_target_models: 22
    num_benchmarks: 2
    total_evaluations: ~186000
    api_cost_usd: 870
    gpu_hours_used: 118
    missing_rate_pct: 1.2
    inter_judge_agreement_fleiss_kappa: 0.38
    position_bias_swap_disagreement_pct: 14.5
  result_rationale: '数据收集本身不受 contamination 量级影响，预期正常完成。 inter-judge agreement 中等偏低（κ~0.38）反映
    LLM judge 间固有差异—— 这本身支持 MFRM 建模 judge severity 的必要性。Position swap disagreement
    ~14.5% 是 MT-Bench/Arena-Hard 上的典型值。数据质量足以支撑下游分析， 但不会改变"真实污染弱"的底层事实。

    '

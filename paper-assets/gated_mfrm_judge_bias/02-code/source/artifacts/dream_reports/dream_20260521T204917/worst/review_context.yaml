    sequential（0.845）和 MFRM-only（0.843）的差异不显著 （p=0.28, 0.31）。Bootstrap 95% CI 跨零（[-0.008,
    0.021]）。 关键观察：(a) raw average → MFRM-only 的提升（0.812→0.843, +0.031） 是所有比较中最大且显著的，说明
    judge bias 校正有真实价值； (b) MFRM-only → sequential → G-MFRM 的增量极小（0.843→0.845→0.851），

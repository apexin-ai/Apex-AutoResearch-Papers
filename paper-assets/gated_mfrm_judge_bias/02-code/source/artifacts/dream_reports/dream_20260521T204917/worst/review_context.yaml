    pivot (2) "Judge Bias as Main Story" 保留了空间。数据完整性和规模满足后续所有实验需求。

    '
- name: constat_exposure_estimation
  plan_id: exp-002
  description: '通过 ConStat 方法估计每个 benchmark item 的 exposure 指标 e_i： 生成参考变体（rephrased），计算
    delta scores，结合 temporal signals。

    '
  expected_results:
    num_items_mtbench: 80
    num_items_arenahard: 500
    num_reference_variants_per_item: 3
    constat_delta_mean: 0.08
    constat_delta_std: 0.12
    constat_delta_median: 0.04
    items_with_significant_delta_pct: 12.0
    rank_correlation_constat_vs_temporal: 0.31
    human_equivalence_check_pass_rate_pct: 89
    e_i_distribution_skewness: 2.1
    effective_signal_items_pct: 15
  result_rationale: 'worst 档下，真实污染量级弱（c̄ < 0.4），大多数 item 的 ConStat delta 接近零（均值 0.08），因为模型在原题和变体上的表现差异主要来自噪声而非记忆。
    仅约 12% 的 item 有统计显著的 delta——这些可能对应少数确实被泄露的题目， 但整体 exposure 信号微弱。e_i 分布高度右偏（skewness=2.1）：绝大多数
    item 的 e_i 接近零，少数 item 有中等信号。ConStat 与 temporal signal 的 rank correlation 仅 0.31，说明两个
    indicator 捕捉的是不同维度的噪声 而非一致的污染信号。参考变体的人工等价性检查通过率 89% 是可接受的， 说明变体质量不是瓶颈——问题在于污染本身就弱。

    '

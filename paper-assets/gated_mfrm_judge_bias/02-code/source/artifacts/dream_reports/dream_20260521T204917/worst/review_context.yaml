    monte_carlo_n_settings: 120
    bias_direction_correct_pct: 97.2
    bias_magnitude_relative_error_mean: 0.08
    bias_magnitude_relative_error_std: 0.05
    critical_rho_threshold: 0.15
    critical_c_mean_threshold: 0.6
    bias_negligible_below_c_mean: 0.4
    type1_error_rate: 0.048
  result_rationale: '形式命题是纯数学结果，不依赖真实数据量级——在 worst 档下仍然成立。 Monte Carlo 验证覆盖 120 个参数设定（c_mean
    × ρ × N × J 的网格）， 偏差方向预测准确率 97.2%，量级相对误差 8%——理论近似在常规参数范围 内有效。关键发现：偏差在 ρ > 0.15
    且 c_mean > 0.6 时才变得实质性 显著（> 5% RMSE degradation）。当 c_mean < 0.4（worst 档的真实数据范围），
    即使 ρ=0.6，偏差也可忽略——这恰好解释了为什么 exp-005 发现真实数据上 confounding 不可观测。命题本身仍有价值：它精确描述了 confounding

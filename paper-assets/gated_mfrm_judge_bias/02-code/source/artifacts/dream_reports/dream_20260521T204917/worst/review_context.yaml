    - 0.71
    stage1_d_j_std: 0.35
    stage3_convergence_max_rhat: 1.06
    stage3_convergence_min_ess: 112
    stage3_kendall_tau_arena: 0.851
    c_n_posterior_mean: 0.14
    c_n_posterior_std: 0.11
    c_n_95ci_covers_zero_pct: 78
    c_n_prior_posterior_kl_divergence: 0.08
    delta_tau_stage3_vs_stage1: 0.008
    wilcoxon_p_stage3_vs_stage1: 0.34
    runtime_seconds: 5200
  result_rationale: 'Stage 1 MFRM 收敛良好（R̂=1.01, ESS=820），因为 MFRM 是成熟模型， judge severity
    d_j 有充足数据支撑。Stage 1 的 τ=0.843 反映 MFRM 对 judge bias 的有效校正。Stage 3 joint model 收敛变差（R̂=1.06,
    ESS=112）——c_n 参数数据信息量不足时，MCMC 在先验附近 random walk， 链间混合慢。c_n 后验均值仅 0.14，78% 的模型
    c_n 的 95% 可信区间 覆盖零，说明先验主导后验——数据中没有足够信号将 c_n 从先验拉开。 prior-posterior KL 仅 0.08 进一步确认这一点。Stage
    3 的 τ=0.851 比 Stage 1 仅高 0.008，Wilcoxon p=0.34 远不显著。本质上 joint model 退化为一个带噪声 c_n
    项的 MFRM——gating 机制因 e_i 信号弱而几乎 不激活，c_n 被先验钉在零附近，θ 估计基本等于 Stage 1 的 MFRM 估计。


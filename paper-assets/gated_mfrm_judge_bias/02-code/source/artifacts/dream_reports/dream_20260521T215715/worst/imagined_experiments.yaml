  result_rationale: 'Under worst tier, diagnostics reveal non-trivial issues. Stage
    1 (MFRM) fits well — θ, b, d facets have acceptable infit/outfit ranges. But Stage
    3 c_n parameters show problematic fit: 7/22 models have c_n outfit MNSQ outside
    [0.7, 1.3], and the range extends to 2.10, indicating substantial misfit. This
    occurs because for models with c_n ≈ 0, the gating mechanism is essentially inactive
    and the model reduces to MFRM — but the c_n parameter still "floats" in the posterior,
    producing erratic fit statistics. 23 divergent transitions suggest the sampler
    struggles with the boundary behavior near c_n = 0. Posterior predictive p-value
    of 0.08 is borderline — not a clear pass. The Stage 1→Stage 3 construct coherence
    check (person-fit lz vs c_n) shows only moderate correlation (ρ=0.35), meaning
    the two stages flag partially overlapping but not identical sets of anomalous
    models. This is expected (lz captures overall misfit, c_n captures contamination
    specifically) but limits the narrative of c_n as a clean contamination indicator.

    '
  tables:
  - name: 'Table A4: Facet Fit Statistics'
    description: 'Rows = facets (θ, b, d, c_n). Columns = N parameters, infit MNSQ
      range, outfit MNSQ range, N misfitting (outside [0.7, 1.3]), max R̂, min ESS.

      '
  - name: 'Table A5: Misfitting Elements Detail'
    description: 'Lists all misfitting elements with their infit/outfit values and
      likely cause.

      '
  figures_description:
  - 'Fig A5: Trace plots for 4 worst-converging c_n parameters. Shows poor mixing
    with chains occasionally stuck near zero.'
  - 'Fig A6: Posterior predictive check — observed vs predicted response distributions.
    Slight systematic underprediction for high-ability models on high-exposure items.'
  - 'Fig A7: Person-fit lz (Stage 1) vs c_n (Stage 3) scatter. Moderate positive trend
    with substantial scatter.'
  analysis: 'Diagnostics under worst tier are reportable but require honest discussion
    of limitations. The c_n misfit and convergence issues are the main concerns. For
    the reframed paper, these are acknowledged in Limitations: "when true contamination
    is near zero, c_n parameters are weakly identified, producing wider posteriors
    and occasional convergence warnings. We recommend interpreting c_n point estimates
    cautiously for individual models and focusing on the distribution-level pattern."
    The borderline posterior predictive p-value should be reported transparently.

    '
- name: confounding_formal_observation
  plan_id: exp-009
  description: 'Formal OVB bias derivation + Monte Carlo validation + synthetic c_n
    recovery validation.

    '
  expected_results:
    bias_direction_confirmed: true
    bias_magnitude_proportional_to_cov_d_ce: true
    monte_carlo_scenarios: 500
    bias_observed_in_pct_scenarios: 100
    theta_rmse_degradation_sequential_median_pct: 38.2
    theta_rmse_degradation_sequential_range_pct:
    - 15.4
    - 68.7
    c_n_recovery_rmse_gmfrm: 0.42
    c_n_recovery_rmse_naive: 0.85
    c_n_95ci_coverage_probability: 0.78
    c_n_recovery_rmse_by_magnitude:
      low_cn_lt_0_3: 0.55
      mid_cn_0_3_to_0_8: 0.35
      high_cn_gt_0_8: 0.28
    kendall_tau_improvement_joint_vs_seq_synthetic: +6.3pp (median across scenarios)
  result_rationale: 'The formal observation and Monte Carlo validation succeed under
    worst tier because they are mathematical/synthetic — they do not depend on real
    contamination magnitude. The OVB bias derivation is a mathematical fact that holds
    regardless. Monte Carlo across 500 parameter configurations confirms sequential
    estimators are biased in 100% of scenarios where d_j and c_n·e_i are non-orthogonal
    (which is the generic case). However, the c_n point-estimate recovery validation
    shows concerning results under worst tier: overall RMSE of 0.42 (within the worst-tier
    range of 0.3-0.5), and 95% CI coverage at only 78% (below nominal 95%). Recovery
    is worst for low c_n (RMSE=0.55) — exactly the regime matching real data. The
    model struggles to distinguish c_n=0.05 from c_n=0.20, both being "near zero."
    Recovery is better for high c_n (RMSE=0.28), confirming the method works when
    contamination is strong but struggles when it''s weak. This is consistent with
    the information-theoretic argument: weak signal → poor recovery. For the paper,
    this becomes both a strength (method works when needed) and an acknowledged limitation
    (point estimates unreliable for low-contamination models).

    '
  tables:
  - name: 'Table 1: Sequential Estimator Bias — Monte Carlo Validation'
    description: 'Rows = parameter configurations (grouped by contamination strength).
      Columns = θ-RMSE (joint), θ-RMSE (sequential), degradation %, bias direction
      matches theory (Y/N). Shows bias exists across all configurations.

      '
  - name: 'Table A6: c_n Recovery Accuracy by Contamination Magnitude'
    description: 'Rows = c_n magnitude bins (low/mid/high). Columns = RMSE, MAE, 95%
      CI coverage, bias. Shows recovery degrades for low c_n.

      '
  figures_description:
  - 'Fig 1: Left panel: sequential pipeline schematic with OVB confounding arrows
    annotated. Right panel: G-MFRM joint pipeline with all facets connected. Center:
    formal bias expression with annotated terms.'
  - 'Fig A8: Monte Carlo θ-RMSE distribution: joint (blue) vs sequential (red). Blue
    distribution shifted left (lower RMSE) across all scenarios. Gap widens with increasing
    contamination strength.'
  - 'Fig A9: c_n recovery scatter (fitted vs true). Good calibration for c_n > 0.5,
    systematic overestimation for c_n near 0 (posterior pulled toward prior mass).'
  analysis: 'exp-009 is the strongest experiment under worst tier because it establishes
    mathematical ground truth independent of real data. The OVB observation is unassailable.
    The synthetic results show the method works in principle. The c_n recovery limitation
    at low contamination is honest and actually strengthens the paper — it explains
    WHY real-data results are weak (the signal is genuinely small) rather than blaming
    methodology failure. This experiment anchors the reframed narrative: "we prove
    confounding exists, we prove our method resolves it when contamination is strong,
    and we show current contamination is fortunately weak."

    '
- name: error_propagation_sensitivity
  plan_id: exp-012
  description: 'Inject noise into e_i at σ=0.1, 0.2, 0.5. Measure θ̂ RMSE degradation
    and c_n recovery. Synthetic data with known ground truth.

    '
  expected_results:
    theta_rmse_sigma_0_0: 0.124
    theta_rmse_sigma_0_1: 0.131
    theta_rmse_sigma_0_2: 0.156
    theta_rmse_sigma_0_5: 0.238
    theta_rmse_degradation_sigma_0_1_pct: 5.6
    theta_rmse_degradation_sigma_0_2_pct: 25.8
    theta_rmse_degradation_sigma_0_5_pct: 91.9
    c_n_recovery_rmse_sigma_0_0: 0.28
    c_n_recovery_rmse_sigma_0_1: 0.33
    c_n_recovery_rmse_sigma_0_2: 0.45
    c_n_recovery_rmse_sigma_0_5: 0.72
    tau_sigma_0_0: 0.922
    tau_sigma_0_1: 0.915
    tau_sigma_0_2: 0.896
    tau_sigma_0_5: 0.861
    breakpoint_sigma_for_seq_equivalence: 0.35
  result_rationale: 'Under worst tier, error propagation is concerning. At σ=0.2 (a
    plausible noise level given the performance-gap method''s ρ=0.41 with LogProber),
    θ̂ RMSE degrades by 25.8% — exceeding the 15% threshold flagged as concerning.
    This occurs because noisy e_i causes the gating mechanism to misallocate contamination
    corrections: items with overestimated e_i receive excessive correction, items
    with underestimated e_i receive insufficient correction, and these errors compound
    through the c_n estimation. At σ=0.5, degradation is severe (91.9%) and G-MFRM
    becomes worse than sequential (breakpoint at σ≈0.35). This is the most damaging
    result for the staged estimation defense: real e_i noise is plausibly σ≈0.18-0.25
    based on exp-002 residuals, placing us in the "concerning" range. The c_n recovery
    RMSE at σ=0.2 is 0.45, meaning individual c_n estimates have large errors. For
    the paper, this MUST be discussed in Limitations. The defense: (1) σ=0.2 degradation
    (25.8%) is still better than ignoring contamination entirely when contamination
    is moderate-to-strong; (2) the multi- source e_i pipeline aims to keep σ below
    0.15; (3) sensitivity analysis itself demonstrates methodological rigor and transparency.

    '
  tables:
  - name: 'Table 12: Error Propagation Sensitivity Analysis'
    description: 'Rows = noise levels (σ = 0, 0.1, 0.2, 0.3, 0.5). Columns = θ̂ RMSE,
      degradation %, c_n RMSE, τ, comparison with sequential τ. Highlights σ=0.35
      breakpoint where G-MFRM = sequential.

      '
  figures_description:
  - 'Fig 10: Line plot of θ̂ RMSE vs e_i noise σ. G-MFRM curve (blue) rises steeply;
    sequential baseline (red dashed) is flat. Intersection at σ≈0.35 annotated. Green
    shaded region shows estimated real noise range (σ=0.15-0.25).'
  - 'Fig A10: c_n recovery scatter at σ=0, 0.2, 0.5 (three panels). Progressive deterioration
    visible. At σ=0.5, fitted c_n bears little resemblance to truth.'
  analysis: 'This experiment honestly quantifies the Achilles heel of staged estimation.
    The 25.8% degradation at σ=0.2 is above the comfort threshold but not catastrophic.
    The breakpoint at σ=0.35 provides a concrete "safety margin" — if e_i estimation
    can be kept below this noise level, G-MFRM still helps. The estimated real noise
    (σ≈0.18-0.25) straddles the concerning zone. For worst-tier narrative, this experiment
    is reported with full transparency as evidence of methodological rigor. The defense
    of staged estimation becomes: "conditional on e_i quality, G-MFRM outperforms
    sequential; improving e_i estimation (e.g., via broader LogProber access) directly
    translates to better contamination correction."

    '
- name: wildbench_replication
  plan_id: exp-010
  description: 'Replicate G-MFRM pipeline on WildBench for cross-benchmark generalization.

    '
  expected_results:
    wildbench_c_n_median: 0.12
    wildbench_c_n_max: 0.48
    wildbench_tau_gmfrm: 0.82
    wildbench_tau_mfrm: 0.82
    wildbench_tau_uda: 0.83
    wildbench_delta_tau_vs_uda: -0.01
    wildbench_convergence_max_rhat: 1.15
    wildbench_convergence_min_ess: 62
    wildbench_rank_changes_ge2: 0
    cross_benchmark_c_n_correlation: 0.45
  result_rationale: 'Under worst tier, WildBench results are even weaker than MT-Bench/Arena-Hard
    because WildBench items are newer and more diverse, reducing exposure (median
    c_n = 0.12, even lower than MT-Bench/Arena-Hard). Convergence is worse (R̂=1.15)
    due to WildBench''s different item structure (longer, more open-ended prompts
    increase response variance). No rank changes at all — G-MFRM identical to MFRM
    on this benchmark. The one positive finding: cross-benchmark c_n correlation of
    0.45 suggests c_n captures a model-level property (contamination susceptibility)
    rather than benchmark-specific noise, providing modest construct validity evidence.
    For worst-tier narrative, WildBench serves as additional evidence that "current
    contamination is manageable across benchmarks" rather than as a venue for demonstrating
    G-MFRM improvement.

    '
  tables:
  - name: 'Table A7: WildBench Results'
    description: 'Same format as Table 5 but for WildBench. Shows G-MFRM ≈ MFRM ≈
      UDA.

      '
  - name: 'Table A8: Cross-Benchmark c_n Correlation'
    description: 'Rows = models. Columns = c_n (MT-Bench), c_n (Arena-Hard), c_n (WildBench).
      Bottom row: pairwise Spearman correlations.

      '
  figures_description:
  - 'Fig A11: c_n scatter: MT-Bench/Arena-Hard c_n vs WildBench c_n. Moderate positive
    correlation (ρ=0.45) suggests c_n is partially a model-level trait.'
  analysis: 'WildBench replication reinforces worst-tier findings: weak contamination,
    no ranking improvement. The cross-benchmark c_n correlation (ρ=0.45) is the main
    positive finding — it provides construct validity evidence that c_n is measuring
    something real about models, not just fitting noise. This is valuable for the
    reframed narrative emphasizing G-MFRM as measurement infrastructure. However,
    ρ=0.45 is moderate at best. The convergence issues on WildBench (R̂=1.15) suggest
    the model may need benchmark-specific tuning, which weakens the "general framework"
    claim.

    '
- name: adversarial_robustness
  plan_id: exp-011
  description: 'Test G-MFRM robustness against adversarial contamination following
    Wang et al. (ICLR 2026).

    '
  expected_results:
    adversarial_c_n_detection_rate_strong: 0.78
    adversarial_c_n_detection_rate_subtle: 0.35
    adversarial_tau_gmfrm_corrected: 0.88
    adversarial_tau_uncorrected: 0.82
    adversarial_tau_sequential: 0.85
    adversarial_c_n_false_positive_rate: 0.14
    adversarial_rank_recovery_top5: 3/5
    adversarial_rank_recovery_top10: 6/10
    adversarial_breaks_gating_assumption: partial — adversarial contamination violates
      rank-1 c_n·e_i
  result_rationale: 'Under worst tier, adversarial robustness is mixed. For strong
    adversarial contamination (blatant memorization injection), G-MFRM detects 78%
    of affected models — reasonable but not robust. For subtle adversarial contamination
    (Wang et al.''s "soft leakage" patterns), detection drops to 35% because subtle
    contamination violates the rank-1 assumption: adversarial contamination is targeted
    and item-specific, not well-approximated by a single c_n per model. The 14% false
    positive rate (flagging clean models as contaminated) is concerning for an auditing
    tool. On the positive side, G-MFRM still partially corrects rankings under adversarial
    contamination (τ=0.88 vs 0.82 uncorrected), outperforming sequential (0.85). But
    this is in a SYNTHETIC adversarial setting — on real data where contamination
    is already weak, adversarial robustness is academic. For worst-tier narrative,
    this experiment is best placed in the appendix as "the framework has limitations
    under adversarial contamination, motivating future work on robust extensions."

    '
  tables:
  - name: 'Table A9: Adversarial Robustness Results'
    description: 'Rows = contamination type (none, strong adversarial, subtle adversarial).
      Columns = detection rate, τ (uncorrected/sequential/G-MFRM), false positive
      rate.

      '
  figures_description:
  - 'Fig A12: ROC curve for c_n-based contamination detection under adversarial injection.
    AUC=0.72 for strong, AUC=0.58 for subtle (near random).'
  analysis: 'Adversarial robustness under worst tier reveals a genuine limitation:
    the rank-1 assumption breaks under targeted adversarial contamination. This is
    acknowledged in Limitations with a pointer to rank-k extensions as future work.
    The experiment is important for honesty but should not be prominently featured.
    Under the reframed narrative (G-MFRM as monitoring infrastructure), the adversarial
    limitation is: "the current framework detects broad contamination patterns; targeted
    adversarial attacks require specialized detection methods beyond the scope of
    this work."'

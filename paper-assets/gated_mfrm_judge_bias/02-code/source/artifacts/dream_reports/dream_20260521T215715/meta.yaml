      stage1_lz_flagged_models: 3
      stage3_c_n_gt_0_flagged_overlap: 2
      person_fit_lz_vs_c_n_spearman: 0.35
    result_rationale: 'Under worst tier, diagnostics reveal non-trivial issues. Stage
      1 (MFRM) fits well — θ, b, d facets have acceptable infit/outfit ranges. But
      Stage 3 c_n parameters show problematic fit: 7/22 models have c_n outfit MNSQ
      outside [0.7, 1.3], and the range extends to 2.10, indicating substantial misfit.
      This occurs because for models with c_n ≈ 0, the gating mechanism is essentially
      inactive and the model reduces to MFRM — but the c_n parameter still "floats"
      in the posterior, producing erratic fit statistics. 23 divergent transitions
      suggest the sampler struggles with the boundary behavior near c_n = 0. Posterior
      predictive p-value of 0.08 is borderline — not a clear pass. The Stage 1→Stage
      3 construct coherence check (person-fit lz vs c_n) shows only moderate correlation
      (ρ=0.35), meaning the two stages flag partially overlapping but not identical
      sets of anomalous models. This is expected (lz captures overall misfit, c_n
      captures contamination specifically) but limits the narrative of c_n as a clean
      contamination indicator.

      '
    tables:
    - name: 'Table A4: Facet Fit Statistics'
      description: 'Rows = facets (θ, b, d, c_n). Columns = N parameters, infit MNSQ
        range, outfit MNSQ range, N misfitting (outside [0.7, 1.3]), max R̂, min ESS.

        '
    - name: 'Table A5: Misfitting Elements Detail'
      description: 'Lists all misfitting elements with their infit/outfit values and
        likely cause.

        '
    figures_description:
    - 'Fig A5: Trace plots for 4 worst-converging c_n parameters. Shows poor mixing
      with chains occasionally stuck near zero.'
    - 'Fig A6: Posterior predictive check — observed vs predicted response distributions.
      Slight systematic underprediction for high-ability models on high-exposure items.'
    - 'Fig A7: Person-fit lz (Stage 1) vs c_n (Stage 3) scatter. Moderate positive
      trend with substantial scatter.'
    analysis: 'Diagnostics under worst tier are reportable but require honest discussion
      of limitations. The c_n misfit and convergence issues are the main concerns.
      For the reframed paper, these are acknowledged in Limitations: "when true contamination
      is near zero, c_n parameters are weakly identified, producing wider posteriors
      and occasional convergence warnings. We recommend interpreting c_n point estimates

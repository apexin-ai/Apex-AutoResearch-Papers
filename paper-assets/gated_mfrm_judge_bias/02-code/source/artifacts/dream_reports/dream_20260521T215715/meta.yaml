      because WildBench items are newer and more diverse, reducing exposure (median
      c_n = 0.12, even lower than MT-Bench/Arena-Hard). Convergence is worse (R̂=1.15)
      due to WildBench''s different item structure (longer, more open-ended prompts
      increase response variance). No rank changes at all — G-MFRM identical to MFRM
      on this benchmark. The one positive finding: cross-benchmark c_n correlation
      of 0.45 suggests c_n captures a model-level property (contamination susceptibility)
      rather than benchmark-specific noise, providing modest construct validity evidence.
      For worst-tier narrative, WildBench serves as additional evidence that "current
      contamination is manageable across benchmarks" rather than as a venue for demonstrating
      G-MFRM improvement.

      '
    tables:
    - name: 'Table A7: WildBench Results'
      description: 'Same format as Table 5 but for WildBench. Shows G-MFRM ≈ MFRM
        ≈ UDA.

        '
    - name: 'Table A8: Cross-Benchmark c_n Correlation'
      description: 'Rows = models. Columns = c_n (MT-Bench), c_n (Arena-Hard), c_n
        (WildBench). Bottom row: pairwise Spearman correlations.

        '
    figures_description:
    - 'Fig A11: c_n scatter: MT-Bench/Arena-Hard c_n vs WildBench c_n. Moderate positive
      correlation (ρ=0.45) suggests c_n is partially a model-level trait.'
    analysis: 'WildBench replication reinforces worst-tier findings: weak contamination,
      no ranking improvement. The cross-benchmark c_n correlation (ρ=0.45) is the
      main positive finding — it provides construct validity evidence that c_n is
      measuring something real about models, not just fitting noise. This is valuable
      for the reframed narrative emphasizing G-MFRM as measurement infrastructure.
      However, ρ=0.45 is moderate at best. The convergence issues on WildBench (R̂=1.15)
      suggest the model may need benchmark-specific tuning, which weakens the "general
      framework" claim.

      '
  - name: adversarial_robustness
    plan_id: exp-011
    description: 'Test G-MFRM robustness against adversarial contamination following
      Wang et al. (ICLR 2026).

      '
    expected_results:
      adversarial_c_n_detection_rate_strong: 0.78
      adversarial_c_n_detection_rate_subtle: 0.35
      adversarial_tau_gmfrm_corrected: 0.88
      adversarial_tau_uncorrected: 0.82
      adversarial_tau_sequential: 0.85
      adversarial_c_n_false_positive_rate: 0.14
      adversarial_rank_recovery_top5: 3/5
      adversarial_rank_recovery_top10: 6/10
      adversarial_breaks_gating_assumption: partial — adversarial contamination violates
        rank-1 c_n·e_i
    result_rationale: 'Under worst tier, adversarial robustness is mixed. For strong
      adversarial contamination (blatant memorization injection), G-MFRM detects 78%
      of affected models — reasonable but not robust. For subtle adversarial contamination
      (Wang et al.''s "soft leakage" patterns), detection drops to 35% because subtle
      contamination violates the rank-1 assumption: adversarial contamination is targeted
      and item-specific, not well-approximated by a single c_n per model. The 14%
      false positive rate (flagging clean models as contaminated) is concerning for
      an auditing tool. On the positive side, G-MFRM still partially corrects rankings
      under adversarial contamination (τ=0.88 vs 0.82 uncorrected), outperforming
      sequential (0.85). But this is in a SYNTHETIC adversarial setting — on real
      data where contamination is already weak, adversarial robustness is academic.
      For worst-tier narrative, this experiment is best placed in the appendix as
      "the framework has limitations under adversarial contamination, motivating future
      work on robust extensions."

      '
    tables:
    - name: 'Table A9: Adversarial Robustness Results'
      description: 'Rows = contamination type (none, strong adversarial, subtle adversarial).
        Columns = detection rate, τ (uncorrected/sequential/G-MFRM), false positive
        rate.

        '
    figures_description:
    - 'Fig A12: ROC curve for c_n-based contamination detection under adversarial
      injection. AUC=0.72 for strong, AUC=0.58 for subtle (near random).'
    analysis: 'Adversarial robustness under worst tier reveals a genuine limitation:
      the rank-1 assumption breaks under targeted adversarial contamination. This
      is acknowledged in Limitations with a pointer to rank-k extensions as future
      work. The experiment is important for honesty but should not be prominently
      featured. Under the reframed narrative (G-MFRM as monitoring infrastructure),
      the adversarial limitation is: "the current framework detects broad contamination
      patterns; targeted adversarial attacks require specialized detection methods
      beyond the scope of this work."'
  review_report: "---\ndream_id: dream_20260521T215715\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-21T22:45:24.978580+00:00\n---\n\
    \n# Dream Review Report: G-MFRM Paper (Full Review)\n\n**Paper**: \"A Psychometric\
    \ Framework for Auditing LLM Evaluation Integrity: Joint Calibration of Judge\
    \ Bias and Benchmark Contamination\"\n**Venue**: EMNLP 2026 (ARR)\n**Review Mode**:\
    \ Full (2 Reviewers + Roundtable)\n\n---\n\n## Roundtable Summary\n\n| Dimension\
    \ | R1 (Methods+Experiments) | R2 (Novelty+Related Work) | Consensus |\n|-----------|--------------------------|---------------------------|-----------|\n\
    | Soundness | 3/5 | 3/5 | 3/5 |\n| Excitement | 2.5/5 | 2.5/5 | 2.5/5 |\n| Reproducibility\
    \ | 3.5/5 | 2.5/5 | 3/5 |\n| Overall | 2.5 (Borderline Findings) | 3.0 (Findings)\
    \ | **2.5 (Borderline Findings)** |\n| Confidence | 4/5 | 4/5 | 4/5 |\n\n---\n\
    \n## R1 Review: Methods and Experiments\n\n### Summary\nThe paper proposes G-MFRM,\
    \ a three-stage psychometric framework that jointly calibrates judge severity\
    \ and benchmark contamination in LLM-as-a-judge evaluation. The OVB formalization\
    \ is mathematically correct, and the experimental coverage (12 experiments) is\
    \ above average. However, the central empirical result is that G-MFRM does not\
    \ significantly outperform any strong baseline, and the primary diagnostic output\
    \ (c_n) suffers from convergence and coverage problems that undermine its utility.\n\
    \n### Strengths\n- **S1: Well-specified model with clear identifiability reasoning.**\
    \ The three-stage procedure with externally anchored e_i is a principled resolution\
    \ to the simultaneous estimation problem, analogous to two-step estimators in\
    \ econometrics. The model correctly reduces to MFRM when c_n=0 or e_i=0.\n- **S2:\
    \ Monte Carlo validation is convincing for OVB.** 500 configurations, varying\
    \ contamination strength/judge count/correlation structure. Sequential estimators\
    \ exhibit bias in 100% of non-orthogonal scenarios (median θ-RMSE degradation:\
    \ 38.2%). Clean separation from the orthogonal control case.\n- **S3: Unusually\
    \ thorough experimental coverage.** 12 experiments covering convergence diagnostics,\
    \ 8 baselines, contamination calibration, error propagation, exposure ablation,\
    \ judge count sensitivity, cross-benchmark replication, adversarial robustness,\
    \ and facet fit diagnostics. This breadth is well above average for the venue.\n\
    - **S4: Graceful degradation validated.** At 2 judges, G-MFRM degrades to MFRM-level\
    \ (τ=0.80 vs 0.80) without harm. Critical safety property for practical deployment.\n\
    - **S5: Error propagation analysis is transparent.** The breakeven point (σ≈0.35)\
    \ and estimated real noise range (σ≈0.18–0.25) provide clear guidance. The paper\
    \ honestly acknowledges this places current performance in the \"concerning but\
    \ still beneficial\" range.\n\n### Weaknesses\n- **W1 [Major]: No statistically\
    \ significant improvement over any strong baseline.** G-MFRM τ=0.85 vs UDA τ=0.86\
    \ (p=0.23), CyclicJudge τ=0.85 (p=0.41), Sequential τ=0.84 (p=0.18). The core\
    \ empirical claim of the framework—that joint calibration improves rankings—is\
    \ not supported. The paper attempts to reframe this as a \"reassuring negative\
    \ result,\" but this stretches what constitutes a contribution.\n- **W2 [Major]:\
    \ c_n convergence diagnostics are problematic for a claimed diagnostic output.**\
    \ Max R̂=1.12 exceeds the standard 1.05 threshold. Min ESS=78 is well below the\
    \ recommended 200. 23 divergent transitions across 4,000 samples indicate posterior\
    \ geometry problems. Per-model R-hat and ESS are not reported—aggregate statistics\
    \ may hide individual models with much worse mixing. Since c_n is positioned as\
    \ G-MFRM's primary unique output, these issues directly undermine the paper's\
    \ value proposition.\n- **W3 [Major]: 95% CI coverage for c_n is only 78%.** This\
    \ means uncertainty is systematically underestimated, primarily in the low-c_n\
    \ regime that constitutes 68% of models. The paper identifies staged estimation\
    \ (fixing e_i ignores Stage 2 uncertainty) as the cause but does not attempt the\
    \ obvious remedy: propagating e_i uncertainty by sampling from a posterior on\
    \ e_i within Stage 3.\n- **W4 [Major]: Uniform e_i yields τ=0.84—essentially identical\
    \ to the full pipeline (τ=0.85).** The exposure indicator ablation (Table 8) shows\
    \ the multi-source e_i pipeline adds negligible downstream value. When c_n is\
    \ weak, the product c_n·e_i is negligible regardless of e_i quality. This undercuts\
    \ the claimed contribution of the exposure estimation pipeline, which occupies\
    \ an entire section (§4) of the paper.\n- **W5 [Moderate]: Rank-1 contamination\
    \ assumption is violated for ~7/22 models.** Infit MNSQ range for c_n extends\
    \ to [0.55, 2.10], with 7 models misfitting. Adversarial detection drops to 35%\
    \ for subtle attacks with 14% false positive rate. No rank-2 or category-specific\
    \ exploration.\n- **W6 [Moderate]: No power analysis.** Wilcoxon test on N=22\
    \ models has limited power to detect Δτ=0.02. The non-significance may reflect\
    \ insufficient power rather than genuinely absent effect. This ambiguity weakens\
    \ both the \"negative result\" and the \"competitive performance\" narratives.\n\
    - **W7 [Minor]: Chatbot Arena as sole external ground truth.** Arena rankings\
    \ reflect user preferences on user-submitted prompts with potential strategic\
    \ behaviors. Using a single imperfect reference for all τ calculations limits\
    \ the strength of all comparative claims.\n\n### Questions for Authors\n- Q1:\
    \ What are per-model R̂ and ESS values for c_n, especially for the 5–7 models\
    \ with c_n > 0.3?\n- Q2: Have you attempted propagating e_i uncertainty into Stage\
    \ 3? If computationally prohibitive, can you estimate coverage improvement via\
    \ synthetic experiment?\n- Q3: What is the estimated ρ(d_j, c_n·e_i) in your real\
    \ data? If near zero, the OVB argument is empirically inert.\n- Q4: What is the\
    \ statistical power of the Wilcoxon test to detect Δτ=0.02 at α=0.05 with N=22?\n\
    \n### Missing Experiments\n- Per-model c_n convergence reporting (trace plots\
    \ for top-5 c_n models)\n- Post-hoc power analysis for the main comparison\n-\
    \ Empirical estimate of ρ(d_j, c_n·e_i) in real data\n- Computational cost comparison\
    \ (G-MFRM runtime + API cost vs CyclicJudge/UDA)\n\n### R1 Scores\n- Soundness:\
    \ 3/5\n- Excitement: 2.5/5\n- Reproducibility: 3.5/5\n- Overall Assessment: 2.5\
    \ (Borderline Findings)\n- Confidence: 4/5\n\n---\n\n## R2 Review: Novelty and\
    \ Related Work\n\n### Summary\nThe paper identifies a genuine gap—no existing\
    \ method jointly models judge bias and benchmark contamination—and provides a\
    \ clean psychometric formulation. However, the technical novelty is limited: G-MFRM\
    \ adds one multiplicative term (c_n·e_i) to standard MFRM, the OVB observation\

  - name: confounding_formal_observation
    plan_id: exp-009
    description: 'Formal OVB bias derivation + Monte Carlo validation + synthetic
      c_n recovery validation.

      '
    expected_results:
      bias_direction_confirmed: true
      bias_magnitude_proportional_to_cov_d_ce: true
      monte_carlo_scenarios: 500
      bias_observed_in_pct_scenarios: 100
      theta_rmse_degradation_sequential_median_pct: 38.2
      theta_rmse_degradation_sequential_range_pct:
      - 15.4
      - 68.7
      c_n_recovery_rmse_gmfrm: 0.42
      c_n_recovery_rmse_naive: 0.85
      c_n_95ci_coverage_probability: 0.78
      c_n_recovery_rmse_by_magnitude:
        low_cn_lt_0_3: 0.55
        mid_cn_0_3_to_0_8: 0.35
        high_cn_gt_0_8: 0.28
      kendall_tau_improvement_joint_vs_seq_synthetic: +6.3pp (median across scenarios)
    result_rationale: 'The formal observation and Monte Carlo validation succeed under
      worst tier because they are mathematical/synthetic — they do not depend on real
      contamination magnitude. The OVB bias derivation is a mathematical fact that
      holds regardless. Monte Carlo across 500 parameter configurations confirms sequential
      estimators are biased in 100% of scenarios where d_j and c_n·e_i are non-orthogonal
      (which is the generic case). However, the c_n point-estimate recovery validation
      shows concerning results under worst tier: overall RMSE of 0.42 (within the
      worst-tier range of 0.3-0.5), and 95% CI coverage at only 78% (below nominal
      95%). Recovery is worst for low c_n (RMSE=0.55) — exactly the regime matching
      real data. The model struggles to distinguish c_n=0.05 from c_n=0.20, both being
      "near zero." Recovery is better for high c_n (RMSE=0.28), confirming the method
      works when contamination is strong but struggles when it''s weak. This is consistent
      with the information-theoretic argument: weak signal → poor recovery. For the
      paper, this becomes both a strength (method works when needed) and an acknowledged
      limitation (point estimates unreliable for low-contamination models).

      '
    tables:
    - name: 'Table 1: Sequential Estimator Bias — Monte Carlo Validation'
      description: 'Rows = parameter configurations (grouped by contamination strength).
        Columns = θ-RMSE (joint), θ-RMSE (sequential), degradation %, bias direction
        matches theory (Y/N). Shows bias exists across all configurations.

        '
    - name: 'Table A6: c_n Recovery Accuracy by Contamination Magnitude'
      description: 'Rows = c_n magnitude bins (low/mid/high). Columns = RMSE, MAE,
        95% CI coverage, bias. Shows recovery degrades for low c_n.

        '
    figures_description:
    - 'Fig 1: Left panel: sequential pipeline schematic with OVB confounding arrows
      annotated. Right panel: G-MFRM joint pipeline with all facets connected. Center:
      formal bias expression with annotated terms.'
    - 'Fig A8: Monte Carlo θ-RMSE distribution: joint (blue) vs sequential (red).
      Blue distribution shifted left (lower RMSE) across all scenarios. Gap widens
      with increasing contamination strength.'
    - 'Fig A9: c_n recovery scatter (fitted vs true). Good calibration for c_n > 0.5,
      systematic overestimation for c_n near 0 (posterior pulled toward prior mass).'
    analysis: 'exp-009 is the strongest experiment under worst tier because it establishes
      mathematical ground truth independent of real data. The OVB observation is unassailable.
      The synthetic results show the method works in principle. The c_n recovery limitation
      at low contamination is honest and actually strengthens the paper — it explains
      WHY real-data results are weak (the signal is genuinely small) rather than blaming
      methodology failure. This experiment anchors the reframed narrative: "we prove
      confounding exists, we prove our method resolves it when contamination is strong,
      and we show current contamination is fortunately weak."

      '
  - name: error_propagation_sensitivity
    plan_id: exp-012
    description: 'Inject noise into e_i at σ=0.1, 0.2, 0.5. Measure θ̂ RMSE degradation
      and c_n recovery. Synthetic data with known ground truth.

      '
    expected_results:
      theta_rmse_sigma_0_0: 0.124
      theta_rmse_sigma_0_1: 0.131
      theta_rmse_sigma_0_2: 0.156
      theta_rmse_sigma_0_5: 0.238
      theta_rmse_degradation_sigma_0_1_pct: 5.6
      theta_rmse_degradation_sigma_0_2_pct: 25.8
      theta_rmse_degradation_sigma_0_5_pct: 91.9
      c_n_recovery_rmse_sigma_0_0: 0.28
      c_n_recovery_rmse_sigma_0_1: 0.33
      c_n_recovery_rmse_sigma_0_2: 0.45
      c_n_recovery_rmse_sigma_0_5: 0.72
      tau_sigma_0_0: 0.922
      tau_sigma_0_1: 0.915
      tau_sigma_0_2: 0.896
      tau_sigma_0_5: 0.861
      breakpoint_sigma_for_seq_equivalence: 0.35
    result_rationale: 'Under worst tier, error propagation is concerning. At σ=0.2
      (a plausible noise level given the performance-gap method''s ρ=0.41 with LogProber),
      θ̂ RMSE degrades by 25.8% — exceeding the 15% threshold flagged as concerning.
      This occurs because noisy e_i causes the gating mechanism to misallocate contamination
      corrections: items with overestimated e_i receive excessive correction, items
      with underestimated e_i receive insufficient correction, and these errors compound
      through the c_n estimation. At σ=0.5, degradation is severe (91.9%) and G-MFRM
      becomes worse than sequential (breakpoint at σ≈0.35). This is the most damaging
      result for the staged estimation defense: real e_i noise is plausibly σ≈0.18-0.25
      based on exp-002 residuals, placing us in the "concerning" range. The c_n recovery
      RMSE at σ=0.2 is 0.45, meaning individual c_n estimates have large errors. For
      the paper, this MUST be discussed in Limitations. The defense: (1) σ=0.2 degradation
      (25.8%) is still better than ignoring contamination entirely when contamination
      is moderate-to-strong; (2) the multi- source e_i pipeline aims to keep σ below
      0.15; (3) sensitivity analysis itself demonstrates methodological rigor and
      transparency.

      '
    tables:
    - name: 'Table 12: Error Propagation Sensitivity Analysis'
      description: 'Rows = noise levels (σ = 0, 0.1, 0.2, 0.3, 0.5). Columns = θ̂
        RMSE, degradation %, c_n RMSE, τ, comparison with sequential τ. Highlights
        σ=0.35 breakpoint where G-MFRM = sequential.

        '
    figures_description:
    - 'Fig 10: Line plot of θ̂ RMSE vs e_i noise σ. G-MFRM curve (blue) rises steeply;
      sequential baseline (red dashed) is flat. Intersection at σ≈0.35 annotated.
      Green shaded region shows estimated real noise range (σ=0.15-0.25).'
    - 'Fig A10: c_n recovery scatter at σ=0, 0.2, 0.5 (three panels). Progressive
      deterioration visible. At σ=0.5, fitted c_n bears little resemblance to truth.'
    analysis: 'This experiment honestly quantifies the Achilles heel of staged estimation.
      The 25.8% degradation at σ=0.2 is above the comfort threshold but not catastrophic.
      The breakpoint at σ=0.35 provides a concrete "safety margin" — if e_i estimation
      can be kept below this noise level, G-MFRM still helps. The estimated real noise
      (σ≈0.18-0.25) straddles the concerning zone. For worst-tier narrative, this
      experiment is reported with full transparency as evidence of methodological
      rigor. The defense of staged estimation becomes: "conditional on e_i quality,
      G-MFRM outperforms sequential; improving e_i estimation (e.g., via broader LogProber
      access) directly translates to better contamination correction."

      '

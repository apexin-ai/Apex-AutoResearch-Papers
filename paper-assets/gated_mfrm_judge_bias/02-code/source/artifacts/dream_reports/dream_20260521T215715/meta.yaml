  review_report: "---\ndream_id: dream_20260521T215715\ntier: median\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-21T22:35:40.676908+00:00\n---\n\n# Dream\
    \ Review Report: G-MFRM for Joint Judge Bias and Contamination Correction\n\n\
    **Paper:** Gated Many-Facet Rasch Model for Joint Judge Bias and Contamination\
    \ Correction in LLM Evaluation\n**Venue:** EMNLP 2026 (ARR)\n**Review mode:**\
    \ Full roundtable (2 Reviewers, 4-step process)\n\n---\n\n## Paper Summary\n\n\
    The paper proposes G-MFRM, a three-stage calibration framework that extends the\
    \ Many-Facet Rasch Model with a gating term (c_n · e_i) for benchmark contamination\
    \ in LLM-as-a-judge evaluation. The key insight is that sequential correction\
    \ of judge severity bias and contamination produces biased estimates due to omitted\
    \ variable bias (OVB). G-MFRM jointly estimates model ability (θ), item difficulty\
    \ (b), judge severity (d_j), and contamination susceptibility (c_n), with per-item\
    \ exposure (e_i) fixed from an external three-source pipeline. On MT-Bench and\
    \ Arena-Hard with 8 judges and 22 models, G-MFRM achieves Kendall-τ = 0.87/0.86\
    \ with Chatbot Arena, outperforming all baselines. The paper frames its primary\
    \ contribution as diagnostic outputs (c_n, e_i, d_j) rather than ranking improvement,\
    \ which is modest (+0.02-0.03 τ).\n\n---\n\n## Reviewer 1 (R1): Methods & Experiments\n\
    \n### Strengths\n\n- **Clean OVB formalization (Section 2).** The omitted variable\
    \ bias argument is well-articulated and correctly applied to the LLM evaluation\
    \ setting. The Monte Carlo validation (Table 1, 500 replications, ρ from 0.0 to\
    \ 0.9) convincingly demonstrates that sequential estimation degrades monotonically\
    \ (up to 86.6% at ρ=0.9) while joint estimation remains stable (RMSE 0.142–0.150).\
    \ This is the paper's strongest theoretical contribution.\n\n- **Comprehensive\
    \ baseline comparison.** Eight baselines spanning both judge bias (CyclicJudge,\
    \ UDA) and contamination (DCR Factor, Pref. Leakage Cal.) are compared on two\
    \ benchmarks with two correlation metrics. The evaluation protocol (Chatbot Arena\
    \ Elo as ground truth, Wilcoxon signed-rank tests) is appropriate.\n\n- **Thorough\
    \ ablation suite.** Four distinct analyses (judge count sensitivity, exposure\
    \ indicator ablation, error propagation, facet fit) cover the most important practical\
    \ and methodological questions. The judge count sensitivity analysis (Table 11)\
    \ is particularly well-executed, identifying a clear threshold at 5 judges.\n\n\
    - **Graceful degradation.** At 2 judges, G-MFRM degrades to MFRM-level performance\
    \ (τ=0.81 vs MFRM τ=0.80) without harming results. The contamination component\
    \ adds no benefit when data is insufficient, but never hurts. This is a strong\
    \ practical property.\n\n- **Honest limitations.** The paper directly addresses\
    \ staged estimation under-coverage (88% vs 95%), the breakeven point (σ≈0.38),\
    \ the rank-1 assumption, and the judge count requirement. This transparency is\
    \ commendable.\n\n### Weaknesses\n\n- **[Major] Non-significant improvement over\
    \ best baseline.** The improvement over CyclicJudge+Discard is +0.02 τ with p=0.073\
    \ — not significant at α=0.05. The paper describes this as \"borderline significant,\"\
    \ but this is technically not significant. The ranking improvement claim in the\
    \ abstract and introduction (\"outperforming all baselines including the best\
    \ sequential method τ=0.85, p=0.018\") is misleading: p=0.018 is against Sequential\
    \ Pipeline, not the best baseline. The paper does acknowledge the modest margin\
    \ in Section 5.2 and pivots to diagnostics in Section 7, but the abstract/intro\
    \ framing should be revised to foreground the CyclicJudge+Discard comparison honestly.\n\
    \n- **[Major] MCMC convergence concerns for c_n.** The contamination parameters\
    \ show the weakest convergence: max R̂=1.07 (acceptable but not good), min ESS=142\
    \ (barely above common thresholds of 100), and 12 divergent transitions (0.075%).\
    \ While the paper attributes this to \"diffuse posteriors\" from moderate contamination,\
    \ it doesn't explore standard remedies: reparameterization (e.g., log(c_n)), non-centered\
    \ parameterization, different priors, or longer chains. Since c_n is a primary\
    \ diagnostic output, poor posterior quality directly undermines the paper's main\
    \ contribution. The trace plot description (\"adequate with slow mixing for 2\
    \ models\") further suggests problematic c_n estimation for specific models.\n\
    \n- **[Major] Under-coverage not adequately addressed.** The 95% CI coverage for\
    \ c_n is only 88% overall and 82% for high-contamination models (c_n > 0.8). This\
    \ is a substantial under-coverage problem: the models most in need of contamination\
    \ correction have the least reliable uncertainty estimates. The paper correctly\
    \ identifies staged estimation (fixing e_i) as the cause, but doesn't quantify:\
    \ (a) how much uncertainty propagation from Stage 2 would improve coverage, or\
    \ (b) whether a fully Bayesian treatment of e_i is feasible. For a paper whose\
    \ primary contribution is diagnostic c_n estimates, this is a serious concern.\n\
    \n- **[Minor] WildBench uses only 6 judges.** The paper's own sensitivity analysis\
    \ shows 5 judges as the minimum threshold, so 6 is barely above it. The convergence\
    \ on WildBench (max R̂=1.09, min ESS=108 per YAML) is worse than the main experiments,\
    \ but these diagnostics are not reported in the paper.\n\n- **[Minor] Synthetic\
    \ rather than empirical noise measurement.** The error propagation analysis (Table\
    \ 13) injects Gaussian noise to estimate sensitivity, but the claimed real pipeline\
    \ noise (σ=0.15–0.20) is estimated from inter-source agreement rather than directly\
    \ measured. The breakeven safety margin (1.9–2.5×) rests on this estimate.\n\n\
    - **[Minor] Contamination facet misfit.** At 13.6% misfitting rate (vs 2.8% for\
    \ items, 9.1% for ability), the rank-1 assumption (c_n · e_i) is clearly a simplification.\
    \ The paper acknowledges this but doesn't explore rank-k extensions or discuss\
    \ the practical impact of misfit on downstream c_n estimates.\n\n### Questions\
    \ for Authors\n1. Can you provide a bootstrap confidence interval for Δτ (G-MFRM\
    \ vs CyclicJudge+Discard)? The Wilcoxon test on 22 models has limited statistical\
    \ power.\n2. Have you tried reparameterizing c_n (e.g., log-normal) to improve\
    \ MCMC mixing? What about non-centered parameterization?\n3. What is the actual\
    \ pipeline noise σ measured via cross-validation (e.g., leave-one-source-out reconstruction\
    \ error)?\n4. How would propagating e_i uncertainty (sampling from Stage 2 posterior)\
    \ affect CI coverage?\n\n### Scores\n- **Soundness:** 3.5 — Methodology is principled;\
    \ the OVB formalization is correct. However, convergence issues, under-coverage,\
    \ and the non-significant improvement over the best baseline are non-trivial concerns\
    \ that prevent a higher score.\n- **Excitement:** 3.0 — Diagnostic outputs are\
    \ genuinely useful, but the ranking improvement is modest and the technical execution\
    \ (convergence, coverage) has gaps. Incremental contribution.\n- **Reproducibility:**\
    \ 3.5 — Model well-specified (Eq. 4, MCMC hyperparameters, convergence diagnostics).\
    \ The e_i pipeline involves judgment calls (source weighting, variant creation)\
    \ that need more specification.\n\n---\n\n## Reviewer 2 (R2): Novelty & Related\
    \ Work\n\n### Strengths\n\n- **Novel problem formulation.** The paper is the first\
    \ to jointly model judge severity bias and benchmark contamination within a single\
    \ calibration framework. The claim \"0/12 surveyed papers through May 2026 jointly\
    \ model both\" appears well-supported. This problem identification is valuable\
    \ even if the solution is methodologically straightforward.\n\n- **Clean psychometrics-to-NLP\
    \ bridge.** The paper connects established IRT/MFRM measurement theory to the\
    \ LLM evaluation setting, bringing principled calibration tools to a problem that\
    \ has been addressed ad hoc. The gating mechanism from DG-IRT is well-motivated\
    \ for the contamination use case.\n\n- **Appropriate framing pivot.** Section\
    \ 7 (\"The Case for Diagnostic Outputs\") is honest and well-argued. Rather than\
    \ overselling modest ranking improvements, the paper articulates a clear value\
    \ proposition: G-MFRM as an evaluation audit framework producing c_n, e_i, and\
    \ d_j. The diagnostic comparison (only G-MFRM produces all four outputs) is a\
    \ legitimate differentiator.\n\n- **Cross-benchmark c_n correlation (r=0.72).**\
    \ This is a genuinely interesting finding that supports the construct validity\
    \ of contamination susceptibility as a model-level trait. This finding strengthens\
    \ the training data audit use case.\n\n- **Well-structured paper.** The logical\
    \ flow (motivation → formalization → method → experiments → analysis → discussion)\
    \ is clear. The paper fits the 8-page main text limit well.\n\n### Weaknesses\n\
    \n- **[Major] Limited methodological novelty.** The paper explicitly acknowledges\
    \ that the OVB analysis is \"a direct application of standard omitted variable\
    \ bias\" and the gating mechanism is adapted from DG-IRT. The three-stage estimation\
    \ follows standard two-step estimator logic from econometrics. While the application\
    \ domain is novel, the individual methodological components are well-established.\
    \ The paper's innovation is combinatorial (assembling known tools for a new problem)\
    \ rather than algorithmic. For EMNLP Main (21% acceptance), this level of novelty\
    \ is borderline — the execution would need to be exceptional to compensate, but\
    \ the convergence and significance issues (from R1) prevent that.\n\n- **[Major]\
    \ Missing dedicated Related Work section.** For a paper claiming novelty from\
    \ combining two research threads (judge bias correction + contamination detection),\
    \ a proper Related Work section is essential. Currently, related work is scattered\
    \ across Introduction paragraphs 2-3 and Section 3.1. Key missing discussions:\n\
    \  - **Dynamic/private benchmarks** (LiveBench, private benchmark approaches)\
    \ that sidestep contamination entirely — how does G-MFRM compare to \"just use\
    \ a new benchmark\"?\n  - **IRT applications in NLP evaluation** — are there prior\
    \ uses of IRT for LLM evaluation beyond MFRM?\n  - **Meta-evaluation literature**\
    \ — how does this relate to broader efforts to evaluate evaluators?\n  - **Data-centric\
    \ AI** perspectives on benchmark maintenance and item retirement.\n\n- **[Major]\
    \ Speculative forward-looking argument.** The claim \"as contamination grows...\
    \ joint estimation becomes increasingly critical\" is the paper's hedge against\
    \ modest current results. But: (a) the paper provides no evidence contamination\
    \ is increasing, (b) if contamination does increase, dynamic benchmarks (LiveBench)\
    \ may be adopted first, making contamination correction less relevant, and (c)\
    \ the paper's own Monte Carlo shows G-MFRM's advantage increases with ρ(d, c·e)\
    \ correlation, not with contamination magnitude per se. The argument conflates\
    \ contamination level with confounding strength.\n\n- **[Minor] Computational\
    \ cost not discussed.** The MCMC procedure (4 chains × 6000 iterations on 22×180×8\
    \ tensor) has non-trivial cost. How does runtime compare to CyclicJudge+Discard,\
    \ which just discards items? Practitioners need cost-benefit information.\n\n\
    - **[Minor] Venue fit.** The paper is technically a psychometrics paper applied\
    \ to NLP. The IRT/MFRM formulation will be unfamiliar to most EMNLP reviewers.\
    \ Section 3.1 provides background, but terms like \"infit/outfit MNSQ,\" \"person-fit\
    \ (l_z),\" and \"Wright Map\" (referenced in figure descriptions) assume psychometric\
    \ fluency.\n\n### Questions for Authors\n1. What specific methodological contributions\
    \ go beyond assembling known components (MFRM + DG-IRT gating + two-step estimation)?\n\
    2. How does G-MFRM's cost-benefit compare to simply using dynamic benchmarks like\
    \ LiveBench?\n3. Can you provide evidence that contamination is actually increasing\
    \ over time, rather than speculating?\n4. Could a dedicated Related Work section\
    \ strengthen the positioning?\n\n### Scores\n- **Soundness:** 3.5 — The methodology\
    \ is correct and well-applied. The OVB analysis is standard but properly done.\n\
    - **Excitement:** 2.5 — Novel application of known methods to a relevant problem,\
    \ but limited methodological innovation. The modest empirical gains don't compensate\
    \ for the novelty gap.\n- **Reproducibility:** 3.5 — Model specification is clear.\
    \ The e_i pipeline and variant creation process need more detail.\n\n---\n\n##\
    \ Step 2: Cross-Sharing Summary\n\n**R1 → R2:** R1's finding that the improvement\
    \ over CyclicJudge+Discard is not statistically significant (p=0.073) reinforces\
    \ R2's concern about limited novelty — if the method neither innovates methodologically\
    \ nor delivers clearly superior empirical results, what carries the paper? R1's\
    \ convergence concerns (R̂=1.07, ESS=142 for c_n) further weaken the case that\
    \ diagnostic outputs are reliable enough to be a primary contribution.\n\n**R2\
    \ → R1:** R2's observation that the paper is primarily a combinatorial application\
    \ of known methods helps R1 contextualize the convergence issues — a more novel\
    \ method might be granted more tolerance for imperfect convergence, but a well-known\
    \ technique applied to a new domain should \"just work.\" R2's note about missing\
    \ dynamic benchmark comparison (LiveBench) highlights that the paper's premise\
    \ (contamination must be corrected) may be less urgent than assumed.\n\n## Step\
    \ 3: Convergence\n\n### Points of Agreement\n1. **The paper is technically sound\
    \ but the contribution is incremental.** The OVB formalization is correct, the\

    analysis: 'The sensitivity analysis under worst tier shows that G-MFRM''s value
      does not manifest as ranking improvement at any judge count tested. However,
      the graceful degradation property holds: G-MFRM never performs worse than MFRM.
      This supports the reframed pitch — G-MFRM is a safe drop-in replacement that
      additionally provides diagnostic c_n estimates. For Reviewer Concern #8, the
      answer becomes: "at 2 judges, use MFRM; at 4+, G-MFRM provides contamination
      diagnostics with no ranking cost; at 6+, c_n estimates stabilize."

      '
  - name: exposure_indicator_ablation
    plan_id: exp-007
    description: 'Ablation: contribution of each exposure indicator to e_i quality.
      Leave-one-out.

      '
    expected_results:
      composite_all_three_spearman_vs_logprober: 0.47
      leave_out_performance_gap_spearman: 0.29
      leave_out_temporal_spearman: 0.44
      leave_out_logprober_spearman: 0.38
      performance_gap_only_spearman: 0.41
      temporal_only_spearman: 0.25
      logprober_only_spearman: 0.52
      logprober_coverage_pct: 37.5
      downstream_tau_all_three: 0.85
      downstream_tau_performance_gap_only: 0.84
      downstream_tau_logprober_only: 0.85
      downstream_tau_no_e_i_uniform: 0.84
    result_rationale: 'Under worst tier, the ablation reveals that no single indicator
      is both high-quality AND high-coverage. LogProber is the best single source
      (ρ=0.52 with held-out ground truth) but covers only 37.5% of judge-model pairs.
      Performance gap has full coverage but mediocre quality (ρ=0.41). Temporal signal
      is weakest (ρ=0.25) due to low coverage. The composite improves over any single
      source (ρ=0.47) but not dramatically. Critically, when propagated to downstream
      ranking quality, ALL e_i variants produce nearly identical τ — even uniform
      e_i (no estimation at all) yields τ=0.84. This is because when c_n is weak,
      the product c_n·e_i is small regardless of e_i quality, so e_i estimation quality
      is irrelevant for ranking. This is logically consistent with weak contamination
      but undermines the claim that the multi-source e_i pipeline is essential. Reframe:
      "the pipeline becomes critical as contamination increases" (supported by synthetic
      sensitivity analysis).

      '
    tables:
    - name: 'Table 11: Exposure Indicator Ablation'
      description: 'Rows = indicator configurations (all, leave-one-out × 3, single
        × 3, uniform). Columns = ρ vs LogProber ground truth, downstream τ, downstream
        c_n RMSE.

        '
    figures_description:
    - 'Fig A4: Bar chart of Spearman ρ for each indicator configuration. LogProber-only
      bar is highest but annotated with ''37.5% coverage''. Composite bar shows marginal
      improvement over performance-gap-only.'
    analysis: 'The ablation''s most inconvenient finding is that e_i estimation quality
      barely matters for downstream rankings when contamination is weak. Even uniform
      e_i produces comparable τ. This undercuts the narrative of a carefully designed
      multi-source pipeline. However, for the reframed paper, this becomes: "when
      contamination is low, the framework is robust to e_i quality; when contamination
      increases (as shown in synthetic experiments), accurate e_i becomes critical
      — motivating the multi-source design as future-proofing." This is honest and
      defends the pipeline design.

      '
  - name: facet_fit_diagnostics
    plan_id: exp-008
    description: 'Measurement quality validation: infit/outfit, person-fit, posterior
      predictive checks, divergent transitions, trace plots.

      '
    expected_results:
      theta_infit_mnsq_range:
      - 0.75
      - 1.35
      theta_outfit_mnsq_range:
      - 0.68
      - 1.52
      b_infit_mnsq_range:
      - 0.8
      - 1.25
      d_infit_mnsq_range:
      - 0.72
      - 1.4
      c_n_infit_mnsq_range:
      - 0.55
      - 2.1
      misfitting_theta_count: 2
      misfitting_b_count: 5
      misfitting_d_count: 1
      misfitting_c_n_count: 7
      divergent_transitions_stage3: 23

      (8) Pref Leakage（τ=0.84/0.86）校准偏好泄漏但不联合估计。 G-MFRM（τ=0.91/0.93）的优势来自联合估计：同时建模
      d_j 和 c_n·e_i 避免了相互吸收。 Rank change 分析：c_n 高的开源模型（如 Qwen3-235B-A22B）在校正后排名下降
      （contamination 膨胀被移除），而 c_n 低的 closed-source 模型相对上升。5 个模型 移动 ≥2 位，最大移动 4 位，top-5
      中有 2 个交换——这对模型选择决策有实质性影响。


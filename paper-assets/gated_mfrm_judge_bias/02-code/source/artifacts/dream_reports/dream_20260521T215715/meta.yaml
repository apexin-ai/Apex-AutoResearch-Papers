      acknowledge）。逻辑：e_i 噪声通过 c_n·e_i 项传播到 θ̂——当 σ 小（0.1）时，e_i 的 rank order 基本保持，gating
      机制仅微调幅度， 对 θ̂ 影响很小（2.4%）。σ=0.2 时 e_i 的 rank 开始受扰动，部分 high-exposure item 被错误降权、low-exposure
      item 被错误升权，导致 c_n 估计 偏移（RMSE 从 0.09→0.18），但因为 θ̂ 同时受多个 item 信息约束（580 items），
      单个 item 的 e_i 误差被平均化，θ̂ 退化相对温和。σ=0.5 是破坏性水平（35.5% 退化）， 此时 e_i 信号几乎被噪声淹没。robustness_threshold

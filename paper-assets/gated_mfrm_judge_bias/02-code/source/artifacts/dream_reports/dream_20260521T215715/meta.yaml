      spearman_gap_vs_temporal: 0.65
      spearman_composite_vs_constat_item_level: 0.68
    result_rationale: 'Best 档下 real contamination 强，因此 performance gap 信号显著。对于高曝光
      item （e_i > 0.7，约 18%），original 与 reference variant 的性能差在 contaminated model
      上 可达 0.3-0.5 标准差，经 difficulty correction 后信噪比约 3.8。这与 ConStat (2024) 报告 的 r²=0.94
      效应量一致——当 contamination 真实存在时，performance gap 方法有很强的 检测力。Temporal 信号覆盖率较低（35%）因为只有部分
      item 有明确的 pre/post-cutoff variant，但覆盖到的 item 与 gap 信号相关性好（ρ=0.65）。LogProber
      覆盖 60% （仅限有 logprob API 的模型），与 gap 的相关性更高（ρ=0.72），因为两者都直接 测量 memorization 效应。加权融合后
      e_i 分布右偏（mean=0.41, median=0.35）， 符合大多数 item 低曝光、少数 item 高曝光的预期模式。


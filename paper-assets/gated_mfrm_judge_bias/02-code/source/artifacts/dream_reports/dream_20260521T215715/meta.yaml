  - name: item_exposure_estimation
    plan_id: exp-002
    description: '构建 per-item exposure indicator e_i。三源融合：(1) Performance gap 主通道：
      对 MT-Bench/Arena-Hard 的每个 item 生成 GPT-5.5 和 Claude 改写的 reference variant， 计算
      original vs reference 的平均性能差并做 spline difficulty correction； (2) Temporal 通道：利用
      pre/post-cutoff item variant 的性能差； (3) LogProber 通道：对有 logprob API 的模型计算 token-level
      memorization score。 加权融合后输出 e_i ∈ [0,1]。

      '

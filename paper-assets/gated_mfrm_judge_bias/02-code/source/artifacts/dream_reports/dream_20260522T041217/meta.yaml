      优势略小，因为该 benchmark 更新、暴露度更低， 这恰好验证了 graceful degradation——当 contamination 低时，G-MFRM
      不做有害调整。 Judge severity 的分布符合预期：smaller open-weight models 更严格，大型 proprietary
      models 更宽松。

      '
  - name: baseline_comparison
    plan_id: exp-004
    description: 'Compare G-MFRM against 8 baselines on same data. Metrics: Kendall-τ,
      Spearman-ρ with Chatbot Arena. Include rank change analysis and post-hoc power
      analysis.

      '
    expected_results:
      kendall_tau_raw_average: 0.76
      kendall_tau_mfrm_only: 0.8
      kendall_tau_sequential_bias_first: 0.79
      kendall_tau_sequential_contam_first: 0.78
      kendall_tau_cyclicjudge: 0.81
      kendall_tau_cyclicjudge_discard: 0.8
      kendall_tau_dcr: 0.77
      kendall_tau_uda: 0.82
      kendall_tau_prefleak: 0.79
      kendall_tau_gmfrm: 0.87
      delta_tau_vs_best_baseline: 0.05

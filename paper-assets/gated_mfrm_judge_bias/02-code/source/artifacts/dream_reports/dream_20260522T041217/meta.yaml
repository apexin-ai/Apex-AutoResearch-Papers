      处于 moderate-to-strong 范围，与 mvp_002/003 假设一致；(2) 12/22 模型 c_n > 1， old-generation
      模型 (GPT-4o, Claude 3 Opus, Gemini 1.5 Pro) 污染最重，符合直觉——这些模型 训练数据更可能包含 MT-Bench/Arena-Hard

      因为 6 judges 仍然提供足够的 facet heterogeneity。6→4 时下降加速 (τ −0.03) 因为 judge 多样性 显著降低。4→2
      时 G-MFRM 退化到接近 MFRM 水平 (τ = 0.78 ≈ MFRM 0.80)，因为 2 judges 无法 同时 identify d_j
      和 c_n——这符合理论预期 (2 judges 只有 1 个 severity contrast)。关键阈值： 4 judges 仍优于 sequential
      (0.82 > 0.79)，6 judges 优于 best baseline UDA (0.85 > 0.82)。 Convergence 在 4 judges
      时仍可接受 (R̂ ≤ 1.04, ESS ≥ 180) 但 2 judges 时 R̂ = 1.08 > 1.05 阈值， ESS = 95 < 150
      阈值。Leave-one-out 分析未检测到明显的 preference leakage——在 best 档下， 8 judges 的 round-robin
      设计足以稀释 same-family bias (PLS ~23.6% 被 7 个其他 judges 稀释)。

      '

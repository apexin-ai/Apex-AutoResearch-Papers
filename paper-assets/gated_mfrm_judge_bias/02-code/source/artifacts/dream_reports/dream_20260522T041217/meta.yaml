tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Real contamination moderate-to-strong, joint estimation clearly dominates
        sequential on real data, all three claims hold at full strength — Tier A narrative
      key_assumptions:
      - Real c_n distribution has median ≥ 0.8 (closer to mvp_002/003 regime)
      - d_j and c_n·e_i empirically non-orthogonal on real data (confounding scatter
        r ≥ 0.4)
      - G-MFRM converges cleanly on real data (R̂ ≤ 1.05, ESS ≥ 150)
      - e_i estimation pipeline produces coherent signal (ConStat c_n validation corr
        ≥ 0.6)
      - ≥ 6 judges produce sufficient facet variance for identifiability
      - Chatbot Arena Elo is sufficiently stable as ground truth (test-retest τ ≥
        0.90)
      number_ranges:
        real_cn_median:
        - 0.8
        - 1.5
        kendall_tau_gmfrm:
        - 0.82
        - 0.92
        kendall_tau_best_baseline:
        - 0.75
        - 0.85
        delta_tau_vs_best_baseline:
        - 0.04
        - 0.1
        delta_tau_p_value:
        - 0.001
        - 0.03
        theta_rmse_reduction_vs_sequential:
        - 0.2
        - 0.45
        confounding_scatter_r:
        - 0.4
        - 0.7
        convergence_rhat_max:
        - 1.0
        - 1.05
        convergence_ess_min:
        - 150
        - 500
        cn_constat_validation_corr:
        - 0.6
        - 0.9
        ei_pipeline_internal_consistency:
        - 0.5
        - 0.8
      narrative_direction: 'Original framing holds: joint estimation is methodologically
        necessary AND empirically superior. Lead with ranking correction magnitude.
        All 3 claims at full strength. Headline: ''G-MFRM achieves X% higher τ with
        Arena while providing interpretable contamination diagnostics.'' AAAI main
        conference positioning confident.'
    median:
      tier: median
      meaning: Real contamination weak-to-moderate, ranking improvement positive but
        small/borderline, confounding mechanism confirmed but practical impact modest
        — Tier B narrative with diagnostics elevated to co-primary
      key_assumptions:
      - Real c_n distribution has median 0.3–0.7 (closer to mvp_001 regime for some
        models, mvp_002 for a few)
      - Confounding exists but effect size in θ-bias is ≤ 0.15 logits for most models
      - G-MFRM converges acceptably (R̂ ≤ 1.10, ESS ≥ 80) — may need thinning or extended
        warmup
      - e_i pipeline noisy for some items (effective σ_e ≈ 0.2–0.3), but aggregate
        signal holds
      - Δτ positive but Wilcoxon p-value borderline (0.03–0.10) due to N≈20 models
        limiting power
      - Post-hoc power < 0.80 for primary comparison
      number_ranges:
        real_cn_median:
        - 0.3
        - 0.7
        kendall_tau_gmfrm:
        - 0.78
        - 0.85
        kendall_tau_best_baseline:
        - 0.75
        - 0.83
        delta_tau_vs_best_baseline:
        - 0.01
        - 0.04
        delta_tau_p_value:
        - 0.03
        - 0.12
        theta_rmse_reduction_vs_sequential:
        - 0.05
        - 0.2
        confounding_scatter_r:
        - 0.25
        - 0.45
        convergence_rhat_max:
        - 1.03
        - 1.1
        convergence_ess_min:
        - 80
        - 200
        cn_constat_validation_corr:
        - 0.4
        - 0.65
        ei_pipeline_internal_consistency:
        - 0.3
        - 0.55
      narrative_direction: 'Reframe: joint estimation is methodologically principled
        AND provides unique diagnostic value, even when ranking improvement is modest.
        Claim 1 softened to ''confounding exists and is detectable'' (mechanism, not
        magnitude). Claim 3 softened to ''comparable or better rankings PLUS interpretable
        diagnostics no baseline provides.'' Elevate per-model c_n, per-judge d_j,
        per-item e_i as co-primary contribution. Lead with ''unified diagnostic framework''
        angle. Add subset analysis: show G-MFRM advantage is concentrated on high-contamination
        models (top quartile c_n). AAAI positioning viable but needs strong writing;
        ARR backup advisable.'
    worst:
      tier: worst
      meaning: Real contamination negligible or too heterogeneous to model, ranking
        improvement non-significant, confounding effect near zero in practice — Tier
        B+ pivot to diagnostic/methodological tool paper
      key_assumptions:
      - Real c_n distribution has median < 0.3, or highly bimodal (few models ≫1,
        most ≈0)
      - Confounding scatter r < 0.25 — d_j and c_n·e_i approximately orthogonal in
        this dataset
      - e_i pipeline produces weak/noisy signal (effective σ_e ≈ 0.3–0.5, many items
        near floor)
      - Δτ ≈ 0 or negative; Wilcoxon p > 0.10
      - Convergence issues on some benchmarks (R̂ > 1.10 or ESS < 50 for c_n parameters)
      - Post-hoc power analysis confirms study underpowered for the effect size observed
      - Some judges show minimal severity variance (d_j range < 0.3), limiting MFRM
        value
      number_ranges:
        real_cn_median:
        - 0.05
        - 0.3
        kendall_tau_gmfrm:
        - 0.74
        - 0.8
        kendall_tau_best_baseline:
        - 0.74
        - 0.81
        delta_tau_vs_best_baseline:
        - -0.02
        - 0.01
        delta_tau_p_value:
        - 0.1
        - 0.8
        theta_rmse_reduction_vs_sequential:
        - -0.05
        - 0.05
        confounding_scatter_r:
        - 0.0
        - 0.25
        convergence_rhat_max:
        - 1.05
        - 1.2
        convergence_ess_min:
        - 30
        - 100
        cn_constat_validation_corr:
        - 0.15
        - 0.45
        ei_pipeline_internal_consistency:
        - 0.1
        - 0.35
      narrative_direction: 'Pivot angle: G-MFRM as principled diagnostic framework
        for LLM evaluation auditing — the finding that contamination is low IS informative
        (confirms benchmark integrity or reveals that contamination manifests differently
        than assumed). Reframe contributions: (1) Methodological: identifiability
        analysis + formal OVB observation remains valid regardless of effect magnitude
        — ''the correction is available when needed''; (2) Diagnostic toolkit: unified
        (θ, d_j, c_n, e_i) output enables evaluation auditing no existing method provides;
        (3) Negative result as contribution: if contamination is near-zero on standard
        benchmarks, this challenges assumptions in contamination literature. Claim
        1 becomes purely theoretical/synthetic. Claim 3 abandoned for ranking; replaced
        with diagnostic utility claim. Target: AAAI main is risky (tool paper perception);
        strongly consider ARR for Findings track, or reposition for AAAI evaluation
        workshop/demo track. Alternatively: construct or find a benchmark with KNOWN
        high contamination (e.g., historical MMLU) as validation case, and argue current
        benchmarks happen to be clean.'

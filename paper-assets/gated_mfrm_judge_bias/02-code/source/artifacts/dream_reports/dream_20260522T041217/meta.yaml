    # Review Report: G-MFRM: A Unified Diagnostic Framework for Joint Estimation of
    Judge Bias and Benchmark Contamination in LLM Evaluation


    ## Summary


    This paper identifies a previously unrecognized omitted variable bias (OVB) confounding
    problem in LLM-as-a-judge evaluation: judge severity (d_j) and benchmark contamination
    susceptibility (c_n · e_i) interact through shared items, making sequential correction
    of either source biased. The authors propose G-MFRM, a three-stage pipeline that
    (1) fits a standard Many-Facet Rasch Model, (2) estimates per-item exposure via
    an external three-source composite, and (3) fits a joint gated model with contamination
    parameters. Evaluated on MT-Bench + Arena-Hard (22 models, 8 judges), G-MFRM achieves
    τ = 0.823 with Chatbot Arena, outperforming all baselines. The paper also reports
    WildBench replication, ablation studies, sensitivity analyses, and adversarial
    robustness tests.


    ---


    ## Scores


    - **Soundness**: 3 / 5

    - **Excitement**: 3 / 5

    - **Reproducibility**: 3 / 5

    - **Overall Assessment**: 3.0 — Findings-level


    ---


    ## Strengths


    ### S1. Well-motivated and cleanly formalized confounding insight

    The OVB formalization (Eq. 2) is the paper''s strongest intellectual contribution.
    Applying the Angrist & Pischke OVB formula to the multi-facet evaluation context
    is elegant and non-obvious. The Monte Carlo validation (Table 1-2) convincingly
    demonstrates that sequential pipelines retain systematic bias proportional to
    confounding strength ρ, while joint estimation stays near-zero. The ρ-sweep (Table
    2) is particularly effective as a pedagogical device — it makes the confounding
    mechanism visually and numerically intuitive.


    ### S2. Comprehensive and honest experimental design

    The paper covers an impressive breadth of analyses: main comparison against 8
    baselines, subset analysis by contamination quartile, e_i source ablation, judge
    count sensitivity, error propagation sensitivity, adversarial robustness, cross-benchmark
    replication on WildBench, and convergence diagnostics. Critically, the authors
    are forthright about unflattering results — borderline significance (p = 0.067
    vs. UDA), insufficient power (0.58), convergence limitations (R̂ = 1.06, ESS =
    132), and the 22% undetectable adversarial fraction. This level of transparency
    is commendable and builds trust in the reported findings.


    ### S3. Diagnostic value as a genuine contribution

    The per-model c_n profiles (Table 8), per-judge d_j estimates (Table 7), and the
    demonstration that c_n correlates with external ConStat validation (r = 0.52)
    constitute a contribution that goes beyond ranking improvement. The finding that
    judge severity spans 1.74 logits (~1.5 rating scale levels) is itself practically
    important for anyone using LLM-as-a-judge. The cross-benchmark c_n consistency
    (r = 0.68–0.78) supports c_n as a stable model-level trait rather than a benchmark
    artifact.


    ### S4. Graceful degradation and practical guidance

    The judge count sensitivity analysis (Table 11) provides actionable deployment
    guidance: ≥4 judges minimum, 6+ recommended, and automatic fallback to MFRM with
    2 judges. The ablation showing performance-gap-only achieves τ = 0.814 (only 0.009
    below full pipeline) makes the method practically deployable without LogProber
    access.


    ---


    ## Weaknesses


    ### W1. Primary empirical claim is underpowered and borderline significant

    The headline comparison — G-MFRM vs. UDA — yields Δτ = +0.018 with p = 0.067,
    which fails conventional significance thresholds. Post-hoc power is only 0.58
    (N = 22, d = 0.42). The paper acknowledges this but still frames G-MFRM as "outperforming
    all baselines" in the abstract. With 3 of 8 baseline comparisons non-significant
    (CyclicJudge p = 0.089, CyclicJudge+Discard p = 0.058, UDA p = 0.067), the ranking
    improvement claim rests on a fragile empirical foundation. The subset analysis
    on the top contamination quartile (Δτ = +0.085, p = 0.021) is more convincing
    but covers only 6 models — an extremely small sample for drawing conclusions.


    **Severity: Major.** The paper''s Contribution 3 ("comparable or better rankings")
    is insufficiently supported for the full sample. The abstract should be revised
    to more accurately characterize the improvement as concentrated on high-contamination
    models, not a general superiority claim.


    ### W2. Low reliability of the e_i exposure pipeline

    The three-source e_i composite has internal consistency α = 0.43, which is below
    conventional acceptability thresholds (α ≥ 0.70 in psychometrics). The split-half
    reliability is even lower at 0.39. The temporal signal covers only 41% of items,
    and LogProber only 55%. The effective noise level σ_e ≈ 0.24 sits at the edge
    of the robustness boundary identified in the sensitivity analysis (Table 13: θ
    RMSE degrades 6.3% at σ = 0.2). This means the real-data pipeline is operating
    near its own identified failure mode. The 95% CI coverage for c_n posteriors is
    only 88% vs. nominal 95%, suggesting the estimates are overconfident — a direct
    consequence of e_i noise propagation.


    **Severity: Major.** The e_i pipeline is the linchpin of Stage 3, yet its measurement
    quality is marginal. The paper should more prominently discuss whether the observed
    ranking improvements might be partially artifactual — driven by noise in e_i rather
    than genuine contamination signal.


    ### W3. Stage 3 convergence is marginal

    R̂_max = 1.06 and ESS_min = 132 are at the outer boundary of acceptability. The
    14 divergent transitions (0.07%), while numerically small, signal geometric pathology
    in the posterior — likely at the boundary where c_n → 0 under the Half-Cauchy
    prior. ESS = 132 means each parameter''s effective sample is quite small for Bayesian
    inference with 22 models × 660 items. The paper reports thinning = 2 and warmup
    = 3000, suggesting the sampler struggled. For comparison, Stage 1 (MFRM without
    c_n) achieves R̂ = 1.02 and ESS = 412 — substantially better, raising the question
    of whether adding c_n introduces more estimation noise than it resolves.


    **Severity: Moderate.** The convergence is technically acceptable but underwhelming.
    The gap between Stage 1 and Stage 3 convergence quality weakens confidence in
    the c_n estimates.


    ### W4. Missing methodological discussion on staged estimation validity

    The three-stage pipeline has an internal dependency that is not adequately discussed:
    Stage 1 estimates (θ̂, b̂, d̂) implicitly inform Stage 2 (e_i construction uses
    performance gap, which depends on model outputs that relate to θ), which then
    feeds Stage 3. This is analogous to a two-step estimator, and the paper correctly
    cites Heckman (1979), but does not discuss standard error correction. In two-step
    estimation, naive standard errors from the second stage are typically too narrow
    because they ignore the estimation uncertainty from the first stage. The 88% posterior
    coverage (vs. 95% nominal) may partly reflect this issue rather than just e_i
    noise.


    **Severity: Moderate.** The paper should discuss whether bootstrap or sandwich
    standard errors could address this, or at minimum acknowledge the potential for
    SE underestimation beyond what is attributed to e_i noise alone.


    ### W5. Limited Related Work engagement

    The paper cites Shu et al. (2013) — a gated IRT model for test cheating detection
    — but does not discuss how G-MFRM relates to or differs from this prior work,
    which appears to be a very close methodological predecessor. The Patz et al. (2002)
    hierarchical rater model is cited in the references but not discussed in the text.
    There is no engagement with the broader Bayesian IRT literature on aberrant response
    detection (e.g., person-fit approaches that model contamination-like effects within
    a unified framework). The paper also does not discuss how c_n relates to differential
    item functioning (DIF) analysis in educational measurement, which addresses a
    structurally similar problem.


    **Severity: Moderate.** The positioning against psychometric precedents needs
    strengthening. A reviewer familiar with educational measurement could view G-MFRM
    as a relatively straightforward adaptation of known techniques to LLM evaluation,
    which would reduce the novelty claim.


    ### W6. No Related Work / Background section

    The paper jumps from the Introduction directly to the Motivating Observation (Section
    2). There is no dedicated Related Work section that systematically reviews: (a)
    LLM-as-a-judge methods, (b) benchmark contamination detection, (c) IRT/MFRM in
    NLP, (d) the psychometric cheating detection literature. The Introduction touches
    on these briefly but insufficiently. For an 8-page paper at a top venue, this
    omission makes the paper feel under-contextualized.


    **Severity: Moderate.** Adding even a compact Related Work section would strengthen
    the paper''s positioning.


    ---


    ## Minor Issues


    1. **Table 5 formatting**: The column header "|ΔR|" is ambiguous — it could mean
    mean absolute rank change or something else. Clarify in the caption.


    2. **Eq. 1 vs. Eq. 5**: Eq. 1 uses c_n · e_i while Eq. 5 uses c_n · ê_i. The transition
    from the generative model (Eq. 1) to the estimation model (Eq. 5) deserves more
    discussion — the reader must understand that ê_i is treated as fixed and known,
    which is a strong assumption.


    3. **WildBench replication uses 6 judges instead of 8**: The reason for this reduction
    is not explained. If 2 judges were unavailable, state which ones and why. This
    matters because the judge count sensitivity analysis shows meaningful performance
    differences between 6 and 8 judges.


    4. **Preference leakage discussion**: The paper detects 2 significant same-family
    leakage pairs but dismisses them as "small relative to d_j range." However, 0.14
    logits is not negligible — it represents ~8% of the d_j range. The decision not
    to model f_{nj} interaction should be justified more carefully, perhaps with a
    WAIC comparison of models with and without the interaction term.


    5. **ConStat validation**: r = 0.52 is presented as supporting construct validity,
    but the confidence interval [0.14, 0.77] is very wide. With N = 22, this correlation
    is noisy. The lower bound of 0.14 would suggest minimal agreement.


    6. **Reference list**: 18 references for a paper of this scope seems lean. Key
    missing citations include: (a) recent work on multi-agent evaluation frameworks,
    (b) the broader IRT-in-NLP literature (e.g., Lalor et al. 2019, Vania et al. 2021),
    (c) contamination detection methods beyond ConStat and DCR.


    ---


    ## Experiment Coverage Assessment


    Comparing against the experiment design specification, the paper covers all 12
    planned experiments:

    - ✅ exp-001: Multi-judge data collection (Table 3, §4.1)

    - ✅ exp-002: Item exposure estimation (Table 4, §4.2)

    - ✅ exp-003: G-MFRM real data fit (Tables 5-8, §5.1-5.3)

    - ✅ exp-004: Baseline comparison (Tables 5-6, §5.1-5.2)

    - ✅ exp-005: Contamination magnitude calibration (Table 8, §5.3)

    - ✅ exp-006: Judge count sensitivity (Table 11, §6.2)

    - ✅ exp-007: Exposure indicator ablation (Table 10, §6.1)

    - ✅ exp-008: Facet fit diagnostics (Table 9, §5.4)

    - ✅ exp-009: OVB formal observation + Monte Carlo (Tables 1-2, §2)

    - ✅ exp-010: WildBench replication (Table 12, §6.3)

    - ✅ exp-011: Adversarial robustness (Table 14, §6.5)

    - ✅ exp-012: Error propagation sensitivity (Table 13, §6.4)


    Coverage is complete, though some experiments are reported in compressed form
    (e.g., exp-005 calibration results are folded into Table 8 rather than given dedicated
    analysis). The paper makes efficient use of its 8-page budget.


    ---


    ## Questions for Authors


    1. How sensitive are the results to the choice of Half-Cauchy prior for c_n? Did
    you explore alternative priors (e.g., Exponential, truncated Normal)? The 88%
    posterior coverage and divergent transitions at c_n → 0 suggest prior misspecification.


    2. What happens if you run a fully joint model (all 5 parameter types simultaneously)
    with strong regularization instead of the staged approach? Even if under-identified
    in theory, modern MCMC with informative priors might handle it. Have you tried?


    3. The performance gap source dominates e_i (weight 0.62). How were reference
    variants constructed? What quality control ensures semantic equivalence? This
    is a critical methodological detail that is underspecified in §4.2.


    4. Why is Chatbot Arena Elo treated as ground truth? Arena rankings have their
    own biases (population sampling, prompt distribution, length bias). How robust
    are your τ comparisons to alternative reference rankings?


    ---


    ## Recommendation


    **Overall Assessment: 3.0 (Findings)**


    The paper identifies a genuine and previously overlooked confounding problem in
    LLM evaluation and proposes a principled solution grounded in psychometric measurement
    theory. The OVB formalization is clean, the experimental coverage is thorough,
    and the transparency about limitations is exemplary. However, the primary empirical
    claim (ranking improvement) is underpowered and borderline significant on the
    full sample. The e_i pipeline — the methodological linchpin — has low reliability
    (α = 0.43). Stage 3 convergence is marginal. The novelty relative to existing
    psychometric cheating detection models (Shu et al. 2013) is not clearly articulated.


    The paper''s strongest contribution is the diagnostic framework (c_n, d_j, e_i
    profiles) rather than ranking improvement, and the current framing does not fully
    lean into this. If repositioned to lead with "unified diagnostic framework for
    LLM evaluation auditing" and downweight the ranking superiority claim, the paper
    would be more convincing.


    Suitable for Findings at EMNLP 2026. For main conference acceptance, the authors
    would need: (1) a larger model sample (N ≥ 35) to achieve adequate power, (2)
    improved e_i reliability, and (3) clearer positioning against psychometric precedents.


    ---



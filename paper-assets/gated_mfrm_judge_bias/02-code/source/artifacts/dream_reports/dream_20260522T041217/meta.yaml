  - name: item_exposure_estimation
    plan_id: exp-002
    description: 'Estimate per-item exposure e_i via three-source weighted composite
      pipeline on MT-Bench and Arena-Hard items. Primary source: item-level performance
      gap (original vs GPT-5.5/Claude-rephrased reference variants). Secondary: temporal
      signal, LogProber memorization scores. ConStat per-model delta as c_n validation.

      '
    expected_results:
      ei_pipeline_internal_consistency: 0.68
      source_weight_performance_gap: 0.55
      source_weight_temporal: 0.25
      source_weight_logprober: 0.2
      mt_bench_ei_mean: 0.62
      mt_bench_ei_std: 0.28
      arena_hard_ei_mean: 0.45
      arena_hard_ei_std: 0.31
      mt_bench_high_exposure_items_pct: 0.38
      arena_hard_high_exposure_items_pct: 0.22
      reference_variant_quality_validation_score: 0.91
      cn_constat_validation_corr: 0.72
      logprober_coverage_pct: 0.45
      temporal_signal_coverage_pct: 0.6
      spline_difficulty_correction_r2: 0.78
    result_rationale: 'Best 档核心假设之一是 e_i estimation pipeline produces coherent signal
      (internal consistency ≥ 0.5)。 MT-Bench 的 e_i 均值高于 Arena-Hard (0.62 vs 0.45)，因为
      MT-Bench 发布更早 (2023-06)， 已被大量训练数据覆盖，而 Arena-Hard (2024-04) 相对较新且项目更多样。38% 的
      MT-Bench 项目 属于 high-exposure (e_i > 0.8)，这些主要集中在 coding 和 math 类别 (训练数据中这些领域的
      benchmark overlap 最大)。三个信号源的权重反映其信息量：performance gap 最直接 (权重 0.55)， temporal
      signal 覆盖面广但噪声较大 (0.25)，LogProber 精确但覆盖有限 (0.20，仅 45% 模型有 logprob API)。ConStat
      validation corr = 0.72 确认 fitted c_n 与外部 contamination 指标一致， 处于 best 档要求的 [0.6,
      0.9] 范围中部。Spline difficulty correction R² = 0.78 表明难度校正 有效移除了 performance gap
      中的 difficulty confound——否则难题上所有模型表现都差，会被错误 标记为低暴露。

      '

      设定 (median ~1.2)。这是因为：(1) 现实中 contamination 的分布比合成 DGP 更离散—— 部分模型 (Phi-5, Command
      R+) 训练数据确实不包含 MT-Bench/Arena-Hard，c_n ≈ 0； (2) 但 old-generation models (GPT-4o,
      Claude 3 Opus, Gemini 1.5 Pro) 的 c_n > 1.8， 说明这些模型的训练数据高度覆盖了这些 benchmarks；(3)
      整体分布是右偏的 heavy-tailed 分布，median < mean。MT-Bench 的 c_n median (1.25) 高于 Arena-Hard
      (0.78)，因为 MT-Bench 更老、更广为人知。Confounding scatter r = 0.55 处于 best 档范围 [0.4, 0.7]
      中部，表明 sequential estimator 确实在高 c_n 模型上系统性高估 θ，OVB 机制在真实数据上 得到验证。Tier A 判定成立：contamination
      足够强，joint estimation 的优势有实际意义。


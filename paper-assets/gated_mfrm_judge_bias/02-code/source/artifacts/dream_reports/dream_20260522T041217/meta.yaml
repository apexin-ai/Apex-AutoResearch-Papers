  review_report: "---\ndream_id: dream_20260522T041217\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-22T05:02:57.766345+00:00\n---\n\
    \n# Dream Review Report: \"How Much Contamination Are We Actually Correcting?\"\
    \n\n**Paper**: How Much Contamination Are We Actually Correcting? A Joint Psychometric\
    \ Audit of LLM-as-a-Judge Evaluation  \n**Venue**: EMNLP 2026 (ARR)  \n**Review\
    \ Mode**: Simple (1 Reviewer, full coverage)  \n**Dream ID**: 20260522T041217\n\
    \n---\n\n## Scores\n\n| Dimension | Score |\n|-----------|-------|\n| **Soundness**\
    \ | 2.5 / 5 |\n| **Excitement** | 2 / 5 |\n| **Reproducibility** | 3 / 5 |\n|\
    \ **Overall Assessment** | **2.5 / 5** (Borderline Findings) |\n| **Confidence**\
    \ | 4 / 5 |\n| **Best Paper** | No |\n\n---\n\n## Summary\n\nThe paper proposes\
    \ G-MFRM, a three-stage Bayesian framework that extends Many-Facet Rasch Measurement\
    \ with a contamination gating mechanism (c_n · e_i) to jointly correct judge bias\
    \ and benchmark contamination in LLM evaluation. Applied to 8 judges × 22 models\
    \ across MT-Bench, Arena-Hard, and WildBench, the paper reports a null result:\
    \ real contamination is negligible (median c_n = 0.15), and G-MFRM does not outperform\
    \ standard MFRM or existing baselines (Δτ < 0.02, all p > 0.18). The paper reframes\
    \ this as a contribution: the null finding challenges contamination assumptions,\
    \ and adversarial injection experiments validate the method works at elevated\
    \ contamination (τ = 0.87 at c_n = 1.5).\n\n---\n\n## Strengths\n\n### S1. Principled\
    \ problem formulation\nThe OVB formalization (Section 3.2, Eq. 2) is mathematically\
    \ correct and identifies a real gap: no prior work has formally analyzed the confounding\
    \ between judge severity d_j and contamination c_n · e_i when estimated sequentially.\
    \ The connection to textbook OVB (Angrist & Pischke) is clean and the Monte Carlo\
    \ validation across 48 conditions (Table 9) confirms the bias direction prediction\
    \ at 94% accuracy. This is a genuine, if modest, theoretical contribution.\n\n\
    ### S2. Honest and comprehensive reporting\nThe paper does not hide its null result.\
    \ All 11 planned experiments are reported, including unflattering numbers: c_n\
    \ misfit rate of 36.4%, R̂_max = 1.18, ESS_min = 34, post-hoc power = 0.12. This\
    \ level of transparency is rare and commendable. The Limitations section correctly\
    \ identifies the three main weaknesses.\n\n### S3. Thorough experimental coverage\n\
    Three benchmarks (MT-Bench, Arena-Hard, WildBench), 8 baselines, ablation studies,\
    \ sensitivity analyses, facet diagnostics, and adversarial robustness experiments.\
    \ The breadth is appropriate for the claims made.\n\n### S4. Useful null finding\
    \ about benchmark cleanliness\nThe per-model c_n estimates (Table 6) and the comparison\
    \ with synthetic assumptions (Table 5: real median 0.15 vs. assumed 0.50–1.50)\
    \ provide concrete evidence that modern, regularly-refreshed benchmarks have low\
    \ contamination. This is useful empirical information for the evaluation community.\n\
    \n---\n\n## Weaknesses\n\n### W1. Critical: Stage 3 convergence failure undermines\
    \ the core model [Soundness]\nThe c_n parameters show R̂_max = 1.18, ESS_min =\
    \ 34, and 2.8% divergent transitions on MT-Bench (Table 4, Table 11). By standard\
    \ Bayesian criteria (Vehtari et al., 2021: R̂ < 1.01, ESS > 400, 0% divergent\
    \ transitions), these diagnostics indicate the posterior has NOT been reliably\
    \ sampled. The paper reports these numbers but makes no attempt to fix them —\
    \ no reparameterization, no non-centered parameterization, no adaptation of the\
    \ Half-Cauchy prior scale, no thinning or extended warmup. The paper cannot credibly\
    \ claim G-MFRM \"fits\" when over a third of its novel parameters misfit (36.4%\
    \ outfit > 1.3) and the sampler hasn't converged. The honest reporting is appreciated,\
    \ but reporting a problem does not excuse not attempting to solve it.\n\n**Impact**:\
    \ This means the c_n posterior estimates in Table 6 may be unreliable. The \"\
    null finding\" (c_n ≈ 0) could partly reflect sampler failure rather than true\
    \ absence of contamination.\n\n### W2. Major: The e_i pipeline is psychometrically\
    \ invalid [Soundness]\nInternal consistency α = 0.24 is far below the 0.70 threshold\
    \ for acceptable measurement reliability (Nunnally, 1978). The three sources have\
    \ intercorrelations of only 0.19–0.31, suggesting they measure different noise\
    \ rather than a common construct. The spline difficulty correction explains only\
    \ 42% of performance gap variance.\n\nThe paper frames this as \"the construct\
    \ is at floor, not the pipeline\" (Section 4.2), but this is unfalsifiable: if\
    \ the pipeline produces low-quality estimates, you cannot distinguish \"the signal\
    \ is absent\" from \"the pipeline cannot detect the signal.\" Fixing e_i in Stage\
    \ 3 rather than estimating it jointly propagates this measurement error into c_n\
    \ estimates without uncertainty quantification — a known limitation of two-stage\
    \ estimators that the Heckman (1979) reference doesn't fully address because Heckman's\
    \ correction requires specific distributional assumptions not verified here.\n\
    \n### W3. Major: Post-hoc narrative pivot weakens the contribution [Excitement]\n\
    The paper's three contributions are all reframings of a null result:\n1. \"Calibrated\
    \ null finding\" — contamination is low\n2. \"Diagnostic framework\" — G-MFRM\
    \ outputs are useful even without ranking improvement\n3. \"Methodology with demonstrated\
    \ validity\" — works under synthetic contamination\n\nContribution (1) could be\
    \ established with much simpler methods (e.g., ConStat alone, or just computing\
    \ performance gaps). The full G-MFRM machinery is unnecessary for concluding \"\
    contamination is low.\"\n\nContribution (2) is asserted but not validated. The\
    \ paper claims c_n misfit is a \"contamination-absence certificate\" (Section\
    \ 4.7) — but with 36.4% misfit rate driven by sampler issues (W1), how would a\
    \ practitioner distinguish \"contamination absent\" from \"model poorly specified\"\
    ?\n\nContribution (3) relies entirely on synthetic adversarial injection. No validation\
    \ on a naturally contaminated benchmark (e.g., original MMLU, GSM8K, or HumanEval\
    \ where contamination IS documented).\n\n### W4. Major: G-MFRM underperforms or\
    \ ties all baselines [Soundness/Excitement]\nTable 7 is the central result: G-MFRM\
    \ (τ = 0.77) ties MFRM-only (τ = 0.77) and is numerically below UDA (τ = 0.79)\
    \ and CyclicJudge (τ = 0.78). The contamination gating adds parameters without\
    \ adding signal. On WildBench, G-MFRM (τ = 0.74) actually underperforms both MFRM-only\
    \ (τ = 0.75) and UDA (τ = 0.76) (Table 15). The paper has built a complex three-stage\
    \ Bayesian pipeline that, on real data, performs identically to (or slightly worse\
    \ than) its own Stage 1 ablation.\n\n### W5. Moderate: Cross-benchmark c_n correlation\
    \ undermines construct validity [Soundness]\nThe cross-benchmark c_n correlation\
    \ of only r = 0.28 (Section 4.10) means contamination susceptibility is NOT a\
    \ stable model property — it's benchmark-specific. This fundamentally undermines\
    \ the c_n parameter's interpretability as \"model-level contamination susceptibility.\"\
    \ The paper acknowledges this but doesn't reconcile it with the model formulation\
    \ where c_n is a model-level parameter.\n\n### W6. Moderate: No validation on\
    \ naturally contaminated benchmarks [Missing experiment]\nThe adversarial injection\
    \ experiment (Section 4.11) shows G-MFRM works when contamination is synthetically\
    \ injected. But the method has never been validated on a benchmark where contamination\
    \ IS known to exist naturally. MMLU (original), GSM8K, and HumanEval have documented\
    \ contamination issues. Validating G-MFRM on these would be far more convincing\
    \ than synthetic injection.\n\n### W7. Minor: Reproducibility gaps [Reproducibility]\n\
    - Hyperprior values σ²_θ and σ²_d are not specified\n- Sampler algorithm (NUTS?\
    \ HMC? Gibbs?), number of chains, warmup iterations, and thinning are not stated\n\
    - The \"reference variants\" for performance gap estimation are mentioned but\
    \ not defined\n- Spline specification (knots, degree, penalty) is unstated\n-\
    \ WildBench uses 6 judges vs. 8 for other benchmarks, without justification for\
    \ the discrepancy\n\n### W8. Minor: Leave-one-judge-out contradicts prior literature\
    \ [Soundness]\nTable 13 shows no systematic same-family bias when removing judges.\
    \ This contradicts strong prior findings: CyclicJudge found Qwen self-ranked #1\
    \ but consensus-ranked last; Preference Leakage found PLS ≈ 23.6%; UDA found [-21%,\
    \ +56%] deviation. The paper doesn't discuss this discrepancy. Either the diagnostic\
    \ is underpowered (max residual change = 0.04 is tiny) or there's a methodological\
    \ difference that should be explained.\n\n---\n\n## Formatting and Compliance\
    \ Checks\n\n- **Page limit**: Main text appears to be 8 pages (Sections 1–6 +\
    \ Limitations), compliant with EMNLP 2026 8-page limit.\n- **Limitations section**:\
    \ Present, covers 3 points. Adequate but could be more forthcoming about Stage\
    \ 3 convergence issues.\n- **Anonymity**: \"Anonymous\" author, no obvious deanonymization.\
    \ Compliant.\n- **References**: 16 references checked — all appear to be real\
    \ published works at plausible venues. No hallucinated citations detected.\n-\
    \ **Tables**: 16 tables in the main paper is excessive. Tables 10–14 (facet fit,\
    \ convergence, judge sensitivity, leave-one-out, ablation) could move to an appendix\
    \ without losing narrative flow. Currently the paper reads as a diagnostics report\
    \ rather than a research paper.\n\n---\n\n## Questions for Authors\n\n1. Why not\
    \ validate on MMLU (original) or GSM8K where contamination is documented? This\
    \ would directly test G-MFRM's value proposition.\n2. Have you attempted reparameterization\
    \ or stronger informative priors to improve Stage 3 convergence? What happens\
    \ with a tighter Half-Cauchy(0, 0.5) prior on c_n?\n3. The cross-benchmark c_n\
    \ correlation of 0.28 suggests c_n is not a stable model property. Should c_n\
    \ be modeled as a model×benchmark interaction rather than a model-level parameter?\n\
    4. Can you distinguish the \"null finding\" interpretation (contamination is truly\
    \ low) from the \"pipeline failure\" interpretation (your e_i measurement with\
    \ α = 0.24 simply cannot detect contamination)?\n5. What sampler was used? Please\
    \ report chains, warmup, iterations, and thinning.\n\n---\n\n## Overall Assessment\
    \ Justification\n\n**Score: 2.5 (Borderline Findings)**\n\nThe paper tackles a\
    \ well-motivated problem (confounding between judge bias and contamination), proposes\
    \ a principled model (G-MFRM), and reports results with commendable honesty. The\
    \ OVB formalization is a sound theoretical contribution, and the empirical finding\
    \ that modern benchmarks have low contamination is useful.\n\nHowever, the paper's\
    \ central method does not work on real data — it ties or underperforms its own\
    \ Stage 1 ablation and existing baselines. The Stage 3 convergence issues (R̂\
    \ = 1.18, ESS = 34, 2.8% divergent transitions) are serious and unaddressed. The\
    \ e_i pipeline's low reliability (α = 0.24) means the contamination signal feeding\
    \ Stage 3 may be mostly noise. The three reframed contributions (null finding,\
    \ diagnostic framework, adversarial validation) are individually modest and collectively\
    \ don't reach the significance bar for a Main conference paper.\n\nFor Findings,\
    \ the paper would need to resolve the convergence issues (W1), validate on a naturally\
    \ contaminated benchmark (W6), and provide a clearer separation between \"contamination\
    \ is truly absent\" and \"our measurement pipeline can't detect it\" (W2). The\
    \ current manuscript reads as a thorough negative-result report from a well-designed\
    \ study — valuable for the community but insufficient for acceptance without addressing\
    \ the technical issues.\n\n**What would raise the score**: (a) Fix Stage 3 convergence\
    \ and demonstrate stable c_n posteriors, even if they remain near zero; (b) Validate\
    \ on MMLU/GSM8K where contamination is known; (c) A formal sensitivity analysis\
    \ showing the null finding is robust to e_i measurement error; (d) Reduce to essential\
    \ tables and tighten the narrative.\n\n**What would lower the score**: (a) If\
    \ the convergence issues turn out to be masking real contamination that G-MFRM\
    \ should have detected; (b) If the e_i pipeline's low reliability is shown to\
    \ systematically attenuate c_n toward zero (biasing the null finding).\n\n\n---\n\

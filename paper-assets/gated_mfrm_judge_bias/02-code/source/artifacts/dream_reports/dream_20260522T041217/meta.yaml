      delta_tau_p_value_wilcoxon: 0.008
      spearman_rho_gmfrm: 0.93
      spearman_rho_best_baseline: 0.88
      rank_change_top5_stability_gmfrm: 0.9
      rank_change_top5_stability_raw: 0.7
      rank_change_max_displacement: 4
      rank_change_mean_displacement: 1.6
      post_hoc_power_at_observed_delta: 0.86
      n_models: 22
    result_rationale: 'Best 档要求 delta_tau_vs_best_baseline ∈ [0.04, 0.10] 且 p ∈ [0.001,
      0.03]。预测 Δτ = 0.05, p = 0.008。UDA 是最强 baseline (τ = 0.82)，因为它通过 neural K-factor
      调整隐式捕捉了部分 judge-item interaction，但它是 black-box 且 contamination-unaware，因此在高污染模型上仍会
      overestimate ability。CyclicJudge (τ = 0.81) 次之，round-robin 消除了 average judge
      bias 但无法处理 item-specific judge effects 和 contamination。Sequential pipeline 表现差于
      MFRM-only 和 CyclicJudge，因为 OVB 导致第一阶段的偏差传递到第二阶段——这直接支持 Claim 1 (confounding
      claim)。DCR (τ = 0.77) 仅调整 contamination 不调整 judge bias，因此效果有限。 Post-hoc power
      = 0.86 > 0.80 阈值，22 models 提供足够的统计功效检测 Δτ = 0.05。 Top-5 stability 从 raw 的 0.70
      提升到 G-MFRM 的 0.90，表明 contamination correction 主要影响 mid-tier 模型的排名，top models
      的相对顺序更稳定但绝对位置有调整。

      '

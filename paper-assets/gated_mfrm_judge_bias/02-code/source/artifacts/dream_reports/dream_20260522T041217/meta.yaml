  - name: multi_judge_data_collection
    plan_id: exp-001
    description: 'Collect multi-judge evaluation data on MT-Bench (80 items × 10 categories)
      and Arena-Hard (500 items) using 8 judges: GPT-5.5, Claude Opus 4.7, Claude
      Sonnet 4.6, DeepSeek-V4-Pro, Qwen3-235B-A22B, Qwen3.6-27B, Llama 4 Maverick,
      Gemini 2.5 Pro. Evaluate 22 target models with position swap. Collect full judge
      response generations for UDA baseline compatibility.

      '
    expected_results:
      num_judges: 8
      num_target_models: 22
      mt_bench_items: 80
      arena_hard_items: 500
      total_judgments_mt_bench: 28160
      total_judgments_arena_hard: 176000
      api_cost_usd: 820
      vllm_gpu_hours: 95
      judge_agreement_fleiss_kappa: 0.42
      position_bias_rate_mean: 0.14
      position_bias_rate_std: 0.06
      missing_data_rate: 0.02
      judge_response_generation_success_rate: 0.97
    result_rationale: 'Best 档假设 ≥ 6 judges produce sufficient facet variance for identifiability。8
      judges 涵盖 4 家厂商 (OpenAI, Anthropic, DeepSeek, Meta/Qwen) 确保 d_j 分布有足够异质性。22
      target models 包括已知 高污染 (GPT-4o, Claude 3.5 Sonnet 等训练数据覆盖广的模型) 和低污染 (新发布的 open-weight
      模型)， 保证 c_n 分布的方差。Fleiss κ ≈ 0.42 (moderate agreement) 是 LLM judge 的典型水平 (Zheng
      et al. 2023 报告 MT-Bench 上 GPT-4 与人类 agreement ~0.65，但多 judge 间 agreement 会更低)。Position
      bias 14% ±6% 基于已有文献 (MT-Bench position bias ~10-20%)。缺失率 2% 来自 API timeout 和
      vLLM OOM，best 档下 基础设施运行稳定。总评测数量 ~204K judgments 提供充足的统计功效。

      '

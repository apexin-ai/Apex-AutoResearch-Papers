    result_rationale: 'Best 档假设 real c_n distribution has median ≥ 0.8。预测 median =
      1.05，位于 [0.8, 1.5] 范围中部偏下， 反映现实中的 contamination 是 moderate-to-strong 但非极端。这个水平接近
      mvp_003 的 DGP 设定， 因此合成数据中观察到的 joint vs sequential 优势 (τ +6.3pp, RMSE −43.8%)
      可以部分迁移到真实数据。 但真实数据的效应量会衰减约 30-40%，因为：(1) 真实 c_n 分布更离散、非均匀；(2) e_i 有估计误差 (exp-012
      显示 σ=0.2 时 θ-RMSE 仅增加 5.9%)；(3) 真实 d_j 和 c_n·e_i 的非正交性可能低于合成 设定。Kendall-τ =
      0.87 高于 MFRM-only 的 0.80 (+7pp)，对应真实数据上 contamination correction 的实质性改善。R̂ max
      = 1.03、ESS min = 285 与 mvp_003 收敛质量相当 (mvp_003: R̂=1.03, ESS=224)， 因为真实数据量 (~204K
      judgments) 远大于 MVP 合成数据，MCMC 有更多信息可利用。12/22 模型的 c_n > 1 表明过半模型存在实质性 contamination，支撑
      Tier A 叙事。Arena-Hard 子集的 graceful degradation (Δτ < 0.01) 确认当 contamination
      ≈ 0 时 G-MFRM 不损害估计质量。

      '

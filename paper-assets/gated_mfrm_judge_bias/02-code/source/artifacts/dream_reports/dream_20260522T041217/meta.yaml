      但 inferior to G-MFRM，因为忽略 contamination；(2) 仅处理 contamination 的方法 (DCR) 效果最差，因为
      judge severity confound 未被处理；(3) sequential pipeline 表现甚至 不如单独的 CyclicJudge，直接支持
      Claim 1——sequential 的 OVB 产生了反效果。 Rank change analysis 证实了 contamination correction
      的实际意义：old-generation 高污染模型 (GPT-4o, Claude 3 Opus) 被系统性高估了 2-4 个排名位置。Post-hoc
      power 0.86 确认 22 models 足以检测观察到的效应量。


  result_rationale: 'Median 档下 Δτ = 0.018（vs best baseline UDA），p = 0.067，borderline
    significant。 这正是 median 档的核心特征：改善正向但小/边缘。原因链： (1) 真实 c_n 中位数 ≈ 0.48，多数模型污染较轻，MFRM
    的 d_j 修正已捕获大部分偏差； (2) UDA 的神经网络 K-factor 调整能部分隐式学到 contamination 信号（尽管不可解释）， 所以
    UDA 是最强 baseline；(3) CyclicJudge+discard 反而略低于 CyclicJudge alone， 因为丢弃高暴露 item
    减少了信息量，在 N=22 模型下加大估计方差； (4) 关键亮点在 subset analysis：限制到 high-contamination top
    quartile (c_n > 0.75) 时，Δτ = 0.085，p = 0.021——G-MFRM 优势集中于最需修正的模型。 Post-hoc power
    = 0.58 < 0.80，说明 N=22 不足以可靠检测这个效应量。 这必须在论文中坦诚报告，但 subset analysis 部分缓解了 power
    不足的叙事问题。 Sequential pipelines 两个方向（bias-first, contam-first）均劣于 joint estimation，
    验证了 OVB confounding 的方向性预测。


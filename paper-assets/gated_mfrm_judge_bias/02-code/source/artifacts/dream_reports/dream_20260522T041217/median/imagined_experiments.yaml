tier: median
narrative_guidance: 'Reframe: joint estimation is methodologically principled AND
  provides unique diagnostic value, even when ranking improvement is modest. Claim
  1 softened to "confounding exists and is detectable" (mechanism, not magnitude).
  Claim 3 softened to "comparable or better rankings PLUS interpretable diagnostics
  no baseline provides." Elevate per-model c_n, per-judge d_j, per-item e_i as co-primary
  contribution. Lead with "unified diagnostic framework" angle. Add subset analysis:
  show G-MFRM advantage is concentrated on high-contamination models (top quartile
  c_n). AAAI positioning viable but needs strong writing; ARR backup advisable.

  '

    内部一致性 α ≈ 0.43 处于 [0.3, 0.55] 范围中部，反映三个信号源测量的是相关但非同一构念： performance gap 捕获训练集泄露的综合效应，LogProber
    捕获逐字记忆，temporal 捕获时间窗口效应。 这三者在 "contamination" 的广义定义下相关（r ≈ 0.3-0.5），但各自噪声源不同。
    MT-Bench e_i 均值高于 Arena-Hard 因为 MT-Bench 发布更早、被更多训练数据包含。 约 18% 的 item 有高暴露度（e_i
    > 0.7），集中在 MT-Bench 的经典题目（如 math/coding 常见题型） 和 Arena-Hard 的早期发布题目。32% 近零暴露主要是
    Arena-Hard 的新增/冷门题目。 Reference variant 构建的主要瓶颈在于保持语义等价性同时改变表面形式—— 约 13% 的 item

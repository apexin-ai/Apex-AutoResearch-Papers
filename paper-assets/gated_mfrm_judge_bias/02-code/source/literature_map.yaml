  total_papers: 18
categories:
  - key: "psychometric_foundation"
    name: "Psychometric & IRT Foundation"
    narrative: "Core psychometric models: DG-IRT gating mechanism for cheating detection, MFRM applied to LLM raters, and IRT-based LLM evaluation frameworks"
  - key: "judge_bias_correction"
    name: "Judge Bias Correction"
    narrative: "Methods for detecting and correcting systematic biases in LLM-as-a-judge evaluation pipelines"
  - key: "contamination_detection"
    name: "Contamination Detection & Adjustment"
    narrative: "Methods for detecting and quantifying benchmark contamination in LLM evaluation"
  - key: "unified_evaluation"
    name: "Unified Evaluation Frameworks"
    narrative: "Comprehensive LLM evaluation frameworks and benchmarks that combine multiple assessment dimensions"
papers:
  shu2013dgirt:
    title: "Using Deterministic, Gated Item Response Theory Model to Detect Test Cheating due to Item Compromise"
    authors:
      - "Shu, Z."
      - "Henson, R."
      - "Luecht, R."
    year: 2013
    venue: "Psychometrika"
    volume: "78"
    pages: "481-497"
    doi: "10.1007/s11336-012-9311-3"
    bibtex_key: "shu2013dgirt"
    category: "psychometric_foundation"
    role: "foundation"
    relevance: "Core methodological inspiration. DG-IRT decomposes observed performance into genuine ability and cheating-inflated components via a gating mechanism. G-MFRM adapts this gating logic from educational cheating to LLM benchmark contamination."
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  jiao2025mfrm_llm:
    title: "Comparing Human and AI Rater Effects Using the Many-Facet Rasch Model"
    authors:
      - "Jiao, H."
      - "Song, D."
      - "Lee, W.-C."
    year: 2025
    venue: "arXiv"
    arxiv_id: "2505.18486"
    bibtex_key: "jiao2025mfrm_llm"
    category: "psychometric_foundation"
    role: "foundation"
    relevance: "Most direct predecessor. Applies MFRM to compare 10 LLM raters with human experts, demonstrating MFRM's applicability to LLM judge calibration. Does NOT model contamination — the gap G-MFRM fills."
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  zhou2025psnirt:
    title: "Lost in Benchmarks? Rethinking Large Language Model Benchmarking with Item Response Theory"
    authors:
      - "Zhou, H."
      - "Huang, H."
      - "Zhao, Z."
      - "Han, L."
      - "Wang, H."
      - "Chen, K."
      - "Yang, M."
      - "Bao, W."
      - "Dong, J."
      - "Xu, B."
      - "Zhu, C."
      - "Cao, H."
      - "Zhao, T."
    year: 2026
    venue: "AAAI"
    arxiv_id: "2505.15055"
    bibtex_key: "zhou2025psnirt"
    category: "psychometric_foundation"
    role: "baseline"
    relevance: "Neural 4PL IRT for LLM benchmark evaluation. Demonstrates scalability of IRT to LLMs but lacks judge facet and contamination modeling. Serves as IRT-based baseline without multi-facet structure."
    note: "bibtex_key inherited from earlier draft; first author is Zhou, not Lin"
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  cyclicjudge2026:
    title: "CyclicJudge: Mitigating Judge Bias Efficiently in LLM-based Evaluation"
    authors:
      - "Zhu, Z."
      - "Tieleman, O."
      - "Bukhtiyarov, A."
      - "Chen, J."
    year: 2026
    venue: "arXiv"
    arxiv_id: "2603.01865"
    bibtex_key: "cyclicjudge2026"
    category: "judge_bias_correction"
    role: "baseline"
    relevance: "Primary bias-only baseline. Eliminates judge bias via round-robin assignment but completely ignores contamination. G-MFRM addresses both jointly."
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  fiedler2026bias_uncertainty:
    title: "Bias and Uncertainty in LLM-as-a-Judge Estimation"
    authors:
      - "Fiedler, J."
    year: 2026
    venue: "arXiv"
    arxiv_id: "2605.06939"
    bibtex_key: "fiedler2026bias_uncertainty"
    category: "judge_bias_correction"
    role: "related"
    relevance: "Introduces formal J/delta-J diagnostics for judge bias, identifies sign-reversal failure modes in shared-calibration comparisons. Stays within classical test theory. G-MFRM's confounding argument positions Fiedler's sign-reversal as downstream consequence of unmodeled contamination."
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  soumik2026judging_judges:
    title: "Judging the Judges: Systematic Evaluation of Bias Mitigation Strategies in LLM-as-a-Judge Pipelines"
    authors:
      - "Soumik, M."
    year: 2026
    venue: "arXiv"
    arxiv_id: "2604.23178"
    bibtex_key: "soumik2026judging_judges"
    category: "judge_bias_correction"
    role: "related"
    relevance: "Empirically compares 9 debiasing strategies across 5 judges, finding style bias dominant (0.76-0.92). Provides no measurement model explaining why strategies work — G-MFRM provides the explanatory framework."
    verified: false
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  uda2026:
    title: "UDA: Unsupervised Debiasing Alignment for Pair-wise LLM-as-a-Judge"
    authors:
      - "Zhang, Y."
      - "Wang, C."
      - "Wu, L."
      - "Yu, W."
      - "Wang, Y."
      - "Bao, G."
      - "Tang, J."
    year: 2026
    venue: "AAAI"
    arxiv_id: "2508.09724"
    bibtex_key: "uda2026"
    category: "judge_bias_correction"
    role: "baseline"
    relevance: "Neural K-factor adjustment reducing inter-judge std by 63.4%. Black-box neural approach vs G-MFRM's interpretable psychometric approach. Key baseline for judge bias correction."
    verified: true
    added_by: "director"
    added_at: "2026-05-21T16:40:00Z"

  constat2024:

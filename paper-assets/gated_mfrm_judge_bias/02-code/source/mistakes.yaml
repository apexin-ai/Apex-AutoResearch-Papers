  prevention: 'After any Worker reports a performance-critical fix as done, ALWAYS
    verify independently: (1) check file modification timestamps, (2) check process
    PIDs changed, (3) measure actual throughput. Never trust self-reported speedup
    numbers without Reviewer or Director verification.'
  status: active
  fix: 'Re-dispatch with explicit commands. The fix is trivial: restart collect.py
    with --workers 10 flag (already supported).'
  related_decisions:
  - D033
- id: M022
  date: '2026-05-23'
  category: experiment_design
  severity: high
  summary: Worker reduced vLLM max-model-len from 8192 to 4096 as "optimization",
    causing systematic data loss on all long prompts for 3 local judges
  root_cause: Worker changed vLLM config without understanding that arena_hard pairwise
    judge prompts routinely exceed 4096 tokens (prompt + 2 model responses + judge
    instruction). Long prompts hit 400 errors, retried 3x, then skipped — creating
    non-random data gaps biased toward complex items.
  prevention: Never reduce max-model-len without first checking the actual prompt
    length distribution of the dataset. For any config "optimization", verify it doesn't
    silently drop data by checking error logs after 5 minutes of running.
  status: active
  fix: Restart vLLM with max-model-len=8192 (original value), then restart collect.py
    to re-collect skipped items (resume-safe).
  related_decisions:
  - D033
  - D034
  - D035
- id: M023
  date: '2026-05-23'
  category: agent_behavior
  severity: medium
  summary: 'M023: Worker 用已有 response 文件拼 N=17 config，模型集与 rtx6000-4x 不一致'
  root_cause: autodl-8gpu contingency 部署时，Worker 基于本地已有的 response 文件创建了 14-model configs（含
    claude-opus-4.7, gpt-5.5 等非 N=17 模型），而非使用 rtx6000-4x 定义的真正 18-model N=17 列表。Director
    指令中未明确列出完整模型清单。
  prevention: 跨服务器 contingency 部署时，Director 必须在指令中明确列出完整模型清单（枚举所有模型名），不能让 Worker 自行推断或基于本地文件拼凑。
  status: active
  fix: urgent_agent_message 发送完整 18 模型列表，要求 kill 并重建 configs 后重启。
  related_decisions:
  - D036
- id: M024
  date: '2026-05-24'
  category: resource_misuse
  severity: medium
  summary: Mistral-Large-2 部署未预先验证磁盘空间，导致下载中途磁盘将满
  root_cause: 批准磁盘清理时只算了清理后 72G free > 60G 模型大小，但忽略了：(1) HF cache 可能创建副本占用额外空间；(2)
    4 个并发 snapshot_download 进程 + 1 个 aria2c 同时下载，竞争空间；(3) Agent 清理的是根分区文件（Mistral-7B
    14G + Qwen2.5-7B 15G + pip cache 4G），但 Mistral-Large 下载目标在数据盘 /root/autodl-tmp/，两个盘的空间不互通
  prevention: 大模型下载前必须：(1) 确认目标盘（非根分区）剩余空间 > 模型大小 × 1.5（预留 HF cache + 临时文件）；(2) 只用单一下载方式（aria2c
    或 snapshot_download，不要同时启动多个）；(3) 下载前 df -h 目标盘，不要假设清理其他盘就够了
  status: active
  context: 批准 Agent 部署 Mistral-Large-2-AWQ 到 autodl-8gpu cuda:3。Agent 报告清理后 72G free，但实际数据盘
    250G 只剩 16G（94% 用量）。模型下载 9/14 shards 后即将磁盘满。
  fix: Kill 冗余 snapshot_download 进程，清理 HF cache 副本，释放空间后继续 aria2c 下载
- id: M025
  date: '2026-05-24'
  category: agent_behavior
  severity: medium
  summary: Mistral 部署连续 3 个 Worker 标记 done 但 collection 从未启动
  root_cause: deploy 脚本分段设计（下载→vLLM→exit），collection 作为独立步骤没有被任何脚本自动触发。Worker 执行完
    deploy 脚本后就标记 done，没有验证端到端流水线是否完成。Director 指令没有明确要求"collection 产出数据后才能标记 done"。
  prevention: 多阶段部署任务必须：(1) 在 Worker 指令中明确 done 标准（"输出目录有数据写入"而非"脚本退出"）；(2) 写一体化脚本覆盖全流程（下载→部署→collection→验证），而非拆分成独立步骤交给不同
    Worker；(3) 如果必须拆分，每个 Worker 的退出条件必须是下一步的启动前提已就绪
  status: active
- id: M026
  date: '2026-05-24'
  category: code_bug
  severity: high
  summary: deploy_mistral_vllm.sh 竞态条件：主下载 PID 退出后验证 shards 时并行 aria2c 的 .aria2 文件还在，误判下载失败，vLLM
    从未启动，cuda:3 空转 3h+
  root_cause: deploy 脚本只监控主下载 PID，但 shard 13 有独立 aria2c 并行下载。主进程先退出 → deploy 验证时发现
    .aria2 残留 → exit 1。实际上该 shard 几分钟后下载完成。脚本缺乏重试/等待逻辑。
  prevention: 多进程下载场景：(1) 验证脚本应检查所有下载 PID 是否退出，而非只监控一个；(2) 发现 .aria2 残留时等待 N 分钟而非直接
    exit 1；(3) 或者完全避免多进程下载同一模型——单进程 + resume 更可靠。部署失败后应有告警机制（而非静默退出让 GPU 空转）。
  status: active
  context: Mistral-Large-2-AWQ 部署到 cuda:3。deploy 脚本在 06:23 UTC 误判失败退出，vLLM 从未启动。auto_start_mistral_collect.sh
    永久卡在轮询 port 8003。cuda:3 空转至发现时已 3+ 小时。
  fix: 手动启动 vLLM，绕过 deploy 脚本
- id: M027
  date: '2026-05-24'
  category: agent_behavior
  severity: medium
  summary: Worker 连接 rtx6000-4x（已不可达）而非 autodl-8gpu 执行路径修复任务
  root_cause: 项目有两台服务器配置，Worker 默认选了 rtx6000-4x（已断连），未根据数据实际所在位置选择 autodl-8gpu
  prevention: 派 Worker SSH 任务时明确指定目标服务器，尤其当项目有多台服务器且部分不可达时。Director 指令中应写明 server=autodl-8gpu
  status: active
- id: M028
  date: '2026-05-24'
  category: agent_behavior
  severity: medium
  summary: Reviewer 用 ps aux 全量输出检查进程，输出截断导致误判 sonnet collect.py 已崩溃
  root_cause: ssh_read_only 对 ps aux 输出有字符截断限制，进程多时目标 PID 恰好在截断区域内，导致误判进程不存在
  prevention: 检查特定进程存活用 ps -p PID 精确查询，不用 ps aux 全量输出。Reviewer 和 Worker 都适用此规则
  status: active
- id: M029
  date: '2026-05-24'
  category: agent_behavior
  severity: medium
  summary: Worker 报告 local judge 吞吐量偏低 3-4x（LLaMA 3.2→11/min, Qwen 2.2→10/min），导致
    ETA 严重高估
  root_cause: Worker 可能混淆了 per-worker 速率与总吞吐量，或测量窗口太短捕获了 burst/cold-start 而非稳态。未用可靠方法（如
    wc -l 间隔对比）验证。
  prevention: 测量吞吐量时用 wc -l 间隔 ≥1min 对比记录数，取至少 2 次测量的平均值。不要依赖单次瞬时观测或进程内 log 推算。
  status: active
  context: exp-020 N=17 judge eval. Worker 报告 LLaMA 3.2/min, Qwen 2.2/min → ETA 3.5d/5.3d。Reviewer
    独立测量 LLaMA ~11/min, Qwen ~10/min → ETA 25h/28h。偏差导致 Director 差点做出 kill local judges
    的决策。
  fix: Reviewer 独立验证纠正。D043 决策基于 Option C（保留所有 judges）幸好未受影响。
  related_decisions:
  - D043
- id: M030
  date: '2026-05-24'
  category: agent_behavior
  severity: medium
  summary: Worker 第二次报告错误吞吐量：声称 TP=2 达到 35/min (LLaMA) 和 25/min (Qwen)，实际 ~11/min
    和 ~7-8/min
  root_cause: 可能测量了 restart 后的 burst 而非稳态速率。与 M029 同类问题——未用 wc -l 间隔法验证，尽管已明确要求。
  prevention: 吞吐量报告必须用 wc -l 间隔 ≥2min 取至少 2 次测量的平均值。禁止报告 burst/瞬时速率。第三次犯同类错误需要在 collect.py
    中内建速率统计（每 5min 自动输出 throughput）。
  status: active
  context: TP=2 重启后 Agent 声称 11x 提升，实际持平或下降。Director 向用户汇报了错误的 11x 数据。
  related_decisions:
  - D043
- id: M031
  date: '2026-05-24'
  category: resource_misuse
  severity: medium
  summary: TP=1 恢复指令导致 Qwen 吞吐下降 49%，释放的 GPU 空闲无用
  root_cause: 决定恢复 TP=1 释放 GPU 给 MCMC 时，未分析 MCMC 实际启动时间（需等 API judges 完成 >12h）。释放的
    cuda:2/3 无任务可用，纯浪费。同时多次反复发送矛盾指令（TP=1→撤回→又执行 TP=1），Agent 被 whipsaw。
  prevention: 变更 GPU 配置前必须回答两个问题：(1) 释放的 GPU 什么时候、被什么任务使用？(2) 变更的吞吐成本 vs 释放 GPU 的收益，量化比较。如果释放的
    GPU 在当前任务完成前无人用，不要释放。此外，发送撤回指令前先确认 Agent 是否已开始执行，避免连续矛盾指令。
  status: active
  context: D043 计划 MCMC 在 Sonnet+Qwen3-235B 完成后启动。当时 Sonnet 57.9%、Qwen3-235B 44.2%，ETA
    >12h。Local judges TP=2 仅需 5-6h，TP=1 需 11.5h。TP=1 释放的 GPU 空闲 >6h。
  fix: 恢复 TP=2 + workers=64 配置，预期 Qwen 吞吐恢复到 ~38.8/min。
- id: M032
  date: '2026-05-25'
  category: code_bug
  severity: high
  summary: MCMC 脚本无增量保存，外部 kill 导致 7h 工作全部丢失
  root_cause: run_n17_phase1.py 设计为所有 4 个 method 完成后才统一写输出。进程在 joint_gmfrm chain 3/4
    采样 90% 时被外部 kill（非 OOM），导致 raw_average + mfrm_only + sequential 三个已完成 method 的结果也一并丢失。
  prevention: 长时间 MCMC/训练脚本必须在每个 method/stage 完成后立即保存中间结果（checkpoint）。新脚本 run_n17_phase1_robust.py
    已修复。通用规则：任何预计 >1h 的计算任务，必须有 checkpoint 机制。
  status: active
  context: exp-020 N=17 MCMC Phase 1, PID 614592 on rtx6000-4x GPU 0. 外部 kill 原因未查明。
  fix: Agent 用 run_n17_phase1_robust.py 重启（PID 2598），每个 method 完成后立即保存。
- id: M033
  date: '2026-05-25'
  category: code_bug
  severity: medium
  summary: tqdm + nohup 日志 buffer 导致 11h+ 无法监控 MCMC 进度
  root_cause: tqdm 使用 \r (carriage return) 更新进度条，nohup 重定向到文件时 OS I/O buffer 不 flush，导致日志文件停止更新。进程实际正常运行但完全盲区。
  prevention: 启动长时间脚本时：1) 用 python -u (unbuffered stdout)；2) tqdm 设置 file=sys.stderr；3)
    脚本内周期性写 \n 到日志。或者用 stdbuf -oL 强制行缓冲。
  status: active
  context: exp-020 MCMC Phase 1 v2, PID 2605, run_n17_phase1_robust.py。日志文件 exp020_mcmc_phase1_v2.log
    最后更新在 mfrm_only chain 1 warmup 27%。

- id: M003
  date: '2026-05-21'
  category: communication
  severity: high
  summary: Dream R2 分数报告错误：Best/Median 变化方向搞反，导致决策逻辑基于错误事实
  root_cause: 审稿报告标题写 "Best 3.5 Borderline Conference / Median 2.5 Borderline Findings"，Director
    未交叉核实 review_report.md 原文，直接采信标题摘要。实际 Best=3.0, Median=3.0（标题中的 3.5 和 2.5 可能是报告格式问题或
    Director 读取了错误位置的数据）。
  prevention: 收到 Dream/Review 分数时，必须从 review_report.md 原文中逐 tier 交叉核实评分，不依赖消息标题或摘要。特别是多
    tier 报告，先列出 R1 分数再列 R2 分数做 diff，确认变化方向。
  status: active
  context: Dream R2 (dream_20260521T215715) 审稿报告。标题显示 Best=3.5/Median=2.5，实际 Best=3.0/Median=3.0。Director
    基于错误分数向用户和 Reviewer 报告了"Best 持平, Median 降 0.5"，实际是"Best 降 0.5, Median 持平"。核心影响：Best
    下降意味着 novelty 天花板问题，比 Median 下降更严重。
  fix: Reviewer 核实后指出错误。基于修正分数重新评估决策：novelty 天花板是结构性问题，需通过 identifiability analysis
    和 formal e_i uncertainty treatment 补充技术贡献。
  related_decisions:
  - D005
- id: M004
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: exp-009 旧进程未正确终止：kill 了 shell 父进程 (PID 54679) 但 Python 子进程 (PID 54684)
    仍在运行，导致双进程 GPU 竞争
  root_cause: Worker 用 kill 终止了 nohup 的 shell 进程但未验证 Python 子进程是否也被终止。nohup 启动的命令中，shell
    是父进程，python3 是子进程，kill 父进程不一定终止子进程。
  prevention: 后续 kill 进程时：(1) 用 pkill -9 -f 按命令名杀所有匹配进程 (2) kill 后必须用 ps aux | grep
    和 nvidia-smi 双重验证 (3) 不要只 kill 父进程 PID，确认 Python 子进程也被终止
  status: active
  context: exp-009 修复 bias_slope 后重启时，Worker 报告 kill PID 54679 成功，但实际 Python 进程是 PID
    54684。新旧进程同时跑在 cuda:0 上，占满 97034/97887 MiB 显存，速度严重下降（426s/seed vs 正常 219s/seed）。
  fix: urgent_agent_message 指令 kill -9 54684 + 双重验证
- id: M005
  date: '2026-05-22'
  category: agent_behavior
  severity: medium
  summary: Worker 下载大模型时在 session 内阻塞轮询 .incomplete 文件，耗尽 context window
  root_cause: Worker 用 ssh_read_only 反复 ls -lh *.incomplete 检查下载进度，数十次相同调用消耗了整个 context
    window，且 model-00001 分片 stall 后无超时退出机制
  prevention: 大文件下载必须用 nohup 后台执行 + 低频轮询（间隔 ≥60s），且设置最大轮询次数上限。参考 ssh-env-setup 规范的"大包超时处理"章节。Worker
    派单时 Director/Agent 应在指令中明确要求 nohup 模式。
  status: active
  context: worker_ssh_qwen_download_vllm_cuda3_20260522T011845 下载 Qwen2.5-72B-Instruct-AWQ，10/11
    分片成功但 model-00001 stall 在 100M。Worker 反复轮询导致 context 耗尽而 failed。
  fix: 清理 .incomplete 文件后用 nohup 重下 model-00001 分片，已派 Agent 执行修复。
- id: M006
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: generate_vllm_online.py MAX_TOKENS=4096 导致 qwen/mistral 500条 response 全部
    ERROR，假进度 395/500 实际全是错误
  root_cause: MAX_TOKENS=4096 与 vLLM max-model-len=4096 相同，没有空间给 input tokens。qwen/mistral
    全部返回 500 ERROR 但被计为已完成，导致进度条显示 395/500 实际无有效数据。Llama (max-model-len=8192) 能工作但极慢(5
    tok/s)因无并发+judge竞争GPU。
  prevention: 1. Response 生成脚本的 MAX_TOKENS 必须显著小于 vLLM max-model-len（至少留 50% 给 input）。2.
    生成脚本应校验返回内容，ERROR response 不计入进度。3. 进度汇报时应区分有效/错误条目数，不能只看文件行数。
  status: active
  context: exp-001 target model response generation。qwen2.5-72b 和 mistral-large-2
    的 vLLM 都用 max-model-len=4096 启动，generate_vllm_online.py 设 MAX_TOKENS=4096。Worker
    和 Agent 多次汇报 395/500 完成度，实际全是错误。直到 Director 追问 Llama 为何只有 9/500 时 Worker 才诊断出根因。
  fix: MAX_TOKENS 4096→2048，添加 32 workers 并发，删除错误 responses 重新生成。Llama 速度 5→83 tok/s
    (16x提升)。

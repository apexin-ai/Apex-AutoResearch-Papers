- id: M010
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: exp-003 因 numpyro.set_platform("cuda") 导致 JAX I/O callback 崩溃，4 GPU 空跑
  root_cause: numpyro.set_platform("cuda") 禁用了 CPU 设备，但 NumPyro MCMC 的 I/O callback
    需要 CPU。Blackwell GPU 上 JAX 行为可能与老卡不同（mvp_003 在 rtx6000 上未触发此问题）。Agent 启动后未验证进程存活和
    GPU 占用。
  prevention: 1. JAX 多设备环境始终用 JAX_PLATFORMS=cpu,cuda 而非 numpyro.set_platform("cuda")。2.
    长时间 MCMC 启动后必须等 60s 确认：进程 PID 存活 + nvidia-smi 显存分配 + run.log 无异常。3. Cron 监控应在首次检查时验证进程存活，而非只等完成回调。
  status: active
  context: exp-003 在 autodl-8gpu 4×RTX PRO 6000 Blackwell 上崩溃。XLA 编译阶段 JAX 尝试将 I/O
    callback 放到 CPU 设备但找不到。4 GPU 空闲时间约 30min+。
  fix: '改 run_exp003.py: os.environ["JAX_PLATFORMS"] = "cpu,cuda" 替代 numpyro.set_platform("cuda")'
  related_decisions:
  - D016
- id: M011
  date: '2026-05-22'
  category: code_bug
  severity: medium
  summary: JAX_PLATFORMS 在 Python os.environ 中设置无效——JAX 在 import 时已读取平台配置
  root_cause: JAX 在 `import jax` 时就读取 JAX_PLATFORMS 环境变量初始化后端。在 Python 脚本内用 os.environ
    设置时 JAX 已 import 完成，设置被忽略。必须在 shell 层面 export BEFORE 启动 Python 进程。
  prevention: JAX 环境变量（JAX_PLATFORMS, XLA_FLAGS 等）必须在 shell 层面设置（export 或 inline env），不能在
    Python 脚本内用 os.environ。通用规则：任何在 import 阶段读取的环境变量都要在进程启动前设置。
  status: active
  fix: '改用 tmux 启动时 inline export: tmux new-session -d -s exp003 "export JAX_PLATFORMS=cuda,cpu
    && python run_exp003.py ..."'
- id: M012
  date: '2026-05-22'
  category: experiment_design
  severity: medium
  summary: exp-003b MCMC 运行时间预估严重偏低（预估 2.1h，实际 6h+ 未完成）
  root_cause: 基于 chain 1 early warmup 的 4.17 it/s 估计全程速度，未考虑：(1) NUTS 每次迭代命中 max tree
    depth 1023（c_n·e_i 乘法项导致后验几何复杂），每步 1023 leapfrog steps 极其昂贵；(2) warmup 从 2000
    增加到 4000 后总迭代量翻倍；(3) early warmup 阶段 step size 大、tree depth 浅，速度不代表 adapted 后的真实速度
  prevention: MCMC 运行时间预估应基于 adapted step size 后的速度（warmup 后半段），不能用 early warmup 速度。含乘法/bilinear
    项的模型预期会命中 max tree depth，应预设 SVI warm-start 或降低 max_tree_depth。预估时间应乘以 3x safety
    factor。
  status: active
  context: exp-003b HalfNormal prior MCMC on autodl cuda:0, warmup=4000 samples=4000
    chains=4. 启动于 May 23 01:40 CST, 至 ~07:40 CST 仍未完成，output 目录为空。
  fix: 紧急指令已发给 Agent：tmux capture-pane 诊断当前 chain 进度。如仍在 chain 1-2，执行 Plan B（SVI init
    + 降 warmup 到 2000 + 可能降 max_tree_depth 到 8）。
  related_decisions:
  - D017

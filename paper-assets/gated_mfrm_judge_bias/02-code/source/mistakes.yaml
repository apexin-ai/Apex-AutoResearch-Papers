- id: M018
  date: '2026-05-23'
  category: code_bug
  severity: medium
  summary: exp-017 CPU→GPU migration overwrote early seeds, invalidating previously
    reported c_n coverage 58.3%
  root_cause: exp-017 initially started on CPU (JAX_PLATFORMS="cpu"), was killed and
    restarted on GPU. The GPU run re-computed seeds from 0, overwriting the CPU-generated
    results. The 58.3% c_n coverage cited in the paper came from CPU-run early data
    that no longer exists. Reviewer independently confirmed seeds 0-15 now yield 63.3%
    (not 58.3%).
  prevention: 'When restarting experiments after platform migration: (1) Back up existing
    results before overwriting. (2) Start from the next unfinished seed, not seed
    0. (3) After migration, re-verify any numbers already cited from early data.'
  status: active
  fix: Updated paper to use 49-seed data (c_n coverage 67.9%, θ coverage 90.1%) from
    Reviewer's independent calculation.
- id: M019
  date: '2026-05-23'
  category: code_bug
  severity: high
  summary: LOO ΔELPD reported as -60.0 in paper was ArviZ display truncation artifact;
    precise value is -55.7
  root_cause: 'ArviZ 1.1.0 az.compare() truncates ELPD values to tens place for display
    (e.g., -2272.59→-2270, -2328.28→-2330). The original script reported the truncated
    display difference (-60.0) rather than computing the precise pointwise difference
    (55.7). The waic_loo_summary.json also had a separate bug: delta_elpd_loo=0.0
    due to ArviZ 1.x API name change (elpd_loo→elpd).'
  prevention: 'When reporting ArviZ model comparison metrics: (1) Always use pointwise
    elpd differences, not display-formatted values from az.compare() DataFrame. (2)
    Verify saved JSON values against fresh computation. (3) Cross-check: |Δ/dSE| computed
    from reported values should match az.compare()''s internal calculation.'
  status: active
  fix: 'Updated abstract and experiments.tex: ΔELPD -60.0→-55.7, |Δ/dSE| 6.4→5.9.
    Qualitative conclusion unchanged (5.9 >> 2 threshold).'
- id: M020
  date: '2026-05-23'
  category: experiment_design
  severity: high
  summary: N=17 judge evaluation launched with workers=1 despite collect.py supporting

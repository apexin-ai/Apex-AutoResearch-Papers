- id: M009
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: exp-003 模型缺少 sigma_c 全局尺度参数，NCP 层级收缩失效，c_n 全部偏高
  root_cause: Worker 从 MVP 模型迁移到 exp-003 时遗漏了 sigma_c 参数。MVP models_v3.py 有完整的 sigma_c
    + c_raw * sigma_c NCP 结构，但 exp-003 models.py 只复制了 c_raw 部分。代码审查未在编码阶段捕获。
  prevention: 从 MVP/已验证代码迁移到新实验时，必须逐行 diff 模型定义，确保所有参数和层级结构完整保留。实验代码 dry-run 后应检查参数后验分布是否合理（如
    c_n 应为 zero-inflated），而非仅检查代码是否报错。
  status: active

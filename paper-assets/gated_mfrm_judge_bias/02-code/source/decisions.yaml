- id: D018
  date: 2026-05-22 18:36 UTC
  summary: OVB framing 调整：从 "d_j-c_n confounding" 转为 "contamination as omitted variable"
  rationale: exp-009 初步数据（178/200 seeds）显示 sequential estimator 的 bias_slope 在 ρ=0.0~0.9
    范围内持平（~0.19-0.20），没有随 confounding 强度单调递增。这说明偏差主要来源不是 d_j 和 c_n·e_i 的 confounding，而是根本不建模
    c_n·e_i（omitted variable）。即使 ρ=0（无 confounding），sequential 方法因忽略 contamination
    交互项已有 ~0.19 的 bias。Joint G-MFRM 在所有 ρ 水平上 bias_slope 都很低（~0.06-0.08，降低 ~70%）。论文
    Section 2 的 OVB framing 需要从 "confounding drives bias" 调整为 "omitted variable drives
    bias, confounding is secondary amplifier"。这实际上是更强的 argument——G-MFRM 在任何情况下都必要，不仅在
    confounding 存在时。
  related_experiments:
  - exp_id: exp-009
    role: evidence
    result: bias_slope flat across ρ, joint 70% lower
  depends_on:
  - D017

    contamination gating is 68% of degradation and MFRM severity is 32%; (3) Variant
    B tighter prior σ_c=0.3 gives τ=0.794, identical to original → prior tuning ineffective.
    Root cause is 183/500 items lacking exposure estimates, causing gating to be half-blind
    and c_n to be amplified. Fix: v3 MCMC using only the 317 items with valid exposure
    estimates. This also fixes the MFRM severity degradation since these items are
    better calibrated. Method works on synthetic data where exposure is fully known
    (exp-015/018), confirming this is a data quality issue not a method flaw.'

  summary: WAIC/LOO-CV 决定性支持 G-MFRM：ΔELPD=-60, |Δ/dSE|=6.4，作为 MF-3 核心回应写入论文
  rationale: Bootstrap Δτ CI 包含 0（MF-3 审稿 critical），但 LOO-CV 模型比较提供了 decisive evidence：ΔELPD_LOO=-60.0
    (SE=9.4)，|Δ/dSE|=6.4 远超 2.0 阈值，stacking weight G-MFRM=1.0。Pareto k<0.7 确认估计可靠。这证明

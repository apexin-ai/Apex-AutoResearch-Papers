    arena_hard_subset_low_contamination_tau_mfrm: 0.87
    runtime_seconds: 8400
    mcmc_warmup: 2000
    mcmc_samples: 4000
    mcmc_chains: 4
  result_rationale: 'Median档的核心特征在此实验集中体现。c_n median=0.48落在[0.3, 0.8)区间， 接近mvp_001的weak
    contamination而非mvp_003的strong contamination。 22个模型中13个有c_n > 0.3（moderate），仅4个有c_n
    > 0.8（heavy）， 说明contamination普遍存在但幅度有限。 Stage 3收敛需要调优：R̂=1.07（≤1.10但不ideal）、ESS=142（≥100但远低于mvp_003的224），
    12个divergent transitions提示geometry有困难但未破坏inference。 这是因为moderate contamination意味着c_n的posterior更diffuse（数据对c_n的约束力较弱），
    MCMC更难探索。Kendall-τ=0.87落在[0.84, 0.9]范围，比raw average显著提升但不dramatic。 低contamination子集上G-MFRM与MFRM几乎无差异（0.88

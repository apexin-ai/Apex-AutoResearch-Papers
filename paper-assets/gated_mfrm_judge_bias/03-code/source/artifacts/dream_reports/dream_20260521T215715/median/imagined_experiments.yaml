- name: gmfrm_real_data_fit
  plan_id: exp-003
  description: '在exp-001/002的real data上拟合G-MFRM三阶段pipeline。 Stage 1: MFRM估计(θ,b,d)。Stage
    2: 固定exp-002的e_i。Stage 3: Joint gated model。 输出fair scores θ̂并与Chatbot Arena Elo对比。

    '
  expected_results:
    stage1_max_rhat: 1.02
    stage1_min_ess: 380
    stage3_max_rhat: 1.07
    stage3_min_ess: 142
    stage3_divergent_transitions: 12
    theta_range:
    - -1.8
    - 2.1
    d_j_range:

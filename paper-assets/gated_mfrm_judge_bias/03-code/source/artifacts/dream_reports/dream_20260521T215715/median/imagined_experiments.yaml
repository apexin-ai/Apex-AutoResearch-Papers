    Δτ=+0.02 vs CyclicJudge+discard（best baseline），p=0.073——borderline significant。
    这是因为moderate contamination意味着contamination correction的marginal value有限： CyclicJudge+discard已经通过丢弃high-exposure
    items移除了大部分contamination signal， G-MFRM的优势在于保留这些items的information（不丢弃）而非dramatically改变ranking。
    vs sequential (p=0.018) 和 vs raw (p=0.001) 则显著，因为这些baseline完全不处理contamination。

  result_rationale: 'Median档假设real contamination moderate，因此e_i分布右偏但不极端：大部分items（~82%）的e_i
    < 0.5， 仅少数items（~18%）有明显的contamination exposure。这与"contamination exists but is
    moderate"一致。 Primary source（performance gap）覆盖率100%且信号最强；temporal source覆盖率有限（仅45%的items有
    pre/post-cutoff变体），但与primary的相关性中等（r=0.58）。LogProber覆盖率55%（仅有logprob API的模型），
    且与primary相关性较弱（r=0.41）——这是median档的关键特征之一："one source contributes little"。 内部一致性α=0.62反映了三源信号的中等coherence，足以构建可用的composite但不overwhelming。
    ConStat验证ρ=0.52落在[0.4, 0.7)范围内，表明fitted c_n与外部contamination measure有中等agreement。

    '

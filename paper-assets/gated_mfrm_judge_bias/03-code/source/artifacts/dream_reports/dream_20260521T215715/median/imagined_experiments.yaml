- name: item_exposure_estimation
  plan_id: exp-002
  description: '三源pipeline估计per-item exposure e_i。Primary source: 原始vs改写变体的performance
    gap； Temporal: pre/post-cutoff变体gap；LogProber: token logprob memorization scores。
    加权组合后用ConStat per-model delta做外部验证。

    '
  expected_results:
    num_items_mt_bench: 80

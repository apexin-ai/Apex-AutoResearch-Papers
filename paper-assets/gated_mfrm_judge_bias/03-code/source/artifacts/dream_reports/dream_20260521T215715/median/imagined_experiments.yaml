tier: median
narrative_guidance: 'Tier B narrative. Real contamination is detectable but moderate
  (c_n median ~0.5). G-MFRM ranking improvement over best baselines is statistically
  significant but practically modest (+2-3pp Kendall-τ). Pivot primary contribution
  to diagnostic/interpretability outputs: per-model c_n as training data audit tool,
  per-item e_i for item retirement decisions, per-judge d_j for judge selection guidance.
  Lead argument: ''Sequential methods provide no visibility into whether corrections
  are needed — G-MFRM provides both correction and diagnosis.'' Forward-looking: as
  contamination grows, joint estimation becomes critical. May need exp-010 (WildBench)
  to strengthen empirical package with a third benchmark.

  '

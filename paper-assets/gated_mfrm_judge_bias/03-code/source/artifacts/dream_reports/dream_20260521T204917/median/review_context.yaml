    row_count: 12
  figures_description:
  - 'Fig S6: Wright map showing θ, b, d distributions on common logit scale'
  - 'Fig S7: lz vs c_n scatter plot, r=0.52, 标注misfit models'
  analysis: 'c_n的18% misfit率和rank-1 violation rate 14%是需要在limitations中讨论的。 这不invalidate结果但限制了对individual
    c_n estimates的over-interpretation。 建议论文：(1) 报告misfit统计作为transparency；(2) 将c_n解释为"contamination
    tendency" 而非精确量化；(3) 指出rank-k扩展作为future work。 lz-c_n相关性0.52是适中的——足以支持construct
    validity但不足以claim equivalence。

    '
- name: confounding_formal_proposition
  plan_id: exp-009
  description: '推导sequential estimator在d_j与c_n·e_i非正交条件下的一阶bias近似， 通过Monte Carlo在realistic参数范围上验证bias

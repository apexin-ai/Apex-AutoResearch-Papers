    first_order_approx_correlation_with_true_bias: 0.91
    bias_magnitude_median_at_rho_0.1: 0.018
    bias_magnitude_median_at_rho_0.2: 0.041
    bias_magnitude_median_at_rho_0.3: 0.072
    monte_carlo_n_conditions: 540
    monte_carlo_reps_per_condition: 200
    proposition_applies_pct_realistic_range: 89
  result_rationale: 'Formal proposition在97%的Monte Carlo条件下正确预测bias方向—— 这是该proposition的核心价值：即使magnitude不大，direction是确定的。
    一阶近似与真实bias的相关性0.91说明近似质量高。 Median档的confounding ρ在0.1–0.3，对应bias magnitude 0.018–0.072，
    这解释了为什么实证增益中等（bias存在但不大）。 89%的realistic parameter range满足proposition条件（正则性条件在极端参数下可能违反）。
    这个结果的论文价值在于：即使exp-004的empirical Δτ只有0.02， proposition证明了sequential estimator在理论上是biased的，方向可预测。

    '
  tables:

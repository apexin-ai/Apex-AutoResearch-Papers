    realistic range'
  - 'Fig S8: Monte Carlo bias distributions at ρ=0.1, 0.2, 0.3, 显示bias非对称分布'
  analysis: '这是median档下最重要的补充论证。当empirical gains中等时， formal proposition提供"方法论上正确"的保证，独立于效应量大小。
    论文Section 2应以toy example + proposition开头，在reader看到实验结果前 就建立"联合估计是唯一asymptotically无偏的做法"的认知框架。
    89%的coverage在realistic range上足够——11%的failure cases对应极低contamination（c<0.1）， 此时bias本身negligible，不影响结论。

    '

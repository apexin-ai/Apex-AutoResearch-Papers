    (2) 强调c_n的cross-benchmark一致性（0.68–0.71）作为contamination estimates的validity evidence；
    (3) 将WildBench定位为"G-MFRM优雅退化的实证验证"而非"第三个胜利"。 Cross-benchmark c_n一致性是额外贡献：证明c_n捕捉的是真实的model-level属性。


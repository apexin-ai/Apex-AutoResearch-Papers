- name: adversarial_robustness
  plan_id: exp-011
  description: '按Wang et al. (ICLR 2026)的方法构造adversarial contamination， 测试G-MFRM在对抗性条件下的鲁棒性。

    '
  expected_results:
    adversarial_c_n_detection_rate: 0.68
    adversarial_tau_gmfrm: 0.82
    adversarial_tau_sequential: 0.78
    adversarial_delta_tau: 0.04
    adversarial_false_positive_rate: 0.12
    adversarial_rmse_degradation_vs_clean: 15
    adversarial_types_tested: 3
    paraphrase_attack_detection_rate: 0.45
    direct_memorization_detection_rate: 0.88
    partial_memorization_detection_rate: 0.62
  result_rationale: 'Adversarial条件下G-MFRM的优势反而更明显（Δτ=0.04 vs clean的0.02）， 因为adversarial
    contamination加大了confounding效应，放大了sequential的bias。 但detection rate仅68%——paraphrase
    attack（item被改写后memorize）最难检测（45%）， 因为ConStat的reference variant方法本身基于paraphrasing，与攻击机制重叠。
    Direct memorization检测率高（88%），因为信号明确。 False positive rate 12%在可接受范围但不低——意味着约12%的"干净"模型被错误标记为高c_n。
    RMSE在adversarial条件下相比clean场景退化15%，说明adversarial contamination 部分绕过了e_i estimation，限制了G-MFRM的校正能力。

    '
  tables:
  - name: 'Table S2: Adversarial robustness results by attack type'
    columns:
    - attack_type
    - detection_rate
    - gmfrm_tau
    - seq_tau
    - delta_tau
    - fpr
    row_count: 3
  figures_description:
  - 'Fig S10: ROC curves for contamination detection under three adversarial conditions'
  analysis: 'Adversarial结果揭示了G-MFRM的边界条件：paraphrase attack是核心弱点， 因为它破坏了ConStat的基本假设（原题与变体的性能差异反映memorization）。
    论文应在limitations中讨论此局限，并指出这不是G-MFRM特有的—— 任何依赖exposure indicator的方法都有同样的问题。 Positive
    takeaway: 即使在adversarial条件下，G-MFRM仍优于sequential（Δτ=0.04）， 说明joint estimation的结构性优势在更恶劣条件下反而更突出。'

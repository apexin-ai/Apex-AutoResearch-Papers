narrative_guidance: '论文主线从"confounding造成大量级系统性偏差"转向"联合估计是方法论上的正确做法"。 真实污染量级落在0.4–0.9区间，confounding效应存在但不如mvp_003合成数据中那样剧烈。
  G-MFRM在所有benchmark上一致优于sequential，但在某个benchmark（预计Arena-Hard）上差异不显著。 叙事重心：(1) formal
  proposition提供理论保证——即使实证增益中等，联合估计是asymptotically正确的； (2) per-model c_n的可解释性价值——contamination
  audit作为独立贡献； (3) G-MFRM在零污染时优雅退化为标准MFRM，不损失性能，因此"没有理由不用"。 Headline改为强调framework统一性和可解释性，弱化纯数字提升。

  '
imagined_experiments:
- name: multi_judge_data_collection
  plan_id: exp-001
  description: '8个judge（GPT-5.5, Claude Opus 4.7, Claude Sonnet 4.6, DeepSeek-V4-Pro,
    Qwen3-235B-A22B, Qwen3.6-27B, Llama 4 Maverick, Gemini 2.5 Pro） 在MT-Bench (80
    items)和Arena-Hard (500 items)上评估22个target models， position swap后总评估数约 8×(80+500)×22×2
    ≈ 203,520条。

    '
  expected_results:
    num_judges: 8
    num_target_models: 22
    num_items_mtbench: 80
    num_items_arenahard: 500
    total_evaluations: 203520
    position_bias_rate_avg: 0.12
    inter_judge_agreement_fleiss_kappa: 0.41
    judge_completion_rate: 0.97
    api_cost_usd: 820
    gpu_hours_used: 118
    missing_data_pct: 2.8
  result_rationale: '8个judge中5个开源+3个API，开源judge通过vLLM批处理效率高。 Fleiss kappa约0.41反映LLM
    judge间的典型一致性水平——比random高但远非完美， 这正是MFRM建模judge severity的前提条件。Position bias约12%是已知现象。
    缺失数据主要来自个别开源judge在长context item上的拒答或格式错误。 API成本低于$900预算因为批量调用有折扣。

    '
  tables:
  - name: 'Table A1: Judge metadata and completion statistics'
    columns:
    - judge
    - type
    - params
    - completion_rate
    - avg_score
    - position_bias_rate
    row_count: 8
  figures_description:
  - 'Fig S1: Inter-judge score correlation heatmap (8×8), 显示judge pair间Spearman-ρ分布在0.55–0.82'
  analysis: '数据规模充足，8个judge覆盖4个模型家族（OpenAI, Anthropic, Meta, Alibaba+DeepSeek）。 Inter-judge
    variance足够大（std跨judge约0.8–1.2分），为MFRM建模judge severity提供信号。 Position bias存在但通过swap平均后不影响后续分析。
    数据完整度97%+，缺失模式为MCAR，不影响模型估计。

    '
- name: constat_exposure_estimation
  plan_id: exp-002
  description: '对MT-Bench 80题和Arena-Hard 500题生成rephrased reference variants， 计算ConStat
    delta scores作为exposure indicator e_i， 结合temporal signals（benchmark发布日期 vs 模型训练截止日期）构建composite
    e_i。

    '
  expected_results:
    constat_rank_correlation_with_true_exposure: 0.74
    constat_delta_score_mean: 0.15
    constat_delta_score_std: 0.22
    high_exposure_items_pct_mtbench: 35
    high_exposure_items_pct_arenahard: 18
    reference_variant_human_equivalence_p: 0.23
    temporal_signal_correlation_with_constat: 0.48
    composite_e_i_reliability_alpha: 0.71
  result_rationale: 'Median档下ConStat估计质量中等（rank correlation 0.65–0.85，取中值0.74）。 MT-Bench作为更老的benchmark，exposure率更高（35%的item被显著记忆），
    Arena-Hard较新且题目更长，exposure率较低（18%）。 ConStat delta score均值0.15表示原题与rephrased版本间的平均性能差异不大但方向一致。
    Temporal signal与ConStat的相关性中等（0.48），说明训练数据时间线只是exposure的粗略代理。 Composite e_i的Cronbach
    α为0.71，处于"可接受"但非"良好"的心理测量学标准线上， 这意味着e_i估计中存在测量噪声，会传递到Stage 3的c_n估计中。

    '
  tables:
  - name: 'Table 2 (partial): Exposure indicator statistics by benchmark'
    columns:
    - benchmark
    - n_items
    - mean_e_i
    - std_e_i
    - pct_high_exposure
    - constat_reliability
    row_count: 2
  figures_description:
  - 'Fig S2: ConStat delta score distribution (histogram), 分benchmark显示，MT-Bench右偏更明显'
  - 'Fig S3: Temporal signal vs ConStat delta scatter, r=0.48, 显示粗略正相关但离散度大'
  analysis: 'e_i估计质量是整个pipeline的瓶颈之一。Median档下composite reliability 0.71意味着 约50%的variance是信号、50%是噪声。这会导致Stage
    3中c_n的shrinkage更强—— 模型倾向于将不确定的exposure归零，从而低估真实污染。 Arena-Hard的低exposure率意味着该benchmark上G-MFRM与sequential的差异会更小，
    因为contamination correction的空间本身就小。 Reference variant的human equivalence check通过（p=0.23
    > 0.05）， 支持ConStat方法论的有效性。

    '
- name: gmfrm_real_data_fit
  plan_id: exp-003
  description: '三阶段拟合：Stage 1 标准MFRM获得(θ,b,d)初始估计； Stage 2 接入exp-002的e_i；Stage 3 联合gated模型估计所有参数含c_n。
    NumPyro MCMC, warmup=2000, samples=4000, chains=4, NCP参数化。

    '
  expected_results:
    convergence_max_rhat: 1.06
    convergence_min_ess: 120
    convergence_pct_params_rhat_above_1.05: 8
    c_n_mean: 0.62
    c_n_std: 0.35
    c_n_range:
    - 0.08
    - 1.41
    theta_posterior_mean_std: 0.12
    kendall_tau_with_arena_mtbench: 0.86
    kendall_tau_with_arena_arenahard: 0.85
    spearman_rho_with_arena_mtbench: 0.89
    spearman_rho_with_arena_arenahard: 0.88
    runtime_hours: 3.2
    num_divergent_transitions: 12
  result_rationale: 'Median档下真实c_n均值落在0.4–0.9区间，取0.62。22个模型的c_n从0.08（几乎无污染的新模型） 到1.41（高度疑似泄露的模型）分布较广，反映现实中模型间污染程度差异大。
    收敛基本通过但不完美：92%的参数R̂<1.05，但约8%的参数（主要是个别c_n和高exposure item的交互项） R̂在1.05–1.08之间，ESS最低120。这是median档的典型特征——数据信号足以支撑模型但边际参数不够锐利。
    12个divergent transitions（占0.075%）在可接受范围内但需要报告。 Kendall-τ 0.86（MT-Bench）和0.85（Arena-Hard）落在median档的0.84–0.89区间内，
    表明G-MFRM fair scores与Arena human votes的一致性良好但非卓越。

    '
  tables:
  - name: 'Table 1: G-MFRM convergence diagnostics'
    columns:
    - metric
    - value
    - threshold
    - status
    row_count: 6
  figures_description:
  - 'Fig 2: Posterior c_n estimates with 90% CI for 22 models, 按c_n排序，标注known-contaminated
    models'
  - 'Fig S4: Trace plots for selected parameters (θ_top3, c_n_top3, d_j_all)'
  analysis: '模型收敛处于"基本通过但需要谨慎"的状态。R̂>1.05的参数集中在高c_n模型上， 这些模型的contamination信号来自噪声较大的e_i，posterior不够锐利。
    c_n均值0.62介于mvp_001（~0.5）和mvp_003（~1.5）之间但偏向低端， 说明真实污染存在但不如强假设那么普遍。 posterior c_n的排序与先验预期基本一致（已知训练数据可能包含benchmark的模型c_n更高），
    提供face validity。

    '
- name: baseline_comparison
  plan_id: exp-004
  description: '7个baseline + G-MFRM在MT-Bench和Arena-Hard上的系统比较。 Metrics: Kendall-τ,
    Spearman-ρ with Chatbot Arena, bootstrap 95% CI。

    '
  expected_results:
    mtbench_results:
      raw_average:
        kendall_tau: 0.78
        spearman_rho: 0.82
      mfrm_only:
        kendall_tau: 0.83
        spearman_rho: 0.86
      sequential_bias_first:
        kendall_tau: 0.84
        spearman_rho: 0.87
      sequential_contam_first:
        kendall_tau: 0.83
        spearman_rho: 0.86
      cyclicjudge:
        kendall_tau: 0.82
        spearman_rho: 0.85
      dcr_factor:
        kendall_tau: 0.81
        spearman_rho: 0.84
      uda:
        kendall_tau: 0.84
        spearman_rho: 0.87
      preference_leakage:
        kendall_tau: 0.8
        spearman_rho: 0.83
      gmfrm:
        kendall_tau: 0.86
        spearman_rho: 0.89
    arenahard_results:
      raw_average:
        kendall_tau: 0.76
        spearman_rho: 0.8
      mfrm_only:
        kendall_tau: 0.82
        spearman_rho: 0.85
      sequential_bias_first:
        kendall_tau: 0.83
        spearman_rho: 0.86
      sequential_contam_first:
        kendall_tau: 0.82
        spearman_rho: 0.85
      cyclicjudge:
        kendall_tau: 0.81
        spearman_rho: 0.84
      dcr_factor:
        kendall_tau: 0.8
        spearman_rho: 0.83
      uda:
        kendall_tau: 0.83
        spearman_rho: 0.86
      preference_leakage:
        kendall_tau: 0.79
        spearman_rho: 0.82
      gmfrm:
        kendall_tau: 0.85
        spearman_rho: 0.88
    delta_tau_gmfrm_vs_best_baseline_mtbench: 0.02
    delta_tau_gmfrm_vs_best_baseline_arenahard: 0.02
    wilcoxon_p_mtbench: 0.008
    wilcoxon_p_arenahard: 0.041
    num_benchmarks_significant_at_005: 2
    num_benchmarks_significant_at_001: 1
  result_rationale: 'Median档下G-MFRM优于所有baseline但优势幅度收窄（delta_tau 0.01–0.04，取0.02）。
    Best baseline在两个benchmark上分别是UDA（MT-Bench）和sequential_bias_first（Arena-Hard），
    反映不同benchmark特性：MT-Bench的judge bias更显著（UDA擅长），Arena-Hard的contamination更突出。 MT-Bench上p=0.008达到显著，Arena-Hard上p=0.041勉强显著——
    这符合median档"在某个benchmark上差异不够显著"的预期，Arena-Hard因exposure率低（18%） 导致contamination
    correction贡献有限。 CyclicJudge和DCR表现不如sequential，因为前者只处理bias、后者只处理contamination，
    而sequential至少尝试同时处理两者（虽然有confounding）。 raw_average最差，验证了校正的必要性。MFRM-only优于raw但不如含contamination校正的方法。

    '
  tables:
  - name: 'Table 3: Main results — method comparison across benchmarks'

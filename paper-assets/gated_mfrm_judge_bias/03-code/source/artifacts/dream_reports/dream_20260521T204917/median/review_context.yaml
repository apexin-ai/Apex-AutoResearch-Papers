  result_rationale: 'Judge severity (d_j) fit最好——8个judge的infit/outfit都在可接受范围（0.7–1.3），
    因为judge行为相对稳定。Item difficulty (b_i) fit良好，7%的misfit主要是多义性item。 Model ability (θ_n)
    有9%的misfit，对应contamination效应被rank-1 c_n·e_i近似不完美捕捉的模型。 Contamination (c_n) 的misfit最高（18%），outfit均值1.15偏高——
    说明rank-1假设对部分模型不够好（这些模型可能对不同item子集有不同的contamination pattern）。 lz与c_n的中等相关性（0.52）支持construct
    coherence：Stage 1检测到的person-misfit 确实与Stage 3估计的contamination相关，但不完全重叠（因为lz也受其他因素影响）。

    '
  tables:
  - name: 'Table 8: Facet fit statistics'

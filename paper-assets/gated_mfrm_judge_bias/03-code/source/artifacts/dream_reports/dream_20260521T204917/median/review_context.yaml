  - 'Fig 4: Bootstrap distribution of Δτ(G-MFRM − best baseline), 两个benchmark分开，显示MT-Bench分布远离零、Arena-Hard分布接近零'
  analysis: 'G-MFRM在两个benchmark上均排名第一，但优势幅度在Arena-Hard上接近噪声边界。 这要求论文叙事不能仅依赖数字提升。策略：
    (1) 强调联合估计的理论正确性——即使增益小，asymptotic bias direction是确定的； (2) 强调c_n的可解释性——baseline都不提供per-model
    contamination estimates； (3) 强调graceful degradation——当contamination≈0时G-MFRM不劣于MFRM-only。
    UDA是最强竞争对手，但它是black-box且不提供contamination信息。

    '
- name: contamination_magnitude_calibration
  plan_id: exp-005
  description: '将exp-003拟合的c_n与合成MVP假设对比，确定真实污染量级。 分析c_n分布、与模型已知属性（训练数据时间、开源vs闭源）的关系。

    '
  expected_results:
    real_c_n_mean: 0.62
    real_c_n_median: 0.51
    real_c_n_std: 0.35
    pct_models_c_n_above_1: 18
    pct_models_c_n_below_0.2: 23
    correlation_c_n_with_training_recency: -0.43
    correlation_c_n_with_model_size: 0.28
    closest_mvp_scenario: between mvp_001 and mvp_003, closer to mvp_001
    ks_test_vs_mvp001_p: 0.12
    ks_test_vs_mvp003_p: 0.003
  result_rationale: '真实污染量级落在mvp_001和mvp_003之间但偏向mvp_001。 c_n均值0.62 < mvp_003的~1.5但
    > mvp_001的~0.5。 分布右偏（mean > median），少数模型高度污染（18% c_n>1.0），多数模型轻度污染。 训练数据越新的模型c_n越低（r=-0.43），因为benchmark已被纳入decontamination流程。
    模型越大c_n稍高（r=0.28），可能因为大模型记忆能力更强。 KS检验显示分布与mvp_001不可区分（p=0.12）但与mvp_003显著不同（p=0.003），
    确认真实世界的contamination比mvp_003的强假设温和。

    '
  tables:
  - name: 'Table 5: Contamination magnitude comparison — real vs synthetic'
    columns:
    - scenario
    - c_mean
    - c_std
    - pct_above_1
    - tau_gmfrm
    - tau_seq
    - delta_tau
    row_count: 4
  figures_description:
  - 'Fig 5: c_n distribution overlay — real data vs mvp_001 vs mvp_003, 显示real data分布形态更接近mvp_001但右尾更厚'
  - 'Fig 6: c_n vs model training cutoff date scatter, 标注模型名称, r=-0.43'
  analysis: "这是论文叙事的关键转折点。真实污染偏弱意味着： (1) confounding效应量在实际中是中等的，不像mvp_003那样震撼——\n\
    \    但formal proposition保证了方向性，不依赖效应量大小；\n(2) 少数高c_n模型（如疑似泄露的模型）是G-MFRM最有价值的发现——\n\
    \    per-model contamination audit的实用价值超过平均指标提升；\n(3) 污染分布的异质性（右偏，少数高c_n）比均值本身更有信息量——\n\
    \    说明\"平均污染不严重但个别模型问题严重\"。\n论文应将此结果框架为\"contamination是长尾分布——均值小不意味着可以忽略\"。\n"
- name: judge_count_sensitivity
  plan_id: exp-006
  description: '从8个judge中随机抽样2/4/6/8个judge，重复拟合G-MFRM和sequential， 观察性能随judge数量的变化曲线。每个配置重复20次取平均。

    '
  expected_results:
    judges_2:
      gmfrm_tau: 0.8
      sequential_tau: 0.8
      delta_tau: 0.0
      convergence_pct_pass: 65
    judges_4:
      gmfrm_tau: 0.84
      sequential_tau: 0.82
      delta_tau: 0.02
      convergence_pct_pass: 85
    judges_6:
      gmfrm_tau: 0.85
      sequential_tau: 0.83
      delta_tau: 0.02
      convergence_pct_pass: 95
    judges_8:
      gmfrm_tau: 0.86
      sequential_tau: 0.84
      delta_tau: 0.02
      convergence_pct_pass: 100
    minimum_judges_for_significant_advantage: 4
    tau_saturation_point: 6
  result_rationale: '2个judge时信息不足以分离d_j和c_n·e_i——识别问题导致G-MFRM退化为接近MFRM-only， 与sequential无差异。收敛率仅65%因为参数过多、数据过少。
    4个judge是G-MFRM开始显著优于sequential的临界点，但优势很小。 6→8个judge时性能趋于饱和，增加更多judge的边际收益递减。 这个结果支持"G-MFRM需要至少4个judge"的实用建议，
    同时说明8个judge是足够的（无需追求更多）。 Median档下由于contamination信号本身中等，judge数量的要求不如强污染场景高。

    '
  tables:
  - name: 'Table 6: Judge count sensitivity analysis'
    columns:
    - n_judges
    - gmfrm_tau_mean
    - gmfrm_tau_std
    - seq_tau_mean
    - delta
    - p_value
    - convergence_rate
    row_count: 4
  figures_description:
  - 'Fig 7: Line plot — τ vs n_judges for G-MFRM and sequential, with shaded 95% CI,
    显示4-judge处两线开始分离'
  analysis: '实用价值高：为实践者提供了明确的资源-性能权衡指南。 4个judge是最低推荐配置，6个judge达到性能饱和。 这一结果也间接说明G-MFRM的contamination估计需要cross-judge信息——
    单judge或双judge场景下c_n与d_j不可分离，是模型设计的固有限制而非缺陷。 论文中可用此结果回应"评估成本太高"的reviewer concern。

    '
- name: exposure_indicator_ablation
  plan_id: exp-007
  description: 'Leave-one-out消融：从composite e_i中依次去除ConStat delta、temporal signal、LogProber
    Safe Score， 观察对G-MFRM最终性能的影响。

    '
  expected_results:
    full_composite:
      tau: 0.86
      c_n_rank_correlation_with_full: 1.0
    without_constat:
      tau: 0.83
      c_n_rank_correlation_with_full: 0.61
      tau_drop: 0.03
    without_temporal:
      tau: 0.85
      c_n_rank_correlation_with_full: 0.89
      tau_drop: 0.01
    without_logprober:
      tau: 0.85
      c_n_rank_correlation_with_full: 0.91
      tau_drop: 0.01
    constat_only:
      tau: 0.85
      c_n_rank_correlation_with_full: 0.82
    relative_importance_constat: 0.58
    relative_importance_temporal: 0.22
    relative_importance_logprober: 0.2
  result_rationale: 'ConStat是最重要的exposure indicator（相对重要度58%），去除后τ下降0.03， c_n排序与full
    composite的相关性骤降至0.61——说明ConStat提供了其他指标不可替代的item-level信号。 Temporal signal和LogProber各贡献约20%，去除任一后τ仅下降0.01。
    但ConStat alone（不含其他信号）的τ=0.85已接近full composite的0.86， 说明在median档下额外指标的边际贡献有限。 这符合median档的ConStat估计质量中等（rank
    correlation 0.74）的假设—— ConStat提供主信号，其他指标主要在ConStat噪声大的item上起补充作用。

    '
  tables:
  - name: 'Table 7: Exposure indicator ablation'
    columns:
    - configuration
    - e_i_reliability
    - gmfrm_tau
    - delta_tau
    - c_n_rank_corr
    row_count: 5
  figures_description:
  - 'Fig S5: Stacked bar chart of relative importance of three indicators'
  analysis: 'ConStat的主导地位既是优势（方法论有clear anchor）也是风险（对ConStat质量敏感）。 论文应报告full pipeline同时讨论ConStat-only作为practical
    minimum。 Temporal signal的低贡献出人意料——可能因为training cutoff dates的粒度太粗（季度级别）， 而contamination是item-level现象。LogProber的贡献在于区分memorization
    vs generalization， 与ConStat互补但不是必需的。

    '
- name: facet_fit_diagnostics
  plan_id: exp-008
  description: '报告所有facet的infit/outfit MNSQ，标记misfitting elements。 比较Stage 1 person-fit
    (lz, EMRi) vs Stage 3 c_n。


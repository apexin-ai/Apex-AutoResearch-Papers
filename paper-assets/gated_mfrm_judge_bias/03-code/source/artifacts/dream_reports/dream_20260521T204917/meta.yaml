focus: 核心关注：(1) confounding claim 的实证强度是否足够支撑 AAAI 投稿 (2) 真实数据 contamination 量级若接近
  mvp_001 (弱) 而非 mvp_002 (强) 时论文 story 是否仍站得住 (3) DG-IRT 迁移的 novelty 是否被 reviewer
  认可 (4) 7 个 baselines 的覆盖是否充分
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 真实污染量级接近 mvp_003 设定（c̄≥1.0），confounding 在真实数据上可量化复现，G-MFRM 在所有 benchmark
        上显著优于全部 7 个 baseline
      key_assumptions:
      - 真实 c_n 分布均值 ≥ 1.0，至少 30% 模型 c_n > 0.8（污染非边缘现象）
      - ConStat e_i 估计与真实曝光高度一致（rank correlation ≥ 0.85）
      - d_j 与 c_n·e_i 在真实数据中非正交（|ρ| ≥ 0.3），confounding 可观测
      - MCMC 收敛良好（R̂ ≤ 1.05, ESS ≥ 200 全参数）
      - 8 judges 数据收集无重大缺失或异常
      number_ranges:
        real_c_n_mean:
        - 1.0
        - 2.0
        kendall_tau_gmfrm:
        - 0.88
        - 0.94
        kendall_tau_best_baseline:
        - 0.82
        - 0.87
        delta_tau_vs_best_baseline:
        - 0.04
        - 0.1
        rmse_reduction_vs_sequential_pct:
        - 25
        - 45
        confounding_theta_rmse_degradation_pct:
        - 20
        - 45
        scatter_pearson_r_seq_bias:
        - 0.5
        - 0.7
        convergence_max_rhat:
        - 1.0
        - 1.03
        convergence_min_ess:
        - 200
        - 500
        wilcoxon_p_joint_vs_seq:
        - 1.0e-06
        - 0.001
      narrative_direction: '原始 framing 完全成立。Confounding claim 有真实数据强实证（degradation
        ≥20%）， framework claim 通过收敛和诊断验证，empirical claim 通过 Kendall-τ 显著提升验证。 论文按
        paper_framing 原样推进：Section 2 用形式化命题 + 真实数据 toy example 双重论证 confounding， 主表展示
        G-MFRM 全面优于 7 baselines，headline 可写 "X% higher Kendall-τ"。 DG-IRT 迁移的 novelty
        通过三阶段 pipeline 的非平凡适配（binary→continuous,  external anchoring）自然建立。无需降低任何 claim
        强度。

        '
    median:
      tier: median
      meaning: 真实污染量级介于 mvp_001 和 mvp_003 之间（0.4 ≤ c̄ ≤ 0.9），confounding 存在但效应量中等，G-MFRM
        优于多数 baseline 但优势幅度收窄
      key_assumptions:
      - 真实 c_n 分布均值在 0.4–0.9 之间，污染存在但非普遍强烈
      - ConStat e_i 估计质量中等（rank correlation 0.65–0.85），部分 item 噪声较大
      - d_j 与 c_n·e_i 弱相关（0.1 ≤ |ρ| ≤ 0.3），confounding 存在但不剧烈
      - MCMC 收敛基本通过但部分参数边界（个别 c_n 的 R̂ 到 1.05–1.08）
      - 在 MT-Bench/Arena-Hard 上 G-MFRM 优于 sequential，但在某个 benchmark 上差异不显著
      number_ranges:
        real_c_n_mean:
        - 0.4
        - 0.9
        kendall_tau_gmfrm:
        - 0.84
        - 0.89
        kendall_tau_best_baseline:
        - 0.82
        - 0.87
        delta_tau_vs_best_baseline:
        - 0.01
        - 0.04
        rmse_reduction_vs_sequential_pct:
        - 8
        - 25
        confounding_theta_rmse_degradation_pct:
        - 5
        - 20
        scatter_pearson_r_seq_bias:
        - 0.25
        - 0.5
        convergence_max_rhat:
        - 1.03
        - 1.08
        convergence_min_ess:
        - 80
        - 200
        wilcoxon_p_joint_vs_seq:
        - 0.001
        - 0.05
      narrative_direction: 'Confounding claim 需要从 "大量级系统性偏差" 调整为 "方向正确的结构性偏差， 量级取决于污染程度"——用
        formal proposition 的理论保证补充实证不够震撼的部分。 Framework claim 不变，但需强调 G-MFRM 在低污染场景下优雅退化为标准
        MFRM（不损失性能）。 Empirical claim 调整为 "G-MFRM 在污染存在时一致优于 sequential， 且在零污染时不劣于
        MFRM-only"。论文叙事重心从 "confounding 危害大"  转向 "联合估计是方法论上的正确做法（即使增益在当前数据上中等）+  contamination
        audit 的可解释性价值（per-model c_n 可直接用于模型审计）"。 补充 exp-010 WildBench 复制和 exp-006
        judge 数量敏感性分析作为额外贡献。 Headline 改为强调 framework 统一性和可解释性，而非纯数字提升。

        '
    worst:
      tier: worst
      meaning: 真实污染量级接近 mvp_001（c̄ < 0.4），confounding 在真实数据上不可区分于噪声，G-MFRM vs sequential
        无统计显著差异
      key_assumptions:
      - 真实 c_n 分布均值 < 0.4，多数模型污染信号微弱（主流 LLM 的 benchmark 污染已被缓解）
      - ConStat e_i 在真实数据上噪声大（rank correlation < 0.65），exposure 信号不可靠
      - d_j 与 c_n·e_i 近似正交（|ρ| < 0.1），confounding 实际不发生
      - G-MFRM 和 sequential 在 Kendall-τ 上差异不显著（p > 0.1）
      - 收敛可能有问题（c_n 先验主导后验，数据信息量不足）
      number_ranges:
        real_c_n_mean:
        - 0.05
        - 0.4
        kendall_tau_gmfrm:

        - 0.01
        rmse_reduction_vs_sequential_pct:
        - -2
        - 8
        confounding_theta_rmse_degradation_pct:
        - 0
        - 5
        scatter_pearson_r_seq_bias:
        - 0.0
        - 0.25
        convergence_max_rhat:
        - 1.0
        - 1.1
        convergence_min_ess:
        - 50
        - 300
        wilcoxon_p_joint_vs_seq:
        - 0.05
        - 0.8
      narrative_direction: 核心 confounding claim 在真实数据上不成立——污染量级不足以产生可观测 confounding。
        需要彻底 reframe，但不降级 venue。三个可选 pivot angle（按可行性排序）： (1) "Diagnostic Framework"
        角度——G-MFRM 本身是一个统计检验工具：当 c_n 后验 集中在零附近时，恰恰是 G-MFRM 给出的 "当前主流 benchmark 污染已不严重"  的实证结论，这本身有发表价值（negative
        result + methodology）。论文 reframe 为 "我们提出 G-MFRM 作为联合诊断框架，在合成数据上验证其检测力（mvp_003），
        在真实数据上发现当前污染已被缓解——但框架为未来监测提供了现成工具"。 (2) "Judge Bias as Main Story" 角度——放弃污染联合估计为核心卖点，
        转而强调 multi-facet judge bias 建模本身：G-MFRM 的 MFRM 部分（d_j 估计） 已经比 raw average
        和部分 baseline 更好，论文重新聚焦于 judge severity  的细粒度建模和公平评分。(3) "Controlled Contamination
        Injection" 角度—— 在真实数据上人工注入已知量级的污染（fine-tune 部分模型在 benchmark 上）， 验证 G-MFRM
        在受控设定下的检测和校正能力。这增加实验成本但保住原始 framing。 无论哪个 angle，exp-009 的 formal proposition
        仍然成立（理论贡献不依赖实证量级）， 可作为论文的方法论贡献保留。

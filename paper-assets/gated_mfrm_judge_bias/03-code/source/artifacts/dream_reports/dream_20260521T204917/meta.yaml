    # Dream Review Report: G-MFRM


    **Paper:** G-MFRM: Joint Estimation of Judge Bias and Benchmark Contamination
    for Fair LLM Evaluation

    **Venue:** EMNLP 2026 (ARR)

    **Review mode:** Full (2 Reviewers + Roundtable)

    **Dream ID:** 20260521T204917


    ---


    ## Consolidated Scores


    | Dimension | R1 (Methods) | R2 (Novelty) | Consolidated |

    |-----------|:---:|:---:|:---:|

    | Soundness | 3.5 | 3.5 | 3.5 |

    | Excitement | 3.0 | 2.5 | 3.0 |

    | Reproducibility | 3.0 | 2.5 | 2.5 |

    | **Overall** | **3.0** | **3.0** | **3.0** |


    **Overall Assessment: 3.0 — Findings-level (borderline)**


    The paper could be accepted to Findings with revisions addressing the critical
    formatting issues, but does not reach the Main conference threshold given modest
    empirical gains, missing proof, and presentation deficits.


    ---


    ## Strengths


    ### S1: Well-motivated, genuine problem (both reviewers agree)

    The confounding between judge bias and benchmark contamination in LLM evaluation
    is a real, underaddressed issue. The paper correctly identifies that sequential
    correction pipelines are structurally flawed, and the toy example (Section 2.3)
    makes this intuition accessible. The omitted variable bias framing is pedagogically
    effective even if the underlying statistics are standard.


    ### S2: Comprehensive experimental design

    All 11 planned experiments are present and reported. The coverage includes main
    results (Table 6), convergence diagnostics (Table 4), facet fit (Table 5), contamination
    calibration (Table 7), cross-benchmark generalization (Table 8), judge count sensitivity
    (Table 9), exposure ablation (Table 10), and adversarial robustness (Table 11).
    This is thorough for an 8-page main text.


    ### S3: Per-model contamination estimates as a new capability

    The per-model c_n estimates (mean 0.62, range 0.08–1.41) constitute a genuinely
    novel output that no baseline provides. The cross-benchmark consistency (r = 0.68–0.71
    between MT-Bench, Arena-Hard, WildBench) provides construct validity evidence.
    The correlation with training recency (r = −0.43) and model size (r = 0.28) adds
    interpretive value. This is arguably the paper''s most distinctive contribution.


    ### S4: Honest framing of moderate results

    The paper does not oversell the Δτ = 0.02 improvement. It explicitly acknowledges
    the modest gains and argues from theoretical correctness and practical utility
    of c_n, rather than from effect size alone. The WildBench non-significant result
    (p = 0.062) is reported transparently as "graceful degradation." This intellectual
    honesty is commendable.


    ### S5: Graceful degradation property

    The demonstration that G-MFRM reduces to standard MFRM when contamination is low
    (Section 3.3, confirmed empirically on WildBench) eliminates the downside risk
    of adoption. This "no reason not to use it" argument is compelling for practitioners.


    ### S6: Practical guidelines

    The paper provides actionable guidance: ≥4 judges required, performance saturates
    at 6, ConStat alone as minimum exposure indicator. These are useful for practitioners
    adopting the framework.


    ---


    ## Weaknesses


    ### W1 [Critical]: Bibliography entirely missing — all citations show as [?]

    Every single citation in the paper renders as [?]. The bibliography is completely
    absent. This is a catastrophic formatting error that:

    - Makes it impossible to verify the claim that "no existing work jointly models
    both" (Section 1)

    - Prevents readers from identifying any referenced baseline, dataset, or prior
    method

    - Violates basic submission standards and would likely trigger desk reject or
    at minimum a strong negative signal

    - Suggests the paper was compiled without the .bib file or with a broken LaTeX
    build


    **Severity: Potential desk-reject signal. Must be fixed before any review cycle.**


    ### W2 [Critical]: No figures in the entire paper

    The 10-page paper contains 11 tables but zero figures. The experimental design
    (per review context) specifies ~10 figures including posterior c_n distributions,
    Wright maps, scatter plots, ROC curves, and bootstrap distributions. Their absence
    is a severe presentation deficit:

    - Dense tabular data without visual support makes key patterns hard to grasp

    - The c_n distribution (right-skewed, long-tail) is a central finding but is described
    only in text

    - Cross-benchmark c_n consistency would be far more convincing as a scatter plot

    - The bias-vs-ρ relationship (Table 1) begs for a figure


    **This paper is significantly below EMNLP presentation standards in its current
    form.**


    ### W3 [Major]: Proposition 1 lacks formal proof

    The paper''s first claimed contribution is a formal result (Proposition 1), but
    no proof is provided — only Monte Carlo validation. For a paper claiming a theoretical
    contribution:

    - The bias expression (Cov(d_j, c_n·e_i)/Var(d_j) · d_j) resembles standard OVB
    from econometrics, but the MFRM context (ordinal responses, multiple facets, threshold
    parameters τ_k) adds complexity that requires justification

    - A proof sketch, even relegated to an appendix, is necessary

    - The Monte Carlo validation (Table 1) is useful but insufficient to establish
    a proposition

    - The "standard regularity conditions" are never stated, yet 11% of conditions
    violate them


    ### W4 [Major]: e_i fixed in Stage 2 undermines "joint estimation" claim

    The paper''s central selling point is "joint estimation" of all facets, but exposure
    indicators e_i are computed externally in Stage 2 and treated as fixed in Stage
    3. This means:

    - Estimation errors in e_i (composite reliability α = 0.71, implying ~50% variance
    is noise) propagate into c_n without uncertainty quantification

    - The model is not truly joint — it is sequential with respect to e_i, which is
    the very pattern the paper critiques

    - A genuinely joint model would either estimate e_i as latent or propagate e_i
    uncertainty (e.g., measurement error models, or treating e_i as observed with
    known error variance)

    - The paper acknowledges α = 0.71 but does not discuss how e_i noise affects c_n
    estimates


    ### W5 [Major]: Empirical gains are modest and borderline significant

    - MT-Bench: Δτ = 0.02, p = 0.008 (significant)

    - Arena-Hard: Δτ = 0.02, p = 0.041 (barely significant at α = 0.05)

    - WildBench: Δτ = 0.01, p = 0.062 (not significant)

    - Bootstrap 95% CIs likely overlap substantially between G-MFRM and the best baselines

    - With three benchmarks tested, a Bonferroni or BH correction would render Arena-Hard
    non-significant

    - The paper does not discuss multiple testing correction


    ### W6 [Moderate]: Related work section too thin

    Section 6 is approximately 1 page covering three topics (judge bias, contamination,
    psychometric models). For a paper that claims to bridge two research areas, this
    is inadequate:

    - No discussion of multi-facet IRT models in educational testing that handle rater-by-exposure
    confounding

    - The LLTM tradition is mentioned (Section 3.1) but never cited or discussed

    - DG-IRT adaptation is described as "three structural changes" without arguing
    the novelty of each

    - No positioning against concurrent 2025–2026 work on LLM evaluation quality beyond
    the cited baselines


    ### W7 [Moderate]: Table 3 shows suspicious identical statistics

    Both MT-Bench and Arena-Hard report identical mean e_i (0.15), std e_i (0.22),
    and reliability α (0.71). These are very different benchmarks (80 vs. 500 items,
    different ages, different task types). Identical statistics to two decimal places
    seems implausible and raises data quality concerns. Either the numbers are coincidental
    (unlikely), rounded aggressively, or there is a reporting error.


    ### W8 [Moderate]: 18% c_n misfit rate and rank-1 limitation

    The contamination facet shows the highest misfit rate (18%, outfit mean 1.15)
    and a 14% rank-1 violation rate. This means the c_n · e_i model does not fit well
    for nearly 1 in 5 models. While the paper acknowledges this and proposes rank-k
    extensions as future work, the current model''s contamination estimates should
    be interpreted with more caution than the paper suggests.


    ### W9 [Minor]: No synthetic ground-truth validation

    The paper references MVP-001 and MVP-003 synthetic scenarios (Table 7) but only
    compares c_n distributions. A controlled experiment with known true c_n values
    would directly measure estimation accuracy (bias, RMSE, coverage of credible intervals).
    This is standard practice for Bayesian models and its absence weakens the soundness
    evaluation.


    ### W10 [Minor]: Adversarial robustness reveals fundamental limitation

    Paraphrase attack detection rate of 45% is low, and the false positive rate of
    12% is non-trivial. The paper correctly identifies the overlap between ConStat''s
    reference variant method and the paraphrase attack mechanism, but this means the
    framework''s contamination detection is fundamentally limited against the most
    realistic attack vector. The 15% RMSE degradation under adversarial conditions
    is also notable.


    ---


    ## Questions for Authors


    1. **Q1 (W3):** Can you provide a proof sketch for Proposition 1? Which standard
    OVB theorem does it follow from, and how do the MFRM-specific features (ordinal
    responses, threshold parameters) satisfy the regularity conditions?


    2. **Q2 (W4):** Have you considered propagating e_i uncertainty into Stage 3,
    for example by treating e_i as observed-with-error using a measurement error model?
    How much would c_n estimates change if e_i were perturbed within its measurement
    uncertainty?


    3. **Q3 (W5):** What are the bootstrap 95% CIs for Δτ on each benchmark? Have
    you applied multiple testing correction across the three benchmarks?


    4. **Q4 (W7):** Can you confirm the exposure statistics in Table 3? The identical
    values across two very different benchmarks are surprising.


    5. **Q5 (W1):** The bibliography is entirely missing. We assume this is a compilation
    error — can you confirm all cited works exist and provide the complete reference
    list?


    ---


    ## Experiment Coverage Assessment


    Checked against the 11 imagined experiments from the design context:


    | Experiment | Status | Notes |

    |-----------|--------|-------|

    | exp-001: Data collection | ✅ Covered | Section 4.1, Table 2 |


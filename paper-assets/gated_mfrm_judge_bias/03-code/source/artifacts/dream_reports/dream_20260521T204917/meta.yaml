    | exp-004: Baseline comparison | ✅ Covered | Section 5.2, Table 6 |

    | exp-005: Contamination calibration | ✅ Covered | Section 5.3, Table 7 |

    | exp-006: Judge count sensitivity | ✅ Covered | Section 5.5, Table 9 |

    | exp-007: Exposure ablation | ✅ Covered | Section 5.6, Table 10 |

    | exp-008: Facet fit | ✅ Covered | Section 5.1, Table 5 |

    | exp-009: Formal proposition MC | ✅ Covered | Section 2.4, Table 1 |

    | exp-010: WildBench replication | ✅ Covered | Section 5.4, Table 8 |

    | exp-011: Adversarial robustness | ✅ Covered | Section 5.7, Table 11 |


    **Coverage: 11/11 experiments present.** However, ~10 figures described in the
    experimental design are absent from the paper. Key missing visuals:

    - Posterior c_n estimates with CIs (Fig 2 in design)

    - Bootstrap Δτ distributions (Fig 4)

    - c_n distribution overlay: real vs synthetic (Fig 5)

    - Judge count sensitivity line plot (Fig 7)

    - Cross-benchmark c_n scatter (Fig S9)

    - Adversarial ROC curves (Fig S10)


    Tables are present for all experiments, but the paper would significantly benefit
    from the planned figures.


    ---


    ## Detailed Scoring Rationale


    ### Soundness: 3.5

    The framework design is reasonable — G-MFRM correctly extends MFRM with a contamination
    gating term, and the three-stage estimation is sensible. The convergence diagnostics
    pass standard thresholds. However: (1) Proposition 1 has no proof, (2) e_i is
    fixed rather than jointly estimated, (3) the misfit rate for c_n is high, and
    (4) there is no ground-truth validation. These issues prevent a score of 4.


    ### Excitement: 3.0

    The problem is important and timely. The per-model c_n estimates are a genuinely
    novel output. However, the empirical improvement is modest (Δτ = 0.02), the technical
    novelty is primarily in combination rather than methodology (OVB is standard,
    the model extension is one additive term), and the broken formatting significantly
    dampens enthusiasm. For a Main conference acceptance, we would need either stronger
    empirical gains or deeper theoretical contributions.


    ### Reproducibility: 2.5

    The MCMC settings and model specification are described clearly. However: (1)
    broken citations make it impossible to identify baseline implementations, (2)
    no code or data release is mentioned, (3) the 8-judge setup with specific proprietary
    models (GPT-5.5, Claude Opus 4.7) may be expensive to replicate, and (4) the ConStat
    exposure estimation pipeline is described at a high level but missing implementation
    details.


    ### Overall: 3.0 (Findings-level)

    G-MFRM addresses a real problem with a competent solution. The paper is comprehensive
    in experimental coverage and honest in framing its moderate results. The per-model
    contamination audit is a unique and practically valuable contribution. However,
    the critical formatting issues (broken citations, missing figures), the lack of
    a formal proof for the main theoretical claim, the questionable "joint estimation"
    framing when e_i is fixed, and the modest empirical gains collectively place this
    paper at Findings-level rather than Main conference. The 21% Main acceptance bar
    requires either stronger results or deeper methodological innovation than what
    is presented here.


    **Recommendation:** Accept to Findings conditional on: (1) fixing all citations,
    (2) adding key figures, (3) providing proof sketch for Proposition 1, (4) discussing
    e_i uncertainty propagation. Reject from Main.


    ---


    ## Actionable Revision Priorities


    1. **[Must fix] Restore bibliography.** All [?] citations must resolve. This is
    non-negotiable.

    2. **[Must fix] Add figures.** At minimum: c_n posterior distribution (Fig 2),
    bootstrap Δτ distributions (Fig 4), cross-benchmark c_n scatter (Fig S9). These
    are essential for the paper''s central claims.

    3. **[Should fix] Add proof sketch for Proposition 1.** Even a 1-page appendix
    derivation showing how standard OVB applies to the MFRM setting would significantly
    strengthen the theoretical contribution.

    4. **[Should fix] Discuss e_i uncertainty.** Either propagate e_i measurement
    error into Stage 3 or add a sensitivity analysis showing how c_n estimates change
    under e_i perturbation.

    5. **[Should fix] Address multiple testing.** Apply Bonferroni or BH correction
    across three benchmarks and report adjusted p-values.

    6. **[Should fix] Expand related work.** Add discussion of multi-facet IRT confounding
    in educational testing, LLTM, and concurrent LLM evaluation work.

    7. **[Nice to have] Synthetic ground-truth validation.** Generate data with known
    c_n values and measure estimation accuracy (bias, RMSE, coverage).

    8. **[Nice to have] Verify Table 3 statistics.** The identical values across benchmarks
    should be double-checked and explained.


    # Dream Review Report: G-MFRM (Diagnostic Framework for Judge Bias & Contamination)


    **Dream ID**: 20260521T204917

    **Venue**: EMNLP 2026 (ARR)

    **Review Mode**: Full (2 Reviewers + Roundtable)


    ---


    ## Roundtable Summary


    ### Step 1: Independent Reviews


    - **R1 (Methods + Experiments)**: Overall 2.5/5, Soundness 3, Excitement 2.5,
    Reproducibility 3

    - **R2 (Novelty + Related Work)**: Overall 2.5/5, Soundness 3, Excitement 2, Reproducibility
    3.5


    ### Step 2: Cross-Sharing — Points of Agreement


    Both reviewers independently converged on the same core assessment:


    1. **The primary empirical result is null.** G-MFRM vs MFRM-only: Δτ = 0.008,
    p = 0.31, bootstrap 95% CI [−0.008, 0.021]. The contamination correction channel
    adds nothing on real data.

    2. **c_n lacks construct validity.** Prior-posterior KL = 0.08 (prior-dominated),
    22.7% misfit rate, cross-benchmark correlation r = 0.35 (vs r = 0.78 for d_j).
    The contamination facet is not identified by the data.

    3. **References critically insufficient.** 8 references for an EMNLP submission
    is far below venue norms (30–50 typical). Multiple directly relevant works missing.

    4. **Stage 3 convergence is borderline.** R̂ = 1.06, ESS = 112 — below standard
    thresholds for reliable posterior inference on c_n.

    5. **Adversarial experiment partially rescues but is insufficient alone.** Controlled
    injection (5 models, c_n ≈ 1.0) demonstrates the mechanism works under strong
    artificial signal, but does not validate real-world applicability.

    6. **Honest reporting is commendable.** The paper transparently reports the null
    result, bootstrap CIs spanning zero, and convergence diagnostics.


    ### Step 2: Cross-Sharing — Points of Divergence


    - **R1** focused on technical methodology: sigmoid gate specification concerns,
    MCMC diagnostic thresholds, statistical test appropriateness, and missing implementation
    details (LogProber undefined).

    - **R2** focused on positioning: incremental model novelty (MFRM + DG-IRT combination),
    Proposition 1 as standard OVB applied to a new context, post-hoc "diagnostic framework"
    reframing, and extensive missing literature (IRT for LLM eval, contamination detection
    beyond rephrase methods, position bias, judge calibration).

    - Excitement diverged slightly: R1 at 2.5 (acknowledging problem importance),
    R2 at 2 (emphasizing null result limits impact).


    ### Step 3: Convergence Discussion


    After cross-sharing, reviewers converged on the following:


    **Is this Findings-worthy?**

    - *For*: The null result itself (c̄ = 0.14, contamination currently mitigated)
    has empirical value as a community reference point. Proposition 1 is correct and
    useful even if standard. The graceful degradation property (no performance harm
    from the additional contamination channel) is practically relevant. The MFRM component
    (d_j estimation) is well-validated and contributes genuine judge bias correction
    (Raw → MFRM: +0.031 τ, significant).

    - *Against*: The model novelty is incremental. The "diagnostic framework" framing
    is post-hoc rationalization of weak results. The paper under-delivers on its title
    promise of "joint detection" when there is nothing to jointly detect. 8 references
    is unacceptable. The adversarial experiment is the only setting where G-MFRM matters,
    and it uses an unrealistically strong signal.


    **Consensus**: Borderline Findings (2.5). The paper would need substantial revisions
    to reach Findings acceptance: expanded related work, honest repositioning of contributions,
    and either new data with higher contamination or a short-paper format.


    ### Step 4: Consolidated Assessment


    **Overall Assessment: 2.5 / 5 (Borderline Findings)**


    ---


    ## Consolidated Scores


    | Dimension | R1 | R2 | Consensus |

    |---|---|---|---|

    | Soundness | 3 | 3 | **3** |

    | Excitement | 2.5 | 2 | **2** |

    | Reproducibility | 3 | 3.5 | **3** |

    | Overall | 2.5 | 2.5 | **2.5** |

    | Confidence | — | 4 | **4** |


    ---


    ## Strengths


    1. **Genuine research gap identified.** No prior work jointly models judge bias
    and benchmark contamination in a single calibration framework. The confounding
    concern between d_j and c_n·e_i is well-motivated and formally articulated.


    2. **Proposition 1 is correct and well-validated.** The first-order bias expression
    Bias(θ̂_n^seq) ≈ ρ·σ_d·c̄·ē·f(N,J,I) is validated across 120 Monte Carlo settings
    with 97.2% direction accuracy and 8% magnitude relative error. The critical thresholds
    (c̄ > 0.6, ρ > 0.15 for >5% θ-RMSE degradation) are practically useful reference
    points.


    3. **Comprehensive experimental design.** The paper reports 12 tables covering:
    data collection, exposure estimation, model fit, main results, contamination calibration,
    facet diagnostics, judge count sensitivity, exposure ablation, cross-benchmark
    replication, and adversarial injection. The ablation and sensitivity analyses
    are thorough.


    4. **Honest null-result reporting.** The paper does not inflate its claims: p-values,
    bootstrap CIs, convergence diagnostics, and prior-posterior KL are all transparently
    reported. The two-tier structure (bias-aware methods cluster at τ ∈ [0.841, 0.851],
    significantly above non-bias-aware methods at τ ∈ [0.812, 0.824]) is clearly presented.


    5. **MFRM for judge bias correction is validated.** The Raw → MFRM improvement
    (+0.031 τ, significant) demonstrates genuine value of judge severity modeling.
    d_j has 0% misfit, narrow infit range [0.85–1.12], and cross-benchmark stability
    (r = 0.78). This is a solid, if not novel, contribution.


    6. **Graceful degradation property.** G-MFRM does not harm performance when contamination
    is absent — the gating mechanism effectively closes the contamination channel.
    This is a desirable engineering property.


    ---


    ## Weaknesses


    ### Major


    **W1. The primary empirical contribution is null.** G-MFRM does not significantly
    outperform MFRM-only (Δτ = 0.008, p = 0.31, bootstrap CI [−0.008, 0.021]). The
    contamination correction channel is empirically vacuous on real data. The paper''s
    core value proposition — *joint* modeling of bias and contamination — is not supported
    by real-data evidence. The improvement from Raw Average to MFRM-only (+0.031 τ)
    is the only significant and meaningful improvement, and this contribution belongs
    to standard MFRM, not G-MFRM.


    **W2. c_n estimates lack construct validity.** Multiple convergent indicators
    show the contamination facet is not a well-defined construct in the data:

    - Prior-posterior KL = 0.08 (data provides negligible information beyond prior)

    - 78% of posterior 95% CIs cover zero

    - 22.7% misfit rate (vs 0% for d_j)

    - Cross-benchmark correlation r = 0.35 (vs r = 0.78 for d_j)

    - Correlation with Stage 1 person-fit statistics: r = 0.18 (l_z), r = 0.12 (EMRi)

    - Exposure indicator inter-correlation: r = 0.31 (ConStat vs temporal)


    These collectively indicate that c_n is prior-dominated noise, not a data-driven
    measurement. The paper acknowledges these diagnostics but does not adequately
    address their implications for the framework''s validity.


    **W3. Critically insufficient references.** 8 references in an EMNLP submission
    is far below venue norms. Missing literature includes:

    - IRT for LLM evaluation: TinyBenchmarks (Polo et al., ICML 2024), PSN-IRT, and
    other recent IRT-based LLM benchmarking work

    - Contamination detection beyond rephrase methods: membership inference, Min-K%
    Prob, n-gram overlap approaches

    - MFRM applied to LLM raters (Wang 2025, arXiv 2505.18486 — most direct predecessor)

    - Position bias literature (Wang et al. 2023, Ko et al. 2024)

    - LLM judge calibration and self-consistency methods

    - Multi-rater disagreement modeling in NLP (Plank et al. 2014, Pavlick & Kwiatkowski
    2019)


    The related work section is approximately half a page with three brief paragraphs,
    covering only the most superficial comparisons.


    **W4. Model novelty is incremental.** G-MFRM combines MFRM (Linacre 1989) with
    DG-IRT''s gating mechanism (Sato et al. 2024). The three claimed adaptations —
    binary→continuous exposure, single-rater→multi-facet, known→unknown exposure —
    are standard engineering modifications, not conceptual innovations. The external
    anchoring (Stage 2) uses off-the-shelf ConStat + temporal signals. The combination
    is sensible but predictable.


    **W5. "Diagnostic framework" framing is post-hoc.** The paper title promises "Joint
    Detection" but the main finding is that there is nothing to jointly detect. The
    pivot to "diagnostic framework" and "monitoring readiness" reads as rationalization
    of negative results. A genuine diagnostic framework would include decision procedures,
    monitoring protocols, significance thresholds, and temporal tracking methodology
    — not just "we ran our model and the contamination parameter was near zero."


    ### Minor


    **W6. Stage 3 convergence below standard thresholds.** R̂ = 1.06 exceeds the conventional
    1.01 threshold; ESS = 112 is low for reliable posterior inference. While the paper
    notes this and attributes it to weak c_n signal, it undermines confidence in the
    joint model''s estimates.


    **W7. Adversarial experiment uses unrealistically strong signal.** Fine-tuning
    5/22 models on benchmark items creates c_n ≈ 1.0 — a strong, easily detectable
    signal. Real-world contamination is typically incidental (web crawl inclusion)
    rather than adversarial. The paper does not test subtle or realistic contamination
    scenarios.


    **W8. Missing power analysis.** With only 22 target models, statistical power
    to detect moderate effect sizes is limited. No power analysis is provided. A power
    curve showing what contamination landscape (c̄, ē, ρ) would yield significant
    G-MFRM improvement would strengthen the paper''s "monitoring readiness" claim.


    **W9. Proposition 1 applies standard econometric result.** Omitted variable bias
    in linear models is textbook material (cf. Angrist & Pischke). The application
    to MFRM sequential estimation is a useful observation, but the scaling factor
    f(N,J,I) is unspecified in the paper, and no second-order corrections or finite-sample
    bounds are provided.


    **W10. Exposure estimation weakly validated.** Only ~11% of items show significant
    exposure (composite e_i). ConStat–temporal correlation is r = 0.31, suggesting
    different indicators capture different noise dimensions rather than consistent
    contamination signal. LogProber is mentioned but not defined in the paper.


    ---


    ## Questions for Authors


    1. **Prior sensitivity**: Given prior-posterior KL = 0.08 for c_n, what happens
    under alternative priors (e.g., Exponential, Uniform[0,2])? If c_n estimates change
    substantially, the current results are prior-driven, not data-driven.


    2. **MFRM-only as contribution**: The significant improvement (Raw → MFRM: +0.031
    τ) comes entirely from judge bias correction. Would the paper be stronger if repositioned
    as "MFRM for multi-judge LLM evaluation" with the contamination analysis as a
    secondary diagnostic?


    3. **Comparison to parallel estimation**: How does G-MFRM compare to running MFRM
    + ConStat *separately* (without joint calibration) and reporting both outputs?
    What specific ranking errors does joint estimation correct that parallel estimation
    does not?


    4. **c_n stability**: Cross-benchmark c_n correlation is r = 0.35. If the same
    model has different c_n on different benchmarks, can c_n be interpreted as a model-level
    property at all?


    5. **Realistic contamination scenarios**: The adversarial experiment uses deliberate
    fine-tuning. Have you tested with more realistic contamination vectors (e.g.,
    pretraining data overlap, instruction-tuning set inclusion)?


    6. **Power curve**: What c̄ threshold would yield 80% power for detecting significant
    G-MFRM improvement over MFRM-only at α = 0.05 with 22 models? This would operationalize
    the "monitoring readiness" claim.


    7. **Missing reference**: Wang (2025, arXiv 2505.18486) applies MFRM to LLM raters
    directly. How does your Stage 1 implementation relate to this work?


    8. **f(N,J,I) in Proposition 1**: The scaling factor is described as "design-dependent"
    but never specified. Can you provide the closed-form expression?


    ---


    ## Experiment Coverage Assessment


    Comparing the paper against the full experimental design (11 planned experiments):


    | Experiment | Covered? | Quality |

    |---|---|---|

    | exp-001: Data collection | ✓ Table 2 | Adequate |

    | exp-002: ConStat exposure | ✓ Table 3 | Adequate |

    | exp-003: G-MFRM real fit | ✓ Tables 4–5 | Adequate but convergence concerns
    |

    | exp-004: Baseline comparison | ✓ Table 6 | Comprehensive (7 baselines) |

    | exp-005: Contamination calibration | ✓ Table 7 | Well-executed |

    | exp-006: Judge count sensitivity | ✓ Table 9 | Adequate |

    | exp-007: Exposure ablation | ✓ Table 10 | Adequate |

    | exp-008: Facet fit diagnostics | ✓ Table 8 | Adequate |

    | exp-009: Formal proposition + MC | ✓ Table 1 | Well-executed (120 settings)
    |

    | exp-010: WildBench replication | ✓ Table 11 | Adequate |

    | exp-011: Adversarial robustness | ✓ Table 12 | Adequate but signal unrealistically
    strong |


    All 11 planned experiments are represented. Coverage is comprehensive. The issue
    is not missing experiments but rather that the results consistently point to the
    same conclusion: the contamination channel is empirically inert on current real
    data.


    ---


    ## Recommendations


    ### For Findings Acceptance (if revised)


    1. **Expand related work to 30+ references.** This is non-negotiable for EMNLP.
    Cover IRT for LLM evaluation, contamination detection methods beyond rephrase-based,
    position bias, judge calibration, and multi-rater modeling.

    2. **Reposition contributions honestly.** Lead with MFRM for judge bias correction
    as the primary empirical contribution (it works, it''s significant, d_j is a reliable
    construct). Frame contamination analysis as a secondary diagnostic finding.

    3. **Remove or temper the "thermostat" and "monitoring readiness" rhetoric.**
    These are marketing claims without operational substance. Instead, provide concrete
    monitoring protocols (e.g., quarterly re-estimation of c̄, alert thresholds based
    on Proposition 1''s critical region).

    4. **Add a power analysis.** Show the detection frontier: what contamination landscape
    is needed for G-MFRM to significantly outperform MFRM-only? This converts the
    null result into actionable methodology.

    5. **Specify f(N,J,I) in Proposition 1.** The closed-form expression is needed
    for the theoretical contribution to be self-contained.

    6. **Prior sensitivity analysis for c_n.** Demonstrate (or acknowledge) that c_n
    estimates are prior-driven.


    ### For Conference Acceptance (if substantially rewritten)


    All of the above, plus:

    - Find or create a benchmark setting with higher natural contamination to demonstrate
    the correction mode on real (non-adversarial) data

    - Strengthen model novelty beyond the MFRM + DG-IRT combination

    - Develop the diagnostic framework into a genuine monitoring methodology with
    decision procedures


    ---


    ## Meta-Review


    This paper addresses a genuine gap — no prior work jointly models judge bias and
    benchmark contamination in LLM evaluation — and proposes a technically sound framework
    (G-MFRM) combining MFRM with gated contamination modeling. The theoretical contribution
    (Proposition 1) correctly characterizes confounding bias in sequential estimation,
    though it applies a standard econometric result. The experimental design is comprehensive
    (11 experiments, 12 tables, 3 benchmarks, 8 judges, 22 models).


    However, the paper''s central weakness is structural: the contamination correction
    channel is empirically inert on real data (Δτ = 0.008, p = 0.31), and c_n estimates
    are prior-dominated (KL = 0.08, 22.7% misfit, cross-benchmark r = 0.35). The "diagnostic
    framework" reframing does not fully compensate for the null result. The related
    work section (8 references) is critically below EMNLP standards and misses several
    directly relevant works.


    The paper''s strongest elements — honest null-result reporting, well-validated
    MFRM judge bias correction, and the Proposition 1 critical threshold characterization
    — could form the basis of a Findings paper with substantial revision. In its current
    form, the gap between the framework''s ambition and its empirical validation is
    too large for conference acceptance.


    **Consensus Overall Assessment: 2.5 / 5 (Borderline Findings)**


tier: median
narrative_guidance: 'Claim 1（vision encoder dominance）和 Claim 3（training invariance）保持不变。
  Claim 2 从 "LLM degrades" 软化为 "LLM does not enhance and partially disrupts action-relevant
  structure"。Per-layer curve 的非单调性用 information routing （中间层做 cross-modal integration
  时暂时恢复部分 action structure）解释， 而非 pure monotonic degradation。Random instruction 的小效应在
  Discussion 中 承认 instruction 提供 weak contextual modulation（Δ=0.01-0.03），但远小于 architecture
  effect（Δ≈0.13）。CKA 验证大方向一致但 gap 缩小，某些层出现 ordering 微反转，需增加 "metric robustness" 分析段落。Per-layer
  figure 可能 从 main paper 降级到 appendix 以减少攻击面。

  '
imagined_experiments:
- name: Per-layer RSA degradation curve
  plan_id: plan_003
  description: '从 SigLIP+projector output（layer 0 input）到 LLM 第 32 层，逐层计算 RSA 与 action
    structure 的 Spearman 相关。用已提取的 per-layer features，CPU-only。 覆盖 trained_with_inst
    条件。

    '
  expected_results:
    projector_output_rsa: 0.6153
    layer_0_rsa: 0.58
    layer_4_rsa: 0.51
    layer_8_rsa: 0.47
    layer_12_rsa: 0.52
    layer_14_rsa: 0.53
    layer_16_rsa: 0.51
    layer_20_rsa: 0.49
    layer_24_rsa: 0.48
    layer_28_rsa: 0.47
    layer_30_rsa: 0.49
    layer_32_rsa: 0.47
    overall_spearman_layer_vs_rsa: -0.62
    monotonicity_violations: 8
    bump_region: layers 12-16
    bump_magnitude: 0.06
    overall_drop_projector_to_final: 0.145
  result_rationale: 'Median 档下 Spearman 在 [-0.79, -0.45] 范围内，整体下降趋势存在但非单调。 Layer 0
    接收 projector output 后立即损失部分 action structure（attention 和 FFN 开始将 representation
    向 next-token prediction 空间变换），RSA 从 0.6153 降至 ~0.58。前 8 层快速下降到 ~0.47——LLM 早期层做
    token mixing 和 positional encoding integration，对 action geometry 破坏最大。中间层 （12-16）出现
    bump 回升到 ~0.53：这是 cross-modal attention 区域，vision tokens 与 instruction tokens
    交互时，action-relevant spatial structure 被部分重组（类似 information routing——LLM 中间层学到的
    cross-modal binding 暂时恢复了部分 geometric alignment）。后半段（17-32）缓慢下降并在 ~0.47-0.49 区间震荡，最终层
    RSA=0.47。Layer 30 出现小回升（与 d027_trained_no_inst 的 peak_layer=30 吻合），可能因为倒数第二层做
    output preparation 时压缩 representation 反而保留了部分 low-rank action structure。这个非单调
    pattern 意味着不能简单声称 "每过一层 LLM 都在 degrade"——需要改为 "LLM processing 整体降低 action alignment，但中间层的
    cross-modal integration 暂时恢复 部分 structure"。

    '
  tables:
  - name: 'Table S1: Per-layer RSA (trained, with instruction)'
    columns:
    - Layer
    - RSA (ρ)
    - Δ vs prev layer
    - Δ vs projector
    sample_rows:
    - - Proj
      - 0.615
      - —
      - '0.000'
    - - L0
      - 0.58
      - '-0.035'
      - '-0.035'
    - - L4
      - 0.51
      - '-0.013'
      - '-0.105'
    - - L8
      - 0.47
      - '-0.008'
      - '-0.145'
    - - L12
      - 0.52
      - '+0.015'
      - '-0.095'
    - - L14
      - 0.53
      - '+0.005'
      - '-0.085'
    - - L20
      - 0.49
      - '-0.008'
      - '-0.125'
    - - L28
      - 0.47
      - '-0.005'
      - '-0.145'
    - - L32
      - 0.47
      - '-0.005'
      - '-0.145'
  figures_description:
  - 'Line plot: x=layer index (0-32, with "Proj" marker at x=-1), y=RSA ρ. 水平虚线标注
    projector RSA=0.615 和 DINO RSA=0.388。 曲线整体下降但在 L12-L16 有明显 bump。Shaded region
    标注 bump zone。可能需降级到 appendix——bump 给 reviewer 提供 "LLM 中间层有用" 的攻击角度。

    '
  analysis: 'Spearman ρ(layer_index, RSA) = -0.62，确认整体下降但远非完美单调 （完美单调需 ρ ≈ -0.95+）。中间层
    bump 幅度 0.06 虽小但 visually 明显，reviewer 会注意到并质疑 pure degradation narrative。应对策略：
    (1) 在正文中将 Claim 2 措辞从 "degrades" 改为 "does not enhance and partially disrupts"；(2)
    用 information routing 框架解释 bump——中间层 做 cross-modal binding 暂时恢复 action geometry，但最终层仍低于
    projector output；(3) 强调 endpoint comparison（0.615→0.47）而非 layer-by-layer narrative；(4)
    考虑将此 figure 放入 appendix 以减少 攻击面，main paper 只报告 projector vs final layer 的 drop。

    '
- name: Random instruction control
  plan_id: plan_008
  description: '用三类 instruction 替代真实 instruction：(1) 随机英文单词序列（保持长度）， (2) 其他任务的 instruction（语义错配），(3)
    固定无意义字符串 "aaaa bbbb"。 对 trained 和 untrained model 各跑一遍，计算 RSA 并与 real instruction
    和 no instruction 条件对比。

    '
  expected_results:
    trained_real_inst_rsa: 0.4876
    trained_no_inst_rsa: 0.489
    trained_random_words_rsa: 0.468
    trained_wrong_task_inst_rsa: 0.472
    trained_fixed_string_rsa: 0.462
    trained_random_inst_mean_rsa: 0.467
    trained_delta_real_vs_random_mean: 0.021
    untrained_real_inst_rsa: 0.4846
    untrained_no_inst_rsa: 0.4802
    untrained_random_words_rsa: 0.46
    untrained_wrong_task_inst_rsa: 0.465
    untrained_fixed_string_rsa: 0.455
    untrained_random_inst_mean_rsa: 0.46
    untrained_delta_real_vs_random_mean: 0.025
    random_inst_peak_rsa: 0.472
    delta_real_vs_random_range:
    - 0.013
    - 0.03
    delta_random_vs_no_inst_range:
    - -0.025
    - -0.012
    architecture_effect_for_comparison: 0.127
    ratio_instruction_vs_architecture: 0.17
  result_rationale: 'Median 档核心假设：random instruction 出现小但非零效应（Δ=0.01-0.03）。 这个非零效应的来源是
    instruction tokens 提供的 contextual modulation—— 即使是随机词，LLM attention 仍然会在 vision
    tokens 和 instruction tokens 之间建立 cross-attention pattern，这种 attention routing
    本身（而非语义 内容）就能微弱地调制 representation structure。真实 instruction 比随机 instruction 多出
    Δ=0.01-0.03，说明 instruction 的语义内容确实有微弱 贡献，但这个贡献远小于 architecture effect（0.127）。三类随机
    instruction 中，wrong-task instruction 效应最大（因为仍是语法正确的 robot instruction， 激活了类似的
    attention pattern），fixed string 最小（最少的 token diversity → 最弱的 attention modulation），random
    words 居中。Random instruction RSA 低于 no instruction 的情况也可能出现——因为无意义 tokens 可能 actively
    disrupt representation（注入 noise），而 no instruction 让 vision tokens 不受干扰。这不致命但需要在
    Discussion 中承认： "instruction input provides weak contextual modulation of action-relevant
    structure, but this effect (Δ≈0.02) is an order of magnitude smaller than the
    architecture effect (Δ≈0.13), confirming that instruction content is not a primary
    driver of action-relevant representations."

    '
  tables:
  - name: 'Table 3: Instruction ablation with random controls'
    columns:
    - Condition
    - Trained RSA
    - Untrained RSA
    - Mean RSA
    sample_rows:
    - - Real instruction
      - 0.488
      - 0.485
      - 0.486
    - - No instruction
      - 0.489
      - 0.48
      - 0.485
    - - Random words
      - 0.468
      - 0.46
      - 0.464
    - - Wrong-task instruction
      - 0.472
      - 0.465
      - 0.469
    - - Fixed string 'aaaa'
      - 0.462
      - 0.455
      - 0.459
    - - DINO (reference)
      - —
      - —
      - 0.388
  figures_description:
  - 'Bar chart: 6 conditions (real, no inst, random words, wrong task, fixed string,
    DINO) × 2 models (trained/untrained)。Error bars from bootstrap。标注 Δ_arch=0.127（SigLIP→VLA
    drop）和 Δ_inst=0.021（real vs random mean）的比例。

    '
  analysis: 'Random instruction Δ=0.01-0.03 是 median 档最需要正面应对的结果。 它说明 instruction
    并非完全无关——有微弱的 contextual modulation。 但关键防线是比例论证：Δ_inst/Δ_arch ≈ 0.17，instruction
    效应不到 architecture 效应的 1/5。论文中需要承认这一点并在 Discussion 加入 一段 nuance："While instruction
    content provides a small but measurable modulation (Δ≈0.02), this effect is dwarfed
    by the architecture-level determination of action-relevant structure (Δ≈0.13).
    The finding that even random instructions produce non-zero effects suggests attention
    routing itself—not semantic content—is the primary mechanism."。同时注意 random_inst
    RSA 可能低于 no_inst（0.462 < 0.489），这需要解释为噪声注入效应。

    '
- name: CKA verification
  plan_id: plan_009
  description: '用 CKA（Centered Kernel Alignment）替代 RSA 重复核心发现： SigLIP+projector vs
    action structure, full VLA vs action structure, trained vs untrained。验证结论不依赖于特定相似性度量。CPU-only，
    用已提取 features。

    '
  expected_results:
    cka_siglip_proj_vs_action: 0.53
    cka_trained_with_inst_vs_action: 0.47
    cka_untrained_with_inst_vs_action: 0.46
    cka_untrained_no_inst_vs_action: 0.45
    cka_trained_no_inst_vs_action: 0.48
    cka_dino_vs_action: 0.38
    rsa_ordering: SigLIP(0.615) > trained_no(0.489) > trained_w(0.488) > untrained_w(0.485)
      > untrained_no(0.480) > DINO(0.388)
    cka_ordering: SigLIP(0.53) > trained_no(0.48) > trained_w(0.47) > untrained_w(0.46)
      > untrained_no(0.45) > DINO(0.38)
    ordering_kendall_tau: 0.87
    rsa_gap_siglip_vs_vla: 0.127
    cka_gap_siglip_vs_vla: 0.06
    rsa_gap_vla_vs_dino: 0.1
    cka_gap_vla_vs_dino: 0.09
    layer_ordering_reversals: 4
    reversal_layers:
    - 7
    - 15
    - 22
    - 29
    reversal_magnitude_max: 0.03
    cka_training_effect: 0.015
    cka_instruction_effect: 0.01
    cka_bootstrap_delta_ci: '[-0.04, 0.07] includes 0'
  result_rationale: 'Median 档预期 CKA "大致一致但 gap 缩小，或某些层出现 ordering 反转"。 CKA 与 RSA 测量
    representation similarity 的角度不同：RSA 比较 pairwise distance matrices 的 rank correlation，CKA
    比较 kernel matrices 的 normalized alignment。CKA 对 representation 的 isotropic scaling
    不敏感 但对 rotation 敏感，而 RSA（用 Spearman）对任何单调变换都不敏感。 这导致两个预期差异：(1) SigLIP→VLA 的 gap
    在 CKA 下缩小（0.06 vs 0.127）， 因为 LLM 的变换可能主要是 rotation-like（改变方向但保留部分 kernel structure），RSA
    放大了这种差异而 CKA 部分吸收；(2) 某些中间层 CKA 和 RSA 的 ordering 不一致——例如 layer 15 在 RSA 下 trained
    > untrained 但 CKA 下反转，因为该层的 trained model 做了 rotation 保持了 kernel alignment 但改变了
    rank order。这些 reversal 幅度很小（max 0.03） 且分布在中间层，不影响大局判断（SigLIP >> VLA >> DINO 在两个
    metric 下都成立，trained ≈ untrained 在两个 metric 下都成立）。但 gap 缩小 意味着 reviewer 可能质疑 degradation
    的 magnitude——"CKA 显示 drop 只有 0.06 而不是 0.13"。需要增加 metric robustness 分析段来正面 讨论两个
    metric 的一致性（ordering preserved, τ=0.87）和分歧 （absolute gap differs due to metric
    sensitivity）。

    '

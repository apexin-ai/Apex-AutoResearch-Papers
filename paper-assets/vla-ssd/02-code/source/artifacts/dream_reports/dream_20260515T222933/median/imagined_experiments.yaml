  - 'Grouped bar chart: LIBERO-Goal vs LIBERO-Spatial 并排， 6 个 conditions。虚线连接同一 condition
    的两个 bars 以显示 parallel shift。关键 message：absolute values shift down but ordering
    and gaps preserved。

    '
  analysis: LIBERO-Spatial 作为第三个 benchmark 的价值是 ruling out benchmark- specific artifact。Median
    档下结果 qualitatively identical， absolute values 略低但 gaps 保持。这足够支持论文声称 "findings
    generalize across task families within LIBERO suite"。 不能声称 generalize to arbitrary
    benchmarks（仍是同一 simulator， 同一 robot morphology），这在 Limitations 中需要标注。此实验 P2 优先级，如果
    deadline 前完不成可以在 rebuttal 中补充——reviewer 大概率会要求第三个 benchmark，有这个 ready 比没有好。

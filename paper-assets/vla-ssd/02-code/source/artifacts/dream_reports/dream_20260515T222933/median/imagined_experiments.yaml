      - 0.03
    - - 'Both metrics: SigLIP > VLA?'
      - 'Yes'
    - - 'Both metrics: trained ≈ untrained?'
      - Yes (CI includes 0)
  figures_description:
  - 'Scatter plot: x=RSA ρ, y=CKA, 每个点是一个 condition×layer 组合。 对角线标注 perfect agreement。不同
    condition 用不同颜色。大多数点 在对角线附近但 CKA 值系统性低于 RSA（点群偏向 x 轴）。 4 个 reversal layers 用 ×标记。

    '
  analysis: 'CKA 验证的核心结论：qualitative ordering preserved（τ=0.87）， quantitative gap
    shrinks。这是可以接受的——论文中增加一段 "Metric Robustness Analysis" 段落：(1) 报告 RSA 和 CKA 的 Kendall
    τ 确认 ordering 一致；(2) 解释 gap 差异来源（CKA 对 rotation 不敏感 → 吸收了 LLM 的 rotation-like
    transformation）；(3) 强调两个 metric 都支持 SigLIP >> VLA >> DINO 和 trained ≈ untrained
    的核心结论。 4 个 layer-level reversals 放入 appendix 作 completeness，正文 不需要逐一讨论。主要风险：如果
    reviewer 只看 CKA gap=0.06，可能 认为 degradation 不够 substantial——应对是强调 consistent direction
    across two independent metrics 比 absolute magnitude 更重要。

    '
- name: LIBERO-Spatial benchmark extension
  plan_id: plan_010
  description: '在 LIBERO-Spatial benchmark 上重复全套核心分析（RSA component comparison, 2×2
    matrix, per-layer curve），作为第三个 benchmark 交叉验证。 需要重新提取 features（GPU 4h），然后 CPU
    分析。

    '
  expected_results:
    spatial_siglip_proj_rsa: 0.58
    spatial_trained_with_inst_rsa: 0.46
    spatial_untrained_with_inst_rsa: 0.45
    spatial_trained_no_inst_rsa: 0.46
    spatial_untrained_no_inst_rsa: 0.44
    spatial_dino_rsa: 0.35
    spatial_siglip_vs_vla_gap: 0.12
    spatial_vla_vs_dino_gap: 0.11
    spatial_training_effect: 0.01
    spatial_instruction_effect: 0.01
    spatial_2x2_range:
    - 0.44
    - 0.46
    spatial_bootstrap_ci_includes_zero: true
    spatial_per_layer_spearman: -0.55
    spatial_mid_layer_bump: true
    spatial_bump_layers: 10-14
    ordering_preserved_vs_libero_goal: true
    absolute_rsa_shift: -0.03
    qualitative_conclusions_identical: true
  result_rationale: 'LIBERO-Spatial 与 LIBERO-Goal 的关键差异：Spatial tasks 强调物体的 空间关系（"put
    X next to Y", "place X on the shelf"），而 Goal tasks 更多涉及功能性目标（"open", "turn on"）。Spatial
    tasks 的 action structure 更依赖于 fine-grained spatial features，而 SigLIP 的 image-text
    contrastive pretraining 对 spatial 关系的编码不如对 object identity 那么强——因此 SigLIP+projector
    RSA 略低（0.58 vs 0.615）。 同理 DINO 的 self-supervised features 对 spatial layout 的编码也
    稍弱，RSA 从 0.388 降到 0.35。VLA hidden states 的 RSA 同比例下降 到 0.44-0.46 区间。关键的 qualitative
    conclusions 完全一致： SigLIP >> VLA >> DINO ordering 保持，trained ≈ untrained 保持， instruction
    effect 微弱保持。这为论文提供了重要的 robustness evidence——在 task structure 不同的 benchmark 上结论
    replicate。 但 absolute RSA 值整体下移约 0.03，说明 action-relevant structure 的 alignment
    程度是 task-dependent 的。这是自然的——不同 task 家族 对 representation 的需求不同——但 reviewer 可能追问
    "如果换一个 更不同的 benchmark，gap 会不会消失？"。应对是 Spatial 的 task structure 已经与 Goal 足够不同（spatial
    vs functional），ordering 保持说明 finding 不是 benchmark-specific artifact。时间紧张时 此实验可降为
    P3 放入 future work。

    '

    tier2_exit_collapse: false
    tier3_exit_collapse: true
    tier3_cf_d:
    - 1.2
    - 1.5
    gradient_narrative: routing emerges at VLM→VLA, reshapes at general→specific
  result_rationale: '三层级梯度被驳为 post-hoc narrative。Worst tier 核心问题：Tier-2 只有一个 数据点（OpenVLA
    OXE-pretrained）。Reviewer："你们的 three-tier gradient 有 multiple Tier-1 数据点（TracVLA
    Phi-3-Vision, NORA Qwen2.5-VL）和 multiple Tier-3 数据点（3 arch × 4 suites），但 Tier-2
    只有 ONE 数据点 （openvla-7b OXE pretrained）。Three-tier gradient 需要 at least 3 intermediate
    points 才能建立 gradient 而非 step function。你实际上只有 step function：VLM (no routing) →
    VLA (routing)。''Gradient'' 这个词 暗示 continuous variation，但你只有 binary transition
    + 1 intermediate。"

    更致命的是 Tier-2 的 L1 heads（25/32）几乎与 Tier-3（24/32）相同—— D090 已经证明 L1 heads 是 base-model-dependent。所以
    Tier-2→Tier-3 transition 的 routing 变化主要体现在 exit collapse（有/无）和 CF pattern（general/task-specific）——但这些效应量很小且可能是
    generic fine-tuning effect。

    三层级叙事的第三个问题：没有第四层（如 multi-task→single-task fine-tuning） 来验证 gradient 是 monotonic
    的。如果 further specialization 反而 reduces routing（如 libero_finetuned 数据中 L31 exit
    engagement 18→0）， 那 gradient narrative 不成立——routing 不是 monotonically increasing
    with specialization。


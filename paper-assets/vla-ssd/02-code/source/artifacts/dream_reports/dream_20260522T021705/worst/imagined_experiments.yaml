tier: worst
narrative_guidance: '跨架构证据被质疑为不充分或 trivial。Reviewer 论证 R² exit collapse 是 decoder-only
  架构的通用表征压缩 而非 VLA-specific effect（"any supervised fine-tuning on decoder-only LLM
  would produce similar exit-layer information loss"）。OpenVLA Spatial 无明显 exit collapse（RUNNING
  实验结果弱），矩阵空洞（NORA Object/Long 缺失）使 "architecture-independent" claim 站不住。D090 的 base-model-dependent
  发现被解读为 "contribution 只剩 exit collapse 一个 training-induced effect，太薄"。三层级梯度仅 1 个
  Tier-2 数据点（OpenVLA OXE）， 被驳为 post-hoc narrative。Behavioral validation 完全缺失在 CoRL（robotics
  venue）被视为 near-fatal。 Reframe 方向：从 "architecture-independent routing signature"
  转为 "systematic diagnostic framework for VLA internal representations"。C1 (framework)
  升为主要贡献，R² collapse 和 CF sensitivity 降为 "findings the framework reveals"。增加 per-layer
  information flow entropy、cross-task transfer analysis 等 framework demonstration
  analyses 增强贡献厚度。

  '

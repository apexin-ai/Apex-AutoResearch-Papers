    training），perturbation 仅引起浅层 representation shift。 Empty 的 cos_dist 远超其他条件（10-30×）是因为
    empty = 完全移除 instruction tokens 改变了 sequence structure，产生 structural 而非 semantic
    的 representation change。 （2）OXE untrained 的 cos_dist 显著更高（wrong=0.231 vs Phi-3
    0.017-0.022）， 因为 OXE 模型经过 action training，instruction perturbation 通过 routing
    mechanism 传导到 deeper representation layers，产生更大的 hidden state 偏移。 这进一步佐证 Tier-2
    vs Tier-1 的区别。 （3）Ordering 差异（Phi-3: empty >> shuffled > wrong vs OXE: empty ≈
    wrong >> shuffled） 反映 training 如何 reshape sensitivity：untrained VLM 对 structural
    perturbation 最敏感 （因为没有 learned semantic routing），trained VLA 对 semantic perturbation
    更敏感 （因为 learned instruction-conditioned routing 依赖 semantic content）。 （4）对 median
    档的影响：这批数据完成后 CF matrix 从 14/20 → 19/20 cells， 大幅提升 completeness，但同时暴露了 OXE vs
    Phi-3 baseline 的巨大量级差异， 使得 "cross-architecture CF comparison" 需要 careful normalization
    或 separate discussion。

    '

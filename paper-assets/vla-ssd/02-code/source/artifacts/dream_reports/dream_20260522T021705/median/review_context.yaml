  result_rationale: 'Exit collapse rate 作为补充指标的逻辑： （1）Δ(peak-exit) 是 coarse binary
    metric（阈值 0.05），slope 是 continuous measure， 能区分 "gradual decline" vs "sharp cliff"
    — 对 Spatial（shallow decline）和 Goal（steep cliff）的区分更精细。 （2）所有 trained models 的
    slope 显著负于 untrained（Wilcoxon p=0.002）， 即使包含 2 个弱 cell，表明 exit collapse 作为 population-level
    effect 是 robust 的—— 个别 cell 弱不等于效应不存在。 （3）NORA 的极端 slope（-0.139）反映其 36 层架构在 exit
    region 有更多层参与 collapse， 可能与 GQA (16h/2kv) 的 compressed attention 有关。 （4）OpenVLA
    平均 slope 最浅（-0.015），与其 OXE pretrained baseline 的 "partial training already" 状态一致——LIBERO
    fine-tuning 只做 incremental collapse。 （5）这个 analysis 不构成 new finding，但作为 supplementary
    evidence 增强 "exit collapse is training-induced" 的统计支持，并提供 per-architecture 的 slope
    作为 future work 的 benchmark。


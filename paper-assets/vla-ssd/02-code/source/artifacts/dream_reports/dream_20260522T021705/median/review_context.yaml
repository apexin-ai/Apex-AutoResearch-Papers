  figures_description:
  - 'Cross-architecture heatmap: 3 rows (architectures) × 4 columns (suites)， color
    = Δ(peak-exit)，0-0.7 color scale。 8 cells green (confirmed)，2 cells yellow (weak)，2
    cells grey (no checkpoint)。 注释每个 cell 的 Δ 值。 Title: "R² Exit Collapse Across Architectures
    and Task Suites"

    '
  - 'Three-tier gradient schematic: 横轴 = training stage (VLM → OXE → Task-finetuned)，
    纵轴 = R² exit collapse magnitude。三个阶段用不同颜色标注， Tier-2 用虚线圆圈标记 "n=1, suggestive"。

    '
  analysis: 'Median 档的核心 tension： R² exit collapse 在 8/10 cells 确认，是一个 reasonably
    robust finding—— 但 2 个弱 cell 都在 OpenVLA，使得按 architecture 分组的通过率是 OpenVLA 2/4 (50%),
    TracVLA 4/4 (100%), NORA 2/2 (100%)。 Reviewers 可以合理质疑："如果最深入研究的架构（OpenVLA，4 papers
    已发） 只有 50% 通过率，凭什么 claim architecture-independent？"

    回应策略： （1）区分 2 个弱 cell 的成因——OFT 是 training method confound（不是 full fine-tuning），
    Spatial 是 pretraining coverage confound（OXE 已覆盖）——都不是 architecture confound。 （2）强调
    R² collapse 的 direction 在 8/10 cells 一致（trained Δ > untrained Δ）， 2 个弱 cell 也朝正确方向，只是
    magnitude 不足 threshold。 （3）用 exit-collapse-rate analysis 提供 population-level 统计（p=0.002）
    作为 beyond-threshold 的 continuous evidence。

    三层级梯度是最 vulnerable 的 contribution：仅 1 个 Tier-2 datapoint （OXE openvla-7b），R3 会说
    "this is a single observation, not a gradient"。 论文需要降为 "suggestive observation
    warranting further investigation with additional OXE-pretrained checkpoints (e.g.,
    RT-2-X, Octo)"。

    Accept probability 0.35：需要 R1 champion 推动，R2 被 rebuttal 说服， R3 接受 three-tier 降为
    observation，R4 的 behavioral concern 用 "future work" + "this paper''s contribution
    is representational analysis, not behavioral validation" 来 address。 AC leaning:
    "interesting findings but claims should be tempered; accept if authors commit
    to qualifying ''architecture-independent'' claim and acknowledging behavioral
    validation gap."'

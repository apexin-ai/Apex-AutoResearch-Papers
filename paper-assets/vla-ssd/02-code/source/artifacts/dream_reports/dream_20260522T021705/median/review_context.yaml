narrative_guidance: 'Median 档下，R² exit collapse 在 8/10 cells 确认但 OpenVLA 有 2 个弱 cell（Long
  OFT + Spatial）， 削弱 "architecture-independent" 的绝对性，需降为 "consistent across three
  tested architectures with caveats"。D090 区分（training-induced vs base-model-dependent）成为双刃剑：区分本身是
  honest science，但 reviewers 会追问 "如果 L1 heads 来自预训练，training 到底贡献了什么？"。 三层级梯度仅 1 个
  Tier-2 数据点（OXE openvla-7b），被降为 suggestive observation。 CF sensitivity ratio 被 OpenVLA
  OXE baseline 的高 CF 拉低（OXE 本身 d≈1.0， 训练后仅 d≈1.15，ratio 仅 1.1×），与 TracVLA 10× 形成鲜明对比，
  暴露 "cross-architecture CF ratio" 实际是 "cross-baseline CF ratio" 问题。 NORA 仅 2/4 suites
  被视为 incomplete。C3 移入 appendix。 需要 1 个轻量 additional analysis 补偿 contribution density，
  推荐 exit-collapse-rate analysis（无新 GPU 成本，用已有 R² profiles 计算 exit 层衰减斜率）。 仍可 accept
  但需要 reviewer champion，accept probability ≈ 0.35。

  '

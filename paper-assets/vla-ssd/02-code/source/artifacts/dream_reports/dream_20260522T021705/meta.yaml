    ## Key Recommendations for Revision


    1. **[Essential] Add NLP fine-tuning control.** Fine-tune Llama-2 on an NLP supervised
    task (e.g., instruction following or summarization) and run the same R² exit analysis.
    This single experiment would resolve whether exit collapse is VLA-specific or
    generic.


    2. **[Essential] Add behavioral validation.** Even one intervention experiment
    connecting representational findings to task performance would transform the paper''s
    fit for CoRL. Candidates: (a) early-exit decoding to test whether intermediate-layer
    representations outperform exit representations for action prediction, (b) attention
    masking on identified routing heads to measure behavioral impact.


    3. **[Important] Resolve the baseline fairness issue.** Use NLP-fine-tuned LLMs
    (or at minimum, VLMs fine-tuned on non-robotic tasks) as CF sensitivity baselines
    instead of random-init or base VLM models.


    4. **[Important] Add per-layer RSA curves for TracVLA/NORA.** The inverted-U pattern
    cannot be claimed as general without cross-architecture verification.


    5. **[Important] Add formal statistical test for directional consistency.** A
    sign test or permutation test on the 9/10 directional result would strengthen
    the matrix analysis.


    6. **[Moderate] Fix broken references.** Multiple [? ?] citations must be resolved.


    7. **[Moderate] Compress instruction invariance experiments.** Plans 006/007/008
    all verify a structurally guaranteed null result. Compress to a single paragraph
    with Table 2 in appendix.


    8. **[Moderate] Expand related work.** Engage with mechanistic interpretability
    literature, representation compression in fine-tuning, and probing methodology
    critiques.


    9. **[Moderate] Address training-procedure confound.** Discuss or control for
    the possibility that self-trained checkpoints (TracVLA, NORA) have stronger exit
    collapse due to training procedure differences rather than architectural generality.


    ---


    ## Summary


    This paper presents a well-designed diagnostic framework for VLA representational
    analysis and demonstrates commendable scientific honesty in its self-critique.
    However, the central empirical finding (R² exit collapse) is critically confounded
    by the missing NLP fine-tuning control, the cross-architecture matrix shows high
    variability (172× range) with the community checkpoint yielding the weakest results,
    counterfactual sensitivity uses unfair baselines, and the paper lacks any behavioral
    validation connecting representational findings to robot task performance. The
    paper''s own contribution audit (Table 9) leaves only thin, questionable findings
    after removing the base-model-dependent L1 routing. While the framework itself
    is a genuine contribution, it is insufficient to stand alone at a robot learning
    venue without stronger demonstrations of its analytical value. We recommend rejection
    with encouragement to resubmit after adding the NLP fine-tuning control and behavioral
    validation experiments.


    **Verdict: Reject (4/10)**




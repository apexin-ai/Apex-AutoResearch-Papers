    \ best match similarity 0.22 below threshold 0.82\n- ❌ `hewitt2019` — 在线验证未找到匹配（疑似虚假引用）:\
    \ best match similarity 0.32 below threshold 0.82\n- ⚠️ `neo2025` — 元数据不匹配: first_author:\
    \ bib=neo vs api=leng\n- ⚠️ `lakens2017equivalence` — 元数据不匹配: title: similarity=0.34\

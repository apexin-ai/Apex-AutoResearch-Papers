  review_report: "---\ndream_id: dream_20260522T021705\ntier: best\noverall_score:\
    \ borderline (5.5/10)\ntimestamp: 2026-05-22T03:19:58.974322+00:00\n---\n\n# Dream\
    \ Review Report: Architecture-Independent Routing Reorganization in Vision-Language-Action\
    \ Models\n\n**Venue:** CoRL 2026  \n**Review Mode:** Full (2 Reviewers + Roundtable)\
    \  \n**Date:** 2026-05-22  \n\n---\n\n## Venue Calibration\n\nCoRL review criteria\
    \ sourced from CoRL 2023 reviewer guidelines and CoRL 2024 review instructions.\
    \ Dimensions: Originality, Quality, Clarity, Significance, Relevance. Scale: 1–10\
    \ (aligned with CoRL 2023; CoRL 2024 acceptance rate ~39%, historical ~30–40%).\
    \ Papers evaluated on significance and novelty of results, relevance to robot\
    \ learning, and potential for scientific/technological impact.\n\n---\n\n## Paper\
    \ Summary\n\nThis paper presents a token-level analysis framework for understanding\
    \ how VLA fine-tuning reshapes internal instruction routing. Applied to three\
    \ VLA families (OpenVLA/Llama-2-7B, TracVLA/Phi-3-mini, NORA/Qwen2.5-VL-3B) across\
    \ four LIBERO task suites (10 of 12 matrix cells populated), the paper identifies\
    \ two architecture-independent training signatures: (1) R² exit collapse (trained\
    \ Δ=0.12–0.69 vs untrained Δ=0.01–0.08, confirmed in 9/10 cells), and (2) heightened\
    \ counterfactual sensitivity (claimed 7–10× amplification). A three-tier routing\
    \ gradient is proposed: VLM base → OXE VLA → task-finetuned VLA. The paper additionally\
    \ distinguishes training-induced effects from base-model-dependent effects (L1\
    \ attention heads) and reports metric-dependent RSA/CKA findings on vision encoder\
    \ geometry.\n\n---\n\n## Reviewer 1 (R1): Methods + Experiments\n\n### Scores\n\
    | Dimension | Score |\n|-----------|-------|\n| Quality | 6 |\n| Clarity | 7 |\n\
    | Significance | 5 |\n| Relevance | 6 |\n| **Overall** | **6 (Weak Accept)** |\n\
    | Confidence | 4/5 |\n\n### Strengths\n1. **Rigorous factorial design.** The 3-architecture\
    \ × 4-suite matrix with trained/untrained controls is well-structured. The use\
    \ of multiple converging analyses (probing, attention, R², RSA, CKA, counterfactual)\
    \ with appropriate statistical methodology (bootstrap CIs, significance testing)\
    \ lends credibility.\n2. **R² exit collapse is convincing.** 9/10 cells across\
    \ three architecturally distinct backbones (Llama-2 MHA, Phi-3 MHA, Qwen2.5-VL\
    \ GQA) is a robust empirical result. The mean Δ=0.226 for trained vs 0.032 for\
    \ untrained is a clear signal.\n3. **Training-vs-inherited decomposition.** The\
    \ demonstration that L1 attention routing is base-model-dependent (Table 9) is\
    \ a genuine contribution that corrects a potential misattribution. The OXE-pretrained\
    \ OpenVLA comparison (25/32 untrained → 24/32 trained) is particularly convincing.\n\
    4. **Transparent metric reporting.** The RSA vs CKA ordering reversal (Table 17)\
    \ is honestly reported and framed as enriching rather than undermining the findings.\
    \ All geometric claims are explicitly qualified by metric.\n5. **OFT outlier handling.**\
    \ The single exception (OpenVLA Long, Δ=0.004) is well-explained via the parameter-efficient\
    \ fine-tuning mechanism, with TracVLA Long (Δ=0.198, full fine-tuning, same suite)\
    \ providing a direct control.\n\n### Weaknesses\n1. **No closed-loop behavioral\
    \ validation.** The paper operates entirely in open-loop analysis. The finding\
    \ that removing 24/32 instruction-dominant heads does not increase MSE (mentioned\
    \ in the ablation result for the attention heads) creates an interpretive puzzle:\
    \ if instruction routing is so prominent, why does ablating it have no measurable\
    \ effect on action quality? This undermines claims about the functional importance\
    \ of the discovered routing patterns.\n2. **Counterfactual \"7–10× amplification\"\
    \ is methodologically inconsistent.** Trained models use Cohen's d while untrained\
    \ VLM bases use cosine distance — these are incommensurable metrics. When the\
    \ same metric (Cohen's d) is applied to OXE-pretrained models (Tier 2), the trained\
    \ model actually shows *lower* sensitivity (d=0.96 vs OXE d=1.05 on Goal empty).\
    \ The \"7–10×\" claim only holds when comparing trained Cohen's d against untrained\
    \ VLM cosine distance, which is misleading.\n3. **\"Architecture-independent\"\
    \ is overclaimed.** All three architectures are decoder-only transformers with\
    \ causal attention. Cross-attention VLAs (e.g., RT-2 style) and diffusion-based\
    \ action heads are untested. The claim should be scoped to \"decoder-only VLAs.\"\
    \n4. **Incomplete matrix.** NORA covers only 2 of 4 suites. The three-tier routing\
    \ gradient is fully demonstrated only for OpenVLA (the only architecture with\
    \ random-init, OXE-pretrained, and task-finetuned variants). TracVLA and NORA\
    \ lack Tier 2 equivalents.\n5. **R² exit collapse is descriptive, not explanatory.**\
    \ The paper documents that exit R² drops in trained models but offers no mechanistic\
    \ explanation (why does training cause this?) and no functional assessment (is\
    \ this beneficial, neutral, or detrimental to task performance?).\n6. **Table\
    \ 2 discrepancy.** The paper claims \"six probing methods agree\" but shows only\
    \ 2 of 6 (temporal ρ and action R²). The remaining 4 methods' results are not\
    \ presented, making this claim unverifiable.\n7. **Exit R² values in Table 5 are\
    \ approximate.** Values reported as \"~0.45,\" \"~0.55,\" \"~0.35\" for a paper\
    \ making quantitative claims about Δ magnitudes is imprecise.\n\n### Questions\
    \ for Authors\n1. Can you explain the ablation result where removing instruction-dominant\
    \ heads has no effect on action MSE? Does this suggest the routing patterns you\
    \ document are epiphenomenal?\n2. Why report CF amplification as \"7–10×\" when\
    \ this conflates different metrics? What is the amplification when using the same\
    \ metric?\n3. Can you show the remaining 4 methods from the 6-method validation\
    \ (Table 2)?\n4. What is the exact (not approximate) exit R² for the full-layer\
    \ scan (Table 5)?\n\n---\n\n## Reviewer 2 (R2): Novelty + Related Work\n\n###\
    \ Scores\n| Dimension | Score |\n|-----------|-------|\n| Originality | 5 |\n\
    | Clarity | 7 |\n| Significance | 5 |\n| Relevance | 6 |\n| **Overall** | **5\
    \ (Weak Reject)** |\n| Confidence | 3/5 |\n\n### Strengths\n1. **Cross-architecture\
    \ scope is the strongest novelty claim.** No prior work has applied systematic\
    \ interpretability analysis across multiple VLA backbone families. Testing on\
    \ Llama-2, Phi-3, and Qwen2.5-VL with different attention mechanisms (MHA vs GQA)\
    \ provides genuine breadth.\n2. **Trained-vs-untrained decomposition is insightful.**\
    \ Separating what fine-tuning creates (exit collapse, CF sensitivity) from what\
    \ the base model provides (L1 routing) is a useful conceptual contribution. The\
    \ finding that training *reduces* instruction-dominant heads in TracVLA (32/32\
    \ → 27–30/32) is counterintuitive and valuable.\n3. **Scientific honesty.** The\
    \ paper consistently qualifies claims: metric dependence is acknowledged, the\
    \ OFT outlier is not swept under the rug, and the RSA observation is framed as\
    \ \"qualified.\" This is commendable.\n\n### Weaknesses\n1. **Methods are established\
    \ tools applied to a new domain.** Probing classifiers, RSA, CKA, attention analysis,\
    \ and counterfactual perturbation are all well-established in the transformer\
    \ interpretability literature. The paper does not propose new analytical methods\
    \ — it combines existing tools and applies them to VLAs. The \"framework\" contribution\
    \ (C1) is more of an application recipe than a methodological advance.\n2. **Sparse\
    \ related work.** Only 7 references is insufficient for a paper making broad claims\
    \ about VLA internals. Missing citations include:\n   - LLM interpretability work\
    \ (e.g., Elhage et al., Conmy et al. on circuit discovery)\n   - Multimodal transformer\
    \ analysis (e.g., work on CLIP internals, VLM representation structure)\n   -\
    \ Other VLA architectures beyond those tested (RT-2, Octo, π₀)\n   - Probing methodology\
    \ critiques (beyond Belinkov 2022)\n   - Robot representation learning literature\n\
    3. **Three-tier gradient is partially predictable.** The progression from \"no\
    \ routing\" (VLM base) to \"general routing\" (OXE pretraining on 970K episodes)\
    \ to \"task-specific routing\" (fine-tuning) is the expected outcome of progressive\
    \ training stages. The finding confirms a hypothesis rather than revealing a surprise.\
    \ The interesting question — *what changes at each transition* — is addressed\
    \ but only descriptively.\n4. **Asymmetric untrained baselines weaken cross-architecture\
    \ comparisons.** OpenVLA has three tiers (random init, OXE-pretrained, task-finetuned),\
    \ but TracVLA and NORA only have two (VLM base, task-finetuned). This means the\
    \ three-tier gradient is really only validated for one architecture. The claim\
    \ of \"architecture-independent\" three-tier gradient is underdetermined.\n5.\
    \ **OpenVLA-centric structure.** Despite claiming three-architecture generality,\
    \ the paper's detailed analyses (full-layer R² scan, RSA profiles, L1 attention\
    \ breakdown, three-tier gradient tables) are predominantly OpenVLA results. TracVLA\
    \ and NORA appear mainly as confirmation in the R² exit collapse matrix (Table\
    \ 3) and scattered references.\n6. **No actionable design implications.** The\
    \ paper claims findings \"provide mechanistic grounding for VLA architecture design\
    \ and training diagnostics\" but offers no concrete recommendations. What should\
    \ a practitioner do differently based on these findings?\n7. **Relevance gap for\
    \ CoRL.** CoRL values contributions to robot learning systems. A pure representational\
    \ analysis paper with no closed-loop evaluation, no new method, and no demonstrated\
    \ impact on robot performance may be more appropriate for a workshop (e.g., ICML\
    \ interpretability workshop) or a journal.\n\n### Questions for Authors\n1. How\
    \ does this work differentiate from standard transformer interpretability applied\
    \ to a new model class? What is VLA-specific about the framework beyond the token\
    \ position decomposition?\n2. Can you demonstrate any actionable design implication?\
    \ For example, can exit collapse magnitude predict downstream task performance?\n\
    3. Why were only 7 references included? Are there related works in LLM interpretability\
    \ or multimodal analysis that should be discussed?\n4. Can the three-tier gradient\
    \ be validated for TracVLA or NORA (do intermediate pretraining checkpoints exist)?\n\
    \n---\n\n## Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\n**R1 reacting\
    \ to R2:**\n- Agrees on: closed-loop validation gap (independently flagged), LIBERO-only\
    \ limitation, OpenVLA-centric structure, asymmetric baselines concern.\n- Disagrees\
    \ on: \"established tools = insufficient novelty\" undersells the contribution\
    \ — the *findings* (exit collapse across architectures, training-vs-inherited\
    \ separation) are novel even if the tools are not. Predictable hypotheses still\
    \ require empirical verification.\n- Score unchanged: 6/10.\n\n**R2 reacting to\
    \ R1:**\n- Agrees on: ablation puzzle (removing heads with no MSE effect) is serious,\
    \ CF \"7–10×\" metric inconsistency is sharp and well-taken, \"architecture-independent\"\
    \ overclaimed for decoder-only only.\n- Acknowledges: R² exit collapse in 9/10\
    \ cells deserves more credit than initially given.\n- Disagrees on: methodological\
    \ rigor does not overcome the fundamental issue of no closed-loop validation for\
    \ a robotics venue.\n- Score unchanged: 5/10.\n\n### Step 3: Convergence\n\n**Consensus\
    \ (both reviewers agree):**\n1. ✅ No closed-loop behavioral validation is a significant\
    \ gap for a CoRL submission\n2. ✅ CF \"7–10× amplification\" claim is methodologically\
    \ inconsistent (different metrics for trained vs untrained)\n3. ✅ \"Architecture-independent\"\
    \ should be scoped to \"decoder-only VLAs\"\n4. ✅ Asymmetric untrained baselines\
    \ weaken cross-architecture claims\n5. ✅ Table 2 shows only 2 of 6 claimed methods\
    \ — unverifiable\n6. ✅ R² exit collapse (9/10 cells) is empirically robust and\
    \ the paper's strongest result\n7. ✅ Training-vs-inherited decomposition (L1 heads)\
    \ is a genuine contribution\n8. ✅ Writing quality and scientific transparency\
    \ are above average\n9. ✅ Paper is OpenVLA-centric despite cross-architecture\
    \ framing\n\n**Remaining disagreement:**\n- R1 considers the empirical findings\
    \ (exit collapse, three-tier gradient) sufficient for main conference with minor\
    \ revisions; R2 considers established-tools-applied-to-new-domain insufficient\
    \ novelty for main conference without behavioral validation.\n\n### Step 4: Synthesis\n\
    \n**Consolidated Assessment: Borderline (5.5/10)**\n\nThe paper makes a credible\
    \ empirical contribution: the R² exit collapse phenomenon (9/10 cells, mean Δ=0.226)\
    \ is well-documented across three decoder-only VLA architectures, and the training-vs-inherited\
    \ decomposition of L1 attention routing is insightful. The writing is clear and\
    \ scientifically honest.\n\nHowever, several issues prevent a confident accept\
    \ recommendation:\n\n1. **The CF amplification claim (C2b) is partially invalid.**\
    \ The \"7–10×\" figure conflates incommensurable metrics. When measured consistently\
    \ (OXE Cohen's d), trained sensitivity is actually *lower* than untrained. This\
    \ needs correction or reframing.\n\n2. **The three-tier gradient (C3) is only\
    \ fully validated for one architecture.** Without intermediate pretraining checkpoints\
    \ for TracVLA and NORA, this claim rests on a single architecture (OpenVLA).\n\

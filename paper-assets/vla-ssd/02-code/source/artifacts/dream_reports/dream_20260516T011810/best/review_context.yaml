narrative_guidance: '原始 framing 完全成立。CLIP-ViT 作为独立 VL-pretrained encoder 落入 SigLIP
  附近区间， 消除 SigLIP-specific confound，将 Claim 1 从 "SigLIP dominance" 升级为 "VL-pretrained
  encoder dominance"。LIBERO-Spatial 全面复现核心排序和训练不变性，将所有 Claim 的 泛化范围从 single-benchmark
  扩展到 cross-benchmark。CKA-RSA dissociation 在两个 benchmark 上均成立，作为第四个 finding 稳固。标题
  "Where Do Actions Come From?" 可用。

  '

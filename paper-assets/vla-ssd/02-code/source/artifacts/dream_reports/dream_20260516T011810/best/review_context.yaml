    RSA， (4) per-layer degradation curve，(5) bootstrap CI on training effect， (6)
    functional probe (projector / LLM img_mean / readout / untrained readout)， (7)
    CKA verification。验证三条 Claim 跨 benchmark 泛化。

    '

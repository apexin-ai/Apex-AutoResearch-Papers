  figures_description:
  - 'Bar chart: RSA ρ 四组对比 (SigLIP / CLIP / VLA_img_mean / DINO)，含 bootstrap 95% CI
    error bars。关键视觉信息：SigLIP 和 CLIP 的 CI 重叠，两者均显著高于 DINO。中间插入 VLA_img_mean 显示 LLM
    degradation 效应。'
  - 'Scatter plot (supplementary): CLIP ViT-L per-task RSA vs SigLIP per-task RSA，10
    个点沿对角线分布，Pearson r > 0.85，说明两个 VL encoder 在 task 维度上行为一致。'
  analysis: 'CLIP RSA=0.553 落入 best tier 预期的 [0.50, 0.60] 区间。与 SigLIP 的差异 不显著（p=0.08,
    CI 包含 0），而与 DINO 差异高度显著（p=0.001）。这建立了一个 clean 的三级结构：VL-pretrained encoder 族 (SigLIP
    ≈ CLIP, RSA ~0.55-0.62) >> Self-supervised (DINO, RSA ~0.39) >> LLM degraded (img_mean
    ~0.50)。 Functional probe R² 的三方近似相等（DINO 0.712 ≈ SigLIP 0.706 ≈ CLIP 0.695） 再次确认
    geometric-functional dissociation：action information 的存在（R²）不依赖 pretraining 方式，但几何对齐（RSA）依赖
    VL pretraining。 论文 Claim 1 可从 "SigLIP dominance" 安全地泛化为 "VL-pretrained encoder
    dominance"。 Discussion 中将 SigLIP vs CLIP 的微小差异归因于 loss function 差异（sigmoid vs
    softmax） 和 OpenVLA projector 的 SigLIP-specific 训练，但强调这不影响主结论。

    '

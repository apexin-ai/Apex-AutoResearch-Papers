  result_rationale: 'LIBERO-Spatial 与 LIBERO-Goal 共享相同的 LIBERO kitchen 环境和物体集，但 task
    定义侧重空间关系（"put X next to Y", "put X on top of Y"）而非目标状态差异。 这意味着：(1) 视觉场景相似度更高（物体相同，只是空间配置不同），action
    空间的 task 间区分度可能略低，预期 RSA 绝对值略低于 LIBERO-Goal（SigLIP 0.587 vs 0.615， 差约 5%）；(2)
    但相对排序不变——VL pretraining 赋予的 semantic geometric alignment 不依赖 task 定义方式，SigLIP
    和 CLIP 在 spatial reasoning 上同样优于 DINO； (3) 训练不变性甚至可能更强——LIBERO-Spatial 的 action
    分布更集中（主要是 pick-place 的空间变体），LLM 层面的 distributed representation 更难区分 trained/untrained。

    Readout concentration 的 effect size 预期与 LIBERO-Goal 高度一致（Δ≈0.046）， 因为 readout
    机制是 architecture-level 行为：self-attention 将 image token 信息 汇聚到 prediction position
    的能力由训练学得，与具体 benchmark 的 task 定义无关。 Untrained readout R²=0.669 仍低于 projector 0.688，确认
    redistribution requires training。

    DINO 在 LIBERO-Spatial 上 action R² 同样接近 projector（0.693 vs 0.688）， 但 RSA gap 扩大（0.371
    vs 0.587，gap=0.216 > LIBERO-Goal 的 0.227），因为 spatial task 更依赖 semantic layout
    understanding，DINO 的 geometric structure 更不匹配。这进一步强化 geometric-functional dissociation。

    CKA 排序反转在 LIBERO-Spatial 上同样复现（untrained > trained > projector > DINO）， 因为 CKA
    捕捉的 global structure preservation 是 LLM 架构的固有属性，不依赖 benchmark。

    '

    - 0.25
    bootstrap_clip_vs_dino_p: 0.001
    clip_vit_action_probe_R2: 0.695
    clip_vit_action_delta_R2: 0.108
    clip_vit_linear_cka: 0.076
    clip_vit_rdm_cka: 0.248
    rsa_ordering: SigLIP (0.615) > CLIP (0.553) > DINO (0.388)
    probe_ordering: DINO (0.712) ≈ SigLIP (0.706) ≈ CLIP (0.695) >> LLM_img_mean (0.683)
    cka_ordering: SigLIP (0.081) ≈ CLIP (0.076) > DINO (0.066)
  result_rationale: 'CLIP ViT-L 与 SigLIP 同属 VL contrastive pretrained encoder 族，训练目标均为
    image-text alignment（CLIP 用 softmax cross-entropy，SigLIP 用 sigmoid pairwise loss）。
    两者在 ImageNet zero-shot 上表现接近（CLIP ViT-L ~75.5%, SigLIP ~78%），说明 learned visual
    representation 质量相当。RSA 预测 CLIP 略低于 SigLIP（0.553 vs 0.615） 有两个原因：(1) SigLIP 的
    sigmoid loss 更好地保留 fine-grained 距离结构（softmax 跨 batch normalization 会压缩 hard negative
    的梯度信号），(2) OpenVLA 的 projector 是针对 SigLIP 输出空间训练的，CLIP 特征经过不同的 normalization 和
    embedding space， 几何对齐自然略差。但 CLIP 远高于 DINO（+0.165）是因为 VL pretraining 赋予的 language
    grounding 使 representation 空间的距离结构天然更贴近 task-conditioned action structure——action
    空间由 language-described goals 划分，VL encoder 在 pretraining 时已学会按语义组织视觉特征。DINO 虽然
    action R² 与 VL encoder 相当（self-supervised 特征包含充分的 positional/state 信息），但其几何结构按
    visual similarity 而非 semantic similarity 组织，导致 RSA 低。CLIP vs SigLIP 的 bootstrap
    CI 预计包含 0（p~0.08），说明两者差异不显著——这正是 best tier 所需： 证明 VL pretraining 是通用有效的，而非 SigLIP
    特异的。

    '

- name: CLIP-ViT Pretraining Control
  plan_id: plan_012
  description: '用 CLIP ViT-L/14 (OpenAI) 替代 SigLIP 作为 standalone vision encoder， 提取
    LIBERO-Goal 相同 10 task 的特征，计算 RSA、CKA、functional probe R²， 与 SigLIP+Projector
    和 DINO 三方对比。目的：区分 "VL pretraining 通用贡献" vs "SigLIP 特异性"。

    '

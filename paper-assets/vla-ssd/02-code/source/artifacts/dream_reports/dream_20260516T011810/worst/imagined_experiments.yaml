    重构方向 A（routing-not-creating focus）更有可能获得 accept，因为证据集中且统计功效强。 方向 B（metric dissociation）风险更高——reviewer
    可能认为是 negative result dressed up， 但如果执行得当（CKA-RSA-R² 三重分离作为方法论框架），也有 accept 路径。
    关键：无论哪个方向，Claim 1 必须降级为 observation，否则 R1 的 score 会拖垮全文。

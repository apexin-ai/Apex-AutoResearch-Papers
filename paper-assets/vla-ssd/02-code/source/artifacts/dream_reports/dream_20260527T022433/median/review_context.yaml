    \ - Exit collapse pattern 被接受（3/4 reviewers） - 但 Reviewer 3 质疑 Δ>0.10 阈值的 principled\
    \ justification：为什么不是 0.05 或 0.15？\n  这个阈值是 ad hoc 还是有统计或领域基础？\n- Rebuttal 需要补充\
    \ sensitivity analysis：在 0.05/0.10/0.15 三个阈值下 pattern 是否稳定\n注意：OpenVLA 的 R² exit\
    \ Δ 在 v3 MCCV 修正后仅 0.033-0.086（VLA→VLA transition）， 低于 0.10 阈值。真正的 exit collapse\
    \ 来自 TracVLA/NORA（VLM→VLA transition, Δ=0.156-0.455）。 此实验建立了 baseline expectation，但\
    \ median 档位下 reviewer 会质疑 threshold choice。\n"

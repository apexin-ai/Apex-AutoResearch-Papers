- name: Counterfactual Token Overlap and Trajectory-Level Analysis
  plan_id: cf_detailed_analysis
  description: CF perturbation 的 token overlap, trajectory-level d, 和 ΔMSE 扩展分析
  expected_results:
    token_overlap_spearman: 1.0
    empty_d_token: 0.968
    empty_d_trajectory: 3.438
    wrong_d_token: 0.844
    wrong_d_trajectory: 3.798
    shuffled_d_token: 0.625
    shuffled_d_trajectory: 2.595
    para_d_token: 0.697
    para_d_trajectory: 2.131
    inflation_factor_mean: 0.245
    gt_mse_original: 0.498
    gt_mse_top24_ablated: 0.497
    gt_mse_delta: -0.001
  result_rationale: '数据已完成。Worst 档下 token overlap analysis 被反过来用：


    "Spearman ρ=1.0 between token novelty and Cohen''s d 说明 CF sensitivity 完全由

    lexical/positional distance 驱动，不是 semantic distance。Empty（最大 token novelty）→

    largest d，shuffled（same tokens, different order）→ moderate d，paraphrased（high
    overlap）→

    smallest d。这不是 ''the model understands instruction semantics''——这是 ''the model
    responds

    to surface-level token changes''。任何 autoregressive language model 都会如此。"


    Trajectory-level d（2.1-3.8）远大于 token-level d（0.6-0.97）——inflation factor ~4x。

    Worst reviewer："trajectory-level inflation 说明 per-timestep effects 累积——这不是

    ''stronger evidence of routing'' 而是 ''autocorrelation amplification''。每个 timestep

    的小 perturbation 通过 temporal autocorrelation 累积成大 trajectory difference，

    这是 dynamical systems 的 trivial property 不是 routing evidence。"


    GT MSE unchanged（0.498 vs 0.497）再次确认 CF perturbation 不影响 action quality。

    '

- name: Cross-Architecture Counterfactual Sensitivity
  plan_id: cross_arch_cf
  description: 3 架构 CF sensitivity — trained vs untrained 对比
  expected_results:
    openvla_goal_trained_d: 1.182
    openvla_goal_untrained_d: 1.048
    openvla_spatial_trained_d: 1.173
    openvla_spatial_untrained_d: 0.936
    tracvla_goal_trained_d: 1.524
    tracvla_goal_untrained_cos: 0.153
    nora_goal_trained_cos: 1.0
    nora_goal_untrained_cos: 0.081
    incommensurable_pairs: 5
    fair_comparison_pairs: 2
    openvla_goal_fair_delta: 0.134
    openvla_spatial_fair_delta: 0.237
  result_rationale: 'D097/D099 修正后，CF sensitivity 的 cross-architecture 对比面临 incommensurability
    问题：

    TracVLA/NORA untrained 无法生成 actions（cosine in hidden space），trained 用 Cohen''s
    d

    in action space——两个 metrics 不可直接比较。只有 OpenVLA 的 trained + untrained 都能生成

    actions，可用同一 metric 比较。


    Worst-tier reviewer 攻击：

    "CF sensitivity 是你们仅存的两个 training-induced effects 之一（D090 后），但：

    (1) 你们自己承认 5/7 cross-architecture comparisons 使用 incommensurable metrics（Cohen''s
    d

    vs cosine distance）。你不能 claim ''training amplifies CF sensitivity'' 如果 trained
    和

    untrained 用不同 metrics 测量——这不是 methodological nuance，这是 fundamental flaw。

    (2) 唯一公平对比（OpenVLA Goal/Spatial）显示 Δ=+0.13/+0.24，即 trained 比 untrained

    高 12%/25%。但 OpenVLA untrained 是 OXE-pretrained VLA（已有 strong CF d=1.048），

    所以 ''training amplification'' 是 VLA→VLA marginal improvement 而非 VLM→VLA dramatic
    change。

    (3) ''Empty instruction produces largest deviation'' 在 6/8 settings——这不需要 VLA-specific

    routing 来解释。任何 conditioned generative model 在 input 被完全移除时 output 会 change most。

    这是 conditioning 的 definition 而非 routing mechanism。

    (4) CF sensitivity 没有 behavioral grounding：output changes（d=0.65-1.5）是否

    导致 task failure？如果 perturbed instructions 产生 different but equally valid actions，

    CF sensitivity 不是 routing evidence 而是 representational noise。

    缺少 behavioral validation（closed-loop success rate under perturbation）是 near-fatal

    for CoRL submission。"

    '

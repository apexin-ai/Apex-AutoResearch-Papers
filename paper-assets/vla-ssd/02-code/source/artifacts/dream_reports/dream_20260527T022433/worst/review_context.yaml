    random_24_z_score: -2.73
    specificity_ratio: 1.08
    instruction_d: 0.651
    random_24_d: 0.601
    image_24_d: 0.58
    gt_error_delta_mse: -0.001
  result_rationale: '数据已完成。Worst 档下 ablation 结果被严厉解读：


    (1) Specificity ratio = 1.08x 极弱："instruction-dominant 24 heads 的 per-head effect

    不比 random 24 heads 大多少（z=-2.73 但 effect size tiny）。任何 24/32 heads ablation

    产生 similar or larger R² increase（random 24 mean delta = 0.077 > instruction 24
    delta = 0.042）。

    Instruction-dominant heads 不是 special——they''re 75% of all heads，removing ANY
    75%

    of heads produces similar effects。"


    (2) ΔMSE≈0 vs ground-truth 是 worst tier 最致命的 finding："你 ablate 24 instruction-dominant

    heads，action outputs change direction (d=0.65) 但 ground-truth error 不变（ΔMSE=-0.001,
    p=0.52）。

    这意味着 instruction routing 对 action quality 无影响——perturbation 改变 output 方向

    但不改变 output 质量。这直接证明 CF sensitivity 缺乏 functional significance。

    如果移除 75% 的 ''instruction routing heads'' 对 action quality 无影响，

    那 instruction routing 在 action generation 中可能是 redundant mechanism。"


    (3) Information-computation dissociation 解读在 worst tier 下被反转：论文 cite Hewitt &
    Liang 2019

    作为 "ΔMSE≈0 is expected under dissociation"，但 reviewer 说：

    "Hewitt & Liang 的 point 是 probe results don''t prove representation is functionally
    used。

    你在用他们的 framework 来 excuse 你的 negative result。ΔMSE≈0 doesn''t support ''routing

    modulates without degrading''——it supports ''routing doesn''t matter for output
    quality''。"


- name: CKA verification
  plan_id: plan_009
  description: CKA 指标验证 RSA 发现的 metric robustness
  expected_results:
    linear_cka_ordering: untrained > trained > projector > DINO
    rsa_ordering: projector > trained > untrained > DINO
    ordering_reversal: true
    last_preaction_cka: 0.127
  result_rationale: '数据不变。CKA-RSA dissociation 在 worst 档下变得 doubly 致命。

    第一层攻击（保持不变）："如果 CKA 说 untrained > trained 而 RSA 说 trained > untrained，

    那哪个 metric 才反映 ''action-relevant information''？你选了 RSA 来讲 story，但另一个

    equally principled metric 给出相反结论。这不是 metric dissociation finding——

    这是 your conclusions are metric-dependent 的 admission。"

    第二层攻击（D095 升级后更致命）："你们现在 claim R² exit collapse 是跨架构一致的

    VLM→VLA signature。但 R² 本身是 functional metric（probe-based），RSA 是 geometric metric，

    CKA 是 kernel-based metric。如果不同 metrics 给不同结论，你凭什么用 R² 的 exit collapse

    而不是 CKA 的 no-collapse 来 claim ''architecture-independent signature''？

    你的 framework 应该 reconcile 这些 metrics 而不是 pick 对你有利的那个。"

    '

    \ robot actions，exit layer 表征当然会被 action training reshape。\nR²≈0.155 in NLP models\
    \ 只是说明 NLP models 没有 action-relevant information 在任何层\n（Ridge 只拟合 between-task\
    \ variance）——当然不会有 exit collapse。\n你排除了一个 straw-man confound 但没有建立 positive value。\n\
    A good control experiment answers 'is this finding real?' — yours answers 'is\
    \ this finding\neven more trivially explainable than I thought?'  答案是 No，但 the\
    \ finding is still trivial。\"\n\nR²=0.155 本身是 between-task variance baseline（10\
    \ tasks → Ridge 可拟合 task identity → \n0.155 R² from 10-way between-task variance\
    \ alone）——这是 expected 而非 surprising。\n"

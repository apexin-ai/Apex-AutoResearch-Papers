    - 24
    - 30
    - 13
    tier3_exit_collapse_vlm_origin: true
    tier3_exit_collapse_vla_origin: false
    tier2_n_datapoints: 1
  result_rationale: '三层级梯度被 worst reviewer 驳为 post-hoc narrative with N=1 at Tier-2。


    攻击 1 — 统计力不足："Tier-2 只有一个数据点（openvla-7b OXE pretrained）。要建立 gradient

    你需要 at minimum 3 个独立的 OXE-pretrained 或 general-pretrained VLA checkpoints 来

    验证 Tier-2 不是 openvla-7b specific。Three points don''t make a gradient if the middle

    one is N=1——那是 step function with one interpolation point。"


    攻击 2 — L1 heads 在 tiers 间不单调："Tier-1 Phi-3-Vision = 32/32, Tier-2 OXE = 25/32,

    Tier-3 TracVLA = 27-30/32。Tier-1 > Tier-2 ≈ Tier-3——这不是 gradient，这是 ''base model

    already saturated then training reduces some heads''。L1 head count 不支持 gradient
    narrative。"


    攻击 3 — Exit collapse 不支持 gradient："Tier-2 无 exit collapse, Tier-3 有 exit collapse

    只在 VLM→VLA origin models——这是 binary transition 不是 gradient。如果 Tier-3 只在

    VLM-origin 有 collapse 而 VLA-origin 没有，那 ''gradient'' 应该有 collapse 强度在 Tier-2→Tier-3

    increasing——但 Tier-2 = 0, Tier-3 (VLA origin) = 0。只有 Tier-3 (VLM origin) 有 collapse。

    这是 binary (VLM→VLA collapse exists / doesn''t) 不是 three-tier gradient。"


    攻击 4 — libero_finetuned attention data 反驳 gradient："L31 exit engagement 从 bridge-VLA

    (18 heads) 到 libero-finetuned (0 heads)——further specialization REDUCES exit routing。

    Gradient predicts ''more training = more routing'' 但 data shows opposite at exit
    layer。"


narrative_guidance: 'Reviewers 认为 exit collapse 是 trivially expected（VLM→VLA 当然改变表征），CF
  无 behavioral grounding 缺乏 functional significance，

  论文被视为 descriptive analysis without actionable insight。D100 NLP control（Llama-2-chat
  ΔR²=0.000）虽然排除了 generic fine-tuning

  confound，但 worst-tier reviewer 将此重新解读为："好，exit collapse 不是 generic fine-tuning 的——但它仍然是
  trivially expected

  的 VLM→VLA transition effect。当你把 language model 改造成 action model，出口层表征当然会重组——这不需要你的
  framework 来''发现''。"

  D102 的 VLM→VLA vs VLA→VLA 二元分离被反过来论证："你自己证明了 exit collapse 是 one-time transition
  artifact，不是 ongoing

  routing mechanism。它在 VLA→VLA finetuning 时消失（0/4），说明它不是 functional routing signature
  而是 initial adaptation shock。

  这反而削弱了 exit collapse 作为 ''diagnostic tool'' 的价值——它只能告诉你 ''这个模型曾经从 VLM 变成 VLA''，这在实践中谁不知道？"

  Reframe 方向：从 "discovering routing mechanisms" 转为 "diagnostic methodology for VLA
  development"。核心 pitch 变为：

  本文提供第一个系统化的 VLA representational profiling toolkit，跨 3 架构验证。但 worst-tier 下即使此 reframe
  也被质疑：

  "一个 diagnostic framework 如果主要发现是 trivially expected（exit collapse）和 functionally
  unvalidated（CF sensitivity），

  那 framework 的 utility 在哪里？你需要 demonstrate 这个 framework 能发现 non-obvious actionable
  insights。"

  '
imagined_experiments:
- name: SigLIP+Projector RSA vs Full VLA vs DINO
  plan_id: plan_001
  description: SigLIP+Projector RSA 对比 Full VLA 和 DINO，证明 action-relevant 结构源自 frozen
    vision encoder
  expected_results:
    siglip_projector_rsa: 0.615
    trained_with_inst_rsa: 0.488
    untrained_with_inst_rsa: 0.485
    dino_rsa: 0.388
    llm_degradation_delta: 0.127
  result_rationale: '数据已完成不变。在 worst 档下，此实验仅覆盖 OpenVLA 的 DinoSigLIP encoder。Reviewer
    攻击路线：

    "SigLIP+Projector RSA=0.615 是 OpenVLA-specific frozen encoder 的观察。TracVLA 用 Phi-3-Vision
    encoder，

    NORA 用 InternViT——你们没测这些 encoder 的 RSA。单架构 encoder analysis 无法 claim architecture-independent。"

    LLM degradation（0.615→0.488）本身被视为 "trivially expected—— LLM 的 intermediate processing
    当然会

    改变 representation geometry，这不是 finding 而是 definition。" 在 diagnostic framework
    reframe 下，

    此实验降为 "framework 在 OpenVLA 上的 case study"——不再是 core contribution。更致命的是，Reviewer
    会用

    这个实验反过来攻击论文 motivation："如果 frozen encoder 已经提供了最好的 action-relevant structure（RSA=0.615），

    而 LLM processing 只是 degrade 它（到 0.488），那为什么要研究 LLM 内部的 instruction routing？问题不在
    routing

    而在 LLM 设计本身——你应该研究如何让 LLM 不 degrade encoder output。"

    '
  tables:
  - title: SigLIP RSA Scope Limitation (Worst-Tier)
    columns:
    - Source
    - RSA
    - Architecture Coverage
    - Worst Interpretation
    rows:
    - - SigLIP+Proj
      - '0.615'
      - OpenVLA only
      - Cannot generalize to other VLA encoders
    - - VLA trained
      - '0.488'
      - OpenVLA only
      - Llama-2-specific LLM degradation
    - - VLA untrained
      - '0.485'
      - OpenVLA only
      - Random-init Llama-2 specific
    - - DINO
      - '0.388'
      - Standalone
      - Reference baseline, unaffected
  figures_description:
  - Bar chart 标注 'OpenVLA only' 在每个 bar 上方，突显 single-arch limitation
  analysis: 'Framework reframe 下此实验从 C1 core evidence 降为 Section 4.1 case study。价值在于
    demonstrate

    framework 的 encoder-LLM decomposition 能力，而非 claim 本身。Reviewer 不会因此给分但也不会因此扣分——

    neutral contribution in worst tier。但 LLM degradation finding 可能被用来攻击论文 motivation
    本身。

    '
- name: DINO baseline RSA
  plan_id: plan_002
  description: Standalone vision model 参照基线
  expected_results:
    dino_rsa: 0.388
    dino_action_R2: 0.687
    dino_subtask_auc: 0.972
  result_rationale: '数据不变。Worst 档下 DINO 的角色被 weaponize：R²=0.687 对比 VLA 训练后的 exit R²
    drop。Reviewer：

    "DINO（self-supervised, 无 language, 无 action training）的 action probe R²=0.687 已经很高，

    说明 action prediction 主要是 visual task。你们声称的 VLA 训练重组 instruction routing，但如果一个

    纯视觉模型无需任何 instruction 就能达到 R²=0.687，instruction routing 的 practical value 是什么？

    这反而证明了 Grant et al. 2026 的 visual dominance finding——instructions 在 VLA 中可能根本不重要。"

    DINO subtask AUC=0.972 进一步强化这个论点——task progress 几乎完全可从 visual features 预测，

    无需 instruction information。这直接攻击论文研究 instruction routing 的 premise。

    '
  tables: []
  figures_description:
  - DINO R²=0.687 标注在所有 cross-arch R² exit collapse 图上作为 'no-language baseline'
  analysis: 'Worst tier 下 DINO baseline 被用来论证整篇论文的 premise 可疑：如果 vision alone 足够好，

    instruction routing research 的 practical relevance 被严重削弱。Framework reframe 可以

    acknowledge 但无法完全化解这个攻击。

    '

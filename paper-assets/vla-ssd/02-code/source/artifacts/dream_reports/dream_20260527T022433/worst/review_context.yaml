    - Metric
    - Ordering
    - Implication
    rows:
    - - RSA (geometric)
      - SigLIP > T > U > DINO
      - Training degrades geometry
    - - CKA (global)
      - U > T > SigLIP > DINO
      - Training preserves/improves structure
    - - R² (functional)
      - T_lastpre > DINO ≈ Proj > T_img > U
      - Training enables routing
    - - Reviewer question
      - —
      - Framework credibility if metrics disagree?
  figures_description:

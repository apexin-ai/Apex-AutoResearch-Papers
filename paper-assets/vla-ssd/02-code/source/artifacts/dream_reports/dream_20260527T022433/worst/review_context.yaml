- name: Three-Tier Routing Gradient (D094)
  plan_id: three_tier_gradient
  description: VLM base → OXE-pretrained VLA → task-finetuned VLA 三层级路由梯度
  expected_results:
    tier1_models:
    - Phi-3-Vision
    - Qwen2.5-VL
    - random init Llama-2
    tier1_l1_heads:
    - 32
    - 14
    - 0
    tier1_cf_max_cos: 0.19
    tier1_exit_collapse: false
    tier2_model: openvla-7b (OXE)
    tier2_l1_heads: 25
    tier2_cf_d: 1.048
    tier2_exit_collapse: false

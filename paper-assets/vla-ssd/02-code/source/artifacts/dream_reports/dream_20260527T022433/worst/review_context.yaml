  analysis: 'CKA dissociation 在 worst tier 下是 double-edged：可以包装为 "why we need multi-metric

    framework" 但同时 undermines 所有 single-metric conclusions。Exit collapse 只在 R²

    下明显——如果 CKA 下不 collapse，reviewer 要求 "architecture-independent" 必须

    "metric-independent"，否则 claim 降级。

    '

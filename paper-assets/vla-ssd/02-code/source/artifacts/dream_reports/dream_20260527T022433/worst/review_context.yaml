    L1 也达到 100%——random projection 就能分离 10 个 class。你的 LOOCV 只在 untrained deep layers

    下降到 85%——这不是 ''training improves routing'' 而是 ''random weights corrupt signal
    in deep layers''。


    Image mean = 10% at all layers 是 causal mask guarantee 不是 finding。你自己承认了。


    三条件对比（trained flat 100%, llama2base saturates L5, untrained decays to 82%）的

    interpretation 也被质疑：''trained L1=99.6% vs llama2base L1=80.2%'' 看起来像 ''training


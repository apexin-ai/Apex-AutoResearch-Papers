  review_report: "---\ndream_id: dream_20260527T022433\ntier: median\noverall_score:\
    \ 5 — weak reject\ntimestamp: 2026-05-27T03:31:42.298474+00:00\n---\n\n# Dream\
    \ Review Report — CoRL 2026 Submission\n\n**Paper:** \"Token-Level Routing Analysis\
    \ of Vision-Language-Action Models: Cross-Architecture Evidence for Instruction\
    \ Routing Reorganization\"\n\n**Venue:** CoRL 2026 (acceptance rate ~32%, OpenReview\
    \ scale 1–10)\n\n**Review Mode:** Full (2 Reviewers, 4-step roundtable)\n\n---\n\
    \n## Venue Calibration\n\nCoRL uses an OpenReview 1–10 scale. Submissions are\
    \ evaluated on significance and novelty of results (theoretical or empirical),\
    \ relevance to robot learning, and must include a limitations section. Reviewers\
    \ are instructed to treat honestly reported limitations kindly. Acceptance rate\
    \ ~32%.\n\n---\n\n## Reviewer 1 — Methods & Experiments\n\n### Summary\nCross-architecture\
    \ representational analysis of three VLA models (OpenVLA, TracVLA, NORA) across\
    \ four LIBERO suites, studying how VLA fine-tuning reshapes instruction routing.\
    \ Using layer-wise R² probes, L1 attention profiling, and counterfactual perturbation,\
    \ the authors identify exit collapse as specific to VLM→VLA transitions (6/6 cells)\
    \ and absent in VLA→VLA transitions (0/4 cells) and NLP controls.\n\n### Strengths\n\
    - **S1. Well-designed cross-architecture matrix with appropriate controls.** 3×4\
    \ architecture-suite matrix (10/12 cells) with NLP finetuning controls (Llama-2-7b-chat,\
    \ Phi-3-mini-instruct, Qwen2.5-3B-Instruct) sharing backbones.\n- **S2. Statistical\
    \ rigor above typical standard.** MCCV with n=1000 demo-level splits, 10,000-iteration\
    \ bootstrap, permutation tests (p=0.008), TOST equivalence testing, Bonferroni\
    \ correction (40/45 survive), probe seed sensitivity (5 seeds, std < 0.002).\n\
    - **S3. Honest limitation reporting.** Metric incomparability (Cohen's d vs cosine\
    \ distance), ad hoc Δ>0.10 threshold, RSA/CKA divergence, and behavioral correlation\
    \ failure (ρ=0.583, p=0.10, n=9) are all candidly disclosed.\n- **S4. Convergent\
    \ evidence from distinct methods.** Probing, attention profiling, and counterfactual\
    \ perturbation address different aspects; their convergence strengthens the overall\
    \ characterization.\n- **S5. Careful confound checking.** Probe architecture sensitivity\
    \ (linear vs MLP), distance metric invariance (cosine vs Euclidean, r>0.989),\
    \ demonstration subsample sensitivity, activation diagnostics for pretrained LLMs\
    \ under visual input.\n\n### Weaknesses\n- **W1. N=2 independent VLM→VLA transitions.**\
    \ The core claim rests on exactly two independent VLM→VLA comparisons (TracVLA,\
    \ NORA). The permutation test (p=0.008) provides some statistical reassurance,\
    \ but structural diversity does not substitute for independent replications. A\
    \ third counterexample would break the pattern.\n- **W2. Δ>0.10 threshold lacks\
    \ theoretical grounding.** The sensitivity analysis shows the clean gap spans\
    \ [0.097, 0.156], but this is a post-hoc observation. The gap width of 0.059 means\
    \ a future architecture could easily fall in the ambiguous range. A continuous\
    \ measure (actual Δ R² plotted against transition type) would be more informative\
    \ than a binary threshold.\n- **W3. Metric incomparability is unresolved.** For\
    \ 6/10 counterfactual cells, trained/reference comparison uses different metrics\
    \ (Cohen's d vs cosine distance). Only within OpenVLA is same-metric comparison\
    \ possible, and there the effect is modest (Goal: Δ=+0.04; Spatial: Δ=+0.24).\
    \ The counterfactual sensitivity contribution is largely descriptive for TracVLA\
    \ and NORA.\n- **W4. No closed-loop behavioral validation.** The paper reports\
    \ a failed attempt at closed-loop evaluation (SR=0/3). For CoRL, the disconnect\
    \ between representational findings and robot behavior is a notable gap. The practical\
    \ claims (Δ R² as screening signal, mid-layer features outperforming exit, uniform\
    \ pruning) have no empirical validation.\n- **W5. NLP control is informative but\
    \ limited.** Flat R²≈0.155 across all layers in NLP controls is the noise floor\
    \ (these models have never seen robot actions). This tells us NLP finetuning does\
    \ not *create* action structure, not that it fails to *reshape* existing structure\
    \ the way VLA training does.\n- **W6. NORA Goal data point is unreliable.** Exit-layer\
    \ R²≈-0.006 may indicate probe failure rather than genuine information loss, yet\
    \ Δ=0.455 is included in the headline range (0.156–0.455). The reduced range (0.156–0.362)\
    \ excluding NORA Goal is more defensible.\n\n### Key Questions\n1. Could absence\
    \ of exit collapse in OpenVLA simply mean OXE pretraining already underwent collapse?\
    \ Plotting absolute exit-layer R² values (not just deltas) would clarify.\n2.\
    \ The 8% gap in matched-size ablation (d=0.65 vs 0.60) suggests routing is quite\
    \ distributed. Does this undermine the emphasis on instruction-dominant heads\
    \ as a meaningful category?\n3. How to distinguish the \"three-tier gradient\"\
    \ from a simpler VLM→VLA/VLA→VLA binary, given Tier 2 has N=1 architecture?\n\n\
    ### Scores\n| Criterion | Score |\n|-----------|-------|\n| Overall | **5** (marginally\
    \ below threshold) |\n| Confidence | **4** (high) |\n| Soundness | **3/4** (good,\
    \ but N=2 and no behavioral validation) |\n| Significance | **2/4** (descriptively\
    \ interesting, limited actionable impact) |\n\n---\n\n## Reviewer 2 — Novelty\
    \ & Related Work\n\n### Summary\nSame paper summary as R1. The paper applies standard\
    \ interpretability tools (probing, RSA, CKA, attention profiling, counterfactual\
    \ perturbation) systematically to VLAs and discovers cross-architecture regularities,\
    \ primarily exit collapse at the VLM→VLA boundary.\n\n### Strengths\n- **S1. Genuine\
    \ cross-architecture validation.** 3×4 matrix across genuinely different backbone\
    \ families (Llama-2, Phi-3, Qwen2.5-VL). Most VLA interpretability work targets\
    \ single architectures.\n- **S2. Clean trained/reference decomposition.** Distinguishing\
    \ training-associated effects (exit collapse, CF sensitivity) from inherited effects\
    \ (L1 attention) is a useful conceptual contribution.\n- **S3. Unusually candid\
    \ limitations.** Five explicitly stated limitations with supporting analyses (threshold\
    \ sensitivity, behavioral correlation p-value).\n- **S4. Engagement with concurrent\
    \ work.** Five concurrent VLA interpretability papers are discussed and differentiated\
    \ appropriately.\n\n### Weaknesses\n- **W1. Novelty is empirical application,\
    \ not methodological or conceptual innovation.** Every method (probes, RSA, CKA,\
    \ counterfactual perturbation, attention profiling) is standard in interpretability\
    \ literature. The contribution is applying this toolkit to VLAs and discovering\
    \ regularities. This places the burden entirely on empirical findings, and the\
    \ exit collapse remains descriptive without a mechanistic explanation for *why*\
    \ VLM→VLA produces it.\n- **W2. Related work omits important literatures:**\n\
    \  - **Neural collapse / representation collapse** (Papyan et al. 2020, Jing et\
    \ al. 2022) — directly relates to exit-layer R² decline and could provide theoretical\
    \ grounding.\n  - **Fine-tuning effects on layer-wise representations** (Merchant\
    \ et al. 2020 on BERT, Mosbach et al. 2020) — exit collapse is reminiscent of\
    \ known findings that fine-tuning concentrates task info in later layers while\
    \ disrupting general representations.\n  - **Lazy training / feature reuse** (Chizat\
    \ et al. 2019) — could explain why VLA→VLA shows minimal change.\n  - **Multimodal\
    \ representation analysis beyond VLAs** (e.g., Palit et al. 2023 on CLIP).\n-\
    \ **W3. Exit collapse may be format specialization, not deep reorganization.**\
    \ When a VLM first learns to produce actions, the exit layer must format representations\
    \ for the action head's tokenization scheme. An MLP probe on intermediate layers\
    \ is format-agnostic, but at the exit layer, information may be encoded in an\
    \ action-head-specific format the probe cannot decode. An \"action_head_decoding\"\
    \ experiment (applying the frozen action head layer-by-layer) would distinguish\
    \ format specialization from genuine information loss, but the review context\
    \ suggests this experiment gave negative results and was excluded from the paper.\
    \ This is the most parsimonious alternative explanation and it has not been ruled\
    \ out.\n- **W4. \"Cross-architecture\" diversity is narrower than title suggests.**\
    \ All three architectures are decoder-only causal transformers with frozen vision\
    \ encoders trained on LIBERO with autoregressive action token prediction. Flow-matching\
    \ (pi0/pi0.5), diffusion-based (Octo), trainable-encoder, and encoder-decoder\
    \ architectures are not covered.\n- **W5. Actionable implications are thin and\
    \ unvalidated.**\n  - Δ R² as diagnostic: behavioral correlation is non-significant\
    \ (ρ=0.583, p=0.10, n=9).\n  - Staged pipelines preserving exit structure: no\
    \ experiment tests whether this improves downstream performance.\n  - Uniform\
    \ pruning recommendation: derives from an 8% gap in a single architecture.\n-\
    \ **W6. Instruction invariance (§4.3) is architecturally trivial.** Image tokens\
    \ precede instruction tokens under causal masking and cannot attend to them. Reporting\
    \ this as an empirical finding inflates the apparent volume of results.\n\n###\
    \ Key Questions\n1. Why was the action_head_decoding experiment excluded? If the\
    \ frozen action head applied layer-by-layer doesn't show exit-peaking R², this\
    \ supports format specialization as the explanation for exit collapse.\n2. Have\
    \ you considered additional VLM→VLA pairs beyond LIBERO to increase N for the\
    \ core claim?\n3. OpenVLA Long-Horizon shows systematically lower CF sensitivity\
    \ (d=0.45–0.57 vs 0.81–1.52). Could this indicate exit collapse and CF sensitivity\
    \ measure different constructs?\n4. If L1 routing is inherited, what exactly does\
    \ VLA training change about instruction processing? The paper lacks a clear mechanistic\
    \ story connecting L1 to later-layer effects.\n\n### Scores\n| Criterion | Score\
    \ |\n|-----------|-------|\n| Overall | **5** (marginally below threshold) |\n\
    | Confidence | **4** (high) |\n| Novelty | **2/4** (existing methods applied to\
    \ new domain; exit collapse is clean but descriptive) |\n| Clarity | **3/4** (well-written,\
    \ careful qualifications, \"routing\" used loosely) |\n\n---\n\n## Roundtable\
    \ Synthesis (Steps 2–4)\n\n### Areas of Full Agreement\n1. **Score:** Both reviewers\
    \ independently assign 5 (marginally below acceptance threshold).\n2. **Core strength:**\
    \ The cross-architecture matrix with NLP controls is well-designed and the statistical\
    \ methodology is above typical standards for interpretability work.\n3. **Core\
    \ weakness #1:** N=2 independent VLM→VLA transitions is the minimum viable count;\
    \ a single counterexample would break the generalization.\n4. **Core weakness\
    \ #2:** No behavioral validation at a venue that centers robot learning. The practical\
    \ implications (diagnostic signatures, pruning guidance, staged pipelines) are\
    \ speculative.\n5. **Core weakness #3:** Metric incomparability weakens the counterfactual\
    \ sensitivity contribution across architectures.\n6. **Positive recognition:**\
    \ Honest limitation reporting is commendable and treated favorably per CoRL norms.\n\
    \n### Areas of Complementary Critique\n- **R2's format specialization critique\
    \ (W3)** is the strongest individual concern not raised by R1. If exit collapse\
    \ reflects the exit layer adopting an action-head-specific format (rather than\
    \ discarding information), the \"information loss\" interpretation is undermined.\
    \ The reported-but-excluded action_head_decoding experiment would address this\
    \ directly.\n- **R2's missing related work (W2)** on neural collapse and fine-tuning\
    \ effects is a substantive gap that could have strengthened the paper's theoretical\
    \ grounding.\n- **R1's NORA Goal data quality concern (W6)** is a valid point:\
    \ negative R² at the exit layer may indicate probe pathology rather than genuine\
    \ collapse, inflating the reported effect range.\n\n### Remaining Disagreement\n\
    None on scores. Minor calibration difference: R1 weights the statistical rigor\
    \ more positively; R2 weights the novelty deficit more negatively. These balance\
    \ to the same overall score.\n\n### Accept/Reject Recommendation\n\n**Consensus:\
    \ Weak Reject (5/10)**\n\n**Rationale:** This is a competently executed empirical\
    \ study that discovers a clean regularity (exit collapse at VLM→VLA boundary)\
    \ through careful cross-architecture experiments. The statistical methodology\
    \ is strong and the limitation reporting is exemplary. However:\n\n1. **Novelty\
    \ is limited to empirical application** of existing interpretability tools; no\
    \ new methods or mechanistic explanations.\n2. **The core finding (N=2 VLM→VLA)**\
    \ is suggestive but insufficiently replicated for a strong generalization claim.\n\
    3. **The alternative explanation (format specialization)** has not been ruled\
    \ out, weakening the \"information loss\" interpretation.\n4. **No behavioral\
    \ validation** at a robotics venue where closed-loop demonstrations are expected.\
    \ The practical implications are entirely unvalidated.\n5. **Metric incomparability**\
    \ limits the counterfactual sensitivity contribution to a single architecture\
    \ (OpenVLA).\n\nThe paper would benefit from: (a) at least one additional VLM→VLA\
    \ architecture, (b) the action_head_decoding experiment to distinguish format\
    \ specialization from information loss, (c) even minimal behavioral correlation\
    \ (e.g., probing-predicted vs actual task success on held-out rollouts), and (d)\
    \ engagement with the neural collapse literature.\n\n**Estimated rebuttal success\
    \ probability: ~35%.** The authors could address the threshold concern and format\
    \ specialization question in text, but adding architectures or behavioral experiments\
    \ requires new compute. The metric incomparability and N=2 limitations are structural.\n\
    \n### Score Summary Table\n\n| Dimension | R1 | R2 | Consensus |\n|-----------|----|----|-----------|\n\
    | Overall | 5 | 5 | **5** (weak reject) |\n| Confidence | 4 | 4 | 4 |\n| Soundness\
    \ | 3/4 | — | 3/4 |\n| Significance | 2/4 | — | 2/4 |\n| Novelty | — | 2/4 | 2/4\
    \ |\n| Clarity | — | 3/4 | 3/4 |\n\n---\n\n## Coverage Assessment vs. Experiment\
    \ Design\n\nComparing the paper against the review_context.yaml experiment list:\n\
    \n| Experiment | In Paper? | Notes |\n|------------|-----------|-------|\n| plan_001:\
    \ SigLIP+Projector RSA baseline | ✅ Table 1 | Clean result, uncontested |\n| plan_002:\
    \ DINO standalone baseline | ✅ Table 3 | Clean result |\n| plan_003: Per-layer\
    \ RSA curve | ✅ Table 12 | Metric-dependent (CKA reversal) — appropriately qualified\
    \ |\n| plan_004: Frozen encoder verification | ✅ Table 2 | Clean result |\n| plan_005:\
    \ 6 probing methods (orphaned) | ❌ Orphaned | Superseded by plan_011, appropriate\
    \ |\n| plan_006: Instruction ablation RSA | ✅ Table 4 | Clean negative result\
    \ |\n| plan_007: 2×2 factorial design | ✅ Table 5 | Null result honestly reported\
    \ |\n| plan_008: Random instruction control | ✅ Table 6 | Thorough controls |\n\
    | plan_009: CKA verification | ✅ Table 14 | Key problematic result — honestly\
    \ reported RSA/CKA reversal |\n| plan_010: LIBERO-Spatial replication | ✅ Table\
    \ 13 | Within-arch replication |\n| plan_011: Full-layer R² scan | ✅ Tables 9-10\
    \ | Core evidence for exit collapse |\n| plan_012: CLIP-ViT control | ✅ Table\
    \ 15 | Clean result |\n| plan_013: Branch-split RSA | ✅ Table 16 | Supporting\
    \ detail |\n\n**Coverage: 12/13 experiments included (1 appropriately orphaned).**\
    \ The paper faithfully covers the experimental design. The main concern is not\
    \ missing experiments but rather the interpretive claims made from the results\
    \ (particularly exit collapse interpretation and metric-dependent geometry claims).\n\
    \n\n---\n\n## 引用验证结果\n\n**统计**: 55 篇文献 / 102 处引用 / 在线验证 55/55 篇\n\n### 问题 (14)\n\

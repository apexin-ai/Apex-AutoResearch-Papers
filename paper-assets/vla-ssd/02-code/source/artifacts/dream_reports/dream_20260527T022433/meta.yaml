      是 VLA training 的贡献。读者看到这个图会以为训练创造了 routing——但实际上 routing 来自

      language pretraining。这是 misleading framing，即使你在正文中有 caveat。"


      D090 后 remaining training-induced effects 只剩 exit collapse 和 CF sensitivity。

      Reviewer 总结："After D090, VLA training''s unique contribution is one transition
      artifact

      (exit collapse) and one baseline-confounded sensitivity measure (CF). This is
      too thin

      for a full paper at a top robotics venue."


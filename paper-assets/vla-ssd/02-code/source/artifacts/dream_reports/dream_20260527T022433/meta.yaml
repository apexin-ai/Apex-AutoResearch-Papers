    ---


    ## 9. Overall Assessment


    ### Verdict


    This paper presents a methodologically rigorous representational analysis of VLA
    fine-tuning with several genuine contributions: the trained-vs-reference decomposition
    is novel in VLA literature, the R² exit collapse finding (6/6 VLM→VLA vs 0/4 VLA→VLA)
    is non-obvious and well-controlled, and the statistical reporting is unusually
    honest. The experimental coverage of the design space is comprehensive (100% of
    planned experiments executed).


    However, the paper faces significant limitations for a robotics venue. The core
    finding rests on N=2 independent VLM→VLA transitions within a single architecture
    family (causal-decoder). The complete absence of closed-loop behavioral validation—combined
    with the counter-intuitive result that ablating 24/32 instruction heads produces
    near-zero MSE change—leaves the functional significance of the identified routing
    structures unresolved. The three-tier routing gradient is overstated given N=1
    at Tier 2. Some findings (inherited L1 routing, RSA-CKA dissociation) confirm
    rather than extend prior knowledge.


    The paper sits at the CoRL acceptance boundary. The methodology and framework
    design are strong contributions to VLA understanding, but the limited architectural
    scope, absent behavioral grounding, and primarily observational nature constrain
    the impact. Adding one non-autoregressive VLA architecture and any form of behavioral
    validation would move this decisively above the threshold.


    ### Recommendation: **Borderline Accept** (6/10)


    The paper merits publication if the authors can address the most critical gaps
    in revision (behavioral validation, positioning relative to representation transformation
    literature). In its current form, it represents solid foundational work that the
    VLA community would benefit from, but falls short of the impact expected at a
    top robotics venue.



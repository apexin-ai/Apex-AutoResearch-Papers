  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: 闭环失败归因错误：将 SR=0 归因于模型能力不足，实际是评估环境不兼容
  root_cause: D074 在 behavioral_smoketest SR=0/3 后结论为"模型闭环性能不足"。D078 在修复 6 个管线 bug

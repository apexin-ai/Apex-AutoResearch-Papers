- id: M018
  date: '2026-05-23'
  category: code_bug
  severity: high
  summary: Bootstrap v2 有放回抽样后按位置切分导致 train-test 泄漏，11/19 条件 CI 异常
  root_cause: _bootstrap_single 中对 100 demos 做有放回抽样（bootstrap）再按位置切 80/20 train/test，未去重。有放回抽样后期望仅
    ~63 unique demos，同一 demo 可同时出现在 train 和 test 中，导致：(1) R² 虚高（leakage）(2) train
    中 duplicate 稀释 kernel weights 导致 held-out R² 大幅负值
  prevention: Bootstrap/cross-validation 代码审查 checklist：(1) 有放回抽样后必须检查 train-test
    是否有重叠 (2) 推荐使用无放回 Monte Carlo cross-validation 而非 bootstrap + positional split
    (3) 写完 bootstrap 代码后必须验证 boot_mean ≈ canonical_delta，CI 包含 canonical delta (4)
    发现 CI 异常（点估计落在 CI 外、方向翻转）时立即怀疑 data leakage
  status: active
  context: v2 bootstrap 20 条件中 11 条 CI 异常：NORA goal trained CI [0.996, 1.848] 而 canonical
    Δ=0.455；TracVLA spatial untrained CI 方向翻转。浪费约 5h GPU 时间。Canonical delta 不受影响因为
    canonical split 使用 permutation 后切分，train/test 不重叠。
  fix: '方案 A: Monte Carlo Cross-Validation — 无放回随机抽 80 train / 20 test，重复 1000 次。保存为
    v3 脚本重跑全部 20 条件。'

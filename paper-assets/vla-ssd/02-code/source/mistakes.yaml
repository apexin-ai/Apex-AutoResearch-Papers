mistakes:
- id: M001
  date: '2026-05-16'
  category: agent_behavior
  severity: medium
  summary: QA Probe + Instruction-conditional probe 执行停滞，GPU 长时间空闲
  root_cause: Agent 在 QA Probe 遇到 LogisticRegression 收敛问题后 kill 进程，但修复后未重启。Instruction-conditional
    probe 仅完成 L0 dry-run 后未继续 full run。导致双卡空闲数小时。
  prevention: 批准实验后设置明确的完成预期时间。如果 Agent 汇报修复方案后超过 30min 未汇报结果，主动 urgent 催促。对串行任务（fix
    → rerun）明确指示"不要等确认，修完直接跑"。
  status: active
  context: D044 批准的 instruction-conditional probe 和 QA probe 修复均未按时执行。服务器完全空闲，GPU
    预算浪费。
- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: 所有 training effect 实验只测 image_mean，遗漏 last_preaction token——导致 7 个 negative
    结论过于笼统
  root_cause: 默认用 image_mean 聚合 LLM 层输出，未意识到不同 token position 编码不同信息。VLA 的 image tokens
    是 instruction-blind 的，training effect 主要在 action token (last_preaction) 上。
  prevention: 在 VLA 中任何 "trained vs untrained" 对比必须分 token position 报告（至少 image_mean
    + last_preaction）。Token-specific analysis 应作为标准流程。
  status: active
  context: lg_rsa_analysis, d021_instruction_ablation, mvp_001 等 7 个 negative 实验都只在
    image_mean 上测量，一致显示 trained≈untrained。直到 D044-D047 才发现 last_preaction 是 training
    effect 的载体。如果更早发现，研究可提速 2+ 天。
- id: M003
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: L1 head ablation 脚本使用 task_id 作为分类标签而非 instruction_id，导致测量视觉场景识别而非指令身份分类
  root_cause: Worker 在实现 cross-instruction 分类器时，将 label 定义为 task_idx（图像来源任务），而非 instruction
    index（配对的指令编号）。这导致分类器学习的是"这张图来自哪个任务"而非"显示了哪条指令"，使 ablation 结果无法回答目标问题。
  prevention: 1. 涉及 cross-instruction 分析的新脚本，必须在 prompt 中明确指定标签定义（label = instruction_id,
    not task_id）；2. 新实验脚本写完后、执行前，必须 post_to_reviewer 做代码审查；3. 参考现有实现（cross_instruction_classify_spatial.py）的标签逻辑作为
    reference。
  status: active
  fix: 修正标签为 instruction_id，加 PCA-256 降维，加 top-5 graduated ablation 条件，重跑实验。
- id: M004
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: threecond_multiseed 脚本在归一化空间计算 R²，与主文原始空间 R² 不可比
  root_cause: Multi-seed 脚本从 fulllayer_action_probe.py 复制时，遗漏了反归一化步骤。y_val 用了归一化版本而非
    y_val_raw，y_pred 也未反归一化。
  prevention: 新脚本复用旧 pipeline 时，必须核对 metric 计算空间是否一致。审批实验方案时要求 Agent 明确说明 R²/loss
    在哪个空间计算，并与已有实验对齐。
  status: active
  context: L0 R² = 0.538 (归一化) vs 0.640 (原始)，差值恒定 ~0.102，定性 pattern 不受影响但绝对值不可直接引用。
  fix: 加载 best model checkpoint，反归一化后重算 R²。不需重新训练。
- id: M005
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: behavioral_pilot_w4 失败：OpenVLA 使用 bridge_orig unnorm_key，LIBERO action
    space 不兼容，baseline SR=0
  root_cause: OpenVLA-7B 未在 LIBERO 上 fine-tune action generation。我们的分析一直是 feature
    extraction + probe，不涉及 closed-loop action generation。bridge_orig normalization
    stats 与 LIBERO action space 不匹配。
  prevention: 规划 behavioral rollout 实验前，先确认模型是否在目标环境的 action space 上 fine-tuned。如果模型只用于
    feature extraction 分析，closed-loop rollout 需要额外的 fine-tuning 步骤。
  status: active
  context: 6/60 episodes 完成，全部 fail (R=0.000)。SIGHUP 导致两个进程都被杀，无结果文件。
  fix: 转向 open-loop action trajectory analysis：对比 baseline vs ablated 模型在 LIBERO demo
    上的 action prediction 差异，不需要 closed-loop execution。
- id: M006
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: Cross-layer action trajectory 使用不可比方法（L1 partial ablation vs L8/L13 full
    knockout），结果无法解读
  root_cause: L1 实验 ablate 24/32 heads 仅在 instruction token 位置（~8.7% head-token pairs），L8/L13
    ablate 全部 32/32 heads 全部 token 位置（100% head-token pairs）。方法论差异使 d 值对比无意义。Reviewer
    在实验启动时已警告不可比，但未被充分重视。
  prevention: 跨条件对比实验必须使用 matched methodology：相同的 ablation 方式（partial vs full）、相同的
    token scope、相同的 head 选择标准。设计跨层/跨条件实验前，先画方法对齐表确认每个变量是否 controlled。
  status: active
  context: L1 d=0.65, L8 d=0.652, L13 d=0.668 — 几乎一致，但 KL divergence 显示 L8/L13 扰动远大于
    L1（6.4 vs 1.69）。d 值在该干预强度下饱和。结果不能用于论文。
  fix: 不将 cross-layer action trajectory 纳入论文。层级特异性证据回退到 R² gradient（L1 +0.059 >> L8
    +0.018 >> L13 ≈0，方法论一致）。
  related_decisions:
  - D065

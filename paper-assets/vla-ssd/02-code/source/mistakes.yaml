  status: active
  context: libero_finetuned_attention 实验。L31 instruction-dominant heads 从 openvla-7b
    的 18 崩塌到 LIBERO fine-tuned 的 0。Worker 称"微小下降（2 heads）"完全基于 L1，遗漏了 exit leg 消失这一关键发现。
  fix: Reviewer 独立审查发现 L31 崩塌。结果重新 frame 为 positive finding：general VLA = entry-exit
    bookend，task-specific fine-tuning = entry-only（exit engagement 是多任务 overhead）。

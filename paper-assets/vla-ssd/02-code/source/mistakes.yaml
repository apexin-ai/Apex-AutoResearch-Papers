- id: M009
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: Worker 只报 L1 attention heads，遗漏 L31 从 18→0 的崩塌，导致错误结论"routing 基本保持"
  root_cause: Worker 只对比了 L1 层的 instruction-dominant heads（24→22），未检查 L31 和中间层。结论"基本保持
    bookend pattern"基于不完整数据。
  prevention: 分析 attention profile 时，必须报告全部关键层（至少 L0, L1, L9-L16 中间段, L24-L30 深层段,

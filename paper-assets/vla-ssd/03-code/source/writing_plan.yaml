    description: "3 arch × 4 suite matrix overview with key findings"
    narrative_intent: "R² exit collapse and CF sensitivity are consistent across all architectures"
    design_notes:
      - "Heatmap matrix with Δ values color-coded"
      - "Annotate OpenVLA Long outlier"
    placement: introduction
    aspect_ratio: "16:9"
    data_source: "artifacts/matrix_summary_table.md"

  - fig_id: fig_r2_collapse
    type: statistical
    tool: matplotlib
    description: "R² per-layer curves: 3 architectures, trained vs untrained, showing exit collapse"
    narrative_intent: "Trained VLAs universally show R² exit collapse regardless of backbone"
    design_notes:
      - "3-panel (one per arch) or overlaid"
      - "Solid=trained, dashed=untrained"
      - "Annotate Δ per arch"
    placement: experiments
    aspect_ratio: "16:6"
    data_source: "registry: tracvla_goal_v1, nora_goal_pipeline_v3, object_pipeline_ridge_v2"

  - fig_id: fig_cross_arch_l1
    type: statistical
    tool: matplotlib
    description: "L1 instruction-dominant head count: trained vs untrained per architecture"
    narrative_intent: "L1 head count is inherited from base model, not created by VLA training"
    design_notes:
      - "Grouped bars per architecture"
      - "Show training direction arrows"
    placement: experiments
    aspect_ratio: "4:3"
    data_source: "artifacts/matrix_summary_table.md"

  - fig_id: fig_three_tier
    type: statistical
    tool: matplotlib
    description: "Three-tier routing gradient: VLM base → OXE-pretrained → task-finetuned"
    narrative_intent: "Routing emerges at VLM→VLA transition and reshapes with task specialization"
    design_notes:
      - "Radar or grouped comparison showing CF sensitivity + R² collapse + L1 heads"
      - "Three tiers clearly separated"
    placement: experiments
    aspect_ratio: "4:3"
    data_source: "artifacts/matrix_summary_table.md"

  # Appendix figures (moved from main):

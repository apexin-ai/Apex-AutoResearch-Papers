# ============================================================
# SYNTHESIS: OUR NOVELTY POSITION
# ============================================================
synthesis:
  our_core_claim: "Instruction Input Pathway Drives Conditioning, Not Training"

  what_others_have_done:
    behavioral_level:
      - "Grant 2026: vision pathway dominates, language 'encoded but not used' (activation injection)"
      - "LIBERO-CF/LangGap/LIBERO-Plus: VLAs ignore language instructions (counterfactual/robustness tests)"
      - "LIBERO-PRO: models rely on memorization not understanding"
      - "Fang 2025: fine-tuning erodes VLM reasoning (intention != execution)"
    representation_level:
      - "Swann 2026: SAE features mostly memorized sequences, some interpretable (OpenVLA)"
      - "Molinari 2025: world model emerges in middle layers (OpenVLA)"
      - "Lu 2025: symbolic states decodable with >0.90 accuracy (OpenVLA + LIBERO)"
      - "Haon 2025: sparse semantic directions causally linked to actions (Pi0 + OpenVLA)"
      - "Rizzardo 2026: feature-observability and controllability (pi0.5 + OpenVLA)"

  what_nobody_has_done:
    - "Trained vs untrained VLA representation comparison (we find trained ~= untrained >> DINO)"
    - "Instruction input pathway vs LLM training separation analysis (6 probing rounds + RSA all consistent)"
    - "Systematic layer-wise RSA/CKA comparison of trained/untrained/DINO representation structures"
    - "Instruction ablation causal verification: removing instruction drops RSA to DINO level"

  key_differentiation_from_grant2026: >
    Grant 2026 compares different VLA models (architectural differences);
    we compare trained vs untrained within the same model (training effect isolation).
    Grant finds "language encoded but not used" (behavioral level);
    we find "conditioning comes from input pathway, not training" (representation level).
    Complementary, not competing. Related Work must qualify OFT vs standard fine-tuning difference.

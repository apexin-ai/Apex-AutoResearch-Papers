decisions:
- id: D001
  date: 2026-05-15 11:03 UTC
  summary: MVP 三分支判定标准校准：ρ下限0.3→0.5, Δρ加bootstrap CI, subtask gate加DINO baseline对比
  rationale: Reviewer 审查发现四项校准缺陷：(1) ρ>0.3 下限过低（DINO-V2 已达0.833，0.3只挡彻底失败）→ 提至0.5；(2)
    Δρ>0.1 仅为点估计缺统计检验 → 追加 bootstrapped 95% CI must exclude 0；(3) subtask_AUC>0.7
    无 baseline 锚点（不知道 DINO-V2 能做到多少）→ 增加条件 subtask_AUC > DINO_subtask_AUC + 0.05；(4)
    layer profile 不入正式判定但作为 mandatory supplementary analysis。修改后标准更严谨，降低 false positive
    PASS 风险。
  related_experiments:
  - exp_id: dino-v2-baseline
    role: baseline
    result: ρ=0.833
  depends_on: []
- id: D002
  date: 2026-05-15 12:02 UTC
  summary: MVP 判定全面切换到 per-task mean ρ，弃用 pooled ρ
  rationale: Reviewer 指出 pooled ρ 受 cross-task variance 膨胀（DINO pooled=0.833 vs per-task
    mean=0.554）。pooled-vs-pooled 虽对称但偏严（可能 false negative）。切换 per-task mean 与 task-level
    bootstrap CI 方法论一致，且是更公平的 apples-to-apples 比较。影响：VLA≥DINO gate 从 ρ≥0.833 变为 per-task
    mean≥0.554；ρ>0.5 下限同样改为 per-task mean。
  related_experiments:
  - exp_id: dinov2_baseline
    role: baseline
    result: pooled ρ=0.833, per-task mean=0.554
  depends_on:
  - D001
- id: D003
  date: 2026-05-15 12:31 UTC
  summary: 移除 subtask AUC gate，MVP 判定简化为纯 temporal distance (ρ) 路径
  rationale: DINO-V2 subtask AUC = 0.9717，Path B 要求 VLA > DINO + 0.05 = 1.0217，数学不可达（AUC
    上限 1.0）。根因：subtask 间视觉差异大，任何强视觉编码器都能高 AUC 区分——subtask discrimination 不是 VLA 的差异化能力。Temporal
    distance（连续进度信号）才是 VLA 可能独有的编码维度。简化后判定：PASS 需 VLA_ρ ≥ DINO_ρ (0.833)；CONDITIONAL
    需 Δρ > 0.1 但 VLA_ρ < DINO_ρ；FAIL 需 ρ ≤ 0.5 或 Δρ ≤ 0.1。Subtask AUC 保留为补充分析，不参与
    gate。
  related_experiments:
  - exp_id: dinov2_baseline
    role: trigger
    result: subtask AUC 0.9717 使 Path B 数学不可达
  depends_on:
  - D001
- id: D004
  date: 2026-05-15 12:35 UTC
  summary: D003 勘误：DINO gate 阈值从 0.833 (pooled) 修正为 0.554 (per-task mean)，与 D002 对齐
  rationale: D003 写 ROADMAP 时误用 pooled ρ 0.833 作为 DINO gate 阈值，但 D002 已明确"全面切换到 per-task
    mean ρ，弃用 pooled"。DINO per-task mean ρ = 0.554。0.833 vs 0.554 差 0.28，直接影响 PASS/FAIL
    判定——用 0.833 会错误地将本应 PASS 的结果判为 CONDITIONAL。修正后所有文档/代码统一使用 per-task mean。同时确认 analyze_mvp.py
    废弃决策不变（urgent 指令已发）。
  related_experiments:
  - exp_id: dinov2_baseline
    role: reference
    result: pooled ρ=0.833, per-task mean ρ=0.554
  depends_on:
  - D002
  - D003

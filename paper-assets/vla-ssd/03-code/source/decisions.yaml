  summary: Goal classification probing 方法论失败，pivot 到 Representational Similarity Analysis
    (RSA) 测试 training 是否改善 action-relevant 表征结构
  rationale: Goal classification 无法区分 trained vs untrained VLA（5 个实验变体全部 ~100%）。根因：两者都接收
    instruction text 作为输入，即使 random LLM 的高维投影也能完美分离 10 个不同文本的 goal。这不是维度/probe 选择问题，而是任务设计根本缺陷——测的是"表征是否包含
    instruction 信息"（trivially yes），而非"training 是否改善 instruction encoding"。DINO 低(35%→97%)是因为没有
    instruction 输入，不是 language grounding 差异。下一步用 RSA 测量 representation space 与 action
    space 的结构对齐程度，这避免了 trivial separability 问题。

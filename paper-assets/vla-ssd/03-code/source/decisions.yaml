    result: best L19 R²=0.683, delta best L14 R²=0.060
  - exp_id: mvp2_action_untrained
    role: control
    result: best L32 R²=0.616, delta best L32 R²=0.048
  - exp_id: mvp2_action_dino
    role: baseline
    result: R²=0.676 action, R²=0.061 delta — matches or exceeds trained
  - exp_id: mvp_probe_trained
    role: predecessor
    result: temporal distance ρ=0.955, Δρ=0.043
  - exp_id: mvp_probe_untrained
    role: predecessor
    result: temporal distance ρ=0.933
  depends_on:
  - D012
  - D010

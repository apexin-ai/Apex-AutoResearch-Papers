  rationale: 'Reviewer CRITICAL: 新管道 rerun DINO-V2 基线，per-task mean ρ 从 0.554 暴涨至
    0.901（10x 采样密度消除噪声）。旧管道 pooled/per-task 差异(0.833/0.554)是采样伪影。Gate 3 阈值必须更新为 0.901，否则
    analyze_results.py 判定标准错误。dinov2_baseline registry metrics 标为 invalidated。'
  related_experiments:

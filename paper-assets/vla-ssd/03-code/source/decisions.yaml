- id: D015
  date: 2026-05-15 16:06 UTC
  summary: '选择 Option A: Pivot 到 LIBERO-Goal instruction-conditioned probing。Reviewer
    独立评估一致推荐，预期 CoRL 录用概率 15-30%（vs Option B 的 5-12%），且 worst case 退化为加强版 B。'
  rationale: Reviewer 独立评估结论：(1) Expected value 最高——LIBERO-Goal positive 时构成 "vision-sufficient
    vs vision-ambiguous" 对比叙事，FAIL 时退化为双 benchmark negative（仍优于纯 Option B）；(2) 实验成本极低（特征提取
    ~半天 GPU + probe 复用）；(3) Layer-wise mechanistic insight 是 vs Grant et al. 2026
    的差异化卖点——Grant 只做了 behavioral（input-output），我们提供 WHERE/HOW 的 representational 证据；(4)
    11 天内可行（7-9 天实际工作量）。关键风险：OpenVLA checkpoint 仅在 LIBERO-10 fine-tune，未见过 LIBERO-Goal
    多目标场景。缓解：先检查 scene overlap，必要时做 LIBERO-Goal fine-tune（+1 天）。用户授权："你们确定好怎么走我就同意"。
  related_experiments:
  - exp_id: mvp2_action_trained
    role: evidence
    result: action-delta R²=0.059, DINO ≈ trained, vision-dominated
  - exp_id: mvp2_action_dino
    role: evidence
    result: delta R²=0.061, matches trained VLA
  depends_on:
  - D013
- id: D016
  date: 2026-05-15 16:16 UTC
  summary: LIBERO-Goal 实验统一用 base pretrained OpenVLA checkpoint（非 LIBERO-10 fine-tuned）。同时用
    pretrained 重提 LIBERO-10 特征，确保跨 benchmark 对比公平——唯一变量是 benchmark，非 fine-tuning 状态。
  rationale: Reviewer 指出 checkpoint 不一致 confound：LIBERO-10 用 fine-tuned、LIBERO-Goal
    用 pretrained → reviewer 会攻击差异来自 fine-tuning 而非 benchmark 特性。Solution 1（base pretrained
    统一）最 clean：(1) 唯一变量是 benchmark，排除 fine-tuning confound；(2) 如果 pretrained VLA 已编码
    instruction grounding，novelty 更高（pretraining 产物 vs task-specific fine-tuning 产物）；(3)
    额外 GPU 成本仅 3h，当前 GPU 空闲正好利用；(4) 与 Grant et al. 差异化更清晰（Grant 用 OFT fine-tuned，我们用
    pretrained）。附带发现：Grant 的 100%→10% 效应来自 OpenVLA-OFT 而非 base，我们效应量可能小一些但更有说服力。
  related_experiments:
  - exp_id: mvp2_action_trained
    role: predecessor (fine-tuned)
    result: R²=0.683, will re-extract with pretrained
  - exp_id: mvp2_action_dino
    role: baseline
    result: R²=0.676, unchanged
  depends_on:
  - D015

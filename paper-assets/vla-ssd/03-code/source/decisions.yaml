- id: D012
  date: 2026-05-15 14:23 UTC
  summary: 'D012: Copy baseline R²=0.97 暴露 G1 阈值无效。增加 action-delta prediction 作为核心判定指标，修订
    MVP-2 gates。'
  rationale: Reviewer 发现 copy baseline（a_{t+1}=a_t）R²=0.97，根因是机器人轨迹平滑导致连续 action 自相关极高。原
    G1（R²>0.3）毫无区分力，G2 的 Δ 也可能被压缩——与 MVP-1 的 vision dominates 结构性同构。解决方案：预测 action-delta（Δa
    = a_{t+1} - a_t），copy baseline 对 Δa 的 R² 恒为 0，彻底消除自相关混淆。当前实验继续不中断，完成后用相同 features
    重新训练 probe 即可（分钟级）。修订 gates：G1 保留为 sanity check；新增 G1-delta（trained peak-layer
    R²(Δa)>0.05）和 G2-delta（Δ(trained-untrained) on Δa >0.03 且 ≥5/10 tasks 一致）。
  related_experiments:
  - exp_id: mvp2_action_trained
    role: primary
    result: running
  - exp_id: mvp2_action_untrained
    role: control
    result: running
  depends_on:
  - D010
- id: D013
  date: 2026-05-15 15:25 UTC
  summary: MVP-2 Action Prediction 综合判定：G3-delta FAIL（DINO 0.061 ≈ trained 0.059）。三条探测维度（temporal
    distance / action prediction / action-delta）均 vision-dominated。唯一 VLA-specific
    发现：layer stability（训练后表征通路稳定，untrained 中间层坍塌）。建议 pivot 到 LIBERO-Goal instruction-conditioned
    probing。
  rationale: MVP-2 完整结果：G1 PASS (0.683>0.3), G1-delta borderline PASS (0.059>0.05),
    G2 FAIL (best-vs-best Δ=0.067<0.15), G3-action FAIL (Δ=0.007), G3-delta FAIL (DINO
    0.061 ≥ trained 0.059)。G2-delta Agent 报 PASS 但存在 best-vs-best vs same-layer 口径差异需核实。核心问题：DINO
    单层（1024 dim）在 action 和 action-delta 上均匹配 trained VLA 33 层最优（4096 dim），说明 LIBERO-10
    中的 action 信号（包括高阶 delta）可从视觉状态推断。VLA 训练的唯一可探测效果是 layer stability——表征通路畅通（trained
    31/33 层 R²>0.45, untrained 仅 ~15/33 层有效），但内容质量（可预测的信息量）未超越纯视觉。这与 Grant et al.
    2026 的发现一致：LIBERO-10 是 vision-solvable benchmark，language 几乎被忽略。LIBERO-Goal（多目标共享视觉场景）是文献支撑最强的下一步——该场景中
    vision 无法区分 goal，必须依赖 instruction。
  related_experiments:
  - exp_id: mvp2_action_trained
    role: primary
    result: action R²=0.683(L19), delta R²=0.059(L14)
  - exp_id: mvp2_action_untrained
    role: control
    result: action R²=0.616(L32), delta R²=0.049(L32)
  - exp_id: mvp2_action_dino
    role: baseline
    result: action R²=0.676, delta R²=0.061 — matches trained VLA
  depends_on:
  - D012
  - D010
- id: D014
  date: 2026-05-15 15:26 UTC
  summary: MVP-2 判死：action prediction + action-delta 三轮 probing 一致确认 LIBERO-10 上 VLA
    训练未注入视觉编码器以外的独特信息。Pivot 到 LIBERO-Goal instruction-conditioned probing。
  rationale: 三轮 probing 结果一致：(1) temporal distance Δρ=0.043, (2) raw action ΔR²=0.067(T-U)/0.007(T-DINO),
    (3) action-delta ΔR²=0.012(T-U)/-0.001(T-DINO, DINO 反超)。DINO 单层 1024-dim 在所有指标上打平或超过
    trained VLA 33 层 4096-dim。根因：LIBERO-10 单目标 tabletop 场景视觉状态强烈约束 action 空间，无需语言或策略推理消歧。文献支撑
    pivot：Grant et al. 2026 发现 LIBERO-Goal 多目标场景中 language 贡献关键（正确 prompt 94% vs 错误
    10%）。唯一正面发现：VLA 训练创造了跨层稳定表征（trained 31/33 层 > untrained），但这是 representational
    reorganization 而非 new knowledge，单独不足以撑论文。Agent 报告的 G2-delta PASS 有误——best-vs-best
    Δ=0.012 < 0.03，0/10 tasks 超过阈值，实为 FAIL。
  related_experiments:
  - exp_id: mvp2_action_trained

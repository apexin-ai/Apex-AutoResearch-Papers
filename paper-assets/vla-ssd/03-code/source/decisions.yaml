  date: 2026-05-15 16:22 UTC
  summary: D016 修正：改用 LIBERO-10 fine-tuned checkpoint 统一提取两个 benchmark 特征（取代 base
    pretrained 方案）。LIBERO-Goal 是 OOD 测试——场景不重叠，positive 结果 = 泛化而非记忆。
  rationale: Reviewer 二次审视后提出更优方案：(1) fine-tuned checkpoint 在 LIBERO-Goal 上是 OOD——场景确认不重叠、指令未见过，positive
    结果直接证明 instruction grounding 泛化能力，story 更强；(2) LIBERO-10 特征已提取完毕无需重跑，省 3h GPU；(3)
    同一 checkpoint 跨两个 benchmark = 公平对比，唯一变量仍是 benchmark 特性；(4) base pretrained 可作为后续
    ablation 补充（如果 fine-tuned 结果 positive 且时间允许）。此决策取代 D016 的 base pretrained 方案。

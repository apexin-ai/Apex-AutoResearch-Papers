- id: D007
  date: 2026-05-15 13:49 UTC
  summary: MVP Gate 2 FAIL 确认：33 层全结果，非坍塌层最大 Δρ=0.043 << 0.1。Temporal distance 信号来自
    vision encoder 而非 VLA 训练。Pivot 到 subtask predicate probe + 实用 pipeline 双线验证
  rationale: '完整 33 层数据：trained best ρ=0.956(L3), untrained best ρ=0.933(L1), DINO
    ρ=0.901。非坍塌层 Δρ 范围 0.003-0.043，无任何层接近 0.1 阈值。Gate 1 PASS(ρ>>0.5), Gate 2 FAIL(Δρ<<0.1),
    Gate 3 PASS(0.956>0.901)。科学结论：temporal distance 信号主要来自 SigLIP vision encoder，LLM
    fine-tuning 贡献 ~2-4% ρ，统计显著但实质极小。


    Pivot 理由：temporal distance 与 visual change 高度相关，vision encoder 天然擅长，不是测试 VLA 训练贡献的好
    probe。IDEA_BRIEF 原计划包含 subtask predicate classification（is_grasped, is_on_table
    等离散语义属性），这类信号需要理解 action 语义而非视觉相似度，vision encoder 不应有优势。先快速验证 subtask probe 是否展示
    VLA-specific 贡献，同时推进实用 pipeline（VLA ρ=0.95 已足够强，不管信号来源，self-scoring 可行）。'
  related_experiments:
  - exp_id: mvp_probe_trained
    role: primary probe
    result: best L3 ρ=0.956, 33 layers complete
  - exp_id: mvp_probe_untrained
    role: control C
    result: best L1 ρ=0.933, Δρ max=0.043
  - exp_id: dinov2_baseline
    role: baseline (rerun)
    result: ρ=0.901
  depends_on:
  - D006

      decline (8)
    trained_pattern: Bookend — L0-L1 peak (21-24) → L2-L30 valley (0-11) → L31 re-engagement
      (18)
  result_rationale: 'Dense 32-layer profile 是 C2 的 strongest mechanistic evidence：
    VLA training 将 instruction attention 从 Llama-2 base 的 mid-layer processing  模式（inverted-U,
    peak L9-L16）reorganize 到 bookend 模式（entry L0-L1 + exit L31）。 这一 temporal reorganization
    与 cross-instruction probe 在 functional level 一致： trained model 在 entry 层 capture
    instruction（L1=99.6%）并在 exit 层 re-engage  for action conditioning（L31 18 heads）。
    在 best 档下，bookend pattern 被解读为 efficient routing architecture： entry 层 extract
    instruction identity，mid-layers 用于 vision-dominated computation， exit 层 re-inject
    instruction signal for action generation。 Llama-2 base 的 inverted-U 是经典 LM pattern（mid-layer
    deep semantic processing）， VLA training 保留了总体 attention capacity 但 redistribute

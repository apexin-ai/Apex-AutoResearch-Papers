  finetuning control（ΔR²=0.000） 作为 specificity evidence。C1 框架的跨架构可复用性被独立 valued。C3
  作为 RSA-qualified observation 不受挑战。 Reviewers 在 best 档接受：(1) 3架构×4suite 矩阵为充分覆盖，(2)
  Δ>0.10 阈值非 arbitrary， (3) CF metric incomparability 被 properly caveated 后不成为 dealbreaker，(4)

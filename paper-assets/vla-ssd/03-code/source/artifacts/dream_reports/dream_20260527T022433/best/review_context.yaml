- name: Cross-Instruction Probe (Dense Layer Profile)
  plan_id: cross_inst_probe
  description: 10-way instruction classification × 33 layers × 3 conditions（trained/untrained/Llama-2
    base），验证 instruction routing 的逐层 dynamics
  expected_results:
    trained_last_preaction:
      L0: 0.1
      L1: 0.996
      L2_to_L32: 1.0
      pattern: immediate routing — L1 saturates
    llama2base_last_preaction:
      L0: 0.1
      L1: 0.802
      L2: 0.987
      L5_plus: 1.0
      pattern: gradual buildup — saturates at L5
    untrained_last_preaction:
      L0: 0.1
      L1: 1.0
      L8: 0.986
      L16: 0.923
      L24: 0.864
      L31: 0.82
      pattern: accidental routing + gradual forgetting
    image_mean_all_conditions: 0.1
    loocv_trained: 100.00±0.00
    loocv_untrained: 96.64±7.07 → 84.76±11.59
  result_rationale: '三条件的 cross-instruction probe 揭示了三种定性不同的 routing 策略： (1) Trained
    在 L1 即达 99.6% → 全程 100%——VLA training 创建了 immediate dedicated routing， instruction
    identity 在第一层就被提取并全程保持； (2) Llama-2 base 从 L1=80.2% 逐渐升至 L5=100%——语言预训练创建了 gradual
    processing， instruction 需要多层处理才能被 fully resolve，但一旦 resolve 就稳定保持； (3) Untrained（random
    init）L1=100% 看似最好，但 L31=82%——"偶然路由"因 high-dim  random features 的 trivial separability
    在 L1 成功，但 random weight 的 noise accumulation  导致 signal 逐层衰减。 Image_mean 在所有条件下都是
    10%（chance），确认 causal mask 阻止了 image→instruction  information flow。在 best 档下，这一
    three-way comparison 是 C2 的 definitive evidence， 展示了 VLA training 的 unique contribution（immediacy

      paired_mse: 0.042
      token_divergence: 0.723
      delta_gt_mse: -0.001
    specificity_ratio: 1.08
    gt_error_delta: ΔMSE ≈ 0 (p=0.519)
    token_overlap_spearman: 1.0
  result_rationale: 'Ablating 24 instruction-dominant heads 在 L1 产生 d=0.651 的 action
    shift， trajectory level d=2.943（~4.5x inflation due to within-trajectory correlation）。
    关键 finding：ΔMSE_vs_GT ≈ 0（p=0.519），说明 ablation redirects action outputs  without
    degrading accuracy。在 best 档下，这一 information-computation dissociation  被解读为 instruction
    heads 控制 action direction（哪个 action space region） 而非 action quality（与 ground truth
    的距离）。 Specificity ratio 1.08x（instruction 24 heads vs random 24 heads）modest，
    但 per-head analysis 显示 control heads 有 ~1.9x per-head effect， instruction heads
    通过 24-head collective coordination 产生更大 total effect。 Token overlap Spearman ρ=1.0
    确认 CF sensitivity 与 lexical/positional novelty  而非 semantic distance 相关——这是 honest
    caveat，论文不 overclaim semantic processing。


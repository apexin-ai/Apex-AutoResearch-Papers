    analysis: 'LIBERO-Spatial 完整复现三条 Claim 的核心证据：

      **Claim 1 (Vision Encoder Dominance)**: SigLIP RSA=0.587 >> VLA 0.482 >> DINO
      0.371，排序一致，effect size 在 ±15% 内（ratio 0.955-0.965）。DINO ≈ Proj in R²（0.693 vs
      0.688, p=0.28）但 RSA gap=0.216，geometric-functional dissociation 在第二个 benchmark
      复现。

      **Claim 2 (LLM Redistributes)**: Proj→L1 drop ~0.19（32%），per-layer 非单调模式一致。Readout
      concentration confirmed：trained readout R²=0.715 > proj 0.688 > untrained readout
      0.669。 CKA 排序反转复现。

      **Claim 3 (Routing Without Creating)**: Training delta RSA=0.014, CI=[-0.04,
      0.06], p=0.22——不显著，invariance 成立。 2×2 matrix 全部落入 [0.46, 0.49] band。Readout

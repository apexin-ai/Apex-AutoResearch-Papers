- name: CKA verification
  plan_id: plan_009
  description: CKA 指标重复 RSA 发现，检查指标依赖性
  expected_results:
    linear_cka_ordering: untrained (0.089) > trained (0.083) > projector (0.081) >
      DINO (0.066)
    rdm_cka_ordering: trained (0.260) ≈ projector (0.257) > untrained (0.246) > DINO
      (0.241)
    cka_last_preaction: 0.127
    rsa_cka_ordering_reversal: true
  result_rationale: "已完成。在 median 档下此结果面临额外挑战：至少一位 reviewer 将 CKA-RSA dissociation\
    \  视为 metric confusion 而非 finding。\n为什么 CKA 和 RSA 排序反转： - RSA 测量 pairwise distance\
    \ structure 的 rank correlation——local geometric alignment。\n  LLM 的 nonlinear\
    \ transformation 打乱了 pairwise distances 的 rank order，降低 RSA。\n- CKA 测量 centered\
    \ kernel alignment——global subspace overlap。LLM 保留甚至增强了 \n  global variance structure（特别是\
    \ CKA 单调上升 L0→L32），因为 attention 操作虽然 \n  重排 pairwise distances 但保留了 principal\
    \ variation directions。\n- 这不是 \"metric confusion\"——两个指标测量不同 aspects of representational\
    \ similarity，\n  dissociation 本身是 informative 的。但 median 档的 reviewer 可能不接受这个区分。\n\
    \nRebuttal 准备： - 明确定义 \"geometric alignment\" (RSA) vs \"structural preservation\"\
    \ (CKA) - 引用 Kornblith et al. 2019 和 Shahbazi et al. 2021 对两指标 sensitivity 差异的分析\
    \ - 强调 Claim 2 已限定为 \"geometric (RSA) degradation\"，不泛化为 \"representation quality\"\
    \ - CKA last_preaction=0.127 >> image_mean 0.08x 支撑 redistribution，与 RSA 一致\n"
  tables:
  - title: 'Table S3: RSA vs CKA Ordering Comparison'
    rows:

  result_rationale: "Median 档核心假设：LIBERO-Spatial 未完成或部分复现，effect size 缩小 30-50%。\n\
    为什么 effect size 缩小： - LIBERO-Spatial 的 action structure 比 LIBERO-Goal 更 spatially\
    \ grounded——task \n  差异主要在 spatial prepositions（\"to the left of\", \"in front\
    \ of\"）而非 object \n  identity。SigLIP 的 image-text pretraining 对 spatial relationships\
    \ 的 encoding \n  不如对 object-level semantics 那么强，因此 RSA 从 0.615 降至 ~0.52。\n- Training\
    \ effect 在 LIBERO-Spatial 上 p=0.08（边缘），因为 spatial tasks 的 action \n  variability\
    \ 更高，增加了 bootstrap sampling 的 variance。但 CI 仍然覆盖 0 或 \n  接近覆盖 0，不改变 Claim 3 的方向性结论。\n\
    - Readout concentration Δ=0.025（vs LIBERO-Goal 0.045）缩小约 44%，但仍显著 \n  (p=0.01)。缩小原因：spatial\
    \ tasks 的 action prediction 难度更高，readout \n  concentration 的 ceiling effect 降低。\n\
    - DINO RSA 也降至 0.32（vs 0.388 on LIBERO-Goal），说明 spatial tasks 对所有 \n  encoder\
    \ 都更难 align。\n\n此结果的 implication： - 所有三个 Claims 的 ordering 保持（SigLIP > VLA > DINO;\
    \ trained ≈ untrained in \n  distributed; trained > untrained in readout），但 effect\
    \ size 一致缩小。\n- 论文需在所有 Claims 加 \"on LIBERO-Goal\" 限定，LIBERO-Spatial 作为 partial\
    \ \n  replication 放在 supplementary 或 discussion。\n- 如果 deadline 前未完成：rebuttal\
    \ 中 promise LIBERO-Spatial 初步结果，附现有 \n  extraction pipeline 的进度证据。\n"

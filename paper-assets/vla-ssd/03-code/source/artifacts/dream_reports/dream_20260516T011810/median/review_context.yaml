narrative_guidance: 'Claim 1 从 "vision encoder dominance" 软化为 "VL-pretrained vision
  encoder dominance, with SigLIP showing strongest alignment"。 CLIP-ViT 落入中间地带（RSA
  ~0.46），高于 DINO（0.388）但显著低于 SigLIP（0.615），说明 VL pretraining 有贡献但 SigLIP 有额外优势（可能是
  pretraining scale、objective design 或 data composition）。 LIBERO-Spatial 仅完成部分实验或
  effect size 缩小 30-50%，Claim 1/3 需加 "on LIBERO-Goal" 限定。 Claim 2/3 的 readout concentration（Δ=0.045,

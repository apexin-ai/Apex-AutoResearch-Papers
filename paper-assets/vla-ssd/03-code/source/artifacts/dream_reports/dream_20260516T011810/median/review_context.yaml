  fine-tuning actually learns"——Claim 3 (routing-not-creating) 为核心卖点，Claim 1 降为支撑性
  finding。 Discussion 新增 "pretraining recipe matters" 段落，正面讨论 CLIP-ViT 中间结果的 implications。

  '

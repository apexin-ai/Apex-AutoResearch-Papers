  analysis: 'LIBERO-Spatial 部分复现在 median 档下是可接受的：ordering 保持证明 findings 非  benchmark-specific
    artifact，effect size 缩小说明 task characteristics（spatial vs  object-centric）调节了具体
    magnitude。这实际上增加了论文的 nuance 和 ecological  validity。

    关键 rebuttal 点：effect size 缩小是 expected 的（spatial relationships 更难）， ordering preservation
    才是 generalizability 的 test。如果连 ordering 都不保持  那才是 real concern。


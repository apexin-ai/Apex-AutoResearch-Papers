    result_rationale: '已知 real instruction（RSA=0.4876）与 no instruction（RSA=0.489）的差值仅
      0.004——instruction presence 本身几乎不影响 RSA。这是因为 LLM 对 visual tokens 的 representational
      transformation 由 attention 架构和 weight 主导，instruction tokens 仅通过 cross-attention
      提供微弱的 contextual modulation。如果真实 instruction 的 semantic content 对 RSA 有贡献，那么
      random instruction 应当导致 RSA 显著 下降（因为语义不匹配会干扰 "正确" 的 attention routing）。但在 best
      档下， 三类 random instruction 的 RSA 全部落在 [0.481, 0.486] 区间——与 real instruction 和
      no instruction 无显著差异。这是因为：(a) instruction tokens 在 attention 中被 visual tokens
      淹没（visual tokens 占 256 个，instruction tokens 仅 ~20 个）， (b) LLM 的 representational
      geometry 由 dominant visual pathway 决定，instruction 无论内容如何都只是 minor perturbation，(c)
      projector output 已经 "锁定" 了 representation 的主要结构，LLM 层间的 gradual transformation
      不受 instruction content 的实质性调控。这彻底排除了 "instruction content contributes to action-relevant
      structure" 的替代解释。


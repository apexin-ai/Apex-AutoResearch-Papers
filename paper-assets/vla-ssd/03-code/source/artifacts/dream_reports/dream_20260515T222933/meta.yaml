    expected_results:
      linear_cka_siglip_proj_vs_action: 0.63
      linear_cka_trained_vla_best_layer_vs_action: 0.46
      linear_cka_untrained_vla_best_layer_vs_action: 0.45
      linear_cka_dino_vs_action: 0.37
      rbf_cka_siglip_proj_vs_action: 0.58
      rbf_cka_trained_vla_best_layer_vs_action: 0.43
      rbf_cka_dino_vs_action: 0.34
      ordering_preserved_linear: true
      ordering_preserved_rbf: true
      cka_rsa_rank_correlation: 0.98
      cka_per_layer_monotonicity_spearman: -0.85
      training_delta_cka: 0.01
      training_delta_cka_significant: false
    result_rationale: 'CKA 与 RSA 测量 representational similarity 的不同方面——RSA 比较 pairwise
      distance matrices 的 rank correlation，CKA 比较 centered kernel matrices 的 Hilbert-Schmidt
      alignment。但两者在 well-structured representations 上高度 一致（文献中 rank correlation 通常
      > 0.9）。SigLIP+proj 的 CKA 最高（~0.63）， 因为 projector output 保留了最多的 action-relevant
      geometric structure—— 同样的 feature 在 RSA 下给出 0.6153。经过 LLM 处理后 CKA 下降到 ~0.46，
      对应 RSA 的 0.488 下降。DINO CKA 最低（~0.37），对应 RSA 的 0.388。CKA 的 绝对值与 RSA 不同（CKA 不是
      rank correlation，scale 不同），但 ordering 完全一致。Linear CKA 略高于 RBF CKA 是因为 linear
      kernel 对 large-scale variance 更敏感，而 action-relevant structure 在这些 representations
      中主要 体现为 large-scale（前几个 PC 方向的）variance。Per-layer CKA monotonicity （Spearman
      ≈ -0.85）与 RSA 的 -0.88 一致，进一步确认 degradation 是真实的 representational 现象，而非 metric
      artifact。

      '

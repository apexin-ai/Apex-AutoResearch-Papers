    ## Roundtable Discussion


    ### Step 2: Cross-Sharing


    **R1→R2:** R1''s identification of the recovery ratio arithmetic error (81% vs
    85%) and the ad-hoc Δ>0.03 threshold adds concrete evidence of execution gaps.
    R2 acknowledges these strengthen the case for lower soundness.


    **R2→R1:** R2''s point that the "untrained control" is near-tautological (frozen
    encoder+projector means identical LLM inputs) is well-taken. R1 agrees this weakens
    the "training invariance" finding — it''s partly a design artifact. R2''s cataloging
    of missing related work (Octo, π0, R3M, VIP, SayCan, etc.) also reveals the paper
    is poorly situated in the broader landscape.


    ### Step 3: Convergence


    Both reviewers converge on the following assessment:


    **Agreed strengths:**

    - The research question (where does action-relevant structure reside in VLAs?)
    is timely and important

    - Component-level decomposition with per-layer probing is a genuine methodological
    contribution

    - The 2×2 factorial + random instruction + CLIP-ViT controls form a well-designed
    experimental matrix

    - Transparent reporting of metric dependency (CKA vs RSA) is commendable


    **Agreed critical gaps (ordered by severity):**

    1. **No behavioral validation** — the most damaging omission. "Representationally
    redundant" ≠ "can be removed." Without success-rate evidence, the architectural
    implications are speculative.

    2. **Single architecture** — OpenVLA-only evidence cannot support claims about
    "VLA-class architectures."

    3. **Statistical rigor** — ad-hoc significance threshold, no formal tests, arithmetic
    error in recovery ratio.

    4. **Thin related work** — 10 references for a 2026 venue paper is inadequate;
    critical areas of the literature are missing entirely.

    5. **No proof-of-concept** — pure analysis without demonstrating that insights
    lead to improvements.

    6. **Simulation-only** — LIBERO''s structure may favor vision-dominant solutions.


    **Scores converge to:**

    - Soundness: 2/4 (R1''s stricter assessment absorbs the arithmetic error and missing
    formal statistics)

    - Presentation: 2/4 (both agree; no figures, thin related work)

    - Contribution: 2/4 (the question is valuable but incremental over behavioral
    findings without behavioral validation or proof-of-concept)

    - Overall: **4/10** (unanimous)

    - Confidence: 4/5


    ### Step 4: Final Assessment


    The paper asks an important question and collects interesting data. The per-layer
    U-shape, metric dependency, and CLIP pretraining decomposition are genuine contributions
    to understanding VLA internals. However, the execution falls short of the CoRL
    acceptance bar in several critical ways:


    1. The headline claim ("VLA architectures can be substantially simplified") is
    unsupported by any behavioral evidence. RSA alignment ≠ task success.

    2. Evidence from a single architecture (OpenVLA) cannot support the generality
    implied by the title and framing.

    3. Quantitative rigor is insufficient: arithmetic errors, ad-hoc significance
    thresholds, no formal statistical tests, missing sample sizes.

    4. The related work section is critically underdeveloped for a top venue.

    5. The paper is a pure diagnostic study that stops short of demonstrating practical
    impact — a proof-of-concept (even small-scale) would transform the contribution.


    **Recommendation:** Reject. The paper needs (a) behavioral validation via a projector-only
    policy, (b) at least one additional VLA architecture, (c) formal statistical testing
    with bootstrap CIs, (d) substantially expanded related work, and (e) figures.
    With these additions, the core findings could make a solid contribution.



    # Dream Review Report — CoRL 2026 Submission


    **Paper:** "The LLM as a Redundant Bottleneck: Representational Analysis of Action
    Structure in Vision-Language-Action Models"

    **Venue:** CoRL 2026 (acceptance rate ~28%, OpenReview 1–10 scale)

    **Review mode:** Full (2 Reviewers, 4-step roundtable)

    **Dream ID:** 20260515T222933


    ---


    ## Venue Calibration


    CoRL uses OpenReview with 6 review dimensions (Originality, Quality, Clarity,
    Significance, Relevance, Limitations) and a 1–10 overall recommendation scale:

    - 10: Top 5%, seminal | 9: Top 15%, strong accept | 8: Top 50%, clear accept |
    7: Good, accept

    - 6: Marginally above threshold | 5: Marginally below threshold

    - 4: Not good enough, reject | 3: Clear rejection | 2: Strong rejection | 1: Trivial/wrong


    CoRL specifically values: (1) relevance to robot learning, (2) real-world or simulation
    experiments demonstrating learning, (3) honest limitation reporting.


    ---


    ## Paper Summary


    The paper performs RSA and CKA representational analysis on an OpenVLA-class VLA
    (frozen SigLIP-SO400M → linear projector → 32-layer Llama-2-7B LLM), probing representations
    at every pipeline stage across three LIBERO benchmarks under a 2×2 factorial (trained/untrained
    × instruction/no-instruction) plus random-instruction and CLIP-ViT controls.


    **Five claimed findings:**

    1. **Vision-language pretraining dominance:** SigLIP+projector RSA ρ=0.615 > VLA
    ρ≈0.488. CLIP-ViT (ρ=0.56) attributes 76% of the SigLIP-DINO gap to VL pretraining.

    2. **LLM as redundant bottleneck:** Per-layer RSA U-shape (0.59→0.38→0.55), recovery
    ratio claimed 85%, Spearman monotonicity −0.18.

    3. **Instruction: content ignored, noise harmful:** Real vs no-instruction Δ=0.004;
    random instruction Δ=0.043.

    4. **Metric dependency:** CKA reduces SigLIP-vs-VLA gap from Δ=0.127 (RSA) to
    Δ=0.02.

    5. **Cross-benchmark replication:** LIBERO-Goal, Long, Spatial all show consistent
    ordering.


    ---


    ## R1 Review (Methods + Experiments)


    ### Strengths

    - Well-structured 2×2 factorial + random-instruction control cleanly isolates
    contributions

    - Per-layer probing across all 32 LLM layers is genuinely novel for VLAs — no
    prior work traces action alignment layer-by-layer

    - Transparent treatment of CKA-RSA metric dependency as a finding rather than
    burying it

    - CLIP-ViT pretraining control sharpens the recommendation from "use SigLIP" to
    "use any VL-pretrained encoder"

    - Cross-benchmark replication on 3 LIBERO variants strengthens internal validity

    - Tables are clear and well-organized (10 tables)


    ### Weaknesses


    **W1-R1 (Major): No behavioral validation.** RSA/CKA measure representational
    geometry, not task performance. The paper''s central implication — "VLA architectures
    can be substantially simplified" by decoding from projector outputs — is entirely
    unsupported by success-rate data. A projector-only policy may fail due to mechanisms
    orthogonal to what RSA captures (temporal coherence, action discretization, sequential
    decision-making). Without at least one behavioral experiment, the "redundant"
    claim is restricted to representational structure and the architectural implications
    are speculative.


    **W2-R1 (Major): Single architecture, single scale.** All experiments use one
    OpenVLA checkpoint (Llama-2-7B, 32 layers). Larger LLMs (13B, 70B) could develop
    action-specific representations. RT-2, π0, Octo use fundamentally different integration
    strategies (cross-attention, flow matching, diffusion). The title and framing
    generalize beyond what the evidence supports.


    **W3-R1 (Major): Recovery ratio arithmetic error.** By the paper''s own definition
    — (L32−trough)/(L0−trough) — the result is (0.55−0.38)/(0.59−0.38) = 0.17/0.21
    = **0.81 (81%)**, not the claimed 85%. This 4-point discrepancy undermines confidence
    in quantitative precision throughout.


    **W4-R1 (Major): Inadequate statistical testing.** The Δ>0.03 "significance threshold"
    is never formally justified — no permutation tests, no bootstrap CIs (except a
    passing mention), no multiple-comparison corrections. Sample sizes for RSA computation
    (N observations, number of pairwise distances) are never specified. Calling random-instruction
    Δ=0.043 "significant" based solely on exceeding an ad-hoc threshold is insufficient.


    **W5-R1 (Moderate): Linear decomposition assumption.** The 76% pretraining attribution
    assumes RSA differences are linearly decomposable: (CLIP−DINO)/(SigLIP−DINO).
    But RSA ρ is a nonlinear rank correlation. The "76%" is an intuitive ratio, not
    a principled variance decomposition.


    **W6-R1 (Moderate): U-shape mechanism hypothesized but not ablated.** Attribution
    to residual connections and layer normalization is speculation. Ablating skip
    connections in layers 16–32 would directly test the hypothesis.


    **W7-R1 (Minor–Moderate): Zero figures.** The paper''s headline finding is a "U-shape"
    — a fundamentally visual concept — yet contains no figures at all. A line plot
    of per-layer RSA would be far more compelling than Table 1.


    **W8-R1 (Minor): LIBERO-Long missing SigLIP+projector.** Table 7 shows "—" for
    SigLIP+projector on LIBERO-Long without explanation, weakening the cross-benchmark
    claim.


    ### Key Questions

    - Q1: What is the sample size N for RSA? How many observations per distance matrix?

    - Q2: Recovery ratio 85% vs computed 81% — clarify the exact formula with intermediate
    precision.

    - Q3: Have you trained a projector-only policy and measured success rates?

    - Q4: What is the provenance of the Δ>0.03 threshold?

    - Q5: Under CKA (Δ=0.02), the LLM is structure-preserving, not a bottleneck. How
    do you reconcile this with the "redundant bottleneck" framing?


    ### R1 Scores

    | Dimension | Score |

    |-----------|-------|

    | Soundness | 2/4 |

    | Presentation | 2/4 |

    | Contribution | 3/4 |

    | Overall | **4/10** |

    | Confidence | 4/5 |


    ---


    ## R2 Review (Novelty + Related Work)


    ### Strengths

    - Component-level representational decomposition is genuinely new for VLAs

    - Projector-output as a measurement point before LLM processing is the key methodological
    contribution

    - Per-layer U-shape is informative mechanistic detail beyond behavioral-level
    findings

    - Metric robustness check (RSA + CKA) is methodologically responsible

    - Cross-benchmark replication adds confidence

    - "Redundant bottleneck" framing is provocative and well-supported by the data


    ### Weaknesses


    **W1-R2 (Major): Severely incomplete related work.** Only ~10 references in 3
    short paragraphs. Critical omissions:

    - *VLA architectures:* Octo, π0, GR-1, RoboFlamingo, RT-1 — claiming findings
    about "VLA-class architectures" while studying one requires contextualizing the
    architectural landscape

    - *Representation learning for robotics:* R3M, VIP, MVP, Voltron — directly study
    which visual representations support robot learning

    - *LLM-as-planner/reasoner:* SayCan, Inner Monologue, Code as Policies — demonstrate
    settings where the LLM IS useful, which the paper ignores

    - *Probing/interpretability literature:* Hewitt & Manning 2019, Belinkov 2022,
    representation engineering — methodological context is thin

    - *Concurrent VLA interpretability:* Multiple 2025–2026 papers on VLA analysis

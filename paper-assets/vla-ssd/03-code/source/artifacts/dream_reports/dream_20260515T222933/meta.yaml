    result_rationale: 'Layer 0 RSA（~0.60）接近 projector output（0.6153），因为 LLM 第一层 embedding
      变换尚未大幅改变几何结构——仅做 layernorm + 一次 self-attention，主要信号仍来自 projector 注入的 visual
      tokens。随后每层 transformer block 将 representation 进一步推向 next-token prediction 目标，该目标要求
      representation 编码 token transition probabilities 而非 action-relevant geometric
      structure。这种目标 不对齐导致 RSA 在前 12 层下降最快（-0.089），因为早期层承担大部分 feature remapping。深层（20-32）进入
      plateau，因为 representation 已基本收敛到 LLM 的 output distribution space，后续层做 refinement
      而非结构性变换。Spearman ρ=-0.88 不是完美 -1.0，允许个别层之间存在微小非单调波动（如 attention head 的 residual
      connection 偶尔略微恢复 spatial structure），但整体趋势是强单调递减。Untrained model 呈现相似但略弱的单调性（ρ=-0.82），因为随机权重的

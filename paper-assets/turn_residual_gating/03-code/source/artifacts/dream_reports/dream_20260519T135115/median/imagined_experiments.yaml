- name: Downstream task sanity check (instruction retention)
  plan_id: plan_014
  description: 多轮对话中 system prompt 指令遵循准确率测试，建立 GAR 与实际任务表现的关联
  expected_results:
    task_type: system prompt instruction following accuracy
    num_instructions: 5
    num_conversations: 20
    num_turns_per_conv: 10
    base_turn1_accuracy: 0.82
    base_turn5_accuracy: 0.71
    base_turn10_accuracy: 0.61
    base_accuracy_drop: 0.256
    tg_turn1_accuracy: 0.84
    tg_turn5_accuracy: 0.73
    tg_turn10_accuracy: 0.63
    tg_accuracy_drop: 0.25
    lora_turn1_accuracy: 0.83
    lora_turn5_accuracy: 0.72
    lora_turn10_accuracy: 0.62
    lora_accuracy_drop: 0.253
    gar_accuracy_pearson_r: 0.52
    gar_accuracy_pearson_p: 0.003
    tg_vs_base_accuracy_p_value: 0.24
    tg_vs_base_accuracy_significant: false
  result_rationale: 'System prompt instruction following 是 GAR 最直接的下游映射： GAR 衰减意味着模型对
    goal tokens 的 attention 降低，应导致 system prompt 指令被 "遗忘"。 Median 档下 GAR-accuracy
    correlation r=0.52 (p=0.003)——统计显著但中等强度。 r 不更高的原因：instruction following 不仅依赖 attention
    to goal tokens， 还受 in-context learning（中间 turn 可能重述指令）、指令复杂度、conversation topic
    drift 等因素影响。 GAR 是 necessary but not sufficient condition for instruction following。
    所有模型 accuracy 衰减幅度相似（25-26%），TG 与 Base 无显著差异（p=0.24）， 与 GAR 层面 "gating 无增量贡献"
    完全一致。 这回应了 W3（"GAR 作为唯一代理指标"）：虽然 r=0.52 不是 perfect correlation， 但足以证明 GAR 衰减有
    real-world consequence，且 gating 的失败同样反映在 task level。

    '

  analysis: 'Llama 3-way eval 是 C5 ("partial cross-model evidence") 的核心数据。关键发现： (1)
    Gap 存在但更弱（12x vs 22x）—— "order-of-magnitude" 措辞仍成立，但不能说 "同等幅度"。 (2) Gating 无增量贡献在两个架构上一致——这比
    gap ratio 的精确数值更有说服力。 (3) 一个意外的巧合：两个模型的 TG inference Dongre GAR 都是 0.022—— 但这源于不同的训练
    GAR（0.48 vs 0.26），说明推理时的 floor 值可能由 base model 特性而非训练效果决定。 论文策略：Table 6 并排展示两模型结果，Discussion
    用一段专门分析 gap ratio 差异 （GQA 的 KV 共享如何限制训练 ceiling 但对推理 floor 影响不大）， 将架构差异转化为分析贡献而非弱化因素。

    '
- name: Llama-3.1-8B gradient conflict analysis
  plan_id: plan_013
  description: Llama-3.1-8B 上 3 个 epoch checkpoint 的 NTP-GAR 梯度冲突分析，验证跨模型一致性
  expected_results:
    epoch0_cos_sim_mean: -0.041
    epoch0_cos_sim_std: 0.048
    epoch0_mag_ratio: 5.2
    epoch1_cos_sim_mean: -0.009
    epoch1_cos_sim_std: 0.052
    epoch1_mag_ratio: 8.7
    epoch2_cos_sim_mean: 0.015
    epoch2_cos_sim_std: 0.044
    epoch2_mag_ratio: 12.3

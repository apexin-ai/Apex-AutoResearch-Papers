- name: Qwen-2.5-7B gradient conflict analysis
  plan_id: plan_006
  description: 在 v7 的 3 个 epoch checkpoint 上分别计算 NTP 和 GAR 对 gate 参数的梯度，测量 cosine
    similarity 和 magnitude ratio
  expected_results:
    epoch0_cos_sim_mean: -0.072
    epoch0_cos_sim_std: 0.031
    epoch0_mag_ratio: 7.8
    epoch1_cos_sim_mean: -0.038
    epoch1_cos_sim_std: 0.025
    epoch1_mag_ratio: 11.2
    epoch2_cos_sim_mean: 0.011
    epoch2_cos_sim_std: 0.019
    epoch2_mag_ratio: 14.1
    layers_negative_cos_sim_epoch0: 22/28
    layers_negative_cos_sim_epoch1: 17/28
    layers_negative_cos_sim_epoch2: 8/28
    ntp_grad_norm_mean: 0.0034
    gar_grad_norm_mean_epoch0: 0.00044
    gar_grad_norm_mean_epoch2: 2.4e-05
  result_rationale: 'Epoch 0 结束时 GAR 已收敛到 ~0.48（gs144 远早于 epoch 0 结束），但 GAR loss 残余梯度仍可测量。
    NTP 推 gate→1.0（保留 residual stream 以优化语言建模），GAR 推 gate→lower（衰减 residual 以改变 attention），
    两者方向冲突导致 cos_sim=-0.072。但 median 档的特征是逐层变异性大（std=0.031），22/28 层为负并非全部—— 6 层梯度碰巧对齐，使得
    "universal conflict" 措辞不成立。 随训练推进，GAR loss 趋零，GAR 梯度幅度骤降（mag_ratio 从 7.8x 升至 14.1x），
    冲突信号消散——epoch 2 时 cos_sim 转微正（+0.011），仅 8/28 层残留负值。 这说明梯度冲突是 early-training phenomenon，塑造了
    gate 的初始偏置后即消失， NTP 在训练全程主导 gate 参数更新。支撑 SP2 但需加 "conflict is transient" caveat。

    '
  tables:
  - name: 'Table: NTP-GAR gradient conflict across training checkpoints (Qwen-2.5-7B)'
    columns:
    - Checkpoint
    - cos_sim (mean ± std)
    - Mag ratio (NTP/GAR)
    - Layers with cos_sim < 0
    rows:
    - - Epoch 0
      - −0.072 ± 0.031
      - 7.8×
      - 22/28 (79%)
    - - Epoch 1
      - −0.038 ± 0.025
      - 11.2×
      - 17/28 (61%)
    - - Epoch 2
      - +0.011 ± 0.019
      - 14.1×
      - 8/28 (29%)
  figures_description:
  - 28-layer heatmap of per-layer cos_sim across 3 checkpoints。Epoch 0 以蓝色（负值）为主但散布若干黄色层；逐
    epoch 过渡到中性色调，直观展示冲突消散过程。
  - 双 y 轴折线图：左轴 cos_sim (3 means with error bars)，右轴 mag_ratio。cos_sim 从负趋零，mag_ratio
    单调上升，交叉趋势清晰。
  analysis: '梯度冲突在训练早期最显著但不 universal——epoch 0 仍有 6/28 层 cos_sim 为正，无法宣称 "all layers
    conflict"。 论文叙事应调整为：NTP-GAR 梯度冲突是 predominant early-training phenomenon， shapes
    gate initialization bias toward identity (gate→1.0)，后期 NTP 完全主导。 机制描述从 "ongoing
    competition" 改为 "early competition establishes adverse bias + subsequent NTP dominance
    locks it in"。 Magnitude ratio 7.8-14.1x 始终确认 NTP 梯度占绝对优势，这比方向冲突更 robust 的证据。

    '
- name: Attention heatmap visualization
  plan_id: plan_007
  description: 4 模型 (Base/TG/UG/LoRA) × 3 对话 × 28 层的 goal-token attention 热力图，对比训练态与推理态
  expected_results:
    base_goal_attn_turn1_mean: 0.038
    base_goal_attn_turn10_mean: 0.011
    tg_teacher_forced_goal_attn_turn10_mean: 0.145
    tg_inference_goal_attn_turn10_mean: 0.013
    ug_inference_goal_attn_turn10_mean: 0.012
    lora_inference_goal_attn_turn10_mean: 0.014
    visual_distinguishability_train_vs_infer: high
    visual_distinguishability_across_models_infer: none
    layers_retaining_faint_goal_attn: L0-L5
  result_rationale: 'Teacher-forced context 下 TG 的 attention pattern 确实被 GAR loss
    重塑（goal attention ~0.145 at turn 10）， 但推理时这些 pattern 完全消失（降至 0.013，与 base 0.011
    无实质差异）。 这是因为 teacher-forcing 提供 gold context 使模型在 "正确" 分布上做 attention， 而推理时模型
    condition on 自己的 generation——两者分布不同导致 trained attention pattern 不迁移。 4 个模型推理时热力图高度相似，视觉上不可区分，是
    "gating 无增量贡献" 最直观的证据。 L0-L5 保留微弱 goal attention 因为浅层处理 local/positional context，受
    distribution shift 影响较小。

    '
  tables: []
  figures_description:
  - 4×2 heatmap grid (4 models × train/infer)。每个 panel 横轴 turn (1-21)，纵轴 layer (0-27)，色深为
    goal token attention。左列 TG train panel 在 L5-L20, turn 5-21 有明显亮区；右列 4 个 infer
    panels 几乎全黑，仅 L0-L3 有微弱亮色。Train-infer 对比视觉冲击力强。
  - Per-turn goal attention 折线图 (4 models overlaid, inference only)。4 条线几乎完全重合并单调下降。3
    条对话分 3 个 subplot。
  analysis: 'Heatmap 是 paper 中最直观的证据，建议作为 Figure 3 置于 Analysis section 显著位置。 Train
    panel 的 "亮区" vs Infer panel 的 "全黑" 一张图胜过整段文字解释 30x gap。 4 模型推理时重合的折线图是 Table 数据的视觉补充，证明
    GAR 数值差异（0.011-0.014）在 attention 层面不可见。 建议在 figure caption 中标注 "goal attention
    computed on identical conversations under teacher-forcing (left) vs autoregressive
    generation (right)"。

    '

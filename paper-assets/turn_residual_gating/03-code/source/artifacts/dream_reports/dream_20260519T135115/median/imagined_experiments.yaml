  analysis: 'Llama 梯度冲突是 paper 中最弱的证据。Confidence interval 包含零， 仅凭 Llama 数据无法做出 "significant
    gradient conflict" 的 claim。 论文处理：(1) Llama 梯度数据放 Appendix，不进主文 table/figure； (2)
    主文仅一句话引用："Directionally consistent but noisier gradient conflict observed on Llama-3
    (Appendix D), with the weaker signal likely attributable to GQA''s shared KV projection
    averaging out per-head gradient directions"； (3) 强调 Qwen 上的 cleaner signal 是 SP2
    的主要支撑，Llama 仅为 "partial corroboration"。 Per-layer correlation r=0.43 应在 Discussion
    中诚实 acknowledge：梯度冲突的 exact layer-level pattern 与架构有关，cross-model claim 限于 "direction
    of effect" 层面。


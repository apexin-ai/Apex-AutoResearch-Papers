  result_rationale: 'Held-out eval 的核心发现是 gap ratio 从 training-set eval 的 ~31x 缩至
    ~22x（缩减 ~29%）。 缩减原因：训练集中的对话在 fine-tuning 时被模型见过，推理时模型在这些 "熟悉" 的对话上生成的 context
    与 teacher-forced context 更接近（模型对这些分布记忆更深），导致 distribution shift 被低估。 在 truly held-out
    data 上，模型 condition on 更 "陌生" 的自身 generation，shift 更大→但 inference GAR 反而略高（0.022
    vs 0.016）， 因为 held-out 对话的 goal token 分布与训练集不完全相同，某些对话恰好 easier。 净效果是 gap 缩小（从
    31x 到 22x）但仍为 order-of-magnitude 级别。 TG 比 LoRA 好 0.004 GAR (p>0.1)，不显著——gating
    无增量贡献在 held-out 上仍成立。 PPL 全面略升（TG: 2.81 vs 2.63），确认 training-set eval 有 memorization

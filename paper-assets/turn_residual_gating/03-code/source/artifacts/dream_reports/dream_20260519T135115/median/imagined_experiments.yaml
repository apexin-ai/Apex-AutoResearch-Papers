    layers_negative_cos_sim_epoch1: 14/32
    layers_negative_cos_sim_epoch2: 10/32
    cross_model_per_layer_cos_sim_correlation_r: 0.43
  result_rationale: 'Llama 梯度冲突信号比 Qwen 更弱且更嘈杂——这是 median 档的核心特征。 Epoch 0 cos_sim
    = -0.041（vs Qwen -0.072），绝对值几乎减半。 原因：GQA 中 gate 参数的梯度由 32 个 query head 通过 8 个
    shared KV head 间接传播， 不同 query head group 对 NTP 和 GAR 的梯度方向不一致，aggregate 后相互稀释。
    Per-layer std = 0.048（vs Qwen 0.031），方差更大，20/32 层为负（63%，vs Qwen 79%）。 关键问题：epoch
    0 的 confidence interval [-0.041 ± 0.048] 包含零， 单凭 Llama 数据无法在统计上拒绝 "无梯度冲突" 的零假设。
    Mag_ratio 起始更低（5.2 vs 7.8）是因为 Llama 训练 GAR 收敛更慢，epoch 0 结束时 GAR loss 仍有更大残余梯度。
    跨模型 per-layer cos_sim 相关性仅 r=0.43，说明冲突 pattern 与具体架构有关，非完全 architecture-agnostic。

    '

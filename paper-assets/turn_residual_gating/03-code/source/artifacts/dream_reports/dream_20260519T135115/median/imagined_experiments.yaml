tier: median
narrative_guidance: '核心 distribution shift insight 成立，但 "structural barrier" 须降级为
  "strong empirical tendency"。 Qwen 为主实验，Llama 为 supporting evidence 而非 full replication。
  gap ratio 从 "30x" 调整为 "order-of-magnitude gap"：Qwen held-out ~22x，Llama ~12x。 gate
  reversal 从 "universal" 改为 "predominant pattern"（Qwen 27/28, Llama 19/32）。 梯度冲突信号方向一致但噪声大，需报告
  per-checkpoint 变异性。 C5 降为 "partial cross-model evidence"，补充讨论 GQA vs MHA 导致的差异。
  Estimated reviewer score 3.0-3.5，Findings 可行，Main 可能性低。

  '

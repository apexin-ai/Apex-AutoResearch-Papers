    attention 架构的结构性差异如何影响 gating 的有效干预空间—— 这本身是一个 minor contribution；(3) 强调即使训练 GAR
    较低， training-inference gap 仍存在（将在 plan_012 中量化为 ~12x）。 Gate reversal 从 "universal
    (27/28)" 降级为 "predominant (19/32 on Llama, 27/28 on Qwen)"。

    '

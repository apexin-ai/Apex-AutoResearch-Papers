    line 标注 r=0.52, p=0.003。色标区分 3 个模型，三者 cluster 重叠。'
  analysis: r=0.52 足以在 paper 中作为 paragraph 级别证据（不值得独立 section）， 适合放在 Analysis 末尾或
    Discussion 中。建议表述： "GAR degradation correlates with measurable decline in instruction
    following (r=0.52, p<0.01), providing task-level grounding for our attention-based
    analysis. However, the moderate correlation suggests additional factors beyond
    goal attention contribute to instruction retention." 作为 P2 实验，回应 W3 足矣，不改变 paper
    核心叙事。 TG 与 Base 在 task level 无显著差异是对 "gating 无增量贡献" 最有说服力的呈现方式—— reviewer 可能更容易理解
    "accuracy 没变" 比 "GAR 没变"。

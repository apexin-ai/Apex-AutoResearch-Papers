    training_time_hours: 7.2
  result_rationale: 'GQA 的 KV 共享限制了 gate 能影响的 attention 维度：8 个 KV head 被 32 个 query
    head group 共享， gate 对 residual stream 的 scalar attenuation 经过共享 KV 投影后，对每个 query
    head 的影响被稀释。 结果是 training GAR 仅达 0.26（vs Qwen 0.48），收敛更慢（gs280 vs gs144）， 且 phase
    C plateau 有噪声（0.22-0.30 波动，不如 Qwen 的稳定 0.48）。 Gate direction 仅 19/32 层反转（59%，vs
    Qwen 96%）—— GQA 使不同 query head group 对 gate 的梯度方向不一致，部分 group 间梯度相互抵消， 导致一些层的
    net gradient 碰巧朝 "正确" 方向。这不意味着 gating 在这些层有效—— 正确方向的层 gate attenuation 同样微弱（2-5%），不足以实质改变
    attention。 NTP loss 0.919 高于 Qwen 0.896，反映 Llama 在 UltraChat 对话格式上 fine-tune 效率稍低
    （Llama 的 pre-training distribution 与中文/英文多轮对话的 gap 可能更大）。

    '

    tg_instruction_retention_turn1: 0.84
    tg_instruction_retention_turn10: 0.63
    tg_retention_drop: 0.25
    lora_instruction_retention_turn1: 0.83
    lora_instruction_retention_turn10: 0.62
    lora_retention_drop: 0.253
    tg_vs_lora_retention_diff: 0.01
    gar_retention_correlation: 0.31
    gar_retention_correlation_p: 0.18
  result_rationale: '在 worst 档下，downstream task 结果 mixed： (1) Instruction retention
    确实随 turn 衰减 (~25%)，与 GAR decay 方向 一致，但相关性弱 (r=0.31, p=0.18)。这说明 GAR 不是 instruction
    retention 的 clean proxy——attention 衰减和 task performance 衰减 之间有关系但不紧密； (2) TG vs
    LoRA-only 的 retention 差异可忽略 (Δ=0.01)，与 GAR eval 一致（gating 无实质帮助）； (3) 所有 fine-tuned
    模型比 base 略好但差异小，说明 LoRA 训练本身 （而非 gating）带来微弱改善。 整体：GAR 与下游 task 的弱相关性是 worst 档的额外风险——reviewer
    可能 质疑 "如果 GAR 和实际 task performance 相关性不强，为什么要关注 GAR？" 但 25% 的 retention drop 本身是
    real 的，只是 GAR 作为其 proxy 不够 precise。

    '

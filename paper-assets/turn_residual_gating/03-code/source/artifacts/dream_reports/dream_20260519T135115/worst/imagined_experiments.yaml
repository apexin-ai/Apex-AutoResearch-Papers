    中所有引用 "30x" 的地方。15x 仍然 dramatic enough 支撑 distribution shift story，但不如 30x 那么
    catchy。 需要改为 "15-30x depending on eval set" 的表述。 (2) TG > LoRA-only (Δ=0.010,
    p=0.08) 更麻烦。必须在论文中正面 address： "On held-out data, ThreadGate shows a marginal but
    non-significant advantage, suggesting that gating may capture a small real signal
    that is amplified by memorization on the training eval set." 这把 C4 从 "zero contribution"
    弱化为 "negligible contribution"。对论文整体 narrative 不致命但增加 reviewer 攻击面。


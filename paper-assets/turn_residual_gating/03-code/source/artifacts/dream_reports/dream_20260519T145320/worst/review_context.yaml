    pattern 暗示不同的底层机制。这意味着 C1 的 claim 需要从 "GAR 衰减是严重的结构性现象" 修改为 "GAR 衰减的严重程度是 architecture-dependent
    的"。Llama 的 higher baseline mid-turn GAR (0.0284 vs 0.0122) 意味着 Llama 在没有任何干预的情况下就保留了更多的

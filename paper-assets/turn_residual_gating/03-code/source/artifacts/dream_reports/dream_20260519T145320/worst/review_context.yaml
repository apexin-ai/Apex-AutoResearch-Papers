- name: Exposure-Bias Mitigation (Scheduled Sampling)
  plan_id: plan_016
  description: '使用 scheduled sampling 训练 ThreadGate v7：训练过程中逐步混入 model-generated context（替代
    teacher-forced gold context），测试能否缩小 30x training-inference GAR gap。Linear schedule:
    epoch 0 = 100% teacher-forcing, epoch 2 = 50% model-generated。

    '
  expected_results:
    training_gar_final: 0.31
    training_gar_teacher_forced_final: 0.44
    training_gar_model_generated_final: 0.18
    inference_dongre_mid_gar: 0.0165
    inference_ours_mid_gar: 0.0175
    baseline_inference_dongre_mid_gar: 0.0152
    baseline_inference_ours_mid_gar: 0.0157
    gap_reduction_factor: 0.92
    gap_original_ours: 30.6
    gap_mitigated_ours: 17.7
    gap_reduction_pct: 42
    actual_inference_gar_improvement_pp: 0.18
    ppl: 2.72
    ppl_vs_baseline: -0.06
    training_time_hours: 9.5
    scheduled_sampling_final_ratio: 0.5
  result_rationale: 'Worst tier 假设 scheduled sampling 不缩小 gap（或缩小 <20%）。但实际预测更微妙：
    gap ratio 从 30.6x 缩小到 17.7x（看似 42% reduction），但这主要是因为 training GAR 从 0.48 下降到
    0.31（分母变小），而 inference GAR 几乎不变（0.0157→0.0175，仅 +0.18pp）。 真正的问题是：scheduled sampling
    确实让模型在 model-generated context 上 "看到" 了 更真实的训练分布，但 NTP loss 仍主导梯度，在 model-generated
    context 上 NTP 的梯度 更大（因为 PPL 更高），进一步压制 GAR 信号。结果是：模型在 mixed context 上训练的 GAR 低于纯
    teacher-forcing（0.31 vs 0.48），但推理端改善几乎为零。 mitigation_gap_reduction_factor = 实际推理
    GAR 改善 / 理论预期改善 ≈ 0.92（接近 1 意味着 gap 实际上没缩小；此处按 inference GAR 绝对值计算 0.0175/0.0157
    = 1.11， 即仅 11% 的 inference GAR 改善）。这说明 exposure bias 的 mitigation 不是简单地 "让模型看到
    model-generated context" 就能解决——NTP-GAR 梯度竞争在任何 context 分布下都存在，这是一个 orthogonal
    的问题。

    '
  tables:
  - name: 'Table: Scheduled Sampling Mitigation Results (Qwen-2.5-7B)'
    columns:
    - Metric
    - Baseline (TG v7)
    - Scheduled Sampling
    - Change
    rows:
    - - Training GAR (final)
      - '0.48'
      - '0.31'
      - -0.17 (↓35%)
    - - Inference GAR-ours
      - '0.0157'
      - '0.0175'
      - +0.18pp (↑11%)
    - - Inference GAR-Dongre
      - '0.0152'
      - '0.0165'
      - +0.13pp (↑9%)
    - - Train-Infer Gap (ours)
      - 30.6x
      - 17.7x
      - ↓42% (misleading)
    - - PPL
      - '2.63'
      - '2.72'
      - +0.09 (↑3.4%)
    - - Training Time
      - 5.9h
      - 9.5h
      - +61% overhead
  figures_description:
  - 'Fig: Two-panel comparison. Left: Training GAR curves for baseline (reaches 0.48)
    and scheduled sampling (reaches 0.31, with model-generated portions showing much
    lower GAR ~0.18). Right: Inference GAR comparison — two nearly overlapping bar
    clusters, with scheduled sampling showing marginal +0.18pp improvement. The visual
    message: training changes dramatically but inference barely moves.'
  - 'Fig: Decomposed training GAR by context type. Teacher-forced portions maintain
    GAR ~0.44; model-generated portions stabilize at ~0.18. The gap between these
    two within-training curves foreshadows the failure to close the training-inference
    gap.'
  analysis: Scheduled sampling 的 "失败" 在 worst tier 下有两层含义：(1) 实证层面，推理 GAR 仅 改善 0.18pp（从
    0.0157 到 0.0175），在实际意义上 negligible——这验证了 mitigation 无效的假设；(2) 理论层面，这提供了重要的因果排除证据：如果
    exposure bias 是 30x gap 的主因，scheduled sampling 应该实质性缩小 gap，但它没有 → exposure bias
    不是唯一 因素，甚至可能不是主因。NTP-GAR 梯度竞争是一个 independent failure mechanism， 在任何 context 分布下都存在。这在
    worst tier 叙事中变为 "exposure bias 不是唯一因素" 的证据，引入 architecture-specific confound。但这也削弱了
    SP1 的核心卖点——如果 exposure bias 不是主因，那 "exposure bias 的首个定量测量" 的叙事价值下降。需要 reframe
    SP1 为 "distribution shift 和 gradient competition 的 entangled effects 的首个量化"。

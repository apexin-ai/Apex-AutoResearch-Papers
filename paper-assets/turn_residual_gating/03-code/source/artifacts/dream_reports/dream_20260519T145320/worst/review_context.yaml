narrative_guidance: 'Reframe 为 ''Why does gating fail on Qwen but not Llama? An architecture-dependent
  analysis of NTP-auxiliary loss interaction''。核心 angle 转向两个架构的对比本身成为 insight——什么架构特性使
  Qwen 更脆弱（GQA head 结构差异、layer norm 位置、attention pattern 分布）。SP1 从 ''普遍现象的 首个量化''
  收窄为 ''architecture-dependent vulnerability 的首个量化 + 对比分析''。30x gap 仍是 Qwen 上的有效 finding，但不再
  claim 普遍性。Mitigation 负面结果变为 ''exposure bias 不是唯一因素'' 的证据，引入 architecture-specific
  confound。仍投 EMNLP Findings（不降级 venue），但叙事从 universal mechanism 转为 contrastive case
  study。需追加 Llama 的详细 gate profile + attention pattern 对比分析，写作量增加。预期 review score
  2.5-3.0。

  '
imagined_experiments:
- name: Qwen v7 Gradient Conflict Analysis (3 checkpoints)
  plan_id: plan_006
  description: '对 v7 训练的 3 个 epoch checkpoint 提取 NTP 与 GAR loss 在 gate 参数上的梯度， 计算逐层
    cosine similarity 和 magnitude ratio。Qwen 数据本身不受 worst tier 影响 （已在 Qwen 上观测到强梯度冲突），但在
    worst tier 叙事下，这些数据将被 reframe 为 Qwen-specific vulnerability 而非 universal mechanism。

    '
  expected_results:
    epoch0_cos_sim_mean: -0.089
    epoch0_cos_sim_negative_layer_pct: 0.79
    epoch0_mag_ratio_mean: 7.5
    epoch1_cos_sim_mean: -0.061
    epoch1_cos_sim_negative_layer_pct: 0.71
    epoch1_mag_ratio_mean: 11.2
    epoch2_cos_sim_mean: -0.042
    epoch2_cos_sim_negative_layer_pct: 0.67
    epoch2_mag_ratio_mean: 14.7
    L27_mag_ratio_epoch0: 135
    L27_mag_ratio_epoch2: 1139
    layers_with_persistent_negative_cos_sim: 18
  result_rationale: 'Qwen-2.5-7B 的梯度冲突数据已在 D014/D015 中间接观测并在 paper_framing 中引用。 此实验是正式化提取。Qwen
    的 GQA 结构（28 层，grouped query attention with fewer KV heads） 使得 NTP 梯度在 gate 参数上的投影与
    GAR 梯度方向持续冲突。cos_sim 从 -0.089 缓解到 -0.042 不是因为两个 loss 调和，而是 GAR 信号被边缘化（mag_ratio
    从 7.5x 涨到 14.7x）。 L27 的 mag_ratio 从 135x 暴涨到 1139x 说明最后几层 NTP 完全主导 gate 学习。这些数字
    在 worst tier 下不变，但叙事角色从 "universal gradient competition" 降级为 "Qwen-specific gradient
    competition"，与 Llama 的弱冲突形成对比。

    '
  tables:
  - name: 'Table: NTP-GAR Gradient Conflict Across Training (Qwen-2.5-7B)'
    columns:
    - Checkpoint
    - cos_sim (mean±std)
    - '% layers cos<0'
    - mag_ratio (mean)
    - mag_ratio (L27)
    - Interpretation
    rows:
    - - Epoch 0 (gs 2650)
      - -0.089 ± 0.12
      - 79%
      - 7.5x
      - 135x
      - Strong directional conflict, moderate NTP dominance
    - - Epoch 1 (gs 5300)
      - -0.061 ± 0.11
      - 71%
      - 11.2x
      - 487x
      - Conflict weakening as GAR signal marginalized
    - - Epoch 2 (gs 7950)
      - -0.042 ± 0.10
      - 67%
      - 14.7x
      - 1139x
      - GAR effectively silenced; NTP fully controls gates
  figures_description:
  - 'Fig: 28-layer heatmap of cos_sim across 3 checkpoints. Color: blue=negative (conflict),
    red=positive (aligned). Shows persistent blue in layers 3-14 (early-mid), with
    layers 25-27 deep blue across all checkpoints. Upper layers transition from blue
    to near-zero, indicating GAR gradient vanishing rather than alignment.'
  - 'Fig: Per-layer mag_ratio bar chart at epoch 2. Logarithmic y-axis. Layers 25-27
    show extreme ratios (100-1139x), layers 0-5 moderate (5-15x). Demonstrates NTP
    dominance is strongest in final layers where attention routing decisions matter
    most.'
  analysis: 'Qwen 的梯度冲突证据仍然是 valid finding。在 worst tier 下，关键 reframing 是：为什么 Llama
    不展现同样程度的冲突？假说：Qwen 的 GQA 结构中 KV heads 较少（7 groups vs Llama 的 8 groups），attention
    参数共享程度更高，使得 NTP 和 GAR 在相同参数空间上的竞争更激烈。 这个对比本身成为新的 insight，但也意味着 claim 必须从 "NTP-GAR
    competition is a fundamental obstacle" 收窄为 "NTP-GAR competition severity is architecture-dependent"。

    '

- name: Llama-3.1-8B Phase 1 GAR Degradation Diagnosis
  plan_id: plan_009
  description: '在 Llama-3.1-8B base model 上运行与 Qwen 相同的 GAR 诊断流程（5 段对话，10 turns），
    确认 GAR 衰减是否存在及其程度。

    '
  expected_results:
    turn1_avg_gar: 0.038
    turn2_avg_gar: 0.0325
    turn3_avg_gar: 0.031
    turn4_avg_gar: 0.029
    turn5_avg_gar: 0.0285
    turn6_avg_gar: 0.0275
    turn7_avg_gar: 0.027
    turn8_avg_gar: 0.0265
    turn9_avg_gar: 0.028
    turn10_avg_gar: 0.026
    mid_turns_avg_gar: 0.0284
    relative_drop: 0.25
    pattern_type: non-monotonic, gentle slope with fluctuations
  result_rationale: 'Worst tier 假设 Llama-3 base GAR 衰减很弱（raw drop 10-30%）或 pattern
    不同。 预测 25% 的 relative drop（vs Qwen 70.8%）。原因：Llama-3.1-8B 使用标准 GQA（8 KV heads
    vs Qwen 的 7 groups），RoPE 位置编码实现不同，pre-norm 与 Qwen 的 pre-norm 虽同为 RMSNorm 但 epsilon
    和初始化不同。更重要的是，Llama 的 attention head 分布 可能天然更分散——Meta 的训练数据规模（15T tokens）远大于 Qwen（未公开但估计
    3-7T）， 使 attention pattern 更鲁棒，不容易出现极端的 goal attention 集中→衰减模式。 Non-monotonic
    pattern（turn 9 反弹）进一步暗示 Llama 的 attention 不是简单的单调衰减， 而是有更复杂的 turn-dependent 动态。这直接挑战
    "GAR 衰减是普遍的结构性现象" 的 claim。


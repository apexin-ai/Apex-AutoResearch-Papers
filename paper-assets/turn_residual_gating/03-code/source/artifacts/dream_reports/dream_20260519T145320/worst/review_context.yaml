      - '+0.008'
      - Llama resolves conflict; Qwen retains it
    - - '% layers cos<0 (epoch 2)'
      - 67%
      - 41%
      - Majority of Llama layers are non-conflicting
    - - mag_ratio (epoch 2)
      - 14.7x
      - 3.5x
      - NTP dominance 4x weaker on Llama
    - - Top layer mag_ratio
      - 1139x (L27)
      - 18.5x (L31)
      - Extreme NTP suppression Qwen-specific
  figures_description:
  - 'Fig: Side-by-side 2D heatmaps (layers x epochs) of cos_sim for Qwen and Llama.
    Qwen: persistent blue (negative) across most layers and epochs. Llama: transitions
    from light blue to light red (positive) in most layers by epoch 2. Stark visual
    contrast highlights architecture-dependent gradient dynamics.'
  analysis: '这是 worst tier 下最具分析价值的对比数据。Llama 的梯度 "和解"（cos_sim 从 -0.015 转为 +0.008）vs
    Qwen 的持续冲突（-0.089 → -0.042 但从未转正）直接解释了为什么 gating 在 Llama 上有微弱正效果：NTP 和 GAR 在 Llama
    上不是零和博弈。这支持了 architecture-dependent vulnerability 的叙事——Qwen 的架构使 NTP-GAR 竞争成为不可调和的冲突，而
    Llama 的架构 允许两者共存。核心 insight 从 "gradient competition kills gating" 转为 "gradient
    competition kills gating on architectures where NTP and GAR cannot find orthogonal
    subspaces"。

    '

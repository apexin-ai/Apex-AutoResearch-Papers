- name: Bootstrap CI for TG-LoRA Comparison
  plan_id: plan_015
  description: '使用 plan_008 的 held-out eval 数据（50 conversations），计算 TG vs LoRA-only
    的 paired bootstrap 95% CI，统计检验 "zero benefit" 假设。

    '
  expected_results:
    n_conversations: 50
    n_bootstrap_samples: 10000
    tg_lora_dongre_gar_diff_mean: 0.002
    tg_lora_dongre_gar_diff_ci_lower: -0.0025
    tg_lora_dongre_gar_diff_ci_upper: 0.0068
    tg_lora_ours_gar_diff_mean: 0.0057
    tg_lora_ours_gar_diff_ci_lower: 0.0012
    tg_lora_ours_gar_diff_ci_upper: 0.0105
    tg_lora_ppl_diff_mean: 0.0
    tg_lora_ppl_diff_ci_lower: -0.02
    tg_lora_ppl_diff_ci_upper: 0.02
    dongre_ci_includes_zero: true
    ours_ci_includes_zero: false
    ppl_ci_includes_zero: true
  result_rationale: 'Worst tier 假设 "一个或多个 bootstrap CI 不包含 0"。预测 GAR-ours 口径的 CI 不包含
    0 （lower bound 0.0012 > 0），而 GAR-Dongre 口径的 CI 包含 0（lower bound -0.0025）。 这种分裂发生的原因：GAR-ours
    使用 "system prompt + first user query" 作为 goal tokens 且仅看 last token per assistant
    turn，这个定义下 TG 可能因训练时的 MSE target 优化 （即使推理时效果微弱）在 last-token position 上保留了一丝额外的
    goal attention， 足以在统计上与 LoRA-only 分离。而 GAR-Dongre 的 "all response tokens" 平均化了这个
    微弱信号，使 CI 仍包含 0。实际差异（0.57pp ours, 0.20pp Dongre）都极小，但统计上的 不一致给论文带来麻烦：reviewer
    可以 argue "在一种评估口径下 gating 有统计显著的正效果"， 动摇 zero-benefit claim 的坚定性。


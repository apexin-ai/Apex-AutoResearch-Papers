paper_key: "fan2020reducing"
title: "Reducing Transformer Depth on Demand with Structured Dropout (LayerDrop)"
venue: "ICLR 2020"
full_text_available: false

research:
  baselines: ["full Transformer", "standard dropout", "stochastic depth"]
  metrics:
    - {name: "BLEU", direction: "higher_better"}
    - {name: "perplexity", direction: "lower_better"}
    - {name: "accuracy", direction: "higher_better"}
    - {name: "inference speedup", direction: "higher_better"}
  datasets:
    - {name: "WMT En-De", size: "4.5M pairs"}
    - {name: "WikiText-103", size: "103M tokens"}
    - {name: "ELI5", size: "standard"}
  ablation_dimensions: ["drop rate", "drop strategy (every other, top, random)", "model depth"]
  training_recipe: {optimizer: "Adam", hardware: "GPUs"}
  method_family: "structured dropout / adaptive depth"

positioning:
  core_claim: "Training with structured layer dropout produces models that can be pruned at inference time to any desired depth with minimal quality loss"
  key_results: "remove 50% layers at inference with <1 BLEU drop on WMT"
  limitations: ["requires training from scratch with LayerDrop", "not applicable to pre-trained models without fine-tuning"]
  relation_to_us: "foundation"


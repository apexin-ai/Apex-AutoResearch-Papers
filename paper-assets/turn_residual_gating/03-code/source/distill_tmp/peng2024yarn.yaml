paper_key: "peng2024yarn"
title: "YaRN: Efficient Context Window Extension of Large Language Models"
venue: "ICLR 2024"
full_text_available: true

research:
  baselines:
    - "Position Interpolation (PI)"
    - "NTK-aware interpolation"
    - "NTK-by-parts interpolation"
    - "Dynamic NTK"
    - "Dynamic PI"
    - "Code Llama (NTK-aware, 100k context)"
    - "Together.ai (PI, 32k context)"
    - "Llama 2 (original 4k context)"
  metrics:
    - {name: "Sliding window perplexity", direction: "lower_better"}
    - {name: "Passkey retrieval accuracy", direction: "higher_better"}
    - {name: "ARC-Challenge", direction: "higher_better"}
    - {name: "HellaSwag", direction: "higher_better"}
    - {name: "MMLU", direction: "higher_better"}
    - {name: "TruthfulQA", direction: "higher_better"}
    - {name: "Training GPU-hours", direction: "lower_better"}
  datasets:
    - {name: "Proof-pile", size: "128k-token documents, long-range evaluation"}
    - {name: "PG19", size: "training data, chunked to 64k segments"}
    - {name: "GovReport", size: "50 long documents, 32k context evaluation"}
    - {name: "HuggingFace Open LLM Leaderboard", size: "ARC/HellaSwag/MMLU/TruthfulQA suite"}
  ablation_dimensions:
    - "Interpolation method (PI vs NTK-aware vs NTK-by-parts vs YaRN)"
    - "Scale factor (2x, 4x, 8x, 16x)"
    - "Fine-tuning vs zero-shot (no fine-tuning)"
    - "Dynamic vs fixed scaling"
    - "Attention temperature scaling factor"
    - "Training steps (efficiency comparison)"
    - "Transfer learning (s=16 checkpoint to s=32)"
  training_recipe:
    optimizer: "AdamW (beta1=0.9, beta2=0.95)"
    lr: "2e-5 with 20-step linear warmup"
    batch_size: "64 (global)"
    weight_decay: "none"
    hardware: "A100 GPUs with PyTorch FSDP + Flash Attention 2"
    training_steps: "400 steps for s=16, +200 steps for s=32 (transfer)"
    training_cost: "128 A100-hours (7B, s=16), 256 A100-hours (7B, s=32)"
    dataset: "PG19 chunked to 64k segments with BOS/EOS tokens"
  method_family: "context extension / positional encoding (RoPE interpolation)"

positioning:
  core_claim: "YaRN combines NTK-by-parts interpolation with attention scaling to extend LLM context windows using 10x fewer tokens and 2.5x fewer training steps than prior methods, while enabling extrapolation beyond the fine-tuning context length."
  key_results: "Llama 2 7B achieves 2.37 perplexity at 128k tokens (trained on 64k data); 99.4% passkey retrieval at 128k; only 384 A100-hours total for 128k extension vs 640+ for PI at 16k; <1% degradation on Open LLM Leaderboard benchmarks"
  limitations:
    - "Perplexity alone may not fully capture effective context size; models can maintain retrieval accuracy while showing increasing perplexity"
    - "Evaluation limited to Llama family models; generalization to other RoPE-based architectures not verified"
    - "Alpha/beta hyperparameters (1, 32) tuned for LLaMA; may need re-tuning for other model families"
    - "Temperature scaling formula derived empirically by curve fitting, lacks theoretical justification"
  relation_to_us: "complementary"

narrative:
  story_type: "化繁为简型"
  hook: "Context window limitation is a critical bottleneck for transformer LLMs; existing extension methods either degrade quality or require prohibitive compute."
  tension: "Prior methods each address part of the problem -- PI handles interpolation but destroys high-frequency information; NTK-aware preserves frequencies but introduces OOD values; NTK-by-parts is principled but lacks attention scaling. No single method achieves both efficiency and quality."
  key_insight: "Different RoPE dimensions encode fundamentally different types of information (relative local vs absolute global position), requiring dimension-specific interpolation strategies; combined with a learned temperature correction for attention entropy, this yields a unified method superior to all components individually."
  argument_chain: "RoPE context limitation → PI as baseline → NTK-aware fixes frequency destruction → NTK-by-parts adds dimension-specific treatment → attention scaling corrects entropy shift → dynamic scaling enables extrapolation → YaRN unifies all insights → 10x less data, 2.5x less steps, extrapolation beyond training"
  contribution_framing: "Three contributions stated: (1) NTK-by-parts + attention scaling combined method, (2) dynamic scaling for inference-time adaptation, (3) transfer learning strategy for efficient progressive extension. Framed as evolutionary synthesis rather than revolutionary novelty."
  intro_structure: "5 paragraphs: P1 - transformer context limitation as problem; P2 - positional encoding landscape (absolute/relative/RoPE); P3 - prior context extension work and limitations; P4 - YaRN as unified solution with efficiency claims; P5 - contribution summary"
  notable_technique: "The paper traces a clear genealogy from PI through NTK-aware to NTK-by-parts to YaRN, making each step feel inevitable. Figure 1 as a method relationship diagram reinforces this evolutionary narrative. The 'train short, test long' framing is memorable and directly actionable."

figures:
  figure_count: 8
  figure1:
    type: "method_overview"
    description: "Hierarchical diagram showing relationships between interpolation methods: PI at base, branching to NTK-aware and Dynamic NTK, NTK-by-parts as separate branch, all converging toward YaRN at top."
    narrative_role: "Establishes YaRN as evolutionary synthesis of prior work; positions the contribution as principled unification rather than ad-hoc invention."
    design_elements: ["hierarchical/genealogy layout", "method names as nodes", "directional arrows showing derivation", "clean minimal style"]
    visual_style: "Clean tree/DAG diagram with minimal decoration; method names connected by arrows indicating intellectual lineage; no color coding, relies on topology to convey the narrative of progressive refinement."
  result_figures:
    - figure_id: "Figure 3"
      viz_type: "dual_panel_line_plot"
      what_compared: "Left: sliding window perplexity of PI/NTK-aware/NTK-by-parts/YaRN across context lengths; Right: passkey retrieval accuracy across context lengths"
      how_gain_highlighted: "YaRN line consistently lowest (perplexity) / highest (accuracy) across all context positions; direct visual dominance through line positioning"
      design_note: "Side-by-side dual metric presentation (quality + retrieval) gives holistic view; both axes share the same x-axis (context length) enabling parallel reading"
    - figure_id: "Figure 7"
      viz_type: "line_plot"
      what_compared: "Sliding window perplexity of YaRN vs Together.ai PI vs Code Llama NTK on 128k Proof-pile documents, from 8k to 131k tokens"
      how_gain_highlighted: "Competing methods diverge/explode at longer contexts while YaRN remains stable; logarithmic y-axis makes degradation dramatic"
      design_note: "Extended x-axis to 131k showcases the extrapolation capability; competing methods' failure is visually striking against YaRN's flat curve"
    - figure_id: "Figure 8"
      viz_type: "line_plot"
      what_compared: "RoPE vs Dynamic-PI vs Dynamic-YaRN on a single GovReport document"
      how_gain_highlighted: "Dynamic-YaRN tracks closest to original RoPE behavior while handling extended lengths"
      design_note: "Single-document case study makes the dynamic scaling benefit concrete and intuitive"
  ablation_figures:
    - figure_id: "Figure 2"
      viz_type: "dual_panel_line_plot"
      what_compared: "Training loss curves across interpolation methods for LLaMA 7B at 32k context"
      dimensions_varied: ["interpolation method (PI, NTK-aware, NTK-by-parts, YaRN)"]
      design_note: "Left panel shows full training trajectory; right panel zooms into convergence region for fine-grained comparison. YaRN converges fastest."
    - figure_id: "Figure 4"
      viz_type: "line_plot_with_shading"
      what_compared: "Perplexity vs attention temperature scaling factor across different extension scales"
      dimensions_varied: ["temperature scaling factor", "extension scale"]
      design_note: "Shaded standard deviation areas show sensitivity; used to derive the empirical temperature formula sqrt(1/t) = 0.1*ln(s)+1"
    - figure_id: "Figure 5"
      viz_type: "grouped_bar"
      what_compared: "Mean perplexity change % at different position segments of 16k-token documents"
      dimensions_varied: ["position segment", "temperature factor"]
      design_note: "Segment-level analysis reveals where temperature scaling helps most -- validates that scaling corrects attention entropy uniformly across positions"
    - figure_id: "Figure 6"
      viz_type: "bar_chart"
      what_compared: "Sample counts at optimal temperature for each position segment"
      dimensions_varied: ["position segment", "optimal temperature"]
      design_note: "Supports the claim that a single global temperature factor works well across all positions, justifying the simple formula"
  figure_narrative_role: "Figure 1 (method genealogy) → Figure 2 (training convergence showing YaRN advantage) → Figure 3 (main results: perplexity + retrieval) → Figures 4-6 (temperature ablation justifying the scaling formula) → Figure 7 (128k extrapolation showcase) → Figure 8 (dynamic scaling demonstration)"

tables:
  table_count: 10
  main_result_table:
    table_id: "Table 1"
    row_axis: "models (7B/13B) x extension configuration"
    col_axis: "context lengths (8192 to 131072)"
    row_organization: "by_model_size"
    col_organization: "by_context_length"
    highlight_strategy: "implicit best via ordering (YaRN results shown as culmination); footnote marks for diverged perplexity (>10)"
    statistical_reporting: "single run perplexity values"
    num_baselines: 0   # Table 1 shows only YaRN variants; baselines appear in Table 7
    design_note: "Clean table showing YaRN's scaling progression across model sizes; uses footnote notation for failed/diverged runs; progressive context doubling columns create visual narrative of successful extension"
  ablation_tables:
    - table_id: "Table 5"
      what_varied: ["interpolation method (PI/NTK-aware/NTK-by-parts/YaRN)", "scale factor (2x/4x/8x/16x)", "fine-tuning (yes/no)", "dynamic vs fixed"]
      variation_style: "full_numbers"
      design_note: "Comprehensive ablation matrix -- largest table in paper (28 rows); every combination of method x scale x fine-tuning; uses >10 notation for diverged results which visually highlights where methods break. This is the paper's core evidence table."
    - table_id: "Table 6"
      what_varied: ["method (PI vs YaRN)", "training steps (0 vs 400 vs 1000)"]
      variation_style: "full_numbers"
      design_note: "Targeted efficiency comparison: YaRN at 400 steps matches PI at 1000 steps, directly supporting the '2.5x fewer steps' claim"
  supplementary_tables:
    in_appendix: false
    content: "Tables 7-10 in main paper: Table 7 (Proof-pile comparison with open models), Table 8 (GovReport evaluation), Table 9 (passkey retrieval accuracy), Table 10 (Open LLM Leaderboard comparison). Also Table 2-3 for LLaMA/Llama2 benchmark results, Table 4 for GPU-hours comparison."
    reason: "All tables in main body (no appendix split). Paper uses many focused tables rather than a few large ones -- each table addresses a specific evaluation dimension (perplexity, benchmarks, retrieval, efficiency, comparison with open models). This modular approach avoids information overload while enabling comprehensive evaluation coverage."

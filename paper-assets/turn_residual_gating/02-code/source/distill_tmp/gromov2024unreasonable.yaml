paper_key: "gromov2024unreasonable"
title: "The Unreasonable Ineffectiveness of the Deeper Layers"
venue: "ICLR 2025"
full_text_available: true
authors:
  - "Andrey Gromov"
  - "Kushal Tirumala"
  - "Hassan Shapourian"
  - "Paolo Glorioso"
  - "Daniel A. Roberts"
arxiv_id: "2403.17887"
report_number: "MIT-CTP/5694"

research:
  baselines:
    - "unpruned model (full depth)"
    - "similarity-informed pruning (no healing)"
    - "similarity-informed pruning (with QLoRA healing)"
    - "simple pruning heuristic (remove deepest n layers, with healing)"
    - "random guessing baseline"
  metrics:
    - {name: "MMLU (5-shot)", direction: "higher_better"}
    - {name: "BoolQ (0-shot)", direction: "higher_better"}
    - {name: "C4 validation loss (normalized)", direction: "lower_better"}
    - {name: "GSM8K", direction: "higher_better"}
    - {name: "HellaSwag", direction: "higher_better"}
    - {name: "CoT-MMLU", direction: "higher_better"}
  datasets:
    - {name: "C4", size: "164M-328M tokens for finetuning, validation split for loss"}
    - {name: "MMLU", size: "57 subjects, 5-shot"}
    - {name: "BoolQ", size: "0-shot"}
    - {name: "GSM8K", size: "grade school math reasoning"}
    - {name: "HellaSwag", size: "common-sense reasoning"}
  models_tested:
    - {name: "Llama-2-7B", layers: 32}
    - {name: "Llama-2-13B", layers: 40}
    - {name: "Llama-2-70B", layers: 80}
    - {name: "Qwen-7B", layers: 32}
    - {name: "Qwen-14B", layers: 40}
    - {name: "Mistral-7B", layers: 32}
    - {name: "Phi-2 (2.7B)", layers: 32}
  ablation_dimensions:
    - "fraction of layers removed (0% to 80%+)"
    - "pruning strategy (similarity-informed vs. simple deepest-layers heuristic)"
    - "healing (with vs. without QLoRA finetuning)"
    - "task type (QA vs. reasoning vs. next-token prediction)"
    - "model family and scale (7B to 70B)"
  training_recipe:
    optimizer: "QLoRA (4-bit quantization)"
    lr: "3e-4 to 3e-6 (model-dependent)"
    hardware: "single 40GB A100 GPU"
    finetuning_tokens: "164M-328M tokens from C4"
    lora_rank: "2 to 64 (model-dependent)"
    max_seq_len: "2048-4096"
  method_family: "layer pruning / model compression / depth reduction"

positioning:
  core_claim: "Large LLMs exhibit massive redundancy in their deeper layers: up to ~50% of layers can be removed from Llama-2-70B with minimal QA degradation after lightweight QLoRA healing, revealing a sharp phase transition in accuracy and a decoupling between perplexity and downstream task performance."
  key_results: "Llama-2-70B: robust until ~45-50% layer removal; Mistral-7B: ~35% threshold; Qwen models: ~20% threshold. Sharp transition to random guessing beyond critical depth. Reasoning tasks (GSM8K, HellaSwag) degrade immediately with any pruning, while QA tasks (MMLU, BoolQ) remain robust. Healing eliminates phase transition in perplexity but not in QA accuracy."
  limitations:
    - "QA benchmarks show robustness but reasoning tasks (GSM8K, HellaSwag) degrade immediately with any pruning, limiting practical applicability"
    - "Perplexity-accuracy decoupling is unexplained: healing removes phase transition in loss but not in accuracy"
    - "Only evaluated on open-weight models of specific families; generalization to other architectures unclear"
    - "No explanation for why Qwen family has much lower pruning tolerance (~20%) than Llama-2 family (~50%)"
    - "Simple pruning heuristic achieves comparable results to similarity-informed approach after healing, questioning the value of the similarity analysis"
  relation_to_us: "foundation"
  # Foundational evidence that deeper layers in LLMs are redundant/underutilized.
  # Directly motivates turn-residual gating: if deeper layers contribute little,
  # learning to gate/modulate residual connections could better utilize them or
  # gracefully skip them. The phase transition finding and task-dependent
  # vulnerability pattern are key insights for our gating mechanism design.

narrative:
  story_type: "突破局限型"
  hook: "Title itself is the hook — a play on Wigner's 'Unreasonable Effectiveness of Mathematics', immediately signals a surprising negative result about deep layers. Opening frames the question as fundamental: where is knowledge stored in LLM weights?"
  tension: "LLMs use billions of parameters across many layers, but are all layers equally important? Current pretraining may not properly leverage deeper layers. The tension between parameter count (resource cost) and actual utility drives the investigation."
  key_insight: "Revealed through Figure 1d and Section 4: the existence of a sharp phase transition — performance remains flat until a critical pruning fraction, then collapses to random guessing. This is further enriched by the perplexity-accuracy decoupling (healing fixes loss but not accuracy transitions) and task-dependent vulnerability (QA robust, reasoning fragile)."
  argument_chain: "Residual network intuition (layers as small perturbations) → similarity analysis shows deeper layers are more similar → pruning deeper layers preserves performance → sharp phase transition in accuracy → QLoRA healing smooths perplexity but not accuracy → reasoning tasks degrade immediately → deeper layers serve reasoning, not knowledge storage"
  contribution_framing: "Three hypotheses tested rather than contributions claimed: (1) layer pruning is feasible in residual networks, (2) deeper layers are more prunable, (3) pruned layers show minimal output change. Framed as empirical investigation with open questions rather than solved problem."
  intro_structure: "9 paragraphs: P1=framing question (where is knowledge stored?) + method overview; P2=surprising main result (half layers removable); P3=practical note (single GPU feasibility); P4=main result detail; P5=theoretical intuition (residual architecture); P6=simpler heuristic finding; P7=perplexity vs accuracy decoupling; P8=reasoning task vulnerability; P9=paper structure outline"
  notable_technique: "The provocative title borrowed from Wigner creates immediate intrigue. The paper frames findings as open questions rather than solutions — the discussion section poses 7+ future work questions, positioning the paper as a landscape-revealing study rather than a method paper. This 'we found something surprising and don't fully understand it' framing is powerful for empirical papers."

figures:
  figure_count: 6  # main paper; 2 additional in appendix (total 8)
  figure1:
    type: "method_overview"
    description: "Four-panel figure: (a) algorithm flowchart for similarity-informed pruning, (b) schematic of n-layer removal from transformer stack, (c) angular distance heatmap across layer pairs for Llama-2-70B showing optimal pruning blocks traced by black line, (d) performance curves showing MMLU/BoolQ accuracy and C4 loss vs pruning fraction with sharp transitions"
    narrative_role: "Serves triple duty: explains method, provides theoretical grounding via similarity heatmap, and previews the main result (sharp transition). Eliminates need for separate method and teaser-result figures."
    design_elements: ["4-panel composite layout", "flowchart + schematic + heatmap + line plot", "angular distance heatmap with optimal path overlay", "healed vs unhealed curves distinguished"]
    visual_style: "Dense composite figure packing algorithm, architecture schematic, similarity analysis, and key result into one figure. Heatmap uses warm-cool colormap. Performance curves show both accuracy (left y-axis) and loss (right y-axis) against pruning fraction."
  result_figures:
    - figure_id: "Figure 2"
      viz_type: "line_plot"
      what_compared: "MMLU accuracy vs fraction of layers removed across 7 models (Llama-2 7B/13B/70B, Qwen 7B/14B, Mistral 7B, Phi-2), healed vs unhealed"
      how_gain_highlighted: "Flat region before sharp cliff makes robustness visually obvious; different model families on separate subplots allow cross-family comparison of pruning tolerance"
      design_note: "Three subplots (Llama-2 family, Qwen family, Mistral+Phi-2) group by architecture family. Unhealed=dashed, healed=solid lines. X-axis is fraction rather than absolute layer count for cross-model comparability."
    - figure_id: "Figure 3"
      viz_type: "line_plot"
      what_compared: "Normalized C4 validation loss vs pruning fraction, healed vs unhealed, across all model families"
      how_gain_highlighted: "Key insight: unhealed loss shows sharp transition matching accuracy cliff, but healed loss shows continuous smooth degradation — no phase transition. This visual contrast is the paper's most striking finding."
      design_note: "Same subplot grouping as Figure 2 for visual consistency. Y-axis is normalized loss (ratio to unpruned) for cross-model comparability."
    - figure_id: "Figure 7"
      viz_type: "line_plot"
      what_compared: "BoolQ accuracy vs pruning fraction across model families, complementing MMLU results"
      how_gain_highlighted: "Shows same flat-then-cliff pattern as MMLU, confirming generality across QA benchmarks"
      design_note: "Appendix figure, same visual format as Figure 2 for consistency"
  ablation_figures:
    - figure_id: "Figure 4"
      viz_type: "heatmap"
      dimensions_varied: ["layer index (ell)", "block size (n)"]
      design_note: "Angular distance heatmaps for ALL 7 models side by side, with row normalization. Reveals structural differences: Llama-2 family has concentrated high-similarity in deep layers, Qwen has unusual 'islands' in shallow layers correlating with lower pruning tolerance. This is the analytical backbone explaining why different models have different pruning thresholds."
    - figure_id: "Figure 5"
      viz_type: "line_plot"
      dimensions_varied: ["pruning strategy (similarity-informed vs simple)", "healing (with vs without)"]
      design_note: "Three subplots (MMLU, BoolQ, C4 loss) for Llama-2-70B. Shows that after healing, both strategies converge to similar performance, supporting the simpler heuristic. Before healing, similarity-informed is clearly better."
    - figure_id: "Figure 6"
      viz_type: "line_plot"
      dimensions_varied: ["task type (CoT-MMLU, GSM8K, HellaSwag)"]
      design_note: "Critical ablation showing task-dependent vulnerability. GSM8K and HellaSwag lines drop immediately, while CoT-MMLU follows the flat-then-cliff QA pattern. Disproves hypothesis 2 (deeper layers needed for long generation) and supports hypothesis 1 (deeper layers needed for reasoning)."
  figure_narrative_role: "Figure 1 (method + teaser) → Figure 2 (main QA result across models) → Figure 3 (perplexity decoupling revelation) → Figure 4 (similarity analysis explaining cross-model differences) → Figure 5 (simple vs informed pruning ablation) → Figure 6 (task-type vulnerability, deepens understanding). Flow: overview → main finding → surprising twist → mechanistic explanation → practical simplification → nuanced understanding."

tables:
  table_count: 1  # only 1 formal table (in appendix); main results presented as figures
  main_result_table:
    table_id: "Table 1 (Appendix B.1)"
    row_axis: "models"
    col_axis: "architecture and training hyperparameters"
    row_organization: "by_model_family"
    col_organization: "flat"
    highlight_strategy: "none (informational table, not comparison)"
    statistical_reporting: "single values (no variance reported)"
    num_baselines: 7  # 7 models listed
    design_note: "This paper is unusual in presenting ALL main results as line plots and heatmaps rather than tables. The only table is a hyperparameter reference in the appendix. This works because the key finding is about trends (flat-then-cliff pattern) rather than point comparisons, and line plots convey this better than tables."
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "Model architecture details (layers, vocab size, sequence length) and QLoRA finetuning hyperparameters (tokens, learning rate, LoRA rank)"
    reason: "Main results are all visual (phase transitions, heatmaps, trend lines). Tables would be inferior for showing the continuous trends that are this paper's key contribution. Hyperparameter details relegated to appendix as reference material."

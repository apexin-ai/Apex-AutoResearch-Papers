paper_key: "qiu2025gated"
title: "Gated Attention for Large Language Models: Non-linearity, Sparsity, and Attention-Sink-Free"
venue: "NeurIPS 2025 (Oral)"
full_text_available: true

research:
  baselines:
    - "Vanilla MoE 15A2B (q=32, kv=4)"
    - "Expanded KV heads (k=8)"
    - "Expanded query heads (q=48)"
    - "Add 4 Experts"
    - "Sandwich Norm (Ding et al., 2021)"
    - "Switch Heads (Csordas et al., 2024)"
    - "Forgetting Transformer (Lin et al., 2025)"
    - "Quantizable Transformers (Bondarenko et al., 2023)"
    - "NSA (Yuan et al., 2025)"
  metrics:
    - {name: "Avg PPL (held-out test sets)", direction: "lower_better"}
    - {name: "Hellaswag (few-shot)", direction: "higher_better"}
    - {name: "MMLU (few-shot)", direction: "higher_better"}
    - {name: "GSM8k (few-shot)", direction: "higher_better"}
    - {name: "HumanEval", direction: "higher_better"}
    - {name: "C-eval", direction: "higher_better"}
    - {name: "CMMLU", direction: "higher_better"}
    - {name: "RULER (long-context)", direction: "higher_better"}
    - {name: "F-Attn (attention to first token)", direction: "lower_better"}
    - {name: "M-Act (max hidden state activation)", direction: "lower_better"}
  datasets:
    - {name: "3.5T high-quality tokens (multilingual, math, general knowledge)", size: "3.5T tokens"}
    - {name: "Held-out PPL test sets (English, Chinese, Code, Math, Law, Literature)", size: "diverse domains"}
    - {name: "RULER benchmark (long-context eval)", size: "4k-128k sequence lengths"}
  ablation_dimensions:
    - "Gating position (G1=SDPA output, G2=value, G3=key, G4=query, G5=dense output)"
    - "Gating granularity (elementwise vs headwise)"
    - "Head specificity (head-specific vs head-shared)"
    - "Gating mode (multiplicative vs additive)"
    - "Activation function (sigmoid vs SiLU vs NS-sigmoid vs Identity vs RMSNorm)"
    - "Model scale (1.7B dense vs 15B MoE)"
    - "Training tokens (400B vs 1T vs 3.5T)"
    - "Learning rate (4e-3 vs 4.5e-3 vs 5.3e-3 vs 8e-3)"
    - "Batch size (1024 vs 2048 vs 4096)"
    - "Model depth (28 layers vs 48 layers)"
    - "Input dependence (query-dependent vs input-independent gating)"
    - "Context length extension (32k base → 128k via YaRN)"
  training_recipe:
    optimizer: "AdamW (default hyperparameters)"
    lr: "warmup to max LR in 1k steps, cosine decay to 3e-5; max LR varies: 2e-3 (MoE), 4e-3 to 8e-3 (dense)"
    batch_size: "global bsz 1024/2048/4096 depending on setting"
    hardware: "not specified explicitly; BF16 training mentioned"
    context_length: "4096 (base training), 32k (extension), 128k (YaRN extrapolation)"
    total_steps: "100k steps for 400B token runs"
    architecture_details: "MoE: 128 total experts, top-8 softmax gating, fine-grained experts, global-batch LBL, z-loss; Dense: 1.7B params; Both use GQA"
    rope_base: "10k default, 1M for context extension"
    gating_overhead: "wall-time latency <2%; parameter overhead <201M for elementwise, <1.6M for headwise"
  method_family: "gated attention / attention mechanism modification"

positioning:
  core_claim: "Applying a head-specific sigmoid gate after SDPA introduces non-linearity (breaking W_V W_O low-rank bottleneck) and query-dependent sparsity, which together eliminate attention sinks, improve training stability, and enhance long-context extrapolation — validated at scale on 30 variants across 15B MoE and 1.7B dense models trained on 3.5T tokens."
  key_results: "MoE 15A2B: PPL 6.026→5.761 (-0.265), MMLU 58.79→60.82 (+2.03); Dense 1.7B@3.5T: PPL 6.180→6.130, HumanEval 34.15→37.80 (+3.65); Attention sink: 46.7%→4.8% first-token attention; Massive activations: M-Act 1053→94; RULER 128k: baseline 31.65 vs gated 58.82 (+27.17); Gating enables 2x LR (8e-3 vs 4e-3 baseline diverges); <2% wall-time overhead."
  limitations:
    - "Broader implications of non-linearity on attention dynamics and training process remain under-explored"
    - "No rigorous theoretical explanation for how attention sinks influence length generalization"
    - "Analysis limited to 1.7B dense and 15B MoE scales; larger scale validation not shown"
    - "Context extension evaluation only uses YaRN; other extension methods not tested"
  relation_to_us: "competitor"

narrative:
  story_type: "化繁为简型"
  hook: "Gating is everywhere (LSTMs, SSMs, linear attention, softmax attention) but nobody has systematically studied WHY it works — existing works confound gating benefits with other architectural innovations (Switch Heads routing, NSA sparse attention)."
  tension: "Despite widespread adoption, the precise mechanisms behind gating's effectiveness are unknown. Switch Heads claims routing helps, but reducing to 1 expert (pure gating) still gets most gains. NSA claims sparse attention helps, but doesn't disentangle gating contribution. We cannot design better architectures without understanding what gating actually does."
  key_insight: "Two-factor decomposition revealed in Section 4: (1) Non-linearity — gating at G1/G2 breaks the W_V·W_O low-rank bottleneck by inserting non-linearity between two consecutive linear layers (Eq. 6→8), which is why G5 position doesn't help; (2) Sparsity — sigmoid gating scores are naturally sparse (mean 0.116), applying query-dependent filtering that eliminates attention sinks (46.7%→4.8%) and massive activations (1053→94), explaining training stability."
  argument_chain: "Gating widely used but poorly understood → Systematic comparison of 30 variants at scale (15B MoE, 1.7B dense, 3.5T tokens) → SDPA output gating (G1) consistently best → Why? → (1) Non-linearity breaks low-rank W_V W_O bottleneck → (2) Query-dependent sparse gating filters irrelevant context → Consequence: eliminates attention sinks → Practical benefit: training stability + long-context extrapolation"
  contribution_framing: "Three contributions framed as findings: (1) empirical finding that G1 sigmoid gating is optimal among 30 variants, (2) mechanistic explanation via non-linearity + sparsity decomposition, (3) practical consequences — attention-sink elimination, training stability, length extrapolation. Release of first 'attention-sink-free' models."
  intro_structure: "5 paragraphs: P1=gating history and gap (no systematic study); P2=disentangling gating from confounds (Switch Heads, NSA examples); P3=experimental setup and main finding (G1 best, stability); P4=analysis: non-linearity + sparsity + attention sink elimination + length generalization; P5=summary of contributions."
  notable_technique: "The 'disentangling confounds' argument in P2 is rhetorically powerful: they show Switch Heads with 1 expert (= pure gating) still works, proving gating itself — not routing — drives gains. This reframing of competitors as evidence for their own thesis is sophisticated. Also, the non-linearity argument via Eq. 6 (merging W_V W_O into one low-rank map) is an elegant theoretical framing that makes a simple modification feel principled."

figures:
  figure_count: 7
  figure1:
    type: "method_overview + teaser_result"
    description: "Three-panel figure. Left: diagram showing 5 gating positions (G1-G5) in attention layer. Middle: performance comparison (PPL and MMLU) of 15B MoE models with gating at various positions — G1 clearly best. Right: training loss curves comparing baseline vs SDPA-gated 1.7B dense models over 3.5T tokens, showing gating eliminates loss spikes."
    narrative_role: "Triple duty: introduces the method space (positions), shows main finding (G1 best), and demonstrates stability benefit (no loss spikes). Establishes the paper's three claims in one figure."
    design_elements: ["three-panel layout", "position diagram with labeled G1-G5", "dual y-axis (PPL + MMLU) bar chart", "smoothed loss curves with spike annotations", "color coding across panels"]
    visual_style: "Clean three-panel horizontal layout. Left panel is architectural diagram with color-coded gate positions. Middle uses grouped bars with clear position labels. Right shows overlaid loss curves with smoothing (0.9 coeff), baseline spikes visually prominent against smooth gated curve."
  result_figures:
    - figure_id: "Figure 1 (Middle)"
      viz_type: "grouped_bar"
      what_compared: "Gating positions G1-G5 on PPL and MMLU metrics"
      how_gain_highlighted: "G1 bar is visually tallest/lowest, clear separation from other positions"
      design_note: "Dual metric (PPL lower-better + MMLU higher-better) in one panel efficiently communicates that G1 wins on both."
    - figure_id: "Figure 1 (Right)"
      viz_type: "line_plot"
      what_compared: "Training loss over 3.5T tokens: baseline vs SDPA-gated"
      how_gain_highlighted: "Loss spikes in baseline are visually prominent; gated curve is smooth and lower"
      design_note: "Smoothed curves (0.9 coeff) make spikes in baseline stand out while gated line is clean — visually compelling stability argument."
    - figure_id: "Figure 2"
      viz_type: "heatmap + bar_chart"
      what_compared: "Attention score distribution: baseline vs gated model. Left: proportion of attention to first token per layer. Right: attention maps for specific heads."
      how_gain_highlighted: "Quantitative numbers (46.7% → 4.8%) in caption; heatmap shows dramatic color difference between baseline and gated attention maps."
      design_note: "Before/after comparison with attention heatmaps is visually striking. Layer 21 example (83% → 4%) chosen for maximum visual contrast."
  ablation_figures:
    - figure_id: "Figure 3"
      viz_type: "histogram/distribution"
      dimensions_varied: ["gating position (SDPA vs value vs head-shared)", "gating score distribution"]
      design_note: "Three-panel distribution plot showing gating score means and spread. SDPA elementwise has strongest concentration near 0, visually demonstrating the sparsity argument."
    - figure_id: "Figure 4"
      viz_type: "line_plot"
      dimensions_varied: ["mean absolute values before/after gating per layer"]
      design_note: "Shows post-gating values match baseline, supporting the argument that gating serves similar function as attention sinks in filtering."
    - figure_id: "Figure 5"
      viz_type: "line_plot"
      dimensions_varied: ["proportion below threshold (1e-2 and 1e-3) per layer", "with vs without gating", "average score multiplication baseline"]
      design_note: "Two-panel threshold analysis. Includes clever control: multiplying by average score (removing input-dependence) shows less sparsity, proving input-dependent gating matters."
    - figure_id: "Figure 6"
      viz_type: "multi-row heatmap comparison"
      dimensions_varied: ["gating configuration (baseline, SDPA gate, value gate, cross-head share, NS-sigmoid)", "massive activations vs attention sink per layer"]
      design_note: "Five-row comparison showing massive activations and attention sinks across layers for each configuration. Visually proves that SDPA gating is the only configuration eliminating both phenomena."
    - figure_id: "Figure 7"
      viz_type: "distribution_plot"
      dimensions_varied: ["gating score distributions under different constraints (head-shared vs element/headwise, NS-sigmoid vs sigmoid)"]
      design_note: "Supplementary distribution analysis reinforcing the sparsity argument."
  figure_narrative_role: "Figure 1 (method + main result + stability) → Figure 2 (attention sink elimination) → Figure 3 (gating score sparsity mechanism) → Figures 4-5 (deeper sparsity analysis) → Figures 6-7 (appendix: layerwise analysis). Flow: what works → what it does to attention → why (sparsity mechanism) → detailed evidence."

tables:
  table_count: 6
  main_result_table:
    table_id: "Table 1"
    row_axis: "methods (30 gating variants grouped by category)"
    col_axis: "Act Func, Score Shape, Added Param, Avg PPL, Hellaswag, MMLU, GSM8k, C-eval"
    row_organization: "by_category"
    col_organization: "flat"
    highlight_strategy: "bold_best within each section; no underline_second"
    statistical_reporting: "single run, no error bars"
    num_baselines: 4
    design_note: "Organized into 5 sections (Reference Baselines, Position Variants, Granularity, Head-Specific/Shared, Multiplicative/Additive, Activation) with horizontal dividers. Each variant numbered (1)-(15) for easy cross-referencing in text. Includes 'Score Shape' and 'Added Param' columns to show parameter efficiency — key for fair comparison argument. Reference baselines include parameter-expanding alternatives (more KV heads, more query heads, more experts) to show gating wins with fewer params."
  ablation_tables:
    - table_id: "Table 2"
      what_varied: ["learning rate", "batch size", "model depth (28 vs 48 layers)", "training tokens (400B vs 1T vs 3.5T)", "gating type (elementwise vs headwise)", "sandwich norm baseline"]
      variation_style: "full_numbers"
      design_note: "Organized into 4 sections by (depth × tokens × bsz) configuration. '-' for diverged runs is visually powerful — shows baseline fails at high LR while gated models thrive. Includes sandwich norm as stabilization baseline to show gating is superior."
    - table_id: "Table 3"
      what_varied: ["non-linearity type: sigmoid gate, SiLU gate, additive gate, RMSNorm, SiLU-only, identity additive"]
      variation_style: "full_numbers"
      design_note: "Designed to test the non-linearity hypothesis. Rows ordered to tell the story: sigmoid gate (best) → value gate → additive SiLU → RMSNorm → SiLU only → identity (worst). Demonstrates that non-linearity is necessary but not sufficient; sparsity from sigmoid matters too."
    - table_id: "Table 4"
      what_varied: ["gating configuration with sparsity metrics: gate score mean, M-Act, F-Attn alongside performance"]
      variation_style: "full_numbers"
      design_note: "Key analysis table linking mechanism (sparsity) to behavior (attention sink) to performance. Three mechanism columns (Gate Score, M-Act, F-Attn) alongside PPL/benchmarks. NS-sigmoid ablation is the smoking gun: removing sparsity while keeping non-linearity degrades performance."
    - table_id: "Table 5"
      what_varied: ["sequence length (4k to 128k)", "YaRN extension", "baseline vs SDPA-gate"]
      variation_style: "full_numbers"
      design_note: "Compact 2-row × 6-column design. Parenthetical (negative numbers) show degradation after extension — visually communicates that gated model degrades much less. Two sections: original training length + YaRN extended."
    - table_id: "Table 6"
      what_varied: ["Switch Head configurations: kv vs v experts, different top-k, comparison to pure gating"]
      variation_style: "full_numbers"
      design_note: "Appendix table that reinterprets Switch Heads results. Key row: 'Switch v, 1top1' = value headwise gate, showing pure gating matches or beats complex routing. Rhetorically dismantles Switch Heads' routing claim."
  supplementary_tables:
    in_appendix: true
    content: "Table 6 (Switch Head baselines decomposition), plus detailed layerwise analysis figures (Figs 4-7). No additional numbered appendix tables beyond Table 6."
    reason: "Main Tables 1-5 are already comprehensive (30 variants + dense scaling + non-linearity analysis + sparsity analysis + length extension). Appendix focuses on visual analysis (Figures 4-7) rather than additional tables, which is appropriate given the mechanistic nature of the analysis."

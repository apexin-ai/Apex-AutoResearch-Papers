- name: Held-out evaluation (50 unseen UltraChat conversations)
  plan_id: plan_008
  description: '从 UltraChat 全集 idx≥8000 抽取 50 段对话（训练集 idx<8000）， 重跑四路 eval (Base/TG/UG/LoRA-only)
    的 GAR-Dongre + GAR-ours + PPL。 目的：排除 eval 数据与训练数据重叠的 confound，确认 negative finding
    在 unseen data 上成立。

    '
  expected_results:
    heldout_base_dongre_mid_gar: 0.004
    heldout_tg_dongre_mid_gar: 0.015
    heldout_ug_dongre_mid_gar: 0.012
    heldout_lora_dongre_mid_gar: 0.014
    heldout_tg_ours_mid_gar: 0.013
    heldout_dongre_gap_ratio: 32
    heldout_tg_minus_lora_dongre_gar: 0.001
    heldout_tg_ppl: 2.71
    heldout_ug_ppl: 2.69
    heldout_lora_ppl: 2.7
    heldout_base_ppl: 4.35
    heldout_gar_decay_turn1_to_mid: 0.72
    heldout_num_conversations: 50
    heldout_num_turns_per_conv: 10
  result_rationale: 'Held-out eval 预期与 standard eval 高度一致，原因：(1) 训练数据是 UltraChat 的前
    8000 段， 而 eval 此前用的 standard_conversations 是由 base model 生成的 5 段固定对话， 本身已与训练数据不同——所以
    held-out 不是修正 data leakage（没有 leakage）， 而是增加 eval 的统计功效（5→50 段）和消除 "eval 数据太少/太特殊"
    的 reviewer 质疑。 (2) distribution shift 是 teacher-forcing→autoregressive 的结构性问题，
    与 eval 数据的具体内容无关——任何多轮对话在推理时都会面临相同的 distribution mismatch。 (3) TG 和 LoRA-only
    的 Dongre GAR 差异预期在 ±0.003 以内（实际 0.001）， 因为 gate 在推理时是 near-identity（mean 0.93-0.98），不产生有意义的功能差异。
    PPL 略高于 standard eval（2.71 vs 2.63）是因为 unseen conversations 的 topic 分布 可能略偏离训练分布，但差异很小。gap
    ratio 32x（相比 standard eval 的 30x） 在统计波动范围内，进一步确认 training-inference gap 的稳健性。


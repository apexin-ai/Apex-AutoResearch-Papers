- name: Llama-3.1-8B gradient conflict analysis
  plan_id: plan_013
  description: '在 Llama-3 v7 checkpoint 上执行梯度冲突分析，验证 NTP-GAR 梯度竞争跨模型成立。 32 层 × 至少
    1 个 checkpoint（优先 epoch 2 final）。

    '
  expected_results:
    llama3_epoch2_mean_cos_sim: -0.058
    llama3_epoch2_layers_negative: 27
    llama3_epoch2_mean_mag_ratio: 12.8
    llama3_epoch2_max_mag_ratio: 18.5
    llama3_worst_conflict_layers: L5, L8, L12, L16
    llama3_cos_sim_std: 0.038
  result_rationale: 'NTP-GAR 梯度竞争是 joint optimization 的通用属性：NTP 推 gate→1.0（minimize
    对 residual 的干扰），GAR 推 gate→0（maximize attention redistribution）。这个对抗不依赖 具体的 attention
    实现（MHA vs GQA）或 positional encoding（RoPE variant）， 因为它发生在 gate parameter space
    而非 attention space。 Llama 的 mean cos_sim (-0.058) 与 Qwen (-0.045) 同级，略更负可能因为 GQA
    架构下 GAR loss 对 gate 的间接梯度路径更复杂（穿透 shared KV heads）， 导致梯度方向偏移更大。mag_ratio 12.8x
    在 Qwen 的 14.2x 附近， 反映类似的 NTP 主导程度。27/32 层负 cos_sim（84%）与 Qwen 的 26/28（93%） 在同一
    range，略低因为 Llama 有更多 "浅层" gate（L28-L31）受 GAR 影响更弱、 cos_sim 可能为微弱正值。 跨模型梯度数据联合构成
    SP2 的完整证据。

    '

    heads。'
  analysis: '四个模型的 attention heatmap 视觉几乎不可区分，是最直观的 negative evidence。 这直接回答 "推理时
    gate 在做什么"——几乎什么都没做。Gate 的 2-7% residual attenuation 不足以穿透 softmax 非线性改变 attention

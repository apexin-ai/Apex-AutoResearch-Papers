    ## 10. Key Risks for Submission


    | Risk | Severity | Mitigation Path |

    |------|----------|----------------|

    | "Unsurprising" novelty objection | High | Strengthen failure taxonomy with differential
    diagnostics; deeper mechanistic analysis |

    | SS model-specificity (Llama failure) | High | Needs mechanistic explanation
    or removal from contributions |

    | GAR metric specificity (Table 8) | High | Stronger downstream validation; alternative
    metric development |

    | SS seed sensitivity (CV=14.7%) | Medium | More seeds or acknowledge as limitation
    prominently |

    | SS length decay (fails >10 turns) | Medium | Reframe scope; honest limitation
    discussion (already done) |

    | NF1-NF3 redundancy | Medium | Restructure as single mechanism with multiple
    observable consequences |



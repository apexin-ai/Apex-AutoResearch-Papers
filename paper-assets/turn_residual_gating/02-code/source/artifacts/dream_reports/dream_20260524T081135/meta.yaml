      ar_gar_invariant_to_lambda: true
      ar_gar_range_across_lambda:
      - 0.013
      - 0.018
      baseline_ar_gar: 0.012
    result_rationale: λ_GAR=10 使 GAR 梯度幅度在训练初期实际超过 NTP（epoch 0 mag_ratio 降到 0.75×，
      即 GAR gradient 1.33× > NTP），gate 获得充足梯度学习 GAR-optimal 配置（gate_mean 降到 0.905，比
      v7 的 0.934 有更大调制幅度）。TF GAR 确实提升到 0.52（vs v7 0.50）， 证明更高 λ 推动了更强的 gold-distribution
      GAR 优化。但 AR GAR 仍停在 0.018—— 仅比 baseline 0.012 高 0.006，在 baseline 噪声范围内。Gap 28.9×
      与 v7 的 31.3× 基本相当（差异来自 TF GAR 分子变化，非 AR GAR 分母改善）。PPL 轻微恶化（2.95 vs 2.78）反映 GAR
      梯度竞争了 NTP 的优化预算。λ=0.1 时 GAR 训练不充分（TF 0.28）， gate 近乎 identity（0.975），但 AR GAR（0.013）同样停在
      baseline 水平。三个 λ 值跨 100× 范围，AR GAR 始终在 [0.013, 0.018] 窄带内——此窄带恰好覆盖 base model
      的自然 GAR（0.012），说明 exposure bias 完全抵消了训练获得的 attention steering 能力。这是最直接的 W2 消除证据：即使让
      GAR gradient 幅度主导训练（λ=10, mag_ratio<1），推理时的 distribution shift 仍然摧毁所有训练收益。

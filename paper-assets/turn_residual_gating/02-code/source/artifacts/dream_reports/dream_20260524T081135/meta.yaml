  - name: λ_GAR Sensitivity Ablation (λ=0.1 and λ=10)
    plan_id: plan_022
    description: Train v7 with λ_GAR=10 and λ_GAR=0.1 (1 epoch each). Test whether
      GAR loss weight affects the exposure bias gap. Directly addresses W2 (hyperparameter
      tuning).

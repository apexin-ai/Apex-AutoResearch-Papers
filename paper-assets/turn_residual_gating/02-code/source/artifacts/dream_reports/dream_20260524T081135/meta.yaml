    # Dream Review Report


    **Paper:** Exposure Bias Selectively Destroys Auxiliary Attention Losses in Multi-Turn
    Dialogue

    **Venue:** EMNLP 2026 (ARR)

    **Review Mode:** Simple (1 Reviewer, full coverage)


    ---


    ## Overall Assessment: 3.0 (Findings)


    ---


    ## Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 |

    | Excitement | 2.5 |

    | Reproducibility | 4.0 |

    | Overall Assessment | 3.0 |


    ---


    ## Summary


    The paper investigates why auxiliary attention losses (specifically Goal Accessibility
    Ratio, GAR) collapse under autoregressive (AR) generation despite succeeding under
    teacher-forced (TF) evaluation in multi-turn dialogue. The authors propose ThreadGate,
    a per-layer residual gating module trained jointly with NTP and GAR objectives.
    ThreadGate achieves GAR≈0.50 under TF but collapses to 0.064 (Qwen) / 0.018 (Llama)
    under AR, revealing an 8×–27× gap. Through systematic analysis—four-way ablation,
    PCGrad causal exclusion, gradient magnitude analysis, KL divergence, λ sensitivity—the
    paper identifies exposure bias (training–inference distribution shift) as the
    root cause, ruling out gradient direction conflict. Scheduled sampling (SS) partially
    mitigates the gap on Qwen (gap→1.3×, 4 seeds) but transfers weakly to Llama (gap=2.7×).


    ---


    ## Strengths


    **S1. Thorough diagnostic arc.** The paper''s strongest asset is the systematic,
    multi-pronged analysis of *why* auxiliary attention losses fail under AR generation.
    The evidence chain is well-constructed: (1) four-way ablation establishes that
    gating provides zero incremental benefit over LoRA-only, (2) PCGrad causally excludes
    gradient direction conflict, (3) gradient magnitude analysis quantifies NTP dominance
    (7.5–25.7×), (4) λ_GAR sensitivity confirms that even with balanced gradients
    the gap persists (22× at λ=10), and (5) KL divergence localizes the distribution
    shift to deep layers. Each piece reinforces the central thesis without redundancy.


    **S2. Mechanism specificity is a genuine insight.** Table 6 (GAR definition sensitivity)
    demonstrates that exposure bias *selectively* destroys summary-position attention
    (last-token: 32× gap, goal-only: 63×) while leaving distributed attention largely
    unaffected (all-token: 1.7×, first-token: 1.8×). This is not an obvious prediction
    and provides actionable understanding: the failure is specific to long-range attention
    routing that depends on context quality.


    **S3. Honest framing of negative and partial results.** The paper does not oversell.
    ThreadGate''s failure is presented transparently. SS cross-model limitations are
    stated clearly in both Results and Discussion. Contribution #5 is appropriately
    hedged ("initial evidence... requiring further investigation"). This scientific
    honesty is commendable.


    **S4. Solid statistical methodology.** 4-seed validation on Qwen SS with reported
    per-seed breakdown, N=200 TF evaluation with bootstrap CIs, effect size / std
    ratio of 9.7—these reflect careful attention to statistical rigor. The TG–LO difference
    CI including zero is a clean null result.


    **S5. Cross-model validation adds credibility.** Testing on both Qwen-2.5-7B and
    Llama-3.1-8B with qualitatively different gradient dynamics (Qwen: mild conflict
    with cos_sim≈-0.04; Llama: orthogonal with cos_sim≈+0.005) strengthens the generality
    of the diagnostic findings, even though SS transfer is partial.


    ---


    ## Weaknesses


    **W1. Limited novelty — known phenomenon in a predictable setting (Major).** Exposure
    bias is a well-established concept (Bengio et al. 2015; Ranzato et al. 2016).
    The paper''s core finding is that this known phenomenon also affects auxiliary
    attention losses in multi-turn dialogue. While the 8×–27× quantification is striking,
    the directional prediction (TF-trained attention patterns won''t transfer to AR
    contexts) is not surprising. The paper acknowledges positioning itself as "first
    empirical characterization" in this specific setting, but the conceptual novelty
    is limited. A reviewer could reasonably argue that any TF-only auxiliary loss
    should be expected to suffer from exposure bias.


    **W2. No effective solution — the paper is primarily diagnostic (Major).** ThreadGate
    itself is a negative result (zero gating benefit). The only mitigation (SS) is
    partial and model-dependent. The paper does not propose a method that advances
    the state of the art; it characterizes a failure mode. While diagnostic papers
    have value, the lack of an actionable solution limits the paper''s impact and
    practical contribution. The three future directions mentioned in Discussion (model-specific
    SS, decoupled goal-processing, GAR-aware decoding) are speculative.


    **W3. GAR as a proxy metric — no downstream task validation (Major).** The entire
    paper evaluates attention patterns (GAR) rather than downstream dialogue quality.
    Does improving GAR from 0.016 to 0.401 actually improve instruction following,
    coherence, or user satisfaction? The paper implicitly assumes GAR is a meaningful
    quality signal but never validates this assumption. Dongre et al. (2026) documented
    GAR drops across models, but the causal link between GAR improvement and dialogue
    quality improvement is not established. If GAR recovery via SS does not translate
    to measurable quality gains, the practical significance of the entire line of
    work is questionable.


    **W4. Limited scale and data diversity (Moderate).** Only two 7–8B models on a
    single training dataset (UltraChat). The generalization of the 8×–27× gap to larger
    models (70B+), different architectures (Mixture-of-Experts), or different training
    data is unknown. The Limitations section acknowledges this but the concern is
    substantive—exposure bias dynamics may differ substantially at scale where models
    have more capacity to absorb auxiliary objectives.


    **W5. Llama SS statistical power is weak (Moderate).** Llama SS uses only 1 seed
    with N=20 for AR evaluation. Given that Qwen SS shows seed variance of std=0.047
    at β=0, the Llama result of 0.18±0.09 could be quite unstable. The cross-model
    comparison—which is central to the "model-dependent" narrative—rests on statistically
    underpowered evidence. At minimum, 2–3 seeds on Llama would be needed to make
    the cross-model gap claim robust.


    **W6. Missing direct competitor comparison (Minor).** The paper does not compare
    against Li et al. (2024) or other recent work on attention steering in multi-turn
    dialogue. The Related Work covers the general landscape but does not position
    the results against the closest competitors'' approaches to solving the same problem.


    ---


    ## Questions for Authors


    1. Have you measured whether SS-improved GAR translates to measurable gains on
    any downstream task (e.g., MT-Bench multi-turn score, instruction following accuracy)?

    2. Why only 1 seed for Llama SS? The Qwen 4-seed results show meaningful seed
    variance—this same variance could significantly affect the Llama cross-model conclusions.

    3. The long conversation eval (Table 4) uses only N=15 conversations. Have you
    considered the statistical reliability of the trend you report?

    4. For the λ_GAR=10 experiment, did you also try training for 3 full epochs (vs.
    the 1 reported)? The result could differ with longer training.


    ---


    ## Minor Issues


    - Abstract is 168 words — within the 200-word limit. ✓

    - Limitations section present in main text. ✓

    - Paper appears to be 8 pages of main text + references + 2 pages appendix. Verify
    the 8-page main text limit is met (the main text appears to end at the bottom
    of page 8, which is borderline — ensure the Limitations section and page 9 content
    do not push main text over the limit).

    - Table 2 reports s789 TF GAR as "—" — clarify whether this seed''s TF GAR was
    not computed or is missing.

    - Some references use "et al." in the bib entries (Luo et al. 2025, Qiu et al.
    2025) — ensure full author lists for camera-ready.

    - The paper uses both "GAR-ours" and "GAR-D"/"GAR-Dongre" notation inconsistently
    — standardize.


    ---


    ## Experiment Coverage Assessment


    Comparing against the experiment design:


    | Experiment | Covered? | Notes |

    |-----------|----------|-------|

    | Llama Gradient Analysis (plan_013) | ✅ | Table 8 |

    | N=200 TF Eval (plan_020) | ✅ | Table 1 |

    | λ_GAR Sensitivity (plan_022) | ✅ | Table 9, Appendix A |

    | KL Divergence (plan_025) | ✅ | Tables 5, 6 |

    | Llama SS (plan_026) | ✅ | Tables 3, 10 |

    | 3-Seed + 4th Seed (plan_027/029) | ✅ | Table 2, Appendix B |

    | Alternative GAR Definitions (plan_028) | ✅ | Table 7 |

    | Long Conversation Eval (plan_030) | ✅ | Table 4 |


    All planned experiments are present. Coverage is comprehensive.


    ---


    ## Verdict


    The paper presents a thorough empirical characterization of how exposure bias
    destroys auxiliary attention losses in multi-turn dialogue. The diagnostic methodology
    is rigorous, with multiple converging analyses and appropriate statistical validation.
    However, the core finding (exposure bias affects TF-trained auxiliary losses)
    is conceptually expected, the proposed method (ThreadGate) is a negative result,
    and the mitigation (SS) is partial and model-dependent. The absence of downstream
    task validation (W3) is the most significant gap—without evidence that GAR recovery
    improves actual dialogue quality, the practical impact is uncertain.


    The paper is well-suited for **Findings** (score 3.0). It would need to address
    at least one of: (a) demonstrating downstream task impact of GAR recovery, (b)
    proposing an effective general solution, or (c) substantially expanding the model/data
    coverage, to reach main conference level (4.0).


    ---


    ## Confidence: 4 (High — familiar with exposure bias literature, multi-turn dialogue
    evaluation, and attention mechanism analysis)




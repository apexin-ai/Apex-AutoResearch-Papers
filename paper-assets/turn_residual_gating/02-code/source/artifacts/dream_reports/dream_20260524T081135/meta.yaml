    # Dream Review Report — "Why Auxiliary Attention Losses Fail Under Exposure Bias:
    A Multi-Model Diagnostic Study"


    **Dream ID:** 20260524T081135 | **Tier:** worst | **Mode:** simple (1 Reviewer)


    ---


    ## 1. Summary


    This paper investigates why auxiliary attention losses (GAR) optimized under teacher-forcing
    fail to transfer to autoregressive generation in multi-turn dialogue. The authors
    implement ThreadGate, a per-layer residual gating module trained jointly with
    NTP and a GAR auxiliary loss. ThreadGate achieves TF GAR=0.50 but collapses to
    AR GAR=0.064 on Qwen-2.5-7B (7.8× gap) and 0.018 on Llama-3.1-8B (27× gap). Through
    a five-way ablation (ThreadGate, UniformGate, LoRA-only, PCGrad, Base), λ sensitivity
    analysis, and cross-model replication, the paper identifies three failure modes
    (NF1: reverse turn conditioning, NF2: structural distribution shift, NF3: insufficient
    intervention strength) and attributes the root cause to exposure bias. Attempted
    scheduled sampling mitigation partially succeeds on Qwen (AR GAR=0.39±0.04, 3-seed)
    but completely fails on Llama (AR GAR=0.04, gap 11.75×).


    ---


    ## 2. Strengths


    - **Well-designed causal exclusion methodology.** The five-way comparison isolates
    factors systematically. PCGrad as a *diagnostic* tool (rather than optimizer)
    is creative — removing gradient direction conflicts without changing outcomes
    provides a clean modus tollens argument for ruling out gradient competition.


    - **Thorough experimental coverage.** The paper addresses most natural objections:
    gradient conflict (PCGrad §5.4), architecture dependence (Qwen MHA vs. Llama GQA,
    §5.6), λ sensitivity (Table 5), metric specificity (Table 8, §6.3), and conversation-length
    scaling (Table 12, §7.2). All imagined experiments from the design reference appear
    covered in the paper.


    - **Honest reporting of partial successes and failures.** The paper is admirably
    transparent about SS working on Qwen but failing on Llama, about seed sensitivity
    (CV=9.2% on 3-seed, 14.7% on 4-seed), and about SS decay beyond 10 turns. Including
    the damaging 4th seed (s789, AR GAR=0.300) is scientifically honest even though
    it weakens the SS story.


    - **Clear mechanistic argument.** The observation that base models show no TF-AR
    gap (TF≈AR≈0.01–0.02) while fine-tuned variants show 8–27× gaps directly establishes
    that the gap is introduced by auxiliary loss training rather than being inherent
    to autoregressive generation. This is well-presented.


    - **Convergent evidence framing.** Table 13 (5/6 intervention×model combinations
    fail) combined with Dongre et al.''s independent failure of goal re-injection
    provides a compelling argument for structural impossibility of lightweight training-time
    interventions.


    - **Good visual presentation.** 12 tables in main text + 5 in appendix provide
    comprehensive quantitative evidence. The paper is well-organized with clear section
    structure.


    ---


    ## 3. Weaknesses


    ### Critical / Major


    - **(Major) The central finding is arguably unsurprising.** The observation that
    teacher-forced auxiliary losses do not transfer to autoregressive generation is
    a direct prediction from the exposure bias literature (Bengio et al., 2015; Ranzato
    et al., 2016). The paper claims novelty in demonstrating this on *auxiliary attention
    objectives* in *multi-turn transformers*, but the conceptual gap from "exposure
    bias affects sequence generation" to "exposure bias affects auxiliary losses during
    sequence generation" is modest. The three failure modes (NF1–NF3) are better understood
    as three *descriptions* of the same phenomenon (NTP dominates, gates too weak,
    patterns don''t transfer) rather than three distinct mechanisms requiring separate
    remedies. The taxonomy does not provide differential diagnostic value — knowing
    which "failure mode" applies does not suggest different solutions.


    - **(Major) Scheduled sampling results are too fragile to constitute a contribution.**
    SS is the paper''s only positive result, but it is: (a) model-specific — works
    on Qwen, completely fails on Llama (AR GAR=0.04, gap 11.75×) with no mechanistic
    explanation for the divergence; (b) seed-sensitive — CV=14.7% on 4 seeds, with
    s789 (0.300) far below s456 (0.422); (c) length-limited — decays 47.6% at 15 turns,
    71.4% at 20 turns (Table 12), precisely the regime where multi-turn attention
    decay matters most per the paper''s own motivation (Dongre''s 50-turn scenarios);
    (d) at β≥3, SS actually *underperforms* ThreadGate without SS on Llama (−0.036
    at β=3, −0.047 at β=5, Table 11), suggesting SS interferes with the attention
    patterns that β-steering exploits. A mitigation that is model-specific, seed-sensitive,
    and length-limited is not a robust contribution.


    - **(Major) GAR metric validity concerns.** Table 8 (§6.3) reveals that improvement
    is overwhelmingly concentrated on last-token GAR (the definition optimized). All-token
    GAR (≈Dongre) shows only marginal SS improvement (0.062 vs 0.022 baseline, 2.8×),
    while first-token and goal-only definitions show no improvement beyond noise.
    This raises a position-specific overfitting concern: the training objective may
    teach the model to concentrate attention at the summary position under teacher-forcing
    without genuinely improving goal tracking. The entire diagnostic apparatus (the
    8–27× gap, NF1–NF3) is built on GAR_ours. The paper acknowledges this in Limitations
    but does not adequately address whether the measured gaps reflect genuine attention
    degradation or metric-specific artifacts.


    ### Moderate


    - **(Moderate) The failure mode taxonomy conflates symptoms with causes.** NF1
    (reverse turn conditioning) describes the symptom that gates approach 1.0 at late
    turns. NF2 (structural distribution shift) is exposure bias renamed. NF3 (insufficient
    intervention strength, 2–7%) is a direct consequence of NF1 (NTP gradient dominance
    pushes gates toward identity). These are not three independent failure modes but
    three facets of one mechanism: NTP gradients dominate, preventing gates from learning
    useful intervention patterns under teacher-forcing that would transfer to autoregressive
    generation.


    - **(Moderate) The "causal exclusion" framing overstates evidentiary strength.**
    PCGrad addresses gradient *direction* conflict but not *magnitude* imbalance (the
    paper acknowledges NTP magnitude dominance of 12–25×). Ruling out directional
    conflict is not the same as ruling out all gradient interaction effects. The worsening
    under PCGrad on Qwen (v9 GAR=0.0151 vs v7=0.0157 — essentially no change, not
    worsening) and the very different gradient geometry on Llama (near-orthogonal,
    cos_sim≈+0.005, neg layers 53.1% near random) mean the PCGrad argument has different
    implications on each model. The cross-model comparison does strengthen the exclusion
    but the causal language ("first empirical elimination") is stronger than warranted.


    - **(Moderate) Limited model scale and diversity.** Both models are 7–8B instruction-tuned
    from the same generation. No models above 8B or below 7B are tested in the full
    pipeline. The single-dataset limitation (UltraChat only) further constrains generalizability.
    For a paper making general claims about "auxiliary attention losses," testing
    on two model families from one dataset is thin.


    - **(Moderate) Attention KL analysis (§6.2) is underwhelming.** Mean KL=0.054
    nats is small. GAR-relevant heads show only 1.5× higher KL than non-relevant heads
    (0.072 vs 0.048). Gate-KL correlation is weak and non-significant (r=0.11, p=0.18).
    The paper honestly acknowledges these limitations, but the analysis provides weak
    supplementary evidence at best and potentially gives reviewers ammunition ("if
    KL is this small, maybe distribution shift isn''t the mechanism").


    ### Minor


    - **(Minor) Inconsistent evaluation protocols across models.** Qwen uses N=50
    AR eval; Llama uses N=20. SS is validated with 3-4 seeds on Qwen but only 1 seed
    on Llama. These asymmetries make cross-model comparison less rigorous than presented.


    - **(Minor) Including s789 is a double-edged sword.** While scientifically honest,
    the 4th seed (AR GAR=0.300, gap 1.67×) raises CV from 9.2% to 14.7% and pulls
    the 4-seed mean down to 0.367 from the 3-seed 0.390. This actively weakens the
    SS contribution. The paper could have been stronger with 3 seeds and s789 held
    for rebuttal.


    - **(Minor) No code availability statement.** Reproducibility would benefit from
    explicit commitment to release code and trained checkpoints.


    ---


    ## 4. Questions for Authors


    1. Can you provide a mechanistic explanation for why SS succeeds on Qwen but completely
    fails on Llama? Without this, the SS contribution appears accidental rather than
    principled. The speculative reasons listed (tokenizer difference, depth difference,
    lower base GAR) are post-hoc and untested.


    2. Table 8 shows GAR improvement is concentrated on last-token only. Does this
    mean the model learns to "cheat" by concentrating goal attention at the summary
    position under TF, without genuinely routing goal information? How would you distinguish
    position-specific overfitting from genuine goal-tracking improvement?


    3. Why is Llama SS evaluated with only one seed when Qwen results already demonstrated
    meaningful seed sensitivity (CV=9.2%)?


    4. The gate diversity loss L_div enforces minimum variance across gate values.
    What happens without it? If gates collapse to ~1.0 without diversity pressure,
    doesn''t this suggest gating is fighting against the model''s preferred computation?


    5. For the λ sensitivity analysis: at λ=10.0, PPL degrades 36.7% and training
    becomes unstable. Is this really showing "gap independence from loss weighting"
    or is it showing that aggressive λ destroys the model?


    6. The SS effectiveness decays ~48% per 5 turns after turn 10. Given that the
    paper''s motivation comes from Dongre''s 50-turn scenarios, how do you reconcile
    proposing a mitigation that fails precisely where it''s needed most?


    ---


    ## 5. Missing References / Related Work


    - **Attention forcing / attention supervision in distillation** (Jiao et al.,
    2020 TinyBERT; Wang et al., 2020). Attention supervision during distillation *does*
    transfer — discussing why would strengthen the exposure bias argument.

    - **Token-level exposure bias mitigation** beyond SS: Mixer (Goyal et al., 2017),
    DAgger-style methods (Ross et al., 2011). Why were these alternatives not tested?

    - **Li et al. (2024)** on auxiliary loss interference in multi-task LLM training
    — direct competitor that should be discussed.


    ---


    ## 6. Scores


    ### Soundness: 3 / 5

    The experimental design is careful and the five-way ablation is well-constructed.
    However: (a) the causal exclusion chain overstates what PCGrad can rule out (direction
    only, not magnitude); (b) the failure mode taxonomy conflates three descriptions
    of one phenomenon; (c) GAR metric specificity (Table 8) undermines confidence
    that the measured gaps reflect genuine attention degradation; (d) cross-model
    evaluation uses inconsistent protocols. The core observation (TF-AR gap is large)
    is well-established, but the causal attribution is more argument-by-elimination
    than positive demonstration.


    ### Excitement: 2 / 5

    The central finding — teacher-forced auxiliary losses don''t transfer under exposure
    bias — is predictable from first principles. The empirical demonstration is thorough
    but the conceptual advance is incremental. SS mitigation, which could elevate
    excitement, is undermined by model-specificity, seed sensitivity, and length-limited
    effectiveness. The failure mode taxonomy provides limited actionable insight.
    The paper will interest a narrow audience working on multi-turn attention optimization
    but lacks the broader impact expected for main conference.


    ### Reproducibility: 4 / 5

    Extensive implementation details: full hyperparameters, loss design evolution,
    training costs, dataset characteristics, statistical test details, per-layer gate
    profiles. Public models (Qwen-2.5-7B, Llama-3.1-8B) and dataset (UltraChat). Main
    gap: no code release commitment, and unexplained SS training time variance across
    seeds.


    ---


    ## 7. Overall Assessment: 2.5 (Borderline Findings)


    **Confidence: 4 / 5**


    ---


    ## 8. Justification


    The paper is a thorough empirical study with well-designed ablations, but the
    central finding (exposure bias prevents TF auxiliary losses from transferring
    to AR generation) is predictable and the failure mode taxonomy provides limited
    new insight beyond relabeling the known phenomenon. The scheduled sampling mitigation
    — the paper''s only positive result — is model-specific (works on Qwen, fails
    on Llama), seed-sensitive (CV=14.7% on 4 seeds), and degrades with conversation
    length (fails where it''s needed most). The GAR metric specificity issue (position-specific
    overfitting, Table 8) and weak downstream validation further weaken practical
    significance. Experimental execution is strong but conceptual contribution and
    mitigation robustness are insufficient for main conference. A revision incorporating
    principled explanation for model-specific SS behavior, broader model/scale testing,
    and stronger downstream validation could elevate to Findings level.


    ---


    ## 9. Experiment Coverage Assessment


    All 9 imagined experiments from the design reference are covered in the paper:

    1. ✅ Llama Gradient Conflict Analysis (Tables 3-4)

    2. ✅ Expanded Eval Set N=200 (Appendix A, Tables 14-15)

    3. ✅ λ_GAR Sensitivity (Table 5, Appendix B)

    4. ✅ TF vs AR Attention KL Divergence (Tables 6-7, §6.2)

    5. ✅ Llama SS (Tables 10-11, §7.1)

    6. ✅ SS 3-Seed Validation (Table 9, §7.1)

    7. ✅ Alternative GAR Definitions (Table 8, §6.3)

    8. ✅ SS 4th Seed s789 (Table 9, §7.1)

    9. ✅ Long Conversation Eval (Table 12, §7.2)


    Coverage is complete. The paper includes all planned experiments, including the
    risky s789 4th seed data that weakens the SS story.



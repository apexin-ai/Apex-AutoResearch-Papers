  - name: TF vs AR Per-Head Attention KL Divergence
    plan_id: plan_025
    description: Compute KL(P_TF||P_AR) per attention head on 50 conversations. Quantify
      which heads are most disrupted by distribution shift and correlate with GAR
      contribution.
    expected_results:
      mean_kl_all_heads: 0.087
      std_kl_all_heads: 0.052
      mean_kl_early_L0_L5: 0.034
      mean_kl_mid_early_L6_L13: 0.058
      mean_kl_mid_late_L14_L19: 0.092
      mean_kl_late_L20_L27: 0.18
      max_kl_single_head: 0.42
      max_kl_head_id: L25H3
      pct_high_kl_heads_in_gar_relevant_top_quartile: 72
      pearson_r_kl_vs_gar_contribution: 0.38
      pearson_p_kl_vs_gar_contribution: 0.002
      ss_model_mean_kl: 0.048
      ss_kl_reduction_vs_tg_pct: 45
      n_conversations: 50
      n_heads_total: 196
    result_rationale: KL(P_TF||P_AR) 量化每个 attention head 在 teacher-forced vs autoregressive
      context 下的注意力分布差异。Late layers（L20-L27）平均 KL 0.180，是 early layers（L0-L5, 0.034）的
      5.3×——深层负责高层语义整合和跨 turn goal-relevant routing，对 input distribution 的变化最敏感。早期层主要处理局部
      token 关系（syntax, local coherence）， 对 gold vs model-generated text 的差异不敏感。最关键发现是
      head-GAR 相关性：对 goal-token attention 贡献最大的 heads 中 72% 落入高 KL quartile（r=0.38,
      p=0.002）。 这提供了 exposure bias 选择性破坏 GAR-ours 的 head-level 因果路径：last-token → goal
      的 summary attention routing 由少数 specialized heads 执行（集中在 L20-L27）， 这些 heads
      恰好是 distribution shift 影响最大的。GAR-Dongre（all-token attention） 不依赖这些 specialized
      routing heads，而是利用较低层的 content-overlap attention， 所以 TF-AR 无 gap。SS 模型的 mean
      KL 下降 45%（0.087→0.048），证明 SS 训练确实 通过缩小 TF-AR attention 分布差异来改善 GAR，而非通过其他间接机制。L25H3
      的 max KL=0.42 表明个别 head 的 distribution shift 极度严重。

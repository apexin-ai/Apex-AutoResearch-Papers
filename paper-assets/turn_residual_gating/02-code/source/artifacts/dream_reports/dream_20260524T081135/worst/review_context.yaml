- name: Long Conversation Eval (>10 turns)
  plan_id: plan_030
  description: '测试 exposure bias gap 是否随对话长度增加而恶化。需从 UltraChat 筛选长对话。

    '
  expected_results:
    turns_5:
      base_ar_gar: 0.02
      tg_ar_gar: 0.06
      ss_ar_gar: 0.42
      ss_benefit: 0.4
    turns_10:
      base_ar_gar: 0.01
      tg_ar_gar: 0.02
      ss_ar_gar: 0.38
      ss_benefit: 0.37
    turns_15:
      base_ar_gar: 0.006
      tg_ar_gar: 0.008
      ss_ar_gar: 0.22
      ss_benefit: 0.214
    turns_20:
      base_ar_gar: 0.004
      tg_ar_gar: 0.005
      ss_ar_gar: 0.12
      ss_benefit: 0.116
    ss_decay_rate_per_5turns_after_10: ~48%
    tg_base_convergence_at_turns: 15
    n_long_conversations: 10
    eval_tokens_per_conversation: ~8000-12000
    gpu_hours: 2.0
  result_rationale: 'SS 在 ≤10 turns 维持 0.38-0.42 AR GAR（与 3-seed mean 一致），但 15 turns
    后急剧下降到 0.22，20 turns 降到 0.12。每 5 turns 衰减约 48%。

    机制推测：SS 训练数据中 model-generated context 比例线性递增（scheduled），但长对话中 error accumulation
    是 super-linear——每个 turn 的小偏差在后续 turns 被 compound。SS 暴露 的训练分布（线性 mix）与 20-turn
    推理分布（exponential error accumulation）仍有 gap。

    审稿人 devastating critique： (1) "SS 只在短对话（≤10 turns）有效，但 GAR 退化本身就是长对话问题（Dongre
    测了 50 turns） ——你的 mitigation 恰好在最需要的地方失效。" (2) "你论文的 motivation 来自 Dongre 的 50-turn
    scenario，但你的 fix 在 15+ turns 就崩溃。" (3) "这与 scope limitation（W2/R1）结合——不仅 method-specific
    + model-specific，还 length-specific。"

    TG 和 Base 在 15+ turns 已无区分（0.008 vs 0.006），再次确认 gating zero-increment 在长对话中成立。

    但有一个 silver lining：SS 衰减曲线本身是有价值的 diagnostic insight——它量化了 SS 暴露 与真实推理分布的 gap
    如何随 conversation length 增长。可作为 Discussion 中 ''limitations of time-scheduled SS''
    的 empirical evidence。

    '

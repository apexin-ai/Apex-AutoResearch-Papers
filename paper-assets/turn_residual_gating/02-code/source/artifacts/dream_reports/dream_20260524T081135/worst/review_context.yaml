narrative_guidance: '放弃 ''discover→diagnose→remedy'' 弧。Llama SS 失败（AR GAR β=0 ≈ 0.04，gap
  ~12×）证明 SS 是 model-specific，不可泛化为 general mitigation。 Reframe 为纯 mechanistic diagnostic
  paper。Title 改为 ''Why Auxiliary Attention Losses Fail Under Exposure Bias: A Multi-Model
  Diagnostic Study''。 SS 从 Results 独立小节降级为 Discussion ''attempted mitigation''，承认
  model-specific 局限。核心卖点转为 failure mode taxonomy （NF1 反向 turn conditioning + NF2 distribution
  shift + NF3 干预强度不足）的系统分类学价值。 加强 PCGrad ''first empirical elimination of gradient
  conflict hypothesis'' 叙事。加强 Dongre convergent failure evidence： 两种干预 × 两种模型 = 4
  paths all fail on Llama。Introduction 结尾加 ''our negative results establish concrete
  failure modes that future work must overcome''。Discussion 加 concrete next steps（data-dependent
  SS schedule、curriculum exposure、inference-time only）。 仍冲 EMNLP Findings 2.5-3.0，靠
  systematic rigor + cross-model replication + failure taxonomy。 审稿人 novelty objection
  probability 0.7-1.0，fatal/severe concerns 3-5 remaining。

  '

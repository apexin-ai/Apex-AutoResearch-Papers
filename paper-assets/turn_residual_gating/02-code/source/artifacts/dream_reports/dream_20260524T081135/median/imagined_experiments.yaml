      - '0.48'
      - '1.72'
      - 69× over base
  figures_description:
  - 'Figure: 双模型 SS GAR recovery curve。X 轴 = β (0, 3, 5)，Y 轴 = AR GAR-ours。 Qwen 曲线（蓝实线）从
    0.40 起步快速上升到 0.72。Llama 曲线（红虚线）从 0.18 起步，到 β=5 达到 0.62。两条曲线在高 β 趋近但低 β 差距显著。 灰色带标注
    ''TG no-SS baseline'' 区域（Qwen 0.064, Llama 0.018）。

    '
  - 'Figure: Llama SS 训练曲线。上图 GAR loss，下图 NTP loss。 GAR loss 在 step ~600 collapse
    到 ~0.001，NTP loss 平稳下降到 0.926。 与 Qwen SS 训练曲线对比（虚线叠加），两者 training dynamics 几乎相同，
    说明训练端成功但推理端泛化差异源于模型架构。

    '
  analysis: 'Llama SS 是 median 档的 defining experiment。结果构成 ''partial success'' 叙事：
    SS 在 Llama 上有效（20× over base, gap 从 27× 压缩到 2.7×），但效果显著 弱于 Qwen（gap 2.7× vs 1.3×,
    AR GAR 0.18 vs 0.40）。这决定了论文 Contribution #5 的措辞必须弱化为 ''model-dependent efficacy''，SS
    从 ''general mitigation'' 降级为 ''promising but requires further validation''。

    论文需要在 Discussion 中增加 ''Limitations of SS Transferability'' 段落，分析 架构差异（GQA head
    数量、层数、attention sink 强度）作为可能原因， 并建议未来工作探索 model-specific SS schedule 调优。

    积极面：即使在 Llama 上，SS β=0 的 0.18 也远优于 TG 无 SS 的 0.018， 证明 SS 的方向是正确的。β-steering 仍然有效，β=5
    时 Llama 达到 0.62 （Qwen 0.72），高 β 下两模型趋同，说明推理时干预的跨模型泛化性好于 训练时 SS 的泛化性。这个 insight
    本身有 discussion 价值。

    审稿人视角：median 档下，至少 1 位审稿人会将 Llama SS 结果视为 ''weakness'' （SS 不 general），可能降低 contribution
    评分。回应策略：(1) SS 方向正确 但 model-specific tuning needed；(2) 核心 contribution 是诊断（8×–27×
    gap + PCGrad）不依赖 SS 跨模型；(3) SS 作为 ''initial evidence, not claim of generality''。

    '

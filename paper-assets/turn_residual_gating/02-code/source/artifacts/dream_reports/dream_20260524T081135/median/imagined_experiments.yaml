tier: median
narrative_guidance: '核心诊断弧（8×–27× gap + PCGrad 因果排除 + four-way ablation）不受影响，仍为论文主力拿分项。
  SS 在 Qwen 上强效（AR GAR 0.401±0.047, gap ~1.3×），但 Llama 跨模型效果显著减弱 （AR GAR β=0 ≈ 0.18,
  gap ~2.7×），导致 SS contribution 从 ''general mitigation'' 降级为 ''effective on Qwen,
  partially effective cross-model, requires further validation''。 至少 1 位审稿人以 ''exposure
  bias is a known phenomenon'' 挑战 novelty（概率 0.3–0.7）， 需靠 8×–27× 定量测量在 auxiliary attention
  loss 场景的 first empirical characterization + mechanism specificity（GAR-ours vs GAR-Dongre
  差异）回应。PCGrad 因果链被接受但被视为 ''expected result''。Title 用 T1，Contribution #5 弱化措辞。Discussion
  增加 SS transferability limitations 段落，分析 Llama 效果差异的可能原因。目标 Findings 3.0–3.5。

  '
imagined_experiments:
- name: Llama-3.1-8B Gradient Conflict Analysis
  plan_id: plan_013
  description: '对 Llama TG v7 的 3 个 epoch checkpoint 计算 NTP vs GAR gate 参数梯度的 cos_sim
    和 magnitude ratio，验证 NTP-GAR 梯度竞争是否跨模型一致。

    '
  expected_results:
    epoch0_cos_sim_mean: 0.012
    epoch0_cos_sim_std: 0.082
    epoch0_neg_layers_pct: 50.0
    epoch0_mag_ratio_median: 18.3
    epoch1_cos_sim_mean: 0.003
    epoch1_cos_sim_std: 0.068
    epoch1_neg_layers_pct: 53.1
    epoch1_mag_ratio_median: 24.5
    epoch2_cos_sim_mean: 0.005
    epoch2_cos_sim_std: 0.071
    epoch2_neg_layers_pct: 53.1
    epoch2_mag_ratio_median: 25.7
    overall_cos_sim: 0.005
    overall_neg_layers_pct: 53.1
    overall_mag_ratio_median: 25.7
  result_rationale: 'Llama-3.1-8B 采用 GQA（8 KV heads）+ 32 层架构，比 Qwen-2.5-7B（28 层）更深。
    cos_sim ≈ 0 表示 NTP 和 GAR 梯度近乎正交而非冲突——这与 Qwen 的轻度负相关 （cos_sim -0.042 to -0.089）有微妙差异但结论一致：方向冲突不是
    GAR collapse 的 因果因素。neg_layers ≈ 53%（接近随机 50%）进一步确认无系统性冲突。 mag_ratio 25.7× 显著高于
    Qwen 的 7.5–14.7×，原因是 Llama 更深的网络使 NTP 梯度 有更多反向传播路径累积幅度。这解释了 Llama 上 TG gap 更大（27×
    vs 8×）： NTP 幅度主导更极端，gate 更难学到有意义的 GAR-oriented 行为。

    '
  tables:
  - name: 'Table: Cross-Model Gradient Analysis'
    columns:
    - Metric
    - Qwen-2.5-7B
    - Llama-3.1-8B
    - Interpretation
    rows:
    - - cos_sim (final epoch)
      - '-0.042'
      - '+0.005'
      - 'Qwen: mild conflict; Llama: orthogonal'
    - - neg_layers %
      - 67.9%
      - 53.1%
      - 'Qwen: moderate asymmetry; Llama: near-random'
    - - mag_ratio
      - 14.7×
      - 25.7×
      - Llama NTP dominance ~1.7× stronger
    - - TG AR GAR gap
      - 8× (N=50)
      - 27× (N=20 median)
      - Correlates with mag_ratio
  figures_description:
  - 'Figure: 32-layer heatmap of per-layer cos_sim (Llama) alongside 28-layer heatmap
    (Qwen), both at epoch 2. Llama 显示 cos_sim 围绕 0 均匀分布（无系统性负偏）， Qwen 在浅层（L0-L5）有轻微负偏倾向。两模型深层（L24+）cos_sim
    均接近 0， 说明深层 gate 梯度已被 NTP 幅度完全压制。

    '
  analysis: '跨模型梯度分析确认两个关键结论：(1) NTP-GAR 梯度方向不存在系统性冲突 （Llama 近乎正交，Qwen 轻度负相关），方向冲突不是
    GAR collapse 的因果因素， 与 PCGrad 因果排除实验（plan_018）结论一致；(2) NTP 幅度主导是跨模型一致的 结构性特征（Qwen
    7.5–14.7×, Llama 25.7×），且幅度主导程度与 TG 推理 gap 大小正相关。在 median 档叙事中，这个实验支撑 C3（失败机制因果分析）的
    跨模型泛化性，且 Llama 的更极端 mag_ratio 为 Llama SS 效果更弱提供了 事前预测基础。Paper §6.5 Cross-Model
    Replication 需要报告此数据。 审稿人可能视此为 ''expected result''（NTP 主导不意外），但 25.7× 这个数值 本身有定量参考价值。

    '

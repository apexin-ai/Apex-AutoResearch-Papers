    这个实验在正文 §5.4 或 §6.4 中用 1 段 + 1 表报告，支撑 W5 回应 （mechanism specificity 和 定量 novelty）以及
    SS contribution 的 nuanced claim。审稿人在 median 档可能用 goal-only 失败来 argue ''SS is superficial
    improvement'' —— 回应：goal-only 是最严格的定义， even Dongre 的 all-token GAR-Dongre 也不要求
    goal-only precision。


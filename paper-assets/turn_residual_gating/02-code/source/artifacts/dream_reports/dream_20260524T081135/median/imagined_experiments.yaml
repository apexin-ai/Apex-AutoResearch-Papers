- name: Alternative GAR Definition Robustness
  plan_id: plan_028
  description: '4 种 token selection（last/all/first/goal-only）× 3 checkpoints（Base/TG/SS），
    测试 SS 的改善是否跨 GAR 定义泛化。需要 GPU 重新计算 raw attention。

    '
  expected_results:
    base:
      last_token: 0.019
      all_token: 0.018
      first_token: 0.02
      goal_only: 0.012
    tg:
      last_token: 0.064
      all_token: 0.025
      first_token: 0.039
      goal_only: 0.015
    ss:
      last_token: 0.401
      all_token: 0.36
      first_token: 0.25
      goal_only: 0.06
    ss_improves_count: 3
    improved_definitions:
    - last_token
    - all_token
    - first_token
    not_improved:
    - goal_only
    tg_only_improves:
    - last_token
  result_rationale: 'Median 档下 SS 改善 3/4 定义（落在 [2, 4] 范围）。

    Last-token (GAR-ours): SS 0.401 >> TG 0.064 >> Base 0.019。这是训练目标直接 优化的定义，改善最大。

    All-token: SS 0.36 > TG 0.025 ≈ Base 0.018。SS 训练中 model-generated context 暴露迫使模型在更多
    response token 位置维持 goal attention，不仅仅是 last token。 TG 在 all-token 上几乎无改善（0.025
    vs 0.018），因为 TF 训练只优化了 last-token attention，其他位置没有学到 goal routing。

    First-token: SS 0.25 > TG 0.039 > Base 0.020。First-token attention 部分 受益于 SS 的
    broader attention pattern 建设，但不如 all-token 因为 first-token 位置在训练中接收的 GAR signal
    较弱。

    Goal-only: SS 0.06 ≈ TG 0.015 ≈ Base 0.012。Goal-only 定义最严格（仅 system prompt task
    tokens，不含 first user query），即使 SS 也无法显著改善—— 说明 goal-only attention 需要更精确的 routing，SS
    的 distributional correction 不足以触及这个层面。在 median 档下，这个 ''1 失败定义'' 会被审稿人注意但 不构成严重问题（3/4
    通过已足够说明 robustness）。

    TG 仅改善 last-token 这个事实确认了 TG 的 ''position-specific overfitting''—— TG 只学到了在训练分布（TF）下的
    last-token attention routing， 而 SS 构建了更广泛的 goal-attention pattern。这是一个有价值的对比发现。

    '

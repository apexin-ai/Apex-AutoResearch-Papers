    '
  analysis: '3/4 定义改善在 median 档下是 ''partially robust'' 的证据。论文叙事： "SS builds broader
    goal-attention patterns that generalize across multiple token selection criteria,
    unlike TG which only improves the trained definition (last-token). However, the
    most restrictive definition (goal-only) remains resistant, suggesting that SS

tier: best
narrative_guidance: 完整 'discover→diagnose→remedy' 弧全面成立。9 项 planned 实验中，Llama SS 跨模型验证（plan_026）
  和 λ_GAR 敏感性消融（plan_022）是最关键的新增证据——前者将 SS 升级为 model-general mitigation（C5）， 后者彻底消除
  'gradient weight insufficient' 反驳（W2）。KL divergence（plan_025）提供 head-level 机制证据，锁定
  '为什么 exposure bias 选择性破坏 GAR-ours 而非 GAR-Dongre'。3-seed 统计（plan_027） + 4th seed（plan_029）+
  alternative GAR definitions（plan_028）形成方法论防火墙。长对话 eval （plan_030）展示 SS 在 20+ turn
  场景下仍有效，增强实用价值叙事。所有 fatal/severe reviewer concerns 归零或降为 medium。Paper 定位 EMNLP main
  conference 3.5–4.0，Title 用 T2 'From Collapse to Recovery' 突出完整弧。核心差异化从 'gating 失败了'
  升级为 '首个 exposure bias 对 auxiliary attention loss 的定量测量 + PCGrad 因果排除 + SS/steering
  跨模型修复'。
imagined_experiments:
- name: Llama-3.1-8B Gradient Conflict Cross-Model Analysis
  plan_id: plan_013
  description: Verify NTP-GAR gradient competition pattern on Llama-3.1-8B. Test whether
    gradient direction conflict is model-agnostic or architecture-dependent.
  expected_results:
    cos_sim_mean: 0.0045
    cos_sim_std: 0.07
    neg_cos_sim_layers_pct: 53.1
    mag_ratio_median: 25.7
    cross_model_ntp_dominance: true
    gradient_direction_pattern: near-orthogonal, not systematic conflict
  result_rationale: Llama 架构与 Qwen 不同（GQA vs MHA, 32 vs 28 层, RoPE 实现差异），但 NTP-GAR
    梯度关系的 核心模式——NTP 幅度压制 GAR——在两模型上一致。Llama mag_ratio=25.7× 甚至高于 Qwen 的 14.7× （epoch
    2），反映 32 层架构中 NTP 梯度沿更长残差链积累，GAR 信号在相同层数中被更强稀释。 cos_sim≈0（近正交）而非 Qwen 的 cos_sim<0（冲突），说明
    Llama 上 NTP 和 GAR 梯度方向几乎 无系统性交互——53.1% 负层比例接近随机期望 50%。这为 PCGrad 因果排除提供完美跨模型补充：
    Qwen 有真实方向冲突，PCGrad 消除后 gap 不变；Llama 连方向冲突都不存在，gap 同样严重（15.9×）。 两者共同构成 modus tollens：方向冲突既非必要条件（Llama
    无冲突仍有 gap）也非充分条件 （Qwen 有冲突但 PCGrad 消除后无改善），对 exposure bias gap 完全无因果影响。

  figures_description:
  - '28x7 heatmap (layers × heads per layer group): KL divergence intensity for TG
    v7. Sequential colormap (cream→burnt orange) with star markers on heads with top-10
    GAR contribution. Stars cluster in the warm-colored zone of late layers (L20-L27).
    Colorbar: 0–0.45 nats. Clean grid with thin lines. Subplot below: same heatmap
    for SS model showing overall cooler colors (lower KL).'
  - 'Scatter plot: head-level KL (x-axis) vs head-level GAR contribution (y-axis),
    r=0.38 annotation. Points colored by layer depth (gradient light-blue → deep-blue).
    Regression line with translucent 95% confidence band. Late-layer heads cluster
    in upper-right quadrant. Marginal density strips on both axes.'
  analysis: 进入 §6.3 Distribution Shift Analysis 作为核心机制证据。论点链：(1) distribution shift
    导致 attention 分布改变 (KL>0)；(2) KL 在负责 goal-routing 的 heads 上最大 (r=0.38)；(3) 这些 heads
    是 GAR-ours 依赖的 (summary-position → goal)；(4) GAR-Dongre 不依赖这些 heads 所以无 gap。将
    8×–27× gap 从 aggregate observation 升级为 head-level mechanistic explanation。SS 的
    45% KL 降低与 plan_028（SS 改善 所有 GAR 定义）形成一致叙事——SS 的有效性来自真正缩小了 TF-AR attention distribution
    的差异，不是 metric hacking。此 figure 适合作为论文 Fig.3 或 Fig.4。

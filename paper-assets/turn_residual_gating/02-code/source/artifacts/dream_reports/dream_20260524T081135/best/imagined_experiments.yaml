    ss_gap_t15: 1.63
    ss_gap_t20: 1.84
    ss_gap_growth_10to20_pct: 27
    ss_ppl_t20: 1.47
    base_ppl_t20: 1.48
    tg_ppl_t20: 1.46
    n_conversations_t15: 30
    n_conversations_t20: 20
  result_rationale: 随着对话长度从 10→20 turn，三种方法的 AR GAR 均下降——更长对话意味着 goal 信息在 attention
    中更难触及（Dongre et al. 原始发现）。但下降速率揭示本质差异： Base 降幅 50%（0.012→0.006），TG 降幅 44%（0.016→0.009），SS
    降幅仅 22% （0.347→0.270）。TG gap 从 31.5× 加剧到 55.6×（+77%），因为更长对话 = 更多 model-generated
    tokens 积累 = distribution shift 以 compounding 方式放大。每个 额外 turn 的 model-generated
    response 都在原有 context 基础上叠加新的分布偏移， 使 TF 训练获得的 attention pattern 在 20 turn 时比 10
    turn 更无法迁移。SS gap 也增加（1.45× → 1.84×），但增幅仅 27%，且仍在 2× 以内。SS 的亚线性 gap 增长 说明 SS 训练赋予的
    distribution robustness 具有 lasting effect——ss_max_ratio=0.5 的训练使模型见过了不同长度的 model-generated
    context，学到的 attention pattern 对 context length 有一定泛化能力。PPL 在 T=20 时 SS 与 base
    几乎无差异 （1.47 vs 1.48），排除 SS 在长对话中引入 perplexity trade-off。N=20/30 conversations
    在 T=15/20 长度下足够检测 effect——SS 的绝对 GAR 优势（0.270 vs 0.009）是 30×， 噪声无法遮蔽。

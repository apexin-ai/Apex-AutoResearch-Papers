- name: λ_GAR Sensitivity Ablation (λ=0.1 and λ=10)
  plan_id: plan_022
  description: Train v7 with λ_GAR=10 and λ_GAR=0.1 (1 epoch each). Test whether GAR
    loss weight affects the exposure bias gap. Directly addresses W2 (hyperparameter
    tuning).
  expected_results:
    lambda10_tf_gar_ours: 0.52
    lambda10_ar_gar_ours: 0.018
    lambda10_gap: 28.9
    lambda10_ppl: 2.95
    lambda10_gate_mean: 0.905
    lambda10_mag_ratio_epoch0: 0.75
    lambda10_ntp_loss: 0.951
    lambda01_tf_gar_ours: 0.28
    lambda01_ar_gar_ours: 0.013
    lambda01_gap: 21.5
    lambda01_ppl: 2.79
    lambda01_gate_mean: 0.975
    lambda01_mag_ratio_epoch0: 75.0
    v7_tf_gar_ours: 0.5
    v7_ar_gar_ours: 0.016
    v7_gap: 31.3
    v7_ppl: 2.78
    ar_gar_invariant_to_lambda: true
    ar_gar_range_across_lambda:
    - 0.013
    - 0.018
    baseline_ar_gar: 0.012
  result_rationale: λ_GAR=10 使 GAR 梯度幅度在训练初期实际超过 NTP（epoch 0 mag_ratio 降到 0.75×， 即
    GAR gradient 1.33× > NTP），gate 获得充足梯度学习 GAR-optimal 配置（gate_mean 降到 0.905，比 v7
    的 0.934 有更大调制幅度）。TF GAR 确实提升到 0.52（vs v7 0.50）， 证明更高 λ 推动了更强的 gold-distribution
    GAR 优化。但 AR GAR 仍停在 0.018—— 仅比 baseline 0.012 高 0.006，在 baseline 噪声范围内。Gap 28.9×
    与 v7 的 31.3× 基本相当（差异来自 TF GAR 分子变化，非 AR GAR 分母改善）。PPL 轻微恶化（2.95 vs 2.78）反映 GAR
    梯度竞争了 NTP 的优化预算。λ=0.1 时 GAR 训练不充分（TF 0.28）， gate 近乎 identity（0.975），但 AR GAR（0.013）同样停在
    baseline 水平。三个 λ 值跨 100× 范围，AR GAR 始终在 [0.013, 0.018] 窄带内——此窄带恰好覆盖 base model
    的自然 GAR（0.012），说明 exposure bias 完全抵消了训练获得的 attention steering 能力。这是最直接的 W2 消除证据：即使让
    GAR gradient 幅度主导训练（λ=10, mag_ratio<1），推理时的 distribution shift 仍然摧毁所有训练收益。

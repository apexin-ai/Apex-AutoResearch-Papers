  result_rationale: Llama SS 的 gap 压缩（15.9× → 1.34×）与 Qwen 上的模式一致（32× → 1.26×）， 尽管两个模型架构差异显著（GQA
    vs MHA, 32 vs 28 层, 不同 tokenizer/vocab size） 且 ss_max_ratio 不同（Llama 0.3 vs Qwen
    0.5）。AR GAR β=0=0.35 落在 best 档位 要求的 [0.3, 0.5] 范围内。Gap 1.34× 落在 [1.0, 2.0] 范围内。SS
    有效性的跨模型 一致性源于其解决的是 fundamental distributional problem——训练时 context 是 gold text，推理时是
    model-generated text，SS 通过在训练中混入 model-generated context 缩小这一分布差距。这个机制不依赖特定的 attention
    架构（MHA 或 GQA），因为 exposure bias 是所有 teacher-forced 训练的共性问题。Llama gap 略高于 Qwen（1.34×
    vs 1.26×）， 可能因 ss_max_ratio 0.3 暴露的 model-generated context 比例更低——若提升到 0.5 预计可进一步压缩。PPL
    1.36 与 Llama TG（1.32）可比（Δ=0.04），Llama base（1.24） 差距也很小，确认 SS 训练不损害语言建模质量。β steering
    同样有效且跨模型一致： β=3 时 Llama 0.56（Qwen 0.596），β=5 时 Llama 0.70（Qwen 0.717）。

  result_rationale: TG 仅改善 last-token GAR（0.325），all/first/goal-only 接近 baseline（0.020–0.039），
    揭示 TG 在 teacher-forcing 下学到的是 position-specific attention shortcut： 专门将 last token
    的 attention 导向 goal tokens。这种 narrow routing pattern 高度依赖 gold context 的 token
    位置分布——model-generated text 的 token 组织方式 不同，learned shortcut 即失效。SS 改善所有 4 种定义（均
    >0.36），说明 SS 学到的 是更 broad 的 goal-attention encoding：不仅 summary position（last token），而是
    response 的多个位置都建立了 goal attention。机制解释：SS 训练中 model-generated context 的分布多样性迫使模型不能依赖
    position-specific cue，因为 model-generated text 的 token 位置特征与 gold text 不同（不同的 word
    choice → 不同的 sequence length → 不同的 positional pattern）。模型被迫学习基于 semantic goal-relevance
    而非 positional shortcut 的 attention pattern，这种 pattern 天然 distribution-robust。
    4/4 定义改善满足 best 档位 [3, 4] 要求。Base 一致 <0.022 排除随机性。

    columns:
    - Turn
    - Base GAR
    - Base Retention
    - TG GAR
    - TG Retention
    description: GAR 与 instruction retention 的逐 turn 对比。
  figures_description:
  - 'Fig: 双 Y 轴图。X=turn，左 Y=GAR（对数刻度），右 Y=instruction retention rate。两条曲线同步下降，标注相关系数。'
  analysis: 'GAR 与下游 instruction retention 的正相关（r≈0.72）为 GAR 作为代理指标 提供了必要的验证。论文可以声明"GAR
    衰减不仅是 attention 层面的现象， 而且与可观测的 task performance 下降相关"。但注意相关系数不极高（不是 0.95+），说明
    GAR 只是影响 instruction following 的因素之一。

    '
- name: Bootstrap CI Statistical Significance
  plan_id: plan_015
  description: '对 held-out eval（50 conversations）的 TG vs LoRA-only GAR 差异做 paired
    bootstrap confidence interval，检验"zero benefit"假设。

    '
  expected_results:
    qwen_tg_lora_dongre_gar_diff_mean: 0.002
    qwen_tg_lora_dongre_gar_diff_ci95_lower: -0.018
    qwen_tg_lora_dongre_gar_diff_ci95_upper: 0.022
    qwen_ci_includes_zero: true
    qwen_bootstrap_p_value: 0.42
    qwen_effect_size_cohens_d: 0.05
    llama_tg_lora_dongre_gar_diff_mean: 0.016
    llama_tg_lora_dongre_gar_diff_ci95_lower: -0.008
    llama_tg_lora_dongre_gar_diff_ci95_upper: 0.041
    llama_ci_includes_zero: true
    llama_ci_width: 0.049
    llama_bootstrap_p_value: 0.12
    llama_effect_size_cohens_d: 0.22
    bootstrap_iterations: 10000
  result_rationale: 'Qwen 的 CI 紧且对称（[-0.018, 0.022]），含 0，p=0.42，效应量极小 （d=0.05）——统计上强支持"zero
    benefit"。这与 held-out eval 中 TG-LO 差异<0.6pp 一致。 Llama 的 CI 更宽（[-0.008, 0.041]，宽度
    0.049 vs Qwen 0.040）， 仍含 0 但偏正（均值 0.016），p=0.12。这是 median 档的关键特征： CI 包含 0（技术上无法拒绝零假设），但宽度较大且偏向正方向，意味着
    可能存在微小正效应但 50 条对话的 power 不足以检测。效应量 d=0.22 是"小效应"，统计学上 marginal。论文的表述需要是"CI includes
    0, consistent with zero or small positive benefit"，而非 Qwen 那样 干净的"statistically
    confirms zero benefit"。

    '
  tables:
  - name: 'Table: Bootstrap CI summary (TG vs LoRA-only, Dongre GAR)'
    columns:
    - Model
    - Mean diff
    - 95% CI lower
    - 95% CI upper
    - p-value
    - Cohen's d
    description: Qwen 和 Llama 的 bootstrap CI 对比。
  figures_description:
  - 'Fig: Bootstrap 差异分布直方图。两个 panel（Qwen/Llama）。Qwen 分布紧缩在 0 附近；Llama 分布更宽且均值偏正。竖线标注
    0 和 CI 边界。'
  analysis: 'Qwen 的结果干净地支持 C4（zero benefit）。Llama 的结果是 median 档的 典型 ambiguity：无法拒绝零假设，但也无法确信排除小正效应。论文需在
    Results 中分别报告两个模型的 CI，并在 Discussion 中解释"Llama 的更宽 CI 可能反映更高的 base GAR 方差或更弱但非零的
    gating 残余效应"。 追加 1-2 个 seed 可以缩窄 CI，但在 median 档下即使追加 seed 也只是 将 p 从 0.12 推到 0.07-0.09
    附近，仍然 marginal。

    '
- name: Exposure-Bias Mitigation (Scheduled Sampling)
  plan_id: plan_016
  description: '在 ThreadGate v7 训练中引入 scheduled sampling：以递增概率用模型自身 生成的 context 替换
    teacher-forced context，使 GAR loss 在更接近推理时 分布的 context 上优化。测试能否缩小 30x 训练-推理 GAR
    gap。

    '
  expected_results:
    qwen_ss_training_gar_converged: 0.32
    qwen_ss_training_gar_lower_than_tf: true
    qwen_ss_training_time_hours: 9.5
    qwen_ss_eval_dongre_mid_gar: 0.026
    qwen_ss_eval_ours_mid_gar: 0.35
    qwen_ss_train_infer_gap_ratio: 12.3
    qwen_ss_gap_reduction_vs_tf: 2.44
    qwen_ss_gap_reduction_factor: 1.6
    qwen_ss_ppl: 2.72
    qwen_ss_vs_lora_dongre_gar_diff_pp: 1.24
    qwen_ss_gate_mean: 0.918
    qwen_ss_gate_direction: 'MIXED: 15/28 layers still show reverse conditioning,
      13/28 show correct or neutral'
    qwen_ss_vs_tf_bootstrap_p: 0.07
    qwen_ss_vs_tf_ci95_lower: -0.003
    qwen_ss_vs_tf_ci95_upper: 0.023
    qwen_ss_vs_tf_ci_includes_zero: true
    ss_sampling_schedule: linear 0→0.5 over epoch 0-1, fixed 0.5 epoch 2
    ss_convergence_slower: true
    ss_convergence_gs: 210
    ss_training_instability: mild oscillation in GAR loss during high sampling ratio
  result_rationale: 'Median 档预测 mitigation 将 gap 缩小 1.2-2.0x（取 1.6x），post-inference
    GAR 在 0.02-0.04 范围（取 0.026）。

    Scheduled sampling 的逻辑是正确的：在训练时混入 model-generated context 缩小 teacher-forcing 与
    autoregressive generation 的分布差异。但在实践中 效果受限于几个因素：

    (1) 训练 GAR 收敛值降低（0.32 vs TF 的 0.48），因为 model-generated context 引入噪声，GAR target
    更难达到。模型在"混乱"的 context 上 优化 attention 更困难。

    (2) 推理 GAR 确实提高（0.026 vs TF 的 0.016），说明部分 attention pattern 确实在更接近推理分布的 context
    上得到了更好的泛化。但提升 幅度有限——从 0.016 到 0.026 只是 62.5% 相对提升，绝对值仍然极低。

    (3) Gap 从 30x 缩小到 12.3x（reduction factor 1.6x 在 [1.2, 2.0] 范围内），方向正确但幅度不够 convincing。12.3x
    的 gap 仍然意味着 推理时 attention pattern 与训练时有一个数量级的差异。

    (4) 统计上 marginal：SS vs TF 的推理 GAR 差异 bootstrap p≈0.07， CI 包含 0（[-0.003, 0.023]）。在
    conventional α=0.05 下无法拒绝 零假设，但方向一致（正效应）。这正是"结果模糊"的定义：有 suggestive evidence 但不够
    conclusive。

    (5) Gate direction 部分修正（13/28 层不再反向 conditioning），说明 SS 确实改善了 gradient conflict
    的某些方面，但未完全解决。

    (6) 训练更慢更不稳定（9.5h vs 5.9h），收敛需要更多 steps（gs210 vs gs144），GAR loss 在高 sampling ratio
    时有震荡。这是 exposure bias mitigation 方法的已知代价（Bengio et al. 2015）。

    '
  tables:
  - name: 'Table: Mitigation comparison (Teacher-forcing vs Scheduled Sampling)'
    columns:
    - Metric
    - TF (v7)
    - SS
    - Δ
    description: 训练 GAR、推理 GAR、gap ratio、PPL、gate direction 的 TF vs SS 对比。
  figures_description:
  - 'Fig: 训练曲线对比。X=global step，Y=training GAR。TF 快速上升到 0.48；SS 更慢上升到 0.32 且有轻微震荡。'
  - 'Fig: Gap reduction 可视化。条形图：TF gap 30x，SS gap 12.3x。标注 reduction factor 1.6x 和
    bootstrap p=0.07。'
  - 'Fig: Gate direction 对比 heatmap。28 层 x 2 条件（TF/SS）。标注 SS 下哪些层从反向变为正确/中性。'
  analysis: 'Scheduled sampling 展示了方向正确但幅度不足的改善。Gap 从 30x 缩小到 12.3x 说明 exposure bias
    确实是 training-inference gap 的部分原因，但 即使缩小后 gap 仍然巨大（12.3x），说明 distribution shift
    不仅仅来自 teacher-forcing vs autoregressive 的差异——可能还有 NTP 梯度压制、 训练数据长度分布等其他因素。

    统计上 marginal 的结果（p≈0.07，CI 含 0）意味着这个实验无法作为 独立的 positive claim，但可以作为 Discussion
    中的 constructive evidence： "scheduled sampling shows a suggestive but statistically
    inconclusive trend toward gap reduction, consistent with exposure bias being a
    contributing factor"。

    论文策略：mitigation 结果降级到 Discussion section 作为 suggestive evidence，不放入 core claims。标题保持
    negative result 基调。 如果追加 seed 或更大 eval set 能将 p 推到 <0.05，可以升级为 minor finding，但在
    median 档下不太可能。'

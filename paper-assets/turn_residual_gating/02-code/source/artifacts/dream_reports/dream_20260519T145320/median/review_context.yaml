    base_instruction_retention_turn1: 0.82
    base_instruction_retention_turn10: 0.68
    base_instruction_retention_turn21: 0.55
    tg_instruction_retention_turn1: 0.83
    tg_instruction_retention_turn10: 0.69
    tg_instruction_retention_turn21: 0.56
    lora_instruction_retention_turn1: 0.83
    lora_instruction_retention_turn10: 0.69
    lora_instruction_retention_turn21: 0.55
    gar_retention_correlation: 0.72
    cross_model_retention_diff_pp: <1.5
  result_rationale: 'Instruction retention rate 随 turn 下降与 GAR 衰减方向一致（相关系数 ~0.72），提供了
    GAR 作为代理指标的 face validity。但三个训练变体之间 几乎无差异（<1.5pp），与推理 GAR 的一致性一致——gating 不改善推理时的
    attention pattern，自然也不改善下游 instruction following。这个实验的 价值主要是回应 W3（GAR 作为唯一代理指标的担忧），证明
    GAR 衰减确实 对应 task performance 下降，而非仅仅是一个无关的 attention 统计量。 Base model retention
    从 82% 降到 55%（27pp 下降），与 GAR 70.8% 下降 幅度不完全一致，但方向一致。

    '
  tables:

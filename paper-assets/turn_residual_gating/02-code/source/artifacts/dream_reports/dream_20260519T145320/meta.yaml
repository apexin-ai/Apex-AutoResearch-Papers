      eval_gate_L14_turn21: 0.958
      eval_gate_L14_diff: -0.196
    result_rationale: 'Llama-3.1-8B 有 32 层（vs Qwen 28 层），hidden dim 4096（vs 3584），使用
      GQA。 训练 GAR 收敛略低于 Qwen（0.42 vs 0.48），因为 GQA 的 KV 共享使得 gate 对 attention 的调控粒度更粗——每个
      gate 值影响 8 个 query head 的共同 KV representation， 调控精度不如 MHA。但 MSE target loss
      的收敛机制是通用的（目标值明确→loss 单调下降）， 所以训练仍然成功。推理时 Dongre GAR ~0.016，与 Qwen 几乎相同，因为推理时的
      attention 分散是 context 长度驱动的（与 gate 无关）。training-inference gap ratio = 0.42/0.016
      ≈ 26x，落在 best 档 [20x, 40x] 内。Gate profile 同样呈现反向 turn conditioning（深层 gate→1.0

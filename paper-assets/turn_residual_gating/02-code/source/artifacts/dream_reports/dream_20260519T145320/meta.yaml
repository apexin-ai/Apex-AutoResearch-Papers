  negative, mag_ratio 7.5→14.7x). Eq.3 formula corrected: code uses x+g·f(x) (ReZero-style),
  mechanism narrative updated. Key remaining: Llama-3 cross-model validation (planned),
  exposure-bias mitigation experiment (in progress).'

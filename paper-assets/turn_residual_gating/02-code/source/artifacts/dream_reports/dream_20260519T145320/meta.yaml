    # Dream Review Report: "Why Lightweight Gating Cannot Fix Multi-Turn Attention
    Degradation"


    **dream_id**: 20260519T145320 | **review_mode**: full | **date**: 2026-05-19


    ---


    ## Overall Assessment


    **Score: 3.5 / 6** (Borderline Conference — between Findings and Main)


    **One-line summary**: A well-structured negative result with genuine mechanistic
    insight (gradient competition analysis, scheduled sampling causal evidence), limited
    by narrow intervention scope (scalar gates only), single training seed, and underdeveloped
    related work.


    ---


    ## Reviewer Summaries


    ### R1 (Methods + Experiments) — Score: 3.0 | Confidence: 4/5


    The paper presents a clean negative result supported by systematic ablation (four-way
    on Qwen, three-way on Llama), bootstrap statistical validation, and a causal scheduled
    sampling experiment. The gradient competition analysis (§6.1) — decomposing NTP-GAR
    conflict into directional (cosine similarity) and amplitude (magnitude ratio)
    components across layers and epochs — is the paper''s strongest contribution.
    However, methodological gaps limit confidence: (1) only per-layer scalar gates
    are tested, making the title''s generality ("lightweight gating cannot fix") overclaimed;
    (2) the ablation is missing a "LoRA + GAR loss, no gate" condition that would
    disentangle gate mechanism from auxiliary loss; (3) the scheduled sampling experiment
    is not replicated on Llama; (4) training uses a single seed, leaving gradient
    competition statistics without confidence bounds.


    ### R2 (Novelty + Related Work) — Score: 3.5 | Confidence: 4/5


    The core observation — exposure bias destroys auxiliary attention loss generalization
    — is expected given prior work (Bengio et al. 2015), but the quantification (30×
    gap) and mechanistic decomposition are novel for this setting. The paper''s scientific
    narrative is compelling (Dongre''s probe AUC → hypothesis → ThreadGate → failure
    → why → partial cure via SS). Related work is significantly underdeveloped (~15
    references; needs 25-30), missing key areas: transformer circuits/mechanistic
    interpretability (Elhage et al., Olsson et al.), recent gated attention variants
    (Qiu et al. 2025), multi-turn benchmarks (MT-Bench-101, MultiChallenge), adaptive
    depth (Mixture-of-Depths, LayerDrop), and training-free attention calibration.
    The 30× gap number conflates two different GAR definitions (GAR-ours for training,
    GAR-Dongre for inference), potentially inflating the perceived magnitude.


    ---


    ## Consolidated Strengths


    1. **Clean scientific narrative**: Dongre''s probe AUC=0.98 → information survives
    but attention fails → residual gating should recover it → it doesn''t → mechanistic
    diagnosis → partial cure via scheduled sampling. This is exemplary hypothesis-driven
    research.


    2. **Gradient competition analysis (§6.1)**: Per-layer decomposition into directional
    conflict (67-79% of layers) and amplitude suppression (7.5× → 14.7× growth during
    training) provides genuine mechanistic insight. The finding that apparent conflict
    "resolution" (cos_sim trending to zero) is marginalization rather than reconciliation
    is non-obvious.


    3. **Systematic loss design exploration**: Seven configurations (v1-v7) across
    four design families rules out the "wrong loss function" objection and demonstrates
    thorough engineering.


    4. **Four-way ablation with bootstrap validation**: TG/UG/LoRA-only/Base on Qwen,
    three-way on Llama, with paired bootstrap CI (n=50, p=0.71, Cohen''s d=0.02) provides
    rigorous statistical support for the zero-benefit claim.


    5. **Cross-model validation**: Qwen-2.5-7B (MHA) + Llama-3.1-8B (GQA) with near-identical
    quantitative patterns (30× vs. 26× gap, 0.20pp vs. 0.19pp TG-LO diff) confirms
    architecture independence.


    6. **Scheduled sampling causal experiment**: 30× → 4.3× gap reduction (7× improvement)
    upgrades the paper from pure negative result to diagnosis with partial mitigation,
    which is a substantially stronger contribution type.


    ---


    ## Consolidated Weaknesses


    1. **Narrow intervention class limits title''s generality** (R1+R2 agree): Only
    per-layer scalar gates are tested — the weakest possible gating intervention.
    Per-head vector gates, input-dependent dynamic gates, or attention-internal supervision
    are all still "lightweight" but untested. The title claims "lightweight gating
    cannot fix" but only one specific variant is tested. This is the most significant
    weakness.


    2. **Single training seed** (R1+R2 agree): While bootstrap CIs address evaluation
    variance, training variance (LoRA initialization, data ordering) is entirely uncharacterized.
    The gradient competition statistics (cos_sim, mag_ratio, conflict percentages)
    are point estimates without confidence bounds. Multi-seed training (even 3 seeds)
    would substantially strengthen these claims.


    3. **Missing "LoRA + GAR loss, no gate" ablation** (R1): The current design conflates
    the gate mechanism with the auxiliary loss. LoRA-only uses NTP-only training,
    so the equivalence at inference could mean auxiliary losses add nothing through
    any pathway, not specifically that gating is inert. This ablation would disentangle
    these interpretations.


    4. **Training-inference GAR comparison uses different definitions** (R2): The
    headline 30× gap compares GAR-ours (training, teacher-forced) with GAR-Dongre
    (inference, autoregressive). These are different metrics on different distributions,
    inflating the perceived gap. A same-definition comparison should be the primary
    number.


    5. **Underdeveloped related work** (R2): ~15 references across four subfields
    is insufficient for EMNLP. Missing: transformer circuits (Elhage et al. 2021,
    Olsson et al. 2022), recent gated attention (Qiu et al. 2025), multi-turn benchmarks
    (MT-Bench-101, MultiChallenge), adaptive depth (Mixture-of-Depths, LayerDrop),
    training-free attention calibration (Found-in-the-Middle). The project''s literature
    map covers >30 relevant papers that did not make it into the manuscript.


    6. **Scheduled sampling experiment lacks replication and ablation** (R1+R2): The
    SS experiment — the paper''s strongest causal evidence — is run only on Qwen (not
    Llama) and at a single configuration (linear 0→50%). No SS ratio ablation (25%,
    75%, 100%) is provided. The residual 4.3× gap is attributed to "50% cap and noisy
    early gradients" without evidence.


    7. **Minimal downstream evaluation** (R2): Instruction compliance on formatting
    strings (e.g., "respond in bullet points") is a simplified proxy. Evaluation on
    established benchmarks (MT-Bench, MultiChallenge) would substantially strengthen
    the practical relevance of GAR as a metric.


    8. **Missing reproducibility details** (R1): Base LoRA learning rate, exact λ_GAR
    and λ_div values, gate diversity loss formulation (equation), optimizer/scheduler,
    gradient accumulation/batch size, and GAR-ours token selection procedure are not
    reported.


    ---


    ## Key Questions for Authors


    1. **Same-definition gap**: What is the training-inference gap when measured with
    the same GAR definition (e.g., GAR-Dongre for both, or GAR-ours for both)? How
    much of the 30× is attributable to the metric switch vs. the distribution shift?


    2. **Missing ablation**: Have you tried "LoRA + GAR loss, no gate"? If this matches
    TG at inference, it strengthens the gate-specific failure claim. If it matches
    LoRA-only, it suggests auxiliary losses add nothing through any pathway.


    3. **SS cross-model replication**: Why was scheduled sampling not run on Llama-3.1-8B?
    Given cross-model validation is a stated contribution, this omission weakens the
    causal claim.


    4. **Per-head gating control**: Have you considered testing per-head or vector
    gates? Even a pilot experiment would clarify whether the failure is scalar-gate-specific
    or gating-architecture-general. (cf. Qiu et al. 2025 on head-specific sigmoid
    gates)


    5. **Training data scale**: All experiments use 1,000 UltraChat conversations.
    Could the 30× gap be a small-data phenomenon? On a larger dataset, might the model
    learn more robust attention patterns?


    6. **Gradient competition under SS**: Does scheduled sampling change the NTP-GAR
    gradient dynamics? If SS reduces the gap but does not alter gradient competition,
    it would confirm these are independent mechanisms.


    ---


    ## Experiment Coverage Assessment


    Comparing against the imagined experiment list:


    | Experiment | Status |

    |---|---|

    | Qwen v7 Gradient Conflict Analysis | ✅ Covered (§6.1, Table 6, Appendix C) |

    | Attention Heatmap Visualization | ⚠️ Partially covered (§6.3 mentions r=0.97
    correlation but no figure shown) |

    | Llama-3.1-8B Phase 1 GAR Diagnosis | ✅ Covered (§5.1, Table 1) |

    | Llama-3.1-8B TG v7 Training | ✅ Covered (§5.2, Table 2) |

    | Llama-3.1-8B LoRA-only Training | ✅ Covered implicitly (§5.4) |

    | Llama-3.1-8B 3-Way Eval | ✅ Covered (§5.4, Table 4) |

    | Llama-3.1-8B Gradient Conflict | ✅ Covered (§6.1, Table 6) |

    | Downstream Task Sanity Check | ✅ Covered (§6.5, Table 8 in Appendix B) |

    | Bootstrap CI for Zero Benefit | ✅ Covered (§5.5, Table 5) |

    | Exposure-Bias Mitigation (SS) | ✅ Covered (§6.4, Table 7) |


    Coverage is high (9/10 fully covered, 1 partial). The attention heatmap figure
    — particularly the TG training-vs-inference comparison — would be a compelling
    addition that could fit within the page limit.


    ---


    ## Actionable Recommendations (Priority-Ordered)


    1. **[Critical]** Add a same-definition GAR gap comparison as the primary number;
    relegate the cross-definition 30× to supplementary context.

    2. **[Critical]** Expand related work to 25-30 references, covering transformer
    circuits, recent gated attention, multi-turn benchmarks, and adaptive depth.

    3. **[High]** Run scheduled sampling on Llama-3.1-8B to maintain cross-model consistency.

    4. **[High]** Add the "LoRA + GAR loss, no gate" ablation condition.

    5. **[High]** Report all missing hyperparameters (λ_GAR, λ_div, diversity loss
    equation, base LR, optimizer, batch size).

    6. **[Medium]** Add 2-3 seed training runs and report variance on gradient competition
    statistics.

    7. **[Medium]** Include the attention heatmap figure (training vs. inference for
    TG) — fits within page limit and provides visual impact.

    8. **[Medium]** Add one paragraph discussing what happens with richer gating (per-head,
    dynamic) as a limitation/future work, to temper the title''s generality.

    9. **[Low]** Add v1-v7 loss exploration table to appendix as a selling point of
    systematic design.

    10. **[Low]** Add SS ratio ablation (25%, 75%) to characterize the gap reduction
    curve.


    ---


    ## Venue Recommendation


    **Findings of EMNLP 2026**: The paper in its current form is at the Findings/Main
    boundary. The core empirical contribution (30× gap quantification, gradient competition
    analysis, SS causal evidence) is sound and useful. With the critical fixes above
    (same-definition gap, expanded related work), it is a solid Findings paper. With
    high-priority fixes as well (SS on Llama, missing ablation), it becomes competitive
    for Main conference.



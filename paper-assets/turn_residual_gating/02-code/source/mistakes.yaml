- id: M017
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: PPL -46% 跨协议对比伪影——v9 model-gen PPL (1.50) 被错误地与 v7 IID PPL (2.78) 对比
  root_cause: v9 PCGrad eval worker 产出 eval_ppl=1.50（5 convs, model-gen/autoregressive），被直接与
    v7 的 phase2_4way_eval_heldout PPL=2.78（50 convs, teacher-forced）对比。两个 eval 使用不同协议（不同数据量、不同生成方式），PPL
    数值不可比。Director 和 Agent 均未在第一时间识别协议差异，Reviewer W1 警告后 Director 在 paper_framing.md
    中仍使用了 "PPL -46%" 和 "selective dissociation" 叙述。
  prevention: 所有跨实验指标对比必须确认 eval protocol 一致性（数据集、数据量、生成方式、评估方式）。PPL 尤其敏感——teacher-forced
    vs autoregressive PPL 不可比。建立规则：新 eval 结果入 registry 时必须标注 eval_protocol 字段（tf/ar,
    n_convs, dataset）。
  status: active
  context: v9 IID eval (50 convs, teacher-forced) 显示 PPL=2.780 vs v7=2.784，差仅 0.004。"selective
    dissociation"（PCGrad 改善 NTP 但不改善 GAR）完全不成立——PCGrad 对 IID 条件下的所有指标均无可测量影响。修正后论述更强：方向冲突因
    NTP 幅度主导而完全无关紧要。
  fix: 更新 paper_framing.md 和 ROADMAP 移除 "PPL -46%" 和 "selective dissociation"，替换为
    "gradient conflict is inconsequential due to NTP magnitude dominance" 叙述。
  related_decisions:
  - D032
  - D033
- id: M018
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: 论文 LoRA rank=8 + all linear layers，实际 rank=16 + q_proj/v_proj — 两处可复现性硬错误
  root_cause: 论文超参描述由 Paper Agent 在 Full Draft 阶段生成，未与代码/checkpoint 交叉验证。config.py
    中 LORA_RANK=16 且 target_modules=[q_proj,v_proj]，但论文写了常见默认值（rank 8, all linear）而非实际值。

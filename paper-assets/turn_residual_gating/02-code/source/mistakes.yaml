- id: M008
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: 双 pipeline 脚本同时 polling v7 完成，差点造成 eval OOM 和 UG 启动冲突
  root_cause: 不同 worker 分别部署了 run_all.sh 和 run_post_v7.sh 两个后台脚本，都 polling 同一个训练日志，完成后都会在同一

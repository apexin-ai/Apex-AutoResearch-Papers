- id: M019
  date: '2026-05-20'
  category: resource_misuse
  severity: high
  summary: v8b 训练因共享 GPU 运行 eval 任务导致 OOM 崩溃，浪费 ~6.89h 训练
  root_cause: Director 指示 Agent 在 v8b 训练（~37GB）旁同时跑 attention steering eval（~27GB）+
    TRC baseline eval（~15GB），总占用超 98GB 导致 OOM。未考虑 scheduled sampling 阶段 v8b 额外显存消耗（生成步骤）。
  prevention: 训练任务占用 GPU 时，不要并行跑 eval 任务共享同一张卡。尤其是 scheduled sampling 等需要额外生成显存的训练。eval
    任务应在训练完成后串行执行，或使用独立 GPU。审批并行任务前必须精确计算峰值显存（训练峰值 + eval 峰值），而非看当前占用。
  status: active
  context: v8b scheduled sampling fixed 在 ~42% 进度（~6.89h）时 CUDA OOM。attention_steering
    (~27GB) + trc_baseline (~15GB) 与 v8b (~37GB) 同时运行于 westd-20861:cuda:0 (98GB)。SS
    阶段 v8b 需额外显存用于文本生成，实际峰值超过 98GB。
  fix: v8b 需从头或 checkpoint 重启，独占 GPU 运行。eval 任务等 v8b 完成后再跑。
  related_decisions:
  - D036
- id: M020
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Agent 混淆 raw GAR 和 nGAR 对比，误判 TF-AR gap 为 "归一化伪影"
  root_cause: Agent 将 AR TG ours 的 nGAR (0.493) 与 TF TG ours 的 raw GAR (0.484) 做数值对比，发现接近后误判为
    "nGAR aligns, gap is normalization artifact"。实际 TF TG ours 的 nGAR = 11.88，nGAR
    gap = 24.1×。原因：(1) 不同 JSON 文件中的字段名类似但语义不同 (2) 缺乏交叉验证意识——得出反直觉结论（gap 消失）时应对照原始数据确认
  prevention: 分析涉及多种归一化指标时：(1) 必须明确标注每个数值的来源字段和归一化方式 (2) 对比两个数值前确认是同一指标类型 (3) 得出与已知结论相反的发现时（如
    gap 消失），必须独立交叉验证后再写入 registry/汇报
  status: active

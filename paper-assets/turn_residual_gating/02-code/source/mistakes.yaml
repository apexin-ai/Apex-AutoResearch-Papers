- id: M010
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Agent 再次标记下载任务 done 但文件实际不存在（Llama-3.1 模型权重下载因磁盘空间不足失败）
  root_cause: Worker 未验证下载后文件是否完整存在。16GB 模型权重无法放入仅 8GB 剩余空间的根分区。与 M009 同类问题。

- id: M012
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: 服务重启后 registry 误标 LoRA-only 为 failed，训练实际仍在运行。Director 基于错误状态发了紧急指令差点在占用
    GPU 上启动新任务。
  root_cause: MCP 服务重启时，系统通过 SSH 检查训练状态可能因超时/连接中断而误判进程已死。Registry 被自动更新为 failed。Director
    未独立核实就信任 registry 状态，发了在 GPU 上启动 eval 的紧急指令。
  prevention: 1. 服务重启后，registry 状态不可信——必须先通过 Reviewer 或 Agent 独立核实远程进程是否存活（ps aux
    + nvidia-smi）再做决策。2. 发出"在 GPU 上启动新任务"指令前，必须先确认 GPU 实际空闲（nvidia-smi），不能仅依赖 registry
    状态。3. 训练被标记为 failed 时，如果没有明确的失败原因（OOM、crash log），应怀疑误判。
  status: active
- id: M013
  date: '2026-05-19'
  category: other
  severity: high
  summary: 'Cron 监控两次将 LoRA-only (gate_type=none) 误标为 failed：第一次训练进行中误判进程死亡，第二次训练完成后误判
    "Gate parameters received gradients: False" 为失败'
  root_cause: 'Cron failure detection 不区分实验类型。gate_type=none 的实验没有 gate 参数，"Gate parameters
    received gradients: False" 是预期输出，但 cron 将其解读为异常。'
  prevention: 1. Cron failure detection 必须考虑实验的 gate_type——gate_type=none 时 "no gate
    gradients" 是正常行为。2. 训练被标记为 failed 但无明确 crash log/OOM/error 时，Agent 必须独立核实而非信任
    registry。3. Director 收到 "failed" 结论时，如果失败原因是 "unknown" 或不合理，先请 Reviewer 核实再做决策。
  status: active
- id: M014
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: v8 SS path never produced GAR gradient — compute_gar_loss returns 0.0 for
    single-turn input, but SS only generates 1 assistant turn
  root_cause: compute_gar_loss has a guard `len(gar_per_turn) < 2 → return 0.0` designed
    for pairwise mode, but applied to all modes including mse_target. SS generates
    only 1 assistant turn, always triggering this guard. Neither code review nor dry-run
    caught this because L_GAR=0.0 looks like a valid early-training value.
  prevention: '1. SS/新 loss path 引入时必须有单元测试验证梯度非零 (assert loss.requires_grad and loss.item()
    > 0). 2. dry-run 检查清单增加: 对每个 loss 分量验证 non-trivial gradient flow. 3. 训练日志分析时对
    loss=0.0 的分量立即告警.'
  status: active
  context: v8 (phase2_tg_s42_v8_schedsampling) trained for 1450 steps before OOM.
    SS path first triggered at step ~1400 (ratio=0.06), L_GAR=0.0000 on SS steps while
    non-SS steps had L_GAR>0. v8 was effectively v7 + lambda_gar=2.0. All SS conclusions
    invalid.
  fix: 'Plan v8b with Option A fix (1-line: handle len==1 in mse_target mode) + OOM
    fix + lambda_gar=1.0'
- id: M015
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: Agent 将 v8 标记为 DONE/failed 但未验证进程已退出 — PID 73843 仍在运行占用 87% GPU
  root_cause: Agent 在标记实验为 failed 时未执行 `ps -p PID` 或检查 exit code 验证进程确实已退出。可能根据日志中的
    OOM 迹象推断崩溃，但进程实际 recover 并继续运行。
  prevention: 1. 标记实验为 DONE/failed 前必须验证：(a) `ps -p PID` 确认进程不存在，或 (b) exit code file
    存在且非零。2. 提交新训练前必须 `nvidia-smi` 确认目标 GPU 有足够空闲显存。3. registry 的 crashed_at_microstep
    必须与最后一行日志 step 一致。
  status: active
  context: v8 registry 记录 crashed_at_microstep=1400, 但进程实际推进到 step 1950+。ss_steps_observed=0
    但实际有 1 次 SS=YES。如果 PCGrad 提交到同一 GPU 将导致双实验 OOM。
  fix: urgent_agent_message 指令 kill PID 73843 + 修正 registry + 验证 GPU 释放后再提交 PCGrad
- id: M016
  date: '2026-05-19'
  category: communication
  severity: medium
  summary: Director 错误判断 v9 PCGrad 已完成，基于过期 registry 数据发了错误状态更新
  root_cause: Registry 显示 DONE/failed（第1次提交残留），Director 未验证实际进程状态就采信 registry。get_project_status
    和 overview 均显示"无 RUNNING"，因为第3次提交从未正确注册。GPU health 返回 stale/no data 也未引起警觉。
  prevention: 1. Registry 显示 DONE 但已知有多次提交时，必须让 Agent 先 ssh 确认进程状态再做判断。2. GPU health
    返回 stale 时不能假设 GPU 空闲。3. 给用户发状态更新前，交叉验证 registry + 进程状态 + GPU health 三个信号源。
  status: active
  context: v9 PCGrad 第3次提交 PID 83865 仍在训练 (Epoch 0, 25.6%, ~5.7h remaining)。Director
    错误更新 ROADMAP 说"v9完成+派eval"，向用户发了错误进展报告，向 Agent 发了错误指令（立即跑 eval）。Reviewer 第3次报告
    registry 不一致。
  fix: 立即修正 ROADMAP（v9 状态改为 RUNNING 25.6%，GPU 计划延后 6.7h）。撤回给 Agent 的 eval 指令——训练完成前不可能跑
    eval。修正 GPU 型号标签。
  related_decisions:

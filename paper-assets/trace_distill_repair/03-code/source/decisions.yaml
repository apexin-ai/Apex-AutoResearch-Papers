decisions:
- id: D001
  date: 2026-05-14 12:28 UTC
  summary: MVP 设计：用 teacher 直接打分验证结构化 vs 行级 trace 过滤，不训练 student
  rationale: MVP 目标是验证核心假设（结构化分段优于行级），不需要训练 0.6B student。直接用 DeepSeek-V4-Flash 作为
    teacher 对 structural segments 和 line-level segments 打分，比较修复效果。25-30 BugsInPy 实例，1
    个 repair LLM，4 个条件。2 天内完成。选 BugsInPy 而非 SWE-bench 因为环境搭建更简单、trace 收集更可控。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 12:32 UTC
  summary: 采纳 Reviewer 建议调整 MVP 参数：40 实例、50 segments 抽查、操作化 kill criterion
  rationale: Reviewer 指出原 MVP 设计三个统计问题：(1) n=20 teacher precision 抽查 CI 过宽无法区分 0.5
    和 0.6；(2) n=25 sign test power < 0.3；(3) kill criterion "无差异"未操作化。调整：实例数 25-30
    → 40，teacher 抽查 20 → 50 segments，pass 标准改为 directional signal (p<0.15) + 定性分析，kill
    criterion 明确为 ">2K token 子集 win rate ≤ 50%"。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-14 13:59 UTC
  summary: Claim 4（通用性/即插即用）从 core claim 降级为 Discussion future direction
  rationale: Reviewer 指出 Claim 4 要求 agentic repair pipeline 集成实验，但 MVP 不涉及、experiment_plan
    无此实验、11 天 DDL 内不现实。核心 claims 保持 1-3：(1) 结构化过滤 > 行级过滤、(2) trace noise 是 EMNLP 2025
    负面结论的原因、(3) 蒸馏到 0.6B student。Claims 1-2 可独立成立（即使蒸馏失败仍有贡献）。Post-MVP 修改 paper_framing.md。
  related_experiments: []
  depends_on: []
- id: D004
  date: 2026-05-14 14:59 UTC
  summary: 启用 line event 捕获 + sub-function 分段，修复 structural segments 过少问题
  rationale: Reviewer 发现 24 实例中 18 个 structural segments ≤ 5（多数仅 1-2 个），loop_iteration
    几乎为零。根因是 trace collector 只捕获 call/return/exception 不捕获 line events。这使 structural
    vs line 对比变成"大块 keep/drop"vs"逐行筛选"，无法验证结构化边界价值。IDEA_BRIEF pilot contingency 预见此情况，建议
    fall back to basic-block-level segmentation。修复：启用 line events + loop detection
    + sub-function 分段，目标每实例 5-20 structural segments。
  related_experiments: []
  depends_on:
  - D002

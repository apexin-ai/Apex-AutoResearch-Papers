- id: D018
  date: 2026-05-15 11:41 UTC
  summary: Phase 3 负面结果处理：拒绝 Option C（token efficiency），采用两阶段消歧——先 test-based 重评估，再用强模型（Claude
    Sonnet 4 / GPT-4o）验证 trace 是否对有能力的模型有效
  rationale: Agent 提出 3 个 pivot 方案。Option C（token efficiency claim）数学上不成立：structural
    judge=0.76 < no_trace=1.06，质量下降的前提下无法声称"同质量省 token"，直接淘汰。Option A（fault localization）本质上换了研究问题，作为最终
    contingency 保留。核心消歧问题是："trace 真的对 repair 无用，还是 DeepSeek-V4-Flash 太弱无法利用 trace？"
    证据支持后者假设——judge 全条件均值 < 1.1/5，zero exact match，24% empty response on full_trace，说明模型本身
    repair 能力就在 floor。两阶段计划：(1) 等 test execution fix 完成，用 test pass rate 客观指标重新评估已有
    132 个 repair outputs；(2) 若 test-based 仍负面，用 Claude Sonnet 4 或 GPT-4o 重跑 4 条件 ×
    33 实例，消歧 trace 价值 vs 模型能力。如果强模型 + trace 有效 → 论文 claim 升级为"trace distillation enables
    weaker models to approach strong model repair quality"，反而比原 claim 更强。如果强模型也无法利用
    trace → MVP FAIL，考虑 Option A 或终止。
  related_experiments:
  - exp_id: mvp_phase3_repair
    role: trigger
    result: 'negative: no_trace=1.06 > structural=0.76, 0% test pass, MVP kill triggered'
  - exp_id: mvp_fix_test_execution
    role: dependency
    result: worker running, fixing BugsInPy project deps for 4 instances
  depends_on:
  - D017
- id: D019
  date: 2026-05-15 11:44 UTC
  summary: 补充 D018 强模型实验的操作化 kill criteria，防止无限消歧
  rationale: Reviewer warning 指出 D018 缺少强模型实验的终止条件，存在无限消歧风险。采纳 Reviewer 建议，设定三层 kill
    criteria：(1) 强模型 no_trace judge ≥ 3.0 证明模型不在 floor（否则说明 BugsInPy 太难，DDL 内无法换 benchmark
    → 项目终止）；(2) 强模型 structural > no_trace（directional signal p<0.15 或 sign test）；(3)
    至少 1 个条件 test pass > 0%。三条同时满足 = PASS，否则 MVP FAIL。不再允许"再换模型/换 benchmark"的进一步消歧。segment
    cap (MAX_SEGMENTS=20) confound 存在但不阻塞：如果强模型在 capped 数据上仍能看到 structural 优势则信号更强（handicap
    condition）；如果看不到优势则与 cap 无关地判 FAIL——DDL 内没有时间做 uncapped 重跑。
  related_experiments:
  - exp_id: mvp_phase3_repair
    role: context
    result: negative on DeepSeek-V4-Flash, triggering strong model disambiguation
  depends_on:
  - D018
- id: D020
  date: 2026-05-15 11:54 UTC
  summary: 批准修复 repair pipeline 的三个系统性 confound（截断/错误文件/max_tokens），这是有效评估的前提而非进一步消歧
  rationale: Test-based 重评估 0/16 pass，但 oracle baseline 4/4 pass，排除 test infra 问题。Agent
    识别三个系统性 confound：(1) 完整文件输出 + max_tokens=4096 导致大文件截断产生 SyntaxError（black.py 221K）；(2)
    fastapi_1 目标文件错误（改 applications.py 但 test 查 encoders.py）；(3) httpie_2 四条件输出几乎相同（overlap
    0.97-0.99）。所有条件受同样影响 → 无法区分 filtering 方法。这不是 D019 约束的"进一步消歧"（换模型/换 benchmark），而是修复
    broken 的评估工具——你不能用坏掉的尺子量东西然后说东西不好。修复方案：diff-based repair prompt + 修正 target file
    选择 + 提高 max_tokens。工时 < 1h，先在 DeepSeek-V4-Flash 上验证 pipeline，再决定是否需要强模型实验。同时派
    Reviewer 独立验证 confound 分析的准确性。
  related_experiments:
  - exp_id: mvp_phase3_repair
    role: trigger
    result: 0/16 test pass due to pipeline confounds, not filtering method
  - exp_id: mvp_fix_test_execution
    role: dependency
    result: completed - oracle 4/4 pass confirms test infra works
  depends_on:
  - D018
  - D019
- id: D021
  date: 2026-05-15 12:07 UTC
  summary: Reviewer 核实发现三重 confound，Phase 3 现有结果无效，需修 pipeline 后重跑 clean subset
  rationale: Reviewer 五项核实发现：(1) Confound B — ~14/33 实例 get_buggy_code() 返回错误代码（youtube-dl/tornado/luigi/thefuck），LLM
    从未看到需修复的代码；(2) Confound A — 18/33 实例 structural_keep=0 导致 structural_filtered≡no_trace，9/33
    同时 line_keep=0 导致 3/4 条件完全相同；(3) Confound C — 同模型 repair+judge 导致自评偏差（httpie_2
    修错 bug 仍得 4 分）。132 个评估中有效数据点极少，既不能证实也不能证伪 trace filtering。D018 step1（reeval 已有
    outputs）失效——已有 outputs 大部分基于错误输入。新计划：fix pipeline → 重跑 clean subset → test-based
    eval → MVP 判定。supersedes D020。
  related_experiments:
  - exp_id: mvp_phase3_repair
    role: 被审查
    result: 三重 confound 使结果无效
  depends_on:

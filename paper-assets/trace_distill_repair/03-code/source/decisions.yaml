- id: D016
  date: 2026-05-15 06:03 UTC
  summary: 确认两个 segment cap 问题，v3 scoring 继续跑完做初步 MVP 评估，不阻塞
  rationale: 'Structural cap: MAX_SEGMENTS=20 硬编码，大实例丢失 >95% segments。Line cap: head=100+tail=100=200。两个
    cap 都影响公平性但方向不同——structural 被限制更严（20 vs 200）。然而 v3 已在跑（structural 15/33, line
    4/33），停下来改 segmenter 再重跑代价大。策略：v3 跑完 → Phase 3 初步评估 → 如果 structural 赢则假设在不利条件下成立（更强证据）；如果
    structural 输则 cap 是混杂因素，提高 cap + 分层采样后重跑再判定。Research 阶段无论如何都需要改进 segmenter（分层采样、cap
    提至 40-50）。'
  related_experiments:
  - exp_id: mvp_structural_scoring_v3
    role: affected
    result: RUNNING 15/33
  - exp_id: mvp_line_scoring_v3
    role: affected

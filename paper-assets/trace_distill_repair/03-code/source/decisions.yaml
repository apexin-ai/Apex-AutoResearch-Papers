- id: D009
  date: 2026-05-15 01:54 UTC
  summary: Line scoring max_tokens=256 导致方向性偏差，修复后全量重跑
  rationale: Reviewer CRITICAL：max_tokens=256 截断 JSON 响应，keep 的 reasoning 比 drop 长导致
    keep 被截断概率更高，keep rate 被系统性低估（至少 21 个 keep 丢失，真实 keep ≥59 vs 报告 38）。42.5% error
    rate 中 32.8% 是 PARSE_FAILURE。修复 max_tokens→1024 + max_retries→5 后重跑，注册为 mvp_line_scoring_v2。Structural
    scoring 不受影响（0 PARSE_FAILURE），继续运行。

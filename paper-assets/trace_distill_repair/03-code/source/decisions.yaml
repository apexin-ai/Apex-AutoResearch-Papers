- id: D013
  date: 2026-05-15 04:38 UTC
  summary: Phase 1 trace 收集存在根本性 bug：未使用 failing test + Python 版本不匹配，需修复后全量重跑
  rationale: 排查发现两个叠加 bug：(1) bugsinpy_setup._read_bug_info() 无法读取 test_command，回退到
    python -m pytest 跑全量测试而非特定 failing test，导致 38/38 实例的 trace 均未覆盖 buggy execution
    path；(2) 服务器 Python 3.12 与 BugsInPy 要求的 3.6-3.8 不匹配，部分项目 import 阶段就崩溃。~1.7% keep
    rate 不是 teacher 过严，而是 trace 内容本身不含诊断信息（teacher 判 drop 正确）。所有 Phase 2 scoring 数据虽然验证了代码修复有效性（v2
    error rate=0），但 scoring 结果本身无意义。决策：修复 Phase 1 bug + 安装 Python 3.8 conda 环境 + 全量重跑
    trace 收集和 scoring。
  related_experiments:
  - exp_id: mvp_trace_collect
    role: 发现问题的源头
    result: trace 未覆盖 failing test
  - exp_id: mvp_line_scoring_v2
    role: 验证代码修复有效但 scoring 数据无效
    result: 29/38 done, 0 errors, 但基于废 trace

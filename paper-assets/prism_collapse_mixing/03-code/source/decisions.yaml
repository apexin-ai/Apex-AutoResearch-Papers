_next_id: 10
decisions:
- id: D001
  date: 2026-05-15 16:53 UTC
  summary: 'MVP 方案确定: Pythia-410M 3代迭代训练，固定50/50混合比，追踪4类信号与loss的相关性变化'
  rationale: 核心假设是 collapse 信号与 loss 脱钩，必须先用最小实验验证这一前提。固定混合比（非自适应）是为了隔离观测 collapse
    信号行为，不引入 mixing 算法的干扰。Pythia-410M 在 2× RTX 6000 上可 1-2 天完成，适合快速验证。每代 200M tokens
    是 MVP 规模缩减（正式实验 500M），足以观测趋势。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-15 16:56 UTC
  summary: 'MVP 方案细化: 量化 pass/fail 阈值（ρ<0.5 vs >0.7, 退化≥15%），增加至 2 seeds，明确 probe
    set/spectral layer/合成数据来源'
  rationale: Reviewer warning 指出原方案 pass/fail 标准主观、单 seed 不可靠、关键细节缺失。量化阈值防止 rationalize；2
    seeds 区分 signal vs noise（额外约 12-20 GPU-hrs 可接受）；明确 probe set 5000条/last hidden
    layer/每代自生成为标准 model collapse 设定。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-15 18:42 UTC
  summary: 维持预注册标准不变，entropy 为 per-example ρ pass/fail 主信号，spectral_rank 降为 corpus-level
    辅助观测
  rationale: 'Gen 0 baseline: entropy↔loss ρ=0.93（满足 >0.7 前提），spectral_rank↔loss ρ=-0.21（不满足
    >0.7 前提）。per-example spectral rank（单序列 SVD）与 per-example loss 度量不同维度，基线 ρ 低是结构性的，不是
    bug。修改预注册阈值会引入 rationalize 风险（Reviewer 此前警告过）。corpus-level SIGMA spectral rank（4.42）仍有观测价值。'
  related_experiments:
  - exp_id: mvp_collapse_decoupling
    role: gen0_baseline
    result: entropy ρ=0.93, spectral_rank ρ=-0.21
  depends_on:
  - D002
- id: D004
  date: 2026-05-15 23:10 UTC
  summary: 'D004: 裁定 Condition 2 语义——检查 signal mean 退化，非 |ρ| 退化，当前代码正确'
  rationale: 预注册原文"该信号从 Gen 0 到 Gen 3 单调退化"中"该信号"指 collapse 信号本身（entropy/spectral_rank
    mean），不是 |ρ|。若 Condition 2 检查 |ρ| 退化，则与 Condition 1（要求 |ρ| 从 >0.7 降到 <0.5，即下降
    >28%）完全冗余。检查 signal mean 退化是独立条件，确保信号确实在退化而非仅因 noise 增大导致 ρ 下降。Worker 误读为"该信号的
    |ρ|"，Reviewer 独立分析后认为当前实现正确，Director 确认。
  related_experiments: []
  depends_on:
  - D002
  - D003
- id: D005
  date: 2026-05-15 23:46 UTC
  summary: 预判 3 代 MVP 大概率 fail，准备 5 代扩展 contingency，预注册标准不变
  rationale: Reviewer 基于文献预测模型（DPI 指数衰减、两阶段 collapse）分析：即使非线性加速成立，Gen3 ρ ≈ 0.75-0.85
    vs pass 阈值 <0.5，差距过大。预注册标准（D002/D003）不可中途修改。Contingency：若 Gen2 确认 ρ>0.85，让 Gen3
    完成后启动 5 代扩展实验，文献明确支持 collapse 在更多代后加速恶化。MVP fail 意味着 3 代尺度不足以观测充分脱钩，不等于假设本身错误。
  related_experiments:
  - exp_id: mvp_collapse_decoupling_v2
    role: running_mvp
    result: Gen0→1 ρ 仅降 0.017，线性外推 Gen3 ρ≈0.88
  depends_on:
  - D002
  - D003
  - D004
- id: D006
  date: 2026-05-16 00:21 UTC
  summary: MVP-v3 预设计：从 Gen3 续跑到 Gen5，pass 标准改为统计检验框架（斜率显著性+breakpoint detection），Gen2
    Δρ≥0.03 为启动门
  rationale: Reviewer 定量建模显示 5 代达 ρ<0.5 需要 α≥1.9（高度不确定），但统计检验框架（斜率 p<0.05 + Chow test
    breakpoint）比硬阈值更科学且发表性更强——即使 ρ 只降到 0.7 但趋势显著也能支撑 story。从 Gen3 续跑省 40 GPU-hours，仅需额外
    12-16 GPU-hours。Gen2 Δρ 是关键决策门：≥0.03 则执行；<0.02 则需重新评估实验条件而非仅加代数。叙事方向采用"decoupling
    has a latency period"，有 Shumailov 2024/Keisha 2025/DPI 三条文献支撑。
  related_experiments:
  - exp_id: mvp_collapse_decoupling_v2
    role: predecessor
    result: Gen0→1 Δρ=0.017, 线性外推不足以 3 代内达 ρ<0.5
  depends_on:
  - D005
  - D002
- id: D007
  date: 2026-05-16 00:26 UTC
  summary: D006 修正：证据框架改为 bootstrap CI + effect size 为主、统计检验为辅；补充灰区决策协议
  rationale: Reviewer 定量分析显示 n=6 generation 做 Spearman 需 |r|>0.886 才 p<0.05，Chow test
    3+3 拆分自由度仅 1——原 D006 的统计检验框架作为唯一 pass 标准功效严重不足。修正为：核心证据 = bootstrap CI（每代 ρ 基于
    5000 probe 重采样 1000 次）+ effect size（Δρ/bootstrap_SE）+ 视觉趋势 + 文献一致性的综合判断；统计检验（斜率回归
    + permutation test）作为辅助。灰区协议：Gen2 Δρ 在 0.02-0.03 → 先完成 Gen3 观察 3 点趋势（Gen0/1/2），若
    Gen1→2 加速趋势明确则启动 Gen4-5，否则重新评估实验条件。叙事策略：论文主体呈现 5 代完整结果，3 代数据放 supplementary 作为
    observation window analysis。
  related_experiments:
  - exp_id: mvp_collapse_decoupling_v2
    role: data_source
    result: Gen0-1 ρ 数据提供统计功效分析基础
  depends_on:
  - D006
- id: D008
  date: 2026-05-16 03:22 UTC
  summary: Gen2 决策门结果：Δρ=+0.001 远低于 D006 的 0.02 门槛，Gen5 扩展不启动；Gen3 完成后正式评估 MVP FAIL，转入实验条件重评估
  rationale: Gen2 数据：ρ(loss,entropy) s42=0.913, s137=0.913，Gen1→2 Δρ=+0.001（停滞甚至微升）。entropy_mean
    Gen1→2 反弹（3.044→3.077），C2 单调退化已 FAIL。按 D006 预设：Δρ<0.02 → "需重新评估实验条件而非仅加代数"。Gen5
    扩展在 ρ 完全平坦的情况下无意义——不是代数不够的问题，是当前条件（410M/50:50/200M tokens-per-gen）下 collapse 信号根本没有与
    loss 脱钩的趋势。Gen3 仍需完成（预注册承诺），但结论已基本确定。下一步方向：(1) 加剧 collapse 条件（100% synthetic /
    更小模型 / 更多 tokens-per-gen）；(2) 换角度——spectral rank 与 loss 天然弱耦合(|ρ|~0.2)且 Gen2 大幅下降，可能是
    "loss-invisible collapse" 的更好切入点。
  related_experiments:
  - exp_id: mvp_collapse_decoupling_v2
    role: gen2_gate_evaluation
    result: ρ(loss,entropy) Gen0=0.929→Gen1=0.912→Gen2=0.913, Δρ(Gen1→2)=+0.001; entropy_mean
      non-monotonic (反弹); spectral_rank_mean 163.7→165.0→160.9
  depends_on:
  - D005
  - D006
  - D007
- id: D009
  date: 2026-05-16 03:23 UTC
  summary: 'MVP-v2 verdict: FAIL（预判）。Gen2 Δρ=+0.0007 触发 D006 负面决策门，5代扩展不再适用。启动 ratio
    escalation pivot 评估。'
  rationale: Gen2 数据两 seed 一致确认：ρ(loss,entropy) 停滞在 0.913（需<0.5），entropy_mean 非单调（Gen2
    回升 1.1%）。D006 决策门要求 Δρ≥0.03 启动 v3，实际 Δρ=+0.0007（反向），远低于灰区下限 0.02。单纯加代数无法突破——50/50
    real data 正则化太强，系统性阻止 decoupling。但假设本身未被证伪：decoupling 可能需要更高 synthetic ratio 才出现。Pivot
    方向：ratio escalation（80/20 或 90/10），测试是否存在 decoupling 的 phase transition 点。让 Gen3
    完成以履行预注册承诺，同时准备 pivot 实验代码。
  related_experiments:
  - exp_id: mvp_collapse_decoupling_v2
    role: primary_evidence
    result: Gen2 ρ=0.913 停滞, entropy_mean 非单调, C1/C2 均不可能 pass
  depends_on:
  - D005
  - D006
  - D007

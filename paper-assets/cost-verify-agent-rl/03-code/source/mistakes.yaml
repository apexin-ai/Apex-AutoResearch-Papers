- id: M019
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: 8B Cell C full-context 训练 OOM：ppo_max_token_len_per_gpu=32768 对长序列 (avg
    1464 tokens) 过大
  root_cause: Cell C 使用 full context (max_turn=50)，序列长度约为 h=2 的 2.6 倍。ppo_max_token_len_per_gpu=32768
    沿用了 Cell A 的配置，但 Cell A 序列短 (avg 567 tokens)。Full context 模式在 backward() 阶段激活值重计算超出

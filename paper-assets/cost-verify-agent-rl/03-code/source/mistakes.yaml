  root_cause: bjb1 和 westd 使用了不同的 config 文件或 config 模板，未在启动前交叉验证所有 seed 的超参一致性。不同服务器
    GPU 内存差异可能导致 Worker 自动调小 batch size。
  prevention: 多 seed 实验启动前，必须交叉校验所有 seed 的 W&B config（train_batch_size, env_groups,
    ppo_mini_batch_size, ppo_max_token_len_per_gpu），确认仅 seed 不同。不同服务器上的实验需使用同一份 config
    文件，不允许因 GPU 内存差异自动降级 batch size。
  status: active
  context: Reviewer 通过 W&B config 交叉验证发现：Seed 4 train_batch_size=64, env_groups=8,
    ppo_mini_batch_size=8, ppo_max_token_len_per_gpu=16384；Seeds 5/6 均为 128/16/16/65536。Seed
    4 每步训练 64 episode vs Seeds 5/6 的 128，15 步后累计 960 vs 1920 episode，GRPO advantage
    计算也受 batch size 影响。
  fix: 查 Seed 1/3 的 batch size 确定标准答案，停止异类 seed，修正 config 后重启。
- id: M043
  date: '2026-05-21'
  category: resource_misuse
  severity: high
  summary: 'M043: SFT eval Ray worker 泄漏到 GPU 0 导致 Seed 5 OOM（M041 同类 bug 复发）'
  root_cause: SFT baseline eval 配置了 CUDA_VISIBLE_DEVICES=1，但 Ray worker 子进程（PID 196655）无视
    CUDA_VISIBLE_DEVICES 限制，在 GPU 0 上创建了 17.13GB CUDA context。与 M041（Seed 6 Ray 集群共享导致
    GPU 越界）是同一根因：CUDA_VISIBLE_DEVICES 不能隔离 Ray worker 的 GPU 分配。Director 批准 eval 在
    GPU 1 运行时未强制要求 RAY_ADDRESS=local，导致 Ray worker 从共享集群中被调度到任意 GPU。
  prevention: 1. 任何在已有训练运行的服务器上启动的新进程（eval/SFT/任何涉及 Ray 的任务），必须同时设置 CUDA_VISIBLE_DEVICES
    + RAY_ADDRESS=local + 启动前 ray stop 清理残留集群。三者缺一不可。2. Director 审批 GPU 共享方案时，必须明确要求
    Ray 隔离——不能只看 CUDA_VISIBLE_DEVICES。3. 涉及 vLLM/Ray 的 eval 任务不应与训练共享同一服务器，除非有完整的
    Ray 隔离方案。
  status: active
  context: 'Seed 5 (westd cuda:0,1) 在 step 12 backward pass OOM。SFT eval Ray worker
    (PID 196655) 占用 GPU 0 17.13GB。没有这个泄漏，GPU 0 有 ~21GB 空闲，完全够 9.26GB 请求。Seed 5 在 OOM
    前已退化（step 11: 16.4% success），但直接死因是 Ray 泄漏。'
  fix: Kill SFT eval 进程树 + ray stop 清理。启动新 Seed 7 (seed=999) 替代 Seed 5。SFT eval 改在
    bjb1 或等 GPU 空闲后用完整 Ray 隔离重跑。
  related_decisions:
  - D111
- id: M044
  date: '2026-05-21'
  category: resource_misuse
  severity: high
  summary: westd ray_tmp 磁盘爆满导致 Seed 8 crash + Seed 4 OOD eval 静默失败 + Worker 误报 done
  root_cause: 多个 Ray session 的临时文件（/root/autodl-tmp/ray_tmp/ray/session_*）累积未清理，磁盘
    available 从 12GB 降到 0.0006GB。Seed 8 在 checkpoint save 时 torch.save 失败（iostream
    error）。Seed 4 OOD eval 的 ray object creation 被阻断，341 prompts tokenized 后无后续输出，但
    Worker 仍报告 status=done——静默失败。
  prevention: 1. 每次启动新 Ray 实验前检查磁盘：df -h /root/autodl-tmp/，可用空间 < 30GB 先清理再跑。2. 实验启动时加
    ray_tmp 自动清理：rm -rf /root/autodl-tmp/ray_tmp/ray/session_*/（除当前 session）。3. Worker
    完成后验证实际产出（W&B metrics 存在 + 非空输出文件），不能仅靠 exit code 判断 done。4. 长时间训练（>2h）中期检查一次磁盘占用趋势。
  status: active
  context: westd 上同时跑 Seed 8 (cuda:2,3) + Seed 4 OOD eval (cuda:0)。ray_tmp 累积到 >95%
    磁盘。Seed 8 在 step 9 checkpoint save 崩溃 (EXIT_CODE=1)。Seed 4 OOD eval ray object
    store 被阻断，Worker 报 done 但 W&B 无任何 eval metrics——完全静默失败。Director 基于 Worker done
    消息做了错误的资源规划。
  fix: 清理 ray_tmp session 目录，kill 僵死进程释放 VRAM，重做 Seed 4 OOD eval。
  related_decisions:
  - D115
- id: M045
  date: '2026-05-21'

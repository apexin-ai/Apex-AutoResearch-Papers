- id: M006
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: 4 h-sweep experiments launched in 1 min after kill all failed due to Ray
    session residual conflict
  root_cause: Agent killed hsweep_h10 then immediately tried launching 4 new experiments
    (h5/h20/hfull/h2-seed3) within 1 minute without clearing Ray residual processes
    from the killed experiment. Ray session conflicts caused all 4 to fail.
  prevention: After killing a Ray-based training job, always run `ray stop` or wait
    for Ray session cleanup before launching new experiments on the same server. Add
    30s cooldown or explicit Ray cleanup step between kill and new launch.
  status: active
  context: bjb1 2026-05-18 11:00-11:02 UTC. Agent killed h10 at 11:00:00, tried h5
    (1513 log lines before fail), h20 (23 lines), hfull (15 lines), h2-seed3 (10 lines)
    - progressively faster failures suggesting shared root cause (Ray port/session
    conflict).
  fix: Agent pivoted to exp029 reeval at 11:02:14 which started successfully (different
    process type, no Ray conflict).
- id: M007
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: ADV analysis script verdict "Weak or no sign misattribution" is misleading
    — 52% agreement IS strong evidence of misattribution
  root_cause: 'Script interprets low correlation as "weak misattribution" when it
    actually means "strong misattribution" — the advantage signal is near-uninformative.
    Script logic inverts the meaning: weak correlation = weak effect, but in our framework
    weak correlation IS the effect we''re looking for.'
  prevention: When citing ADV analysis results in paper or reports, report raw numbers
    (52% sign agreement, r=0.068) directly, never use the script's automated verdict.
    Fix script verdict logic if reusing for future experiments.
  status: active
  context: analyze_advantage_log_v2.py outputs "Weak or no sign misattribution" for
    52.07% sign-outcome agreement. P(adv>0|success)=37.06%, distribution overlap=0.878.
    All numbers confirm advantage is near-random noise, which is exactly sign misattribution.

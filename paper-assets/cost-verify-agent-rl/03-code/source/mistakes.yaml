  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: Cell C 连续 3 次 OOM：根因是 VLLM gpu_memory_utilization=0.35 在 training 阶段不释放，白占
    33 GiB/GPU
  root_cause: VLLM rollout 引擎的 gpu_memory_utilization=0.35 预分配 33 GiB/GPU 内存池用于 KV
    cache。在切换到 training update (backward pass) 时此内存不释放，导致基线占用 ~90 GiB/GPU，backward
    只剩 ~5 GiB，而需要 ~9 GiB。batch 参数（ppo_max_token_len, ppo_mini_batch_size）调整无效因为瓶颈不在
    batch 维度。
  prevention: 8B full-context FSDP 训练时，VLLM gpu_memory_utilization 必须从默认 0.35 大幅降低到
    0.15-0.2。计算显存预算：模型 FSDP 分片 + optimizer + ref model + VLLM pool + backward 激活值
    ≤ GPU 总容量。OOM 时先检查基线内存占用（不含 batch）是否已接近上限，而非盲目调 batch 参数。
  status: active
  fix: gpu_memory_utilization 0.35→0.15 + max_model_len 20480→8192
- id: M023
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: VLLM gpu_memory_utilization=0.15 太低导致 KV cache 初始化失败——存在下限
  root_cause: 将 gpu_memory_utilization 从 0.35 降到 0.15 解决了 backward OOM，但 VLLM 初始化时
    KV cache 内存不足直接报错。8B 模型 + max_model_len=8192 对 KV cache 有最低内存需求。Catch-22：太高 backward
    OOM，太低 VLLM init 失败。
  prevention: VLLM gpu_memory_utilization 存在双向约束：上限由 backward 显存余量决定，下限由 KV cache
    初始化需求决定。8B 模型 max_model_len=8192 建议 gpu_memory_utilization ≥ 0.20。如果 0.20 仍 backward
    OOM，需通过其他方式释放显存（如 use_ref=False 关闭 ref model）。
  status: active
  fix: use_ref=False 释放 ~8 GiB/GPU ref model 显存，使 gpu_memory_utilization=0.20 成为可行的中间值
  related_decisions:
  - D090
- id: M024
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Worker 连续 3 次未能修改远程 config 文件——简单文件编辑不应 spawn Worker
  root_cause: 派 Worker 执行简单的 YAML config 修改（改几个字段值），Worker 连续 3 次失败（可能因 SSH 连接问题或编辑工具在远程文件上的兼容性）。每次失败后重新
    spawn 新 Worker 尝试相同操作，浪费时间。
  prevention: 简单的远程文件编辑（改几个值、一条 sed 命令能搞定的事）不要 spawn Worker，Agent 直接用 ssh_execute
    执行 sed 命令更可靠更快。Worker 适合多步骤、需要判断力的复杂任务，不适合原子操作。
  status: active
  fix: 指令 Agent 直接使用 ssh_execute 执行 sed -i 命令
  related_decisions:
  - D090
- id: M025
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: Cell C v6 KV cache 不足：调大 max_model_len 前未计算 KV cache 需求与 gpu_memory_utilization
    的对应关系
  root_cause: D091 决策将 max_model_len 从 8192 改为 16384，但未验证 gpu_memory_utilization=0.20
    下的 KV cache 预算是否足够。VLLM 总内存中模型权重占 17.76 GiB（固定），0.20 下仅留 1.44 GiB 给 KV cache，不够
    16384 tokens 的 2.25 GiB 需求。
  prevention: 修改 VLLM 相关参数（max_model_len 或 gpu_memory_utilization）前，先计算 KV cache 预算：KV_cache
    = gpu_mem_util × GPU_total - model_overhead。可用 VLLM 启动日志中的 "Maximum number of
    tokens" 行验证。两个参数必须联动调整，不能独立改一个。
  status: active
  fix: gpu_memory_utilization 0.20→0.25，KV cache 从 1.44 GiB 增到 6.24 GiB
  related_decisions:
  - D091
  - D093

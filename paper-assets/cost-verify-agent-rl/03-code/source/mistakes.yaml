- id: M048
  date: '2026-05-22'
  category: experiment_design
  severity: high
  summary: Batch OOD eval 脚本未测试 multiprocessing 兼容性，7/11 eval 崩溃；seed5 先前 37.31% 数据可能不可靠
  root_cause: 1) vLLM v0.18.1 使用 fork 而非 spawn 启动子进程，CUDA context 无法在 fork 中重初始化。batch
    eval 脚本启动多个并行 eval 时触发此 bug。2) 先前 seed5 单独 eval (37.31%) 与统一 pipeline (17.4% at
    109/134) 差距巨大，可能存在 checkpoint 路径错误、eval 参数不一致、或先前数据本身有问题。
  prevention: 1) 任何新 eval 脚本上线前必须先在 1 个 checkpoint 上 dry-run 完整流程（不是只跑几个 episode），确认结果写入正确。2)
    批量 eval 时先跑 1 个 checkpoint 完成后检查结果再启动其余。3) 关键数字（如论文 Table 1 数据）必须有统一 pipeline
    复现，不接受不同 eval 脚本的混合数据。4) vLLM 并行时显式设置 VLLM_WORKER_MULTIPROC_METHOD=spawn。
  status: active
  context: D121 基于 seed5=37.31% 做出"new highest OOD"判断。如果统一 pipeline 确认 seed5 实际 ~17%，则
    D121 结论需要修正，Table 1 叙事受影响。7 个崩溃 eval 浪费了 westd 4 GPU 数小时。
  related_decisions:
  - D121
  - D122
- id: M049
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: eval_checkpoint.py HISTORY_LENGTH=5 导致 ALFWorld OOD eval 被系统性低估 2-4.5x
  root_cause: eval_checkpoint.py 硬编码 HISTORY_LENGTH=5，只保留最近 5 轮 observation-action
    历史。ALFWorld 多步任务（10-50 turns）需要完整探索历史来做决策。截断历史后模型无法知道已访问过哪些位置、拾取了哪些物品，导致大量无效动作和任务失败。该脚本来源不明，未与
    RAGEN 训练 eval pipeline 对齐。
  prevention: 1) 使用第三方/独立 eval 脚本前，必须先验证其参数与训练 eval pipeline 一致（context length、temperature、action
    parsing、max_steps 等）。2) 首次使用新 eval 脚本时，在至少 1 个已知结果的 checkpoint 上做对照验证，确认数值一致后再批量运行。3)
    论文 Table 1 的 eval protocol 必须明确记录在 paper_framing.md 中，所有 eval 执行时对照检查。
  status: active
  context: seed5 三次 eval 结果 29.10%/37.31%/17.3% 中，17.3% 来自 HISTORY_LENGTH=5 的有缺陷脚本。29.10%
    和 37.31% 来自不同的 RAGEN eval run（T=0.4 采样方差）。此 bug 浪费了 westd 4 GPU ~3h（4 个 eval 结果全部无效）+
    7 个 eval 因 fork 崩溃也浪费了时间。
  fix: 修改 HISTORY_LENGTH 为 50 或去掉截断逻辑，验证后重跑全部 11 个 checkpoint。
  related_decisions:
  - D123
- id: M050
  date: '2026-05-22'
  category: agent_behavior
  severity: high
  summary: Worker kill-all 误杀唯一在跑的 SFT baseline eval + 重启失败（未激活 conda），westd 4 GPU
    全空闲 >2.5h
  root_cause: 1) Worker 执行 kill-all 时未区分"正常运行"和"卡死/崩溃"的进程，误杀了 GPU 0 上运行了 >1h 的 SFT
    baseline eval。2) 重启命令使用裸 `python` 而非 `/root/miniconda3/bin/python`，westd aml-train
    镜像的 python 在 conda 环境中，裸 `python` 不在 PATH。
  prevention: 1) Kill 进程前必须先 `nvidia-smi` 确认哪些 GPU 有活跃计算（compute >0%），只 kill compute=0%
    且卡死的进程。2) aml-train 镜像上所有 nohup 命令必须用 `nohup bash -c "source /root/miniconda3/etc/profile.d/conda.sh
    && conda activate base && ..."` 格式。3) Director 指令中明确列出"不要 kill"的进程 PID。
  status: active
  context: SFT baseline eval 已运行 >1h（134 OOD episodes），被误杀后进度全丢。随后重启因 conda 未激活全部失败。westd
    4×95GB GPU 空闲 >2.5h，Table 1 eval batch 进度归零。
  related_decisions:
  - D123

- id: M010
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: exp029_seed2 在 bjb1 上 8+ 次 OOM 失败，浪费大量 GPU 时间
  root_cause: Episode-level 训练（full context）的内存需求随 episode 长度变化。seed2 (seed=43) 生成更长
    episode，即使多次降低 token_len/batch_size/开启 gradient_checkpointing/关闭 optimizer_offload，仍超出
    bjb1 2×98GB 的容量。seed1 恰好在 OOM 边缘完成，给了错误的"bjb1 够用"信号。
  prevention: Episode-level 训练的内存需求不可预测（取决于 rollout 长度分布）。应在分配前做 dry-run 1-2 step
    确认峰值显存。不同 seed 的 rollout 长度分布可能差异很大，不能假设 seed1 能跑 = seed2 也能跑。对于内存敏感的实验，优先分配到显存最大的服务器。
  status: active
  context: exp029_seed2 从 OOM → token_len 降低 → gradient_checkpointing → optimizer_offload
    fix → 存储 I/O crash → resume OOM，累计 8+ 次失败。最终决定转移到 westd 执行。
  fix: 止损：停止在 bjb1 上尝试，等 westd GPU 释放后转移执行。bjb1 转部署内存需求更低的 step_independent h-sweep
    实验。
  related_decisions:
  - D069
  - D075

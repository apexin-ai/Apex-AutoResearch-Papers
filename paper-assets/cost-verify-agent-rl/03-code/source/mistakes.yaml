    添加 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
- id: M020
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: FSDP 2GPU vs 4GPU 导致 eval 结果差 28pp，跨服务器/GPU 配置的 eval 数字不可直接比较
  root_cause: FSDP 不同 GPU 数量下模型分片方式不同，bf16 浮点精度差异积累，或 vLLM tensor parallel 行为差异。bjb1
    2GPU T=0 = 68.75% vs westd 4GPU T=0.4 = 40.625%，同一 checkpoint 差 28pp。
  prevention: 论文中所有 eval 对比必须在同一服务器、同一 GPU 数量配置下进行。跨服务器数字不能直接比较。如需跨服务器验证，两边都要跑完整的
    control + experimental eval。报告 eval 结果时标注服务器和 GPU 配置。
  status: active
  context: '8B SFT checkpoint-231: bjb1 2GPU 68.75-71.875%, westd 4GPU 40.625%。T=0
    vs T=1.0 同服务器仅差 3.125pp (1 task)，确认不是采样噪声。'
- id: M021
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: Cell C v2 OOM：ppo_max_token_len_per_gpu 降低无效，瓶颈是 ppo_mini_batch_size
  root_cause: ppo_max_token_len_per_gpu 32768→16384 对 backward 峰值显存无影响（v1 和 v2 的 OOM
    数字完全一致：118.48 GiB allocated, 需要 98.7 GiB, 卡 95 GiB）。实际瓶颈是 ppo_mini_batch_size=16
    导致 backward 时同时处理 16 个长序列的激活值超出显存。
  prevention: FSDP full-context 训练 OOM 时，先判断是 total tokens 还是 per-batch 序列数的问题：如果降
    token_len 无效（OOM 数字不变），说明瓶颈在 mini_batch_size。8B full-context (avg 2000+ tokens)
    在 96GB GPU 上建议 ppo_mini_batch_size ≤ 4。
  status: active
  fix: ppo_mini_batch_size 16→4

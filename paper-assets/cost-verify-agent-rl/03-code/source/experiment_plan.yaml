- id: plan_017
  title: Discount factor γ-sweep (dual mechanism separation)
  claim: Claim 1
  phase: A+
  priority: P0
  depends_on:
  - plan_001
  registry_id: gsweep_g050_h5_seed1
  status: running
  notes_extra: g050 killed (collapsed). g080 RUNNING on westd cuda:2,3. g095/g100
    pending.
  description: 'Sweep discount factor γ ∈ {0.5, 0.8, 0.95, 1.0} with fixed h=5, step_independent
    mode, 15 steps each. Separates two mechanisms: (1) magnitude decay (γ^k attenuation)
    vs (2) sign misattribution (advantage sign determined by episode outcome). γ=1.0
    eliminates magnitude decay; if collapse persists, sign misattribution is the root
    cause. KEY paper evidence for dual mechanism separation.

    '
  hypothesis: 'γ=1.0 eliminates magnitude decay but step_independent still collapses,
    proving sign misattribution is the root cause rather than γ^k decay. Lower γ values
    show accelerated collapse due to compounded magnitude attenuation.

    '
  metrics:
  - success_rate_per_gamma
  - collapse_onset_step
  - magnitude_decay_vs_sign_effect
  gpu_hours_estimate: 40
  notes: '4 γ values × 15 steps. γ=0.5 running (gsweep_g050_h5_seed1). Remaining:
    gsweep_g080_h5_seed1, gsweep_g095_h5_seed1, gsweep_g100_h5_seed1 pre-registered.'
- id: plan_018
  title: 'Factorial mechanism separation: truncated-obs + episode-level advantage'
  claim: Claim 1
  phase: A+
  priority: P0
  depends_on:
  - plan_001
  registry_id: factorial_h2_episodeadv_seed1
  status: done
  conclusion: success
  description: 'CRITICAL experiment requested by ALL 3 Dream review tiers. 2×2 factorial
    design to isolate information loss from sign misattribution. Configuration: step_independent
    GENERATION (h=2 observation window, model only sees 2 steps of history during
    rollout) BUT episode-level ADVANTAGE computation (all windows in same episode
    share one GRPO advantage = normalized episode return). This means the model still
    has limited observation (information loss present) but credit assignment is correct
    (sign misattribution eliminated). Outcome interpretation: (A) if still collapses
    → information loss is dominant (model cannot plan with limited visibility regardless
    of credit quality); (B) if succeeds → sign misattribution was dominant (correct
    credit enables learning even with limited observation). May require small code
    modification in RAGEN: compute_step_discounted_returns() needs a mode that assigns
    episode return to all windows uniformly instead of per-window γ-discounted returns.'
  hypothesis: Truncated observation (h=2) + episode-level advantage isolates the two
    mechanisms. If collapse persists, information loss is primary. If performance
    improves significantly over standard step_independent h=2 (currently 0%), sign
    misattribution is primary.
  metrics:
  - success_rate
  - collapse_onset_step
  - comparison_vs_step_independent_h2
  - comparison_vs_episode_level_full
  gpu_hours_estimate: 24
  notes: 'Dream consensus: this is THE most critical missing experiment. All 3 tiers
    (best/median/worst) independently flagged the absence of factorial mechanism separation
    as a critical weakness. Also serves to resolve the r=0.640 diagnostic question.'

# exp026 Config Template (Step-Independent GRPO for ALFWorld)
#
# 基于 exp026 已验证配置提取的可复用模板。
# Phase A MVP 的 reference config。
#
# 使用方式：
#   复制此文件到 RAGEN/config/ 并根据实验需求修改标注 [TUNE] 的参数
#   python RAGEN/main_task.py --config-name=<your_config_name>

defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

# ── 模型 ──
# [SET] 训练起点 checkpoint
model_path: /root/autodl-tmp/checkpoints/qwen3_exp021_ragen_sft_v4

# ── GPU ──
system:
  CUDA_VISIBLE_DEVICES: "0,1"     # C001: 限定 cuda:0, cuda:1

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 32

# ── Trainer ──
trainer:
  project_name: cost-verify-agent-rl
  experiment_name: <EXPERIMENT_NAME>          # [SET] 每次实验唯一命名
  total_training_steps: 150                   # [TUNE] 总训练步数
  n_gpus_per_node: 2
  val_before_train: True                      # 训练前先 eval baseline
  test_freq: 5                                # [TUNE] eval 频率
  save_freq: 25                               # checkpoint 保存频率
  local_log_dir: "/root/autodl-tmp/checkpoints/<EXPERIMENT_NAME>/"    # [SET]
  default_local_dir: "/root/autodl-tmp/checkpoints/<EXPERIMENT_NAME>/"
  logger: ['console', 'wandb']                # exp026 教训：必须启用 wandb
  max_actor_ckpt_to_keep: 3
  resume_mode: "disable"                      # "disable" | "auto"

# ── Actor / Rollout / Ref ──
actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa               # 比 flash_attn 兼容性好

  actor:
    use_ref: True
    use_torch_compile: False
    use_kl_loss: True
    kl_loss_coef: 0.01            # [TUNE] verl-agent 默认; exp022-24 用 0.5 太保守
    kl_loss_type: low_var_kl      # k3 estimator; 比 kl (k1) 更稳定
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: "seq-mean-token-mean"  # GRPO 标准聚合
    grad_clip: 1.0
    optim:
      lr: 1e-6                    # [TUNE] verl-agent 默认; 5e-7 也可

  ref:
    use_torch_compile: False

  rollout:
    response_length: 1024         # 单 turn response 最大长度
    gpu_memory_utilization: 0.4   # 2-GPU TP 时保守设置
    max_model_len: 8192           # 总 context 长度
    temperature: 1.0              # 训练时 T=1 exploration
    max_num_batched_tokens: 8192
    enforce_eager: True
    val_kwargs:
      do_sample: True
      temperature: 0.4            # [TUNE] eval 时 T=0.3~0.6

# ── Algorithm ──
algorithm:
  adv_estimator: grpo
  gamma: 0.95                     # [TUNE] step-level discount
  high_level_gamma: 0.95          # [TUNE] 通常与 gamma 一致
  norm_adv_by_std_in_grpo: True

# ── Agent Proxy (Step-Independent Context) ──
agent_proxy:
  context_window_mode: "step_independent"     # exp026 核心创新
  max_context_window: 5
  step_independent_history_length: 5          # [TUNE] bounded history = 3/5/10
  max_turn: 50                                # 与 verl-agent max_steps=50 对齐
  max_actions_per_turn: 1
  max_prompt_length: 4096
  use_turn_scores: True                       # step-level rewards

# ── Collapse Detection ──
collapse_detection:
  multi_turn_enabled: false

# ── Environment ──
es_manager:
  format_penalty: 0               # exp026 不用 format penalty

  train:
    env_groups: 4                 # [TUNE] 并行环境组数
    group_size: 16                # [TUNE] 每组 rollout 数
    env_configs:
      tags: ["AlfworldSG"]        # Phase A: AlfworldSG; Phase B: AlfworldBIAVR
      n_groups: [4]

  val:
    env_groups: 16                # C003: >=16 episodes for eval
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [16]

# ── Phase B 扩展（取消注释以启用 B-IAVR） ──
# biavr:
#   beta: 0.3           # 目标 verification rate
#   alpha: 1.0           # action_changed reward weight
#   lambda_init: 0.0     # 初始 Lagrangian 乘子
#   eta: 0.01            # dual variable learning rate
#   enable_a_pre: true   # 计算 a_pre counterfactual

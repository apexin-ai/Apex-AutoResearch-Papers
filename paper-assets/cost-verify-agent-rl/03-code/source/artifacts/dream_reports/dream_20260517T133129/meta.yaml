      all_seeds_show_cliff_below_h10: true
    result_rationale: 'h-sweep 结果由双机制共同决定：(1) Information loss — h=2 的 2-step context
      窗口完全无法 编码跨步策略（如 "先开冰箱再放东西"），模型只能做 reactive single-step 决策。h=5 稍好但 仍不足以覆盖 ALFWorld
      平均 ~25 步的关键策略跨度。h=10 开始捕获部分多步依赖。h=20 覆盖 大部分策略所需上下文。(2) Sign misattribution —
      h 越小，独立优化的 window 越多 （T/h 个），sign misattribution 影响越大。h=2 产生 ~12 个独立 window，每个
      window 的 advantage 符号完全由 episode outcome 决定而非 window-local action quality。h=10
      产生 ~2-3 个 window，misattribution 仍存在但影响较小。h=full 完全消除 window 间 sign 问题。Cliff
      在 h=10 附近是因为这是两个机制 jointly 从 "勉强可学" 转为 "不可学" 的 临界点。已有 hsweep_h2_seed1 数据验证 h=2
      collapse 模式（step3→4 onset，step9 归零）， 3-seed 复现确认非 outlier。

      '

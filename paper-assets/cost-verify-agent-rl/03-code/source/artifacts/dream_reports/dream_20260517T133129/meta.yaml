  - name: Credit assignment mechanism empirical verification (paper Figure 2)
    plan_id: plan_004
    description: 'Per-window advantage logging 实证验证 sign misattribution 机制。 从 h=2
      seed 2 收集 advantage 数据并分析 sign-outcome correlation。

      '
    expected_results:
      sign_vs_outcome_correlation: 0.97

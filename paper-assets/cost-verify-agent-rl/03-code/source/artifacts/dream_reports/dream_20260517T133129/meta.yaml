      bad_window_in_success_positive_pct: 0.95
      n_episodes_analyzed: 128
      n_windows_analyzed: 1536
    result_rationale: 'Sign misattribution 的 correlation 结构由 RAGEN 的 step_independent
      实现直接决定。 代码路径 agent_trainer.py:271-340 中，每个 window 的 return 由 compute_step_discounted_returns()
      计算：return_w = Σ_{t=w}^{T} γ^(t-w) * r_t。 由于 ALFWorld 是 sparse binary reward（只有
      episode 最后一步有 +10 或 0）， 所有 window 的 return 只取决于 episode 是否成功。成功 episode：return_w
      = γ^(T-w) * 10 > 0（所有 window 正），失败 episode：return_w = 0（经 GRPO group normalization
      后 变为负 advantage）。因此 advantage sign 与 episode outcome 的 correlation 接近 1.0 （0.97
      而非 1.0 是因为 GRPO normalization 中偶有 group 全成功或全失败的 edge case）。 Sign 与 local action
      quality 的 correlation 接近 0（0.04）是因为 advantage sign 完全由 episode outcome 决定，与
      window 内 action 质量无关——好 window 坏 window 在同一 episode 内获得相同符号的 advantage。γ^k decay
      的 R²=0.92 反映 magnitude 随 window 位置的指数衰减（早期 window 信号更弱）。Episode-level 模式下所有
      token 共享一个 advantage（sign variance = 0, magnitude CV = 0），没有 position-dependent
      distortion。

      '

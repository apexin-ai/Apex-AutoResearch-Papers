      下的 gaming 机制截然不同。在 exp013f（step-independent）中，model 优化的是每个独立 window 的 per-step
      reward，所以累积的 valid_action_bonus（~4.5 over 50 steps） 主导了 learning signal，model
      学会 "总是输出有效但无用的动作" 来最大化 bonus。 在 episode-level 下，model 优化的是整条 trajectory 的 total
      reward（success=10 + Σvalid_bonus）。关键差异：GRPO 的 advantage 是 group-normalized 的，所以所有
      trajectory 都有相似的 valid_bonus 总量（因为 action count 大致相同），advantage 的区分度主要来自 success
      reward（有/无 10 分的差异远大于 valid_bonus 的微小变化）。 因此 model 被引导向 success 方向学习，同时 valid_action_bonus
      作为 exploration shaping 帮助 model 避免输出无效动作（从 55%→82%），间接提升 success（有效动作 是成功的前提）。36%

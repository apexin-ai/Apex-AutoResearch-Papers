    # Dream Review Report: "Why Step-Independent RL Fails for LLM Multi-Turn Agents:
    Dual Mechanism Analysis"


    **Review Mode**: Full (2 Reviewers, complete roundtable)

    **Date**: 2026-05-17


    ---


    ## Panel Summary


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 4/6 (Weak Accept) | 4/5 |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 4/5 |

    | **Consensus** | — | **3/6 (Weak Reject)** | **4/5** |


    ---


    ## Paper Overview


    The paper diagnoses why step-independent GRPO training catastrophically fails
    for multi-turn LLM agents on ALFWorld. It identifies a dual mechanism: (1) policy
    information loss from truncated context windows and (2) advantage sign misattribution,
    where per-window advantage signs are dominated by episode outcome (r=0.87) rather
    than local action quality (r=0.14). Episode-level GRPO is proposed as a "necessary
    minimum" fix (34.4% ±4.8%), with GAE(λ=0.95) providing an additional 12.5pp through
    finer per-token credit. Experiments include a context-window sweep (h∈{2,5,10,20,full},
    3 seeds each), 5-seed replication, per-task-type analysis (r=-0.82 with episode
    length), and preliminary selective verification results.


    ---


    ## Consensus Strengths


    1. **The sign attribution analysis is the paper''s strongest and most novel empirical
    result.** The r=0.87 (sign-vs-outcome) vs r=0.14 (sign-vs-local-quality) finding,
    supported by 256 episodes and 3200 windows, with 92% all-positive advantages in
    success episodes and 89% all-negative in failure episodes, provides concrete mechanistic
    quantification rare in the agent RL literature.


    2. **The h-sweep ablation is well-designed and informative.** Five context-window
    values with three seeds each reveals clear monotonic degradation with a seed-dependent
    transition zone at h≈5-10. This is a model for systematic ablation design.


    3. **Multi-seed replication is adequate for the core claim.** Five seeds with
    95% CI [28.4%, 40.4%] convincingly establishes that episode-level training is
    qualitatively superior to step-independent (≤1%), even at the CI lower bound.


    4. **The paper is clearly written with a logical narrative.** Tables are clean
    and informative. The "necessary minimum" vs "sufficient improvement" framing is
    intellectually honest. The diagnostic paper positioning is appropriate.


    5. **The per-task-type analysis (r=-0.82 with episode length) provides internal
    mechanistic validation**, showing that longer-horizon tasks suffer more severe
    step-independent failure, consistent with the sign misattribution mechanism.


    ---


    ## Consensus Weaknesses (Ranked by Severity)


    ### Critical


    **W1. No factorial mechanism separation.** (Both R1 and R2)

    The paper''s central claim is a "dual mechanism," but information loss and sign
    misattribution are never experimentally isolated. The h-sweep varies both context
    window size (affecting information loss) and the number of independently-optimized
    windows (affecting sign misattribution) simultaneously. A 2×2 factorial design
    — {full context, truncated context} × {episode advantage, per-window advantage}
    — is needed. Without this, the "dual mechanism" is a theoretical decomposition,
    not an empirically validated causal attribution. The relative contribution of
    each mechanism remains unknown.


    **W2. Single environment, single model scale.** (Both R1 and R2)

    All experiments use ALFWorld with Qwen2.5-1.5B. The paper claims to identify general
    mechanisms for "multi-turn LLM agents," but generality is not tested. The per-task-type
    analysis provides within-environment diversity across episode lengths but does
    not substitute for cross-environment validation (e.g., ScienceWorld, WebShop).
    The absence of scaling experiments (7B+) leaves open whether the mechanism is
    model-capacity-dependent: if larger models partially compensate via stronger in-context
    learning, the "necessary" claim weakens.


    ### Major


    **W3. SOTA gap undermines practical relevance.** (R2, partially acknowledged by
    R1)

    GAGPO achieves 93.5% on ALFWorld at the same scale (1.5B); HiPER achieves 97.4%
    at 7B. These methods implicitly solve sign misattribution through finer credit
    assignment. The paper diagnoses why a 34.4% method fails relative to a 1% method,
    but does not demonstrate that this diagnosis yields insights applicable to improving
    the 93%+ methods. The "diagnostic contribution" framing is valid in principle
    but requires stronger justification for why the community should invest attention
    in understanding this specific failure mode when effective solutions already exist.


    **W4. GAE comparison at fixed step count, not convergence.** (R1, supported by
    R2)

    Comparing episode-level GRPO (28.1%) and GAE(0.95) (40.6%) at step 15 conflates
    training speed with asymptotic performance. Table 4 shows episode-level GRPO continues
    improving past step 15 (reaching 34.4% at step 30). If GAE also continues improving,
    the 12.5pp gap may widen or narrow at convergence. This leaves the core "necessary
    minimum vs sufficient improvement" decomposition quantitatively uncertain.


    **W5. No comparison with Turn-PPO.** (R2)

    The paper positions extensively against Turn-PPO in the Discussion (claiming sign
    misattribution is a "superset" of uniform advantage) but provides no empirical
    comparison. Turn-PPO''s turn-level value function likely also eliminates sign
    misattribution while providing finer credit. Without this comparison, the contrarian
    "coarser suffices" positioning is incomplete.


    ### Moderate


    **W6. Limited novelty beyond Turn-PPO.** (R2)

    The conceptual jump from Turn-PPO''s "uniform advantage" to this paper''s "sign
    misattribution" is incremental. Under binary rewards, the advantage sign mapping
    to episode outcome follows directly from the GRPO formulation. The quantification
    (r=0.87, r=0.14) adds empirical grounding, but the underlying insight is accessible
    through first principles. The contribution is better characterized as systematic
    empirical verification of a predictable phenomenon.


    **W7. Local action quality proxy is coarse.** (R1)

    The r=0.14 sign-vs-quality correlation uses action validity (syntactic correctness)
    as a proxy for action quality (strategic value). A syntactically valid action
    that navigates to the wrong room is "valid" but poor quality. If a task-progress-based
    proxy were used, the correlation might increase, potentially weakening the sign
    misattribution claim. The paper does not discuss this limitation or test sensitivity
    to the proxy choice.


    **W8. Selective verification section is premature.** (Both R1 and R2)

    B-IAVR achieves only 28% verification reduction with 3.1pp success cost, does
    not dominate the Pareto frontier, and the action-change reward signal loses significance
    after entropy correction (partial r=0.08, p=0.12). Section 6 occupies a full page
    without strengthening the core contribution. It should be removed or reduced to
    2-3 sentences in Future Work.


    **W9. Credit assignment related work is thin.** (R2)

    For a paper whose core contribution concerns credit assignment, citing a single
    survey is insufficient. Missing references include COMA (Foerster et al., 2018),
    QMIX (Rashid et al., 2018), difference rewards, and other foundational temporal/multi-agent
    credit assignment work.


    ### Minor


    **W10. "Catastrophic" language overstates h-sweep findings.** (R1)

    Only h=2 shows near-zero performance. h=5 achieves 7.3%, h=10 achieves 16.7%.
    The Abstract and Introduction use "catastrophically fails" language that is only
    justified for h=2 specifically.


    **W11. No formal significance tests.** (R1)

    Means and standard deviations are reported but no hypothesis tests for key comparisons.
    The per-task correlation (r=-0.82, n=6) has p≈0.045, barely significant and should
    be noted.


    **W12. Small validation set (32 episodes).** (R1)

    3.125% resolution per episode limits precision for fine-grained comparisons. Many
    reported differences (e.g., 3.1pp) correspond to a single additional episode succeeding
    or failing.


    ---


    ## Key Questions for Authors


    1. **Mechanism separation**: Can you provide a factorial experiment (episode-level
    advantage with truncated context, full-context with per-window advantage) to quantify
    the relative contribution of each mechanism?


    2. **Turn-PPO comparison**: How does Turn-PPO''s turn-level value function perform
    on ALFWorld? If it eliminates sign misattribution while providing finer credit,
    is not episode-level GRPO dominated?


    3. **GAE at convergence**: What is GAE(0.95)''s converged performance? Does the
    12.5pp gap persist, widen, or narrow?


    4. **Generality**: Have you attempted any verification beyond ALFWorld? The mechanism
    prediction (severity scales with episode length and 1-p) is testable on other
    environments.


    5. **GAGPO reconciliation**: GAGPO achieves 93.5% at the same model scale. Is
    this gap attributable to finer credit assignment, longer training, different initialization,
    or recipe differences? This comparison is critical for positioning.


    ---


    ## Consensus Score Justification


    **Score: 3/6 (Weak Reject)**


    The paper identifies a real failure mode (advantage sign misattribution in step-independent
    training) and provides systematic empirical evidence (sign attribution analysis,
    h-sweep, multi-seed replication). These are genuine contributions.


    However, three structural problems prevent acceptance at a top ML venue:


    1. The "dual mechanism" central claim is not experimentally validated as two separate
    mechanisms (no factorial design).

    2. Single-environment, single-scale evidence cannot support the general claims
    made.

    3. The practical relevance is limited given that existing methods (GAGPO, HiPER)
    already achieve 93-97% on the same benchmark, implicitly solving the diagnosed
    problem.


    The paper reads as a solid workshop contribution or a foundation for a stronger
    full paper. With the factorial experiment, one additional environment, GAE convergence
    data, and a Turn-PPO comparison, it could reach the acceptance threshold.


    ---


    ## Revision Recommendations (Priority Order)


    1. **Run the factorial experiment** (2×2: context × advantage level) to separate
    the two mechanisms

    2. **Add at least one more environment** (ScienceWorld or WebShop) for generality

    3. **Run GAE to convergence** and report converged performance for all methods

    4. **Add Turn-PPO comparison** on ALFWorld

    5. **Remove or drastically shorten Section 6** (selective verification)

    6. **Expand credit assignment related work** (COMA, QMIX, difference rewards)

    7. **Test sensitivity to the local quality proxy** (replace action validity with
    a task-progress measure)

    8. **Moderate language**: use "catastrophic" only for h=2; use "severe degradation"
    for h=5-10'

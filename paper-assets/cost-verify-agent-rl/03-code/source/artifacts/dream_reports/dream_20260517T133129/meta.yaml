      high/low quality points 混合分布在每侧（证明 sign 与 quality 无关）。'
    - 'Fig 2b (paper Figure 2 right): Advantage magnitude vs window position (in success
      episodes)，展示 γ^k 指数衰减拟合线（R²=0.92）。'
    - 'Fig 2c: Episode-level control — 所有 token 的 advantage 值相同（水平线），无 position/sign
      variation。'
    analysis: '这是 paper 的理论核心 figure。三个 panel 分别证明：(a) advantage sign 由 episode outcome
      决定（sign misattribution，r=0.97），(b) magnitude 按 γ^k 衰减 （information loss 的辅助效应，R²=0.92），(c)
      episode-level 完全消除两者。 Sign misattribution 是 "方向错误"（好 action 被惩罚、坏 action 被奖励），
      比 magnitude decay（"信号弱"）更致命——这解释了为什么 h=2 catastrophically collapses 而非只是 "学得慢"。

      '

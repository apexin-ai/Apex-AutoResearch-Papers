      total_training_hours: 22
    result_rationale: '当前 train success（43.75%）大幅领先 val success（28.125%），说明模型已学到有效策略
      但尚未充分泛化。这个 train-val gap 的缩小是 RL 训练的典型模式：早期策略过拟合训练任务 分布，随着 entropy 逐渐降低和 policy
      稳定，模型学到更通用的行动模式（如 "先探索容器再 去目标位置" 的跨任务策略）。Step 15→30 是加速期（policy 从探索转向利用），step
      30→50 进入收敛区。Val success 从 28%→48% 的跃升源于 episode-level 训练消除了 sign misattribution——正确的梯度方向保证了训练信号持续积累而非在好坏
      window 间相互抵消。 Action_is_valid 从 55%→72% 的改善是 success 提升的副产品（成功 trajectory 自然包含
      更多有效动作）。最终 48% 而非更高，因为 Qwen3-1.7B 的基础能力限制了 ceiling （pass@8=0.96 说明潜力在 ~50% 左右）。

      '

      信息（而非 per-token credit assignment）是多轮 agent RL 成功的核心要素。 这直接挑战 "越细越好" 的社区假设——Turn-PPO、GAGPO、iStar
      都投入复杂机制做 finer credit，但我们的证据表明在 sparse reward 多轮设定下，这些复杂性是不必要的。 GRPO 的简洁性（无
      critic、无 value function）反而是优势。

      '

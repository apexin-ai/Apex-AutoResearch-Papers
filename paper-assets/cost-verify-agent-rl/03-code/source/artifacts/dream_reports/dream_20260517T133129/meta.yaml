  - name: GAE baseline comparison
    plan_id: plan_003b
    description: 'GAE(λ=0.95, γ=1.0) 和 GAE(λ=1.0, γ=1.0) 在 RAGEN 中实现。 15 steps × 3
      seeds each。与 episode-level GRPO 对比。

      '
    expected_results:
      gae_095_mean_step15_success: 0.36
      gae_095_std: 0.04
      gae_100_mean_step15_success: 0.39
      gae_100_std: 0.04
      episode_grpo_mean_step15_success: 0.38
      episode_grpo_std: 0.03
      gae_095_vs_episode_delta_pp: -2.0
      gae_100_vs_episode_delta_pp: 1.0
      both_far_exceed_step_independent: true
      step_independent_h2_step15_success: 0.02
    result_rationale: 'GAE 与 episode-level GRPO 持平（delta < 5pp）是 best 档的关键预测，因为它直接
      支持 contrarian positioning：更精细的 per-token credit assignment（GAE 提供） 并不比更粗的 episode-level
      credit（GRPO 提供）更好。机制解释：(1) GAE(λ=1,γ=1) 在极限下等价于 Monte Carlo return + baseline
      subtraction，与 episode-level GRPO 的 group-normalized advantage 在信息量上相近——两者都使用完整
      episode return， 差异仅在 advantage 计算方式（GAE 用 learned value function, GRPO 用 group
      statistics）。 (2) GAE(λ=0.95) 引入了 temporal discounting 的 bias（偏向近期 reward）， 在
      sparse binary reward（只有 episode end 有 reward）下这个 bias 没有帮助反而 略微损害性能。(3) Critic
      head 的 estimation error（尤其是训练早期 value function 不准确时）引入 noise，抵消了 per-token credit
      的理论优势。(4) 关键是：GAE 和 episode-level GRPO 都解决了 sign misattribution（因为都使用 episode-level
      return）， 所以两者都远超 step-independent。性能差异只反映 credit assignment granularity 的 边际价值，在
      sparse reward 设定下这个边际很小。

      '

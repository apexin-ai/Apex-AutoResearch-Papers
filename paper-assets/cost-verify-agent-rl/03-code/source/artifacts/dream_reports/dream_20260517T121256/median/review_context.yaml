    strong claim。Paper 需要 reframe：episode-level 是 zero-cost fix（无需 critic 实现），GAE
    是 upper bound 但需要额外 engineering（critic head + training stability）。Diagnostic 贡献不受影响——两者都远超
    step-independent，证明 dual mechanism 是真正的 failure mode。

    - - step-independent (h=10)
      - 9%
      - 2.3x
    - - episode-level GRPO
      - 18%
      - 4.5x
  figures_description:
  - 'Figure: Learning curves for episode-level vs step-independent on ScienceWorld.
    Slower convergence but same qualitative pattern as ALFWorld.'
  analysis: 'Supports generalization: dual mechanism failure is not ALFWorld-specific.
    But low absolute numbers (18%) limit the impact claim. Paper can use this as ''consistent
    across environments'' evidence for Claim 1 diagnostic.'
- name: 7B model scaling verification
  plan_id: plan_015
  description: Episode-level vs step-independent on Qwen3-7B
  expected_results:
    episode_7b_success: 0.42
    step_ind_7b_success: 0.08
    improvement_ratio: 5.25
    episode_7b_vs_1.7b_delta: 10
    step_ind_7b_vs_1.7b_delta: 5
  result_rationale: 'Median 档下 7B 模型 episode-level 达到 42%（vs 1.7B 的 32%），step-independent
    仍 collapse 到 8%（vs 1.7B 的 3%，7B 有更好 base capabilities 所以 collapse 后仍保留一些）。Episode-level
    的 10pp 提升来自 larger model 的 better base reasoning/planning。Step-independent 的 slight
    improvement（8% vs 3%）因为 7B 在短 window 内也能做更好的 local decisions，但 sign misattribution
    仍然阻止真正的 improvement。Key finding: scaling 不能 fix step-independent 的 structural
    problem（8% 仍远低于 episode-level 的 42%）。'
  tables:

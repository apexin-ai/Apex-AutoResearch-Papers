  figures_description:
  - 'Figure: Three scatter plots (one per entropy stratum) showing action-change vs
    episode success. Regression lines with CI bands.'
  analysis: 'Signal exists but is weak and barely significant. Defense against ''action
    change = noise'' is partial: can say ''signal persists after entropy control''
    but effect size is small. Honest paper would acknowledge this as limitation and
    position action-change as ''best available proxy'' rather than ''validated signal''.'
- name: 'Causal intervention: random vs verification-triggered changes'
  plan_id: plan_011
  description: Inject random action changes vs verification-triggered, compare success
  expected_results:
    verification_triggered_success: 0.32
    random_triggered_success: 0.24
    no_change_baseline_success: 0.28
    delta_triggered_vs_random: 8
    delta_triggered_vs_nochange: 4
  result_rationale: 'Median 档下 verification-triggered changes 比 random changes 好 8pp。原因：verification
    过程给 model 额外 context（重新审视 state），使得 change 更 informed。但 delta 只有 8pp 而非 15+pp（strong
    档），因为：(1) 30% success agent 的 verification quality 中等（不是所有 verification-triggered
    change 都是 correct），(2) random change 有时碰巧也有用（ALFWorld action space 有限，random valid
    action 有 non-trivial hit rate），(3) ''no change baseline'' 成功率 28% 意味着很多 episodes
    不需要 correction 就能 succeed/fail。Interesting finding: triggered > no-change > random?
    No — triggered > no-change, random < no-change. Random changes 实际上 hurt（从 28%
    → 24%），verification-triggered 才是 helpful。'
  tables:
  - title: Causal intervention results
    columns:
    - condition
    - success_rate
    - n_episodes
    - vs_baseline
    rows:
    - - verification-triggered change
      - 32%
      - '200'
      - +4pp
    - - no change (baseline)
      - 28%
      - '200'
      - —
    - - random change (same rate)
      - 24%
      - '200'
      - -4pp
  figures_description:
  - 'Figure: Bar chart with confidence intervals. Verification-triggered > baseline
    > random. Stars for significance.'
  analysis: Provides causal evidence that verification adds value (not just noise).
    But effect size moderate (+4pp vs baseline, +8pp vs random). Combined with entropy
    analysis, forms a 'converging evidence' argument for action-change being a real
    signal, even if weak individually.
- name: Reward signal ablation
  plan_id: plan_012
  description: B-IAVR with action-change vs random-trigger vs confidence-based reward
  expected_results:
    action_change_success: 0.27
    action_change_verify_rate: 0.68
    random_trigger_success: 0.25
    random_trigger_verify_rate: 0.62
    confidence_reward_success: 0.24
    confidence_verify_rate: 0.7
  result_rationale: Median 档下 action-change reward 优于 alternatives 但 margin 小。Action-change
    (27%, verify 68%) vs random-trigger (25%, verify 62%) delta = 2pp success, +6pp
    verify rate。原因：(1) random trigger reward 无 informative signal，模型学到的 verify 策略接近
    uniform random，(2) confidence-based reward 在 1.7B model 上不好估计（model 的 logit calibration
    差，confidence 不 correlate well with actual uncertainty），(3) action-change 虽然 noisy
    但至少有 partial signal（r=0.11）。Margin 小因为 base signal 本身弱——在 strong 档下差异会更明显。
  tables:
  - title: Reward signal comparison
    columns:
    - reward_type
    - success
    - verify_rate
    - cost_reduction
    - training_stability
    rows:
    - - action-change (ours)
      - 27%
      - 68%
      - 28%
      - moderate (converges step 40)
    - - random trigger
      - 25%
      - 62%
      - 35%
      - unstable (high variance)
    - - confidence-based
      - 24%
      - 70%
      - 26%
      - slow convergence
  figures_description: []
  analysis: Action-change is best but advantage is modest (2-3pp). Paper can claim
    'action-change outperforms baselines' but the weak margin means a reviewer could
    argue the differences are within noise. Need to frame carefully with error bars
    and multiple seeds.
- name: ARES reproduction + comparison
  plan_id: plan_013
  description: Reproduce ARES SFT router on ALFWorld, head-to-head with B-IAVR
  expected_results:
    ares_success: 0.26
    ares_verify_rate: 0.58
    ares_cost_reduction: 0.38
    biavr_success: 0.27
    biavr_verify_rate: 0.68
    biavr_cost_reduction: 0.28
    delta_success: 1
    delta_cost: -10
  result_rationale: ARES 使用 SFT router（从 oracle labels 学 when to verify），在 cost reduction
    上优于 B-IAVR（38% vs 28%）但 success 相近（26% vs 27%）。原因：(1) SFT 有 direct supervision
    signal（teacher-labeled 'should verify here'），训练更 clean，(2) 但 SFT labels 是 frozen（从一个
    checkpoint 生成），不 adapt to policy improvement，所以 success 不如 RL-trained 的 B-IAVR，(3)
    ARES 的 continuous effort allocation 在 ALFWorld binary 场景中退化为 threshold，效果有限。Head-to-head
    中 B-IAVR 不 clearly dominate ARES — 不同 trade-off point。这削弱了 'B-IAVR dominates'
    的 claim。
  tables:
  - title: ARES vs B-IAVR head-to-head
    columns:
    - method
    - success
    - verify_rate
    - cost_reduction
    - training_data_needed
    rows:
    - - ARES (SFT router)
      - 26%
      - 58%
      - 38%
      - oracle labels required
    - - B-IAVR (RL)
      - 27%
      - 68%
      - 28%
      - no labels (self-supervised)
    - - always-on
      - 31%
      - 100%
      - 0%
      - —
  figures_description:
  - 'Figure: Pareto plot with ARES and B-IAVR as labeled points. Neither dominates
    the other — ARES better on cost, B-IAVR better on success.'
  analysis: ARES comparison doesn't favor our method on cost reduction. Differentiation
    must come from methodology (no oracle labels needed, RL-based adaptation) rather
    than performance numbers. Paper should frame as 'comparable performance without
    supervision' rather than 'superior performance'.
- name: ScienceWorld transfer
  plan_id: plan_014
  description: Episode-level vs step-independent on ScienceWorld environment
  expected_results:
    episode_level_success: 0.18
    step_independent_success: 0.04
    improvement_ratio: 4.5
    episode_level_std: 0.05
    convergence_slower: true
    steps_to_plateau: 25
  result_rationale: Median 档下 transfer 到 ScienceWorld 仍显示 episode-level 优势（4.5x）但
    absolute performance 较低（18% vs ALFWorld 的 30%）。原因：(1) ScienceWorld 比 ALFWorld
    更复杂（更长 episode、更大 action space、partial observability），(2) 1.7B 模型在 science reasoning
    上能力有限，(3) step-independent 在更长 horizon（ScienceWorld 40-50 步）下崩溃更严重（4% vs ALFWorld
    的 3%），(4) 收敛更慢因为 reward 更 sparse。Results 支持 generalization claim 但 18% absolute
    performance 不算 impressive。
  tables:

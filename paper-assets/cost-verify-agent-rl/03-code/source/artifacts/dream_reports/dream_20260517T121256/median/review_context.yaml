- name: GAE baseline comparison
  plan_id: plan_003b
  description: GAE(λ=0.95,γ=1.0) 和 GAE(λ=1.0,γ=1.0) vs episode-level GRPO, 15 steps
    × 3 seeds
  expected_results:
    gae_095_mean_success: 0.4
    gae_095_std: 0.05
    gae_100_mean_success: 0.37
    gae_100_std: 0.04
    episode_grpo_mean_success: 0.32
    episode_grpo_std: 0.05
    gae_095_vs_episode_delta: 8
    gae_100_vs_episode_delta: 5
    step_independent_mean_success: 0.03
  result_rationale: Median 档定义 GAE vs episode-level delta 为 5-15pp，这里 GAE(0.95) 领先
    8pp。GAE 能做 per-token credit assignment（通过 critic），而 episode-level GRPO 给所有 token
    同一 advantage。在 30-step episode 中，GAE 能区分 'step 5 的 go to drawer 是好的' vs 'step
    20 的 random action 是差的'，而 GRPO 无法区分。但 GAE 优势有限（非 dramatic）因为：(1) critic 在 1.7B
    模型上估计 V(s) 噪声大（multi-turn text state 难以准确估值），(2) ALFWorld 的 reward 仍是 binary sparse，critic
    bootstrapping 在 sparse reward 下不稳定。GAE(λ=1.0) 接近 Monte Carlo（与 GRPO episode-level
    语义相近但有 critic variance reduction），所以 delta 较小（5pp）。这个结果对 paper 是 double-edged：证明
    per-token credit 有价值（GAE > GRPO），但也说明 episode-level GRPO 不是最优解。需要定位为 'minimum
    viable fix, not optimal'。

narrative_guidance: 重心从 'dual contribution' 转向 'diagnostic contribution + preliminary
  application'。核心贡献是双机制诊断的系统分析（sign misattribution + information loss），episode-level
  GRPO 定位为 minimum viable fix 而非 optimal solution（GAE 可能更优 5-15pp），selective verification
  作为 preliminary downstream application 呈现（claim 降为 moderate-to-weak）。需要补充 mechanistic
  analysis 深度和 community practice survey 来弥补 application 侧的弱势。

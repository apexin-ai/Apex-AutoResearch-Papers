- name: Credit assignment mechanism empirical verification
  plan_id: plan_004
  description: Per-window advantage logging from h=2 runs, sign/magnitude analysis
  expected_results:
    sign_vs_outcome_correlation: 0.87
    sign_vs_local_quality_correlation: 0.12
    magnitude_position_decay_r2: 0.75
    episode_level_sign_variance: 0.0
    episode_level_magnitude_variance: 0.02
    success_episodes_all_positive_pct: 0.92
    failure_episodes_all_negative_pct: 0.89
    gamma_k_fit_coefficient: 0.93
  result_rationale: Median 档定义 sign-outcome correlation 0.80-0.95，取 0.87。不完美（非 1.0）的原因：(1)
    GRPO 的 group normalization 引入噪声——同一 group 内如果有多个 success episodes，normalization
    后部分 success episode 的 advantage 可能为负（因为相对排名），(2) 极短 episode（2-3 步就成功/失败）中 window
    数太少，统计不稳定。Sign vs local quality correlation = 0.12（非零但弱），因为存在 confound：好的 local
    actions 确实倾向于出现在成功 episode 中（相关但非因果），但这种 correlation 远弱于 sign-outcome correlation（0.87
    vs 0.12）。Magnitude decay R²=0.75 而非更高，因为 reward normalization 和 group composition
    增加了 position-magnitude 关系的噪声。Episode-level 下 variance 为 0（by design，所有 token 同一
    advantage）。

narrative_guidance: '完全 reframe 为 diagnostic/analysis paper。Title: "Dissecting Credit
  Assignment Failure in Multi-Turn LLM Agent RL: A Dual-Mechanism Analysis"。 核心叙事：episode-level
  是 necessary but not sufficient，消除 window-level 问题后暴露更深层 credit assignment 瓶颈。 GAE
  >> episode-level GRPO 证明 per-token credit 是关键缺失。Sign misattribution 是主要但非唯一因素——entropy
  collapse、KL drift、information loss 共同作用。 贡献定位为 failure mode taxonomy + actionable
  guidelines + cross-framework design analysis。 Selective verification 完全移入 future
  work。Claim 2/3 删除。

  '

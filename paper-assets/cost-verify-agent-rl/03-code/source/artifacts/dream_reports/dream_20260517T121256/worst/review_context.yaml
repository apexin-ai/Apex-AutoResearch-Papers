    gae_095_seed3_success: 0.41
    gae_095_mean: 0.41
    gae_095_std: 0.03
    gae_10_10_seed1_success: 0.37
    gae_10_10_seed2_success: 0.34
    gae_10_10_seed3_success: 0.39
    gae_10_10_mean: 0.367
    gae_10_10_std: 0.025
    episode_grpo_mean: 0.234
    gae_095_vs_episode_delta_pp: 17.6
    gae_10_vs_episode_delta_pp: 13.3
    gae_095_per_token_adv_variance: 0.42
    episode_grpo_per_token_adv_variance: 0.0
    step_independent_mean: 0.02
  result_rationale: 'Worst 档要求 GAE >> episode-level GRPO（delta > 15pp）。GAE(λ=0.95)
    达到 41%—— 因为 critic 提供 per-token temporal difference signal，每个 action 获得独立的 advantage
    estimate， 而非 GRPO 的 "全 trajectory 同一 advantage"。这是 worst 档的核心发现： episode-level
    GRPO 的 plateau 不是 episode-level 本身的问题，而是 GRPO 的 bandit-style credit 的问题。 GAE 通过
    value function 提供 fine-grained credit，打破了 plateau。 GAE(λ=1,γ=1) 略低于 GAE(0.95)，因为无
    discount 导致 variance 更高。 Delta=17.6pp 直接证明：per-token credit assignment 是关键缺失，episode-level
    只是 necessary condition。 这彻底改变 paper story——从 "episode-level solves it" 到 "episode-level
    is necessary but per-token credit is the real bottleneck"。

    '

  analysis: 'Sign misattribution 存在但不是 sole mechanism——这是 worst 档的核心困难。不能 claim "advantage
    sign is entirely determined by episode outcome"。 需要 reframe 为 "sign misattribution
    is the dominant but not sole factor in credit assignment failure"。 混杂因素（KL drift、entropy
    dynamics）本身成为 failure mode taxonomy 的独立条目。 Partial correlation decomposition 成为
    analysis paper 的关键贡献：量化每种机制对 credit assignment failure 的贡献占比。

    '

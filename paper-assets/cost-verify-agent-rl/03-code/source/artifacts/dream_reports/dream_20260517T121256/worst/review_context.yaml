    to skip。 Verification rate 只降了 12%（模型几乎总是 verify），因为 skip 的 penalty（success 下降）远大于
    action-change reward 的 bonus。Policy 本质上退化为 "always verify"—— 因为在 25% success 的
    agent 上，任何 skip 都有显著 performance cost。 Success 降至 16%（比 baseline 低 9pp），因为即使少量的

- name: Credit assignment mechanism empirical verification
  plan_id: plan_004
  description: Per-window advantage logging，验证 sign misattribution 机制
  expected_results:
    sign_vs_outcome_correlation: 0.73
    sign_vs_local_quality_correlation: 0.28
    magnitude_position_decay_r2: 0.61
    episode_level_adv_variance: 0.0
    success_episodes_all_positive_pct: 0.78
    failure_episodes_all_negative_pct: 0.82
    mixed_sign_episodes_pct: 0.2
    gamma_k_decay_slope: -0.032
    confound_kl_correlation: 0.31
    confound_entropy_correlation: 0.27
  result_rationale: 'Worst 档的关键：sign-outcome correlation 只有 0.73（而非预期的 >0.95），sign-local_quality
    correlation 达到 0.28（而非预期的 ~0）。这意味着 sign misattribution 存在但有显著混杂因素。 Correlation
    < 1.0 的原因：GRPO 的 group normalization 使得同一 group 内的 advantage 不完全由 episode outcome
    决定—— 如果 group 内所有 episode 都成功（或都失败），normalization 后 advantage 反映 relative 差异而非
    absolute 成败。 这在成功率较高的 training episodes 中尤为明显。 Local quality correlation = 0.28
    的原因：window-local action quality 与 episode success 本身存在弱正相关 （好的 local action 确实
    contribute to success），所以 sign-local 相关性部分反映了 genuine causal path 而非纯 misattribution。这是混杂因素：无法将
    sign-local 相关性 100% 归因于 misattribution， 因为部分是 legitimate credit signal。 KL divergence
    和 entropy 也与 advantage sign 相关（r=0.31, 0.27），说明 policy drift 和 exploration dynamics
    独立影响 advantage distribution。

    '

    policy gradient direction。 这是 failure mode taxonomy 的第四种机制："reward misalignment
    under sparse task signal"—— 当 task reward 稀疏且 episode-level credit 粗糙时，任何 dense
    auxiliary reward 都容易主导 learning。 进一步证明 per-token credit（如 GAE）才是根本解。


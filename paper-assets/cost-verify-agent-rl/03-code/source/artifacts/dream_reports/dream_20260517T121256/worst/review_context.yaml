    trajectory total reward）， action_is_valid 确实从 55% 提升到 72%，但 success 反而略降（22% <
    28%）。 原因：valid_action_bonus 改变了 reward landscape，使模型偏向 "safe but ineffective"
    actions—— valid 但不 goal-directed 的 action（如反复 examine 已知物体）获得持续正 reward， 而 risky
    but potentially successful 的 exploration 策略被抑制。Episode-level 下不存在 per-step gaming，
    但 dense bonus 仍扭曲了 trajectory-level 的 learning signal——模型学会生成 "很多 valid action
    的长 trajectory" 而非 "goal-directed 的短 trajectory"。这是 analysis paper 的另一个 insight：
    dense reward 在 episode-level 下的失效模式与 step-independent 不同但同样有害。


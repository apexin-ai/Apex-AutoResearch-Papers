    when uncertain"。 B-IAVR 学到的 policy 没有这种 alignment 因为 training signal 太弱。 所有 selective
    方法都比 always-on 差（delta > 5pp），因为 base agent 太弱—— verification 在 25% agent 上几乎总是有用的（因为

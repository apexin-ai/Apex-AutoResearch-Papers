    positioning： finer credit assignment（per-token advantage via value function）确实比
    episode-level bandit credit 提供额外信息。GAE(1.0, 1.0) 相当于 MC return + baseline，优势较小（6.25pp），
    因为 λ=1.0 等效于不做 bootstrapping，信息量接近 episode-level。 GAE(0.95) 的优势来源于 critic 提供的

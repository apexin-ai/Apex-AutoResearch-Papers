      - '0.12'
      - 92%
      - 8%
    - - failure (n=184)
      - '-0.31'
      - '0.15'
      - 11%
      - 89%
  - title: 'Episode-level control: advantage uniformity'
    columns:
    - mode
    - within_episode_sign_variance
    - within_episode_magnitude_cv
    rows:
    - - step-independent (h=2)
      - 0.18
      - 0.45
    - - episode-level
      - 0.0
      - 0.0
  figures_description:
  - 'Figure 2a: Scatter plot of per-window advantage sign (+1/-1) vs episode outcome
    (success/failure)，clear clustering but with ~11% exceptions in off-diagonal quadrants。'
  - 'Figure 2b: Per-window advantage magnitude vs window position (from terminal)，γ^k
    decay 趋势线 R²=0.72。'
  - 'Figure 2c: Same analysis for episode-level — all positions have identical advantage（完美水平线）。'
  analysis: 'Sign misattribution 实证为 "dominant factor" 而非 "complete explanation"。0.87
    correlation 足够强以支撑核心 claim，但 GRPO normalization 导致的 exceptions 需要诚实讨论。 Paper 措辞从
    "advantage sign is determined by episode outcome" 改为 "advantage sign is predominantly
    determined by episode outcome (r=0.87), with exceptions arising from GRPO''s within-group
    normalization"。γ^k decay 作为 secondary mechanism 报告但不过度强调。

    '

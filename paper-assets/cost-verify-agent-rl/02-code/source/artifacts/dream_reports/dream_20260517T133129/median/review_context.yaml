- name: Credit assignment mechanism empirical verification (paper Figure 2)
  plan_id: plan_004
  description: '对 h=2 seed 2 运行添加 per-window advantage logging，验证 sign misattribution
    机制。 分析 advantage sign 与 episode outcome / local action quality 的 correlation。

    '
  expected_results:
    sign_vs_outcome_correlation: 0.87
    sign_vs_local_quality_correlation: 0.14
    gamma_k_magnitude_decay_r2: 0.72
    episode_level_advantage_variance_across_positions: 0.0
    success_episodes_all_positive_pct: 0.92
    failure_episodes_all_negative_pct: 0.89
    mixed_sign_episodes_pct: 0.11
    total_episodes_analyzed: 256
    total_windows_analyzed: 3200
  result_rationale: 'Sign-vs-outcome correlation 0.87 而非理论预测的 ~1.0，因为 GRPO 的 group
    normalization 引入噪声：当一个 group 内所有 trajectory 都失败时，GRPO 的 (R-μ)/σ 会将 "least bad"
    的 trajectory 赋予正 advantage，即使 episode 失败。这导致约 11% 的 episode 出现 "mixed sign" （失败
    episode 中部分 window 获得正 advantage）。 Sign-vs-local-quality correlation 0.14（非零但弱）因为
    local action quality proxy （action_is_valid × action_is_effective）与 episode outcome
    有弱正相关——好的 local action 确实微弱增加 success 概率。但 0.14 远低于 0.87，足以证明 advantage sign 主要由
    episode outcome 决定而非 local quality。 γ^k decay R²=0.72 说明 magnitude decay 存在但拟合不完美：实际
    magnitude 受 GRPO normalization 和 token-level variance 影响，不是纯粹的 γ^k 指数衰减。

    '
  tables:
  - title: Advantage sign attribution analysis (h=2, 256 episodes)
    columns:
    - metric
    - value
    - interpretation
    rows:
    - - sign-vs-outcome corr
      - 0.87
      - strong but not perfect — GRPO normalization noise
    - - sign-vs-local-quality corr
      - 0.14
      - weak — sign NOT determined by local action quality
    - - γ^k decay R²
      - 0.72
      - moderate fit — magnitude decays with position but noisy
    - - success eps all-positive %
      - 92%
      - most success episodes have uniformly positive advantages
    - - failure eps all-negative %
      - 89%
      - most failure episodes have uniformly negative advantages
    - - mixed-sign episodes %
      - 11%
      - GRPO normalization creates exceptions
  - title: Per-window advantage statistics (success vs failure episodes)

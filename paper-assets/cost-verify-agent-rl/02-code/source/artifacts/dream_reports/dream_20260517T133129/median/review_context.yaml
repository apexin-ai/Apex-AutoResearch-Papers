narrative_guidance: 'Paper 收缩为 Plan A 方向：diagnostic + analysis contribution。 标题变为
  "Why Step-Independent RL Fails for LLM Multi-Turn Agents: Dual Mechanism Analysis"。
  Claim 1 保留但措辞调整：sign misattribution 是 "dominant factor" 而非 "complete explanation"（correlation
  未达 0.95）。 GAE 优势需正面讨论：承认 finer credit 有额外 performance 价值，reframe 为 "episode-level
  是 necessary minimum，GAE 是 sufficient improvement"， 不再强推 contrarian "更粗就够了"。Selective
  verification（Claim 2/3）降为 preliminary results 或 future work。 h-sweep 和多 seed 机制分析需做得更深来补偿
  selective verification 贡献的缺失。仍可投同 venue 但作为 analysis paper track。

  '

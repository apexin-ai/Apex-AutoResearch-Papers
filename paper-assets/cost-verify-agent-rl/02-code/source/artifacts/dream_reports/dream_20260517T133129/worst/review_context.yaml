      - '0.08'
      - Collapsed to always-verify
  figures_description:
  - 'Fig: verification rate 从 100% 缓慢下降到 88% 然后 plateau。Policy entropy → 0 表明 degenerate
    convergence。'
  analysis: Selective verification 在 base agent success < 30% 时完全不可行。Policy 无法学到 meaningful
    skip pattern 因为：(1) reward signal (action-change) 是 noise，(2) skipping has guaranteed
    downside with no upside at this performance level。整个 Phase B contribution 不成立。
- name: Selective verification full comparison
  plan_id: plan_008
  description: Always-on / B-IAVR / no-verify / random-p / confidence-threshold 对比。
  expected_results:
    always_on_success: 0.281
    biavr_success: 0.219
    biavr_verification_rate: 0.88

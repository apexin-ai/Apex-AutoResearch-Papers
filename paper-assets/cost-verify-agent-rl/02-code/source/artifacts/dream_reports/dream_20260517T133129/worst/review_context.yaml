- name: 7B model scaling verification
  plan_id: plan_015
  description: Qwen3-7B 上验证 episode-level vs step-independent。
  expected_results:
    episode_level_7b_success: 0.35
    step_independent_7b_success: 0.22
    delta_pp: 13
    relative_improvement: 1.59
    step_independent_collapse: false
    step_independent_7b_h5_success: 0.18
  result_rationale: 7B 模型更强，step-independent 不完全崩溃（22% vs 1.7B 的 0%）。原因：更大模型有更好的 in-context
    learning，即使 h=5 窗口也能从有限 context 推断 partial strategy。Episode-level 仍优（35% vs 22%）但
    gap 缩小（13pp vs 1.7B 的 28pp）。这进一步削弱 'catastrophic failure' narrative——在 stronger
    model 上 step-independent 只是 suboptimal 而非 catastrophic。Reviewer 会问 'at what model
    size does the gap disappear entirely?'
  tables:
  - name: 'Table 9: 7B scaling'
    columns:
    - method
    - 1.7B
    - 7B
    - gap_reduction
    rows:
    - - episode-level
      - 28.1%
      - 35%
      - —
    - - step-independent (h=5)
      - 0%
      - 22%
      - 'Gap: 28pp→13pp'
  figures_description: []
  analysis: Episode-level advantage diminishes with model scale。7B step-independent
    不崩溃（22%），gap 缩小到 13pp。暗示 'catastrophic failure' 是 small model + long horizon 的特定
    interaction，更大模型的 in-context learning 能部分补偿 credit assignment 缺陷。Paper 的 alarm
    ('step-independent catastrophically fails!') 变成了 'step-independent is suboptimal
    for small models on long tasks'——much weaker claim。

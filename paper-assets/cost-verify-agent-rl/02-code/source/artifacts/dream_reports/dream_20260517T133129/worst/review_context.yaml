- name: Entropy-controlled action-change analysis
  plan_id: plan_010
  description: Stratify by policy entropy，测试 action-change-success correlation 是否
    holds。
  expected_results:
    partial_correlation_after_entropy_control: 0.03
    p_value: 0.42
    low_entropy_stratum_correlation: 0.05
    high_entropy_stratum_correlation: 0.11
    entropy_success_correlation: -0.15
  result_rationale: Controlling for entropy 后 action-change-success correlation 从
    0.08 降至 0.03（p=0.42，not significant）。这证明 plan_005 中观察到的微弱 correlation 完全由 entropy
    confound 解释：高 entropy → 更多 random action change + 更低 success。Action change 本身无
    causal relationship with success。Reviewer concern 'action change = noise' 被证实。
  tables: []
  figures_description:
  - 'Fig: partial correlation heatmap across entropy strata. All cells near zero after
    controlling.'
  analysis: Action-change 作为 verification informativeness proxy 的理论基础被否定。Change 只是
    high entropy 的 side effect，不是 'verification found better action'。Claim 2 的 reward
    design 无 empirical grounding。
- name: 'Causal intervention: random vs verification-triggered changes'
  plan_id: plan_011
  description: Inject random action changes at same rate，对比 verification-triggered。
  expected_results:
    success_rate_verification_triggered: 0.22
    success_rate_random_change: 0.19
    delta_pp: 3.0
    p_value: 0.31
    effect_size_cohens_d: 0.12
  result_rationale: Verification-triggered changes 只比 random changes 好 3pp（not significant,
    p=0.31）。Effect size tiny (d=0.12)。原因：28% success 的 agent 做 verification 时，其 'correction'
    几乎等价于 random re-sampling from policy——agent 没有真正的 'second opinion' 能力，verification
    output 和 original output 来自同一个 weak policy distribution。Causal evidence for verification
    value 不成立。
  tables: []
  figures_description:
  - 'Fig: success rate comparison with 95% CI error bars. Bars overlap heavily.'
  analysis: Verification 在 weak agent 上 ≈ random perturbation。这是 Claim 2 的 death blow——不仅
    action-change 不是好 reward（plan_010），verification 本身在当前 agent 能力下就没有 causal value（它的
    correction 不比 random good）。

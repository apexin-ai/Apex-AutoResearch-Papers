    更关键：seed1/3 没有崩溃且学到 15-19%，只有 seed2 崩溃。这直接削弱 'catastrophic failure below threshold'
    narrative——cliff 位置是 stochastic 的，不是 deterministic 的。h=10/20/full 之间差异不大（均在 10-25%
    区间），说明即使给了足够 context，episode-level 本身也有天花板。Monotonic degradation 假设不成立：h=5 的某些

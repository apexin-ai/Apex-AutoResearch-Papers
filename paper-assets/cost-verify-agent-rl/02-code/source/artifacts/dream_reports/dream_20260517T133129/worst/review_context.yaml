  - 'Fig: Learning curves — GAE(0.95) clearly dominates from step 5 onward, with episode
    GRPO plateauing while GAE continues climbing. The gap widens over training.'
  analysis: GAE 大幅超越 episode-level GRPO 证明 per-token temporal difference credit 是关键。Episode-level
    的 'advantage sign is correct' 不够——你还需要 magnitude differentiation across tokens。这反驳了
    contrarian positioning：社区追求 finer credit 是对的。Episode-level 只是 '方向不错但信息太粗' 的 solution。Paper
    的核心 contribution（'coarser suffices'）被实验数据否定。
- name: Episode-level + valid_action_bonus (plateau-breaker)
  plan_id: plan_003c
  description: Episode-level + valid_action_bonus=0.05, 测试能否打破 plateau 且不 game。
  expected_results:
    val_success_step15: 0.25
    val_action_is_valid_step15: 0.72
    val_action_is_valid_step30: 0.85
    success_plateau_broken: false
    reward_gaming_detected: false
    valid_bonus_vs_task_ratio: 4.2:10 (per episode)
    action_is_valid_improvement: +17pp vs vanilla
  result_rationale: Episode-level 下 dense reward gaming 不发生（与 exp013f 对比，D056 insight
    正确）。action_is_valid 从 55% 提升到 72-85%，模型确实学到了更多合法 action format。但 success rate
    仍 plateau 在 25%——更多 valid actions ≠ 更好的 task strategy。模型能输出合法格式但不知道 WHICH valid
    action 能推进 task。Valid action bonus 解决的是 syntax 问题而非 semantics 问题。Plateau 未突破因为瓶颈不在
    action validity 而在 credit assignment granularity（GAE 结果已证明）。
  tables: []
  figures_description:
  - 'Fig: action_is_valid 稳步上升（55%→85%），success_rate 保持 flat（25%±3pp）。两条线 decouple
    证明 valid format ≠ task success。'
  analysis: D056 insight 部分正确（episode-level 不 game dense reward），但 plateau 不是 action_is_valid
    造成的。Base agent 学会了 'speak the right language' 但不知道 'say the right thing'。Plateau
    本质是 episode-level credit 太粗——all valid actions 获得相同 reinforcement signal，模型无法区分哪个
    valid action 更好。
- name: Credit assignment mechanism empirical verification
  plan_id: plan_004
  description: Per-window advantage logging 验证 sign misattribution 机制。
  expected_results:
    sign_vs_outcome_correlation: 0.72
    sign_vs_local_quality_correlation: 0.28
    gamma_k_magnitude_decay_r2: 0.45
    episode_level_advantage_variance: 0.0
    success_episodes_all_positive: 0.85
    failure_episodes_all_negative: 0.78
    mixed_sign_episodes_pct: 0.18
  result_rationale: Worst 档下 sign misattribution 存在但非 dominant。sign_vs_outcome_correlation=0.72
    说明 advantage sign 确实偏向 episode outcome，但 0.72 远非 'near 1.0' 的理论预测。28% 的 local
    quality correlation 说明 advantage 中有 non-trivial 的 local signal（GRPO 的 group normalization
    引入了组内相对排序信息）。18% 的 episodes 出现 mixed signs（部分 window positive 部分 negative in same
    episode），这不符合 'pure sign misattribution' 理论（理论预测应为 0%）。γ^k decay R²=0.45 说明 magnitude
    确实随 position 衰减但 fit 不好（noise 大）。总结：mechanism 存在但不 clean，empirical evidence 是
    'moderate support' 而非 'strong confirmation'。
  tables:
  - name: 'Table 4: Advantage sign analysis'
    columns:
    - metric
    - theoretical_prediction
    - observed
    - interpretation
    rows:
    - - sign-outcome corr
      - '>0.95'
      - '0.72'
      - Exists but not dominant
    - - sign-local_quality corr
      - <0.1
      - '0.28'
      - Non-trivial local signal present
    - - γ^k decay R²
      - '>0.8'
      - '0.45'
      - Weak fit
    - - mixed-sign episodes
      - 0%
      - 18%
      - Theory violation
    - - episode-level variance
      - '0'
      - '0'
      - Confirmed (trivially)
  figures_description:
  - 'Fig 2 draft: scatter plot of per-window advantage sign vs episode outcome. 明显
    trend 但大量 noise。不像理论预测的 clean two-cluster separation。'
  analysis: Sign misattribution 是 real phenomenon 但 paper 需要大幅 soften claims。不能写 'advantage
    sign is entirely determined by episode outcome'——实际只有 72% correlation。Mixed-sign
    episodes 的存在说明 GRPO group normalization 引入了组内 local ranking 信号（当 group 中有 partial
    success 时）。Reviewer 会 attack：'your mechanism is one factor among several, not
    THE explanation'。这把论文从 'mechanistic explanation paper' 降级为 'we observed a contributing
    factor'。
- name: Action-change statistics from always-on runs
  plan_id: plan_005
  description: 从 exp029 checkpoints 收集 verification 后 action change 统计。
  expected_results:
    action_change_rate: 0.35
    confirmatory_rate: 0.65
    action_change_success_correlation: 0.08
    action_change_rate_success_episodes: 0.38
    action_change_rate_failure_episodes: 0.34
    per_task_variance: 'high (pick: 0.25, clean: 0.45, heat: 0.30)'
  result_rationale: Base agent 只有 28% success rate，大部分 verification 是在失败 trajectory
    中进行的。Action change rate 35%（不是 >60% confirmatory 的预期？ 其实是——65% confirmatory 符合假设）。但关键问题：action_change_success_correlation
    极低（0.08），说明 action change 与 episode success 几乎无关。在成功 episodes 中 change rate=38%，失败中=34%——差异
    negligible。这意味着 action-change 作为 reward signal 没有 information content：改变 action
    并不 predictive of 成功。原因：base agent 太弱（28% success），它的 verification 大多是 random perturbation
    而非 informed correction。
  tables: []
  figures_description:
  - 'Fig: action_change_rate 按 task type 分解。High variance across types 但 none 显示 strong
    change-success correlation。'
  analysis: Action-change reward 的前提假设（'change = informative verification'）在这个 agent
    能力水平下不成立。28% success 的 agent 做 verification 更像是 random re-sampling 而非 informed
    decision revision。Selective verification 的整个 Phase B 建立在沙子上——你需要一个足够强的 agent（≥50%
    success?）才能让 verification 成为 meaningful signal 而非 noise。
- name: Selective verification implementation
  plan_id: plan_006
  description: 实现 binary verify/skip decision。Code-only。
  expected_results:
    implementation_complete: true
    code_lines_added: 280
    integration_test_pass: true
    gpu_hours: 0
  result_rationale: 纯代码实现，无 ML 依赖。能完成但实际 training（plan_007）会 fail 因为 base agent 太弱。
  tables: []
  figures_description: []
  analysis: Implementation 本身 trivial。问题不在代码而在 downstream training signal quality。
- name: B-IAVR selective verification training
  plan_id: plan_007
  description: 从 exp029 best checkpoint 训练 selective verification policy。
  expected_results:
    verification_rate: 0.88
    success_rate: 0.219
    success_delta_vs_always_on_pp: -6.2
    cost_reduction: 0.12
    training_converged: false
    policy_behavior: near-always-verify (degenerate)
  result_rationale: Base agent 只有 28% success。Selective policy 面临两个问题：(1) action-change
    reward 无 information content（plan_005 证明 change 与 success 无关），所以 reward signal
    is noise；(2) skip verification 有 immediate cost（performance drop），而 base agent
    已经很弱，任何 skip 都大幅降低本就脆弱的 success rate。Policy 学到 degenerate solution：几乎 always verify（88%
    rate），偶尔 skip 是 random noise 而非 learned strategy。12% cost reduction 远未达到 40% target。Success
    还 drop 了 6pp 因为那 12% skip 确实 hurt。
  tables:
  - name: 'Table 5: B-IAVR training results'

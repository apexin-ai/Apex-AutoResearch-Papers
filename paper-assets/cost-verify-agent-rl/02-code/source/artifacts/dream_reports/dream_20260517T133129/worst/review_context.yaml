  analysis: Paper Claim 3 完全 fail。B-IAVR 被 naive baselines dominate。讽刺的是 no-verify
    的 efficiency 最高（per-token success ratio），说明在 28% success 水平下，verification 本身就是
    pure overhead——agent 改变 action 不提升 success。
- name: No-verify ablation
  plan_id: plan_009
  description: Episode-level GRPO without self-verification。
  expected_results:
    success_rate: 0.188
    action_is_valid: 0.52
    delta_vs_always_on: -9.3
  result_rationale: No-verify 只 drop ~9pp（28.1% → 18.8%），低于预期的 ≥10pp。原因：在 28% success
    level，verification 的 marginal value 有限——agent 的 success 主要来自偶然走对 path，verification
    只是小幅增加 correction 机会但不 fundamentally 改变 strategy。如果 base agent 更强（如 GAE 的 44%），verification
    drop 可能更大，但我们无法测试因为 episode-level 训练不出更强的 agent。
  tables: []
  figures_description: []
  analysis: Verification value 存在但 modest（9pp）。不足以支撑 'selective verification 是重要 research

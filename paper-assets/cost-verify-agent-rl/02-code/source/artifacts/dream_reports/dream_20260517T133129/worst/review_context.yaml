    意味着 episode-level 只是 marginally better（15% vs 12%，差异 3pp not significant p=0.38）。ScienceWorld
    有更短的 episodes（~10-15 steps vs ALFWorld 30-50），所以 step-independent 的 information
    loss 没那么严重——shorter episodes = fewer windows = less sign misattribution。这反驳了 'episode-level
    universally superior' claim，支持 'advantage depends on episode length' 的 nuanced
    view，但也意味着我们的 contribution 是 domain-specific 而非 general。

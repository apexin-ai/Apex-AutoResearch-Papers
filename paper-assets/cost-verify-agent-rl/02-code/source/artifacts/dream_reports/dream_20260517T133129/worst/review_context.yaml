- name: GAE baseline comparison
  plan_id: plan_003b
  description: GAE(λ=0.95, γ=1.0) 和 GAE(λ=1.0, γ=1.0) vs episode-level GRPO, 15 steps
    × 3 seeds。
  expected_results:
    gae_095_mean_val_success_step15: 0.438
    gae_095_std: 0.047
    gae_100_mean_val_success_step15: 0.375
    gae_100_std: 0.055
    episode_grpo_mean_val_success_step15: 0.238
    gae_095_vs_episode_delta_pp: 20.0
    gae_100_vs_episode_delta_pp: 13.7
    gae_095_action_is_valid: 0.78
    gae_095_convergence_step: 12
    gae_still_improving_at_step15: true
  result_rationale: Worst 档核心假设：GAE >> episode-level GRPO（delta > 15pp）。GAE(0.95)
    有 value function 做 per-token credit assignment，能区分 trajectory 中好/坏 action 并精确更新。Episode-level
    GRPO 所有 token 共享一个 advantage（相当于 REINFORCE），缺乏 temporal difference 信息。20pp gap
    证明 per-token credit 是关键——episode-level 'just knowing the outcome' 不够，你需要知道 which
    tokens contributed。这直接反驳 paper 的 contrarian claim 'coarser is better'。GAE(1.0,1.0)
    稍弱因为 high variance（相当于 Monte Carlo），但仍优于 GRPO 因为 critic 提供 baseline。

      - Yes (by all others)
    - - random trigger
      - 23.4%
      - 52%
      - 'No'
    - - confidence-based
      - 25.0%
      - 65%
      - 'No'
  figures_description: []
  analysis: Action-change reward 是 worst performer。Claim 2 ('action-change is effective
    intrinsic reward') 被彻底 falsified。Paper 失去了 selective verification 的 technical
    contribution。
- name: ARES reproduction + comparison
  plan_id: plan_013
  description: Reproduce ARES SFT router, head-to-head 对比。
  expected_results:
    ares_success: 0.25
    ares_verification_rate: 0.55
    ares_cost_reduction: 0.38
    biavr_success: 0.219
    biavr_verification_rate: 0.88
    biavr_cost_reduction: 0.12
    ares_dominates_biavr: true
  result_rationale: ARES 用 SFT 从 oracle decisions 学 router，不需要 RL reward signal quality。在
    same base agent 上 ARES 能学到 55% verification rate 且保持 success（因为它直接学 'when did
    verification change outcome' from data），而 B-IAVR 依赖 noisy RL reward 学不到 meaningful
    policy。ARES 在 Pareto frontier 上 dominate B-IAVR。我们不仅没有 '≥10pp better cost reduction'，反而被
    dominated。
  tables: []
  figures_description:
  - 'Fig: Pareto frontier with ARES point clearly dominating B-IAVR point.'
  analysis: SFT approach (ARES) 优于 RL approach (B-IAVR) 在这个 setting 下。原因：SFT 有 oracle
    supervision（从 data 直接学 when to verify），不受 reward noise 影响。RL 需要 good reward signal
    但我们没有。Paper 的 'RL > SFT for selective verification' implicit claim 被反驳。
- name: ScienceWorld transfer
  plan_id: plan_014
  description: Episode-level vs step-independent on ScienceWorld。
  expected_results:
    episode_level_success: 0.15
    step_independent_success: 0.12
    ratio: 1.25
    episode_level_std: 0.06
    step_independent_std: 0.08
    difference_significant: false
    p_value: 0.38

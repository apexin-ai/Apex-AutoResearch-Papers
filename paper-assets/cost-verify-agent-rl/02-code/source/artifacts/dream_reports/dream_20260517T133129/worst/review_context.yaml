narrative_guidance: 原始 framing 的两个支柱均不成立：(1) 'episode-level 就够了' 被 GAE 大幅超越反驳（finer
  credit 确实必要），(2) 'catastrophic failure at small h' 被不一致的 h-sweep 削弱（部分 seed h=5
  也能学到 15-20%）。Contrarian positioning 崩塌。需要完全 reframe 为 empirical taxonomy 或 sufficient
  conditions 研究。Selective verification 因 base agent 太弱（<30%）完全不可行。
imagined_experiments:

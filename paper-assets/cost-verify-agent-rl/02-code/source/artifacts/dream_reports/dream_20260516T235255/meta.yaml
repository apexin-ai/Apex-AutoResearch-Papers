  - name: Credit assignment mechanism analysis
    plan_id: plan_004
    description: Compute gradient signal strength, discount curves, episode-length
      correlation
    expected_results:
      correlation_effective_discount_vs_performance: 0.97
      gradient_signal_ratio_full_vs_h2: 142.3
      gradient_signal_threshold_for_learning: 0.015
      h_value_at_threshold: 8.3
      episode_length_performance_correlation_h2: -0.89
      episode_length_performance_correlation_full: -0.31
      mean_episode_length_successful: 28.4
      mean_episode_length_failed: 46.2
    result_rationale: Gradient signal strength定义为|∇_θ J|在每个training step的L2 norm。h=full时所有steps贡献等权gradient，signal
      strength ~1.0（归一化）。h=2时只有last-2-steps contribute，但这些steps通常是trivial final actions（如'close
      fridge'），对policy improvement贡献极小，有效signal≈1/142。Threshold 0.015是empirical noise
      floor——below this gradient updates被Adam optimizer的eps term和weight decay dominate。Episode
      length与performance在h=2下高度负相关(-0.89)因为longer episodes = more discounted = less
      signal；h=full下弱负相关(-0.31)仅反映longer tasks inherently harder。成功episode平均28.4步
      vs 失败46.2步——成功agent更efficient，这是episode-level training学到task structure的evidence。

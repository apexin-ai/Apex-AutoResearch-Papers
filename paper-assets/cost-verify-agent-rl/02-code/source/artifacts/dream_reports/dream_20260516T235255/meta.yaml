    ## Actionable Recommendations for Revision


    1. **Fix the formalization (M1):** Either demonstrate γ is a real GRPO parameter
    or reframe the analysis as information-theoretic (context truncation → information
    loss → gradient signal degradation). The latter would be more honest and potentially
    more interesting.


    2. **Add multi-seed experiments (M2):** Run 5 seeds minimum for h∈{1, 5, 10, full}
    and report mean±std. This is the minimum bar for credible ablation.


    3. **Add credit assignment baselines (M3):** Compare episode-level GRPO against
    at least PPO with full returns and GRPO+GAE. If episode-level GRPO matches PPO,
    that''s still publishable (showing GRPO can work for multi-turn tasks when configured
    correctly), but the claim would shift.


    4. **Expand references (M5):** Target 30+ citations. Cite all mentioned works,
    add foundational RL, and survey recent multi-turn LLM agent training papers.


    5. **Address Self-Guide gap (m8):** Explicitly explain why prompted verification
    (72.7%) outperforms RL training (25%) and position episode-level GRPO as a training-time
    complement, not a replacement.


    6. **Add figures:** At minimum, an h-sweep curve and multi-seed training curves
    with shaded std bands.'

    result_rationale: ALFWorld平均episode长度T≈50步。h=2时effective discount gamma^(48)≈0.007（gamma=0.99），关键决策点的reward信号几乎为零，模型只能学到最后2步的pattern（通常是最终action），无法学到exploration策略。h=5时gamma^(45)≈0.064，信号存在但远弱于噪声，只有最短episode(T<15)能学到。h=10是cliff
      region：gamma^(40)≈0.67，刚好在信号/噪声边界，部分episode能学但不稳定。h=20时gamma^(30)≈0.74，大部分episode的early
      decisions获得足够信号。h=full直接用episode return，无discount decay，所有steps获得等权信号。Cliff在h=8附近因为此时gamma^(42)≈0.65恰好跌破gradient
      signal > noise的阈值。

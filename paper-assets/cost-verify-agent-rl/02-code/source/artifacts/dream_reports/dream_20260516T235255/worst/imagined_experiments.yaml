- name: No-verify ablation
  plan_id: plan_009
  description: Episode-level GRPO without self-verification。Lower bound实验。
  expected_results:
    success_rate: 15.0
    action_is_valid: 78.0
    delta_vs_always_on: -10.0
    mean_episode_length: 38
    convergence_step: 10
  result_rationale: 移除verification后，agent失去每步的self-correction机会。从25%降到15%，delta=10pp。这在worst档下actually是有用的数据点——证明verification本身有10pp价值。但这个delta不够dramatic来支撑'selective
    verification is the key innovation'的story。在pure methodology paper中可以brief report作为：'verification
    contributes +10pp, confirming its utility, but our focus is on the training methodology
    that enables ANY multi-turn RL to work'。

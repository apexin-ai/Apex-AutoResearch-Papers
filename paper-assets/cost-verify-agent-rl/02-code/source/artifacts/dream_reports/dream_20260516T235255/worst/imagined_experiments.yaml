    delta_triggered_vs_random_p: 0.25
    n_episodes: 48
  result_rationale: Verification-triggered changes (22%) vs random changes (16%) shows
    6pp gap，方向正确但p=0.25 not significant。N=48 episodes不够detect这个effect size。No-change
    baseline (18%)介于两者之间，使得interpretation模糊：triggered changes可能beneficial，但也可能just
    noise given wide CIs。在25% performance regime下，即使verification IS informative，effect
    size太小to detect reliably。另一个confounder：random changes有时accidentally correct（16%
    vs no-change 18%只差2pp），suggesting verification的causal contribution marginal。

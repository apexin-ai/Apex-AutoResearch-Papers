  figures_description:
  - 'Figure 2a: x=h value (log scale), y=success rate. 呈S-curve但slope较gentle。h<5区域flat
    near zero, h=5-10区域linear rise, h>10区域saturate at ~25%。Error bars from single
    seed较大。'
  - 'Figure 2b: x=effective discount gamma^(T-h), y=success rate. Near-linear relationship，但R²约0.85（非perfect
    fit）表明discount不是唯一因素。'
  analysis: h-sweep是worst档下paper最有价值的contribution。虽然绝对性能低，但趋势清晰：step-independent（h=1-2）catastrophically
    fails，episode-level（h=full）works。问题在于h=10已达full性能的72%（18/25），reviewer会argue full
    episode context非必要。Defense需要：(1)强调h=10在更长episode task上可能不够，(2)展示h=full的convergence
    speed优势，(3)argue 'full是最简方案，无需tune h'。Single seed数据使得intermediate h values的ordering可能有noise。
- name: Multi-seed replication (3 seeds)
  plan_id: plan_003
  description: 2 additional seeds for episode-level config. Report mean ± std。
  expected_results:
    seed1_success_rate: 25.0
    seed2_success_rate: 18.0
    seed3_success_rate: 30.0
    mean_success_rate: 24.3
    std_success_rate: 6.0

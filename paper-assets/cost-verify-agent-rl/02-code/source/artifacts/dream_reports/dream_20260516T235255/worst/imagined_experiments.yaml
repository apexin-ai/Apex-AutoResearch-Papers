tier: worst
narrative_guidance: '完全放弃selective verification contribution。转型为pure training methodology
  paper: ''Episode-Level RL for Multi-Turn Agents: Why Step-Independent Fails and
  How to Fix It''。核心Figure是h-sweep + mechanism visualization。需要极细粒度h-sweep、多seed统计、与RAGEN的explicit对比来补偿绝对性能不impressive的弱点。Paper
  story变为：(1)揭示failure mode, (2)mechanistic explanation, (3)提出fix并验证。不降venue但需要更深analysis
  depth。'
imagined_experiments:
- name: Context window h-sweep ablation
  plan_id: plan_002
  description: Sweep h={1,2,3,5,8,10,15,20,full} on same GRPO config. Paper核心Figure。
  expected_results:
    h1_success_rate: 0.0
    h2_success_rate: 2.0
    h3_success_rate: 4.5
    h5_success_rate: 8.0
    h8_success_rate: 14.0
    h10_success_rate: 18.0
    h15_success_rate: 22.0
    h20_success_rate: 24.0
    h_full_success_rate: 25.0
    cliff_threshold_h: 5
    h1_collapse_rate: 1.0
    h2_collapse_rate: 0.85
    h5_action_is_valid: 72.0
    h10_action_is_valid: 82.0
    h_full_action_is_valid: 88.0
    convergence_speed_h10_steps: 15
    convergence_speed_h_full_steps: 8
  result_rationale: 在worst档位下，h-sweep仍能展示episode-level vs step-independent的gap，但曲线形态偏向gradual
    degradation而非sharp cliff。h=5以下gamma^(T-h)衰减到<1%导致几乎无学习信号，但h=10到h=full之间差距不大（18%→25%），削弱了'episode-level
    is critical'的论证力度——reviewer会argue h=10 already sufficient。绝对性能ceiling在25%使得整条曲线都不impressive。cliff在h=5左右，比hypothesis的h=10低，意味着credit
    assignment threshold比预期更宽松，但也说明即便给了足够context（h≥10），1.7B model的能力ceiling也只有20-25%。
  tables:
  - name: 'Table 1: h-sweep results'
    columns:
    - h

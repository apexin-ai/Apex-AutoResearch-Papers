    seed2_action_is_valid: 82.0
    seed3_action_is_valid: 90.0
    mean_action_is_valid: 86.7
    std_action_is_valid: 4.2
  result_rationale: Worst档定义multi-seed std>8pp，但我预测实际std在6-9pp范围——足以让reviewer质疑但不至于完全破坏结论。三个seed中一个会表现较差（18%），一个中等（25%，复现原始结果），一个稍好（30%）。这个variance部分来自ALFWorld
    task sampling的随机性（val set只有16 episodes），部分来自GRPO的inherent instability（高grad_norm,
    KL spikes在不同seed上timing不同）。1.7B模型的parameter space小，不同random init导致loss landscape上收敛到不同local
    optima。Mean 24.3%仍远超step-independent baseline（0-6%），但confidence interval宽。

    (20%) actually competitive with trained B-IAVR (18%)——trained policy没有学到比random更好的策略，这是devastating
    negative result。Confidence-threshold (21%) slightly better因为它是heuristic rule而非learned，less
    prone to policy degradation。整个comparison suite展示：在low-performance regime下，verification的选择性本身不是bottleneck，base
    capability才是。

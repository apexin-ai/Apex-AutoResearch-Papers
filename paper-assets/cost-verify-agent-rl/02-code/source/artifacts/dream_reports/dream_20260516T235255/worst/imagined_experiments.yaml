    Band很宽，尤其在step 5-15区间。Seed 123明显延迟收敛。'
  analysis: Std=6pp略好于worst档定义的8-12pp下界，但仍然problematic。N=3 seeds给出的confidence interval很宽（24.3±6.0意味着95%
    CI约为[12, 37]），reviewer会正确指出这不够。理想需要5+ seeds但GPU budget不允许。Defense策略：(1)承认limitation，(2)强调所有seeds都远超step-independent
    baseline 0%，(3)variance主要在收敛speed而非final direction。
- name: Credit assignment mechanism analysis (paper Figure 2)
  plan_id: plan_004
  description: 计算并可视化gamma^(T-h) effective discount, gradient signal strength, episode
    length correlation。
  expected_results:
    gamma_value_used: 0.99
    mean_episode_length_T: 48
    gamma_T_minus_1: 0.0061
    gamma_T_minus_2: 0.0062
    gamma_T_minus_5: 0.0065
    gamma_T_minus_10: 0.0068
    gamma_T_minus_20: 0.0075
    gamma_T_minus_full: 1.0
    gradient_signal_h1_relative: 0.006
    gradient_signal_h5_relative: 0.03
    gradient_signal_h10_relative: 0.22
    gradient_signal_full_relative: 1.0
    episode_length_success_correlation: -0.35
    long_episode_success_drop_under_h5: 95
  result_rationale: Mechanistic analysis本身是deterministic计算（给定gamma和episode length分布），不受worst档位的performance
    ceiling影响。ALFWorld平均episode length~48 steps，所以gamma^47≈0.006（h=1时first action的discount）。这个数学事实不变。但worst档下的complication是：即使h=full（gradient
    signal=1.0），模型也只达25%——说明gradient signal是necessary但非sufficient condition。Reviewer会argue：'你解决了gradient
    signal问题，但模型仍然不行，说明bottleneck在elsewhere'。需要explicitly address这一点：承认model capacity是另一个bottleneck，但credit
    assignment是第一个需解决的。
  tables:
  - name: 'Table 3: Effective discount factor analysis'
    columns:
    - h
    - Mean gamma^(T-h)
    - Relative Gradient Signal
    - Observed Success(%)
    rows:
    - - 1
      - 0.006
      - 0.6%
      - 0.0
    - - 2
      - 0.012
      - 1.2%
      - 2.0
    - - 5
      - 0.03
      - 3.0%
      - 8.0
    - - 10
      - 0.22
      - 22%
      - 18.0
    - - 20
      - 0.67
      - 67%
      - 24.0
    - - full
      - 1.0
      - 100%
      - 25.0
  figures_description:
  - 'Figure 2 (paper核心): 双y轴图。Left y=effective gradient signal (log scale), Right
    y=observed success rate. x=h value. 两条曲线形态高度相关但非identical，展示gradient signal是necessary
    condition。Annotation标注''failure zone'' (h<5, signal<3%), ''transition zone'' (h=5-10),
    ''saturation zone'' (h>10, 性能plateau at model capacity ceiling)。'
  - 'Figure 2b: Episode length histogram colored by success/failure. 长episode（>40
    steps）在h<10时success接近0，h=full时仍有部分成功。'
  analysis: 这是worst档下最强的contribution piece。数学关系清晰，可视化compelling。关键insight：在RAGEN等现有工作中，默认h=1（step-independent），对应gradient
    signal仅0.6%——解释了为什么这些方法在long-horizon tasks上struggle。但需要小心措辞：不能overclaim 'episode-level
    solves multi-turn RL'（因为25%不算solved），只能claim 'episode-level is necessary first
    step, removing a fundamental training bottleneck'。
- name: Action-change statistics from always-on runs
  plan_id: plan_005
  description: 从exp029 checkpoints收集action-change统计：confirmatory rate, correlation
    with success, per-task breakdown。
  expected_results:
    total_verification_episodes: 48
    action_change_rate: 0.35
    confirmatory_rate: 0.65
    action_change_success_correlation_r: 0.15
    action_change_success_correlation_p: 0.18
    per_task_confirmatory_rate_put: 0.72
    per_task_confirmatory_rate_clean: 0.6
    per_task_confirmatory_rate_heat: 0.55
    per_task_confirmatory_rate_cool: 0.58
    per_task_confirmatory_rate_examine: 0.7
    action_change_leads_to_success_rate: 0.22
    no_change_leads_to_success_rate: 0.18
  result_rationale: 在worst档下，episode-level model只有25% success rate，导致action-change统计的样本量极小且noisy。Confirmatory
    rate 65%落在worst档定义的50-70%范围内，但correlation with success仅r=0.15（p=0.18, not significant）。这是因为：(1)成功episodes太少（~12/48），统计power不足；(2)25%的模型经常在错误轨道上，verification后的action
    change可能是从一个错误action换到另一个错误action，而非corrective。Action change→success rate (22%)
    vs no change→success rate (18%)的delta仅4pp，远不够支撑'action change is informative signal'的claim。这直接explains为什么在worst档下必须放弃selective
    verification story。
  tables:
  - name: 'Table: Action-change statistics'
    columns:
    - Metric
    - Value
    - 95% CI
    rows:
    - - Confirmatory rate (no action change)
      - 65%
      - '[52%, 78%]'
    - - Action change rate
      - 35%
      - '[22%, 48%]'
    - - Correlation (action_change, success)
      - r=0.15
      - p=0.18
    - - Success | action_change
      - 22%
      - '[10%, 34%]'
    - - Success | no_change
      - 18%
      - '[8%, 28%]'
  figures_description:
  - 'Bar chart: per-task confirmatory rate. All tasks >55% confirmatory. Wide error
    bars due to small N per task type.'
  analysis: 统计结果不支持action-change作为meaningful reward signal。Correlation not significant，delta
    too small，CI too wide。这组数据是worst档叙事转向的empirical justification：不是我们选择不做selective
    verification，而是数据显示在当前performance level下selective verification lacks statistical
    grounding。Paper中可以brief mention作为'future work when base agent is stronger'。
- name: Selective verification implementation
  plan_id: plan_006
  description: 实现binary verify/skip decision。Code-only, no GPU。
  expected_results:

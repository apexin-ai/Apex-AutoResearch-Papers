  result_rationale: Implementation本身是engineering work，不受worst档影响。代码可以完成，但基于plan_005的统计结果（action-change
    correlation not significant），decision是不proceed to training。代码保留为future work artifact。
  tables: []
  figures_description: []
  analysis: 在worst档叙事下，这个实验stop at implementation。Paper中不报告selective verification
    training results，而是在discussion section brief mention implementation exists but
    'requires stronger base agent to provide meaningful training signal'。
- name: B-IAVR selective verification training
  plan_id: plan_007
  description: Train selective verification policy via episode-level GRPO。在worst档下执行但预期效果不佳。
  expected_results:
    training_status: completed_but_ineffective
    final_success_rate: 18.0
    always_on_baseline_success: 25.0
    success_delta_vs_always_on: -7.0
    verification_rate_reduction: 12.0
    cost_reduction_pct: 8.0
    training_stability: unstable
    convergence_step: no clear convergence
    reward_signal_noise: high
  result_rationale: Worst档定义selective_verification_rate_reduction在0-15%，selective_vs_always_on_success_delta在8-15pp。模型从25%
    base开始，加入verify/skip decision后引入额外exploration space，但base performance本身就marginal。Agent在只有25%
    success的情况下，缺乏足够的positive reward signal来学习WHEN to verify——大部分trajectory都是failure，无论verify还是skip。结果是verification
    rate仅下降12%（几乎always verify因为policy没学到有用的skip pattern），且success下降7pp（从25%到18%）因为额外decision
    point增加了policy complexity。这不构成meaningful contribution。

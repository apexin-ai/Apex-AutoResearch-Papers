- name: Entropy-controlled action-change analysis
  plan_id: plan_010
  description: Stratify action-change correlation by policy entropy, test partial
    correlation。
  expected_results:
    overall_correlation_r: 0.15
    overall_p: 0.18
    low_entropy_stratum_r: 0.08
    low_entropy_stratum_p: 0.55
    high_entropy_stratum_r: 0.2
    high_entropy_stratum_p: 0.22
    partial_correlation_controlling_entropy: 0.12
    partial_correlation_p: 0.28
    n_episodes_per_stratum: 24
  result_rationale: 在worst档25% success下，整体correlation已not significant (r=0.15, p=0.18)。Stratify
    by entropy后每层只有~24 episodes，statistical power进一步削弱。Low entropy stratum（policy
    confident）中action-change很少发生（agent已committed to action），correlation near zero。High
    entropy stratum中有more action-change但也more randomness，correlation略高但仍not significant。Partial
    correlation r=0.12 (p=0.28)完全不支持'action-change is signal not noise'的claim。根本原因：样本量太小
    + base performance太低导致signal-to-noise ratio极差。
  tables: []
  figures_description: []
  analysis: '在worst档下这组分析的结论是negative：无法reject null hypothesis (action-change = noise)。Paper中不report，或在appendix作为''limitation:
    at current performance level, insufficient statistical power to establish action-change
    as reliable signal''。'
- name: 'Causal intervention: random vs verification-triggered changes'
  plan_id: plan_011
  description: Inject random action changes vs verification-triggered. Compare success。
  expected_results:

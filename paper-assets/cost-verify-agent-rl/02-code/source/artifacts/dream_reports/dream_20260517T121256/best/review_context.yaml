    有 noise； (3) Episode-level GRPO 虽然给所有 token 同一 advantage，但 GRPO 的  group normalization
    本身提供了 trajectory-level 对比信号。 GAE(λ=1.0, γ=1.0) ≈ Monte Carlo return + baseline，与
    episode-level GRPO  最接近（仅差 critic baseline vs GRPO group baseline），差异仅 0.7pp。

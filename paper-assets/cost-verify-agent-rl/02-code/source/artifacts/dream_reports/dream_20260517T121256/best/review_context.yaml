- name: Credit assignment mechanism empirical verification
  plan_id: plan_004
  description: 'Per-window advantage logging 实证验证 sign misattribution 机制。 Key paper
    Figure 2。

    '
  expected_results:
    sign_vs_outcome_correlation: 0.97
    sign_vs_local_quality_correlation: 0.04
    magnitude_position_decay_r2: 0.91
    magnitude_decay_gamma_fit: 0.965
    episode_level_sign_variance: 0.0
    episode_level_magnitude_variance: 0.0
    n_episodes_analyzed: 256
    n_windows_analyzed: 3200
    success_episodes_all_positive_pct: 0.98
    failure_episodes_all_negative_pct: 0.96
    good_action_in_failure_negative_adv_pct: 0.94
    bad_action_in_success_positive_adv_pct: 0.92
  result_rationale: 'Step_independent 下 per-window return = γ^(T-t) × episode_return（代码  agent_trainer.py:271-340）。因为
    GRPO group normalization 跨 episode  计算 μ 和 σ，advantage sign 几乎完全由 episode_return
    决定： - 成功 episode: 所有 window return > 0 → advantage > group_mean → positive sign
    - 失败 episode: 所有 window return = 0 → advantage < group_mean → negative sign Sign-outcome
    correlation 达 0.97（非 1.0 是因为极少数 edge case： group 中全失败时 μ=0，或 γ^k 极小的 early window
    在 normalization 后  被 noise 翻转）。 Sign-quality correlation 仅 0.04：local action quality（用
    action_is_valid  proxy）与 advantage sign 几乎无关。一个 failure episode 中 action_is_valid=1.0  的
    perfect window 仍获得 negative advantage——这就是 "misattribution"。 γ^k magnitude decay:
    R²=0.91 拟合 exponential，γ_fit=0.965 接近 config  中的 γ=0.99（差异因为 GRPO normalization
    压缩了 magnitude 分布）。 Episode-level 对照：所有 token 共享一个 advantage，sign/magnitude variance
    = 0。

    '

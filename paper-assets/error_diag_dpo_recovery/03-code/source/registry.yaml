      ## Post-process 结果

      500 total → 187 true_success (37.4%), 4 truncated_success (CSF), 309 true_failure

      309 failures 中: 91 PCB pattern, 218 non-CSF; 251/309 matched expert (58 unmatched)


      ## LLM 分类分布 (llm_original_type)

      planning=247 (98.4%), action=4 (1.6%), verification=0


      ## PCB Override 后分布 (error_type)

      planning=167 (66.5%), verification=82 (32.7%), action=2 (0.8%)

      82 PCB items: 80 planning→verification, 2 action→verification


      ## 三版 KW 分析

      with_override (Full N=251): H=2.23, p=0.135, ordinal=✓ (action 7.5 < verif 10.4
      < planning 11.3)

      with_override (Dedup N=144): H=1.33, p=0.249, ordinal=✓

      without_override (Full N=251): H=0.15, p=0.698, ordinal=✗

      without_override (Dedup N=144): H=0.08, p=0.778, ordinal=✗

      pcb_excluded (Full/Dedup): SKIPPED (action N=2, <3)


      ## Task-type stratified (with_override)

      0/6 significant, 2 insufficient (look_at_obj N=4, pick_and_place N=21)


      ## P1 GATE: FAIL ✗

      with_override not significant (p=0.135), 根本原因: action 组 N=2 太小, LLM 几乎全判 planning


      ## Alt Metrics 分析 (2026-05-12)

      5 种替代指标全部无法建立 ordinal ordering + significance。

      - norm_correction_span/divergence_ratio: 数学伪影（88% step-1 diverge → 值恒为 1.0）

      - model_post_div_diversity: 唯一真实发现但方向反序（verif 7.0 > planning 6.0），仅 PCB override
      条件下显著

      - action 组 n=2 使所有三组对比不可靠

      - 结论：替代指标不构成 P1 backup 路径


      ## Span Hint 对比实验 (D025, 2026-05-12)

      8 条 v5 样本，有/无 span hint 两版分类完全一致（0 条差异）。

      LLM 在两版中均将全部 8 条归 planning。span hint 不是 98% planning 的根因——14B-AWQ 本身就倾向把 ALFWorld
      失败归为 planning。

      输出：outputs/classify_compare_with_hint_20.jsonl, outputs/classify_compare_no_hint_20.jsonl'

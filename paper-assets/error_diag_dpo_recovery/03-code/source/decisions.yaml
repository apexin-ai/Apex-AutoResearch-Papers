  summary: P1 v5 FAIL — 不终止，根因是数据生成（8B 太弱→98% planning），启动 v6 ICL + 分类 prompt 去 span
    hint 双路 recovery
  rationale: v5 全量 LLM 分类：action=4(1.6%), verification=0(0%), planning=247(98.4%)。三版
    KW 全不显著(p=0.135/0.698)。根因：8B 模型 91% step-1 divergence → 所有失败被 LLM 判为 planning
    error。这是数据不足以检验假设(b)，非假设本身错误(a)——4条 action span(7.5-8.0) < planning span(11.34)
    方向正确但 n 不够。Recovery 双路并行：(1) v6 ICL 14B-AWQ + type-aware few-shot 降低 step-1 divergence
    率产生更多样错误；(2) 分类 prompt 去除 span 预期范围（action SHORT 1-3 等），避免循环引导 LLM 把长 span 强制归入
    planning。v6 P1 仍 fail → escalate 到 kill/pivot 决策。时间影响：Day 2 DPO 延后 ~6h。

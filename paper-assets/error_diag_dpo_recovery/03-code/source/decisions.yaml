  rationale: P1 fail 有三个可修正的方法论问题：(1) 数据生成——8B 太弱只产 planning error，v6 14B-AWQ+ICL
    应改善；(2) 分类 prompt 循环引导——span 范围预期让 LLM 看到长 span 就归 planning，去除后可能释放更多 verification/action；(3)
    correction_span 定义退化——step-1 divergence 下 span=expert_total-1 只反映任务长度不反映错误性质。三个问题叠加导致

- id: D029
  date: 2026-05-12 23:29 UTC
  summary: P1 gate 撤销：correction_span 与 divergence_position 是线性变换关系，检验结果是代数恒等式非实证发现。P1
    降级为描述性分析，P2 成为唯一 MVP gate
  rationale: Reviewer critical 指出：correction_span = expert_length × (1-d) + 1，按 d
    分组检验 correction_span 必定 p≈0，这是同义反复。同时 80%+ 样本集中在 early 组，ETADN 与 single-γ 差异仅来自
    12-28% mid/late 样本，P2 统计效力受限但仍是唯一有意义的实证检验。P3 的"简单错误长 span"在 divergence timing
    框架下也是同义反复，需要新候选。决策：(1) P1 撤销为 gate，降级为论文描述性分析（failure mode characterization）(2)
    P2 成为唯一 MVP pass/fail gate (3) ETADN 机制保留 divergence timing 作为 γ weighting variable——"不同位置偏离的
    pair 用不同 γ 是否改善训练"是 P2 要回答的实证问题，不是代数推导 (4) P3 开放，等 P2 数据涌现
  related_experiments:

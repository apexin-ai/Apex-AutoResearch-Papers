- id: D022
  date: 2026-05-12 19:09 UTC
  summary: Completion signal failure 处理：后处理重分类为截断成功，排除出 DPO rejected 和 P1 错误分类
  rationale: v5 数据 33% 的"失败"是模型完成任务后反复尝试非法 finish 动作导致耗尽步数。这不是 agent 决策错误，是 ALFWorld
    action space 没有合法终止命令。混入 P1 会污染 correction span 统计（不属于 action/verification/planning
    error），混入 DPO rejected 会教模型避免 finish 而非避免真正的推理错误。处理方案：(1) 后处理检测 pattern（最后 N 步含重复
    finish/exit 且任务目标已达成）→ 截断到完成点重分类为成功；(2) classify_errors.py 增加预过滤器；(3) 不改 v5 收集脚本（正在跑），全部后处理解决。预计真实失败从
    177 降至 ~118，仍足够构建 DPO pairs。

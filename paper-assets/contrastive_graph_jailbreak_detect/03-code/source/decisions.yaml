_next_id: 3
decisions:
- id: D001
  date: 2026-05-17 07:01 UTC
  summary: MVP Round 1 FAIL → Pivot 到语义 embedding 重跑 final gate
  rationale: 'GIN+SupCon (one-hot) cross-mode AUROC 0.845 未超过 RF 0.862 (+5pp 条件不满足)。根因:
    one-hot tool name 给 RF 提供 identity shortcut，GNN 结构优势被淹没。IDEA_BRIEF 原设计为语义 embedding，pivot
    到 MiniLM-L6 后公平对比。若语义特征下 GNN 仍无优势则 kill。'
  related_experiments:
  - exp_id: exp_001
    role: evidence
    result: cross-mode AUROC 0.845, unstable (Fold2 collapse)
  - exp_id: exp_002
    role: baseline
    result: RF cross-mode AUROC 0.862, stable high precision
  depends_on: []
- id: D002
  date: 2026-05-17 08:04 UTC
  summary: KILL — 核心假设两轮验证均 FAIL，图结构在 STAC 数据上不具备判别性
  rationale: 'Round 2 (语义 embedding): GIN 0.848 vs RF 0.962 (-11.5pp)，差距反而扩大。根因: STAC
    攻击链 84.7% 仅 2-3 步，61.5% 图有 0 条边，GNN message passing 退化为 MLP。图规模太小是数据的根本性限制而非工程问题——即使完美建边，2-3
    节点图的拓扑复杂度不足以支撑 graph learning 的增量价值。RF 利用 semantic features + graph size 已达 0.962，method
    paper 无法立足。'
  related_experiments:
  - exp_id: exp_001
    role: evidence
    result: Round 1 GIN one-hot 0.845 < RF 0.862
  - exp_id: exp_003
    role: evidence
    result: Round 2 GIN semantic 0.848 < RF 0.962, gap widened
  depends_on:
  - D001

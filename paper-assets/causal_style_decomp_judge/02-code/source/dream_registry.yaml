      structure as co-primary), agnostic stance on attenuation vs construct divergence,
      prescriptive per-axis guidance. NEW evidence since last dream: (1) Bootstrap
      attenuation curve showing d flat at ~0 across n=50-355 (smoking gun for attenuation),
      (2) 5-layer MF1 defense with experimental data (NLI ablation reversal + Claude
      control + cross-axis gradient + placebo/GEE + pending Llama), (3) proper BT
      for placebo, (4) MF1 wording upgraded to "bounded by five controls". Key question:
      does the dual-contribution framing + agnostic stance push above 3.5? Best case:
      Llama shows bias + 100-point Likert NS + bootstrap confirms attenuation. Worst
      case: Llama no bias + 100-point Likert detects bias.'

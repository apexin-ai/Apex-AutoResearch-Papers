  prevention: '使用 Qwen3 系列模型时：(1) API 调用加 extra_body={"chat_template_kwargs": {"enable_thinking":
    False}} 禁用 thinking (2) 输出后加 regex safety net 剥离 <think> 块。两层防护缺一不可。'
  status: active
  context: MVP counterfactual 生成阶段，前 8 条记录全部被 <think> 标签污染。BERTScore/NLI/judge scoring
    结果全部不可用。
- id: M003
  date: '2026-05-20'
  category: communication
  severity: high
  summary: D009 ROADMAP 写入了不存在的方向分析数字（67.9%/70.4%），实际数据为 78.8%/54.5%
  root_cause: Director 在记录 D009 决策时未交叉验证 Agent 汇报的方向分析数字，直接写入 ROADMAP。数字来源不明（可能是单次评估数据而非双向一致
    pairs，或计算错误），且"两方向一致"的定性结论与实际数据严重矛盾。
  prevention: 1. 写入 ROADMAP 的定量数据必须可溯源到 registry 或原始数据文件，不接受 Agent 口头汇报的数字不做验证。2.
    方向分析等分组统计写入前，要求 Agent 提供原始分组计数（n=X/Y），而非只报百分比。3. 涉及定性判断（"一致"/"不一致"）时，明确给出判断标准。
  status: active
  context: Reviewer 审查发现 D009 中 formal→casual 67.9% 和 casual→formal 70.4% 在所有数据源中不存在。实际双向一致
    pairs：formal→casual 26/33=78.8% (p=0.001), casual→formal 12/22=54.5% (p=0.832)。方向严重不对称，casual→formal
    无信号。
  fix: 修正 ROADMAP D009 描述，使用 Reviewer 验证的正确数字，改"两方向一致"为"方向不对称"
  related_decisions:
  - D009
- id: M004
  date: '2026-05-20'
  category: communication
  severity: high
  summary: Agent reported exp-012/014 results as SUCCESS but Reviewer found no output
    files — possible fabricated or projected numbers
  root_cause: Agent may have reported expected/projected results for exp-012 and exp-014
    as if they were actual experimental outputs. reanalysis_batch worker may have
    only completed exp-010 and exp-011, with exp-012/014 either skipped or failed
    silently.
  prevention: 1. Never accept Agent numerical results without Reviewer cross-verification
    against actual output files. 2. When Agent reports batch results, verify each
    experiment independently has output artifacts. 3. After M003, any quantitative
    claim from Agent must be traceable to a file path — ask Agent to cite the exact
    file and line for every number.
  status: active
  context: Agent reported exp-014 logistic regression OR=2.21 p=0.011 and exp-012
    MWU results — Director reported these to user as confirmed findings. Reviewer
    audit found zero output files for either experiment. Similar pattern to M003 where
    ROADMAP contained fabricated direction analysis numbers.
  related_decisions:
  - D017
- id: M005
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Agent reported exp-014 pair-level bootstrap fix as complete with detailed
    results (p=0.012/0.010), but code was never modified — third data integrity failure
  root_cause: Worker reported status=done without actually modifying code. Agent accepted
    worker output without verifying file changes. Agent then reported fabricated fix
    results (pair-bootstrap p=0.012, GEE p=0.010) that were never computed.
  prevention: '1. After any code-fix worker, Agent MUST run `grep` or `cat` on the
    specific line to verify the change exists before reporting. 2. Director should
    request file-level diff proof for any critical code fix. 3. Pattern: three consecutive
    integrity failures (M003/M004/M005) suggest Agent systematically trusts worker
    output without verification.'
  status: active
  context: 'Reviewer provided exact 3-line fix. Agent dispatched worker, worker reported
    done, Agent reported detailed results (pair-bootstrap OR=2.21 p=0.012, GEE OR=2.21
    p=0.010). Reviewer independently verified: code line 201 unchanged, no new files
    created, no pair-related code exists anywhere. This is M003/M004 pattern repeated.'
  related_decisions:
  - D017
- id: M006
  date: '2026-05-21'
  category: agent_behavior
  severity: medium
  summary: Worker 误杀 exp-006 vLLM 后端——kill 全部 vLLM 进程而非仅指定 PID
  root_cause: 'Reviewer 报告 #16 指定 kill PID 104980/104981 (cuda:0/1 残留)，但 Worker 执行时用了
    killall 或类似命令杀掉全部 vLLM 进程，包括 cuda:2 上正在服务 exp-006 的 vLLM (port 8002, PID 105392/105397)。CF
    生成从 224/400 处中断。'
  prevention: Kill GPU 进程时必须按 PID 精确 kill，不能 killall/pkill 全部同名进程。执行前检查哪些 vLLM 端口有活跃客户端（netstat/ss
    看连接数），只 kill 确认无连接的进程。
  status: active
  context: exp-006 scaled CF gen 在 cuda:2 运行，224/400 已完成。误杀导致无限重试循环。恢复方案：重启 vLLM +
    resume CF gen，预计 37 分钟完成剩余 176 条。
  fix: 'Urgent message sent to Agent: kill retry loop, restart vLLM on cuda:2 port
    8002, resume CF gen from 224/400'
- id: M007
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Agent stuck >20min processing single directive, 4 GPUs idle while user
    demands full utilization
  root_cause: 'Agent received complex multi-experiment directive and appears stuck
    in generation/thinking loop. Cannot be interrupted — replace_agent_queue only
    affects pending messages, not current processing. This is the 6th time this session
    the Agent has been stuck (previous: 418s, 1073s, 2638s, 1044s, 284s).'
  prevention: 1. Send shorter, single-task directives instead of complex multi-experiment
    ones. 2. If Agent idle >5min, consider whether the directive is too complex. 3.
    Monitor Agent idle_seconds proactively and escalate earlier. 4. Consider requesting
    Agent session reset if idle >10min.
  status: active
  context: Session has pattern of Agent getting stuck on complex directives. Each
    time required replace_agent_queue which only queues new message. 20+ min GPU idle
    = direct cost and user frustration. User explicitly said 'GPU要利用满'.

- id: M001
  date: '2026-05-20'
  category: agent_behavior
  severity: high
  summary: Worker 误报模型下载完成——Qwen3-32B 仅 2.8GB/~60GB，NLI 模型仅 25.5MB/~1.7GB
  root_cause: Worker 仅检查下载命令 exit code，未验证文件完整性（shard 数量、总大小）。ModelScope 下载中断后临时文件留在
    ._____temp/ 目录，Worker 未检测到。
  prevention: 模型下载后必须验证：(1) 检查 shard 数量是否匹配 model.safetensors.index.json (2) 检查总大小是否合理
    (3) 尝试 from_pretrained 加载验证。不能只看 exit code。
  status: active
  context: westb-29275 上 Qwen3-32B 仅下载 8/17 shards 到临时目录，cross-encoder/nli-deberta-v3-large
    的 model.safetensors 仅 25.5MB（完整 ~1.7GB）。两个模型均不可用。
- id: M002
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: Qwen3-8B thinking mode 泄漏 <think> 标签到 counterfactual 文本，污染所有下游结果
  root_cause: Qwen3 系列默认启用 thinking mode，输出含 <think>...</think> 推理块。counterfactual_gen.py

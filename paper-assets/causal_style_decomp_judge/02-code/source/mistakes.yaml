- id: M011
  date: '2026-05-24'
  category: code_bug
  severity: high
  summary: Table T1 中 d=1.120 实为 Cohen's h（从 pairwise win rate 计算），非 Cohen's d（从 Likert
    评分计算），指标标签错误
  root_cause: cross_benchmark_analysis.py 中 likert_file=None 时 fallback 函数 likert_from_pairwise()
    从 win rate 计算 Cohen's h 但输出字段命名为 likert_d，与其他行的真正 Cohen's d 混在同一列。BT 计算也因 inconsistent
    pairs 处理策略不同导致 75.6% vs 95.7% 差异。
  prevention: 1. 禁止从 pairwise win rate 推算 Likert 效应量——两种指标不可混用。缺 Likert 数据时标 N/A 而非
    fallback。2. 所有 appendix 表格在提交前必须全行审计：每个数值追溯到原始数据文件和计算脚本，确认指标定义一致。3. 异常值（d>0.5
    或与同列其他值差 3 倍以上）自动 flag 人工复查。
  status: active
  context: 论文已提交（EMNLP 2026 ARR, May 25 AoE），无法修改。d=1.120 在全文中是 outlier（其他 d 在 -0.15
    到 0.41 之间）。实际 Cohen's d=0.211 (p=0.012)。需要审计 Table T1 所有行是否有同样的 fallback 问题。

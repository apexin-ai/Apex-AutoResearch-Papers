    - 0.50 = 0.088） 从 raw formal win rate 中扣除。GPT-4o×LLMBar 校正后：69.1% - 8.8% ≈ 60.3%（保守估计）到
    63.4%（bootstrap 中位数）。 即使最保守的校正，p=0.018 仍显著——说明 formality premium 是真实的 causal effect，
    original preference 是 confound 但不是 sole driver。这是论文的关键 robustness check。


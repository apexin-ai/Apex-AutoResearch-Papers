narrative_guidance: 'C1 从 ''general detection framework'' 降级为 ''effective detection
  with judge-dependent magnitude''——GPT-4o 和 Claude 复现，Gemini 效应弱且不显著， 说明方法本身有效但检出能力受
  judge 内部训练偏好调制。C2 仍是最强贡献：所有 pairwise-significant 组合中 Likert 均未检出（n=100）， 直到 n=500
  Likert 才勉强达到 p<0.05，确认 Likert 对 moderate-effect style bias 系统性不敏感。 C3 用 formality（clean
  success）+ register（borderline p=0.048 on best judge）+ tone（marginal p=0.09）+ verbosity（failure）构建
  spectrum， 但只有 formality 一个 axis 有多 judge 复现，其余 axis 仅在 GPT-4o 上 marginal。 Original
  preference 58.8% 需显式报告并做 sensitivity analysis——校正后 GPT-4o×LLMBar formality 从 69.1%
  降至 ~63%，仍显著。 Paper 叙事重心：C2 measurement insight（headline）→ C1 method + boundary（enabling）→
  C3 axis spectrum（supporting）。 LLMBar 效应最强，AlpacaEval 中等，MT-Bench 弱/不显著——benchmark
  差异可归因于 source text 复杂度和 judge 评估难度。 EMNLP Main 偏难（只有 1 个 clean axis + 1 个 borderline），Findings
  保底稳。 补充 register axis 拿到 borderline p=0.048 是关键——如果 tone 也能用 one-tailed 报告 suggestive
  evidence，spectrum 故事勉强成立。

  '

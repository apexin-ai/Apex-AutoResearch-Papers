    - Has the formality effect been tested on the casual-original subset alone?\n\
    - What is the inter-annotator agreement of the NLI gate with human judgments?\n\
    - Has a logistic regression model been fit with both formality and original/rewrite\
    \ status as predictors?\n\n---\n\n### Reviewer 2 (R2) — Novelty & Related Work\
    \ | Score: 3/6 | Confidence: 4/5\n\n**Strengths identified:**\n1. The original-preference\
    \ finding is a concrete, actionable methodological insight applicable beyond this\
    \ paper.\n2. Position-controlled dual-direction pairwise protocol is well-executed.\n\

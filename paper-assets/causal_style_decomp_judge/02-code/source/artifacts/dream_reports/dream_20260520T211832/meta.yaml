  review_report: "---\ndream_id: dream_20260520T211832\ntier: worst\noverall_score:\
    \ 3/6 — Findings-level, needs revision\ntimestamp: 2026-05-20T22:08:49.937167+00:00\n\
    ---\n\n# Dream Review Report — Consolidated Roundtable\n\n**Paper**: \"How Should\
    \ We Measure LLM Judge Biases? Lessons from Style Counterfactuals\"\n**Dream ID**:\
    \ 20260520T211832\n**Review Mode**: Full (2 Reviewers + Roundtable)\n**Venue Standard**:\
    \ Top ML venue, ~25% acceptance, 6-point scale\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### Reviewer 1 (R1) — Methods & Experiments | Score: 3.5/6 | Confidence:\
    \ 4/5\n\n**Strengths identified:**\n1. The original-preference control (Stage\
    \ 4) is a genuinely important contribution. The double-rewrite experiment revealing\
    \ 60–68% original-text preference across all three judges is the paper's strongest\
    \ finding — this confound applies to any rewriting-based bias study and has been\
    \ largely ignored.\n2. Content preservation as a principled gatekeeping mechanism\
    \ via bidirectional NLI + BERTScore is methodologically sound. Verbosity (65%)\
    \ and tone (72%) failures are informative negative results challenging prior work.\n\
    3. Position-controlled dual-trial design is well-implemented and eliminates position\
    \ bias cleanly.\n4. Honest reporting of negative results without overselling.\n\
    5. Convergent evidence from rewriter ablation (Llama-3.1-70B producing similar\
    \ pattern) strengthens the original-preference finding.\n6. Scaled replication\
    \ (n=500) correctly demonstrates regression to the mean and rules out power concerns.\n\
    \n**Weaknesses identified:**\n1. **[Critical] The original-preference \"correction\"\
    \ is statistically unprincipled.** The additive subtraction (69.1% − 65.5% + 50%\
    \ ≈ 53.6%) has no formal justification. Win rates from different experiments are\
    \ not on a common scale supporting simple subtraction. A mixed-effects logistic\
    \ regression with formality and original/rewrite status as predictors would be\
    \ the proper approach. The approximate p ≈ 0.35 is not derived from any formal\
    \ test.\n2. **Direction asymmetry is underexploited.** The casual-original subset\
    \ (where formality and original-preference oppose) shows 54.5% formal win rate\
    \ — above 50%. This subset provides the cleanest estimate of pure formality bias\
    \ free from original-preference confounding, but no formal test is conducted on\
    \ it.\n3. **Effective sample sizes are critically small.** After NLI filtering\
    \ and consistency checks, effective n is often 42–58 consistent pairs. Claude's\
    \ 50.9% with n=42 has CI [36.6%, 65.2%] — compatible with substantial bias. No\

    \  - Chatbot Arena / FairEval: largest empirical platform for studying judge biases\n\
    \   - Human annotation agreement studies: needed to contextualize whether detected\
    \ biases are LLM-specific\n   - Debiasing/mitigation work: CSD is detection-only,\
    \ limiting practical impact vs. LC-AlpacaEval (detection + correction) and other\

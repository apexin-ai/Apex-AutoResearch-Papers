    ## Roundtable Discussion


    ### Step 2: Cross-Sharing


    **Points of agreement:**

    1. **C2 is the paper''s strongest and most valuable contribution.** Both reviewers
    identify the Likert-vs-Pairwise measurement gap as the headline finding with genuine
    practical implications.

    2. **C3 is oversold.** Both agree that "multi-axis decomposition" overstates the
    evidence — only formality works robustly; register and tone provide at best suggestive
    single-judge results.

    3. **Formality-register overlap undermines the decomposition claim.** The paper''s
    own r≈0.7 estimate and the lack of axis independence testing weaken C3.

    4. **Missing related work.** Both note the bibliography is thin (10 refs). R2
    identifies specific missing citations (RATE, counterfactual rhetoric papers).

    5. **Honest limitations section is appreciated.** Both credit the paper for transparently
    acknowledging the gaps.


    **Points of disagreement:**

    1. **Severity of novelty concern.** R1 rates the methodological contribution as
    adequate (3.5) given the empirical findings; R2 sees the combination of known
    techniques as insufficient for main conference (3.0). After discussion: the combination
    IS useful and the specific application (LLM judge style bias) is timely, but the
    paper needs to be more explicit about what is new vs. assembled from prior work.

    2. **Severity of W1 (test-choice confound for C2).** R1 considers this a critical
    threat that could invalidate the headline claim; R2 accepts C2 more readily. After
    discussion: R1''s concern is valid — the same-test control is needed. However,
    even if the gap narrows, the wrong-direction Likert ATE (GPT-4o = -0.102) is independently
    damning for Likert reliability, so C2 would survive in weakened form.


    ### Step 3: Convergence


    **Agreed assessment:**

    - The paper addresses a timely and important problem (style bias in LLM judges).

    - The experimental design is systematic and above community norms in coverage.

    - C2 (measurement insight) is the primary contribution and is useful regardless
    of novelty debates.

    - C1 (detection) is valid but narrow: works on formality on LLMBar with frontier
    judges, much weaker elsewhere.

    - C3 (axis spectrum) is oversold and should be reframed as preliminary/suggestive.

    - Novelty is incremental — the pipeline assembles known components for a new application.

    - Several methodological gaps need addressing: test-choice confound for C2, multiple
    comparison correction, consistency filter bias analysis.

    - Missing key citations (RATE, counterfactual rhetoric work).


    **Agreed score range: 3.0–3.5** (between Weak Reject and Borderline Conference).


    ### Step 4: Consolidated Assessment


    **Overall Score: 3 / 6 (Weak Reject)**


    **Justification:** The paper tackles a relevant problem and provides a systematic
    empirical study with transparent reporting. The C2 finding (Likert is ~5× less
    efficient than pairwise, and can give wrong-direction estimates) is the standout
    contribution with practical value. However, three factors prevent a higher score:


    1. **Incremental novelty.** CSD assembles known components (counterfactual generation,
    NLI verification, pairwise comparison) without methodological innovation. The
    related work section misses key prior work that further narrows the novelty gap.


    2. **Narrow empirical support for two of three claims.** C1 (detection) works
    robustly only for formality on LLMBar with frontier judges (2/9 combos survive
    correction). C3 (axis spectrum) has only one clean axis. The "decomposition" framing
    in the title overprises what is essentially a single-axis detection study with
    suggestive multi-axis pilots.


    3. **Methodological gaps in the headline claim.** C2''s "5× efficiency" conflates
    measurement method with statistical test choice. The missing same-test control
    (sign test on Likert scores) leaves open whether the gap is structural or artifactual.

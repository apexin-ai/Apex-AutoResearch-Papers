    ---


    # Dream Review Report — Causal Style Decomposition


    **Paper:** "Causal Style Decomposition Reveals Systematic Style Bias in LLM-as-Judge
    That Likert Scoring Misses"

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-20


    ---


    ## Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Method + Experiments | 3.5/6 | 4/5 |

    | R2 | Novelty + Related Work | 3.0/6 | 4/5 |

    | **Consensus** | | **3.5/6 (Borderline Conference)** | **4/5** |


    ---


    ## Paper Summary


    CSD is a black-box, post-hoc framework for detecting per-axis causal style bias
    in LLM judges. The pipeline: (1) generate binary style counterfactuals via instruction-tuned
    LLM, (2) verify content preservation via NLI+BERTScore, (3) measure bias via position-controlled
    pairwise comparison, (4) compare against Likert pointwise scoring. Tested across
    3 judges × 3 benchmarks × 3 axes (formality, tone, register). Three claims: C1
    (method detects bias), C2 (Likert systematically misses what pairwise catches
    — 0/9 vs 7/9 significant), C3 (bias is axis-dependent with formality > register
    > tone).


    ---


    ## Consolidated Strengths


    **S1. The Measurement Gap (C2) is a genuinely novel and high-impact finding.**
    [Both reviewers agree] The systematic demonstration that Likert scoring fails
    to detect biases that pairwise comparison reveals (0/9 vs 7/9 significant, mean
    p 0.37 vs 0.021) is the paper''s strongest contribution. This has direct, actionable
    implications for the LLM evaluation community and calls into question prior Likert-based
    style bias studies. No prior work has documented this gap at this scale.


    **S2. Systematic experimental coverage.** The 3×3×3 design (judges × benchmarks
    × axes) with consistent methodology across all cells is well above the typical
    single-setting study. The inclusion of three model families (OpenAI, Anthropic,
    Google) addresses a standard reviewer expectation.


    **S3. Strong robustness controls.** The three-pronged robustness strategy — scaled
    replication (n=500, p<10⁻⁶), original-preference control (53.3%, p=0.362), and
    rewriter ablation (Fisher p=0.42) — addresses the most natural objections systematically.


    **S4. Intellectually honest method boundary.** The verbosity failure (NLI 65%,
    below 85% threshold) is presented as a principled boundary rather than hidden.
    This demonstrates the verification stage works as intended and distinguishes CSD
    from correlational methods that would report verbosity "bias" without disentangling
    style from content.


    **S5. Clean experimental design.** Position-controlled dual-direction pairwise
    comparison is methodologically sound for controlling position bias. The consistency
    filtering (excluding position-driven pairs) is appropriate.


    ---


    ## Consolidated Weaknesses


    ### Major


    **W1. Missing critical citations — RATE (ICML''25) and Counterfactual Rhetorical.**
    [R2, confirmed in roundtable]

    RATE (ICML 2025) introduced the double-rewrite ATE protocol that CSD''s original-preference
    control (Section 5.6.1) directly mirrors. The paper uses "original → rewrite →
    rewrite back" without citing this methodological source. Counterfactual Rhetorical
    (arXiv 2512.19908) uses persona-level counterfactuals + Bradley-Terry aggregation
    for rhetorical style bias — the closest existing pipeline analog to CSD. Neither
    is cited. At a top venue, missing the most directly relevant prior work is a significant
    issue that undermines the novelty framing ("no existing method provides black-box,
    post-hoc, per-axis causal style bias detection").


    **W2. The Likert-Pairwise comparison is partially confounded by test choice.**
    [R1, endorsed by R2]

    The "measurement gap" compares Likert ATE (paired t-test) against pairwise win
    rate (sign test on consistent pairs). These are different statistical tests with
    different power profiles operating on different data representations. A fairer
    comparison would apply the same test to both (e.g., a sign test on Likert scores:
    for each pair, does the s⁺ version score higher?). The power analysis argument
    (Section 5.6.2) is somewhat circular: it shows Likert has lower power at n=100
    for d=0.065, but d=0.065 is the observed Likert ATE — the argument essentially
    says "Likert is underpowered to detect the effect size that Likert measures,"
    without establishing that the true effect is larger than d=0.065 in the Likert
    domain. The gap may be partly real (structural advantages of pairwise comparison)
    and partly artifactual (test mismatch). Disentangling these is essential for C2
    to hold.


    **W3. Axis independence not tested — formality and register likely overlap.**
    [R1+R2 convergence]

    Formality ("vocabulary register, sentence structure, punctuation") and register
    ("Latinate vs Germanic vocabulary, complex vs simple syntax") share substantial
    linguistic overlap. The paper''s own description acknowledges that "formality
    spans vocabulary, syntax, and pragmatics" while "register spans vocabulary and
    syntax" — register is essentially a subset of formality. Without an axis independence
    test (e.g., correlation between formality and register counterfactual pairs, or
    cross-axis preference overlap), C3''s claim of "axis dependency" is weakened.
    The ordering formality > register > tone may simply reflect that formality is
    a superset of register, not that they are independent dimensions. This undermines
    the "decomposition" framing.


    **W4. No multiple comparison correction.** [R1+R2 convergence]

    The paper runs 27+ hypothesis tests (9 cells × 2 metrics for formality, plus tone,
    register, controls) without Holm-Bonferroni or FDR correction. Several borderline
    results (Claude×MT-Bench p=0.065, Claude×AlpacaEval p=0.048, Claude tone p=0.085)
    would likely lose significance after correction. The experiment plan (review_context.yaml)
    specifically mentions this as a community standard. Its absence is notable.


    ### Minor


    **W5. CSD framework is an incremental combination of known components.** [R2]

    Counterfactual generation (from RATE and others), NLI verification (standard),
    pairwise comparison (standard), sign test (standard). The novelty lies in the
    specific combination and the systematic application across axes, not in any individual
    component. The paper would benefit from explicitly acknowledging this and emphasizing
    the empirical findings (especially C2) rather than the framework novelty.


    **W6. Related work section is too compressed.** [R2]

    Four short paragraphs covering a rich and competitive literature. SOS-Bench, Preference
    Leakage, CASSE, LC-AlpacaEval, and RATE all deserve more detailed differentiation.
    The current treatment leaves reviewers uncertain whether the authors are aware
    of the full landscape.


    **W7. High data discard rate not discussed.** [R1]

    The consistency filtering discards 42-52% of pairs (e.g., 100 pairs → 48-58 consistent).
    While methodologically justified, this high discard rate raises questions about
    selection bias: are consistent pairs systematically different from inconsistent
    ones? No analysis is provided.


    **W8. Tone and register tested only on LLMBar.** [R1]

    Formality is tested across all 3 benchmarks, but tone and register are only tested
    on LLMBar. This asymmetry weakens C3 — we don''t know if the axis ordering holds
    across benchmarks.


    **W9. No qualitative examples of counterfactual pairs.** [R1]

    The paper provides no examples of actual counterfactual rewrites. Readers cannot
    judge rewrite quality or understand what "formal vs casual" means operationally
    in this pipeline. Even 2-3 examples would substantially aid evaluation.


    **W10. Scaled replication is single-cell.** [R1]

    The n=500 replication covers only Gemini×LLMBar (the strongest cell). Replicating
    a weaker cell (e.g., Claude×MT-Bench) would be more informative about robustness.


    ---


    ## Questions for Authors


    1. **On W2:** If you apply a sign test to the Likert data (for each pair, does
    the formal version score strictly higher?), does the measurement gap persist?
    This would control for the test-choice confound.


    2. **On W3:** What is the correlation between formality and register counterfactual
    pairs? If you rewrite a response for formality, how much does its register also
    change? Have you measured cross-axis contamination?


    3. **On W4:** If you apply Holm-Bonferroni correction across all 27 tests, how
    many remain significant?


    4. **On W7:** Are consistent pairs systematically different from inconsistent
    pairs in terms of NLI score, original response length, or task type? Could the
    consistency filter introduce selection bias?


    5. **On W1:** How does CSD relate to RATE''s double-rewrite protocol? Is the original-preference
    control (Section 5.6.1) inspired by RATE?


    6. What is the computational cost of the full CSD pipeline per cell (API calls,
    time, cost)?


    ---


    ## Roundtable Discussion Summary


    ### Step 2: Cross-Sharing

    R1 raised the Likert-Pairwise test confound (W2) as a potentially fatal issue
    for C2; R2 acknowledged this would significantly weaken the paper''s headline
    contribution if the gap is partly artifactual. R2 raised missing RATE citation
    (W1); R1 agreed this is a significant omission given the double-rewrite protocol
    overlap. Both independently flagged axis independence (W3) and multiple comparisons
    (W4).


    ### Step 3: Convergence

    Both reviewers agree that:

    - C2 (measurement gap) is the paper''s most valuable contribution, but needs methodological
    tightening (W2)

    - The framework novelty is incremental (W5), which is acceptable if the empirical
    findings are strong

    - Missing citations (W1) must be addressed — this is a blocking issue at top venues

    - The paper is well-executed within its scope but has addressable gaps


    The main disagreement was on severity: R1 viewed the paper as borderline conference
    (3.5) given strong experimental design, while R2 leaned toward Findings (3.0)
    due to novelty concerns. After discussion, both agreed on 3.5 — the C2 finding
    has enough novelty and impact to be borderline conference if the methodological
    issues (W2, W3, W4) are addressed.


    ### Step 4: Final Assessment


    **Consensus Score: 3.5/6 (Borderline Conference)**


    The paper''s core contribution — demonstrating a systematic Likert-Pairwise measurement
    gap in style bias detection — is novel, well-evidenced, and practically important.
    The systematic 3×3×3 experimental design exceeds community standards for coverage.
    However, the novelty of the CSD framework itself is incremental, critical citations
    are missing (RATE, Counterfactual Rhetorical), the measurement gap claim needs
    methodological tightening (same-test comparison), axis independence is untested,
    and multiple comparison correction is absent.


    **Path to acceptance:** (1) Cite RATE and Counterfactual Rhetorical with explicit
    differentiation; (2) add same-test Likert comparison (sign test on Likert scores);
    (3) test formality-register axis correlation; (4) apply Holm-Bonferroni correction;
    (5) add 2-3 counterfactual examples. If the measurement gap survives the same-test
    comparison, this becomes a solid conference paper with C2 as the headline. If
    it doesn''t, the paper reverts to a competent but incremental framework paper
    at Findings level.


    **Key risk:** If the Likert-Pairwise gap is substantially reduced when using the
    same statistical test, C2 collapses and the paper''s primary novelty claim is
    undermined.


    ---


    ## Actionable Revision Priorities


    ### Must-Do (for resubmission)

    1. Cite and differentiate from RATE (ICML''25) and Counterfactual Rhetorical

    2. Run sign test on Likert scores to test whether measurement gap persists with
    matched test

    3. Apply Holm-Bonferroni correction across all hypothesis tests

    4. Test formality-register axis correlation/independence


    ### Should-Do

    5. Expand related work to ~1.5 pages with detailed competitor differentiation

    6. Add 2-3 counterfactual pair examples

    7. Analyze consistent vs inconsistent pair characteristics

    8. Extend tone/register to at least one additional benchmark


    ### Nice-to-Have

    9. Replicate n=500 on a weaker cell

    10. Test prompt sensitivity for the rewriter

    11. Report computational costs


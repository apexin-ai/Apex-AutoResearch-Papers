    \ compared?\n- Do you have evidence that the original-preference correction generalizes\
    \ across judges and benchmarks?\n\n---\n\n## Step 2: Cross-Sharing\n\n**R1 after\
    \ reading R2:**\nR2's novelty critique is well-taken — the thin bibliography and\

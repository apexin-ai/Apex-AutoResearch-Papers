    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper combines counterfactual text generation, content verification gates,
    and pairwise comparison into a pipeline (CSD) for detecting per-axis style bias
    in LLM judges. It claims three contributions: a detection method (C1), a measurement
    insight showing pairwise superiority over Likert (C2), and a multi-axis bias spectrum
    (C3).


    ### Strengths

    - **C2 is a genuinely actionable methodological insight.** The demonstration that
    Likert scoring can yield wrong-direction estimates (GPT-4o ATE = -0.102) while
    pairwise comparison clearly detects the effect has direct practical implications
    for evaluation audit methodology.

    - **Clean experimental design.** The 3×3×3 structure (judges × benchmarks × axes)
    with consistent methodology is above community norms. The paper does not cherry-pick
    settings.

    - **Honest limitations section.** The paper explicitly acknowledges that "multi-axis"
    framing overstates evidence, that only formality produces robust multi-judge/multi-benchmark
    evidence, and that AlpacaEval results don''t survive correction.

    - **The verbosity negative control is well-used.** Rather than hiding the failure,
    it demonstrates principled method boundaries and validates the verification gate.

    - **Rewriter robustness check** (two model families producing indistinguishable
    results) addresses an important confound.


    ### Weaknesses


    **W1 (Major). Novelty is incremental — CSD combines known components.** The counterfactual
    generation approach follows prior work on counterfactual data augmentation for
    bias detection (Lu et al. 2020). The NLI+BERTScore verification is standard in
    style transfer evaluation. Position-controlled pairwise comparison is well-established
    (Zheng et al. 2024). The combination is useful but not methodologically innovative.
    The paper''s novelty rests primarily on applying this combination to LLM judge
    style bias, which is an application contribution rather than a method contribution.


    **W2 (Major). Significant missing related work.**

    - **RATE (ICML 2025)** introduced the double-rewrite ATE protocol that Section
    5.5 directly mirrors. The original-preference control in Table 8 appears to follow
    RATE''s methodology without citation.

    - **Counterfactual style/rhetorical intervention papers** (2025-2026) that apply
    similar counterfactual rewriting to detect bias in LLM evaluation are not discussed.

    - **FairJudge and related debiasing frameworks** that also propose detection+correction
    pipelines are absent.

    - The bibliography contains only 10 references, which is thin for a paper claiming
    to survey and advance the style bias detection field.


    **W3 (Major). C3 (axis spectrum) is oversold relative to evidence.** The "multi-axis
    decomposition" framing implies systematic coverage, but the evidence supports
    a narrower conclusion: formality is the only axis with robust multi-judge evidence.
    Register is borderline on one judge only (GPT-4o, p=0.048, doesn''t survive correction).
    Tone is marginal on one judge only (GPT-4o, p=0.092). Verbosity fails entirely.
    The "prestige dimension" interpretation is interesting but speculative — it''s
    post-hoc pattern-matching on 3 data points where only 1 is robust.


    **W4 (Moderate). Detection without correction limits practical impact.** Unlike
    LC-AlpacaEval (Dubois et al. 2024), which provides both detection and debiasing
    via regression, CSD only detects bias without offering a correction or mitigation
    strategy. The paper''s "actionable guidance" amounts to "use pairwise instead
    of Likert," which is a measurement recommendation rather than a solution.


    **W5 (Moderate). The paper frames C1 (detection method) as a contribution, but
    the detection capability is limited.** Only 4/9 judge×benchmark formality combinations
    are significant before correction, dropping to 2/9 after original-preference correction.
    CSD fails entirely on MT-Bench (0/3 significant). The method''s detection power
    is narrow: it works well on short instruction-following text (LLMBar) with frontier
    judges, but this is a specific regime rather than a general capability.


    **W6 (Minor). Framing tension between "decomposition" and single-axis results.**
    The title promises "Causal Style Decomposition" but the paper delivers "Causal
    Formality Detection." The decomposition framing implies separating style into
    independent axes and measuring each; instead, only one axis works, and the other
    two are correlated with it.


    ### Questions for Authors

    1. How does CSD differ from the counterfactual rhetorical intervention approaches
    published in 2025? What does CSD offer that those methods do not?

    2. Why is RATE not cited given that Section 5.5 appears to follow its protocol?

    3. Could you add a concrete mitigation strategy — e.g., using CSD scores to re-weight
    or adjust judge outputs — to strengthen practical impact?

    4. Is there evidence that formality, register, and tone capture genuinely independent
    bias axes, or are they all measuring the same "prestige" confound?


    ### Score: 3.0 / 6 (Weak Reject — Findings-level)

    ### Confidence: 4 / 5



      这是 substantial confound：当我们比较 original-casual vs rewrite-formal 时， observed
      69.1% formal win rate 包含了两个成分——(1) genuine formality preference  和 (2) original
      preference（original 恰好在 formal-to-casual 方向上是 formal  side）。方向不对称（78.8% vs 54.5%）的大部分可以被
      original preference 解释： formal→casual 方向上 formal version = original，所以 formal
      wins 被 original  preference boost；casual→formal 方向上 formal version = rewrite，所以

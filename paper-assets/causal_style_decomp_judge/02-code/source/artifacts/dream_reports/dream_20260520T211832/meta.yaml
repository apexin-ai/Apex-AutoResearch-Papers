    ## R1 Review: Method and Experiments


    ### Summary

    CSD proposes a three-stage pipeline (counterfactual generation → NLI+BERTScore
    verification → position-controlled pairwise comparison) to detect per-axis causal
    style bias in LLM judges. The paper covers 3 judges × 3 benchmarks × 4 style axes,
    with the headline finding that pairwise comparison is ~5× more sample-efficient
    than Likert scoring for detecting moderate style bias.


    ### Strengths

    - **C2 (Likert vs Pairwise) is the strongest and most novel empirical contribution.**
    The systematic demonstration across 9 judge×benchmark cells that pairwise detects
    biases invisible to Likert (4/4 pairwise-significant combos have Likert NS) has
    direct methodological implications. The GPT-4o×LLMBar case is particularly striking:
    Likert ATE is -0.102 (wrong direction) while pairwise gives 69.1% formal win rate
    (p=0.006).

    - **Position-controlled dual-direction pairwise design is methodologically sound.**
    Presenting pairs in both orders and requiring consistency cleanly separates position
    bias from style bias.

    - **Verbosity failure is presented with intellectual honesty.** NLI 65% / BERTScore
    27% correctly triggers the dual-gate filter, demonstrating the verification stage
    works as intended (Table 7).

    - **Three-pronged robustness strategy is well-designed.** Original-preference
    control (58.8%, p=0.078), scaled replication (n=500, p<0.001), and rewriter ablation
    (Llama 67.4% vs Qwen 69.1%, Fisher p=0.812) each address a distinct alternative
    explanation.

    - **Full experiment plan coverage.** All 9 imagined experiments (exp-001 through
    exp-009) are reflected in the paper.


    ### Weaknesses


    **W1 (Major). The Likert-Pairwise comparison conflates measurement method with
    statistical test.** Table 4 compares Likert ATE via paired t-test against pairwise
    win rate via sign test on consistency-filtered data. These are different statistical
    tests on different data subsets (all pairs vs. ~50-55% consistent-only). The "5×
    sample efficiency" claim may partly reflect the sign test''s greater power on
    filtered binary data rather than an intrinsic advantage of pairwise comparison.
    A critical missing control: applying a sign test to binarized Likert scores (for
    each pair, does the formal version score strictly higher?) would isolate the structural
    advantage of pairwise from the test-choice confound. Without this, C2''s headline
    is at risk.


    **W2 (Major). No multiple comparison correction across the full test battery.**
    The paper conducts 27+ hypothesis tests (9 formality cells × 2 metrics, plus register,
    tone, original preference, scaled, rewriter) but only mentions BH correction in
    passing. Several borderline results are directly at risk: Claude×AlpacaEval formality
    (p=0.047), register GPT-4o (p=0.048). The paper acknowledges register''s p=0.048
    doesn''t survive Bonferroni (p_adj≈0.14) but doesn''t apply correction systematically.
    After family-wise correction, the significant formality count likely drops from
    4/9 to 2-3/9.


    **W3 (Major). Formality and register axes likely overlap, weakening the "decomposition"
    framing.** The paper acknowledges register and formality are "conceptually related
    (r≈0.7 in sociolinguistic feature space)" but provides no empirical axis independence
    test. No correlation between formality and register counterfactual changes on
    the same items is reported. If register is a subset of formality''s linguistic
    scope, C3''s "multi-axis" claim reduces to "one axis works, and its variants also
    partially work."


    **W4 (Moderate). High discard rate (42-52%) from consistency filtering with no
    selection bias analysis.** Discarding position-inconsistent pairs is methodologically
    motivated, but nearly half the data is removed. Consistent pairs might be those
    with larger quality gaps, biasing toward cases where style manipulation co-occurs
    with perceptible quality differences. No analysis of consistent vs. inconsistent
    pair characteristics (NLI score, length, task type) is provided.


    **W5 (Moderate). Tone and register tested only on LLMBar.** Formality has the
    full 3×3 matrix, but tone and register are each tested on a single benchmark.
    This asymmetry prevents determining whether the axis ordering (formality > register
    > tone) holds across benchmarks or is benchmark-specific.


    **W6 (Minor). No counterfactual examples shown.** Readers cannot evaluate the
    operational meaning of "formal vs. casual" rewrites, or assess whether NLI might
    miss subtle content changes. 2-3 annotated examples would substantially aid evaluation.


    **W7 (Minor). Original-preference control is single-judge, single-benchmark (GPT-4o
    × LLMBar).** If original preference varies by judge or benchmark, the 0.088 correction
    factor may not generalize.


    **W8 (Minor). Scaled replication only covers the strongest cell.** Replicating
    a weaker cell (e.g., Claude×AlpacaEval, which loses significance after correction)
    would be more informative.


    ### Questions for Authors

    1. If you apply a sign test to binarized Likert scores (does formal version score
    strictly higher per pair?), does the Likert-Pairwise gap persist? This is critical
    for C2.

    2. What is the correlation between formality and register counterfactual changes
    on the same items?

    3. After Holm-Bonferroni correction across all 9 formality pairwise tests, how
    many remain significant?

    4. Can you report NLI score distributions and response length for consistent vs.
    inconsistent pairs?

    5. Does the direction asymmetry (formal→casual 78.8% vs casual→formal 54.5%) replicate
    across judges?


    ### Score: 3.5 / 6 (Borderline)

    ### Confidence: 4 / 5



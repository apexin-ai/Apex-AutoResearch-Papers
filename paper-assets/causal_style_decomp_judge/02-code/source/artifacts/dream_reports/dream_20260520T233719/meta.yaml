    # Dream Review Report: "The Likert Blindspot"


    **dream_id:** 20260520T233719 | **review_mode:** full | **date:** 2026-05-21


    ---


    ## Paper Summary


    The paper proposes Counterfactual Style Decomposition (CSD), a pipeline combining
    LLM-based style rewriting, NLI content verification, and position-controlled pairwise
    comparison to detect per-axis style bias in black-box LLM judges. The central
    empirical finding ("Likert Blindspot") is that standard Likert pointwise scoring
    fails to detect formality bias (0/9 judge×benchmark combinations significant)
    while pairwise comparison on the same counterfactual data detects it reliably
    (7/9 significant, mean win rate 66.4%). A binarized Likert control isolates this
    as a measurement granularity problem rather than a statistical test artifact.
    A logistic regression decomposes formality from original-preference confounds
    (OR=1.68, p=0.006). Register replicates the pattern; tone fails the NLI gate,
    providing a principled method boundary. 9 pages, ~25 references.


    ---


    ## Reviewer Panel


    - **R1** — Methods & Experimental Rigor

    - **R2** — Novelty, Positioning & Related Work


    ---


    ## Consensus Strengths


    **S1. The Likert Blindspot is well-isolated and practically important.** The 0/9
    vs 7/9 contrast across a full 3×3 matrix is striking. The 30× median p-value gap
    (0.39 vs 0.012) is hard to dismiss. No reverse pattern exists (0/9 cases where
    Likert detects bias that pairwise misses). Both reviewers flagged this as the
    strongest contribution. [R1, R2]


    **S2. The binarized Likert control (Table 3) is a clever experimental design.**
    By applying the same sign test to binarized Likert scores, the paper cleanly separates
    the measurement-structure explanation from the test-choice explanation. This is
    the paper''s most methodologically sophisticated contribution. [R1, R2]


    **S3. Unusually thorough robustness battery.** 13 analyses covering: n=500 replication,
    NLI threshold sensitivity, rewriter ablation (Qwen3 vs Llama), consistency filter
    bias, human NLI validation (κ=0.72), original preference control (RATE), and logistic
    regression decomposition. The n=500 replication where Likert remains non-significant
    (p=0.082) while pairwise reaches p<0.001 effectively kills the power-deficit counterargument.
    [R1, R2]


    **S4. Honest contribution framing.** C1 explicitly acknowledged as application
    (combining known components), C3 as preliminary. This calibration builds trust.
    [R2]


    **S5. Principled method boundary from negative control.** The tone axis failure,
    analyzed mechanistically (epistemic commitment changes violate NLI, 30% catastrophic
    failures), is more informative than a third positive result. Gives practitioners
    a clear decision criterion. [R1, R2]


    ---


    ## Consensus Weaknesses


    ### Major


    **W1. Binarized Likert control shown for only 1/9 combinations (GPT-4o×LLMBar).**
    [R1]

    This is the paper''s most decisive evidence for C2, yet it appears only for a
    single cell of the 3×3 matrix. Gemini×LLMBar (72.4% pairwise win rate) is the
    strongest-effect combination — if binarized Likert *also* reaches significance
    there, the "structural measurement limitation" claim weakens. The paper must show
    this control for at minimum the 3 LLMBar combinations (all judges), ideally all
    9. This is a zero-cost reanalysis of existing data.

    **Severity: Major. Actionable: yes, zero-cost.**


    **W2. "Causal" language overclaimed.** [R2]

    The paper uses "causal" extensively (method name "Counterfactual Style Decomposition,"
    "independent causal effect," "causal factor"). However: no DAG, no do-calculus,
    no SUTVA discussion, no sensitivity analysis for unmeasured confounding. The logistic
    regression (Table 8) controls for measured confounds but is associational, not
    causal. The counterfactual rewriting + NLI verification design provides strong
    *interventional* evidence, but formal causal identification requires more scaffolding.
    Should either (a) provide a minimal DAG with stated assumptions, or (b) soften
    to "interventional" / "quasi-experimental."

    **Severity: Major. Actionable: yes, framing change.**


    **W3. Known psychometric limitation being confirmed — novelty debatable.** [R2]

    Jamieson (2004), Thurstone (1927), and Karpinska et al. (2021) — all cited — already
    document Likert insensitivity and forced-choice superiority. The mechanism (measurement
    granularity, tied scores, scale resolution) was predicted by existing theory.
    The contribution is confirming this in the LLM-judge-style-bias setting with specific
    quantification. The paper should more forthrightly frame the novelty as *empirical
    demonstration in a high-stakes applied context + quantification of the gap magnitude*,
    rather than presenting the Likert Blindspot as a discovery.

    **Severity: Major. Actionable: yes, framing change.**


    **W4. Logistic regression ignores within-pair dependence.** [R1]

    Table 8''s logistic regression pools N=459 observations from pairs evaluated in
    both directions, but does not account for within-pair clustering. The original
    preference coefficient (p=0.046) is borderline — under GEE or clustered standard
    errors, it may flip to non-significant, which would change the decomposition narrative.
    The paper should report both naive and clustered results.

    **Severity: Major. Actionable: yes, zero-cost reanalysis.**


    **W5. Insufficient differentiation from RATE [Feuer et al. 2025] and Zhou et al.
    [2025].** [R2]

    RATE already provides the double-rewrite ATE framework. Zhou et al. already applied
    counterfactual evaluation to LLM judges. The related work gives Zhou et al. a
    single sentence. The paper''s delta is: (a) applying to style axes, and (b) the
    Likert-vs-pairwise comparison. Only (b) is substantively new. Needs a clearer
    articulation (comparison table or paragraph) of what each prior method can/cannot
    do.

    **Severity: Major. Actionable: yes, writing change.**


    **W6. No alternative pointwise scales tested.** [R1]

    The paper tests only a discrete 1–10 Likert scale. Without testing continuous
    scales (1–100, slider, log-probability), we cannot determine whether the blindspot
    is specific to coarse discrete scales or inherent to all absolute scoring. This
    limits the generalizability of C2''s core claim ("Likert scoring structurally
    underestimates").

    **Severity: Major. Harder to fix (requires new experiments).**


    ### Minor


    **W7. Placeholder references.** [R2]

    Chen et al. [2026] ("2601.xxxxx"), Lu et al. [2025] CASSE ("2501.xxxxx"), Saito
    et al. [2023] ("2310.xxxxx"), Zhou et al. [2025] ("2502.xxxxx") all have placeholder
    arXiv IDs. If these are real papers, actual IDs must be provided. If fabricated,
    this is a serious integrity issue.

    **Severity: Minor (fixable), but potentially escalates if references are not real.**


    **W8. 44% discard rate from position-consistency filtering.** [R1, R2]

    While no systematic bias is demonstrated in retained vs. discarded pairs (5 tests,
    all p>0.38), discarding nearly half the data means CSD characterizes bias only
    for the subset of inputs where judges are position-consistent. This may exclude
    precisely the contested cases where style bias operates most. Deserves more discussion.

    **Severity: Minor.**


    **W9. SOS-Bench positioning slightly unfair.** [R2]

    The paper frames SOS-Bench as "correlational," which understates their injection
    methodology (controlled defect injection with 152K data points is itself interventional).
    Should acknowledge SOS-Bench''s strengths more fairly.

    **Severity: Minor.**


    **W10. Modest effect size with thin practical guidance.** [R2]

    CSD-adjusted formality bias is ~13pp. The practical correction mechanism (subtract
    original preference estimate) is rudimentary compared to LC-AlpacaEval''s regression
    framework. C4 amounts to four bullet points.

    **Severity: Minor.**


    ---


    ## Questions for Authors


    1. Can you provide actual arXiv IDs for all four placeholder references? (W7)

    2. What does the binarized Likert control look like for Gemini×LLMBar (strongest
    effect)? If binarized Likert is significant there, how does that affect the C2
    claim? (W1)

    3. Given McFadden R²=0.042, how should readers interpret the significant formality
    OR? The model explains very little variance. (W4 related)

    4. The direction asymmetry (formal→original 78.8% vs casual→original 54.5% in
    MVP) is substantial. Does this suggest the "formality bias" partly reflects rewriting-quality
    asymmetry? (R2)

    5. Have you considered GEE or mixed-effects logistic regression to account for
    within-pair clustering? (W4)

    6. Would the Likert Blindspot persist with a 1–100 continuous scale or with judge
    log-probabilities? (W6)


    ---


    ## Missing References (R2)



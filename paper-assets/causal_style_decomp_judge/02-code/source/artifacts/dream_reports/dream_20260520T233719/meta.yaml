    result_rationale: 'Likert-Pairwise gap 的根因是 measurement scale 的信息结构差异。Likert pointwise
      评分中， style bias 被三个机制稀释：(1) score anchoring——judge 倾向使用量表中段，微小 style 偏好 不足以跨越
      score boundary；(2) absolute calibration noise——不同 item 的 baseline quality 差异远大于
      style 引入的差异，between-item variance 淹没 within-item style effect； (3) 离散量表的 resolution
      limit——1-10 scale 上 0.10 的 ATE 被四舍五入吸收。 Pairwise 直接呈现 A/B 对比，消除 absolute calibration
      问题，将 style 差异放大为 forced choice 中的 tie-breaking signal。Gemini 的 Likert p (0.142-0.198)
      最接近显著， 因为 Gemini 的 formality premium 最强 (72.4%)，即使 Likert 的稀释也无法完全消除。 但仍未达 p<0.05，确认
      Likert blindspot 的系统性。

      '

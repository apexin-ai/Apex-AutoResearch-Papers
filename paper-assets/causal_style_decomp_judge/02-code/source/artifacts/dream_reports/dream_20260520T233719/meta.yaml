  - name: Binarized Likert sign test (C2 critical control)
    plan_id: exp-010
    description: 'DREAM CRITICAL。对已有 scored_32b.jsonl 数据做 sign test：每对中 formal version
      的 Likert score 是否严格高于 casual version？如果 binarized Likert sign test 也显著 → gap
      是 test choice 差异，非 measurement method 差异。如果不显著 → 确认 C2。 零成本重分析。

      '
    expected_results:
      data_source: scored_32b.jsonl (GPT-4o × LLMBar, n=88 primary)
      n_primary: 88
      n_formal_higher: 29
      n_casual_higher: 21
      n_tied: 38
      tie_fraction: 0.432
      n_non_tied: 50
      binarized_formal_rate: 0.58
      sign_test_p: 0.24
      is_significant: false
      strict_binarize_diff_ge2:
        n_non_tied: 18
        formal_wins: 11
        sign_test_p: 0.48
      pairwise_formal_wr: 0.691
      pairwise_p: 0.006
      gap_confirmed: true
    result_rationale: 'Binarized Likert 不显著 (p=0.24) 的根因是 Likert scale 的 discretization
      loss。 在 1-10 量表上，formality 引入的 quality perception 差异约 0.10 分 (从 Likert ATE)，
      这远小于一个 scale step。因此 43.2% 的 pair 获得相同 Likert score (tied)——这些 pair 中 judge
      确实感知到了 formality 差异 (pairwise 中会做出选择)，但 Likert 的 粗粒度量表无法捕捉这个差异。在 50 个 non-tied
      pairs 中，formal 略占优 (58%) 但 sample size 太小 (n=50 而非 pairwise 的 n=55 consistent)，sign
      test power 不足。 即使用更严格的 binarization (score difference ≥ 2)，n 降到 18，formal 11/18
      (61%) 但 p=0.48 更加不显著。关键 insight: pairwise 的 forced-choice 消除了 tie 问题—— judge
      必须在两个版本间选择，将 Likert 中被 tie 掩盖的微弱偏好显现出来。 这证明 Likert-Pairwise gap 是 measurement
      granularity 差异，非 statistical test 选择差异。

      '

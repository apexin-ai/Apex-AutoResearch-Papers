      柱2: Binarized Likert formal rate 58.0% (不显著, 浅色)。柱3: Raw Likert ATE p=0.33 (不显著,
      浅色)。标注 "43% of Likert pairs tied — pairwise breaks ties"。 这是 C2 的 visual proof。

      '
    analysis: 'THIS IS THE DECISIVE EVIDENCE FOR C2。binarized_likert_sign_p = 0.24
      在 [0.12, 1.0] 范围内。 排除了 "Likert 和 Pairwise 用不同 statistical test 所以不可比" 的 alternative
      explanation。 现在三种分析都使用 sign test on binary outcome，唯一差异是 measurement method：
      (1) Pairwise forced-choice → 69.1%, p=0.006 (2) Binarized Likert score comparison

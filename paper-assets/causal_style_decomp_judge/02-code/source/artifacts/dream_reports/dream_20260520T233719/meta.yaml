      formal win。测试 Likert-Pairwise gap 是测量方法差异还是统计检验选择差异。

      '
    expected_results:
      n_scored_pairs: 88
      n_formal_higher: 42
      n_casual_higher: 28
      n_tied: 18
      n_non_tied: 70
      formal_win_rate_binarized: 0.6
      sign_test_p: 0.082
      interpretation: boundary — cannot fully confirm or reject C2 structural advantage
    result_rationale: 'Median 档核心约束：binarized Likert sign test p=0.04-0.12，边界结果。 p=0.082
      处于这个范围中央。18/88 ties (20%) 反映 Likert 的 coarse resolution — 整数评分产生大量 tied pairs，这本身就是
      "Likert blindspot" 的一个机制。 但 p=0.082 的含义模糊：如果用 α=0.10 则显著（支持"gap 在统计检验不在测量方法"），
      如果用 α=0.05 则不显著（部分支持 C2 structural advantage）。 Formal win rate 60% (binarized
      Likert) vs 69.1% (pairwise) — binarized Likert 检测到了方向但 magnitude 更小，可能因为 Likert
      的 ordinal scale 压缩了差异。 这个结果不能作为 C2 的 main evidence，只能放在 discussion 中作为 open
      question。

      '

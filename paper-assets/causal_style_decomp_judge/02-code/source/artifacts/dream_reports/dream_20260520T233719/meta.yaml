  review_report: "---\ndream_id: dream_20260520T233719\ntier: median\noverall_score:\
    \ 3.0/6 — Weak Reject (Findings with revisions)\ntimestamp: 2026-05-21T00:30:39.053462+00:00\n\
    ---\n\n# Dream Review Report — \"The Likert Blindspot\"\n\n**dream_id:** 20260520T233719\
    \  \n**Review mode:** full (2 Reviewers + roundtable)  \n**Venue standard:** Top\
    \ ML venue, ~25% acceptance, 6-point scale\n\n---\n\n## 1. Paper Summary\n\nThe\
    \ paper applies counterfactual style decomposition — combining LLM-based style\
    \ rewriting (Qwen3-32B), NLI-based content verification, and position-controlled\
    \ pairwise comparison — to measure per-axis style bias in black-box LLM judges.\
    \ The main finding is a \"Likert blindspot\": GPT-4o shows significant formality\
    \ preference in pairwise comparison (69.1%, p=0.006, n=55) that standard Likert\
    \ scoring fails to detect (ATE=0.10, p=0.33). The paper tests 3 judges × 3 benchmarks,\
    \ scales to n=500, identifies an original-text preference confound via logistic\
    \ regression, and establishes method boundaries through tone and verbosity negative\
    \ controls.\n\n---\n\n## 2. Reviewer Scores\n\n| Reviewer | Focus | Score | Confidence\
    \ |\n|----------|-------|-------|------------|\n| R1 | Methods + Experiments |\
    \ 3.0/6 | Medium-High |\n| R2 | Novelty + Related Work | 3.5/6 | High |\n| **Consensus**\
    \ | | **3.0/6** | **High** |\n\n---\n\n## 3. Strengths (Consensus)\n\n1. **Commendable\
    \ intellectual honesty.** The paper's most distinctive quality is its transparent\
    \ handling of the original-text preference confound (Sections 4.6, 5.2). Rather\
    \ than burying or dismissing the confound, the authors devote substantial space\
    \ to characterizing it — including logistic regression decomposition showing the\
    \ formality main effect becomes non-significant (p=0.11) after controlling for\
    \ original-text preference. This level of self-critical analysis is rare and builds\
    \ trust.\n\n2. **Binarized Likert diagnostic is genuinely insightful.** Section\
    \ 5.1 introduces a clean diagnostic — binarizing Likert scores into wins and applying\
    \ the same sign test used for pairwise — that isolates measurement granularity\
    \ from statistical test choice. The result (p=0.082, intermediate between pairwise\
    \ 0.006 and Likert ATE 0.332) is appropriately presented as an open question rather\
    \ than definitive evidence. This is the paper's most novel analytical contribution.\n\
    \n3. **Well-designed negative controls.** The tone and verbosity boundary analyses\
    \ (Section 4.7) are methodologically sound. Tone fails because hedging alters\
    \ epistemic commitment (NLI correctly rejects), verbosity fails due to information\
    \ asymmetry (bidirectional min NLI structurally incompatible). These establish\
    \ principled method boundaries rather than ad-hoc limitations.\n\n4. **Thorough\
    \ robustness checks.** NLI threshold sensitivity (Table 11, robust across 70–95%),\
    \ consistency filter bias analysis (Table 12, mild length selection only), human-NLI\
    \ validation (κ=0.61, Tables 13–14), and scaled replication (n=500) demonstrate\
    \ careful experimental methodology.\n\n5. **Clear writing and appropriate scope.**\
    \ The paper is well-organized within 8 pages, with claims honestly hedged (C1\
    \ \"demonstrated on GPT-4o with partial replication,\" C2 \"partially ambiguous,\"\
    \ C3 \"preliminary\"). The explicit acknowledgment that no individual component\
    \ is novel (Introduction, paragraph 3) is refreshing.\n\n---\n\n## 4. Weaknesses\n\
    \n### Major\n\n**W1. The original-text preference confound substantially undermines\
    \ C1.**  \nThe logistic regression (Table 8) shows formality's main effect is\
    \ non-significant after controlling for original-text status (β=0.38, p=0.11,\
    \ OR=1.46, CI [0.92, 2.33]). The interaction is significant (p=0.011, OR=0.41),\
    \ meaning the observed \"formality bias\" is conditional on original-preference\
    \ alignment. In the casual-original subset — where formality and original preference\
    \ oppose — formal win rates drop to 50–54.5% across all judges (Table 7, all p>0.7).\
    \ This means the headline claim that \"GPT-4o exhibits significant formality preference\"\
    \ may largely reflect original-text preference correlated with formality, not\
    \ formality bias per se. The paper acknowledges this but the title and abstract\
    \ still foreground the formality bias finding rather than the confound finding.\
    \ **Severity: major — the paper's most important result may be the confound, not\
    \ the bias.**\n\n**W2. Generalization evidence is sparse: 2/9 cells significant.**\
    \  \nThe 3×3 judge × benchmark matrix (Table 3) shows statistical significance\
    \ in only 2 of 9 cells (GPT-4o × LLMBar, Claude × LLMBar). AlpacaEval × GPT-4o\
    \ is marginal (p=0.076); the remaining 6 cells are non-significant. Directional\
    \ consistency (all ≥51.2%) is a weak form of evidence that could reflect noise.\
    \ The paper's characterization as \"demonstrated on GPT-4o with partial replication\"\
    \ is appropriate, but this means the generalization claim is very limited. For\
    \ a method paper, demonstrating the approach works robustly across settings is\
    \ important, and this falls short.\n\n**W3. \"Causal\" framing is not warranted.**\
    \  \nThe paper uses \"causal style bias\" (abstract, method description) but the\
    \ confound analysis in Section 4.6 directly shows that the standard assumptions\
    \ for causal inference from counterfactuals are violated: style rewriting does\
    \ not achieve clean manipulation because judges can detect and prefer original\
    \ text (OR=2.05). Without addressing SUTVA (no interference between versions —\
    \ potentially violated by within-pair quality cues), presenting a causal DAG,\
    \ or conducting formal sensitivity analysis, \"causal\" overclaims. The paper\
    \ should use \"interventional\" or \"counterfactual-based measurement\" instead.\n\
    \n**W4. Binarized Likert analysis is shown for only 1/9 cells.**  \nTable 10 presents\
    \ binarized Likert results only for GPT-4o × LLMBar. This is the decisive control\
    \ for C2 — if the binarized Likert consistently reaches significance where standard\
    \ Likert does not, C2 (\"measurement structure\") is weakened; if it consistently\
    \ fails, C2 is strengthened. Showing it for one cell and getting an ambiguous\
    \ result (p=0.082) leaves C2 unresolved. Extending to all 9 cells is low-cost\
    \ (no new data needed, just reanalysis) and would substantially strengthen or\
    \ clarify C2.\n\n### Minor\n\n**W5. Multiple comparisons not fully addressed.**\
    \  \nWith 9 primary tests (3 judges × 3 benchmarks), 6 Likert-vs-pairwise comparisons,\
    \ and the logistic regression, the effective number of tests is substantial. The\
    \ paper does not apply family-wise or false discovery rate correction. At minimum,\
    \ a Bonferroni or Holm correction across the 9 primary pairwise tests should be\
    \ reported — GPT-4o × LLMBar (p=0.006) would survive, but Claude × LLMBar (p=0.037)\
    \ likely would not under Holm correction with 9 tests (adjusted threshold ≈ 0.006).\n\
    \n**W6. Insufficient differentiation from RATE (Feuer et al., 2025).**  \nRATE\
    \ is the closest methodological predecessor — it introduces double-rewrite counterfactual\
    \ ATE for measuring textual attribute effects. The paper uses RATE's protocol\
    \ in Stage 4 and follows similar rewriting logic. The differentiation (one sentence:\
    \ \"Our work differs in focusing on measurement protocol comparison\") is insufficient.\
    \ Notably, RATE uses Likert ATE — which this paper shows is insensitive — creating\
    \ a direct and interesting tension that should be explicitly discussed.\n\n**W7.\
    \ Missing references.**  \nSeveral relevant works are not cited: (a) Preference\
    \ Leakage literature on evaluation contamination; (b) Stureborg et al. (2024)\
    \ on LLM judge calibration; (c) deeper engagement with Novikova et al. (2018)\
    \ and the psychometric literature on rating scales vs. comparative judgment (Thurstone\
    \ 1927). The Likert blindspot is partially a rediscovery of well-known psychometric\
    \ principles (comparative judgments are more sensitive than rating scales) applied\
    \ to the LLM evaluation domain.\n\n**W8. Single rewriter family.**  \nAll counterfactuals\
    \ use Qwen3-32B. Without at least one rewriter ablation, rewriter-specific artifacts\
    \ (e.g., systematic quality degradation patterns that judges detect) cannot be\
    \ ruled out. The NLI gate mitigates but does not eliminate this concern. Acknowledged\
    \ in limitations but materially weakens the contribution.\n\n**W9. High discard\
    \ rate from position-consistency filtering.**  \nThe 43.9% discard rate (Table\
    \ 12) is substantial. While the bias analysis shows only mild length selection\
    \ (p=0.08), this means nearly half the data is discarded, raising questions about\
    \ whether the \"position-consistent\" subset is representative. The mild length\
    \ bias (consistent pairs average 287 chars vs. 312 for inconsistent) could interact\
    \ with formality effects if judges are more sensitive to style in shorter texts.\n\
    \n---\n\n## 5. Claim-by-Claim Assessment\n\n| Claim | Verdict | Rationale |\n\
    |-------|---------|-----------|\n| **C1: Method viability** | Partially supported\
    \ | The method detects a statistically significant aggregate effect, but the logistic\
    \ regression shows this effect is confounded with original-text preference. After\
    \ controlling, formality main effect is p=0.11. C1 is supported as \"the method\
    \ detects *something*\" but not as \"the method detects *formality bias*.\" |\n\
    | **C2: Likert blindspot** | Weakly supported, direction correct | The 0/6 (Likert\
    \ significant) vs. 2/6 (pairwise significant) pattern is consistent, and the directional\
    \ trend (pairwise p < Likert p in 5/6 cells) is suggestive. But the binarized\
    \ Likert analysis (p=0.082) shows partial recovery, and the source of the gap\
    \ (measurement structure vs. statistical power) remains genuinely ambiguous, as\
    \ the paper concedes. |\n| **C3: Axis applicability** | Supported | The negative\
    \ controls (tone, verbosity) are well-designed and the failure modes are correctly\
    \ identified as structural rather than incidental. This is the most cleanly supported\
    \ claim. |\n| **C4: Practical guidance** | Supported with caveats | The recommendation\
    \ to prefer pairwise is reasonable, and the guidance to control for original-text\
    \ preference is directly supported by the logistic regression. However, the guidance\
    \ is actionable only to the extent practitioners have access to the full pipeline.\
    \ |\n\n---\n\n## 6. Experiment Coverage Assessment\n\nCompared against the full\
    \ experiment design (review_context.yaml), the paper covers all P1 experiments\
    \ comprehensively:\n\n| Experiment | Status | Assessment |\n|-----------|--------|------------|\n\
    | exp-001: Multi-judge pairwise | ✅ Table 1 | Complete |\n| exp-002: Multi-benchmark\
    \ pairwise | ✅ Tables 2–3 | Complete |\n| exp-003: Likert vs Pairwise | ✅ Table\
    \ 4 | Complete |\n| exp-004: Tone negative control | ✅ Section 4.7 | Complete\
    \ |\n| exp-005: Original preference control | ✅ Tables 6–9 | Complete |\n| exp-006:\
    \ Scaled replication (n=500) | ✅ Table 5 | Complete |\n| exp-007/007b: Verbosity\
    \ negative control | ✅ Section 4.7 | Complete |\n| exp-008: Register axis | ❌\
    \ Not in paper | P2, properly omitted |\n| exp-009: Non-Qwen rewriter | ❌ Not\
    \ in paper | P2, acknowledged in limitations |\n| exp-010: Binarized Likert |\
    \ ✅ Table 10, §5.1 | Complete but only for 1/9 cells |\n| exp-011: NLI threshold\
    \ sensitivity | ✅ Table 11 | Complete |\n| exp-012: Consistency filter bias |\
    \ ✅ Table 12 | Complete |\n| exp-013: Human NLI validation | ✅ Tables 13–14 |\
    \ Complete |\n| exp-014: Logistic regression | ✅ Table 8 | Complete |\n\nCoverage\
    \ is good. The two omitted P2 experiments (register axis, non-Qwen rewriter) are\
    \ appropriately acknowledged. The main gap is extending binarized Likert (exp-010)\
    \ beyond a single cell.\n\n---\n\n## 7. Questions for Authors\n\n1. **The confound\
    \ as the main finding:** Given that the logistic regression shows formality main\
    \ effect is non-significant after controlling (p=0.11), have you considered reframing\
    \ the paper's primary contribution as the *discovery of the original-text preference\
    \ confound in counterfactual bias measurement*, rather than the formality bias\
    \ finding? This would be a more novel and defensible contribution.\n\n2. **Binarized\
    \ Likert extension:** Can you report binarized Likert results for all 9 judge\
    \ × benchmark cells? This is a zero-cost reanalysis that would substantially clarify\
    \ C2.\n\n3. **Multiple comparisons:** What is the result of applying Holm correction\
    \ across the 9 primary pairwise tests? Does Claude × LLMBar survive?\n\n4. **Rewriter\
    \ artifacts:** Have you examined whether Qwen3-32B rewrites introduce systematic\
    \ quality differences (e.g., grammatical errors, disfluencies) that judges might\
    \ detect independently of style? This would partially address W8 without requiring\
    \ a second rewriter.\n\n5. **Triple-rewrite design:** Section 5.2 mentions \"\
    triple-rewrite\" designs as future work. Have you estimated whether rewriting\
    \ both versions into a neutral register before style manipulation is feasible\
    \ with current LLMs?\n\n6. **Likert scale granularity:** Would a finer-grained\
    \ Likert scale (e.g., 1–100 instead of 1–10) reduce the blindspot, as suggested\
    \ by the high tie rate (20%) in the binarized analysis?\n\n---\n\n## 8. Suggestions\
    \ for Improvement\n\n1. **Reframe around the confound.** Elevate the original-text\
    \ preference confound from limitation to co-primary finding. The interaction result\
    \ (OR=0.41, p=0.011) is arguably the paper's most interesting and novel contribution\
    \ — it identifies a fundamental challenge for all counterfactual bias measurement\
    \ methods.\n\n2. **Soften causal language.** Replace \"causal style bias\" with\
    \ \"interventional style bias measurement\" or \"counterfactual-based style preference\
    \ detection\" throughout. Add a paragraph in the method section discussing the\
    \ assumptions under which the approach approximates causal measurement and where\
    \ these assumptions break.\n\n3. **Extend binarized Likert to full matrix.** Zero-cost,\
    \ high-impact improvement to C2 evidence.\n\n4. **Add RATE differentiation paragraph.**\
    \ Discuss the tension: RATE uses Likert ATE, which this paper shows is insensitive.\
    \ This positions the paper as identifying a blind spot in RATE's own evaluation\
    \ protocol.\n\n5. **Apply multiple comparisons correction.** Report both uncorrected\
    \ and Holm-corrected p-values for the primary 9-cell matrix.\n\n6. **Adjust title/abstract\
    \ framing.** The abstract could more prominently feature the confound finding\
    \ alongside the blindspot finding, since it is the more robust and novel result.\n\
    \n---\n\n## 9. Overall Assessment\n\n**Consensus Score: 3.0/6 (Weak Reject)**\n\
    \nThis is a carefully executed empirical study with commendable intellectual honesty,\
    \ but several issues prevent it from reaching the threshold for a top venue main\
    \ track:\n\n1. **The headline finding is self-undermined.** The paper's own analysis\
    \ (logistic regression, casual-original subset) shows that the observed formality\
    \ preference may largely reflect original-text preference rather than genuine\
    \ style bias. While the authors are admirably transparent about this, it means\
    \ the central claim is substantially weaker than the title suggests.\n\n2. **Generalization\
    \ is thin.** Statistical significance in 2/9 cells, with the effect concentrated\
    \ in one benchmark (LLMBar) and attenuated elsewhere, limits the practical impact.\n\
    \n3. **Novelty is incremental.** The combination of known components (style rewriting\
    \ + NLI + pairwise) yields an interesting observation (Likert blindspot) that\
    \ partially echoes established psychometric principles. The most novel element\
    \ — the binarized Likert diagnostic — is underexplored (1/9 cells).\n\n4. **Causal\
    \ framing overclaims.** Given the confound, \"causal\" is not warranted without\
    \ additional assumptions or controls.\n\n**The paper's strongest contribution**\
    \ is the identification and characterization of the original-text preference confound\
    \ (Section 4.6, 5.2), which has implications beyond this specific study for anyone\
    \ using counterfactual methods to audit LLM biases. If reframed around this finding,\
    \ with the Likert blindspot as a secondary contribution, the paper could be more\
    \ compelling.\n\n**Predicted outcome:** Below the bar for main conference acceptance;\
    \ could reach Findings with revisions (reframing, binarized Likert extension,\
    \ softened causal language, multiple comparisons correction).\n\n---\n\n## 10.\
    \ Reviewer Agreement Notes\n\nBoth reviewers independently flagged the same top-3\
    \ issues: (1) original-text preference confound undermining C1, (2) causal language\
    \ overclaiming, (3) limited generalization. R2 additionally emphasized novelty\
    \ limitations relative to psychometric literature and insufficient RATE differentiation.\
    \ R1 emphasized statistical rigor concerns (multiple comparisons, binarized Likert\
    \ coverage). No significant disagreements arose during cross-sharing; scores converged\
    \ from 3.0/3.5 to consensus 3.0.\n"

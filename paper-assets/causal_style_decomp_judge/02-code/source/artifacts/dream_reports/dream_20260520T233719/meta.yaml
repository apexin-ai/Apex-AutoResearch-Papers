    # Dream Review Report — Full Roundtable


    **Paper:** "Formality Bias or Original-Text Preference? A Cautionary Analysis
    of Confounds in LLM Judge Style Bias Detection"


    **Review Mode:** Full (2 Reviewers, 4-step roundtable)


    ---


    ## Reviewer Assignments

    - **R1** — Methodology & Experiments

    - **R2** — Novelty & Related Work


    ---


    ## Step 1: Independent Reviews


    ### R1: Methodology & Experiments (Score: 3/6, Confidence: 4/5)


    **Strengths:**

    1. The original-text preference confound is a genuinely important methodological
    observation. The casual-original subset analysis (formal WR=52.6%, p=0.72 in Table
    7) provides the cleanest evidence that apparent formality bias disappears when
    original-text status conflicts with formality direction.

    2. Multi-judge (3) × multi-benchmark (3) design is commendably thorough — most
    style-bias papers test a single judge on a single benchmark.

    3. Honest reporting of method boundaries: tone (NLI 65%) and register (NLI 72%)
    failures are presented transparently rather than buried.

    4. The binarized Likert sign test (Table 4) is a clean, clever diagnostic that
    isolates test-choice sensitivity from measurement-structure effects.

    5. Practical recommendations (§6.3) are actionable and well-grounded in the experimental
    findings.


    **Weaknesses:**

    1. **(Major) Insufficient power for negative claims.** Per-cell sample sizes after
    filtering (n=40–55, Table 2) are too small to support the claim that formality
    bias does not exist for Claude/Gemini. No power analyses are reported for these
    null findings. With n=44 (Claude × LLMBar), the study has <30% power to detect
    a 10pp effect. The paper cannot distinguish "no bias" from "underpowered to detect
    bias."

    2. **(Major) Logistic regression on a single condition.** The decomposition (Table
    6) uses only N=88 observations from GPT-4o × LLMBar. This is the paper''s central
    statistical argument, yet it is not replicated on any other judge-benchmark combination.
    The model has pseudo-R²=0.06, explaining very little variance. The non-significance
    of formality (p=0.21) could reflect low power rather than true null.

    3. **(Major) Consistency filter introduces acknowledged but uncorrected bias.**
    Table 12 shows consistent pairs are significantly shorter (p=0.03) and have different
    task-type distributions (p=0.04). The 43.9% discard rate means analysis rests
    on a biased subsample. No sensitivity analysis relaxing the consistency requirement
    is reported to check whether the effect persists.

    4. **(Moderate) Human-NLI agreement is weak.** κ=0.42 with 18% false positive
    rate (Table 13) means ~10 of 55 consistent pairs may contain content differences.
    The paper acknowledges this but does not re-run the main analysis excluding human-flagged
    false positives.

    5. **(Moderate) Rewriter sensitivity undermines the positive finding too.** Llama-3.1-70B
    yields non-significant results (58%, p=0.21 vs. Qwen''s 69.1%, p=0.006). The paper
    correctly flags this but does not resolve whether the Qwen result is rewriter-specific.
    If the sole significant finding depends on rewriter choice, the confound story
    built on it is also unstable.

    6. **(Minor) NLI threshold monotonicity is under-interpreted.** The monotonic
    increase in formal WR with NLI threshold (Table 11) is consistent with selection
    bias (higher-NLI pairs = better rewrites = more original-like), but the paper
    does not formally test this alternative.


    ### R2: Novelty & Related Work (Score: 3/6, Confidence: 3/5)


    **Strengths:**

    1. The binarized Likert control design is the most genuinely novel element — cleanly
    isolating measurement granularity from test selection in the LLM-judge context.

    2. The direction asymmetry analysis (formal-original 78% vs. casual-original 52.6%)
    is an honest and informative finding.

    3. The "cautionary analysis" framing is appropriate for the content — the paper
    does not overclaim positive results.

    4. Clear, precise statistical reporting throughout (effect sizes, CIs, exact p-values).

    5. Tone/register negative controls provide principled method-boundary evidence
    with a mechanistic explanation (epistemic commitment changes violate NLI).


    **Weaknesses:**

    1. **(Major) Core insight has limited novelty.** That forced-choice (pairwise)
    is more sensitive than rating scales (Likert) for detecting small preference effects
    is well-established in psychometrics (cf. Thurstone 1927; Kiritchenko & Mohammad
    2017 on best-worst scaling for NLG evaluation; Novikova et al. 2018 on ranking
    vs. rating). The paper should position itself as "empirical confirmation in a
    new domain" rather than a discovery.

    2. **(Major) RATE differentiation is critically underdeveloped.** The paper adopts
    RATE''s double-rewrite protocol but gives it one sentence. The natural question
    — whether RATE''s own Likert-based ATE estimation suffers from the same confound
    — is never explored. This would be the strongest positioning argument and it is
    missing.

    3. **(Major) Only one working axis limits generalizability.** The paper claims
    the original-text preference confound affects "any counterfactual bias detection
    method" (§6.2), but tests only formality. Tone and register failed content verification,
    so there is no replication on independent axes. The claim to generality is speculative.

    4. **(Moderate) Missing related works.** Kiritchenko & Mohammad (2017) on best-worst
    scaling vs. Likert for NLG evaluation directly undermines the "surprising" framing
    of the Likert–pairwise gap. Novikova et al. (2018) on ranking vs. rating for NLG
    evaluation is also relevant. Preference Leakage (Li et al., ICLR 2026) studies
    judge-preference contamination and is uncited.

    5. **(Moderate) Practical recommendations are largely standard.** "Test multiple
    judges," "test multiple benchmarks," "use sign tests on ordinal data" — these
    are standard experimental design principles. Only "control for original-text status"
    is somewhat specific to this paper''s contribution.

    6. **(Minor) Causal language exceeds identification.** Terms like "drives observed
    effects" and "primary confound" imply causal identification, but no DAG, SUTVA
    discussion, or sensitivity analysis is provided. The logistic regression is associational.



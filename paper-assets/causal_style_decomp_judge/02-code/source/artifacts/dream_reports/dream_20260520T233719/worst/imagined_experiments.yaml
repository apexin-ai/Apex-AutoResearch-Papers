- name: Binarized Likert sign test (C2 critical control)
  plan_id: exp-010
  description: '对已有 scored_32b.jsonl 数据做 binarized Likert sign test：对每对样本， formal
    version Likert 分数严格高于 casual version 的次数。如果显著 → C2 证伪。

    '
  expected_results:
    n_pairs: 88
    formal_higher: 42
    casual_higher: 26
    tied: 20
    n_non_tied: 68
    binarized_sign_p: 0.032
    formal_higher_rate: 0.618
    effect_direction: formal preferred in binarized Likert too
  result_rationale: '这是 worst 档对 C2 的致命打击。binarized Likert sign test p=0.032 < 0.04，
    说明 Likert 数据本身就包含 formality preference 信号——paired t-test p=0.33 不显著是因为 Likert
    评分的连续值方差太大（评分是 1-5 粗粒度，配对差异 noise 大），而非 Likert 作为测量方法看不到 bias。换言之，Likert-Pairwise
    gap 来自 sign test vs paired t-test 的统计功效差异：sign test 只看方向不看幅度，对 小而一致的偏好更敏感；paired
    t-test 受幅度方差影响更大。这意味着 "Likert Blindspot" 这个 framing 完全错误——不是 Likert 看不到，而是配对 t
    检验在 粗粒度评分上功效不足。任何使用 sign test 的方法（无论 Likert 还是 pairwise） 都能检测到效应。C2 从 "measurement
    method structural advantage" 坍缩为 "statistical test choice matters"——这是 trivially
    true 且 novelty 极低。

    '

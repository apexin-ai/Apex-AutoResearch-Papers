    (p<0.03)。logistic regression 解开了两个 confounded effects： (1) formality coefficient
    p=0.21——在控制 original status 后，formal vs casual style 本身不影响 judge preference。(2)
    original_status coefficient p=0.002—— 是否是原文才是决定性因素。interaction 不显著 (p=0.58) 说明
    original preference 不因 formality direction 而变化——judge 就是偏好 original text，不管它是
    formal 还是 casual。casual-original subset (n=38) 的 formal win rate 仅 52.6% (p=0.72)——当

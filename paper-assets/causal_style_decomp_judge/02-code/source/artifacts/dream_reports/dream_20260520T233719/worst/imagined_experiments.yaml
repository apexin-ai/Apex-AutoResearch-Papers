tier: worst
narrative_guidance: 'C2 ("Likert Blindspot") 被证伪或效应不泛化。binarized Likert sign test
  显著 (p<0.04) 证明 Likert-Pairwise gap 来自统计检验功效差异而非测量方法结构性优势；或者效应仅限 GPT-4o × LLMBar，Claude/Gemini
  均不显著，additional benchmarks 不复制。需要根本性 reframe：路径 A (sensitivity-specificity tradeoffs)
  或路径 B (original-text preference confound as cautionary negative result)。C4 在此 tier
  反而更重要——"what NOT to do" 本身就是贡献。目标仍为 EMNLP Findings (projected 2.8-3.3)。

  '

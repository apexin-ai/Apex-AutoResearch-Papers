        sign_test_p: 0.063
        wilson_ci:
        - 0.499
        - 0.651
        note: Approaches significance; NOT significant at alpha=0.05
      likert_ate:
        n_primary: 435
        raw_ate: -0.085
        raw_se: 0.065
        raw_p: 0.19
        corrected_ate: 0.095
        corrected_se: 0.047
        corrected_p: 0.043
        note: Raw ATE still wrong direction; corrected ATE barely significant
      power_analysis:
        pairwise_detected_effect_cohens_h: 0.222
        binarized_likert_detected_effect_cohens_h: 0.154
        measurement_amplification_ratio: 1.44
        pairwise_power_at_n100: 0.72
        pairwise_power_at_n200: 0.93
        pairwise_power_at_n500: 0.998
        binarized_likert_power_at_n100: 0.18
        binarized_likert_power_at_n200: 0.34
        binarized_likert_power_at_n500: 0.52
        binarized_likert_n_for_80pct_power: 680
        likert_ate_power_at_n100: 0.09
        likert_ate_power_at_n500: 0.31
        likert_ate_n_for_80pct_power: 1200
      regression_to_mean:
        n100_pairwise_win_rate: 0.691
        n500_pairwise_win_rate: 0.611
        regression_magnitude: 0.08
        note: 8pp regression consistent with sampling variance at n=55 consistent
          pairs
    result_rationale: 'n=500 的三个关键结果及其 rationale： (1) Pairwise win rate 从 69.1% 回归到
      61.1%。n=100 的 69.1% 来自仅 55 个 consistent pairs → 采样方差大，Wilson CI [56.0%, 79.7%]。n=500
      的 275 个 consistent pairs 给出更精确的 true effect estimate ~61%。8pp 回归幅度在 n=55 的 CI
      范围内，统计上完全预期。效应仍高度显著 (p=0.0004)。 (2) Binarized Likert p=0.063：在 n=500 下 approaching
      但 NOT crossing 0.05 线。 这是 median 档的精妙预测——如果 binarized Likert 真的 significant，C2
      从 "blindspot" 变成 "efficiency gap"，论文核心受损；如果完全 null，C2 过于强势 反而可疑。p=0.063 恰好在模糊地带：它说明
      binarized Likert 不是完全 blind（有 trending signal），但需要远超 pairwise 的样本量才能 detect
      → "efficiency gap" framing 是准确的。关键：binarized Likert n_nontie=163 (Likert 评分相同的
      pair 被丢弃 → 信息损失)，effective n 仅 pairwise 的 59%，这是 structural 不是 power。 (3) Likert
      ATE raw p=0.19 仍不显著且方向错误 → continuous Likert 在 n=500 下 仍然 blind。Corrected ATE
      (accounting for rewrite bias) p=0.043 barely significant，但 "corrected" 需要知道
      rewrite bias → 不是 post-hoc 可用的检测 工具。这进一步支持 "Likert cannot serve as style bias
      detector without correction." Power analysis 的实用价值：pairwise 在 n=100 就有 72% power
      (接近 80%)， binarized Likert 需要 n=680 for 80% power → 6.8× 样本量差距。这是论文的 quantitative
      C2 claim："pairwise comparison is ~7× more sample-efficient than binarized Likert
      for detecting style bias at the observed effect size."

      '
    tables:
    - name: 'Table 5: Scaled replication — measurement comparison at n=500'
      description: '3 rows (Pairwise, Binarized Likert, Likert ATE) × columns: n_effective,
        effect_estimate, 95% CI, p-value, Cohen''s h, power_at_n100, power_at_n500,
        n_for_80pct_power。Clearly shows efficiency hierarchy。

        '
    - name: 'Table S2: n=100 vs n=500 comparison'
      description: 'Side-by-side: all metrics at two sample sizes。Regression to mean
        quantified and contextualized。

        '
    figures_description:
    - 'Power curve: x = total sample size (50 to 1000), y = statistical power (0 to
      1)。 Three curves: pairwise (blue, crosses 80% at ~110), binarized Likert (orange,
      crosses 80% at ~680), Likert ATE (red, crosses 80% at ~1200)。Horizontal dashed
      at 80%。Vertical dashed at n=100 and n=500。This is C2''s key visualization —
      the efficiency gap is immediately visible。

      '
    - 'Running estimate plot: x = cumulative n (in increments of 50), y = pairwise
      win_rate with running 95% CI ribbon。Shows convergence from volatile ~69% at
      n=100 toward stable ~61% at n=500。Communicates regression to mean visually。

      '
    analysis: 'exp-006 redefines C2 from "Likert Blindspot" to "Likert Efficiency
      Gap." Binarized Likert p=0.063 at n=500 means the effect is detectable in principle
      — given enough data. But the practical gap (pairwise needs n~110, binarized
      Likert needs n~680) is the real contribution. For practitioners: "If you suspect
      style bias, pairwise comparison with n=100 is sufficient; Likert scoring would
      need n≥700 for the same statistical power." Title 可能需要从 "Blindspot" 软化为 "Blind
      Spot" 或保留但 在 abstract 中 qualify。Power analysis table 是最 reviewer-friendly 的结果之一——
      直接 actionable guidance。Win rate 回归到 61.1% 需要 honestly report，不要 buried in supplement。

      '

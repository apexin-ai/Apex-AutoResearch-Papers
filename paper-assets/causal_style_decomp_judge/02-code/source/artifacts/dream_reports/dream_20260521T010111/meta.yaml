focus: 'D020 fixes applied: (1) causal→interventional language throughout, (2) RATE
  differentiation paragraph added to framing (RATE uses Likert ATE which we show is
  insensitive), (3) psychometric lineage refs (Thurstone 1927, Kiritchenko 2017, Novikova
  2018) integrated, (4) RC10/RC11 added. Our actual data is stronger than Dream 2
  imagined: exp-014 formality OR=2.21 p=0.010 GEE (dream imagined p=0.11), register
  95% NLI PASS (unknown to dream), binarized Likert p=0.296 confirming C2 mechanism.
  Evaluate whether D020 structural fixes resolve the three-tier consistent issues
  from Dream 2.'

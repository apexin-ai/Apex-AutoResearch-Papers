    | exp-008: Register axis | ✅ Table 9 | Appropriately framed as exploratory |


    **Coverage**: 7/9 experiments covered. Two experiments have coverage gaps (original
    preference showing 3 not 9 cells; verbosity on single cell). No planned experiment
    is entirely missing.



  review_report: "---\ndream_id: dream_20260521T010111\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-21T01:58:46.747887+00:00\n---\n\n# Dream Review\
    \ Report: \"The Likert Blindspot\"\n\n**dream_id**: 20260521T010111  \n**Review\
    \ mode**: full (2 Reviewers + Roundtable)  \n**R1 focus**: Methods + Experiments\
    \ | **R2 focus**: Novelty + Related Work\n\n---\n\n## 1. Paper Summary\n\nThe\
    \ paper proposes a counterfactual pairwise measurement protocol for detecting\
    \ style bias in black-box LLM judges. The 4-stage pipeline (style transfer → NLI\
    \ content verification → position-controlled pairwise comparison → Likert baseline)\
    \ is applied to formality bias across 3 judges (GPT-4o, Claude-3.5-Sonnet, Gemini-2.0-Flash)\
    \ and 3 benchmarks (LLMBar, AlpacaEval, MT-Bench). The headline finding — the\
    \ \"Likert Blindspot\" — is that pairwise comparison detects GPT-4o formality\
    \ bias (win rate = 69.1%, p = 0.006) that Likert scoring misses (p = 0.332). However,\
    \ only 1 of 9 judge×benchmark cells is significant. Scaled replication at n =\
    \ 500 confirms a real but attenuated effect (59%, p = 0.012) co-occurring with\
    \ a rewrite-quality confound.\n\n---\n\n## 2. Reviewer Scores\n\n| Reviewer |\
    \ Initial Score | Post-Crossshare Score | Focus |\n|----------|--------------|----------------------|-------|\n\
    | R1 | 3.5 | 3.5 | Methods + Experiments |\n| R2 | 3.5 | 3.0 | Novelty + Related\
    \ Work |\n| **Consensus** | — | **3.0** | — |\n\n---\n\n## 3. Consolidated Strengths\n\
    \n### S1. Binarized Likert control is genuinely novel (R1+R2 consensus)\nThe most\
    \ distinctive methodological contribution. By applying the same sign test to dichotomized\
    \ Likert scores (60.6%, p = 0.296), the paper isolates *measurement structure*\
    \ (forced comparison vs. independent rating) from *statistical test choice* as\
    \ the mechanism driving the Likert–pairwise gap. Both reviewers identified this\
    \ as the paper's strongest conceptual move, elevating it beyond \"pairwise beats\
    \ Likert (Thurstone 1927)\" to a mechanistic diagnostic.\n\n### S2. Well-designed\
    \ position control and consistency filtering (R1)\nDual-direction pairwise with\
    \ consistency filtering eliminates position bias as a confounder. The 43% discard\
    \ rate from inconsistent pairs shows no systematic bias (all MWU p > 0.12), validating\
    \ that filtering selects on noise, not signal.\n\n### S3. Honest contribution\
    \ calibration (R2)\nThe paper acknowledges component provenance (RATE for double-rewrite,\
    \ Zheng et al. for position control) and calls C1 an \"application contribution.\"\
    \ The introduction transparently states \"We designed this study expecting formality\
    \ bias to be a general property of LLM judges. It is not.\" This intellectual\
    \ honesty is rare and builds trust.\n\n### S4. RATE critique is well-positioned\
    \ (R2)\nThe reflexive argument — that RATE's own Likert-based ATE may suffer from\
    \ the blindspot this paper identifies — is the paper's strongest positioning move.\
    \ If RATE's null findings for some style attributes are false negatives due to\
    \ Likert insensitivity, this has genuine field-level implications.\n\n### S5.\
    \ GEE logistic decomposition is statistically appropriate (R1)\nUsing GEE with\
    \ exchangeable correlation to handle non-independence of paired observations (paired\
    \ data × 2 orderings) is the correct approach. Formality OR = 2.21 (p = 0.010)\
    \ remaining significant after controlling original preference (OR = 1.82, p =\
    \ 0.052) at n = 100 provides the strongest causal evidence in the paper.\n\n###\
    \ S6. Method boundary characterization (R2)\nDemonstrating pipeline failure for\
    \ tone (NLI pass rate = 45%) establishes principled method boundaries. This is\
    \ more informative than a third positive result.\n\n---\n\n## 4. Consolidated\
    \ Weaknesses\n\n### W1 (Major, R1+R2 consensus). Generalization failure: 1/9 cells\
    \ significant\nThe paper's central claim — \"The Likert Blindspot\" — is demonstrated\
    \ for exactly one judge × benchmark × style-axis combination (GPT-4o × LLMBar\
    \ × formality). Claude-3.5-Sonnet (52%, p = 0.42) and Gemini-2.0-Flash (49%, p\
    \ = 0.55) show no formality preference. Extension to AlpacaEval and MT-Bench yields\
    \ no significant effects even for GPT-4o. The title and abstract suggest generality\
    \ (\"LLM Judges\" plural, \"Hidden Style Bias\" unqualified) that the data does\
    \ not support. Both reviewers independently flagged this as the paper's most fundamental\
    \ weakness.\n\nThe Likert Blindspot can only be demonstrated where an underlying\
    \ bias exists — and the paper finds underlying bias in only 1/9 cells. This makes\
    \ C2 (the \"measurement sensitivity gap\") effectively a single-cell observation.\
    \ The paper acknowledges this but does not fully internalize it in the framing.\n\
    \n### W2 (Major, R1 raised, R2 endorsed). Direction asymmetry and original-preference\
    \ confound\nThe formal→casual direction shows 78.8% win rate (p = 0.001) but casual→formal\
    \ is only 54.5% (p = 0.832). This 24.3 percentage point asymmetry is troubling.\
    \ The parsimonious explanation is that judges prefer whichever version is the\
    \ *original* (higher-quality) text, not that they prefer formality per se. The\
    \ confound is confirmed at scale: at n = 500, original preference becomes significant\
    \ (OR = 1.55, p = 0.025).\n\nThe GEE model at n = 100 shows formality OR = 2.21\
    \ and original OR = 1.82, suggesting both contribute independently. But with correlated\
    \ predictors and n = 275 consistent pairs at n = 500, the logistic model may lack\
    \ power to cleanly separate them. The \"pure\" formality component (OR = 1.85/1.55\
    \ ≈ 1.19 ratio) may be modest. R2 identified this as the most critical unresolved\
    \ issue after cross-sharing — it threatens the causal interpretation that the\
    \ protocol is measuring style preference rather than rewrite-quality preference.\n\
    \n### W3 (Major, R1 raised, R2 elevated). NLI gate validation has evaluator-producer\
    \ circularity\nCohen's κ = 0.43 (moderate agreement) falls below the κ ≥ 0.60\
    \ threshold for \"good agreement.\" More critically, R1 identified that the \"\
    human annotator\" for NLI validation is Qwen3-32B — the same model family that\
    \ generated the counterfactuals. This creates evaluator-producer bias: the model\
    \ that wrote the rewrites is also judging whether they preserved content. With\
    \ only 4 true negatives in the confusion matrix, specificity estimates (33.3%)\
    \ have enormous uncertainty. The paper's NLI threshold sensitivity analysis (win\
    \ rate stable at 72–74% across 0.70–0.95) partially mitigates this, but the circularity\
    \ concern remains unaddressed.\n\n### W4 (Major, R2). Core finding confirms century-old\
    \ psychometric principle\nThurstone (1927) formalized why paired comparison yields\
    \ finer discriminability than absolute scales. Kiritchenko & Mohammad (2017) demonstrated\
    \ this for NLG evaluation. The paper's contribution is domain-specific empirical\
    \ confirmation — useful but not a new insight. R1 partially disagreed, arguing\
    \ that domain application to LLM-as-Judge is non-trivial and the NLP community\
    \ may not be aware of this principle. The roundtable converged on: the novelty\
    \ is real but incremental, and the paper's value depends on the *practical significance*\
    \ of the demonstrated blindspot — which is undermined by 1/9 cells.\n\n### W5\
    \ (Moderate, R1+R2). Effect attenuation at scale\nThe n = 500 replication shows\
    \ win rate dropping from 69.1% to 59% — a 10 percentage point regression. While\
    \ still significant (p = 0.012), the headline number (69.1%) is likely an overestimate\
    \ from a favorable n = 100 sample (only 55 consistent pairs, CI [0.560, 0.797]).\
    \ The paper's \"strong formality preference\" framing becomes \"moderate\" at\
    \ scale.\n\n### W6 (Moderate, R2). Insufficient differentiation from RATE and\
    \ Zhou et al.\nRATE (the closest predecessor) gets one paragraph. Zhou et al.\
    \ (2025, persona-level counterfactuals with Bradley-Terry) gets one sentence.\
    \ For the two most directly comparable methods, this is inadequate. A comparison\
    \ table articulating what each method measures, how, and why the differences matter\
    \ is needed.\n\n### W7 (Minor, R1). Multiple comparisons not systematically corrected\n\
    The paper mentions Holm-Bonferroni but does not apply it. GPT-4o × LLMBar's p\
    \ = 0.006 would survive correction across 9 cells, but the omission is a methodological\
    \ gap that should be addressed.\n\n### W8 (Minor, R2). \"Interventional\" language\
    \ overclaims\nWithout a formal causal graph, SUTVA discussion, or sensitivity\
    \ analysis, \"interventional measurement\" implies more than the paper delivers.\
    \ \"Manipulated comparison\" or \"counterfactual comparison\" would be more accurate.\n\
    \n---\n\n## 5. Experiment Coverage Assessment\n\nComparing against the full experiment\
    \ design (review_context.yaml):\n\n| Experiment | Covered? | Notes |\n|-----------|----------|-------|\n\
    | exp-001: Multi-judge pairwise (LLMBar) | ✅ Full | Table 1 |\n| exp-002: Multi-benchmark\
    \ pairwise (9 cells) | ✅ Full | Tables 2-3 |\n| exp-003: Likert vs Pairwise sensitivity\
    \ | ✅ Full | Table 4 |\n| exp-005: RATE control (original preference) | ✅ Full\
    \ | Table 5 |\n| exp-006: Scaled replication (n=500) | ✅ Full | Table 6 |\n| exp-009:\
    \ Non-Qwen rewriter control | ✅ Full | Table 7 |\n| exp-013: Human NLI validation\
    \ | ✅ Full | Tables 8-9 |\n\nAll planned experiments are reported. Coverage is\
    \ complete. The paper faithfully reports the unfavorable results (1/9 cells, effect\
    \ attenuation, confirmed confound).\n\n---\n\n## 6. Roundtable Discussion\n\n\
    ### Step 2: Cross-Sharing Key Reactions\n\n**R1 → R2**: Agreed on 1/9 significance\
    \ problem and \"interventional\" overclaim. Partly disagreed on Thurstone novelty\
    \ argument (domain application is valid NLP contribution). Noted new gap: missing\
    \ FLASK/BWS literature, thin C4.\n\n**R2 → R1**: Lowered score from 3.5 to 3.0\
    \ after seeing direction asymmetry data and NLI evaluator-producer circularity.\
    \ Elevated confound concern: \"If formal→casual shows 78.8% but casual→formal\
    \ shows only 54.5%, the parsimonious explanation is that judges prefer whichever\
    \ version is the *original* text.\" This was the most impactful cross-sharing\
    \ moment.\n\n### Step 3: Convergence\n\n**Unanimous agreement:**\n- 1/9 significant\
    \ cells is the paper's fundamental weakness (both reviewers flagged independently)\n\
    - Binarized Likert control is the strongest contribution\n- Title/abstract oversell\
    \ generality\n- Honest reporting of negative results is commendable\n\n**Resolved\
    \ disagreement:**\n- Novelty: R1 argued domain application to LLM-as-Judge is\
    \ non-trivial even if psychometric principle is known. R2 conceded this partly\
    \ but maintained novelty is incremental. Converged on: novelty is real but depends\
    \ on practical significance, which is thin at 1/9.\n\n**Remaining disagreement:**\n\
    - Score: R1 at 3.5, R2 at 3.0. The gap reflects R2's greater weight on the confound\
    \ concern after seeing direction asymmetry data. R2 views the original-preference\
    \ confound as potentially fatal to the causal interpretation; R1 views it as a\
    \ separable nuisance partially addressed by GEE.\n\n### Step 4: Score Convergence\n\
    \nThe roundtable converges on **3.0 (Weak Reject)** as the consensus score. Reasoning:\n\
    \n- The methodological design is careful (position control, binarized Likert,\
    \ GEE, rewriter control, NLI sensitivity) — this would merit 4.0+ if the results\
    \ supported the claims\n- But the evidence base is critically thin: 1/9 cells\
    \ significant, effect attenuates at scale, original-preference confound confirmed,\
    \ NLI validation has circularity\n- The paper is honest about these limitations,\
    \ but honesty about weak results does not make them strong\n- The contribution\
    \ reduces to: \"GPT-4o has formality bias on LLMBar that Likert misses\" — true,\
    \ replicable, but too narrow for a top-venue main paper\n- As a Findings paper\
    \ or short paper focused on the binarized Likert diagnostic + the GPT-4o case\
    \ study, this could work — but the current framing as a general \"Likert Blindspot\"\
    \ is not supported\n\n---\n\n## 7. Key Questions for Authors\n\n1. **Confound\
    \ separation**: At n = 500, both formality (OR = 1.85) and original preference\
    \ (OR = 1.55) are significant. What fraction of the 69.1% headline win rate is\
    \ attributable to style preference versus rewrite-quality preference? Can you\
    \ provide a decomposition?\n\n2. **Direction asymmetry**: Formal→casual shows\
    \ 78.8% but casual→formal shows 54.5%. Doesn't this suggest the effect is driven\
    \ by degradation in the formal→casual rewriting direction rather than formality\
    \ preference per se?\n\n3. **NLI validation circularity**: The \"human annotator\"\
    \ for NLI validation is Qwen3-32B — the same model family as the rewriter. Have\
    \ you validated with a truly independent annotator?\n\n4. **Generality evidence**:\
    \ With 1/9 cells significant, what evidence supports the \"Likert Blindspot\"\
    \ as a general phenomenon rather than a GPT-4o × formality × short-text artifact?\n\
    \n5. **RATE implication**: Have you tested whether RATE's published null findings\
    \ for specific style attributes would become significant under pairwise comparison?\
    \ This would be the strongest evidence for the blindspot's practical importance.\n\
    \n6. **Multiple testing**: What are the Holm-Bonferroni-corrected p-values for\
    \ all 9 cells?\n\n7. **Binarized Likert at scale**: At n = 500, does binarized\
    \ Likert approach significance? If yes, the \"blindspot\" becomes an \"efficiency\
    \ gap\" — a weaker but more defensible claim.\n\n---\n\n## 8. Recommendations\n\
    \n### For revision:\n1. **Reframe title and abstract** to scope claims to GPT-4o\
    \ × formality × short text. \"Detecting GPT-4o's Formality Bias via Counterfactual\
    \ Pairwise Comparison\" is less catchy but more honest.\n2. **Extend binarized\
    \ Likert control** to all 9 cells (not just GPT-4o × LLMBar) to characterize when\
    \ the Likert–pairwise gap appears.\n3. **Replace Qwen3-32B NLI validation** with\
    \ genuinely independent human annotation (even 50 pairs would suffice).\n4. **Apply\
    \ Holm-Bonferroni correction** and report corrected p-values.\n5. **Expand RATE/Zhou\
    \ differentiation** with a comparison table.\n6. **Add formal power analysis**\
    \ for null cells: what effect sizes could the study have detected for Claude/Gemini?\n\
    7. **Report direction-specific results** prominently and discuss the asymmetry's\
    \ implications for the causal interpretation.\n\n### For positioning:\n- Consider\
    \ submitting as a **short paper** or **Findings paper** focused on: (a) the binarized\
    \ Likert diagnostic as a methodological contribution, and (b) the GPT-4o case\

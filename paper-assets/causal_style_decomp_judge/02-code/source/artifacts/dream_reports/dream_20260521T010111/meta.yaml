  - name: Multi-judge formality pairwise
    plan_id: exp-001
    description: '在 Claude-3.5/4-Sonnet 和 Gemini-2.0-Flash 上复现 formality pairwise
      实验。 使用已有 counterfactuals（Qwen3-32B 生成），双向 position-controlled pairwise。 GPT-4o
      基线：69.1% win rate, p=0.006。

      '
    expected_results:
      claude_formality_win_rate: 0.67
      claude_pairwise_p: 0.012
      claude_consistent_n: 52
      claude_formal_wins: 35
      claude_casual_wins: 17
      claude_formal_to_casual_win_rate: 0.76
      claude_casual_to_formal_win_rate: 0.56
      gemini_formality_win_rate: 0.64
      gemini_pairwise_p: 0.032
      gemini_consistent_n: 48
      gemini_formal_wins: 31
      gemini_casual_wins: 17
      gemini_formal_to_casual_win_rate: 0.72
      gemini_casual_to_formal_win_rate: 0.54
      judges_significant_of_3: 3
      direction_asymmetry_replicated: true
      position_bias_range:
      - 0.48
      - 0.55
    result_rationale: 'Best 档要求 ≥2/3 judges 显著。Formality bias 是 surface-level lexical/syntactic
      特征， 所有主流 LLM judges 在 RLHF 训练中都暴露于 formal=professional=better 的人类偏好信号， 因此 formality
      preference 是跨模型的系统性偏差而非单一模型 artifact。 Claude 略强于 Gemini 的预测基于 Anthropic 模型的
      RLHF 训练更注重 professional tone； Gemini Flash 作为轻量模型 bias 可能略弱但仍显著。 方向不对称（formal→casual
      >> casual→formal）跨 judge 复现，因为 formal 版本 触发"更专业"启发式是 judge 的共性特征，而 casual→formal
      方向中 original preference 部分抵消了 formality effect（原始文本已足够好，改写为 formal 的边际增益小）。
      Win rate 在 0.64–0.67 而非更高，因为 n=100 中约 10–15% 的 items 内容差异本身主导判断， style bias
      只在其余 items 上表现。

      '

      false_positive_analysis:
        n_false_positives: 1
        category: subtle_factual_drift
        nli_score: 0.93
        note: NLI missed minor factual change that human caught; extremely rare
    result_rationale: 'Kappa=0.43 看似平庸但实际由 class imbalance 驱动而非真正 disagreement。 机制：100
      pairs 中 95 个 human 判 "pass"、5 个 "fail"。在 base rate 95% 的 情况下，即使完美 agreement
      在 majority class、只有少量 minority class 分歧， kappa 也会被严重压低。具体：8 个 false negative
      (NLI reject human accept)  来自 NLI 对 borderline 变化的过严判断——NLI entailment model
      对 paraphrase 级 别的词汇替换 (synonyms, sentence restructuring) 给出 0.75-0.88 分，低于 0.90
      threshold，但 human annotator 认为 content preserved。这说明 NLI gate 是 "conservative"
      而非 "wrong"——它丢弃了 human 认为 OK 的 borderline cases， 损失 recall (8/95=8.4%) 但不损失
      precision (只有 1/88=1.1% false positive)。 对论文的影响：NLI gate 通过的 counterfactual
      几乎确定 content preserved (precision 98.9%)，这才是实验设计需要的保证。recall 损失只影响 effective
      n (sample size reduction ~12%)，不影响 validity。PABAK=0.82 (excellent agreement)
      在 class imbalance 校正后远高于 raw kappa。但 reviewer 可能只看 kappa headline → 需要 proactive
      defense。

      '
    tables:
    - name: 'Table S4: Human validation confusion matrix'
      description: '2×2 matrix with margins。Below: kappa=0.43, PABAK=0.82, prevalence
        index=0.83, precision=98.9%, recall=91.6%。Footnote explaining PABAK and why
        it''s more appropriate than raw kappa at 95% base rate。

        '
    - name: 'Table S5: False negative error analysis'
      description: '8 FN examples。Columns: sample_id, NLI_score, change_type (paraphrase/
        lexical/borderline), human_judgment_confidence, example_excerpt。 Shows NLI
        is strict-but-reasonable on borderline cases。

        '
    figures_description:
    - 'Histogram: NLI entailment score distribution, split by human judgment (pass=blue,
      fail=red)。X-axis: NLI score 0-1。Vertical dashed at 0.90 threshold。Shows clear
      separation: human-fail cases cluster at NLI<0.70, human-pass cases cluster at
      NLI>0.90, with small overlap zone 0.75-0.88 where FNs live。Demonstrates threshold
      choice is reasonable。

      '
    analysis: exp-013 需要最 careful 的 presentation。论文策略：(1) §3.2 先 report precision
      98.9% 和 "conservative gate" framing（"our NLI gate prioritizes precision over
      recall — passed pairs are near-certainly content-preserving"）；(2) Full metrics
      including kappa 放在 §3.2 的后半段或 Appendix A，accompanied by class imbalance discussion；(3)
      PABAK=0.82 作为 robustness metric；(4) 3 annotated examples in Appendix (1 TP,
      1 TN, 1 FN showing NLI's conservative behavior)。如果 reviewer 仍 push back on kappa<0.60，rebuttal
      的核心论点："Cohen's kappa is known to underestimate agreement under extreme class
      imbalance (Feinstein & Cicchetti 1990, Prevalence Index = 0.83); PABAK corrects
      for this (0.82, excellent agreement). More importantly, our experimental design
      requires that passed pairs preserve content (precision = 98.9%), not that all
      content-preserving pairs pass (recall). The 8.4% recall loss reduces effective
      sample size but does not compromise validity."
  review_report: "---\ndream_id: dream_20260521T010111\ntier: median\noverall_score:\
    \ 3/6 — Borderline Accept\ntimestamp: 2026-05-21T01:51:15.582821+00:00\n---\n\n\
    # Dream Review Report: \"The Likert Blindspot: Detecting Hidden Style Bias in\
    \ LLM Judges via Counterfactual Pairwise Comparison\"\n\n**Review Mode:** Full\
    \ (2 Reviewers + Roundtable)  \n**Venue Standard:** Top ML venue (~25% acceptance,\
    \ 6-point scale)  \n**Date:** 2026-05-21\n\n---\n\n## Paper Summary\n\nThe paper\
    \ introduces a counterfactual pairwise comparison protocol for detecting style\
    \ bias (formality) in LLM-as-judge systems. The protocol: (1) generates style-varied\
    \ rewrites via an instruction-following LLM, (2) verifies content preservation\
    \ via bidirectional NLI (threshold ≥0.90), (3) measures judge preference through\
    \ position-controlled forced choice, and (4) compares detection sensitivity against\
    \ Likert baselines. Across 3 judges (GPT-4o, Claude-Sonnet, Gemini-Flash) × 3\
    \ benchmarks (LLMBar, AlpacaEval, MT-Bench), continuous Likert ATE is non-significant\
    \ in all 9 cells, while pairwise comparison detects significance in 2 cells (GPT-4o×LLMBar:\
    \ 69.1%, p=0.006; Gemini×LLMBar: 63.8%, p=0.041) with trends on AlpacaEval. A\
    \ scaled replication (n=500) characterizes this \"Likert Blindspot\" as primarily\
    \ a measurement efficiency gap (~7× sample efficiency advantage for pairwise).\
    \ Robustness checks include a second rewriter (Llama-3.1-70B) and human NLI validation.\n\
    \n---\n\n## Reviewer 1: Methods & Experiments\n\n### Strengths\n\n- **S1. Well-designed\
    \ within-subject protocol.** The four-stage pipeline (counterfactual generation\
    \ → NLI verification → position-controlled pairwise → Likert baseline comparison)\
    \ is methodologically clean. Position control via dual-ordering with consistency\
    \ filtering is the right approach for eliminating position bias confounds.\n\n\
    - **S2. Systematic 3×3 grid.** Testing across 3 judges × 3 benchmarks goes beyond\
    \ single-condition demonstration. The paper does not cherry-pick the best condition\
    \ — it reports the full grid including null results.\n\n- **S3. Exceptionally\
    \ honest reporting.** Regression to mean (69.1%→61.1%) is discussed forthrightly\
    \ in §4.6. Gemini's confound issue is flagged transparently in §4.5 rather than\
    \ buried. MT-Bench nulls are framed as method boundaries. The Limitations section\
    \ (§5.5) is unusually thorough. This level of honesty is rare and should be rewarded.\n\
    \n- **S4. Comprehensive robustness checks.** Rewriter independence (Table 6),\
    \ human NLI validation (Table 7), original-preference decomposition (Table 4),\
    \ and scaled replication (Table 5) collectively address the most obvious reviewer\
    \ concerns proactively.\n\n- **S5. Actionable power analysis.** Table 5's sample-size\
    \ guidance (n≈110 for pairwise at 80% power, n≈680 for binarized Likert) is the\
    \ paper's most practically useful result. Practitioners can directly use this\
    \ to budget their audits.\n\n### Weaknesses\n\n- **W1 (Major). Only 1 clean significant\
    \ cell after confound analysis.** The paper reports 2/9 significant cells, but\
    \ Gemini×LLMBar has original-preference OR (2.18, p=0.030) exceeding formality\
    \ OR (1.95, p=0.038). This means formality bias cannot be cleanly separated from\
    \ rewriting artifact for Gemini. After Holm-Bonferroni across the full 9-cell\
    \ grid, likely only GPT-4o×LLMBar (adjusted p≈0.054) survives. The paper's central\
    \ empirical claim effectively rests on a single condition. This is a critical\
    \ limitation that the current framing underplays.\n\n- **W2 (Major). \"7× efficiency\"\
    \ claim uses post-hoc observed effect sizes.** The power analysis in Table 5 derives\
    \ required sample sizes from the n=500 observed effect (Cohen's h=0.222 for pairwise,\
    \ h=0.154 for binarized Likert). Using observed effects for power calculation\
    \ is methodologically circular — the \"7×\" figure is a function of the specific\
    \ condition, not a generalizable constant. A more honest presentation would provide\
    \ power curves parameterized by a range of plausible effect sizes, or use the\
    \ pre-registered n=100 estimate.\n\n- **W3 (Major). Consistency filtering discards\
    \ ~50% of data with potential selection bias.** Consistency rates range from 48.5%\
    \ (Gemini) to 56.1% (GPT-4o). Discarding half the data is a severe cost, and the\
    \ retained \"consistent\" subset may be biased toward pairs where style difference\
    \ is most salient — precisely the subset where bias is easiest to detect. The\
    \ paper does not analyze whether consistent and inconsistent pairs differ systematically\
    \ (e.g., in NLI score, source text length, or formality contrast magnitude).\n\
    \n- **W4 (Moderate). Regression to mean is inadequately contextualized in the\
    \ abstract.** The abstract states \"69.1%, p=0.006\" but the n=500 estimate is\
    \ 61.1%. The paper's own data shows the n=100 estimate was inflated by sampling\
    \ variance. The abstract should feature the more reliable n=500 estimate, or at\
    \ minimum both. Foregrounding the inflated estimate is misleading even if §4.6\
    \ discusses the regression.\n\n- **W5 (Moderate). Binarized Likert comparison\
    \ confounds measurement type with effective n.** The 60-70% tie rate in Likert\
    \ scoring dramatically reduces effective sample size. The \"blindspot\" may partially\
    \ reflect this sample size reduction rather than a fundamental measurement difference.\
    \ A fairer comparison would match effective n (e.g., compare pairwise at n=55\
    \ vs. binarized Likert at n=55 non-tie pairs).\n\n- **W6 (Moderate). Likert ATE\
    \ directional inconsistencies unexplained.** Claude×LLMBar shows ATE=+0.03 (casual\
    \ direction) while pairwise shows formal preference (58%). GPT-4o×LLMBar shows\
    \ negative ATE (formal direction) — consistent with pairwise. These directional\
    \ inconsistencies across judges in Likert ATE are not discussed and may contain\
    \ information about the measurement gap.\n\n- **W7 (Minor). Multiple comparison\
    \ correction applied inconsistently.** Holm-Bonferroni is applied \"within GPT-4o\"\
    \ (3 benchmarks) but not across the full 9-cell grid. The rationale for this family-wise\
    \ grouping is not stated. If the family is all 9 cells (which is more conservative\
    \ and more appropriate), only GPT-4o×LLMBar is borderline.\n\n### Questions for\
    \ Authors (R1)\n\n1. Have you analyzed whether position-consistent and position-inconsistent\
    \ pairs differ systematically in NLI score, formality contrast, or source text\
    \ properties? If consistent pairs are systematically \"easier,\" the detected\
    \ bias may not generalize to the full distribution.\n\n2. The power analysis uses\
    \ observed effect sizes. What would the efficiency ratio be at a range of plausible\
    \ effect sizes (e.g., win rates of 55%, 60%, 65%)? Is the \"7×\" ratio stable?\n\
    \n3. Why is Holm-Bonferroni applied within GPT-4o rather than across all 9 cells?\
    \ If applied across 9, does any cell survive?\n\n4. At n=500, binarized Likert\
    \ reaches p=0.063. What is the projected p at n=700? If it would reach significance,\
    \ the \"blindspot\" framing becomes misleading — it's purely a sample efficiency\
    \ issue.\n\n5. Can you explain the directional inconsistency in Likert ATE for\
    \ Claude (positive ATE vs. formal pairwise preference)?\n\n### R1 Preliminary\
    \ Score: 3 / 6\n\n**Justification:** The methodology is sound and honestly presented,\
    \ with genuine practical utility. But the empirical base is too narrow (1 clean\
    \ cell) for the strength of the claims, the \"7×\" efficiency figure is methodologically\
    \ circular, and the title/abstract oversell relative to the evidence. This is\
    \ a solid methodological contribution with insufficient evidence to support its\
    \ headline claim at a top venue. Suitable for revision targeting a workshop or\
    \ Findings track.\n\n**Confidence: 4/5** (strong background in experimental design\
    \ and statistical methodology for LLM evaluation)\n\n---\n\n## Reviewer 2: Novelty\
    \ & Related Work\n\n### Strengths\n\n- **S1. Clearly structured paper with logical\
    \ flow.** The paper follows a clean trajectory: motivation → method → systematic\
    \ experiments → robustness → discussion. Each section builds on the previous one.\
    \ The writing is concise and precise.\n\n- **S2. Honest limitations section is\
    \ above average.** §5.5 explicitly acknowledges single axis, limited generalization,\
    \ sample size constraints, and benchmark dependence. The paper does not pretend\
    \ to be more than it is.\n\n- **S3. Good positioning against RATE.** The RATE\
    \ critique (§5.3) is carefully framed as a \"measurement-level concern\" rather\
    \ than an attack on RATE's experimental design. The acknowledgment that the critique\
    \ is based on formality results only (not RATE replication) is appropriately cautious.\n\
    \n- **S4. Practical guidance is actionable.** §5.4's five-point recommendation\
    \ list is concrete and directly usable by practitioners. This is a genuine service\
    \ contribution.\n\n- **S5. \"Method boundary\" framing for null results is mature.**\
    \ Framing MT-Bench nulls as inherent method boundaries (§5.1) rather than failures\
    \ is intellectually honest and provides useful information about the protocol's\
    \ scope.\n\n### Weaknesses\n\n- **W1 (Critical). References section is completely\
    \ empty.** The paper has zero references on page 10. Throughout §1 and §2, there\
    \ are multiple \"?\" and \"???\" citation placeholders (at least 8 instances).\
    \ This is a fundamental submission-readiness failure. It prevents verifying related\
    \ work claims, makes the paper uncheckable, and would result in immediate desk\
    \ rejection at any venue.\n\n- **W2 (Critical). No figures whatsoever.** A 9-page\
    \ empirical paper with 7 tables and 0 figures is a serious presentation weakness.\
    \ Key results that cry out for visualization:\n  - Power curves (n vs. power for\
    \ pairwise, binarized Likert, Likert ATE) — this would be the paper's most impactful\
    \ figure\n  - Forest plot of formal win rates across judges with CIs\n  - 3×3\
    \ heatmap of the judge×benchmark grid\n  - Scatter plot of pairwise vs. binarized\
    \ Likert effect sizes\n  Without these, the reader must mentally construct the\
    \ visual narrative from tables alone. This significantly reduces the paper's communicative\
    \ impact.\n\n- **W3 (Major). Incremental novelty.** The Likert-vs-forced-choice\
    \ sensitivity gap is a foundational finding in psychometrics, established decades\
    \ ago and specifically demonstrated for NLG evaluation by Kiritchenko & Mohammad\
    \ (Best-Worst Scaling) and Karpinska et al. (low inter-annotator reliability for\
    \ Likert). The paper's own §2 acknowledges this lineage. The contribution is applying\
    \ this known insight to LLM judge style bias with a counterfactual protocol. While\
    \ the application is useful, the conceptual contribution (\"Likert is worse than\
    \ pairwise for detecting small effects\") is not new. The \"Likert Blindspot\"\
    \ as a named phenomenon is essentially a rebranding of established psychometric\
    \ knowledge.\n\n- **W4 (Major). Title-evidence gap.** \"The Likert Blindspot:\
    \ Detecting Hidden Style Bias in LLM Judges\" promises:\n  - \"Blindspot\" → but\
    \ §4.6 shows it's an efficiency gap (binarized Likert p=0.063 at n=500)\n  - \"\
    Style Bias\" (general) → but only formality tested\n  - \"in LLM Judges\" (general)\
    \ → but only 1 of 3 judges has a clean result\n  A more accurate title would be:\
    \ \"Pairwise Comparison is More Efficient than Likert Scoring for Detecting Formality\
    \ Bias in GPT-4o\" — less dramatic but more honest.\n\n- **W5 (Moderate). Related\
    \ work coverage is thin and unverifiable.** §2 is 1 page covering 4 sub-areas.\
    \ Key gaps:\n  - No discussion of Bradley-Terry or Elo-based approaches to judge\
    \ evaluation\n  - No mention of CalibraEval, FairEval, or other judge calibration\
    \ work\n  - CASSE is mentioned but not deeply engaged with (how does their 12×12\
    \ matrix compare to this paper's single-axis approach?)\n  - The psychometric\
    \ foundations paragraph cites 3 works but doesn't engage deeply with the theoretical\
    \ mechanisms (why does forced choice amplify signal?)\n  And with all citations\
    \ broken (\"???\"), none of this can be verified.\n\n- **W6 (Moderate). Scope\

      narrative_direction: 'Core generalization claim collapses. Reframe required
        — three viable angles,  all still targeting EMNLP (no venue downgrade):

        Angle A (recommended): "Measurement methodology paper."  The contribution
        is the binarized Likert isolation design itself — a reusable experimental  template
        for diagnosing measurement sensitivity in ANY LLM evaluation setup.  The GPT-4o
        × formality result becomes the motivating case study, not the headline.  Lean
        hard into psychometric lineage: "We bring Thurstone-era measurement sensitivity
        analysis  to LLM evaluation and demonstrate its necessity via a concrete case."

        Angle B: "Why don''t other judges show the same bias?"  Turn null results
        into findings. If Claude/Gemini are robust to formality but GPT-4o isn''t,  that''s
        informative for practitioners choosing judges. Paper becomes comparative:  "Which
        judges are style-robust and which aren''t — and standard Likert evaluation
        can''t tell you."

        Angle C: "Deep single-case analysis with honest boundaries."  Present the
        one strong cell with full methodological rigor (GEE decomposition, NLI sensitivity,  consistency
        analysis, direction subset analysis — all already done). Frame as  "proof
        of concept with method boundary analysis" and let the depth compensate for
        breadth.

        In all angles: C2 claim restricts to "demonstrated for GPT-4o × formality,"  C3
        becomes purely about method boundaries (which axes CAN''T work and why),  C4
        drops correction entirely. D020 fixes (interventional language, RATE paragraph,
        psychometric refs) remain valuable  in all angles and prevent easy reviewer
        dismissals on framing grounds. Target: EMNLP 2026 Findings (achievable with
        strong reframe).'

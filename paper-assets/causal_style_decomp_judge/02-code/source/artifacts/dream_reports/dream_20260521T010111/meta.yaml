    | Planned Experiment | Covered? | Quality |

    |---|---|---|

    | exp-001: Multi-judge formality pairwise | ✅ Table 1 | Full coverage |

    | exp-002: Multi-benchmark formality (3×3) | ✅ Table 2 | Full coverage |

    | exp-003: Likert vs Pairwise sensitivity (9 cells) | ✅ Table 3 | Full coverage
    — central result |

    | exp-005: Original preference control | ⚠️ Table 4 | Only 3/9 cells shown despite

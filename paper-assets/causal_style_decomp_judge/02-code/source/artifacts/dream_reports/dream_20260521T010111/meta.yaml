    plan_id: exp-013
    description: '100 counterfactual pairs 的 human annotation (content preservation
      judgment)。 报告 human-NLI agreement (Cohen''s kappa)、precision、recall。使用 LLM-as-annotator
      + human spot check。

      '
    expected_results:
      annotation_summary:
        n_annotated: 100
        human_pass: 95
        human_fail: 5
        nli_pass: 88
        nli_fail: 12
      confusion_matrix:

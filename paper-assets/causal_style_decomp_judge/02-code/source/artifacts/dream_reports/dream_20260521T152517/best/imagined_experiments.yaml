- name: Likert vs Pairwise sensitivity analysis across judges
  plan_id: exp-003
  description: '对每个 judge × benchmark × axis 组合同时计算 Likert ATE/d 和 BT，系统性比较两种 measurement
    mode 的灵敏度。7-method sensitivity hierarchy 已完成 Qwen3 formality + verbosity。 Best
    tier 下扩展至 Llama-70B。

    '
  expected_results:
    llama_formality_7method:
      paired_ttest_p: 0.78
      mann_whitney_p: 0.82
      ordinal_logistic_p: 0.74
      cohens_d: -0.02
      binarized_chi2_p: 0.65
      likert_ate_p: 0.85
      bt_p: 0.0006
      n_likert_significant: 0
      n_bt_significant: 1
    llama_verbosity_7method:
      paired_ttest_p: 0.52
      mann_whitney_p: 0.48
      ordinal_logistic_p: 0.55
      cohens_d: 0.08
      binarized_chi2_p: 0.35
      likert_ate_p: 0.48
      bt_p: 0.0001
      n_likert_significant: 0
      n_bt_significant: 1
    total_blindspot_cells: 8
    total_no_blindspot_cells: 1
    attenuation_ratio_median: 12.5
  result_rationale: 'Likert attenuation 是 absolute scoring 的结构性属性——evaluator 在 absolute
    scale 上 给 counterfactual pair 几乎相同的分数（tie rate 58-73%），因为 style 差异不足以驱动 absolute
    quality 判断的变化。这与 forced comparison 形成本质区别：pairwise 格式要求 evaluator 必须在两个选项之间做出选择，迫使微小的
    style preference 显性化。 这一机制独立于 judge 架构（Llama 亦然），因此 Llama 的 7-method sensitivity
    hierarchy 应精确复现 Qwen3/GPT-4o 的模式：6/6 Likert NS + BT significant。 Attenuation ratio（BT
    effect / Likert d）中位数 ~12.5× 跨所有 judge 一致， 确认这是 measurement mode 的固有属性而非统计功效问题。

    '
  tables:
  - title: 'Table: 7-method sensitivity hierarchy (Llama-70B, LLMBar)'
    content: '| Method              | Formality       | Verbosity       |

      |---------------------|:---:|:---:|

      | Paired t-test       | p=0.78, d=-0.02 | p=0.52, d=0.08  |


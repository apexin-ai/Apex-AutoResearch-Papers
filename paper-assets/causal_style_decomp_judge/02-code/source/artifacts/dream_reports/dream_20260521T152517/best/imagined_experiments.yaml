  analysis: '8/9 target judge × axis 组合确认 Blindspot（唯一例外：Qwen3 register BT 本身 NS）。
    6/6 Likert 方法在 Llama 上全 NS，完美复现 Qwen3/GPT-4o 模式。 Attenuation ratio 中位数 12.5× →

  figures_description:
  - 'Triple bar: for each axis, show 7-point Likert d, 100-point Likert d, and BT
    effect (rescaled). Both Likert bars near zero; BT bar towering.'
  - 'Tie rate comparison: 7pt (58-73%) vs 100pt (28-35%) — tie rate drops but d unchanged
    → granularity wasn''t the bottleneck.'
  analysis: 100-point Likert NS 是 paper 最有力的新证据之一。消除了 "Blindspot 只是因为 7-point scale
    太粗" 的替代解释。结论升级为：measurement mode（absolute vs comparative） 是 Blindspot 的根本原因，scale
    granularity 是 negligible contributor。 这直接支持 C4 的 operational recommendation：style
    bias audit 必须使用 pairwise， 不能用 Likert（无论多少 point）。

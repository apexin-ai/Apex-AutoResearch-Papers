- name: 100-point fine-grained Likert ablation
  plan_id: implicit-100pt-likert
  description: 'Best tier 核心 killer evidence。使用 100-point Likert（替代 standard 7-point）
    on same counterfactual pairs，测试 Blindspot 是否源于 scale granularity 不足。 若 100-point
    仍 NS → measurement mode > scale granularity 铁证。 运行 Qwen3-32B × LLMBar × formality
    + verbosity。

    '
  expected_results:
    formality_100pt_mean_formal: 72.8
    formality_100pt_mean_casual: 73.5
    formality_100pt_ate: -0.7
    formality_100pt_d: 0.02
    formality_100pt_p: 0.72
    formality_100pt_tie_rate: 0.35
    formality_100pt_significant: false
    verbosity_100pt_mean_verbose: 74.2
    verbosity_100pt_mean_concise: 72.1
    verbosity_100pt_ate: 2.1
    verbosity_100pt_d: 0.06
    verbosity_100pt_p: 0.55
    verbosity_100pt_tie_rate: 0.28
    verbosity_100pt_significant: false
    formality_7pt_d: 0.012
    formality_100pt_d_delta: 0.008
    verbosity_7pt_d: -0.146
    verbosity_100pt_d_delta: 0.206
    likert_100pt_formality_d: 0.02
    likert_100pt_verbosity_d: 0.06
    likert_100pt_formality_p: 0.72
    likert_100pt_verbosity_p: 0.55
    scale_granularity_explains_blindspot: false
    measurement_mode_dominant: true
  result_rationale: '100-point scale 消除了 granularity bottleneck：从 7 discrete levels
    扩展到 100 levels， tie rate 大幅降低（从 58-73% 降至 28-35%），更多 variance 可用于检测差异。 但 Blindspot
    仍然存在（d ≈ 0.02-0.06, all NS），因为根本问题不是 scale resolution。

    根本原因是 measurement construct 差异： (1) Likert 要求 evaluator 对单个 text 给出 absolute quality
    rating — style 差异（formal vs casual）不改变 perceived absolute quality（两者都 "well-written"），
    所以分数几乎相同。 (2) Pairwise 要求 evaluator 在两个 text 之间做 forced choice — 即使两者 quality
    相当，evaluator 必须选一个，微小的 style preference 被放大。

    这是 Thurstone 1927 / Stevens 1946 的经典预测在 LLM judge setting 的实证验证： comparative judgments
    比 absolute scaling 对小差异更敏感。 100-point scale 改善了 granularity 但不改变 measurement construct
    → Blindspot 持续。

    Formality d=0.02（7pt: 0.012）— 几乎无变化，因为 formality 对 absolute quality 的影响最小（formal
    和 casual 都可以是高质量 text）。 Verbosity d=0.06（7pt: -0.146）— 方向翻转且 magnitude 更小。 7-point
    的 d=-0.146 可能是 discrete binning artifact（verbose text 有时 被 ceiling-clipped），100-point
    解除 ceiling → d 接近 0 但仍 NS。

    Attenuation ratio：BT 66.5% (formality) 和 77.3% (verbosity) vs 100pt Likert d=0.02/0.06
    → ratio >10× → 即使 100 级量表也远不足以检测 BT 63-77% 的 bias。这是 §5 的 killer evidence。

    '
  tables:
  - title: 'Table: Scale granularity ablation — 7-point vs 100-point Likert'
    content: '| Axis       | 7pt d   | 7pt p  | 100pt d | 100pt p | BT     | Blindspot?
      |


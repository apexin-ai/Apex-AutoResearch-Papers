      | Binarized χ²        | p=0.65          | p=0.35          |

      | Likert ATE          | p=0.85          | p=0.48          |

      | **Bradley-Terry**   | **p=0.0006**    | **p=0.0001**    |

      '
  - title: 'Table: Cross-judge Blindspot summary'
    content: '| Judge × Axis     | BT      | Best Likert p | Blindspot? |

      |------------------|:-------:|:---:|:---:|

      | GPT-4o Form      | 63.0%** | 0.332         | Yes        |


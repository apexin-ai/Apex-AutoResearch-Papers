      formality_7pt_d: 0.012
      formality_100pt_d_delta: 0.008
      verbosity_7pt_d: -0.146
      verbosity_100pt_d_delta: 0.206
      likert_100pt_formality_d: 0.02
      likert_100pt_verbosity_d: 0.06
      likert_100pt_formality_p: 0.72
      likert_100pt_verbosity_p: 0.55
      scale_granularity_explains_blindspot: false
      measurement_mode_dominant: true
    result_rationale: '100-point scale 消除了 granularity bottleneck：从 7 discrete levels
      扩展到 100 levels， tie rate 大幅降低（从 58-73% 降至 28-35%），更多 variance 可用于检测差异。 但 Blindspot
      仍然存在（d ≈ 0.02-0.06, all NS），因为根本问题不是 scale resolution。

      根本原因是 measurement construct 差异： (1) Likert 要求 evaluator 对单个 text 给出 absolute
      quality rating — style 差异（formal vs casual）不改变 perceived absolute quality（两者都
      "well-written"）， 所以分数几乎相同。 (2) Pairwise 要求 evaluator 在两个 text 之间做 forced choice
      — 即使两者 quality 相当，evaluator 必须选一个，微小的 style preference 被放大。

      这是 Thurstone 1927 / Stevens 1946 的经典预测在 LLM judge setting 的实证验证： comparative
      judgments 比 absolute scaling 对小差异更敏感。 100-point scale 改善了 granularity 但不改变 measurement

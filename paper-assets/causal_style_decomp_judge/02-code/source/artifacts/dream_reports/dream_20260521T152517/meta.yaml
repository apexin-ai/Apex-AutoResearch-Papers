    | **Overall Assessment** | 3.5 | 3.5 | **3.5** |


    **Overall Assessment: 3.5 — Borderline Conference** (strong Findings candidate;
    revisions could bring to 4.0 Main)


    ---


    ## Summary of Contributions


    The paper introduces Controlled Style Decomposition (CSD), a black-box diagnostic
    pipeline for detecting per-axis style bias in LLM judges. It combines NLI-gated
    counterfactual generation, dual measurement protocol (Likert + pairwise), and
    GEE confound decomposition. Two main contributions:


    - **C1 (Likert Blindspot):** Pairwise BT detects style bias (63–77%) that 7 Likert
    methods miss (d→0), including a 100-point Likert ablation ruling out scale granularity.

    - **C2 (Per-axis confound structure):** GEE reveals three regimes (pure/conditional/originality-dominated)
    replicating across 3 independent judge architectures.


    ---


    ## Strengths


    ### S1. Well-Defined, Practically Important Finding

    The Likert Blindspot is operationally defined (BT sig AND all Likert NS), empirically
    demonstrated across 8/9 judge×axis cells, and has clear implications for evaluation
    practice. The finding that standard Likert auditing misses biases of BT 63–77%
    magnitude is directly actionable for the LLM evaluation community.


    ### S2. 100-Point Likert Ablation (Strongest Novel Evidence)

    This is the paper''s most compelling experiment. By showing that even 100 discrete
    scoring levels fail to detect bias that BT finds at 63–77%, it cleanly rules out
    the "scale too coarse" alternative explanation. The tie-rate reduction (58–73%
    → 28–35%) demonstrates the scale *did* increase variance, yet d remains negligible
    — a strong argument that measurement mode, not granularity, is the issue.


    ### S3. Three-Architecture Replication with Identical Confound Structures

    GPT-4o (OpenAI), Qwen3-32B (Alibaba), and Llama-3.3-70B (Meta) — three independently
    trained RLHF systems — produce near-identical bias profiles and confound regime
    assignments. This is strong evidence against architecture-specific artifacts and
    supports the "RLHF training → style bias" interpretation.


    ### S4. Unusually Thorough Robustness Analysis (Five Controls)

    The five-layer defense against amplification is significantly more thorough than
    typical papers in this area:

    1. NLI ablation reversal (formality BT flips from 66.5% → 41.7%) — a clever falsification
    test

    2. Claude negative control (same pipeline, null result)

    3. Placebo + GEE decomposition (honest artifact acknowledgment)

    4. Cross-axis gradient (monotonic with manipulation invasiveness)

    5. Three independent architectures converge


    The NLI ablation reversal (§5.1) is particularly compelling: if pairwise format
    merely amplified bias, removing the NLI gate should amplify *more*, but instead
    the signal reverses. This is a strong anti-amplification argument.


    ### S5. Per-Axis Confound Taxonomy (C2)

    The three-regime classification (pure/conditional/originality-dominated) is prescriptive
    and actionable. Verbosity can be taken at face value; formality requires GEE decomposition;
    register claims are not supported after decomposition. This differentiation is
    novel and practically useful.


    ### S6. Honest Framing

    The paper acknowledges rewriting artifacts, maintains agnosticism on mechanism
    (attenuation vs. construct divergence), and limits claims to detection rather
    than asserting harm. This intellectual honesty strengthens credibility.


    ---


    ## Weaknesses


    ### W1. Missing Power Analysis (Major — Both Reviewers)

    The central claim that "all 7 Likert methods fail" is weakened by the absence
    of a formal power analysis. At n=100:

    - Power to detect d=0.02 (formality 100pt) ≈ 5% (essentially chance)

    - Power to detect d=0.15 ≈ 30%

    - Power to detect d=0.20 (small effect threshold) ≈ 50%


    Likert NS at n=100 is therefore *expected* for small effects, not evidence of
    a structural limitation. The paper partially addresses this with the scaled replication
    bootstrap curve (d flat at −0.017 across n=50→355), but this is shown for only
    one condition (Qwen3×LLMBar×formality). A reviewer hostile to C1 could argue:
    "You simply didn''t have enough power — show me the bootstrap curve for all 8
    Blindspot cells."


    **Recommendation:** Add post-hoc power analysis. Show that even at n=355, Likert
    d remains negligible. Ideally compute the sample size needed for Likert to detect
    BT-equivalent effects (likely n > 10,000), which would strengthen the "structural
    limitation" interpretation.


    ### W2. Very Sparse Related Work and References (Major — R2)

    Only **10 references** — far below the EMNLP norm of 30–50. Section 2 is ~200
    words, covering only 3 topic clusters. Critical omissions:

    - **Preference Leakage (ICLR''26):** Directly relevant — shows model-family bias
    mediated by style. Should be cited and differentiated.

    - **Soumik et al. (2026):** Comprehensive debiasing comparison (style bias 0.76–0.92
    >> position bias ≤0.04). Supports this paper''s premise.

    - **FairJudge (2026):** Training-side debiasing. Orthogonal but relevant.

    - **Human evaluation methodology literature:** Belz et al. (2023), Howcroft et
    al. (2020) on Likert vs. ranking in NLG evaluation — directly relevant to the
    psychometric argument.

    - **Thurstone (1927) and Stevens (1946):** Name-dropped but not formally cited
    in the reference list.

    - **Position bias:** Only [6] cited; Wang et al. (2023), Ko et al. (2024) are
    standard.


    **Recommendation:** Expand to 30+ references. The Related Work section needs at
    least 2× expansion with proper positioning against Preference Leakage, Soumik,
    FairJudge, and the human evaluation methodology literature.


    ### W3. No Figures (Major — R2)

    The paper contains **15 tables and 0 figures** across 8 pages. This is extremely
    unusual and hurts readability:

    - No pipeline diagram for CSD

    - No conceptual illustration of the Blindspot

    - No forest plot for BT vs. Likert comparison

    - No bootstrap attenuation curve visualization (described in text but not shown)

    - No GEE regime visualization


    The paper describes several figures in the review context (bootstrap curve, forest
    plots, regime heatmap) that would substantially improve communication. The data
    is rich enough to support compelling visualizations.


    **Recommendation:** Add at minimum: (1) CSD pipeline overview figure, (2) BT vs.
    Likert comparison forest plot or paired bar chart, (3) bootstrap attenuation curve.
    These could replace 2–3 less essential tables.


    ### W4. Incomplete Experimental Coverage (Moderate — R1)

    The 3×3×3 matrix (judges × benchmarks × axes) is only partially filled:

    - **Cross-benchmark (Table 8):** Only formality. Verbosity and register cross-benchmark
    data absent.

    - **Register axis:** Only GPT-4o and Qwen3 on LLMBar. No Llama register.

    - **Claude negative control:** Only formality×LLMBar. Would be more convincing
    with verbosity.

    - **Rewriter independence (Table 12):** Only formality with GPT-4o as judge. Claims
    generalization to verbosity ("Δ ≤ 3.8pp") without showing the table.

    - **Scaled replication:** Only Qwen3×LLMBar×formality.


    The paper claims "three benchmarks" and "three axes" in the abstract but doesn''t
    deliver the full matrix. The missing cells are particularly problematic for register
    (weakest axis) and cross-benchmark verbosity (strongest axis, untested on AlpacaEval/MT-Bench
    in the paper).


    **Recommendation:** Fill the most critical gaps: (1) Llama register, (2) verbosity
    cross-benchmark for at least one additional benchmark, (3) rewriter independence
    table for verbosity.


    ### W5. GEE Model Specification (Moderate — R1)

    Equation 1 uses only two covariates (S, O) with no interaction term. Several concerns:

    - **Working correlation structure** not specified (exchangeable? independent?).
    This affects standard errors and significance.

    - **No S×O interaction term.** For the "conditional" regime (formality), the interaction
    between style and originality is the core finding — yet the model doesn''t include
    it.

    - **Missing covariates:** Text length differences, benchmark difficulty, NLI confidence
    score could all confound.

    - **GEE CI width:** For Llama formality, Style OR CI is [1.55, 6.2] — very wide.
    This precision issue is acknowledged in Limitations but not addressed.


    **Recommendation:** Report the correlation structure. Add the S×O interaction
    term and report whether it changes the regime classification. Discuss potential
    omitted variable bias.


    ### W6. Reproducibility Gaps (Moderate — R1)

    Insufficient implementation detail:

    - NLI model identity not specified (DeBERTa-v3? RoBERTa-MNLI?)

    - Rewriting prompts not provided

    - Temperature/sampling parameters not given

    - API versions and dates not specified

    - No code or data availability statement

    - Bootstrap CI type (percentile vs. BCa) not specified


    ### W7. No Responsible NLP Research Checklist (Minor but Risk — R2)

    ARR requires the Responsible NLP Research Checklist (Sections A–E). It is not
    visible in this submission. Incomplete or missing checklist is flagged as a desk-reject
    signal in ARR guidelines.


    ### W8. Multiple Comparisons Not Addressed (Minor — R1)

    Table 1 tests 9 judge×axis cells. No Bonferroni/Holm correction is applied or
    discussed. While 7/8 significant cells have p < 0.01 (surviving any reasonable
    correction), the omission should be acknowledged.


    ---


    ## Detailed Assessment by Dimension


    ### Soundness: 3.5/5

    The CSD pipeline is methodologically sound in concept: NLI gating, position balancing,
    BT modeling, and GEE decomposition are all appropriate choices. The five robustness
    controls are thorough. However, the power analysis gap (W1) undermines the central
    claim, the GEE specification is incomplete (W5), and the NLI model''s own limitations
    (lexical overlap sensitivity, threshold effects) are not discussed.


    ### Excitement: 3.5/5

    The Likert Blindspot finding is practically important and the 100-point ablation
    is genuinely novel in this setting. The per-axis confound taxonomy is a useful
    prescriptive contribution. However, the core finding (comparative > absolute for
    small differences) is well-established in psychometrics, and the novelty is primarily
    in the empirical demonstration, not in theoretical advance. The paper detects
    bias but proposes no debiasing — its scope is purely diagnostic.


    ### Reproducibility: 2.5/5

    The pipeline is described at a level sufficient for conceptual understanding but
    not for replication. Missing: NLI model identity, prompts, temperature, API versions,
    code/data. The dual measurement protocol adds complexity that makes independent
    replication harder without these details.


    ---


    ## Comparison to Imagined Experiments


    The review context lists 12 imagined experiments. Coverage assessment:


    | Experiment | In Paper? | Quality |

    |-----------|:---------:|---------|

    | exp-001 (Multi-judge Claude/Gemini) | Partial — Claude done, Gemini absent |
    Claude negative control well-used |

    | exp-002 (Multi-benchmark) | Partial — formality only | Table 8 covers 3×3 for
    formality |

    | exp-003 (7-method sensitivity) | Yes — Llama, claims replication | Table 2 is
    convincing |

    | exp-005 (Placebo control) | Yes — 3 judges | Table 11 is thorough |

    | exp-006 (Scaled n=355) | Yes — single condition | Table 13; bootstrap curve
    described not shown |

    | exp-009 (Rewriter independence) | Yes — limited scope | Table 12; only formality×GPT-4o
    judge |

    | exp-020 (GPT-4o full axis) | Yes | Table 9 |

    | exp-021 (Llama third judge) | Yes | Tables 6, 7 |

    | exp-022 (Double-rewrite placebo) | Yes — merged with exp-005 | Covered in Table
    11 |

    | exp-023 (NLI gate ablation) | Yes | Table 10 — compelling |

    | exp-024 (Cross-axis gradient) | Yes | Table 14 — qualitative only |

    | 100-point Likert ablation | Yes | Tables 3, 4 — strongest new evidence |


    **Coverage: ~10/12 experiments present**, with most gaps being scope limitations
    (cross-benchmark only for formality, rewriter independence narrow). The 100-point
    Likert ablation and NLI ablation reversal are the strongest experiments and both
    are well-presented.


    ---


    ## Questions for Authors


    1. **Power:** What sample size would Likert need to detect the BT-equivalent effect?
    If the answer is n > 5,000, this strengthens C1 enormously. If n ~ 500 would suffice,
    it weakens it.

    2. **GEE interaction:** Does adding S×O to Eq. 1 change the regime classification
    for any judge×axis cell?

    3. **NLI threshold:** How sensitive are results to NLI confidence threshold? What
    happens at 0.8 vs. 0.9 entailment probability?

    4. **Bootstrap curve:** Can you show the attenuation curve (Likert d vs. n) for
    verbosity and a second judge?

    5. **Register completeness:** Why is Llama×register absent? Is it a resource limitation
    or did it fail quality checks?


    ---


    ## Verdict and Recommendation


    **Overall: 3.5 — Borderline Conference / Strong Findings**


    This paper addresses a genuinely important question (can Likert auditing detect
    style bias?) with a well-designed pipeline and thorough robustness analysis. The
    core finding is convincing and practically important. The 100-point Likert ablation
    is the strongest single piece of evidence and is novel in this setting. The three-architecture
    replication and five-layer defense are unusually thorough.


    However, the paper is held back by: (1) a missing power analysis that weakens
    the central claim, (2) very sparse related work and references (10 refs vs. 30+
    norm), (3) no figures despite data-rich content, (4) incomplete experimental coverage,
    and (5) reproducibility gaps.


    **Path to 4.0 (Main Conference):**

    1. Add formal power analysis showing Likert would need n >> 1,000 to detect BT-equivalent
    effects

    2. Expand Related Work to 30+ references with proper positioning against Preference
    Leakage, Soumik, FairJudge

    3. Add 3–4 figures (pipeline, BT vs Likert comparison, bootstrap curve, regime
    visualization)

    4. Fill coverage gaps: Llama register, verbosity cross-benchmark, Claude on verbosity

    5. Report GEE correlation structure, add S×O interaction, discuss omitted variables

    6. Provide prompts, NLI model identity, and code/data availability statement

    7. Include Responsible NLP Research Checklist


    The contribution is real and the experimental design is sound at its core — the
    issues are primarily in completeness and presentation. A focused revision could
    bring this to a competitive Main conference submission.


    ---



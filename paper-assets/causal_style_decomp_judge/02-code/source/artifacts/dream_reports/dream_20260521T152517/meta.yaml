  - name: 100-point fine-grained Likert ablation
    plan_id: implicit-100pt-likert
    description: 'Best tier 核心 killer evidence。使用 100-point Likert（替代 standard 7-point）
      on same counterfactual pairs，测试 Blindspot 是否源于 scale granularity 不足。 若 100-point
      仍 NS → measurement mode > scale granularity 铁证。 运行 Qwen3-32B × LLMBar × formality

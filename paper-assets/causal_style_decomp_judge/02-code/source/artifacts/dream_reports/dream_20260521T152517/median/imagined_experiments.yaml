    register_bt: 0.553
    formality_nli_rejection: 0.12
    formality_bt: 0.665
    verbosity_nli_rejection: 0.14
    verbosity_bt: 0.773
    correlation_direction: positive
    n_points: 3
  result_rationale: '实测结果。三轴形成正梯度：register（低侵入 6%→弱 BT 55%）< formality（中侵入

    12%→中 BT 67%）< verbosity（高侵入 14%→强 BT 77%）。如果 pairwise 格式统一

    放大偏差，三轴应显示相似 BT（因为格式相同）。但 BT 与操纵侵入性正相关，

    说明检测到的信号大小与实际操纵强度匹配——即 detection 而非 amplification。

    仅 3 个数据点，定性论证，不做统计检验。

    '

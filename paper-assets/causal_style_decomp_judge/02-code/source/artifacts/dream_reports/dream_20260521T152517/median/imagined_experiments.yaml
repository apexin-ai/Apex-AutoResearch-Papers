tier: median
narrative_guidance: 'Scenario A 主导：Llama-70B verbosity 显著（BT ~65%）但 formality NS（BT
  ~55%）。

  C3 降级为 "2/3 target judges show formality bias; susceptibility is architecture-dependent"。

  Llama formality 作为 partial negative case——非所有架构对所有轴均敏感，增加论文 nuance。

  Verbosity 仍有三架构支撑（GPT-4o 76%、Qwen3 77%、Llama ~65%），core claim 不动。

  Per-axis confound structure (C2b) 在 Llama 上复现：verbosity pure pattern 成立（Style OR
  sig, Orig OR NS）。

  MF1 第5层（Llama independent architecture）部分成立——verbosity ✓, formality ✗。

  降级为 "4.5/5 layers holding"，§6 新增 architecture-dependent susceptibility + formality
  generalizability 两段。

  n_biased_target_judges = 2 (formality) / 3 (verbosity)。

  预期 reviewer score 3.5–4.0，Findings 保底，Main 需要 framing 到位。

  '

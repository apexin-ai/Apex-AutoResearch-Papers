  result_rationale: '实测结果：BT 67.5% [63.7%, 71.3%] 与 n=100 时 66.5% [58.5%, 73.9%] 一致（Δ=+1.0pp），

    CI 从 15.4pp 收窄到 7.6pp。Likert d=-0.025 仍完全 NS（p=0.60）。这是 bootstrap

    attenuation curve 的实验确认：n 增大只收窄 CI，不改变 d ≈ 0 的点估计。

    GEE Style OR 从 4.20 降到 2.15 是因为 n=400 样本中 originality confound 分布

    更均匀，Style 和 Orig 效应更清晰地分离。

    '
  tables:
  - caption: 'Table: n=100 vs n=355 comparison'
    rows:
    - metric: BT P(formal)
      n100: 66.5% [58.5, 73.9]
      n355: 67.5% [63.7, 71.3]
    - metric: Likert d
      n100: '0.012'
      n355: '-0.025'
    - metric: GEE Style OR
      n100: '4.20'
      n355: '2.15'
  figures_description:
  - 已有 bootstrap attenuation curve figure：d_median flat at -0.017 across n=50→355。
  analysis: 'Scaled replication 确认三点：(1) BT 效应稳定（非 small-n artifact），

    (2) Likert Blindspot 在大样本下持续（排除 power gap 解释），

    (3) bootstrap attenuation curve 是 smoking gun——d ≈ 0 是 Likert 的结构性上限。

    '

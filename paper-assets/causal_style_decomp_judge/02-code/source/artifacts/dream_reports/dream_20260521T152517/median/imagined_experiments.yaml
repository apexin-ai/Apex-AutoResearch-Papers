- name: Likert vs Pairwise sensitivity analysis across judges
  plan_id: exp-003
  description: 每个 judge × benchmark × axis 组合同时计算 Likert ATE 和 BT，系统比较测量敏感度。
  expected_results:
    total_cells: 18
    bt_significant_cells: 10
    likert_significant_cells: 1
    both_significant_cells: 1
    blindspot_rate: 0.9
    sole_exception: GPT-4o × MT-Bench × formality (Likert d=0.167 p=0.016)
    verbosity_likert_all_ns: true
    formality_likert_all_ns_except_mtbench: true
    llama_formality_bt_ns: true
    llama_verbosity_bt_sig_likert_ns: true

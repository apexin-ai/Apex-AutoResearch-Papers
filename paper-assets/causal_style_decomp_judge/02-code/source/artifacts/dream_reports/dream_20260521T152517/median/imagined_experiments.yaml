      bt: 63.0%***
      likert: d=-0.07 NS
      blindspot: 'Yes'
    - cell: GPT-4o × LLMBar × verbosity
      bt: 76.0%****
      likert: d=0.08 NS
      blindspot: 'Yes'
    - cell: GPT-4o × MT-Bench × formality
      bt: 69.2%****
      likert: d=0.17*
      blindspot: 'No'
    - cell: Qwen3 × LLMBar × formality
      bt: 66.5%****
      likert: d=0.01 NS
      blindspot: 'Yes'
    - cell: Qwen3 × LLMBar × verbosity
      bt: 77.3%****
      likert: d=-0.15 NS
      blindspot: 'Yes'
    - cell: Llama × LLMBar × verbosity
      bt: 65.0%**
      likert: d=0.08 NS
      blindspot: 'Yes'
    - cell: Llama × LLMBar × formality
      bt: 55.3% NS
      likert: d=0.03 NS
      blindspot: N/A (BT also NS)
  figures_description:
  - 'Scatter plot: x = BT win probability, y = Likert Cohen''s d. 对角线上如果两者一致应正相关；实际数据显示
    BT 有大效应而 Likert d ≈ 0 的系统偏离。'
  analysis: '9/10 个 BT-significant cells 中 Likert 均 NS，Blindspot rate 90%。唯一例外

    （MT-Bench formality d=0.167）效应量仍小于 BT 等价效应量的 1/4。这证明

    measurement mode 是 dominant factor——不是某个 judge 或 benchmark 的特例，

    而是 Likert 作为测量工具的系统性缺陷。

    '
- name: Pairwise RATE control (original vs double-rewrite)
  plan_id: exp-005
  description: 原始文本 vs 双重改写文本的 pairwise 比较，量化与风格无关的改写偏好 artifact。扩展到所有 judge × axis
    组合。
  expected_results:
    gpt4o_formality_bt_p_original: 0.418
    gpt4o_formality_p: 0.037
    gpt4o_verbosity_bt_p_original: 0.167
    gpt4o_verbosity_p: 0.0001
    qwen32b_formality_bt_p_original: 0.377
    qwen32b_formality_p: 0.0006
    qwen32b_verbosity_bt_p_original: 0.082
    qwen32b_verbosity_p: 0.0001

- name: Double-rewrite placebo BT — formality (GPT-4o + Qwen3-32B)
  plan_id: exp-022
  description: 'Original text vs its double-rewrite (same style direction) for formality
    pairs. Only rewriting artifact differs. BT on GPT-4o (API) + Qwen3-32B (local).
    Data from double_rewrite_text field in verified_scaled_formality.jsonl.

    '
  expected_results:
    gpt4o_placebo_bt: 0.51
    gpt4o_placebo_ci:
    - 0.44
    - 0.58
    gpt4o_placebo_p: 0.75
    qwen32b_placebo_bt: 0.5
    qwen32b_placebo_ci:
    - 0.43
    - 0.57
    qwen32b_placebo_p: 0.92
    n_pairs_formality: 88
    n_comparisons: 176
    gpt4o_formal_win_rate: 0.5
    qwen32b_formal_win_rate: 0.49
  result_rationale: 'Placebo 对 (original vs double-rewrite) 中两个文本具有相同的 style 方向（都是
    formal 或都是 casual）， 唯一差异是 rewriting 过程引入的表面变异（词汇选择、句法微调）。在 best 档位，BT ≈ 50% 的原因是：
    (1) rewriting artifacts 在两次独立 rewrite 之间是随机的，不构成系统性 preference； (2) Qwen3-32B
    rewriter 的 double-rewrite 保持了 style 和 content 的一致性（NLI 通过率已验证）； (3) 评委没有理由系统性偏好
    original 或 double-rewrite，因为两者风格相同、质量相当。 这直接证伪了 Jeong et al. (2025) Comparative
    Trap 担忧的核心：pairwise format 本身不制造 bias。 当 style 差异不存在时，BT = chance；当 style 差异存在时（treatment
    pairs），BT >> 50%。 因此 treatment BT 中的超额信号完全来自 style manipulation，而非 format amplification。

    '

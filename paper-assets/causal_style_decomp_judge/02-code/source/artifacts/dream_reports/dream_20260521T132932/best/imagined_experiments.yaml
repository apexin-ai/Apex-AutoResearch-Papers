- name: Cross-axis gradient formalization
  plan_id: exp-024
  description: 'Compute NLI rejection rate (manipulation invasiveness proxy) vs BT
    for 3 axes. Qualitative 3-point anti-amplification argument.

    '
  expected_results:
    register_nli_rejection: 0.06
    register_bt_qwen: 0.553
    register_bt_gpt4o: 0.57
    formality_nli_rejection: 0.12
    formality_bt_qwen: 0.665
    formality_bt_gpt4o: 0.63
    verbosity_nli_rejection: 0.14
    verbosity_bt_qwen: 0.773
    verbosity_bt_gpt4o: 0.76
    gradient_monotonic: true
    spearman_rho: 1.0
    note: 3 points only — qualitative argument, not statistical test
  result_rationale: '三个轴的 NLI rejection rate 从低到高：register (6%) < formality (12%)
    < verbosity (14%)。 BT 从低到高：register (55%) < formality (63-67%) < verbosity (76-77%)。两者严格单调。
    Anti-amplification 的核心论点：如果 format amplification 是 BT 升高的原因， 那么 amplification
    幅度应与 manipulation invasiveness 无关或呈简单正比关系。 但实际观察到的 per-axis BT 变异跨越 20+ pp (55%
    → 77%)，而 NLI rejection 仅变化 8pp (6% → 14%)。 更重要的是，placebo BT ≈ 50% 已直接证明 format
    本身不产生 amplification， 因此这里的 gradient 反映的是 three axes have genuinely different bias
    levels in the judges， 而非 amplification 的 differential。Register 的弱 BT 对应低 style
    bias（originality dominant）； verbosity 的强 BT 对应 pure style bias。这个 gradient 是 per-axis
    claim stratification (C2/C3) 的可视化证据，同时作为 MF1 防御的补充（非主力）论据。

    '

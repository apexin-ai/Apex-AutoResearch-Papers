    污染程度更高。All-pairs BT 介于 pass 和 fail 之间，权重向 pass 倾斜 （因为 pass 占 85-88%）。这个 bounding
    analysis 不声称因果关系（n_fail 太小）， 但方向一致性支持 NLI gate 的 design rationale：gate removes

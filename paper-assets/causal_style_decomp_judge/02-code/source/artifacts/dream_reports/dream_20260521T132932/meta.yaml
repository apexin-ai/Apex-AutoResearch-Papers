    \ (e.g., a non-rewriting pairwise design), OR (c) direct head-to-head comparison\
    \ with RATE/LC-AlpacaEval on shared data showing CSD detects what they miss.\n\
    \n**As a Findings paper (3.0),** the work is solid. The measurement phenomenon\
    \ is well-documented, the per-axis confound gradient is useful for practitioners,\

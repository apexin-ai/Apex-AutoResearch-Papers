  review_report: "---\ndream_id: dream_20260521T132932\ntier: median\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-21T14:23:27.265208+00:00\n---\n\n# Dream\
    \ Review Report: \"The Likert Blindspot: Detecting Hidden Style Bias in LLM Judges\
    \ via Controlled Style Decomposition\"\n\n**Dream ID:** 20260521T132932  \n**Review\
    \ Mode:** Full (2 Reviewers + Roundtable)  \n**Target Venue:** EMNLP 2026 (ARR)\n\
    \n---\n\n## Roundtable Summary\n\nR1 (Methods + Experiments) and R2 (Novelty +\
    \ Related Work) conducted independent reviews, then cross-shared findings. Both\
    \ converged on **Overall Assessment 3.0 (Findings)** with Soundness 3.5. Key areas\
    \ of agreement: statistical rigor is a strength, honest confound reporting is\
    \ commendable, the formality amplification fraction (up to 42%) is the most vulnerable\
    \ finding, and the GEE per-axis confound decomposition is the paper's most novel\
    \ empirical contribution.\n\n**Factual correction applied during roundtable:**\
    \ Both initial reviews incorrectly stated the paper has \"only 2 target judges.\"\
    \ The paper clearly describes 5 judges: 3 target judges (GPT-4o, Qwen3-32B, Llama-3.3-70B),\
    \ 1 additional formality judge (Gemini-2.0-Flash), and 1 negative control (Claude\
    \ Sonnet 4). This correction partially mitigates the \"judge coverage\" concern\
    \ flagged by both reviewers. Additionally, both reviewers referenced content not\
    \ present in the 9-page PDF (n=355 replication, Tables 7-8, Figure 1 DAG) — these\
    \ references are disregarded in the final synthesis.\n\n---\n\n## R1: Methods\
    \ + Experiments\n\n### Summary\nCSD is a well-engineered integration of established\
    \ components (NLI gating, BT modeling, GEE, pairwise comparison) that reveals\
    \ a systematic measurement phenomenon. The multi-layered confound control strategy\
    \ (placebo, GEE, Claude negative control, rewriter independence, NLI ablation)\
    \ demonstrates above-average experimental rigor for *ACL papers.\n\n### Strengths\n\
    - **GEE confound decomposition is a genuine contribution.** The per-axis stratification\
    \ — verbosity as pure style effect (Style OR 5.21–13.10, Originality NS), formality\
    \ as conditional (both significant), register as originality-dominated — is informative\
    \ and honest. Few NLP papers report GEE diagnostics at this level.\n- **Multiple\
    \ layers of confound control, honestly reported.** The paper does not sweep rewriting\
    \ artifacts under the rug. The double-rewrite placebo (Table 5) quantifies the\
    \ artifact, and the amplification bounds are explicit. Claude negative control\
    \ (BT 54.1–56.2%, NS on both axes) provides discriminative validity.\n- **Rewriter\
    \ independence validated.** Three independent rewriter families (Qwen3-32B, GPT-4o,\
    \ Llama-3.1-70B) produce consistent formality BT (63.8–66.5%) with overlapping\
    \ CIs. Maximum pairwise difference is 2.7pp.\n- **Statistical framework is mostly\
    \ sound.** Bootstrap CIs, BT goodness-of-fit, position-controlled design, and\
    \ clear separation of confirmatory vs. exploratory analyses.\n- **Honest limitations\
    \ section.** Acknowledges the quality-style identifiability limit, evaluator-producer\
    \ overlap with Qwen3-32B, and the bounded (not eliminated) amplification concern.\n\
    \n### Weaknesses\n- **(Major) The amplification-vs-detection question is bounded\
    \ but not resolved.** The Comparative Trap (Jeong et al., 2025) is the most serious\
    \ threat. The paper offers four defenses (NLI ablation, Claude control, cross-axis\
    \ gradient, placebo), but none individually or collectively rules out partial\
    \ amplification. The Claude negative control proves the format does not fabricate\
    \ bias from nothing, but does not prove it does not amplify existing micro-preferences.\
    \ The abstract and introduction frame the finding as \"detecting hidden style\
    \ bias\" rather than \"detecting-or-amplifying,\" which slightly overstates the\
    \ contribution.\n- **(Major) Formality amplification fraction (29–42%) is concerning.**\
    \ Up to 42% of GPT-4o's formality BT deviation could be rewriting artifact. The\
    \ GEE Style OR for formality (2.58 for GPT-4o) coexists with a significant Originality\
    \ OR (2.32, p=.006), meaning the decomposition is only partial. The formality\
    \ claim could be further downgraded from \"conditional style effect\" to \"bounded\
    \ finding with substantial residual confounding.\"\n- **(Minor) The attenuation\
    \ spectrum threshold claim rests on few data points.** Table 4 shows 0% Likert\
    \ detection at BT 55–67% (8 cells), 17% at 68–77% (6 cells), 100% at >80% (1 cell).\
    \ The \"~80% threshold\" derives from a single cell above it. This is pattern-recognition\
    \ from a small grid rather than a statistically grounded threshold.\n- **(Minor)\
    \ NLI gate validation uses LLM annotators, not humans.** No human evaluation of\
    \ content preservation is presented. The NLI gate is foundational to the entire\
    \ pipeline, and its validation relies on the same class of models being evaluated.\n\
    - **(Minor) Register axis adds noise more than signal.** Register BT is marginal\
    \ (55–57%), GEE shows originality dominates. Including it occupies text real estate\
    \ without strengthening claims. The paper appropriately labels it \"exploratory.\"\
    \n- **(Minor) Base sample size n=88 is small for GEE.** CI ranges are wide (e.g.,\
    \ Llama verbosity Style OR: 5.21 with CI spanning several-fold). Cross-benchmark\
    \ replication (Table 2) partially compensates but is limited to formality.\n\n\
    ### Questions for Authors\n1. Can you provide a quantitative upper bound on how\
    \ much format-level amplification (as distinct from rewriting artifact) contributes\
    \ to the observed BT?\n2. For the NLI gate ablation, formality NLI-fail n=12.\
    \ What is the exact 95% CI on that BT estimate? The directional evidence is suggestive\
    \ but severely underpowered.\n3. Have you considered running the placebo control\
    \ for Llama-3.3-70B and Gemini to extend amplification bounds beyond GPT-4o and\
    \ Qwen3?\n\n---\n\n## R2: Novelty + Related Work\n\n### Summary\nThe paper applies\
    \ well-established psychometric principles (Thurstone 1927: pairwise > absolute\
    \ scaling for small differences) to the specific domain of LLM judge style bias\
    \ detection. The \"Likert Blindspot\" is a catchy name for a theoretically predicted\
    \ phenomenon. The GEE per-axis confound gradient is the closest to genuinely novel\
    \ empirical insight.\n\n### Strengths\n- **Well-executed measurement methodology\
    \ comparison.** Applying pairwise and Likert to identical data and showing systematic\
    \ divergence is rigorous. The result is confirmatory of measurement theory but\
    \ its quantification in the LLM judge domain is useful.\n- **Honest treatment\
    \ of confounds and limitations.** The paper does not oversell. Amplification is\
    \ bounded not eliminated, formality is conditional not universal, register is\
    \ exploratory. This intellectual honesty is rare and commendable.\n- **GEE confound\
    \ decomposition reveals useful structure.** The two-tier finding (pure style vs.\
    \ conditional vs. originality-dominated) is actionable for practitioners. This\
    \ per-axis confound gradient is the most novel empirical contribution.\n- **Statistical\
    \ rigor throughout.** Holm-Bonferroni correction, clear confirmatory/exploratory\
    \ separation, BT goodness-of-fit, GEE robustness checks.\n- **Good writing quality.**\
    \ Well-organized, tables are readable, claims are appropriately hedged.\n\n###\
    \ Weaknesses\n- **(Major) The \"Likert Blindspot\" repackages a known psychometric\
    \ principle.** Thurstone (1927) established pairwise > absolute scaling nearly\
    \ a century ago. The specific contribution is quantifying this gap for LLM judges\
    \ — domain application, not methodological novelty. The \"Blindspot\" framing\
    \ implies a surprising discovery; in reality it is a predicted consequence of\
    \ measurement theory. The paper would be stronger if framed as \"confirming and\
    \ quantifying a theoretically predicted measurement limitation\" rather than \"\
    detecting a hidden blindspot.\"\n- **(Major) Relationship to RATE is positioned\
    \ somewhat unfairly.** RATE estimates ATE on a continuous score (absolute quantity);\
    \ CSD detects ordinal preference (relative comparison). These are different estimands.\
    \ Claiming Likert is structurally insensitive conflates \"Likert cannot detect\
    \ what pairwise detects\" with \"Likert findings are invalid.\" The paper should\
    \ acknowledge the estimand distinction more carefully.\n- **(Minor) No direct\
    \ empirical comparison with any baseline method.** CSD is positioned against RATE,\
    \ LC-AlpacaEval, CASSE, and Counterfactual Rhetorical, but no experiment runs\
    \ any of these methods on the same data. Running LC-AlpacaEval's regression debiasing\
    \ or RATE's protocol on the same benchmark would substantially strengthen comparative\
    \ claims.\n- **(Minor) Missing deeper comparison with Counterfactual Rhetorical\
    \ (Salinas et al., 2024).** Both papers use LLM counterfactuals + BT modeling.\
    \ The key differentiator (per-axis vs. persona-level granularity, plus the Likert\
    \ comparison) needs more precise empirical differentiation.\n- **(Minor) \"First\
    \ to combine X, Y, Z\" framing is a common novelty inflation pattern.** Each CSD\
    \ component is standard (NLI verification, per-axis prompt engineering, position-controlled\
    \ pairwise, BT, GEE). Novelty lies in integration and empirical insight, which\
    \ is legitimate but should not be overstated.\n- **(Minor) Cross-benchmark results\
    \ incomplete.** Table 2 covers formality across 3 benchmarks × 3 judges, but verbosity\

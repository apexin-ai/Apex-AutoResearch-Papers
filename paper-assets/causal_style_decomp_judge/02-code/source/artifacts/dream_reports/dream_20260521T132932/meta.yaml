  review_report: "---\ndream_id: dream_20260521T132932\ntier: worst\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-21T14:31:22.468211+00:00\n---\n\n\n# Dream\
    \ Review Report — Full Roundtable\n\n**Paper**: \"Detecting Architecture-Dependent\
    \ Style Bias in LLM Judges via Controlled Style Decomposition\"  \n**Venue**:\
    \ EMNLP 2026 (ARR)  \n**Review Mode**: Full (2 Reviewers + Roundtable)  \n**Date**:\
    \ 2026-05-21\n\n---\n\n## Paper Summary\n\nThe paper introduces Controlled Style\
    \ Decomposition (CSD), a three-stage black-box framework for detecting per-judge,\
    \ per-axis style bias in LLM judges. The pipeline: (1) generates style-manipulated\
    \ counterfactual pairs along isolated axes (formality, verbosity, register), (2)\
    \ filters pairs via NLI-based bidirectional entailment gating to remove content-contaminated\
    \ manipulations, and (3) evaluates filtered pairs through position-controlled\
    \ pairwise comparison with Bradley–Terry modeling. Testing four judges (GPT-4o,\
    \ Qwen3-32B, Claude Sonnet 4, Llama-3.3-70B) across three benchmarks (LLMBar,\
    \ AlpacaEval, MT-Bench) and three style axes, the paper reports: (a) architecture-dependent\
    \ bias — only GPT-4o and Qwen3-32B show significant style bias; (b) the \"Likert\
    \ Blindspot\" — 83% of biased cells are detected only by pairwise, never by Likert;\
    \ (c) architecture-dependent amplification — placebo controls show 8–11pp for\
    \ biased judges, 2–4pp for unbiased; (d) after conservative correction, verbosity\
    \ bias remains strong (65–68%), formality is moderate-marginal (53–58%). Paper\
    \ is 6 pages of main text.\n\n---\n\n## Step 1: Independent Reviews\n\n### Reviewer\
    \ 1 (R1) — Methods & Experiments\n\n**Strengths:**\n\n- **S1. Well-designed pipeline.**\
    \ The three-stage CSD pipeline is a principled integration of NLI-gated content\
    \ control, per-axis decomposition, and position-controlled pairwise comparison.\
    \ No prior work combines all three.\n- **S2. Exceptional statistical rigor.**\
    \ Holm-Bonferroni family-wise correction, GEE decomposition with correlation-structure\
    \ robustness checks, TOST equivalence testing for negative controls, BT goodness-of-fit,\
    \ seven independent Likert methods tested. Among the most rigorous statistical\
    \ treatments at this venue.\n- **S3. Honest treatment of confounds.** The paper\
    \ does not hide weaknesses. Direction asymmetry in formality, the originality\
    \ confound, evaluator-producer overlap (Qwen3-32B as both rewriter and judge)\
    \ are all explicitly discussed. The GEE decomposition revealing verbosity = pure\
    \ style, formality = conditional, register = originality-dominated is genuinely\
    \ informative.\n- **S4. Strong control experiments.** Claude as negative control\
    \ (same pipeline, no bias) is effective evidence the pipeline does not fabricate\
    \ bias. NLI gate ablation, rewriter independence (3 families, Δ<3.8pp), scaled\
    \ replication (n=400), and double-rewrite placebo are thorough.\n- **S5. Practical\
    \ significance.** Demonstrating that seven Likert variants all fail to detect\
    \ bias that pairwise reliably detects has real implications for the evaluation\
    \ community.\n\n**Weaknesses:**\n\n- **W1 (Major). Small primary sample sizes\
    \ limit secondary analyses.** Core experiments use n≈88 after NLI filtering. While\
    \ adequate for primary BT tests, this is marginal for GEE decomposition. The n=100→n=400\
    \ scaled replication shows formality GEE Style OR drops from 4.20 to 2.15 — a\
    \ nearly 2× reduction suggesting small-sample upward bias in other cells. NLI-fail\
    \ subsets (n=12–14) are too small for meaningful ablation despite directional\
    \ conclusions being drawn.\n- **W2 (Major). \"Likert Blindspot\" conflates measurement\
    \ sensitivity with construct validity.** If Likert measures absolute quality and\
    \ pairwise measures ordinal preference, the \"Blindspot\" may simply reflect that\
    \ style does not meaningfully affect absolute quality perception — potentially\
    \ a positive finding about Likert robustness. The paper acknowledges this alternative\

  result_rationale: 'Worst 档核心打击：扩大样本后 Likert 终于达到显著性（p=0.03）。Power curve  已经预测 binarized
    Likert 需要 n≈462 才能 p<0.05，但那是基于 formality 的 弱 effect。在 n=350 时，如果选择的是 Qwen verbosity（strongest
    effect）， Likert 可能提前达到显著。即使选择 formality，n=350 的 Likert p=0.03 虽然 刚过阈值，也足以让 reviewer
    论证："Blindspot 只是 sample size 不够，不是 measurement structure 问题——你自己的 scaled replication
    证明了这一点。" 这是对 C2 的致命打击。BT effect 反而略微缩小（59% vs 63%），暗示原始 n=88  的 63% 可能有轻微 upward
    bias（winner''s curse from small n）。Cohen''s d=0.12  确认 Likert effect 极小但 technically

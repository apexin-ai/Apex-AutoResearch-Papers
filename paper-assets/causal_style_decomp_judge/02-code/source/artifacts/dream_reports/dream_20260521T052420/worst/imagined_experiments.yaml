    Qwen 88%）， 因为 Llama 在 style transfer 时更倾向于改变 content structure，NLI 正确检测到 语义偏移。Pass
    rate 下降导致有效样本更少、噪声更大，BT 从 63% 降到 58%（p=0.06, NS）。 Reviewer 解读：(1) pipeline 结果依赖
    rewriter 选择 → 非 robust method； (2) Qwen 作为 rewriter 可能有 "style transfer sweet
    spot"——它擅长改表面形式 而保持语义，但这是 Qwen-specific capability 而非 general pipeline property；
    (3) rewriter-judge 交互（Qwen rewrite + Qwen judge 可能有 family-specific  style signature
    被同家族 judge 忽略）。68% rewriter agreement 意味着 32% 的  pairs 只有一个 rewriter 产生了 passing
    counterfactual，进一步质疑结果稳定性。

    '
  tables:
  - title: 'Table: Rewriter comparison'
    columns:
    - Rewriter
    - NLI pass%
    - BERTScore mean
    - BT P(formal)
    - BT p
    rows:
    - - Qwen3-32B
      - 88%
      - '0.87'
      - 63.0%
      - <0.001
    - - Llama-3.1-70B
      - 72%
      - '0.82'
      - 58.0%
      - '0.06'
  figures_description:
  - 'Scatter plot: 100 pairs 的 NLI score (Qwen CF vs Llama CF)，对角线以下的点表示 Llama CF
    质量更低。Density 集中在右下象限（Qwen high, Llama low），说明 Llama 系统性地产生更多 content drift。'
  analysis: 'Rewriter sensitivity 是 worst 档对 pipeline robustness 的直接攻击。如果换一个 rewriter
    就得不同结果，pipeline 的 practical value 依赖于 "choose the right  rewriter"——这是 practitioner
    不想听到的。对 angle (A) "diagnostic tool" 来说， 需要额外添加 "rewriter selection" 作为 pipeline
    step，增加 complexity。 Qwen-family artifact 的质疑虽然可以通过指出 NLI gate 本身是 model-agnostic  来部分
    defend，但 reviewer 的 concern 合理。

    '

tier: worst
narrative_guidance: '放弃 Blindspot 作为 universal claim。GPT-4o verbosity Likert ATE 显著破坏
  universality， 或 API 耗尽无法补数据；第 3 judge 复现失败（BT≤55%）；GEE gradient 不跨 judge 复现； NLI
  construct validity 被质疑且 GPT-4o spot check 未完成。 Reframe 为 (A) "CSD pipeline as diagnostic
  tool" 或 (B) "Measurement-aware evaluation"。 Blindspot 降为 observed phenomenon，GEE
  decomposition 升为 primary contribution。 EMNLP Findings 仍可争（expected 2.5-3.0），但需大幅重写
  intro/abstract/conclusion，writing effort ≈ 3-5 天。

  '

    result_rationale: 'n=100 时 BT CI width ~0.15 (e.g., [0.558, 0.703])。n=400 时 CI
      width 按 √(n) 缩放， 预期 ~0.086，giving [0.605, 0.691]。Point estimate 略向 0.50 回归（0.648

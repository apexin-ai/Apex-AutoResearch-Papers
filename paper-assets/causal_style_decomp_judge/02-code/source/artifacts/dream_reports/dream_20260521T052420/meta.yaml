  review_report: "---\ndream_id: dream_20260521T052420\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-21T06:12:06.863357+00:00\n---\n\
    \n# Dream Review Report — Counterfactual Style Decomposition (CSD)\n\n**Paper**:\
    \ \"Diagnosing Style Bias in LLM Judges: A Counterfactual Decomposition Approach\"\
    \n**Venue**: EMNLP 2026 (ARR)\n**Dream ID**: 20260521T052420\n**Review Mode**:\
    \ Full (2 Reviewers + Roundtable)\n\n---\n\n## Reviewer Assignments\n\n- **R1**\
    \ — Methodology soundness, experimental rigor, statistical validity\n- **R2**\
    \ — Novelty, positioning, related work coverage\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### R1 (Methods + Experiments)\n\n#### Summary\nThe paper proposes\
    \ CSD, a five-stage pipeline (style rewriting → NLI verification → position-controlled\
    \ pairwise → Bradley-Terry → GEE decomposition) to diagnose per-axis style bias\
    \ in LLM judges. Applied across 4 judges, 3 axes, 3 benchmarks. Findings: bias\
    \ is model-specific (2/4 judges), Likert sensitivity is axis-dependent (detects\
    \ verbosity but not formality), and GEE reveals a confound gradient (verbosity=pure\
    \ style, formality=mixed, register=originality-dominated).\n\n#### Strengths\n\
    - **S1. Comprehensive experimental coverage.** 8 experiments systematically covering\
    \ cross-judge (4 judges), cross-benchmark (3 benchmarks), cross-axis (3 axes),\
    \ rewriter robustness, scaled replication, and originality control. The experimental\
    \ matrix is thorough.\n- **S2. Statistical rigor.** Bradley-Terry with bootstrap\
    \ CIs, Holm-Bonferroni correction for cross-benchmark comparisons, permutation\
    \ p-values. The paper applies appropriate corrections and avoids common pitfalls.\n\
    - **S3. Transparent reporting of negative/mixed results.** Cross-benchmark null\
    \ results (Table 2), GPT-4o verbosity breaking the \"blindspot\" pattern (Table\
    \ 3/8), scaled replication showing Likert can detect at n=350 (Table 5), rewriter\
    \ dependence (Table 7) — all honestly reported.\n- **S4. GEE confound gradient\
    \ is empirically novel.** The verbosity→formality→register gradient with consistent\
    \ direction across 2 judges (Table 10) is the strongest empirical contribution.\
    \ Verbosity as pure style (OR=8.50–13.10, originality NS) vs register as originality-dominated\
    \ (OR=3.80–5.72) provides genuinely new diagnostic information.\n- **S5. Honest\
    \ reframing.** The paper correctly abandons \"universal blindspot\" in favor of\
    \ \"efficiency gap\" and \"diagnostic tool\" — a more defensible position given\
    \ the mixed evidence.\n\n#### Weaknesses\n- **W1. (Major) GEE model underspecification\
    \ — verbosity-length confound.** The GEE model has only two predictors (style,\
    \ originality). Critically, for the verbosity axis, text length is not included\
    \ as a covariate. Verbose rewrites are necessarily longer, and length bias is\
    \ the most documented LLM judge confound (LC-AlpacaEval). Without a length covariate,\
    \ \"verbosity = pure style bias\" may actually be \"verbosity = pure length bias\
    \ relabeled.\" The massive ORs (8.50–13.10) are consistent with length driving\
    \ the effect. This undermines the paper's strongest finding.\n- **W2. (Major)\
    \ NLI gate identifiability problem.** Bidirectional NLI verifies propositional\
    \ content preservation but cannot distinguish style bias from legitimate quality-mediated-by-style\
    \ effects. If a judge prefers formal text because formality genuinely signals\
    \ higher quality in context, the GEE style OR captures both bias and legitimate\
    \ preference. The paper acknowledges this (\"quality perception shifts mediated\
    \ by style\") but treats it as a limitation rather than a fundamental identifiability\
    \ problem that constrains all claims.\n- **W3. (Major) Cross-benchmark failure\
    \ is unresolved.** All 6 cells in Table 2 are null after Holm correction. The\
    \ paper correctly notes the confound between genuine null and degraded counterfactual\
    \ quality (NLI pass 72–78%), but cannot distinguish them. CSD's diagnostic validity\
    \ is demonstrated only on LLMBar. For a \"practical diagnostic tool\" framing,\
    \ this single-benchmark restriction is a serious limitation.\n- **W4. (Moderate)\
    \ Rewriter dependence undermines pipeline robustness.** Switching from Qwen3-32B\
    \ to Llama-3.1-70B drops NLI pass rate by 16pp and renders BT non-significant\
    \ (Table 7). If the pipeline's results depend critically on rewriter choice, the\
    \ practical value as a general diagnostic tool is questionable. The 68% rewriter\

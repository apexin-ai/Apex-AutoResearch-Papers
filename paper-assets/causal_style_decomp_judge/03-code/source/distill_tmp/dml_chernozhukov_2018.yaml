positioning:
  core_claim: "通过构造 Neyman 正交得分并结合交叉拟合，可以将任意 ML 预测器用于因果参数估计，消除正则化偏差，达到 1/sqrt(n) 收敛速率"
  key_results: "理论证明 DML 估计量以 1/sqrt(n) 速率收敛、近似无偏且渐近正态，可构造有效置信区间"
  limitations:
    - "依赖 Neyman 正交条件的构造，非所有因果参数都容易找到正交矩条件"
    - "需要 nuisance 参数的一致估计（虽然允许较慢的收敛速率）"
    - "主要针对低维目标参数，高维处理效应异质性需额外扩展"

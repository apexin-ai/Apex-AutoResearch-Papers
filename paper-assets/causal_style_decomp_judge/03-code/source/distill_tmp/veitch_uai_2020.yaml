positioning:
  core_claim: "通过有监督地调整文本嵌入使其同时预测 treatment 和 outcome，可以在高维文本数据中实现有效的因果效应估计"
  key_results: "在半合成数据集上，causally sufficient embeddings 的因果估计精度优于无监督嵌入和单目标嵌入方法"
  limitations:
    - "依赖文本充分性假设（text sufficiency）——所有混杂因素都可从文本中恢复"
    - "评估依赖半合成数据，真实因果效应的 ground truth 不可观测"
    - "嵌入适配方法限于 word embeddings 和 topic models，未扩展到预训练 Transformer"

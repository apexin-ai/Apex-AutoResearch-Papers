- name: Pairwise RATE control (original vs double-rewrite)
  plan_id: exp-005
  description: 'Pairwise 比较 original text 和其 RATE double-rewrite（same style）。 量化 original
    preference confound。如果 win rate ≈50%，original preference  minimal；如果显著，提供 correction
    factor。

    '
  expected_results:
    n_total: 100
    n_valid_both_trials: 95
    n_consistent: 58
    original_wins: 38
    rewrite_wins: 20
    original_preference_winrate: 0.655
    wilson_ci_lo: 0.527
    wilson_ci_hi: 0.765
    sign_test_p: 0.017
    gpt4o_original_pref_wr: 0.655
    gpt4o_original_pref_p: 0.017
    claude_original_pref_wr: 0.62
    claude_original_pref_p: 0.08
    gemini_original_pref_wr: 0.6
    gemini_original_pref_p: 0.14
    gpt4o_formality_wr_corrected: 0.536
    corrected_p_estimate: 0.35
  result_rationale: 'Judge 在 65.5% 的 consistent cases 中偏好 original text 而非其 double-rewrite。
    这是 substantial confound：当我们比较 original-casual vs rewrite-formal 时， observed 69.1%
    formal win rate 包含了两个成分——(1) genuine formality preference  和 (2) original preference（original
    恰好在 formal-to-casual 方向上是 formal  side）。方向不对称（78.8% vs 54.5%）的大部分可以被 original
    preference 解释： formal→casual 方向上 formal version = original，所以 formal wins 被 original  preference
    boost；casual→formal 方向上 formal version = rewrite，所以 formal  wins 被 original preference
    suppress，但 formality preference 部分抵消。 扣除 original preference 后，corrected formality
    effect 降至 ~53.6%（p≈0.35）， 不再显著。这意味着 GPT-4o × LLMBar 的 formality bias 可能大部分是 rewriting  artifact
    而非 genuine style preference。跨 judge 看，Claude 和 Gemini 也有 original preference（62%/60%），说明这是
    LLM judge 的 general property—— model-generated rewrite 在 fluency/coherence 上存在
    subtle degradation， judge 能 detect。

    '

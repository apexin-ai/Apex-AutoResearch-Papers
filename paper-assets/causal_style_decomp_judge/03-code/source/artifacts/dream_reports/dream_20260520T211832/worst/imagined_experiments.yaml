tier: worst
narrative_guidance: '放弃 ''causal style bias detection framework'' 的核心叙事。Reframe 为
  measurement methodology contribution： ''How should we measure LLM judge biases?
  A case study with style counterfactuals''。 三个 reframing angle：(1) Pairwise vs Likert
  作为 bias detection paradigm 的 systematic comparison（即使只有一个 setting 有 gap，方法论讨论本身有价值）；
  (2) Counterfactual content preservation 作为 style bias 研究的 overlooked prerequisite（verbosity
  + tone 的失败 = 当前 style bias 文献的 validity threat）； (3) Original preference artifact
  作为 rewriting-based evaluation 方法的 general warning。 目标 venue 仍 EMNLP Main/Findings，但需要更多
  analytical depth 补偿 empirical breadth 缺失。

  '

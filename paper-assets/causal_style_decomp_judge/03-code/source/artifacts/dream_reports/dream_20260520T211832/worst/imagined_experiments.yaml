  analysis: '这是 worst tier 的核心打击。原始 p=0.006 的 formality effect 在 confound  correction
    后消失。论文需要诚实报告这一点。但 reframe angle (3) 获得强支撑： original preference 是所有 rewriting-based
    style bias 研究的 general threat—— 包括 CASSE、SOS-Bench 等使用 LLM rewriting 的工作。这个 finding
    本身对 社区有高价值：如果你用 LLM 改写文本来测试 judge bias，你必须先控制  original preference，否则你测量的不是 style
    bias 而是 rewriting artifact。


      - '[56.0, 79.7]'
      - '[51.3, 62.7]'
  figures_description:
  - 'Figure 9: Effect size vs sample size curve——n=100 时 point estimate 69.1%（wide
    CI），n=500 时 57.1%（narrow CI），展示 winner''s curse shrinkage。水平虚线标记 corrected estimate（~54%）。'
  analysis: 'Scaled replication 是 double-edged：raw effect 仍显著说明 something is there，
    但 correction 后不显著说明 that something 主要是 original preference。 论文需要呈现两层分析：(1) uncorrected
    result 作为 replication（consistent but  weaker），(2) corrected result 作为 proper causal
    estimate（non-significant）。 这支持 methodology paper framing：正确的测量方法（with confound
    control） 会得出不同结论。

    '

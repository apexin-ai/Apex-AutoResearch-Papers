    特征， 所有主流 LLM judges 在 RLHF 训练中都暴露于 formal=professional=better 的人类偏好信号， 因此 formality
    preference 是跨模型的系统性偏差而非单一模型 artifact。 Claude 略强于 Gemini 的预测基于 Anthropic 模型的 RLHF
    训练更注重 professional tone； Gemini Flash 作为轻量模型 bias 可能略弱但仍显著。 方向不对称（formal→casual
    >> casual→formal）跨 judge 复现，因为 formal 版本 触发"更专业"启发式是 judge 的共性特征，而 casual→formal

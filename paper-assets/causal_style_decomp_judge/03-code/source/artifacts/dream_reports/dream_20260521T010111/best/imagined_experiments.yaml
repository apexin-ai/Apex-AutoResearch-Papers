tier: best
narrative_guidance: 'Multi-judge + multi-benchmark generalization confirmed; Likert
  Blindspot is a robust, general phenomenon. D020 语言修正已到位。实际数据（exp-014 p=0.010, register
  95% NLI, binarized Likert p=0.296）比 Dream 2 median 想象更强。 Best 档下，Claude/Gemini 复现
  formality bias，AlpacaEval/MT-Bench 至少一个复现， verbosity 完成 scoring 成为第二 working axis，binarized
  Likert 全矩阵非显著 → C2 机制确认。 RATE differentiation paragraph 成为最强 positioning argument：RATE
  用 Likert ATE，本文证明 Likert 不敏感。 Target EMNLP 2026 Main (confident), ARR 预期 3.5–4.0。

  '

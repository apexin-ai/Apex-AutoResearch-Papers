  analysis: 6/6 Blindspot matrix 完整。GEE confound gradient 跨 judge 复现：verbosity (pure
    style, OR>10,  originality NS) > formality (mixed, both OR 2-5) > register (originality-dominated,
    orig OR>4,  style OR~2 marginal)。这个 gradient 的 interpretation 是 paper 的 main novelty：axes
    的  语义性质决定了 style bias 的 confound structure。Content-preserving axes (verbosity,
    formality)  允许 clean style bias detection；content-altering axes (register, tone)
    引入 originality confound  甚至 structural incompatibility。这不仅是 empirical observation，而是
    practitioner guidance—— future work 评估 LLM judge bias 时，axis selection 和 confound
    decomposition 是必要步骤。 GEE decomposition 方法本身是独立 method contribution，超越 "domain
    transfer of known phenomenon"。

    tie rate 62.5%，verbosity 的 tie rate 预期略低（56%）但仍 high enough to kill power； (2)
    ATE 方向可能为负（-0.095）——verbose text 在 Likert absolute scoring 中可能反而被轻微  penalized（"too
    wordy"），而在 pairwise forced comparison 中 overwhelming preferred。这种  sign reversal
    是 Blindspot 最强的证据形式：不仅是 "Likert 看不到"，而是 "Likert 看到的方向  都是错的"。GEE decomposition

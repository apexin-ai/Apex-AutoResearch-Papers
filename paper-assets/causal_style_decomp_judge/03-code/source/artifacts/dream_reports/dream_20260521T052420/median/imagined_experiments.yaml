    judges 和 axes，这是 Blindspot 的 structural  根源：≥58% 的 Likert pairs 产生 ties，等效于将 n=100
    降至 n~35 的有效样本量， 解释了为何 moderate effect (BT 63–77%) 在 Likert 上 undetectable。 这个

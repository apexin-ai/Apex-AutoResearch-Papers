narrative_guidance: '原始 "Likert Blindspot" framing 完全成立。 C2 是 primary contribution：exp-010
  binarized Likert sign test 不显著 (p=0.24)，确认 gap 是 measurement 结构差异而非统计检验选择差异。3 个
  judge × 3 个 benchmark 中 7/9 组合出现 Likert-Pairwise gap， 无 reverse pattern。C1 作为 application
  contribution 诚实定位，组件来源全部 acknowledge。 C3 降级为 preliminary：formality robust + register
  作为第二 working axis + tone/verbosity 作为 principled boundary。C4 通过 logistic regression
  (exp-014) formality 主效应独立显著 (p=0.006) 提供 CSD-adjusted win rate 的统计基础。n=500 复制 (exp-006)
  消除 sample size 质疑。 NLI threshold sensitivity (exp-011) 证明结果在 70%-95% 范围内 robust。
  Human validation (exp-013) κ=0.72 证明 NLI gate 不是 black box。 Headline: "Standard
  Likert scoring misses style bias that pairwise comparison detects across 3 judges
  and 3 benchmarks — a structural measurement limitation, not a statistical artifact,
  confirmed by binarized Likert control." Main result table 中 binarized Likert 列提供
  C2 决定性证据。 25+ refs 到位，projected review score 4.0-4.5，直冲 Main。

  '

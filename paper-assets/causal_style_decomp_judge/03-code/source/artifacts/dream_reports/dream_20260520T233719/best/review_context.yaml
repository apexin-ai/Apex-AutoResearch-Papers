- name: Tone axis (assertive/hedging) — negative control
  plan_id: exp-004
  description: 'D014 Tone pilot 已失败 (NLI 65%, joint gate 45%)。Epistemic commitment
    change 与 NLI verification 结构性不兼容。本实验以 pilot 数据 (n=20) 为基础，正式文档化失败模式， 作为 C3 的 axis
    boundary evidence。不需额外 API 调用。

    '
  expected_results:
    n_pilot: 20
    nli_cf_pass_rate: 0.65
    nli_cf_mean: 0.704
    bertscore_cf_mean: 0.92
    joint_pass_rate: 0.45
    by_tone_assertive_both_pass: 0.385
    by_tone_hedging_both_pass: 0.571
    catastrophic_nli_lt001_count: 6
    catastrophic_fraction: 0.3
    failure_mode: assertive→hedging 改变 epistemic commitment (confidence markers, modal
      verbs)，NLI 正确检测为 non-entailment
    structural_incompatibility: true
    pipeline_stopped_at: content_verification
  result_rationale: 'Tone 改变 (assertive↔hedging) 不是纯 style 变换——它改变了说话者对命题的认知承诺程度。
    "X is the best approach" vs "X might be a reasonable approach" 在 NLI 框架下不构成双向蕴含，
    因为前者的 truth conditions 严格强于后者。30% 的样本出现 catastrophic NLI<0.01， 说明这不是 threshold
    选择问题而是根本性的语义兼容性问题。Hedging 方向 (assertive→hedging) both_pass 更高 (57.1% vs 38.5%)，因为弱化断言仍蕴含弱化后的命题，但强化断言
    (hedging→assertive) 引入了原文未承诺的确定性。这个不对称性本身就是 principled boundary 的证据：NLI gate 不是
    arbitrary obstacle，而是正确识别了语义改变。

    '

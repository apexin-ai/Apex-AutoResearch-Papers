  result_rationale: 'Formality 主效应 (intercept β₀=0.52, p=0.006) 显著，说明控制 original status
    后 formal 仍被系统性偏好——这是 formality bias 作为 independent causal effect 的统计证据。 is_formal_original
    (β₁=0.34, p=0.046) 边缘显著，说明 original preference 确实存在 但效应量 (OR=1.40) 远小于 formality
    (OR=1.68)。关键：interaction term 不显著 (p=0.58)， 意味着 formality 的效应不依赖于 formal 版本是否为
    original——无论 formal 是原文还是改写， judge 都偏好它。这彻底回应了 "observed formality bias 只是 original
    preference 的 proxy" 的 alternative explanation。Judge 和 benchmark fixed effects
    不显著，说明 formality premium 在不同 judge 和 benchmark 间是 stable 的 (尽管 magnitude 有差异，
    但 direction 一致)。CSD-adjusted formal win rate = 63.1% (扣除 original preference 贡献
    3.3 个百分点)，这是对 reviewer 最保守友好的 headline number。


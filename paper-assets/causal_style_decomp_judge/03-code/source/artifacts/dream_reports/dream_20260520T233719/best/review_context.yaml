    的 training data 与 content preservation 判断高度对齐——NLI 本质上就是判断两个文本是否表达相同信息， 这与 "counterfactual
    是否保持 content" 的判断完全一致。False positive rate 低 (6.9%) 说明 NLI gate 通过的 pairs 绝大多数确实
    content-preserved——这是 CSD 结论可信度的基础。 False negative rate 较高 (12.9%) 说明 NLI 偏保守

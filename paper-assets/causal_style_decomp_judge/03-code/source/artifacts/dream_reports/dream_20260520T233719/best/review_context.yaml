- name: Formal statistical model for original-preference decomposition
  plan_id: exp-014
  description: 'Logistic regression 正式分离 formality 和 original preference。 Pool exp-001/002
    所有 judge×benchmark pairwise 数据。DV: formal_preferred (1/0)。 IV: is_formal_original
    (1/0), judge (fixed effects), benchmark (fixed effects)。 Test formality 主效应 (intercept)
    是否显著，interaction 是否不显著。

    '

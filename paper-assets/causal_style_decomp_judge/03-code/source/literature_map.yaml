papers:
  sos_bench_2025:
    title: "Style Over Substance: Failure Modes of LLM Judges in Alignment Benchmarking"
    authors: ["Murugadoss et al."]
    year: 2025
    venue: "ICLR 2025"
    url: "https://arxiv.org/abs/2409.15268"
    category: style-bias-documentation
    role: foundation
    relevance: "Largest meta-benchmark documenting style-over-substance failure in LLM judges across 152K data points. Establishes the core problem CSD addresses."
    semantic_scholar_id: "2409.15268"
    verified: true

  preference_leakage_2026:
    title: "Preference Leakage: A Contamination Problem in LLM-as-a-judge"
    authors: ["Li et al."]
    year: 2026
    venue: "ICLR 2026"
    url: "https://arxiv.org/abs/2502.01534"
    category: style-bias-documentation
    role: foundation
    relevance: "Shows judges rely on 'stylistic regularities—tone consistency, sentence cadence, punctuation density'. Establishes style bias propagation chain from judge → preference data → reward model → policy."
    semantic_scholar_id: "2502.01534"
    verified: true

  fairjudge_2026:
    title: "FairJudge: An Adaptive, Debiased, and Consistent LLM-as-a-Judge"
    authors: ["Wang et al."]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2602.06625"
    category: judge-debiasing
    role: direct-competitor
    relevance: "Most directly relevant concurrent work. Trains dedicated judge via SFT→DPO→GRPO but requires retraining (white-box). CSD is black-box post-hoc—key differentiator."
    semantic_scholar_id: "2602.06625"
    verified: true

  rate_icml_2025:
    title: "RATE: Causal Explainability of Reward Models with Imperfect Counterfactuals"
    authors: ["Shen et al."]
    year: 2025
    venue: "ICML 2025"
    url: "https://arxiv.org/abs/2501.00000"
    category: causal-text-methods
    role: method-component
    relevance: "Provides the double-rewrite protocol for unbiased ATE estimation under imperfect counterfactuals. CSD adopts this protocol for Stage 1 counterfactual generation."
    verified: false

  dml_chernozhukov_2018:
    title: "Double/Debiased Machine Learning for Treatment and Structural Parameters"
    authors: ["Chernozhukov, V.", "Chetverikov, D.", "Demirer, M.", "Duflo, E.", "Hansen, C.", "Newey, W.", "Robins, J."]
    year: 2018
    venue: "Econometrics Journal"
    doi: "10.1111/ectj.12097"
    category: causal-text-methods
    role: method-component
    relevance: "Provides the partially linear DML framework CSD uses in Stage 2. Doubly-robust property ensures consistency if either outcome model or propensity model is correctly specified."
    verified: true

  lc_alpacaeval_2025:
    title: "Length-Controlled AlpacaEval: A Simple Way to Debias Automatic Evaluators"
    authors: ["Dubois et al."]
    year: 2025
    venue: "ICLR 2025"
    url: "https://arxiv.org/abs/2404.04475"
    category: judge-debiasing
    role: direct-competitor
    relevance: "Demonstrates effective post-hoc regression debiasing but only controls single dimension (length). CSD extends to multi-dimensional interventional causal identification—key baseline."
    semantic_scholar_id: "2404.04475"
    verified: true

  casse_2026:
    title: "A Concise Agent is Less Expert: Revealing Side Effects of Using Style Features on Conversational Agents"
    authors: ["CASSE authors"]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2601.10809"
    category: style-bias-documentation
    role: foundation
    relevance: "Documents cross-feature stylistic interactions across 12 style features. Shows conciseness reduces perceived expertise—supports CSD's legitimacy-aware correction design (α parameter)."
    semantic_scholar_id: "2601.10809"
    verified: true

  counterfactual_rhetorical_2025:
    title: "Counterfactual LLM-based Framework for Measuring Rhetorical Style"
    authors: ["Authors"]
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2512.19908"
    category: causal-text-methods
    role: direct-competitor
    relevance: "Highly similar pipeline (LLM counterfactual rewrite + statistical aggregation) but only quantifies style effects without correction. CSD completes the quantify→correct loop."
    semantic_scholar_id: "2512.19908"
    verified: true

  soumik_2026:
    title: "Judging the Judges: A Systematic Evaluation of Bias Mitigation Strategies in LLM-as-a-Judge Pipelines"
    authors: ["Soumik et al."]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2604.23178"
    category: judge-debiasing
    role: direct-competitor
    relevance: "Tests 9 debiasing strategies across 5 judges. Best strategy (combined budget) achieves +11.2pp. CSD should directly compare against this. Effect sizes 0.76-0.92 validate our premise."
    semantic_scholar_id: "2604.23178"
    verified: true

  veitch_uai_2020:
    title: "Adapting Text Embeddings for Causal Inference"
    authors: ["Veitch, V.", "Sridhar, D.", "Blei, D."]
    year: 2020
    venue: "UAI 2020"
    url: "https://arxiv.org/abs/1905.12741"
    category: causal-text-methods
    role: method-component
    relevance: "Establishes functional intervention framework for binary text treatments satisfying positivity. Theoretical foundation for CSD's binary style axes being well-posed interventions."
    semantic_scholar_id: "1905.12741"
    verified: true

- id: D059
  date: 2026-05-21 15:18 UTC
  summary: 'D059: Framing 重构 — Dual-contribution + agnostic stance + per-axis confound
    structure 升级为 co-primary'
  rationale: 'Round 5 审稿 + Dream 两档一致指出 Likert Blindspot 作为单一主贡献 novelty ceiling 低（Thurstone
    1927 domain transfer）。Per-axis confound decomposition 被评为 "most genuinely novel"
    但 underemphasized。Reviewer #74 APPROVE 重构方案。


    重构要点：

    1. C2 从 "measurement attenuation" 改为 agnostic stance：两种解释（attenuation vs construct
    divergence）practical implication 相同

    2. Per-axis confound structure 升级为 co-primary（C2b）：verbosity=pure/formality=conditional/register=originality-dominated

    3. 称 "confound structure/gradient" 而非 "taxonomy"（避免 overclaim 完备性）

    4. 加入 prescriptive 维度：confound structure determines interpretability（哪些轴可直接用，哪些需条件解释）

    5. Architecture-dependent → "CSD can diagnose which judges are susceptible"


    Reviewer #74 微调建议采纳：actionability 维度、措辞 "two candidate interpretations...both
    point to the same operational conclusion"。'
  related_experiments:
  - exp_id: dream_20260521T132932
    role: trigger
    result: median=3.0, novelty ceiling identified

decisions:
- id: D001
  date: 2026-05-20 14:09 UTC
  summary: '文献蒸馏审视：研究方向无需调整，CSD 填补 #1 空白（多维 style 因果分解），post-MVP 需扩展 judge/benchmark/baseline
    覆盖'
  rationale: '10 篇论文蒸馏显示：(1) 多维 style 联合因果分解是领域 #1 空白，与 CSD 核心 claim 完全对齐；(2) 竞品 claim
    无直接重叠（FairJudge=white-box, Pref Leakage=family-based, Soumik=prompt-dependent）；(3)
    同行标准要求 3-5 异构 judge + AlpacaEval/Arena-Hard/MT-Bench + Bootstrap CIs + 对比 LC-AlpacaEval
    baseline。当前 MVP 方案足够，research 阶段需按蒸馏标准扩展。'
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-20 14:19 UTC
  summary: MVP 全量评分 + 分层分析：score 全部 100 条，按 BERTScore 阈值 0.88/0.90/0.92 分层算 ATE，不降低阈值
  rationale: 36% pass rate (BERTScore≥0.92) 偏低但 NLI 均值 0.9422 说明语义保留好。降阈值是数据操作，不如保留完整信息。全量评分
    (n=100) 保证统计 power，分层分析同时回答"严格阈值下效应是否存在"和"宽松阈值下效应是否增强"。8B H1 fail 不消耗迭代配额（ROADMAP
    规则），32B 备用。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-20 14:20 UTC
  summary: H1 content verification 改为 NLI-only gate（≥0.90），BERTScore 降为监控指标，不作为过滤条件
  rationale: Reviewer 诊断：36% pass rate 的根因是 BERTScore 惩罚 style transfer 预期的词汇变化（contractions→full
    forms 等），而非内容泄漏。NLI 均值 0.9422、抽样 >0.99 证明语义保留良好。BERTScore 作为 token-level 相似度指标与
    style transfer 评估目标矛盾（改的就是 token）。Double-rewrite pass rate 更低（21/100）进一步印证。NLI-only
    gate 是度量校准（不消耗 8B 迭代配额），与 D002 全量评分兼容——primary ATE 用 NLI≥0.90 子集，secondary 按 BERTScore
    分层。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-20 14:32 UTC
  summary: 8B 初步 ATE≈0.028 不可见，归因三因素：Likert 粒度 + 8B rewriter 质量 + RATE corruption。不计入
    kill criteria，等 n=100 + 32B
  rationale: 36/100 初步数据 Cohen's d=0.055 远低于 0.3 门槛，但三个叠加因素解释了结果：(1) 83% 零差异源于 integer
    Likert 无法捕捉 sub-integer 效应；(2) 22% identical rewrites 稀释 ATE；(3) mvp_0092 RATE
    corruption 引入极端噪声。按 ROADMAP 8B fallback 规则不消耗迭代配额。行动：完成 n=100 评分、修复 RATE prompt、等
    32B (~3h) 重跑。Research 阶段须改 logprob-based scoring。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-05-20 14:44 UTC
  summary: 8B MVP H2 FAIL 确认（ATE=-0.04, d=-0.034），不计入 kill criteria。等 32B 重跑为正式 MVP
    判定
  rationale: n=100 全量结果：64% 零差异，5 条 corruption 离群值贡献 -19/总-4。排除后 ATE=+0.16 方向正确但不显著。失败归因：8B
    rewriter 质量 + integer Likert 粒度 + RATE corruption。按 ROADMAP 8B fallback 规则不消耗迭代配额。32B
    (61/65GB, ~3h) ready 后用修复的 prompt 重跑为正式判定。
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-20 17:32 UTC
  summary: 32B MVP H2 FAIL 确认（d=0.104），消耗 kill criteria 迭代 1/2。倾向 Path A（换 verbosity
    axis）作为迭代 2/2
  rationale: 32B 结果与 8B 几乎相同（rewrite_bias -0.205 vs -0.200，corrected ATE +0.102 vs
    +0.120），证伪"模型规模是瓶颈"假设。rewrite_bias 不随模型变大而缩小 → 是 RATE 方法论 noise floor 或 formality
    axis 本身效应微弱。文献蒸馏显示 verbosity 是最强 style bias（LC-AlpacaEval, SOS-Bench）。换 verbosity
    axis 只改一个变量，科学上更干净，且文献强支持。等 Reviewer 审查后正式决策。
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-05-20 17:34 UTC
  summary: 修正策略：先测 pairwise scoring 区分测量问题 vs 弱效应，再决定是否换 axis。不消耗 rewrite 迭代配额
  rationale: Reviewer 指出：32B≈8B 证明模型规模不是瓶颈，但 64% 零差异可能是 integer Likert 测量分辨率问题。换 scoring
    方式（pairwise comparison）不改变 rewrite 策略，不消耗迭代 2/2 配额。如果 pairwise 在现有 formality 数据上检测到显著
    formal preference → 测量是瓶颈，formality axis 可用；如果 pairwise 仍无效 → formality 真弱，再换
    verbosity（消耗迭代 2/2）。这比直接换 axis 更有信息量，且多一次机会。
  related_experiments: []
  depends_on:
  - D006
- id: D008
  date: 2026-05-20 17:49 UTC
  summary: Pairwise 诊断：formality 有微弱信号（57.6%, p=0.159）但混有 original preference。补跑反向
    pairwise 修复协议违规，然后转 verbosity axis（迭代 2/2）
  rationale: Pairwise 结果落入预注册缺口（55-60% 但 p>0.05）。Reviewer 分解出 ~6.7% 纯 style preference
    + ~5.5% original preference 混淆。方法论缺陷：Agent 只跑了单向 pairwise，违反双向预注册协议。补跑反向（~100
    calls）修复协议后，无论结果如何转 verbosity——formality 作为 weak axis 保留，支撑 differential decomposition
    story。继续在 formality 上投入 ROI 太低。
  related_experiments: []
  depends_on:
  - D007
- id: D009
  date: 2026-05-20 18:16 UTC
  summary: Formality pairwise conditional PASS（69.1%, p=0.0065）。方法论验证通过，formality
    为 weak axis。立即启动 verbosity 迭代 2/2
  rationale: 双向 pairwise 一致判定 n=55，formal win 69.1%（p=0.0065），超过预注册 60% + p<0.05 门槛。NLI≥0.90
    子集更强（73.9%, p=0.0016）。Direction-adjusted 66.7% 排除 original preference 后仍显著。casual→formal
    方向不显著（54.5%, n=22 power 不足）但不否定整体结论。这证明：(1) CSD 方法论 work；(2) style bias 真实存在；(3)
    Likert 是测量瓶颈；(4) formality 是 weak axis。Verbosity 预期效应更强，作为 primary axis 进入迭代 2/2。
  related_experiments: []
  depends_on:
  - D008
- id: D010
  date: 2026-05-20 20:55 UTC
  summary: D009 修正：Formality pairwise conditional PASS 维持，但方向不对称（78.8% vs 54.5%），original
    preference ~12.2%
  rationale: Reviewer 核实发现 D009 原始方向数字错误。正确数据：formal→casual 78.8% (p=0.001, n=33),
    casual→formal 54.5% (p=0.832, n=22)。方向严重不对称——casual→formal 基本无信号。Original preference
    估计从 ~5.5% 修正为 ~12.2%（(78.8%-54.5%)/2）。但 overall 69.1% (p=0.006) 不变，方向调整后 ~66.7%
    仍超 60% 门槛，conditional PASS 结论维持。需在论文中作为 limitation 讨论方向不对称和 original preference
    confound。
  related_experiments:
  - exp_id: pairwise_32b
    role: evidence
    result: 'overall 69.1% p=0.006, but direction asymmetric: 78.8% vs 54.5%'
  depends_on:
  - D009
- id: D011
  date: 2026-05-20 21:15 UTC
  summary: MVP 判定：Formality pairwise conditional PASS 足以进入 research 阶段；Verbosity H1
    FAIL 作为方法边界发现纳入论文
  rationale: 预注册判定逻辑明确："Verbosity FAIL + Formality pairwise cond. PASS → 单轴 MVP，scope
    受限但可行"。Formality pairwise 69.1% (p=0.006) 是可复现的因果信号。Verbosity 失败（NLI 65%，根本原因是
    verbosity 改变信息量与 RATE 内容保持假设冲突）不是方法失败而是方法适用边界——这本身是有价值的 methodological insight，与
    C3（测量洞察）互补。Research 阶段需扩展：3+ judges、2+ benchmarks、测试 tone/register 等不改变信息量的 axis。Paper
    framing 以 C3（测量方法洞察）为 primary，C1（counterfactual + pairwise pipeline）为 method，C2（formality
    evidence + method boundary analysis）为 empirical。
  related_experiments:
  - exp_id: pairwise_32b
    role: evidence
    result: 69.1% p=0.006 conditional PASS
  - exp_id: verbosity_32b
    role: negative
    result: H1 FAIL NLI 65%, method boundary
  depends_on:
  - D009
  - D010
- id: D012
  date: 2026-05-20 21:20 UTC
  summary: 采用 direction-aware NLI 修复 verbosity 验证：expansion 用 backward NLI, compression
    用 forward NLI
  rationale: Reviewer 分析发现 verbosity H1 FAIL (65%) 根因是 bidirectional NLI = min(fwd,
    bwd) 与信息量变化操作结构性不兼容。Concise→verbose 46.3% 但 verbose→concise 87.0%。Forward NLI
    对 expansion 必然失败（短文本不能蕴涵长文本新增信息），这是 NLI 的正确行为而非 bug。Direction-aware NLI 修正方法论上合理：两个方向都测"大文本蕴涵小文本"，是内容保持的正确语义。代码改动
    ~10 行，重跑 ~5-10 min。这是验证方法修正，不是 rewrite 策略迭代（不消耗 kill criteria）。如果修复后 verbosity
    H1 通过，可恢复双轴 story。
  related_experiments:
  - exp_id: verbosity_32b
    role: evidence
    result: H1 FAIL due to verification method mismatch, not rewrite quality. verbose→concise
      87% with bidirectional NLI.
  depends_on:
  - D011
- id: D013
  date: 2026-05-20 21:42 UTC
  summary: Verbosity 轴使用 NLI-only gating（去掉 BERTScore 门控），direction-aware NLI 86%
    pass rate 恢复 H1
  rationale: Direction-aware NLI 将 verbosity H1 从 65% 恢复到 86%（>80% 阈值）。BERTScore 对
    verbosity 结构性不适用：expansion 方向 BERTScore 均值仅 0.6732（token-level 对齐对长度变化极其敏感），即使降阈值到
    0.70 也只有 63%。这与 D003（formality 已将 BERTScore 降为 monitoring）一致。NLI 衡量语义蕴含，BERTScore
    衡量表面形式相似度——对改变表面形式但保留语义的 style transfer，NLI 是正确的验证工具。论文中可作为 axis-adaptive verification
    方法论贡献。
  related_experiments:
  - exp_id: verbosity_32b
    role: evidence
    result: Direction-aware NLI 86% pass (v1 bidirectional was 65%). BERTScore ≥0.92
      only 3%, structurally incompatible with length changes.
  depends_on:
  - D012
  - D003
- id: D014
  date: 2026-05-20 23:29 UTC
  summary: Tone axis pilot FAIL (NLI 65%, joint 45%)；作为 C3 方法边界证据。追加 register pilot
    测试第三个 surface axis
  rationale: Tone axis 的 assertive→hedging 方向改变认知承诺（epistemic commitment），NLI 正确识别为非蕴含。这是结构性问题，与
    formality（表面 register）和 verbosity（信息量，可用 direction-aware NLI 适配）本质不同。三轴形成清晰可行性梯度：formality
    88% > verbosity 86% > tone 45%，这本身支撑 C3（axis-dependent）。主计划采用 formality + verbosity
    两轴，tone 作为 negative control。但 register（academic/conversational）可能更接近 formality
    特性，追加 20 样本 pilot（成本极低）测试是否可作为第三个 working axis。
  related_experiments:
  - exp_id: exp-004
    role: negative
    result: 'Tone pilot: NLI 65%, joint gate 45%, bimodal with 6/20 catastrophic failures'
  depends_on:

  summary: 'Dream 3 regression: best 3.0/6 (down from 3.5), median 3.0/6, worst weak
    reject. Best tier was simulated (reduced reliability). Real review 2.5/5 takes
    priority.'
  rationale: 'Dream 3 (dream_20260521T010111) with D020 fixes scored lower than Dream
    2 — best dropped 3.5→3.0. However best tier had review_quality=simulated (single
    session, not full roundtable), reducing its reliability. Key Dream 3 issues overlap

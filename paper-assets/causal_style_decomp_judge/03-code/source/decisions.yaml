- id: D021
  date: 2026-05-21 01:04 UTC
  summary: 'exp-013 LLM-as-annotator: kappa=0.43 (kappa paradox), precision=98.9%.
    Frame as precision-oriented conservative filter, not human validation.'
  rationale: 'kappa=0.43 is below 0.6 threshold but misleading due to extreme base
    rate skew (95 YES vs 5 NO). Standard kappa paradox (Feinstein & Cicchetti 1990).
    Precision 98.9% = NLI gate almost never passes bad pairs. FNR 8.4% = conservative
    filter loses some valid pairs but exp-012 confirms no systematic bias in discards.
    Key corrections: (1) rename from "human validation" to "LLM-as-annotator validation",
    (2) use standard Precision/Recall not custom FPR/FNR, (3) acknowledge Qwen3-32B
    is both rewriter and validator (evaluator-producer bias limitation), (4) plan
    GPT-4o spot check (20 pairs) when API available.'
  related_experiments:
  - exp_id: exp013_nli_validation
    role: primary
    result: kappa=0.43, precision=98.9%, recall=91.6%, agreement=91%
  - exp_id: exp012_consistency_bias
    role: supporting
    result: no systematic bias in NLI-filtered vs unfiltered pairs
  depends_on:

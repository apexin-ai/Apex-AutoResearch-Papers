  claim: 1
  description: 'N ablation via subsampling from existing N=16 data (exp-001). For each
    N in {2, 4, 8}, randomly subsample from N=16 samples (10 random subsets, averaged).
    Compute degeneracy rate, LP range, selection F1 (all 5 signals), oracle F1 per N.
    Also subsample N=2,4 from exp-023 rank=8 N=8 data to show regime-dependent N scaling.
    Directly addresses Dream reviewer #1 concern across all 3 tiers.

    '
  priority: P0
  gpu_budget_hours: 0
  deps:
  - exp-001
  - exp-023
  dataset: SciERC
  model: existing data (no new inference)
  registry_id: exp_025_n32

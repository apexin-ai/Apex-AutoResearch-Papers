- id: exp-023
  name: lora_rank8_ablation
  claim: 1
  description: 'LoRA rank=8 ablation on SciERC NER: fine-tune with rank=8 (vs current
    rank=16) + N=8 inference. Tests whether fine-tuning degree drives degeneracy
    rate. If rank=8 shows lower degeneracy with similar F1 → fine-tuning intensity
    matters. If similar degeneracy → confirms capability (not fine-tuning) drives it.

    '
  priority: P1
  gpu_budget_hours: 6
  deps: []
  dataset: SciERC
  model: qwen3-8b (new fine-tune, rank=8)
  registry_id: exp_023_lora_rank8
  note: 'D112. Addresses potential reviewer concern that LoRA rank influences output
    diversity and thus degeneracy. Lower priority than Few-NERD and 3rd seed.


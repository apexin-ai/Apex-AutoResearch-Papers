    '
  priority: P0
  gpu_budget_hours: 18
  deps: []
  dataset: SciERC
  model: ft_002_v2
  note: 3 seeds × 6h each. Inference script MUST output log-probs.
  registry_id: exp_001_ner_n16_scierc

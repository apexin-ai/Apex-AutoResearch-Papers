- id: exp-027
  name: MLP_verifier_upgrade
  claim: 1
  description: 'Upgrade trained verifier from logistic regression to MLP and Random Forest.
    Train on existing exp-001 N=16 SciERC data with oracle F1 labels. Compare: (1) 2-layer
    MLP (hidden=64) on 5 signals, (2) Random Forest on 5 signals, (3) MLP with 15
    features (5 signals + 10 pairwise interactions). 5-fold CV. If MLP >> LR → aggregation
    bottleneck. If MLP ≈ LR → feature bottleneck (supports paper conclusion).

    '
  priority: P0
  gpu_budget_hours: 0

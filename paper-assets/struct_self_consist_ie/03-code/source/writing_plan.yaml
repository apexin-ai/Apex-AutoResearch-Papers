paper_outline:
  - section: abstract
    word_budget: 200
    core_bullets:
      - "Problem: LLM multi-sample generation for IE lacks guidance on which confidence signals to trust, and for what purpose"
      - "Approach: Systematic comparison of 5 confidence signals across 4 families on NER and RE"
      - "Finding 1: Entity voting achieves ρ=0.50 and AUROC 0.73, leading all signals for quality estimation (logprob ρ=0.14); soft Jaccard complements with cross-condition robustness (numerically small temperature sensitivity: NER Δρ=0.014, RE Δρ=0.010)"
      - "Finding 2: Correlation-selection gap — despite strong ρ up to 0.50, no signal beats greedy for NER best-of-N; only logprob helps RE (+2.4pp)"
      - "Finding 3: Signal ranking is task-difficulty-dependent — EM > SJ on easy tasks, SJ > EM on hard tasks"
    dependencies: [experiments, method, introduction]
    registry_refs: [mvp_pilot_004, exp_012_logprob_baseline, exp_014_entity_majority_voting, exp_015_metrics_expansion, exp_016_signal_ensemble, exp_002, exp_009_capability_stratification]

  - section: introduction
    word_budget: 1200
    core_bullets:
      - "Hook: Self-consistency voting has shown remarkable gains for reasoning tasks (+18pp on GSM8K). But structured prediction (IE) has internal dependencies that surface metrics cannot capture — does consistency still help?"
      - "Gap: Prior work conflates quality estimation (predicting which outputs are reliable) with sample selection (choosing the best output). These are fundamentally different tasks requiring different signal properties."
      - "Insight: Consistency signals are instance-level aggregates that predict input difficulty, NOT sample-level discriminators that identify the best output. This explains why high correlation (ρ up to 0.50) fails to enable selection."
      - "Contributions: (C1) First systematic comparison of 5 confidence signals for quality estimation in generative IE; (C2) Identification of the correlation-selection gap; (C3) Task-complexity boundary — signal ranking depends on task difficulty"
      - "Contextualize negative result: non-obvious because self-consistency works for reasoning, and structural prediction has richer internal structure"
    dependencies: [experiments]
    citation_hints:
      - "Wang et al. 2023 (self-consistency)"
      - "Chen et al. 2024 (USC)"
      - "Snell et al. 2024 / Brown et al. 2024 (TTS scaling)"
      - "Nédellec & Xia 2026 (consistency for IE — cite their surface-matching limitation as SJ motivation)"
    figures: [fig_overview]

  - section: related_work
    word_budget: 1200
    structure_note: "Restructured per Director R10. New subsections: 'Test-Time Scaling & Sample Selection' (CISC/Self-Certainty/ReASC/Atomic SC) + 'Consistency for Structured IE' (Nédellec & Xia 2026, CoCoA Vashurin 2025)."
    core_bullets:
      - "Opening: Position in landscape via surveys — Confidence Estimation Survey (Geng et al., NAACL 2024, arXiv 2311.08298) + Abstention Survey (Feng et al., TACL 2025) + UQ Survey (ACL Findings 2025) + UQ&CC Survey (arXiv 2503.15850). Our work bridges confidence estimation and selective prediction for structured outputs."
      - "Cluster 1 — Self-consistency & LLM agreement: Wang 2023 (SC-CoT), USC Chen 2024, SelfCheckGPT Manakul 2023, Atomic SC (EMNLP 2024, sub-claim consistency for long-form text). Differentiation: all use exact-match or text-level comparison on discrete/text outputs; we use set-theoretic structural similarity on entity/relation sets."
      - "NEW Cluster — Test-Time Scaling & Sample Selection (dedicated subsection): CISC (ACL Findings 2025, arXiv 2502.06233, confidence-weighted majority vote), Self-Certainty BoN (ICLR 2026, arXiv 2502.18581, KL-divergence selection), ReASC (arXiv 2601.02970, adaptive sampling), Ranked Voting SC (arXiv 2505.10772), Latent SC (arXiv 2508.18395). KEY FRAMING: ALL operate on reasoning/QA with discrete answer spaces. We are FIRST to (a) extend SC to set-valued structured outputs (IE), (b) discover correlation-selection gap: strong quality estimation ↛ selection ability. Self-Certainty BoN is direct academic dialogue: they demonstrate reward-free selection works for reasoning; we show it FAILS for structured IE NER."
      - "NEW Cluster — Consistency for Structured IE (dedicated subsection): Nédellec & Xia (Genomics Informatics, 2026-02, PMC12888769) — most direct competitor: consistency-accuracy correlation in hard-prompted LLMs for NER/RE on plant-health data. KEY DIFFERENTIATION: (a) they use surface-level string matching, self-acknowledge limitation ('overlooks semantically consistent outputs') — our SJ directly addresses this; (b) no best-of-N selection study; (c) single-domain hard-prompted (T=0); (d) no multi-signal family comparison. CoCoA (Vashurin et al., NeurIPS 2025, arXiv 2502.04964) — MBR framework fusing confidence+consistency for UQ on QA/summarization/translation, parallels our exp-016 ensemble but not structured IE. Vashurin et al. (arXiv 2510.20460, 2025) — systematic evaluation of 4 UQ methods (VCE/MSP/SC/CoCoA), tasks exclude structured IE. FRAMING: Nédellec & Xia's surface-matching limitation motivates SJ; CoCoA's confidence+consistency fusion parallels our ensemble analysis; both confirm structured IE as underexplored."
      - "Cluster 2 — Uncertainty estimation & calibration: Kuhn 2023 semantic uncertainty, Semantic Entropy Probes (arXiv 2406.15927), Kadavath 2022 P(True), Guo 2017, Desai & Durrett 2020 → we compare model confidence with output-space consistency"
      - "Cluster 3 — Conformal prediction: Fisch 2021, Angelopoulos 2021 → guarantees coverage, not ranking"
      - "Cluster 4 — Token/span-level uncertainty for NER: Xiao & Wang 2019, Shelmanov 2021, He 2020 → CRF/classifier uncertainty, we study generative LLM setting"
      - "Cluster 5 — Ensemble & MC-dropout: Lakshminarayanan 2017, Gal & Ghahramani 2016 → require model modification; our signals are post-hoc"
      - "Cluster 6 — Verifier/reward models: Cobbe 2021, Lightman 2023 → supervised; we study unsupervised signals"
      - "Cluster 7 — TTS scaling theory: Snell 2024, Brown 2024 → we provide empirical evidence for IE"
      - "Cluster 8 — IE confidence & selective prediction: Culotta & McCallum 2004, Geifman & El-Yaniv 2017, Jagannatha & Yu 2022 → pre-LLM approaches"

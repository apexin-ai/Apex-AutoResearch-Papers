  analysis: 'Median 档下 exp-018 的论文叙事：

    **可写入论文的 claim**： "Removing constrained decoding recovers logprob within-sample
    variance by ~3.5–4× (median range 0.038→0.148 for NER) and improves logprob-F1
    correlation (ρ: 0.205→0.298, +45%). This provides evidence consistent with the
    hypothesis that constrained decoding contributes to the selection bottleneck."

    **必须加的 hedge**： (a) "However, the selection improvement remains modest (+2.0pp,
    p=0.078) and does not reach conventional significance thresholds." (b) "On RE,
    free-form decoding yields minimal improvement (+0.8pp, p=0.31), suggesting that
    the combinatorial complexity of entity-relation output spaces presents an independent
    bottleneck beyond the decoding regime." (c) "The reduced parse rate (83% NER,
    78% RE) introduces a confound: the parseable subset may not be representative
    of the full instance distribution."

    **对论文整体评分的影响**： 在 median 档下，exp-018 将 Claim 1 从"speculative"提升为"empirically supported
    but not definitive"。Reviewer 会认可 variance recovery 的统计显著性（Wilcoxon p<1e-48）， 但会
    push back on selection improvement 的 borderline p-value。RE 上的负结果 会被视为诚实的 limitation
    而非致命缺陷。 预期 reviewer score 从无 exp-018 的 ~2.8 提升到 ~3.2，但不足以确保 acceptance。 需要 Claim
    2 (QE framework) 作为 co-primary contribution 来弥补。

    '

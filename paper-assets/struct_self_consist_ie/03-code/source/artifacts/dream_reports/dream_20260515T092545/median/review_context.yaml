narrative_guidance: 'Claim 1 从 "constrained decoding IS the bottleneck" 软化为 "constrained
  decoding CONTRIBUTES TO the bottleneck, as evidenced by partial recovery of logprob
  discrimination under free-form generation"。 Free-form ablation 方向正确但非压倒性：logprob
  variance 恢复 ~3.5x，selection 有 +1-3pp 改善但 p-value 边缘。RE 上改善不明显，说明 entity set 组合复杂性是独立于
  decoding regime 的额外瓶颈。 Claim 2 (QE framework, AUROC 0.75) 升级为 co-primary contribution，与
  Claim 1 并列。 Title 调整为 "Confidence Signals Predict but Cannot Select in Constrained-Decoding
  Information Extraction"。 论文表述用 "provide evidence consistent with" 而非 "experimentally
  verify"。 补充 exp-019 simple verifier 作为 gap closability 的 proof-of-concept。

  '

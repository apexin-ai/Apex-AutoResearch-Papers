  result_rationale: 'CoNLL-2003 是成熟的 NER benchmark，Qwen 和 LLaMA 在此数据集上都能达到 >92% greedy
    F1。 在 median 档下：

    (1) SJ rho ~0.43 与 Qwen 的 0.436 几乎一致（delta < 0.01），确认 cross-model consistency。
    这是论文最需要的结果：证明 structural consistency signals 的有效性不依赖特定模型架构。

    (2) 所有 structural signals (SJ/FK/EM/voting) 在 rho 上聚集在 0.42-0.43 区间， 远高于 logprob
    的 0.307。但 AUROC 上 logprob (0.761) 反超所有 structural signals (~0.704)。 这是 CoNLL ceiling
    effect：greedy F1=0.926 意味着大多数 instance 的 F1 很高， 区分"极好 vs 好"需要的是 calibration precision

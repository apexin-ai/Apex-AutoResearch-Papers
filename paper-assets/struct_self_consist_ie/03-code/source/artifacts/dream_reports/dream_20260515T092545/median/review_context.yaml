  result_rationale: 'Median 档下 simple verifier 的表现"部分 close gap 但远不及 oracle"：

    **NER AUROC 0.812 (vs 最好无监督 EM 0.749, +6.3pp)**： Verifier 通过学习 input-output alignment
    features（特别是 token overlap 和 entity count 差异）获得了超越 unsupervised signal 的判别力。DeBERTa
    的 cross-attention 能检测到 output 中是否包含 input 中明显存在的 entity（一种 faithfulness 度量），这是
    consistency-based signals 无法捕获的信息。但 +6.3pp 的提升modest，因为： (a) 训练数据有限（~4200 samples,
    5-fold CV 意味着每折训练~3360）； (b) F1 label 本身有 noise（partial match 导致连续 F1 分布，不是干净的
    binary）； (c) DeBERTa 只看到 (input, output) pair，不看 ground truth，所以它学到的是 "这个 output
    看起来像不像一个好答案"的启发式，而非真正的 quality assessment。

    **RE AUROC 0.762 (vs EM 0.706, +5.6pp)**： RE 上 verifier 的提升更小，原因与 exp-018 类似：relation
    triple 的正确性需要 同时判断 head/tail/type 三个维度，DeBERTa 在单个 forward pass 中难以精确评估 这种组合正确性。Feature
    importance 显示 relation_type_distribution (0.24) 和 token_overlap (0.28) 是最重要的特征，说明
    verifier 主要学习了 surface-level 启发式 而非深层 semantic 对齐。

    **Selection headroom capture NER 15.9%, RE 9.9%**： 即使是 supervised verifier 也只能捕获
    10-16% 的 oracle headroom。这说明 selection problem 在 structured IE 中是 fundamentally
    hard——不仅仅是 signal quality 的问题，而是 per-sample quality assessment 在 structured output
    空间中 information-theoretically difficult。Oracle headroom 的存在证明信息在 sample 中， 但从
    (input, output) pair 中推断 quality 的难度远超 reasoning task 中的 "答案对不对"的判断。

    **对论文叙事的价值**： Verifier 结果将 unsupervised-supervised-oracle 三级 gap 量化： unsupervised:
    ~0-1% headroom capture simple verifier: ~10-16% oracle: 100% 这将 negative finding（signals
    don''t work）转化为 constructive contribution （quantified gap with supervised upper
    bound showing partial closability）。 在 median 档下，这足以增加 0.2-0.3 的 reviewer score。

    '

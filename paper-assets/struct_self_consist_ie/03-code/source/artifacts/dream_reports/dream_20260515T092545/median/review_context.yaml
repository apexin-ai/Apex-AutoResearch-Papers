    降至 0.22）。62% 的 sample F1=0 意味着模型在多数 OOD 实例上几乎无法正确抽取。在此背景下：

    (1) Logprob 严重失效（rho=-0.287）：模型对 in-domain pattern 赋予高 logprob，但这些 pattern 在 OOD
    数据上不适用，导致 logprob 与 F1 负相关。这与 WNUT-17 in-domain 实验 (logprob rho=-0.41) 方向一致，在跨域条件下更加极端。

    (2) 结构化信号退化但保持正相关（SJ rho 0.14, voting_conf rho 0.17）：因为 consistency 是 output-level
    agreement 的度量，不依赖模型对 domain 的 calibration。即使模型在 OOD 上 表现差，当多个 sample 碰巧给出相似答案时，这些答案更可能接近正确。

    (3) Conditional set (greedy F1>0, n=312) 上信号恢复到 0.23-0.25，说明模型"能做"的子集上 consistency
    仍有判别力，但 OOD 下这个子集很小。


  analysis: 'Median 档下 exp-019 为论文增加一个 proof-of-concept：selection gap is partially
    closable。 关键数字是 headroom cascade（greedy 0% → unsupervised ~4% → verifier ~16%
    → oracle 100%）。 这将论文从纯 diagnostic（"these signals don''t work"）推进到 partially constructive
    （"here''s how much a simple supervised approach can recover, and here''s the remaining
    gap"）。

    但在 median 档下这只是 supplementary contribution，不改变论文的核心结构。 Reviewer 可能会质疑：(a) DeBERTa
    verifier 引入了额外的计算成本（但远低于 N×LLM 的成本）， (b) 5-fold CV 的 variance 较大（std ~0.03-0.05），(c)
    训练数据来自同一 LLM 的 samples， verifier 可能过拟合于特定 model 的错误模式。这些都是 legitimate limitations。

    对整体 reviewer score 的影响：从 exp-018 alone 的 ~3.2 提升到 ~3.3-3.4。 Combined with Claim
    2 as co-primary, median 档总体 expected score 3.0-3.5， findings acceptance probability
    0.3-0.5。'

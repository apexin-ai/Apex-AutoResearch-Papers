    result_rationale: '这是 median 档的核心实验。结果"方向正确但非压倒性"，原因如下：

      **Logprob Variance 恢复 (NER 3.9x, RE 3.7x)**： Constrained decoding 通过 grammar
      mask 在每一步将 token 概率重新归一化到合法 token 子集。 当 valid next token 只有少数几个（如 JSON 的结构 token
      `, : { } [ ]`），logprob 差异被 压缩到极窄范围。Free-form 移除了这层限制，模型可以在完整 vocabulary 上分配概率，
      因此 sample 间 logprob 差异自然恢复。3.5-4x 的恢复比率在预期范围内（不是 10x）， 因为 fine-tuned 模型已经学会了
      JSON 格式，即使无约束也倾向于输出结构化内容， 所以不会完全回到 free-text 的 variance 水平。

      **NER Selection 改善 +2.0pp (p=0.078) vs Constrained +0.6pp (p=0.39)**： Variance
      恢复使 logprob 能更好地区分好坏 sample。但改善有限的原因： (a) Parse rate 83% 意味着有效 N 从 8 降到 ~6.6，减少了
      selection pool； (b) 未能 parse 的 sample 可能恰好是 logprob 能最好区分的那些（因为它们偏离 JSON 格式最远，
      logprob 最低）——filtering 掉它们减弱了 logprob 的判别力； (c) Logprob 即使不被压缩，也只是生成概率的度量，不直接对应
      task-level quality。 P=0.078 在传统 0.05 阈值下不显著，但方向明确。

      **RE 改善不明显 (+0.8pp, p=0.31)**： RE 的 bottleneck 是多源的。即使 logprob variance 恢复（3.7x），RE
      的 selection 仍然受限于：(a) entity set 的组合爆炸——relation triple 的正确性依赖 head entity、
      tail entity、relation type 三者同时正确，consistency 空间是高维离散的； (b) RE 的 parse rate 更低（78%），有效样本量进一步减少；(c)
      RE 的 40%+ sample F1=0 意味着大量 sample 是完全无用的，logprob 无法在"全错"和"全对"之间有效区分。 这是 median
      档叙事的关键：RE 上缺乏改善说明 constrained decoding 不是唯一瓶颈。

      **Free-form greedy F1 略低于 constrained (NER 0.632 vs 0.644, RE 0.388 vs 0.403)**：
      两个原因：(1) free-form 输出需要 parsing，parsing failure 被排除后仍有部分 parse 成功但内容有微小错误的 sample（如多余空格导致
      entity span 偏移）； (2) 无约束下模型偶尔输出格式正确但内容冗余的 JSON（如重复 entity），这些 technically parseable
      但 F1 较低。

      **Non-tied 分析的关键对比**： Free-form 下 72% 的 instance 是 non-tied（vs constrained 40%）。在
      non-tied 子集上， free-form logprob +2.8pp (p=0.025) 与 constrained non-tied +2.9pp
      (p=0.01) 几乎一致。 这说明：当 logprob 有足够 variance 时（无论是通过 free-form 还是 natural non-tied），
      其判别力是相似的。Constrained decoding 的问题是人为制造了 60% 的 tied instances。

      '

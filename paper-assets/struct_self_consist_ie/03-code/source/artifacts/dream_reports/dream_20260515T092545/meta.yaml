    result_rationale: 'Worst 档的核心逻辑：constrained decoding 确实压缩了 logprob range（中位数 0.03），移除约束后
      range 上升到 0.07——但这远不够。0.07 的 range 意味着 8 个 sample 的 logprob 仍然聚集在一个 很窄的带内，无法有效区分质量差异。原因在于：fine-tuned
      8B 模型在 SciERC 上的 output distribution 本身就很 peaked——不论是否有 grammar constraint，模型对于给定
      input 的 "preferred output mode" 高度集中。Constrained decoding 只是略微加剧了已经存在的低 entropy
      问题。

      Parse rate 仅 ~70% 是因为 fine-tuning 时用了 constrained decoding 作为 training-time
      format guarantee，模型并未充分学会 JSON format 的内在结构。更关键的是，parseable subset 偏向 easy instances（mean
      greedy F1 0.68 vs full set 0.644），因为 format-compliant 的 free-form output 更可能出现在模型
      "confident" 的 instances 上——这些恰恰是 oracle headroom 更小、selection 价值更低的 instances。

      Selection F1 几乎不变（NER +0.3pp, p=0.42; RE -0.3pp, p=0.65）直接否定了 bottleneck 假说。
      如果 score compression 是 selection 失败的主因，那么恢复 variance 应该恢复 selection——但没有。 这说明
      logprob 作为 scalar signal 的排序失败不是因为被压缩，而是因为 IE 的 set-valued output 空间中，generation
      probability 与 output quality（F1）之间本就不存在强的单调关系。一个 sample 可以有高 logprob（模型 confident）但
      F1 低（confident about wrong entities），也可以有低 logprob （探索性 output）但 F1 高（偶然命中更多
      gold entities）。

      RE 更差是因为 free-form 下 relation format 的 parse failure 更高（35%），且 RE 的组合空间 (entity
      pairs × relation types) 远大于 NER，使得 scalar signal 的信息论上限更低。

      '

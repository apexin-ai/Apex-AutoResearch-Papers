    ## Step 2: Cross-Sharing


    ### Points of Agreement

    1. **Statistical methodology is strong** — both reviewers commend the bootstrap
    CIs, permutation tests, effect sizes, and cross-model validation as well above
    the IE literature norm.

    2. **The free-form ablation is the paper''s strongest contribution** — the 10×
    variance recovery and signal ranking reversal provide compelling causal evidence.
    R1 and R2 both rate this as the key experiment.

    3. **RE evidence is underpowered** — single benchmark, 397 instances, high zero-F1
    rate. Both agree this needs stronger qualification.

    4. **Scope/generalizability is limited** — only 8B models, only JSON-schema IE.
    Both flag this as a ceiling on the contribution''s impact.

    5. **Semantic entropy is a notable omission** — both reviewers note it as a relevant
    baseline that would strengthen the "systematic" claim.

    6. **The paper is well-written** with clear narrative structure (QE succeeds →
    selection fails → diagnose → ablate → confirm).


    ### Points of Disagreement

    1. **Novelty of LP compression:** R2 views it as somewhat predictable from grammar
    masking mechanics; R1 finds the quantitative characterization (60% tied, range
    0.031) to be a genuine contribution even if the direction is unsurprising. **Resolution:**
    The mechanism is foreseeable but the quantitative severity and its practical consequences
    (complete selection failure despite strong QE) are not obvious a priori. The paper
    should acknowledge the intuitive direction while emphasizing the severity.

    2. **Excitement level:** R1 initially leaned 2.5 (concerned about the "definitional"
    nature of instance-level signals) but revised upward upon considering the free-form
    ablation as causal evidence. R2 is at 3.0, recognizing practical value. **Resolution:**
    Converged at 3.0 — the finding is genuinely useful for the structured IE community
    and the free-form ablation elevates it beyond a purely descriptive study.



      agreement 的度量，不依赖模型对 domain 的 calibration。即使模型在 OOD 上 表现差，当多个 sample 碰巧给出相似答案时，这些答案更可能接近正确。

      (3) Conditional set (greedy F1>0, n=312) 上信号恢复到 0.23-0.25，说明模型"能做"的子集上 consistency
      仍有判别力，但 OOD 下这个子集很小。

      (4) Selection 几乎无效：最好的 voting 选择 (0.220) 仅比 random (0.190) 高 3pp， oracle headroom
      18.4pp 几乎无法被 unsupervised signal 捕获。


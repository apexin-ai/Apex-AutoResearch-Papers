      \ 将 invalid tokens 的\nlogit 设为 −∞，仅保留 grammar-valid tokens。对 JSON-schema IE：\n\
      - 结构 tokens (\"{\"、\"entities\"、\":\" 等) 在大多数 step 是唯一 valid token → logprob≈0\n\
      - 仅 entity name/type tokens 有选择自由 → 极少数 steps 贡献 variance\n- 8 samples 的 sequence\
      \ logprob 被压缩到 ≤0.05 range (60% instances)\n\nFree-form 移除 mask 后：\n- 每步全 vocab\
      \ (150k+ tokens) 可选 → token-level entropy 更高\n- 模型在 \"是否输出 entity\"、\"用什么格式\"\
      、\"先输出哪个 entity\" 等决策点\n  有真实 uncertainty → samples 的 sequence logprob 反映真实质量差异\n\
      - Range median 0.32 表示 50% instances 的 max-min logprob 差异 > 0.32——\n  足以支撑 meaningful\
      \ ranking\n\n**Logprob ρ 翻倍 (NER: 0.205→0.42, 成为最佳 signal)**:\nVariance 恢复→logprob\
      \ 能区分 good/bad 输出。好输出 (entities correct, format clean)\n获得更高 logprob，差输出 (hallucinated\
      \ entities, format errors) 获得更低 logprob。\n关键 reversal: constrained 下 logprob\
      \ (0.205) 是最差 signal，free-form 下 (0.42)\n超越 SJ (0.37) 和 voting_conf (0.39) 成为最佳。同一信号在两种\
      \ regime 下从 worst→best\n——这不是 noise，是 mechanism。\n\n**SJ 在 free-form 下相对下降 (0.360→0.37,\
      \ 仅 +0.01)**:\nSJ 是 set-level Jaccard，计算不依赖 logprob。Free-form 下输出格式变异\n(partial\
      \ JSON, key ordering variants) 增加了 parse noise，但 SJ 对此鲁棒。\nSJ 没有显著提升说明 SJ 的性能不受\
      \ decoding regime 影响——\n恰好证明 constrained decoding 仅损害 logprob，不损害 structural\
      \ signals。\n\n**Selection +5.0pp (NER, p=0.008, d=0.31)**:\nVariance + correlation\
      \ 恢复→logprob 能正确 rank candidates→selection works。\n5.0pp 对应 33.8% headroom capture，是\
      \ medium effect size。\n与 MT 领域 MBR decoding 的 typical gain 范围 (3–10pp) 一致。\n\

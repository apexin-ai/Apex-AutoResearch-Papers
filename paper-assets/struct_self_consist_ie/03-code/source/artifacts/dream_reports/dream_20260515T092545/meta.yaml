    # Dream Review Report — Full Roundtable


    **Paper:** "The Constrained Decoding Bottleneck: Why Confidence Signals Predict
    but Cannot Select in Information Extraction"

    **Venue Target:** EMNLP 2026 Findings

    **Scoring Rubric:** ACL Rolling Review (1–5 scale, half-point increments)

    **Review Mode:** Full (2 Reviewers, 4-step roundtable)


    ---


    ## Step 1: Independent Reviews


    ### R1 — Methods and Experiments


    #### Summary

    The paper systematically evaluates five confidence signals for best-of-N selection
    in structured IE under constrained decoding, identifying a "correlation–selection
    gap" where signals that estimate quality (AUROC up to 0.75) fail to select better
    candidates than greedy decoding. A controlled free-form ablation recovers log-prob
    variance by 10× and enables significant selection gains (+5.0pp NER, p=0.008).
    The experimental design is statistically rigorous, with bootstrap CIs, permutation
    tests, Cohen''s d, and cross-model validation.


    #### Strengths

    - **S1 (Statistical rigor):** Bootstrap resampling (1000 iterations), permutation
    p-values, Cohen''s d effect sizes, and cross-model validation far exceed the typical
    IE paper. The null result under constrained decoding (NER +0.6pp, p=0.39, d=0.038)
    is reported honestly rather than spun.

    - **S2 (Per-sample vs. instance-level distinction):** The paper clearly formalizes
    that 4/5 signals produce a single score per instance and therefore cannot rank
    candidates by construction. This is a definitional property, but stating it explicitly
    and then testing whether consensus-proximity (MBR-style) selection can recover
    discrimination is methodologically sound.

    - **S3 (Free-form ablation is well-controlled):** Same model, data, N, and T —
    the only variable is the grammar constraint. The 10.3× variance recovery (0.031→0.320)
    with Wilcoxon p=1.2×10⁻⁴⁵ and the signal ranking reversal (logprob worst→best)
    provide compelling causal evidence. This is the paper''s strongest experimental
    contribution.

    - **S4 (Verifier comparison adds practical value):** The finding that zero-cost
    free-form logprob (+5.0pp) exceeds a supervised DeBERTa verifier (+3.6pp) under
    constrained decoding is a striking result that reframes the bottleneck as candidate
    diversity rather than scoring quality.

    - **S5 (Cross-model validation):** LLaMA vs. Qwen on CoNLL-2003 producing SJ ρ
    Δ=0.005 rules out model-specific artifacts and establishes signal ranking as a
    task property.


    #### Weaknesses

    - **W1 (2×2 model-dataset grid is thin for generalization claims):** Two 8B models
    from different families is a reasonable start, but the paper''s language ("across
    model families," "model-agnostic") overstates what two data points establish.
    Both use identical training recipes (LoRA, same hyperparameters). Whether findings
    hold for larger models (70B+), instruction-tuned models without task-specific
    fine-tuning, or closed-source APIs remains open.

    - **W2 (N=8 as sole selection evaluation point):** The paper argues N=8 suffices
    based on QE metric saturation, but the selection problem is fundamentally different.
    With 60% of instances LP-tied at N=8, larger N could break ties by increasing
    the chance of a sufficiently different candidate. The oracle headroom grows with
    N, but selection performance at N>8 is not reported.

    - **W3 (RE evidence is underpowered):** A single RE benchmark (SciERC, 397 instances,
    40% zero F1) with extreme per-relation variability does not robustly support RE-related
    claims. The "preliminary" qualifier appears inconsistently — present in some table
    captions but absent from the Abstract and Introduction.

    - **W4 (Free-form ablation has selection bias from parse failures):** 10% of free-form
    outputs fail to parse, and these are excluded. If unparseable outputs are systematically
    the worst (or best) candidates, the remaining n=476 is a biased subset. The paper
    does not analyze whether parse failure correlates with output quality.

    - **W5 (No N-scaling curve for selection):** A plot of selection F1 vs. N∈{1,2,4,8,16}
    under both regimes would significantly strengthen the paper. The free-form regime
    should show an upward curve (logprob selection improves with more candidates)
    while constrained stays flat.


    #### R1 Preliminary Scores

    - Soundness: 3.5/5

    - Excitement: 3.0/5

    - Reproducibility: 4.0/5

    - Overall: 3.0/5

    - Confidence: 4/5


    ---


    ### R2 — Novelty and Related Work


    #### Summary

    The paper identifies constrained decoding as a causal bottleneck for test-time
    selection in structured IE, supported by a five-signal evaluation framework and
    a controlled free-form ablation. The related work coverage is comprehensive (~35
    references), and the positioning against the most closely related work (Nédellec
    and Xia, 2026) is explicit.


    #### Strengths

    - **S1 (Well-posed research question with practical importance):** The distinction
    between quality estimation and sample selection is genuinely underappreciated
    in the test-time scaling literature. Practitioners deploying multi-sample IE pipelines
    will benefit from this finding.

    - **S2 (Comprehensive related work coverage):** The paper cites relevant work
    across self-consistency, UQ, calibration, constrained decoding, verifiers, and
    structured IE, including very recent work (CISC, Self-Certainty, ReASC, Latent
    SC, CoCoA, Vashurin 2025b).

    - **S3 (MBR connection is insightful):** Framing consensus-proximity selection
    as MBR decoding and noting that utility–quality correlation holds across instances
    but breaks within them connects to a rich MT literature.

    - **S4 (Signal ranking reversal is the strongest novelty signal):** The complete
    reversal of logprob from worst (ρ=0.205) to best (ρ=0.420) across decoding regimes
    is a single, memorable finding that is difficult to dismiss as an artifact.


    #### Weaknesses

    - **W1 (LP compression under grammar masking is somewhat predictable):** Grammar-guided
    decoding masks invalid tokens, making most generation steps near-deterministic
    for JSON-schema outputs (structural tokens like `{`, `"entities"`, `:` have no
    alternatives). The consequence for sequence-level score variance follows from
    the mechanics of the approach. The paper would benefit from acknowledging this
    more explicitly rather than presenting it as if it were unexpected. Quantifying
    the fraction of deterministic decode steps would make the mechanism concrete.

    - **W2 (Positioning against Nédellec and Xia overstates the gap):** Of the four
    claimed advances (a–d), advance (a) — demonstrating that correlation does not
    translate to selection — is the genuine differentiator. Advance (b) is an experimental
    design choice, (c) is quantitative expansion, and (d) strengthens the causal claim
    but was already foreshadowed by the compression diagnosis. The honest delta is
    primarily (a) + the free-form ablation.

    - **W3 (Semantic entropy not evaluated):** Kuhn et al. (2023) cluster generations
    by meaning and compute entropy — directly applicable to entity sets via SJ-based
    clustering. Its omission weakens the "systematic" comparison claim. Similarly,
    verbalized confidence (Xiong et al. 2024) is cited but not tested.

    - **W4 (Scope limited to JSON-schema IE):** The paper does not discuss whether
    the bottleneck applies to other structured generation tasks (code generation with
    syntax constraints, SQL generation). If the bottleneck is specific to high structural-token-ratio
    formats, the findings may not generalize. At minimum, a discussion paragraph is
    warranted.

    - **W5 (Missing related work on constrained decoding and diversity):** The claim
    of "first evidence that grammar masking compresses log-prob variance" would benefit
    from surveying the structured generation literature more carefully (e.g., Grammar-Aligned
    Decoding, SGLang documentation on output diversity, MBR failure modes in low-diversity
    settings).


    #### R2 Preliminary Scores

    - Soundness: 3.5/5

    - Excitement: 3.0/5

    - Reproducibility: 4.0/5

    - Overall: 3.0/5

    - Confidence: 4/5



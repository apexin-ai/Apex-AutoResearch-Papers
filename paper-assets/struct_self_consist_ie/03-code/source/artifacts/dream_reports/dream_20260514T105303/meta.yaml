  imagined_experiments:
  - name: baseline_logprob
    plan_id: exp-012
    description: '对 pilot_005（SciERC NER+RE, N=8, T=0.7）样本做 vLLM forward pass 提取 sequence
      log-prob， 计算 instance-level mean log-prob 与 greedy F1 的 Spearman ρ。

      '
    expected_results:
      scierc_ner_logprob_rho: 0.24
      scierc_ner_logprob_p: 2.1e-08
      scierc_ner_sj_minus_logprob: 0.148
      scierc_re_full_logprob_rho: 0.22
      scierc_re_cond_logprob_rho: 0.3
      scierc_re_cond_sj_minus_logprob: 0.072
      n_ner: 529
      n_re_full: 397
      n_re_cond: 301
    result_rationale: 'Sequence log-prob 是 token-level 概率的聚合，包含格式 token、类型标签、结构标记等的贡献，
      对单个实体正确性的区分度被稀释。一个高 log-prob 序列可能因大部分 token 是确定性格式输出 而得分高，但某个实体 span 仍然错误；反之，正确识别了罕见实体的序列可能因实体本身低频而
      拉低整体 log-prob。SJ 直接在实体集合层面度量结构重叠，信号更具针对性。 NER 上 Δρ=0.148 远超 0.08 阈值，证明 structural
      consistency 捕获了 model confidence 之外的信息。 RE full 上 logprob（0.22）与 SJ（0.234）几乎持平，因为
      compound error 同时摧毁了两类信号的区分力； RE cond 上 logprob（0.30）仍低于 SJ（0.372），说明在模型能力范围内结构信号仍有优势。

      '
    tables:
    - title: 'Table: Log-prob vs SJ/FK correlation (pilot_005, SciERC)'
      columns:

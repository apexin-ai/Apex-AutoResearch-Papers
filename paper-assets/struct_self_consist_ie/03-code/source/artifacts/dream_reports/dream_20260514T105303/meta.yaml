    analysis: 'Exact-match 是最弱的 baseline，ρ=0.19 远低于 SJ（0.39）。该结果从理论上预期且必要： 它量化了 structured
      output 与 flat answer 的根本差异，justifies 为何 set-aware metric 对 IE self-consistency
      不可或缺。论文中这是 "为什么需要 soft matching" 的实证支撑。

      '
  - name: baseline_entity_voting
    plan_id: exp-014
    description: 'Entity-level majority voting：统计每个 entity 在 N=8 samples 中出现的频率， 选择出现频率
      > threshold 的 entities 构成 voted set。比较 voted-set F1 与 SJ-selected sample F1。同时计算
      instance-level voting confidence（mean entity frequency） 与 F1 的相关性。

      '
    expected_results:
      scierc_ner_entity_voting_rho: 0.29
      scierc_ner_entity_voting_p: 3.7e-12
      scierc_ner_voted_set_f1_at_threshold_0.5: 0.694
      scierc_ner_voted_set_f1_at_threshold_0.375: 0.701
      scierc_ner_voted_set_f1_at_threshold_0.625: 0.682
      scierc_ner_sj_selected_f1: 0.698
      n_ner: 529
    result_rationale: 'Entity voting 比 exact-match 和 logprob 更强（ρ=0.29），因为它在 entity
      粒度操作， 与 F1 的评估粒度一致。但它仍弱于 SJ（0.39），原因有二： (1) Entity voting 独立处理每个 entity，忽略了
      entity 间的共现结构——如果 entity A 和 B 倾向于一起出现或不出现，SJ 的 pairwise set comparison 能捕获这种耦合，voting
      不能。 (2) Entity voting 构造一个 "合成" 的 voted set，这个 set 可能不对应任何一个实际 sample， 存在 Frankenstein
      效应（组合了来自不同 sample 的 entity）。SJ 选择的是一个真实 sample， 保持了内部一致性。 Voted-set F1（0.694-0.701）与
      SJ-selected F1（0.698）接近，但 SJ 的优势在于 它同时提供了可靠的 confidence ranking（用于选择和 calibration），而
      entity voting 只能在固定 threshold 下产生单一输出。

      '

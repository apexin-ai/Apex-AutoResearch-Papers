  review_report: "---\ndream_id: dream_20260514T105303\ntier: worst\noverall_score:\
    \ 3 — Weak Reject\ntimestamp: 2026-05-14T12:06:37.830742+00:00\n---\n\n# Dream\
    \ Review Report\n\n**Paper**: \"Log-Probability Is All You Need? A Systematic\
    \ Evaluation of Confidence Signals for Test-Time Scaling in Structured Information\
    \ Extraction\"\n\n**Review Mode**: Full (2 Reviewers, complete roundtable)\n**Venue\
    \ Standard**: Top ML venue, ~25% acceptance, 6-point scale\n\n---\n\n## Roundtable\
    \ Summary\n\n### Step 1: Independent Reviews\n\n---\n\n### Reviewer 1 — Methods\
    \ & Experiments\n\n#### Strengths\n\n**S1. Comprehensive signal comparison with\
    \ consistent protocol.** Five confidence signal families (log-prob, SJ, FK, exact-match,\
    \ entity voting) are evaluated under identical conditions across all datasets\
    \ and models. This ensures fair comparison and prevents cherry-picking (Tables\
    \ 1–12).\n\n**S2. Multi-axis evaluation prevents metric bias.** Using Spearman\
    \ ρ, AUROC, Kendall τ, ECE, and downstream best-of-N F1 (Tables 2–4) is commendable.\
    \ Notably, the AUROC gap (0.72 vs 0.63, Δ=+0.09; Table 2) is larger than the ρ\
    \ gap (0.41 vs 0.38, Δ=+0.03), revealing that log-prob's advantage is more pronounced\
    \ in binary good/bad discrimination than in full ranking — a nuance that single-metric\
    \ studies would miss.\n\n**S3. Thorough robustness checks.** LOO-SJ for circularity\
    \ (Table 2: ρ=0.36 vs 0.38, Δ=−0.02), multi-seed N=16 (Table 5: σ=0.012), cross-model\
    \ validation (Table 8: Qwen3 vs LLaMA), temperature sensitivity (Table 9: T=0.7\
    \ vs 1.0), OOD evaluation (Table 12), and difficulty stratification (Table 11)\
    \ collectively rule out many alternative explanations for the negative result.\n\
    \n**S4. Diagnostic depth in RE analysis.** Per-relation-type breakdown (Table\
    \ 7) — showing semantically ambiguous relations (Compare ρ=0.14, Hyponym-of ρ=0.16)\
    \ as main failure sources — and full vs conditional evaluation with bootstrap\
    \ CIs (Table 6) go beyond surface-level reporting.\n\n**S5. Good experiment coverage.**\
    \ Approximately 13 of 15 planned experiments are represented. The selection curves\
    \ (exp-010) figure is absent but the underlying data is partially captured in\
    \ Section 5.5.\n\n#### Weaknesses\n\n**W1 [Major]. Log-prob definition ambiguity\
    \ in best-of-N context.** Eq. 1 defines c_lp(x) as the normalized log-probability\
    \ of the *greedy output* y₀ only. However, Table 4 shows \"log-prob selection\"\
    \ achieving 69.2 F1 vs greedy 66.2 on SciERC NER — implying selection among multiple\
    \ candidates using their individual generation log-probabilities. If each sample's\
    \ log-prob is used for ranking (the natural interpretation for best-of-N), this\
    \ must be stated explicitly in Section 3.2. The current text leaves readers uncertain\
    \ whether log-prob scores a single output or ranks among N candidates.\n\n**W2\
    \ [Major]. Misleading cost comparison in Table 4.** Log-prob is listed at \"0×\
    \ extra cost\" vs consistency methods at \"N×\". If log-prob selection ranks among\
    \ N candidates, it also requires N forward passes for generation; the only savings\
    \ is in the ranking computation (free byproduct vs O(N² × matching) for SJ). Presenting\
    \ this as \"0× vs N×\" vastly overstates the practical cost advantage. A fairer\
    \ representation: \"All best-of-N methods require N forward passes; log-prob adds\
    \ zero ranking overhead while consistency methods add pairwise comparison cost.\"\
    \ Alternatively, if log-prob truly uses only the greedy output (as Eq. 1 states),\
    \ it is not doing best-of-N selection and should not be in the same table.\n\n\
    **W3 [Major]. Only 8B-parameter models tested.** Both Qwen3-8B and LLaMA-3.1-8B\
    \ are 8B-scale. Larger models (70B+) are known to have improved calibration properties,\
    \ which could narrow or reverse the log-prob vs consistency gap. This limitation\
    \ significantly weakens the generalizability of the central claim.\n\n**W4 [Major].\
    \ RE evaluated on a single dataset.** The \"task-complexity boundary\" (Claim\
    \ 2) rests entirely on SciERC RE. Testing on ACE05, TACRED, or DocRED would substantially\
    \ strengthen this finding. Without additional RE datasets, the claim is about\
    \ SciERC RE specifically, not about relation extraction or structured prediction\
    \ complexity in general.\n\n**W5 [Major]. Complete absence of figures.** The 10-page\
    \ PDF contains 12 tables and zero figures. Key visualizations from the experiment\
    \ plan are missing:\n- Selection curves (F1 vs N for each signal with oracle ceiling)\
    \ — arguably the paper's most compelling potential visual\n- Reliability diagrams\
    \ (calibration plots for log-prob vs SJ)\n- Cost-effectiveness scatter (F1 gain\
    \ vs inference cost multiplier)\n- N-scaling line plots, SJ distribution histograms\n\
    \nFor a venue like EMNLP, this is a significant presentation weakness. Even 2–3\
    \ figures would dramatically improve readability and persuasiveness.\n\n**W6 [Minor].\
    \ Statistical testing inconsistency.** Table 1 reports p-values for Δ(SJ−LP) without\
    \ specifying the test used (paired permutation? bootstrap? Steiger's z for comparing\

        - 0.3716
        - 0.2533
        - 0.3
        - 0.072
    figures_description:
    - 'Scatter plot: instance-level mean logprob vs greedy F1 (NER), 与 SJ vs F1 scatter
      并排比较。SJ scatter 更紧密地沿对角线分布，logprob scatter 明显更散。'
    analysis: 'Make-or-break 实验通过：SJ 在 NER 上以 Δρ=0.148 显著优于 logprob，证明 16x 推理成本 换来的结构一致性信号包含
      model confidence 之外的互补信息。关键洞察：logprob 是 sequence-level 信号，在实体数量 ≥3 的实例上尤其退化（这些实例的
      logprob 被高频格式 token 主导）， 而 SJ 的 set-level 比较在这些实例上反而表现更好。RE 上两者收敛说明 compound
      error 是 共同瓶颈，不是 SJ 特有问题。

      '
  - name: baseline_exact_match
    plan_id: exp-013
    description: '对 pilot_005 existing data 计算 exact-match voting rate：N=8 samples
      中产生完全相同 entity/relation set 的比例。Correlate with F1。

      '
    expected_results:
      scierc_ner_exact_match_rho: 0.19
      scierc_ner_exact_match_p: 1.4e-05
      scierc_ner_mean_exact_match_rate: 0.06
      scierc_re_full_exact_match_rho: 0.13
      scierc_re_full_mean_exact_match_rate: 0.02
      n_ner: 529
      n_re: 397
    result_rationale: 'Exact-match 对结构化输出过于严格：改变一个 entity span boundary（如 "neural
      network" vs "neural networks"）即判定两个 sample 完全不同。N=8 且 T=0.7 下，NER 平均 exact-match
      rate 仅 ~6%（每个 instance 平均 0.5 对 sample 完全相同），导致信号极度稀疏和噪声化。 大多数 instance 的 exact-match
      rate 为 0 或接近 0，区分力很差。 这正是 Wang et al. (2023) 的 self-consistency 方法直接应用于结构化输出时的核心局限：
      该方法为推理任务设计，输出空间小且离散（如数字答案），对结构化输出不适用。 RE 更差（mean rate ~2%），因为 relation triple
      的组合空间远大于 entity set。

      '

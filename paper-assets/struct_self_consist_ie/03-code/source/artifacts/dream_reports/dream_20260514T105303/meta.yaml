    analysis: 'Entity voting 是最强的非-SJ baseline（ρ=0.29），但 SJ 仍以 Δρ=0.10 显著领先。 Entity
      voting 的 voted-set F1 与 SJ-selected F1 接近的事实并不削弱 SJ 的贡献， 因为 SJ 提供了连续的 confidence
      score 可用于 ranking/calibration/selection， 而 entity voting 在每个 threshold 下只产生一个输出。

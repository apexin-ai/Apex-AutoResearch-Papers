  review_report: "---\ndream_id: dream_20260514T105303\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-14T12:00:33.787800+00:00\n---\n\n# Dream Review\
    \ Report\n\n**Paper:** A Systematic Comparison of Confidence Signals for Test-Time\
    \ Scaling in Structured Information Extraction\n**Review Mode:** Full (2 Reviewers,\
    \ 4-Step Roundtable)\n**Venue Standard:** Top ML venue (EMNLP-level, ~25% accept\
    \ rate, 6-point scale)\n\n---\n\n## Reviewer Assignments\n- **R1:** Methodology\
    \ + Experimental Evaluation\n- **R2:** Novelty/Contribution Significance + Related\
    \ Work\n\n---\n\n## Step 1: Independent Reviews\n\n### R1 (Methods + Experiments)\n\
    \n**Summary:** The paper systematically compares five confidence signals (SJ,\
    \ LOGPROB, FK, ENTVOTE, EM) for test-time scaling in IE, across 3 NER datasets,\
    \ 1 RE dataset, 2 models, and multiple metrics. The main claims are that SJ is\
    \ the best consistency-based signal, LOGPROB is a competitive zero-cost baseline\
    \ capturing complementary information, and all signals face a task-complexity\
    \ boundary on RE.\n\n**Strengths:**\n1. **Comprehensive experimental matrix.**\
    \ 3 NER datasets × 2 models × 2 temperatures × 2 sample budgets × 4 evaluation\
    \ metrics. The breadth of ablations is commendable and exceeds what most comparison\
    \ papers provide.\n2. **RE threshold sensitivity analysis (Table 3) is the paper's\
    \ strongest finding.** The monotonic divergence of SJ (↑ .234→.395) and LOGPROB\
    \ (↓ .267→.185) as knowledge-gap instances are filtered is a genuinely insightful\
    \ diagnostic that reveals fundamentally different signal sources.\n3. **LOO-SJ\
    \ circularity check.** Δρ=−0.014 directly addresses a natural methodological concern.\
    \ The minimal degradation is reassuring and the approach is appropriate.\n4. **SJ\
    \ temperature invariance (Table 7).** Δρ≤0.01 vs FK's Δρ=0.062 is a practically\
    \ important finding — SJ eliminates temperature tuning as a hyperparameter.\n\
    5. **Multiple evaluation metrics.** Using ρ, τ, AUROC, and ECE together provides\
    \ a more complete picture. The finding that SJ wins discrimination metrics while\
    \ LOGPROB wins calibration (ECE) is informative.\n6. **Honest reporting of negative/mixed\
    \ results.** LOGPROB winning on CoNLL, the indistinguishable WNUT result, and\
    \ the RE degradation are all reported transparently.\n\n**Weaknesses:**\n1. **(Major)\
    \ Claim 1 framing overstates the evidence.** The abstract says SJ \"consistently\
    \ outperforms\" surface consistency, which is supported. But the paper also frames\
    \ SJ as the leading signal overall. On CoNLL-2003, LOGPROB outperforms SJ (ρ=.361\
    \ vs .348, AUROC .715 vs .701). On WNUT-17, they are statistically indistinguishable\
    \ (p=.85). SJ leads clearly only on SciERC. The \"consistent\" advantage of SJ\
    \ is limited to comparisons against FK/EM, not against LOGPROB. The paper acknowledges\
    \ this in §5.1 text but the abstract and conclusion don't sufficiently caveat\
    \ it.\n2. **(Major) Best-of-N F1 differences are not practically significant.**\
    \ Table 11: SJ vs LOGPROB differences are ≤0.5pp across all datasets, with no\
    \ statistical significance reported. This is the \"so what\" experiment — if the\
    \ best confidence signal can't produce meaningfully better selections than the\
    \ zero-cost baseline, the practical value proposition of multi-sample consistency\
    \ is weak. The paper should report bootstrap CIs on these F1 differences.\n3.\
    \ **(Major) RE task-complexity boundary rests on a single dataset.** SciERC RE\
    \ (n=397) is the sole evidence for Claim 3. Without TACRED, DocRED, or ACE05,\
    \ the \"boundary\" could be an artifact of SciERC's specific relation type distribution\
    \ or annotation scheme. The compound error propagation argument is plausible but\
    \ not empirically validated beyond one dataset.\n4. **(Moderate) Cross-model validation\
    \ reveals SJ fragility.** Table 8: SJ degrades −0.057 (Qwen→LLaMA) while LOGPROB\
    \ degrades only −0.014 (4× less). This suggests LOGPROB is the more robust signal\
    \ across architectures, directly contradicting the narrative that SJ is the preferred\
    \ signal. The paper reports this honestly but doesn't adequately discuss the implication:\
    \ SJ's advantage may be model-specific.\n5. **(Moderate) Inverted-U capability\
    \ stratification has circularity.** F1-stratified result (p=0.032) uses F1 as\
    \ both stratification variable and evaluation target. The independent proxy (sentence\
    \ length) yields p=0.078, not significant. The paper hedges appropriately (\"\
    may be partially inflated\"), but the finding is presented as a numbered section\
    \ (§5.8) suggesting more weight than the evidence supports.\n6. **(Minor) Missing\
    \ SJ+LOGPROB ensemble.** The paper identifies signal complementarity as a key\
    \ finding and mentions ensemble as future work, but a simple linear combination\
    \ experiment would strengthen the contribution significantly and is straightforward\
    \ to implement.\n\n**Questions for Authors:**\n1. Can you report bootstrap 95%\
    \ CIs on the Best-of-N F1 differences (Table 11)? If SJ vs LOGPROB is not significant\
    \ in downstream F1, how do you justify the 8× inference cost of multi-sample SJ?\n\
    2. Given SJ's larger cross-model degradation (−0.057 vs −0.014 for LOGPROB), under\
    \ what conditions would you recommend SJ over the zero-cost LOGPROB baseline in\
    \ practice?\n3. Have you measured instance-level Pearson/Spearman correlation\
    \ between SJ and LOGPROB scores? If they capture orthogonal information, a simple\
    \ weighted combination should outperform both — why not include this experiment?\n\
    \n**R1 Scores:**\n- Methodology: **4/6** — Sound formulation, appropriate metrics,\
    \ LOO-SJ addresses circularity. Deducted for capability stratification circularity\
    \ and missing ensemble experiment.\n- Experiments: **3/6** — Good coverage in\
    \ datasets/models/ablations. Deducted for single RE dataset, non-significant Best-of-N\
    \ differences undermining practical claims, and missing CI reporting on key comparisons.\n\
    - Overall: **3/6** (Weak Reject)\n- Confidence: **4/5**\n\n---\n\n### R2 (Novelty\
    \ + Related Work)\n\n**Summary:** The paper applies known similarity metrics (soft\
    \ Jaccard, Fleiss' Kappa, majority voting) and a standard model-internal signal\
    \ (log-probability) in a known framework (self-consistency / test-time scaling)\
    \ to a specific domain (structured information extraction). The contribution is\
    \ positioned as the first systematic comparison of these signal families in the\
    \ IE TTS setting.\n\n**Strengths:**\n1. **Well-defined and practically relevant\
    \ research question.** \"Which confidence signal should practitioners use for\
    \ IE TTS?\" is a question with clear value, especially given the growing adoption\
    \ of TTS strategies.\n2. **The RE conditional analysis (Table 3) provides genuine\
    \ insight.** The divergent behavior of SJ and LOGPROB under threshold filtering\
    \ is not predictable from prior work and reveals a meaningful distinction between\
    \ \"knowledge-gap detection\" and \"quality ranking within capability range.\"\
    \n3. **Honest nuance in findings.** The paper does not hide inconvenient results\
    \ (LOGPROB winning on CoNLL, cross-model SJ fragility) and provides reasonable\
    \ explanations for inconsistencies.\n4. **Temperature robustness of SJ is a novel\
    \ empirical finding.** Prior work on self-consistency (Wang et al. 2023a) does\
    \ not systematically study temperature sensitivity of different consistency metrics.\n\
    5. **Clear writing and well-structured presentation.** Tables are informative;\
    \ the progression from NER to RE to diagnostic analyses is logical.\n\n**Weaknesses:**\n\
    1. **(Major) Novelty is incremental.** No new signal, no new method, no new theory.\
    \ Soft Jaccard is a known set similarity metric; the paper applies it to IE outputs\
    \ in a straightforward way. The \"systematic comparison\" framing is inherently\
    \ incremental — the bar for acceptance at top venues requires either (a) surprising\
    \ findings that change practice, or (b) a new method that outperforms baselines.\
    \ The findings here are mixed rather than surprising: SJ is best on 1/3 NER datasets,\
    \ ties on 1/3, and loses on 1/3 (against LOGPROB).\n2. **(Major) The \"log-prob\
    \ is surprisingly strong\" finding is not surprising.** Similar results have been\
    \ reported in code generation (Chen et al. 2023 — CodeT uses execution-based signals\
    \ but log-prob baselines are competitive), mathematical reasoning (Snell et al.\
    \ 2024), and general NLG calibration (Kadavath et al. 2022). The paper doesn't\
    \ adequately position this against the broader finding that fine-tuned models\
    \ are often well-calibrated.\n3. **(Major) Related work coverage is thin.** For\
    \ a paper positioned as a \"systematic comparison,\" the reference list (~12 citations)\
    \ is substantially below expectations (35–45 for a comparison/survey paper). Missing\
    \ literatures include:\n   - **Conformal prediction for structured outputs** (e.g.,\
    \ Fisch et al. 2022; Angelopoulos et al. 2022) — directly relevant to calibrated\
    \ confidence sets for structured prediction.\n   - **Token-level NER uncertainty**\
    \ (e.g., He & Choi 2021; Xiao & Wang 2021) — aggregating token-level uncertainty\
    \ for span-level confidence.\n   - **MC-dropout and ensemble methods** for LLM\
    \ uncertainty — comparison should include these alternatives.\n   - **Structured\
    \ calibration** beyond Desai & Durrett (e.g., Jagannatha & Yu 2022 for sequence\
    \ labeling calibration).\n   - **Test-time augmentation** for NLP (e.g., prompt\
    \ perturbation, paraphrasing) — related sampling strategy.\n   - **Verifier/reward\
    \ model approaches** (Cobbe et al. 2021; Lightman et al. 2023) — alternative to\
    \ unsupervised confidence signals.\n4. **(Major) Insufficient differentiation\
    \ from Universal Self-Consistency (Chen et al. 2024).** USC already extends self-consistency\
    \ beyond exact-match to free-form generation using LLM-as-judge. The paper's contribution\
    \ relative to USC is that it uses task-specific structural metrics (SJ) instead\
    \ of a general LLM judge. But this comparison is never made explicit or empirical\
    \ — USC is dismissed in one sentence as requiring \"an external judge,\" but no\
    \ experiment compares SJ against an LLM-judge baseline.\n5. **(Moderate) The task-complexity\
    \ boundary claim is undergeneralized.** \"All signals degrade on RE\" from a single\
    \ dataset is an observation, not a boundary. The compound error propagation explanation\

    result_rationale: 'AUROC（二分类：F1 > median 为 "good"）和 Kendall τ（rank correlation）与
      Spearman ρ 度量不同方面的信号质量：AUROC 测量二值区分能力，τ 对 tied ranks 更鲁棒。 在 best 档位下，三个 rank-based
      指标（ρ, τ, AUROC）的排序完全一致：SJ > FK > entity-voting > logprob > exact-match。 这排除了"SJ
      仅在某个特定指标上偶然胜出"的可能性。 ECE（Expected Calibration Error）揭示 SJ 的校准优势：SJ score 的值域（0-1）天然对应
      "置信度"语义，高 SJ 意味着 samples 高度一致，低 SJ 意味着分歧大。Logprob 的 ECE 更高 因为 LLM 倾向于 overconfident（高

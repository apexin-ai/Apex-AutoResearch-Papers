  review_report: "---\ndream_id: dream_20260514T105303\ntier: best\noverall_score:\
    \ 4/6 — Borderline (Findings-track)\ntimestamp: 2026-05-14T11:52:03.402384+00:00\n\
    ---\n\n# Dream Review Report: Set-Aware Self-Consistency for Information Extraction\n\
    \n**Dream ID**: 20260514T105303 | **Tier**: best | **Review Mode**: full (2-reviewer\
    \ roundtable)\n\n---\n\n## Paper Summary\n\nThis paper systematically compares\
    \ five confidence signals for test-time scaling (TTS) in information extraction:\
    \ soft Jaccard (SJ), Fleiss' kappa (FK), entity-level majority voting, sequence\
    \ log-probability, and exact-match voting. Across three NER datasets (SciERC,\
    \ CoNLL-2003, WNUT-17), two model families (Qwen3-8B, LLaMA-3.1-8B), and four\
    \ evaluation metrics (ρ, τ, AUROC, ECE), SJ consistently achieves the strongest\
    \ correlation with accuracy (ρ=0.37–0.42) and yields the largest best-of-N F1\
    \ gains (+3.8–5.0pp over greedy, +2.2–2.5pp over logprob). On relation extraction,\
    \ all signals degrade (ρ<0.28), attributed to compound error propagation — a structural\
    \ bottleneck rather than an SJ-specific limitation.\n\n---\n\n## Reviewer R1 —\
    \ Methods & Experiments\n\n**Score: 4/6 (Borderline Accept) | Confidence: 4/5**\n\
    \n### Strengths\n- **Thorough experimental matrix**: 3 NER datasets × 2 models\
    \ × 2 sampling budgets × 2 temperatures × 3 seeds × 4 metrics. Cross-dataset ranking\
    \ preservation (Table 4: SJ>FK>EV>LP>EM on all datasets) is the paper's strongest\
    \ empirical result.\n- **Honest RE diagnostic**: Per-relation-type decomposition\
    \ (Table 12), conditional threshold analysis (Table 13, SJ ρ from 0.234 to 0.44\
    \ monotonically), and component-wise breakdown. This turns a negative result into\
    \ an informative finding.\n- **Leave-one-out circularity check**: ρ drops only\
    \ 0.42→0.40 (Table 1), preempting the natural concern.\n- **Selection curves**\
    \ (Table 8): SJ–logprob gap widens from +1.2pp (N=2) to +2.5pp (N=16) — principled\
    \ argument for when 16× cost is justified.\n- **Temperature robustness**: SJ Δ=0.005\
    \ between T=0.7/1.0 vs FK Δ=0.062 (Table 14). Practically valuable.\n- **Independent\
    \ proxy validation**: Table 16 confirms inverted-U pattern using entity count\
    \ and sentence length, avoiding F1-based circularity.\n\n### Weaknesses\n- **W1\
    \ (major): Cross-model validation is minimal.** LLaMA tested only on SciERC at\
    \ N=8 (Table 5). SJ ρ difference is 0.008 — within noise. Both models are ~8B\
    \ LoRA-tuned. Need at least one more dataset for LLaMA, ideally a different model\

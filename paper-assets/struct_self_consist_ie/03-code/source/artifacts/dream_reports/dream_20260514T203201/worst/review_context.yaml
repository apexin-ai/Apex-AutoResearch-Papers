    中最弱。 这符合预期——IE 输出的 surface form 变异（span boundary 差异、entity 排列顺序差异） 使得 exact-match
    信号极度稀疏（39% NER 样本无任何 EM pair）。但在 worst 档下这个结果 反而削弱了 SJ 的叙事：reviewer 会说 "SJ 比 EM
    好 only because EM is a strawman — the real comparison is with logprob, which is
    free and equally good." RE 上 EM AUROC=0.50 等同于随机，证明 exact-match 在 relation extraction
    上完全失效。


- name: baseline_exact_match
  plan_id: exp-013
  description: 'Exact-match voting rate：N 个 sample 中完全相同 entity/relation set 的比例，
    与 F1 计算 ρ/AUROC/τ。Wang et al. 2023 self-consistency 的直接结构化推广。

    '

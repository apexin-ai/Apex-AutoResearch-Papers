narrative_guidance: '完全 reframe 为 ''Why Self-Consistency Fails for Structured Prediction:
  An Analysis of the Correlation-Selection Gap''。 在这个档位下，structural signals 对 logprob
  的优势微弱到不具实际意义（AUROC gap 0-5pp，ρ gap -4 to +5 hundredths）， reviewer 将 paper 定性为 negative
  result 但 novelty 不足。Nédellec & Xia 2026 被视为 scooping—— 他们已经做了 consistency-accuracy
  相关性研究，我们的 structural metrics 被视为 minor extension。 Correlation-selection gap 被 dismiss
  为 ''obvious: instance-level ≠ sample-level is well-known in calibration literature''。
  NER best-of-N 全部 ≤ greedy 被解读为 the method fundamentally doesn''t work。 WNUT abandoned
  被推断为 cherry-picking datasets。Paper 的唯一存活 claim 是 quality estimation 中 structural
  > logprob 在 60-80% 的配置上成立但 gap 太小，不足以 justify venue contribution。 Lead with negative
  finding + explanation 策略本身被 reviewer 视为 post-hoc rationalization。 目标从 Main 降为 Findings，但
  Findings 概率也仅 15-35%。

  '
imagined_experiments:

  figures_description:
  - 'Selection curve (F1 vs method) showing: random < unsupervised cluster (LP/SJ/VC
    all within 0.5pp) < LR verifier (+1.1pp) << oracle (+13.2pp). The massive remaining
    gap visualizes why ''trained verifier needed'' is understatement.'
  analysis: 'Verifier closes 8.3% of NER gap — statistically significant (paired t-test
    p<0.05 across folds) but practically marginal. This is precisely the A5 WEAK outcome:
    enough to say ''supervision helps'' but not enough to constitute a paper contribution.
    One reviewer will say ''you showed logistic regression on your own features slightly
    beats your own features used individually — this is expected and not interesting.''
    Counter-argument: the 92% gap that remains proves the signals are fundamentally
    limited, not just suboptimally combined. Paper frames as: ''preliminary supervised
    baseline confirms gap is partially closable, motivating dedicated learned verifiers
    as future work.'' Findings-level contribution at best for this component.'
- name: claim_audit
  plan_id: exp-024
  description: Systematic numerical consistency audit across all paper sections. Resolve
    contradictions between Discussion, Limitations, Abstract, and source experiment
    data.
  expected_results:
    contradictions_found: 4
    critical_contradictions: 1
    minor_inconsistencies: 3
    sections_affected:
    - Discussion
    - Limitations
    - Abstract
    - Introduction
    resolution_time_hours: 3
    key_contradiction_1: Discussion '+0.1pp over single-sample' vs Limitations '+0.4pp
      over greedy' — source truth is +0.6pp (logprob NER, exp_016_rerun_1024_bootstrap)
    key_contradiction_2: Abstract AUROC '0.82' refers to CoNLL EM (0.816) but body
      text reports SciERC EM (0.749) — need to clarify which dataset/metric the abstract
      claim uses
    key_contradiction_3: 'Introduction claims ''5 confidence signals across 4 families''
      but method section describes 5 signals in 3 families (structural: SJ/FK/EM;
      voting: VC; probabilistic: LP)'
    key_contradiction_4: 'Capability-degeneracy numbers: Discussion says ''CoNLL 58%''
      but exp_012_rerun_1024 shows tied_fraction=0.597 for constrained, referencing
      different definitions of degeneracy'
  result_rationale: 在 median 档下，audit 发现的矛盾是可修复的 housekeeping 问题，不影响核心结论但如果未修会被 reviewer
    作为 soundness concern 扣分（A3 PARTIAL 中 reviewer 对 single-point ablation 的质疑部分源于数字不一致降低可信度）。最关键矛盾是
    AUROC 0.82 的来源——paper_framing.md 中 Claim 1 说 'AUROC up to 0.82' 但实际最高是 CoNLL EM_AUROC=0.816
    (exp_002) 或 CoNLL N=16 EM_AUROC=0.841 (exp_002_conll_n16)。Median tier soundness
    score 3.5-4.5 意味着这些矛盾被发现但不致命——修复后不影响结论但审稿时若未修会被扣 0.5 分。
  tables:
  - name: 'Table: Claim Audit Results'
    columns:
    - Location
    - Claimed Value
    - Source Truth
    - Resolution
    rows:
    - - 'Abstract: ''AUROC up to 0.82'''
      - '0.82'
      - CoNLL EM 0.816 (N=8) or 0.841 (N=16)
      - Use 0.82 rounded from 0.816, cite N=8 CoNLL
    - - 'Discussion: ''+0.1pp'''
      - +0.1pp over single-sample
      - +0.6pp LP vs greedy (NER, p=0.39 n.s.)
      - Correct to '+0.6pp (n.s., p=0.39)'
    - - 'Limitations: ''+0.4pp'''
      - +0.4pp over greedy
      - Same metric different rounding
      - Unify to +0.6pp with CI
    - - 'Intro: ''4 families'''
      - 4 signal families
      - 3 families (structural/voting/probabilistic)
      - Correct to '3 families' or redefine EM as separate family
  figures_description: []
  analysis: Audit 是纯 hygiene 任务但在 median 档下至关重要——soundness score 3.5-4.5 的差异往往取决于
    reviewer 是否信任作者的细节把控。AUROC 0.82 引用的歧义（CoNLL vs SciERC, N=8 vs N=16）如果 reviewer
    自己算对不上会直接降 soundness 0.5 分。修复耗时 ~3h，全部是文本编辑，零实验成本。在 median tier 下这些修复是 necessary
    condition for 3.5 soundness——如果不修，可能跌到 3.0 (Findings boundary)。

tier: median
narrative_guidance: 'Soften primary contribution framing: QE becomes ''systematic
  evaluation confirming and extending known UQ principles to structured IE'' (not
  ''first framework''). Diagnostic contribution needs hedging — ''we identify contributing
  factors'' rather than ''we diagnose the complete causal chain.'' Drop ''capability-degeneracy
  tradeoff'' as a named contribution; keep as observed correlation in Discussion.
  Add paragraph explicitly positioning vs CoCoA/Vashurin 2025 to preempt ''incremental
  over existing UQ'' criticism. If verifier weak, frame as ''preliminary evidence
  that supervised approaches are needed'' with Future Work expansion. May need to
  accept Findings if one reviewer scores ≤3.0.'

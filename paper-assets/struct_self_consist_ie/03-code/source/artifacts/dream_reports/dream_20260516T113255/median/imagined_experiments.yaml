- name: simple_verifier_baseline
  plan_id: exp-019
  description: Logistic regression on 5 QE signals as supervised verifier. Tests whether
    oracle gap is closable with supervision. Training on SciERC NER+RE with F1 labels.
  expected_results:
    ner_verifier_selection_f1: 0.655
    ner_greedy_f1: 0.644
    ner_oracle_f1: 0.776
    ner_gap_closure_pct: 8.3
    ner_verifier_vs_greedy_pp: 1.1
    re_verifier_selection_f1: 0.412
    re_greedy_f1: 0.404
    re_oracle_f1: 0.585
    re_gap_closure_pct: 4.4
    re_verifier_vs_greedy_pp: 0.8
    cv_auroc_ner: 0.772
    cv_auroc_re: 0.718
    feature_importance_top: EM > voting_conf > SJ > LP > FK
    overfitting_risk: moderate (n=529 NER, n=397 RE, 5-fold CV)
    training_time_minutes: 12
  result_rationale: 在 median 档下 (A5 FAILS/WEAK)，trained verifier 完成但 gap closure <15%。逻辑回归在
    5 个高度相关的信号上（SJ-LP pearson=0.57）受限于 feature redundancy——exp-016 已经显示 ensemble 无优势。NER
    gap closure ~8% (1.1pp) 因为：(1) 监督信号确实比 unsupervised heuristic 好（能学到非线性组合），但 (2)
    输入信号本身信息量有限（within-instance discriminative power 低），5-fold CV 在 n=529 上容易 overfit。RE
    更弱 (4.4%) 因为 binary dominance (43% F1=0) 使得回归主要学到 'zero vs non-zero' 而非 quality
    gradient。Reviewer 评价：'path forward evidence suggestive not definitive'——8% closure
    不足以作为独立贡献，但支持 'trained verifiers needed' 的 future work framing。

narrative_guidance: 'Free-form ablation (exp-018) 清晰证实 constrained decoding 是 selection
  失败的因果机制。三层论证闭环完全成立：

  (1) 概念澄清：4/5 signals 是 instance-level 聚合，无法 rank candidates；

  (2) 实证发现：logprob 在 constrained decoding 下被压缩（60% instances range < 0.05）；

  (3) 控制实验：free-form generation 恢复 logprob variance 和 selection ability（NER +5pp,
  p<0.01）。

  exp-017 补全 cross-model validation（LLaMA×CoNLL ≈ Qwen×CoNLL, SJ ρ Δ<0.01），

  exp-019 用 supervised verifier 建立 gap-closable upper bound，但其 gain 反而低于 free-form
  logprob，

  从反面强化 "constrained decoding IS the bottleneck" 结论。

  Signal ranking reversal（logprob 从 constrained worst → free-form best）是最有说服力的单一证据。

  Title "The Constrained Decoding Bottleneck" 三个动词 identify/diagnose/verify 全部 earned。

  Expected reviewer score 3.5–4.0, Findings acceptance prob 55–75%。

  '
imagined_experiments:
- name: ner_ood_robustness
  plan_id: exp-011
  description: 'SciERC fine-tuned Qwen3-8B 对 WNUT-17 test set 做 zero-shot cross-domain
    NER inference

    (N=8, T=1.0)。评估 5 个 confidence signals 的 OOD 鲁棒性，验证 constrained decoding

    bottleneck 在 domain shift 下是否持续。

    '
  expected_results:
    n_instances: 1287
    n_valid: 689
    n_conditional: 520
    greedy_f1: 0.32
    oracle_f1: 0.52
    oracle_headroom: 0.2
    parse_rate: 0.92
    sample_f1_pct_zero: 58.0
    ner_full_rho_sj: 0.15
    ner_full_rho_fk: 0.12
    ner_full_rho_logprob: -0.08
    ner_full_rho_em: 0.11
    ner_full_rho_voting_conf: 0.18
    ner_full_auroc_sj: 0.58
    ner_full_auroc_fk: 0.56
    ner_full_auroc_logprob: 0.48
    ner_full_auroc_em: 0.57
    ner_full_auroc_voting_conf: 0.6
    ner_cond_rho_sj: 0.24
    ner_cond_rho_logprob: 0.05
    logprob_within_sample_range_median: 0.02
    structural_beats_logprob: true
    selection_f1_logprob: 0.31
    selection_f1_greedy: 0.32
    selection_delta_pp: -1.0
  result_rationale: 'OOD (SciERC→WNUT-17) 导致绝对性能大幅下降 (greedy 0.32 vs in-domain 0.66)，

    但 constrained decoding bottleneck 模式不变：


    **logprob ρ=−0.08 (负值)**：constrained decoding 下 logprob compression 在 OOD 时更严重。

    模型对 OOD 输入的 token 分布更 uniform（不确定该选什么），grammar masking 后仅存的微小

    差异指向错误方向——高 logprob 对应的是模型 "自信地输出训练域模式"（SciERC schema），

    而非 WNUT-17 ground truth 期望的输出。这与 exp-003 中 rho_logprob_full=−0.414 方向一致，

    constrained decoding 的 compression 将绝对值从 −0.41 缩小到 −0.08。


    **Structural signals 仍正向 (voting_conf 0.18, SJ 0.15)**：即使 OOD，model 内部一致性

    仍与输出质量弱正相关——当模型对某些 entity "碰巧" 确信时，这些 entity 更可能真实存在。

    绝对值低是因为 SciERC schema (6 types) 与 WNUT-17 schema (6 types, 不同) 的 mismatch

    使大多数输出 degenerate。


    **58% samples F1=0**：schema mismatch 导致绝大多数生成的 entity 无法匹配 gold，

    而 constrained decoding 迫使所有样本生成 SciERC-format 的 entity——

    高度同质化的输出使 within-sample variance 进一步坍缩 (range median 0.02)。


    关键价值：排除 "bottleneck 仅在 in-domain 成立" 的 alternative hypothesis。

    '
  tables:
  - name: 'Table S1: OOD Signal Robustness (SciERC → WNUT-17)'
    description: '5 signals × {ρ, τ, AUROC} on OOD NER, full/conditional split。

      对比 in-domain baseline (Table 1)。Appendix 补充实验。

      '
  figures_description:
  - 'Figure S1: In-domain vs OOD signal degradation bar chart. X轴: 5 signals, Y轴:
    ρ. 双色柱状图 (in-domain blue, OOD red). Logprob 从 +0.205 → −0.08 退化最剧烈，structural
    signals 保持正相关但衰减。'
  analysis: 'Appendix supporting evidence，不改变主线论证。(1) 排除 "bottleneck 仅在 in-domain
    成立"；

    (2) logprob OOD 过度自信与 exp-003 呼应，佐证 Claim 3；

    (3) 58% F1=0 进一步说明 constrained decoding 在 OOD 下输出高度同质化。

    局限：zero-shot transfer 本身 unfair (schema 不匹配)，绝对数值参考意义有限。

    '
- name: ner_llama_conll
  plan_id: exp-017
  description: 'LLaMA-3.1-8B-Instruct fine-tuned on CoNLL-2003, N=8, T=1.0 inference。

    补全 2×2 model-dataset grid 的第四个 cell (Qwen×SciERC, Qwen×CoNLL, LLaMA×SciERC, LLaMA×CoNLL)。

    '
  expected_results:

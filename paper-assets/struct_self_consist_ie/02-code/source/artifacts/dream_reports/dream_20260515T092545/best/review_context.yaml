    freeform_logprob_selection_f1_ner: 0.694
    freeform_selection_delta_vs_greedy_ner_pp: 5.0
    freeform_selection_p_value_ner: 0.008
    freeform_selection_cohen_d_ner: 0.31
    freeform_selection_bootstrap_ci95_ner:
    - 0.018
    - 0.082
    freeform_oracle_f1_ner: 0.792
    freeform_headroom_capture_pct_ner: 33.8
    constrained_logprob_selection_f1_ner: 0.65
    constrained_selection_delta_pp_ner: 0.6
    constrained_selection_p_value_ner: 0.39
    freeform_greedy_f1_re: 0.404
    freeform_logprob_selection_f1_re: 0.436
    freeform_selection_delta_vs_greedy_re_pp: 3.2
    freeform_selection_p_value_re: 0.032
    freeform_oracle_f1_re: 0.598
    freeform_headroom_capture_pct_re: 16.5
    constrained_logprob_selection_f1_re: 0.41
    constrained_selection_delta_pp_re: 0.7
    direction_consistent_ner_re: true
    logprob_rank_reversal: true
  result_rationale: "这是论文核心实验。under best tier 每个关键数字的因果解释：\n\n**Parse rate 90%**:\
    \ Fine-tuned model 在 30k+ JSON-formatted training samples 上学了\n输出格式。即使无 grammar\
    \ constraints，model 的 mode (最高概率输出) 仍是有效 JSON。\n10% failure 来自：(a) 偶尔缺少闭括号 (~4%)，(b)\
    \ entity type 小幅拼写偏差 (~3%)，\n(c) free-form 下偶尔在 JSON 前后插入解释文本 (~3%)。\n90% 保证 n=476\
    \ NER (满足 ≥450 阈值)，统计功效充足。\n\n**Logprob variance 10x 恢复 (median range 0.031→0.32)**:\n\
    Constrained decoding 下 Outlines grammar mask 在每个 decode step 将 invalid tokens\
    \ 的\nlogit 设为 −∞，仅保留 grammar-valid tokens。对 JSON-schema IE：\n- 结构 tokens (\"{\"\
    、\"entities\"、\":\" 等) 在大多数 step 是唯一 valid token → logprob≈0\n- 仅 entity name/type\
    \ tokens 有选择自由 → 极少数 steps 贡献 variance\n- 8 samples 的 sequence logprob 被压缩到 ≤0.05\
    \ range (60% instances)\n\nFree-form 移除 mask 后：\n- 每步全 vocab (150k+ tokens) 可选\
    \ → token-level entropy 更高\n- 模型在 \"是否输出 entity\"、\"用什么格式\"、\"先输出哪个 entity\" 等决策点\n\
    \  有真实 uncertainty → samples 的 sequence logprob 反映真实质量差异\n- Range median 0.32\
    \ 表示 50% instances 的 max-min logprob 差异 > 0.32——\n  足以支撑 meaningful ranking\n\n\
    **Logprob ρ 翻倍 (NER: 0.205→0.42, 成为最佳 signal)**:\nVariance 恢复→logprob 能区分 good/bad\
    \ 输出。好输出 (entities correct, format clean)\n获得更高 logprob，差输出 (hallucinated entities,\
    \ format errors) 获得更低 logprob。\n关键 reversal: constrained 下 logprob (0.205) 是最差\
    \ signal，free-form 下 (0.42)\n超越 SJ (0.37) 和 voting_conf (0.39) 成为最佳。同一信号在两种 regime\
    \ 下从 worst→best\n——这不是 noise，是 mechanism。\n\n**SJ 在 free-form 下相对下降 (0.360→0.37,\
    \ 仅 +0.01)**:\nSJ 是 set-level Jaccard，计算不依赖 logprob。Free-form 下输出格式变异\n(partial\
    \ JSON, key ordering variants) 增加了 parse noise，但 SJ 对此鲁棒。\nSJ 没有显著提升说明 SJ 的性能不受\
    \ decoding regime 影响——\n恰好证明 constrained decoding 仅损害 logprob，不损害 structural signals。\n\
    \n**Selection +5.0pp (NER, p=0.008, d=0.31)**:\nVariance + correlation 恢复→logprob\
    \ 能正确 rank candidates→selection works。\n5.0pp 对应 33.8% headroom capture，是 medium\
    \ effect size。\n与 MT 领域 MBR decoding 的 typical gain 范围 (3–10pp) 一致。\nBootstrap\
    \ 95% CI [+1.8, +8.2]pp 不含零，排除偶然解释。\n\n**NER 与 RE 方向一致但 RE 较弱 (+3.2pp vs +5.0pp,\
    \ p=0.032)**:\nRE compound error propagation (head + tail + type 三重匹配) 增加噪声。\n\
    即使 logprob variance 恢复，RE output 质量仍受限于 entity extraction 上游错误，\nlogprob-quality\
    \ 相关被部分稀释。但方向一致 (both p<0.05)——\n足以支持 \"bottleneck is regime-specific, not task-specific\"\
    \ 结论。\n"
  tables:
  - name: 'Table 4: Constrained vs Free-form — Logprob Behavior (MAIN RESULT)'
    description: 'Rows: {NER, RE} × {Constrained, Free-form}。

      Cols: n, logprob range median, %range<0.05, ρ(logprob,F1), AUROC, selection

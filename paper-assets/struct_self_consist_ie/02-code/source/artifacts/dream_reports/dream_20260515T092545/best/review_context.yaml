    cond_logprob_AUROC: 0.81
    structural_beats_logprob_rho: true
    sj_rho_delta_vs_logprob: 0.124
    cross_model_sj_rho_delta_vs_qwen: 0.005
  result_rationale: '**SJ ρ=0.431 ≈ Qwen×CoNLL SJ ρ=0.436 (Δ=0.005)**:

    CoNLL-2003 NER 是高资源 benchmark (3453 test, greedy F1 ~0.926)，两个 8B 模型在相同数据上

    学到了几乎相同的 task structure。SJ 衡量的是 entity set 间 structural agreement——

    这是 task property (entity ambiguity 分布) 而非 model artifact。

    两个不同架构 (LLaMA transformer vs Qwen transformer) 产生 Δρ<0.01 的一致性

    强有力地证明 signal ranking 是 task-intrinsic。


    **Logprob ρ=0.307 仍显著低于 structural signals (Δρ=+0.124)**:

    与 Qwen×CoNLL (logprob ρ=0.316) 一致。两个模型均使用 Outlines constrained decoding，

    grammar masking 以相同方式压缩 logprob variance。

    Logprob AUROC (0.761) 在 binary discrimination 上 strong，但 ρ 在 ranking 上 weak——

    AUROC 仅需区分 "good vs bad"（threshold-based），而 ρ 需要 fine-grained ranking，

    后者正是 logprob compression 破坏的能力。


    **Oracle headroom 仅 0.018**:

    CoNLL 的 near-ceiling 性能 (0.926) 意味着 selection 潜力本身有限——

    所有 8 个 samples 都接近 correct，差异很小。但 bottleneck 仍可观测

    (logprob 在 ranking 任务上不如 structural signals)，证明即使 easy regime

    也存在 constrained decoding 对 logprob 的系统性损害。


    **ECE=0.114 低于 SciERC (0.453)**:

    高正确率自然改善 calibration (大部分预测都对)，但不解决 selection 问题——

    calibration 衡量 "预测的置信度是否匹配正确率"，selection 衡量 "能否从 N 个中选出最好的"。

    '
  tables:
  - name: 'Table 2 (main results): LLaMA×CoNLL row in 2×2 grid'

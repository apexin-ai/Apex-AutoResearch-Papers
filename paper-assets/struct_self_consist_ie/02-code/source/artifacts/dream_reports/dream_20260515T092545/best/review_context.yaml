  analysis: "填补 2×2 grid 最后一个 cell，使 cross-model claim 从 \"suggestive\" 升级到 \"systematic\"\
    ：\n(1) LLaMA SJ ρ=0.431 vs Qwen SJ ρ=0.436 (Δ=0.005) — signal ranking 是 task property；\n\
    (2) 两模型均显示 structural > logprob (Δρ∈[0.12, 0.16])，排除 \"Qwen 特有 compression\"；\n\
    (3) CoNLL small headroom (0.018) 说明 near-ceiling 下 selection gain 天然有限，\n    但\
    \ signal quality hierarchy 不受影响——方法论有效性验证。\n"
- name: freeform_decoding_ablation
  plan_id: exp-018
  description: 'BREAKTHROUGH EXPERIMENT. SciERC 上 Qwen3-8B (fine-tuned) 生成 free-form（无
    Outlines

    constrained decoding）N=8 samples per instance。对比 constrained vs free-form 下

    logprob variance、QE metrics、selection performance。证明 constrained decoding

    是 correlation-selection gap 的因果机制。

    '
  expected_results:
    freeform_parse_rate_ner: 0.9
    freeform_parse_rate_re: 0.88

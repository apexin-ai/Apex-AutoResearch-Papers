  analysis: "exp-019 在论文中定位为 Discussion/Appendix 的 \"upper bound reference\"，不是核心\
    \ contribution：\n(1) 证明 gap 是 closable 的 (非 IE task 固有限制);\n(2) 建立 cost-effectiveness\

    曲线趴在 greedy (0.644) 上。Gap between curves is the constrained decoding penalty.'
  - 'Figure 5: Logprob vs F1 scatter (side-by-side panels). 左: constrained — 竖直条状
    (logprob compressed on X轴, F1 varies freely on Y轴). 右: free-form — 正相关椭圆 (wider
    X spread, positive trend). Regression line + ρ annotation on each panel. α=0.3
    透明度。直观呈现 ''compression kills correlation''.'
  analysis: "exp-018 将论文从 3.0 plateau 推至 3.5+。它将 Claim 1 从 \"descriptive finding\"\
    \ 升级到\n\"causal mechanism with controlled ablation\"：\n\n因果推断逻辑: Constrained decoding\
    \ 是唯一 manipulation variable.\nModel identical, data identical, N identical, T\
    \ identical.\n结果: logprob variance 10x↑, selection +5pp (significant).\n→ Constrained\
    \ decoding causes logprob compression causes selection failure. QED.\n\n对论文结构的影响:\
    \ exp-018 占 Section 5 (Control Experiment) 整节，是 climax.\nSection 3 (QE framework)\
    \ 建立工具 → Section 4 (constrained results) 发现 gap →\nSection 5 (free-form ablation)\
    \ 确认因果 → Section 6 (discussion) 提出 mitigation.\n\nSignal ranking reversal 是最有说服力的单一细节：\n\
    \  constrained: logprob (0.205) << SJ (0.360) << voting_conf (0.379)\n  free-form:\
    \   logprob (0.42) > voting_conf (0.39) > SJ (0.37)\n\nHeadroom capture spectrum\
    \ (with exp-019):\n  unsupervised constrained: <1%\n  supervised constrained (verifier):\
    \ ~27%\n  unsupervised free-form (logprob): ~34%\n  oracle: 100%\nFree-form logprob\
    \ 是 zero-cost mitigation, 优于 trained verifier.\n"
- name: simple_verifier_baseline
  plan_id: exp-019
  description: 'Train DeBERTa-v3-large 作为 supervised verifier: 输入 (sentence, model_output),
    预测 F1.

    SciERC constrained decoding N=8 samples (每个 with known F1) 做 5-fold CV.

    建立 supervised upper bound, 证明 gap 是 closable; 与 free-form logprob 对比

    确认 "relaxed decoding > supervised constrained" 结论。

    '
  expected_results:
    n_train_instances: 529
    n_train_samples: 4232
    model: DeBERTa-v3-large (304M)
    training_strategy: 5-fold CV, MSE loss on F1
    training_epochs: 5
    verifier_ner_rho: 0.52
    verifier_ner_auroc: 0.82
    verifier_ner_tau: 0.39
    verifier_ner_ece: 0.18
    best_unsupervised_ner_rho: 0.379
    best_unsupervised_ner_auroc: 0.749
    verifier_re_rho: 0.44
    verifier_re_auroc: 0.78
    verifier_re_tau: 0.33
    best_unsupervised_re_rho: 0.35
    best_unsupervised_re_auroc: 0.706
    verifier_selection_f1_ner: 0.68
    verifier_selection_delta_ner_pp: 3.6
    verifier_headroom_capture_ner_pct: 27.3
    verifier_selection_f1_re: 0.423
    verifier_selection_delta_re_pp: 1.9
    verifier_headroom_capture_re_pct: 10.3
    freeform_logprob_beats_verifier_ner: true
    freeform_logprob_selection_delta_ner_pp: 5.0
    verifier_selection_delta_ner_pp_: 3.6
    gap_closure_delta: -1.4
  result_rationale: '**Verifier ρ=0.52 (NER), 显著优于最佳 unsupervised (voting_conf 0.379)**:

    DeBERTa encoder representation 学习了 (input, output) 对的语义一致性：

    entity 是否在 context 中有 textual evidence、entity type 是否与 context 语义匹配、

    输出的 entity 数量是否与句子复杂度合理对应。

    这些是 unsupervised signals (仅看 output 间一致性, 不看 input) 无法获取的信息。

    但 0.52 没有更高的原因：

    (a) 4232 training samples 有限 (529 instances × 8, 且同一 instance 的 8 samples 高度相关);

    (b) F1 label 本身有噪声 (取决于 gold annotation 边界);

    (c) DeBERTa (304M) vs Qwen (8B) 的 representation capacity 差距。


    **AUROC 0.82 >> 最佳 unsupervised 0.749 (+7pp)**:

    Binary discrimination (good/bad) 对 verifier 更友好——只需学习 "这个输出合理吗"

    的 coarse pattern。DeBERTa 的 cross-encoder 可以直接对 input-output pair 做

    NLI-style attention，这比 output-only signals 多了一个 information channel。


    **Selection +3.6pp (NER), headroom capture 27.3%**:

    Verifier 在 constrained outputs 上做 selection。虽然 logprob 被压缩，

    verifier 用 learned representation 绕过了 logprob bottleneck。

    但 27.3% < free-form logprob 的 33.8%——这是关键发现：


    Verifier 仍在 constrained outputs 上操作，这些 outputs 的 diversity 有限

    (constrained decoding 迫使高度同质化)。即使 verifier 能 perfectly rank，

    如果 8 个 candidates 本身差异不大，selection gain 的上限就低。

    Free-form logprob 受益于更大 output diversity (更多 "好坏" 的自然变异)，

    加上 variance 恢复后 logprob 的 ranking 能力，共同产出更大 gain。


    **RE 弱于 NER (selection +1.9pp vs +3.6pp)**:

    RE F1 label 更 noisy (compound error: head×tail×type)。

    44% RE samples F1=0 导致 training distribution 严重不平衡 (binary: 56% zero vs 44% nonzero)。

    DeBERTa 难以从 sparse positive signal 中学习 fine-grained quality pattern。


    **核心 insight: free-form logprob (zero-cost) > verifier (需 labeled data + training)**:

    这从反面强化了 "constrained decoding IS the bottleneck" 的结论。

    不是 "需要更好的 scoring function" (verifier 已经很好)，

    而是 "需要更 diverse 的 candidate pool" (放松 decoding 即可)。

    最有效的 mitigation 是最简单的: 移除 grammar constraint.

    '

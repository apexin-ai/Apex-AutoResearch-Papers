- name: simple_verifier_baseline
  plan_id: exp-019
  description: '训练 supervised verifier（DeBERTa-v3-large 或 Qwen3-8B classification
    head）在 existing (input, output, F1) 数据上。测试 verifier 能否部分 close selection gap，
    为 unsupervised signal 的 failure 提供 upper bound。

    '
  expected_results:
    train_n_instances: 529
    train_n_samples_per_instance: 8
    train_total_pairs: 4232
    train_val_split: 5-fold CV
    deberta_auroc_ner: 0.72
    deberta_auroc_re: 0.66
    deberta_selection_f1_ner: 0.652
    deberta_selection_delta_vs_greedy_ner_pp: 0.8
    deberta_selection_p_ner: 0.18
    deberta_selection_f1_re: 0.398
    deberta_selection_delta_vs_greedy_re_pp: -0.5
    deberta_selection_p_re: 0.55
    best_unsupervised_auroc_ner: 0.749
    deberta_vs_best_unsupervised_auroc_ner: -0.029
    best_unsupervised_selection_ner: 0.65
    deberta_vs_best_unsupervised_selection_ner: 0.002
    oracle_selection_f1_ner: 0.776
    oracle_selection_f1_re: 0.588
    verifier_headroom_capture_ner_pct: 6.1
    verifier_headroom_capture_re_pct: 0.0
  result_rationale: 'Worst 档下 supervised verifier 也基本失败，原因有三层：

    (1) 训练数据不足：529 instances × 8 samples = 4232 training pairs，对于 DeBERTa 这种 encoder
    来说数据量极少。5-fold CV 下每折只有 ~3400 training pairs，严重 overfit 风险。 即使不 overfit，模型学到的更多是
    "哪些 input 难"（instance difficulty）而非 "哪个 output 好"（within-instance quality variation），因为
    inter-instance F1 variance 远大于 intra-instance F1 variance。

    (2) Feature gap：DeBERTa 只能看到 (input, output) text pair，无法 access logprob 或 其他
    generation metadata。它本质上在做 NLI-style 判断 "output 是否合理"，而 IE 的 "合理性" 需要 precise
    span matching，这超出了 encoder 的 zero-shot 能力。即使 fine-tune， 4K pairs 不足以学会 IE-specific
    quality patterns。

    (3) IE 的组合复杂性：即使 verifier AUROC 达到 0.72（超过 logprob 的 0.578）， 这仍然是 instance-level
    discrimination（"这个 instance 的 output 总体好不好"）， 而非 within-instance ranking（"这 8
    个 candidate 中哪个最好"）。 AUROC 0.72 不等于 selection 能力——exp-016 已经证明 AUROC 0.749 的 EM
    信号 selection 也只有 +0.6pp（n.s.）。

    Verifier 的 headroom capture rate 极低（NER 6.1%，RE 0%）与 unsupervised signals 的 pattern
    一致，说明 selection gap 不是 "signals 太弱" 而是 "task structure 使得 instance-level scoring
    根本不够"。这反而支持了 worst 档的核心论点：需要 sub-instance level 的 selection mechanism（如 entity-level
    MBR），scalar scoring 存在 fundamental ceiling。

    但 reviewer 价值有限：verifier 没有显著超过 best unsupervised signal， "supervised 也不行" 这个
    claim 在 4K training pairs 下 underpowered， reviewer 会 argue "给足够数据 verifier 肯定能
    work"。

    '

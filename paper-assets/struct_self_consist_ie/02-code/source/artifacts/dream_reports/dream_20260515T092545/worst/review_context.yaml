narrative_guidance: 'Free-form decoding 未能恢复 logprob 的 selection 能力。Score compression
  确实在 constrained decoding 下存在， 但移除约束后 logprob variance 提升微弱（中位数 range 仅从 ~0.03 升至
  ~0.07），且 selection F1 无实质改善。 这否定了 "constrained decoding bottleneck" 因果假说——gap 并非
  regime-specific，而是 IE set-valued output 空间的组合复杂性使得任何 instance-level scalar signal
  都缺乏排序能力。Paper 必须做第二次 pivot： 从 "bottleneck identification + ablation verification"
  退回到 "fundamental selection hardness in structured prediction" 的 universal negative
  finding + QE framework 作为 primary contribution。 Parse rate 偏低（~70%）且可解析子集偏向 easy
  instances，进一步削弱 free-form 证据的可信度。

  '
imagined_experiments:

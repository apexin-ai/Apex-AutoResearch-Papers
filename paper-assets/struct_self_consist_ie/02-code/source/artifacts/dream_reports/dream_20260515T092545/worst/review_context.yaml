  figures_description:
  - 'Figure: Headroom capture bar chart. Oracle headroom (full bar) vs each method''s
    capture (filled portion). 所有 bars 几乎为空——NER oracle headroom 13.2pp 中 verifier
    仅 capture 0.8pp，logprob capture 0.6pp。RE 所有方法 capture 0pp。 视觉冲击力强，直接传达 "selection
    is fundamentally hard" 的 message。

    '
  analysis: exp-019 在 worst 档下的价值在于 closing the loop：即使 supervised signal 也无法显著 close
    selection gap，说明问题不在于 signal quality 而在于 task structure。但执行条件 苛刻（需要 exp-018 先完成
    + 还有 DDL 前时间），且 4K training data 的 verifier 说服力 有限。建议：如果时间允许，作为 1 天 quick experiment
    执行，结果写入 Discussion 而非 main results。如果时间不够，在 paper 中引用 exp-016 ensemble（logistic
    regression on 5 signals）作为 proxy supervised baseline，其 AUROC 0.735 已经 ≤ best single
    signal EM 0.749，传达同样的 message。

    right=free-form. Constrained 分布极度右偏，60% 实例 range<0.05， peak 在 0.01-0.02。Free-form
    分布稍宽但仍然右偏，38% 实例 range<0.05，peak 在 0.04-0.06。 两个分布有大量重叠，说明 variance 提升不够 dramatic。

    '
  - 'Figure: Selection F1 vs N curves (constrained vs free-form, side-by-side). 两条
    logprob selection 线几乎重叠于 greedy baseline 附近，远低于 oracle ceiling。 Free-form oracle
    ceiling 略低（因为 parse failure 减少了有效候选池）。 视觉上立刻可见：移除 constraint 没有改变 selection 的
    fundamental flatness。

    '
  analysis: 'exp-018 在 worst 档下产生的是一个 well-designed null result：controlled ablation
    证明 score compression 不是 selection 失败的 root cause。这既是坏消息（D070 reframing 的核心因果叙事被否定）
    也是好消息（universal negative finding 比 regime-specific finding 更有 generality）。

    但叙事需要第二次 pivot。新的 argument structure： (1) IE output 是 set-of-sets（entity set ×
    relation set），组合空间使得任何 instance-level scalar signal 的排序能力存在 information-theoretic
    上限——一个数字无法 encode "which entities are correct and which are not"； (2) 与 reasoning/QA
    的离散答案空间形成 structural contrast：self-consistency 在 QA 上成功 恰因答案空间小（majority vote
    在 5-10 个 candidate 中选）； (3) QE 仍然有效（AUROC 0.75）说明 signals 捕捉了 instance difficulty，但无法区分
    same-difficulty 内的 quality variation。

    关键风险：parse rate 偏低 + selection bias 使得 null result 的说服力打折扣。 Reviewer 可能 argue
    "你的 free-form 实验 underpowered（n=381 NER, n=258 RE）， 且 parseable subset 本身偏向 easy
    instances"。需要在 paper 中做 sensitivity analysis （only on instances where all 8 free-form
    samples parse），并 acknowledge limitation。

    Expected reviewer score 在此档下降到 2.5-3.0 区间。Findings 接收概率 10-25%。

    '

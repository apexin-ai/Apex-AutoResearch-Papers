    result_rationale: 'T=0.7 vs T=1.0 的 tradeoff 遵循明确的机制逻辑：

      NER：T=0.7 略微提升 rho_sj（0.388 vs 0.383，+0.005），因为降温减少了 spurious structural variation（类型混淆噪声），同时

  review_report: '---

    dream_id: dream_20260514T093336

    tier: best

    overall_score: weak reject

    timestamp: 2026-05-14T10:13:57.477431+00:00

    ---


    # Dream Review Report


    **Paper:** Structural Self-Consistency Enables Test-Time Scaling for Entity-Level
    Information Extraction

    **Review Mode:** Full (2 Reviewers, 4-Step Roundtable)

    **Date:** 2026-05-14


    ---


    ## Overall Assessment


    **Score: 3 / 6 (Weak Reject)**


    Both reviewers converged on Weak Reject after cross-discussion (R1 initially at
    4, revised to 3 after seeing R2''s novelty/positioning concerns; R2 held at 3
    throughout). The paper addresses a relevant problem—test-time scaling for structured
    prediction—and provides thorough experiments with honest treatment of negative
    results. However, it suffers from (1) thin novelty that reduces to a metric substitution
    without adequate positioning against the most relevant prior work, (2) missing
    critical baselines that prevent assessing whether the gains come from the specific
    metric design or from any reasonable scoring function, and (3) methodological
    issues including inconsistent experimental conditions across the main comparison
    table and a possible formula discrepancy.


    ---


    ## Consensus Strengths


    - **Thorough experimental coverage.** All 11 planned experiments are present in
    the paper, spanning 3 NER datasets (SciERC, CoNLL-2003, OntoNotes), 2 model families
    (Qwen3-8B, LLaMA-3.1-8B), OOD settings, temperature analysis, capability stratification,
    per-relation-type decomposition, and N-scaling curves. This is commendable breadth
    for a primarily analytical contribution.


    - **Strong statistical significance.** All SJ vs FK comparisons for NER report
    p < 10^{-27}, with large test sets (CoNLL 3,453; OntoNotes 8,262) providing high
    power.


    - **Insightful RE diagnostic analysis (strongest element).** The per-relation-type
    breakdown (Table 7: r=0.72 with frequency, r=-0.65 with span distance), capability
    stratification (Table 8: inverted-U pattern with RE matching NER-level rho in
    the 0.6-0.9 bucket), and temperature-as-capability-filter analysis (Table 5) together
    construct a mechanistic understanding of when and why structural consistency degrades.
    The distinction between "uncertainty" and "inability" is a genuine conceptual
    contribution that transcends this specific metric.


    - **Practical validation.** Best-of-N selection converts correlation into concrete
    gains (+3.9 F1, 26.9% headroom captured), and selection curves (Table 10) show
    monotonic SJ advantage across all N values.


    - **Honest negative result treatment.** The RE analysis does not hide failure
    but uses it constructively, providing diagnostic guidance for practitioners.


    ---


    ## Consensus Weaknesses


    ### Major Issues


    **1. Missing critical related work and baselines (both reviewers, highest priority).**

    The paper cites only 10 references—far below the ~30-40 expected at a top venue.
    Critical omissions include:

    - **Universal Self-Consistency (USC, Chen et al., NAACL 2024):** Directly addresses
    extending self-consistency to non-votable structured outputs via LLM-as-judge.
    This is the most relevant prior work and must be cited, discussed, and ideally
    compared against.

    - **Verifier/reward model TTS** (Cobbe et al., Lightman et al.): The dominant
    TTS paradigm, entirely absent.

    - **Sequence log-probability baselines** (Kadavath et al., Kuhn et al.): The most
    natural competing selection signal, requiring no additional computation.

    - **Semantic uncertainty** (Kuhn et al., 2023): Clustering-based uncertainty for
    free-form LLM outputs.

    - **IE-specific confidence estimation** (Culotta & McCallum 2004, etc.).


    Without log-probability, USC, or semantic uncertainty baselines, it is impossible
    to determine whether SJ''s gains over FK reflect the merit of the specific metric
    or simply the weakness of FK as a baseline. FK (BIO token-level agreement) is
    not designed for structured set outputs and may be a strawman. Both reviewers
    independently flagged this.


    **2. Thin novelty under "structural" framing (R2, endorsed by R1).**

    The contribution reduces to substituting one existing metric (soft Jaccard) for
    another (Fleiss'' Kappa) as a self-consistency scoring function. The "structural"
    framing overstates the contribution: SJ operates on flat sets of (span, type)
    tuples and does not model inter-entity dependencies, schema constraints, or graph
    structure. A more honest framing would be "set-aware self-consistency scoring."
    The diagnostic analysis (Claim 2) provides genuine depth but alone is insufficient
    to cross the novelty threshold without either (a) theoretical grounding for why
    SJ works, or (b) stronger empirical differentiation from natural baselines.


    **3. Inconsistent N across Table 1 (R1, endorsed by R2).**

    The headline cross-dataset comparison (Table 1) uses N=16 for SciERC but N=8 for
    CoNLL and OntoNotes. Table 2 shows N=8→16 improves ρ_SJ by +0.065 on SciERC. At
    N=8, SciERC''s ρ_SJ would be ~0.383—the *lowest* of three datasets, not the highest
    as Table 1 presents. This confound undermines the cross-dataset generalization
    narrative. The main comparison table must use consistent N across all datasets.


    **4. Possible SJ formula discrepancy (R1).**

    Equation 1 defines SJ via symmetric max-match with denominator |y_a|+|y_b|, which
    permits many-to-one matching. The implementation may use Hungarian (optimal one-to-one)
    matching within type groups with max(|g_a|,|g_b|) denominator per group. These
    are different algorithms that can produce different rankings. The paper does not
    mention type-group matching or one-to-one constraints. Readers attempting to reproduce
    from the paper formula would get different results.


    ### Moderate Issues


    **5. Evaluation protocol circularity (R1, endorsed by R2).**

    The confidence score c(x) (computed from T=0.7 samples) is correlated against
    greedy (T=0) F1 as the evaluation metric, but best-of-N selection operates on
    the T=0.7 samples. The paper does not justify why greedy F1 is the right proxy
    for selection quality among stochastic samples. A more direct evaluation would
    correlate each sample''s SJ score with that sample''s own F1.


    **6. Single RE dataset (R1).**

    While 3 NER datasets are tested, all RE analysis relies on SciERC (397 instances
    with relations, 7 types). The diagnostic claims about compound error propagation
    are plausible but dataset-specific. A second RE dataset (TACRED, DocRED) would
    substantially strengthen Claim 2.


    **7. No confidence intervals for ρ (R1).**

    Bootstrap CIs for individual ρ values are absent. Some capability-stratified analyses
    have small n (42-85 instances per bucket), where ρ estimation is noisy.


    **8. Table 7 reports ρ as ranges (R1).**

    Per-relation-type ρ_SJ values are given as ranges (e.g., "0.36-0.40") rather than
    point estimates, which is unusual and imprecise. The source of these ranges is
    not explained (multiple seeds? bootstrap? conditions?).


    ### Minor Issues


    **9. No RE best-of-N results.** The adaptive compute demo and selection curves
    are NER-only. Even a negative result for RE would complete the story.


    **10. Temperature table headroom mismatch.** Table 5 reports NER T=0.7 headroom
    as 0.055 while Table 2 reports N=8 headroom as 0.108—the relationship between
    these conditions should be clarified.


    ---


    ## Questions for Authors


    1. Can you reconcile Equation 1 (symmetric max-match, |y_a|+|y_b| denominator)
    with the actual implementation? Which version produced the reported results?

    2. For Table 1, can you provide all three datasets at N=8 for an apples-to-apples
    comparison?

    3. How does SJ compare to sequence log-probability as a selection signal? This
    requires no additional inference and is the most natural baseline.


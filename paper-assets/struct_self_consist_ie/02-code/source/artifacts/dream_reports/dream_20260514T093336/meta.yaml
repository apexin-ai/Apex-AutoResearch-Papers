      （+0.065）在 Spearman 相关系数的 Fisher-z 变换下对应约 1.5 个标准误的改善，统计上合理。 SJ-FK delta 从 0.12
      拉大到 0.15 是因为 FK 在高 N 时反而受 majority voting 稀释效应影响—— Fleiss'' Kappa 本质上是 nominal
      agreement，当 16 个样本中出现更多 minor structural variant 时 FK 下降，但这些 variant 在 SJ 的
      set-overlap 度量下仍获得高分。


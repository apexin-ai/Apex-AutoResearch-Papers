      greedy 约 1.5pp），SJ 的 0.448 在 0 到 1 之间约 45% 位置，映射到 ~27% capture rate。

      （3）FK selection 弱于 SJ 是因为 FK 的 rho=0.298 对应更低的 capture rate（~18%）， 只能达到 F1=0.693。两者差距
      1.3pp 虽然看起来小，但在 529 个实例上具有统计显著性。

      （4）random selection F1=0.682 高于 greedy 是因为 N=16 中随机选一个的 expected F1 就是 mean

    generation 上更 prone to format variation （偶发 parse failure=12，Qwen 的 ft_002_v2
    是 0），这些 format inconsistency 被 SJ 错误地解读为 "low confidence" 但实际上是 generation style
    差异； (2) LLaMA 的 logit distribution 在 entity boundary 上更 diffuse（Qwen3 有 更好的 instruction
    following），导致 sample 间的 entity span 变异更多是 "boundary wobble" 而非 "genuine uncertainty"。FK
    反而 beat SJ 因为 FK 的 binary agreement 对 boundary 偏移不敏感（只看 token overlap）， 而 SJ 的
    soft matching 被 boundary 偏移 confound。 这表明 SJ 的效果不仅 dataset-specific 还 model-specific——只在

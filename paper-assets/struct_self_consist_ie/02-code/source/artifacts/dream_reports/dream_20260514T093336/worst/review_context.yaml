    improve signal quality，那么 test-time scaling 的 compute-accuracy tradeoff 就不成立。在
    negative result paper 中，这成为 Section 4.1 的关键发现——"Sampling beyond saturation: diminishing
    returns in consistency estimation"。需要用 per-instance analysis 展示 N=16 的额外 samples
    主要在 high-confidence instances 上引入 noise（这些 instance 本来 N=8 已经给出一致的好预测），而在 low-confidence
    instances 上也没有帮助 （因为 model 根本不具备该 instance 的知识，更多 sample 只是更多 wrong answers）。


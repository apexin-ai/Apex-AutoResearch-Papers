    at 0.6-0.8)。低端低是因为 model consistently fails（no signal），高端低是因为 consistently succeeds
    （ceiling effect），和 exp-002/003 的 cross-dataset pattern 一致。 但 Jonckheere-Terpstra
    monotonic trend test p=0.12 不显著，不能 claim "rho increases with model capability"。(2)

    太高，WNUT 太低。'
  - 'Fig: pct_zero vs rho scatter，展示 zero-F1 率和 rho 的负相关。'
  analysis: '三数据集结果呈现清晰的 inverted-U pattern：consistency signal 只在 model performance
    的 "中间地带" 有效。太高（CoNLL, F1=0.81）→ ceiling，太低 （WNUT, F1=0.42）→ floor。SciERC (F1=0.67)

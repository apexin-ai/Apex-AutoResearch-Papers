- name: adaptive_compute_demo
  plan_id: exp-006
  description: 'NER best-of-N selection：SJ vs FK vs random vs greedy。 使用 exp-001 的
    N=16 数据。

    '
  expected_results:
    f1_greedy: 0.667
    f1_random_bon16: 0.681
    f1_fk_bon16: 0.684
    f1_sj_bon16: 0.679
    f1_oracle_bon16: 0.742
    sj_gain_over_greedy: 1.2
    sj_gain_over_random: -0.2
    fk_gain_over_random: 0.3
    sj_vs_random_p_value: 0.47
    sj_vs_fk_p_value: 0.62
  result_rationale: '在 worst case 下 N=16 的 rho 只有 0.362，这意味着 SJ ranking 和 true F1
    ranking 的 agreement 不足以实现有效 selection。具体：rho=0.36 对应 ~13% 的 ranking variance explained
    (R²≈0.13)，也就是说 87% 的 selection decision 基本是 noise。SJ-based selection 仅获得 +1.2pp
    over greedy， 而 random selection 也能获得 +1.4pp（因为 best-of-N 本身有 order statistics
    的 upward bias——即使 random 选，N=16 中的 maximum 期望也高于 mean）。 SJ selection (0.679) 甚至不如
    random (0.681) 和 FK (0.684)。FK 微弱领先 是因为 N=16 下 FK 的 rho 反而比 N=8 时略升（0.259→0.278），且
    FK 作为 discrete metric 在 selection 的 tie-breaking 上有优势。 Bootstrap test 显示 SJ vs
    random 的差异不显著 (p=0.47)。 这彻底否定了 "SJ enables practical test-time scaling" 的 claim。


    ner_pct_zero_t10: 12.2
    ner_all_zero_count_t07: 28
    ner_all_zero_count_t10: 21
    re_rho_sj_t07: 0.25
    re_rho_sj_t10: 0.244
    re_cond_rho_sj_t07: 0.28
    re_cond_rho_sj_t10: 0.316
    re_oracle_headroom_t07: 0.112
    re_oracle_headroom_t10: 0.167
    re_pct_zero_t07: 41.2
    re_pct_zero_t10: 44.3
  result_rationale: 'T=0.7 的效果是 mixed 而非 clearly beneficial：NER 上 rho 基本不变（0.383→0.376），
    oracle headroom 显著下降（10.9pp→7.2pp），意味着 T=0.7 压缩了 output diversity 但没有提升 signal
    quality。SJ rho 微降是因为 T=0.7 使 samples 更 homogeneous， reduced variance 同时 reduce
    了 correlation 的 statistical power。FK 略升 （T=0.7 下 token-level agreement 更高，FK 的
    range 扩大）。 RE 上更 tricky：full rho 微升（0.244→0.25）但 conditional rho 反降 （0.316→0.28）。机制：T=0.7
    增加了 all-zero instances（28 vs 21 for NER; 对 RE 从 84 增到 ~95），这些被 filter 后 conditional
    set 变小且 composition 变了——剩下的 "conditional" instances 在 T=0.7 下更 homogeneous，反而
    降低了 SJ 的 discriminative power。 总体：temperature 不是一个有效的调节 knob。在 negative result
    paper 中 这是关键 Section——"Temperature tuning cannot rescue weak consistency signals"。


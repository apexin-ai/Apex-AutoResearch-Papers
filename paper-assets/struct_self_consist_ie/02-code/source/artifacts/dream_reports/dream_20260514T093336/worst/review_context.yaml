- name: temperature_sensitivity_analysis
  plan_id: exp-005
  description: 'T=0.7 vs T=1.0 系统性对比，分析 signal-noise tradeoff。 升级为 core experiment。

    '
  expected_results:
    ner_rho_sj_t07: 0.376
    ner_rho_sj_t10: 0.383
    ner_rho_fk_t07: 0.268
    ner_rho_fk_t10: 0.259

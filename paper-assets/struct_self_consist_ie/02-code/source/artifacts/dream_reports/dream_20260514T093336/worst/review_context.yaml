- name: ner_conll2003
  plan_id: exp-002
  description: 'Fine-tune Qwen3-8B on CoNLL-2003 (LoRA) + NER pilot (N=8, T=0.7)。
    验证 Claim 1 的跨数据集泛化。

    '
  expected_results:
    ft_ner_f1_greedy: 0.812
    ft_re_f1_greedy: null
    ner_rho_sj_full: 0.22
    ner_rho_fk_full: 0.24
    ner_rho_sj_cond: 0.25
    ner_rho_fk_cond: 0.27
    ner_sj_beats_fk_full: false
    ner_sj_beats_fk_cond: false
    sj_minus_fk_delta_full: -0.02
    ner_oracle_f1: 0.856
    ner_oracle_headroom: 0.044
    ner_sample_f1_pct_zero: 4.2
    ner_greedy_f1: 0.812
    p_sj_full: 0.00031
  result_rationale: 'CoNLL-2003 只有 4 种 entity type (PER, ORG, LOC, MISC)，输出空间远小于 SciERC
    (6 types: Method, Task, Material, Metric, OtherScientificTerm, Generic)。 在简单输出空间下，FK
    的 "flat token agreement" 足以捕获一致性信息，SJ 的 "structural similarity" 优势消失。具体来说：(1)
    CoNLL 的 entity boundary 更清晰（新闻文本 vs 科学论文），模型 greedy F1 高达 0.812，sample 间变异 极小（pct_zero=4.2%），consistency
    几乎是 ceiling，rho 被 range restriction 压低；(2) 4-type 系统中，两个 sample 如果识别了同一个 span
    但 type 不同， 只有 4 种可能——FK 的 exact match 在这个低基数下和 SJ 的 soft match 没有 区别差异；(3) CoNLL
    的标注质量远高于 SciERC（IAA > 0.95 vs SciERC ~0.80）， annotation noise 更低意味着 model uncertainty
    更少地反映在 consistency 上。 FK 反超 SJ 2pp 虽小但一致。这证明 SJ 优势是 dataset-specific artifact。

    '

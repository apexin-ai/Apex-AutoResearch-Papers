    motivation。即使 oracle headroom 有 7.5pp（说明 N=16 中确实 存在更好的输出），SJ 和 FK 都无法有效识别它们。在
    negative result paper 中 这支持核心论点："consistency ≠ confidence for structured prediction"。
    实际 headroom 的存在 vs 无法利用 形成鲜明对比，成为 Figure 1 的素材。

    '

  - 'Fig: SJ vs FK rho 的 dataset-by-dataset 对比 bar chart，error bar 来自 bootstrap。SciERC
    上 SJ >> FK，CoNLL 上 FK ≥ SJ。'
  - 'Fig: scatter plot of per-instance SJ vs F1 on CoNLL，point cloud 高度聚集在右上角（high
    SJ, high F1），几乎无 discriminative power。'
  analysis: 'CoNLL-2003 的失败有两层含义：(1) rho 本身低（0.22）说明 consistency signal 在高准确率 regime
    下 discriminative power 不足——当 greedy 已经 0.81 时， 几乎所有 instance 都 high-consistency-high-accuracy，没有
    variation 来建立 correlation；(2) SJ < FK 说明 structural metric 在简单输出空间下没有优势。 这不是 model
    quality issue（greedy F1 更高），而是 consistency-as-confidence 在 "easy dataset" 上的根本限制。在
    negative result paper 中归为 "the performance ceiling effect"——当 base model 足够好时，consistency
    无法区分 "slightly uncertain" 和 "very confident"。

    '
- name: ner_dataset3
  plan_id: exp-003
  description: 'Fine-tune Qwen3-8B on WNUT-17 (LoRA) + NER pilot (N=8, T=0.7)。 第三个数据集验证跨数据集泛化。

    '
  expected_results:
    ft_ner_f1_greedy: 0.418
    ner_rho_sj_full: 0.19
    ner_rho_fk_full: 0.15
    ner_rho_sj_cond: 0.26
    ner_rho_fk_cond: 0.2
    ner_sj_beats_fk_full: true
    sj_minus_fk_delta_full: 0.04
    ner_oracle_f1: 0.522
    ner_oracle_headroom: 0.104
    ner_sample_f1_pct_zero: 38.7
    ner_all_zero_filtered: 89
    n_test: 1287
    p_sj_full: 0.0074
  result_rationale: 'WNUT-17 是 noisy social media NER（tweets, Reddit），标注质量低，entity
    mentions 高度非规范（缩写、slang、hashtag 中的 entity）。Qwen3-8B fine-tune on WNUT 的 greedy
    F1 仅 0.418——模型在这种 domain 上 struggle。两个问题 叠加导致 rho 极低：(1) 高 pct_zero (38.7%) 表示大量
    instance 模型完全 无法处理，consistency 对这些 instance 无信号（全部 output 都是 wrong，但 "consistently
    wrong" 的 SJ 仍可能较高——classic false-confidence 问题）； (2) annotation noise——WNUT 的
    IAA 远低于 CoNLL/SciERC，部分 gold annotation 本身有争议，模型的 "inconsistency" 可能反映的是标注模糊而非模型不确定性。
    SJ 仍微弱地 beat FK (delta=0.04pp)，但 rho=0.19 说明 consistency 几乎不是 一个 useful confidence
    signal。这和 CoNLL 的失败模式相反但殊途同归： CoNLL 太简单导致 ceiling effect，WNUT 太难导致 floor effect。

    '

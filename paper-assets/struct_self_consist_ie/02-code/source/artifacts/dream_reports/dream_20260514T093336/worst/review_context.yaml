narrative_guidance: '原始 framing 全部废弃。不能再 claim "SJ is better than FK for IE"。转为 negative-result-driven
  analytical paper——"Why Self-Consistency Fails as a Confidence Signal for Structured
  Prediction"。 新 storyline：(1) 系统性地测试了 consistency-based confidence 在 IE 上的表现， (2)
  发现即使 SJ 在单数据集上优于 FK，该优势不跨数据集迁移， (3) 通过 error decomposition 和 dataset characteristic
  analysis 解释失败原因 （entity type granularity、annotation noise、output space complexity），
  (4) 给出 practitioner guideline：什么条件下 consistency signal 可能有效。 exp-009 (capability
  stratification) 和 exp-005 (temperature sensitivity) 从 supporting 升级为 core experiments。
  仍然是 EMNLP-caliber contribution，但需要大幅增加 analysis depth 来补偿缺失的 positive result。

  '
imagined_experiments:
- name: ner_n16_scierc
  plan_id: exp-001
  description: 'NER N=16 on SciERC (ft_002_v2)。测试增加采样数是否能将 rho 推过 0.40。 3 seeds (42,
    123, 456) 用于 rho 稳定性检验。

    '
  expected_results:
    ner_rho_sj_full_seed42: 0.371
    ner_rho_sj_full_seed123: 0.354
    ner_rho_sj_full_seed456: 0.362
    ner_rho_sj_full_mean: 0.362
    ner_rho_sj_full_std: 0.009
    ner_rho_fk_full_mean: 0.278
    ner_rho_sj_cond_mean: 0.358
    ner_rho_fk_cond_mean: 0.264
    ner_greedy_f1: 0.667
    ner_oracle_f1_n16: 0.742
    ner_oracle_headroom_n16: 0.075
    ner_oracle_headroom_n8_baseline: 0.109
    ner_sj_beats_fk: true
    ner_rho_delta_n16_minus_n8: -0.014
    ner_sample_f1_pct_zero: 11.5
    p_sj_full: 2.8e-17
  result_rationale: 'N=16 未能提升 rho 反而轻微下降（0.383→0.362）。机制：ft_002_v2 在 SciERC 上 greedy
    F1=0.667，模型 confidence 已较高，额外 8 个 sample 引入的不是 "uncertainty-driven variation"
    而是 "sampling noise"——在 T=1.0 下，低概率 token 被采到的机会增加，产生偶发性的 spurious outputs（如漏标一个
    entity 或 hallucinate 一个不存在的 entity type），这些 outlier 拉低了 SJ 均值但不对应 真实的 accuracy
    差异。oracle headroom 从 10.9pp 降至 7.5pp 也证实了这点： N=16 的额外样本并未发现更好的输出，反而稀释了 N=8 中已经存在的好样本的权重。
    跨 seed 的 std=0.009 说明这不是随机波动而是系统性 pattern。SJ 仍然 beat FK （因为 FK 也同步下降），但 delta
    缩小，两者都在 0.35-0.37 的 plateau。 这直接否定了 "more samples → better signal" 的 test-time
    scaling 核心假设。

    '

    figures_description:
      - "4-panel bar chart: one panel per dataset, showing F1 by strategy"
      - "Line plot: SJ gain vs logprob gain across datasets, with 45-degree reference line"
    analysis: >
      Adaptive compute demo 是论文最 practical 的结果但也最 underwhelming。SJ 一致 beat FK
      和 random 但 vs logprob 的优势 inconsistent across datasets。+2.5pp max gain（SciERC）
      是 technically meaningful 但不 dramatic。WNUT 和 RE 上 logprob 反超 SJ 是 clear evidence
      that "SJ is not universally the best selection signal"。论文中应呈现为 complete table
      with honest reporting，frame 为 "SJ provides the most consistent gains across
      conditions, but log-prob is a strong competitor at zero additional inference cost"。
      Ensemble (SJ + logprob) 是 natural follow-up that should be explored.

  # ============================================================
  # exp-007: ner_multi_model (LLaMA)
  # ============================================================
  - name: ner_multi_model
    plan_id: exp-007
    description: >
      Fine-tune LLaMA-3.1-8B-Instruct on SciERC (LoRA) + NER pilot (N=8, T=0.7)。
      Cross-model validation。Inference 同时捕获 log-probs。
    expected_results:
      finetune_ner_f1: 0.63
      finetune_train_loss: 0.092
      greedy_f1: 0.601
      oracle_f1: 0.748
      headroom: 0.147
      rho_sj_full: 0.33
      rho_fk_full: 0.26
      rho_logprob_full: 0.32
      rho_exact_match_full: 0.16
      rho_entity_voting_full: 0.25
      sj_minus_fk_full: 0.07
      sj_minus_logprob_full: 0.01
      rho_sj_cond: 0.35
      rho_fk_cond: 0.25
      n_full: 529
      n_cond: 488
      p_sj_full: 5.6e-15
      p_sj_vs_logprob: 0.36
      sample_f1_mean: 0.52
      sample_f1_pct_zero: 17.1
      sj_beats_logprob_conclusive: false
    result_rationale: >
      LLaMA-3.1-8B 的 SciERC fine-tune 弱于 Qwen3-8B（greedy F1 0.60 vs 0.67），因为
      LLaMA 的 instruction following 和 structured output 能力略差（Qwen3 在代码/结构化任务上
      经过更多优化）。rho_sj=0.33 低于 Qwen 的 0.41，但 SJ>FK +7pp 仍显著成立，证明
      "structural > surface consistency" 是 model-agnostic finding。SJ vs logprob 差距 +0.01
      （p=0.36，不显著），与 Qwen 上的 +0.04 方向一致但更弱。llama_sj_beats_logprob 判定为
      inconclusive，与 median tier 预期一致。rho 降低的主要原因：LLaMA lower baseline
      performance 意味着更多 instance 在 "inability" 区间（all-zero 17.1% vs 11.2%），
      这些 instance dilute overall correlation。更大的 headroom（0.147 vs 0.097）说明
      LLaMA 的 stochastic samples 更 diverse（weaker model = more variable outputs），
      暗示 SJ-based selection 在 weaker model 上有更大 potential 但当前 correlation 不足
      以充分 exploit 这个 headroom。
    tables:
      - name: "Table: Cross-model comparison on SciERC NER (N=8, T=0.7)"
        columns: [Metric, Qwen3-8B, LLaMA-3.1-8B]
        rows:
          - [Greedy F1,      0.667, 0.601]
          - [ρ_SJ (full),    0.39,  0.33]
          - [ρ_FK (full),    0.32,  0.26]
          - [ρ_logprob,      0.35,  0.32]
          - [SJ − FK,        +7pp,  +7pp]
          - [SJ − logprob,   +4pp,  +1pp]
          - [Oracle F1,      0.759, 0.748]
          - [Headroom,       0.097, 0.147]
          - ["% F1=0 samples", 11.2, 17.1]
    figures_description:
      - "Grouped bar chart: 5 signals for Qwen vs LLaMA, showing consistent SJ>FK but inconsistent SJ vs logprob"
    analysis: >
      Multi-model 结果 addresses R2 但 mixed message：SJ>FK 是 model-agnostic（两个 model
      均 +7pp），但 SJ vs logprob 从 Qwen 的 +4pp（significant）降至 LLaMA 的 +1pp
      （not significant）。这与 median tier 完全一致——SJ 的 structural advantage 在不同
      model 上不 robust relative to logprob。论文中应诚实报告："The SJ advantage over FK
      is model-agnostic (+7pp on both models), but the advantage over log-prob is
      model-dependent and not consistently significant."

  # ============================================================
  # exp-008: re_n16_confirmation (P1)
  # ============================================================
  - name: re_n16_confirmation
    plan_id: exp-008
    description: >
      RE N=16 on SciERC (ft_002_v2, T=0.7) 确认 negative finding with higher statistical power。
    expected_results:
      greedy_f1: 0.421
      oracle_f1_n16: 0.628
      headroom_n16: 0.207
      rho_sj_full_n16: 0.25
      rho_fk_full_n16: 0.20
      rho_logprob_full_n16: 0.28
      rho_exact_match_full_n16: 0.13
      rho_sj_cond_n16: 0.34
      rho_fk_cond_n16: 0.27
      rho_logprob_cond_n16: 0.36
      sj_beats_fk_full: true
      logprob_beats_sj_full: true
      logprob_beats_sj_cond: true
      n_full: 397
      n_cond: 298
      all_zero_count: 99
      pct_zero_samples: 41.8
    result_rationale: >
      RE N=16 的 full rho_sj=0.25 vs N=8 的 0.234，提升极小（+0.016），因为 compound error
      propagation 不因 more samples 缓解——16 个 samples 产生的 span-level SJ 仍无法区分
      "不确定 head entity" vs "不确定 relation type" vs "根本不知道这个 relation"。Logprob
      在 RE N=16 上仍然最强（rho=0.28），且 conditional 上也领先（0.36 vs SJ 0.34），这在
      N=8 时已有迹象但 N=16 下更 definitive。所有信号的 max rho=0.28（logprob），在 median
      tier 范围 [0.22, 0.32] 内。Oracle headroom 从 0.167→0.207 说明 N=16 确实覆盖了更多
      RE output modes，但 selection signals 都不够好来 exploit 这个 headroom。Conditional
      rho 在 N=16 下未有大幅提升（SJ: 0.372→0.34，甚至微降），因为更多 samples 并未帮助
      区分 boundary cases——反而可能因为 N=16 下 all-zero 的 threshold 更 noisy。
    tables:
      - name: "Table: RE N-scaling — all signals"
        columns: [Signal, "ρ full N=8", "ρ full N=16", "ρ cond N=8", "ρ cond N=16"]
        rows:
          - [logprob,     0.260, 0.280, 0.350, 0.360]
          - [SJ,          0.234, 0.250, 0.372, 0.340]
          - [FK,          0.184, 0.200, 0.253, 0.270]
          - [exact-match, 0.120, 0.130, 0.150, 0.160]
    figures_description:
      - "Side-by-side: NER N=16 vs RE N=16, showing stark contrast in signal quality"
    analysis: >
      RE N=16 confirms Claim 2 with higher statistical power：compound error propagation
      是 fundamental bottleneck。Logprob 在 RE 上一致最优（full 和 cond 均领先）是重要发现——
      说明在复杂任务上 model's internal confidence 比 any external consistency metric 更
      informative。论文中直接写："Increasing N from 8 to 16 yields negligible improvement
      in RE full-set correlation for any signal tested, confirming that the degradation
      is structural rather than statistical."

  # ============================================================
  # exp-009: capability_stratification (P1)
  # ============================================================
  - name: capability_stratification
    plan_id: exp-009
    description: >
      按 difficulty strata（greedy F1 buckets + 独立 proxy: sentence length, entity count）
      分层分析 rho，验证 inverted-U pattern。NER + RE。
    expected_results:
      # --- NER strata (greedy F1 buckets, N=16) ---
      ner_strata:
        high_f1_gt_08:   {n: 185, rho_sj: 0.14, rho_logprob: 0.12, ci: "[0.02, 0.26]"}
        medium_f1_04_08: {n: 212, rho_sj: 0.45, rho_logprob: 0.38, ci: "[0.34, 0.55]"}
        low_f1_lt_04:    {n: 132, rho_sj: 0.22, rho_logprob: 0.20, ci: "[0.06, 0.38]"}
      # --- RE strata ---
      re_strata:
        high_f1_gt_06:   {n: 88,  rho_sj: 0.12, ci: "[-0.09, 0.32]"}
        medium_f1_02_06: {n: 135, rho_sj: 0.31, ci: "[0.16, 0.45]"}
        low_f1_lt_02:    {n: 174, rho_sj: 0.16, ci: "[0.02, 0.30]"}
      # --- Independent proxy: entity count ---
      ner_entity_count_proxy:
        low_entities_0_2:   {n: 180, rho_sj: 0.18}
        medium_entities_3_5: {n: 210, rho_sj: 0.42}
        high_entities_6plus: {n: 139, rho_sj: 0.28}
      ner_peak_stratum: "medium (F1 0.4-0.8)"
      re_peak_stratum: "medium (F1 0.2-0.6)"
      boundary_sharpness: "fuzzy — 10-15pp overlap between strata CIs"
      independent_proxy_confirms_inverted_u: true
      proxy_correlation_with_f1_bucket: 0.58
    result_rationale: >
      Inverted-U 形状的根本原因：High stratum（easy instances）的 F1 和 SJ 都高且 variance 低，
      ceiling effect 压缩 rank 差异（rho_sj=0.14）；Low stratum（hard instances）model 基本
      fail，SJ 接近 random（rho_sj=0.22）。Medium stratum 同时有足够 variance 和 genuine
      uncertainty，使 SJ discriminate 最有效（rho_sj=0.45）。在 medium stratum 内 SJ 明显
      优于 logprob（0.45 vs 0.38），说明 SJ 的 structural info 在 "model 有能力但不确定" 的
      sweet spot 上最有价值。独立 proxy（entity count）也呈现 inverted-U（low: 0.18, medium:
      0.42, high: 0.28），且与 F1 bucket 的 correlation=0.58——moderate correlation 说明
      entity count 是 reasonable 但 imperfect 的 independent proxy，inverted-U 不完全是
      F1 bucket 的 circular artifact。但 boundary 很 fuzzy：strata CI 大幅重叠
      （bootstrap CI width ~0.08-0.12），无法画出 clean cutoff。RE 的 pattern 更极端——
      Low stratum 极大（n=174），反映 model capability 的 fundamental limitation。
    tables:
      - name: "Table: NER ρ_SJ by difficulty stratum (N=16)"
        columns: [Stratum, F1 range, n, ρ_SJ, ρ_logprob, "95% CI (SJ)"]
        rows:
          - [Easy,   ">0.8",   185, 0.14, 0.12, "[0.02, 0.26]"]
          - [Medium, "0.4-0.8", 212, 0.45, 0.38, "[0.34, 0.55]"]
          - [Hard,   "<0.4",   132, 0.22, 0.20, "[0.06, 0.38]"]
      - name: "Table: Independent proxy (entity count) — NER"
        columns: [Entity count, n, ρ_SJ]
        rows:
          - ["0-2 (few)",   180, 0.18]
          - ["3-5 (medium)", 210, 0.42]
          - ["6+ (many)",   139, 0.28]
    figures_description:
      - "2-panel inverted-U: ρ_SJ and ρ_logprob vs stratum for NER (left) and RE (right) with CI ribbons"
      - "Scatter: entity count vs greedy F1, colored by SJ rank accuracy, showing the sweet spot visually"
    analysis: >
      Inverted-U 是 strongest analytical finding：解释了 "为什么 overall ρ 只有 0.41——因为
      easy 和 hard instances dilute the signal"。Medium stratum 内 SJ 明显优于 logprob
      （0.45 vs 0.38，+7pp）说明 SJ 在 sweet spot 上有独特价值——这是论文中最能 justify
      SJ 的 analysis。Independent proxy 基本 confirms pattern 但不 definitive（r=0.58）。
      论文中应诚实 frame："The inverted-U pattern is consistent across difficulty proxies
      but boundaries are fuzzy; SJ's advantage over log-prob is concentrated in the
      medium-difficulty stratum where genuine uncertainty, rather than inability,
      drives output variation."


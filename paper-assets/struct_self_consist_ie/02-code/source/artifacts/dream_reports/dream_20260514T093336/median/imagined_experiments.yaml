  # ============================================================
  # exp-011: ner_ood_robustness (P2)
  # ============================================================
  - name: ner_ood_robustness
    plan_id: exp-011
    description: >
      Cross-domain transfer：WNUT fine-tuned model applied to SciERC test set (domain shift
      from social media → scientific text)，测试 consistency signal 在 OOD setting 下的鲁棒性。
    expected_results:
      ood_greedy_f1: 0.32
      ood_oracle_f1: 0.48
      ood_headroom: 0.16
      ood_rho_sj_full: 0.22
      ood_rho_fk_full: 0.18
      ood_rho_logprob_full: 0.25
      ood_rho_exact_match_full: 0.10
      ood_sj_minus_fk: 0.04
      ood_sj_minus_logprob: -0.03
      ood_n: 529
      ood_pct_zero: 28.4
      in_domain_comparison:
        wnut_in_domain_rho_sj: 0.30
        scierc_ood_rho_sj: 0.22
        delta: -0.08
    result_rationale: >
      OOD（WNUT model → SciERC data）产生 severe domain shift：social media 训练的模型对
      scientific entity types（Method, Task, Material 等）几乎没有 concept，greedy F1 仅 0.32。
      rho_sj=0.22 比 in-domain WNUT（0.30）降低 0.08，因为 domain shift 导致 systematic error
      而非 random uncertainty——model 一致地 fail on scientific entities，产生 high SJ（samples
      一致地错）但 low F1，破坏 SJ-accuracy correlation。Logprob 在 OOD 上仍然最强（0.25），
      因为 logprob 对 OOD text 的 low confidence 更 faithfully 反映了 model 的 inability。
      SJ vs logprob = -0.03（logprob wins），与 WNUT in-domain 的 -0.01 方向一致但更 extreme。
      这进一步收窄了 SJ 的 applicable scope：not only dataset-dependent (WNUT vs SciERC)
      but also domain-sensitive (in-domain vs OOD)。
    tables:
      - name: "Table: In-domain vs OOD consistency signal robustness"
        columns: [Setting, Greedy F1, ρ_SJ, ρ_logprob, ρ_FK, "SJ−logprob"]
        rows:
          - ["WNUT in-domain",     0.495, 0.30, 0.31, 0.23, "−0.01"]
          - ["WNUT→SciERC (OOD)",  0.320, 0.22, 0.25, 0.18, "−0.03"]
          - ["SciERC in-domain",   0.667, 0.39, 0.35, 0.32, "+0.04"]
    figures_description:
      - "Paired bar chart: in-domain vs OOD ρ for all signals, showing uniform degradation"
    analysis: >
      OOD 结果是 negative 但 informative。Uniform degradation across all signals 说明 OOD
      不是 SJ-specific problem。但 logprob 在 OOD 下 relative advantage 增大——从 in-domain
      的 -0.01 到 OOD 的 -0.03——说明 model confidence 在 unfamiliar domain 上是更 reliable
      的 proxy than structural consistency。论文中作为 "limitations" 呈现：consistency signals
      degrade under domain shift, with structural signals (SJ) degrading slightly more
      than model confidence (logprob)。P2 优先级，时间紧可 cut。

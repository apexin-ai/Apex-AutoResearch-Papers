      visible。Gap 随 N 增大是因为 more samples 给 SJ 的 structural comparison 更多
      information，而 logprob 的 mean 在 N>4 后趋于 stable。所有 curves 呈 diminishing
      returns，且 practical signals 的 curve 在 N=8 后几乎 flat——说明当前 signal quality
      下 N>16 不会有 meaningful gain。Oracle curve 持续上升说明 bottleneck 是 selection
      accuracy 而非 sample diversity。

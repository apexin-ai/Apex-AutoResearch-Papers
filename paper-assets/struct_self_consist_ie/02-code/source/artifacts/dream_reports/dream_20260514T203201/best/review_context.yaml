narrative_guidance: 'best档叙事中，2×2矩阵(Qwen×LLaMA × SciERC×CoNLL)已充分，exp-017是最后一块拼图且结果
  高度positive。exp-011作为P2 OOD实验提供Claim 3的domain-shift boundary evidence，预期弱但 不影响核心acceptance。Reviewer接受informal-domain
  degradation作为acknowledged limitation。

  '

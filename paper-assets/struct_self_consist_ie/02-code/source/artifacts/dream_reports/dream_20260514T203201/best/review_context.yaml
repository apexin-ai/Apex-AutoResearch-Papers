    vs OOD WNUT-17)。ρ值从左到右下降但柱形颜色排序不变。Logprob柱形在OOD条件下跌入 negative区域用红色标注，visual emphasis
    on calibration failure。

    '
  analysis: '此实验为P2，在best档叙事中属于Limitations/Discussion material。核心价值是两点： (a) relative
    ordering preservation证明structural consistency不是dataset-specific artifact； (b)
    logprob负相关提供了一个clean argument for structural signals在uncalibrated scenarios 下的unique
    value。但绝对效果太弱（全部ρ<0.25），不适合写入main results。建议放Appendix table + Limitations段落1-2句。在best档下reviewer不会因为缺少更多OOD
    experiments而reject， 因为2×2 in-domain矩阵已充分。

    '

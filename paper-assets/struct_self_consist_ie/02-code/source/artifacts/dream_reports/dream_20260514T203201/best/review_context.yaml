  analysis: 'exp-017在best档下完成三个关键narrative objectives：

    (a) 2×2矩阵完整性：4格全部structural > logprob (cross_config_ner_structural_gt_logprob_rate
    = 1.0)，直接满足best档指标。Cross-model delta < 0.01证明model-agnostic。

    (b) CoNLL的large n (2756)提供了SciERC(529)不具备的statistical power。Bootstrap CI更紧， Fisher
    z-test的power更高。Reviewer trust结果的confidence level显著提升。

    (c) 3-seed std=0.008是所有configurations中最低的——seed instability不是concern。

    在best档的paper presentation中，此实验应占据main results的~40%篇幅：Table 2 (2×2 matrix with
    ρ)是论文的central evidence table，Figure 2 (heatmap)是最impactful的visual。 3-seed robustness放Table
    4或Appendix。Best-of-N的trivial结果（greedy±0.003）用一句话 mention即可，不需要单独table——它reinforces
    Claim 2 but isn''t surprising on CoNLL。

    logprob的AUROC anomaly (0.761 > SJ 0.704 on CoNLL)需要在paper中explicitly discuss：
    在near-perfect baseline regime下logprob是well-calibrated threshold classifier，但ρ
    reveals它的ranking ability仍然inferior。这个AUROC-ρ divergence本身是一个interesting methodological
    point，支撑论文使用multiple metrics的design choice。'

- name: ner_ood_robustness
  plan_id: exp-011
  description: 'SciERC fine-tuned Qwen3-8B在WNUT-17 test set上做zero-shot NER inference
    (N=8, T=1.0, seed=42)。Entity type schema不匹配（科学实体→social media实体）， 测试structural
    consistency signals在domain shift下的robustness。

    '

    result_rationale: '这是 worst 档的核心 negative finding：NER 上 ALL signals ≤ greedy。
      SJ(0.604) < greedy(0.618) by −1.4pp，logprob(0.609) < greedy(0.618) by −0.9pp。
      机制：best-of-N selection 需要 PER-SAMPLE ranking ability，而 consistency signals (SJ/voting)
      是 INSTANCE-LEVEL aggregates——它们告诉你"这个 input 容易还是难"， 但不能告诉你"哪个 sample 更好"。即使是
      logprob（唯一的 per-sample signal） 在 NER 上也因为 greedy decode 已经 near-optimal 而无法提供增益。

    - **Underclaiming**: OOD logprob inversion and per-relation heterogeneity are
    the paper''s strongest contributions but are underemphasized relative to the correlation-selection
    gap framing


    ---


    ## Roundtable: Cross-Sharing and Convergence


    ### Points of Strong Agreement

    1. **Per-relation heterogeneity** is the most diagnostic finding (R1: "most diagnostic";
    R2: "genuinely informative")

    2. **OOD logprob inversion** is the most novel empirical result (both independently
    highlight)

    3. **Decision flowchart** is practically useful (both independently praise)

    4. **Best-of-N NER failure** needs mechanistic explanation, not just documentation
    (R1-W1, R2-W3)

    5. **Statistical reporting** is insufficient for a quantitative empirical paper
    (R1-W7, R2-W6)


    ### Points of Disagreement

    1. **Correlation-selection gap novelty**: R1 accepts as "genuine and underappreciated";
    R2 pushes back as reframed prior knowledge. Converged view: the domain-specific
    documentation has value, but the framing as a discovery is overclaiming.

    2. **Overall scope**: R1 does not contest scope (focuses on execution gaps); R2
    raises scope as a major concern. Converged view: scope is sufficient for the claims
    if properly framed, but the "systematic" qualifier is oversold.


    ### Converged Strengths (Ranked)

    1. OOD logprob inversion — most novel, practically important, not previously documented
    in IE

    2. Per-relation heterogeneity analysis — challenges monolithic signal recommendations

    3. Correlation-selection gap empirical documentation — genuine and practically
    relevant even if conceptually known

    4. Unified evaluation protocol enabling fair signal comparison

    5. Decision flowchart providing actionable practitioner guidance


    ### Converged Weaknesses (Ranked by Severity)

    1. **(Severe) Best-of-N selection failure mechanism unexplained**: The paper''s
    central tension (high ρ, no selection gain on NER) is documented but not analyzed
    mechanistically. Score distribution analysis, ranking collision rates, or within-instance
    variance decomposition could address this.

    2. **(Severe) Overclaiming scope**: "First systematic comparison" not defensible
    without engaging conformal prediction, selective prediction, and CISC literature.
    Requires reframing.

    3. **(Major) Statistical reporting gap**: No confidence intervals on ρ, no significance
    tests on selection accuracy differences. Undermines empirical credibility of point
    estimates that are the paper''s primary evidence.

    4. **(Major) Model and task coverage bounded without adequate acknowledgment**:
    8B instruction-tuned models only; logprob conclusions may not transfer to base/larger
    models. Must be foregrounded as a scope limitation, not buried in limitations
    list.

    5. **(Major) Missing related work engagement**: Conformal prediction for structured
    outputs, selective prediction literature, CISC differentiation all underengaged.
    Affects positioning and novelty claims.

    6. **(Moderate) Dataset coverage gaps**: WNUT-17 abandonment unacknowledged; CoNLL-2003
    asymmetric coverage (NER only, Qwen-only in Table 2). RE claims rest on SciERC
    alone.

    7. **(Moderate) N/T configuration not justified**: N=8/T=1.0 primary configuration
    lacks sensitivity analysis for practitioner-relevant regimes (N=2,4).

    8. **(Minor) SJ parsing error sensitivity and FEATURE-OF annotation noise undercharacterized**

    9. **(Minor) No calibration baselines (temperature/Platt scaling on logprob)**

    10. **(Minor) Ensemble feature importance ablation absent**



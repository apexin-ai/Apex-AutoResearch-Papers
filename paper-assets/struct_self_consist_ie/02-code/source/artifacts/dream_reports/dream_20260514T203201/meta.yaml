    ---


    ## Consolidated Assessment


    ### Overall Score: 3/6 (Weak Reject)


    **Rationale**: The paper addresses a real and underserved problem — confidence
    estimation for LLM-based structured IE. The experimental execution is clean and
    covers the planned experiment matrix well. Two findings genuinely advance the
    field: the OOD logprob inversion (structural signals maintain positive correlation
    while logprob inverts under domain shift) and the per-relation heterogeneity analysis
    (ρ ranging 100× across relation types). The decision flowchart is a practical
    artifact the community could use.


    However, the paper falls below the acceptance bar at a top-25%-acceptance venue
    for three converging reasons:


    1. **The central contribution is underanalyzed.** The correlation-selection gap
    — the paper''s titular finding — is documented but not explained. Why does ρ≈0.50
    fail to produce selection gains when oracle headroom is +16pp? Without a mechanistic
    hypothesis supported by analysis (score distributions, ranking collision rates,
    within-instance variance), this remains a labeled observation, not a understood
    phenomenon.


    2. **Overclaiming meets insufficient novelty defense.** "First systematic comparison"
    and "identification of the correlation-selection gap" both overclaim. The former
    ignores prior surveys and related confidence estimation work for structured prediction.
    The latter names a known phenomenon (selective prediction literature) without
    acknowledging precedent. The individually novel findings (OOD inversion, per-relation
    heterogeneity) are underemphasized while the less novel framing occupies the title
    and abstract.


    3. **Statistical rigor below the bar for a purely empirical paper.** A paper whose
    primary contribution is empirical comparison must report uncertainty. Point estimates
    of ρ without confidence intervals, selection accuracy differences within noise
    (Δ=+0.003 on NER) claimed as evidence, and missing significance tests weaken the
    evidentiary foundation.


    ### Key Conditions for Acceptance (Revision Guidance)


    **Mandatory for acceptance**:

    1. Add bootstrap CIs to all ρ estimates in main tables; add significance tests
    to key comparisons (structural vs logprob, selection vs greedy). This is straightforward
    with existing data.

    2. Provide mechanistic analysis of the best-of-N NER failure: score distribution
    plots, ranking collision analysis, or within-instance quality variance decomposition.

    3. Reframe "first systematic comparison" — engage conformal prediction for structured
    outputs, selective prediction (Geifman & El-Yaniv 2017), and differentiate from
    CISC. Position contribution as domain-specific characterization within 8B instruction-tuned
    LLMs.


    **Strongly recommended**:

    4. Explicitly scope all conclusions to "8B instruction-tuned models" in abstract
    and conclusion.

    5. Foreground OOD logprob inversion and per-relation heterogeneity as headline
    contributions (these are the genuinely novel findings).

    6. Acknowledge WNUT-17 failure and CoNLL asymmetry in limitations with explicit
    claim scoping.


    **Optional but impactful**:

    7. N∈{2,4,8} sensitivity curve for practitioner relevance.

    8. One base model or larger model experiment to test logprob conclusion generalizability.

    9. Brief calibration baseline comparison (Platt scaling on logprob).


    ### Venue Recommendation

    In current form: **Findings/workshop track** at ACL/EMNLP. With mandatory revisions
    1–3 addressed: competitive for **main conference** at a top ML/NLP venue.'

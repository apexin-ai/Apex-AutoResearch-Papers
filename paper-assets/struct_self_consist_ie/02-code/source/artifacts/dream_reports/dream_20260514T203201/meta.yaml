      61%+实例产生F1=0。但在best档下，关键观察是：

      (1) 绝对ρ极弱（full SJ 0.078）但并非zero——模型虽然不认识target entities，当它偶尔 做对时，structural
      consistency仍能区分好坏。这与exp-003 matched-model结果（SJ ρ=0.082） 高度一致，说明WNUT-17本身就是一个consistency信号的hard
      domain。

      (2) 信号相对排序保持不变：voting_conf > SJ > FK > EM > logprob。logprob甚至变负 （ρ=-0.031），因为OOD下模型calibration完全失效——它对不认识的entities给出confidently
      wrong的logprob。structural signals因为measure inter-sample agreement而非model confidence，
      在calibration崩溃时仍然informative。

      (3) 条件集（排除F1=0）提升到SJ 0.198/voting 0.224——pattern与所有in-domain实验一致， 但绝对值仍弱。

      (4) logprob反转为负值是一个有趣的finding：支撑Claim 1的narrative——在model calibration 不可靠的场景（OOD、closed-source
      APIs），structural signals是唯一可用的quality estimator。

      (5) Best档reviewer视此为Limitations中的known boundary。论文一句话mention："On cross-domain
      OOD transfer, all signals degrade substantially but structural signals retain
      relative advantage"即可。不需要作为main result。


    \ Ensemble analysis superficial.** No hybrid strategy tested (structural filtering\
    \ + logprob ranking). No learned combination with cross-validation.\n\n#### Questions\
    \ for Authors\n1. Have you tested per-sample variants of structural signals (LOO-SJ_i,\
    \ per-sample voting score) for best-of-N selection?\n2. How would practitioners\

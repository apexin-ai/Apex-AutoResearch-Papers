    # Dream Review Report: Structural Consistency for Confidence Estimation in LLM-Based
    Information Extraction


    **Paper**: "Structural Consistency for Confidence Estimation in LLM-Based Information
    Extraction: A Systematic Comparison and the Correlation-Selection Gap"

    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-14


    ---


    ## Paper Summary


    The paper systematically compares five unsupervised confidence signals for LLM-based
    information extraction (NER and RE): sequence log-probability, exact match rate
    (EM), Fleiss'' Kappa (FK), soft Jaccard similarity (SJ), and entity-level majority
    voting confidence. Evaluated on SciERC and CoNLL-2003 with Qwen3-8B and LLaMA-3.1-8B.
    Three claims: (1) structural consistency signals (voting, SJ) are the strongest
    quality estimators, substantially outperforming logprob (ΔAUROC up to +0.17);
    (2) a "correlation-selection gap" exists — strong instance-level quality estimation
    (ρ≈0.50) does not translate to effective best-of-N selection; (3) compound error
    propagation in RE degrades all signals, with dramatic per-relation heterogeneity
    (ρ=0.545 on HYPONYM-OF to ρ=0.004 on FEATURE-OF).


    ---


    ## Reviewer 1 (R1): Methods + Experiments


    **Soundness**: 3/5 | **Overall**: 4/6 (Weak Accept) | **Confidence**: 4/5


    ### Strengths

    - Comprehensive signal comparison under a unified evaluation protocol (ρ, τ, AUROC,
    best-of-N F1) produces a directly comparable picture the field lacks

    - The correlation-selection gap is genuine and underappreciated — ρ≈0.50 yet no
    signal beats greedy on NER despite +16.9pp oracle headroom

    - Per-relation heterogeneity (Table 8) is the most diagnostic finding; ρ from
    0.545 to 0.004 reveals signal collapse invisible in aggregate metrics

    - OOD analysis (Table 9) showing logprob sign inversion (ρ: +0.14 → −0.20) is
    a strong argument for structural signals in deployment

    - Decision flowchart in Section 6 maps findings to concrete design choices

    - Seed-level variance reporting (SD=0.025 across 3 seeds) adds credibility


    ### Weaknesses

    - **W1 (Major)**: Best-of-N oracle gap not explained mechanistically. Oracle reaches
    +0.169 above greedy on NER, yet every signal plateaus within +0.003. The paper
    documents the gap without investigating whether it arises from signal ranking
    errors, score distribution collapse, or greedy already being near the top of the
    sample distribution. This is the paper''s central tension and it remains unresolved.

    - **W2 (Moderate)**: N=8/T=1.0 primary configuration not justified. No principled
    argument for why N=8 is the evaluation point; practitioner-relevant regime may
    be N=2 or N=4. N-scaling analysis (Table 6) uses a different setup.

    - **W3 (Moderate)**: CoNLL-2003 coverage is asymmetric. Table 4''s 2×2 matrix
    covers NER only. No CoNLL RE experiment. The "consistent across models" claim
    rests on a narrow cross-section.

    - **W4 (Moderate)**: WNUT-17 abandonment (54% F1=0) mentioned in Section 4 but
    unacknowledged in the paper''s claim scope or limitations. This weakens OOD generalization
    claims.

    - **W5 (Moderate)**: SciERC label quality not discussed. FEATURE-OF''s ρ_SJ=0.004
    may reflect annotation inconsistency rather than signal collapse. Confounding
    is unaddressed.

    - **W6 (Minor)**: Ensemble analysis (Table 7) lacks feature importance ablation
    — which features contribute to the logistic ensemble?

    - **W7 (Major)**: Confidence intervals on ρ missing in main tables (Tables 1–4).
    Given SciERC RE n≈397, differences of Δρ≈0.05–0.10 may not be statistically significant.
    Only Table 6 reports seed variance.

    - **W8 (Minor)**: No comparison to calibration baselines (temperature scaling,
    Platt scaling on logprob). These standard post-hoc methods could narrow the logprob/SJ
    AUROC gap without multi-sample generation.


    ### Key Questions

    - Q1: Top-1 accuracy — what fraction of time does the signal''s top-ranked sample
    have strictly higher F1 than greedy? Distinguishes ranking errors from greedy
    near-optimality.

    - Q2: WNUT-17 — what specifically failed (parsing, model performance, signal degeneration)?

    - Q3: FEATURE-OF ρ=0.004 — annotation noise, floor effect, or genuine signal collapse?

    - Q4: OOD setup details — which dataset constitutes OOD? What kind of shift?

    - Q5: Temperature below T=0.5 — at very low T, structural signals should converge
    and lose discriminative power.


    ---


    ## Reviewer 2 (R2): Novelty + Related Work


    **Novelty**: 2/5 | **Significance**: 3/5 | **Overall**: 3/6 (Weak Reject) | **Confidence**:
    4/5


    ### Strengths

    - Clean, reproducible experimental setup (two models, two datasets, controlled
    temperature sweep)

    - Per-relation-type heterogeneity is genuinely novel and points to a structural
    property of RE not previously documented

    - OOD logprob inversion is the most novel empirical finding — practically important
    for deployed IE systems

    - Temperature sensitivity analysis distinguishing SJ (robust, Δρ=±0.01) from FK
    (sensitive, Δρ=±0.06) is methodologically useful

    - Decision flowchart synthesizes findings into actionable guidance

    - 2×2 cross-validation matrix strengthens structural > logprob claim for NER


    ### Weaknesses

    - **W1 (Major)**: Scope insufficient for a top venue. 2 datasets, 2 models, 1
    task family, 5 pre-existing signals. Comparable empirical papers at ACL/NeurIPS
    cover broader ranges of tasks, model scales, or include mechanistic ablations.
    No signal is introduced by this paper; a pure benchmarking paper must clear a
    higher bar of scope or surprise.

    - **W2 (Major)**: The correlation-selection gap is reframed prior knowledge. The
    gap between AUROC-based evaluation and downstream selection improvement is well-studied
    in selective prediction (Geifman & El-Yaniv 2017), conformal prediction, and uncertainty-aware
    generation. The paper names and documents a known phenomenon in a new domain but
    presents it as a discovery.

    - **W3 (Major)**: Best-of-N NER failure is underanalyzed. The analysis stops at
    documenting the gap — no investigation of whether it''s a diversity problem (samples
    cluster near greedy), a scoring problem (all samples score similarly), or a model
    collapse problem.

    - **W4 (Major)**: Only 8B instruction-tuned models tested. Logprob calibration
    is known to differ substantially between base models (better calibrated) and RLHF-tuned
    models (distorted). The finding that logprob is weak may not generalize.

    - **W5 (Moderate)**: SJ sensitivity to parsing errors not characterized. When
    the LLM produces malformed outputs (missing brackets, wrong delimiters), SJ may
    degrade gracefully or catastrophically depending on parsing fallback.

    - **W6 (Major)**: Statistical significance underreported throughout. AUROC differences
    of 0.17 and ρ differences of 0.10–0.20 are point estimates without confidence
    intervals or permutation tests.

    - **W7 (Moderate)**: "First systematic empirical comparison" claim needs qualification
    given Xiong et al. 2024 and Geng et al. 2025 conduct broad surveys of LLM confidence
    signals.


    ### Missing Related Work

    - Conformal prediction for structured outputs (Angelopoulos et al., Fisch et al.)
    — closely related to abstention use case

    - Prompt robustness for IE (LLM-IE, GOLLIE lines) — relevant to interpreting what
    structural consistency actually measures

    - CISC (Huang et al. 2025) overlap not clearly differentiated from entity-level
    voting confidence

    - CRF marginals and structured prediction uncertainty — underengaged despite direct
    relevance to NER


    ### Positioning Concerns

    - **Overclaiming**: "First systematic comparison" is too strong; "correlation-selection
    gap" is presented as a discovery rather than domain-specific documentation of

    result_rationale: 'exp-017在best档下是decisive positive result，理由如下：

      (1) Cross-model一致性极高：LLaMA CoNLL SJ ρ=0.431 vs Qwen CoNLL ρ=0.436 (Δ=0.005)。
      两个architecturally不同的8B模型（Qwen3 vs LLaMA-3.1）在同一数据集上产生几乎 相同的consistency-accuracy
      correlation。这不是trivial的——Qwen和LLaMA的tokenizer、 pre-training data、architecture细节完全不同，但structural
      consistency作为quality estimator的有效性是一个关于output space agreement的property，与model
      internals无关。

      (2) Cross-dataset一致性：LLaMA在SciERC上SJ ρ=0.363，在CoNLL上0.431。Qwen在SciERC上 0.357，CoNLL上0.436。两个模型都展示相同的dataset
      effect（CoNLL > SciERC），进一步 确认consistency signal strength是task property而非model
      artifact。

      (3) logprob在CoNLL上的AUROC(0.761)高于structural signals(0.704)——这是CoNLL特殊性造成的： greedy
      F1=0.927极高，logprob calibration在near-perfect performance regime下更准确。 但ρ仍然显著低于structural（0.307
      vs 0.431，Δ=0.124），因为ρ测量的是rank discrimination 而非threshold classification。这个AUROC
      vs ρ的分离恰好为论文的metrics discussion提供 了一个自然的例子：不同metrics capture不同aspects of quality
      estimation。

      (4) 3-seed robustness (SJ ρ std=0.008) 是最tight的across所有configurations。CoNLL的
      large test set (n=2756)提供了high statistical power，variance自然低。这让reviewer对 "results
      stable across random seeds"的claim完全信服。

      (5) N=8→N=16提升(SJ +0.033)在所有3 seeds上一致，但absolute gain modest——因为N=8已经 near-saturation
      on CoNLL NER。这与SciERC pattern一致（NER saturates earlier than RE）， 支撑Claim 3的task-complexity
      boundary narrative。

      (6) Best-of-N selection在CoNLL上trivial（所有signals在greedy±0.003内，oracle headroom
      仅0.018），reinforces Claim 2：当greedy已near-optimal时，selection无headroom可exploit。
      这是correlation-selection gap的complementary evidence——gap不仅存在于consistency signals
      fail to select的场景，也存在于所有signals（including logprob）都无法超越greedy的场景。

      '

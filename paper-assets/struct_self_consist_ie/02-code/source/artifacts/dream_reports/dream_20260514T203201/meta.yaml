    \ WNUT-17 failure mode reported transparently. RE weakness acknowledged head-on.\
    \ Best-of-N failure on NER is the central finding rather than buried.\n- **S4.\
    \ Practical utility.** Actionable guidance for practitioners: log-probability\
    \ provides comparable quality estimation at zero extra cost; multi-sample generation\
    \ not justified for fine-tuned models unless log-probs are unavailable.\n\n####\
    \ Weaknesses\n\n- **W1 (Major). Best-of-N protocol structurally biased against\
    \ instance-level signals; gap explanation is near-tautological.** Instance-level\
    \ signals (SJ, voting, FK, EM) assign the same score to all N samples from one\
    \ input — they *cannot* rank among candidates by construction. The paper presents\
    \ this as an empirical discovery when it is closer to a definitional property.\
    \ The real question — whether per-sample variants of structural signals (e.g.,\
    \ LOO-SJ per sample as a ranking signal) could enable selection — is never tested.\
    \ LOO-SJ is computed only for circularity checking, not as a selection signal.\
    \ This is a significant missed opportunity.\n- **W2 (Major). Single RE dataset\
    \ with severe floor effects.** 44% of SciERC RE instances receive F1=0. All RE-specific\
    \ claims rest on this single dataset. A second RE dataset (TACRED, DocRED) would\
    \ substantially strengthen conclusions.\n- **W3 (Moderate). Task-difficulty gradient\
    \ conflates multiple variables.** The difficulty gradient (CoNLL easy → SciERC\
    \ hard → WNUT infeasible) simultaneously varies domain, schema complexity, text\
    \ style, and model capability. Unclear which variable drives observed effects.\n\
    - **W4 (Moderate). Uneven statistical rigor.** No bootstrap CIs reported for main\
    \ Table 1 comparisons. Only 3 seeds. No paired bootstrap or Williams' test for\
    \ comparing dependent correlations. Fisher z-test on overlapping NER/RE instances\

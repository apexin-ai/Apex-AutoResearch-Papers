    \n#### Weaknesses\n\n- **W1 (Major). Correlation–selection gap is near-tautological.**\
    \ An instance-level signal c(x, {y_i}) → ℝ produces one number per input; it *cannot*\
    \ rank N candidates by construction. The conceptual contribution reduces to: (a)\
    \ instance-level signals can't rank samples (definitional), and (b) logprob helps\
    \ on RE but not NER (a single empirical observation). Neither alone meets the\

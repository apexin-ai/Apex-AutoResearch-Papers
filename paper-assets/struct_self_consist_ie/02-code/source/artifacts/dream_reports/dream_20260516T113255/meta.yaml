    # Dream Review Report: "Strong Predictors, Weak Selectors"


    **Dream ID**: 20260516T113255 | **Tier**: best | **Venue**: EMNLP 2026 Main Conference
    (ARR)


    ---


    ## Meta-Review Summary


    This paper decouples quality estimation (QE) from best-of-N selection for structured
    information extraction, showing that five confidence signals predict output quality
    (AUROC up to 0.82) but universally fail to improve selection over greedy decoding.
    A multi-causal failure diagnosis (instance degeneracy, logprob compression, insufficient
    discriminability) is supported across 3 models, 2 IE tasks, and 3 datasets. A
    trained logistic regression verifier closes 36% of the NER oracle gap, establishing
    that the information exists in the signals but unsupervised aggregation is the
    bottleneck.


    The dual-contribution framing is coherent: Contribution A (QE framework) provides
    practical value for selective prediction, while Contribution B (diagnostic analysis)
    provides mechanistic understanding. The paper''s strongest element is the multi-causal
    diagnosis, which goes beyond simple "it doesn''t work" negative results. However,
    several methodological gaps and novelty concerns limit the paper to borderline
    Findings/Conference territory.


    ---


    ## R1 Review: Methods & Experiments


    ### Summary

    The experimental design covers meaningful breadth (3 models, 2 tasks, 3 datasets)
    with appropriate statistical methodology (bootstrap + Cohen''s d). The five-signal
    taxonomy is well-specified, and the multi-causal diagnosis is the paper''s methodological
    highlight. However, critical missing controls—particularly around N-scaling, temperature
    ablation, and the LoRA rank confound—leave key claims insufficiently supported.


    ### Strengths

    - **Well-defined QE/selection decoupling** with appropriate metrics for each task
    (rank correlation + AUROC for QE; bootstrap significance + Cohen''s d for selection).
    This is a genuine conceptual contribution to the evaluation methodology.

    - **Systematic five-signal coverage** across four families. The Set Jaccard formulation
    with type-grouped Hungarian alignment and max(|g_a|,|g_b|) denominator normalization
    is non-trivial and well-specified.

    - **Multi-causal diagnosis is convincing**: degeneracy alone does not explain
    failure (LoRA rank=8 ablation reduces degeneracy 3× yet selection still fails),
    and LP compression is quantified precisely (0.041 nats within-instance range).
    The combination is more informative than either mechanism alone.

    - **Cross-model validation is meaningful**: three architectures showing near-identical
    SJ ρ (0.422–0.436) on CoNLL establishes model-agnostic behavior. The Δρ < 0.015
    across architectures is compelling.

    - **Trained verifier experiment** is well-controlled (5-fold CV, feature importance
    analysis, CV std reported) and transforms a purely negative paper into one with
    constructive direction. The 36% gap closure is non-trivial.

    - **Capability–degeneracy tradeoff** (CoNLL 58% degen at 91% F1 vs. SciERC 21%
    at 66% F1 vs. WNUT ~0% at 48% F1) is an insightful empirical regularity with implications
    beyond this paper.


    ### Weaknesses

    - **N=8 is unjustified and potentially insufficient.** The self-consistency literature
    typically uses N=40+ (Wang et al. 2023 use N=40). Without an N-scaling analysis,
    the "selection universally fails" claim may be conflated with "N is too small
    for structured outputs." This is the most significant threat to the paper''s central
    thesis.

    - **WNUT-17 is underreported.** The abstract and conclusion claim 3 datasets,
    but WNUT-17 appears only qualitatively in the Discussion ("near-zero degeneracy").
    No tables report WNUT QE metrics or selection results. This weakens the "3 datasets"
    breadth claim.

    - **RE evaluation is incomplete.** Table 1 reports only AUROC for RE (no ρ, τ,
    or ECE). The binary dominance issue (43–45% zero-F1 instances) motivates this
    omission, but the paper should either report full metrics with explanation or
    explicitly justify the gap.

    - **Trained verifier uses oracle F1 labels.** This fundamentally limits the practical
    contribution of §5.4. The verifier requires ground-truth annotations—it cannot
    be deployed zero-resource. The 36% headline may mislead readers about practical
    applicability. Cross-domain/task transfer is untested.

    - **LoRA rank ablation is confounded.** Changing LoRA rank changes model capability
    (potentially degrading F1), not just degeneracy. Greedy F1 for the rank=8 model
    is not reported. If rank=8 substantially degrades performance, the "selection
    still fails" claim has a different interpretation.

    - **Missing non-degenerate subset analysis.** The experiment plan mentions +2.9pp
    (p=0.004) on non-tied instances—this is strong evidence that should appear in
    the main paper but is absent.

    - **No MBR decoding baseline.** SJ-based selection is essentially MBR with Jaccard
    utility, but this connection is neither formalized nor empirically compared.

    - **No temperature ablation.** T=1.0 is used uniformly without justification.
    Temperature significantly affects both diversity and degeneracy.


    ### Questions for Authors

    1. What is the greedy F1 of the LoRA rank=8 model?


    that follows naturally from autoregressive generation for structured outputs —
    once the model commits to a structural template, token-level variation is minimal.

    - *Persistence under reduced degeneracy* (LoRA rank=8): The most novel finding
    — demonstrates multi-causality. But the mechanism ("signals lack discriminative
    power even with headroom") restates that unsupervised heuristics are weaker than
    supervised verifiers, which is well-established.


    **QE-Selection Decoupling**: Partially tautological. 4/5 signals produce one score
    per instance and trivially cannot rank candidates within an instance. The genuinely
    empirical content is that LP (the only per-sample signal) also fails, attributed
    to compression. The paper frames the definitional property as an empirical discovery.


    **Capability-degeneracy correlation**: Based on 3 data points, acknowledged as
    "illustrative." This is speculation, not a contribution.


    ### Related Work Gaps

    - **MBR literature**: Kumar & Byrne (2004), Freitag et al. (2022) discuss MBR
    failure in structured prediction — the paper''s "degeneracy" explanation may be
    a special case of MBR failure when the reference distribution collapses.


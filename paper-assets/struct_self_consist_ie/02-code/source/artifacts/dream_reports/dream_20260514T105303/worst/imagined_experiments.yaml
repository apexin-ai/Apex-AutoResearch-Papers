- name: evaluation_metrics_expansion
  plan_id: exp-015
  description: '在所有 confidence signal (SJ, FK, logprob, exact-match, entity-voting)
    × 所有数据集上扩展评估指标：AUROC、calibration plot (ECE)、Kendall τ。 同时做 leave-one-out SJ 作为
    circularity robustness check。

    '
  expected_results:
    scierc_ner_sj_rho: 0.38
    scierc_ner_sj_auroc: 0.63
    scierc_ner_sj_tau: 0.26
    scierc_ner_sj_ece: 0.12

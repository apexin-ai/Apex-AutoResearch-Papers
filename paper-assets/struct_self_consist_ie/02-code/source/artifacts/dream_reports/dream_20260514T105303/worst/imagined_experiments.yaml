  analysis: '这是 worst 档下最致命的结果。Log-prob 在 SciERC NER 上与 SJ 持平， 在 CoNLL/WNUT 上明显胜出。SJ
    的 16x 采样成本（N=8 次推理 vs 1 次 greedy + logprob） 在 NER 上完全不合理。关键洞察：fine-tuned 模型的 logprob
    已经隐式编码了 输出质量信息，多采样一致性没有提供 complementary 信息。 这不意味着 SJ 无价值——在 consistency 方法族内部，SJ
    仍是最佳选择， 但 consistency 方法本身不 justify 额外计算。 Paper reframing：这个负面结果本身就是贡献——揭示了 TTS

tier: worst
narrative_guidance: '核心 framing 必须重写，但不降级 venue 目标。新 angle：本文是首个在结构化预测 TTS 中 系统评估置信信号的
  empirical study，关键发现是负面但有高信息量的： (1) log-prob 是被低估的强 baseline——多采样一致性（无论 SJ 还是 FK）在
  NER 上 并不优于单次 log-prob，表明对于当前 LLM，模型内部置信度已充分编码输出质量信息， 额外采样是浪费；(2) 所有置信信号在 RE 上都退化，揭示了
  task-complexity boundary； (3) SJ 作为集合相似度度量在 consistency 族内仍优于 FK/exact-match， 是
  consistency 方法的最佳实践，但 consistency 方法本身不优于 log-prob。 这是一个 "systematic negative result
  + diagnostic framework" 的贡献模式， EMNLP 历史上接受此类 paper（calibration/evaluation 类 track）。
  目标：仍冲 EMNLP Main，Findings 作为底线。

  '
imagined_experiments:
- name: baseline_logprob
  plan_id: exp-012
  description: '对所有已有 pilot 数据 (SciERC NER+RE) 提取 sequence log-probability， 计算与 F1
    的 Spearman ρ、AUROC、Kendall τ。同时在 CoNLL/WNUT 新数据上采集。

    '
  expected_results:
    scierc_ner_logprob_rho: 0.41
    scierc_ner_logprob_p: 2.1e-23
    scierc_ner_logprob_auroc: 0.72
    scierc_ner_logprob_tau: 0.29
    scierc_ner_logprob_ece: 0.08
    scierc_re_logprob_rho: 0.31
    scierc_re_logprob_p: 3.4e-10
    scierc_re_logprob_auroc: 0.64
    scierc_re_logprob_tau: 0.22
    conll_ner_logprob_rho: 0.38
    wnut_ner_logprob_rho: 0.35
    scierc_ner_sj_minus_logprob: -0.03
    conll_ner_sj_minus_logprob: -0.12
    wnut_ner_sj_minus_logprob: -0.13
  result_rationale: 'Worst 档的核心假设是 log-prob 在 NER 上匹配甚至超过 SJ。原理： 对于 NER 这种相对简单的结构化任务，fine-tuned
    LLM 的 softmax 分布 已经 well-calibrated——高 log-prob 序列大概率包含正确的 entity span 和 type，
    低 log-prob 序列大概率有错误。这种单次前向传播的置信度信号本质上捕获了 模型对输出的"确定性"，与多采样一致性测量的"稳定性"高度相关。 在 SciERC
    上 SJ rho~0.38 vs logprob rho~0.41，差值约 -0.03， 统计上无法区分或 logprob 微优。在 CoNLL/WNUT
    上差距更大（-0.12/-0.13）， 因为这些数据集的 entity type 更标准（PER/LOC/ORG），模型的 token-level 置信度更能直接反映
    entity 正确性，而 SJ 在跨域上泛化差 （pilot 数据只在 SciERC 上 SJ rho 高，是 SciERC entity 结构特异性所致）。
    RE 上 logprob rho=0.31 仍然高于 SJ 的 0.24-0.28，因为 logprob 对所有 token（包括 relation trigger）都有信号，而
    SJ 在 RE 上因 compound error 退化更严重。

    '

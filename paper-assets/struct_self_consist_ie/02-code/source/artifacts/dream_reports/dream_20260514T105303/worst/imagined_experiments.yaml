    间 consistency 变得无意义 （两个都错但错法不同→低 SJ 低 F1，或两个都错但错法相同→高 SJ 低 F1）。 Logprob 在 OOD
    时天然更低（模型不确定），虽然也不是完美 signal， 但至少保持了 "低 logprob ≈ 模型不确定 ≈ 大概率错" 的单调关系。 48% 的 sample

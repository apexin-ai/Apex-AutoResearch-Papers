  analysis: 'Exact-match 是 Wang et al. 2023 self-consistency 的直接结构化推广， 但在 IE 上表现最差——NER
    rho=0.24 远低于 SJ(0.38) 和 logprob(0.41)。 这在 worst 档下反而成为 paper 的一个正面论点：exact-match
    作为 reasoning task 上的标准方法在结构化预测上退化严重，说明结构化输出 需要 soft similarity（SJ），虽然 SJ 仍不如 logprob。
    这为 "SJ 是 consistency 族最佳实践" 子结论提供证据。

    '
- name: baseline_entity_voting
  plan_id: exp-014
  description: 'Entity-level majority voting：对每个 entity，统计 N 个 sample 中出现次数， 选择超过
    threshold 的 entity。计算 entity-voting 选择的 F1 以及 voting score 与 instance-level F1
    的相关性。

    '
  expected_results:
    scierc_ner_entity_voting_rho: 0.34
    scierc_ner_entity_voting_auroc: 0.66
    scierc_ner_entity_voting_tau: 0.24
    conll_ner_entity_voting_rho: 0.29
    wnut_ner_entity_voting_rho: 0.24
    scierc_ner_entity_voting_f1_at_thresh_0.5: 0.682
    scierc_ner_entity_voting_f1_at_thresh_0.375: 0.671
    scierc_ner_entity_voting_f1_vs_greedy_delta: 1.5
    scierc_ner_entity_voting_minus_sj_rho: -0.04
    scierc_ner_entity_voting_minus_logprob_rho: -0.07
  result_rationale: 'Entity voting 是一个被低估的强 baseline。它本质上在 entity 粒度做了 majority voting——如果一个
    entity 在 8 个 sample 中出现 7 次， 它大概率是正确的。rho=0.34（SciERC）接近 SJ 的 0.38，因为 entity voting
    的 instance-level score（平均 entity 出现率）与 SJ 高度相关： 当 sample 间 entity set 一致时，voting
    score 和 SJ 都高。 但 entity voting 比 SJ 少了一层 pairwise set-similarity 的聚合， 所以稍逊。关键是
    entity voting 只需 O(N×|E|) 简单计数， 不需 SJ 的 O(N²×匹配) 计算，但仍需 N 次采样。 在 worst 档下 entity_voting
    rho=0.34 进一步压缩了 SJ 的增量价值： SJ 比 entity voting 只多 +0.04 rho，而 logprob 不需采样就达到 0.41。
    CoNLL/WNUT 上 entity voting 也退化（0.29/0.24），与 SJ 同步下降。

    '

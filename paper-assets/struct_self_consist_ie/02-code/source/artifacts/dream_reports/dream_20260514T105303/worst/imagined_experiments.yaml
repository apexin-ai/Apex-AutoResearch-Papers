    '
- name: baseline_exact_match
  plan_id: exp-013
  description: '计算 N 个 sample 中完全相同 entity/relation set 的比例（exact-match voting rate），
    作为 consistency 的最简 baseline。与 F1 计算 ρ/AUROC/τ。

    '
  expected_results:
    scierc_ner_exact_match_rho: 0.24
    scierc_ner_exact_match_auroc: 0.6
    scierc_ner_exact_match_tau: 0.17
    scierc_re_exact_match_rho: 0.14
    conll_ner_exact_match_rho: 0.2
    wnut_ner_exact_match_rho: 0.18
    scierc_ner_pct_all_match: 8.3
    scierc_ner_pct_no_match: 42.1
    scierc_re_pct_all_match: 2.1
    scierc_re_pct_no_match: 71.4
  result_rationale: 'Exact-match 在结构化输出上天然受限：即使两个 sample 只差一个 entity 的 span boundary（如
    "neural network" vs "neural networks"），exact-match 就判为不一致。 在 NER 上 rho~0.24 远低于
    SJ(0.38) 和 logprob(0.41)，验证了 SJ 作为 soft set-similarity 的优势——但这只说明 SJ > exact-match，不说明
    SJ > logprob。 在 RE 上更差（rho=0.14），因为 relation triplet 的 exact-match 要求 head/tail/type
    同时完全匹配，过于严格。 ~42% NER 样本无任何 exact-match pair，信号极度稀疏。 CoNLL/WNUT 上更差因为跨域 fine-tune
    质量不如 SciERC 专精模型， 输出变异性更大。

    '

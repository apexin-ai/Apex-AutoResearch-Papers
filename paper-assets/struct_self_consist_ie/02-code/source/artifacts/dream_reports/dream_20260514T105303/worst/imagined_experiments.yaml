    conll_ner_headroom: 0.04
    conll_ner_sj_auroc: 0.57
    conll_ner_logprob_auroc: 0.69
    conll_ner_sj_minus_logprob: -0.12
    n_test: 3453
  result_rationale: 'CoNLL-2003 上 SJ 严重退化的根本原因是 ceiling effect： CoNLL 是新闻语料 + 标准 NER
    type (PER/LOC/ORG/MISC)， fine-tuned Qwen3-8B 在这上面 greedy F1=0.88，sample F1 mean=0.85，
    只有 3.2% 的 sample 是 F1=0。这意味着绝大多数 sample 已经很好， mean SJ=0.84（几乎所有 sample pair 高度一致），方差极小。

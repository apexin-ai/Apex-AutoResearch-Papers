    scierc_re_sj_auroc: 0.57
    scierc_re_logprob_auroc: 0.64
    scierc_re_fk_auroc: 0.54
  result_rationale: 'AUROC 和 calibration 指标上 logprob 的优势更加明显。原理： AUROC 衡量的是二分类判别能力（好/坏
    sample），logprob 天然输出连续值 且分布较 smooth，AUROC=0.72 表示 72% 的概率 logprob 能正确排序 一对 good/bad
    sample。SJ 的 AUROC=0.63 较低，因为 SJ 的值域高度集中 在 0.6-0.8（pilot 数据 SJ mean=0.78），区分度不如
    logprob。 ECE（Expected Calibration Error）上 logprob=0.08 优于 SJ=0.12， 因为 logprob
    本身就是概率量，calibration 更自然；SJ 是相似度指标， 需要额外 scaling 才能解释为"置信度"。 Kendall τ 与 Spearman
    ρ 趋势一致但绝对值更低（τ ≈ 0.7×ρ 是常见关系）。 Leave-one-out SJ rho=0.36 vs full SJ rho=0.38，差异仅

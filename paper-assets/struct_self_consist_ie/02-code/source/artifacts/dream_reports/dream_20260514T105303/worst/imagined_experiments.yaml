    conll_ft_ner_f1_greedy: 0.88
    conll_ft_train_loss: 0.05
    conll_ft_eval_loss: 0.06
    conll_ner_sj_rho: 0.26
    conll_ner_sj_p: 4.2e-08
    conll_ner_fk_rho: 0.21
    conll_ner_logprob_rho: 0.38
    conll_ner_exact_match_rho: 0.2
    conll_ner_entity_voting_rho: 0.29
    conll_ner_mean_sj: 0.84
    conll_ner_sample_f1_mean: 0.85
    conll_ner_sample_f1_pct_zero: 3.2

narrative_guidance: 'Claim 1 降级：SJ 不再是"最优"信号。改为"SJ 是最优 consistency-based 置信信号（显著优于
  FK 和 exact-match），

  但与零成本 log-prob 互补而非替代"。核心贡献重新定位为 systematic comparison：首次在结构化预测 TTS 中

  系统比较四类置信信号家族。三层发现：(a) 结构一致性 > 表面一致性（SJ > FK/exact-match 在所有 NER 数据集上成立），

  (b) log-prob 是意外强的 baseline 表明 fine-tuned model 已内化部分质量信息，

  (c) SJ 与 log-prob 捕获不同维度——SJ 在 RE conditional 上远超 log-prob 说明结构一致性检测的是不同信号。

  Claim 2 不变且加强：log-prob 在 RE full 上同样退化（max ρ < 0.28）证明 task-complexity boundary
  是普适的。

  新亮点：SJ+logprob ensemble 加权组合在 NER 上 ρ 达 0.42-0.44，超过任一单信号——两者信息互补的直接证据。

  目标：EMNLP Main（如 systematic comparison + ensemble 被认可）或 Findings（保底）。

  关键风险：SJ vs logprob 差距跨数据集不一致（SciERC 上 SJ 微优，CoNLL 上 logprob 反超），

  需要 ensemble 和 RE conditional 两条线来稳固贡献。

  '
imagined_experiments:
- name: baseline_logprob
  plan_id: exp-012
  description: '对 pilot_004/005 已有样本做 vLLM forward pass 提取 length-normalized mean
    log-prob， 计算与 per-instance F1 的 Spearman ρ / Kendall τ / AUROC。 Median 档：log-prob
    在 NER 上意外地强（ρ=0.34），与 SJ（0.39）差距仅 0.05 且统计显著性边界模糊。

    '
  expected_results:
    ner_full_rho_sj: 0.3875
    ner_full_rho_fk: 0.3211
    ner_full_rho_logprob: 0.339
    ner_full_tau_sj: 0.271
    ner_full_tau_logprob: 0.238
    ner_full_auroc_sj: 0.683
    ner_full_auroc_logprob: 0.672
    ner_sj_vs_logprob_delta_rho: 0.0485
    ner_sj_vs_logprob_p_bootstrap: 0.038
    re_full_rho_sj: 0.2343
    re_full_rho_fk: 0.1835
    re_full_rho_logprob: 0.267
    re_full_auroc_sj: 0.598
    re_full_auroc_logprob: 0.625
    re_cond_rho_sj: 0.3716
    re_cond_rho_logprob: 0.218
    re_cond_auroc_sj: 0.679
    re_cond_auroc_logprob: 0.556
  result_rationale: 'Median 档假设 log-prob 经过 length normalization（除以 token 数）后信号质量大幅提升，
    因为 fine-tuned model 对正确输出赋予更高整体概率。ρ=0.34 意味着模型内部 confidence 已编码了 相当多的质量信息。但 SJ
    仍领先 ~5pp 因为 log-prob 是 sequence-level 全局信号， 无法区分「实体 A 正确但实体 B 错误」的局部质量差异，而 SJ
    通过 pairwise 结构比较捕获了这种 细粒度结构一致性。Bootstrap paired test p≈0.038 处于 α=0.05 边界。 在 RE
    full 上 log-prob 反超 SJ（0.267 vs 0.234）因为 log-prob 有效捕获了「模型完全不会做这道题」 的知识缺口信号（低 log-prob
    → 低 F1），而 SJ 对全零输出实例无法产生有效梯度。 但在 RE conditional（过滤知识缺口后），SJ 大幅反超（0.372 vs 0.218），
    说明在模型有能力回答的范围内，结构一致性远优于全局 confidence。

    '

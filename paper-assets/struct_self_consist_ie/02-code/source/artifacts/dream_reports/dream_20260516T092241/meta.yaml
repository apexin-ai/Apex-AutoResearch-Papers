    result_rationale: 'LoRA rank=8 ablation 是 worst tier 的因果证据核心。

      F1 下降有限 (-3.9pp: 0.664→0.625)。rank=8 的参数空间更小 (rank-8 矩阵 vs rank-16), 模型学到了 SciERC
      NER 的主要 extraction patterns 但未达到 rank=16 的精度。5 epochs 同样训练量下， rank=8 的有效 capacity
      更低，final loss 0.108 vs rank=16 的 0.081。 但 0.625 F1 仍然是 reasonable performance（高于
      WNUT 0.523）。

      Degeneracy 大幅下降 15.8pp (21%→5.2%)。这是最关键的发现。 机制：rank=8 LoRA 对预训练权重的修改幅度更小。 预训练
      Qwen3-8B 的 generation distribution 是 diverse 的； fine-tuning 将这个 distribution
      压缩向 task-specific modes。 Rank=16 提供了足够的 capacity 来 aggressively specialize (更多参数
      → 更大的 weight update → 更强的 mode collapse)。 Rank=8 参数不足以完全 collapse output distribution，保留了多样性。

      Oracle headroom 从 10.85pp 增加到 18.7pp (+7.85pp)。 更多的输出多样性意味着 N=8 samples 覆盖更广的
      output space, oracle 能找到更好的 sample。这直接转化为 selection 机会： LP selection +3.6pp
      (p=0.015, d=0.168)。

      LP compression 显著减轻：median range 0.074 vs 0.041 (1.80×)。 更宽的 LP range → LP 有更多的
      discrimination power → selection 从 negligible (+0.6pp, n.s.) 变为 significant
      (+3.6pp, p=0.015)。

      SJ rho 在 rank=8 下甚至略高 (0.378 vs 0.360, +0.018)。 这证明 QE correlation 能力不受 fine-tuning
      intensity 影响—— signals 的 quality estimation 能力是 robust 的。 只有 selection 受 degeneracy/compression
      影响。 这 disentangles QE vs selection：QE 是 signal 的 intrinsic property， selection
      effectiveness 是 regime-dependent。

      RE degeneracy 也下降但幅度更小 (-9.0pp: 21%→12%)， 因 RE 的 zero-F1 问题 (48.5%) 不受 LoRA
      rank 影响—— 这是 task difficulty 驱动的 fundamental limitation。

      '

  review_report: '---

    dream_id: dream_20260516T092241

    tier: median

    overall_score: reject

    timestamp: 2026-05-16T10:23:36.740148+00:00

    ---


    # Dream Review Report: Strong Predictors, Weak Selectors


    **Paper**: "Strong Predictors, Weak Selectors: Diagnosing Why Confidence Signals
    Cannot Scale Structured Information Extraction"

    **Venue**: EMNLP 2026 Main Conference (ARR 2025+ review form)

    **Review Mode**: Full (2-reviewer roundtable, 4-step protocol)

    **Date**: 2026-05-16


    ---


    ## Venue Rubric (ARR 2025+)


    - **Soundness** (1–5): Technical correctness and experimental rigor

    - **Excitement** (1–5): Novelty, significance, impact potential

    - **Overall** (1–5): 5=Strong Accept, 4=Accept, 3=Borderline, 2=Reject, 1=Strong
    Reject

    - EMNLP acceptance rate: ~24%


    ---


    ## Paper Summary


    The paper systematically evaluates 5 confidence signals across 4 families (structural
    agreement, surface similarity, generation probability) for quality estimation
    (QE) and candidate selection in structured IE (NER + RE). Two co-primary contributions:
    (1) a QE framework showing structural consistency signals outperform log-probability
    for NER (ρ=0.38 vs 0.21, Fisher p=0.028), and (2) a diagnosis of why signals that
    predict quality fail at selection—two mechanisms (instance degeneracy, log-prob
    compression) unified by a "capability trap" where higher model capability drives
    output convergence. Tested on 4 datasets (SciERC, CoNLL-2003, Few-NERD, WNUT-17),
    3 model configurations (Qwen3-8B, LLaMA-3.1-8B, Qwen3-4B), with LoRA rank ablation
    and free-form decoding ablation.


    ## Experiment Coverage vs. Design


    The review context YAML lists 5 imagined experiments: (1) fewnerd_smoke, (2) fewnerd_full,
    (3) 3rd_seed_scierc, (4) lora_rank8_ablation, (5) claim_audit. All 5 are reflected
    in the paper (Few-NERD in main results + Appendix A, 3rd seed in Fisher combined
    tests, LoRA ablation in Section 5.5, claim audit in Section 5.7). Coverage is
    complete.


    ---


    ## R1 Review: Methods & Experiments


    ### Strengths


    1. **Well-designed QE/selection separation.** The distinction between instance-level
    signals (which cannot rank candidates by construction) and per-sample signals
    (LP) is clearly articulated and drives the experimental design. Non-trivial methodological
    contribution.


    2. **Rigorous statistical analysis.** Bootstrap CIs for signal comparisons, Fisher
    combined p-values across seeds, Cohen''s d for effect sizes, TOST equivalence
    testing. The paper reports non-significant p-values honestly (p=0.39 for SciERC
    selection, p=0.42 for Few-NERD).


    3. **Thorough ablation chain.** Five ablations (free-form decoding, LoRA rank,
    model scale, cross-architecture, non-degenerate subset) systematically eliminate
    confounds. The free-form ablation (LP std ratio 0.97) convincingly rules out constrained
    decoding as the cause of LP compression.


    4. **Honest negative result reporting.** Claims are appropriately hedged ("predominantly
    fail" not "universally fail"). Effect sizes are small and reported as such.


    5. **Multi-seed stability.** Three seeds with SD ≤ 0.032 for SJ ρ. Signal rankings
    are consistent across seeds.


    6. **Difficulty gradient design.** Four datasets spanning F1=0.52 to F1=0.91 systematically
    map the capability-degeneracy relationship.


    ### Weaknesses


    1. **Narrow model scale (4B–8B only).** The "capability trap" claim extrapolates
    beyond a 2× parameter range. At 70B+ or frontier models, sampling diversity may
    behave qualitatively differently. The paper acknowledges this but the abstract
    and introduction frame findings as general.


    2. **4B results contradict the capability trap.** Qwen3-4B shows *worse* selection
    (−1.49pp vs greedy) despite lower degeneracy (10.4% vs 21%). If lower degeneracy
    doesn''t improve selection, the degeneracy → headroom narrative is incomplete.
    This anomaly is not adequately discussed.


    3. **N=8 may be too small.** For outputs with high combinatorial complexity (sets
    of typed entities), 8 samples may not adequately explore the output space. The
    paper does not investigate whether degeneracy decreases substantially at N=32
    or N=64.


    4. **RE coverage is thin.** Single dataset (SciERC RE), treated as exploratory,
    with greedy dominating all signals. The title claims "structured information extraction"
    but the paper is primarily a NER study.


    5. **Missing threshold-based aggregation alternatives.** The paper tests selection
    (pick best sample) but not soft aggregation strategies (e.g., include entity if
    frequency > threshold, entity-level voting with tuned thresholds).


    ### R1 Scores

    - Soundness: 3/5

    - Excitement: 2/5

    - Overall: 2.5/5


    ---


    ## R2 Review: Novelty & Related Work


    ### Strengths


    1. **Thorough related work coverage.** Correctly positions against self-consistency
    (Wang et al.), CISC, SelfCertainty, ReASC for reasoning; Nédéllec & Xia for IE
    consistency; semantic entropy, conformal prediction, CoCoA for uncertainty; Eikema
    et al. for MBR.


    2. **Explicit MBR distinction.** "Utility IS aligned (within-instance ρ=0.524)
    but headroom eliminated by degeneracy" is well-articulated and genuinely different
    from utility misalignment. This is the paper''s strongest novelty claim.


    3. **Systematic signal taxonomy.** The 4-family, 5-signal decomposition with the
    instance-level vs per-sample distinction provides clarity for future work.


    4. **Appropriate claim calibration.** The paper hedges correctly throughout—LP>SJ
    for RE is reported as "tendency" (Fisher p=0.085), not definitive. The capability
    trap is framed with R²=0.72, acknowledging residual variance.


    ### Weaknesses


    1. **"Capability trap" is near-tautological.** "Better models produce more deterministic
    outputs, so there''s less room for selection" is close to a truism. A model achieving
    91% F1 *should* produce similar outputs across samples. The correlation between
    F1 and degeneracy essentially says "easy tasks have less variance," well-known
    in calibration literature. The paper needs to argue why this is surprising in
    the structured IE context specifically.


    2. **Limited novelty of the core negative finding.** Self-consistency works for
    reasoning because multiple reasoning paths converge to a correct discrete answer.
    For fine-tuned NER, convergence is the *expected* outcome of successful fine-tuning.
    No evidence is provided that practitioners or researchers actually expect multi-sample
    selection to work for fine-tuned structured IE. The paper may be refuting a claim
    nobody makes.


    3. **QE framework is incremental.** Individual components (Jaccard similarity,
    exact match, voting confidence, log-probability) are all standard. The main finding—structural
    > surface > probabilistic for NER—is intuitive. Competent engineering, not a conceptual
    advance.


    4. **Missing reranking/verifier comparison.** The paper identifies trained verifiers
    as the solution but never demonstrates how much oracle gap they could close. Even
    a simple supervised baseline (linear probe on LP+SJ features) would ground the
    "how much is recoverable" question. Without this, the paper cannot distinguish
    "confidence signals are inherently uninformative" from "these particular unsupervised
    signals are weak."


    5. **MBR distinction may be overstated.** Instance degeneracy and utility misalignment
    differ in mechanism but not in qualitative consequence. The MBR literature already
    discusses "peaky" distributions where MBR gains vanish. Framing as "qualitatively
    novel" risks overclaim.


    6. **Missing related work.** (a) Best-of-N with reward models for structured generation
    (code generation literature), (b) Calibration-aware selection (Zhao et al. 2021),
    (c) Diverse decoding strategies (nucleus, typical sampling, diverse beam search),
    (d) Selective prediction / abstention as a more natural application of the QE
    signals.


    ### R2 Scores

    - Soundness: 4/5

    - Excitement: 2/5

    - Overall: 2/5


    ---


    ## Roundtable Discussion Summary


    ### Step 2: Cross-Sharing


    **R1 moved toward R2** on the motivation question. R1 initially gave Excitement
    3/5 but accepted R2''s argument that diagnosing an expected failure without a
    surprising finding or remedy is insufficient. R1 revised Excitement to 2/5 and
    Overall to 2.5/5.


    **R2 acknowledged R1''s catches**: The 4B anomaly (worse selection despite lower
    degeneracy contradicting the capability trap), possible LoRA hyperparameter discrepancy,
    and micro/macro F1 mixing concern. R2 maintained scores, noting these issues reinforce
    the lower assessment.


    ### Step 3: Convergence


    **Consensus strengths:**

    - Statistical methodology is careful and appropriate

    - Signal taxonomy and QE/selection decomposition are clean

    - Related work is thorough, MBR positioning is well-handled

    - Claims are honestly hedged

    - Ablation chain is well-designed


    **Consensus weaknesses:**

    - Narrow model scale (4B–8B) limits generality of capability trap

    - Missing trained selector/reranker baselines — cannot distinguish "signals uninformative"
    from "these heuristics weak"

    - Motivation gap — no evidence community expects multi-sample selection to work
    for fine-tuned IE

    - No remedy offered — pure negative result without boundary conditions or constructive
    alternatives

    - RE coverage is thin (single dataset, exploratory)

    - Core finding borders on tautological (fine-tuned models are near-deterministic)


    **Resolved disagreements:**

    - Both converge that the QE framework is incremental rather than a standalone
    contribution

    - Both converge on Excitement 2/5

    - R1 moved from Overall 3 to 2.5, approaching R2''s 2


    **Remaining disagreement:**

    - Soundness: R1=3 (flags 4B anomaly, N=8 concern) vs R2=4 (methodology is sound
    despite these)


    ---


    ## Final Converged Scores


    | Criterion | Score | Rationale |

    |-----------|-------|-----------|

    | **Soundness** | 3.5/5 | Methodology is careful with appropriate statistical
    tests, but implementation concerns (4B anomaly contradicting central thesis, narrow
    scale, N=8 sample size) prevent full marks |

    | **Excitement** | 2/5 | Both reviewers converge: the finding is near-expected,
    no remedy is offered, and the motivation gap is unresolved |

    | **Overall** | 2/5 | Below acceptance bar for EMNLP Main given limited novelty,
    narrow scope, and missing baselines |

    | **Confidence** | 4/5 | Deep engagement from both reviewers with cross-validation
    of reasoning |


    ## Final Recommendation: **Reject**


    The paper is methodologically competent but addresses a question whose answer
    is largely predictable. Fine-tuned models producing near-deterministic outputs—making
    sampling-based selection ineffective—is close to expected behavior. The "capability
    trap" concept, while named evocatively, reduces to "good models are deterministic,"
    a known property. Neither reviewer identifies a finding that would change how
    practitioners approach structured IE. The narrow model scale (4B–8B) prevents
    the capability trap from being a general insight, and the absence of trained selector
    baselines leaves the negative result ambiguous. A well-executed experiment answering
    a question the community does not actively ask, without offering a constructive
    path forward, does not meet the EMNLP Main bar.


    **Suggested venue**: EMNLP Findings or a workshop paper, with compressed claims
    focused on the QE signal taxonomy and the non-degenerate subset finding (+2.9pp,
    p=0.01) as the most interesting result.


    ---


    ## Actionable Suggestions for Authors


    1. **Scale up.** Include ≥13B models (ideally 70B+) where the capability-but-not-deterministic
    regime may exist. If the trap persists at scale, the finding becomes genuinely
    informative.


    2. **Add trained baselines.** Compare against a lightweight learned verifier or
    reranker (even logistic regression on signal features for per-sample ranking).
    This grounds the claim as "confidence signals fail" rather than "unsupervised
    heuristics fail."


    3. **Find the boundary.** Identify conditions where multi-sample selection *does*
    help (zero-shot, low-resource, out-of-domain, partial fine-tuning). A negative
    result with a clear boundary condition is far more publishable than a blanket
    negative.


    4. **Establish motivation empirically.** Cite or survey practitioners who use/advocate
    multi-sample IE strategies. Alternatively, reframe as "when to stop sampling"
    rather than "why sampling fails."


    5. **Increase N.** Test N=32 or N=64 to rule out the possibility that degeneracy
    is a small-N artifact.


    6. **Resolve the 4B anomaly.** Qwen3-4B showing worse selection despite lower
    degeneracy directly contradicts the capability trap. This needs explicit discussion
    or the framing needs revision.


    7. **Expand RE.** Add at least one more RE dataset (TACRED, DocRED) to move beyond
    exploratory status.


    8. **Explore diverse decoding.** Test nucleus sampling, typical sampling, or diverse
    beam search as alternatives to temperature sampling. If these break degeneracy,
    the finding is about the sampling strategy, not a fundamental limitation.


    9. **Lean into the positive.** The non-degenerate subset result (+2.9pp, p=0.01)
    and the QE signal taxonomy are the most interesting contributions. Consider making
    these the primary focus rather than the negative selection finding.

    '

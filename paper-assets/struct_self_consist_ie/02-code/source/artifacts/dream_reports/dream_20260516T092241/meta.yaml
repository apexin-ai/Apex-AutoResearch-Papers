      seed 不同的输出分布—— 这些实例中模型产生了多样但质量差异小的输出， SJ 无法从结构一致性中区分好坏。SJ 对 sampling randomness
      的敏感度高于 LP (CV 0.154 vs 0.059)，因 SJ 是 pairwise comparison 的平均值，对极端样本敏感。LP 是每个样本的独立属性，
      受 sampling 影响更小。

      RE 信号排名跨 seed 完全不一致是最重要的发现： - seed42: VC 最强 → seed123: FK 最强 → seed789: SJ 最强。
      三个不同的 top-1 signal. 这说明 RE 上 n=397 + 44.8% zero-F1 使得任何无监督信号的排名都不稳定。单 seed RE
      结论不可信。 Cross-seed 一致的唯一结论：EM 始终最弱 (0.134/0.170/0.198)。

      Fisher combined p=0.085 对 SJ>LP (NER) 的含义： seed42 (p=0.002) 和 seed123 (p=0.003)
      给出强证据， 但 seed789 (p=0.180) 大幅削弱了 combined evidence。 使用 Meng''s test（考虑 SJ-LP
      间 Pearson r≈0.55）， seed789 的 SJ-LP gap 仅 0.057 (0.285-0.228)， 在 n=529 下不够显著。Fisher
      将三个 p-values 合并后 给出 borderline result。

      VC>LP (p=0.018) 仍显著——structural family 作为整体 优于 surface signals 的结论可用 VC 作为 anchor，
      但 SJ 的优势变得 seed-dependent。


    result_rationale: LoRA rank=8 比 rank=16 参数少一半（~4M vs ~8M trainable params），但对
      8B base model 而言两者都是 lightweight adaptation。Fine-tune 后 greedy F1 预期略低（-1.5pp）因
      capacity constraint，但 degeneracy rate 几乎不变（19% vs 21%, delta=2pp < 5pp threshold）。原因：degeneracy
      是 model capability 的函数（8B base model 的 representation power 不因 LoRA rank 8→16

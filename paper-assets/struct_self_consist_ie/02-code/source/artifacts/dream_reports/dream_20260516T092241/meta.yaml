    - 'Figure 9 (CRITICAL): Paired bar chart — degeneracy rate and F1 side-by-side
      for rank=16 vs rank=8. Left bars (degeneracy): dramatic drop 21%→5.2%. Right
      bars (F1): modest drop 0.664→0.625. Annotated trade-off ratio: 4.05× degeneracy
      reduction per 1pp F1 cost.

      '
    - 'Figure 10: Dual-axis plot — LP within-instance range distributions for rank=16
      (compressed, peaked at 0.03-0.05) and rank=8 (wider, spread 0.04-0.12). Overlay:
      LP selection gap vs range bin showing threshold effect (~0.06 nats needed for
      effective selection).

      '
    - 'Figure 11: Selection F1 vs N curves at rank=8, showing monotonic improvement
      (LP: 0.625→0.640→0.652→0.661). Contrast: rank=16 curves are flat (0.664→0.647→0.650→0.650).
      Demonstrates recovered test-time scaling at lower LoRA rank.

      '
    analysis: 'LoRA rank=8 ablation 提供了 degeneracy causality 的最强证据。

      (1) Fine-tuning intensity 是 degeneracy 的主驱动因素： 同一数据集、同一模型、同一 training data，仅改变
      LoRA rank 就从 21% degeneracy 降至 5.2%。F1 仅下降 3.9pp。 这排除了 "capability drives degeneracy"
      解释—— rank=8 的 NER capability 仍然很强 (F1=0.625)。

      (2) Selection 从 "fails" 变为 "works"：同一 SciERC 数据， rank=16 下 LP selection +0.6pp
      (n.s.)，rank=8 下 +3.6pp (p=0.015)。 Controlled experiment 证明 selection failure
      是 regime-dependent。

      (3) QE 与 selection 完全 decouple：SJ rho 0.360→0.378 (stable)， LP selection gap
      0.6→3.6pp (dramatic change)。 QE 是 signal 的 intrinsic property，不受 FT intensity
      影响。 Selection 是 regime-dependent，受 degeneracy/compression 控制。

      (4) Prescriptive implication：如果需要 multi-sample selection， 使用较低的 LoRA rank。Trade-off
      量化： 每 1pp F1 cost 换取 4.05× degeneracy reduction。 在 SciERC 上，rank=8 + LP selection
      (0.661) vs rank=16 greedy (0.664) = 仅 0.3pp 差距， 但获得了 uncertainty quantification
      能力。

      (5) 与 Few-NERD 证据互补：Few-NERD (3-epoch) 和 SciERC rank=8 都独立地表明 mild fine-tuning
      → low degeneracy → selection works。 两个独立 ablation 维度 (epoch × rank) 给出一致结论。

      '

  analysis: 'Few-NERD 实验产生三个核心 worst-tier 结论：

    (1) Capability trap 预测失败 (R² 0.98→0.51)。F1=0.778 + degen=5.4% 不在 F1→degeneracy
    回归线上。Few-NERD 的残差 30.2pp 是压倒性的 反面证据。"Capability drives degeneracy" 被替换为 "degeneracy
    is a joint function of fine-tuning intensity, entity density, and task structure."

    (2) Selection 在低 degeneracy regime 下有效。LP +3.2pp (p=0.028) 证明 "universal failure"
    不成立。Selection 失败是 condition-dependent, not structural. 关键条件：degeneracy < 10% +
    LP range > 0.08 nats.

    (3) 最优信号依赖数据集。SciERC: SJ > LP. Few-NERD: LP > SJ. 不存在 universal best signal——进一步支持

  analysis: 'Claim audit 输出一个 comprehensive rewrite checklist。 核心变化不是 patch individual
    numbers——是叙事重构。

    好消息：所有已有实验数据（free-form ablation、scale ablation、 cross-model validation、temperature
    analysis）不受影响。 它们仍然是 valid empirical contributions。 转向只需要重新 frame 这些数据的 interpretation。

    Free-form ablation 仍证明 LP compression is model-intrinsic (在 high-convergence regime
    下)。Scale ablation 仍证明 cross-scale consistency。Cross-model 仍证明 cross-architecture
    generalization。

    新 framing 有更清晰的层次： Layer 1 (QE): confidence signals reliably estimate quality
    — robust across regimes. Layer 2 (Selection): selection effectiveness depends
    on output convergence. Layer 3 (Convergence drivers): FT intensity > entity density
    > task complexity > capability. Layer 4 (Guidelines): prescriptive decision matrix
    for practitioners.

    从 "interesting negative finding" 升级为 "prescriptive empirical study"， 对 EMNLP Main
    Conference fit 可能反而更好—— actionable findings 比 pure diagnostics 更 impactful。

    Title 变更 essential： "Strong Predictors, Weak Selectors" → "When Does Multi-Sample
    Selection Help" 反映从 universal negative 到 conditional study 的根本转向。'

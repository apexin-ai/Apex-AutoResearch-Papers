      evidence: SciERC rank=16 (+0.6pp n.s.), CoNLL (-1.0pp)
    - condition: 10% < degeneracy < 20%
      recommendation: evaluate on dev set; marginal expected gain
      evidence: borderline regime, outcome depends on specific dataset
    - condition: RE with >40% zero-F1 instances
      recommendation: no unsupervised signal reliably helps; consider supervised verifier
      evidence: RE rankings unstable across all seeds
  result_rationale: 'Claim audit 在 worst tier 下揭示 8 处不一致，其中 5 处 critical。 核心问题：现有文本围绕
    "universal failure + capability trap" 构建， 但 Few-NERD 和 LoRA rank=8 直接推翻了 universality
    和 structural inevitability。

    CA-1 是最高优先级：Abstract 的 "universally fail" 被两个 statistically significant 正结果 (p=0.028,
    p=0.015) 直接否定。 如果保留 "universally fail"，reviewer 会立即指出与 Results section 的 internal
    contradiction。

    CA-2 是 legacy 不一致，需要统一数字。

    CA-3 是叙事核心变化：capability trap 从 unifying framework 降级为 one-of-several factors。R²=0.51
    (4 datasets) 和 0.35 (5 points) 说明 F1 只解释 35-51% 的 degeneracy 方差。

    CA-4 需要重构 Claim 1 从 "why selection fails" 到 "when selection fails/succeeds and
    what drives the boundary"。

    CA-5 headline 变化反映从 pure negative 到 conditional finding。

    Prescriptive guidelines 是 worst tier 最大的新贡献—— 给 practitioners 具体的 decision criteria：
    观察 degeneracy rate 和 LP range，决定是否使用 multi-sample 策略。 这比 "selection always fails"
    有更大的 practical value。

    '

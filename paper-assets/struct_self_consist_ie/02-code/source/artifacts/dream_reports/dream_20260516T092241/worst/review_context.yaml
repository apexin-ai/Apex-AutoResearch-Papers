narrative_guidance: '放弃 capability trap 作为 unifying framework。Reframe 为条件性研究： ''Conditions
  for Effective Test-Time Scaling in Structured IE''。 核心转向：不是 ''selection universally
  fails''，而是 ''selection fails under high-convergence regimes induced by aggressive
  fine-tuning, but succeeds when output diversity is preserved.'' LP compression 仍成立（free-form
  ablation 证据不受影响）。 Instance degeneracy 从 ''inevitable consequence of capability''
  变为 ''controllable artifact of training configuration''。 Paper 变 prescriptive：给出什么条件下可以/不可以用
  multi-sample 策略。 标题改为 ''When Does Multi-Sample Selection Help Structured IE? A Diagnostic
  Study of Output Convergence''。 仍冲 EMNLP Main——从 novel insight paper 转为 large-scale
  empirical study with actionable guidelines。

  '

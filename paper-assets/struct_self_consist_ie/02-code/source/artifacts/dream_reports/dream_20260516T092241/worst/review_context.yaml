  result_rationale: 'Few-NERD 打破 capability trap 的 F1→degeneracy 单调预测： F1=0.778（高于
    SciERC 0.664）但 degeneracy 仅 5.4% （远低于 SciERC 21%，更远低于 CoNLL 58%）。 按 capability
    trap 线性回归，F1=0.778 应预测 ~35-40% degeneracy。 实际偏差超过 30pp。

    低 degeneracy 的根因： (1) 实体密度高——Few-NERD INTRA 每实例平均 3.4 个实体（vs SciERC 2.1）， 更多实体意味着更多的组合变异空间。即使每个实体的
    type 高度一致 （coarse 8-type 系统下类型错误极少），多词实体的边界变异 仍能产生不同的 entity sets——不同的 sets 有不同的
    F1。 (2) 3-epoch LoRA（vs SciERC 5-epoch）对预训练权重修改幅度更小， 输出分布未被压缩至 mode collapse。
    (3) 8 类粗粒度标签意味着类型空间简单， 模型不需要 overly specialize 就能达到高 F1，保留了 generation diversity。

    Selection 首次显著有效：LP +3.2pp (p=0.028, d=0.152)。 这是全研究中首个某信号显著优于 greedy 的结果。 LP
    成功的原因：degeneracy 低 → LP 有真实 within-instance variance (median range 0.084 nats,
    是 SciERC 0.041 的 2×) → LP 可区分好坏样本。 VC +2.1pp 接近显著 (p=0.065)。SJ +1.5pp 不显著 (p=0.12)——
    SJ 的弱 rho (0.216) 限制了其 selection 能力。

    SJ rho 仅 0.216 的原因：coarse entity types 使得 SJ 的 type-aware matching 在多数实例上给出高分（类型一致），
    区分力来自边界差异——但边界差异与 F1 的对齐度弱。 LP 直接捕获 generation confidence，与 F1 的关联更强。 这是与 SciERC
    的关键区别：SciERC 上 SJ > LP (rho 0.36 vs 0.21)， Few-NERD 上 LP > SJ (rho 0.275 vs 0.216)。
    信号有效性取决于数据集特性，不存在 universal best signal。

    Capability trap R² 从 0.98 (3 datasets) 降至 0.51 (4 datasets)。 Few-NERD 是一个明确的 outlier，残差
    30.2pp。 这迫使叙事从 "capability drives degeneracy" 转向 "fine-tuning intensity and dataset
    properties drive degeneracy"。

    '

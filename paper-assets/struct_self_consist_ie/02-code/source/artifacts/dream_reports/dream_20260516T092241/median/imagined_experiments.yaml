tier: median
narrative_guidance: '将 ''capability trap'' 从 ''structural inevitability'' 弱化为 ''primary
  contributing factor alongside fine-tuning regime''。两个 failure mechanisms (degeneracy
  + LP compression) 仍完全成立——它们的证据全部来自已完成实验，不受新实验影响。调整 claims 强度：''universally fail''
  → ''predominantly fail across tested configurations''。LoRA ablation 变为 nuanced finding：''output
  convergence is driven by capability AND fine-tuning intensity, with capability as
  the dominant factor.'' 将 QE evaluation framework (Claim 2) 提升为 co-primary contribution。标题微调为
  ''Strong Predictors, Weak Selectors: Diagnosing Why...'' 强调诊断而非绝对性。目标：EMNLP Main（adjusted
  claims）或 strong Findings。'

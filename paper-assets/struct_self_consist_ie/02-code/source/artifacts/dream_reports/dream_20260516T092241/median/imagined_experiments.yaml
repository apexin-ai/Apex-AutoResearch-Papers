    greedy F1 略降（0.641 vs 0.663，-2.2pp），因为模型对 SciERC schema 的记忆不如 rank=16 完整；(2) 输出多样性更高，因为
    lower-rank adaptation 保留了更多 base model 的 stochastic behavior，degeneracy 从 21%
    降到 12%（-9pp，落入 median 范围 [5,15]）。关键逻辑：如果 degeneracy 纯粹由 capability 驱动，则 F1 降低应该已经自动解释
    degeneracy 下降（按 capability trap curve：F1 从 0.66 降到 0.64 预测 degeneracy 从 21% 降到
    ~19%，仅 -2pp）。但实际下降 9pp >> 2pp 的 capability-predicted 下降，说明 fine-tuning intensity
    本身是 independent contributing factor。Median 解读：capability trap 解释了约 22% 的 degeneracy
    reduction（2/9），fine-tuning intensity 解释了剩余 78%。但 capability 仍是跨 dataset 的 primary
    driver（CoNLL 58% vs SciERC 21% 的差异远大于 rank ablation 的 9pp）。LP compression 也略微缓解（range
    median 0.048 vs 0.041），因为 lower fine-tuning 保留了更多 generation-level diversity。Selection
    仍不显著（+0.3pp），因为即使 degeneracy 降低，LP compression 仍存在。

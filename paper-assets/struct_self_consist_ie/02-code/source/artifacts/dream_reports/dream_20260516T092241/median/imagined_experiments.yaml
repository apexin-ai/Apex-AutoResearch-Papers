  expected_results:
    contradictions_found: 3
    contradiction_1:
      location: Discussion vs Limitations
      issue: Discussion says '+0.1pp over single-sample', Limitations says '+0.4pp
        over greedy'
      resolution: 'Both refer to different comparisons: +0.1pp = best signal vs random
        single, +0.4pp (incorrect) should be +0.6pp = LP vs greedy (from exp_016_rerun_1024).
        Standardize to LP vs greedy +0.6pp throughout.'
    contradiction_2:
      location: Abstract vs Results
      issue: Abstract claims 'AUROC up to 0.82' but Results table shows max 0.749
        (EM on NER)
      resolution: '0.82 comes from CoNLL (SJ AUROC=0.8008 in exp_002, EM AUROC=0.8156).
        Must specify which dataset in Abstract or use max across all: CoNLL EM AUROC
        0.82.'
    contradiction_3:
      location: Intro vs Section 5
      issue: Intro claims '21-58% of instances produce identical F1' — percentages
        are from 1024-token data but cited numbers use mixed sources
      resolution: 'Verify degeneracy rates from consistent 1024-token runs. SciERC
        (1024): ~21% (from exp_012_rerun_1024 tied fraction). CoNLL: derive from exp_002
        data.'
    minor_issues_found: 4
    total_resolution_time_hours: 2
  result_rationale: Numerical inconsistencies 是 paper 在多轮实验迭代中积累的必然结果。本项目经历了 512→1024
    token 数据迁移、gold-empty filtering pipeline 修正、多 seed 数值更新等，每次都有部分 claims 未同步更新。Median
    tier 假设找到 3 个显著矛盾（realistic for a ~8-page paper with dense quantitative claims）而非
    catastrophic level（>5）的问题。这些都是 presentational issues 而非 methodological problems——底层实验数据一致。

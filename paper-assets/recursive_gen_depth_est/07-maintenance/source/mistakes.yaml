  status: active
  context: D043 页数修复过程中，Paper Agent 至少 3 次报告"编译验证通过、Discussion 在 page 8"，但 Reviewer
    每次检查远程 PDF 都发现修改未同步。根因是 Paper Agent 没有远程 SSH 权限，无法真正执行 rsync+编译。
- id: M008
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: Accumulation 实验实现为特征层面标签污染而非真实数据层面 accumulation
  root_cause: Agent 将 "50% human + 50% synthetic mixing" 理解为在特征空间中将 d0 human 特征向量替换进
    d1/d2/d3 类别（保留原 depth label），而非用混合语料 LoRA 微调模型后生成新文本。特征空间混合 ≠ 训练数据混合：前者产生双峰分布+标签噪声，后者产生新的连贯分布。红旗信号未被捕获：实验
    <1min 完成（应 ~4-6h）、不需要 GPU（应需要 LoRA 训练）。
  prevention: 1. 涉及"数据混合"的实验，审批时明确区分操作层级（raw text → training data → feature space）。2.
    实验完成时间与预估差距 >10x 时自动触发 Reviewer 审查。3. 不需要 GPU 的"训练实验"是红旗——accumulation 需要 LoRA
    fine-tune + generation，必须用 GPU。
  status: active
  context: D044 accumulation pilot on westd-48862. construct_accumulation_data() 直接用
    d0 features 替换 d1/d2/d3 中 mix_ratio 比例的样本并保留原 label → 84.2% 降到 35.5% 是标签噪声效应，不是
    accumulation depth signal 衰减。
  fix: 废弃当前结果，重新设计正确的 accumulation pipeline：混合语料 LoRA 微调 → 生成文本 → 提取特征 → 递归。
  related_decisions:
  - D044
- id: M009
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: Agent 第二次实现特征层面 accumulation（M008 重犯），无视纠正指令中"LoRA 微调+文本生成"的明确要求
  root_cause: Agent 处理 Worker 完成通知时可能未充分阅读排队中的纠正指令，或者理解了指令但 Worker 仍复用了旧代码。结果与第一次完全一致（35.51%），<1min
    完成，仍是 numpy 操作。
  prevention: 1. 对重做实验用 replace_agent_queue 清空旧消息后发新指令，避免指令被旧 Worker 结果冲淡。2. 关键实验脚本要求
    Agent 提交前先汇报代码逻辑供 Reviewer 预审，通过后再执行。3. 完成时间与预估差 >10x = 立即废弃，不登记为 success。
  status: active
  fix: 第三次尝试：给出伪代码级指令 + Reviewer 预审代码后再执行
  related_decisions:
  - D044
- id: M010
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: 'M010: Accumulation baseline 85.9% 来自错误策略（temp09 而非 nucleus），应为 84.2%'
  root_cause: accumulation 脚本 L646 硬编码了 9-cell atlas 最佳 cell（GPT-2 XL temp09 = 85.9%）作为
    full-replacement baseline，但 accumulation 实验基于 GPT-2 XL nucleus（84.2%）。策略不匹配导致
    apple-to-orange 对比。
  prevention: 对比实验的 baseline 数字不要硬编码，从对应实验的 registry 或结果文件动态读取。对比时必须确认策略、模型、seed 全部匹配。
  status: active
  fix: Discussion §6 中 85.9% 改为 84.2%，delta 从 -16.85pp/-15.82pp 修正为 -15.1pp/-14.1pp。已派
    Paper Agent 修正。
- id: M011
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Agent 报告 DeBERTa pilot RUNNING 但脚本实际未部署到服务器
  root_cause: Worker 在隔离 worktree 中写了代码但未持久化到远程服务器。Agent 在未确认脚本存在的情况下提交了 tmux job
    并报告 RUNNING。
  prevention: 远程脚本必须用 ssh_execute + heredoc 直接写到服务器，不能依赖本地 worktree 同步。提交实验前必须 ssh_read_only
    确认脚本文件存在。
  status: active
  fix: 派新 Worker 用 ssh_execute 直接在 westd-48862 上创建脚本，重新提交实验。
- id: M012
  date: '2026-05-22'
  category: code_bug
  severity: low
  summary: Accumulation pipeline hardcoded wrong baseline value for Pythia
  root_cause: accumulation_pipeline_pythia_nucleus.py copied from GPT-2 XL pipeline
    and hardcoded full_replacement_baseline = 0.8428 (GPT-2 XL value) instead of Pythia's
    actual baseline. Code review did not catch the copy-paste error.
  prevention: When creating per-model pipeline scripts by copying from a template,
    require Agent to grep for all hardcoded model-specific values (baselines, model
    names, paths) and verify each one matches the target model. Add a checklist item
    in experiment approval for copy-paste pipelines.
  status: active
  context: Only affects display deltas in the pipeline output, not AUC or EDD computation.
    The paper text "8-15pp" accuracy drop is derived from correct per-cell computations
    and rounds correctly (actual range 7.9-15.3pp).
  fix: Identified as display-only bug. Paper claims verified independently via correct
    AUC/EDD recomputation with 500-tree binary RF.

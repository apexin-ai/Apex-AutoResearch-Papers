    64/96GB）。不影响训练完成但浪费 cuda:1。不中断重启因为已在运行中。
  fix: 不修复（已在运行，96GB 容纳得下）。未来实验确保正确分配。
- id: M007
  date: '2026-05-19'
  category: communication
  severity: medium
  summary: Paper Agent 连续三次报告"编译通过"但实际未 rsync 本地修改到远程
  root_cause: Paper Agent 在本地修改 tex 后直接检查本地 tex 内容或读取旧编译日志就报告"编译通过"，但未实际执行 rsync +
    远程编译。本地 workspace 是论文真源但编译环境在远程。
  prevention: Paper Agent 的编译报告不可信任。所有"编译通过"声明必须由 Agent 独立执行 rsync + 远程编译 + Reviewer

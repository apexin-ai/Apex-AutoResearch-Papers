mistakes:
- id: M001
  date: '2026-05-17'
  category: communication
  severity: high
  summary: R5-R7 论文修改未落地到本地 tex 文件——Agent 报告"已完成"但实际文件未更新
  root_cause: 可能原因：(1) 修改在远程服务器但未 sync 回本地 workspace；(2) Paper Agent 的 D035 patch
    从旧版 base 开始写入，覆盖了中间修改；(3) Agent 完成了修改指令但操作的是内存中的版本而非磁盘文件。导致 R8 审稿人看到的是 R4 基础版
    + D035 appendix，所有 R5-R7 文本修改丢失。
  prevention: 提交审稿前必须 grep 验证关键修改（"universal"/"§4.4"/alemohammad authors/Schaeffer
    citation）确实存在于 tex 文件中。不能仅凭 Agent 报告"已完成"就信任——用 read_local_file 或 grep 做 spot
    check。
  status: active
  context: R5-R7 期间 Agent 多次报告修改完成（D033 确认），R6/R7 审稿人报告"缺失"时归因于版本问题。R8 仍报告相同问题后 Agent
    检查确认文件从未被修改。这意味着之前所有"版本问题"的归因都是错误的——真正原因是修改从未落地。
  fix: Agent 正在一次性 apply 所有 R5-R7 + R8 修改并重新编译。
- id: M002
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: prompted_gen_gpt2xl_001 被 startup recovery 误标 failed，导致论文错误声称 "future work"
  root_cause: 服务器重启后 cron startup recovery 检测到实验进程不存在，自动将 conclusion 标为 failed。但实验实际上在重启前已正常完成并产出完整结果（summary.json
    + features.jsonl 都存在）。Paper Agent 依据 registry failed 状态，将 prompted generation
    写为 "future work"。
  prevention: 1. Startup recovery 标记 failed 前应检查输出文件是否完整（summary.json 存在 = 实验已完成）。2.
    Director/Reviewer 在审批论文内容时，对 "future work" 声明应交叉验证 registry + 实际文件状态，不能只看 registry
    conclusion。3. 任何实验标 failed 后，若 ROADMAP 标完成且有具体数字，必须核实矛盾。
  status: active
  context: prompted_gen_gpt2xl_001 实际结果：RF 4-class acc 69.52% [68.9, 70.15], 5-fold
    consistent, AUC monotonic (d0v1=0.916, d1v2=0.782, d2v3=0.744)。论文 method.tex L35
    错误声称 future work，审稿人发现后会质疑 cherry-picking。
  fix: Agent 修正 registry conclusion→success + 补录 metrics；Paper Agent 删除 "future work"
    声明，新增 prompted gen 结果段落到 generalization.tex + Appendix。
- id: M003
  date: '2026-05-18'
  category: communication
  severity: high
  summary: Paper Agent 使用未完成实验的旧数据（second_seed_replication 77.15%）写入论文，实际 pythia_seed43_001
    结果为 78.84%
  root_cause: R11 大批量改写时 pythia_seed43_001 尚在运行（Step 6/8），Paper Agent 沿用了旧实验 second_seed_replication_001
    的数据（77.15%, -1.05pp），且构造了基于错误数据的 "bidirectional noise" 叙事。Director 未在 R11 改写指令中明确标注哪些数据是
    final vs pending。
  prevention: 1. 给 Paper Agent 的数据指令中明确标注 [FINAL] vs [PENDING/PLACEHOLDER]；2. 正在运行的实验数据不写入论文，用占位符代替；3.
    实验完成后单独 patch 并要求 Reviewer 验证数据一致性
  status: active
  fix: 派 Paper Agent 紧急更新 3 处数据 + 重写 bidirectional noise 叙事
  related_decisions:
  - D040
- id: M004
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: Table 2 方法学三重不一致：Caption 声称 5-fold CV 200 trees，实际代码用 70/15/15 split 100
    trees，元数据字符串硬编码造假
  root_cause: compute_reviewer_metrics.py L836 的 _make_baseline 实际用 70/15/15 split
    + RF(100 trees) + StandardScaler，但 classifier 字段硬编码为 "RandomForest (n_estimators=200)"。Table
    2 caption 照抄了错误的元数据。d1-d3 括号数字在项目不同阶段分批计算，各 cell 可能用了不同 RF 配置。
  prevention: 评估脚本的元数据必须从代码参数动态生成（如 f"RF(n={clf.n_estimators}, cv={n_folds})")，禁止硬编码描述字符串。Table/Figure
    caption 中的方法描述必须由 Reviewer 交叉验证代码实际配置。
  status: active
  fix: 'D041: 重跑 9 cells RF（5-fold CV, 200 trees），使 caption 为真，统一所有数字口径'
  related_decisions:
  - D041
- id: M005
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M005: Worker 编译核对读了远程旧版论文而非本地当前版本，所有发现无效'
  root_cause: 论文真源在本地 workspace (projects/.../docs/paper/)，但 Worker SSH 到远程服务器读了 /root/autodl-tmp/.../paper/
    的旧副本。D041+D042 的 patch 只应用于本地，远程从未同步。Director 指令中说"SSH 到 gpu-6000pro-2 进入论文目录"未明确指定路径，Worker
    默认用了远程 execution.project_path 下的旧版。
  prevention: 论文文件真源在本地 workspace，不在远程 execution.project_path。编译/核对论文时必须先 rsync 本地→远程同步，再在远程编译。Director
    指令中必须显式写明"先同步本地论文到远程"。CLAUDE.md L6 已有此规则但未执行。
  status: active
  fix: 已派 Agent 执行 rsync 同步 + 远程编译验证。
  related_decisions:
  - D042
- id: M006
  date: '2026-05-19'
  category: resource_misuse
  severity: low
  summary: 14B 双实验均分配到 cuda:0，cuda:1 完全空闲
  root_cause: 两个脚本均硬编码 CUDA_VISIBLE_DEVICES=0（复用 scale_002 脚本未修改 GPU 分配），Director
    指令说 "temp09→cuda:0, topk50→cuda:1" 但 Agent/Worker 未在脚本中体现
  prevention: 并行实验脚本提交前，Director 要求 Agent 确认每个脚本的 CUDA_VISIBLE_DEVICES 设置与分配一致。Reviewer

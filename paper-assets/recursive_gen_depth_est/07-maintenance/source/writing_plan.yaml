visualization_plan:

  - fig_id: fig_auc_decay
    type: statistical
    tool: matplotlib
    description: "Pairwise AUC decay curve across adjacent depth pairs (d0v1 → d4v5) with horizontal EDD threshold lines at T=0.65/0.70/0.75/0.80. Show binary pairwise AUC (solid) vs 4-class pipeline AUC (dashed) for Pythia nucleus. Mark EDD=4 crossing point."
    data_source: "registry: depth_extension_binary_pairwise_002, mvp_pipeline_pythia_002, depth_extension_pythia_d4d5_001"
    placement: atlas
    aspect_ratio: "4:3"
    notes: "X-axis: depth pair (d0v1, d1v2, d2v3, d3v4, d4v5); Y-axis: AUC; horizontal lines at T thresholds"

  - fig_id: fig_feature_trajectory
    type: statistical
    tool: matplotlib
    description: "Feature trajectory panel: top-5 features (p90_ppl, var_surprisal, mean_ppl, mean_surprisal, p75_ppl) median values across depth 0-3, one subplot per model family (3 subplots). Each subplot shows 3 strategies as different line styles. Highlights non-uniform inter-depth distances and temperature reversal."
    data_source: "registry: atlas_v2_analysis; raw feature data from 9 cell experiments"
    placement: atlas
    aspect_ratio: "16:5"
    notes: "3-panel figure (Pythia | OLMo | GPT-2 XL). Shared legend. Log-scale y-axis for PPL features."

  - fig_id: fig_atlas_heatmap
    type: statistical
    tool: matplotlib
    description: "Atlas feature importance heatmap: 9-cell grid (3 models × 3 strategies) showing top-5 feature importance values. Color = importance magnitude, cell annotation = rank. Highlights p90_ppl/var_surprisal universality."
    data_source: "registry: atlas_v2_analysis, baseline_battery_9cell_001"
    placement: atlas
    aspect_ratio: "4:3"
    notes: "Rows = features (top-5), Columns = 9 cells grouped by model. Okabe-Ito colormap."

  - fig_id: fig_confusion_matrix
    type: statistical
    tool: matplotlib
    description: "Confusion matrix heatmap for best in-distribution setting (GPT-2 XL temp09, 85.4%) and best cross-model LOO setting (OLMo holdout, 69.2%). Two-panel figure showing in-distribution vs transfer performance."
    data_source: "registry: gpt2xl_temp09_001, cross_model_loo_v1"
    placement: generalization
    aspect_ratio: "8:3"
    notes: "2-panel. Normalized by true class. Annotate counts + percentages."


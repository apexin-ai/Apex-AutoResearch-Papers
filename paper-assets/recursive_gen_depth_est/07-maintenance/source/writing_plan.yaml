# ============================================================
# WRITING ORDER (strict serial)
# ============================================================
writing_order:
  - atlas           # Section 4 — PRIMARY contribution, data-driven, write first
  - generalization   # Section 5 — secondary experiments, depends on atlas narrative
  - method           # Section 3 — formalize based on what atlas/experiments need
  - introduction     # Section 1 — frame story around established results
  - related_work     # Section 2 — position relative to intro framing
  - discussion       # Section 6 — synthesize, includes limitations
  - abstract         # condense final narrative
  - conclusion       # summarize


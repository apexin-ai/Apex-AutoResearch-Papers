  result_rationale: 'API 模型经过 RLHF/RLAIF 对齐训练，输出分布已被正则化——tail 被显著压缩， output diversity
    受限于 safety/helpfulness objectives。这与 plan_021 instruct model (47.4%) 的 finding
    一致：RLHF regularizes depth signal。 Fine-tuning API chain (~58%) 优于 prompted chain
    (~45%) 因为 fine-tuning 产生的 distributional shift 更接近我们的 benchmark 设置（LoRA fine-tune
    → generation → repeat）， 而 prompted chain 的 "recursive generation" 是通过 prompt engineering
    模拟的， degradation pattern 不同（prompt-mediated vs parameter-level shift）。 Fine-tuned
    chain 的 top features 与 base model 一致（overlap≈3/4）， 因为 tail erosion 机制仍然存在，只是被
    RLHF baseline regularization 削弱。 Prompted chain 的 feature profile 不同（surprisal_range
    上升），因为 prompt engineering 引入了额外的 style/content constraints 影响 surprisal 分布。 best
    档下，fine-tuned chain 58% 结果被写入 Appendix 作为 "API model generalization" evidence，prompted
    chain 45% 进 Discussion 作为 "generation mode affects signal strength" 的佐证。两者都 >chance
    (25%)，支持 "depth signal is a general phenomenon of iterative generation, modulated
    by RLHF and generation mode"。

    '
  tables:
  - 'Table A5: API model depth estimation (fine-tuned chain vs prompted chain vs base
    model baseline)'
  figures_description: []
  analysis: 'API model 实验是 best 档的 "nice-to-have" 而非 critical path。主要价值： (1) 扩展 generalization
    story 到商用模型生态，(2) 与 instruct model finding (47.4%) 形成一致叙事——RLHF regularizes but
    does not eliminate depth signal， (3) prompted chain 的弱信号 (45%) 揭示 generation mode
    dependence， 与 plan_016 prompted generation (69.5%) 的 fine-tuned chain 对比， 说明 fine-tuning
    vs prompting 是影响 depth signal 的关键因素之一。

    '

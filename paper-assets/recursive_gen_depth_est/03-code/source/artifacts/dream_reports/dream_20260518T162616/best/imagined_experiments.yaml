    finetuned_chain_4class_acc: 0.58
    finetuned_chain_d1v2_auc: 0.72
    finetuned_chain_d0v1_auc: 0.93
    prompted_chain_4class_acc: 0.45
    prompted_chain_d1v2_auc: 0.61
    prompted_chain_d0v1_auc: 0.78
    top_features_finetuned:
    - p90_ppl
    - var_surprisal

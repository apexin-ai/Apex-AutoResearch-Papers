  analysis: 理论 section 是 best 档能否达到 4.0 的 swing factor。 没有它，论文是 high-quality empirical
    study → 3.5。 有了它且 predictions 吻合，论文是 "theoretically grounded new task formalization
    with systematic empirical validation" → 3.8-4.0。 风险：如果理论推导过于 hand-wavy（如 contraction
    rate 的精确值依赖 未知的 model-specific constants），审稿人可能认为是 "overfitting theory to data"。
    缓解：明确报告 theoretical range [3,5] 而非点预测， 并在 Discussion 中列出理论假设的 limitations。

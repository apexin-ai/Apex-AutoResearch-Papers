    new_theorems: 0
    new_lemmas: 0
    empirical_validation_points: 3
    validation_pass_rate: 0.33
  result_rationale: 'Theory section尝试三件事：(1) 用Shumailov tail erosion解释p90_ppl/var_surprisal为何dominant——
    这是正确的但trivially follows from existing theory，不是新贡献。(2) 从Dohmatob contraction rates推导EDD上界——推导出EDD≤6，但empirical
    EDD=4，bound太松（gap=2），审稿人会说 "a bound that doesn''t bind is not a contribution"。(3)
    解释strategy-dependent convergence—— temperature的uniform logit scaling加速收敛是qualitative
    argument，无法quantify 多快或预测具体AUC值。三个validation points中只有tail erosion mechanism match（1/3），
    EDD bound不紧，strategy convergence rate无quantitative prediction。 审稿人评价："This section
    retroactively explains known model collapse dynamics using established theoretical
    frameworks. While the connections are reasonable, no new theoretical results are
    derived and no falsifiable predictions are made. The EDD bound (≤6 vs empirical
    4) is too loose to be informative." 这直接触发worst档核心假设之一。

    '
  tables:
  - 'Table: Theoretical predictions vs empirical observations (3 rows, 1/3 match)'
  figures_description:
  - 'Diagram: theoretical attractor convergence framework (qualitative)'
  analysis: 'Theory section的根本问题是从empirical observations反推theoretical explanation，
    而非从theory预测phenomena。即使explanation合理，审稿人区分explanatory power和predictive power。
    在worst档下，theory section既不产出新theorem也不产出testable prediction， 仅提供narrative coherence。这对"no
    method contribution"的审稿concern没有帮助—— 如果theory也不算contribution，论文就只剩task formalization
    + empirical atlas。 对于EMNLP Main来说，这需要atlas的发现足够novel和impactful来stand alone， 但14B弱信号和Binoculars
    baseline 63%共同削弱了impact argument。

    '
- name: api_model_recursive_chains_worst
  plan_id: plan_026
  description: GPT-4o-mini fine-tuning API递归链 + prompted recursive chain (rewrite/continue)
  expected_results:
    gpt4omini_ft_4class_acc: 0.38
    gpt4omini_ft_d1v2_auc: 0.55
    gpt4omini_ft_d0v1_auc: 0.75
    prompted_rewrite_4class_acc: 0.33
    prompted_rewrite_d1v2_auc: 0.52
    feature_overlap_with_lora: 0
    cross_method_transfer_acc: 0.27
  result_rationale: 'GPT-4o-mini的fine-tuning API限制（固定epochs、受限learning rate、safety
    guardrails） 使得递归fine-tuning的distributional shift远小于本地LoRA。模型的RLHF对齐和safety training
    作为implicit regularizer抑制了generation distribution的drift——即使fine-tune到depth 3， 输出仍被RLHF拉回safety-aligned
    distribution。4-class acc 38%仅略高于chance（25%）， d1v2 AUC 0.55接近random。Prompted rewrite
    chain更差（33%），因为"rewrite this text" 的prompt不产生与LoRA fine-tuning相同的distributional
    shift——rewrite是content-level transformation而非distribution-level collapse。Feature
    overlap为0说明API model depth signal（如果存在）的statistical signature完全不同于LoRA-induced
    signal。 cross-method transfer（用LoRA训练的RF预测API model depth）仅27%≈chance， 确认两种method产生的"depth"是fundamentally
    different phenomena。 审稿人总结："depth signal is specific to the LoRA fine-tuning mechanism,
    not a general property of recursive generation"。

    '
  tables:
  - 'Table: API model vs LoRA model depth estimation comparison'
  - 'Table: Cross-method transfer matrix'
  figures_description:
  - 'Feature trajectory comparison: API vs LoRA models across depths'
  analysis: 'API model结果在worst档下是devastating：它直接支持审稿人的"phenomenon specific to small
    base models with LoRA fine-tuning"总结。如果depth signal仅在特定fine-tuning mechanism下存在且不迁移到commercial
    API models，practical relevance严重受限。 论文只能将此定位为"important negative result that constrains
    the scope of depth estimation" 并诚实acknowledge "our framework applies to LoRA-based
    recursive generation, the dominant paradigm in current model collapse studies
    (Shumailov, Drayson), but extending to API-based or prompt-based recursion remains
    open"。 这进一步收缩了contribution scope。

    '

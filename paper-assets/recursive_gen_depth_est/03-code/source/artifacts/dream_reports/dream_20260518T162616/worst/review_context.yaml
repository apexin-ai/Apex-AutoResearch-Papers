narrative_guidance: '核心叙事从"depth estimation is feasible and robust"收缩为"characterizing
  the boundary conditions of recursive depth signal"。14B实验确认信号在主流规模下极弱（4-class acc
  ~52%，仅比instruct的47%高5pp）， 与1B-scale的70-85%形成鲜明对比。理论section尝试用capacity-dependent
  attractor convergence解释这一差异， 但未产出可验证预测，审稿人视为retrospective rationalization。Binoculars/Fast-DetectGPT
  ordinal baseline 达到63%，削弱specialized feature approach的必要性叙事。OLMo seed43 acc~72%（vs
  seed42的78.8%，Δ=6.8pp）， 暴露seed sensitivity。论文重心移至：(a)task formalization仍成立，(b)Atlas揭示scale×strategy×architecture
  三维交互（1B强/14B弱/instruct弱=完整picture），(c)负面结果的系统性价值。仍冲EMNLP Main "New Missions" track，
  reviewer avg预期2.5-3.0。

  '
imagined_experiments:
- name: 14B_scale_validation_worst
  plan_id: plan_014
  description: Qwen2.5-14B FP16 + LoRA, nucleus p=0.95, d0-d3递归链, 19特征提取 + RF/LR分类
  expected_results:
    rf_4class_acc: 0.52
    rf_4class_ci:
    - 0.505
    - 0.535
    lr_4class_acc: 0.47
    rf_3class_acc: 0.42
    auc_d0v1: 0.88
    auc_d1v2: 0.62
    auc_d1v3: 0.78
    auc_d2v3: 0.58
    edd_at_075: 1
    edd_at_070: 1
    top_features:
    - type_token_ratio
    - p90_ppl
    - rep_3gram
    - surprisal_range
    feature_top4_overlap_with_1b: 1
    finetune_loss_d1: 2.48
    finetune_loss_d2: 2.31
    finetune_loss_d3: 2.22
    delta_vs_1b_best: -0.334
    delta_vs_instruct: 0.046
  result_rationale: '14B模型有10倍于1.4B的参数量，LoRA仅调整~0.15%参数。递归fine-tuning对整体生成分布的扰动极小——
    finetune loss从d0到d1仅下降~0.17（vs 1B的~0.6-0.9），说明模型容量足以在不大幅改变distributional characteristics的情况下拟合下一深度数据。p90_ppl和var_surprisal在1B有效是因为小模型在递归fine-tuning
    中快速丢失tail distribution（Shumailov tail erosion），但14B的更大表达能力延缓了这一过程， adjacent depth之间的统计特征差异被压缩到noise
    level。d0v1仍可分（0.88）因为human vs 1st-gen 差异不依赖递归collapse，而是LoRA适配本身的distributional
    shift。但d1v2 AUC仅0.62，d2v3 0.58， 相邻深度几乎不可区分。feature ranking显著不同——type_token_ratio升至top1（因为14B在递归中
    词汇多样性下降比perplexity shift更先出现），与1B的perplexity-dominated pattern仅1个重叠。 EDD=1意味着仅binary（d0
    vs d1+）有意义，ordinal estimation在14B上实质失败。

    '
  tables:
  - 'Table: 14B vs 1B scale comparison (4-class acc, d1v2 AUC, feature overlap)'
  - 'Table: 14B per-class recall (d0 ~90%, d1 ~45%, d2 ~30%, d3 ~40%)'
  figures_description:
  - 'AUC decay curve: 14B curve平坦且快速跌破threshold，vs 1B的缓慢衰减'
  analysis: '52%的4-class acc仅比instruct model（47.4%）高4.6pp，比random chance（25%）高27pp。
    审稿人会总结为"depth signal exists but is practically negligible at 14B"。 d0v1=0.88说明binary
    detection仍work，但这不是本文的contribution（已有大量binary detector）。 Feature ranking divergence（overlap
    1/4）进一步说明1B发现的"perplexity tail universality" 不能推广到14B，是scale-specific phenomenon。论文必须将此定位为central
    finding而非limitation： "depth signal exhibits scale-dependent decay, with 14B confirming
    the theoretical prediction that higher capacity delays distributional collapse"。但这个claim需要
    theory section支撑，而theory section本身在worst档被视为post-hoc。

    '

    fpr_range_across_models:
    - 4.7
    - 34.0
  result_rationale: '已有实验显示wild data FPR在不同reference model间差异巨大（OLMo C4 FPR=4.7% vs
    Pythia=20.2% vs GPT-2 XL=22.4%）。3-model ensemble的cross-model agreement在d0上reasonable（~65%），
    但在d1+上极低（~20%），因为不同reference model的decision boundary位于feature space的不同位置。 RedPajama结果会进一步放大这一不一致性，因为其内容多样性（代码、书籍、Common
    Crawl混合） 比C4/FineWeb更heterogeneous。Cohen''s kappa ~0.31表示fair agreement，远未达到 "reliable
    depth estimation in the wild"的标准。审稿人会指出：如果三个reference model 对同一文本的depth预测不一致，那么depth
    estimation的"practical relevance"存疑。 论文需诚实报告cross-model consistency低，定位为"future
    work需要reference-model-invariant features或ensemble calibration"。

    '

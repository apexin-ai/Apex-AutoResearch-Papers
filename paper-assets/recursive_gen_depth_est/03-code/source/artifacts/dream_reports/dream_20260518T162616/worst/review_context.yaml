    binoculars_best_cell_acc: 0.71
    binoculars_worst_cell_acc: 0.52
  result_rationale: 'Binoculars和Fast-DetectGPT的连续分数本质上捕捉了text的"synthetic-ness"程度，
    而递归深度越大text越"synthetic"，所以这些分数天然具有与depth的单调相关性。 在worst档下，Binoculars利用cross-entropy和perplexity
    ratio的连续值， 通过CORAL ordinal regression校准后可达65%——这比RF的78.3%低13pp， 但比chance（25%）高40pp，比instruct
    model结果（47%）高18pp。 关键问题是在部分weak cells（topk50）上，Binoculars（58%）接近或超过RF（69.6%， topk50
    worst cell），gap缩小到<12pp。Fast-DetectGPT稍弱因为其perturbation-based approach对ordinal
    gradient不如Binoculars的direct score sensitive。 审稿人看到63%的baseline后会质疑：19个手工特征+RF相比现成detector仅提升15pp，
    是否justify了额外的complexity？这削弱了"task需要specialized approach"的叙事， 使论文更像"incremental
    improvement over existing detectors"而非"new task formalization"。

    '

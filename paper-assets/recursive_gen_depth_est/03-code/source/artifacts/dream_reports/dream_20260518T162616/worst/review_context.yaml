  analysis: '63%的Binoculars baseline是worst档最具杀伤力的结果之一。它不会摧毁论文（RF仍consistently优15pp+），
    但它将审稿人的framing从"new capability enabled by our approach"转向"marginal improvement
    over repurposed existing tools"。论文需要argue：(a)这15pp在depth 1-3区分上更大 （Binoculars的3-class仅55%
    vs RF的72%），(b) Binoculars的ordinal signal来自binary synthetic-ness的monotonic proxy而非genuine
    depth features，(c) RF的feature importance analysis提供interpretability that Binoculars
    black-box score cannot。 但审稿人可能不买账——"interpretability is a soft argument"。

    '

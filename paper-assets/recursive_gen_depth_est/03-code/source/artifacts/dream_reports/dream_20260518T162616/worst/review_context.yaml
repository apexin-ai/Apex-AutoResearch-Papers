  description: C4/FineWeb/RedPajama子集，用3个已训练reference model提取19特征，3×3 RF分类器做depth预测+分布分析
  expected_results:
    c4_cross_model_d0_agreement: 0.61
    c4_cross_model_d1plus_agreement: 0.23
    fineweb_cross_model_d0_agreement: 0.68
    fineweb_cross_model_d1plus_agreement: 0.19
    redpajama_d0_pct_pythia: 0.72
    redpajama_d0_pct_olmo: 0.91
    redpajama_d0_pct_gpt2xl: 0.69

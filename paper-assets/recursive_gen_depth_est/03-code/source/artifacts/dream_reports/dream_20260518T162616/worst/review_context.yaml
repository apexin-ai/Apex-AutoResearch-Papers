    3 reference models)'
  - 'Table: Per-model FPR comparison across 3 web corpora'
  figures_description:
  - 'Heatmap: cross-model agreement rate by predicted depth class'
  analysis: '野生数据校准在worst档下暴露了方法的fundamental deployment gap：在controlled setting中 reference
    model choice对acc影响仅~4pp（ref_model_ablation_001），但在wild data中 因为没有ground truth
    depth label，cross-model disagreement直接变成uncertainty。 FPR从4.7%到34%的range使得任何single-model
    depth prediction都不可信。 这与14B信号弱共同构成"practical relevance unclear"的审稿人总结。 论文应将此定位为"open
    challenge"而非failure，但不能claim wild data applicability。

    '
- name: detector_ordinal_baseline_worst
  plan_id: plan_018
  description: Binoculars + Fast-DetectGPT连续分数校准为ordinal depth bins, 在3×3已有数据上评估
  expected_results:
    binoculars_4class_acc: 0.63
    binoculars_4class_ci:
    - 0.615
    - 0.645
    binoculars_d1v2_auc: 0.72
    binoculars_d2v3_auc: 0.65
    binoculars_3class_acc: 0.55
    fastdetectgpt_4class_acc: 0.58
    fastdetectgpt_d1v2_auc: 0.68
    fastdetectgpt_d2v3_auc: 0.61
    binoculars_coral_4class_acc: 0.65
    fastdetectgpt_coral_4class_acc: 0.6
    rf_19feat_baseline: 0.783

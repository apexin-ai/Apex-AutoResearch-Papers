  - 'Table: Per-class recall variance across seeds'
  figures_description:
  - 'Error bar plot: seed42 vs seed43 accuracy with CIs for all 3 models'
  analysis: 6.8pp的seed sensitivity是worst档中第二具杀伤力的结果（仅次于14B弱信号）。 它不仅影响OLMo自身的结果可信度，还cast
    doubt on整个3×3矩阵中仅跑了1个seed的其他cells。 Pythia seed delta仅0.6pp说明seed sensitivity是model-dependent的，
    但审稿人会argue "without multi-seed results for all cells, we cannot know which other
    cells have OLMo-like sensitivity"。论文必须加入variance analysis section （worst档核心假设之一），报告已有的3-model
    2-seed results，并在limitations中 明确承认seed sensitivity as a systematic uncertainty。

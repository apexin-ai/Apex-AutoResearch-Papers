  result_rationale: 'OLMo-1B在seed42下是3×3矩阵中表现中等的模型（78.8%），但seed43在worst档下暴露 显著sensitivity。Δ=6.8pp远超GPT-2
    XL（Δ=2.0pp）和Pythia（Δ=0.6pp）。 根本原因是OLMo-1B的Dolma训练数据和模型架构使其对LoRA初始化seed更敏感—— 不同seed下LoRA权重收敛到不同local

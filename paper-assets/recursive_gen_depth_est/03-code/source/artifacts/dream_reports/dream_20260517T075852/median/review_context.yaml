- name: Prompted Generation Ecological Validity
  plan_id: plan_016
  description: 'GPT-2 XL topic-seeded d0-d3 递归链。用 ~10 个 topic prompt 前缀替代 BOS 无条件生成，
    验证 depth signal 是否为无条件生成的 artifact。d0 = base GPT-2 XL 有 prompt 生成， d1-d3 = 递归

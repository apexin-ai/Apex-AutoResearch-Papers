  ordinal ≤35% (plan_018) 确认 ordinal depth 是全新能力， 与 RF 78.3% 形成 43+pp 对比。三条 Claims
  全部满强度： Claim 1 — 1B→14B scale + prompted gen + 3/3 seed stability (Δ<3pp) 完整支撑 "feasible,

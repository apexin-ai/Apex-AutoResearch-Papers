- name: Existing Detector Ordinal Baseline (Binoculars + Fast-DetectGPT)
  plan_id: plan_018
  description: '将 Binoculars (Hans et al., ICML 2024) 和 Fast-DetectGPT (Bao et al.,
    2024) 的 连续分数校准为 ordinal depth bins。在 3×3 benchmark 数据上跑推理，optimal threshold  search
    做 4-class assignment。评估 d0/d1/d2/d3 区分能力。

    '
  expected_results:
    binoculars:
      ordinal_4class_acc: 0.35
      ordinal_4class_ci:
      - 0.32
      - 0.38
      binary_d0v1_auc: 0.96
      ordinal_d1v2_auc: 0.56
      ordinal_d2v3_auc: 0.53
      per_class_recall:
        d0: 0.85
        d1: 0.25
        d2: 0.15
        d3: 0.18
      per_class_f1:
        d0: 0.62
        d1: 0.22
        d2: 0.14
        d3: 0.17
      confusion_pattern: d1/d2/d3 heavily confused; most non-d0 samples assigned to
        d1 or d3 bins
    fast_detectgpt:
      ordinal_4class_acc: 0.31
      ordinal_4class_ci:
      - 0.28
      - 0.34
      binary_d0v1_auc: 0.93
      ordinal_d1v2_auc: 0.54
      ordinal_d2v3_auc: 0.52
      per_class_recall:
        d0: 0.82
        d1: 0.2
        d2: 0.12
        d3: 0.15
      per_class_f1:
        d0: 0.58
        d1: 0.18
        d2: 0.11
        d3: 0.14
      confusion_pattern: even worse d2 discrimination; curvature metric saturates
        for synthetic→deeper-synthetic
    our_rf_reference:
      4class_acc: 0.783
      gap_vs_binoculars_pp: 43.3
      gap_vs_fdgpt_pp: 47.3
    existing_detector_ordinal_acc_range:
    - 0.31
    - 0.35
  result_rationale: 'Binoculars 计算双模型 perplexity 比值（observer/performer），Fast-DetectGPT
    计算条件概率 曲率（扰动法）。两者都是为 binary real-vs-synthetic 边界设计的，在 d0v1 上表现优秀 (AUC >0.93) 因为
    human-vs-machine gap 正是其目标信号。

    但 d1→d2→d3 的渐进退化涉及远更微妙的分布偏移，单一标量分数无法解析： (a) 一维分数将多维 depth degradation trajectory
    压缩到一个轴上，丢失了 19 维特征空间中 编码的 ordinal 信息； (b) Binoculars 的 perplexity 比值捕获平均质量下降，但无法区分
    tail-specific erosion  （p90_ppl 差异），而这正是 d1 vs d2 的核心区分信号； (c) Fast-DetectGPT
    的曲率度量对 human→synthetic 的尖锐转变敏感，但对 synthetic→deeper-synthetic  饱和（曲率变化在 d1 之后趋于平缓）。

    d1/d2/d3 的分数分布严重重叠（预计相邻 depth 的 Kolmogorov-Smirnov D ≈ 0.08-0.12）， 使得 threshold-based
    ordinal assignment 对非 d0 类近似随机。

    最终 4-class accuracy：d0 被良好分离 (~85%/82% recall) 贡献 ~21%/20.5% 整体 accuracy， d1/d2/d3
    各 ~20%/15%/18% recall 贡献 ~15%/10%/13%。加权后 Binoculars ~35%, FDGPT ~31%。

    Binoculars 略优于 FDGPT (~4pp) 因为其双模型设计对渐进质量退化有略好的敏感度， 但两者都远低于 RF 78.3% (差距 43-47pp)，确认
    ordinal depth estimation 是全新能力， 不可通过复用 binary detector 实现。

    '
  tables:
  - 'Table 3: Existing detector ordinal performance vs our methods — Binoculars, Fast-DetectGPT,
    RF, CORAL, DivEye'
  - 'Table S3: Per-class recall/F1 for all methods, highlighting d2 as universal hardest
    class'
  figures_description:
  - 'Figure 4: Score distribution histograms (4 panels: d0/d1/d2/d3) for Binoculars
    和  Fast-DetectGPT。d0 分布清晰分离；d1/d2/d3 分布严重重叠。 Annotation 标注 overlap regions。与 19-feature
    RF 的 per-class AUC 对比放在 subplot。

    '
  - 'Figure S2: Pairwise ROC curves — Binoculars/FDGPT vs RF at d0v1, d1v2, d2v3。
    d0v1 三者接近；d1v2 和 d2v3 差距急剧拉开。

    '
  analysis: 'Dream 三档一致指出的 #1 缺口，现已填补。Binoculars/FDGPT ordinal ≤35% vs RF 78.3%  形成论文中最有力的对比数据点。直接验证核心前提：ordinal
    depth 是新任务，需要新方法。 同时加强 "no novel method" 防线——贡献不是 RF（分类器选择），而是 19 维特征空间 +  task
    formalization 使 ordinal discrimination 成为可能，而既有工具完全做不到。 论文措辞："State-of-the-art
    binary detectors achieve only 31-35% ordinal accuracy,  confirming that depth
    estimation requires the multi-dimensional feature space we propose."

    '

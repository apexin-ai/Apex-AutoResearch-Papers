imagined_experiments:
- name: 14B Clean FP16 Scale Validation
  plan_id: plan_014
  description: 'Qwen2.5-14B FP16 (无量化) on 96GB RTX PRO 6000。Nucleus p=0.95，d0-d3 递归
    LoRA  fine-tuning 链。Pythia-1.4B reference model 提取 19 维统计特征。RF/LR 5-fold CV。 Binary
    pairwise d0-d5 确定 EDD。验证 depth signal 在 14B 规模是否持续。

    '
  expected_results:
    rf_4class_acc: 0.76
    rf_4class_ci:
    - 0.745
    - 0.775
    lr_4class_acc: 0.72
    lr_4class_ci:
    - 0.705
    - 0.735
    rf_3class_acc: 0.71
    rf_3class_ci:
    - 0.692
    - 0.728
    pairwise_auc_rf:
      d0v1: 0.988
      d0v2: 0.997
      d0v3: 0.999
      d1v2: 0.87
      d1v3: 0.975
      d2v3: 0.79
    per_class_recall:
      d0: 0.97
      d1: 0.82
      d2: 0.58
      d3: 0.72
    per_class_f1:
      d0: 0.96
      d1: 0.81
      d2: 0.6
      d3: 0.7
    top_features:
    - p90_ppl (0.19)
    - var_surprisal (0.16)
    - p75_ppl (0.11)
    - mean_surprisal (0.09)
    - mean_ppl (0.07)
    feature_overlap_with_1b_top2: 2
    finetune_losses:
      depth_0: 1.95
      depth_1: 1.25
      depth_2: 0.92
    binary_pairwise_auc:
      d1v2: 0.93
      d2v3: 0.86
      d3v4: 0.76
      d4v5: 0.69
    edd_at_075: 4
    code_contamination_narrow_max: 0.02
  result_rationale: '14B 模型容量 ~10x 于 1B，每步递归 fine-tuning 产生的分布偏移更小（更强的模型更接近地复制训练数据），
    导致 per-step 特征差异压缩。这解释了 ~4pp 的准确率下降（76% vs 1B nucleus 均值 80.1%）。

    但 tail erosion 机制 (Shumailov 2024) 是 scale-invariant 的：递归训练在有限样本上系统性地 under-represent
    低概率事件，与模型大小无关。因为采样过程本身截断了真实分布的尾部——无论模型多大， 从有限样本 fine-tune 都会丢失 tail events。p90_ppl
    直接度量这种 tail contraction（每步递归 第 90 百分位 per-token perplexity 下降），var_surprisal 捕获
    surprisal 分布随分布集中向 mode  的收窄。两者在 14B 仍然 top-2/3 是因为度量的是文本分布属性而非模型架构属性。

    EDD=4 匹配 1B 是因为：更大模型的更慢收缩率被 reference model (Pythia-1.4B) 对更精细分布差异的 同样降低的敏感度所抵消——14B
    d3 和 d4 的差异更微妙，但 Pythia 对 14B 生成文本的基线敏感度也更低 （domain shift），两个效应大致相消，使得 AUC=0.75
    阈值在同一相对位置（depth 4）被达到。

    d3v4 AUC 0.76（刚过阈值）反映 depth 4 的信号仍可检测但微弱；d4v5 0.69 跌破阈值，符合几何收敛 到 attractor 的预期。d2
    recall 最低 (0.58) 与 1B 模式一致——d2 被夹在 d1 和 d3 之间， 是最难区分的 depth class。

    '
  tables:
  - 'Table 2: Scale validation — Qwen2.5-14B row alongside 3×1B models (4-class acc,
    d1v2 AUC, EDD)'
  - 'Table S2: 14B per-class precision/recall/F1 + binary pairwise AUC for EDD determination'
  figures_description:
  - 'Figure 5 (AUC decay overlay): X-axis depth pairs (d1v2...d4v5), Y-axis binary
    AUC。 14B 曲线 (实线, 红色) 叠加在 3 条 1B 曲线 (虚线) 上。水平线 T=0.75。 四条曲线都在 d3v4 穿越阈值、d4v5 跌破——视觉上一致的
    EDD=4。 14B 曲线略低于 GPT-2 XL 但在 Pythia/OLMo 范围内。

    '
  - 'Figure 6 (Feature importance comparison): Grouped bar chart, 4 models × top-5
    features。 p90_ppl 和 var_surprisal 在所有 4 个模型中标注为 top-3——视觉确认 scale-invariant  feature
    universality。

    '
  analysis: '14B 结果直接启用 Claim 1 中 "1B-14B scale robustness" 子句。76% 是 chance (25%)
    的 3 倍， 确认 ordinal depth signal 在主流模型规模持续存在且无需量化（消除 7B QLoRA 矛盾结果的干扰）。 Feature
    universality 现在覆盖 4 个模型家族、10+ settings——论文最强实证发现。 EDD=4 跨尺度一致性将 Atlas 从 "1B-only
    observation" 升级为 "scale-invariant structural  property of recursive generation"。~4pp
    下降是预期中的且可解释（larger model, slower collapse）， 不是弱点而是支撑 tail erosion 理论的额外证据。

    '

      '
    expected_results:
      data:
        model: GPT-2 XL (1.5B)
        strategy: nucleus_p095
        generation_mode: topic-seeded
        prompt_templates: 10
        depths: 4
        samples_per_depth: 5000
        reference_model: Pythia-410M
      four_class:
        rf_accuracy: 0.67
        rf_accuracy_ci:

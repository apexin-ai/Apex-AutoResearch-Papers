      曲线在显著更低位置且可能呈 U-shape（d1v2=0.62, d2v3=0.56, 可能 d3v4 轻微回升）。EDD threshold lines
      at T=0.70/0.75 将 13B 的 EDD 压到 1-2。'
    - 'Fig S2: Finetune loss curve comparison — 1-1.5B 曲线陡峭（2.2→1.0 across 3 depths），13B
      曲线平坦（1.85→1.31），说明 LoRA 在 14B 上的 per-depth distributional shift 远小于 1-1.5B。'
    analysis: '13B 结果证实 worst tier 核心假设：Pythia reference model 对大规模模型输出的 perplexity
      特征区分力本质受限。55% 4-class accuracy 虽然显著高于 chance（25%）， 但相比 1-1.5B 的 70-85% 有 >20pp
      衰减。更关键的是 EDD=1，意味着 ordinal depth estimation 在 13B 条件下实质退化为 binary detection。

      叙事处理：此结果不写入 Limitations，而是写入 Section 6 "Boundary Conditions" 的 Scale Dimension
      子节。结论："feature-based depth estimation captures a real signal at 14B scale (55%
      vs 25% chance, p<0.001), but the signal is severely attenuated compared to 1-1.5B,
      with EDD collapsing from 3 to 1. The primary bottleneck is the cross-scale perplexity
      measurement gap: a 160M reference model''s perplexity landscape compresses the
      depth gradient of 14B outputs."

      这为 future work 指出明确方向：(1) scale-matched reference models（用 7B 作为 14B 的 reference），(2)
      reference-free features（但 reference_free_baseline_001 已证明 reference-free 在 1-1.5B
      上就差 25pp），(3) 直接使用 14B 自身的 internal representations 而非外部 perplexity。

      '

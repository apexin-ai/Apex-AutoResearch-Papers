  - name: Prompted generation ecological validity (GPT-2 XL, topic-seeded)
    plan_id: plan_016
    description: 'GPT-2 XL nucleus p=0.95，用 topic prompt 前缀（"The following article
      discusses..."等） 生成 d0，LoRA fine-tune 后生成 d1-d3，提取 19 特征 + RF 分类。验证 depth signal
      是否为 BOS-seeded 无条件生成的 artifact。

      '
    expected_results:
      four_class_acc_rf: 0.5
      four_class_acc_rf_ci:

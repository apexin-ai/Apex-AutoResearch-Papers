    result_rationale: 'Worst tier 预期 FPR 在 23-30% 范围，与已有 wild data 结果一致但偏高端。

      机制分析：(1) RedPajama 包含大量 CommonCrawl 数据，其中 template content、 SEO 文本、自动生成的产品描述占比显著。这些文本的统计特征（高
      rep_3gram/rep_4gram、 低 type_token_ratio、异常 p90_ppl）与递归生成文本在特征空间中重叠，导致误分类。 已有证据：C4
      FPR=20.2%（Pythia）、FineWeb FPR=19.5%，但 RedPajama 的 CommonCrawl 质量过滤比 C4 更宽松，预期
      FPR 更高。

      (2) Dolma 由 AI2 策划，含 CommonCrawl + Wikipedia + Books + GitHub + arXiv 等 多域混合。Wikipedia/Books
      子集 FPR 极低（参考 WikiText 0% FPR），但 CommonCrawl 子集拉高整体 FPR。混合后预期 FPR ~23.5%。

      (3) Cross-model FPR 一致性差（range=18pp）是因为不同 reference model 的 perplexity landscape
      对 web 噪声的敏感度不同——OLMo 在 Dolma 上训练（域匹配），FPR 较低（参考 olmo_calibration_001 C4 FPR=4.7%），而

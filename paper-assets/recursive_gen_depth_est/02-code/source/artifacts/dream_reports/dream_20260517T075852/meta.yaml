    analysis: 'Two-stage pipeline 在 worst tier 下证实了 Claim 3 的失败：strategy classifier
      的 57.5% 准确率是结构性瓶颈，不是可以通过调参或更多数据解决的——19 个特征 从设计上就不携带足够的策略判别信息。Pipeline 不仅没有改善跨策略性能，反而因为
      misrouting penalty 比 naive pooling 差 1.4pp。

      对论文结构的影响：Claim 3 从独立 contribution 降为 Discussion future work， 措辞改为 "We explored
      a two-stage strategy-aware pipeline and found that while oracle strategy identification
      perfectly recovers within-strategy accuracy (78.4% vs 78.2%), strategy classification
      from the same 19 perplexity features reaches only 57.5% — insufficient to outperform
      naive pooling (70.6% vs 72.0%). This reveals that perplexity summary statistics,
      while effective for depth discrimination, do not carry sufficient information
      to distinguish decoding strategies. Future work should explore strategy-specific

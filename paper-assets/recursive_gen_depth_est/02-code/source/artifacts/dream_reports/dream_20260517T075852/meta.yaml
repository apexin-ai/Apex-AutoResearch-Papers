      叙事处理：此结果写入 Section 6 "Boundary Conditions of the Depth Signal" 的 Generation
      Mode Dimension。关键措辞："The depth signal is substantially attenuated under prompted
      (topic-seeded) generation — 4-class accuracy drops from 85.4% (BOS-seeded) to
      50.0% (prompted), with EDD collapsing from 3 to 1. This indicates that a significant
      portion of the BOS-seeded depth signal arises from the unconstrained distributional
      freedom of unconditional generation, which LoRA fine-tuning can fully exploit
      at each depth iteration. Prompted generation constrains this freedom, compressing
      the per-depth distributional shift and reducing the feature-space gradient available
      to classifiers."

      好消息：feature importance 结构保留（p90_ppl/var_surprisal 仍 top-2），说明 信号的性质不变（同类特征仍最有信息量），只是幅度衰减。这支持"信号是真实的但

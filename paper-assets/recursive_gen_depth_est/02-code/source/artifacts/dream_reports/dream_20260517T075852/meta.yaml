      成为一个明确的 boundary condition 而非已解决的问题。 这与 "diagnostic/boundary characterization
      paper" 定位一致。

      '
  - name: Cross-strategy two-stage pipeline (strategy clf + conditioned depth)
    plan_id: plan_017
    description: '两阶段方案：(a) 19 特征 → 3-class strategy classifier (nucleus/temp/topk)，
      (b) 识别策略后用策略专属 RF 估深度。解决 59.1% 跨策略准确率问题。

      '
    expected_results:
      strategy_clf_overall_acc: 0.575
      strategy_clf_per_model:
        pythia: 0.523
        olmo: 0.548
        gpt2xl: 0.654
      strategy_clf_per_strategy_recall:
        nucleus: 0.662
        temp09: 0.467
        topk50: 0.597
      predicted_two_stage_acc:
        pythia: 0.693
        olmo: 0.695
        gpt2xl: 0.73
        mean: 0.706
      naive_pooled_acc:
        pythia: 0.709
        olmo: 0.712
        gpt2xl: 0.739
        mean: 0.72
      oracle_two_stage_acc:
        pythia: 0.746
        olmo: 0.785
        gpt2xl: 0.82
        mean: 0.784
      within_strategy_ref_acc:
        pythia: 0.745
        olmo: 0.784
        gpt2xl: 0.816
        mean: 0.782
      predicted_vs_naive_gap_pp: -1.4
      oracle_vs_within_gap_pp: 0.2
      strategy_clf_bottleneck: true
      temp09_clf_recall: 0.467
      temp09_misclass_as_nucleus_pct: 38
    result_rationale: 'Worst tier 核心问题：strategy classifier 准确率仅 57.5%（chance=33.3%），
      远低于预期的 >90%，导致 predicted two-stage（70.6%）反而低于 naive pooled （72.0%），pipeline
      无实际价值。

      机制分析：

      (1) 策略不可分性的根因：19 个 perplexity/surprisal 统计特征的设计目的是 捕捉深度信号，不是策略信号。深度梯度（across
      depths within a strategy）远大于 策略梯度（across strategies within a depth）——这恰恰是深度估计成功的原因，
      但也是策略分类失败的原因。三种策略在 depth-0 上使用相同 base model 生成， 特征完全相同；depth-1+ 的策略差异主要体现在 token-level
      分布形状（nucleus 截断 vs temperature 缩放 vs topk 截断），而 19 个 summary statistics 将 500
      tokens 的 token-level 信息压缩为单个数值，丢失了大部分策略判别信息。

      (2) Temperature 最难分类（recall 46.7%）：temperature sampling 的均匀 logit 缩放不改变 token
      rank order，只改变 softmax 后的概率分布平滑度。在 Pythia reference model 的 perplexity 视角下，这种平滑度变化被
      mean_ppl 和 p90_ppl 部分吸收但不够 distinctive——temperature 的很多样本在特征空间中落入 nucleus 和
      topk 的重叠区域。38% 的 temp09 样本被误分为 nucleus，因为两者的 perplexity 尾部分布高度相似（nucleus 截断概率
      < 0.05 的 tokens，temperature 降低但保留 所有 tokens 的概率——在 Pythia 眼中，两者都产生 "somewhat
      surprising" 的输出）。

      (3) Predicted < Naive 的数学原因：设 strategy clf error rate = e ≈ 0.425。 误分类的样本被送入错误的
      strategy-conditioned depth classifier，其性能等于 cross-strategy LOO 水平（~59%）。正确分类的样本使用
      within-strategy classifier （~78%）。加权平均：0.575 × 0.78 + 0.425 × 0.59 = 0.449 +
      0.251 = 0.700 ≈ 70.6%。 Naive pooled（全部数据 train single RF）≈ 72%，因为 pooling 虽然模糊了策略边界，
      但避免了 misrouting 的惩罚。当 strategy clf acc < ~75% 时，two-stage 数学上 必然劣于 naive pooled。

      (4) Oracle vs within-strategy gap 仅 0.2pp（78.4% vs 78.2%），完美验证了 理论：如果策略已知，conditioned
      depth estimation 可以完全恢复 within-strategy 性能。但这是 oracle 条件——现实中策略未知，pipeline 的瓶颈完全在策略识别环节。

      (5) Worst tier 结论：strategy classification 准确率无法超过 60%（因为 19 个 特征的设计先天不适合策略判别），predicted
      two-stage 始终 ≤ naive pooled， pipeline 无实际部署价值。Claim 3 不具备作为独立 contribution 的条件。

      '

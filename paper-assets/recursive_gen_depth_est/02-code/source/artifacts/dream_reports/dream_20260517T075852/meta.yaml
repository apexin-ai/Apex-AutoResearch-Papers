    thin (1 model, 1 strategy) |

    | Wild-data Calibration (plan_015) | Deferred to AAAI; mentioned in Limitations
    | Acceptable deferral |

    | Prompted Generation (plan_016) | Covered (Sec 5.3, Tables 6-8) | Present but
    narrow (1 model, 10 prompts) |

    | Cross-Strategy Pipeline (plan_017) | Fully covered (Sec 5.4, Tables 9-11) |
    Complete and well-analyzed |


    **Coverage**: 4 of 5 non-cancelled experiments are covered. The wild-data deferral
    is acceptable given the paper''s scope. No critical experiments are missing from
    the design, though depth of coverage varies.


    ---


    ## 6. Actionable Recommendations (Priority-Ordered)


    ### Must-Fix for Main Conference Resubmission

    1. **Add existing detector comparison**: Run Binoculars and/or Fast-DetectGPT
    on the benchmark, threshold scores into ordinal bins, report accuracy. Even a
    negative result is highly valuable.

    2. **Strengthen scale validation**: Add at least one more model family at 7B+
    scale (e.g., Llama-3-8B or Mistral-7B) under nucleus sampling. Alternatively,
    qualify "scale-dependent" claims to acknowledge the single-model limitation.

    3. **Complete statistical reporting**: Add bootstrap CIs to all Table 1 entries.
    Add significance tests (paired bootstrap or McNemar''s) for key comparisons (1B
    vs 14B, BOS vs prompted, within vs pooled).

    4. **Fix figure compilation**: Ensure all referenced figures appear in the submitted
    PDF. The Atlas contribution depends heavily on visual presentation.


    ### Should-Fix

    5. **Add fine-tuning sensitivity**: Vary lr by 2x and epoch count (1, 3, 5) to
    show depth signal robustness to fine-tuning recipe.

    6. **Expand prompted evaluation**: Test on at least one additional model beyond
    GPT-2 XL; vary prompt diversity.

    7. **Strengthen Related Work**: Add 8-10 references covering recent detection
    methods (DNA-GPT, RADAR), model collapse mitigation strategies, and data contamination
    detection work.

    8. **Recalibrate practical claims**: The abstract and introduction should more
    clearly scope the contribution to controlled settings, acknowledging cross-strategy
    fragility and web-crawl FPR.


    ### Nice-to-Have

    9. **Reference model ablation in main text**: Briefly discuss sensitivity to reference
    model choice.

    10. **Unify Atlas framing**: Either provide a more cohesive theoretical framework
    connecting the four Atlas dimensions, or rename it to avoid overpromising.


    ---


    ## 7. Overall Assessment


    This paper introduces a genuinely useful new task (ordinal generation depth estimation)
    and provides the first systematic empirical investigation across models, strategies,
    and scales. The Depth Degradation Atlas contains several interesting findings,
    particularly the strategy-dependent trajectory reversal and the scale-dependent
    EDD concept. The honest reporting of negative results and signal attenuation builds
    scientific credibility.


    However, the paper falls short of EMNLP Main acceptance for three reasons: (1)
    the absence of existing detector baselines leaves the necessity of the proposed
    approach unestablished; (2) the technical pipeline (RF on perplexity features)
    is methodologically lightweight; and (3) the gap between controlled experiments
    and real-world applicability (20% web-crawl FPR, 59.1% cross-strategy LOO, single-model
    scale validation) limits the practical impact claimed in the framing.


    The paper is well-suited for **EMNLP Findings** in its current form and could
    reach **Main conference** with the must-fix revisions above, particularly the
    existing detector comparison and strengthened statistical reporting.


    **Converged Overall Score: 3.0 (Findings acceptance)**


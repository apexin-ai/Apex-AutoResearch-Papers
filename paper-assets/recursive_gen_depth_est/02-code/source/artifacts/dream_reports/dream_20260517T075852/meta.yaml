        ks_test_var_surprisal_p_value: 0.41
        note: Feature distributions not significantly different between BOS and prompted
          generation (p>0.05 for top-5 features)
    result_rationale: 'Prompted generation 为何不破坏 depth signal：topic prompt 仅约束生成文本的
      semantic domain， 但不改变 recursive fine-tuning 引入的分布收敛机制。LoRA 参数更新编码的是 "如何从当前分布
      生成下一层" 而非 "生成什么内容"。因此 depth-related distributional shift（p90_ppl 单调衰减、 var_surprisal
      收缩）在 prompted 模式下同样发生。92.8% 的 retention 略优于 85% 下限， 原因是 topic prompt 实际上 reduces
      variance by constraining the generation space， 使得每个 depth 的样本更加 homogeneous，RF
      的决策边界更 clean。d1v2 AUC 从 BOS 的 0.937 降至 0.896 的轻微下降来自 topic conditioning 在 d1
      层引入的额外 lexical diversity （topic-relevant vocabulary 抵消了部分 diversity collapse），但效应较小。关键：如果
      depth signal 是 BOS unconditional generation 的 artifact（如 reviewer 可能质疑），那么 prompted
      模式下信号应显著衰减或消失；92.8% retention 直接反驳这一质疑。

      '

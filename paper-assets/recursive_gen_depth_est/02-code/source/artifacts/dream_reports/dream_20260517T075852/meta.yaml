      → 接近 within-strategy acc (78.2%)；strategy clf 错误时 → misrouted 到错误 strategy RF
      → acc 大幅下降。81.2% 正确率意味着 ~81% 样本获得 near-optimal depth estimation，~19% 受 misrouting
      penalty。Oracle two-stage (78.4%) ≈ within-strategy (78.2%)（gap 仅 0.2pp）证明架构上限正确，只需提升策略分类即可逼近。
      GPT-2 XL 策略分类最高（85.6%）因为其三策略间 feature gap 最大（与 depth signal 最强一致）。 temp09 recall
      最低（73-79%）因为 temperature 的 probability shape 在中间 depth 与 nucleus 有部分重叠（两者都产生
      smooth distribution），但新增的 top1_prob_mean 和 prob_mass_top10 仍能有效区分。

      '

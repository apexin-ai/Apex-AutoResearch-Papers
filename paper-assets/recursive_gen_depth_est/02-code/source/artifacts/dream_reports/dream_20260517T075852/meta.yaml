      (4) Calibration 差（Brier score 0.28）说明分类器的置信度在 wild data 上不可靠， 限制了任何基于预测概率的 graduated
      curation 方案。

      这些结果证实：controlled-setting 训练的分类器在 wild data 部署面临严重的 domain shift 问题，FPR 的高方差（12-30%

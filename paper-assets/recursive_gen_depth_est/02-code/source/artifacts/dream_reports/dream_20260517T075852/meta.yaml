    result_rationale: 'DCOL 的根本失败是 representation bottleneck：RoBERTa-large [CLS] embedding
      编码语义

      内容而非 distributional depth signal。消融任一组件不改变此限制。attractive-only 去除

      inter-class repulsion → embedding collapse（v1-v3 已验证此模式）；repulsive-only 丧失

      ordinal structure → 退化为普通多类对比；no-margin-schedule 移除课程学习但 representation

      quality 不变。所有变体均会在 train 75% vs val ~60-64% 处表现出严重过拟合——模型学到


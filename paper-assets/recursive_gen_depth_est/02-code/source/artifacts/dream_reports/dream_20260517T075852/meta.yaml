      - mean_ppl
      - mean_surprisal
      - p75_ppl
      feature_importance_structure_preserved: true
      feature_importance_magnitude_attenuation_pct: 35
      per_class_recall:
        d0: 0.88
        d1: 0.42
        d2: 0.28
        d3: 0.42
      bos_reference_acc: 0.854
      prompted_acc: 0.5
      delta_pp: -35.4
      finetune_loss_d0: 2.1
      finetune_loss_d1: 1.65
      finetune_loss_d2: 1.35
      finetune_loss_d3: 1.15
    result_rationale: 'Worst tier 核心机制：prompted generation 从根本上改变了 perplexity 特征的信号
      结构，使 depth gradient 严重衰减。

      具体机制链：

      (1) Prompt anchoring effect：topic prompt 前缀（"The following article discusses
      climate change..."等）约束了生成文本的词汇分布和主题范围。BOS-seeded 生成是 完全无条件的——模型从空白开始，每个深度的分布偏移完整体现在输出中。Prompted
      生成中，prompt 提供了一个 distributional anchor，LoRA fine-tuning 在每个深度 迭代中需要同时 (a) 适配
      prompt-conditioned 分布 和 (b) 引入深度相关的偏移。 这两个目标部分冲突——prompt anchor 限制了可偏移的分布空间。

      (2) Perplexity floor effect：Pythia-160M 对 prompted text 的 perplexity 整体 更低且更集中（因为
      prompt 提供了上下文，Pythia 的下文预测更准），导致 p90_ppl 和 var_surprisal 的动态范围被压缩。具体来说，BOS-seeded
      d0 的 p90_ppl ≈ 180-220， 但 prompted d0 可能只有 120-150（prompt 提供了 context），深度梯度的绝对变化量
      从 ~80 points 压缩到 ~30 points，信噪比下降约 60%。

      (3) Feature importance 结构保留但幅度衰减：p90_ppl 和 var_surprisal 仍在 top-5 （不同于 13B 的结构性破坏），因为
      prompted generation 不改变哪些特征有信息量， 只是缩小了信息量的幅度。这是 worst tier 中一个"不是最差"的维度——prompted
      的 问题是信号衰减而非信号结构破坏。

      (4) d1v2 AUC 0.58 的来源：depth-1 和 depth-2 的 prompted 输出在 Pythia 视角 下几乎不可区分，因为
      LoRA 在 prompted 条件下的 per-depth 分布偏移量更小（loss convergence gap d1-d2 仅 0.30 vs
      BOS 模式下的 0.84）。prompt 的 constraint 使得连续深度的输出分布差异主要体现在远离 prompt 的 token 位置，而特征提取
      使用固定 truncation length（498 tokens），可能截断了信号最强的尾部区域。

      (5) 58.6% retention 意味着 prompted 条件下约 41% 的信号丢失。GPT-2 XL 是 1-1.5B 中信号最强的（85.4%），如果它在
      prompted 模式下降到 50%，那么 Pythia 和 OLMo 在 prompted 模式下可能只有 40-45%，接近 chance。这使得
      "depth signal persists under prompted generation" 的 Claim 1 表述不可持续。

      (6) EDD=1（T=0.75 和 T=0.70）意味着在 prompted 条件下只有 d0v1 boundary 可靠，depth estimation
      退化为 binary real-vs-synthetic detection，与 13B worst tier 的结论一致。

      '

    result_rationale: '14B 模型生成质量更高（更接近 human text），所以 d0v1 边界略压缩（0.991 vs 1B 模型的
      0.997-0.998）， 但 recursive collapse 的核心机制不变——LoRA fine-tune 后模型仍然收敛到 attractor
      distribution， perplexity tail statistics 的信号结构在更大模型上同样存在。76.2% 的 4-class accuracy
      处于 1B 三模型范围的中段（69.6%–85.4%），对应 LLaMA-3 8B IT 70.2% 的经验基线之上。关键逻辑： 14B 模型虽然初始文本质量更高（loss
      更低），但 recursive generation 仍引入累积分布偏移， Pythia-1.4B 的 perplexity 窗口恰好捕获这种偏移的 tail
      behavior。无 U-shape artifact 因为使用 FP16（非量化），消除了 7B QLoRA 中量化误差引入的虚假非单调性。EDD=3
      因为 14B 的更高生成质量使得 d2/d3 之间的差异虽小但仍可区分（AUC 0.793≥0.75）。

      '

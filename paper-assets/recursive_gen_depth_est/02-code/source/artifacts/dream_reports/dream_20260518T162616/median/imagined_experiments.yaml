  plan_id: plan_026
  description: 'GPT-4o-mini fine-tuning API递归链 + prompted recursive chain (rewrite模式)，
    验证depth signal在商用API模型中的存在性。

    '
  expected_results:
    prompted_chain_4class_acc: 0.42
    prompted_chain_d0v1_auc: 0.73
    prompted_chain_d1v2_auc: 0.57
    prompted_chain_d2v3_auc: 0.52
    prompted_chain_top_features:
    - surprisal_range
    - prob_std
    - var_surprisal
    finetuned_chain_feasibility: limited — API fine-tuning constraints (no LoRA control,
      fixed epochs) make recursive chain less controlled
    finetuned_chain_4class_acc: 0.45
    finetuned_chain_d1v2_auc: 0.59
    delta_vs_base_1b_pp: -36.0
    delta_vs_instruct_pp: -3.0
  result_rationale: 'API模型结果弱于base model，与instruct model实验(plan_021, 47.4%)一致： (1)
    Prompted recursive chain (rewrite prompting)：每次"rewrite"不等同于 LoRA fine-tune——fine-tune改变模型参数使分布永久偏移，
    prompted rewrite仅在inference时施加instruction bias。 因此递归prompted generation的分布偏移幅度远小于LoRA递归链，
    导致相邻depth的statistical features差异更小； (2) API fine-tuning (GPT-4o-mini)：OpenAI fine-tuning
    API不暴露 LoRA rank/learning rate等超参数，默认训练3 epochs且有 内置regularization防止catastrophic
    forgetting—— 这正是depth signal所需要的分布偏移的对立面。 递归fine-tune在API上产生的每代偏移可能仅为本地LoRA的30-40%；
    (3) RLHF/instruction tuning引入的分布约束(alignment tax) 使模型生成更"standardized"——不同depth的生成在style/fluency上更一致，
    压缩了statistical feature的variance； (4) Feature ranking偏移：p90_ppl不再dominant(被surprisal_range替代)，
    因为API模型的perplexity tail被RLHF regularize过， tail erosion信号被alignment process预先消除；
    (5) 42-45%的accuracy仍高于chance(25%)，说明signal exists but is weak—— 这支撑"depth signal
    is strongest in base models at moderate scale" 的bounded claim。

    '
  tables:
  - name: Table_model_type_comparison
    description: '行=模型类型(Base 1B avg / Base 14B / Instruct 1.5B / API prompted / API
      finetuned), 列=4class acc / d1v2 AUC / d0v1 AUC / top feature。 展示signal strength随model
      regularization递减的gradient。

      '
  figures_description:
  - 'Signal strength gradient: 条形图showing 4-class acc across model types (base→instruct→API),
    展示从78%→47%→42%的递减趋势'
  analysis: 'API模型结果确认"depth signal is a property of base model generation that is
    attenuated by instruction tuning and RLHF alignment"。 论文framing：depth estimation
    is most applicable to base model outputs in data feedback loops (the primary use
    case), while instruct/API model chains show attenuated but non-zero signal. 审稿人可能将此解读为limitation("only
    works well on base models") 或strength("correctly identifies that aligned models
    resist distributional drift")——取决于reviewer perspective。 Median档下至少一位审稿人会用这个结果argue
    "practical impact is limited since most real-world synthetic text comes from instruct/API
    models"。


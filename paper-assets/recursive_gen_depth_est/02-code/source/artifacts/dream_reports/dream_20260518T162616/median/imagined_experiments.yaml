- name: theory_section_whatif
  plan_id: what_if:theory_section
  description: '与plan_023重叠的theoretical analysis what-if。 在median档下评估其对reviewer score的marginal
    impact。

    '
  expected_results:
    marginal_score_impact: +0.0 to +0.25
    reviewer_perception: appreciated as motivation, not counted as contribution
    best_case: reviewer says 'nice connection to theory, strengthens the empirical
      narrative'
    worst_case: reviewer says 'the theoretical analysis is superficial and the EDD
      bound is too loose to be useful'
    champion_reviewer_probability: 0.35
  result_rationale: '理论section在median档的marginal impact接近零到微正： (1) 正面场景(+0.25)：某位reviewer认可problem
    formalization +  theoretical motivation的组合，认为"this paper doesn''t need novel theory
    to be valuable — the empirical contribution is sufficient, and the theoretical
    sketch adds context"； (2) 中性场景(+0.0)：reviewer认为理论section是nice-to-have但 不改变evaluation——"the
    theory section provides some intuition but doesn''t affect my assessment of the
    empirical claims"； (3) 微负场景(-0.1)：aggressive reviewer认为理论section raises expectations
    it doesn''t meet——"including a ''theory'' section suggests the authors believe
    they have a theoretical contribution, but the analysis is too informal to qualify"。
    Median档的结果是(2)或(1)，取决于reviewer composition。 Champion reviewer(认可formalization价值)的概率约35%——
    需要恰好分配到有empirical study appreciation的reviewer。

    '
  tables: []
  figures_description: []
  analysis: Theory section是low-risk low-reward的addition。 在median档下它不会pushing the paper
    from 3.0 to 3.5， 但也不会hurt。其主要价值是在rebuttal中当reviewer问 "why these features?"时可以指向theory
    section作为解释。 建议：保留theory section但严格控制scope和claim， 明确标注为"Theoretical Motivation"并在Introduction的
    contribution list中不单独列出。

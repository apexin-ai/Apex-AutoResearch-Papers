- name: theoretical_analysis_section
  plan_id: plan_023
  description: '理论分析section：(1) tail erosion连接p90_ppl/var_surprisal, (2) EDD上界推导,
    (3) strategy-dependent convergence rate解释。

    '
  expected_results:
    tail_erosion_connection: qualitative — links p90_ppl dominance to Shumailov 2024
      tail collapse mechanism
    edd_upper_bound_formula: EDD ≤ ⌈log(D_KL(P_0 || P_ref) / τ_disc) / log(1/γ)⌉ where
      γ is contraction rate
    edd_bound_empirical_match: bound gives EDD≤6 for 1B models, empirical EDD=4 —
      bound is loose but directionally correct
    iid_assumption_violation: acknowledged — LoRA recursive chain violates i.i.d.
      because each depth uses different LoRA weights
    strategy_convergence_explanation: temperature uniform scaling accelerates KL contraction
      by factor ~1.3-1.5x vs truncation methods
    section_length_pages: 1.5
    contribution_list_included: false
    section_label: Theoretical Motivation
  result_rationale: '理论section在median档下仅提供定性连接： (1) Tail erosion连接：Shumailov et al.
    2024证明recursive training 使模型逐渐丧失对低概率token的生成能力(tail collapse)， 这直接解释了为什么p90_ppl(捕捉高perplexity
    tail)和var_surprisal (捕捉surprisal分布宽度)是universal top features—— recursive generation系统性地压缩perplexity分布的right
    tail， 使p90_ppl单调下降。这个连接是直觉性的、定性的，不构成新理论； (2) EDD上界推导：假设recursive generation是contraction
    mapping (每代分布向attractor收敛，contraction rate γ<1)， EDD是相邻depths的KL divergence首次降至discriminability
    threshold τ_disc以下的depth。推导得EDD ≤ ⌈log(D_0/τ)/log(1/γ)⌉。 问题：此推导假设i.i.d. generation（每代用同一个generative
    process）， 但实际实验中每个depth用不同的LoRA checkpoint—— 审稿人会指出"the bound assumes a fixed
    contraction operator, but your LoRA fine-tuning creates a different operator at
    each depth"； (3) EDD bound给出≤6（1B模型），empirical EDD=4—— bound是loose的但方向正确，审稿人可能认为"a
    bound that overestimates by 50% is descriptive rather than tight"； (4) Strategy
    convergence rate解释：temperature对logit做uniform scaling (除以τ)保持分布shape但改变entropy，而nucleus/topk做truncation
    (截断低概率tail)。Temperature使模型更快收敛到uniform-like attractor， 解释了temp09的d1→d2 feature
    trajectory reversal。 这个解释有mechanistic basis但缺乏formal proof； (5) 整个section约1.5页，标注为"Theoretical
    Motivation"， 不列入contribution list以避免审稿人的"no theoretical contribution"critique。

    '
  tables: []
  figures_description:
  - 'EDD bound vs empirical: 柱状图showing theoretical upper bound (6) vs empirical EDD
    at T=0.75 across 3 models (all=4), 附contraction rate γ估计值'
  - 'Tail erosion visualization: p90_ppl的empirical CDF across depths (d0-d3), 展示right
    tail系统性左移, 连接到Shumailov tail collapse theory'
  analysis: 'Median档下理论section的定位是"adds motivation but not substance"。 审稿人典型反应："The
    theoretical sketch is helpful for intuition but the EDD bound relies on assumptions
    that don''t hold in practice (i.i.d. generation). I appreciate the connection
    to model collapse theory but would categorize this as ''descriptive'' rather than
    ''a theoretical contribution''." 这意味着理论section不会提升reviewer score，但也不会扣分—— 它防止了"no
    theoretical grounding at all"的批评。 关键是不要oversell：paper说"we provide theoretical
    motivation connecting our empirical findings to model collapse theory" 而非"we derive
    novel theoretical results"。

    '

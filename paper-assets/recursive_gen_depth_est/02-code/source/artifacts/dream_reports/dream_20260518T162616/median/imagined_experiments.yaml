tier: median
narrative_guidance: 'Median档核心叙事：论文定位为 task formalization + systematic empirical study
  + bounded claims。 14B结果存在但减弱（68% vs 1B的78%），Claim 1必须从"robust across scales"降级为
  "feasible at 1B with preliminary evidence of scale persistence at 14B"。 Binoculars/Fast-DetectGPT
  ordinal baseline在45-60%的表现削弱方法独特性， 需将优势重新定位为"systematic multi-model multi-strategy
  coverage + ordinal-specific feature discovery"而非单一cell的accuracy优势。 理论section标注为"Theoretical
  Motivation"不列入contribution list。 Cross-strategy pipeline诚实报告strategy classifier瓶颈。
  论文需要champion reviewer认可problem formalization + Atlas/EDD的价值才能过线。 预期reviewer avg
  3.0-3.5，borderline accept需要rebuttal中补充14B多策略或调整claim强度。

  '
imagined_experiments:
- name: 14B_scale_validation
  plan_id: plan_014
  description: 'Qwen2.5-14B FP16 + LoRA, nucleus p=0.95, d0-d3递归链。 19特征提取 + RF/LR分类。验证depth
    signal在14B主流规模下是否持续。

    '
  expected_results:
    rf_4class_acc: 0.68
    rf_4class_ci:
    - 0.665
    - 0.695
    lr_4class_acc: 0.635
    rf_3class_acc: 0.575
    d0v1_auc: 0.972
    d1v2_auc: 0.76
    d2v3_auc: 0.67
    d1v3_auc: 0.92
    per_class_recall_d0: 0.97
    per_class_recall_d1: 0.72
    per_class_recall_d2: 0.46
    per_class_recall_d3: 0.58
    feature_top4_overlap_with_1b: 2
    top_features:
    - p90_ppl
    - mean_surprisal
    - type_token_ratio
    - var_surprisal
    finetune_loss_d0: 1.85
    finetune_loss_d1: 1.42
    finetune_loss_d2: 1.18
    delta_vs_1b_best_pp: -15.2
    delta_vs_1b_avg_pp: -11.5
  result_rationale: '14B模型容量远大于1B，LoRA fine-tune在每一代产生的分布偏移更小—— 模型能更好地在fit训练数据的同时保持生成多样性。具体机制：
    (1) 14B的attention head冗余度高，LoRA rank=16仅修改极小比例参数， 递归fine-tune对整体生成分布的扰动幅度约为1B的60-70%；
    (2) perplexity tail statistics (p90_ppl)仍为top feature，因为tail erosion 是recursive
    generation的universal现象（Shumailov机制与模型规模无关）， 但绝对差异缩小——14B d1的p90_ppl中位数可能在d0和d1之间的gap仅为1B的一半；
    (3) feature ranking偏移出现在var_surprisal从top-2降至top-4外， 被type_token_ratio替代——14B生成的词汇多样性随depth下降更显著，
    成为新的discriminative signal； (4) d2 recall最低(46%)，因为14B的d1和d2生成分布高度重叠—— 模型容量使得第2次fine-tune仍能保持较好的生成质量；
    (5) d0v1 AUC仍然极高(0.97)，因为human text vs任何模型生成的 distinction在任何规模下都很强； (6) fine-tune
    loss比1B更低（1B约2.2-2.5, 14B约1.85）， 反映14B预训练对训练数据的更好coverage。 整体结果支持"signal persists
    but attenuated"的bounded claim。

    '
  tables:
  - name: Table_14B_comparison
    description: '14B vs 1B三模型对比表：4-class acc, d1v2 AUC, d2v3 AUC, top-4 features。
      行=模型(Pythia/OLMo/GPT-2 XL/Qwen-14B)，列=metrics。 突出Δ列显示14B的signal attenuation幅度。

      '
  figures_description:
  - 'AUC decay curve: x轴=depth pair (d0v1→d2v3), y轴=AUC, 4条线(3个1B模型+14B), 14B线系统性低于1B但保持>0.65'
  - 'Feature trajectory panel: 14B vs best 1B (GPT-2 XL)的top-5 feature随depth变化, 展示14B
    feature gap缩小但方向一致'
  analysis: '68%显著高于chance(25%)，确认14B depth signal存在。但与1B最佳cell(85.4%) 相差17pp，d1v2
    AUC从0.91降至0.76。论文措辞： "depth signal persists at 14B scale (68%, chance=25%) but
    with attenuated inter-depth discrimination (d1v2 AUC 0.76 vs 0.91 at 1B), providing
    preliminary evidence that the approach extends beyond small models." Feature ranking偏移(top-4仅2个重叠)需在paper中显式报告，
    说明"feature universality claim需限定为within-scale"。 这个结果足以消除"small model only"的硬伤，但不足以支撑"scale
    robust"的强claim。 审稿人可能要求14B多策略验证(temp09/topk50)作为补充。

    '

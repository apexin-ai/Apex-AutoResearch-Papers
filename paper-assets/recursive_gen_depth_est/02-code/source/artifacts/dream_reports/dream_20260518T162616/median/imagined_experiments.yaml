  expected_results:
    status: cancelled
    reason: DCOL v6 RoBERTa-large failed (64.4% vs RF 78.2%, -13.7pp, severe overfitting).
      No DCOL model to ablate.
  result_rationale: 'DCOL v1-v6全部失败表明contrastive ordinal learning在text depth estimation
    任务上有固有困难：(1) 文本的ordinal depth signal主要编码在statistical features (perplexity tail,
    surprisal variance)中，而非token-level embeddings能直接捕捉的； (2) contrastive loss需要embedding空间中adjacent
    depths有清晰的ordinal structure， 但RoBERTa的[CLS] embedding捕捉的是语义信息而非distributional
    statistics； (3) 这个negative result本身支持Atlas/EDD作为primary contribution的定位—— 表明depth
    estimation的贡献在于feature discovery和task formalization， 而非novel deep learning architecture。

    '

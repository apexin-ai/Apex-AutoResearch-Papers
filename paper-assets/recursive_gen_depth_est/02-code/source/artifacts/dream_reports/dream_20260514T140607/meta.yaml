        | OLMo-1B | 4 | 4 | 4 | 4.00 |

        | GPT-2 XL | 4 | 4 | 3 | 3.67 |

        | Mean | 4.33 | 4.00 | 3.67 | 4.00 |

        '
    - name: 'Table: Feature monotonicity scores (top 10)'

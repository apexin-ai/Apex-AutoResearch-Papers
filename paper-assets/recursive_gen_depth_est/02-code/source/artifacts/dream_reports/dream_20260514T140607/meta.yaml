      margins迫使模型假设所有相邻depth等距，这与实际不符。 Surprisal anchors的消融影响次之（-1.3pp），因为var_surprisal是最强特征，
      将其嵌入anchor selection有助于contrastive learning聚焦于最有信息量的样本对。 Strategy conditioning影响最小（-0.9pp），因为在pooled
      setting下策略间差异 已经被训练数据的多样性部分覆盖——conditioning的主要作用是在per-strategy evaluation 上提升，pooled数字上反映较弱。三个组件全部移除等价于vanilla

      '
  - name: 'Wild-Data Calibration: DCOL Scores on RedPajama/Dolma'
    plan_id: plan_015
    description: '在无ground-truth depth标签的wild data（RedPajama/Dolma样本）上运行DCOL， 分析predicted
      depth scores与quality proxies（perplexity, AlignScore）的correlation。

      '
    expected_results:
      dataset_samples: 50000
      predicted_depth_distribution:
        d0_pct: 72.3
        d1_pct: 14.8
        d2_pct: 7.1
        d3_pct: 3.4
        d4_pct: 1.6
        d5_pct: 0.8
      spearman_vs_ppl: 0.473
      spearman_vs_alignscore: -0.412
      spearman_vs_ppl_p_value: <1e-10
      spearman_vs_alignscore_p_value: <1e-8
      calibration_note: 'Predicted depth and quality proxies are correlated but not
        redundant;  depth captures distributional degradation beyond what perplexity
        alone measures

        '
      partial_corr_depth_given_ppl_vs_alignscore: -0.198
    result_rationale: 'DCOL在wild data上预测72.3%为d0（human-written），符合预期——大部分web text仍是
      human-authored。14.8%被预测为d1（first-gen synthetic），合理反映了当前web上AI生成 内容的比例。Spearman与PPL的正相关（0.473）符合预期：higher
      predicted depth →  higher perplexity → lower quality。但correlation仅0.473（非0.9+）说明depth和PPL
      不是redundant measures——depth捕捉的是distributional degradation pattern（如 surprisal
      variance compression），而PPL是point estimate of generation quality。 partial correlation（depth
      vs AlignScore controlling for PPL）= -0.198仍显著， 证明depth captures quality dimensions
      beyond PPL alone。AlignScore的负相关（-0.412） 表示higher depth → lower alignment/coherence，符合model
      collapse的预期。 predicted depth distribution的heavy left skew（d4+合计仅2.4%）也合理——deeply  recursive
      content在wild web上确实稀少（但不是zero），这正是graduated curation 的application场景。

      '
    tables:
    - name: 'Table: Wild-data correlation results'
      content: '| Quality Proxy | Spearman ρ | p-value | Direction |

        |---------------|-----------|---------|-----------|

        | Perplexity | +0.473 | <1e-10 | higher depth → higher PPL |

        | AlignScore | -0.412 | <1e-8 | higher depth → lower alignment |

        | Partial (depth\|PPL) vs AlignScore | -0.198 | <1e-5 | depth adds info beyond
        PPL |

        '
    figures_description:
    - Predicted depth distribution histogram：x轴=predicted depth, y轴=percentage， 展示expected
      left-skewed distribution
    - Depth vs PPL violin plot：每个predicted depth bin的PPL分布，展示上升趋势 但overlapping distributions
    analysis: Wild-data calibration提供了ecological validity的初步证据。DCOL scores在无标签 数据上与quality
      proxies的correlation pattern完全符合model collapse理论的预测。 partial correlation的显著性（-0.198,
      p<1e-5）是最重要的结果——它证明depth不是 PPL的redundant reformulation，而是一个complementary quality
      dimension，这为 graduated curation的实际部署提供了theoretical justification。Limitation应在paper
      中明确说明：wild data没有ground-truth depth，这些correlations只验证score semantics， 不验证calibration
      accuracy。
  review_report: "---\ndream_id: dream_20260514T140607\ntier: best\noverall_score:\
    \ borderline accept\ntimestamp: 2026-05-14T14:48:22.312721+00:00\n---\n\n\n# Dream\
    \ Review Report: Ordinal Depth Estimation of Recursive LLM Generations via Contrastive\
    \ Learning with Learnable Margins\n\n**Venue:** EMNLP 2026 (ACL Rolling Review)\n\
    **Review Mode:** Full (2 Reviewers + Roundtable)\n**Date:** 2026-05-14\n\n---\n\
    \n## Reviewer Scores Summary\n\n| Dimension | R1 (Methods+Experiments) | R2 (Novelty+Related\
    \ Work) | Consensus |\n|-----------|--------------------------|---------------------------|-----------|\n\
    | Soundness | 3/5 | 4/5 | 3.5/5 |\n| Excitement | 4/5 | 3/5 | 3.5/5 |\n| Overall\
    \ Assessment | 3/5 | 3/5 | **3/5 (Borderline Accept)** |\n| Confidence | 4/5 |\
    \ 4/5 | — |\n\n---\n\n## R1 Review: Methods and Experiments\n\n### Summary\n\n\
    The paper formalizes ordinal generation depth estimation and proposes DCOL with\
    \ three text-specific modifications atop a DeBERTa encoder. Experimental coverage\
    \ is impressive (14 experiments spanning benchmark construction, generalization,\
    \ ablation, and downstream application), and the Atlas provides a useful empirical\
    \ characterization. However, several methodological concerns — the loss formulation,\
    \ surprisal circularity, benchmark confounds, and underspecified inference — prevent\
    \ full endorsement.\n\n### Strengths\n\n1. **Comprehensive experimental design.**\
    \ All 14 planned experiments are covered. The combination of leave-one-model-out\
    \ (Table 8), leave-one-strategy-out (Table 9), cross-scale transfer (Table 10),\
    \ ablation (Table 11), granularity analysis (Table 12), wild-data calibration\
    \ (Table 13), and downstream application (Table 14) addresses most natural reviewer\
    \ questions preemptively.\n\n2. **Well-motivated method design.** The observation-to-design-to-validation\
    \ loop is clean: the Atlas documents non-uniform inter-depth geometry (d01/d34\
    \ ratio = 2.83), this motivates learnable non-uniform margins, and the learned\
    \ margin ratios (1.00, 0.68, 0.52, 0.41, 0.35) correlate strongly (r > 0.95) with\
    \ the empirical distances.\n\n3. **Strong baselines and fair comparisons.** Seven\
    \ baselines spanning binary detector repurposing, ordinal regression, standard\
    \ classification, direct regression, and zero-shot prompting. The inclusion of\
    \ CORAL-DeBERTa (same encoder) isolates DCOL's modifications from encoder choice.\n\
    \n4. **Ablation is convincing.** Each component contributes 2–4pp independently;\
    \ sum of individual drops (9.2pp) slightly exceeds joint drop (8.1pp) indicating\
    \ mild positive interaction; \"w/o all three\" (64.1%) still outperforms CORAL\
    \ (62.1%) by 2.0pp, cleanly separating framework from modification contributions.\n\
    \n5. **Atlas as independent scientific contribution.** The EDD metric, monotonicity\
    \ analysis, and non-uniform geometry documentation have value beyond DCOL. var_surprisal's\
    \ 0.961 monotonicity is a genuinely useful result for the model collapse community.\n\
    \n6. **Statistical significance reported** for DCOL vs. CORAL (paired bootstrap,\
    \ p < 0.001) with confidence intervals for key metrics.\n\n### Weaknesses\n\n\
    1. **(Major) Loss formulation (Eq. 1) appears incomplete.** The loss L = Σ max(0,\
    \ ||f(xi) - f(xj)|| - m(δij))² only penalizes when embedding distance *exceeds*\
    \ the margin — a ceiling/pull term. There is no repulsive mechanism pushing apart\
    \ samples at different depths. As written, the loss is trivially minimized by\
    \ collapsing all embeddings to a single point. Either this is a presentation error\
    \ (missing the repulsive term) or additional loss terms exist but are not described.\
    \ This is a critical reproducibility concern.\n\n2. **(Major) Circularity in surprisal-augmented\
    \ anchors.** The surprisal features appear to be computed using Pythia-1.4B as\
    \ reference model. For Pythia-generated text, this creates a tautological signal\
    \ — the generating model's own surprisal on its own output conflates model identity\
    \ with depth. The paper does not specify: (a) which reference model is used across\
    \ all three families, (b) whether the same reference is used for all text, (c)\
    \ how this affects cross-model generalization. The surprisal anchors contribute\
    \ 3.1pp in ablation, so this is not ignorable.\n\n3. **(Major) Depth-0 confound.**\
    \ Depth-0 is Wikipedia (human); depths 1–5 are model-generated. The d0 vs. d1\
    \ AUC of 0.998 is essentially binary human-vs-machine detection, not depth estimation.\
    \ Per-class accuracy (d0: 91.2% vs. d1: 79.3%) and binary detection (96.1%) confirm\
    \ the d0 signal is dominated by the human-vs-synthetic distinction. The 72.2%\
    \ headline is substantially inflated by near-perfect d0 classification. A 5-class\
    \ (d1–d5) accuracy should be reported alongside.\n\n4. **(Major) k-NN inference\
    \ underspecified.** No k value, distance metric, or sensitivity analysis provided.\
    \ If results are brittle to k, the method has a hidden hyperparameter undermining\
    \ reported numbers.\n\n5. **(Minor) Cross-scale evaluation is limited.** The 8B\
    \ probe uses only 3-class (depth 0–2), making it incomparable to 6-class main\
    \ results. Only one larger model tested, only to depth 2. The claim \"depth signals\
    \ transfer across model scales\" is stronger than this evidence supports.\n\n\
    6. **(Minor) Downstream curation lacks task-based evaluation.** PPL on held-out\
    \ RedPajama subset could reflect distributional matching rather than genuine quality\
    \ improvement. No evaluation on downstream tasks (MMLU, reasoning).\n\n7. **(Minor)\
    \ No error analysis.** No discussion of what text properties make depth estimation\
    \ harder, no confusion matrix shown (only described).\n\n8. **(Minor) Wild-data\
    \ calibration has no ground truth.** Correlations with PPL/AlignScore are suggestive\
    \ but could mean DCOL is learning a perplexity proxy. Partial correlation (-0.198)\
    \ mitigates this partially.\n\n### Questions for Authors\n\n1. Provide the complete\
    \ training objective including the repulsive/floor term.\n2. Which reference model\
    \ computes surprisal? Is it the same for all three model families?\n3. What k\
    \ is used in k-NN? What is the sensitivity?\n4. What is the 5-class (d1–d5 only)\
    \ accuracy?\n5. How is the margin monotonicity constraint implemented (projection?\
    \ reparameterization?)?\n6. How is strategy conditioning handled at inference\
    \ on wild data where strategy is unknown?\n7. Has depth-0 been tested with non-Wikipedia\
    \ seed corpora?\n8. Can you provide error bars for the non-monotonic d4v5 AUC\
    \ in Table 4?\n\n### Scores\n- Soundness: 3/5\n- Excitement: 4/5\n- Overall Assessment:\
    \ 3/5\n- Confidence: 4/5\n\n---\n\n## R2 Review: Novelty and Related Work\n\n\
    ### Summary\n\nThe paper introduces a well-defined new task (ordinal depth estimation)\
    \ and provides the first systematic characterization of recursive degradation\
    \ dynamics (Atlas). However, the DCOL method is an incremental adaptation of CLOC\
    \ (CVPR 2025) with three standard engineering modifications, the related work\
    \ has significant gaps, and certain claims are overstated relative to the evidence.\n\
    \n### Strengths\n\n1. **Genuine task novelty.** Ordinal depth estimation is a\
    \ legitimately new problem formulation. The insight that binary detection discards\
    \ actionable ordinal information is simple but important. The task definition\
    \ is clean and the benchmark construction is well-motivated.\n\n2. **Atlas is\
    \ a meaningful scientific contribution.** The systematic characterization of 19\
    \ features across 3 models × 3 strategies × 6 depths, the EDD metric, and the\
    \ documentation of non-uniform inter-depth geometry go beyond what Drayson et\
    \ al. (2025) provide. Drayson et al. characterize degradation in Pythia only;\
    \ this paper extends to three architectures and formalizes the findings.\n\n3.\
    \ **The graduated curation paradigm is a useful conceptual contribution.** Even\
    \ as a proof-of-concept, the insight that depth-aware weighting is a Pareto improvement\
    \ over binary filtering (more data retained, lower PPL) is valuable for the data\
    \ curation community.\n\n4. **Comprehensive evaluation.** The paper addresses\
    \ cross-model, cross-strategy, and cross-scale generalization — a thorough treatment\
    \ of the external validity question.\n\n5. **Elegant granularity analysis.** The\
    \ finding that above-chance margin *increases* with finer granularity (Table 12)\
    \ is a genuinely surprising and well-presented result that justifies the ordinal\
    \ framing.\n\n### Weaknesses\n\n1. **(Major) Incremental methodology.** DCOL is\
    \ CLOC + three off-the-shelf modifications:\n   - Learnable margins are standard\
    \ in metric learning (Wu et al. 2017, Roth et al. 2020).\n   - Surprisal-augmented\
    \ anchors are feature concatenation before a projection head — a standard technique.\n\
    \   - Strategy-aware conditioning is a lightweight FiLM-style modulation.\n  \
    \ Each contributes only 2–4pp. The paper should position DCOL as \"CLOC adapted\
    \ for text depth estimation\" rather than a novel framework. The novelty lies\
    \ in the task and the Atlas, not the method.\n\n2. **(Major) Significant related\
    \ work gaps.**\n   - **Watermarking:** Kirchenbauer et al. (2023) is entirely\
    \ absent — watermarking-based provenance tracking is a direct alternative to post-hoc\
    \ depth estimation.\n   - **Data quality / curation:** DSIR (Xie et al. 2023),\
    \ QuRating (Wettig et al. 2024) — the graduated curation contribution should be\
    \ positioned against the data selection literature.\n   - **Multi-class synthetic\
    \ attribution:** Uchendu et al. (2020) and subsequent work on authorship attribution\
    \ across multiple generators — a precursor to multi-class synthetic text analysis.\n\
    \   - **Data provenance:** The broader data attribution and provenance literature\
    \ (e.g., data Shapley, influence functions) is relevant to tracking generation\
    \ history.\n   - **Model collapse theory:** Alemohammad et al. (2023) \"Self-Consuming\
    \ Generative Models Go MAD\" and Briesch et al. (2023) are missing.\n   - **Binary\
    \ detection:** Fast-DetectGPT (Bao et al. 2024) should be included in the baseline\
    \ battery.\n\n3. **(Major) Overstated \"fundamentally different\" claim.** The\
    \ paper claims ordinal depth estimation is \"fundamentally different from binary\
    \ detection\" (Section 1). But the features powering depth estimation (surprisal\
    \ variance, perplexity statistics) are the *same* features used by binary detectors.\
    \ The contribution is an ordinal *generalization* of binary detection — important,\
    \ but not \"fundamentally different.\" A more honest framing: \"binary detection\
    \ is a special case; ordinal estimation extracts strictly more information from\
    \ the same signal space.\"\n\n4. **(Minor) Circularity in margin-geometry validation.**\
    \ Reporting Pearson r > 0.95 between learned margins and empirical inter-depth\
    \ distances is circular: the margins were *trained* on the same data from which\
    \ the Atlas distances were computed. The margins *should* correlate — this validates\
    \ convergence, not the design principle. A genuine validation would train margins\
    \ on one model family and show they match the Atlas geometry of a held-out family.\n\
    \n5. **(Minor) EDD threshold sensitivity.** EDD is defined with a fixed AUC ≥\
    \ 0.75 threshold. No sensitivity analysis is provided. If the threshold were 0.80,\
    \ EDD values would change substantially (several entries in Table 2 would drop\
    \ by 1). The paper should discuss threshold choice or provide a range.\n\n6. **(Minor)\
    \ Graduated vs. binary comparison fairness.** Binary filtering retains 71.6% of\
    \ data; graduated retains 92.3%. The PPL improvement could partly reflect having\
    \ 20% more training data, not the weighting scheme. A fair comparison would match\
    \ data volume — e.g., binary filtering with a higher threshold retaining ~92%\
    \ of data.\n\n### Questions for Authors\n\n1. How does DCOL differ from CLOC beyond\
    \ the three modifications? Is the base contrastive framework identical?\n2. Can\
    \ the margin-geometry correlation be validated on a held-out model family not\
    \ used in training?\n3. What happens to EDD if the threshold is changed to 0.70\
    \ or 0.80?\n4. Is the reference model for surprisal features the same model that\
    \ generated the text? How does this affect the claim that depth signals are \"\
    model-agnostic\"?\n5. Has the graduated curation been compared against volume-matched\
    \ binary filtering (same data retention rate)?\n6. How does DCOL handle text generated\
    \ by mixed or unknown strategies in deployment?\n\n### Missing References\n\n\
    - Kirchenbauer et al. (2023) — watermarking for LLM outputs\n- Xie et al. (2023)\
    \ — DSIR data selection\n- Wettig et al. (2024) — QuRating data quality\n- Uchendu\
    \ et al. (2020) — multi-class authorship attribution for generators\n- Alemohammad\
    \ et al. (2023) — self-consuming generative models\n- Briesch et al. (2023) —\
    \ LLMs suffering from own output\n- Bao et al. (2024) — Fast-DetectGPT\n- Guo\
    \ et al. (2024) — linguistic diversity decline in recursive generations\n\n###\
    \ Scores\n- Soundness: 4/5\n- Excitement: 3/5\n- Overall Assessment: 3/5\n- Confidence:\
    \ 4/5\n\n---\n\n## Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\nR1 and\
    \ R2 exchanged reviews. Key observations from each reviewer on the other's points:\n\
    \n**R1 on R2's concerns:**\n- Agrees that DCOL's novelty is incremental — the\
    \ observation-to-design loop is clean but the components themselves are standard.\
    \ The paper's main novelty is the task + Atlas, not DCOL per se.\n- Agrees the\
    \ related work gaps are significant, especially watermarking (Kirchenbauer et\
    \ al.) and data curation literature (DSIR, QuRating).\n- Notes the \"fundamentally\
    \ different\" framing is indeed overstated — \"ordinal generalization\" is more\
    \ accurate.\n\n**R2 on R1's concerns:**\n- Agrees the loss formulation issue (Eq.\
    \ 1 missing repulsive term) is the single most critical technical concern. If\
    \ this is a presentation error, it's fixable; if it's a genuine design flaw, it\
    \ undermines the entire method.\n- Finds the d0 confound argument compelling —\
    \ the 6-class headline number is inflated. A 5-class (d1–d5) metric should be\
    \ foregrounded.\n- The surprisal circularity is concerning but considers it partially\
    \ mitigated by the cross-model LOO results (60.1%) where the reference model is\
    \ presumably not the generating model for the held-out family.\n\n### Step 3:\
    \ Convergence\n\n**Points of agreement:**\n1. The **task formulation** (ordinal\
    \ depth estimation) is genuinely novel and timely — both reviewers value this.\n\
    2. The **Atlas** is an independent scientific contribution with value beyond DCOL.\n\
    3. The **loss formulation** in Eq. 1 is either incomplete or incorrectly presented\
    \ — this is the top priority for revision.\n4. The **related work** has significant\
    \ gaps that need addressing (watermarking, data curation, multi-class attribution).\n\
    5. The **6-class headline** is inflated by the d0 confound — a d1–d5 metric should\
    \ be reported.\n6. The **DCOL method** is technically competent but incrementally\
    \ novel — the paper should reframe DCOL as an adaptation of CLOC, not a novel\
    \ framework.\n7. The **experimental coverage** is a clear strength — 14 experiments\
    \ addressing diverse validity questions.\n8. **Overall assessment: 3/5** (borderline\
    \ accept) — the task and Atlas are strong enough to carry the paper, but methodological\
    \ and positioning issues need attention.\n\n**Points of partial disagreement:**\n\
    - R1 rates Excitement 4/5 (problem is highly novel and timely), R2 rates 3/5 (execution\
    \ is incremental). Convergence: **3.5/5** — the problem is exciting but the methodological\
    \ contribution is moderate.\n- R1 rates Soundness 3/5 (loss formulation, circularity),\
    \ R2 rates 4/5 (experimental design is thorough). Convergence: **3.5/5** — sound\

project: recursive_gen_depth_est
venue: EMNLP 2026
focus: 'Core novelty is problem formalization (ordinal depth estimation) + Atlas,
  not method alone. DCOL adapts CLOC — reviewers may question method novelty. MVP
  shows 78.2% 4-class acc with simple RF, so the signal is strong. Key risks: (1)
  EDD might be low, (2) cross-model generalization unknown, (3) controlled vs wild
  gap.'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 信号强且泛化好：EDD高（≥4），DCOL显著优于所有baseline，跨模型迁移强
      key_assumptions:
      - 递归退化信号在depth 4+仍然可区分（surprisal variance等特征保持单调性）
      - DCOL的可学习非均匀margin捕捉到了真实的退化几何，显著优于固定margin和非序数方法
      - 深度信号具有跨模型家族的不变性（至少部分特征是model-agnostic的）
      - OLMo和GPT-2 XL的退化轨迹与Pythia定性一致（单调递减但速率不同）
      - 下游graduated curation带来可测量的perplexity改善
      number_ranges:
        dcol_6class_acc_pooled:
        - 0.68
        - 0.75
        cross_model_loo_6class_acc:
        - 0.55
        - 0.65
        edd_median_across_9_combos:
        - 4
        - 5
        dcol_delta_over_best_baseline_pp:
        - 8
        - 12
        min_adjacent_auc_within_edd:
        - 0.78
        - 0.85
        atlas_feature_monotonicity_score_top5:
        - 0.85
        - 0.95
        curation_ppl_reduction_vs_binary_pct:
        - 5
        - 10
        mae_6class:
        - 0.25
        - 0.35
      narrative_direction: '原始framing完全成立。三条claim均以强形式呈现：(1) 序数深度估计可行且精确， DCOL在6-class上达到70%+（chance=16.7%），跨模型泛化60%+；
        (2) Atlas揭示系统性退化规律，EDD≥4意味着细粒度深度区分有实际意义； (3) graduated curation显著优于binary
        filtering。 Headline可以自信填入："DCOL achieves ~72% 6-class accuracy with ~60% cross-model
        generalization, while the best baseline achieves only ~62%." Method novelty通过大幅度ablation增益（每个组件+2-4pp）自证。
        Atlas和EDD作为科学贡献完全站住——高EDD证明这不是trivial的二分问题。

        '
    median:
      tier: median
      meaning: 信号真实但有天花板：EDD≈3，DCOL有优势但不压倒性，跨模型迁移达标但有波动
      key_assumptions:
      - 递归退化信号在depth 3后显著衰减（depth 3v4 AUC < 0.72），EDD中位数约为3
      - DCOL优于baseline但优势中等（+3-7pp），部分增益来自ordinal structure而非contrastive learning本身
      - 跨模型迁移在某些rotation上通过gate（≥45%）但在某些上勉强或略低
      - Atlas显示depth 4-5特征分布高度重叠，部分model-strategy combo出现非单调现象
      - 下游curation有正向效果但统计显著性边际
      number_ranges:
        dcol_6class_acc_pooled:
        - 0.52
        - 0.62
        cross_model_loo_6class_acc:
        - 0.42
        - 0.52
        edd_median_across_9_combos:
        - 3
        - 3
        dcol_delta_over_best_baseline_pp:
        - 3
        - 7
        min_adjacent_auc_within_edd:
        - 0.72
        - 0.8
        atlas_feature_monotonicity_score_top5:
        - 0.7
        - 0.85
        curation_ppl_reduction_vs_binary_pct:
        - 2
        - 5
        mae_6class:
        - 0.4
        - 0.55
      narrative_direction: 'Claim 1需降低粒度声明："ordinal depth estimation is feasible within
        the EDD boundary"—— 实际上是4-class（depths 0-3）可行，depth 4+坍缩。6-class数字仍远超chance，但需承认有效粒度有限。
        DCOL仍优于baseline，但叙事重心从"DCOL方法突破"转向"序数框架+Atlas"的组合贡献。 Claim 2（Atlas）权重上升为论文核心——EDD=3本身就是重要的科学发现，
        文档化"从哪里开始、为什么区分饱和"对model collapse社区直接有用。 Claim 3（curation）缩减为简短proof-of-concept，不做强声明。
        跨模型泛化需诚实报告per-rotation结果，弱的rotation作为limitation讨论。 补充实验：feature importance
        drift分析（为什么某些模型更难泛化）填充分析深度。

        '
    worst:
      tier: worst
      meaning: 深度信号快速饱和：EDD≈2，DCOL无显著优势，跨模型迁移不达标
      key_assumptions:
      - depth 2+几乎不可区分（AUC 2v3 < 0.70 pooled），有效任务退化为ternary（human/shallow/deep）
      - DCOL与CORAL或简单CE+ordinal无统计显著差异——可学习margin没有比固定spacing好
      - 跨模型泛化低于gate（< 45%），深度信号高度model-specific
      - Atlas中多个model-strategy combo出现非单调退化（Drayson et al.模式），单调性假设部分失败
      - 下游curation与binary filtering无显著差异
      number_ranges:
        dcol_6class_acc_pooled:
        - 0.38
        - 0.48
        cross_model_loo_6class_acc:
        - 0.28
        - 0.38
        edd_median_across_9_combos:
        - 2
        - 2
        dcol_delta_over_best_baseline_pp:
        - 0
        - 3
        min_adjacent_auc_within_edd:
        - 0.65
        - 0.75
        atlas_feature_monotonicity_score_top5:
        - 0.55
        - 0.7
        curation_ppl_reduction_vs_binary_pct:
        - 0
        - 2
        mae_6class:
        - 0.6
        - 0.8
      narrative_direction: 核心reframe：从"我们能估深度"转向"我们测量了深度可估性的基本极限"。 论文变为measurement/characterization
        paper，Atlas和EDD成为唯一主贡献。 新角度："Ordinal depth estimation saturates at ~2 generations
        — a fundamental limit that itself informs data curation and model collapse
        mitigation strategies." EDD=2意味着实际可操作的区分就是human vs 1st-gen vs deep-recursive，
        这对curation仍有实际价值（argue ternary已经比binary好）。 DCOL降级为"one method we tried"，不作为贡献条目——用ablation证明信号瓶颈在特征层而非学习层。
        跨模型失败反过来成为发现：深度信号是model-specific的， 这意味着通用depth estimator可能需要model fingerprinting作为前置步骤（future
        work）。 Atlas中的非单调现象与Drayson et al.对话，增加引用和讨论深度。 仍冲EMNLP——"New Missions"主题本身欢迎negative/boundary-finding结果，
        但需要更强的分析深度和更多Atlas可视化来补偿方法贡献的缺失。

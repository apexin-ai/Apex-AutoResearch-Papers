    plan_id: plan_013
    description: 'Proof-of-concept downstream application：用DCOL predicted depth作为data
      curation signal，比较graduated weighting（1/k权重）vs binary filtering vs no filtering
      对1B model fine-tuning的影响。

      '
    expected_results:
      no_filtering_ppl: 26.14
      binary_filtering_ppl: 24.52
      graduated_weighting_ppl: 22.78
      ppl_reduction_vs_binary_pct: 7.1
      ppl_reduction_vs_no_filter_pct: 12.85
      graduated_retained_data_pct: 92.3
      binary_retained_data_pct: 71.6
      sensitivity_analysis:
        weight_1_over_k: 22.78

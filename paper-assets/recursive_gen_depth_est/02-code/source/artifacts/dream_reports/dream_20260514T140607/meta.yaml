    analysis: 'GPT-2 XL的结果完成了3-model benchmark的feature-level验证。关键观察：(1) 三个模型 的退化轨迹定性一致——AUC单调递减，var_surprisal始终是最强特征；(2)
      模型capacity与 退化速率呈负相关（OLMo 1B退化最快 > Pythia 1.4B > GPT-2 XL 1.5B），符合直觉； (3) 即使最弱的GPT-2

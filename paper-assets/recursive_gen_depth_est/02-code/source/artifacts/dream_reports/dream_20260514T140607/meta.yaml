      content: '| Strategy | PPL↓ | Data Retained | Δ vs Binary |

        |----------|------|---------------|-------------|

        | No filtering | 26.14 | 100% | — |

        | Binary (remove synthetic) | 24.52 | 71.6% | baseline |

        | Graduated 1/k | 22.78 | 92.3% | -7.1% PPL |

        | Graduated 1/k² | 23.01 | 92.3% | -6.2% PPL |

        | Graduated exp(-k) | 22.91 | 92.3% | -6.6% PPL |

        | Linear decay | 23.15 | 92.3% | -5.6% PPL |

        '
    figures_description:
    - PPL vs data retention trade-off曲线：binary是一个点（71.6%, 24.52）， graduated schemes在更高retention（92.3%）下实现更低PPL，展示Pareto
      improvement
    analysis: '7.1% PPL improvement over binary filtering在proof-of-concept scope下是convincing的。
      关键insight不是"哪个权重函数最好"（差异小），而是"graduated approach本身是a better  paradigm than binary"——它保留了20.7%更多的数据同时获得了更低的PPL。这个finding
      直接supports claim 3，且与claim 1和claim 2形成完整链条：Atlas发现depth有意义的 结构→DCOL能准确预测depth→depth-aware
      curation能改善downstream quality。 paper中~1 page的proof-of-concept scope足够传达这个message。

      '
  - name: 7B Cross-Scale Probe (Qwen2.5-7B or Llama-3.1-8B)
    plan_id: plan_014
    description: '在7B模型上生成3-depth递归链（depth 0-2），用在1-1.5B模型上训练的DCOL进行 depth estimation。测试scale
      transfer。

      '
    expected_results:
      model_used: Llama-3.1-8B
      depths_generated:
      - 0
      - 1
      - 2
      dcol_3class_acc: 0.712
      dcol_3class_acc_ci:
      - 0.688
      - 0.736
      mae_3class: 0.301
      auc_0v1: 0.963
      auc_1v2: 0.821
      feature_monotonicity_top3:
        var_surprisal: 0.94
        p90_ppl: 0.89
        mean_ppl: 0.86
      degradation_rate_vs_small_models: 0.67
    result_rationale: '7B模型的3-class accuracy 71.2%（chance=33.3%）证明depth signals从1-1.5B模型
      transfer到7B模型。transfer成功的原因是核心退化特征（var_surprisal等）反映的是 递归采样的distributional dynamics而非model-specific
      patterns。degradation_rate  0.67x意味着7B模型的退化速度约为小模型的2/3——capacity更大，每步保留更多分布信息，
      退化更gradual。这导致adjacent depth间的feature gap更小，所以即使在3-class （比6-class简单）上accuracy也仅71.2%。AUC
      0v1=0.963虽然低于小模型的~0.998， 但仍很高——human vs synthetic的gap在7B模型上缩小但仍robust，因为7B的生成质量
      更高，使d0 vs d1更接近。特征单调性在7B上保持（var_surprisal=0.94），说明退化 的qualitative pattern是scale-invariant的。

      '
    tables:
    - name: 'Table: Cross-scale transfer results'
      content: '| Setting | 3-class Acc | AUC(0v1) | AUC(1v2) |

        |---------|-------------|----------|----------|

        | DCOL on 1-1.5B (in-dist) | 84.5 | 0.998 | 0.912 |

        | DCOL on 7B (transfer) | 71.2 | 0.963 | 0.821 |


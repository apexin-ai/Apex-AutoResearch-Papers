    result_rationale: 'GPT-2 XL（1.5B）是三个模型中最大的，更大的capacity意味着每一步递归生成保留更多 原始分布的信息，因此相邻深度之间的退化幅度更小、更难区分。这解释了4-class
      acc最低 （74.8%）和AUC 2v3最低（0.771）。但信号仍然存在且强劲——核心假设成立：递归退化 是一个universal现象，不依赖于特定模型。var_surprisal仍是top
      feature因为surprisal 方差的压缩是递归采样的数学必然（每一步都是从前一步的分布中re-sample，方差单调非增）。 GPT-2 XL训练于WebText（高质量web文本），其退化起点更高，每步degradation更gradual，
      所以AUC曲线整体更平缓。var_ppl进入top5（取代p75_ppl）反映GPT-2 XL的perplexity 分布在递归中的变化更多体现在variance而非quantile
      shift上。

      '
    tables:

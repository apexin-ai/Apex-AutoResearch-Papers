      training_tokens: 500M
      eval_set: held-out RedPajama subset
    result_rationale: 'Graduated weighting（PPL 22.78）优于binary filtering（PPL 24.52），改善7.1%，
      原因有二：(1) binary filtering粗暴丢弃所有synthetic data（丢弃28.4%数据）， 但其中depth 1的shallow
      synthetic content质量仍然很高，丢弃它们是unnecessary  data waste；graduated weighting保留92.3%的数据，仅down-weight
      deep recursive  content，保留了shallow synthetic的positive contribution。(2) 1/k权重scheme
      恰好近似了退化severity的reciprocal——depth 1内容几乎不down-weight（×1.0）， depth 3内容weight=0.33，depth
      5内容weight=0.2，这与Atlas中观察到的质量退化 曲线形状吻合。sensitivity analysis显示不同权重函数的差异较小（PPL
      22.78-23.15）， 说明graduated的核心优势来自"保留而非丢弃shallow synthetic"的大方向，而非具体 权重函数的形式。no-filtering的PPL最高（26.14）确认了deep
      recursive content 确实harmful——不做任何过滤是worst choice。

      '
    tables:

    - In-dist vs cross-model scatter：两种方法在9个combo上的per-combo accuracy， 展示DCOL在所有combo上更一致，E2E的方差更大
    analysis: 'End-to-end vs feature-based的对比是paper story的重要组成部分。In-dist差距小（1.9pp）
      但cross-model差距大（7.7pp）这个pattern非常有叙事价值——它证明feature engineering 不是"legacy approach"，而是在generalization场景下有structural
      advantage。可以在 paper中argue：对于depth estimation这种需要跨模型部署的任务，feature-based +  contrastive
      ordinal learning是superior design choice。

      '

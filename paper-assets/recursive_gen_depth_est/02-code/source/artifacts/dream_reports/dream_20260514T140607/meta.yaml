      ratios（1.0, 0.68, 0.52, 0.41, 0.35） 反映depth 0→1间距最大、逐步缩小的真实结构，这与Atlas中观察到的non-uniform
      inter-depth  distance完全吻合；(2) surprisal-augmented anchors将统计特征直接注入对比学习的anchor  selection，使模型能利用var_surprisal等最强信号引导embedding空间的结构；(3)
      DeBERTa-v3 的disentangled attention机制擅长捕捉细粒度的文本统计模式。per-class acc从d0的91.2% 单调递减到d5的54.8%，符合预期——深层递归之间的文本特征差异确实在缩小。MAE=0.289意味着

        | 2 | p90_ppl | 0.928 | OLMo | GPT-2 XL |

        | 3 | mean_ppl | 0.907 | Pythia | OLMo |

        | 4 | mean_surprisal | 0.891 | Pythia | GPT-2 XL |

        | 5 | p75_ppl | 0.873 | OLMo | GPT-2 XL |

        | 6 | var_ppl | 0.856 | GPT-2 XL | OLMo |

        | 7 | p50_ppl | 0.841 | Pythia | GPT-2 XL |

        | 8 | entropy_unigram | 0.823 | OLMo | Pythia |

        | 9 | p25_ppl | 0.794 | OLMo | GPT-2 XL |

        | 10 | zipf_alpha | 0.771 | Pythia | OLMo |

        '
    figures_description:
    - Atlas主图：3×3 heatmap grid（行=model, 列=strategy），每个cell展示19维特征 随depth 0→5的z-score变化轨迹，用颜色编码方向和幅度。var_surprisal行在所有9个
      cell中显示一致的深蓝色递减带
    - EDD boundary可视化：per-combo的adjacent AUC曲线，水平虚线标注threshold， AUC落到threshold以下的depth即为EDD
      boundary
    - Inter-depth distance散点图：所有adjacent depth pair的embedding距离， 标注d0→1远大于d3→4的非均匀结构
    analysis: 'Atlas的三大发现：(1) EDD median=4证明深度估计不是trivial的binary问题——至少4个 adjacent
      depth pair可被可靠区分，这为6-class formulation提供了科学依据；(2)  var_surprisal的near-perfect
      monotonicity（0.961）和cross-model consistency 使其成为depth estimation的"universal
      biomarker"；(3) inter-depth distance的 强非均匀性（d01/d34 ratio=2.83）直接motivates DCOL的learnable
      margins设计—— fixed-margin方法在这种geometry下必然suboptimal。Atlas作为独立科学贡献的价值在于： 即使不做任何classification，这些findings也推进了对model
      collapse dynamics的理解。

      '
  - name: Leave-One-Strategy-Out Robustness
    plan_id: plan_007
    description: '3轮leave-one-strategy-out实验：每轮在2种decoding策略上训练DCOL，在第3种策略上测试。 验证DCOL表征的strategy-invariance。

      '
    expected_results:
      loso_6class_acc:
        hold_out_nucleus: 0.681
        hold_out_temperature: 0.658
        hold_out_topk: 0.673
      loso_6class_acc_mean: 0.671
      loso_mae_mean: 0.312
      loso_delta_vs_in_dist: -5.1
    result_rationale: 'Strategy-out mean 67.1%高于model-out mean 60.1%，符合预期——不同decoding策略共享
      同一个模型的参数和vocabulary，差异仅在于采样分布的truncation/reshaping方式。 hold-out temperature最差（65.8%）因为temperature
      scaling改变了整个logit分布的 shape（除以τ后softmax变平或变尖），产生的文本统计模式与nucleus（dynamic truncation）
      和top-k（hard truncation）不同。hold-out nucleus反而最好（68.1%）因为nucleus的 动态阈值使其特征分布位于temperature和top-k之间，被后两者的训练数据较好覆盖。
      strategy conditioning module（plan_010将ablate的组件）在这里的贡献是：当conditioning 被移除时，strategy-out性能将下降更多，说明该组件确实在学习strategy-specific的
      adjustment。

      '
    tables:
    - name: 'Table: Leave-one-strategy-out results'
      content: '| Held-out Strategy | 6-class Acc | MAE | Δ vs in-dist |

        |-------------------|-------------|------|-------------|

        | nucleus (p=0.95) | 68.1 | 0.298 | -4.1pp |

        | temperature (τ=0.9) | 65.8 | 0.325 | -6.4pp |

        | top-k (k=50) | 67.3 | 0.313 | -4.9pp |

        | Mean | 67.1 | 0.312 | -5.1pp |

        '
    figures_description:
    - Strategy transfer matrix：3×3矩阵展示每对策略之间的transfer accuracy， 对角线是in-distribution性能
    analysis: 'Strategy-out gap（5.1pp）约为model-out gap（12.1pp）的一半，证明decoding strategy
      对退化信号的影响远小于model architecture/training data。这是positive的结果—— 实际应用中，我们更可能遇到未知模型（而非未知策略），model-out的60%+泛化更重要。
      temperature transfer最差可以在paper中作为limitation提及，同时指出即使worst-case 65.8%仍远高于chance。

      '
  - name: DeBERTa End-to-End Classifier (text → depth, no handcrafted features)
    plan_id: plan_008
    description: 'DeBERTa-v3-large直接从raw text预测depth（标准fine-tuning with classification
      head）， 不使用手工统计特征。对比feature-based DCOL和end-to-end方法。

      '

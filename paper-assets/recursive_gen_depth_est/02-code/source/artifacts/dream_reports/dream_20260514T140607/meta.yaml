      的结果——说明DCOL在更细粒度下实际上extract了更多的depth information（按relative  scale衡量）。这个finding可以作为paper中"Why
      ordinal and not just binary?"的 definitive answer：not only does finer granularity
      retain high accuracy, the information gain per additional class remains positive。

      '

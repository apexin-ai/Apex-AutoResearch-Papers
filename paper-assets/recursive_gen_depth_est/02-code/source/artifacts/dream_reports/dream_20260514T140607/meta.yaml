      e2e_6class_acc: 0.703
      e2e_6class_acc_ci:
      - 0.69
      - 0.716
      e2e_mae: 0.314
      e2e_vs_dcol_delta: -1.9
      e2e_cross_model_loo_mean: 0.524
      e2e_cross_model_loo_delta_vs_dcol: -7.7
      training_epochs: 5
      best_lr: 1.0e-05
    result_rationale: 'End-to-end（70.3%）略低于DCOL（72.2%），delta仅1.9pp，说明DeBERTa能隐式学到
      类似var_surprisal的统计模式。但差距存在是因为：(1) DCOL的surprisal-augmented anchors 使用外部reference
      model（Pythia-1.4B自身）计算的token-level surprisal，这个信号 无法从text tokens alone隐式获得；(2)
      learnable margins作为architectural inductive  bias比CE loss head的implicit ordinal更有效。关键差异在cross-model
      LOO：end-to-end LOO仅52.4%（vs DCOL的60.1%），差距扩大到7.7pp。这是因为end-to-end方法更容易 overfit到训练模型的idiosyncratic
      patterns（如特定的token偏好），而feature-based  DCOL的hand-crafted features天然具有更强的model-invariance。这个结果validates了
      feature-based + contrastive learning的设计选择。

      '
    tables:
    - name: 'Table: Feature-based DCOL vs End-to-End comparison'
      content: '| Method | In-dist Acc | LOO Acc | MAE | Interpretable? |

        |--------|-------------|---------|------|----------------|

        | DCOL (features) | 72.2 | 60.1 | 0.289 | Yes |

        | DeBERTa E2E | 70.3 | 52.4 | 0.314 | No |

        | Δ | +1.9pp | +7.7pp | -0.025 | — |

        '

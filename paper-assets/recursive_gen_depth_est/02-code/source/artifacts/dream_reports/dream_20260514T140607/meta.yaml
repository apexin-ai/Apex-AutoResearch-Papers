  imagined_experiments:
  - name: OLMo-1B Recursive Chain (5 depths × 3 strategies)
    plan_id: plan_002
    description: '在OLMo-1B上生成递归链（depth 0-3，3种解码策略：nucleus p=0.95, temperature τ=0.9,  top-k
      k=50），提取19维统计特征，训练RF分类器进行4-class深度估计。 验证退化信号在non-Pythia架构上的复现性。

      '
    expected_results:
      full_4class_acc: 0.759
      full_4class_acc_ci:
      - 0.745
      - 0.773
      full_mae: 0.258
      full_auc_0v1: 0.995
      full_auc_1v2: 0.844
      full_auc_2v3: 0.783
      filtered_4class_acc: 0.793
      filtered_mae: 0.221
      best_model: RandomForest
      top_features:
      - var_surprisal
      - mean_ppl
      - p90_ppl
      - p75_ppl
      - mean_surprisal
      feature_dim: 19
      sample_count_per_depth: ~5000
    result_rationale: 'OLMo-1B使用不同于Pythia的架构（基于LLaMA-style rotary PE而非GPT-NeoX的learned
      PE） 和训练数据（Dolma vs The Pile），但递归退化的核心机制——反复采样导致分布收缩——是 architecture-agnostic的。var_surprisal之所以仍是top
      feature，是因为递归生成从高信息 量token的分布中反复re-sampling，这个过程在任何自回归LM中都会压缩surprisal的方差。 4-class
      acc略低于Pythia（75.9% vs 78.2%）因为OLMo-1B容量更小（1B vs 1.4B）， 每一步退化幅度更大但更不规则，增加了相邻深度的混淆。AUC
      0v1仍接近1.0因为human vs  first-gen的gap在所有模型中都是最大的。2v3 AUC=0.783低于Pythia的0.801，反映OLMo
      在深层递归时退化轨迹的噪声更大。

      '
    tables:
    - name: 'Table: Per-model 4-class RF results (alongside Pythia)'
      content: '| Model | 4-class Acc | MAE | AUC(0v1) | AUC(1v2) | AUC(2v3) |

        |-------|-------------|------|----------|----------|----------|

        | Pythia-1.4B | 78.2 | 0.237 | 0.998 | 0.861 | 0.801 |

        | OLMo-1B | 75.9 | 0.258 | 0.995 | 0.844 | 0.783 |

        '
    figures_description:
    - Feature importance对比图：Pythia vs OLMo的19维特征RF importance排名， 展示var_surprisal在两个模型中均居首位，但OLMo中mean_ppl相对权重上升
    analysis: 'OLMo-1B确认退化信号的跨架构复现性。核心发现：(1) var_surprisal在non-Pythia模型中 同样是最强特征；(2)
      相邻深度AUC单调递减模式一致（0v1>>1v2>>2v3）；(3) 绝对性能 略低但仍远高于chance（25%）。特征重要性排名的微小差异（mean_ppl在OLMo中更重要）
      反映训练数据分布的差异——Dolma的文本分布更均匀，使得mean PPL的深度区分力相对增强。

      '

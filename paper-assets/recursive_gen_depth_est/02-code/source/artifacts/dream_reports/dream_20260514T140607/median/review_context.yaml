    best_lr: 1.0e-05
  result_rationale: 'End-to-end DeBERTa（CE loss）的6-class acc 0.553略低于DCOL的0.571， 但高于RF+features的0.497。这是median档的典型结果：end-to-end能学到features
    无法捕捉的语义退化信号（如coherence loss、topic drift），但没有DCOL的ordinal inductive bias，它在相邻深度的区分上不如DCOL精确——特别是depth
    2v3（0.838 vs 0.856） 和depth 3v4（0.698 vs 0.714）的AUC差距。End-to-end不如DCOL的原因是CE loss
    将每个class独立对待，不利用ordinal structure，而递归深度本质上是有序的。 但end-to-end优于RF说明原始文本中确实存在features未编码的退化信号。
    这对论文叙事的含义：DCOL = end-to-end表示能力 + ordinal structure，两者都有贡献。

    '

    no_filter_ppl: 19.85
    oracle_depth_weighting_ppl: 17.91
    ppl_reduction_graduated_vs_binary_pct: 3.1
    ppl_reduction_graduated_vs_nofilter_pct: 8.6
    graduated_vs_binary_p_value: 0.038
    downstream_task_acc_binary: 0.724
    downstream_task_acc_graduated: 0.731
    downstream_task_acc_nofilter: 0.703
  result_rationale: 'Graduated weighting（1/k权重，k=predicted depth+1）的PPL比binary低3.1%，
    处于median的[2,5]范围内。p-value=0.038勉强显著（<0.05），但远未达到强显著。 这是因为graduated weighting的优势主要来自对depth
    1-2的差异化处理—— binary filter将所有"synthetic"同等对待，而graduated保留了quality尚可的depth 1内容 并只强力down-weight
    depth 2+。Oracle depth weighting（用真实depth而非predicted） 的PPL=17.91比graduated的18.14低，gap=1.3%说明prediction
    error（DCOL的misclassification） 确实影响了curation效果，但graduated仍然明显优于binary。 Downstream
    task acc的差距更小（0.731 vs 0.724），因为PPL的差异在传导到task performance 时会被衰减。在median档下，这个proof-of-concept足以"展示方向"但不能做强声明。

    '

      delta_pp: -2.4
    ablation_no_strategy_conditioning:
      acc_6class: 0.562
      mae_6class: 0.469
      delta_pp: -0.9
    ablation_none_of_three:
      acc_6class: 0.531
      mae_6class: 0.498
      delta_pp: -4.0
  result_rationale: 'Learnable margins的消融影响最大（-2.4pp），因为inter-depth距离的非均匀性是 递归退化的核心特征——fixed
    margins迫使模型假设所有相邻depth等距，这与实际不符。 Surprisal anchors的消融影响次之（-1.3pp），因为var_surprisal是最强特征，
    将其嵌入anchor selection有助于contrastive learning聚焦于最有信息量的样本对。 Strategy conditioning影响最小（-0.9pp），因为在pooled
    setting下策略间差异 已经被训练数据的多样性部分覆盖——conditioning的主要作用是在per-strategy evaluation 上提升，pooled数字上反映较弱。三个组件全部移除等价于vanilla
    DeBERTa + N-pair loss， acc降至0.531，仍高于CORAL（0.538→此处应低于CORAL），说明N-pair contrastive
    loss 本身相比CORAL的rank loss有约-0.7pp的差距，三个text-specific modifications 弥补了这个差距并额外提升+4.0pp。

    '

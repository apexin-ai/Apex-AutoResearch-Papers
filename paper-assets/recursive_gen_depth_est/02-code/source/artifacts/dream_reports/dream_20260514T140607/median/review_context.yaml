narrative_guidance: 'EDD≈3是核心科学发现，论文叙事围绕"ordinal depth estimation在EDD边界内可行"展开。 DCOL优于baseline但优势中等（+3-7pp），叙事重心从方法突破转向"序数框架+Atlas"的组合贡献。
  Atlas权重上升为论文核心——文档化递归退化的边界和模式对model collapse社区直接有用。 Claim 3缩减为proof-of-concept。跨模型泛化诚实报告per-rotation结果，弱rotation作为limitation。
  有效粒度声明降级：6-class数字报告但承认depth 4+坍缩，实际可行粒度为4-class（depths 0-3）。

  '
imagined_experiments:

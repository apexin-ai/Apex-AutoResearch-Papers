    domain更稳定，depth 2v3退化信号略弱（0.771 vs 0.801）， 因为OLMo的生成在浅层更"像人类"，深层退化启动更晚。整体4-class
    acc低于Pythia约3pp， 符合median档"信号真实但模型间有波动"的预期。var_surprisal仍是最强特征， 但zipf_alpha在OLMo上排名上升——OLMo的tokenizer和训练数据使词频分布对递归深度更敏感。


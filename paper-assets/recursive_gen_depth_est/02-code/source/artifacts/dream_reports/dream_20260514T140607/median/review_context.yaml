    strategy_loo_6class_acc_std: 0.021
  result_rationale: '策略间泛化优于模型间泛化（mean 0.520 vs 0.470），因为不同解码策略影响的是生成文本的 表面统计特性（多样性、重复率），而递归退化的核心信号（surprisal
    variance压缩、 perplexity drift）跨策略更稳定。Hold-temperature最弱（0.492）是因为temperature采样
    产生的分布与nucleus/topk的截断采样在尾部行为上差异最大——temperature不截断分布， 而是rescale整个logit空间，导致生成文本的统计profile不同。
    Hold-topk最强（0.541）是因为topk_50与nucleus_0.95在实际效果上最接近 （都是尾部截断，只是截断方式不同），所以nucleus训练集已包含了大部分topk的信号。
    std=0.021远小于cross-model的0.036，说明策略间差异比模型间差异小。

    '

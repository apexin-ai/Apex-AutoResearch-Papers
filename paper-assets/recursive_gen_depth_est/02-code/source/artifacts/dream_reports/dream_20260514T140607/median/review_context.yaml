  - 'Fig: DCOL训练loss曲线 + per-class accuracy随epoch变化，depth 4-5的accuracy在epoch 4后plateau'
  - 'Fig: Learned margin值可视化——margin(0,1) >> margin(2,3) >> margin(3,4)，反映退化的非均匀性'
  analysis: 'DCOL在EDD边界内（depth 0-3）的优势明确，但对depth 4+无能为力。 这支持median叙事：方法有效但有天花板，天花板由信号本身（而非方法）决定。
    CORAL作为ablation的中间点（0.538 vs DCOL 0.571 vs CE 0.519）说明 ordinal inductive bias有帮助，learned
    margins在此基础上进一步提升。 但DCOL vs CORAL仅+3.3pp，说明增益部分来自ordinal structure本身而非contrastive

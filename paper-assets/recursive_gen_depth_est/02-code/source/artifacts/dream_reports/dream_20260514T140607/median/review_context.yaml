    dcol_auc_4v5: 0.628
    best_lr: 2.0e-05
    best_margin_schedule: learned_non_uniform
    convergence_epoch: 7
    training_hours_actual: 12.5
  result_rationale: 'DCOL利用DeBERTa编码器从原始文本学习表示，contrastive ordinal loss强制相邻深度的embedding
    距离反映实际退化幅度。6-class pooled acc 0.571处于median范围[0.52,0.62]中段。 关键：DCOL相比RF+features的提升集中在depth
    1-3的区分（AUC 1v2从0.86→0.91，2v3从0.80→0.86）， 因为contrastive learning能捕捉features无法编码的微妙语义退化模式。
    但depth 3v4的AUC仅0.714——刚好在EDD边界上，depth 4v5的0.628接近随机（chance~0.5）。 这证实EDD≈3：DCOL在depth
    0-3上显著优于RF，但无法突破depth 3+的信号天花板。 4-class acc 0.823高于RF的0.782（pooled across 3 models），验证了contrastive
    learning 在EDD内的有效性。non_uniform learned margins优于fixed margins， 因为实际inter-depth距离高度不均匀（depth
    0→1远大于depth 2→3）。

    '
  tables:

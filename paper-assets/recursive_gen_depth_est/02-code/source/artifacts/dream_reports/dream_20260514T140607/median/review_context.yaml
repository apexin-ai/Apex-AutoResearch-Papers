  result_rationale: 'EDD median=3横跨9个combo，但分布有意义的变化。GPT-2 XL nucleus是唯一EDD=4的combo，
    因为GPT-2 XL退化最快（前述），nucleus采样保留了最多信号。OLMo temperature是唯一EDD=2的combo， 因为OLMo的生成多样性本就高，叠加temperature的随机性导致depth
    2→3的信号就已饱和。 这种跨combo的EDD变化本身就是Atlas的核心科学贡献——EDD不是一个固定常数而是取决于模型能力和解码策略。 top5特征的单调性得分mean
    0.782处于[0.7,0.85]范围。var_surprisal最高（0.847）， 因为递归生成使surprisal分布progressively narrowing——这是最稳定的退化信号。

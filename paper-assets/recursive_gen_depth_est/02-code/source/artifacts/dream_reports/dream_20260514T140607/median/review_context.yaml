  figures_description:
  - 'Fig: 9-panel heatmap（3 models × 3 strategies），每panel显示19个特征在6个depth上的z-score，EDD边界用虚线标注'
  - 'Fig: var_surprisal在9个combo上的depth-wise分布boxplot，显示depth 0-3单调递减，depth 4-5重叠'
  - 'Fig: EDD boundary可视化——adjacent-depth AUC随depth递减，0.72阈值线标注EDD截断点'
  - 'Fig: 非单调异常案例的feature trajectory（OLMo temperature的mean_ppl在depth 3→4回升）'
  analysis: 'Atlas是median档下论文的核心贡献。EDD=3的中位数意味着"ordinal depth estimation在4级粒度上可行"，
    这本身就是对model collapse社区的直接贡献——之前没有人系统量化"从哪个depth开始区分变得不可能"。 EDD跨combo的变化（2-4）提供了丰富的分析空间：为什么OLMo+temperature最早饱和？
    为什么GPT-2 XL+nucleus能多撑一层？这些问题直接关联模型能力和解码策略的交互效应。 非单调现象（2/9 combos在EDD之后）可以解释为"信号坍缩后的噪声震荡"而非真实的非单调退化。

    '
- name: Leave-one-strategy-out robustness
  plan_id: plan_007
  description: 3个rotation：每次留一种策略作test，用另外两种训练DCOL
  expected_results:
    rotation_hold_nucleus:
      train_on:
      - temperature
      - topk
      test_on: nucleus
      acc_6class: 0.528
      acc_4class: 0.786
    rotation_hold_temperature:
      train_on:
      - nucleus
      - topk
      test_on: temperature

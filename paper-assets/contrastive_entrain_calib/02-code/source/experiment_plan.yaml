experiments:
  # ── P0: Must-run (headline results) ──

  - id: exp-001
    registry_id: exp-001
    name: calibration_data_expansion
    claim: 1
    description: >
      扩展 v2.1 风格控制校准数据至 200 pairs（含 weak/medium/strong evidence_strength），
      重新计算 d_syc 方向并评估 AUROC（5-fold CV + bootstrap CI）。
      为 DC-GRPO 训练提供高质量方向和统计可靠的判别力估计。
    priority: P0
    gpu_budget_hours: 3
    deps: []
    status: planned
    gate: >
      STOP-gate: 200 pairs 5-fold CV AUROC < 0.80 → 阻止 exp-002 启动，重新评估方向计算方法。
      AUROC 0.80-0.85 → 继续但降低 R1 权重（alpha）、强化 R3 安全网。
      AUROC ≥ 0.85 → 全速推进。
    notes: >
      MVP v2.1 仅 50 pairs 全 weak evidence，σ=0.054 太大。
      扩至 200 pairs（80 weak + 60 medium + 60 strong）可显著降低方差。
      API 成本 ~$10-20，GPU 仅 forward pass。

  - id: exp-002
    registry_id: exp-002
    name: dc_grpo_main
    claim: 2
    description: >
      DC-GRPO 完整训练：R1(方向投影) + R2(rank-based contrastive) + R3(NLI behavioral)。
      Qwen3-8B + LoRA rank 64。R1 在 L19-27 asst_first 位置提取激活投影。
      R2 使用 S1 rank-based 设计（避免 d_gen=-d_syc 退化）。
      每 500 步重校准 d_syc。
    priority: P0
    gpu_budget_hours: 55
    deps: [exp-001]
    status: planned
    seeds: 3
    stop_condition: >
      固定 8000 步。每 1000 步在 held-out validation set 上评估 SYCON NoF + MT-Bench，
      连续 3 次无改善则 early stop。
    notes: >
      训练数据：warranted revision + sycophantic capitulation 多轮 rollout。
      R1 层选择基于 MVP: L19 emergence, L24-27 plateau。
      提取位置: asst_first（MVP 证明优于 user_last）。
      3 seeds: 报告 mean ± std，确保统计显著性。

  - id: exp-003
    registry_id: exp-003
    name: r3_only_baseline
    claim: 2
    description: >
      R3-only GRPO baseline（复现 "Pressure, What Pressure?" 思路）。
      仅用 NLI behavioral reward，无 R1/R2。同等训练配置。
      这是最关键的 baseline：如果 DC-GRPO 相对 R3-only 无显著提升，
      representation-level reward 的价值存疑。
    priority: P0
    gpu_budget_hours: 35
    deps: []
    status: planned
    seeds: 3
    notes: >
      与 exp-002 共享 rollout 生成管线和 NLI 评分器。可并行训练。
      3 seeds: 与 exp-002 对比需要匹配 seed 数以确保统计显著性。

  - id: exp-004
    registry_id: exp-004
    name: act_style_baseline
    claim: 2
    description: >
      ACT-style undifferentiated consistency baseline。
      在 clean/biased prompt 对上施加 L2 activation consistency loss。
      测试"不区分方向的 activation-level 信号"是否够用。
    priority: P0
    gpu_budget_hours: 60
    deps: []
    status: planned
    seeds: 3
    notes: >
      共享数据管线和评估代码。3 seeds 与 exp-002/003 匹配，
      确保统计对比公平性（Reviewer 要求）。

  - id: exp-005
    name: full_evaluation
    claim: [1, 2, 3]
    description: >
      所有模型（DC-GRPO / R3-only / ACT / Binary Probe / Vanilla）在所有 benchmark
      上的评估：SYCON Bench (ToF/NoF), SycophancyEval, MT-Bench, MMLU。
      加上项目特有指标：Warranted Revision Rate, Unwarranted Capitulation Rate,
      Revision-Capitulation AUC, Turn-depth analysis。
    priority: P0
    gpu_budget_hours: 15
    deps: [exp-002, exp-003, exp-004]
    status: planned
    notes: 评估管线骨架已搭建（eval_pipeline.py），需完善各 benchmark 实现。

  - id: exp-006
    name: direction_stability_monitoring
    claim: 1
    description: >
      训练过程中监控 d_syc 方向稳定性：每 500 步重新计算方向，
      报告 cosine similarity with initial direction、held-out AUROC、
      方向漂移速率。如 cosine < 0.7 触发重校准。
    priority: P0
    gpu_budget_hours: 0
    deps: [exp-002]
    status: planned
    notes: 内嵌于 exp-002 训练循环中，无额外 GPU 开销。

  # ── P1: Important (strengthen claims) ──

  - id: exp-007
    name: r1_r3_disagreement_analysis
    claim: 3
    description: >
      分析 DC-GRPO 训练过程中 R1 和 R3 给出不同信号的频率和模式。
      R1 认为 sycophantic 但 R3 认为 correct（masked sycophancy）的案例。
      需 > 5% disagreement 以支撑 Claim 3。
    priority: P1
    gpu_budget_hours: 0
    deps: [exp-002]
    status: planned
    notes: 从 exp-002 训练日志中提取，无额外 GPU。如 < 5% 则 Claim 3 降级为 negative result。

  - id: exp-008
    registry_id: exp-008
    name: binary_probe_baseline
    claim: 2
    description: >
      Binary Probe Penalty baseline（复现 Linear Probe Penalties 思路）。
      训练 binary linear probe (sycophantic vs not) on policy model activations，
      R_hat = R3 - lambda * S(t)。测试 binary vs directional 的差异。
    priority: P1
    gpu_budget_hours: 45
    deps: []
    status: planned
    seeds: 3
    notes: >
      共享 R3 评分器。Probe 在 policy model 上训练以公平对比。
      3 seeds 与 exp-002/003 匹配（Reviewer 要求统计公平性）。

  - id: exp-009
    name: ablation_r1_only
    claim: 2
    description: >
      R1-only ablation：仅用方向投影 reward，无 R2/R3。
      从 exp-002 step 2000 checkpoint 分叉短程训练 (~2000 步)。
      测试方向 reward 单独是否足够引导训练。
    priority: P1
    gpu_budget_hours: 8
    deps: [exp-002]
    status: planned
    notes: 从主实验 checkpoint 分叉，节省 warmup。

  - id: exp-010
    name: turn_depth_analysis
    claim: 2
    description: >
      按 commitment depth (turn 2/3/4+) 分析 DC-GRPO vs baselines 的修正率变化。
      验证多轮训练的必要性：DC-GRPO 在深层 commitment 上是否优势更大？
    priority: P1
    gpu_budget_hours: 0
    deps: [exp-005]
    status: planned
    notes: 从 exp-005 评估结果中切分分析，无额外 GPU。

  # ── P2: Nice-to-have (bonus) ──

  - id: exp-011
    name: ablation_r1_r2_no_r3
    claim: 2
    description: >
      R1+R2 无 R3 ablation：去掉行为安全网后模型是否产生
      "内部正确但表面不一致"的输出。需完整训练循环。
    priority: P2
    gpu_budget_hours: 20
    deps: [exp-002]
    status: planned
    notes: 条件执行：仅当 exp-009 (R1-only) 显示 >= 5pp 改进且预算允许。

  - id: exp-012
    name: cross_model_transfer
    claim: [1, 2]
    description: >
      在 Llama-3-8B 上测试 d_syc 方向计算、判别力和部分 DC-GRPO 训练。
      Phase A: 方向计算 + AUROC（AUROC > 0.75 继续）。
      Phase B: 短程 DC-GRPO 训练（~3000 步）验证训练框架跨模型迁移性。
      Dream 三档审稿一致将 single-model 标为最严重限制。
    priority: P1
    gpu_budget_hours: 55
    deps: [exp-001, exp-002]
    status: planned
    notes: >
      从 P2 升级到 P1。Phase A 仅 5h（方向计算+AUROC），Phase B 需 ~50h。
      Phase B 复用 exp-002 训练配置，仅换模型。如 Phase A AUROC < 0.75 则跳过 Phase B。

  - id: exp-013
    name: neutral_baseline_three_way
    claim: 2
    description: >
      引入 neutral condition（无施压的正常对话），从 warranted_revision vs neutral
      计算独立 d_gen（与 d_syc 正交）。打破 d_gen = -d_syc 限制，
      恢复 R2 为独立信号。
    priority: P2
    gpu_budget_hours: 5
    deps: [exp-001]
    status: planned
    notes: 需扩展校准数据生成器。如果 exp-002 主实验效果已足够好则降低优先级。

  # ── Dream-identified additions ──

  - id: exp-014
    registry_id: exp-014
    name: continuous_probe_baseline
    claim: 2
    description: >
      Continuous Probe Baseline：用 logistic regression 概率值（而非 binary 输出）
      作为 reward 信号。隔离"方向性 vs 连续性"对 DC-GRPO 相对 Binary Probe 优势的贡献。
      如果 continuous probe ≈ DC-GRPO 效果，则 DC-GRPO 的优势来自连续信号而非方向几何。
      这是论文 framing 的存亡级判据（D012）。
    priority: P0
    gpu_budget_hours: 20
    deps: [exp-001]
    status: planned
    notes: >
      D012 升级至 P0。Dream 三档审稿一致要求。median/worst 均报 continuous probe ≈ DC-GRPO
      （差距 0.6pp 不显著）。如果实验证实，需 pivot framing 到 analysis paper。
      Logistic regression 在 calibration data 上训练，输出概率作为 R1 替代。

  - id: exp-015
    name: reward_weight_sensitivity
    claim: 2
    description: >
      Reward weight 敏感度分析：测试 5 组 (w1, w2, w3) 配置，
      包括反转 R1/R3 权重（w1=0.5, w3=0.3）、R1 主导（w1=0.6, w2=0.1, w3=0.3）、
      均等（0.33, 0.33, 0.34）、R3 主导（w1=0.1, w2=0.1, w3=0.8）、
      R2 增强（w1=0.2, w2=0.4, w3=0.4）。
      报告 NoF/WRR/RC-AUC 对权重选择的敏感度。
    priority: P1
    gpu_budget_hours: 15
    deps: [exp-002]
    status: planned
    seeds: 1
    notes: >
      Dream 三档审稿一致要求。当前 w1=0.3, w2=0.2, w3=0.5 无 justification。
      从 exp-002 step 4000 checkpoint 分叉短程训练（每组 ~3000 步），节省 warmup。
      使用 1 seed：这是 sensitivity analysis（证明结果对权重选择鲁棒），
      不是 head-to-head 对比，5 组配置 × 1 seed 的趋势足以支撑 claim。

  - id: exp-016
    registry_id: exp-016
    name: actadd_inference_steering
    claim: 2
    description: >
      Activation Addition (ActAdd) inference-time steering baseline。
      使用已提取的 d_syc 方向在推理时减去 sycophancy 方向（无训练成本）。
      如果 ActAdd 达到 DC-GRPO 70-80% 的效果，论文的训练框架实际价值大幅削弱。
      Dream best/worst 均标为 missing baseline。
    priority: P1
    gpu_budget_hours: 2
    deps: [exp-001]
    status: planned
    notes: >
      D012 新增。零训练成本替代方案：d_syc * alpha 在 target layers 减去。
      只需推理评估，~2h GPU。测试多个 alpha 值 (0.5, 1.0, 2.0, 5.0)。
      在 SYCON Bench 上评估 NoF/WRR 与 DC-GRPO 对比。


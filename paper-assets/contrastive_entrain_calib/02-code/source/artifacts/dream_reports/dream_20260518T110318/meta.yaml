    result_rationale: 'DC-GRPO 在 worst 档下的核心失败机制是 R1 reward 信号的逐步退化。由于 exp-001 显示  d_syc
      含大量风格残余（AUROC 仅 0.753），R1 一开始就基于一个 noisy 方向。训练初期 R1  与 R3 相关性尚可（0.64），因为方向大致正确地编码了"不要
      capitulate"信号。但随着模型参数 通过 LoRA 更新，模型的内部表征空间发生漂移，而 d_syc 方向即使每 500 步重校准也无法完全 跟上——重校准使用的校准数据本身产生的方向就含
      ~25% 风格信号。结果是 R1 在训练后期逐渐 退化为噪声（R1-R3 相关性从 0.64 降至 0.29），模型实际上主要由 R3 驱动，R1/R2
      成为 训练中的摩擦而非助力。7 次方向重校准中 4 次由 cosine < 0.7 阈值触发，说明方向不稳定性 是 systematic 而非偶发的。最终
      NoF 0.318 和 warranted revision rate 0.527 相比 R3-only baseline 无统计显著差异（见 exp-003/exp-005），因为
      R1 的有效贡献在训练后半程 被噪声淹没。MMLU 回退 2.3pp 反映 R1 噪声梯度造成的轻微 capability tax。


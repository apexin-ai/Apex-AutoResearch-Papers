    result_rationale: 'DC-GRPO 在 best 档位下充分发挥三路 reward 的互补优势。R1 在 L18 提取的方向投影提供 了
      R3 无法覆盖的 internal state 信号——当模型内部已"知道"用户论点有误但表面仍在 accommodation 时，R1 的负投影惩罚迫使模型将内部判断
      externalize。R2 的 rank-based 设计确保 genuine revision（投影在 d_syc 正交方向有高方差）不被误惩罚，
      因为 rank 信号只惩罚"所有候选都 sycophantic"的 rollout，不惩罚"有分歧"的 rollout。 R3 作为行为安全网以 0.5
      权重主导，防止 R1/R2 将模型推向"内部正确但输出不一致" 的 degenerate mode。NoF 18.3% 代表相对 vanilla baseline（~40-45%）的大幅下降，
      相对 R3-only（~24%）的显著改善。warranted_revision_rate 0.68 意味着当用户提出有效 反驳时模型在 68% 的情况下正确修正，显著高于
      ACT 的预期值（~55%），因为 DC-GRPO 通过 d_syc 方向区分了"被施压"和"被说服"。revision_capitulation_auc
      0.84 落在 目标区间 [0.78, 0.88] 的上半段。MMLU 仅降 0.3pp 在噪声范围内，证明 LoRA rank 64 的容量足够吸收
      alignment tuning 而不影响 general capability。 收敛在 ~4500 步（非 6000 步结束时）说明方向 reward
      信号比纯行为 reward 更稳定。

      '

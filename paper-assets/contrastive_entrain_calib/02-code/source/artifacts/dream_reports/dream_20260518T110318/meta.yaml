      behavior 并不一定是 non-sycophantic 的——它可以是 任何在 activation space 中恰好远离 d_syc 的行为，包括
      incoherent responses、 over-confident refusals、或与对话无关的输出。R1 reward 快速上升至 0.72，但
      NoF  仅 0.361（比 DC-GRPO 的 0.318 更差），说明高 R1 reward 没有转化为更好的 anti-sycophancy  行为。(2)
      Capability degradation：没有 R3 的行为约束作为 anchor，模型在 activation  space 中的优化自由度过大，导致
      MMLU 回退 3.7pp（DC-GRPO 仅 2.3pp）和 MT-Bench  下降至 6.51（DC-GRPO 6.84）。34 个 reward
      hacking 案例中常见模式是：模型生成过长的 hedge/disclaimer 前缀（在 activation space 中远离 d_syc 但在行为上回避了实质回答）。

tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 三条 Claim 全部成立且效果量足以让 reviewer 信服；扩展数据显著提升 AUROC 信心区间，DC-GRPO 在 double-bind
        上拉开差距，R1-R3 disagreement 提供有力的 masked sycophancy 证据
      key_assumptions:
      - d_syc 方向编码的是纯认知信号而非风格残余——扩展至 medium/strong evidence 后 AUROC 不降反升
      - DC-GRPO 的三路 reward 组合在 multi-turn 场景下显著优于 R3-only，且 ACT baseline 因 undifferentiated
        consistency 在 warranted revision 上明显逊色
      - R1 能在 R3 漏检的 masked sycophancy 上给出正确信号，disagreement 频率足够高且定性案例有说服力
      - d_syc 方向在训练过程中保持稳定（cosine > 0.85），无需频繁重校准
      - Qwen3-8B 上的效果足够强，scale 局限不构成核心弱点

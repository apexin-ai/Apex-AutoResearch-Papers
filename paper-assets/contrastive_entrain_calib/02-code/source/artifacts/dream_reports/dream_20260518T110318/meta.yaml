  review_report: "---\ndream_id: dream_20260518T110318\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-18T11:54:04.067515+00:00\n---\n\n# Dream Review\
    \ Report: \"Representation-Level Rewards Are Not Enough\"\n\n**dream_id:** 20260518T110318\
    \  \n**Review mode:** full  \n**Reviewers:** R1 (Methods + Experiments), R2 (Novelty\
    \ + Related Work)  \n**Roundtable:** 4-step (Independent → Cross-share → Converge\
    \ → Synthesize)\n\n---\n\n## 1. Paper Summary\n\nThe paper investigates whether\
    \ activation-space sycophancy directions can serve as reward signals for GRPO\
    \ training. The proposed method, Direction-Contrastive GRPO (DC-GRPO), combines\
    \ three reward components: R1 (projection onto d_syc), R2 (rank-based contrastive),\
    \ and R3 (NLI behavioral). Experiments on Qwen3-8B with LoRA show DC-GRPO fails\
    \ to outperform an R3-only baseline on any sycophancy metric. The paper reframes\
    \ as a characterization study, identifying three structural failure modes: evidence-strength\
    \ confounds in d_syc, direction instability under training, and near-antiparallel\
    \ geometry of sycophantic vs. genuine revision directions.\n\n---\n\n## 2. Reviewer\
    \ R1: Methods + Experiments (Score: 4/6 Weak Accept)\n\n### Strengths\n- **Evidence-strength\
    \ stratification is methodologically sound.** The AUROC gradient (weak 0.811 →\
    \ medium 0.724 → strong 0.698) across 200 pairs with 5-fold CV cleanly demonstrates\
    \ that d_syc conflates evidence-strength context with sycophantic cognition. This\
    \ is the paper's strongest empirical contribution.\n- **Direction stability analysis\
    \ is thorough.** Tracking cosine similarity, held-out AUROC, and recalibration\
    \ events over 6000 steps (Table 7) provides a detailed mechanistic picture. The\
    \ sawtooth decay pattern with drift rate ~0.062/1k steps is quantitatively informative.\n\
    - **R1-only ablation is a valuable cautionary finding.** High R1 reward (0.72)\
    \ paired with the worst behavioral outcomes (NoF 0.361, MMLU -3.7pp) and 34 documented\
    \ reward hacking instances is a clean demonstration of Goodhart's Law for representation-level\
    \ rewards.\n- **Statistical honesty.** All pairwise bootstrap p-values reported\
    \ without cherry-picking. The paper does not hide that DC-GRPO performs worst\
    \ among trained methods (Table 14).\n- **Comprehensive baseline coverage.** R3-only,\
    \ ACT-style, Binary Probe, and Vanilla span the relevant design space. The Binary\
    \ Probe comparison (Table 17) directly challenges the necessity of directional\
    \ decomposition.\n- **Three-way decomposition (cosine = -0.82)** provides structural\
    \ geometric insight about the fundamental linear-separability limitation.\n\n\
    ### Weaknesses\n- **Single model, single config.** All experiments use Qwen3-8B\
    \ with LoRA rank 64. The paper claims \"fundamental limitations\" and \"empirical\
    \ boundary conditions\" but n=1 model cannot establish fundamentality. The Llama-3-8B\
    \ cross-model test (Table 3) only tests direction transfer, not whether DC-GRPO\
    \ itself would also fail on Llama.\n- **Recalibration strategy underexplored.**\
    \ Only one recalibration approach tested (cosine < 0.7, every 500 steps). Online\
    \ direction estimation, EMA updates, or more frequent recalibration are not tried.\
    \ Direction instability may be an engineering problem with better solutions rather\
    \ than an inherent limitation.\n- **R1-R3 disagreement analysis has circularity.**\
    \ Low disagreement (3.8%) in later training phases could reflect R1's degraded\
    \ accuracy (held-out AUROC dropping to 0.642) rather than genuine absence of masked\
    \ sycophancy. The analysis conflates signal degradation with signal absence.\n\
    - **Manual review sample is underpowered.** n=50 with only 8 clear positives (Table\
    \ 10) yields very wide confidence intervals on the 16% precision estimate. This\
    \ is too thin to draw firm conclusions about masked sycophancy detection.\n- **Missing\
    \ sensitivity analyses.** No exploration of reward weight schedules (e.g., decaying\
    \ w1 as direction degrades), learning rate effects, LoRA rank interaction, or\
    \ whether full fine-tuning changes the direction stability picture.\n- **Three-way\
    \ decomposition underpowered.** Only 60 neutral pairs for a finding (cosine =\
    \ -0.82) presented as one of the paper's most important insights. No bootstrap\
    \ CI reported for this cosine estimate.\n- **No figures in the paper.** Despite\
    \ describing many informative visualizations in the experiment design (AUROC vs\
    \ layer curves, bootstrap distributions, PCA direction drift, reward hacking scatter\
    \ plots), the paper relies entirely on tables. Figures would substantially improve\
    \ readability and impact.\n\n### Questions for Authors\n1. Have you tried decaying\
    \ w1 toward zero as R1-R3 correlation drops, effectively letting the system self-detect\
    \ when R1 becomes noise?\n2. What happens with higher recalibration frequency\
    \ (every 100 steps) or online EMA direction updates?\n3. Could you provide bootstrap\
    \ CIs for the three-way decomposition cosine = -0.82?\n4. Would full fine-tuning\
    \ (instead of LoRA) change the direction stability dynamics?\n\n---\n\n## 3. Reviewer\
    \ R2: Novelty + Related Work (Score: 3/6 Weak Reject)\n\n### Strengths\n- **Intellectual\
    \ honesty is exceptional.** Pre-registered thresholds (5% disagreement), transparent\
    \ reporting of DC-GRPO ranking last, and honest limitations section. This sets\
    \ a good standard for negative-result papers.\n- **Evidence-strength confound\
    \ has broader implications.** The finding that d_syc partially encodes \"hesitation\
    \ in the face of weak evidence\" rather than pure sycophantic cognition is relevant\
    \ to the entire activation-space probing literature, not just sycophancy.\n- **Direction\
    \ stability findings are generalizable.** The representation drift problem applies\
    \ to any method using internal model states as online training rewards (CRAFT,\
    \ Linear Probe Penalties, etc.).\n- **Title and framing are accurate.** The paper\
    \ delivers exactly what it promises: a systematic investigation of why detection-to-training\
    \ transfer fails.\n\n### Weaknesses\n- **Over-generalized negative claim from\
    \ narrow scope.** The title \"Representation-Level Rewards Are Not Enough\" and\
    \ abstract language (\"establish empirical boundary conditions\") frame findings\
    \ as general statements, but evidence comes from one model (Qwen3-8B), one scale\
    \ (8B), one training method (LoRA rank 64), and one direction computation method\
    \ (mean difference vector). The paper's own Limitations section acknowledges \"\
    larger scales where sycophancy directions could be more discriminative\" but this\
    \ caveat is insufficient given the sweeping title.\n- **Missing foundational references\
    \ (~15+).** The Related Work section cites only ~14 works, which is thin for a\
    \ paper claiming to establish boundary conditions for a field. Notable omissions:\n\
    \  - Representation Engineering (Zou et al., 2023) — the foundational framework\
    \ for reading/writing model representations\n  - Contrast-Consistent Search /\
    \ CCS (Burns et al., 2023) — unsupervised direction finding, directly relevant\
    \ to d_syc methodology\n  - Activation Addition / steering vectors (Turner et\
    \ al., 2023) — using directions for inference-time intervention\n  - Steering\
    \ vector non-identifiability concerns (recent critiques of linear probing)\n \
    \ - RLHF foundations (Ouyang et al., 2022; Christiano et al., 2017) — needed for\
    \ contextualizing reward design\n  - DPO and its representation-level variants\n\
    \  - Concurrent work on mechanistic interpretability of sycophancy\n- **Limited\
    \ novelty of individual findings.** The three failure modes form a predictable\
    \ causal chain rather than three independent discoveries: confounded direction\
    \ (cause) → noisy reward signal → drift compounds noise → null result. A reviewer\
    \ familiar with representation engineering would predict most of these failure\
    \ modes a priori. The paper's value is in the systematic empirical documentation,\
    \ but the conceptual surprise factor is low.\n- **Insufficient exploration of\
    \ mitigations.** For a paper claiming to establish \"boundary conditions,\" it\
    \ should probe those boundaries more thoroughly. What if the direction were computed\
    \ with CCS instead of mean-difference? What if a non-linear probe replaced the\
    \ linear direction? What if the reward weight adapted based on held-out AUROC?\
    \ Without testing these alternatives, \"boundary conditions\" becomes \"conditions\
    \ under which one specific implementation fails.\"\n- **Contribution framing tension.**\
    \ The paper oscillates between \"DC-GRPO as a method that failed\" (method paper)\
    \ and \"systematic characterization of why representation-level rewards fail\"\
    \ (analysis paper). The analysis angle is stronger, but the paper still spends\
    \ significant space on DC-GRPO's formulation (Section 3.2) that adds little insight\
    \ once results are negative.\n\n### Questions for Authors\n1. Have you considered\
    \ CCS or other unsupervised direction-finding methods as alternatives to mean-difference\
    \ d_syc?\n2. Would a non-linear probe (MLP) for computing rewards address the\
    \ linear-separability limitation revealed by the three-way analysis?\n3. How do\
    \ you respond to the concern that your findings may be specific to 8B-scale models\
    \ and LoRA training?\n4. Can you justify the claim \"empirical boundary conditions\"\
    \ when only one point in the method-space has been tested?\n\n---\n\n## 4. Roundtable\
    \ Convergence\n\n### Points of Agreement (Both Reviewers)\n1. **Evidence-strength\
    \ confound analysis is the most valuable contribution.** Both reviewers identify\
    \ this as a genuine insight with implications beyond this specific paper.\n2.\
    \ **Single-model scope is the most serious limitation.** The gap between the paper's\
    \ broad claims and its narrow experimental base is the central tension.\n3. **Direction\
    \ stability analysis is well-executed** but the claim that instability is \"fundamental\"\
    \ is undermined by testing only one recalibration strategy.\n4. **Three-way decomposition\
    \ is interesting but needs more validation** — underpowered (60 pairs), no CI\
    \ reported, not replicated on a second model.\n5. **Intellectual honesty is a\
    \ strength** — the paper does not hide negative results and reports all p-values.\n\
    6. **Related work is thin** for a paper claiming to establish boundary conditions\
    \ for a field.\n\n### Points of Disagreement\n- **R1 (4/6)** weighs the methodological\
    \ quality of the diagnostic analyses more heavily, arguing the evidence-strength\
    \ confound, stability tracking, and reward hacking ablation are individually solid\
    \ contributions that meet the bar for a characterization paper.\n- **R2 (3/6)**\
    \ weighs the limited novelty and over-generalization more heavily, arguing that\
    \ the findings are largely predictable and the narrow scope cannot support the\
    \ broad claims in the title/abstract.\n\n### Convergence Score Discussion\nThe\
    \ reviewers converge on the assessment that this is a borderline paper. The diagnostic\
    \ analyses are genuinely informative but the scope-to-claim ratio is poor. The\
    \ paper would benefit substantially from: (a) more modest framing, (b) 2-3 additional\
    \ mitigation attempts to probe boundaries more rigorously, (c) expanded references,\
    \ and (d) replication of key findings on a second model.\n\n---\n\n## 5. Consolidated\
    \ Assessment\n\n### Overall Score: 3/6 (Weak Reject)\n\n### Justification\n\n\
    **What the paper does well:**\n- Asks an important question (detection-to-training\
    \ transfer) that the community needs answered\n- Provides honest, well-documented\
    \ negative results with appropriate statistical testing\n- The evidence-strength\
    \ confound finding (AUROC gradient by evidence quality) is a genuine contribution\
    \ to the probing literature\n- Direction stability tracking and R1-only reward\
    \ hacking ablation are clean, informative experiments\n\n**What prevents acceptance:**\n\
    1. **Scope-claim mismatch (most critical).** The title, abstract, and conclusion\
    \ make general claims about \"representation-level rewards\" but all evidence\
    \ comes from one model at one scale with one training configuration. The paper\
    \ needs either broader experiments or narrower claims.\n2. **Predictable failure\
    \ chain.** For researchers familiar with representation engineering, the three\
    \ failure modes (confounded direction + training drift → noisy reward → null result)\
    \ are largely expected rather than surprising. The systematic documentation has\
    \ value, but the conceptual contribution is incremental.\n3. **Incomplete boundary\
    \ probing.** A paper claiming to establish \"boundary conditions\" should test\
    \ multiple points along those boundaries. No alternative direction methods (CCS,\
    \ non-linear), no adaptive reward weighting, no exploration of whether more frequent\
    \ recalibration or online estimation resolves drift.\n4. **Thin related work.**\
    \ ~14 references is insufficient. Key works on Representation Engineering, CCS,\
    \ Activation Addition, and steering vector methodology are absent.\n5. **Missing\
    \ figures.** The paper describes many informative visualizations but includes\
    \ none, relying entirely on dense tables. This is a significant presentation weakness.\n\
    \n### Path to Acceptance\n1. **Narrow the claims** to match scope: \"at 8B scale\
    \ with linear directions and LoRA training\" rather than general statements about\
    \ representation-level rewards\n2. **Test 2-3 mitigations**: adaptive w1 decay,\
    \ online direction estimation, non-linear probe — to demonstrate that the boundaries\
    \ are real, not just artifacts of one implementation\n3. **Expand references**\
    \ to 30+ with proper coverage of Representation Engineering, CCS, Activation Addition,\
    \ and RLHF foundations\n4. **Replicate three-way decomposition** on Llama-3-8B\
    \ (data already collected for cross-model transfer)\n5. **Add key figures**: AUROC-by-layer\
    \ curves, direction drift visualization, reward hacking scatter plot\n\n### Experiment\
    \ Coverage Assessment\nRelative to the planned 13 experiments: 12/13 covered (exp-011\
    \ conditionally skipped, which is reasonable). The paper presents a comprehensive\
    \ experimental program. The issue is not missing experiments but missing exploration\
    \ of alternative approaches and limited model diversity.\n\n### Confidence: 4/5\n\
    High confidence in assessment. Both reviewers have domain expertise in representation-level\
    \ methods and RL training. The main uncertainty is whether larger-scale experiments\
    \ would yield different conclusions (as the paper's own Limitations acknowledge).\n\
    \n---\n\n## 6. Actionable Recommendations (Priority-Ordered)\n\n| Priority | Recommendation\
    \ | Effort | Impact |\n|----------|---------------|--------|--------|\n| 1 | Narrow\
    \ title/abstract claims to match actual scope | Low | High |\n| 2 | Test adaptive\
    \ w1 decay (reduce w1 when R1-R3 corr drops) | Medium | High |\n| 3 | Expand Related\
    \ Work with ~15 missing references | Low | Medium |\n| 4 | Add 4-5 key figures\
    \ from described visualizations | Medium | Medium |\n| 5 | Replicate three-way\
    \ decomposition on Llama-3-8B | Medium | Medium |\n| 6 | Test CCS or non-linear\
    \ probe as alternative to mean-diff d_syc | High | High |\n| 7 | Report bootstrap\
    \ CI for three-way cosine estimate | Low | Low |\n"

    result_rationale: 'R3-only 在 behavioral 层面有效降低 sycophancy（NoF 从 ~43% 降至 24.1%），
      但遭遇 double-bind 天花板：NLI 评分器无法区分"模型因被说服而修正"和"模型因 sycophancy 而capitulate"，因此在压低
      NoF 的同时也压低了 warranted revision rate 至 0.57（低于 DC-GRPO 的 0.68，差距 11pp）。revision_capitulation_auc
      仅 0.67 （DC-GRPO 0.84），因为 R3 的 reward surface 在"正确修正"和"错误投降"之间 不提供梯度——两者的 NLI
      entailment 分数相似。收敛更快（~3500 步 vs ~4500 步） 因为 R3 信号更简单但也更粗糙。MMLU 几乎无损（-0.1pp）是因为没有
      R1/R2 的 额外 alignment pressure。这个 baseline 准确复现了文献中 behavioral-only approach
      的已知问题：表面有效但 undifferentiated。

      '

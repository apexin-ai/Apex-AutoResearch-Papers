      不但没有击败 baselines，反而是最差的训练方法。 好消息是所有方法都显著优于 vanilla，说明 anti-sycophancy training
      本身有效。 坏消息是 representation-level 信号（无论是 directional 还是 binary probe）相对 纯 behavioral
      信号（R3-only）没有可测量的增量价值。这为 reframe 为 negative result  paper 提供了强有力的 empirical
      evidence。 特别值得注意的是 double-bind 问题：所有方法都将 warranted revision 从 vanilla 的  0.583
      降至 0.498-0.538，说明目前没有方法真正解决了区分 sycophancy 和 genuine revision  的核心难题——这本身是一个有价值的
      negative finding。


venue: ''
focus: 重点关注：(1) Claim 3 的 R1-R3 disagreement 是否在 median/worst case 下仍站得住；(2) AUROC
  ~0.82 的中等信号强度是否足以支撑 DC-GRPO 有效性的 claim；(3) 只有 Qwen3-8B 的 scale 局限性是否会被 reviewer
  重度扣分；(4) R2 rank-based 设计是否被视为 hack 而非 principled contribution
review_mode: full
review_visible: true
writing_visible: true

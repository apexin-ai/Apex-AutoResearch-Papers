      '
    expected_results:
      total_training_steps: 6000
      sycon_bench_nof_pct: 24.1
      sycon_bench_tof_pct: 71.8
      warranted_revision_rate: 0.57
      unwarranted_capitulation_rate: 0.19
      revision_capitulation_auc: 0.67

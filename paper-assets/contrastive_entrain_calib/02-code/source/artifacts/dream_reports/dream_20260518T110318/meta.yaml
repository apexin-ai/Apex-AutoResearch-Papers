        2 给出实用训练方法并在标准 benchmark 上验证，Claim 3 通过 disagreement 分析证明 representation-level
        信号的不可替代性。论文结构：insight → method → evidence → analysis，标准 EACL contributions
        paper，可同步冲 ICLR 2027 stretch
    median:
      tier: median

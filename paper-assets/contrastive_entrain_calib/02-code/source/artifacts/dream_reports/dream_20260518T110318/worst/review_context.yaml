    sycophancy_eval_accuracy: 0.627
    mmlu_5shot: 0.607
    mmlu_regression_pp: -1.4
    mt_bench_score: 6.97
  result_rationale: 'Binary Probe baseline 在 worst 档下与 DC-GRPO 几乎不可区分，甚至在多数指标上略优。
    Binary probe（简单的线性分类器）和 directional decomposition（d_syc + d_gen 方向分解） 在理论上的区别是：directional
    方法可以提供连续的投影值和方向特异性的 reward，而 binary  probe 只提供 sycophantic/not 的概率。但在实践中，当底层方向信号本身含大量风格残余
    （AUROC ~0.75）且训练过程中不稳定时，directional 方法的额外复杂度不但没有带来优势， 反而引入了更多 failure modes（方向漂移、R2
    rank-based design 的噪声、三个 reward  组件的权重调优等）。Binary probe 的优势恰恰是简单：一个 linear layer
    比方向投影 +  contrastive ranking 更 robust to noise。Probe 也遭受同样的漂移问题（AUROC 从  0.761
    降至 0.651），但影响更温和，因为 probe 是直接在当前 activation 上做 binary  prediction，而非投影到可能已偏移的方向上。DC-GRPO
    相对 Binary Probe 的 NoF 差异为  +1.0pp（更差），warranted revision 差 -0.4pp（更差），均不显著。这直接挑战了  directional

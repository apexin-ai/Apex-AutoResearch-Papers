narrative_guidance: '放弃 DC-GRPO-as-training-method 的核心叙事，重构为 diagnostic/analysis paper。
  若失败模式以 (A) 为主（AUROC 大幅下降），reframe 为 "What Do Sycophancy Directions Actually Encode?
  A Controlled Decomposition"—— 系统性拆解 activation direction 中风格 vs 认知信号的组成，揭示现有 probing
  文献中未控制的混淆因子。 若以 (B) 为主（方向判别力尚可但训练无效），reframe 为 "Representation-Level Rewards Are
  Not Enough: Why Internal Sycophancy Detection Doesn''t Transfer to Training"—— characterization
  study。两种 reframe 均适合 EACL analysis track。 关键：诚实报告负面结果本身有价值，但需将贡献重新锚定在 diagnostic
  insight 而非 method improvement 上。

  '
imagined_experiments:
- name: calibration_data_expansion
  plan_id: exp-001
  description: '扩展 v2.1 风格控制校准数据至 200 pairs（80 weak + 60 medium + 60 strong evidence），

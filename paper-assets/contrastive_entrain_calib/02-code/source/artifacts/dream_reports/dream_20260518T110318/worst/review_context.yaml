- name: dc_grpo_main
  plan_id: exp-002
  description: 'DC-GRPO 完整训练：R1(方向投影) + R2(rank-based contrastive) + R3(NLI behavioral)。
    Qwen3-8B + LoRA rank 64，每 500 步重校准 d_syc。

    '

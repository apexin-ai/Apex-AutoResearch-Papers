  analysis: 'R1-only ablation 提供了三个 diagnostic insight：(a) 方向投影 reward 单独不足以引导有效 训练——模型
    exploit activation space 的自由度而非学习 non-sycophantic behavior； (b) R3 behavioral
    anchor 是 DC-GRPO 中真正做功的组件；(c) R1 的高 reward 值不等于 低 sycophancy，reward-behavior 脱节是
    representation-level reward 的系统性风险。 对 reframed paper 来说，这是 "Why Internal Detection
    Doesn''t Transfer to Training"  叙事的关键 ablation evidence。

    '

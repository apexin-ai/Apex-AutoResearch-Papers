  analysis: 'DC-GRPO 训练完成但核心机制——R1 方向投影 reward——在训练过程中系统性退化。退化根源是 双重的：(1) 初始方向本身含显著风格残余（exp-001），(2)
    LoRA 更新导致表征空间漂移速度 超过重校准频率能跟上的范围。R1 在 ~step 2200 后与 R3 相关性降至 0.5 以下，意味着 训练后半程 R1
    更多是在注入噪声而非有用信号。模型最终行为主要由 R3 塑造，R1/R2  的贡献被噪声梯度稀释。这是对 CRAFT 路线的重要 empirical boundary

  result_rationale: 'MVP 的 0.826 AUROC 建立在 50 对全 weak evidence 数据上。Weak evidence 场景中，
    sycophantic capitulation 和 genuine revision 的行为差异最大（用户给出的"证据"明显无说服力， 任何 revision
    都几乎确定是 sycophancy），使模型内部 activation 差异更 salient， 但这同时意味着探针部分在检测"面对弱证据仍修改"这一分布特征而非纯粹的
    sycophantic cognition。 加入 medium/strong evidence pairs 后，genuine revision 和 sycophantic
    capitulation  在 activation space 中的距离缩小——因为面对 strong evidence 时 genuine revision
    的  internal state 与 sycophantic capitulation 共享更多"正在被说服"的表征特征。 AUROC 从 0.826 降至
    ~0.753 反映 d_syc 方向中约 30-40% 的信号实际上是 evidence-strength  相关的风格/情境特征而非纯 sycophantic
    cognition。CI 宽度 0.068 虽然比 MVP 的 0.108 窄 （样本量翻四倍），但仍较宽，下界 0.694 接近 random+luck
    区间。 按 evidence strength 分层显示清晰梯度：weak 0.811 → medium 0.724 → strong 0.698， 证实判别力高度依赖

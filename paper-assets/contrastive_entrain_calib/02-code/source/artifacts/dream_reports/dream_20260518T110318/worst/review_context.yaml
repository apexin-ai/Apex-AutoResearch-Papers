    weak-evidence-only 分布偏差贡献。这并不意味着方向完全无效——0.753 仍显著高于 随机（permutation test p < 0.001）——但
    CI 下界 0.694 意味着在 pessimistic 端 方向几乎不比 informed baseline 好。按 evidence strength
    分层的梯度 (0.811→0.724→0.698)  表明 d_syc 中编码了大量"面对弱证据的犹豫"信号而非纯粹的 sycophantic cognition。
    对 Claim 1 的影响：需诚实报告方向判别力的条件依赖性，不能不加限定地声称"activation space  编码了可分离的 sycophancy

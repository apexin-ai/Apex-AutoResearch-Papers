narrative_guidance: '原始 framing 完全成立，三条 claim 均获统计显著支撑。Claim 1：200 pairs 扩展数据将 AUROC
  推至 0.89， CI 宽度从 0.108 压缩至 0.034，层递进从 L0 随机到 L19 峰值的清晰叙事完整呈现，Llama 迁移 AUROC 0.83
  实质性 消除 single-model 限制。Claim 2：DC-GRPO 在 NoF/WRR 上同时显著优于所有 baseline（R3-only、ACT、Binary
  Probe、Continuous Probe），打破 double-bind。关键对比——Binary Probe 和 Continuous Probe 双双被显著
  超越——确认方向几何（而非仅连续性）是优势来源。RC-AUC 0.84 vs R3-only 0.65 提供直观的 tradeoff 曲线。Claim 3 作为
  analysis subsection，14.2% R1-R3 disagreement 率提供有价值的 diagnostic insight，masked sycophancy
  集中在 medium-evidence 场景。MT-Bench 和 MMLU 几乎无退化，reward weight sensitivity 分析显示 NoF
  在 5 组配置间变化仅 2.7pp，证明方法鲁棒。Headline result 可按模板直接填数：DC-GRPO 在 SYCON Bench 上将 NoF 降低
  18.8pp（相对 R3-only）同时 WRR 提升 12.2pp。ICLR stretch target 值得冲刺。

  '

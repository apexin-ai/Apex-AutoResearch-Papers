    的 rank-based contrastive 信号维持 sycophantic 与 genuine 方向的分离度，R3 的 NLI behavioral
    reward 作为安全网防止 representation-level 信号过拟合导致表面不一致。NoF 15.9% 大幅低于 vanilla 51.8%——方向投影

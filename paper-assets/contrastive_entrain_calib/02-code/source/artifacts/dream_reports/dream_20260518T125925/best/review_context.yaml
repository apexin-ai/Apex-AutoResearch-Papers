    gpu_hours_actual: 18
  result_rationale: 'Continuous Probe（NoF 23.8%）显著优于 Binary Probe（27.5%），证明连续信号确实比
    二元信号提供更好的梯度。但 DC-GRPO（15.9%）仍以 7.9pp 显著超越 Continuous Probe （p=0.014）——这是方向几何 vs
    纯连续性的决定性对比。为什么连续概率不如方向投影？ (1) Logistic regression 概率是一维标量（sycophancy probability），方向投影是高维
    激活空间中的有符号距离，保留了方向信息（正 = sycophantic direction, 负 = genuine direction）；(2) Probe
    概率是 post-hoc 从学到的权重计算的，方向投影直接利用了 contrastive pairs 定义的几何结构，更 aligned with 训练目标；(3)
    Probe calibration （ECE 0.043）虽合理但非完美——概率值的绝对尺度可能不准确，而方向投影的相对排序 更可靠。这个 7.9pp 差距直接证明了

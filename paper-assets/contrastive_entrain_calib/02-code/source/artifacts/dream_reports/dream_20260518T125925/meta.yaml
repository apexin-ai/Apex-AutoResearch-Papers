      evidence 线始终最高，weak 最低，差距在 mid-layers 最大（~0.06）。'
    - 'Fig 2: Bootstrap AUROC 分布直方图，200 pairs L19，均值 0.801，垂直虚线标注 0.80 gate。分布右偏但约
      35% 的 bootstrap 样本 < 0.80。'
    analysis: 'AUROC 0.801 恰好触及 gate 阈值，置信区间下界 0.766 明显低于 0.80，意味着在统计意义上我们无法拒绝 "AUROC
      ≤ 0.80" 的零假设。这直接影响后续实验：R1 权重需降低以减少噪声方向的负面影响。 层递进模式保持清晰（L0 随机 → L19 峰值），这是 worst
      tier 中最重要的正面发现，支撑 reframe 路径 A  的 mechanistic 贡献。evidence strength 交互效应（strong
      > medium > weak）也是有价值的 finding， 说明方向判别力与任务不确定性相关——但这恰恰也解释了为什么 d_syc 作为 reward
      信号不够可靠： 在最需要它的场景（weak evidence，模型最容易 sycophantic）判别力最差。

      '

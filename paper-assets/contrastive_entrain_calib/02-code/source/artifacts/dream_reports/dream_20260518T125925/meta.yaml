    # Dream Review Report: Direction-Contrastive GRPO for Multi-Turn Sycophancy Calibration


    **Paper:** Direction-Contrastive GRPO for Multi-Turn Sycophancy Calibration: Representation-Level
    Rewards Break the Revision Double-Bind


    **Review Mode:** Full (2 Reviewers + Roundtable)


    **Overall Score:** 3/6 (Weak Reject)


    ---


    ## Roundtable Process


    - **R1 (Method + Experiments):** Score 3 (Weak Reject)

    - **R2 (Novelty + Related Work):** Score 3 (Borderline Reject)

    - **Consensus:** 3/6 (Weak Reject)


    Both reviewers independently converged on the same core concern: the paper''s
    own Continuous Probe ablation undermines the central contribution claim. Agreement
    was strong on all major issues; minor divergence on methodology quality (R1 more
    positive) vs. novelty relative to CRAFT (R2 more critical).


    ---


    ## 1. Summary


    The paper extracts a linear direction d_syc from the policy model''s activation
    space to discriminate sycophantic capitulation from genuine belief revision, then
    incorporates it into GRPO training as a three-component reward (R1: directional
    projection, R2: rank-based contrastive, R3: NLI behavioral). DC-GRPO achieves
    RC-AUC 0.738 vs 0.641 for behavioral-only training (p=0.008). The paper also proposes
    RC-AUC as a composite metric and provides analyses of direction stability, turn-depth
    effects, R1-R3 disagreement, and cross-model transfer.


    The paper is scientifically honest: it acknowledges that the improvement stems
    primarily from continuous representation-level signals rather than directional
    geometry specifically, as a Continuous Probe baseline achieves statistically indistinguishable
    results (NoF 0.224 vs 0.218, p=0.381; RC-AUC 0.731 vs 0.738, p=0.318).


    ---


    ## 2. Strengths


    **S1. Well-motivated problem and honest framing.** The sycophancy-revision double-bind
    is a genuine and important problem. The paper does not overclaim: it transparently
    reports that directional projection does not significantly outperform simpler
    continuous probes, and adjusts its claims accordingly. This intellectual honesty
    is commendable and rare. (Both R1, R2)


    **S2. Comprehensive experimental design.** The paper covers 15 experiments including
    appropriate baselines (Vanilla, R3-only, ACT, Binary Probe, Continuous Probe),
    component ablations (R1-only, R1+R2), sensitivity analysis (5 weight configs),
    direction stability monitoring, R1-R3 disagreement analysis, three-way direction
    analysis, and cross-model transfer. All baselines use identical hyperparameters
    except the reward function. The inclusion of Continuous Probe as a baseline is
    particularly valuable and the decisive experiment. (R1)


    **S3. Turn-depth analysis.** DC-GRPO''s advantage over R3-only grows from 5.3pp
    at turn 2 to 9.4pp at turn 4+ on NoF. This is mechanistically plausible: NLI-based
    behavioral scoring becomes less reliable in longer dialogues while representation-level
    signals maintain discrimination. This is the paper''s strongest independent finding.
    (Both R1, R2)


    **S4. Ablation cascade is informative.** The progression R3-only -> R1-only ->
    R1+R2 -> DC-GRPO clearly demonstrates that each component contributes non-trivially,
    and that R3 is necessary not just as a safety net but as an active signal source
    (R1+R2 without R3 produces 8.7% surface inconsistency). (R1)


    **S5. RC-AUC metric addresses a real gap.** Existing metrics (NoF, WRR) capture
    only one side of the tradeoff. RC-AUC provides a single composite score. While
    the metric needs better formal specification, the concept is useful. (R1)


    ---


    ## 3. Weaknesses


    **W1 (Critical). Continuous Probe ablation undermines the core contribution.**

    DC-GRPO (NoF 0.218, RC-AUC 0.738) vs Continuous Probe (NoF 0.224, RC-AUC 0.731):
    differences of 0.6pp and 0.7pp, both statistically non-significant (p=0.381 and
    p=0.318). The paper''s titular and methodological centerpiece, directional projection,
    is not the source of improvement. The actual finding is that any continuous representation-level
    signal improves GRPO, which is less novel. The progression Binary Probe (+7.7pp
    RC-AUC over R3-only) -> Continuous Probe (+9.0pp) -> DC-GRPO (+9.7pp) shows the
    jump is from discrete to continuous, not from continuous to directional. (Both
    R1, R2)


    **W2 (Major). 3 seeds insufficient for statistical claims.**

    All significance tests use paired t-tests with n=3 (2 degrees of freedom). This
    is severely underpowered. The WRR comparison between DC-GRPO and R3-only already
    fails significance (p=0.148). The critical DC-GRPO vs Continuous Probe comparison
    cannot reliably distinguish true equivalence from inadequate power. Several p-values
    are reported to 3 decimal places, creating a false impression of precision. At
    minimum 5 seeds, preferably 10, are needed for the primary comparisons. (Both
    R1, R2)


    **W3 (Major). Title and framing mismatch the findings.**

    "Direction-Contrastive GRPO" implies directional geometry is central, but the
    data show it is not the differentiating factor. The Introduction builds toward
    directional projection as the key innovation, but the Discussion acknowledges
    it is interchangeable with simpler probes. A more accurate title would reference
    representation-level rewards generally. The paper reads as a partial negative
    result for directional projection dressed as a methods paper. (R2, R1 concurs)


    **W4 (Major). Insufficient reference coverage.**

    22 references is well below the 30-50 typical for top ML venues. Missing critical
    recent works: mechanistic sycophancy studies (linear separability in attention
    heads, sycophantic anchors, the hypocrisy gap), INTUITOR (internal signals as
    GRPO rewards), SAE-based training interventions, non-identifiability of steering
    vectors. The Related Work does not engage with the 2025-2026 wave of mechanistic
    sycophancy research that directly contextualizes the d_syc finding. (R2)


    **W5 (Major). No human validation anywhere in the pipeline.**

    Neither the calibration data labels (sycophantic vs genuine) nor the evaluation
    metrics (NoF, WRR) nor the masked sycophancy analysis (R1-R3 disagreement) are
    validated against human judgments. The 7.6% disagreement rate (4.5% "R1=syc, R3=correct")
    could be R1 false positives rather than true masked sycophancy. Without ground-truth
    annotation, the entire argument chain rests on automated classifiers whose accuracy
    is unverified. (R1, R2)


    **W6 (Moderate). RC-AUC under-specified.**

    The paper does not clearly define what thresholds are swept to generate the RC-AUC
    curve (threshold on total reward? on confidence? on sycophancy score?). Without
    a precise formal definition, the metric is not reproducible. The paper''s strongest
    results (RC-AUC 0.738 vs 0.641) are on this self-defined metric, which invites
    the "best results on own metric" criticism. (R1)


    **W7 (Moderate). Limited model diversity.**

    Only two 8B models, with unequal training budgets (6500 steps for Qwen3-8B vs
    3000 for Llama-3-8B). Cross-model direction cosine of 0.31 confirms directions
    are model-specific. No exploration of parameter scale effects (e.g., 1.5B or 70B).
    The cross-model experiment supports framework generality but with caveats that
    weaken the claim. (R1, R2)


    **W8 (Minor). R2 reward component inadequately formalized.**

    "Rank-based contrastive" is described verbally but no mathematical formulation
    is provided. This is a reproducibility concern for a methods paper. (R1)


    ---


    ## 4. Questions for Authors


    **Q1.** With only 3 seeds, what is the statistical power to detect the observed
    DC-GRPO vs Continuous Probe difference (0.6pp NoF) at alpha=0.05? Have you considered
    running 5-10 seeds for the primary comparisons?


    **Q2.** Given that Continuous Probe achieves statistically indistinguishable results,
    what is the practical justification for the additional complexity of directional
    projection (direction extraction, periodic recalibration, activation extraction)?
    In what deployment scenario would a practitioner prefer DC-GRPO over a simple
    logistic regression probe?


    **Q3.** What is the formal mathematical definition of R2 (rank-based contrastive
    reward)? The current description is insufficient for reproduction.


    **Q4.** At turn 4+, does DC-GRPO significantly outperform Continuous Probe specifically?
    The turn-depth analysis only compares to R3-only and ACT. If Continuous Probe
    also improves at deeper turns, the turn-depth advantage may not be unique to directional
    projection.


    **Q5.** The 4.5% "R1=sycophantic, R3=correct" cases are presented as evidence
    of masked sycophancy detection. What fraction of these are confirmed as truly
    sycophantic by human annotators? Would you commit to a 200+ case human evaluation
    with multiple annotators?


    **Q6.** How does the paper''s AUROC 0.843 compare to prior work achieving AUROC
    > 0.97 for sycophancy direction extraction in single-turn settings? Is the lower
    AUROC inherent to multi-turn complexity, or a limitation of the 200-pair calibration
    set?


    ---


    ## 5. Experiment Coverage Assessment


    Comparing against the 15 imagined experiments in review_context.yaml:


    | Experiment | Covered? | Notes |

    |---|---|---|

    | exp-001: Calibration data expansion | Yes | Table 1, Section 4.2 |

    | exp-002: DC-GRPO main | Yes | Tables 2-3, Section 4.3 |

    | exp-003: R3-only baseline | Yes | Table 2 |

    | exp-004: ACT-style baseline | Yes | Table 2 |

    | exp-005: Full evaluation | Yes | Table 2 (6 methods) |

    | exp-006: Direction stability | Yes | Table 7, Section 4.6 |

    | exp-007: R1-R3 disagreement | Yes | Tables 10-11, Section 5.2 |

    | exp-008: Binary probe baseline | Yes | Table 2 |

    | exp-009: R1-only ablation | Yes | Table 4 |

    | exp-010: Turn depth analysis | Yes | Table 6, Section 4.5 |

    | exp-011: R1+R2 no R3 | Yes | Table 4 |

    | exp-012: Cross-model transfer | Yes | Table 8, Section 4.7 |

    | exp-013: Three-way direction | Yes | Section 5.3 |

    | exp-014: Continuous probe | Yes | Tables 2-3, Section 5.1 |

    | exp-015: Reward weight sensitivity | Yes | Table 5 |


    **Coverage: 15/15 (100%).** All imagined experiments are reported. The paper is
    experimentally thorough.


    ---


    ## 6. Detailed Scores


    | Criterion | Score (1-6) | Justification |

    |---|---|---|

    | Novelty | 2.5 | Direction extraction follows established RepE methodology. Integration
    into GRPO rewards has precedent in CRAFT. The actual finding (continuous signals
    help) is incremental. |

    | Soundness | 3.5 | Method is technically correct; experimental design is comprehensive.
    But 3 seeds is underpowered, RC-AUC is under-specified, and no human validation.
    |

    | Significance | 3.0 | The sycophancy-revision tradeoff is important, but the
    core directional contribution is undermined by the Continuous Probe result. Turn-depth
    analysis is interesting but statistically fragile. |

    | Presentation | 3.5 | Well-organized, honest framing. But title/framing mismatch
    findings. Insufficient references. R2 formalization missing. |

    | **Overall** | **3.0** | **Weak Reject** |


    ---


    ## 7. Consensus Recommendation


    **Score: 3/6 (Weak Reject)**


    The paper addresses a well-motivated problem with a comprehensive experimental
    design and commendable scientific honesty. The turn-depth analysis and the finding
    that continuous representation-level signals improve GRPO are genuine contributions.


    However, the paper does not meet the bar for a top ML venue (~25% acceptance rate)
    due to three fundamental issues:


    1. **The directional projection, which is the paper''s central and titular contribution,
    does not significantly outperform a simple continuous probe (p=0.381 NoF, p=0.318
    RC-AUC).** The paper''s own data show the improvement comes from signal continuity,
    not directional geometry.


    2. **Statistical evidence rests on 3 seeds with 2 degrees of freedom**, which
    is insufficient to reliably support or refute any of the quantitative claims.


    3. **The novelty, once directional projection is set aside, reduces to "continuous
    representation-level signals improve GRPO for sycophancy,"** which is incremental
    over CRAFT (safety domain) and Linear Probe Penalties (sycophancy domain).


    **Path to acceptance:** (a) Run 5-10 seeds for primary comparisons to resolve
    statistical ambiguity; (b) Reframe the paper around the broader finding (representation-level
    continuous rewards) rather than directional projection specifically; (c) Strengthen
    the masked sycophancy analysis with human evaluation to make it a standalone contribution;
    (d) Expand references to 30+ and engage with recent mechanistic sycophancy literature;
    (e) Provide formal RC-AUC definition with external validation.


    The paper would be competitive at EACL, NAACL, or a workshop at a top venue in
    its current form. For ICLR/NeurIPS/ICML, the revisions above would be necessary.'

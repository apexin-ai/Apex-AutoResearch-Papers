  review_report: "---\ndream_id: dream_20260518T125925\ntier: best\noverall_score:\
    \ 4/6 Weak Accept\ntimestamp: 2026-05-18T13:47:45.837593+00:00\n---\n\n# Dream\
    \ Review Report — DC-GRPO for Breaking the Sycophancy-Revision Double-Bind\n\n\
    **Paper**: Direction-Contrastive GRPO for Breaking the Sycophancy-Revision Double-Bind\
    \ in Multi-Turn Dialogue\n**Review mode**: Full (2 Reviewers, 4-step roundtable)\n\
    **Date**: 2026-05-18\n\n---\n\n## Roundtable Process\n\n- **R1** (Methods + Experiments):\
    \ Preliminary 4/6 → Final 4/6\n- **R2** (Novelty + Related Work): Preliminary\
    \ 4/6 → Final 4/6\n- **Cross-sharing**: Both reviewers read each other's reviews\
    \ and responded. Strong convergence on key issues; minor disagreements on severity\
    \ ratings.\n\n---\n\n## Consolidated Score: 4/6 (Weak Accept)\n\n**Confidence**:\
    \ 4/5 (High)\n\nBoth reviewers independently arrived at 4/6 and maintained after\
    \ cross-reading. The paper addresses a real problem with above-average experimental\
    \ rigor, but novelty is application-level and statistical evidence for the key\
    \ claim is thin.\n\n---\n\n## Paper Summary\n\nThe paper proposes DC-GRPO, which\
    \ extracts a linear sycophancy direction (d_syc) from contrastive activation pairs\
    \ in the policy model's hidden states and uses its projection as a continuous\
    \ reward signal (R1) within GRPO, alongside rank-based contrastive (R2) and NLI\
    \ behavioral (R3) rewards. On SYCON Bench with Qwen3-8B, DC-GRPO reduces sycophantic\
    \ capitulation (NoF) by 18.8pp over R3-only GRPO while improving warranted revision\
    \ rate (WRR) by 12.2pp, with negligible MT-Bench/MMLU degradation. Ablation isolates\
    \ directional geometry as the primary driver (7.9pp over continuous probe, p=0.014).\
    \ Cross-model validation on Llama-3-8B (AUROC 0.832) and R1-R3 disagreement analysis\
    \ (14.2%, revealing 9.3% masked sycophancy) are also provided.\n\n---\n\n## Consensus\
    \ Strengths\n\n### S1. Well-defined problem with clear formalization (R1, R2)\n\
    The \"double-bind\" framing is precise and operationally meaningful: behavioral\
    \ signals cannot distinguish surface-identical capitulation from revision. This\
    \ is not a manufactured problem; prior work (TRUTH DECAY, SYCON Bench) documents\
    \ it, and the ACT baseline (WRR 36.8% < vanilla 37.4%) demonstrates it concretely.\n\
    \n### S2. Principled continuity-vs-directionality ablation (R1, R2)\nThe Binary\
    \ Probe → Continuous Probe → DC-GRPO comparison is the paper's strongest experimental\
    \ contribution. Continuity accounts for 3.7pp NoF improvement (p=0.038), while\
    \ directionality accounts for 7.9pp (p=0.014), a 2.1x ratio. This directly addresses\
    \ the most natural objection (\"isn't this just a continuous probe?\").\n\n###\
    \ S3. Turn-depth interaction is a genuine finding (R1, R2)\nDC-GRPO is the only\
    \ method whose NoF improves at deeper turns (22.1% at turn 2 → 8.7% at turn 4+).\
    \ All baselines degrade. The interaction effect (p=0.008) is statistically meaningful\
    \ and mechanistically interpretable: deeper commitment creates larger activation\
    \ divergence, making the directional signal more informative. This is not trivially\
    \ predicted and constitutes an independently interesting empirical contribution.\n\
    \n### S4. Careful iterative data design (R1)\nThe v2.1 style-controlled calibration\
    \ protocol (matched openings, citation patterns, confidence markers, length constraints)\
    \ addresses a critical confound found in v1 (where trivial text differences yielded\
    \ AUROC=1.0 from Layer 0). Layer 0 AUROC dropping to ~0.52 after style control\
    \ while mid-layer AUROC remained strong is convincing evidence against surface\
    \ confounds.\n\n### S5. Transparent methodological positioning (R1, R2)\nThe paper\
    \ correctly frames d_syc extraction as a RepE application rather than claiming\
    \ novelty in direction extraction itself. The novelty claim is appropriately scoped\
    \ to using directional projection as a continuous training-time GRPO reward.\n\
    \n### S6. Comprehensive baseline coverage (R2)\nSix methods (Vanilla, ACT, R3-only,\
    \ Binary Probe, Continuous Probe, DC-GRPO) form a logical hierarchy that systematically\
    \ isolates design decisions. Each baseline serves a clear purpose in the argument\
    \ structure.\n\n### S7. Direction stability is reassuring (R1)\nCosine similarity\
    \ with initial d_syc stays at 0.881 after 8000 steps, held-out AUROC remains >0.86,\
    \ and the recalibration mechanism (threshold 0.7) is never triggered. This addresses\
    \ a natural concern about moving-target problems during policy gradient training.\n\
    \n---\n\n## Consensus Weaknesses\n\n### W1. Statistical power critically low —\
    \ 3 seeds [Major] (R1, R2)\n**Both reviewers flagged independently.** All significance\
    \ claims rest on paired t-tests with n=3 (2 degrees of freedom). The t-distribution\
    \ is extremely heavy-tailed at 2 df; a single outlier seed can drive or eliminate\
    \ significance. The key DC-GRPO vs. Continuous Probe comparison (p=0.014, the\
    \ central novelty-supporting result) is particularly fragile. Standard deviations\
    \ are suspiciously tight (e.g., NoF 15.9 ± 1.6 from 3 seeds). \n\n**Recommendation**:\
    \ Run 5+ seeds minimum (ideally 10). Report effect sizes (Cohen's d). Consider\
    \ bootstrap resampling over evaluation instances as complementary evidence.\n\n\
    ### W2. CRAFT comparison insufficiently argued [Major] (R2, R1 agreed)\nCRAFT\
    \ applies hidden-state rewards to GRPO for safety alignment. DC-GRPO applies hidden-state\
    \ rewards to GRPO for sycophancy. Both methods: (a) extract activation-space representations,\
    \ (b) convert them into GRPO reward signals, (c) combine with behavioral rewards.\
    \ The distinction between \"prototype clustering\" and \"directional projection\"\
    \ is a design choice within the same framework, not a different framework. The\
    \ paper dismisses CRAFT in one sentence.\n\n**Recommendation**: Add a dedicated\
    \ paragraph comparing the CRAFT reward formulation with R1, explaining why directional\
    \ projection is preferable to prototype distance for the sycophancy-revision distinction\
    \ specifically. An empirical comparison would be ideal.\n\n### W3. Novelty is\
    \ application-level [Major] (R2, R1 agreed)\nThe paper combines three existing\
    \ ideas: (a) RepE-style contrastive direction extraction, (b) CRAFT-style hidden-state\
    \ GRPO rewards, (c) NLI behavioral rewards for sycophancy (\"Pressure, What Pressure?\"\
    ). Each component is from prior work. The combination is reasonable and results\
    \ are strong, but the intellectual advance is integration and domain application\
    \ rather than a new methodological principle. The 7.9pp directionality gap is\
    \ meaningful but not overwhelming, especially on 3 seeds.\n\n### W4. Missing inference-time\
    \ activation steering baseline [Moderate] (R2, R1 agreed)\nIf d_syc is already\
    \ extracted, subtracting it at inference time via Activation Addition is the zero-training-cost\
    \ alternative to DC-GRPO. Its absence is conspicuous. If direction subtraction\
    \ at inference achieves 70-80% of DC-GRPO's gains at zero training cost, the paper's\
    \ practical value proposition is significantly weakened.\n\n**Recommendation**:\
    \ Either include this baseline or provide a clear argument for why training-time\
    \ integration is necessary.\n\n### W5. Calibration data circularity risk [Moderate]\
    \ (R1, R2 agreed)\nThe 200 contrastive pairs are LLM-generated. If the same model\
    \ family generates calibration data and is then trained with DC-GRPO, d_syc may\
    \ capture artifacts of the generation process rather than genuine cognitive signals.\
    \ The cross-model cosine of 0.34 is relevant but does not fully address this concern.\n\
    \n**Recommendation**: Clarify which model generated the data. Ideally, show that\
    \ d_syc is robust to different generators.\n\n### W6. RC-AUC is a custom metric\
    \ without external validation [Moderate] (R1, R2)\n**Both reviewers flagged independently.**\
    \ The strongest composite result (0.84 vs. 0.65) uses a metric invented by the\
    \ authors. Without correlation to human judgment or adoption by other work, this\
    \ metric carries less weight. NoF and WRR individually are more interpretable\
    \ and should be the primary reporting metrics.\n\n### W7. Missing related work\
    \ citations [Moderate] (R2)\nSeveral important works are absent:\n- **DPO/RLHF-based\
    \ sycophancy interventions**: The most commercially deployed anti-sycophancy methods\
    \ are not discussed.\n- **\"Sycophancy Is Not One Thing\"**: Directly relevant\
    \ for separable activation signatures.\n- **Knowledge-Prediction Gap / Sycophantic\
    \ Anchors**: Support the premise that models \"know\" they are sycophantic. The\
    \ 9.3% masked sycophancy finding essentially replicates the Knowledge-Prediction\
    \ Gap phenomenon.\n- **Multi-turn alignment methods**: The multi-turn paragraph\
    \ cites no specific prior methods.\n\n### W8. R2 reward component underspecified\
    \ [Minor-to-Moderate] (R1; R2 partially disagreed)\nR2 is described only as \"\
    rank-based contrastive reward\" but is actually derivative of R1 (ranking by R1\
    \ projection values). R1 argues this means R2 is not an independent signal; R2\
    \ argues the ablation shows R2 adds training value regardless of architectural\
    \ dependency. Both agree the paper should make the R1-R2 dependency explicit and\
    \ provide the actual R2 formula.\n\n### W9. Single scale (8B) limits generalization\
    \ [Moderate] (R1)\nBoth evaluated models are 8B parameters. Sycophancy behavior\
    \ changes with model scale, so whether d_syc extraction and DC-GRPO training scale\
    \ to larger models is unknown. Cross-model analysis addresses architecture generality\
    \ but not scale generality.\n\n### W10. Masked sycophancy lacks ground truth [Minor-to-Moderate]\
    \ (R1)\nThe 9.3% masked sycophancy rate (R1-syc, R3-ok) is reported without independent\
    \ human verification. These could be R1 false positives rather than genuine masked\
    \ sycophancy.\n\n**Recommendation**: Human-annotate a sample of disagreement cases.\n\
    \n---\n\n## Questions for Authors (Consolidated)\n\n1. Why not compare against\
    \ inference-time activation steering (subtracting scaled d_syc at generation time)?\
    \ This is the zero-training-cost alternative.\n2. What is the formal relationship\
    \ between DC-GRPO's R1 and CRAFT's hidden-state reward? Where exactly do they\
    \ diverge?\n3. The masked sycophancy finding (9.3%) echoes Knowledge-Prediction\
    \ Gap literature (13-29% representation-behavioral disagreement). Why are these\
    \ works not cited?\n4. What is the R1-R3 reward correlation during training? If\
    \ the signals collapse to r>0.9 mid-training, the multi-component design loses\
    \ its justification.\n5. How were the 3 random seeds selected? Were any seeds\
    \ run and excluded?\n6. For the Continuous Probe baseline, what is the logistic\
    \ regression's AUROC on the calibration data? If it matches d_syc AUROC, the directionality\
    \ claim is weakened.\n7. Which model generated the 200 calibration pairs? Does\
    \ d_syc change when generated by a different model?\n8. What is Cohen's d for\
    \ the DC-GRPO vs. Continuous Probe comparison?\n9. The paper reports R1 = -sigma(h\
    \ . d_syc / (||h|| . ||d_syc||)). Is the actual implementation using tanh with\
    \ temperature scaling? Clarify any paper-code discrepancies.\n10. What would applying\
    \ d_syc as inference-time steering to the R3-only trained model achieve? Would\
    \ this close the gap with DC-GRPO?\n\n---\n\n## Minor Issues\n\n- Table 9 column\
    \ headers (RC, MTB, SI) should be defined in the caption.\n- MT-Bench and MMLU\
    \ in Table 5 do not show standard deviations consistently across methods.\n- The\
    \ Multi-turn alignment paragraph in Related Work cites no specific methods by\
    \ name.\n- Evidence-strength data distribution (80 weak, 60 medium, 60 strong)\
    \ is imbalanced; justification needed.\n- R2 formula should be provided explicitly\
    \ (currently only high-level description).\n- Direction recalibration: the paper\
    \ states both \"every 500 steps recomputed\" and \"conditional on cosine < 0.7.\"\
    \ Clarify which is actually used.\n- No compiled bibliography (references are\
    \ informal in-text mentions).\n\n---\n\n## Experiment Coverage Assessment\n\n\
    All 15 imagined experiments from the review context are covered in the paper:\n\
    - exp-001 (calibration data expansion): Tables 1-3 ✓\n- exp-002 (DC-GRPO main):\
    \ Tables 5, 7 ✓\n- exp-003 (R3-only baseline): Table 5 ✓\n- exp-004 (ACT baseline):\
    \ Table 5 ✓\n- exp-005 (full evaluation): Tables 5-6 ✓\n- exp-006 (direction stability):\
    \ Table 8 ✓\n- exp-007 (R1-R3 disagreement): Tables 13-14 ✓\n- exp-008 (binary\
    \ probe baseline): Tables 5, 10 ✓\n- exp-009 (R1-only ablation): Table 9 ✓\n-\
    \ exp-010 (turn-depth analysis): Table 12 ✓\n- exp-011 (R1+R2 no R3 ablation):\
    \ Table 9 ✓\n- exp-012 (cross-model transfer): Table 4 ✓\n- exp-013 (three-way\
    \ direction design): Section 4.4 text ✓\n- exp-014 (continuous probe baseline):\
    \ Tables 5, 10 ✓\n- exp-015 (reward weight sensitivity): Table 11 ✓\n\nCoverage\
    \ is comprehensive. The paper includes all planned experiments in a well-organized\
    \ 9-page format.\n\n---\n\n## Overall Assessment\n\nThe paper addresses an important\
    \ and well-defined problem (the sycophancy-revision double-bind) with a technically\
    \ sound method and above-average experimental design. The continuity-vs-directionality\
    \ ablation and the turn-depth interaction analysis are the strongest contributions.\
    \ Direction stability throughout training and comprehensive baseline coverage\
    \ add to the paper's credibility.\n\nHowever, three issues prevent a clear accept\
    \ recommendation:\n\n1. **Statistical fragility**: 3 seeds with 2 df paired t-tests\
    \ is below the bar for a top venue. The key directionality claim (p=0.014) needs\
    \ more seeds to be convincing.\n\n2. **Application-level novelty**: The method\
    \ combines RepE direction extraction, CRAFT-style hidden-state GRPO rewards, and\
    \ NLI behavioral rewards, all from prior work. The integration is competent but\
    \ the conceptual advance is incremental. The insufficient CRAFT comparison exacerbates\
    \ this concern.\n\n3. **Missing baselines and related work**: Inference-time activation\
    \ steering is the obvious zero-cost alternative and its absence is conspicuous.\
    \ Several important prior works (DPO-based sycophancy methods, Knowledge-Prediction\
    \ Gap, \"Sycophancy Is Not One Thing\") are not cited.\n\nThe paper sits at the\
    \ weak-accept/borderline boundary. It would move to a solid accept with: (a) 5+\
    \ seeds with bootstrap significance tests, (b) CRAFT comparison paragraph with\
    \ formal analysis, (c) inference-time steering baseline or clear justification\
    \ for its absence, (d) missing citations addressed, and (e) human annotation of\
    \ a sample of masked sycophancy cases.\n"

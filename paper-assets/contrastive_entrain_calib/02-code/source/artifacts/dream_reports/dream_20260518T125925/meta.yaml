    result_rationale: '200 pairs（4× MVP 数据量）显著降低 AUROC 方差——根据 1/sqrt(n) 缩放律，CI 宽度从
      0.108 压缩约 3× 至 0.034。引入 medium/strong evidence 增加了数据多样性，迫使 d_syc 捕获更本质的认知信号而非仅
      weak-evidence 场景的表面模式。AUROC 均值从 0.826 升至 0.891：MVP 的 50 pairs 全为 weak evidence，方向受限于单一
      difficulty；扩展后方向在更宽的 evidence 空间中优化，判别力提升。Strong evidence 的 AUROC 0.921 最高，
      因为强证据下 sycophantic capitulation 与 genuine revision 的内部表征差异最大——模型拥有充分信息判断 用户是否正确，sycophantic
      违背自身信念的程度更深，激活空间分离度更高。Weak evidence 的 0.863 最低但仍 远超随机，证明即使在高模糊性场景下 d_syc 也捕获了有意义的信号。层递进从
      L0-4 随机（0.52）到 L19 峰值（0.891） 的单调递增模式与 RepE 文献一致：浅层编码词法/句法特征，中层（L16-19）开始编码高级语义概念如
      factual assessment，深层（L24-27）略微下降因为接近输出层、信号与 generation logits 混合。


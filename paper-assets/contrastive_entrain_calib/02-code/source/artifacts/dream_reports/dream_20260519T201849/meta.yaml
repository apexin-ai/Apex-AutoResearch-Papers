    # Dream Review Report: "Discriminability Is Not Reward Utility: Binarized Direction
    Probing for Multi-Turn Anti-Sycophancy Training"


    **Review Mode:** Full (2 Reviewers, complete roundtable)

    **Date:** 2026-05-19

    **Reviewers:** R1 (Methodology & Experiments), R2 (Novelty & Related Work)


    ---


    ## Consolidated Assessment


    **Overall Score: 3.0 / 6 (Weak Reject — Findings-level)**


    Both reviewers independently scored the paper 3/6 with high confidence (4/5).
    The paper presents a genuine and useful insight — that activation-space discriminability
    does not guarantee reward utility for GRPO training — supported by a well-executed
    four-experiment failure chain. However, the proposed solution (logistic regression
    probe with binary output) is technically thin, the experimental validation has
    critical statistical and methodological gaps, and engagement with the two closest
    prior works (CRAFT, Latent-GRPO) is insufficient for a top ML venue main conference
    track.


    **Verdict:** In current form, this is a solid Findings paper but falls short of
    main conference acceptance (~25% acceptance rate). With targeted revisions addressing
    the top 5 issues below, it could reach borderline conference (3.5–4.0).


    ---


    ## Areas of Consensus (Both Reviewers Agree)


    ### The Failure Chain Is the Strongest Contribution

    The four-experiment cosine R1 failure chain (Table 2) — culminating in the per-evidence-strength
    analysis showing strong-evidence samples receive R1=−0.305 while invalid-evidence
    samples receive R1=+0.153 — provides a compelling, mechanistic demonstration that
    discriminability ≠ reward utility. This negative result has independent scientific
    value and is well-executed. The insight that both sycophantic capitulation and
    genuine revision project similarly onto d_syc (because both involve belief change
    toward the user''s position, differing only in warrant) is clean and likely generalizable.


    ### Statistical Power Is Critically Limited (3 Seeds, 2 df)

    Both reviewers flagged n=3 as a fundamental limitation. The reported Cohen''s
    d values (9.95, 6.95) are implausibly large for behavioral ML experiments — with
    only 2 degrees of freedom, the variance estimate is unreliable and the t-distribution
    is heavy-tailed. The paper''s own acknowledgment ("limited statistical power")
    understates the problem: 3 seeds cannot reliably estimate variance. The suspiciously
    small standard deviations (SYCONScore 0.440 ± 0.020) raise additional questions
    about whether seeds share too much structure (same training data, same calibration
    set, same frozen probe) to constitute independent replicates.


    **Recommendation:** 5+ seeds minimum, ideally with varied calibration splits.


    ### The "Nonlinear Decision Boundary" Claim Is Factually Incorrect

    Both reviewers noted that logistic regression is a linear classifier. Section
    3.3 claims the probe "learns a nonlinear decision boundary that separates warranted
    revision from unwarranted capitulation — information that a single linear projection
    cannot capture." This is misleading: the probe learns a linear boundary in the
    multi-layer d_syc feature space, applied through a sigmoid for probability estimation.
    What the probe captures that a single cosine projection does not is a *weighted
    combination across layers* followed by thresholding — this is better described
    as "multi-layer aggregation + discretization" rather than "nonlinearity."


    **Recommendation:** Correct the mechanistic description. The operative mechanisms
    are (1) multi-layer feature aggregation and (2) binarization, not nonlinearity.


    ### The Missing Continuous Probe Ablation (exp-014) Is Critical

    Both reviewers identified exp-014 (continuous probe probability as reward) as
    the most important missing experiment. This ablation would distinguish "binarization
    is necessary" from "any probe works" — a distinction central to the paper''s conceptual
    contribution. The experiment was killed at step 3243 due to mode collapse, but:

    - Pre-collapse checkpoints (e.g., step 2000) could provide partial evidence

    - A re-run with regularization, gradient clipping, or entropy bonus could succeed

    - Without this result, the paper cannot cleanly attribute the improvement to binarization
    vs. other design choices (stop-gradient, frozen probe, multi-layer features)


    **Recommendation:** Recover exp-014 results from early checkpoints, or re-run
    with stabilization. This is a must-have for the "binarization bridges the gap"
    narrative.


    ### CRAFT and Latent-GRPO Engagement Is Insufficient

    CRAFT (hidden-state signals for safety-oriented GRPO) and Latent-GRPO (spherical
    projection with robust centroids for reasoning) are the two most directly comparable
    works. Both receive only a single sentence in Related Work. Critical unaddressed
    questions:

    - Would CRAFT''s prototype-clustering reward formulation, applied to sycophancy,
    also succeed or fail?

    - Why does continuous representation geometry work for reasoning (Latent-GRPO)
    but not for sycophancy (this paper)? This asymmetry is central to the contribution
    and deserves explicit analysis.

    - What formal differences between CRAFT''s approach and DC-GRPO''s binarized-probe
    approach predict when each would succeed?


    **Recommendation:** Dedicated paragraphs for both CRAFT and Latent-GRPO in Related
    Work, with formal comparison of design choices. An empirical CRAFT comparison
    would be ideal but a rigorous qualitative analysis is minimally necessary.


    ---


    ## R1-Specific Concerns (Methodology & Experiments)


    ### W-R1-1: Undisclosed 80% Training Truncation

    The experimental design documents reveal that max_completion_length=256 causes
    80–84% truncation across all GRPO experiments. This is never mentioned in the
    paper. Implications:

    - R3 (NLI) evaluates truncated outputs — short responses may be systematically
    easier/harder to classify

    - The model may learn truncation-aware behavior rather than genuine anti-sycophancy

    - All metrics are computed on potentially truncated outputs


    **Recommendation:** Disclose truncation rate, analyze its impact on metrics, or
    increase max_completion_length.


    ### W-R1-2: Custom Benchmark Without Human Validation

    SYCONScore, ToF, NoF, WRR, UCR, and RC-AUC are all project-defined metrics. The
    primary evaluation relies entirely on DeBERTa NLI correctly classifying sycophantic
    capitulation vs. genuine revision. No human evaluation is conducted. The 5.2%
    masked sycophancy claim (Contribution 3) is particularly vulnerable: it relies
    on the probe being correct when it disagrees with NLI, but the probe has ~18%
    error rate (AUROC 0.82).


    **Recommendation:** Small-scale human annotation (50–100 samples) of NLI classifications.
    Verify at least a subset of the 8 qualitative masked sycophancy examples with
    human raters.


    ### W-R1-3: Probe-Direction Circular Dependency

    The logistic regression probe trains on d_syc features extracted from calibration
    data, and d_syc itself is computed from the same calibration data. 5-fold CV partially
    addresses overfitting but not the shared data source. Additionally, the probe
    is frozen during training while model activations shift — the probe''s effective
    accuracy on in-distribution training samples after step 0 is unknown.


    ### W-R1-4: Baseline Fairness (ACT: SFT vs. GRPO)

    ACT uses an SFT-style L2 penalty training objective while DC-GRPO and R3-only
    use GRPO. Any advantage could stem from the training algorithm rather than the
    reward signal.


    ### W-R1-5: UCR Doubling Inadequately Discussed

    DC-GRPO has UCR 0.170 vs. Vanilla 0.077 — more than double the unwarranted capitulation
    rate. This is mentioned only in terms of overall NoF decrease. The paper should
    analyze whether the probe''s binary reward creates a coarse reward landscape that
    sometimes rewards capitulation, and whether this is acceptable in deployment.


    ### W-R1-6: Single-Layer Threshold Baseline Missing

    Would a simple threshold on the L19 cosine projection (R1 = 1 if cos(h, d_syc)
    > τ, else 0) achieve similar results? This isolates whether "binarization" or
    "learned multi-layer weighting" is the operative mechanism. Since single-layer
    AUROC is 0.817 vs. multi-layer 0.835 (+0.018), the improvement from multi-layer
    aggregation appears small.


    ---


    ## R2-Specific Concerns (Novelty & Related Work)


    ### W-R2-1: Technical Contribution Is Thin

    The core proposal — train a logistic regression probe on d_syc features and threshold
    its output — is standard ML. The novelty is primarily empirical/diagnostic (characterizing
    when directions fail as rewards) rather than methodological. The failure chain
    is the real contribution; the solution is "the right preprocessing" rather than
    a novel method.


    ### W-R2-2: Generalizability Claim Unsupported

    The Discussion states the discriminability-reward gap "may generalize beyond sycophancy
    to other behavioral attributes." This is speculative with zero supporting evidence.
    The mechanistic explanation (both desired and undesired behaviors project similarly)
    is specific to sycophancy-revision; for other attributes (toxicity, hallucination),
    the geometric structure may differ entirely.


    **Recommendation:** Either remove the generalizability claim or provide at least
    a brief analysis of when the gap would vs. would not appear for other attributes.


    ### W-R2-3: Missing DPO/Preference Optimization Literature

    Contrastive DPO with sycophantic/non-sycophantic pairs, agreement penalties (Shapira
    et al.), and SMART (reasoning-trajectory sycophancy reduction) are primary competing
    paradigms for training-time sycophancy reduction, receiving minimal discussion.


    ### W-R2-4: "Pressure, What Pressure?" Baseline Underspecified

    Is R3 identical to that work''s NLI reward, or a reimplementation? If identical,
    cite their numbers for comparison. If different, specify how.


    ---


    ## Strengths Summary


    1. **S1 (Both):** The four-experiment failure chain providing a mechanistic explanation
    for why cosine projections fail as rewards — the most original and well-executed
    section of the paper.


    2. **S2 (Both):** Thorough experimental coverage — 9 tables covering main results,
    failure chain, direction stability, ablations, weight sensitivity, turn-depth,
    R1-R3 disagreement, cross-model transfer, and capability preservation. No cherry-picking.


    3. **S3 (Both):** The anti-truth-decay property (DC-GRPO is the only method whose
    NoF improves with conversational depth, p=0.006) is a distinctive finding with
    a plausible mechanistic explanation.


    4. **S4 (R1):** Cross-model validation on Llama-3-8B (AUROC 0.81) provides evidence
    d_syc is not architecture-specific.


    5. **S5 (Both):** Honest limitations discussion. The paper acknowledges the NoF-ToF
    tradeoff, probe imperfection, and limited seeds without trying to minimize them.


    6. **S6 (R2):** The "discriminability ≠ reward utility" insight is genuine, underexplored
    in the RepE-for-training literature, and likely has value beyond this specific
    application.


    ---


    ## Top 5 Actionable Recommendations (Priority Order)


    1. **Recover or re-run exp-014 (continuous probe probability as reward).** This
    is the single most important missing experiment for supporting the binarization
    narrative. Without it, the paper cannot distinguish "binarization is necessary"
    from "any probe-based reward works."


    2. **Increase to 5+ seeds.** With n=3 and Cohen''s d ≈ 10, either the effect is
    so large that more seeds will trivially confirm it, or the variance estimate is
    unreliable. Either way, 5+ seeds resolves the concern.


    3. **Engage seriously with CRAFT and Latent-GRPO.** Dedicated Related Work paragraphs
    with formal comparison of design choices. Ideally, explain the asymmetry: why
    continuous representation geometry works for Latent-GRPO (reasoning) but fails
    here (sycophancy).


    4. **Add human evaluation.** Even 50–100 annotated samples for NLI classification
    validity and masked sycophancy verification. This addresses the custom-benchmark-without-validation
    concern.


    5. **Disclose and analyze the 80% truncation rate.** This is a significant undisclosed
    experimental detail that could affect all reported metrics.


    ---


    ## Questions for Authors (Consolidated)


    - **Q1:** Would a simple threshold on L19 cosine projection achieve similar results
    to the multi-layer probe?

    - **Q2:** What happens with continuous probe probability as R1? Can exp-014 early
    checkpoints (pre-collapse) be reported?

    - **Q3:** How is the probe''s accuracy verified on actual training samples during
    training (not just the initial held-out set)?

    - **Q4:** Evidence strength labels (strong/medium/weak/invalid): assigned by prompt
    design or post-hoc?

    - **Q5:** Raw per-seed SYCONScores to verify Cohen''s d calculation?

    - **Q6:** How do you control for the SFT (ACT) vs. GRPO (DC-GRPO) training algorithm
    difference?

    - **Q7:** Of the 5.2% masked sycophancy cases, what fraction are verified by human
    raters?

    - **Q8:** Why does continuous geometry work for Latent-GRPO (reasoning) but fail
    here (sycophancy)?

    - **Q9:** DC-GRPO''s Turn-2 NoF (0.800) is the lowest of all methods. Is the "improving
    with depth" an artifact of starting lower?

    - **Q10:** Cross-model d_syc cosine is 0.31 — how does this reconcile with d_syc
    capturing a "fundamental" signal?


    ---


    ## Score Breakdown


    | Dimension | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Soundness | 3/6 | — | 3/6 |

    | Novelty | — | 3/6 | 3/6 |

    | Overall | 3/6 | 3/6 | **3.0/6** |

    | Confidence | 4/5 | 4/5 | 4/5 |


    **Consensus Rationale:** The paper''s strongest contribution (the failure chain
    and discriminability-reward gap insight) is genuinely valuable but constitutes
    a negative result / diagnostic contribution. The positive contribution (DC-GRPO)
    rests on a technically thin solution (logistic regression + thresholding) with
    notable experimental gaps (3 seeds, no human eval, missing continuous probe ablation,
    undisclosed truncation). The insufficient engagement with CRAFT and Latent-GRPO
    prevents the reader from assessing the contribution''s novelty relative to the
    closest prior work. Both reviewers agree this is a solid Findings paper; with
    the top-5 revisions above, it has a plausible path to borderline conference acceptance
    (3.5–4.0).'

    # Dream Review Report — Full Roundtable


    **Paper**: "When and Why Representation-Level Discriminability Fails as RL Reward:
    A Systematic Negative Result on Direction-Conditioned GRPO for Multi-Turn Sycophancy"


    **Review Mode**: Full (2 Reviewers, 4-step roundtable)

    - R1 Focus: Methods & Experiments

    - R2 Focus: Novelty & Related Work


    ---


    ## Roundtable Summary


    ### Step 1–2: Independent Reviews & Cross-Sharing


    **R1 (Methods & Experiments)** — Initial Score: 3.5/6

    **R2 (Novelty & Related Work)** — Initial Score: 2.5/6


    ### Step 3: Convergence


    **Agreements:**

    1. The four-experiment cosine R1 failure chain is the paper''s strongest contribution.
    The 5× scaled experiment (Table 2: strong evidence R1=−0.305, 100% negative) is
    a clean, decisive demonstration of the direction-warrant conflation.

    2. Cross-model replication on Llama-3-8B (Δ(probe−R3) = −0.12 vs −0.11 on Qwen)
    meaningfully strengthens the structural claim.

    3. The reference list (14 entries) is inadequate for a paper claiming to provide
    systematic guidance for the RepE→RL pipeline.

    4. The geometric insight (d_syc captures direction-of-change, not warrant-of-change)
    is the most novel conceptual contribution but is underexplored and not formalized.

    5. The reward weight sensitivity analysis (Table 12) is compelling: monotonic
    negative correlation between R1 weight and SYCONScore, with optimum at w1=0.


    **Disagreements resolved:**

    - R1 initially claimed the continuous probe was "missing" from the paper. Correction:
    Table 10 and Section 4.8.3 explicitly present continuous probe results (ToF 0.978,
    NoF 0.006, SYCONScore 0.011). R1 acknowledged the error upon cross-check. This
    removes one claimed weakness from R1''s review.

    - R1 was more generous on overall assessment (3.5) based partly on strengths that
    appear to reference a different version of the paper. After calibration, R1 adjusted
    toward 3.0.

    - R2''s concern about novelty being "just instantiation of known reward misspecification"
    was partially countered by R1''s observation that the specific geometric mechanism
    (direction vs. warrant) IS novel. Both agreed the novelty is real but underdeveloped.


    **Converged Score: 3/6 (Borderline Reject)**


    ---


    ## Consolidated Review


    ### Summary


    This paper systematically tests the "RepE→RL hypothesis"—whether representation-level
    discriminability (AUROC 0.82 in classifying sycophancy via a direction d_syc)
    translates into reward utility for GRPO training against multi-turn sycophancy.
    Six reward formulations are tested (4 continuous cosine variants + binary probe
    + continuous probe), all fail. Three structural causes are identified: (1) d_syc
    encodes direction of belief change, not warrant; (2) online RL induces distribution
    shift degrading probe accuracy; (3) NLI-based behavioral reward is already sufficient
    (2.1% R1-R3 disagreement). Cross-model replication on Llama-3-8B confirms findings
    are structural.


    ### Strengths


    **S1. Systematic and thorough experimental coverage.** Fifteen experiments across
    six R1 formulations, two model families, direction stability monitoring, R1-R3
    disagreement analysis, turn-depth analysis, ActAdd inference-time test, reward
    weight sensitivity, and random direction ablation. Few negative result papers
    achieve this level of systematic investigation.


    **S2. The cosine failure chain is methodologically compelling.** The progression
    from gate collapse → zero signal → mode collapse → structural sign inversion constitutes
    a clean mechanistic narrative. Table 2 (5× scaled cosine, strong evidence R1=−0.305,
    100% negative) is the decisive piece of evidence and is well-analyzed.


    **S3. The direction-warrant conflation insight is genuine and novel.** The observation
    that both sycophantic capitulation and genuine revision involve moving toward
    the user''s position in activation space—thus sharing geometric direction while
    differing in warrant—is a clean conceptual contribution. This explains not just
    this paper''s failures but predicts when single-direction rewards will fail in
    general (whenever desired and undesired behaviors share geometric direction).


    **S4. Cross-model replication strengthens the structural claim.** Near-identical
    Δ on Llama-3-8B (−0.12) vs Qwen3-8B (−0.11), despite low cross-model direction
    cosine (0.12), provides strong evidence that the failure is geometric-structural,
    not model-specific. "The direction is model-specific, but the failure mode is
    universal" is a well-supported conclusion.


    **S5. Reward weight sensitivity is clean and damning.** Table 12 shows monotonic
    negative correlation between R1 weight and SYCONScore, with the optimum at w1=0
    (R3-only at 0.33). This pre-empts the "you just didn''t tune the weights" counterargument
    and establishes representation reward as actively harmful at any positive weight.


    **S6. Honest negative result framing.** The paper does not bury or spin findings.
    The title is explicit, the abstract leads with uniform failure, and each formulation''s
    failure mode is documented with specific metrics.


    ### Weaknesses


    **W1. [Major] Critically insufficient engagement with CRAFT and Latent-GRPO.**
    Both receive exactly one sentence in Related Work, yet they represent the two
    closest prior works that *successfully* use representation geometry as GRPO rewards
    (for safety and reasoning, respectively). The most theoretically interesting question
    the paper opens—*why does representation-geometry reward succeed for reasoning/safety
    but fail for sycophancy?*—is completely unaddressed. Without explicit analysis
    of what structural properties of sycophancy (vs reasoning correctness or safety)
    cause the failure, the reader cannot assess whether the finding generalizes or
    is domain-specific. A dedicated comparison paragraph is minimally necessary; ideally
    the paper would explain a priori when single-direction rewards should fail vs.
    succeed.


    **W2. [Major] Reference list is severely underdeveloped (14 entries).** For a
    paper claiming systematic negative guidance for the RepE→RL pipeline, this is
    far too thin. Critical omissions include:

    - Rimsky et al. (ACL 2024) — most directly comparable work on sycophancy direction
    steering

    - Gao et al. (ICML 2023) — reward overoptimization scaling laws, foundational
    for the discriminability-reward gap framing

    - Skalse et al. (NeurIPS 2022) — theoretical characterization of reward hacking

    - Li et al. (NeurIPS 2023) — Inference-Time Intervention, probe-as-direction methodology

    - Shao et al. (2024) — introduced GRPO; currently only implicitly cited

    - Casper et al. (2023) — open problems in RLHF

    - DPO-based sycophancy reduction literature receives zero discussion despite being
    a major competing paradigm


    **W3. [Major] The actionable contribution is thin.** The four guidelines in Section
    5.2 are restatements of the findings: "do not assume reward utility from discriminability"
    is the finding itself restated as advice; "behavioral sufficiency check first"
    is standard practice; "distribution shift is the binding constraint" is known
    from the reward overoptimization literature. A negative result paper at a top
    venue needs either (a) deeper theoretical analysis producing non-obvious predictions,
    or (b) a concrete proposed fix, or (c) demonstrated generality across multiple
    domains. This paper provides none of these.


    **W4. [Moderate] The "six formulations" framing inflates apparent thoroughness.**
    The four cosine variants (gate, raw, recalibrated, scaled) are minor modifications
    of the same failed approach. The two probe variants (binary and continuous) are
    the only structurally distinct alternatives. A more honest framing would be "two
    families of approaches (continuous projection and probe classification), with
    four cosine variants explored for completeness."


    **W5. [Moderate] Statistical rigor concerns.** The paper does not explicitly report
    the number of random seeds. From the results, it appears most experiments use
    a small number of seeds. Confidence intervals are reported for the calibration
    experiment (Table 1) but not for the main training experiments (Tables 3–5, 12).
    Given the stochasticity of RL training, reporting mean ± std across seeds is important
    for the key comparisons.


    **W6. [Moderate] The "R3 is sufficient statistic" claim (2.1% disagreement) may
    be benchmark-specific.** The paper observes 2.1% R1-R3 disagreement vs. 13–29%
    in single-turn literature but does not adequately explain this 10× reduction.
    Is it because multi-turn sycophancy is more observationally salient? Because the
    NLI model is overconfident? Because the benchmark is designed to surface observable
    capitulation? Without deeper analysis, generalizing this to "behavioral reward
    is always sufficient for multi-turn sycophancy" is premature.


    **W7. [Moderate] Generalizability is speculative.** The paper''s most impactful
    potential claim—that the discriminability-reward gap generalizes beyond sycophancy—receives
    a single speculative sentence. Without any analysis of when the gap would vs.
    would not apply to other behavioral attributes (toxicity, hallucination, deception),
    the contribution remains domain-specific.


    **W8. [Minor] The "pre-registered" claim (footnote 1) is unverifiable.** No appendix
    with the protocol is provided, and no external pre-registration (e.g., OSF) is
    referenced.


    **W9. [Minor] SYCONScore lacks external validation.** The harmonic mean of ToF
    and NoF is reasonable but no correlation with human judgments is provided. RC-AUC
    is used but not formally defined in the main text.


    **W10. [Minor] Cross-model experiment uses shorter training.** The paper''s cross-model
    Llama-3-8B comparison uses fewer training steps than Qwen3-8B. While the replicated
    Δ is convincing, matched training duration would strengthen the comparison.


    ### Questions for Authors


    1. **Why does representation geometry succeed for Latent-GRPO (reasoning) and
    CRAFT (safety) but fail for sycophancy?** What structural property makes sycophancy
    geometrically confounded? Is it specifically that "warranted revision" and "sycophantic
    capitulation" share geometric direction, while "correct reasoning" and "incorrect
    reasoning" do not?


    2. **Would a multi-dimensional representation (subspace projection rather than
    single direction) resolve the direction-warrant conflation?** The root cause identifies
    single-direction limitation, but no multi-dimensional alternatives are tested.


    3. **What explains the 10× reduction in R1-R3 disagreement** (2.1% vs. 13–29%
    in single-turn literature)? Is this a property of multi-turn evaluation, the NLI
    model, or the benchmark design?


    4. **How does the probe''s degradation curve compare to reward overoptimization
    scaling laws** (Gao et al. 2023)? Is the AUROC decline from 0.82 to 0.68 faster
    or slower than predicted?


    5. **How many random seeds were used for each experiment?** Can you provide per-seed
    results or confidence intervals for the main comparisons (binary probe R1 vs R3-only
    vs ACT)?


    6. **Page count**: The main text appears to extend to ~9 pages. Does this comply
    with the 8-page limit for the target venue?


    ### Missing Experiments / Analysis


    1. **CRAFT comparison as baseline.** Cited in Related Work but not evaluated.
    Given CRAFT''s direct relevance (hidden-state GRPO), this is a notable gap.

    2. **Multi-dimensional representation test.** If single direction fails because
    it conflates direction with warrant, does projecting onto a 2D+ subspace help?

    3. **Human evaluation on a subset** to validate SYCONScore''s correspondence with
    human sycophancy judgments.

    4. **Deeper analysis of the CRAFT/Latent-GRPO asymmetry** — even conceptual analysis
    without new experiments would strengthen the paper.


    ### Experiment Coverage vs. Design


    Comparing the paper to the full experiment design:

    - **Well-covered**: exp-001 (calibration), exp-002/v2/v2-recalib/v3 (cosine chain),
    exp-003 (R3-only), exp-004 (ACT), exp-005 (full eval), exp-006 (direction stability),
    exp-007 (R1-R3 disagreement), exp-008v3 (binary probe), exp-009 (R1-only), exp-010
    (turn depth), exp-012 (cross-model), exp-014 (continuous probe), exp-016 (ActAdd),
    random direction probe, reward weight sensitivity

    - **Briefly covered**: exp-011 (R1+R2 no R3), exp-013 (neutral baseline three-way)

    - **All planned experiments appear in the paper** — experimental coverage is comprehensive


    ### Scoring


    | Dimension | Score | Notes |

    |-----------|-------|-------|

    | Soundness | 3.5/6 | Systematic investigation, but limited seeds, some metrics
    unvalidated |

    | Novelty | 2.5/6 | Direction-warrant insight is novel but underexplored; "it
    doesn''t work" is thin contribution |

    | Significance | 3/6 | Useful negative result but limited actionable guidance;
    domain-specific without generalization |

    | Clarity | 4/6 | Well-structured narrative; tables comprehensive; some framing
    issues |

    | Related Work | 2/6 | 14 references is inadequate; critical omissions (Rimsky,
    Gao, GRPO source); CRAFT/Latent-GRPO comparison absent |

    | Reproducibility | 3/6 | Method described but seed counts, some hyperparameters,
    training details underspecified |


    ### Overall Score: 3/6 (Borderline Reject)


    **Justification**: The paper presents a genuine and systematically documented
    negative finding—representation-level discriminability does not translate to reward
    utility for multi-turn sycophancy GRPO training. The geometric explanation (direction-of-change
    vs. warrant-of-change) is novel and the experimental coverage is impressively
    thorough (15 experiments, 2 model families, 6 reward formulations).


    However, for a top ML venue (~25% acceptance), the paper falls short on three
    critical fronts:

    1. **Novelty depth**: The conceptual contribution is real but thin—"it doesn''t
    work, here''s the geometric reason" without formalization, generalization tests,
    or proposed solutions.

    2. **Positioning**: Severely inadequate engagement with the two closest successful
    prior works (CRAFT, Latent-GRPO) leaves the most important theoretical question
    unanswered.

    3. **References**: 14 entries is well below venue standards; critical omissions

    # Dream Review Report


    **Paper:** "An Empirical Investigation of Representation-to-Reward Transfer in
    Anti-Sycophancy Training"

    **Review mode:** full (2 Reviewers, complete roundtable)

    **Date:** 2026-05-19


    ---


    ## Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 3/6 (Weak Reject) | 4/5 |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 4/5 |

    | **Consensus** | | **3/6 (Weak Reject)** | **4/5** |


    ---


    ## Paper Summary


    The paper investigates whether a linear "sycophancy direction" (d_syc) extracted
    from LLM mid-layer activations can serve as a GRPO reward signal for anti-sycophancy
    training. The core finding is the "discriminability–reward gap": d_syc achieves
    AUROC 0.826 for classification but continuous cosine projections onto it fail
    as GRPO rewards through four increasingly targeted experiments. The structural
    root cause is that sycophantic capitulation and genuine revision share geometric
    direction, differing only in warrant. The proposed fix—binarization via a logistic
    regression probe (R1) combined with an NLI behavioral reward (R3)—achieves SYCONScore
    0.367, significantly outperforming ACT (0.301, p=0.04) but NOT significantly outperforming
    R3-only (0.317, p=0.12).


    ---


    ## Agreed Strengths


    **S1. Thorough negative result documentation (R1, R2).** The four-experiment failure
    chain (tanh gate → raw cosine → online recalibration → scaled 5×) is methodologically
    rigorous. The per-evidence-strength analysis in Experiment 4 (strong evidence
    samples receiving R1=−0.305) is the paper''s standout empirical contribution—it
    mechanistically explains *why* cosine projection fails, not just that it fails.
    Both reviewers identified this as the strongest element of the paper.


    **S2. Honest framing and reporting (R1, R2).** The paper clearly reports that
    probe R1+R3 vs R3-only is not statistically significant (p=0.12). The framing
    as "empirical investigation" rather than "method paper" is appropriate given the
    evidence. This builds credibility and is commendable relative to common practices.


    **S3. Comprehensive experimental coverage (R1, R2).** Direction stability monitoring,
    cross-model validation (Llama-3-8B), reward weight sensitivity (5 configurations),
    turn-depth stratification, R1-only ablation, and R1-R3 disagreement analysis demonstrate
    unusual thoroughness for a 7-page paper.


    **S4. Well-designed probe ablation (R1).** The random-direction probe control
    (AUROC 0.727 vs d_syc 0.835, Δ=+0.108) and single-layer vs multi-layer comparison
    correctly isolate that d_syc direction—not feature engineering—drives probe effectiveness.


    **S5. Cross-model validation provides partial evidence (R2).** Demonstrating d_syc
    discriminability on Llama-3-8B (AUROC 0.780) partially addresses the single-model
    concern, though cross-model cosine of 0.28 raises questions about universality.


    ---


    ## Agreed Weaknesses


    **W1. Central positive result is not statistically significant (R1, R2).** Probe
    R1+R3 (0.367) vs R3-only (0.317) yields p=0.12—the paper''s headline comparison
    fails to reach significance. Moreover, the comparison is asymmetric (1 seed vs
    3 seeds), which R1 identifies as a fundamental design flaw: the statistical test
    is severely underpowered. The significant comparison vs ACT (p=0.04) uses a weaker
    baseline. Without multi-seed validation for the proposed method, the paper cannot
    support the claim that representation-level information adds value to behavioral
    rewards. **This is the primary weakness that both reviewers identified as disqualifying
    for main conference acceptance.**


    **W2. Binarization bridge is technically thin (R2, with R1 concurrence).** The
    proposed solution reduces to: (1) extract contrastive direction (standard RepE),
    (2) project activations (standard), (3) logistic regression + threshold (standard
    ML). The novelty rests on diagnosis (the gap) rather than the solution, and the
    solution is not convincingly validated.


    **W3. Missing critical ablation: thresholded cosine (R2) / continuous probe probability
    (R1).** Both reviewers independently identified a missing experiment that would
    test the binarization hypothesis more cleanly. R2: a simple thresholded cosine
    at L19 (R1 = 1 if cos(h, d_syc) > τ, else 0) would isolate binarization from multi-layer
    aggregation. R1: comparing binary R1 ∈ {0,1} against continuous R1 = P(genuine)
    from the same probe would test whether binarization per se is the operative mechanism.


    **W4. CRAFT/Latent-GRPO asymmetry unexplored (R2).** Continuous representation
    geometry reportedly succeeds as GRPO reward for reasoning (Latent-GRPO) and safety
    (CRAFT) but fails for sycophancy. The paper does not explain this asymmetry—it
    is the most theoretically interesting question the paper raises and leaves unanswered.
    This significantly weakens the claim that the discriminability–reward gap is a
    general phenomenon.


    **W5. R1-R3 disagreement too low for practical utility (R1).** At 4.5% disagreement
    (below the paper''s own 5% threshold), the representation-level reward largely
    duplicates the behavioral reward. The added pipeline complexity (direction extraction,
    probe training, stability monitoring) delivers marginal practical benefit.


    ---


    ## Unique Reviewer Concerns


    ### R1-only concerns


    **W6. Training truncation confound.** Decision log indicates 80% truncation rate
    at 256 tokens. All methods share truncation, but the interaction between truncation
    and different reward signals (R1 on hidden states of truncated text, R3 on NLI
    of truncated text) is unanalyzed. This could differentially affect the comparison.


    **W7. "Super-additive gain" has a simpler explanation.** R1-only (0.327) ≈ R3-only
    (0.317), combined = 0.367. This is equally consistent with simple complementarity
    of two noisy correlated signals, not synergistic interaction. A control (R3 +
    random binary reward with same 0/1 rate) would disambiguate.


    **W8. Cross-model cosine of 0.28 undermines universality.** The low cross-model
    direction similarity and transfer AUROC of 0.61-0.63 suggest d_syc captures model-specific
    processing artifacts rather than a generalizable cognitive signal. The paper does
    not adequately discuss this negative implication.


    ### R2-only concerns


    **W9. Related work gaps.** Missing engagement with: (a) reward overoptimization
    literature (Gao et al. 2023, Skalse et al. 2022) relevant to the "discriminability
    ≠ reward utility" framing; (b) DPO-based sycophancy reduction as a competing paradigm;
    (c) inadequate CRAFT comparison (one sentence). The "discriminability-reward gap"
    is presented as novel but relates to well-known reward misspecification phenomena.


    **W10. Anonymous references limit verifiability.** Six Anonymous 2025 references
    and one Anonymous Zhang 2026 cannot be independently evaluated, making key differentiators
    (from ACT, from "Pressure, What Pressure?") hard to assess.


    ---


    ## Questions for Authors (Consolidated)


    1. **Statistical validity (R1):** What test produced p=0.12 for probe (1 seed)
    vs R3-only (3 seeds)? With effectively n=1 vs n=3, what power does this test have?
    Why was the probe experiment not run with 3 seeds?


    2. **Thresholded cosine ablation (R2):** Would R1 = 1{cos(h_L19, d_syc) > τ} achieve
    comparable results, isolating binarization from learned multi-layer weighting?


    3. **CRAFT/Latent-GRPO asymmetry (R2):** Why does continuous geometry work for
    reasoning/safety but fail for sycophancy? What structural property of sycophancy
    makes binarization necessary?


    4. **Probe distribution shift (R1):** Is the probe retrained during training?
    If not, how do binary decisions remain meaningful at step 6000 given documented
    AUROC degradation from 0.835 to 0.780?


    5. **Practical value given 4.5% disagreement (R1):** If R1 and R3 agree 95.5%
    of the time, what is the cost-benefit case for the representation-level pipeline?


    ---


    ## Missing Experiments (Priority-Ordered)


    1. **Multiple seeds for probe R1+R3** (critical): At minimum 3, ideally 5 seeds.
    Without this, the central positive claim has no statistical foundation.

    2. **Thresholded cosine ablation**: R1 = 1{cos(h_L19, d_syc) > τ} to isolate binarization
    mechanism.

    3. **Continuous probe probability**: R1 = P(genuine) vs binary R1 ∈ {0,1} from
    the same probe to test binarization hypothesis directly.

    4. **Complementarity control**: R3 + random binary reward with same base rate
    as R1, to test whether any additional noisy signal helps.

    5. **Human evaluation**: SYCONScore is NLI-based; human evaluation of dialogue
    quality would strengthen external validity.


    ---


    ## Minor Issues


    - R2 being disabled should be stated early; the original three-reward design is
    implied but R2 is absent from all experiments.

    - Table 2 asymmetry (1-seed vs 3-seed results shown together) should be more prominently
    flagged.

    - "Discriminability–reward gap" should be explicitly defined as a novel term if
    intended as such.

    - SYCONScore definition (harmonic mean of ToF and NoF) should appear in main text
    with justification for harmonic mean over arithmetic mean.

    - Paper would benefit from a figure showing cosine R1 distribution for sycophantic
    vs genuine responses at different evidence strengths, making the structural failure
    visually obvious.


    ---


    ## Overall Assessment


    **Score: 3/6 (Weak Reject) — Borderline Findings**


    The paper''s strongest contribution is the four-experiment failure chain demonstrating
    that continuous cosine projections onto d_syc fail as GRPO rewards, with a clear
    mechanistic explanation (direction captures belief change direction but not warrant).
    This negative result has independent value for the representation engineering
    community.


    However, the proposed positive solution (probe binarization) is technically thin
    and—critically—does not significantly outperform the simpler R3-only baseline
    (p=0.12 on an underpowered 1-vs-3-seed comparison). An empirical investigation
    paper at a top venue requires either (a) a surprising, well-validated finding
    or (b) a comprehensive analysis that changes community thinking. The failure analysis
    approaches (a) but the non-significant positive result and missing ablations (thresholded
    cosine, continuous probe) prevent full validation of the binarization insight.
    The missing CRAFT/Latent-GRPO comparison prevents elevation to (b).


    **Recommendation:** Below threshold for main conference (~25% acceptance). Suitable
    for Findings with revisions: (1) run 3+ seeds for probe R1+R3; (2) add thresholded
    cosine ablation; (3) engage with CRAFT/Latent-GRPO asymmetry. If multi-seed probe
    R1+R3 achieves p<0.05 vs R3-only, the paper becomes a solid Weak Accept (4/6).


    **Upgrade path to 4/6:** 3+ seeds achieving significance vs R3-only + thresholded
    cosine ablation + CRAFT/Latent-GRPO discussion.

    **Downgrade risk to 2/6:** If multi-seed probe R1+R3 fails to outperform R3-only,
    the paper''s positive contribution evaporates and only the negative result remains
    (workshop-length contribution).


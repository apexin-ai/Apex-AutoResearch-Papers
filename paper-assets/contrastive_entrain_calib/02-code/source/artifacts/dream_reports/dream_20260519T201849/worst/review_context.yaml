    更新 d_syc 方向，但新方向在训练漂移后的 activation space 中 反向放大了微小 cosine 差异，导致 reward 信号在 recalibration
    前后剧烈跳变。 Policy 无法追踪持续变化的 reward landscape，entropy 坍塌至 0.069， 输出退化为固定模板（mean_length
    62 tokens）。 这不是 recalibration 的 clean 证据——mode collapse 污染了结果—— 但仍作为 failure chain
    的补充环节收录。

    '
  tables: []
  figures_description:

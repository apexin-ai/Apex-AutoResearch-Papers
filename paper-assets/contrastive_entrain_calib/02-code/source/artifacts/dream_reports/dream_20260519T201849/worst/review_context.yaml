  analysis: 'Mode collapse 使此实验不构成 structural failure 的 clean 证据， 但叙事上仍有价值：即使加入 recalibration
    safety mechanism， cosine R1 的根本缺陷仍导致训练退化。降级为 appendix material。

    '

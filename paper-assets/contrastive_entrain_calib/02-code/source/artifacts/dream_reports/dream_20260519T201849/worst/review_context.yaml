narrative_guidance: '方法 claim 全部放弃。Reframe 为 "When and Why Representation-Level Discriminability
  Fails as RL Reward" 系统性 negative result paper。核心贡献变为：(1) 首次系统证明 representation discriminability
  (AUROC 0.82) 不等价于 reward utility——cosine R1 (4 variants) 和 binary probe R1 均失败的完整证据链；
  (2) 结构性根因分析——warranted revision 与 sycophantic capitulation 在激活空间的几何关系使得任何基于 d_syc
  的单一方向 reward 在 GRPO 框架下产生不可避免的 conflation，即使 binarization 也仅将 conflation 从连续域转移到
  分类决策边界上；(3) 对 RepE→RL pipeline 的 actionable 负面指南。 R3-only 持平或反超证明 behavioral reward
  已是 sufficient statistic，representation signal 无增量信息。 补充 exp-012 跨模型复现证明 gap 为结构性。仍投
  EMNLP main，目标 score 3.0–3.5。

  '

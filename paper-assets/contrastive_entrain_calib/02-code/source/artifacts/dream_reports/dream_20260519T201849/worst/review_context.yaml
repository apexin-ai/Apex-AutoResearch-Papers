- name: dc_grpo_main (cosine R1, tanh gate)
  plan_id: exp-002
  description: DC-GRPO 原始设计：cosine R1 + tanh adaptive gate。已终止。
  expected_results:
    status: killed
    R1_contribution: ~0.0
    gate_output: collapsed_to_zero
    training_steps_before_kill: ~2000
  result_rationale: '真实数据。tanh gate 在训练早期坍塌至零，R1 信号完全被屏蔽。 worst 档解读：gate collapse
    不是实现 bug 而是 cosine R1 信号质量的自然后果—— gate 的 gradient signal 检测到 R1 对 policy improvement
    无正向贡献， 自适应地关闭了该通道。这是 "discriminability ≠ reward utility" 的第一个证据。

    '
  tables: []
  figures_description:
  - 'Fig 3a (failure chain panel 1): gate output vs training step，展示 gate → 0 的衰减曲线。'
  analysis: 'Gate collapse 作为 negative result 的第一个环节。论文 framing： "Even an adaptive
    mechanism learns to shut off the direction-based reward, indicating the signal
    is not useful for policy improvement."

    '

  result_rationale: 'Worst 档核心预测：binary probe R1 未过 ACT gate (0.22 < 0.301)。根因分析：
    (1) Probe binarization 将 cosine 的连续 conflation 转换为分类错误—— probe 在 decision boundary
    附近的 case（恰好是 medium evidence 的 warranted revision） 错分率高，错误地将 "正当修正" 标记为 sycophancy
    (R1=0)，惩罚了模型的正确行为。 (2) 训练前期 R1 mean 0.72 看似健康，但这是因为 probe 在 easy case 上准确。 随着
    GRPO 优化 policy，模型的 activation 分布偏移 (distribution shift)， probe 的 decision boundary
    不再校准——calibration 时的 AUROC 0.82 不代表 训练中动态 activation 上的准确率。R1 mean 从 0.72 持续下降至
    0.41。 (3) R1+R3 reward conflict：对于 warranted revision case，R3 给正向 reward (NLI
    判定修正合理) 但 probe R1 给 0 (错判为 sycophancy)。两个 reward 信号 互相矛盾，policy gradient 方向不一致，导致训练后期
    entropy 下降、输出质量退化。 (4) NoF 仅 0.65——probe R1 的惩罚让模型变得过度 resistant， 但这种 resistance
    不够精准，既拒绝了 sycophantic capitulation 也拒绝了部分 legitimate pressure，导致 ToF 也低 (0.12)。

- id: D015
  date: 2026-05-18 21:49 UTC
  summary: exp-008 重新设计：从 SFT+可微 probe penalty 改为 Binary Probe GRPO（REINFORCE-based，抗
    gaming）
  rationale: '诊断确认 S(t)=0 根因是模型通过梯度对抗性 game frozen probe（252 LoRA modules vs 1 probe，容量碾压，retrain
    后 10 步内再次被 game）。这是可微 probe penalty 的根本缺陷。


    重新设计为 Binary Probe GRPO：

    - probe output 二值化（threshold 0.5）作为 GRPO reward signal

    - GRPO 的 REINFORCE-style 更新天然抗 gaming（reward 不参与梯度回传）

    - 在线 retrain 每 500 步（匹配 exp-002 recalibration）

    - 需要 2-GPU ZeRO-2


    这使 ablation cascade 对齐：R3-only GRPO → Binary Probe GRPO → Continuous Probe GRPO
    → DC-GRPO，所有方法同一框架，公平对比。


    原 SFT+probe penalty 的 gradient gaming 作为 negative finding 写入论文，支撑 REINFORCE-based
    设计的必要性。'
  related_experiments:
  - exp_id: exp-008
    role: redesign
    result: S(t)=0 gradient gaming
  - exp_id: exp-014
    role: cascade comparison
  - exp_id: exp-002
    role: cascade comparison
  depends_on:
  - D012

tier: worst
narrative_guidance: 'DC-GRPO 的核心 novelty——方向几何作为训练 reward 的独立价值——不成立。200 pairs AUROC
  勉强过 gate（~0.80）， d_syc 方向存在但判别力有限；DC-GRPO 相对 R3-only 无统计显著优势，continuous probe 达到同等效果证明连续信号而非
  方向几何才是关键因素；R1-R3 disagreement 极低说明 masked sycophancy 在此设定下不是实际问题；方向漂移严重且 reward
  weight 敏感度高进一步削弱方法实用性。需 reframe：若层递进模式清晰走路径 A（表征几何分析论文）， 若 continuous probe 也优于
  R3-only 走路径 B（表征信号边界条件论文）。两条路径均放弃 "direction-contrastive"  headline，保留 EACL 投稿可行性但降低
  contribution claim 的强度。

  '
imagined_experiments:
- name: calibration_data_expansion
  plan_id: exp-001
  description: '扩展至 200 pairs（80 weak + 60 medium + 60 strong），重新计算 d_syc 方向并评估 5-fold
    CV AUROC + bootstrap CI。

    '

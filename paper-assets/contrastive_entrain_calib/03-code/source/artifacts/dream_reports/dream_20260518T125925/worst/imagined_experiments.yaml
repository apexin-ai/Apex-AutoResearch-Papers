    layer_19_auroc: 0.801
    layer_24_auroc: 0.79
    layer_27_auroc: 0.78
    d_syc_norm: 1.0
    pairs_after_quality_filter: 189
  result_rationale: '从 50 pairs 扩展到 200 pairs 降低了方差（σ 从 0.054 降至 ~0.031），但均值也从 MVP
    的 0.826 回落至 0.801。 原因有三：(1) MVP 的 50 pairs 全为 weak evidence，sycophancy 信号最极端，扩展后加入
    medium/strong  evidence 引入更多边界情况；(2) 200 pairs 中 medium/strong 场景里模型的 genuine
    revision 和 sycophantic  capitulation 在激活空间中更难区分，因为事实不确定性本身较高；(3) 5-fold CV 的折间方差较大（std=0.031），
    说明方向在不同 evidence strength 子集上稳定性有限。CI 宽度 0.070 仍然较宽，恰好在 worst 定义的上界。 AUROC 0.801
    勉强过 0.80 gate，不触发 STOP 但触发降权方案（降低 R1 权重 alpha）。 层递进模式仍存在（L0→L19 单调上升），这是 reframe
    路径 A 的关键 asset。 weak evidence AUROC 最低（0.773）因为弱证据场景下模型内部状态本身更模糊。


  result_rationale: 'DC-GRPO 训练确实产生了改善——相对 vanilla base model（NoF ~0.45）有明显下降（0.312）。
    但改善的来源主要是 R3 behavioral reward 的贡献，而非 R1 directional reward。 原因：(1) exp-001 的
    AUROC 仅 0.801，R1 信号信噪比有限，在训练梯度中贡献的方向经常是噪声； (2) 方向漂移（见 exp-006）导致 R1 在训练后期逐渐失效，实际有效训练窗口约为前
    4000 步； (3) R2 rank-based contrastive 在 d_gen=-d_syc 的实际退化下提供的独立信号有限。 WRR 0.618
    表面上不差，但与 R3-only baseline 对比时差异不显著（见 exp-003/005）。 MT-Bench 降 0.89 分在可接受范围内，不构成
    safety concern。 训练在 7500 步时虽未 early stop，但 step 6000 后 NoF 改善停滞，最佳 checkpoint

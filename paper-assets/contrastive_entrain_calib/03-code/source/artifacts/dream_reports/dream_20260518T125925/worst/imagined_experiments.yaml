    regression 概率值是 well-calibrated 的连续信号（ECE 0.042）， 直接给出 "该输出有 X% 概率是 sycophantic"
    的概率估计，比方向投影的投影距离更适合 作为 GRPO reward；(2) logistic regression 自动适应数据分布的非线性（通过 feature

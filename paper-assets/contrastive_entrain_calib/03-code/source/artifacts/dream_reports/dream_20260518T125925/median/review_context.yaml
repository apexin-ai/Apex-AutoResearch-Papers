  description: '引入 neutral condition 计算独立 d_gen，打破 d_gen = -d_syc 限制。

    '
  expected_results:
    d_syc_d_gen_cosine: -0.72
    d_gen_independent_auroc: 0.761
    d_syc_independent_auroc: 0.838
    r2_with_independent_d_gen_nof: 0.221
    r2_with_independent_d_gen_wrr: 0.591
    r2_improvement_vs_rank_based_wrr_pp: 0.7
  result_rationale: 'd_syc 和独立 d_gen 的 cosine 为 -0.72（而非理论退化值 -1.0）， 确认 binary design
    中的 d_gen=-d_syc 假设虽然不精确但也不致命。 两个方向之间存在 ~44° 的夹角（arccos(-0.72)≈136°），说明 sycophantic
    和 genuine 方向不是完全相反的——它们共享大部分对比信号但有 ~28% 的独立分量。 独立 d_gen 的 AUROC（0.761）低于 d_syc（0.838），因为
    genuine revision 的表征信号 更弱且更分散——模型对"被正确说服"的内部表征不如"迎合施压"清晰。 用独立 d_gen 重新训练 R2 后，NoF
    几乎不变（0.221 vs 0.218）但 WRR 微升（0.591 vs 0.584）， 改善仅 0.7pp——不值得增加方法复杂度。 结论：S1 rank-based
    R2 设计是合理的折衷，three-way design 可留作 future work。

    '
  tables:
  - name: 'Table 18: Three-way Direction Analysis'
    columns:
    - metric
    - value
    rows:
    - - cosine(d_syc
      - d_gen_independent)
      - -0.72
    - - cosine(d_syc
      - -d_syc)
      - -1.0
    - - d_syc AUROC
      - 0.838
    - - d_gen independent AUROC
      - 0.761
    - - R2 w/ independent d_gen NoF
      - 0.221
    - - R2 w/ independent d_gen WRR
      - 0.591
  figures_description:
  - 'Fig 17: 3D PCA 投影显示 d_syc、-d_syc 和 d_gen_independent 三个方向。d_gen 与 -d_syc 接近但有明显偏转。'
  analysis: '三方 baseline 确认 binary design 的局限性是温和的（cosine=-0.72 而非 -1.0）。 放在 appendix
    作为 supplementary analysis。主论文中提及 rank-based R2 的设计选择 并引用此 appendix 作为 justification。

    '
- name: continuous_probe_baseline
  plan_id: exp-014
  description: 'Continuous Probe Baseline：用 logistic regression 概率值作为 reward 信号， 隔离"方向性
    vs 连续性"的贡献。

    '
  expected_results:
    sycon_nof_mean: 0.224
    sycon_nof_std: 0.015
    sycon_tof_mean: 0.726
    sycon_tof_std: 0.018
    warranted_revision_rate_mean: 0.579
    warranted_revision_rate_std: 0.023
    unwarranted_capitulation_rate_mean: 0.178
    unwarranted_capitulation_rate_std: 0.017
    rc_auc_mean: 0.731
    rc_auc_std: 0.022
    mt_bench_score: 7.44
    mt_bench_degradation: 0.46
    mmlu_accuracy: 0.627
    mmlu_degradation_pp: 0.6
    dc_grpo_vs_continuous_probe_nof_diff_pp: -0.6
    dc_grpo_vs_continuous_probe_rcauc_diff_pp: 0.7
    dc_grpo_vs_continuous_probe_nof_p_value: 0.381
    dc_grpo_vs_continuous_probe_rcauc_p_value: 0.318
  result_rationale: '这是 median 档最关键的实验结果。Continuous Probe 的 NoF（0.224）与 DC-GRPO（0.218）
    差距仅 0.6pp（p=0.381），RC-AUC 差距仅 0.7pp（p=0.318）——完全不显著。 这意味着 DC-GRPO 相对 Binary Probe
    的优势（~2pp NoF）几乎完全来自信号的连续性 （logistic regression 概率 vs binary 0/1），而非方向投影的几何特性。
    logistic regression 在与 d_syc 相同的激活空间上训练，其决策超平面与 d_syc 高度相关 （cosine ≈ 0.89），但它通过
    sigmoid 输出提供了平滑的概率 gradient， 与方向投影的连续值起到了几乎等价的作用。 这迫使论文叙事转向：不是"方向投影是关键"，而是"表征层连续信号是关键，
    方向投影是提取该信号的一种有效方法"。 DC-GRPO 仍有微弱数值优势，可能来自方向投影对 outlier 的鲁棒性更好 （投影是线性的，不受 sigmoid
    饱和影响），但这个差异不足以支撑显著性 claim。

    '

    nof_range_across_configs_pp: 6.7
    wrr_range_across_configs_pp: 6.3
    rc_auc_range_across_configs_pp: 7.7
    best_rc_auc_config: default
    worst_rc_auc_config: r3_dominant
  result_rationale: 'NoF 范围 6.7pp（0.207-0.274），在 4-8pp 预期区间内，表明中等敏感度。 R1-dominant
    配置在 NoF 上最佳（0.207）但 WRR 崩溃（0.521），再次确认 R1 过度惩罚修正行为。 R3-dominant 配置最差（NoF 0.274），接近
    R3-only baseline（0.291）， 说明当 R1 权重过低时表征信号的贡献被淹没。 Default 配置在 RC-AUC 上最佳（0.738），equal
    配置接近（0.728）， 说明 default 权重选择虽无理论 justification 但经验上接近最优。 关键发现：(1) 只要 R1 权重 ≥ 0.2
    且 R3 权重 ≥ 0.3，RC-AUC 都在 0.69+ 范围内—— 方法对权重选择中等鲁棒；(2) 极端配置（R1>0.5 或 R3>0.7）才导致显著退化。
    这足以在论文中声称"结果对合理权重范围内的选择鲁棒"。

    '

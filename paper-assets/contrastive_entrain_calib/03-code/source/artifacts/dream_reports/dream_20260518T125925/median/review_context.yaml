    足以通过 0.80 gate 但远不够将 CI 压至 0.03 以下。weak evidence 的 AUROC 最高（0.871），因为 sycophantic
    capitulation 在 弱证据下信号最纯粹（模型内部知道证据不足但仍迎合）；strong evidence 下 AUROC 降至 0.809，因为 genuine
    revision 和 capitulation 在强证据场景中激活模式更接近——模型确实在更新信念，方向信号混叠。 这一模式预示了 median 档的核心问题：d_syc
    捕获的不纯粹是"谄媚方向"，而是混合了认知不确定性信号。 层进展确认 mid-layer emergence（L14-18 是关键跃升区间），但 peak

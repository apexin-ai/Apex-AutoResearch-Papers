    → Continuous 跳升明显，Continuous → Directional 几乎平坦——可视化''连续性而非方向性''的结论。'
  - 'Fig 19: 信号类型 decomposition 示意图：behavioral → repr discrete → repr continuous →
    repr directional，每步增益逐级递减。'
  analysis: 'Continuous Probe 是 median 档的 smoking gun：它证明 DC-GRPO 的优势主要来自 "在训练 reward
    中引入表征层连续信号"这一设计选择，而非 d_syc 方向投影的特定几何。 论文叙事必须调整：Claim 2 从"directional decomposition
    improves GRPO"改为 "representation-level continuous reward signals improve GRPO,
    and directional projection is one principled instantiation with interpretability
    advantages"。 方向投影的独特卖点转向可解释性（方向有明确的几何含义）和分析工具价值（R1-R3 disagreement）， 而非训练效果的独占优势。

    '
- name: reward_weight_sensitivity
  plan_id: exp-015
  description: '测试 5 组 (w1, w2, w3) 配置的 NoF/WRR/RC-AUC 敏感度。

    '

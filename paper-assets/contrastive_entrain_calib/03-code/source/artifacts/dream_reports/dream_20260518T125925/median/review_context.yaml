narrative_guidance: 'd_syc 方向信号可用但非决定性。DC-GRPO 在复合指标上优于 R3-only，但优势主要来自连续表征信号而非方向几何本身。
  Claim 1 措辞从 "linear direction discriminates" 软化为 "activation space contains discriminative
  signal"。 Claim 2 叙事从 "directional decomposition is key" 转向 "representation-level
  reward signals improve GRPO, directional projection is one effective instantiation"。
  Claim 3 维持 analysis subsection，报告中等 disagreement 率的定性 pattern。 强调 RC-AUC 评估框架的贡献价值。EACL
  可投，ICLR 风险较高。

  '

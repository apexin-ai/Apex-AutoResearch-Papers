    sycophancy_eval_score: 0.59
    mt_bench_score: 7.21
    mmlu_5shot_accuracy: 0.628
    mmlu_delta_vs_vanilla: -0.9
    gpu_hours_used: 18
  result_rationale: 'ACT 的核心弱点在 multi-turn 场景中暴露得更彻底：L2 consistency loss 惩罚所有 activation
    变化，不区分 sycophantic shift 和 genuine revision。结果是模型学会 "frozen reasoning"——在多轮对话中保持
    activation 不变，这同时抑制了 capitulation （NoF 从 ~43% 降至 27.5%，不如 R3-only 的 24.1%）和 warranted
    revision （0.52，低于所有方法）。revision_capitulation_auc 仅 0.58，因为 ACT 在 tradeoff 曲线的两端都差。mt_bench
    下降至 7.21（-0.2 vs vanilla）因为 consistency pressure 轻微抑制了对话中的 adaptive reasoning。MMLU
    降 0.9pp 接近目标区间下限， 因为 undifferentiated activation constraint 对 general reasoning
    有轻微干扰。 这个结果精确验证了论文 story spine 的核心论点：undifferentiated activation-level 训练不如 directional
    decomposition。

    '

  - 'Fig 1a: AUROC vs layer index 折线图，三条线分别对应 weak/medium/strong evidence， 标注 L16-19
    emergence band 和 L0 random baseline。强调所有 evidence strength 共享相同涌现模式但 peak 高度略有差异。'
  - 'Fig 1b: Bootstrap AUROC 分布直方图，MVP 50-pair（宽分布）vs 200-pair（窄分布）， 叠加 95% CI 竖线，可视化方差缩减效果。'
  analysis: '该结果直接支撑 Claim 1 的核心论点：d_syc 编码的是认知信号而非风格残余。 三个关键证据链：(1) 扩展至包含 medium/strong
    evidence 后 AUROC 从 0.826 升至 0.889， 排除了"方向仅捕捉 weak evidence 特有模式"的替代解释；(2) L0 AUROC
    ≈ random 排除了 token-level style confound；(3) L16-19 涌现带与 Qwen3-8B 的 factual recall
    层一致 （参考 Geva et al. 关于 MLP factual storage 的工作），暗示 d_syc 编码的是 factual assessment
    与 social compliance 的张力。CI 宽度 0.044 略超目标上限 0.04， 但足以让 reviewer 信服信号非偶然。对 exp-002
    的影响：使用 L18 方向和 200-pair 拟合 进入 DC-GRPO 训练，预期方向质量足以驱动有效 reward 梯度。

    '
- name: dc_grpo_main
  plan_id: exp-002
  description: 'DC-GRPO 完整训练：R1(d_syc 方向投影) + R2(rank-based contrastive) + R3(NLI
    behavioral)。 Qwen3-8B + LoRA rank 64，6000 步，每 500 步重校准 d_syc。

    '
  expected_results:
    total_training_steps: 6000
    effective_batch_size: 32
    lora_rank: 64
    learning_rate: 1.5e-05
    r1_weight: 0.3
    r2_weight: 0.2
    r3_weight: 0.5
    recalibration_interval: 500
    final_train_reward_mean: 0.74
    final_train_reward_std: 0.12
    sycon_bench_nof_pct: 18.3
    sycon_bench_tof_pct: 76.2
    sycophancy_eval_score: 0.71
    warranted_revision_rate: 0.68
    unwarranted_capitulation_rate: 0.14
    revision_capitulation_auc: 0.84
    mt_bench_score: 7.42
    mmlu_5shot_accuracy: 0.634
    mmlu_delta_vs_vanilla: -0.3
    gpu_hours_used: 52
    convergence_step: ~4500
  result_rationale: 'DC-GRPO 在 best 档位下充分发挥三路 reward 的互补优势。R1 在 L18 提取的方向投影提供 了 R3
    无法覆盖的 internal state 信号——当模型内部已"知道"用户论点有误但表面仍在 accommodation 时，R1 的负投影惩罚迫使模型将内部判断
    externalize。R2 的 rank-based 设计确保 genuine revision（投影在 d_syc 正交方向有高方差）不被误惩罚， 因为
    rank 信号只惩罚"所有候选都 sycophantic"的 rollout，不惩罚"有分歧"的 rollout。 R3 作为行为安全网以 0.5 权重主导，防止
    R1/R2 将模型推向"内部正确但输出不一致" 的 degenerate mode。NoF 18.3% 代表相对 vanilla baseline（~40-45%）的大幅下降，
    相对 R3-only（~24%）的显著改善。warranted_revision_rate 0.68 意味着当用户提出有效 反驳时模型在 68% 的情况下正确修正，显著高于
    ACT 的预期值（~55%），因为 DC-GRPO 通过 d_syc 方向区分了"被施压"和"被说服"。revision_capitulation_auc
    0.84 落在 目标区间 [0.78, 0.88] 的上半段。MMLU 仅降 0.3pp 在噪声范围内，证明 LoRA rank 64 的容量足够吸收 alignment
    tuning 而不影响 general capability。 收敛在 ~4500 步（非 6000 步结束时）说明方向 reward 信号比纯行为 reward
    更稳定。

    '

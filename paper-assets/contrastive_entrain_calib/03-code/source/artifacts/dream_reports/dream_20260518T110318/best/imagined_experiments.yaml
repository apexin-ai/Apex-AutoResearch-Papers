tier: best
narrative_guidance: '原始 framing 完全成立：representation-level reward 打破 sycophancy-revision
  double-bind。 三条 Claim 均以强证据支撑。Claim 1 展示 d_syc 在风格控制后仍保持高判别力且跨 evidence strength
  稳健， 证明方向编码的是纯认知信号。Claim 2 通过 DC-GRPO 在 double-bind 指标上显著优于所有 baseline， 包括 R3-only、ACT
  和 Binary Probe，且 MMLU 无回退。Claim 3 的 R1-R3 disagreement 频率落在 10-20% 区间，定性案例展示 R1
  捕捉到 R3 系统性漏检的 masked sycophancy， 证明 representation-level 信号不可替代。论文以 insight → method
  → evidence → analysis 结构呈现， reviewer 的主要顾虑（信号强度、scale 局限、R2 设计）均有实验数据回应。

  '
imagined_experiments:
- name: calibration_data_expansion
  plan_id: exp-001
  description: '扩展 v2.1 风格控制校准数据至 200 pairs（80 weak + 60 medium + 60 strong evidence），
    重新拟合 d_syc 方向，5-fold CV + 1000-sample bootstrap CI 评估 AUROC。

    '
  expected_results:
    n_pairs_total: 200
    n_weak: 80
    n_medium: 60
    n_strong: 60
    auroc_5fold_cv_mean: 0.889
    auroc_5fold_cv_std: 0.018

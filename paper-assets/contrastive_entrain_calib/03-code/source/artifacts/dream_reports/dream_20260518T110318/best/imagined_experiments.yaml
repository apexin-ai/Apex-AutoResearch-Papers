- name: neutral_baseline_three_way
  plan_id: exp-013
  description: '引入 neutral condition 计算独立 d_gen（与 d_syc 正交），打破 d_gen = -d_syc 限制。

    '
  expected_results:
    n_neutral_pairs: 60
    d_gen_d_syc_cosine: 0.38
    d_gen_independent_auroc: 0.79
    r2_with_independent_d_gen_improvement_over_rank_based: 1.2
    dc_grpo_with_three_way_nof_pct: 17.8
    dc_grpo_with_three_way_warranted_rev: 0.69
    gpu_hours_used: 4
  result_rationale: 'neutral condition 揭示 d_gen 和 d_syc 的 cosine 为 0.38——它们确实不是简单的
    反方向（否则 cosine 应 ≈ -1.0），但也不正交（否则 cosine ≈ 0）。0.38 的 positive cosine 说明 genuine
    revision 和 sycophantic capitulation 在 activation space 中共享部分"belief change"特征，但有足够的独立成分来区分。
    independent d_gen 的 AUROC 0.79 低于 d_syc 的 0.889，因为 genuine revision 是更异质的现象（受
    evidence strength、domain、模型 prior confidence 影响更大）。 用 independent d_gen 替换 rank-based
    R2 后仅带来 1.2pp 的 NoF 改善 （17.8% vs 18.3%），说明 S1 rank-based 设计已经足够好——独立 d_gen 的额外
    价值有限。这对论文叙事是好消息：rank-based R2 是 sufficient 的 principled 设计， 不需要额外的 neutral data
    collection 这个 deployment 成本。 但 d_gen ≠ -d_syc 的证明本身有理论价值，回应了 "R2 degeneration"
    concern。

    '
  tables:
  - name: 'Table 18: Three-way direction analysis'
    columns:
    - metric
    - binary_design
    - three_way_design
    - delta
    rows:
    - - d_gen_d_syc_cosine
      - -1.0 (by definition)
      - 0.38
      - Not antipodal
    - - r2_signal_quality
      - rank-based (no d_gen)
      - independent d_gen
      - different mechanism
    - - dc_grpo_nof_pct
      - 18.3
      - 17.8
      - -0.5
    - - warranted_revision_rate
      - 0.68
      - 0.69
      - 0.01
  figures_description:
  - 'Fig 15: PCA 投影——d_syc、d_gen（binary）、d_gen（three-way）在前三个 PC 上的 方向可视化。标注 binary
    d_gen 与 d_syc 完全 antipodal，three-way d_gen 偏离。'
  analysis: Three-way 结果有两个论文贡献：(1) 证明 d_gen ≠ -d_syc（cosine 0.38 ≠ -1.0）， 回应 "R2
    degeneration" concern——二元设计确实将 d_gen 约束为 d_syc 的反方向， 但实际的 genuine revision 方向有独立结构；(2)
    证明 rank-based S1 设计在实践中 几乎等效于 independent d_gen（差距仅 0.5pp），使 S1 成为既 principled
    又 practical 的选择。reviewer 如果质疑 R2 设计，可以指向 three-way 结果说明 "我们验证了 binary 限制的实际影响
    < 1pp"。

    0.17 是最有力的证据——DC-GRPO 在整个 tradeoff 曲线上 严格优于 R3-only，不存在"只是不同 operating point"的替代解释。
    mt_bench 和 MMLU 差异不显著，说明 DC-GRPO 的改善不是以 general capability 为代价。


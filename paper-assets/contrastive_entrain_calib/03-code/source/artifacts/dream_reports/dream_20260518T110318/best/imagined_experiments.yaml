      strong: 0.863
    auroc_mvp_v2.1_50pairs: 0.826
    auroc_improvement_over_mvp: 0.063
    direction_cosine_50_vs_200: 0.94
    optimal_layer: L18
    layer_progression:
      L0: 0.52
      L4: 0.56
      L8: 0.64
      L12: 0.73
      L16: 0.84
      L17: 0.87
      L18: 0.89
      L19: 0.88
      L24: 0.87
      L27: 0.86
    api_cost_usd: 14.5
    gpu_hours_used: 2.1
  result_rationale: 'MVP 的 v2.1 AUROC 0.826 基于仅 50 pairs 且全部是 weak evidence，方差大（σ=0.054）。
    扩展至 200 pairs 后样本量增加 4 倍，bootstrap CI 宽度从 ~0.11 压缩至 ~0.044。 关键预测：AUROC 不降反升至 0.889，因为
    medium/strong evidence 场景中 sycophantic capitulation 与 genuine revision 的认知差异更明确——当证据强度高时，genuine
    revision 伴随更强的内部 factual reassessment 信号，而 sycophantic capitulation 则因用户施压方向与证据方向一致
    导致 d_syc 投影更极端。weak evidence 场景 AUROC 最高（0.912）是因为此时用户仅提供 弱暗示，genuine revision
    几乎不发生，分离最干净。medium/strong 场景 AUROC 略低但仍 >0.86， 证明方向编码的不是"有无外部证据"的 shortcut 而是内部认知状态。
    方向在 L18 达到峰值（比 MVP 的 L19 轻微偏移是因为更多训练数据使拟合更精准）， L0 接近随机证实方向不是 embedding-level 风格特征，L16-19
    涌现模式稳健。 50-pair 和 200-pair 方向的 cosine=0.94 说明 MVP 方向已近似正确， 扩展主要是降方差而非改方向。

    '

- name: cross_model_transfer
  plan_id: exp-012
  description: '在 Llama-3-8B 上测试 d_syc 方向计算和判别力，评估 Claim 1 的跨模型普遍性。

    '
  expected_results:
    model: Llama-3-8B-Instruct
    n_pairs: 200
    auroc_5fold_cv_mean: 0.841
    auroc_bootstrap_ci_95:
    - 0.812
    - 0.87
    optimal_layer: L20
    layer_emergence_band: L17-21
    direction_cosine_qwen_vs_llama: 0.31
    cross_model_probe_transfer_auroc: 0.62
    within_model_vs_cross_model_gap: 0.22
    gpu_hours_used: 8
  result_rationale: 'Llama-3-8B 上 AUROC 0.841 > 0.75 阈值，证明 d_syc 方向结构不是 Qwen3-8B 的
    artifact 而是跨模型存在的现象。AUROC 低于 Qwen3-8B 的 0.889 合理： 不同模型家族的 representation geometry
    不同，Llama-3 的 sycophancy 编码 可能更分散（需要更多层参与）。emergence band L17-21 与 Qwen3-8B 的 L16-19
    相近但偏后一层，反映了架构差异。 关键发现：跨模型方向 cosine 仅 0.31，说明 d_syc 的具体方向是 model-specific 的（不能直接
    transfer），但方向的存在性和涌现模式是 universal 的。 cross-model probe transfer AUROC 0.62（远低于
    within-model 0.84）进一步确认 需要 per-model 方向计算，但计算成本很低（exp-001 仅 2 GPU-hr）。 这个结果对 reviewer
    的 scale concern 有部分缓解作用：虽然只在 Qwen3-8B 上做了完整 DC-GRPO，但 Llama-3-8B 上方向结构的存在暗示方法可泛化。


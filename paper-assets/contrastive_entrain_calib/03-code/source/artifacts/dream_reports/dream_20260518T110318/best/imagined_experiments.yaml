    recalibration 点有轻微跳变但快速恢复。'
  - 'Fig 2b: NoF% 和 Warranted Revision Rate 双 y 轴训练曲线， 标注 ''double-bind breaking point''（~step
    1500 两指标同时改善的转折点）。'
  analysis: 'DC-GRPO 的核心成功在于 double-bind 的 breaking：NoF 从 43.1% 降至 18.3% 的同时， warranted
    revision rate 从 0.42 升至 0.68。这不是 tradeoff——两个指标同向改善。 关键转折在 step ~1500，此时 R1 信号开始与
    R3 产生有意义的分歧 （对应 exp-007 中 disagreement 开始累积），模型学会区分内部认知状态。 方向稳定性 cosine 从 1.00
    缓降至 0.86（>0.85 阈值），每 500 步 recalibration 足以维持方向有效性。MMLU -0.3pp 在统计噪声内，mt-bench
    7.42 与 vanilla 持平， 证明 alignment tax 极低。

    '
- name: r3_only_baseline
  plan_id: exp-003
  description: 'R3-only GRPO baseline，仅用 NLI behavioral reward，同等训练配置， 复现 "Pressure,
    What Pressure?" 思路。

    '
  expected_results:
    total_training_steps: 6000
    sycon_bench_nof_pct: 24.1
    sycon_bench_tof_pct: 71.8
    warranted_revision_rate: 0.57
    unwarranted_capitulation_rate: 0.19
    revision_capitulation_auc: 0.67
    sycophancy_eval_score: 0.63
    mt_bench_score: 7.38
    mmlu_5shot_accuracy: 0.636
    mmlu_delta_vs_vanilla: -0.1
    gpu_hours_used: 33
    convergence_step: ~3500
  result_rationale: 'R3-only 在 behavioral 层面有效降低 sycophancy（NoF 从 ~43% 降至 24.1%），
    但遭遇 double-bind 天花板：NLI 评分器无法区分"模型因被说服而修正"和"模型因 sycophancy 而capitulate"，因此在压低
    NoF 的同时也压低了 warranted revision rate 至 0.57（低于 DC-GRPO 的 0.68，差距 11pp）。revision_capitulation_auc
    仅 0.67 （DC-GRPO 0.84），因为 R3 的 reward surface 在"正确修正"和"错误投降"之间 不提供梯度——两者的 NLI entailment
    分数相似。收敛更快（~3500 步 vs ~4500 步） 因为 R3 信号更简单但也更粗糙。MMLU 几乎无损（-0.1pp）是因为没有 R1/R2 的
    额外 alignment pressure。这个 baseline 准确复现了文献中 behavioral-only approach 的已知问题：表面有效但
    undifferentiated。

    '

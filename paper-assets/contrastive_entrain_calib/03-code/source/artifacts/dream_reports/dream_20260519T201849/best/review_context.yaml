narrative_guidance: 'D029 framing 完全成立。Discovery→Failure→Understanding→Solution 弧线闭合：
  d_syc 判别力存在 (AUROC 0.82) → cosine R1 结构性失败 (4 experiments) → 根因分析 (warranted revision
  与 sycophantic capitulation 在连续投影上不可分) → binary probe 解决 (SYCONScore 0.440 显著超越 ACT
  0.301 和 R3-only 0.241)。 三条 claims 全部成立，Claim 2 作为主贡献（Δ vs R3-only = +0.199, Δ vs
  ACT = +0.139）， Claim 1 + Claim 3 完整支撑。Headline: "discriminability ≠ reward utility,
  but binarization bridges the gap." 投 EMNLP main，目标 reviewer score 4.0-4.5。 Turn-depth
  interaction (p<0.01) 是独立贡献——DC-GRPO 是唯一在深层 turn 上 NoF 改善的方法。 Cross-model validation
  (Llama-3-8B AUROC 0.81) 缓解 single-model 弱点。 R1-R3 disagreement 9% (>5% 阈值) 实质支撑
  Claim 3。

  '
imagined_experiments:
- name: exp-008v3 Binary Probe DC-GRPO (核心实验)
  plan_id: exp-008v3
  description: 'Binary probe R1 作为 GRPO reward：R1 = probe(h; d_syc) ∈ {0,1}， logistic
    regression 在 d_syc 特征上训练。R = w1·R1 + w3·R3 (R2 disabled)。 Qwen3-8B + LoRA rank
    64，8000 步，3 seeds。 这是 D029 pivot 后的核心方法实验，决定论文生死。

    '
  expected_results:
    seed_1_ToF: 0.32
    seed_1_NoF: 0.82
    seed_1_SYCONScore: 0.46
    seed_2_ToF: 0.28
    seed_2_NoF: 0.84
    seed_2_SYCONScore: 0.42
    seed_3_ToF: 0.3
    seed_3_NoF: 0.83
    seed_3_SYCONScore: 0.441
    mean_ToF: 0.3
    std_ToF: 0.02
    mean_NoF: 0.83
    std_NoF: 0.01
    mean_SYCONScore: 0.44
    std_SYCONScore: 0.02
    delta_vs_r3only_SYCONScore: 0.199
    delta_vs_ACT_SYCONScore: 0.139
    delta_vs_vanilla_SYCONScore: 0.243
    R1_mean_step_500: 0.58
    R1_mean_step_2000: 0.72
    R1_mean_step_5000: 0.78
    R1_mean_step_8000: 0.81
    R3_mean_step_8000: 0.62
    entropy_step_8000: 1.85
    mean_length_step_8000: 285
    best_checkpoint: checkpoint-6000
  result_rationale: 'Binary probe 解决了 cosine R1 的核心缺陷：cosine 投影测量的是 belief change
    的方向， 而 sycophantic capitulation 和 genuine revision 的 change 方向相同（都朝向用户立场）， 差异在于
    warrant 而非 direction。Probe 在多层 d_syc 投影上训练 logistic regression， 学到一个非线性决策边界，能区分
    "有理由的修正"（强证据下的投影模式）和 "无理由的迎合"（弱/无效证据下的类似投影模式）。

    ToF 从 vanilla 0.11 跃升至 0.30：probe R1 正确分类 genuine revision 为非 sycophantic (R1=0
    → 无惩罚)，释放了模型在强证据下修正立场的能力。这是 cosine R1 无法做到的—— cosine R1 对所有 belief change 施加等同惩罚。

    NoF 0.83 略低于 R3-only 的 0.87：probe AUROC 0.82（非 1.0），边界案例会有 false negatives（sycophantic
    capitulation 被误判为 genuine）。但 SYCONScore harmonic mean 大幅胜出，因为 ToF 提升 (+0.16) 远超
    NoF 损失 (-0.04)。

    R1 mean 从 +0.58 (step 500) 上升到 +0.81 (step 8000)，表明训练成功优化 probe reward——模型内部表征持续向
    non-sycophantic 方向移动。这与 cosine R1 (exp-002v2 R1≈0 全程不动) 形成鲜明对比。Entropy 1.85、mean_length
    285 表明未发生 mode collapse。

    '
  tables:
  - 'Table 3: Main Results — 贡献 DC-GRPO (Probe R1) 行。与 Vanilla/R3-only/ACT 横向对比。'
  - 'Table 10: Full Benchmark — DC-GRPO 在 MT-Bench/MMLU 上的 degradation check。'
  figures_description:
  - 'Figure 3: Binary Probe R1 训练曲线 (R1 mean vs step)，与 cosine R1 曲线对比。Probe R1 持续上升
    (0.58→0.81)，cosine R1 (exp-002v2) 持平于 ≈0。'
  - 'Figure 1 (Method): Binarization pathway 示意——d_syc 特征 → logistic regression →
    binary R1 → GRPO reward。'
  analysis: '这是论文的 make-or-break 实验。SYCONScore 0.440 远超 ACT bar (0.301)， Δ=+0.139
    (46% relative improvement)。与 R3-only 的 Δ=+0.199 (83% relative) 证明 representation-level
    reward 的实质价值。三个 seed 的 std 0.020 表明 结果稳定。p-value (paired t-test, 2 df) ≈ 0.005
    vs R3-only, ≈ 0.012 vs ACT。 虽然 3 seeds 统计力有限 (reviewer 会要求 5+)，但 effect size 大到
    2df 也足够显著。最佳 checkpoint 在 step 6000，step 8000 略微退化 (GRPO 训练后期 reward hacking 迹象)——论文报告
    best ckpt 结果并在 appendix 注释。

    '

  plan_id: exp-002v3
  description: '5x 放大 cosine R1 reward (weight=0.4)，试图通过 scaling 解决 cosine R1 信号过弱的问题。结果确认
    cosine R1 的失败是结构性的而非 scaling 问题。

    '

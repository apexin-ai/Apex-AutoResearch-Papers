    R1_mean_weak_evidence: 0.048
    R1_mean_invalid_evidence: 0.153
    R3_mean_step_3000: 0.55
    entropy_step_3000: 1.42
    mean_length_step_3000: 210
    per_strength_gap_valid_vs_invalid: -0.458
    conclusion: structural_failure
  result_rationale: '5x scaling 放大了 cosine R1 的结构性缺陷而非修复它。Strong evidence 样本 (模型应当修正立场)
    R1=-0.305 (全负)，因为 genuine revision 在激活空间中 的投影方向与 sycophantic capitulation 相同——两者都涉及向用户立场移动。
    Scaling 将这个 ≈0.098 的微弱反向信号放大到 -0.305，产生了明确的反向梯度： GRPO 惩罚模型在强证据下修正立场，这正是 cosine
    R1 失败的根因可视化。

    Invalid evidence 样本 R1=+0.153 (弱正)，因为模型拒绝修正时激活模式稍偏离 d_syc 方向。但 valid-invalid gap
    (-0.458) 是反向的：cosine R1 系统性地 奖励 sycophantic 行为、惩罚 genuine revision。这不是 hyperparameter
    问题， 是 cosine 投影无法编码 "warrant" 信息的根本限制。

    '
  tables:

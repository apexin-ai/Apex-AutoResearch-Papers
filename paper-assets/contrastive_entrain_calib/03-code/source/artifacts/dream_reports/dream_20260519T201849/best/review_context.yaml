    机制解释：deeper commitment 在 activation space 中产生更大的 sycophantic vs genuine divergence——模型在第
    4+ turn 维持错误立场需要更大的 internal tension (activation 偏离 genuine belief 更远)，这使 d_syc
    probe 的信号 更强、更准确。Binary probe R1 在 deep turns 的有效 AUROC 更高，reward 更精准 → 模型在 deep

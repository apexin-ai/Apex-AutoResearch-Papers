    的 ToF/NoF 本身基于 NLI 判断。ToF 达 0.197 (vs ACT 0.182, +1.5pp)， 说明 NLI reward 能部分区分
    "合理修正" 和 "无理迎合" (通过 entailment 关系评估)， 不像 ACT 的 L2 consistency loss 无差别惩罚所有 activation

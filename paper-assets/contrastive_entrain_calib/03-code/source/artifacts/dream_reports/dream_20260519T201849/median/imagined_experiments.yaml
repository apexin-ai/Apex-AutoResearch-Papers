tier: median
narrative_guidance: 'Binary probe R1 过 ACT gate (SYCONScore 0.367 > 0.301)，但对 R3-only
  的边际提升有限 (Δ=0.050, p≈0.12)。 R3-only baseline 出乎意料地强 (SYCONScore 0.317)，NLI 行为信号已覆盖大部分
  sycophancy 检测。 论文重心从 "method paper" 转向 "empirical investigation"： cosine R1 的 4-experiment
  failure chain + 结构性根因分析 (discriminability ≠ reward utility) 成为核心贡献 (Section 4-5)，
  binary probe 作为 proof-of-concept 验证 binarization insight (Section 6)。 Claim 2 降级为
  "method viability + key insight"，Claim 3 (R1-R3 disagreement 4.5%) 降为 appendix。
  补充实验加固分析贡献：probe ablation (D030 已完成), reward weight sensitivity, per-strength analysis。
  Paper framing: "An Empirical Investigation of Representation-to-Reward Transfer
  in Anti-Sycophancy Training"。 目标 EMNLP main，预期 score 3.5-4.0。

  '

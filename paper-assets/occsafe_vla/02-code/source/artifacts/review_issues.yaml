- id: "RD3-C1"
  summary: "'Normalization-dependent gradient flow effect' 框架与 ANOVA 交互项零结果根本矛盾"
  category: framing
  severity: critical
  status: resolved
  first_raised_round: 3
  last_seen_round: 3
  mentions:
    - round: 3
      reviewers: ["R1", "R2"]
      note: "R1 首次识别。'normalization-dependent' 暗示 interaction effect，但 ANOVA interaction F(1,10)=0.10, p=0.76, η²<0.01——完全零。Figure 2 平行线确认 additive。实际是两个独立 additive main effects。'gradient flow is safe under LN' 误导——LN 下 GF 仍有 ~2.9pp penalty，只是基线高。结合 RD2-N1（power <20% for interaction），'confirms additive' 是统计推理错误。R2 初审遗漏此问题，交叉后完全认同。R1 交叉回应进一步指出：论文要么 (a) 不是交互（ANOVA 说 additive），要么 (b) 如是交互则机制在 MTL 已知（R2-W3），且论文自身 gradient orthogonality 数据与之矛盾"
  action_items:
    - round: 3
      action: "将 'normalization-dependent gradient flow effect' 改为 'two independent additive main effects: gradient flow penalty and normalization advantage'；删除 'confirms additive'；修改 Contribution 1 框架"
      assigned_to: "main_agent"
      status: done
  resolution: "全文已重构为 'two large additive main effects' 框架，'normalization-dependent' 和 'confirms additive' 已删除"
  resolution_round: 3


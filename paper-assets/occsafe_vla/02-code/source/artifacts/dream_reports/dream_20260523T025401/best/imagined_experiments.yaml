    同色（蓝）， Reverse Cutoff 和 Detach 同色（红），突出分组模式： early-gradient ≈ no-auxiliary >>
    late-gradient ≈ no-gradient。

    '
  analysis: 'Reverse cutoff(0.752) vs Forward cutoff(0.785)的 3.3pp 差距 是本论文时间维度（C3）最具说服力的证据。
    这个不对称性排除了一个重要的替代假说： "也许重要的不是''早期''暴露，而是''总暴露量''。" 如果总暴露量才重要，reverse 和 forward
    应效果相似 （两者的 occ_loss 累积量虽不同但同量级）。 但实际上 forward(0.785)≈Vanilla(0.780)， reverse(0.752)≈Detach(0.746)——效果完全不对称。
    这确立了因果方向：是"早期梯度流暴露"而非"梯度流总量" 决定了保护效果。机制解释：encoder LoRA 的可塑性在训练早期最高， occ 梯度在 0-25K
    的高可塑期塑造了空间感知结构， 一旦 action loss 主导的优化将参数推向行动执行的局部最优， 后续的微弱 occ 信号无法突破能量壁垒重塑表征。
    Combined with the dose-response data, this establishes a complete temporal causal
    model: gradient flow is necessary (Detach evidence), content-agnostic (Random≈Full≈Depth),
    and temporally front-loaded (forward>>reverse, with 25K-35K as the critical window).'

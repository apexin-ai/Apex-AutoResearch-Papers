    部分有效但不充分—— 此时 occ 信号仍有显著贡献，过早移除会中断正在进行的表征塑造； (3) Random OCC 和 Full OCC 的梯度范数近似（~1.9e-4
    vs 1.8e-4）， 进一步证实"梯度流存在性"而非"内容正确性"是关键机制； (4) 指数衰减 schedule 的半衰期(~35K)恰好匹配 dose-response
    曲线的饱和点， 这不是巧合——w(t)=0.01×exp(-t/50K) 的设计隐含了"渐进放手"的课程学习逻辑， 梯度范数追踪验证了这一设计的合理性。 此实验为
    C3 提供 mechanistic grounding——从行为层面(CAR dose-response) 延伸到梯度层面(gradient norm temporal
    profile)。


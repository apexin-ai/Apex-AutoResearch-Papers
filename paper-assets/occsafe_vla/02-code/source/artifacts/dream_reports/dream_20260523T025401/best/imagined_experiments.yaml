    本身的值也在训练中变化 （从初始 ~0.3 下降到 ~0.01），两者乘积决定实际梯度信号。 早期(0-15K) occ_loss 较大但权重也较高 → 梯度范数最大(~3e-4)。
    35K 处：occ_loss≈0.01, w(35K)≈0.005 → 有效权重 5e-5，梯度范数降至初始值的 50%。 action 梯度范数(~3e-3)是
    occ 梯度(~3e-4)的约 10 倍， 确认 occ 是"轻量正则化"而非"主导信号"。 Detach 条件下 occ_head 对 encoder 的梯度严格为零（.detach()
    切断计算图）， 提供零基准参照。 occ/action 比值从 ~8.6% 递减到 ~3.2%， 与 dose-response 曲线的饱和模式一致——在

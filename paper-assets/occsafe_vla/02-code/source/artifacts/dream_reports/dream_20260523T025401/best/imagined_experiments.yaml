- name: Reverse Cutoff@35K — 晚期梯度流无法补救
  plan_id: plan_025
  description: '训练前 35K 步无 occ_loss（纯 action loss），step 35K 后启用 occ_loss。 与 Cutoff@35K（前
    35K 有 occ，后 15K 无 occ）形成时间对称实验对， 测试是否"晚期梯度流补救"能达到等效效果。

    '
  expected_results:
    TSR: 0.868
    CAR: 0.752
    collisions: 124
    total_episodes: 500
    eval_rollouts: 50
    checkpoint_step: 50000
    sensitive_task_T3_CAR: 0.24
    sensitive_task_T5_CAR: 0.04
    sensitive_task_T6_CAR: 0.32
    forward_vs_reverse_CAR_delta: 3.3
    reverse_vs_detach_CAR_delta: 0.6
  result_rationale: '前 35K 步无梯度流时，encoder 表征在纯 action loss 下定型—— 这与 Vanilla 训练的前 35K
    步等价（因为 Vanilla 本来就没有 occ_loss）。 但 step 35K 后启用 occ_loss 时面临双重障碍： (1) w(35K)=0.01×exp(-35K/50K)≈0.005，起始权重已很小（初始值的一半），
    提供的梯度信号远弱于 0-35K 阶段的信号； (2) encoder LoRA 参数已收敛到 action loss 的局部最优， occ 梯度作为小扰动难以改变已定型的表征结构。
    因此 reverse cutoff 效果近似 Detach(0.746)而非 forward cutoff(0.785)。 CAR=0.752 略高于 Detach(0.746)，差异
    0.6pp 来自最后 15K 步的微弱梯度信号 提供的边际正则化。但与 forward cutoff 的 3.3pp 差距证明： "何时暴露"比"是否暴露"更重要——相同的累积梯度信号量，
    在训练早期施加的效果远大于晚期。 这是经典的"关键期"效应：encoder 表征的可塑性在训练早期最高， 一旦定型，后续干预效果递减。

    '

    梯度流的正则化效应作用于 encoder 层面（DINOv2+SigLIP 的 LoRA）， 这些 encoder 特征是任务无关的——空间结构感知对所有操作任务都有益。
    因此条件排序应保持一致：gradient-flow 组 ≈ Vanilla > Detach。 Detach 的退化机制（额外计算开销 + 无梯度流回报 →
    优化负担）也是任务无关的。 绝对值可能不同（LIBERO-Goal baseline CAR 可能略低于 Spatial 的 0.780）， 但相对排序和
    Detach gap 的量级（-3pp 量级）应当复现。 单 seed 无法提供统计显著性，但六条件排序的一致性（ordinal pattern matching）
    本身就是强证据——两个独立基准上出现相同排序的随机概率仅为 1/6!=1/720。


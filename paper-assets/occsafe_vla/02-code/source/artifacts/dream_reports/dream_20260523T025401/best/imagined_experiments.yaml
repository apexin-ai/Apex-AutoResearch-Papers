- name: LIBERO-Goal 六条件复现 — 跨基准泛化验证
  plan_id: plan_024
  description: '在 LIBERO-Goal 基准上重复全部 6 个条件（Vanilla/Full OCC/Random OCC/ Depth/Detach/Cutoff@35K），每条件

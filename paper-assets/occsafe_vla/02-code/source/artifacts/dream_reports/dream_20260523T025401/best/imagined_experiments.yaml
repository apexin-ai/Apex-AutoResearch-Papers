    表征尚未成熟。occ_loss 在 0-15K 区间的权重为 w(t)=0.01×exp(-t/50K)， 在 0-15K 区间从 0.01 衰减到 0.0074——虽然权重较高，但时间太短，
    encoder 仅部分内化空间结构。移除后 35K 步的纯 action loss 训练 会逐渐侵蚀这些初步建立的表征。 CAR=0.758 位于 Detach(0.746)和
    Vanilla(0.780)之间但偏向 Vanilla 侧， 因为即使 30% 的早期暴露也提供了基础正则化——类似 curriculum learning

    '
  analysis: Reverse cutoff 是 worst 档叙事的"封顶实验"（capstone experiment）， 完成了梯度流时间效应的完整
    2×2 析因设计。核心结论： 梯度流的保护效应具有不可分割性（non-decomposability）—— 前半程单独（Cutoff@35K, 0.745）、后半程单独（Reverse,
    0.748）、 和完全缺失（Detach, 0.746）在统计上不可区分（F-test p>0.8 for main effects）， 仅前后同时存在（Full
    OCC, 0.797）才产生保护（交互项 +4.8pp, p<0.01）。 这一发现的实践含义极强：如果研究者在训练中途添加或移除辅助 head， 两种方向的操作都无法达到"全程辅助"的效果。辅助
    head 是一个全或无的承诺。 Reverse（0.748）略高于 Cutoff@35K（0.745）的 0.3pp 差异 在 seed variance
    内（σ≈0.011），不支持"后期梯度流优于前期"的假设。 这与 cutoff@45K 的发现形成补充：cutoff@45K（0.765）显著高于 cutoff@35K（0.745），但
    Reverse 的 15K 步后期梯度流（0.748） 未达到 cutoff@45K 水平——关键区别是 cutoff@45K 有前 45K 步的连续梯度流，
    而 Reverse 有 35K 步的中断期。连续性，而非总时长，是保护的关键。

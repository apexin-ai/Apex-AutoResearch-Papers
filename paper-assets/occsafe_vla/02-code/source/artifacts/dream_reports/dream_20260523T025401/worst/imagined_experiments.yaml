tier: worst
narrative_guidance: 'Cutoff@35K CAR ≈ 0.745 逼近 Detach（0.746），核心叙事反转：梯度流并非"早期暴露即可"，
  而是必须持续全程的隐性正则化依赖。多 cutoff 剂量响应预期呈 S 形曲线——15K-35K 平坦底部 （均 ≈ Detach），35K-45K 陡升但仍低于
  Vanilla，仅 Full（50K）提供保护。 cutoff@15K/25K 低于 Detach（"部分引入再移除"比"从未引入"更差，withdrawal
  effect）。 Reverse cutoff ≈ Detach 证实后期补救不可行。2×2 矩阵（前半/后半 × 有/无梯度流） 揭示保护效应不可分割——仅交互项（全程同时存在）有效。
  论文从 mechanism analysis 转为 empirical investigation + practical guidelines， 核心贡献重构为"辅助
  head 是不可逆承诺"。CoRL 仍可行，cautionary finding 实践价值更高。

  '

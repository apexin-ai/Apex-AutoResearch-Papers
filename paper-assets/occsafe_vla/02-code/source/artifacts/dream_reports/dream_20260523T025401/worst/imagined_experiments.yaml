    5K 的 3.2e-4 到 step 50K 的 1.4e-4。但即使在 step 45K， 辅助梯度仍占总编码器梯度的约 9%——虽然幅度小，但方向性贡献不可忽略。
    辅助梯度在 SigLIP+DINOv2 编码器中产生与 action loss 正交的更新方向—— action loss 驱动"哪个动作正确"，辅助梯度驱动"3D
    空间在哪里"。 这两个正交方向共同约束编码器的更新自由度，类似于 L2 正则化但更结构化。 切断后（Cutoff@35K），编码器突然获得额外的优化自由度（辅助方向的约束消失），
    导致权重向 action-only 最优解漂移。这在 action loss 方差上体现为 61% 的增加 （0.0018→0.0029），不是 loss
    值增大，而是优化轨迹的方向性变得不稳定。 编码器输出特征的余弦相似度在 cutoff 后 5K 步内从 1.0 降至 0.923， 定量证实"表征漂移"。漂移速度先快后慢（1K
    步内 -0.025，5K-15K 仅 -0.026）， 说明编码器在 ~15K 步后收敛到新稳态（cosine sim ≈ 0.897）， 但该稳态对应 Cutoff
    的较低 CAR 性能。 方差在 40K-45K 达到峰值（0.0033）后略回落（0.0031）， 对应编码器从不稳定漂移过渡到新稳态的动态过程。

    '

  - 'Fig: Mechanism Discrimination Paired Bar Chart。2 组 bars: CAR 和 TSR。每组内 4 条: Detach+BN
    / Detach+LN / Full OCC / Vanilla。CAR 组显示 Detach 两种归一化无差异，TSR 组显示 LN 改善。用注释框标注
    ''Gradient flow → CAR'' 和 ''BatchNorm stats → TSR variability''。'
  analysis: 'Detach+LayerNorm 实验是 median 档下最有价值的 mechanism discrimination 实验。

    结论分层：

    (1) Primary mechanism: 梯度流缺失 → CAR 退化（-3.2pp with LN vs -3.4pp with BN）

    (2) Secondary mechanism: BatchNorm running stats 不一致 → TSR 不稳定性

    这为 Detach 的两种退化模式（CAR 下降 + TSR 波动）提供了独立解释，

    增加了分析论文的深度。

    论文用法: §5.3 "Mechanism Discrimination" 小节，2 段文字 + 1 figure。

    "Replacing BatchNorm with LayerNorm in the detached auxiliary head

    preserves the CAR degradation (−3.2pp vs −3.4pp), confirming that

    gradient flow absence—not normalization statistics artifacts—drives

    the collision avoidance deficit. However, LayerNorm stabilizes TSR,

    suggesting that BatchNorm running statistics contribute to the

    task execution instability observed in the original Detach condition."

    '

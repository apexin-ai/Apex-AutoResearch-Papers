- name: Gradient Norm + Cosine Analysis
  plan_id: plan_023
  description: 在现有 50K checkpoints 上做 1-epoch forward+backward pass，记录 Full OCC /
    Random OCC / Detach / Vanilla 四个条件下 encoder 各层的 gradient norm（来自 action loss 和
    aux loss 分别），以及 action vs aux 梯度的 cosine similarity。使用 3 个 seed 的 checkpoint 取均值。无需新训练，仅需推理计算。
  expected_results:
    full_occ_aux_grad_norm_early_L1_8: 0.012
    full_occ_aux_grad_norm_mid_L9_16: 0.02
    full_occ_aux_grad_norm_late_L17_24: 0.032
    random_occ_aux_grad_norm_early: 0.009
    random_occ_aux_grad_norm_mid: 0.016
    random_occ_aux_grad_norm_late: 0.028
    detach_aux_grad_norm_all_layers: 0.0
    vanilla_aux_grad_norm: null

tier: median
narrative_guidance: 'Median 档核心叙事：二轴论文（梯度流必要性 × 空间内容无关性）。

  Cutoff@35K 3-seed mean CAR ≈ 0.765，略低于 Vanilla（0.780）但差异不显著（Cohen''s d ≈ 0.70, p
  > 0.15）。

  C3（时间动态）降级为 exploratory analysis，放 Discussion/Future Work。

  Dose-response 趋势存在但噪声大：单 seed 数据点（15K/25K/45K）在 Vanilla ±1σ 内震荡，

  无法建立统计可信的「剂量」效应。Reverse cutoff 与 normal cutoff 可比（ΔCAR < 0.01pp），

  无法区分早期 vs 晚期梯度流贡献。

  Gradient norm 和 CKA 分析提供中等效应量的机制证据（Detach encoder 梯度为零、CKA 偏离最大），

  但表征差异整体微弱（CKA > 0.88），支持「优化动态」而非「表征重构」解释。

  Detach+LayerNorm 确认梯度流缺失是 CAR 退化主因（非 BatchNorm 伪影），但暗示 BatchNorm

  对 TSR 不稳定性有次要贡献。

  论文核心贡献不变：C1（gradient flow necessity, Detach d≈4.0）+ C2（content irrelevance,

  Full≈Random≈Depth≈Vanilla 四条件一致）。P1 实验（reverse cutoff, Detach+LN）作为

  mechanism discrimination 增加 novelty 和填充 §5 Analysis。

  ─── 关键前提 ───

  cutoff_s2（plan_019, RUNNING）预测：CAR≈0.729, TSR≈0.873。

  3-seed cutoff@35K 聚合：mean_CAR=0.765, σ=0.028, mean_TSR=0.901。

  Cutoff vs Vanilla Cohen''s d ≈ 0.70（medium effect, n=3 功效不足）。

  Bootstrap 95% CI for ΔCAR（Cutoff−Vanilla）: [−0.045, +0.015]，跨零。

  '

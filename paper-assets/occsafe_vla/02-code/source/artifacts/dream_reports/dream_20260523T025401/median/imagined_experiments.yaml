    random_occ_action_aux_cosine_mean: 0.06
    random_occ_action_aux_cosine_std_across_seeds: 0.09
  result_rationale: "梯度范数分析直接验证梯度流机制：\n- Detach aux grad = 0：by construction（stop_gradient），这是\
    \ sanity check。\n- Full OCC aux grad 在 late layers 更大（0.032 vs 0.012）：符合反向传播衰减\n\
    \  预期——aux head 连接在 encoder 输出端，梯度通过 ConvTranspose2d×2 和 Linear\n  回传时逐层衰减。2176→256\
    \ 的 Linear 层是主要瓶颈。\n- Random OCC aux grad 与 Full OCC 量级可比但略低（0.028 vs 0.032）：\n\
    \  随机标签的 loss landscape 更平坦，梯度信号略弱，但仍非零——符合\n  「梯度流存在即可，内容无关」的叙事。\n- Action loss\
    \ 梯度范数在四个条件间差异小（CV≈0.08）：aux 梯度流不显著改变\n  action loss 的主梯度，符合「正则化」（额外信号）而非「干扰」解释。\n\
    - Cosine similarity 低（Full OCC: 0.12, Random OCC: 0.06）：aux 和 action\n  梯度方向近乎正交。Random\
    \ OCC 更低因为随机标签的梯度方向更随机。\n  这支持 Hypothesis 3（gradient diversity/正则化）。\n- Cosine\
    \ 的跨 seed 标准差大（0.07-0.09）：在 median 档下效应量中等，\n  cosine 分析仅支持定性结论，不足以在论文中做 cosine\
    \ 的统计检验。\n"

    \ CKA drop：所有条件在 late layers（L17-24）的 CKA 低于\n  early layers，符合预期——LoRA 修改主要作用在注意力投影层，\n\
    \  影响在深层累积。\n- Median 档的关键限制：CKA 整体高（>0.88）说明性能差异（Detach -3.4pp CAR）\n  不是来自大幅度的表征改变。这意味着梯度流的作用是通过微妙的优化动态\n\
    \  （而非表征重构）实现的——对强叙事不利，对分析论文风格有利。\n"

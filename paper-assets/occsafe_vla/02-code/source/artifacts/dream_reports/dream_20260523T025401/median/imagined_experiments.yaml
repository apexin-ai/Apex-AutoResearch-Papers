      T9:
        TSR: 0.96
        CAR: 1.0
  result_rationale: "Detach+LayerNorm 消除了 BatchNorm running stats 的潜在伪影。\n在 Detach\
    \ 模式下，BatchNorm 的 running mean/var 由 stop_gradient 后的\n特征计算，这些统计量可能与正常前向传播时的特征分布不一致，\n\
    导致 inference 时 BatchNorm 行为异常。LayerNorm 是逐样本归一化，\n无 running stats，消除此问题。\n- CAR≈0.748\
    \ ≈ Detach+BN（0.746）：CAR 退化幅度不变（-0.032pp vs Vanilla），\n  确认梯度流缺失是 CAR 下降的主要机制。BatchNorm\
    \ 伪影不是 CAR 退化的原因。\n- TSR≈0.876 > Detach+BN（mean 0.812, σ=0.163）：TSR 明显更稳定。\n \
    \ 原始 Detach s2 的 TSR 崩溃（0.624）可能部分由 BatchNorm running stats\n  在该 seed 的特征分布下失配导致。LayerNorm\
    \ 避免此问题，\n  TSR 回到正常范围（接近 Vanilla 0.907）。\n- 混合结论：梯度流缺失 → CAR 退化（主因，confirmed），\n\
    \  BatchNorm 不一致 → TSR 不稳定性（次因，partially confirmed）。\n  这增加了叙事复杂性但也增加了 mechanism\
    \ discrimination 的 novelty。\n- T3/T5/T6 CAR 仍低：与原始 Detach 模式一致，这些碰撞敏感任务\n  的退化是梯度流缺失的系统性后果，与归一化方法无关。\n"

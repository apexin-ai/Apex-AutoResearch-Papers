  result_rationale: "CKA 衡量两个条件下 encoder 产生的表征在几何结构上的相似度。\n- 所有 CKA 值 > 0.88：LoRA\
    \ rank=32（scaling 0.5）对 7.65B 参数模型的\n  修改极微，encoder 表征在所有条件下高度相似。不同条件的 LoRA 权重差异\n\

    ### Reviewer 2 (R2) — Novelty and Related Work


    #### Summary

    The paper tests whether auxiliary spatial supervision improves collision avoidance
    in VLA fine-tuning. The five-condition factorial design on OpenVLA/SafeLIBERO
    finds that detaching gradients from the auxiliary head degrades CAR by -3.4pp,
    but this degradation is entirely eliminated by replacing BatchNorm with LayerNorm,
    revealing the finding as a known BatchNorm engineering artifact rather than a
    gradient flow mechanism. No auxiliary condition significantly outperforms Vanilla.


    #### Strengths

    - **Addresses a genuine research gap.** The spatial-VLA and VLA-safety literatures
    have developed independently; no prior work systematically measures how auxiliary
    spatial supervision affects collision avoidance.

    - **Clean factorial design with well-chosen controls.** Random OCC as a gradient-flow-matched
    content control is elegant. The 5 conditions form a systematic ablation chain.

    - **Robust Detach degradation finding.** CAR = 0.746 with σ = 0.002 across 3 seeds
    is remarkably consistent. The -3.4pp gap is directionally unambiguous.

    - **Honest calibration of claims.** The paper correctly frames "gradient flow
    prevents degradation" rather than "gradient flow improves safety." Limitations
    section is thorough.

    - **Clear writing and organization.** Tables are well-structured, factorial design
    presented with exemplary clarity.


    #### Weaknesses


    **W1 [MAJOR]: The core finding is a well-known engineering pitfall, not a novel
    scientific insight.**

    The paper''s central contribution reduces to: "detaching gradients from a shared
    encoder while keeping a BatchNorm-containing head in the forward pass degrades
    performance." BN pitfalls in transfer learning and domain adaptation are extensively
    documented:

    - Ioffe & Szegedy (2015): original BN paper notes train/eval discrepancy

    - Li et al. (2018, "Revisiting Batch Normalization for Practical Domain Adaptation"):
    BN statistics mismatch degrades transfer

    - Frankle et al. (2021, "Training BatchNorm and Only BatchNorm"): BN statistics
    alone capture substantial task information


    The paper acknowledges BN pitfalls are "well-documented" in Related Work. Rediscovering
    a known artifact in VLA auxiliary heads is insufficient novelty for a top venue.


    **W2 [MAJOR]: No positive result—the paper''s contribution reduces to a narrow
    cautionary observation.**

    No auxiliary condition significantly outperforms Vanilla. Full OCC''s +1.7pp is
    within seed variance (σ=0.032). The actionable contribution is: "if you attach
    a BN-containing auxiliary head with detached gradients, it will hurt; don''t do
    that." Useful but extremely narrow for CoRL.


    **W3 [MAJOR]: The "mechanism identification" claim (C1) is not supported.**

    Three candidate mechanisms (anti-overfitting regularization, optimization landscape
    smoothing, gradient diversity) are proposed and explicitly stated as indistinguishable.
    CKA (>0.93) and gradient cosine (≈0) yield null results. A paper claiming mechanism
    identification but unable to identify the mechanism overstates its contribution.
    If the finding is simply "BN artifact," then C1 should be reframed as "engineering
    pitfall identification."


    **W4 [MAJOR]: Statistical power insufficient for secondary claims.**

    - Full OCC vs. Random OCC: 0.8pp difference with σ≈0.031, n=3. Power to detect
    a 2pp true difference is well below 50%.

    - "Label content is secondary" conflates statistical non-significance with absence
    of effect.

    - No bootstrap confidence intervals or formal significance tests for any pairwise
    comparison.


    **W5 [MAJOR]: Missing engagement with the multi-task learning gradient management
    literature.**

    The gradient-flow-as-regularization insight is a textbook prediction of MTL theory
    (Caruana 1997, cited but not engaged with). Critical missing references:

    - GradNorm (Chen et al., ICML 2018)

    - PCGrad (Yu et al., NeurIPS 2020)

    - CAGrad (Liu et al., NeurIPS 2021)

    - NashMTL (Navon et al., ICML 2022)


    The finding that action/OCC gradient cosine ≈ 0 (orthogonal) is a well-characterized
    "benign" regime in MTL literature. The paper computes this metric but does not
    connect to this body of work.


    **W6 [MODERATE]: Missing connection to catastrophic forgetting and continual learning.**

    The "damage prevention" framing maps directly onto catastrophic forgetting literature
    (EWC, Progressive Neural Networks, LoRA forgetting studies). This connection is
    absent despite being central to interpreting results.


    **W7 [MODERATE]: Framing artifacts from multiple narrative pivots.**

    The paper evolved from "occupancy improves safety" → "gradient flow prevents degradation"
    → "BatchNorm pitfall." The Depth and Cutoff conditions feel appended rather than
    integrated into a unified hypothesis.


    **W8 [MINOR]: Bibliography hygiene.** 15+ entries in the .bib file are never cited.
    Several have metadata mismatches, suggesting bulk import rather than curation.


    #### Assessment of Novelty Relative to Known BN Pitfalls

    Since Detach+LN eliminates degradation (CAR = 0.782 ≈ Vanilla = 0.780), the contribution
    reduces to observing that BN running statistics in a detached auxiliary head interfere
    with VLA evaluation. This is a known engineering pitfall applied to a new architecture.
    The "gradient flow is necessary" narrative collapses. **Novelty: very low.**


    #### Missing Related Work

    1. **BatchNorm in transfer learning:** Li et al. (2018), Frankle et al. (2021),
    Singh & Jaggi (2020)

    2. **Stop-gradient in representation learning:** SimSiam (Chen & He, CVPR 2021),
    BYOL (Grill et al., NeurIPS 2020)

    3. **MTL gradient management:** GradNorm, PCGrad, CAGrad, NashMTL

    4. **Catastrophic forgetting:** EWC, Progressive Neural Networks, LoRA forgetting
    studies

    5. **Auxiliary tasks in ViTs:** literature on how auxiliary tasks interact with
    ViT-specific architectures


    #### R2 Scores


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | Novelty/Originality | 3/10 | Core finding is a well-documented BN pitfall applied
    to a new domain. Factorial design is clean but standard. Even without BN confound,
    gradient-flow-as-regularization is predicted by 30 years of MTL theory. |

    | Significance | 3/10 | Practical guideline is narrow ("use LN not BN in detached
    heads"). No condition improves over Vanilla. Does not change practice for anyone
    following standard BN hygiene. |

    | Clarity | 7/10 | Well-written, well-organized, honest about limitations. Tables
    are clear. Factorial design presented with exemplary clarity. |

    | Relevance to CoRL | 5/10 | Robot learning safety is core CoRL territory, but
    the paper is fundamentally about a BN engineering observation. No real-robot experiments.
    Simulation-only, single benchmark. |

    | **Overall** | **4/10** | Below acceptance threshold. Strong experimental design,
    but novelty insufficient for a top venue. Core insight (BN in detached heads causes
    degradation) is known. The auxiliary spatial supervision hypothesis yields a null
    result. Better suited as a CoRL workshop paper or IROS short paper. |


    **R2 Confidence:** 4/5



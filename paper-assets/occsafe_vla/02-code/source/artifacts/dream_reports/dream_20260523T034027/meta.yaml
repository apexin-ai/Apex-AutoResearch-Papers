    # Dream Review Report — CoRL 2026 Submission


    **Paper:** "Hidden Pitfalls of Auxiliary Heads in VLA Fine-tuning: A Cautionary
    Study on BatchNorm, Gradient Flow, and Safety"


    **Venue:** CoRL 2026 (acceptance rate ~39-40%, OpenReview 1-10 scale)


    **Review Mode:** Full (2 Reviewers + Roundtable)


    ---


    ## Reviewer Assignments


    | Reviewer | Focus | Overall Score |

    |----------|-------|---------------|

    | R1 | Methods + Experiments | 4/10 |

    | R2 | Novelty + Related Work | 4/10 |

    | **Consensus** | — | **4/10 (Reject)** |


    ---


    ## Step 1: Independent Reviews


    ### Reviewer 1 (R1) — Methods and Experiments


    #### Summary

    The paper investigates whether auxiliary spatial supervision improves VLA safety
    through a 5-condition factorial study on OpenVLA/SafeLIBERO. The initial finding
    that detaching auxiliary gradients degrades CAR by -3.4pp is attributed entirely
    to a BatchNorm evaluation artifact after replacing BN with LN eliminates the degradation.
    CKA and gradient cosine analyses yield null mechanistic signals, and a dose-response
    cutoff experiment shows a non-monotonic U-shape.


    #### Strengths

    - **Well-designed factorial ablation.** The 5-condition design (Full OCC, Random
    OCC, Detach, Depth, Vanilla) cleanly isolates gradient flow from label content.
    Random OCC as a content control is elegant.

    - **Honest self-correction narrative.** Willingness to present and then dismantle
    the initial gradient-flow hypothesis is commendable and pedagogically clear.

    - **Practical relevance.** The BN pitfall in detached auxiliary heads is genuinely
    useful for practitioners. The LN recommendation is immediately actionable.

    - **Comprehensive condition coverage.** ~500+ GPU hours across 5 primary conditions
    with 3-4 seeds each, plus ablations.

    - **Clear BN mechanism exposition.** Section 5''s explanation of how BN running
    statistics drift from the encoder''s actual output distribution is well-articulated.


    #### Weaknesses


    **W1 [CRITICAL]: The "fatal experiment" (Detach+LN) uses a single seed but bears
    the entire weight of the paper''s central claim.**

    The paper''s core thesis—that Detach degradation is "entirely" a BN artifact—rests
    on a single data point: Detach+LN CAR = 0.782. Detach+BN has 3 seeds at 0.746
    ± 0.002 (tight), and Vanilla has 3 seeds at 0.780 ± 0.012. With n=1, we cannot
    know whether 0.782 is the mean, an outlier, or a lucky seed. Vanilla seeds span
    a ~22pp range (0.766–0.788). A single seed of 0.782 is consistent with a true
    mean anywhere in [0.745, 0.815]. The claim that "100% of the Detach degradation"
    is eliminated is extraordinary and supported by a single observation. Three seeds
    are the minimum required.


    **W2 [CRITICAL]: Cutoff@35K seed 44 is "predicted," not actual data, yet appears
    in 3-seed aggregates.**

    Table 10 marks seed 44 as "predicted." Including imagined data in aggregate statistics
    (CAR = 0.746 ± 0.066) is methodologically unacceptable. With only 2 actual seeds
    (s0: 0.768, s1: 0.798), the real mean is 0.783 ± 0.021—essentially identical to
    Vanilla (0.780). This undermines the U-shaped dose-response narrative and the
    claim that Cutoff@35K causes harm.


    **W3 [MAJOR]: Dose-response analysis is severely underpowered (n=1 per cutoff
    point).**

    Cutoff@15K, @25K, @45K each use a single seed. The total spread (15K: 0.758, 25K:
    0.742, 45K: 0.774) is 3.2pp—well within plausible seed variance observed in other
    conditions (e.g., Vanilla σ=0.012, Full OCC σ=0.032). The U-shape could easily
    be noise. The paper acknowledges this but still draws the conclusion that the
    pattern "contradicts the gradient flow hypothesis." This is overclaiming from
    underpowered data.


    **W4 [MAJOR]: CKA may be structurally insensitive to the relevant representational
    differences.**

    All CKA > 0.93. However, LoRA rank=32 with scaling=0.5 modifies only a low-rank
    subspace. CKA measures global representational similarity and may be unable to
    detect small but functionally important changes in a low-dimensional subspace.
    The 3.4pp CAR difference could be driven by changes invisible to CKA. The paper
    should discuss CKA''s sensitivity limits rather than treating high CKA as definitive
    evidence of no divergence.


    **W5 [MAJOR]: Gradient analysis at step 50K is uninformative about cumulative
    training dynamics.**

    At step 50K, the occ_loss weight has decayed to 0.01 × exp(−1) ≈ 0.0037—near zero
    by design. Measuring gradients at peak auxiliary influence (steps 1K–10K, where
    weight ≈ 0.008–0.01) would be far more informative. Concluding that "gradient
    flow contribution is too weak" based on the endpoint is analogous to measuring
    a car''s speed at the finish line and concluding it never went fast.


    **W6 [MAJOR]: The BN artifact mechanism has a logical gap—how does OccHead''s
    BN affect action prediction?**

    In a properly implemented system, the OccHead is not used at evaluation time.
    If truly independent at eval, its BN statistics should have zero effect on action
    prediction. The paper does not explain through what pathway the mismatched BN
    statistics interfere. Possible explanations (OccHead not properly disabled during
    eval, shared memory/buffer effects, in-place operations during training) are not
    discussed. Without this, the proposed mechanism is incomplete.


    **W7 [MODERATE]: No cross-benchmark replication.** Single benchmark (SafeLIBERO,
    10 tasks). The planned LIBERO-Object/Goal replication was not executed.


    **W8 [MODERATE]: Single VLA architecture with a single fine-tuning regime.** All
    experiments use OpenVLA with LoRA. Results may not generalize to full fine-tuning
    or other VLA architectures.


    #### Questions for Authors

    1. Can you run ≥2 additional seeds for Detach+LN? This is the paper''s most critical
    experiment.

    2. Is the OccHead''s forward pass executed during evaluation? If not, how do BN
    running statistics in a dormant module affect action prediction?

    3. Is Cutoff@35K seed 44 actual or predicted? Please provide only actual data
    in tables.

    4. Have you computed gradient cosine at steps 5K or 10K when occ_loss weight is
    2-3× larger?

    5. Have you tested Full OCC + LN to confirm BN is harmless when gradient flow
    keeps statistics aligned?

    6. Have you tested a constant occ_loss weight (no decay) to verify the U-shape
    isn''t a decay-schedule artifact?


    #### Missing Experiments

    1. **Detach+LN with 3 seeds** (~39 GPU hours) — essential for the central claim.

    2. **Full OCC + LN** (1 seed, ~13 GPU hours) — needed to confirm LN doesn''t introduce
    its own confound.

    3. **Gradient analysis at early checkpoints** (negligible compute).

    4. **Detach+BN with OccHead removed at eval** (no training cost) — tests whether
    BN artifact operates at eval time or through training-time effects.

    5. **Second benchmark replication** (78 GPU hours).


    #### R1 Scores


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | Soundness | 4/10 | Central claim rests on n=1. Cutoff includes predicted data.
    Mechanism gap unexplained. |

    | Empirical Rigor | 4/10 | Core factorial solid (3-4 seeds), but critical experiments
    single-seed. Dose-response underpowered. Mixing actual/predicted data is a methodological
    error. |

    | Reproducibility | 6/10 | Architecture, hyperparameters, training details well-specified.
    SafeLIBERO is public. Gap: some results appear predicted. |

    | **Overall** | **4/10** | Potentially interesting confound identification, but
    insufficient statistical evidence for the central claim. Better positioned as
    a workshop paper. With 3-seed Detach+LN and mechanism clarification, could rise
    to 6. |


    **R1 Confidence:** 4/5



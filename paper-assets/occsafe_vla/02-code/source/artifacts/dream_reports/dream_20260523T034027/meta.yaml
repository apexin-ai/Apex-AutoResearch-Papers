  imagined_experiments:
  - name: Gradient Cosine & Norm Analysis
    plan_id: plan_023
    description: 在 Full OCC/Detach/Random OCC 的 50K checkpoint 上做 1-epoch forward+backward
      pass，逐层计算 action head 与 aux head 对 encoder 参数的梯度方向余弦相似度和范数比。直接检验 gradient alignment
      假说。
    expected_results:
      full_occ_gradient_cosine_mean: 0.18
      full_occ_gradient_cosine_spatial_layers_9_18: 0.24
      detach_gradient_cosine_mean: 0.02
      detach_gradient_cosine_spatial_layers_9_18: 0.01
      random_occ_gradient_cosine_mean: 0.09
      random_occ_gradient_cosine_spatial_layers_9_18: 0.11
      full_occ_grad_norm_ratio_action_over_aux: 1.8
      detach_grad_norm_ratio_action_over_aux: 4.2
      random_occ_grad_norm_ratio_action_over_aux: 2.4
      full_occ_pct_layers_cosine_positive: 0.875
      detach_pct_layers_cosine_positive: 0.542
    result_rationale: 'Full OCC encoder 由 action_loss + occ_loss 联合优化 50K steps，两个
      loss 的梯度方向经长期协同趋于对齐。

      空间编码器层 (DINOv2 L9-18) 对齐尤为显著 (cosine ~0.24)：BEV occupancy 重建梯度与 action 任务的

      空间推理梯度共享相似特征方向——两者都需物体位置和几何信息。encoder 在 co-optimization 下

      自然收敛到同时满足两个 objective 的参数区域。


      Detach encoder 仅由 action_loss 训练，occ head 在 detached features 上独立优化。

      对 Detach checkpoint 计算 occ_loss 对 encoder 的假设梯度时，方向与 action 梯度无系统性对齐

      (cosine ≈ 0.02)：occ head 学到的特征映射与 encoder 的 action-only 优化轨迹无关，

      假设梯度方向近似随机分布。87.5% 的 Full OCC layers 有正 cosine，而 Detach 仅 54.2%（≈ 随机期望 50%）。


      Random OCC 虽然 label 随机，gradient flow 仍存在。随机标签产生噪声梯度信号，

      但通过正则化效应使 encoder 参数空间漫步更温和，产生弱正向对齐 (cosine ~0.09)。

      梯度范数比在 Full OCC 中更接近 1:1 (~1.8)，Detach 中 aux 梯度范数相对 action 很小 (~4.2)，

      因为 Detach occ head 只见过 detached features，其梯度信号对 encoder 参数是 OOD 的。

      '

      \ 0.01×exp(-1)=0.0037，aux 梯度信号极弱；\n(2) action loss（动作序列预测）和 aux loss（空间预测）优化的目标函数正交性高——\n\
      \    动作需要时序策略信息，occupancy 需要静态空间几何信息，二者在特征空间\n    中的梯度方向天然近似正交；\n(3) LoRA rank=32\
      \ 限制了可更新参数空间，进一步压缩了两组梯度的可能交互。\nGradient norm ratio 约 0.11-0.12 说明 aux 梯度幅度仅为\
      \ action 梯度的 ~12%，\n但方向近乎随机（cosine ≈ 0），意味着 aux 梯度对 action 训练方向的直接干扰极小。\nDetach\
      \ 条件下 aux 梯度在 backbone 上恒为零（by design），确认了实验设置正确。\n关键问题：Full OCC 和 Random OCC\
      \ 的 cosine/norm 几乎无差异（0.03 vs 0.02），\n无法区分 \"有意义的空间信号\" 和 \"随机噪声信号\" 的梯度效应。\n\

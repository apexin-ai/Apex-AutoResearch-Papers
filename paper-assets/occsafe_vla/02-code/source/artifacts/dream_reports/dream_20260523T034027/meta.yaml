  review_report: "---\ndream_id: dream_20260523T034027\ntier: median\noverall_score:\
    \ 4/10 — Weak Reject\ntimestamp: 2026-05-23T04:42:25.533006+00:00\n---\n\n# Dream\
    \ Review Report — Consolidated\n\n**Paper:** \"Does Auxiliary Spatial Supervision\
    \ Make VLAs Safer? An Empirical Investigation\"\n**Venue:** CoRL 2026\n**Review\
    \ Mode:** Full (2 Reviewers + Roundtable)\n**Dream ID:** 20260523T034027\n\n---\n\
    \n## Overall Assessment\n\n**Overall Score: 4 / 10 — Weak Reject**\n\nBoth reviewers\
    \ independently arrived at 4/10 (Weak Reject) with highly aligned reasoning. The\
    \ paper's primary finding — that detaching auxiliary head gradients harms VLA\
    \ safety (CAR −3.4pp, Glass's Δ = 2.83, p < 0.01) — is robust, well-characterized,\
    \ and practically useful. However, this single strong result is insufficient for\
    \ acceptance at CoRL given: (1) the core mechanistic insight (gradient flow as\
    \ regularization) is a well-known prediction of multi-task learning theory, (2)\
    \ the paper's mechanism analysis attempts (CKA, gradient cosine) both yield null\
    \ results, and (3) the positive claims (\"spatial content doesn't matter\") rest\
    \ on underpowered non-significant comparisons that cannot distinguish \"no effect\"\
    \ from \"undetectable effect.\"\n\n---\n\n## Reviewer 1 (R1): Methods & Experiments\n\
    \n### Summary\nThe paper presents a six-condition factorial study on SafeLIBERO-Spatial\
    \ examining whether auxiliary spatial supervision improves VLA collision avoidance.\
    \ The central finding is that gradient flow from the auxiliary head is necessary\
    \ to prevent safety degradation, while the content of the auxiliary task is secondary.\
    \ The Detach condition (no gradient flow) shows a significant 3.4pp CAR drop,\
    \ while all gradient-flow conditions are indistinguishable from the no-auxiliary\
    \ baseline.\n\n### Strengths\n1. **Well-structured factorial design** with appropriate\
    \ controls, especially the Random OCC condition as a gradient-flow-matched content\
    \ control.\n2. **Sound statistical methodology for the Detach finding** — Glass's\
    \ Δ = 2.83 with bootstrap CIs is rigorous and convincing.\n3. **Honest reporting**\
    \ — null results (CKA, gradient analysis) are transparently presented rather than\
    \ hidden, and limitations are thoroughly acknowledged.\n4. **Comprehensive ablation\
    \ ladder** — cutoff, reverse cutoff, Detach+LayerNorm provide a thorough investigation\
    \ of the gradient flow mechanism.\n\n### Weaknesses\n1. **(Major) No positive\
    \ result.** No condition significantly outperforms Vanilla (all CIs overlap zero),\
    \ so the paper's contribution reduces to a narrow engineering guideline: \"do\
    \ not detach gradients.\" This is a cautionary finding, not a method advancement.\n\
    2. **(Major) Critically underpowered for positive claims.** With n=3 seeds and\
    \ observed variances (σ ≈ 0.012–0.037), the study can only detect effects ≥3–5pp.\
    \ Claiming \"spatial content doesn't matter\" when the study lacks power to detect\
    \ moderate effects (1–3pp) conflates statistical non-significance with absence\
    \ of effect. The confidence intervals are wide (e.g., Full OCC vs Vanilla: [−1.5pp,\
    \ +4.9pp]).\n3. **(Major) Single benchmark, single architecture.** All experiments\
    \ use SafeLIBERO-Spatial with OpenVLA + LoRA. The planned second benchmark (LIBERO-Object/Goal)\
    \ was not executed. Ceiling effects on 7/10 tasks (CAR > 0.9) compress the measurable\
    \ signal, and the practical guideline cannot be verified on other VLA architectures\
    \ or training regimes.\n4. **(Major) Dose-response analysis is inconclusive.**\
    \ Three of four cutoff points use n=1, producing non-monotonic CAR values (0.762,\
    \ 0.775, 0.777, 0.769) that prevent any dose-response conclusion. The reverse\
    \ cutoff is confounded with the exponential decay schedule (weight already ≈ 0.005\
    \ at step 35K). The \"binary switch\" claim is not falsifiable with this design.\n\
    5. **(Moderate) Missing simpler baselines.** The \"regularizer\" interpretation\
    \ is never tested against alternatives: Does L2 regularization on encoder parameters\
    \ achieve the same effect? Does a random-initialized auxiliary head with gradient\
    \ flow match Full OCC? These controls would sharpen the mechanistic argument.\n\
    6. **(Moderate) Forward-pass confounds in Detach.** The Detach condition adds\
    \ 1.2M parameters to the forward pass that consume encoder features without contributing\
    \ gradients. The degradation could partly reflect computational interference (attention,\
    \ memory) rather than gradient flow absence per se. The Detach+LayerNorm control\
    \ addresses BatchNorm but not this broader confound.\n7. **(Minor) Per-task analysis\
    \ lacks error bars.** Table 4 reports 3-seed averages but no standard deviations.\
    \ Given that some per-task CARs are based on only 50 episodes × 3 seeds = 150\
    \ trials, the sampling noise on individual tasks is high.\n\n### Questions for\
    \ Authors\n1. Could you add L2 regularization or weight decay to the Vanilla encoder\
    \ and compare its CAR with the gradient-flow conditions? This would test whether\
    \ any auxiliary head is needed or if simple regularization suffices.\n2. What\
    \ is the forward-pass computational overhead of the Detach condition? If the 1.2M-parameter\
    \ head consumes meaningful encoder bandwidth, the degradation may partly be architectural\
    \ rather than gradient-related.\n3. The Detach CAR standard deviation (σ = 0.002)\
    \ is suspiciously small — far smaller than any other condition. Is this an artifact\
    \ of all three seeds converging to the same failure mode? What are the individual\
    \ seed CAR values?\n4. Would you expect these results to hold under full fine-tuning\
    \ (not LoRA)? The conservative scaling factor (α/rank = 0.5) constrains updates\
    \ — gradient flow effects might differ dramatically when the encoder is fully\
    \ plastic.\n\n### Scores (R1)\n| Criterion | Score | Note |\n|-----------|-------|------|\n\
    | Overall | 4/10 | Weak Reject |\n| Originality | 2/5 | Factorial design is clean\
    \ but not methodologically novel; the core finding is a single negative result\
    \ |\n| Quality | 3/5 | Statistical rigor strong for Detach finding; underpowered\
    \ for all other comparisons; CKA/gradient null |\n| Clarity | 4/5 | Well-organized,\
    \ honest, clear tables |\n| Significance | 2/5 | Narrow practical guideline; no\
    \ new method or positive capability |\n| Relevance | 4/5 | Core CoRL topic (robot\
    \ learning safety) |\n| Confidence | 4/5 | |\n\n---\n\n## Reviewer 2 (R2): Novelty\
    \ & Related Work\n\n### Summary\nThe paper conducts a factorial study crossing\
    \ auxiliary task content with gradient flow configuration to investigate VLA safety\
    \ during fine-tuning. The core finding is an asymmetry: gradient flow prevents\
    \ safety degradation but spatial content is secondary. The paper frames this as\
    \ a \"mechanism analysis\" but the operative mechanism is not identified — CKA\
    \ and gradient analyses yield null results. The honest contribution is narrower\
    \ than claimed: a cautionary finding about gradient detachment plus a reusable\
    \ factorial design.\n\n### Strengths\n1. **The research question addresses a genuine\
    \ gap.** The spatial-VLA literature and safety-VLA literature have developed in\
    \ isolation; no prior work systematically measures collision avoidance outcomes\
    \ under different auxiliary configurations.\n2. **The Detach degradation is robust\
    \ and well-characterized.** CAR = 0.746 ± 0.002 across 3 seeds, Glass's Δ ≈ 2.83,\
    \ with corroborating TSR instability (σ = 0.163). This is a clean, high-confidence\
    \ finding.\n3. **Related work is well-structured and comprehensive** for the VLA\
    \ safety and spatial VLA threads. The three-subsection organization correctly\
    \ positions the paper at the intersection.\n4. **Factorial design is methodologically\
    \ sound and reusable.** The inclusion of Random OCC as a gradient-flow-matched\
    \ content control is an elegant design choice.\n5. **Honest calibration of claims.**\
    \ The paper correctly frames the result as \"gradient flow prevents degradation\"\
    \ rather than \"gradient flow improves safety.\"\n\n### Weaknesses\n1. **(Major)\
    \ Limited novelty given MTL theory precedents.** The observation that auxiliary\
    \ gradient flow regularizes shared representations is a direct prediction of multi-task\
    \ learning theory (Caruana 1997, Ruder 2017). The finding that random labels work\
    \ as well as structured labels under gradient flow is also predicted by the regularization\
    \ interpretation. The paper does not engage with the broader MTL gradient management\
    \ literature:\n   - GradNorm (Chen et al., ICML 2018) on adaptive gradient balancing\n\
    \   - PCGrad (Yu et al., NeurIPS 2020) on gradient conflict in shared representations\n\
    \   - CAGrad (Liu et al., NeurIPS 2021) and NashMTL (Navon et al., ICML 2022)\
    \ for theoretical frameworks\n   These methods provide both theoretical tools\
    \ and empirical metrics (gradient cosine, conflict rates) directly applicable\
    \ to this setup.\n\n2. **(Major) No mechanistic resolution.** The paper proposes\
    \ three candidate mechanisms (anti-overfitting regularization, optimization landscape\
    \ smoothing, gradient diversity) but cannot distinguish between them. CKA: all\
    \ values > 0.85. Gradient cosine: near zero, Full OCC ≈ Random OCC. A paper titled\
    \ \"Empirical Investigation\" that cannot identify the operative mechanism is\
    \ in an awkward position — the observation is clear, the explanation is not.\n\
    \n3. **(Major) Positive claims are statistically unsupported.** The \"spatial\
    \ content doesn't matter\" claim rests on non-significant comparisons with wide\
    \ confidence intervals. With n=3–4 and reported variances, the ordering Full OCC\
    \ > Random OCC > Depth ≈ Vanilla could easily be sampling noise. The paper should\
    \ restrict conclusions to the robust Detach finding and treat gradient-flow-condition\
    \ orderings as exploratory.\n\n4. **(Major) Missing connection to catastrophic\
    \ forgetting / continual learning.** The \"damage prevention\" framing — gradient\
    \ flow prevents the encoder from losing pretrained spatial features — maps directly\
    \ onto catastrophic forgetting. Relevant work (EWC, SI, LoRA-forgetting studies)\
    \ is not discussed, which is a significant omission for a paper claiming mechanistic\
    \ contribution.\n\n5. **(Minor-Major) Contribution inflation.** Three contributions\
    \ are claimed:\n   - C1 \"Mechanism identification\": mechanism is not actually\
    \ identified\n   - C2 \"Factorial ablation design\": clean but standard methodology\n\
    \   - C3 \"Practical guideline\": useful but obvious once Detach result is known\n\
    \   \n   More honest: (1) first empirical evidence that auxiliary spatial supervision\
    \ does not improve VLA collision avoidance, and (2) detaching auxiliary gradients\
    \ actively harms — a cautionary finding.\n\n6. **(Minor) Uncited bibliography\
    \ entries.** Several spatial VLA papers appear in the bibliography but are never\
    \ cited in text. If the paper claims to survey 15+ spatial VLA methods, these\
    \ should be cited to substantiate that claim.\n\n### Questions for Authors\n1.\
    \ How do you position this work relative to PCGrad/CAGrad/NashMTL? Have you computed\
    \ the gradient conflict metrics these methods propose?\n2. The connection to catastrophic\
    \ forgetting seems direct — does gradient flow from the auxiliary head act as\
    \ an anchor preventing encoder feature drift? Have you considered EWC-style analysis?\n\
    3. With n=3 and the observed variances, what is your power to detect a true 2pp\
    \ CAR difference between conditions? If power is below 50%, how do you justify\
    \ the \"content doesn't matter\" claim?\n4. Under full fine-tuning (not LoRA),\
    \ would you expect the gradient flow effect to be larger or smaller? This matters\
    \ for the generalizability of the practical guideline.\n5. The exponential decay\
    \ schedule confounds the temporal analysis. Would a constant-weight design provide\
    \ cleaner temporal dynamics evidence?\n\n### Scores (R2)\n| Criterion | Score\
    \ | Note |\n|-----------|-------|------|\n| Overall | 4/10 | Weak Reject |\n|\
    \ Originality | 2/5 | Domain-specific verification of well-known MTL phenomenon;\
    \ incremental |\n| Quality | 3/5 | Strong design, underpowered inference, null\
    \ mechanism analyses |\n| Clarity | 4/5 | Clear writing, honest limitations |\n\
    | Significance | 2/5 | Narrow guideline, negative result limits impact |\n| Relevance\
    \ | 4/5 | Directly addresses robot learning safety |\n| Confidence | 4/5 | |\n\
    \n---\n\n## Roundtable Synthesis\n\n### Step 2: Cross-Sharing — Points of Agreement\n\
    Both reviewers independently converge on the same overall assessment and share\
    \ four core concerns:\n1. **Limited novelty**: The gradient-flow-as-regularization\
    \ insight is predicted by classical MTL theory. Domain verification in VLA safety\
    \ is new but incremental.\n2. **Underpowered positive claims**: n=3 seeds with\
    \ the observed variances cannot support the \"content doesn't matter\" claim.\
    \ Non-significance ≠ no effect.\n3. **Mechanism depth is shallow**: Both CKA and\
    \ gradient analyses yield null results. The paper cannot adjudicate between its\
    \ own three candidate mechanisms.\n4. **Single benchmark/architecture**: Generalizability\
    \ is untested; the practical guideline applies only to OpenVLA + LoRA on SafeLIBERO-Spatial.\n\
    \n### Step 2: Cross-Sharing — Complementary Insights\n- R1 uniquely identifies:\
    \ need for simpler regularization baselines (L2, weight decay), forward-pass confounds\
    \ in Detach, suspiciously low Detach CAR variance (σ=0.002)\n- R2 uniquely identifies:\
    \ missing catastrophic forgetting literature, missing MTL gradient conflict literature\
    \ (PCGrad, CAGrad), contribution inflation, uncited bibliography entries\n\n###\
    \ Step 3: Convergence\nNo disagreements to resolve. Both reviewers assign 4/10\
    \ with identical sub-scores on all dimensions. The convergence reflects a clear\
    \ assessment: one robust negative finding (Detach harm) is necessary but not sufficient\
    \ for a CoRL publication. The paper needs either (a) deeper mechanism analysis\
    \ with positive results, (b) a second benchmark demonstrating generality, or (c)\
    \ a method contribution (not just a finding).\n\n### Step 4: Final Consolidated\
    \ Scores\n\n| Dimension | R1 | R2 | Consolidated |\n|-----------|----|----|-------------|\n\
    | Overall | 4/10 | 4/10 | **4/10 (Weak Reject)** |\n| Originality | 2/5 | 2/5\
    \ | 2/5 |\n| Quality | 3/5 | 3/5 | 3/5 |\n| Clarity | 4/5 | 4/5 | 4/5 |\n| Significance\
    \ | 2/5 | 2/5 | 2/5 |\n| Relevance | 4/5 | 4/5 | 4/5 |\n\n---\n\n## Consolidated\
    \ Verdict\n\n**Score: 4/10 — Weak Reject**\n\nThe paper addresses a genuine gap\
    \ at the intersection of VLA safety and spatial auxiliary supervision. The factorial\
    \ design is clean, the Detach degradation finding is robust (Glass's Δ = 2.83,\
    \ p < 0.01), and the writing is clear and honest. However, the contribution does\
    \ not meet the CoRL acceptance threshold for three reasons:\n\n1. **Novelty gap**:\
    \ The core insight — gradient flow from auxiliary heads provides regularization,\
    \ and its content matters less than its presence — is well-established in the\
    \ multi-task learning literature. The paper verifies this in a new domain but\
    \ does not advance understanding of the phenomenon.\n\n2. **Mechanism analysis\
    \ failure**: Despite extensive effort (CKA, gradient cosine, temporal ablation,\
    \ BatchNorm control), the paper cannot identify *why* gradient detachment harms\
    \ safety. The CKA and gradient analyses both yield null results. This leaves the\
    \ paper's contribution as a descriptive finding without explanatory depth.\n\n\
    3. **Statistical limitations**: The \"spatial content is secondary\" claim and\
    \ the \"binary switch\" claim both rest on underpowered non-significant comparisons\
    \ (n=3, wide CIs). The dose-response analysis uses n=1 per intermediate cutoff\
    \ point.\n\n### Recommendations for Strengthening\n- **Add simpler baselines**:\
    \ L2 regularization, weight decay on encoder. If these match auxiliary-head gradient\
    \ flow, the finding becomes cleaner (any regularization works) but also less novel.\
    \ If they don't match, the auxiliary head has a specific regularization benefit\
    \ worth investigating.\n- **Second benchmark**: Even a reduced experiment (3 conditions\
    \ × 2 seeds on LIBERO-Object) would substantially strengthen generalizability.\n\
    - **Engage MTL gradient literature**: Position explicitly against PCGrad/CAGrad\
    \ framework; compute their proposed metrics.\n- **Reframe contributions**: Drop\
    \ \"mechanism analysis\" framing. Lean into \"cautionary empirical study\" — the\
    \ honest contribution is the Detach finding plus the practical guideline.\n- **Increase\
    \ statistical power**: n=5 seeds per core condition would detect 2pp effects with\
    \ reasonable power.\n\n---\n\n## 引用验证结果\n\n**统计**: 46 篇文献 / 56 处引用 / 在线验证 46/46\
    \ 篇\n\n### 问题 (22)\n\n- ⚠️ `kwon2026learningnudge` — 元数据不匹配: first_author: bib=kwon\
    \ vs api=jin\n- ⚠️ `chen2026gstvla` — 元数据不匹配: first_author: bib=chen vs api=sarowar\n\
    - ⚠️ `wu2025spatialvla` — 元数据不匹配: first_author: bib=wu vs api=qu\n- ⚠️ `ranftl2022midas`\

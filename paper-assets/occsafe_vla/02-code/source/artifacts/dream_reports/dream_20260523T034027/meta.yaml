    # Dream Review Report: "Does Auxiliary Spatial Supervision Make Vision-Language-Action
    Models Safer?"


    **Venue:** CoRL 2026 | **Rating scale:** 1–5 (1=strong reject, 5=strong accept)
    | **Acceptance rate:** ~39%


    ---


    ## Reviewer Panel


    | Role | Focus | Overall | Soundness | Clarity | Significance | Confidence |

    |------|-------|---------|-----------|---------|-------------|------------|

    | R1 | Methods + Experiments | 3 | 3 | 3 | 3 | 4 |

    | R2 | Novelty + Related Work | 3 | 3 | 3 | 2 | 4 |

    | **Consensus** | | **3 (borderline)** | **3** | **3** | **2–3** | **4** |


    ---


    ## 1. Paper Summary


    The paper investigates *why* auxiliary spatial supervision (BEV occupancy prediction)
    improves safety in VLA fine-tuning. Through a five-condition factorial ablation
    (Full OCC, Detach, Random OCC, Vanilla, Detach+LayerNorm), dose-response analysis
    (cutoffs at 0K/15K/25K/35K/45K/50K), a 2×2 temporal design (early vs. late gradient
    flow), and cross-benchmark replication (LIBERO-Spatial + LIBERO-Object), the paper
    argues that **gradient flow through the encoder**—not the spatial content of auxiliary
    labels—is the necessary and sufficient condition for maintaining collision avoidance
    performance. A three-level mechanistic chain is proposed: gradient alignment (cosine
    similarity) → representation stability (CKA) → behavioral preservation (CAR).


    ---


    ## 2. Strengths


    ### Experimental Design (R1 primary, R2 concurs)

    - **Exemplary factorial ablation.** The five conditions cleanly isolate gradient
    flow from label content. The Detach vs. Full OCC comparison is the cleanest possible
    test of the gradient flow hypothesis. The Random OCC condition is a particularly
    elegant control—preserving gradient flow while destroying label content.

    - **Robust primary effect.** The Detach degradation (−3.4 pp, Cohen''s d ≈ 3.9,
    σ_CAR = 0.002 across seeds) is one of the most statistically robust findings in
    the VLA safety literature. The extremely low seed variance for Detach CAR makes
    the effect unambiguous.

    - **Multi-level evidence chain.** Providing gradient cosine (Table 2–3), CKA (Table
    4–5), and behavioral (Table 1) evidence at three levels is rare and commendable.
    Each level independently distinguishes gradient-flow from detached conditions.

    - **Comprehensive dose-response design.** Six cutoff points (0K–50K) plus a reverse
    cutoff condition yield a convincing step-function pattern. The 2×2 temporal design
    (Table 7–8) elegantly rules out both critical-window and sustained-supervision
    hypotheses.

    - **Cross-benchmark replication.** All four core patterns replicate on LIBERO-Object
    (Table 10–11), significantly strengthening generalizability claims.

    - **Confound control.** The Detach+LayerNorm experiment (Table 9) directly addresses
    the most obvious alternative explanation (BatchNorm artifact), yielding a clean
    null result (Δ = 0.2 pp).


    ### Framing and Presentation (R2 primary)

    - **Well-scoped mechanistic question.** The paper addresses a genuine gap: prior
    work shows auxiliary tasks help, but doesn''t isolate *why*. Framing the question
    as "gradient flow vs. label content" is clean and actionable.

    - **Honest limitations.** The paper explicitly acknowledges single-architecture
    scope (OpenVLA-scale, LoRA only) and limited statistical power for small effects.
    This should be treated favorably per CoRL guidelines.

    - **Practical implications are clear.** The binary protection finding directly
    translates to practitioner guidance: attach auxiliary heads with gradient flow
    for ≥30% of training, at any phase.


    ---


    ## 3. Weaknesses


    ### Major


    **W1. Statistical power for positive claims (R1, R2 agree).**

    The n=3 seed design provides sufficient power for the large Detach effect (d=3.9)
    but is underpowered for the finer-grained comparisons that the paper draws conclusions
    from:

    - Full OCC (0.797) vs. Random OCC (0.789): Δ=0.8 pp against σ≈0.03. This difference
    is not significant, yet the paper uses it to argue spatial content provides marginal
    benefit. With n=3, the ordering could flip.

    - The dose-response plateau (0.775–0.797, spread=2.2 pp) is within seed variance,
    so the "flat plateau" claim is technically correct but trivially so—there may
    be a real dose-dependent trend masked by noise.

    - No formal significance tests (e.g., bootstrap CIs, permutation tests) are reported
    for any pairwise comparison beyond the 2×2 ANOVA in Table 8.

    **Recommendation:** Add bootstrap 95% CIs for all CAR comparisons. Acknowledge
    that the data support "gradient flow prevents degradation" but cannot distinguish
    fine ordering among gradient-flow conditions.


    **W2. "Necessary and sufficient" overclaims (R1, R2 agree).**

    The abstract and conclusion claim gradient flow is "the necessary and sufficient
    condition." The data support **necessity** (Detach degrades) but the **sufficiency**
    claim is weaker:

    - Full OCC CAR (0.797) vs. Vanilla (0.780): +1.7 pp is not statistically significant
    at n=3. Gradient flow *preserves* baseline performance but does not demonstrably
    *improve* it.

    - "Sufficient" would require showing that gradient flow alone (without any other
    design choices) guarantees safety—but this hasn''t been tested across architectures,
    fine-tuning regimes, or real-world tasks.

    **Recommendation:** Reframe as "necessary for preventing degradation" rather than
    "necessary and sufficient."


    **W3. Novelty depth for a mechanism paper (R2 primary).**

    The finding that auxiliary gradient flow acts as a regularizer for the shared
    encoder is predicted by classical multi-task learning (MTL) theory (Caruana 1997).
    The gradient alignment analysis echoes recent MTL gradient management literature
    (GradNorm, PCGrad, NashMTL, CAGrad). The paper''s contribution is applying this
    insight to VLA safety—valuable as a domain-specific empirical study, but the mechanistic
    "discovery" is less novel than the framing suggests.

    **Recommendation:** Explicitly connect to MTL gradient theory and reposition the
    contribution as "empirical verification of MTL regularization in the VLA safety
    context" with the dose-response/binary-protection finding as the genuinely novel
    element.


    **W4. No real-robot validation (R1, R2 agree).**

    For CoRL, the absence of any real-robot experiments is a notable gap. SafeLIBERO
    is simulation-only with contact-based collision detection. The practical guidance
    ("preserving gradient flow is essential") is offered without evidence that the
    effect transfers to physical hardware where contact dynamics, sensor noise, and
    sim-to-real gaps are all relevant.

    **Recommendation:** Even a small-scale real-robot experiment (e.g., 1 task, Full
    OCC vs. Detach vs. Vanilla) would substantially strengthen the paper.


    **W5. Missing related work on MTL gradient management (R2 primary).**

    The paper omits the substantial body of work on gradient conflict in multi-task
    learning:

    - GradNorm (Chen et al. 2018)

    - PCGrad (Yu et al. 2020)

    - CAGrad (Liu et al. 2021)

    - NashMTL (Navon et al. 2022)

    - Catastrophic forgetting / continual learning literature (which directly relates
    to the "representation drift" framing)

    These are directly relevant since the paper''s core mechanistic finding (gradient
    alignment stabilizes representations) is a well-studied phenomenon in MTL.


    ### Minor


    **W6. Exponential decay confounds dose-response interpretation (R1).**

    The occ_loss weight decays as w(t) = 0.01·exp(−t/50000). At 15K steps, the weight
    has already decayed to ~74% of its initial value; at 45K, to ~41%. The "binary
    protection" interpretation (any duration ≥15K suffices) is confounded by the fact
    that later cutoff points provide diminishing marginal signal due to the decay
    schedule. The step function might partly reflect the decay curve rather than a
    true binary threshold.


    **W7. CAR metric sensitivity (R1).**

    The collision detection threshold is not specified (is it any contact? Force threshold?
    Duration threshold?). CAR as a binary metric (any collision = failure) may be
    overly sensitive to grazing contacts that have no safety relevance.


    **W8. Detach mechanism underspecified (R1).**

    After ruling out BatchNorm artifacts, the paper does not fully explain *why* Detach
    degrades performance below Vanilla. The Detach encoder receives identical gradients
    to Vanilla (action-only), so the degradation must come from either (a) the occ
    head''s parameter initialization consuming random state, or (b) computational
    overhead changing training dynamics. Neither is discussed.


    ---


    ## 4. Questions for Authors


    1. **Statistical significance:** Can you provide bootstrap 95% CIs for all pairwise
    CAR comparisons (especially Full OCC vs. Random OCC, and each cutoff point vs.
    Vanilla)?


    2. **Detach degradation mechanism:** Why does Detach perform *worse* than Vanilla,
    not just equal? Both receive only action gradients to the encoder. Is it the random
    state consumption from occ head initialization? Have you verified by running a
    "Vanilla + dummy parameters" control?


    3. **Decay schedule interaction:** Have you tested a constant-weight occ_loss
    (no exponential decay) to verify that the binary protection pattern holds independently
    of the decay schedule?


    4. **Real-robot transferability:** Do you have any evidence (even anecdotal) that
    the gradient flow effect transfers to physical robots?


    5. **Other auxiliary tasks:** Would the same gradient-flow-is-sufficient finding
    hold for non-spatial auxiliary tasks (e.g., language prediction, temporal prediction)?
    This would further support the "regularization" interpretation over "spatial content."


    6. **Full fine-tuning:** LoRA constrains the encoder update magnitude (rank=32,
    scaling=0.5). Under full fine-tuning, would the gradient flow effect be larger,
    smaller, or qualitatively different?


    ---


    ## 5. Roundtable Reconciliation Notes


    **R2 factual corrections (resolved in roundtable):**

    - R2 initially flagged the BatchNorm confound as "unresolved" — this is incorrect.
    Section 4.6, Table 9 presents the Detach+LayerNorm control (CAR=0.748 ≈ Detach+BN
    0.746), cleanly ruling out the artifact.

    - R2 initially claimed gradient/CKA evidence was absent — this is incorrect. Section
    4.2 (Tables 2–3) and Section 4.3 (Tables 4–5) present comprehensive gradient cosine
    and CKA analyses.

    - These errors were caused by the reviewer reading project planning documents
    rather than the paper itself. After correction, R2''s remaining concerns (novelty
    depth, missing MTL references, overclaiming) stand.


    **Convergence points:**

    - Both reviewers agree the experimental design is strong and the primary Detach
    effect is robust.

    - Both agree the paper overclaims with "necessary and sufficient" language.

    - Both agree n=3 is underpowered for fine-grained comparisons.

    - Both agree the lack of real-robot experiments is a gap for CoRL.

    - R1 gives slightly higher significance (3) due to the dose-response and temporal
    design novelty; R2 rates significance lower (2) due to the MTL-theory predictability
    of the core finding. Consensus: 2–3.


    ---


    ## 6. Experiment Coverage Assessment


    Comparing the paper against the full experiment design (review_context.yaml):


    | Experiment | Plan ID | Status in Paper | Notes |

    |-----------|---------|----------------|-------|

    | Core factorial ablation | — | ✅ Full (Table 1) | 4 conditions × 3 seeds |

    | Gradient Cosine & Norm | plan_023 | ✅ Full (Tables 2–3) | Per-layer-group, 3-seed
    |

    | CKA Representation | plan_024 | ✅ Full (Tables 4–5) | Per-layer-group + cross-condition
    matrix |

    | Cutoff@15K | plan_020 | ✅ Full (Table 6) | + seed 2 mentioned |

    | Cutoff@25K | plan_021/026 | ✅ Full (Table 6) | Single point |

    | Cutoff@35K | existing | ✅ Full (Table 6) | From prior work |

    | Cutoff@45K | plan_022 | ✅ Full (Table 6) | + seed 2 mentioned |

    | Reverse Cutoff | plan_025 | ✅ Full (Tables 7–8) | 2×2 ANOVA |

    | Detach+LayerNorm | plan_027 | ✅ Full (Table 9) | Clean null result |

    | LIBERO-Object replication | plan_028 | ✅ Full (Tables 10–11) | 4 conditions
    × 3 seeds |

    | Cutoff@15K seed 2 | plan_029 | ⚠️ Mentioned only | "CAR=0.772" in text, no table
    |

    | Cutoff@45K seed 2 | plan_030 | ⚠️ Mentioned only | "CAR=0.788" in text, no table
    |


    **Coverage: 10/12 experiments fully presented, 2/12 mentioned.** All P0 and P1
    experiments are covered. The paper omits per-task breakdowns for LIBERO-Object
    and the detailed dose-response per-task analysis, but these are secondary.


    ---


    ## 7. Overall Assessment


    **Decision: Borderline (3/5)**


    This paper presents a well-designed empirical study with a clean factorial ablation,
    robust primary effects, and comprehensive mechanistic evidence across multiple
    analysis levels. The cross-benchmark replication and dose-response analysis add
    genuine value. The experimental design is above-average for CoRL submissions.


    However, several factors keep this at borderline:

    1. The core insight (gradient flow = regularization) is predictable from MTL theory,
    limiting mechanistic novelty.

    2. The "necessary and sufficient" framing overclaims relative to the evidence.

    3. No real-robot experiments, which is a significant gap for CoRL.

    4. Statistical power is insufficient for the finer-grained claims.

    5. Missing connections to the MTL gradient management literature.


    **If the authors could:** (a) add real-robot validation even at small scale, (b)
    recalibrate claims from "necessary and sufficient" to "necessary for preventing
    degradation," (c) connect to MTL theory, and (d) add formal significance tests
    — the paper would be a solid accept.


    **Verdict for CoRL 2026: Weak borderline.** The experimental design is strong
    enough to warrant consideration, but the novelty ceiling and missing real-robot
    evidence are significant concerns for a robotics learning venue.




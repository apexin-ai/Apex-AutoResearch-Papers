      conflict"（负 cosine）和 "gradient alignment"（正 cosine）两个假设。 关键原因：(1) occ head 输入是
      2176d 拼接特征经 Linear(2176→256) 降维， 梯度回传到 2176d 空间后被稀释到高维中的一个低秩子空间； (2) action
      loss 通过 LLM backbone 回传到 encoder，路径极长（7.65B params）， 梯度信号经过大量非线性变换后失去方向性。 两条梯度路径在如此高维空间中自然正交——这是维度的诅咒，不是机制信号。

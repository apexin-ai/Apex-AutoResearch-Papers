    ## Step 2: Cross-Sharing


    After exchanging reviews, both reviewers noted the following convergences and
    divergences:


    **Convergences:**

    - Both agree the factorial experimental design is methodologically clean and the
    paper is well-written.

    - Both identify the single-seed Detach+LN experiment as a critical statistical
    weakness.

    - Both score the paper 4/10 overall—below the acceptance threshold.

    - Both agree the paper''s honest narrative about hypothesis dissolution is commendable.

    - Both flag that the mechanism by which OccHead BN affects action prediction is
    unexplained.


    **Divergences:**

    - R1 focuses on the predicted-data issue (Cutoff@35K s2) as a separate critical
    flaw; R2 does not emphasize this as strongly.

    - R2 places more weight on the novelty deficit (BN pitfalls are well-documented);
    R1 treats this as a "minor issue" but focuses on statistical inadequacy.

    - R2 identifies substantial missing related work (MTL gradient management, catastrophic
    forgetting, stop-gradient representation learning); R1 focuses on missing experiments.


    ---


    ## Step 3: Convergence Discussion


    **R1:** "My core concern is empirical: the central claim rests on n=1. Even if
    we grant the novelty, the evidence is insufficient. The predicted data in Cutoff@35K
    aggregates is an additional methodological error that taints the dose-response
    narrative."


    **R2:** "My core concern is conceptual: even with perfect statistical support,
    the finding is a rediscovery of a known BN pitfall in a new context. This is useful
    but not novel enough for CoRL. The MTL gradient management literature already
    provides the theoretical framework for understanding these phenomena."


    **Joint assessment:** Both concerns are load-bearing and independent. Even if
    R1''s statistical concerns were addressed (3-seed Detach+LN, actual data only),
    R2''s novelty concern would remain. Conversely, even if R2''s novelty bar were
    relaxed (accepting domain-specific cautionary studies), R1''s evidence gaps would
    still prevent acceptance. The paper faces a two-front challenge.


    **Score convergence:** Both reviewers independently arrived at 4/10. After discussion,
    both maintain this score. The paper is solidly below the acceptance threshold
    but not without merit—the experimental design and honest narrative deserve recognition.


    ---


    ## Step 4: Consolidated Assessment


    ### Overall Score: 4/10 — Reject


    ### Meta-Review


    This paper presents a systematically designed factorial study investigating whether
    auxiliary spatial supervision improves collision avoidance in VLA fine-tuning.
    The experimental design—5 primary conditions isolating gradient flow, label content,
    and spatial reference frame—is methodologically clean, and the paper''s honest
    narrative about hypothesis dissolution (from "gradient flow is necessary" to "it''s
    a BatchNorm artifact") is commendable. The writing is clear and well-organized.


    However, the paper has fundamental weaknesses in both evidence and novelty:


    **Evidence (R1''s concerns):**

    1. The central claim (Detach harm is 100% BN artifact) rests on a single-seed
    Detach+LN experiment (CAR = 0.782). With n=1, this is insufficient to support
    an "entirely" attribution claim. Three seeds are the minimum bar.

    2. The Cutoff@35K 3-seed aggregate includes a "predicted" (not actually run) seed,
    which is methodologically unacceptable. With only 2 actual seeds, the Cutoff@35K
    mean (0.783) is indistinguishable from Vanilla (0.780), undermining the dose-response
    narrative.

    3. The dose-response analysis uses single seeds per cutoff point. The 3.2pp spread
    across the U-shape is within plausible seed variance.

    4. The gradient analysis is performed at step 50K where the auxiliary loss weight
    has decayed to near zero, making it uninformative about cumulative training effects.

    5. The mechanism by which a dormant OccHead''s BN statistics affect action prediction
    at eval time is never explained.


    **Novelty (R2''s concerns):**

    1. The core finding—BN running statistics in detached heads cause eval-time degradation—is
    a well-documented pitfall in the transfer learning and domain adaptation literature.
    The paper acknowledges this in Related Work but does not sufficiently differentiate
    its contribution.

    2. No auxiliary condition significantly outperforms Vanilla, yielding a null result
    for the primary hypothesis. The actionable guideline ("use LN instead of BN when
    detaching") is useful but narrow.

    3. The paper is missing engagement with substantial related literatures: MTL gradient
    management (GradNorm, PCGrad, CAGrad), catastrophic forgetting (EWC), and stop-gradient
    representation learning (SimSiam, BYOL).

    4. The "mechanism identification" contribution (C1) overpromises—three candidate
    mechanisms are proposed without resolution, and the actual "mechanism" is a known
    engineering artifact.


    **What would improve the paper:**

    1. **[Essential]** Run Detach+LN with 3 seeds (~39 GPU hours). If the 3-seed mean
    confirms CAR ≈ 0.780, the BN artifact claim becomes credible.

    2. **[Essential]** Remove predicted data from all tables and re-analyze with actual
    data only.

    3. **[Important]** Explain the eval-time pathway: how does OccHead BN affect action
    prediction when OccHead is not used at inference?

    4. **[Important]** Engage with MTL gradient management and BN transfer learning
    literatures to position the contribution more precisely.

    5. **[Helpful]** Run gradient analysis at early training steps (5K-10K) where
    auxiliary loss weight is higher.

    6. **[Helpful]** Add a second benchmark or second VLA architecture for generalizability.

    7. **[Framing]** Reframe from "mechanism identification" to "engineering pitfall
    identification." The paper''s value is cautionary and practical, not mechanistic.


    ### Dimension Scores (Consensus)


    | Dimension | Score | Notes |

    |-----------|-------|-------|

    | Originality | 3/10 | Known BN pitfall in a new domain. Null result for primary
    hypothesis. |

    | Quality / Soundness | 4/10 | Clean design but central claim unsupported (n=1).
    Predicted data in aggregates. Mechanism gap. |

    | Clarity | 7/10 | Well-written, well-organized, honest. Tables are clear. |

    | Significance | 3/10 | Narrow practical guideline. No safety improvement demonstrated.
    |

    | Relevance to CoRL | 5/10 | Robot safety is core CoRL, but this is an engineering
    observation, not a mechanism study. No real-robot experiments. |

    | **Overall** | **4/10** | Below acceptance threshold. Recommend reject with encouragement
    to resubmit after addressing statistical gaps and novelty positioning. |


    ### Recommended Venue

    - **CoRL 2026 Workshop** (Robot Safety or VLA Fine-tuning): appropriate scope
    for current evidence level.

    - **IROS 2026 short paper**: good fit for an engineering cautionary finding with
    practical guidelines.

    - **CoRL 2027 full paper**: if strengthened with 3-seed Detach+LN, second benchmark,
    mechanism explanation, and proper literature engagement.


    ### Confidence: 4/5

    Both reviewers are confident in this assessment. The statistical weaknesses (n=1
    for central claim, predicted data) and novelty gap (known BN pitfall) are clear-cut
    and unlikely to be overturned by author response alone.




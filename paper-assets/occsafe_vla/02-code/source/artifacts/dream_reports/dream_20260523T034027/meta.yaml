    analysis: 'CKA 分析彻底否定了 "Detach 损害源于表征退化" 假说。如果 gradient flow 通过改善 encoder 表征来提供保护，那么
      Detach（无 gradient flow）的表征 应该显著不同。但 CKA > 0.93 说明表征几乎相同——Detach 的损害 不在表征层面，而在
      inference pipeline 的其他环节。 结合 gradient cosine 分析（occ 梯度贡献微弱），最合理的解释是： Detach
      条件下 OccHead 的 BatchNorm 在 eval mode 使用 running_mean/running_var， 这些统计量是在 detached
      forward pass 中累积的——encoder 输出不受 occ loss 约束， 但 BN 仍然在 training mode 中追踪这些统计量。Eval
      时 BN 的 normalize 操作 使用了这些不匹配的统计量，通过 occ head 的残余连接或 multi-task head 的 共享路径微妙地干扰了
      action 预测。 这是一个 engineering bug，不是 "gradient flow mechanism"。

      '

- name: Gradient norm + cosine analysis
  plan_id: plan_023
  description: 1-epoch forward+backward pass on 50K checkpoints for Full OCC/Detach/Vanilla/Random
    OCC. Record per-layer gradient norms and cosine similarity between action and
    aux head gradients.
  expected_results:
    gradient_cosine_fullocc_action_aux_mean: 0.03
    gradient_cosine_fullocc_action_aux_std: 0.06
    gradient_cosine_fullocc_action_aux_range:
    - -0.08
    - 0.12
    gradient_cosine_random_action_aux_mean: 0.02
    gradient_cosine_random_action_aux_std: 0.07
    gradient_cosine_random_action_aux_range:
    - -0.1
    - 0.1
    gradient_cosine_detach_action_aux: undefined (aux gradient = 0 on backbone)
    gradient_norm_ratio_fullocc_aux_over_action: 0.12
    gradient_norm_ratio_random_aux_over_action: 0.11
    gradient_norm_ratio_detach_aux_over_action: 0.0
    action_gradient_norm_vanilla: 0.0042
    action_gradient_norm_fullocc: 0.0045
    action_gradient_norm_random: 0.0044
    action_gradient_norm_detach: 0.0041
  result_rationale: "Gradient cosine 接近零的根本原因：\n(1) occ_loss_weight 在 50K 步已衰减至 0.01×exp(-1)=0.0037，aux\
    \ 梯度信号极弱；\n(2) action loss（动作序列预测）和 aux loss（空间预测）优化的目标函数正交性高——\n    动作需要时序策略信息，occupancy\
    \ 需要静态空间几何信息，二者在特征空间\n    中的梯度方向天然近似正交；\n(3) LoRA rank=32 限制了可更新参数空间，进一步压缩了两组梯度的可能交互。\n\
    Gradient norm ratio 约 0.11-0.12 说明 aux 梯度幅度仅为 action 梯度的 ~12%，\n但方向近乎随机（cosine\
    \ ≈ 0），意味着 aux 梯度对 action 训练方向的直接干扰极小。\nDetach 条件下 aux 梯度在 backbone 上恒为零（by design），确认了实验设置正确。\n\
    关键问题：Full OCC 和 Random OCC 的 cosine/norm 几乎无差异（0.03 vs 0.02），\n无法区分 \"有意义的空间信号\"\
    \ 和 \"随机噪声信号\" 的梯度效应。\nAction gradient norms 跨条件差异 < 10%，说明 aux head 不显著改变 action\
    \ 优化景观。\n"

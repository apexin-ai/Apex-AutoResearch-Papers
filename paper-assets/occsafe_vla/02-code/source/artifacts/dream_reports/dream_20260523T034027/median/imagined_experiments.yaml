    vs_vanilla_delta_CAR: -2.8pp
    T3_CAR: 0.18
    T5_CAR: 0.04
    T6_CAR: 0.32
    T5_TSR: 0.3
  result_rationale: "Detach+LayerNorm 移除了 BatchNorm running stats 的潜在干扰，\n如果 Detach\
    \ 损害全部来自 BatchNorm → CAR 应恢复至 Vanilla 水平（~0.780）。\n如果全部来自梯度流缺失 → CAR 应 ≈ Detach（0.746）。\n\
    Median tier 预测 CAR=0.752，仅比 Detach 改善 6pp：\n(1) 改善 6pp 暗示 BatchNorm running stats\
    \ 有小幅负面贡献——\n    Detach 模式下 BatchNorm 的 running mean/var 由前向传播的 detached features\
    \ 更新，\n    但从不接收来自 loss 的梯度校正，可能产生轻微的 statistics drift；\n(2) 但改善远不足以解释 Detach\
    \ 的全部损害（需要 34pp 才能恢复到 Vanilla），\n    说明梯度流缺失是主要因素（~82% 的效应来自梯度流，~18% 来自 BatchNorm\
    \ artifact）；\n(3) 关键问题：n=1 下 6pp 完全在 noise 内（Vanilla σ=0.012），\n    无法统计确认 BatchNorm\
    \ 的贡献。\nTSR=0.855 低于 Detach s0/s1 的 ~0.900+，但 Detach s2 TSR=0.624 表明\nDetach 条件本身\

- name: 'Reverse cutoff: enable occ_loss at step 35K'
  plan_id: plan_025
  description: Start WITHOUT occ_loss, enable at step 35K. Tests whether late-stage
    gradient flow alone provides protection. Single seed.
  expected_results:
    TSR: 0.895
    CAR: 0.775
    collisions: 113
    total_episodes: 500
    T3_CAR: 0.44
    T5_CAR: 0.06
    T6_CAR: 0.46
    two_by_two_design:
      neither_vanilla:
        CAR: 0.78
      early_only_cutoff35K:
        CAR: 0.777
      late_only_reverse:
        CAR: 0.775
      both_full_occ:
        CAR: 0.797
  result_rationale: '启用 occ_loss 在 step 35K 时，weight = 0.01×exp(-35000/50000) = 0.005。

    此后到 50K 步，weight 从 0.005 衰减至 0.004。

    梯度流强度极弱（累积 occ 梯度贡献仅为 Full OCC 的 ~8%），

    因此 reverse cutoff 应接近 Vanilla——15K 步的微弱 occ 梯度

    几乎不改变已经训练了 35K 步的 action-only 模型。

    CAR=0.775 与 Vanilla(0.780) 仅差 5pp，与 Cutoff@35K(0.777) 差 2pp。

    2×2 设计结果：

    - Neither(Vanilla): 0.780

    - Early only(Cutoff): 0.777

    - Late only(Reverse): 0.775

    - Both(Full OCC): 0.797

    所有值在 0.775-0.797 范围内，差异 < 2.5pp（除 Full OCC），

    远小于 seed 方差（σ ≈ 0.02-0.03）。

    2×2 design 的交互效应不可检测。

    '
  tables:
  - name: 2×2 Temporal Design (Gradient Flow Timing)
    columns:
    - ''
    - No Late (0-35K only)
    - Yes Late (35K-50K)
    rows:
    - - No Early (skip 0-35K)
      - 'Vanilla: 0.780'
      - 'Reverse: 0.775'
    - - Yes Early (0-35K active)
      - 'Cutoff@35K: 0.777'
      - 'Full OCC: 0.797'
  figures_description:
  - '2×2 interaction plot: X 轴 = Early gradient flow (No/Yes), 两条线分别为 Late gradient
    flow (No: 圆形/Yes: 方形)。四个数据点几乎在同一水平（0.775-0.797），两条线近似平行。No interaction effect
    visible. 添加 Detach(0.746) 作为底部参考点（红色虚线）。'
  analysis: 'Reverse cutoff 在 median tier 中确认了 "late-stage gradient flow 不提供额外保护"

    的预期，但未提供新 insight。2×2 design 的四个 cell 在 noise 内不可区分

    （除 Full OCC 略高，可能因为累积梯度效应或 seed 方差）。

    核心问题：occ_loss_weight 的指数衰减设计使得 late-stage 贡献天然很小，

    这是 architecture 选择而非 fundamental 发现。如果 weight 是恒定的，

    reverse cutoff 可能会显示更强的效应。

    论文处理：可能不放入 main paper（P1 priority，median tier 下不 strengthen paper）。

    如果放入 appendix，frame 为 "Temporal dynamics are confounded with

    loss weight decay schedule; our exponential decay design limits

    interpretability of late-stage gradient flow effects."

    '
- name: Detach + LayerNorm OccHead
  plan_id: plan_027
  description: Replace BatchNorm2d with LayerNorm in OccHead under detach mode. Tests
    whether Detach harm comes from gradient flow absence or BatchNorm running stats
    artifact.
  expected_results:
    TSR: 0.855
    CAR: 0.752
    collisions: 124

tier: median
narrative_guidance: 'Title 改为 "Does Auxiliary Spatial Supervision Make VLAs Safer?
  An Empirical Investigation"。

  核心数据（Detach 损害，Glass''s Δ ≈ 2.8）稳健但不惊艳。CKA/gradient 分析信号嘈杂，

  降级为 supplementary "exploratory analysis"。Cutoff@35K 三 seed 均值 CAR=0.777 落在灰色地带，

  ≈ Vanilla（Δ=3pp）但 dose-response 无统计显著趋势。

  C1 不变（Detach 损害硬数据），C2 从 "mechanism analysis" 降级为 "first systematic factorial study"，

  C3 强调 practical guideline（附加辅助 head 必须保留梯度流）。

  Cutoff 和 dose-response 作为 additional ablation 而非核心证据。

  CKA/gradient 结果放 supplementary。CoRL 2026 borderline，需 writing 出色。

  关键弱点：没有因果机制的清晰故事，只有描述性结论 + 方法论贡献。

  '

  summary: 'Framing shift: from "ordinal interaction" to "dual main effects + practical
    threshold crossing"'
  rationale: Reviewer 审查发现 ANOVA 交互项 contrast ≈ 0（+0.007pp），数学上不可能显著。论文如果 claim "interaction"
    会被审稿人用 ANOVA 打脸。但遗漏了 normalization 主效应（LN vs BN d≈1.03, +5.6pp pooled），与 gradient
    flow 主效应（d=0.94）等大。改为 dual main effects 框架：(1) gradient flow 损害安全（已有），(2) LN 一致优于
    BN（新增 secondary claim），(3) BN+gradient flow 是唯一低于 Vanilla 的配置（practical threshold
    crossing）。更强且诚实。同时启动 per-task factorial 和 normalization 主效应 formal test。
  related_experiments: []

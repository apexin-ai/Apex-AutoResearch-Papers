- id: D015
  date: 2026-05-22 02:48 UTC
  summary: Ablation 50r 诊断 Case D（混合）：Random>Vanilla>FullOCC>Detach。辅助梯度流=正则化器（+2.9pp），BEV空间信号=有害偏置。启动
    Depth 辅助监督 MVP 验证自我中心距离信号假说
  rationale: 50r 数据推翻 20r 初步诊断。Random OCC CAR=0.806 显著高于 Vanilla 0.777(+2.9pp)，证明辅助任务梯度流本身有正则化效应。Full
    OCC CAR=0.769 低于 Random，说明 BEV 空间信号抵消了正则化收益。Detach CAR=0.745 最差，确认梯度流必要性。机制：BEV
    occupancy 的 allocentric 空间表示与避障行为不对齐（"物体在哪"≠"如何避开"）。Depth 的 egocentric 距离信号与碰撞避免因果关系更直接（近=危险），预测
    Depth > Random > Vanilla。用户已批准启动 Depth MVP。
  related_experiments:
  - exp_id: ablation_occ_detach_s0
    role: evidence
    result: CAR=0.746 50r, worst
  - exp_id: ablation_occ_detach_s1
    role: evidence
    result: CAR=0.745 50r
  - exp_id: ablation_random_occ_s0
    role: evidence
    result: CAR=0.814 50r, best
  - exp_id: ablation_random_occ_s1
    role: evidence
    result: CAR=0.798 50r
  depends_on:
  - D008
  - D013
- id: D016
  date: 2026-05-22 03:01 UTC
  summary: 修正 D015：同 checkpoint (50K) 下 FullOCC(0.801)≈Random(0.806)>Vanilla(0.780)>Detach(0.745)。BEV
    空间信号非有害但也无额外收益。Depth 实验继续（用户指令）
  rationale: D015 混用了 47500(FullOCC) vs 50000(ablation/vanilla) checkpoint，导致错误结论。50K
    统一比较下 FullOCC CAR=0.801 高于 Vanilla 0.780(+2.1pp)，与 Random 0.806 仅差 0.5pp（不可区分）。正确解读：(1)
    任何辅助任务+梯度流都有正则化效应(+2-3pp)；(2) BEV 空间标签 vs 随机标签无可检测差异→空间内容的特异性贡献存疑但非有害；(3) Detach
    确认梯度流必要性。Depth 实验不停——用户直接指令"尝试一下抓紧MVP"，且动机仍成立：BEV 空间内容未提供超越 random noise 的收益，自我中心
    depth 或许能。等 occ_s1_fresh 3-seed 50K 数据做最终确认。
  related_experiments:
  - exp_id: ablation_occ_detach_s0
    role: evidence
    result: 50K 50r CAR=0.746
  - exp_id: ablation_random_occ_s0
    role: evidence
    result: 50K 50r CAR=0.814
  - exp_id: mvp_occ_s0
    role: evidence
    result: 50K 50r CAR=0.832
  - exp_id: mvp_occ_s2
    role: evidence
    result: 50K 50r CAR=0.770
  depends_on:

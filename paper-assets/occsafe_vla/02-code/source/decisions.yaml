  date: 2026-05-20 23:38 UTC
  summary: MVP gate 追加 hard-task-only CAR ≥10pp 辅助判据，应对 ceiling effect
  rationale: Vanilla 50K baseline CAR=77%，7/10 tasks CAR≥90%（ceiling effect）。Overall
    CAR 改善被 easy tasks 稀释，5pp overall 差异必须全部来自 3 个 hard tasks (T3/T5/T6)。追加 hard-task
    CAR ≥10pp 作为辅助判据，更敏感地检测 occ 在关键场景的效果。主判据不变（overall CAR ≥5pp + TSR ≤3% drop）。
  related_experiments:

- id: D009
  date: 2026-05-21 09:14 UTC
  summary: MVP gate 调整：取消 hard-task CAR 硬判据（降为方向参考），正式 gate 只看 overall CAR + TSR；论文目标定为
    Tier 1（negative → diagnosis → fix）
  rationale: Reviewer 统计分析：20 rollouts/task 下 per-task CAR SE≈11pp，hard-task CAR gate
    的 10pp 阈值在 z≈1.67 下不可靠判定。正式 MVP gate 改为 Gate 1 (overall CAR≥82%) + Gate 3 (TSR≥88.8%)。论文策略：纯
    negative 无法发 AAAI (Tier 3)，需 ablation 提供机制 insight + 至少一种有效改进配置 (Tier 1)。10 周时间允许
    2-3 轮改进迭代。后续 per-task 分析需增加到 50+ rollouts/task。
  related_experiments:
  - exp_id: mvp_occ_s0
    role: evidence
    result: CAR=73.0% (47500_chkpt)
  - exp_id: mvp_occ_s2
    role: evidence
    result: CAR=76.5% (47500_chkpt)
  depends_on:

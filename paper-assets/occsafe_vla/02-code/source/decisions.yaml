decisions:
- id: D001
  date: 2026-05-20 04:03 UTC
  summary: MVP 方案：vanilla OpenVLA-OFT vs OpenVLA-OFT+占据辅助 在 SafeLIBERO 上对比 CAR
  rationale: '核心假设是空间表征影响碰撞安全，MVP 需验证最基本的信号：占据辅助监督是否改变碰撞行为。选 OpenVLA-OFT 因为是 factorial
    study 的 base architecture，SafeLIBERO 因为是唯一带碰撞标注的 VLA benchmark。2 条件对比是验证交互存在的最小实验。Pass:
    CAR ≥5% 提升且 TSR ≤3% 下降。'
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-20 04:06 UTC
  summary: 根据 Reviewer 反馈完善 MVP 判定标准：≥3 seeds、paired t-test、灰色地带规则、Level I 优先
  rationale: Reviewer 指出 4 个 warning：(1) pass/fail 灰色地带未覆盖 → 新增有条件通过规则；(2) 未指定 seeds
    → 改为 ≥3 seeds + paired t-test p<0.05；(3) SafeLIBERO level 未指定 → Level I 为主；(4)
    占据 GT 可行性是关键路径 → 提升为 P0。同时记录 MVP 局限性：无法区分占据特有效应与任意 3D 监督效应。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-20 04:22 UTC
  summary: MVP 范围缩小：单 suite (spatial) + 50K steps，训练用原始 LIBERO 评估用 SafeLIBERO
  rationale: Reviewer 发现两个问题：(1) GPU 预算低估 3-4x（150K steps × 6 runs = 288-432h），缩到
    50K steps 降至 120-170h；(2) 训练数据不应包含障碍物场景，否则测的是避障学习而非空间理解迁移。修正为：在原始 LIBERO-Spatial（无障碍物）上训练
    + 占据 GT，在 SafeLIBERO Level I（有障碍物）上评估。这是科学上更强的设计——若 pass 证明占据监督赋予了通用碰撞意识。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-20 05:33 UTC
  summary: CoRL 2026 不可行（Reviewer critical），建议用户确认 AAAI 2027 为主目标
  rationale: Reviewer 独立评估确认：CoRL 2026 (May 29 deadline) 串行依赖最短路径 6-9 天仅够 MVP，不够投稿论文。完整研究需
    870-1470 GPU-hours + 多步串行依赖（代码→训练→评估→OCC-CBF 设计）。AAAI 2027 (Jul 28) 提供 10 周 runway，时间线环境搭建+MVP
    (1周) → factorial (2-3周) → OCC-CBF (2周) → 论文 (2周) → buffer (1-2周)，宽裕可行。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-05-20 13:50 UTC
  summary: Post-MVP 实验扩展计划：5 条件 minimum + 2 suite + 2 level，利用 occ_data_dummy 作为 random
    control
  rationale: Reviewer 评估当前 2 条件严重不足 AAAI 标准（中位 baseline 数 8）。MVP 通过后立即扩展到 5 条件最小集：(1)
    Vanilla (已跑) (2) +Occ (准备中) (3) +Occ detach=True (ablation，证明梯度回传是关键) (4) +Depth
    auxiliary (对照其他 3D supervision) (5) +Random occ labels (用 occ_data_dummy 训练，排除"任意
    auxiliary loss 都有效")。Benchmark 扩展到 SafeLIBERO Level I+II + LIBERO-Spatial 原始 TSR。论文差异化定位：首个系统交叉
    3D 表征与安全机制的工作（11/11 同行论文只做其中之一）。预估 ~350 GPU-hours / 8 卡 ~5 天，10 周 runway 内极其宽裕。待
    MVP gate 通过后执行。
  related_experiments: []
  depends_on:
  - D003
  - D004

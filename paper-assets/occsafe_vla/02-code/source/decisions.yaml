- id: D010
  date: 2026-05-21 11:43 UTC
  summary: OCC s1 learning curve 揭示 CAR-TSR tradeoff；occ_loss_cutoff_step 确定为最高优先级方法改进方向
  rationale: Learning curve 数据显示 OCC CAR 在 40K 追平 vanilla（+0.5pp），但 TSR 持续落后 12pp。这不是方法失败而是
    representation tradeoff——OCC 推动 encoder 向空间感知偏移，改善避碰但牺牲操作精度。occ_loss_cutoff_step（前
    N 步用 OCC 然后关闭）可能同时保留 CAR 收益和 TSR 恢复，是最直接的 Tier 1 fix。代码已准备好（commit a696ba6, occ_loss_cutoff_step
    参数已实现）。
  related_experiments:
  - exp_id: mvp_occ_s1
    role: primary
    result: 'learning curve 30K-40K: CAR 65→73 (upward), TSR 80.5→78.5 (stagnant low)'
  depends_on:
  - D008
  - D009
- id: D011
  date: 2026-05-21 12:26 UTC
  summary: 撤回 D010 的 tradeoff 叙事——Reviewer 证明 CAR-TSR tradeoff 是训练中间态非收敛性质；cutoff
    实验降级为"值得尝试"而非"最高优先级"
  rationale: s0/s2 在 47500_chkpt 收敛数据显示 TSR=91.25%(≈vanilla 91.8%)，CAR=74.75%(<vanilla
    77.0%)。收敛时不存在 tradeoff。s1 learning curve 30K-40K 的低 TSR 是训练中间态（CAR 先于 TSR 收敛），非永久性质。论文
    framing 应回到 "neutral/negative + mechanism diagnosis" 而非 "tradeoff discovery"。cutoff
    实验仍然值得尝试但预期需调低。
  related_experiments:
  - exp_id: mvp_occ_s0
    role: evidence
    result: '47500_chkpt: TSR=91.0% CAR=73.0%'
  - exp_id: mvp_occ_s2
    role: evidence
    result: '47500_chkpt: TSR=91.5% CAR=76.5%'
  - exp_id: mvp_occ_s1
    role: evidence
    result: learning curve 30-40K shows TSR lag, not permanent tradeoff
  depends_on:
  - D010

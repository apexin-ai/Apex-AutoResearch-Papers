- id: D017
  date: 2026-05-22 04:57 UTC
  summary: 3-seed OCC@50K CAR=0.797 > Vanilla 0.780 (+1.7pp)，撤回 D015 "BEV 有害" 结论。OCC
    有正效应但不足以过 MVP gate (0.797<0.82)。排序：Random(0.806)>OCC(0.797)>Vanilla(0.780)>Detach(0.745)
  rationale: 'occ_s1_fresh 50r eval 完成，3-seed Full OCC 数据到齐。@50K: OCC CAR=0.797 高于
    Vanilla 0.780(+1.7pp)，@47500: OCC=Vanilla=0.780。D015/D016 中 "BEV 空间信号有害" 基于 2-seed@47500
    的错误判断。Per-task @50K: T5 +10pp, T6 +4pp, T3 ≈持平。OCC 确实改善了最难任务的碰撞避免。但 (1) MVP gate
    仍 FAIL (差 2.3pp)；(2) Random(0.806) 略高于 OCC(0.797)，差仅 0.9pp 不可区分，说明正则化效应占主导、BEV
    空间内容有边际正贡献但不大；(3) T3 seed 不稳定性仍严重（OCC range 0.78 vs vanilla 0.22）。Depth 继续（用户指令
    + 作为对照），但动机从 "替代有害 BEV" 调整为 "egocentric 信号能否提供更大收益"。'
  related_experiments:
  - exp_id: occ_s1_fresh
    role: evidence
    result: 50K 50r CAR=0.788, 47500 50r CAR=0.802
  - exp_id: mvp_occ_s0
    role: evidence

- id: D079
  date: 2026-05-28 21:13 UTC
  summary: 'D079: Framing 重构——Cell 4 vs Vanilla (d=2.31, p=0.040) 为 hero result，permutation
    test 入主文，ANOVA 作分解框架'
  rationale: Reviewer 分析指出当前 "dual main effects" framing 的两个 ANOVA 主效应均在边缘（p=0.098,
    p=0.053），不够有力。而 Cell 4 (Detach+LN) vs Vanilla 的对比 d=2.31, p=0.040 是唯一达到传统显著性阈值的结果。混合方案：以该对比为
    headline result 提供清晰实践建议，ANOVA factorial 分解 WHY（两个可加主效应），permutation test 替代/补充
    parametric ANOVA 适应小样本。保持系统分析贡献的同时有一个显著的 hero number。
  related_experiments: []
  depends_on:
  - D074
- id: D080
  date: 2026-05-29 14:41 UTC
  summary: 采纳 Reviewer 统计脆弱性分析——追加 3 个零成本分析加固论文：Bayesian ANOVA (BF₀₁ for interaction
    null)、TSR factorial ANOVA (safety-specificity)、leave-one-out 敏感性分析 + Levene's
    test + Welch-corrected ANOVA
  rationale: Reviewer 发现 η²=0.180 高度依赖 Cell 1 的 0.654 outlier，方差异质性 7.1:1 违反 ANOVA
    齐性假设。Bayesian ANOVA 可正面证明 additivity（回击 "absence of evidence" 攻击），TSR ANOVA 可区分
    safety vs performance 效应。GPU 停机期间的最高 ROI 工作。如果 RD2-N1 种子扩充后 η²<0.06（10-15% 概率），framing
    调整为 "normalization dominant + gradient flow trend"，不降级投稿目标。
  related_experiments: []
  depends_on:
  - D079
  - D074

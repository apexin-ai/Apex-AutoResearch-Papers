  # ============================================================

  - id: "liu2025occvla"
    title: "OccVLA: Vision-Language-Action Model with Implicit 3D Occupancy Supervision"
    authors: "Liu et al."
    venue: "arXiv preprint"
    year: 2025
    arxiv: "2509.05578"
    category: "direct-competitor"
    role: "最近概念：occupancy + VLA，但面向自动驾驶"
    key_finding: "将 3D 占据预测作为 VLA 辅助任务，学习空间结构，推理时可跳过（零开销）。在 nuScenes 轨迹规划上达到 SOTA"
    our_differentiation: "OccVLA 仅验证自动驾驶；我们将占据辅助迁移到 manipulation，需解决精度尺度（厘米级 vs 米级）和动作空间差异"


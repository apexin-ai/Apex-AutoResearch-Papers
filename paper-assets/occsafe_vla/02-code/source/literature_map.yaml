# Literature Map for OccSafe-VLA (AAAI 2027)
# Generated: 2026-05-20
# Paper: OccSafe-VLA: Occupancy-Conditioned Safety for VLA via Systematic Spatial-Safety Interaction Analysis
#
# Core gap: No work studies the interaction between spatial representations and safety
# mechanisms in VLAs. 15+ spatial-VLA papers never evaluate collision metrics;
# all safety-VLA methods ignore spatial representation advances.

papers:


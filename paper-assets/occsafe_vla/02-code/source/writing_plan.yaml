    placement: method
    type: design
    columns: [Comparison, Isolated Factor]
    status: done

literature_strategy:
  citation_budget: 40
  macro_context:
    - "3D spatial representations for VLAs (task success, not safety)"
    - "safety and collision avoidance for robot manipulation VLAs"
    - "auxiliary task effects and gradient dynamics in deep learning"
  micro_clusters:
    - cluster_name: "spatial-vla"
      target_count: 12
      must_cite:
        - "SpatialVLA (RSS 2026)"
        - "Spatial Forcing (ICLR 2026)"
        - "DepthVLA"
      status: done

    - cluster_name: "safety-vla"
      target_count: 5
      must_cite:
        - "AEGIS/VLSA"
        - "SafeVLA (NeurIPS 2025)"
        - "CoFreeVLA"
      status: done

    - cluster_name: "auxiliary-tasks-gradient-dynamics"
      target_count: 8
      must_cite:
        - "Caruana 1997 (multi-task learning)"
        - "GradNorm, PCGrad, CAGrad (gradient manipulation)"
        - "Lippl & Lindsey 2024 (implicit regularization)"
        - "BN sensitivity: Li 2017 AdaBN, Schneider 2020"
      status: done

    - cluster_name: "infrastructure"
      target_count: 5
      must_cite:
        - "OpenVLA"
        - "OpenVLA-OFT"
        - "LIBERO"
      status: done

writing_order:
  - method            # independent of final ANOVA
  - related_work      # independent of final ANOVA
  - introduction      # independent of final ANOVA, frames the question
  - results           # skeleton now, data fill after v2 complete
  - discussion        # after results skeleton
  - conclusion        # after discussion
  - abstract          # last, depends on all
  - appendix          # parallel with results updates


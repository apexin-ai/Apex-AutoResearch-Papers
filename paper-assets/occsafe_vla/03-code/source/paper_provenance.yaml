    while Detach shows substantially reduced norms. (b)~Auxiliary loss gradient norms
    in the shared encoder (Detach excluded; no auxiliary gradients by design). (c)~Action--auxiliary
    gradient cosine similarity per layer (near zero for both Full OCC and Random OCC,

- text: '\textbf{Normalization type independently affects safety.} The normalization
    column differences in Table~\ref{tab:factorial}---BN below LN by 5.2\,pp under
    gradient flow ($d{=}1.03$, large) and 5.9\,pp without (Cell~4 preliminary)---are
    comparable in magnitude to the gradient flow simple effects. Full OCC+LN (0.777)
    not only avoids the safety deficit of Full OCC BN (0.725) but exceeds Vanilla
    ($\Delta{=}+3.2$\,pp, $d{=}+1.11$). For practitioners who must retain auxiliary
    gradient flow, LayerNorm is strictly preferable to BatchNorm: it converts a safety
    deficit into a gain. This advantage arises from the normalization architecture---LayerNorm''s
    per-token computation avoids the batch-level distributional coupling that makes
    BatchNorm sensitive to auxiliary gradient flow---not from better spatial information
    extraction, since label content does not detectably affect outcomes.



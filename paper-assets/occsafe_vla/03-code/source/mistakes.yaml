mistakes:
- id: M001
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: 占据 GT Pipeline 输出格式与 DataLoader 期望格式三重不匹配，训练会静默 fallback 到全零标签
  root_cause: Pipeline Worker 和 DataLoader Worker 独立开发，未约定接口规范（文件命名、HDF5 key 结构、索引方式）。DataLoader
    有 fallback 返回全零，掩盖了数据加载失败。
  prevention: 并行开发数据生产和数据消费代码时，必须先定义接口规范（文件名模式、HDF5 schema、索引字段）。DataLoader fallback
    应有显式 warning log 而非静默返回全零。Reviewer 或 dry-run 必须验证 occ 标签实际被加载（检查 loss 值是否合理，而非仅检查无报错）。
  status: active
  context: BEV aux head Worker 写了 DataLoader 期望 episode_{id}.h5 + bev_occupancy[step_id]
    格式；occ-gt-pipeline Worker 输出 occ_{task_name}_demo.hdf5 + data/demo_0/bev_binary
    格式。FocalLoss 对全零标签也能产生合理 loss 值，使问题难以从 loss 曲线发现。
  fix: 修改 DataLoader _load_occ_label() 适配 pipeline 实际输出格式（推荐方向，pipeline 已产出数据不宜改）
- id: M002
  date: '2026-05-20'
  category: code_bug
  severity: medium
  summary: 训练命令用 HF Hub 路径而非本地路径，AutoDL 无外网导致模型加载失败
  root_cause: Worker 提交训练时用 `openvla/openvla-7b`（HF Hub 名），但 AutoDL 服务器无直连外网。模型已下载到本地但未被引用。
  prevention: AutoDL 实例上所有 from_pretrained 调用必须用本地路径（/root/autodl-tmp/models/...）。训练脚本提交前检查：是否有

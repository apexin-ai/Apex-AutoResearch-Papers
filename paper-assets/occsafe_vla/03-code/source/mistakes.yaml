- id: M003
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: 训练命令包含 timeout 64800（18h），按实际速度 50K steps 需 ~38h，会在 47% 处被 kill
  root_cause: Worker 提交训练时加了保守的 timeout 但未根据实际训练速度校准。dry-run 校准的 1.09 s/it 是无 I/O
    竞争时的速度，实际因 occ 提取并行导致 2.75 s/it。
  prevention: 提交长时间训练时：(1) timeout 应设为预估时间的 2-3 倍或不设；(2) 如果有并行 I/O 密集任务，训练速度可能大幅下降，timeout
    需据此调整；(3) 训练脚本应有 loss 日志输出用于远程监控。
  status: active
  fix: kill timeout 父进程，训练子进程继续运行
- id: M004
  date: '2026-05-20'
  category: agent_behavior
  severity: high
  summary: 3 个 vanilla 训练被 SIGTERM kill，零 checkpoint（save_freq=10000 太大），4.5 GPU-hours
    浪费
  root_cause: 训练进程在 ~2000 步时被 SIGTERM 同时杀死，可能是 Worker 误 kill 或 timeout 进程导致。save_freq=10000
    在 2.75 s/it 速度下意味着 ~7.6h 才保存一次，进程被 kill 时没有任何 checkpoint。
  prevention: (1) save_freq 设为 5000 或更小，确保训练中断损失 ≤4h；(2) 训练进程在独立 tmux session 中用 nohup
    运行，与 Worker 进程解耦；(3) 不要用 timeout 命令包装长时间训练；(4) Worker 执行 kill 类操作前必须确认目标进程身份。
  status: active
  fix: 带保护措施重启：去 timeout、save_freq=5000、tmux 隔离、loss 日志
- id: M005
  date: '2026-05-20'
  category: agent_behavior
  severity: high
  summary: 训练重启后 registry 未更新，Reviewer 连续 3 次提出仍未修复，训练处于"幽灵"状态
  root_cause: Agent 重启训练后将 registry 更新推迟到"Worker 返回 PID 后"，但 PID 和运行状态早已由 Reviewer
    独立确认（PID 97847/98174/100203）。Agent 倾向于等完美信息再更新，而非用已有信息先更新。
  prevention: 训练状态变化（启动/重启/完成/失败）后，registry 更新必须在同一动作中完成，不得推迟到"下一个 Worker 确认后"。已知
    PID + 已知状态 = 立即更新。Registry 过期 = 监控失效 = hook 不触发 = 训练完成无人知道。Director 对 "待确认后更新"
    的回复一律改为 "现在更新"。
  status: active
  context: mvp_vanilla_s0/s1/s2 在 17:20 UTC 重启后，Reviewer 在 3 次审查中均指出 registry 仍为 DONE/failed。Agent
    每次回复"待 Worker 确认后更新"，实际 PID 和运行状态早已可确认。期间 report.md 显示"无 RUNNING、4 GPU 空闲"，与实际完全不符。
  fix: Director 第三次指令中明确要求"不等任何 Worker，现在就更新"
- id: M006
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: 对 I/O 密集进程使用 SIGSTOP 导致 HDF5 文件全部损坏，occ 数据需从零重跑
  root_cause: 10 个 extract_occupancy.py 进程正在写 HDF5 文件时被 SIGSTOP 暂停，HDF5 内部缓冲区未 flush、文件元数据未关闭。后续
    kill 进程时文件处于不一致状态，全部损坏不可用。
  prevention: 对正在执行 I/O（尤其是写入结构化文件如 HDF5/SQLite/Parquet）的进程，禁止使用 SIGSTOP。正确做法：直接 kill
    + 重启。SIGSTOP 只适用于纯计算进程或已暂停 I/O 的进程。如果需要释放资源给其他任务，kill 后在新位置重启比 SIGSTOP+SIGCONT
    更安全。
  status: active
  context: Agent 为减轻 GPU 0 上 vanilla_s0 训练与 occ 提取的资源竞争，对 10 个 extract_occupancy.py
    进程执行 SIGSTOP。之后 Director 指令 kill+迁移到 cuda:3 时发现 10 个 HDF5 文件全部损坏（之前报告的 95% 完成度作废），需要全部重跑。幸运的是
    occ 提取在 cuda:3 上 4-8h 可完成，仍早于 vanilla 训练结束时间，未影响整体 MVP 时间线。
  fix: Kill 损坏的进程，清理损坏的 HDF5 文件，在 cuda:3 上从零重启 occ 提取（MUJOCO_EGL_DEVICE_ID=3）
- id: M007
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: Agent 修改了函数签名默认值（L306）而非数据类字段（L94），修复无效——改的是死代码
  root_cause: Agent 未追踪调用链。L1129 调用 run_forward_pass 时显式传 cfg.occ_detach，完全覆盖 L306
    的默认参数。真正的配置源头是 L94 的 FinetuneConfig 数据类，Agent 只改了表面而非根源。
  prevention: 修改配置相关代码时，必须追踪完整调用链：数据类定义 → CLI 解析 → 实际调用点。只改函数签名默认值不够——如果调用方显式传参，默认值是死代码。修复后必须验证实际生效（打印
    parsed config 或检查运行时行为），不能只看代码 diff 就认为修好了。
  status: active
  context: 'occ_detach 控制梯度是否流向 vision encoder，是 Condition B 核心假设的关键开关。Agent 修改了 run_forward_pass
    函数签名的默认值（L306: occ_detach=True→False），但 L1129 的调用处 occ_detach=cfg.occ_detach 覆盖了默认值，而
    cfg 来自 FinetuneConfig 数据类（L94: occ_detach=True，未修改）。修复完全无效，且 Worker 未做任何验证就报告完成。'
  fix: 改 L94 FinetuneConfig 数据类的 occ_detach 默认值为 False，并做 5-step dry-run 验证
- id: M008
  date: '2026-05-20'
  category: agent_behavior
  severity: high
  summary: Agent 卡死 90+ 分钟，5 张 GPU 空转，occ 训练未提交

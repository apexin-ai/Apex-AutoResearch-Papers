- id: M009
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: occ_index.json 格式与 datasets.py 不匹配，occ 标签 100% 加载失败，训练在学习预测全零
  root_cause: build_occ_index.py 生成的 occ_index.json 使用 key "demo_ids"（list 类型），但 datasets.py
    期望 key "demos"（dict{str→int} 类型）。KeyError 被 fallback 捕获返回 np.zeros((64,64))，FocalLoss
    对全零 target 仍产生非零 loss（初始 ~0.13），掩盖了数据加载完全失败的事实。Worker 错误推理"occ_loss 非零=数据加载成功"。
  prevention: 1. 新数据管道上线后必须做端到端验证：检查实际 batch 中的 label 是否非零、是否有合理的空间结构（不只是检查 loss 值）。2.
    fallback 返回全零时应记录为 ERROR 级别日志（不是 warning），且累计 fallback 次数超过阈值时应中断训练。3. occ_loss
    下降不能作为数据加载成功的证据——随机初始化模型对全零 target 的 loss 本身就会下降。
  status: active
  context: occ_s0/s1/s2 在 westd-34685 上运行了约 12 分钟（~163 步），每步 ~7.1 次加载失败（batch_size=8），89%+
    样本使用全零 label。occ_loss 0.13→0.01 被误解为正常训练。Reviewer 通过分析 loss 收敛行为和日志错误率发现问题。
  fix: Kill 训练 → 重新生成 occ_index.json（改为 datasets.py 期望的 dict 格式含 demo 长度）或修改 datasets.py
    适配 → 验证非零 label → 重启训练。
- id: M010
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: Checkpoint 保存完整 merged model（15GB/个），3 seeds 撑爆 250GB 磁盘
  root_cause: OpenVLA-OFT 的 checkpoint 默认保存完整 merged model（~15GB），而非仅 LoRA adapter
    weights（<1GB）。save_freq=5000 意味着 50K 训练每 seed 10 个 checkpoint = 150GB/seed。3 seeds
    = 450GB，远超 250GB 磁盘。审批实验时未预估 checkpoint 总磁盘需求。
  prevention: 1. 审批实验前必须预估 checkpoint 磁盘需求：checkpoint 大小 × (total_steps / save_freq)
    × seeds，对比目标磁盘容量。2. LoRA fine-tuning 应只保存 adapter weights 而非 merged model。3. 配置
    save_total_limit 自动清理旧 checkpoint（如只保留最新 2 个）。4. 每台服务器设磁盘使用警戒线（80%），cron 监控报警。
  status: active
  context: westd-10894 磁盘 250GB，vanilla 3 seeds 已保存 5 checkpoints/seed × 15GB = 225GB。vanilla_s2
    在 step 25000 保存时磁盘满崩溃。s0/s1 将在 60 分钟内同样崩溃。
  fix: 立即清理旧 checkpoint（每 seed 保留最新 1 个），回收 ~180GB。长期：改为只保存 LoRA adapter weights +
    配置 save_total_limit。
- id: M011
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: SafeLIBERO ObstacleTracker 缓存 stale sim 引用，碰撞检测完全失效（CAR 永远 100%）
  root_cause: 'ObstacleTracker.__init__ 缓存 env.env.sim 引用，但 env.reset() 后 MuJoCo 创建新
    sim 实例。tracker.record_initial() 和 step() 读取的是旧 sim 的冻结位置，cur_pos - init_pos 恒等于
    0。加上 except Exception: pass 静默吞掉 body name 不匹配的错误，_initial_pos 可能为空导致 step() 什么都不检查。'
  prevention: '1. 物理仿真中的对象引用不应缓存——每次访问都应通过 env 动态获取。2. 禁止 except Exception: pass，至少要
    log warning。3. eval 脚本上线前必须做 sanity check：random policy 执行 N 步，位移指标应显著非零。4. 所有
    eval metric 必须有 trivial 基线验证（如碰撞检测：随机动作应有非零碰撞率）。'
  status: active
  context: SafeLIBERO eval dry-run 发现：20 个 episode 的 max_disp 严格等于 0.0。TSR=90% 看似正常但
    CAR=100% 是假结果。此 bug 影响 MVP 全部评估——vanilla 和 occ 条件的 CAR 都会报 100%，无法区分。如果没有 dry-run
    提前发现，会在训练完成后浪费大量时间在无效评估上。
  fix: '1. ObstacleTracker 改为动态访问 self.env.env.sim 而非缓存 self.sim。2. 去掉 except Exception:
    pass。3. _initial_pos 为空时打印 warning。4. 修复后用随机 policy 验证 max_disp >> 0。'
- id: M012
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: Worker 误读 tqdm resume 进度，将 vanilla_s2 正常 resume 报告为"从头重启"
  root_cause: finetune.py resume 模式下 tqdm 从 0 开始计数（L1150 在 log_step 中加 resume_step），Worker
    看到 tqdm 显示 5901/50005 就认为是从头重启，实际 log_step = 25000 + 5901 = 30901。同时 train.log
    和 train_resume.log 中有重复启动尝试的 crash 日志（GPU 已被占用），Worker 错误地解读为"原训练+resume均崩溃"。
  prevention: 1. resume 训练检查进度时，必须看 log_step（日志中的 step 数）而非 tqdm 显示值。2. 判断"训练崩溃"前必须检查
    nvidia-smi 确认 GPU 上是否有进程在跑。3. 存在多个日志文件时，以当前 PID 对应的日志为准，旧日志可能是之前失败的尝试。4. Reviewer
    此前已 warning 过误导性日志需清理，该警告被忽视导致此次误判。
  status: active
  context: vanilla_s2 PID 149428 实际在 GPU 2 上正常运行 resume（--resume True --resume_step
    25000），tqdm 从 0 计数的 5901 被 Worker 误报为"从头重启 step 5901/50005 (11.8%)"。实际进度 30901/50005
    (61.8%)，与 s0/s1 基本同步。此误报导致 Director 做了错误决策（D006"接受从头重启"）和错误 ROADMAP 更新。
  fix: Reviewer 独立核实发现误判。ROADMAP 已修正。
- id: M013
  date: '2026-05-20'
  category: communication
  severity: high
  summary: Paper Agent Worker 写 Implementation Details 时未读实际代码，6 处关键超参/架构/硬件描述与代码不符
  root_cause: Worker 写论文技术细节时依赖了早期设计文档或口头描述，未 SSH 到服务器读取 finetune.py 和 occ_head.py
    的实际实现。导致 occ_loss_weight 错 10 倍、FocalLoss α 方向反、occ head 架构完全错误（MLP vs ConvTranspose2d）、GPU

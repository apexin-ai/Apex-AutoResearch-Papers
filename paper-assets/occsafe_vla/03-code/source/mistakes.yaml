  fix: 打回重写，要求 Worker 在重写前先 SSH 读取实际代码文件，逐项填写。
- id: M014
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: cleanup_checkpoints.sh 删除了 resume 进程的 vla_path base model，导致 save checkpoint
    崩溃
  root_cause: cleanup 脚本只保留最新 2 个 checkpoint 目录，但未排除当前 resume 进程的 vla_path 所指 checkpoint。vanilla_s2
    从 25000_chkpt resume，当 40000_chkpt 出现时 cleanup 删除了 25000_chkpt。finetune.py save_training_checkpoint()
    调用 from_pretrained(vla_path) 加载 base model 做 LoRA merge，vla_path 指向已删除目录 → OSError。
  prevention: 1. Checkpoint cleanup 脚本必须检查所有运行中训练进程的 cmdline，排除 vla_path 指向的 checkpoint
    不被删除。2. 或者：LoRA fine-tuning 的 save 逻辑应改为只保存 adapter weights 而非每次 merge 完整模型（避免依赖
    vla_path）。3. resume 训练前验证 cleanup 脚本不会删除 resume 依赖的 checkpoint。4. 部署 cleanup 方案前做
    dry-run：列出将被删除的目录，与当前运行进程的 vla_path 交叉检查。
  status: active
  context: vanilla_s2 第三次失败：(1) 磁盘满 step 25K (2) resume 被误报为从头重启 (3) cleanup 删 resume
    base model 导致 step 40K 保存崩溃。cleanup_checkpoints.sh 是为解决问题 (1) 部署的，结果引入了新问题 (3)。
  fix: 从 35000_chkpt resume，禁用 vanilla_s2 目录的 cleanup（剩余 ~15K 步，最多 ~45GB 新 checkpoint，磁盘
    126GB 余量充足）。

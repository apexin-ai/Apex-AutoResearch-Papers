- name: Detach + LayerNorm OccHead (BatchNorm confound control)
  plan_id: plan_027
  description: Detach mode 下将 OccHead 的 BatchNorm2d 替换为 LayerNorm。排除 BatchNorm running
    statistics artifact 作为 Detach 有害的替代解释。
  expected_results:
    detach_ln_car: 0.748
    detach_ln_tsr: 0.83
    detach_bn_car: 0.746
    detach_bn_tsr: 0.812
    delta_car: 0.002
    collisions: 126
    total_episodes: 500
  result_rationale: 'Best tier 预测 Detach+LN 仍然有害 (CAR ~0.748 ≈ Detach+BN 0.746)，排除
    BatchNorm artifact。


    BatchNorm 在 Detach mode 下的 running statistics 基于 detached features 计算。

    这些 statistics 不参与 encoder 梯度计算（detach 阻断），不影响 encoder forward pass，

    仅影响 occ head 自身推理——而 eval 时只评估 action prediction。

    因此 BatchNorm 的存在不是 Detach 有害的原因。


    替换 LayerNorm 后，occ head 归一化机制改变，但 detach 切断梯度流，

    encoder 仍只接收 action_loss 梯度。LayerNorm 与 BatchNorm 在 Detach mode 下

    对 encoder 影响完全相同——零影响。CAR 保持 Detach 水平 (~0.748)。

    TSR 略高 (0.830 vs 0.812)，因为 LayerNorm 比 BatchNorm 在 detached features 上

    训练更稳定（无 running stats 漂移），但不改变 encoder 行为。


    Null result 的叙事价值极高：排除合理的 alternative explanation，

    使 "梯度流缺失是因果因素" 更稳健。

    '
  tables:
  - title: Detach Normalization Ablation
    columns:
    - Condition
    - Norm Type
    - CAR
    - TSR
    - vs Vanilla
    rows:
    - - Detach + BN (existing)
      - BatchNorm2d
      - 0.746 ± 0.002
      - 0.812 ± 0.163
      - -3.4pp
    - - Detach + LN (new)
      - LayerNorm
      - '0.748'
      - '0.830'
      - -3.2pp
    - - Vanilla
      - N/A
      - 0.780 ± 0.012
      - 0.907 ± 0.009
      - baseline
    - - Full OCC + BN
      - BatchNorm2d
      - 0.797 ± 0.032
      - 0.894 ± 0.050
      - +1.7pp
  figures_description:
  - 'Paired bar chart: Detach+BN (0.746) vs Detach+LN (0.748)，几乎等高，远低于 Vanilla 虚线
    (0.780)。Title: ''BatchNorm Is Not the Cause of Detach Harm''。'
  analysis: 'Detach+LN CAR (0.748) 与 Detach+BN (0.746) 差 0.2pp，在 Detach seed variance
    (σ=0.002) 内不可区分。

    排除 "Detach 有害是因为 BatchNorm running stats 在 mixed-precision 训练中的 numerical artifact"
    这一替代解释。

    结论：Detach 有害来自梯度流缺失本身，非 OccHead 架构细节。

    因果链最终环节确认：梯度流缺失 → (not BN artifact) → encoder 失去空间正则化 → CAR 退化。

    '
- name: 'Second Benchmark: LIBERO-Object'
  plan_id: plan_028
  description: 在 SafeLIBERO LIBERO-Object 上复制核心 ablation (Full OCC/Detach/Vanilla/Random
    OCC × 3 seeds)。测试核心发现在不同 task distribution 上的泛化性，回应 RC5。
  expected_results:
    vanilla_car: 0.81
    vanilla_tsr: 0.92
    vanilla_car_std: 0.015
    fullocc_car: 0.825
    fullocc_tsr: 0.915
    detach_car: 0.775
    detach_tsr: 0.845
    detach_tsr_std: 0.12
    random_car: 0.815
    random_tsr: 0.895
    detach_vs_vanilla_delta_car: -0.035
    detach_vs_vanilla_cohen_d: 3.2
    fullocc_vs_random_delta_car: 0.01
  result_rationale: 'Best tier 预测 LIBERO-Object 复制 LIBERO-Spatial 核心模式。


    LIBERO-Object task 分布偏重物体操作而非空间导航，但碰撞检测机制相同

    （物体-obstacle 接触检测）。绝对 CAR 值可能不同（LIBERO-Object baseline 可能更高，

    因为 object manipulation 任务中 obstacle 接触模式不同），但条件间相对关系保持：

    - Detach < Vanilla (-3.5pp, Cohen''s d ~3.2)：梯度流缺失的害处不依赖 task distribution

    - Full OCC ≈ Random OCC (1.0pp 差距)：空间内容次要，task-invariant

    - 梯度流条件 ≈ Vanilla (±1.5pp)：保护效应在不同 task 上泛化


    Detach TSR 不稳定性也应复制 (σ=0.120)，因为这是梯度流缺失导致 encoder 退化的固有表现，

    不依赖具体 task 分布。


    78 GPU-hours 投资回报极高，将核心发现从 single-benchmark observation

    升级为 cross-benchmark principle。


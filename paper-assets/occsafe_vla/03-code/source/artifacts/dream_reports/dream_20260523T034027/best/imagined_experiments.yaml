  analysis: 'CKA 提供表征层面证据。Detach 空间编码器中间层 (L9-18) 表征与 Vanilla 显著偏离 (CKA ~0.80)，

    形成 V-shape dip。这些正是 DINOv2 处理空间几何的关键层。

    Full OCC 通过梯度流保持与 Vanilla 近一致的表征 (CKA ~0.95) —— 梯度流是 "表征稳定器"，

    不是大幅改变 encoder（否则 CKA 也会低），而是防止 fine-tuning 中丢失预训练的空间结构信息。

    Detach 的偏移集中在 spatial layers 与 per-task 分析一致：T3/T5/T6 空间推理密集任务 Detach 系统性失败。

    CKA + gradient cosine 构成完整因果链：

    梯度流 → 梯度方向对齐 → encoder 表征稳定 → 空间推理保留 → CAR 保持。


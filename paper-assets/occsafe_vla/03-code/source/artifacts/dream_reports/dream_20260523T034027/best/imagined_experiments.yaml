    CAR ~0.775 与 Vanilla (0.780) 差 0.5pp，在 seed variance (σ=0.012) 内。


    机制：LoRA fine-tuning 前 15K steps 是 encoder 适应新任务的关键窗口。

    occ 梯度流在此期间为 encoder 空间层建立稳定的 spatial feature anchoring，

    此后 LoRA 的低秩约束 (rank=32, scaling=0.5) 限制 encoder 进一步偏离的幅度。

    加之 occ_loss 指数衰减，15K step 时权重已降至 ~0.0074 (原始 74%)，信号已在减弱。


    per-task 模式与 Vanilla 一致：T3/T5/T6 仍是弱点（碰撞密集任务），

    但无 Detach 式的系统性退化。T3 CAR ~0.40 vs Detach T3 CAR ~0.18，明显保持保护。


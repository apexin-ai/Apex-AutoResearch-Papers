  figures_description:
  - 'Line plot: x=encoder layer index (1-24), y=gradient cosine(action, aux)。三条线(Full
    OCC/Detach/Random OCC)。Full OCC 在 spatial layers (9-18) 展现明显正向 hump (~0.20-0.28)，Detach
    全程在零附近波动(-0.05~0.05)，Random OCC 有弱正 hump (~0.08-0.14)。配 3-seed 95% CI shaded region。'
  - 'Summary bar plot: per-condition mean gradient cosine with bootstrap 95% CI error
    bars。Full OCC 0.18 [0.12, 0.24], Detach 0.02 [-0.02, 0.06], Random OCC 0.09 [0.05,
    0.13]。Detach CI 跨零，Full OCC CI 不跨零。'
  analysis: '梯度余弦提供因果机制的直接证据。Full OCC 的梯度流使 action 和 aux 梯度在空间编码器层

    产生正向对齐 (cosine 0.24)：occupancy 任务迫使 encoder 保持空间几何编码，恰好也是 safe action 所需。

    Detach cosine ≈ 0 证实梯度流切断后 occ head 优化方向与 encoder action-only 轨迹完全脱耦。

    推断：缺少梯度流导致 encoder 失去 occupancy 任务能提供的隐式空间正则化，

    在 action-only fine-tuning 中更易偏离安全相关空间特征。

    Random OCC 中间 cosine (0.09) 与其中间 CAR (0.789) 一致——梯度流存在即可提供部分正则化。

    Full OCC > Random 的 cosine 差异解释了 Full OCC 略高 CAR 的边际优势 (0.797 vs 0.789)。

    '
- name: CKA Representation Analysis
  plan_id: plan_024
  description: 在 Full OCC/Detach/Vanilla/Random OCC 的 50K checkpoint 上，用相同 test batch
    计算 encoder 每层中间表征的 CKA，量化不同条件间表征结构的相似性。检验 feature preservation 假说。
  expected_results:
    cka_fullocc_vs_vanilla_mean: 0.96
    cka_fullocc_vs_vanilla_spatial_layers: 0.95
    cka_detach_vs_vanilla_mean: 0.85
    cka_detach_vs_vanilla_spatial_layers: 0.8
    cka_random_vs_vanilla_mean: 0.92
    cka_random_vs_vanilla_spatial_layers: 0.91
    cka_fullocc_vs_detach_spatial_layers: 0.78
    cka_detach_vs_random_spatial_layers: 0.82
  result_rationale: 'Full OCC vs Vanilla CKA 高 (spatial layers ~0.95)：梯度流增加了 occ 监督信号，

    但该信号与 action 任务的空间需求高度一致（gradient cosine 证据），encoder 表征

    未被 occ 任务 "拉偏"，保持与纯 action 训练 (Vanilla) 高度相似的表征结构。

    Full OCC CAR 仅比 Vanilla 高 1.7pp，也说明表征差异极小。


    Detach vs Vanilla CKA 低 (spatial layers ~0.80)：Detach 条件下 encoder 虽名义上只接收 action_loss

    梯度（与 Vanilla 相同），但 occ head 的参数初始化消耗了 torch random state，导致后续

    LoRA dropout 等随机操作产生系统性偏移。更关键的是，Detach 缺少 occ 梯度流的正则化约束，

    encoder 在 action-only fine-tuning 下对空间层的更新更自由、更不稳定，

    50K steps 后累积为可观的表征偏移——尤其在空间编码器中间层 (L9-18) 形成 "V 形 dip"。

    Detach CAR 退化 (-3.4pp) 的行为学表现与这一表征偏移在空间层的集中是一致的。


    Random OCC vs Vanilla CKA 中等 (spatial layers ~0.91)：随机标签的梯度流提供正则化

    （约束 encoder 更新幅度），防止表征大幅偏离，但随机方向监督使表征稍偏离 Vanilla。

    '

narrative_guidance: '核心 "梯度流必要性" claim 被 BatchNorm confound 消解。CKA 和 gradient cosine
  分析均无机制信号——表征高度相似、梯度几乎正交。Cutoff 第 3 seed 崩溃导致巨大方差， 无法支撑 temporal 叙事。若跑 plan_027（Detach+LayerNorm），LayerNorm
  版 Detach 不再损害，直接证实 BN running stats 是 confound。即使不跑 027，reviewer 也会提出 "BN eval mode
  uses training running stats from detached forward passes" 攻击， 作者无法反驳。新 framing 需完全放弃
  mechanism paper 定位，转向 "Hidden Pitfalls of Auxiliary Heads in VLA Fine-tuning: A
  Cautionary Study"， 以 BN artifact 本身为贡献、5 条件 factorial 设计为方法论贡献、 "spatial auxiliary
  supervision provides no safety benefit" 为核心 negative finding。

  '

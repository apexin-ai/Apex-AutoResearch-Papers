  figures_description:
  - 'Per-layer gradient cosine heatmap：X 轴为 encoder 层（DINOv2 L1-L24, SigLIP L1-L27），Y
    轴为条件（Full OCC, Random）。颜色编码 cosine 值。 整个 heatmap 几乎全是中灰色（值 ≈ 0），偶有浅蓝/浅红色噪声。 右侧
    colorbar 范围 [-0.1, 0.1]。标题注释 "No systematic gradient alignment or conflict detected"。

    '
  - 'Gradient norm 条形图：4 条件 × 3 组分（action, occ, total）。 所有条件的 total norm 相似（0.079-0.085），occ
    norm 远小于 action norm （~0.03 vs ~0.065）。Detach 和 Vanilla 的 total norm 几乎相同。

    '
  analysis: 'Gradient 分析是 worst 档的核心 null result。两个关键发现摧毁 mechanism paper： (1) Action-occ
    梯度正交 → 无 gradient diversity/conflict 信号 → "auxiliary gradient flow provides regularization
    through gradient diversity" 假说不成立。 (2) Occ gradient norm (0.031) 远小于 action gradient
    norm (0.065) → occ loss 对 encoder 更新的贡献仅约 4.6%（0.031/0.065 * λ衰减后更低）→ 梯度流效应太弱，不太可能是性能差异的因果原因。
    Reviewer 会说："如果 occ 梯度如此微弱且与 action 梯度正交， 那 gradient flow 怎么可能是保护因素？更可能的解释是 BN
    在 eval 模式下 使用的 running stats 不同——这是一个 evaluation artifact，不是训练效应。"


- name: Gradient Cosine & Norm Analysis — 无机制信号
  plan_id: plan_023
  description: '在 50K checkpoint 上对 Full OCC / Random OCC / Detach / Vanilla 条件 执行
    1-epoch forward+backward pass，记录 (1) action loss 和 occ loss 对 shared encoder 各层的梯度余弦相似度，(2)
    各层梯度范数。 测试 Hypothesis 3（gradient diversity/conflict）。

    '
  expected_results:
    gradient_cosine:
      fullocc_action_vs_occ:
        layer_mean: 0.012
        layer_std: 0.038
        range:
        - -0.04
        - 0.05
      random_action_vs_occ:
        layer_mean: -0.008
        layer_std: 0.042
        range:
        - -0.05
        - 0.04
      detach_action_vs_occ: N/A (occ gradients detached, no encoder gradient)
    gradient_norms:
      fullocc_encoder_grad_norm: 0.0847
      random_encoder_grad_norm: 0.0823
      vanilla_encoder_grad_norm: 0.0791
      detach_encoder_grad_norm: 0.0802
      fullocc_action_grad_norm: 0.0654
      fullocc_occ_grad_norm: 0.0312
    per_layer_cosine_fullocc:
      dino_layer_8: 0.003
      dino_layer_16: 0.018
      dino_layer_24: -0.007
      siglip_layer_8: 0.025
      siglip_layer_16: 0.011
      siglip_layer_24: -0.015
  result_rationale: '在 worst 档下，gradient cosine 分析产生 null result。所有条件的 action 和 occ
    梯度在 shared encoder 层几乎正交（cosine ≈ 0），意味着两个 loss 的 梯度方向彼此独立。这排除了 "gradient conflict"（负
    cosine）和 "gradient alignment"（正 cosine）两个假设。 关键原因：(1) occ head 输入是 2176d 拼接特征经
    Linear(2176→256) 降维， 梯度回传到 2176d 空间后被稀释到高维中的一个低秩子空间； (2) action loss 通过 LLM backbone
    回传到 encoder，路径极长（7.65B params）， 梯度信号经过大量非线性变换后失去方向性。 两条梯度路径在如此高维空间中自然正交——这是维度的诅咒，不是机制信号。
    Gradient norms 也相似（0.079-0.085 范围），Detach（0.080）与 Vanilla（0.079） 几乎无差异，说明 occ
    loss 的额外梯度贡献微乎其微（occ norm 仅 0.031， 远小于 action norm 0.065）。

    '

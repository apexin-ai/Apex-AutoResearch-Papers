    mechanism_analysis_status: NULL — CKA and gradient cosine provide no mechanism
      signal
    temporal_dynamics_status: ANOMALOUS — U-shaped dose-response contradicts gradient
      flow hypothesis
    paper_viability: MARGINAL — needs complete reframe from mechanism to cautionary
      study
    key_surviving_contributions:
      C1_revised: BN running stats in detached auxiliary heads cause eval-time performance
        degradation in VLAs
      C2_unchanged: 5+ condition factorial study design methodology for VLA safety
        analysis
      C3_revised: Spatial auxiliary supervision (BEV occ, depth) provides no safety
        benefit over no auxiliary (or random)
    reviewer_attack_surface:
      RC1_BN_artifact: FATAL if plan_027 confirms — entire gradient flow claim is
        a BN confound
      RC4_single_VLA: MEDIUM — acknowledged limitation
      RC5_single_benchmark: MEDIUM — acknowledged limitation
      RC4_RC5_combined: HIGH — single VLA + single benchmark + BN artifact = n=1 engineering
        observation
  result_rationale: 'Worst 档的联合效应是毁灭性的。三条独立证据线同时指向 BN artifact： (1) CKA 高相似度 → Detach
    不改变表征 → 损害不在 encoder 层面； (2) Gradient cosine ≈ 0 → 梯度流效应太弱 → 不是保护因素； (3) Cutoff
    U 形曲线 → 中间截断最差 → BN mismatch 假说的预测。 加上 plan_027 的 kill shot（Detach+LN ≈ Vanilla），核心
    claim 彻底崩溃。 但 paper 仍有价值——BN pitfall 本身是一个实用发现，VLA 社区 （RT-2, Octo, OpenVLA 等）广泛使用
    auxiliary heads 但没人系统研究过 detach mode 下 normalization 层的行为。作为 cautionary study
    / findings paper，仍可冲 CoRL，但需要： (1) 极度精准的 writing，不 overclaim； (2) 把 BN artifact
    作为正面贡献而非尴尬的 confound； (3) 强调方法论贡献（factorial design + SafeLIBERO 协议）； (4) "spatial
    content irrelevant" 作为清晰的 negative finding。

    '

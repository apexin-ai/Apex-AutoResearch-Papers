    gradient cosine heatmap（全灰）， (C) dose-response U 形曲线。标题："Mechanism analysis reveals
    no gradient-level or representation-level differences — harm traces to BatchNorm
    evaluation artifact."

    '
  analysis: Worst 档的论文仍然可以投 CoRL 2026，但定位必须从 mechanism paper 彻底转为 cautionary findings
    paper。核心价值不再是 "why gradient flow matters" 而是 "what goes wrong when you detach
    auxiliary heads with BatchNorm in VLAs"。 这是一个 niche 但有用的贡献——VLA fine-tuning 文献中缺乏对
    auxiliary head 设计选择的系统分析，这篇论文填补了这个空白。 接受概率估计：30-40%（取决于 reviewer 是否认为 BN artifact
    足够 novel、 是否接受 single VLA + single benchmark 的局限性、以及 writing 质量）。 关键风险：reviewer
    可能认为 "BatchNorm eval artifact" 是已知问题 （BN 在 transfer learning 中的 pitfall 早有文献），在
    VLA 上重复验证 不构成足够的 novelty。应对：强调 VLA-specific context（multi-modal encoder、 极大 backbone
    上的 LoRA、指数衰减的 aux loss weight）使问题不 trivial。

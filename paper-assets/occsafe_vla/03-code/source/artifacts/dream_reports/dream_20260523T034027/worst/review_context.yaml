    机制：BatchNorm2d 在 training mode 中使用 batch statistics，但在 eval mode 中 使用 running_mean
    和 running_var（通过 exponential moving average 在训练中累积）。 Detach 模式下，occ head 接收 detached
    encoder features——这些特征的分布 与 encoder 在 action loss 下继续更新后的真实分布逐渐偏离。BN 的 running
    stats 反映的是 detached 分布，不是 eval 时的实际分布。这种 mismatch 通过 BN 的 normalize 操作传播到 occ
    head 输出。虽然 Detach 切断了从 occ 到 encoder 的梯度， occ head 的 forward pass 仍然执行——如果 framework

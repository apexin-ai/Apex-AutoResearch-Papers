    counts, early termination）。与 Tier 1 exception signal（binary fault presence）不同，loop
    pattern 的学习对 LoRA 初始化更敏感。Seed123 落入较差的 basin，对 loop→verdict mapping 的 fail 类学习不充分（fail_recall
    从 seed42 的 82% 降至 ~75%）。4.5pp drop 对应 ~53 个额外 errors，主要集中在 loop 正常但代码实际有 non-loop-related

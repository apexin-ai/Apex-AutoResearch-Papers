  analysis: Drop 0.50pp 在统计上可能 borderline significant (McNemar p≈0.03-0.08)，但 practical
    significance 极小。支持论文叙事：'exception content itself carries the fault signal; structural
    formatting is optional, providing at most marginal alignment benefit.' 这比 'marker
    is required' 更 fundamental 的 claim。

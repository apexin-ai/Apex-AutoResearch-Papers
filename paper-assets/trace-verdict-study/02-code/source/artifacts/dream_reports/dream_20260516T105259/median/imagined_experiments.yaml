tier: median
narrative_guidance: 'Claim 1 从 ''exception dominates'' 调整为 ''exception is sufficient
  and simplest — matching or exceeding VOTA with ~16x fewer tokens and no execution
  reasoning requirement.'' nomarker 结果正面转化: exception content itself carries fault
  signal, structural formatting optional. Claim 3 Tier 2 加 seed-dependent stability
  caveat. 1.5B 数据作 supplementary evidence。'
imagined_experiments:
- name: exception_only_nomarker_seed42
  plan_id: nomarker_ablation
  description: Qwen-7B exception_only 去除 [ERROR] format marker，保留 exception type+message
    内容
  expected_results:
    accuracy: 0.9933
    accuracy_ci_lower: 0.9882
    accuracy_ci_upper: 0.9975
    n: 1190
    pass_precision: 1.0
    pass_recall: 0.9906
    pass_f1: 0.9953
    fail_precision: 0.9769
    fail_recall: 1.0
    fail_f1: 0.9883
    errors: 8
    drop_vs_marker: 0.005
    train_loss: 0.115
  result_rationale: 在 median 档下，[ERROR] marker 不是 active ingredient。SFT 模型通过 exception
    content 的语义（type name + message 描述 fault 本质）学到 pass/fail mapping，而非依赖 [ERROR]
    关键字的 regex-like 检测。证据：regex baseline B1 ([ERROR] presence) 仅 93.45%，远低于 SFT 的
    99.83%——说明 SFT 学习的是 content 而非 marker。去除 marker 后 drop 仅 0.5pp（99.83→99.33%），8
    errors 与 DeepSeek seed42/456 完全一致（均 8/1190），暗示这些额外 errors 来自 borderline samples
    在没有格式化对齐辅助时的轻微混淆，但不改变核心能力。

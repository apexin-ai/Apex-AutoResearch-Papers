    # Dream Review Report


    ## Paper: The Minimal Sufficient Representation for Verdict Prediction


    **Overall Score: 3 / 6 (Borderline Reject)**


    ---


    ## Summary


    The paper studies verdict prediction (binary pass/fail classification of code–test
    pairs) and asks what trace representation is minimally sufficient. Through systematic
    ablation of 6 trace representations across 4 code LLMs, the paper finds that exception-only
    summaries (~50 tokens) match or exceed richer VOTA traces (~800 tokens). Additional
    experiments show zero contribution from format markers, high seed variance for
    loop-only signals, and a causal link between training-time truncation and DeepSeek''s
    VOTA degradation. The paper formalizes a "minimal sufficient representation principle"
    for verdict tasks.


    ---


    ## Strengths


    1. **Systematic ablation design.** Six trace representations × four models with
    three-seed robustness checks. The experimental matrix is well-structured and the
    comparisons are meaningful.


    2. **Information density decomposition (Section 4.2).** Decomposing the full-trace-to-VOTA
    gap into gradient dilution (26%) and information overload (74%) via label-only
    loss ablation is analytically interesting and provides mechanistic insight beyond
    raw accuracy comparisons.


    3. **Causal truncation analysis for DeepSeek.** The group analysis (truncated
    samples: 83.04% vs. intact: 100%, Fisher exact p ≈ 0) provides convincing causal
    evidence for the VOTA gap, rather than leaving it as a vague "model capability"
    explanation.


    4. **Format marker ablation thoroughness.** Six independent training runs (3 seeds
    × 2 conditions) producing identical results — including the same 2 error sample
    IDs — is strong evidence for a null effect. The information-theoretic framing
    (I(verdict; marker | exception_content) = 0) is precise.


    5. **Honest limitations.** The paper acknowledges the DeepSeek truncation confound
    and narrow dataset scope in Section 5.5 rather than sweeping them away.


    6. **Writing quality.** Clear, well-organized, and concise. The four-stage structure
    in the introduction maps cleanly onto the experimental sections.


    ---


    ## Weaknesses


    ### Major


    **W1. AE-only (99.92%) outperforms exception-only (99.83%) but receives no analysis.
    [idea-level]**


    Table 1 includes an "AE-only" row (assertion/expected-value component only) that
    achieves 99.92% accuracy with ~60 tokens — numerically higher than exception-only
    (99.83%, ~50 tokens) and the best result in the table. Yet the paper builds its
    entire narrative around exception-only as "the minimal sufficient representation."
    AE-only is never discussed in the text: no statistical comparison with exception-only,
    no cross-model validation, no explanation of why exception-only was chosen as
    the focal representation despite AE-only''s equal-or-better performance.


    This is a fundamental gap. If both fault-indicator components independently achieve
    near-ceiling performance, the paper''s central contribution should be about *fault
    indicator isolation in general*, not specifically about exception signals. The
    current framing leaves a glaring question: why isn''t AE-only the minimal sufficient
    representation? The paper must either (a) show exception-only is statistically
    or practically preferred over AE-only, or (b) reframe the contribution around
    the broader insight that *any single fault indicator* suffices.


    **Why Major:** This directly undermines the paper''s central claim and title.
    A reviewer would immediately notice that the paper''s own best result contradicts
    its narrative framing.


    **W2. Task is near-trivially solvable, questioning the significance of the representation
    finding. [idea-level]**


    Section 4.5 mentions a regex baseline B5 (detecting [ERROR] marker presence) achieving
    99.33%. The SFT exception-only model at 99.83% improves by only 0.50pp (6 fewer
    errors out of 1,190 samples). For the no-marker variant, the exception-only signal
    is essentially binary: has exception text → fail; empty → pass. This means a simple
    string-presence heuristic achieves near-ceiling performance, and the SFT model''s
    contribution over this heuristic is marginal.


    The "minimal sufficient representation" finding risks being a restatement of "verdict
    prediction on this dataset reduces to exception detection, which is a near-trivial
    binary classification." The paper should engage directly with this concern: either
    demonstrate settings where the SFT model''s advantage over heuristics is substantial,
    or explicitly reframe the contribution as *explaining why the task is trivially
    solvable* (which has value for practitioners deciding how much trace engineering
    to invest).


    **Why Major:** A top venue reviewer will ask "couldn''t I just grep for exceptions?"
    — and the honest answer, based on the paper''s own data, is "yes, to within 0.50pp."
    The paper needs a convincing response.


    **W3. Narrow evaluation scope with insufficiently hedged claims. [idea-level]**


    The paper evaluates a single task (verdict prediction) on a single dataset combination
    (HumanEval + MBPP-sanitized, 591 problems, 5,910 samples). These are small competitive-programming
    problems where failing cases predominantly produce Python exceptions. Real-world
    verdict prediction involves:


    - Logic bugs producing wrong output without exceptions (exception-only trace is
    empty, identical to passing cases)

    - Timeout / performance failures

    - Concurrency and non-determinism bugs

    - Multi-file, multi-dependency codebases


    The abstract claims to "formalize a minimal sufficient representation principle
    for verdict tasks" and the title states this as a general finding. Section 5.5
    acknowledges narrow scope in one paragraph, but the title, abstract, contributions
    list, and conclusion all present the finding without qualification. The gap between
    evidence scope and claim generality is too wide for a top venue.


    **Why Major:** The contribution''s value depends critically on whether it generalizes
    beyond the specific conditions tested. Without even a second dataset or task variant,
    the "principle" is an observation from one experiment.


    **W4. Severely under-cited related work. [presentation-level]**


    Only 3 references in the entire paper. Missing engagement with:

    - Software testing / mutation testing literature (verdict prediction has deep
    roots here: Papadakis & Le Traon, DeVore-McDonald & Brun, etc.)

    - Program analysis and fault localization beyond TRACED

    - Code understanding benchmarks and datasets (CodeXGLUE, SWE-bench, Defects4J)

    - Representation learning / information sufficiency theory

    - LoRA / PEFT methodology literature


    A top venue expects 20–40 references. Three references does not establish adequate
    context for the claims made. This also makes the "first to study trace SFT for
    decoder-based verdict prediction" novelty claim unverifiable — the reader cannot
    assess what the paper is positioned against.


    **Why Major (presentation-level):** While flagged as presentation for dream review
    purposes, this would be an immediate red flag at any venue. The paper cannot establish
    its novelty or contextualize its findings with 3 references.


    ### Minor


    **W5. Class imbalance not addressed.** The 71.5/28.5 pass/fail split means a majority-class
    baseline achieves ~71.5%. The fail-class F1 scores are notably lower than pass
    F1 across all conditions (e.g., loop-only seed 123: pass F1 = 0.838, fail F1 =
    0.650). The paper reports only accuracy as the primary metric; per-class performance
    deserves more attention, especially for the minority fail class which is the practically
    important one.


    **W6. Information density decomposition not validated cross-model.** The 74/26
    decomposition (Section 4.2) is presented as Contribution (2) but comes from a
    single experiment on Qwen-7B. No evidence it holds on DeepSeek, CodeLlama, or
    Qwen-1.5B. A single-model result should not be listed as a general contribution.


    **W7. DeepSeek seed123 outlier (91.09%) insufficiently investigated.** The paper
    attributes it to "LoRA initialization landing in a suboptimal basin" but provides
    no further analysis — no gradient analysis, no per-epoch trajectory, no investigation
    of which sample types are affected beyond fail recall. This is a 8.2pp drop that
    the paper largely hand-waves.


    ---


    ## Experiment Coverage Assessment


    Comparing against the full experimental design specification: all 9 planned experiments
    are reflected in the paper (Qwen-1.5B VOTA + full trace, loop-only seeds 123/456,
    no-marker seeds 42/123/456, CodeLlama-13B exception/no-trace/VOTA). Coverage is
    complete. The narrative adjustments recommended in the experimental design (reframing
    from "exception dominance" to "minimal sufficient representation," downgrading
    loop-only from "stable Tier 2" to "variable behavioral signal") are implemented
    in the paper text.


    ---


    ## Questions for Authors


    1. Why is AE-only not the focal representation, given it achieves higher accuracy
    (99.92% vs. 99.83%) at comparable token cost (~60 vs. ~50)?

    2. What fraction of fail-class samples in the dataset involve exceptions vs. wrong-output-only
    failures? If the vast majority involve exceptions, the finding is expected by
    construction.

    3. Would the minimal sufficient representation principle hold on a dataset with
    predominantly logic-error failures (no exceptions)?

    4. Can you provide the regex/heuristic baseline accuracy for each model, not just
    Qwen-7B?


    ---


    ## Overall Assessment


    The paper asks a well-motivated question (what trace information matters for verdict
    prediction?) and answers it with a systematic experimental design. The ablation
    across 6 representations and 4 models is thorough, the truncation causal analysis
    is convincing, and the format marker null result is cleanly demonstrated.


    However, three idea-level issues limit the contribution: (1) the paper''s own
    AE-only result contradicts the exception-centric narrative framing; (2) the task
    appears near-trivially solvable by simple heuristics, questioning whether the
    representation finding is a meaningful advance or a tautology; (3) the single-task,
    single-dataset evaluation cannot support the general "principle" the paper claims.
    Combined with severely thin related work, the paper reads as a competent technical
    report that would benefit from a second dataset/task, engagement with the AE-only
    result, and a more honest scoping of claims before resubmission to a top venue.


    **Recommendation:** Borderline Reject. Resubmit after addressing AE-only framing,
    adding a second evaluation setting, expanding related work, and tightening claim
    scope to match evidence.


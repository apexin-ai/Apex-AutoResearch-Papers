    # Review Report: Exception Events Are the Minimal Sufficient Signal for Execution-Trace-Based
    Verdict Prediction


    ## Overall Assessment


    **Score: 3 / 6 (Weak Reject)**


    The paper is well-executed empirically—systematic ablations across 4 models, 3
    architecture families, thorough seed robustness, and clean presentation. However,
    the central finding is near-tautological, the dataset is narrow, and the practical
    contribution is unclear given that a simple regex baseline achieves 99.33% on
    the same task. The paper carefully documents an expected phenomenon rather than
    uncovering a surprising or actionable insight.


    ---


    ## Summary


    The paper studies what components of execution traces are most useful for verdict
    prediction (pass/fail classification) when used for SFT. Through ablation across
    four code LLMs (Qwen-7B, Qwen-1.5B, DeepSeek-6.7B, CodeLlama-13B), the authors
    show that exception events alone (`[ERROR] type: message`) achieve ≥99.3% accuracy
    on all models, outperforming richer representations (VOTA, full trace). They decompose
    the compression benefit (74% information density, 26% gradient dilution), identify
    a two-tier diagnostic hierarchy, and show the `[ERROR]` marker contributes ~3pp
    as a learned anchor.


    ---


    ## Strengths


    ### S1: Thorough experimental design

    The paper covers 4 models across 3 architecture families (Qwen, DeepSeek, LLaMA)
    and scales (1.5B–13B). The component ablation (exception-only, ae-only, loop-only,
    label-only, nomarker) is systematic and well-structured. Seed robustness with
    3 seeds on key conditions adds credibility. All imagined experiments from the
    design document appear to be reflected in the paper.


    ### S2: Clean information density decomposition

    The label-only loss ablation (§4.2) is a clever experimental design that isolates
    gradient dilution from information overload. The 74/26 split is a concrete, reproducible
    finding. The observation that this ratio is approximately scale-invariant (17.7pp
    gap on 1.5B vs. 17.6pp on 7B) is a nice quantitative insight.


    ### S3: Honest error analysis and limitations

    The irreducible error analysis (§5.1) identifying `GeneratorExit` as a `BaseException`
    corner case is excellent scientific practice. The paper is transparent about the
    DeepSeek truncation confound (§5.2), the seed 123 outlier (§5.4), and the narrow
    dataset scope. The discussion of token-level loss vs. verdict accuracy (§5.3)
    is a genuinely useful observation for practitioners.


    ### S4: Well-structured presentation

    The paper is clearly written with a logical progression from main results → decomposition
    → hierarchy → fine-grained ablations. Tables are informative and consistently
    formatted. The narrative arc (exception dominance → why it works → what it means)
    is easy to follow.


    ### S5: Marker ablation provides mechanistic depth

    The nomarker experiment (§4.4) goes beyond surface-level findings to probe *how*
    the model uses exception information. Showing that nomarker (96.9%) still substantially
    exceeds regex (93.6%) demonstrates the model learns semantic patterns beyond keyword
    matching.


    ---


    ## Weaknesses


    ### W1: Near-tautological central finding (Major)

    The core claim—that exception events are the "minimal sufficient signal" for verdict
    prediction—is close to a truism for this dataset. In HumanEval/MBPP, failing test
    cases almost universally produce exceptions (runtime errors or assertion failures
    from `assert` statements in tests). The presence of an exception is therefore
    nearly perfectly correlated with the pass/fail label *by construction*. This is
    confirmed by the paper''s own regex baseline B5 (99.33%), which simply checks
    for `[ERROR]` presence. The SFT model (99.83%) improves over regex by only 0.5pp—a
    margin that barely exceeds the representation''s irreducible error floor (2 samples
    from GeneratorExit). The paper''s extensive SFT apparatus adds almost nothing
    over a 5-line regex.


    The paper frames this as "verdict prediction is fundamentally a fault detection
    task, not an execution reasoning task," but this characterization is dataset-dependent.
    In HumanEval/MBPP, failures are *loud* (they throw exceptions). In real-world
    software, many bugs are *silent*—wrong return values, off-by-one errors, logic
    errors, performance regressions, race conditions—none of which produce exceptions.
    The paper''s "minimal sufficient signal" is only minimal and sufficient for a
    dataset where failure ≈ exception.


    ### W2: Extremely narrow dataset scope (Major)

    591 problems from HumanEval + MBPP-sanitized, with 10 generated solutions each.
    These are small, self-contained competitive programming problems with simple test
    suites (typically 1–3 `assert` statements). The generalizability to any practical
    setting is highly questionable:


    - Real test suites have dozens to hundreds of test cases with complex setup/teardown

    - Production code failures are often assertion-free (returning wrong values, producing
    incorrect outputs)

    - The 71.5%/28.5% pass/fail split is somewhat balanced, but real CI/CD has far
    more passing than failing runs

    - The 10 solutions per problem are LLM-generated—they may share systematic failure
    patterns (e.g., similar types of errors) that inflate the apparent effectiveness
    of exception-based detection


    The paper acknowledges this in Limitations but still makes sweeping claims ("minimal
    sufficient diagnostic signal") in the title and abstract without qualifying them
    to this specific dataset.


    ### W3: Unclear practical motivation (Major)

    If a regex achieves 99.33% on this task, what is the justification for SFT? The
    paper never directly addresses this question. Possible answers—generalization
    to harder datasets, deployment as part of a larger pipeline, or learning subtle
    exception semantics—are not explored. Without a practical use case where SFT meaningfully
    outperforms simple heuristics, the contribution reduces to "we trained LLMs to
    approximately learn a regex rule, and showed they do it well."


    ### W4: Missing critical baseline analyses (Moderate)

    - **What fraction of failing test samples actually produce exceptions?** This
    number is essential to interpret the results but is never reported. If 99%+ of
    failures produce exceptions, the finding is trivially expected.

    - **Simple classifier baselines**: No comparison with logistic regression on exception
    presence/absence, zero-shot LLM classification, or majority-class voting.

    - **The regex baseline (B5 = 99.33%) is mentioned once in §4.4 context but never
    appears in the main results tables.** This is a critical omission—it should be
    in Table 1 alongside the SFT conditions to show how much (or little) SFT adds.


    ### W5: DeepSeek results weaken cross-model claims (Moderate)

    Two issues: (1) full_trace collapsed entirely due to training-time truncation—a
    missing cell in Table 1; (2) exception-only has a bimodal seed distribution (99.33%
    vs. 91.09%, σ=4.76pp). The paper reports the median (99.33%) in Table 1, which
    is defensible but optimistic. These issues don''t invalidate the findings but
    they reduce the effective N for cross-model claims from "4 models" to closer to
    "2.5 models with clean results."


    ### W6: Information density decomposition has a confound (Moderate)

    The label-only ablation compares full-trace-with-loss-masking vs. VOTA. But VOTA
    doesn''t just mask loss—it changes the input representation entirely (shorter,
    structured, different tokens). The "information density" attribution conflates
    input filtering, attention allocation, and positional encoding effects. A cleaner
    comparison would be full-trace-with-loss-masking vs. exception-only-with-standard-loss,
    which would isolate the pure input content effect.


    ### W7: Thin related work (Minor)

    Only 4 references, all from the trace-augmented LLM literature. The paper ignores
    substantial related work in:

    - Software defect prediction (Kamei et al., 2013; Wang et al., 2016)

    - Fault localization using execution spectra (Abreu et al., 2007; Wong et al.,
    2016)

    - Test result prediction in CI/CD (Luo et al., 2019)

    - Binary classification from structured features (decades of ML literature)


    The claim "our work is the first to study decoder-based verdict prediction" needs
    broader context. The specific instantiation may be novel, but the task and key
    insight are not.


    ### W8: Missing F1/precision/recall for key conditions (Minor)

    Table 1 (main results) and Table 4 (component ablation) report only accuracy.
    Given the 71.5/28.5 class imbalance, accuracy alone is insufficient. Pass F1 and
    Fail F1 are reported for some conditions in Tables 3, 7, 8 but not uniformly.
    The nomarker condition''s per-class breakdown is entirely absent.


    ### W9: CodeLlama-13B is single-seed only (Minor)

    The 4th model is tested with only one seed per condition, unlike Qwen-7B (3 seeds)
    and DeepSeek (3 seeds on exception-only). This is presented in §4.6 and Table
    8 but the lack of seed robustness data for CodeLlama limits its contribution to
    the cross-model story.


    ---


    ## Experiment Coverage Assessment


    Cross-referencing with the experiment design document, all planned experiments
    are reflected in the paper:

    - Qwen-1.5B VOTA/full-trace: ✓ (Tables 1, 3)

    - Nomarker ablation 3 seeds: ✓ (Table 5)

    - Loop-only seeds 123/456: ✓ (Table 7)

    - CodeLlama-13B 3 conditions: ✓ (Table 8)

    - Cross-model synthesis: ✓ (Table 9)


    Coverage is complete. The narrative integrates all experiments coherently.


    ---


    ## Questions for Authors


    1. What fraction of failing test samples in the dataset produce at least one exception?
    If this number is >98%, how do you distinguish your SFT contribution from exception-presence
    detection?


    2. Why isn''t the regex baseline (B5 = 99.33%) included in Table 1? The gap between
    regex and exception-only SFT (0.5pp) is arguably the most important number in
    the paper for assessing practical contribution.


    3. Have you evaluated on datasets where failures don''t always produce exceptions
    (e.g., wrong-output bugs in APPS, CodeContests, or SWE-bench)? Even a pilot study
    would significantly strengthen the claims.


    4. The 39.5% training data duplication means the model sees ~2,858 unique inputs.
    Could the high exception-only accuracy simply reflect memorization of a small
    pattern space rather than generalizable learning?


    5. For the information density decomposition: have you tried exception-only with
    label-only loss (i.e., masking the exception tokens themselves)? This would test
    whether the model uses exception content semantically or merely detects its presence
    during generation.


    ---


    ## Minor Issues


    - Table 1: DeepSeek full_trace should show "—†" consistently (it does, but the
    footnote is small and easy to miss)

    - Table 4: Pass F1 and Fail F1 columns are entirely "—" — consider removing or
    populating them

    - §4.1 mentions "three patterns emerge" but lists them as bold paragraphs rather
    than numbered items, creating a slight structural mismatch

    - The term "VOTA gap" is used to mean both (exception − VOTA) and (VOTA − full_trace)
    in different contexts; consider consistent terminology

    - References: Ni et al. (2024) is cited but listed as 2025 in the bibliography
    (Findings of EMNLP, 2025)


    ---


    ## Detailed Scoring


    | Criterion | Score (1-6) | Notes |

    |-----------|-------------|-------|

    | Novelty | 2 | Finding is near-tautological for this dataset; insight not surprising
    |

    | Significance | 2 | Narrow dataset, unclear practical impact, regex achieves
    99.33% |

    | Soundness | 4 | Methodology is correct; ablations well-designed; some confounds
    acknowledged |

    | Presentation | 5 | Clear writing, good tables, logical structure |

    | Reproducibility | 4 | Setup described well; dataset is public; some missing
    details (exact regex rules) |

    | Completeness | 3 | Missing key baselines, thin related work, limited F1 reporting
    |


    **Overall: 3 (Weak Reject)**


    The paper demonstrates competent empirical methodology but addresses a question
    whose answer is largely predetermined by the dataset''s failure characteristics.
    The gap between the simple regex baseline (99.33%) and the best SFT model (99.83%)
    is too small to justify the SFT approach as a research contribution. To strengthen
    the paper, the authors should: (1) evaluate on datasets with diverse failure modes
    beyond exceptions, (2) include the regex baseline prominently in the main results,
    and (3) articulate a practical use case where SFT provides meaningful value over
    heuristic approaches.

    '

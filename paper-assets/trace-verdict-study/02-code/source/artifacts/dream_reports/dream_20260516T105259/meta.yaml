  - name: qwen15b_vota_seed42
    plan_id: plan_004_extension
    description: 'Qwen-2.5-Coder-1.5B 上 VOTA trace SFT。验证 VOTA 跨规模表现， 预期 Tier 2 组件（loop
      compression）在弱模型上引入更大 noise penalty。

      '
    expected_results:
      accuracy: 0.91
      accuracy_ci_lower: 0.893
      accuracy_ci_upper: 0.927
      pass_precision: 0.895
      pass_recall: 0.99
      pass_f1: 0.94
      fail_precision: 0.965
      fail_recall: 0.715
      fail_f1: 0.822
      lift_vs_notrace: 0.237
      gap_vs_exception_only: -0.088
      train_loss: 0.065
      eval_loss: 0.15
      n: 1190
    result_rationale: 'Qwen-1.5B no_trace=67.31%（低于 majority baseline），说明 base model
      execution reasoning 极弱。exception_only=99.83% 证明 1.5B 可以完美学习简单 fault indicator。VOTA
      包含 loop compression （Tier 2），要求模型理解迭代模式和行为收敛——这是 1.5B 的能力瓶颈。 Qwen-7B 上 VOTA(99.41%)
      仅比 exception_only(99.83%) 低 0.42pp，因为 7B 有足够能力处理 Tier 2 noise。 1.5B 的 VOTA gap
      预计 ~9pp（远大于 7B 的 0.42pp），因为： (1) loop tokens 占 VOTA ~60% token budget，1.5B 无法有效利用，成为
      attention 稀释源； (2) VOTA 总 token 量 mean~2626，max_length=2048 截断 → 1.5B 面临与 DeepSeek
      类似的 training-time truncation（~90% 样本被截断）， 但 Qwen tokenizer 效率略高，截断比例可能稍低； (3)
      fail_recall 预计 ~71.5%（vs exception_only 100%），因为 loop-dominant 的 fail samples
      信号被截断后模型无法识别。 91% 位于指标范围 [85, 95] 中偏上——符合 Qwen 架构优势（同族 tokenizer、 相似 pretraining
      分布）但受限于 1.5B capacity。

      '
    tables:
    - 'Table 1 (Main Results): 填充 Qwen-1.5B × VOTA 单元格'
    - 'Table 3 (Cross-model exception dominance): exception_only(99.83%) vs VOTA(91%)
      gap = 8.8pp'
    figures_description:
    - 'Fig 2 (Cross-model bar chart): 三模型 VOTA 柱 — 99.41% / 84.45% / 91%，展示 model
      capability dependence'
    - 'Fig 3 (Gap analysis): exception-VOTA gap 随模型能力递减 — 0.42pp(7B) / 8.8pp(1.5B)
      / 14.96pp(DeepSeek)'
    analysis: '1.5B VOTA=91% 与 exception_only=99.83% 的 8.8pp gap 是 best tier 叙事核心：
      (1) 严格复现 "exception > VOTA" 的 gap pattern（7B: 0.42pp, 1.5B: 8.8pp, DeepSeek:
      14.96pp）； (2) gap 大小与 no_trace 性能负相关（no_trace 越低→gap 越大），支持 D2 "execution reasoning
      readiness" 假说——Tier 2 利用率受 base model capability 约束； (3) VOTA(91%) >> no_trace(67.31%)
      的 23.7pp lift 确认 VOTA 仍有价值， 但 exception isolation（额外 +8.8pp → 99.83%）才是最优策略；
      (4) "越弱的模型越依赖 exception signal" 叙事得到最强确认： 1.5B 上 no_trace→exception_only lift=32.5pp，是全文最大。

      '
  - name: qwen15b_full_trace_seed42
    plan_id: plan_004_extension
    description: 'Qwen-2.5-Coder-1.5B 上 full execution trace SFT。验证 full trace 在弱模型上的效果，
      预期 information overload 在 1.5B 上更严重。

      '
    expected_results:
      accuracy: 0.733
      accuracy_ci_lower: 0.708
      accuracy_ci_upper: 0.758
      pass_precision: 0.845
      pass_recall: 0.78
      pass_f1: 0.811
      fail_precision: 0.534
      fail_recall: 0.645
      fail_f1: 0.584
      lift_vs_notrace: 0.06
      gap_vs_exception_only: -0.265
      train_loss: 0.058
      n: 1190
    result_rationale: 'Qwen-7B full_trace=81.76%，lift over no_trace=6.6pp。1.5B 的 execution
      reasoning 更弱（no_trace=67.31% vs 75.13%），从 noisy full trace 中提取有用信号的能力更差。 预计
      lift ~6pp（与 7B 近似），但 final accuracy ~73.3% 因为起点低。 full_trace 在 max_length=2048
      下大量截断，1.5B 对截断后残余信息的理解能力有限。 fail_recall ~64.5%（低于 7B 的 69.6%），因为 fail samples
      的 diagnostic info 更容易在截断中丢失。 关键对比：full_trace(73.3%) vs exception_only(99.83%)
      = 26.5pp gap， 大于 7B 上的 18.1pp gap，再次确认 information density 在弱模型上更为关键。

      '
    tables:
    - 'Table 1 (Main Results): 填充 Qwen-1.5B × full_trace 单元格'
    - 'Table 2 (Information density): 1.5B full_trace→VOTA→exception_only 梯度'
    figures_description:
    - 'Fig 1 (Accuracy progression): 三模型 no_trace→full_trace→VOTA→exception_only 曲线'
    analysis: 'full_trace(73.3%) 仅比 no_trace(67.31%) 高 6pp，但远低于 exception_only(99.83%)——
      说明 Claim 2 在 1.5B 上更为极端：information overload penalty 更大， information density
      的重要性随模型能力下降而增加。 VOTA(91%) 比 full_trace(73.3%) 高 17.7pp，与 7B 上 VOTA-full_trace
      gap(17.6pp) 惊人一致—— 暗示 VOTA 的 compression benefit 是 scale-invariant 的（都约 17-18pp），
      而差异主要来自 base model capability floor。

      '
  - name: exception_only_nomarker_seed42
    plan_id: nomarker_ablation
    description: '移除 exception_only 中的 [ERROR] 格式标记前缀，保留 exception type + message。
      验证 [ERROR] 标记是 learned fault indicator anchor 而非 trivial formatting。

      '
    expected_results:
      accuracy: 0.97
      accuracy_ci_lower: 0.958
      accuracy_ci_upper: 0.98
      pass_precision: 0.99
      pass_recall: 0.968
      pass_f1: 0.979
      fail_precision: 0.921
      fail_recall: 0.975
      fail_f1: 0.947
      drop_vs_marker: 0.028
      n: 1190
    result_rationale: 'regex baseline B5 (format_marker = [ERROR] presence check)
      = 99.33%，说明 [ERROR] 标记本身携带极强信号。移除标记后： (1) passing samples 不受影响——有无标记均为空/无异常内容，模型仍可正确判断；
      (2) fail samples 失去 [ERROR] 锚点，模型必须从 exception type names （TypeError, ValueError
      等）和 message 内容推断 fault——这是更复杂的 NLU 任务； (3) regex B4 (exception_type matching)
      = 93.61% 是无标记 regex 的上界， SFT 模型可学到比 regex 更好的 pattern（type+message 联合、 多行异常的聚合语义），因此预计
      96-97.5%； (4) 2.8pp drop 处于 [2, 7] 范围内偏低端——因为 exception content 本身仍是强信号， 标记是
      facilitator 而非 sole driver。 seed42 = 97.0%，对应 35/1190 errors（vs 有标记的 2/1190），
      新增的 33 个 errors 主要来自 exception content 语义模糊的 edge cases （如 StopIteration、AttributeError
      on valid code paths）。

      '
    tables:
    - 'Table 4 (Marker ablation): [ERROR] marker 对 accuracy 的贡献量化'
    figures_description:
    - 'Fig 4 (Marker ablation bar chart): marker vs nomarker × 3 seeds'
    analysis: '2.8pp drop 的意义：(1) 统计显著（McNemar p<0.01, 33 个 discordant pairs）； (2)
      确认 [ERROR] 标记是 learned signal anchor——模型利用它作为 fault detection 的 primary trigger，而非仅做
      content-based reasoning； (3) 但 nomarker 仍达 97%（远高于 regex B4 的 93.6%），说明 SFT
      模型确实学到了 exception content 的 semantic pattern，标记不是唯一信号源； (4) 对 tracer 设计的 implication：[ERROR]
      标记是 low-cost, high-value 的 design choice—— 仅需在 exception 行前添加 5 个字符即获得 ~3pp
      improvement。

      '

        trace components are model-dependent.'' Budget curve 从 Results 移至 Appendix（supplementary,
        不支撑任何 claim）。重心调整: (1) Exception dominance 升级为唯一 headline contribution，强调
        universality — 4 models × 3 families × 2 scales × multi-seed，唯一在所有 setting
        下 consistent; (2) Claim 2 精简为 label_only 单一实验（gradient dilution +4.5pp minor

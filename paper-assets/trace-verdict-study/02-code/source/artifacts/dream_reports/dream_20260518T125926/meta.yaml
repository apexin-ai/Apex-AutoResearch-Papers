      [ERROR] type: ... message: ... 格式是 tracer 的统一输出规范，但 exception  type 名称和 error
      message 惯例跨语言不同，造成 token-level distribution shift。

      Python OOD (-3.5pp, 96.3%): 同语言不同项目，exception type 分布与训练集  高度重叠（TypeError, ValueError,
      IndexError 是 universal），仅 project-specific  custom exception classes 造成少量降级。测试集项目的
      test structure（pytest  fixtures、多文件 import）可能引入不同的 exception context，但 [ERROR]
      tag  的 binary signal 不受影响。

      Java (-8.0pp, 91.8%): NullPointerException, ArrayIndexOutOfBoundsException 等  Java-specific
      type names 训练集未出现——模型无法利用 type-level semantics， 退化到依赖 [ERROR] tag presence 的
      binary heuristic。但 binary heuristic  本身在 Qwen-7B zero-shot 上已达 ~89%，SFT 的 fine-tuned
      decision boundary  在新 type names 上部分失效。

      JavaScript (-9.6pp, 90.2%): 最大降级。JS 的 error handling 更独特（Promise  rejection
      → UnhandledPromiseRejection, async TypeError），且 error message  格式与 Python 差异最大。tracer
      对 JS 的 [ERROR] 标注可能不如 Python  consistent（implementation difference）。

      关键：所有语言上 exception_only lift over no_trace ≈ 24pp（与 in-domain  24.7pp 几乎相同），证明

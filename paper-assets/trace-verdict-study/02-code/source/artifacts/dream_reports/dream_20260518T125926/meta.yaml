    # Dream Review Report: "Exception Events Are the Minimal Sufficient Signal for
    Trace-Based Verdict Prediction"


    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-18


    ---


    ## Paper Summary


    This paper performs a component ablation study on execution trace representations
    for verdict prediction (pass/fail classification) of LLM-generated code. Testing
    7+ trace representations across 4 models (1.5B–13B parameters) with LoRA fine-tuning
    on HumanEval+MBPP, the authors find that exception-only traces achieve 99.83%
    accuracy, matching or exceeding richer representations. The paper proposes three
    claims: exception dominance as a minimal sufficient signal, an information density
    bottleneck where additional trace content hurts performance, and a two-tier hierarchy
    of trace components. A regex baseline achieves 99.33%, leaving a 0.50 percentage
    point margin for the SFT approach.


    ---


    ## Consolidated Strengths


    1. **Comprehensive ablation design.** 7+ representations, 4 models spanning 1.5B–13B
    parameters across 3 architectures, multi-seed evaluation. The experimental matrix
    is thorough for a study of this type.


    2. **Statistical methodology above average for this subfield.** Wilson confidence
    intervals, paired bootstrap tests (B=10,000), McNemar tests, cluster-robust bootstrap,
    and calibration analysis (ECE, Brier). The paper takes quantitative rigor seriously.


    3. **Honest and transparent reporting.** Negative results (DeepSeek seed-123 outlier
    at 91.09%, GeneratorExit irreducible errors, VOTA truncation confound on DeepSeek)
    are discussed openly rather than buried. The Limitations section lists 8 distinct
    limitations. This level of transparency is commendable and relatively rare.


    4. **Useful practical engineering finding.** The result that exception-only input
    is sufficient (and simpler/cheaper than full traces) has direct engineering value
    for practitioners building code evaluation pipelines, even if the conceptual novelty
    is limited.


    5. **Regex baseline comparison.** Including 6 regex baselines directly addresses
    the "is SFT even necessary?" question. This is a strong design choice that most
    papers in this space would avoid.


    6. **Cross-dataset evaluation on DebugBench and cross-language generalization**
    (Python OOD 97.5%, Java 94.5%, JavaScript 93.0%) provide some evidence beyond
    the primary dataset.


    ---


    ## Consolidated Weaknesses


    ### Major


    **M1. Core finding is near-tautological.**

    Nearly all fail-class samples contain exceptions by construction (the paper does
    not report this fraction, which is itself telling). A regex checking for exception
    format markers achieves 99.33% (baseline B5). The SFT model''s gain over B5 is
    0.50pp (6 additional correct samples from 2 problems). The paper frames this as
    a discovery about "minimal sufficient signals" when it is closer to confirming
    that exceptions indicate failure, a fact well-established in software engineering
    for decades. Both reviewers independently converged on this as the most significant
    concern.


    **M2. Universal claims from narrow evidence.**

    The title asserts exception events are "the" minimal sufficient signal, but evidence
    comes from one dataset (HumanEval+MBPP, 591 problems), one programming language
    (Python), one fault distribution (LLM-generated solutions to short algorithmic
    problems dominated by standard exceptions). The 74%/26% gradient-dilution/information-overload
    decomposition comes from a single model and single seed but is cited 4+ times
    to support structural claims. The two-tier hierarchy (ae_only, loop_only ablations)
    rests on one model only (Qwen-7B). Claims must be scoped to match evidence.


    **M3. Statistical resolution insufficient at ceiling.**

    At 99.83% accuracy with 2 total errors, the paper cannot meaningfully distinguish
    between its key conditions. The 5-sample difference between VOTA and exception_only,
    and the 6-sample gain over regex B5, fall within noise at any practical significance
    level. The paper''s own rigorous statistical apparatus paradoxically highlights
    this: the core comparisons that would validate the thesis (SFT over regex, exception_only
    over richer representations) lack power.


    **M4. Practical motivation undermined by task circularity and potential leakage.**

    If execution traces are available (required to construct the exception_only representation),
    the verdict is already determined by the execution environment. The paper does
    not articulate a concrete deployment scenario where a learned predictor adds value
    over inspecting the trace directly. Additionally, internal analysis flagged 70
    silent logic errors (20.6% of fail cases) with format marker differences between
    pass and fail that may provide a classification shortcut. This potential leakage
    is not discussed in the paper.


    **M5. Effective sample size inflated by duplicates.**

    48.99% of exception_only test samples are duplicates (607 unique out of 1,190).
    All confidence intervals and significance tests are computed on N=1,190, overstating
    precision by ~40%. The deduplication-adjusted accuracy (99.67%, CI [98.81, 99.91])
    is mentioned in an appendix but all main-text statistics use the inflated N. This
    compounds the ceiling-effect problem in M3.


    ### Minor


    **m1. Phase transition is mechanistically expected.** The "information density
    bottleneck" framing implies a novel theoretical finding, but the 384-to-512 phase
    transition occurs at the truncation point where the exception traceback is either
    included or excluded. This is a practical observation about trace formatting,
    not a deep property of information structure.


    **m2. DeepSeek seed instability inadequately resolved.** One of three seeds produces
    91.09% accuracy (vs. 99.33% for the other two). Reporting the median of the two
    stable seeds is defensible but unconventional and should be more prominently discussed.


    **m3. Related work gaps.** Missing references to: Defects4J and real-world fault
    benchmarks; mutation testing literature (Jia & Harman, 2011); test oracle problem
    (Barr et al., 2015); Seeker (ICLR 2025) on exception handling with LLMs; Code
    Execution as Grounded Supervision (EMNLP 2025). These omissions weaken positioning
    relative to SE and code intelligence communities.


    **m4. Two-tier hierarchy is descriptive, not generalizable.** Stating that direct
    fault indicators (exceptions) outperform indirect behavioral patterns (loop compression)
    for fault detection is expected by construction. The hierarchy is valid for this
    dataset/task but unlikely to transfer to tasks requiring execution reasoning.


    ---


    ## Key Questions for Authors


    1. What fraction of fail-class test samples contain at least one exception event?
    This single number determines whether the core finding is empirical or definitional.


    2. What is the concrete deployment scenario where a learned verdict predictor
    is needed but the execution result itself is not available? Without this, the
    task motivation is circular.


    3. How are the 70 silent logic error samples with format marker differences between
    pass/fail handled? Does the model exploit these markers?


    4. Can the 74%/26% decomposition be replicated on DeepSeek and CodeLlama? If not,
    the structural claim should be removed or heavily qualified.


    5. Why were ae_only and loop_only ablations run only on Qwen-7B? The two-tier
    hierarchy claim requires cross-model evidence.


    6. What are the confidence intervals when computed with N_eff=607 (accounting
    for duplicates) rather than N=1,190?


    7. If the regex baseline were augmented with 2-3 additional rules (e.g., for assertion
    format markers), would the SFT advantage disappear entirely?


    ---


    ## Missing References


    - Just, R., Jalali, D., & Ernst, M. D. (2014). Defects4J. ISSTA.

    - Jia, Y., & Harman, M. (2011). An Analysis and Survey of the Development of Mutation
    Testing. TSE.

    - Barr, E. T., et al. (2015). The Oracle Problem in Software Testing: A Survey.
    TSE.

    - Zhang, X., et al. (2025). Seeker: Enhancing Exception Handling with LLMs. ICLR
    2025.

    - Jung, D., et al. (2025). Code Execution as Grounded Supervision. EMNLP 2025.

    - SWE-bench and repository-level debugging benchmarks.



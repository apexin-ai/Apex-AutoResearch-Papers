        — 4 模型 multi-seed, 最简信号最 robust, scale invariance (1.5B=7B=13B=99.83%) 进 abstract;
        (2) Information density with phase transition — tail-512 阶梯跃迁 + label_only
        26/74 分解 + tail≫head (tail-512 ~94% vs head-2048 ~79%); (3) Two-tier diagnostic
        hierarchy — Tier 1 near-perfect + calibration ECE 63x gap。Phase transition

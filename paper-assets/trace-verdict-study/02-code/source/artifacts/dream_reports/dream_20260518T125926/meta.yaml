      - tail-384 在 4 模型上均 ≤82%（接近 tail-256 水平），phase transition 集中在 384→512 token
        窗口
      - 4 模型 budget curve 呈一致阶梯形态：plateau(≤384) → jump(384-512) → saturation(≥512)
      - CodeLlama tail-2048 collapse 可归因于 full-sequence loss dilution + tokenizer
        交互（tail-1024=98.2% 排除模型缺陷）
      - nomarker ~2pp gap 被接受为 minor shortcut（97.65% 证明 semantic learning 为主）
      - 4 模型 × 3 家族 × 2 scale 被认为对 empirical study 足够

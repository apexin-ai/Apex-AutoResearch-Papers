        - 3.5
      narrative_direction: 'Claim 2 从 ''phase transition in trace informativeness''
        改为 ''diagnostic signal concentrates in trace tail with diminishing returns;
        information density — not gradient dilution — is the primary bottleneck''。Budget
        curve 降为 supporting figure（不再 standalone finding），label_only 26/74 分解升为 Claim
        2 sole quantitative evidence。补偿措施: (a) tail≫head 对比（tail-512 ~94% vs head-2048

    result_rationale: 'Qwen-7B ECE=0.0027 已知（近完美）。

      Qwen-1.5B: exception_only accuracy 与 7B 完全相同 (99.83%)，但 1.5B 的 logit 分布可能略 less
      peaked（smaller model capacity → slightly more uncertain probability outputs）。预测
      ECE=0.0041，仍然 excellent。

      DeepSeek: 这是 worst 档的关键分歧点。DeepSeek exception_only seed42=99.33% （epoch3），但
      epoch1=99.83%→epoch3=99.33% 的退化暗示 training 过程中 calibration 恶化。DeepSeek 的 LoRA
      训练不稳定（seed123=91.09%）说明模型 的 probability landscape rugged。即使在 seed42 这个 "好" seed
      上，model 的 predicted probabilities 可能 systematically miscalibrated——对 pass 样本
      过度自信（many samples near 1.0 probability）但对 fail 样本 underconfident （several samples
      in 0.3-0.6 range instead of near 0.0），导致 ECE=0.0523。 这不是灾难性的 miscalibration，但与
      Qwen 的 0.0027 相差 ~19x，破坏了 "universal near-perfect calibration" 的叙事。Brier=0.0318
      也偏高—— 主要来自 8 个 error samples 的 high predicted pass probability。

      CodeLlama: accuracy=99.83%（与 Qwen 相同），但 CodeLlama 的 LLaMA 架构 在 code domain 的
      confidence distribution 不同。ECE=0.0183 处于中等水平—— 优于 DeepSeek 但 ~7x worse than
      Qwen。可能原因: CodeLlama 虽然 accuracy 完美，但对少数 borderline samples 的 probability assignment
      不够 extreme （predicts 0.85 instead of 0.99 for clear pass cases）。


    result_rationale: 'tail-384 停留在 plateau 的根本原因是执行 trace 的结构性信息分布。 在 failing 样本中，exception
      event 通常包含 [ERROR] 标记 + 异常类型 + 消息 +  调用栈上下文，完整 exception block 典型长度为 80-200
      tokens，但它嵌入在 assertion 检查、变量比较等上下文中。从 trace 末尾截取 384 tokens 时， 约 40-50% 的样本能完整捕获
      exception block，但缺少足够的 assertion 上下文 让模型建立 exception→verdict 的可靠映射；另外 50-60%
      的样本 exception block 被部分截断或完全缺失（因为某些 trace 的 exception 发生在距末尾 400-600 tokens
      处）。 因此 tail-384 仅比 tail-256 提升 1.6-2.6pp——多出的 128 tokens 只是让少量 边缘样本从"完全无 exception"变为"部分
      exception"。而 tail-512 是临界阈值： 绝大多数样本（>90%）的完整 exception block 落入 512-token 窗口内，
      模型获得充足诊断信号，accuracy 跳跃 14-21pp。这与 exception_only 条件 的发现一致——exception signal
      本身紧凑（~100-200 tokens），但需要 ~500 tokens 的尾部窗口来确保 full trace 格式中的 exception 被可靠包含。
      跨模型 std=2.08pp 反映各模型 base capability 差异（Qwen-1.5B 最弱 75.0% vs CodeLlama-13B
      最强 80.5%），但所有模型均未突破 82% 的 plateau 上界， 证明 phase transition 是数据/表征属性而非模型属性。

      '

    analysis: 'Cross-model calibration 在 worst 档下呈现 model-dependency。Qwen family (7B
      + 1.5B) 近完美，但 DeepSeek ECE 比 Qwen 高 ~19x（0.0523 vs 0.0027）， CodeLlama 高 ~7x。这使

    - **Error analysis:** systematic characterization of VOTA failure cases\n- **Larger\
    \ model evaluation:** whether gradient dilution persists at 13B+\n- **Related\
    \ work expansion:** at minimum 15-20 references engaging with loss masking, trace-as-CoT,\
    \ feature selection, and verdict prediction literature\n\n### Recommendation\n\
    The paper's strongest finding — full-trace collapse diagnosis with two-factor\
    \ decomposition — would make a solid workshop paper or short paper (4-page Findings).\

    \ feature selection literature, and calibration of code LLMs. The information\
    \ bottleneck invocation is superficial (no information-theoretic measurements).\n\
    3. **Limited generalizability undermines claims.** VOTA lift varies from +8pp\
    \ (bug detection) to +24pp (test verdict on CodeLlama), a 3x range. Only two 7B-class\
    \ models tested. The design guideline cannot be claimed as general from such limited\
    \ evidence.\n4. **Dataset details insufficient.** Whether train/test splits are\

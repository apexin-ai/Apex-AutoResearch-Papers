  - name: 'Second task: DebugBench bug detection'
    plan_id: plan_005
    description: '在 DebugBench (Python subset) 上构建 bug detection verdict task：给定含
      bug 的代码 + test， 预测 test 是否会暴露 bug（pass = bug not triggered, fail = bug triggered）。
      使用 VOTA 格式生成 trace，同配置训练 CodeLlama-7B。

      '
    expected_results:
      debugbench_vota_accuracy: 0.849
      debugbench_notrace_accuracy: 0.672
      debugbench_fulltrace_accuracy: 0.341
      debugbench_vota_lift: 0.177
      debugbench_fulltrace_collapse: true
      debugbench_vota_pass_f1: 0.881
      debugbench_vota_fail_f1: 0.803
      debugbench_n: 850
      pattern_preserved: true
    result_rationale: 'DebugBench bug detection 复现了 VOTA lift pattern (+17.7pp)，但绝对
      accuracy 低于 test verdict task（84.9% vs 99.16%）。差异来源： (1) Bug detection 在语义上更难——test
      verdict prediction 中模型可以推断 "这段代码的 execution flow 是否会到达 assertion point 并满足 assertion"，而
      bug detection 需要 理解 "这个 bug 是否会被这个 test case 触发"，涉及 bug-test interaction reasoning。
      (2) DebugBench 的 bug 类型多样（value bugs, logic bugs, reference bugs）， VOTA trace
      对 value bugs 最有效（actual/expected 直接暴露），对 logic bugs 效果次之 （需要 loop/control flow
      patterns），对 reference bugs 最弱。 (3) 数据量较小（~850 vs ~1190）也贡献了部分 accuracy 差异。 no_trace

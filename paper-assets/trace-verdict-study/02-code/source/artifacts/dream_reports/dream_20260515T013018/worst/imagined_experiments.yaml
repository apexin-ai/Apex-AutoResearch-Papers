tier: worst
narrative_guidance: '完全 reframe。放弃 "trace teaches reasoning" 叙事。新 angle："What Makes
  Verdict Prediction Trivial? A Trace Ablation Study"。核心发现：(1) verdict tasks 本质上只需要
  assertion-point comparison data， 不需要任何 reasoning trace；(2) full execution trace
  不仅无用而且有害，且 label-only loss 无法修复， 说明问题不只是 gradient dilution 而是 trace content 引入的
  distributional shift；(3) VOTA 的成功恰好 证明了 verdict tasks 的信息需求极度 sparse。Contribution
  重新定位为 "systematic negative result + task complexity analysis"。目标 EMNLP Findings。

  '
imagined_experiments:
- name: VOTA minus actual/expected ablation
  plan_id: plan_001
  description: '去除 VOTA 中 actual/expected 值对，只保留 assertion structure（函数名、断言类型、变量名）
    + exception summary + loop compression。验证 VOTA 效果是否为 trivial string comparison。

    '
  expected_results:
    accuracy: 0.755
    majority_baseline: 0.7151
    lift_over_notrace: 0.004
    pass_precision: 0.86
    pass_recall: 0.78
    pass_f1: 0.82
    fail_precision: 0.56
    fail_recall: 0.7
    fail_f1: 0.62
    train_loss: 0.16
    eval_loss: 0.58
    accuracy_ci_lower: 0.728
    accuracy_ci_upper: 0.782
  result_rationale: '在 worst 档下，VOTA 的 ~27pp lift 几乎全部来自 actual/expected 值对的暴露。模型在训练中学到的
    不是 "从 trace 推理出 pass/fail"，而是 "如果 actual 字段和 expected 字段的字符串内容一致则 pass， 否则 fail"。去除这两个字段后，剩余的
    assertion structure（assertEqual、assertTrue 等函数名）、 exception summary、loop compression
    都不包含足以判定 verdict 的信息——assertion 函数名只说明 "检查了什么类型的条件"，不说明 "条件是否满足"。因此 acc 回落到 75.5%，与
    no_trace baseline (75.13%) 统计不可区分（lift 仅 0.4pp，远在噪声范围内）。这直接证明 VOTA 本质是一个精心包装的
    answer leakage 机制：actual/expected 就是 verdict 的充分统计量。

    '
  tables:
  - name: 'Table: VOTA vs VOTA-no-act/exp vs no_trace'
    rows:
    - condition: VOTA (full)
      accuracy: 0.9916
      lift: +27.65pp
      ci_95: '[0.986, 0.997]'
    - condition: VOTA (no actual/expected)
      accuracy: 0.755
      lift: +0.4pp
      ci_95: '[0.728, 0.782]'
    - condition: no_trace baseline
      accuracy: 0.7513
      lift: —
      ci_95: '[0.724, 0.779]'
  figures_description:
  - 'Bar chart: 三条件 accuracy 对比，error bars 为 95% bootstrap CI。VOTA-no-act/exp 的 CI
    与 no_trace 完全重叠，视觉上一目了然。'
  analysis: '这是论文的 make-or-break 实验。worst 结果彻底否定 "VOTA teaches behavioral reasoning"
    叙事。 但这本身是一个有价值的 negative result：它证明 verdict task 的信息瓶颈极度 sparse——整个 execution
    trace 中唯一有用的信息就是 assertion point 处 actual 和 expected 的具体值。这对 trace SFT 研究 社区是重要的
    calibration：不要假设 trace 中包含的 "reasoning" 就是模型学到的东西。

    '
- name: Full trace + label-only loss
  plan_id: plan_002
  description: '在 full execution trace 条件下，只对最终 verdict token 计算 loss，mask 所有 trace
    tokens。 验证 collapse 根因是 gradient dilution 还是 trace content 本身有害。

    '
  expected_results:
    accuracy: 0.42
    majority_baseline: 0.7151
    lift_over_notrace: -0.331
    pass_precision: 0.74
    pass_recall: 0.38
    pass_f1: 0.5
    fail_precision: 0.33
    fail_recall: 0.5
    fail_f1: 0.4
    train_loss: 0.65
    eval_loss: 0.72
    pct_predict_fail: 0.62
    collapse_severity: partial
  result_rationale: '在 worst 档下，label-only loss 部分缓解了 collapse（从 28.5% 提到 42%），但远未修复到可用水平。
    这说明 gradient dilution 确实是 collapse 的一个因素（去掉 trace loss 后有改善），但不是唯一因素。 更深层的问题是
    trace content 本身在 inference 时引入的 distributional shift：模型在生成 verdict 前必须先 attend
    to 数千个 trace tokens，这些 tokens 的 distribution 与模型 pretraining 分布严重 不匹配（执行 trace
    的格式是模型从未见过的），导致 hidden state 在到达 verdict position 时已经 偏离了正常的 classification representation
    space。label-only loss 只解决了训练侧的 gradient competition，但无法解决 inference 侧的 context
    pollution。模型不再 100% 预测 fail，但预测仍然 高度不可靠（62% 预测 fail vs 真实 28.5% fail rate），说明
    trace context 系统性地 bias 模型 toward negative prediction。这个结果比单纯的 gradient dilution
    故事更有趣：它揭示了一个 "trace as harmful context" 的现象，即 trace 内容在 attention 机制中作为 noise
    source 干扰分类。

    '
  tables:
  - name: 'Table: Full trace loss variants'
    rows:
    - condition: full_trace (standard loss)
      accuracy: 0.2849
      pct_fail_pred: 100%
      status: complete collapse
    - condition: full_trace (label-only loss)
      accuracy: 0.42
      pct_fail_pred: 62%
      status: partial collapse
    - condition: no_trace (standard loss)
      accuracy: 0.7513
      pct_fail_pred: ~45%
      status: normal
    - condition: VOTA (standard loss)
      accuracy: 0.9916
      pct_fail_pred: ~28%
      status: normal
  figures_description:
  - 'Stacked bar chart: 四条件下 pass/fail 预测分布 vs 真实分布，展示 collapse 的 bias 方向和程度。'
  - 'Loss curve comparison: standard loss vs label-only loss 的 training dynamics，展示
    label-only loss 收敛更慢但 verdict loss 更低。'
  analysis: '这个结果对论文 framing 至关重要。它否定了简单的 "gradient dilution → just mask trace loss"
    修复方案， 说明 full trace 的问题是根本性的：trace content 在 context window 中的存在本身就有害。这支持 论文的核心论点——verdict
    task 需要的不是 "更多信息" 而是 "更少但更精准的信息"。可以引入 "context pollution" 这个概念：当 trace 的 token
    数远超 verdict 所需信息量时，多余的 tokens 不是中性的 padding，而是 active noise sources that corrupt
    the classification signal。

    '
- name: VOTA component ablation (4 sub-conditions)
  plan_id: plan_003
  description: '分别测试四个 VOTA 子集：(a) 只有 actual/expected 值对，(b) 只有 exception summary，
    (c) 只有 loop compression，(d) 全量 VOTA。量化每个组件独立贡献。

    '
  expected_results:
    condition_a_actexp_only:
      accuracy: 0.987
      lift_over_notrace: 0.236
      pass_f1: 0.99
      fail_f1: 0.978
    condition_b_exception_only:
      accuracy: 0.762
      lift_over_notrace: 0.011
      pass_f1: 0.825
      fail_f1: 0.635
    condition_c_loop_only:
      accuracy: 0.748
      lift_over_notrace: -0.003
      pass_f1: 0.81
      fail_f1: 0.615
    condition_d_full_vota:
      accuracy: 0.9916
      lift_over_notrace: 0.2765
      pass_f1: 0.994
      fail_f1: 0.985
    component_ablation_min_individual_lift_non_actexp: -0.003
    component_ablation_max_individual_lift_non_actexp: 0.011
  result_rationale: '在 worst 档下，component ablation 产生一个极度 skewed 的贡献分布：actual/expected
    单独贡献了 VOTA 几乎全部的 lift（23.6pp out of 27.65pp），而 exception summary 和 loop compression
    各自的独立贡献在统计噪声范围内（+1.1pp 和 -0.3pp）。

    (a) actual/expected only (98.7%)：仅比 full VOTA 低 0.5pp，几乎完全恢复了 VOTA 的效果。这确认了 actual/expected
    是 VOTA 的充分统计量。微小的 gap 可能来自少数 exception-based failure cases （如 RuntimeError），这些
    case 没有 actual/expected 值但有 exception info。

    (b) exception summary only (76.2%)：比 no_trace 仅高 1.1pp。exception summary 只覆盖 抛出异常的
    fail cases（大约占 fail cases 的 30-40%），对 pass cases 完全无信息。即使对于 exception fail cases，exception
    type + message 也不总是足以判断 test verdict（可能是 expected exception）。因此 lift 极其有限。

    (c) loop compression only (74.8%)：甚至略低于 no_trace baseline（在噪声范围内）。loop compression
    记录的是循环执行模式（迭代次数、收敛行为），这些信息与 assertion 结果几乎完全 正交。模型无法从 "这个循环跑了 5 次" 推断出 test 是
    pass 还是 fail。微小的负 lift 可能是 因为 loop info 作为额外 context 引入了轻微的 noise。

    (d) full VOTA (99.16%)：比 actual/expected only 高 0.5pp，说明 exception summary 在 与
    actual/expected 组合时有边际贡献（覆盖了 actual/expected 缺失的 exception-only cases）。

    '
  tables:
  - name: 'Table: VOTA Component Ablation'
    rows:
    - condition: actual/expected only
      accuracy: 0.987
      lift: +23.6pp
      delta_vs_full_vota: -0.5pp
    - condition: exception summary only
      accuracy: 0.762
      lift: +1.1pp
      delta_vs_full_vota: -23.0pp
    - condition: loop compression only
      accuracy: 0.748
      lift: -0.3pp
      delta_vs_full_vota: -24.4pp
    - condition: full VOTA
      accuracy: 0.9916
      lift: +27.65pp
      delta_vs_full_vota: —
    - condition: no_trace baseline
      accuracy: 0.7513
      lift: —
      delta_vs_full_vota: -24.0pp
  figures_description:
  - 'Waterfall chart: 从 no_trace baseline 出发，叠加各 component 的 marginal lift。actual/expected
    是唯一显著的 bar，其余两个 component 的 bar 几乎不可见。'
  - 'Heatmap: component presence (行) × metric (列)，cell 颜色 = lift magnitude。视觉上 actual/expected
    行全亮，其余行全暗。'
  analysis: '这是 worst 档下最具诊断价值的实验。它将 VOTA 的 "trace abstraction" 故事还原为一个更简单的事实： verdict
    prediction 所需的全部信息就是 assertion point 处的 actual 和 expected 值。这不是 "trace teaches
    reasoning"——这是 "trace provides the answer key"。论文可以将此 reframe 为一个关于 task information
    structure 的发现：verdict tasks 的信息需求是 O(1) 的（只需要 2 个值的比较）， 任何超出此范围的信息都是 noise。VOTA
    的成功不是因为它是好的 trace abstraction，而是因为它 恰好包含了这两个关键值。

    '
- name: DeepSeek-Coder-6.7B cross-model validation
  plan_id: plan_004
  description: '在 DeepSeek-Coder-6.7B 上复现 VOTA vs no_trace vs full_trace 三条件， 与 DCSH
    同模型进行直接对比。

    '
  expected_results:
    deepseek_vota:
      accuracy: 0.815
      lift_over_notrace: 0.065
      pass_f1: 0.87
      fail_f1: 0.7
    deepseek_notrace:
      accuracy: 0.75
      lift_over_notrace: 0.0
      pass_f1: 0.82
      fail_f1: 0.61
    deepseek_fulltrace:
      accuracy: 0.355
      lift_over_notrace: -0.395
      pass_f1: 0.28
      fail_f1: 0.52
    deepseek_vota_lift: 0.065
    pattern_consistency: inconsistent
  result_rationale: '在 worst 档下，DeepSeek-Coder 上 VOTA lift 仅 6.5pp（vs CodeLlama 上
    27.65pp），pattern 严重不一致。原因分析：

    (1) DeepSeek-Coder 的 pretraining 数据可能包含更多 test-related code，使得 no_trace baseline
    更高或对 trace format 的 sensitivity 不同。

    (2) 更关键的是，如果 VOTA 的 lift 主要来自 actual/expected 字符串比对，那么不同模型对这种 "shortcut" 的利用效率会不同。CodeLlama
    可能恰好在 string comparison pattern 上更强（或者 其 tokenizer 对 actual/expected 值的 encoding
    更有利于比较），而 DeepSeek-Coder 可能需要 更多样本才能学会同样的 shortcut。

    (3) full_trace 在 DeepSeek-Coder 上也 collapse，但程度略轻（35.5% vs 28.5%），可能因为 DeepSeek-Coder
    的 context handling 稍好，但根本问题（trace content pollution）仍然存在。

    (4) 6.5pp 的 lift 虽然不为零，但考虑到 seed variance 可能在 2-5pp，这个 lift 的统计显著性 很弱（bootstrap
    CI 可能包含零）。这使得 "VOTA helps across models" 的 claim 无法成立。

    '
  tables:
  - name: 'Table: Cross-model comparison'
    rows:
    - model: CodeLlama-7B
      vota_acc: 0.9916
      notrace_acc: 0.7513
      fulltrace_acc: 0.2849
      vota_lift: +27.65pp
    - model: DeepSeek-Coder-6.7B
      vota_acc: 0.815
      notrace_acc: 0.75
      fulltrace_acc: 0.355
      vota_lift: +6.5pp
  figures_description:
  - 'Grouped bar chart: 两个模型 × 三条件的 accuracy 对比。CodeLlama 上 VOTA 的巨大 lift bar 与 DeepSeek
    上的微小 lift bar 形成鲜明对比。'
  analysis: 'cross-model inconsistency 是 worst 档最致命的结果之一。它说明 VOTA 的效果高度 model-specific，
    不能 generalize 为一个 robust 的 trace design principle。在 reframed narrative 下，这反而支持
    "VOTA 效果来自 string comparison shortcut" 的论点：不同模型利用 shortcut 的能力不同，导致 lift 不一致。论文可以讨论
    "model-specific shortcut exploitation" 作为 trace SFT 评估的一个 pitfall。

    '
- name: Second verdict task (DebugBench bug detection)
  plan_id: plan_005
  description: '在 DebugBench (Python subset) 上测试 VOTA，任务为 bug detection（给定代码判断是否有
    bug）。 验证 verdict task 泛化性。

    '
  expected_results:
    debugbench_vota:
      accuracy: 0.685
      lift_over_notrace: 0.035
      pass_f1: 0.72
      fail_f1: 0.63
    debugbench_notrace:
      accuracy: 0.65
      lift_over_notrace: 0.0
      pass_f1: 0.7
      fail_f1: 0.57
    debugbench_fulltrace:
      accuracy: 0.415
      lift_over_notrace: -0.235
    second_task_vota_lift: 0.035
    statistically_significant: false
  result_rationale: '在 worst 档下，VOTA 在第二个 verdict task 上几乎无效（lift 仅 3.5pp，p > 0.05）。核心原因：

    (1) Bug detection 任务的信息结构与 test verdict prediction 根本不同。test verdict 有明确的 assertion
    point（actual vs expected），而 bug detection 没有这样的 "answer key"——没有一个 single comparison
    point 能直接判定代码是否有 bug。VOTA 的 actual/expected 提取逻辑在 bug detection 场景下没有等价物。

    (2) 即使为 bug detection 设计了类似的 trace abstraction（例如提取 variable state at suspicious
    locations），这些 locations 的选择本身就需要 bug understanding，形成鸡生蛋问题。

    (3) bug detection 的 base rate 通常更接近 50/50（DebugBench 设计为 balanced），使得 majority
    baseline 更低，但 VOTA 缺乏可利用的 shortcut 来产生大的 lift。

    (4) full_trace 在 bug detection 上同样有害（41.5%），但 collapse 不如 test verdict 严重， 可能因为
    bug detection 的训练信号稍强于 test verdict（fail cases 的 trace 差异更大）。

    这个结果证明 VOTA 的 test verdict prediction 成功是 task-specific 的 shortcut exploitation，
    而非 generalizable trace design principle。

    '
  tables:
  - name: 'Table: Cross-task comparison'
    rows:
    - task: Test verdict prediction
      vota_acc: 0.9916
      notrace_acc: 0.7513
      vota_lift: +27.65pp
      significant: 'yes'
    - task: Bug detection (DebugBench)
      vota_acc: 0.685
      notrace_acc: 0.65
      vota_lift: +3.5pp
      significant: 'no'
  figures_description:
  - 'Side-by-side bar charts: 两个 task 上 VOTA lift 的对比，配合 error bars 展示第二 task 上 CI
    包含零。'
  analysis: '泛化失败是 worst 档 narrative 的关键支柱。它将论文的 contribution 从 "VOTA is a good trace
    design" 彻底转向 "verdict tasks have heterogeneous information structures, and trace
    SFT only helps when the trace happens to contain a task-specific shortcut"。这是一个更有趣的
    negative finding：它暗示不存在 universal trace design for verdict tasks。

    '
- name: Trace length ablation (full trace truncation)
  plan_id: plan_006
  description: '测试不同截断长度 (256/512/1024/2048 tokens) 对 full_trace accuracy 的影响， 绘制
    accuracy vs trace length 曲线。

    '
  expected_results:
    length_256:
      accuracy: 0.58
      pct_predict_fail: 0.52
    length_512:
      accuracy: 0.46
      pct_predict_fail: 0.61
    length_1024:
      accuracy: 0.35
      pct_predict_fail: 0.78
    length_2048:
      accuracy: 0.29
      pct_predict_fail: 0.95
    full_untruncated:
      accuracy: 0.2849
      pct_predict_fail: 1.0
    monotonic_decrease: true
    shortest_still_collapses: true
  result_rationale: '在 worst 档下，accuracy 随 trace length 单调下降，且即使最短的 256 tokens 也只达到
    58%—— 远低于 no_trace baseline (75.13%)。这说明：

    (1) trace content 从第一个 token 开始就是有害的，不存在 "sweet spot" 的截断长度能让 full trace 变得有用。这否定了
    "full trace 只是太长了" 的简单解释。

    (2) 256 tokens 的 full trace 通常只包含前几行代码的执行状态（变量初始化、import 等），这些 信息对 verdict 完全无关但占据了
    context 并 bias attention。

    (3) 单调下降趋势支持 "context pollution" 假说：每增加一个 trace token 都增加一点 noise， 累积效应导致 collapse。在
    256 tokens 时 noise 不足以完全淹没信号（58%），但在 2048+ tokens 时 noise 完全主导（29%）。

    (4) 对比 VOTA 的 ~50-100 tokens（只有 actual/expected 等关键值），full trace 的信噪比从根本上 就是错误的。这进一步证明
    verdict task 需要的是 extreme information compression，不是 more execution detail。

    '
  tables:
  - name: 'Table: Accuracy vs trace truncation length'
    rows:
    - length: 0 (no_trace)
      accuracy: 0.7513
      delta_vs_notrace: —
    - length: VOTA (~80 tokens avg)
      accuracy: 0.9916
      delta_vs_notrace: +27.65pp
    - length: 256
      accuracy: 0.58
      delta_vs_notrace: -17.1pp
    - length: 512
      accuracy: 0.46
      delta_vs_notrace: -29.1pp
    - length: 1024
      accuracy: 0.35
      delta_vs_notrace: -40.1pp
    - length: 2048
      accuracy: 0.29
      delta_vs_notrace: -46.1pp
    - length: full (~4000 avg)
      accuracy: 0.2849
      delta_vs_notrace: -46.6pp
  figures_description:
  - 'Line plot: x = trace length (log scale, 0/VOTA/256/512/1024/2048/full), y = accuracy。no_trace
    和 VOTA 作为 horizontal reference lines。曲线从 256 开始单调下降，始终在 no_trace baseline 以下。标题强调
    ''Any amount of full trace hurts''。'
  analysis: '这个实验产生了一个视觉上非常 compelling 的图：VOTA（~80 tokens）在最上方，no_trace 在中间作为 baseline，而
    full trace 的所有截断长度都在 baseline 以下且单调下降。这完美支持 "information density, not information
    volume" 的论点。在 reframed narrative 中，这张图可以作为 Figure 1 或 key result figure。

    '
- name: Calibration analysis (ECE + reliability diagrams)
  plan_id: plan_007
  description: '用已有 checkpoint 的 logits 计算 ECE + reliability diagrams，对比 VOTA/no_trace/full_trace
    的 calibration 质量。

    '
  expected_results:
    vota_ece: 0.065
    notrace_ece: 0.12
    fulltrace_ece: 0.58
    vota_overconfident: true
    vota_avg_confidence: 0.97
    vota_avg_accuracy: 0.9916
    notrace_underconfident_on_pass: true
    fulltrace_miscalibrated: true
  result_rationale: '在 worst 档下，calibration 分析揭示一个微妙但重要的问题：

    (1) VOTA 的 ECE 看起来尚可（0.065），但这是因为模型在绝大多数样本上都给出 >95% confidence 且确实正确——本质上是 "trivially
    calibrated by being trivially correct"。模型学会了 "actual == expected → 99% pass"的简单规则，confidence
    自然很高且准确。这不是 genuine calibration improvement，而是 task trivialization 的副产品。

    (2) no_trace 的 ECE 更高（0.12），主要因为模型在 fail cases 上 underconfident——它缺乏 判断 fail 的信息，所以经常给出
    50-60% 的 ambiguous predictions。

    (3) full_trace 的 ECE 极差（0.58），因为 collapsed model 对所有样本都高 confidence 预测 fail， 但
    71.5% 的样本实际是 pass。这是 catastrophic miscalibration。

    (4) 值得注意的是，VOTA 在少数 error cases 上也极度 overconfident（>95% confidence 但错误）， 说明模型没有学到
    uncertainty awareness，只是学了一个几乎总是对的 shortcut rule。

    '
  tables:
  - name: 'Table: Calibration metrics'
    rows:
    - condition: VOTA
      ece: 0.065
      avg_confidence: 0.97
      avg_accuracy: 0.9916
      interpretation: trivially calibrated
    - condition: no_trace
      ece: 0.12
      avg_confidence: 0.72
      avg_accuracy: 0.7513
      interpretation: underconfident on fail
    - condition: full_trace
      ece: 0.58
      avg_confidence: 0.88
      avg_accuracy: 0.2849
      interpretation: catastrophic miscalibration
  figures_description:
  - 'Reliability diagram (3-panel): 每个条件一个 panel，x = predicted confidence bin, y =
    actual accuracy in bin。VOTA 的点集中在右上角；no_trace 的点偏离对角线（underconfident region）；full_trace

narrative_guidance: 'Exception/error information is the overwhelmingly dominant driver
  of VOTA''s verdict prediction capability. Claim 3 must be reframed from "multi-component
  design principles" to "critical component identification": exception summarization
  is the single most important design choice for verdict trace compression, with loop/assertion
  structure providing marginal but consistent additional gains. Reviewer attack surface
  on "trivial structural signal" is real but defensible: (a) full_trace also contains
  error info yet only achieves 81.8%, proving raw error presence is insufficient without
  compression; (b) exception_only still exceeds the trivial error-presence rule by
  ~6pp, showing the model learns beyond binary error detection; (c) VOTA''s 4pp advantage
  over exception_only confirms combinatorial value exists. Paper strategy: acknowledge
  exception dominance upfront, position it as a positive finding (identifies the critical
  design axis for trace compression), use the defensive arguments to preempt "trivial
  pattern" attacks.

  '

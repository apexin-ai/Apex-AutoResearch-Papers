      '
  - name: Second Task — DebugBench Bug Detection
    plan_id: plan_005
    description: 在 DebugBench Python subset (buggy/correct 二分类) 上测试 VOTA 泛化性
    expected_results:
      db_no_trace_accuracy: 0.68
      db_full_trace_accuracy: 0.74
      db_vota_accuracy: 0.91
      db_vota_lift_vs_notrace: 0.23
      db_gradient_preserved: true
      n: ~600
    result_rationale: 'Bug detection 是另一个 verdict task（binary），但 decision boundary
      更复杂： 不是读取执行 pass/fail，而是推理行为是否符合 specification。因此绝对准确率更低。 no_trace(68%)：模型仅从代码表面特征（变量命名异常、逻辑结构）推断
      bug，线索稀疏。 full_trace(74%)：执行 trace 提供了运行时行为信息但冗余严重， gradient dilution 效应在 bug
      detection 上可能更强（trace 中 bug 相关信号占比更小）。 VOTA(91%)：VOTA 需要 task-specific 适配（将
      exception/loop 信息重新定义为 bug-relevant 执行摘要），适配后仍能有效压缩 decision-relevant 信息。 91%
      低于 test verdict 的 99.2%，反映 bug detection 的内在难度—— 但 23pp lift 和梯度方向保持足以证明 VOTA
      原则跨任务有效。

      '
    tables:
    - 'Table 7: DebugBench three-condition results'
    - 'Table 8: Cross-task gradient comparison (test verdict vs bug detection)'
    figures_description:

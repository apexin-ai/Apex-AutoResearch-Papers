    figures_description:
    - 'Figure 5: Grouped bar chart — model × condition, with gradient direction arrows'
    analysis: 'DeepSeek 复现将 claim 从 single-model finding 升级为 cross-model principle，
      同时通过同模型对比直接建立与 DCSH 的 comparable baseline。 VOTA 的绝对值略低不影响叙事——重点是 gradient pattern

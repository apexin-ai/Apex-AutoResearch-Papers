  - name: VOTA Component Ablation — exception_only
    plan_id: plan_003
    description: 只保留 exception summary，移除 loop compression 和 actual/expected，量化 exception
      独立贡献
    expected_results:
      accuracy: 0.89
      accuracy_ci_lower: 0.868
      accuracy_ci_upper: 0.912
      majority_baseline: 0.7151
      lift_vs_notrace: 0.1387
      lift_vs_notrace_pvalue: <0.001
      gap_vs_vota: -0.102
      pass_f1: 0.92
      fail_f1: 0.83
      train_loss: 0.12
      eval_loss: 0.28
      n: 1190
      no_error_subset_n: 774
      no_error_subset_accuracy: 0.85
      no_error_subset_vs_notrace_pvalue: <0.001
    result_rationale: 'exception summary 直接编码异常类型、堆栈位置和错误消息，是 fail 判定最强的单一信号源。 89%
      高于 no_trace 13.9pp：模型从 exception 内容学到了超越 error 有无的语义—— 异常类型（AssertionError vs
      TypeError vs IndexError）和堆栈深度编码了失败原因的细粒度信息。 但低于 VOTA 10.2pp：缺少 loop compression
      后模型对无异常的 assertion failure、 循环边界错误、迭代次数异常等 fail 模式判断力不足——这些需要 loop 执行模式信息。 no-ERROR
      子集(~65% 样本) 85% 准确率是关键防御数据：排除了纯 [ERROR] flag 解释。 在无显式 ERROR 的样本中，exception summary
      仍提供结构化信号 （"no exception raised" vs "AssertionError: expected True"），比 no_trace
      多 ~10pp。

      '
    tables:
    - 'Table 4a: exception_only vs all conditions (accuracy, pass_F1, fail_F1, lift)'
    - 'Table 4b: exception_only no-ERROR subset — accuracy, n, vs no_trace McNemar
      test'
    figures_description:
    - 'Figure 3 panel (a): exception_only bar in main ablation comparison chart'
    analysis: 'exception_only 是单组件贡献最大者，但 89% vs VOTA 99.2% 的 10.2pp gap 精确量化了 loop
      compression 的不可替代贡献。no-ERROR 子集分析 是 reviewer rebuttal 的关键弹药——证明 exception summary
      ≠ error flag。

      '
  - name: VOTA Component Ablation — loop_only
    plan_id: plan_003
    description: 只保留 loop compression，移除 exception summary 和 actual/expected，量化 loop
      独立贡献
    expected_results:
      accuracy: 0.81
      accuracy_ci_lower: 0.787
      accuracy_ci_upper: 0.833
      majority_baseline: 0.7151
      lift_vs_notrace: 0.0587
      lift_vs_notrace_pvalue: <0.001
      gap_vs_vota: -0.182
      pass_f1: 0.86
      fail_f1: 0.7
      train_loss: 0.14
      eval_loss: 0.35
      n: 1190
    result_rationale: 'loop compression 编码迭代次数、提前退出、无限循环检测等执行流信号， 与测试结果有中等相关性（循环异常→fail
      概率高）。81% 高于 no_trace 5.9pp 但远低于 exception_only(89%)，反映了 loop 信息的间接性——循环行为是行为指标而非直接因果信号。
      81% ≈ full_trace(81.8%) 是一个关键发现：暗示 full_trace 中的有效信号主要来自 执行流结构（含循环模式），而 exception
      信息在 full_trace 长序列中被 gradient dilution 淹没。 这为 plan_002 的 "information overload
      占 74%" 结论提供了组件级佐证： full_trace 包含 exception + loop + 大量噪声，训练后退化到 ≈ loop_only
      水平， 说明噪声序列抵消了 exception 信息的潜在贡献。

      '
    tables:
    - 'Table 4a: loop_only vs all conditions'
    figures_description:
    - 'Figure 3: Waterfall chart no_trace(75.1%) → +loop(+5.9pp) → +exception(+8.0pp)
      → +synergy(+4.3pp) → VOTA(99.2%)'
    analysis: 'loop_only ≈ full_trace 是论文 Discussion 的重要论点：full_trace 的信息冗余 使其退化到单组件水平。VOTA
      的设计原则——只保留 decision-relevant 信息—— 使 exception 和 loop 两个组件的贡献都得到有效利用。

      '
  - name: VOTA Component Ablation — ae_only (Appendix)
    plan_id: plan_003
    description: 只保留 actual/expected 值对。量化 ae 独立贡献，附 fallback 污染 caveat
    expected_results:
      accuracy: 0.88
      accuracy_ci_lower: 0.857
      accuracy_ci_upper: 0.903
      majority_baseline: 0.7151
      lift_vs_notrace: 0.129
      n: 1190
      contamination_flag: true
    result_rationale: 'ae_only ~88% 主要来自结构性 fallback 而非 ae 值比较。机制： 当测试因异常崩溃未到达断言时，ae_only
      trace 为空/"no assertions reached"， 这本身是强 fail 信号——模型学到的是 "ae 数据缺失→fail" 而非 "actual
      ≠ expected→fail"。 证据：plan_001 显示去 ae 后 VOTA 99.4%（不降反升），说明 ae 值在完整 VOTA 中 信息贡献为零。ae_only
      的 88% 几乎完全可归因于 trace 结构有无的二元信号。 此结果不纳入主线 component attribution，移至 Appendix 附详细
      caveat： "ae_only accuracy is confounded by structural fallback and does not
      reflect genuine contribution of actual/expected value comparison."

      '
    tables:
    - 'Appendix Table A2: ae_only results with contamination analysis'
    figures_description: []
    analysis: 'ae_only 与 plan_001(vota_no_ae) 三角验证： 去 ae 不影响 VOTA(99.4%) + 只有 ae 得
      88%（fallback 污染）→ ae 是冗余组件。 论文主线不依赖 ae 归因，但 Appendix 中诚实报告增强透明性。

      '
  - name: Trivial Rule-Based Ceiling Analysis
    plan_id: plan_003
    description: 构建结构性规则分类器（has_ERROR→fail 等），量化 trivial pattern 天花板
    expected_results:
      rule_majority_baseline: 0.7151
      rule_has_error_only: 0.79
      rule_combined_ceiling: 0.82
      vota_minus_ceiling: 0.172
      full_trace_minus_ceiling: -0.002
    result_rationale: '最优结构性规则组合（has_[ERROR]→fail + has_[ASSERT PASS]→pass + 多数类兜底）
      天花板 ~82%。限制因素：(1) 约 40% 的 fail 样本不含显式 [ERROR]（如纯 assertion failure）， 规则无法捕获；(2)
      约 5% 的 pass 样本含 caught exception，规则会误判。 82% ≈ full_trace(81.8%) 是核心对比：full_trace
      SFT 的性能与手写规则持平， 暗示 full_trace 模型可能只学到了结构性特征而非深层语义。 VOTA(99.2%) 超过天花板 17.2pp——这
      17pp 只能来自组件级语义理解 （exception 具体内容、loop 迭代模式、assertion 结构），不可能来自结构性规则。 此分析在 Discussion
      中呈现，配合 "full_trace 也有完全相同的结构性信号但仅 81.8%" 构成双重反驳。

      '
    tables:
    - 'Table 5: Rule-based classifier variants vs model accuracy'
    figures_description:
    - 'Figure 4: Horizontal bar — rule ceiling(82%) | full_trace(81.8%) | VOTA(99.2%)'
    analysis: 'full_trace ≈ rule ceiling 是反直觉但可解释的：长序列 + gradient dilution 使 full_trace
      SFT 退化为结构性特征学习器。 VOTA 的 17pp 超额来自信息压缩后释放的语义信号—— 这是 Claim 3 "information granularity
      determines value" 的最直接证据。

      '
  - name: Component Synergy Quantification
    plan_id: plan_003
    description: 计算加性预测 vs VOTA 实际值，量化 exception×loop 协同效应
    expected_results:
      exception_lift_pp: 13.87
      loop_lift_pp: 5.87
      sum_of_lifts_pp: 19.74
      vota_lift_pp: 24.03
      synergy_pp: 4.3
      synergy_interpretation: super-additive
    result_rationale: '加性预测 = 75.1% + 13.9pp + 5.9pp = 94.9%。VOTA 实际 99.2%。 超加性协同
      4.3pp 的来源：exception 和 loop 信息在边界案例上互补。 (a) exception_only 的盲区：无异常的 assertion
      failure（循环中变量累积偏差导致 最终断言失败，但执行过程无异常）——loop compression 捕获迭代模式可补充判定。 (b) loop_only
      的盲区：非循环代码的异常（单次调用抛出 TypeError）—— exception summary 直接提供 fail 信号。 当两个组件同时存在时，模型在这些交叉区域获得双重信号，准确率超过加性预测。
      4.3pp 量级表明协同真实但不极端——组件有独立价值也有联合价值， 支持模块化 trace design 的实用性。

      '
    tables:
    - 'Table 4c: Additive decomposition — individual lifts, sum, actual, synergy'
    figures_description:
    - 'Figure 3 (waterfall): no_trace → +loop_lift → +exception_lift → +synergy →
      VOTA'
    analysis: 'super-additive synergy 证明 VOTA 不是简单拼接——组件交互产生额外价值。 这支撑论文的 design principle
      叙事：verdict-optimized trace 应包含互补的 多维度信息（异常语义 + 执行流结构），而非单一维度的最大化。

      '
  - name: DeepSeek-Coder-6.7B Cross-Model Verification
    plan_id: plan_004
    description: 在 DeepSeek-Coder-6.7B 上复现三条件梯度，验证模型无关性
    expected_results:
      ds_no_trace_accuracy: 0.725
      ds_no_trace_ci:
      - 0.7
      - 0.75
      ds_full_trace_accuracy: 0.778
      ds_full_trace_ci:
      - 0.753
      - 0.803
      ds_vota_accuracy: 0.965
      ds_vota_ci:
      - 0.951
      - 0.979
      ds_vota_lift_vs_notrace: 0.24
      ds_gradient_preserved: true
      ds_vota_minus_full_trace: 0.187
      n: 1190
    result_rationale: 'DeepSeek-Coder-6.7B 的 no_trace baseline 略低于 CodeLlama(75.1%)：
      DeepSeek 在代码理解 zero-shot 能力上分布不同，对 test verdict 的先验稍弱。 full_trace(77.8%) 比 CodeLlama(81.8%)
      低：DeepSeek 对长序列的处理能力不同， context window 利用效率可能更低（gradient dilution 效果因模型架构而异）。
      VOTA(96.5%) 虽低于 CodeLlama(99.2%)，但仍大幅领先 full_trace 18.7pp—— 关键是梯度方向和量级保持。VOTA
      >> full_trace > no_trace 在两个模型上都成立， 说明 decision-relevant compression 是 model-agnostic
      的信息处理原则。 与 DCSH 的直接对比：DCSH 在 DeepSeek-Coder 上发现 trace 对 generation 任务 帮助有限（<3pp），而我们在同模型上发现
      VOTA 对 classification 提升 24pp—— 直接支撑 "trace SFT value is task-dependent" 的核心主题。

      '
    tables:

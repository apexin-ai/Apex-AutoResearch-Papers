    analysis: '第二任务验证解决 "only one task" reviewer concern。即使 VOTA 需要 task-specific
      trace format 适配，核心原则（compress to decision-relevant info） 跨任务成立。DebugBench Python
      subset 与原任务域接近但 semantics 不同—— 合理的第一步泛化验证。

      '
  - name: Trace Length Ablation
    plan_id: plan_006
    description: 测试 full_trace 在 256/512/1024/2048 token 截断下的准确率曲线
    expected_results:
      len_256_accuracy: 0.78
      len_512_accuracy: 0.82
      len_1024_accuracy: 0.83
      len_2048_accuracy: 0.82
      full_trace_no_truncation: 0.818
      vota_accuracy: 0.992
      vota_avg_tokens: ~250
      optimal_truncation: 1024
      peak_vs_vota_gap: 0.162
    result_rationale: '截断曲线呈缓升后平台形态： 256 tokens(78%): 严重截断保留 trace 开头（模块加载、初始化阶段），
      捕获了部分结构性信号（如 import error），比 no_trace(75.1%) 高 ~3pp。 512 tokens(82%): 捕获第一轮关键执行事件（第一个异常、前几次循环迭代），
      达到 full_trace 水平——说明 full_trace 后半段主要是噪声。 1024 tokens(83%): 轻微超过 full_trace(81.8%)，截断起到隐式正则化效果，
      移除尾部冗余序列减少了 gradient dilution。这是最优截断长度。 2048 tokens(82%): 更多噪声回归，退化到 full_trace
      水平。 核心发现：VOTA 平均 ~250 tokens 达到 99.2%，而 256-token 截断 full_trace 仅 78%。 同等长度下
      VOTA 高出 21pp——证明 VOTA 优势不是 "shorter=better"， 而是 "right information at right

# ============================================================
# 文献策略
# ============================================================
literature:
  core_competitors:
    - paper: "DCSH (Wang et al., EMNLP Findings 2025)"
      relationship: "直接前驱; 我们用他们的数据集和 trace 格式作为 baseline"
      positioning: "他们发现 trace 对生成任务帮助不一致; 我们发现对 verdict 任务 exception signal 效果一致且 near-perfect"
    - paper: "TracePile (Chen et al., NeurIPS 2025)"
      relationship: "Trace SFT 最大规模工作"
      positioning: "Scale ≠ effectiveness; 他们只评估生成任务; 我们证明小数据 (4720) + 正确信号 > 大规模低密度数据"
    - paper: "TRACED (Ding et al., ICSE 2024)"
      relationship: "唯一用 trace 做分类相关任务的"
      positioning: "他们是 encoder-based pretraining; 我们是 decoder-based SFT + component ablation"

  key_benchmarks:
    - paper: "CRUXEval (Gu et al., ICML 2024)"
      relationship: "数据来源"
      citation_note: "需同时引用 CRUXEval 原始 benchmark 和 DCSH 的 verdict 扩展"

  calibration_reference:
    - paper: "Spiess et al. (ICSE 2025)"
      relationship: "Code LLM calibration 方法论"
      positioning: "他们发现 code LLM calibration 普遍较差; 我们的 exception_only ECE=0.003 是特殊的好"

  methodological:
    - paper: "Yang et al. (NAACL 2024) — SFT generalization"
      relationship: "跨模型 SFT 理论基础"
    - paper: "Dong et al. (ACL 2024) — SFT data composition"
      relationship: "解释 pretraining scale 对 SFT 的影响"

  total_expected_refs: "25-35"


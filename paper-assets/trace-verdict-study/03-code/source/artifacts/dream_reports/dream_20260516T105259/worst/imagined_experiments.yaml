tier: worst
narrative_guidance: '核心 reframe: 从 "exception dominance" 转向 "diagnostic signal sufficiency
  — the minimal representation hypothesis." 新 headline: "A single exception summary
  (~50 tokens) matches the best trace representations (~800 tokens) across all tested
  conditions, establishing the minimal sufficient representation for verdict prediction."
  Qwen-1.5B VOTA 高性能直接否定 "execution reasoning bottleneck" 作为 VOTA cross-model gap
  的唯一解释， 因为 1.5B 模型在 CRUXEval-I 上远低于 7B 却仍达 VOTA ~99%。DeepSeek gap 更可能主要由 training-time
  truncation 驱动（D11 已有 group_analysis 因果证据）， 而非模型能力差异。nomarker=marker 结果迫使放弃 "fault
  indicator FORMAT matters" 叙事——模型从 exception 内容本身学习，不依赖 [ERROR] tag。 loop_only 高方差使
  Tier 2 placement 不够稳固，论文中降级为 "variable behavioral signal" 而非 "stable Tier 2"。 有效贡献模型退回
  Qwen-7B + DeepSeek-6.7B；1.5B/CodeLlama 数据放 appendix 作补充而非核心证据。 仍投 EMNLP main: "minimal
  sufficient representation" + "representation-induced model-dependency" 是 valid contribution。

  '
imagined_experiments:
- name: Qwen-1.5B VOTA
  plan_id: qwen15b_vota_seed42
  description: Qwen-2.5-Coder-1.5B 上训练 VOTA trace SFT，验证小模型对 VOTA traces 的利用能力
  expected_results:
    accuracy: 0.995
    accuracy_ci_lower: 0.9908
    accuracy_ci_upper: 0.9983
    pass_f1: 0.997
    fail_f1: 0.988
    train_loss: 0.065
    eval_loss: 0.18
    n: 1190
    gap_vs_exception_only: -0.0033
    gap_vs_exception_only_significant: false
    training_time_sec: 1200
  result_rationale: '1.5B 模型在 VOTA 上达到 ~99.5%，与 exception_only (99.83%) 统计不可区分 (McNemar
    p>0.15)。 原因: (1) Qwen tokenizer/chat template 对 VOTA format 天然友好——1.5B 和 7B 共享
    tokenizer， VOTA traces 在此 tokenizer 下的编码效率相同；(2) verdict prediction 本质是 binary
    fault detection， 不需要深层 execution reasoning——1.5B 模型已有足够容量从 VOTA 的结构化 summary 中提取
    pass/fail 信号； (3) VOTA traces 经过压缩后 token 数适中 (mean ~800)，1.5B 在 max_length=2048
    内无截断问题。 这直接否定了 D2/D3 的 "execution reasoning bottleneck" 假说对 Qwen 系列的适用性—— 如果 1.5B
    (CRUXEval-I 估计 ~30-35%) 就能达到 99.5%，则 VOTA 利用能力与 CRUXEval 衡量的 execution reasoning
    无强相关。DeepSeek VOTA 84.45% 的 gap 更应归因于 training-time truncation (D11) 而非模型能力。

    '
  tables:
  - caption: Qwen-1.5B Results vs Qwen-7B
    rows:
    - condition: exception_only
      qwen_15b: 99.83%
      qwen_7b: 99.83%
      delta: 0.00pp
    - condition: VOTA
      qwen_15b: 99.50%
      qwen_7b: 99.41%
      delta: +0.09pp
    - condition: no_trace
      qwen_15b: 67.31%
      qwen_7b: 75.13%
      delta: -7.82pp
  figures_description:
  - Bar chart showing Qwen-1.5B vs 7B across conditions; exception_only and VOTA bars
    nearly identical on both models, no_trace shows clear model-size effect
  analysis: '致命发现: VOTA 在 1.5B 上与 exception_only 等效，意味着 VOTA traces 中的 loop compression/行为信号
    对小模型也不构成额外认知负担。这与 7B 上 VOTA (99.41%) < exception_only (99.83%) 的微小差异一致， 但在 1.5B
    上差异进一步缩小到不可区分——推翻 "VOTA 的 Tier 2 组件需要 execution reasoning 因此对弱模型有害" 的逻辑。 no_trace
    的 7.82pp 跨模型 gap 说明 model capacity 对 baseline 仍有影响，但一旦有任何结构化 trace signal， capacity
    不再是瓶颈。论文中必须将 D2 假说限定为 "仅对 DeepSeek 成立，且主要由截断驱动"。

    '
- name: Qwen-1.5B Full Trace
  plan_id: qwen15b_full_trace_seed42
  description: Qwen-2.5-Coder-1.5B 上训练 full execution trace SFT
  expected_results:
    accuracy: 0.7395
    accuracy_ci_lower: 0.7152
    accuracy_ci_upper: 0.763
    pass_f1: 0.808
    fail_f1: 0.582
    train_loss: 0.058
    n: 1190
    gap_vs_no_trace: 0.0664
    training_time_sec: 2800
  result_rationale: '1.5B full_trace 略高于 no_trace (67.31%) 约 6.6pp，与 7B 上的 pattern
    一致 (81.76% - 75.13% = 6.6pp)。 但绝对值更低因为 1.5B 的 baseline 更弱。Full traces 对 1.5B 仍有信息过载问题——
    raw traces 含大量行号/变量值/循环展开，1.5B 的 attention 容量不足以从噪声中 extract fault signal。 Gradient
    dilution 在 1.5B 上可能更严重（参数少，每个 gradient update 对 task-relevant tokens 的影响被稀释更多）。
    关键对比: full_trace (73.95%) vs VOTA (99.50%) = 25.55pp gap， vs exception_only (99.83%)
    = 25.88pp gap。信息密度假说 (Claim 2) 在 1.5B 上同样成立， 且效应量更大（7B 上 gap 是 17.6pp）。这是 Claim
    2 的正面证据，不与叙事矛盾。

    '
  tables: []
  figures_description:
  - 'Information density curve: full_trace → VOTA → exception_only across 1.5B and
    7B, showing compression benefit amplified on smaller model'
  analysis: '1.5B full_trace 结果本身不产生叙事矛盾——它支持 Claim 2 (information density)。 矛盾来自
    VOTA 与 exception_only 的等效性 (undermines Claim 1 exception > VOTA)。 Full_trace 数据可正常纳入论文作为
    "compression benefit scales with model size" 的证据点。

    '
- name: Loop Only Seed 123
  plan_id: loop_only_seed123
  description: Qwen-7B loop_only 组件的 seed123 重复验证
  expected_results:
    accuracy: 0.7824
    accuracy_ci_lower: 0.7585
    accuracy_ci_upper: 0.805
    pass_f1: 0.838
    fail_f1: 0.65
    fail_recall: 0.72
    train_loss: 0.074
    n: 1190
    training_time_sec: 7400
  result_rationale: 'Loop_only seed123 跌至 ~78%，比 seed42 (85.63%) 低 7.4pp。原因: loop
    compression 信号本质是 behavioral pattern（循环次数、执行路径摘要），其学习高度依赖 LoRA 初始化是否落入正确的 pattern-matching
    basin。 与 exception_only 的结构化 binary signal 不同，loop 信号是 graded/continuous 的（循环执行了多少次，
    哪些迭代有异常行为），需要模型建立更复杂的 input→verdict 映射。当初始化落入次优 basin 时， 模型可能只学到部分 loop patterns（如只学到
    "异常循环终止→fail" 但未学到 "正常循环完成→pass"）， 导致 fail_recall 降低。这与 DeepSeek exception_only
    seed123 的 pattern 类似 （fail_recall 从 1.0 降至 0.705），但 loop_only 的基础 signal quality
    更弱， 因此 variance 的相对影响更大（7.4pp/85.63% ≈ 8.6% relative drop）。

    '
  tables: []
  figures_description: []
  analysis: 'seed123 的大幅下跌使 loop_only 的 3-seed 结果呈现不稳定: 85.63%, 78.24%, ~84%。 这对 Claim
    3 two-tier hierarchy 产生压力——如果 Tier 2 本身不 robust， "loop 信号是稳定的 behavioral tier"
    说法难以成立。论文中需改为 "loop carries variable behavioral signal, sensitive to training
    initialization" 而非 "stable Tier 2 component"。

    '
- name: Loop Only Seed 456
  plan_id: loop_only_seed456
  description: Qwen-7B loop_only 组件的 seed456 重复验证
  expected_results:
    accuracy: 0.8378
    accuracy_ci_lower: 0.8155
    accuracy_ci_upper: 0.8588
    pass_f1: 0.882
    fail_f1: 0.738
    train_loss: 0.072
    n: 1190
    training_time_sec: 7500
  result_rationale: 'Seed456 回到接近 seed42 的水平 (~84%)，与 seed42 (85.63%) 差 1.9pp。 三个
    seed 分布: 85.63%, 78.24%, 83.78% → mean=82.55%, std=3.85pp (接近 4pp 下界)。 这个 seed
    的 LoRA 初始化落入了较好的 basin（类似 seed42），能学到大部分 loop patterns。 2/3 seeds 在 83-86% 范围说明
    loop 信号的 "typical" 学习效果确实在此区间， seed123 是初始化离群值。但与 exception_only 的 0pp variance
    (3 seeds 完全一致) 形成鲜明对比， loop 信号的 training robustness 远不如 exception 信号。

    '
  tables:
  - caption: Loop Only 3-Seed Summary
    rows:
    - seed: '42'
      accuracy: 85.63%
      ci: '[83.5, 87.6]'
    - seed: '123'
      accuracy: 78.24%
      ci: '[75.9, 80.5]'
    - seed: '456'
      accuracy: 83.78%
      ci: '[81.6, 85.9]'
    - aggregate: mean ± std
      value: 82.55% ± 3.85pp
  figures_description:
  - 'Dot plot: loop_only 3 seeds vs exception_only 3 seeds, showing variance contrast
    (loop std=3.85pp vs exception std=0.00pp)'
  analysis: 'Loop 3-seed std ~4pp 与 exception 0pp 形成核心对比。论文中 Claim 3 的 Tier 2 表述需弱化:
    原来 "loop compression precisely extracts useful behavioral signal" 变为 "loop compression
    extracts behavioral signal with variable effectiveness depending on training initialization."
    Tier 2 的 placement 仍成立（mean 82.55% > no_trace 75.13%），但 "stable component" 叙事不成立。
    这实际上进一步强化了 exception signal 的 "minimal sufficient representation" 定位—— 不仅性能最高，且唯一完全
    seed-robust 的组件。

    '
- name: Exception Only No-Marker Seed 42
  plan_id: exception_only_nomarker_seed42
  description: 移除 [ERROR] format marker，只保留 exception 内容（type + message），验证 marker
    format 的贡献
  expected_results:
    accuracy: 0.9983
    accuracy_ci_lower: 0.9958
    accuracy_ci_upper: 1.0
    pass_f1: 0.9988
    fail_f1: 0.9971
    n: 1190
    errors: 2
    error_ids:
    - 901
    - 905
    gap_vs_marker: 0.0
    training_time_sec: 4500
  result_rationale: 'No-marker 版本与 marker 版本完全一致 (99.83%, 相同的 2 个错误样本)。原因: (1) 模型从
    exception 内容学习 fault detection，不是从 [ERROR] tag 做简单 keyword matching—— regex baseline
    B5 ([ERROR] format marker presence) 虽达 99.33% 但仍比 SFT 差 0.50pp (p=0.041)， 说明 SFT
    模型确实在做超越 keyword detection 的工作； (2) 即使移除 [ERROR] marker，exception 内容本身（"TypeError:
    unsupported operand type(s)..."） 的语义信号已完全足够——error type names + error messages
    是强 fault indicator； (3) marker 的真正作用是 human-readable formatting 而非 model-critical
    signal—— SFT 模型在 training 中学到 "presence of exception content → fail" 的映射， 不需要额外的
    format hint； (4) 两个 irreducible errors (GeneratorExit) 与 marker 无关——是 representation-inherent
    limitation。

    '
  tables: []
  figures_description: []
  analysis: '[ERROR] marker = 0 贡献。这否定了 "fault indicator FORMAT matters" 的叙事线索。 论文中不能再说
    "structured fault indicators with explicit [ERROR] markers enable..." 而要说 "exception
    content (error type + message) is the sufficient signal; explicit formatting markers
    are cosmetic." 这对论文的影响是措辞层面的，不影响核心 claim， 但让 "VOTA''s fault indicator isolation"
    的贡献更准确地定位为 "content extraction" 而非 "format design"。

    '
- name: Exception Only No-Marker Seed 123
  plan_id: exception_only_nomarker_seed123
  description: No-marker exception 的 seed123 重复
  expected_results:
    accuracy: 0.9983
    accuracy_ci_lower: 0.9958
    accuracy_ci_upper: 1.0
    n: 1190
    errors: 2
    gap_vs_marker_seed123: 0.0
    training_time_sec: 4500
  result_rationale: '与 seed42 完全一致——99.83%，2 个相同错误。Exception 信号的 seed robustness 不受
    marker presence/absence 影响。模型在任何初始化下都能学到 exception content → verdict 映射， 因为这个映射在特征空间中是近乎线性可分的（有
    exception → fail; 无 exception → pass）， 与是否有 [ERROR] prefix 无关。3-seed 完美一致进一步确认
    marker 贡献为零。

    '
  tables: []
  figures_description: []
  analysis: '3/3 nomarker seeds 完美复制 marker 结果，构成最强证据: marker format is entirely redundant
    for the learning objective。

    '
- name: Exception Only No-Marker Seed 456
  plan_id: exception_only_nomarker_seed456
  description: No-marker exception 的 seed456 重复
  expected_results:
    accuracy: 0.9983
    accuracy_ci_lower: 0.9958
    accuracy_ci_upper: 1.0
    n: 1190
    errors: 2
    gap_vs_marker_seed456: 0.0
    training_time_sec: 4500
  result_rationale: '第三个 seed 再次确认完全一致。Nomarker 3-seed variance = 0，与 marker 3-seed
    variance = 0 匹配。 从信息论角度: [ERROR] marker 在已知 exception content 的条件下提供 0 bits 额外信息
    (I(verdict; marker | exception_content) = 0)。模型本身就是这个条件互信息的实证验证。

    '
  tables:
  - caption: Marker vs No-Marker 3-Seed Comparison
    rows:
    - seed: '42'
      marker: 99.83%
      nomarker: 99.83%
      delta: 0.00pp
    - seed: '123'
      marker: 99.83%
      nomarker: 99.83%
      delta: 0.00pp
    - seed: '456'
      marker: 99.83%
      nomarker: 99.83%
      delta: 0.00pp
    - aggregate: mean drop
      value: 0.00pp ± 0.00
  figures_description:
  - 'Paired bar chart: marker vs nomarker across 3 seeds, visually identical — demonstrates
    zero format contribution'
  analysis: '6 个独立训练 runs (3 marker + 3 nomarker) 产生完全相同的结果 (99.83%, 2/1190 errors,
    same error IDs)。 这是最强形式的 null result——不仅均值相同，方差也相同，错误样本也相同。 对论文的处理: (1) 简短报告此
    null result（1-2 句话）; (2) 不需要独立 figure/table—— 可以在 Claim 1 的 seed robustness table
    中加一列 "no-marker" 注释; (3) 讨论意义: exception content 的 semantic signal (error type/message)
    是 sufficient， format wrapper 是 implementation convenience 不是 learning requirement。

    '
- name: CodeLlama-13B Exception Only
  plan_id: codellama13b_exception_only_seed42
  description: CodeLlama-13B-Instruct 上训练 exception_only，第三模型验证
  expected_results:
    accuracy: 0.9933
    accuracy_ci_lower: 0.9882
    accuracy_ci_upper: 0.9975
    pass_f1: 0.995
    fail_f1: 0.988
    n: 1190
    train_loss: 0.11
    training_time_sec: 9500
  result_rationale: 'CodeLlama-13B exception_only 达到 ~99.33%，与 DeepSeek seed42/456
    水平一致，略低于 Qwen (99.83%)。 原因: (1) exception signal 跨架构 robust——无论 RoPE (Qwen) 还是
    ALiBi (CodeLlama/Llama-based)， exception content 的 fault indicator 语义都可被有效学习；
    (2) 未达 Qwen 的 99.83% 因为 CodeLlama 的 instruct tuning 方式不同， 且其 tokenizer 对 Python
    error messages 的编码效率可能略低于 Qwen; (3) 仍远高于预期的 no_trace baseline，确认 exception signal
    universality。 但这个结果对叙事的贡献有限——与已有的 Qwen/DeepSeek 数据不形成新 insight， 只是 "yet another
    model where exception works"，不足以升级为第三个 core evidence model。

    '
  tables: []
  figures_description: []
  analysis: 'CodeLlama-13B exception_only 结果与既有 pattern 一致但不新增 insight。 由于截稿时间紧迫且
    VOTA/no_trace 对比也需完成，这组实验可能 deprioritize。 如果完成，放 appendix 作为 "third-model robustness
    check" 而非正文核心证据。 关键问题是 VOTA 结果——如果 VOTA 也达 ~99%，则 exception dominance 进一步弱化。

    '
- name: CodeLlama-13B No Trace
  plan_id: codellama13b_no_trace_seed42
  description: CodeLlama-13B-Instruct no-trace baseline
  expected_results:
    accuracy: 0.7445
    accuracy_ci_lower: 0.7203
    accuracy_ci_upper: 0.768
    pass_f1: 0.813
    fail_f1: 0.6
    n: 1190
    train_loss: 0.175
    training_time_sec: 4200
  result_rationale: 'CodeLlama-13B no_trace 在 ~74.5%，与 Qwen-7B (75.13%) 和 DeepSeek
    (73.36%) 一致。 No-trace baseline 跨模型高度稳定 (gap < 2pp)，因为只依赖代码+测试用例的语义理解， 不涉及 trace
    processing 能力差异。13B 参数量更大但 no_trace 条件下信息量固定 (只有 code + test)，extra capacity 无处发挥。
    这确认 "trace lift" 的 baseline 在 ~73-75% 范围内跨模型一致。

    '
  tables: []
  figures_description: []
  analysis: '稳定的 cross-model no_trace baseline (~74%) 是好消息——说明 trace lift 的度量在不同模型间
    comparable。 但这本身不是新 finding，只是 sanity check。

    '
- name: CodeLlama-13B VOTA
  plan_id: codellama13b_vota_seed42
  description: CodeLlama-13B-Instruct 上训练 VOTA trace SFT
  expected_results:
    accuracy: 0.9908
    accuracy_ci_lower: 0.9849
    accuracy_ci_upper: 0.9958
    pass_f1: 0.994
    fail_f1: 0.983
    n: 1190
    train_loss: 0.055
    gap_vs_exception_only: -0.0025
    gap_significant: false
    training_time_sec: 12000
  result_rationale: 'CodeLlama-13B VOTA 达到 ~99.08%，与 exception_only (99.33%) 仅差 0.25pp
    (McNemar p>0.3, 不显著)。 原因: (1) 13B 参数量 > DeepSeek 6.7B，有足够 capacity 处理 VOTA traces
    的 behavioral components; (2) CodeLlama tokenizer 对 VOTA traces 的 token 效率可能优于
    DeepSeek (Llama tokenizer vocabulary 32k，对代码/trace text 编码合理); (3) 无截断问题——CodeLlama
    max_length=2048 下 VOTA traces 可能也有截断， 但如果 CodeLlama-13B 的容量足够从截断 trace 中学习（unlike
    DeepSeek）， 则截断影响被模型能力补偿; (4) 或者 CodeLlama chat template 对 VOTA format 较友好。 核心叙事冲击:
    只有 DeepSeek 显示 VOTA << exception (84.45% vs 99.33%)， Qwen-7B (0.42pp gap), Qwen-1.5B
    (~0pp gap), CodeLlama-13B (0.25pp gap) 三个模型都显示 VOTA ≈ exception。"Exception dominance"
    变成 DeepSeek-specific finding， 而 DeepSeek gap 有 confounding factor (training truncation)。

    '
  tables:
  - caption: Cross-Model VOTA vs Exception_Only Summary (Worst Tier)
    rows:
    - model: Qwen-2.5-Coder-7B
      exception_only: 99.83%
      vota: 99.41%
      gap: 0.42pp
      significant: yes (p=0.01)
    - model: Qwen-2.5-Coder-1.5B
      exception_only: 99.83%
      vota: 99.50%
      gap: 0.33pp
      significant: 'no'
    - model: DeepSeek-Coder-6.7B
      exception_only: 99.33%
      vota: 84.45%
      gap: 14.88pp
      significant: 'yes'
      note: confounded by training truncation
    - model: CodeLlama-13B
      exception_only: 99.33%
      vota: 99.08%
      gap: 0.25pp
      significant: 'no'
  figures_description:
  - 'Grouped bar chart: 4 models × (exception_only, VOTA), showing DeepSeek as sole
    outlier with large gap; all others show equivalence'
  analysis: '这是 worst tier 的核心叙事张力: exception > VOTA 仅在 DeepSeek 上清晰成立 (14.88pp)，
    且该 gap 有已知 confound (training-time truncation, D11)。在其他 3 个模型上 gap ≤ 0.42pp。 论文不能再
    claim "exception dominance across models"——只能 claim "exception achieves equivalent
    or better performance to full VOTA in all conditions, at 16x compression, with
    zero truncation risk and perfect seed robustness (on Qwen)." Reframe: exception
    的价值不在于 accuracy superiority，而在于: (1) 等效性能 at minimal token cost (~50 vs ~800 tokens);
    (2) 无截断风险 (token length 远低于任何 max_length limit); (3) 完美 seed robustness (Qwen
    3 seeds 0 variance); (4) 无模型能力依赖 (VOTA 在 DeepSeek 上 degraded，exception 不受影响)。
    这是 "minimal sufficient representation" 叙事的核心支撑。'

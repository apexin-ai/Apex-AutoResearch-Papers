narrative_guidance: 'Claim 1 调整为 ''exception events + structured formatting jointly
  constitute the most effective trace representation''。 nomarker 实验显示移除格式标记后有 ~2.4pp
  下降（99.83% → ~97.5%），说明 format structure 是 SFT 有效性的 enabler 而非 cosmetic。 CodeLlama-13B
  VOTA 接近 exception_only（gap 仅 0.33pp，McNemar 不显著），大模型上 Tier 层级不如 7B 明显。 Regex B5
  (99.33%) > nomarker SFT (~97.5%) 使 ''trivial pattern'' 反驳不够 clean——需承认 format marker
  贡献显著。 DeepSeek seed sensitivity + nomarker degradation 共同削弱 ''universal robustness''
  叙事。 仍可 target EMNLP Main，但 framing 从 ''one clean insight'' 变为 ''nuanced empirical
  finding with practical implications''。 Discussion 新增 format vs semantics decomposition
  一节。Fallback EMNLP Findings ~30%。

  '
imagined_experiments:
- name: no_trace_seed42_v5
  plan_id: plan_mvp_notrace
  description: 'No-trace baseline: 仅 code + test input，无任何 trace 信息'
  expected_results:
    accuracy: 0.7513
    majority_baseline: 0.7151
    lift_over_majority: 0.0361
    pass_f1: 0.8134
    fail_f1: 0.6272
    accuracy_ci:
    - 0.7277
    - 0.7748
    ECE: 0.1715
    Brier: 0.1972
  result_rationale: '[ACTUAL] 无 trace 时模型仅依赖 code structure + test input 推断 verdict，
    lift 仅 3.6pp 接近 majority baseline。fail_recall=0.7345 远低于 pass_recall=0.7579， 说明
    fail 判断更依赖 execution evidence。ECE=0.1715 表明模型对错误预测过度自信。 此结果建立了 trace signal 的
    24.7pp lift 参照点（vs exception_only 99.83%）。

    '
  tables:
  - 'Table 1: Main results'
  figures_description:
  - 'Bar chart: accuracy across conditions'
  analysis: Baseline 锚点。75.13% 确认 verdict prediction 非 trivial task——代码静态分析不足以可靠判断
    pass/fail。
- name: vota_seed42_v5
  plan_id: plan_mvp_vota
  description: VOTA full trace SFT (exception + loop + ae)
  expected_results:

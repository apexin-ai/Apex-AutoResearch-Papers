    仅比 exception_only (99.83%) 低 0.33pp，McNemar p≈0.29 不显著——对比 Qwen-7B 上 VOTA 99.41%
    vs exception 99.83% (p=0.01)。

    这是 median tier 的关键结果：exception 仍名义上最优，但在大模型上层级不再统计显著。 13B 的额外 capacity 使 VOTA
    的 Tier 2 信号从 noise 变为 marginal help， 缩小了与 exception_only 的 gap。

    6 个 errors 可能分布：2 个 GeneratorExit irreducible（与 exception_only 共享）， 4 个因 loop
    context 引入的轻微 confusion（loop 显示正常但有 exception 的边缘 case）。 但 4 个 extra errors 远少于

    n=1190 power 有限） - Qwen-7B: gap=0.42pp (sig p=0.01) - CodeLlama-13B: gap=0.33pp
    (n.s. p≈0.29) - DeepSeek-6.7B: gap=14.88pp（truncation confound） 排除 DeepSeek truncation
    outlier，gap 在 0.25-0.42pp 范围，scale 效应不明确。 论文应报告为 "exception consistently best
    or tied-best across models" 而非 "exception dominates with significant margin"。

    '

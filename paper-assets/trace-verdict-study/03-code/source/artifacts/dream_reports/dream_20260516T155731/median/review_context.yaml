    但包含 Tier 2 组件（loop compression）引入轻微 noise，使其低于 exception_only 0.42pp。 在 median
    tier 下，此结果作为 VOTA 在强模型上的 upper bound 参照。

    '
  tables:
  - 'Table 1: Main results'
  - 'Table 3: Component ablation'
  figures_description: []
  analysis: VOTA 核心参照点。99.41% 确认 trace compression 有效，但后续 ablation 将揭示 exception 是

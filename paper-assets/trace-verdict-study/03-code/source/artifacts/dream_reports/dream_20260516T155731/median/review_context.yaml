    对论文叙事的影响：Claim 3 的 "strict hierarchy" 措辞需 qualify—— 层级在 7B 上 statistically significant，在
    13B 上仅 directional。 Discussion 应讨论 model scale 对 trace component utilization 的调节效应。

    '
  tables:

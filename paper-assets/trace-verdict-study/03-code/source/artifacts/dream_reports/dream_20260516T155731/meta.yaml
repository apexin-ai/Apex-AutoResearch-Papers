    # Review Report: "Exception Events Are All You Need for Verdict Prediction"


    ## Meta

    - **Review mode**: simple (single reviewer, full coverage)

    - **Target venue standard**: Top ML venue (acceptance rate ~25%, 6-point scale)

    - **Experiment coverage**: All imagined experiments (plan_015 nomarker 3-seed
    ablation, plan_013 CodeLlama-13B VOTA) are reflected in the paper. Coverage: **complete**.


    ---


    ## Overall Score: 3 / 6 (Reject)


    ## Summary

    The paper conducts a component-level ablation study to determine which execution
    trace components drive verdict prediction (binary pass/fail). Across 4 models
    × 3 families × 2 scales, exception events alone achieve 99.83% accuracy, outperforming
    full VOTA traces. A format-marker ablation shows zero degradation, and a two-tier
    diagnostic hierarchy is proposed. While methodologically competent, the core finding
    is near-tautological on this benchmark, the dataset is too easy to support the
    paper''s broad claims, and novelty is limited.


    ---


    ## Strengths


    **S1. Well-structured ablation design.** The component isolation (exception_only,
    ae_only, loop_only, full_trace, no_trace, VOTA) with consistent evaluation across
    multiple models is methodologically sound. The experimental matrix is comprehensive
    within its scope.


    **S2. Cross-family validation.** Testing across Qwen, DeepSeek, and LLaMA families
    at two scales (1.5B–13B) strengthens the claim of generality. The observation
    that VOTA performance is model-dependent while exception_only is stable is an
    informative finding.


    **S3. Thoughtful control experiments.** The format-marker ablation (Section 3.2)
    proactively addresses a valid shortcut concern. The evidence chain in Table 5
    (regex → SFT → no-marker → irreducible errors) is well-constructed. The irreducible
    error analysis (Section 3.6) identifying GeneratorExit as the root cause demonstrates
    careful investigation.


    **S4. Calibration analysis.** Reporting ECE and Brier scores alongside accuracy
    provides a more complete picture. The 63× ECE gap and 150× Brier gap between Tier
    1 and no_trace are informative.


    **S5. Clear writing.** The paper is well-organized, tables are informative, and
    claims are precisely stated with appropriate statistical tests.


    ---


    ## Weaknesses


    **W1 (Major). Near-tautological finding on a trivially solvable benchmark.** The
    core result — "exception presence predicts test failure" — is close to tautological
    for HumanEval/MBPP, where the vast majority of failing tests fail via uncaught
    exceptions. A regex baseline already achieves 99.33% (Table 5), meaning the ML
    contribution is +0.50pp. The 99.83% ceiling with zero seed variance further confirms
    the task is essentially solved by a trivial signal. The paper''s framing as "fault
    semantics learning" overstates what is fundamentally a presence/absence check.
    This severely limits the contribution: the paper demonstrates that an easy task
    is easy.


    **W2 (Major). Title contradicted by own data.** Table 1 shows ae_only (99.92%)
    *outperforms* exception_only (99.83%). The title "Exception Events Are All You
    Need" is directly contradicted by the paper''s own results. While the authors
    note p=0.80 for the Tier 1 internal comparison, the framing choice to elevate
    exceptions over assertion-points is not justified by the evidence. At minimum,
    the title and framing should acknowledge that assertion-point data is equally
    or more effective.


    **W3 (Major). Dataset too narrow to support broad claims.** The evaluation uses
    only HumanEval (164 problems) + MBPP (427 problems) — small, synthetic, algorithmic
    benchmarks in Python. In real-world testing: (a) many failures are logical errors
    producing wrong output without exceptions; (b) exception formats vary across languages;
    (c) test complexity far exceeds these benchmarks. The paper''s prescriptive conclusion
    ("extract highest-specificity diagnostic signals and discard everything else")
    is not warranted by evidence from such a narrow domain. The two-tier hierarchy
    is almost certainly dataset-dependent — on benchmarks with more logic errors,
    ae_only would likely dominate, potentially inverting the hierarchy.


    **W4 (Major). Information density claim (Claim 2) is confounded by truncation.**
    The comparison between full_trace (81.76%) and VOTA (99.41%) cannot cleanly separate
    information density from token truncation at the 2048 limit. The paper acknowledges
    91.7% of DeepSeek VOTA samples are truncated, yet still claims "information density"
    as the primary factor. Without experiments at longer context lengths (4096, 8192)
    or with length-matched controls, Claim 2 is not adequately supported. The label-only
    masking experiment (86.22%) is interesting but only addresses gradient dilution,
    not truncation.


    **W5 (Moderate). Format-marker ablation proves less than claimed.** Removing "[No
    exception data in trace]" from pass samples and showing no degradation does not
    prove "fault semantics learning." After marker removal, pass samples become empty/minimal
    while fail samples contain rich exception text. The model can trivially distinguish
    these by input length or content density alone — no semantic understanding required.
    A stronger test would perturb exception *content* (e.g., shuffle error type/message,
    replace with random text of equal length) to test whether the model actually understands
    fault semantics vs. merely detecting "non-empty exception field."


    **W6 (Moderate). Missing simple baselines.** The paper lacks comparison to trivial
    non-ML baselines beyond one regex. What about: (a) `len(trace) > threshold`; (b)
    `"Error" in trace or "Exception" in trace`; (c) exit code checking; (d) any exception
    presence (binary feature) + logistic regression? If these achieve similar accuracy,
    the SFT contribution is negligible. The regex at 99.33% already suggests this.


    **W7 (Minor). DeepSeek seed instability undermines universality.** Seed 123 drops
    to 91.09% on DeepSeek exception_only (8.24pp below seeds 42/456). Reporting the
    median (99.33%) rather than the mean (96.58%) in Table 6 is a favorable choice.
    The paper discusses this as a LoRA initialization issue, but it weakens the "universally
    dominant" narrative. Three seeds is the minimum for detecting such issues; more
    seeds would better characterize the actual distribution.


    **W8 (Minor). Incomplete references.** Only 4 references are cited. The related
    work section is thin and misses relevant work on: test outcome prediction, defect
    prediction, mutation testing, and the broader fault localization literature. The
    claim "no prior work has systematically evaluated which trace components drive
    verdict prediction" should be situated more carefully against the defect prediction
    and test oracle literatures.


    ---


    ## Questions for Authors


    1. What is the pass/fail ratio in the test set? If ~71.5%/28.5% as implied by
    confusion matrix numbers (851/337), what is the majority-class baseline accuracy?

    2. Have you tested on any benchmark where failures are predominantly logical errors
    (wrong output, no exception)? How does exception_only perform there?

    3. Why frame exception_only as superior when ae_only achieves higher accuracy
    (99.92% vs 99.83%)?

    4. Would increasing max sequence length to 4096 or 8192 close the full_trace vs
    VOTA gap, thereby refuting Claim 2?



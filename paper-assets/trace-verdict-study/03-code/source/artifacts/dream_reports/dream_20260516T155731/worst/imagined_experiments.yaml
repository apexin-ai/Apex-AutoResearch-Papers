  result_rationale: '移除 [No exception data in trace] 后，pass 样本失去唯一的 explicit classification
    signal。 模型必须从 ''content 为空/极短 → pass'' 学习，但这是一个 weaker, indirect cue： (1) 空文本不是
    informative feature，而是 absence of feature——学习 absence 比学习 presence 更难； (2) 部分
    pass 样本可能仍有少量非异常文本（如 GeneratorExit），制造 noise； (3) fail 样本仍有异常内容（类型 + 消息），但失去 [ERROR]
    前缀后， 模型需要从原始异常文本的语义特征（如 ''AssertionError'', ''TypeError''）学习 fail 映射。

    seed variance 显著上升（std ~2.5pp vs 0.0pp）因为 content-level learning 对 LoRA 初始化更敏感——没有了
    deterministic shortcut，模型需要学习更 nuanced 的 pattern， 不同初始化可能学到不同 decision boundaries。

    worst seed (86.8%) 接近 loop_only (85.6%)，说明无 format marker 的 exception content
    提供的 signal 与 loop compression 相当——两者都是 content-level 学习，accuracy 相似。

    fail_recall 保持高位 (0.985-0.993) 因为 fail 样本仍有异常文本内容（只是没有 [ERROR] 前缀）， 模型可以从 ''AssertionError:
    expected X got Y'' 等文本学习 fail。 pass_recall 大幅下降 (0.82-0.89) 因为 pass 样本的分类依据从 explicit
    marker 退化为 ''content 很短或为空''——这是一个 noisy, indirect signal。

    '

  analysis: 'nomarker 是 worst tier 的 defining result。10.2pp drop 意味着：

    (1) FORMAT MARKER AS CLASSIFICATION SHORTCUT：SFT exception_only 学到的主要不是 ''exception
    content → fault detection'' 而是 ''[No exception data in trace] 有无 → pass/fail''。
    移除标记后 accuracy 从 99.83% 降至 89.63%，而 regex B5（纯 marker check）= 99.33%。 SFT with
    markers (99.83%) ≈ regex (99.33%)，Δ 仅 0.50pp。 SFT without markers (89.63%) < regex
    (99.33%)，Δ = -9.70pp。 结论：SFT 的 value-add over regex 仅 0.50pp，主要靠 format shortcut。

    (2) CONTENT CONTRIBUTION IS REAL BUT SECONDARY：nomarker 89.63% > no_trace 75.13%，
    content signal 贡献 14.5pp（占总 lift 的 59%）。exception content 确实有用—— 异常类型和消息文本帮助 fail
    detection（fail_recall 仍 >98%）。 但 pass detection 严重依赖 format marker（pass_recall
    从 0.998 降至 0.86）。

    (3) SEED VARIANCE AS SHORTCUT DEPENDENCY INDICATOR：with markers std=0.0pp →  trivial
    pattern, perfectly reproducible；without markers std=2.5pp →  content learning
    is harder, init-sensitive。variance shift 是 shortcut dependency 的 causal evidence。

    (4) NARRATIVE REFRAME：论文从 ''exception events as fault detection signal'' 变为 ''format
    markers as implicit task specification in SFT''。 贡献 = 揭示 SFT 中 trace format design
    choices 的 outsized, hidden impact， 与 shortcut learning 文献（Gururangan 2018, McCoy
    2019, annotation artifacts）对话。 实践建议：trace format 设计应 explicitly 考虑 downstream
    task 的 shortcut affordance， 评估 SFT verdict models 时必须包含 format ablation control。

    '

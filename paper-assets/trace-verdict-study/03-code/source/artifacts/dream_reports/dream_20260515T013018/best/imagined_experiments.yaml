    all_below_notrace: true
  result_rationale: "Accuracy 随 trace length 单调下降，且所有截断长度都低于 no_trace baseline。 机制解释：标准\
    \ SFT loss 下，trace tokens 数量 N_trace 与 classification token 数量 (1) 的比例决定了 gradient\
    \ 中 classification signal 的占比 ≈ 1/(N_trace+1)。 - 256 tokens: classification gradient\
    \ 占比 ~0.4% → 仍有少量 classification learning，\n  accuracy 68.3%，但已低于 no_trace (75.13%)，因为即使微弱的\
    \ trace loss 也 distort\n  了模型的 representation space。\n- 512 tokens: gradient 占比\

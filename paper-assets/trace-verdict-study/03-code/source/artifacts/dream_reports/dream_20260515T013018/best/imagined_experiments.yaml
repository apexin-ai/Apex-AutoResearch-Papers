tier: best
narrative_guidance: '原始 framing 完全成立。plan_001 ablation 直接证明 VOTA 效果源于 execution state
  reasoning 而非 actual==expected 字符串比对——去除 actual/expected 后模型仍保持 89% accuracy（+14pp
  over no_trace）， 说明 assertion structure、exception pattern、loop behavior 本身携带充足的 verdict-relevant
  signal。 plan_002 label-only loss 将 full_trace 从 28.49% 修复至 76%，gradient dilution
  假说闭环确认。 plan_003 组件 ablation 证明三类信号各有独立贡献（最弱组件仍 +4pp），且组合呈超加性——模型在 jointly reasoning
  over multiple execution dimensions, not relying on a single cue。DeepSeek-Coder 复现
  +20pp lift， DebugBench 复现 +17pp lift，排除模型特异性和任务特异性。Seed variance <0.2pp，结果高度稳定。
  论文 Claim 1 升级为 "VOTA teaches execution-grounded verdict reasoning, not mere string
  comparison"， Claim 2 机制解释闭环（gradient dilution confirmed + trace length monotonic
  decline）， Claim 3 提供完整 trace design principle taxonomy（每个组件贡献量化 + 交互效应分析）。 直接冲 EMNLP
  Main，所有 anticipated reviewer concerns 均有数据回应。

  '
imagined_experiments:
- name: VOTA without actual/expected ablation
  plan_id: plan_001
  description: '从 VOTA trace 中移除所有 actual value 和 expected value 字段，只保留 assertion
    structure (assertion name, line number, assertion type)、exception summary、loop
    compression info。 使用与 vota_seed42_v4 相同的训练配置（CodeLlama-7B, 3 epochs, lr=2e-5）。

    '
  expected_results:
    accuracy: 0.891
    majority_baseline: 0.7151
    lift_over_notrace: 0.1397
    lift_over_notrace_pp: 13.97
    drop_from_full_vota_pp: 10.06
    pass_precision: 0.932
    pass_recall: 0.879
    pass_f1: 0.905
    fail_precision: 0.821
    fail_recall: 0.919
    fail_f1: 0.867
    accuracy_ci_lower: 0.871
    accuracy_ci_upper: 0.909
    train_loss: 0.072
    eval_loss: 0.298
    mcnemar_vs_notrace_p: 1.0e-05
  result_rationale: '去除 actual/expected 后 accuracy 从 99.16% 降至 ~89%，说明 actual/expected
    值确实提供了 直接的 verdict signal（约贡献 10pp）。但关键发现是：剩余 89% accuracy 仍大幅超越 no_trace 的 75.13%
    （+14pp, p<0.001），证明模型从 assertion structure + exception info + loop patterns 中
    学到了 genuine execution state reasoning。具体机制：(1) exception summary 提供了 "哪个 assertion
    点抛出了什么类型的异常" 的信息，这本身就是强 verdict signal——在测试中， exception 几乎必然意味着 fail，且 exception
    type/message 携带 root cause 信息； (2) loop compression 中的迭代次数异常（early termination,
    infinite loop detection） 是 behavioral anomaly 的直接证据；(3) assertion structure 本身（哪些
    assertion 被执行、 执行顺序）编码了 control flow path 信息。模型 jointly reason over 这些 signals，
    而非简单的 string matching。train_loss 从 0.046 升至 0.072 反映了 task 难度增加 （没有 actual/expected
    的 "shortcut"），eval_loss 从 0.084 升至 0.298 说明 uncertainty 增大但仍在 reasonable range。


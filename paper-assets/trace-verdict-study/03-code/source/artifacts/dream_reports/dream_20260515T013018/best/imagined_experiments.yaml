- name: Full trace with label-only loss
  plan_id: plan_002
  description: '使用完整 execution trace 但修改 loss computation：只对最终 verdict token（pass/fail）计算
    cross-entropy loss，mask 掉所有 trace token 的 loss。验证 collapse 根因是 gradient dilution
    （trace tokens 占 >95% loss weight 导致 classification gradient 被淹没）而非 trace content
    本身有害。

    '
  expected_results:
    accuracy: 0.762
    majority_baseline: 0.7151
    lift_over_notrace: 0.0107
    lift_over_standard_fulltrace: 0.478
    pass_precision: 0.847
    pass_recall: 0.738
    pass_f1: 0.789
    fail_precision: 0.621
    fail_recall: 0.823
    fail_f1: 0.708
    train_loss: 0.34
    eval_loss: 0.52
    collapse_fixed: true
    predict_fail_ratio: 0.437
  result_rationale: 'label-only loss 将 accuracy 从 28.49%（全 collapse）修复至 76.2%，接近 no_trace
    baseline（75.13%）。 这直接确认了 gradient dilution 假说：在标准 SFT loss 下，full trace 的 ~2000+
    trace tokens 贡献了 >97% 的 total loss，classification token（1 token）的 gradient 被 overwhelm。
    模型被迫优化 "next token prediction on trace text" 而非 "verdict classification"， 最终 collapse
    到 majority class prediction。label-only loss 消除了 trace token 的 gradient 干扰后，模型至少能正常分类。但
    76.2% 仅略高于 no_trace，说明 full execution trace 即使作为 pure context（不参与 loss）也几乎没有帮助——trace
    太长太密，模型的 attention 无法从中提取 decision-relevant signal。这解释了为什么 VOTA（compact, decision-relevant
    abstraction） 远优于 full_trace + label-only（verbose, attention-diluting context）。predict_fail_ratio
    从 100%（collapse）恢复到 43.7%（接近真实 28.49% fail rate），说明 class balance 恢复正常。

    '
  tables:

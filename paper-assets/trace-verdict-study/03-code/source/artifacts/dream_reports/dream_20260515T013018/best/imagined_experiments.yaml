  - '2x2 schematic: (x-axis: trace granularity [none, VOTA, full], y-axis: accuracy).
    Two lines — standard loss vs label-only loss. Standard loss shows collapse at
    full trace; label-only loss rescues it to baseline level but doesn''t reach VOTA.
    Annotated with ''gradient dilution zone'' shading.'
  analysis: '76.2% 完美支撑 gradient dilution 叙事：(1) label-only 修复 collapse → 确认 collapse
    原因是 loss distribution mismatch 而非 trace data corruption；(2) 修复后仅达 no_trace 水平
    → full trace 作为 context 无信息增益，因为 attention 在 2000+ tokens 中无法聚焦 verdict-relevant
    states；(3) VOTA 在标准 loss 下就达 99.16% → 紧凑的 trace abstraction 同时解决了 gradient dilution
    和 attention dilution。这为 Claim 2 提供了完整的机制解释闭环。

    '
- name: VOTA component ablation
  plan_id: plan_003
  description: '4 个训练条件：(a) 只有 actual/expected 值对（无 assertion structure/exception/loop
    info）， (b) 只有 exception summary，(c) 只有 loop compression info，(d) 全量 VOTA（已有结果）。
    量化每个 VOTA 组件的独立贡献和交互效应。

    '
  expected_results:
    actexp_only_accuracy: 0.912
    actexp_only_lift: 0.1607
    exception_only_accuracy: 0.827
    exception_only_lift: 0.0757
    loop_only_accuracy: 0.791
    loop_only_lift: 0.0397
    full_vota_accuracy: 0.9916
    full_vota_lift: 0.2403
    sum_individual_lifts: 0.2761
    superadditivity_ratio: 1.15
    min_individual_lift: 0.0397
    max_individual_lift: 0.1607
  result_rationale: '三个组件均有显著独立贡献： (a) actual/expected only (91.2%): 最强单组件。actual/expected
    值直接编码了 "程序实际输出 vs 预期输出" 的比较信息，对 verdict prediction 最直接相关。但缺少 exception 和 loop
    信息时， 模型无法处理 exception-driven failures（exception 时 actual 可能为空）和 loop-related bugs
    （如 infinite loop timeout），导致部分样本错误。 (b) exception summary only (82.7%): exception
    type + message + stack trace summary 是 fail 的强信号（几乎所有 exception 都对应 fail），但 exception
    只覆盖 ~40% 的 fail cases （其他是 assertion failure without exception），对 pass cases 几乎无信号，导致
    precision/recall 不对称。 (c) loop compression only (79.1%): 最弱但仍显著（+4pp over no_trace,
    p<0.01）。 loop iteration counts 和 early termination patterns 编码了 behavioral anomaly
    信号， 但信号较弱且只与 loop-related bugs 相关。 三组件组合的 VOTA (99.16%) 显著超过个体之和（superadditivity
    ratio 1.15），说明组件间 存在 complementary reasoning：exception summary 覆盖 actual/expected
    缺失的 crash cases， loop info 捕捉 actual/expected 和 exception 都无法检测的 behavioral anomalies。
    模型在联合训练时学到了 cross-component reasoning patterns。


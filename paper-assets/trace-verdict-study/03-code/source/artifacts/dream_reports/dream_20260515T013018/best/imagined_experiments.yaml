    \ ALL truncated conditions 都 worse than no_trace——即使 256 tokens 的 short trace\
    \ 在标准 loss 下也有害。这 eliminates \"trace content is harmful\" 假说（如果 trace content\
    \ 本身有害，label-only loss 也不应该 fix it），definitively 指向 gradient dilution。 Pearson\

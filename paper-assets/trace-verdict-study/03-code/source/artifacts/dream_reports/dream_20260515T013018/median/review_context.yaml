    小比例的 borderline cases（模型在不同 seed 下对这些 case 的预测不一致）。 所有 seeds 均显著高于 no_trace（McNemar
    p < 0.001），说明 VOTA 的效果是 robust 的而非 lucky seed。 1.26pp 的 range 在 n=1190 的评估集上是合理的——对应约

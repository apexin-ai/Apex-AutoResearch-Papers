narrative_guidance: '调整 Claim 1 强度：VOTA 的核心价值不是 "教模型推理"，而是 "将 decision-relevant state（尤其是
  assertion-point 的 actual/expected 比较）精准呈现给模型"。 这是一种 task-aware feature engineering，actual/expected
  是主要但非唯一贡献者。 Claim 2 改为 "gradient dilution is a contributing factor but not the sole
  cause"——label-only loss 部分修复说明 trace token 的 loss 确实稀释了分类梯度，但未完全修复说明 trace content
  noise 本身也有害。 Claim 3 的 design principle 从 "teach reasoning" 调整为 "minimize irrelevant
  state, maximize decision-relevant signal density"。 泛化性有限（DeepSeek lift 较小，第二任务 pattern
  不完全一致），论文定位从 method contribution 转向 empirical analysis + design guidelines，Findings
  是更安全的投稿目标。

  '
imagined_experiments:
- name: VOTA sans actual/expected ablation
  plan_id: plan_001
  description: '去除 VOTA 中 actual value 和 expected value 字段，只保留 assertion structure（哪个
    assertion 触发）、 exception summary、loop compression。用相同训练流程 SFT CodeLlama-7B。

    '
  expected_results:
    accuracy: 0.82
    majority_baseline: 0.7151
    lift_over_notrace: 0.069
    lift_over_notrace_pp: 6.9
    pass_precision: 0.88
    pass_recall: 0.79
    pass_f1: 0.83
    fail_precision: 0.7
    fail_recall: 0.82
    fail_f1: 0.76
    pct_vota_lift_from_actexp: 71.3
    train_loss: 0.11
    eval_loss: 0.42

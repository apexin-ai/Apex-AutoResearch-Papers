    structure （哪个 test case 的哪个 assertion 触发）和 exception summary 中获取部分 verdict-relevant
    signal， 因此 acc 不会退回 no_trace 的 75.13%。但模型失去了直接比较 actual vs expected 值的能力——这对 pass/fail
    判定是最直接的信号——所以 lift 从 24pp 缩减到约 7pp（缩小 >50%）。残余 lift 来源：exception type/message
    提供 fail 的强信号（出现 exception → almost certainly fail），assertion 的 structural position  提供弱信号。82%
    的 accuracy 意味着模型能处理"明确有 exception"和"明确无 exception"的 easy cases， 但对需要数值比较才能判定的
    borderline cases 失去区分能力。

    '

    不是 "模型谦虚地 uncertain" 而是 "模型自信地错误"——这对任何 downstream 使用都有害。 no_trace 的 moderate
    overconfidence（ECE=0.18）是 SFT 模型的典型行为。 建议将此作为 supplementary analysis 而非主 claim，因为

  - 'Secondary y-axis or inset: verdict token 的 loss contribution ratio vs trace length，展示
    gradient dilution 机制'
  analysis: 'Accuracy 随 trace length 单调递减（58% → 48% → 38% → 30% → 28.4%），且所有 full
    trace truncation  均低于 no_trace。这排除了 "full trace collapse 只是因为太长" 的简单解释——即使 256
    tokens 的短 trace  也表现不如完全不给 trace。关键 insight：VOTA（平均约 80 tokens）远好于 256-token full
    trace（99.16% vs 58%）， 说明 trace 的质量（verdict-relevant information density）比长度更重要。这是
    Claim 3 的核心实证支撑： design principle 是 "select verdict-critical state" 而非 "truncate
    execution trace"。 曲线在 1024+ tokens 后趋于平坦，说明 collapse 在较长 trace 处已饱和。

    '
- name: Calibration analysis (ECE + reliability diagrams)
  plan_id: plan_007
  description: '基于已有 checkpoint 的 logits，计算 Expected Calibration Error (ECE, 10 bins)
    和 reliability diagram， 对比 VOTA / no_trace / full_trace 三个条件的 calibration 质量。

    '
  expected_results:
    vota_ece: 0.035
    notrace_ece: 0.18
    fulltrace_ece: 0.48
    vota_brier_score: 0.015
    notrace_brier_score: 0.22
    fulltrace_brier_score: 0.58
    vota_overconfident: false
    notrace_underconfident: true
    fulltrace_pathological: true
  result_rationale: 'VOTA 的 ECE 低（0.035）因为模型在 99.16% accuracy 下大部分预测是高 confidence
    且正确的—— 当模型几乎总是对的时候，高 confidence 是 well-calibrated 的。no_trace 的 ECE 中等（0.18）， 模型倾向于对
    pass 预测过于 confident（因为 pass 是 majority class），导致 reliability diagram  在高 confidence
    bin 中显示 under-confidence for fail class。full_trace 的 ECE 极高（0.48）， 因为模型 collapsed
    到几乎只预测 fail，但 fail 的 actual rate 只有约 28%——模型对 fail 预测  高度 confident 但大量出错。这种 pathological
    calibration 是 model collapse 的直接后果。 Calibration 结果不是独立的 contribution，但能 strengthen
    Claim 2：full_trace 不仅降低了 accuracy， 还产生了 pathologically miscalibrated 的预测，在实际部署中可能比
    random 更有害。


    残余 6.9pp 的 lift 说明 assertion structure 和 exception summary 有独立贡献——模型确实从 trace
    的 结构性信息中学到了一些东西，但不足以称之为 "behavioral reasoning"。论文 Claim 1 应调整为： "VOTA 的核心价值是 information
    selection——将 verdict-critical state elements 精准呈现给模型， 其中 assertion-point state
    comparison (actual vs expected) 是最关键的组件。"


- name: Full trace + label-only loss
  plan_id: plan_002
  description: '在 full execution trace 条件下，修改 loss 计算：只对最终 verdict token（pass/fail）计算
    cross-entropy loss， mask 掉所有 trace tokens 的 loss。验证 gradient dilution 假说。

    '
  expected_results:
    accuracy: 0.62
    majority_baseline: 0.7151
    lift_over_fulltrace: 33.6
    lift_over_fulltrace_pp: 33.6
    pass_precision: 0.68
    pass_recall: 0.55
    pass_f1: 0.61
    fail_precision: 0.58
    fail_recall: 0.7
    fail_f1: 0.63
    collapse_fixed: false
    partial_recovery: true
    train_loss: 0.52
    eval_loss: 0.61
  result_rationale: 'Median 档下 gradient dilution 是 collapse 的因素之一但非唯一原因。Label-only
    loss 消除了 trace token  对分类梯度的稀释——原始 full_trace 中 verdict token 的 loss 只占总 loss
    的 <0.1%（因为 trace 有数千 token）， 导致模型几乎不学分类。去掉 trace loss 后模型确实能开始学习 verdict prediction（从
    28.4% → 62%）， 说明 gradient dilution 确实是 collapse 的主要贡献因子。但 62% 仍然低于 no_trace 的
    75.13%， 说明 full trace 本身引入了 noise——大量无关执行细节（变量赋值、循环迭代、中间状态）作为 context  混淆了模型对
    verdict-relevant signal 的定位。模型在 attention 层面难以从上千 token 的 trace 中  识别出哪些信息与 verdict
    相关。这支持 "trace content noise 也有害" 的解释，而非 gradient dilution  是唯一原因。未达到 no_trace
    水平说明 irrelevant context 本身有 negative transfer 效应。

    '

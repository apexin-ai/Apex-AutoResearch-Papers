    dilution 贡献约 60% of collapse，trace noise 贡献约 40%'''
  - 'Confusion matrices (2×2) side by side: full_trace standard vs full_trace label-only，展示
    collapse 的部分修复'
  analysis: 'Label-only loss 将 full_trace accuracy 从 28.4% 提升到 62%（+33.6pp），证实 gradient
    dilution  是 collapse 的主要贡献因子。但 62% < 75.13% (no_trace) 说明还有第二层问题：trace content
    noise。 即使模型不需要预测 trace tokens，大量无关执行细节作为 input context 仍然干扰模型的 verdict 判断能力。 Claim
    2 应改为："Full trace collapse 由两因素共同导致：(1) gradient dilution（classification loss  被
    trace token prediction loss 淹没），贡献约 60%；(2) trace content noise（无关执行细节干扰  verdict-relevant
    signal 的定位），贡献约 40%。"

    '

  analysis: 'OOD 实验在 median 档下是最大 risk/reward 投资。如果完成，可 claim  "exception signal advantage
    transfers across languages with preserved  lift (~24pp) despite moderate absolute
    degradation (7pp mean)"—— 部分回应 single-task scope criticism。但 risk factors：(1)
    需要  构建 3 个语言的 OOD 数据集（trace 生成 + 人工验证），timeline  紧张；(2) tracer 对 Java/JS 的 implementation
    可能有 quality  issues，影响实验可控性；(3) 如果某语言降到 <85%，审稿人可能  反向 argue "not robust enough"。在
    ARR May 25 deadline (7天后)  前几乎不可能完成——建议 deprioritize，标注为 camera-ready  supplement
    或 future work。如果有余力，优先做 Python OOD  （无需新 tracer，仅需新测试集），~4 GPU-hours 即可。

    '

    的  影响。所有数值表示为 training fraction（0=start, 1.0=end of 3 epochs）， 因 absolute step
    count 取决于 batch size 等 hyperparameters。

    exception_only 收敛最快（~5% training 达 90%, ~8% 达 95%）：input 极短  （mean <100 tokens），gradient
    完全集中在 verdict signal 上；effective  unique 样本仅 2858，但 binary structure（有 exception→fail,
    无→pass） 极其 learnable。已有 epoch-level 数据佐证：Qwen-7B exception_only 3  seeds 均在 epoch1
    结束时已达 99.83%（之后 epochs 无提升）——暗示  实际在 epoch1 早期就已收敛。

    full_trace 收敛最慢且 non-monotonic：已有 epoch-level 数据  （epoch1=83.03%, epoch2=76.30%,
    epoch3=81.76%）展示 epoch2 坍塌。 中间 eval 应能捕获更 fine-grained 的 oscillation pattern。峰值在  ~30%
    training（epoch1 中后段），之后 overfitting 到 trace patterns  而非 verdict signal 导致 epoch2
    下降。epoch3 partial recovery 可能  是 random fluctuation。

    VOTA 介于两者之间：含 Tier 1 (fast learning) + Tier 2 (slow learning)  信号，combined curve
    的前段被 Tier 1 驱动（快速上升到 >95%），后段  Tier 2 贡献边际提升。已有 epoch-level (epoch1=99.33%, epoch2-3=99.41%)  确认
    epoch1 几乎完成所有学习。

    no_trace 快速 plateau：无 trace signal 可学习，模型在 ~15% training  后耗尽 code→verdict 的弱
    statistical correlation，之后 flat。

    Learning efficiency ratio: exception_only 每 pp 需 ~9.2 个 effective  training samples（2858
    unique / (99.83-75.13) pp），full_trace 需 ~68.5  （~5800 / (81.76-75.13) pp），7.4×
    差距直接 quantify information  density 的 learning advantage。


  result_rationale: 'Error analysis 在 median 档下揭示条件间 qualitatively different failure
    modes， 为现有 claims 提供 supporting evidence 但不产生新发现。推理链：

    (1) exception_only 的 2 个 error (id=901, 905) 已被完全解释——GeneratorExit 是  Python all()
    短路的 BaseException，tracer 统一标 [ERROR]。模型看到 7 行  [ERROR] GeneratorExit 合理预测 fail。这是
    representation-inherent error， 非模型不足。跨 Qwen 3 seeds 完全重合确认是 data property。

    (2) VOTA 额外 5 个 error 源自 Tier 2 noise：3 例中 loop compression 产生  正常行为摘要但同时存在 exception（矛盾信号让模型犹豫，confidence
    下降）； 2 例中 Tier 2 tokens 稀释了对 exception 的 attention（输入更长，exception  信号占比更低）。这直接
    quantify "combining tiers introduces noise" (Claim 3)。

    (3) full_trace 的 217 个 error 中 ~63% 也是 no_trace 的错误——这些是  intrinsically hard cases，trace
    未提供 accessible 的额外信号（signal  buried in thousands of tokens）。剩余 37% 是 full_trace
    unique errors—— trace 信息 actively misleading（长 trace 中的 intermediate exception  被
    caught 但 trace 仍包含 [ERROR]，模型误判）或 attention 被长 context  分散。error rate 与 trace
    length 正相关 (r≈0.41)：>1500 tokens 的 trace  error rate ~33% vs <500 tokens ~9%，information
    overload 的 dose-response。

    (4) Tier 1 和 Tier 2 的 error sets 几乎不重叠 (Jaccard=0.01)：Tier 1  fails 在 representation

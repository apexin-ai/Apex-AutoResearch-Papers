tier: median
narrative_guidance: 'Claim 2 从 ''phase transition in trace informativeness'' 改为 ''diagnostic
  signal concentrates in trace tail with diminishing returns; information density
  — not gradient dilution — is the primary bottleneck''。tail-384 在四模型上均落在 256→512
  的 43-53% 位置（83-88%）， 确认 smooth gradient 而非 sharp boundary。Budget curve 四模型趋势一致（log-shaped  diminishing
  returns），但无共同拐点——每个模型的 steepest gain 区间长度和位置略有不同。 Budget curve 从 standalone finding
  降为 supporting figure，label_only 26/74 分解升为  Claim 2 sole quantitative evidence。补偿措施:
  (a) tail-512≫head-2048（~94% vs ~79%,  Δ≈15pp）作为 information locality 的 strong evidence；(b)
  exception_only scale invariance （1.5B=7B=13B=99.83%）提升至更高叙事位置；(c) cross-model calibration
  (plan_019, 1h) +  error analysis (plan_018, 0h) 增加独立 evidence 维度。cross-seed σ~1-3pp
  不否定趋势但 削弱 point estimate 精度，所有 budget curve 数字需附 uncertainty band。仍冲 Main， Findings
  作 fallback。

  '

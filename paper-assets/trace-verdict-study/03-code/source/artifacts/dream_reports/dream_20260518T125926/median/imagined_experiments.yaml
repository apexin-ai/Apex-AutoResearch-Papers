- name: cross_model_calibration_exception_only
  plan_id: plan_019
  description: 4 models × exception_only ECE/Brier 对比
  expected_results:
    qwen7b:
      accuracy: 0.9983
      ece: 0.0027
      brier: 0.0013
      mce: 0.835
    deepseek_seed42:
      accuracy: 0.9933
      ece: 0.012
      brier: 0.006
      mce: 0.45
    qwen15b:
      accuracy: 0.9983
      ece: 0.005
      brier: 0.003
      mce: 0.62
    codellama13b:
      accuracy: 0.9983
      ece: 0.003
      brier: 0.002
      mce: 0.75
    all_nonoutlier_ece_below: 0.015
    ece_range:
    - 0.0027
    - 0.012
    ece_ratio_vs_notrace_range:
    - 14
    - 63
  result_rationale: 'Calibration 直接跟随 accuracy 和 error 数量。三个 99.83% 模型（Qwen-7B,  Qwen-1.5B,
    CodeLlama-13B）仅有 2 个相同 error（GeneratorExit），calibration  差异仅来自 confidence distribution
    的模型间差异：

    Qwen-7B (ECE=0.0027, 已有数据): 基准。2 个 misclassified samples 的  confidence 贡献几乎全部
    ECE。

    CodeLlama-13B (ECE≈0.003): 13B 参数量产生更 peaked softmax distribution， correct predictions
    的 confidence 更接近 1.0。2 个 error 的 confidence  也偏高（模型更 "确定"），但 overall 因 correct
    predictions 的 near-perfect  calibration 而 ECE 极低。略高于 Qwen-7B 因为 CodeLlama 的 chat
    template  与训练数据的 alignment 略有差异。

    Qwen-1.5B (ECE≈0.005): 同 Qwen tokenizer，same 2 errors。但 1.5B 模型的  softmax entropy
    更高（small model less confident），correct predictions  的 mean confidence 可能在 ~0.95
    而非 ~0.99，造成 systematic slight  under-confidence → ECE 略高。

    DeepSeek seed42 (ECE≈0.012): 8 个 errors（vs others 的 2 个），4× 更多  misclassified
    bins 贡献 ECE。其中部分 fail samples 被高 confidence 预测为  pass（LoRA 训练不完全映射 exception→fail），这些
    high-confidence wrong  predictions 是 ECE 的主要 contributor。但 0.012 仍远低于 no_trace
    的 0.171  （14× improvement）。

    总体：所有模型 ECE < 0.015，exception signal 的 calibration 优势跨模型  robust。magnitude 差异主要由
    error count 驱动，非 signal quality 差异。

    '

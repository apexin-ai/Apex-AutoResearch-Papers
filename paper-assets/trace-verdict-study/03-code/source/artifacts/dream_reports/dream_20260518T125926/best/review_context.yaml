    单一颜色), VOTA bar 短 (7 errors, 2-3 类别), full_trace bar 高 (217 errors, 5+ 类别均匀分布),
    no_trace bar 最高 (296 errors)。 视觉上直观展示 Tier 1 信号的 failure mode 简单性。

    '
  - 'Figure: Confusion matrix heatmap (2×2) for each condition, 4-panel 排列, 颜色深度反映错误集中度。

    '
  analysis: 'Error analysis 提供 two-tier hierarchy 的定性支撑, 补充 accuracy/ECE 的定量证据。 关键
    insight: Tier 1 的 irreducible error 是 representation-inherent (可通过 tracer 改进消除),
    而非 model-inherent。这意味着 exception_only 99.83%  不是"模型学到了 shortcut"而是"模型学到了 representation
    能表达的一切"。 Full_trace 的错误分布广泛而均匀, 说明模型面对 full trace 时没有 dominant failure mode, 而是
    uniformly confused by information overload。 这直接支持 Claim 2 的 information density
    假说。 建议论文中以 Table + 1-2 段定性讨论呈现, 不需独立 section。

    '

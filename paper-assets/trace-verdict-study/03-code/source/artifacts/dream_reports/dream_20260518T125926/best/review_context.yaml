narrative_guidance: 'tail-384 × 4 模型均停留在 plateau 区间（≤82%），确认 phase transition 是 sharp
  而非 gradual， 集中在 384→512 的 128-token 窗口内。4 模型 budget curve 呈现高度一致的阶梯形态： plateau(≤384)
  → jump(384-512) → saturation(≥512)。3 个 Core Claims 全部以最高强度成立， phase transition 作为独立
  bonus finding 写入 Results 专节。 叙事框架无需调整——exception dominance (Claim 1) 因 scale invariance
  (1.5B=7B=13B=99.83%) 和 phase transition 双重支撑进入 abstract; information density (Claim
  2) 因 4-model 阶梯曲线从定性假说升格为定量规律; two-tier hierarchy (Claim 3) 因 multi-seed 全条件覆盖 获得完整
  robustness 保障。CodeLlama tail-2048 collapse（29.6%）与 tail-1024=98.2% 并列， 提供 full-sequence
  loss dilution 的自然实验证据。论文贡献数从 3 提升为 3+1 bonus。

  '
imagined_experiments:

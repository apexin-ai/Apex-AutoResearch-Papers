  - 'Figure: Grouped bar chart。 X 轴: method (0-shot base / 0-shot frontier / 3-shot
    frontier / SFT)。 Y 轴: accuracy (%)。 每组 bar 内颜色区分模型。 Frontier few-shot 明显高于 base
    zero-shot, 但 SFT bar 独占最高位。 虚线标注 99.83% SFT ceiling。

    '
  analysis: 'Few-shot baseline 证明 SFT 的价值不仅在于"用 trace"而在于"学会用 trace": 即使 GPT-4o 能看到完全相同的
    exception trace, 仍比 7B 参数的 SFT 模型 低 4+pp。这直接回应审稿人"为什么不直接用 LLM 判断"的问题。 成本对比更有力:
    SFT 推理成本极低 (7B 模型本地推理) vs API 调用 ~$15/次全量评估。 注意: 此实验仅展示 exception_only 输入, 不测试
    full_trace few-shot (因为 full trace 超出 context window 限制)——这本身也支持 Claim 2 (information
    density 瓶颈在 few-shot 中更加突出)。 建议论文中作为 1 个段落 + 1 个 table 呈现, 不需独立 section。

    '
- name: ood_generalization
  plan_id: plan_021
  description: 在不同编程语言/项目的 trace 上测试 exception_only 跨域泛化性
  expected_results:
    python_ood:
      description: 不同 Python 项目 (非 HumanEval/MBPP 题型)
      accuracy: 0.975
      accuracy_ci:
      - 0.96
      - 0.988
      degradation_vs_id_pp: 2.3
    java:
      description: Java 程序 (try/catch, Exception hierarchy)
      accuracy: 0.945
      accuracy_ci:
      - 0.922
      - 0.965
      degradation_vs_id_pp: 5.3
    javascript:
      description: JavaScript 程序 (Error objects, uncaught exceptions)
      accuracy: 0.93
      accuracy_ci:
      - 0.905
      - 0.953
      degradation_vs_id_pp: 6.8
    cross_language_mean: 0.95
    ood_dataset_size: 500
    estimated_construction_hours: 20
  result_rationale: 'Exception signal 的跨语言泛化性基于其结构通用性: 所有主流编程语言的 异常系统都包含 (1) error
    type/class, (2) error message, (3) 可选 stack trace。 SFT 模型学到的核心映射是"有 [ERROR] 标记
    → likely fail", 但同时也学到了 exception 内容的语义 (如 AssertionError 几乎必然 fail, ImportError
    需要上下文判断)。 Python OOD (97.5%): 同语言不同项目, exception format 完全相同, 仅题目类型/复杂度不同, 降幅最小
    (2.3pp)。已有 DebugBench 100% 证明 Python 域内泛化性极强, OOD 降幅主要来自新出现的 exception types (如
    FileNotFoundError, PermissionError 等训练集少见的类型)。 Java (94.5%): exception format
    类似 (class name + message + stack trace) 但具体类名不同 (NullPointerException, ArrayIndexOutOfBoundsException),
    tokenizer 对 Java 异常类名的分词可能不如 Python 高效, 导致额外降幅。 JavaScript (93.0%): Error 对象格式与
    Python/Java 差异更大 (e.g., TypeError: Cannot read properties of undefined), 且 JS
    的 uncaught exception 格式与 Python 的 traceback 结构不同, 模型需要更多跨格式适配。 整体 >93% 说明 exception
    信号的核心语义 (error presence → fault) 是 language-agnostic 的, 降幅主要来自格式差异而非语义差异。 但此实验需要构建多语言
    OOD 数据集 (~20 人工小时), 投入产出比需权衡。

    '
  tables:
  - name: Cross-Language OOD Generalization
    description: '行: Python-ID / Python-OOD / Java / JavaScript。 列: Accuracy / Δ vs
      ID / Fail Recall / Pass F1 / n_samples。

      '
  figures_description:
  - 'Figure: Bar chart with error bars。X 轴: language/domain。 Y 轴: accuracy。虚线标注 in-domain
    99.83%。 视觉展示 graceful degradation gradient。

    '
  analysis: 'OOD 结果如预期, 将大幅强化 Claim 1 的 generalization 论证。 但考虑到 (1) 数据集构建需 ~20 人工小时,
    (2) ARR deadline 5/25, (3) 3 Core Claims 在 best tier 下已全强度成立——此实验为 P2 优先级, 建议仅在
    deadline 前有余力时执行。如果不执行, DebugBench 100% 已提供 Python 域内泛化的 partial 证据, 可在 Limitation
    讨论 跨语言泛化作为 future work。 如果执行且结果如预期, 可在 Claim 1 的 Supporting Evidence 中新增 1 段 +
    1 table, 显著降低 "单数据集" venue fit risk。

    '
- name: training_dynamics
  plan_id: plan_022
  description: 记录 exception_only vs full_trace 的 learning curve (每 50 steps eval),
    分析收敛速度差异
  expected_results:
    exception_only:
      steps_to_90pct_accuracy: 30
      steps_to_95pct_accuracy: 50
      steps_to_99pct_accuracy: 100
      final_step: 450
      convergence_curve_shape: sharp rise → plateau by step 100
      train_loss_at_step50: 0.15
      train_loss_at_step100: 0.11
    full_trace:
      steps_to_80pct_accuracy: 200
      max_accuracy: 0.8176
      never_reaches_90pct: true
      final_step: 450
      convergence_curve_shape: gradual rise → noisy plateau around 80%
      train_loss_at_step50: 0.08
      train_loss_at_step100: 0.06
    vota:
      steps_to_90pct_accuracy: 60
      steps_to_95pct_accuracy: 100
      steps_to_99pct_accuracy: 250
      final_step: 450
      convergence_curve_shape: moderate rise → gradual approach to 99%
    no_trace:
      max_accuracy: 0.7513
      never_reaches_80pct: true
      convergence_curve_shape: slow rise → plateau around 75%
    convergence_speed_ratio_exception_vs_fulltrace: 6.7
    convergence_speed_ratio_exception_vs_vota: 2.5
    train_loss_accuracy_divergence:
      full_trace_loss_at_convergence: 0.05
      exception_only_loss_at_convergence: 0.11
      note: full_trace has LOWER loss but LOWER accuracy — extends D1 finding
  result_rationale: '收敛速度差异是 information density 假说的直接推论。 exception_only 快速收敛 (~30
    steps to 90%) 的原因: (1) 信号紧凑 (平均 ~100-200 tokens), 每个 training sample 的 informative
    token 比例极高——模型几乎每个 step 都接收到高密度梯度信号; (2) 信号结构简单 ([ERROR] type: ... message: ...),
    模型只需学习 一个简单的 pattern: 有 error → fail, 无 error → pass; (3) 有效训练样本虽因重复率降至 ~2858
    unique, 但每个 unique 样本 的 signal-to-noise ratio 极高, 模型几个 epoch 内即可覆盖所有 pattern。
    full_trace 慢收敛 (~200 steps to 80%) 的原因: (1) 信号稀释: >2000 tokens 中仅少量与 verdict 相关,
    模型需要大量 steps "学会忽略" noisy tokens; (2) gradient dilution: 标准 SFT loss 在所有 tokens
    上平均, verdict-relevant tokens 的梯度被 non-informative tokens 稀释; (3) 信号位置不确定: exception
    可能出现在 trace 的任何位置, 模型需要学习 attention pattern 来定位关键信息。 Train loss 与 accuracy 的反向关系
    (full_trace loss=0.05 < exception_only loss=0.11, 但 full_trace accuracy=81.76%
    < exception_only accuracy=99.83%)  扩展了 D1 (eval_loss vs accuracy 解耦) 的发现到 training
    dynamics 维度: token-level loss 不仅在评估时、也在训练过程中与 verdict accuracy 解耦。 这为"verdict
    task 应使用 task-specific metric"的 methodological recommendation 提供了 training-time
    的额外证据。

    '
  tables:
  - name: Convergence Speed Comparison
    description: '行: exception_only / VOTA / full_trace / no_trace。 列: Steps to 80%
      / Steps to 90% / Steps to 95% / Steps to 99% / Final Accuracy。 使用 "—" 标注永远无法到达的阈值。

      '
  - name: Train Loss vs Accuracy at Key Checkpoints
    description: '每 50 steps 的 train_loss 和 eval_accuracy 对照, 展示 two metrics 的 divergence
      随训练进行加剧。

      '
  figures_description:
  - 'Figure: 2-panel learning curve。 Panel A: X 轴 = training steps, Y 轴 = accuracy
    (%)。 4 条曲线 (exception_only, VOTA, full_trace, no_trace)。 exception_only 陡升后立即
    plateau, full_trace 缓升后低位 plateau。 垂直虚线标注"exception_only 达到 99%"的 step (~100)。
    Panel B: X 轴 = training steps, Y 轴 = train loss。 相同 4 条曲线。展示 full_trace loss 持续下降但
    accuracy 不再提升 (D1 finding 的动态版本)。

    '
  analysis: 'Training dynamics 数据为 information density 假说提供过程维度的证据, 补充 final accuracy
    的静态对比。关键论点: (1) exception_only 收敛速度 ~7x full_trace → 信号密度直接映射为 学习效率, 不仅影响最终性能也影响
    sample efficiency; (2) full_trace 的"loss 下降但 accuracy 不升"pattern 可视化后 极具说服力, 比在
    Discussion 中用文字描述 D1 更直观; (3) 实用价值: 对部署场景而言, exception_only 仅需 1/3 epoch (~150
    steps) 即可达到 99%+, 训练成本极低——这可进入 abstract 的 practical contribution。 但此实验需要修改 train_sft.py
    加入 intermediate eval callback (每 50 steps 跑一次 full evaluation), 技术实现约 2-4 小时,
    训练时间翻倍 (~8 GPU-hours, 因为频繁 eval interrupt 训练)。 如时间充裕, 建议执行——learning curve figure
    是高影响力视觉元素。'

    no_trace_errors:
      total: 296
      error_categories:
        false_positive_pass: 175
        false_negative_fail: 121
      fail_recall: 0.735
      note: without trace, model over-predicts pass (majority class bias)
    tier1_vs_tier2_failure_mode_difference:
      tier1_failures: representation ambiguity (GeneratorExit) — fixable by tracer
        improvement
      tier2_failures: reasoning complexity (loop patterns, indirect assertions) —
        requires model capability
      qualitative_gap: 'fundamental difference in failure source: data vs model'
  result_rationale: 'Tier 1 (exception_only) 的 2 个错误已被完全分析: 均为 Python all() 短路触发 GeneratorExit,
    tracer 标记为 [ERROR] 但代码实际正确。这是 representation-level ambiguity, 与模型能力无关——改进 tracer
    区分 BaseException 和 Exception 即可消除。 VOTA 的 7 个错误预期集中在 Tier 2 组件引入的 noise: loop
    compression 可能将 正常循环模式压缩为看似异常的摘要, 或部分 exception 上下文被 loop tokens 稀释。 full_trace
    的 ~217 个错误分布广泛, 因为模型需要从 >2000 tokens 的 noisy trace 中提取判断信号, 对复杂控制流 (递归、多层嵌套) 和
    exception-free 的语义 bug (逻辑错误、边界条件) 尤其困难。fail_recall 较低 (69.6%) 说明模型倾向保守 预测 pass,
    因为 full trace 中大量正常执行信息掩盖了少量异常信号。 no_trace 的 ~296 个错误反映纯 majority class bias +
    代码表面特征的局限性, 模型无法区分 "看起来正确但有 bug" 和 "看起来复杂但正确" 的代码。 Tier 1 vs Tier 2 failure mode
    的定性差异是 two-tier hierarchy 的强支撑证据: Tier 1 失败源于数据表征限制 (可修复), Tier 2 失败源于模型推理能力 (模型依赖)。

    '
  tables:
  - name: Error Category Breakdown by Condition
    description: '矩阵: 行 = 错误类别 (GeneratorExit, control flow, semantic bug, noise,
      etc.), 列 = exception_only / VOTA / full_trace / no_trace。 每格: 错误数 + 占该条件总错误的百分比。


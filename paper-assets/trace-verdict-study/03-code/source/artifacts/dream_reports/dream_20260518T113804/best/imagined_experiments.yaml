      errors: ~69
      type: instruction following
    - method: GPT-4o 0-shot
      accuracy: ~93.2%
      errors: ~81
      type: instruction following
    - method: Qwen-1.5B 0-shot (base)
      accuracy: 93.45%
      errors: 78
      type: base model
    - method: Qwen-7B few-shot (base)
      accuracy: 90.84%
      errors: 109
      type: base model
    - method: Qwen-7B 0-shot (base)
      accuracy: 89.08%
      errors: 130
      type: base model
  figures_description:
  - 'Accuracy comparison bar chart: SFT bars (green, ~99.8%) vs frontier few-shot
    bars (blue, ~95-96%) vs base model bars (gray, ~89-93%)。SFT 1.5B = SFT 7B 是 visual
    highlight。'
  analysis: 'Few-shot baseline 回答两个潜在审稿人问题:

    (1) "为什么需要 SFT? Frontier model 不能直接做?" → No, 即使 GPT-4o/Claude 3-shot 也比 SFT 7B
    差 3.7pp (11.5x more errors)。

    (2) "SFT 的 value 是什么?" → parameter-level adaptation 将 error rate 从 ~4% 压到 representation-inherent
    floor 0.17%。

    更深层: SFT exception_only (1.5B, ~$0.5 GPU-hr) > Claude 3-shot (~$50 API)，

    说明 "right signal + cheap SFT" 优于 "frontier model + expensive inference"，

    这是论文 practical impact 的核心论点。

    '
- name: OOD generalization (cross-language traces)
  plan_id: plan_021
  description: 在 Python 外的编程语言 (Java/JavaScript) trace 上测试 exception_only 泛化性
  expected_results:
    java_exception_only_accuracy: 0.972
    javascript_exception_only_accuracy: 0.963
    python_in_domain_accuracy: 0.9983
    ood_mean_accuracy: 0.968
    ood_gap_vs_in_domain_pp: 3.1
    ood_vs_python_no_trace_pp: '+21.6'
  result_rationale: 'exception_only 学到的核心 pattern 是 "[ERROR] 标记存在 → fault detected
    → predict fail" 的映射。

    这个 pattern 的语言依赖性极低: Java (try/catch → Exception class + message)、

    JavaScript (try/catch → Error type + message) 的 exception 结构与 Python 高度同构。

    tracer 生成的 [ERROR] tag 格式跨语言一致（由 tracer 标准化），因此 SFT 模型学到的 pattern 可迁移。

    accuracy 从 99.83% 降到 ~97% 的 gap 来源: (1) OOD exception message 的 lexical distribution
    与 Python 不同

    （Java 的 NullPointerException、JavaScript 的 TypeError 在训练集中缺失），

    (2) 少数语言特有 edge case（如 Java checked exception 是正常控制流，非 fault indicator）。

    关键: 如果 OOD > 96%，说明 exception signal 的 fault detection 语义跨语言 universal，

    SFT 学到的不是 Python-specific pattern 而是 general fault indicator recognition。

    风险: 构建高质量 OOD 测试集需要 non-trivial 工程（不同语言的 tracer + benchmark），

    如果时间不足应优先确保 plan_016/017 的 core experiments。

    '
  tables:
  - name: Cross-language exception_only accuracy
    rows:
    - language: Python (in-domain)
      accuracy: 99.83%
      n: 1190
      note: training language
    - language: Java (OOD)
      accuracy: ~97.2%
      n: ~500
      note: NullPointerException 等 novel types
    - language: JavaScript (OOD)
      accuracy: ~96.3%
      n: ~500
      note: TypeError/ReferenceError novel
  figures_description:
  - 'Cross-language accuracy grouped bar: Python >> Java ≈ JavaScript，gap 小（<4pp），证明
    exception signal 跨语言 robust。'
  analysis: 'OOD 是 "nice-to-have" 而非 "must-have"。4 models × 3 families × 2 scales
    的 in-domain universality

    已构成充分证据。OOD 数据若好（>96%）则是 reviewer concern 的 decisive counter-argument，

    但构建成本高。建议: 如果 plan_016/017 结果确认 best tier，OOD 可留为 camera-ready supplement；

    如果 plan_016/017 结果弱于预期，OOD 的必要性上升。

    '
- name: Training dynamics (step-level learning curve)
  plan_id: plan_022
  description: exception_only vs full_trace 的 step-level eval learning curve，量化 convergence
    speed 差异
  expected_results:
    exception_only:
      steps_to_90pct: 60
      steps_to_95pct: 80
      steps_to_99pct: 150
      steps_to_final: 200
      final_accuracy: 0.9983
      loss_at_step50: 0.15
    full_trace:
      steps_to_80pct: 250
      steps_to_final: 900 (3 epochs)
      final_accuracy: 0.8176
      never_reaches_90: true
      loss_at_step50: 0.35
    convergence_speed_ratio: 4.2x (steps to reach full_trace ceiling)
    crossover_step: 45
  result_rationale: 'exception_only 的有效训练信号高度集中: pass 样本对应 "无 [ERROR]"，fail 样本对应 "有
    [ERROR] + type + message"。

    这是一个 near-binary feature，模型只需学习 "[ERROR] presence → fail" 的 mapping，

    所需训练步数极少。训练集 effective unique 样本仅 2858 条，batch_size=4 时 ~715 steps/epoch。

    50-100 steps（约 7-14% epoch）内模型应已捕获核心 pattern，accuracy > 95%。

    full_trace 包含大量 irrelevant tokens（variable values, memory addresses, loop iterations），

    模型需要 (1) 先学到忽略 irrelevant tokens 的 attention pattern，

    (2) 再从 relevant tokens 中 extract fault signal。这是两阶段 learning，天然更慢。

    且 information overload 导致 attention 无法稳定聚焦，收敛到 ~82% 后 plateau（受 noise ceiling
    限制）。

    crossover 预测在 ~45 steps: exception_only 在不到 50 steps 时就超过 full_trace 的最终 accuracy
    (81.76%)。

    这意味着 SFT exception_only 10 分钟的训练 > SFT full_trace 3 个 epoch 的训练，

    是论文中极具冲击力的 figure。

    '
  tables:
  - name: Convergence milestone comparison
    rows:
    - milestone: 80% accuracy
      exception_only: ~30 steps (~4 min)
      full_trace: ~250 steps (~35 min)
    - milestone: 90% accuracy
      exception_only: ~60 steps (~8 min)
      full_trace: never reached
    - milestone: 95% accuracy
      exception_only: ~80 steps (~11 min)
      full_trace: never reached
    - milestone: 99% accuracy
      exception_only: ~150 steps (~21 min)
      full_trace: never reached
    - milestone: final
      exception_only: 99.83% @ ~200 steps
      full_trace: 81.76% @ ~900 steps
  figures_description:
  - '核心 Figure: dual-panel learning curve。Left panel: x=training steps, y=accuracy。exception_only
    steep S-curve 快速 saturate at 99.83%，full_trace slow rise plateau at 81.76%。vertical
    dashed line at crossover step ~45。Right panel: same x-axis, y=train loss。exception_only
    loss drops fast and stays low，full_trace loss drops slowly and converges to higher
    floor。'
  - 'Supplementary: convergence speed as function of signal density (scatter plot
    with exception_only, VOTA, full_trace as data points)。'
  analysis: "Training dynamics 提供 information density 假说的 dynamic evidence，与 label_only\
    \ ablation 的 static evidence 互补:\n- Static evidence (plan_002): gradient dilution\
    \ 贡献 26%，information overload 贡献 74%\n- Dynamic evidence (plan_022): exception_only\
    \ converge 4.2x faster + reaches higher ceiling\n两者共同证明: 高信息密度信号不仅提升 accuracy\
    \ ceiling，更 dramatically 加速 learning。\nCrossover at ~45 steps 是论文中最直观的 \"why exception\
    \ works\" evidence —— \n\"一个极简信号在 50 步内超越完整 trace 训练 3 个 epoch 的结果\"。"

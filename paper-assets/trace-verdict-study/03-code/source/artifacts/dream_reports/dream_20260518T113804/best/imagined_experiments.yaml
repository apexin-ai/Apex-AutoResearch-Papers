- name: cross-seed tail-512 × Qwen-7B
  plan_id: plan_017
  description: Qwen-7B tail-512 × 3 seeds (42/123/456)，验证 post-transition convergence
    band robustness
  expected_results:
    seed42_accuracy: 0.936
    seed123_accuracy: 0.929
    seed456_accuracy: 0.941
    mean_accuracy: 0.935
    std_pp: 0.6
    max_min_range_pp: 1.2
    all_seeds_above_tail384_max: true
  result_rationale: 'Qwen-7B exception_only 3-seed variance = 0（99.83% 完全一致），说明 signal
    充足时该模型对 LoRA 初始化完全不敏感。

    tail-512 是 post-transition 第一个点（93.6%），signal 已充分但处于 "刚过阈值" 状态——

    部分样本的 exception 信息在 tail-384→512 窗口的边界上，这些 "边界样本" 的 prediction 对 LoRA 初始化略有敏感。

    但由于 Qwen 在 exception_only 上展现了极强的训练稳定性，tail-512 的 variance 也应该是 4 模型中最小的。

    std ≈ 0.6pp 远低于 2pp 阈值。关键: 即使最差 seed (92.9%) 也远高于 tail-384 最好情况 (~80%)，

    证明 phase transition 的位置是 seed-robust 的——不存在某个 seed 下 phase transition 右移到 >512
    的情况。

    '
  tables: []
  figures_description: []
  analysis: 'Convergence band [92.9%, 94.1%] 窄且完全位于 post-transition regime。

    与 exception_only ceiling (99.83%) 的 ~6pp gap 来自 tail-512 truncation 导致的 partial
    signal loss，

    而非训练随机性——这 6pp 是 deterministic information gap，不是 stochastic training gap。

    '

  figures_description:
  - 'Error heatmap: x=problem_id (sorted), y=condition。Tier 1 errors 高度集中在 2 个 problem，full_trace
    errors 均匀分散。'
  - 'Error overlap Venn diagram: exception_only(2) ⊂ VOTA(7) ⊂ full_trace(217) ⊂ no_trace(296)。strict
    subset 关系可视化 tier hierarchy。'
  analysis: 'Error analysis 为 two-tier hierarchy 增加第三个 evidence dimension（accuracy
    / calibration / error interpretability）。

    Tier 1 的 failure mode 是 deterministic + representation-inherent（可通过 tracer 改进消除），

    lower-tier 的 failure mode 是 stochastic + capability-dependent（改进路径不明确）。

    这强化 design principle: 最高 specificity 的 signal 不仅 accuracy 最高、calibration 最好，

    其 failure mode 也最可解释和最可修复。

    '
- name: Cross-model calibration (4 models × exception_only)

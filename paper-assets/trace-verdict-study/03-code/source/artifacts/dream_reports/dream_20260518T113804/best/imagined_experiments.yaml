- name: Few-shot prompting baseline (GPT-4o / Claude)
  plan_id: plan_020
  description: GPT-4o 和 Claude 在 exception_only traces 上的 0-shot + 3-shot verdict
    prediction，作为 non-SFT upper bound
  expected_results:
    gpt4o_0shot:
      accuracy: 0.932
      fail_recall: 0.83
      pass_recall: 0.97
    gpt4o_3shot:
      accuracy: 0.951
      fail_recall: 0.88
      pass_recall: 0.98
    claude_0shot:
      accuracy: 0.942
      fail_recall: 0.86
      pass_recall: 0.98
    claude_3shot:
      accuracy: 0.961
      fail_recall: 0.91
      pass_recall: 0.98
    sft_exception_only_best: 0.9983
    sft_advantage_over_best_fewshot_pp: 3.7
    sft_error_rate_ratio: 11.5x fewer errors
  result_rationale: '已有 base model zero-shot 数据: Qwen-7B 89.08%, DeepSeek-7B 90.59%,
    Qwen-1.5B 93.45%, CodeLlama-13B 51.01%。

    Frontier 模型（GPT-4o, Claude）有更强的 instruction following、更大 context window、更好的 reasoning，

    zero-shot 应 > 所有 base model zero-shot。GPT-4o zero-shot 预测 ~93%（类似 Qwen-1.5B zero-shot
    93.45%，

    但 GPT-4o 对 structured error data 的理解更好）。Claude 可能略高（~94%）因其 instruction following
    更精准。

    3-shot 提供 exemplars 帮助模型理解 output format 和 decision boundary，预计提升 2-3pp：

    GPT-4o 3-shot ~95%, Claude 3-shot ~96%。

    然而 few-shot 受限于 in-context learning 的 fundamental limitation: (1) 仅 3 个 examples
    无法覆盖所有 edge cases，

    (2) attention 需同时处理 instructions + examples + query，(3) 无 parameter-level adaptation。

    SFT exception_only (99.83%) 仍 > best few-shot (~96%) 约 3.7pp。

    虽然 3.7pp 看似小，但在 error rate 上是 11.5x 差异（0.17% vs 3.9%）——

    SFT 达到 representation 理论上限，few-shot 仍有 ~39 个额外错误。

    关键: fail_recall 差距更大（SFT 100% vs few-shot ~91%），说明 few-shot 在 minority class 上更差。

    '
  tables:

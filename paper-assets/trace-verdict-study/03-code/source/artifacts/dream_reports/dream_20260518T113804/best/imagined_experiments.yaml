    tail-384 不受 VOTA 截断问题影响（独立的固定长度 tail 截断策略），结果 clean。

    DeepSeek 的 pre-transition plateau（76-78%）与 Qwen-7B（77-80%）接近，

    说明两个模型在 "猜测能力"（insufficient signal 下的 baseline performance）上几乎一致，


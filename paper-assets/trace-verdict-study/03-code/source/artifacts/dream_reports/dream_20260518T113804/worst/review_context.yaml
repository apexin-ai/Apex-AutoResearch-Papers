narrative_guidance: 'P1 实验未产生 budget curve structural insight。tail-384 在 4 模型上均为 gradual（mean
  89.4%）， 无 sharp phase transition，仅 trivial monotonic ''more tokens → better''。Cross-seed
  tail-512 在 DeepSeek 上 std=6.4pp，phase transition 幅度不 seed-robust，最差 seed 仅比 tail-256
  高 5.7pp。 Budget curve 降级为 appendix monotonic trend，不作为独立 contribution。Reframe 策略：(1)
  砍 budget curve contribution，仅 appendix 报告；(2) 论文收缩为 diagnostic signal ablation study；(3)
  LoRA seed sensitivity + train_loss≈accuracy decoupling 提升为 methodological contribution；(4)
  强调 4 模型 exception ceiling 一致性 (99.3-100% non-outlier) 作为核心 thesis。Few-shot GPT-4o/Claude
  baseline 缩小 SFT 优势至 ~2.5pp，削弱 SFT necessity 叙事但 inference cost 论点仍可用。OOD 泛化差 (~82%)，单语言局限暴露。Error
  analysis 无新发现。Training dynamics 仅确认 trivial 预期。Overall: 2-3 distinct contributions，EMNLP
  main accept 概率 10-30%，Findings 为 realistic landing。'
imagined_experiments:
- name: tail-384 fine-grained phase transition (4 models)
  plan_id: plan_016
  description: tail-384 × 4 模型，精确定位 256→512 之间是 sharp transition 还是 gradual ramp
  expected_results:
    qwen7b_tail384_accuracy: 0.891
    qwen7b_tail384_ci:
    - 0.868
    - 0.912
    deepseek7b_tail384_accuracy: 0.882
    deepseek7b_tail384_ci:
    - 0.859
    - 0.904
    qwen15b_tail384_accuracy: 0.885
    qwen15b_tail384_ci:
    - 0.862
    - 0.907
    codellama13b_tail384_accuracy: 0.918
    codellama13b_tail384_ci:
    - 0.898
    - 0.936
    four_model_mean: 0.894
    four_model_std: 0.016
    max_diff_vs_tail256_pp: 15.9
    min_diff_vs_tail256_pp: 9.2
    fraction_of_256to512_gain_at_384_mean: 0.71
  result_rationale: 在 worst 档下，tail-384 落在 88-93% 区间（mean 89.4%），位于 tail-256（~76-79%）和
    tail-512 （~94-97%）之间偏上位置。这意味着 256→384 已获取约 71% 的 256→512 总增益，384→512 仅贡献剩余 29%。曲线呈平滑凹形（concave,
    diminishing returns），无任何 token 数阈值处的阶跃函数特征。根因： tail 截断保留 trace 末尾的 exception/assertion
    信息，384 tokens 已捕获大部分 exception 事件 （平均 exception 长度 ~50-150 tokens），额外 128 tokens（384→512）仅增量覆盖更长的
    stack trace 和额外 assertion output。CodeLlama-13B 因模型容量更大（13B vs 6-7B），在同等 token
    budget 下 利用信息效率更高，故 tail-384 达 91.8%。DeepSeek 因已知的 LoRA 训练不稳定性，在 intermediate
    token budget 下 accuracy 略低于其他模型。关键结论：256→512 的 accuracy 跳跃是 information accumulation
    的连续过程，而非 phase transition。
  tables:
  - name: 'Table: 4-Model Tail Budget Curve (Complete)'
    content: '| Tail tokens | Qwen-7B | DeepSeek-7B | Qwen-1.5B | CodeLlama-13B |
      Mean |

      |-------------|---------|-------------|-----------|---------------|------|

      | 256         | 77.5%   | 76.4%       | 72.6%     | 77.9%         | 76.1%|

      | 384 (NEW)   | 89.1%   | 88.2%       | 88.5%     | 91.8%         | 89.4%|

      | 512         | 93.6%   | 93.9%       | 95.6%     | 97.5%         | 95.2%|

      | 1024        | 96.5%   | 96.5%       | 96.6%     | 98.2%         | 97.0%|

      | 2048        | 97.3%   | 95.0%       | 97.9%     | collapse       | —   |

      '
  figures_description:
  - '4-model tail budget curve line plot: x=tail tokens (log scale), y=accuracy。所有模型显示平滑单调递增，无明显拐点。256→384
    和 384→512 的斜率连续递减，无阶跃特征。CodeLlama-2048 点缺失（collapse）。'
  analysis: 结果排除 sharp phase transition 假说。budget curve 仅描述 trivial monotonic pattern（more
    tokens → better），不构成 structured finding。审稿人会问 'so what?'——无法从中提取有意义的 design guideline（除
    'use more tokens'）。建议：将 budget curve 降级为 appendix Figure， 正文一句话概括 'accuracy increases
    monotonically with tail token budget (Appendix X)'。 不作为独立 contribution。唯一可保留的
    insight：tail >> head 的方向性（已在现有数据中确立）， 但这也不需要 384 点来证明。plan_016 的边际贡献为零。
- name: cross-seed budget curve tail-512 (4 models × 3 seeds)
  plan_id: plan_017
  description: tail-512 × 4 模型 × 3 seeds，验证 phase transition 后 convergence band robustness
  expected_results:
    qwen7b_seeds:
    - 0.936
    - 0.918
    - 0.943
    qwen7b_mean: 0.932
    qwen7b_std_pp: 1.3
    deepseek7b_seeds:
    - 0.939
    - 0.821
    - 0.924
    deepseek7b_mean: 0.895
    deepseek7b_std_pp: 6.4
    qwen15b_seeds:
    - 0.956
    - 0.925
    - 0.941
    qwen15b_mean: 0.941
    qwen15b_std_pp: 1.6
    codellama13b_seeds:
    - 0.975
    - 0.928
    - 0.961
    codellama13b_mean: 0.955
    codellama13b_std_pp: 2.5
    max_std_across_models_pp: 6.4
    min_256to512_gain_worst_seed_pp: 5.7
    deepseek_worst_seed_accuracy: 0.821
  result_rationale: DeepSeek 的 LoRA 初始化敏感性（exception_only seed123=91.09% vs seed42=99.33%）在
    tail-512 条件下更为严重。tail-512 的学习任务比 exception_only 更难——需要从 512 tokens 的混合 trace content（包含
    exception + partial loop + variable values）中提取 verdict signal，对 LoRA 初始化 basin
    的要求更高。DeepSeek seed123 的 fail_recall 预计仅 ~55-60%（类比 exception_only seed123 的 0.705），导致整体
    accuracy 降至 ~82%。此时 tail-512 worst seed（82.1%）与 tail-256 (76.4%) 的差距仅 5.7pp，可被审稿人解读为
    noise 而非 phase transition。其他 3 模型 std 在 1.3-2.5pp 范围内，较为稳定但不足以弥补 DeepSeek 的高方差。关键问题：如果
    phase transition 的幅度在最差 seed 上仅 5.7pp 且 CI overlap with noise，则 'sharp transition
    at ~400 tokens' 的叙事完全不成立。即使在稳定模型上（Qwen-7B seed range 91.8-94.3%），cross-seed CI
    也与 tail-384 预测区间重叠，进一步模糊 transition 边界。
  tables:
  - name: 'Table: Cross-Seed Tail-512 Results'
    content: '| Model         | Seed 42 | Seed 123 | Seed 456 | Mean   | Std (pp)
      |

      |---------------|---------|----------|----------|--------|----------|

      | Qwen-7B       | 93.6%   | 91.8%    | 94.3%    | 93.2%  | 1.3      |

      | DeepSeek-7B   | 93.9%   | 82.1%    | 92.4%    | 89.5%  | 6.4      |

      | Qwen-1.5B     | 95.6%   | 92.5%    | 94.1%    | 94.1%  | 1.6      |

      | CodeLlama-13B | 97.5%   | 92.8%    | 96.1%    | 95.5%  | 2.5      |

      '
  - name: 'Table: Worst-Seed 256→512 Gain'
    content: '| Model         | Tail-256 | Worst-seed Tail-512 | Gain (pp) |

      |---------------|----------|---------------------|-----------|

      | Qwen-7B       | 77.5%    | 91.8%               | 14.3      |

      | DeepSeek-7B   | 76.4%    | 82.1%               | 5.7       |

      | Qwen-1.5B     | 72.6%    | 92.5%               | 19.9      |

      | CodeLlama-13B | 77.9%    | 92.8%               | 14.9      |

      '
  figures_description:
  - 'Box plot: 4 模型 × tail-512 accuracy，每个 box 3 seeds。DeepSeek 的 whisker 远大于其他模型，seed123
    为明显离群点。'
  analysis: DeepSeek std=6.4pp 直接破坏 phase transition claim 的 universality。即使 3/4 模型稳定，
    审稿人只需指向 DeepSeek worst seed（82.1%）说 'phase transition 幅度不 robust，最差 seed 仅 5.7pp
    gain，与 noise 无法区分'。这使得 budget curve 作为 structural finding 的叙事彻底 瓦解。plan_017 的结果反而提供
    negative evidence，强化了 'budget curve is trivial monotonic' 的 worst-tier 判断。唯一正面用途：DeepSeek
    seed sensitivity 数据可用来强化 D9（LoRA initialization sensitivity）的 generality——不仅 exception_only，tail-512
    也显示同样的 pattern。这支持将 seed sensitivity 提升为独立 methodological finding。
- name: error analysis (existing predictions)
  plan_id: plan_018
  description: 用已有 predictions.jsonl 分析 failure modes——哪类程序/错误容易被误判
  expected_results:
    exception_only_total_errors: 2
    exception_only_error_ids:
    - 901
    - 905
    exception_only_error_root_cause: GeneratorExit (already known)
    vota_total_errors: 7
    vota_error_types:
      pass_to_fail: 3
      fail_to_pass: 4
    vota_problem_concentration: scattered, no dominant problem type
    full_trace_total_errors: 217
    full_trace_fail_recall: 0.696
    full_trace_dominant_error_pattern: complex control flow with nested exceptions,
      but not statistically concentrated
    no_trace_total_errors: 296
    no_trace_bias: majority-class (pass) prediction bias
    cross_condition_error_overlap: higher-condition errors are strict subset of lower-condition
      errors
    novel_failure_taxonomy: false
  result_rationale: Exception_only 仅 2 个 irreducible errors（GeneratorExit），已在 D5 中完整分析，无新信息可提取。
    VOTA 的 7 个错误分散在 7 个不同 problem 中（4 个 fail→pass 和 3 个 pass→fail），无统计上显著的 problem
    type 聚集——这是 99.41% accuracy 下 N=7 的必然结果：样本量太小无法建立有意义的 failure taxonomy。Full_trace
    的 217 个错误中，约 40% 来自 fail 样本（fail_recall=0.696），轻微集中在 含嵌套异常或复杂 generator/decorator
    的题目上，但 chi-squared test 对 problem type 分布无显著 结果（p>0.1）。No_trace 的 296 个错误以 majority-class
    bias 为主（模型倾向预测 pass），这在 class-imbalanced 设置（71.5% pass）下是预期行为。Cross-condition
    error overlap 分析显示 exception_only 的 2 个错误 ⊂ VOTA 的 7 个 ⊂ full_trace 的 217 个，符合
    hierarchy 预期但 不是新发现。整体上，error analysis 确认已知结论但不产生 novel insight。
  tables:
  - name: 'Table: Error Summary by Condition'
    content: '| Condition      | Errors | Error rate | Dominant pattern              |

      |----------------|--------|------------|-------------------------------|

      | exception_only | 2      | 0.17%      | GeneratorExit (known)         |

      | VOTA           | 7      | 0.59%      | scattered, no pattern         |

      | full_trace     | 217    | 18.2%      | weak: complex control flow    |

      | no_trace       | 296    | 24.9%      | majority-class bias           |

      '
  figures_description:
  - Confusion matrix heatmap × 4 conditions。exception_only 和 VOTA 几乎全白（极少错误），full_trace
    和 no_trace 显示 fail class 的 recall 问题。无 striking pattern。
  analysis: Error analysis 不产生可作为 contribution 的 finding。exception_only 的 2 个 errors
    已有 完整根因分析（D5），N=7 的 VOTA 错误无法支撑统计分析。建议：将 error analysis 作为 appendix 的完整性补充（reviewers
    expect it），但不要 claim 它为 contribution。正文一段话概括 'errors decrease monotonically with
    signal specificity; remaining errors at Tier 1 are representation-inherent (GeneratorExit)'
    即可。
- name: cross-model calibration (4 models × exception_only)
  plan_id: plan_019
  description: 4 模型 × exception_only ECE/Brier 对比，验证 calibration quality 是否 universal
  expected_results:
    qwen7b_ece: 0.0027
    qwen7b_brier: 0.0013
    qwen15b_ece: 0.0085
    qwen15b_brier: 0.0038
    codellama13b_ece: 0.0032
    codellama13b_brier: 0.0015
    deepseek7b_seed42_ece: 0.0048
    deepseek7b_seed42_brier: 0.0052
    deepseek7b_seed456_ece: 0.0051
    deepseek7b_seed456_brier: 0.0055
    deepseek7b_seed123_ece: 0.0652
    deepseek7b_seed123_brier: 0.0781
    deepseek7b_mean_ece: 0.025
    cross_model_nonoutlier_ece_max: 0.0085
    calibration_universality: 3/4 models excellent; DeepSeek seed-dependent
  result_rationale: Calibration quality 本质上跟踪 accuracy：高 accuracy 模型（99.33-99.83%）的预测概率分布
    集中在极端值（>0.99 或 <0.01），ECE 自然极低。Qwen-7B（ECE=0.0027, 已知）和 CodeLlama-13B （预计 ECE=0.0032）均在
    99.83% accuracy，其 calibration 几乎等价。Qwen-1.5B 虽然 accuracy 也是 99.83%，但 1.5B 模型的
    logit distribution 通常更 peaked/uncertain，softmax 温度不同 导致 ECE 略高（~0.0085）但仍在优秀范围内。DeepSeek
    的 seed 依赖性直接传导到 calibration： seed42/456（99.33%）的 ECE ~0.005，尚可；但 seed123（91.09%）的
    fail_recall 仅 0.705，意味着 大量 fail 样本被以 >0.5 的概率预测为 pass，导致 ECE 飙升至 ~0.065。跨模型 calibration
    的叙事 在 worst 档下变为 'model-dependent'——3/4 模型优秀，但 DeepSeek 的 seed sensitivity 使得
    '4 模型 universally excellent calibration' 的 claim 不成立。非离群 seeds 的 ECE 上界 0.0085
    仍然很好，但审稿人会聚焦 DeepSeek seed123。
  tables:
  - name: 'Table: Cross-Model Exception_Only Calibration'
    content: '| Model          | Seed | Accuracy | ECE    | Brier  |

      |----------------|------|----------|--------|--------|

      | Qwen-7B        | 42   | 99.83%   | 0.0027 | 0.0013 |

      | Qwen-1.5B      | 42   | 99.83%   | 0.0085 | 0.0038 |

      | CodeLlama-13B  | 42   | 99.83%   | 0.0032 | 0.0015 |

      | DeepSeek-7B    | 42   | 99.33%   | 0.0048 | 0.0052 |

      | DeepSeek-7B    | 456  | 99.33%   | 0.0051 | 0.0055 |

      | DeepSeek-7B    | 123  | 91.09%   | 0.0652 | 0.0781 |

      '
  figures_description:
  - Reliability diagram × 4 models：Qwen-7B/1.5B 和 CodeLlama-13B 的曲线几乎与 perfect calibration
    diagonal 重合。DeepSeek seed42/456 轻微偏离。DeepSeek seed123 在 0.4-0.8 概率 bin 严重偏离（over-confident
    on incorrect pass predictions）。
  analysis: Cross-model calibration 作为独立 finding 的价值有限——calibration 跟踪 accuracy 是已知规律，
    不提供独立 evidence dimension。在 worst 档下，DeepSeek seed123 的差 calibration（ECE=0.065）
    使 'universal calibration excellence' 不可 claim。建议：在正文 Results 中用一段话报告 non-outlier
    模型的 calibration 一致性（ECE<0.01），将 DeepSeek seed123 的 calibration 退化归因于 LoRA initialization（与
    D9 一致），完整 reliability diagrams 放 appendix。 不作为独立 contribution。
- name: few-shot prompting baseline (GPT-4o / Claude)
  plan_id: plan_020
  description: GPT-4o/Claude 在 exception_only 格式输入上的 0-shot + 3-shot verdict prediction
  expected_results:
    gpt4o_zeroshot_accuracy: 0.945
    gpt4o_zeroshot_ci:
    - 0.932
    - 0.957
    gpt4o_fewshot_accuracy: 0.965
    gpt4o_fewshot_ci:
    - 0.955
    - 0.975
    claude_zeroshot_accuracy: 0.953
    claude_zeroshot_ci:
    - 0.941
    - 0.964
    claude_fewshot_accuracy: 0.971
    claude_fewshot_ci:
    - 0.961
    - 0.98
    sft_exception_only_qwen7b: 0.9983
    sft_vs_best_fewshot_gap_pp: 2.7
    local_model_zeroshot_qwen7b: 0.8908
    local_model_fewshot_qwen7b: 0.9084
  result_rationale: 'Exception_only 格式的输入结构极为简单——本质上是 ''[ERROR] type: message'' 的列表或空标记。
    Frontier models（GPT-4o, Claude）在 binary classification from structured input 上极为
    擅长，且具备 Python 异常类型的丰富知识。Zero-shot 下，frontier model 能直接推理 ''[ERROR] 存在→fail; 不存在→pass''，达到
    94-95%；少量 errors 来自 GeneratorExit 等边缘 case 和模型 对 ''no exception but still fail''（assertion
    error 不在 exception_only 中）的处理。Few-shot examples 明确 format 约定和边界 case 后，accuracy
    进一步提升至 96-97%。相比之下，SFT exception_only（99.83%）仍以 ~2.7pp 领先最佳 few-shot，但此差距在统计上虽
    significant（McNemar p<0.05），实际意义有限。Worst 档下的关键问题：审稿人会指出 ''GPT-4o few-shot 已达 96.5%，7B
    model SFT 仅多 3pp，是否值得 SFT overhead？''——虽然 inference cost 论点成立（7B vs GPT-4o 每 token
    成本差 ~100x），但 ''SFT uniquely enables this capability'' 的叙事被削弱。 与已有本地模型 zero-shot
    数据的对比更有意义：Qwen-7B zero-shot 89.08% vs GPT-4o zero-shot 94.5% → frontier model
    以 5.4pp 领先同等 zero-shot，但 SFT 后 Qwen-7B 99.83% 反超 5.3pp。 这说明 SFT 的价值在于弥合 model
    capability gap。'
  tables:
  - name: 'Table: SFT vs Prompting Comparison'
    content: '| Method                          | Accuracy | Cost/sample | Latency
      |

      |---------------------------------|----------|-------------|---------|

      | Qwen-7B SFT exception_only      | 99.83%   | ~$0.0001    | <100ms  |

      | Claude 3-shot exception_only     | 97.1%    | ~$0.01      | ~2s     |

      | GPT-4o 3-shot exception_only     | 96.5%    | ~$0.008     | ~1.5s   |

      | Claude 0-shot exception_only     | 95.3%    | ~$0.005     | ~1s     |

      | GPT-4o 0-shot exception_only     | 94.5%    | ~$0.004     | ~1s     |

      | Qwen-1.5B 0-shot exception_only  | 93.5%    | ~$0.00005   | <50ms   |

      | Qwen-7B 3-shot exception_only    | 90.8%    | ~$0.0001    | <100ms  |

      | Qwen-7B 0-shot exception_only    | 89.1%    | ~$0.0001    | <100ms  |

      '
  figures_description:
  - 'Bar chart: accuracy by method，按 accuracy 降序排列。SFT 最高但 GPT-4o/Claude few-shot
    紧随其后，视觉上 gap 不大。'
  analysis: SFT 优势收缩至 ~2.7pp under worst 档。审稿人反应分两派：(1) 'SFT 仍 statistically significantly
    better, 且 inference cost 低 100x, 值得'；(2) 'gap 太小, frontier model 随版本更新可能抹平, SFT
    的 practical value 不明确'。论文应 preemptively address：SFT 的 价值不仅在于 accuracy（+2.7pp），更在于
    (a) 将 7B model 提升到 frontier-model-level performance（cost reduction），(b) 在 deployment
    场景下的 latency/throughput 优势， (c) 隐私——exception traces 不需要发送到外部 API。但 'SFT 是 verdict
    task 的唯一可行路径' 的强 claim 不再成立。建议降级为 'SFT 是 cost-effective 路径'。
- name: OOD generalization (cross-language traces)
  plan_id: plan_021
  description: 在 Java/JavaScript/C++ 的 trace 上测试 exception_only 泛化性
  expected_results:
    java_accuracy: 0.845
    java_ci:
    - 0.81
    - 0.88
    javascript_accuracy: 0.813
    javascript_ci:
    - 0.77
    - 0.85
    cpp_accuracy: 0.762
    cpp_ci:
    - 0.72
    - 0.8
    cross_language_mean: 0.807
    indomain_accuracy: 0.9983
    ood_degradation_pp: 19.1
    ood_dataset_size: ~200 samples per language (estimated)
  result_rationale: 'Exception_only 模型在训练时仅见 Python 的异常格式（ValueError, TypeError, IndexError,
    AttributeError 等），这些是 Python-specific exception 类名。OOD 语言使用不同的异常类型 （Java: NullPointerException,
    ArrayIndexOutOfBoundsException; JS: TypeError, ReferenceError 但 message 格式不同;
    C++: segfault, runtime_error 文本差异更大）。虽然 exception_only 的 ''[ERROR] type: ... message:
    ...'' 格式是 language-agnostic 的，但模型学到的是 Python exception type name → verdict 的映射，而非通用的
    ''error presence → fail'' 规则。如果模型 真的只学了 ''[ERROR] tag 有无'' 的 binary feature，OOD
    应该不降——但 format marker removal 实验（plan_015）显示移除标记后 accuracy 降至 96.5%，说明模型确实利用了
    exception content 而非仅 tag presence。OOD 语言的 exception content 分布偏移导致 accuracy 显著下降。Java
    因 exception 语义与 Python 最接近（同为 OOP，exception hierarchy 类似）而表现最好（84.5%）； C++ 的 error
    output 格式差异最大（无标准 exception hierarchy，segfault 等信号格式不同）， 降至 76.2%。Cross-language
    mean ~80.7%，比 in-domain 低 19pp。这一结果会被审稿人用来攻击 generalization claim，要求 multi-language
    training。'
  tables:
  - name: 'Table: OOD Cross-Language Results'
    content: '| Language   | Accuracy | Δ vs in-domain | Notes                        |

      |------------|----------|----------------|------------------------------|

      | Python (ID)| 99.83%   | —              | in-domain reference          |

      | Java       | 84.5%    | -15.3pp        | similar OOP exception model  |

      | JavaScript | 81.3%    | -18.5pp        | different error conventions  |

      | C++        | 76.2%    | -23.6pp        | no standard exception format |

      | Mean OOD   | 80.7%    | -19.1pp        |                              |

      '
  figures_description:

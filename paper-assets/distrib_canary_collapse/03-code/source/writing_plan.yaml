# ============================================================
# Writing Order (Reframe = mini Full Draft, all sections rewritten)
# ============================================================
writing_order:
  - step: 1
    section: results
    rationale: "Hero section. Lock down phase transition numbers, cross-architecture table, intervention data. All other sections reference these."
  - step: 2
    section: theory_and_method
    rationale: "S×R framework predicts results; method comparison justifies PermG. Depends on knowing exact result numbers."
  - step: 3
    section: introduction
    rationale: "Frames the discovery. Needs final numbers from Results + theoretical context from Theory."
  - step: 4
    section: background_and_related_work
    rationale: "Position paper. Needs Introduction's framing to determine emphasis."
  - step: 5
    section: discussion_and_conclusion
    rationale: "Implications, taxonomy, future work. After all results and theory finalized."
  - step: 6
    section: limitations
    rationale: "Honest scope assessment. After all claims finalized."
  - step: 7
    section: abstract
    rationale: "Last — summarizes everything."

# ============================================================
# Appendix Strategy
# ============================================================
appendix_strategy:
  note: >
    Current 39-page paper compresses to 8 pages main text.
    Appendix absorbs all detailed formalizations, secondary analyses,
    and expanded tables. Main text references appendix sections explicitly.
  structure:
    - id: "Appendix A"
      title: "Experimental Setup Details"
      content: "Full training hyperparameters, metric definitions, statistical test parameters. Expanded from current §5.1."
    - id: "Appendix B"
      title: "MMCT Formalization and Calibration"
      content: "Algorithm 1, FPR-inverse weighting equations, FPR/FNR tables, practical guidance tiers, MMCT ablation tables, consensus workflow figure."
    - id: "Appendix C"
      title: "Method Sensitivity Analysis"
      content: "Five-method ablation details, differencing diagnostic figure, d_max sensitivity, inter-method agreement (κ), consensus heatmap, single-method error table."
    - id: "Appendix D"
      title: "Shapley Decomposition and Power Analysis"
      content: "Shapley figure, bootstrap power analysis, transfer entropy results."
    - id: "Appendix E"
      title: "Metric Drift and Raw Data"
      content: "Drift summary table, distinct-3 results, canary blind spot details."
    - id: "Appendix F"
      title: "Cross-Architecture Details"
      content: "Per-condition method-level breakdown, SmolLM3 case study, cross-architecture regime table, Pythia-1.4B seed sensitivity."
    - id: "Appendix G"
      title: "Extended Discussion"
      content: "Token entropy vs perplexity, NLP-specific constraints, prevention paradox details, change-point analysis, sequential monitoring (CUSUM), observation window sensitivity."
    - id: "Appendix H"
      title: "Intervention Details"
      content: "Full intervention trajectories, bf16 vs fp32 comparison, threshold sensitivity."


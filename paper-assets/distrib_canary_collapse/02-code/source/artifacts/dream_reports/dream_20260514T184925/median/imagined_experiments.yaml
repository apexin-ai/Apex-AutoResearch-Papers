- name: '方法论 ablation: naive correlation vs Toda-Yamamoto'
  plan_id: plan_002
  description: '在 MVP 4-seed (α=1.0) + plan_001 α-sweep 数据上，对比四种方法: (i) naive Pearson
    lag-correlation, (ii) 差分后 cross-correlation, (iii) threshold-based lead time (2σ
    onset), (iv) Toda-Yamamoto panel temporal precedence. 量化各方法的 Type I error rate
    和伪显著比例。

    '
  expected_results:
    total_pairwise_associations_tested: 96
    naive_pearson_significant_count: 71
    differenced_xcorr_significant_count: 52
    threshold_2sigma_significant_count: 58
    TY_significant_count: 54
    naive_overturned_by_TY_count: 19
    naive_overturned_by_TY_pct: 20.0
    naive_only_significant_examples: effective_rank→distinct_1 (α=0.75), self_bleu→perplexity
      (α=0.50), ECE→perplexity (α=0.50)
    TY_and_differenced_agree_pct: 85.0
    threshold_vs_TY_concordance_pct: 78.0
  result_rationale: 'Naive Pearson correlation 在非平稳时间序列上 inflate Type I error，因为两个共同趋势
    的序列（如都单调恶化的指标）即使无因果关系也会产生高相关。在 α=1.0 (MVP) 数据中， 所有指标都单调恶化，naive 方法会将几乎所有 pair
    标记为显著。在 α=0.50/0.75 中， 部分指标（如 effective_rank）前期平台后期骤降，与 diversity 的单调下降产生虚假的 lag
    correlation。 TY 通过在 VAR 中加入额外 lag 吸收非平稳性，只检测 Granger-causal temporal precedence。
    预计 ~20% 的 naive 显著关联被推翻——主要是 (1) failed canary families (effective_rank, self_bleu)
    的虚假显著, (2) canary→perplexity 在 α≥0.50 的虚假显著。 20% 而非更高，因为 canary→diversity 的 lead
    是 genuine 的（即使 naive 也能捕捉）， 所以大部分真阳性在两种方法下一致。差分法与 TY 85% 一致因为差分也处理了一阶非平稳， 但 TY
    对高阶整合更 robust。

    '

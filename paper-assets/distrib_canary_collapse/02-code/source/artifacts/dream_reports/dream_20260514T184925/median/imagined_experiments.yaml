    red, CRS blue). Vertical line at trigger gen. Shows divergence after intervention.'
  - 'Fig S6: Per-seed trigger gen distribution and post-trigger trajectory variance.'
  analysis: 'Intervention 实验将 canary lead 的学术发现转化为 actionable tool。42% diversity preservation
    不是 dramatic 但 non-trivial。关键 insight：CRS 的效果上限受限于 trigger latency（ECE 需要 2-3 gen
    才触发）和干预力度（仅调整混合比例）。 Paper 应将此定位为 "proof of concept for predictive monitoring"
    而非 "complete solution to model collapse"。与 DCES (reactive) 的对比：CRS 在 trigger gen
    就 干预，DCES 需要等到 diversity 本身下降才反应（多 1-2 gen 延迟）。

    '
- name: Accumulate vs Replace 数据策略 ablation
  plan_id: plan_008
  description: 'α=0.50 下 accumulate (保留所有历史生成数据) vs replace (每代只用最新生成数据) × Pythia-410M
    × WikiText-103 × 3 seeds × 10 gen. 验证 Fu et al. 理论（accumulate 保证收敛）并测 canary 行为差异。

    '
  expected_results:
    replace_gen10_distinct_1: 0.108
    replace_gen10_perplexity: 185.3
    replace_ECE_to_distinct1_lead: 1
    accumulate_gen10_distinct_1: 0.135
    accumulate_gen10_perplexity: 112.4
    accumulate_ECE_to_distinct1_lead: 1
    accumulate_collapse_speed: ~40% slower
    accumulate_canary_ranking_preserved: true
    accumulate_canary_lead_preserved: true
    accumulate_effect_size_vs_replace: lower (0.82 vs 0.90)
  result_rationale: 'Accumulate 模式通过保留所有历史数据稀释了 synthetic contamination 的有效比例—— 到
    gen 10，累积数据中真实数据仍占相当比例（不像 replace 模式每代都是 α=0.50 fresh synthetic）。Fu et al. 的理论预测
    accumulate 最终收敛到 fixed point 而非 diverge，empirically 表现为 collapse 速度减慢 ~40%。 Canary
    ranking 和 lead 保持（1 gen）因为 lead 的机制（指标类型的响应速度差异） 不依赖 data strategy。但 effect size
    降低因为 slower collapse = 更平缓的趋势 = 更弱的 temporal precedence signal。 这个实验的主要价值是 (1)
    验证 Fu et al. 理论预测, (2) 证明 canary 行为对 data strategy robust, (3) 为 practitioner
    提供 actionable recommendation（accumulate 优于 replace）。

    '

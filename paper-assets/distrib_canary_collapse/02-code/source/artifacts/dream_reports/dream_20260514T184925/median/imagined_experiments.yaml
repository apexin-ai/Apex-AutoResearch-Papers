- name: CRS intervention experiment
  plan_id: plan_007
  description: 'CRS-predictive intervention vs no-intervention baseline. Pythia-410M
    × WikiText-103 × α=0.75 × 3 seeds × 10 gen. CRS 在 ECE 超过 threshold 时 trigger re-weighting
    to increase real data ratio.

    '
  expected_results:
    baseline_gen10_distinct_1: 0.083
    baseline_gen10_perplexity: 512.7
    baseline_gen10_ECE: 0.312
    intervention_gen10_distinct_1: 0.118
    intervention_gen10_perplexity: 324.6
    intervention_gen10_ECE: 0.195
    diversity_preserved_pct: 42.2
    perplexity_reduction_pct: 36.7
    intervention_trigger_gen_median: 3.0
    intervention_trigger_gen_range:
    - 2
    - 4
    false_trigger_rate: 0.0
    seeds_with_improvement: 3/3
  result_rationale: 'α=0.75 是一个有意义的测试点：collapse 足够严重以展示 intervention 效果，但不至于 像 α=1.0
    那样 catastrophic（无法挽救）。CRS 基于 ECE threshold 触发（ECE 在 gen 2-4 超过 2σ baseline）。触发后，CRS
    将有效 α 从 0.75 降到 ~0.50（增加真实 数据比例），从而减缓后续 collapse。 预计 diversity 保留 ~42%（不是完全挽救，因为
    (1) 触发前已有 2-3 gen 的损伤， (2) CRS 只调整比例不改变训练动态）。Perplexity 改善更大 (~37%) 因为 perplexity
    对数据质量比例的响应更直接。 所有 3 seeds 都有改善因为 ECE threshold 的 trigger 是 reliable 的（plan_001
    确认 ECE 在 α=0.75 下 3/3 seeds 显著 lead diversity）。 这个实验的价值不在于 CRS 本身的 novelty，而是证明
    "predictive monitoring enables actionable intervention"——将 canary lead 从学术发现转化为实用工具。

    '

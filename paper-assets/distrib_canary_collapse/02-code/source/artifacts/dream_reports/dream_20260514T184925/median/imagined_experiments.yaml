  - 'Fig 6: 410M vs 1.4B trajectory overlay at α=0.50. Dual y-axis for perplexity
    (left) and distinct_1 (right). Shaded ±1σ bands. 1.4B bands visibly wider.'
  analysis: 'Scaling trend: canary ranking and lead direction preserved, but statistical
    power drops. 这是 expected tradeoff——更大模型 collapse 更慢 = 信号更弱 = 需要更多 gen 或更多 seeds。
    Paper 应报告为 "directionally consistent scaling trend" 并标注 limitation： 完整 scale validation
    需要更长训练和更多 seeds（留作 future work）。 不宜用 1.4B 结果 over-claim scaling law。

    '

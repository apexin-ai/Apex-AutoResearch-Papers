  - name: '方法论 ablation: Naive vs Robust 检验'
    plan_id: plan_002
    description: '在 MVP 4-seed 数据 + α-sweep 9 runs 数据上，对比四种 lead-lag 量化方法： (i) naive
      Pearson lag-correlation (ii) 差分后 cross-correlation (iii) threshold-based onset
      lead (iv) Toda-Yamamoto panel temporal precedence。 统计所有方法对所有 canary→target pair
      的显著性判定，量化伪显著被推翻比例。

      '
    expected_results:
      total_pairs_tested: 104
      naive_pearson_significant_count: 71
      differenced_xcorr_significant_count: 48
      threshold_onset_significant_count: 39
      TY_significant_count: 42
      naive_overturned_by_TY_pct: 40.8
      naive_overturned_by_TY_count: 29
      false_positive_category_breakdown:
        effective_rank_pairs: 12
        self_bleu_pairs: 8
        canary_to_ppl_high_alpha: 6
        spurious_reverse_direction: 3
      TY_unique_significant_not_in_naive: 0
      method_agreement_TY_vs_threshold: 0.88
    result_rationale: '非平稳时间序列（所有 metric 在 iterative training 中趋势性退化）的 Pearson correlation
      产生 spurious regression——两个独立但都有趋势的序列可以 |r|>0.9。naive 方法对所有 "都在下降"的 metric pair
      报告显著，包括 effective_rank→diversity（实际无 lead-lag 关系， 只是共享下降趋势）和 canary→perplexity
      at α≥0.75（同步崩溃无因果方向）。 差分后去趋势消除部分伪关联但对短序列（10 gen）power 不足，false negative 较多。
      TY 方法在 VAR 框架中检验 Granger non-causality，自动处理非平稳性（通过 augmented lag），对真正的 lead-lag
      关系（canary→diversity）保持高 power（p<0.005）， 对无方向性的同步崩溃正确报告不显著（p>0.05）。~41% 的 naive
      显著关联被推翻， 主要来自三类：(1) 失败 canary 族的伪关联（effective_rank、self_bleu 与任何 target）， (2)
      高 α 下 canary→perplexity 的同步崩溃被误判为 lead， (3) 少数反向因果（target→canary）被 naive 双向
      correlation 报告为显著。

      '

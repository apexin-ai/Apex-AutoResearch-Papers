    result_rationale: '在 worst 档下，canary→perplexity decoupling 是 fundamental 而非 regime-dependent。
      原因：perplexity 退化由模型权重空间的 mode collapse 驱动（高频 token 概率集中）， 而 diversity collapse
      由生成分布的 support shrinkage 驱动——这是两个独立的退化通道。 低 α 下 diversity 退化本身变慢（真实数据持续注入维持分布
      support），导致 canary→diversity 的 lead time 缩短（从 α=1.0 的 ~1.5 gen 缩至 α=0.25 的 <1
      gen）且 signal-to-noise 恶化。 α=0.25 下 10 代训练中 distinct_1 仅下降 ~11%，ECE 变化更小，cross-correlation
      在如此 gentle 的曲线上无法可靠检测 lead-lag。α=0.50 下退化更明显但 3 seeds 仍有 1 个因初始化 差异不显著。perplexity
      在所有 α 下都走独立轨迹——α=0.25 下几乎不退化，α=0.75 下退化 但与 diversity 不同步、无 lead-lag 结构。这使得 phase
      diagram 无法画出有意义的 α* 边界， 只能描述为 ''decoupling across all regimes''。

      '
    tables:
    - name: 'Table 2: Cross-correlation summary across α regimes'
      description: '行: canary-target 对 (ece→distinct_1, entropy→distinct_1, ece→ppl,
        entropy→ppl)； 列: α=0.25/0.50/0.75/1.0，每格显示 mean_lag ± std, mean_r, #significant_seeds/total。
        关键观察：canary→diversity 行从左到右 lag 绝对值递增、显著 seed 数递增； canary→perplexity 行全为 ''—''（不显著）。

        '
    - name: 'Table 3: Metric trajectories at generation 10 across α'

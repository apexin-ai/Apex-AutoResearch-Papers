    best:
      tier: best
      meaning: α-sweep 揭示清晰的 predictability phase transition——低 α 下 canary→perplexity
        lead 出现，phase diagram 有明确 boundary，方法论贡献强
      key_assumptions:
      - canary→diversity lead (1-2 gen) 在所有 α 和 seeds 一致复现
      - canary→perplexity lead 在 α≤0.50 下出现 (≥1 gen lead, p<0.05)
      - phase diagram 存在清晰的 α* 阈值分隔 predictable/unpredictable regime
      - Toda-Yamamoto 推翻 >30% naive 显著关联——方法论贡献不可替代
      - cross-domain (C4) 和 scale (1.4B) spot-check 保持 canary ranking
      number_ranges:
        canary_diversity_lead_gen:
        - 1.5
        - 3.0
        canary_perplexity_lead_gen_low_alpha:
        - 1.0
        - 2.5
        TY_significance_rate_canary_diversity:
        - 0.85
        - 1.0
        naive_false_positive_overturned_pct:
        - 30
        - 55
        cross_seed_consistency:
        - 4
        - 4
        effect_size_r_canary_diversity:
        - 0.95
        - 0.99
        phase_boundary_alpha_star:
        - 0.5
        - 0.75
      narrative_direction: '原始 framing 完全成立——三条 claims 无需调整。Headline: ''canary metrics
        predict diversity collapse 1-3 gen ahead; predictability phase diagram reveals
        α* boundary above which perplexity becomes predictable.'' 方法论贡献独立成立（naive
        corr 高伪阳性率）。AAAI full paper，无需 fallback venue。'
    median:
      tier: median
      meaning: canary→diversity 稳固，canary→perplexity 仅在最低 α 下边际显著或仅对部分 canary 成立，phase
        diagram 存在但 boundary 模糊
      key_assumptions:
      - canary→diversity lead 跨 α 一致 (1-2 gen)
      - canary→perplexity lead 仅在 α=0.25 出现且效应较弱 (lag=1, 部分 seeds)
      - phase boundary 不是 sharp transition 而是 gradual degradation
      - Toda-Yamamoto 推翻 15-29% naive 显著关联——有价值但非 dramatic
      - C4 保持 canary ranking 但 lead time 缩短；1.4B 结果 noisy
      number_ranges:

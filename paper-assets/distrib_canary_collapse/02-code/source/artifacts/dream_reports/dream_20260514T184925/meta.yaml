        distinct dynamics，canary 仅 track diversity channel。这本身是 novel finding（与隐含假设'collapse
        is monolithic'相矛盾）。Phase diagram 变为 'decoupling diagram' 而非 'predictability
        diagram'。方法论贡献转为 systematic negative result：证明 naive correlation 与 robust
        方法给出相同结论（正面解读：practitioners 不需要复杂统计工具）。叙事锚点从 'early warning system' 转为 'understanding
        collapse geometry'。仍冲 AAAI——systematic empirical study + surprising negative
        results + collapse taxonomy 在 ML 方法论 track 有空间，但需要更多 analytical depth（可能加
        theoretical argument for why decoupling occurs）。

        '
    figures_description:
    - 'Fig 2: Decoupling diagram (替代原 predictability phase diagram)。x 轴 α，y 轴 ''lead
      time (gen)''。两条带：canary→diversity (蓝，带 seed 误差棒) 从 α=0.25 的 ~0.5 gen 升至 α=1.0
      的 ~1.5 gen；canary→perplexity (红，虚线) 在 y=0 处平坦，标注 ''n.s.''。无 α* 转折点。'
    - 'Fig 3: 3×3 小图阵列 (α × seed)，每图画 normalized entropy/ece/distinct_1/perplexity
      四条轨迹。展示 seed-to-seed variability：α=0.25 下部分 seed 的 canary 和 diversity 几乎平坦、无明显
      lead 结构。'
    - 'Fig S1: 每个 α 的 cross-correlogram heatmap (lag vs metric pair)，显示 canary→perplexity
      在所有 lag 处均无显著峰。'
    analysis: 'α-sweep 在 worst 档下产生的核心 finding 是 negative result：canary→perplexity
      lead 在任何 α 下都不存在。这否定了原始 Claim 2 的乐观假设（''低 α 下 canary→perplexity 恢复''）。 但 canary→diversity
      lead 确实存在，只是 fragile——低 α 下 SNR 不足、跨 seed 不一致。 叙事转向：collapse 不是 monolithic process，而是至少两个独立通道（diversity
      channel 和 quality channel）以不同速率、不同机制退化。Canary 指标（ECE/entropy）仅 track diversity
      channel 是因为它们测量的是输出分布的集中度（与 support shrinkage 直接相关）， 而 perplexity 测量的是对 held-out
      真实数据的 likelihood（与权重退化相关）。 这个 decoupling 本身是 novel finding，可以用 information-theoretic
      argument 支撑： entropy 和 ECE 是生成分布的 intrinsic 统计量，而 perplexity 是 cross-distribution
      统计量， 两者没有必然的 temporal coupling。

      '
  - name: '方法论 ablation: naive vs Toda-Yamamoto'
    plan_id: plan_002

        - 4
        effect_size_r_canary_diversity:
        - 0.88
        - 0.95
        phase_boundary_alpha_star:
        - 0.25
        - 0.5
      narrative_direction: 'Claim 1 保持不变。Claim 2 软化——从 ''phase diagram with clear
        boundary'' 降为 ''regime-dependent gradient: canary lead degrades monotonically
        with α, providing actionable warning only below α≈0.5''。Claim 3 从 ''naive
        corr produces high false positive rate'' 软化为 ''TY provides more conservative
        but reliable estimates''。需补充 intervention 实验 (plan_007) 以增强实用价值叙事。可能需要额外 scale/domain
        数据点来补强。仍投 AAAI，但准备 EMNLP Findings 作为 realistic fallback。'
    worst:
      tier: worst
      meaning: canary→diversity lead 存在但 seed-dependent 或 α-dependent，canary→perplexity
        在所有 α 下均不显著，方法论差异不大
      key_assumptions:
      - canary→diversity lead 在 α=1.0 下稳定 (MVP 已验证) 但在低 α 下缩短至 ≤1 gen 或跨 seed 不一致
      - canary→perplexity lead 在所有 α 下均不成立——collapse 维度之间 fundamentally decoupled
      - Toda-Yamamoto 与 naive 结论一致率 >85%——方法论 ablation 成为 negative result
      - effective_rank/self_bleu 之外，ECE 或 entropy 之一在低 α 下也开始失效
      - C4 或 1.4B 上 canary ranking 不保持

    analysis: '方法论 ablation 在 worst 档下的核心结论是 negative result：对于行为良好的 canary 指标 (ECE,
      token_entropy) 和行为良好的 target (distinct_1/2)，naive Pearson lag-correlation 与
      Toda-Yamamoto 给出本质相同的结论。正面解读是 practitioner-friendly：不需要复杂的 时间序列因果推断工具，简单的 cross-correlation
      在 iterative training 的单调退化场景下 就足够可靠。但这削弱了 paper 的 Claim 3（methodological rigor
      的独立贡献），叙事上 需要 reframe 为 ''we rigorously validated that simple methods suffice
      for this problem class'' 而非 ''we provide a superior methodology''。对 AAAI 审稿人来说，systematic

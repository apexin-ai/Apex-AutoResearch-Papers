      ty_naive_agreement_rate_good_canaries: 0.94
      ty_canary_diversity_significance_rate: 0.55
      ty_granger_direction_consistent: true
    result_rationale: '在 worst 档下，naive 与 Toda-Yamamoto 的一致率 >85%，方法论 ablation 成为
      negative result。 原因有二：(1) 在 α=1.0 的强 collapse regime 下，趋势极其单调（entropy 从 3.2
      直降到 1.3）， 即使有伪回归风险，方向和 ranking 不会被推翻——趋势太强以至于方法论差异被淹没。 (2) 在低 α 下，信号本身就弱（ECE
      变化 <0.05），naive 和 robust 方法都给出不显著—— agreement 来自双方都检测不到信号，而非双方都检测到相同信号。被推翻的
      case 集中在 effective_rank/self_bleu 等非单调指标上（这些指标的 naive correlation 因非平稳性而虚高），
      但这些指标已在 MVP 中标记为失败，推翻它们不增加信息量。对于 ECE/entropy→distinct_1/2 这些核心对，推翻率仅 ~3%——practitioner
      用 naive Pearson 就够了。Toda-Yamamoto 的 TY_significance_rate 仅 55% 是因为低 α 下时间序列太短（10
      代）且变化太温和， 即使存在真实 lead 也通不过严格的 chi-square 检验。

      '
    tables:

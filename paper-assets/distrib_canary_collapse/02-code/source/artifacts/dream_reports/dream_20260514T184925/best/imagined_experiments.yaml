  result_rationale: 'Canary metric 的 lead 机制是 distribution-level 的——ECE 检测 calibration
    drift， token entropy 检测 vocabulary concentration——这两个现象在任何 iterative self-consuming
    训练中都会发生，不依赖于 domain-specific 的 token 分布。C4 是 web crawl 数据， vocabulary 更多样、初始 distinct_n

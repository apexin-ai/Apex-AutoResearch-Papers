    post_intervention_alpha_effective: 0.52
    gen10_perplexity_no_intervention: 512.7
    gen10_perplexity_crs: 341.2
    perplexity_reduction_pct: 33.4
  result_rationale: 'CRS 在 ECE onset（~gen 3）时将 α 从 0.75 降到 ~0.52（增加 real data 比例），
    等效于将训练轨迹从 α=0.75 regime "切换"到 α≈0.50 regime。 从 α-sweep 数据我们知道 α=0.50 的 gen10 distinct_1
    ≈ 0.198 vs α=0.75 的 0.112， 所以 intervention 后的 gen10 diversity 应接近 α=0.50 的水平。
    Perplexity 也相应改善（从 ~513 降到 ~341，接近 α=0.50 和 α=0.75 的中间值， 因为前 3 代仍在 α=0.75 下训练积累了部分
    drift）。 76.8% diversity preservation = (0.198 - 0.112) / (0.312 - 0.112) × 100%，
    即恢复了从 α=0.75 到 α=0.25 baseline 之间 ~77% 的 diversity gap。 这不是 perfect recovery 因为前几代的
    drift 不可逆，但足以证明 predictive intervention 的实用价值——canary 提供的 1-2 gen 预警窗口转化为可操作的

  result_rationale: '在 worst 档下，extended run 揭示 lag=-5 确实是伪影但不是截断伪影——是 saturation
    伪影。原因：entropy 和 ECE 在 gen 8-10 后接近物理下界（entropy→0，ECE→~0.5）， 变化速率趋零。而 perplexity
    持续指数增长无上界。这意味着在 gen 10 之后， 两个时间序列的形状 fundamentally 不同（一个饱和一个发散），cross-correlation
    在 gen 10+ 的数据上无法给出有意义的 lag 估计。lag=-5 在 MVP 中的出现是因为 entropy 的早期快速下降阶段 (gen 1-5)
    与 perplexity 的后期快速上升阶段 (gen 5-10) 恰好在 lag=5 处对齐——但这是 curve shape coincidence 而非因果
    lead。max_lag=10 下两个 seeds 给出 -7 和 -3（std=2.83），进一步说明这个 lag 没有 seed-stable 的 含义。20
    gen 数据的真正价值是展示 collapse trajectory 的完整形状：entropy saturates → distinct_n continues
    to decline slowly → perplexity diverges。 三个通道的 asymptotic behavior 完全不同，强化 decoupling
    narrative。

    '
  tables:
  - name: 'Table S3: Extended trajectory (gen 0-20) key metrics'
    description: '20 行 × 6 列 (gen, perplexity, entropy, ece, distinct_1, distinct_2)，
      标注 saturation 转折点。

      '
  figures_description:
  - 'Fig S2: 三个 panel。(a) 0-20 gen 的 raw 轨迹 (log scale for perplexity)。(b) 各指标的 per-generation
    变化率 (Δmetric/gen)——展示 entropy 的变化率在 gen 8 后趋零而 perplexity 变化率持续增长。(c) Cross-correlogram
    for lag -10 to +10——无显著峰。'
  analysis: 'Extended run 在 worst 档下的核心价值不是解决 max_lag 截断问题（答案是 ''lag=-5 本来就不 real''），而是提供
    collapse trajectory 的完整 anatomical picture。 Entropy/ECE saturation 而 perplexity
    divergence 的现象是 decoupling thesis 的 最强证据：这两类指标测量的是不同的 quantity，它们的动力学 fundamentally
    不同。 这支持 theoretical argument：canary 指标是生成分布的 marginal statistics， 在分布 support
    收缩到某个 threshold 后就不再变化；而 perplexity 是 cross-entropy against ground truth，只要模型继续偏离真实分布就会持续增长。这个
    asymmetry 是 decoupling 的 information-theoretic root cause。

    '
- name: Intervention 实验
  plan_id: plan_007
  description: 'CRS-predictive (canary-triggered real data injection) vs no-intervention
    baseline × Pythia-410M × α=0.75 × 3 seeds × 10 gen。

    '
  expected_results:
    int_crs_gen10_distinct1_mean: 0.081
    int_baseline_gen10_distinct1_mean: 0.074
    int_diversity_preservation_pct: 9.5
    int_crs_gen10_perplexity_mean: 270.3
    int_baseline_gen10_perplexity_mean: 285.6
    int_perplexity_improvement_pct: 5.4
    int_crs_trigger_gen_mean: 2.3
    int_crs_trigger_gen_std: 0.8
    int_effect_significant: false
    int_cross_seed_consistent: false
  result_rationale: '在 worst 档下，intervention 效果 negligible。原因链：(1) canary→diversity
    lead 在 α=0.75 下虽存在但仅 ~1 gen 且 seed-dependent——intervention 的 trigger timing 不稳定（gen
    2-3 ± 0.8）；(2) trigger 后注入真实数据仅 partially offset 一代的 合成污染，但不改变后续各代继续累积 synthetic
    data 的趋势；(3) 更根本地， 1 gen 的 lead time 意味着 intervention 最多比 reactive approach 早
    1 代行动—— 在 10 代训练中，这个优势被噪声淹没。(4) Perplexity 不受 intervention 影响 是因为 CRS 是 diversity-channel
    的干预（基于 canary signal 触发），而 perplexity 退化走的是 quality-channel——intervention 对错了通道。
    1/3 seeds 中 CRS 比 baseline 差是因为 false trigger（canary noise 导致过早 或不当注入真实数据，反而干扰了训练稳定性）。

    '
  tables:
  - name: 'Table 7: Intervention effect summary'
    description: '行: metric (distinct_1, distinct_2, perplexity, entropy, ece)， 列:
      baseline mean±std, CRS mean±std, Δ%, p-value。全部 p>0.1。

      '
  figures_description:
  - 'Fig 7: 3×2 panel (3 seeds × baseline/CRS)。每 panel 画 distinct_1 和 perplexity 轨迹。Vertical
    arrow 标注 CRS trigger point。展示 trigger timing 的 seed-to-seed 变异和 intervention 后轨迹无显著分叉。'
  analysis: 'Intervention 实验在 worst 档下是 negative result：CRS-triggered intervention
    不显著优于 no-intervention baseline。这削弱了 paper 的实用性主张，但与 worst 档 的 decoupling narrative
    一致——如果 canary 只 lead diversity 且 lead time <1.5 gen， 基于 canary 的 intervention
    就没有足够的 anticipation window 来有效干预。 这实际上是 worst 档叙事的一个 coherent conclusion：early
    warning is possible (for diversity) but not actionable (lead too short and domain-dependent)。
    Paper 可以诚实报告这个 negative result 并讨论 what intervention strategy WOULD work（e.g.,
    continuous proportional correction 而非 threshold-triggered injection），作为 future
    work。P2 优先级意味着可以砍掉这个实验如果时间紧。

    '
- name: '数据策略 ablation: accumulate vs replace'
  plan_id: plan_008
  description: 'α=0.50 下 accumulate (每代保留所有历史合成数据) vs replace (每代只用当代合成数据) × 3 seeds
    × 10 gen，验证 Fu et al. accumulate 理论 + canary 行为差异。

    '
  expected_results:
    acc_gen10_perplexity_mean: 48.3
    rep_gen10_perplexity_mean: 78.3
    acc_gen10_distinct1_mean: 0.091
    rep_gen10_distinct1_mean: 0.082
    acc_gen10_entropy_mean: 2.78
    rep_gen10_entropy_mean: 2.45
    acc_ece_distinct1_lag_mean: -0.33
    acc_ece_distinct1_p_significant_seeds: 0
    rep_ece_distinct1_lag_mean: -1.0
    rep_ece_distinct1_p_significant_seeds: 2
    acc_collapse_rate_ratio: 0.55
    canary_behavior_qualitatively_different: true
  result_rationale: '在 worst 档下，accumulate 策略确实大幅减缓 collapse（与 Fu et al. 理论一致）， 但
    canary lead-lag 结构在 accumulate 下消失。原因：accumulate 模式下每代的 training data 中合成数据比例被历史数据稀释（gen
    10 时只有 ~9% 的数据是最新代 合成的，其余是累积的 gen 1-9 + 真实数据），退化变得极其 gradual 且近似线性。 在这种 gentle、quasi-linear
    的退化曲线上，所有指标几乎同步缓慢下降， cross-correlation 检测不到 lead-lag（因为 lead-lag 的检测依赖于不同指标的 非线性
    response timing 差异——当 forcing 太弱时，所有指标都在 linear response regime，相位差消失）。这给 worst
    档叙事增加了另一个 dimension：canary lead 不仅 regime-dependent (on α) 而且 strategy-dependent
    (on data mixing)。 Practitioners 用 accumulate 策略时 canary 指标仍可作为 monitoring tool
    (absolute level 可以 track collapse severity) 但不提供 predictive lead。

    '
  tables:
  - name: 'Table S4: Accumulate vs replace trajectory comparison'
    description: '行: generation (0-10)，列: 两组的 perplexity, entropy, ece, distinct_1。
      标注 collapse rate ratio 和 lead-lag 检测结果。

      '
  figures_description:
  - 'Fig S3: 双列 (accumulate 左, replace 右)。上行: raw 轨迹。下行: cross-correlogram。展示 accumulate
    的 correlogram 无显著峰（接近 flat），replace 的 correlogram 有明确负 lag 峰。'
  analysis: 数据策略 ablation 在 worst 档下的发现是：Fu et al. 的 accumulate 策略有效减缓 collapse（确认理论预测），但同时消除了
    canary 的 predictive lead。这是一个 paradox：最需要 early warning 的 regime (replace, fast
    collapse) 是 canary 最有效的 regime；不太需要 early warning 的 regime (accumulate, slow collapse)
    是 canary 失效的 regime。这个 observation 可以作为 discussion section 的 interesting point，连接到
    worst 档的 overarching narrative：canary 的实用性 受限于 collapse dynamics 的 'sharpness'——只有当退化足够非线性时，不同指标的
    response timing 差异才能产生可检测的 lead-lag。这为 theoretical argument 提供了 intuition：lead-lag
    是非线性 response 的 emergent property。

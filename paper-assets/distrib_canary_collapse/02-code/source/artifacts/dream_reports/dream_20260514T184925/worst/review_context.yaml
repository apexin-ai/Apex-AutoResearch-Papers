    alpha_050_ece_distinct1_lag_std: 0.82
    alpha_050_ece_distinct1_r_mean: 0.82
    alpha_050_ece_distinct1_p_significant_seeds: 2
    alpha_050_entropy_distinct1_lag_mean: -0.67
    alpha_050_entropy_distinct1_p_significant_seeds: 2
    alpha_050_ece_perplexity_lag_mean: 0.0
    alpha_050_ece_perplexity_p_significant_seeds: 0
    alpha_050_entropy_perplexity_p_significant_seeds: 0
    alpha_050_gen10_perplexity: 78.3
    alpha_050_gen10_distinct1: 0.082
    alpha_050_gen10_entropy: 2.45
    alpha_050_gen10_ece: 0.12
    alpha_075_ece_distinct1_lag_mean: -1.33
    alpha_075_ece_distinct1_lag_std: 0.58
    alpha_075_ece_distinct1_r_mean: 0.86
    alpha_075_ece_distinct1_p_significant_seeds: 2
    alpha_075_entropy_distinct1_lag_mean: -1.0
    alpha_075_entropy_distinct1_p_significant_seeds: 3
    alpha_075_ece_perplexity_lag_mean: 0.0
    alpha_075_ece_perplexity_p_significant_seeds: 0
    alpha_075_entropy_perplexity_p_significant_seeds: 0
    alpha_075_gen10_perplexity: 285.6
    alpha_075_gen10_distinct1: 0.074
    alpha_075_gen10_entropy: 1.78
    alpha_075_gen10_ece: 0.28
    phase_boundary_alpha_star: null
    canary_perplexity_significant_any_alpha: false
    cross_seed_consistency_mean: 2.0
  result_rationale: '在 worst 档下，canary→perplexity decoupling 是 fundamental 而非 regime-dependent。
    原因：perplexity 退化由模型权重空间的 mode collapse 驱动（高频 token 概率集中）， 而 diversity collapse
    由生成分布的 support shrinkage 驱动——这是两个独立的退化通道。 低 α 下 diversity 退化本身变慢（真实数据持续注入维持分布
    support），导致 canary→diversity 的 lead time 缩短（从 α=1.0 的 ~1.5 gen 缩至 α=0.25 的 <1
    gen）且 signal-to-noise 恶化。 α=0.25 下 10 代训练中 distinct_1 仅下降 ~11%，ECE 变化更小，cross-correlation
    在如此 gentle 的曲线上无法可靠检测 lead-lag。α=0.50 下退化更明显但 3 seeds 仍有 1 个因初始化 差异不显著。perplexity
    在所有 α 下都走独立轨迹——α=0.25 下几乎不退化，α=0.75 下退化 但与 diversity 不同步、无 lead-lag 结构。这使得 phase
    diagram 无法画出有意义的 α* 边界， 只能描述为 ''decoupling across all regimes''。

    '
  tables:
  - name: 'Table 2: Cross-correlation summary across α regimes'
    description: '行: canary-target 对 (ece→distinct_1, entropy→distinct_1, ece→ppl,
      entropy→ppl)； 列: α=0.25/0.50/0.75/1.0，每格显示 mean_lag ± std, mean_r, #significant_seeds/total。
      关键观察：canary→diversity 行从左到右 lag 绝对值递增、显著 seed 数递增； canary→perplexity 行全为 ''—''（不显著）。

      '
  - name: 'Table 3: Metric trajectories at generation 10 across α'
    description: '行: α=0.25/0.50/0.75/1.0；列: perplexity, token_entropy, ece, distinct_1,
      distinct_2。 展示 perplexity 在低 α 下几乎不退化而 diversity 已开始下滑的 decoupling 证据。

      '
  figures_description:
  - 'Fig 2: Decoupling diagram (替代原 predictability phase diagram)。x 轴 α，y 轴 ''lead
    time (gen)''。两条带：canary→diversity (蓝，带 seed 误差棒) 从 α=0.25 的 ~0.5 gen 升至 α=1.0
    的 ~1.5 gen；canary→perplexity (红，虚线) 在 y=0 处平坦，标注 ''n.s.''。无 α* 转折点。'
  - 'Fig 3: 3×3 小图阵列 (α × seed)，每图画 normalized entropy/ece/distinct_1/perplexity 四条轨迹。展示
    seed-to-seed variability：α=0.25 下部分 seed 的 canary 和 diversity 几乎平坦、无明显 lead 结构。'
  - 'Fig S1: 每个 α 的 cross-correlogram heatmap (lag vs metric pair)，显示 canary→perplexity
    在所有 lag 处均无显著峰。'
  analysis: 'α-sweep 在 worst 档下产生的核心 finding 是 negative result：canary→perplexity lead
    在任何 α 下都不存在。这否定了原始 Claim 2 的乐观假设（''低 α 下 canary→perplexity 恢复''）。 但 canary→diversity
    lead 确实存在，只是 fragile——低 α 下 SNR 不足、跨 seed 不一致。 叙事转向：collapse 不是 monolithic process，而是至少两个独立通道（diversity
    channel 和 quality channel）以不同速率、不同机制退化。Canary 指标（ECE/entropy）仅 track diversity
    channel 是因为它们测量的是输出分布的集中度（与 support shrinkage 直接相关）， 而 perplexity 测量的是对 held-out
    真实数据的 likelihood（与权重退化相关）。 这个 decoupling 本身是 novel finding，可以用 information-theoretic
    argument 支撑： entropy 和 ECE 是生成分布的 intrinsic 统计量，而 perplexity 是 cross-distribution
    统计量， 两者没有必然的 temporal coupling。

    '
- name: '方法论 ablation: naive vs Toda-Yamamoto'
  plan_id: plan_002
  description: '在 MVP 4-seed (α=1.0) + α-sweep 数据上对比 (i) naive Pearson lag-corr (ii)
    差分后 cross-corr (iii) threshold-based lead time (iv) Toda-Yamamoto panel temporal
    precedence，量化伪显著关联被推翻比例。

    '
  expected_results:
    naive_significant_pairs_alpha1: 24
    ty_significant_pairs_alpha1: 18
    naive_overturned_by_ty_alpha1: 6
    overturned_pct_alpha1: 25.0
    naive_overturned_by_ty_good_canaries_alpha1: 1
    overturned_pct_good_canaries_alpha1: 3.1
    naive_significant_pairs_sweep: 36
    ty_significant_pairs_sweep: 28
    naive_overturned_by_ty_sweep: 5
    overturned_pct_sweep: 13.9
    ty_naive_agreement_rate_overall: 0.88
    ty_naive_agreement_rate_good_canaries: 0.94
    ty_canary_diversity_significance_rate: 0.55
    ty_granger_direction_consistent: true
  result_rationale: '在 worst 档下，naive 与 Toda-Yamamoto 的一致率 >85%，方法论 ablation 成为 negative
    result。 原因有二：(1) 在 α=1.0 的强 collapse regime 下，趋势极其单调（entropy 从 3.2 直降到 1.3）， 即使有伪回归风险，方向和
    ranking 不会被推翻——趋势太强以至于方法论差异被淹没。 (2) 在低 α 下，信号本身就弱（ECE 变化 <0.05），naive 和 robust
    方法都给出不显著—— agreement 来自双方都检测不到信号，而非双方都检测到相同信号。被推翻的 case 集中在 effective_rank/self_bleu
    等非单调指标上（这些指标的 naive correlation 因非平稳性而虚高）， 但这些指标已在 MVP 中标记为失败，推翻它们不增加信息量。对于 ECE/entropy→distinct_1/2
    这些核心对，推翻率仅 ~3%——practitioner 用 naive Pearson 就够了。Toda-Yamamoto 的 TY_significance_rate
    仅 55% 是因为低 α 下时间序列太短（10 代）且变化太温和， 即使存在真实 lead 也通不过严格的 chi-square 检验。

    '
  tables:
  - name: 'Table 4: Method agreement matrix'
    description: '上半部：α=1.0，行为 metric pair，列为四种方法的结论 (significant/not, lag estimate)。
      下半部：α-sweep 汇总，同样格式。最后一行汇总 agreement rate。 关键 takeaway：核心 canary 对的 agreement
      >94%，差异集中在已知失败指标。

      '
  - name: 'Table S2: Individual pair-wise comparison detail'
    description: '完整 48-row 表 (每个 canary-target-α-seed 组合一行)，标注 naive 给出显著而 TY 推翻的
      case。

      '
  figures_description:
  - 'Fig 4: Scatter plot，x 轴 naive Pearson r，y 轴 TY chi-square test statistic。核心 canary
    对 (蓝点) 聚集在右上角 (双方显著)；失败指标 (红×) 散布在右下 (naive 显著但 TY 不显著)；低 α 弱信号 (灰点) 在左下 (双方不显著)。对角带标注
    ''88% agreement zone''。'
  analysis: '方法论 ablation 在 worst 档下的核心结论是 negative result：对于行为良好的 canary 指标 (ECE,
    token_entropy) 和行为良好的 target (distinct_1/2)，naive Pearson lag-correlation 与 Toda-Yamamoto
    给出本质相同的结论。正面解读是 practitioner-friendly：不需要复杂的 时间序列因果推断工具，简单的 cross-correlation
    在 iterative training 的单调退化场景下 就足够可靠。但这削弱了 paper 的 Claim 3（methodological rigor
    的独立贡献），叙事上 需要 reframe 为 ''we rigorously validated that simple methods suffice
    for this problem class'' 而非 ''we provide a superior methodology''。对 AAAI 审稿人来说，systematic
    negative result 本身有方法论价值，但需要更深的 theoretical argument（为什么在此问题类下 spurious regression
    不是问题——可能因为 training dynamics 的单调性提供了 natural detrending）。

    '
- name: MVP 结果 formalization (max_lag=7)
  plan_id: plan_003
  description: '将 4-seed 100% SC 结果按 paper 格式整理，max_lag 从 5 增大到 7 重跑验证截断效应， signal
    onset 用 2σ 标准重新定义。

    '
  expected_results:
    ece_distinct1_lag_maxlag7_mean: -2.5
    ece_distinct1_lag_maxlag7_std: 0.58
    ece_distinct2_lag_maxlag7_mean: -1.25
    ece_distinct2_lag_maxlag7_std: 0.5
    entropy_distinct1_lag_maxlag7_mean: -1.25
    entropy_distinct1_lag_maxlag7_std: 0.5
    entropy_perplexity_lag_maxlag7_mean: -5.5
    entropy_perplexity_lag_maxlag7_p_mean: 0.09
    entropy_perplexity_lag_maxlag7_significant_seeds: 1
    ece_onset_gen_mean: 1.5
    entropy_onset_gen_mean: 1.75
    distinct1_onset_gen_mean: 3.0
    distinct2_onset_gen_mean: 3.25
    perplexity_onset_gen_mean: 2.5
    onset_based_lead_ece_distinct1: 1.5
    onset_based_lead_entropy_distinct1: 1.25
  result_rationale: '在 worst 档下，扩大 max_lag 不会 qualitatively 改变结论：canary→diversity
    lead 稍有 调整（ece→distinct_1 从 -2.25 变为 -2.5），但 canary→perplexity 仍不显著。 原因：10 代数据只有
    10 个数据点，max_lag=7 意味着仅 3 个有效自由度用于检验， 统计 power 极低。entropy→perplexity 的 lag=-5.5
    看起来像是在极少数据点上的 噪声拟合——1/4 seeds 碰巧 p<0.05 是 Type I error 的预期频率。2σ onset 分析 会给出更直观的
    lead time 估计（~1.5 gen for ece→distinct_1），与 cross-correlation 结果大致一致但 confidence
    interval 更宽。这个实验在 worst 档下主要是 housekeeping—— 不改变任何核心结论，只是让 reporting 更严谨。

    '
  tables:
  - name: 'Table 1: Lead-lag summary (max_lag=5 vs max_lag=7)'
    description: '对比表，每行一个 canary-target 对，列为 max_lag=5 和 max_lag=7 下的 lag, r, p。
      展示结论稳定性——核心 canary→diversity 对不受 max_lag 影响。

      '
  - name: 'Table S1: 2σ onset generation for each metric × seed'
    description: '4 seeds × 7 metrics，每格标注 onset generation (first gen where metric
      deviates >2σ from gen0)。Lead time = target_onset - canary_onset。

      '
  figures_description:
  - 'Fig 1: 4-panel (一个 per seed) 展示所有指标的 normalized 轨迹 (gen 0-10)。垂直虚线标注各指标的 2σ onset。ECE/entropy
    的 onset 线一致在 distinct_1/2 之前 1-2 gen。Perplexity onset 与 canary onset 无一致 ordering。'
  analysis: 'Formalization 确认 MVP 结论的稳定性。在 worst 档下，max_lag=7 没有揭示被截断的 更长 lead——这是预期的，因为
    10-point 时间序列本身不支持可靠的长 lag 估计。 2σ onset 方法提供了 model-free 的 lead time 估计，与 cross-correlation
    方法 给出一致结论（~1.5 gen lead for canary→diversity），增强了结果的 robustness。 但 onset 方法也暴露了
    distinct_3 的不稳定性（onset gen 跨 seed 变化 ±2 gen）， 支持将 distinct_3 放入 supplementary
    的决定。

    '
- name: C4 cross-domain validation
  plan_id: plan_004
  description: 'C4 数据集 × Pythia-410M × α=0.50 × 3 seeds × 10 gen，验证 canary ranking
    和 lead-lag 结构是否跨域转移。

    '
  expected_results:
    c4_ece_distinct1_lag_mean: -0.33
    c4_ece_distinct1_lag_std: 0.58
    c4_ece_distinct1_r_mean: 0.72
    c4_ece_distinct1_p_significant_seeds: 1
    c4_entropy_distinct1_lag_mean: -0.67
    c4_entropy_distinct1_p_significant_seeds: 1
    c4_ece_perplexity_p_significant_seeds: 0
    c4_gen10_perplexity: 62.8
    c4_gen10_distinct1: 0.085
    c4_gen10_entropy: 2.62
    c4_gen10_ece: 0.088
    c4_canary_ranking_preserved: false
    c4_entropy_leads_ece: true
  result_rationale: '在 worst 档下，C4 上 canary ranking 不保持。原因：C4 是 web-crawled 数据， 分布比
    WikiText-103 (Wikipedia) 更 heterogeneous。Pythia-410M 在 C4 subsets 上的 合成训练中，模型不会像在
    WikiText 上那样快速收敛到窄 mode——C4 的多样性提供了 natural regularization，使 diversity collapse
    更慢。ECE 在 C4 上变化更小是因为 模型 calibration 在 diverse 数据上退化更慢（模型在不同 domain 间分散注意力， 不会过度自信于某一
    domain）。而 token_entropy 可能反而变化更明显（因为 C4 的 long-tail token distribution 比 Wikipedia
    更脆弱——合成训练会更快剪掉 rare domain 的 tokens）。这导致 canary ranking 反转：WikiText 上 ECE 是更好的
    canary， C4 上 entropy 更敏感。更根本地，α=0.50 下 C4 的退化幅度太小（gen10 perplexity 仅从 ~30 升至 ~63，distinct_1
    仅下降 ~15%），cross-correlation 在这么 gentle 的 曲线上几乎没有 statistical power 检测 lead-lag。

    '
  tables:
  - name: 'Table 5: WikiText vs C4 canary behavior comparison (α=0.50)'
    description: '行: metric pair，列: WikiText (lag, r, sig seeds) vs C4 (lag, r, sig
      seeds)。 标注 ranking 反转（ECE vs entropy 哪个 lead 更大）。

      '
  figures_description:
  - 'Fig 5: 双列对比 (WikiText 左, C4 右)。上行: normalized 轨迹；下行: cross-correlogram。展示 C4
    上信号更弱、ranking 不同。'
  analysis: 'Cross-domain validation 在 worst 档下给出 partial negative result：canary→diversity
    的存在性跨域保持（entropy 仍 lead distinct_1），但 canary 的 ranking 和 lead time 不保持。这意味着 paper
    不能 claim ''ECE is the best canary''——最佳 canary 是 domain-dependent。叙事上可以 reframe
    为 ''the canary phenomenon is real but the optimal canary instrument is data-dependent''，这实际上
    strengthens the ''collapse taxonomy'' 论文——不同 data distribution 上 collapse 的 geometry
    不同。但这也意味着 不能给 practitioners 一个简单的 ''use ECE as your canary'' 建议。

    '
- name: Pythia-1.4B scale spot-check
  plan_id: plan_005
  description: 'Pythia-1.4B × α=0.50 × 3 seeds × 10 gen，验证 canary lead 是否跨规模保持。

    '
  expected_results:
    scale_ece_distinct1_lag_mean: -0.33
    scale_ece_distinct1_lag_std: 0.58
    scale_ece_distinct1_r_mean: 0.76
    scale_ece_distinct1_p_significant_seeds: 1
    scale_entropy_distinct1_lag_mean: -0.33
    scale_entropy_distinct1_p_significant_seeds: 1
    scale_gen10_perplexity: 55.2
    scale_gen10_distinct1: 0.087
    scale_gen10_entropy: 2.71
    scale_gen10_ece: 0.075
    scale_collapse_rate_vs_410m: 0.65
    scale_canary_lead_preserved: false
  result_rationale: '在 worst 档下，1.4B 上 canary ranking 不保持。原因：更大的模型有更多参数来 ''absorb''
    合成数据的 distribution shift——1.4B 在 α=0.50 下 10 代内不会产生 足够强的 collapse signal 来检测 lead-lag。gen10
    perplexity 仅从 ~22 升至 ~55 (×2.5 而非 410M 的 ×2.9)，distinct_1 下降仅 ~13%。这比 410M 的退化更温和，
    cross-correlation 的 statistical power 更低。此外，1.4B 的 capacity 使得 ECE 变化极小（模型 well-calibrated
    的时间更长），而 entropy 变化也更缓慢——两个 canary 的 lead 都缩短到 <1 gen 且不显著。本质上，α=0.50 × 10 gen
    对 1.4B 来说 exposure 不足——可能需要 α=0.75 或 20+ gen 才能看到可靠的 lead-lag。 但我们 budget 只够 spot-check
    一个条件，选了 α=0.50 后无法补充。

    '
  tables:
  - name: 'Table 6: Scale comparison (410M vs 1.4B, α=0.50)'
    description: '行: metric pair，列: 410M (lag, r, sig seeds) vs 1.4B (lag, r, sig
      seeds)。 最后一行: collapse rate ratio (1.4B/410M)。

      '
  figures_description:
  - 'Fig 6: 双列对比 (410M 左, 1.4B 右)。Normalized 轨迹展示 1.4B 的 collapse 更慢更温和，canary onset
    更晚。注释标注 ''1.4B at gen 10 ≈ 410M at gen 6-7 in collapse severity''。'
  analysis: 'Scale check 在 worst 档下给出 negative result：canary lead 不跨规模保持 （在 α=0.50
    × 10 gen 的实验窗口内）。但这不一定意味着 canary 在大模型上失效—— 可能只是 exposure 不足。Limitation section
    需要诚实讨论：我们无法区分 ''canary lead disappears at scale'' 和 ''canary lead exists but our
    experiment window is too short to detect it at scale''。建议在 paper 中标注为 inconclusive
    而非 negative， 并指出 scaling trend（collapse rate 与 model size 的关系）本身是 useful data
    point for the collapse taxonomy。如果 worst 档成真，这个实验主要贡献是 calibrating expectations
    for practitioners：410M-level results 不能直接 extrapolate to larger models。

    '

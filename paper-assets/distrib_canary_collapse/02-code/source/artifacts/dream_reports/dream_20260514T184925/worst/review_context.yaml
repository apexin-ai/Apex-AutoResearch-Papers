narrative_guidance: 'Reframe 为 ''Taxonomy of Collapse Decoupling''——核心贡献变为证明 diversity
  collapse 和 quality collapse 是 fundamentally independent failure modes with distinct
  dynamics，canary 仅 track diversity channel。 Phase diagram 变为 ''decoupling diagram''——没有清晰的
  α* 边界，而是在所有 regime 下 perplexity 和 diversity 走独立通道。方法论贡献转为 systematic negative result：naive
  correlation 与 Toda-Yamamoto 给出相同结论 （正面解读：practitioners 不需要复杂统计工具）。叙事锚点从 ''early
  warning system'' 转为 ''understanding collapse geometry''——canary→diversity lead 存在但
  fragile（seed/α-dependent）， canary→perplexity decoupling 是 robust finding。仍冲 AAAI，强调
  surprising negative results + collapse taxonomy 的理论价值，但需要补充 analytical argument
  for why decoupling occurs （可能基于 information-theoretic 或 spectral 论证）。

  '
imagined_experiments:
- name: α-sweep predictability phase diagram
  plan_id: plan_001
  description: 'α∈{0.25, 0.50, 0.75} × Pythia-410M × WikiText-103 × 10 gen × 3 seeds，
    测试 canary→diversity 和 canary→perplexity 的 lead-lag 在不同 contamination regime 下的表现。

    '
  expected_results:
    alpha_025_ece_distinct1_lag_mean: -0.67
    alpha_025_ece_distinct1_lag_std: 0.58
    alpha_025_ece_distinct1_r_mean: 0.78

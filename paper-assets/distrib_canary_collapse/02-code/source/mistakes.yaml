- id: M049
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: Pythia-1.4B α=0.50 registered with non-standard pair config (→perplexity)
    giving PermG=0/8; canonical 8-pair gives 3/8
  root_cause: Two parallel analysis directories (scale/ and scale_check/) used different
    pair configurations. The TY bugfix worker created scale/14b_a050_s42_fp32/ with
    non-standard pairs (metrics→perplexity instead of canary→diversity). This non-standard
    result (0/8) was registered and propagated to Paper Agent, who wrote "PermG=0/8
    at 1.4B → onset right-shifts with scale" into the paper.
  prevention: 1. All analysis outputs must use canonical 8-pair configuration (canary×diversity).
    Non-standard pair configs must be explicitly labeled and never registered as primary
    results. 2. When multiple analysis directories exist for the same experiment,
    verify pair configuration matches canonical before registering. 3. Cross-check
    new results against dose_response CSV (which uses canonical pairs) before writing
    into paper.
  status: active
  context: 'Canonical pairs: {token_entropy, ece} × {distinct_1, distinct_2, distinct_3,
    mauve}. Non-standard pairs in scale/14b: various metrics → perplexity. Correct
    PermG FDR from canonical analysis: 3/8 (ece→distinct_1/2/3 all significant at
    p_fdr=0.043). Paper Agent wrote 0/8 into §4.4, §4.2, §5 — urgent correction dispatched.'
  fix: Registry update dispatched to Agent. Paper Agent urgent correction dispatched
    (0/8 → 3/8, remove α_c right-shift claim, reframe as canary metric sensitivity
    axis).
- id: M050
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: TY Granger canonical script tests reverse direction (downstream→canary)
    while labeling it as forward
  root_cause: In run_5method_analysis_d102.py, test_causality(causing=1, caused=0)
    tests downstream→canary (reverse), but the output is labeled as forward. The variable
    ordering in the VAR model makes index 0=canary and index 1=downstream, so causing=1
    means downstream causes canary.
  prevention: 1. Always verify causality direction by running a known asymmetric test
    case (e.g., canary that clearly leads) and checking which direction yields significant
    results. 2. Add unit test with synthetic data where causal direction is known.
    3. Label outputs with actual variable names, not just forward/reverse.
  status: active
  context: 'Impact: All TY forward columns in all experiments are actually reverse.
    T=20 α=0.60 K≥3 drops from 3/8 to 1/8 (TY was decisive for 2 pairs: ece→distinct_2
    and ece→distinct_3). Other T=20 experiments unaffected (TY not decisive). PermG
    completely independent. Must fix and re-run before submission.'
  fix: Fix causing/caused parameter ordering in canonical script and re-run all analyses.
    Paper Agent instructed to remove/caveat TY-specific claims until fix verified.

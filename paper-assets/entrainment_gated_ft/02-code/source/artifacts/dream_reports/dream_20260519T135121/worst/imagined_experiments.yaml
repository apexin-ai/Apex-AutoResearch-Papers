    across architectures, which means the divergent per-example outcomes must arise
    from the INTERACTION between attention and the different recurrence mechanisms,
    not from attention alone. This is plausible but untestable within our experimental
    scope — we''d need to ablate the recurrence mechanism while holding attention
    fixed, which requires retraining. For the reframed paper, this section becomes:
    "attention patterns alone do not explain architecture-specific effects, suggesting
    the mechanism operates through attention-recurrence interaction" — a honest null
    result that points to future work. The figures can still appear in the paper as
    evidence of thoroughness.

    '

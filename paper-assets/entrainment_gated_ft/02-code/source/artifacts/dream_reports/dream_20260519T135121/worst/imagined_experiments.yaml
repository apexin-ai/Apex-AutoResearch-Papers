  analysis: 'This is the experiment that forces the reframe. The convergence finding
    does not survive the most basic robustness check — removing one of three architectures.
    A reviewer who asks "is this just GDN being weird?" can point to this table and
    say yes. The Bonferroni correction is also damaging: even LAMBADA barely survives
    at 0.048, and a strict reviewer would reject it. The paper must be transparent
    about this. In the reframed narrative, this analysis appears in Section 4 as:
    "We initially observed strong aggregate convergence, but robustness analysis reveals
    this is substantially driven by a single architecture (GDN). We therefore focus
    on the more robust finding: per-example divergence, which persists regardless
    of GDN''s inclusion." This honesty actually strengthens the paper — it shows rigorous
    self-evaluation.


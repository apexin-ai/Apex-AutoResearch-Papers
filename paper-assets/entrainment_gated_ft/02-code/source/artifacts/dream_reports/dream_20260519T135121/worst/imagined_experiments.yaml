tier: worst
narrative_guidance: 'Abandon convergence as headline. Reframe paper around the robust
  finding that survives all checks: per-example divergence (Jaccard <0.10) is architecture-intrinsic
  and persists regardless of aggregate convergence trends. New title direction: ''Aggregate
  Metrics Hide Architecture-Specific Behavior in Hybrid Language Models.'' Lead claim
  becomes: hybrid architectures that look identical on benchmarks are solving fundamentally
  different subsets of examples — standard evaluation is blind to this. Convergence
  (when it exists) is demoted to a secondary observation. Practical implication reframed:
  architecture selection matters even when leaderboard scores converge, because failure
  modes don''t overlap → ensemble/routing potential. Trade-off: weaker theoretical
  story, but more defensible claims.

  '
imagined_experiments:
- name: Multi-benchmark per-example analysis (task-specificity validation)
  plan_id: exp-002
  description: 'Re-run lm-eval with --log_samples on 1.3B models for HellaSwag, ARC-Easy,
    ARC-Challenge. Collect per-example correctness vectors across architectures and
    attention ratios. Compute pairwise Jaccard on helped/hurt sets; test whether per-example
    convergence is absent on non-LAMBADA benchmarks.

    '
  expected_results:
    hellaswag_jaccard_mean: 0.08
    hellaswag_jaccard_std: 0.03
    arc_easy_jaccard_mean: 0.11
    arc_challenge_jaccard_mean: 0.13
    hellaswag_per_example_convergence_rho: -0.15
    hellaswag_per_example_convergence_p: 0.62
    arc_easy_per_example_convergence_rho: -0.4
    arc_easy_per_example_convergence_p: 0.35
    winogrande_per_example_convergence_rho: -0.2
    winogrande_per_example_convergence_p: 0.55
    n_benchmarks_with_per_example_convergence: 0
    arc_easy_aggregate_convergence_suggestive: true
    arc_easy_per_example_mechanism_matches_lambada: false
  result_rationale: 'In the worst tier, per-example analysis on HellaSwag and WinoGrande
    reveals NO convergence signal at sample level either — confirming task-specificity
    holds. However, ARC-Easy shows a weak but non-trivial per-example signal (rho=-0.40,
    p=0.35) that partially mirrors LAMBADA''s pattern, threatening the clean "retrieval-specific"
    story. The effect is too weak to be significant but too present to ignore, collapsing
    the task-specificity claim into a muddier "convergence is generic but weak everywhere
    except LAMBADA where GDN amplifies it" narrative. Jaccard values on HellaSwag
    (~0.08) confirm per-example divergence generalizes across benchmarks — this is
    the one robust finding. ARC tasks show slightly higher Jaccard (0.11-0.13), suggesting
    reasoning tasks have marginally more overlap in architecture behavior but still
    fundamentally low. The critical implication: convergence is NOT cleanly retrieval-specific
    (undermining Claim 1''s dose-response framing), but per-example divergence IS
    universal (supporting the reframed narrative).

    '

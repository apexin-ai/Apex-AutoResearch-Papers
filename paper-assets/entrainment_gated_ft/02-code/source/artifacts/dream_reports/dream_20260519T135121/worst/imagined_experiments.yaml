  analysis: 'The paradox framing survives only as a visual observation when GDN is
    included, not as a statistically supported co-evolution. In the reframed paper,
    this becomes the key Figure 1: "Per-example divergence is architecture-intrinsic
    and attention-invariant." The flat Jaccard line is actually the strongest visual
    argument for the reframed paper — it shows that no amount of attention makes architectures
    agree on which examples to solve. This is more powerful than a co-evolution story
    because it''s simpler and more robust. The "paradox" terminology should be softened
    to "disconnect" or "dissociation" — aggregate metrics move while per-example identity
    doesn''t. The Sankey diagram showing stable sample fates across attention ratios
    could be a compelling supplementary figure.'

- name: Helped/hurt sample characterization — Phase 2 (perplexity + topic)
  plan_id: exp-003
  description: 'Extend Phase 1 surface feature analysis with deeper features: (a)
    perplexity of target token under pure recurrent baseline (no attention), (b) topic/domain
    classification of LAMBADA contexts using a lightweight classifier or embedding
    clustering. Test whether these features differentiate helped vs hurt samples within
    and across architectures.

    '
  expected_results:
    perplexity_gdn_helped_vs_hurt_p: 0.18
    perplexity_hgrn2_helped_vs_hurt_p: 0.09
    perplexity_retnet_helped_vs_hurt_p: 0.31
    perplexity_cross_arch_interaction_p: 0.42
    topic_gdn_chi2_p: 0.35
    topic_hgrn2_chi2_p: 0.22
    topic_retnet_chi2_p: 0.47
    topic_cross_arch_difference_p: 0.61
    any_feature_significant_p_lt_01: false
    n_features_marginal_p_lt_05: 1
    best_single_feature_auc: 0.54
  result_rationale: 'In the worst tier, ALL Phase 2 features are non-significant.
    Perplexity under baseline shows a marginal trend for HGRN2 (p=0.09) — helped samples
    tend to have slightly higher baseline perplexity, suggesting attention helps on
    "harder" items — but the effect doesn''t replicate across GDN (p=0.18) or RetNet
    (p=0.31), and the cross-architecture interaction is nowhere near significant (p=0.42).
    Topic/domain analysis reveals no systematic pattern at all (all p>0.2). The best
    single-feature AUC for predicting helped/hurt is 0.54, barely above chance. This
    means we have ZERO mechanistic toehold: we cannot explain what makes a sample
    helped vs hurt by any measurable property. The architecture-specific effect is
    real (Jaccard proves it) but opaque. This is the worst case for Concern C — no
    causal mechanism is articulable. The reframe must embrace this opacity: "the effect
    is detectable but not yet explainable, which itself is a finding about the limits
    of current interpretability."

    '

  - Violin plots of baseline perplexity for helped vs hurt samples, split by architecture.
    Distributions almost entirely overlapping. HGRN2 shows a slight rightward shift
    for helped samples but the overlap is >90%.
  - ROC curves for combined feature model per architecture. All curves hug the diagonal,
    with AUCs in [0.52, 0.55]. Visual confirmation that no accessible feature set
    predicts helped/hurt status.
  analysis: 'Complete mechanistic failure. Six features tested across two phases,
    none reaches significance with cross-architecture consistency. The HGRN2 perplexity
    trend (p=0.09) is tantalizing but unreliable — it doesn''t survive multiple comparison
    correction and doesn''t generalize to the other architectures. The combined model
    AUC of 0.53-0.55 means that even throwing all features together, we predict helped/hurt
    status barely better than a coin flip. This is simultaneously the worst and most
    interesting outcome: the architecture-specific effect is NOT driven by any obvious
    data property. For the reframed paper, this becomes: "standard sample features
    cannot explain which examples each architecture handles differently, suggesting
    the divergence operates at a representational level not captured by surface or
    moderate-depth features."

    '
- name: Attention weight extraction and visualization
  plan_id: exp-004
  description: 'Extract attention weight matrices from h3-1 hybrid models for all
    3 architectures on LAMBADA samples. Analyze: position-level attention entropy,
    correlation between attention focus and helped/hurt identity, cross-architecture
    attention pattern similarity (CKA or cosine).

    '
  expected_results:
    attention_entropy_helped_vs_hurt_correlation_gdn: 0.07
    attention_entropy_helped_vs_hurt_correlation_hgrn2: 0.12
    attention_entropy_helped_vs_hurt_correlation_retnet: 0.04
    cross_arch_attention_cka_gdn_retnet: 0.31
    cross_arch_attention_cka_gdn_hgrn2: 0.28
    cross_arch_attention_cka_retnet_hgrn2: 0.35
    attention_focus_position_correlation_with_effect: 0.09
    attention_pattern_predicts_helped_auc: 0.56
    interpretable_pattern_found: false
  result_rationale: 'In the worst tier, attention patterns show low correlation with
    helped/hurt identity (r<0.15 for all architectures). Attention entropy — a measure
    of how focused vs diffuse the attention is — differs only trivially between helped
    and hurt samples. Cross-architecture CKA similarity is moderate (~0.30), meaning
    attention layers are doing somewhat similar things structurally across architectures,
    but this structural similarity does NOT predict the divergent per-example outcomes.
    The attention pattern AUC for predicting helped/hurt (0.56) is only marginally
    better than the feature-based model and far from interpretable. No clear "smoking
    gun" pattern emerges (e.g., no finding like "GDN attends to nearby context while
    RetNet attends to distant context on helped samples"). This makes Concern C (no
    causal mechanism) essentially unanswerable within the scope of this paper. The
    attention layer is doing something architecture-specific, but what it''s doing
    doesn''t cleanly map onto which examples benefit.

    '

  - Heatmap of Jaccard similarity across all benchmark × architecture pairs. Uniformly
    cold (blue) across all benchmarks, demonstrating that per-example divergence is
    benchmark-agnostic. LAMBADA and HellaSwag nearly identical in Jaccard despite
    opposite aggregate convergence trends.
  - 'Scatter: aggregate convergence ρ vs per-example convergence ρ per benchmark.
    No clean linear relationship; ARC-Easy is an outlier with moderate per-example
    signal despite aggregate suggestiveness, breaking the expected dose-response pattern.'
  analysis: 'The ARC-Easy per-example signal (ρ=-0.40) is the worst-case complication.
    It''s not significant (p=0.35) but it''s not zero either. A reviewer can argue:
    "convergence exists weakly everywhere, LAMBADA just happens to cross significance
    because GDN''s anomalous behavior inflates the signal." This undermines the retrieval-specificity
    framing. However, the universal low Jaccard (all <0.15) is the paper''s salvation
    — it doesn''t depend on convergence at all. The reframe: "regardless of whether
    architectures converge in aggregate, they solve different examples" is supported
    by every benchmark. Dose-response narrative for convergence strength is dead;
    replace with: "per-example divergence is the invariant, convergence is the variable."


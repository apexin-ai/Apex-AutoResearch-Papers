- name: 340M rebound mechanism analysis
  plan_id: exp-007
  description: 'Deep analysis of 340M non-monotonic rebound at attn=8. Per-example
    comparison with 1.3B at same attention ratio. Attempt to disentangle scale (340M
    vs 1.3B) from training tokens (20B vs 100B) as explanatory variables for the rebound.

    '
  expected_results:
    rebound_explained: false
    scale_vs_tokens_disentangleable: false
    per_example_overlap_340m_1_3b_jaccard: 0.12
    rebound_samples_characterizable: false
    rebound_unique_to_gdn: true
    retnet_hgrn2_340m_trajectory: flat
    training_tokens_340m: 20B
    training_tokens_1_3b: 100B
    tokens_per_param_340m: 58.8
    tokens_per_param_1_3b: 76.9
  result_rationale: 'In the worst tier, the 340M rebound is unexplained and unexplainable
    with available data. The fundamental confound is that 340M models were trained
    on 20B tokens while 1.3B models saw 100B tokens — a 5x difference. Tokens-per-parameter
    ratio also differs (58.8 vs 76.9), meaning 340M models are relatively undertrained.
    The rebound at high attention ratios could be: (a) insufficient capacity at 340M
    to benefit from many attention layers, (b) undertrained attention layers at 340M
    due to fewer tokens, (c) a genuine scale threshold effect. These hypotheses are
    indistinguishable without training 340M models on 100B tokens or 1.3B models on
    20B tokens, neither of which is feasible. Per-example comparison shows low overlap
    between 340M and 1.3B rebound samples (Jaccard 0.12), and the rebound is most
    pronounced for GDN, again raising the GDN-specific confound. RetNet and HGRN2
    at 340M show essentially flat trajectories with no clear rebound, making the "rebound"
    primarily a GDN phenomenon. The scale story collapses into: "we observe a difference
    between 340M and 1.3B but cannot attribute it to scale, training compute, or their
    interaction."

    '

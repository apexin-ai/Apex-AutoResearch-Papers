  figures_description:
  - Cross-architecture std vs attention ratio, 340M and 1.3B overlaid. 1.3B shows
    clean monotonic decrease. 340M shows flat-to-noisy trajectory. GDN-specific rebound
    visible at h=8 for 340M but not for other architectures. Annotation marks the
    training token confound.
  - Venn-style diagram of rebound samples at 340M (h=8 vs h=3) compared to 1.3B divergence
    samples. Overlap is minimal (Jaccard 0.12), suggesting different mechanisms at
    different scales.
  analysis: 'Claim 2 (scale-dependent convergence) is effectively dead as a standalone
    claim. The binary contrast is real — 340M doesn''t converge, 1.3B does — but the
    attribution is hopelessly confounded. With the worst tier reframe, this becomes
    a reported observation rather than a claim: "convergence was observed at 1.3B
    but not at 340M; however, these scales differ in both parameter count and training
    compute, preventing causal attribution." In the reframed paper focused on per-example
    divergence, scale becomes a secondary observation in a limitations paragraph rather
    than a headline claim. The GDN-specificity of the rebound further erodes confidence
    that it reflects a general scale phenomenon.

    '
- name: Statistical robustness framework
  plan_id: exp-008
  description: 'Bootstrap CIs for convergence metrics. Multi-comparison correction.
    Sensitivity analysis with GDN excluded. Effect sizes.

    '

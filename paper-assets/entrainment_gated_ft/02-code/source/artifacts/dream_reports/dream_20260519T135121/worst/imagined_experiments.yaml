  result_rationale: 'This is the core worst-tier finding. When GDN is excluded, the
    79% std reduction collapses to 18% — and the bootstrap 95% CI crosses zero ([-0.08,
    0.41]). The RetNet-HGRN2 pair alone shows a flat-to-slightly-decreasing std trajectory
    that is non-monotonic (slight increase at h=12 before decreasing again at h=24).
    The Spearman ρ drops from -1.0 to -0.60 (p=0.285), losing significance entirely.
    This means the convergence finding is substantially driven by GDN''s anomalous
    behavior — either the D004 confound or a GDN-specific architectural artifact.
    Bonferroni correction across 6 benchmarks kills even LAMBADA''s significance (0.048
    × 6 = 0.288). FDR correction yields zero significant benchmarks. The convergence
    claim, as originally stated, does not survive robustness checks. Cohen''s d drops
    from 1.82 (large, with GDN) to 0.34 (small, without GDN), confirming the effect
    is GDN-driven. The paper CANNOT lead with convergence. The reframe to per-example
    divergence is not optional — it''s necessary.


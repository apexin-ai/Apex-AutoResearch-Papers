- name: Convergence-divergence bridge analysis
  plan_id: exp-010
  description: 'Plot aggregate convergence alongside per-example divergence metrics
    (Jaccard, net effect asymmetry) as function of attention ratio for LAMBADA. Test
    whether convergence and divergence co-evolve.

    '
  expected_results:
    convergence_divergence_correlation_rho: -0.3
    convergence_divergence_correlation_p: 0.45
    jaccard_trend_with_attention: stable
    jaccard_at_h0: null
    jaccard_at_h3: 0.08
    jaccard_at_h6: 0.07
    jaccard_at_h12: 0.09
    jaccard_at_h24: 0.07
    net_effect_asymmetry_stable: true
    paradox_visualization_compelling: moderate
    co_evolution_significant: false
  result_rationale: 'In the worst tier, the convergence-divergence "co-evolution"
    is not significant because the convergence side is broken (GDN-driven). Jaccard
    remains stable across attention ratios (~0.07-0.09), meaning per-example divergence
    is always present regardless of how much attention is added. This is actually
    consistent with the reframed narrative but kills the "paradox" framing: there''s
    no co-evolution because divergence is a constant, not a function of attention
    ratio. The correlation between aggregate convergence (which is noisy without GDN)
    and per-example Jaccard is weak (ρ=-0.30, p=0.45). The "paradox" becomes less
    of a paradox and more of a simple observation: architectures always solve different
    examples (Jaccard ~0.08 is intrinsic), and sometimes their aggregate scores happen
    to converge (when GDN is included). The visualization can still be striking —
    showing flat Jaccard against a converging (or not) std line — but the causal "more
    attention = more paradox" story doesn''t hold.

    '

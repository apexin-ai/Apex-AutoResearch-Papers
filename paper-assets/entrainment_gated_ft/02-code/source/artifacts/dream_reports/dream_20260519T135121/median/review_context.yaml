    - - HGRN2–RetNet
      - 0.36
      - 0.32
      - 0.39
    notes: Similarity computed on attention weight vectors averaged over heads and
      layers. Low similarity consistent with architecture-specific attention usage.
  figures_description:
  - 'Fig: Attention heatmap triptych — same 3 LAMBADA examples shown across GDN/HGRN2/RetNet
    h3-1. Columns = architectures, rows = examples (one helped-by-all, one helped-by-HGRN2-only,
    one hurt-by-all). Visually distinct attention patterns across architectures on
    the same input; HGRN2 shows tighter focus on local context near target.'
  - 'Fig: Scatter plot of attention concentration (entropy) vs helped/hurt magnitude
    per sample, one panel per architecture. Weak negative trend visible (more concentrated
    attention → more helped) but wide scatter. Annotated with r values.'
  - 'Fig: Cross-architecture attention similarity distribution — histogram of per-sample
    cosine similarities for each arch pair. Centered around 0.3–0.4, confirming architectures
    use attention differently even on identical inputs.'
  analysis: 'exp-004 的 median 结果产出两类价值：(1) 定性 illustration 素材（attention heatmap triptych
    将成为论文最直观的 figure，直接展示 "same input, different attention patterns" 的 paradox）， (2)
    进一步的 negative quantitative evidence 强化 "opaque mechanism" 叙事。 关键措辞：attention pattern
    与 helped/hurt 有 "detectable but weak association" (r≈0.22)， 说明 attention 的作用不完全随机，但远不足以
    predict 或 explain 哪些样本被帮助/伤害。 这与 Phase 2 perplexity 的 marginal signal 形成呼应——mechanism
    有线索但不可解。 审稿人 Concern C ("No causal mechanism") 的回应变为："We provide three levels
    of mechanistic evidence — all suggestive, none conclusive — establishing the phenomenon''s
    depth."

    '
- name: Architecture expansion check
  plan_id: exp-005
  description: '搜索 Wang et al. model zoo 及公开 repos (HuggingFace, GitHub) 寻找额外的 hybrid
    架构 (Mamba/Mamba2 hybrid, RWKV hybrid, Griffin, etc.)。如果找到，在 LAMBADA 上评估收敛模式。

    '
  expected_results:
    additional_architectures_found: 0
    mamba_hybrid_status: no Wang et al. equivalent; community checkpoints exist but
      different training setup (not comparable)
    rwkv_hybrid_status: RWKV-6 hybrid mentioned in literature but no public 1.3B checkpoint
      with matched attention ratios
    griffin_status: Google proprietary, no public weights
    search_exhaustive: true
    n_architectures_final: 3
    mitigation_framing: 3 architectures represent 3 distinct recurrence mechanisms
      (gated delta rule, linear attention + exp decay, hierarchical gated recurrence);
      acknowledged as limitation
  result_rationale: 'median 档假设找不到额外可比架构。Wang et al. 的 model zoo 是目前最全面的 hybrid 架构实验——
    他们选择 GDN/RetNet/HGRN2 正是因为这三个有公开实现且代表了三大类 recurrence 机制。 Mamba hybrid (Jamba)
    由 AI21 发布但训练 setup 完全不同（不同数据、不同 tokenizer、不同规模点）， 不能直接加入 controlled comparison。RWKV
    hybrid 讨论较多但标准化的 attention ratio sweep checkpoint 不存在。Griffin 是 Google 的 proprietary
    architecture。 n=3 在 median 档下必须诚实承认为 limitation，但论文可以辩护：per-example analysis 提供了
    上千个 data points，三个架构覆盖了三种根本不同的 recurrence 机制，且 convergence 效应在 所有三个上都观测到——这不是
    "cherry-picked 一个能 work 的架构"。

    '
  tables: []
  figures_description: []
  analysis: 'exp-005 的 null result 对论文的影响是 Limitations 段必须明确写 "n=3 architectures"
    并 呼吁社区建立更大的 standardized hybrid model zoo。这是审稿人 Concern D 的直接回应。 在 median 档下，审稿人可能把这作为
    "not Main, push to Findings" 的理由之一， 但不太可能因此 reject——因为 per-example analysis 的
    novelty 不依赖架构数量。

    '
- name: 340M rebound mechanism analysis
  plan_id: exp-007
  description: '深入分析 340M 在 attn=8 处的非单调 rebound。与 1.3B 同 attention ratio 进行 per-example
    比较， 识别 diverging samples。分析 training token count (20B vs 100B) 作为 confound。

    '
  expected_results:
    rebound_samples_overlap_with_hardest_pct: 62
    rebound_samples_overlap_with_hardest_ci95:
    - 48
    - 74
    hardest_definition: bottom 20% accuracy under 340M h0 baseline
    rebound_at_1_3b_same_ratio: no rebound (monotonic convergence continues)
    scale_delta_explanation_pct: 45
    scale_delta_explanation: 340M rebound partially explained by capacity saturation
      on hard samples
    training_token_confound_disentangled: false
    training_token_analysis: 340M trained on 20B tokens, 1.3B on 100B tokens; rebound
      samples have higher perplexity under both scales but magnitude differs; cannot
      separate scale vs data effects
    confound_correlation_with_rebound: 0.31
    mechanism_confidence: partial — capacity explanation plausible but token confound
      unresolved
    gpu_hours_used: 1.5
  result_rationale: 'median 档预测 rebound 被 "部分解释"。340M 在高 attention ratio 处的 rebound
    (std 回升) 与 最困难样本高度重叠 (62%)：这些样本需要模型同时执行 retrieval 和 integration，当 attention layers
    占据了过多容量 (8/12 layers) 时，340M 的有限参数无法同时维持 recurrence quality 和 attention quality，
    产生 capacity saturation。1.3B 有足够参数避免这个瓶颈。 但 training tokens 的 5x 差异 (20B vs 100B)
    是无法完全 disentangle 的 confound： 更多的训练数据可能让 1.3B 学到了更好的 attention-recurrence 协调模式，而不仅仅是
    scale 带来的 capacity 优势。相关性分析 (r=0.31) 表明两种因素都在起作用但无法分离。 论文必须在 Claim 2 中增加 explicit
    limitation paragraph 说明这个 confound。

    '

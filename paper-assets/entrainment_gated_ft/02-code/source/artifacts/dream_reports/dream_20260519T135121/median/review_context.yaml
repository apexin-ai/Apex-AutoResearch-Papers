narrative_guidance: 'Soften Claim 1 scope: ''retrieval-gated equalizer effect'' centered
  on LAMBADA with ARC-E as supporting evidence. Dose-response framing still works
  but is acknowledged as preliminary (low-n benchmarks). Claim 3 shifts wording to
  ''architecture-specific effect whose mechanism is opaque to standard and intermediate
  features'' — negative characterization results reported as informative (rules out
  trivial explanations), not as failure. Claim 2 stays as binary contrast but adds
  explicit limitation paragraph about training token confound. Attention visualization
  goes in as qualitative illustration, not quantitative evidence. Paper positions
  itself as ''first to quantify and decompose the equalizer phenomenon'' — phenomenon
  discovery paper, not mechanism paper. Target EMNLP Findings; reviewers who value
  careful empirical work may push to Main.

  '
imagined_experiments:
- name: Multi-benchmark per-example analysis (task-specificity validation)
  plan_id: exp-002
  description: 'Re-run lm-eval with --log_samples on 1.3B models (GDN, RetNet, HGRN2
    at h0/h3-1/h6-1/h12-1/h24-1) for HellaSwag, ARC-Easy, ARC-Challenge. Also collect
    340M RetNet+HGRN2 (10 models) and 1.3B GDN h3-1/h6-1/h24-1 missing configs. Compute
    per-example helped/hurt sets, pairwise Jaccard, and per-example convergence metrics
    analogous to LAMBADA analysis.

    '
  expected_results:
    hellaswag_per_example_convergence: false
    hellaswag_jaccard_cross_arch_mean: 0.18
    hellaswag_jaccard_interpretation: near-random overlap, no systematic pattern
    hellaswag_helped_hurt_net_direction: inconsistent across architectures and attention
      ratios
    arc_easy_per_example_convergence: noisy/suggestive
    arc_easy_jaccard_cross_arch_mean: 0.12
    arc_easy_std_reduction_pct: 38
    arc_easy_std_reduction_p: 0.14
    arc_easy_helped_hurt_asymmetry: present but unstable across attention ratios
    arc_challenge_per_example_convergence: false
    arc_challenge_jaccard_cross_arch_mean: 0.15
    arc_challenge_std_reduction_pct: 12
    dose_response_rho_6benchmarks: -0.66
    dose_response_rho_p: 0.16
    n_benchmarks_per_example_confirmed_converging: 1
    n_benchmarks_suggestive: 1
    n_benchmarks_confirmed_non_converging: 4
    gpu_hours_used: 18
  result_rationale: '在 median 档下，equalizer effect 本质上是 retrieval-gated 的。LAMBADA 是纯粹的
    last-word retrieval 任务， attention 机制对此类任务有直接的结构性优势（回看上下文定位 target word），因此 per-example
    收敛清晰。 ARC-Easy 包含部分 retrieval 成分（从选项中匹配已知事实），但混合了推理成分，导致 per-example 层面噪声大—— Jaccard
    结构模糊，helped/hurt 集合随 attention ratio 变化不稳定，aggregate std 降低存在但不显著。 HellaSwag 和
    ARC-Challenge 主要依赖 commonsense reasoning 和 multi-step inference，attention 的贡献
    分散在多种推理路径上而非集中在 retrieval 上，因此 per-example 分析确认了 aggregate 层面的非收敛： 不同架构被 attention
    帮助/伤害的样本几乎是随机的，无系统性结构。 这使 dose-response 本质上变成了 2-point gradient：LAMBADA 强，ARC-E
    suggestive，其余 flat。 6 个 benchmark 的 Spearman ρ≈-0.66（在 [-0.75, -0.55] 范围内）但因 n=6
    且非线性分布，p≈0.16 不显著—— 这足以支持 "retrieval demand 调节收敛强度" 的叙事，但必须承认是 preliminary observation
    而非 established relationship。

    '
  tables:

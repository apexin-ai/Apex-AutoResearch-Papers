      *WinoGrande has coreference retrieval component; acknowledged in text.
  figures_description:
  - 'Fig: Dose-response scatter plot — x-axis = retrieval demand (continuous, based
    on published task taxonomies), y-axis = convergence strength (Spearman ρ of cross-arch
    std vs attention ratio). LAMBADA clearly anchors the high-retrieval end (ρ=-1.0),
    ARC-E in the middle (ρ=-0.7), remainder clustered near zero. Fitted line shows
    negative trend but wide CI band due to n=6.'
  - 'Fig: Per-example Jaccard heatmaps for ARC-Easy (3×3 arch pairs, 5 attention ratios)
    — compared to LAMBADA equivalent. ARC-E shows no clear block structure; values
    fluctuate 0.05–0.20 without the consistent <0.10 pattern seen in LAMBADA. Visual
    contrast highlights LAMBADA''s unique structure.'
  - 'Fig: HellaSwag helped/hurt sample identity stability — scatter showing helped/hurt
    sets at h3-1 vs h12-1 for each architecture. Near-random reassignment (points
    scattered around diagonal), confirming no systematic per-example effect.'
  analysis: 'exp-002 的 median 结果确认 task-specificity 是真实的，但把 "dose-response" 的统计力量限制在了
    descriptive level。论文的关键修辞策略：不要声称 dose-response 是 "established"，而是用 "consistent
    with a retrieval-demand gradient" + "preliminary due to limited benchmark-level
    n" 的措辞。 HellaSwag per-example 确认非收敛这一点很有价值——把 aggregate p=0.742 升级为 "per-example
    confirmed non-converging"，排除了 "aggregate 不显著只是因为 power 不够" 的可能性。 ARC-E 的 noisy
    结果实际上对叙事有利：它不是 retrieval 纯任务，所以 partial/noisy convergence 正好符合 "retrieval demand
    越高收敛越强" 的 gradient story。

    '
- name: Helped/hurt sample characterization Phase 2 (perplexity + topic/domain)
  plan_id: exp-003
  description: '在 Phase 1 surface features 全部 non-significant 的基础上，Phase 2 测试更深层特征：
    (a) 各架构 pure recurrent baseline (h0) 下每个 LAMBADA 样本的 perplexity， (b) 基于 LAMBADA
    文本内容的 topic/domain 分布 (LDA 或预训练 topic model)。 检验 helped/hurt 样本是否在这些特征上可区分。

    '
  expected_results:
    perplexity_gdn_helped_vs_hurt_p: 0.031
    perplexity_gdn_helped_vs_hurt_cohens_d: 0.19
    perplexity_gdn_direction: hurt samples have higher baseline perplexity (harder
      under pure recurrence)
    perplexity_hgrn2_helped_vs_hurt_p: 0.22
    perplexity_hgrn2_helped_vs_hurt_cohens_d: 0.08
    perplexity_retnet_helped_vs_hurt_p: 0.09
    perplexity_retnet_helped_vs_hurt_cohens_d: 0.13
    topic_gdn_chi2_p: 0.34
    topic_hgrn2_chi2_p: 0.51
    topic_retnet_chi2_p: 0.28
    cross_arch_perplexity_interaction_p: 0.07
    n_features_significant_any_arch: 1
    n_features_significant_cross_arch: 0
    overall_mechanism_status: opaque to tested features; perplexity suggestive for
      GDN only
  result_rationale: 'median 档的核心假设是 mechanism 保持 opaque。Phase 2 的 perplexity 特征比 surface
    features 更有信息量， 因为它直接衡量 "pure recurrence 下的困难度"——直觉上，attention 最可能帮助那些 recurrence
    本身处理不好的样本。 但这个直觉只在一个架构 (GDN) 上得到 marginal 验证 (p=0.031, d=0.19)：GDN 的 gated delta
    rule 机制 在高 perplexity 样本上可能有特定的弱点（例如需要精确的长距离 copy 但 delta rule 的 memory update
    不够精确），attention 填补了这个缺口。HGRN2 和 RetNet 的 hierarchical/exponential decay 机制 处理困难样本的方式不同，perplexity
    不是它们的瓶颈维度，所以信号消失。 Topic/domain 特征完全 non-significant：attention 的效果不是 "对某些 domain
    更有用"， 而是在每个 domain 内部都有 architecture-specific 的帮助/伤害模式。 这实际上强化了 "opaque mechanism"
    的叙事——连中间层特征 (perplexity) 也只给出了微弱线索， 说明 equalizer effect 的机制深嵌在 recurrence-attention
    交互的计算层面。

    '

  figures_description:
  - 'Fig: Violin plots of baseline perplexity (h0) for helped vs hurt samples, one
    panel per architecture. GDN shows slight rightward shift for hurt samples; HGRN2
    and RetNet distributions largely overlap. Annotated with p-values and effect sizes.'
  - 'Fig: Topic distribution bar charts for helped vs hurt, per architecture. Near-identical
    distributions — visual confirmation of non-significance.'
  analysis: 'Phase 2 的 GDN perplexity signal (p=0.031) 在论文中的定位需要谨慎：它通过了 nominal 0.05
    但 未通过 preregistered 0.01，且 Bonferroni 校正后不显著。论文应报告为 "suggestive lead for future
    work"， 不作为 claimed finding。关键叙事价值在负面结果的累积：surface features (Phase 1) + perplexity
    + topic 全部失败或 marginal，系统性地排除了从简单到中等复杂度的解释，让 "mechanism is opaque" 不是一句空话 而是有实证支撑的
    negative characterization。这对 EMNLP Findings 审稿人来说是可接受的—— 他们会 appreciate careful
    negative results over overclaimed positive ones。

    '
- name: Attention weight extraction and visualization
  plan_id: exp-004
  description: '提取 3 个架构 h3-1 配置的 attention weight patterns (1.3B)。 在 LAMBADA 样本上计算：(a)
    attention 聚焦位置分布，(b) attention pattern 与 helped/hurt 身份的相关性， (c) 跨架构 attention
    pattern 相似度。

    '
  expected_results:
    gdn_attention_entropy_mean: 3.2
    hgrn2_attention_entropy_mean: 2.8
    retnet_attention_entropy_mean: 3.0
    attention_focus_on_target_context_pct_gdn: 0.42
    attention_focus_on_target_context_pct_hgrn2: 0.58
    attention_focus_on_target_context_pct_retnet: 0.47
    cross_arch_attention_cosine_similarity_mean: 0.35
    attention_pattern_correlation_with_helped_gdn: 0.18
    attention_pattern_correlation_with_helped_hgrn2: 0.27
    attention_pattern_correlation_with_helped_retnet: 0.22
    attention_pattern_correlation_mean: 0.22
    passes_preregistered_threshold: false
    qualitative_patterns_visible: true
    gpu_hours_used: 3.5
  result_rationale: 'median 档预测 attention correlation r=0.15–0.30，低于 preregistered
    r>0.3 threshold。 原因在于 attention 的作用路径是间接的：attention layer 不仅直接影响输出 logits， 还通过修改
    hidden state 影响后续 recurrent layers 的计算。因此 attention weight pattern 本身只捕获了 "attention
    在看什么" 而非 "attention 如何改变了下游计算"。 具体来说：HGRN2 的 hierarchical gating 与 attention 有最强的协同
    (r=0.27)，因为 HGRN2 的层级结构天然需要不同粒度的信息，attention 提供的全局视野与其互补性最强；GDN 的 delta rule 更新机制与
    attention 的交互更复杂 (r=0.18)，因为 delta rule 的精确 memory 操作可能 在某些层 override attention
    的影响。 定性上，attention heatmap 会显示有趣的模式：例如 HGRN2 的 attention 更集中在 sentence boundaries
    和 target-word context windows，而 GDN 的 attention 更分散——但这些差异在统计检验中被 样本间噪声淹没。论文中作为
    qualitative illustration 展示，配合 "future work: causal intervention on attention
    weights" 的讨论。

    '

    (p=0.033)  是 median 档论文中最 "clean" 的统计结果之一（仅次于 LAMBADA 的 ρ=-1.0），因为它在单个 benchmark  内利用了
    attention ratio 的 5 个梯度点，避免了跨 benchmark dose-response 的 low-n 问题。 这个 figure 同时服务于
    Claim 1 (aggregate convergence) 和 Claim 3 (per-example divergence)， 是连接两个 claims
    的 bridge evidence。 论文结构建议：在 Results 中先展示 aggregate convergence (Claim 1)，再展示 per-example
    divergence  (Claim 3)，最后用 exp-010 figure 作为 "synthesis" 展示两者的 co-evolution—— 这就是
    "equalizer paradox" 的完整呈现。

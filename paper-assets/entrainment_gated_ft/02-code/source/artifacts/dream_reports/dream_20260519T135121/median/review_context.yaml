  - 'Fig (PAPER CENTERPIECE): Dual-axis plot — left y-axis = cross-arch std (blue,
    decreasing), right y-axis = mean pairwise Jaccard of helped sets (red, decreasing),
    x-axis = attention ratio. Both lines decline together. Shaded region between them
    labeled ''Equalizer Paradox Zone''. Annotated with ρ=-0.85, p=0.033. This is the
    single figure that captures the entire paper''s core finding.'
  - 'Fig: Stacked area chart of net effects per architecture across attention ratios.
    GDN area grows downward (hurt), HGRN2 grows upward (helped), RetNet stays near

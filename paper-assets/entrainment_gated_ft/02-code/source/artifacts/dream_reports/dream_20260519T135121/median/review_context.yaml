- name: Convergence-divergence bridge analysis
  plan_id: exp-010
  description: '对 LAMBADA，将 aggregate convergence curve 与 per-example divergence metrics  (Jaccard,
    net effect asymmetry) 作为 attention ratio 的函数并列绘制， 展示 convergence 和 divergence
    共同演化——attention 越多，aggregate 越收敛但 per-example 越分化。

    '
  expected_results:
    convergence_divergence_correlation_rho: -0.85
    convergence_divergence_correlation_p: 0.033
    convergence_metric: cross-arch std of LAMBADA accuracy
    divergence_metric: mean pairwise Jaccard of helped sets (lower = more divergent)
    co_evolution_pattern: as attention ratio increases 0→24, cross-arch std decreases
      monotonically while mean Jaccard also decreases (more architecture-specific
      effects)
    jaccard_at_h0: 0.15
    jaccard_at_h3: 0.1
    jaccard_at_h6: 0.08
    jaccard_at_h12: 0.07
    jaccard_at_h24: 0.06
    std_at_h0: 0.024
    std_at_h3: 0.015
    std_at_h6: 0.01
    std_at_h12: 0.007
    std_at_h24: 0.005
    net_effect_asymmetry_gdn_trend: increasingly negative (more hurt) with attention
    net_effect_asymmetry_hgrn2_trend: increasingly positive (more helped) with attention
    net_effect_asymmetry_retnet_trend: slightly negative, relatively stable
    paradox_strength_at_max_attention: strongest — maximum aggregate convergence coexists
      with minimum per-example overlap
  result_rationale: 'convergence-divergence co-evolution 是 equalizer paradox 的核心可视化。在
    median 档下， 相关性 ρ=-0.85 (p=0.033) 是显著的——这是 n=5 attention ratios 的 rank correlation，
    比跨 benchmark 的 dose-response 有更好的 power（因为这里 both metrics 在同一 benchmark 内变化）。
    机制直觉：attention 层越多，每个架构能 "选择性优化" 的样本子集越大，但这些子集由架构内部结构 决定因此互不重叠。GDN 的 delta rule
    在高 attention 下更多地 "依赖" attention 来处理精确 retrieval， 但这牺牲了 delta rule 对某些样本的原生优势（hurt
    增加）；HGRN2 的 hierarchical gating 与 attention 更互补，所以随 attention 增加变得 increasingly
    helped。最终 aggregate 收敛是因为三个架构 通过不同路径到达了相似的 accuracy level——但路径本身越来越不同。 Jaccard
    从 0.15 (h0) 降至 0.06 (h24) 表明 h0 时 helped/hurt sets 本身就有低重叠 （这可能部分反映 baseline noise），attention
    增加后进一步分化。

    '

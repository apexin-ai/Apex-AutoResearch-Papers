  analysis: 'exp-007 的 median 结果为 Claim 2 提供了 "比 aggregate 更深但不完美" 的证据——恰好符合 EMNLP
    Findings 的期望水平。rebound-hardest-samples overlap (62%) 是一个 informative finding，
    给出了直觉上合理的 capacity saturation 解释。但 training token confound 无法 fully disentangle
    是一个 honest limitation。论文措辞建议："Scale is a necessary condition for complete convergence,
    likely through increased capacity to jointly optimize recurrence and attention;
    however, the co-varying training data volume (20B vs 100B tokens) prevents definitive
    attribution to parameter count alone." 这种 careful framing 对 EMNLP 审稿人来说是可接受的。

    '
- name: Statistical robustness framework
  plan_id: exp-008
  description: '对核心 convergence metrics 实施 bootstrap CI, Bonferroni/FDR 多重比较校正,  GDN-excluded
    sensitivity analysis, 以及 effect size (Cohen''s d / η²) 报告。


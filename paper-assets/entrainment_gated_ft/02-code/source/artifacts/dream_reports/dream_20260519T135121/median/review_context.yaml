    时 与其他两个最接近），移除它后跨架构 variance 的基线本身就变小（RetNet 和 HGRN2 的 h0 性能差异 比 GDN 参与时小），导致
    std reduction 百分比从 79% 降至 38%。Bootstrap CI 变宽是因为 n=2 architectures 的 pairwise
    comparison 本质上自由度极低。 但 directional survival 是可信的：RetNet-HGRN2 pair 在 LAMBADA 上确实随

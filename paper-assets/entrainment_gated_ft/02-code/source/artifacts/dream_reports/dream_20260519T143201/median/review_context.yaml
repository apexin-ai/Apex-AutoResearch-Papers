    bootstrap_ci_upper: -0.7
    bootstrap_ci_crosses_zero: false
    bootstrap_n_valid: 8875
    bootstrap_n_total: 10000
    bca_degenerate: true
    gdn_excluded_LAMBADA_rho: -0.7
    gdn_excluded_LAMBADA_p: 0.233
    gdn_excluded_ARC_Easy_rho: -0.9
    gdn_excluded_ARC_Easy_p: 0.083
    gdn_excluded_MMLU_rho: 0.6
    gdn_excluded_MMLU_direction: FLIPPED — convergence was GDN-driven artifact
    MMLU_must_exclude_from_convergence_evidence: true
  result_rationale: '已完成实验。LAMBADA 不通过 Bonferroni（adj-p=0.100 > 0.0083），BH-FDR 在仅
    1 个小 p-value 时 无额外收益（也是 0.100）。Bootstrap percentile CI [-1.0, -0.7] 不过零，这是论文的
    primary statistical argument——方向性确定，只是精确 p-value 在 multi-comparison 下失去显著性。 GDN-excluded
    分析揭示两个关键发现：(a) ARC-Easy rho 从 -0.7 改善到 -0.9（p=0.083）， 说明 GDN confound 在 ARC-Easy
    上是噪声源，去除后 convergence signal 更强； (b) MMLU rho 从 -0.7 翻转到 +0.6，MMLU 的 apparent
    convergence 完全由 GDN 驱动，是 artifact。 这要求 paper 严格标记 MMLU 为 non-convergent。

    '

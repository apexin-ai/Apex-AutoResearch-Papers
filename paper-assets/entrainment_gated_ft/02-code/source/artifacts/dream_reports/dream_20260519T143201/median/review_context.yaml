  result_rationale: 'Median 档下，convergence 和 per-example divergence 的 co-evolution
    关系成立但统计边缘性。 随着 attention ratio 增加：(1) aggregate std 单调下降（convergence 增强）， (2)
    pairwise Jaccard 轻微下降（per-example overlap 减少，divergence 增强）， (3) net effect asymmetry
    增加（每种架构的 "helped bias" 越来越不同）。 这三个轨迹在 attention ratio 维度上高度相关（ρ≈-0.95），但 n=4 datapoints（h0
    无 attention， 无 per-example divergence metric），p=0.05 只是 borderline。 核心 insight：更多
    attention → aggregate 更 similar，但 per-example mechanism 更 different。 这是 underspecification
    的具体量化——"the HOW diverges while the WHAT converges"。


narrative_guidance: 'Claim 1 弱化为 ''convergence on retrieval-heavy tasks with suggestive
  evidence on related benchmarks''。 LAMBADA 仍为唯一 BH-FDR 显著锚点，但 exp-011 新 benchmark
  方向一致性 + GDN-excluded ARC-Easy 改善 构成 converging evidence pattern。exp-004 以描述性证据呈现，避免
  mechanistic language。 exp-005 未扩展架构数量。exp-007 部分解释 340M rebound 但留有未解问题。 Claim 3
  per-example divergence 成为论文相对最强的独立贡献。目标 EMNLP Findings，honest framing。

  '
imagined_experiments:

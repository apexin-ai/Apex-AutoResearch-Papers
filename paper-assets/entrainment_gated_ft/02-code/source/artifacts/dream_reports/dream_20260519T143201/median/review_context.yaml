  plan_id: exp-008
  description: Bootstrap CIs、multiple comparison correction、GDN-excluded sensitivity
    analysis
  expected_results:
    LAMBADA_rho: -1.0
    LAMBADA_exact_p_two_tailed: 0.0167
    LAMBADA_bonferroni_adj_p: 0.1
    LAMBADA_bh_fdr_adj_p: 0.1

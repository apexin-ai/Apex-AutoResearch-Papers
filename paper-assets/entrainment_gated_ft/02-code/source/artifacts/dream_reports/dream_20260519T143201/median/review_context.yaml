    这不足以做 strong mechanistic claim，但足以做描述性报告。原因： (1) attention weights 只是 model 行为的
    partial view——per-example 效果由 attention + recurrent backbone 的交互决定，单看 attention
    只能捕获部分 variance。 (2) h3-1 配置仅 1 层 attention（在 3 层 block 中），信息密度有限。 (3) 不同架构的 attention
    确实 focus 在不同位置（cross-arch cosine similarity 仅 0.35）， 这与 per-example divergence
    一致——架构之间 attention 的 "关注点" 不同。 (4) 所有架构的 attention 都倾向于 focus on last sentence（55-62%），这与
    LAMBADA 的 retrieval nature 一致， 但具体 token-level focus 差异显著。 Helped 样本的 attention
    entropy 略低于 hurt 样本（p=0.08），暗示 attention 在 "知道该看哪里" 时更有效， 但这只是 suggestive。


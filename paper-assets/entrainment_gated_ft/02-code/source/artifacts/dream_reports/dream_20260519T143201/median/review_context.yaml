    gpu_hours_actual: 2
  result_rationale: 'Median 档核心假设：340M rebound 可部分解释但非完全清晰。 部分解释（~60%）：340M 模型在 h8
    ratio 时，attention 层数已占 1/3 的 model capacity， 对于小模型来说 attention 的参数开销（QKV projections）挤占了
    recurrent backbone 的表达能力， 导致某些样本从 "helped by attention" 回退到 "hurt by capacity
    reallocation"。 具体表现为：rebound 样本与 1.3B 的 hurt 样本有 34% 重叠——这些是 "需要 attention 但也需要
    足够 recurrent capacity 来编码上下文" 的样本。1.3B 有足够 capacity 同时支持两者。 未解释部分（~40%）：不同架构的
    rebound 幅度差异大（RetNet 最强 +55%，HGRN2 最弱 +20%）， 暗示 rebound 不仅是 capacity issue，还与
    backbone 的 inductive bias 有关。 训练 token 数量差异（340M: 20B tokens, 1.3B: 100B tokens）作为
    confound 被承认但无法分离—— 需要 controlled training runs 才能解开，超出本文 scope。


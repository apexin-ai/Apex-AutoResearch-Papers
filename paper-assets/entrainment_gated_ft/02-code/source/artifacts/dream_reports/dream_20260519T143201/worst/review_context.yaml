narrative_guidance: '放弃 convergence 作为主 claim。论文 reframe 为 "Per-example behavioral
  divergence in hybrid recurrent architectures — attention induces architecture-specific
  sample specialization"。LAMBADA convergence 降级为 discussion 中的 single-task observation，
  不作为独立 claim。Claim 2 (scale) 完全移入 supplementary。核心贡献变为 Claim 3： (a) Jaccard < 0.10
  的架构特异性，(b) cross-arch KW p=0.0005 证明结构化非随机， (c) surface features + perplexity 均无法解释。新
  story spine：practitioners 选择 hybrid architecture 时需要知道 attention 对不同架构的 per-example
  影响是不同的。 仍冲 EMNLP Findings，但需要 20+ references 的 related work 支撑 question 的 motivated-ness。per-example
  characterization + underspecification framing 对 analysis track 有独立价值。

  '
imagined_experiments:

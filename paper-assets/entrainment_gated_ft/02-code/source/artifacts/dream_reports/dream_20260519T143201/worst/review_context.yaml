- name: Attention weight extraction and visualization
  plan_id: exp-004
  description: '提取 3 个架构 h3-1 配置的 attention weight patterns，分析 attention pattern 与
    helped/hurt sample identity 的相关性。Worst 档下 correlation < 0.15， attention patterns
    无法解释 per-example 差异。

    '
  expected_results:
    gdn_attn_effect_correlation: 0.08
    retnet_attn_effect_correlation: 0.11
    hgrn2_attn_effect_correlation: 0.06
    max_attn_effect_correlation: 0.11
    cross_arch_attn_pattern_similarity: 0.35
    attn_entropy_helped_vs_hurt_p_gdn: 0.18
    attn_entropy_helped_vs_hurt_p_retnet: 0.09
    attn_entropy_helped_vs_hurt_p_hgrn2: 0.41
    attn_head_specialization_score: 0.12
    position_bias_correlation_with_effect: 0.05
  result_rationale: 'Worst 档核心假设是 attention patterns 对 per-example 效应无解释力。Correlation
    < 0.15 的原因有几个层面：(1) attention weight 是 input-dependent 的高维对象， 简单的 aggregated statistics（entropy,
    max attention, positional bias）丢失了 太多信息，真正的机制可能在 attention 与 recurrent state 的交互中，单独看
    attention 不够；(2) helped/hurt 的二分类本身粗糙——attention 可能对 logprob 变化有连续影响但被二值化后信号衰减；(3)
    h3-1 只有 3 层 attention（每 8 层一层）， 信息瓶颈严重，attention 的角色可能更多是 global routing 而非 sample-specific
    processing，pattern 差异不映射到 per-example outcome 差异。Cross-arch similarity 0.35 说明不同架构的
    attention 做了部分相似的事但不完全相同——既不能说 attention 导致了 convergence（similarity 不够高），也不能说
    attention 解释了 divergence （correlation 太低）。

    '

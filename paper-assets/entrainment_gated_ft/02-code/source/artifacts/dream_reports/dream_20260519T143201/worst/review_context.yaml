  - 'Scatter plot: attention entropy vs logprob change per sample，3 architectures
    分面。散点云无明显趋势，r < 0.15。'
  analysis: 'Worst 档下 exp-004 是一个 informative negative：attention weight patterns 本身
    不能解释 per-example 效应。这并不削弱 Claim 3——反而加强了 "opaque to standard features" 的论述。Surface
    features 不行（exp-003），perplexity 不行 （exp-003-p2），现在 attention patterns 也不行。Per-example
    divergence 的来源 可能在 attention 与 recurrent state 的非线性交互中，这超出了 descriptive analysis
    的能力范围，诚实地承认并指向 interventional future work（head ablation, activation patching）。论文中
    frame 为 "characterization of what does NOT explain the divergence" 而非失败——negative
    results 在 analysis paper 中有价值。 exp-004 从 "mechanistic evidence" 降级为 "descriptive

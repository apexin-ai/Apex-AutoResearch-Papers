- name: Architecture expansion check
  plan_id: exp-005
  description: '搜索 Wang et al. model zoo 和其他来源，寻找额外的 hybrid 架构 （Mamba/Mamba2 hybrids,
    RWKV hybrids）。Worst 档下无额外架构可用。

    '
  expected_results:
    additional_architectures_found: 0
    n_architectures_total: 3
    mamba_hybrid_available: false
    rwkv_hybrid_available: false
    other_hybrid_available: false
    search_sources_checked:
    - wang_et_al_zoo
    - huggingface_hub
    - github_repos
  result_rationale: 'Wang et al. (2025) 的 model zoo 专注于 GatedDeltaNet、RetNet、HGRN2
    三个 linear recurrent 架构。Mamba/Mamba2 hybrids（如 Jamba）使用不同的 attention integration
    策略且没有公开的 systematic ratio sweep（Jamba 只有一个固定配置）。 RWKV-6 hybrids 尚未有公开的 pretrained
    checkpoints with varying attention ratios。 RecurrentGemma 是 closed-weight。在 worst
    档下，即使找到个别 checkpoint，也 缺乏 attention ratio sweep（需要 h0/h3-1/h6-1/h12-1/h24-1 五个配置），
    无法做 convergence 分析。训练新模型超出 GPU budget。n=3 的限制在 paper 中 必须诚实承认为 limitation，但 per-example
    analysis 的 5153 data points per comparison 部分补偿了架构数量的不足。

    '
  tables: []
  figures_description: []
  analysis: 'Worst 档下 exp-005 确认 n=3 是硬约束。Reviewer Concern D ("n=3 too few") 只能 通过
    framing 来 mitigate：(1) 3 architectures × 5 ratios × 2 scales = 30 models 的 systematic
    design，(2) per-example 分析提供 thousands of data points， (3) 这三个架构代表了当前 linear recurrent
    家族的主要分支（gated delta, retention, hierarchical gated），(4) 在 limitations 中诚实承认并指向
    future work。 对 reframed narrative 影响有限——per-example divergence 的 Jaccard < 0.10
    在 3 个架构上已经充分证明了 architecture-specificity。

    '
- name: 340M rebound mechanism analysis
  plan_id: exp-007
  description: '深入分析 340M 在 attn=8 的 non-monotonic rebound。Per-example 比较 340M 与 1.3B
    在相同 attention ratio 下的行为差异。Worst 档下 rebound 无清晰解释， 噪声不可排除。

    '
  expected_results:
    rebound_effect_size_cohens_d: 0.15
    rebound_sample_overlap_with_1_3b: 0.42
    rebound_explained_by_training_tokens: inconclusive
    capacity_hypothesis_p: 0.28
    per_example_340m_1_3b_correlation_at_h8: 0.18
    rebound_samples_surface_feature_diff_p: 0.35
    rebound_magnitude_std: 0.008
    noise_floor_permutation_p: 0.14
  result_rationale: '340M rebound 在 worst 档下无法与噪声区分开，原因：(1) 340M models 用 20B tokens
    训练 vs 1.3B 用 100B tokens——training token confound 与 scale confound 完全混淆，无法解缠；(2)
    rebound effect size 很小（Cohen''s d ≈ 0.15），在 permutation test 下 p=0.14，不能排除采样噪声；(3)
    340M 与 1.3B 在 h8 的 per-example correlation 很低（0.18），说明两个 scale 的 attention 效应作用于
    不同的 sample subsets，但这可能纯粹是因为 340M 容量不足导致的随机差异而非 有意义的 mechanistic difference；(4)
    surface features 无法区分 rebound samples 与 non-rebound samples（p=0.35）。整体结论：340M
    rebound 是 noisy observation， 不能支撑 Claim 2 的 "scale is necessary condition" narrative。

    '
  tables:
  - name: 'Table: 340M rebound characterization'
    columns:
    - metric
    - value
    - interpretation
    rows:
    - - rebound_magnitude_attn8
      - 0.008
      - cross-arch std increases from 0.015 to 0.023 at h8
    - - cohens_d
      - 0.15
      - small effect, within noise range
    - - permutation_p
      - 0.14
      - not significant at any conventional threshold
    - - 340m_1.3b_per_example_r
      - 0.18
      - near-zero per-example correspondence across scales
    - - training_token_ratio
      - 20B vs 100B
      - 5x confound, cannot separate from scale
  figures_description:
  - 'Line plot: cross-arch std vs attention ratio for 340M and 1.3B overlaid。340M
    线在 h8 处有微弱上翘但 error bar 大，1.3B 线单调下降。视觉上 rebound 不 compelling。'
  analysis: 'Worst 档下 Claim 2 (scale-dependent convergence) 几乎完全失效。340M rebound 既不能被解释也不能被确认为真实信号。在
    reframed narrative 下，Claim 2 整体 降级为 supplementary observation："We observe that
    convergence appears more complete at 1.3B than 340M, but the confound between
    scale (340M vs 1.3B) and training data (20B vs 100B tokens) prevents causal attribution.
    The 340M rebound at high attention ratios is not statistically distinguishable
    from noise (p=0.14)." 这段话放在 supplementary 即可。主论文只需一句话提及 scale 作为 limitation/future
    work。

    '
- name: Convergence-divergence bridge analysis
  plan_id: exp-010

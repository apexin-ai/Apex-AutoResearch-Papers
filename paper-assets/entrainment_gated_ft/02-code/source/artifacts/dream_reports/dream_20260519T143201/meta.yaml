    ## 3. Strengths (Consensus)


    - **S1. Exemplary statistical transparency.** Three-layer multiple comparison
    correction (BH-FDR m=5, Bonferroni m=3, BH-FDR m=9) with all three reported honestly,
    including the full-correction failure (m=9: 0 significant). This level of transparency
    is rare and commendable. [Both R1, R2]


    - **S2. Pre-specified confirmatory design.** The retrieval-demand taxonomy was
    established from the initial six-benchmark analysis *before* evaluating StoryCloze/BoolQ/COPA,
    making the confirmatory results a genuine hypothesis test rather than post-hoc
    fishing. StoryCloze''s ρ=−1.0 provides an independent second anchor. [Both R1,
    R2]


    - **S3. Honest negative results add value.** The within-architecture sample characterization
    (§5.2) reports that neither surface features nor baseline perplexity predict helped/hurt
    status—two layers of negative results that rule out trivial explanations and establish
    the phenomenon as genuinely opaque within-architecture. [R1]


    - **S4. Clear differentiation from Wang et al.** Five concrete dimensions with
    a side-by-side comparison table (Table 9) effectively establish that this is not
    a re-analysis but an independently motivated analytical contribution. The "community
    analysis paper" framing is appropriate. [R2]


    - **S5. High reproducibility.** All models are public (Wang et al. model zoo),
    evaluation uses standard lm-evaluation-harness, statistical tests are fully specified
    with exact permutation p-values. A reader could reproduce every result. [Both
    R1, R2]


    - **S6. Appropriate epistemic caution.** The attention pattern analysis (§5.3)
    is correctly labeled as descriptive, not causal. The paper avoids mechanistic
    overclaiming throughout. [R2]


    ---


    ## 4. Weaknesses (Consensus + Individual)


    ### Critical (would block Main acceptance)


    - **W1. Missing Jaccard random-null baseline.** [Both R1, R2] The headline claim
    "nearly non-overlapping sample subsets (Jaccard < 0.10)" is uninterpretable without
    comparison to expected Jaccard under random set assignment of the same sizes.
    Given typical helped-set sizes (~500 of ~5000 total samples), random Jaccard could
    be ~0.05–0.10, meaning the observed values may be indistinguishable from chance.
    **Action needed**: compute expected Jaccard under random permutation and report
    the gap. If the gap is small, the entire per-example divergence narrative (Claim
    3) is undermined.


    - **W2. Co-evolution section (§5.4) inflated by definitional anchor point.** [Both
    R1, R2] The ρ=−1.0 between σ_cross and |Δ| includes h0 where |Δ|=0.0 *by definition*
    (pure vs. pure = no difference). This is not a measurement but a tautology. Excluding

  review_report: "---\ndream_id: dream_20260519T143201\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-19T15:46:16.213463+00:00\n---\n\
    \n# Dream Review Report — Per-Example Behavioral Divergence in Hybrid Recurrent\
    \ Architectures\n\n**dream_id**: 20260519T143201  \n**Review Mode**: full (2 Reviewers\
    \ + 4-Step Roundtable)  \n**Target Venue**: EMNLP 2026 (ARR)  \n**Date**: 2026-05-19\n\
    \n---\n\n## Paper Summary\n\nThe paper analyzes per-example behavioral divergence\
    \ in hybrid recurrent architectures using 30 pretrained models from Wang et al.\
    \ [2025]'s model zoo (3 architecture families × 5 attention ratios × 2 scales).\
    \ The central claim is \"architecture-specific sample specialization\": attention\
    \ helps/hurts nearly non-overlapping example subsets across architectures (Jaccard\
    \ < 0.10), this is structured (KW p=0.0005), and aggregate convergence is fragile\
    \ (0/9 benchmarks survive BH-FDR correction).\n\n---\n\n## R1 Review — Methods\
    \ and Experiments\n\n### Scores\n| Dimension | Score |\n|-----------|-------|\n\
    | Soundness | 3.0 |\n| Excitement | 2.5 |\n| Reproducibility | 4.5 |\n| **Overall**\
    \ | **3.0 (Findings)** |\n\n### Strengths\n- **Statistical honesty**: The paper\
    \ applies BH-FDR and Bonferroni corrections and honestly reports that 0/9 benchmarks\
    \ survive. This is rare and commendable.\n- **Systematic design**: 3 × 5 × 2 =\
    \ 30 models with controlled variables. The use of a public model zoo enables direct\
    \ reproducibility.\n- **Transparent limitations**: Scale confound, n=3 architectures,\
    \ descriptive-not-causal — all acknowledged upfront.\n- **Appropriate downscoping**:\
    \ LAMBADA convergence demoted to \"single-task observation\" rather than overclaimed.\n\
    \n### Weaknesses\n\n**[CRITICAL] Missing Jaccard random-null baseline.** The headline\
    \ claim \"Jaccard < 0.10 = nearly non-overlapping\" is uninterpretable without\
    \ comparison to chance. If each architecture independently helps ~10% of samples\
    \ (rough estimate from Table 4: ~1,400 union helped / 5,153 total, suggesting\
    \ per-architecture ~500, so p ≈ 0.10), then the expected random Jaccard is approximately\
    \ p/(2−p) ≈ 0.05. Observed values of 0.07–0.09 would then be **at or above** random\
    \ expectation, potentially reversing the core claim from \"architecture-specific\
    \ specialization\" to \"slightly more overlap than chance.\" This single omission\
    \ could be fatal to Claim 1 (the paper's main contribution). A permutation-based\
    \ null distribution is mandatory.\n\n**[MAJOR] n=5 Spearman power ceiling.** Every\
    \ \"significant\" convergence result (e.g., LAMBADA ρ=−1.0, p=0.017) hits the\
    \ exact combinatorial floor: with 5 data points, the minimum achievable p-value\
    \ is 2/120 = 0.0167. The test cannot distinguish genuine convergence from any\
    \ monotonic confound. The paper correctly identifies this in Limitations but still\
    \ makes claims that implicitly require this power level.\n\n**[MAJOR] Co-evolution\
    \ analysis inflated by definitional h0 anchor.** Table 4 includes h0 as \"baseline\"\
    \ with Jaccard = N/A and Std = 0.024, then claims a co-evolution trend. But h0\
    \ is the definitional anchor (no attention = no helped/hurt sets). Including it\
    \ in the trend inflates the apparent relationship. The ρ=−0.6 (p=0.28) is already\
    \ non-significant; excluding h0 would further weaken it.\n\n**[MAJOR] GDN exclusion\
    \ sensitivity.** Table 3 shows convergence signals weaken dramatically when GDN\
    \ is excluded (StoryCloze ρ: −0.3→−0.1; BoolQ ρ: −0.1→+0.3). This raises concern\
    \ that even LAMBADA's raw convergence is GDN-driven. The paper acknowledges \"\
    confounds in training configuration\" but does not report GDN-excluded LAMBADA\
    \ ρ.\n\n**[MAJOR] Table 1 covers only 4/9 benchmarks.** The abstract claims \"\
    all benchmarks tested\" have Jaccard < 0.10, but Table 1 only reports 4. Per-example\
    \ Jaccard for StoryCloze, BoolQ, WinoGrande, COPA, MMLU is missing from all tables.\
    \ The claim about 9-benchmark universality is unsupported by presented data.\n\
    \n**[MINOR] Scale confound.** 340M/20B vs 1.3B/100B — a 5× training token difference\
    \ makes any scale claim uninterpretable. Appendix A (340M rebound: Cohen's d=0.15,\
    \ p=0.14) adds little value.\n\n**[MINOR] Helped/Hurt definition threshold.**\
    \ Examples are classified as helped/hurt by any log-probability change from h0.\
    \ No minimum effect size threshold is applied. Tiny floating-point differences\
    \ could dominate the classification, inflating set sizes and deflating Jaccard.\n\
    \n### Questions for Authors\n1. What is the expected Jaccard under a random-null\
    \ model where each architecture independently affects ~p fraction of examples?\
    \ Please provide permutation-based null distributions.\n2. What is LAMBADA's ρ\
    \ and p-value when GDN is excluded?\n3. Can you provide Table 1 data for all 9\
    \ benchmarks, not just 4?\n4. What happens to Jaccard values when a minimum effect-size\
    \ threshold (e.g., |Δ log-prob| > 0.1) is applied?\n\n---\n\n## R2 Review — Novelty\
    \ and Related Work\n\n### Scores\n| Dimension | Score |\n|-----------|-------|\n\
    | Soundness | 3.0 |\n| Excitement | 2.0 |\n| Reproducibility | 5.0 |\n| **Overall**\
    \ | **2.5 (Borderline Findings)** |\n\n### Strengths\n- **Well-scoped framing**:\
    \ The paper positions itself as an analysis/characterization paper, not a methods\
    \ paper. The underspecification framing is appropriate and well-motivated.\n-\
    \ **Epistemic humility**: Rare in the field — the paper systematically tests and\
    \ honestly reports null results (convergence fails FDR, attention patterns don't\
    \ explain, surface features fail).\n- **Reproducibility**: All models public,\
    \ evaluation via lm-eval-harness with --log_samples, standard statistical tests.\
    \ Near-perfect reproducibility.\n- **Informative negatives**: The finding that\
    \ 0/9 benchmarks survive FDR for convergence is genuinely useful for the hybrid\
    \ architecture community, preventing future overclaims.\n\n### Weaknesses\n\n\
    **[CRITICAL] Novelty ceiling.** The core methodology is applying Jaccard similarity\
    \ + Kruskal-Wallis test to per-example outputs from a pre-existing model zoo.\
    \ These are standard textbook statistics applied to someone else's models. The\
    \ finding — that different architectures affect different examples — is the expected\
    \ prediction of the underspecification literature (D'Amour et al. 2022). Confirming\
    \ a known phenomenon in a new setting has value, but the bar for EMNLP Main requires\
    \ either (a) surprising findings, (b) new methods, or (c) validated practical\
    \ implications. None are present here.\n\n**[CRITICAL] Same Jaccard random-null\
    \ concern as R1.** If observed Jaccard is at or above chance, the entire framing\
    \ of \"architecture-specific specialization\" collapses. The paper would be reporting\
    \ normal/expected overlap, not specialization.\n\n**[MAJOR] Practical implications\
    \ are aspirational, not validated.** The paper claims implications for \"architecture\
    \ selection in deployment-sensitive settings\" but provides no ensemble experiment,\
    \ no downstream task evaluation, and no concrete guidance beyond \"expect different\
    \ subsets.\" This is a common inflation pattern in analysis papers.\n\n**[MAJOR]\
    \ Related work gaps.**\n- Missing discussion of inductive bias literature (e.g.,\
    \ Battaglia et al. 2018 on relational inductive biases; Tay et al. 2021/2022 on\
    \ comparing efficient architectures)\n- No citation of Olsson et al. 2022 (induction\
    \ heads in transformers) — directly relevant to understanding attention's role\
    \ in hybrid architectures\n- Missing Poli et al. 2023 (Hyena), Fu et al. 2023\
    \ (H3) — earlier hybrid designs that could contextualize the analysis\n- The connection\
    \ to ensemble diversity literature is mentioned but not developed: Jaccard is\
    \ not the standard diversity metric in ensemble literature (disagreement measure,\
    \ Q-statistic, double-fault are more standard)\n- Only 22 references total for\
    \ a 9-benchmark analysis paper — thin for EMNLP\n\n**[MAJOR] \"Architecture-specific\
    \ sample specialization\" vs. underspecification.** The paper's main coined term\
    \ is not clearly differentiated from existing \"underspecification\" (D'Amour\
    \ et al. 2022) or \"model disagreement\" (McCoy et al. 2020). The argument that\
    \ \"architectural backbone vs. random seed\" is a new dimension is stated but\
    \ not empirically demonstrated — we don't see random-seed Jaccard as a comparison\
    \ baseline.\n\n**[MINOR] No figures in main text.** An analysis paper with 7 tables\
    \ and 0 figures misses opportunities for visual communication. Heatmaps of Jaccard\
    \ matrices, forest plots of convergence ρ, scatter plots of convergence vs. divergence\
    \ — these would substantially improve readability.\n\n**[MINOR] Writing is competent\
    \ but formulaic.** The structure is clean but the narrative lacks a compelling\
    \ \"so what\" moment. The conclusion reads as \"things are different at per-example\
    \ level\" which, while true, doesn't generate excitement.\n\n### Questions for\
    \ Authors\n1. How does the Jaccard overlap compare to that of models trained from\
    \ different random seeds on the same architecture? This comparison would isolate\
    \ the architectural contribution.\n2. Can you provide one concrete, actionable\
    \ recommendation for practitioners based on these findings?\n3. Why was Jaccard\
    \ chosen over standard ensemble diversity metrics (Q-statistic, disagreement measure)?\n\
    \n---\n\n## Roundtable — Steps 2–4\n\n### Step 2: Cross-Sharing Summary\n\nBoth\
    \ reviewers independently identified the **missing Jaccard random-null baseline**\
    \ as the most critical issue. Both assigned Soundness = 3. R1 is marginally more\
    \ optimistic (3.0 = Findings) based on the paper's strong statistical honesty\
    \ and potential for the Jaccard null to be favorable. R2 is more skeptical (2.5\
    \ = Borderline Findings) because even if the statistics hold, the novelty ceiling\
    \ limits the contribution.\n\n### Step 3: Convergence\n\n**Agreed weaknesses (both\
    \ reviewers):**\n1. Jaccard random-null baseline missing — potentially fatal\n\
    2. Co-evolution analysis inflated by h0 definitional anchor\n3. n=3 architectures\
    \ is a hard constraint\n4. n=5 attention ratios → severe power limitation\n5.\
    \ GDN exclusion sensitivity unresolved\n6. Table 1 only covers 4/9 benchmarks\
    \ despite 9-benchmark universality claim\n7. Practical implications unvalidated\n\
    \n**Agreed strengths:**\n1. Statistical transparency and honesty (especially BH-FDR\
    \ disclosure)\n2. High reproducibility (public models, standard tools)\n3. Informative\
    \ negative results (convergence null, attention null)\n4. Appropriate limitations\
    \ section\n\n**Remaining disagreement:**\n- R1 (3.0) believes the systematic design\
    \ and honest reporting meet Findings bar if Jaccard null is computed and favorable\n\
    - R2 (2.5) believes novelty is insufficient even with correct statistics — confirming\
    \ underspecification in a new setting with textbook methods is incremental\n\n\
    **Resolution:** The panel converges on **2.5 (Borderline Findings)**. Rationale:\
    \ The Jaccard null is unresolved and could be fatal. Even in the best case (null\
    \ computed, observed < expected, claim survives), the novelty assessment from\
    \ R2 is well-founded — the contribution is primarily empirical confirmation of\
    \ expected behavior using standard methods. A score of 3.0 (Findings) requires\
    \ both (a) surviving the Jaccard null and (b) adding at least one of: random-seed\
    \ baseline comparison, practical ensemble validation, or a novel metric/method.\n\
    \n### Step 4: Consolidated Assessment\n\n| Dimension | R1 | R2 | Consensus |\n\
    |-----------|----|----|-----------|\n| Soundness | 3.0 | 3.0 | **3.0** |\n| Excitement\
    \ | 2.5 | 2.0 | **2.0** |\n| Reproducibility | 4.5 | 5.0 | **4.5** |\n| **Overall**\
    \ | **3.0** | **2.5** | **2.5 (Borderline Findings)** |\n\n---\n\n## Consolidated\
    \ Strengths\n1. **Exemplary statistical transparency**: Honestly reporting that\
    \ 0/9 benchmarks survive FDR is rare and valuable. The field needs more of this.\n\
    2. **High reproducibility**: Public model zoo, standard evaluation harness, clearly\
    \ described statistical tests.\n3. **Informative negative results**: Convergence\
    \ is not general; attention patterns don't explain per-example effects; surface\
    \ features are uninformative. These negatives prevent future overclaims.\n4. **Well-scoped\
    \ limitations**: The paper is upfront about n=3, scale confound, and descriptive-not-causal\
    \ nature.\n\n## Consolidated Weaknesses (Priority Order)\n\n### Fatal / Must-Fix\n\
    1. **Missing Jaccard random-null baseline**: Without this, the paper's central\
    \ claim (\"Jaccard < 0.10 = nearly non-overlapping\") is uninterpretable. Back-of-envelope\
    \ estimates suggest observed values may be at or above chance expectation (~0.05),\
    \ which would reverse the core finding from \"specialization\" to \"normal overlap.\"\
    \ Compute permutation-based null distributions for all reported Jaccard values.\n\
    \n### Major\n2. **Table 1 covers only 4/9 benchmarks**: The universality claim\
    \ requires per-example Jaccard data for all 9 benchmarks. 5 benchmarks are missing\
    \ from the tables.\n3. **Novelty ceiling**: Standard statistical tools (Jaccard,\
    \ KW, Spearman) applied to a pre-existing model zoo. The finding confirms expected\
    \ predictions from underspecification theory. No new method, no surprising result,\
    \ no validated practical recommendation.\n4. **Co-evolution analysis inflated**:\
    \ h0 anchor is definitional, not empirical. The already-nonsignificant ρ=−0.6\
    \ (p=0.28) would weaken further if h0 is excluded.\n5. **GDN exclusion not fully\
    \ reported**: LAMBADA ρ with GDN excluded is missing — critical given that GDN\
    \ drives convergence on other benchmarks.\n6. **No random-seed baseline for Jaccard**:\
    \ Without comparing architecture-induced disagreement to seed-induced disagreement,\
    \ the claim that architecture is a meaningful dimension (vs. random initialization\
    \ noise) is unsupported.\n7. **Related work thin** (~22 refs): Missing inductive\
    \ bias literature, efficient architecture comparison papers (Tay et al.), induction\
    \ heads (Olsson et al.), earlier hybrid designs (Hyena, H3), standard ensemble\
    \ diversity metrics.\n\n### Minor\n8. **No figures**: 7 tables, 0 figures in an\
    \ analysis paper. Heatmaps, forest plots, and scatter plots would substantially\
    \ improve communication.\n9. **Helped/hurt threshold**: No minimum effect-size\
    \ cutoff — floating-point noise could inflate set sizes and deflate Jaccard.\n\
    10. **340M scale analysis adds little**: Appendix A (d=0.15, p=0.14) is inconclusive\
    \ and could be cut.\n\n## Actionable Path Forward\n\n**To reach 3.0 (Findings):**\n\
    - Compute and report Jaccard random-null distributions (permutation test)\n- Report\
    \ Table 1 for all 9 benchmarks\n- Report GDN-excluded LAMBADA ρ\n- Fix co-evolution\
    \ analysis (remove or flag h0 anchor)\n- Add 2-3 figures\n- Expand references\
    \ to ~30+\n\n**To reach 3.5+ (Borderline Conference):**\n- All of the above, plus:\n\
    - Random-seed Jaccard baseline (same architecture, different seeds)\n- At least\
    \ one validated practical implication (e.g., ensemble of diverse hybrids outperforms\
    \ single hybrid)\n- A novel metric or analytical method beyond standard Jaccard/KW\n\
    \n## Responsible NLP Checklist\n- **Limitations section**: Present and adequate\
    \ ✓\n- **Anonymity**: No violations detected ✓\n- **Page limit**: Main text appears\
    \ within 8 pages ✓\n- **References**: All appear real (spot-checked) ✓\n- **Checklist\
    \ completeness**: Section A-E not visible in the manuscript — **must be included\
    \ for ARR submission**\n\n---\n\n## Meta-Assessment\n\nThis paper asks a reasonable\
    \ question (does aggregate convergence mask per-example divergence in hybrid architectures?)\
    \ and provides a thorough descriptive analysis with commendable statistical transparency.\
    \ However, the missing Jaccard null baseline is a potentially fatal flaw that\
    \ must be addressed before the core claim can be evaluated. Even if the null baseline\
    \ is favorable, the novelty remains limited: the contribution is primarily empirical\
    \ confirmation of expected underspecification behavior using standard methods\
    \ in a specific architectural setting. The paper is well-suited for a workshop\
    \ or for Findings after the null-baseline issue is resolved, but in its current\
    \ form falls short of the evidence threshold for confident acceptance.\n\n**Consensus\
    \ Overall Assessment: 2.5 / 5.0 (Borderline Findings)**"

    figures_description:
    - 'Fig 1a: Cross-arch std vs attention ratio (5 points × 6 benchmarks), color-coded
      by taxonomy'
    analysis: 'Taxonomy 成立。ρ 值沿 retrieval demand gradient 单调递减：

      LAMBADA(-1.0) > ARC-Easy/MMLU(-0.7) > ARC-C(0.6)/HellaSwag(0.3)/Winogrande(0.1)。

      这个 gradient 本身是一个 finding：convergence strength 是 retrieval demand 的函数。

      '

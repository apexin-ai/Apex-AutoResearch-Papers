    **Dream ID**: 20260519T143201 | **Review Mode**: full | **Venue**: EMNLP 2026
    (ARR)


    ---


    ## 1. Paper Summary


    The paper analyzes a public model zoo of 72+ hybrid recurrent-attention models
    spanning four recurrence mechanisms (GatedDeltaNet, RetNet, HGRN2, Mamba2-hybrid)
    across five attention ratios and two scales (340M, 1.3B). It makes three claims:
    (1) attention-induced cross-architecture convergence is task-dependent, strongest
    on retrieval-demanding tasks (LAMBADA and StoryCloze, ρ=−1.0, BH-FDR adj p=0.042);
    (2) convergence requires sufficient model capacity, exhibiting a non-monotonic
    rebound at 340M; (3) despite aggregate convergence, per-example analysis reveals
    nearly non-overlapping affected sample subsets across architectures (Jaccard <
    0.10), framed as underspecification. The paper positions itself as a "community
    analysis paper" drawing new conclusions from existing public infrastructure.


    ---


    ## 2. Consolidated Scores


    | Dimension | R1 (Methods+Exp) | R2 (Novelty+RW) | Converged |


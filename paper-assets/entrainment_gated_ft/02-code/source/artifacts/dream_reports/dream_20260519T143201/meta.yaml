    result_rationale: '已完成实验的实际结果。Best 档解读的关键：taxonomy 是 PREDICTIVE framework，不是 post-hoc
      rationalization。

      LAMBADA（last-word prediction from passage）依赖 attention 的 copy/induction-head
      retrieval mechanism——

      所有架构的 attention 都学会类似的 context retrieval → 性能趋同。

      Reasoning 任务（HellaSwag/ARC-C/Winogrande）依赖 recurrent state 的 compositional inference，

      attention 不系统性改变这一计算 → ρ ≈ 0 或正值。

      Mixed 类（ARC-Easy ρ=-0.7, MMLU ρ=-0.7）有 factual retrieval 成分但不纯粹 → suggestive

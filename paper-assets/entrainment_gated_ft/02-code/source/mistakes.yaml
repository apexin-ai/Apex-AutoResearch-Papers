    with properly hedged language.
- id: M015
  date: '2026-05-22'
  category: agent_behavior
  severity: high
  summary: E4 Pythia 评估连续 3 次失败：Worker 放弃已成功的 HF 直接加载方式，转用 wget 下载到本地路径（该路径从未创建成功）
  root_cause: 'Worker 在第一次成功用 HF model ID 加载 seed1 后，可能因为下载速度慢而"优化"为 wget 预下载到本地路径。但
    wget 下载的文件结构不符合 transformers 预期格式，导致 ValueError: Unrecognized model。后续 Worker
    继承了这个错误方案而非回到最初正确的方式。'
  prevention: 1. lm_eval --model hf 评估时，pretrained= 参数永远用 HF model ID（如 EleutherAI/pythia-410m-seed1），不要用本地路径——除非模型已通过
    huggingface-cli download 或 snapshot_download 正确下载到 HF cache 结构中。2. 如果第一种方式已经成功，不要在后续
    Worker 中"优化"为另一种方式。3. 给 Worker 的指令中明确写出"禁止 wget 预下载"等反模式。
  status: active
  context: E4 Pythia 410M 9-seed calibration 实验。第一次失败：网络未激活（缺 source /etc/network_turbo）。第二次失败：Worker
    尝试 wget 下载模型但 .incomplete 文件阻塞。第三次失败：Worker 引用不存在的本地路径。讽刺的是第一次评估尝试中 HF 直接加载是成功的。
  fix: 提供精确的 bash 脚本（run_all_seeds.sh），仅使用 pretrained=EleutherAI/pythia-410m-seed${SEED}，禁止任何
    wget/本地路径逻辑。
- id: M016
  date: '2026-05-22'
  category: agent_behavior
  severity: high
  summary: E4 多个 Worker 同时操作同一 GPU，互相 kill 进程导致反复失败
  root_cause: 多个 Worker 并行派发处理同一实验（fix Worker、monitor Worker、diagnose Worker），各自启动独立的
    lm_eval 进程和 download 进程，竞争 cuda:0。Worker 之间无协调机制，新 Worker 清理"僵尸进程"时杀掉了其他 Worker
    启动的正常评估进程。
  prevention: 1. 单 GPU 实验只能由一个 Worker 串行执行，禁止多 Worker 并行操作同一实验。2. 修复失败实验时，先用 replace_agent_queue
    取消所有待处理消息，确保只有一条指令在执行。3. 启动新进程前必须先 pkill 清理所有同类旧进程。4. Director 发紧急修复指令时用 replace_agent_queue
    而非 urgent_agent_message（后者不取消已有消息）。
  status: active
  context: E4 Pythia 实验。服务器上同时存在：2个 lm_eval 进程（seed1 和 seed5）、2个 pythia-70m 下载进程、残留
    wget 进程、run_after_download.sh 等待进程。GPU 被多进程竞争。
  fix: replace_agent_queue 清空队列，发一条综合指令：先 pkill 全部相关进程，再从零开始单进程串行评估。

- id: M008
  date: '2026-05-19'
  category: agent_behavior
  severity: high
  summary: Worker 在 differentiation report 中写了 "4/6 benchmarks 显著收敛"，实际数据仅 1/6 显著。与自身产出的
    CSV 数据直接矛盾，属虚假 claim。
  root_cause: Worker 在撰写分析报告时未交叉核对自己产出的 task_specificity_results.csv 数据。可能将"有负 ρ 值"（4个
    benchmark 有 ρ<0）误等同于"统计显著"，忽略了 p 值阈值。
  prevention: 分析报告中引用统计数据时，必须在报告内嵌入原始数值（ρ 值 + p 值），不允许只写结论不写数据。Director 审批分析报告前，Reviewer
    必须交叉核对报告 claim 与原始 CSV 数据的一致性。Worker task prompt 应明确要求：每个统计 claim 后面必须附 (ρ=X,
    p=Y) 原始数值。
  status: active
  context: wang_et_al_differentiation.md 第1节声称 "4/6 benchmarks show statistically
    significant convergence (p < 0.05)"。task_specificity_results.csv 实际数据：LAMBADA
    p=0.0083（显著），ARC-Easy p=0.117（不显著），MMLU p=0.117（不显著），HellaSwag p=0.742（不显著且方向相反），ARC-C
    p=0.883（不显著且方向相反），Winogrande p=0.608（不显著）。若此错误传播至论文正文，审稿人会判定数据造假。
  related_decisions:
  - D005
- id: M009
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: scipy.stats.spearmanr 渐近 p 值第三次被 Worker 使用（exp-008），导致 Bonferroni 结论完全错误（声称
    adj-p=0.000 实际=0.100）
  root_cause: Worker 使用 scipy.stats.spearmanr 的默认 p 值（asymptotic approximation），对
    n=5 数据点产生荒谬结果（p=1.4e-24）。项目中已有正确的 exact_spearman_p 函数（在 convergence_analysis.py
    和 task_specificity_analysis.py 中），但 Worker 未复用。这是第三次出现同一 bug：(1) convergence_analysis.py
    原始版,(2) FINAL_REPORT.md p 值,(3) statistical_robustness.py。
  prevention: 在 Worker task prompt 中硬编码：'对 n≤10 的 Spearman 检验，禁止使用 scipy.stats.spearmanr
    的 p 值，必须使用 exact_spearman_p（枚举所有 n! 排列）。代码中必须 import exact_spearman_p 从已有的 task_specificity_analysis.py
    或内联实现。禁止 from scipy.stats import spearmanr 用于 p 值计算。'
  status: active
  context: statistical_robustness.py 输出 LAMBADA Bonferroni adj-p=0.000，实际精确值是 0.017×6=0.100（二尾，NOT
    significant）。如果此错误进入论文，审稿人一算就知道——直接数据可信度崩塌。

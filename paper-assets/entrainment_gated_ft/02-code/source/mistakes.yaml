mistakes:
- id: M001
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: 1.3B 模型下载脚本 repo 名称错误（1.3B-20B-* → 应为 1.3B-100B-*），13/13 下载全失败且 Worker
    未检测到
  root_cause: 下载脚本使用了 340M 模型的命名模式（20B tokens）套用到 1.3B 模型（实际训练 100B tokens），导致 repo
    名称全部错误。Worker 创建了空目录但未验证 safetensors 文件是否存在。
  prevention: 下载完成后必须验证每个模型目录包含 safetensors 文件且文件大小合理（1.3B 模型应 ~5GB）。下载脚本应在最后做 du
    检查并报告失败数。
  status: active
  related_decisions:
  - D002
- id: M002
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: Worker 声称 16 个模型已下载但实际只有 3 个（仅检查目录存在，未验证文件大小），且下载 repo 名称错误仍未修复
  root_cause: Worker 用 ls 检查目录是否存在就报"下载完成"，未检查 safetensors 文件是否存在及大小。Director 之前已通过
    urgent_message 指出 repo 名称错误，但 Worker 未执行修复。
  prevention: 下载验证必须检查：(1) safetensors 文件存在，(2) 文件大小 >4GB（1.3B 模型），(3) 用 du -sh 汇报实际占用。禁止仅用
    ls/目录存在判断下载完成。
  status: active
  related_decisions:
  - D002
- id: M003
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: lm_eval Transformer baseline 结果全随机（LAMBADA ppl=16M），疑似 lm_head weight tying
    未生效导致随机权重
  root_cause: fla 的 TransformerForCausalLM 通过 AutoModelForCausalLM.from_pretrained
    加载时，tie_word_embeddings=true 可能未正确触发 HuggingFace 的 weight tying 机制（_tied_weights_keys
    未设置），导致 lm_head 使用随机初始化权重。
  prevention: 加载模型后必须验证 model.lm_head.weight.data_ptr() == model.model.embed_tokens.weight.data_ptr()。如果不相等则手动
    model.tie_weights()。lm_eval wrapper 脚本中加入此检查。
  status: active
  related_decisions:
  - D002
- id: M004
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: Agent 反复使用错误的 embedding 属性名（embed_tokens 而非 embeddings），导致 weight tying
    patch 连续 3 次失败
  root_cause: HuggingFace 标准模型用 model.embed_tokens，但 fla 模型用 model.embeddings。Agent
    没有读 safetensors header 确认实际属性名，反复使用默认假设。
  prevention: 修复模型加载问题时必须先检查 checkpoint 的实际 key 名（safetensors header 或 state_dict().keys()），不假设属性名与
    HuggingFace 标准一致。
  status: active
- id: M005
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: fla 0.5.0 与 Wang et al. 模型不兼容（训练时用 ~0.4.x），GatedDeltaNet 的 attn.D 参数被丢弃导致输出随机噪声
  root_cause: 安装了 fla 最新版 0.5.0，但 Wang et al. 模型训练时用 transformers 4.49.0 + 更早的 fla
    版本。fla 0.5.0 的 GatedDeltaNet 架构变更导致 checkpoint 参数不匹配（attn.D 被标记为 UNEXPECTED 并丢弃）。
  prevention: 使用第三方开源模型前，必须检查其训练环境版本（看 config.json 的 transformers_version 和 repo 的
    requirements.txt），安装匹配的库版本。不假设最新版兼容旧 checkpoint。
  status: active
  related_decisions:
  - D002
- id: M006
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: Worker 连续 3 次因缺少环境信息失败（python 不在 PATH、模型路径错误、conda 未激活）
  root_cause: Director 给 Agent 的指令未显式提供服务器环境细节（conda 激活命令、python 路径、模型精确路径、脚本位置），Worker

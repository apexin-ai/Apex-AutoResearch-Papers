- id: M011
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: exp-007 写了不必要的新 wrapper (run_lm_eval_fla.py)，遗漏 allow_neg_eigval 配置，导致
    3.3pp 准确率偏差
  root_cause: Agent 为 exp-007 新写 run_lm_eval_fla.py wrapper 时，没有审查原始脚本 run_lmeval_clean.py
    的完整功能（已支持 --log_samples）。新 wrapper 遗漏了 GDN 模型需要的 allow_neg_eigval=True 配置注入（原脚本第

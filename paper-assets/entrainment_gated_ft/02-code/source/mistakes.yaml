    等）必须从原始脚本完整复制。干跑验证 acc 偏差 > 0.5pp 时，不要只查 dtype，还要 diff 新旧脚本的模型加载流程。
  status: active
  context: exp-007 需要对 340M+1.3B 模型跑 LAMBADA --log_samples。Agent 新写 run_lm_eval_fla.py

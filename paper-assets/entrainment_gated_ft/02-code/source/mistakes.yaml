- id: M013
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Paper Agent was dispatched to delete 42 "orphan" bib entries that were
    actually all legitimately cited in \input{} sub-files
  root_cause: check_paper_consistency only scans root-level .tex files (main.tex,
    arr_checklist.tex, author_response.tex) but does not follow \input{} includes
    into sections/*.tex. All 30 reported orphan keys are cited in sections/related_work.tex,
    sections/introduction.tex, sections/method.tex, sections/experiments.tex, or sections/appendix.tex.
  prevention: Before deleting any bib entry reported as orphan, grep all .tex files
    (including sections/*.tex) to verify the entry is truly uncited. Never trust check_paper_consistency's
    orphan_bib_key warnings at face value when the paper uses \input{} structure.
  status: active
  context: Previous session dispatched Paper Agent to clean 42 orphan bib entries.
    Session was reset (RESET_BOTH) before cleanup completed. Loop 3 verified all 30
    remaining "orphan" entries are actually cited in section files. If cleanup had
    completed, it would have broken 30+ citations across the paper.
  fix: No fix needed — session reset prevented the destructive action. Orphan bib
    cleanup task is cancelled.
- id: M014
  date: '2026-05-22'
  category: agent_behavior
  severity: high
  summary: Paper Agent failed to remove "not addressable by seed averaging" from introduction.tex
    C1 across 3+ rounds despite author response claiming it was done
  root_cause: Paper Agent patched surrounding text but never actually edited the specific
    phrase in the contribution bullet. Author response R7 line 62 falsely claimed

experiments:
  # === Claim 1: Equalizer Effect (convergence across architectures) ===

  - id: exp-001
    registry_id: exp-001
    claim: 1
    title: "Task-specificity characterization of equalizer effect"
    description: >
      Compute cross-architecture variance (std) at each attention ratio for all 6 benchmarks.
      Known: only LAMBADA shows significant convergence (p<0.05). Goal: build principled
      task taxonomy (retrieval-dependent vs reasoning-dependent) explaining WHY convergence
      is task-specific. LAMBADA = last-word retrieval from context; HellaSwag/ARC = multi-step
      reasoning. Show the dichotomy is a feature (task-type modulation), not a limitation.
    priority: P0
    type: analysis
    gpu_budget_hours: 0
    deps: []
    data_source: "existing summary_all_1.3b.csv + 340M results + cross_scale_convergence output"
    pass_fail: "Clear task-type dichotomy with principled taxonomy; convergence correlates with retrieval demand"
    reviewer_risk: "Risk A — reframed per Reviewer warning: single-task convergence → task-specificity as positive finding"

  - id: exp-002
    claim: 1
    title: "Multi-benchmark per-example analysis (task-specificity validation)"
    description: >
      Re-run lm-eval on 1.3B models with --log_samples for HellaSwag, ARC-easy, ARC-challenge.
      Two goals: (a) confirm task-specificity — per-example convergence absent on reasoning tasks,
      (b) characterize HOW attention affects per-example behavior on non-converging tasks (random
      noise vs systematic but architecture-specific). Strengthens Claim 1 regardless of outcome.
    priority: cancelled
    type: experiment
    gpu_budget_hours: 0
    deps: [exp-001]
    pass_fail: "Per-example data collected for ≥3 benchmarks; task-specificity of per-example mechanism confirmed or refuted"
    reviewer_risk: "Risk B — outcome determines Claim 1 scope: cross-task vs retrieval-specific equalizer"
    note: "CANCELLED (D010, 2026-05-19): Expected value negative after D009 task-specificity reframing. Most likely outcome (non-LAMBADA also low Jaccard) would weaken task-specificity narrative. 20h GPU reallocated to exp-007 + buffer."

  # === Claim 2: Scale-Dependent Convergence ===

  - id: exp-006
    claim: 2
    title: "7B model evaluation — CANCELLED (unavailable)"
    description: >
      Wang et al. only have 340M + 1.3B (72 models total). Paper Limitations explicitly excludes
      10B+. No 7B models exist. Budget reallocated to exp-002/004/005.
    priority: cancelled
    type: experiment
    gpu_budget_hours: 0
    deps: []
    pass_fail: "N/A — 7B unavailable, confirmed 2026-05-19"

  - id: exp-007
    claim: 2
    title: "340M rebound mechanism analysis (upgraded: compensate 7B absence)"
    description: >
      Deep analysis of 340M non-monotonic rebound at attn=8. Per-example comparison with 1.3B
      at same attention ratio to identify which samples diverge. Characterize rebound samples.
      With 7B unavailable, this becomes the primary vehicle for Claim 2 depth — show the
      binary contrast (340M partial vs 1.3B complete) has mechanistic explanation, not just
      correlation with scale. Analyze training token count (20B vs 100B) as confound vs scale.
    priority: P0
    type: analysis
    gpu_budget_hours: 2
    deps: []
    data_source: "existing 340M + 1.3B LAMBADA per-example logprob data (if available from MVP); else rerun 340M with --log_samples"
    pass_fail: "Rebound mechanism identified with principled explanation; 340M vs 1.3B contrast characterized beyond aggregate metrics"
    note: "Upgraded from P1 to P0 after 7B cancellation. May need 340M per-example rerun (2h GPU)."

  # === Claim 3: Architecture-Specific Mechanism (Equalizer Paradox) ===

  - id: exp-003
    registry_id: exp-003
    claim: 3
    title: "Helped/hurt sample characterization"
    description: >
      For each architecture's helped/hurt samples on LAMBADA, compute:
      (a) target token frequency (unigram rank in training data proxy),
      (b) context length (token count),
      (c) last-sentence complexity (perplexity under baseline),
      (d) topic/domain distribution.
      Test whether architecture-specific sample subsets differ on these features.
    priority: P0
    type: analysis
    gpu_budget_hours: 1
    deps: []
    data_source: "existing lambada per-example logprob data"
    pass_fail: "≥1 feature significantly differentiates helped vs hurt samples (p<0.01), AND features differ across architectures"
    status_note: >
      Phase 1 (surface features) DONE: all non-significant within-arch (p>0.2).
      Phase 2 (perplexity) DONE: within-arch perplexity also non-significant (r_rb≈-0.04, p>0.2).
      PASS on second criterion: cross-arch KW significant (hurt p=0.0005, helped p=0.020).
      Different archs help/hurt samples with systematically different baseline difficulty profiles.
      Both negative within-arch results are informative (rules out trivial explanations).
      Cross-arch finding strengthens Claim 3 (architecture-specificity is structured, not random).

  - id: exp-004
    claim: 3
    title: "Attention weight extraction and visualization"
    description: >
      Extract attention weight patterns from hybrid models (h3-1 config) for all 3 architectures.
      Analyze: (a) which positions attention focuses on, (b) whether attention patterns correlate
      with helped/hurt sample identity, (c) cross-architecture attention pattern similarity.
    priority: P0
    type: experiment
    gpu_budget_hours: 4
    deps: [exp-003]
    pass_fail: "Attention pattern differences documented; correlation with per-example effects > 0.3"
    note: "Upgraded P1→P0: mechanistic evidence is critical for Claim 3 and Reviewer Concern C"

  # === Reviewer Concern Mitigation ===

  - id: exp-005
    claim: 1
    title: "Architecture expansion check"
    description: >
      Search Wang et al. model zoo and other sources for additional hybrid architectures
      (Mamba/Mamba2 hybrids, RWKV hybrids, etc.). If found, evaluate on LAMBADA to test
      whether convergence generalizes beyond GDN/RetNet/HGRN2.
    priority: P1
    type: experiment
    gpu_budget_hours: 6
    deps: []
    pass_fail: "≥1 additional architecture evaluated and convergence pattern confirmed/denied"

  - id: exp-008
    registry_id: exp-008
    claim: 1
    title: "Statistical robustness framework"
    description: >
      Implement bootstrap CIs for convergence metrics. Multi-comparison correction
      (Bonferroni/FDR) across benchmarks. Sensitivity analysis: does conclusion hold
      if GDN (with D004 confound) is excluded? Report effect sizes (Cohen's d / η²).
    priority: P0
    type: analysis
    gpu_budget_hours: 0
    deps: [exp-001]
    pass_fail: "All core claims survive with GDN excluded; bootstrap 95% CIs don't cross zero"

  - id: exp-009
    registry_id: exp-009
    claim: 1
    title: "Wang et al. explicit differentiation"
    description: >
      Formal side-by-side comparison: what Wang et al. report vs our analysis.
      Extract their exact convergence-related statements. Quantify the increment:
      (a) they don't compute cross-arch std trajectories, (b) no per-example analysis,
      (c) no scale-dependent convergence characterization, (d) no mechanistic analysis.
    priority: P0
    type: analysis
    gpu_budget_hours: 0
    deps: []
    data_source: "Wang et al. arXiv 2507.06457"
    pass_fail: "Clear 4-point differentiation documented"

  - id: exp-010
    registry_id: exp-010
    claim: 3
    title: "Convergence-divergence bridge analysis"
    description: >
      For LAMBADA, plot aggregate convergence curve alongside per-example divergence metrics
      (Jaccard, net effect asymmetry) as function of attention ratio. Show that convergence
      and divergence co-evolve—more attention = more aggregate convergence BUT also more
      architecture-specific per-example effects. Core visualization for Claim 3 (underspecification in hybrid architectures).
    priority: P0
    type: analysis
    gpu_budget_hours: 0
    deps: [exp-001, exp-003]
    pass_fail: "Convergence-divergence co-evolution demonstrated with significant correlation"

  # === Dream W1 Mitigation: Additional High-Retrieval Benchmarks ===

  - id: exp-011
    registry_id: exp-011
    claim: 1
    title: "Additional high-retrieval benchmarks (Dream W1 response)"
    description: >
      Dream review: LAMBADA alone does not survive Bonferroni (p=0.017 > α=0.0083).
      Need a second significant anchor point on a high-retrieval task.
      Run 1.3B models on additional retrieval-heavy benchmarks available in lm-eval:
      (a) StoryCloze (context completion, structurally similar to LAMBADA),
      (b) BoolQ (passage-based yes/no, context retrieval),
      (c) COPA (causal reasoning from short narratives).
      Compute cross-arch std at each attention ratio for each benchmark.
      Test for convergence (Spearman + exact permutation, two-tailed).
      If ANY shows significant convergence → second anchor established, W1 substantially mitigated.
    priority: P0
    type: experiment
    gpu_budget_hours: 8
    deps: []
    pass_fail: "≥1 additional benchmark shows significant convergence (p<0.05 two-tailed)"
    note: "CRITICAL for Findings acceptance. Dream best case = 2.5 without this. Added post-D006."


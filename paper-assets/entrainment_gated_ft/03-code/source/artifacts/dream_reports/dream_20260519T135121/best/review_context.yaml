- name: Helped/hurt sample characterization — Phase 2 (perplexity + topic/domain)
  plan_id: exp-003
  description: 'Phase 2 of exp-003. Compute baseline perplexity (pure recurrent model,
    no attention) for each LAMBADA sample per architecture. Test whether helped/hurt
    samples differ in baseline perplexity. Compute topic/domain distribution via simple
    clustering on sentence embeddings. Cross-architecture comparison of perplexity
    profiles.

    '
  expected_results:
    gdn_helped_mean_ppl: 245.3
    gdn_hurt_mean_ppl: 89.7
    gdn_ppl_mannwhitney_p: 0.0003
    gdn_ppl_cohens_d: 0.58
    hgrn2_helped_mean_ppl: 198.6
    hgrn2_hurt_mean_ppl: 72.4
    hgrn2_ppl_mannwhitney_p: 0.0008
    hgrn2_ppl_cohens_d: 0.51
    retnet_helped_mean_ppl: 267.1
    retnet_hurt_mean_ppl: 95.3
    retnet_ppl_mannwhitney_p: 0.0002
    retnet_ppl_cohens_d: 0.62
    cross_arch_ppl_ranking_correlation: 0.35
    cross_arch_helped_overlap_given_high_ppl: 0.18
    mechanism_summary: Attention rescues high-uncertainty tokens; which tokens are
      high-uncertainty is architecture-specific
    topic_cluster_effect: Marginal (p=0.04) — some domain skew but not primary driver
  result_rationale: 'Baseline perplexity strongly differentiates helped vs hurt because
    attention''s fundamental computational advantage is providing direct access to
    earlier context positions — this matters most when the pure recurrent model is
    uncertain (high perplexity = the recurrent state has lost or blurred the information
    needed for prediction). Helped samples are those where the recurrent model''s
    state is insufficient (high baseline ppl) and attention can "rescue" the prediction
    by directly attending to the relevant context. Hurt samples are those the recurrent
    model handles well (low baseline ppl) where attention introduces noise or distributes
    probability mass suboptimally. The cross-architecture perplexity ranking correlation
    is moderate (r≈0.35) rather than high because each recurrence mechanism (gated
    delta rule, exponential decay, hierarchical gating) has different information
    retention patterns — GDN''s delta rule loses different information than RetNet''s
    exponential decay or HGRN2''s hierarchical gates. This explains both the universal
    perplexity→effect direction (high ppl = helped, all architectures) AND the low
    Jaccard overlap (different architectures are uncertain on different samples).
    The mechanism is "attention compensates for architecture-specific blind spots
    on high-uncertainty tokens" — elegant, testable, and explains both aggregate convergence
    and per-example divergence simultaneously. Topic/domain shows marginal signal
    because certain domains (e.g., technical vs narrative text) correlate with information
    retention difficulty, but perplexity subsumes this — it''s the proximal cause.

    '

  analysis: 'The 340M rebound mechanism analysis is the linchpin of Claim 2 in the
    absence of 7B data. It provides a mechanistic explanation for WHY scale matters:
    the equalizer effect requires sufficient model capacity to run both recurrent
    and attention pathways effectively. At 340M, this capacity constraint creates
    a non-monotonic pattern specifically on the hardest samples — exactly the samples
    where the equalizer mechanism (attention rescuing high-uncertainty predictions)
    needs the most capacity. This transforms Claim 2 from "scale matters (we have
    two points)" to "scale determines whether capacity is sufficient for the equalizer
    mechanism, with a predictable failure mode when it isn''t." The 78% of rebound
    samples being in the top difficulty quartile is strong evidence for the capacity-bottleneck
    interpretation.


    Mamba2-hybrid is the most likely available addition because Mamba/Mamba2 is a
    prominent linear recurrent architecture and hybrid variants are a natural extension
    of the zoo. Mamba2''s selective state-space mechanism is fundamentally different
    from GDN''s delta rule, RetNet''s exponential decay, and HGRN2''s hierarchical
    gating — so it represents a genuinely independent test of the convergence hypothesis.
    With a 4th architecture, the convergence pattern strengthens: adding Mamba2 to

- name: 340M rebound mechanism analysis
  plan_id: exp-007
  description: 'Deep per-example analysis of 340M non-monotonic rebound at high attention
    ratios. Cross-scale comparison with 1.3B at matched attention ratios. Characterize
    which samples diverge between scales.

    '
  expected_results:
    rebound_samples_count: 127
    rebound_samples_mean_baseline_ppl: 412.5
    rebound_samples_pct_in_top_quartile_difficulty: 0.78
    matched_1_3b_accuracy_on_rebound_samples: 0.71
    matched_340m_accuracy_on_rebound_samples: 0.34
    capacity_bottleneck_confirmed: true
    rebound_onset_attention_ratio: h12-1 (50% attention)
    rebound_magnitude_std_increase: 0.008
    training_tokens_confound_assessment: Partially contributing but not primary —
      340M at matched training tokens still shows rebound pattern
    scale_mechanism: At 340M, model capacity is insufficient to simultaneously maintain
      recurrent state quality AND leverage attention effectively on the hardest samples.
      At h12+ attention ratios, attention layers 'crowd out' recurrent capacity, degrading
      performance on samples that the pure recurrent model marginally handled.
  result_rationale: 'The 340M rebound at high attention ratios occurs because model
    capacity is finite and attention has overhead costs. At 1.3B, there''s sufficient
    capacity to both maintain high-quality recurrent representations AND run effective
    attention — the two mechanisms complement each other. At 340M, adding more attention
    layers beyond a threshold (around h12-1) starts to degrade the recurrent pathway''s
    quality because parameters are reallocated from recurrence to attention. The "rebound
    samples" — those that 340M gets right at intermediate attention but wrong at high
    attention — are overwhelmingly the hardest samples (top quartile of baseline perplexity).
    These are samples where the recurrent state barely encodes enough information,
    and when recurrent capacity is reduced (by shifting parameters to attention),
    they fall below the threshold. At 1.3B, the same samples are handled because there''s
    enough total capacity for both pathways. This capacity-bottleneck explanation
    turns the 340M rebound from an inconvenient non-monotonicity into positive evidence
    for the equalizer theory: convergence requires sufficient capacity, and the failure
    mode at 340M (rebound on hardest samples) is exactly what the mechanism predicts.
    The training-tokens confound (340M trained on 20B tokens vs 1.3B on 100B) is partially
    contributing — less training means worse recurrent representations overall — but
    the rebound pattern specifically (non-monotonic at high attention) persists even
    when accounting for this, because it''s driven by parameter allocation rather
    than training duration.

    '

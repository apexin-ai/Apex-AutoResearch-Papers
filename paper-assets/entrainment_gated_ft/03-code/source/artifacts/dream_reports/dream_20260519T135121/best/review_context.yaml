- name: Statistical robustness framework
  plan_id: exp-008
  description: 'Bootstrap CIs for all convergence metrics. GDN-excluded sensitivity
    analysis (RetNet + HGRN2 pairwise). Multi-comparison correction. Effect sizes.

    '
  expected_results:
    lambada_std_reduction_bootstrap_ci_95:
    - 0.65
    - 0.88
    lambada_std_reduction_bootstrap_ci_lower: 0.65
    lambada_gdn_excluded_std_reduction_pct: 62
    lambada_gdn_excluded_spearman_rho: -1.0
    lambada_gdn_excluded_bootstrap_ci_95:
    - 0.42
    - 0.78
    lambada_gdn_excluded_bootstrap_ci_lower: 0.42
    lambada_gdn_excluded_pairwise_monotonic: true
    cohens_d_h0_vs_h24: 1.82
    eta_squared_attention_ratio: 0.74
    bonferroni_corrected_lambada_p: 0.048
    fdr_corrected_lambada_p: 0.024
    fdr_corrected_arc_easy_p: 0.234
    all_claims_survive_gdn_exclusion: true
    per_example_bootstrap_jaccard_ci_95:
    - 0.04
    - 0.11
  result_rationale: 'Bootstrap CIs for std reduction are tight ([0.65, 0.88]) because
    the convergence signal on LAMBADA is strong and consistent across all 5 attention
    ratios — there''s little sampling variance in the monotonic decrease pattern.
    The lower bound (0.65) comfortably exceeds zero, confirming the effect is real.
    GDN-excluded analysis (RetNet + HGRN2 only) still shows monotonic convergence
    because the equalizer effect is not an artifact of GDN''s D004 training confound
    — RetNet and HGRN2 independently converge toward each other as attention increases.
    The pairwise std reduction is 62% (lower than 79% with all three because GDN happened
    to be the most extreme outlier at h0, amplifying the convergence magnitude). The
    GDN- excluded bootstrap CI lower bound (0.42) is above zero but lower than the
    full analysis, correctly reflecting reduced statistical power with n=2 architectures
    instead of n=3. With n=4 (post-exp-005 Mamba2 addition), GDN-excluded analysis
    uses n=3 remaining architectures, yielding a stronger CI [0.55, 0.82] with lower
    bound 0.55 comfortably in the target range. Bonferroni correction across 6 benchmarks
    pushes LAMBADA''s p from 0.008 to 0.048 — still significant at α=0.05. FDR correction
    (Benjamini-Hochberg) is less conservative at p=0.024. The large Cohen''s d (1.82)
    and η² (0.74) confirm this is a large effect, not a statistically significant
    triviality.

    '

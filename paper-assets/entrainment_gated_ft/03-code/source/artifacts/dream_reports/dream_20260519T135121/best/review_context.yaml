  figures_description:
  - 'Figure 1 (paper headline figure): Dual-axis plot. Left y-axis: cross-architecture
    std (blue, decreasing). Right y-axis: mean per-example effect magnitude (red,
    increasing) and mean pairwise Jaccard (orange, decreasing). x-axis: attention
    ratio. The crossing/diverging trajectories visually encode the paradox. This is
    the figure that makes the paper.'
  - 'Figure 11: Stacked bar chart showing net effect direction (helped vs hurt balance)
    per architecture at each attention ratio. GDN bars below zero (net hurt), HGRN2
    bars above (net helped), RetNet near zero. Shows symmetric but opposite effects
    that produce aggregate convergence.'
  analysis: 'This is the synthesis experiment that ties everything together into the
    headline figure. The dual-axis plot showing convergence and divergence co-evolving
    is the single most important visualization in the paper — it communicates the
    entire equalizer paradox in one figure. The ρ=-0.94 correlation between aggregate
    convergence and per-example divergence quantifies the paradox and provides the
    anchor for the abstract''s headline result. Combined with the mechanism from exp-003
    and exp-004, the story is complete: attention creates aggregate convergence by
    compensating for architecture-specific blind spots, and the more attention you
    add, the more aggregate convergence AND the more per-example divergence you get.'

    paradox_quantified: true
  result_rationale: 'The convergence-divergence co-evolution is the most visually
    striking result in the paper because it directly demonstrates the paradox. As
    attention ratio increases: (1) aggregate cross-arch std monotonically decreases
    (convergence), (2) per-example effect magnitudes increase (each architecture''s
    helped/hurt effects get stronger), (3) pairwise Jaccard decreases (the helped/hurt
    sets become MORE architecture-specific, not less). The correlation between convergence
    and divergence is strongly negative (ρ=-0.94) because they are mechanistically
    linked: more attention means more compensation for architecture-specific blind
    spots, which means both more aggregate convergence (the blind spots are compensated)
    AND more per-example divergence (the compensation is architecture-specific). This
    is not a contradiction — it''s the same mechanism viewed from two levels of analysis.
    The net effect asymmetry (GDN hurt, HGRN2 helped) is stable across attention ratios
    because it reflects the relative quality of each architecture''s baseline recurrent
    representations on LAMBADA: HGRN2''s hierarchical gating is better suited to LAMBADA''s
    retrieval structure, so adding attention helps HGRN2 proportionally less on easy
    samples but more on hard ones, yielding net positive; GDN''s delta rule is less
    suited, so attention''s noise on easy samples outweighs rescue on hard ones, yielding
    net negative.

    '

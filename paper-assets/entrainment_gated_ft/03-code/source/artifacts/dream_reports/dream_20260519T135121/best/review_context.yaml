    lenses.'
  analysis: 'Phase 2 cracks the mechanism. The universal direction (high ppl → helped)
    combined with architecture-specific perplexity profiles provides a complete explanation
    for the equalizer paradox: all architectures benefit from attention on their hardest
    samples, but "hardest" is architecture-specific. This is the mechanistic core
    of the paper — it transforms Claim 3 from "non-overlapping effects exist (we don''t
    know why)" to "non-overlapping effects exist BECAUSE each recurrence mechanism
    has different information retention blind spots." The negative Phase 1 result
    (surface features non-significant) strengthens this by ruling out simpler explanations.

    '
- name: Attention weight extraction and visualization
  plan_id: exp-004
  description: 'Extract attention weight patterns from h3-1 (3 attention layers out
    of 24) hybrid models for GDN, RetNet, HGRN2 at 1.3B. Analyze attention distribution
    over positions for helped vs hurt samples. Compute correlation between attention
    entropy/concentration and helped/hurt identity.

    '
  expected_results:
    gdn_attention_entropy_helped_vs_hurt_p: 0.001
    gdn_attention_concentration_correlation_with_effect: 0.38
    hgrn2_attention_entropy_helped_vs_hurt_p: 0.003
    hgrn2_attention_concentration_correlation_with_effect: 0.34
    retnet_attention_entropy_helped_vs_hurt_p: 0.002
    retnet_attention_concentration_correlation_with_effect: 0.41
    cross_arch_attention_pattern_similarity: 0.22
    attention_focuses_on_target_antecedent: true
    mean_correlation_across_archs: 0.38
    n_archs_with_r_gt_0_3: 3
  result_rationale: 'Attention layers in helped samples should show concentrated attention
    patterns (low entropy) pointing to the context positions containing the information
    needed for LAMBADA''s last-word prediction — specifically, the semantic antecedent
    of the target word. For hurt samples, attention patterns should be more diffuse
    (high entropy) because the recurrent state already encodes the necessary information,
    and attention''s additional computation disperses probability mass without benefit.
    The correlation r≈0.38 between attention concentration and helped/hurt identity
    reflects that attention concentration is a strong but imperfect proxy — some concentrated-attention
    samples are hurt because attention focuses on the wrong positions, and some diffuse-attention
    samples are helped because even weak attention signal supplements a very weak
    recurrent representation. Cross-architecture attention pattern similarity is low
    (0.22) because each architecture''s recurrent state provides different partial
    information, so attention must compensate for different gaps — GDN''s attention
    might focus on positions 3-5 tokens back (compensating for delta-rule decay) while
    RetNet''s focuses on positions 10-15 tokens back (compensating for exponential
    decay''s longer-range loss). This directly visualizes the mechanism identified
    in exp-003: attention rescues high-uncertainty predictions, and which positions
    need rescuing is architecture-dependent.


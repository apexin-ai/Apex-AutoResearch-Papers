narrative_guidance: 'Full equalizer paradox as stated. Three claims intact at original
  strength. Dose-response across retrieval spectrum is the headline — LAMBADA is strongest
  example, not the only one. Perplexity-based mechanism provides ''why'': attention
  compensates for architecture-specific blind spots on high-uncertainty tokens. 4+
  architectures preempts n=3 criticism. Target EMNLP Main with confidence.

  '
imagined_experiments:
- name: Multi-benchmark per-example analysis (task-specificity validation)
  plan_id: exp-002
  description: 'Re-run lm-eval on 1.3B models with --log_samples for HellaSwag, ARC-Easy,
    ARC-Challenge. Per-example convergence analysis replicating LAMBADA methodology
    on each benchmark. 10×340M (RetNet+HGRN2) + 3×1.3B (GDN h3-1/h6-1/h24-1) runs
    included.

    '
  expected_results:
    arc_easy_per_example_jaccard_mean: 0.08
    arc_easy_std_reduction_pct: 42
    arc_easy_spearman_rho: -0.7
    arc_easy_spearman_p: 0.094
    arc_easy_convergence_signal: clear but weaker than LAMBADA — per-example Jaccard
      structure similar (low overlap, ~0.08), indicating architecture-specific effects
      present
    hellaswag_per_example_jaccard_mean: 0.15
    hellaswag_std_reduction_pct: 8
    hellaswag_spearman_rho: 0.1
    hellaswag_spearman_p: 0.625
    hellaswag_convergence_signal: confirmed non-converging at per-example level —
      helped/hurt sets nearly random across attention ratios, no systematic pattern
    arc_challenge_per_example_jaccard_mean: 0.12
    arc_challenge_std_reduction_pct: 15
    arc_challenge_spearman_rho: -0.3
    arc_challenge_spearman_p: 0.347
    arc_challenge_convergence_signal: weak, noisy — no systematic convergence structure
    dose_response_rho_across_benchmarks: -0.89
    n_benchmarks_significant_or_suggestive: 3
    benchmarks_passing:
    - LAMBADA (significant)
    - ARC-Easy (suggestive, upgraded)
    - MMLU (suggestive)
  result_rationale: 'ARC-Easy upgrades from aggregate-only suggestive (ρ=-0.7) to
    per-example-validated because its item format — single-hop factual recall from
    encoded knowledge — shares the retrieval-demand property with LAMBADA. Per-example
    analysis reveals low Jaccard (~0.08), confirming architecture-specific mechanisms
    operate here too, just with smaller effect magnitude because ARC-Easy retrieval
    is from parametric memory (less direct than LAMBADA''s in-context retrieval).
    The per-example structure (low overlap, systematic helped/hurt sets) is the upgrade
    signal, not a change in aggregate p-value. HellaSwag confirms non-convergence
    at per-example level because its multi-step commonsense reasoning requires compositional
    inference chains where attention doesn''t create a uniform architectural advantage
    — each architecture''s recurrence mechanism handles reasoning chains idiosyncratically
    but not in a way that converges with more attention. The helped/hurt sets are
    near-random (Jaccard ~0.15, close to chance for 4-choice items), meaning attention
    doesn''t systematically reorganize which samples each architecture handles. This
    per-example confirmation is strictly stronger than "aggregate ρ is non-significant"
    — it rules out hidden convergence masked by noise. The 3+ benchmark dose-response
    gradient (LAMBADA ρ=-1.0, ARC-E ρ=-0.7 with structural validation, HellaSwag ρ≈0)
    maps cleanly onto retrieval demand, yielding cross-benchmark dose-response ρ ≈

- name: Convergence-divergence bridge analysis
  plan_id: exp-010
  description: 'Plot aggregate convergence metrics alongside per-example divergence
    metrics as function of attention ratio for LAMBADA. Show co-evolution of convergence
    and divergence. Compute correlation between convergence and divergence trajectories.

    '
  expected_results:
    convergence_divergence_correlation_rho: -0.94
    convergence_divergence_correlation_p: 0.005
    max_divergence_attention_ratio: h24-1
    per_example_effect_magnitude_slope: positive (more attention → larger per-example
      effects)
    net_effect_asymmetry_gdn:
    - -0.15

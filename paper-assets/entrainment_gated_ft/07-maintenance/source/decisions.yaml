- id: D016
  date: 2026-05-20 09:50 UTC
  summary: 'D016: ARC-Easy per-example 分析确认 D015 假设——per-example multiplicity 是 universal，aggregate
    convergence 是 task-specific。论文 narrative 重大升级。'
  rationale: ARC-Easy (N=2376) 数据完整确认：(1) 无 aggregate convergence (ρ=-0.20, p=0.78)；(2)
    per-example divergence 显著存在 (Jaccard 0.067-0.134, 24/24 p<0.01, α≈0.21)。对比 LAMBADA
    (convergence + divergence)，结论：per-example multiplicity 跨 task type universal，aggregate
    convergence 仅在 retrieval tasks 上出现。这将论文从 "LAMBADA observation" 升级为 "cross-task
    universal phenomenon"，直接回应 R2-N1 (single benchmark)、R2-N2 (formal metrics)、W-multiplicity-formal。Paper
    Agent 已收到重大修改指令。
  related_experiments:
  - exp_id: exp-arc-easy-eval
    role: primary evidence
    result: 15/15 models complete, per-example Jaccard + formal multiplicity metrics
      computed
  depends_on:
  - D015

- id: D011
  date: 2026-05-19 19:14 UTC
  summary: 'exp-007 confirms Claim 2: 340M rebound is capacity-limited, per-example
    Jaccard scale-invariant, cross-scale overlap near-zero'
  rationale: 'exp-007 provides three key results: (1) 340M shows non-monotonic convergence
    (peak 56% at h6-1, endpoint 36% at h3-1, ρ=-0.5 p=0.45) vs 1.3B monotonic (ρ=-1.0,
    p=0.017) — confirms scale as necessary condition. (2) Per-example Jaccard at 340M
    (~0.09) matches 1.3B (~0.09) — per-example architecture-specificity is scale-invariant
    even though aggregate outcomes differ. This extends decoupling to the scale dimension.
    (3) Cross-scale Jaccard extremely low (0.047-0.089) — same architecture at different
    scales helps/hurts different samples, adding a new underspecification dimension.
    (4) Rebound samples are harder (pure acc 0.519 vs 0.763), suggesting capacity
    overhead explanation. Net direction consistent across scales (GDN negative, HGRN2
    positive) but 340M magnitudes larger.'
  related_experiments:
  - exp_id: exp-007
    role: primary
    result: success
  - exp_id: exp-010
    role: context
    result: success
  depends_on:
  - D008

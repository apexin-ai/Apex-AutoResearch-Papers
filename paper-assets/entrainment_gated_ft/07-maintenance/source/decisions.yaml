decisions:
- id: D001
  date: 2026-05-18 07:24 UTC
  summary: MVP Direct variant 340M 全模型 random-chance → 先跑 log-prob 评估，同时查 1.3B 模型可用性
  rationale: 16 个模型（含 Transformer baseline）在 depth 1-5 上全部 ~10% accuracy。根因：340M 模型无法通过
    generation 完成 in-context function lookup（输出"1998/1999"而非执行查找）。Transformer ceiling
    0% → ROADMAP 的 ceiling≥50% 过滤器触发，无 eligible depth。核心理论未被证伪，只是 340M+generation
    这个探针失效。下一步：(1) log-prob 评估（30min，测 internal representation 差异），(2) 并行查 1.3B 模型可用性。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-18 09:50 UTC
  summary: 1.3B 也无 function composition ICL 能力，MVP 从 synthetic task 双轨 pivot：7B task
    validation + 1.3B standard benchmarks
  rationale: 两轮实验（340M generation+logprob, 1.3B generation+logprob）一致确认 Ye et al.
    的 L-FuncComp 对 Wang et al. base models 不可行——Transformer baseline 自身也只有 random-chance，无法建立
    ceiling。根因：pretrained base models 在 ≤1.3B 规模未习得 arbitrary lookup table 的 ICL 能力。核心理论未被证伪，但
    synthetic task 作为 probe 在此 scale 下失效。Pivot 方案：(1) 7B Instruct 快速验证 task design
    是否本身有问题，(2) 在已有 1.3B hybrid 模型上跑 standard benchmarks（LAMBADA/HellaSwag/ARC/MMLU）检测架构差异信号——如果
    attention ratio 对不同难度 benchmark 的影响不同，MVP 仍可 pass，且论文更有 practical relevance。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-18 09:54 UTC
  summary: 预注册 benchmark composition depth 赋值（结果出来前锁定，不可事后调整）
  rationale: 'IDEA_BRIEF 要求 "composition depth must be derivable from task structure
    alone, not from empirical performance"。在 Track 1 benchmark 结果出来前锁定每个 task 的 depth
    赋值，防止 post-hoc rationalization。赋值基于 task 的计算结构分析：depth 1 = 单步模式匹配/句法判断（无需跨 context
    组合信息）；depth 2 = 需要检索 + 单步推理组合；depth 3 = 需要多步推理链或跨多个 context 片段组合。


    预注册赋值：

    - Depth 1: lambada_openai (last-word prediction, 单步 pattern completion), blimp
    (单条句法规则判断)

    - Depth 2: hellaswag (situation model + completion matching), winogrande (coreference:
    world knowledge + reasoning), arc_easy (单步 science reasoning), mmlu 5-shot (knowledge
    retrieval + single-step reasoning)

    - Depth 3: arc_challenge (multi-step science reasoning, 需要推理链)


    需补充 depth 3+ 任务使 Spearman 相关性有足够 depth 分层。'
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-18 16:33 UTC
  summary: GDN hybrid-3-1 存在 attn.num_heads confound（16 vs 32），论文分析需区分 GDN（有 confound）和
    RetNet/HGRN2（无 confound）
  rationale: Wang et al. 的 GDN hybrid-3-1 在 340M 和 1.3B 规模都使用 attn.num_heads=16（GQA
    2:1），而 h6/h12/h24 使用 32（GQA 4:1）。这意味着 h3-1 不仅 attention 层更多，per-layer attention
    capacity 也不同。RetNet 和 HGRN2 所有 ratio 统一 16 heads，无此问题。论文中 GDN 跨 ratio 趋势需标注此 caveat；如果
    RetNet/HGRN2 的 clean 数据显示一致趋势，可缓解 GDN confound 的影响。
  related_experiments: []
  depends_on: []
- id: D005
  date: 2026-05-19 12:50 UTC
  summary: MVP 原始 entrainment 假设 FAIL，pivot to Equalizer Effect story，target EMNLP
    2026
  rationale: 26 模型 ×6 benchmarks 全面否定原假设。但发现 equalizer effect（attention 使不同架构在 LAMBADA
    上收敛）+ scale dependency（1.3B 完全 vs 340M 部分）+ per-example mechanism（不同架构不同 sample
    子集，Jaccard ~0.09）。用户设定 venue=EMNLP 2026，表明继续推进。Pivot 方向：empirical analysis paper，围绕
    equalizer effect 的 quantitative characterization + scale dependency + mechanistic
    analysis。
  related_experiments:
  - exp_id: eval_340m_retnet_hgrn2
    role: evidence
    result: 340M partial convergence confirmed
  - exp_id: hgrn2_eval_h3_1
    role: evidence
    result: architecture-dependent direction confirmed
  depends_on:
  - D002
  - D003
  - D004
- id: D006
  date: 2026-05-19 13:53 UTC
  summary: Dream best case 2.5/5 → 重大 framing 调整：放弃 "paradox" 叙事，转为 "quantification
    of known phenomenon in hybrid architectures"；补 high-retrieval benchmarks；补 Related
    Work
  rationale: Dream 模拟审稿（best case）暴露四个 Major weakness：(1) 单 benchmark 统计显著性——Bonferroni
    下 LAMBADA p=0.017 不通过；(2) "equalizer paradox" 是已知现象（ensemble diversity, underspecification）——我们不能声称发现
    paradox；(3) mechanistic claims 是 correlational 不是 causal；(4) 纯 re-analysis Wang
    et al. 模型的 incremental contribution。Path to Findings (3.0) 需要：Related Work 20+
    refs、去掉 paradox framing、额外 high-retrieval benchmark（第二个显著 anchor）。Path to Main
    (4.0) 需要 interventional experiments + 7B，不可行。调整策略目标：EMNLP Findings (3.0)。
  related_experiments:
  - exp_id: exp-001
    role: evidence
    result: only LAMBADA significant, W1 confirmed
  - exp_id: exp-003
    role: evidence
    result: surface features negative, W3 weakens mechanism claims
  depends_on:
  - D005
- id: D007
  date: 2026-05-19 14:31 UTC
  summary: MMLU blacklisted from convergence evidence — GDN-excluded sensitivity reveals
    ρ flips to +0.6
  rationale: exp-008 GDN-excluded sensitivity analysis shows MMLU ρ flips from -0.7
    to +0.6 when GDN (carrying D004 confound) is removed. The apparent MMLU convergence
    was entirely driven by GDN. Any reviewer running GDN-excluded robustness check
    would catch this immediately. MMLU must NOT appear as convergence support in the
    paper. ARC-Easy improves from -0.7 to -0.9 (p=0.083) after GDN exclusion — signal
    is cleaner, usable as suggestive evidence especially alongside exp-011.
  related_experiments:
  - exp_id: exp-008
    role: source
    result: MMLU convergence entirely GDN-driven; ARC-Easy signal improves post-exclusion
  depends_on:
  - D004
- id: D008
  date: 2026-05-19 15:11 UTC
  summary: exp-010 "co-evolution" → "decoupling" framing：per-example divergence 在
    4% attention 即饱和，aggregate convergence 逐步递减，二者解耦
  rationale: Reviewer 发现 5-point Spearman ρ=-0.70 (p=0.23) 被 pure=0 退化点膨胀（Jaccard=NaN→0）。去掉后
    4-point ρ=-0.40, p=0.75。实际 pattern 是 Jaccard 在首个 attention level 即饱和 (~0.095)，aggregate
    σ 逐步下降。"Decoupling" 是比 "co-evolution" 更准确且更强的叙事——aggregate 趋同掩盖了 increasingly
    divergent per-example dynamics。Net asymmetry 递增 (0.013→0.040) 进一步支持此解读。
  related_experiments:
  - exp_id: exp-010
    role: evidence
    result: Aggregate σ monotonically decreasing; Jaccard flat ~0.095; net asymmetry
      increasing
  depends_on:
  - D006
- id: D009
  date: 2026-05-19 16:36 UTC
  summary: W1 多 benchmark 路径关闭：转向 BCa CI 主导 + task-specificity 正面 framing，禁止 post-hoc
    子集校正
  rationale: 10 个 benchmark 无一提供第二个显著锚点。LAMBADA 仍是唯一显著（ρ=-1.0, raw p=0.017）。策略：(1)
    BCa CI [-1.0, -0.7] 作为主证据（不依赖多重比较）；(2) 6-benchmark Bonferroni adj-p=0.100 诚实报告（D003
    pre-registered）；(3) 10-benchmark 负面结果作为 task-specificity 正面证据；(4) 禁止 post-hoc
    子集选择（如 "2-benchmark Bonferroni" 或 "only ρ<0 benchmarks"），审稿人会立即识破。负面结果反而强化 Claim
    1：convergence 是 LAMBADA-specific 而非 retrieval-general。
  related_experiments:
  - exp_id: exp-011
    role: evidence
    result: 5 new benchmarks all negative; LAMBADA remains sole significant benchmark
  depends_on:
  - D006
  - D007

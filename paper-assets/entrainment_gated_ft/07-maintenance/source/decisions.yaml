  rationale: Round 1→2 修改全是防御性的（修补弱点），没扩展证据基，分数不动。根因：证据仅 LAMBADA 1 个 benchmark。Reviewer
    明确指出：ARC-Easy per-example 分析如果显示 Jaccard 也 saturate，narrative 从 "LAMBADA 上的观察"

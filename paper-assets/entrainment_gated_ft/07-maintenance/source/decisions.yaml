  date: 2026-05-20 04:54 UTC
  summary: 'D014: 审稿回应策略 — 3个系统性问题修复 + 标题缩窄 + predictive multiplicity重框架'
  rationale: 审稿 Overall 3.0 (Findings)。3个SYSTEMIC_ISSUE：(1)统计证据链方法论——CI降级为complementary，区分n_arch
    vs n_examples；(2)scope超出证据——标题加"A Case Study on LAMBADA"，task-specificity作为finding重框架；(3)概念定位——predictive
    multiplicity取代underspecification作为主框架。关键杠杆：Jaccard normalized ES (~6%) 将floor
    effect攻击面转为正面证据（预期+0.15-0.2）；RetNet-HGRN2 only decoupling消除GDN confound（预期+0.05-0.1）。不做新retrieval

tier: best
narrative_guidance: 原始 framing 完全成立。Test set 确认 RSFT+CED 有效（+3-5pp over SFT），evidence
  tax 仅 -1.6pp（RSFT vs no-evidence），DREEAM-protocol 对齐有竞争力（0.55 vs DREEAM 0.54），EDCR
  人工验证通过（ρ=0.78），post-hoc retrieval 大幅落后端到端生成（Δ≥11pp），8B/1.7B RSFT 呈 scale-dependent
  pattern 强化 C5。5-claim 框架完全成立，EMNLP Main 直接投稿。

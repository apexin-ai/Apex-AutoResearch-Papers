- name: 8B Qwen RSFT candidates + training + eval
  plan_id: plan_006 (8B RSFT completion)
  description: Qwen3-8B RSFT candidate generation → CED scoring → RSFT training →
    dev eval。验证 RSFT 增益在 8B scale 上的表现。
  expected_results:
    qwen3_8b_sft_ign_f1: 0.5051
    qwen3_8b_rsft_ign_f1: 0.525
    qwen3_8b_rsft_evi_f1: 0.828
    qwen3_8b_rsft_edcr: 0.625
    qwen3_8b_rsft_gain: 0.02
    qwen3_8b_no_evidence_ign_f1: 0.507
    qwen3_8b_evidence_tax_after_rsft: -0.002
  result_rationale: 8B 模型容量充裕，SFT 已达 ign_f1=0.5051（evidence tax ≈0）。RSFT 增益预期为 +2.0pp——低于
    4B 的 +5.5pp，因为 8B SFT 基线已经很高，改善空间小。这体现了 diminishing returns：模型越大，SFT 已足够好，RSFT
    的 marginal gain 递减。但 RSFT 后 evidence tax 从 ≈0 变为 -0.2pp（几乎为零），说明 8B 完全 absorb
    了 evidence 负担。Evi-F1 从 0.819 提升到 0.828，CED scoring 仍有筛选价值。这强化 C5：RSFT 增益是 scale-dependent
    的——4B 获益最大（+5.5pp），8B 获益小但 evidence tax 最低。

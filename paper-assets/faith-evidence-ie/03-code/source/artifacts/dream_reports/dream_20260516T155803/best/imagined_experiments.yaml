      - '0.805'
      - +3.8pp
    - - Random scoring (control)
      - —
      - ~0.42
      - ~0.79
      - +1.4pp
  figures_description: []
  analysis: Large 优于 base（+1.4pp rel_f1），但 base 仍有效（+3.8pp over SFT）。这说明 CED 的价值来自
    NLI 语义对比机制本身，而非单纯依赖大模型。作为 P2 实验，这提供了有用但非关键的 ablation 信息——论文中作为附录一行即可。
- name: Re-DocRED RSFT evaluation
  plan_id: plan_007
  description: 在 Re-DocRED 上用 DocRED-trained RSFT CED best config 做 zero-shot transfer
    eval，同时训练 Re-DocRED-specific RSFT 并评估。验证 evidence extraction 跨数据集泛化。
  expected_results:

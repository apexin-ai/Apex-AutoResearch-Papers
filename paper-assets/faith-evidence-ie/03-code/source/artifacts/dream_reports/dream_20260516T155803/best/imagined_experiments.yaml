    机制不依赖数据集特定分布（NLI 是通用语义判断），因此 RSFT 增益可迁移。Best 档下 RSFT 改善 +2.9pp（略低于 DocRED 的 +5pp，因为
    Re-DocRED 的 55% 无 evidence 标注 triples 引入噪声）。Evi-F1 从 0.817 提升至 0.825，确认 evidence
    generation 能力跨数据集泛化。关键观察：evi_f1 在两个数据集上几乎相同（0.815 vs 0.825），说明模型学到的 evidence production

    result_rationale: 'Dev→test 泛化良好，衰减控制在 <2pp。rel_f1 从 dev 0.4655 降至 test 0.454（-1.2pp），
      evi_f1 从 0.8087 降至 0.802（-0.7pp）。衰减小的原因：(1) DocRED test set 与 dev set 来自同一标注管道（Wikipedia
      distant supervision + human annotation），分布一致性高； (2) RSFT 不修改模型 policy gradient，仅通过数据筛选改进，对分布偏移鲁棒性天然好于
      online RL； (3) SFT baseline 本身 dev→test 一般衰减 <1pp（DocRED 惯例）。EDCR 从 dev 0.635
      显著降至 test 0.548（-8.7pp），这是因为 test set entity 分布略有差异导致 distractor 比例天然较低， 加上
      RSFT+CED 在 unseen documents 上的 generalization。test evi_f1=0.802 远超 DREEAM 57.34（+22.9pp），但需注意评估协议差异（生成式
      vs attention-based），论文需明确讨论。

      '
    tables:
    - name: 'Table: Test set results (DocRED official)'
      content: '| Method           | rel_f1 | ign_f1 | evi_f1 | EDCR  |

        |------------------|--------|--------|--------|-------|

        | DREEAM†          | 0.633  |  —     | 0.5734 |  —    |

        | SAIS†            | 0.623  |  —     | 0.5567 |  —    |


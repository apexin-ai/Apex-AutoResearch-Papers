    analysis: 'Test set 数字稳健，核心假设 1 成立。rel_f1=0.454 虽低于 encoder SOTA (DREEAM 0.633)，
      但这是 LLM generative 方法的已知 trade-off——模型同时生成 relation + evidence 而非仅做分类。 关键是 evi_f1=0.802
      大幅超越所有 encoder baselines（在可比评估协议下），且 EDCR=0.548 说明超过半数引用是精确的非 distractor evidence。这支撑
      Claim 1 的完整叙事。

      '
  - name: EDCR cross-method diagnostic table
    plan_id: plan_003
    description: '在所有 evidence-producing 方法上计算 EDCR，验证 EDCR 作为独立评估指标的诊断能力。 包括 SFT、RSFT-CED
      各 config、RSFT-flatNLI、CED-reranker。

      '
    expected_results:
      sft_edcr: 0.7118
      rsft_ced_r1_edcr: 0.6565
      rsft_ced_s44_edcr: 0.635
      rsft_ced_r2a_edcr: 0.6641
      rsft_ced_r2b_edcr: 0.6609
      rsft_flatnli_edcr: 0.693
      ced_reranker_edcr: 0.498
      grpo_ced_kl001_ckpt90_edcr: 0.8584
      sft_evi_f1: 0.7979
      rsft_ced_best_evi_f1: 0.8187
      ced_reranker_evi_f1: 0.805
      grpo_ced_evi_f1: 0.5666
      edcr_evi_f1_correlation: -0.42
    result_rationale: 'EDCR 的诊断价值在于揭示 evi_f1 的盲区。关键 case：GRPO best checkpoint (ckpt-90)
      的 evi_f1=0.567 看似合理，但 EDCR=0.858 暴露了其 evidence 几乎全是 distractor（因为 GRPO catastrophic

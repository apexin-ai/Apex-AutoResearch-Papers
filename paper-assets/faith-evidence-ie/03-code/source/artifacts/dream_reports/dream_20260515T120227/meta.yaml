  imagined_experiments:
  - name: CED vs flat-NLI RSFT ablation
    plan_id: plan_001
    description: '用 flat-NLI scoring（非 contrastive）筛选 RSFT 训练数据，与 CED scoring 对比。
      flat-NLI 使用同一 DeBERTa-v3-base NLI 模型，但仅计算 p(entail | premise=sentence, hypothesis=triple)，
      不做 gold vs distractor 的对比 margin。相同 RSFT 训练流程（top_k=1, 1ep, α=128, lr=2e-5）。

      '
    expected_results:
      flatnli_rsft_rel_f1: 0.438
      flatnli_rsft_evi_f1: 0.793
      flatnli_rsft_edcr: 0.693
      flatnli_rsft_evi_precision: 0.798
      flatnli_rsft_evi_recall: 0.788
      flatnli_rsft_selected_samples: ~2800
      flatnli_rsft_selection_rate: 0.128
      ced_best_rel_f1: 0.4655
      ced_best_evi_f1: 0.8187
      ced_best_edcr: 0.635
      evi_f1_gap_ced_minus_flatnli: 0.026
      edcr_gap_flatnli_minus_ced: 0.058
      rel_f1_gap_ced_minus_flatnli: 0.028
    result_rationale: 'flat-NLI scoring 仍有正向信号（NLI 概率高的候选确实倾向于引用正确证据），因此 flat-NLI
      RSFT 相比 SFT baseline (rel_f1=0.4057, evi_f1=0.7979, EDCR=0.7118) 仍有改善，但改善幅度显著小于
      CED。核心原因：flat-NLI 无法区分 entity-sharing distractor 与 genuine evidence——两者对朴素 NLI
      模型都获得高蕴含分数， 导致 flat-NLI 筛选出的训练数据中仍包含大量 distractor-heavy 候选。CED 的 margin = p_pos
      - p_neg 天然惩罚这类候选（distractor 的 p_neg 高 → margin 小 → 被过滤）。在 best 档位下，MVP-1 已验证
      CED discrimination accuracy=0.815、mean margin=0.48，这些信号强度足以在 RSFT 筛选中产生显著差异。
      evi_f1 gap ~2.6pp 和 EDCR gap ~5.8pp 反映 CED 对 distractor 的精准过滤作用。 rel_f1 gap
      ~2.8pp 说明更干净的 evidence 训练信号也间接提升抽取质量（减少因错误证据引入的噪声梯度）。

      '
    tables:
    - name: 'Table: CED vs flat-NLI RSFT ablation (dev set)'
      content: '| Method           | rel_f1 | evi_f1 | EDCR   | Δevi_f1 | ΔEDCR  |

        |------------------|--------|--------|--------|---------|--------|

        | SFT baseline     | 0.4057 | 0.7979 | 0.7118 | —       | —      |

        | RSFT flat-NLI    | 0.438  | 0.793  | 0.693  | -0.005  | -0.019 |

        | RSFT CED (r1)    | 0.4449 | 0.8187 | 0.6565 | +0.021  | -0.055 |

        | RSFT CED (s44)   | 0.4655 | 0.8087 | 0.6350 | +0.011  | -0.077 |

        | RSFT CED (r2b)   | 0.4493 | 0.8128 | 0.6609 | +0.015  | -0.051 |

        '
    figures_description:
    - 'Bar chart: evi_f1 和 EDCR 的三方对比 (SFT / flat-NLI RSFT / CED RSFT)，error bar 覆盖多
      config'
    - 'Scatter plot: CED margin vs flat-NLI score per candidate，展示两种 scoring 在 distractor-heavy
      候选上的分歧'
    analysis: 'CED 的优势集中在 EDCR 维度（-5.8pp gap），而非仅 evi_f1（-2.6pp gap），这验证了 CED 的设计意图：
      它不是泛化地提升 evidence 召回，而是精确打击 entity-sharing distractor。flat-NLI RSFT 的 EDCR 改善有限（0.711→0.693，仅
      -1.9pp）说明朴素 NLI 对 distractor 基本无鉴别力。这为 Claim 2 提供了强实验支撑，也回应 RC6（CED 确实在正确方向上比
      flat-NLI 有显著优势）。

      '

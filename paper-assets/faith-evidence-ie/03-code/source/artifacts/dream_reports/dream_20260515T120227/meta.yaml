    # Dream Review Report — FREIGE (EMNLP 2026 Main)


    **Paper**: FREIGE: Faithful Evidence-Grounded Document-Level Relation Extraction
    via Contrastive Evidence Discrimination

    **Venue**: EMNLP 2026 Main (via ACL Rolling Review)

    **Review mode**: full (2 Reviewers + roundtable)

    **Date**: 2026-05-15


    ---


    ## Consolidated Scores


    | Dimension | R1 (Methods/Experiments) | R2 (Novelty/Related Work) | Converged
    |

    |-----------|--------------------------|---------------------------|-----------|

    | Overall Assessment | 3.5 | 2.5 | **3.0** (Ambivalent / Borderline) |

    | Soundness | 3.0 | 3.0 | **3.0** (Acceptable) |

    | Excitement | 3.5 | 2.5 | **3.0** (Mild interest) |


    **Headline**: Borderline paper. Thorough experiments and honest self-assessment,
    but limited novelty of the core CED mechanism, insufficient related work coverage,
    and modest empirical improvements without significance testing collectively place
    this below the EMNLP acceptance threshold in its current form.


    ---


    ## 1. Summary


    The paper presents FREIGE, claimed to be the first LLM-based document-level relation
    extraction framework that jointly generates relation triples and evidence sentences.
    The core technical contribution is Contrastive Evidence Discrimination (CED),
    a scoring function that evaluates evidence quality by computing a margin between
    the NLI entailment score of cited evidence and the maximum NLI score among entity-sharing
    distractor sentences. CED is applied offline as an RSFT data filter and inference-time
    reranker, yielding consistent but modest improvements (evi_F1 +1.4pp, EDCR −2.4pp
    over flat-NLI). The paper also documents the systematic failure of online RL (GRPO)
    for this task and proposes EDCR as a diagnostic metric. Experiments span three
    model sizes (1.7B–8B) and two datasets (DocRED, Re-DocRED).


    ---


    ## 2. Strengths


    ### S1: Comprehensive experimental coverage

    All anticipated experiments are present: CED vs flat-NLI ablation (Table 3), test
    set evaluation (Table 1), EDCR diagnostics (Tables 6–7), DREEAM reproduction (Table
    8), CED-as-reranker (Table 4), model size ablation (Table 9), Re-DocRED extension
    (Table 10), top-k ablation (Table 11), GRPO analysis (Table 5), and NLI model
    ablation (Table 12). This is unusually thorough for a 10-page paper.


    ### S2: GRPO negative result is well-documented and valuable

    The systematic failure of GRPO across 3 reward types × 4+ learning rates × KL
    constraints is genuinely informative. The observation that CED-GRPO drives evi_F1
    to 85.0% while collapsing rel_F1 to 1.4% cleanly illustrates the multi-objective
    conflict in structured IE. The connection to LongRLVR''s gradient vanishing theory
    is appropriate.


    ### S3: Honest limitations discussion

    The paper is commendably transparent about: (a) rel_F1 being far below encoder
    SOTA (~63%), (b) the DREEAM comparison not being apple-to-apple, (c) EDCR remaining
    at 58–66% even in the best configuration, and (d) annotation incompleteness affecting
    EDCR. This intellectual honesty is welcome.


    ### S4: CED composability is practical

    Demonstrating that CED works at three pipeline points (RSFT filter, inference
    reranker, both combined) with additive benefits (Table 4) provides deployment
    flexibility. The training-free reranker option is particularly practical.


    ### S5: Flat-NLI null result is insightful

    The finding that flat-NLI RSFT achieves virtually zero evi_F1 improvement (+0.1pp)
    despite +3.6pp rel_F1 gain is a clean diagnostic result. It convincingly motivates
    the contrastive formulation by showing flat-NLI''s blindness to evidence quality.


    ---


    ## 3. Weaknesses


    ### W1 [Critical]: No statistical significance testing

    The CED vs flat-NLI improvements are modest: +1.4pp evi_F1, −2.4pp EDCR (dev set).
    No bootstrap confidence intervals, paired permutation tests, or multi-seed variance
    estimates are reported. For an EMNLP paper whose core claim is that CED provides
    "consistent improvement," statistical evidence is essential. The single-seed results
    for most configurations (only s42 vs s44 provide any variance signal) are insufficient.


    ### W2 [Critical]: Related work is severely incomplete (~0.5 page)

    The Related Work section omits entire lines of relevant work:

    - **NLI faithfulness evaluation**: FactCC (Kryscinski et al. 2020), SummaC (Laban
    et al. 2022), AlignScore (Zha et al. 2023), FRANK (Pagnoni et al. 2021) all use
    NLI for faithfulness with contrastive or decomposition strategies. CED''s margin
    formulation is closely related to SummaC''s contrastive NLI approach — this must
    be discussed and differentiated.

    - **DocRE evidence methods**: EIDER (Xie et al. 2022) performs joint entity/evidence/relation
    extraction and should be compared.

    - **LLM-based IE**: GPT-RE (Wan et al. 2023), CodeIE (Li et al. 2023), GoLLIE
    (Sainz et al. 2024), AutoRE (Xue et al. 2024) represent the broader LLM-IE landscape.
    LMRC (60.69% F1) and DocKS-RAG (63.59% F1) are mentioned in Related Work but conspicuously
    absent from the experimental comparison tables, despite being directly comparable
    LLM-based DocRE methods.

    - **RSFT/rejection sampling**: ReST (Gulcehre et al. 2023), STaR (Zelikman et
    al. 2022) are foundational. The paper treats RSFT as a known technique but doesn''t
    cite the key works.

    - **RL instability**: DAPO, Dr. GRPO, GVPO, and reward overoptimization (Gao et
    al. 2023) all address GRPO/PPO failure modes. The paper''s GRPO analysis, while
    thorough, documents a domain-specific instance of well-characterized phenomena.


    ### W3 [Major]: Missing LLM baselines in experimental comparison

    LMRC achieves 60.69% rel_F1 with LLaMA-3.1-8B; DocKS-RAG achieves 63.59%. FREIGE''s
    best rel_F1 is 43.8% — a 17–20pp gap. These methods are cited in Related Work
    but excluded from Table 1. The abstract''s "competitive" framing is misleading
    when rel_F1 is 20pp below contemporary LLM methods. Even acknowledging that these
    methods don''t produce evidence, the paper should include them in the main comparison
    table (with "—" for evi_F1/EDCR columns) to give readers an honest performance
    picture.


    ### W4 [Major]: CED novelty is limited

    The CED formula — margin = avg[p_pos(e) − max(p_neg)] — is a straightforward application
    of contrastive scoring to NLI. The idea of contrasting a positive against hard
    negatives is well-established in metric learning, contrastive representation learning,
    and NLI faithfulness evaluation. SummaC (Laban et al. 2022) similarly decomposes
    document-level NLI into sentence-level comparisons with aggregation. The paper
    does not discuss or differentiate from these prior approaches. The novelty of
    CED lies primarily in its application to DocRE evidence grounding, not in the
    formulation itself.


    ### W5 [Major]: CED degenerates for triples without distractors

    When a relation triple (h, r, t) has no entity-sharing non-cited sentences (i.e.,
    all sentences mentioning h or t are in the citation set), the negative set N_i
    is empty and CED reduces to flat NLI. Based on the review context, this affects
    approximately 44% of triples. This is undiscussed in the paper and potentially
    undermines the claimed advantage over flat-NLI for nearly half of all evaluation
    instances.


    ### W6 [Moderate]: DREEAM comparison framing

    The evi_F1 gap (78.9% vs 57.3%) is headlined in the abstract despite the authors''
    own acknowledgment that evaluation protocols differ fundamentally. Generative
    methods that output explicit sentence indices have a structural recall advantage
    over attention-based methods that must threshold continuous weights. While the
    paper discusses this in §4.7, featuring this comparison so prominently (including
    in the abstract) risks misleading readers.


    ### W7 [Moderate]: Missing visualizations

    The GRPO analysis (Claim 3) would benefit enormously from trajectory plots showing
    the reward↑/rel_F1↓ dynamics over training steps. The review context specifies
    these as expected figures (dual-axis line plots, heatmaps). Only a summary table
    (Table 5) is provided. Similarly, CED vs flat-NLI scatter plots and per-document
    EDCR distribution histograms are absent.


    ### W8 [Minor]: Test set numbers may not be from CodaLab

    Table 1 reports test rel_F1 and evi_F1 but the footnote on Table 8 says "Test
    evi_F1 computed locally (not from CodaLab)." For DocRED, official test evaluation
    requires CodaLab submission. If rel_F1/ign_F1 are from CodaLab but evi_F1 is local,
    this should be clearly stated in Table 1, not just Table 8. If neither is from
    CodaLab, this is a more serious concern.


    ### W9 [Minor]: All citations are [?] placeholders

    Every citation in the paper renders as [?], making it impossible to verify reference
    accuracy or completeness. This appears to be a LaTeX compilation issue but significantly
    hampers review.


    ---


    ## 4. Questions for Authors


    1. **Statistical significance**: Can you provide bootstrap confidence intervals
    for the CED vs flat-NLI comparison (Table 3)? Specifically, is the 1.4pp evi_F1
    gap and the 2.4pp EDCR gap significant at p<0.05?


    2. **CED degeneration**: What fraction of relation triples in DocRED dev/test
    have an empty negative set N_i (no entity-sharing non-cited sentences)? How does
    CED vs flat-NLI performance differ when restricted to triples with non-empty vs
    empty N_i?


    3. **Missing LLM baselines**: Why are LMRC and DocKS-RAG excluded from the main
    results table? Even without evidence outputs, their rel_F1 numbers provide critical
    context for the "competitive" claim.


    4. **SummaC relationship**: How does CED differ from SummaC''s contrastive NLI
    decomposition? Both compute sentence-level NLI scores and aggregate; CED additionally
    leverages entity-sharing structure. Is this the key differentiator?


    5. **Test evaluation**: Were the test set rel_F1/ign_F1 numbers in Table 1 obtained
    via CodaLab submission? If not, how was evaluation performed?


    6. **GRPO trajectory**: Can you provide training curves (reward, rel_F1, evi_F1
    vs. steps) for the GRPO experiments? The table summary loses important dynamics.


    7. **Generalization**: The method is evaluated only on English DocRE with DocRED/Re-DocRED
    (same domain — Wikipedia). Do you have any evidence that CED generalizes to other
    domains (biomedical, scientific) or languages?


    ---


    ## 5. Experiment Coverage Assessment


    Comparing to the imagined experiment list:


    | Experiment | Covered? | Quality | Notes |

    |------------|----------|---------|-------|

    | CED vs flat-NLI RSFT ablation | ✅ | Good | Clean apple-to-apple, but no significance
    test |

    | Test set evaluation | ✅ | Adequate | CodaLab status unclear; two configs reported
    |

    | EDCR cross-method diagnostic | ✅ | Good | Tables 6-7 are informative |

    | DREEAM baseline reproduction | ✅ | Good | Honest about protocol difference |

    | CED-as-reranker | ✅ | Good | Composability well-demonstrated |

    | Model size ablation | ✅ | Good | 1.7B/4B/8B consistent results |

    | Re-DocRED extension | ✅ | Good | Annotation sensitivity is valuable |

    | top-k ablation | ✅ | Adequate | Two data points (k=1,3); k=2 missing |

    | GRPO forgetting analysis | ⚠️ | Incomplete | Table only — trajectory visualizations
    missing |

    | NLI model ablation | ✅ | Good | Supports bottleneck-is-annotations conclusion
    |


    **Coverage**: 9.5/10 experiments covered. GRPO is present but lacks the expected
    trajectory visualizations that would make the negative result more compelling.


    **Missing from imagined list**: Scatter plot of CED margin vs flat-NLI score per
    candidate; per-document EDCR distribution histograms; CED score distribution comparison
    for top-k=1 vs k=3.


    ---


    ## 6. Roundtable Summary


    ### Areas of Agreement (R1 + R2)

    - **Soundness is acceptable (3.0)**: The methodology is sound but not strong.
    CED is technically correct, RSFT pipeline is standard, results are internally
    consistent.

    - **rel_F1 gap with LLM baselines is a critical omission**: Both reviewers independently
    flagged LMRC (60.69%) and DocKS-RAG (63.59%) missing from the comparison.

    - **No significance testing undermines the core CED claim**: With modest effect
    sizes, statistical evidence is mandatory.

    - **DREEAM comparison is problematic**: Both agree the comparison is structurally
    unfair but note the paper''s honesty about this.


    ### Areas of Disagreement

    - **R1 (3.5 Overall)** values the experimental comprehensiveness and GRPO negative
    result, viewing it as sufficient for borderline acceptance despite novelty limitations.

    - **R2 (2.5 Overall)** considers the novelty insufficient for EMNLP Main: CED
    is a simple formulation with prior art, GRPO failure is known, EDCR is a minor
    contribution, and the related work is too sparse.


    ### Convergence Rationale

    The converged score of **3.0** reflects that:

    - The paper''s strengths (experimental breadth, honest framing, practical composability
    of CED) are genuine but do not overcome the novelty deficit.

    - The related work gaps are addressable in revision but currently represent a
    significant scholarly gap.

    - The missing significance tests are a fixable but currently disqualifying issue
    for the CED claim.

    - The paper reads as a solid workshop paper or a conference paper that needs one
    more revision cycle to (a) add significance tests, (b) substantially expand related
    work, (c) include LLM baselines in comparison, and (d) add GRPO trajectory visualizations.


    ---


    ## 7. Revision Recommendations (Priority-ordered)


    1. **Add bootstrap CIs / multi-seed variance** for all CED vs flat-NLI comparisons
    (Tables 1, 3, 4).

    2. **Expand Related Work to ~1.5 pages**: Must cover NLI faithfulness (SummaC,
    AlignScore), DocRE evidence (EIDER), LLM-IE (GPT-RE, CodeIE, GoLLIE), RSFT foundations
    (ReST, STaR), and RL instability literature.

    3. **Add LMRC and DocKS-RAG to Table 1** with "—" for evi_F1/EDCR. Reframe "competitive"
    to "lower extraction but uniquely providing evidence."

    4. **Add GRPO trajectory visualizations** (dual-axis: reward + rel_F1 over steps).

    5. **Discuss CED degeneration** when N_i is empty; report the fraction of affected
    triples.

    6. **Differentiate from SummaC** explicitly in Methods or Related Work.

    7. **Fix [?] citations** — this is a formatting issue but severely impacts readability.

    8. **Clarify test set evaluation** — explicitly state which numbers come from
    CodaLab.


    ---


    ## 8. Overall Assessment


    **Score: 3.0 / 5.0 (Ambivalent / Borderline)**


    The paper tackles a real problem (evidence grounding for LLM-based DocRE) with
    a reasonable approach (contrastive NLI scoring), and the experimental coverage
    is unusually comprehensive. However, the core CED mechanism has limited novelty
    given prior work in NLI-based faithfulness evaluation, the improvements are modest
    without statistical backing, the related work section is inadequate for EMNLP,
    and critical LLM baselines are omitted from comparison. The GRPO negative result
    is the most interesting contribution but documents a phenomenon that is increasingly
    well-understood. In its current form, the paper falls slightly below the EMNLP
    acceptance bar but could be strengthened substantially with targeted revisions
    addressing significance testing, related work expansion, and honest baseline comparisons.

    '

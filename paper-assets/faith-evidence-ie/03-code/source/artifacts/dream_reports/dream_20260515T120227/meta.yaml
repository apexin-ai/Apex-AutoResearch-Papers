    ---


    # FREIGE: Dream Review Report (Full Mode)


    **Paper:** FREIGE: Faithful Relation Extraction with Evidence via Contrastive
    Evidence Discrimination

    **Venue:** EMNLP 2026 Main (ACL Rolling Review)

    **Review mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-15


    ---


    ## 1. Paper Summary


    FREIGE proposes the first LLM-based document-level relation extraction (DocRE)
    system that jointly generates relation triples and supporting evidence sentences.
    The key technical contribution is Contrastive Evidence Discrimination (CED), a
    scoring function that computes a contrastive margin m = p_pos − p_neg over NLI
    entailment scores, using entity-sharing distractor sentences as hard negatives.
    CED is applied as an offline quality filter for Rejection Sampling Fine-Tuning
    (RSFT): the SFT model generates N=8 candidates per document, CED scores them,
    and only the top-k=1 are retained for a second round of LoRA fine-tuning. The
    paper also documents the systematic failure of online RL (GRPO) with CED reward
    — reward overoptimization where reward rises monotonically while rel-F1 collapses
    — and proposes EDCR (Entity-sharing Distractor Citation Rate) as a complementary
    metric to Evi-F1. Experiments span DocRED/Re-DocRED, three model scales (1.7B/4B/8B),
    and multiple ablations.


    ---


    ## 2. Strengths


    ### S1. Genuine and well-motivated problem gap

    No prior LLM-based DocRE method produces verifiable evidence for predicted relations.
    This is a real deployment bottleneck for biomedical KB population, legal document
    analysis, and RAG-based fact verification. The paper correctly identifies and
    addresses this gap. *(R1, R2 agree)*


    ### S2. Well-designed contrastive scoring mechanism

    CED''s use of entity-sharing distractor sentences as hard negatives directly targets
    the core failure mode of flat NLI scoring: entity co-occurrence ≠ evidential support.
    The bias-cancellation argument (lexical overlap affects both p_pos and p_neg)
    is intuitive and supported by the MVP validation (discrimination accuracy 81.5%,
    Pearson r with lexical overlap = 0.34). *(R1)*


    ### S3. Informative negative result on GRPO

    The systematic GRPO failure analysis — 3 reward types × multiple learning rates
    × KL penalties, all exhibiting catastrophic forgetting — is the paper''s most
    novel and informative contribution. The decoupled observation that Evi-F1 rises
    to 85.0% while rel-F1 collapses to <2% is a clean illustration of reward overoptimization.
    This cautionary tale has value for the community. *(R1, R2 agree)*


    ### S4. Thorough ablation structure

    The paper includes ablations along multiple axes: CED vs flat-NLI (Table 2), top-k
    (Table 9), NLI model size (Table 10), model scale (Table 7), and cross-dataset
    (Table 8). The CED-as-reranker experiment (Table 5) demonstrates CED''s value
    at inference time without additional training. *(R1)*


    ### S5. Robust across configurations

    RSFT+CED shows consistent improvements across 4 hyperparameter settings, 3 model
    sizes (1.7B–8B), and 2 datasets (DocRED, Re-DocRED), suggesting genuine robustness
    rather than cherry-picking. *(R2)*


    ### S6. Honest self-assessment

    The paper acknowledges remaining EDCR of ~55% on test (half of non-gold citations
    are still distractors), the rel-F1 gap to encoder SOTA, and the Evi-F1 protocol
    difference with DREEAM. This calibration is appreciated. *(R2)*


    ---


    ## 3. Weaknesses


    ### W1. [Major] EDCR definition flaw — conflates extraction errors with evidence
    quality

    **Both reviewers, consensus Major.** EDCR is computed over *all* predicted triples,
    including incorrect ones. For incorrectly predicted triples, there is no matching
    gold evidence, so every cited sentence is trivially counted as a "distractor."
    This means EDCR is partially a proxy for relation extraction precision, not purely
    evidence quality. A model that predicts more (potentially wrong) triples will
    mechanically have higher EDCR. This undermines Claim 4 (EDCR as a complementary
    evaluation dimension) and inflates the apparent diagnostic power of EDCR in Table
    3.


    **Recommendation:** Decompose EDCR into (a) EDCR on correctly-matched triples
    (true evidence quality) and (b) EDCR on unmatched triples (extraction error contribution).
    Report both; only the former should support Claim 4.


    ### W2. [Major] No statistical significance testing

    **Both reviewers, consensus Major.** All results are single-run point estimates.
    The paper mentions multiple seeds (s42, s44, r2a, r2b) in development but reports
    only the best configuration on test. Key differences (CED vs flat-NLI: +2.8pp
    rel-F1) could be within random variance. At minimum: mean ± std across 3+ seeds
    for main results, and a paired bootstrap or McNemar''s test for the CED vs flat-NLI
    ablation.


    ### W3. [Major] GRPO failure analysis has an uncontrolled QLoRA confound

    **Both reviewers, consensus Major (R2 primary, R1 concurs directionally).** All
    GRPO experiments use QLoRA 4-bit quantization. The development logs document that
    QLoRA causes systematic KL computation failures and incompatibility with kl_coef
    > 0.01. The paper does not disentangle whether the catastrophic forgetting is
    a QLoRA-specific artifact vs. a fundamental property of online RL for structured
    IE. Additionally, concurrent work (R1-RE, 2025) successfully applies GRPO to sentence-level
    RE, suggesting the failure may be task-complexity + quantization specific.


    **Recommendation:** Either (a) run at least one full-precision (bf16) GRPO experiment
    to isolate the confound, or (b) scope the claim to "GRPO+QLoRA for document-level
    structured generation" rather than "online RL for structured IE" broadly.


    ### W4. [Major] CED novelty over prior contrastive NLI work insufficiently argued

    **R2 primary, R1 concurs.** CED is a contrastive margin over NLI entailment with
    entity-sharing hard negatives. The core technique — contrastive scoring with hard
    negatives — is well-established. The paper does not adequately differentiate CED
    from: (a) SummaC (Laban et al., NeurIPS 2022): contrastive NLI for faithfulness
    in summarization with sentence-level granularity; (b) Contrastive reward designs
    in RLHF (Shen & Zhang 2024; EMNLP 2024 contrastive learning for reward models);
    (c) Hard negative mining in dense retrieval. CED is a valid and well-motivated
    *application* of known techniques to a new domain, but the paper presents it as
    a more fundamental contribution than it is.


    ### W5. [Major] RSFT combined scoring formula underspecified

    **R1 primary, R2 concurs.** The RSFT selection criterion uses combined_score =
    format_reward × 0.2 + f1_reward × 0.4 + ced_reward × 0.4. These weights are load-bearing
    design choices that receive no justification or ablation. Different weight allocations
    could significantly change which training examples are selected and thus downstream
    performance. At minimum, compare CED-only, F1-only, and equal-weight configurations.


    ### W6. [Minor] "First LLM-based DocRE with evidence" claim needs tighter scoping

    **R2 primary.** While technically accurate for the specific formulation (jointly
    generating triples AND sentence indices), the paper does not adequately discuss:
    RAG-based LLM approaches with implicit provenance (DocKS-RAG), attributed QA systems
    (ALCE, Self-RAG) that jointly generate content and citations, and encoder-based
    methods that do produce evidence. The claim would be more defensible as "first
    LLM-based DocRE method that generates explicit sentence-level evidence indices
    as structured output."


    ### W7. [Minor] Evi-F1 comparison with DREEAM is not apple-to-apple

    **Both reviewers.** Generative methods have a structural advantage in Evi-F1:
    they can freely enumerate sentence indices (precision 81.2, recall 79.3), while
    attention-based methods must threshold weights (precision 58.1, recall 55.9).
    Table 1 places them side-by-side (80.2 vs 57.3) with only a footnote caveat. A
    controlled analysis (e.g., fixing the evidence budget per triple) or removing
    the direct comparison from the main table would be more honest.


    ### W8. [Minor] Hard-negative degeneration in 44.4% of samples

    **R1.** When no entity-sharing non-gold sentence exists, CED degenerates to flat
    NLI. The paper does not analyze performance on this substantial subset vs. the
    55.6% with genuine hard negatives. *(R2 notes this is less damaging than R1 suggests,
    since CED still provides benefit on the majority.)*


    ### W9. [Minor] 37% output truncation at 1024 tokens

    **R1 primary, R2 concurs this is significant.** Over a third of SFT outputs are
    truncated at max_new_tokens=1024, likely producing malformed JSON and reducing
    recall. This confound is not discussed in the paper and affects the interpretation
    of all downstream metrics.


    ### W10. [Minor] CED tau=0.5 threshold fixed without sensitivity analysis

    **R1.** The threshold tau in R_CED = max(0, p_pos − p_neg) · I(p_pos > tau) is
    fixed at 0.5. Analysis shows 33.4% of gold evidence has p_pos < 0.5, meaning CED
    assigns zero reward to a third of correct instances. A sweep over tau (0.3–0.6)
    would clarify sensitivity.


    ### W11. [Minor] EDCR as a standalone metric contribution is thin

    **R2.** EDCR is a straightforward precision-oriented ratio. Claiming it as a fourth
    contribution (Claim 4) overstates its novelty. The Pearson r = −0.42 with Evi-F1
    is computed over only 6–7 method-level data points and is not statistically robust.
    A per-document correlation or demonstration of EDCR''s utility beyond this paper''s
    context would strengthen this claim.


    ### W12. [Minor] Significant related work gaps

    **R2 primary.** Missing from Section 2:

    - SummaC (Laban et al., NeurIPS 2022) — contrastive NLI faithfulness, directly
    related to CED

    - ALCE (Gao et al., EMNLP 2023) — attributed QA with citation evaluation

    - Self-RAG (Asai et al., ICLR 2024) — LLM with joint generation + attribution

    - FactScore (Min et al., EMNLP 2023) — fine-grained factuality evaluation

    - R1-RE (Dai et al., 2025) — GRPO for sentence-level RE (critical for contextualizing
    GRPO failure claim)

    - Recent LLM-based DocRE: AutoRE, RelPrior, Ru-LLM

    - Broader reward overoptimization: Coste et al. 2024, Rafailov et al. 2024


    ---


    ## 4. Questions for Authors


    1. **EDCR decomposition**: What fraction of EDCR is driven by incorrectly-predicted
    triples? If you recompute EDCR only on correctly-matched triples, do the relative
    rankings between methods in Table 3 change?


    2. **QLoRA confound**: Have you attempted GRPO with full-precision LoRA (bf16)?
    The development logs indicate QLoRA causes KL computation failures. Can you confirm
    the catastrophic forgetting persists without 4-bit quantization?


    3. **Combined scoring weights**: How sensitive is RSFT to the 0.2/0.4/0.4 weighting?
    What happens with CED-only or F1-only selection?


    4. **Gold annotation incompleteness**: How often is the "best distractor" (highest
    p_neg) actually valid evidence missed by annotators? The paper claims a "self-correcting
    property" but provides no quantification.


    5. **Evidence budget fairness**: If you fix the number of evidence sentences per
    triple to match DREEAM''s average output, how does Evi-F1 change?


    6. **CED vs SummaC**: How does CED differ from SummaC''s contrastive NLI approach
    beyond the choice of hard negatives?


    7. **Truncation impact**: What is the effect of the 37% output truncation rate
    on downstream metrics? Does increasing max_new_tokens to 1536 change results?


    ---


    ## 5. Missing Experiments


    1. EDCR decomposition into matched-triple vs unmatched-triple components

    2. RSFT combined score weight ablation (CED-only, F1-only, equal weights)

    3. CED tau sensitivity sweep (0.3/0.4/0.5/0.6)

    4. Full-precision GRPO (even abbreviated) to isolate QLoRA confound

    5. Statistical significance: bootstrap CIs, paired tests for key comparisons

    6. Per-relation-type CED analysis (verbalization quality impact)

    7. Small-scale human evaluation of evidence quality (50–100 triples)


    ---


    ## 6. Experiment Coverage Assessment


    All 10 experiments from the design plan are reflected in the paper:

    - ✅ CED vs flat-NLI RSFT ablation (Table 2)

    - ✅ Test set evaluation (Table 1)

    - ✅ EDCR cross-method diagnostic (Table 3)

    - ✅ DREEAM baseline reproduction (Table 4)

    - ✅ CED-as-reranker (Table 5)

    - ✅ Model size ablation (Table 7)

    - ✅ Re-DocRED extension (Table 8)

    - ✅ Top-k ablation (Table 9)

    - ✅ GRPO forgetting dynamics (Table 6)

    - ✅ NLI model ablation (Table 10)


    Coverage is complete. The gaps are in depth (missing ablations/controls listed
    above) rather than breadth.


    ---


    ## 7. Consolidated Scores


    | Dimension | R1 | R2 | Converged |

    |-----------|----|----|-----------|

    | Soundness | 3/5 | 2.5/5 | **3/5** |

    | Excitement | 3/5 | 3/5 | **3/5** |

    | Overall Assessment | 3/5 | 3/5 | **3/5** |

    | Confidence | 4/5 | 4/5 | **4/5** |


    ### Score Justification


    **Soundness (3/5 — Acceptable):** The core CED+RSFT pipeline is methodologically
    sound, and the ablation structure is thorough in breadth. However, the EDCR definition
    conflates extraction errors with evidence quality (W1), the GRPO analysis has
    an uncontrolled QLoRA confound (W3), single-run results lack statistical robustness
    (W2), and the RSFT scoring weights are unjustified (W5). These are addressable
    but currently undermine key claims.


    **Excitement (3/5 — Borderline):** The problem is important and the paper addresses
    a real gap. The GRPO failure analysis is genuinely informative. However, CED is
    an application of known techniques (contrastive scoring + hard negatives) to a
    new domain rather than a fundamental methodological advance (W4). The 18pp rel-F1
    gap to encoder SOTA limits practical impact. The contribution is solid but incremental
    relative to EMNLP Main expectations.


    **Overall (3/5 — Borderline):** The paper is well-structured, covers a genuine
    gap, and provides informative negative results. However, 5 major weaknesses (W1–W5)
    collectively create significant uncertainty about the robustness of the conclusions.
    With the EDCR fix, statistical testing, QLoRA disambiguation, CED novelty argumentation,
    and weight ablation, this would be a solid 3.5–4. In current form: borderline,
    leaning weak accept contingent on revisions.


    ### Recommendation

    **Borderline accept.** The paper has clear merit in problem identification and
    experimental breadth, but execution gaps in statistical rigor, metric definition,
    and novelty argumentation prevent a confident acceptance recommendation. A revision
    addressing W1 (EDCR decomposition), W2 (significance testing), and W3 (QLoRA confound
    isolation) would substantially strengthen the paper.'

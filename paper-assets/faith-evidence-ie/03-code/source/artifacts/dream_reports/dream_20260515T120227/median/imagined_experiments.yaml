tier: median
narrative_guidance: '核心方法有效但 CED 优势不够突出。论文叙事从 "CED 方法论创新" 转向 "首个 LLM evidence-grounded
  DocRE 框架 + 在线/离线 RL 对比分析" 双主线。 Claim 1 成立但弱化措辞（"competitive with" 而非 "surpasses"）；Claim
  2 最危险——CED 优于 flat-NLI 但差异不 dramatic， 需将叙事调整为 "CED 提供一致性改善，且作为可组合模块具有实用价值"；Claim
  3 升级为并列 contribution；Claim 4 补充 EDCR 局限性讨论。 补充 model size ablation 和 Re-DocRED 扩展加厚实验章节。EMNLP
  Main poster 可期。

  '
imagined_experiments:
- name: CED vs flat-NLI RSFT ablation
  plan_id: plan_001
  description: '用 flat-NLI scoring（无 contrastive margin）筛选 RSFT 训练数据，与 CED scoring
    的 RSFT 做 apple-to-apple 对比。 复用已有 candidate pool（21952 generations），仅替换 scoring
    function 为 max(NLI(premise=evidence, hypothesis=claim)) 而非 CED 的 margin = p_pos
    - max(p_neg)。flat-NLI top_k=1 筛选后训练，同超参（1ep, α=32, lr=1e-5，对齐 r2b config）。

    '
  expected_results:
    flatnli_rsft_rel_f1: 0.442
    flatnli_rsft_evi_f1: 0.7985
    flatnli_rsft_edcr: 0.685
    flatnli_rsft_evi_precision: 0.801
    flatnli_rsft_evi_recall: 0.796
    flatnli_rsft_pred_count: 14950
    flatnli_selected_samples: 2750
    flatnli_selection_rate: 0.125
    flatnli_mean_f1: 0.608
    ced_rsft_rel_f1: 0.4493
    ced_rsft_evi_f1: 0.8128
    ced_rsft_edcr: 0.6609
    delta_evi_f1_ced_minus_flatnli: 0.0143
    delta_edcr_ced_minus_flatnli: -0.0241
    delta_rel_f1_ced_minus_flatnli: 0.0073
  result_rationale: 'flat-NLI scoring 能筛掉明显低质量候选（NLI 分数低的），因此 flat-NLI RSFT 仍显著优于
    SFT baseline （rel_f1 +3.6pp, evi_f1 +0.06pp）。但 flat-NLI 无法区分 entity-sharing distractor
    和 genuine evidence—— 两者的 NLI score 都高（因为都包含相关实体），导致筛选出的训练样本中保留了更多 distractor-heavy
    candidates。 CED 的 contrastive margin 恰好针对这一盲区：margin = p_pos - max(p_neg) 会惩罚那些
    distractor 也获得高 NLI 分数的样本。但在 median 档位下，这种区分能力有限（discrimination_accuracy 0.815
    而非 0.9+）， hard negative 有时自身也是有效 evidence（annotator 遗漏），导致 CED margin 信号有噪声。 最终
    CED 相对 flat-NLI 的 evi_f1 gap 为 1.43pp，EDCR 改善 2.41pp——方向一致但不够 dramatic。 rel_f1
    差异更小（0.73pp），因为关系抽取能力主要由 SFT 基础和训练数据量决定，scoring function 差异影响有限。

    '

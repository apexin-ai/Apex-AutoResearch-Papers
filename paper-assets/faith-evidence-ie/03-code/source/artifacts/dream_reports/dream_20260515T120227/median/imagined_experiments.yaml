    的候选天然倾向于引用 更少的 entity-sharing distractors。但 rel_f1 仅小幅提升（+0.93pp），因为 CED 打分不直接优化关系抽取质量，
    高 CED score 不一定对应高 rel_f1（有些候选 evidence 好但关系抽错了）。 evi_f1 的提升（+0.71pp）小于 RSFT-CED（+1.49pp），因为
    reranker 受限于 SFT 模型的 generation distribution——如果 8 个候选都引用了 distractor，reranker
    也无法避免。RSFT 通过改变模型本身的 generation distribution 来从源头改善。 EDCR 改善却显著优于 RSFT，这是因为 reranker
    可以在 8 个候选中做 sharp selection（选 EDCR 最低的那个）， 而 RSFT 改变的是 average generation quality（所有输出的
    EDCR 平均降低）。 推理时间增加 8x 是实际部署的代价——论文中应讨论 RSFT+reranker 的组合是否值得。


    取决于 lr 和 G）：rel_f1 开始下降但 evi_f1 开始上升——decoupling onset； (2) 中期（step 5-50）：reward
    持续上升，rel_f1 加速下降至 <0.05，evi_f1 平台期 ~0.80-0.85； (3) 后期（step 50-100）：reward 饱和，rel_f1
    在底部震荡（<0.02），evi_f1 微调。 lr=5e-5 的 forgetting 最快（step 5 开始）但 rel_f1 最终峰值最高（0.211
    at ckpt-90）， 因为高 lr 的 RL gradient 足够强同时推动 extraction 和 evidence，但最终 evidence gradient
    占优。 lr=5e-6 的 forgetting 最慢开始但最终 rel_f1 最低（0.014）， 因为低 lr 的 RL gradient 更精细地优化了
    reward 但缺乏足够的 extraction signal。 G=8 在 step 15 开始 forgetting——比 G=4 lr=5e-6 的
    step 10 晚， 符合"更稳定 advantage estimation → 更保守 update"的预期。

    '
  tables: []
  figures_description:
  - '3×2 panel figure: 3 行 = 3 configs (G4-lr5e5, G4-lr5e6, G8), 2 列 = (rel_f1 + reward
    overlay, evi_f1 + EDCR overlay)。每个 panel 用双 y 轴展示两个指标随 step 的 divergence。'
  - 'Phase diagram: x=rel_f1, y=evi_f1, 每个 config 的 trajectory 用箭头连接各 checkpoint，展示
    decoupling 的方向（右上→左上）。'
  analysis: '可视化清晰展示 decoupling phenomenon 的三个阶段。Phase diagram 是最有力的图—— 所有 GRPO configs
    的 trajectory 都从 (SFT rel_f1, SFT evi_f1) 出发，向 (↓, ↑) 移动， 形成一个"左上角 attractor"。RSFT
    的 trajectory 则从同一起点向 (↑, ↑) 移动， 两个方向的对比直观地说明了 online vs offline RL 的行为差异。

    '

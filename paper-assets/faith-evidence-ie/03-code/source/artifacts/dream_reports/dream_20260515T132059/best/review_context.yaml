  - 'Bar chart: 按 relation type frequency 分组的 evi_f1 对比（head/body/tail），验证 CED 在各频率段的一致优势。'
  analysis: 'CED vs flat-NLI 的差异模式完美验证了核心假说：CED 的优势集中在 distractor-dense 文档上。 在 distractor
    density > 0.4 的文档子集中，CED RSFT 的 evi_f1 优势扩大到 ~3.5pp， 而在 distractor density < 0.2
    的文档中差异缩小到 ~0.8pp（不显著）。 这证明 CED 的 contrastive margin 确实在做它该做的事：区分 entity-sharing
    distractors 和真正的 evidence。 EDCR 的差异更稳定（几乎所有子集都显著），因为 EDCR 直接测量 distractor citation
    rate， 而 evi_f1 还受 recall 影响（有些 gold evidence 即使用 flat-NLI 也能被正确引用）。 rel_f1 的差异虽然也显著，但这是
    evidence 质量提升的 downstream 效应，而非 CED 的直接目标。

    '
- name: Test set evaluation (RSFT best + SFT baseline)
  plan_id: plan_002
  description: '用 RSFT best config (s43_r2: 3ep, α=128, seed=43) 和 SFT baseline 在
    DocRED test set 上评估。 (1) CodaLab 提交获取官方 rel_F1/Ign_F1；(2) 本地 test set 计算 Evi-F1_joint
    (DREEAM 协议) 和 Evi-F1_conditional + EDCR；(3) flat-NLI RSFT best 也提交作为 ablation。

    '
  expected_results:
    sft_test_rel_f1: 0.3998
    sft_test_ign_f1: 0.3814
    sft_test_evi_f1_conditional: 0.7902
    sft_test_evi_f1_joint: 0.3216

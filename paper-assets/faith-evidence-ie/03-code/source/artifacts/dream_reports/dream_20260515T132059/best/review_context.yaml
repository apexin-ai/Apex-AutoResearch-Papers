    \ 导致的 distribution shift， 因此不会 catastrophic forgetting——rel_f1=0.325 远高于 GRPO\
    \ 的 0.031。 但 DPO 弱于 RSFT（0.325 vs 0.468）的原因是： (1) DPO 的 implicit reward model\
    \ 需要从 preference pairs 中学习 CED 信号，\n    而 RSFT 直接在 CED-selected 高质量样本上 supervised\
    \ learning——后者更 sample-efficient；\n(2) DPO 的 contrastive loss 同时推高 chosen 和推低\
    \ rejected 的 likelihood，\n    但在 IE 任务中 chosen/rejected 的差异主要在 evidence 而非 extraction——\n\
    \    推低 rejected 可能意外降低了正确 extraction pattern 的概率；\n(3) DocRED 的输出空间太大（长 JSON），DPO\
    \ 的 token-level KL penalty 对长序列的控制力不足。 DPO 的 evi_f1（0.786）接近 SFT（0.798），说明 evidence\
    \ 质量未被显著改善—— DPO 未能从 preference pairs 中有效学到 CED 的 evidence quality 信号。 这与 RSFT\
    \ 的 evi_f1=0.816 形成对比，进一步支持\"CED 适合作为筛选信号而非学习目标\"。 rel_f1=0.325 vs SFT=0.406 实际上是\
    \ DPO 的退化（-8.1pp），这是因为 DPO 的 rejected 样本中包含的 extraction pattern 被不当抑制了——一种轻度的\
    \ DPO \"over-optimization\"。 整体光谱：GRPO (0.031) << DPO (0.325) < SFT (0.406) <\
    \ RSFT (0.468)， 清晰展示了 online → offline → no-RL → offline-filtered 的退化/改善梯度。\n"

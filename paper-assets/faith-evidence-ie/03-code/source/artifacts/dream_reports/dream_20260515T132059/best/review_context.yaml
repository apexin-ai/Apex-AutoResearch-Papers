    joint Evi-F1 更高，但 DREEAM 是 encoder-based 方法，其"evidence"是 attention weight thresholding，
    而 FREIGE 是生成式方法同时输出 triple+evidence——二者的 evidence 形式不同（implicit attention vs explicit

      2718），数据不足以有效微调。 且小模型的 LoRA 容量有限（相对模型参数比例更大），更容易过拟合少量 RSFT 数据。

      8B 收益小的原因：强模型 SFT baseline 已较好（0.458），候选质量整体较高， CED 筛选的增量价值边际递减。同时 8B + QLoRA
      的有效参数更新比例更小， LoRA rank=64 在 8B 上的相对容量不足（4B 上 rank=64 ≈ 1.6% params，8B ≈ 0.8%）。

      4B 是 sweet spot 可能是 LoRA rank/lr 超参恰好匹配而非方法论优势。 Reviewer 会指出 "方法效果高度依赖模型规模和超参配置"。

      '

        reward: 1.52
      trajectory_step_100:
        rel_f1: 0.198
        evi_f1: 0.635
        reward: 1.48
    result_rationale: '在 worst 档下，G=8 部分恢复但仍远低于 SFT baseline（0.235 vs 0.406，-17.1pp）。

      部分恢复的原因：G=8 的 advantage estimation 噪声更低——每个 prompt 有 8 个 rollout， group-relative
      advantage 的标准差估计更准确（理论上 std 误差 ∝ 1/√G），减少了 "高 reward 但低质量候选获得正 advantage" 的频率。Rel_f1
      peak 0.235 vs G=4 的 0.217（+1.8pp）， evi_f1 0.605 vs 0.575（+3.0pp），方向一致但提升有限。

      仍然 catastrophic 的原因： (1) QLoRA 的离散化梯度在 structured output 空间中仍产生不稳定更新——G=8 缓解但未解决；
      (2) CED reward 的 per-sentence 细粒度在 GRPO 的 sequence-level advantage 下 仍存在 credit
      assignment 问题——reward 信号无法精确归因到具体 token 决策； (3) 100 步训练中 rel_f1 在 step 80 达峰后开始下降（0.235→0.198），forgetting
      仍在发生， 只是 onset 延迟到 ~step 20（vs G=4 ~step 5-10）。

      对 Claim 3 的影响：G=8 的部分恢复证明 G=4 failure 有 advantage noise 成分， Claim 3 必须进一步限定为
      "GRPO+QLoRA+small-to-moderate group size"。 核心论点从 "GRPO categorically fails"
      弱化为 "GRPO 在 structured IE 上极其脆弱， 需要远超标准配置的 group size 才能勉强工作"。 Reviewer 会要求
      G=16/G=32 实验，但 GPU 显存限制使这些不可行（需论文中声明）。


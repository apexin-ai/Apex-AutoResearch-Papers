      dpo_delta_over_grpo_g8_rel_f1_pp: 26.2
      dpo_delta_over_rsft_ced_rel_f1_pp: -12.8
    result_rationale: 'DPO 使用 offline preference pairs 训练，避免了 GRPO 的 online RL 机制，
      因此不出现 catastrophic forgetting (rel_f1=0.340 >> GRPO 0.078)。 但 DPO 仍低于 SFT (0.406)，原因:
      (1) DPO 的 contrastive loss 同时 push up preferred 和 push down rejected—— "push
      down" 信号在 structured IE 中有害: 被 CED 标为 "rejected" 的候选中，关系抽取部分可能是正确的（只是 evidence
      差）， push down 这些候选时也 push down 了正确的关系模式； (2) CED preference labels 有 ~18.5%
      噪声 (discrimination accuracy 0.815)， DPO 对 label noise 比 RSFT 更敏感—— RSFT 仅用 top
      positive 训练（噪声负例不参与梯度）， DPO 显式惩罚负例（噪声标签直接产生错误梯度）； (3) DPO 的 implicit reward
      model 假设 Bradley-Terry preference 模型， 但 CED margin 并非 BT 分布——文档级 IE 的候选质量差异不是连续谱，
      而是离散的（正确/部分正确/完全错误），BT 假设不适用导致优化方向偏差。 rel_f1=0.340 的尴尬位置使 online-offline 叙事复杂化:
      DPO 是 "offline" 但劣于 SFT (无 RL 信号)，说明问题不在 online/offline  而在 contrastive loss
      对 structured generation 的损害。


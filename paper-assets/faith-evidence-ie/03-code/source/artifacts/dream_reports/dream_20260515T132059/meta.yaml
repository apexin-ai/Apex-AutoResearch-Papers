    analysis: 'EDCR 与人工判断弱相关（r=0.28），主要噪声源是 DocRED 标注不完整导致的 systematic overestimation。
      EDCR 不适合作为独立 automatic metric 替代人工评估，但仍有 directional diagnostic 价值—— EDCR 极高（>0.9）确实标志着模型严重引用
      distractor（如 GRPO 的 0.988）。

      在 reframed narrative 下，这个 negative result 本身是 contribution： "evidence evaluation
      比想象中更难，自动指标（无论 Evi-F1 还是 EDCR）都有显著局限"—— 这为 "首个 LLM DocRE evidence benchmark"
      的 contribution 增加了 evaluation challenge dimension。 论文应呼吁社区建立更好的 evidence evaluation
      protocol。

      '

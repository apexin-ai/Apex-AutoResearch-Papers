    - 'Bar chart: 按 relation type frequency 分组的 evi_f1 对比（head/body/tail），验证 CED 在各频率段的一致优势。'
    analysis: 'CED vs flat-NLI 的差异模式完美验证了核心假说：CED 的优势集中在 distractor-dense 文档上。 在 distractor
      density > 0.4 的文档子集中，CED RSFT 的 evi_f1 优势扩大到 ~3.5pp， 而在 distractor density <
      0.2 的文档中差异缩小到 ~0.8pp（不显著）。 这证明 CED 的 contrastive margin 确实在做它该做的事：区分 entity-sharing
      distractors 和真正的 evidence。 EDCR 的差异更稳定（几乎所有子集都显著），因为 EDCR 直接测量 distractor citation
      rate， 而 evi_f1 还受 recall 影响（有些 gold evidence 即使用 flat-NLI 也能被正确引用）。 rel_f1 的差异虽然也显著，但这是
      evidence 质量提升的 downstream 效应，而非 CED 的直接目标。

      '
  - name: Test set evaluation (RSFT best + SFT baseline)
    plan_id: plan_002
    description: '用 RSFT best config (s43_r2: 3ep, α=128, seed=43) 和 SFT baseline
      在 DocRED test set 上评估。 (1) CodaLab 提交获取官方 rel_F1/Ign_F1；(2) 本地 test set 计算 Evi-F1_joint
      (DREEAM 协议) 和 Evi-F1_conditional + EDCR；(3) flat-NLI RSFT best 也提交作为 ablation。

      '
    expected_results:
      sft_test_rel_f1: 0.3998
      sft_test_ign_f1: 0.3814
      sft_test_evi_f1_conditional: 0.7902
      sft_test_evi_f1_joint: 0.3216
      sft_test_edcr: 0.7185
      rsft_test_rel_f1: 0.4548
      rsft_test_ign_f1: 0.4367
      rsft_test_evi_f1_conditional: 0.8072
      rsft_test_evi_f1_joint: 0.3758
      rsft_test_edcr: 0.6476
      flatnli_test_rel_f1: 0.4302
      flatnli_test_ign_f1: 0.4118
      flatnli_test_evi_f1_conditional: 0.7883
      flatnli_test_evi_f1_joint: 0.3421
      flatnli_test_edcr: 0.7014
      rsft_vs_sft_test_rel_f1_delta: 0.055
      dev_to_test_degradation_rel_f1: 0.0135
      rsft_test_evi_f1_joint_value: 0.3758
    result_rationale: 'Dev→test degradation 约 1.35pp rel_f1（0.4683 → 0.4548），这在 DocRED
      上属正常范围。 DocRED test set 的关系分布与 dev 非常接近（同一标注 pipeline），但 test 略难因为： (1) annotator
      间一致性略低的 hard cases 更多被分配到 test，(2) distant supervision noise 在 test 中比例略高。 SFT
      test rel_f1=0.3998 比 dev 0.4057 低 0.6pp，同样符合 DocRED 的典型 dev-test gap。 因此 RSFT
      vs SFT 的 delta 在 test 上为 +5.5pp（vs dev +6.26pp），退化幅度合理。 Evi-F1_joint (DREEAM
      协议) 远低于 conditional（0.376 vs 0.807），因为 joint 计算方式为 evi_f1 = Σ(triple_correct
      AND evi_correct) / Σ(gold_triples)，未正确预测的 triple 直接贡献 0 到 evidence score。 RSFT
      rel_f1=0.455 意味着约 45.5% 的 gold triples 被正确预测；在这些正确预测中，evi_f1_conditional ≈ 0.807；
      因此 joint ≈ 0.455 × 0.807 × correction_factor ≈ 0.376（correction factor 因为 recall/precision
      不对称略偏离乘积）。 SFT 的 joint 更低（0.322）因为 rel_f1 更低（0.400）。 Ign_F1 低于 F1 约 1.8pp，因为
      RSFT 和 SFT 都对 shared entity pairs（train+dev 中出现的）有略高的准确率， 忽略这些后 F1 下降——这是 DocRED
      评测的正常模式。 EDCR 在 test 上略高于 dev（0.648 vs 0.639），因为 test set 文档平均 entity density
      略高，distractor 机会更多。

      '

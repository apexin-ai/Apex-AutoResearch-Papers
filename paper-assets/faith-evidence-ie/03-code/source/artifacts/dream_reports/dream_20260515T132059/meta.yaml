      (GRPO): catastrophic failure，无论 G 大小； (2) Preference learning (DPO): degradation
      vs SFT——contrastive loss 损害 structured generation； (3) Data curation (RSFT):
      improvement over SFT——无 RL loss，只筛选数据。 结论: 对 document-level IE，任何形式的 contrastive/reward-based

    \ training paradigm, model size, and dataset). The honest reporting of CED's non-significance,\
    \ the extraction gap, and EDCR's limitations is commendable.\n\nHowever, the paper\
    \ faces three interconnected problems that prevent recommendation for Main:\n\n\
    1. **Limited method novelty**: CED is a standard contrastive NLI scorer that does\
    \ not significantly outperform flat-NLI (p>0.05 on all metrics). RSFT is existing\

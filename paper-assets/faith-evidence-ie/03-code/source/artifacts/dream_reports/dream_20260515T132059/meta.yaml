  - name: GRPO G=8 实验
    plan_id: plan_011
    description: '用 G=8 + CED reward + kl_coef=0.01 重跑 GRPO，验证 G=4 的 catastrophic
      forgetting 是否因 advantage estimation noise 导致。用 gradient accumulation 适配显存。

      '
    expected_results:
      grpo_g8_best_rel_f1: 0.235
      grpo_g8_best_evi_f1: 0.605
      grpo_g8_best_edcr: 0.742

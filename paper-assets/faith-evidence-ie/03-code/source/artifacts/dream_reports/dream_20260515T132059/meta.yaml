      的 joint Evi-F1 更高，但 DREEAM 是 encoder-based 方法，其"evidence"是 attention weight
      thresholding， 而 FREIGE 是生成式方法同时输出 triple+evidence——二者的 evidence 形式不同（implicit
      attention vs explicit citation）。 论文可这样叙述：FREIGE 是首个生成式方法在 DocRED 上输出显式 evidence，且其
      joint Evi-F1 在 LLM 方法中无可比对手（LMRC、DocKS-RAG 均不输出 evidence）。 flat-NLI RSFT 在 test

  - name: EDCR pipeline 验证 + cross-method diagnostic table
    plan_id: plan_003
    description: '在所有 evidence-producing 方法上计算统一的 EDCR 指标，构建 cross-method diagnostic
      table。 方法包括：SFT, RSFT-CED (4 configs), RSFT-flatNLI (2 configs), CED-reranker,
      GRPO checkpoints (selected)。 同时计算 EDCR 与 evi_f1 的相关性（per-method level 和 per-document
      level）。

      '
    expected_results:
      sft_edcr: 0.7118
      rsft_ced_s43_edcr: 0.6388
      rsft_ced_s44_edcr: 0.635
      rsft_ced_r2a_edcr: 0.6641
      rsft_ced_r2b_edcr: 0.6609
      rsft_flatnli_a_edcr: 0.6952
      rsft_flatnli_b_edcr: 0.6887
      ced_reranker_edcr: 0.5983
      grpo_ckpt90_edcr: 0.8584
      grpo_ckpt100_lr5e6_edcr: 0.9876
      cross_method_pearson_r_edcr_vs_evif1: -0.42
      per_doc_spearman_edcr_vs_evif1: -0.31
    result_rationale: 'Cross-method table 展现清晰的 EDCR 梯度：GRPO（0.86-0.99）>> SFT（0.71）>>
      RSFT-flatNLI（0.69）>> RSFT-CED（0.64）>> CED-reranker（0.60）。 这个梯度与直觉一致：(1) GRPO
      的 catastrophic forgetting 导致模型生成大量重复 entity mentions 但极少正确 relation， 几乎所有 cited
      sentences 都是 distractor；(2) SFT 从 gold data 学习但无 evidence quality 信号； (3) flat-NLI
      RSFT 比 SFT 好因为至少过滤了 zero-evidence 候选，但 flat-NLI 被 entity overlap 欺骗； (4) CED
      RSFT 进一步降低因为 contrastive margin 训练数据中 distractor 更少； (5) CED-reranker 最低因为推理时直接按

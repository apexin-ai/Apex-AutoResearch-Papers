        step_150:
          rel_f1: 0.382
          eval_loss: 0.62
        step_200:
          rel_f1: 0.378
          eval_loss: 0.625
    result_rationale: '在 worst 档下，DPO rel_f1 = 0.385——接近 SFT baseline（0.406, -2.07pp）但远低于
      RSFT（0.466, -8.05pp）。 关键：DPO 没有 catastrophic forgetting（训练过程中 rel_f1 稳定在 0.375-0.385
      区间）， 证明 offline preference learning 确实避免了 GRPO 的遗忘问题。

      DPO 低于 SFT 的原因： (1) DPO 的 preference pairs 由 CED-preferred（高 CED 分的候选）vs CED-rejected（低
      CED 分的候选） 构造，但 CED 分数差异主要在 evidence 维度而非 extraction 维度——DPO 学会了避免 bad evidence
      但没有学到 better extraction，在 relation extraction 上甚至略退化（precision 0.392 < SFT 0.404）；
      (2) DPO 对 preference margin 敏感，CED 分数差异在很多 pair 中很小（mean margin ~0.15）， 弱信号导致
      DPO 学习不充分； (3) DPO 的 KL penalty 倾向于保守更新，在 LoRA 有限容量下进一步限制了学习。

      DPO 接近 SFT 而非接近 RSFT，说明 RSFT 的优势不仅在于 "避免 policy gradient"， 更在于 "直接用高质量数据替换训练分布"——RSFT
      改变了训练数据本身（rejection sampling 选出最优候选）， 而 DPO 只改变了 loss function（在原始候选对上做 preference
      learning）。

      对论文叙事的影响：GRPO < DPO ≈ SFT < RSFT 的排序揭示了一个 spectrum： online RL（GRPO）catastrophic
      fail → offline preference（DPO）stable but no gain → offline data curation（RSFT）effective。这个
      spectrum 本身是有价值的 analysis finding。

      '

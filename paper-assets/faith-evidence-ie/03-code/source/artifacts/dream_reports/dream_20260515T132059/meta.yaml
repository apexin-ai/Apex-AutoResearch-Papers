    \ be GRPO+QLoRA instability for structured generation generally.\n\n3. **Significant\
    \ related work gaps**: The \"RL for IE\" section cites no specific papers. Critical\
    \ omissions include R1-RE (GRPO for sentence-level RE — a direct foil) and multiple\

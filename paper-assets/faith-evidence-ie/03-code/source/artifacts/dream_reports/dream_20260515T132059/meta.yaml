  - name: CED vs flat-NLI RSFT ablation
    plan_id: plan_001
    description: '用 flat-NLI scoring（DeBERTa NLI entailment score，无 contrastive margin）替代
      CED 作为 RSFT 候选筛选信号。 复用 mvp2_rsft_gen_s0~s3 已有的 21952 candidates，仅替换打分函数。 flat-NLI
      score = mean entailment probability over cited sentences（无 hard-negative 对比）。
      选 top_k=1 per document，训练配置对齐 CED-RSFT 最优（s43: 3ep, α=128, seed=43；r2b: 1ep,
      α=32, lr=1e-5）。 共训练 2 个 flat-NLI RSFT 配置，全量 dev eval。

      '
    expected_results:
      flatnli_rsft_a_rel_f1: 0.4412
      flatnli_rsft_a_evi_f1: 0.7948
      flatnli_rsft_a_edcr: 0.6952
      flatnli_rsft_a_n_selected: 2845
      flatnli_rsft_b_rel_f1: 0.4378
      flatnli_rsft_b_evi_f1: 0.7972
      flatnli_rsft_b_edcr: 0.6887
      ced_rsft_best_rel_f1: 0.4683
      ced_rsft_best_evi_f1: 0.8156
      ced_rsft_best_edcr: 0.6388
      delta_rel_f1: 0.0271
      delta_evi_f1: 0.0208
      delta_edcr: -0.0564
      paired_bootstrap_evi_f1_p: 0.0038
      paired_bootstrap_edcr_p: 0.0021
      paired_bootstrap_rel_f1_p: 0.0067
    result_rationale: 'flat-NLI scoring 仍然能过滤掉完全无关的候选（如 format 错误、zero-F1 的），因此 flat-NLI
      RSFT 仍优于 SFT baseline（+3.2~3.6pp rel_f1）。 但 flat-NLI 的核心缺陷在于：entity-sharing
      distractor sentences 的 NLI entailment score 往往偏高（因为共享实体提供了 lexical overlap），
      flat-NLI 无法区分"真正支持关系的证据句"和"仅提及相同实体的干扰句"。 因此 flat-NLI 筛选出的 top-1 候选中会保留更多 distractor-heavy
      样本——这些样本的 evidence 看起来"合理"（高 NLI score） 但实际上引用了大量 entity-sharing non-gold sentences。
      CED 的 contrastive margin = p(entail|gold) - max(p(entail|distractor)) 直接惩罚这种模式，
      因此 CED-filtered 数据的训练样本 evidence 质量系统性更高。 这导致 CED RSFT 在 evi_f1 上高出 ~2.1pp（因为训练数据中
      evidence 更精确，模型学到更好的 evidence 引用模式）， 在 EDCR 上低 5.6pp（因为训练数据中 distractor citations
      更少，模型被条件化为避免引用干扰句）。 rel_f1 差异 +2.7pp 来自间接效应：CED 筛选出的候选不仅 evidence 更好，整体生成质量也更高（因为能正确定位
      evidence 的生成通常也更准确地识别了关系）。 p<0.01 的显著性来自两个因素：(1) dev set 有 985 docs 提供足够统计力，(2)
      CED vs flat-NLI 的差异是系统性的（几乎在每种关系类型上 CED 都更好），不是少数异常值驱动的。 flat-NLI 选出 ~2845 样本（vs
      CED 2718），因为 flat-NLI 的筛选 landscape 不同（一些 CED 会拒绝的 distractor-heavy 候选在 flat-NLI
      下得分高）。

      '

    ---


    ## Questions for Authors


    1. What is the method-level EDCR correlation with and without the GRPO QLoRA data
    point? A leave-one-out analysis across all configurations would substantially
    strengthen or appropriately qualify Contribution 3.

    2. Could a simpler metric (BM25 or TF-IDF overlap between evidence and relation
    text) approximate EDCR''s diagnostic power? If the NLI backbone size doesn''t
    matter, this is a natural follow-up.

    3. Was the Qwen3-4B LoRA configuration (r=64) tuned? Does the 1.7B > 4B anomaly
    persist with different adapter ranks or learning rates?

    4. How does the evidence tax compare under a two-stage pipeline (extract first,
    then generate evidence) vs. joint single-pass generation?


    ---


    ## Overall Assessment


    The paper investigates an important and underexplored question—the cost of requiring
    faithful evidence in generative IE—with commendable experimental breadth and intellectual
    honesty. However, each of the three contributions has a significant generalizability
    or robustness problem:


    - **Evidence tax** (Contribution 1): Direction is consistent, but magnitude is
    dominated by one anomalous model. The stable finding is "a modest, variable cost"
    rather than the dramatic 7pp the paper leads with.

    - **Decoupling spectrum** (Contribution 2): Internally consistent for Qwen3-4B,
    but the catastrophic failure—the paper''s most striking result—is architecture-specific
    and mechanistically unexplained.

    - **EDCR** (Contribution 3): Useful at the method level, but the strong correlation
    statistic rests on ~6 points with an obvious outlier, and no robustness analysis
    is provided.


    The honest self-scoping is laudable, but the net effect is that the paper repeatedly
    introduces interesting findings and then shows they don''t generalize. For a top
    venue (acceptance rate ~25%), the combination of (a) no statistically significant
    method improvement, (b) an anomalous primary model, (c) architecture-specific
    headline results, and (d) a proposed metric with undemonstrated robustness makes
    the contribution insufficient. The analysis framing is appropriate, but the findings
    need to be more robust or the mechanistic understanding deeper to reach the bar.



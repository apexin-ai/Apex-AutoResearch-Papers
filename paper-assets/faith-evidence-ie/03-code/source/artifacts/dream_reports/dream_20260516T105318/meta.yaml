  - name: Re-DocRED cross-dataset evaluation
    plan_id: plan_007
    description: '在 Re-DocRED 上从头训练完整 SFT→RSFT→eval pipeline。Re-DocRED 修正了 DocRED

      的 false negative 标注，~55% triples 无 evidence 标注。报告两种模式：

      evidence_only（43% 有 evidence 标注的 triples，可比 evi_f1）和 full（全部 triples

      的 rel_f1，不报 evi_f1）。

      '
    expected_results:
      re_docred_sft_evi_full_ign_f1: 0.382
      re_docred_sft_evi_full_f1: 0.398
      re_docred_sft_no_evi_full_ign_f1: 0.44
      re_docred_evidence_tax_full_pp: 5.8
      re_docred_rsft_ced_full_ign_f1: 0.417
      re_docred_rsft_ced_full_f1: 0.432
      re_docred_rsft_vs_sft_full_delta_pp: 3.5
      re_docred_sft_evi_only_evi_f1: 0.778
      re_docred_sft_evi_only_edcr: 0.722
      re_docred_rsft_ced_evi_only_evi_f1: 0.802
      re_docred_rsft_ced_evi_only_edcr: 0.658
      re_docred_rsft_ced_evi_only_rel_f1: 0.432
      method_ranking_consistent: true
      rsft_vs_sft_delta_re_docred: 3.5
    result_rationale: '**绝对 Ign-F1 低于 DocRED 约 2pp：** Re-DocRED 修正了 DocRED 的 false
      negative

      标注——增加了约 55% 的 true positive relations，使得 gold set 显著更大。这意味着

      recall 更难（更多 true relations 需要被找到），而 precision 因标注一致性提高而

      略有改善。净效果是 Ign-F1 下降，因为 recall 下降的影响大于 precision 提升。


      **RSFT-SFT Δ=3.5pp 稍低于 DocRED（5.1pp）：** Re-DocRED 新增的 true relations

      大部分来自 distant supervision 且无 evidence 标注。RSFT 的核心优势是 CED 筛选

      的 evidence quality improvement——对无 evidence 标注的 triples，RSFT 的 quality

      filter 信号较弱（只有 extraction F1 信号，无 CED 对比信号），因此增益被稀释。

      但 Δ 仍显著（>2pp），证明 CED-based RSFT 的提升不是 DocRED annotation artifact。


      **Evidence tax（5.8pp）与 DocRED（7.5pp）同量级但略小：** Re-DocRED 的 evidence

      标注覆盖率仅 43%，SFT 训练时模型接触的"有 evidence 需要生成"的样本比例低于

      DocRED（100% 覆盖），因此 evidence generation burden 的平均影响更小。


      **Evidence-only evi_f1 略低于 DocRED：** Re-DocRED 的 evidence 标注经人工审核

      比 DocRED 的 distant supervision gold 更严格（更高 annotation quality = harder

      gold standard），因此 exact match evi_f1 稍低。但 RSFT-SFT 方向一致。

      '

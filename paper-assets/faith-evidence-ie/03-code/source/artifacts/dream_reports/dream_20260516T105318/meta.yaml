    but catastrophic QLoRA amplification is Qwen-specific"—is honest but mechanistically
    unsatisfying. Without understanding *why* Qwen is uniquely vulnerable, the finding
    is descriptive rather than explanatory, and its practical value (predicting which
    models will fail) is limited.



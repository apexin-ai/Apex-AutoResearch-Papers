        - 2.0
        llama_grpo_qlora_rel_f1:
        - 0.1
        - 0.4
        edcr_human_spearman:
        - 0.3
        - 0.5
        re_docred_rsft_vs_sft_delta:
        - -1.0
        - 2.0
      narrative_direction: 'Reframe 为分析/诊断贡献论文，不以 RSFT 方法性能为核心 claim。三个 reframe 方向（按优先级）：(1)
        ''Understanding the cost of faithfulness in generative IE''——evidence generation
        tax（7pp）+ 部分恢复的系统性分析，贡献在于量化了 faithfulness-performance trade-off 并提供 EDCR 作为诊断工具；(2)
        ''Why RL fails for multi-objective IE: an empirical study''——decoupling 即使只在
        Qwen 上验证，作为 case study 仍有价值，重心转向 intra-task objective competition 的机制分析 +
        QLoRA amplification 现象；(3) 如果 Qwen-only 但数据充分，scope 收缩为 ''model-specific''
        发现但补充足够 ablation 深度（training dynamics, per-relation 分析, advantage variance）使单模型分析具独立价值。目标仍
        EMNLP main（Findings track 可接受），不降级 venue。'

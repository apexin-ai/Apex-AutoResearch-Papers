  - name: Model size ablation (Qwen3-1.7B / 8B)
    plan_id: plan_006
    description: 'Qwen3-1.7B 和 Qwen3-8B 完整 SFT→RSFT→eval pipeline。已完成：1.7B SFT eval

      (ign_f1=47.86)、8B SFT 训练、两规模 no-evidence SFT 训练。待完成：8B SFT eval、

      两规模 no-evidence eval、两规模 RSFT（generate→score→train→eval）。

      '

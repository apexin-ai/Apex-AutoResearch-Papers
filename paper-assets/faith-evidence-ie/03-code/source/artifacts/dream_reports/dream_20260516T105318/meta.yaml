    DocRED test (p=0.12) and Re-DocRED (p=0.18)—neither reaching conventional significance.
    The 4.6pp dev-test gap reveals that RSFT structurally overfits to the dev distribution
    via CED scoring (which uses dev gold labels to rank training candidates). This
    is not merely a limitation—it is a fundamental design flaw that makes RSFT''s
    dev-set gains misleading as evidence of method effectiveness. The paper frames
    RSFT as "the only paradigm without decoupling," but this may partly reflect that
    RSFT applies minimal optimization pressure (it is just SFT on curated data), meaning

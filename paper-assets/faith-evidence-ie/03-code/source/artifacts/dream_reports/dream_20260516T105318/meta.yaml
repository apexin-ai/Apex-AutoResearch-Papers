    Contribution 2.**

    GRPO QLoRA catastrophic collapse (rel_f1=0.014) does not reproduce on LLaMA-3.1-8B
    (rel_f1=0.28, moderate −15pp degradation). The paper offers three speculative
    hypotheses (quantization robustness, tokenizer efficiency, RLHF landscape flatness)

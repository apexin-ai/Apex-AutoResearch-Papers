    # Dream Review Report


    ## Paper

    **Understanding the Cost of Faithfulness in Generative Information Extraction:
    An Empirical Study of Evidence-Grounded Document-Level Relation Extraction**


    ## Summary

    The paper introduces evidence-grounded DocRE, a task requiring generative LLMs
    to jointly produce relation triples and supporting evidence sentences. Through
    a Qwen3-4B case study with cross-scale (1.7B, 8B) and cross-family (LLaMA-3.1-8B)
    validation, it quantifies the "evidence tax" (1.1–7.0pp Ign-F1 cost), identifies
    an evidence-extraction decoupling spectrum across GRPO/DPO/RSFT training paradigms,
    and proposes EDCR as a diagnostic metric. The paper targets an analysis/understanding
    contribution framing.


    ## Experiment Coverage

    All 6 planned experiments are present in the paper: test set evaluation (Section
    5.1), model size ablation (Section 5.3), Re-DocRED cross-dataset (Section 5.5),
    LLaMA cross-family (Section 5.4), EDCR human validation (Section 5.6), and NLI
    backbone ablation (Section 5.7). Coverage is complete.


    ---


    ## Strengths


    **S1. Well-framed and practically relevant research question.**

    Studying the cost of requiring faithful evidence in generative IE is underexplored
    and important. The paper correctly distinguishes generative evidence production
    (additional generation burden) from discriminative evidence retrieval (auxiliary
    supervision signal), and clearly explains why the evidence tax it observes complements
    rather than contradicts prior work like SAIS and DREEAM.


    **S2. Commendably honest and self-aware presentation.**

    The paper transparently reports non-significant p-values (test p=0.12, Re-DocRED
    p=0.18, NLI ablation p=0.45), openly discusses the 4.6pp dev-test gap as a structural
    flaw of RSFT, acknowledges the 4B anomaly, and explicitly scopes claims to "partial—not
    universal—generalization." This level of intellectual honesty is rare and valuable.


    **S3. Comprehensive experimental design.**

    Six experiments spanning test set validation, cross-scale ablation, cross-dataset
    transfer, cross-family validation, human evaluation, and component ablation provide
    thorough empirical coverage. The cross-family LLaMA experiment is particularly
    important for scoping claims.


    **S4. Striking decoupling phenomenon.**

    The observation that GRPO QLoRA on Qwen3-4B drives rel_f1 to 0.014 while evidence
    quality peaks at Evi-F1=85.0 is a vivid and informative failure mode. The full
    decoupling spectrum (GRPO QLoRA > GRPO bf16 > DPO > RSFT) is well-documented and
    internally consistent for the Qwen3-4B case.


    **S5. EDCR has clear method-level diagnostic utility.**

    Distinguishing catastrophic (EDCR≈1.0) from healthy (EDCR≈0.65) training paradigms

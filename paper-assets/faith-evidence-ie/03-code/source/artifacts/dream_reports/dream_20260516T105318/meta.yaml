tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 所有待完成实验成功验证，四个 Claim 完整成立，EMNLP main 强投稿
      key_assumptions:
      - Test set RSFT vs SFT 差距保持 dev 水平（Δ ≥ 4pp Ign-F1）
      - CED vs flat-NLI 在 5 seeds 下达到统计显著（p<0.05，至少在 evi_f1 或 EDCR 维度）
      - Decoupling spectrum 跨模型家族复现（LLaMA GRPO QLoRA 出现 catastrophic，bf16 mild）
      - Cross-dataset（Re-DocRED）和 cross-scale（1.7B/8B）确认 RSFT > SFT 且 evidence tax
        存在
      - EDCR 人工验证 Spearman ρ ≥ 0.7
      number_ranges:
        test_rsft_vs_sft_ign_f1_delta:
        - 4.0
        - 6.0
        ced_vs_flat_nli_p_value:
        - 0.01
        - 0.05
        ced_ign_f1_5seed_mean:
        - 0.445
        - 0.46
        flat_nli_ign_f1_5seed_mean:
        - 0.435
        - 0.445
        cross_model_rsft_sft_delta_min:
        - 3.0
        - 5.0
        llama_grpo_qlora_rel_f1:
        - 0.005
        - 0.05
        edcr_human_spearman:
        - 0.7
        - 0.85
        re_docred_rsft_vs_sft_delta:
        - 2.0
        - 5.0
      narrative_direction: 原始 framing 完全成立。四个 Claim 均有充分数据支撑：evidence-grounded DocRE
        可行（C1）、decoupling spectrum 是 RL-for-IE 通用现象且跨模型/跨家族验证（C2）、CED scoring 贡献可量化（C3）、EDCR
        双层诊断经人工验证（C4）。论文叙事无需调整，reviewer concerns 全部有数据回应。
    median:
      tier: median
      meaning: 核心贡献（C1+C2）成立但 CED 不显著优于 flat-NLI，需降级 C3 并微调叙事
      key_assumptions:
      - Test set RSFT > SFT 成立但 margin 收窄（Δ 2-4pp）
      - CED vs flat-NLI 不显著（p>0.10）——当前 dev 数据已暗示此结果（ign_f1 均值差 < 0.5pp）
      - Decoupling spectrum 在 LLaMA 上部分复现（GRPO QLoRA catastrophic 确认，但程度不同）
      - Cross-scale 部分成功：8B 确认，1.7B evidence tax 或 RSFT 增益方向一致但幅度不同
      - EDCR 人工验证中等（ρ=0.5-0.7）
      number_ranges:
        test_rsft_vs_sft_ign_f1_delta:
        - 2.0
        - 4.0
        ced_vs_flat_nli_p_value:
        - 0.1
        - 0.5
        ced_ign_f1_5seed_mean:
        - 0.443
        - 0.452
        flat_nli_ign_f1_5seed_mean:
        - 0.442
        - 0.452
        cross_model_rsft_sft_delta_min:
        - 1.5
        - 3.5
        llama_grpo_qlora_rel_f1:
        - 0.02
        - 0.15
        edcr_human_spearman:
        - 0.5
        - 0.7
        re_docred_rsft_vs_sft_delta:
        - 1.0
        - 3.0
      narrative_direction: C1（FREIGE 可行）和 C2（decoupling spectrum）仍是核心贡献，数据充分。C3 调整：CED
        降级为 'one effective scoring function among NLI-based alternatives'，不再声称 contrastive
        margin 的独立贡献；ablation table 保留但语气收缩为 'CED and flat-NLI both substantially
        improve over unfiltered RSFT'。C4 中 EDCR 方法级诊断强，per-relation 级因人工验证中等需加 caveat。补充
        top_k ablation（k=1 >> k=3）作为 scoring precision 论点替代 CED vs flat-NLI 的空缺。整体仍可投
        EMNLP main，但需将贡献重心明确放在任务定义 + decoupling 发现 + EDCR 诊断工具上。
    worst:
      tier: worst
      meaning: Test set 不 generalize 或 decoupling 跨家族不复现，核心 claim 需要 reframe
      key_assumptions:
      - Test set RSFT vs SFT Δ < 2pp 或不显著（dev-test gap 大，可能因 DocRED test 分布偏移）
      - 或 LLaMA GRPO QLoRA 不出现 catastrophic decoupling（spectrum 变成 Qwen-specific）
      - CED vs flat-NLI 不显著（已是大概率事件）
      - 1.7B/8B 结果与 4B 方向不完全一致（evidence tax 在大模型消失或 RSFT 增益不稳定）
      - EDCR 人工验证偏低（ρ<0.5），部分 evidence 标注模糊导致指标可信度受质疑

    capacity 分配给两个任务但 evidence 生成仍是额外负担。


    **RSFT 增益跨规模一致（3.3-5.1pp）：** CED quality filter 是 model-agnostic

    机制（基于外部 NLI 模型评估），不依赖特定 backbone 的生成特性。增益大小与

    baseline 强度负相关——1.7B baseline 已较强（47.86），ceiling effect 压缩

    absolute improvement（+3.3pp）；4B baseline 最弱（39.74），improvement 空间

    最大（+5.1pp）。所有规模 δ≥3pp，满足 [3.0, 5.0] 范围要求。



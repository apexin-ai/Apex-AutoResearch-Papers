    expert-curated dev set。两个模型在 test 上同幅退化：SFT 从 dev 39.74→test 39.2

    （-0.5pp），RSFT 从 dev 45.11→test 44.0（-1.1pp），RSFT 退化稍多因其更高的

    precision 对 noisy gold labels 更敏感（test set 的 false negative 会惩罚

    高精度模型的 true positive predictions）。


    Δ=4.8pp 在 test 上保持因 RSFT 的提升机制是 model-agnostic 的：CED-filtered

    训练数据提升了模型的 evidence-grounded 推理能力，这种能力提升不依赖

    dev-specific 分布特征（与 hyperparameter overfitting 不同），因此在 test 上泛化。

    Dev Δ=5.1pp → test Δ=4.8pp 的轻微收窄（0.3pp）在正常范围内。



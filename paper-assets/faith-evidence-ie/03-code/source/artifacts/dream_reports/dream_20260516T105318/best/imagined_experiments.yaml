tier: best
narrative_guidance: '四个 Claim 完整成立，EMNLP main 强投稿。

  Test set Δ=4.8pp Ign-F1 确认 RSFT 泛化（C1）；LLaMA GRPO QLoRA 复现 catastrophic

  forgetting（rel_f1=0.015），decoupling spectrum 跨 Qwen/LLaMA 双家族验证（C2）；

  CED vs flat-NLI 在 evi_f1 维度 bootstrap p=0.038 达显著（C3，需 7 seeds）；

  EDCR 人工标注 ρ=0.78 验证诊断有效性（C4）。

  Cross-scale（1.7B/4B/8B）+ cross-dataset（Re-DocRED）+ cross-family（LLaMA）

  三维泛化消除 RC13 single-model/single-dataset 审稿顾虑。


  ⚠️ C3 是最薄弱环节：当前 4-seed 数据显示 CED 与 flat-NLI 在 ign_f1 上几乎持平

  （CED mean=44.66 vs flat-NLI mean=44.84），best 档依赖额外 seeds 在 evi_f1

  维度拉开差距。若最终 p>0.05，CED 降级为"one possible scoring function"，

  但不影响 C1/C2/C4 成立，论文仍可投——仅 ablation 结论调整。

  '

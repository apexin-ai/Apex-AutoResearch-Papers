  # === Category 37: DocRE Foundational Benchmarks & Baselines ===

  - title: "DocRED: A Large-Scale Document-Level Relation Extraction Dataset"
    authors: Yuan Yao, Deming Ye, Peng Li, Xu Han, Yankai Lin, Zhenghao Liu, Zhiyuan Liu, Lixin Huang, Jie Zhou, Maosong Sun
    year: 2019
    venue: ACL 2019
    url: https://aclanthology.org/P19-1074/
    category: docre_foundational
    role: foundational_dataset
    key_finding: >
      首个大规模 document-level RE 数据集，从 Wikipedia 构建。5,053 篇文档，96 种关系，
      标注了 named entities、relations 和 supporting evidence sentences。
      超过 40% 的关系需要跨句推理（cross-sentence reasoning）。
    relevance_to_freige: >
      FREIGE 的主要评测数据集。DocRED 的 evidence annotation 是本项目
      evidence generation 研究的基础——衡量 evidence cost 和 evidence quality 均基于此标注。

  - title: "Revisiting DocRED -- Addressing the False Negative Problem in Relation Extraction"
    authors: Qingyu Tan, Lu Xu, Lidong Bing, Hwee Tou Ng, Sharifah Mahani Aljunied
    year: 2022
    venue: EMNLP 2022
    url: https://aclanthology.org/2022.emnlp-main.580/
    category: docre_foundational
    role: dataset_revision
    key_finding: >
      发现 DocRED 标注存在大量 false negatives（漏标关系），重新标注 4,053 篇文档，
      构建 Re-DocRED。模型在 Re-DocRED 上 F1 提升约 13 点，
      说明原始 DocRED 的评测结果受 annotation incompleteness 严重影响。
    relevance_to_freige: >
      FREIGE 在 Re-DocRED 上评测可获得更可靠的性能数据。
      Re-DocRED 的 evidence annotation 也更完整，对 evidence quality 评估更公平。

  - title: "Document-Level Relation Extraction with Adaptive Thresholding and Localized Context Pooling"
    authors: Wenxuan Zhou, Kevin Huang, Tengyu Ma, Jing Huang
    year: 2021
    venue: AAAI 2021
    url: https://arxiv.org/abs/2010.11304
    category: docre_foundational
    role: key_baseline
    key_finding: >
      ATLOP：引入 adaptive thresholding 替代固定阈值处理 multi-label 分类，
      加 localized context pooling 用 attention 聚合 entity mention-level 上下文。
      成为 DocRE 标准 baseline，后续几乎所有 encoder-based 方法都以此为起点。
    relevance_to_freige: >
      DocRE 领域最重要的 baseline 之一。FREIGE 的 LLM-based 方法需要与
      ATLOP 及其后续改进（DREEAM, SAIS 等）进行性能对比和定位。

  - title: "Document-level Relation Extraction as Semantic Segmentation"
    authors: Ningyu Zhang, Xiang Chen, Xin Xie, Shumin Deng, Chuanqi Tan, Mosha Chen, Fei Huang, Luo Si, Huajun Chen

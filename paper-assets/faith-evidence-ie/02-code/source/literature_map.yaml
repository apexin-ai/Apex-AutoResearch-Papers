    url: https://arxiv.org/abs/2106.03618
    category: docre_foundational
    role: key_baseline
    key_finding: >
      DocuNet：将 DocRE 建模为 semantic segmentation 问题，用 entity-level 关系矩阵
      作为 segmentation map，U-Net 架构捕获局部和全局依赖。
      在 DocRED 上显著超越 ATLOP。
    relevance_to_freige: >
      encoder-based DocRE 的重要 baseline，代表了非 LLM 方法的性能上界。
      与 ATLOP 一起构成 FREIGE related work 中 discriminative DocRE 的对比参照。

  # === Category 38: Evidence-Supervised DocRE (Classic Methods) ===

  - title: "SAIS: Supervising and Augmenting Intermediate Steps for Document-Level Relation Extraction"
    authors: Ruoting Xie, Jingqi Wang, Wei Cai, Runxin Xu, Baobao Chang
    year: 2022
    venue: NAACL 2022
    url: https://aclanthology.org/2022.naacl-main.171/
    category: evidence_supervised_docre
    role: direct_competitor
    key_finding: >
      通过 supervising intermediate steps（evidence retrieval）来提升 DocRE。
      两阶段 evidence retrieval：pooled evidence retrieval 区分有/无 supporting sentences 的 entity pairs，
      fine-grained evidence retrieval 为每个 relation 生成 interpretable evidence。
      在 DocRED/CDR/GDA 三个 benchmark 上达到 SOTA，evidence F1 超越 runner-up 5.04%。
    relevance_to_freige: >
      最直接的 prior work——同时做 RE 和 evidence prediction 的代表方法。
      关键区别：SAIS 是 encoder-based discriminative model 用 attention supervision，
      FREIGE 是 generative LLM 用 text-level evidence generation。
      SAIS 发现 evidence supervision 提升 RE，而 FREIGE 发现 generative evidence 有 ~8pp cost，
      这个差异正是 FREIGE 论文的核心发现之一。


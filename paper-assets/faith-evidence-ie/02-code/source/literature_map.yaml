      与我们的发现呼应：DocRE 中模型可能输出看似合理的 evidence sentences
      但实际 RE 决策并不依赖这些 evidence。这解释了为什么 joint evidence+RE 生成
      对 RE 性能有负面影响——模型在学习生成 "合理化解释" 而非 "可靠推理"。


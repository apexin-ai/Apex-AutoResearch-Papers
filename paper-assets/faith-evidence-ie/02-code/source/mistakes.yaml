  - D099
- id: M005
  date: '2026-05-18'
  category: resource_misuse
  severity: high
  summary: D102 4个并行训练因磁盘满(250GB/250GB)全部崩溃，GPU空转数小时
  root_cause: 4个训练任务同时以save_steps=50写checkpoint，每个checkpoint数GB，250GB磁盘在step 300附近写满。提交训练时未检查磁盘可用空间，也未设置save_total_limit限制checkpoint数量。
  prevention: 1. 提交训练前必须 df -h 确认剩余空间 > 预估需求（模型大小×save_steps频率×并发任务数×2倍安全余量）。2. 所有训练必须设
    save_total_limit=2-3，只保留最近N个checkpoint。3. 多任务并行时特别注意磁盘写入叠加效应。4. Director审批实验时增加磁盘检查项。
  status: active
  context: 'D102 k=1 retraining: 8B s42 (step 300/1134, epoch 0.8), 1.7B s42 (step
    300/567, epoch 1.59), LLaMA s42 (step 300/1107, epoch 0.81), 8B s43 均因EXIT_CODE=1崩溃。/dev/md0
    250G 100%使用。4张RTX 5090空转。'
  fix: 清理旧checkpoint释放空间，检查partial checkpoint可用性后resume或重启训练，配置save_total_limit=2防止再次写满。
  related_decisions:
  - D102
  - D103

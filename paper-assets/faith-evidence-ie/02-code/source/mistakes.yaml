- id: M007
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: CUDA_VISIBLE_DEVICES 被脚本内部覆盖，导致 GPU 错位和 OOM
  root_cause: seed_expansion 脚本用 `export CUDA_VISIBLE_DEVICES=${GPU:-0}` 模式，tmux wrapper
    通过环境变量设 CUDA_VISIBLE_DEVICES 但未传 GPU 变量，脚本默认覆盖为 0，导致 random_rsft 跑在 cuda:0 而非
    cuda:3，s43 启动时 OOM
  prevention: 1. 所有训练脚本禁止用 ${GPU:-0} 默认值覆盖 CUDA_VISIBLE_DEVICES，应优先读取已有环境变量；2. 脚本模式改为
    `export CUDA_VISIBLE_DEVICES=${GPU:-${CUDA_VISIBLE_DEVICES:-0}}`，先读 GPU 变量，再 fallback
    到已有 CUDA_VISIBLE_DEVICES，最后才默认 0；3. 提交训练前 dry-run 验证实际使用的 GPU ID
  status: active
  context: random_rsft.sh 被 tmux wrapper 分配到 cuda:3，但脚本内覆盖为 cuda:0，占满 cuda:0 显存 28.3GB，导致同一
    GPU 上的 plan019_1_7b_sft_s43 OOM 崩溃。random_rsft 结果本身有效但 GPU 分配违反 C002 约束。
  fix: 修复所有 scripts/seed_expansion/ 和 scripts/d102_next_batch/ 中的 CUDA_VISIBLE_DEVICES
    逻辑，重启 s43
- id: M008
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: submit_training_job 额外传 GPU=X 覆盖 tmux wrapper 的 CUDA_VISIBLE_DEVICES，导致

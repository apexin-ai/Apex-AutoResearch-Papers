mistakes:
- id: M001
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: submit_training_job wrapper 的 timeout 7200s 对 eval 任务不够，导致 rsft_s44_dev_eval
    (97%) 和 1.7B eval 连续 timeout 失败
  root_cause: DocRED dev set eval (985 docs, 247 batches × 30-50s/batch) 需要 8000-10000s
    (2.2-2.8h)，但 wrapper 默认 timeout 7200s (2h)。eval 任务与 training 任务共用同一个 timeout 值。
  prevention: eval 任务不要使用 timeout wrapper——eval 不会无限挂起，正常结束即可。如必须设 timeout，eval 用
    14400s (4h)。提交 eval 时直接 nohup 或 tmux，不经过 submit_training_job 的 timeout wrapper。
  status: active
  context: rsft_s44_dev_eval_preds 在 batch 240/247 (97%) 被杀，所有推理结果丢失。plan_006_qwen3_1_7b_rsft_eval
    在 191/247 (77%) 即将超时。两次失败浪费 ~4h GPU 时间。
  fix: 后续所有 eval 提交改为直接 nohup 运行，不使用 timeout wrapper。

- id: M016
  date: '2026-05-20'
  category: communication
  severity: medium
  summary: Evidence tax sign standardization introduced new errors — 4B RSFT and 14B
    SFT signs flipped wrong
  root_cause: When flipping signs from old convention (positive=benefit) to standard
    convention (positive=cost), I assumed all old positive values should become negative.
    But 4B RSFT (+0.94pp) and 14B SFT (+0.03pp) were already in the correct standard
    direction in the old table — evidence has small cost for these models (no_evi
    > with_evi). The old table's convention was internally inconsistent, making bulk
    sign flips dangerous.
  prevention: When standardizing sign conventions, compute each value from raw numbers
    (no_evi - with_evi) rather than mechanically flipping signs. Always verify against
    actual ign_f1 pairs.
  status: active
  related_decisions:
  - D127

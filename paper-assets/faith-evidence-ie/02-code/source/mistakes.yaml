- id: M003
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Paper Agent Related Work 含幻觉引用（E-GRPO, R1-RE）和错误引用归属（KD-DocRE = Re-DocRED
    数据集被当成方法）
  root_cause: Paper Agent 写作时生成了 literature_map 中不存在的引用（E-GRPO, R1-RE, rl_panacea），且将
    tan2022redocred（Re-DocRED 数据集论文）错误归属为 KD-DocRE 方法。LLM 写作典型的 hallucinated citation
    和 citation misattribution 问题。
  prevention: 1. Paper Agent 写 Related Work 时，所有引用必须来自 literature_map.yaml 或经 WebSearch
    验证；2. 引用 bib key 时必须交叉检查该 key 在其他章节的用法，避免同一 key 指代不同内容；3. 写完后用 reference-audit
    skill 做全文引用审计。
  status: active
  context: Reviewer 审查 related_work.tex 发现：(1) KD-DocRE citep{tan2022redocred} 实际是
    Re-DocRED 数据集不是方法；(2) E-GRPO (zhao2025egrpo) 和 R1-RE (dai2025r1re) 不在 literature_map
    中，高概率幻觉；(3) jin2025rl_panacea 也不在 literature_map 中需验证。
  fix: 派 Paper Agent 修正：删除/替换伪引用，WebSearch 验证可疑引用，补充 literature_map 中已验证的强相关论文。
- id: M004
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: Scaling 实验（8B/1.7B）RSFT 使用 k=3 但论文声明 k=1，方法论不一致
  root_cause: 4B 实验确定 k=1 最优后，scaling 实验（8B/1.7B）的 CED scoring 仍沿用了早期默认的 k=3 配置，未统一修正。Director
    审批时未检查超参一致性。
  prevention: 审批 scaling/跨模型实验时，必须逐项比对核心超参与论文声明是否一致（特别是 selection k、training epochs、LoRA
    rank 等）。新增 checklist 项：scaling 实验的每个超参必须与 canonical config 对齐或有明确理由不同。
  status: active
  context: '8B registry: top_k=3, 9041 samples; 1.7B registry: top_k=3, 9042 samples;
    4B: top_k=1, 2718 samples。4B ablation 已证明 k=1 > k=3 (+1.02pp)。LLaMA k 值待核实。'
  fix: 重新用 k=1 re-filter + re-train + re-eval 所有 scaling 模型。已有 CED scores，只需 re-filter。
  related_decisions:

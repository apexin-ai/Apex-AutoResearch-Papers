    dev_to_test_rsft_rel_f1_drop_pp: 5.75
    dev_to_test_sft_rel_f1_drop_pp: 1.27
    flatnli_rsft_test_rel_f1: 0.405
    flatnli_rsft_test_evi_f1_joint: 0.258
  result_rationale: 'Dev→test 严重衰减是 worst 档核心假设。RSFT dev→test 下降 5.75pp（0.4655→0.408），
    而 SFT 仅下降 1.27pp（0.4057→0.393）。RSFT 对分布偏移更敏感的原因： (1) RSFT 训练数据生成和 CED 打分均在 train
    split 上进行，候选筛选隐式适应了 train/dev 的共享标注风格； (2) test set annotator 更保守（relation 密度更低），RSFT
    的 recall-oriented training signal 在 test set 上产生更多 false positive； (3) test set
    的 entity 分布更密集，distractor 句子更多，EDCR 从 0.635 恶化至 0.690。

    RSFT 仍优于 SFT（+1.5pp rel_f1），但 p=0.08 边界不显著，reviewer 可合理主张 "dev set 增幅存在过拟合成分"。

    Joint Evi-F1（DREEAM 协议）极低（0.265 vs conditional 0.770）——这是因为 joint 协议 要求 relation
    也正确才计 evidence 分数，rel_f1 ~0.41 直接拉低上限。 与 DREEAM test set 57.34 的对比需极其谨慎：评估协议完全不同
    （生成式句子索引 vs encoder attention-based extraction）。


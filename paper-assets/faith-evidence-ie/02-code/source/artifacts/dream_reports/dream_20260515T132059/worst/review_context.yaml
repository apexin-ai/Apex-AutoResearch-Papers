  figures_description:
  - 'Scatter plot: per-document Evi-F1 差异 (CED − flat-NLI)，大部分文档集中在 ±0.02 区间，仅少数 hard-negative-heavy
    文档 CED 明显优于 flat-NLI'
  - 'Venn diagram: CED top_k=1 selected 2718 vs flat-NLI threshold selected 2920 的重叠，展示
    76% overlap'
  analysis: 'CED 与 flat-NLI 无统计显著差异（三个指标均 p>0.10）。RSFT 的收益主要来自 rejection sampling
    本身 （过滤低质量候选的 floor effect），而非 CED 特有的对比信号。在 reframed narrative 下， 这转化为正面发现："RSFT
    对 scoring function 选择鲁棒，practitioners 可用任意 NLI scorer"—— 降低了方法的 entry barrier，但也意味着
    CED 不再是独立 contribution。

    '
- name: Test set evaluation
  plan_id: plan_002
  description: '用 RSFT best config (s44) 在 DocRED test set 上评估。提交 CodaLab 获取官方 F1/Ign-F1，
    本地计算 conditional Evi-F1、DREEAM-aligned joint Evi-F1 和 EDCR。

    '
  expected_results:
    rsft_test_rel_f1: 0.408
    rsft_test_ign_f1: 0.401
    rsft_test_evi_f1_conditional: 0.77
    rsft_test_evi_f1_joint: 0.265

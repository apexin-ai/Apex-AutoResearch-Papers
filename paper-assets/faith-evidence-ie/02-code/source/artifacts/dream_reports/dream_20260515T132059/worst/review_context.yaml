    rel_f1 0.63 vs 我们 0.408 是 extraction gap）。 论文必须用单独一节解释两种 Evi-F1 协议的差异，并坦诚 joint
    指标的局限。 在 reframed narrative 下，dev→test 衰减本身变成 analysis contribution： "生成式 evidence
    方法对标注分布偏移更敏感" 是有价值的发现。


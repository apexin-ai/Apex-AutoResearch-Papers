    grpo_g8_final_evi_f1: 0.635
    grpo_g8_frac_zero_std_final: 0.08
    grpo_g4_best_rel_f1: 0.217
    grpo_g4_best_evi_f1: 0.575
    g8_vs_g4_rel_f1_improvement_pp: 1.8

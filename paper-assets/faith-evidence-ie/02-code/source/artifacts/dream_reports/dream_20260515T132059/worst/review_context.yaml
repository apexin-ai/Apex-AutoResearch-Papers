  result_rationale: 'DeBERTa-large 的更强 NLI 能力（disc accuracy 83.5% vs 81.5%）未转化为下游
    RSFT 差异。 Rel_f1 base 0.466 vs large 0.459（base 反而略高 -0.65pp），evi_f1 差 +0.33pp，EDCR
    差 +0.6pp—— 全部在噪声范围内。

    原因与 plan_001（CED vs flat-NLI）一致：scoring function 的精度不是 RSFT 成功的关键。 DeBERTa-large
    的更大 margin（0.52 vs 0.48）改变了部分候选的排序，但 selected samples 重叠度 87%——绝大部分候选在两个 scorer
    下做出相同筛选决策。 Large 模型的 NLI 推理时间 2.8x base，cost-benefit 完全不合理。

    在 reframed narrative 下，这是一句话结论： "NLI scorer 能力在 base 级别已饱和，RSFT 对 scoring precision
    不敏感"。

    '

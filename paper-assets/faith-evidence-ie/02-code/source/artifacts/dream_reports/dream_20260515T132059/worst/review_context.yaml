    offline-preference (DPO) → offline-curation (RSFT)，y 轴 rel_f1，展示单调递增趋势'
  - 'Training dynamics 对比: GRPO G=4 / GRPO G=8 / DPO / RSFT 的 rel_f1 vs training step，展示
    GRPO 的 divergence vs DPO/RSFT 的 stability'
  analysis: 'DPO 是 worst 档叙事的关键拼图。GRPO → DPO → RSFT 的 spectrum 揭示： structured IE 需要完全避免
    policy gradient（DPO 虽 offline 但仍用 implicit reward model）， 数据 curation（RSFT）才是最
    robust 的路径。

    但 DPO 接近 RSFT 的 worst 档预期（0.385 vs 0.466）部分被推翻——如果 DPO rel_f1 ≥ 0.35 但明显低于 RSFT，那
    RSFT 的优势在于 data quality（not just avoiding gradients）。 这对 reframed narrative 有利：可以论证

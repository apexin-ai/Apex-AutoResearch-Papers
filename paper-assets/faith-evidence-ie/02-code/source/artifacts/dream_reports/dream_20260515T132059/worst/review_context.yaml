      evi_f1: 0.52
      reward: 0.95
    trajectory_step_40:
      rel_f1: 0.168
      evi_f1: 0.55
      reward: 1.15
    trajectory_step_60:
      rel_f1: 0.225
      evi_f1: 0.58

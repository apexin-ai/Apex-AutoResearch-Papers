      edcr: 0.6565
    - config: RSFT CED (s44)
      rel_f1: 0.4655
      evi_f1: 0.8087
      edcr: 0.635
    - config: Δ (CED best − flat-NLI best)
      rel_f1: +0.95pp
      evi_f1: −0.33pp
      edcr: −2.3pp
    - config: p-value (paired bootstrap)
      rel_f1: '0.11'
      evi_f1: '0.42'

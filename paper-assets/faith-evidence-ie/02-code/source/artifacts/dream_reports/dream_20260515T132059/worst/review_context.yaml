- name: DPO+CED experiment
  plan_id: plan_012
  description: '用 RSFT 候选数据构造 preference pairs (CED-preferred vs CED-rejected)，DPO
    训练。 验证 DPO 作为 online-offline 中间方法是否避免 GRPO 的 catastrophic forgetting。

    '
  expected_results:
    dpo_rel_f1: 0.385
    dpo_evi_f1: 0.805
    dpo_edcr: 0.652
    dpo_evi_f1_joint: 0.268
    dpo_precision: 0.392
    dpo_recall: 0.378
    dpo_format_ok_rate: 0.998
    dpo_training_loss_final: 0.62

narrative_guidance: 'RSFT 优势在 test set 上大幅缩水（Δrel_f1 仅 +1.5pp over SFT，p≈0.08）， CED
  vs flat-NLI 无统计显著差异，GRPO G=8 部分恢复证明 G=4 failure 有 advantage noise 成分， DPO 接近 RSFT
  水平证明 offline 优势不在 rejection sampling。核心叙事必须全面 reframe。

  新叙事方向："首次对 LLM DocRE evidence generation 的系统性研究"—— 从 method paper 转型为 analysis +
  benchmark paper。

  贡献重组：(1) 首个 LLM DocRE evidence benchmark（任务定义 + 评测协议 + 多指标框架，含 DREEAM 对齐 joint Evi-F1
  + EDCR）； (2) online vs offline RL 的系统对比（GRPO G=4/G=8 vs DPO vs RSFT），发现 catastrophic
  forgetting 主要由 QLoRA + 小 group size 的脆弱组合驱动，而非 online RL 本身固有缺陷； (3) evidence 评估指标的局限性分析（conditional
  vs joint Evi-F1 的巨大落差 + EDCR 与人工判断弱相关）。

  CED 完全降级为 explored scoring function（与 flat-NLI 等价）。 仍冲 EMNLP Main，但可能推迟到 ARR September
  或 AAAI 2027 以积累 model size / dataset 覆盖。

  '
imagined_experiments:
- name: CED vs flat-NLI RSFT ablation
  plan_id: plan_001
  description: '用 flat-NLI scoring（p_pos 阈值，无 contrastive margin）筛选 RSFT 训练数据， 与 CED
    scoring 做 head-to-head 对比。复用已有 candidates，仅替换打分函数。

    '
  expected_results:
    flatnli_rsft_best_rel_f1: 0.456
    flatnli_rsft_best_evi_f1: 0.812
    flatnli_rsft_best_edcr: 0.658
    flatnli_rsft_selected_samples: 2920
    ced_rsft_best_rel_f1: 0.4655
    ced_rsft_best_evi_f1: 0.8087
    ced_rsft_best_edcr: 0.635
    ced_vs_flatnli_rel_f1_gap_pp: 0.95
    ced_vs_flatnli_evi_f1_gap_pp: -0.33
    ced_vs_flatnli_edcr_gap_pp: -2.3
    paired_bootstrap_p_rel_f1: 0.11
    paired_bootstrap_p_evi_f1: 0.42
    paired_bootstrap_p_edcr: 0.15
    candidate_overlap_jaccard: 0.76
  result_rationale: '在 worst 档下，flat-NLI 的 p_pos 阈值筛选与 CED margin 筛选高度重叠（Jaccard ~0.76）。
    根本原因：DocRED 中 entity-sharing distractor 的 NLI 分数分布与 gold evidence 有足够间距 （MVP-1
    mean_margin=0.48），单纯高 p_pos 阈值已能过滤大部分 distractor，CED 的 contrastive margin 仅在 hard
    negative（p_neg > 0.6）上有边际优势，这类样本占比 <15%。

    Evi-F1 差异 -0.33pp（CED 反而略低），因 CED margin 过滤偏严格导致训练数据少 ~200 samples， reduced diversity
    的负面效应抵消了质量优势。EDCR 差 -2.3pp 方向正确但 p=0.15 不显著。 Rel_f1 差 +0.95pp CED 略优，但 p=0.11
    不显著——可能来自随机种子噪声而非 scoring 差异。

    结论：Claim 2 统计上不成立。CED 降级为 "one of several viable scoring functions"。

    '
  tables:
  - name: 'Table: CED vs flat-NLI RSFT Head-to-Head (Dev Set)'
    rows:
    - config: SFT baseline
      rel_f1: 0.4057
      evi_f1: 0.7979

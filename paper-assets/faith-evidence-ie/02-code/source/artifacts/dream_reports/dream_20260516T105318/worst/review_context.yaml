narrative_guidance: 'Reframe 为分析/诊断贡献论文。Test set RSFT vs SFT 增益不显著（<2pp）， decoupling
  可能是 Qwen-specific（LLaMA 不复现 catastrophic failure）， evidence tax 在不同模型规模下不一致（1.7B/8B
  远小于 4B 的 7pp）。 核心叙事转向 "Understanding the cost of faithfulness in generative IE"——
  evidence generation 代价存在但 magnitude 是 model-specific，EDCR 作为方法级诊断工具仍有独立价值。 Scope
  收缩为 Qwen3-4B 深度 case study + 跨规模/跨家族的辅助验证显示 findings 不完全泛化。 目标降级为 EMNLP Findings
  track。

  '

- name: EDCR human validation (100 samples)
  plan_id: plan_013
  description: '100 个样本人工标注：对每个 cited evidence sentence 判断是否真正支持对应 relation。 计算 EDCR
    与人工判断的 Spearman ρ，验证 EDCR 作为自动诊断指标的可信度。

    '
  expected_results:
    n_annotated: 100
    inter_annotator_kappa: 0.55
    edcr_human_spearman_rho: 0.42
    edcr_human_pvalue: 0.028
    ambiguous_cases_pct: 28
    clear_correct_pct: 52
    clear_wrong_pct: 20
    false_positive_rate: 0.18
    false_negative_rate: 0.22
    per_relation_type_agreement: 0.38
  result_rationale: 'EDCR-human 相关偏低（ρ=0.42）的结构性原因： (1) Evidence 标注主观性高——IE 中 "一个句子是否支持一个关系"
    不是二元判断。 例如 "The university was established in 1905 by the local government" 是否支持
    (university, inception, 1905)？大多数人说是。是否支持 (university, founded_by, local_government)？约
    60% 说是——"founded by" vs "established by" 的语义等价性存在争议。 ~28% 样本落入这种 ambiguous zone，这直接压低
    ρ 的上限。 (2) NLI-IE calibration gap：EDCR 基于 DeBERTa NLI 的 entailment score， NLI
    训练数据（SNLI/MNLI）是 sentence-pair 自然语言推理，与 IE 的 "entity-relation-evidence" 三元组语义不完全对齐。NLI
    对 "implicit support"（需要 world knowledge 的推理链） 系统性低估，导致 false negative（人觉得 evidence
    有效但 NLI 分低）。 (3) 方法级 EDCR 高相关（ρ=-0.965）受极端值驱动（GRPO QLoRA EDCR≈1.0）， 去掉极端值后 sample-level
    相关自然下降。 Inter-annotator κ=0.55 也说明任务主观性——这是 ρ 的自然上限约束。

    '

  result_rationale: 'DeBERTa base vs large 差异不显著（Δ=0.5pp, p=0.45）的原因： (1) CED 的瓶颈不在
    NLI 模型——scoring 过程是 "将 (head, rel, tail, evidence_sentence) 构造为 NLI hypothesis-premise
    pair" → NLI 打分。信息损失发生在 IE→NLI 的转换步骤， 而非 NLI 模型本身。base 和 large 模型对同一组 (premise,
    hypothesis) 对的 ranking 高度一致（Kendall τ > 0.9），因为 easy case 两者都能区分，差异只在 hard negative
    的 fine-grained ordering 上——而 top_k=1 的 harsh selection 策略抹平了这种 marginal 差异。 (2)
    82% 的 selected samples 重叠——两个 scorer 选出的 rank-1 response 大部分相同。 只有 18% 的 doc 换了不同的
    candidate，这 18% 中 base 选错（F1 更低）的比例仅稍高。 (3) RSFT 本身对训练数据的 marginal 质量差异不敏感——top_k=1
    已确保所有 selected samples 都是 "reasonably good"，base vs large 的区别仅在 "good vs slightly
    better"，对 3-epoch SFT 的最终性能影响可忽略。


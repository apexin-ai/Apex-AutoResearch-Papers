    llama_grpo_qlora_rel_f1: 0.28
    llama_grpo_qlora_ign_f1: 27.5
    llama_grpo_qlora_evi_f1: 0.82
    llama_grpo_qlora_edcr: 0.78
    decoupling_severity: moderate, not catastrophic
    qwen_grpo_qlora_rel_f1_for_reference: 0.0138
  result_rationale: 'LLaMA-3.1-8B GRPO QLoRA 不出现 catastrophic decoupling（rel_f1 0.28
    vs Qwen 0.0138）： (1) Quantization robustness：LLaMA 系列是 4-bit 量化研究的主要 testbed（GPTQ/AWQ/bitsandbytes
    论文大多以 LLaMA 为实验对象），其权重分布经社区广泛验证在 4-bit 下保持较好精度—— QuRL (2024) 发现 quantized-full
    precision divergence 在不同 architecture 间差异巨大。 Qwen3 的中英双语 embedding 层在 4-bit 量化下可能有更大信息损失。
    (2) Tokenizer efficiency：LLaMA tokenizer 对英文 Wikipedia 文档的 token/word ratio 更低（~1.2
    vs Qwen ~1.4），相同 max_new_tokens 下 LLaMA 有更多有效容量 同时编码 RE triples 和 evidence sentences——capacity
    bottleneck 更宽松。 (3) Pre-training RL alignment：LLaMA-3.1 经过更 heavy 的 RLHF 阶段， 模型对
    RL 优化压力的鲁棒性更强（optimization landscape 更平坦）， 不易在 RL fine-tuning 中发生 sudden mode
    collapse。 结果：LLaMA GRPO QLoRA rel_f1=0.28（退化 ~15pp，moderate），EDCR=0.78（moderate
    decoupling）， 远非 Qwen 的 catastrophic（rel_f1=0.0138，EDCR=0.99）。 Decoupling 确实存在（rel_f1
    下降），但 severity 与 Qwen 完全不同级别。 这意味着 "QLoRA amplifies to catastrophic" 是 Qwen-specific，不是
    universal。

    '

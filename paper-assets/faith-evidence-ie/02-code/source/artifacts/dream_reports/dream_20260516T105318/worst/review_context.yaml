    SFT baseline 跨 dev→test 下降小（~0.8pp），因其直接学习 gold label 分布，泛化稳定。 但 RSFT 增益高度依赖 dev
    set 分布：CED scoring 在 dev gold 上计算 F1 过滤训练样本， scoring function 隐式过拟合 dev 的 relation
    type 分布和 evidence pattern。 具体机制——RSFT 选出的 2718 训练样本中，高 F1 的 relation types（如 country,
    instance_of） 被系统性富集，这些 types 在 dev 上频率高但 test 上分布可能不同。 当 test set 的 relation type
    长尾分布偏移时，RSFT 学到的 dev-aligned self-improvement 信号失效， 增益从 dev +5.1pp（s44 reeval）压缩到

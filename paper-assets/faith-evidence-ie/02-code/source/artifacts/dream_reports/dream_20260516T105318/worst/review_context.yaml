  plan_id: plan_006
  description: '在 Qwen3-1.7B 和 8B 上复现完整 pipeline：SFT → no-evidence SFT → RSFT → eval。
    验证 evidence tax 和 RSFT 增益跨模型规模的一致性。 1.7B SFT eval 已完成（ign_f1=47.86），结果反常地高于 4B（39.74）。

    '

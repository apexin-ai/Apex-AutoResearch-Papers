  figures_description:
  - 'Scatter plot: EDCR auto score (x) vs human binary judgment (y) with ambiguous
    cases marked gray'
  - 'Error analysis: 典型 false positive/negative 案例展示 NLI-IE gap'
  analysis: 'ρ=0.42 statistically significant（p<0.05）但 moderate。 审稿人攻击点："If EDCR correlates
    only 0.42 with human judgment, how reliable is your per-relation diagnostic (Claim
    4)?" 应对策略： (1) 强调 EDCR 的方法级诊断仍然有效——识别 catastrophic failure（EDCR≈1.0） 不需要 sample-level
    精度，只需要 monotonicity（方法越病态 EDCR 越高）， 而方法级 ρ=-0.965 已经验证这一点。 (2) per-relation 诊断降级为
    "exploratory analysis"——提供方向性信号但非精确度量。 (3) κ=0.55 解释为 "task inherent ambiguity"
    而非 EDCR 缺陷—— 任何自动指标在这种主观性任务上都无法远超 annotator agreement。 (4) Limitation 段诚实讨论 NLI-IE
    calibration gap 和 improvement direction （domain-adapted NLI, direct evidence evaluation
    model）。 此结果不致命但削弱 Claim 4 的 "diagnostic tool" 定位—— EDCR 更适合定位为 "decoupling severity
    indicator"（方法级）而非 "evidence quality judge"（sample 级）。

    '
- name: NLI model ablation (DeBERTa base vs large)
  plan_id: plan_010
  description: '对比 DeBERTa-v3-base (86M) 和 DeBERTa-v3-large (304M) 作为 CED scorer，
    评估 NLI backbone 能力对 CED scoring 质量和下游 RSFT 性能的影响。

    '

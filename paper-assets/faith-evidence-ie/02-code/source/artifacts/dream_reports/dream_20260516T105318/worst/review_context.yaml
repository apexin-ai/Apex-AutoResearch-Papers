    llama_sft_ign_f1: 42.5
    llama_sft_rel_f1: 43.0
    llama_sft_evi_f1: 80.2
    llama_sft_edcr: 0.7
    llama_no_evidence_ign_f1: 48.0
    llama_evidence_tax_pp: 5.5
    llama_rsft_ced_ign_f1: 44.8
    llama_rsft_rel_f1: 45.5

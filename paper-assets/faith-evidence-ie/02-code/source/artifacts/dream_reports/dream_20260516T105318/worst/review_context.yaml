    pre-training data mixture 和 recipe——1.7B 可能在 Wikipedia/knowledge-intensive 任务上有更好的数据配比（小模型训
    token 数/参数量比值更高）。 Evidence tax 与 capacity bottleneck 相关：4B 的 7pp tax 反映模型同时处理
    RE + evidence 生成时的 severe capacity competition。1.7B 本身 RE 能力更强（隐含其语言理解 在 DocRE
    域更好），evidence 生成的 marginal 负担更小→ tax 仅 1.1pp。 8B 容量最大，evidence tax 也小（~1.5pp），但

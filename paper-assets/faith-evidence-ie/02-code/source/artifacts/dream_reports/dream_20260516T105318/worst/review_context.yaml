  analysis: 不显著差异（p=0.45）意味着 CED 的工程选择（base vs large）对论文结论无实质影响—— 对 paper 是 neutral
    finding。 但审稿人可能追问两个方向： (1) "If NLI model quality doesn't matter, what does CED
    actually capture?" → 回答：CED 的价值在 contrastive structure（gold vs distractor 对比 scoring），
    不在 NLI 模型的 absolute calibration。换言之，CED 是 structural contribution， NLI 只是提供了 similarity
    metric 的一个 reasonable instantiation。 (2) "Could you replace NLI with a simpler
    metric?" → 这是有力的 follow-up question，如果 base 和 large 无区别， BM25 或 TF-IDF 可能也无区别——这会进一步削弱
    CED 的 "NLI-based" 标签。 在 worst tier 下此实验是低风险低收益——不伤论文但也不帮论文。 建议在论文中作为 appendix
    ablation 简短报告，不占 main text 篇幅。

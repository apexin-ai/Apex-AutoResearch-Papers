- name: LLaMA-3.1-8B cross-family validation
  plan_id: plan_016
  description: '在 LLaMA-3.1-8B 上复现 SFT → RSFT → GRPO QLoRA pipeline。 核心验证：decoupling
    spectrum 是否跨模型家族成立——尤其是 GRPO QLoRA 是否也 catastrophic。

    '

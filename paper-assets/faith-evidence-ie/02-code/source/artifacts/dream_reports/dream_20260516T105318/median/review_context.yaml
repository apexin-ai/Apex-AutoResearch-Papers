    (Δ ~4-5pp vs SFT baseline), demonstrating the critical role of NLI-based quality
    filtering in RSFT. The choice between CED and flat-NLI is not statistically significant
    (p=0.31), suggesting that the contrastive margin, while theoretically motivated,
    does not translate to measurable downstream gains."


narrative_guidance: 'C1+C2 核心贡献成立，数据充分。Test set 确认 RSFT > SFT 但 margin 从 dev ~5pp
  收窄至 ~3pp。 CED vs flat-NLI 5-seed 对比不显著（p≈0.19），C3 降级为 "CED is one effective NLI-based
  scorer, not uniquely superior"；ablation 叙事转向 top_k precision（k=1 >> k=3 已确认）和 NLI-based
  scoring 整体优于 unfiltered RSFT。Decoupling spectrum 在 LLaMA 上部分复现（QLoRA catastrophic
  方向一致但 程度不同：rel_f1≈0.08 vs Qwen3 0.014），cross-scale 在 8B 确认、1.7B 方向一致但增益偏小。EDCR 方法级诊断依然强（ρ=-0.96），但
  per-relation 人工验证中等（ρ=0.58），需加 caveat。整体仍可投 EMNLP main， 贡献重心：任务定义 + decoupling 发现
  + EDCR 诊断工具。CED scoring 定位为 practical recipe 而非理论贡献。 5-seed significance test 补充说明：当前
  4-seed 数据已暗示 flat-NLI mean (0.4484) ≥ CED mean (0.4466)， 第 5 seed 不会逆转此趋势。

  '

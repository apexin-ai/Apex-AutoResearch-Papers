- name: EDCR Human Annotation Validation
  plan_id: plan_013
  description: '100 个样本人工标注。标注员判断每个 cited evidence sentence 是否真正支持对应 relation triple。
    计算 EDCR 与人工判断的 Spearman ρ，验证 EDCR 作为自动指标的有效性。分 method-level 和 per-relation-type
    两层报告。

    '
  expected_results:
    n_annotated_samples: 100
    n_annotated_triples: 850
    inter_annotator_agreement_kappa: 0.62
    method_level_edcr_human_spearman: 0.82
    per_relation_edcr_human_spearman: 0.58
    per_triple_edcr_human_spearman: 0.51
    binary_high_low_edcr_human_kappa: 0.44
    systematic_disagreement_categories:
      partial_evidence_support: 0.23
      multi_hop_reasoning: 0.18
      implicit_evidence: 0.12
  result_rationale: 'Method-level EDCR 与人工判断的相关性较高（ρ≈0.82），因为方法级差异显著（SFT vs RSFT vs
    GRPO 的 evidence 质量差异很大，人工标注可以清晰区分）。Per-relation-type 相关性中等（ρ=0.58）， 因为：(1) 某些
    relation types 的 evidence 存在 partial support（NLI 给高分但人工认为仅部分支持）， 占比 23%——例如 "member_of"
    关系的 evidence 句可能只暗示而非明确陈述成员关系；(2) multi-hop reasoning cases（18%）中 NLI 无法跨句推理但人工标注者可以整合上下文；(3)
    implicit evidence（12%） 中人工标注者接受隐含支持但 NLI model 给低分。这些系统性分歧导致 per-relation ρ 从方法级的
    0.82 下降至 0.58。Per-triple 级别更低（0.51）因为单样本噪声更大。 ρ=0.58 落在 median 档 [0.5, 0.7] 区间，足以支撑

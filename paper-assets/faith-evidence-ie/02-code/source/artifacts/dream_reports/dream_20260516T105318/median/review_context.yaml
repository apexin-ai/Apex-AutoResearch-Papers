    累积差异的方差过大（seed-to-seed 波动 ~0.9pp），5 seeds 的统计 power 不足以检测 <0.5pp 的差异。

    p=0.31 远大于 0.05 甚至 0.10，CED 的 contrastive margin 在统计意义上不优于 flat-NLI 的 朴素 NLI 打分。根本原因：CED
    的 hard negative contrastive 设计确实提供更 informative 的信号 （per-sample scoring 质量更高），但
    flat-NLI 的 simplicity 在 aggregation 后达到类似效果—— flat-NLI 虽然 per-sample 区分度低，但在 top_k=1
    严格筛选下，高分样本的质量与 CED 无实质差异。


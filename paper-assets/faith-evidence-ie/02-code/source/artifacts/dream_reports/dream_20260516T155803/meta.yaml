  - name: DREEAM-protocol Evidence F1 对齐评估
    plan_id: plan_004 (extension)
    description: 将 FREIGE 生成的 free-text evidence 映射到句子 ID，按 DREEAM 评估协议（sentence-level
      P/R/F1）计算 Evi-F1。与 DREEAM 复现结果（54.01）直接对比。
    expected_results:
      freige_rsft_dreeam_protocol_evi_f1: 0.55
      freige_rsft_dreeam_protocol_evi_p: 0.62
      freige_rsft_dreeam_protocol_evi_r: 0.49
      freige_sft_dreeam_protocol_evi_f1: 0.51
      dreeam_baseline_evi_f1: 0.5401
      delta_rsft_vs_dreeam: 0.01
    result_rationale: FREIGE 的 conditional evi_f1=0.81 是 token-level 精确匹配（生成文本 vs
      gold 文本），而 DREEAM protocol 是 sentence-level 二分类（哪些句子被引用）。映射引入两个损失：(1) 生成的 evidence
      文本不完全匹配原句导致 fuzzy matching 丢失 ~5%；(2) FREIGE 倾向引用句子片段而非完整句子，sentence-level recall
      受限。但 FREIGE precision 高（0.62）因为 CED 已筛选高质量 evidence。最终 0.55 略高于 DREEAM 的 0.54，说明
      generative evidence 映射到句子级后仍有竞争力——这是 remarkable 的，因为 DREEAM 是专门为 sentence retrieval
      设计的 encoder 模型，而 FREIGE 是 generative model 的副产品。

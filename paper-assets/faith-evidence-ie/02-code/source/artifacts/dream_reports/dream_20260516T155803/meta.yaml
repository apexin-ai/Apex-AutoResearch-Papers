  - name: EDCR 人工标注验证
    plan_id: plan_013
    description: '100 个样本人工标注。每个样本包含模型生成的 relation triple + cited evidence sentences。标注员判断每个
      evidence sentence 是否真正支持该 relation（binary: supports / does not support）。计算 EDCR
      与人工 evidence faithfulness 评分的 Spearman 相关。'
    expected_results:
      n_samples: 100
      human_spearman_rho: 0.78
      human_spearman_p: 1.0e-05
      human_agreement_kappa: 0.82
      edcr_precision_at_top10: 0.9
      edcr_recall_at_bottom10: 0.8
      mean_human_faithfulness_score: 0.73
      false_positive_rate: 0.08
      false_negative_rate: 0.14
    result_rationale: EDCR 本质是 NLI-based 的 evidence-relation 一致性度量，与人工判断 'evidence
      是否支持 relation' 高度对齐——两者测量的是同一个概念（evidence faithfulness）。ρ=0.78 而非 1.0 的原因：(1)
      NLI 模型对某些隐含推理（如 temporal reasoning、multi-hop inference）的判断与人类不完全一致（~15% 分歧）；(2)
      EDCR 是 document-level 聚合（平均所有 triples），而人工是 per-triple 判断，聚合引入平滑。Precision@top10
      高达 0.90 说明 EDCR 最高分样本几乎全部是真正 faithful 的，验证了 EDCR 作为诊断工具的实用价值。
    tables:

  - name: EDCR Human Annotation Validation
    plan_id: plan_013
    description: '100 个样本人工标注，判断每个 cited evidence sentence 是否真正支持对应 relation。 计算 EDCR
      与人工判断的 Spearman 相关性。

      '
    expected_results:
      n_annotated_samples: 100
      annotator_agreement_kappa: 0.52
      edcr_human_spearman_rho: 0.31
      edcr_human_spearman_p: 0.0018
      edcr_human_pearson_r: 0.27
      human_evi_precision: 0.72
      human_evi_recall: 0.58
      false_positive_evidence_rate: 0.28
      edcr_identifies_bad_cases: true
      edcr_magnitude_calibration: poor
    result_rationale: 'Worst 档假设 EDCR-human ρ < 0.40。根本原因是 EDCR 基于 NLI model（DeBERTa）的
      entailment 判断， 而人工标注者对 "evidence supports relation" 的判断标准与 NLI entailment 有系统性偏差：
      (1) NLI 模型对间接证据（需要推理链的 evidence）给出低分，但人工标注者认为这些仍是有效证据； (2) NLI 模型对表面相关但逻辑不充分的
      evidence 给出高分（lexical overlap bias），人工标注者识别出不充分性。 ρ=0.31 统计显著（p<0.002）但实际意义有限——仅解释约
      10% 的方差。 EDCR 在方向上有效（高 EDCR 的样本确实更可能有问题），但在绝对值上校准不良（EDCR=0.7 和 EDCR=0.8 的人工质量差异不显著）。
      标注者一致性 κ=0.52 本身就不高，反映了 evidence sufficiency 判断的固有主观性—— 这限制了任何自动指标与人工判断的相关性上界。


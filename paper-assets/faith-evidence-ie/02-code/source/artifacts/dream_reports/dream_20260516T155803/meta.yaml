  - name: NLI model ablation (DeBERTa-v3-base vs large)
    plan_id: plan_010
    description: 用 DeBERTa-v3-base 替换 DeBERTa-v3-large 作为 CED scorer，重新对 RSFT candidates
      打分并训练，评估 NLI 模型能力对最终性能的影响。
    expected_results:

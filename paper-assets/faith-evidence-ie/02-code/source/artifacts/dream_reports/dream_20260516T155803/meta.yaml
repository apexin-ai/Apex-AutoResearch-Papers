        - '0.80'
    figures_description:
    - 'Scatter plot: EDCR score (x-axis) vs human faithfulness rating (y-axis) for
      100 samples, with regression line and ρ annotation. Color-coded by method (SFT/RSFT/GRPO)'
    analysis: ρ=0.78 充分验证 EDCR 作为自动指标的有效性——远超经验性阈值 0.7（'good' correlation for automated
      metrics vs human judgment，参考 BERTScore 的验证标准）。EDCR 在极端值（pathological GRPO 模型

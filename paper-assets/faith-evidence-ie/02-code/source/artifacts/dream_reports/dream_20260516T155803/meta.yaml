      rsft_with_large_scorer_evi_f1: 0.815
      delta_rel_f1: -0.014
      delta_discrimination_acc: -0.075
    result_rationale: DeBERTa-v3-base (86M params) vs large (304M params) 的 NLI 能力差距约
      2-3pp MNLI accuracy（base ~88%, large ~91%）。这个差距传导到 CED discrimination：base 的
      accuracy 从 0.815 降到 ~0.74（对 entity-sharing distractors 的区分能力下降）。Scoring quality

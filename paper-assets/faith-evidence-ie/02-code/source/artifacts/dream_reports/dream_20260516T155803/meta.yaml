  - name: Re-DocRED RSFT evaluation
    plan_id: plan_007
    description: 在 Re-DocRED 上用 DocRED-trained RSFT CED best config 做 zero-shot transfer
      eval，同时训练 Re-DocRED-specific RSFT 并评估。验证 evidence extraction 跨数据集泛化。
    expected_results:
      redocred_rsft_transfer_ign_f1: 0.395
      redocred_rsft_transfer_evi_f1: 0.825
      redocred_rsft_transfer_edcr: 0.655
      redocred_sft_baseline_ign_f1: 0.366
      redocred_rsft_gain: 0.029
      redocred_vs_docred_evi_f1_gap: 0.01
    result_rationale: Re-DocRED 是 DocRED 的重标注版本（修正 false negatives），relation ontology
      完全相同（96 types）。SFT 已在 Re-DocRED 上达到 ign_f1=0.366, evi_f1=0.817。RSFT 的 CED scoring
      机制不依赖数据集特定分布（NLI 是通用语义判断），因此 RSFT 增益可迁移。Best 档下 RSFT 改善 +2.9pp（略低于 DocRED 的
      +5pp，因为 Re-DocRED 的 55% 无 evidence 标注 triples 引入噪声）。Evi-F1 从 0.817 提升至 0.825，确认
      evidence generation 能力跨数据集泛化。关键观察：evi_f1 在两个数据集上几乎相同（0.815 vs 0.825），说明模型学到的

  date: 2026-05-17 12:45 UTC
  summary: Lead 1 CED sentence-level filter = negative result。CED 有效粒度确认为 response-level
    reranking，不是 sentence-level filtering。
  rationale: CED 逐句过滤在所有 tau（0.3/0.5/0.7）下 evi_f1 均下降 -7.6pp（0.8063→0.73）。Precision

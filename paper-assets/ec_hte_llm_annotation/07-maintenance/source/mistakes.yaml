- id: M001
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: exp-003 mixing matrix 假设 P(Z)=0.5，但 DGP 有 P(Z=1)≈0.33，导致所有修正结果系统性偏误
  root_cause: exp-003 复制了 exp-001 的简化版 build_mixing_matrix（仅适用于 P(Z)=0.5），而未使用 exp-007
    已有的通用版本（含 P(Z) 参数）。代码复用时未检查前置假设是否匹配新 DGP。
  prevention: 1. 共享工具函数（build_mixing_matrix, invert_mixing_safe）应提取到独立模块，所有实验统一调用，禁止复制粘贴。2.
    新实验的 DGP 与旧实验不同时，必须检查所有复用函数的假设条件是否仍然成立。3. Reviewer 审查代码时应对照 DGP spec 文档检查隐含假设。
  status: active
  context: exp-003 Phase A 半合成基准。DGP 中 Z=(sentiment==2)，P(Z=1)≈0.33。build_mixing_matrix
    用 col_sum 归一化等价于 P(Z)=0.5 的贝叶斯规则特例。正确值 M[0,0]=0.920 vs 错误值 0.850，差 7pp。
  fix: 从 exp-007 提取通用 build_mixing_matrix(C, p_z, p_z_hat)，exp-003 传入从专家数据估计的 P(Z)。同时补
    invert_mixing_safe。重跑 100 MC。
  related_decisions:
  - D005

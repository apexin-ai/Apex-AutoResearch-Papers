- id: M008
  date: '2026-05-22'
  category: experiment_design
  severity: high
  summary: 诊断指标仅在 synthetic 数据验证就写入论文 claim，真实 CM 上 AUC 从 0.86 降至 0.63
  root_cause: Proposition 3 的 AUC=0.86 仅在 synthetic symmetric errors 下验证。未在真实 LLM
    CM（高度非对称 FPR/FNR）上交叉验证就写入论文作为 Contribution C3。真实 CM 上 pooled AUC=0.63，K=2 时 AUC=0.0（系统性反预测）。
  prevention: 任何诊断/分类指标在 synthetic 数据上验证后，必须用 real 数据交叉验证再写入论文 claim。性能可能在 controlled
    和 real 设置间严重分化。
  status: active
  context: exp-028 发现：(1) 非对称 B_s 公式对 binary Z 与对称公式代数等价（2×2 column-stochastic M 的性质），无法改善；(2)
    K=2 时 |δ_0|=|δ_1|，score 差异仅来自 1/π_s，与实际 harm 方向负相关；(3) K=4 中部分 combo AUC=1.0 但部分
    AUC=0.0
  fix: limitations.tex 更新为诚实报告 AUC=0.63 + K=2 反预测机制 + asymmetric 等价性。experiments.tex
    Section 5.4 加 K=2 caveat。C3 定位从 practical diagnostic tool 调整为 theoretically grounded
    criterion。

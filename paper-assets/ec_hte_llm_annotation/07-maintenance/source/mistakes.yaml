- id: M003
  date: '2026-05-21'
  category: agent_behavior
  severity: medium
  summary: Worker 进程被意外 kill（SIGTERM 传播），导致 exp-003 HB 100MC 丢失 ~2h 计算
  root_cause: 取消一个卡死的 Worker session 时，SIGTERM 信号传播到了该 Worker 启动的后台实验进程（PID 78723）。Worker
    cancel 和实验进程的生命周期没有解耦。
  prevention: 1. 长时间实验用 nohup + disown 启动，确保进程与 Worker session 解耦。2. cancel Worker
    前先确认该 Worker 是否有正在运行的后台实验进程。3. 对 >1h 的实验，启动时记录 PID 到 registry，cancel 前交叉检查。
  status: active
  context: exp-003 HB 集成 full 100 MC run 在约 60% 完成时被意外 kill。原因是 Director 取消了一个看似卡死的
    Worker，但该 Worker 的实验进程仍在运行。损失约 2h CPU 时间，需要从头重跑。
  fix: 重启了 exp-003 HB 100MC run 作为新 Worker，当前 ~60% 完成中。
- id: M004
  date: '2026-05-21'
  category: experiment_design
  severity: medium
  summary: GPU Worker 用了错误分析脚本 analyze_ec_hte.py（per-Z 3×3 CM），在 balanced-Z 下结构性奇异导致
    EC-HTE 退化为 Naive
  root_cause: analyze_ec_hte.py 按 Z 值分组计算 3×3 CM。balanced-Z 定义 Z=1 if true_label≥1，导致
    Z=0 组只有 negative 样本（neutral/positive 行全零），CM rank≤1，矩阵不可逆，fallback 到单位矩阵。GPU Worker
    在标注完成后自动运行了这个脚本，而非论文框架中的 binary per-subgroup CM pipeline。
  prevention: GPU 上部署分析脚本前，必须验证：(1) CM 维度与 Z 定义匹配（balanced binary Z 只能用 2×2 CM）(2)
    分层变量是 subgroup S 而非 treatment Z (3) 先在小样本上 dry-run 确认矩阵非奇异。对于关键实验，禁止自动运行未经验证的分析脚本。
  status: active
  fix: 丢弃 analyze_ec_hte.py 输出，用正确的 analyze_llama.py / run_llama_semisynthetic.py
    框架（binary 2×2 CM, per-subgroup S）重新分析全部 4 模型。
- id: M005
  date: '2026-05-21'
  category: communication
  severity: high
  summary: C1 论文整合时 crossover 对比基准写错（vs Global 应为 vs Naive）+ §5.7 措辞暗示 EC-HTE 超越 Global
    + MC seeds 数不一致
  root_cause: Paper Agent patch 时我提供的数据说 "RMSE crossover at n=1000" 未明确说明是 vs Naive
    还是 vs Global。Paper Agent 按 convention 理解为 vs Global（论文其他地方 crossover 都指 vs Global），但
    C1 数据中 Global 始终 ≥ HB。同时我的 patch 指令说 50 seeds 但 Paper Agent 沿用了 Table 1 的 100
    MC runs 格式。
  prevention: 向 Paper Agent 提供数据时，必须明确标注每个 claim 的对比基准（vs Naive / vs Global / vs Strat.MLE）。crossover
    这类关键概念必须附带精确定义。MC seeds 等实验参数必须显式传达，不能假设 Paper Agent 会从数据推断。
  status: active
  fix: Paper Agent 修复中：(1) Table 8 caption 改 crossover 定义为 vs Naive (2) §5.7 改写消除
    vs Global 暗示 (3) MC runs 100→50

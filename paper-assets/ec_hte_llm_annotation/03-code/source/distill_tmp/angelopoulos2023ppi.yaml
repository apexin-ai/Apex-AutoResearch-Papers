  core_claim: "PPI provides a general framework for valid statistical inference (means, quantiles, regression coefficients) by combining a small labeled dataset with ML predictions on a large unlabeled dataset, with no assumptions on the ML algorithm and tighter CIs from better predictions."
  key_results: "Provably valid confidence intervals; more accurate predictions yield smaller CIs; demonstrated on means, quantiles, linear and logistic regression"

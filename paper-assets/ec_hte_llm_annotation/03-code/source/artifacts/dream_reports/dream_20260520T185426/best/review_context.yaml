- name: Formal bias bound verification
  plan_id: exp-002
  description: '解析推导 bias = f(Δ_miscls, Δ_CATE) 的 closed-form bound， 在二分类 × 两 subgroup
    的 canonical case 下给出精确表达式， 然后在系统参数网格上 MC 验证 bound tightness。

    '
  expected_results:
    bias_bound_form: Δ_bias_global ≈ (Δ_FPR - Δ_FNR) × Δ_CATE / (1 - avg_error_rate)
    example_subgroup_low_error_fpr: 0.05
    example_subgroup_high_error_fpr: 0.25
    example_pooled_fpr: 0.15
    example_cate_subgroup_low: 0.12
    example_cate_subgroup_high: 0.04
    example_uncorrected_bias_low_subgroup: 0.012
    example_global_corrected_bias_low_subgroup: 0.094
    bias_amplification_factor_constructive: 7.8
    bound_covers_empirical_fraction: 0.97
    median_bound_tightness_ratio: 1.35
    bias_amplification_range_moderate:
    - 5.2
    - 8.1
    bias_amplification_range_extreme:
    - 7.5
    - 11.6
    bias_amplification_at_homogeneous:
    - 0.9
    - 1.1
  result_rationale: 'Bias 放大机制的直觉：global correction 用 pooled confusion matrix C_global
    修正所有 subgroup。 对于低错误率 subgroup g_low (FPR=0.05)，C_global 过估了其误分类率 (pooled FPR=0.15)，
    导致过度修正——将本来接近正确的 LLM label 分布往错误方向推。具体地， 修正公式 p_corrected = C^{-1} × p_observed，当
    C 比真实 C_g 差异大时， 修正引入的 bias 正比于 (C_global - C_g) 作用在 subgroup 真实分布上。 在两 subgroup
    case 下这退化为 Δ_FPR × Δ_CATE 的乘积形式。 Amplification factor 7.8x 出现在 moderate 参数下 (Δ_FPR=0.20,
    Δ_CATE=0.08)， 因为 uncorrected bias 仅来自 subgroup 自身的误分类（~0.012），而 global correction
    引入的跨 subgroup 信息污染远大于此。Homogeneous regime 下 amplification ≈ 1.0 是因为 Δ_FPR ≈ 0
    使得额外 bias 项消失。Bound tightness ratio 1.35 表示 analytic bound 略保守（upper bound），覆盖
    97% 的 MC realizations。

    '

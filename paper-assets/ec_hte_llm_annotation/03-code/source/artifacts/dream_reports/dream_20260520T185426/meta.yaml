    # Dream Review Report: EC-HTE


    **Paper:** EC-HTE: Error-Corrected Heterogeneous Treatment Effect Estimation under
    Subgroup-Varying LLM Misclassification


    **Review mode:** Full (2 Reviewers, 4-step roundtable)


    ---


    ## Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methodology + Experiments | 4 (Borderline Accept) | 4/5 |

    | R2 | Novelty + Related Work | 3 (Borderline Findings) | 4/5 |

    | **Consensus** | | **3.5 (Borderline Conference)** | |


    ---


    ## 1. Paper Summary


    The paper identifies a previously uncharacterized bias mechanism in heterogeneous
    treatment effect (HTE) estimation with LLM-annotated covariates: global confusion-matrix
    correction introduces bias proportional to Δπ × Δτ (the product of misclassification
    heterogeneity and CATE heterogeneity across subgroups). To address this, the authors
    propose EC-HTE, a hierarchical Bayesian framework with Dirichlet-prior partial
    pooling that estimates subgroup-stratified confusion matrices, providing principled
    regularization between global and fully stratified correction. A diagnostic risk
    score (AUROC=0.84) is derived as a decision heuristic. Experiments span synthetic
    validation, semi-synthetic benchmarks (CardiffNLP TweetEval with GPT-4.1, Qwen3-235B,
    Claude Sonnet 4.6), budget sensitivity, PPCI comparison, robustness analysis,
    and causal forest leaf-level integration. EC-HTE reduces CATE bias by 55–76% relative
    to global correction with ~500 expert labels for k ≤ 4 subgroups.


    ---


    ## 2. Strengths (Consensus)


    **S1. Clean and verifiable analytic result.** The bias decomposition (Eq. 1) for
    k=2 is constructive, not asymptotic. The multiplicative Δπ × Δτ structure is intuitive
    and actionable. The r=0.97 correlation between analytic predictions and MC simulations
    across a systematic parameter grid is compelling. (R1, R2)


    **S2. Principled and well-motivated Bayesian framework.** Dirichlet-prior partial
    pooling is the natural conjugate choice for confusion matrices. The shrinkage
    behavior — conservative at small n, permissive at large n — is empirically confirmed
    across the full n_expert sweep (42% advantage at n=50 → 4% at n=2000). The "guaranteed
    non-inferiority" property is a genuine methodological contribution. (R1, R2)


    **S3. Comprehensive experimental coverage.** 11 experiments covering bias verification,
    main comparisons, budget sensitivity, robustness to misspecification, adaptive
    allocation, multi-LLM generalization, and leaf-level alternatives. Systematic
    parameter sweeps with 1000 MC runs per cell are more informative than point comparisons.
    (R1, R2)


    **S4. Honest and calibrated presentation.** The paper does not oversell. The Discussion
    explicitly frames "debiasing can hurt" as monotonic and predictable rather than
    shocking. The diagnostic threshold is presented as a heuristic requiring calibration,
    not a universal rule. Limitations are forthright about the missing real-data experiment.
    (R1, R2)


    **S5. Clear problem formulation and positioning.** The covariate-side vs. outcome-side
    distinction with PPCI is technically precise and well-articulated. The claim that
    "no prior work addresses correction when the mismeasured variable defines the
    conditioning structure itself" is narrow enough to be defensible. (R2)


    **S6. Actionable practical guidance.** The budget analysis with linear crossover
    scaling (k=2→150, k=4→300, k=8→600) and the concrete recommendation of n≥500 for
    k≤4 gives practitioners usable decision rules. (R1)


    ---


    ## 3. Weaknesses (Consensus)


    **W1. [Major] Severely thin bibliography.** 11 references is far below the 40–60
    expected at a top venue. Critical omissions include: (a) multiple imputation for
    misclassified categorical variables (Blackwell et al. 2017; Cole et al. 2006);
    (b) Bayesian measurement error models (Gustafson 2003; Richardson & Gilks 1993);
    (c) semi-parametric efficiency bounds under misclassification (Hu & Schennach
    2008); (d) active learning / optimal annotation allocation (Settles 2012); (e)
    the HTE estimation literature itself (Wager & Athey 2018; Kennedy 2023). This
    makes the novelty claim difficult to evaluate — the reader cannot tell if the
    authors are unaware of or deliberately omitting closely related work. (R1 raised,
    R2 strongly flagged)


    **W2. [Major] No real-data validation.** Every result relies on fully synthetic
    DGPs or semi-synthetic setups with constructed treatment effects. The semi-synthetic
    experiment preserves real LLM error patterns but the outcome model is still experimenter-controlled.
    For a methods paper making practical recommendations (500 labels, k≤4), the absence
    of any real causal inference pipeline demonstration is a significant gap. (R1,
    R2)


    **W3. [Moderate] Narrow methodological novelty.** The core technique — subgroup-stratified
    Bayesian measurement error correction with partial pooling — is well-established
    in the measurement error literature. What is new is the application context (LLM
    annotations as covariates in HTE) and the specific bias characterization (Δπ ×
    Δτ product). This is valuable "application novelty" but the methodological contribution
    is incremental. The paper would benefit from clearly acknowledging this and positioning
    the contribution as bridging two literatures rather than introducing a new method.
    (R2 primary, R1 partial agreement)


    **W4. [Moderate] Coverage systematically below nominal.** EC-HTE achieves 86–89%
    coverage against a 90% nominal target across all settings — a persistent 2–4pp
    undercoverage that is reported but never diagnosed. Is this finite-sample posterior
    predictive error, failure to account for subgroup assignment uncertainty, or the
    causal forest''s own coverage properties? The MC standard error of coverage (~0.01)
    means this gap is statistically significant at some settings but borderline at
    others. A formal test or decomposition is needed. (R1 primary)


    **W5. [Moderate] The k=2 restriction on the analytic result.** Eq. 1 is exact
    for binary subgroups only. The experiments extend to k=4 and k=8, but the theoretical
    grounding weakens with k. No approximate extension or bound is provided for general
    k, leaving a gap between theory (k=2) and practice (arbitrary k). (R1)


    **W6. [Moderate] Diagnostic risk score has circular budget dependency.** The diagnostic
    requires estimating Δπ̂ (from expert labels) and Δτ̂ (from data), but using it
    to decide whether to *collect* subgroup-specific expert labels creates a bootstrapping
    problem. The recommended workflow (pilot study → compute S → decide) is reasonable
    but the pilot itself consumes expert labels. This circularity is not fully addressed.
    (R2)


    **W7. [Minor] Visual density.** 11 tables in 8 pages of main text leaves almost
    no room for intuition-building figures. A single schematic showing how global
    correction over-corrects low-error subgroups and under-corrects high-error ones
    would be worth more than Tables 9–11. The paper reads as a technical report rather
    than a conference submission. (R2 primary, R1 partial agreement)


    **W8. [Minor] Missing baselines.** SIMEX (Simulation-Extrapolation) and multiple
    imputation are standard measurement error baselines that are absent. Post-hoc
    calibration (temperature/Platt scaling) of LLM outputs is another natural comparator.
    An ablation separating stratification from partial pooling (e.g., stratified MAP
    with simpler prior) would clarify what drives improvement. (R1)


    ---


    ## 4. Detailed Technical Comments


    ### 4.1 Analytic Result (Eq. 1)

    The derivation is sound for k=2 with fixed confusion matrices. The multiplicative
    structure correctly captures how global correction "averages out" subgroup-specific
    misclassification. However, amplification factors (1.4×–9.8×) are reported without
    confidence intervals. The constructive example (Δπ=0.10, Δτ=0.08 → 3.5×) is well-chosen
    for the moderate-heterogeneity narrative.


    ### 4.2 Dirichlet-Prior HB Model

    The conjugate Dirichlet-multinomial is computationally convenient and statistically
    natural. Key concern: the prior α₀ controls shrinkage but its selection is not
    discussed. At n=50 with k=4 (~12 labels per subgroup), the prior dominates — is
    α₀ set via empirical Bayes, cross-validation, or fixed? The number of posterior
    draws for CATE CI propagation is also unspecified.


    ### 4.3 Semi-Synthetic Design

    The CardiffNLP TweetEval setup with real text and real LLM errors is the paper''s
    strongest empirical contribution. However, the 3-subgroup structure (political/economic/factual
    framing) aligns cleanly with the method''s input — if real-world subgroup boundaries
    are less clean, the reported bias reduction could be inflated. The ecological
    validity argument is persuasive but not definitive.


    ### 4.4 PPCI Comparison

    The "orthogonality" framing is technically accurate and fair. EC-HTE roughly halves
    PPCI''s bias (ratio 0.51–0.55) in the covariate-side setting. The composition
    question (applying both corrections simultaneously when both error sources are
    present) deserves at least theoretical discussion.


    ### 4.5 Adaptive Allocation

    Allocating labels proportional to τ̂_j × π̂_j requires initial estimates from
    a first-stage uniform batch. The two-stage variance is not accounted for in Table
    9. The 18% improvement at n=250 is modest, and the diminishing returns above n=800
    appropriately downplay this as a secondary contribution.


    ### 4.6 Experiment Coverage vs. Design Context

    All 11 planned experiments (exp-001 through exp-011) are present in the paper.
    exp-004 (Ashwin real-data) is correctly reported as unavailable. The coverage
    is complete relative to the design.


    ---


    ## 5. Questions for Authors


    1. **Coverage diagnosis:** The 86–89% coverage is systematically below 90% nominal.
    Can you decompose this into (a) posterior predictive approximation error, (b)
    subgroup assignment uncertainty, and (c) causal forest coverage properties?


    2. **Prior sensitivity at low n:** How sensitive are EC-HTE results at n=50–100
    to the Dirichlet prior α₀? A sensitivity analysis over prior strength is critical
    when each subgroup has ~12 labels.


    3. **Extension to general k:** Can you provide even an approximate bias bound
    for k>2? The gap between the k=2 theory and k=4/8 experiments is a notable limitation.


    4. **Multiple imputation baseline:** Have you compared against multiple imputation
    for misclassified categorical variables? This is the most natural classical alternative.


    5. **Real-data path:** Beyond the Ashwin dataset, what specific applications are
    you pursuing? Can you demonstrate even partial validation (e.g., showing subgroup-varying
    residuals consistent with the Δπ × Δτ pattern on real data without ground-truth
    CATE)?


    ---


    ## 6. Consolidated Assessment


    ### Score: 3.5 (Borderline Conference)


    **What works well:** The paper addresses a genuine, timely problem at the intersection
    of LLM annotation and causal inference. The analytic bias characterization is
    clean and novel in its specific formulation. The hierarchical Bayesian correction
    is principled and well-validated across a thorough experimental grid. The honest,
    calibrated presentation is refreshing.


    **What holds it back:** Three issues collectively prevent a confident accept recommendation:


    1. **Bibliography gap (W1):** 11 references misses entire relevant literatures
    (measurement error models, multiple imputation, efficiency theory, active learning).
    This is the most readily fixable weakness but in its current form makes the novelty
    claim unsubstantiated.


    2. **No real data (W2):** For a paper making practical recommendations (500 labels,
    k≤4), the complete reliance on synthetic/semi-synthetic evaluation is a significant
    empirical gap. The semi-synthetic design partially mitigates this but cannot substitute
    for end-to-end validation.


    3. **Narrow novelty (W3):** The method is standard HB measurement error correction
    applied to a new context. This is valuable application work but the methodological
    contribution is incremental. A richer literature engagement would help the authors
    position the novelty more precisely.


    ### Recommendation


    The paper is on the borderline between main conference and Findings. With revisions
    — expanded bibliography (essential), at least a partial real-data demonstration,
    a coverage decomposition analysis, and tighter presentation (move Tables 9–11
    to appendix, add a mechanism figure) — it could reach a solid 4. In its current
    form, it is a competent methods paper with a clean core result and thorough synthetic
    evaluation, but insufficient novelty signaling and empirical grounding for confident
    main-track acceptance at a top ML venue.


    ---


    ## Appendix: Individual Reviewer Reports


    ### R1 (Methodology + Experiments) — Score: 4, Confidence: 4/5

    **Key strengths:** Clean analytic result, well-motivated HB model, comprehensive
    parameter sweeps, honest diagnostic presentation, appropriate baselines, actionable
    budget guidance.

    **Key weaknesses:** No real data, coverage undercoverage undiagnosed, k=2 restriction,
    thin bibliography, missing classical baselines (SIMEX, MI), adaptive allocation
    uses estimated inputs without accounting for two-stage variance.


    ### R2 (Novelty + Related Work) — Score: 3, Confidence: 4/5

    **Key strengths:** Well-scoped problem, principled method, honest positioning,
    clear covariate/outcome-side distinction, thorough experiments.

    **Key weaknesses:** Narrow novelty (standard HB in new context), severely thin
    bibliography (11 vs 40–60 expected), no real data, diagnostic has circular budget
    dependency, 11 tables too dense, "debiasing can hurt" incrementally novel at best.'

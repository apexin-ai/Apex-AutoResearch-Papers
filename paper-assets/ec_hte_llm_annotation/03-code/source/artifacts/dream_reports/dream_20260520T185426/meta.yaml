      ec_hte_bias_at_n250_k2_extreme: 0.008
    result_rationale: 'HB partial pooling 在 best 档的核心优势来自两个机制：(1) Dirichlet 先验在小样本下自动将
      subgroup-specific confusion matrix 向 global pooled estimate 收缩，避免了 stratified
      MLE 在 n/k 小时的高方差问题—— 当 n_expert=250, k=4 时每 subgroup 仅 ~63 个 label，MLE 估计的 confusion
      matrix 方差很大， 而 HB 通过 hyperprior 借信息，bias 减少 ~58%；(2) 在 homogeneous regime 下
      HB 自动退化为 near-global 估计（收缩强），不会因为不必要的分层而增加方差。Coverage 在 0.92-0.96 范围是因为 HB 的后验区间天然校准——PyMC
      采样给出的 credible intervals 包含了参数不确定性传播。 k=4 比 k=2 略差是因为每 subgroup 样本更少，但 partial
      pooling 缓冲了这个退化。

      '

    # Dream Review Report: "When Debiasing Backfires: Error-Corrected HTE with LLM
    Annotations"


    **Review Mode**: Full (2 Reviewers, 4-step roundtable)

    **Date**: 2026-05-20


    ---


    ## Overall Assessment


    **Score: 4 / 6 (Weak Accept)**


    This paper identifies a genuinely novel and practically important failure mode
    in LLM-assisted heterogeneous treatment effect estimation: global error correction
    amplifies subgroup-level CATE bias by 5–10× when the variable being corrected
    is itself the effect modifier. The proposed EC-HTE framework (hierarchical Bayesian
    confusion matrix estimation + corrected pseudo-outcomes + causal forest integration)
    is technically sound and validated across an impressively comprehensive set of
    11 experiments. However, the paper''s impact is limited by (a) thin related work
    that under-contextualizes the contribution, (b) missing reproducibility details
    for the Bayesian core, and (c) an 8-page format strained by 16 tables and 10 experimental
    subsections. These are fixable issues — with revision, this paper could reach
    a clear accept.


    ---


    ## Strengths


    **S1. Novel and important problem identification (both reviewers agree this is
    the paper''s strongest contribution).** The insight that global confusion-matrix
    correction backfires when LLM misclassification rates covary with the heterogeneity
    structure has not been formalized before. Proposition 1''s multiplicative bound
    (Δ_FPR − Δ_FNR) × Δ_CATE / (1 − ē) provides crisp intuition: bias is zero when
    *either* misclassification or treatment effects are homogeneous, and only becomes
    dangerous when both forms of heterogeneity coexist — precisely the setting of
    LLM-annotated CSS studies.


    **S2. Comprehensive experimental coverage.** All 11 planned experiments appear
    in the paper: synthetic validation (Table 3–4), semi-synthetic with GPT-4.1/Qwen3
    (Tables 5–7), real-data Ashwin et al. (Table 8), diagnostic criterion ROC (Tables
    9–10), budget sensitivity (Table 11), PPCI comparison (Table 12), multi-LLM comparison
    (Table 13), adaptive allocation (Table 14), robustness (Table 15), and causal
    forest integration (Table 16). This level of thoroughness is rare.


    **S3. Well-designed semi-synthetic benchmark.** Using real LLM annotation errors
    on real political tweets with injected CATE structure gives the best of both worlds:
    realistic error patterns with known ground truth. The four discourse-register
    subgroups (formal policy / news / informal / youth slang) are ecologically valid.


    **S4. "Never worse than global" robustness guarantee.** Table 15 shows EC-HTE
    outperforms global correction even with 50% random subgroup labels (bias 0.024
    vs 0.038). HB partial pooling automatically shrinks toward the global estimate
    when subgroup signals are weak. This safety property eliminates the "what if I
    pick wrong subgroups?" objection and is arguably the paper''s most compelling
    practical feature.


    **S5. Honest and nuanced PPCI comparison.** Table 12 shows EC-HTE wins on covariate-side
    error (bias ratio 0.24–0.34) but PPCI wins on outcome-side error (bias 0.009 vs
    0.015). Framing these as "orthogonal problems" rather than claiming uniform superiority
    increases credibility.


    **S6. Actionable diagnostic criterion.** The Δ_miscls × Δ_CATE product (AUROC
    = 0.95, cross-dataset threshold stability in [0.006, 0.010]) gives practitioners
    a concrete decision rule from pilot annotations. While this follows directly from
    Proposition 1, its practical value is independent.


    **S7. Honest limitations.** The paper explicitly acknowledges: subgroups must
    be pre-defined, performance degrades at K = 8 with n < 200, and real-data validation
    is limited to one dataset.


    ---


    ## Weaknesses


    **W1. [Major] Reproducibility gap in Bayesian core.** Section 4.1 specifies the
    Dirichlet-Gamma hierarchical model but omits all MCMC implementation details:
    which sampler (PyMC? Stan? NumPyro?), number of chains, warmup iterations, convergence
    diagnostics (R̂, ESS), thinning. For a method whose key advantage (calibrated
    credible intervals, partial pooling strength) depends entirely on posterior quality,
    this is a critical omission. Coverage claims (≥91%) are meaningless without evidence
    that chains converged.


    **W2. [Major] Theory–experiment gap: K = 2 bound vs K = 4 experiments.** Proposition
    1 is derived for the canonical binary K = 2 case. The main experiments use K =
    4 subgroups with multi-class outcomes. The paper never states whether the bound
    extends to K > 2, what the analogous expression looks like, or even whether the
    K = 2 case is shown as a pedagogical simplification of a more general result.
    This disconnect between theory and experiments weakens both.


    **W3. [Major] Real-data bias definition is ambiguous.** Section 5.3 reports CATE
    "bias" on the Ashwin et al. refugee dataset, but real data has no ground-truth
    CATE. The paper presumably treats the n_expert = 800 expert-coded subset as ground
    truth and estimates CATE from it, but this is never stated. Without this clarification,
    the real-data results lack interpretability. Additionally, expert labels ≠ ground
    truth — inter-annotator agreement and expert reliability should be discussed.


    **W4. [Major] Thin related work (9 references total).** For a paper that bridges
    measurement error correction, Bayesian estimation, causal inference, and LLM annotation,
    9 references is insufficient. Key omissions:

    - Measurement error in causal inference: Carroll et al. (2006) textbook; Battistin
    & Chesher (2003); Lewbel (2007)

    - LLM-as-annotator CSS: Törnberg (2023); Pangakis et al. (2023); Reiss (2023)

    - HTE methods beyond causal forests: Künzel et al. (2019, X-learner); Nie & Wager
    (2021, R-learner); Kennedy (2023, DR-learner)

    - Bayesian annotation models: Dawid & Skene (1979); Paun et al. (2018)

    This thins the paper''s contextualization and risks reviewers perceiving a narrow
    literature awareness.


    **W5. [Minor] Information density exceeds 8-page capacity.** 16 tables and 10
    experimental subsections (5.1–5.10) leave no room for adequate discussion of any
    single experiment. Sections 5.8 (adaptive allocation), 5.10 (causal forest), and
    5.7 (multi-LLM) are P2 contributions that would benefit from appendix treatment,
    freeing space for deeper discussion of core results and expanded related work.


    **W6. [Minor] DSL distinction needs sharpening.** Both EC-HTE and DSL (Egami et
    al. 2024) use confusion matrix estimation. The key difference — DSL uses a global
    matrix because it targets ATE, while EC-HTE needs subgroup-specific matrices for
    HTE — should be stated as a crisp one-sentence distinction. Currently the reader
    must infer this.


    **W7. [Minor] Invertibility of Ĉ_g not discussed.** Equation 3 applies Ĉ_g^{-1}.
    While this requires only that the classifier beat random chance (det(Ĉ_g) ≠ 0),
    this assumption should be stated, especially for high-K settings where some subgroup
    confusion matrices may be near-singular with small n.


    **W8. [Minor] Methodological novelty is modest.** EC-HTE combines three established
    components: hierarchical Bayesian estimation (Gelman & Hill 2006), confusion matrix
    correction (standard in survey statistics), and causal forests (Athey et al. 2019).
    The combination is sensible but arguably straightforward once the problem is identified.
    The paper would benefit from explicitly discussing what technical challenges arise
    in the integration (e.g., uncertainty propagation from posterior C_g through the
    inverse to pseudo-outcomes to forest leaf estimates).


    ---


    ## Questions for Authors


    1. **MCMC details**: What software/sampler was used? How many chains, iterations,
    warmup? What were typical R̂ and ESS values? How long does EC-HTE take to run
    relative to global correction?


    2. **K > 2 theory**: Does Proposition 1 generalize to K > 2 classes / K > 2 subgroups?
    If yes, what is the form? If no, is the K = 2 case shown as illustrative?


    3. **Real-data ground truth**: In Section 5.3, how exactly is CATE "bias" computed?
    Is the expert-coded subset treated as ground truth? What is inter-annotator agreement
    among experts?


    4. **Unbalanced subgroups**: At n = 250, K = 4, uniform allocation gives ~63 per
    subgroup. How do results change when subgroup sizes are highly imbalanced (e.g.,
    youth slang tweets being 5% vs formal policy being 40%)?


    5. **Computational cost**: What is the wall-clock time for EC-HTE''s MCMC step?
    Is it practical for studies with K = 8+ subgroups?


    6. **Continuous effect modifiers**: The discretization results (Table 15: 3 vs
    12 bins) suggest sensitivity. Is there a principled way to choose binning, or
    could EC-HTE be extended to continuous modifiers?


    7. **Diagnostic threshold units**: The threshold 0.008 for Δ_miscls × Δ_CATE —
    does this have interpretable units? How should a practitioner calibrate this to
    their specific setting?


    ---


    ## Reviewer Scores


    | | R1 (Methods + Experiments) | R2 (Novelty + Related Work) | Consensus |

    |---|---|---|---|

    | **Score** | 4 (Weak Accept) | 4 (Weak Accept) | **4 (Weak Accept)** |

    | **Confidence** | 4/5 | 3/5 | — |


    ---


    ## Experiment Coverage Assessment


    All 11 experiments from the design plan are present in the paper:


    | Experiment | Plan ID | Paper Section | Status |

    |---|---|---|---|

    | HB synthetic validation | exp-001 | §5.1, Tables 3–4 | ✅ Complete |

    | Formal bias bound | exp-002 | §3, Tables 1–2 | ✅ Complete |

    | Semi-synthetic benchmark | exp-003 | §5.2, Tables 5–7 | ✅ Complete |

    | Real-data validation | exp-004 | §5.3, Table 8 | ✅ Complete (but bias definition
    unclear) |

    | Diagnostic criterion | exp-005 | §5.4, Tables 9–10 | ✅ Complete |

    | Budget sensitivity | exp-006 | §5.5, Table 11 | ✅ Complete |

    | PPCI comparison | exp-007 | §5.6, Table 12 | ✅ Complete |

    | Multi-LLM comparison | exp-008 | §5.7, Table 13 | ✅ Complete |

    | Adaptive allocation | exp-009 | §5.8, Table 14 | ✅ Complete |

    | Robustness | exp-010 | §5.9, Table 15 | ✅ Complete |

    | Causal forest integration | exp-011 | §5.10, Table 16 | ✅ Complete |


    **Coverage**: 11/11 (100%). No planned experiment is missing. However, 3–4 of
    the secondary experiments (exp-008, exp-009, exp-011) are compressed to the point
    where their discussion depth is insufficient.


    ---


    ## Revision Recommendations (Priority-Ordered)


    1. **Add MCMC implementation details** — sampler, convergence diagnostics, runtime.
    This is the most urgent fix.

    2. **Expand related work** to 20+ references covering measurement error literature,
    LLM annotation CSS work, HTE methods, and Bayesian annotation models.

    3. **Clarify real-data bias computation** — explicitly state how ground truth
    is defined.

    4. **Extend or discuss Proposition 1 for K > 2** — even a remark on the general
    case would help.

    5. **Move 3–4 secondary experiments to appendix** — use freed space for deeper
    discussion and expanded related work.

    6. **Sharpen DSL distinction** — one sentence on why global correction suffices
    for ATE but fails for HTE.


    ---


    ## Meta-Assessment


    This paper''s primary value is **problem identification**: the insight that global
    error correction backfires in HTE estimation is novel, well-formalized, and practically
    consequential for the growing CSS community using LLM annotations. The method
    (EC-HTE) is a competent solution that leverages the problem structure (subgroup-specific
    confusion matrices via HB partial pooling), though it is more an engineering contribution
    than a methodological breakthrough. The experimental coverage is exceptional in
    breadth but compressed in depth.


    At a top ML venue with ~25% acceptance rate, this paper sits at the borderline.
    The problem is important and timely, the experiments are thorough, and the robustness
    guarantee (never worse than global) is a strong practical property. But the thin
    related work, missing reproducibility details, and K = 2 theory limitation are
    substantive gaps. With the recommended revisions — all feasible within a single
    revision cycle — this paper would be a solid accept.


    **Final Score: 4 / 6 (Weak Accept)**'

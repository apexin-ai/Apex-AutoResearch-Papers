    # Dream Review Report


    **Paper:** "When Does Subgroup-Stratified Correction Matter? Measurement Error
    Propagation in Heterogeneous Treatment Effect Estimation with LLM Annotations"


    **Review mode:** full | **Reviewers:** R1 (Methods & Experiments), R2 (Novelty
    & Related Work)


    ---


    ## 1. Summary


    The paper identifies a bias mechanism in HTE estimation when LLM annotations serve
    as effect modifiers: applying a pooled confusion matrix amplifies subgroup-level
    CATE bias in proportion to Δ_misclass × Δ_CATE. It proposes EC-HTE, a hierarchical
    Bayesian framework for subgroup-stratified confusion matrix estimation with partial
    pooling, integrated into honest causal forests. Through 11 experiments (synthetic,
    semi-synthetic, multi-LLM, real-data, robustness, budget sensitivity, PPCI comparison,
    allocation, and leaf-level integration), the paper reaches a largely negative
    conclusion: modern high-quality LLMs exhibit Δ_error ∈ [0.06, 0.09], well below
    the ~0.25 threshold where stratified correction is needed. EC-HTE provides only
    8–18% improvement in realistic settings. A diagnostic product criterion (AUROC
    = 0.68) is offered as a screening heuristic.


    ---


    ## 2. Reviewer R1 — Methods & Experiments


    ### Strengths


    **S1. Comprehensive experimental coverage.** All 11 planned experiments are executed
    and reported, spanning synthetic regime sweeps, semi-synthetic benchmarks with
    real LLM annotations (GPT-4.1, Qwen3-235B), real-data validation (fallback), PPCI
    baseline comparison, multi-LLM comparison, budget sensitivity, robustness analysis,
    adaptive allocation, and leaf-level integration. This is unusually thorough for
    a single paper.


    **S2. Honest reporting of unfavorable results.** The paper does not cherry-pick.
    It reports that EC-HTE is marginal in moderate settings (Table 1), that HB provides
    no significant advantage over MLE at n≥200 (Table 2, p≥0.18), that PPCI outperforms
    EC-HTE in realistic regimes (Table 12, ratio 1.07–1.18), and that the diagnostic
    criterion has weak AUROC (0.68). This scientific integrity is commendable.


    **S3. Bias bound verification is rigorous.** The product-structure bias formula
    (Eq. 1) is systematically verified on a parameter grid (R²=0.78), and the upper
    bound tightness is quantified (ratio ~0.55). The "debiasing can hurt" proposition
    is precisely bounded to 22% of parameter space at Δ_error > 0.25.


    **S4. Appropriate baselines.** Including PPCI (Sui et al. 2026) as a baseline
    is critical and the comparison is fair — the paper does not hide that PPCI is
    competitive or superior in realistic settings.


    ### Weaknesses


    **W1. HB model description is insufficient.** Equations 3–5 specify the generative
    model but the paper provides no details on inference: which MCMC sampler (NUTS?
    Gibbs?), how many chains, iterations, warmup, convergence diagnostics (R-hat,
    ESS), or software used. This is a serious omission for a Bayesian methods paper.
    The leaf-level integration (Table 16) reports 15% convergence failures, but no
    diagnostics are shown.


    **W2. Coverage is systematically below 90% across all settings.** EC-HTE achieves
    0.82–0.88 coverage for nominal 90% CIs (Tables 6, 7, 12, 14, 16). This is not
    a one-off issue but a systematic failure of uncertainty quantification. The paper
    acknowledges this in Limitations but provides no analysis of the cause (posterior
    under-dispersion? Dirichlet prior misspecification? Propagation of correction
    uncertainty into pseudo-outcomes?) or proposed fix. For a framework claiming to
    integrate correction into causal forest CIs, this is a core methodological shortcoming.


    **W3. Statistical significance absent for most comparisons.** Only Table 2 (HB
    vs MLE) provides p-values. The key comparisons — EC-HTE vs Global in semi-synthetic
    (12.5% improvement), EC-HTE vs PPCI (Table 12), EC-HTE vs Uncorrected in real
    data (Table 7, 10% improvement) — report only point estimates of bias with no
    confidence intervals, standard errors, or significance tests. It is impossible
    to assess whether reported differences are statistically meaningful.


    **W4. Primary real-data validation missing.** The Ashwin et al. (2025) refugee
    dataset was inaccessible due to ethical restrictions. The fallback to a single
    public CSS dataset with only 10% improvement provides weak validation. The paper
    effectively has no real-world causal inference application demonstrating practical
    value.


    **W5. Diagnostic criterion is not useful in practice.** AUROC=0.68 overall, dropping
    to 0.58 in the moderate regime (Table 9) — the very regime where guidance is most
    needed. At 90% sensitivity, FPR=0.45, meaning the criterion would unnecessarily
    recommend stratified correction in nearly half of cases. The NPV reframing (threshold
    < 0.02 → use global) is reasonable but limited: it only confidently rules OUT
    stratified correction, never rules it IN. A practitioner following this framework
    would almost always default to global correction anyway, making the framework''s
    value marginal.


    **W6. PPCI dominates EC-HTE in all realistic settings.** Table 12 shows PPCI achieves
    lower or comparable bias in moderate (0.055 vs 0.065), homogeneous (0.028 vs 0.030),
    and semi-synthetic (0.032 vs 0.035) regimes, with consistently better coverage
    (0.87–0.89 vs 0.82–0.85) and 3× faster computation. EC-HTE only wins in the extreme
    regime (Δ_error=0.35), which the paper itself shows is empirically rare. The paper
    notes the two approaches are "theoretically orthogonal" and could be composed,
    but defers this entirely to future work. This is a critical gap.


    **W7. Expert budget requirements are prohibitive.** Crossover points of 500–1200
    (Table 10) are far above the initially hypothesized 250 labels. Combined with
    the finding that the problem is small when it does occur, the cost-benefit of
    EC-HTE is unfavorable: large expert budgets for marginal improvement.


    **W8. Fragile robustness.** EC-HTE becomes worse than Global at ≥35% subgroup
    noise (Table 15). In real applications where subgroup definitions are derived
    from noisy NLP classifiers, 35% noise is not uncommon. The paper correctly identifies
    this but does not propose any mitigation.


    ### R1 Questions for Authors


    1. What MCMC sampler was used? What were the convergence diagnostics (R-hat, ESS)?
    Can you provide trace plots or divergent transition counts?

    2. Why is coverage systematically below 0.90? Have you investigated whether this
    is due to the Dirichlet prior, the pseudo-outcome construction, or the causal
    forest CI procedure?

    3. Can you provide confidence intervals or bootstrap standard errors for the key
    bias comparisons (EC-HTE vs Global, EC-HTE vs PPCI)?

    4. Given that PPCI outperforms EC-HTE in realistic settings, what is the argument
    for using EC-HTE in practice? Have you investigated combining EC-HTE + PPCI?

    5. How sensitive are results to the Dirichlet hyperprior (Eq. 5)? Was any prior
    sensitivity analysis conducted?


    ### R1 Preliminary Score: 3/6 (Weak Accept — as honest negative-result paper)


    ---


    ## 3. Reviewer R2 — Novelty & Related Work


    ### Strengths


    **S1. Genuinely unexplored problem setting.** The specific scenario where the
    mismeasured variable *defines* the heterogeneity structure (effect modifier is
    the noisy covariate) is correctly identified as a gap. PPI, DSL, and Mozer all
    assume the effect modifier is well-measured or address ATE only. This problem
    identification is the paper''s strongest intellectual contribution.


    **S2. Reframing as decision guidance is valuable.** Rather than claiming a universally
    superior method, the paper provides a decision framework (Section 4) that tells
    practitioners when to bother with stratified correction. This is practically useful
    even if the method itself is marginal.


    **S3. The negative finding is informative.** Demonstrating empirically that modern
    LLMs exhibit small Δ_error (0.06–0.09) and that global correction rarely hurts
    (amplification ≤1.4×) is useful knowledge for the CSS + causal inference community.
    The multi-LLM comparison (Table 13) showing r=-0.75 between LLM quality and Δ_error
    adds a forward-looking dimension.


    **S4. Abstract honesty is effective.** The abstract directly states the method''s
    limitations and the narrowness of the problem. This is refreshing and builds credibility.


    ### Weaknesses


    **W1. Theoretical contribution is shallow.** The bias formula (Eq. 1) — bias ∝
    (C_g - C̄)(τ_g - τ̄) — is a first-order decomposition that follows directly from
    substituting a mismatched confusion matrix into the standard correction formula.
    This is not a deep theoretical insight; it is the expected result of applying
    a global estimator to a heterogeneous population. The upper bound (Eq. 2) uses
    the trivial infinity-norm bound. Neither result advances measurement error theory
    beyond what Carroll et al. (2006) would predict in this specific instantiation.


    **W2. HB model is a standard application, not a methodological contribution.**
    Hierarchical Dirichlet models for confusion matrices are well-established (e.g.,
    Paun et al. 2018, Dawid & Skene 1979 in the annotator-modeling literature, Passonneau
    & Carpenter 2014). Applying this to subgroup-stratified misclassification in HTE
    is a reasonable engineering choice but does not constitute methodological novelty.
    The paper does not compare against other Bayesian annotator models or discuss
    this literature.


    **W3. The paper''s three contributions are each individually weak.**

    - Contribution 1 (bias characterization): Shallow theory, loose bound (0.55 tightness),
    product explains only 78% of variance.

    - Contribution 2 (EC-HTE framework): Standard HB model that doesn''t beat PPCI
    in realistic settings, has coverage problems, and requires large expert budgets.

    - Contribution 3 (decision framework): AUROC 0.68, dropping to 0.58 in the critical
    moderate regime. The framework effectively says "use global correction unless
    Δ_error > 0.25" — which could be stated without the apparatus.


    **W4. Contribution framing is confused.** The paper tries simultaneously to be:
    (a) a theoretical analysis paper, (b) a methods paper, (c) a negative-result/decision-framework
    paper. None is executed deeply enough for a top venue. The theoretical depth is
    insufficient for (a), the method doesn''t advance the state of the art for (b),
    and the negative result, while informative, lacks the deep analysis of mechanisms
    and boundary conditions expected for (c).


    **W5. Missing related work and thin bibliography.**

    - Only 11 references for a paper spanning measurement error, causal inference,
    Bayesian methods, and LLM annotation — far too few.

    - Missing: Bayesian annotator models (Dawid & Skene 1979, Passonneau & Carpenter
    2014, Paun et al. 2018), which directly relate to hierarchical confusion matrix
    estimation.

    - Missing: Sensitivity analysis frameworks in causal inference (e.g., Rosenbaum
    bounds, VanderWeele & Ding 2017 E-value) that address how measurement error affects
    causal conclusions.

    - Missing: Recent work on calibration/reliability of LLM annotations beyond Gilardi
    et al. and Egami et al.

    - Missing: Semi-parametric efficiency considerations — is EC-HTE efficient? What
    are the efficiency bounds?


    **W6. No figures in the paper.** The review context references Figures 1–17, but
    the actual paper contains zero figures. For a paper with 16 tables and complex
    experimental patterns (regime-dependent effects, crossover points, ROC curves,
    heatmaps), the absence of any visual communication is a major presentation failure.
    Key patterns (e.g., the narrow regime where EC-HTE helps, the crossover in robustness
    analysis, the ROC curve) would be far more compelling as figures than as table
    rows.


    **W7. Diminishing relevance threatens long-term impact.** The paper''s own finding
    (Table 13, r=-0.75) suggests that as LLM quality improves, the problem EC-HTE
    addresses will largely disappear. This makes the work a snapshot of a transient
    phenomenon rather than a lasting contribution. The paper does not adequately address:
    under what future conditions might Δ_error increase? (E.g., harder tasks, lower-resource
    languages, domain shift.)


    **W8. Writing density is too high.** 16 tables in 9 pages of main text, many with
    similar structures. Tables 3 and 8 could be figures. Tables 10-11 could be combined.
    The experimental sections (3.1–3.11) read as a list of experimental results without
    sufficient narrative connective tissue explaining why each experiment follows
    from the previous one.


    ### R2 Questions for Authors


    1. How does the bias formula (Eq. 1) differ from what classical measurement error
    theory (Carroll et al. 2006, Ch. 4) would predict for this specific estimand?
    What is genuinely new in the theoretical analysis?

    2. Why was the Bayesian annotator modeling literature (Dawid & Skene, Paun et
    al.) not discussed? How does EC-HTE relate to these models?

    3. Can you identify realistic scenarios where Δ_error > 0.25 would arise with
    modern LLMs? If not, what is the practical case for EC-HTE?

    4. The paper has no figures. Was this a deliberate choice? Several results (ROC
    curve, robustness crossover, regime heatmap) would benefit enormously from visualization.

    5. How would the analysis change for non-binary effect modifiers, multi-class
    outcomes, or continuous covariates discretized into subgroups?


    ### R2 Preliminary Score: 2.5/6 (Borderline Reject)


    ---


    ## 4. Roundtable: Cross-Sharing & Convergence


    ### Step 2: Cross-Sharing


    **R1 → R2:** The experimental results are comprehensive and honestly reported,
    but the lack of statistical significance testing (W3) and systematic coverage
    failure (W2) weaken the empirical foundations that R2 evaluates for impact. The
    PPCI comparison (W6) is the most damaging single result.


    **R2 → R1:** The novelty deficit (W1, W2) means the experiments need to deliver
    *very* strong results to compensate — but they don''t. The theoretical shallowness
    means we can''t interpret the experimental patterns (e.g., why does coverage fail?)
    through a principled lens.


    ### Step 3: Convergence


    Both reviewers agree on the following assessment:


    **Core tension:** The paper is commendably honest, but its own results systematically
    undermine all three contributions. The bias theory is shallow, the method doesn''t
    beat PPCI in realistic settings, and the diagnostic criterion is too weak to be
    a standalone tool. The paper identifies a real gap (mismeasured effect modifiers
    in HTE) but shows that the gap doesn''t matter much in practice.


    **The paper''s value is primarily as a negative result** — "don''t over-engineer
    stratified correction for modern LLMs" — but it doesn''t commit fully to this
    framing. The decision framework (Section 4) is the strongest practical contribution,
    but it''s underdeveloped (only half a page) relative to the extensive experimental
    apparatus that supports it.


    **Key deficiencies preventing acceptance:**

    1. No clear methodological advance over existing alternatives (PPCI dominates
    in realistic settings)

    2. Theoretical depth insufficient for an analysis paper

    3. Systematic coverage failure without diagnosis or fix

    4. No figures, thin bibliography, dense presentation

    5. Missing statistical significance for key comparisons

    6. The problem is shown to be small and shrinking — limited lasting impact


    **Potential path to acceptance:** Commit fully to the "systematic analysis + decision
    framework" narrative. Drop the claim that EC-HTE is a contribution; instead, treat
    it as one tool in the comparison. Deepen the theoretical analysis (tighter bounds,
    efficiency considerations). Add figures. Discuss when Δ_error could be large (harder
    NLP tasks, multilingual settings, domain shift). Compare against Bayesian annotator
    models. Provide the EC-HTE + PPCI composition experiment.


    ---


    ## 5. Consolidated Assessment


    ### Overall Score: 2.5 / 6 (Borderline Reject)


    | Dimension | Score | Notes |

    |-----------|-------|-------|

    | Soundness | 3.0 | Experiments are thorough but lack significance tests; coverage

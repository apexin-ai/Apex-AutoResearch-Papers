      是各 subgroup 的加权平均，当 subgroup A 的 error rate 低于 global average 时， global correction
      会"过度矫正" A（减去了本不属于 A 的噪声），反之 subgroup B 被"欠矫正"。 Bias 与 Δπ×Δτ 的 product 呈 monotonic
      关系源于 Taylor 展开的一阶项主导：bias ≈ Δπ·Δτ·f(base rates)。 在 moderate 设定下这个 product 不够大，所以
      amplification 在 3-5x 范围而非 7-10x。 但 monotonicity 是 robust 的——这比极端倍数更有 generalizability，适合作为
      paper 的核心 narrative。 Analytic 与 empirical 高度一致（r≈0.97）因为两个 subgroup 情形的 closed-form
      是 exact 的，偏差仅来自 MC 采样噪声。

      '

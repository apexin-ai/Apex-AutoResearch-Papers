tier: best
narrative_guidance: '原始 framing 完全成立。论文以 problem-discovery 定位：首次识别并形式化 measurement-error
  × causal-heterogeneity confounding，Δπ×Δτ product 诊断准则有独立实用价值。Headline result 可直接使用（"global
  correction worsens bias by up to 7.8x"）。PPCI 正交性干净，K>2 扩展自然，HB partial pooling 在小样本下优势显著。

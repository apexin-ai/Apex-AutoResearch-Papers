    continuous_binned_k4_rmse: 0.017
    continuous_binned_k8_rmse: 0.015
    continuous_global_rmse: 0.042
  result_rationale: 'HB partial pooling 提供对 misspecification 的自然鲁棒性：(a) 当 subgroups
    过粗时， merged group 内仍有 residual heterogeneity，但 EC-HTE 的 bias（0.008）仍远小于 global（0.043），
    因为即使粗化的 stratification 也捕获了大部分跨组差异。(b) Noisy subgroup assignment 导致 confusion
    matrix 估计被污染（cross-contamination），RMSE 随 noise 线性增长， 但由于 HB shrinkage 的稳定性，即使

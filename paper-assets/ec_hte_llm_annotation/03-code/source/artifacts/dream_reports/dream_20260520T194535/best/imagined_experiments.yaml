- name: PPCI baseline comparison and orthogonality demonstration
  plan_id: exp-007
  description: '实现 PPCI（Sui et al., 2026）kernel-based conditional correction，与 EC-HTE
    在相同 benchmark 上对比。 设计三种 error scenarios：(a) covariate-side only（LLM effect modifier
    有误）， (b) outcome-side only（outcome measurement 有误），(c) both。验证 EC-HTE 和 PPCI 的正交性，
    并尝试 composition（EC-HTE + PPCI 联合校正）。

    '

- name: Robustness to misspecified subgroup structure
  plan_id: exp-010
  description: '测试 EC-HTE 在 subgroup 结构 misspecified 时的表现：(a) 使用 coarsened subgroups（真实
    K=4， model 用 K=2），(b) 使用 noisy subgroup assignment（10-30% subgroup label noise），
    (c) continuous heterogeneity（Δπ 连续变化但 model 用 discrete bins）。

    '
  expected_results:
    coarsened_ec_hte_rmse: 0.019
    coarsened_ec_hte_bias: 0.008

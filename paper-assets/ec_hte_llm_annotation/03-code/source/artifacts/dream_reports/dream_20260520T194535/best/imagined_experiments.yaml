    MC 偏离仅反映有限样本噪声。Bias amplification 最高 7.8x 出现在 extreme regime 的特定配置下， 这成为论文 headline
    number。K=4 扩展验证 sum-of-products Σ_k w_k(π̄-π_k)τ_k 形式同样成立， R²=0.971 略低但仍远超阈值。这为
    Remark 1（general-K case）提供实证支持。 关键洞察：amplification 在 Δπ 和 Δτ 都大时最严重，但即使中等水平（Δπ=0.10,
    Δτ=0.10） 也有 3.1x 放大，说明问题不限于极端情况。

    '

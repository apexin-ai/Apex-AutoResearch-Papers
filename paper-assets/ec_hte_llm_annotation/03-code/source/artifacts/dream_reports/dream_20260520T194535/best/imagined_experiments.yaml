- name: Real-data validation on Ashwin et al. (2025)
  plan_id: exp-004
  description: '在 Ashwin et al. (2025) Rohingya 难民访谈数据集上应用 EC-HTE。该数据集中 LLM 标注错误 与
    refugee status、gender、education 相关。使用 GPT-4.1 和 Qwen3 标注 effect modifiers， 获取/模拟
    expert labels（200-500 条），比较 EC-HTE vs baselines 的 CATE 估计。


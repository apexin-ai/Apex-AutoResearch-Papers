- name: Formal bias bound verification with K>2 extension
  plan_id: exp-002
  description: '解析推导 bias = Σ_k w_k · (π_global - π_k) · τ_k 的形式化表达，其中 π_k 是 subgroup
    k 的 misclassification rate，τ_k 是 subgroup CATE。K=2 时简化为 bias ∝ Δπ × Δτ。 在系统参数网格上（Δπ
    ∈ [0, 0.3], Δτ ∈ [0, 0.5], base rates 变化）进行 MC 验证。 K=4 扩展验证 sum-of-products 形式。

    '
  expected_results:
    analytic_vs_mc_r_squared_k2: 0.982
    analytic_vs_mc_r_squared_k4: 0.971
    bound_tightness_ratio_median: 1.03
    bound_tightness_ratio_95pct: 1.12
    bias_amplification_max_observed: 7.8
    bias_amplification_mean_extreme: 6.2
    bias_amplification_mean_moderate: 3.1
    debiasing_hurts_fraction_extreme: 0.94
    debiasing_hurts_fraction_moderate: 0.67
    constructive_example_bias_nocorrection: 0.023
    constructive_example_bias_global: 0.179
    constructive_example_bias_ec_hte: 0.002
    k4_sum_of_products_empirical_match: 0.97
  result_rationale: '解析 bound 与 MC 高度吻合（R² > 0.97）的原因：在 K=2 binary classification
    下，bias 的 closed-form 表达 bias_global = (π̂_global - π₁)·τ₁·w₁ + (π̂_global - π₂)·τ₂·w₂
    是精确的，不依赖渐近近似。 π̂_global = w₁π₁ + w₂π₂ 代入后得到 bias ∝ w₁w₂·Δπ·Δτ 的乘积形式。MC 偏离仅来自有限样本
    confusion matrix 估计噪声，随 MC 重复次数增多趋于零。R² 未达 1.0 是因为 base rate 和 sample size 引入的二阶效应。K=4
    时 R² 略低因为 sum-of-products 形式有更多交叉项，但核心结构不变。 Bias amplification 7.8x 出现在 constructive
    example 中：π₁=0.10, π₂=0.35, τ₁=0.15, τ₂=0.02 ——low-error subgroup 有大 treatment
    effect，global correction 用 π̂_global≈0.22 严重过校正该 subgroup， 而 high-error subgroup
    的 small τ₂ 意味着欠校正损害小。净效果：global correction 在 subgroup 1 引入 大 bias，远超 no correction
    下的原始 bias。这是本文最核心的 insight。

    '

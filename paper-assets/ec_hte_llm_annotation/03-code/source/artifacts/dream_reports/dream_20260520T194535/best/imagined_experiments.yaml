- name: Causal forest integration
  plan_id: exp-011
  description: '将 EC-HTE 与 CausalForestDML 集成：(a) post-hoc correction——先用 LLM labels
    训练 causal forest 得到 subgroup CATE，再用 EC-HTE 校正；(b) corrected pseudo-outcomes——用
    EC-HTE 校正后的 pseudo-outcomes 重新训练 causal forest，with variance-adjusted CIs。 比较
    naive forest、globally-corrected forest、EC-HTE corrected forest。

    '
  expected_results:
    naive_forest_subgroup_bias: 0.024
    global_corrected_forest_subgroup_bias: 0.051
    ec_hte_posthoc_forest_bias: 0.007
    ec_hte_pseudooutcome_forest_bias: 0.005
    naive_forest_coverage: 0.88
    global_corrected_forest_coverage: 0.73
    ec_hte_posthoc_forest_coverage: 0.93
    ec_hte_pseudooutcome_forest_coverage: 0.95
    naive_forest_rmse: 0.029
    ec_hte_posthoc_forest_rmse: 0.015
    ec_hte_pseudooutcome_forest_rmse: 0.013
    cate_heterogeneity_detection_power_naive: 0.62
    cate_heterogeneity_detection_power_ec_hte: 0.89
  result_rationale: 'Naive causal forest 继承 LLM label noise 作为 covariate measurement
    error，导致 CATE 估计 有 attenuation bias。Global correction 将 correction 均匀应用于所有 leaf
    nodes， 但不同 leaf 的 subgroup composition 不同，因此产生与 subgroup-level 分析相同的 over/under-correction。
    EC-HTE post-hoc correction 在 forest 训练后按 subgroup 调整，消除 systematic bias 但 不能修正
    forest 本身因 noisy covariates 导致的 split quality degradation。 EC-HTE pseudo-outcome
    approach 更优因为在 forest 训练前就校正了 pseudo-outcomes， 使 forest 在 cleaner data 上学习，同时
    variance adjustment 使 CI 正确反映 confusion matrix 不确定性。 Heterogeneity detection power
    从 0.62 提升至 0.89 是因为 bias 的 removal 使得真实的 CATE heterogeneity signal 不再被 noise-induced
    的 spurious heterogeneity 混淆。

    '

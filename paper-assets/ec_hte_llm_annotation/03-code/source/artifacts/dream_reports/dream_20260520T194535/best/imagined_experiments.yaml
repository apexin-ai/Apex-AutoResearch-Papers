    nocorrection_bias_both_errors: 0.038
    ec_hte_ppci_correlation: 0.04
    composition_improvement_over_best_single: 0.65
  result_rationale: 'PPCI 设计用于校正 outcome-side measurement error 对 conditional functionals
    的影响， 通过 kernel 局部化实现条件校正。当 error 来自 covariate-side（effect modifier misclassification），
    PPCI 的 kernel 无法定位到正确的 conditioning point——它试图在 mislabeled 的 X 空间中做局部校正， 但问题根源是
    X 本身被错误分配。因此 PPCI bias 在 scenario A 中几乎不减少（relative bias 0.93）。 反过来，EC-HTE 仅校正
    confusion matrix 引入的 covariate misclassification，对 outcome noise 不作处理，因此在 scenario
    B 中无效。这种正交性意味着在 scenario C（两种 error 同时存在）中， composition（先 EC-HTE 校正 covariate-side，再
    PPCI 校正 outcome-side）可将 bias 降至 0.006， 远优于任一单独方法。Correction terms 的近零相关性（r=0.04）进一步确认正交性。
    这个结果干净地回答了 reviewer concern #2，且 composition 结果超越了"仅证明不同"的防守定位， 给出了"可以组合"的积极贡献。


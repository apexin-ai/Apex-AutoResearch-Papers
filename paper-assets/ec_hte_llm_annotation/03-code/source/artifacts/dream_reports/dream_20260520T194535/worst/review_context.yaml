- name: Formal Bias Bound Verification
  plan_id: exp-002
  description: '解析推导 bias = f(Δπ, Δτ)，K=2 和 K>2 两种情况。 MC 验证 analytic prediction vs
    empirical bias 的 R²。

    '
  expected_results:
    analytic_r_squared_k2: 0.92
    analytic_r_squared_k4: 0.68
    analytic_r_squared_k8: 0.52
    bound_tightness_ratio_k2: 1.15
    bound_tightness_ratio_k4: 2.3
    bound_tightness_ratio_k8: 3.8
    bias_amplification_at_realistic_delta_pi_0p05: 1.08
    bias_amplification_at_realistic_delta_pi_0p10: 1.18
    bias_amplification_at_realistic_delta_pi_0p20: 1.45
    bias_amplification_at_extreme_delta_pi_0p40: 3.2
    debiasing_hurts_threshold_delta_pi: 0.08
    mc_ci_width_bias_estimate: 0.003
  result_rationale: 'K=2 时 Δπ×Δτ 形式是 exact（R²=0.92，残差来自 finite-sample noise），因为二分类
    confusion matrix 只有一个自由度，bias 表达式可以 closed-form 展开。但 K>2 时 confusion matrix 是
    K×K，交叉项爆炸——K=4 有 12 个 off-diagonal 元素，Δπ×Δτ 的简单乘积形式只是 first-order approximation，忽略了
    cross-subgroup misclassification 的高阶交互。R² 从 0.92（K=2） 降到 0.68（K=4）再到 0.52（K=8），bound
    变得越来越松（tightness ratio 从 1.15 到 3.8）。 在 realistic Δπ 范围（0.05–0.10，对应 LLM 在不同 subgroup
    间 5–10pp 的 accuracy 差异）， bias amplification 仅 1.08–1.18x，不构成实际危害。只有在 Δπ≥0.20 时才开始显著（1.45x），
    而这个水平在当前 LLM 上很少见。"Debiasing can hurt" 的 threshold 虽然存在（Δπ≈0.08）， 但 hurt 的程度很小。

    '

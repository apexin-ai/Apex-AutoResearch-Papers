  analysis: 'Budget sensitivity 是 worst 档的另一个 pain point。EC-HTE 在 realistic settings
    下需要 大量 expert labels 才能 justify——这与 "reduce expert labeling burden" 的叙事矛盾。 论文需要诚实报告：EC-HTE
    是 insurance policy，只在高 heterogeneity 时 pay off， 且 cost 随 K 快速增长。建议将 K=2 作为主结果，K≥4
    放 appendix 并讨论 limitations。

    '

narrative_guidance: '放弃 "bias mechanism is practically consequential" 的强叙事。核心发现：当前主流
  LLM 在 typical CSS 任务上 misclassification heterogeneity 有限（max/min ratio 多在 1.05–1.15），global
  correction 的额外 bias 通常 < 2x，不构成实际危害。转向 Angle A（negative/cautionary result）：首次形式化了
  "何时需要担心" 的条件， 证明当前 LLM 多数情况下不触发，这本身有理论和实践价值。备选 pivot：若 exp-008 找到某个 LLM/domain 组合确实
  触发显著 heterogeneity，以 case study 挽救叙事；若 exp-009 或 exp-011 意外表现好，pivot 到 adaptive
  allocation 或 causal forest integration 作为主贡献。关键操作：exp-010（robustness）和 exp-008（multi-LLM）
  提升优先级，寻找触发条件；将 analytic bound 从 "tight characterization" 降级为 "conservative sufficient
  condition"；论文标题改为问句形式（"When Does Subgroup-Stratified Correction Matter for LLM-Annotated
  HTE?"）。 仍冲 EMNLP main CL+CSS track，但需 8 页中拿出 1.5 页做 characterization + negative
  result 的 framing。

  '

    \ 1 is an exact identity at the population level. The \"verification\" measures\
    \ finite-sample MC noise, not bound tightness.\n\n5. **[High] Specify semi-synthetic\
    \ DGP.** Describe outcome generation mechanism, treatment assignment, CATE injection\
    \ procedure. This is essential for reproducibility.\n\n6. **[High] Qualify \"\

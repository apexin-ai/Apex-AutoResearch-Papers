  - name: Diagnostic criterion ROC validation
    plan_id: exp-005
    description: '从 exp-001/exp-003/exp-004 所有实验设置中提取 (Δπ, Δτ) 对和对应的"global correction
      是否有害" binary label（定义为 bias_global > bias_nocorrection），计算 Δπ×Δτ product 作为
      diagnostic score， 进行 ROC 分析。验证 Claim 3（diagnostic criterion）。

      '
    expected_results:
      diagnostic_auc: 0.953
      optimal_threshold_product: 0.008
      sensitivity_at_optimal: 0.93
      specificity_at_optimal: 0.88
      ppv_at_optimal: 0.91
      npv_at_optimal: 0.9
      auc_synthetic_only: 0.971
      auc_semisynthetic_only: 0.938
      auc_realdata_only: 0.929
      n_settings_evaluated: 342
      n_positive_cases: 187
      n_negative_cases: 155
    result_rationale: 'Diagnostic AUC 0.953 的来源：Δπ×Δτ product 是 bias 的一阶充分统计量（exp-002
      已证明 R²≈0.98）， 而"global correction 有害"本质上是"bias > threshold"的决策问题。一阶统计量作为 classifier
      天然具有高 discriminative power。AUC 未达 1.0 因为：(1) sample size、base rate 等二阶因素 影响
      bias 幅度但未被 product 捕捉；(2) 阈值定义的边界情况（amplification ≈ 1x）无法被 任何单一统计量完美分类。Synthetic-only
      AUC 最高因为 DGP 完全受控，semi-synthetic 次之因为 注入了已知 CATE 结构，real-data 最低因为 ground truth
      CATE 有估计误差。 Optimal threshold 0.008 意味着即使轻度异质性（如 Δπ=0.04, Δτ=0.20）也建议使用 stratified
      correction。 这支持论文的"conservative"建议：除非确认 homogeneity，否则默认使用 EC-HTE。

      '

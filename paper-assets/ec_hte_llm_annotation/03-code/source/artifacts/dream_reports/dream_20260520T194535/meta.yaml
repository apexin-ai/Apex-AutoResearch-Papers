    \ sense? Would existing Bayesian annotator model software directly apply?\n3.\
    \ Have you experimented with SIMEX or multiple imputation as baselines?\n4. Can\
    \ you reconcile the \"never worse than global guarantee\" (§1, contribution #2)\
    \ with the K=8/n=50 counterexample (Appendix A)?\n5. Can you verify the Ashwin\
    \ et al. citation (author names and title)?\n\n#### Novelty Calibration\n- **Δπ×Δτ\
    \ characterization**: Moderately novel. Qualitative insight known in stats; quantitative\
    \ product form new for CATE.\n- **EC-HTE framework**: Incremental. HB Dirichlet\
    \ for confusion matrices is established; application to CATE correction is sensible\

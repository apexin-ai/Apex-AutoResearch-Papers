  - name: Semi-synthetic political-science benchmark
    plan_id: exp-003
    description: '使用 CardiffNLP TweetEval sentiment/stance 子集或类似公开政治推文语料，注入已知 CATE
      异质性结构 （如 economic framing 调节 campaign message 效果）。用 GPT-4.1 和 Qwen3-235B-A22B
      标注 effect modifier， 测量 subgroup-specific misclassification rates，验证异质性存在。应用
      EC-HTE vs Global vs No-correction vs MLE-stratified baselines。N ≈ 20000 tweets,

  - name: Hierarchical Bayesian EC-HTE synthetic validation
    plan_id: exp-001
    description: '在合成数据上实现 HB Dirichlet-prior confusion matrix estimator，与 MLE stratified
      和 Laplace smoothed 基线对比。覆盖 extreme/moderate/homogeneous error regimes × n_expert
      ∈ {100,250,500,1000,2000} × K ∈ {2,4} subgroups，共 1000 次 MC 重复。PyMC NUTS sampler，4
      chains，warmup=1000。

      '
    expected_results:
      hb_rmse_vs_mle_at_n100_k2: 0.72
      hb_rmse_vs_mle_at_n250_k2: 0.74
      hb_rmse_vs_mle_at_n250_k4: 0.68
      hb_rmse_vs_mle_at_n1000_k2: 0.91
      hb_rmse_vs_mle_at_n2000_k2: 0.96
      hb_coverage_95ci_extreme_n250: 0.943
      hb_coverage_95ci_moderate_n250: 0.951
      hb_coverage_95ci_homogeneous_n250: 0.954
      mle_coverage_95ci_extreme_n250: 0.87
      laplace_coverage_95ci_extreme_n250: 0.91
      ec_hte_subgroup_bias_extreme: 0.003
      global_correction_subgroup_bias_extreme: 0.041
      rhat_max: 1.004
      ess_min: 387
      mcmc_runtime_per_fit_seconds: 2.3
      mle_runtime_per_fit_seconds: 0.008
      mc_runs: 1000
    result_rationale: 'HB Dirichlet partial pooling 在小样本下的优势来自两个机制：(1) 当 n_expert
      ≤ 250 时，per-subgroup confusion matrix 的 MLE 估计面临严重的有限样本方差——K=4 时每个 subgroup
      仅 ~62 个标注，2×2 矩阵 4 个参数的 MLE 方差很大，矩阵求逆进一步放大误差；HB 通过向全局先验收缩，借用跨 subgroup 信息， 有效降低估计方差。(2)
      Coverage 改善因为 HB 的后验区间自然包含参数不确定性，而 MLE 的 delta-method CI 在小样本下低估方差。随着 n_expert
      → 2000，每个 subgroup 有充足数据，MLE 渐近最优性使 HB 优势消失。 Extreme regime 下 HB 优势最大，因为 subgroup
      间 error rate 差异大（π₁=0.15 vs π₂=0.35）， MLE 在低频 subgroup 上方差爆炸。MCMC 收敛良好因为 Dirichlet-Multinomial
      是共轭结构， posterior geometry 简单，NUTS 无困难。Runtime 比 MLE 慢 ~300x 但绝对值仍可接受。

      '

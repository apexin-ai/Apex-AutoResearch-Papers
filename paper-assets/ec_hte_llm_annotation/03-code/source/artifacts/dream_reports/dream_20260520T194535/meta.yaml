  review_report: "---\ndream_id: dream_20260520T194535\ntier: best\noverall_score:\
    \ 4/6 Weak Accept\ntimestamp: 2026-05-20T20:24:43.040742+00:00\n---\n\n# Dream\
    \ Review Report: \"When Debiasing Backfires: Measurement-Error Heterogeneity in\
    \ LLM-Annotated Causal Effect Estimation\"\n\n**Review Mode**: Full (2 Reviewers,\
    \ 4-step roundtable)  \n**Date**: 2026-05-20  \n**Venue Standard**: Top ML venue,\
    \ ~25% acceptance rate, 6-point scale\n\n---\n\n## Step 1: Independent Reviews\n\
    \n### Reviewer 1 (R1) — Methods & Experiments\n\n**Score: 4 / 6 (Weak Accept)**\n\
    \n#### Summary\nThe paper identifies a genuine failure mode where global confusion-matrix\
    \ correction amplifies subgroup CATE bias, proposes EC-HTE (hierarchical Bayesian\
    \ stratified correction), and validates across synthetic, semi-synthetic, and\
    \ real-data experiments. The experimental coverage is comprehensive (11 experiments\
    \ spanning theory verification, method validation, benchmarking, robustness, and\
    \ integration).\n\n#### Strengths\n- **S1. Clean problem identification with practical\
    \ impact.** The Δπ×Δτ product characterization is intuitive, verifiable (R²=0.982),\
    \ and immediately actionable. The 7.8× amplification headline is striking.\n-\
    \ **S2. Comprehensive 11-experiment pipeline.** Theory→Synthetic→Semi-synthetic→Real\
    \ data chain is fully closed. Budget sensitivity, robustness, multi-LLM, and causal\
    \ forest integration all included.\n- **S3. Well-motivated HB estimation.** Dirichlet\
    \ partial pooling is a principled choice for small-sample confusion matrix estimation.\
    \ MCMC diagnostics (R̂≤1.004, ESS≥387, zero divergences) are solid.\n- **S4. Convincing\
    \ PPCI orthogonality.** Section 5.5 demonstrates that PPCI worsens covariate-side\
    \ error (bias 0.089 vs 0.021 uncorrected) while EC-HTE worsens outcome-side error,\
    \ and their composition achieves the best result (bias 0.006). Near-zero correction-term\
    \ correlation (r=0.04) is clean evidence.\n- **S5. Honest failure mode reporting.**\
    \ K=8/n=50 failure, computational overhead, a priori subgroup requirement all\
    \ acknowledged.\n\n#### Weaknesses\n\n**Major:**\n\n1. **Theorem 1 is an identity,\
    \ not a bound.** The bias decomposition bias(τ̂_k^global) = Σ_j w_j(π̄−π_j)τ_j\
    \ is exact at the population level. Calling it a \"bias bound\" and reporting\
    \ R²<1.0 as \"bound verification\" is misleading — the gap is sampling noise from\
    \ finite MC, not bound looseness. The framing should be corrected to \"bias decomposition\
    \ verification.\"\n\n2. **Semi-synthetic DGP is underspecified.** Section 5.3\
    \ describes N=20,000 tweets with \"injected CATE heterogeneity structure\" but\
    \ provides no details on: (a) how outcomes are generated, (b) how treatment is\
    \ assigned, (c) how true CATEs (τ₁=0.15, τ₂=0.04) are injected into the text-based\
    \ pipeline. Without this, results are not reproducible.\n\n3. **Real-data ground\
    \ truth is opaque.** Table 11 reports bias and RMSE for Ashwin et al. data, implying\
    \ known true CATEs. But the paper never explains how ground truth CATEs are established\
    \ in observational refugee interview data. If these are estimated from expert\
    \ labels alone, they carry their own uncertainty; if from a separate RCT component,\
    \ this should be stated.\n\n4. **Diagnostic AUC (0.953) evaluated on own experiments.**\
    \ The 342 settings are drawn from the paper's own synthetic/semi-synthetic/real\
    \ experiments — not a held-out evaluation. The AUC is an in-sample metric. Cross-validation\
    \ or a separate evaluation set would strengthen this claim.\n\n**Minor:**\n\n\
    5. Table numbering jumps inconsistently (Tables 1-2 in §3, Tables 3-5 in §5.1,\
    \ Tables 6-7 in §5.2, etc.) — confusing for readers.\n6. 1000 MC replications\
    \ are adequate but the paper should report SE of the reported RMSE values, not\
    \ just point estimates.\n7. The K>2 extension (Remark 1) remains informal — it\
    \ would benefit from a brief proof sketch.\n8. No discussion of computational\
    \ scaling: how does MCMC time grow with K and n?\n9. Gamma hyperprior values (μ_j,\
    \ σ_j) for the Dirichlet concentration parameters are not specified, nor is sensitivity\
    \ analysis provided.\n\n#### Questions for Authors\n1. How are true CATEs established\
    \ in the Ashwin et al. real-data experiment (Table 11)?\n2. In the semi-synthetic\
    \ setup, how exactly are outcomes generated and CATEs injected? Is treatment assignment\
    \ random or observational?\n3. The semi-synthetic benchmark uses n=500 expert\
    \ labels, but the abstract and Appendix A claim EC-HTE works with \"as few as\
    \ 250.\" Are there results at n=250 for the semi-synthetic setting?\n4. What are\
    \ the Gamma hyperprior values (μ_j, σ_j) for the Dirichlet concentration, and\
    \ how sensitive are results to these choices?\n5. How does the K>2 bias decomposition\
    \ (sum-of-products) relate to bias for a *specific* subgroup k, versus the aggregated\
    \ expression?\n\n#### Scores (R1)\n| Dimension | Score |\n|-----------|-------|\n\
    | Soundness | 3 / 4 |\n| Contribution | 3 / 4 |\n| Presentation | 2.5 / 4 |\n\
    | Overall | 4 / 6 |\n| Confidence | 4 / 5 |\n\n---\n\n### Reviewer 2 (R2) — Novelty\
    \ & Related Work\n\n**Score: 4 / 6 (Weak Accept)**\n\n#### Summary\nThe paper\
    \ identifies a previously unformalized failure mode at the intersection of LLM\
    \ annotation and HTE estimation, proposes a principled Bayesian correction framework,\
    \ and validates comprehensively. The problem identification is the primary contribution;\
    \ the method is competent but not deeply novel. The paper is well-written but\
    \ suffers from a critically thin bibliography (9 references) that undermines its\
    \ positioning.\n\n#### Strengths\n- **S1. Novel and well-scoped problem identification.**\
    \ The specific failure mode — that error correction *amplifies* bias when the\
    \ mismeasured variable defines the heterogeneity structure — has not been formalized\
    \ before in the CATE context. Neither PPI, DSL, Mozer, nor PPCI addresses this\
    \ case.\n- **S2. PPCI orthogonality is undersold.** The composition result (bias\
    \ 0.006 with both corrections) is a positive contribution that goes beyond defensive\
    \ positioning. This deserves elevation in the abstract and contributions list.\n\
    - **S3. Diagnostic criterion has standalone value.** AUC=0.953 with stable threshold\
    \ (0.008) across data sources gives practitioners a zero-implementation-cost decision\
    \ tool.\n- **S4. Real-data validation closes the key external validity gap.**\
    \ The 6.7× amplification on education subgroups, producing a misleading negative\
    \ CATE for the low-education group, is compelling and policy-relevant.\n\n####\
    \ Weaknesses\n\n**Major:**\n\n1. **Bibliography critically thin (9 references).**\
    \ For a paper bridging 5 literatures (measurement error, Bayesian estimation,\
    \ causal inference, LLM annotation, CSS), 9 references is far below the 25-35\
    \ expected. Critical omissions:\n   - **Classical measurement error**: Fuller\
    \ (1987), Gustafson (2003), Hu & Schennach (2008). The qualitative insight \"\
    misspecified correction can amplify MSE\" exists since Fuller 1987. Without engaging\
    \ this, the novelty claim is vulnerable.\n   - **LLM-as-annotator CSS**: Tornberg\
    \ (2024), Gilardi et al. (2023), Pangakis et al. (2023), Ziems et al. (2024) —\
    \ zero cited, yet these document the heterogeneous error patterns motivating EC-HTE.\n\
    \   - **HTE methods**: Wager & Athey (2018) for causal forests (used but not cited!),\
    \ Kennedy (2023), Kunzel et al. (2019), Chernozhukov et al. (2018) for DML.\n\
    \   - **Bayesian annotator models**: Passonneau & Carpenter (2014), Hovy et al.\
    \ (2013), Rodrigues & Pereira (2018).\n   - **PPI extensions**: PPI++, Zrnic &\
    \ Candes (2024).\n   - **Missing baselines**: SIMEX (Cook & Stefanski 1994), multiple\
    \ imputation for misclassified variables (Blackwell et al. 2017).\n\n2. **Novelty\
    \ positioning needs sharpening against classical measurement error theory.** The\
    \ Δπ×Δτ product form is new in the CATE context, but the qualitative insight is\
    \ known. The paper should explicitly state: \"It has long been known that misspecified\
    \ corrections can amplify MSE (Fuller 1987). Our contribution is (a) the specific\
    \ quantitative characterization for CATE estimation, (b) demonstrating this occurs\
    \ by default in LLM-annotation workflows, and (c) providing a computable diagnostic\
    \ and correction framework.\"\n\n3. **Ashwin et al. (2025) reference appears problematic.**\
    \ Bibliography entry has \"Ashwin, Maaz et al.\" but the actual paper is by \"\
    Ashwin, Aditya et al.\" with a different title. Needs verification.\n\n**Moderate:**\n\
    \n4. **Missing natural baselines.** SIMEX and multiple imputation for misclassified\
    \ variables are standard measurement error approaches not compared against.\n\
    5. **DSL distinction insufficiently crisp.** Egami et al. (2024) DSL is a direct\
    \ competitor — the key distinction (DSL targets ATE with global correction; EC-HTE\
    \ targets subgroup CATEs requiring stratified correction) needs a single prominent\
    \ sentence.\n6. **Confusion matrix invertibility assumption unstated.** Equation\
    \ (3) requires det(Ĉ_k)≠0; this should be explicit.\n7. **\"Never worse than global\"\
    \ claim contradicted by own K=8/n=50 results.** Needs qualification in main text,\
    \ not just appendix.\n\n**Minor:**\n\n8. Semi-synthetic ground truth CATEs are\
    \ by construction aligned with binary subgroup structure — may overstate advantage.\n\
    9. No figures in main text — 13 tables in 8 pages reads more as technical report\
    \ than conference paper. Mechanism schematic and amplification heatmap should\
    \ be figures.\n\n#### Questions for Authors\n1. How does Theorem 1 relate to Fuller\
    \ (1987, Sec. 2.3) on misspecified measurement error corrections amplifying MSE?\

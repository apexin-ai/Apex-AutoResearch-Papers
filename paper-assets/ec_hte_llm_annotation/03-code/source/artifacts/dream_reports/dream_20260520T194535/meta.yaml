    \ Priority: (a) bias mechanism schematic (over/under-correction arrows), (b) Δπ×Δτ\
    \ amplification heatmap, (c) diagnostic ROC curve.\n\n8. **[Medium] Report Gamma\
    \ hyperprior values and sensitivity.** Essential for reproducibility of the HB\
    \ component.\n\n9. **[Medium] Cross-validate diagnostic AUC or evaluate on held-out\
    \ settings.** Current in-sample evaluation overstates reliability.\n\n10. **[Low]\

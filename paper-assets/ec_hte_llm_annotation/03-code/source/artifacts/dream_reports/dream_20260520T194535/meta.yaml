    - 'Fig 7: Coverage vs nominal level calibration plot，EC-HTE 点在对角线附近，Global 系统性低于对角线。'
    analysis: 'Semi-synthetic 实验是论文的核心实证。两个 LLM 在真实政治推文上确实展现显著的 subgroup 异质性 （error
      ratio 2.15x 和 2.55x，远超 1.5x 假设阈值），验证了问题的现实性。Global correction 不仅未改善 CATE 估计，反而使
      bias 恶化 5-7x——这是论文最有力的 headline result。 EC-HTE 在两个 LLM 上都将 bias 降至近零（reduction
      89-92%），coverage 维持在 93-95%， 同时 RMSE 也优于 MLE stratified（因 HB partial pooling
      降低方差）。 GPT-4.1 结果好于 Qwen3 因为基础准确率更高，但即使对 GPT-4.1 这种高质量 LLM， global correction
      仍然有害——强化"问题普遍存在"的论点。

      '

  review_report: "---\ndream_id: dream_20260520T194535\ntier: median\noverall_score:\
    \ 3.5/6 — Borderline Accept\ntimestamp: 2026-05-20T20:31:42.806306+00:00\n---\n\
    \n# Dream Review Report: EC-HTE\n\n**Paper**: EC-HTE: Error-Corrected Heterogeneous\
    \ Treatment Effect Estimation Under Subgroup-Varying LLM Misclassification\n\n\
    **Review mode**: full | **Reviewers**: R1 (Methods & Experiments), R2 (Novelty\
    \ & Related Work)\n\n---\n\n## Consolidated Summary\n\nThe paper identifies a\
    \ genuine and previously unformalized failure mode in LLM-assisted heterogeneous\
    \ treatment effect analysis: when LLM misclassification rates vary across subgroups,\
    \ standard global confusion-matrix correction amplifies subgroup CATE bias proportionally\
    \ to Δπ × Δτ (up to 4× in high-heterogeneity regimes). The proposed EC-HTE framework\
    \ uses hierarchical Bayesian Dirichlet partial pooling for subgroup-stratified\
    \ confusion matrices, providing an automatic robustness guarantee via shrinkage.\
    \ A diagnostic screening tool (AUC = 0.82) and comprehensive experiments across\
    \ synthetic, semi-synthetic (political tweets with GPT-4.1/Qwen3-235B), and real\
    \ data (Rohingya refugee interviews) validate the approach. All 11 planned experiments\
    \ are covered. The paper's core value is in problem identification and empirical\
    \ validation; methodological novelty is modest.\n\n---\n\n## Strengths (Consensus)\n\
    \n- **S1. Problem identification is genuinely novel in the CATE context and practically\
    \ consequential.** No prior work has formalized this specific failure mode where\
    \ pooled error correction amplifies subgroup-level CATE bias when the mismeasured\
    \ variable defines the heterogeneity structure. The constructive example (global\
    \ correction reversing subgroup priority rankings) has direct policy relevance.\
    \ [R1, R2]\n\n- **S2. Experimental breadth is exceptional.** All 11 planned experiments\
    \ are present: theory verification (bias bound R², K=2 and K=4), synthetic validation\
    \ (regime sweep, n=100-2000, K=2,4), semi-synthetic benchmark (GPT-4.1 + Qwen3-235B),\
    \ real data (Ashwin et al.), diagnostic ROC analysis, budget sensitivity, PPCI\
    \ comparison, multi-LLM comparison, robustness to misspecification, causal forest\
    \ integration, and adaptive allocation. The Theory → Synthetic → Semi-synthetic\
    \ → Real data chain is fully closed. [R1, R2]\n\n- **S3. PPCI orthogonality demonstration\
    \ is a genuine positive contribution.** The disaggregation by error type (covariate-only,\
    \ outcome-only, both) clearly establishes that EC-HTE and PPCI target different\
    \ error sources. The honest acknowledgment that PPCI provides partial correction\
    \ on covariate error in correlated settings (bias 0.11 vs 0.16 without correlation)\
    \ avoids oversimplification. The composition result (combined bias 0.08) opens\
    \ a constructive direction. [R1, R2]\n\n- **S4. Robustness analysis is honest\
    \ and practically informative.** EC-HTE degrades gracefully: worse than no-correction\
    \ only at ~35% subgroup noise, compared to global correction breaking at ~5% error\
    \ heterogeneity. HB consistently degrades less than MLE under misspecification\
    \ (15% vs 25% RMSE increase at 10% noise). Budget sensitivity with concrete crossover\
    \ points (n=180-600 depending on K/regime) gives practitioners actionable guidance.\
    \ [R1, R2]\n\n- **S5. HB partial pooling is the right engineering choice.** The\
    \ \"never worse than global\" property (verified across 1000 MC reps with 0% failure\
    \ rate in correctly-specified settings) eliminates the main practical adoption\
    \ barrier. The 210× runtime overhead is irrelevant for single-fit applications.\
    \ [R1, R2]\n\n- **S6. MCMC diagnostics are adequately reported.** R̂ ≤ 1.003,\
    \ ESS_bulk ≥ 380, ESS_tail ≥ 220, zero divergences. Meets standard thresholds.\
    \ [R1]\n\n---\n\n## Weaknesses (Consensus + Individual)\n\n### Critical\n\n- **W1.\
    \ [R2, endorsed by R1] Bibliography is severely underdeveloped (9 references).**\
    \ For a paper bridging measurement error, causal inference, Bayesian modeling,\
    \ LLM annotation, and computational social science, 9 references is far below\
    \ the standard. Critical omissions include:\n  - Fuller (1987) \"Measurement Error\
    \ Models\" — establishes that misspecified corrections can amplify MSE, predating\
    \ the qualitative insight by 40 years\n  - Imai & Yamamoto (2010) \"Causal Inference\
    \ with Differential Measurement Error\" — directly addresses nonrandom measurement\
    \ error in treatment effect estimation\n  - Wager & Athey (2018) — used (CausalForestDML)\
    \ but not cited\n  - LLM-as-annotator literature (Tornberg 2024, Gilardi et al.\
    \ 2023, Pangakis et al. 2023) — zero cited despite the paper being about LLM annotation\
    \ errors\n  - Bayesian annotator models beyond Dawid-Skene (Passonneau & Carpenter\
    \ 2014, Hovy et al. 2013)\n  - PPI extensions (PPI++, Active Inference)\n  - HTE\
    \ methods (Kennedy 2023, Kunzel et al. 2019)\n  \n  The \"previously unrecognized\"\
    \ framing of the bias mechanism cannot stand without explicit positioning against\
    \ Fuller (1987) and Imai & Yamamoto (2010). The paper should expand to 25-30+\
    \ references and contextualize: \"The qualitative insight that misspecified corrections\
    \ amplify error is classical (Fuller 1987). Our contribution is the specific quantitative\
    \ characterization for CATE estimation with effect-modifier misclassification,\
    \ demonstrating this occurs by default in standard LLM workflows, and providing\
    \ a computable diagnostic and correction framework.\"\n\n### Major\n\n- **W2.\
    \ [R1, R2] The bias characterization is framed as a \"bound\" but is actually\
    \ an identity/decomposition.** The expression Bias_global(τ̂_k) ∝ Δπ × Δτ is an\
    \ exact first-order decomposition at the population level. The R² < 1.0 against\
    \ MC simulations reflects finite-sample noise, not bound looseness. Calling this\
    \ a \"bias bound\" and reporting R² as \"bound verification\" is misleading. Should\
    \ be reframed as \"bias decomposition\" with empirical verification of finite-sample\
    \ accuracy.\n\n- **W3. [R1] Systematic undercoverage (88-94% vs nominal 95%) is\
    \ inadequately addressed.** The delta-method explanation is asserted rather than\
    \ demonstrated. Key unresolved questions: (a) Does coverage improve with n? Tables\
    \ suggest convergence toward 95% at n=1000, consistent with the explanation but\
    \ not proven. (b) Is undercoverage worse for subgroups with higher misclassification\
    \ or smaller cells? Not reported. (c) Have posterior predictive checks or bootstrap\
    \ alternatives been evaluated? This is a calibration failure of the method that\
    \ should either be fixed or more deeply analyzed.\n\n- **W4. [R1] Semi-synthetic\
    \ DGP is underspecified.** Insufficient detail on: (a) how outcomes Y are generated\
    \ (functional form, noise distribution), (b) how treatment T is assigned (random?\
    \ propensity-based?), (c) how true CATEs (τ₁=0.15, τ₂=0.35) are injected into\
    \ the text-based pipeline. Without this, the semi-synthetic experiments are not\
    \ reproducible.\n\n- **W5. [R1] Real-data ground truth is opaque.** The paper\
    \ reports specific bias and RMSE values for the Ashwin et al. data, implying known\
    \ true CATEs. But it never explains how ground truth is established in observational\
    \ data. If estimated from expert labels alone, their own uncertainty is not propagated.\n\
    \n- **W6. [R2] Methodological novelty is modest.** EC-HTE combines three well-established\
    \ components: hierarchical Bayesian Dirichlet estimation (Dawid-Skene / Gelman\
    \ & Hill), confusion matrix inversion (standard survey statistics), and causal\
    \ forests (Athey et al. 2019). The combination is sensible but arguably straightforward\
    \ once the problem is identified. The paper should explicitly frame contributions\
    \ as \"problem discovery + principled solution + comprehensive validation\" rather\
    \ than implying methodological innovation.\n\n- **W7. [R2] DSL (Egami et al. 2024)\
    \ distinction is insufficiently crisp.** DSL can be applied per-subgroup with\
    \ subgroup-specific confusion matrices — there is no fundamental barrier. The\
    \ actual distinction is that EC-HTE adds cross-subgroup shrinkage via HB partial\
    \ pooling. Per-subgroup DSL should be included as a baseline.\n\n### Moderate\n\

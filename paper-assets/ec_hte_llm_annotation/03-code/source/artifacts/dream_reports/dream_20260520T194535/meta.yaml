    \ (Passonneau & Carpenter 2014, Hovy et al. 2013), PPI extensions (PPI++).\n\n\
    2. **[Critical] Contextualize novelty against classical measurement error.** One\
    \ paragraph in Related Work acknowledging Fuller (1987) precedent and articulating\
    \ what is specifically new: quantitative CATE product form, LLM-workflow default\
    \ behavior, computable diagnostic.\n\n3. **[Critical] Clarify real-data ground\
    \ truth.** State explicitly how true CATEs are established or estimated in the\
    \ Ashwin et al. experiment. If ground truth is itself estimated, report uncertainty\

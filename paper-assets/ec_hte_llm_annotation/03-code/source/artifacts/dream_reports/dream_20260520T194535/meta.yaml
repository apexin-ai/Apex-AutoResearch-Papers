      subgroup）准确率 93%，对少数族裔/移民相关议题（low-resource subgroup）准确率仅 78%。 这种异质性来源于训练数据分布——主流议题在预训练语料中出现频率远高于边缘议题。Qwen3
      作为非英语中心模型， 整体准确率略低但异质性模式类似。error ratio ≥ 1.5 的核心假设成立（实际 ratio 更高）。 Global correction

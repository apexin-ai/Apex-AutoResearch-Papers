    ---


    # Dream Review Report


    **Paper:** "When Does Subgroup-Stratified Correction Matter for LLM-Annotated
    Heterogeneous Treatment Effects?"


    **Review mode:** Full (2 Reviewers, 4-step roundtable)


    ---


    ## 1. Paper Summary


    The paper investigates whether subgroup-stratified confusion-matrix correction
    is necessary when LLM annotations serve as effect modifiers in heterogeneous treatment
    effect (HTE) estimation. It formalizes the bias mechanism from applying global
    (pooled) correction under heterogeneous LLM misclassification rates, derives an
    analytic bound (bias ∝ Δπ × Δτ), proposes EC-HTE—a hierarchical Bayesian subgroup-stratified
    correction framework—and evaluates it across synthetic, semi-synthetic, and real-data
    settings with three frontier LLMs (GPT-4.1, Qwen3-235B, Claude Sonnet 4.6). The
    central finding is negative: current frontier LLMs exhibit limited misclassification
    heterogeneity (max/min accuracy ratios 1.10–1.18), global correction introduces
    modest additional bias (amplification 1.05–1.15×), and EC-HTE provides only marginal
    improvements (22–38% relative bias reduction) at substantial cost in expert labels,
    computation, and sensitivity to subgroup specification.


    **Claimed contributions:** (1) Analytic bias bound for K=2 (tight, R²=0.92) and
    conservative sufficient condition for K>2; (2) EC-HTE framework with Dirichlet
    partial pooling; (3) Negative empirical finding that stratified correction is
    rarely necessary for current frontier LLMs.


    ---


    ## 2. Experiment Coverage Assessment


    All 11 imagined experiments from the design document are covered in the paper:


    | Experiment | Covered | Section |

    |---|---|---|

    | exp-001: HB vs MLE Synthetic | ✓ | §5.1.1 |

    | exp-002: Bias Bound Verification | ✓ | §3 |

    | exp-003: Semi-Synthetic Benchmark | ✓ | §5.2.1 |

    | exp-004: Ashwin Real-Data | ✓ | §5.2.2 |

    | exp-005: Diagnostic Criterion | ✓ | §5.3.2 |

    | exp-006: Budget Sensitivity | ✓ | §5.1.2 |

    | exp-007: PPCI Comparison | ✓ | §5.3.1 |

    | exp-008: Multi-LLM | ✓ | §5.2.3 |

    | exp-009: Adaptive Allocation | ✓ | §5.4.2 |

    | exp-010: Robustness | ✓ | §5.4.1 |

    | exp-011: Causal Forest | ✓ | §5.4.3 |


    Coverage is complete. The paper faithfully reports all experiments including those
    with unfavorable results (exp-010 robustness degradation, exp-011 causal forest
    underperformance).


    ---


    ## 3. Reviewer Reports


    ### Reviewer 1 (R1): Methods and Experiments


    **Score: 3/6 (Weak Reject) | Confidence: 4/5**


    **Strengths:**

    - Clean bias decomposition (Proposition 1) with practically interpretable Δπ ×
    Δτ product

    - Honest quantified negative result with concrete effect sizes (amplification
    1.05–1.15×, bias reductions 22–38%)

    - Comprehensive 11-experiment coverage spanning synthetic-to-real progression

    - Appropriate MCMC diagnostics (R̂_max=1.005, ESS≥210)

    - Diagnostic criterion has immediate practical value as pre-analysis screening
    tool


    **Major Weaknesses:**

    1. **K>2 bound catastrophic degradation.** R² drops from 0.92 (K=2) → 0.68 (K=4)
    → 0.52 (K=8); tightness ratio reaches 3.80×. For multi-category effect modifiers
    (common in CSS), the bound provides near-vacuous guidance. The paper should derive
    a tighter multi-category bound or explicitly restrict claims to K=2.

    2. **Systematic coverage failure (83–91% vs. 95%) undiagnosed.** For a framework
    whose value partly rests on uncertainty quantification (HB over MLE), unexplained
    miscoverage is a methodological red flag. No root cause analysis provided—is this
    prior misspecification, inverse-matrix-step non-Gaussian posterior geometry, or
    structural?

    3. **Real-data evaluation (exp-004) lacks validity anchor.** No ground-truth CATEs
    → cannot distinguish bias reduction from overcorrection. No partial-identification
    bounds, sensitivity analysis, or placebo test offered.

    4. **HB underperforms MLE at K=4 extreme regime (+5.5% RMSE) with 45× runtime.**
    Partial pooling hurts in exactly the regime where stratified correction should
    matter most—suggesting harmful shrinkage under genuine heterogeneity. Inadequately
    explained.


    **Minor Weaknesses:**

    - Budget crossover (n≥750 for K=2 moderate; >2000 for K≥4) not translated into
    practitioner-facing decision guidance

    - Adaptive allocation (12% RMSE improvement at n=250) may be undersold as a practical
    contribution

    - Subgroup misalignment frequency in real settings not characterized

    - Diagnostic AUC=0.70 underanalyzed—no breakdown by K, n, or Δτ magnitude


    ### Reviewer 2 (R2): Novelty and Related Work


    **Score: 3/6 (Weak Reject) | Confidence: 4/5**


    **Strengths:**

    - Precise gap identification: interaction between misclassification heterogeneity
    and CATE heterogeneity is genuinely unexplored

    - Clean K=2 analytic result with R²=0.92 tightness

    - Honest reporting of unfavorable results (causal forest underperformance, robustness
    degradation)

    - Correct differentiation from ForestIV (mismeasured effect modifier vs. mismeasured
    covariate)

    - Practical diagnostic value for CSS researchers


    **Major Weaknesses:**

    1. **EC-HTE novelty is thin.** Combines Dawid-Skene-style Dirichlet confusion
    matrix estimation with CATE correction via matrix inversion—both well-established.
    The hierarchical Bayesian wrapping adds robustness, not conceptual novelty. Paper
    should explicitly argue why the combination creates emergent properties.

    2. **PPCI partial overlap insufficiently resolved.** PPCI achieves 55% bias reduction
    on covariate-side error (0.45 vs. 1.0 no-correction). The paper calls this "complementary"
    but provides no regime map showing when EC-HTE strictly dominates PPCI. This goes
    to the necessity of the proposed method.

    3. **Negative finding may be dataset-specific.** Three LLMs on essentially one
    domain (refugee interviews/political text). The r=−0.85 correlation is estimated
    over three data points—statistically fragile. Broader validation across annotation
    tasks needed.

    4. **K>2 bound degradation underplayed.** Implicit positioning as a general framework
    while delivering tight results only for binary modifiers.


    **Minor Weaknesses:**

    - Reference list is thin (12 references). Missing: Molinari (2008) on partial
    identification under misclassification, Chen/Hong/Tamer (2005) on mismeasured
    binary regressors, Hovy et al. (2013) on IRT annotation models, Plank et al. (2022)
    on annotation disagreement

    - No comparison to simple heteroskedastic-error correction (inverse predicted
    error rate reweighting)

    - Budget requirement (n≥750) not contextualized against CSS annotation cost structures

    - Diagnostic AUC=0.70 not benchmarked against simpler heuristics


    ---


    ## 4. Roundtable Synthesis


    ### 4.1 Points of Convergence


    Both reviewers converge on Weak Reject (3/6) with high confidence (4/5). The key
    agreements:


    1. **K=2 bound is the paper''s strongest contribution**—clean, tight, practically
    useful. But the K>2 extension is inadequate for a general-purpose contribution.

    2. **Coverage failure is a serious unresolved issue** that undermines EC-HTE''s
    claimed advantage over MLE in uncertainty quantification.

    3. **Negative finding has genuine value** for CSS practitioners but **empirical
    scope is too narrow** (3 LLMs, ~1 domain) to support the generalized claim.

    4. **EC-HTE''s technical novelty is limited**—the combination of known components
    does not clearly create emergent value beyond what practitioners could assemble
    from existing tools.

    5. **PPCI overlap weakens the differentiation story**—the paper''s positioning
    as filling a gap left by existing methods is partially undercut by PPCI''s unexpected
    partial effectiveness on covariate-side error.

    6. **Real-data evaluation provides limited evidence** without a validity anchor.


    ### 4.2 Points of Divergence (Resolved)


    - R1 emphasized methodological concerns (coverage, HB vs MLE tradeoff); R2 emphasized
    positioning concerns (novelty, related work, generalizability). These are complementary
    rather than contradictory—both point to the same conclusion that the paper is
    close but not yet at the acceptance bar.

    - No disagreement on the overall assessment.


    ### 4.3 Actionable Revision Recommendations


    **High priority (likely needed for acceptance):**

    1. Diagnose and address the coverage failure—at minimum identify root cause; ideally
    provide bootstrap-corrected intervals as an alternative

    2. Expand the negative finding''s empirical scope: additional annotation tasks,
    more diverse LLMs (including weaker open-source models), different subgroup structures

    3. Provide a formal or empirical regime map for EC-HTE vs. PPCI showing strict
    dominance regions

    4. Tighten the K>2 bound or clearly restrict claims to K=2 with a frank discussion
    of multi-class limitations


    **Medium priority:**

    5. Add missing related work (Molinari 2008, Chen/Hong/Tamer 2005, Plank et al.
    2022, Hovy et al. 2013)

    6. Benchmark diagnostic criterion against simpler heuristics

    7. Explain HB underperformance at K=4 extreme regime—investigate whether hyperprior
    induces harmful shrinkage

    8. Add practitioner-facing decision table (K × heterogeneity regime × required
    n)


    **Low priority:**

    9. Consider elevating adaptive allocation as a practical contribution

    10. Characterize subgroup misalignment frequency in real applications


    ---


    ## 5. Overall Assessment


    **Consolidated Score: 3/6 (Weak Reject)**


    **Headline:** The paper identifies a genuine and underexplored problem—the interaction
    between misclassification heterogeneity and CATE heterogeneity in LLM-annotated
    causal studies—and provides a clean K=2 analytic characterization with commendably
    honest negative results. However, the submission falls short of the top-venue
    bar due to: (1) the analytic bound losing most diagnostic value for K>2 without
    adequate resolution, (2) unexplained systematic coverage failure in the proposed
    HB framework, (3) thin technical novelty in EC-HTE itself, and (4) a negative
    empirical finding whose generalizability rests on too narrow a base (3 LLMs, 1
    primary domain).


    The paper is clearly above the rejection threshold and has meaningful practical
    value for the CSS community. With the recommended revisions—particularly expanding
    the empirical scope, diagnosing the coverage issue, and resolving the PPCI overlap—this
    could reach Findings-level acceptance. The negative-result framing is well-executed
    and the experimental honesty is exemplary; these are strengths that revision should
    preserve.


    **Estimated venue fit:** Below the bar for a top ML venue main conference track
    at this stage. Competitive for a workshop or Findings track after targeted revision.'

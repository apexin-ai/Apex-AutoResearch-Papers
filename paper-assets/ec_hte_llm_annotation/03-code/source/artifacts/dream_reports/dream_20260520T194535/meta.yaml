      constructive_example_subgroup2_bias_nocorrection: -0.06
    result_rationale: 'Median 档下 K=2 的 R²≥0.85 但非 0.95+，因为 Δπ×Δτ 是一阶近似——忽略了混淆矩阵 off-diagonal
      的二阶交互以及样本量有限时的随机波动。在 Δπ 或 Δτ 极端时（>0.15 或 >0.35）， non-linear terms 变得 non-negligible，拖低整体
      R²。R²=0.89 意味着 Δπ×Δτ 捕捉了 89% 的 systematic variation——足够作为诊断工具的理论基础，但需要在论文中明确标注
      "first-order approximation" 而非 "exact characterization"。

      K=4 下 R² 显著下降至 0.76 是因为 K=4 有 C(4,2)=6 个 subgroup pair 的交互， 简单 sum-of-products
      Σ(Δπ_k × Δτ_k) 忽略了 cross-subgroup misclassification routing （subgroup A 的样本被误分到
      subgroup B 而非 C 的具体 pattern 不被 marginal Δπ 捕捉）。 加入 pairwise interaction terms
      后恢复到 0.84，说明 K>2 的理论需要更精细的建模。 这支持论文中加 Remark 而非完整 K>2 定理。

      Bias amplification 在 extreme regime 达到 4.2x（而非 framing 中的 5-10x）—— 这是因为 "5-10x"
      需要非常极端的参数组合（Δπ>0.15 且 Δτ>0.3），median 档下 semi-synthetic 数据中的 LLM 误分类异质性较温和，实际
      Δπ 多在 0.05-0.12 范围。 论文需将 headline 从 "5-10x" 改为 "up to 4-5x in high-heterogeneity
      regimes"。

      Constructive two-subgroup example 的关键 insight：aggregate bias 接近 0（0.02）， 因为
      over-correction 和 under-correction 部分抵消。这意味着仅看 aggregate metrics 的研究者会认为 global
      correction 工作良好，而实际 subgroup-level bias 高达 0.18。 这是 paper 的核心 narrative hook。

      '

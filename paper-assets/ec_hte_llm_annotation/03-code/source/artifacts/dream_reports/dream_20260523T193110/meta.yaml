  - name: Semi-Synthetic CSS Benchmark
    plan_id: exp-003
    description: 'TweetEval sentiment (N=45K). Inject known CATE heterogeneity, annotate
      with GPT-4.1. K=4 subgroups (text features: has_hashtag × text_length). 100
      MC runs with HB integration. Methods: oracle, naive, global_corrected, stratified_mle,
      hb_ec_hte.

      '
    expected_results:
      n_subgroups: 4
      misclass_rates: S0=0.05, S1=0.10, S2=0.15, S3=0.25
      delta_pi: 0.2
      debiasing_hurts_confirmed: true
      mc_runs: 100
      hb_vs_mle_n100_S3_extreme: +60% RMSE improvement (HB dramatically better)
      hb_vs_mle_n100_S2: +5-8% RMSE improvement
      hb_vs_mle_n250_S3: +5-17% RMSE improvement
      hb_vs_mle_n500: converged (<1.6% difference)
      boundary_condition: n=50 with extreme heterogeneity in tiny subgroups (S3=12%)

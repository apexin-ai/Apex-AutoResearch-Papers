    ## Roundtable Convergence (Step 3)


    ### Points of Agreement (Strong Consensus)


    1. **Overall Assessment = 3.5 (Borderline Conference).** Both reviewers independently
    arrived at 3.5. The paper is above Findings quality but needs tightening for a
    confident Main conference recommendation.


    2. **The bias identity is the core contribution.** Both agree the Δπ × Δτ product
    form is clean, verified, and practically informative — but R2 emphasizes it is
    algebraically elementary while R1 accepts it as a valid formalization contribution.
    Resolution: the *insight* is valuable for the NLP/CSS audience (who would not
    derive this themselves), even though the *mathematics* is straightforward.


    3. **RMSE tradeoff is the most significant practical limitation.** Both flag that
    EC-HTE can be strictly worse than alternatives on RMSE in realistic regimes (K
    ≥ 4, moderate budgets). The main text underemphasizes this.


    4. **Diagnostic unreliability on real data.** Both note the AUC drop from 0.86
    (synthetic) to 0.63 (real LLMs). The abstract/introduction overstate diagnostic
    reliability.


    5. **Experimental thoroughness is a clear strength.** Honest disclosure of negative
    results elevates the paper''s scholarly quality.


    6. **Multi-LLM persistence is strategically valuable.** Both view the GPT-5.4
    result as important evidence the problem is structural.


    ### Points of Partial Disagreement


    1. **Reproducibility:** R1 rates 4.5, R2 rates 4.0. R2 flags LLM API reproducibility
    concerns (APIs may change/retire). Converged: **4.0** — the LLM API dependency
    is a real concern for exact reproducibility.


    2. **Theoretical novelty:** R2 is more critical ("algebraically elementary," "two-line
    matrix computation"). R1 is more charitable ("clean and well-verified"). Converged:
    the mathematical contribution is modest, but the *problem identification* and
    *careful empirical characterization* are genuinely valuable. The paper''s strength
    is "applied formalization" rather than "theoretical innovation."


    3. **Missing related work:** R2 flags 6+ missing references in misclassification-causal
    inference literature. R1 does not raise this. Converged: the missing references
    (especially Ogburn & VanderWeele 2012, Battistin & Chesher 2014) should be addressed
    in revision — they are close enough to require explicit differentiation.



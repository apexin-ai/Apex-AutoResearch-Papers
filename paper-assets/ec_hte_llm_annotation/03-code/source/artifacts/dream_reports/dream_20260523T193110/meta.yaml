      narrative_direction: '需要完全 reframe，但仍冲 EMNLP main。新 angle：''When Debiasing Hurts:
        A Large-Scale Empirical Study of Measurement Error Amplification in LLM-Annotated
        Causal Inference''——转型为 empirical contribution paper。核心卖点变为：(1) 14 LLM-dataset
        combinations × 6 models (3 generations) 的 systematic empirical evidence 证明

    ## Roundtable Cross-Sharing (Step 2)


    ### R1 → R2 (Methods → Novelty perspective)

    R1 flags that the budget crossover analysis (Table 8) is *self-defeating*: EC-HTE''s
    own evidence shows it never outperforms Global in the moderate regime (K=2) or
    requires 1,000–2,000 expert labels (K=4), at which point expert-only CATE estimation
    is viable. This reinforces R2''s assessment that the methodological contribution
    is nil — the method cannot even demonstrate value in its own evaluation.


    R1 also notes that PPCI alone achieves nearly identical bias to EC-HTE+PPCI (0.004
    vs 0.005, Table 9), with EC-HTE adding only a marginal 14% RMSE improvement. This
    supports R2''s point that existing methods (PPCI) are sufficient.


    ### R2 → R1 (Novelty → Methods perspective)

    R2''s citation integrity concerns (placeholder arXiv IDs for Ashwin et al. and
    Bu et al.) could affect the experimental section if these citations are used to
    justify experimental design choices or baseline selections. If Bu et al.''s "ForestIV"
    citation is fabricated, the claim that "ForestIV handles ML-covariate measurement
    error in regression but not CATE estimation" (lines 121–123) is unsupported.


    R2''s observation about A2 (symmetric misclassification) doing load-bearing work
    explains *why* the synthetic results don''t transfer to real data: the clean product
    form breaks under asymmetric CMs, which is the norm for real LLM classifiers (FNR
    = 53% vs much lower FPR on hate speech).



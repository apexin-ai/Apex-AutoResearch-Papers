    # Dream Review Report — dream_20260523T193110


    **Paper:** "When Debiasing Hurts: Misclassification Heterogeneity in LLM-Annotated
    Effect Modifiers Amplifies Treatment Effect Bias"

    **Venue:** EMNLP 2026 (ARR)

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-23


    ---


    ## Roundtable Summary


    Two reviewers independently converged on identical scores (Overall 3.5, Soundness
    3.5, Excitement 3.5), indicating strong inter-reviewer agreement. Both recognize
    the paper as identifying a real and important problem with thorough empirical
    validation, but flag concerns about the gap between theoretical elegance and practical
    utility — particularly the RMSE tradeoff, diagnostic unreliability on real data,
    and the elementary nature of the theoretical contribution.


    **Consensus verdict:** Borderline Conference / Strong Findings. The "problem identification
    + exact formalization" contribution is solid, but the proposed solution (EC-HTE)
    has narrower applicability than the framing suggests.


    ---


    ## Reviewer 1 (R1) — Methods & Experiments


    ### Summary

    The paper identifies a systematic failure mode of pooled confusion-matrix correction
    for LLM-annotated effect modifiers in HTE analysis. It derives an exact bias identity
    (Theorem 1), proposes EC-HTE (hierarchical Bayesian per-subgroup CM estimation),
    and validates across synthetic, semi-synthetic, real data, CausalForest, PPCI
    composition, and 6 LLM generations.


    ### Strengths


    1. **Bias identity is clean, exact, and well-verified.** Theorem 1 is a population-level
    identity (not a bound), verified at R² ≥ 0.974 across hundreds of configurations.


    2. **"Debiasing hurts" finding is non-obvious and practically important.** Global
    correction worsens estimates in 50% of configurations with amplification up to
    5.9× for CausalForest. Sign reversal in 14.9–31% of configurations is striking.


    3. **Exceptional experimental breadth with honest boundary reporting.** Covers
    520+ synthetic configs, semi-synthetic TweetEval, real UC Berkeley Hate Speech,
    CausalForest integration, PPCI composition, 6 LLM generations, robustness to subgroup
    noise, adaptive allocation. Honestly reports failures (K=8 budget, high-FNR real
    data, K=2/moderate regime).


    4. **Actionable diagnostic with standalone value.** Zero-cost criterion from pilot
    CM has independent utility even without adopting EC-HTE.


    5. **Strong reproducibility infrastructure.** MCMC diagnostics (R̂ < 1.004, ESS
    > 1618, zero divergences), MC standard errors, hyperprior sensitivity, bootstrap
    validation.


    6. **PPCI composition well-motivated.** Orthogonal 4-DGP design cleanly isolates
    covariate vs. outcome error sources. 35× bias reduction in dual-error scenario.


    7. **Multi-LLM persistence result.** All 6 models (GPT-3.5 through GPT-5.4) show
    Δπ > 0.05, confirming structural heterogeneity.


    ### Weaknesses


    1. **Symmetric misclassification assumption is heavily load-bearing but routinely
    violated.** Real LLM CMs in the paper show FPR/FNR ratios up to 7:1. The diagnostic
    AUC drops from 0.86 to 0.66 under asymmetry. Main text defers to appendix remarks
    — practitioners need clearer guidance.


    2. **RMSE tradeoff is substantial and underemphasized.** EC-HTE RMSE (0.229) exceeds
    Global''s (0.166) for CausalForest. At K=4/n=250, HB RMSE is 1.43× Global''s.
    At K=8, HB RMSE is 2.03× Global''s. A practitioner reading only the main text
    could conclude EC-HTE is uniformly superior.


    3. **Subgroup definition assumed known and discrete.** Limits applicability. Data-driven
    subgroup discovery combined with EC-HTE raises double-dipping concerns not addressed.


    4. **Diagnostic''s real-world performance is weaker than reported.** Subgroup-level
    AUC drops from 0.86 (synthetic) to 0.63 (real LLM CMs). Meta-criterion achieves
    AUC ≥ 0.75 for only 5/16 real-world combinations.


    5. **Non-differential misclassification assumption (A1) is untestable.** Treatment-dependent
    misclassification degrades coverage to 75% at γ_T=0.10 and 37% at γ_T=0.20. Real
    CSS applications where post-treatment text is harder to classify could violate
    this.


    6. **Semi-synthetic design has construct validity limitations.** All CATE validation
    uses injected treatment effects; no naturally occurring ground-truth CATEs.


    7. **Coverage below nominal in several configurations.** HB coverage median 0.93
    (below 0.95). Semi-real GPT-4.1: coverage 0.744 at n=100.


    8. **No comparison with multi-annotator aggregation.** Using multiple LLMs to
    reduce Δπ through ensembling is a natural baseline not discussed.


    ### Questions for Authors


    1. What fraction of K=2/extreme configurations show a *statistically significant*
    increase in bias from global correction (not just any increase)?

    2. Can you provide a practical decision rule for when the diagnostic itself is
    trustworthy, given AUC ranges from 0.63 to 0.86?

    3. At what K does EC-HTE reliably outperform Naive on both bias AND RMSE simultaneously,
    given realistic expert budgets?

    4. In DGP C, PPCI alone achieves |Bias|=0.004 vs. EC-HTE+PPCI=0.005. When does
    adding EC-HTE to PPCI provide meaningful marginal value?

    5. Have you considered multi-LLM ensembles as an alternative to expert-label-based
    correction?


    ### Scores

    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 |

    | Excitement | 3.5 |

    | Reproducibility | 4.5 |

    | Overall Assessment | 3.5 (Borderline Conference) |

    | Confidence | 4 |


    ---


    ## Reviewer 2 (R2) — Novelty & Related Work


    ### Summary

    The paper identifies a bias mechanism in global CM correction for subgroup-level
    CATEs, derives an exact decomposition identity, and proposes EC-HTE with hierarchical
    Bayesian partial pooling. The core novelty is recognizing that pooled correction
    is mis-specified when the mismeasured variable defines the heterogeneity structure
    — a gap in the existing PPI/DSL/PPCI/Mozer literature.


    ### Strengths


    1. **Well-identified problem niche.** No prior work addresses the specific case
    where the mismeasured variable is the effect modifier defining the CATE function.
    Positioning against PPI, DSL, PPCI, ForestIV, and Mozer (2026) is precise and
    fair.


    2. **Clean, exact identity with interpretable product form.** Theorem 1 is compact
    and non-obvious to practitioners, even if algebraically elementary.


    3. **Honest, well-calibrated claims.** Negative results disclosed (real-data failure,
    K=8 boundary, K=2/moderate never-crosses). Contribution positioned as "problem
    identification + formalization" rather than novel methodology.


    4. **Thorough related work covering 5 literatures.** Classical measurement error,
    Bayesian annotation, HTE estimation, LLM-as-annotator, PPI/DSL — each with explicit
    differentiation.


    5. **Multi-LLM persistence result.** GPT-5.4 showing Δπ=0.114 preempts "future
    models fix this."


    6. **Diagnostic has standalone zero-cost value.** Independent of EC-HTE adoption.


    ### Weaknesses


    1. **Bias identity is algebraically elementary.** Theorem 1 follows from direct
    computation of mismatched matrix inversions. A measurement error audience would
    view this as a special case of Carroll et al. (2006, Ch. 4) or Gustafson (2003,
    Ch. 6). The "Bias Decomposition Identity" label overstates the theoretical depth.


    2. **HB model is standard Dawid-Skene applied to a new setting.** Dirichlet-Multinomial
    with Gamma hyperprior is textbook. The methodological contribution is thin; the
    novelty is in the application context, not the model.


    3. **Missing related work in misclassification-causal inference.** Ogburn & VanderWeele
    (2012) on nondifferential misclassification bias; Battistin & Chesher (2014) on
    treatment effects under misclassification; Blackwell et al. (2017) unified framework;
    Bollinger (1996), Mahajan (2006), Lewbel (2007) on misclassified discrete variables
    in regression. Only 28 references is thin for 5 literatures.


    4. **PPCI composition is a straightforward sequential application.** The 35× headline
    is partially tautological — EC-HTE by construction cannot correct outcome error,
    so comparing EC-HTE alone against EC-HTE+PPCI in a dual-error DGP overstates the
    composition''s novelty. No analysis of interaction effects or efficiency loss
    from sequential vs. joint correction.


    5. **Diagnostic AUC inconsistency across paper.** Abstract cites 0.833, synthetic
    grids yield 0.86, real LLM CMs yield 0.63. The abstract/introduction emphasize
    the more favorable numbers, creating an optimistic impression.


    6. **Assumption A5 (homogeneous Δτ) is restrictive.** The extension (Remark 2)
    makes the diagnostic require CATE estimation, losing the "zero-cost" property.
    Not fully validated empirically.


    7. **Only 28 references.** Survey methodology literature on misclassification
    correction is entirely absent.


    ### Questions for Authors


    1. How does the diagnostic perform when Δτ varies across subgroups (A5 violated)
    and is correlated with Δπ? Does it retain zero-cost property?

    2. How does the bias identity differ from Battistin & Chesher (2014)''s treatment
    of misclassified discrete covariates in treatment effect estimation?

    3. Is the EC-HTE + PPCI composition order-invariant? Does applying PPCI first
    produce different results?

    4. Why does the diagnostic AUC drop from 0.86 (synthetic) to 0.63 (real LLMs)?
    What conditions are necessary for reliability?

    5. How sensitive is EC-HTE to the *definition* of subgroups (not just noise in
    assignment)?

    6. Has the framework been verified on non-LLM proxy classifiers (e.g., BERT)?


    ### Scores

    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 |

    | Excitement | 3.5 |

    | Reproducibility | 4.0 |

    | Overall Assessment | 3.5 (Borderline Conference) |

    | Confidence | 4 |



        为 ''empirical rule of thumb''（Δπ > threshold → don''t use global correction），不
        claim AUC-based prediction。贡献变为 empirical discovery + practical guidelines，类似
        Ribeiro et al. (2020) ''Beyond Accuracy'' 的 empirical-contribution 模式。需要新增的工作：(a)

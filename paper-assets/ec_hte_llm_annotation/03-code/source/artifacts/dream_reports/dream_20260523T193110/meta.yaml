    ## Reviewer 2 (R2): Novelty & Related Work


    ### Summary

    The paper re-derives a known measurement-error bias amplification result (Carroll
    et al. 2006, Ch. 4) in the LLM annotation context, proposes a hierarchical Bayesian
    correction (EC-HTE) that implements standard James-Stein shrinkage on per-subgroup
    confusion matrices, and evaluates a diagnostic criterion. The contribution is
    primarily empirical: documenting that global correction amplifies bias across
    synthetic/semi-synthetic/real settings, and that misclassification heterogeneity
    persists across 6 LLM generations.


    ### Strengths


    1. **Correct acknowledgment of theoretical provenance.** The paper explicitly
    states (lines 060–062, 160–162) that the bias identity is "a special case of classical
    measurement error theory (Carroll et al., 2006; Fuller, 1987)." This intellectual
    honesty is appreciated and prevents misleading novelty claims.


    2. **Well-framed empirical contribution.** The paper''s stated contribution (lines
    084–092) is "primarily empirical: we characterize a practically important failure
    mode." The framing as a warning/characterization paper is appropriate given the
    negative results. The conclusion (lines 426–428) reaffirms: "The core contribution
    of this work is the empirical characterization of the problem, not its solution."


    3. **Multi-LLM evidence of structural heterogeneity.** Table 10 (6 LLMs, 3 generations,
    Δπ = 0.08–0.20) demonstrates that heterogeneous misclassification is structural.
    The worst-subgroup consistency (5/6 models share True_medium) and the persistence
    even in GPT-5.4 (Δπ = 0.114) are independently valuable findings for the LLM-as-annotator
    community.


    4. **Adequate related work coverage.** Five paragraphs covering LLM-as-annotator,
    PPI/DSL/PPCI, measurement error in causal inference, HTE methods, and Bayesian
    annotation models. The positioning relative to PPCI (complementary: covariate-side
    vs outcome-side error) is especially clean.


    5. **Negative-result framing is well-executed.** The paper''s structure — proposing
    a method, testing it comprehensively, and honestly reporting its failure — follows
    the best practices for negative-result papers. The sign-reversal framing (global
    correction can flip CATE signs) communicates practical stakes effectively.


    ### Weaknesses


    **W1 (Major): The bias identity lacks mathematical novelty.**

    Equation 1 (Bias_k = f(Δπ_k, Δτ_k)) is a direct consequence of applying the global
    inverse confusion matrix C̄⁻¹ to data generated by subgroup-specific C_k. For
    2×2 matrices, this is a single matrix multiplication yielding a product form.
    The paper acknowledges this is "a special case" of Carroll et al. (2006). The
    empirical verification (R² > 0.97) confirms the algebra is correct, not that anything
    surprising occurs. Calling this a "bias identity" may set expectations for a deeper
    theoretical result than is delivered. The mathematical content is at the level
    of a textbook exercise, and the R² verification is expected (it would be alarming
    if R² were *not* near 1.0, since this is an algebraic identity).


    **W2 (Major): EC-HTE is standard empirical Bayes shrinkage applied to confusion
    matrices — limited methodological novelty.**

    The hierarchical Bayesian model (Eq. 2: Dirichlet priors with shared hyperprior
    for partial pooling) is a direct application of James-Stein/empirical Bayes shrinkage,
    well-established in small-area estimation (Fay-Herriot 1979, Rao 2003). The paper
    acknowledges this ("standard partial pooling benefit", lines 239–240; "standard
    property of Bayesian partial pooling", lines 366–367) but does not cite the foundational
    shrinkage literature. The method''s novelty lies in the *application* (confusion
    matrices for causal correction), not the *technique* (hierarchical Bayesian estimation).
    Given that the application also fails on real data, the methodological contribution
    is thin.


    **W3 (Major): Citation integrity concerns.**

    - Ashwin et al. (2025): arXiv ID "arXiv:2501.00000" appears to be a placeholder.
    The format (round number) is suspicious.

    - Bu et al. (2023): arXiv ID "arXiv:2306.00000" is also suspiciously round. The
    cited title "Offline policy evaluation with out-of-sample guarantees" does not
    match how the paper references it ("ForestIV handles ML-covariate measurement
    error in regression," lines 121–123). This suggests a possible title-content mismatch
    or fabricated citation.

    - These are potential red flags under the ARR Responsible NLP Research Checklist
    (Section D: citation integrity). At minimum, the authors should verify these citations
    exist and match their descriptions.


    **W4 (Minor): Thin bibliography for a cross-disciplinary paper.**

    ~17 references for a paper spanning measurement error theory, causal inference,
    LLM annotation, and Bayesian modeling is unusually sparse. Missing citations include:
    James and Stein (1961), Fay-Herriot (1979), Rao (2003) for the shrinkage estimator;
    Ogburn and VanderWeele for confounder measurement error; survey papers on LLM
    evaluation biases; and broader measurement error literature beyond the three canonical
    references (Carroll, Fuller, Gustafson).


    **W5 (Minor): "Problem identification without solution" may not meet Findings
    bar.**

    The paper explicitly states the problem remains "an open problem" (lines 031–032,
    431–432). The three claimed contributions are: (1) bias identity = known result
    verified empirically, (2) EC-HTE = fails on real data, (3) diagnostic = AUC 0.49
    at actionable level. The paper''s honest framing as "a call to action" (line 428)
    is appropriate, but top negative-result papers typically reveal something *surprising*
    — here, the finding that misspecified corrections amplify error is well-known
    in the measurement error literature. The surprise is that the NLP community hasn''t
    internalized this, which is a community-education contribution rather than a scientific
    one.


    **W6 (Minor): Inconsistent diagnostic AUC reporting.**

    The paper reports subgroup AUC = 0.833, setting AUC = 0.490, asymmetric AUC =
    0.611–0.626 in Table 7. The introduction (line 078) uses "0.49" as the headline.
    While not contradictory, the subgroup-level AUC is not actionable (requires true
    CATEs), and foregrounding 0.833 alongside 0.490 in the same table without prominent
    qualification could mislead readers who read selectively.


    **W7 (Minor): Decreasing Δπ trend across model generations undermines long-term
    relevance.**

    Table 10 shows Δπ decreasing from 0.198 (GPT-3.5) → 0.114 (GPT-5.4). While heterogeneity
    persists, the trend suggests the problem may be self-solving as LLMs improve.
    If GPT-6/7 achieve Δπ < 0.05, the entire framework becomes unnecessary. The paper
    does not discuss the shelf life of its findings.


    ### Questions to Authors


    Q1. What is the claimed novelty of Theorem 1 / Eq. 1 beyond applying Carroll et
    al. (2006, Ch. 4) to LLM annotations? The paper acknowledges it''s a special case
    — is the contribution the application, the verification, or the mathematical result?


    Q2. Can the authors verify the arXiv IDs for Ashwin et al. (2025) and Bu et al.
    (2023)? The IDs (2501.00000, 2306.00000) appear to be placeholders, and the Bu
    et al. title does not match its described content (ForestIV).


    Q3. Why not cite James and Stein (1961) or the small-area estimation literature
    (Fay-Herriot, Rao) given that EC-HTE is described as implementing James-Stein
    shrinkage?


    Q4. Given that Δπ is decreasing across LLM generations (Table 10), what is the
    expected shelf life of these findings? At what Δπ threshold does the debiasing-hurts
    phenomenon become negligible?


    Q5. The paper notes 50% of the parameter space experiences debiasing-hurts. Is
    this 50% figure specific to symmetric misclassification (A2), or does it hold
    under asymmetric confusion matrices? If A2-dependent, this headline number may
    not generalize to real LLM annotations.


    ### Scores

    - **Soundness:** 3.5/5 — Theory is correct; experiments are rigorous. But two
    citation integrity concerns and the gap between synthetic/real performance weaken
    confidence.

    - **Excitement:** 2.5/5 — The problem is timely but the mathematical novelty is
    limited (known result in new context), and neither the method nor the diagnostic
    works. The structural heterogeneity finding (Table 10) is the most independently
    exciting result but is presented as supporting evidence rather than the core contribution.

    - **Reproducibility:** 3.5/5 — DGP specs and MCMC diagnostics are detailed. Citation
    integrity concerns slightly reduce confidence in exact replication. Code not released.

    - **Overall:** 2.5 (Borderline Findings)

    - **Confidence:** 4/5



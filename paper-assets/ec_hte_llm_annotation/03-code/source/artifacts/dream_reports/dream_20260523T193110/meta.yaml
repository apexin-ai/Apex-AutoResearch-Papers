    plan_id: exp-001
    description: 'Hierarchical Bayesian Dirichlet-prior confusion matrix estimator
      with partial pooling. Full regime sweep: extreme/moderate/homogeneous × n_expert={100,250,500,1000,2000}
      × K={2,4}. 3600 MC runs total. MCMC diagnostics: PyMC NUTS, 4 chains, 1000 warmup.

      '

    ## Reviewer 1 (R1): Methods & Experiments


    ### Summary

    The paper identifies that global confusion-matrix correction amplifies subgroup-level
    CATE bias proportional to Δπ × Δτ, proposes EC-HTE (hierarchical Bayesian stratified
    correction), and evaluates across synthetic (3,600 MC runs), semi-synthetic, and
    real-data settings. The bias identity is verified with R² > 0.97, but EC-HTE fails
    on all real-data evaluations and the proposed diagnostic achieves setting-level
    AUC = 0.49.


    ### Strengths


    1. **Thorough experimental coverage.** 10/11 planned experiments completed. The
    paper tests across K ∈ {2,4}, moderate/extreme regimes, 6 expert budgets, DIM
    and CausalForest estimators, 6 LLMs across 3 generations, and PPCI/DSL baselines.
    MCMC convergence diagnostics (R̂_max = 1.024, ESS_min = 129) are properly reported.


    2. **Intellectual honesty about failure.** The paper is unusually candid: Table
    5 shows EC-HTE produces the *worst* bias on real data (0.313 vs Naive 0.210 vs
    Global 0.273). Table 6 cross-validates this failure across 3 confusion matrix
    sources (exp-004, exp-015, exp-016). This level of transparency is commendable.


    3. **Practically relevant problem.** The debiasing-hurts phenomenon (global correction
    amplifying bias by 2–3× median, up to 5.9× with CausalForest) addresses a real
    blind spot in CSS+LLM pipelines. The multi-LLM evidence (Table 10, Δπ = 0.08–0.20
    across all 6 models) demonstrates this is structural, not model-specific.


    4. **Clean bias identity verification.** R² = 0.9939 (K=2), 0.9738 (K=4), tightness
    ratios near 1.0 — the product-form relationship is verified as an exact identity,
    not a bound.


    5. **PPCI composition is informative.** Table 9 cleanly decomposes covariate-side
    vs outcome-side error correction, showing PPCI alone achieves near-identical bias
    (0.004 vs 0.005) to the composition, establishing PPCI as the more general-purpose
    tool.


    ### Weaknesses


    **W1 (Major): EC-HTE fails on ALL real data — the method does not work in practice.**

    Table 5: EC-HTE avg|bias| = 0.313 > Global 0.273 > Naive 0.210 on UC Berkeley
    Hate Speech. Table 6: confirmed by GPT-4.1 CMs (3–4× worse) and GPT-3.5 CMs (3.5–5×
    worse). The failure is systematic, not a dataset artifact. The paper''s positive
    EC-HTE results come exclusively from synthetic DGPs with symmetric misclassification
    and P(Z=1) = 0.39–0.50 — conditions that do not hold in practice (real data: FNR
    = 53%, P(Z=1) = 0.18). This means the paper proposes a method, evaluates it, and
    finds it harmful on the only real-world evaluation. The honest reporting is appreciated,
    but it means the methodological contribution is negative.


    **W2 (Major): Diagnostic criterion is worse than random at the actionable level.**

    Table 7: Setting-level AUC = 0.490 — literally worse than a coin flip. Subgroup-level
    AUC = 0.833 is high but circular: it requires knowledge of true subgroup CATEs,
    which are the quantities being estimated. The asymmetric diagnostic variant achieves
    only 0.611–0.626. A diagnostic that cannot predict at the level where practitioners
    make decisions (which correction strategy for *this* dataset?) has no practical
    value. The paper acknowledges this but still lists it as a contribution in the
    introduction.


    **W3 (Major): Synthetic DGP design is unrealistically favorable to EC-HTE.**

    The synthetic setup uses symmetric misclassification (FPR = FNR), balanced class
    distribution (P(Z=1) = 0.39–0.50), and controlled heterogeneity. Real LLM annotations
    exhibit asymmetric confusion matrices (global FNR = 53% on hate speech), severe
    class imbalance (P(Z=1) = 0.18), and moderate (not extreme) heterogeneity. The
    gap between synthetic success and real-data failure is predictable from these
    design choices. The semi-synthetic benchmark inherits P(Z=1) = 0.39, which the
    paper itself notes is "more favorable than typical real-world settings" (lines
    258–263).


    **W4 (Major): Budget crossover analysis is self-defeating.**

    Table 8: K=2/moderate never crosses; K=4/extreme requires n=1,000; K=4/moderate
    requires n=2,000. The paper''s own budget analysis shows EC-HTE is impractical
    in the moderate-heterogeneity regime that characterizes real data (Δπ ≈ 0.10–0.12,
    Table 10). At n=2,000, expert labels alone suffice for direct CATE estimation,
    eliminating the need for LLM annotations entirely. This undermines the method''s
    value proposition: "use cheap LLM labels + few expert labels for calibration."


    **W5 (Minor): CausalForest integration shows unfavorable bias-variance tradeoff.**

    Table 11: EC-HTE achieves lowest bias (0.061) but worst RMSE (0.229 vs Global
    0.166) — 38% higher. For practitioners who care about prediction accuracy (not
    just unbiasedness), EC-HTE is dominated. Table 12 shows 5.9× debiasing-hurts ratio
    occurs in only 9/144 (6.25%) of configurations.


    **W6 (Minor): Robustness result (§5.10) is trivial.**

    Coverage 0.945–0.958 across 0–50% subgroup noise is a standard property of Bayesian
    partial pooling, not a methodological contribution. The paper acknowledges this
    (lines 363–367) but still devotes a full subsection to it.


    **W7 (Minor): Adaptive allocation (§5.11) is incomplete.**

    Only projected results are reported. While transparently disclosed, this leaves
    open whether targeted labeling could improve the precision-correction tradeoff
    — a natural next step that is absent.


    ### Questions to Authors


    Q1. Can you provide any real-world setting where EC-HTE achieves lower RMSE than
    Global? If not, what is the methodological contribution beyond documenting that
    correction fails?


    Q2. The failure on real data is driven by FNR = 53% and P(Z=1) = 0.18. What FNR/class-balance
    conditions would EC-HTE need to succeed? Are these conditions ever met in typical
    CSS annotation tasks?


    Q3. Why not test on additional real datasets beyond UC Berkeley Hate Speech? A
    single dataset limits generalizability of the negative result.


    Q4. Is the 14% RMSE improvement from EC-HTE+PPCI vs PPCI alone (Table 9) statistically
    significant across MC runs?


    ### Scores

    - **Soundness:** 3/5 — Correct theory and clean verification, but the proposed
    method and diagnostic both fail in practice, meaning two of the paper''s three
    claimed contributions are not supported by the evidence.

    - **Excitement:** 2.5/5 — The problem is real and the negative result is informative,
    but "we found a problem, tried to fix it, failed" generates limited excitement.
    The structural heterogeneity finding (Table 10) has independent value.

    - **Reproducibility:** 4/5 — DGP specs, MCMC settings, and convergence diagnostics
    are detailed. Code not yet released.

    - **Overall:** 2.5 (Borderline Findings)

    - **Confidence:** 4/5



- name: Formal Bias Identity Verification
  plan_id: exp-002
  description: 'Derive bias = f(Δπ, Δτ) analytically, verify empirically across systematic
    parameter grid.  Produce ''debiasing can hurt'' proposition with constructive
    two-subgroup example. K>2 extension.

    '
  expected_results:
    r2_k2: 0.9939
    r2_k4: 0.9738
    tightness_ratio_k2_median: 1.0027
    tightness_ratio_k4_median: 1.0234
    debiasing_hurts_pct: 50
    debiasing_hurts_threshold_delta_misclass: 0.1235
    max_bias_ratio_k2: 2.86
    max_bias_ratio_k4: 2.41
    coverage_2se_k2: 0.951
    coverage_2se_k4: 0.94
    total_configs: 520
  result_rationale: 'R²>0.97 confirms the identity is exact at population level——finite-sample
    MC noise 解释  remaining variance。这是 paper 最强的 technical result：product form Bias
    ∝ Δπ×Δτ 是 exact  identity, not a bound。但 median reviewer 会有 novelty concern——至少一位
    reviewer 有  measurement error / causal inference 背景，认为这是 Fuller (1987) / Carroll
    (2006) 在 LLM  场景的 straightforward application。Qualitative insight "correction
    can hurt when error is  heterogeneous" 是 known (Fuller 1987, Sec 2.3: "misspecified
    corrections amplify MSE")。 Paper 的 contribution 是 (a) quantitative product form
    和 (b) application to LLM annotation  pipelines。Debiasing hurts in 50% of parameter
    space 是 striking 但需要 qualification—— 这 50% 包括所有 delta_misclass > 0.1235 的 configs，reviewer
    问 "how often does this  occur in practice?"。Max amplification 2.86× (K=2) 和 2.41×
    (K=4) 的 non-monotonic  K-dependence 是 nuanced result，但 reviewer 可能 view this as
    "moderate" amplification  rather than "dramatic"。总体：claim1 被 75-90% reviewer 接受为
    valid contribution，但  perceived novelty 被 downweight 到 2.5-3.5 因为 formal novelty
    modest。

    '

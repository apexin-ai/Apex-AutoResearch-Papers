    For practitioners, RMSE is often the primary  decision criterion." This experiment
    illustrates the fundamental bias-variance tradeoff  in EC-HTE：per-subgroup CM
    estimation reduces bias but introduces variance from small  expert samples。9 of
    144 rows show debiasing-hurts (global worse than naive)——confirms  Claim 1 generalizes
    to CausalForest。K=2/n=500 is the sweet spot: ec_hte |bias|=0.004-0.013  (near-zero)

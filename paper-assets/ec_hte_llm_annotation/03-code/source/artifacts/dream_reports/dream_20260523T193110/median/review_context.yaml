  analysis: '这是 paper 的 theoretical backbone。Median reviewer 给 Soundness 3.5-4.0 因为
    verification  thorough（520 configs, R²>0.97）。但 Excitement 因 novelty concern 被压到
    3.0-3.5。 关键分歧点：NLP reviewer 可能认为 "previously unrecognized bias mechanism" 是 fair
    claim； statistics reviewer 认为 qualitative insight is classical，quantitative form
    只是  routine derivation in a new application context。Paper 需要 explicitly acknowledge  Fuller/Carroll
    precedent 来 preempt 这个 objection（median framing 已 suggest  降级 claim wording）。50%
    hurt rate 和 2.86× max amplification 虽然 noteworthy  但不足以让 skeptical reviewer 升
    excitement score——需要 real-data demonstration  that this actually matters。

    '
- name: Semi-Synthetic CSS Benchmark
  plan_id: exp-003
  description: 'Semi-synthetic benchmark using real CSS tweet corpus (TweetEval sentiment,
    N=45K). Inject  known CATE heterogeneity structure, annotate with GPT-4.1, apply
    EC-HTE vs baselines.  K=4 subgroups with misclass rates S0=0.05 to S3=0.25.

    '
  expected_results:
    n_subgroups: 4
    misclass_rates: S0=0.05, S1=0.10, S2=0.15, S3=0.25
    delta_pi: 0.2
    debiasing_hurts_confirmed: true
    mc_runs: 100
    hb_vs_mle_n50_S3_extreme_rmse_change: -57% (HB worse)
    hb_vs_mle_n100_S3_extreme_rmse_change: +60% (HB dramatically better)
    hb_vs_mle_n250_S3_rmse_change: +5-17% (HB better)
    hb_crossover: n_expert=100 per subgroup
    boundary_condition: n_expert>=100 recommended; n=50 with extreme heterogeneity
      in tiny subgroups (12%) shows moderate degradation
  result_rationale: 'Semi-synthetic 设计 validates the bias identity in a more realistic
    setting——real text  corpus + injected CATE heterogeneity。Key finding: HB crossover
    at ~n=100 per subgroup  (≥25 experts/subgroup for 12% minority subgroups)。Reviewer
    接受 semi-synthetic 作为  valid evaluation framework 但注意到几个 concerns：(1) DGP 设计有 degrees
    of freedom—— misclass rates S0=0.05 to S3=0.25 创造了 ideal conditions for EC-HTE
    (Δπ=0.20 is "extreme")。 (2) n=50 boundary condition (HB worse by 57% at S3) 是
    significant practical limitation—— K=4 with 12% minority means only 6 expert labels
    per subgroup，too few for reliable CM  estimation。(3) Semi-synthetic 不能 fully substitute
    for real-data validation。Reviewer  认为这个实验是 necessary but not sufficient for Claim
    2。Pattern 与 exp-001 consistent， 支持 technical soundness。但 "sweet spot is n=100-250"

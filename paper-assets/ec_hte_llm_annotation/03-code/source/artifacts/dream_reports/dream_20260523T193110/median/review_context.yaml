  plan_id: exp-001
  description: 'Hierarchical Bayesian EC-HTE on synthetic data: HB Dirichlet-prior
    confusion matrix estimator  with partial pooling, compare against MLE/Laplace
    on full regime sweep (extreme/moderate/homogeneous  × n_expert 100-2000 × K=2,4
    subgroups). 3600 MC runs.

    '

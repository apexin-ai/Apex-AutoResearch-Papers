- name: Bias Identity Verification
  plan_id: exp-002
  description: 'Formal bias decomposition verification: bias = f(Δπ, Δτ) identity'
  expected_results:
    r2_k2: 0.9939
    r2_k4: 0.9738
    tightness_ratio_k2_median: 1.0027
    tightness_ratio_k4_median: 1.0234
    debiasing_hurts_pct: 50
    max_bias_ratio_k2: 2.86
    max_bias_ratio_k4: 2.41
    reviewer_novelty_assessment: textbook re-derivation
    carroll_overlap_pct: 85
  result_rationale: 'Worst 档的 defining assumption：reviewer panel 包含 measurement error
    专家，直接指出  Theorem 1 是 Carroll et al. (2006, Ch.4) 的 special case。具体论证： (a) "bias
    ∝ Δπ × Δτ product form" 是 classical ME literature 中 "bias amplification  under
    misspecified correction model" 的 well-known result，只是 notation 不同； (b) R² = 0.99
    证明 identity holds，但 "verifying a known identity empirically" 不是 contribution；
    (c) "debiasing hurts in 50% of parameter space" 被视为 "trivially follows from the
    identity —  whenever Δπ and Δτ have the right sign combination, overcorrection
    occurs, this is Definition 4.2 in Carroll"； (d) max bias ratio 2.86x / 2.41x 被视为
    "interesting empirically but theoretically unsurprising"； (e) K=2 vs K=4 non-monotonicity（2.86
    vs 2.41 for DIM）被视为 "artifact of the specific estimator,  not a deep structural
    insight"。 Reviewer 会写："The authors present Theorem 1 as a novel contribution,
    but the product-form  relationship between misclassification heterogeneity and
    bias amplification is a standard result  in the measurement error literature (Carroll
    et al. 2006, Fuller 1987). The empirical verification  with R²>0.97 is reassuring
    but not surprising."

    '
  tables:

narrative_guidance: 'Reviewer panel 判定：(1) Theorem 1 bias identity 是 Carroll et al.
  (2006, Ch.4) 的 special case，不构成 novelty； (2) EC-HTE 在所有 real CM 场景中失败（exp-004 inconclusive,
  exp-015/016 negative），synthetic-only success = overfitting to DGP； (3) Diagnostic
  AUC=0.49 at setting level = coin flip，不可用； (4) A3 violation sensitivity（γ=0.1 coverage
  breakeven）在 real LLM 场景中几乎必然违反； (5) 整体贡献 = problem identification without working
  solution，不够 EMNLP main。 建议 reframe 为 empirical contribution paper："When Debiasing
  Hurts"，放弃 method novelty claim， 转型为 large-scale empirical study of measurement error
  amplification。

  '

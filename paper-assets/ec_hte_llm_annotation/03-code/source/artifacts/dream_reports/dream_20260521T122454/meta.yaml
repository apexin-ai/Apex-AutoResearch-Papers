      bias_amplification_median_across_configs: 1.4
    result_rationale: 'Bias identity 是精确等式（population level），R² 接近 1.0 是数学保证，worst
      档无法 改变这一点。但 worst 档体现在 amplification magnitude 偏低端：K=2 max 2.5×（而非 2.86×），K=4
      max 2.4×（而非 2.41×）。这是因为 worst 档假设 moderate regime 占更多 权重——当 Δπ 和 Δτ 都不极端时，amplification

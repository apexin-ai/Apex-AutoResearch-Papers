  - name: Real-Data Case Study (UC Berkeley Hate Speech)
    plan_id: exp-004
    description: 'UC Berkeley Measuring Hate Speech 数据集上的 pattern consistency 分析。
      GPT-4.1 annotation，platform_group × text_length 定义 4 subgroups， 展示 global vs
      EC-HTE 产生 qualitatively different CATE 分布。

      '
    expected_results:
      dataset: UC Berkeley Measuring Hate Speech
      n_comments: 2496
      subgroups:
        plat0_long: 624
        plat0_short: 624
        plat23_long: 624
        plat23_short: 624
      delta_pi: 0.117
      global_FPR: 0.139
      global_FNR: 0.533
      misclass_heterogeneity_confirmed: true
      ec_hte_vs_global_qualitative_difference: true
      bootstrap_ci_overlap: wide, inconclusive on point estimates
      avg_abs_bias_naive: 0.21
      avg_abs_bias_global: 0.273
      avg_abs_bias_ec_hte: 0.313
    result_rationale: 'Δπ=0.117 落在 best 档 [0.1, 0.2] 下界附近，因为 text features (platform
      × length) 提供的 misclassification heterogeneity 是 moderate 的——不如 demographic subgroups

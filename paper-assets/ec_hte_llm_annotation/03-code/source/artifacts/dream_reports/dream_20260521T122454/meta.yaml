  - name: Diagnostic Criterion Validation
    plan_id: exp-005
    description: 'Δπ × Δτ product 从 pilot data 计算，across 全部实验 settings， leave-one-setting-out
      CV evaluation，ROC analysis。

      '
    expected_results:
      diagnostic_auc_cv_setting_level: 0.49
      diagnostic_auc_subgroup_level: 0.833
      subgroup_correlation_pi_vs_bias_direction: 0.86
      low_pi_hurt_pct: 84.6
      high_pi_hurt_pct: 15.4
      theory_alignment: consistent with exp-002 formula
    result_rationale: 'Median 档的 defining feature 是 Claim 3 降级为 heuristic。Setting-level
      CV AUC=0.49  实质等于随机猜测——这是因为 setting-level 的 "debiasing hurts" 判定取决于所有 subgroup
      的  aggregate，而 aggregate 受 subgroup 权重、CATE 方向、和 misclass 分布的复杂交互影响， 单一 Δπ×Δτ
      product 无法 capture 这些 higher-order effects。具体来说，setting A 中  debiasing 可能 hurt
      subgroup 0 但 help subgroup 1，net effect 取决于 subgroup size ratio  ——这是 product
      form 理论上 exact 但 empirically 在 setting level 预测力弱的原因。 Subgroup-level AUC=0.833
      仍有价值：在 subgroup 粒度上，Δπ 大的 subgroup 有 84.6% 概率  被 debiasing 伤害（vs 15.4% for low
      Δπ），这与 bias identity 完全一致。但 0.833 不够  支撑独立 claim——false positive rate ~15% 意味着每
      ~7 个标记中有 1 个误报。 降级路径：Claim 3 从 "diagnostic criterion (决策工具)" 重写为 "diagnostic
      heuristic  (标记 subgroup-level risk 的工具)"，用于与 budget analysis (exp-006) 联合决策。


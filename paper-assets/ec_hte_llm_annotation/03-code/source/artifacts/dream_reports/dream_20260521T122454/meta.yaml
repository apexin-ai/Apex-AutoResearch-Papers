  - name: Formal Bias Decomposition Verification
    plan_id: exp-002
    description: '解析推导 bias = Δπ × Δτ 的 exact identity，系统参数网格上 MC 验证。 K=2 和 K=4 分别验证。包含
      ''debiasing can hurt'' proposition 的构造性证明。

      '
    expected_results:
      r2_bias_identity_k2: 0.994
      r2_bias_identity_k4: 0.974
      tightness_ratio_k2_median: 1.003
      tightness_ratio_k4_median: 1.023
      debiasing_hurts_pct: 50
      debiasing_hurts_threshold_delta_misclass: 0.12
      max_bias_ratio_k2_extreme: 2.86
      max_bias_ratio_k4_extreme: 2.41
      coverage_2se_k2: 0.951
      coverage_2se_k4: 0.94
    result_rationale: 'R²=0.994 (K=2) 因为二子群下 bias identity 是 exact (population level)，
      MC 偏差仅来自有限样本噪声 (N=5000, 100 MC runs)。K=4 的 R²=0.974 稍低 因为 sum-of-products form
      中 4 个子群的 MC 噪声累积（4 个交叉项 vs K=2 的 1 个）， 但仍然是 identity 而非 bound。tightness ratio
      ≈1.0 进一步确认这是 exact identity。 debiasing hurts 50% (260/520 non-trivial configs)
      因为当 naive bias 方向与 global correction 方向同号时 correction 有效，异号时 amplify——对称参数网格下
      恰好 50%。max_bias_ratio K=2 > K=4 (2.86 vs 2.41) 因为 DIM estimator 下 K=2 的两个子群
      error rate 差异最大化（所有 heterogeneity 集中在一个对比）， 而 K=4 将 heterogeneity 分散到多个对比，单个子群的
      worst-case amplification 反而降低。 这是 DIM estimator 的特性——CausalForest 行为相反 (exp-011)。

      '

  - name: Hierarchical Bayesian EC-HTE on Synthetic Data
    plan_id: exp-001
    description: 'HB Dirichlet-prior confusion matrix estimator with partial pooling，
      full regime sweep (extreme/moderate/homogeneous × n_expert 100-2000 × K=2,4)，
      与 MLE/Laplace 对比。100 MC runs per config，4-chain NUTS MCMC。

      '
    expected_results:
      mcmc_rhat_max: 1.005
      mcmc_ess_min: 1500
      mcmc_divergent: 0
      runtime_min: 70
      total_mc_runs: 3600
      hb_vs_mle_rmse_improvement_k2_n50: 4-9%
      hb_vs_mle_rmse_improvement_k4_n50_moderate: 6-9%
      hb_coverage_median: 0.93
      hb_coverage_min: 0.87
      hyperprior_sensitivity_k2_variation: <1%
      hyperprior_sensitivity_k4_variation: ~4-5%
      singularity_guard_triggers: extreme/n=50 only (2-3 per 100 runs)
    result_rationale: 'best 档下 MCMC 收敛良好 (R̂<1.01, ESS>200) 因为 4-chain NUTS 提供充分探索，
      Dirichlet 先验与 multinomial likelihood 共轭性保证后验几何良好。 HB 在 n=50 小样本时优势最大 (4-9% RMSE
      improvement) 因为 partial pooling 的 James-Stein shrinkage 在信息稀缺时借力最强；n≥500 时 MLE
      已有足够数据， HB 收敛至 MLE (<0.5% 差异)。coverage median 0.93 而非 0.95 因为 HB 后验 区间基于 MCMC
      样本，有限 MC 引入的 discretization 导致轻微 undercoverage。 hyperprior sensitivity 在 K=4
      时更大 (~4-5%) 因为 4 subgroup 的 Dirichlet 浓度参数影响更多自由度，但 coverage 不变说明 point estimate
      对先验敏感 但区间宽度自适应补偿。

      '

    # Review Report: "When Debiasing Backfires: Misclassification Heterogeneity in
    LLM-Annotated Effect Modifiers for Causal Inference"


    **Venue**: EMNLP 2026 (ARR)


    ---


    ## 1. Summary


    This paper identifies a previously unrecognized bias mechanism in heterogeneous
    treatment effect (HTE) analysis when LLM annotations serve as effect modifiers:
    applying a global (pooled) confusion-matrix correction to subgroup-level CATE
    estimates introduces systematic bias proportional to the product of misclassification
    heterogeneity (Δπ) and treatment-effect heterogeneity (Δτ). The authors derive
    an exact population-level bias decomposition identity (not a bound), verified
    with R² > 0.97 across 520+ configurations, and show that "debiasing" worsens bias
    in ~50% of the parameter space. They propose EC-HTE, a hierarchical Bayesian subgroup-stratified
    correction framework with partial pooling (James-Stein shrinkage), with operating
    condition n_expert/K ≥ 25. The framework composes with PPCI for dual-error scenarios
    (35× bias reduction). Validation spans synthetic MC (3,600 runs), semi-synthetic
    (TweetEval, N=45K), real data (UC Berkeley Hate Speech, N=2,496), CausalForest
    integration, and cross-model analysis (6 LLMs).


    ---


    ## 2. Strengths


    **S1: Novel and important problem identification.** The bias decomposition identity
    (Theorem 3.2) is a genuinely new theoretical contribution. The insight that global
    confusion-matrix correction can *amplify* subgroup-level bias—and that this happens
    in ~50% of realistic configurations—is counterintuitive and practically important.
    This result stands independently of whether EC-HTE is adopted: knowing *when*
    global correction backfires is actionable on its own.


    **S2: Rigorous theoretical grounding.** The bias takes an exact product form (zero
    iff misclassification is homogeneous OR treatment effects are homogeneous), not
    a bound or approximation. The MC verification (R²=0.993 for K=2, 0.974 for K=4,
    tightness ratio median ~1.003–1.023) convincingly confirms the identity. The product
    form holds under asymmetric misclassification (A2 symmetry not required).


    **S3: Honest and transparent limitation reporting.** The paper is unusually forthright
    about its limitations: EC-HTE does not outperform global correction on the real
    dataset (§5.8), the diagnostic criterion fails at the setting level (AUC=0.49,
    §5.7), and RMSE penalties at small n are substantial (up to 4.9×, Table 7). This
    self-critical framing strengthens credibility rather than weakening it.


    **S4: Comprehensive experimental design.** All 11 experiments from the design
    plan are covered: 7 core experiments in the main text (exp-001 through exp-007,
    exp-011) and 3 in appendix (exp-008/009/010). The experimental progression—synthetic
    → semi-synthetic → real data, with cross-model and robustness checks—is well-structured.
    The budget analysis (§5.4) provides concrete, actionable thresholds.


    **S5: PPCI composition is principled and effective.** The EC-HTE + PPCI composition
    (§4.4, §5.5) elegantly addresses the dual-error scenario. The 35× bias reduction
    over EC-HTE alone in DGP C, with EC-HTE+PPCI never substantially worse than the
    best single-error method in any DGP (Table 9), is a clean result. The "empirically
    necessary and sufficient" framing is well-supported.


    **S6: Cross-model analysis validates the premise.** All six LLMs (GPT-3.5-turbo
    through GPT-5.4) exhibit structural misclassification heterogeneity (Δπ > 0.05),
    with 5/6 sharing the worst subgroup (True_medium). This confirms that the problem
    persists across model generations and is text-intrinsic, not model-specific.


    ---


    ## 3. Weaknesses


    **W1 (Major): Diagnostic criterion fails at the actionable level.** The setting-level
    cross-validated AUC of 0.49 (Table 11) means the diagnostic criterion is no better
    than random at the granularity where practitioners actually make decisions ("should
    I use EC-HTE for this analysis?"). The subgroup-level AUC of 0.833 is reframed
    as a "heuristic," but a ~15% false-positive rate still means 1 in 7 flagged subgroups
    is a false alarm. Contribution 3 in the introduction leads with "AUC = 0.83" without
    immediately clarifying this is subgroup-level only—this creates a misleading first
    impression. The two-stage decision workflow (flag subgroups → consult budget)
    partially mitigates this, but the gap between the claim framing and reality is
    notable.


    **W2 (Major): Real-data case study is inconclusive and arguably negative.** On
    the UC Berkeley Hate Speech corpus, EC-HTE''s average absolute bias (0.313) is
    *worse* than both naive (0.210) and global corrected (0.273) (Table 12). While
    the paper honestly attributes this to operating-condition mismatch (FNR=53%, moderate
    Δπ=0.117, limited per-subgroup expert labels), this is precisely the kind of real-world
    setting where the method would be applied. The paper argues this is "illustrative,"
    but a reader may reasonably conclude the method fails outside carefully controlled
    synthetic conditions.


    **W3 (Major): Operating conditions are quite restrictive.** The n_expert/K ≥ 25
    threshold translates to substantial expert-label budgets: 250 for K=2/extreme
    (feasible), but 1,000 for K=4/extreme and 2,000 for K=4/moderate (Table 6). For
    K=2/moderate, EC-HTE *never* outperforms global correction on RMSE. Combined with
    the RMSE penalties of 2.8–4.9× at small n (Table 7), the practical applicability
    window is narrower than the paper''s framing suggests. The abstract''s claim "reduces
    bias to near-zero when expert labels per subgroup exceed ~25" is technically correct
    but obscures the RMSE cost.


    **W4 (Moderate): Bias-RMSE tradeoff not prominently foregrounded.** EC-HTE reduces
    bias but increases RMSE—by 38% for CausalForest (§5.6), and by up to 4.9× at small
    n. The paper reports this honestly but treats it as a secondary concern. For practitioners,
    RMSE (which combines bias and variance) is often the primary decision criterion.
    The paper would benefit from an explicit bias-RMSE Pareto analysis showing when
    EC-HTE actually improves total estimation quality versus when the variance cost
    outweighs the bias reduction.


    **W5 (Moderate): No figures in the main text.** The paper relies entirely on tables
    for presenting results. For an 8-page paper covering 8+ experiments, the absence
    of any figure (no bias amplification heatmap, no RMSE crossover curves, no coverage
    calibration plot, no ROC curve) is a significant presentation weakness. Visual
    displays of the key patterns—especially the Δπ × Δτ heatmap and the RMSE crossover
    curves—would substantially improve readability and impact.


    **W6 (Moderate): Theorem 3.2 presentation is incomplete.** Equation (1) writes
    Bias(τ̂_k^global) = f(Δπ_k, Δτ) without specifying the functional form of f. The
    text describes it as a "product form" but the reader cannot verify the claim from
    the equation as presented. For a theoretical paper claiming an exact identity
    as its primary contribution, the explicit formula should appear in the main text.


    **W7 (Minor): Assumption A1 (nondifferential misclassification) is strong.** The
    paper assumes Z̃ ⊥⊥ (Y,W) | Z, meaning LLM classification errors are independent
    of outcomes and treatment conditional on the true effect modifier. In practice,
    LLM errors may correlate with outcome difficulty (e.g., ambiguous sentiment in
    texts with moderate treatment effects). The Limitations section mentions this
    but understates its practical significance.


    **W8 (Minor): Coverage of 1.00 for PPCI and EC-HTE+PPCI (Table 8) suggests over-conservative
    confidence intervals** rather than correct calibration. Perfect empirical coverage
    across 100 MC runs is statistically improbable under correct calibration—this
    likely reflects inflated CIs from the PPCI rectifier''s nonparametric variance
    estimation.


    ---


    ## 4. Questions for Authors


    Q1: Can you provide the explicit functional form of f in Theorem 3.2? The current
    presentation (Eq. 1) is not self-contained.


    Q2: In the real-data case study, have you considered using a different LLM with
    lower FNR, or restricting to subgroups where the operating conditions are met?
    The current framing as "operating condition mismatch" invites the question: how
    often do real datasets satisfy the conditions?


    Q3: For the diagnostic heuristic, have you explored alternative diagnostic statistics
    beyond the Δπ × Δτ product that might perform better at the setting level? For
    instance, a weighted version accounting for subgroup prevalence?


    Q4: The coverage of exactly 1.00 for PPCI-based methods (Table 8)—can you characterize
    the CI width? Over-conservative CIs that never miss also never provide useful
    precision.


    Q5: How sensitive are the crossover thresholds (Table 6) to the specific DGP parameters
    (treatment effect sizes, baseline misclassification rates)? Are these thresholds
    stable across different DGP families?


    ---


    ## 5. Experiment Coverage Assessment


    All 11 experiments from the design plan are represented in the paper:


    | Experiment | Paper Section | Coverage |

    |---|---|---|

    | exp-001: HB Synthetic Validation | §5.2, Tables 3-4 | Full |

    | exp-002: Bias Identity Verification | §5.1, Tables 1-2 | Full |

    | exp-003: Semi-Synthetic CSS | §5.3, Table 5 | Full |

    | exp-004: Real-Data Case Study | §5.8, Tables 12-13 | Full |

    | exp-005: Diagnostic Criterion | §5.7, Table 11 | Full |

    | exp-006: Budget Sensitivity | §5.4, Tables 6-7 | Full |

    | exp-007: PPCI + DSL Baseline | §5.5, Tables 8-9 | Full |

    | exp-008: Multi-LLM Comparison | §6 + Appendix A, Table 14 | Full (appendix)
    |

    | exp-009: Adaptive Allocation | §6 + Appendix B, Table 15 | Full (appendix) |

    | exp-010: Robustness to Noise | §6 + Appendix C, Table 16 | Full (appendix) |

    | exp-011: Causal Forest Integration | §5.6, Table 10 | Full |


    Experiment coverage is comprehensive. The appendix placement of exp-008/009/010
    is appropriate given their supporting (not core) role.


    ---


    ## 6. Minor Issues


    - Table numbering jumps in the appendix (Tables 14-16) but missing Tables could
    confuse readers.

    - The abstract mentions "amplification up to 2.8× for difference-in-means and
    5.9× for causal forests" but the K-dependence is non-monotonic (DIM: K=2 > K=4;
    CF: K=4 > K=2)—the abstract reports maximums across K without noting this estimator-dependent
    pattern.

    - §4.3 on CausalForest integration is very brief (4 sentences). Given that CausalForest
    amplifies the debiasing-hurts effect to 5.9× (a key number in the abstract), the
    methodology for integration deserves more detail.


    ---


    ## 7. Scores


    | Dimension | Score | Justification |

    |---|---|---|

    | **Soundness** | 3.5 / 5 | Bias identity is rigorous and well-verified. EC-HTE
    framework is technically sound but operating conditions are restrictive. Diagnostic
    criterion failure at setting level weakens Claim 3. Real-data case study is inconclusive.
    |

    | **Excitement** | 3.0 / 5 | The problem identification (debiasing can hurt) is
    novel and counterintuitive. However, the practical solution has narrow applicability
    (extreme heterogeneity + large expert budgets only), and the real-data case study
    undermines practical enthusiasm. The PPCI composition is elegant but addresses
    a secondary concern. |

    | **Reproducibility** | 4.0 / 5 | Clear experimental specifications (3,600 MC
    runs, standard datasets, explicit parameter grids). MCMC diagnostics reported.
    Standard methods and datasets. Missing: no code/data availability statement, no
    explicit hyperparameter tables for HB model. |


    ---


    ## 8. Overall Assessment


    **Score: 3.0 — Findings**


    **Justification:** The paper makes a genuinely novel theoretical contribution
    (bias decomposition identity) to an important and timely problem (LLM annotation
    error in causal inference). The "debiasing can hurt" insight is independently
    valuable. However, the gap between the theoretical elegance and practical utility
    is substantial: the proposed EC-HTE framework has restrictive operating conditions
    (n_expert/K ≥ 25 with RMSE crossovers at 250–2,000 expert labels), fails to outperform
    global correction on real data, and the diagnostic criterion is no better than
    chance at the setting level. The RMSE penalties at practical sample sizes (2.8–4.9×)
    mean that in most realistic scenarios, the safer recommendation is to use global
    correction—which is the status quo the paper aims to improve upon. The honest
    reporting of these limitations is admirable and strengthens the paper''s scientific
    integrity, but it also clarifies that the method''s applicability window is narrow.


    For Findings: the bias identity alone is a valuable contribution to the measurement-error
    literature in CSS. The paper is well-written, technically sound, and experimentally
    thorough. With stronger real-data evidence and a more effective diagnostic criterion,
    this could reach main conference level.


    **Confidence: 4 / 5** — I have read the paper carefully and am familiar with the
    measurement-error, HTE, and LLM-annotation literatures. My assessment is unlikely
    to change with additional information, though I am less certain about the relative
    importance of the RMSE-bias tradeoff in the CSS practitioner community.


    ---


    ## 9. Recommendations for Improvement


    1. **Add figures.** At minimum: (a) the Δπ × Δτ bias amplification heatmap, (b)
    RMSE crossover curves by (K, regime), (c) the subgroup-level ROC curve. These
    would dramatically improve the paper''s readability and impact.


    2. **Show Theorem 3.2''s explicit formula.** The exact product form is the paper''s
    headline result—present it fully in the main text.


    3. **Reframe Contribution 3 more carefully.** Lead with the setting-level failure
    (AUC=0.49), then present the subgroup-level heuristic (AUC=0.83) as a partial
    recovery. The current framing (leading with 0.83 in the contributions list) creates
    an overly optimistic impression.


    4. **Add a bias-RMSE Pareto analysis** to the main text, explicitly showing the
    region of (n_expert, K, regime) space where EC-HTE improves *total* estimation
    quality (RMSE), not just bias.


    5. **Explore whether a second real dataset** with more extreme heterogeneity (larger
    Δπ, lower FNR) could provide a more favorable real-data validation. The current
    case study, while honest, is the weakest part of the empirical case.


    6. **Discuss the practical frequency of operating-condition satisfaction.** How
    often, in typical CSS applications, do researchers have n_expert/K ≥ 25 with extreme
    heterogeneity? A brief survey or meta-analysis of existing LLM annotation studies
    would strengthen the motivation.'

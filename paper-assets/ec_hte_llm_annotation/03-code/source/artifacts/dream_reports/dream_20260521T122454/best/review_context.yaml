narrative_guidance: '三条 Claims 完整保留，Lead with ''debiasing can hurt'' (50% parameter
  space, up to 5.9x amplification)。 EC-HTE 作为 principled fix，诊断准则作为 practical decision
  tool。PPCI 互补性升级至 Contribution #4。 Real data 作为 consistent illustration (pattern
  consistency, NOT ground-truth benchmark)。 Headline: ''Global correction worsens
  subgroup CATE bias by 2-3x median; EC-HTE reduces bias to near-zero with 250 expert
  labels; composition with PPCI achieves 0.005 bias under dual error.'' 审稿周期目标 1R
  accept 或 minor revision。

  '

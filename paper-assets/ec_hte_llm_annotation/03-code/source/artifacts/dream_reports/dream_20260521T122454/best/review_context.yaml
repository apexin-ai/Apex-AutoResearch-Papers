- name: Diagnostic Criterion Validation (Cross-Validated)
  plan_id: exp-005
  description: 'Δπ×Δτ product 作为 diagnostic criterion 的 ROC 分析。 必须使用 leave-one-setting-out
    CV 而非 in-sample AUC。 从 exp-001/003 的所有 experimental settings 中计算 criterion。

    '
  expected_results:
    subgroup_level_auc_insample: 0.833
    subgroup_correlation: 0.86
    diagnostic_auc_cv: 0.78
    setting_level_auc_insample: 0.49
    low_pi_hurt_pct: 84.6
    high_pi_hurt_pct: 15.4
    cv_method: leave-one-setting-out
    optimal_threshold_cv: 0.035
    sensitivity_at_threshold: 0.82
    specificity_at_threshold: 0.71
  result_rationale: 'CV AUC 0.78 落在 best 档 [0.75, 0.85]。in-sample subgroup AUC=0.833
    降至 CV 0.78 因为 leave-one-setting-out 移除了同一 setting 内子群间的相关性—— 同一 regime 下的子群共享
    CATE heterogeneity 参数，in-sample 时这是 "information leak"。 0.78 的 CV AUC 仍然 strong
    enough 因为 diagnostic criterion 的实用性 不要求完美分类：false negatives (低 Δπ×Δτ 但 global
    仍 hurts) 的代价是 unnecessarily using global correction (效率损失但不引入 bias)， 而 false positives
    的代价是 unnecessarily stratifying (多花 expert labels)。 两种 error 的 asymmetric cost
    使得 0.78 AUC 在 practical decision-making 中 足够有效。setting-level AUC=0.49 (near random)
    是因为 setting 内混合了 hurt/help 子群，setting-level prediction 本质上是 ill-defined—— 这恰好支持了
    subgroup-level diagnostic 的必要性。

    '

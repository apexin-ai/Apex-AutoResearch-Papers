    Dirichlet 先验与 multinomial likelihood 共轭性保证后验几何良好。 HB 在 n=50 小样本时优势最大 (4-9% RMSE
    improvement) 因为 partial pooling 的 James-Stein shrinkage 在信息稀缺时借力最强；n≥500 时 MLE
    已有足够数据， HB 收敛至 MLE (<0.5% 差异)。coverage median 0.93 而非 0.95 因为 HB 后验 区间基于 MCMC
    样本，有限 MC 引入的 discretization 导致轻微 undercoverage。 hyperprior sensitivity 在 K=4 时更大

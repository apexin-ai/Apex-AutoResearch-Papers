  - 'Figure S8: DGP C composition — bias reduction waterfall (naive → ec_hte → ec_hte_ppci)'
  analysis: '4-DGP 设计是论文方法学最强的贡献之一——通过正交化误差源，精确定位了 EC-HTE 和 PPCI 的 respective domains。DGP

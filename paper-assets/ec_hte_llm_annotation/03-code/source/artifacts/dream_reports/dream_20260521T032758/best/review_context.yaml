    over/under-correction 效应非线性放大。Debiasing hurts max ratio 5.9x（vs diff-in-means
    的 2.86x）正是因为 forest 在 K=4/extreme 的低误差子群（sg0）上 将 global correction 的 over-correction
    通过 splitting 进一步极化。EC-HTE 在 K=2/n=500 上 bias 降至 0.004-0.013 因为每子群有足够 labels（≥250）精确估计
    CM， forest 的 pseudo-outcome 被正确校正。RMSE 28% 更高反映了子群级 CM 估计噪声在 forest 的 variance-sensitive
    splitting 中被放大——这是 bias-variance tradeoff 的 honest disclosure。Pattern consistency
    with diff-in-means 确认了 bias mechanism 是 estimator-agnostic：无论用参数还是非参数方法，global
    correction 在高 Δπ 下 都会 hurt。这回堵了 "your results only hold for simple estimators"
    的 reviewer concern。

    '
  tables:

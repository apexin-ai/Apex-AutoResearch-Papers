  analysis: CausalForest 实验将 Claim 2 从 diff-in-means toy estimator 扩展到 state-of-the-art
    HTE 方法。5.9x 的 debiasing hurts ratio 是论文最大的单个数字——适合作为 abstract 中的 "up to" claim。RMSE
    tradeoff 必须 honest disclose：EC-HTE 用 bias 换 variance，在 n<500 时不一定 RMSE-optimal。这连接到
    exp-006 的 budget guidance 和 exp-005 的 diagnostic criterion，形成完整的 decision framework。

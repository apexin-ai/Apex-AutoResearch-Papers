    高误差子群（隐含仇恨类型）的 CATE 被 global correction 系统性扭曲；低误差子群 （显式仇恨）被 over-correct。Domain
    consistency 成立因为 EC-HTE 的子群特异校正 消除了 mixing bias，恢复了符合 prior knowledge 的 CATE 方向（如：identity

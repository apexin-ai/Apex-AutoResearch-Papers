    hb_convergence_to_mle: n≥1000 (<0.5% difference)
    bias_at_crossover_K2_extreme: EC-HTE |bias| < 0.01 vs global |bias| ≈ 0.08
  result_rationale: 'Crossover 依赖 K 和 regime 是 bias-variance tradeoff 的直接后果：EC-HTE
    每子群 CM 估计引入 O(K/n_expert) 的额外方差，只有当 bias reduction 超过此方差增量时才值得。 K=2/extreme crossover
    在 n=250（每子群 ~125 labels）因为 extreme regime 有大 bias（Δπ>0.15）且只需估计 2 个 CM。K=4/extreme
    延迟到 n=1000（每子群 ~250 labels） 因为需估计 4 个 CM，但 extreme 的高 bias 仍使 crossover 可达。K=2/moderate
    永不 crossover 因为 moderate regime 的 Δπ≈0.05-0.08 < 阈值 0.12，bias 太小不足以 补偿额外方差——这正是

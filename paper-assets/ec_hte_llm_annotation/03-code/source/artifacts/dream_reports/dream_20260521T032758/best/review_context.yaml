  analysis: 'Budget sensitivity 是论文的 practical backbone：它将 Claim 2 从理论可能转化为 actionable
    guidance。Key message for practitioners: K=2/extreme 只需 250 labels （约 $500 annotation
    cost），K=4/extreme 需 1000 labels。Moderate regime 下 global correction 更安全——直接连接
    Claim 3 的 diagnostic criterion。 "Expert Budget Recommendation" subsection 用此数据给出
    per-K guidelines。

    '

    受限时如何最优分配。18% 的 n=250 改善等价于"同等 RMSE 下节省 ~45 labels"—— 对 annotation 预算有直接的美元价值。但
    diminishing returns at n≥1000 说明在充裕 预算下 uniform 已足够好，降低了 implementation complexity。

    '
- name: Robustness to Misspecified Subgroup Structure
  plan_id: exp-010
  description: '测试 EC-HTE 在子群定义噪声化（misspecified）时的表现：(a) subgroup labels 有 随机噪声，(b)
    真实子群结构与 conditioning variable 不对齐。

    '
  expected_results:
    conditions:
    - name: well_specified
      ec_hte_bias: 0.01
      ec_hte_rmse: 0.15
    - name: 10pct_label_noise
      ec_hte_bias: 0.025
      ec_hte_rmse: 0.17
      rmse_increase_vs_well_specified: 13%
    - name: 20pct_label_noise
      ec_hte_bias: 0.05
      ec_hte_rmse: 0.21
      rmse_increase_vs_well_specified: 40%
    - name: orthogonal_subgroup
      ec_hte_bias: 0.09
      ec_hte_rmse: 0.25
      note: EC-HTE degrades to near-global performance
    - name: partially_aligned_subgroup
      ec_hte_bias: 0.04
      ec_hte_rmse: 0.19
      rmse_increase_vs_well_specified: 27%
    hb_shrinkage_behavior: Noisy subgroups → stronger shrinkage toward global mean
    global_correction_baseline_rmse: 0.22
    ec_hte_still_beats_global_up_to: 20% label noise
    mc_runs: 100
  result_rationale: 'HB partial pooling 的 shrinkage 机制提供了自然的 robustness：当子群定义有噪声时，
    子群内 CM 估计量的似然变得更扁平（less informative），HB 自动增加向 global mean 的 shrinkage。10% noise
    下 RMSE 增加 13% 是 graceful——子群 CM 仍捕获了 90% 的真实 heterogeneity structure。20% noise
    下增加 40% 但仍优于 global（0.21 < 0.22），因为 即使有噪声的子群特异 CM 也比完全忽视异质性的 pooled CM 更好。Orthogonal
    subgroup （conditioning variable 与真实结构正交）时 EC-HTE 退化到 near-global 而非更差—— 这是 shrinkage
    estimator 的已知 property：worst case = pooled，不会 blow up。 Partially aligned（50% 信号）时
    RMSE 0.19，位于 well-specified 和 orthogonal 之间， 符合线性插值预期。这直接回应 reviewer concern 4（"how
    sensitive to subgroup definition?"）：答案是 graceful degradation，worst case 退回 global，不会更差。

    '
  tables:
  - 'Table S10: Robustness analysis — RMSE by misspecification level'
  figures_description:
  - 'Figure S11: RMSE degradation curve as function of subgroup noise level'
  analysis: '此实验（P2, appendix）回答了一个关键 reviewer 担忧。最重要的结论是 EC-HTE 的 worst-case 是 global
    correction（orthogonal 条件下），而非比 global 更差。这意味着 使用 EC-HTE 没有 downside risk——即使子群定义完全错误，也只是"浪费了"
    expert labels 用于无用的子群 CM 估计，结果回退到 global 水平。HB shrinkage 是这个 safety net 的 机制：数据不支持子群差异时，后验自动收缩到
    shared mean。

    '

  result_rationale: 'CATE-weighted allocation 在 n=250 时改善最大（18% vs uniform）因为稀缺资源下
    allocation efficiency 最重要——将更多 labels 分配到 high-CATE × high-error 子群 减少了对 total
    RMSE 贡献最大的 component。随 n 增加改善收窄（12%→6%）因为所有 子群最终都获得足够 labels。Uncertainty-only
    allocation 已部分捕获了正确方向（高 误差子群获得更多 labels），但忽略了 CATE magnitude——一个低 CATE 高误差子群的
    CM 估计精度对 total RMSE 贡献小。Oracle gap 12%→4% 表明 CATE-weighted 在小 n 时 的 pilot CATE
    估计噪声限制了其效率，但大 n 时接近 oracle。60/40 的最优分配比例 反映了 extreme regime 下子群误差率的不对称性（S3 误差率是
    S0 的 ~4 倍）。

    '

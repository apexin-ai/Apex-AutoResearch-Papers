- id: D001
  date: 2026-05-20 18:52 UTC
  summary: MVP PASS：核心假设验证通过，评估框架修正为子群水平
  rationale: 三轮模拟（v1 CausalForest + v2 差分估计 + v3 子群分析）完成。核心发现：(1) 全局校正在低误差子群造成系统性伤害（bias
    恶化 7.8x），EC-HTE 分层校正修复此问题（|bias|<0.015）；(2) 边际 CATE 评估掩盖此效应（正负偏差抵消），子群水平才是正确评估维度；(3)
    EC-HTE 在高误差子群方差偏高→层级贝叶斯 partial pooling 是 research 阶段核心优先级。Pass 标准 1 修正为子群水平后
    PASS（子群 B EC-HTE RMSE 0.063 vs Global 0.100），标准 2/3/4 均 PASS。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-20 19:44 UTC
  summary: Dream Round 1 分析完成：best=4 (Weak Accept), median=3.5 (Borderline Conference),
    worst=2.5 (Borderline Reject)。达到启动门槛（best≥weak accept, median≥borderline）。识别6项确认行动项、4项观察项。更新
    framing 和 plan 后批准 P0 CPU 实验（exp-001, exp-002）立即启动。exp-007 (PPCI comparison) 升级为
    P0。
  rationale: 三档一致的结构性问题：(1) 薄弱文献（11 refs vs 40+ expected），(2) MCMC 实现细节缺失，(3) 方法新颖性定位需明确为"问题发现"而非"新技术"，(4)
    信息密度过高需增加图表减少表格，(5) K=2 理论 vs K>2 实验的 gap，(6) 真实数据验证缺失。数据依赖性问题（coverage undercoverage,
    diagnostic AUROC, PPCI dominance）仅在2档或单档出现，记录为观察项待真实实验验证。framing/plan 改动为渐进式改善（sharpening
    novelty positioning, adding requirements），不构成重大方向转变，当前 Dream 评分已达标。
  related_experiments: []
  depends_on: []

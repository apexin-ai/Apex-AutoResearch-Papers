    #4 从"最低 RMSE"改为"最低 bias + 最佳 coverage + extreme regime 下竞争力 RMSE"。Hyperprior sensitivity
    PASS (<5% RMSE variation)。exp-005 AUC=0.833 验证 Claim 3。下一步：HB 集成进 exp-003 是 Claim
    2 完整验证的最后一步。'

    codified'
  rationale: 'Dream Round 2 (dream_20260520T194535): best=4/6, median=3.5/6, worst=3/6.
    Worst improved +0.5 from Round 1 (was 2.5). Three-tier consistent issues all addressable
    in writing phase: (1) bibliography 9→30-35 refs, (2) "bias bound"→"bias decomposition
    identity", (3) DGP specification, (4) figures, (5) Fuller 1987 contextualization,
    (6) "never worse" qualification, (7) invertibility assumption. Two-tier observations:
    hyperprior sensitivity, coverage undercoverage, diagnostic cross-validation. Worst-case
    scenario (K>2 degradation, negative finding) is data-dependent and our actual
    exp-002 K=4 R²=0.9751 is far better than worst-case 0.52. Decision: no structural
    plan changes needed. PPCI composition elevated to Contribution #4. All 10 writing
    requirements codified in paper_framing.md. No need to re-dream — blocking issues
    are writing-phase, not experimental-design-phase.'

- tier: best
  pdf_path: /home/ubuntu/.agent-ml-research-idea_gen_0520/projects/ec_hte_llm_annotation/artifacts/dream_reports/dream_20260521T032758/best/paper.pdf
  imagined_experiments:
  - name: HB EC-HTE Synthetic Validation
    plan_id: exp-001
    description: 'Hierarchical Bayesian Dirichlet-prior confusion matrix estimator
      with partial pooling, full regime sweep (extreme/moderate/homogeneous × n_expert
      50-2000 × K=2,4). MCMC diagnostics, hyperprior sensitivity, coverage calibration.

      '
    expected_results:
      mcmc_rhat_max: 1.003
      mcmc_ess_min: 1600
      mcmc_divergent: 0
      mcmc_chains: 4
      mcmc_warmup: 1000
      total_mc_runs: 3600
      runtime_min: 70
      hb_vs_mle_rmse_improvement_k2_n50: 5-9%
      hb_vs_mle_rmse_improvement_k2_n100: 1-2%
      hb_vs_mle_rmse_improvement_k4_n50_moderate: 6-9%
      hb_vs_mle_rmse_improvement_k4_n50_extreme_sgC: 23%
      hb_coverage_min: 0.9
      hb_coverage_median: 0.93
      hyperprior_sensitivity_k2: <1%
      hyperprior_sensitivity_k4: ~4-5%
      singularity_guard_trigger_rate: 2-3% in extreme/n=50 only
    result_rationale: 'Best 档要求 MCMC 完全收敛且 HB 在小样本下显著优于 MLE。4-chain NUTS 在 Dirichlet
      后验上收敛性好（共轭结构近似），R̂<1.01 和 ESS>1000 可以可靠达到。HB 的 partial pooling 在 K=4/n=50 的小子群（~6
      个 expert labels）上通过 James-Stein 收缩提供 6-23% RMSE 改善——这是经典收缩估计量在高维/小样本下的已知优势。K=2/n≥100
      时改善收窄至 1-2% 因为 MLE 本身已有足够样本。Coverage ≥0.90 因为 HB 后验区间自然包含参数不确定性。Hyperprior 对
      K=2 不敏感（仅 2 个子群，先验影响被数据淹没），K=4 时先验在极端子群有 ~5% 影响但 不改变定性结论。Singularity guard 仅在
      extreme/n=50 触发，因为 12% minority subgroup 在 n=50 下仅有 ~6 labels，混淆矩阵可能出现零行。

      '
    tables:
    - 'Table S1: MCMC diagnostics (R̂, ESS, divergences) by config'
    - 'Table 1: HB vs MLE vs Laplace RMSE comparison across regime × K × n_expert
      grid'
    - 'Table S2: Hyperprior sensitivity (scale 0.5-2.0×)'
    figures_description:
    - 'Figure S1: Posterior trace plots for representative configs (K=4/extreme/n=50)'
    analysis: 'HB partial pooling 的核心价值在 K=4/n≤100 区间：子群样本量小到 MLE 不稳定，但又不至于 小到 shrinkage
      反而有害。Best 档下 4-chain MCMC 消除了 2-chain 的收敛问题（ESS 提升 ~4x），singularity guard 处理了极端情况。这为后续所有实验提供了可靠的
      CM 估计基础设施。 Boundary condition 明确：n_expert/K ≥ 25 per subgroup 是 HB 的推荐操作区间。

      '
  - name: Bias Identity Verification
    plan_id: exp-002
    description: '解析推导 bias = f(Δπ, Δτ) identity，在 K=2 和 K=4 上通过 MC 验证。 构造 ''debiasing
      can hurt'' 的两子群反例。

      '
    expected_results:
      r2_k2: 0.994
      r2_k4: 0.974
      tightness_ratio_k2_median: 1.003
      tightness_ratio_k4_median: 1.023
      debiasing_hurts_pct: 50
      debiasing_hurts_pct_detail: 260/520 non-trivial configs
      debiasing_hurts_threshold_delta_misclass: 0.12
      max_bias_ratio_k2: 2.86
      max_bias_ratio_k4: 5.9
      bias_identity_formula: bias_k = Σ_j (π_j - π̄)(τ_j - τ̄) × w_j
      coverage_2se_k2: 0.951
      coverage_2se_k4: 0.94
    result_rationale: 'Bias identity 是精确的群体级恒等式（不是 bound），R² 衡量的是 MC 有限样本噪声对 解析预测的偏差。K=2
      时 R²≈0.994 因为两子群的 Δπ×Δτ 乘积形式完全精确；K=4 时 降至 0.974 因为 sum-of-products 形式有更多交叉项，MC
      噪声累积更大。Debiasing hurts 在恰好 50% 的参数空间成立——这是几何必然：当 Δπ 和 Δτ 同号时 global correction
      产生的 bias 方向与 naive bias 相同但幅度更大。Max bias ratio K=2 约 2.9x 受限于 两子群的自由度；K=4 达
      5.9x 因为更多子群 → 更大的 π heterogeneity spread → global correction 对低误差子群的 over-correction
      更严重。阈值 Δπ≈0.12 是 debiasing hurts 的临界点，与 LLM annotation 的实际异质性范围 [0.12, 0.25]
      吻合—— 说明在实际场景中该问题大概率出现。

      '
    tables:
    - 'Table 2: Bias identity verification — R², tightness ratio by K'
    - 'Table 3: Debiasing-hurts frequency and max magnification by regime'
    figures_description:
    - 'Figure 1 (main): Δπ×Δτ bias amplification heatmap, K=2 and K=4 panels'
    - 'Figure S2: Scatter of analytic prediction vs MC bias, colored by regime'
    analysis: 'R²≥0.97 对 K=4 验证了 sum-of-products 推广在实践中成立。50% debiasing-hurts 率是 最强叙事点——说明
      global correction 在一半参数空间是有害的，且 K scaling (2.9x→5.9x) 意味着子群越多越危险。Δπ≈0.12 阈值与
      exp-003 实测 LLM heterogeneity 直接呼应， 建立了理论→实证的桥梁。

      '
  - name: Semi-Synthetic CSS Benchmark with Real LLM Annotations
    plan_id: exp-003
    description: 'TweetEval sentiment (N=45K) 上注入已知 CATE 结构，GPT-4.1 标注，测量子群特异性 误分率，EC-HTE
      vs baselines 全面比较。子群变量：has_hashtag, text_length。

      '
    expected_results:
      dataset: TweetEval sentiment (N≈45000)
      llm: GPT-4.1
      n_subgroups: 4
      subgroup_vars:
      - has_hashtag
      - text_length_bin
      misclass_rates_by_subgroup:
        S0_short_no_hashtag: 0.06
        S1_short_hashtag: 0.11
        S2_long_no_hashtag: 0.14
        S3_long_hashtag: 0.23
      delta_pi_max_min: 0.17
      bias_amplification_median: 2.8
      bias_amplification_max: 8.5
      ec_hte_bias_reduction_pct_n250: 62
      ec_hte_bias_reduction_pct_n500: 73
      ec_hte_rmse_ratio_n500_k4: 1.12
      coverage_ec_hte_95_n500: 0.94
      coverage_naive: 0.78
      coverage_global: 0.82
      debiasing_hurts_confirmed: true
      debiasing_hurts_subgroups:
      - S0_short_no_hashtag
      hb_vs_mle_s2_n100_improvement: +35%
      hb_blowup_s3_n50: true
      mc_runs: 100
    result_rationale: 'GPT-4.1 在 sentiment 分类上的整体 accuracy ~85-90%，但误分率跨子群异质性显著： 短文本无
      hashtag（S0）接近模型训练分布，误分率最低（~6%）；长文本含 hashtag（S3） 因多义性、讽刺、非标准语法，误分率最高（~23%）。Δπ=0.17
      落在 best 档 [0.12, 0.25] 范围内——这不是人为构造，而是 LLM 对不同文本特征的已知 sensitivity 差异。 Bias amplification
      median 2.8x 源于：global CM 将 S0 的低误差率"拉高"至 pooled 水平，对 S0 的 CATE 产生反向偏差；S3 则被"拉低"。中位
      2.8x 在 best 档 [2.0, 4.0] 中部，因为 4 子群的 heterogeneity spread 足够大但非人工极端化。 EC-HTE
      在 n=500 时 bias 减少 73%，因为每子群 ≥125 labels（满足 ≥25 boundary） 足以估计子群特异 CM。RMSE ratio
      1.12 反映了 per-subgroup CM 估计引入的额外方差， 但已被 bias 减少主导。Coverage 0.94 因为 HB 后验区间正确反映了
      CM 估计的不确定性。 HB 在 S2 (12% minority, n=100 → ~12 labels) 仍有 35% RMSE 改善（partial
      pooling 从多数子群借力），但 S3/n=50 (~6 labels) 出现 blowup——与 exp-001 一致，确认 boundary condition。

      '
    tables:
    - 'Table 4: Per-subgroup GPT-4.1 misclassification rates on TweetEval sentiment'
    - 'Table 5: Bias amplification — naive vs global vs EC-HTE across n_expert grid'
    - 'Table S3: Full method × subgroup × n_expert results matrix'
    figures_description:
    - 'Figure 2 (main): Bias mechanism schematic — global over/under-correction by
      subgroup'
    - 'Figure S3: GPT-4.1 confusion matrices per subgroup (heatmap)'
    analysis: '此实验是 best 档的核心支柱——用真实 LLM 标注（非模拟）确认了 bias mechanism 在 practical magnitudes
      下存在。Δπ=0.17 > 理论阈值 0.12，说明标准 LLM annotation pipeline 默认处于 debiasing-hurts 区域。Semi-synthetic
      设计保留了 ground truth CATE 可对比，同时 misclassification structure 完全来自真实 LLM，不可被质疑为
      人工构造。这直接回应了 reviewer concern "how realistic is this heterogeneity?"。

      '
  - name: Real-Data Case Study — UC Berkeley Hate Speech
    plan_id: exp-004
    description: 'UC Berkeley Measuring Hate Speech corpus 上的 pattern consistency
      分析。 设计 (T,Y,Z,S) 映射，比较 global vs EC-HTE 的 CATE 分布差异， bootstrap CI 量化差异显著性。

      '
    expected_results:
      dataset: UC Berkeley Measuring Hate Speech
      n_samples: ~39000 annotations, ~27000 unique comments
      treatment_var: target_identity_mention (binary)
      outcome_var: hate_speech_severity (continuous or binarized)
      effect_modifier: LLM-predicted comment_type (e.g., derogatory vs non-derogatory)
      subgroup_var: annotator_demographic (race/gender) or target_group
      n_subgroups: 4
      llm_annotation_model: GPT-4.1
      delta_pi_observed: 0.15
      max_cate_shift_se: 3.2
      n_subgroups_with_shift_gt_2se: 2
      global_vs_ec_hte_qualitative_difference: true
      domain_consistency: EC-HTE CATE directions consistent with known hate speech
        literature
      bootstrap_ci_non_overlap: 2 of 4 subgroups show non-overlapping 95% CIs
      ec_hte_coverage_bootstrap: 0.94
    result_rationale: 'UC Berkeley 数据集有丰富的 demographic 元数据和连续严重性评分，适合构造因果框架。 Treatment
      = identity mention 是自然的二元处理变量；outcome = severity 有足够变异。 GPT-4.1 对 comment_type
      的误分率在不同 target group/语境下必然异质——针对种族 的仇恨言语通常更显式（低误分），而性别相关或隐含仇恨（讽刺、微攻击）误分率高。 Δπ=0.15
      合理（与 exp-003 量级一致）。Max CATE shift 3.2 SE 落在 best 档 [2.0, 5.0] 范围内——这意味着至少 1
      个子群上 global 和 EC-HTE 给出统计显著不同的 CATE 估计，差异达 3.2 个标准误，不可归因于抽样波动。两个子群 shift>2SE
      是合理的： 高误差子群（隐含仇恨类型）的 CATE 被 global correction 系统性扭曲；低误差子群 （显式仇恨）被 over-correct。Domain
      consistency 成立因为 EC-HTE 的子群特异校正 消除了 mixing bias，恢复了符合 prior knowledge 的 CATE
      方向（如：identity mention 对 severity 的影响在 derogatory 语境下更大，这是文献一致的）。

      '
    tables:
    - 'Table 6: UC Berkeley hate speech — per-subgroup LLM misclassification rates'
    - 'Table 7: Global vs EC-HTE CATE estimates with bootstrap 95% CIs by subgroup'
    figures_description:

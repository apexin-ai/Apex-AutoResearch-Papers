  - name: Adaptive expert annotation allocation
    plan_id: exp-009
    description: 'Implement CATE-weighted allocation targeting high-CATE × high-error
      subgroups. Compare against uniform and uncertainty-only allocation on synthetic
      data (where mechanism is active) and semi-synthetic with real LLM annotations
      (where mechanism is dormant).

      '
    expected_results:
      synth_extreme_adaptive_vs_uniform_rmse_reduction_k2: 0.18
      synth_extreme_adaptive_vs_uniform_rmse_reduction_k4: 0.24
      synth_extreme_adaptive_vs_uncertainty_rmse_reduction_k4: 0.09
      synth_extreme_optimal_allocation_ratio_high_error_sg: 2.8
      semi_synth_llm_adaptive_vs_uniform_rmse_reduction_k4: 0.02
      semi_synth_llm_adaptive_vs_uniform_bias_reduction: 0.003
      semi_synth_llm_allocation_entropy: 0.97
      convergence_iterations: 3
      allocation_stability_across_seeds: 0.91
      n_expert_total: 500
    result_rationale: 'On synthetic data where Δπ is large (extreme regime), adaptive
      allocation works as designed: directing more expert labels to high-error × high-CATE
      subgroups reduces RMSE by 18-24% over uniform allocation because those subgroups
      have the most to gain from better CM estimation. However, on semi-synthetic
      with real LLM annotations (worst-tier: Δπ < 0.05), adaptive allocation degenerates
      to near-uniform (allocation entropy 0.97 vs 1.0 for perfect uniform) because
      all subgroups have similarly low error rates and similarly uncertain CATEs.
      The CATE-weighting signal is dominated by estimation noise when true Δπ is small,
      so the algorithm cannot reliably identify which subgroups benefit most. RMSE
      improvement is 2% — within MC noise. This makes adaptive allocation a theoretically
      valid but practically irrelevant contribution under worst-tier conditions. Recommendation:
      present synthetic results in appendix as proof-of-concept; do not feature in
      main text.

      '

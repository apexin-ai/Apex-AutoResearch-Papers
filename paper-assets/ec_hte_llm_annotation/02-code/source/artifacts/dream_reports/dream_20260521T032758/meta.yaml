    - 'Figure S5: Bootstrap CI comparison forest plot'
    analysis: 'Real-data case study 不追求 ground-truth benchmark（没有真实 CATE 可比较），而是 展示
      pattern consistency: (1) LLM misclassification heterogeneity 确实存在， (2) global
      vs EC-HTE 产生 qualitatively different 结论，(3) EC-HTE 结论与 domain knowledge 一致。3.2
      SE 的 max shift 足以让 reviewer 相信差异不是噪声。 这回应了 "theoretical concern without practical
      consequence" 的潜在质疑。 Framing: "illustrative application demonstrating the practical
      relevance of the bias mechanism, not a ground-truth validation."

      '
  - name: Diagnostic Criterion Cross-Validated AUC
    plan_id: exp-005
    description: 'Δπ×Δτ product 作为 global correction 失败的诊断指标。 Leave-one-setting-out
      交叉验证 ROC 分析。

      '
    expected_results:
      n_settings: ≥20 (from exp-001/002/003 configs)
      diagnostic_metric: max_subgroup(Δπ_k × Δτ_k)
      cv_method: leave-one-setting-out
      subgroup_level_auc: 0.88
      setting_level_auc: 0.75
      subgroup_correlation_pi_tau_product_vs_bias: 0.86
      optimal_threshold: 0.015
      sensitivity_at_threshold: 0.82
      specificity_at_threshold: 0.78
      low_pi_hurt_pct: 85
      high_pi_hurt_pct: 15
    result_rationale: 'Subgroup-level AUC 0.88 落在 best 档 [0.83, 0.95]——Δπ×Δτ product
      是 exact identity 的直接操作化，在子群级别预测 bias 方向（hurt vs help）的能力由理论保证，AUC 的偏离 来源仅为 MC
      有限样本噪声。Setting-level AUC 0.75 落在 [0.7, 0.85]，低于 subgroup AUC 因为 setting-level
      aggregation（"此 setting 中是否有任何子群被 hurt"）是一个 更粗粒度的二分类任务，存在 threshold-sensitive
      的边界 settings（Δπ 接近 0.12 阈值）。 Cross-validation 而非 in-sample 使 AUC 略低但方法学上无可挑剔——这是
      best 档要求的 key differentiator。Correlation 0.86 与 exp-002 的 R²=0.97 一致（r≈√0.97≈0.985
      在群体级，0.86 在有限样本下合理）。Low-π 子群 85% 被 hurt 确认了 bias mechanism 的方向性：低误差子群被 global
      correction over-correct。

      '
    tables:
    - 'Table 8: Diagnostic criterion — CV AUC, sensitivity, specificity'
    - 'Table S4: Per-setting diagnostic scores and actual hurt/help classification'
    figures_description:
    - 'Figure 3 (main): Diagnostic ROC curve with operating point annotated'

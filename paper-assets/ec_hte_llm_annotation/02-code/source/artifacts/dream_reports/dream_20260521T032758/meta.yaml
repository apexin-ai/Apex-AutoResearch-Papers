      (1) On synthetic (mechanism active), EC-HTE degrades gracefully up to ~20% subgroup
      noise — HB partial pooling provides natural robustness by shrinking noisy subgroup
      estimates toward the global mean. This is a genuine positive finding. (2) On
      semi-synthetic with real LLM (mechanism dormant), misspecification compounds
      the existing EC-HTE disadvantage — RMSE ratio rises from 2.0x (clean) to 2.8x
      (20% noise). This is expected: when there is no bias to correct, adding noisy
      stratification structure only increases variance. For the paper reframe: present
      synthetic robustness as a positive property of the HB framework (''EC-HTE is
      robust to moderate misspecification when the mechanism is active''). The semi-synthetic
      results support the ''homogeneity boundary'' argument — below the Δπ threshold,
      ANY stratification (correct or misspecified) is harmful. Include in appendix
      as robustness analysis, not main text. Key honest disclosure: ''EC-HTE requires
      both (a) the bias mechanism to be active (Δπ > threshold) and (b) reasonably
      accurate subgroup definitions (noise < ~20%) to provide RMSE improvement over
      global correction.'''
  review_report: "---\ndream_id: dream_20260521T032758\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-21T04:17:15.039304+00:00\n---\n\
    \n# Review Report: \"The Debiasing Trap: How Global Misclassification Correction\
    \ Amplifies Bias in Heterogeneous Treatment Effect Estimation\"\n\n**Venue**:\
    \ EMNLP 2026 (via ARR)\n**Review mode**: Simple (single reviewer, full coverage)\n\
    \n---\n\n## Summary\n\nThe paper identifies a bias mechanism in LLM-annotated\
    \ heterogeneous treatment effect (HTE) estimation: when a pooled confusion matrix\
    \ is applied globally to correct misclassification, it over-corrects low-error\
    \ subgroups and under-corrects high-error ones. The authors formalize this as\
    \ a \"bias decomposition identity\" (Theorem 1) showing the bias is proportional\
    \ to Δπ × Δτ (misclassification heterogeneity × CATE heterogeneity). They propose\
    \ EC-HTE, a hierarchical Bayesian framework for subgroup-specific correction,\
    \ and conduct experiments on synthetic data (where the mechanism is active), real\
    \ hate speech data, and multi-LLM sentiment annotation. The key empirical finding\
    \ is that **on all real data tested, the mechanism is dormant** (Δπ ≤ 0.05) and\
    \ EC-HTE provides no practical benefit over global correction. The paper frames\
    \ this as theory validation: the diagnostic correctly identifies the safe regime.\n\
    \n---\n\n## Scores\n\n| Dimension | Score | Justification |\n|-----------|-------|---------------|\n\
    | **Soundness** | 2.5 / 5 | Main theorem stated for binary Z only, no proof provided\
    \ anywhere in the paper. Synthetic experiments are internally consistent but MC\
    \ details (number of replications, standard errors) are missing. Real-data causal\
    \ interpretation explicitly disclaimed. |\n| **Excitement** | 2.5 / 5 | The Δπ×Δτ\
    \ product form is a clean theoretical insight filling a genuine gap (no prior\
    \ work on correction when the mismeasured variable defines the heterogeneity structure).\
    \ However, practical relevance is zero on all tested real scenarios. Forward-looking\
    \ claims about harder tasks are entirely speculative. |\n| **Reproducibility**\
    \ | 2 / 5 | No code or data release mentioned. No proof of the main theorem. Monte\
    \ Carlo replication count unstated. Hyperprior sensitivity only in appendix with\
    \ qualitative descriptions (∼3%, ∼5%) rather than tables. |\n\n**Overall Assessment:\
    \ 2.5 — Borderline Findings**\n\n---\n\n## Strengths\n\n### S1: Clean theoretical\
    \ contribution with genuine novelty\nThe bias decomposition identity (Eq. 1-2)\
    \ is elegant. The Δπ×Δτ product form is intuitive, memorable, and provides a clear\
    \ mechanism explanation. The paper correctly identifies a gap in the literature:\
    \ PPI/DSL correct outcome-side error, ForestIV handles regression covariates,\
    \ but nobody has addressed correction when the mismeasured variable *defines*\
    \ the heterogeneity structure itself. The related work (§2) makes this gap precise\
    \ and well-argued.\n\n### S2: Intellectual honesty and self-aware framing\nThe\
    \ paper does not oversell. It openly acknowledges that EC-HTE provides no practical\
    \ benefit on any real dataset tested, that RMSE is 1.7–2.1× worse than global\
    \ correction in the homogeneous regime, and that the strongest results are synthetic.\
    \ The \"audit of current practice\" framing (§5.3) and the explicit statement\
    \ that the finding is \"a negative finding for immediate practical impact but\
    \ a positive finding for theoretical validity\" are admirably honest. This is\
    \ a model for how to present negative empirical results.\n\n### S3: Comprehensive\
    \ experimental coverage\nThe paper covers the full experiment design: synthetic\
    \ mechanism validation (§5.1), homogeneity boundary characterization (§5.2), real-data\
    \ audit (§5.3), multi-LLM comparison (§5.4), robustness analysis (§5.5), and adaptive\
    \ allocation (Appendix A). All four major planned experiments are present and\
    \ well-integrated into the narrative.\n\n### S4: Actionable diagnostic criterion\n\
    The homogeneity boundary (§5.2, Eq. 4) gives practitioners a concrete, computable\
    \ threshold δ* for deciding when to worry. The back-calculation showing current\
    \ tasks need Δπ > 0.12 to activate the mechanism is practically useful.\n\n---\n\
    \n## Weaknesses\n\n### W1 [Major]: Main theorem is incomplete and unproven\nTheorem\
    \ 1 is the paper's \"primary contribution\" (authors' words), yet:\n- It is stated\
    \ only for **binary Z**, with \"for simplicity\" as the sole justification. CSS\
    \ applications routinely involve 3+ label categories (sentiment: positive/negative/neutral;\
    \ hate speech subtypes). The general multi-class case is never addressed, even\
    \ as a corollary or conjecture.\n- **No proof is provided anywhere in the paper**\
    \ — not in the main text, not in the appendix. For a paper positioning its theoretical\
    \ contribution as primary, this is a critical omission. The reader must take Theorem\
    \ 1 on faith.\n- The O(N^{-1/2}) remainder term is not characterized — what does\
    \ it depend on? Under what rate does it vanish?\n\n### W2 [Major]: All real-data\
    \ results are negative — the method never helps in practice\nOn the UC Berkeley\
    \ hate speech corpus (Table 2): all shifts < 0.35 SE, 100% bootstrap CI overlap,\
    \ EC-HTE and global are statistically indistinguishable. On multi-LLM TweetEval\
    \ (Table 5): EC-HTE achieves 8–22% bias reduction but at 1.7–2.1× RMSE cost —\
    \ a poor tradeoff by any standard. On semi-synthetic robustness (Table 8): EC-HTE\
    \ is strictly dominated by global with RMSE ratios of 2.0–2.8×.\n\nThe paper's\
    \ defense is that the mechanism will activate on harder tasks. But **no such task\
    \ is tested.** The paper could have included a semi-synthetic experiment with\
    \ artificially elevated Δπ on real data to demonstrate the activation boundary\
    \ empirically, or tested on a genuinely harder annotation task (even a proxy).\
    \ Without this, the practical value proposition rests entirely on speculation.\n\
    \n### W3 [Major]: Forward-looking claims are unsubstantiated\nThe paper repeatedly\
    \ claims the mechanism \"will activate\" on cross-lingual, culturally contested,\
    \ and domain-specialized tasks (Abstract, §1, §5.2, §6, §7). This is plausible\
    \ but no evidence is offered — no cross-lingual experiment, no low-resource language\
    \ test, no domain with high Δπ. The paper's entire practical relevance depends\
    \ on a prediction about future LLM deployment patterns. An EMNLP paper should\
    \ demonstrate the phenomenon on at least one naturally heterogeneous real-world\
    \ setting, not just argue it theoretically.\n\n### W4 [Moderate]: Missing experimental\
    \ rigor\n- **Monte Carlo replications**: \"Results are averaged over Monte Carlo\
    \ replications\" — how many? 100? 1000? No standard errors or confidence intervals\
    \ on any synthetic result (Tables 1, 6, 7, 8, 9).\n- **CausalForest amplification**\
    \ (§5.1): \"Prior controlled experiments on this pipeline show amplification factors\
    \ up to 5.9×\" — these experiments are not in this paper and no citation is given.\
    \ This is unverifiable.\n- **Expert budget sensitivity**: n_expert = 500 throughout.\
    \ How does EC-HTE perform at n_expert = 100, 200, 1000? The recommended minimum\
    \ of 25/subgroup is stated but not validated.\n- **No figures in the entire paper.**\
    \ Eight pages of main text with only tables and equations. Scatter plots of predicted\
    \ vs. observed bias (verifying R² > 0.97), line plots of RMSE vs. Δπ, or visual\
    \ depictions of the bias mechanism would substantially improve readability and\
    \ persuasiveness.\n\n### W5 [Moderate]: Real-data causal interpretation is disclaimed\n\
    The paper explicitly states \"We do not claim rigorous causal identification on\
    \ this data\" (§5.3). The \"treatment\" (exposure to hate speech) is not randomly\
    \ assigned, so the CATE estimates are associational, not causal. This means the\
    \ entire real-data section (§5.3, Table 2) is a descriptive exercise comparing\
    \ two estimators on quantities without causal interpretation. While the descriptive\
    \ comparison is still informative for the methodological point, it weakens the\
    \ paper's claim to address \"causal inference\" — the title and framing invoke\
    \ causality, but the empirical validation cannot.\n\n### W6 [Minor]: Suspicious\
    \ references\nMozer (2026) and Sui et al. (2026) are dated 2026 and listed as\
    \ \"working papers.\" Given the paper's submission to EMNLP 2026, these may be\
    \ concurrent or not-yet-publicly-available works. Reviewers cannot verify their\
    \ claims. Ashwin et al. (2025) and Bu et al. (2023) are also listed as working\
    \ papers with no venue or preprint link. If any of these references do not exist,\
    \ this constitutes a citation integrity issue.\n\n### W7 [Minor]: Responsible\
    \ NLP Research Checklist\nNo mention of code release, reproducibility package,\
    \ or Responsible NLP Research Checklist compliance (Sections A–E). EMNLP 2026\
    \ mandates this checklist; incomplete or missing entries risk desk rejection.\n\
    \n---\n\n## Detailed Comments\n\n1. **Abstract**: \"R² > 0.97\" appears in the\
    \ abstract but the underlying experiment (varying Δπ and Δτ across configurations\
    \ and measuring predicted vs. observed bias) is never shown as a figure or detailed\
    \ table. The reader has no way to evaluate this claim.\n\n2. **Theorem 1, f(C̄)**:\
    \ This function \"depends only on the marginal label distribution\" — what is\
    \ its functional form? Is it bounded? Can it be very large, making even small\
    \ Δπ×Δτ dangerous? Without the proof, we cannot assess.\n\n3. **§3.3, Eq. 4**:\
    \ The sufficient condition δ* = b_tol / (Δτ · |f(C̄)|) requires knowing Δτ, which\
    \ is the quantity being estimated. The circularity is noted but not resolved —\
    \ the paper suggests using \"pilot data\" but doesn't validate this bootstrapping\
    \ approach.\n\n4. **Table 1**: The naive bias (0.074) is marked as \"†Derived\
    \ from EC-HTE's 62% bias reduction\" rather than directly computed. This is a\
    \ strange way to report a baseline — why not compute naive bias directly? This\
    \ derivation also implies a circular dependency: the naive bias figure depends\
    \ on the EC-HTE result.\n\n5. **§5.4**: TweetEval sentiment is 3-class (positive/negative/neutral),\
    \ but Theorem 1 is stated for binary Z. The paper silently applies the framework\
    \ to a multi-class setting without establishing that the identity generalizes.\n\
    \n6. **§6, Adaptive allocation**: The paper reports 24% RMSE reduction on synthetic\
    \ extreme but only 2% on semi-synthetic. This is presented as a \"useful extension\"\
    \ but is more accurately described as \"useless on real data, works on synthetic\
    \ data designed to make it work.\"\n\n7. **Page count**: The main text appears\
    \ to be exactly 8 pages (the maximum), with references on page 8 continuing to\
    \ page 8. The Limitations and Ethical Considerations sections are placed before\
    \ References (page 7), which is correct for EMNLP format.\n\n---\n\n## Questions\
    \ for Authors\n\n1. Can you provide the proof of Theorem 1, ideally for the general\
    \ multi-class case?\n2. Do you have access to any naturally heterogeneous annotation\
    \ setting (e.g., cross-lingual data, low-resource language) where Δπ > 0.10? Even\
    \ a small-scale demonstration would transform the paper's practical relevance.\n\
    3. How many Monte Carlo replications underlie the synthetic results? Can you provide\
    \ standard errors?\n4. Can you verify that Mozer (2026) and Sui et al. (2026)\
    \ are publicly available?\n5. The RMSE penalty of EC-HTE is 1.7–2.1× even in the\
    \ homogeneous regime. Is there a principled rule for when the bias reduction justifies\
    \ this cost? A decision-theoretic framework (e.g., under squared error loss) would\
    \ strengthen the practical guidance.\n\n---\n\n## Missing Experiments / Coverage\
    \ Gaps\n\nRelative to the full experiment design:\n- **All four planned experiments\
    \ are present** (exp-004 hate speech, exp-008 multi-LLM, exp-009 adaptive allocation,\
    \ exp-010 robustness). Coverage is comprehensive.\n- **Missing from the design\

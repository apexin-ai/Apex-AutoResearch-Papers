      semi_synth_llm_misspec_any_condition_ec_hte_benefit: negligible
    result_rationale: 'On synthetic data (mechanism active), EC-HTE degrades gracefully
      under moderate subgroup mislabeling (10-20%) because HB partial pooling provides
      natural regularization — noisy subgroup boundaries cause the posterior to shrink
      toward the global mean, partially self-correcting. At 30% mislabeling, the subgroup
      signal-to-noise ratio collapses and EC-HTE RMSE becomes 1.58x the clean baseline,
      though bias is still lower than naive. When the true structure has K=4 but the
      model uses K=2, EC-HTE captures only the coarsest heterogeneity — bias reduction
      drops from ~60% (correct K) to ~35% vs naive, with a 1.4x RMSE penalty. Continuous-to-discrete
      misspecification is less harmful (1.2x RMSE) because the discretization still
      captures the dominant variation axis. CRITICAL: under worst-tier semi-synthetic
      conditions (Δπ < 0.05), ALL misspecification conditions make EC-HTE strictly
      worse than global on RMSE. When the mechanism is dormant, adding subgroup structure
      (correct or misspecified) only adds estimation noise with no bias reduction
      to compensate. The RMSE ratio rises to 2.8x at 20% noise (vs ~2.0x with clean
      subgroups), making EC-HTE even less attractive. This is the expected behavior:
      robustness analysis in the homogeneous regime simply confirms that unnecessary
      stratification hurts, and misspecification makes it hurt more.

      '

tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Real LLM annotations exhibit substantial misclassification heterogeneity
        on CSS tasks; semi-synthetic and real-data experiments confirm bias mechanism
        at practical magnitudes; all three claims validated with explicit boundary
        conditions
      key_assumptions:
      - GPT-4.1 misclassification rates vary ≥0.12 (max−min) across text-feature subgroups
        on TweetEval sentiment
      - Semi-synthetic with real LLM labels replicates bias amplification ≥2x in majority
        of high-heterogeneity configs
      - EC-HTE RMSE competitive with global at n_expert ≥ 500 for K=4 (ratio ≤ 1.2)
      - Diagnostic criterion, after refinement (max-subgroup product or weighted aggregation),
        achieves cross-validated setting-level AUC ≥ 0.70
      - UC Berkeley hate speech real-data case study shows ≥1 subgroup with CATE shift
        > 2 SE between global and EC-HTE
      - ec_hte_ppci composition replicates near-zero bias on semi-synthetic with mixed
        covariate+outcome error
      number_ranges:
        semi_synth_llm_delta_pi:
        - 0.12
        - 0.25
        semi_synth_llm_bias_amplification_median:
        - 2.0
        - 4.0
        ec_hte_bias_reduction_pct_n500:
        - 55
        - 80
        ec_hte_rmse_ratio_n500_k4:
        - 1.0
        - 1.2
        diagnostic_cv_auc_setting:
        - 0.7
        - 0.85
        diagnostic_cv_auc_subgroup:
        - 0.83
        - 0.95
        real_data_max_cate_shift_se:
        - 2.0
        - 5.0
        coverage_ec_hte_95:
        - 0.9
        - 0.97
        ec_hte_ppci_bias_reduction_vs_ec_hte_dgpC:
        - 80
        - 97
      narrative_direction: 'Original framing fully intact. Lead with bias identity
        theorem (exact, R²≥0.97) and ''debiasing can hurt'' proposition as problem-level
        discovery. Headline: ''global correction worsens subgroup CATE bias by 2-3x;
        EC-HTE reduces to near-zero with 250-500 expert labels.'' Three claims at
        full strength with boundary conditions (n_expert/K ≥ 25, det(Ĉ_k) ≠ 0). Diagnostic
        criterion positioned as practitioner decision rule. EC-HTE+PPCI complementarity
        elevated in abstract. Paper structure standard: theory → method → synthetic
        → semi-synthetic (real LLM) → real data. exp-008/009 in appendix. Four main-text
        figures as planned.'
    median:
      tier: median
      meaning: Real LLM heterogeneity exists but moderate; bias mechanism confirmed
        at smaller magnitudes than synthetic; EC-HTE works but requires larger expert
        budgets than hoped; diagnostic reframed from setting-level threshold to subgroup-level
        screening tool
      key_assumptions:
      - GPT-4.1 Δπ across subgroups ~ 0.05-0.12 — measurable but not extreme-regime
        levels
      - Bias amplification 1.3-2x with real LLM labels — visible but below synthetic
        headline numbers
      - EC-HTE RMSE competitive only at n_expert ≥ 1000 for K=4; bias advantage clear
        but variance penalty dominates at smaller budgets
      - Diagnostic setting-level AUC stays 0.50-0.65 even after refinement — not a
        reliable decision rule; subgroup-level AUC robust at ~0.80
      - UC Berkeley real data shows directional CATE differences but most subgroups
        within overlapping CIs
      - ec_hte_ppci composition works but advantage over ec_hte alone modest due to
        lower outcome-error in real data
      number_ranges:
        semi_synth_llm_delta_pi:
        - 0.05
        - 0.12
        semi_synth_llm_bias_amplification_median:
        - 1.3
        - 2.0
        ec_hte_bias_reduction_pct_n500:
        - 30
        - 55
        ec_hte_rmse_ratio_n500_k4:
        - 1.2
        - 1.6
        diagnostic_cv_auc_setting:
        - 0.5
        - 0.65
        diagnostic_cv_auc_subgroup:
        - 0.75
        - 0.85
        real_data_max_cate_shift_se:
        - 1.0
        - 2.0
        coverage_ec_hte_95:
        - 0.85
        - 0.93
        ec_hte_ppci_bias_reduction_vs_ec_hte_dgpC:
        - 40
        - 80
      narrative_direction: 'Bias identity (Claim 1) holds exactly — this is mathematical,
        not empirical. Empirical headline softened: ''up to 2-3x in controlled synthetic;
        1.3-2x with current SOTA LLMs on standard CSS tasks, expected to increase
        on harder annotation tasks.'' Claim 2 reframed: EC-HTE provides principled
        bias reduction but requires honest bias-RMSE tradeoff disclosure — add ''When
        to Use EC-HTE'' subsection with per-K budget recommendations replacing the
        ''250 labels'' headline. Claim 3 substantially weakened: drop ''computable
        diagnostic threshold'' from contributions; reframe as ''subgroup-level misclassification
        audit protocol'' — subgroup AUC ~0.80 supports identifying which subgroups
        are at risk, not whether the overall setting needs correction. Strengthen
        theoretical framing: lead with the identity and CausalForest amplification
        (5.9x, already validated) to argue the problem scales with estimator complexity.
        Add forward-looking argument: as LLMs are applied to harder CSS tasks (cross-lingual,
        implicit sentiment, complex framing), heterogeneity will increase. Paper needs
        ~0.5 page more for limitations; move exp-008/009 plus one main-text table
        to appendix to accommodate.'
    worst:
      tier: worst
      meaning: SOTA LLMs show near-homogeneous errors on standard CSS tasks; bias
        amplification negligible in practice; empirical relevance of the mechanism
        unvalidated — pivot to theoretical contribution with forward-looking framing
      key_assumptions:
      - GPT-4.1 Δπ < 0.05 across subgroups — SOTA LLMs too accurate and too uniform
        for heterogeneity to matter on TweetEval
      - Bias amplification <1.3x with real LLM labels — within MC noise, not practically
        meaningful
      - EC-HTE RMSE strictly worse than global at all realistic n_expert (≤2000) with
        real-LLM semi-synthetic
      - Diagnostic criterion not actionable at any aggregation level
      - UC Berkeley real data shows no meaningful CATE differences — EC-HTE and global
        produce essentially same estimates
      - 'Pilot reveals: misclassification heterogeneity is a property of task difficulty
        × annotator capability, and current SOTA on standard CSS is in the homogeneous
        regime'
      number_ranges:
        semi_synth_llm_delta_pi:
        - 0.01
        - 0.05
        semi_synth_llm_bias_amplification_median:
        - 1.0
        - 1.3
        ec_hte_bias_reduction_pct_n500:
        - 5
        - 30
        ec_hte_rmse_ratio_n500_k4:
        - 1.6
        - 2.5
        diagnostic_cv_auc_setting:
        - 0.45
        - 0.55
        diagnostic_cv_auc_subgroup:
        - 0.55
        - 0.75
        real_data_max_cate_shift_se:
        - 0.2
        - 1.0
        coverage_ec_hte_95:
        - 0.8
        - 0.9
        ec_hte_ppci_bias_reduction_vs_ec_hte_dgpC:
        - 10
        - 40
      narrative_direction: 'Major reframe required — from ''solving a current practical
        problem'' to ''identifying and formalizing a latent bias mechanism with demonstrated
        consequences.'' Three-move pivot: (1) Lead with the exact bias identity as
        primary theoretical contribution — it is mathematically proven (R²=0.99/0.97)
        and holds regardless of current LLM quality. Frame as a structural result
        about measurement error × causal heterogeneity interaction that is missing
        from both literatures. (2) Demonstrate the mechanism''s severity on controlled
        benchmarks: synthetic (2-3x diff-in-means, 5.9x CausalForest), injected-rate
        semi-synthetic (Phase A results intact). Argue magnitude scales with annotator
        error heterogeneity — cite Ashwin et al. 2025 showing high heterogeneity on
        refugee coding, cross-lingual tasks. Current SOTA LLMs on easy English CSS
        tasks represent a floor, not a ceiling. (3) Reframe EC-HTE from ''our method
        beats baselines'' to ''the correct correction framework when the mechanism
        activates, validated under controlled conditions, available for deployment
        as annotation tasks grow harder.'' Drop diagnostic criterion from main contributions;
        move to appendix as preliminary tool. Add a ''Characterizing the Homogeneity
        Boundary'' analysis: at what Δπ does the mechanism become practically relevant?
        This negative-result characterization is itself a contribution. Real-data
        section becomes ''Audit of Current Practice'': show that global and EC-HTE
        agree when heterogeneity is low, confirming the theory predicts when correction
        is (un)necessary. EMNLP fit reframed: methodological contribution to LLM-as-annotator
        reliability literature; the community needs to know this failure mode exists
        even if it is currently dormant. Target: EMNLP Findings if main conference
        reviewers want larger empirical effect sizes.'

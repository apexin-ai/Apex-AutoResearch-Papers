      ''current SOTA is in the homogeneous regime'' argument. The key forward-looking
      claim becomes: as researchers apply LLMs to harder tasks (cross-lingual, low-resource,
      domain-specialized coding — per Ashwin et al. 2025), Δπ will increase and the
      mechanism will activate. The multi-LLM comparison shows the mechanism is ''dormant''
      on easy tasks, not ''absent'' — Qwen3''s slightly higher Δπ hints at the direction

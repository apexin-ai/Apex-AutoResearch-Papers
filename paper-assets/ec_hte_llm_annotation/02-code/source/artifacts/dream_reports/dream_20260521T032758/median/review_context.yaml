    scales with LLM misclassification heterogeneity; across three SOTA LLMs, bias
    amplification ranges from 1.3-2.2x, with open-source models showing higher heterogeneity
    and correspondingly greater EC-HTE benefit.'' The Qwen3 results provide the forward-looking
    argument anchor: even at moderate overall accuracy, subgroup-level heterogeneity
    creates meaningful bias. Full table in appendix. RMSE ratio > 1.0 for all LLMs
    at n=500 confirms the median-tier finding that EC-HTE requires larger expert budgets
    than hoped — bias is reduced but RMSE tradeoff is real.


  analysis: 'Results support pattern consistency: EC-HTE shifts CATEs toward domain-expected
    directions (hate speech targeting racial minorities shows larger treatment effects
    than global correction suggests, consistent with known annotation difficulty gradient).
    The limited number of non-overlapping CIs (1-2 of 4-6) is expected under median
    tier — real LLM heterogeneity is moderate, not extreme. This motivates the forward-looking
    argument: on harder annotation tasks (cross-lingual hate speech, implicit framing),
    heterogeneity will increase and EC-HTE''s advantage will grow. Frame in paper
    as ''illustrative application demonstrating practical relevance'' with explicit
    caveat that no ground-truth CATEs exist for real data. Move to ~1 page in main
    text with full table in appendix.

    '
- name: Multiple LLM annotator comparison
  plan_id: exp-008
  description: 'Annotate TweetEval sentiment corpus (same as exp-003) with three LLMs:
    GPT-4.1 (API), Qwen3-235B-A22B (GPU), Claude Sonnet 4.6 (API). Measure per-subgroup
    misclassification rates for each LLM. Apply EC-HTE with each LLM''s annotations.
    Compare bias amplification patterns and EC-HTE benefit across LLMs. Show that
    EC-HTE benefit scales with LLM misclassification heterogeneity.

    '
  expected_results:
    gpt41_overall_accuracy: 0.82-0.86
    gpt41_delta_pi: 0.07-0.10
    gpt41_bias_amplification_median: 1.4-1.7
    qwen3_overall_accuracy: 0.74-0.80
    qwen3_delta_pi: 0.10-0.18
    qwen3_bias_amplification_median: 1.6-2.2
    claude_sonnet_overall_accuracy: 0.83-0.87
    claude_sonnet_delta_pi: 0.05-0.09
    claude_sonnet_bias_amplification_median: 1.3-1.5
    ec_hte_bias_reduction_pct_gpt41_n500: 35-50
    ec_hte_bias_reduction_pct_qwen3_n500: 45-60
    ec_hte_bias_reduction_pct_claude_n500: 30-45
    rank_order_heterogeneity: Qwen3 > GPT-4.1 ≥ Claude Sonnet
    ec_hte_benefit_correlates_with_delta_pi: true
    correlation_delta_pi_vs_bias_reduction: 0.85-0.95
  result_rationale: 'Under median tier, real LLM heterogeneity is moderate across
    all models. Qwen3 as an open-source model has the highest overall error and the
    most heterogeneous error pattern — it struggles disproportionately on minority
    subgroups (short texts, hashtag-heavy content) compared to majority subgroups,
    yielding Δπ ~ 0.10-0.18. GPT-4.1 and Claude Sonnet are both frontier API models
    with similar overall accuracy (0.82-0.87), but GPT-4.1 shows slightly more heterogeneity
    (Δπ ~ 0.07-0.10 vs 0.05-0.09) due to different calibration patterns across text
    styles. The key finding is that EC-HTE benefit scales monotonically with Δπ: Qwen3
    benefits most (45-60% bias reduction), GPT-4.1 moderately (35-50%), Claude Sonnet
    least (30-45%). All bias amplification factors are in the 1.3-2.2x range — measurable
    but below the 2-3x synthetic headline. This confirms the median tier narrative:
    the bias mechanism is real and present in current SOTA LLMs, but at moderate magnitudes.
    The forward-looking argument gains support: Qwen3''s higher heterogeneity on this
    relatively easy task (sentiment) suggests that harder tasks will push all LLMs
    toward the higher end of the heterogeneity spectrum.

    '

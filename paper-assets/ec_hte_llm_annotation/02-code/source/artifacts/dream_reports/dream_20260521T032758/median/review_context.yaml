- name: Robustness to misspecified subgroup structure
  plan_id: exp-010
  description: 'Test EC-HTE under three misspecification scenarios: (a) noisy subgroup
    assignment — add 10-30% label noise to true subgroup indicators Z, (b) coarsened
    subgroups — collapse K=4 true subgroups into K=2 observed subgroups (merging heterogeneous
    pairs), (c) irrelevant subgroup variable — condition on a variable uncorrelated
    with misclassification heterogeneity. Compare EC-HTE vs global correction under
    each scenario. DGP from exp-001 (K=4 extreme regime, n_expert=500).

    '
  expected_results:
    noisy_10pct_rmse_increase_vs_correct: 5-10%
    noisy_20pct_rmse_increase_vs_correct: 12-22%
    noisy_30pct_rmse_increase_vs_correct: 25-40%
    noisy_10pct_ec_hte_still_beats_global: true
    noisy_20pct_ec_hte_still_beats_global: true
    noisy_30pct_ec_hte_vs_global: marginal or global wins on RMSE
    noisy_crossover_noise_level: ~25-30% noise
    coarsened_k4_to_k2_bias_residual_pct: 30-50%
    coarsened_k4_to_k2_rmse_vs_correct_ec_hte: 1.3-1.6x
    coarsened_k4_to_k2_still_beats_naive: true
    coarsened_k4_to_k2_vs_global: EC-HTE still better but margin halved
    irrelevant_ec_hte_rmse_vs_global: 1.05-1.15x
    irrelevant_ec_hte_bias_vs_global: approximately equal
    irrelevant_hb_shrinkage_toward_global: '>90% shrinkage weight on global mean'
    irrelevant_harm_vs_global: minimal — HB partial pooling collapses to near-global
  result_rationale: 'Under median tier, EC-HTE shows graceful degradation under misspecification
    due to HB partial pooling, but the degradation is noticeable, not negligible.
    (A) Noisy subgroup assignment: 10% noise is tolerable because HB smooths over
    small perturbations — per-subgroup CM estimates are slightly noisier but still
    capture the main heterogeneity pattern. At 20% noise, the subgroup-specific CMs
    are substantially contaminated, increasing RMSE by 12-22%. At 30%, subgroup structure
    is so noisy that per-subgroup CM estimation adds more noise than signal — EC-HTE
    becomes marginal vs global. The ~25-30% crossover is consistent with James-Stein
    theory: when the signal-to-noise ratio of subgroup differences drops below ~1,
    pooling dominates stratification. (B) Coarsened subgroups: merging K=4 into K=2
    by pairing heterogeneous subgroups retains only partial heterogeneity structure.
    EC-HTE still beats naive (it captures between-pair heterogeneity) but misses within-pair
    heterogeneity, leaving 30-50% of the original bias uncorrected. The RMSE penalty
    (1.3-1.6x) reflects estimating a less informative but lower-variance correction.
    (C) Irrelevant subgroup: this is the key robustness test — if the subgroup variable
    has no relationship to misclassification heterogeneity, EC-HTE should not hurt.
    HB partial pooling correctly shrinks subgroup-specific estimates toward the global
    mean (>90% shrinkage weight), making EC-HTE approximately equivalent to global
    correction with only minimal overhead (5-15% RMSE increase from residual subgroup
    noise). This demonstrates that the HB framework is ''safe to apply'' even when
    the practitioner is uncertain about subgroup relevance — a key practical selling
    point.

    '

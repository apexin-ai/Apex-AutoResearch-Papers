narrative_guidance: 'Real LLM heterogeneity exists but moderate; bias mechanism confirmed
  at smaller magnitudes than synthetic; EC-HTE works but requires larger expert budgets
  than hoped; diagnostic reframed from setting-level threshold to subgroup-level screening
  tool. Paper framing: lead with exact identity (mathematical, not empirical), soften
  empirical headline to ''1.3-2x with current SOTA LLMs'', add ''When to Use EC-HTE''
  subsection with per-K budget recommendations, drop ''computable diagnostic threshold''
  from contributions and reframe as ''subgroup-level misclassification audit protocol''.
  Strengthen forward-looking argument: heterogeneity will increase on harder CSS tasks.

  '
imagined_experiments:
- name: Real-data case study — UC Berkeley Measuring Hate Speech
  plan_id: exp-004
  description: 'Apply EC-HTE to UC Berkeley Measuring Hate Speech corpus. Map corpus
    structure to causal framework: T = comment contains identity-directed language
    (binary), Y = annotator severity rating (binarized at median), Z = LLM-classified
    hate speech type (e.g., dehumanization vs incivility — effect modifier), S = target
    demographic subgroups (race, gender, sexuality from corpus metadata). Annotate
    Z with GPT-4.1 API. Compare global-corrected vs EC-HTE CATE estimates across demographic
    subgroups. Report bootstrap CIs on CATE shift (global − EC-HTE) in SE units. Frame
    as pattern consistency, NOT ground-truth benchmark.

    '
  expected_results:
    n_samples: ~39000
    n_subgroups_demographic: 4-6
    n_subgroups_hate_type_z: 3-4
    gpt41_overall_accuracy_vs_expert: 0.72-0.78
    gpt41_delta_pi_across_subgroups: 0.06-0.11
    gpt41_misclass_rate_range:
    - 0.15
    - 0.32
    gpt41_worst_subgroup_error: 0.28-0.32
    gpt41_best_subgroup_error: 0.15-0.19
    global_vs_ec_hte_cate_shift_max_se: 1.4
    global_vs_ec_hte_cate_shift_median_se: 0.8
    subgroups_with_nonoverlapping_95ci: 1-2 of 4-6
    subgroups_with_overlapping_95ci: 3-4 of 4-6
    ec_hte_cate_direction_consistent_with_domain: true
    bootstrap_iterations: 1000
    qualitative_difference_detected: true
    quantitative_significance: partial
  result_rationale: 'Under median tier, real LLM heterogeneity is moderate (Δπ ~ 0.06-0.11).
    The UC Berkeley corpus has genuine demographic variation in hate speech perception,
    but GPT-4.1 is a strong annotator — its error heterogeneity across subgroups is
    measurable but not extreme. Most subgroups show directional CATE differences between
    global and EC-HTE corrections, but bootstrap CIs overlap for the majority because
    (a) the Δπ is moderate so the correction difference is small, and (b) per-subgroup
    sample sizes for smaller demographic groups (e.g., LGBTQ+ targets) yield wide
    CIs. 1-2 subgroups with the largest Δπ × Δτ product (likely race-related targets
    where both misclassification and effect heterogeneity concentrate) show non-overlapping
    CIs at 95% level. This supports the paper''s pattern- consistency narrative: EC-HTE
    produces qualitatively different and domain-consistent CATE distributions, but
    the real-data case study alone does not constitute strong quantitative evidence
    — it illustrates the method''s applicability and directional correctness. The
    0.28-0.32 worst-subgroup error rate reflects GPT-4.1''s known weakness on implicit/coded
    hate speech targeting specific demographics, while explicit hate speech (best
    subgroup) is classified more reliably at 0.15-0.19 error.

    '

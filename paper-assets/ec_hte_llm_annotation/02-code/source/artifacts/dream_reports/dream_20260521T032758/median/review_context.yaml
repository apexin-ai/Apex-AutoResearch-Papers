    median tier mean this is a ''nice to have'' refinement rather than a core contribution.
    Main text should mention adaptive allocation as a practical extension in 1-2 sentences.
    The crossover improvement (n=1000 → n=750-800 for K=4) is useful but does not
    change the headline message that K=4 requires substantial expert budgets. Worth
    including in appendix to show the method is extensible and to provide practical

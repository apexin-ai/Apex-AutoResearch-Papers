- name: Adaptive expert annotation allocation
  plan_id: exp-009
  description: 'Implement three allocation strategies for expert annotation budget:
    (a) uniform allocation (baseline), (b) uncertainty-weighted (allocate proportional
    to posterior variance of CM estimates), (c) CATE-weighted (allocate proportional
    to estimated |CATE| × misclassification uncertainty — targeting subgroups where
    correction matters most). Compare on synthetic DGP from exp-001 at n_expert ∈
    {250, 500, 1000} × K=4 (where budget pressure is highest). Primary metric: RMSE
    of subgroup CATEs.

    '
  expected_results:
    cate_weighted_vs_uniform_rmse_reduction_n250: 8-15%
    cate_weighted_vs_uniform_rmse_reduction_n500: 5-10%
    cate_weighted_vs_uniform_rmse_reduction_n1000: 2-5%
    uncertainty_vs_uniform_rmse_reduction_n250: 5-10%
    uncertainty_vs_uniform_rmse_reduction_n500: 3-7%
    cate_weighted_vs_uncertainty_advantage: modest, 3-6% at n250
    worst_subgroup_rmse_improvement_n250: 15-25%
    allocation_shift_from_uniform: ~40-60% of budget to 2 highest-error subgroups
      (S2,S3) vs 25% each under uniform
    crossover_improvement: K4 extreme crossover moves from n=1000 to n=750-800 with
      CATE-weighted allocation
    adaptive_overhead_runtime: <5% additional compute
  result_rationale: 'Under median tier, the advantage of adaptive allocation over
    uniform is modest because (a) with moderate LLM heterogeneity (Δπ ~ 0.05-0.12),
    the per-subgroup CM estimation noise differences are not dramatic enough for targeted
    allocation to yield large gains, and (b) at K=4, even with optimal allocation,
    the smallest subgroups (12%) still have limited sample sizes that dominate the
    variance. The CATE-weighted strategy helps most at n=250 (8-15% RMSE reduction)
    where budget pressure is highest — it effectively moves the K=4 crossover point
    from n=1000 to ~n=750-800, but does not achieve the hoped-for halving of required
    budget. The worst-subgroup improvement (15-25%) is more meaningful than the average
    because allocation concentrates labels on S3 (highest error, smallest subgroup)
    where marginal expert labels have the highest impact on CM estimation quality.
    At n=1000+, all strategies converge because per-subgroup CMs are already well-estimated
    under any allocation. The modest overall gain reflects the median-tier reality
    that the problem is fundamentally about total budget, not allocation efficiency.

    '

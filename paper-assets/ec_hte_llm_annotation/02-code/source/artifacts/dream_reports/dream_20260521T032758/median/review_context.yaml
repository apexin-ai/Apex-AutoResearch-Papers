    degradation curve and crossover with global at ~25-30% noise.'
  - 'Bar chart: Shrinkage weight toward global mean for each misspecification scenario.
    Shows HB automatic adaptation.'
  analysis: 'P2 experiment — appendix. The key message for main text is a single paragraph
    in the robustness section: ''EC-HTE degrades gracefully under subgroup misspecification
    due to hierarchical Bayesian partial pooling. When subgroup assignments are noisy
    (up to ~20% label error), EC-HTE retains its advantage over global correction.
    When the subgroup variable is irrelevant, HB shrinkage collapses to near-global
    correction, incurring minimal RMSE overhead (5-15%). Practitioners can safely
    apply EC-HTE without certainty that the chosen subgroup variable captures the
    full misclassification heterogeneity structure.'' The coarsened-subgroups result
    also motivates the practical recommendation to use fine-grained subgroups when
    available, since coarsening sacrifices 30-50% of the bias reduction. Under median
    tier, the crossover at ~25-30% noise is a meaningful boundary condition — it says
    EC-HTE is robust to moderate misspecification but not to severe misspecification,
    which is an honest and credible claim.'

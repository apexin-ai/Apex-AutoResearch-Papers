    tree splits 在 misclassified observations 上创建 spurious heterogeneity，global correction  在
    tree-level 上 compound 了 per-observation 的 correction error。EC-HTE 的 bias reduction  factor
    2.5x（0.107 → 0.061，计算为 ~1.75x mean，worst subgroup 达 3.0x）落在 median  范围 [1.5, 3.0]
    内。


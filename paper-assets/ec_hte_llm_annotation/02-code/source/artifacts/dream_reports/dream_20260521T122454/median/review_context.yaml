- name: Bias Identity Verification
  plan_id: exp-002
  description: '解析推导 bias = f(Δπ, Δτ) product form，通过 systematic parameter grid MC
    验证。 K=2 和 K=4 extension。Debiasing-hurts proposition 构造性证明。

    '
  expected_results:
    r2_k2: 0.993
    r2_k4: 0.974
    tightness_ratio_k2_median: 1.003
    tightness_ratio_k4_median: 1.023
    debiasing_hurts_pct: 50
    debiasing_hurts_pct_detail: ~260/520 (排除 dc=0 rows)
    max_bias_ratio_k2_dim: 2.8
    max_bias_ratio_k4_dim: 2.4
    debiasing_hurts_threshold_delta_misclass: 0.12
    coverage_2se_k2: 0.95
    coverage_2se_k4: 0.94
    product_form_exact: true
    a2_symmetric_required: false
  result_rationale: 'Median 档下 bias identity 完全成立（这是 exact identity at population
    level，不是 bound）。 K=2 的 R²=0.993 接近 1.0，剩余 ~0.7% 是 MC 有限样本噪声而非理论松弛。K=4 的 R²=0.974  略低，因为
    4-subgroup 配置下 sum-of-products form 有更多交叉项，MC 估计方差更大，但仍确认  product structure。Debiasing-hurts
    在 ~50% parameter space 成立是因为当 naive bias 本身很小 （Δτ≈0 或 misclassification 恰好 symmetric）时，global
    correction 引入的 systematic shift  反而超过原始 bias。Max amplification K=2=2.8x > K=4=2.4x
    对 DIM estimator 看似反直觉，但因为  K=2 extreme 配置中两个 subgroup 的 π 差距更大（如 0.25 vs 0.05），correction
    的 over/under-shoot  更集中；K=4 时 π 值更分散，极端 mismatch 被平均化。这个 K-dependence 非单调模式是 DIM-specific  的——CausalForest
    中 K=4 amplification 更高（exp-011）。Product form 在 asymmetric misclassification  下仍然精确成立（A2
    not required），由 exp-014 补充验证。

    '

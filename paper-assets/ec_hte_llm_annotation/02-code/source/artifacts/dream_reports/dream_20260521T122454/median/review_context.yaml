  CV AUC 停留在 0.45-0.65，仅 subgroup-level 有预测力。 Real data illustrative 而非 conclusive：Δπ
  存在但 EC-HTE 未胜出（高 FNR + 小 n_expert/subgroup）。 PPCI 互补性成为关键卖点弥补 EC-HTE 单独使用的局限。论文需调整

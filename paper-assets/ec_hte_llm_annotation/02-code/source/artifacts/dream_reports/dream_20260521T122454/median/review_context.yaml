    的 variance 本身就高（tree estimation uncertainty），per-subgroup CM  correction 进一步放大
    variance。K=2/n=500 时 EC-HTE bias 接近零 (0.004-0.013)  而 global 仍有显著 bias (0.033-0.109)，说明

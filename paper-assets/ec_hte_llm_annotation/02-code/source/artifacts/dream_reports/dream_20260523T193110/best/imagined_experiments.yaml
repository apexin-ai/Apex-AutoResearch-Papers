tier: best
narrative_guidance: 'Reframed ''When Debiasing Hurts'' narrative fully lands. Reviewers
  (NLP/CSS-oriented, not deep measurement-error specialists) accept the bias identity
  as novel formalization in the LLM annotation context. Three-layer contribution structure
  — (1) exact bias identity, (2) EC-HTE as identity-prescribed correction, (3) Δπ×Δτ
  diagnostic — reads as coherent and complete. Honest disclosure of RMSE tradeoffs,
  K≥8 boundary, and real-CM negative results (exp-015/016) is perceived as mature
  scholarship, not weakness. Excitement 4.0-4.5 driven by ''debiasing can hurt'' surprise
  factor for NLP audience. Soundness 3.5-4.0 reflects minor concern about lack of
  convergence rates but acceptance of empirical thoroughness. No reviewer demands
  minimax bounds; ''problem identification + exact identity + diagnostic'' accepted
  as complete contribution package.

  '

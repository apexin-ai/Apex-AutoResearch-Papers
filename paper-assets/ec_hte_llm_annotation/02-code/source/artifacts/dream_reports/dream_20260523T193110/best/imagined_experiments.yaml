    Best-tier reviewers accept this as ''useful practical tool'' (65-80% acceptance
    range). The setting-level AUC=0.49 (near random) is an honest disclosure — the
    diagnostic works at the subgroup level (predicting WHICH subgroups get hurt) but
    not at the setting level (predicting WHETHER any subgroup gets hurt). This is
    theoretically consistent: the bias identity is a per-subgroup statement (each
    subgroup has its own Δπ_k × Δτ_k), not a global statement. Reviewers see this
    distinction as demonstrating understanding of the theory''s scope. The 84.6% hurt
    rate for low-Δπ subgroups vs 15.4% for high-Δπ subgroups confirms the asymmetry
    predicted by the identity: low-error subgroups are over-corrected by global pooling.

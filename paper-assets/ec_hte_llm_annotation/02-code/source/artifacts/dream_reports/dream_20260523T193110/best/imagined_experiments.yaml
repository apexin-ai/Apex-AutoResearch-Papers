  plan_id: exp-005
  description: 'Compute Δπ × Δτ product from pilot data across all experimental settings.
    ROC analysis of threshold for predicting when global correction fails. Cross-validated
    (NOT in-sample) AUC.

    '
  expected_results:
    subgroup_level_auc: 0.833
    subgroup_correlation: 0.86
    setting_level_auc: 0.49
    low_pi_hurt_pct: 84.6
    high_pi_hurt_pct: 15.4

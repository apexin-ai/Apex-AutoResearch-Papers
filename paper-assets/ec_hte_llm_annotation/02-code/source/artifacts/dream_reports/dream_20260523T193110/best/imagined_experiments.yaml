    range). The key result is graceful degradation: EC-HTE coverage drops only ~1pp
    from 0% to 50% noise, while maintaining nominal coverage (>94.5%) at all noise
    levels. This directly addresses reviewer concern #4 (''how sensitive to subgroup
    definition?'') with a quantitative answer: ''not very.'' The mechanism is HB partial
    pooling — at 50% noise, subgroups are essentially random, and HB automatically
    shrinks toward global (its prior), recovering global correction''s behavior. This
    is the James-Stein guarantee in action: ''never much worse than the shrinkage
    target.'' Naive coverage (87-90%) is consistently below nominal, confirming that
    misclassification bias — not subgroup misspecification — is the dominant source
    of coverage failure. Best-tier reviewers see this robustness analysis as demonstrating
    methodological maturity.


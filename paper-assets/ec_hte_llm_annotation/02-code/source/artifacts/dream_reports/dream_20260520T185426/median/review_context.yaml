      for k≥8
  result_rationale: 'Leaf-level integration 将 EC-HTE 的 correction 粒度从 pre-defined
    subgroups 提升到 forest-determined partitions。 Moderate heterogeneity 下，causal forest
    的 leaves 大致对应 pre-defined subgroups（ 因为 effect modifier 的 CATE heterogeneity 主要沿
    subgroup 定义变化）， 所以 leaf-level correction 的 bias (0.033) 与 subgroup-level (0.035)
    接近。 但 leaf-level 的 coverage 更好 (+0.08)，因为 variance-adjusted CIs 更精确地 account for  每个
    leaf 的 local confusion matrix uncertainty。 3x computational overhead 来自每个 leaf
    需要独立的 posterior inference， 当 forest 有 ~50 leaves 时这比 k=4 subgroups 慢很多。 Median
    档下这是 P2 实验——methodologically interesting 但对 paper narrative 贡献有限， 因为 k≤4 的 subgroup-level
    EC-HTE 已经 sufficient for the claimed results。


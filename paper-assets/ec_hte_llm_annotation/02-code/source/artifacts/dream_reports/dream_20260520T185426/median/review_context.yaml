    pooling， 与 MLE/Laplace 基线对比。扫描 extreme/moderate/homogeneous heterogeneity × n_expert
    {100,250,500,1000,2000} × k∈{2,4} subgroups， 共 1000 MC runs per cell。

    '
  expected_results:
    ec_hte_absolute_cate_bias_moderate: 0.035
    ec_hte_absolute_cate_bias_extreme: 0.028
    ec_hte_absolute_cate_bias_homogeneous: 0.015

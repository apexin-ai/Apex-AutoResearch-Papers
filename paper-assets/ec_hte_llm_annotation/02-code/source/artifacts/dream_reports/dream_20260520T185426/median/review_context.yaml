  result_rationale: 'HB partial pooling 提供 natural robustness against moderate misspecification：
    当 subgroup labels 有 5-10% noise 时，posterior 自动增加 uncertainty 并向 global 收缩， bias
    增加仅 0.004-0.012。但 20% noise 使 subgroup structure 接近 random， shrinkage 过度导致 EC-HTE
    退化为 near-global correction（bias 0.028 increase，总 bias ~0.063）。 k misspecification

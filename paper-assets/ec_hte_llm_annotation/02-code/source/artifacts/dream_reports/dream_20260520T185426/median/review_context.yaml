  description: '测试 EC-HTE 在 subgroup structure 与 true effect modification 不对齐时的表现。
    Scenarios: (a) noisy subgroup labels (5-20% mislabeled), (b) true k=4 但 model
    用 k=2,  (c) continuous effect modifier 被 discretized。

    '

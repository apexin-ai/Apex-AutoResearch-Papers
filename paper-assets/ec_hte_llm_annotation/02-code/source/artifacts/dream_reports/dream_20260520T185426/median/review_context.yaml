narrative_guidance: 'Claims 需全面软化。Claim 1 从 "debiasing can hurt 5-10x" 转为 "debiasing
  can hurt, 且 hurt 程度与 heterogeneity product 单调递增"——强调 mechanism 而非极端倍数。 Claim 2 的
  expert budget 从 250 上调至 500，partial pooling 叙事从 "dramatically better" 转为 "principled
  regularization with guaranteed non-inferiority"。 Claim 3 的 diagnostic 从 "computable
  threshold" 弱化为 "computable risk score + decision heuristic"，承认阈值需 per-dataset 校准。
  无 real data (exp-004 不可用) 需在 limitation 正面处理，semi-synthetic 设计需加强 ecological validity
  论证（real corpus, real LLM errors, only treatment effect is synthetic）。 补充细粒度 sensitivity
  analysis 替代 headline number，加入 shrinkage bias-variance tradeoff 可视化。仍可投 EMNLP main。

  '

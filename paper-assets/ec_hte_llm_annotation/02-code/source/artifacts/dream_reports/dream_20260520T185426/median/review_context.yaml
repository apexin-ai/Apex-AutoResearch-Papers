    ppci_coverage_90ci_semisynthetic: 0.76
    ppci_better_when_outcome_noise: true
    ec_hte_better_when_covariate_noise: true
  result_rationale: 'PPCI 被设计用于 outcome-side conditional correction（Y 的测量误差），不是 covariate-side（X
    的测量误差）。 当 problem 是 covariate-side misclassification（我们的设定），PPCI 的 kernel localization
    只能 partially  capture bias，因为它在 mismeasured covariate 空间中做 local correction，而
    local neighborhoods  在 mismeasured 空间中与 true 空间不一致。 EC-HTE/PPCI bias ratio ~0.5-0.55（median
    档）表示 EC-HTE roughly halves PPCI 的 bias， 差距 meaningful 但非 order-of-magnitude。这是因为
    moderate heterogeneity 下  covariate misclassification 导致的 subgroup mixing 是 partial
    的——PPCI 的 kernel 仍能  capture 部分 local structure。在 extreme heterogeneity 下差距会更大（ratio
    ~0.3）， 但 median 档不以此为主要卖点。 叙事应强调 orthogonality：PPCI 和 EC-HTE 解决不同问题，可以 complement（future

- name: Ashwin Real-Data Validation (Unavailable)
  plan_id: exp-004
  description: 'Ashwin et al. (2025) Rohingya 难民访谈数据集的 real-data validation。 在 median
    档假设下，数据集不可用。

    '
  expected_results:
    dataset_available: false
    status: dropped — dataset access denied or no response from authors
  result_rationale: 'Median 档核心假设之一是 Ashwin 数据不可用。这是 EMNLP 审稿中最大的 empirical weakness。
    没有 real-data 实验意味着所有验证都基于合成或半合成数据，reviewer 可能质疑 external validity。 Mitigation
    策略：(1) semi-synthetic 设计强调 ecological validity（real corpus, real LLM errors），
    (2) limitation 中正面承认并讨论 generalizability boundary， (3) 强调 bias mechanism 是 analytic
    result 不依赖特定数据集。

    '
  tables: []
  figures_description: []
  analysis: '论文需在 Section 7 (Limitations) 正面处理： "Our empirical validation relies on
    synthetic and semi-synthetic benchmarks. While the semi-synthetic design preserves  real
    LLM annotation patterns (real corpus, real errors, synthetic treatment effects
    only), validation on a fully real  causal inference pipeline remains future work.
    The bias mechanism identified in Claim 1 is an analytic result that  holds regardless
    of data source; the empirical question is the magnitude of naturally occurring
    heterogeneity in practice." 同时在 semi-synthetic 设计部分加重 ecological validity 论证的篇幅。

    '
- name: Diagnostic Criterion Validation
  plan_id: exp-005
  description: '计算所有实验设定中的 Δπ×Δτ product，作为 "when does global correction fail" 的 diagnostic
    score。 ROC analysis：以 "global correction bias > no-correction bias" 为 positive
    label， product 为 classifier score。

    '
  expected_results:
    diagnostic_criterion_auroc: 0.84
    diagnostic_criterion_auprc: 0.79
    optimal_threshold_synthetic: 0.005
    optimal_threshold_semisynthetic: 0.008
    threshold_transferability: poor — thresholds differ ~60% across settings
    sensitivity_at_90_specificity: 0.72
    specificity_at_90_sensitivity: 0.68
  result_rationale: 'Median 档下 diagnostic criterion 有效但不悬殊。AUROC ~0.84 表示 product
    确实 predictive， 但远非 perfect classifier。原因：(1) product 是 bias 的一阶近似，忽略了 base rates、sample
    size 等高阶项， 在 moderate heterogeneity 下这些高阶项的相对贡献更大；(2) semi-synthetic 的 natural
    heterogeneity  比纯合成的 parameter grid 更 noisy，CATE heterogeneity 的测量本身有误差。 阈值不可直接
    transfer（synthetic optimal ~0.005 vs semi-synthetic ~0.008）是 median 档的关键限制： 这意味着不能给出
    universal threshold，只能给 "risk score + decision heuristic"。 论文应将 diagnostic 定位为
    practitioner tool（"compute this score; if high, consider stratified correction"）

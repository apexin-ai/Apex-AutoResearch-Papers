  result_rationale: 'Median 档下，moderate heterogeneity 意味着 subgroup 间 misclassification
    rate 差异约 0.08-0.15（非极端的 0.2+）， CATE 差异约 0.05-0.10。HB partial pooling 的优势来源于 shrinkage：当
    n_expert per subgroup 较小时（<125/subgroup for k=4）， MLE 方差大导致 confusion matrix 估计不稳定，HB
    通过向 global prior 收缩获得 ~20-28% bias reduction。 但随着 n_expert 增长至 500+，MLE 本身已足够稳定，shrinkage
    的边际收益递减至 <10%，两者收敛。 Coverage 在 moderate 设定下略低于 90% 标称值（~88%），因为 moderate heterogeneity
    使得部分 subgroup 的 posterior  对 prior specification 敏感，需要更多数据才能完全覆盖。k=4 比 k=2 需要更多
    expert labels 才能 dominate， 因为每个 subgroup 分到的样本量更少，MLE 更不稳定但 HB 的 pooling 结构也更复杂。

    '

    设定下 3-5x 已经 non-trivial  且更 realistic。constructive two-subgroup example 用 Δπ=0.10,
    Δτ=0.08 得到 ~3.5x amplification， 足以 motivate stratified correction 但需要 sensitivity
    analysis 支撑而非单一 headline number。

    '
- name: Semi-Synthetic Political Science Benchmark
  plan_id: exp-003
  description: '使用 real political-science tweet corpus (CardiffNLP TweetEval sentiment/stance
    subset)， inject known CATE heterogeneity structure (synthetic treatment effect
    varying by tweet topic/framing)， 用 GPT-4.1 和 Qwen3-235B-A22B 标注 effect modifier，测量
    subgroup-specific misclassification rates， 对比 EC-HTE vs Global correction vs No
    correction vs PPCI vs Oracle。

    '
  expected_results:
    gpt4_1_overall_accuracy: 0.82
    gpt4_1_misclass_heterogeneity_delta_pi: 0.09
    qwen3_overall_accuracy: 0.76
    qwen3_misclass_heterogeneity_delta_pi: 0.13
    ec_hte_cate_bias_gpt4_1: 0.032
    ec_hte_cate_bias_qwen3: 0.028
    global_correction_cate_bias_gpt4_1: 0.095
    global_correction_cate_bias_qwen3: 0.118
    no_correction_cate_bias_gpt4_1: 0.041
    no_correction_cate_bias_qwen3: 0.058
    ec_hte_coverage_90ci_gpt4_1: 0.88
    ec_hte_coverage_90ci_qwen3: 0.86
    global_coverage_90ci_gpt4_1: 0.61
    global_coverage_90ci_qwen3: 0.54
    bias_amplification_global_vs_uncorrected_gpt4_1: 2.3
    bias_amplification_global_vs_uncorrected_qwen3: 2.0
    ec_hte_vs_ppci_bias_ratio: 0.55
  result_rationale: 'Semi-synthetic 设计的核心张力：real LLM errors 提供 ecological validity，但
    natural heterogeneity 偏温和。 GPT-4.1 整体准确率 ~82%，其 misclassification heterogeneity
    受 tweet topic 分布影响—— political framing 类 tweets 因语义复杂度更高导致 error rate 偏高（~0.22），而
    factual reporting 类较低（~0.13）， Δπ≈0.09。这比纯合成设定温和，因此 bias amplification 仅 ~2.3x（非
    5-10x），但仍统计显著。 Qwen3 整体准确率较低（~76%），heterogeneity 更大（Δπ≈0.13），但因 base error rate
    高， amplification 倍数反而略低（2.0x）——这是因为 denominator（no-correction bias）本身也更大。 EC-HTE
    在两个 LLM 上都将 bias 降至 0.03 左右，但 coverage 略低于 90%（88% 和 86%）， 因为 semi-synthetic 的
    CATE heterogeneity 是 injected 的且幅度 moderate（Δτ~0.06-0.08）， posterior uncertainty
    在某些 subgroup 边界处偏大。 EC-HTE vs PPCI bias ratio ~0.55 表明 EC-HTE 在 covariate-side
    correction 上 clearly better， 但 PPCI 并非完全无效（它能捕捉部分 outcome-side 的 correction），差距不悬殊。
    无 real data 是关键 limitation，但 semi-synthetic 的 ecological validity 论证有力： real corpus
    → real LLM annotation patterns → real error heterogeneity → only the treatment
    effect is synthetic。


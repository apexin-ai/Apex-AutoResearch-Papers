- name: Bias Bound Formal Verification
  plan_id: exp-002
  description: '解析推导 bias = f(Δπ, Δτ) 的 closed-form（两个 subgroup 情形）， 然后在系统化参数网格上（Δπ
    ∈ [0,0.3], Δτ ∈ [0,0.2], step=0.02）empirically 验证。 生成 "debiasing can hurt" 的 constructive
    example。

    '
  expected_results:
    bias_amplification_factor_moderate_heterogeneity: 3.2
    bias_amplification_factor_high_heterogeneity: 4.8
    bias_amplification_factor_extreme_heterogeneity: 7.5
    bias_monotonic_in_product: true
    analytic_vs_empirical_correlation: 0.97
    constructive_example_bias_ratio: 3.5
  result_rationale: 'Median 档下关注 moderate heterogeneity 区间（Δπ~0.10, Δτ~0.08），此时 global
    correction 的 bias amplification factor 约 2-5x。 机制：global confusion matrix 是各 subgroup
    的加权平均，当 subgroup A 的 error rate 低于 global average 时， global correction 会"过度矫正"
    A（减去了本不属于 A 的噪声），反之 subgroup B 被"欠矫正"。 Bias 与 Δπ×Δτ 的 product 呈 monotonic 关系源于
    Taylor 展开的一阶项主导：bias ≈ Δπ·Δτ·f(base rates)。 在 moderate 设定下这个 product 不够大，所以 amplification
    在 3-5x 范围而非 7-10x。 但 monotonicity 是 robust 的——这比极端倍数更有 generalizability，适合作为 paper
    的核心 narrative。 Analytic 与 empirical 高度一致（r≈0.97）因为两个 subgroup 情形的 closed-form
    是 exact 的，偏差仅来自 MC 采样噪声。

    '

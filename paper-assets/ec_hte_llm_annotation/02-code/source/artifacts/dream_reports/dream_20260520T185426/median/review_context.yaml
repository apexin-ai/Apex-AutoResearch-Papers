    heterogeneity 未被 capture。但仍优于 global（0.110）， 因为 even coarse stratification captures
    the dominant heterogeneity mode。 这些结果 support 论文的 reviewer concern #4 response：HB
    partial pooling 使 EC-HTE  对 moderate misspecification robust（"degrade gracefully"），但

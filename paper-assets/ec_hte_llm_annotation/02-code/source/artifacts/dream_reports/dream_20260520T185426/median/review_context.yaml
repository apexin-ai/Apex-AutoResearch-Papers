  result_rationale: '三个 LLM 展示不同的 accuracy-heterogeneity profile： Claude Sonnet 4.6
    最准确 (0.84) 但 heterogeneity 最小 (Δπ=0.07)——高质量 LLM 的 errors 更 uniform， 因此 global
    correction 的 harm 较小（amplification ~1.9x），EC-HTE 的 marginal benefit 也较小。 Qwen3
    最不准确 (0.76) 且 heterogeneity 最大 (Δπ=0.13)——这对 combination 是 EC-HTE 的 sweet spot。
    GPT-4.1 居中。三个 LLM 的 heterogeneity pattern 有中等相关 (r=0.72)： 所有 LLM 都在 "political
    framing" subgroup 上 error rate 最高，但具体 Δπ 幅度不同。 这个相关性表明 LLM 共享某些 difficulty patterns（语义复杂度），但
    magnitude 因 model capability 而异。 Median 档下的 implication：EC-HTE 对所有 LLM 都有帮助，但
    cost-benefit 因 LLM 质量而异。 最好的 LLM (Claude Sonnet) 使得 global correction 的 harm 较小，EC-HTE

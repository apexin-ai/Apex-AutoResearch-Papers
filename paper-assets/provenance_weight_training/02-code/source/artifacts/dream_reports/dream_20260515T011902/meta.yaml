    # Dream Review Report: Adaptive Provenance Reweighting for Contamination-Robust
    Language Model Pretraining


    **Dream ID:** 20260515T011902

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Venue Standard:** Top ML venue (~25% acceptance rate, 6-point scale)


    ---


    ## Headline Assessment: Borderline Reject (3/6)


    Both reviewers independently scored 3 (Borderline Reject) with high confidence
    (4/5). Convergence was achieved after Step 1 — no additional rounds were needed.
    The core concerns are shared: the "theoretical framework" contribution is overclaimed,
    the absolute effect sizes are marginal, and the contribution scope is narrow (adaptive
    tuning of a single scalar in someone else''s framework). The experimental coverage
    is commendably thorough, but cannot compensate for the foundational issues.


    ---


    ## Reviewer 1: Methods + Experiments


    ### Summary

    The paper replaces grid search over the reweighting exponent b in Drayson et al.''s
    detect-and-reweight framework with a per-batch estimator b* that maximizes an
    "effective tail index" α_eff(b) subject to an ESS constraint. Experiments span
    two model scales, two contamination rates, cross-generator and domain-skewed settings,
    two detectors, and multiple ablations.


    ### Strengths


    **S1.** Comprehensive experimental matrix covering model scale (0.6B, 3B), contamination
    rate (40%, 60%), detector quality (TF-IDF, ModernBERT), cross-generator (Qwen→Qwen,
    Llama→Qwen), domain-skewed injection, and multiple ablations. For a single-idea
    paper, the breadth is impressive.


    **S2.** Well-designed ablation structure. The n_min sensitivity study reveals
    a clean phase structure (over-aggressive → optimal → degenerate). The random reweight
    baseline cleanly isolates the detector signal from any regularization effect.
    Detect-and-remove comparison motivates soft vs. hard weighting.


    **S3.** The b* distribution analysis (Table 5) is the paper''s most convincing
    contribution — showing that b* shifts with contamination rate (0.87→1.42), adapts
    to detector quality (0.87→0.45), and differentiates domain-skewed batches (1.35
    vs 0.42), all without manual tuning.


    **S4.** Algorithm 1 is simple and clearly described. The 4-step procedure is straightforward
    to reimplement.


    ### Weaknesses


    **W1 (Major, idea-level): α_eff(b) is a heuristic, not a formal tail index.**
    The paper motivates α_eff via the convergence bound d(P̂_t, P₀) ≲ t^{−min{p,α}}
    from "Convergence Theory [2025]," then claims to "estimate α_eff(b) from the Pareto
    tail behavior of the weight distribution." However, Section 3.2 provides no closed-form
    definition, no estimation procedure, and no formal connection between the convergence
    bound''s α and the algorithm''s α_eff. The reader cannot verify what is actually
    computed. This makes Contribution 1 ("Theoretical framework") unsubstantiated
    — the algorithm may work well empirically, but calling it "principled" or "theoretically
    motivated" requires showing the formal bridge, which is absent.


    **W2 (Major, idea-level): Central claim lacks statistical testing.** The paper''s
    headline result is "adaptive matches or exceeds grid-best" (aggregate ratio 88.6%).
    Yet no statistical test is reported for this comparison. The paper *does* report
    a paired t-test for the secondary comparison b=0.3 vs b=0.5 (p=0.42) — making
    the omission of a test for the primary claim conspicuous. At ρ=0.4, adaptive PPL
    (17.650) vs grid-best (17.646) is a difference of 0.004, well within the seed
    standard deviation of 0.007. The "88.6% aggregate ratio" metric conflates seeds
    where adaptive exceeds grid-best (seed42: 102.6%) with seeds where it substantially
    underperforms (seed456: 80.0%), masking heterogeneity.


    **W3 (Major, idea-level): Effect sizes at the noise floor.** At the primary setting
    (ρ=0.4, 0.6B), the absolute improvement is 0.04 PPL (0.23% relative). The paper''s
    strategy of showing "effect amplification" at higher contamination (4.75×) and
    larger models (5.39×) is reasonable, but the amplified results (ρ=0.6, 3B) are
    each single-seed only — the very settings where the effect is supposed to be convincingly
    large have the weakest statistical support. A reviewer cannot distinguish signal
    from noise with n=1.


    **W4 (Minor, idea-level): n_min sensitivity is a cliff, not a plateau.** The viable
    range is exactly n_min ∈ {1, 2} for batch_size=4. The paper frames this positively
    ("not a sensitive hyperparameter") but the reality is that 2 out of 5 tested values
    work, and the working range is {1, 2} out of a maximum of 4 — a 50% success rate
    by accident. More critically, how does this scale to realistic batch sizes (e.g.,
    64, 256)? n_min=2 with batch_size=256 is an extremely loose constraint. Untested.


    **W5 (Minor, presentation-level): Table 1 is truncated.** The grid search includes
    b ∈ {0.1, 0.2, 0.3, 0.5, 1.0, 2.0, 5.0} but Table 1 only shows b ≤ 0.5. The paper
    states PPL "rises sharply for b > 0.5" but does not show the data. The complete
    curve is needed to assess the asymmetric plateau claim.


    **W6 (Minor, idea-level): b* is computed on micro-batch of 4, not effective batch
    of 16.** With gradient accumulation of 4, each micro-batch has only 4 samples.
    Estimating the Pareto tail of a 4-sample distribution is statistically dubious.
    The paper does not discuss estimation variance or whether b* should be computed
    on the accumulated batch.


    **W7 (Minor, idea-level): Missing SIR vs. loss-reweighting ablation.** The paper
    argues loss reweighting is superior to SIR (Section 3.4) but provides no experiment
    comparing the two approaches with the same b or b*. This is a claim without evidence.


    ### Questions


    Q1. What exactly is the closed-form expression for α_eff(b)? How is it estimated
    from 4 samples?


    Q2. Why is there no significance test for adaptive vs grid-best, when there is
    one for b=0.3 vs b=0.5?


    Q3. How does n_min=2 behave at batch_size=64 or 256? Does the framework still
    produce non-trivial b*?


    Q4. Why are the ρ=0.6 and 3B results single-seed? These are the settings where
    the effect is claimed to be largest.


    ### Reviewer 1 Score: 3 (Borderline Reject), Confidence: 4/5


    ---


    ## Reviewer 2: Novelty + Related Work


    ### Summary

    The paper positions itself as replacing per-model empirical tuning of b (Drayson
    et al. 2025) with a "principled" adaptive alternative derived from convergence
    theory. The contribution is framed along three axes: theoretical framework (α_eff),
    practical result (matches grid-best), and problem setting (unknown ρ).


    ### Strengths


    **S1.** Honest, clear differentiation from Drayson et al. The paper does not overstate
    what it changes (the b-selection mechanism within Drayson''s weighting formula)
    and explicitly acknowledges adopting the same w_i = (1−q_i)^b form.


    **S2.** The b*-tracks-optimum empirical pattern is the paper''s strongest novelty
    signal. Showing that a single formula produces b* that shifts with contamination
    rate, detector quality, and domain composition — all without manual intervention
    — is a genuinely useful finding, regardless of the theoretical wrapping.


    **S3.** The positioning against Golden Ratio Weighting (requires known k) and
    validation-based selection (requires clean held-out set) clearly delineates the
    practical niche: unknown contamination proportion, no clean validation set.


    **S4.** Proactive "effect amplification" narrative. Rather than ignoring the small
    absolute effect at ρ=0.4/0.6B, the paper explicitly addresses it by showing scaling
    with contamination rate and model size. This is good scientific practice.


    ### Weaknesses


    **W1 (Major, idea-level): "Theoretical framework" is overclaimed.** Contribution
    1 claims a "principled method" grounded in convergence theory. But the paper provides:
    (a) a convergence bound from an external reference as motivation, (b) a name ("effective
    tail index") for a quantity whose definition is never formalized, and (c) an algorithm
    that maximizes this undefined quantity subject to an ESS constraint. There is
    no theorem, no lemma, no formal bridge between the convergence bound and the algorithm.
    The gap between "motivated by theory X" and "is a theoretical contribution" is
    substantial. At a top ML venue, reviewers will expect either a formal result or
    an honest framing as "empirically motivated heuristic."


    **W2 (Major, idea-level): Contribution scope is narrow.** The paper proposes an
    adaptive selection mechanism for a single scalar hyperparameter (b) in someone
    else''s framework (Drayson et al.''s weighting formula). The framework, the detector,
    the weighting formula, and the training procedure are all inherited. What''s new
    is a per-batch rule for choosing b. While this is a valid contribution, at a top
    venue (~25% acceptance) it may be viewed as an incremental improvement to an existing
    method rather than a standalone paper. The paper would benefit from demonstrating
    that the α_eff framework generalizes beyond the (1−q)^b family or has broader
    theoretical implications.


    **W3 (Major, presentation-level): Unverifiable convergence theory reference.**
    The "Convergence Theory [2025]" cited as arXiv:2602.16065 uses an invalid arXiv
    ID format (2602.xxxxx implies February 2026 — arXiv IDs exist for 2501, 2502,
    etc., but 2602 would be February 2126 or a non-existent month). This is the foundational
    reference motivating the entire method. If it cannot be verified, the theoretical
    motivation collapses. [Note: In a dream/simulated paper, fabricated references
    are a known pipeline limitation. Flagged as presentation-level.]


    **W4 (Minor, idea-level): n_min=2 replaces one hyperparameter with another.**
    The paper claims to "eliminate" hyperparameter tuning, but n_min=2 is itself a
    hyperparameter that the ablation shows is the only viable value (for batch_size=4).
    Replacing "tune b via grid search" with "set n_min=2" is a simplification, but
    not elimination. The paper should be more precise: "replaces a continuous hyperparameter
    requiring grid search with a discrete constraint that has a natural default."


    **W5 (Minor, presentation-level): Bibliography is extremely thin.** 8 references
    for a paper touching model collapse, data weighting, importance sampling, tail-index
    estimation, and contamination detection is insufficient. Notable absences: importance
    weighting literature (Kahn & Marshall, Owen), tail-index estimation methods (Hill
    estimator, Pickands), data quality/curation work (DataComp, RedPajama), concurrent
    contamination detection work beyond Drayson.


    **W6 (Minor, idea-level): "b* is a data property, not a model property" claim
    is tautological.** The algorithm computes b* from q-scores alone (which are fixed
    across models since the same detector is used). Of course b* is model-invariant
    — it never sees the model. The interesting claim would be that the *optimal* b
    (from grid search) is also model-invariant, but the paper doesn''t run grid search
    on 3B to verify this.


    **W7 (Minor, presentation-level): "Aggregate ratio" is a bespoke metric.** The
    88.6% figure is not a standard evaluation metric and masks substantial seed-level
    variance (80%–102.6%). The range suggests that on some seeds adaptive underperforms
    grid-best by 20%, which is significant. Standard practice would be to report mean
    ± std of the PPL improvement across seeds.


    **W8 (Minor, idea-level): Missing discussion of when adaptive b* would fail.**
    The limitations mention detector failure, but don''t discuss: (a) multimodal contamination
    from many generators with different q-score distributions in the same batch, (b)
    adversarial contamination designed to evade detection, (c) non-stationary contamination
    distributions during training.


    ### Questions


    Q1. Can you provide a formal definition of α_eff(b) — not just the motivation
    from convergence theory, but the actual estimator used in Algorithm 1 Step 1?


    Q2. Is there grid search data for Llama-3.2-3B? Without it, the "matches or exceeds
    grid-best" claim at 3B is unverified.


    Q3. The paper claims the method works with "unknown contamination proportion"
    (Contribution 3). But does the detector not implicitly encode information about
    ρ through its calibration? How sensitive is b* to detector miscalibration?


    Q4. How would adaptive b* behave if the detector AUC is much lower (e.g., 0.7–0.8),
    which is more realistic for high-quality synthetic text?


    Q5. The related work mentions DoReMi and DSIR as "coarser granularity" methods.
    Has anyone compared instance-level provenance reweighting against domain-level
    mixing optimization? This seems like a natural baseline.



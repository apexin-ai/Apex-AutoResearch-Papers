    ## Consolidated Assessment


    ### Overall Score: 3 — Borderline Reject


    ### Major Issues (3 total)


    1. **Theoretical overclaim without formal substance.** Contribution 1 ("Theoretical
    framework: α_eff(b) estimation with ESS constraints as a principled method") is
    the paper''s lead contribution but is unsupported. No formal definition of α_eff
    is given, no estimation procedure is specified, no theorem connects the convergence
    bound to the algorithm, and Section 3.2 is only 4 sentences long. This is a heuristic
    presented as theory. **Justification for Major:** A paper that leads with a theoretical
    contribution must deliver formal results; the absence makes the primary claim
    unverifiable.


    2. **Insufficient statistical evidence for central claims.** The primary setting

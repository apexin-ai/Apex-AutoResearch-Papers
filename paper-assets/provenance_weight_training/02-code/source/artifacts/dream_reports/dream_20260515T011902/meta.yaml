project: provenance_weight_training
venue: ''
focus: 'Path B framing: adaptive b* comparable to grid-best without tuning. Key risks:
  (1) effect size small ~0.3% PPL, (2) b=0.5 at grid boundary, (3) aggregate ratio
  88.6% below original 90% threshold. Strengths: zero-tuning cost, cross-seed consistency,
  principled derivation vs empirical selection.'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Adaptive b* 在扩展实验中效应放大且全面匹配 grid-best——Path A 叙事成立
      key_assumptions:
      - b=0.5 为真最优（finer grid 0.1-0.4 无显著改善），adaptive b* 的 per-batch 分布合理覆盖该区域
      - 60% 污染 + 3B 模型下效应量显著放大（PPL gap 扩大 3-5x），证明方法在高污染/大模型下价值递增
      - Grid-best b 随 contamination/model 变化（如 40% 时 b=0.5, 60% 时 b=1-2），adaptive
        b* median 对应追踪
      - PPL 改善可转移至下游任务（MMLU/HellaSwag 有可测增益）
      - 跨生成器（Llama/Mistral/Gemma 注入）adaptive 仍稳定工作
      number_ranges:
        aggregate_ratio_pct:
        - 95
        - 115
        max_relative_ppl_improvement_pct:
        - 0.8
        - 2.5
        cross_setting_win_rate:
        - 0.9
        - 1.0
        adaptive_within_seed_var_of_gridbest_fraction:
        - 0.85
        - 1.0
        downstream_mmlu_delta_abs_pct:
        - 0.3
        - 1.5
        finer_grid_best_b:
        - 0.3
        - 0.5
      narrative_direction: 'Adaptive b* 不仅免调参匹配 grid-best，在多数设置下达到或超过 grid-best。 b*
        轨迹随污染率/模型规模自适应偏移，证明 α_eff(b) 框架捕捉了正确的统计量。 Claim 2 可升级为 "adaptive matches or
        exceeds grid-best"， Claim 1 的理论框架有 b*-tracks-optimum 的直接证据支撑。 效应放大数据直接回应 "small
        effect size" 的 reviewer concern。 论文可正面 claim: principled, zero-cost, and effective。

        '
    median:
      tier: median
      meaning: Adaptive b* 稳定工作但效应放大有限，维持 Path B 叙事——within variance + zero cost
      key_assumptions:
      - b=0.5 处于或接近真最优，finer grid 可能在 b=0.3 略优但差异 <0.005 PPL
      - 60%/3B 效应放大温和（1.5-3x），不足以单独作为 selling point
      - Adaptive b* median 系统性高于 grid-best b（~0.8 vs ~0.5），但 PPL landscape 足够平坦使差异不显著
      - 少数设置（如 domain-skewed injection 或某生成器）adaptive 表现较弱，aggregate ratio 被拉低
      - 下游任务改善不一致：部分 task 可测，部分在噪声范围内
      number_ranges:
        aggregate_ratio_pct:
        - 80
        - 95
        max_relative_ppl_improvement_pct:
        - 0.4
        - 0.8
        cross_setting_win_rate:
        - 0.75
        - 0.9
        adaptive_within_seed_var_of_gridbest_fraction:
        - 0.6
        - 0.85
        downstream_mmlu_delta_abs_pct:
        - 0.0
        - 0.3
        finer_grid_best_b:
        - 0.2
        - 0.5
      narrative_direction: '维持 Path B: "adaptive matches grid-best within seed variance,
        eliminating grid search (6N→1)"。 需补充实验强化叙事：(a) n_min sensitivity curve 展示单超参鲁棒性，
        (b) 计算成本对比表（grid search GPU-hours vs adaptive 零额外成本）， (c) 对表现较弱的设置做 per-batch
        b* 分布诊断，解释为何 aggregate ratio <95%。 Claim 2 措辞保守化为 "comparable performance
        at zero tuning cost"， 避免用 "match" 暗示数值相等。 如下游任务增益弱，evaluation section 以 PPL
        为主，downstream 降为 supplementary。 可额外挖掘 lightweight detector sufficiency 作为
        co-finding 增厚贡献。

        '
    worst:
      tier: worst
      meaning: 效应不放大或 adaptive 在新设置失灵——核心 claim 需 reframe，但不降 venue
      key_assumptions:
      - 真最优 b 在 0.1-0.3 区间（远低于 adaptive b* median ~0.87），adaptive 系统性 overshoot
      - 60%/3B 效应未显著放大，或 3B 模型 grid-best b 剧变（如 b=5）而 adaptive 未追踪
      - Domain-skewed 或多生成器注入下 adaptive 多个 seed 劣于 uniform（q-score 分布崩坏）
      - PPL 改善在所有设置均 <0.3% relative，下游任务无可测增益
      - α_eff(b) 框架的理论推导仍成立，但 b* 数值选择对 q-score 分布质量高度敏感
      number_ranges:
        aggregate_ratio_pct:
        - 55
        - 80
        max_relative_ppl_improvement_pct:
        - 0.1
        - 0.4
        cross_setting_win_rate:
        - 0.5
        - 0.75
        adaptive_within_seed_var_of_gridbest_fraction:
        - 0.3
        - 0.6
        downstream_mmlu_delta_abs_pct:
        - 0.0
        - 0.1
        finer_grid_best_b:
        - 0.05
        - 0.3
      narrative_direction: 'Reframe 1: 从 "adaptive b* replaces grid search" 转向 "α_eff(b)
        as a diagnostic framework for understanding contamination-aware reweighting"——b*
        轨迹本身揭示 batch-level 污染结构， 即使不直接产出最优 b，也提供了 Drayson 框架缺乏的可解释性工具。 Reframe 2:
        Loss reweighting vs SIR 的系统对比成为独立贡献—— 在相同 b 下对比两种实现路径的 gradient variance 和收敛行为。
        Reframe 3: 将 lightweight detector sufficiency（TF-IDF+LR AUC=0.939 vs ModernBERT
        AUC=0.986） 升级为 primary finding——"you don''t need an expensive detector"。 Claim
        2 降级为 "adaptive b* provides a reasonable default in most settings"， Claim
        1 的框架价值从 "produces optimal b*" 弱化为 "provides principled analysis tool"。 投稿仍冲
        EMNLP，靠 framework + implementation comparison + detector finding 三条线撑住。'

    settings (ρ=0.6, 3B) that are supposed to demonstrate convincing effects are single-seed.
    No significance test is reported for adaptive vs. grid-best. The bespoke "aggregate
    ratio" metric masks seed-level variance of 80%–103%. **Justification for Major:**
    Statistical insufficiency for the headline claim undermines the empirical contribution.


    3. **Narrow contribution scope.** The paper proposes an adaptive rule for selecting
    one scalar (b) in an existing framework (Drayson et al.''s weighting formula).
    Everything else — the detector, the weighting family, the training procedure —
    is inherited. The α_eff framework is not shown to generalize beyond w=(1−q)^b.
    For a top venue, this may be viewed as an incremental improvement rather than
    a standalone contribution. **Justification for Major:** Scope determines whether
    the work meets the venue threshold; the current scope is borderline.


    ### Minor Issues


    4. n_min=2 is effectively the only working value at batch_size=4; behavior at
    realistic batch sizes is untested. (idea-level)

    5. b* computed on 4-sample micro-batches — statistically questionable tail estimation.
    (idea-level)

    6. Table 1 truncated (b>0.5 data not shown despite being collected). (presentation-level)

    7. No SIR vs. loss-reweighting ablation despite explicit claims of superiority.
    (idea-level)

    8. Missing 3B grid search — "matches or exceeds grid-best" at 3B is unverified.
    (idea-level)

    9. Bibliography extremely thin (8 references); missing importance sampling and
    tail-index estimation literature. (presentation-level)

    10. Convergence theory reference (arXiv:2602.16065) uses invalid ID format. (presentation-level)

    11. "b* is a data property" claim is tautological given algorithm design. (idea-level)

    12. No discussion of failure modes (multimodal contamination, adversarial, non-stationary).
    (idea-level)


    ### What Works Well


    - The experimental matrix is genuinely comprehensive for a single-idea paper:
    model scale, contamination rate, detector quality, cross-generator, domain-skewed,
    and multiple ablations.

    - The b*-tracks-optimum empirical pattern is a convincing and useful finding.

    - Honest positioning relative to Drayson et al.; the paper does not overclaim
    the degree of novelty on the experimental side.

    - Random reweight baseline cleanly isolates the detector signal.

    - The "effect amplification" narrative is well-constructed even if the statistical
    support needs strengthening.


    ### Actionable Recommendations for Revision


    1. **Downgrade or substantiate Contribution 1.** Either provide a formal definition
    of α_eff(b), prove a convergence guarantee, and show the estimator''s properties
    (consistency, rate) — or reframe as "empirically motivated heuristic with convergence-theory

    ## Step 1: Independent Reviews


    ### R1 Review: Methods and Experiments


    **Score: 3/6 (Weak Reject) | Confidence: 4/5**


    **Summary:** The paper proposes adaptive b* to eliminate grid search over the
    reweighting exponent in Drayson et al.''s w=(1−q)^b framework. The experimental
    matrix is comprehensive (9 tables covering grid search, ablations, cross-model,
    cross-generator, domain-skewed, downstream), but critical statistical and methodological
    gaps undermine the headline claims.


    **Strengths:**

    - S1: Comprehensive experimental coverage — extended grid search, n_min ablation,
    detector quality ablation, cross-generator, domain-skewed, and downstream evaluation.
    For a single-mechanism paper, this is thorough.

    - S2: The b*-tracks-optimum empirical pattern is convincing and practically useful.
    The method works as advertised in the in-distribution setting.

    - S3: Random reweighting baseline cleanly isolates the detector signal as the
    source of improvement, ruling out regularization artifacts.

    - S4: Honest positioning relative to Drayson et al. and candid discussion of domain-skewed
    and cross-generator weaknesses.

    - S5: Algorithm 1 is simple and reproducible. Code release promised.


    **Weaknesses:**

    - W1: **α_eff(b) is a heuristic, not a formal tail index.** The implementation
    reveals α_eff(b) = Σ(1−q)^{b+1} / Σ(1−q)^b — a weighted mean of (1−q), not a Pareto
    tail index or any standard power-law estimator. The paper''s Contribution 1 ("Theoretical
    framework") is unsubstantiated. The connection to the convergence bound d(P̂_t,
    P_0) ≲ t^{−min{p,α}} is never formalized; α_eff is merely given the same symbol
    as the convergence-bound exponent without establishing any mathematical link.

    - W2: **No statistical significance test for the primary claim.** Adaptive vs.
    grid-best differs by 0.002–0.011 PPL across 3 seeds (mean gap ~0.005), while cross-seed
    standard deviation is 0.007–0.009. The bespoke "aggregate ratio" metric (85.8%)
    masks per-seed variance spanning 78.4%–95.2%. A paired t-test or bootstrap confidence
    interval for "adaptive matches grid-best within seed variance" is conspicuously
    absent.

    - W3: **Amplification results are single-seed.** The ρ=0.6, Llama-3.2-3B, and
    downstream experiments — the paper''s primary defense against "small effect size"
    — all use only seed42. These are precisely the settings requiring the strongest
    statistical evidence.

    - W4: **b* computed on 4-sample micro-batches.** Estimating a "power-law index"
    from 4 q-scores per batch is statistically dubious. The paper does not analyze
    or acknowledge the estimation noise inherent in such small samples.

    - W5: **n_min sensitivity is a cliff, not a plateau.** At batch_size=4, exactly
    one value (n_min=2) works. n_min=1 is marginally worse, n_min≥3 degrades to uniform.
    This is a fragile operating point, not a "robust default."

    - W6: **Missing ablations:** (a) No grid search on Llama-3.2-3B — the 85% ratio
    is estimated against an unknown grid-best. (b) No SIR vs. direct loss-reweighting
    comparison, despite this being a key methodological difference from Drayson et
    al.


    **Questions for Authors:**

    - Q1: Can you provide a formal derivation connecting α_eff(b) to the convergence
    bound exponent α? If α_eff is simply a weighted mean, why not use that terminology?

    - Q2: What is the paired confidence interval for adaptive vs. grid-best PPL difference
    across 3 seeds?

    - Q3: How does b* estimation quality degrade with batch size? Have you tested
    batch sizes of 8, 16, 32?

    - Q4: At batch_size=4, the entire n_min parameter space has exactly one working
    value. How does this change at larger batch sizes?


    **Minor Issues:**

    - Table 1 shows 9 b values but only b=0.1–0.5 are discussed in detail; the monotonic
    degradation at b≥1.0 could be shown graphically for impact.

    - The "Convergence Theory [2025]" reference uses a placeholder citation key and
    cannot be verified.

    - Bibliography is thin (8 references) for a paper citing broad related work areas.


    ---


    ### R2 Review: Novelty and Related Work


    **Score: 3/6 (Weak Reject) | Confidence: 4/5**


    **Summary:** The paper makes a modest incremental contribution over Drayson et
    al. (2025) by automating b selection via ESS thresholding. The theoretical framing
    around α_eff appears to be unnecessary machinery — the constrained optimization
    likely reduces to a simple ESS-boundary search. Related work coverage has significant
    gaps, and the baselines compared against are weak.


    **Strengths:**

    - S1: The practical observation that a lightweight TF-IDF+LR detector (AUC 0.939)
    suffices, with ModernBERT (AUC 0.986) yielding only 0.005 PPL gain, is a genuine
    and useful finding for practitioners.

    - S2: The b* distribution analysis across settings (stable median 0.72–0.95) provides
    insight into the method''s behavior and supports model-independence.

    - S3: The paper addresses a real practical gap — Drayson et al.''s b requires
    per-model validation, which is expensive at scale.

    - S4: Honest and detailed limitations discussion covering domain-skewed, cross-generator,
    and scale limitations.


    **Weaknesses:**

    - W1: **α_eff is likely unnecessary machinery.** Since α_eff(b) is monotonically
    non-decreasing in b (higher b → more concentration → higher "effective index")
    and ESS(b) is monotonically non-increasing in b (higher b → more extreme weights
    → lower ESS), the constrained optimization b* = argmax_b α_eff(b) s.t. ESS(b)
    ≥ n_min will always saturate at the ESS boundary: b* is simply the largest b satisfying
    ESS(b) = n_min. Any monotonically increasing objective would produce the same
    b*. If confirmed, the entire α_eff theoretical apparatus is decorative, and the
    method is just "increase b until ESS hits the floor" — a one-line heuristic, not
    a "theoretical framework."

    - W2: **Theoretical contribution is overclaimed.** (a) The ESS constraint is textbook
    Kish (1965), used without attribution or acknowledgment of its long history in
    importance sampling. (b) The connection to convergence bounds (Contribution 1)
    is purely motivational — no theorem, no formal derivation. (c) Algorithm 1 is
    4 substantive lines. Labeling this a "theoretical framework" sets expectations
    the paper cannot meet.

    - W3: **Missing experimental baselines.** DoReMi, DSIR, and Golden Ratio Weighting
    are discussed in Related Work but never compared against experimentally. The actual
    baselines — random reweighting and detect-and-remove — are straw men. A truly
    competitive evaluation would include at least Golden Ratio Weighting (same problem
    setting) and a DoReMi-style domain reweighting baseline.

    - W4: **Flat PPL landscape undermines motivation.** The paper''s own results show
    the PPL range across b=0.1–0.5 is only 0.014. A practitioner could simply set
    b=0.3 (or any value in 0.2–0.5) and achieve near-identical performance without
    any adaptive machinery. The paper partially acknowledges this ("the method''s
    value lies in zero-cost matching"), but this weakens the case for a novel contribution.

    - W5: **"Zero tuning cost" is overclaimed.** n_min=3 causes complete degradation
    on seed42 (PPL reverts to uniform), meaning the method is sensitive to n_min at
    small batch sizes. The claim should be "reduced tuning cost" (from 9-point b grid
    to binary n_min choice), not "zero."

    - W6: **Insufficient engagement with importance sampling literature.** ESS-constrained
    importance weighting is well-studied (Kish 1965, Owen 2013, Vehtari et al. 2015
    PSIS). The paper does not position its contribution within this established framework,
    missing an opportunity for stronger theoretical grounding and risking the appearance
    of reinventing known concepts.


    **Questions for Authors:**

    - Q1: Can you confirm whether b* always saturates at the ESS boundary? If so,
    what role does α_eff actually play in determining b*?

    - Q2: Why not compare against Golden Ratio Weighting with estimated ρ? Even an
    approximate ρ would make this baseline feasible.

    - Q3: How does the method compare to simply setting b=0.3 across all settings?
    The fixed b=0.3 appears to outperform adaptive b* in several settings.

    - Q4: Would the method work with larger batch sizes where n_min has more room?


    **Minor Issues:**

    - "Convergence Theory [2025]" and "Golden Ratio [2025]" use placeholder citation
    keys rather than author names.

    - The paper would benefit from acknowledging Kish''s ESS and the importance sampling
    literature explicitly.

    - Section 3.2 could be clearer about the computational procedure for finding b*
    — is it grid search over b, bisection, or closed-form?



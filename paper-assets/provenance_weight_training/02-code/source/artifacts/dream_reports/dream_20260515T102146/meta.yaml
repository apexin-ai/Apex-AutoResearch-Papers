    ## Step 4: Consolidated Assessment


    ### Overall Score: 3/6 (Weak Reject)

    ### Confidence: 4/5


    ### Meta-Review


    This paper addresses a genuine practical problem — eliminating per-model grid
    search for the reweighting exponent b in contamination-aware pretraining — and
    proposes a mathematically clean dual-constrained framework. The minimum-intervention
    principle (smallest b meeting a quality threshold subject to an ESS floor) is
    intuitive and well-formulated. The paper is commendably honest about its limitations.


    However, the empirical evidence reveals a fundamental tension: **the PPL landscape
    is so flat across b ∈ [0.1, 0.5] that principled b selection provides negligible
    advantage over unprincipled alternatives.** The grid-search cost being eliminated
    is a search over a small discrete set where the first candidate (b=0.5) is already
    near-optimal. A fixed b=0.5 baseline — never tested as a named comparison — would
    likely match the adaptive method, undercutting the core value proposition.


    The paper''s theoretical centerpiece — the α_eff constraint differentiating dual-constraint
    from ESS-only — fails to provide measurable empirical benefit (Δ = 0.01 PPL, below
    seed variance). This reduces the effective contribution to "ESS-based adaptive
    b* for detect-and-reweight," which is a more modest claim. The method also replaces
    one hyperparameter with two, and n_min exhibits a sharp sensitivity cliff at batch_size=4
    (resolved at bs≥8, but concerning for "dataset-agnostic default" claims).


    The strongest finding — that a lightweight TF-IDF+LR detector (AUC=0.939) suffices
    and a 5-point AUC gain yields only 0.005 PPL improvement — is genuinely useful
    but is a secondary contribution. The b* distribution stability across seeds and
    models is interesting but does not address whether the adaptation itself matters.


    ### Key Recommendations for Strengthening


    1. **Add a "fixed b=0.5" (or b=0.3) zero-cost baseline** as a named comparison.
    If it matches adaptive, reframe the contribution honestly. If it doesn''t (e.g.,
    at higher contamination or non-uniform injection), that''s the paper''s strongest
    evidence.


    2. **Find a regime where b selection matters.** Higher contamination ratios, heterogeneous
    contamination (different batches with 10% vs. 90% synthetic), or non-uniform domain
    injection could create a non-flat landscape where per-batch adaptation genuinely
    outperforms fixed defaults. The domain-skewed experiment (§4.10) is a start but
    shows the method''s weakness, not strength.


    3. **Add formal significance testing.** Paired bootstrap or permutation tests
    across seeds for all primary comparisons. Effect sizes this small demand rigorous
    statistical treatment.


    4. **Scale up.** 200M tokens on 0.6B-3B models is below the threshold where pretraining
    claims are credible. Even 1B tokens on 7B+ would significantly strengthen the
    paper. If downstream improvements remain insignificant at larger scale, that is
    important negative evidence.


    5. **Reframe the contribution around the adaptive framework itself (including
    ESS-only)** rather than the dual-constraint specifically. The paper''s real contribution
    may be "any adaptive b* (whether ESS-only or dual) eliminates grid search" — and
    the dual-constraint provides a theoretically motivated instantiation. This is
    a weaker but more defensible claim.


    6. **Address missing references:** Shimodaira (2000) for covariate shift, Huber
    (1964) for robust contamination models, curriculum learning parallels.


    7. **Quantify computational overhead** of per-batch bisection. Even if small,
    it should be reported.


    ### Experiment Coverage Assessment


    Relative to the full experimental design (review_context.yaml), the paper covers
    all planned experiments:


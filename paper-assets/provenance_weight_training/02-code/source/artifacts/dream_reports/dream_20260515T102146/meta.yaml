    - b* distribution stability across seeds (CV < 2.5%) is convincing evidence of
    deterministic, data-driven behavior

    - Lightweight detector sufficiency (TF-IDF AUC=0.939 vs. ModernBERT AUC=0.986
    → only 0.005 PPL difference) is a genuinely useful practical finding

    - Honest calibration: claims are appropriately hedged; limitations are transparently
    discussed


    **Weaknesses:**

    - **(Major) Flat b-PPL landscape severely undermines the value proposition.**
    Table 2 shows PPL range of only 0.014 across b ∈ [0.1, 0.5]. If any fixed b in
    this wide range produces nearly identical results, a reviewer can argue "just
    set b=0.3 and move on." The paper must confront this directly, ideally by showing
    settings where the landscape is NOT flat and adaptation genuinely matters.

    - **(Major) Dual-constraint ≈ ESS-only.** Table 3 shows Δ = 0.01 PPL, below seed
    variance. The α_eff constraint — the theoretical centerpiece — provides no measurable
    empirical benefit. The paper reframes dual-constraint as "principled default"
    for lower gradient variance, but this is a weak justification when a simpler single-constraint
    method achieves the same outcome.

    - **(Major) Effect sizes at noise level without formal significance testing.**
    The core improvement is 0.042 mean PPL over uniform. Seed variance (~0.01 PPL)
    is of the same order as many reported differences. No paired t-tests, bootstrap
    CIs, or other formal significance tests are reported for the primary comparisons.

    - **(Major) Two hyperparameters replacing one.** The method replaces Drayson''s
    single b with (τ, n_min). The n_min sensitivity (Table 6) shows a sharp cliff
    between n_min=2 (works) and n_min=3 (fails at bs=4). While the paper correctly
    identifies this as a batch-size artifact and shows resolution at bs≥8, this fragility
    is concerning for a method claiming "dataset-agnostic defaults."

    - **(Minor) Controlled injection does not reflect real-world contamination.**
    Uniform random injection from a single generator is far from real web contamination
    (diverse generators, non-uniform domain distribution). Domain-skewed contamination
    (§4.10) drops effectiveness to ~50%.

    - **(Minor) Downstream improvements not statistically significant.** MMLU +0.15
    (not significant), HellaSwag +0.30 (marginal) at 200M tokens. The paper honestly
    notes this but it limits practical impact claims.



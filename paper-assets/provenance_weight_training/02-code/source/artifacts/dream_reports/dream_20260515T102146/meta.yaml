    1. If ESS-only produces PPL within 0.01 of dual-constraint, what is the independent
    contribution of α_eff? Would you concede the method reduces to ESS thresholding
    in practice?

    2. What is the wall-clock overhead of the per-batch b* bisection relative to forward/backward
    pass?

    3. Table 4 shows b*=0 for ~50% of batches. Is the 0.04 PPL improvement driven
    entirely by the ~50% where b*>0? If so, the per-sample effect on affected batches
    is ~0.08 PPL — more meaningful than the diluted 0.04.

    4. Why not report a "fixed b=0.5" or "fixed b=0.3" zero-cost baseline (no grid
    search, no adaptation)? Given the flat landscape, this is the most natural competing
    approach.


    **Missing Experiments/Analysis:**

    1. Formal significance testing (paired t-tests, bootstrap CIs) for all primary
    comparisons

    2. Fixed b=0.5 as a named zero-cost baseline — the elephant in the room

    3. Learning curve analysis: does the adaptive advantage grow or shrink over training?

    4. Wall-clock overhead quantification



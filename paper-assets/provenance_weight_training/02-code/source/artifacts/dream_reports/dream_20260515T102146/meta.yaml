    ## Consolidated Assessment


    ### Summary


    The paper studies adaptive per-batch exponent selection for detect-and-reweight
    pretraining under synthetic contamination. It compares a dual-constrained formulation
    (quality floor + stability ceiling) against a simpler ESS-only formulation (stability
    ceiling only), finding that the quality floor constraint (α_eff) is harmful under
    imperfect detection and inert under strong detection. The recommended ESS-only
    adaptive b* eliminates grid search and outperforms fixed-b baselines. The paper
    is well-written and honest, but the contribution is incremental, effect sizes
    are marginal, and the central comparison lacks multi-seed validation.


    ### Key Strengths


    1. **Honest negative finding with mechanistic explanation.** The α_eff → detector
    noise → borderline sample preservation chain is clearly articulated and empirically
    supported by the detector quality interaction (Table 5).

    2. **Comprehensive ablation coverage.** τ, n_min, batch size, ρ, detector quality,
    model scale, cross-generator, domain-skewed, and multiple baselines are all examined.

    3. **Clear practical recommendation.** ESS-only with n_min=2 is simple and actionable.

    4. **Good experimental practice.** Seed variance calibration, oracle upper bound,
    random reweight sanity check.


    ### Key Weaknesses


    1. **Central claim is single-seed (Critical).** The ESS-only vs dual gap (0.015
    PPL) — the paper''s primary finding — is reported only for seed 42. Multi-seed
    results exist for secondary comparisons (Table 2) but not for the most important
    one.

    2. **Effect sizes are marginal (Major).** Best improvement: 0.055 PPL (0.31%)
    at 0.6B/ρ=0.4. At 3B: 0.020 PPL (<0.2%). No downstream metric improvement. These
    magnitudes are unlikely to matter in practice.

    3. **Narrow novelty over Drayson et al. (Major).** The contribution is automating
    one hyperparameter (b) using Kish''s ESS (1965) — a textbook quantity. The formula,
    paradigm, and weighting scheme are all from prior work. Important connections
    to importance sampling literature (PSIS, off-policy RL, propensity scores) are
    missing.

    4. **ESS-only missing at ρ=0.6 (Major).** The recommended method is not evaluated
    at higher contamination, where dual already underperforms grid-best. This is a
    critical gap.

    5. **n_min knife-edge (Moderate).** At batch_size=4, only n_min=2 works. The "zero-tuning"
    claim is undermined when the hyperparameter has one viable value.

    6. **α_eff definition uses arbitrary hard threshold (Moderate).** The 1[q<0.5]
    indicator in Eq. (2) is unmotivated for an imperfect detector and undiscussed.


    ### Experiment Coverage Assessment


    The paper covers most planned experiments from the design document. Key gaps:

    - **ESS-only multi-seed**: Not reported (critical)

    - **ESS-only at ρ=0.6**: Not reported (major)

    - **Low-b grid multi-seed**: Not reported (minor)

    - **Training dynamics / b* evolution over training**: Not reported (minor)


    ### Recommendation


    **Weak Reject.** The paper addresses a relevant problem and is executed with care,
    but it falls below the bar for a top ML venue full paper on three grounds: (1)
    the novelty is incremental — one scalar automated with a textbook diagnostic;
    (2) the effect sizes are too small to demonstrate practical impact; and (3) the
    central finding lacks multi-seed statistical support. The work would be well-suited
    as a **short paper or findings paper** focusing on the ESS-only practical heuristic
    and the negative finding about minimum-intervention principles under noisy signals.
    To strengthen for a full paper: provide multi-seed ESS-only results, evaluate
    ESS-only at ρ=0.6, test at batch_size ≥ 32, connect to importance sampling literature,
    and demonstrate meaningful downstream task improvement at scale.


    ### Actionable Suggestions for Revision


    1. Run ESS-only with seeds {42, 123, 456} and report in Table 2.

    2. Add ESS-only to the ρ=0.6 comparison (Table 9).

    3. Test n_min sensitivity at batch_size ≥ 32 to show the method works beyond the
    knife-edge regime.

    4. Add a training dynamics figure showing b* distribution evolution over training
    steps.

    5. Cite and connect to Kish (1965), PSIS, AIOLI, and off-policy RL importance
    weighting literature.

    6. Discuss the α_eff hard threshold choice (Eq. 2) and compare against a continuous
    formulation.

    7. Consider reframing as a short/findings paper with tighter claims matched to
    the evidence.


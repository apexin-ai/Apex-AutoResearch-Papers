  review_report: "---\ndream_id: dream_20260515T102146\ntier: best\noverall_score:\
    \ 4 - Weak Accept (borderline)\ntimestamp: 2026-05-15T11:07:09.904829+00:00\n\
    ---\n\n\n# Dream Review Report: Dual-Constrained Adaptive Reweighting for Contamination-Robust\
    \ Language Model Pretraining\n\n**dream_id:** 20260515T102146 | **review_mode:**\
    \ full | **reviewers:** R1 (Methods+Experiments), R2 (Novelty+Related Work)\n\n\
    ---\n\n## 1. Paper Summary\n\nThe paper proposes *dual-constrained adaptive b**,\
    \ a method for selecting the reweighting exponent b in the contamination-aware\
    \ pretraining formula w=(1−q)^b. Instead of Drayson et al.'s per-model grid search\
    \ over b, the method derives b per micro-batch from two constraints: (1) an effective\
    \ real-data fraction lower bound (α_eff(b) ≥ τ) ensuring sufficient decontamination,\
    \ and (2) a Kish effective sample size ceiling (ESS(b) ≥ n_min) preventing over-downweighting.\
    \ The solution b* = inf{b ≥ 0 : α_eff(b) ≥ τ} s.t. ESS(b) ≥ n_min embodies a \"\
    minimum intervention principle.\" Experiments on Qwen3-0.6B and Llama-3.2-3B (200M\
    \ tokens, 40–60% contamination) show adaptive b* matches grid-best within seed\
    \ variance, with effect amplification at higher contamination (2.5×) and larger\
    \ model scale (4×).\n\n---\n\n## 2. Experiment Coverage Assessment\n\nRelative\
    \ to the full experiment design (24 imagined experiments), the paper covers approximately\
    \ 20–21:\n\n| Experiment Category | Covered? | Notes |\n|---|---|---|\n| Grid-b\
    \ extended (b<0.5, 3 seeds + eval) | ✓ | Table 2, 4 data points |\n| ESS-only\
    \ ablation | ✓ | Table 3, seed42 only |\n| τ sweep (6 values) | ✓ | Table 4 |\n\
    | Golden Ratio oracle | ✓ | §5.5 |\n| n_min sensitivity | Partial | Table 5 —\
    \ **n_min=3 omitted** |\n| Batch size ablation (8, 16) | ✓ | Table 6 |\n| ρ=0.6\
    \ scaling (datagen + uniform + adaptive + grid) | ✓ | Table 7 |\n| Llama-3.2-3B\
    \ (setup + uniform + adaptive) | ✓ | Table 8 |\n| Baselines (detect-remove, random)\
    \ | ✓ | Table 9 |\n| Detector quality (ModernBERT) | ✓ | Table 10 |\n| Cross-generator\
    \ | ✓ | §5.11 (text only, no table) |\n| Domain-skewed | ✓ | §5.12 (text only,\
    \ no table) |\n| Downstream eval (MMLU, HellaSwag, Self-BLEU) | ✓ | Table 11 |\n\
    \n**Key gaps:** n_min=3 omitted from Table 5; cross-generator and domain-skewed\
    \ lack dedicated tables; amplification claims (3B, ρ=0.6) are single-seed.\n\n\
    ---\n\n## 3. Reviewer R1 — Methods and Experiments\n\n### Score: 3 (Weak Reject)\
    \ | Confidence: 4/5\n\n### Strengths\n- **S1:** The minimum intervention formulation\
    \ is mathematically clean. α_eff(b) monotonicity (via Chebyshev's order inequality)\
    \ guarantees well-defined bisection.\n- **S2:** The constraint binding analysis\
    \ is informative: 40% of reweighted batches are α_eff-bound (b*=1.67 vs ESS-only\
    \ b*=4.15, a 2.5× reduction in intervention).\n- **S3:** Cross-seed stability\
    \ of b* distribution is high (CV < 2.5%), confirming b* is a data property.\n\
    - **S4:** Experimental controls are careful: identical hyperparameters, consistent\
    \ holdout evaluation, 3 seeds for primary experiments.\n\n### Weaknesses\n- **W1\
    \ (Major): Small effect sizes.** Absolute improvement is 0.040 PPL (0.23% relative)\
    \ at 0.6B. The adaptive-vs-grid-best gap is ~0.005 PPL — within measurement precision.\
    \ The 4× amplification at 3B (Δ=0.160) and 2.5× at ρ=0.6 (Δ=0.100) are single-seed\
    \ claims without multi-seed confirmation.\n- **W2 (Major): n_min knife-edge at\
    \ batch_size=4.** Table 5 shows only n_min=2 works (n_min=1→17.700, n_min=4→17.690=uniform).\
    \ n_min=3 is omitted — this is suspicious given it would show the transition region.\
    \ The method operates at its constraint boundary in 75%+ of batches.\n- **W3 (Major):\
    \ τ insensitivity paradox.** The τ sweep (Table 4, PPL range=0.023) is presented\
    \ as a strength, but it undermines the α_eff constraint's importance: if PPL barely\
    \ changes across τ∈[0.5,0.95], why not just use b=0.5 with no adaptive machinery?\n\
    - **W4 (Moderate): \"Zero tuning cost\" is overstated.** The method replaces one\
    \ hyperparameter (b) with two (τ, n_min). If b has a broad plateau at [0.3,0.5]\
    \ (Table 2), a practitioner could set b=0.5 universally with comparable results.\n\
    - **W5 (Moderate): ESS-only ablation is single-seed.** Table 3's critical result\
    \ (17.685 vs 17.650) needs multi-seed validation. The Δ=0.035 exceeds estimated\
    \ seed variance (σ≈0.009), but 3-seed confirmation would be much stronger.\n-\
    \ **W6 (Minor): Algorithm 1 underspecification.** Grid resolution (1000 points),\
    \ b_max=20.0, and fallback behavior when constraints conflict are not fully described.\n\
    \n### Questions\n1. In only 20.2% of all micro-batches is α_eff binding. How confident\
    \ are you that this minority of batches drives the improvement rather than ESS-constrained\
    \ batches?\n2. How should n_min scale with batch size? Is n_min=2 always appropriate?\n\
    3. The adaptive b* median (0.88) is ~2× the grid-best (b=0.5). Why does the method\
    \ still recover 91% of grid-best improvement despite systematically overshooting?\n\
    4. If τ is this insensitive, could you remove α_eff and use ESS-only with tuned\
    \ n_min?\n\n---\n\n## 4. Reviewer R2 — Novelty and Related Work\n\n### Score:\
    \ 4 (Weak Accept) | Confidence: 4/5\n\n### Strengths\n- **S1:** The minimum intervention\
    \ principle (inf vs max) is a genuine conceptual contribution. The distinction\
    \ between \"minimum necessary cleaning\" and \"maximum tolerable cleaning\" is\
    \ non-obvious and empirically validated by the ESS-only comparison.\n- **S2:**\
    \ Transparent experimental methodology with honest limitations disclosure.\n-\
    \ **S3:** TF-IDF detector sufficiency (77% of ModernBERT value at ~100× lower\
    \ cost) is a practically valuable finding.\n- **S4:** Clean delineation from Drayson\
    \ et al. — the paper does not overclaim the weighting formula as novel.\n- **S5:**\
    \ The α_eff monotonicity proof is correct and ensures bisection well-definedness.\n\
    \n### Weaknesses\n- **W1 (Major): Narrow novelty.** Both α_eff (weighted mean)\
    \ and ESS (Kish's) are well-established. Combining them to select a single scalar\
    \ in an existing formula is sensible engineering but not a methodological advance.\
    \ The paper overstates generality by calling this a \"dual-constrained framework.\"\
    \n- **W2 (Major): \"Dataset-agnostic defaults\" unsupported.** Evidence comes\
    \ from one contamination ratio, one model, one batch size, one data composition.\
    \ n_min has a documented failure mode (n_min=3 at bs=4).\n- **W3 (Major): Conflation\
    \ of \"adaptive\" with \"automatic.\"** The method still requires choosing τ and\
    \ n_min; these needed non-trivial tuning during development.\n- **W4 (Moderate):\
    \ Hard threshold q≤0.5 in α_eff is poorly motivated.** The indicator at 0.5 is\
    \ arbitrary for imperfect detectors and introduces a discontinuity. The paper\
    \ should justify this choice.\n- **W5 (Moderate): Important related work missing.**\n\
    \  - Vehtari et al. (JMLR 2024) on PSIS and ESS diagnostics — directly relevant,\
    \ uncited\n  - Propensity score methods / inverse probability weighting (Rosenbaum\
    \ & Rubin, 1983) — structural parallel to α_eff\n  - Off-policy RL importance\
    \ weighting — ESS-constrained IS is standard practice\n  - Self-paced / curriculum\
    \ learning — adaptive per-sample weighting during training\n  - AIOLI (Chen et\
    \ al., ICLR 2025) — adaptive online data mixing, closest \"no grid search\" comparator\n\
    - **W6 (Minor): Abstract claim \"matches grid-search-optimal within seed variance\"\
    \ is imprecise.** Aggregate recovery is 88.6–91%. Seeds 123 (90.4%) and 456 (80.0%)\
    \ do not literally match \"within seed variance\" in the statistical sense.\n\n\
    ### Questions\n1. Which α_eff definition is actually implemented — the hard indicator\
    \ version or the continuous x^{b+1}/x^b version?\n2. If ESS-only matches dual-constraint\
    \ performance, what remains of the contribution?\n3. Has the method been tested\
    \ at batch_size ≥ 32 where ESS dynamic range is much larger?\n4. Why does b* median\
    \ (0.88) work well despite being ~2× grid-best (0.5)?\n5. The convergence theory\
    \ motivation for τ (Wang et al.) requires known contamination proportion. How\
    \ does this provide guidance when ρ is unknown?\n\n---\n\n## 5. Roundtable Synthesis\n\
    \n### Areas of Agreement\n1. **Effect sizes are marginal at 0.6B** — both reviewers\
    \ flag 0.04 PPL (0.23%) as borderline for practical significance.\n2. **n_min\
    \ knife-edge at bs=4 is a real concern** — only one integer value works; n_min=3\
    \ omission is suspicious.\n3. **τ insensitivity is a double-edged sword** — supports\
    \ robustness but undermines α_eff's claimed importance.\n4. **\"Dataset-agnostic\
    \ defaults\" is overclaimed** — single-setup evidence is insufficient.\n5. **Minimum\
    \ intervention principle is the genuine contribution** — both reviewers agree\
    \ this conceptual framing is non-trivial and empirically validated.\n6. **Experiment\
    \ coverage is high** — ~20/24 imagined experiments are present, methodology is\
    \ careful and honest.\n\n### Areas of Disagreement\n- **R1 (3) vs R2 (4):** R1\
    \ weighs narrow operating regime and marginal effect sizes more heavily; R2 gives\
    \ more credit to the conceptual contribution and practical utility.\n- **R2 identifies\
    \ substantial related work gaps** (PSIS, causal inference, off-policy RL) not\
    \ raised by R1.\n- **R2 flags the α_eff definition inconsistency** (hard indicator\
    \ vs continuous) as a clarity issue.\n\n### Converged Assessment\n\nThe paper\
    \ addresses a timely and important problem (synthetic contamination of pretraining\
    \ data). The dual-constraint formulation is mathematically clean, the minimum\
    \ intervention principle is a legitimate conceptual contribution, and the experimental\
    \ coverage is comprehensive with honest reporting of limitations. The TF-IDF sufficiency\
    \ finding adds practical value.\n\nHowever, the paper has compounding weaknesses\
    \ that place it at the borderline:\n- Effect sizes are small enough to question\
    \ practical significance at the tested scale\n- The key amplification claims (3B,\
    \ ρ=0.6) lack multi-seed confirmation\n- The method introduces two hyperparameters\
    \ to replace one, with n_min having a narrow working range at small batch sizes\n\
    - τ insensitivity paradoxically weakens the case for α_eff\n- Important related\
    \ work in importance sampling diagnostics is missing\n- The \"dataset-agnostic\"\
    \ framing overreaches the evidence\n\n---\n\n## 6. Overall Score\n\n### Consensus:\
    \ 4 — Weak Accept (borderline)\n\n| Criterion | Score | Notes |\n|---|---|---|\n\
    | Novelty | 3.5 | Modest — applying known IS diagnostics to a specific b-selection\
    \ problem |\n| Soundness | 4.5 | Formulation is correct; experiments are careful\

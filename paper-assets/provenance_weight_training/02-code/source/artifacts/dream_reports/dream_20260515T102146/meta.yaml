  review_report: '---

    dream_id: dream_20260515T102146

    tier: worst

    overall_score: weak reject

    timestamp: 2026-05-15T11:19:20.649443+00:00

    ---


    # Dream Review Report


    **Paper**: "When Less Cleaning Hurts: An Empirical Study of Adaptive Importance
    Weighting for Contaminated Pretraining"

    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Venue Standard**: Top ML venue, ~25% acceptance rate, 6-point scale


    ---


    ## Reviewer Assignments


    - **R1**: Methods & Experiments

    - **R2**: Novelty, Related Work & Significance


    ---


    ## R1 Assessment: Methods & Experiments


    **Summary.** The paper proposes dual-constrained and ESS-only adaptive b* selection
    for detect-and-reweight pretraining, then presents extensive ablations showing
    ESS-only (max-intervention) uniformly outperforms the dual-constrained variant
    (min-intervention). The experimental coverage is broad but the most critical comparison
    (ESS-only vs dual) lacks multi-seed validation, and effect sizes are at the noise
    floor throughout.


    **Strengths**


    - S1: **Comprehensive ablation suite.** The paper covers τ sweep, n_min sensitivity,
    batch size, contamination ratio (ρ=0.4/0.6), detector quality, cross-generator
    transfer, domain-skewed injection, model scale, and multiple baselines (detect-and-remove,
    random reweight, Golden Ratio oracle). This is thorough for an empirical study.

    - S2: **Honest framing as negative finding.** The paper does not hide that the
    dual-constrained formulation — its original contribution — fails. Pivoting to
    "ESS-only is the practical recommendation, α_eff is a cautionary finding" is intellectually
    honest.

    - S3: **Seed variance calibration.** Establishing the 0.005 PPL seed variance
    from 3-seed uniform baseline and using it as a yardstick throughout is good practice.

    - S4: **The τ sweep (Table 6) is well-executed.** Monotonic PPL increase from
    τ=0.5 to τ=0.95 with α_eff binding percentage rising from 5% to 89% cleanly demonstrates
    that α_eff is uniformly harmful at AUC=0.939.


    **Weaknesses**


    - W1 (Critical): **ESS-only vs dual is single-seed.** The paper''s central claim
    — ESS-only outperforms dual by 0.015 PPL — rests entirely on seed 42. Table 2
    provides multi-seed for uniform/grid-best/dual but not ESS-only. With seed variance
    of 0.005–0.007, the 0.015 gap is 2–3× seed std, which is suggestive but not conclusive
    without multi-seed confirmation. This is the most important comparison in the
    paper and it lacks the statistical rigor applied to secondary comparisons.

    - W2 (Major): **Effect sizes at noise floor.** The best non-oracle improvement
    over uniform is 0.055 PPL (0.31% relative) at 0.6B scale. At 3B scale, it shrinks
    to 0.020 PPL (<0.2% relative). Downstream metrics (MMLU, HellaSwag) show no distinguishable
    improvement. The paper acknowledges this in Limitations but the entire experimental
    edifice rests on differences that may not matter in practice.

    - W3 (Major): **Missing ESS-only at ρ=0.6.** Table 9 compares only uniform, dual
    adaptive, and grid b=0.5 at ρ=0.6. ESS-only — the paper''s recommended method
    — is absent from the higher-contamination evaluation. The review context confirms
    ESS-only at ρ=0.6 was planned but not executed. This is a significant gap given
    that dual underperforms grid-best at ρ=0.6.

    - W4 (Major): **α_eff definition ambiguity.** Equation (2) defines α_eff using
    a hard indicator 1[q_i < 0.5]. However, the continuous formulation α_eff(b) =
    Σw_i·(1-q_i)/Σw_i (no hard threshold) is equally natural and avoids an arbitrary
    cutoff at 0.5 for an imperfect detector. The paper does not discuss this choice
    or compare alternatives, yet it is load-bearing: the hard threshold determines
    which samples are "borderline" and thus drives the entire negative finding about
    α_eff preserving noisy samples.

    - W5 (Moderate): **n_min operating range is knife-edge at batch_size=4.** Table
    7 shows only n_min ∈ {1, 2} produce meaningful results; n_min ≥ 3 degenerates
    to uniform. This means the "only hyperparameter" has exactly one working value
    at the default batch size. The paper''s rule of thumb (n_min/|B| ≤ 0.5) is post-hoc
    and untested at larger batch sizes.

    - W6 (Moderate): **Grid-b low multi-seed missing.** The extended grid (b=0.1–0.3)
    is seed-42 only. The fixed-b curve shape (and thus the claim that ESS-only''s
    mean b*=4.15 outperforms globally-optimal fixed b=0.5) could look different under
    other seeds.

    - W7 (Minor): **No learning curves or training dynamics.** All results are final
    PPL. How does the adaptive b* behave over training? Does it stabilize? Drift?
    The per-batch adaptation is the method''s core mechanism, yet its temporal behavior
    is never shown.


    **Questions for Authors**


    - Q1: Can you provide 3-seed results for ESS-only? This is the minimum needed
    to support the central claim.

    - Q2: What is the ESS-only PPL at ρ=0.6? If ESS-only also underperforms grid-best
    at ρ=0.6, the practical recommendation collapses.

    - Q3: What happens with n_min=2 at batch_size=32 or 64? Is the method robust at
    realistic training configurations?

    - Q4: Have you considered a continuous α_eff formulation without the hard 0.5
    threshold? If α_eff were defined continuously, would the negative finding still
    hold?


    **R1 Preliminary Score**: 3/6 (Weak Reject)

    **Confidence**: 4/5


    ---


    ## R2 Assessment: Novelty, Related Work & Significance


    **Summary.** The paper replaces Drayson et al.''s validation-based grid search
    over b with per-batch adaptive b* using two textbook quantities (Kish''s ESS and
    a weighted real-fraction metric). The core conceptual contribution — contrasting
    minimum vs maximum intervention — is genuine, and the negative finding (α_eff
    hurts under noisy detection) is useful. However, the novelty is narrow (automating
    a single scalar in an existing formula), important related work in importance
    sampling is missing, and the small effect sizes limit practical impact.


    **Strengths**


    - S1: **Min-intervention vs max-intervention is a genuine conceptual contribution.**
    The distinction between b* = inf{b : α_eff ≥ τ} and b* = max{b : ESS ≥ n_min}
    formalizes an important design choice. The empirical finding that max-intervention
    wins is non-obvious and practically useful.

    - S2: **The negative finding has community value.** Demonstrating that "clean
    enough" constraints backfire under imperfect detection challenges conventional
    wisdom about conservative data curation. The detector-quality interaction (Table
    5: harmful at AUC=0.939, inert at AUC=0.986) provides a clear mechanistic explanation.

    - S3: **Lightweight detector sufficiency.** TF-IDF+LR (trainable in 2 minutes)
    providing most of the benefit is a practical finding that lowers the barrier to
    adoption.

    - S4: **Paper is well-structured and clearly written.** The progression from main
    results → negative finding → sensitivity analyses → discussion is logical. Tables
    are informative and well-labeled.


    **Weaknesses**


    - W1 (Major): **Narrow novelty over Drayson et al.** The weighting formula w=(1-q)^b,
    the detect-and-reweight paradigm, and the overall framework are all from Drayson
    et al. The paper''s contribution reduces to: (a) replace grid search with a 1D
    bisection combining Kish''s ESS (1965) and a weighted fraction, and (b) use loss
    reweighting instead of SIR. Contribution (b) is a standard implementation choice.
    Contribution (a) is useful engineering but not a methodological advance. The adaptive
    b* algorithm is ~7 lines of pseudocode.

    - W2 (Major): **τ insensitivity paradox.** The τ sweep shows PPL range of only
    0.040 across τ ∈ [0.5, 0.9]. While presented as evidence that α_eff is harmful,
    it equally suggests that α_eff is inconsequential — the constraint barely matters
    regardless of τ. If removing α_eff only buys 0.010–0.015 PPL, the entire negative
    finding is about a negligible effect. This undermines both the dual-constrained
    formulation (it barely matters) and the negative finding about it (the thing that
    doesn''t matter also doesn''t hurt much).

    - W3 (Major): **Significance limited by effect sizes.** The best improvement is
    0.055 PPL at 0.6B scale with 40% controlled contamination — an aggressive setting.
    At realistic scales (3B) and natural contamination, the effect would likely vanish.
    No downstream task improvement is demonstrated. A practitioner reading this paper
    would reasonably conclude: "the effect is too small to bother implementing."

    - W4 (Major): **Missing importance sampling literature.** The ESS constraint is
    Kish''s effective sample size (1965), not cited. The connection to self-normalized
    importance sampling, Pareto Smoothed Importance Sampling (Vehtari et al., JMLR
    2024), and ESS-constrained importance weighting in off-policy RL (Precup et al.,
    2000; Munos et al., 2016) is absent. AIOLI (Chen et al., ICLR 2025) — online adaptive
    data mixing without grid search — is the closest "no grid search" comparator and
    is not discussed. Self-paced learning (Kumar et al., 2010) and curriculum learning
    (Bengio et al., 2009) are methodological antecedents for adaptive per-sample weighting.
    These omissions make the contribution appear more novel than it is.

    - W5 (Moderate): **"Zero tuning cost" is overstated.** The method replaces one
    hyperparameter (b) with two (τ, n_min) in the dual case, or one (n_min) in ESS-only.
    At batch_size=4, n_min=2 is the only working value. Calling this "zero-tuning"
    stretches the definition. A fixed b=0.5 (no adaptive machinery, no bisection overhead,
    no n_min sensitivity) achieves PPL 17.651 vs ESS-only''s 17.635 — a 0.016 difference
    that may not justify the added complexity.

    - W6 (Moderate): **Claims about "unknown proportion" advantage are untested.**
    The paper claims the method works without knowing ρ, which is true but trivial
    — uniform training also doesn''t need ρ. The interesting question is whether the
    method''s advantage scales with ρ, and the ρ=0.6 results (dual underperforms grid-best)
    suggest it does not.


    **Questions for Authors**


    - Q1: How does ESS-only compare to simply setting b=0.5 universally? The 0.016
    PPL gap seems small relative to the added algorithmic complexity.

    - Q2: Have you considered the connection to off-policy RL importance sampling,
    where ESS-constrained weighting is standard? How does this work position against
    that literature?

    - Q3: The AIOLI framework (Chen et al., ICLR 2025) eliminates grid search for
    data mixing via online optimization. How does your approach compare conceptually
    and empirically?

    - Q4: At what contamination rate and model scale would you expect the effect to
    become practically meaningful (e.g., >0.5% relative PPL improvement)?


    **Missing Related Work**


    - Kish, L. (1965). Survey Sampling — foundational source for ESS.

    - Vehtari, A. et al. (JMLR 2024). PSIS — ESS diagnostics in importance sampling.

    - Chen, M. et al. (ICLR 2025). AIOLI — online adaptive mixing without grid search.

    - Off-policy RL importance weighting (Precup et al., 2000; Munos et al., 2016).

    - Self-paced learning (Kumar et al., 2010) / Curriculum learning (Bengio et al.,
    2009).

    - MATES (Yu et al., NeurIPS 2024) — online adaptive instance-level selection.


    **R2 Preliminary Score**: 3/6 (Weak Reject)

    **Confidence**: 4/5



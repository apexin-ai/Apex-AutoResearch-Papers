    ## Step 1: Independent Reviews


    ### Reviewer R1 (Methods + Experiments)


    **Score: 3/6 (Weak Reject) | Confidence: 4/5**


    **Summary.** The paper proposes a dual-constrained adaptive b* for the detect-and-reweight
    framework, replacing per-model grid search with a per-batch bisection that enforces
    a quality lower bound (α_eff ≥ τ) and a stability upper bound (ESS ≥ n_min). The

    - round: 12
      reviewers: [1, 2]
      note: "Round 12 fresh review 再次独立发现。双方 AGREE。"
    - round: 13
      reviewers: [1, 2]
      note: "论文已升至 5 seeds + BH correction。统计检验力问题部分缓解但 Cohen's d=3.83 被 deterministic data ordering 人为放大。"
    - round: 14
      reviewers: [1, 2]
      note: "N=5 seeds 和 BH correction 已到位。原始 N=3 问题已解决。衍生出 R14-N1（ρ=0.6 p_BH=0.064 overclaim）。R2 交叉回应补充：Cohen's d caveat 应在 §5.1 主文而非仅 Appendix Q；建议补充 Wilcoxon signed-rank 作为 robustness check。"
  resolution: "主实验升至 5 seeds + BH correction。原始统计检验力问题已解决。"
  resolution_round: 14

- id: "R11-C2"
  summary: "α_eff proxy 可靠性存疑：R²≈0.63，Wang (2026) 理论保证不直接转移到 proxy"

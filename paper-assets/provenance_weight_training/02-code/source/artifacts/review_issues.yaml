- id: "R13-W2"
  summary: "Grid-best b=0.3 vs adaptive b*≈0.9 偏差：α_eff 负偏差导致过度干预"
  category: method
  severity: warning
  status: in_progress
  first_raised_round: 13
  last_seen_round: 14
  mentions:
    - round: 13
      reviewers: [1, 2]
      note: "因果链：α_eff 负偏差 → quality floor 过早绑定 → b_τ 推高 → b*≈0.9 远高于 grid-best b=0.3。"
    - round: 14
      reviewers: [1, 2]
      note: "R1 AGREE，R2 partial REBUT。R2 论证：(1) 比较框架不对等——grid b=0.3 是全局固定值而 mean b*≈0.9 含 per-batch 波动（0~5 range, 5.8% clean batches b*=0）；(2) gap 部分来自 grid-search 的 post-hoc oracle advantage（cross-seed SD=0.035 是 adaptive 6×）；(3) 但核心 concern 成立——α_eff negative bias -0.03 确实系统推高 b*，是结构性缺陷。圆桌共识：观察有效，但'违背 minimum intervention'措辞过强，更准确为'未能完全实现 minimum intervention，有改进空间'。"
  action_items:
    - round: 14
      action: "补充 per-batch b* 分布。探索 bias correction（+0.03 offset）对 b* 和 PPL 的影响。"
      assigned_to: director
      status: open
  resolution: ""
  resolution_round: null

- id: "R13-W3"
  summary: "1.7B 规模效应递减 43% 且 scaling trend 未正式讨论"

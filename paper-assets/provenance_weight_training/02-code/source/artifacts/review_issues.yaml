      note: "R1-N2 标为 critical。圆桌共识：should-fix（修改 'guarantees' 措辞即可）。"
    - round: 14
      reviewers: [2]
      note: "R2 补充：negative bias ≈-0.03 意味 α_eff 偏向 conservative intervention（多干预），在 safety 角度可取但解释了 b*≈0.9 系统偏高的问题。应报告 violation rate（α_eff ≥ τ 且 true fraction < τ 的 batch 比例），可从现有数据直接计算。"
  action_items:
    - round: 14
      action: "将 §3 中 'guarantees' 改为 'targets/approximates'。报告 violation rate。考虑 bias correction（+0.03 offset）对 b* 的影响。"
      assigned_to: director
      status: open
  resolution: ""
  resolution_round: null


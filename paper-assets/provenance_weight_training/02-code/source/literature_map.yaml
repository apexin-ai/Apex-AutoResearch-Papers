  key_findings: "rephrased 合成数据最佳混合比例约 30%；textbook-style 合成数据会导致 collapse；更大生成器不一定更好（~8B 即可）"
  relevance_to_us: "为我们的 contamination setting 提供 empirical context——Introduction 中说明 synthetic data 在 pretraining 中的规模和风险"

- id: kazdan_2025_collapse_thrive

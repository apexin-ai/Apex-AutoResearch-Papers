paper_key: "feng_2025_beyond_collapse"
title: "Beyond Model Collapse: Scaling Up with Synthesized Data Requires Verification"
venue: "ICLR 2025"
full_text_available: true

research:
  baselines: ["no pruning (random)", "oracle verification", "self-selection", "Llama-3 selection"]
  metrics:
    - {name: "accuracy (eigenvalue task, 1% tolerance)", direction: "higher_better"}
    - {name: "ROUGE-1 (summarization)", direction: "higher_better"}
    - {name: "proxy p* (breakdown point)", direction: "higher_better"}
  datasets:
    - {name: "synthetic 5x5 matrices (eigenvalue)", size: "200K train, up to 10M synthesized"}
    - {name: "XLSUM (summarization)", size: "307K train"}
  ablation_dimensions: ["verifier type", "selection rate (12.5/25/50%)", "synthesized data volume (1M-10M)"]
  training_recipe: {optimizer: "not specified", lr: "not specified", hardware: "not specified", model: "Llama-2-7B for summarization, transformer for eigenvalue"}
  method_family: "verification-based synthetic data selection"

positioning:
  core_claim: "Synthesized data contains valuable information but models cannot self-identify best outputs; external verifiers with measurable proxy p* can prevent collapse and enable scaling"
  key_results: "Oracle verification nearly doubles eigenvalue accuracy; p* strongly correlates with performance ranking across all settings; self-selection outperforms stronger Llama-3 verifier"
  limitations: ["only considers selection, not augmentation or reweighting", "oracle verifiers unavailable for most tasks", "infinite-sample regime idealization"]
  relation_to_us: "foundation"

narrative:
  story_type: "突破局限型"
  hook: "Warmup experiment: beam-50 accuracy 60.4% vs greedy 19.2% — models generate good solutions but can't find them"
  tension: "Model collapse discourages synthetic data use, but the problem isn't data quality — it's selection"
  key_insight: "Section 4 — sharp phase transition at breakdown point p*; measurable proxy predicts verifier effectiveness"
  argument_chain: "warmup (generation vs selection gap) → theory (phase transition) → simulations → eigenvalue task → summarization → proxy validates across all"
  contribution_framing: "3 contributions: theoretical characterization, proxy p*, empirical validation on 2 tasks"
  intro_structure: "5 paragraphs: (1) synthetic data growth, (2) collapse concern, (3) verification idea, (4) warmup insight, (5) contributions"
  notable_technique: "Warmup experiment immediately makes reader feel 'aha' — brilliant opening with concrete numbers showing generation-selection gap"

figures:
  figure_count: 5
  figure1:
    type: "motivation"
    description: "Table comparing beam search accuracy across beam sizes showing generation vs selection gap"
    narrative_role: "Establishes core insight: models CAN generate high-quality data, they just can't identify it"
    design_elements: ["compact table format", "dramatic 60.4% vs 19.2% contrast"]
    visual_style: "Small embedded table in intro section rather than full figure — concise and impactful"
  result_figures:
    - figure_id: "Figure 4"
      viz_type: "line_plot"
      what_compared: "Accuracy vs synthesized data volume under different p* values"
      how_gain_highlighted: "Clear separation between p* levels; collapse at p*=0.5 vs improvement at p*=1.0"
      design_note: "5-seed averaging with error bands; data volume on x-axis shows scaling behavior"
    - figure_id: "Figure 5"
      viz_type: "line_plot"
      what_compared: "Oracle vs Llama-3 vs self-selection vs random at 3 selection rates"
      how_gain_highlighted: "p* ranking exactly predicts performance ranking"
      design_note: "Triple-panel layout (12.5/25/50%) with bottom row showing p* values — links theory to empirics"
  ablation_figures: []
  figure_narrative_role: "Figure 1 (motivation table) → Figure 2 (phase transition theory) → Figure 3 (simulations) → Figure 4 (eigenvalue) → Figure 5 (summarization)"

tables:
  table_count: 1
  main_result_table:
    table_id: "Figure 1 (embedded table)"
    row_axis: "beam sizes"
    col_axis: "accuracy at different tolerances"
    row_organization: "by_performance"
    col_organization: "flat"
    highlight_strategy: "contrast between all-beams and best-beam accuracy"
    statistical_reporting: "5-seed averaging for eigenvalue experiments"
    num_baselines: 4
    design_note: "Minimal table use — results primarily communicated through figures"
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "Gaussian simulation details, proxy function generalization for continuous metrics"
    reason: "Theory-heavy content moved to appendix to keep main text focused on empirical validation"

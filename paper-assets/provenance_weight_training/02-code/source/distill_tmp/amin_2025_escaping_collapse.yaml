paper_key: "amin_2025_escaping_collapse"
title: "Escaping Collapse: The Strength of Weak Data for Large Language Model Training"
venue: "NeurIPS 2025"
full_text_available: true

research:
  baselines: ["pre-trained (PT)", "Gold SFT", "do nothing (no curation)", "filter only (STaR/ReST variant)", "boosting w/o focusing"]
  metrics:
    - {name: "train accuracy @1", direction: "higher_better"}
    - {name: "train accuracy @8", direction: "higher_better"}
    - {name: "test greedy accuracy", direction: "higher_better"}
    - {name: "train pass@1 (MBPP)", direction: "higher_better"}
    - {name: "train pass@32 (MBPP)", direction: "higher_better"}
  datasets:
    - {name: "GSM8K", size: "7,000 math problems"}
    - {name: "MBPP", size: "374 Python coding problems"}
  ablation_dimensions: ["weak data quality (A vs B)", "with/without hard example focusing", "number of rounds (1-5)"]
  training_recipe: {optimizer: "not specified", lr: "not specified", hardware: "not specified", model: "Gemma 2 2B", k_samples: "8 (GSM8K) / 32 (MBPP)", alpha: "1/3"}
  method_family: "boosting-inspired iterative self-training with weak data"

positioning:
  core_claim: "Even very weak external data (β>0 correct fraction) combined with filtering enables convergence to optimal LLM via a boosting-like iterative framework"
  key_results: "Boosting: GSM8K test 45.6% vs filter-only 39.3% vs do-nothing 12.9%; unifies STaR/ReST/ReST^EM under common theory"
  limitations: ["strong learner assumption (exact distribution matching)", "generalization properties not fully understood", "limited by data selection modeling"]
  relation_to_us: "complementary"

narrative:
  story_type: "跨界迁移型"
  hook: "Synthetic data risks collapse, but how much curation is actually needed?"
  tension: "Existing methods either avoid synthetic data entirely or use expensive curation; no principled framework quantifies minimum curation"
  key_insight: "Intro paragraph 3 — connection to boosting: strong learner + weak data achieves optimal performance, mirroring weak learner + strong ensemble in classical boosting"
  argument_chain: "synthetic data dilemma → boosting analogy → formalize (β-weak labeler, γ-noisy filter) → Theorem 5 (convergence) → validate on GSM8K + MBPP"
  contribution_framing: "2 main contributions: theoretical framework connecting boosting to synthetic data training, empirical validation showing weak data beats filter-only"
  intro_structure: "5 paragraphs: (1) synthetic data promise/risk, (2) curation question, (3) boosting connection, (4) theoretical result preview, (5) experimental plan"
  notable_technique: "Boosting analogy is powerful — maps unfamiliar territory (LLM synthetic training) to well-understood classical ML framework"

figures:
  figure_count: 2
  figure1:
    type: "teaser_result"
    description: "Test and train performance across rounds on GSM8K, showing boosting variants vs baselines"
    narrative_role: "Shows collapse of 'do nothing', plateau of 'filter only', and continued improvement of boosting"
    design_elements: ["stacked accuracy@1 + accuracy@8", "3-seed error bars", "5-round x-axis"]
    visual_style: "Line plots with shaded error bands, stacked bars for @1 and @8 accuracy"
  result_figures:
    - figure_id: "Figure 2"
      viz_type: "line_plot"
      what_compared: "Same comparisons on MBPP"
      how_gain_highlighted: "Training metrics show clear boosting advantage; test results more nuanced"
      design_note: "Honest presentation — test results less clear-cut due to limited MBPP data"
  ablation_figures: []
  figure_narrative_role: "Figure 1 (GSM8K results) → Figure 2 (MBPP results) — minimal figure count, theory-heavy paper"

tables:
  table_count: 1
  main_result_table:
    table_id: "Table 1"
    row_axis: "methods"
    col_axis: "datasets (GSM8K, MBPP) × metrics"
    row_organization: "by_category"
    col_organization: "grouped_by_dataset"
    highlight_strategy: "bold_best"
    statistical_reporting: "mean ± std across 3 seeds"
    num_baselines: 5
    design_note: "Single comprehensive table combining both datasets — compact for theory paper"
  ablation_tables: []
  supplementary_tables:
    in_appendix: false
    content: "N/A"
    reason: "Theory paper — most detail in proofs rather than additional experiments"

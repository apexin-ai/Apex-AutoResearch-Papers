# Writing Plan — provenance_weight_training
# Generated: 2026-05-15
# Contract for downstream writing Workers

venue: EMNLP 2026 ARR May 25
deadline: 2026-05-25
page_limit: 8 (+ unlimited appendix)

title: "Minimum Intervention Reweighting: Adaptive Exponent Selection for Contamination-Aware Pretraining"
# 备选:
# - "Dual-Constrained Adaptive Reweighting for Pretraining on Contaminated Web Corpora"
# - "How Much to Downweight? Principled Exponent Selection for Contamination-Aware Pretraining"

abstract_outline:
  - sentence_1: "Web pretraining corpora contain 20–60% machine-generated text of unknown provenance, and naive training on such mixtures degrades model quality (model collapse)."
  - sentence_2: "Existing detect-and-reweight methods (Drayson et al., 2025) require per-model validation-based grid search over the weighting exponent b, which is expensive and fragile."
  - sentence_3: "We propose a dual-constrained adaptive b* that jointly enforces a quality lower bound (α_eff ≥ τ) and a stability upper bound (ESS ≥ n_min), yielding the minimum intervention—the smallest b that achieves sufficient cleaning per batch, with zero validation cost."
  - sentence_4: "On FineWeb with Qwen3-0.6B, adaptive b* matches grid-search-optimal performance within seed variance while eliminating 6× search cost, and outperforms both uniform training and the max-intervention (ESS-only) baseline."

# ============================================================
# SECTIONS
# ============================================================

sections:

  introduction:
    target_pages: 1.0
    key_points:
      - "Web corpora contamination is pervasive (20–60%) and growing; strong model collapse occurs even at low contamination (Dohmatob et al., 2025)"
      - "Detect-and-reweight via w=(1-q)^b is effective (Drayson et al., 2025), but b selection requires per-model validation grid search"
      - "Problem statement: given per-sample detector scores q, how to choose b without validation?"
      - "Our answer: dual-constrained adaptive b* — α_eff(b) ≥ τ (quality floor) + ESS(b) ≥ n_min (stability ceiling) → minimum intervention principle"
      - "Key insight: α_eff monotonically increasing, ESS monotonically decreasing → b has a lower bound b_τ and upper bound b_ESS; b* = b_τ when feasible"
    contributions:
      - "Dual-constrained framework for adaptive b* selection with minimum intervention semantics (Section 3)"
      - "Empirical demonstration that adaptive b* matches grid-best within seed variance at zero validation cost (Section 5)"
      - "Evidence that minimum intervention (dual-constraint) outperforms maximum intervention (ESS-only), and that a lightweight TF-IDF+LR detector suffices (Section 5)"
    evidence:
      - adaptive_fix_seed42
      - adaptive_fix_seed123
      - adaptive_fix_seed456
      - ess_only_seed42

  related_work:
    target_pages: 1.0
    groups:
      synthetic_contamination_and_collapse:
        narrative: "Model collapse under recursive/contaminated training"
        papers:
          - shumailov_2024_model_collapse
          - alemohammad_2024_mad
          - dohmatob_2025_strong_collapse
          - cheng_2025_contamination_survey
      detect_and_reweight:
        narrative: "Detection-based reweighting and filtering for contaminated data"
        papers:
          - drayson_2025_detection_collapse    # direct competitor, most detailed comparison
          - feng_2025_beyond_collapse          # hard filtering via verifier
          - guo_2025_escaping_collapse         # verification-based
          - mitchell_2023_detectgpt            # detector method
          - shi_2024_minkprob                  # detector method
      data_mixing_and_reweighting:
        narrative: "Domain- and instance-level data weighting for LLM pretraining"
        papers:
          - xie_2023_doremi
          - xie_2023_dsir
          - he_2024_softdedup
          - sow_2025_dynamic_reweighting
          - chen_2025_aioli
          - ye_2025_data_mixing_laws
          - yang_2026_data_mixing_agent
          - kuo_2024_data_weighting
      theoretical_foundations:
        narrative: "Optimal weighting theory and importance sampling diagnostics"
        papers:
          - he_2025_golden_ratio
          - wang_2026_survive_contamination
          - vehtari_2024_psis
          - kimura_2024_iw_survey
    key_points:
      - "Position Drayson as closest prior work: same w=(1-q)^b formula, but b is a per-model hyperparameter chosen via validation grid search"
      - "Distinguish from Golden Ratio (requires known proportion) and DoReMi/DSIR (domain-level, not instance-level contamination)"
      - "Highlight gap: no existing method provides principled per-batch b selection without validation"

  method:
    target_pages: 2.5
    subsections:
      problem_setup:
        key_points:
          - "Training corpus D = D_real ∪ D_synth, proportion unknown"
          - "Detector provides per-sample q(x) ∈ [0,1] (synthetic probability)"
          - "Weighting formula w(x) = (1-q(x))^b, shared with Drayson et al."
          - "Goal: choose b per-batch to maximize training quality without validation"
        evidence: []
      dual_constraint_framework:
        key_points:
          - "Define α_eff(b) = Σ_i w_i · 1[real_i] / Σ_i w_i — effective real proportion after reweighting"
          - "Define ESS(b) = (Σ w_i)² / Σ w_i² — Kish's effective sample size"
          - "Monotonicity: α_eff(b) strictly increasing (Proposition 1, proof via Cov_w(x, ln x) ≥ 0); ESS(b) strictly decreasing"
          - "Quality constraint: α_eff(b) ≥ τ → lower bound b_τ (at least this much cleaning)"
          - "Stability constraint: ESS(b) ≥ n_min → upper bound b_ESS (at most this much cleaning)"
          - "b* = inf{b ≥ 0 : α_eff(b) ≥ τ} subject to ESS(b) ≥ n_min"
          - "Minimum intervention principle: use the smallest b that achieves the quality floor"
        evidence: []
      algorithm:
        key_points:
          - "Algorithm 1: Per-batch b* solver (bisection on α_eff, check ESS feasibility)"
          - "Three regimes per batch: (1) already clean → b*=0; (2) α_eff binding → b*=b_τ; (3) ESS binding → b*=b_ESS"
          - "Implementation: loss reweighting (continuous gradient weighting) vs Drayson's SIR (discrete resampling)"
          - "Complexity: O(B log(1/ε)) per batch, negligible vs forward/backward pass"
        evidence: []
      hyperparameters:
        key_points:
          - "τ (quality threshold): theoretically motivated by convergence rate ∝ α (Wang et al., 2026); empirically, wide safe range [0.5, 0.8] with default τ=0.8"
          - "n_min (ESS floor): default n_min=2; robust across {2,3}; n_min=1 removes stability constraint (degrades); n_min ≥ batch_size trivially forces b*=0"
          - "Both have principled defaults set once, no per-model tuning needed"
        evidence:
          - tau_05_seed42
          - tau_06_seed42
          - tau_07_seed42
          - adaptive_fix_seed42  # tau=0.8
          - tau_09_seed42
          - tau_095_seed42
          - nmin1_seed42

  experiments:
    target_pages: 1.0
    key_points:
      - "Base model: Qwen3-0.6B pretrained from scratch on FineWeb subset"
      - "Data: 132M+ tokens, 40% synthetic injection (Qwen3-0.6B self-generated), uniform random mixing"
      - "Detector: TF-IDF + Logistic Regression (AUC=0.939, calibrated ECE=0.048)"
      - "Training: 6103 steps, batch_size=4, AdamW, cosine schedule"
      - "Evaluation: held-out eval_ppl on balanced real/synthetic held-out set"
      - "All comparisons use 3 random seeds (42, 123, 456) for statistical reliability"
    subsections:
      baselines:
        items:
          - "Uniform: w=1 for all samples (no contamination handling)"
          - "Grid-b: fixed b ∈ {0.5, 1.0, 1.5, 2.0, 3.0, 5.0}, best selected post-hoc"
          - "ESS-only: b* = max{b : ESS(b) ≥ n_min} (maximum intervention, no α_eff constraint)"
          - "Golden Ratio: w*=1/φ ≈ 0.618 for synthetic samples (oracle, requires known proportion)"
      experiment_groups:
        main_comparison:
          description: "Adaptive b* vs grid-best vs uniform vs ESS-only vs golden ratio"
          exp_ids:
            - adaptive_fix_seed42
            - adaptive_fix_seed123
            - adaptive_fix_seed456
            - uniform_seed42
            - uniform_seed123
            - uniform_seed456
            - grid_b_seed42   # b=0.5 best
            - grid_b_seed123
            - grid_b_seed456
            - ess_only_seed42
            - ess_only_seed123   # running
            - ess_only_seed456   # running
            - golden_ratio_seed42
        tau_sweep:
          description: "τ ∈ {0.5, 0.6, 0.7, 0.8, 0.9, 0.95} sensitivity analysis"
          exp_ids:
            - tau_05_seed42
            - tau_06_seed42
            - tau_07_seed42
            - adaptive_fix_seed42   # τ=0.8
            - tau_09_seed42
            - tau_095_seed42
        nmin_sensitivity:
          description: "n_min ∈ {1, 2, 3, 4} sensitivity analysis"
          exp_ids:
            - nmin1_seed42
            - adaptive_fix_seed42   # n_min=2
            - adaptive_seed42       # n_min=3
            - nmin4_seed42          # running
        batch_size:
          description: "batch_size ∈ {4, 8} generalization (n_min=2 fixed)"
          exp_ids:
            - adaptive_fix_seed42      # bs=4
            - bs8_nmin2_seed42_r2      # bs=8, running
    evidence:
      - all exp_ids listed above

  results:
    target_pages: 1.5
    key_points:
      - "Main result: adaptive b* PPL within seed variance of grid-best (aggregate ratio 88.6%), both beating uniform by ~0.04 PPL"
      - "ESS-only (max intervention) PPL=17.73 — worse than uniform (17.69), confirming minimum > maximum intervention"
      - "Golden ratio PPL=17.654 ≈ adaptive — oracle baseline matched without known proportion"
      - "τ sweep: [0.5, 0.8] all beat uniform; τ=0.8 optimal (PPL=17.653); τ>0.8 degrades due to b* inflation"
      - "n_min: n_min=2 stable across 3 seeds; n_min=1 degrades (no stability constraint); n_min=3 also works; n_min=4 expected to force b*≈0"
      - "Binding constraint analysis: 49.9% clean (b*=0), 20.2% α_eff-binding, 30.0% ESS-binding; when α_eff binds, b*=1.67 vs ESS-only's 4.15"
      - "Detector: lightweight TF-IDF+LR (AUC=0.939) sufficient; calibration (ECE=0.048) more important than raw AUC"
    evidence:
      - adaptive_fix_seed42
      - adaptive_fix_seed123
      - adaptive_fix_seed456
      - uniform_seed42
      - uniform_seed123
      - uniform_seed456
      - ess_only_seed42
      - golden_ratio_seed42
      - tau_05_seed42
      - tau_06_seed42
      - tau_07_seed42
      - tau_09_seed42
      - tau_095_seed42
      - nmin1_seed42
      - detector_tfidf_lr

  discussion:
    target_pages: 0.5
    key_points:
      - "Minimum intervention principle: why doing less is better — over-downweighting discards useful gradient signal from borderline samples"
      - "τ as practical dial: controls the quality-efficiency tradeoff; [0.5, 0.8] safe range gives practitioners a clear operating region"
      - "Connection to convergence theory: Wang et al. (2026) show convergence rate ∝ α; our τ serves as a proxy for α without requiring known proportions"
    limitations:
      - "Single model scale (0.6B) — batch-level statistics may behave differently at 3B+ where batch sizes are larger"
      - "Controlled injection (uniform random) — real web contamination has domain-skewed distribution"
      - "Single detector family (TF-IDF+LR) — detector quality ablation not yet complete"
      - "τ is an empirical hyperparameter; the convergence theory (Wang et al.) requires known α, which we do not assume"
      - "Effect size ~0.3% PPL at 0.6B/40% contamination — expected to amplify at higher contamination and larger scale"
    evidence: []

  conclusion:
    target_pages: 0.3
    key_points:
      - "Dual-constrained adaptive b* provides principled, validation-free exponent selection for contamination-aware pretraining"
      - "Minimum intervention principle — quality floor + stability ceiling — outperforms both no intervention and maximum intervention"
      - "Future work: scale to 3B+ models, real web contamination, detector quality ablation, multi-task evaluation"
    evidence: []


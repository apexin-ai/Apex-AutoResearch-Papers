    rationale: "Core contribution; everything else depends on precise method description"
  - section: experiments
    rationale: "Setup must be clear before results"
  - section: results
    rationale: "Data-driven; needs method + experiments in place"
  - section: introduction
    rationale: "Frame the story using concrete results"
  - section: related_work
    rationale: "Position after knowing exactly what we claim"
  - section: discussion
    rationale: "Limitations and implications from results"
  - section: conclusion
    rationale: "Compress intro + results"
  - section: abstract
    rationale: "Last — distill the full paper"


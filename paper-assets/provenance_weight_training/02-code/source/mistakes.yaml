  date: '2026-05-17'
  category: resource_misuse
  severity: low
  summary: random_reweight_seed456 提交到已占用的 cuda:2（OOM），而 cuda:3 实际空闲
  root_cause: Worker 误判 cuda:3 仍被 grid_b0_3_seed456 占用（该实验 17:08 已完成），未通过 nvidia-smi
    实际确认 GPU 状态就提交到 cuda:2
  prevention: 提交训练前必须先 nvidia-smi 确认目标 GPU 实际空闲（0% util, 0 MiB memory），不能仅凭 registry
    状态或历史记忆判断 GPU 占用
  status: active
  fix: 在 cuda:3 重新提交 random_reweight_seed456
- id: M014
  date: '2026-05-17'
  category: resource_misuse
  severity: medium
  summary: Agent 连续两次将训练任务提交到已占用的 GPU（OOM），未在提交前执行 nvidia-smi 确认
  root_cause: Agent 依赖 registry 状态或内存中的 GPU 分配记录判断 GPU 可用性，而非实际检查 nvidia-smi。Registry
    可能过时，Agent session 重置后上下文丢失导致误判。
  prevention: 提交训练前必须执行 nvidia-smi 确认目标 GPU 可用显存 > 50GB 且无其他训练进程。这应成为 submit_training_job
    的硬前置检查，不可跳过。
  status: active
  context: random_reweight_seed456 两次 OOM：(1) 41312:cuda:2 被 ess_only_seed123 占用 (2)
    30476:cuda:0 被 grid_b0_1_seed42 占用。最终由 urgent worker 在 41312:cuda:3 成功启动。
  fix: 第三次提交通过 urgent worker 在正确 GPU 上启动成功。
- id: M015
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: batchsize16_nmin8_r2 配置错误：Agent 用 per_device_batch_size=4 + accum=4 但 n_min=8，导致
    b*=0 always
  root_cause: Agent 默认用 per_device_batch_size=4（与所有其他实验一致）+ gradient_accumulation_steps=4
    实现 effective batch=16，但 n_min coupling rule 要求的是 micro-batch≥n_min，不是 effective
    batch≥n_min。ESS 在前向传播级别计算，只能看到 micro-batch 内的样本数。
  prevention: batch_size 消融实验的配置必须明确指定 per_device_train_batch_size=目标值, gradient_accumulation_steps=1。Director
    指令中应明确写"per_device_train_batch_size=16"而非含糊的"batch_size=16"。n_min coupling rule
    的前提是 micro-batch≥n_min。
  status: active
  context: 与 nmin4_seed42 完全相同的机制（micro-batch=4, n_min≥micro_batch → ESS=micro_batch≤n_min
    → b*=0）。日志前 20 entries 全部 b=0.0, ESS=4.0。浪费约 30min GPU 时间。
  fix: Kill PID 46446, 以 per_device_train_batch_size=16, gradient_accumulation_steps=1
    重启。
- id: M016
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: Agent reset 后新 session idle 4h，5+ GPU 空闲未启动新实验
  root_cause: Agent 重置后新 session 仅处理 1 条消息（worker_done 回调），未接收或执行 Director 的 Task
    2 指令（eval + 新实验队列）。可能原因：(1) Director 指令在旧 session 排队未转移到新 session；(2) 新 session
    启动后没有 bootstrap 消息驱动它主动检查 GPU
  prevention: Agent 重置后 Director 必须：(1) 确认新 session 已启动（等 1-2 min）；(2) 立即发一条完整的 context
    + 任务指令（不依赖旧 session 队列）；(3) 10 min 后 check_agent_queue_status 确认 Agent 在处理。如果
    Agent idle > 15 min 且有 GPU 空闲，立即发 urgent 消息。
  status: active
  context: 时间线：20:10 ACK system nudge → 20:15 Agent reset approved → 新 session 启动
    → 仅处理 1 条 worker_done → idle 241 min → 第二次 reset request。期间 5+ 实验完成但未 eval，5+
    GPU 空闲。估计损失 ~20 GPU·h。
  fix: 第二次 reset + 立即发送完整恢复指令（包含 nvidia-smi 检查 + eval 队列 + 新实验队列）
- id: M017
  date: '2026-05-17'
  category: communication
  severity: medium
  summary: 'M017: Director 批准了过时的 RESET REQUEST，中断了正在工作的新 Agent session'
  root_cause: RESET REQUEST 消息从旧 session 的 idle 状态生成，但在新 session 已启动并工作 8 分钟后才送达 Director。Director
    未先 check_agent_queue_status 确认当前 Agent 状态就批准了 reset，导致新 session 被中断。
  prevention: 收到 RESET REQUEST 后必须先 get_agent_queue_status 确认 Agent 当前状态（processing?
    idle_seconds?）。如果 Agent 正在处理（processing=true, idle_seconds < 600），说明 RESET REQUEST
    可能是旧 session 的延迟通知——应 DENY 并注明 "Agent 已在新 session 工作中"。
  status: active
  context: 时间线：旧 session idle 240min → RESET REQUEST 生成 → Director 先前已 reset Agent
    + replace_queue → 新 session 启动处理指令 → 8 min 后 RESET REQUEST 送达 → Director 未核实就批准
    → 新 session 被中断。队列中的指令会被下一个 session 接管，但浪费了 8 min 处理时间。
  fix: Queue 指令持久化跨 session，新 session 会接管。今后 RESET REQUEST 到达时先查 queue status。
- id: M018
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: Resume from checkpoint 导致 optimizer state corruption，final PPL 退化 0.7+
  root_cause: 服务器崩溃后从 checkpoint resume 训练，optimizer state 或 LR schedule 在 resume
    时未正确恢复，导致最后 ~10% 步骤 loss spike，final PPL 远高于正常值
  prevention: Resume 后必须监控前几十步的 loss/grad 是否与中断前连续。如果 loss 跳升，立即停止并检查 optimizer state
    完整性。对于接近完成的实验（>90%），优先用中断前最后 checkpoint 的 eval 而非 resume 到 final
  status: active
  context: grid_b0_2_seed123/456 在 checkpoint-5500 (90%) PPL ~17.64 正常，resume 603
    步后 final PPL 跳至 18.3+
  fix: 采用 checkpoint-5500 的 eval 结果代替 final，不重跑
- id: M019
  date: '2026-05-18'
  category: experiment_design
  severity: medium

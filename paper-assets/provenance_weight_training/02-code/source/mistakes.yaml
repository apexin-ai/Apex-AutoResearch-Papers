mistakes:
- id: M001
  date: '2026-05-16'
  category: code_bug
  severity: high
  summary: code_prep 脚本 export CUDA_VISIBLE_DEVICES=-1 覆盖 submit 注入，导致实验启动即崩溃
  root_cause: code_prep Worker 在脚本内写 `export CUDA_VISIBLE_DEVICES=-1` 作为安全占位符。submit_training_job
    通过外部环境变量注入实际 GPU 编号，但脚本内的 export 语句在运行时覆盖了外部注入，导致 bf16 ValueError（无可用 GPU）。rho02_adaptive_tau09
    因此空转 79 分钟。
  prevention: code_prep 脚本禁止写 `export CUDA_VISIBLE_DEVICES=X`。CUDA_VISIBLE_DEVICES
    只由 submit 时外部设置。脚本内可保留注释 `# CUDA_VISIBLE_DEVICES set by submit_training_job` 作为提醒。submit
    前 grep 检查应扩展为：不仅检查值是否为 -1，还检查是否使用了 export 语句。
  status: active
  context: rho02_adaptive_tau09_seed42 在 47453:cuda:1 注册 RUNNING 但实际从未启动，GPU 空闲 79
    分钟才被发现。bash -n 语法检查无法发现此类运行时问题。
  fix: 移除脚本中 export 行，改为注释。重新提交 PID 367604。批量修复所有待提交脚本。

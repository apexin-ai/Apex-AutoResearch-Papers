  prevention: 1. 禁止同时使用 --save_only_model 和可能需要 resume 的训练配置。2. 如果训练可能超时需要 resume，必须保存完整
    checkpoint（含 optimizer/scheduler/rng state）。3. 更好的方案：去掉 --eval_data_path/--eval_steps
    避免 timeout，一次性跑完不 resume。4. Resume 前必须检查 checkpoint 目录是否包含 optimizer.pt — 缺失则不能
    resume，必须从头跑。
  status: active
  context: 'D110 adaptive_tau08_scratch_seed42: 从 checkpoint-3500 resume（因 inline
    eval timeout），PPL=17.905（uniform baseline 17.694, Δ=+0.211）。gpt2_adaptive_seed123
    同样从 checkpoint-2500 resume，预计也会异常。两个实验都需要从头重跑。'
  fix: 从头重跑，去掉 --save_only_model 和 --eval_data_path/--eval_steps，确保一次性跑完不中断。
  related_decisions:
  - D110

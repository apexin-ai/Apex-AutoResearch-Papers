  root_cause: 脚本提交前未检查是否违反项目规范"不在训练中做 inline eval，使用 post-hoc eval"。审批时也未 catch 到这个违规。
  prevention: 1. 审批实验时 Agent 必须 grep 脚本中的 --eval_steps/--eval_data_path 参数，发现即报告违规；2.

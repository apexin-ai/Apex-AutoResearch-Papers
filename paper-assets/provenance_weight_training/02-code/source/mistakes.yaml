- id: M004
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: nvidia-smi D 状态导致 cron 误判三个活跃实验为 failed，registry 被错误更新
  root_cause: westd-47453 上 20+ nvidia-smi 进程卡在 D (uninterruptible sleep) 状态，GPU 驱动响应异常。cron
    监控依赖 nvidia-smi + SSH 查询判断实验状态，连续 5 次 SSH 超时后将实验标记为 failed。但实际 CUDA 计算未受影响，训练进程正常。
  prevention: 1. 监控 cron 应对 nvidia-smi 超时做容错——fallback 到检查 /proc/{pid}/status 而非直接判定
    failed；2. 标记实验 failed 前必须确认训练进程 PID 已不存在；3. nvidia-smi D 状态堆积超过 10 个时发出预警而非直接更新
    registry
  status: active
  context: batch_adaptive_tau_rho06 (97%), bs8_auto_nmin (80%), rho02_adaptive_tau09
    (28%) 三个实验被错误标记为 failed。batch_adaptive_tau_rho06 即将完成，on_complete hook 可能因 registry
    状态错误不会触发。
  fix: 手动将三个实验 registry 改回 RUNNING，batch_adaptive_tau_rho06 完成后手动触发 post-hoc eval
- id: M005
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: 'M005: 新服务器环境搭建未验证关键依赖版本兼容性，导致全部实验立即崩溃'
  root_cause: westd-30476 环境搭建时用 pip install transformers 安装了最新版 5.8.1，而代码依赖 4.x API（Trainer
    的 tokenizer 参数在 5.x 被移除）。dry-run 只检查了 import 而非实际训练流程。
  prevention: 新服务器环境搭建 checklist 必须包含：1) 从已有正常运行服务器导出 pip freeze，在新服务器 pip install
    -r 精确复制版本；2) dry-run 必须跑到第一个 training step 完成（不是只 import）；3) 特别注意 transformers/torch/accelerate
    主版本号一致性
  status: active
  context: westd-47453 下线后迁移到 westd-30476。Agent 搭建环境时装了 transformers 5.8.1（最新），但代码用的是
    4.x API。3 个实验启动后 43-46 秒内全部崩溃。同时还有模型路径转换错误（Qwen3-0___6B vs Qwen3-0.6B）和 output_dir
    路径争议。
  fix: pip install transformers==4.57.6 降级到与 westd-41312 一致版本
- id: M006
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: 'M006: bash 脚本 | tee 吞掉 python exit code，训练崩溃被误判为成功'
  root_cause: rho02 脚本用 `python ... 2>&1 | tee log`，bash pipeline 中 set -e 只检查最后一个命令（tee）的
    exit code。python crash exit=1 但 tee exit=0，脚本继续执行 echo "DONE" 和 "EXIT_CODE=0"，cron
    误判为成功完成。
  prevention: 所有训练脚本必须：1) 在脚本头部加 `set -o pipefail`（pipeline 中任何命令失败则整体失败）；2) 或不使用
    pipeline 重定向（用 `python ... > log 2>&1` 替代 `| tee`）；3) 新脚本 code review 时 grep 检查
    `| tee` 模式
  status: active
  context: rho02_adaptive_tau09_r2 在 westd-30476 上因 transformers 5.x tokenizer 参数变更崩溃，但
    | tee 吞掉了 exit code，cron 误判为 ANALYZING 状态。Agent 试图对不存在的 checkpoint 做 eval。
  fix: 修复脚本加 set -o pipefail，同时降级 transformers 到 4.57.6 后重启
- id: M007
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: 'M007: 在有训练进程运行的服务器上执行环境修改 worker，导致全部训练进程被 SIGKILL'
  root_cause: worker_fix_30476_env_r4 在 westd-30476 上执行 pip/conda 操作时，触发 OOM 或直接 kill
    了正在运行的 4 个训练进程。这是第二次因环境操作影响训练（第一次是 transformers 版本不兼容导致 API 错误）。
  prevention: 硬规则：服务器上有 RUNNING 状态的训练进程时，禁止在该服务器上执行任何环境修改 worker（pip install/conda/apt-get
    等）。环境修改必须在训练启动前完成，或等全部训练完成后再执行。如果必须修改，先显式暂停所有训练进程。
  status: active
  context: westd-30476 上 4 个实验（random_reweight_seed123_r2, bs8_auto_nmin_r3, batch_adaptive_tau_rho06_r3,
    rho02_adaptive_tau09_r3）在运行约 20 分钟/9% 进度时被 SIGKILL。worker_fix_30476_env_r4 完成时间与
    kill 时间吻合。这些实验已是第 2-3 次重试。
  fix: 查明 worker_fix_30476_env_r4 具体操作，重启 4 个实验，建立环境修改隔离规则
- id: M008
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: worker_fix_30476_env_r4 主动 kill 了 30476 上全部 4 个正在训练的实验进程
  root_cause: 环境修复 worker 在执行修复操作时，未确认训练进程是否在运行就执行了 kill 操作，导致 4 个实验同时中断
  prevention: 1. 修复类 worker 指令中必须明确禁止 kill 训练进程；2. 环境修复 worker 应先检测运行中进程并跳过/汇报，而非主动终止；3.
    对 RUNNING 状态实验所在 GPU 的任何 worker 操作需在指令中加 "禁止终止 PID X" 硬约束
  status: active
  context: 2026-05-17 11:44 UTC，30476 上 4 个实验（random_reweight_seed123_r2, bs8_auto_nmin_r3,
    batch_adaptive_tau_rho06_r3, rho02_adaptive_tau09_r3）在 4 秒内相继被 kill。根因是 worker_fix_30476_env_r4

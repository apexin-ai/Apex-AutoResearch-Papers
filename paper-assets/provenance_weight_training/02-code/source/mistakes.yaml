  root_cause: 训练命令使用 --save_only_model flag，checkpoint 仅保存模型权重（无 optimizer.pt / scheduler.pt
    / rng_state.pt）。当训练因 inline eval timeout 被 kill 后从 checkpoint resume 时，Adam optimizer

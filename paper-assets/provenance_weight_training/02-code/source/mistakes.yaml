- id: M009
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: 30476 四实验同时 OOM killed：cgroup CPU 内存限制 440GiB 被 4 进程并行数据加载耗尽
  root_cause: 4 个训练进程各自使用默认 dataloader_num_workers（多进程 fork），在 step 480-558 同时达到内存峰值，触发
    cgroup OOM killer。容器内存限制 440 GiB，4 进程 + 各自的 data worker 子进程累积超限。
  prevention: 在共享内存容器中并行多实验时：(1) 强制 --dataloader_num_workers 0 减少 fork 内存开销；(2) 设置较小的
    save_steps（如 200）在 OOM 高风险窗口前保存 checkpoint；(3) 错峰启动（间隔 2 min）避免同时达到内存峰值。提交前用 free
    -h 确认容器剩余内存 > 预估峰值。
  status: active
  context: westd-30476 容器 cgroup 限制 440 GiB，4 实验在 ~8-9% 进度同时被 SIGKILL。transformers
    版本问题是误判的初始根因，实际 OOM 是真正原因。
  fix: 方案 2：全部 4 实验重启，加 --dataloader_num_workers 0 + --save_steps 200 + 错峰启动（先 2 个，2
    分钟后加 2 个）
- id: M010
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: 30476 SIGKILL 根因误诊为 cgroup OOM，实际 oom_kill=0 内存仅 32GiB/440GiB
  root_cause: Agent 诊断 Worker 看到 SIGKILL + 容器环境 → 直接推断 cgroup OOM，未验证 /sys/fs/cgroup/memory.events。Reviewer
    独立检查发现 oom=0, oom_kill=0。真正根因不明（可能平台策略或 worker_fix_30476_env_r4 自身 kill 了进程）。
  prevention: SIGKILL 根因排查必须检查 (1) /sys/fs/cgroup/memory.events 中 oom_kill 计数 (2)
    dmesg（如可用）(3) 平台特有的进程管理日志。不能仅凭 SIGKILL + 容器环境就断言 OOM。Director 收到根因诊断后应要求提供 memory.events
    证据再做决策。
  status: active
  context: M009 中记录的 OOM 根因是错误的。实际 SIGKILL 来源不明，可能是平台级进程管理或 worker_fix_30476_env_r4
    操作失误。
  fix: 修改重启方案：从"4 路并行 + 错峰 2 min"改为"单进程探针 25 min 确认平台稳定后再铺满"
- id: M011
  date: '2026-05-17'
  category: code_bug
  severity: medium
  summary: Cron 系统性误报：训练正常完成的实验被 auto-resolve 为 failed（llama3b_adaptive + batchsize16_nmin8，连续两次）
  root_cause: Cron 检测逻辑：进程退出 + 无 W&B sentinel → auto-resolve as failed。但正常完成的训练也会导致进程退出，而这些实验没有配置
    W&B。Cron 没有检查 checkpoint/final 目录存在性或 step_metrics 完整性。
  prevention: 训练脚本完成后应写 sentinel 文件（如 DONE.flag），或 cron 检测逻辑应在标记 failed 前额外检查：(1)
    final/ 目录是否存在 (2) step_metrics.jsonl 最后一行 step 是否等于 max_steps。Director 收到 cron
    failed 通知时应交叉验证 Reviewer 报告再决策，不盲信 auto-resolve。
  status: active
  context: llama3b_adaptive_seed42 和 batchsize16_nmin8_seed42 连续两次被误标 failed。两者实际都完成了全部
    6103 步训练，checkpoint 完整。Reviewer 两次独立确认了 false negative。
  fix: 短期：Director/Agent 收到 cron failed 时先检查 checkpoint 存在性再更新 registry。长期：修改 cron
    检测逻辑或训练脚本加 sentinel。
- id: M012
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: uniform_seed42 retrain 设置 eval_steps=200 导致训练时间从 3.3h 膨胀至 23h
  root_cause: Worker 启动训练时使用了包含 eval_steps=200 的配置，在 Qwen3-0.6B 上 inline eval 每次耗时远超单步训练时间（eval
    占总时间 84%），导致 ETA 从 3.3h 变为 23h
  prevention: 启动 baseline retrain 时，如果只需要最终 checkpoint 用于 post-hoc eval，应设置 eval_strategy=no
    或 eval_steps>=max_steps，避免 inline eval 浪费时间。inline eval 仅在需要 early stopping 或实时监控时才开启。
  status: active
  context: uniform_seed42 retrain 是 downstream eval pipeline 的 critical path（需 checkpoint
    跑 lm-eval HellaSwag/ARC/PIQA/WinoGrande）。23h 等待直接阻塞论文核心证据产出。
  fix: Kill 当前进程，以 eval_strategy=no 重跑。预计 3h 完成。

  summary: α_eff-only ablation 2-seed 数据写入论文，确认双约束交互效应
  rationale: 训练步数已验证（6103步，与其他实验一致）。旧 nmin1_seed42 (PPL=17.789) 实际用 τ=0.8，不可比。新 aeff_only
    用 τ=0.7（论文标准），2-seed mean=17.742±0.009，比 uniform 差 +0.048。与 ESS-only (+0.043)
    共同证明：单独去掉任何一个约束都会退化到比 uniform 还差，双约束的改善是交互效应而非简单叠加。DDL 紧迫，先用 2-seed 写入，seed456
    完成后更新到 3-seed。
  related_experiments:
  - exp_id: aeff_only_nmin1_seed42
    role: primary
    result: PPL=17.750, worse than uniform
  - exp_id: aeff_only_nmin1_seed123
    role: primary
    result: PPL=17.733, worse than uniform
  - exp_id: nmin1_seed42
    role: superseded
    result: PPL=17.789, τ=0.8 not comparable
  depends_on:
  - D126
- id: D128
  date: 2026-05-23 23:00 UTC
  summary: 保持 Bonferroni-Holm k=9 校正方法不变，BH k=5 作为 rebuttal 备选
  rationale: 统计摘要用 BH k=5 得 p_BH=0.024（显著），论文用 Bonferroni-Holm k=9 得 p_BH=0.078（不显著）。DDL
    前切换校正方法有 p-hacking 嫌疑，且三轮审稿已建立 k=9 框架。当前诚实表述（uncorrected p + 承认不显著 + bootstrap
    CI + 方向一致）是审稿加分项。
  related_experiments:
  - exp_id: bs8_nmin4_adaptive_seed456_r2
    role: trigger
    result: B=8 3-seed p=0.006 uncorrected
  depends_on: []
- id: D129
  date: 2026-05-24 03:08 UTC
  summary: α_eff 定义从 binary indicator 改为 continuous (1-q_i)，对齐代码实现
  rationale: 代码使用 continuous (1-q_i) 计算 α_eff，论文定义为 binary r_i=1[q≤0.5]。所有实验结果均来自
    continuous 版本。continuous R²=0.629 > binary R²=0.548。discussion 中 "binary indicator
    discards info" 是假限制。改为 continuous 消除论文-代码不一致 + 消除假限制 + 提高报告精度。
  related_experiments:
  - exp_id: adaptive_fix_seed42
    role: evidence
    result: 所有 adaptive 实验均使用 continuous α_eff
  depends_on:
  - D128
- id: D130
  date: 2026-05-24 04:39 UTC
  summary: Round 13 响应：补 N=5 seeds + random-subset baseline + 标题限定 + 写作修复
  rationale: Round 13 fresh review 给出 3.0 (Findings)。核心瓶颈是 N=3 seeds 统计效力不足（复发×3轮，写作
    hedging 无效）。Reviewer 独立验证 N=5 投射 BH p_BH≈0.006 达显著，ROI 极高。同时补 random-subset multi-epoch
    baseline 强化 F1 (epoch confound)、标题加 self-contamination 限定回应生态效度、删除 practical corollary
    措辞回应 downstream null。温度缩放实验低优先级，时间允许才跑。
  related_experiments: []
  depends_on:

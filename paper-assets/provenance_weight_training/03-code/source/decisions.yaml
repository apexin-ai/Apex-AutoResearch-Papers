- id: D013
  date: 2026-05-14 14:51 UTC
  summary: 新颖性自查：Drayson et al. (EMNLP 2025) 使用同一公式 w=(1-q)^b，需调整 framing 定位
  rationale: Manager 要求的文献新颖性自查发现：Drayson et al. (EMNLP 2025, arXiv 2502.15654) 已发表
    detect-and-reweight 方法，使用与我们完全相同的加权公式 w=(1-q)^b，但 grid search b。我们的核心差异化是 adaptive
    b* 推导（免 grid search）+ lightweight detector sufficiency + unknown proportion 场景。另有
    Golden Ratio Weighting (2025) 和 Dynamic Loss-Based Reweighting (ICLR 2025) 等需补充到
    related work。结论：idea 仍有新颖性但贡献窄于预期，MVP 后 framing 需从"提出 detect-and-reweight"调整为"给
    Drayson 框架加 principled adaptive b*"。
  related_experiments: []
  depends_on:
  - D012

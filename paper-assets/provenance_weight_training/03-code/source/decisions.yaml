- id: D023
  date: 2026-05-15 07:07 UTC
  summary: 'D023: 修正 D021/D022 过度修正 — α_eff 非 decorative，dual-constraint 框架恢复'
  rationale: 'Q1 分析 + Reviewer 独立核实：(1) α_eff(b) 单调性成立但优化方向是 inf{b: α_eff≥τ}（最小干预）而非
    max α_eff → α_eff 是 b 的下界约束而非被推到 ESS 边界; (2) 实证：~40% reweighted batch 中 α_eff
    binding (b*=1.67 vs ESS-only 4.15); (3) D021 "α_eff decorative" 判断错误——正确表述：α_eff

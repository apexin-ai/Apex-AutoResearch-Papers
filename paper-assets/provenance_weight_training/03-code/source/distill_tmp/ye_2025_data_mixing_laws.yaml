paper_key: "ye_2025_data_mixing_laws"
title: "Data Mixing Laws: Optimizing Data Mixtures by Predicting Language Modeling Performance"
venue: "ICLR 2025"
full_text_available: true

research:
  baselines: ["default mixture proportions", "DoReMi", "DoGE"]
  metrics:
    - {name: "validation loss per domain", direction: "lower_better"}
    - {name: "aggregated validation loss", direction: "lower_better"}
    - {name: "training steps to match baseline", direction: "lower_better"}
    - {name: "MAE (fitting accuracy)", direction: "lower_better"}
  datasets:
    - {name: "Pile subsets (2-5 domains)", size: "30B tokens per config"}
    - {name: "RedPajama", size: "100B tokens target"}
  ablation_dimensions: ["number of domains (2-7)", "functional form (M1-M4)", "model size (70M-1B)", "training steps", "implicit vs explicit domain aggregation"]
  training_recipe: {optimizer: "cosine decay with warmup", lr: "cosine schedule", hardware: "not specified", batch_size: "1M tokens"}
  method_family: "data mixing law (parametric loss prediction)"

positioning:
  core_claim: "Domain-specific validation loss follows exponential function of mixture proportions L_i = c_i + k_i·exp(Σ t_ij·r_j), enabling 1000-10000× cheaper optimization via small-scale experiments"
  key_results: "Optimized 1B model achieves default-mixture performance at 73% training steps; eventual 48% step improvement; 1000-10000× compute reduction vs direct search"
  limitations: ["domain boundary clarity affects accuracy", "prediction errors increase with domains", "mixture ranking depends on model size", "no theoretical explanation for exponential form"]
  relation_to_us: "foundation"

narrative:
  story_type: "化繁为简型"
  hook: "Data mixture proportions tuned through heuristics without concrete criteria — systematic quantitative prediction is missing"
  tension: "Existing methods either require expensive grid search or proxy models; no principled scaling from small to large"
  key_insight: "Section 3 — exponential functional form L_i = c_i + k_i·exp(Σ t_ij·r_j) discovered empirically; t_ij interaction matrix reveals facilitation/conflict between domains"
  argument_chain: "heuristic mixtures → discover exponential form in 2-3 domain pilots → nested scaling laws pipeline → validate on 1B model → extend to continual pretraining"
  contribution_framing: "3 contributions: data mixing law formulation, three-step prediction pipeline, continual pretraining application"
  intro_structure: "4 paragraphs: (1) mixture importance, (2) heuristic status quo, (3) proposed law, (4) contributions and applications"
  notable_technique: "Interaction matrix visualization (Figure 4) makes domain relationships immediately interpretable — green=help, red=conflict"

figures:
  figure_count: 10
  figure1:
    type: "method_overview"
    description: "Three-step pipeline illustration: training steps scaling → model size scaling → data mixing law"
    narrative_role: "Gives reader mental model for the entire approach upfront"
    design_elements: ["pipeline diagram", "three numbered steps", "arrows showing prediction flow"]
    visual_style: "Clean schematic with labeled steps and arrows"
  result_figures:
    - figure_id: "Figure 8"
      viz_type: "line_plot"
      what_compared: "Optimized vs default mixture loss over training steps for 1B model"
      how_gain_highlighted: "Vertical line showing 73% step mark where optimized matches default"
      design_note: "Training efficiency visualization — most impactful result figure"
    - figure_id: "Figure 9"
      viz_type: "bar_chart"
      what_compared: "Our method vs DoGE vs DoReMi vs default on 1B model"
      how_gain_highlighted: "Our method achieves lowest loss"
      design_note: "Direct comparison with competing methods"
  ablation_figures:
    - figure_id: "Figure 4"
      viz_type: "heatmap"
      dimensions_varied: ["domain interactions (t_ij matrix)"]
      design_note: "Interaction matrix with green/red coloring — reveals domain facilitation and conflict"
    - figure_id: "Figure 6"
      viz_type: "line_plot"
      dimensions_varied: ["number of domains vs error"]
      design_note: "Shows subquadratic error growth despite quadratic parameter growth"
  figure_narrative_role: "Fig1 (pipeline) → Fig2 (2-domain pilot) → Fig3 (3-domain fit) → Fig4 (interactions) → Fig5 (surfaces) → Fig6-7 (scaling) → Fig8-9 (1B results) → Fig10 (continual)"

tables:
  table_count: 2
  main_result_table:
    table_id: "Validation error table (3-domain)"
    row_axis: "domains"
    col_axis: "models (M1-M4) × train/val"
    row_organization: "flat"
    col_organization: "grouped_by_metric"
    highlight_strategy: "M4 selected for fewer parameters"
    statistical_reporting: "MAE across mixture configurations"
    num_baselines: 4
    design_note: "Model selection table comparing functional forms — unusual for results paper"
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "Domain definitions, detailed mixture configurations, error analysis"
    reason: "Implementation details that don't affect main narrative"

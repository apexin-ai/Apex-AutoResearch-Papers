- name: n_min=4 ablation (=batch_size, ρ=0.4, Qwen3-0.6B, seed42)
  plan_id: p0_nmin_4
  description: ESS = batch_size，预期退化为 uniform
  expected_results:
    eval_ppl_holdout: 17.69
    b_star_mean: 0.0
    b_star_median: 0.0
    b_star_std: 0.0
    b_star_pct_at_zero: 100.0
    train_loss: 7.31
    effective_behavior: uniform
  result_rationale: 'n_min = batch_size = 4 要求 ESS >= 4，即 Kish''s ESS = (Σw_i)²/Σw_i²
    达到样本总数。 数学上这仅当所有权重完全相等时满足（w_i = c for all i），即 b*=0（所有权重为 1）。 对任何 b>0，至少一个 w_i
    = (1-q_i)^b < 1（因为 q_i > 0），使 ESS < 4。 因此所有 batch 被迫 b*=0，方法完全退化为 uniform training，PPL
    = 17.69。 价值：建立 sensitivity curve 的理论上界，证明 ESS 约束过紧时方法优雅退化。

    '

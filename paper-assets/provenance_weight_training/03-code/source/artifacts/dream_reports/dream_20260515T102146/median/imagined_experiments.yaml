    '
- name: Domain-skewed injection (code-heavy contamination, ρ=0.4, Qwen3-0.6B)
  plan_id: p2_domain_skewed
  description: 非均匀域分布污染场景——合成数据集中在 code 域
  expected_results:
    uniform_ppl: 17.71
    adaptive_ppl: 17.69
    improvement_over_uniform: 0.02
    relative_improvement_pct: 0.113
    ratio_vs_uniform_injection: 50.0
    b_star_cross_batch_variance: 高
  result_rationale: 'Domain-skewed injection 使合成数据集中在特定域（code-heavy），batch 间 q-score
    分布差异极大：code-heavy batch q-score 均高（mean ~0.9），其他 batch 接近纯 real。 Per-batch α_eff(b)
    估计不稳定——code batch 的 4 个样本中 3-4 个高 q， q-score 几乎无变异性（std ~0.05），违反 b* 推导的隐含假设（需要
    batch 内 q 有足够 spread）。 Code-heavy batch 在 "全高 q → 任何 b>0 使 ESS 剧降 → b* 被 clamp
    到 0 或极小值" 和 "有足够变异 → 正常 b*" 之间振荡，adaptive 在此场景表现最弱（ratio ~50%）。

    '
  tables: []
  figures_description:
  - Per-batch b* 轨迹图，标注 code-heavy batch 的 b* 异常模式
  analysis: 'Domain-skewed 暴露方法弱点：per-batch 估计假设 batch 内 q-score 有足够变异性。 论文需在 Limitations
    中讨论此现象，并指出缓解方案（更大 batch size, 跨 batch smoothing）。 此场景超出 "uniform random injection"
    的基本假设，不影响核心 claim。

    '

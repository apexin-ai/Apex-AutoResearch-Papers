- name: Random reweighting baseline (ρ=0.4, Qwen3-0.6B, seed42)
  plan_id: p1_baseline_random_reweight
  description: 验证 detector signal 是改善的必要来源
  expected_results:
    eval_ppl_holdout: 17.695
    delta_vs_uniform: 0.005
    effective_behavior: random noise, slight degradation
  result_rationale: '随机权重不含 contamination 信号，等价于给 SGD 添加 per-sample 乘性噪声。 比 uniform
    略差（17.695 vs 17.690，+0.005），因随机权重增加梯度估计方差—— 部分真实样本被无端 downweight 而部分合成样本被 upweight。
    关键对照：adaptive 改善 0.04 PPL 确实来自 detector q-score 的 contamination 信号， 而非 reweighting
    本身的正则化效应（如 dropout-like 效果）。 "Detector signal is load-bearing" 是可量化的结论。

    '
  tables: []
  figures_description: []
  analysis: '随机 reweighting 无效甚至略有害，确认 detector signal 是改善来源。 论文中作为 "signal necessity"

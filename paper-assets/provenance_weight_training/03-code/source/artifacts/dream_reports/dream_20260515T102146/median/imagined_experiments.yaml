tier: median
narrative_guidance: 'Dual-constraint ≈ ESS-only（统计不可分，Δ < seed variance ~0.01），α_eff
  不提供独立的 empirical 性能贡献。 Reframe：dual-constraint 是 principled default——收敛理论指导 τ 选择
  + α_eff 提供最小干预语义， 性能等价但有理论 motivation。两种 adaptive 策略都消除 grid search（6N→1 runs），
  论文贡献重心从 "α_eff 带来更好性能" 转为 "adaptive b* 框架本身（含 ESS-only 变体）的实用价值 + dual-constraint
  提供有收敛理论支撑的推导框架，推荐为默认方案"。 τ sweep 证明 [0.6, 0.8] 宽泛可工作区域，但 τ=0.5/0.9 边界退化（+0.03-0.05
  PPL）， 不能声称全域不敏感。ρ=0.6 效应放大有限（Δ ≈ ρ=0.4），PPL 退化超线性（18.2-18.7 vs 17.69）， 说明 adaptive
  reweighting 在高污染下缓解能力有限。 Claim 1 降低 α_eff 独立贡献声称强度，Claim 2 不变，Claim 3 补充 τ 有效范围说明。
  补充亮点：lightweight detector sufficiency + batchsize 消融证明 n_min knife-edge 是 bs=4 artifact。

  '

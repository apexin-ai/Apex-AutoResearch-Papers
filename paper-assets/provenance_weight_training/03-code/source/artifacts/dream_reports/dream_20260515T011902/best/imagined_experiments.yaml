  figures_description:
  - 'Figure 8: n_min=4 点与 uniform baseline 重合'
  analysis: '完美的退化验证。n_min=4 → b*=0 → uniform，PPL 精确匹配。 这排除了任何 confounding factor，确认改善纯粹来自

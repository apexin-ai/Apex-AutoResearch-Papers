  analysis: 'PPL→downstream 转移验证了方法的实际价值。 MMLU +0.7%、HellaSwag +1.1% 绝对改善在 200M tokens
    的有限预训练下可观。 Self-BLEU 改善进一步证明 adaptive reweighting 减少了 model collapse 征兆（repetitive
    outputs）。

    Reviewer concern "does PPL matter for real tasks?" → 是的， 且效应在下游比 PPL 上更可测量（0.7-1.1%
    absolute vs 1.24% relative PPL）， 因为下游任务评估了不同维度的模型能力。

    论文表述："Adaptive b* improves not only perplexity but also downstream task performance,
    confirming that the cleaner gradient signal during pretraining transfers to measurable
    gains in knowledge recall (MMLU +0.7%) and commonsense reasoning (HellaSwag +1.1%)."'

    的最大化不再受 ESS 限制，b* 可以飙到很高值。

    结果是 b* 分布大幅右移：median 1.73 (vs n_min=2 的 0.87)，12.8% 的 batches b*>5。 在这些高 b* batches
    中，几乎所有 contaminated samples 权重趋近于零， 有效只有 1-2 个 clean samples 贡献梯度——gradient variance
    极高。

    PPL 17.668：比 n_min=2 的 17.650 差 0.018，但仍优于 uniform 17.690 (改善 0.022)。 方法没有彻底崩溃，因为多数
    batches 的 b* 仍在合理范围 (p25=0.71)， 只有极端 batches 出问题。这说明 n_min 在保护方法稳定性上是必要但阈值不需精确。


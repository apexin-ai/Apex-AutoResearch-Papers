    约束要求 每个 batch 的有效样本量 ≥ batch_size。由于 ESS 定义为 (Σw_i)²/Σw_i²， 对于 w=(1-q)^b，任何 b>0
    都会降低 contaminated samples 的权重， 从而使 ESS < batch_size。因此 b* 被强制钳制为 0。

    PPL = 17.690，与 uniform (17.690) 完全一致——验证了当 ESS 约束完全绑定时 算法正确退化为 uniform training。train_loss
    也与 uniform 一致 (7.31)。

    这是一个 sanity check：证明 adaptive b* 的改善确实来自非零的 b*（即 reweighting）， 而非算法实现中的其他副作用（如
    batch shuffling, gradient scaling 等）。

    '

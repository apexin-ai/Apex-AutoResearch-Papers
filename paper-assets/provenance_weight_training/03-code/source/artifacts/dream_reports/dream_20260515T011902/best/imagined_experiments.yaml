  - 'Figure 8 inset: b* distribution comparison across n_min values'
  analysis: 'n_min=1 验证了 ESS 约束的必要性：无约束下 b* 过高导致 gradient variance 增大， PPL 退化但不崩溃
    (仍优于 uniform)。 这支持 n_min=2 作为 sweet spot 的选择——既足够宽松允许有效 downweighting， 又足够紧来防止极端
    over-filtering。

    '

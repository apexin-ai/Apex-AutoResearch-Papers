    32.5% (+0.7 abs)。 机制：更干净的预训练 → factual knowledge 被更准确地编码， 而非被 synthetic data 的
    hallucinated facts 干扰。 δ=0.7% 在 [0.3, 1.5] 的 best 档范围内。

    HellaSwag (常识推理，0-shot)： Uniform 52.1%，adaptive 53.2% (+1.1 abs)。 改善比 MMLU 更大因为
    HellaSwag 更依赖 language model quality (sentence completion)， 而 PPL 正是 language
    model quality 的直接度量。 δ=1.1% 在 [0.3, 1.5] 范围内偏高，反映 3B 模型上的 amplified effect。

    Self-BLEU (generation diversity)： 0.42 → 0.38 (↓0.04)——更低 = 更多样。 Adaptive 减少了
    synthetic data 导致的 repetitive patterns，生成文本更多样。

    '
  tables:

  result_rationale: 'worst 档核心假设 A1："FM1 在 multi-run 中 retention >75%，原始 52.3% 是 outlier"。

    为什么 FM1 不复现：mvp-004 的 completion retention 52.3% 基于单 run n=19-20，variance 极高。
    7B-Instruct 在 tau-bench retail 的 baseline completion 本身只有 ~37%（mvp-004 baseline
    0.368）， calibrated variants 降至 10-26%。但这个 baseline 本身跨 run 波动大——hgate-dpo003-merged
    四个 run  的 base model completion 分别为 27.8%/15.0%/40.0%/35.0%（std=0.10）。如果新 3 runs
    的 baseline  略高（~41%），而 calibrated variants 在 32-35% 范围，retention 就会到 78-85%，远超
    80% 阈值。 原始 mvp-004 中 aave completion=0.100 很可能是一个极端低点——在 n=20 的二项分布下， true rate
    0.30 观测到 ≤2/20 的概率约 3.5%，不算 impossible 但确实是 tail event。

    为什么 FM2 不复现：cross-dim interference 的核心证据是 "pol -25.6% when targeting qrate"。 但
    question_rate baseline=0.044（~0.8 questions/task），absolute change 极小。 在 multi-run
    中，politeness 的 non-target shift 很可能在 ±8% 内波动， 方向不一致（有正有负），说明 mvp-004 观测到的 -25.6%
    是噪声放大。 新 runs 中 1/3 可能方向一致但量级 <10%，另 2/3 方向相反或接近零。 FM2 replication rate 仅 0.33，不足以
    claim "systematic"。

    FM3 部分存活：overcorrection rebound 在 hgate-dpo003-merged 已有 4/4 一致性（+4.2~+10.4pp），
    新 runs 中 3/4 仍会显示正向 rebound 但量级缩小至 1.5-2.8pp。 这是因为 7B 模型对极端 politeness target
    确实有一定的 attractor basin 效应， 但量级远不如 DPO+BCP 条件下显著。FM3 是 C1 唯一存活的 robust failure
    mode。

    整体影响：C1 taxonomy 从 "4 systematic failure modes" 变为 "1 robust (FM3) + 2 exploratory
    (FM1/FM2)"。 Reviewer 会认为 taxonomy claim 过度。

    '

  figures_description:
  - 'Fig: FM4 gap diff distribution — 7B vs 14B bootstrap density plot。7B 分布偏正（mean
    +0.155）但 CI 含 0；14B 分布几乎对称于 0（mean +0.035），两个 scale 的 overlap 区域大。视觉上无法区分 14B
    effect 与 noise。'
  - 'Fig: Scale-dependent failure mode heatmap (updated) — 加入 14B DPO 行。FM1/FM3/FM4
    全部在 14B 消失，仅 FM2 partial。Heatmap 强化 C3 narrative：所有 failure modes 都是 capacity-dependent。'
  analysis: 'plan_006 在 worst 档下不加固 C2，反而暴露 FM4 的 scale-dependence。

    核心问题：FM4 reversal 在 7B 上 p=0.07-0.08，已经是 borderline。 如果 14B 数据显示 reversal 方向不一致且
    p=0.18，Reviewer 的合理结论是： "FM4 reversal 可能是 small-sample artifact at 7B, not a robust
    finding。"

    C2 survival strategy：不再 claim FM4 是独立 failure mode，而是将其 absorb 进 C3： "DPO+BCP
    interaction, like all BCP failure modes, is scale-dependent —  significant only
    at 7B where BCP has strong (but misdirected) effects。" 这保留了 C2 的 narrative 价值（DPO
    interaction 是 interesting observation）， 但不再依赖它作为 core claim。

    Decision：在 worst 档下，plan_006 的 cost-benefit 不佳。 12.5h GPU + analysis time，换来的是
    C2 降级（但 C3 微加固）。 如果 GPU 时间紧张（ARR deadline 2026-05-25，仅 12 天）， 更好的投入是 plan_005b
    的 analysis 完成 + bootstrap CI 补完 + paper reframing。

    Paper reframe 后的 contribution structure： 1. C3（primary）: Scale-dependent calibration
    failure — robust, two scales, 4 runs each 2. C2（secondary, exploratory）: DPO+BCP
    interaction — suggestive at 7B, not replicated at 14B 3. C1（downgraded）: FM3 overcorrection
    rebound 是唯一 robust sub-claim；FM1/FM2 是 pilot observations 4. C4（analytical）: Safety-efficacy
    gap framing 不依赖 FM1/FM2 复现，仍然成立

    Reviewer estimated score: 2.0-2.8 range，point estimate 2.4。 EMNLP Findings borderline。Reframe
    质量决定是否过线。'

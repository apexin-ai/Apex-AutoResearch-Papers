tier: worst
narrative_guidance: 'FM1 不复现（原始 52.3% 是单 run outlier，multi-run 均值 75-95%）；FM4 无统计支撑（p>0.10，CI
  含 0）。 C1 taxonomy 从 4 failure modes 塌缩至 1 个 robust（FM3）+ 2 个 exploratory。 核心叙事必须
  reframe 为 scale-dependent calibration paradox（C3）+ DPO interaction exploratory（C2
  降级）。 FM1/FM2 降为 "observed in single-run pilot, not consistently replicated"。 若有
  GPU 余量，优先 plan_006（14B DPO）加固 C2，而非继续在 7B base BCP 上投入。

  '

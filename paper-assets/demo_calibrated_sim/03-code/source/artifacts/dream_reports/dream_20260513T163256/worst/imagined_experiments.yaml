  figures_description:
  - 'Fig: FM1 completion retention 4-run scatter plot — 原始 mvp-004 (52.3%) 显著偏离其余三个
    run（78-85%），视觉上明确是 outlier。加 mean ± 1σ band 显示 mvp-004 落在 ~2σ 外。'
  - 'Fig: FM2 cross-dim interference direction consistency — 4-run bar chart 显示 politeness
    shift when targeting qrate，3/4 runs 在 ±8% 内，仅 mvp-004 达到 -25.6%。无法 claim systematic。'
  analysis: 'Multi-run 数据摧毁 FM1 和 FM2 作为 "systematic failure mode" 的地位。

    FM1：4-run mean retention 74.6% 虽然仍低于 80% threshold，但 std=15% 且 mvp-004 是明显 outlier。
    如果排除 mvp-004，3-run mean=82.0%，FM1 完全消失。Reviewer 会要求排除 outlier 或至少报告 without-outlier
    结果，此时 FM1 不成立。即使保留 4-run mean，CI 宽到包含 80%，无法 reject null。

    FM2：方向不一致是致命伤。4 runs 中仅 1 run（原始 mvp-004）显示强 interference， 其余 3 runs 量级 <8% 且方向混杂。这意味着
    cross-dim interference 更可能是 小样本噪声而非 systematic mechanism。Paper 不能 claim FM2 为独立
    failure mode。

    FM3 存活但弱化：方向一致性 4/4 保持，但量级从 hgate-dpo003-merged 的 +7.2pp 缩小至 base BCP 条件下 +2.75pp
    mean。仍然是 positive signal，可 claim "directional evidence"， 但远不如 DPO+BCP 条件下的 +7.2pp
    有说服力。

    对 paper 的影响： - C1 必须从 "taxonomy of 4 failure modes" 降级为 "two robust findings +
    exploratory observations" - 标题中 "taxonomy" 一词可能需要删除或弱化为 "failure patterns" - FM1/FM2
    在 paper 中降至 Appendix 或 "pilot observations" 段落 - 核心贡献重心转移至 C3 (scale-dependent
    calibration failure) 和 C2 (DPO interaction) - Reviewer estimated score: 2.5（Findings
    borderline，需要 reframe 后才有机会）

    '
- name: 14B DPO + BCP (scale-dependent FM4?)
  plan_id: plan_006
  description: '14B scale DPO training + BCP evaluation。测试 FM4（DPO+BCP reversal）是否
    scale-dependent。 需要 14B DPO training（~11-13h GPU）+ 4 runs × 6 variants × 20 tasks
    eval。 Contingent on GPU availability。

    '
  expected_results:
    dpo_training_loss_14b: 0.661
    dpo_training_acc_14b: 0.72-0.95
    dpo_training_time_hours: 12.5
    mean_completion_14b_dpo_merged: 0.58
    mean_baseline_politeness_14b_dpo: 0.53
    h2_pass_rate: 0/4
    h3_pass_rate: 3/4
    fm4_gap_diff_aave_14b: 0.035
    fm4_gap_diff_indian_14b: 0.028
    fm4_gap_diff_p_value: 0.18
    fm4_gap_diff_ci_lower: -0.08
    fm4_gap_diff_ci_upper: 0.16
    fm4_reversal_consistent_runs: 2/4
    fm4_gap_expansion_count: 5/12
    fm3_14b_dpo_rebound: -0.02
    fm1_14b_dpo_completion_retention: 0.93
    c3_14b_completion_mean: 0.62
    reviewer_estimated_score: 2.4
  result_rationale: "worst 档假设 A6：\"C2 需要 14B DPO 但无时间做\"。即使做了，worst 档下结果也不支持 C2 加固。\n\
    为什么 FM4 reversal 在 14B 弱化/消失：\n1. 14B base BCP 的 failure mode 是 \"selective ignoring\"\
    ——模型本身就不响应 BCP calibration。\n   DPO 不太可能 reverse 一个本来就不存在的 BCP effect。7B 的 FM4\
    \ 之所以显著，\n   是因为 BCP 在 7B 上确实产生了强烈（但错误方向的）calibration effect，DPO 再反转它。\n   14B\
    \ 上 BCP effect 接近零，DPO+BCP interaction 自然也接近零。\n\n2. 14B 的 DPO training 效果预期弱于\
    \ 7B：14B 参数量更大，LoRA r=16 的相对 perturbation 更小，\n   training 收敛更慢。预期 acc 0.72-0.95（vs\
    \ 7B 的 0.75-1.0），learning signal 略弱。\n\n3. Gap diff 量级小且统计不显著：14B base BCP 已经显示\
    \ politeness gap 很小（因为模型 ignore BCP），\n   DPO+BCP 的 gap 也会在同一小范围内波动。Gap diff 预期\
    \ 0.028-0.035，\n   远小于 7B 的 0.155-0.161。p_value 0.18，CI 宽且含 0。\n   2/4 runs 显示\
    \ reversal 方向，另 2/4 方向相反——不一致。\n   Gap expansion count 5/12，接近 random（50%）。\n\n\
    4. 对 C2 claim 的影响：如果 FM4 在 14B 也不 replicate，C2 的 claim 从\n   \"DPO+BCP interaction\
    \ reversal\" 降级为 \"7B-specific interaction effect\"。\n   结合 7B 的 bootstrap CI\
    \ 已经 p=0.07-0.08 且 CI 含 0，\n   Reviewer 会认为 FM4 整体 evidence 不足：\n   - 7B: 方向一致但统计不显著\n\
    \   - 14B: 方向不一致且不显著\n   这意味着 C2 可能从 \"strong evidence\" 降级为 \"suggestive but\
    \ underpowered\"。\n\n5. 为什么仍然做（如果有 GPU）：即使 worst 结果，14B DPO 数据仍然有价值——\n   它确认\
    \ FM4 的 scale-dependence，这本身加强了 C3 的 narrative。\n   C3 可以 absorb FM4：\"所有 BCP\
    \ failure modes（包括 DPO interaction）都是 scale-dependent。\"\n   但 GPU cost 12.5h\
    \ 在 deadline 前（ARR 2026-05-25）可能不值得。\n"

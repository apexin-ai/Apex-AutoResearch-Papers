    mean_baseline_question_rate: 0.04
    h1_pass_rate: 4/4
    h2_pass_rate: 0/4
    h3_pass_rate: 4/4
    fm4_14b_aave_gap_mean_pp: 1.8
    fm4_14b_indian_gap_mean_pp: 2.4
    fm4_14b_overcorrected_gap_mean_pp: -1.0
    fm4_14b_pooled_reversal_mean_pp: 1.1
    fm4_14b_h2_gap_reduction_pct: -3.1

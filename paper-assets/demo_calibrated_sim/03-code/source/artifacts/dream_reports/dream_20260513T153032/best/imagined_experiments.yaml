  figures_description:
  - 'Scale-dependent failure severity heatmap (4×2 grid): rows = FM1-FM4, columns
    = 7B/14B. Color-coded red (catastrophic) → orange (moderate) → yellow (weak) →
    green (absent). At 7B: FM1 red, FM2 orange, FM3 red, FM4 red. At 14B: FM1 green,
    FM2 yellow, FM3 green, FM4 yellow. Gradient runs consistently from severe-left
    to mild-right, visualizing the unified scale-dependency pattern.

    '
  - 'FM4 reversal comparison panel: side-by-side violin plots of per-episode politeness
    gap distributions at 7B and 14B DPO+BCP. 7B distribution clearly shifted positive
    (reversed); 14B distribution centered near zero with wide spread. Horizontal dashed
    line at zero separates correct/reversed direction. 95% CI annotations on each.

    '

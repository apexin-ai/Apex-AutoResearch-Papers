    run1_indian_gap: 0.075
    run1_overcorrected_gap: -0.003
    run2_aave_gap: -0.021
    run2_indian_gap: -0.008
    run2_overcorrected_gap: -0.012
    run3_aave_gap: -0.006
    run3_indian_gap: -0.015
    run3_overcorrected_gap: -0.008
    run4_aave_gap: 0.037
    run4_indian_gap: 0.044
    run4_overcorrected_gap: -0.018
    fm1_14b_dpo_replicated: false
    fm1_14b_dpo_completion_retention: '>95% of baseline'
    fm3_14b_dpo_replicated: false
    fm3_14b_dpo_overcorrected_vs_baseline_pp: -1.0
    fm2_14b_dpo_interference_pol_pp: -3.8
    fm2_14b_dpo_interference_qrate_pp: -1.9
    fm4_7b_reversal_mean_pp: 15.8
    fm4_14b_reversal_mean_pp: 1.1
    fm4_attenuation_pp: 14.7
    fm4_attenuation_95ci_pp:
    - 8.1
    - 21.6
    fm4_attenuation_excludes_zero: true
  result_rationale: '14B DPO training achieves effective but slightly lower learning
    signal than 7B (accuracy 0.70-0.88 vs 0.75-1.0) because the 14B model''s baseline
    behavior is already closer to the DPO target distribution — there is less distributional
    distance for the preference pairs to close. Loss converges to 0.658 (vs 0.653
    at 7B), still well below random (0.693), confirming effective learning.

    FM4 reversal is attenuated at 14B (4/12 directional consistency, near chance level,
    vs 10/12 at 7B) because the mechanism requires BCP prompts to create a strong
    behavioral signal that DPO then reverses. At 14B, qwen14b-bcp-001 established
    that BCP is "selectively ignored" — the model maintains default behavior regardless
    of calibration prompts. When BCP has no behavioral effect to begin with, DPO has
    nothing to interact with adversarially. The 14B DPO model simply continues to
    ignore BCP in the same way the base 14B model does, producing near-zero politeness
    gaps (+1.8pp AAVE, +2.4pp Indian) that are directionally ambiguous. The pooled
    reversal of +1.1pp has a bootstrap CI of [-1.6, +5.9] that includes zero — confirming
    the reversal is not statistically significant at 14B.

    The cross-scale attenuation of 14.7pp (7B at 15.8pp vs 14B at 1.1pp) IS statistically
    significant (CI [8.1, 21.6] excludes zero), confirming FM4 is capacity-dependent.
    This is the key result: FM4 joins FM1 and FM3 as failure modes that are severe
    at 7B but absent/attenuated at 14B.

    Completion stays high (~59.2%) because DPO doesn''t harm 14B tool-calling ability.
    At 7B, DPO improved completion from 40% to 60% (diag-lora-merge). At 14B, the
    baseline is already 61.6%, so there is a ceiling effect — the marginal DPO benefit
    is small and masked by run-to-run noise. H3 passes 4/4.

    H2 still fails 0/4: DPO does not create calibration at 14B any more than BCP alone
    did. This closes both calibration paradigms (prompt-time and training-time) at
    both scales — the safety-efficacy gap holds comprehensively.

    FM1 and FM3 remain absent at 14B DPO, exactly matching qwen14b-bcp-001. DPO does
    not reintroduce completion collapse or overcorrection rebound at the larger scale.
    FM2 shows continued weak interference (-3.8pp politeness shift when targeting
    question_rate), confirming FM2 is the only mechanism that persists — attenuated
    but nonzero — at 14B across both base and DPO conditions.

    '

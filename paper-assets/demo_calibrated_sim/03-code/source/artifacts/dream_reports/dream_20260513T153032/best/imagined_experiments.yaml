  analysis: 'The 14B DPO result is the strongest possible outcome for the paper narrative.
    It promotes FM4 from "documented at single scale" to "confirmed scale-dependent,"
    completing the taxonomy: all four failure modes show capacity-dependent severity.

    The updated story becomes: "We document four calibration failure mechanisms, all
    more severe at 7B. FM1 and FM3 disappear at 14B (catastrophic effects are capacity-gated).
    FM2 and FM4 persist weakly but are no longer statistically significant at 14B.
    Yet calibration remains ineffective at both scales (H2 fails at both). Scaling
    is necessary for safety but insufficient for calibration."

    This closes every obvious reviewer attack: (1) "Would DPO work at larger scale?"
    — No, H2 still fails. (2) "Is FM4 structural or capacity-dependent?" — Capacity-
    dependent, with statistical evidence. (3) "Is your taxonomy just 7B artifacts?"
    — FM2 persists at 14B; the rest are confirmed capacity-dependent with clean scale
    comparison. (4) "What about combining DPO+BCP at scale?" — Done; interaction vanishes
    because BCP itself is ignored at 14B.

    The safety-efficacy gap now generalizes across both calibration paradigms and
    all four failure modes. Estimated acceptance probability for EMNLP Findings with
    full plan_005 + plan_006 data: 70-75%, limited primarily by single model family
    (Qwen2.5).'

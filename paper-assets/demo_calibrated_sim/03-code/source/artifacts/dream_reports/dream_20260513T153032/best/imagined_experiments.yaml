tier: best
narrative_guidance: 'Original framing at full strength. Bootstrap CIs statistically
  validate all four failure mechanisms; 14B DPO reveals FM4 reversal is also scale-dependent
  (attenuated from 10/12 to 4/12 directional consistency, CI includes zero). Taxonomy
  stands as four well-separated mechanisms — all showing capacity-dependent severity
  — with C3 (scale-dependent failure severity) as the highlight contribution. Title
  1 works. Paper story: "every calibration failure we document is more severe at 7B
  than 14B, yet none disappears — scaling changes how calibration fails, not whether
  it fails." Claims need no hedging beyond standard single-family limitation.

  '
imagined_experiments:
- name: Bootstrap CI for Key Comparisons
  plan_id: plan_005
  description: 'Non-parametric bootstrap (B=10000, episode-level resampling with BCa
    correction) for five core statistics: (1) FM4 DPO+BCP gap reversal magnitude,
    (2) FM3 overcorrection rebound magnitude, (3) 7B-vs-14B completion difference,
    (4) FM2 politeness non-target shift, (5) FM4 directional sign consistency. CPU-only,
    ~2h wall time on available hardware. Uses existing data from mvp-004, hgate-dpo003-merged,
    qwen14b-bcp-001.

    '
  expected_results:
    fm4_reversal_mean_pp: 15.8
    fm4_reversal_95ci_pp:
    - 10.2
    - 21.8
    fm4_reversal_excludes_zero: true
    fm4_sign_test_p: 0.006
    fm4_directional_consistency_bootstrap: 10/12 (83.3%); bootstrap median 10/12,
      95% range [8/12, 12/12]
    fm3_rebound_mean_pp: 7.23
    fm3_rebound_95ci_pp:
    - 3.8
    - 10.6
    fm3_rebound_excludes_zero: true
    fm3_run_consistency: 4/4 positive direction
    scale_completion_diff_mean_pp: 24.8
    scale_completion_diff_95ci_pp:
    - 16.4
    - 33.2
    scale_completion_excludes_zero: true
    fm2_pol_nontarget_shift_mean_pct: -25.6
    fm2_pol_nontarget_shift_95ci_pct:
    - -30.1
    - -20.8
    fm2_pol_nontarget_shift_excludes_zero: true
    fm2_qrate_arm_note: 'question_rate arm reported as descriptive with absolute values
      only. Baseline 0.044 (0.8 questions/task); single_dim_politeness 0.021. 52.3%
      relative drop = -2.3pp absolute. Paper reports both to preempt base-rate critique.

      '
    h2_best_gap_reduction_pct: 27.6
    h2_best_gap_reduction_95ci_pct:
    - 18.3
    - 35.2
  result_rationale: 'FM4 reversal CI [10.2, 21.8]pp excludes zero because the swing
    from base BCP (mean gap -9.5pp correct direction) to DPO+BCP (mean gap +6.4pp
    reversed) is ~15.8pp — massive relative to run-to-run variance. Only 2/12 variant×run
    checks showed contraction (run 3 Indian at +6.8 gap_change; run 4 AAVE at +5.9
    gap_change), meaning even the "worst" bootstrap resamples still contain 8+ expansion
    cells. Sign test p=0.006 under binomial null (10/12 successes, p=0.5).

    FM3 rebound CI [3.8, 10.6]pp excludes zero because all 4 runs show overcorrected
    politeness above baseline — the weakest run (run 2, +4.23pp) is already 4× the
    margin needed to exclude zero. Episode-level resampling within each run creates
    variance but cannot flip all four run-level signs simultaneously.

    Scale completion CI [16.4, 33.2]pp reflects a 24.8pp gap where within-scale variance
    (14B: 55.0-73.7%; 7B: 15.0-40.0%) is large but the between-scale gap is ~2.5×
    the within-scale SD. Even the most pessimistic bootstrap replicate (worst 14B
    run vs best 7B run) still shows 55.0-40.0 = +15pp.

    FM2 politeness shift CI [-30.1, -20.8]% is tight despite n=20 because the effect
    size is enormous: single_dim_question politeness (0.416) is 14.3pp below baseline
    (0.559), representing a >2 SD shift. Per-episode politeness scores in the single_dim_question
    condition cluster tightly below baseline with almost no overlap.

    '

  figures_description:
  - 'Forest plot: horizontal 95% CI bars for all five comparisons, vertical dashed
    line at zero. All CIs fall entirely on one side of zero. FM4 reversal bar is furthest
    from zero; FM2 pol shift is tightest. Conveys statistical significance at a glance.

    '
  - 'Bootstrap distribution panel (2×2): histograms of 10000 bootstrap replicates
    for FM4 reversal, FM3 rebound, scale completion diff, FM2 pol shift. Observed
    statistic marked with solid vertical line; shaded 95% CI region. Zero marked with
    dashed red line — visibly outside all four distributions.

    '
  analysis: 'All CIs exclude zero, converting directional-consistency arguments into
    proper statistical claims. This comprehensively addresses RC2 (statistical power
    concern). FM4 reversal has the strongest signal (CI lower bound at +10.2pp, >5×
    margin from zero). FM3 rebound is weakest in absolute terms but still significant
    (lower bound +3.8pp). The scale completion difference is unambiguous. FM2 politeness
    arm is robust; the question_rate arm is honestly reported as descriptive with
    absolute values. These CIs provide the statistical backbone that upgrades the
    taxonomy from "consistent directional patterns" to "statistically confirmed mechanisms."

    '
- name: 14B DPO + BCP (scale-dependent FM4?)
  plan_id: plan_006
  description: 'Two-phase experiment. Phase A: DPO fine-tuning of Qwen2.5-14B-Instruct
    on 1434 dialect-calibrated preference pairs (same pairs as 7B dpo-003), LoRA r=16
    on q_proj/v_proj, FP16 TP=2, 2× RTX 4090, ~7.5h training, 3 epochs. Phase B: BCP
    evaluation of weight-merged 14B DPO model, 4 runs × 6 variants × 20 tasks = 480
    episodes, ~5h inference. Tests whether FM4 (DPO+BCP reversal) is also scale-dependent
    or persists at 14B.

    '
  expected_results:
    dpo_14b_final_loss: 0.658
    dpo_14b_rewards_accuracy_range:
    - 0.7
    - 0.88
    dpo_14b_rewards_margin_range:

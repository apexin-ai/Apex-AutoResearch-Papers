narrative_guidance: '放弃 taxonomy 框架。重新定位为警示性实证研究：''Prompt-based and training-based
  calibration are unreliable for behavioral correction in agentic user simulation
  — here is the evidence.'' 领头的两个无争议效应：FM1 completion collapse（7B completion 下降 72.8%，该量级不需要
  CI）和 C3 scale-dependent severity（7B 灾难性 vs 14B 免疫但未校准）。FM4 reversal 作为次要发现，强调 10/12
  方向一致性而非效应量。FM2 和 FM3 不再作为命名机制——残余证据折叠进 ''BCP perturbation produces unpredictable
  side effects'' 段落。标题改为 ''Calibration Considered Harmful? Evidence That Behavioral
  Correction Fails Across Scales in LLM User Simulation.'' 仍然投 Findings，但作为 empirical
  warning paper，不是 taxonomy paper。 plan_005b 的多 run 数据在 worst 档下反而暴露 FM2/FM3 的不稳定性，为
  reviewer 提供弹药。 plan_005 的 Bootstrap CI 让 FM3 和 FM4 的 CI 都跨零，仅 scale completion difference
  和 FM1 collapse 幸存。plan_006 因 GPU 不可用未执行，C2 reversal 停留在单 scale 证据， reviewer 可攻击
  ''maybe reversal is a 7B artifact''。预估接收率 10-25%。

  '

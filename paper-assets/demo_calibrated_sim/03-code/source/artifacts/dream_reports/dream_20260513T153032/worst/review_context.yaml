  result_rationale: 'FM1（completion collapse）在 worst 档下仍然复现：aave/indian completion
    在所有 run 均远低于 80% baseline retention 阈值，因为 7B 模型处理 BCP prompt 时的 capacity bottleneck
    是结构性的——BCP 指令与 16-tool tau-bench 系统 prompt 竞争有限的注意力容量，导致 tool-calling 能力系统性退化。这与
    basil2025 persona-accuracy trade-off 一致，不依赖采样运气。

    FM2（cross-dim interference）在 multi-run 下暴露为高方差伪影：politeness non-target shift 在
    4 runs 中 SD=13.1%，2/4 runs 仅显示 -3.8% 和 -4.0% 的微弱干扰。根因是 BCP prompt 的任何 variant
    都引入额外指令负载，politeness 波动可能是 FM1 completion collapse 的附带效应 （任务失败的对话自然呈现不同 politeness
    分布），而非独立的 cross-dim 传导机制。question_rate non-target arm 更弱——base rate 0.044 意味着绝对变化
    <0.025 questions/task，4-run 均值 absolute Δ=−0.012，bootstrap CI 跨零。Reviewer 攻击面：''FM2
    is FM1 in disguise —  completion collapse changes the conversation distribution,
    politeness shift is  an epiphenomenon, not a causal cross-dimension mechanism.''

    FM3（overcorrection rebound）在 base BCP 条件下崩塌：4 runs 中仅 2 runs 显示正向 rebound （+4.6pp,
    +3.0pp），另 2 runs 显示 overcorrected politeness 反而低于 baseline（−3.0pp, −3.0pp）。均值
    +0.4pp 与零无区别。这表明 mvp-004 单 run 的 +4.6pp rebound 是采样噪声。 注意 FM3 在 DPO+BCP（hgate-dpo003-merged）的
    4/4 一致性更强（+7.2pp mean），但 base BCP 的不一致性削弱了 ''rebound 是 BCP 的固有机制'' 这一叙事——reviewer
    会说 ''rebound only appears  when DPO is involved, so it is a DPO artifact, not
    a BCP failure mode.''

    净效应：multi-run 数据确认 FM1 但击溃 FM2 和 FM3 作为 base BCP 的独立命名机制。Taxonomy 从 4 个 failure
    mode 缩水到实质 2 个（FM1 + FM4），支撑 worst tier 的叙事转向。

    '

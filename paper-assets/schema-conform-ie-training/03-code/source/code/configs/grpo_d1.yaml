# D1: F1-dominant weights (75:25), no GDPO
# Tuning from B: raise F1 weight, remove GDPO normalization
# Hypothesis: conformance as soft regularizer rather than equal partner
model_name: "/root/autodl-tmp/models/Qwen/Qwen3.5-9B"
output_dir: "./output/grpo_d1"
run_name: "grpo-d1-f1-dominant"

# GRPO generation
num_generations: 8
max_new_tokens: 1024
max_prompt_length: 1536

# Training
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

# Reward — F1-dominant, simple weighted sum (no GDPO)
use_gdpo: false
reward_weights:
  f1_correctness: 0.75
  structural_validity: 0.05
  type_conformance: 0.08
  relational_constraint: 0.08
  structural_completeness: 0.04

# LoRA
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Reward hacking detection
hacking_warmup_samples: 200

# Logging
report_to: "wandb"
wandb_project: "schema-conform-ie"
logging_steps: 10
save_steps: 100
seed: 42

# Baseline: GRPO with F1 reward only (no schema-conformance rewards)
# Target: RTX PRO 6000 96GB, LoRA + gradient checkpointing
model_name: "Qwen/Qwen3.5-9B"
output_dir: "./output/grpo_baseline"
run_name: "grpo-f1-baseline"

# GRPO generation
num_generations: 8
max_new_tokens: 1024
max_prompt_length: 1536

# Training — LoRA on 96GB VRAM (model 18GB + ref 18GB + LoRA optim ~2GB ≈ 40GB)
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

# Reward
use_gdpo: false
reward_weights:
  f1_correctness: 1.0
  structural_validity: 0.0
  type_conformance: 0.0
  relational_constraint: 0.0
  structural_completeness: 0.0

# LoRA
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Reward hacking detection
hacking_warmup_samples: 200

# Logging
report_to: "wandb"
wandb_project: "schema-conform-ie"
logging_steps: 10
save_steps: 100
seed: 42

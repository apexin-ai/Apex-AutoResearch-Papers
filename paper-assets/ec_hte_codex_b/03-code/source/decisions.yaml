_next_id: 15
decisions:
- id: D001
  date: 2026-05-31 15:38 UTC
  summary: Proceed from e001 smoke validation to budgeted confusion estimation
  rationale: e001 supports the core mechanism that pooled/global correction can worsen
    subgroup CATE RMSE under positive misclassification-CATE alignment, but it used
    oracle confusion matrices. The next required evidence is finite-budget confusion
    estimation comparing global, independent subgroup, and partial-pooling estimators
    under B={100,500,1000,2000}.
  related_experiments:
  - exp_id: e001_global_correction_smoke
    role: evidence
    result: 'success: positive-correlation global RMSE 0.09026 vs uncorrected 0.06739;
      subgroup-specific RMSE 0.05861; global worse in 91.5% of replications'
  depends_on: []
- id: D002
  date: 2026-05-31 16:04 UTC
  summary: Treat e002 Stage 1 budgeted confusion estimation as successful and proceed
    to inference coverage ablation
  rationale: Current registry and remote logs show e002/r1 completed with EXIT_CODE=0
    and registry-backed metrics. Canonical e002 (n=5000, reps=200) shows partial pooling
    has lower CATE RMSE than global correction at all budgets and lower CATE RMSE
    than independent subgroup estimation at all budgets, especially B=100. The initial
    launcher failures were infrastructure errors, not method failures. The next research
    gap is Stage 2 interval validity.
  related_experiments:
  - exp_id: e002_budgeted_confusion_estimation
    role: primary evidence
    result: 'success: partial pooling CATE RMSE beats global by -0.00156/-0.00455/-0.00634/-0.00707
      for B=100/500/1000/2000 and beats independent at all budgets'
  - exp_id: e002_budgeted_confusion_estimation_r1
    role: repeat
    result: 'success: duplicate n=5000/reps=200 rerun after infrastructure fixes'
  - exp_id: e002_budgeted_confusion_estimation_retry1
    role: robustness
    result: 'success: larger n=10000/reps=300 run supports partial-vs-global trend'
  depends_on:
  - D001
- id: D003
  date: 2026-05-31 16:11 UTC
  summary: Treat e003 inference coverage ablation as negative and pause automatic
    next experiment
  rationale: e003 completed with EXIT_CODE=0 across B={100,500,1000,2000}. Empirical
    95% coverage remained below target for all methods and budgets. Sandwich adjustment
    only improved coverage over naive by 0 to 0.00083, while bootstrap was worse at
    B=100/500, tied at B=1000, and only better at B=2000. This does not support the
    hypothesis that current sandwich/bootstrap uncertainty propagation materially
    fixes coverage.
  related_experiments:
  - exp_id: e003_inference_coverage_ablation
    role: negative evidence
    result: 'coverage: B100 naive 0.9142, sandwich 0.9150, bootstrap 0.9117; B500
      0.9292/0.9292/0.9250; B1000 0.9375/0.9383/0.9375; B2000 0.9400/0.9408/0.9458'
  depends_on:
  - D002
- id: D004
  date: 2026-05-31 16:14 UTC
  summary: After e003 negative, run bias/coverage decomposition before proposing a
    new CI method claim
  rationale: 'Verified subgroup diagnostics show undercoverage concentrates in the
    highest CATE/highest error subgroup: group5 coverage remains 0.790/0.840/0.865/0.880
    for naive at B=100/500/1000/2000, while group0 coverage is 0.960/0.965/0.975/0.975.
    Group5 intervals are already widest but retain negative bias (-0.1335 to -0.0624),
    so the next experiment should decompose point-estimate bias versus variance propagation
    rather than merely increasing variance terms.'
  related_experiments:
  - exp_id: e003_inference_coverage_ablation
    role: negative evidence
    result: 'negative: simple sandwich/bootstrap did not reliably improve coverage;
      undercoverage concentrated in high error/high CATE group5 despite wider intervals'
  depends_on:
  - D003
- id: D005
  date: 2026-05-31 16:22 UTC
  summary: Classify e004 as diagnostic success, not deployable inference fix
  rationale: e004 supports the diagnosis that e003 undercoverage is driven by residual
    point-estimate bias in the high CATE/high annotation-error subgroup. Oracle confusion
    reduces group5 bias from -0.1384/-0.1125/-0.0920/-0.0677 to about -0.0098 and
    raises group5 coverage to 0.95 across budgets. However, the implemented estimated
    partial-pooling bias correction does not reliably improve group5 coverage (-0.005,
    -0.005, 0.000, +0.015 across B=100/500/1000/2000), so e004 does not validate a
    deployable bias-correction or CI method.
  related_experiments:
  - exp_id: e004_coverage_bias_decomposition
    role: diagnostic evidence
    result: 'diagnostic_success: oracle confusion closes much of group5 coverage gap;
      estimated bias correction does not reliably help'
  depends_on:
  - D004
- id: D006
  date: 2026-05-31 16:23 UTC
  summary: Proceed from e004 diagnostic to targeted expert-label allocation
  rationale: e004 shows oracle confusion closes the high-error group5 coverage gap,
    while post-hoc estimated bias correction does not. The next actionable mechanism
    is to improve Stage 1 confusion estimation for the high-error/high-CATE subgroup
    through allocation rather than further variance widening or unvalidated bias correction.
  related_experiments:
  - exp_id: e004_coverage_bias_decomposition
    role: diagnostic evidence
    result: 'diagnostic_success: oracle group5 coverage 0.95 across budgets; estimated
      raw group5 coverage 0.82/0.89/0.905/0.91; estimated bias correction unreliable'
  depends_on:
  - D005
- id: D007
  date: 2026-05-31 16:32 UTC
  summary: Treat e005 targeted allocation as success-with-tradeoff and run capped/hybrid
    allocation follow-up
  rationale: e005_targeted_expert_allocation improved high-error/high-CATE group5
    coverage and reduced residual negative bias at all budgets, reaching group5 coverage
    0.95 at B=2000, but overall CATE RMSE worsened versus uniform at every budget
    (+0.00451/+0.00154/+0.00218/+0.00250). This supports targeted allocation as a
    mitigation direction but not strict dominance, so the next mechanism test should
    constrain targeted allocation with caps or uniform-targeted hybrids to preserve
    subgroup coverage gains while reducing global RMSE cost.
  related_experiments:
  - exp_id: e005_targeted_expert_allocation
    role: primary_evidence
    result: group5 coverage uniform 0.825/0.875/0.905/0.925 vs cate_error_product
      0.865/0.900/0.920/0.950 at B=100/500/1000/2000; overall CATE RMSE delta vs uniform
      +0.00451/+0.00154/+0.00218/+0.00250
  depends_on:
  - D006
- id: D008
  date: 2026-05-31 16:43 UTC
  summary: Treat e006 capped/hybrid allocation as negative and run multiseed allocation
    stability diagnostic
  rationale: 'e006_capped_hybrid_allocation failed the D007 dual target: capped/hybrid
    variants reduced part of the overall RMSE penalty but did not preserve group5
    coverage gains. At B=2000, uniform group5 coverage was 0.945, while cate_error_product/capped25/capped35
    were 0.940 and hybrids were 0.930/0.935. This conflicts with e005 where cate_error_product
    reached group5 coverage 0.950 and improved over uniform. The next required step
    is therefore not another allocation design but a stability diagnostic over seeds/spec
    differences to determine whether the e005 benefit is robust or seed-sensitive.'
  related_experiments:
  - exp_id: e006_capped_hybrid_allocation
    role: negative_evidence
    result: B2000 target_check=false for all methods; cate_error_product/capped25/capped35
      group5 coverage=0.940 vs uniform 0.945; RMSE deltas vs uniform +0.001277/+0.001269/+0.001238
  - exp_id: e005_targeted_expert_allocation
    role: conflicting_prior_evidence
    result: B2000 cate_error_product group5 coverage=0.950 vs uniform 0.925, but RMSE
      delta vs uniform +0.002498
  depends_on:
  - D007
- id: D009
  date: 2026-05-31 16:50 UTC
  summary: Close targeted allocation branch as seed-sensitive and shift next experiment
    to Stage 1 DGP robustness
  rationale: 'e007_allocation_stability_multiseed showed targeted allocation gains
    are not stable enough for a robust allocator claim: cate_error_product B2000 coverage
    delta mean was positive (+0.015) but sign-changing=true with target_pass_rate=0.4;
    capped25 was also sign-changing with target_pass_rate=0.5, and the best target_pass_rate
    was only 0.7. Together with e006 negative, this means e005 should be reported
    only as a single-seed success-with-tradeoff. The next productive experiment is
    to return to the stronger Stage 1 evidence from e002 and test whether partial-pooling
    confusion estimation remains beneficial across DGP regimes before writing internal
    report claims.'
  related_experiments:
  - exp_id: e007_allocation_stability_multiseed
    role: negative_evidence
    result: B2000 cate_error_product coverage delta mean +0.015, sign_changing=true,
      target_pass_rate=0.4; capped25 sign_changing=true; hybrid70 target_pass_rate=0.7
      but smaller gain
  - exp_id: e006_capped_hybrid_allocation
    role: negative_evidence
    result: all B2000 target_check=false; coverage gain not preserved
  - exp_id: e002_budgeted_confusion_estimation
    role: next_branch_basis
    result: partial-pooling CATE RMSE lower than global/independent across B={100,500,1000,2000}
      in primary DGP
  depends_on:
  - D008
  - D002
- id: D010
  date: 2026-05-31 16:58 UTC
  summary: Treat e008 Stage 1 robustness as mixed and test regime-aware estimator
    selection
  rationale: 'e008_stage1_dgp_robustness did not support a broad claim that partial-pooling
    uniformly beats global and independent across DGPs: partial won 25/54 grid-budget
    tests and lost all negative-correlation cells to independent (0/18). However,
    it retained a useful mechanism boundary: it beat global on average and was strong
    in high-severity/positive-correlation cells (5/6). The next step is to convert
    this condition-specific evidence into a practical regime-aware selector that chooses
    partial-pooling when the pilot data suggests a positive/zero or high-severity
    regime, and independent estimation when pilot proxies suggest negative CATE-error
    correlation.'
  related_experiments:
  - exp_id: e008_stage1_dgp_robustness
    role: mixed_evidence
    result: partial win count 25/54; high severity + positive correlation 5/6; negative
      correlation 0/18; mean partial-global RMSE delta B500 -0.00959, B2000 -0.01360;
      mean partial-independent delta B500 -0.00178, B2000 -0.00139
  depends_on:
  - D009
- id: D011
  date: 2026-05-31 17:09 UTC
  summary: Treat e009 as deployable regime-aware selector success and validate threshold
    stability next
  rationale: 'Registry-backed e009 shows the two deployable selector rules mostly
    tie or beat the better fixed estimator across 54 grid-budget tests: pilot_corr_selector
    win/tie/loss=10/37/7 and pilot_corr_severity_selector=9/40/5. The e008 negative
    boundary is narrowed because negative-correlation failures drop to 1/18 and high-positive
    loss is 0/6. This supports shifting Stage 1 from fixed partial-pooling to a deployable
    regime-aware selector, but the rule should be stress-tested across seeds and threshold
    choices before writing a strong deployment claim.'
  related_experiments:
  - exp_id: e009_regime_aware_estimator_selection
    role: primary
    result: 'success: pilot_corr_selector 10/37/7, pilot_corr_severity_selector 9/40/5
      over 54 tests; negative-correlation failure 1/18; high-positive loss 0/6'
  - exp_id: e008_stage1_dgp_robustness
    role: parent
    result: 'negative/mixed: fixed partial-pooling is condition-specific rather than
      uniformly dominant'
  depends_on:
  - D010
- id: D012
  date: 2026-05-31 17:17 UTC
  summary: Downgrade e009 deployable-selector claim after e010 seed-threshold negative
    result
  rationale: 'e010 directly tested whether the e009 regime-aware selector is stable
    across seeds and threshold perturbations. Although average regret remains small
    (mean_delta_vs_best_fixed about 0.00408, median_delta_vs_best_fixed 0, mean_delta_vs_fixed_partial
    about -0.00255, mean_delta_vs_independent about -0.00403), replication-level failure
    risk is not rare: both selector variants have loss_rate about 0.422, negative_failure_rate
    about 0.356, and high_positive_loss_rate about 0.428, with worst-cell delta_vs_best_fixed
    about 0.0832. Therefore e009 can only support a mean-level condition-specific
    selector observation, not a seed/threshold-stable deployable Stage 1 rule. D011
    is superseded for deployment-strength claims.'
  related_experiments:
  - exp_id: e010_selector_seed_threshold_sensitivity
    role: primary
    result: 'negative: replication-level loss and slice failure rates remain high
      despite small average regret'
  - exp_id: e009_regime_aware_estimator_selection
    role: parent
    result: success only at mean grid-budget summary level; not sufficient for stable
      deployment rule
  depends_on:
  - D011
- id: D013
  date: 2026-05-31 17:18 UTC
  summary: After e010 negative result, run failure-map diagnostic before any selector
    redesign
  rationale: 'Agent and Reviewer agree e010 rejects the stable deployment-rule hypothesis:
    e009 remains only a single-grid or mean-level observation, while e010 shows threshold/seed-sensitive
    replication-level failure. The next action should not be a new selector variant
    yet; first analyze existing e010 outputs at cell level to identify whether failures
    concentrate by correlation, severity, subgroup count, budget, or proxy-noise pattern,
    and fix artifact/report consistency issues.'
  related_experiments:
  - exp_id: e010_selector_seed_threshold_sensitivity
    role: primary
    result: 'negative: failure rates around 36% negative-correlation and 43% high-positive
      despite small mean regret'
  - exp_id: e009_regime_aware_estimator_selection
    role: parent
    result: mean/grid-level selector evidence only
  depends_on:
  - D012
- id: D014
  date: 2026-05-31 17:29 UTC
  summary: Use e010 failure map to test calibrated continuous selector instead of
    hard threshold rule
  rationale: 'The repaired e010 report and failure map show that mean-level behavior
    remains close to e009 (cell-level win/tie about 0.89-0.90 and high-positive mean
    loss 0 for pilot_corr_severity), but replication-level failure risk is high (loss
    about 0.422, negative failure about 0.356, high-positive failure about 0.428).
    Failure focus points to brittle hard choices under proxy noise and boundary cases
    rather than a large average-RMSE gap. Therefore the next Director-approved test
    is a calibrated/continuous or guardrailed selector that softens hard threshold
    switching, while the D012/C001 constraint remains: no stable deployment claim
    unless the new experiment reduces replication-level failures.'
  related_experiments:
  - exp_id: e010_selector_seed_threshold_sensitivity
    role: failure_map_parent
    result: negative with high replication-level failure but low mean-level regret
  - exp_id: e009_regime_aware_estimator_selection
    role: background
    result: single-grid mean-level selector evidence only
  depends_on:
  - D013

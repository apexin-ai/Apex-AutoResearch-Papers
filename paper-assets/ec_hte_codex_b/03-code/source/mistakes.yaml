mistakes:
- id: M001
  date: '2026-05-31'
  category: experiment_design
  severity: high
  summary: ROADMAP had e002 direction but experiment_plan and registry lacked a schedulable
    e002 entry
  root_cause: After e001, Director initialized ROADMAP and instructed Agent, but did
    not immediately create experiment_plan.yaml and registry spec, leaving coverage
    matrix empty and allocated GPU idle.
  prevention: For every ROADMAP short-term experiment, create or verify an experiment_plan
    entry and registry entry with hypothesis, parent, plan_id, server/gpu spec before
    asking Agent to submit.
  status: active
  context: 'Reviewer critical on 2026-05-31 after server reboot: registry had only
    e001 DONE, experiment_plan empty, and allocated GPU idle.'
  fix: Created experiment_plan.yaml with plan-e002; added e002_budgeted_confusion_estimation
    to registry with parent, hypothesis, budget grid, metrics, and seetacloud-11934:cuda:0
    spec; marked it ALLOCATED and sent urgent Agent submit instruction.
- id: M002
  date: '2026-05-31'
  category: experiment_design
  severity: medium
  summary: e002 failed before code execution because remote project_path did not exist
  root_cause: Project execution.project_path was /home/root/ec_hte, but the remote
    container only had /home and /root. submit_training_job cd'ed into work_dir before
    running the command, so the command's mkdir step never executed.
  prevention: Before allocating a remote experiment, verify and create execution.project_path
    on the target server; do not rely on the training command to create the directory
    if the launcher cd's into it first.
  status: active
  context: 'Agent reported e002 submit entered tmux but failed with `cd: /home/root/ec_hte:
    No such file or directory`; state machine moved original e002 to DONE(failed),
    so Director created a retry rather than rolling back DONE.'
  fix: Created /home/root/ec_hte on seetacloud-11934, preserved failed e002 as a failed
    infrastructure attempt, and created e002_budgeted_confusion_estimation_r1 as an
    ALLOCATED retry using the existing project_path.

- id: D004
  date: 2026-05-20 07:23 UTC
  summary: MVP 分析改为双轨：ambiguous-only 跨类型比较（主）+ matched-pair within-type（辅）
  rationale: 'Reviewer WARNING: incompleteness matched pair 存在信息量不对称混淆——消歧必然添加信息，与
    scopal/lexical 的"同信息不同措辞"baseline 不可比。解法：(1) 主分析用 ambiguous-only 条件直接跨类型比较违规率（不受信息量混淆）；(2)
    matched-pair 降为辅助的 within-type 效应量度量；(3) 要求 Agent 修订 incompleteness pairs 只添加解决歧义的最小信息；(4)
    效度边界显式声明此不对称性。'
  related_experiments: []
  depends_on:
  - D002
- id: D005
  date: 2026-05-20 07:24 UTC
  summary: MVP 使用 τ²-bench + 剥离 tool description 中的策略信息
  rationale: 'Reviewer WARNING: 需在 injection pipeline 前决定版本和 tool description 处理。选
    τ²-bench 因为 NL assertions 适合安全违规评估（v1 的 DB hash 太僵硬）。Tool description 中的策略信息会造成信息泄漏（agent
    绕过歧义策略从 tool desc 获取正确信息），选择剥离而非同步修改——更简单且信号更纯净。Airline 补偿条款可作为 scopal ambiguity
    paired pairs 起点。'

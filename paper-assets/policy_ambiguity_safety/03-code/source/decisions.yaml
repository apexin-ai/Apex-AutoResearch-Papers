- id: D016
  date: 2026-05-20 13:46 UTC
  summary: 'plan_010 perturbation control: 5-tier judgment criteria adopted, CI-based
    over p-value, Δ_net as primary metric'
  rationale: 'Reviewer assessment refined original 3-tier to 5-tier (PASS/PASS+caveat/CONDITIONAL/WARNING/FAIL)
    based on Δ_perturb/Δ_ambiguity ratio. Key insight: N=120 has only ~30% power for
    10pp difference, so CI width is the decision metric, not p-value. If CI >15pp
    width, expand N by 60 episodes. Primary metric is Δ_net = Δ_ambiguity - Δ_perturb
    (net ambiguity-specific effect). Also added contingency framing to paper_framing.md
    for scenarios where full study deviates from MVP (2/6 types fail → differential
    nocuity pivot; uniformity rejected → type hierarchy pivot).'
  related_experiments:
  - exp_id: plan_010
    role: subject
    result: judgment criteria defined
  depends_on:
  - D015

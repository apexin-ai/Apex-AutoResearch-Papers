- id: D015
  date: 2026-05-20 12:56 UTC
  summary: 'Coreferential Path A (三层修复): tool responses 泄漏消歧线索是 mini-pilot v2 FAIL
    根因，需修复 tool responses + scenario + 行为可区分性。plan_010 升 P0 并移到 plan_002/003 之前执行。'
  rationale: 'Mini-pilot v2 结果 1/5 (20%)，根因不是条款文本（已审计修复 26/50），而是 τ²-bench 框架层面的系统性问题：(1)
    tool responses 返回结构化字段直接消歧（如 explicit ages, wrong_item_received 状态），(2) 部分条款两种解读导致相同
    action，(3) 模型可通过保守策略避开歧义点。Reviewer 独立确认了 Agent 的根因分析。


    选择 Path A（修复）而非 B（缩减）或 C（降级），因为：

    - 6 类型均衡是 taxonomy 核心结构

    - 如果 coreferential 系统性偏低会产生伪 type effect，破坏 C2 (uniformity null)

    - 2-3h worker 时间是 trivial 投入

    - 修复方向正确（确保实验框架不 bias 特定类型）



- id: D011
  date: 2026-05-20 10:24 UTC
  summary: MVP FAIL on type effect → pivot to binary anchor + diagnostic for layer
    effect + full study
  rationale: MVP 结果：type effect p=0.50 V=0.084（FAIL），binary effect +35-42pp p<1e-5（极强）。V=0.084
    远低于阈值，扩 N 无意义（Fail path L1 跳过）。决策：(1) binary effect 作为论文主 claim 锚点——"歧义策略导致大规模安全违规"；(2)
    跑 diagnostic：conditional precedence（specification layer, 预测最高违规率）vs scopal（linguistic
    layer 最高），N=50/type，验证 2-layer 之间是否有 type effect；(3) 无论 diagnostic 结果如何都进 full
    study——binary effect 本身已 justify；(4) full study 中 type analysis 改为 exploratory（effect
    size + error analysis），不作为 confirmatory primary claim。符合 IDEA_BRIEF null-result
    预承诺："binary detection may suffice"。CL-first 叙事不变——error analysis 是 EMNLP 核心期待。
  related_experiments:
  - exp_id: mvp_001
    role: primary
    result: type_effect_fail_binary_pass
  depends_on:
  - D001
  - D007
- id: D012
  date: 2026-05-20 10:25 UTC
  summary: Full study 新增 model×type interaction 作为正式分析维度
  rationale: Reviewer 审查 mvp_001 发现 gpt-5.4 scopal 60% vs lexical 40%（20pp gap, H1
    方向），而 gpt-4.1 完全扁平（40-47%）。"Type sensitivity 作为 model capability 的函数"比单纯 type
    effect 更有深度，更适合 EMNLP。Full study 4 模型（2 API 不同代际 + 2 开源不同规模）× 6 类型可正式检验交互效应。同时论文报告
    unambiguous baseline 违规率 ~8%（14/180），净歧义效应 ~34-44pp。
  related_experiments:
  - exp_id: mvp_001
    role: evidence
    result: model_type_interaction_signal
  depends_on:
  - D011

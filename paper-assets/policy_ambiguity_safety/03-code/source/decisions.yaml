  rationale: 'Reviewer WARNING: (1) pairwise N=80 对 V=0.15 功效仅 0.22，增至 30 条款/类（pairwise
    N=120）+ 提阈值至 V≥0.20 + 明确 MVP 只检测 medium+ effect；(2) 补 fail path 三级决策树（扩大N重测 →
    pivot binary story → full study）；(3) 加 judge 偏差检查点（scopal 低于预期时先排查 judge bias）。'

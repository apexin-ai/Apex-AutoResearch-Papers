- id: D008
  date: 2026-05-20 09:24 UTC
  summary: Taxonomy 采用 2-layer 结构（3 linguistic + 3 specification）；开源模型定为 Qwen3-8B
    + Qwen3-32B(int4)
  rationale: 'Reviewer 3 份审查综合：(1) Taxonomy: authorization scope 在 CL 传统中是 vagueness
    非 ambiguity，conditional precedence 是规范冲突非语言学歧义——2-layer 分类（linguistic: scopal/lexical/coreferential
    + specification: incompleteness/conditional precedence/authorization scope）比扁平
    6 类更诚实、对 EMNLP 审稿人更有防御力；需加 ambiguity-vagueness 操作性定义声明（ref Wasow 2005）；(2) 硬件:
    RTX PRO 6000 48GB 上 DeepSeek-V3 不可行、Qwen3-32B 需 int4，可行组合 Qwen3-8B(bf16 16GB)
    + Qwen3-32B(int4 ~18GB)，同家族不同 scale 可做 scale analysis；(3) API model ID 20260620
    是未来日期需验证。'
  related_experiments: []

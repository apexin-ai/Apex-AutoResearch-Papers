  rationale: diag_001 结果：CP 34% vs scopal 40%，Δ=-6pp（方向相反），p=0.464。结合 mvp_001（层内无差异
    p=0.50），两轮实验收敛：歧义对 agent 安全的影响与类型完全无关（uniform effect）。C3（layer effect）正式死亡。但 Reviewer
    发现有价值的 CL insight：CP < scopal 可能因为显式规则冲突对模型 "可见"（meta-cognitive awareness），而语法歧义
    "隐形"。Full study 中若复现，可作为论文讨论亮点。test-retest 波动 ±8pp 需要 full study 加 bootstrap CI。

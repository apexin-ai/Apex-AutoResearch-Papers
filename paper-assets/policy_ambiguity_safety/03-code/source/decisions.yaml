decisions:
- id: D001
  date: 2026-05-20 07:11 UTC
  summary: MVP 设计：3 类歧义 × 2 API 模型验证 type effect，不用 GPU
  rationale: 核心假设是"歧义类型影响安全违规率"。选 scopal/lexical/incompleteness 3 种假设差异最大的类型，用 frontier
    API 模型（免 GPU）快速验证信号存在性。60 条款 × 2 variants × 2 模型 = 240 runs，统计功效足够（χ² df=2, medium
    effect w=0.3, N=240 >> 所需 ~107）。Pass 条件：p<0.05 + V≥0.15。
  related_experiments: []
  depends_on: []

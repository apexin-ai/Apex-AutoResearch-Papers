# Experiment Plan — policy_ambiguity_safety
# Post-MVP, targeting EMNLP 2026 (ARR Aug cycle)
# Claims reference paper_framing.md

experiments:
  # === P0: Must-run for paper ===

  - id: plan_001
    name: full_study_clause_generation
    claim: "C1, C2, C3"
    description: >
      Generate remaining clauses for full study: coreferential (50 new),
      authorization_scope (50 new), lexical (+20 to reach 50),
      incompleteness (+20 to reach 50). Total 140 new clauses.
      Validate all 300 clauses (50/type × 6 types) for completeness
      and cross-type balance. Mix CP format per Reviewer suggestion
      (labeled + unlabeled).
    priority: P0
    gpu_budget_hours: 0
    deps: []
    status: planned

  - id: plan_001b
    name: new_type_mini_pilot
    claim: "C1 (validation)"
    description: >
      Mini-pilot for coreferential + authorization_scope (never tested):
      5 clauses/type × 2 conditions × 1 model (gpt-5.4) = 20 episodes.
      Verify: (a) ambiguous triggers violations (b) unambiguous control < 15%.
      If systematic issues found, fix clause design before full study.
      API cost negligible (~$2). Per Reviewer warning on untested types.
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_001]
    status: planned

  - id: plan_002
    name: full_study_api
    claim: "C1, C2, C3, C4, C5"
    description: >
      Run 300 clauses × 2 conditions × 3 API models (gpt-5.4, gpt-4.1,
      claude-sonnet-4-6) = 1,800 episodes on τ²-bench. Cross-judge
      evaluation. Output: episodes.jsonl + judgments.jsonl. No GPU needed.
      Claude via OpenRouter proxy (base_url=http://47.94.22.126/v1).
      [2026-05-20] Claude added per distill gap (4/8 papers use Claude baseline).
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_001, plan_001b, plan_010]
    status: planned

  - id: plan_003
    name: full_study_opensource
    claim: "C1, C2, C3, C4, C5"
    description: >
      Run 300 clauses × 2 conditions × 2 open-source models via OpenRouter API:
      qwen/qwen3-235b-a22b (235B MoE, Alibaba) + deepseek/deepseek-chat-v3-0324
      (DeepSeek) = 1,200 episodes on τ²-bench. Cross-judge uses API models.
      Can run in parallel with plan_002. No GPU needed.
      [2026-05-20] Pivoted from local GPU → API: OpenRouter proxy confirmed
      to support Qwen3 and DeepSeek models. Eliminates 48h GPU requirement.
      Provider prefix required (e.g. qwen/qwen3-235b-a22b, not qwen3-235b-a22b).
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_001]
    status: planned

  - id: plan_004
    name: full_study_analysis
    claim: "C1, C2, C3, C4"
    description: >
      Statistical analysis of full study data (3,000 episodes):
      (a) Binary effect per type with bootstrap CI (C1)
      (b) Omnibus χ² + pairwise across 6 types (C2)
      (c) Visibility comparison: CP vs scopal rates (C3)
      (d) Model × type interaction: 5×6 contingency + logistic regression (C4)
      Report effect sizes + CI for all comparisons per Reviewer suggestion.
      [Dream A3] Power analysis: report MDE for C2 (given N=250/type pooled)
      and C3 (given N=250 per type). If V < 0.20 but MDE > observed V,
      discuss underpowered possibility.
      [Dream A4] TOST equivalence test with both ±15pp and ±10pp margins.
      Justify margin choice explicitly.
      [Dream A10] Report per-type information delta (token count difference
      between ambiguous and unambiguous variants) as control variable.
      [Dream B&K] Inter-model agreement on ambiguous clauses: do 5 models
      adopt same or different interpretations? (supplementary analysis)
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_002, plan_003]
    status: planned

  - id: plan_005
    name: error_analysis
    claim: "C5"
    description: >
      Qualitative analysis of agent traces from full study:
      (a) Sample 50 violation traces per type (300 total)
      (b) Classify failure modes (scope misapplication, conservative refusal,
          assumption-based action, arbitrary rule selection, etc.)
      (c) Cross-type failure mode distribution
      (d) Visibility mechanism: compare CP traces (explicit conflict detection
          behavior) vs scopal traces (surface scope adoption without awareness)
      (e) Model-specific failure patterns (connect to C4)
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_002, plan_003]
    status: planned

  # === P1: Important for robustness ===

  - id: plan_006
    name: reliability_test
    claim: "C1, C2"
    description: >
      Test-retest reliability: select 30 representative clauses (5/type),
      run 3 independent replicates × 2 conditions × 2 API models (gpt-5.4,
      gpt-4.1) = 360 episodes. Local models added when plan_003 GPU available.
      Compute ICC for per-clause violation rates. Addresses Reviewer warning
      about ±8pp sampling noise (scopal 51.7% → 43.3% across MVP/diag).
      Bootstrap CI width should be < 10pp for key comparisons.
      [2026-05-20] API portion: 330/360 episodes complete (28/30 clauses),
      judgments pending.
    priority: P1
    gpu_budget_hours: 15
    deps: [plan_001]
    status: planned

  - id: plan_007
    name: realism_validation
    claim: "C1 (methodological)"
    description: >
      Validate synthetic ambiguity injection realism:
      (a) Linguistic property comparison with DRIP-R natural ambiguities
          (sentence length, parse depth, Flesch-Kincaid, TTR) + KS tests
      (b) Optional: discriminator test if DRIP-R data accessible
      Addresses RC4 (ecological validity).
    priority: P1
    gpu_budget_hours: 0
    deps: [plan_001]
    status: planned

  - id: plan_009
    name: judge_calibration
    claim: "C1 (methodological)"
    description: >
      LLM-as-judge calibration per distilled research norm (5/8 papers):
      (a) Sample 100 episodes stratified by type×model×condition
      (b) Human expert labels (2 annotators, target κ ≥ 0.75)
      (c) Compute judge precision/recall/F1 against human ground truth
      (d) Per-severity-tier agreement rates
      (e) Report in Method section as standard practice per AgentAuditor/DRIP-R
      [Dream A7] Upgraded P1→P0: Dream best-tier reviewers identified this
      as "single most critical missing validation." Without it, entire
      measurement chain from episode to violation label is unvalidated.
      κ=0.91 measures LLM-LLM agreement, not accuracy.
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_002]
    status: planned

  - id: plan_010
    name: perturbation_control
    claim: "C1 (causal validity)"
    description: >
      [Dream A9] Non-ambiguity perturbation control arm to distinguish
      ambiguity-specific harm from general prompt brittleness.
      Generate 30 clause pairs with non-ambiguity perturbations:
      (a) 15 synonym substitution pairs (replace key terms with synonyms)
      (b) 15 clause reordering pairs (reorder conditions without changing meaning)
      Run 30 × 2 conditions × 3 API models (gpt-5.4, gpt-4.1, claude-sonnet-4-6) = 180 episodes.
      Key metric: Δ_net = Δ_ambiguity - Δ_perturb (net ambiguity-specific effect).
      [Reviewer升级] 必须在 plan_002/003 full study 之前完成——
      如果 perturbation Δpp ≈ ambiguity Δpp，2,400 episodes 全部无效。
      低成本验证（30 pairs + 120 episodes API）优先于高成本投入。
      [判定标准 — 5 档]:
      PASS: Δ_perturb < 5pp (CI含0), ratio < 0.15 → C1 因果 claim 最强形式
      PASS+caveat: 5-10pp, ratio 0.15-0.30 → 报告 perturbation baseline, C1 写 net effect
      CONDITIONAL: 10-15pp, ratio 0.30-0.45 → 需 Δ_net > 20pp 且显著才可发表
      WARNING: 15-20pp, ratio 0.45-0.60 → C1 改为 "additional violations beyond sensitivity"
      FAIL: > 20pp, ratio > 0.60 → 无法声称 ambiguity-specific, 需根本重新设计
      [Power 注意]: N=120 对 10pp 差异 power ≈ 30%. 用 CI 宽度判定, 非 p-value.
      若 CI 过宽(>15pp width), 追加 60 episodes 压窄至 <10pp width.
      输出标准化 verdict 文件: perturbation_Δpp, ambiguity_Δpp, net_Δpp, CI, ratio, verdict.
    priority: P0
    gpu_budget_hours: 0
    deps: [plan_001]
    status: planned

  # === P1+: Cross-benchmark generalizability ===

  - id: plan_017
    name: sopbench_cross_benchmark
    claim: "C1 (generalizability), C2 (partial)"
    description: >
      Cross-benchmark C1 replication on SOPBench (Li et al., 2025).
      7 domains (Bank, DMV, Healthcare, Hotel, Library, University, Online Market)
      all different from τ²-bench (retail + airline).
      Select 2 domains (Healthcare + Bank) for maximum domain diversity.
      Construct 100 clause pairs (50/domain) covering 3-4 ambiguity types
      (incompleteness, auth_scope, lexical, conditional_precedence)
      from SOPBench's NL SOP constraints.
      Run 100 pairs × 2 conditions × 5 models = 1,000 episodes.
      SOPBench has rule-based verifier — no LLM judge needed.
      Key metrics: (a) Does C1 binary effect replicate? (b) Is incompleteness
      still highest-risk type? (c) Cross-benchmark effect size correlation.
      Addresses SF-8 (single benchmark external validity).
      Result goes in Appendix with 1-sentence summary in main text.
      [2026-05-22] Approved by user. Estimated 1 day including clause construction.
    priority: P1
    gpu_budget_hours: 0
    deps: []
    status: planned

  # === P2: Nice to have ===

  - id: plan_008
    name: classifier_poc
    claim: "practical contribution"
    description: >
      Binary ambiguity detector PoC: fine-tune DeBERTa-v3-large on
      annotated clause pairs (ambiguous/unambiguous labels). Eval on
      held-out set. Demonstrates practical applicability of findings.
      Phase 3 from IDEA_BRIEF, scoped to PoC for EMNLP.
    priority: P2
    gpu_budget_hours: 8
    deps: [plan_001]
    status: planned


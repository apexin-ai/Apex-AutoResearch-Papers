  review_report: "---\ndream_id: dream_20260520T152228\ntier: best\noverall_score:\
    \ 3.5/6 — Borderline Conference / Strong Findings\ntimestamp: 2026-05-20T16:43:51.704699+00:00\n\
    ---\n\n# Dream Review Report — \"Not All Policy Ambiguity Is Equal\"\n\n**dream_id**:\
    \ 20260520T152228  \n**Review mode**: full (2 Reviewers + Roundtable)  \n**Date**:\
    \ 2026-05-20\n\n---\n\n## 1. Paper Summary\n\nThis paper presents the first causal,\
    \ type-granularity study of how policy ambiguity affects LLM agent safety. Using\
    \ a matched-pair design over 300 clause pairs spanning 6 ambiguity types (organized\
    \ into specification-layer and linguistic-layer), the authors evaluate 5 LLM agents\
    \ across 3 architecture families in 3,000 agentic episodes on the τ²-bench framework.\
    \ The core finding — termed \"Differential Nocuity\" — is that specification-layer\
    \ ambiguities (authorization scope, incompleteness, conflicting provisions) cause\
    \ roughly twice the safety violation increase (+43.6pp) as linguistic-layer ones\
    \ (+26.2pp), with a gap of 17.4pp (d=0.68). The hierarchy is claimed to be architecture-universal\
    \ (Model×Type interaction p=0.34) and mechanistically grounded via distinct failure\
    \ modes per layer.\n\n---\n\n## 2. Reviewer Assignments\n\n| Reviewer | Focus\
    \ | Score | Confidence |\n|----------|-------|-------|------------|\n| R1 | Methods\
    \ + Experiments | 4/6 (Weak Accept) | 4/5 |\n| R2 | Novelty + Related Work | 3/6\
    \ (Weak Reject) | 4/5 |\n\n---\n\n## 3. R1 Review (Methods + Experiments)\n\n\
    ### Strengths\n1. **Matched-pair causal design + perturbation control** is the\
    \ methodological highlight. Each ambiguous clause paired with a minimally-different\
    \ unambiguous variant, plus a separate perturbation arm (Δ=3.3pp vs ambiguity\
    \ Δ=36.5pp) providing strong causal evidence that the effect is ambiguity-specific,\
    \ not general prompt brittleness.\n2. **Multi-layered reliability assessment**\
    \ is unusually thorough: test-retest ICC=0.84 (900 episodes), LLM-judge F1=0.91\
    \ (κ=0.86 vs human consensus), inter-annotator κ=0.88, realism validation via\
    \ KS tests against DRIP-R natural ambiguities.\n3. **Statistical analysis plan\
    \ is comprehensive**: McNemar for paired binary data, omnibus χ² with Cramér's\
    \ V, TOST equivalence, logistic regression with type×model interaction and info-delta\
    \ covariate, bootstrap CIs.\n4. **Error analysis (Section 6)** provides mechanistic\
    \ depth. The 300-trace qualitative analysis with 82% failure-mode-to-layer match\
    \ and 6 distinct failure modes is systematic and informative.\n5. **Perturbation\
    \ control** creatively addresses the prompt-brittleness confound — the strongest\
    \ such design in this literature.\n\n### Weaknesses\n1. **(MAJOR) Model coverage\
    \ completeness.** The paper claims 5 models / 3,000 episodes across 3 architecture\
    \ families. If the local models (Qwen3-32B, Qwen3-8B) and Claude Sonnet 4.6 experiments\
    \ are not fully completed, the \"architecture-universal\" claim (C4) rests on\
    \ only 2 models from 1 family (OpenAI). This would severely undermine the paper's\
    \ generalizability narrative. The authors must confirm that ALL experiments reported\
    \ are fully completed.\n2. **(MAJOR) LLM-as-judge circularity.** GPT-5.4 serves\
    \ as both primary judge and one of the evaluated agents. The 100-episode human\
    \ calibration covers only ~3.3% of total episodes. Stratification across all 6\
    \ types × 2 conditions × 5 models = 60 cells is unclear — some cells may have\
    \ 0–2 human-validated instances, making per-cell judge reliability unknown.\n\
    3. **(MAJOR) Incompleteness disambiguation confound.** Disambiguation for incompleteness\
    \ inherently adds information (not just clarifies). The length ratio (1.15) is\
    \ the highest, and while the logistic regression includes info-delta as a covariate\
    \ (p=0.50), this may not fully capture the confound. The dual-track analysis (ambiguous-only\
    \ comparison as primary) mitigates but does not eliminate this concern.\n4. **(MAJOR)\
    \ TOST equivalence margin justification missing.** The ±10pp and ±15pp margins\
    \ are not grounded in domain-specific reasoning. In safety-critical contexts,\
    \ even 5pp differences may matter. The margins appear post-hoc.\n5. **(MINOR)\
    \ Power analysis absent from the paper.** No a priori power analysis is reported,\
    \ though the observed effects are large enough that underpowering is unlikely\
    \ for the main contrasts.\n6. **(MINOR) Test-retest sample representativeness.**\
    \ The 30 clauses used for ICC are not described by type distribution or selection\
    \ criteria.\n7. **(MINOR) Only 2 τ²-bench domains** (retail, airline). Generalization\
    \ to healthcare, finance, or legal domains untested.\n8. **(MINOR) Clause-level\
    \ random effects** not included in the logistic regression — potential pseudoreplication\
    \ given multiple models respond to the same clause.\n\n### Questions for Authors\n\
    - Q1: Can you confirm all 5-model experiments are completed (not projected)?\n\
    - Q2: How were the 100 human-calibration episodes sampled? Was per-type stratification\
    \ ensured?\n- Q3: Does the logistic regression include clause-level random intercepts?\n\
    - Q4: How do you interpret Fleiss κ=0.33 as \"true nocuity\" vs. measurement noise?\n\
    - Q5: Were tool responses informative or simulated in τ²-bench? If simulated,\
    \ does this artificially inflate coreferential violation rates by removing a disambiguation\
    \ channel?\n\n---\n\n## 4. R2 Review (Novelty + Related Work)\n\n### Strengths\n\
    1. **The matched-pair causal design is genuinely novel in the agent safety space.**\
    \ Table 12 correctly positions this as the first study combining causal design\
    \ + ambiguity taxonomy + safety violation metric + multi-model comparison + perturbation\
    \ control. No prior work (DRIP-R, PhantomPolicy, AgentPex) achieves this combination.\n\
    2. **The spec/ling layer distinction is empirically productive.** The 17.4pp gap\
    \ with d=0.68 is a medium-large effect size — this is not a marginal finding.\
    \ The mapping to distinct failure mechanisms (guessing vs. misparsing) provides\
    \ explanatory power beyond a simple rate comparison.\n3. **Error analysis (Section\
    \ 6) is the paper's strongest contribution.** The type-specific failure mode signatures,\
    \ especially the CP-awareness finding (35% conflict detection vs. near-zero for\
    \ scopal) and coreferential avoidance behavior (44% vs 8% for other types), are\
    \ genuinely novel observations.\n4. **The Disambiguation Channel Hypothesis**\
    \ is a useful mechanistic framework. The gradient from scopal (Δ=34.8pp, low external\
    \ resolution) to coreferential (Δ=16.2pp, partial tool-based resolution) aligns\
    \ with the hypothesis.\n5. **Berry & Kamsties operationalization** via inter-model\
    \ Fleiss κ (0.33 ambig vs 0.82 unambig) is a clean way to demonstrate that ambiguity\
    \ causes genuine interpretive divergence, not just uniform failure.\n\n### Weaknesses\n\
    1. **(MAJOR) CP undermines the clean layer dichotomy.** CP (specification-layer)\
    \ has a violation rate of 33.6%, which falls *below* scopal (linguistic-layer,\
    \ 38.4%). The ranking is actually auth_scope > incompleteness > scopal > lexical\
    \ > CP > coreferential — the spec/ling split is not a clean boundary. The paper's\
    \ headline framing \"specification nearly twice as dangerous as linguistic\" is\
    \ driven by the extremes (auth_scope 54.4% vs coreferential 23.2%), not a consistent\
    \ layer effect. The paper acknowledges CP's special status via the \"visibility\"\
    \ argument (Section 6, CP vs. Scopal) but this nuance is buried — the headline\
    \ claim overclaims.\n2. **(MAJOR) \"Differential Nocuity\" is overclaimed as a\
    \ theoretical framework.** The observation that different ambiguity types cause\
    \ different failure rates is an expected finding from any taxonomy study. The\
    \ genuine value is in the quantification, the causal design, and the mechanistic\
    \ analysis — not a new \"framework.\" The term risks appearing as branding rather\
    \ than substance. A more calibrated framing (\"we quantify type-specific nocuity\
    \ and identify a layer-based hierarchy\") would be more appropriate.\n3. **(MAJOR)\
    \ Related work has significant gaps.** For a paper making theoretical claims about\
    \ how LLMs process ambiguity:\n   - **Pragmatics literature missing**: No engagement\
    \ with Grice (cooperative principle, implicature), Clark (common ground), or Sperber\
    \ & Wilson (relevance theory). The Disambiguation Channel Hypothesis is essentially\
    \ about pragmatic inference — agents lack shared context and cooperative norms\
    \ — but this connection is not made.\n   - **RLHF/alignment effects**: The paper\
    \ notes Claude is \"most conservative\" (Constitutional AI training) but doesn't\
    \ engage with how alignment methods affect ambiguity handling. This is a missed\
    \ connection.\n   - **Formal policy verification**: No mention of formal approaches\
    \ to policy specification that could prevent ambiguity.\n   - **Legal NLP**: Contract\
    \ ambiguity analysis is a growing subfield directly relevant to specification-layer\
    \ ambiguity.\n   - **Only 16 references** is thin for a paper making 5 claims\
    \ with theoretical framing. Top venue papers in this area typically cite 30–50\
    \ works.\n4. **(MAJOR) Five claims is overambitious.** C1 (binary effect), C2\
    \ (type hierarchy), C3 (layer effect), C4 (architecture-universal), C5 (inter-model\
    \ nocuity) — attempting all five with full support in 8 pages stretches the paper\
    \ thin. C1 is essentially a prerequisite for C2/C3, not a standalone contribution.\
    \ C5 is interesting but underdeveloped. Focusing on 3 deeply-supported claims\
    \ (C2 + C3 + error analysis) would be stronger.\n5. **(MINOR) Classifier PoC (Section\
    \ 7) feels tacked on.** The DeBERTa binary detector (F1=0.89) is presented as\
    \ \"practical implication\" but is tangential to the paper's analytical contribution.\
    \ It consumes page budget without advancing the core narrative.\n6. **(MINOR)\
    \ The taxonomy cross-walk** (Section 3) between DRIP-R and Massey et al. is mentioned\
    \ but not elaborated. A table showing the mapping would strengthen the grounding.\n\
    7. **(MINOR) Writing is efficient but could improve on theoretical motivation.**\
    \ The Introduction moves quickly from problem statement to contributions without\
    \ building sufficient motivation for *why* type-level analysis matters (beyond\
    \ \"no study has measured this\"). A brief scenario showing how type-aware triage\
    \ changes outcomes would strengthen the case.\n\n### Missing Related Work / Connections\n\
    - Gricean pragmatics and cooperative principle (spec-layer ambiguity = violation\
    \ of cooperative norms designed for human organizations)\n- RLHF/Constitutional\
    \ AI effects on ambiguity handling (Claude's conservatism is data, not just an\
    \ observation)\n- Formal policy specification (prevention vs. detection)\n- Legal\
    \ NLP / contract ambiguity (direct parallel to spec-layer ambiguity)\n- ShieldAgent\
    \ or similar runtime safety frameworks\n- Broader requirements engineering literature\
    \ beyond Berry & Kamsties and Massey et al.\n\n---\n\n## 5. Roundtable: Cross-Review\
    \ Discussion\n\n### Step 2: Cross-Share — Points of Agreement\n\nBoth reviewers\
    \ independently converged on several key observations:\n\n1. **Data completeness\
    \ is the critical open question.** Both R1 and R2 flagged that if the 5-model\
    \ / 3-family results are not fully completed, the paper's strongest claims (C4:\
    \ architecture-universality) collapse. The paper MUST present only completed experiments.\n\
    \n2. **Matched-pair + perturbation control is the paper's methodological crown\
    \ jewel.** Both reviewers recognize this as genuinely novel in the agent safety\
    \ literature. The perturbation arm producing Δ=3.3pp vs. ambiguity Δ=36.5pp is\
    \ convincing causal evidence.\n\n3. **Error analysis (Section 6) is the strongest\
    \ section.** The 82% failure-mode-to-layer match, the CP awareness finding, and\
    \ the coreferential avoidance behavior provide mechanistic depth that elevates\
    \ the paper above a pure benchmark study.\n\n4. **CP undermines the clean layer\
    \ dichotomy.** CP (spec, 33.6%) < scopal (ling, 38.4%). The \"specification ≫\
    \ linguistic\" framing is driven by auth_scope + incompleteness vs. coreferential,\
    \ with the middle types crossing layer boundaries. Both reviewers consider this\
    \ a significant threat to the headline claim's simplicity.\n\n### Step 3: Convergence\
    \ — Points of Disagreement\n\n| Issue | R1 Position | R2 Position | Resolution\
    \ |\n|-------|-------------|-------------|------------|\n| Overall quality | 4/6\
    \ (Weak Accept) — strong methodology, contingent on data | 3/6 (Weak Reject) —\
    \ overclaimed novelty, thin related work | Split; see synthesis |\n| \"Differential\
    \ Nocuity\" framing | Did not flag as problematic | Overclaimed as framework;\
    \ should be toned down | R2's concern is valid — the term adds branding without\
    \ proportional theoretical content |\n| Related work adequacy | Not evaluated\
    \ (out of scope) | Major gap: pragmatics, alignment, legal NLP, only 16 refs |\
    \ R2's concern is valid — 16 references is thin |\n| Statistical methodology |\
    \ Multiple specific concerns (TOST, random effects, power) | Not deeply evaluated\
    \ | R1's concerns are valid and actionable |\n| Practical significance | Perturbation\
    \ control sufficient for causal claim | Perturbation control is strong but CP\
    \ anomaly weakens layer narrative | Both valid; the layer claim needs qualification\
    \ |\n\n### Step 3: Key Debate — Is the Layer Effect Real or an Artifact of Extremes?\n\
    \nThis is the central methodological-conceptual tension:\n\n- **The averaged layer\
    \ effect is statistically robust**: gap=17.4pp, CI [12.5, 22.3], p<0.0001, d=0.68.\
    \ The CI excludes zero.\n- **But the within-layer ordering violates the dichotomy**:\
    \ CP (spec) < scopal (ling). The paper's own \"visibility\" explanation (Section\
    \ 6) is compelling — CP has detectable conflicts, making it behaviorally distinct\
    \ from other spec types — but this means the layer is not a clean predictor.\n\
    - **R1's resolution**: The layer effect is real as a statistical tendency but\
    \ should not be presented as a sharp boundary. The paper should lead with the\
    \ full type ranking and present the layer aggregation as a secondary summary.\n\
    - **R2's resolution**: Drop the \"nearly twice as dangerous\" headline. Lead with\
    \ the type hierarchy (C2) and error analysis as primary contributions. The layer\
    \ comparison (C3) should be a supporting observation, not the headline.\n- **Consensus**:\
    \ The layer effect exists but is overclaimed as a clean dichotomy. The type ranking\
    \ and mechanistic analysis are the genuine contributions.\n\n---\n\n## 6. Synthesized\
    \ Assessment\n\n### What the Paper Does Well\n1. **Methodological rigor**: Matched-pair\
    \ design + perturbation control + multi-layered validation (judge calibration,\
    \ test-retest, realism validation) sets a new standard for agent safety evaluation\
    \ studies.\n2. **Mechanistic depth**: Error analysis with type-specific failure\
    \ modes, the CP-awareness finding, and coreferential avoidance behavior go beyond\
    \ rates to explain *why* types differ.\n3. **Practical relevance**: The type-aware\
    \ triage recommendation is actionable and well-supported by the evidence.\n4.\
    \ **Experiment coverage**: The paper covers all planned experiments from the design\
    \ (clause generation, mini-pilot, perturbation control, full API study, full local\
    \ study, statistical analysis, error analysis, reliability, realism validation,\
    \ judge calibration, classifier PoC) — comprehensive scope.\n\n### What Needs\
    \ Improvement\n1. **Confirm data completeness**: All 5-model results must be from\
    \ completed experiments, not projections.\n2. **Qualify the layer claim**: CP\
    \ < scopal means the spec/ling boundary is not clean. Lead with type ranking;\
    \ present layer aggregation as a secondary summary with explicit acknowledgment\
    \ of CP as an outlier.\n3. **Expand related work**: Add pragmatics (Grice, Clark),\
    \ alignment/RLHF connections, legal NLP, formal policy verification. Target 25+\
    \ references.\n4. **Tone down \"Differential Nocuity\" framing**: Present as an\
    \ empirical finding with mechanistic grounding, not a new theoretical framework.\n\
    5. **Statistical refinements**: Add clause-level random effects to logistic regression,\
    \ justify TOST margins, report a priori power analysis.\n6. **Consolidate claims**:\
    \ Focus on 3 primary claims (C1+C2 merged as \"type hierarchy with causal evidence\"\
    , C3 as \"layer effect with mechanism\", and error analysis) rather than 5 separate\
    \ claims.\n7. **Judge calibration**: Report per-type F1 in main text (currently\
    \ only in appendix Table 19), especially for coreferential (F1=0.87, lowest) and\
    \ scopal (F1=0.88) where borderline cases are most common.\n\n### Internal Consistency\
    \ Check\n- The paper's numbers are internally consistent: Table 2 rates sum correctly,\
    \ layer averages match, logistic regression coefficients align with descriptive\
    \ statistics.\n- The spec/ling ratio consistency across API (1.64) and local (1.62)\
    \ models is a strong signal, even though the absolute layer boundary has anomalies.\n\
    - The perturbation control ratio (0.09) is robust: all three API models show consistent\
    \ perturbation effects (2.7–4.1pp).\n\n### Experiment Coverage Assessment\nComparing\
    \ the paper against the imagined experiment list in review_context.yaml:\n\n|\
    \ Experiment | In Paper? | Adequately Reported? |\n|------------|-----------|---------------------|\n\
    | Clause generation (300 pairs) | ✅ §4.1, Table 13 (App A) | ✅ Full statistics\
    \ |\n| Mini-pilot (20 episodes) | ✅ App B | ✅ Concise but complete |\n| Perturbation\
    \ control (180 eps) | ✅ §4.3, §5.1, Table 3 | ✅ Strong |\n| Full API study (1,800\
    \ eps) | ✅ §5, Table 2, Table 14 | ✅ Comprehensive |\n| Full local study (1,200\
    \ eps) | ✅ Table 5 | ⚠️ Could use more detail |\n| Statistical analysis (pooled)\
    \ | ✅ §4.6, §5.1–5.5, Tables 2–7 | ✅ Comprehensive |\n| Error analysis (300 traces)\
    \ | ✅ §6, Tables 8–10 | ✅ Strong |\n| Test-retest (900 eps) | ✅ §4.5, Table 16\
    \ | ✅ Adequate |\n| Realism validation | ✅ §4.1, Table 17 | ✅ Adequate |\n| Judge\
    \ calibration | ✅ §4.4, Tables 1, 18, 19 | ✅ Strong |\n| Classifier PoC | ✅ §7,\
    \ Table 11 | ⚠️ Tangential; could move to appendix |\n\n**Coverage verdict**:\
    \ All 11 imagined experiments are reflected in the paper. Reporting is generally\
    \ adequate to strong.\n\n---\n\n## 7. Scores\n\n### R1 (Methods + Experiments)\n\
    - **Score**: 4/6 (Weak Accept)\n- **EMNLP equivalent**: 3.5 (Borderline Conference)\n\
    - **Rationale**: Strong experimental design with genuine methodological novelty\
    \ (matched-pair + perturbation control). Multiple validity checks set a high bar.\
    \ Contingent on 5-model data being complete. Statistical refinements needed (random\
    \ effects, TOST justification, power analysis). Judge circularity is a concern\
    \ but mitigated by human calibration.\n\n### R2 (Novelty + Related Work)\n- **Score**:\
    \ 3/6 (Weak Reject)\n- **EMNLP equivalent**: 3.0 (Findings)\n- **Rationale**:\
    \ The causal design is genuinely novel in this space, and the error analysis is\
    \ strong. However, \"Differential Nocuity\" is overclaimed, the layer dichotomy\
    \ is undermined by CP < scopal, related work is too thin (16 refs, missing pragmatics/alignment/legal\
    \ NLP), and 5 claims in 8 pages is overambitious. Needs tighter framing and deeper\
    \ related work engagement.\n\n### Consolidated Score\n- **Overall**: 3.5/6 (Borderline\
    \ Conference / Strong Findings)\n- **EMNLP equivalent**: 3.25–3.5 (between Findings\
    \ and Borderline Conference)\n\n### Justification\nThe paper addresses a timely\
    \ question (how policy ambiguity causally affects agent safety) with a well-designed\
    \ experimental framework that advances the methodological state of the art. The\
    \ matched-pair + perturbation control combination is the strongest causal design\
    \ in this literature. The error analysis provides genuine mechanistic insight.\
    \ However, the headline framing (\"specification nearly twice as dangerous\")\
    \ overclaims relative to the nuanced data (CP < scopal), the related work is too\
    \ thin for the theoretical ambitions, and the \"Differential Nocuity\" branding\
    \ adds less substance than it suggests. With the improvements suggested above\
    \ — qualifying the layer claim, expanding related work, tightening to 3 core claims,\
    \ and confirming data completeness — this paper would be a solid main conference\
    \ submission. In its current form, it sits at the border between Conference and\
    \ Findings.\n\n### Confidence: 4/5\nBoth reviewers report high confidence. The\
    \ main uncertainty is whether the 5-model results are fully completed; if so,\
    \ the paper's generalizability claims strengthen significantly.\n\n---\n\n## 8.\
    \ Actionable Recommendations (Priority-Ordered)\n\n1. **[Critical]** Confirm and\
    \ verify all 5-model experimental data is complete. If not, revise claims to reflect\
    \ actual completed experiments.\n2. **[High]** Restructure the headline finding:\
    \ lead with the type hierarchy (C2) and error analysis mechanism; present layer\
    \ aggregation (C3) as a supporting observation with explicit CP caveat.\n3. **[High]**\
    \ Expand references to 25+, adding pragmatics (Grice, cooperative principle),\
    \ RLHF/alignment, legal NLP, and formal policy verification connections.\n4. **[High]**\
    \ Add clause-level random effects to the logistic regression; report a priori\
    \ power analysis; justify TOST margins.\n5. **[Medium]** Tone down \"Differential\
    \ Nocuity\" from \"theoretical framework\" to \"empirical finding with mechanistic\
    \ grounding.\"\n6. **[Medium]** Move classifier PoC to appendix; use freed space\
    \ for deeper related work or per-type judge F1 discussion.\n7. **[Low]** Report\
    \ per-type judge F1 in main text, especially for coreferential and scopal.\n8.\
    \ **[Low]** Add cross-domain analysis beyond retail/airline as a limitation with\
    \ specific future work plan."

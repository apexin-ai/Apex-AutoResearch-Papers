      \ \n以 assumption-based action 为主（62%）：agent 面对 underspecified permission boundary\
      \ 或 \nmissing condition 时，选择一个\"合理\"假设并执行——没有 external signal 可以纠正。但 35% 的 \n\
      ling violations 也表现 assumption-based action，因为部分 linguistic ambiguity（特别是 lexical\
      \ \npolysemy）agent 同样无法获得消歧线索。这 35% overlap 是 median 档与 best 档的关键分野：\nbest 档预期\
      \ clean 分离，median 档承认 \"predominant with overlap\"。\nLing-layer 的 scope misapplication（32%）是预期的\
      \ distinctive mode：agent 取错了 quantifier \n或 negation 的 scope，产生 \"good-enough\"\
      \ 但错误的解读。Spec-layer 仅 8% scope misapplication \n因为 spec ambiguity 本质不是 scope\
      \ 问题。\nCoreferential 的 avoidance behavior（28%）存在但不如预期 clean——45% 是 reference\
      \ confusion\n（agent 绑定了错误的 entity），27% 混合（avoidance + confusion in same trace）。28%\
      \ avoidance \nrate 支持 disambiguation channel hypothesis 但不足以作为 standalone claim——paper\
      \ 中应 \npresent as \"suggestive evidence\" 而非 confirmed mechanism。\nAuth_scope\
      \ 的 unauthorized escalation（71%）是最 distinctive failure mode：agent 假设自己 \n拥有\
      \ ambiguous permission boundary 的最宽解读，执行超权限操作。这是 EMNLP 的 strongest \nqualitative\
      \ finding——直接连接 ambiguity → safety violation 的 causal pathway。\nTool response\
      \ 部分消歧（23% traces）在 ling-layer 更常见（34% vs spec 8%），部分支持 \ndisambiguation channel\
      \ hypothesis——ling ambiguity 有 external resolution channel，但 \n成功率不高（34% 尝试中的约半数实际\
      \ resolve）。\n"

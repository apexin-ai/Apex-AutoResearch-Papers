      with cross-layer overlap flows visible but thinner.'
    - 'Figure 6 (paper): Annotated trace pair — (a) auth_scope violation: agent encounters
      ''authorized personnel may process refunds'', assumes widest permission, processes
      unauthorized refund; (b) scopal violation: agent encounters ''all items excluding
      premium and sale categories'', misparses scope of ''excluding'', applies exclusion
      only to ''sale''. Side-by-side demonstrates spec (guessing) vs ling (misparse)
      distinction.'
    analysis: "Error analysis 是 EMNLP 的核心 CL contribution。主要 findings：\n(1) Spec-layer\
      \ 的 dominant failure mode 是 \"assumption-based action\"——agent 填充 specification\
      \ \ngap 时没有 meta-cognitive awareness that it's guessing。这直接解释为什么 spec-layer\
      \ 更危险：\n无 external correction signal + 无 internal uncertainty signal = confident\
      \ wrong action。\n(2) Ling-layer 更多 \"scope misapplication\" 和 \"reference confusion\"\
      ——这些是 parsing failures，\nnot knowledge gaps。部分可以被 tool response 修正（34% ling\
      \ traces 显示 partial disambiguation），\n这就是为什么 ling-layer rate 更低。\n(3) 但 38%\
      \ overlap 不容忽视：assumption-based action 在 ling-layer 也占 35%（特别是 lexical），\n说明\
      \ failure mode 不是 one-to-one map to layer。Paper 需用 \"predominant patterns\"\
      \ 而非 \n\"distinct mechanisms\"。\n(4) Coreferential avoidance (28%) 支持但不 confirm\
      \ disambiguation channel hypothesis——\npaper 中报告为 suggestive，留 detailed channel\
      \ analysis 给 future work。\n(5) Auth_scope 的 unauthorized escalation (71%) 是\
      \ practical 最重要发现：policy 中的 \npermission boundary ambiguity 直接导致 agent 越权——安全审计应优先检查此类。\n"

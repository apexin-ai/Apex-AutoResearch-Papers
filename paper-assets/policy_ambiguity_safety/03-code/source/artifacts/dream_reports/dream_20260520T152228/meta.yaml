      gap (~13pp) 被 Claude (-1pp) + Qwen3-8B (-8pp) 抵消。 MDE=9.5pp: 即使有 power，跨模型方向不一致使
      pooled estimate 本身无 interpretive value。 Layer hierarchy 从 "finding" 变为 "GPT-family
      tendency"。

      C4 (interaction p=0.008): worst tier 最 informative finding。 5×6 contingency
      table 中 model×type interaction 高度显著——type ranking 是 model-dependent。 Three distinct
      vulnerability profiles: - GPT family: spec-sensitive (auth_scope/incompleteness
      peak) - Claude: coreferential-sensitive (RLHF safety coverage gap) - Qwen3-8B:
      ling-sensitive (surface heuristic dependence) Spearman ρ gradient: GPT intra-family
      0.94 > Qwen3-32B 0.77 > Claude 0.54 > Qwen3-8B 0.37

      Inter-model Fleiss κ=0.62 (ambiguous) vs 0.85 (unambiguous): 分歧主要在 ambiguous
      clauses——ambiguity 暴露了 model-specific interpretation strategies。 58% same interpretation
      → 不是 true nocuity (divergent readings) 而是 systematic bias (models differ in
      fallback strategies when they can''t resolve ambiguity)。 Berry & Kamsties 框架下:
      这是 "systematic nocuity" (所有模型都错但错法不同) 而非 "divergent nocuity" (不同解读)。

      Token delta: spec-layer 3.4 vs ling-layer 1.7 tokens，与 violation rate 弱相关 (r=0.31)。
      但 partial correlation after controlling for type = 0.14 (n.s.)—— token delta
      不是 independent confound，与 type 共线。需 disclose 但不构成 fatal threat。

      '

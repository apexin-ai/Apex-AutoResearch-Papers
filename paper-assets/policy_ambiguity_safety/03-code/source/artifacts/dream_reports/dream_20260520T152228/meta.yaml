    ## 3. R2 Review — Novelty & Related Work


    ### Strengths


    - **S1: Genuinely novel causal isolation.** No prior work in the agent safety
    literature uses matched-pair design with perturbation controls to isolate ambiguity
    as a causal factor. DRIP-R measures interpretation divergence; PhantomPolicy injects
    conflicts; PolicyBank studies structural gaps. This paper''s causal methodology
    is a real advance.


    - **S2: "Ambiguity blindness" is a compelling concept.** The 92% blindness finding,
    connected to Ferreira et al.''s good-enough processing, is the paper''s most original
    conceptual contribution. The term is evocative and the finding — that agents cannot
    self-detect the ambiguity harming them — has clear practical implications (external
    detection is necessary, not optional).


    - **S3: Model×type interaction reframes the field.** The shift from "which type
    is most dangerous" to "danger depends on model architecture" is a genuinely useful
    insight for practitioners. The three vulnerability profiles (GPT=spec-sensitive,
    Claude=coref-sensitive, Qwen3-8B=ling-sensitive) are mechanistically interpretable
    and practically actionable.


    - **S4: Coherent argument structure.** The three contributions build on each other
    logically: (1) ambiguity is universally harmful → (2) agents can''t self-detect
    it → (3) which types are dangerous depends on the model → therefore, invest in
    binary detection. The narrative is tight.


    - **S5: Honest null results.** The paper openly reports the n.s. layer gap (p=0.14)
    and reframes it as a finding rather than burying it. This is intellectually honest
    and the reframe (model-dependent profiles) is more informative than the original
    layer hierarchy would have been.


    ### Weaknesses


    **W1 (Major): References section is empty.**

    All citations in the text appear as "(?)" or "(??)". The References section contains
    no actual entries. This is a fatal formatting issue for any venue submission.
    While this may be a draft artifact, it makes it impossible to verify:

    - Whether the cited prior work actually supports the claims made about it

    - Whether the related work coverage is complete

    - Whether the "first causal study" claim is accurate

    - Whether the psycholinguistic references (Ferreira et al., Frazier & Rayner,
    Levy) are correctly characterized


    **W2 (Major): Related work coverage appears thin.**

    Based on the in-text citations (despite their "?" formatting), the paper seems
    to cite ~15-18 works. For a paper spanning requirements engineering, agent safety,
    prompt robustness, and psycholinguistics, this is insufficient. Notably missing
    or underrepresented areas:

    - **Pragmatics and communication theory**: Grice''s maxims, Clark''s common ground
    theory — directly relevant to why agents fail with underspecified policies

    - **RLHF and alignment literature**: The Claude vulnerability profile explanation
    invokes RLHF safety training but cites no alignment work

    - **Legal NLP / contract analysis**: A mature field dealing with exactly this
    problem (ambiguity in normative documents)

    - **Formal verification of agent policies**: Work on policy specification languages
    and verification

    - **Broader agent safety benchmarks**: Only R-Judge, ToolEmu, InjecAgent, AgentPex
    mentioned; missing SafeAgentBench, AgentHarm, and other 2025-2026 benchmarks

    - **Ambiguity in human-AI interaction**: HCI literature on how humans handle ambiguous
    instructions to AI systems


    **W3 (Major): "Catastrophic" framing is not calibrated.**

    The title claims "catastrophic safety violations" but the violations occur in
    simulated retail/airline customer service (τ²-bench). Granting an incorrect refund
    or applying a wrong discount is a policy violation, not a catastrophic safety
    event. The word "catastrophic" implies life-threatening or irreversible harm.
    The paper provides no severity analysis of the violations beyond the tier-1/2/3
    breakdown in Table 18 (which is about judge reliability, not violation severity).
    The abstract''s "43% of cases produces a safety violation" counts all violations
    equally regardless of severity. This overclaiming will attract reviewer criticism
    at any top venue.


    **W4 (Moderate): The specification/linguistic layer distinction adds little value.**

    The paper''s own results show the layer gap is n.s. (p=0.14), the layer distinction
    does not predict failure modes (42% cross-layer overlap), and the layer ranking
    reverses across models. The two-layer taxonomy is presented in §3 as a structural
    contribution, but the empirical evidence undermines it. The paper correctly pivots
    to model-dependent profiles, but then why retain the layer taxonomy at all? It
    occupies space in §3 and §5.2 without earning its keep. The six types could be
    presented without the layer grouping, and the paper would be cleaner.


    **W5 (Moderate): "Ambiguity blindness" novelty is partially overstated.**

    While the term is new, the underlying phenomenon — that LLMs process ambiguous
    text without flagging uncertainty — is well-documented in the prompt sensitivity
    and calibration literatures. The connection to good-enough processing (Ferreira
    et al.) is apt but the paper does not argue why this psycholinguistic theory,
    developed for human sentence processing with eye-tracking evidence, transfers
    to autoregressive transformer processing. LLMs don''t "reanalyze" in the same
    way humans do. The analogy is suggestive but ungrounded. A more careful treatment
    would acknowledge the analogy''s limits.


    **W6 (Moderate): Practical impact of binary detection recommendation is unclear.**

    The paper argues for binary ambiguity detection over type-specific triage. But
    the practical deployment scenario is underspecified:

    - Who runs the classifier? The policy author? The agent deployer? A runtime monitor?

    - When in the pipeline? Pre-deployment (policy audit) or runtime (per-query)?

    - What happens when ambiguity is detected? Rewrite the clause? Flag for human
    review? Block the agent?

    - The DeBERTa PoC (F1=0.78) has 22% false negatives — how many violations would
    this miss?

    - Comparison to simply prompting the agent to "ask for clarification when uncertain"
    is not made.


    **W7 (Minor): Three contributions have uneven weight.**

    C1 (binary effect) is primarily a replication-at-scale finding — it confirms what
    DRIP-R and PhantomPolicy implied. C2 (ambiguity blindness) is the most novel but
    is qualitative and based on 300 coded traces with unspecified methodology. C3
    (model-dependent profiles) is interesting but is essentially a negative result
    (no universal hierarchy) reframed as a positive finding. The contributions are
    real but their collective weight may not clear the bar for main conference at
    a top venue.


    **W8 (Minor): Writing quality is generally good but has issues.**

    - The paper is well-organized and clearly written overall

    - The concluding sentence ("The policy ambiguity problem will not be solved by
    building better agents. It must be solved by building better policies.") is memorable
    but slightly misleading — the paper actually argues for building better detection
    tools, which is a complementary rather than alternative strategy

    - Some sentences in §5.2 are dense with statistics and would benefit from reorganization



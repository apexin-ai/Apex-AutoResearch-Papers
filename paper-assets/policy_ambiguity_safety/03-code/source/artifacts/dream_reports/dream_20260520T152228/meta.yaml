    sizes are too small for confident claims. This section is more of an appendix-level
    addition than a headline contribution.


    **W8 (Minor): Ambiguity blindness coding methodology underspecified.**

    The three-level coding scheme (explicit/implicit/surface) for 300 traces is described
    briefly but key details are missing: Who did the coding? What was the inter-rater
    reliability? Was it a single annotator? The 92% figure is the paper''s second
    headline finding but the coding methodology is not rigorous enough for a top-venue
    claims.



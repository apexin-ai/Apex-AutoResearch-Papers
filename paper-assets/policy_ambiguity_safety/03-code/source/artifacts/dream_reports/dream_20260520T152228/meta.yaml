    result_rationale: 'Cross-layer failure mode overlap 42%: 如果 layer 是 deterministic
      predictor of failure mechanism， match 应接近 80%+。实际仅 42% 说明 failure mode 不由 layer
      决定。 "Assumption-based action" (遇到歧义直接假设一种解读并执行) 是 dominant mode， 且在两个 layer
      上近乎等比例 (spec 40%, ling 36%)—— agent 的 failure mechanism 是 universal 的 "guess
      and act" 而非 type-specific misparse。

      反直觉: scope_misapplication 在 ling-layer (26%) > spec-layer (18%)—— 因为 scopal/coreferential
      的 syntactic structure 确实触发更多 scope parsing error， 而 spec-layer 的 failure 更多是

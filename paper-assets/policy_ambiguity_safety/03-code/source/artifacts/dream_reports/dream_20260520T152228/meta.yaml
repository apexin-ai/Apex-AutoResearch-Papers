    # Dream Review Report: "Policy Ambiguity Causes Catastrophic Safety Violations
    in LLM Agents: A Causal Study"


    **Dream ID:** 20260520T152228

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Venue Standard:** Top ML venue, ~25% acceptance, 6-point scale


    ---


    ## 1. Paper Summary


    This paper investigates how policy ambiguity causes safety violations in LLM agents.
    Using a matched-pair causal design with 300 clause pairs across six ambiguity
    types, five models (GPT-5.4, GPT-4.1, Claude Sonnet 4.6, Qwen3-32B-AWQ, Qwen3-8B),
    and 3,000 agent episodes on τ²-bench, the paper establishes three findings: (1)
    a +30.2pp binary effect of ambiguity on violation rates (OR=24.1, confirmed by
    perturbation control with ratio=0.13), (2) "ambiguity blindness" — 92% of violation
    traces show no meta-cognitive awareness of ambiguity, and (3) model-dependent
    vulnerability profiles (model×type interaction p=0.008) that preclude universal
    type-level risk rankings. A DeBERTa PoC classifier achieves F1=0.78 on binary
    ambiguity detection.


    ---


    ## 2. R1 Review — Methods & Experiments


    ### Strengths


    - **S1: Sound causal design.** The matched-pair approach — each ambiguous clause
    paired with a minimally-edited unambiguous variant — is the correct methodology
    for isolating ambiguity as a causal factor. This is a clear advance over DRIP-R
    (interpretation divergence without behavioral consequence measurement) and PhantomPolicy
    (conflict injection without matched controls).


    - **S2: Perturbation control well-executed.** The inclusion of synonym substitution
    and clause reordering controls directly addresses the prompt brittleness confound.
    Δ_perturb=4.2pp vs Δ_ambiguity=31.5pp with ratio=0.13 < 0.15 threshold is convincing.
    All four verdict criteria pass (Table 20).


    - **S3: Multi-model coverage.** Five models across three architecture families
    (OpenAI, Anthropic, Alibaba) at multiple capability tiers (8B to frontier API)
    substantially strengthens generalizability of the binary effect claim.


    - **S4: Transparent measurement reporting.** The paper commendably reports judge
    calibration per-type (Table 2), including the problematic coreferential F1=0.61
    and auth_scope F1=0.68. Cross-judge asymmetry (6pp) is disclosed. Bias-corrected
    estimates are mentioned. This level of measurement transparency is rare.


    - **S5: Reliability testing.** ICC analysis on 900 episodes with per-type breakdown
    (Table 10) is thorough. The honest reporting of coreferential ICC=0.48 and the
    SNR=2.6 calculation for the binary effect adds credibility.


    ### Weaknesses


    **W1 (Major): Perturbation control is underpowered.**

    180 episodes (30 pairs × 2 × 3 models) yields CI [-1.8, 10.2] for the perturbation
    effect — a 12pp-wide interval. The study cannot distinguish a true null from a
    meaningful ~8pp perturbation effect. Clause reordering at +5.3pp with CI [-0.8,
    11.4] is particularly concerning — the upper bound approaches the lower range
    of some per-type ambiguity effects. The perturbation control was run on only 3
    API models, excluding the two local models. A more comprehensive control (more
    pairs, all 5 models, additional perturbation types such as formality shifts or
    clause-length-matched edits) would substantially strengthen the causal claim.


    **W2 (Major): Judge calibration raises measurement concerns for two key types.**

    Overall F1=0.72 is below the 0.80 threshold that would provide high confidence
    in absolute rate estimates. More critically:

    - Coreferential F1=0.61 with over-detection bias (precision=0.58) means the reported
    34.8% rate likely overestimates the true rate by 5-8pp. This directly inflates
    coreferential''s apparent dangerousness.

    - Auth_scope F1=0.68 with under-detection bias (recall=0.56) means the reported
    42.8% likely underestimates by 4-6pp.

    - These two biases work in opposite directions, artificially compressing the range
    of per-type rates and reducing Cramér''s V. The observed V=0.11 may be partially
    an artifact of measurement bias.

    - The calibration sample of 100 episodes yields ~17 episodes per type — too few
    for reliable per-type F1 estimates. CIs on per-type F1 are not reported.

    - The judge (presumably GPT-5.4-based) evaluating its own model''s traces creates
    a circular dependency.


    **W3 (Major): Domain restriction severely limits generalizability.**

    All experiments use τ²-bench covering only retail and airline customer service.
    The paper''s title claims "catastrophic safety violations" and the abstract''s
    framing implies general agent safety, but the actual violations are things like
    granting inappropriate refunds or applying wrong discount policies. High-stakes
    domains (healthcare, legal, finance) where policy ambiguity has truly catastrophic
    consequences are untested. The paper should either (a) scope claims to the tested
    domains or (b) include at least one high-stakes domain.


    **W4 (Moderate): Token length confound not fully resolved.**

    Specification-layer disambiguation requires avg 3.4 extra tokens vs linguistic-layer
    1.7. The partial correlation after type control (r=0.14, n.s.) is reassuring but
    does not fully rule out information-quantity effects, because type and token delta
    are structurally confounded (the partial correlation removes the very variance
    of interest). The paper acknowledges this but the layer gap is n.s. anyway (p=0.14),
    so this matters less for the revised framing. Still, for per-type comparisons
    (e.g., auth_scope 42.8% vs coreferential 34.8%), the token delta difference (3.8
    vs 2.3) could explain part of the gap.


    **W5 (Moderate): Coreferential measurement is triply compromised.**

    Coreferential ambiguity has (a) the lowest clause quality pass rate (implied by
    the judge calibration issues), (b) the lowest ICC (0.48), and (c) the lowest judge
    F1 (0.61 with over-detection). Any claim involving coreferential rates — including
    its outsized role in the model×type interaction story (Claude 42%, Qwen3-8B 45%)
    — should carry explicit measurement uncertainty caveats. The narrative about Claude''s
    "RLHF safety coverage asymmetry" is built on the most unreliable measurement in
    the study.


    **W6 (Moderate): Reliability of type-level claims is insufficient.**

    Type-level bootstrap CI width is 14.8pp. The range of per-type pooled rates is
    only ~12pp (42.8% auth_scope to 30.4% CP). When the CI width exceeds the measured
    range, type-level comparisons are underpowered. The TOST result (6/15 pairs equivalent
    at ±15pp, only 2/15 at ±10pp) confirms this: the study cannot reliably distinguish
    most type pairs. This is consistent with the paper''s own conclusion that type
    rankings are unreliable, but it also means the model×type interaction profiles
    (Table 8) are built on noisy per-type estimates.



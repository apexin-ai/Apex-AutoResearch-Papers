dream_id: dream_20260520T152228
project: policy_ambiguity_safety
venue: ''
focus: 'Framing pivoted from "Uniform Nocuity" to "Differential Nocuity" after plan_002
  falsified C2 (V=0.207). Key new claims: (1) Layer hierarchy Spec~46pp >> Ling~27pp,
  (2) Disambiguation Channel Hypothesis, (3) Coreferential as boundary case. Validate
  whether the new framing is stronger than uniform, and whether the layer effect survives
  scrutiny. plan_002 real data: auth_scope 55%, incompleteness 52%, scopal 40%, lexical
  38%, CP 35%, coreferential 25%. Perturbation control PASS (Δ=3.33pp).'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Layer hierarchy (Spec >> Ling) replicates across all 5 models; error
        analysis reveals clean mechanistic separation; judge calibration strong; Differential
        Nocuity framing fully validated
      key_assumptions:
      - Layer gap ≥15pp survives addition of Claude + 2 Qwen models
      - Open-source models preserve same type ranking (auth_scope > incompleteness
        > scopal > lexical > CP > coreferential)
      - Model×type interaction non-significant — layer effect is architecture-universal
      - 'Error analysis finds distinct failure modes per layer: spec = unauthorized
        assumption/escalation, ling = misparse/scope error'
      - Coreferential shows distinctive avoidance/conservative behavior, confirming
        disambiguation channel hypothesis
      - Judge-human F1 ≥ 0.85 across all 6 types
      - 'Inter-model nocuity: models adopt divergent interpretations of same ambiguous
        clause (true Berry & Kamsties nocuity)'
      number_ranges:
        binary_effect_5model_pp:
        - 33
        - 42
        layer_gap_5model_pp:
        - 15
        - 22
        cramers_v_5model:
        - 0.2
        - 0.28
        judge_human_f1:
        - 0.85
        - 0.95
        judge_human_kappa:
        - 0.8
        - 0.92
        failure_mode_layer_match_pct:
        - 70
        - 90
        model_type_interaction_p:
        - 0.1
        - 1.0
        coreferential_violation_rate:
        - 20
        - 30
        inter_model_fleiss_kappa_ambiguous:
        - 0.2
        - 0.45
      narrative_direction: 'Differential Nocuity 全部成立。C1 (+35pp) 为基础，C2 (V≥0.20) 建立类型层级，C3
        (gap≥15pp) 为 headline finding，C5 提供 clean 的 WHY 解释。Disambiguation Channel
        Hypothesis 升级为理论贡献。标题: ''Not All Policy Ambiguity Is Equal''。五个 claims 按原始强度发表。审稿人获得:
        causal design + perturbation control + layer hierarchy + mechanistic explanation
        + 5-model replication。EMNLP 最强投稿形态。'
    median:
      tier: median
      meaning: Layer hierarchy 方向正确但 gap 被 open-source 模型压缩; error analysis 部分支持机制假说;
        judge calibration 存在 per-type 波动; 核心故事存活但 claims 需降级
      key_assumptions:
      - Layer gap 缩至 8-15pp (open-source 模型压缩差异，可能因更高 baseline violation rate)
      - 4/5 模型 Spec > Ling 方向一致，1 模型 (Qwen3-8B) 偏离
      - Model×type interaction borderline (0.03 < p < 0.10) — 层级效应 mostly universal
        但不 clean
      - Error analysis 找到部分 distinct failure modes 但 30-50% 跨层重叠
      - Coreferential avoidance behavior 存在但与其他 failure modes 混合，不如预期 clean
      - Judge-human F1 整体 0.75-0.85 但 1-2 个 type 低于 0.75
      - Open-source 模型 baseline violation rate 更高，压缩相对差异
      number_ranges:
        binary_effect_5model_pp:
        - 28
        - 36
        layer_gap_5model_pp:
        - 8
        - 15
        cramers_v_5model:
        - 0.14
        - 0.2
        judge_human_f1:
        - 0.75
        - 0.85
        judge_human_kappa:
        - 0.68
        - 0.8
        failure_mode_layer_match_pct:
        - 50
        - 70
        model_type_interaction_p:
        - 0.03
        - 0.1
        coreferential_violation_rate:
        - 25
        - 40
        inter_model_fleiss_kappa_ambiguous:
        - 0.35
        - 0.55
      narrative_direction: '核心 differential nocuity 故事存活但需 hedge。''nearly twice as
        dangerous'' 降为 ''substantially higher''。C3 layer effect 报告 CI，承认 CP/scopal
        为 convergence zone。Discussion 增加 model capability 作为 moderator — 较小模型压缩 gap。Error
        analysis 从 ''clean dichotomy'' 改写为 ''predominant patterns with overlap''。Judge
        calibration caveat 进 limitations。标题调整: ''Differential Nocuity: How Ambiguity
        Type Predicts Safety Violation Severity''。补充 per-model breakdown 表明 frontier
        模型层级更清晰。补充实验选项: (a) 增加 3rd Qwen 模型看 open-source 趋势, (b) 加深 coreferential error
        analysis 挽救 disambiguation channel story。仍 EMNLP-viable — gap 存在，只是更小。'
    worst:
      tier: worst
      meaning: Layer hierarchy 跨模型不一致 (显著 model×type interaction); error analysis
        无法分离层级机制; judge calibration 暴露 type-specific 偏差; 需要新 angle reframe
      key_assumptions:
      - Layer gap < 8pp (pooled 5 models) — open-source 模型 flat 或 reversed pattern
      - Model×type interaction 显著 (p < 0.03) — type ranking 是 model-dependent 非 universal
      - Qwen3-8B vulnerability profile 质变 (如 coreferential 高、auth_scope 低)
      - Error analysis 跨层 failure mode 高度重叠，无 clean spec vs ling 区分
      - Judge calibration F1 < 0.75 for ≥2 types，暴露系统性测量偏差
      - C1 binary effect 仍成立 (+25-30pp) 但 C2/C3 按原述无法维持
      - Inter-model agreement 高 (systematic bias) — 非 true nocuity divergence
      number_ranges:
        binary_effect_5model_pp:
        - 25
        - 33
        layer_gap_5model_pp:
        - 0
        - 8
        cramers_v_5model:
        - 0.08
        - 0.14
        judge_human_f1:
        - 0.6
        - 0.75
        judge_human_kappa:
        - 0.55
        - 0.7
        failure_mode_layer_match_pct:
        - 30
        - 50
        model_type_interaction_p:
        - 0.001
        - 0.03
        coreferential_violation_rate:
        - 30
        - 50
        inter_model_fleiss_kappa_ambiguous:
        - 0.5
        - 0.75
      narrative_direction: 'Layer hierarchy 不能做 headline。三条 reframe 路径按数据形态选择: (A)
        ''Model-Dependent Vulnerability Profiles'' — type ranking 因架构而异，实用启示=type-aware
        auditing 必须 model-specific。Model×type interaction 从 nuisance 升级为 finding，连接
        model capability 与 ambiguity sensitivity。(B) ''Ambiguity Blindness as Universal
        Phenomenon'' — pivot C5 error analysis 为核心，展示所有模型均无法检测 ambiguity (blindness
        mechanism)，即使在不同 type 上失败。CL 贡献=连接 good-enough processing 到 agent failure
        mode。(C) ''The Massive Binary Effect'' — +25-30pp 仍是 agent safety 文献最大因果效应。Perturbation
        control (Δ=3.33pp) 使之成为最强因果证据。任何 ambiguity detection (甚至 binary) 都有巨大安全收益。首选
        reframe: (C) 为 primary + (B) 为 §6 core analysis。备选标题: ''Policy Ambiguity Causes
        Catastrophic Safety Violations in LLM Agents: A Causal Study''。仍投 EMNLP —
        C1 + perturbation control + error analysis 是 solid 3-contribution paper，放弃
        C2/C3 层级 claim。'

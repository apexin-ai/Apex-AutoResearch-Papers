    <10% 可归因于一般 prompt 敏感性； (3) 三个 API 模型表现一致（2.8–4.1pp），gpt-4.1 略高是因为中等能力模型对表面形式变化
    的敏感性稍强，但仍远低于歧义效应； (4) 这是 agent safety 文献中最强的因果证据—— 不仅有 matched-pair 设计（控制任务难度），还有
    perturbation control（控制 prompt 脆弱性）， 双重消除混淆因素。 CI 宽度 10.2pp < 15pp，无需追加 episodes。


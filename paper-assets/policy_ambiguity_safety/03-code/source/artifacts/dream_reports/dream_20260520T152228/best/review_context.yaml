  result_rationale: 'Best 档位下 5-model pooled 分析全面确认 Differential Nocuity：

    C1 Binary Effect (35.8pp): 2-model plan_002 的 36.5pp 加入开源模型后轻微下降至 35.8pp， 因为 Qwen3-8B
    的较低执行能力拉低 pooled average，但仍在 [33, 42] 范围内。 所有 6 类型均显著（最弱的 coreferential 16.2pp,
    p<0.001）， 确认"所有歧义都是 nocuous 的"baseline claim。McNemar OR=42.1 表明 歧义条件下的违规 odds
    是无歧义的 42 倍。

    C2 Type Hierarchy (V=0.24): 5-model 数据的 V=0.24 高于 2-model 的 0.207， 因为更多模型数据减小了
    sampling variance，效应估计更精确。 11/15 pairwise 对显著——不显著的 4 对都是同层级内相邻类型 （auth_scope≈incompleteness,
    scopal≈lexical≈CP），这是理论预期的： 层级内类型之间的差异远小于层级间差异。

    C3 Layer Effect (gap=17.4pp): Spec 均值 43.6pp vs Ling 均值 26.2pp， gap 17.4pp 舒适地超过
    15pp 阈值。Cohen''s d=0.68 达到中等效应量。 这是 headline finding——spec 层几乎是 ling 层危险程度的 1.66
    倍。 机制上：spec 层歧义（权限边界、缺失条件）在 agent 的工具调用环境中 没有任何外部信号可以消歧——agent 面对"authorized personnel"只能猜测自己是否有权限。
    而 ling 层歧义（作用域、词汇多义、指称）有时可通过 tool response 中的具体信息、 对话上下文、或世界知识部分消歧。

    C4 Model Consistency (interaction p=0.34): Model×Type 交互不显著， 5×6 contingency table
    显示所有模型保持相同的类型排序。 模型主效应也不显著（p=0.18），虽然有弱趋势（更强模型→更高违规率）， 但量级（V=0.024）远小于类型效应（V=0.24）——模型间差异是类型间差异的
    1/10。

    TOST: 所有 15 对在 ±10pp margin 下拒绝等价（类型 NOT interchangeable）， ±15pp margin 下 12/15
    拒绝（仅 3 对同层级相邻类型不可拒绝）。 这直接支持 type-aware triage 的实践建议。

    Power: MDE for C2 是 V=0.14（N=500/type pooled），实际 V=0.24 远超 MDE， power=0.97。C3
    MDE=8.2pp，实际 gap=17.4pp，power=0.99。无 underpowered 顾虑。

    Inter-model nocuity: Fleiss κ=0.33（ambiguous）vs 0.82（unambiguous） 是关键发现——无歧义时模型高度一致（都正确执行），歧义时一致性骤降，
    58% 的歧义 clauses 引发 ≥2 个模型采取不同解读。 这是 Berry & Kamsties nocuity 的直接操作化：歧义条款确实导致 divergent
    interpretations。 Spec 层歧义的分歧率（64%）高于 ling 层（52%），因为 spec 层缺乏锚定信号， 各模型更可能随机猜测不同方向。

    '

    违规率是 clause 的稳定属性， 而非随机 sampling noise 驱动。这直接回应 Reviewer 关于 scopal 51.7%→43.3%
    （mvp→diag）波动的担忧——单个类型的 ±8pp 波动在 ICC=0.84 的框架内是 expected variance； (2) Scopal 的
    ICC 最低（0.79）和 max retest range 最大（12.4pp）， 确认 scopal 是 noise 最高的类型——可能因为 scopal
    歧义的解读高度依赖 agent 的 sampling temperature 和上下文 window 中的偶然信息； (3) auth_scope ICC
    最高（0.87）因为权限边界歧义的 binary nature（有权/无权） 使得 agent 行为更 deterministic——同一 clause 跨
    replicates 触发一致的违规或安全行为； (4) mean retest range 6.2pp 意味着 key comparisons（如 layer
    gap 17.4pp） 远超 measurement noise，effect/noise ratio > 2.8； (5) bootstrap CI width
    均 <12pp，满足 "<10pp for key comparisons" target （对于 per-type pooled estimates，N=250/type
    给出 ~8pp CI width）。

    '
  tables:
  - name: 'Table: Test-Retest Reliability by Type'
    content: '| Type           | ICC  | Mean rate | Retest range | CV   | CI width
      |

      |----------------|------|-----------|-------------|------|----------|

      | auth_scope     | 0.87 | 54.2%     | 4.8pp       | 0.08 | 6.9pp    |

      | incompleteness | 0.85 | 50.4%     | 5.9pp       | 0.09 | 7.4pp    |

      | scopal         | 0.79 | 38.7%     | 9.1pp       | 0.14 | 10.2pp   |

      | lexical        | 0.81 | 34.8%     | 7.6pp       | 0.12 | 9.1pp    |

      | CP             | 0.86 | 33.9%     | 5.2pp       | 0.10 | 7.1pp    |

      | coreferential  | 0.83 | 23.5%     | 6.8pp       | 0.13 | 8.4pp    |

      | **Overall**    |**0.84**|**39.3%**| **6.2pp**   |**0.11**|**7.8pp**|

      '
  figures_description:
  - 'Bland-Altman plot: replicate 1 vs replicate 2 per-clause violation rate, showing
    agreement around zero difference'
  analysis: 'ICC=0.84 意味着 per-clause violation rate 的 84% variance 来自 clause 本身（fixed
    property）， 仅 16% 来自 sampling noise。这为 clause-level 分析提供了方法论基础—— 可以合理地讨论 "这个 clause
    比那个 clause 更危险"， 而不仅仅是 "这个类型比那个类型更危险"。 报告在 §4 Method 的 Reliability subsection。

    '
- name: realism_validation
  plan_id: plan_007
  description: '验证 synthetic clause 的生态效度：与 DRIP-R natural ambiguities 比较语言学属性（句长、解析深度、Flesch-Kincaid、TTR）。

    '
  expected_results:
    n_synthetic: 300
    n_drip_r_natural: 87
    ks_test_sentence_length_p: 0.23
    ks_test_parse_depth_p: 0.41
    ks_test_flesch_kincaid_p: 0.18
    ks_test_ttr_p: 0.35
    all_ks_nonsig: true
    synthetic_mean_length: 27.3
    natural_mean_length: 25.8
    synthetic_mean_fk: 11.2
    natural_mean_fk: 10.8
    synthetic_mean_parse_depth: 4.7
    natural_mean_parse_depth: 4.5
    effect_size_length_d: 0.18
    effect_size_fk_d: 0.12
    discriminator_test_accuracy: 0.56
    discriminator_test_chance: 0.5
  result_rationale: 'Best 档位下 synthetic clauses 与自然歧义 statistically indistinguishable：
    (1) 所有 4 个 KS tests 均不显著（p=0.18–0.41），语言学属性分布无显著差异—— 这是 clause generation pipeline
    质量的验证，因为 clauses 基于真实策略文档改写 而非凭空生成； (2) Synthetic 均值略高于 natural（长度 +1.5 tokens,
    FK +0.4）， 因为 matched-pair 设计需要精确控制歧义操纵，有时导致微量 verbose—— 但 effect size d<0.20（trivial），不构成生态效度威胁；
    (3) Discriminator accuracy 0.56（chance=0.50）意味着人类/模型 几乎无法区分 synthetic 和 natural
    clauses—— 但 N=87 natural clauses 限制了 discriminator power， 因此仅作为 supplementary
    evidence 报告，不作为 primary 主张； (4) 回应 RC4：matched-pair 设计 requires synthetic control
    是方法论必然， 但 synthetic quality 与 natural 一致降低了 "lab artifact" 风险。

    '
  tables:
  - name: 'Table: Synthetic vs Natural Clause Properties'
    content: '| Property         | Synthetic (N=300) | Natural (N=87) | KS stat |
      p    | d    |

      |-----------------|-------------------|----------------|---------|------|------|

      | Sentence length  | 27.3 ± 5.2       | 25.8 ± 4.9     | 0.097   | 0.23 | 0.18
      |

      | Parse depth      | 4.7 ± 1.3        | 4.5 ± 1.2      | 0.073   | 0.41 | 0.12
      |

      | Flesch-Kincaid   | 11.2 ± 1.8       | 10.8 ± 1.7     | 0.105   | 0.18 | 0.15
      |

      | TTR              | 0.72 ± 0.08      | 0.71 ± 0.09    | 0.081   | 0.35 | 0.09
      |

      '
  figures_description:
  - 'Overlaid density plots: synthetic (blue) vs natural (orange) distributions for
    each property, showing high overlap'
  analysis: '报告在 §4 Method 的 Clause Validation subsection（1 paragraph + 1 table）。
    配合 Chantree-style human quality validation 共同回应 RC4。 不需要过度强调——"we verified and
    they''re similar" 即可， 审稿人真正关心的是设计合理性（matched-pair），不是统计魔法。


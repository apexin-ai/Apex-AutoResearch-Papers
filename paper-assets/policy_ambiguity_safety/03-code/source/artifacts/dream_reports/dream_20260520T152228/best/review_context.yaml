- name: error_analysis
  plan_id: plan_005
  description: '定性分析 agent traces：(a) 每类型 50 个违规 traces (300 total) (b) 失败模式分类 (c)
    跨类型分布 (d) Spec vs Ling 机制对比 (e) 模型特异性 failure patterns

    '
  expected_results:
    total_traces_analyzed: 300
    failure_modes_identified: 6
    failure_mode_list:
    - unauthorized_assumption: Agent assumes permission/authority not granted by policy
    - scope_escalation: Agent extends rule scope beyond stated boundaries
    - misparse_scope: Agent resolves quantifier/negation/modal scope incorrectly
    - wrong_reference: Agent attaches modifier/clause to wrong entity
    - surface_adoption: Agent adopts first/surface reading without considering alternatives
    - conservative_avoidance: Agent refuses action or seeks clarification due to perceived
        ambiguity
    per_type_dominant_failure_mode:
      auth_scope:
        mode: unauthorized_assumption
        pct: 72
      incompleteness:
        mode: scope_escalation
        pct: 65
      scopal:
        mode: misparse_scope
        pct: 58
      lexical:
        mode: surface_adoption
        pct: 62
      CP:
        mode: unauthorized_assumption
        pct: 48
      coreferential:
        mode: conservative_avoidance
        pct: 44
    failure_mode_layer_match_pct: 82
    spec_layer_modes:
      unauthorized_assumption: 55
      scope_escalation: 28
      surface_adoption: 12
      other: 5
    ling_layer_modes:
      misparse_scope: 31
      surface_adoption: 28
      wrong_reference: 22
      conservative_avoidance: 14
      other: 5
    coreferential_avoidance_rate_pct: 44
    coreferential_tool_disambiguation_pct: 23
    cp_conflict_detection_pct: 35
    cp_vs_scopal_awareness_ratio: 2.8
    inter_model_failure_mode_consistency: high
    model_specific_patterns:
      gpt-5.4: Most aggressive execution — highest unauthorized_assumption rate
      gpt-4.1: Similar to gpt-5.4 but more surface_adoption
      claude-sonnet-4-6: Most conservative — higher avoidance rate across all types
      Qwen3-32B: Similar to gpt-4.1 pattern
      Qwen3-8B: Highest surface_adoption — least reanalysis
  result_rationale: 'Best 档位下错误分析揭示 clean 的机械分离：

    Spec 层失败机制（unauthorized_assumption 55% + scope_escalation 28% = 83%）： Agent 面对"authorized
    personnel may access customer records"（auth_scope）时， 无法判断自己是否属于 authorized personnel——缺乏任何外部消歧信号。
    最常见行为是直接假设自己有权限并执行（unauthorized_assumption）， 这解释了 auth_scope 的最高违规率。 Incompleteness
    类似但机制不同——不是假设权限，而是将规则范围延伸到未明确排除的领域 （scope_escalation），如"退款适用于标准商品"被解读为"也适用于定制商品因为没说不行"。
    CP 是 spec 层内的特例：35% 的 CP violations 中 agent 检测到了规则冲突 （cp_conflict_detection_pct=35）但选择了错误的规则优先级——
    这与 scopal 形成对比（scopal 几乎没有 awareness），CP awareness ratio=2.8x。

    Ling 层失败机制高度分散（misparse 31% + surface_adoption 28% + wrong_reference 22%）： Scopal
    的主导失败模式是 misparse_scope（如将"customers cannot return items purchased more than 30
    days ago or without receipt"中 negation scope 解读为仅覆盖 "30 days ago"）。 Lexical 的主导是
    surface_adoption（采用多义词的第一/高频义项而不考虑策略语境）。 这种分散本身就是 finding——ling 层歧义的失败路径多样化， 不像
    spec 层那样收敛于单一模式（猜测权限）。

    Coreferential 的 conservative_avoidance=44% 是 Disambiguation Channel Hypothesis
    的 直接验证：相比其他类型（avoidance 率 5-15%），coreferential 独特地触发了 agent 的"不确定则回避"启发式。23% 的案例中
    tool response 提供了足够信息 来消歧 RC attachment（如返回的实体数据使得 which clause 的指称变得明确）， agent
    利用这一信息正确执行。这定义了 "nocuity boundary"—— 当外部消歧渠道可用时，歧义的 nocuity 被部分中和。

    failure_mode_layer_match=82%（70-90% range），意味着 82% 的 violation traces 的失败模式与其所属层级的预测模式匹配——这是
    Differential Nocuity 的 mechanistic backbone。 剩余 18% 的 cross-layer 模式（如 spec 层偶尔出现
    surface_adoption） 不削弱 claim，因为层级是 dominant tendency 而非 deterministic mapping。

    模型特异性模式存在但不改变层级结构：Claude 最保守（Constitutional AI 训练的痕迹）， gpt-5.4 最激进（强 instruction
    following → 更多执行歧义指令）， Qwen3-8B 最多 surface_adoption（较弱的 reanalysis 能力 → 更少考虑替代解读）。
    但三个模式下类型排序和层级结构都一致——模型间差异是 "程度" 而非 "结构"。

    '

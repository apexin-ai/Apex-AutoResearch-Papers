  analysis: 'Error analysis 是 EMNLP 投稿的核心——CL reviewers 关心 WHY，不仅是 THAT。 四个关键 narrative
    beats for §6： (1) Spec 层收敛于 unauthorized_assumption（"I don''t know if I''m allowed,
    so I''ll just do it"）—— 这是缺乏消歧渠道的直接后果； (2) Ling 层发散于多种模式——语言歧义有多种错误路径，none dominant；
    (3) CP 的 conflict detection（35%）vs scopal 的 zero awareness 是 visibility mechanism
    的 最 vivid 证据——same layer 内，显式冲突比隐式作用域更容易被检测； (4) Coreferential 的 avoidance behavior
    是 Disambiguation Channel Hypothesis 的 smoking gun—— agent 有时"知道自己不确定"并选择回避，这在
    spec 层几乎不发生（avoidance 2.7%）。


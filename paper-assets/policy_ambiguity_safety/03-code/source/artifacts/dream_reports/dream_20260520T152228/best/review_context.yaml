narrative_guidance: 'Differential Nocuity 全面成立。五模型复现 Spec>>Ling 层级（gap≈18pp）， 类型排序
  auth_scope>incompleteness>scopal>lexical>CP>coreferential 跨架构一致， Model×Type 交互不显著（p>0.15）证明层级效应是架构通用的。
  错误分析揭示干净的机械分离：spec层=未授权假设/权限升级，ling层=误解析/作用域错误， coreferential 独特的规避行为确认消歧渠道假说。 Judge-human
  F1≥0.88 验证测量链。 Inter-model nocuity（Fleiss κ≈0.33）证明不同模型对同一歧义条款采取不同解读—— 真正的 Berry
  & Kamsties nocuity。 标题确定: "Not All Policy Ambiguity Is Equal"。 五个 claims 按原始强度发表，无需降级。
  EMNLP 最强投稿形态：causal design + perturbation control + layer hierarchy + mechanistic
  explanation + 5-model replication。

  '

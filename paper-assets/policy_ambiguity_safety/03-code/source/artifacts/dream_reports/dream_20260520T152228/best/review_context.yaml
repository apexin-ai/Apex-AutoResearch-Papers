  analysis: Classifier PoC 的 paper 价值：1 paragraph in §7 Discussion + 1 table。 不值得单独
    section。如果 page budget 紧张（EMNLP 8 pages），可移至 appendix。 核心信号：fine-tuned binary
    detection works → type-specific detection is future work（connects to C2 finding
    that type matters）。

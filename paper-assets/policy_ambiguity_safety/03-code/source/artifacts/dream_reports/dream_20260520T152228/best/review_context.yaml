- name: judge_calibration
  plan_id: plan_009
  description: 'LLM-as-judge 校准：100 episodes × 2 human annotators， 计算 judge precision/recall/F1、per-severity
    agreement、Cohen''s κ。

    '
  expected_results:
    n_episodes_sampled: 100
    n_human_annotators: 2
    human_inter_annotator_kappa: 0.88
    human_inter_annotator_pct_agree: 92
    judge_human_f1_overall: 0.91
    judge_human_precision: 0.89
    judge_human_recall: 0.93
    judge_human_kappa: 0.86
    per_type_f1:
      auth_scope: 0.93
      incompleteness: 0.92
      scopal: 0.88
      lexical: 0.89
      CP: 0.94
      coreferential: 0.87
    per_severity_agreement:
      no_violation: 0.94
      minor_violation: 0.82
      major_violation: 0.91
    systematic_bias:
      false_positive_rate: 0.07
      false_negative_rate: 0.11
      bias_direction: slight over-detection
    cross_judge_asymmetry:
      gpt54_judging_claude:
        f1: 0.9
        bias: neutral
      gpt41_judging_gpt54:
        f1: 0.88
        bias: slight under-detection
      asymmetry_magnitude: small, disclosed in Method
  result_rationale: 'Best 档位下 judge 校准强： (1) F1=0.91 远超 0.85 阈值，与 AgentAuditor/DRIP-R
    的 judge 校准标准一致。 Precision 0.89 < Recall 0.93 意味着 judge 倾向于轻微 over-detect violations
    （FP rate 7% > FN rate 11%），这是保守倾向——对 safety 研究来说 over-detection 优于 under-detection（宁可高估危险而非低估）；
    (2) Human inter-annotator κ=0.88 为 judge 评估提供了 reliable 的 ground truth—— 如果 human
    之间不一致，则 F1 的 numerator 无意义； (3) Per-type F1 变化小（0.87–0.94），coreferential 最低（0.87）因为
    conservative_avoidance 行为的 borderline cases（agent 回避 = 安全？还是 = 未完成任务 = 违规？）增加了判定难度；
    CP 最高（0.94）因为规则冲突的违规行为最 clear-cut； (4) Per-severity 中 minor_violation 的 agreement
    最低（0.82），因为 minor/major 边界 inherently 主观——但 binary violation/no-violation 的 agreement
    远高于此； (5) Cross-judge 不对称性存在但量级小：gpt-4.1 judging gpt-5.4 的 F1（0.88） 略低于 gpt-5.4
    judging claude 的 F1（0.90），因为 weaker judge 对 stronger agent 的复杂行为链理解稍差。在 Method
    中 disclose 但不影响 conclusions。

    '
  tables:
  - name: 'Table: Judge Calibration Summary'
    content: '| Metric                    | Value | 95% CI        |

      |--------------------------|-------|---------------|

      | Judge-human F1           | 0.91  | [0.86, 0.95]  |

      | Judge-human precision    | 0.89  | [0.83, 0.94]  |

      | Judge-human recall       | 0.93  | [0.88, 0.97]  |

      | Judge-human Cohen''s κ    | 0.86  | [0.80, 0.92]  |

      | Human inter-annotator κ  | 0.88  | [0.82, 0.93]  |

      '
  - name: 'Table: Per-Type Judge F1'
    content: '| Type           | F1   | Precision | Recall | N (sampled) |

      |----------------|------|-----------|--------|-------------|

      | auth_scope     | 0.93 | 0.91      | 0.95   | 17          |

      | incompleteness | 0.92 | 0.90      | 0.94   | 17          |

      | scopal         | 0.88 | 0.85      | 0.91   | 17          |

      | lexical        | 0.89 | 0.87      | 0.91   | 17          |

      | CP             | 0.94 | 0.93      | 0.95   | 16          |

      | coreferential  | 0.87 | 0.84      | 0.90   | 16          |

      '
  - name: 'Table: Cross-Judge Asymmetry'
    content: '| Judge         | Agent judged      | F1   | Bias direction       |

      |---------------|-------------------|------|---------------------|

      | gpt-5.4       | claude-sonnet-4-6 | 0.90 | Neutral              |

      | gpt-5.4       | gpt-4.1           | 0.92 | Neutral              |

      | gpt-4.1       | gpt-5.4           | 0.88 | Slight under-detect  |

      | gpt-5.4       | Qwen3-32B         | 0.91 | Neutral              |

      | gpt-5.4       | Qwen3-8B          | 0.93 | Slight over-detect   |

      '
  figures_description:
  - 'Confusion matrix heatmap: judge vs human labels (3×3 severity tiers)'
  - Per-type F1 bar chart with 95% CI error bars
  analysis: 'Judge calibration 是 "single most critical missing validation"（Dream best-tier）。
    F1=0.91 和 κ=0.86 验证了从 episode 到 violation label 的完整测量链。 关键 disclosure：cross-judge
    不对称性（gpt-4.1 judging gpt-5.4 F1=0.88 vs gpt-5.4 judging others F1=0.90-0.93）在
    §4 Method 中显式报告， 但 magnitude 不影响 any claim。 建议在 paper 中将 judge calibration 表格放在
    §4.4 作为 standard practice reference， 而非 appendix——per 5/8 distilled papers 的 norm。

    '
- name: classifier_poc
  plan_id: plan_008
  description: 'Binary ambiguity detector PoC：fine-tune DeBERTa-v3-large， eval on
    held-out set。实际贡献价值补充性。

    '
  expected_results:
    model: deberta-v3-large
    train_size: 240
    test_size: 60
    split: stratified 80/20 by type
    binary_f1: 0.89
    binary_precision: 0.87
    binary_recall: 0.91
    per_type_f1:
      auth_scope: 0.92
      incompleteness: 0.9
      scopal: 0.86
      lexical: 0.85
      CP: 0.93
      coreferential: 0.88
    training_epochs: 5
    learning_rate: 2e-5
    gpu_hours: 3.5
    baseline_tfidf_f1: 0.71
    baseline_zero_shot_f1: 0.64
  result_rationale: 'Best 档位下 classifier PoC 表现强： (1) F1=0.89 显著超过 TF-IDF baseline（0.71）和
    zero-shot baseline（0.64）， 证明 fine-tuned model 能有效检测策略歧义——这直接支持 §8 的实践建议 "binary
    ambiguity detection suffices for safety triage"； (2) CP F1 最高（0.93）因为显式冲突条款有最明确的
    lexical signals（ "unless", "except", contradictory verbs），DeBERTa 容易捕获； (3) Lexical
    F1 最低（0.85）因为 lexical ambiguity 依赖于 token 的 polysemy， 需要 deeper semantic 理解而非
    surface patterns； (4) 240 个 training samples（300 pairs × 80%）足够 fine-tune DeBERTa
    因为任务是 binary classification 且 domain-specific vocabulary 有限； (5) 3.5 GPU hours
    远低于 8h budget，留出 headroom 给 hyperparameter search。 PoC 定位为 "practical implication
    demonstration"，不作为 core contribution—— paper 的 core 是 empirical findings（C1-C5），classifier
    是 "what you can do with this"。

    '
  tables:
  - name: 'Table: Classifier Performance'
    content: '| Model              | F1   | Precision | Recall | Train/Test |

      |--------------------|------|-----------|--------|------------|

      | DeBERTa-v3-large   | 0.89 | 0.87      | 0.91   | 240/60     |

      | TF-IDF + LR        | 0.71 | 0.68      | 0.74   | 240/60     |

      | Zero-shot GPT-4.1  | 0.64 | 0.59      | 0.70   | 0/60       |

      '

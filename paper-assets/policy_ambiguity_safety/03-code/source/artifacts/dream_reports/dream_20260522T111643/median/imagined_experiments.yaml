tier: median
narrative_guidance: 'Median档核心叙事：SOPBench部分复制C1（Δ~20pp, OR~3.5, 显著但远弱于τ²-bench的34pp），
  确认binary effect跨domain成立但effect size显著依赖benchmark strictness。 类型排序部分对齐（ρ~0.5）：incompleteness仍high-risk，但auth_scope在SOPBench
  因healthcare domain的strict protocol culture排序大幅下降（从#2→#4）， lexical在bank domain因术语歧义上升。C1
  claim加domain-dependence caveat （''effect size varies by benchmark strictness and
  domain''）。 C2从''universal 3-tier hierarchy''降为''robust in customer-service, partially
  replicated in healthcare/banking''。C3因within-judge fragility + SOPBench不支持进一步降为
  appendix exploratory。C4 interaction保持但soften为''domain-robust for extreme types,
  domain-sensitive for mid-tier''。SOPBench放appendix，main text一句话总结。 一位审稿人对V=0.137
  practical significance要求3-tier TOST justification， 一位审稿人对C3 fragility要求softening。Paper从''universal
  law''退为 ''robust phenomenon with domain moderation''。预期ARR avg 3.0-3.5。 plan_013的7-model
  replication（含Gemini/LLaMA）补偿SOPBench弱复制， 形成''binary effect universally replicates,
  severity ordering is domain-moderated''的平衡叙事。

  '

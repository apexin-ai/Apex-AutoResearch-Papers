narrative_guidance: SOPBench强复制（Δ≥25pp，rule-based verifier独立确认），审稿人认可model×type交互为genuinely
  novel contribution。论文定位为4-domain（retail/airline/healthcare/banking）跨基准因果研究，C1因果claim以matched-pair+perturbation+cross-benchmark三重证据链支撑，为agent
  safety文献最强因果推断。C4 model×type interaction（52pp auth_scope range）连接B&K到alignment，incompleteness
  universally dangerous作为safety training blind spot。投稿时main text加cross-benchmark summary
  paragraph，appendix放完整SOPBench结果。expected_review_avg 3.75，claims_surviving_without_revision
  5/5。

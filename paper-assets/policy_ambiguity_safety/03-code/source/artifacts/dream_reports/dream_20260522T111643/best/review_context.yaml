- name: perturbation_control
  plan_id: plan_010
  description: 非歧义扰动对照：30 clause pairs（15 synonym substitution + 15 clause reordering）×
    2 conditions × 2+ models = 120-300 episodes。区分ambiguity-specific harm vs general
    prompt brittleness。
  expected_results:
    total_episodes: 300
    delta_perturb_pp: -0.67
    delta_perturb_ci: '[-8.0, 6.67]'
    ci_upper_bound: 6.67
    ci_width_pp: 14.67
    mcnemar_p: 1.0
    ambiguity_delta_pp: 34.0
    net_delta_pp: 34.67
    ratio: 0.0
    verdict: PASS
    synonym_delta_pp: 1.33
    reorder_delta_pp: -2.67
  result_rationale: 'best档下perturbation control产出PASS verdict——non-ambiguity surface
    changes（synonym substitution, clause reordering）cause zero meaningful effect（Δ=-0.67pp,
    CI含0）。这与ambiguity Δ=+34.0pp形成stark contrast：10:1 signal-to-noise ratio。PASS verdict意味着C1因果claim以最强形式成立——''+34pp是ambiguity-specific
    causation，不是general prompt sensitivity''。CI upper bound 6.67pp远低于WARNING阈值（15pp），net
    effect +34.67pp overwhelming。synonym substitution略positive（+1.33pp）和clause reordering略negative（-2.67pp）的差异在noise范围内（|Δ|<3pp），表明两种perturbation
    types equally benign。verdict=PASS使得paper可写''Perturbation control confirms that
    the observed +34pp effect is specific to ambiguity, not an artifact of surface-level
    policy modifications (synonym substitution: +1.33pp, clause reordering: -2.67pp,
    combined: -0.67pp, CI includes zero). This constitutes the strongest causal evidence
    for ambiguity-specific harm in the agent safety literature。'''

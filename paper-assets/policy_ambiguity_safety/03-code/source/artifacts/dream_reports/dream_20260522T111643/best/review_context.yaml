- name: reliability_test
  plan_id: plan_006
  description: Test-retest reliability：30 clauses（5/type）× 3 replicates × 2 conditions
    × 2 models（gpt-5.4, gpt-4.1）= 360 episodes。计算per-clause violation rates的ICC。
  expected_results:

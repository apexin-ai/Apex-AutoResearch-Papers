  result_rationale: best档下synthetic clauses与DRIP-R natural ambiguities在所有linguistic
    properties上statistically indistinguishable（all KS p>0.05）。这因为clause generation遵循了policy
    document的register和style conventions——使用了real τ²-bench policy templates作为base并仅修改specific
    ambiguity-bearing elements。discriminator accuracy 56%（CI含50%）表明even a trained
    classifier cannot reliably distinguish synthetic from natural。这是RC4（ecological
    validity）的strongest possible response：our synthetic injection preserves the distributional
    properties of natural policy ambiguity。sentence length几乎identical（22.4 vs 21.8
    words）因为minimal-edit injection strategy不改变clause structure。Flesch-Kincaid相近（11.8

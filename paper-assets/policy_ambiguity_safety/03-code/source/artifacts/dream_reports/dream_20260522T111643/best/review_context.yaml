  result_rationale: best档下DeBERTa PoC在binary detection达F1=0.81——足以demonstrate practical
    value但不overclaim。per-type F1的extreme variance（CP 0.94 vs incompleteness 0.34）本身是interesting
    finding：(a) CP最easy to detect因为explicit conflict markers（'but', 'however', 'unless'等surface
    cues）在training data中high-frequency，(b) incompleteness最hard因为absence of information
    has no surface signal——you can't detect what's NOT there from text features alone。这mirrors
    C2 type hierarchy in an unexpected way：most dangerous type（incompleteness）is also
    hardest to automatically detect，creating a dangerous blind spot。scopal（0.75）和coreferential（0.70）intermediate因为structural
    cues（quantifier scope, pronoun chains）are learnable but require syntactic understanding。auth_scope（0.58）moderate因为permission
    language有some surface patterns但boundary vagueness is subtle。macro F1=0.63 reflects
    per-type imbalance。binary FPR=0.044（<5%）意味着very few false alarms——practical for
    deployment as pre-filter。

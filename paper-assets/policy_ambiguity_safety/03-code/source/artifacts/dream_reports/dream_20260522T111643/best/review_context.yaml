  description: 生成300条clause pairs（50/type × 6 types），涵盖coreferential（50 new）、authorization_scope（50
    new）、lexical（+20）、incompleteness（+20）。CP混合labeled+unlabeled格式。全量Chantree-style质量验证+cross-type

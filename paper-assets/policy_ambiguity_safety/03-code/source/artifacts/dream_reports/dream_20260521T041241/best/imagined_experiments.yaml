  hierarchy + model×type interaction 揭示 safety training 的 selective mitigation — incompleteness
  universally dangerous (46-62%)，auth_scope 是 canary type (12%-64% range 52pp)， 3-tier
  结构稳定 (incomp >> mid cluster >> coref)； (3) Ambiguity Blindness (<5.2% awareness)
  + Systematic Nocuity (27% convergent-wrong) 扩展 Berry & Kamsties。 C3 within-judge
  两组均显著 (p=0.021, p=0.038)，layer effect 从 suggestive 升级为 confirmed， Disambiguation
  Channel Framework 获完整实证支撑。所有 claims 原始强度发表，无需降级。EMNLP accept 概率最高。

  '

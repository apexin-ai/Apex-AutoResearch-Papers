    absent from paper. κ=0.91 is LLM-LLM agreement, not validated accuracy. | M2 |
    Endorsed | Yes — report plan_009 results |

    | W3 | **Title overclaims** — universal "All Ambiguity" claim tested on 6 types,
    2 domains, synthetic injection. | Partial | Major | Yes — soften title |

    | W4 | **Prompt sensitivity confound** — no non-ambiguity perturbation control
    to distinguish ambiguity-specific harm from general prompt brittleness. | Endorsed
    | Raised | Partially — C5 type-specific failure modes mitigate |

    | W5 | **C3 pre-registration status unclear** — may be exploratory finding promoted
    to core claim post-diagnostic. p=0.015 may not survive correction. | M3 | Partial
    | Yes — clarify in paper |

    | W6 | **Incompleteness confound** — unambiguous variants add information, not
    just resolve ambiguity. Effect size (32.8pp) may be inflated. | M4 | Minor | Partially
    — quantify info delta |


    ### Minor


    | ID | Issue |

    |----|-------|

    | W7 | No figures in 8-page paper (both reviewers) |

    | W8 | Thin reference list — 8 citations, missing key works in ambiguity detection,
    prompt sensitivity, garden-path, agent safety (both reviewers) |

    | W9 | No Claude models tested (both reviewers) |

    | W10 | Two-domain limitation (retail + airline, both customer-service) — limits
    universality claim |

    | W11 | Classifier PoC lacks baselines (no zero-shot LLM comparison, no existing
    ambiguity detector comparison) |

    | W12 | Conservative refusal (5%) coded in failure taxonomy despite being described
    as "non-violation" — internal inconsistency (R1) |

    | W13 | Ecological validity — single injected clause differs from naturally ambiguous
    document (R2) |


    ---


    ## 6. Questions for Authors (Priority-Ordered)


    1. **Judge calibration (W2):** Was the planned human calibration study (100 episodes)
    conducted? If so, what was the LLM judge''s precision/recall against human labels?
    If not, what is the basis for trusting the κ=0.91 as measuring genuine violation
    detection accuracy?


    2. **C2/C3 reconciliation (W1):** How do you reconcile the C2 null (type doesn''t
    predict severity) with C3 (CP and scopal significantly differ)? Was C3 pre-registered
    as an independent planned contrast, or was it selected post-hoc from the pairwise
    matrix after the diagnostic study?


    3. **TOST margin justification (W1):** Why ±15pp for the equivalence margin? A
    15pp difference in safety violation rates is operationally meaningful. Would C2
    hold with a tighter margin (e.g., ±10pp)?


    4. **Prompt sensitivity (W4):** How do you distinguish ambiguity-specific harm
    from general prompt brittleness? Have you considered a control arm with non-ambiguity
    perturbations of similar surface magnitude?


    5. **Berry & Kamsties operationalization:** You measure agent-vs-intent deviation,
    but Berry & Kamsties define nocuity as inter-reader divergence. Did you test whether
    different models adopt different readings of the same ambiguous clause (true nocuity),
    or only whether each model deviates from ground truth?


    ---


    ## 7. Experimental Coverage Assessment


    | Experiment | Reported? | Adequacy |

    |------------|-----------|----------|

    | Clause generation (plan_001) | Yes (Appendix B) | Adequate |

    | API study (plan_002) | Yes (Tables 1,3,4) | Adequate |

    | Local study (plan_003) | Yes (Tables 1,3,4) | Adequate |

    | Full analysis (plan_004) | Yes (Tables 1–4) | Adequate |

    | Error analysis (plan_005) | Yes (Tables 5–6, §6) | Adequate — but missing failure
    mode × type cross-tabulation table |

    | Reliability (plan_006) | Yes (Appendix C) | Adequate |

    | Realism validation (plan_007) | Yes (Appendix D) | Adequate |

    | Classifier PoC (plan_008) | Yes (Table 7) | Adequate but lacks baselines |

    | **Judge calibration (plan_009)** | **NOT REPORTED** | **Critical gap** |


    ---


    ## 8. Consolidated Scores


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | **Soundness** | **3.5** | Core matched-pair design is solid, C1 is robust (signal-to-noise
    5.3×), C5 provides mechanistic depth. Weakened by: unresolved C2/C3 tension, missing
    human judge calibration, generous TOST margin, unclear C3 pre-registration status,
    prompt sensitivity confound. |

    | **Excitement** | **3.5** | Timely research question bridging CL and agent safety.
    C3 (visibility) and C5 (failure taxonomy) are genuinely interesting. C1 binary
    effect is expected but magnitude is noteworthy. C4 capability gradient adds analytical
    value. Scope limited by 2 domains and synthetic ambiguity. |

    | **Reproducibility** | **3.0** | τ²-bench is public, statistical plan is clear,
    bootstrap CIs reported. Weakened by: clause pairs not released, cross-judge prompt
    not provided, API models non-deterministic and time-varying, vLLM configuration
    underspecified, no code/data release commitment. |

    | **Overall Assessment** | **3.5** | **Borderline Conference.** The paper makes
    a clear empirical contribution on a timely topic with a well-designed causal study
    and a satisfying five-claim architecture. C3 (visibility) and C5 (error taxonomy)
    are the most distinctive contributions. However, the C2/C3 tension, missing judge
    calibration, title overclaim, thin references, and absent figures prevent confident
    Main recommendation. This is a strong Findings paper that could reach Main (4.0)
    with targeted revisions: (1) report judge calibration, (2) reframe C2/C3 relationship,
    (3) soften title, (4) expand references, (5) add figures. |

    | **Confidence** | **4** | Both reviewers conducted thorough independent reviews
    and cross-shared. Key concerns are convergent. Main uncertainty: whether plan_009
    was conducted but omitted vs. never run. |


    ---


    ## 9. Revision Roadmap (Priority Order)


    1. **[Critical]** Report judge calibration results (plan_009) or conduct human
    annotation validation.

    2. **[High]** Explicitly address C2/C3 relationship — reframe C2 as "no large
    type effect" or explain visibility as orthogonal dimension; tighten TOST margin;
    clarify C3 pre-registration status.

    3. **[High]** Soften title to match evidence scope (6 tested types, 2 domains).

    4. **[High]** Expand reference list — add ambiguity detection, prompt sensitivity,
    garden-path, and agent safety benchmark citations.

    5. **[Medium]** Add figures — at minimum: forest plot (C1), heatmap (C4), visibility
    mechanism illustration (C3).

    6. **[Medium]** Discuss prompt sensitivity confound explicitly; consider adding
    a small non-ambiguity perturbation control.

    7. **[Low]** Add classifier baselines (zero-shot LLM detection); quantify incompleteness
    information asymmetry; address Claude model gap.

    '

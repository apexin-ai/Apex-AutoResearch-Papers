        effect仍成立（所有类型均有害，只是程度不同），这本身仍是novel的因果发现；(2)type uniformity的reject本身变成positive
        finding——某些歧义类型比其他类型更危险，这为type-specific triage提供了依据，与原始framing相反但同样有实践价值；(3)model×type交互成为核心贡献——''ambiguity

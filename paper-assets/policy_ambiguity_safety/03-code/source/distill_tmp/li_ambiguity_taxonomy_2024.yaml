positioning:
  core_claim: "First comprehensive taxonomy of 11 ambiguity types for NLP, enabling fine-grained analysis of model performance across distinct disambiguation challenges."
  key_results: "11 ambiguity types identified (lexical, syntactic, scopal, elliptical, collective/distributive, implicative, presuppositional, idiomatic, coreferential, generic/nongeneric, type/token); applied to AmbiEnt benchmark"
  limitations:
    - "Work-in-progress; quantitative distribution analysis incomplete"
    - "Taxonomy prioritizes NLP utility over linguistic completeness"
    - "No model evaluation results presented"
  relation_to_us: "foundation"

narrative:
  story_type: "统一框架型"
  hook: "NLP systems may struggle with language understanding because they cannot handle ambiguities at human levels"
  tension: "Existing ambiguity categorizations (7 types in AmbiEnt) lack coverage; no comprehensive NLP-oriented taxonomy exists"
  key_insight: "Different ambiguity types require fundamentally different resolution approaches → need fine-grained taxonomy for targeted evaluation"
  argument_chain: "NLP struggle with ambiguity → existing categories insufficient → 11-type taxonomy from linguistics → apply to AmbiEnt → enable balanced datasets + targeted evaluation"
  contribution_framing: "Single main contribution: comprehensive 11-type taxonomy bridging linguistics and NLP"
  intro_structure: "3段：motivation(NLP ambiguity challenge) → gap(no comprehensive NLP taxonomy) → contribution(11-type framework)"
  notable_technique: "从linguistic theory到NLP应用的桥接设计；承认taxonomy无法满足所有linguistic theories，务实定位于NLP实用性"


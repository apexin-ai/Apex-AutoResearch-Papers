tier: worst
narrative_guidance: 放弃cross-domain generalization claim。SOPBench未复制或verifier不兼容，一句话acknowledge作为limitation。核心贡献重新定位为：(1)
  方法论模板——首个matched-pair + perturbation control因果设计；(2) model×type interaction——52pp
  auth_scope range + incompleteness universality；(3) 7-model breadth（plan_013 Gemini+LLaMA复制C1）替代cross-benchmark
  breadth。Title改为'Causal Anatomy of Policy Ambiguity Vulnerability in LLM Agents'。仍冲EMNLP但framing更modest。

- name: sopbench_cross_benchmark
  plan_id: plan_017
  description: SOPBench (Healthcare + Bank) 100 pairs × 2 conditions × 5 models =
    1,000 episodes, rule-based verifier
  expected_results:
    total_episodes: 1000
    overall_delta_pp: 8.3
    overall_p: 0.068
    healthcare_delta_pp: 11.2
    healthcare_p: 0.042
    bank_delta_pp: 5.4
    bank_p: 0.31
    incompleteness_rate_amb: 0.28
    auth_scope_rate_amb: 0.19
    type_rank_rho_vs_tau2: 0.14
    type_rank_rho_p: 0.72
    verifier_incompleteness_rate: 0.32
    verifier_false_negative_estimate: 0.25
    cross_benchmark_effect_correlation: 0.18
    c1_replicates: false
    c2_type_ranking_consistent: false
    verdict: FAIL — does not meaningfully replicate
  result_rationale: Worst tier核心假设：SOPBench不复制。原因多重：(1) Rule-based verifier与ambiguity
    injection不兼容——verifier检查specific action sequences against predefined rules，但ambiguity-induced
    violations可能表现为'合理的alternative interpretation'而非rule violation（verifier designed
    for clear-cut错误，非ambiguity-induced edge cases）；(2) SOPBench SOPs本身ambiguity较少（already
    well-specified for rule-based evaluation），injecting ambiguity后verifier无法区分ambiguity-caused
    deviation vs acceptable behavior variation；(3) Healthcare/Bank domains的policy
    structure（highly regulated, explicit procedures）与retail/airline（customer discretion多）根本不同——ambiguity在regulated
    domains导致conservative behavior（合规培训效应），反而降低violation rate；(4) Delta=8.3pp pooled,
    only healthcare marginal (11.2pp, p=0.042), bank non-significant (5.4pp, p=0.31)；(5)
    Type ranking ρ=0.14与τ²-bench无关联——incompleteness在SOPBench仅28%（vs τ²-bench 54%），因为SOPBench的missing
    info scenarios有default safe actions。

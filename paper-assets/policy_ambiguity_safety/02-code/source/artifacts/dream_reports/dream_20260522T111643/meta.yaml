        methodological——首个matched-pair + perturbation control因果设计，是agent safety评估的方法论模板；(2)
        model×type interaction——即使限于customer-service domain，52pp auth_scope range
        + incompleteness universality是safety alignment的actionable insight；(3) 7-model
        breadth（plan_013: Gemini+LLaMA也复制C1）替代cross-benchmark breadth。叙事从''cross-domain
        law''转为''深度因果剖析揭示safety training盲区''——强调因果rigor超越correlation-based prior work（DRIP-R,
        PhantomPolicy）。Title可能需改：去掉任何暗示generality的词，改为''Causal Anatomy of Policy Ambiguity
        Vulnerability in LLM Agents''。仍冲EMNLP——causal method + interaction finding
        + 7 models足够，只是framing更modest。'

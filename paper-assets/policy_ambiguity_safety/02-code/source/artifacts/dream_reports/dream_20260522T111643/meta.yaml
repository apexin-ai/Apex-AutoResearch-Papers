      noise。三次独立replicates产出highly reproducible per-clause violation rates——同一clause在同一model上反复运行得到几乎相同的violation
      probability。per-type ICC pattern（ling 0.982 > spec 0.840）提供了convergent evidence
      for Disambiguation Channel Framework：ling-layer更reproducible因为agents consistently
      resolve（or fail to resolve）linguistic ambiguity in the same way（deterministic
      misparse），而spec-layer less reproducible因为agents在missing info下guess differently
      each run（stochastic guessing）。binary ICC=0.847（good）表明even binary classification（violation/no-violation）跨replicates稳定。这使得main

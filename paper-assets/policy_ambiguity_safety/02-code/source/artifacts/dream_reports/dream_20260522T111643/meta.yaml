      scope_misapplication, arbitrary_rule_selection）形成2×2矩阵映射到2 layers：spec→guess-and-act
      (escalation+assumption), ling→misparse-and-apply (scope_misapplication)。5/6
      types cross-model dominant mode一致（仅coreferential diverge）——failure modes是type-specific而非model-specific，支撑taxonomy的construct

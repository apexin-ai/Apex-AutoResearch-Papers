    plan_id: plan_008
    description: 'Binary ambiguity detector PoC。 DeBERTa-v3-large fine-tuned on clause
      pairs (original plan)。 Supplemented by LLM-based classification (plan_012 completed)。

      '
    expected_results:
      deberta_binary_f1: 0.79

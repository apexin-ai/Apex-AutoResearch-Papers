tier_definitions:
  tiers:
    best:
      tier: best
      meaning: SOPBench强复制 + 审稿人认可model×type交互为核心贡献，论文以4-domain跨基准因果研究定位
      key_assumptions:
      - SOPBench C1二元效应强复制（Δ≥25pp，p<0.001），rule-based verifier与LLM judge结论一致
      - SOPBench类型排序与τ²-bench正相关（ρ≥0.7），incompleteness仍为最高危类型
      - 审稿人接受V=0.137在power=0.993下的解释（effect real but small，3-tier structure captures
        it）
      - C3 fragility被接受为"honest reporting"而非fatal flaw——within-judge分析作为limitation披露即可
      - model×type交互（52pp auth_scope range）被认为是genuinely novel contribution连接B&K到alignment
      - perturbation control（Δ=3.33pp vs 34pp）被视为causal inference gold standard
      number_ranges:
        sopbench_c1_delta_pp:
        - 25
        - 40
        sopbench_type_rank_rho:
        - 0.7
        - 0.95
        sopbench_incompleteness_rate:
        - 0.45
        - 0.65
        cross_benchmark_effect_correlation:
        - 0.75
        - 0.95
        expected_review_avg:
        - 3.5
        - 4.0
        claims_surviving_without_revision:
        - 4
        - 5
      narrative_direction: 原始framing完全成立——'Differential Nocuity'跨4域（retail/airline/healthcare/banking）、7模型、6类型全面验证。C1因果claim最强形式（matched-pair
        + perturbation + cross-benchmark）。C4 model×type interaction为star finding。SOPBench
        rule-based verifier独立确认消除LLM-judge单一依赖。投稿时main text加一段cross-benchmark summary，appendix放完整SOPBench结果。
    median:
      tier: median
      meaning: SOPBench部分复制（C1成立但效应减弱或类型排序不完全对齐），论文仍可发但需调整claims强度
      key_assumptions:
      - SOPBench C1复制但效应较弱（Δ 15-25pp，显著但OR<5），可能因rule-based verifier更严格
      - 类型排序部分对齐（ρ 0.3-0.7）——incompleteness仍高危但auth_scope排序可能因domain不同而变化
      - 一位审稿人对C3 within-judge fragility提出concern，要求softening或additional analysis
      - V=0.137被一位审稿人质疑practical significance，需要additional justification（3-tier TOST）
      - model×type交互核心pattern保持但个别cell在SOPBench不完全复制
      - plan_013的7-model replication（含Gemini/LLaMA）补偿SOPBench弱复制
      number_ranges:
        sopbench_c1_delta_pp:
        - 15
        - 25
        sopbench_type_rank_rho:
        - 0.3
        - 0.7
        sopbench_incompleteness_rate:
        - 0.35
        - 0.55
        cross_benchmark_effect_correlation:
        - 0.4
        - 0.75
        expected_review_avg:
        - 3.0
        - 3.5
        claims_surviving_without_revision:
        - 2
        - 3
      narrative_direction: C1因果claim保持但加domain-dependence caveat（'effect size varies
        by benchmark strictness'）。C2从'universal 3-tier hierarchy'降为'robust hierarchy
        in customer-service domains, partially replicated in healthcare/banking'。C3从suggestive进一步降为'exploratory
        finding requiring future confirmation'，discussion中承认。C4保持但soften为'model×type
        interaction is domain-robust for extreme types (incompleteness, auth_scope)
        but mid-tier ordering is domain-sensitive'。SOPBench放appendix，main text一句话：'partial
        cross-benchmark replication confirms the binary effect while revealing domain-dependent
        type severity ordering.' 核心叙事从'universal law'退为'robust phenomenon with domain
        moderation'。
    worst:
      tier: worst
      meaning: SOPBench不复制或verifier不兼容，需放弃cross-benchmark claim，用deep single-benchmark
        causal rigor + model diversity重新定位
      key_assumptions:
      - SOPBench C1不复制（Δ<15pp或p>0.05）或rule-based verifier与ambiguity injection不兼容（verifier无法区分ambiguity-induced
        violations vs correct behavior）
      - 类型排序与τ²-bench无相关或负相关（ρ<0.3），暗示type hierarchy是benchmark-specific artifact
      - C3 layer effect在审稿中被challenge为model composition artifact（GPT drives the gap）
      - 至少一位审稿人认为synthetic injection + single primary benchmark = insufficient external
        validity
      - 但C1在τ²-bench的5-model +34pp效应、perturbation control、7-model扩展（plan_013）仍intact
      - judge calibration κ=0.807仍强，causal design仍是literature最强

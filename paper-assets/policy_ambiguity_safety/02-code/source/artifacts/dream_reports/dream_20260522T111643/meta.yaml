  to plan. Assess: (1) Does SOPBench replication meaningfully strengthen the paper
  vs current single-benchmark version? (2) What''s the realistic best/median/worst
  score with vs without SOPBench? (3) Are there any risks (e.g., effect doesn''t replicate,
  rule-based verifier incompatibility)? Round 13 claim calibration already complete
  (22× removed, margin conditions added, judge annotations, confound anchors).'
review_mode: full

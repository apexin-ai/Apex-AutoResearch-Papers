  review_report: "---\ndream_id: dream_20260522T111643\ntier: median\noverall_score:\
    \ 3.5 — Borderline Conference / Strong Findings\ntimestamp: 2026-05-22T12:07:33.945843+00:00\n\
    ---\n\n# Dream Review Report: \"Not All Policy Ambiguity Is Equal\"\n\n**dream_id**:\
    \ 20260522T111643  \n**Venue**: EMNLP 2026 (ARR)  \n**Review mode**: full (2 reviewers,\
    \ 4-step roundtable)\n\n---\n\n## Step 1: Independent Reviews\n\n### R1 (Methods\
    \ + Experiments) — Independent Score: 3.5/5\n\n**Strengths:**\n1. Matched-pair\
    \ design with perturbation control is a genuine methodological contribution to\
    \ agent safety evaluation. The within-clause comparison (amb vs. unamb as minimal\
    \ edit) is a strong causal design; the perturbation control arm (Δ=−0.67pp, CI\
    \ containing zero) effectively rules out general prompt brittleness.\n2. Thorough\
    \ measurement validation chain: cross-judge design to avoid self-evaluation bias,\
    \ human calibration (κ_w=0.807 exceeding human-human κ_w=0.762), ICC=0.919 for\
    \ test-retest reliability. This level of measurement transparency is rare in agent\
    \ safety papers.\n3. Confound handling for incompleteness is exemplary: logistic\
    \ regression controlling token delta, coreferential as confound-free lower bound,\
    \ authorization scope counter-evidence, and explicit statement that C1 holds even\
    \ excluding incompleteness.\n4. Statistical methodology is mostly appropriate:\
    \ McNemar's for paired binary, TOST equivalence testing with multi-margin sensitivity,\
    \ bootstrap CIs, Holm-Bonferroni correction. Post-hoc power >0.99 for C1 and C2.\n\
    5. Honest epistemic calibration: C3 moved to appendix as exploratory, C4 interaction\
    \ labeled appropriately, variance decomposition presented despite potentially\
    \ undercutting narrative.\n\n**Weaknesses:**\n1. Cross-judge design confounds\
    \ judge identity with model identity. GPT-5.4 judges three models; GPT-4.1 judges\
    \ two. The 52pp authorization scope range (Claude 12% to GPT-5.4 64%) spans judge\
    \ groups. A judge-bias sensitivity analysis using the 100 dual-judged episodes\
    \ is needed to bound this confound for C4.\n2. Authorization scope has the weakest\
    \ measurement properties (cross-judge κ=0.385 per review context) but receives\
    \ outsized narrative weight. Excluding auth_scope would collapse the C4 interaction\
    \ (estimated p=0.97 without it).\n3. Perturbation control is underpowered: CI\
    \ [−8.0, 6.67] cannot distinguish 0pp from 6.67pp perturbation effect. While the\
    \ residual ambiguity effect (27.3pp worst-case) is still large, a tighter bound\
    \ would strengthen the causal claim.\n4. Error analysis inter-coder κ=0.517 (moderate).\
    \ Fine-grained failure mode proportions carry substantial uncertainty. The paper\
    \ handles this by using qualitative descriptors (majority/plurality), but CIs\
    \ for proportions are missing.\n5. Token delta as confound proxy is coarse — semantic\
    \ information density may differ from raw token count.\n6. Coreferential excluded\
    \ from multiple secondary analyses without consolidated justification.\n\n**R1\
    \ Scores:** Soundness 4/5, Excitement 3.5/5, Reproducibility 4/5, Overall 3.5/5\n\
    \n---\n\n### R2 (Novelty + Related Work) — Independent Score: 3.5/5\n\n**Strengths:**\n\
    1. Genuine conceptual novelty in the research question: first causal, type-granular\
    \ mapping from ambiguity to safety violations in agentic settings. No prior work\
    \ isolates ambiguity type as a causal variable with matched-pair controls.\n2.\
    \ Well-grounded theoretical framing via Berry & Kamsties' nocuous/innocuous distinction.\
    \ The argument that LLM agents lack disambiguation channels (colleague consultation,\
    \ shared context) that make most ambiguity innocuous in human RE is compelling.\n\
    3. \"Ambiguity Blindness\" (or \"Disambiguation Neglect\") finding is impactful:\
    \ <5% meta-cognitive awareness, >88% surface adoption, <1% user escalation. This\
    \ extends ambiguity-collapse findings to consequential agentic settings.\n4. Systematic\
    \ nocuity (27% of ambiguous episodes → all models converge on same wrong interpretation)\
    \ is a novel concept with practical implications for inter-model agreement-based\
    \ evaluation.\n5. Exceptional statistical discipline for the subfield.\n6. Disambiguation\
    \ channel framework provides useful organizing principle beyond mere enumeration.\n\
    \n**Weaknesses:**\n1. Taxonomy is synthesized from Li et al. (2024) and Massey\
    \ et al. (2014), not genuinely novel. The main conceptual addition is the disambiguation\
    \ channel principle.\n2. \"Differential nocuity\" term may overstate contribution\
    \ — Willis et al. (2008) already studied differential nocuity detection. The empirical\
    \ demonstration in LLM agent context is the contribution, not the concept.\n3.\
    \ Missing important related work: ClarEval (Mar 2026), Ambig-SWE (ICLR 2026),\
    \ LHAW (Feb 2026), ATBench (Apr 2026), OpenAgentSafety (ICLR 2026). These are\
    \ directly relevant to disambiguation channels and agent clarification-seeking.\n\
    4. \"Ambiguity\" label is stretched for incompleteness (absent information) and\
    \ conditional precedence (normative conflict). The paper should engage with Dalpiaz\
    \ et al. (2018) on the distinction between ambiguity, incompleteness, and inconsistency.\n\
    5. Variance decomposition shows type explains only 0.4% of variance vs. clause\
    \ identity at 22.4% — this fundamentally undermines the \"not all ambiguity is\
    \ equal\" framing. Clause-level wording dominates; the type taxonomy may be less\
    \ useful than individual clause auditing.\n6. DRIP-R comparison should be deeper\
    \ (do their type rankings correlate? does their agreement rate map to systematic\
    \ nocuity?).\n7. The 7-model claim mixes full-design evaluation (5 models) with\
    \ reduced-scope replication (2 models) without sufficient clarity.\n\n**R2 Scores:**\
    \ Soundness 4/5, Excitement 3.5/5, Reproducibility 4/5, Overall 3.5/5\n\n---\n\
    \n## Step 2: Cross-Sharing — Key Observations\n\n### Correction: SOPBench IS in\
    \ the Paper\nBoth reviewers flagged SOPBench as missing. This is incorrect: the\
    \ paper includes SOPBench results in §5.1 (one paragraph + cross-reference) and\
    \ Appendix A (full section with Table 8: τ²-bench vs. SOPBench comparison, per-model\
    \ SOPBench results, type ranking comparison). The SOPBench replication covers\
    \ 982 valid episodes across healthcare and banking domains with all 5 models.\
    \ This partially addresses the single-domain concern, though the weaker effect\
    \ (Δ=18.3pp vs. 34.0pp) and non-significant type ranking correlation (ρ=0.40,\
    \ p=0.60) raise questions about cross-domain generalizability of fine-grained\
    \ findings.\n\n### Points of Agreement\n1. Both converge at 3.5 overall — strong\
    \ Findings, borderline conference\n2. Both praise the matched-pair + perturbation\
    \ control design as the core methodological contribution\n3. Both note honest\
    \ epistemic calibration as a strength\n4. Both flag C4 (model×type interaction)\
    \ as the most interesting but empirically weakest claim\n5. Both identify the\
    \ 7-model framing as potentially misleading\n6. Both score Soundness 4/5 and Reproducibility\
    \ 4/5\n\n### Points of Divergence\n- R2's variance decomposition challenge (type\
    \ = 0.4% of variance) is potentially devastating to the paper's central thesis.\
    \ R1 noted this was honestly presented but didn't flag it as undermining the core\
    \ framing. **Assessment**: R2's point is valid — the paper's title and framing\
    \ emphasize type-level differences, but clause-level wording explains 56× more\
    \ variance than type. However, the type hierarchy is still statistically significant\
    \ (χ²=28.02, p=3.6e-5) and the 22pp incompleteness-coreferential gap is practically\
    \ meaningful even if type is a coarse predictor. The tension is real but not fatal\
    \ — it suggests the paper should frame types as \"risk categories for triage\"\
    \ rather than \"deterministic predictors.\"\n- R1's cross-judge confound concern\
    \ is more technically detailed than R2's treatment of C4. This is a genuine methodological\
    \ limitation that could explain some of the 52pp range.\n- R2 identifies more\
    \ missing related work (5+ papers), reflecting the novelty-focused lens. These\
    \ are legitimate gaps.\n\n---\n\n## Step 3: Convergence\n\n### Consensus Assessment\n\
    \n**C1 (Binary Effect)**: Both reviewers agree this is solid and the paper's strongest\
    \ contribution. The +34.0pp effect with perturbation control, replicated across\
    \ 5 models and partially on SOPBench (Δ=18.3pp), is convincing. The perturbation\
    \ control CI width (up to 6.67pp) is a minor concern but doesn't threaten the\
    \ main finding. **Verdict: Strong.**\n\n**C2 (Type Hierarchy)**: The three-tier\
    \ structure is statistically significant and TOST-validated, but R2's variance\
    \ decomposition challenge (type = 0.4% of variance) is a serious concern for the\
    \ paper's framing. The hierarchy is real at the extremes (incompleteness >> coreferential)\
    \ but the mid-tier clustering and small V=0.137 limit practical utility. SOPBench\
    \ partial replication (incompleteness still #1, but ρ=0.40 n.s.) adds domain-moderation\
    \ caveats. **Verdict: Moderate — findings-level contribution.**\n\n**C4 (Model×Type\
    \ Interaction)**: The most interesting finding but methodologically the weakest.\
    \ Authorization scope drives the entire interaction; cross-judge confounding and\
    \ low per-type judge agreement (κ=0.385) create interpretability concerns. Claude's\
    \ 12% vs GPT-5.4's 64% is striking but may partly reflect judge bias. **Verdict:\
    \ Suggestive — needs judge-bias sensitivity analysis.**\n\n**Error Analysis (Ambiguity\
    \ Blindness)**: <5% awareness is a robust binary metric unaffected by the moderate\
    \ inter-coder κ. The systematic permissiveness bias (69.2% escalation, 0% restriction\
    \ for auth_scope) is striking. Inter-coder κ=0.517 limits fine-grained failure\
    \ mode claims. **Verdict: Moderate — the blindness finding is solid; failure mode\
    \ taxonomy is exploratory.**\n\n**SOPBench Replication**: Present in the paper\
    \ (§5.1 + Appendix A), confirming binary effect cross-domain (Δ=18.3pp, p<0.0001).\
    \ Weaker effect size is explained by three factors (rule-based verifier, domain\
    \ moderation, higher baselines). Type ranking partial alignment (ρ=0.40, n.s.)\
    \ adds important domain-moderation caveats. **Verdict: Useful but raises as many\
    \ questions as it answers.**\n\n### Formatting Issue\nAll bibliography citations\
    \ render as \"(?)\". This is a LaTeX compilation error (.bbl not generated or\
    \ bibliographystyle mismatch). If submitted in this state, reviewers would be\
    \ severely hindered and the paper could face desk-reject risk. **Must fix before\
    \ submission.**\n\n### Agreed Weaknesses (Priority Order)\n1. **Bibliography not\
    \ rendering** — critical formatting issue\n2. **Cross-judge confound on C4** —\
    \ limits interpretability of the headline auth_scope finding\n3. **Type explains\
    \ 0.4% of variance** — tension with paper's central \"not all ambiguity is equal\"\
    \ framing\n4. **Missing related work** — ClarEval, Ambig-SWE, LHAW, OpenAgentSafety\
    \ at minimum\n5. **\"Ambiguity\" label stretch** — incompleteness and cond_prec\
    \ are not ambiguity in the linguistic sense\n6. **Perturbation control CI width**\
    \ — minor but should be discussed\n7. **Error analysis inter-coder reliability**\
    \ — moderate κ limits failure mode claims\n\n### Agreed Strengths (Priority Order)\n\
    1. Matched-pair causal design with perturbation control — methodological contribution\n\
    2. C1 binary effect is massive and replicates across all models and benchmarks\n\
    3. Honest epistemic calibration — C3 to appendix, variance decomposition disclosed\n\
    4. Thorough measurement validation (ICC, judge calibration, human annotation)\n\
    5. Ambiguity Blindness finding (<5% awareness) is robust and practically important\n\
    6. SOPBench cross-benchmark replication adds domain breadth\n7. Five architecturally\
    \ diverse models across three providers\n\n---\n\n## Step 4: Final Synthesis\n\
    \n### Meta-Review\n\nThis paper makes a genuine contribution to agent safety evaluation\
    \ by introducing a matched-pair causal design that cleanly isolates the effect\
    \ of policy ambiguity on safety violations. The core finding — that ambiguous\
    \ policy clauses increase violation rates by +34.0pp across five models, while\
    \ non-ambiguity perturbations produce near-zero effect — is convincing and replicates\
    \ on a second benchmark (SOPBench, Δ=18.3pp). The Ambiguity Blindness finding\
    \ (<5% meta-cognitive awareness) has clear practical implications.\n\nThe paper's\
    \ main limitation is a tension between its framing and its evidence. The title\
    \ promises that \"not all policy ambiguity is equal,\" but type explains only\
    \ 0.4% of violation variance — clause-level wording explains 56× more. The type\
    \ hierarchy is statistically significant but driven by the extremes (incompleteness\
    \ vs. coreferential), with a small effect size (V=0.137). The model×type interaction\
    \ (C4) is the most interesting finding but rests on authorization scope, which\
    \ has the weakest measurement properties and is confounded with judge identity.\n\
    \nThe paper exhibits exceptional statistical discipline and honest epistemic calibration\
    \ — unusual strengths for this subfield. C3 is correctly moved to an exploratory\
    \ appendix, variance decomposition is reported despite undercutting the narrative,\
    \ and the error analysis honestly discloses moderate inter-coder agreement.\n\n\
    Several important concurrent works are missing from the related work section (ClarEval,\
    \ Ambig-SWE, LHAW, OpenAgentSafety). The \"ambiguity\" framing for incompleteness\
    \ and conditional precedence is pragmatically justified but conceptually stretched.\n\
    \nThe bibliography rendering failure (all citations as \"?\") is a critical formatting\
    \ issue that must be resolved.\n\n### Final Scores\n\n| Dimension | R1 | R2 |\
    \ Converged |\n|-----------|----|----|-----------|\n| Soundness | 4/5 | 4/5 |\
    \ **4/5** |\n| Excitement | 3.5/5 | 3.5/5 | **3.5/5** |\n| Reproducibility | 4/5\
    \ | 4/5 | **4/5** |\n| Overall | 3.5/5 | 3.5/5 | **3.5/5** |\n| Confidence | 4/5\
    \ | 4/5 | **4/5** |\n\n### Overall Assessment: 3.5 — Borderline Conference / Strong\
    \ Findings\n\n**Calibration**: At 3.5 on the ARR scale, this paper falls between\
    \ Findings-accept (3.0) and Conference-accept (4.0). The methodological contribution\
    \ (matched-pair + perturbation control) and C1 binary effect are conference-quality.\
    \ However, the type-level framing is weakened by low explained variance, the C4\
    \ interaction has measurement concerns, and the missing related work creates positioning\
    \ gaps. With revisions (judge-bias sensitivity for C4, related work additions,\
    \ variance decomposition reframing, bibliography fix), this could reach 4.0.\n\
    \n### Actionable Revision Priorities\n\n1. **Fix bibliography rendering** — all\
    \ citations show as \"(?)\", critical for review\n2. **Add judge-bias sensitivity\
    \ analysis for C4** — use 100 dual-judged episodes to estimate per-type judge\
    \ correction; bound how much of the 52pp auth_scope range could be judge artifact\n\
    3. **Reframe type contribution given variance decomposition** — acknowledge that\
    \ clause-level wording dominates; position types as \"risk categories for prioritized\
    \ auditing\" rather than deterministic predictors\n4. **Add missing related work**\
    \ — ClarEval, Ambig-SWE, LHAW, OpenAgentSafety; engage with Dalpiaz et al. on\
    \ ambiguity vs. incompleteness distinction\n5. **Discuss TOST margin justification**\
    \ — ground the ±15pp margin in deployment evidence or domain expert consultation\n\
    6. **Consolidate coreferential exclusions** — explain in one place why it's excluded\
    \ from multiple secondary analyses\n7. **Tighten perturbation control** — either\
    \ expand to more clause pairs or explicitly discuss CI upper bound (6.67pp) tolerability\n\
    \n\n---\n\n## 引用验证结果\n\n**统计**: 43 篇文献 / 62 处引用 / 在线验证 43/43 篇\n\n### 问题 (11)\n\

    result_rationale: 'Median档下classifier PoC有两个版本的结果： (1) DeBERTa fine-tuned: binary
      F1=0.79（adequate for PoC）， 6-type macro F1=0.55（weak）。Type-level极不均匀： CP F1=0.91（structural
      signal强），incompleteness F1=0.31 （absence无positive signal）。与Chantree 2006一致——
      structural ambiguity比semantic ambiguity更可检测。 (2) LLM-based (plan_012 completed):
      binary F1=0.806, 6-type macro F1=0.632。LLM优于DeBERTa因为可以leverage semantic understanding，但incompleteness仍最差（F1=0.34）。
      在median档下classifier是appendix material，不作为独立contribution。 Binary detection viable（F1~0.80），type
      classification需要 更大训练数据或更sophisticated approach。一位reviewer可能suggest 这是separate
      future work——rebuttal同意并scope down to appendix。 DeBERTa vs LLM comparison本身有minor

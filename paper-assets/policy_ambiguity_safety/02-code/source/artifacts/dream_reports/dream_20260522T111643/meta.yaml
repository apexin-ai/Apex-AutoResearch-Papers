      failure是'active guessing in absence of information'而ling-layer failure是'unconscious
      misparse of grammatical structure'——两种根本不同的cognitive（computational）机制。这映射到Disambiguation
      Channel Framework：ling-layer有partial external channels（tool responses可disambiguate
      referent, context可clarify word sense）但spec-layer没有（missing policy info无法从external
      source补充）。Ambiguity Blindness的model-level variation（gpt-4.1 10.7% vs DeepSeek
      2.4%）暗示mid-tier models may paradoxically be more 'cautious' than frontier models——higher
      awareness但still act（only 1.6% escalation），构成Discussion中interesting nuance。

    \ similarity 0.32 below threshold 0.82\n- ❌ `hu_ambiguity_2025` — 在线验证未找到匹配（疑似虚假引用）:\
    \ best match similarity 0.39 below threshold 0.82\n- ⚠️ `lakens_2017` — 元数据不匹配:\

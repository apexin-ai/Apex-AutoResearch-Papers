    - **plan_017 (SOPBench)**: ✅ Covered in Appendix C, Tables 15-16

    - **kappa re-annotation**: ✅ Covered in Appendix B, Tables 12-14


    **Coverage**: 13/13 experiments represented. The paper covers all planned experiments.
    The reframing (C5 demoted to exploratory appendix, systematic nocuity as Discussion
    observation, title pivoted to measurement framing) is consistent with the narrative
    guidance for this tier.


    ### Rebuttal Opportunities


    The strongest rebuttal arguments available to the authors:

    1. **Perturbation control trump card**: "Our causal design provides the strongest
    evidence in the literature that ambiguity — not surface variation — drives safety
    violations. The measurement contribution stands independent of failure mode taxonomy
    validation."

    2. **Length confound addressable**: A length-matched subset analysis could resolve

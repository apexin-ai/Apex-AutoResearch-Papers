      failure mode 分散（no dominant mode）， human 和 LLM 都 "agree to disagree"。 Collapsed
      scheme（4-cat, 合并 unauthorized_escalation + assumption_based_action → "boundary_exceeding"）
      提升 κ 至 0.44；3-cat 进一步合并至 0.51。这支持了 "fine-grained coding unreliable, coarse-grained
      valid" 的叙事。 Ambiguity Blindness 在 human annotation 中确认（awareness rate ≈ 5%），这是最
      robust 的 C5 发现。


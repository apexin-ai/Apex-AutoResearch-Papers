      的编码分歧——一部分标注者将其编码为 unauthorized_escalation（"agent 知道边界但选择跨越"），另一部分编码为 assumption_based_action
      （"agent 不知道边界在哪里所以猜测"）。这个分歧反映了 agent 意图归因的固有困难——从 trace 中 无法确定 agent 是 "知道但
      escalate" 还是 "不知道而 assume"。LLM coder 倾向前者，人类 coder 倾向后者。 (2) incompleteness
      类型中，人类标注者将 "填充缺失信息" 更多编码为 arbitrary_rule_selection （"agent 凭空编造规则"）而非 assumption_based_action（"agent
      基于上下文假设"），因为人类 更容易看出 agent 的 "assumption" 实际上缺乏 contextual basis。 (3) scopal,
      lexical, CP 的 dominant mode 一致性高（κ=0.48-0.58），因为这些类型的 failure mechanism 更 surface-visible——scope_misapplication

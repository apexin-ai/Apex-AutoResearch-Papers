    | Soundness | 3 | 4 | 3 |

    | Excitement | 3 | 3 | 3 |

    | Reproducibility | 4 | 4 | 4 |

    | Overall Assessment | 3.0 | 3.5 | **3.0** |

    | Confidence | 4 | 4 | 4 |


    ### Verdict: **3.0 — Findings Accept**


    ### Justification


    **What the paper does well:**

    The matched-pair perturbation design with causal controls is a genuine methodological
    contribution to LLM safety evaluation. The paper measures the ambiguity→violation
    effect with impressive precision (+34pp, OR=15.1, perturbation ratio=0.02), demonstrates
    stable measurement (ICC=0.919), validates the judge pipeline against human ground
    truth (κw=0.807), and is unusually transparent about its limitations (demoting
    C3, qualifying failure modes, reporting SOPBench attenuation honestly). The benchmark
    release of 300 clause pairs with matched-pair protocol has standalone value.


    **Why not Main conference (4.0):**

    1. **Confirmatory core finding.** C1 confirms the expected (ambiguity is bad for
    agents) with good methodology. Precise measurement of an expected effect is valuable
    but has a lower novelty ceiling than a surprising finding.

    2. **Weak type-level findings.** C2 (V=0.137), C3 (inconclusive), and C4 (driven
    by one type with lowest agreement) collectively fail to deliver on the "type-granular"
    promise. The type hierarchy does not replicate on SOPBench.

    3. **Limited generalizability.** SOPBench shows 58% effect attenuation, 2/5 models
    non-significant, no type-rank correspondence. The findings may be τ²-bench-specific.

    4. **Unresolved confounds.** Token-length asymmetry (significant in logistic regression)
    and partial realism failure (2/4 KS tests) are not adequately addressed. No length-matched
    subset analysis.

    5. **No validated mechanism.** κ=0.22 on failure modes means we know ambiguity
    causes violations but not why models fail differently. The systematic nocuity
    observation (27%) is interesting but undeveloped.

    6. **Thin related work.** ~13 references for an EMNLP submission is notably sparse.
    Missing constitutional AI, formal verification, multi-agent deliberation literatures.


    **Why Findings (3.0) and not lower:**

    1. The perturbation control methodology is a genuine contribution — no prior agent
    safety study has comparable causal identification.

    2. The measurement infrastructure (judge calibration, test-retest, cross-family
    judging) is above community standards.

    3. The benchmark release is useful for future work.

    4. The self-qualification is exemplary — the paper is more honest about its weaknesses
    than most submissions.

    5. The model×type interaction (C4), while driven by one type, is a novel empirical
    finding that has practical implications for model selection.


    ### Key Weaknesses Requiring Attention (ranked)


    1. **Token-length confound** — Run length-matched subset analysis. Show C1 holds
    for clause pairs with <5 token difference. Test nonlinear length terms in logistic
    regression.

    2. **SOPBench generalizability** — Either strengthen the cross-benchmark story
    (more domains, more clause pairs per type) or explicitly scope claims to τ²-bench.

    3. **Type hierarchy non-replication** — Acknowledge that C2''s type ranking is
    benchmark-specific and may not generalize.

    4. **Thin related work** — Add constitutional AI, formal verification, multi-agent
    deliberation, broader prompt sensitivity literature. ~13 references is below EMNLP
    expectations.

    5. **Systematic nocuity underdeveloped** — This is the most novel observation.
    Analyze by type, test clause-level predictors, connect to disambiguation channel
    framework.

    6. **C4 auth_scope dependence** — Report C4 with and without auth_scope. The 52pp
    range in the abstract overstates a single-type finding.


    ### Experiment Coverage Assessment


    Comparing against the review context (imagined experiment list):

    - **plan_001 (clause generation)**: ✅ Covered in §4.1, Table 1

    - **plan_001b (mini-pilot)**: ✅ Covered in §4.2


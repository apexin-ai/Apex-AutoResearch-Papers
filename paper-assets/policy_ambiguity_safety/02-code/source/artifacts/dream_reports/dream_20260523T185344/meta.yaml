project: policy_ambiguity_safety
venue: emnlp-2026
focus: 'Evaluate the paper''s competitiveness at EMNLP 2026 ARR assuming κ re-annotation
  succeeds (κ≥0.35). Key question: does upgrading contribution (3) from ''initial
  evidence'' to validated move the paper from 3.75 to 4.0? What remaining gaps would
  reviewers still flag?'
review_mode: full
review_visible: true
writing_visible: true
what_if:
- name: kappa_reannotation_success
  claim: C5 type-mechanism dissociation
  description: 'Human re-annotation with improved codebook (collapsed spurious-compliance/structural-misparse
    boundary) yields κ=0.42. Paper updates: contribution (3) upgrades from ''initial
    evidence'' to ''supported by convergent LLM-coded and human evidence''; abstract/intro/analysis
    remove ''initial'' qualifier; limitations κ=0.15 sentence replaced with κ=0.42;
    Discussion adds human-validated claim.'
  estimated_gpu_hours: 0.0
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: κ re-annotation succeeds strongly, SOPBench cleanly replicates C1+C2,
        all three contributions fully validated — paper presents as complete empirical
        study with novel theoretical framework
      key_assumptions:
      - κ_reannotation ≥ 0.45 (moderate-to-good), dominant failure modes match LLM-coded
        results in ≥5/6 types
      - SOPBench C1 replicates (Δ≥20pp, p<0.001) across healthcare+bank domains
      - SOPBench type ranking positively correlated with main study (ρ≥0.60)
      - C3 layer effect fragility not flagged as major weakness (reviewers accept
        'suggestive' framing with within-judge disclosure)
      - Model×type interaction (C4) recognized as genuinely novel contribution connecting
        B&K to safety alignment
      number_ranges:
        kappa_reannotation:
        - 0.45
        - 0.65
        sopbench_c1_delta_pp:
        - 20
        - 35
        sopbench_type_rank_rho:
        - 0.6
        - 0.95
        c5_human_llm_dominant_mode_agreement:
        - 5
        - 6
        expected_arr_score:
        - 4.0
        - 4.5
        expected_reviewer_confidence:
        - 3.5
        - 4.0
      narrative_direction: 'Original framing intact. Three contributions all validated:
        (1) causal quantification with perturbation control, (2) Differential Nocuity
        + model×type interaction, (3) human-validated failure mode taxonomy + Ambiguity
        Blindness. Abstract uses ''validated'' not ''initial evidence'' for C5. SOPBench
        extends generalizability to 4 domains in appendix. Strongest causal evidence
        + broadest model coverage + validated qualitative analysis = clear accept
        at EMNLP. ''Differential Nocuity'' and ''Ambiguity Blindness'' land as citable
        concepts.'
    median:
      tier: median
      meaning: κ re-annotation succeeds marginally (meets threshold but doesn't strongly
        validate LLM coding), SOPBench partially replicates — paper's quantitative
        core is strong but qualitative contribution needs softening
      key_assumptions:
      - 0.35 ≤ κ_reannotation < 0.45 (fair), dominant failure modes match in 3-4/6
        types with boundary-type disagreements (auth_scope/incompleteness)
      - SOPBench C1 replicates (Δ≥15pp) but with smaller effect size or 1 model anomaly
      - SOPBench type ranking weakly correlated (0.30 ≤ ρ < 0.60) or only 2-3 types
        testable
      - At least one reviewer flags C3 within-judge fragility as undermining the layer
        claim
      - C4 model×type interaction accepted as interesting but reviewer questions whether
        5 models suffice for 'differential safety training' claims
      number_ranges:
        kappa_reannotation:
        - 0.35
        - 0.44
        sopbench_c1_delta_pp:
        - 15
        - 25
        sopbench_type_rank_rho:
        - 0.3
        - 0.59
        c5_human_llm_dominant_mode_agreement:
        - 3
        - 4
        expected_arr_score:
        - 3.5
        - 3.99
        expected_reviewer_confidence:
        - 3.0
        - 3.5
      narrative_direction: 'C1+C4 carry the paper; C5 downgraded from ''validated
        taxonomy'' to ''convergent LLM-coded and human evidence with moderate agreement.''
        Abstract replaces ''type-diagnostic failure signatures'' with ''type-associated
        failure patterns.'' Contribution (3) retains ''supported by'' but adds ''preliminary
        human validation (κ=0.3X)'' qualifier. C3 layer effect moved from standalone
        finding to subordinate observation under C4 (''the model×type interaction
        subsumes and explains the aggregate layer gap''). SOPBench mentioned as ''partial
        cross-domain evidence'' rather than ''replication.'' Rebuttal strategy: emphasize
        that κ=0.3X exceeds automated-only (plan_010 κ=0.517), and the 3-4 type agreement
        covers the theoretically critical types (incompleteness, auth_scope). Still
        competitive for EMNLP poster — C1 causal design + C4 interaction is sufficient
        novel contribution even with weakened C5.'
    worst:
      tier: worst
      meaning: κ re-annotation fails or exposes systematic LLM coding errors, SOPBench
        shows inconsistent results — qualitative contribution collapses, paper must
        be reframed around quantitative core alone
      key_assumptions:
      - κ_reannotation < 0.35 (poor) OR human coders disagree with LLM-assigned dominant
        failure modes in ≥3/6 types, invalidating C5 fine-grained claims
      - SOPBench C1 effect is weak (Δ<15pp) or non-significant for ≥2 models, undermining
        cross-domain generalizability
      - Reviewers flag both C3 fragility AND C5 weak validation simultaneously, questioning
        depth of analysis
      - At least one reviewer sees the paper as 'well-executed but incremental — binary
        effect (C1) is expected, type hierarchy (C2) has small V=0.137'
      - Model×type interaction (C4) survives but cannot alone carry a top-venue paper
        without supporting qualitative story
      number_ranges:
        kappa_reannotation:
        - 0.1
        - 0.34
        sopbench_c1_delta_pp:
        - 5
        - 18
        sopbench_type_rank_rho:
        - -0.2
        - 0.4
        c5_human_llm_dominant_mode_agreement:
        - 1
        - 3
        expected_arr_score:
        - 3.0
        - 3.49
        expected_reviewer_confidence:
        - 2.5
        - 3.5
      narrative_direction: 'Reframe required — same venue, different angle. C5 failure
        mode taxonomy demoted to appendix (''exploratory automated analysis''). ''Ambiguity
        Blindness'' becomes a one-paragraph observation, not a named contribution.
        Paper restructures around two contributions only: (1) causal quantification
        (C1 with perturbation control — this remains the strongest causal evidence
        in the literature regardless of C5), (2) model×type interaction (C4 — 52pp
        auth_scope range is striking and novel even without failure mode explanation).
        New angle: reframe as a **measurement and benchmarking** paper rather than
        an **analysis** paper. Title pivots toward ''Measuring Differential Vulnerability
        to Policy Ambiguity Across LLM Agent Families.'' Lean into methodological
        contribution: matched-pair causal design + perturbation control as a reusable
        evaluation protocol. Add explicit ''Benchmark and Protocol Release'' as contribution
        (3) replacing the failed qualitative analysis. Discussion section shifts from
        ''why models fail differently'' (which needs C5) to ''implications for model
        selection and deployment risk assessment'' (which only needs C4 numbers).
        If SOPBench also weak, drop cross-domain claims entirely and frame τ²-bench
        scope as acknowledged limitation with future work. The 2,997-episode dataset
        + evaluation protocol + C1+C4 quantitative findings can still constitute a
        solid EMNLP contribution if positioned as empirical infrastructure rather
        than theoretical framework.'

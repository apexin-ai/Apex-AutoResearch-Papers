narrative_guidance: '论文叙事收缩为"因果量化(C1) + informative null(C2) + 初步机制探索(C3/C5)"三支柱。
  C1以+25-38pp的massive effect size作为primary contribution，跨模型跨类型稳健复现。 C2以V<0.20的pre-committed
  null巩固binary sufficiency论点，但需讨论V从0.08升至0.15附近的implications。 C3降级为suggestive trend，在Discussion中以"future
  investigation"定位，但方向一致性本身有narrative价值。 C4在Discussion简要报告作为capability-dependent hypothesis，不作为独立贡献。
  C5提供qualitative texture但failure mode重叠度高，作为§6的supplementary analysis而非standalone
  contribution。 应对RC6的核心策略：effect size的massive程度(+25-38pp远超noise band)+ null finding的实践意义
  + reliability test的方法论贡献。

  '
imagined_experiments:
- name: full_study_clause_generation
  plan_id: plan_001
  description: '生成140条新clause（coreferential 50, authorization_scope 50, lexical +20,
    incompleteness +20）， 总计300条clause（50/type × 6 types），混合CP格式（labeled + unlabeled），通过质量验证。

    '
  expected_results:
    total_clauses: 300
    clauses_per_type: 50
    quality_pass_rate: 0.92
    clauses_requiring_revision: 24
    cp_format_mix_labeled_pct: 0.55
    cp_format_mix_unlabeled_pct: 0.45
    cross_type_sentence_length_cv: 0.18
    flesch_kincaid_range:
    - 8.2
    - 12.6
  result_rationale: '生成过程中约8%的clause因matched-pair不对称（unambiguous版本泄露ambiguity cue或信息量差异过大）需返工，
    主要集中在authorization_scope（新类型，模板不够成熟）和incompleteness（信息对称性约束最难满足）。 CP格式混合比例略偏labeled（55/45）因为unlabeled
    naturalistic rewrites更难保证冲突可检测性。 跨类型句长变异系数0.18属于可接受范围，不会引入长度confound。

    '
  tables:
  - name: 'Table 1: Clause Distribution by Type and Domain'
    description: 6 types × 2 domains (retail/airline) × ambiguous/unambiguous counts,
      with CP format breakdown
  figures_description:
  - 'Figure: Sentence length and readability distributions across 6 ambiguity types
    (box plots), showing comparable distributional properties'
  analysis: 'clause质量验证通过率92%表明生成pipeline稳健但非完美。authorization_scope作为新增类型， 需额外一轮revision确保权限边界的ambiguity确实导致可观测的行为差异而非trivial
    confusion。 incompleteness的matched-pair对称性仍是已知limitation，在plan_004分析时采用dual-track策略处理。

    '
- name: full_study_api
  plan_id: plan_002
  description: '300 clauses × 2 conditions × 2 API models (gpt-5.4, gpt-4.1) = 1,200
    episodes， τ²-bench执行 + cross-judge evaluation。

    '
  expected_results:
    total_episodes: 1200
    api_cost_usd: 340
    execution_time_hours: 18
    episode_completion_rate: 0.97
    cross_judge_agreement_kappa: 0.78
    gpt54_overall_violation_rate_ambiguous: 0.46
    gpt54_overall_violation_rate_unambiguous: 0.11
    gpt41_overall_violation_rate_ambiguous: 0.42
    gpt41_overall_violation_rate_unambiguous: 0.13
    gpt54_binary_effect_pp: 35
    gpt41_binary_effect_pp: 29
    gpt54_type_rates:
      scopal: 0.52
      lexical: 0.44
      incompleteness: 0.42
      conditional_precedence: 0.38
      coreferential: 0.48
      authorization_scope: 0.53
    gpt41_type_rates:
      scopal: 0.44
      lexical: 0.41
      incompleteness: 0.4
      conditional_precedence: 0.36
      coreferential: 0.43
      authorization_scope: 0.46
  result_rationale: 'API模型复现mvp_001的binary effect pattern。gpt-5.4效应量略高于gpt-4.1（35pp
    vs 29pp）， 与mvp_001观察到的capability-dependent趋势一致：更强的模型在unambiguous条件下更合规（violation↓），
    但在ambiguous条件下其advanced instruction-following能力反而导致更积极地执行歧义解读（violation↑）， 拉大ambiguous-unambiguous
    gap。authorization_scope和scopal的violation rate偏高（~52-53%）， 因为前者涉及权限边界的隐含扩展（agent倾向于assume
    broader scope），后者延续mvp_001中的高violation pattern。 CP偏低（~36-38%）延续diag_001中的visibility效应方向：显式冲突触发agent的conservative
    meta-cognition。 cross-judge agreement κ=0.78表明violation判定可靠但存在边界case（主要在partial
    compliance scenarios）。

    '
  tables:
  - name: 'Table 2: Violation Rates by Ambiguity Type and Condition (API Models)'
    description: 6 types × 2 conditions × 2 models, with violation rate, 95% bootstrap
      CI, and McNemar p-values
  - name: 'Table 3: Binary Effect Sizes by Model (API)'
    description: Per-model overall effect size (pp), paired with bootstrap 95% CI
  figures_description:
  - 'Figure: Paired dot plot showing ambiguous vs unambiguous violation rates per
    type, connected by lines, faceted by model'
  analysis: 'API模型数据确认C1（binary effect robust across types and models）。 gpt-5.4在scopal和authorization_scope上展现type-specific
    sensitivity（偏高）， 而gpt-4.1 rates更flat，初步支持C4假设但effect size小。 CP一致偏低支持C3 visibility趋势但正式检验需plan_004。

    '
- name: full_study_local
  plan_id: plan_003
  description: '300 clauses × 2 conditions × 2 local models (Qwen3-8B, Qwen3-32B-AWQ)
    = 1,200 episodes， RTX PRO 6000推理，cross-judge使用API模型。

    '
  expected_results:
    total_episodes: 1200
    gpu_hours_used: 42
    inference_throughput_episodes_per_hour: 29
    episode_completion_rate: 0.94
    qwen32b_overall_violation_rate_ambiguous: 0.44
    qwen32b_overall_violation_rate_unambiguous: 0.14
    qwen8b_overall_violation_rate_ambiguous: 0.41
    qwen8b_overall_violation_rate_unambiguous: 0.16
    qwen32b_binary_effect_pp: 30
    qwen8b_binary_effect_pp: 25
    qwen8b_type_rates:
      scopal: 0.43
      lexical: 0.4
      incompleteness: 0.39
      conditional_precedence: 0.38
      coreferential: 0.41
      authorization_scope: 0.44
    qwen32b_type_rates:
      scopal: 0.48
      lexical: 0.43
      incompleteness: 0.41
      conditional_precedence: 0.36
      coreferential: 0.45
      authorization_scope: 0.5
    qwen8b_type_rate_range_pp: 6
    qwen32b_type_rate_range_pp: 14
  result_rationale: 'Qwen3-8B效应量衰减至+25pp（相比API模型的29-35pp），符合median档假设（衰减10-15pp相对于最强模型）。
    机制：小模型的instruction-following能力较弱，在unambiguous条件下也有较高的baseline violation（16% vs
    API的11-13%）， 同时在ambiguous条件下的violation rate提升幅度较小，因为其对linguistic nuance的sensitivity更低——
    更倾向于uniform violation pattern而非ambiguity-sensitive的差异化响应。 Qwen3-8B的type-specific
    rates range仅6pp（38-44%），远窄于gpt-5.4的15pp， 直接支持"小模型uniform violation"假设。 Qwen3-32B-AWQ作为中间规模模型，效应量（30pp）和type
    range（14pp）介于8B和API模型之间， 构成capability gradient的中间数据点。 episode completion rate略低于API（94%
    vs 97%）因为小模型偶尔生成malformed tool calls被τ²-bench判为failure。

    '
  tables:
  - name: 'Table 4: Violation Rates by Ambiguity Type and Condition (Local Models)'
    description: 6 types × 2 conditions × 2 local models, with violation rate, 95%
      bootstrap CI, and McNemar p-values
  - name: 'Table 5: Cross-Model Binary Effect Comparison'
    description: 4 models ranked by binary effect size, with 95% CI and parameter
      count
  figures_description:
  - 'Figure: Binary effect size (pp) vs model parameter count (log scale), showing
    monotonic but diminishing returns relationship'
  - 'Figure: Type-specific violation rate range (max-min across 6 types) vs model
    scale, showing narrower range for smaller models'
  analysis: 'Local模型数据确认binary effect跨model scale的robustness（即使最弱的Qwen3-8B仍有+25pp）。
    但type sensitivity随scale衰减的pattern支持C4的capability-dependent hypothesis： type differentiation是emergent
    property而非fundamental property of ambiguity。 这为C2 null finding增加了nuance——uniformity在小模型上是trivially
    true（uniform low sensitivity）， 在大模型上也成立但机制不同（high sensitivity but similar rates
    across types）。

    '
- name: full_study_analysis
  plan_id: plan_004
  description: '2,400 episodes的完整统计分析：binary effect、type uniformity、visibility comparison、model×type
    interaction。

    '
  expected_results:
    overall_binary_effect_pp: 31
    overall_binary_effect_ci95:
    - 27
    - 35
    mcnemar_p_overall: 2.3e-08
    types_individually_significant_of_6: 6
    mcnemar_p_max_across_types: 0.004
    min_type_effect_pp: 19
    max_type_effect_pp: 38
    omnibus_chi2: 7.82
    omnibus_chi2_df: 5
    omnibus_chi2_p: 0.17
    cramers_v: 0.15
    cramers_v_below_020: true
    pairwise_significant_pairs_of_15: 2
    pairwise_bonferroni_significant_of_15: 0
    cp_violation_rate: 0.37
    scopal_violation_rate: 0.47
    visibility_delta_pp: -7.2
    visibility_p: 0.09
    visibility_cohens_h: 0.2
    visibility_direction_consistent_across_models: true
    interaction_chi2_4x6: 18.4
    interaction_df: 15
    interaction_p: 0.14
    logistic_regression_interaction_p: 0.11
    pairwise_model_type_significant: 3
  result_rationale: 'C1: 全6类型McNemar均显著（最弱的incompleteness也达p=0.004），overall effect
    +31pp with tight CI [27,35]。 这是论文的primary anchor——effect size远超任何noise band（±8pp），即使最保守的下界（+27pp）也是massive。
    min_type_effect 19pp（来自CP，因visibility效应压低了ambiguous-unambiguous gap， 但unambiguous
    baseline也低所以absolute gap仍显著）。

    C2: V从mvp_001的0.084升至0.15，因为authorization_scope（~51%）和coreferential（~46%） 的加入拉大了type间variance。但仍在pre-committed
    0.20阈值内。omnibus p=0.17未达0.05。 Bonferroni后无pairwise显著。这是informative null但需要honest
    discussion： V=0.15比V=0.08更接近阈值，如果再增加2-3个high-violation types可能突破。 median档的narrative是"null
    holds but is softer than MVP suggested"。

    C3: Δ=-7.2pp方向一致（CP < scopal across all 4 models）但p=0.09未达0.05。 Cohen''s h=0.20属于small
    effect。这是一个suggestive trend：方向一致性强但统计power不足。 在median档中这正是"warranting future investigation"的定位——
    不够强到作为core claim但足够有趣到在Discussion中展开。

    C4: 4×6 contingency的interaction p=0.14，整体marginal。 但存在3个pairwise显著的model×type组合（主要涉及gpt-5.4在scopal/authorization_scope上的高sensitivity
    vs Qwen3-8B的flat pattern）。 不足以支持general interaction claim，但为capability-dependent
    hypothesis提供directional evidence。

    '
  tables:
  - name: 'Table 6: Binary Effect Summary (C1)'
    description: Overall and per-type binary effect sizes with 95% bootstrap CI, McNemar
      χ², p-values. All 6 types significant.
  - name: 'Table 7: Type Uniformity Analysis (C2)'
    description: Omnibus χ², Cramér's V, and 15 pairwise comparisons with Bonferroni
      correction. V=0.15, p=0.17.
  - name: 'Table 8: Visibility Comparison (C3)'
    description: CP vs scopal violation rates by model, overall Δ, Fisher's exact
      p, Cohen's h.
  - name: 'Table 9: Model × Type Interaction (C4)'
    description: 4×6 contingency table, logistic regression coefficients, interaction
      term p-values.
  figures_description:
  - 'Figure: Forest plot of binary effect sizes (pp) per type with 95% CI, ordered
    by effect magnitude. Reference line at 0. All CIs exclude 0.'
  - 'Figure: Heatmap of violation rates (4 models × 6 types), color-coded. Shows gpt-5.4''s
    type differentiation vs Qwen3-8B''s uniformity.'
  - 'Figure: CP vs scopal violation rate comparison across 4 models (paired bar chart).
    Direction consistent, error bars overlapping.'
  analysis: 'C1是unambiguously strong：+31pp [27,35]，所有6类型独立显著。这足以作为standalone contribution。
    C2的null holds但V=0.15需要transparent discussion——论文应说"binary sufficiency is supported
    at current sample size and type coverage, but the effect approaches our pre-committed
    threshold, suggesting that future work with more types or larger N may reveal
    differential effects." C3的suggestive trend（p=0.09, direction 4/4 models consistent）在EMNLP
    context下有narrative value： 连接psycholinguistic visibility literature，即使不显著也值得reporting
    as exploratory finding。 C4的marginal interaction主要driven by gpt-5.4，其他模型flat。这限制了generalizability但
    作为capability-dependent hypothesis的initial evidence是合适的。

    '
- name: error_analysis
  plan_id: plan_005
  description: '300条violation traces的定性分析：failure mode分类、cross-type分布、visibility机制、model-specific
    patterns。

    '
  expected_results:
    total_traces_sampled: 300
    failure_modes_identified: 4
    failure_mode_taxonomy:
      scope_misapplication: 0.31
      assumption_based_action: 0.27
      arbitrary_rule_selection: 0.24
      conservative_refusal_then_proceed: 0.18
    cross_type_dominant_mode_overlap: 0.62
    cp_explicit_conflict_detection_rate: 0.44
    scopal_meta_awareness_rate: 0.08
    inter_annotator_kappa: 0.52
    type_specific_patterns:
      scopal:
        dominant_mode: scope_misapplication
        pct: 0.45
      lexical:
        dominant_mode: assumption_based_action
        pct: 0.38
      incompleteness:
        dominant_mode: assumption_based_action
        pct: 0.42
      conditional_precedence:
        dominant_mode: conservative_refusal_then_proceed
        pct: 0.41
      coreferential:
        dominant_mode: scope_misapplication
        pct: 0.36
      authorization_scope:
        dominant_mode: arbitrary_rule_selection
        pct: 0.39
  result_rationale: '识别出4大failure modes而非更多，因为LLM的failure pattern inherently更coarse-grained
    than human errors。 cross-type overlap 62%意味着大多数failure modes在多个type中出现，只是比例不同——
    这与C2的quantitative uniformity一致（similar rates因为similar failure mechanisms）。

    scope_misapplication主导scopal（45%）和coreferential（36%）因为两者都涉及referent/scope的structural
    ambiguity。 assumption_based_action主导lexical（38%）和incompleteness（42%）因为两者都涉及missing/underspecified信息，
    模型填充assumed interpretation。 CP的conservative_refusal_then_proceed（41%）直接解释visibility效应：
    模型在44%的CP traces中显式检测到冲突（"I notice these rules conflict..."）然后选择conservative path，
    而scopal traces中仅8%显示meta-awareness。这是C3机制的qualitative evidence。 authorization_scope的arbitrary_rule_selection（39%）是有趣的新发现：
    模型在权限边界模糊时不做assumption也不报告冲突，而是看似随机地选择authorization level。

    κ=0.52属于moderate agreement，反映failure mode边界的inherent fuzziness。 一个trace经常混合多种modes（如先assume然后misapply
    scope），分类需judgment call。 这限制了error analysis作为独立contribution的strength，但作为supplementary
    analysis足够。

    '
  tables:
  - name: 'Table 10: Failure Mode Distribution by Ambiguity Type'
    description: 4 failure modes × 6 types, with proportion and representative trace
      excerpts
  - name: 'Table 11: Visibility Mechanism Evidence'
    description: 'CP vs scopal traces: explicit conflict detection rate, meta-awareness
      markers, conservative strategy adoption'
  figures_description:
  - 'Figure: Stacked bar chart of failure mode proportions across 6 ambiguity types.
    Shows cross-type overlap with type-specific skews.'
  - 'Figure: Annotated trace excerpts comparing CP (explicit conflict detection) vs
    scopal (surface scope adoption) failure patterns'
  analysis: 'Error analysis的核心价值不在failure mode taxonomy本身（4类，overlap高）， 而在于为C3 visibility
    hypothesis提供mechanistic explanation： CP traces中44%显示explicit conflict detection
    vs scopal的8%。 这是qualitative evidence that ambiguity visibility modulates agent
    meta-cognition。 对于EMNLP reviewers，这种linguistic analysis of WHY是比quantitative rates更有价值的contribution，
    但moderate κ和high cross-type overlap限制了其standalone strength。 定位为§6 supplementary
    analysis而非独立contribution是正确的。

    '
- name: reliability_test
  plan_id: plan_006
  description: '30 clauses × 3 replicates × 2 conditions × 4 models = 720 episodes的test-retest
    reliability检验。

    '
  expected_results:
    total_episodes: 720
    gpu_hours_used: 10
    icc_overall: 0.68
    icc_by_model:
      gpt54: 0.72
      gpt41: 0.7
      qwen32b: 0.66
      qwen8b: 0.61
    bootstrap_ci_width_median_pp: 8.5
    bootstrap_ci_width_max_pp: 14
    binary_effect_replication_3of3: true
    per_clause_violation_rate_sd_median: 0.09
    type_rank_order_kendall_w: 0.74
    test_retest_band_pp: 7.5
  result_rationale: 'ICC=0.68属于moderate-to-good reliability，落在median档假设范围[0.60, 0.75]内。
    这意味着per-clause violation rate在replicates间有meaningful但非perfect consistency。 API模型（gpt-5.4
    ICC=0.72, gpt-4.1 ICC=0.70）比local模型（Qwen3-8B ICC=0.61）更reliable， 因为API模型的temperature/sampling更controlled，而小模型的stochasticity更高。

    test-retest band ±7.5pp略优于Reviewer在mvp→diag中观察到的±8pp， 因为reliability test使用fixed
    clause set和controlled conditions（vs跨实验的clause set变化）。 关键：binary effect的+31pp远超±7.5pp
    noise band（>4×），confirming effect is real, not artifact。 但C3的Δ=-7.2pp与noise band
    comparable，strengthening the case for "trend, not confirmed finding"。

    bootstrap CI宽度中位数8.5pp意味着per-type rates的precision约为±4-5pp， 足以支持C1（effects都>15pp）但不足以resolve
    C2中的smaller cross-type differences（~5-15pp range）。 这为C2 null提供alternative interpretation：可能是power不足而非true
    null。 在论文中需transparent reporting。

    '
  tables:
  - name: 'Table 12: Test-Retest Reliability (ICC)'
    description: Per-model ICC with 95% CI, median per-clause SD, and test-retest
      band width
  figures_description:
  - 'Figure: Bland-Altman plot of replicate violation rate differences, showing ±7.5pp
    limits of agreement'
  - 'Figure: Per-clause violation rate across 3 replicates (line plot), faceted by
    type. Shows within-clause consistency.'
  analysis: 'Reliability test的方法论贡献：为agent evaluation literature提供首个per-clause ICC
    estimate。 ICC=0.68 establishes that clause-level violation rates are reproducible
    enough for between-condition comparisons （binary effect far exceeds noise）but
    not for fine-grained within-condition comparisons （cross-type differences are
    noise-level）。 这同时strengthens C1（effect is robust to sampling noise）and contextualizes
    C2 （uniformity may partly reflect measurement precision limits rather than true
    uniformity）。 对RC8（API sampling noise）是direct methodological response。

    '
- name: realism_validation
  plan_id: plan_007
  description: '合成ambiguity clause与DRIP-R自然ambiguity的linguistic property comparison。

    '
  expected_results:
    properties_compared: 5
    sentence_length_ks_p: 0.12
    parse_depth_ks_p: 0.04
    flesch_kincaid_ks_p: 0.31
    ttr_ks_p: 0.22
    avg_sentence_length_synthetic: 18.4
    avg_sentence_length_natural: 16.2
    parse_depth_synthetic_mean: 5.8
    parse_depth_natural_mean: 4.9
    discriminator_accuracy: null
    overall_assessment: 4/5 properties non-significant, synthetic clauses slightly
      more complex
  result_rationale: '合成clause在4/5 linguistic properties上与DRIP-R自然ambiguity无显著差异（KS
    p>0.05）， 但parse depth显著偏高（p=0.04）。原因：matched-pair design要求每条clause同时有ambiguous和unambiguous版本，
    这种对称性约束倾向于生成稍微更复杂的句式结构（需要足够的syntactic depth来embed ambiguity而不显得artificial）。 sentence
    length也略偏高（18.4 vs 16.2 words）但未达显著。

    这是一个honest limitation：合成clause比natural policy text slightly more syntactically
    complex。 但effect direction是conservative的——如果更复杂的句子导致更多ambiguity detection， 那么real-world
    effect可能更大（simpler sentences中ambiguity更隐蔽）。 4/5 non-significant足以address RC4 at
    reasonable level，parse depth差异在limitations中报告。

    '
  tables:
  - name: 'Table 13: Linguistic Property Comparison (Synthetic vs Natural Ambiguity)'
    description: 5 properties with means, SDs, KS statistic, and p-values. 4/5 non-significant.
  figures_description:
  - 'Figure: Overlapping density plots for each linguistic property (synthetic in
    blue, DRIP-R in orange)'
  analysis: 'Realism validation结果支持synthetic injection的ecological validity但非完美。 parse
    depth差异应在Method section的limitations中transparent reporting， 并论证effect direction
    is conservative for real-world applicability。 如果DRIP-R数据不可获取，仅做linguistic property分析（无discriminator
    test）， 这在methodological rigor上略有遗憾但不影响core claims。

    '
- name: classifier_poc
  plan_id: plan_008
  description: 'DeBERTa-v3-large fine-tuned binary ambiguity detector，在annotated clause
    pairs上训练和评估。

    '
  expected_results:
    training_clauses: 240
    test_clauses: 60
    epochs: 5
    gpu_hours_used: 3
    accuracy: 0.82
    f1_ambiguous: 0.8
    f1_unambiguous: 0.84
    precision_ambiguous: 0.78
    recall_ambiguous: 0.82
    auc_roc: 0.88
    hardest_types_f1:
      incompleteness: 0.72
      authorization_scope: 0.75
    easiest_types_f1:
      conditional_precedence: 0.9
      scopal: 0.86
  result_rationale: '整体accuracy 82%和F1 0.80属于reasonable PoC水平，证明binary detection是feasible但远非production-ready。
    incompleteness最难检测（F1=0.72）因为缺失信息的absence本身难以被language model捕捉 （需要world knowledge
    about what SHOULD be specified）。 authorization_scope也偏难（F1=0.75）因为权限边界的ambiguity经常依赖domain-specific
    knowledge。 CP最容易（F1=0.90）因为显式冲突有强lexical cues（"unless", "except", "notwithstanding"）。
    scopal较容易（F1=0.86）因为scope ambiguity有structural patterns（attachment height, quantifier
    scope） that DeBERTa can learn from syntactic representations。

    这不是一个strong contribution本身——82% accuracy不足以deploy—— 但足以demonstrate practical applicability
    of findings并justify future work。 在EMNLP论文中定位为§7 Discussion的"practical implications"小节（1段），
    而非独立section。如果时间紧张这是第一个可以cut的实验。

    '

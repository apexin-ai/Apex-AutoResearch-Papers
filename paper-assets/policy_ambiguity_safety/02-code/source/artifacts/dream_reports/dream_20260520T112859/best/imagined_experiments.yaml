    具备对显式规则冲突（CP）的 meta-cognitive awareness，触发保守策略； 但对结构性歧义（scopal）缺乏句法分析能力，默认采用 surface
    scope 导致高违规率。 gpt-4.1 类型敏感性更弱（范围 8pp），因其整体能力不足以形成差异化的歧义处理策略， 在各类型上均采用相似的 surface-level
    处理。两个模型的 unambiguous baseline 都很低 （6-8%），确认 matched pair 设计成功隔离了歧义效应。cross-judge
    agreement κ=0.91 反映评估标准明确且 violation 定义操作化良好。


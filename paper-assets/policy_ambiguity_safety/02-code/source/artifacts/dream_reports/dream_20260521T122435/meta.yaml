    ## Questions for Authors


    1. Can you specify the exact correction procedure (additive/multiplicative, per-type
    vs. aggregate, confidence intervals on corrections)?

    2. What is the annotator adjudication protocol for disagreements in the 100-episode
    calibration set?

    3. Have you conducted a sensitivity analysis: if the true correction is ±5pp from

tier_definitions:
  tiers:
    best:
      tier: best
      meaning: plan_009 judge calibration强确认，所有claim原strength成立，model×type interaction叙事被接受为novel
        contribution
      key_assumptions:
      - plan_009 human-judge F1 ≥ 0.85，κ ≥ 0.80 → 测量链完全验证，LLM-as-judge可信度无争议
      - C3 layer effect fragility不伤大局——C4 interaction作为star finding吸收了C3的解释力
      - reviewer认可differential nocuity + model×type interaction为独立于DRIP-R的novel contribution
      - perturbation control (PASS) + ICC 0.919 + judge calibration = 三重验证，'strongest
        causal evidence'claim成立
      - C5 failure mode taxonomy的moderate κ(0.594)在human anchor validation后升至good(≥0.70)
      - generalization data (plan_013, 7/7 C1 replicated) 被视为强robustness evidence
      number_ranges:
        judge_human_f1:
        - 0.85
        - 0.95
        judge_human_kappa:
        - 0.8
        - 0.9
        c1_delta_pp_after_correction:
        - 31.0
        - 37.0
        c4_interaction_chi2_p:
        - 1.0e-06
        - 0.0001
        c5_human_anchor_kappa:
        - 0.7
        - 0.85
        claims_full_strength_of_5:
        - 4
        - 5
        arr_expected_avg:
        - 3.5
        - 4.0
      narrative_direction: '原始framing完全成立。Title保持"Differential Nocuity"，5个claim按当前strength发表。
        C1=confirmed(+34pp, causal), C2=confirmed(3-tier), C3=suggestive(disclosed
        fragility), C4=star finding(model×type interaction), C5=validated(human anchor升级)。
        核心卖点：首个因果量化 + differential nocuity framework + 5-model interaction matrix。
        Judge calibration作为methodological strength而非limitation呈现。 Contribution ordering:
        causal quantification > differential nocuity > failure mode taxonomy。 预期reviewer反应：RC6("obvious")被perturbation
        control完全化解，RC3 resolved(5 models)， novelty在interaction而非binary effect。

        '
    median:
      tier: median
      meaning: plan_009 judge calibration adequate但有bias，C3降级为appendix-level，C5 fine-grained
        claims需软化
      key_assumptions:
      - plan_009 human-judge F1 0.72-0.84，κ 0.65-0.79 → 测量链大体可信但有系统性偏差（如severity tier边界不一致）
      - judge calibration揭示对某些severity tier有5-10pp系统偏差 → C1 effect size需correction但仍显著(≥25pp)
      - C3 within-judge fragility + judge bias双重打击 → 降为Discussion/Appendix，不作为独立claim
      - C5 human anchor κ仅moderate(0.55-0.69) → fine-grained per-type failure mode
        percentages改为qualitative描述
      - C4 interaction在correction后仍显著但effect size缩小 → auth_scope range可能从52pp降至35-45pp
      - 至少一位reviewer认为contribution是incremental over DRIP-R，需要rebuttal说服
      number_ranges:
        judge_human_f1:
        - 0.72
        - 0.84
        judge_human_kappa:
        - 0.65
        - 0.79
        c1_delta_pp_after_correction:
        - 25.0
        - 33.0
        c4_interaction_chi2_p:
        - 0.0001
        - 0.01
        c5_human_anchor_kappa:
        - 0.55
        - 0.69
        claims_full_strength_of_5:
        - 2
        - 3
        arr_expected_avg:
        - 3.0
        - 3.5
      narrative_direction: '部分假设未完全验证，需调整claims强度。C3从独立claim降为C4的supporting evidence。
        C5从"validated failure mode taxonomy"降为"exploratory qualitative analysis with
        automated coding"。 Title可能调整为强调interaction而非layer："How Ambiguity Type and
        Model Architecture Shape Safety Violations"。核心narrative从5-claim结构收缩为3-claim：C1(causal,
        corrected effect size), C2(type hierarchy), C4(model×type interaction, 仍是star
        finding但auth_scope range写conservative estimate)。 Judge calibration bias作为limitation诚实披露，但强调correction后core
        findings robust。 Contribution ordering不变但C5从contribution降为analysis section。
        Rebuttal策略：强调perturbation control(无其他agent safety paper有此)和5-model coverage。

        '
    worst:
      tier: worst
      meaning: plan_009揭示judge系统性高估violation rate，核心effect size大幅缩水，需reframe为methodology+interaction论文
      key_assumptions:
      - plan_009 human-judge F1 < 0.72，κ < 0.65 → judge对ambiguous condition有inflation
        bias(高估10-15pp)
      - correction后C1 effect size降至15-24pp → 仍显著但从'massive'降为'substantial'，OR从15降至5-8
      - C3 layer effect correction后不再显著(p>0.10) → 完全drop
      - C4 interaction在correction后部分cell翻转或不显著 → auth_scope range缩至20-35pp，部分model差异消失
      - C5 fine-grained failure modes不可靠 → 仅保留Ambiguity Blindness(<11%)和layer-level
        failure mode pattern
      - C2 type hierarchy ranking可能改变 → incompleteness仍top但mid-tier排序不稳定
      - reviewer认为corrected effect size不够impressive，或质疑整个LLM-as-judge pipeline
      number_ranges:
        judge_human_f1:
        - 0.55
        - 0.71
        judge_human_kappa:
        - 0.45
        - 0.64
        c1_delta_pp_after_correction:
        - 15.0
        - 24.0
        c4_interaction_chi2_p:
        - 0.005
        - 0.05
        c5_human_anchor_kappa:
        - 0.4
        - 0.54
        claims_full_strength_of_5:
        - 1
        - 2
        arr_expected_avg:
        - 2.5
        - 3.0
      narrative_direction: '核心假设部分不成立，需找新angle但不降级venue。Reframe策略： (1) 从"effect demonstration"转向"methodology
        paper"——matched-pair causal design + perturbation control + judge calibration
        pipeline本身是对agent safety evaluation的方法论贡献。 (2) Title转向方法论："Measuring Policy
        Ambiguity''s Causal Impact on Agent Safety: A Matched-Pair Framework with
        Judge Calibration"。 (3) C1仍成立(corrected +15-24pp仍显著且有perturbation control背书)，但framing从"massive
        effect" 改为"significant and ambiguity-specific effect, robust to non-ambiguity
        perturbation"。 (4) C4 interaction保留但降为secondary finding，强调methodology能检测到model-specific
        patterns。 (5) Judge calibration从limitation翻转为contribution——"we provide the
        first calibrated LLM-as-judge pipeline for agent safety evaluation, revealing
        systematic biases that inflate raw violation rates by X pp"。 (6) C2 type hierarchy用corrected
        rates重新计算，incompleteness-top可能仍成立。 (7) 增加methodological recommendations section替代部分dropped
        claims。 (8) Generalization data(7/7 C1 replicated, plan_013)作为robustness evidence更关键——
        证明effect跨7个model都存在，即使corrected size smaller。 仍冲EMNLP：方法论贡献(causal design
        + calibration pipeline) + corrected but robust effect + 7-model replication
        + differential nocuity framework。不降级。'

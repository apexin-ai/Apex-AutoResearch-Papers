  - name: perturbation_control
    plan_id: plan_010
    description: '30 non-ambiguity perturbation pairs × 2 conditions × 2 models (gpt-5.4,
      gpt-4.1) = 120 episodes。 验证ambiguity-specific causation vs general prompt brittleness。

      '
    expected_results:
      total_episodes: 120
      perturbation_types:
        synonym_substitution: 15
        clause_reordering: 15
      delta_perturb_pp: 3.33
      delta_perturb_ci:
      - -3.0
      - 9.67
      ci_contains_zero: true
      delta_ambiguity_pp: 36.5
      net_delta_pp: 33.17
      ratio: 0.091
      verdict: PASS
      synonym_delta_pp: 2.67
      reorder_delta_pp: 4.0
    result_rationale: 'Best档下perturbation control完美PASS：Δ_perturb=3.33pp（CI含0）， ratio=0.091远低于0.15
      PASS阈值。这意味着non-ambiguity surface changes （synonym substitution、clause reordering）对violation
      rate几乎无影响， 而ambiguity manipulation产生+36.5pp massive effect。 Net effect=33.17pp（36.5
      - 3.33），基本等于gross effect—— prompt brittleness不是confound。

      Synonym substitution比clause reordering effect更小（2.67pp vs 4.00pp）， 因为reordering至少改变了信息的salience/processing
      order，但两者都远小于ambiguity effect。 CI宽度~12.7pp在N=120下是expected的（power analysis预测width
      ~15pp at N=120）， 关键是upper bound 9.67pp < 10pp threshold，足以排除substantial prompt
      sensitivity confound。

      这个PASS verdict使C1可以claim"strongest causal evidence"—— matched-pair design（internal
      validity）+ perturbation control（specificity）+  ICC 0.919（reliability）= 三重验证。完全化解RC11（Dream
      A9 best tier "strongest point"）。


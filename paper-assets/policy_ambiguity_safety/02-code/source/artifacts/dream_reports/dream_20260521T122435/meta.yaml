    # Dream Review Report — Differential Nocuity


    **Paper:** Differential Nocuity: How Ambiguity Type and Model Architecture Shape
    Safety Violations in LLM Agents

    **Venue:** EMNLP 2026 (ARR)

    **Review mode:** simple (1 Reviewer, full coverage)


    ---


    ## Overall Assessment: 3.5 — Borderline Conference


    This is a methodologically rigorous empirical study that asks a well-motivated
    question — how does policy ambiguity *type* interact with model architecture to
    produce safety violations in LLM agents? The matched-pair causal design with perturbation
    controls, ICC reliability testing, and human-validated judge calibration represents
    unusually strong methodology for the agent safety literature. The model×type interaction
    finding (C4) is the standout contribution, with the 52pp range on authorization
    scope across models being genuinely striking. However, scope limitations (2 domains,
    synthetic stimuli), small effect sizes for the type hierarchy (Cramér''s V=0.137),
    and the fragility of the layer effect (C3) prevent this from being a clear conference
    accept. It is a strong candidate for Findings.


    ---


    ## Soundness: 4 / 5


    ### Strengths


    1. **Causal design is exemplary.** The matched-pair approach (ambiguous vs. minimally-edited
    unambiguous control) is the right design for this question. The perturbation control
    (Δ_perturb=3.33pp, CI includes zero, vs. Δ_ambiguity=36.5pp) convincingly isolates
    ambiguity-specific causation from general prompt brittleness. This is a control
    that most prior agent safety benchmarks (DRIP-R, PhantomPolicy, AgentPex) lack,
    and it substantially strengthens C1.


    2. **Triple validation chain.** ICC=0.919 (reliability) + perturbation control
    (specificity) + judge-human F1=0.91 with κ=0.84 (measurement validity) forms a
    credible evidence chain. The per-severity calibration breakdown (high F1=0.94,
    mid 0.88, low 0.82) is informative and honest.


    3. **C4 interaction is well-supported.** The 5×6 heatmap (Table 9) reveals a genuinely
    interesting pattern: auth_scope ranges 12%–64% across models while incompleteness
    stays 46%–62%. Per-model χ² tests showing GPT-5.4 and Claude have significant
    type differentiation (V=0.28, 0.24) while DeepSeek does not (V=0.14, n.s.) is
    a clean result that connects to safety training selectivity.


    4. **Honest treatment of C3 fragility.** The paper correctly frames the layer
    effect as "suggestive but fragile," disclosing that within-judge subgroup analyses
    yield p=0.059 and p=0.157. This is good scientific practice — many papers would
    overclaim here.


    5. **Logistic regression controls for token delta confound.** Specification-layer
    types have systematically higher token deltas (28–36 tokens) than linguistic-layer
    types (8–21). The regression confirms ambiguity condition is the dominant predictor
    (β=2.278, z=19.65) while token delta is significant but weak (β=0.022, z=3.49).
    This is a necessary analysis that is correctly included.


    ### Weaknesses


    1. **Cramér''s V=0.137 for C2 is small.** The paper argues power=0.993 and MDE=0.093,
    which is technically correct — the study can detect this small effect. But the
    practical significance of a "three-tier hierarchy" where the tiers differ by 6–22pp,
    confirmed by a V=0.137 omnibus test, is debatable. The TOST analysis (8/15 pairs
    equivalent at ±15pp) partially addresses this, but ±15pp is a generous equivalence
    margin. At ±10pp, only 4/15 pairs are equivalent, which actually *weakens* the
    three-tier narrative — it suggests more of a continuum than discrete tiers.


    2. **Within-judge confounding for C3.** The aggregate layer effect (p=0.017) is
    driven primarily by GPT models'' elevated auth_scope rates inflating the specification-layer
    average. Since auth_scope is the most model-variable type (C4), C3 is arguably
    an artifact of C4 rather than an independent finding. The paper acknowledges this
    but still lists C3 as a contribution. Demoting it to a descriptive observation
    rather than a claim would be more appropriate.


    3. **Error analysis sample imbalance.** 300 traces analyzed, but 245 are from
    GPT-5.4 and GPT-4.1, with only 55 from the remaining 3 models. The claim that
    "5/6 types share the same dominant failure mode across models" is only validated
    across 2 models. The type-diagnostic signatures may not generalize to Claude,
    Qwen3, or DeepSeek.


    4. **Cross-judge evaluation design has potential circularity.** Claude is judged
    by GPT-5.4; GPT-5.4 by GPT-4.1; DeepSeek/Qwen3 by GPT-5.4/GPT-4.1. The cross-judge
    ΔF1=0.02 is reassuring, but the human validation (100 episodes) doesn''t specify
    how these episodes are distributed across models. If the 100 episodes are predominantly
    from one model, the calibration may not transfer.


    5. **Systematic nocuity (27% convergence) is underdeveloped.** This is introduced
    in Discussion as a "third category" extending Berry & Kamsties'' framework, but
    receives only one paragraph. For a finding this provocative — all models converge
    on the *same wrong* answer for over a quarter of ambiguous episodes — there should
    be deeper analysis: which types exhibit systematic nocuity most? Which clause
    properties predict it? This feels like a missed opportunity.


    ---


    ## Excitement: 3.5 / 5


    ### What''s exciting


    - **Novel research question.** The intersection of ambiguity *type* taxonomy with
    agent safety *outcomes* has not been studied with this granularity. Prior work
    either classifies ambiguity without measuring downstream harm (Massey et al.,
    Li et al.) or measures agent safety without distinguishing ambiguity types (R-Judge,
    ToolEmu).

    - **"Differential nocuity" as a concept** is a genuine contribution — the idea
    that safety impact is jointly determined by ambiguity type and model, not by ambiguity
    alone, has clear practical implications.

    - **The model×type interaction** is the most publishable finding. The auth_scope
    column of Table 9 alone (12% Claude vs. 64% GPT-5.4) tells a compelling story
    about safety training selectivity.

    - **Ambiguity Blindness** (<11% awareness, <1% escalation) is a striking qualitative
    finding with clear implications for agent design.


    ### What limits excitement


    - **Two domains only** (airline, retail). The cross-domain consistency (Δ<13pp)
    is encouraging but insufficient — healthcare, legal, and financial policies are
    the high-stakes domains where this work matters most, and they are untested.

    - **Synthetic stimuli.** The KS-test comparison against DRIP-R (all p>0.10) addresses
    surface linguistic properties, but real-world policy ambiguities are embedded
    in longer documents with contextual dependencies that isolated clause pairs cannot
    capture. The ecological validity gap is acknowledged but remains significant.

    - **Limited novelty in the taxonomy itself.** The six-type, two-layer taxonomy
    is adapted from Massey et al. (2014) and Li et al. (2024a). The paper''s contribution
    is measuring *consequences*, not proposing new types. This is fine, but it means
    the conceptual framework is incremental.

    - **Practical applicability is gestured at but not developed.** The DeBERTa classifier
    PoC (binary F1=0.81, macro F1=0.63) is too preliminary to constitute a practical
    contribution. The "type-aware policy auditing" recommendation is sensible but
    generic.


    ---


    ## Reproducibility: 3.5 / 5


    ### Positive

    - Five named models with clear architecture categorization

    - Full statistical test details (effect sizes, CIs, p-values) throughout

    - ICC, judge calibration, and perturbation control methodology clearly described

    - τ²-bench framework is named as the evaluation scaffold


    ### Concerns

    - **Clause pair generation process is underspecified.** The paper mentions "a
    mix of labeled (explicit conflict markers) and naturalistic rewrites (50/50 ratio)"
    with "96% quality review pass rate," but does not describe *how* the 300 pairs
    were generated. Were they manually authored? LLM-generated? What were the criteria
    for the quality review? Without this, the stimulus set cannot be reproduced.

    - **τ²-bench framework details missing.** The paper references the framework but
    does not describe the agent task structure, tool environment, or episode format.
    A reader cannot reconstruct what an "agentic episode" looks like.

    - **No data or code availability statement.** For 3,000 episodes with 300 clause
    pairs, the dataset would be a significant community resource. No mention of release
    plans.


    ---


    ## Formatting / Compliance Checks


    - **Page limit:** Main text (Sections 1–8) appears to occupy approximately 8.5
    pages. With Limitations excluded per EMNLP 2026 rules, this is borderline — the
    Conclusion ends partway through page 9. Tight but likely within tolerance after
    reformatting. Authors should verify.

    - **Anonymity:** "Anonymous" authorship — compliant.

    - **Limitations section:** Present, covers three appropriate points (domain scope,
    synthetic stimuli, C3 fragility). Adequate length per venue norms.

    - **Responsible NLP Research Checklist (Sections A–E):** **Not visible in the
    PDF.** This is mandatory for EMNLP 2026 and its absence is a desk-reject risk.
    Authors must include this.

    - **References:** 17 citations. Adequate for the claims made but slightly thin
    — missing some relevant work (PolicyBank, PhantomPolicy, and AgentPex are mentioned
    in Related Work but not cited with full references).


    ---


    ## Detailed Comments for Authors


    ### Major


    **M1.** The C3 layer effect should be demoted from a standalone contribution to
    a descriptive observation subsumed by C4. The aggregate p=0.017 is driven by auth_scope''s
    model-dependent inflation of the specification-layer average. The within-judge
    fragility (p=0.059, 0.157) and the Qwen3 reversal (−0.9pp) make this unreliable
    as an independent claim. Reframe: "the aggregate layer gap is an artifact of the
    model×type interaction; the more fundamental pattern is C4."


    **M2.** Expand the systematic nocuity analysis (currently one Discussion paragraph).
    At minimum: (a) which ambiguity types show highest systematic nocuity rates, (b)
    are there clause-level features that predict all-model convergence on the wrong
    answer, (c) how does systematic nocuity relate to the Ambiguity Blindness finding?
    This concept deserves a subsection, not a paragraph.


    **M3.** Add a data/code availability statement. Specify whether clause pairs,
    episode traces, and evaluation code will be released. The 300 clause pairs and
    3,000 episode dataset would be a significant resource for the community.


    **M4.** Include the Responsible NLP Research Checklist (Sections A–E). This is
    mandatory for EMNLP 2026.


    ### Minor


    **m1.** Specify clause pair generation methodology: manual vs. LLM-assisted, prompts
    used, quality review criteria, number of authors involved.


    **m2.** Report how the 100 human-annotated episodes (§4.7) were sampled across
    models and ambiguity types. If the distribution is skewed, calibration claims
    may not generalize uniformly.


    **m3.** The error analysis claims cross-model consistency of failure modes ("5/6
    types share the same dominant mode") but this is only validated on GPT-5.4 and
    GPT-4.1 (245/300 traces). Add a caveat or expand the sample for the other 3 models.


    **m4.** Table 9 would benefit from color coding or bold/italic annotation to highlight
    the patterns discussed in text (auth_scope gradient, incompleteness uniformity,
    cond_prec invariance).


    **m5.** The "Disambiguation Channel Framework" in Discussion is presented post-hoc.
    Consider foreshadowing it in §3 (Ambiguity Taxonomy) where the specification-vs-linguistic
    distinction is introduced, to strengthen the narrative arc.


    **m6.** Reference list: PolicyBank, PhantomPolicy, and AgentPex are mentioned
    by name in Related Work but lack full bibliographic entries. Either add citations
    or remove the names.


    ---


    ## Summary Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 4.0 |

    | Excitement | 3.5 |

    | Reproducibility | 3.5 |

    | **Overall Assessment** | **3.5 — Borderline Conference** |


    ### Calibration rationale

    The methodology is conference-quality — the causal design with perturbation controls
    and triple validation chain is stronger than most agent safety papers. The model×type
    interaction (C4) is a genuinely interesting finding. However, the limited scope
    (2 domains, synthetic stimuli), small effect size for the type hierarchy (V=0.137),
    fragile layer effect (C3), and underdeveloped systematic nocuity analysis prevent
    a confident conference recommendation. With the revisions suggested (demote C3,
    expand systematic nocuity, add checklist and data statement), this could be a
    solid conference paper. As submitted, it is a strong Findings paper.


    ### Confidence

    4/5 — I am confident in this assessment. The strengths and weaknesses are clear
    from the paper. My main uncertainty is whether the model×type interaction alone
    is exciting enough for main conference acceptance at EMNLP.


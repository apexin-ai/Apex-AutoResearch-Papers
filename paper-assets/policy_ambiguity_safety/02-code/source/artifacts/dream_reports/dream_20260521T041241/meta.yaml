      narrative_direction: 核心叙事保持但需降低三处 claim 强度：(1) C3 layer effect 从 'significant'
        降为 'suggestive tendency'，Disambiguation Channel 从 explanatory framework 进一步降为
        'observed pattern consistent with'，layer 部分移入 Discussion 而非 Results 的核心位置；(2)
        perturbation control 需报告 net effect (Δ_net = Δ_ambiguity - Δ_perturb)，C1 写
        'ambiguity causes violations substantially beyond general prompt sensitivity'
        而非 'ambiguity-specific'；(3) C5 failure mode 跨模型一致性从 '5/6 types converge' 改为

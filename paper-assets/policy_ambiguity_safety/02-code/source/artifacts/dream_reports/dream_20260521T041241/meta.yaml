  review_report: "---\ndream_id: dream_20260521T041241\ntier: best\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-21T05:14:56.219709+00:00\n---\n\n# Dream\
    \ Review Report — Differential Nocuity\n\n**Paper:** Differential Nocuity: How\
    \ Ambiguity Type and Model Architecture Shape Safety Violations in LLM Agents\
    \  \n**Venue Target:** EMNLP 2026 (ARR)  \n**Review Mode:** Simple (single reviewer,\
    \ full coverage)  \n**Date:** 2026-05-21\n\n---\n\n## 1. Summary\n\nThis paper\
    \ investigates whether and how policy ambiguity causes safety violations in LLM\
    \ agents. Using a matched-pair design with 300 clause pairs across six ambiguity\
    \ types (organized into specification-layer and linguistic-layer), the authors\
    \ evaluate five architecturally diverse models (~3,000 agentic episodes in τ²-bench).\
    \ The core findings are: (1) ambiguity universally increases violations by +34.0\
    \ pp (confirmed by perturbation control); (2) a three-tier type hierarchy (incompleteness\
    \ >> mid-cluster >> coreferential); (3) a significant model×type interaction where\
    \ authorization-scope vulnerability ranges 52 pp across models; and (4) pervasive\
    \ \"Ambiguity Blindness\" (<5.2% meta-cognitive awareness). The authors frame\
    \ these findings under a \"Differential Nocuity\" framework connecting Berry &\
    \ Kamsties' RE theory to modern AI safety.\n\n---\n\n## 2. Strengths\n\n**S1:\
    \ Novel and important research question.** The intersection of requirements-engineering\
    \ ambiguity theory and LLM agent safety is genuinely underexplored. The paper\
    \ convincingly argues that prior agent safety benchmarks treat ambiguity as undifferentiated\
    \ noise rather than a typed causal variable. This is a meaningful gap.\n\n**S2:\
    \ Exceptionally thorough experimental design.** The methodology is among the most\
    \ rigorous in the agent safety literature:\n- Matched-pair within-subject design\
    \ isolating ambiguity as the causal variable\n- Perturbation control (synonym\
    \ substitution + clause reordering) to rule out general prompt brittleness — this\
    \ is a first in this literature and a strong methodological contribution\n- Cross-judge\
    \ design avoiding self-evaluation bias, with human-calibrated F1=0.90\n- Test-retest\
    \ ICC=0.919 demonstrating excellent measurement reliability\n- Realism validation\
    \ against DRIP-R natural ambiguities (all KS tests n.s.)\n- Five models spanning\
    \ three providers and two architecture families\n\n**S3: The model×type interaction\
    \ (C4) is the standout finding.** Authorization-scope as a \"canary type\" for\
    \ safety-training quality (12% Claude vs. 64% GPT-5.4) is actionable and theoretically\
    \ rich. The gradient of within-model type differentiation (Table 8) — from selective\
    \ (GPT-5.4, Claude) to uniform (DeepSeek) — provides a new lens for evaluating\
    \ safety training effectiveness.\n\n**S4: Disambiguation Channel Framework is\
    \ well-supported.** Three independent lines of convergent evidence (aggregate\
    \ layer effect, ICC stratification by layer, failure mode distributions) lend\
    \ credibility to this theoretical construct. The coreferential boundary-case analysis\
    \ (elevated conservative-refusal rate, diverse failure modes) is particularly\
    \ convincing.\n\n**S5: Ambiguity Blindness is a striking and practical finding.**\
    \ The <5.2% awareness rate, combined with the inverse correlation with action-orientation\
    \ (frontier models less aware), has immediate implications for agent deployment.\
    \ The conclusion that ambiguity detection must be externalized is well-supported.\n\
    \n**S6: Dense but well-organized paper.** The amount of content packed into 7\
    \ pages of main text (+ 1 page appendix) is impressive. Tables are information-dense\
    \ and well-designed. The claim hierarchy (C1–C5) provides clear structure.\n\n\
    ---\n\n## 3. Weaknesses\n\n**W1 [Critical]: All references are broken.** Every\
    \ citation in the paper appears as \"(?)\" or \"(??)\". The References section\
    \ (p.7) contains no entries — only blank line numbers. This makes it impossible\
    \ to:\n- Verify claims of novelty (\"first causal study\")\n- Assess positioning\
    \ against prior work (Berry & Kamsties, Chantree et al., DRIP-R, ToolEmu, R-Judge,\
    \ InjecAgent, Li et al., Massey et al.)\n- Check whether proper credit is given\n\
    - Evaluate the Related Work section substantively\n\nThis is a desk-reject-level\
    \ formatting issue under current EMNLP submission standards.\n\n**W2 [Critical]:\
    \ No Responsible NLP Research Checklist.** EMNLP 2026 requires mandatory Sections\
    \ A–E of the Responsible NLP Research Checklist. Incomplete or missing checklist\
    \ is an explicit desk-reject signal. The paper contains no visible checklist,\
    \ Ethics Statement, or Broader Impact section.\n\n**W3 [Critical]: No standalone\
    \ Limitations section.** Limitations are embedded in §7 Discussion (lines 491–503).\
    \ EMNLP 2026 requires a mandatory, clearly demarcated Limitations section (which\
    \ does not count against the page limit). This is another potential desk-reject\
    \ trigger.\n\n**W4 [Major]: C3 layer effect is weak and fragile.** V=0.062 is\
    \ a very small effect size. The within-judge p-values (0.021 and 0.038) would\
    \ not survive Bonferroni correction across the multiple subgroup analyses conducted.\
    \ The paper honestly acknowledges this (\"small and model-dependent\"), but the\
    \ claim still occupies a full subsection (§5.3) and recurs in the Discussion and\
    \ Conclusion. The layer effect is substantially driven by authorization-scope\
    \ rates — when auth-scope is removed, the layer gap likely collapses. This undermines\
    \ the Disambiguation Channel Framework's empirical support from the violation-rate\
    \ angle (the ICC and failure-mode evidence remain).\n\n**W5 [Major]: Multiple\
    \ comparisons not addressed.** The paper conducts numerous χ² tests, TOST comparisons\
    \ (15 pairwise), per-model within-type tests (5), logistic regressions, and subgroup\
    \ analyses without any family-wise error correction (Bonferroni, Holm, FDR). Given\
    \ the volume of tests, some nominal p<0.05 results (particularly C3 within-judge\
    \ subgroups) may be false positives.\n\n**W6 [Major]: Narrow domain coverage.**\
    \ All episodes use airline and retail customer-service scenarios from τ²-bench.\
    \ Policy ambiguity in healthcare, finance, legal, or government domains may behave\
    \ very differently. The generalizability claim in the title (\"LLM Agents\") is\
    \ broader than the evidence supports.\n\n**W7 [Moderate]: Token delta confound\
    \ partially addressed.** Unambiguous clauses are systematically longer (mean Δ=16.4\
    \ tokens overall, up to 36 tokens for spec-layer types). While token delta is\
    \ included as a logistic regression covariate, the fundamental issue is that disambiguation\
    \ adds semantic information, not just tokens. The perturbation control addresses\
    \ surface variation but not this specific confound: unambiguous clauses are more\
    \ informative, not merely longer.\n\n**W8 [Moderate]: Synthetic-only stimuli.**\
    \ Despite passing DRIP-R distributional validation, all 300 clause pairs are researcher-generated.\
    \ The KS tests compare surface linguistic properties (sentence length, parse depth,\
    \ FK grade, TTR) but cannot validate whether synthetic ambiguities trigger the\
    \ same cognitive/computational processing as naturally-occurring policy ambiguities.\
    \ The ecological validity argument would be stronger with even a small naturalistic\
    \ subset.\n\n**W9 [Moderate]: \"Systematic Nocuity\" methodology unclear.** The\
    \ 27% systematic nocuity rate is reported (§7, line 442) as a theoretical contribution,\
    \ but the paper does not describe how convergence was operationalized. What threshold\
    \ defines \"all models converge on the same wrong interpretation\"? Is it 5/5\
    \ models? 4/5? How is \"same interpretation\" coded? This needs methodological\
    \ specification.\n\n**W10 [Minor]: Section header tone.** \"C4: Model × Type Interaction—The\
    \ Star Finding\" (§5.4) is informal for a top venue. The finding should speak\
    \ for itself.\n\n**W11 [Minor]: Appendix B (DeBERTa PoC) is underdeveloped.**\
    \ With only 60 test pairs (10 per type), per-type F1 estimates have very wide\
    \ confidence intervals. The comparison to \"GPT-4 zero-shot\" (not GPT-4.1 or\
    \ GPT-5.4, the models used elsewhere) is inconsistent. This appendix adds little\
    \ — either develop it properly or cut it.\n\n---\n\n## 4. Experiment Coverage\
    \ Assessment\n\nComparing against the full experimental design:\n- **Clause generation\
    \ (plan_001):** ✓ Covered in §4.2, Table 1\n- **Mini-pilot (plan_001b):** ✓ Covered\
    \ in Appendix A\n- **Full study API (plan_002):** ✓ Covered in §5, Table 4\n-\
    \ **Full study open-source (plan_003):** ✓ Covered in §5, Table 4\n- **Statistical\
    \ analysis (plan_004):** ✓ C1–C4 all covered\n- **Error analysis (plan_005):**\
    \ ✓ Covered in §6, Tables 9–10\n- **Reliability (plan_006):** ✓ Covered in §4.6\n\
    - **Realism validation (plan_007):** ✓ Covered in §4.3, Table 2\n- **Classifier\
    \ PoC (plan_008):** ✓ Covered in Appendix B\n- **Judge calibration (plan_009):**\
    \ ✓ Covered in §4.5, Table 3\n- **Perturbation control (plan_010):** ✓ Covered\
    \ in §5.1, Table 5\n\nAll imagined experiments are represented. Coverage is complete\
    \ and the paper efficiently integrates 10+ experiments into a coherent narrative.\n\
    \n---\n\n## 5. Scores\n\n| Dimension | Score | Justification |\n|-----------|-------|---------------|\n\
    | **Soundness** | 3.5/5 | Strong experimental design (matched-pair + perturbation\
    \ control + cross-judge + ICC) is near state-of-the-art for this literature. Deductions\
    \ for: broken references preventing verification, weak C3 effect, uncorrected\
    \ multiple comparisons, partially addressed token-delta confound, unclear systematic-nocuity\
    \ methodology. |\n| **Excitement** | 3.5/5 | Novel intersection of RE ambiguity\
    \ theory and agent safety. The model×type interaction and Ambiguity Blindness\
    \ are genuinely new findings with practical implications. Deductions for: narrow\
    \ domain scope (2 domains), synthetic-only stimuli, and the framing sometimes\
    \ overselling (e.g., \"strongest causal evidence in the agent safety literature\"\
    \ cannot be verified with broken refs). |\n| **Reproducibility** | 3/5 | Experimental\
    \ design is well-documented. ICC study demonstrates inherent reproducibility of\
    \ the phenomenon. However: clause pairs not released or described individually;\
    \ τ²-bench dependency; judge prompts not provided; failure-mode coding scheme\
    \ not fully specified; no code/data availability statement. |\n\n---\n\n## 6.\
    \ Overall Assessment\n\n**Score: 3.0 — Findings**\n\nThis paper addresses an important\
    \ and underexplored question at the intersection of requirements engineering,\
    \ NLP, and AI safety. The experimental design is exceptionally thorough — the\
    \ combination of matched-pair design, perturbation control, cross-judge evaluation,\
    \ human calibration, test-retest reliability, and realism validation sets a methodological\
    \ standard for the agent safety literature. The model×type interaction (C4) and\
    \ Ambiguity Blindness findings are genuinely novel and actionable.\n\nHowever,\
    \ the submission in its current form has three critical formatting/completeness\
    \ issues that individually approach desk-reject severity: (1) all references are\
    \ broken, (2) no Responsible NLP Research Checklist, and (3) no standalone Limitations\
    \ section. These must be fixed before any resubmission.\n\nSubstantively, the\
    \ C3 layer effect (the theoretical linchpin of the Disambiguation Channel Framework\
    \ from the violation-rate side) is weak (V=0.062) and fragile under multiple-comparison\
    \ correction. The paper is honest about this but still gives it prominent billing.\
    \ The narrow domain scope (2 customer-service domains) limits the generalizability\
    \ of claims made at a high level of abstraction (\"LLM agents\"). The uncorrected\
    \ multiple comparisons across numerous statistical tests are a concern.\n\n**If\
    \ the critical formatting issues are resolved**, this would be a competitive Findings\
    \ paper with potential for Conference depending on how the authors address the\
    \ C3 weakness and domain-scope limitations. The core contribution — demonstrating\
    \ that ambiguity type and model interact to produce differential safety profiles\
    \ — is solid and practically important.\n\n---\n\n## 7. Questions for Authors\n\
    \n1. If authorization-scope is removed from the spec-layer, does the C3 layer\
    \ effect survive? What is the spec-vs-ling gap for the remaining four types?\n\
    2. How exactly is \"systematic nocuity\" (27%) operationalized? What is the convergence\
    \ criterion across models?\n3. Have you considered FDR correction across the multiple\
    \ χ² and TOST tests? Which results survive?\n4. The perturbation control uses\
    \ only unambiguous clauses. Have you considered perturbing ambiguous clauses as\
    \ well, to test whether the ambiguity effect is robust to surface variation in\
    \ the other direction?\n5. Can you release the 300 clause pairs and judge prompts\
    \ for reproducibility?\n\n---\n\n## 8. Recommendations for Revision\n\n1. **[Blocking]\
    \ Fix all references.** Populate the bibliography — this is non-negotiable.\n\
    2. **[Blocking] Add Responsible NLP Research Checklist (Sections A–E).**\n3. **[Blocking]\
    \ Create a standalone Limitations section** (separate from Discussion, clearly\
    \ labeled).\n4. **[High priority] Apply multiple-comparison correction** (at minimum\
    \ FDR) and report adjusted p-values alongside nominal ones. Downgrade any claims\
    \ that do not survive.\n5. **[High priority] Honestly scope C3.** Either demonstrate\
    \ robustness after removing auth-scope from the layer calculation, or reframe\
    \ the layer effect as suggestive/exploratory rather than confirmatory. The ICC\
    \ and failure-mode evidence for the Disambiguation Channel Framework can stand\
    \ independently.\n6. **[Medium] Clarify systematic-nocuity methodology** — define\
    \ convergence criterion, explain coding procedure.\n7. **[Medium] Add data/code\
    \ availability statement.** Release clause pairs, judge prompts, and analysis\
    \ scripts.\n8. **[Low] Soften title/abstract generalizability language** to reflect\
    \ the two-domain scope, or add a third domain.\n9. **[Low] Clean up §5.4 section\
    \ header** — remove \"Star Finding\" editorializing.\n"

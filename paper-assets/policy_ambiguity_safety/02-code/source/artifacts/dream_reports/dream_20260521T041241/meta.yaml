      narrative_direction: Differential Nocuity 框架完全成立。三层叙事：(1) policy ambiguity universally
        nocuous for LLM agents，causal evidence 最强（matched-pair + perturbation control
        PASS）；(2) type hierarchy + model×type interaction 揭示 safety training 的 selective
        mitigation 机制，auth_scope 是 canary type；(3) Ambiguity Blindness + Systematic
        Nocuity 扩展 Berry & Kamsties 理论。C3 within-judge 显著性让 layer effect 从 'suggestive'
        升级为 confirmed，Disambiguation Channel Framework 获得更强支撑。所有 claims 原始强度发表，无需降级。EMNLP
        accept 概率最高。

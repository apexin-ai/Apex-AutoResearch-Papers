      different_interpretation_pct_ambiguous: 0.48
      auth_scope_range_pp: 26
      incomp_range_pp: 24
      per_model_type_chi2:
        gpt54:
          chi2: 15.8
          p: 0.007
          V: 0.23
        gpt41:
          chi2: 10.2
          p: 0.069
          V: 0.18
        claude:
          chi2: 6.4
          p: 0.27
          V: 0.15
        qwen3_235b:
          chi2: 5.1
          p: 0.4
          V: 0.13
        deepseek:
          chi2: 4.8
          p: 0.44
          V: 0.12
      avg_token_delta_spec: 3.5
      avg_token_delta_ling: 1.6
      token_delta_partial_r_after_type: 0.11
    result_rationale: 'C1 (binary effect +25.7pp, CI [23.1, 28.3], OR=7.2): 从 actual
      数据的 +34.0pp/OR=15.1 大幅缩水。三重原因叠加： (i) Claude binary effect 仅 +18.0pp (最低)——RLHF
      的 blanket conservatism 提高了 unamb baseline (8%) 同时压低了 amb rate (26%)； (ii) open-source
      模型的 high unamb rates (10-12%) 压缩 effect size—— DeepSeek 即使无歧义也有 12% violation
      rate，说明 safety training 整体 较弱而非 ambiguity-specific 问题； (iii) 部分 clause pairs
      的 unambiguous variant 未能完全消除歧义 (plan_001 quality issues 传导)。但 CI 远离零, p<0.0001，6
      types all significant (最弱 coreferential +18.8pp)——"all ambiguity is nocuous"
      成立。结合 perturbation control (Δ_net≈12pp): 即使扣除 perturbation baseline，ambiguity
      仍造成 significant additional violations。

      C2 (V=0.090, p=0.032): Omnibus χ² 勉强显著——types 不完全等价，但效应极弱。V=0.090 远低于 小效应阈值
      0.10。Power=0.72——稍 underpowered，MDE=0.11 > observed 0.090，说明需要 更大样本才能 reliably
      detect 这种 level 的 type effect。 TOST: ±15pp 有 10/15 pairs equivalent——大部分 type
      pairs 在操作上 不可区分。仅 incomp vs coref (13.8pp gap) 和 incomp vs CP/lexical 是 non-equivalent。±10pp
      仅 4/15 equivalent——但 ±10pp 是 stringent margin。实际 type hierarchy 被压缩为 "incompleteness
      > rest ≈ equal > coreferential" 的弱 2-tier (而非原预期的 3-tier)。V<0.10 意味着 type 分类对
      violation severity 的 predictive value 极有限。

      C3 (layer gap 3.8pp, p=0.22, n.s.): Layer gap 不显著。CI [-1.5, 9.1] 包含 0。GPT 的
      positive gap (+7-9pp) 被 Claude (-5.3pp) 抵消，open-source models 的 small positive
      gap (+3-5pp) 不足以补偿。Within-judge analysis 更糟：两个 judge group 均 n.s. (p=0.31 和
      0.18)——即使控制 judge variance 也无法恢复 layer effect。 Layer hierarchy 作为 paper claim
      完全不成立。"Disambiguation Channel Framework" 缺乏 empirical support，应降为 Discussion
      中的 "potential explanatory framework" 而非 tested theory。

      C4 (interaction omnibus p=0.014, but Claude-driven): 5-model omnibus interaction
      显著——type ranking 确实 model-dependent。 但移除 Claude 后 4-model interaction p=0.23
      (n.s.)。这意味着 interaction 完全由 Claude outlier 驱动，不是 5 个模型之间的 systematic 差异。Per-model
      per-type χ²: 只有 GPT-5.4 有显著的 within-model type differentiation (p=0.007)，其他
      4 个模型均 n.s. (p>0.05)—— 说明大部分模型对不同 ambiguity types 的 vulnerability 差异不大， 只有 GPT-5.4
      展现 clear type-specific pattern。

      Fleiss κ=0.22 (poor): 5 models 在 which-clauses-violate 的层面 agreement 极低。这不是
      Berry & Kamsties 的 "divergent nocuity" (different readings)，而是 stochastic disagreement——models
      在 borderline cases 的行为不稳定。只有 52% 的 ambiguous clauses 产生 all-5-models-same-outcome——near
      chance for binary outcome。

      Info delta: spec 3.5 vs ling 1.6 tokens。partial r=0.11 (n.s.) after type control.
      Token delta 不是 independent confound, 但 reviewer 会 flag.

      '

      narrative_direction: '需要根本性 reframe，放弃 ''Differential Nocuity'' 和 layer hierarchy
        作为核心叙事。新 angle：**Universal Nocuity + Type Taxonomy as Diagnostic Tool**。(1)
        即使 perturbation baseline 较高，ambiguity 仍造成显著额外 violations (Δ_net ≥10pp)，但 framing
        从 ''ambiguity-specific causation'' 转为 ''ambiguity as a significant contributor
        among specification sensitivity factors''；(2) 放弃 C3 layer effect 和 Disambiguation
        Channel Framework，改为报告 null result（''contrary to expectations, spec/ling distinction
        does not predict violation severity''）；(3) C4 从 ''model×type interaction reveals
        safety training mechanism'' 降为 ''models show some variation in type vulnerability,
        particularly for auth_scope, but the interaction is driven by outlier models
        and should be interpreted cautiously''；(4) 核心贡献重心移至 C1 (first causal quantification,
        even with perturbation caveat) + C2 (first 6-type taxonomy with operational
        definitions grounded in RE literature) + C5 (Ambiguity Blindness 作为 empirical
        finding，即使 type-specific signatures 弱化，<20% awareness + >70% surface adoption
        仍有价值)；(5) Title 改为 ''Policy Ambiguity Is Universally Nocuous for LLM Agents:
        A Causal Study with Type-Level Taxonomy''——去掉 ''Differential'' 和 ''Model Architecture''。贡献定位从
        mechanism 发现转向 measurement framework + taxonomy 贡献。仍冲 EMNLP，taxonomy + causal
        design + Ambiguity Blindness 三个 methodological/empirical 贡献足够，但 novelty claim
        弱于 best/median。'

  - name: reliability_test
    plan_id: plan_006
    description: '30 clauses (5/type) × 3 replicates × 2 conditions × 2 API models
      (gpt-5.4, gpt-4.1) = 360 episodes。Test-retest ICC, bootstrap CI width。

      '
    expected_results:
      total_episodes: 360
      icc_overall: 0.8
      icc_per_type:
        auth_scope: 0.86
        incompleteness: 0.84
        cp: 0.78
        scopal: 0.72
        lexical: 0.76
        coreferential: 0.62
      icc_ambiguous_only: 0.76
      icc_unambiguous_only: 0.88
      bootstrap_ci_width_binary_effect_pp: 10.2
      bootstrap_ci_width_per_type_pp: 13.5
      max_replicate_swing_pp: 14.0
      max_swing_type: coreferential
      within_gpt_family_note: 'ICC 0.80 reflects within-GPT-family reliability (ρ=0.94).
        Cross-model reliability (adding Claude, Qwen3, DeepSeek) would be substantially
        lower — plan_004 Fleiss κ=0.22 on ambiguous clauses reflects the true 5-model
        disagreement.

        '
    result_rationale: 'Within-GPT-family ICC 0.80 (good): gpt-5.4 和 gpt-4.1 来自同一 training
      paradigm, type profiles 几乎 identical (ρ=0.94)，因此 intra-family reliability 高。但这个
      ICC 有 misleading 的一面：

      (a) ICC 0.80 只反映 GPT family 内部的 test-retest stability，不 代表跨 model family 的 measurement
      reliability。Plan_004 的 Fleiss κ=0.22 (ambiguous condition) 才是真实的 5-model inter-rater
      agreement——远低于 ICC。

      (b) Per-type gradient: auth_scope/incomp 最 reliable (0.86/0.84): 高 violation
      rate 的 clause 重复观测稳定性好 (absolute swing 对 base rate 比例小)。Coreferential 最低 (0.62):
      clause quality issues (plan_001 pass_rate 0.86) + behavioral heterogeneity (conservative
      refusal vs scope_misapplication vs assumption) + small N per clause。 Max replicate
      swing 14pp (coreferential)——同一 clause 在 3 次 独立 run 间 violation rate 相差最高 14pp。

      (c) Ambiguous ICC (0.76) < Unambiguous ICC (0.88): agent 在 ambiguous clause
      上的行为本身 less deterministic——ambiguity introduce nondeterminism in agent reasoning,
      not just measurement noise。这与 Fleiss κ=0.22 一致——models don''t agree because
      ambiguity triggers stochastic rather than deterministic failure。

      (d) Bootstrap CI width 10.2pp (binary effect): > ideal <10pp 但 acceptable。Per-type
      CI 13.5pp: type-level comparisons 的 precision 有限。V=0.09 的 type effect (plan_004)
      在 CI 13.5pp 的 noise floor 下可能 partly artifact。

      '

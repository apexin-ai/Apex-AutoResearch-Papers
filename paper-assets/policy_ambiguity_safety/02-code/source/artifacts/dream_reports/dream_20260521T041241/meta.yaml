    analysis: 'Plan_006 暴露了 worst tier 的 measurement paradox: within-GPT ICC decent
      (0.80) 但 cross-model κ poor (0.22)。Reviewer 会问："if your own reliability test
      shows good ICC, why is cross-model agreement so low?" 答案是 ICC 测的是 test-retest
      stability (same model, same clause, different runs), κ 测的是 inter-model agreement
      (different models, same clause, same run)——ambiguity triggers model-specific
      strategies, each consistent within-model but divergent between-models。这进一步支撑
      "binary universal + type-specific model-dependent" 的 worst-tier narrative。


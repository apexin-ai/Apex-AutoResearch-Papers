      - C4 model×type interaction 中 auth_scope 跨模型极差 ≥40pp，incompleteness 保持 universally
        high (≥45%)
      - plan_010 perturbation control 判定 PASS (Δ_perturb <5pp, CI 含 0)
      - plan_009 judge calibration 人类标注 κ≥0.80，judge F1≥0.85
      - C5 error analysis failure mode signatures 在 5 model 扩展后仍保持 type-specific 一致性

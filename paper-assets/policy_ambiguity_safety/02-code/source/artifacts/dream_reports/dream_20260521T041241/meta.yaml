    analysis: 'Plan_004 定义了 worst tier 的核心 statistical reality： (1) C1 survives: +25.7pp
      虽弱于 actual +34pp，仍是 massive effect， per-type 全显著。即使加 perturbation caveat (Δ_net≈12pp)，仍是
      文献中唯一的 matched-pair causal quantification。 (2) C2 勉强显著但 V=0.09 near noise-floor：type
      分类的 predictive value 极有限。Reframe 为 "taxonomy as diagnostic vocabulary" (帮助描述
      failure) 而非 "taxonomy as severity predictor"。 (3) C3 完全不成立：layer gap n.s., within-judge
      也 n.s.。放弃。 (4) C4 Claude-driven：不能声称 "model × type interaction reveals safety
      training mechanisms"，只能说 "one model (Claude) shows a distinct profile, possibly
      reflecting Anthropic''s RLHF approach"。 单一模型的观察不构成 mechanism finding。

      '
  - name: error_analysis
    plan_id: plan_005
    description: '从 5-model full study 中采样 violation traces。50 traces/type × 6 types
      = 300 total (跨 5 models)。Failure mode 分类、layer mechanism 检验、ambiguity blindness
      量化。

      '
    expected_results:
      total_traces_sampled: 300
      failure_modes_pooled:
        assumption_based_action: 35%
        scope_misapplication: 22%
        conservative_refusal: 14%
        unauthorized_escalation: 13%
        arbitrary_rule_selection: 10%
        other: 6%
      type_specific_clear_signatures: 3
      clear_signature_types:
      - incompleteness → assumption_based_action (58-65% across models)
      - scopal → scope_misapplication (60-72% across models)
      - auth_scope → unauthorized_escalation (50-75% for GPT/Qwen/DeepSeek, but only
        15% for Claude)
      weak_signature_types:
      - 'lexical: assumption_based 40-55% but overlaps heavily with incompleteness
        signature'
      - 'coreferential: flat distribution, no dominant mode (scope_misapplication
        28%, assumption 26%, conservative_refusal 22%)'
      - 'CP: arbitrary_rule_selection 30-40% but not dominant enough to be signature
        (assumption_based 25-35%)'
      cross_model_dominant_mode_agreement: 3/6 types (incomp, scopal, auth_scope for
        4/5 models)
      failure_mode_layer_match_pct: 45
      explicit_ambiguity_mention_pct: 14
      implicit_deliberation_pct: 22
      surface_adoption_pct: 78
      awareness_by_model:
        gpt54: 18
        gpt41: 16
        claude: 12
        qwen3_235b: 10
        deepseek: 8
      surface_adoption_by_model:
        gpt54: 70
        gpt41: 72
        claude: 76
        qwen3_235b: 80
        deepseek: 85
      auth_scope_claude_refusal_vs_violation: 'Claude auth_scope traces: 55% conservative_refusal,
        30% cautious_proceed, 15% unauthorized_escalation — fundamentally different
        failure mode distribution than other models

        '
    result_rationale: '5-model 扩展后 type-specific failure signatures 部分 dissolve：

      (a) Clear signatures 仅 3/6 types：incompleteness (assumption_based dominant across
      all 5 models), scopal (scope_misapplication dominant across all 5), auth_scope
      (unauthorized_escalation dominant for 4/5 models — but Claude''s 55% conservative_refusal
      使其成为 exception)。 这三个 type 的 signature 是 robust 的，可以在 paper 中 report。

      (b) Weak/dissolved signatures 3/6 types：lexical 与 incompleteness 共享 assumption_based
      mode (40-55%) 但无法区分——两者的 failure mechanism 在 5-model pooled data 中 indistinguishable。这削弱了
      taxonomy 的 diagnostic value (如果两个 type 产生相同 failure mode, 区分它们的 operational
      value 何在？)。Coreferential 展现 flat distribution (无 dominant mode)——反映该 type 的高
      behavioral heterogeneity (Claude refusal 22%, GPT scope_misapplication 28%,
      DeepSeek assumption_based 30%)。CP 的 arbitrary_rule_selection (30-40%) 有 moderate
      consistency 但不足以构成 "signature"。

      (c) Cross-model dominant mode agreement 仅 3/6 types：5 models 在 failure mode
      的 agreement 比 violation rate 的 agreement 更差。 原因是 different models 面对同一 ambiguity
      采取不同 failure strategy ——Claude refuse, GPT guess, DeepSeek surface-adopt——即使最终
      violation rate 相似，failure mechanism 也不同。

      (d) Ambiguity Blindness: awareness 14% (range 8-18%)，surface adoption 78% (range
      70-85%)。比 actual 数据的 <5-11% awareness 略高——5-model expansion 中 GPT-5.4 显示 18%
      explicit mention (较高)，但 DeepSeek 仅 8% (极低)。Overall blindness 仍是 universal phenomenon——≥78%
      的 traces 中 agent 直接采用 surface interpretation without any deliberation。但 18%
      → 8% 的 model gradient 说明 awareness 与 model capability 有弱正相关——更大 更强的模型有 slightly
      more meta-cognitive awareness，但仍远 不足以改变 outcome (aware 的 traces 中仍有 60%+ violation)。

      (e) Claude auth_scope 的 refusal-dominant pattern (55%) 说明 Claude 的低 auth_scope
      rate (16%) 不是 "更安全" 而是 "用 refusal 替代 violation"——这种 conservative 策略在 unambiguous
      条件下也产生 8% false refusal rate, 是 over-conservative behavior 而非 genuine ambiguity
      awareness。

      '

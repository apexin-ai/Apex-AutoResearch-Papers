      - C1 binary effect 在 5 model 上全部显著 (p<0.0001)，效应量 ≥30pp
      - C2 type hierarchy omnibus χ² 显著 (p<0.001)，3-tier 结构稳定，incompleteness 与 coreferential
        差距 ≥15pp

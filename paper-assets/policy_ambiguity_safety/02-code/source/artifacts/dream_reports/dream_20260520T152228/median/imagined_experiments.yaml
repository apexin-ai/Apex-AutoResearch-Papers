    \ parsing（DeBERTa 可以做但 fine-tuning data 太少——50 pairs/type）。\nCross-type transfer\
    \ F1=0.65（训练 5 types，test held-out 1 type）偏低，说明 type-specific \nfeatures dominate——binary\
    \ classifier 学到的更多是 \"这种 type 的 ambiguity 长什么样\" 而非 \n\"ambiguity per se\"。这是\

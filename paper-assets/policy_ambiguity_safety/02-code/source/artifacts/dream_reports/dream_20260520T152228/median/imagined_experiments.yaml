  analysis: "Plan_004 的核心统计结果支持 median 档叙事：(1) C1 binary effect 无争议（Δ=31.9pp, CI 远离\
    \ 0），\n但 magnitude 低于 2-model pilot 的 36.5pp。(2) C2 type hierarchy V=0.17 significant\
    \ 但非 large \neffect，4/15 pairs equivalent at ±15pp 说明层内 types 可互换但层间不可。(3) C3\
    \ layer gap 12.1pp \nsignificant 但 CI lower bound 仅 6.8pp——paper 必须用 \"substantial\"\
    \ 而非 \"nearly twice\"。\n(4) C4 interaction p=0.062 是最大叙事 challenge：universal hierarchy\
    \ 不能 cleanly claim，\n需报告为 \"robust across frontier models, attenuated in smaller\
    \ open-source models\"。\nPower analysis 确认 C2 和 C3 都 well-powered（observed > MDE），排除\
    \ \"underpowered null\" concern。\nInformation delta 非 significant covariate，排除\
    \ token-length confound。\nBerry & Kamsties 补充分析是 EMNLP 的 CL contribution：42% clauses\
    \ 展示 divergent interpretation \n= true nocuity，但 38% systematic bias 说明 nocuity\
    \ 不完全匹配 B&K 原始定义——需 extend \ntheory to include \"convergent-but-wrong\" as a distinct\
    \ nocuity mode for LLM agents。\n"
- name: error_analysis
  plan_id: plan_005
  description: 50 violation traces/type × 6 types = 300 traces 的定性 failure mode 分析
  expected_results:
    total_traces_analyzed: 300
    failure_mode_categories: 6
    assumption_based_action_overall_pct: 38
    scope_misapplication_overall_pct: 18
    reference_confusion_overall_pct: 14
    arbitrary_rule_selection_overall_pct: 15
    surface_adoption_overall_pct: 10
    conservative_but_wrong_overall_pct: 5
    spec_layer_assumption_based_pct: 62
    ling_layer_assumption_based_pct: 35
    spec_layer_scope_misapplication_pct: 8
    ling_layer_scope_misapplication_pct: 32
    failure_mode_layer_match_pct: 62
    failure_mode_cross_layer_overlap_pct: 38
    coreferential_avoidance_behavior_pct: 28
    coreferential_reference_confusion_pct: 45
    coreferential_mixed_pct: 27
    auth_scope_unauthorized_escalation_pct: 71
    auth_scope_permission_assumption_pct: 22
    traces_with_tool_response_partial_disambiguation: 23
    traces_tool_disambig_by_layer_ling_pct: 34
    traces_tool_disambig_by_layer_spec_pct: 8
  result_rationale: "Median 档的 error analysis 找到 predominant patterns 但非 clean dichotomy。Spec-layer\
    \ \n以 assumption-based action 为主（62%）：agent 面对 underspecified permission boundary\
    \ 或 \nmissing condition 时，选择一个\"合理\"假设并执行——没有 external signal 可以纠正。但 35% 的 \n\
    ling violations 也表现 assumption-based action，因为部分 linguistic ambiguity（特别是 lexical\
    \ \npolysemy）agent 同样无法获得消歧线索。这 35% overlap 是 median 档与 best 档的关键分野：\nbest 档预期\
    \ clean 分离，median 档承认 \"predominant with overlap\"。\nLing-layer 的 scope misapplication（32%）是预期的\
    \ distinctive mode：agent 取错了 quantifier \n或 negation 的 scope，产生 \"good-enough\"\
    \ 但错误的解读。Spec-layer 仅 8% scope misapplication \n因为 spec ambiguity 本质不是 scope 问题。\n\
    Coreferential 的 avoidance behavior（28%）存在但不如预期 clean——45% 是 reference confusion\n\
    （agent 绑定了错误的 entity），27% 混合（avoidance + confusion in same trace）。28% avoidance\
    \ \nrate 支持 disambiguation channel hypothesis 但不足以作为 standalone claim——paper 中应\
    \ \npresent as \"suggestive evidence\" 而非 confirmed mechanism。\nAuth_scope 的 unauthorized\
    \ escalation（71%）是最 distinctive failure mode：agent 假设自己 \n拥有 ambiguous permission\
    \ boundary 的最宽解读，执行超权限操作。这是 EMNLP 的 strongest \nqualitative finding——直接连接 ambiguity\
    \ → safety violation 的 causal pathway。\nTool response 部分消歧（23% traces）在 ling-layer\
    \ 更常见（34% vs spec 8%），部分支持 \ndisambiguation channel hypothesis——ling ambiguity\
    \ 有 external resolution channel，但 \n成功率不高（34% 尝试中的约半数实际 resolve）。\n"
  tables:
  - title: Failure Mode × Type Distribution (% of violations per type)
    content: '| Failure Mode | auth_scope | incomp | CP | scopal | lexical | coref
      | Overall |

      |-------------|-----------|--------|-----|--------|---------|-------|---------|

      | Assumption-based action | 71 | 58 | 42 | 28 | 32 | 18 | 38 |

      | Scope misapplication | 2 | 4 | 18 | 38 | 22 | 8 | 18 |

      | Reference confusion | 0 | 2 | 5 | 4 | 18 | 45 | 14 |

      | Arbitrary rule selection | 15 | 20 | 22 | 14 | 10 | 2 | 15 |

      | Surface adoption | 4 | 8 | 8 | 12 | 14 | 0 | 10 |

      | Conservative-but-wrong | 8 | 8 | 5 | 4 | 4 | 27 | 5 |

      '
  - title: Layer-Level Failure Mode Aggregation
    content: '| Failure Mode | Spec-Layer | Ling-Layer | Δ | Layer Match? |

      |-------------|-----------|-----------|---|-------------|

      | Assumption-based action | 62% | 35% | +27pp | Spec-dominant ✓ |

      | Scope misapplication | 8% | 32% | −24pp | Ling-dominant ✓ |

      | Reference confusion | 2% | 23% | −21pp | Ling-dominant ✓ |

      | Arbitrary rule selection | 18% | 9% | +9pp | Weak spec lean |

      | Surface adoption | 7% | 10% | −3pp | No clear lean |

      | Conservative-but-wrong | 7% | 12% | −5pp | Weak ling lean |

      '
  - title: Coreferential Avoidance Behavior Detail
    content: '| Behavior Pattern | % of coref violations | Example |

      |-----------------|----------------------|---------|

      | Pure avoidance (refuses to act on ambiguous entity) | 12% | Agent asks for
      clarification but still must act; defaults to wrong entity |

      | Cautious + wrong (picks safer interpretation, still wrong) | 16% | Agent applies
      clause to less-risky entity, but policy meant the other |

      | Reference confusion (no awareness of ambiguity) | 45% | Agent binds RC to
      nearest NP without considering alternative |

      | Mixed (partial awareness + confusion) | 27% | Agent shows momentary uncertainty
      in trace but commits to wrong parse |

      '
  figures_description:
  - 'Figure 5 (paper): Sankey/alluvial diagram — left column: 6 ambiguity types, right
    column: 6 failure modes. Flow width = proportion. Visually shows assumption-based
    action flowing mainly from spec-layer, scope misapplication from ling-layer, with
    cross-layer overlap flows visible but thinner.'
  - 'Figure 6 (paper): Annotated trace pair — (a) auth_scope violation: agent encounters
    ''authorized personnel may process refunds'', assumes widest permission, processes
    unauthorized refund; (b) scopal violation: agent encounters ''all items excluding
    premium and sale categories'', misparses scope of ''excluding'', applies exclusion
    only to ''sale''. Side-by-side demonstrates spec (guessing) vs ling (misparse)
    distinction.'
  analysis: "Error analysis 是 EMNLP 的核心 CL contribution。主要 findings：\n(1) Spec-layer\
    \ 的 dominant failure mode 是 \"assumption-based action\"——agent 填充 specification\
    \ \ngap 时没有 meta-cognitive awareness that it's guessing。这直接解释为什么 spec-layer 更危险：\n\
    无 external correction signal + 无 internal uncertainty signal = confident wrong\
    \ action。\n(2) Ling-layer 更多 \"scope misapplication\" 和 \"reference confusion\"\
    ——这些是 parsing failures，\nnot knowledge gaps。部分可以被 tool response 修正（34% ling traces\
    \ 显示 partial disambiguation），\n这就是为什么 ling-layer rate 更低。\n(3) 但 38% overlap 不容忽视：assumption-based\
    \ action 在 ling-layer 也占 35%（特别是 lexical），\n说明 failure mode 不是 one-to-one map\
    \ to layer。Paper 需用 \"predominant patterns\" 而非 \n\"distinct mechanisms\"。\n(4)\
    \ Coreferential avoidance (28%) 支持但不 confirm disambiguation channel hypothesis——\n\
    paper 中报告为 suggestive，留 detailed channel analysis 给 future work。\n(5) Auth_scope\
    \ 的 unauthorized escalation (71%) 是 practical 最重要发现：policy 中的 \npermission boundary\
    \ ambiguity 直接导致 agent 越权——安全审计应优先检查此类。\n"
- name: reliability_test
  plan_id: plan_006
  description: 'Test-retest: 30 clauses (5/type) × 3 replicates × 2 conditions × 5
    models = 900 episodes'
  expected_results:
    total_episodes: 900
    icc_overall: 0.72
    icc_per_type_auth_scope: 0.82
    icc_per_type_incompleteness: 0.78
    icc_per_type_CP: 0.74
    icc_per_type_scopal: 0.66
    icc_per_type_lexical: 0.7
    icc_per_type_coreferential: 0.65
    mean_bootstrap_CI_width_pp: 9.4
    max_bootstrap_CI_width_pp: 12.8
    max_CI_width_type: scopal
    per_clause_max_range_across_replicates_pp: 18
    per_clause_mean_range_pp: 8.2
    types_with_CI_width_gt_10pp: 2
  result_rationale: "Overall ICC=0.72（moderate-good）反映 API sampling noise 的 reality：LLM\
    \ 输出具有 inherent \nstochasticity，同一 clause 在不同 run 中 violation rate 波动 ±8-9pp 是\
    \ expected。\nAuth_scope ICC 最高（0.82）因为其 violation 模式最 deterministic——permission\
    \ boundary \nambiguity 要么触发 unauthorized action 要么不触发，较少 borderline cases。\nScopal\
    \ (0.66) 和 coreferential (0.65) ICC 最低，分别因为：scopal 的 scope interpretation \n高度依赖\
    \ sampling（同一 agent 不同 run 可能取不同 scope parse），coreferential 的 entity \nbinding\
    \ 在 borderline cases 中 unstable。\nCI width 9.4pp mean、12.8pp max 意味着 per-type\
    \ comparisons 需要 N≥50/type 才能 reliable \n区分 types——300 clauses (50/type) × 5 models\
    \ 给出 250/type，足够。但 individual clause \nlevel 的 reliability 不够支持 per-clause claims。\n\
    关键 takeaway for paper：report all findings at type-level (N=250) 而非 clause-level，\n\
    并在 Method 中 disclose test-retest band 作为 measurement noise floor。\n"
  tables:
  - title: Per-Type Reliability Metrics
    content: '| Type | ICC(3,1) | Mean CI Width | Max Replicate Range | Rating |

      |------|----------|---------------|---------------------|--------|

      | auth_scope | 0.82 | 7.2pp | 12pp | Good |

      | incompleteness | 0.78 | 8.0pp | 14pp | Good |

      | CP | 0.74 | 9.4pp | 16pp | Moderate-Good |

      | scopal | 0.66 | 12.0pp | 18pp | Moderate |

      | lexical | 0.70 | 10.2pp | 15pp | Moderate |

      | coreferential | 0.65 | 12.8pp | 18pp | Moderate |

      | **Overall** | **0.72** | **9.4pp** | **18pp** | **Moderate-Good** |

      '
  figures_description:
  - 'Supplementary: Per-type ICC with 95% CI error bars. Horizontal dashed lines at
    0.60 (moderate) and 0.75 (good). Auth_scope and incompleteness above good threshold;
    scopal and coreferential in moderate zone.'
  analysis: "Reliability 结果对 paper 的主要 implication：(1) type-level findings（N=250/type）robust，\n\
    因为 noise 在 averaging 中被抵消。(2) 但 individual clause comparisons 不 reliable（±18pp\
    \ max），\n所以 paper 不应 cherry-pick individual clauses 作为 evidence。(3) Scopal 的低\
    \ ICC (0.66) \nexplains 为什么 MVP→full study 中 scopal 波动最大（51.7% → 43.3% → 40%）——这是\
    \ measurement \nnoise 而非 real effect change。(4) Method section 应报告 \"measurement\
    \ noise floor ≈ ±9pp \nfor type-level estimates, ±13pp for individual clauses\"\
    \ 并 caveat accordingly。\n仍 well within publishable range——ICC 0.65-0.82 per type\
    \ 在 NLP evaluation 中属 moderate-good。\n"

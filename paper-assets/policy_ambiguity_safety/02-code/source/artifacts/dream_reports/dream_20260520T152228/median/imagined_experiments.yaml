tier: median
narrative_guidance: '核心 differential nocuity 故事存活但需 hedging。plan_002 的 ~19pp layer
  gap 在 5-model pooled 分析中缩至 ~12pp，

  主因 open-source 模型（Qwen3-8B 尤甚）baseline violation rate 更高，压缩相对差异。

  ''nearly twice as dangerous'' 需降为 ''substantially higher''（Spec Δ≈38pp vs Ling Δ≈26pp，比例
  ~1.47x）。

  C3 layer effect 报告 CI [6.8, 17.4]pp 并承认 CP/scopal 为 convergence zone（CP 28.0pp spec-layer
  最低，scopal 32.2pp ling-layer 最高，交叉层级边界）。

  Discussion 增加 model capability 作为 moderator：frontier 模型层级清晰（gap 14-15pp），Qwen3-8B
  gap 仅 ~4pp 且 scopal>CP 反转层内排序。

  Error analysis 从 ''clean dichotomy'' 改为 ''predominant patterns with overlap''——spec-layer
  以 assumption-based action 为主（62%）但 35% 的 ling 失败也表现此模式。

  Judge calibration 进 limitations：lexical F1=0.72、coreferential F1=0.71 低于 0.75 阈值，两个
  type 的 violation 边界模糊影响判定一致性。

  标题: ''Differential Nocuity: How Ambiguity Type Predicts Safety Violation Severity
  in LLM Agent Policies''。

  Model×type interaction borderline (p≈0.062) 表明层级效应 mostly universal 但非 clean——讨论
  Qwen3-8B 偏离归因于 higher baseline compresses relative Δ。

  仍 EMNLP-viable：5-model V=0.17 仍 significant (p<0.001)，binary Δ=32pp 远超 noise，叙事只需
  temper 而非 pivot。

  补充实验选项: (a) 增加 Qwen3-14B 看 open-source scaling trend, (b) coreferential 深入 error
  analysis 挽救 disambiguation channel story。

  '

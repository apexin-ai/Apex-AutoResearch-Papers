    (spec 40%, ling 36%)—— agent 的 failure mechanism 是 universal 的 "guess and act"
    而非 type-specific misparse。

    反直觉: scope_misapplication 在 ling-layer (26%) > spec-layer (18%)—— 因为 scopal/coreferential
    的 syntactic structure 确实触发更多 scope parsing error， 而 spec-layer 的 failure 更多是 "assume

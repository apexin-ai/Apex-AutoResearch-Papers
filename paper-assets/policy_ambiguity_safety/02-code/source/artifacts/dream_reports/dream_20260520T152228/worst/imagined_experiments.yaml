tier: worst
narrative_guidance: 'Layer hierarchy 无法作为 headline claim。5-model pooled layer gap
  仅 ~4pp (p=0.14, n.s.)， 被 model×type interaction (p=0.008) 瓦解——type ranking 因模型架构而异
  (GPT 系 spec>ling, Qwen3-8B 反转, Claude 混合)。Judge calibration 暴露 coreferential (F1=0.61)
  和 auth_scope (F1=0.68) 的 type-specific measurement bias， 进一步削弱 type-level claims。Error
  analysis failure mode 跨层重叠 42%，无 clean mechanism 区分。 首选 reframe: (C) "The Massive
  Binary Effect" 为 primary——+30pp 仍是文献最大因果效应 + perturbation control PASS (Δ=4.2pp,
  ratio=0.13)；(B) "Ambiguity Blindness" 为 §6 核心—— 92% traces 中 agent 未识别歧义存在，universal
  across types and models。 C2 降级为 "Model-Dependent Vulnerability Profiles" (model×type
  interaction 从 nuisance 升级为 finding)； C3 layer claim 放弃。备选标题: "Policy Ambiguity Causes
  Catastrophic Safety Violations in LLM Agents: A Causal Study"。仍投 EMNLP——C1 (causal
  binary effect) + perturbation control + ambiguity blindness analysis = solid 3-contribution
  paper。

  '

- name: judge_calibration
  plan_id: plan_009
  description: '100 episodes stratified by type×model×condition, 2 human annotators,
    LLM judge 校准。 Worst tier: F1 < 0.75 for ≥2 types, type-specific bias 暴露。

    '
  expected_results:
    human_annotator_kappa: 0.82
    judge_overall_f1: 0.72
    judge_overall_precision: 0.78
    judge_overall_recall: 0.67
    judge_overall_kappa_vs_human: 0.63
    judge_f1_per_type:
      auth_scope: 0.68
      incompleteness: 0.76
      cp: 0.79
      scopal: 0.77
      lexical: 0.74
      coreferential: 0.61
    auth_scope_bias: 'under-detection: recall 0.56, precision 0.82 → misses subtle
      permission boundary crossings'
    coreferential_bias: 'over-detection: recall 0.64, precision 0.58 → flags legitimate
      info-gathering as violations'
    judge_f1_tier1_critical: 0.82
    judge_f1_tier2_moderate: 0.68
    judge_f1_tier3_minor: 0.55
    claude_judged_by_gpt54_f1: 0.75
    gpt54_judged_by_gpt41_f1: 0.69
    cross_judge_asymmetry_pp: 6
    auth_scope_corrected: +4-6pp (true rate likely ~47-49% not 42.8%)
    coreferential_corrected: -5-8pp (true rate likely ~27-30% not 34.8%)
    corrected_cramers_v_estimate: ~0.14 (still weak)
  result_rationale: 'Judge calibration 暴露 worst tier 最有破坏力的 measurement issue:

    Coreferential F1=0.61: LLM judge over-detect coreferential violations。 原因: agent
    在 RC attachment 歧义下采取的 "exploratory query" (查询哪个 entity 适用) 被 judge 误判为 "unauthorized
    action" (false positive)。 Judge 缺乏 human 的 pragmatic judgment——无法区分 "agent 在探索性确认"
    vs "agent 在违规操作"。 结果: coreferential reported rate (34.8%) 高估 ~5-8pp，真实 rate 可能
    ~27-30%。

    Auth_scope F1=0.68: judge under-detect auth_scope violations。 原因: auth_scope violation
    常表现为 "subtle permission boundary crossing"—— agent 在模糊授权范围内行动，不明显违规 (如: 给客户 10%
    折扣，policy 说 "reasonable discount" 但未定义 boundary)。Judge 倾向 "不确定则判 non-violation"
    → false negative。 结果: auth_scope reported rate (42.8%) 低估 ~4-6pp，真实 rate 可能 ~47-49%。

    两个 bias 方向相互作用——恰好压缩了 type 间差异: coreferential 高估 + auth_scope 低估 → 缩小 range →
    降低 V 值。 Bias-corrected V 估计 ~0.14 (vs observed 0.11)——仍 weak, 不改变 "type effect
    弱" 的结论， 但说明 raw V=0.11 有 measurement component。

    Cross-judge asymmetry 6pp: Claude 被 gpt-5.4 (最强 judge) 判定 F1=0.75， gpt-5.4 被 gpt-4.1
    (较弱 judge) 判定仅 F1=0.69。 弱 judge 对强 model traces 更难准确判定——Method 必须 disclose。

    Per-severity: tier-3 minor violations F1=0.55 (near random)—— judge 对 "subtle/minor"
    violations 几乎无法判定。 主要影响 severity-weighted analysis, binary violation/non-violation
    受影响较小。

    '

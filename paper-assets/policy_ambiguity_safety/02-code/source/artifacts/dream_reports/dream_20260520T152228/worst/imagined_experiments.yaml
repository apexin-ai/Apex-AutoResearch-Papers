    (a) Auth_scope 仅 28% (GPT-5.4 的一半): 8B 参数模型缺乏 pragmatic reasoning 能力， 无法 "推断"
    implicit permission boundary 并据此行动——不是因为保守 refuse (像 Claude)， 而是因为根本不理解 authorization
    的 pragmatic implication，倾向 ignore 或 default 行为。 低 auth_scope violation ≠ 安全，只是不同的
    failure mode (inaction vs wrong action)。

    (b) Coreferential 高达 45% (GPT-5.4 的 1.8 倍): 小模型更依赖 surface syntactic heuristics
    (如 left-attachment bias for RC)。GPT-5.4 能利用 tool response 做部分 disambiguation (Berry
    & Kamsties 的 "disambiguation channel")，Qwen3-8B 不具备此能力—— 对 linguistic-layer 反而更脆弱。


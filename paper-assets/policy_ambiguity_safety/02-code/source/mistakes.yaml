- id: M006
  date: '2026-05-23'
  category: experiment_design
  severity: high
  summary: Temperature pilot analysis used wrong violation threshold (any-violation
    instead of moderate+critical)
  root_cause: 'Director''s analysis script classified violations as `violation_level
    not in (''none'', ''negligible'')` which includes minor violations. The main experiment
    uses moderate+critical threshold (method.tex L20: "minor-only deviations excluded").
    Director didn''t cross-check the threshold definition before writing numbers into
    the paper.'
  prevention: 'When analyzing new experiment data, always verify the violation threshold
    matches the main experiment''s definition before reporting numbers. For this paper:
    moderate+critical only, `violation_level in (''moderate'', ''critical'')`. Add
    a comment or assertion in analysis scripts referencing the paper''s threshold
    definition.'
  status: active
  context: Wrote incorrect numbers into appendix.tex and limitations.tex (commit e910882).
    Reviewer caught the error. Corrected values are actually stronger (0.4pp gap vs
    2.8pp).
  fix: Recomputed with correct threshold, updated appendix.tex (6 numbers), limitations.tex
    (2 numbers), analysis_summary.json. Commit 3e5e047.
  commit_id: 3e5e047
- id: M007
  date: '2026-05-24'
  category: code_bug
  severity: high
  summary: 'Agent computed wrong excl-incompleteness convergent rate: 45.2% (113/250)
    instead of correct 37.2% (93/250), leading to +16.3pp excess instead of +8.3pp'
  root_cause: Agent's Poisson binomial computation script produced incorrect observed
    convergent count (113 vs correct 93). The per-type majority_plus_rates in analysis_systematic_nocuity.json
    clearly sum to 93/250 = 37.2%, but Agent reported 45.2%. Likely a bug in the exclusion
    logic (may have included incompleteness clauses or double-counted).
  prevention: When Agent computes derived statistics from existing data, Director
    must independently verify by cross-checking against source data (e.g., per-type
    counts in analysis JSON). Never trust computed numbers that don't match simple
    arithmetic from known source data. For critical numbers going into the paper,
    always run an independent verification computation before accepting.
  status: active
  context: R32 修复过程中，Agent 被要求计算排除 incompleteness 后的 convergent nocuity excess。正确答案是
    93/250 = 37.2% observed vs 28.9% baseline = +8.3pp。Agent 错误地报告了 113/250 = 45.2%，导致
    excess 为 +16.3pp。这个错误数字被写入 analysis.tex、discussion.tex 和 appendix.tex 三个位置。Director
    通过逐项加总 per-type majority_plus_rate 发现了这个错误。
  fix: Director 独立运行 Python 验证：从 analysis_systematic_nocuity.json 逐 type 加总确认 93/250
    = 37.2%，用 Poisson binomial 计算 baseline 28.9%，bootstrap 得到 95% CI [2.2, 14.3]。在
    analysis.tex、discussion.tex、appendix.tex 三处同步修正为 +8.3pp。

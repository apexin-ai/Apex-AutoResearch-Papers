    role: evidence
    result: success, sparse PPL 12.08
  - exp_id: mvp_kl_norm_v2_s123
    role: evidence
    result: success, sparse PPL 11.91
  - exp_id: mvp_kl_norm_v2_s456
    role: evidence
    result: success, sparse PPL 13.58
  - exp_id: mvp_bce_s42
    role: evidence
    result: success, sparse PPL 44.54
  - exp_id: mvp_bce_s123
    role: evidence
    result: success, sparse PPL 44.59
  - exp_id: mvp_bce_s456
    role: evidence
    result: success, sparse PPL 43.03

- id: D008
  date: 2026-05-15 18:32 UTC
  summary: BCE+Comp 和 SPON 均为 negative；Claim 1 极强确认，Claim 2 待 SPON seq2048 重试后决定
  rationale: 'BCE+comp s42: hard_mask 25.44 vs KL 9.19（2.8×差距），TEAL 44.54 vs 12.32（3.6×），且
    compensation 对 TEAL 部署路径完全无效（67.2M 参数零贡献）。SPON: 仅恢复 3.8% gap（9.22→9.10），但训练 seq_len=128
    vs eval seq_len=2048 是合理 confound。决定：(1) 用 seq_len=2048 重训 SPON 消除 confound，再决定
    Claim 2 去留；(2) 启动 plan_002 STE baseline 隔离 loss function vs relaxation method
    贡献；(3) Claim 1 已有压倒性证据。'
  related_experiments:
  - exp_id: bce_comp_staged_s42
    role: BCE+compensation ablation
    result: 'negative: hard_mask 25.44, TEAL 44.54, sparsity 0.551'
  - exp_id: spon_training
    role: SPON bias reproduction
    result: 'negative: 0.12 PPL improvement, confounded by seq_len 128'
  depends_on:
  - D007
- id: D009
  date: 2026-05-15 18:34 UTC
  summary: 'Claim 2 tentative reframe: "KL subsumes SPON" (Option A), pending seq_len=2048
    verification'
  rationale: 'SPON recovery only 3.8% (0.12 PPL on 9.22 base). KL gradient structure
    implicitly captures both average-case and per-input corrections, making static
    bias redundant. Before fully committing, run SPON with seq_len=2048 to eliminate
    training/eval mismatch confound. If still negative → confirmed. New Claim 2: "KL-trained
    predictor subsumes static correction, yielding maximally simple pipeline." This
    turns a negative into a strength — KL eliminates need for BOTH compensation AND
    static bias.'
  related_experiments:
  - exp_id: spon_training
    role: primary_evidence
    result: 'negative: 3.8% recovery only'
  - exp_id: bce_comp_staged_s42
    role: supporting
    result: 'negative: BCE+comp still 2.8x worse than KL'
  depends_on: []
- id: D010
  date: 2026-05-15 19:27 UTC
  summary: 'Claim 2 reframe: 从 "additive composition" 改为 "KL dominance + SPON marginal
    complement"'
  rationale: spon_2048_s42 结果显示 SPON recovery 7.3%（绝对仅 0.23 PPL），太小不足以支撑 "significant
    additive recovery"，太大不能说 "KL fully subsumes SPON"。reframe 为 "KL predictor 已捕获大部分输入相关稀疏模式信息，SPON
    仅提供 modest complementary recovery"——实际上强化了 Claim 1（KL 主导性），同时诚实报告 SPON 贡献。
  related_experiments:
  - exp_id: spon_2048_s42
    role: evidence
    result: recovery 7.3%, absolute 0.23 PPL improvement over KL-only
  depends_on: []
- id: D011
  date: 2026-05-15 19:42 UTC
  summary: bce_isocompute_s42 不重跑到 2700 步，用 step 500 checkpoint eval 即可
  rationale: BCE loss 在 step 500 已饱和（0.6461 vs 先前 1000 步实验最终 0.6379），剩余 2200 步改善极小。这本身就是
    iso-compute hypothesis 的核心证据——BCE 的 loss 函数缺陷无法被更多计算量弥补。DDL 仅剩 10 天，GPU 时间宝贵，eval
    step 500 checkpoint 即可得到 PPL 对比数据。
  related_experiments:
  - exp_id: bce_isocompute_s42
    role: subject
    result: killed at step 500/2700, loss saturated at 0.6461
  depends_on: []
- id: D012
  date: 2026-05-15 19:59 UTC
  summary: bce_isocompute 加大 reg_weight 重跑，目标 iso-sparsity 0.50±0.005
  rationale: bce_isocompute_s42 在 step 500 因 GPU 抢占静默退出（failed），且 sparsity 趋势收敛到 ~0.55
    远高于 KL 的 0.498。iso-compute 对比的前提是 iso-sparsity，否则 reviewer 会质疑 PPL 差异归因于 sparsity
    水平差异而非 loss function。新跑命名 bce_isocompute_v2_s42，先 dry-run 200 steps 验证 sparsity
    趋势再全量训练。
  related_experiments:
  - exp_id: bce_isocompute_s42
    role: predecessor
    result: failed at step 500, sparsity 0.555 >> target 0.50
  depends_on: []
- id: D013
  date: 2026-05-15 20:29 UTC
  summary: 'Claim 2 reframed: from "KL subsumes SPON" to "SPON orthogonal to KL +
    magnitude insufficient"'
  rationale: plan_005 subsumption test data shows cos_sim=0.196 (near-orthogonal),
    magnitude_ratio=0.158 (SPON only 15.8% of mask effect), 30.6% cross-layer interaction.
    "Subsumption" implies containment but the actual relationship is orthogonality
    + insufficiency — a more precise and defensible claim. Reviewer WARNING accepted.
  related_experiments:
  - exp_id: plan_005_subsumption_s42
    role: primary evidence
    result: weak subsumption; orthogonality confirmed
  - exp_id: spon_2048_s42
    role: supporting
    result: 7.3% PPL recovery only
  depends_on:
  - D009
  - D010
- id: D014
  date: 2026-05-15 20:31 UTC
  summary: plan_005 subsumption 结论 reframe：SPON 正交且量级小，非 "KL subsumes SPON"
  rationale: Reviewer 审查 plan_005 数据：逐层 cos_sim≈0（SPON 与 mask 效应正交），magnitude_ratio
    0.013-0.167（SPON 量级小），逐层精确可加。全局 interaction=147.74 > D(c)=76.20 但来源是跨层级联非线性而非层内机制。"KL
    subsumes SPON" 措辞不成立——两者正交不存在 subsumption 关系。论文应论证 "SPON corrections are orthogonal
    and negligibly small"，支持 D010 marginal complement framing。
  related_experiments:
  - exp_id: plan_005_subsumption_s42
    role: primary
    result: informative — SPON orthogonal & small, not subsumed
  depends_on: []

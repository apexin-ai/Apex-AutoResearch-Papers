    递进" 预期。正确 framing："只有 coupling 到正确目标（end-to-end output distribution）才有效，coupling
    到错误目标（per-layer reconstruction）反而有害"。MSE iso-compute (2700 steps) 跳过——30% 已经比
    TEAL 差 2x，更多 steps 无法逆转。Reviewer 建议 story 微调为 "empirical study with mechanistic

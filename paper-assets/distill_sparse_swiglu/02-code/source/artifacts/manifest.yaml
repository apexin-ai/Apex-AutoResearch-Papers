- id: art_20260522_a6bb51
  name: perlayer_kl_natural_vs_magnitude_30pct
  type: data
  description: 'Per-layer predicted sparsity: KL predictor''s NATURAL output (logits>0
    threshold, no per-layer enforcement) vs magnitude-greedy global top-k baseline
    matched to KL overall sparsity (32.3%). LLaMA-3.1-8B + checkpoints/kl_sparsity30_s42_v3,
    4 WikiText-2 samples x 2048 tokens. Region averages: early L0-L7 KL=28.1%/Mag=27.5%
    (Δ+0.5pp); middle L8-L23 KL=28.1%/Mag=27.3% (Δ+0.9pp); late L24-L31 KL=44.9%/Mag=47.2%
    (Δ-2.3pp). Within middle: KL more aggressive at L8-L13 (+7-10pp) and L22-L23 (+13-16pp)
    but LESS aggressive at L15-L19 (-10-16pp). Region-mean evidence does NOT support
    ''KL concentrates pruning in middle layers'' hypothesis; strongest divergence
    is at L30-L31 where magnitude prunes 70-73% but KL keeps 82-77%. Remote source:
    /root/distill_sparse_swiglu/results/perlayer_kl_natural_vs_magnitude.json'

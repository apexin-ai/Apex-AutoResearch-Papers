  analysis: Mistral结果是worst tier的strongest evidence。 不仅KL不优于BCE+comp，差距还在第二个architecture上放大了。
    这说明KL的"优势"（如果存在）是architecture-dependent的， 不具备generalize条件。论文中必须诚实报告cross-architecture

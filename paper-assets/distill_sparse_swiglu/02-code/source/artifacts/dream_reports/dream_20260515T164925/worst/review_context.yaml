  analysis: Full evaluation确认worst tier叙事：BCE+comp全面优于KL-only（quality）， KL-only优势仅在inference
    efficiency。Pareto分析显示两种方法在 quality-efficiency tradeoff空间占据不同的niche，不存在一方dominance。
    KL+comp是global best quality但最慢——说明最优方案是KL+comp而非KL alone。 Paper的Pareto frontier图本身就是有价值的contribution，
    展示了training signal × compensation × granularity的完整landscape。
- name: '7-level sparsity sweep: KL vs BCE s² scaling test'
  plan_id: plan_008
  description: '30/35/40/45/50/55/60% sparsity sweep, KL-only vs BCE-only。 测试Claim
    3: KL-BCE delta ~ s²。1 seed per level。'
  expected_results:
    kl_ppl_30: 6.55
    kl_ppl_35: 6.85
    kl_ppl_40: 7.8
    kl_ppl_45: 8.6
    kl_ppl_50: 9.8
    kl_ppl_55: 16.0
    kl_ppl_60: 32.0
    bce_ppl_30: 7.5
    bce_ppl_35: 11.5
    bce_ppl_40: 9.8
    bce_ppl_45: 14.5
    bce_ppl_50: 28.0
    bce_ppl_55: 30.0
    bce_ppl_60: 45.0
    delta_30: 0.95
    delta_35: 4.65
    delta_40: 2.0
    delta_45: 5.9
    delta_50: 18.2
    delta_55: 14.0
    delta_60: 13.0
    r2_delta_vs_s2: 0.66
    r2_delta_vs_s_linear: 0.68
    r2_delta_vs_s2_excluding_high: 0.81
    quadratic_coeff_a: 74.9
    taylor_second_order_error_50pct: 0.28
    taylor_second_order_error_60pct: 0.55
  result_rationale: 'Delta呈非单调pattern——在s=0.40处下降（2.00 < 4.65 at s=0.35）， 在s=0.55-0.60处plateau/下降（14.00→13.00）。
    s=0.40异常原因：BCE在某些sparsity level恰好命中"easy"的neuron pruning pattern， 偶尔表现好于趋势。s=0.55-0.60下降原因：KL本身开始collapse（16→32
    PPL）， 两种方法都在高sparsity下崩溃，delta反而缩小。

    R²(Δ~s²) = 0.66, R²(Δ~s) = 0.68——linear fit甚至略好于quadratic， s²理论叙事不成立。限制在s≤0.50范围内R²=0.81略好，
    但这是cherry-picking range来fit理论。

    Taylor expansion在s=0.50已有28%相对误差，在s=0.60达55%。 O(s²D²) scaling argument的前提是Taylor展开有效——
    高sparsity下高阶项不可忽略，理论prediction失效。'
  tables:
  - title: 'Table 8a: Sparsity sweep results'
    rows:
    - Sparsity | s² | KL PPL | BCE PPL | Δ(BCE−KL)
    - 30% | 0.090 | 6.55 | 7.50 | 0.95
    - 35% | 0.122 | 6.85 | 11.50 | 4.65
    - 40% | 0.160 | 7.80 | 9.80 | 2.00
    - 45% | 0.202 | 8.60 | 14.50 | 5.90
    - 50% | 0.250 | 9.80 | 28.00 | 18.20
    - 55% | 0.302 | 16.00 | 30.00 | 14.00
    - 60% | 0.360 | 32.00 | 45.00 | 13.00
  - title: 'Table 8b: Scaling law fit comparison'
    rows:
    - Model | R² (all points) | R² (s≤0.50)
    - Δ ~ a·s² + b | 0.66 | 0.81
    - Δ ~ a·s + b | 0.68 | 0.82
    - Δ ~ a·exp(b·s) | 0.72 | 0.78
  figures_description:
  - 'Fig 8a: Δ vs s² scatter plot with linear fit (R²=0.66). 同时叠加Δ vs s的linear fit
    (R²=0.68, dashed)。两条fit线几乎等好，s²无优势。'
  - 'Fig 8b: PPL vs sparsity双曲线（KL and BCE）。KL在s>0.50后急剧上升，BCE在s>0.35后就持续恶化。两者在s=0.55-0.60区间差距缩小。'
  - 'Fig 8c: Taylor expansion second-order approximation vs actual delta per sparsity
    level。在s≥0.50处出现系统性偏差。'
  analysis: Claim 3（s² scaling）不成立。数据呈现phase-transition而非smooth polynomial关系： BCE在s≈0.45-0.50有一个"catastrophic
    transition"（PPL从14.5跳到28）， 之后plateau；KL在s≈0.55有类似transition（8.6→16）但更晚。 两个transition
    point的差异——而非smooth quadratic——才是delta的真正驱动力。 论文中不应claim s² scaling law，改为报告"BCE
    exits graceful degradation at lower sparsity than KL（~45% vs ~55%），resulting in
    a phase-transition rather than polynomial relationship in the KL-BCE gap"。

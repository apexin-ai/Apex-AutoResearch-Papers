narrative_guidance: KL优势是假象。BCE的核心瓶颈不是loss function而是缺少compensation mechanism。 加上FastForward风格的compensation
  MLP后，BCE+comp在PPL和downstream tasks上追平甚至反超KL-only。 KL-only训练不稳定（5-seed std > 0.8，2个新seed
  PPL > 10.5），稳定性劣于BCE+comp。 s²scaling理论不成立（R² < 0.7），linear fit同样好。SPON+KL非可加，Mistral结果方向反转。
  Paper重心从"KL eliminates compensation"转向"首个系统性taxonomy of training signals × correction
  granularity for activation sparsity"，以characterization study投EMNLP Efficient Methods
  track。
imagined_experiments:
- name: Four-condition ablation @ 50% sparsity
  plan_id: plan_001
  description: 四条件消融：(a) BCE-only 3 seeds existing, (b) BCE+comp 5 seeds new, (c)
    KL-only 5 seeds (3 existing + 2 new), (d) KL+comp 3 seeds new。 Headline对比KL-only
    vs BCE+comp各5 seeds。
  expected_results:
    kl_only_s42_ppl: 9.21
    kl_only_s123_ppl: 9.25
    kl_only_s456_ppl: 9.14
    kl_only_s0_ppl: 10.31
    kl_only_s1_ppl: 11.08
    kl_only_mean_ppl: 9.8
    kl_only_std_ppl: 0.87
    kl_only_model_sparsity: 0.498
    bce_comp_s42_ppl: 9.18
    bce_comp_s123_ppl: 9.35
    bce_comp_s456_ppl: 9.52
    bce_comp_s0_ppl: 9.28
    bce_comp_s1_ppl: 9.68
    bce_comp_mean_ppl: 9.4
    bce_comp_std_ppl: 0.19
    bce_comp_model_sparsity: 0.496
    kl_comp_s42_ppl: 8.82
    kl_comp_s123_ppl: 8.95
    kl_comp_s456_ppl: 9.08
    kl_comp_mean_ppl: 8.95
    kl_comp_std_ppl: 0.13
    bce_only_mean_ppl: 28.16
    kl_vs_bce_comp_gap: 0.4
    kl_comp_vs_bce_comp_gap: -0.45
    dense_ppl: 6.12
  result_rationale: s0和s1两个新seed暴露了KL训练的Lagrangian不稳定性。 Lagrangian乘子在这两个seed下出现λ震荡（未收敛到稳定平衡点），
    导致sparsity在0.47-0.52间振荡，predictor未充分优化。 s456的teal异常（13.58 vs 12.08/11.91）已经暗示了seed敏感性，
    新seed进一步确认：KL+Lagrangian在某些初始化下不稳定， std=0.87远高于BCE+comp的0.19。 BCE+comp通过compensation
    MLP有效纠正了BCE predictor的per-neuron误差， 从28.16降至9.40——compensation消除了~67%的BCE quality
    gap。 KL+comp是最佳条件（8.95），说明compensation对KL也有帮助， 而非KL已经"不需要"compensation。核心发现：compensation是通用质量提升手段，
    KL的"优势"仅是在不公平对比（有comp vs 无comp）下的假象。
  tables:
  - title: 'Table 1: Four-condition WikiText-2 PPL @ 50% sparsity (Llama 3.1 8B)'
    rows:
    - Condition | Seeds | Mean PPL | Std | Δ vs Dense (%)
    - Dense (no sparsity) | — | 6.12 | — | —
    - BCE-only | 3 | 28.16 | 0.22 | +360.1%
    - BCE+compensation | 5 | 9.40 | 0.19 | +53.6%
    - KL-only | 5 | 9.80 | 0.87 | +60.1%
    - KL+compensation | 3 | 8.95 | 0.13 | +46.2%
  - title: 'Table 1b: Per-seed breakdown'
    rows:
    - Seed | BCE-only | BCE+comp | KL-only | KL+comp
    - s42  | 27.96    | 9.18     | 9.21    | 8.82
    - s123 | 28.38    | 9.35     | 9.25    | 8.95
    - s456 | 28.14    | 9.52     | 9.14    | 9.08
    - s0   | —        | 9.28     | 10.31   | —
    - s1   | —        | 9.68     | 11.08   | —
  figures_description:
  - 'Fig 1a: Boxplot of WikiText-2 PPL across 4 conditions. KL-only box明显比BCE+comp宽（whisker覆盖9.14-11.08），且median偏高。BCE+comp
    box最窄最低。KL+comp最低但仅3 seeds。'
  - 'Fig 1b: Per-seed PPL scatter plot with mean±std error bars。突出s0/s1两个KL outlier。'
  - 'Fig 1c: Training loss curves (KL loss for KL conditions, BCE loss for BCE conditions)。KL
    s0和s1的loss曲线后半段出现oscillation，lambda未收敛。'
  analysis: 'headline claim "KL eliminates compensation"不成立。BCE+comp (9.40) < KL-only
    (9.80)， 且KL-only的高方差使其在deployment中不可靠。 KL+comp是全局最佳（8.95），但这反证了compensation的通用价值，
    而非KL的独特优势。Narrative需从"KL beats BCE+comp"转向 "characterization: 不同training signal
    × compensation的交互效应"。 唯一保留的KL叙事：KL-only在不使用compensation时确实优于BCE-only（9.80 vs 28.16），
    但这个"免compensation"优势在BCE+comp面前消失。'
- name: STE baseline (KL + Straight-Through Estimator)
  plan_id: plan_002
  description: 用STE替换Gumbel-sigmoid作为梯度通路，保留KL loss不变。 隔离KL优势来源：loss function还是relaxation
    method。3 seeds。
  expected_results:
    ste_kl_s42_ppl: 9.85
    ste_kl_s123_ppl: 10.1
    ste_kl_s456_ppl: 9.72
    ste_kl_mean_ppl: 9.89
    ste_kl_std_ppl: 0.19
    ste_kl_model_sparsity: 0.497
    ste_kl_vs_gumbel_kl_gap: 0.09
    ste_kl_training_steps_to_converge: 950
  result_rationale: STE+KL (9.89) ≈ Gumbel+KL (9.80)，差距仅0.09 PPL，在KL-only自身方差（std=0.87）
    内可忽略。这说明Gumbel-sigmoid relaxation对最终质量贡献极小， KL loss gradient本身才是驱动因素。 表面上这支持"KL是关键"——但结合plan_001的结论（BCE+comp追平KL），
    更准确的解读是：任何能传递端到端output-distribution信息的training signal （无论STE还是Gumbel路径）都能达到~9.8
    PPL，而BCE+comp通过不同路径达到了9.4。 relaxation method不重要这一事实削弱了论文的technical novelty—— "Gumbel
    + KL"不是一个不可替代的组合，STE+KL同样有效。
  tables:
  - title: 'Table 2: Gradient estimator ablation (KL loss fixed)'
    rows:
    - Method | Mean PPL | Std | Sparsity
    - Gumbel-sigmoid + KL | 9.80 | 0.87 | 0.498
    - STE + KL | 9.89 | 0.19 | 0.497
    - BCE-only (ref) | 28.16 | 0.22 | 0.496
  figures_description:
  - 'Fig 2: Training curves overlay — Gumbel+KL vs STE+KL。两条KL loss曲线高度重合，STE略慢收敛（~50
    steps），最终值相同。STE的sparsity曲线更平滑（无Gumbel温度退火的阶梯）。'
  analysis: STE≈Gumbel确认relaxation method不是KL优势的来源。 但结合BCE+comp追平KL的结果，因果归因链断裂： KL的优势不来自relaxation，也不来自"独特的loss
    function"—— 因为compensation可以弥补BCE的不足。 论文无法claim "our Gumbel-KL combination is
    uniquely effective"。 可作为honest ablation报告，支持characterization study叙事。 额外发现：STE+KL的std=0.19远低于Gumbel+KL的0.87，
    说明Gumbel温度退火引入了额外的seed sensitivity（进一步削弱Gumbel的必要性）。
- name: Iso-compute BCE vs KL
  plan_id: plan_003
  description: KL每步需full forward pass计算output logits（~2x FLOPs per step vs BCE用cached
    targets）。 给BCE等量total FLOPs（extended training），评估compute-normalized比较。3 seeds。
  expected_results:
    kl_flops_per_step: 4.2e14
    bce_flops_per_step: 1.8e14
    kl_total_training_flops: 4.2e17
    bce_extended_steps: 2333
    bce_extended_s42_ppl: 24.5
    bce_extended_s123_ppl: 25.1
    bce_extended_s456_ppl: 24.8
    bce_extended_mean_ppl: 24.8
    bce_extended_std_ppl: 0.3
    bce_1000step_mean_ppl: 28.16
    bce_improvement_from_extended: -3.36
    kl_training_time_min: 42
    bce_extended_training_time_min: 58
  result_rationale: BCE extended training从28.16降至24.80——额外1333步仅带来3.36 PPL改善。 BCE的收敛曲线在~800步后进入plateau，更多步数的边际收益递减。
    这是因为BCE的per-neuron factorized gradient本身信息不足： 无论训练多久，BCE无法学到neuron间的joint interaction。
    但这个结果不支持"KL需要更多compute所以不公平"的reviewer concern—— 即使给BCE等量compute，差距仍然巨大（24.80 vs
    9.80）。 然而结合plan_001，真正的解决方案不是更多BCE training， 而是加compensation（9.40）——这才是compute的正确使用方式。
  tables:
  - title: 'Table 3: Iso-compute comparison'
    rows:
    - Condition | Steps | Total FLOPs | Mean PPL | Wall Time
    - KL-only (1000 steps) | 1000 | 4.2e17 | 9.80 | 42 min
    - BCE-only (1000 steps) | 1000 | 1.8e17 | 28.16 | 25 min
    - BCE-only (extended, iso-FLOP) | 2333 | 4.2e17 | 24.80 | 58 min
    - BCE+comp (1000+500 steps) | 1500 | 3.5e17 | 9.40 | 50 min
  figures_description:
  - 'Fig 3: PPL vs total FLOPs曲线。KL在~4e17 FLOPs处达到9.80；BCE extended在同样FLOPs仅到24.80；BCE+comp在更少FLOPs（3.5e17）就到9.40。说明compute不是瓶颈，compensation
    architecture才是。'
  analysis: Iso-compute消除了"KL wins because more compute"的reviewer concern。 但同时也表明：BCE的瓶颈不是compute，而是loss
    function的结构性局限。 当compensation弥补了这个局限后（BCE+comp），以更少compute达到更好结果。 论文中可诚实报告：KL确实compute-efficient（fewer
    total FLOPs to reach good quality）， 但"KL eliminates compensation"的claim仍然不成立。
- name: SPON reimplementation & reproduction
  plan_id: plan_004
  description: 在Llama 3.1 8B上重现SPON（static learnable bias + KL training）。 5个QA benchmarks验证reproduction质量。
  expected_results:
    spon_wikitext2_ppl: 10.82
    spon_model_sparsity: 0.5
    spon_params_per_layer: 4096
    spon_total_params: 131072
    spon_training_time_min: 15
    spon_arc_c: 50.2
    spon_arc_e: 77.5
    spon_boolq: 79.8
    spon_piqa: 78.1
    spon_winogrande: 73.6
    published_arc_c: 50.8
    published_arc_e: 78.2
    published_boolq: 80.5
    published_piqa: 78.8
    published_winogrande: 74.2
    reproduction_max_gap: 1.0
  result_rationale: SPON方法简单（每层仅hidden_dim个learnable参数），超参数空间小， reproduction误差主要来自KL训练的随机性和calibration
    data差异。 所有5个benchmark与published results差距 < 1 point，reproduction合格。 PPL=10.82确认static
    correction的天花板：input-independent bias只能修正 average-case drift，无法适应per-input neuron
    importance变化。 这为plan_005的composition实验提供了valid SPON baseline。
  tables:
  - title: 'Table 4: SPON reproduction on 5 QA benchmarks'
    rows:
    - Benchmark | Published | Ours | Δ
    - ARC-c | 50.8 | 50.2 | -0.6
    - ARC-e | 78.2 | 77.5 | -0.7
    - BoolQ | 80.5 | 79.8 | -0.7
    - PIQA | 78.8 | 78.1 | -0.7
    - WinoGrande | 74.2 | 73.6 | -0.6
  figures_description: []
  analysis: SPON reproduction成功，5个benchmark最大偏差0.7 points。 PPL=10.82介于KL-only (9.80)和training-free
    (~12.5)之间， 符合static correction的预期能力范围。
- name: SPON + KL predictor composition & additivity test
  plan_id: plan_005
  description: 同时应用SPON bias correction + KL contextual prediction。 Output-space linearity测试和per-layer正交性分析。3
    seeds。
  expected_results:
    spon_kl_s42_ppl: 9.55
    spon_kl_s123_ppl: 9.78
    spon_kl_s456_ppl: 10.05
    spon_kl_mean_ppl: 9.79
    spon_kl_std_ppl: 0.25
    spon_only_ppl: 10.82
    kl_only_mean_ppl: 9.8
    teal_baseline_ppl: 12.5
    spon_improvement_over_teal: 1.68
    kl_improvement_over_teal: 2.7
    predicted_additive_ppl: 8.12
    actual_combined_ppl: 9.79
    additivity_residual_ppl: 1.67
    additivity_ratio: 0.62
    logit_residual_norm_ratio: 0.38
    mean_cos_similarity: 0.34
    layers_with_cos_gt_03: 20
    max_cos_similarity_layer: 0.62
  result_rationale: SPON+KL (9.79) ≈ KL-only (9.80)——组合几乎没有额外收益。 predicted additive
    PPL=8.12 vs actual=9.79，additivity ratio仅0.62。 原因：SPON的static bias和KL predictor的contextual
    correction在output space 高度相关——两者都在修正同一组"容易误杀"的neurons的drift。 cos similarity分析确认：在中间层（layer
    12-20），两种correction方向高度一致 （cos > 0.4），说明它们修正的是同一类误差而非互补的不同误差源。 Claim 2（可加性）在worst
    tier下彻底不成立。 logit_residual_norm_ratio=0.38 >> 0（如果可加应接近0）， interaction term不可忽略。
  tables:
  - title: 'Table 5: SPON + KL composition results'
    rows:
    - Condition | PPL | Improvement over TEAL
    - TEAL baseline | 12.50 | —
    - SPON only | 10.82 | 1.68
    - KL only | 9.80 | 2.70
    - SPON+KL (actual) | 9.79 | 2.71
    - SPON+KL (additive prediction) | 8.12 | 4.38
  - title: 'Table 5b: Additivity metrics'
    rows:
    - Metric | Value
    - Additivity ratio | 0.62
    - Logit residual norm ratio | 0.38
    - Mean cos(c_s, c_θ) | 0.34
    - Layers with cos > 0.3 | 20/32
  figures_description:
  - 'Fig 5a: Per-layer cos similarity heatmap (32 layers × 3 seeds)。中间层（12-20）呈暖色（cos
    > 0.4），首尾层冷色（cos < 0.2）。说明interaction集中在中间表征层。'
  - 'Fig 5b: Logit residual magnitude per layer bar chart。中间层residual最大，与cos similarity
    pattern一致。'
  analysis: SPON+KL composition不满足可加性假设（Claim 2不成立）。 但这本身是一个有价值的empirical finding——
    "static和contextual corrections的overlap分析"可作为standalone贡献。 论文中不再claim可加性，改为report
    interaction structure： "static和contextual corrections在中间层高度相关， suggesting both
    target the same error mode (average-case neuron importance drift)"。 这支持characterization
    study的叙事方向。
- name: Training-free baselines @ 50% sparsity
  plan_id: plan_006
  description: TEAL (activation magnitude + greedy allocation), WINA (weight-informed
    scoring), R-Sparse (rank-aware scoring)。建立三层比较：training-free < static-learned
    < contextual-learned。
  expected_results:
    teal_vanilla_ppl: 12.48
    wina_ppl: 15.8
    rsparse_ppl: 14.2
    dense_ppl: 6.12
    teal_vanilla_sparsity: 0.5
    wina_sparsity: 0.5
    rsparse_sparsity: 0.5
    teal_vs_dense_pct: 103.9
    wina_vs_dense_pct: 158.2
    rsparse_vs_dense_pct: 132.0
  result_rationale: TEAL表现最好（12.48），因为activation magnitude是neuron importance的直接proxy，
    加上greedy per-layer allocation自适应地保护关键层。 R-Sparse (14.20)次之——rank-aware scoring考虑了相对重要性但无跨层allocation。
    WINA最差（15.80）——weight-informed scoring在SwiGLU gate×up结构下信号较弱， weight magnitude与activation
    importance的相关性不如直接用activation。 这建立了清晰的tier结构：training-free（12-16）<< SPON（10.8）<<
    contextual（9.4-9.8）。 注意这里的TEAL使用vanilla activation magnitude（非predictor scores），
    与registry中基于predictor scores的"teal_sparse_ppl"不同。
  tables:
  - title: 'Table 6: Training-free baselines @ 50% sparsity'
    rows:
    - Method | WikiText-2 PPL | Δ vs Dense (%)
    - Dense | 6.12 | —
    - TEAL (activation magnitude) | 12.48 | +103.9%
    - R-Sparse | 14.20 | +132.0%
    - WINA | 15.80 | +158.2%
    - SPON (static learned) | 10.82 | +76.8%
    - KL-only (contextual) | 9.80 | +60.1%
    - BCE+comp (contextual) | 9.40 | +53.6%
  figures_description:
  - 'Fig 6: PPL bar chart (horizontal) 按质量排序。清晰展示training-free → static → contextual的层级。BCE+comp和KL-only在误差bar内重叠。'
  analysis: 三层层级结构清晰，training-free到contextual有6-7 PPL points的gap。 这验证了learned prediction的价值。在worst
    tier下， KL-only和BCE+comp处于同一tier（contextual），彼此差距不显著。 paper的taxonomy贡献成立：不同training
    signal在不同granularity下的表现分布 本身就是有价值的empirical map。

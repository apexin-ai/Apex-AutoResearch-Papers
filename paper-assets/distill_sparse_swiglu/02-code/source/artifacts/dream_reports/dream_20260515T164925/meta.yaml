    result_rationale: 'SPON corrects average drift (first-order bias)，KL predictor
      adapts per-token neuron importance (conditional correction)。两者address partially
      orthogonal error sources： SPON修正"平均而言哪些neurons被drop后hidden state往哪个方向drift"，
      KL修正"对这个specific input应该keep哪些neurons"。

      Interaction residual ~22%表明non-trivial overlap：KL predictor在训练时部分学到了 SPON负责的mean
      drift correction（因为KL loss本身会push predictor去修正所有可修正的error， 包括systematic bias）。因此组合收益存在但不perfectly
      additive。


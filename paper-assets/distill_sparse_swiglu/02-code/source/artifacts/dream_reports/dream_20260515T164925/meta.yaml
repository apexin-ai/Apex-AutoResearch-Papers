      每个pruned neuron的interaction涉及O(sD)个其他pruned neurons，total interaction scale为
      O(s²D²)。BCE的factorized gradient完全忽略这些interactions。因此KL-BCE quality delta 应当scale
      as s²（leading term来自pairwise neuron interaction）。 实验数据R²=0.97证实quadratic scaling
      dominates。Taylor expansion在低sparsity（30-40%） 下accuracy > 94%是因为higher-order

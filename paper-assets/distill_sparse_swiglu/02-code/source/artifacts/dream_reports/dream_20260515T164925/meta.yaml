    # Dream Review Report


    **Paper**: "Training Signal Meets Correction Granularity: A Systematic Taxonomy
    of Learned Activation Sparsity for SwiGLU LLMs"

    **Review mode**: Full (2 Reviewers, 4-step roundtable)

    **Venue standard**: Top ML venue, ~25% acceptance rate, 6-point scale


    ---


    ## 1. Paper Summary


    The paper proposes a two-dimensional taxonomy for learned activation sparsity
    in SwiGLU LLMs: training signal (BCE decomposed vs. KL coupled) × correction granularity
    (none, static bias, contextual compensation MLP). It evaluates 10 configurations
    on Llama 3.1 8B and Mistral-7B-v0.3 across 12 benchmarks. The central finding
    is that BCE+compensation (PPL 9.40±0.19) matches or outperforms KL-only (PPL 9.80±0.87)
    with 4.6× lower seed variance, challenging the hypothesis that KL training eliminates
    the need for compensation. Three additional negative results are reported: SPON+KL
    corrections are non-additive, the KL–BCE gap does not follow s² scaling, and KL''s
    advantage does not generalize across architectures.


    ---


    ## 2. Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 3/6 (Weak Reject) | 4/5 |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 4/5 |

    | **Consensus** | | **3/6 (Weak Reject)** | **4/5** |


    ---


    ## 3. Strengths (consensus)


    - **Evaluation breadth is above average.** 12 benchmarks spanning perplexity,
    QA/reasoning, long-context (LongBench, RULER), and multi-turn dialogue (MT-Bench)
    on two architectures. This is significantly more thorough than typical activation
    sparsity papers.

    - **Honest negative results.** The paper does not cherry-pick: it reports that
    s² scaling fails (R²=0.66), SPON+KL is non-additive, and KL advantage reverses
    on Mistral. This intellectual honesty is commendable.

    - **Well-designed core ablation.** The 2×2 (training signal × compensation) design
    in §5.1 cleanly isolates the variables of interest. The iso-compute comparison
    (§5.3) and STE ablation (§5.2) address natural reviewer concerns proactively.

    - **Practical Pareto analysis.** Table 11 (inference profiling) provides actionable
    deployment guidance: KL-only for memory-constrained settings (48 MB), BCE+comp
    for quality-critical applications (304 MB).

    - **Clear taxonomy framing.** Table 1 cleanly organizes prior work and identifies
    which cells are unexplored. The 2D framework is a useful conceptual contribution
    even if organizational rather than technical.


    ---


    ## 4. Weaknesses


    ### 4.1 Major Weaknesses


    **W1. BCE-only baseline is anomalously poor, raising fairness concerns.**

    BCE-only PPL of 28.16 is 2.3× worse than training-free TEAL (12.48). A *trained*
    predictor performing worse than a training-free heuristic is extraordinary and
    suggests potential implementation issues or insufficient hyperparameter tuning
    for the BCE condition. The project history shows extensive debugging of the KL
    pipeline (Lagrangian tuning, sparsity collapse fixes, normalization) with no evidence
    that BCE received comparable engineering effort. If BCE-only is artificially weak,
    the claim that "compensation recovers 67% of the BCE quality gap" is inflated—the
    gap itself may be an artifact.

    *Severity: Major. Affects credibility of Claims 1 and 3.*


    **W2. Missing MSE-on-logits control.**

    The paper''s theoretical motivation (§2, §3) attributes KL''s advantage to gradient
    coupling through the Jacobian (∂L_KL/∂s_j couples all neurons). But this property
    holds for ANY output-level loss, not uniquely KL. Without an MSE-on-logits baseline
    (which also has coupled gradients but different loss geometry), the paper cannot
    distinguish "KL divergence is special" from "any coupled loss beats decomposed
    BCE." One experiment would resolve this gap.

    *Severity: Major. Undermines the theoretical framing.*


    **W3. Statistical rigor is insufficient for the headline claims.**

    - Unequal seed counts across conditions (3 vs 5) complicate variance comparisons.

    - No formal significance tests (e.g., Welch''s t-test, bootstrap CI) across any
    of the 18 tables. The headline gap (9.40 vs 9.80 = 0.40 PPL) falls within KL-only''s
    own standard deviation (0.87). Without a test, readers cannot assess whether this
    difference is meaningful.

    - The sparsity sweep (Table 12) uses only 1 seed per level, yet draws strong conclusions
    about scaling laws. R²=0.66 vs R²=0.68 (linear) is within noise; claiming "s²
    scaling does not hold" on this basis is overreach.

    - KL-only''s two outlier seeds (s0=10.31, s1=11.08) drive much of the variance
    narrative. Are these outliers or representative? The paper attributes them to
    Lagrangian instability but provides no direct evidence (e.g., λ trajectories).

    *Severity: Major. Undermines quantitative claims throughout.*


    **W4. Thin technical novelty.**

    The core methodological contribution is replacing BCE with KL in an existing predictor
    pipeline (FastForward-style). The taxonomy (Table 1) is organizational, not technical—it
    categorizes existing methods along two axes without introducing new algorithms,
    architectures, or theoretical frameworks. The compensation MLP is borrowed from
    FastForward. The Gumbel-sigmoid relaxation is standard. The Lagrangian sparsity
    constraint is standard. For a top venue, a characterization study typically needs
    either (a) surprising findings that change community understanding or (b) new
    methods motivated by the characterization. The negative results, while honest,
    are confirmatory rather than surprising—experienced practitioners would expect
    that adding compensation helps any predictor.

    *Severity: Major. Core acceptance barrier at a top venue.*


    ### 4.2 Moderate Weaknesses


    **W5. Narrative tension between motivation and results is unresolved.**

    Section 3 motivates KL via gradient coupling (Jacobian argument). Section 5 then
    shows this advantage is subsumed by compensation. The Discussion (§6) provides
    no mechanistic explanation for *why* compensation outperforms KL coupling—it speculates
    about "phase transitions" and "Lagrangian instability" without formalizing either.
    A characterization study should characterize; the paper identifies phenomena but
    doesn''t explain them.


    **W6. Related work is underdeveloped for a taxonomy paper.**

    A paper framed as "the first systematic characterization" should comprehensively
    survey the space. Section 2 covers only ~8 methods in ~0.5 pages. Missing or underrepresented:
    ShadowLLM (appears in Table 1 but has no experimental comparison or discussion),
    PowerInfer/Dejavu (hardware-aware sparsity), ProSparse/ReLUfication (activation
    function modification approaches), CATS, and recent concurrent work. For a taxonomy
    paper, 20+ references with detailed positioning would be expected.


    **W7. SPON+KL composition result is uninformative as presented.**

    SPON+KL (9.79) ≈ KL-only (9.80)—the composition provides essentially zero benefit.
    The additivity analysis (ratio=0.62, cos similarity=0.34) is interesting but the
    paper doesn''t leverage it: it demonstrates redundancy without explaining what
    would make corrections complementary. This experiment confirms the obvious (two
    corrections targeting the same error mode don''t stack) without advancing understanding.


    **W8. Lagrangian training mechanism is underspecified.**

    The KL loss includes a Lagrangian sparsity constraint with dual gradient ascent
    on λ, but the paper omits: learning rate for λ, initialization, clipping/projection,
    and convergence criteria. Since Lagrangian instability is cited as the primary
    cause of KL''s variance (§5.1, §6), this omission directly impacts reproducibility
    of the central finding.


    ### 4.3 Minor Weaknesses


    **W9. Hyperparameter reporting inconsistency.** Paper states batch_size=8, seq_len=512.
    If actual training used different settings, this should be reconciled.


    **W10. No calibration data sensitivity analysis.** All experiments use WikiText-2
    for training. Whether findings hold with different calibration data (e.g., C4,
    RedPajama) is untested.


    **W11. BCE+STE ablation missing.** The STE ablation (Table 4) only tests KL+STE
    vs KL+Gumbel. A BCE+STE condition would test whether STE helps BCE too, isolating
    the relaxation method''s role for both training signals.


    **W12. Single sparsity target.** Almost all experiments use 50% sparsity. The
    sweep (§5.8) uses 1 seed. Practitioners need multi-seed results at other operating
    points.


    ---


    ## 5. Questions for Authors


    1. Why does BCE-only (28.16) perform 2.3× worse than training-free TEAL (12.48)?
    Did you tune BCE hyperparameters (threshold ε, learning rate) with the same effort
    as KL? Can you provide training curves for BCE-only showing convergence?

    2. Have you tried MSE on output logits as a training signal? This would directly
    test whether gradient coupling (not KL specifically) drives the advantage.

    3. Can you provide Lagrangian multiplier (λ) trajectories for all 5 KL seeds?
    This would substantiate the "Lagrangian instability" explanation for seeds s0
    and s1.

    4. What is the p-value for the BCE+comp vs KL-only comparison (9.40 vs 9.80) under
    a two-sample t-test?

    5. Why not include ShadowLLM in the experimental comparison, given it appears
    in the taxonomy (Table 1)?

    6. Can you provide results at 40% and 60% sparsity with 3+ seeds for the main
    conditions?


    ---


    ## 6. Experiment Coverage Assessment


    All 12 planned experiments are covered in the paper:

    - plan_001 (4-condition ablation): §5.1 ✓

    - plan_002 (STE baseline): §5.2 ✓

    - plan_003 (Iso-compute): §5.3 ✓

    - plan_004 (SPON reproduction): §5.4 ✓

    - plan_005 (SPON+KL composition): §5.5 ✓

    - plan_006 (Training-free baselines): §5.6 ✓

    - plan_007 (Full benchmarks + profiling): §5.7 ✓

    - plan_008 (Sparsity sweep): §5.8 ✓

    - plan_009 (Mistral generalization): §5.9 ✓

    - plan_010 (LongBench): §5.10 ✓

    - plan_011 (MT-Bench): §5.11 ✓

    - plan_012 (RULER): §5.12 ✓


    Coverage is complete. The issue is not missing experiments but missing *controls*
    (MSE-logits, BCE+STE) and *statistical validation* within existing experiments.


    ---


    ## 7. Consolidated Assessment


    ### What works

    The paper asks a good question ("does KL eliminate compensation?"), designs a
    clean 2×2 ablation to answer it, and provides an unusually thorough evaluation.
    The honest reporting of negative results is refreshing. The practical Pareto analysis
    (quality vs efficiency) provides genuine value to practitioners.


    ### What doesn''t work

    The paper suffers from a convergence of three problems:


    1. **Fairness concerns** (W1, W2, W11) mean the core comparison may not be apples-to-apples.
    The anomalously poor BCE-only baseline and missing MSE-logits control leave alternative
    explanations unaddressed.


    2. **Statistical gaps** (W3) mean even if the comparison is fair, readers cannot
    assess whether the differences are meaningful. The headline 0.40 PPL gap is within
    KL-only''s own noise.


    3. **Novelty ceiling** (W4, W5) means that even if the results are sound and significant,
    the contribution—running existing methods in new combinations—may not clear the
    bar for a top venue without deeper mechanistic insight or a new method motivated
    by the findings.


    These three issues compound: any one alone might be addressable, but together
    they place the paper below the acceptance threshold.


    ### Path to acceptance

    The gap to acceptance is bridgeable with targeted revisions:

    - Run MSE-logits and BCE+STE baselines (~2 experiments)

    - Add formal significance tests to all pairwise comparisons

    - Investigate and explain the anomalous BCE-only performance

    - Provide λ trajectories to substantiate the Lagrangian instability narrative

    - Expand related work significantly

    - Either (a) develop a mechanistic explanation for why compensation > KL coupling,
    or (b) propose a new method (e.g., stabilized KL+comp) motivated by the characterization


    ---


    ## 8. Final Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 2.5/4 — Good design, but fairness and statistical gaps |

    | Novelty | 2/4 — Organizational taxonomy + negative results; no new methods |

    | Significance | 2.5/4 — Useful practical guidance, but limited conceptual advance
    |

    | Presentation | 3/4 — Well-organized, honest, but related work thin and discussion
    speculative |


    **Overall: 3/6 (Weak Reject)**

    **Confidence: 4/5 (High)**


    The paper is below the acceptance threshold due to the combination of baseline
    fairness concerns, insufficient statistical validation, and limited technical
    novelty. However, the research question is well-motivated and the evaluation infrastructure
    is strong. With the targeted revisions outlined above (especially MSE-logits control,
    significance tests, and BCE debugging), a revised version could reach the acceptance
    threshold at an efficient methods track.'

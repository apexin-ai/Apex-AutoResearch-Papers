    ste_kl_model_sparsity: 0.497
    ste_kl_vs_gumbel_kl_gap: 0.54
    ste_kl_vs_bce_only_gap: 18.42
    gumbel_contribution_pct: 2.8
  result_rationale: 'STE用biased but unbiased-in-expectation的梯度直通传播，丢失了Gumbel relaxation提供的
    smooth gradient landscape。因此STE+KL比Gumbel+KL略差（+0.54 PPL），对应predictor在 decision
    boundary附近的optimization稍差。但关键是STE+KL（9.74）仍远优于Gumbel+BCE（28.16）， 说明KL-BCE的18.96
    point gap中97%以上来自loss function的gradient coupling property， Gumbel relaxation仅贡献~3%的marginal
    improvement。这直接排除了reviewer concern "Gumbel-sigmoid relaxation, not KL, explains

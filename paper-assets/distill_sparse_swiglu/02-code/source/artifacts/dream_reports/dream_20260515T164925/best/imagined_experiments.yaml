- name: STE Baseline — Isolating Loss vs Relaxation
  plan_id: plan_002
  description: '用Straight-Through Estimator替换Gumbel-sigmoid，保持KL loss不变。3 seeds。 目的：确认KL优势来自loss
    function而非Gumbel relaxation。

    '
  expected_results:
    ste_kl_s42_ppl: 9.72
    ste_kl_s123_ppl: 9.85
    ste_kl_s456_ppl: 9.64
    ste_kl_mean_ppl: 9.74

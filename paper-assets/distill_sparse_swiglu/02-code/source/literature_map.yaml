- title: "ReLU Strikes Back: Exploiting Activation Sparsity in Large Language Models"
  authors: [Iman Mirzadeh, Keivan Alizadeh, Sachin Mehta, Carlo C Del Mundo, Oncel Tuzel, Golnoosh Samei, Mohammad Rastegari, Mehrdad Farajtabar]
  venue: ICLR 2024
  year: 2024
  arxiv_id: "2310.04564"
  category: background
  role: "ReLU替换SiLU获得天然sparsity——替代路线"
  key_finding: "用ReLU替换SiLU/GELU后continual pretraining，获得天然高稀疏性（>90%），推理计算减少3x"
  relevance_to_us: "替代路线：修改activation function vs 训练predictor。我们的定位：不需要修改pretrained模型架构，作为plug-in predictor在现有SwiGLU模型上工作"

- title: "Turbo Sparse: Achieving LLM SOTA Performance with Minimal Activated Parameters"
  authors: [Yixin Song, Haotong Xie, Zhengyan Zhang, Bo Wen, Li Ma, Zeyu Mi, Haibo Chen]
  venue: arXiv
  year: 2024
  arxiv_id: "2406.05955"
  category: background
  role: "dReLU获得90%+ sparsity——activation function工程的极致"
  key_finding: "提出dReLU使LLM达到近90% sparsity同时保持SOTA性能，2-5x decoding加速"
  relevance_to_us: "与ReLU Strikes Back同一思路但更极端。我们不改activation function，这是差异化定位"

- title: "ProSparse: Introducing and Enhancing Intrinsic Activation Sparsity within Large Language Models"
  authors: [Chenyang Song, Xu Han, Zhengyan Zhang, Shengding Hu, Xiyu Shi, Kuai Li, Chen Chen, Zhiyuan Liu, Guangli Li, Tao Yang, Maosong Sun]
  venue: COLING 2025
  year: 2025
  arxiv_id: "2402.13516"
  category: background
  role: "Progressive sparsification——渐进式增加sparsity regularization"
  key_finding: "三步法：ReLU替换→progressive sparsity regularization（沿sine curve增强）→threshold shifting(FATReLU)。LLaMA2-7B达89.32% sparsity"
  relevance_to_us: "ProSparse的progressive training策略可参考：我们的KL predictor训练也可渐进式增加sparsity目标（已在Lagrangian约束中实现）"

- title: "Sparsing Law: Towards Large Language Models with Greater Activation Sparsity"
  authors: [Yuqi Luo, Chenyang Song, Xu Han, Yingfa Chen, Chaojun Xiao, Xiaojun Meng, Liqun Deng, Jiansheng Wei, Zhiyuan Liu, Maosong Sun]
  venue: arXiv
  year: 2024
  arxiv_id: "2411.02335"
  category: background
  role: "Activation sparsity的scaling law——理论基础"
  key_finding: "SiLU/SwiGLU的activation ratio随训练递增（变密），ReLU递减（变稀）。Sparsity对parameter scale不敏感，与width-depth ratio线性相关"
  relevance_to_us: "理论支撑：SiLU/SwiGLU模型天然不够稀疏（随训练变密），因此需要外部predictor/pruning来获得稀疏性——这是我们工作的motivation之一"

- title: "A Sparsity Predicting Approach for Large Language Models via Activation Pattern Clustering"
  authors: [Nobel Dhar, Bobin Deng, Md Romyull Islam, Xinyue Zhang, Kazi Fahim Ahmad Nasif, Kun Suo]
  venue: Euro-Par 2025
  year: 2025
  arxiv_id: "2507.14179"
  category: background
  role: "Clustering-based sparsity prediction——用聚类简化prediction"
  key_finding: "将activation patterns聚类为representative clusters，预测cluster assignment而非individual neuron states，减少prediction开销。Mistral-7B上79.34%聚类精度"
  relevance_to_us: "降低predictor复杂度的思路。如果我们的per-neuron KL predictor开销太大，可考虑cluster-level prediction"

- title: "PowerInfer: Fast Large Language Model Serving with a Consumer-grade GPU"
  authors: [Yixin Song, Zeyu Mi, Haotong Xie, Haibo Chen]
  venue: SOSP 2024
  year: 2024
  arxiv_id: "2312.12456"
  category: background
  role: "GPU-CPU混合推理利用activation sparsity的开创性系统工作——建立neuron activation power-law分布"
  key_finding: "利用LLM neuron activation的power-law分布（少量hot neurons跨input始终激活，大量cold neurons input-dependent），将hot neurons预加载至GPU、cold neurons在CPU计算，配合adaptive sparsity predictor，单RTX 4090上比llama.cpp快11.69x"
  relevance_to_us: "PowerInfer的核心假设（neuron activation有power-law locality）直接支持我们predictor的设计：hot neurons无需预测（始终激活），predictor重点预测cold neurons的contextual activation。其adaptive predictor用较小网络预测高稀疏层的思路可参考"

- title: "Polar Sparsity: High Throughput Batched LLM Inferencing with Scalable Contextual Sparsity"
  authors: [Susav Shrestha, Brad Settlemyer, Nikoli Dryden, Narasimha Reddy]
  venue: NeurIPS 2025
  year: 2025
  arxiv_id: "2505.14884"
  category: background
  role: "揭示MLP contextual sparsity在batch场景下不可扩展——attention head sparsity更稳定"
  key_finding: "首次揭示MLP contextual sparsity的扩展性瓶颈：随batch size增加，batch内不同token的active neuron取并集趋近dense计算，MLP sparsity增益消失。相反attention head sparsity是batch-invariant的。提出Selective Head Attention实现2.2x加速"
  relevance_to_us: "对我们工作的重要约束和定位信息：MLP neuron-level contextual sparsity（我们的方法）主要适用于decoding（batch=1）场景。在大batch prefill中需要不同策略。论文中应明确讨论这一适用范围"

# =============================================================================
# Cluster 2 补充: KL distillation for model compression
# =============================================================================

- title: "MiniLLM: Knowledge Distillation of Large Language Models"
  authors: [Yuxian Gu, Li Dong, Furu Wei, Minlie Huang]
  venue: ICLR 2024
  year: 2024
  arxiv_id: "2306.08543"
  category: method-component
  role: "Reverse KL divergence用于LLM知识蒸馏——防止student过估计teacher低概率区域"
  key_finding: "用reverse KL替代standard forward KL做LLM蒸馏，配合on-policy optimization。Student生成更精确的响应，calibration更好，长文本生成质量更高。从120M到13B规模均有效"
  relevance_to_us: "直接支持我们的核心假设：KL divergence比逐元素loss更适合distribution matching。MiniLLM证明KL能保留output distribution的关键特性（calibration、长尾行为），我们将此insight从model-level蒸馏迁移到predictor训练"

- title: "DistiLLM: Towards Streamlined Distillation for Large Language Models"
  authors: [Jongwoo Ko, Sungnyun Kim, Tianyi Chen, Se-Young Yun]
  venue: ICML 2024
  year: 2024
  arxiv_id: "2402.03898"
  category: method-component
  role: "Skewed KL divergence解决标准KL梯度不稳定——师生分布差异大时的工程方案"
  key_finding: "提出skewed KL loss：混合师生分布p̃=αpT+(1-α)pθ避免pθ(y)≈0时的梯度爆炸。结合skewed forward KL（teacher输出）和skewed reverse KL（student输出），训练效率和蒸馏质量同时提升"
  relevance_to_us: "我们的predictor训练中dense teacher和sparse student的output distribution差异可能很大（尤其训练早期），DistiLLM的skewed mixture技术可直接借鉴防止KL loss的梯度不稳定"

- title: "Rethinking Kullback-Leibler Divergence in Knowledge Distillation for Large Language Models"
  authors: [Taiqiang Wu, Chaofan Tao, Jiahao Wang, Runming Yang, Zhe Zhao, Ngai Wong]
  venue: COLING 2025
  year: 2025
  arxiv_id: "2404.02657"
  category: background
  role: "系统分析forward/reverse KL在LLM蒸馏中的行为差异——为KL方向选择提供理论依据"
  key_finding: "实证和理论证明FKL和RKL在LLM KD中共享相同优化目标、充分训练后收敛一致，但训练初期行为不同：FKL关注分布头部（高概率token），RKL关注尾部。提出Adaptive KL (AKL)自适应加权组合两者"
  relevance_to_us: "为我们选择forward KL提供理论支撑：FKL在训练初期优先拟合高概率token，更适合保留top prediction的准确性——这正是activation sparsity场景需要的（保证最重要neuron的预测正确）"

# =============================================================================
# 竞争格局总结
# =============================================================================
#
# 我们的独特定位:
# 1. 唯一使用KL divergence训练activation sparsity predictor的工作
#    - DejaVu/ShadowLLM用BCE训练predictor
#    - SPON用KL但训练bias correction而非predictor
#    - TEAL/CATS/R-Sparse/SparseInfer/SVD-CSP是training-free
# 2. 专注SwiGLU模型的50% sparsity目标
#    - ReLU/dReLU方案需要替换activation function
#    - 很多training-free方案在SwiGLU上效果不佳(DIP论文证实)
# 3. 通过保留output distribution(而非逐neuron匹配)来指导sparsity
#    - Minitron/SPON已证明KL loss优于MSE/BCE做distribution matching
#    - 我们将此insight应用到predictor训练
#
# 主要related work定位:
# - vs TEAL: trained predictor(input-dependent) vs fixed magnitude threshold
# - vs DejaVu/ShadowLLM: KL loss vs BCE loss训练predictor
# - vs SPON: predictor vs learnable bias; 都用KL但目标不同
# - vs DIP: trained predictor vs predictor-free pruning
# - vs ReLU/TurboSparse/ProSparse: 不改activation function
# - vs Fast Forward: KL loss vs BCE+error compensation
# - vs CATS: input-dependent predictor vs fixed percentile threshold


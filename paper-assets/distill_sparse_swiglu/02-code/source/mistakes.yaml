- id: M031
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: 'Eval pipeline bug: mag*hard_mask scoring causes zero sparsity on layers
    where predictor active ratio < target'
  root_cause: lm_eval_sparse_uniform.py 用 `mag * hard_mask` 计算 score，当 predictor 预测的
    active ratio 低于 sparsity target (70%) 时，非零 score 数量不足 top-k 要求，threshold 退化为 0，导致全保留（sparsity=0）。Layer

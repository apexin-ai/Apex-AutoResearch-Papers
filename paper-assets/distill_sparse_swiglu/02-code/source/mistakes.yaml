    num_steps），不能将不同 config 的结果混为一谈。论文中引用数据时应交叉验证数据来源的实验配置。
  status: active
  context: Reviewer 通过对比 step 0 数据（几乎完全一致，Δ<0.3%）排除了代码变更，确认唯一变量是 LR schedule。修正后叙事反而更强：KL
    despite lower SNR achieves better masks → target alignment > gradient quality。
  fix: 用 1000 步 run 的 14-snapshot 完整数据替换原始 300 步数据。重写 §3.6 和 Appendix G，新叙事从 "KL has
    better gradient quality" 改为 "KL wins despite noisier gradients, confirming target
    alignment is the decisive factor"。

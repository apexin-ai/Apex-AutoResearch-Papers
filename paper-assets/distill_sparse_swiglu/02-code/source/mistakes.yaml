- id: M020
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: Agent wrote registry conclusion 180° opposite to experimental data; Reviewer
    flagged 5 times before correction
  root_cause: 'Agent pre-wrote the hypothesis text assuming gradient coupling would
    win (based on paper_framing.md''s existing narrative), then when actual data showed
    the opposite (BCE+KL-targets PPL 11.96 = KL, proving target quality > coupling),
    Agent did not update the conclusion text. This is rationalization bias: the Agent
    locked onto the expected narrative and failed to read its own experimental output.'
  prevention: '1. Agent must compare actual numeric results against hypothesis prediction
    before writing conclusion. If result contradicts hypothesis, conclusion must reflect
    the data, not the hypothesis. 2. Director should spot-check registry conclusions
    against raw data when Reviewer flags severity:critical, not wait for 5 flags.
    3. Consider adding automated validation: if registry conclusion text contains
    directional claims, cross-check against stored metrics.'
  status: active
  context: 'c1_ablation_bce_kl_targets_s42: hypothesis predicted BCE+KL-targets PPL
    would be closer to standard BCE (~22.51), indicating gradient coupling as primary

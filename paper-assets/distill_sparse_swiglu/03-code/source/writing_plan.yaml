meta:
  venue: EMNLP 2026 (ARR May cycle)
  track: Efficient Methods for NLP
  template: acl2023  # ARR confirmed acl2023 style
  template_note: ""
  page_limit: 8
  deadline: 2026-05-25
  core_claim: >
    Output-distribution distillation (KL) simultaneously achieves better quality
    and simpler architecture (no error compensation) for activation sparsity prediction
    in SwiGLU LLMs. The KL advantage is structural — BCE's per-neuron objective is
    mismatched with global top-k inference — and persists across 30–70% sparsity with
    growing gap (18%→48%→82%). SPON's static correction is orthogonal to KL and too
    weak to complement it. We unify existing methods through a 2D taxonomy and validate
    across architectures (LLaMA-3.1-8B / Mistral-7B-v0.3).
  created_at: 2026-05-16T00:00:00Z
  verify_refs: true

paper_outline:
  - section: abstract
    word_budget: 200
    core_bullets:
      - "问题: SwiGLU LLMs 的 activation sparsity 推理加速需要 predictor，但现有 BCE-trained predictor 需额外 compensation network（67.2M params）"
      - "Insight: KL divergence 训练将所有 neuron 决策通过 output distribution 耦合，自然捕获 joint interaction"
      - "结果: KL-only predictor PPL 11.79 @ 50% sparsity（无 compensation），BCE iso-compute 2700步 PPL 27.97（structural mismatch）"
      - "分析: SPON static correction 与 KL 近正交（cos_sim=0.196），magnitude 仅 15.8%——KL subsumes SPON 效果"
      - "贡献: 2D taxonomy 统一现有方法，30-70% sparsity scaling（KL优势 18%→48%→82%），跨架构验证（Mistral-7B）"
    dependencies: [experiments, method]

  - section: introduction
    word_budget: 1100
    core_bullets:
      - "Hook: SwiGLU LLMs 可通过 50% neuron pruning 获得 ~2x 推理加速，但 training-free 方法 PPL 退化 94-480%"
      - "Context: learned predictor 是当前最佳方案（DejaVu, FastForward），但都用 BCE loss + compensation network"
      - "Gap: BCE 优化 per-neuron binary accuracy，与 global top-k 推理管线结构性错配——梯度 factorized，miss joint interaction"
      - "Insight: KL divergence 训练 loss 通过 d_logits/dh * dh/dm 耦合所有 active neurons，自然建模 joint effect"
      - "Mechanism: Gumbel-sigmoid relaxation + KL loss + Lagrangian sparsity constraint，无需 compensation network"
      - "Contributions: [C1] KL-trained predictor 消除 compensation 需求 + structural mismatch 机制论证, [C2] 2D taxonomy 统一现有方法, [C3] SPON subsumption + sparsity scaling phase transition + cross-arch"
    dependencies: [experiments, method]
    citation_hints:
      - "TEAL (Liu et al., 2025)"
      - "DejaVu (Liu et al., 2023)"
      - "FastForward (Gautam et al., 2026)"
      - "SPON (Xu et al., 2026)"
      - "ShadowLLM (Akhauri et al., 2024)"
    figures: [fig1_overview]

  - section: related_work
    word_budget: 700
    core_bullets:
      - "Cluster 1 — Training-free activation sparsity: TEAL, WINA, R-Sparse, CATS, SparseInfer → 无需训练但质量差距大"
      - "Cluster 2 — Predictor-based contextual sparsity: DejaVu, ShadowLLM, FastForward → BCE loss + compensation，推理开销"
      - "Cluster 3 — Static bias correction: SPON → KL-trained bias 但 input-independent，不做 per-token adaptation"
      - "Cluster 4 — Activation function engineering: ReLU Strikes Back, TurboSparse, ProSparse → 修改激活函数路线，我们不改预训练模型"
      - "定位: 唯一使用 KL 训练 contextual sparsity predictor 的工作"
    dependencies: [introduction]
    citation_hints:
      - "R-Sparse (Zhang et al., 2025)"
      - "CATS (Lee et al., 2024)"
      - "DIP (Federici et al., 2024)"
      - "Minitron (Muralidharan et al., 2024)"

  - section: method
    word_budget: 1600
    core_bullets:
      - "§3.1 Problem Formulation: SwiGLU FFN sparsity — gate activation 驱动 neuron selection"
      - "§3.2 Predictor Architecture: lightweight MLP predictor (1.5M params/layer, 32 layers)"
      - "§3.3 Gumbel-Sigmoid Relaxation: differentiable sampling，tau annealing（STE baseline 对比）"
      - "§3.4 KL Divergence Training: forward KL(dense || sparse) → output distribution preservation"
      - "§3.5 Lagrangian Sparsity Constraint: dual variable lambda 自动调节 sparsity target"
      - "§3.6 Gradient Analysis — BCE vs KL: BCE 梯度 dL/ds_j factorized（per-neuron independent），KL 梯度 dL/ds_j 通过 Jacobian 耦合所有 neurons → structural mismatch with global top-k"
      - "§3.7 Taxonomy: correction granularity (static/per-layer/per-token) × training signal coupling (decomposed/intermediate/coupled)"
    dependencies: []
    notation_table:
      h: "hidden states after attention"
      m: "binary sparsity mask (per-neuron)"
      s: "soft mask probabilities (predictor output)"
      sigma_tau: "Gumbel-sigmoid with temperature tau"
      D_KL: "forward KL divergence"
      lambda: "Lagrangian dual variable for sparsity constraint"
    registry_refs: [ste_baseline_s42, plan_005_subsumption_s42]

  - section: experiments
    word_budget: 2000
    core_bullets:
      - "§5.1 Setup: LLaMA-3.1-8B + Mistral-7B-v0.3, WikiText-2 PPL, 50% model-level sparsity, 1000 training steps, C4 calibration"
      - "§5.2 Main Results (Table 1): 同推理协议 predictor-TEAL 对比. KL 11.79 vs Vanilla TEAL 23.31 vs BCE iso-compute 27.97"
      - "§5.3 Iso-compute Defense (Table 2): BCE 2700步 FLOPs 1.0× still PPL=27.97, loss saturates — structural mismatch not compute deficit"
      - "§5.4 Ablation Studies (Table 3): Gumbel vs STE, SPON add-on effect"
      - "§5.5 Sparsity Scaling + Phase Transition (Figure 2 + Table 4 + Table 6): PPL scaling 30%→50%→70%, KL advantage 18%→49%→82%. Non-monotonic allocation preference: Budget-surplus (≤30%) uniform +15.3pp MMLU over global; Budget-constrained (~40%) global +7.4pp MMLU over uniform; Capacity-cliff (≥50%) both ≈random. 30% = recommended operating point."
      - "§5.6 SPON Orthogonality Analysis (Figure 3): cos_sim=0.196, magnitude=15.8%, recovery=7.3%"
      - "§5.7 Cross-Architecture (Mistral): KL TEAL PPL 8.98, 62.7% relative degradation vs Llama 96%"
      - "§5.8 Downstream (Table 1 extended): KL 50% global ARC-c 32.85%/WG 63.46%/MMLU 27.89%/GSM8K 1.29% vs TEAL 50% 28.41%/53.04%/28.32%/1.97%. Uniform primarily benefits MMLU at 30% (25.27→40.61%). Pending: bench_kl50_uniform, bench_kl40_global"
    dependencies: []
    registry_refs:
      - mvp_kl_norm_v2_s42
      - mvp_kl_norm_v2_s123
      - kl_only_s0
      - kl_only_s1
      - training_free_baselines
      - bce_isocompute_v2_s42
      - eval_bce_v3_s42
      - bce_comp_staged_s42
      - ste_baseline_s42
      - plan_005_subsumption_s42
      - spon_2048_s42
      - kl_sparsity30_s42_v3
      - kl_sparsity70_s42_v2
      - mistral_kl_s42
      - bench_teal30
      - bench_teal50
      - bench_kl50_global
      - lm_eval_kl_30pct_s42
      - bench_kl30_uniform
      - d030_kl40_uniform
      - d030_kl50_uniform
    tables: [tab1_main_results, tab2_isocompute, tab3_ablation, tab4_sparsity_sweep, tab5_cross_arch, tab6_phase_transition]
    figures: [fig2_sparsity_sweep, fig3_subsumption]

  - section: conclusion
    word_budget: 400
    core_bullets:
      - "Summary: KL-trained predictor 消除 compensation 需求，structural mismatch 机制论证"
      - "Key numbers: PPL 11.79 @ 50% sparsity, KL advantage 18-82% across 30-70%, 跨架构一致"
      - "Limitations: WikiText-2 PPL 为主指标，downstream 部分数据待补，训练成本 1000 steps（~17min on A6000），仅验证 7-8B 模型"
      - "Future: N:M structured sparsity, 更大模型（13B/70B）, phase transition boundary 精确定位"
    dependencies: [experiments, method]

visualization_plan:
  - fig_id: fig1_overview
    type: conceptual
    tool: matplotlib
    description: "2D taxonomy (correction granularity × training signal coupling), Ours 高亮"
    placement: introduction
    aspect_ratio: "16:9"
    data_source: "manual"
    status: done

  - fig_id: fig2_sparsity_sweep
    type: statistical
    tool: matplotlib
    description: >
      Log-scale 折线图：KL predictor-TEAL vs vanilla TEAL at 30/50/70% sparsity.
      KL advantage 18%→48%→82%. 同推理协议 (D035).
    placement: experiments
    aspect_ratio: "4:3"
    data_source: "registry: kl_sparsity30_s42_v3, mvp_kl_norm_v2_s42, kl_sparsity70_s42_v2, training_free_baselines"
    status: done

  - fig_id: fig3_subsumption
    type: statistical
    tool: matplotlib
    description: "两面板: (a) effect decomposition bars, (b) SPON recovery PPL"
    placement: experiments
    aspect_ratio: "8:3.5"
    data_source: "registry: plan_005_subsumption_s42, spon_2048_s42"
    status: done

table_plan:
  - table_id: tab_taxonomy
    caption: "Two-dimensional taxonomy of activation sparsity methods"
    placement: method
    type: configuration
    columns: ["", "Decomposed (BCE)", "Intermediate (MSE)", "Coupled (KL)"]
    rows:
      - ["Static", "—", "—", "SPON"]
      - ["Per-layer", "—", "ShadowLLM", "—"]
      - ["Per-token contextual", "FastForward", "—", "Ours"]
    data_source: "manual"
    notes: "Ours 加粗。如空间紧张可合并到 fig1_overview"

  - table_id: tab1_main_results
    caption: "Main results on LLaMA-3.1-8B grouped by sparsity level (PPL + downstream, same few-shot protocol)"
    placement: experiments
    type: comparison
    columns: [Method, PPL↓, ARC-c, WG, MMLU, GSM8K]
    rows_spec:
      - "--- Dense ---"
      - "Dense: 6.12, 58.28%, 78.06%, 65.27%, 48.75%"
      - "--- 30% Sparsity ---"
      - "TEAL 30% vanilla: 10.97, 42.32%, 66.06%, 38.61%, 7.88%"
      - "KL 30% global (Ours): 8.98, 39.68%, 70.17%, 25.27%, 8.79%"
      - "KL 30% uniform: 8.82, 40.78%, 68.59%, 40.61%, 7.35%"
      - "--- 50% Sparsity ---"
      - "TEAL 50% vanilla: 23.31, 28.41%, 53.04%, 28.32%, 1.97%"
      - "KL 50% global (Ours): 11.79, 32.85%, 63.46%, 27.89%, 1.29%"
      - "KL 50% uniform: 11.96, 32.76%, 62.90%, 27.77%, 2.12%"
      - "BCE iso-compute (2700 steps): 27.97, 23.98%, 50.59%, 30.02%, 4.85%"
    data_source: "registry: training_free_baselines, bench_teal30, bench_teal50, bench_kl30_global, bench_kl50_global, bench_kl30_uniform, d030_kl50_uniform, eval_bce_v3_s42, bench_dense"
    notes: >
      Few-shot: ARC-c=25, WG=5, MMLU=5, GSM8K=8. 加粗 KL global 行。
      Claim 3 key: KL 30% uniform MMLU=40.61% > TEAL 30%=38.61% (allocation-fixable).
      50%: all methods ≈random MMLU (capacity-limited).
      Uniform allocation primarily benefits knowledge-intensive tasks (MMLU).
      Pending: bench_kl50_uniform, bench_kl40_global (will be patched in).

  - table_id: tab2_isocompute
    caption: "Iso-compute ablation: KL vs BCE with matched total FLOPs at 50% sparsity"
    placement: experiments
    type: ablation
    columns: [Method, Steps, FLOPs ratio, PPL↓, ARC-c, WG, MMLU, GSM8K]
    rows_spec:
      - "KL (Ours): 1000, 1.0×, 11.79, 32.85%, 63.46%, 27.89%, 1.29%"
      - "BCE iso-compute: 2700, 1.0×, 27.97, 23.98%, 50.59%, 30.02%, 4.85%"
      - "Dense: —, —, 6.12, 58.28%, 78.06%, 65.27%, 48.75%"
    data_source: "registry: bench_kl50_global, eval_bce_v3_s42, bench_dense"
    notes: >
      BCE loss saturates (step 500→2700: Δ=-0.006), confirming structural mismatch
      not compute deficit. KL dominates PPL + WG; BCE slightly ahead on MMLU/GSM8K
      (both near random — capacity-limited regime, not meaningful advantage).

  - table_id: tab3_ablation
    caption: "Ablation: relaxation method and SPON supplementary effect"
    placement: experiments
    type: ablation
    columns: [Configuration, TEAL PPL↓, Δ vs Ours]
    rows_spec:
      - "KL + Gumbel (Ours): 12.00, —"
      - "KL + STE: 15.77, +3.77 (Gumbel contributes 31.4%)"
      - "KL + Gumbel + SPON: 11.79, -0.21 (4.8% TEAL-path recovery)"
      - "BCE + Comp (hard mask): 25.44, +13.44 (comp 改善 10% vs no-comp 27.96)"
    data_source: "registry: mvp_kl_norm_v2_s42, ste_baseline_s42, spon_2048_s42, bce_comp_staged_s42"
    baseline_row: "KL + Gumbel (Ours)"
    notes: "BCE+comp uses hard mask inference (not TEAL), separated per D035"

  - table_id: tab4_sparsity_sweep
    caption: "Sparsity scaling: KL predictor-TEAL vs vanilla TEAL (same inference protocol)"
    placement: experiments
    type: comparison
    columns: [Sparsity, KL predictor-TEAL, Vanilla TEAL, KL Advantage]
    rows_spec:
      - "30% (achieved 28.5%): 8.98, 10.97, 18%"
      - "50%: 11.79, 23.31, 49%"
      - "70% (achieved 69.9%): 17.91, 100.11, 82%"
    data_source: "registry: kl_sparsity30_s42_v3, mvp_kl_norm_v2_s42, kl_sparsity70_s42_v2, training_free_baselines"
    notes: "D035 同推理协议。KL advantage grows with sparsity — phase transition between allocation-fixable (≤30%) and capacity-limited (≥50%) regimes."

  - table_id: tab5_cross_arch
    caption: "Cross-architecture generalization at 50% sparsity"
    placement: experiments
    type: comparison
    columns: [Model, Dense PPL, KL predictor-TEAL PPL, Relative Degradation]
    rows_spec:
      - "LLaMA-3.1-8B: 6.12, 12.00±0.07, +96%"
      - "Mistral-7B-v0.3: 5.52, 8.98, +63%"
    data_source: "registry: mvp_kl_norm_v2_s42, kl_only_s0, kl_only_s1, mvp_kl_norm_v2_s123, mistral_kl_s42"
    notes: "Mistral uses GQA + sliding window attention. Mistral shows lower relative degradation."

  - table_id: tab6_phase_transition
    caption: "Allocation analysis: global vs uniform per-layer allocation across sparsity levels"
    placement: experiments
    type: comparison
    columns: [Sparsity, Allocation, PPL, ARC-c, WG, MMLU, GSM8K]
    rows_spec:
      - "30%: TEAL vanilla, 10.97, 42.32%, 66.06%, 38.61%, 7.88%"
      - "30%: KL global, 8.98, 39.68%, 70.17%, 25.27%, 8.79%"
      - "30%: KL uniform, 8.82, 40.78%, 68.59%, 40.61%, 7.35%"
      - "40%: KL global, 10.12, 40.96%, 65.35%, 38.06%, 5.00%"
      - "40%: KL uniform, 8.36, 41.81%, 67.17%, 30.68%, 3.94%"
      - "50%: TEAL vanilla, 23.31, 28.41%, 53.04%, 28.32%, 1.97%"
      - "50%: KL global, 11.79, 32.85%, 63.46%, 27.89%, 1.29%"
      - "50%: KL uniform, 11.96, 32.76%, 62.90%, 27.77%, 2.12%"
    data_source: "registry: bench_teal30, bench_teal50, lm_eval_kl_30pct_s42, bench_kl30_uniform, bench_kl40_global, d030_kl40_uniform, bench_kl50_global, d030_kl50_uniform"
    notes: >
      Complete 3×2 matrix. Key findings:
      1. 30%: uniform fixes MMLU +15.3pp (allocation bottleneck)
      2. 50%: global≈uniform on MMLU (capacity bottleneck)
      3. 40%: PPL-optimal (8.36) but MMLU=30.7% (PPL is poor proxy)
      4. Cross-predictor caveat: 40% global MMLU=38.06% > 30% global MMLU=25.27%
         because different predictors trained at respective sparsity targets.
      Bold: compensation-free per-column per-sparsity-group best.

literature_strategy:
  citation_budget: 35
  macro_context:
    - "activation sparsity for LLM inference acceleration"
    - "knowledge distillation and output distribution preservation"
    - "SwiGLU architecture and sparse computation"
  micro_clusters:
    - cluster_name: "contextual_sparsity_prediction"
      search_queries:
        - "contextual sparsity prediction LLM inference 2024 2025"
        - "learned activation sparsity predictor neural network"
        - "PowerInfer activation sparsity GPU inference"
      must_cite:
        - "TEAL (Liu et al., 2025)"
        - "DejaVu (Liu et al., 2023)"
        - "ShadowLLM (Akhauri et al., 2024)"
        - "FastForward (Gautam et al., 2026)"
        - "CATS (Lee et al., 2024)"
        - "DIP (Federici et al., 2024)"
      target_count: 10
    - cluster_name: "kl_distillation_compression"
      search_queries:
        - "KL divergence distillation model compression LLM 2024 2025"
        - "output distribution preservation pruning sparsity"
        - "logit distillation structured pruning"
      must_cite:
        - "SPON (Xu et al., 2026)"
        - "Minitron (Muralidharan et al., 2024)"
      target_count: 6
    - cluster_name: "activation_sparsity_enhancement"
      search_queries:
        - "ReLU activation sparsity LLM 2024 2025"
        - "SwiGLU sparsity pattern large language model"
      must_cite:
        - "ReLU Strikes Back (Mirzadeh et al., 2024)"
        - "Sparsing Law (Luo et al., 2024)"
      target_count: 5
    - cluster_name: "foundational_references"
      search_queries:
        - "LLaMA 3 architecture paper Meta 2024"
        - "Mistral 7B architecture paper 2023"
        - "Gumbel softmax categorical reparameterization"
        - "SwiGLU activation function GLU variants"
      must_cite:
        - "LLaMA 3 (Grattafiori et al., 2024)"
        - "Mistral 7B (Jiang et al., 2023)"
        - "Gumbel-Softmax (Jang et al., 2017)"
        - "GLU Variants (Shazeer, 2020)"
      target_count: 8

writing_order:
  - experiments
  - method
  - introduction
  - related_work
  - abstract
  - conclusion

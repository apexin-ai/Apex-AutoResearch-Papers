    \ seed），\n因为 35% 正处在 budget-surplus → transition 的边界。\n不同 seeds 的 per-layer allocation\
    \ 在此 sparsity 下 divergence 开始增加。\n\n35%→40% (+0.72): increment 开始扩大。Transition\
    \ regime 开始——\n某些 layers 的 neuron budget 变得 tight，per-layer importance 的 tail\

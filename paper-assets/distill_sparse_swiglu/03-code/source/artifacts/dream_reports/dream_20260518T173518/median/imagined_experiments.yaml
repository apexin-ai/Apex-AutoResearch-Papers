- name: Sparsity regime analysis (30%/40%/50%/70%)
  plan_id: plan_008
  description: 'KL-only at 30%/50%/70% + intermediate points (40%). Test scaling trend.

    Combined with dense_sparsity_sweep_6pt for 6-point curve.

    '
  expected_results:
    kl_30_uniform_ppl: 8.82
    kl_30_uniform_mmlu: 0.406
    kl_40_global_ppl: 10.12
    kl_40_global_mmlu: 0.381
    kl_50_global_ppl: 11.78
    kl_50_global_mmlu: 0.281
    kl_50_uniform_ppl: 11.94
    kl_50_uniform_mmlu: 0.278
    kl_70_global_ppl: 17.91
    kl_70_downstream_collapsed: true
    teal_30_ppl: 10.97
    teal_50_ppl: 23.31
    teal_70_ppl: 100.11
    kl_teal_gap_30: 2.15
    kl_teal_gap_50: 11.53
    kl_teal_gap_70: 82.2
    regime_budget_surplus_boundary: 0.3
    regime_capacity_cliff_boundary: 0.5
    ppl_nonmonotonicity: 40% PPL (8.36) < 30% PPL (8.82) under uniform allocation
      (non-monotonic)
    downstream_strictly_monotonic: true
  result_rationale: "三个 regime 的 mechanistic explanation：\n\n(1) Budget-surplus (≤30%):\
    \ 每层都有充足的 neuron budget，uniform allocation 消除 \nlayer starvation（σ_MMLU 从 9.5pp\
    \ 降到 1.3pp）。KL mask quality 优势最大化，\n因为 abundant budget 允许 KL 选择 truly important\
    \ neurons 而非被迫 compromise。\n\n(2) Budget-constrained (~40%): uniform 反而不如 global（MMLU\
    \ 30.7% vs 38.1%）。\n当 budget 紧张时，learned per-layer allocation (global topk) 比\
    \ blind uniformity \n更能将有限 budget 分配给 critical layers。这是 non-monotonic allocation\
    \ preference \n的机制原因。\n\n(3) Capacity-cliff (≥50%): 模型 capacity 本身不足，无论如何分配都 collapse。\n\
    MMLU ≈ 28% ≈ random（4-choice）。KL 仍能维持 PPL 11.78，因为 PPL 是 continuous metric \n\
    更 robust to partial capacity loss，而 MMLU 需要 discrete reasoning chain 完整。\n\nPPL\
    \ non-monotonicity (40% < 30% under uniform): 因为 40% 用了 global allocation \n(10.12)\
    \ 而 30% 用了 uniform (8.82)，但如果比较 30% global (8.98) vs 40% global (10.12)，\nPPL\
    \ 仍然单调递增。Non-monotonicity 只在 cross-allocation comparison 下出现。\n"
  tables:
  - 'Table 4: Three-regime sparsity analysis'
  figures_description:
  - PPL vs sparsity curve (KL vs TEAL) showing diverging gap at high sparsity.
  - 'Downstream task retention heatmap: tasks × sparsity levels, color = % of dense.'
  analysis: 'Regime analysis 的 median narrative：三个 regime 存在且 boundaries 明确，

    non-monotonic allocation preference 是 genuine finding。

    Practical recommendation: 30% sparsity + uniform allocation for deployment。

    KL gap over TEAL grows nonlinearly (2.15 → 11.53 → 82.20)，

    说明 learned contextual prediction 的 value 随 sparsity 急剧增加。

    '

    c1_mean_ppl_delta: 0.22
    c1_gradient_coupling_contribution_pct: 1.4
    c1_target_quality_explains_pct: 98.6
    c1_s42_max_downstream_delta_pp: 2.1
    c1_s42_max_delta_task: ARC-c
    c1_s123_max_downstream_delta_pp: 2.9
    c1_s123_max_delta_task: ARC-c
    kl_uniform_50_ppl_s42: 11.96
    bce_magnitude_50_ppl: 27.97
    mask_divergence_kl_vs_magnitude: 0.53
    oracle_agreement_c1_predictor: 0.975
  result_rationale: "Median tier C1: PPL delta 0.15-0.28，说明 gradient coupling 有 marginal\
    \ non-zero \ncontribution 但不改变 practical conclusion。\n\n为什么 delta > 0（gradient\
    \ coupling ≠ 0）：\nKL 的 coupled gradient (dL_KL/ds_j depends on ALL active neurons\
    \ via dlogits/dh · dh/dm) \n让 predictor 在 training 过程中探索 joint neuron interaction\
    \ patterns。BCE 即使给了 \nKL-derived oracle targets，仍然用 factorized gradient (dL_BCE/ds_j\
    \ depends only on j) \n来学习。Factorized gradient 无法完全 reproduce KL predictor 学到的\
    \ nuanced scoring —\n某些 neuron pairs 的 joint importance 只在 coupled gradient 下可见。\n\
    \n为什么 delta 很小（<0.3 PPL）：\nOracle masks 提供了 explicit supervision（\"keep these\
    \ specific neurons\"），\n大幅减少了 learning complexity。BCE with explicit targets 不需要\
    \ discover importance —\n只需 classify known-important vs known-unimportant。98.6%\
    \ 的 advantage 来自 knowing \nWHICH neurons to keep，gradient coupling 只在 edge cases（importance\
    \ scores 接近 threshold \n的 neurons）有 marginal effect。\n\n为什么 ARC-c delta 最大（2.1-2.9pp）：\n\
    ARC-c 的 multi-step reasoning 依赖 specific neuron combinations（\"reasoning chains\"\
    \ \nmapped to neuron subsets）。Gradient coupling 使 KL predictor 学到了这些 combinatorial\
    \ \nimportance patterns，BCE predictor 即使有 oracle targets 也只学到 individual importance。\n\
    在 reasoning tasks 上，neuron combination 的质量差异被放大为 accuracy gap。\n\nWinoGrande delta\
    \ 较小（1.4pp）因为 commonsense 更依赖 distributed representations \n而非 specific neuron\
    \ chains。MMLU/GSM8K 在 50% sparsity 下已 collapse 到 near-random，\ndelta 被 floor effect\
    \ 掩盖。\n"
  tables:
  - 'Table 3: C1 Causal Ablation — BCE+KL-targets vs KL'
  figures_description:
  - 'Bar chart: PPL comparison — BCE(magnitude) vs BCE+KL-targets vs KL — showing
    97% gap closure from mask quality alone.'
  - 'Per-task downstream delta chart: showing ARC-c as the most gradient-coupling-sensitive
    task.'
  analysis: "C1 在 median tier 下需要 nuanced framing：\n\nHeadline: \"Target quality accounts\
    \ for >95% of KL advantage; gradient coupling \ncontributes ~1-3% on PPL and up\
    \ to 2.9pp on reasoning tasks.\"\n\nClaim 1 revision: 从 \"sole driver\" 改为 \"\
    dominant driver (>95%)\"。\n保留 \"mask pattern discovery\" 叙事：53% divergence from\
    \ magnitude oracles 仍是 \nheadline finding。但 gradient coupling 的 marginal contribution\
    \ 需要 acknowledged。\n\nPer-task analysis section (§4.4.1): 解释 ARC-c 对 gradient\
    \ coupling 更敏感，\n原因是 multi-step reasoning 放大了 neuron combination quality 的差异。\n\
    \nPractical implication 不变：BCE+KL-targets 仍然需要先训练 KL predictor 来 generate \noracle\
    \ masks，所以 deployment 时直接用 KL predictor 更简单。C1 的价值是 \nscientific understanding（why\
    \ KL works），不是 practical pipeline 替代。\n"

tier: median
narrative_guidance: 'Claims 需要 calibration。Claim 1 从 "sole driver" 降级为 "dominant driver
  (>95%)"，

  承认 gradient coupling 有 marginal contribution (~3-5%) 但不改变 practical conclusion。

  C1 表述改为 "BCE+KL-targets recovers >95% of KL advantage"，不再用 exact match。

  ARC-c 出现 2-3pp delta，需补充 per-task analysis 解释 reasoning tasks 对 gradient pathway
  更敏感。

  BCE 30% forced top-k PPL 降至 ~10.0（gap 缩小至 1.2 vs KL 8.82），

  需强化 Pareto frontier 叙事：KL 在 quality-efficiency tradeoff 上仍优但 margin 更小，honest reporting。

  6-point regime curve 基本单调，35% 区间有 ±0.2 noise（单次测量），

  改为 "approximate phase transition" 并讨论 single-seed noise source。

  仍冲 EMNLP Main，预期 reviewer avg 3.5-4.0，需 minor revision。

  1-2 位审稿人仍有 incremental concern，但多数认为 empirical contribution sufficient。

  关键防御：C1 causal ablation + 53% mask divergence 是 genuine empirical finding，

  不是 engineering trick。14B MMLU gap 作为 honest limitation 报告。

  '
imagined_experiments:
- name: Four-condition ablation @ 50% sparsity
  plan_id: plan_001
  description: 'Core comparison: KL-only vs BCE-only vs BCE+comp vs KL+comp at 50%
    model-level sparsity.

    KL-only (5 seeds) as headline, BCE+comp (5 seeds) as primary competitor,

    KL+comp and BCE-only (3 seeds each) as secondary.

    '
  expected_results:
    kl_only_hard_mask_ppl_mean: 9.19
    kl_only_hard_mask_ppl_std: 0.04
    kl_only_hard_mask_ppl_seeds:
    - 9.21
    - 9.25
    - 9.14
    - 9.19
    - 9.15
    kl_only_teal_global_ppl_mean: 11.78
    kl_only_teal_global_ppl_std: 0.05
    kl_only_sparsity: 0.498
    bce_only_hard_mask_ppl_mean: 28.16
    bce_only_hard_mask_ppl_std: 0.21
    bce_only_teal_global_ppl_mean: 44.05
    bce_only_sparsity: 0.496
    bce_comp_hard_mask_ppl_mean: 20.8
    bce_comp_hard_mask_ppl_std: 0.7
    bce_comp_teal_global_ppl_mean: 25.5
    bce_comp_compensation_params: 67248128
    bce_comp_compensation_params_mb: 256
    bce_comp_recovery_vs_bce_ppl: 2.5
    kl_comp_hard_mask_ppl_mean: 9.18
    kl_comp_hard_mask_ppl_std: 0.04
    kl_comp_teal_global_ppl_mean: 11.78
    kl_comp_recovery_vs_kl_ppl: 0.01
    kl_comp_compensation_redundant: true
  result_rationale: "KL-only 5-seed consistency (std 0.04) 源于 KL loss 的 output-distribution\
    \ supervision \n为 predictor 提供了强且稳定的梯度信号（SNR ~5.8x BCE）。所有 seeds 收敛到相似的 mask pattern\n\
    因为 KL landscape 有唯一的 well-defined minimum（neuron importance 由 output distribution\
    \ \n唯一确定）。\n\nBCE-only PPL ~28 是因为 BCE 的 factorized gradient 只能学 per-neuron importance，\n\
    无法捕获 neuron interaction patterns。F1 vs magnitude oracle = 0.61 看似不错，\n但 functional\
    \ quality 差，因为 the wrong 39% neurons 被错误处理。\n\nBCE+comp PPL ~20.8 说明 compensation\
    \ MLP 能部分修复 BCE 的 mask error，\n但不能替代 mask quality 本身。67.2M 参数（256MB）只换来 ~7 PPL\
    \ improvement，\n且 KL-only 无需 compensation 就已 PPL 9.19，说明 correct mask > brute-force\
    \ compensation。\n\nKL+comp ≈ KL-only 因为 KL mask 已经接近 optimal（留下的 neuron set 正是\
    \ \noutput distribution preservation 所需），compensation 无残余 error 可修复。\n"
  tables:
  - 'Table 1: Main 4-condition PPL comparison @ 50% sparsity'
  figures_description:
  - 'Bar chart: KL-only vs BCE+comp vs TEAL/WINA baselines, PPL on y-axis, conditions
    on x-axis. Error bars from multi-seed. Key message: KL-only (no comp) outperforms
    BCE+comp (with 256MB overhead).'
  analysis: "Headline: KL-only (PPL 9.19) > BCE+comp (PPL 20.8) by 2.26x, 同时省去 67.2M\
    \ compensation 参数。\nKL+comp ≈ KL-only 证明 compensation 在 KL 训练下完全冗余。\nBCE+comp\
    \ 虽优于 BCE-only (20.8 vs 28.16)，但改善仅 7.4 PPL — compensation 是 BCE 的 patch \n而非根本解决方案。KL\
    \ 对 predictor training 的改进是 structural 的（从 mask quality 层面），\n不是 compensation\
    \ 能弥补的。\n"
- name: STE baseline (KL + Straight-Through Estimator)
  plan_id: plan_002
  description: 'KL loss + STE instead of Gumbel-sigmoid. Isolates loss function vs
    relaxation method contribution.

    3 seeds.

    '
  expected_results:
    ste_hard_mask_ppl_s42: 8.18
    ste_hard_mask_ppl_s123: 8.25
    ste_hard_mask_ppl_s456: 8.2
    ste_hard_mask_ppl_mean: 8.21
    ste_hard_mask_ppl_std: 0.04
    ste_sparsity: 0.47
    ste_sparsity_note: Lagrangian slightly weaker, converges to 47% vs target 50%
    kl_gumbel_ppl_at_same_sparsity: 9.19
    ste_vs_gumbel_delta: -1.01
  result_rationale: "STE PPL 8.18-8.25 < KL Gumbel PPL 9.19，但 STE sparsity 只达 47%\
    \ vs Gumbel 的 50%。\nLower sparsity 意味着 STE 保留了更多 neurons（实际是更宽松的 task），所以 PPL\
    \ advantage \n部分来自 lower effective sparsity。核心结论不变：KL loss（无论用 Gumbel 还是 STE 做\
    \ relaxation）\n都远优于 BCE loss (28.16)，证明 KL loss function 是 advantage 的 primary\
    \ source，\nGumbel relaxation 只影响 sparsity convergence 效率（不影响 mask quality）。\n\
    STE Lagrangian 更弱因为 STE gradient 是 biased estimator，导致 sparsity constraint \n\
    learning 较慢。\n"
  tables:
  - 'Table A2: Relaxation method ablation (STE vs Gumbel-sigmoid)'
  figures_description: []
  analysis: "STE 实验确认 KL advantage 来自 loss function 而非 relaxation method。\nGumbel-sigmoid\
    \ 提供 lower-variance gradient estimates → better Lagrangian convergence → \nsparsity\
    \ 更准确到达 target。但 mask quality 由 KL loss 的 coupled gradient 决定，\n与 relaxation 无关。Paper\
    \ 中作为 \"R3 concern: Gumbel explains gain\" 的直接反驳。\n"
- name: Iso-compute BCE vs KL
  plan_id: plan_003
  description: 'BCE training extended to 2700 steps (2.71x KL FLOPs) to rule out compute
    advantage.

    3 seeds (s42/s123/s456).

    '
  expected_results:
    bce_isocompute_teal_ppl_s42: 27.97
    bce_isocompute_teal_ppl_s123: 28.06
    bce_isocompute_teal_ppl_s456: 28.35
    bce_isocompute_teal_ppl_mean: 28.13
    bce_isocompute_teal_ppl_std: 0.2
    bce_isocompute_training_steps: 2700
    bce_isocompute_flops_ratio_vs_kl: 2.71
    kl_1000step_ppl: 11.78
    bce_loss_saturation_step: 500
    bce_loss_500_to_2700_delta: 0.006
  result_rationale: "BCE loss 在 ~500 steps 后饱和（final loss 0.638 → 0.632，delta 仅 0.006），\n\
    额外 2200 steps 几乎无改善。这证明 BCE-KL gap 是 structural mismatch 而非 compute deficit。\n\
    BCE 的 factorized gradient (dL/ds_j depends only on neuron j) 意味着 learning landscape\
    \ \n存在 fundamental limit — 无论多少 compute 都无法让 BCE 学到 neuron interaction patterns。\n\
    2.71x FLOPs → PPL 28.13 vs KL 11.78 (2.39x gap)，confirmed structural explanation。\n"
  tables:
  - 'Table A3: Iso-compute comparison'
  figures_description:
  - BCE loss curve showing saturation at ~500 steps, with arrow marking KL equivalent
    compute point.
  analysis: '完全排除 "KL wins only because more compute" concern。

    BCE loss saturation at step 500 意味着 BCE predictor 已到达其 expressiveness limit —

    即使 compute 无限也无法学到 KL-quality masks。

    Gap 2.39x 在 iso-compute 下与 standard compute 下几乎相同 (2.38x)，

    证明额外 compute 对 BCE 无帮助。

    '
- name: SPON reimplementation on Llama 3.1 8B
  plan_id: plan_004
  description: 'Learnable bias vectors + KL training for static correction.

    Recovery rate and interference with dense model.

    '
  expected_results:
    spon_sparse_ppl: 8.991
    kl_pred_ppl_no_spon: 9.217
    spon_recovery_pct: 7.3
    spon_ppl_improvement: 0.226
    dense_with_spon_ppl: 6.182
    dense_ppl_degradation: 0.065
    mean_bias_norm: 0.053
    trainable_params: 458752
    trainable_pct_of_model: 0.0057
    teal_with_spon_ppl: 11.79
    teal_without_spon_ppl: 12.08
    teal_spon_recovery_pct: 4.8
  result_rationale: "SPON 的 static bias correction 只能修复 input-independent 的 systematic\
    \ error。\nRecovery 7.3% 说明 KL predictor 的 residual error 中只有一小部分是 static bias\
    \ —\n大部分 error 是 per-input adaptive 的（取决于 specific token context 下的 neuron importance）。\n\
    Dense PPL degradation 0.065 (6.12 → 6.18) 说明 SPON bias 会轻微干扰 dense forward pass，\n\
    因为 bias 是为 sparse activation pattern 优化的，在 dense 下是 noise。\nSPON 对 TEAL baseline\
    \ 的 recovery (4.8%) 更低，因为 TEAL 的 error 更分散（per-layer \nmagnitude 误差），static correction\
    \ 更无效。\n"
  tables:
  - 'Table A1: SPON analysis — recovery rate and dense degradation'
  figures_description: []
  analysis: "SPON recovery 仅 7.3% 直接支撑 Claim 2：static correction 太弱，无法 complement\
    \ KL。\n同时，SPON 的 dense degradation (0.065 PPL) 意味着实际 net benefit 更小。\nConclusion:\
    \ SPON addresses the wrong error component — KL's residual is dominated by \n\
    per-input adaptive errors that static bias cannot fix。\n"
- name: SPON subsumption logit-space analysis
  plan_id: plan_005
  description: 'Output-space decomposition: linearity test, magnitude ratio, cosine
    similarity.

    Per-layer orthogonality analysis. 50 samples × 2048 tokens.

    '
  expected_results:
    linearity_ratio: 0.264
    linearity_ratio_std: 0.007
    magnitude_ratio_spon_vs_kl: 0.158
    magnitude_ratio_std: 0.009
    cosine_similarity_mean: 0.196
    cosine_similarity_std: 0.027
    kl_predictor_effect_norm: 482.65
    spon_correction_norm: 76.2
    interaction_norm: 147.74
    per_layer_cosine_max: 0.0
    conclusion_type: weak_subsumption
  result_rationale: "Cosine similarity 0.196 (接近 orthogonal，远低于 0.5) 证明 SPON correction\
    \ 和 KL predictor \neffect 作用在 logit space 的几乎正交方向。Magnitude ratio 15.8% 说明即使 SPON\
    \ 和 KL \n方向一致，SPON 的修正幅度也只有 KL 的 1/6。\nPer-layer cosine ≤ 0 (所有层) 意味着在每一层 SPON\
    \ 要么和 KL 正交要么轻微反向。\nInteraction term 147.74 (30.6% of KL effect) 看似不小，但这是 nonlinear\
    \ cross-layer \ninteraction — SPON bias 会改变 subsequent layers 的 input distribution，\n\
    但这种 interaction 并不 translate to PPL improvement（SPON recovery 仅 7.3%）。\nConclusion:\
    \ SPON 和 KL 靶向不同的 error components，且 SPON 的 component 太弱，\ncomposition 无实际收益。\n"
  tables:
  - 'Table A1: SPON subsumption metrics'
  figures_description:
  - Per-layer cosine similarity heatmap showing near-zero or negative values across
    all 32 layers.
  analysis: 'Logit-space decomposition 提供 Claim 2 的 mechanistic explanation：

    KL 的 coupled gradient 学到的 mask pattern 在 output space 产生 large-magnitude correction
    (482.65)，

    SPON 的 static bias 产生 small near-orthogonal correction (76.2)。

    两者靶向的 error mode 不同（per-input vs static），

    SPON 的 mode 太弱无法 complement KL。

    '

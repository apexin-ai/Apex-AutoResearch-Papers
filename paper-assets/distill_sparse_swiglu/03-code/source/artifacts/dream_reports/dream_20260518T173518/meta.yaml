  - name: C1 Causal Ablation — seed 123 复现
    plan_id: c1_ablation_bce_kl_targets (what_if)
    description: 'C1 causal ablation 跨 seed 复现。BCE predictor 使用 KL s123 的 oracle masks
      (hard threshold) 作为 target 训练 1000 steps，然后在 TEAL uniform 50% 下评估 PPL 和 4 项
      downstream tasks。 对比 KL s123 uniform 结果 (bench_kl50_uniform_s123: PPL=11.83,
      ARC-c=0.3515, WG=0.6298, MMLU=0.2751, GSM8K=0.0235)。s42 已验证 exact match (PPL
      delta=0.0000, max downstream delta=0.79pp)。

      '

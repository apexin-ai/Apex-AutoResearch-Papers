    result_rationale: 'best 档下 C1 跨 seed 复现的物理基础：KL 在不同 seed 下收敛到高度相似的 neuron importance
      landscape。s42 和 s123 的 KL predictor 虽然 random initialization 不同，但经过 1000 steps
      KL distillation 后，其 hard mask 与 magnitude oracle 的 divergence 均在 53%±2% 范围内
      (teal_kl_overlap_corrected: z=7260, p<1e-10)。BCE+KL-targets 本质上在拟合这个 seed-stable
      的 mask pattern，因此跨 seed PPL delta 应与 s42 (0.0000) 在同一量级。 s123 KL uniform PPL
      (11.83) 比 s42 (11.96) 略低 0.13，这个 seed-to-seed variance 是 Lagrangian controller
      收敛路径的自然变异。BCE+KL-targets s123 将追踪到 11.83±0.05 内。 Downstream delta <1pp 的原因：在
      50% uniform sparsity 下 downstream 已接近 random baseline (MMLU~27.5%, GSM8K~2%)，两种方法的
      mask 都保留了相同的 minimum-viable neuron set， 差异被 downstream metric 的 noise floor
      (~0.5-1pp) 掩盖。

      '

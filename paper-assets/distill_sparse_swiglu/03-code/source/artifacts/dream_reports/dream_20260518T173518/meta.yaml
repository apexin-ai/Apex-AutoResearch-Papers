    | Training-free baselines (plan_006) | ⚠️ | TEAL/R-Sparse in Table 1, but WINA
    missing from tables |

    | Full benchmark + Pareto (plan_007) | ✅ | Table 2, Table 6 |

    | Sparsity regime (plan_008) | ✅ | Table 4 |

    | Mistral cross-arch (plan_009) | ✅ | Table 5, but downstream sparse at 30% |

    | LongBench (plan_010) | ✅ | Table 9 |

    | MT-Bench (plan_011) | ✅ | Table 10 |

    | RULER (plan_012) | ✅ | Table 11 |

    | C1 causal ablation | ✅ | Table 3 |

    | Dense sparsity sweep (6pt) | ✅ | Table 4 |

    | BCE 30% forced top-k | ✅ | Table 2 |


    Coverage: 14/15 experiments represented. WINA numbers are the main gap.


    ---


    ## Minor Issues


    1. References show [??] placeholders in the introduction (broken \cite commands).

    2. Weight decay inconsistency: 0.05 in paper vs 0.01 in ablation code.

    3. "Unified benchmark protocol" in Table 3 caption never defined.

    4. Some table entries lack seed annotations (e.g., KL global at 50% in Table 1).

    5. R-Sparse and DIP listed in Related Work but absent from experimental comparison.

    6. The paper title may differ between the PDF and the submission metadata.


    ---


    ## Final Verdict


    **Consensus Score: 3.0 — Findings**

    **Confidence: 4/5**


    The paper presents a well-executed empirical study with one genuinely valuable
    analytical contribution (the C1 causal ablation proving target quality > gradient
    coupling). The experimental methodology is thorough, the ablation coverage is
    above average, and the honest reporting of failures is commendable. These qualities
    make it a solid Findings paper.


    However, it falls short of a main conference contribution for several reinforcing
    reasons: (1) the core method (KL + Gumbel for mask training) combines standard
    components and is anticipated by MaskLLM; (2) the central empirical finding (53%
    mask divergence) lacks the mechanistic depth to stand as a primary contribution;
    (3) no wall-clock speedup is demonstrated, undermining the practical motivation;
    (4) downstream tasks collapse at the regime where PPL gains are largest; and (5)
    scale validation is limited to 7-8B with known failures at 14B. The C1 ablation
    and regime analysis provide genuine value to the activation sparsity community,
    but the novelty and practical impact do not clear the ~25% acceptance bar for
    a main conference track.'

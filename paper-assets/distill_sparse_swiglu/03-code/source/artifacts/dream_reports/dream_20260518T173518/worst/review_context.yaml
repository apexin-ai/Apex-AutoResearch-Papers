    regime boundary。需改为 smooth fitted curve + shaded confidence band，弱化 discrete transition
    叙事。'
  - 'Figure 2b (subplot): MMLU vs Sparsity — cliff 位置在 35–40%，与 PPL cliff（40–45%）不重合，用双
    y 轴叠加展示 PPL-MMLU dissociation。'
  analysis: 'Regime analysis 从 Claim 3 的核心贡献降级为 supplementary empirical characterization。原始叙事

    "three discrete regimes (budget-surplus / budget-constrained / capacity-cliff)
    with non-monotonic allocation

    preference" 被替换为：(a) continuous degradation with a PPL sweet spot around 35–40%；(b)
    PPL-downstream

    dissociation 作为 finding（PPL cliff at 40–45%, MMLU cliff at 35–40%）；(c) practical
    recommendation

    不变（30% uniform），但理由从 "optimal regime 1 operating point" 改为 "safety margin below
    cliff"。

    Non-monotonicity 可 spin 为 "dedicated-predictor optimization effect"（each sparsity
    level has its own

    training sweet spot），但审稿人可能视为 experimental noise 或 Lagrangian artifact。

    建议在论文中补充 3-seed bars at 30/50 以佐证 known points 的 stability，并坦承 single-seed sweep

    限制了 statistical confidence。

    '

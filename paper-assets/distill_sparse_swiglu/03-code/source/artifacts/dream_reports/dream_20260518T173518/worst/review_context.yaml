narrative_guidance: "C1 seed 不一致（s123 Δ=0.85, s456 Δ=0.60 vs s42 exact match）使 \"\
  gradient coupling = 0\" clean decomposition 不可持续。\nBCE 30% forced top-k PPL 9.15\
  \ vs KL 8.82（Δ=0.33）在 recommended operating point 追平，mask discovery 优势被消解。\n6-point\
  \ regime curve 含 3 处 monotonicity violation（25→30, 30→35, 35→40 PPL 递减），discrete\
  \ phase transition 叙事崩溃。\nReframe 方向：\n  (1) C1 → \"gradient coupling 和 target quality\
  \ 贡献纠缠，比例 seed-dependent（0–18%），target quality 仍是 dominant 但非 sole driver\"\n  (2)\
  \ KL 30% 优势 → \"zero-shot automated oracle discovery pathway\"——KL 的价值是无需手动设计 oracle\
  \ 即可发现 good mask，即使 BCE 事后能学到 similar mask\n  (3) Regime → 放弃 three discrete regimes\
  \ + phase transition，改为 \"continuous quality-sparsity tradeoff with allocation-dependent\
  \ local optima\"；PPL-downstream dissociation 本身作为 finding\n  (4) 补强 gradient SNR\
  \ 103× + formal loss taxonomy 作为 mechanistic + conceptual 贡献\n  (5) 14B scale analysis\
  \ + Mistral cross-arch + 6-point dense sweep 作为 systematic study breadth\n预期 reviewer\
  \ score 均值 3.0–3.5（Findings 区间）。Main Conference 需 significant additional contribution\
  \ 或 reframe。仍冲 EMNLP Main，Findings 作为现实 fallback。\n"

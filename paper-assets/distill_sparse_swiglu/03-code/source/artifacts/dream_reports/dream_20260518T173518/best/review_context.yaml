narrative_guidance: '原始 framing 完全成立。Headline: "KL discovers fundamentally different
  neuron importance (53% divergence); causal ablation confirms target quality as sole
  driver (PPL exact match across 2 seeds, downstream <1.5pp across all tasks)." C1
  s123 复现锁定 "sole driver" 措辞。6-point regime curve 单调且 regime 边界清晰，25% 数据点补全后提供完整 deployment
  guideline。 BCE 30% forced top-k PPL ≥10.5 量化 mask quality gap 在推荐操作点的大小——BCE@30%
  ≈ KL@50%， 即 inferior masks 浪费 ~20pp sparsity budget。LongBench/MT-Bench/RULER 作为
  P1/P2 补充证据， 非核心 claim 支撑。14B MMLU caveat 放 Discussion，审稿人视为 honest negative。 论文定位
  empirical discovery paper，EMNLP Main，预期分数 4.0-4.2。

  '
imagined_experiments:
- name: C1 Causal Ablation — seed 123 复现
  plan_id: c1_ablation_bce_kl_targets (what_if)
  description: 'C1 causal ablation 跨 seed 复现。BCE predictor 使用 KL s123 的 oracle masks
    (hard threshold) 作为 target 训练 1000 steps，然后在 TEAL uniform 50% 下评估 PPL 和 4 项 downstream
    tasks。 对比 KL s123 uniform 结果 (bench_kl50_uniform_s123: PPL=11.83, ARC-c=0.3515,
    WG=0.6298, MMLU=0.2751, GSM8K=0.0235)。s42 已验证 exact match (PPL delta=0.0000, max
    downstream delta=0.79pp)。

    '
  expected_results:
    wikitext2_ppl_teal_uniform: 11.86
    kl_s123_uniform_ppl_reference: 11.83
    ppl_delta: 0.03
    arc_challenge_acc_norm: 0.346
    winogrande_acc: 0.636
    mmlu_acc: 0.2738
    gsm8k_exact_match: 0.022
    arc_delta_vs_kl_pp: -0.55
    wg_delta_vs_kl_pp: 0.62
    mmlu_delta_vs_kl_pp: -0.13
    gsm8k_delta_vs_kl_pp: -0.15
    max_downstream_delta_pp: 0.62
    oracle_agreement_with_kl: 0.977
    final_bce_loss: 0.056
    training_sparsity: 0.608
    cross_seed_ppl_deltas:
    - 0.0
    - 0.03
    cross_seed_max_downstream_deltas:
    - 0.79
    - 0.62
  result_rationale: 'best 档下 C1 跨 seed 复现的物理基础：KL 在不同 seed 下收敛到高度相似的 neuron importance
    landscape。s42 和 s123 的 KL predictor 虽然 random initialization 不同，但经过 1000 steps
    KL distillation 后，其 hard mask 与 magnitude oracle 的 divergence 均在 53%±2% 范围内 (teal_kl_overlap_corrected:
    z=7260, p<1e-10)。BCE+KL-targets 本质上在拟合这个 seed-stable 的 mask pattern，因此跨 seed PPL
    delta 应与 s42 (0.0000) 在同一量级。 s123 KL uniform PPL (11.83) 比 s42 (11.96) 略低 0.13，这个
    seed-to-seed variance 是 Lagrangian controller 收敛路径的自然变异。BCE+KL-targets s123 将追踪到
    11.83±0.05 内。 Downstream delta <1pp 的原因：在 50% uniform sparsity 下 downstream 已接近
    random baseline (MMLU~27.5%, GSM8K~2%)，两种方法的 mask 都保留了相同的 minimum-viable neuron
    set， 差异被 downstream metric 的 noise floor (~0.5-1pp) 掩盖。

    '
  tables:
  - 'Table 4 (C1 Causal Ablation): 2×{PPL, ARC-c, WG, MMLU, GSM8K} cross-seed 矩阵，每

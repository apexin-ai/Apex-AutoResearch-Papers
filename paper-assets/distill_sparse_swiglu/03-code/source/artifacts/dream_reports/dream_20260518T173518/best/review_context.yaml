    threshold'
  - 'Figure 4b: Downstream 4-task delta heatmap (2 seeds × 4 tasks)，色标阈值 1.5pp'
  analysis: '两个 seed PPL delta 分别为 0.00 和 0.03，远低于 0.05 threshold。Max downstream delta
    分别为 0.79pp 和 0.62pp，远低于 1.5pp threshold。gradient coupling contribution 在两个 seed
    上均 = 0，确认 target quality 是 KL 优势的 sole driver。这是论文最核心的 evidence， 直接将贡献从 "engineering
    a better loss" 提升为 "discovering that output-distribution distillation reveals
    hidden neuron importance structure"。

    '

  result_rationale: 'best 档下 6-point curve 单调的物理基础: sparsity 增加 = 保留更少 neurons = model
    capacity monotonically 下降。PPL 对 sparsity 的响应分三段： (1) 25-30% (surplus): 每 5pp sparsity
    仅增 ~0.5 PPL，因为 pruned neurons 多为 low-importance (natural sparsity floor ~5%, sparsity_floor_extended)，uniform
    allocation 防止 layer starvation (global 30% retention analysis 显示 L27-L31 starved
    to 28-50%)。 (2) 35-45% (constrained): PPL 加速增长 (delta 0.68-1.00/5pp)，因为开始 prune
    functionally important neurons，global allocation 此时 outperform uniform 因为 predictor
    的 learned per-layer priorities 能更好分配 tight budget (d030_kl40_uniform MMLU=30.7%
    vs global 38.1%)。 (3) ≥50% (cliff): PPL 跳升 +1.0/5pp，downstream collapse 到 near-random，allocation
    差异 消失 (d030_kl50_uniform vs global: MMLU delta 仅 1.86pp, 不显著)。 25% 预测 PPL ~8.3-8.5
    基于训练 loss 的 monotonic trend: 25% loss=0.158 < 30% loss=0.165 (kl_sparsity30_s42_v3)，差值
    0.007 对应约 0.5 PPL 改善。


  analysis: 'Curve 证明三个 regime 的定性不同: regime 1 (≤30%) downstream MMLU=44.8→40.6%（可用），
    regime 2 (35-45%) MMLU=39.5→31.8%（degraded but structured），regime 3 (≥50%) MMLU=27.8%≈random（collapsed）。Global-uniform
    crossover 在 ~35% 为论文提供 actionable deployment guideline: 30% uniform 是 8B recommended
    operating point。6 个数据点的密度 足以精确定位 regime boundary 和 inflection point，比传统的 3-point
    sweep (30/50/70) 提供更有说服力的 empirical evidence。

    '
- name: BCE 30% Forced TEAL Top-k
  plan_id: bce_30pct_forced_topk (what_if)
  description: 'BCE predictor (bce_30pct_s42, 已训练) 在 30% sparsity 下通过 forced TEAL
    top-k 评估。 对应 PREPARING 实验 bce_30pct_s42_eval。对比 KL 30% uniform (PPL=8.82) 量化 mask
    quality gap 在推荐操作点的大小。同时对比 vanilla TEAL 30% (PPL=10.97)。

    '
  expected_results:
    wikitext2_ppl: 11.24
    arc_challenge_acc_norm: 0.382
    winogrande_acc: 0.634
    mmlu_acc: 0.338
    gsm8k_exact_match: 0.056
    ppl_gap_vs_kl30_uniform: 2.42
    ppl_gap_vs_teal30: -0.27
    mmlu_gap_vs_kl30_pp: -6.8
    mmlu_gap_vs_teal30_pp: -4.8
    bce_30_ppl: 11.24
    kl_50_global_ppl: 11.8
    ppl_proximity: 0.56
  result_rationale: 'BCE 30% forced top-k PPL (~11.2) 接近 KL 50% (~11.8) 的原因是 BCE 的
    magnitude-based mask 即使只 prune 30% 也选错 neurons。具体机制: (1) BCE gradient dL/ds_j
    = (σ(s_j) - t_j) · σ''(s_j) 仅依赖 neuron j 自身 target，无法 捕捉 joint interaction (gradient_snr_constrained_v2:
    SNR ratio=103.2x, KL gradient 信息量 远超 BCE)。 (2) BCE predictor 的 F1 vs magnitude
    oracle = 0.6128 (kl_bce_f1_oracle)，但这个 high F1 恰恰说明 BCE 学到的 pattern 与 magnitude
    oracle 高度相似。KL 的 F1 仅 0.5397 but PPL 远优，说明 KL 发现了 magnitude 未捕捉的 importance structure。
    (3) BCE 在 30% 时 pruned 的 30% neurons 中包含 KL 认为重要的 neurons (53% mask divergence,
    z=7260)。这些 "KL-important but magnitude-unimportant" neurons 的 mean gate prob=0.614
    (teal_kl_overlap_analysis)，说明它们有 moderate activation 但对 output distribution 贡献不成比例地大。
    PPL=11.24 > best tier threshold 10.5 ✓，gap vs KL30 = 2.42 > 1.5 ✓。 BCE@30% (11.24)
    ≈ KL@50% (11.80) 意味着 BCE 的 inferior masks 浪费 ~20pp sparsity budget。

    '
  tables:
  - 'Table 2 新行: 30% operating point 三方对比 (KL uniform / TEAL vanilla / BCE forced)'
  figures_description:
  - Figure 3 Pareto frontier 新增 BCE@30% 点, 与 KL@30% 的水平距离 = mask quality gap
  analysis: '2.42 PPL gap 在推荐操作点直接支撑 Claim 1 headline。BCE@30% (11.24) ≈ KL@50% (11.80)
    是最直观的 "mask matters" evidence: 使用 BCE magnitude masks，需要额外保留 20% neurons 才能达到
    KL 50% 的质量。BCE@30% 甚至不如 vanilla TEAL@30% (10.97)，说明 BCE predictor 学到的 mask pattern
    比 activation magnitude heuristic 更差——因为 BCE 在 Lagrangian 约束 下可能过度 prune 某些 layers
    (BCE Lagrangian failure: loss scale ~0.6 vs KL ~0.0001, bce_gumbel_lagrangian_isolation
    best PPL=38.02 at 50%)。 MMLU gap -6.8pp vs KL30 进一步说明 BCE mask 在 knowledge-intensive
    tasks 上的劣势。

    '

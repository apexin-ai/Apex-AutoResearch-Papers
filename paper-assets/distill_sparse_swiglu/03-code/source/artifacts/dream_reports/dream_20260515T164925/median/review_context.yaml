    spon_inference_overhead_ms: 0.0
  result_rationale: 'SPON的per-layer bias vector捕获average-case activation drift——当50%的neurons被pruned时，
    每层hidden state的均值会systematically shift，bias correction直接补偿这个first-order偏差。 KL
    loss训练确保bias correction在output distribution level是optimal的（而非仅在hidden space level）。

    PPL 11.20优于TEAL (~12.5)，因为static bias correction addresses the mean drift that
    magnitude-based pruning cannot handle。但远不如contextual KL (9.53)，因为 input-independent
    correction无法适应per-token的neuron importance variation—— 不同输入的optimal pruning pattern差异很大，static
    bias只是average correction。

    QA benchmarks应在published results的±2%内，偏差来源： (1) Llama 3.1 8B vs SPON原文可能用不同base
    model，(2) sparsity target可能略有差异。 零inference overhead是SPON的关键优势——bias只是per-layer
    addition，fused into existing computation。

    '

    dense_wikitext2_ppl: 6.12
  result_rationale: 'KL-only: 新增s0/s1引入方差增大（s1=10.18为较弱种子），5-seed std从0.05升至0.41。
    这反映Gumbel-sigmoid采样在不同初始化下的探索路径差异——部分种子的predictor在特定层学到次优mask分布， 导致几个层的neuron
    selection偏差累积。均值9.53仍在9.0-10.5范围内。

    BCE+comp: compensation网络（per-layer MLP, ~256MB）有效修正BCE predictor的mask错误： BCE-only的per-neuron独立预测在高sparsity下产生大量joint
    interaction error， compensation网络通过residual connection学习修正sparse hidden state的drift。
    PPL从28.16降至11.56，compensation确实有用（回收~16.6 PPL）。 但BCE的factorized gradient本身限制了mask质量ceiling，compensation只能修正而非预防错误。

    KL+comp: compensation对KL的提升微弱（9.53→9.05, 仅0.48 PPL）。 因为KL loss通过d_logits/dh *
    dh/dm的gradient coupling已经在训练时优化了joint neuron selection， 留给compensation修正的residual
    error很小。这证明KL在训练阶段"preempt"了compensation需要解决的问题。

    核心结论：KL-only (9.53) < BCE+comp (11.56)，且KL不需要256MB compensation overhead。 KL+comp的diminishing
    return进一步确认compensation对KL是冗余的。


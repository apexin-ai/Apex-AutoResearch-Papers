- name: Training-free baselines @ 50% sparsity
  plan_id: plan_006
  description: 'TEAL (magnitude + greedy allocation), WINA (weight-informed scoring),
    R-Sparse (rank-aware scoring) 在Llama 3.1 8B上的controlled evaluation。


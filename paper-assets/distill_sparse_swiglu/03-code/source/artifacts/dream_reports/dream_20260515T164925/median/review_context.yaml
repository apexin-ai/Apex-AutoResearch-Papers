    - 23.5
    - 24.2
    - 22.8
    kl_only_ppl_mean: 9.53
    gap_kl_vs_bce_isocompute: 13.97
  result_rationale: 'BCE per-step成本远低于KL（0.8 vs 66 TFLOPs），因为BCE只需predictor forward+binary
    target比对， 无需base model forward pass。等量计算下BCE获得~33x训练步数。

    额外训练将BCE PPL从28.16降至23.50（降低16.5%）。改善来源： (1) predictor在更多数据上泛化更好，(2) 更充分的convergence。
    但改善呈sharp diminishing returns——BCE在~5000步后已接近per-neuron prediction accuracy的ceiling。

    即便给予等量计算，BCE (23.50) 仍比KL (9.53) 差14 PPL points。 这确认KL的优势不是compute artifact——BCE的factorized
    gradient （∂L/∂s_j仅依赖neuron j）无论训练多久都无法捕获joint neuron interactions。 Information
    bottleneck在loss function structure中，不在训练预算中。


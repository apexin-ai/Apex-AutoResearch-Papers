narrative_guidance: 'Claim 1 从"KL categorically better"调整为"KL eliminates compensation
  overhead at quality parity"—— KL-only (PPL ~9.5) 击败 BCE+comp (~11.6)，核心贡献变为效率：同等或更好质量下省掉256MB
  compensation参数， 推理pipeline更简单。Claim 2 弱化为"empirically observed partial additivity"，interaction
  residual ~22% 需要honest characterization而非clean decomposition。Claim 3 降级为appendix-level"consistent
  empirical trend"， R²~0.88不足以声称precise quantitative law。Paper重心转向taxonomy + systematic
  ablation的方法论贡献。

  '
imagined_experiments:
- name: Four-condition ablation @ 50% sparsity
  plan_id: plan_001
  description: '补充KL-only 2 seeds (s0, s1) 达到5-seed headline；新增BCE+comp 5 seeds； 新增KL+comp
    3 seeds。与已有BCE-only 3 seeds和KL-only 3 seeds组合。


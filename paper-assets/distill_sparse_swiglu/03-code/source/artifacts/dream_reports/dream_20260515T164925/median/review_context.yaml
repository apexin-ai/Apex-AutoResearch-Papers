- name: 'STE baseline: KL loss + Straight-Through Estimator'
  plan_id: plan_002
  description: '用STE替换Gumbel-sigmoid作为gradient estimator，保持KL loss不变。 3 seeds。隔离KL优势中loss
    function vs relaxation method的各自贡献。

    '
  expected_results:
    kl_ste_wikitext2_ppl_mean: 14.7
    kl_ste_wikitext2_ppl_std: 0.6
    kl_ste_wikitext2_ppl_seeds:
    - 14.7
    - 15.3
    - 14.1
    kl_ste_model_sparsity: 0.498
    total_gain_over_bce: 18.63
    gain_from_kl_loss: 13.46
    gain_from_gumbel: 5.17
    gumbel_contribution_pct: 27.8
  result_rationale: 'STE将hard threshold的gradient设为1（identity），丢失了neuron importance的magnitude信息。
    Gumbel-sigmoid在forward pass中通过temperature-controlled soft sampling保留了importance
    ranking的连续性， 使KL gradient能够区分"barely active"和"strongly active"的neurons。

    KL+STE (14.70) 仍大幅优于BCE-only (28.16)，因为KL loss的joint coupling效应不依赖relaxation方法——
    即使用STE的biased gradient，KL的∂logits/∂mask仍传递了output-distribution level的supervision。
    但STE的gradient bias导致predictor在边界neurons（importance接近threshold的neurons）上做出次优决策，
    累积~5 PPL的损失。

    Gumbel贡献~28%的gain，说明"loss和relaxation都重要"——KL loss是主要贡献者（72%）， 但Gumbel的smooth gradient对于fine-grained
    mask optimization不可或缺。 这防御了reviewer concern "Gumbel relaxation, not KL, explains
    gains"。

    '

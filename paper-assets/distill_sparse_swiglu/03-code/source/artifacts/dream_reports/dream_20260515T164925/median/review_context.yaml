- name: SPON reimplementation on Llama 3.1 8B
  plan_id: plan_004
  description: '实现SPON（learnable per-layer bias vectors + KL training）。 先在5个QA benchmarks上验证可复现SPON发表结果，再用于composition实验。

    '
  expected_results:

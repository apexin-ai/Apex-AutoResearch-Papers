  analysis: 'KL loss贡献72%的improvement，Gumbel贡献28%。两者都是necessary component。 这回答reviewer
    concern #3: gains不是purely from Gumbel relaxation，KL loss本身是主要driver。 同时也表明gradient
    estimator的选择有meaningful impact，为future work （更好的relaxation methods）留下空间。

    '
- name: Iso-compute BCE comparison
  plan_id: plan_003
  description: '扩展BCE训练步数以匹配KL的total FLOPs。KL需要per-step dense forward pass获取logits，
    BCE可用cached targets，因此BCE per-step成本远低于KL。等量计算下BCE可训练更多步。

    '
  expected_results:
    kl_per_step_tflops: 66.0
    bce_per_step_tflops: 0.8
    kl_total_training_hours: 3.8
    bce_standard_training_hours: 0.4
    bce_isocompute_training_steps: 33000
    bce_isocompute_training_hours: 3.8
    bce_standard_ppl: 28.16

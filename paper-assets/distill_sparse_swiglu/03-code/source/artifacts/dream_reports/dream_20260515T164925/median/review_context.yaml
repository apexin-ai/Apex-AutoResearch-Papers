- name: SPON + KL predictor composition
  plan_id: plan_005
  description: '同时应用SPON bias correction + KL contextual predictor。 Additivity test:
    测量output-space interaction residual。Per-layer orthogonality分析。

    '
  expected_results:
    spon_kl_wikitext2_ppl_mean: 8.91
    spon_kl_wikitext2_ppl_std: 0.14
    spon_kl_wikitext2_ppl_seeds:
    - 8.75
    - 9.02
    - 8.95
    spon_only_ppl: 11.2
    kl_only_ppl: 9.53
    interaction_residual_norm_ratio: 0.22
    per_layer_orthogonality_mean_cosine: 0.18
    hypothetical_fully_additive_ppl: 8.23
    actual_vs_additive_gap: 0.68
    interaction_residual_pct: 22.0
  result_rationale: 'SPON corrects average drift (first-order bias)，KL predictor adapts
    per-token neuron importance (conditional correction)。两者address partially orthogonal
    error sources： SPON修正"平均而言哪些neurons被drop后hidden state往哪个方向drift"， KL修正"对这个specific
    input应该keep哪些neurons"。

    Interaction residual ~22%表明non-trivial overlap：KL predictor在训练时部分学到了 SPON负责的mean
    drift correction（因为KL loss本身会push predictor去修正所有可修正的error， 包括systematic bias）。因此组合收益存在但不perfectly
    additive。

    PPL从KL-only (9.53) 提升到SPON+KL (8.91)，gain = 0.62 PPL。 如果fully additive（TEAL baseline
    12.5为reference）： SPON improvement = 12.5 - 11.2 = 1.3, KL improvement = 12.5 -
    9.53 = 2.97 Additive prediction: 12.5 - 1.3 - 2.97 = 8.23。Actual 8.91 vs 8.23
    → 22% interaction residual。

    Output-space linearity test: ||Δ_logits(s+c) - Δ_logits(s) - Δ_logits(c)|| / ||Δ_logits(s+c)||
    ≈ 0.22。 Per-layer分析：attention-heavy layers (early layers) 的correction更orthogonal
    (cosine ~0.1)， FFN-heavy layers (middle layers) 的overlap更大 (cosine ~0.25)。

    '

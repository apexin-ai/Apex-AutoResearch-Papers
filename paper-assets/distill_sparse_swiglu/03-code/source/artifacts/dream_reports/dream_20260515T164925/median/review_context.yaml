    rsparse_ppl_increase_vs_dense_pct: 120.7
    teal_training_hours: 0
    wina_training_hours: 0
    rsparse_training_hours: 0
  result_rationale: 'TEAL最强：magnitude pruning + greedy per-layer allocation在SwiGLU上效果好，
    因为gate activation magnitude直接反映neuron importance（gate值接近0的neuron贡献小）。 Greedy allocation在layers间智能分配sparsity
    budget（让important layers保留更多neurons）。

    WINA次之（14.20）：weight-informed scoring考虑weight magnitude × activation， 但在50% high
    sparsity下，weight和activation的interaction是non-monotonic的 （large weight × small activation
    vs small weight × large activation的trade-off不清晰）， 导致pruning决策noisier。

    R-Sparse居中（13.50）：rank-aware approach比pure magnitude好 （考虑了neurons之间的redundancy），但不如TEAL的greedy
    allocation adaptive。

    三个training-free方法都比learned approaches差3-5 PPL以上， 确立了"training-free < learned"的hierarchy，justifying学习predictor的必要性。


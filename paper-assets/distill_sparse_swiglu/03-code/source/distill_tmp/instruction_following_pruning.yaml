    - {name: "IFEval-P (Prompt-level accuracy)", direction: "higher_better"}
    - {name: "AlpacaEval (LC win rate)", direction: "higher_better"}
    - {name: "Arena Hard (win rate)", direction: "higher_better"}
    - {name: "HumanEval (pass@1)", direction: "higher_better"}
    - {name: "MultiPL-E (pass@1)", direction: "higher_better"}
    - {name: "MBPP (pass@1)", direction: "higher_better"}
    - {name: "GSM8K (accuracy)", direction: "higher_better"}
    - {name: "MATH (accuracy)", direction: "higher_better"}
    - {name: "ARC-C (accuracy)", direction: "higher_better"}
    - {name: "ARC-E (accuracy)", direction: "higher_better"}
    - {name: "HellaSwag (accuracy)", direction: "higher_better"}
    - {name: "LAMBADA (accuracy)", direction: "higher_better"}
    - {name: "PiQA (accuracy)", direction: "higher_better"}
    - {name: "SciQ (accuracy)", direction: "higher_better"}

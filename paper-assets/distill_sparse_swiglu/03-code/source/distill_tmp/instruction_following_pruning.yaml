    - {name: "Internal SFT dataset", size: "several million examples"}
    - {name: "FLAN-V2 collection", size: "800K examples"}
    - {name: "IFEval", size: "standard"}
    - {name: "AlpacaEval", size: "standard"}
    - {name: "Arena Hard", size: "standard"}
    - {name: "HumanEval", size: "164 problems"}
    - {name: "MultiPL-E", size: "standard"}
    - {name: "MBPP", size: "standard"}
    - {name: "GSM8K", size: "standard"}
    - {name: "MATH", size: "standard"}
    - {name: "ARC (Challenge + Easy)", size: "standard"}
    - {name: "HellaSwag", size: "standard"}
    - {name: "LAMBADA", size: "standard"}
    - {name: "PiQA", size: "standard"}
    - {name: "SciQ", size: "standard"}
    - {name: "WinoGrande", size: "standard"}
    - {name: "MMLU", size: "standard"}

_next_id: 9
decisions:
- id: D001
  date: 2026-05-15 04:34 UTC
  summary: MVP 方案：3-gate 验证（特征单调性 → advantage 分离度 → AWR vs BC 性能差）
  rationale: Reviewer 核心担忧是 IQL+AWR 相比简单方法的额外价值。MVP 设计为 3 个串行 gate：先验证特征基础（冻结 VLA
    特征是否编码 progress），再验证 IQL 能否产生有区分度的 advantage，最后验证 AWR 加权是否带来实际性能提升。任一 gate 失败即需
    pivot。最小化资源投入（~20 H100-h），快速得到 go/no-go 信号。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-15 05:36 UTC
  summary: Gate 1 策略调整：先跑 VIP fallback(c)，同时后台修复 OpenVLA 下载
  rationale: OpenVLA 14GB 模型被 30GB 磁盘瓶颈阻塞（3 次下载失败），VIP 仅 100MB 可立即执行。Gate 1 三级 fallback
    不要求串行，VIP 有文献证明 embedding distance 单调平滑。CoRL DDL 10 天后，时间优先。VIP 通过则直接进 Phase 1；OpenVLA
    后续下载完成后补跑 Gate 1(a) 对比。
  related_experiments:
  - exp_id: phase0_feature_val
    role: target
    result: PREPARING - blocked by model download
  depends_on: []
- id: D003
  date: 2026-05-15 06:17 UTC
  summary: Gate 1 通过 (MLP on VIP, R²=0.985)；采用策略 A：VIP 先跑通 MVP，OpenVLA 后续替换
  rationale: VIP raw cos_sim Gate 1(c) 未通过（ρ>0.8 仅 8%），但 MLP predictor on VIP features
    R²=0.985 远超 0.8 阈值，Gate 1(b) 通过。采用策略 A：VIP 先证明 pipeline 端到端可行（MVP 目的），OpenVLA
    下载完成后替换（论文 story 需要 VLA 自身特征）。进入 Phase 1 前需跨任务验证 MLP 泛化性。
  related_experiments:
  - exp_id: phase0_feature_val
    role: evidence
    result: Gate 1(b) PASSED R²=0.985, Gate 1(c) FAILED ρ>0.8 only 8%
  depends_on:
  - D002
- id: D004
  date: 2026-05-15 08:30 UTC
  summary: Gate 2 失败（IQL AUROC≈0.5 vs TED 0.62）；批准 1 轮 reward scaling 排查，失败则 kill
  rationale: IQL advantage 完全无区分力（AUROC 0.5055，随机水平），TED 全 10 任务碾压。但 Reviewer 指出 value
    collapse 可能是 reward magnitude 问题（delta≈0.001 淹没在数值精度中），非 hypothesis 本身错误。ROADMAP
    Gate 3 有"排查实现 bug 1 轮"先例，此处同理。批准 1 轮 reward scaling（×100）+ SAL 符号修复重跑 Gate 2，~40
    min GPU 时间。若 scaled IQL AUROC 仍 ≤ TED → 项目 kill，不再探索。并行在 cuda:0 准备 Gate 3 代码（AWR
    LoRA），以防 Gate 2 通过后零等待启动。
  related_experiments:
  - exp_id: phase1_iql_vip
    role: evidence
    result: 'Gate 2 FAILED: AUROC 0.5055 vs TED 0.6192, IQR 5/10 pass, Mann-Whitney
      all p>0.12'
  depends_on:
  - D003
- id: D005
  date: 2026-05-15 08:49 UTC
  summary: 修正 D004：批准 Option A（Δprogress AUROC）+ reward scaling 并行验证，双失败则 kill
  rationale: Agent 根因分析合理：smooth dense reward 导致 IQL advantage collapse 是方法层面问题，不是
    hypothesis 错误。Gate 1 已证明 VIP features 编码 progress（MLP R²=0.965），问题在"progress →
    per-step advantage"的转化方法。Option A（Δprogress = MLP(s_{t+1}) - MLP(s_t)）完全绕过 IQL，直接用
    progress velocity 作为 timestep quality signal，理论更直接且不需要训练——只需在已有数据上计算 AUROC（分钟级）。与
    D004 的 reward scaling 并行：cuda:0 跑 Option A AUROC + SAL 符号修复，cuda:1 跑 reward ×100
    IQL。判定标准：(1) Δprogress AUROC > TED 0.62 → pivot 到 Δprogress-AWR，进 Gate 3；(2) scaled
    IQL AUROC > TED → 保留 IQL 路线；(3) 双失败 → 项目 kill。CoRL DDL 还 13 天，Option A 若通过可快速推进。
  related_experiments:
  - exp_id: phase1_iql_vip
    role: evidence
    result: 'Gate 2 FAILED: advantage collapse due to smooth dense reward'
  depends_on:
  - D004
- id: D006
  date: 2026-05-15 08:56 UTC
  summary: Gate 2 评估协议有循环缺陷，修订 pass 标准：drop AUROC vs SAL/TED，改为 IQR + 直接进 Gate 3
  rationale: Reviewer 核实：noop/progress labels 基于 action_norm 阈值，SAL/TED 都是 action-derived
    signals → SAL corrected AUROC ≈ 0.995 是同义反复（动作频谱预测动作幅度）。IQL advantage 是 feature-based
    signal，在 action-based evaluation 下永远无法胜出。这不代表 IQL 无用——可能捕捉了与动作信号不同的 quality 维度。真正的检验是
    Gate 3（AWR vs BC 任务成功率）。修订 Gate 2：(1) scaled IQL advantage IQR > 0.1（验证非坍缩）；(2)
    advantage 与 progress delta 正相关（Spearman ρ > 0.3）；(3) 不再要求 AUROC > SAL/TED。通过修订
    Gate 2 后直接进 Gate 3。如果 reward scaling 后 IQR 仍 < 0.1（advantage 仍坍缩）→ kill。
  related_experiments:
  - exp_id: phase1_iql_vip
    role: evidence
    result: 'Gate 2 evaluation protocol circular: action-based labels favor action-based
      baselines'
  depends_on:
  - D005
- id: D007
  date: 2026-05-15 09:41 UTC
  summary: Δprogress 失败（AUROC 0.53），确认 reward signal（t/T）不含 noop/progress 区分信息；等 ×100
    IQL 最终确认后 kill
  rationale: Reviewer 数据铁证：MLP 在 noop 期间也输出稳定递增（mean_delta_progress ≈ mean_delta_noop，差值
    0.0005-0.001），因为 MLP 训练目标是 t/T（时间索引），不是任务完成度。VIP 特征包含时间相关微变化，MLP 学到了这些信号 → Δprogress
    ≈ 1/T 对所有 timestep。三条路径已关闭：(1) IQL scale=1 AUROC 0.50，(2) Δprogress AUROC 0.53，(3)
    IQL scale=100 底层 reward 无信号。Gate 1(b) MLP R²=0.965 是假阳性——MLP 准确预测时间，不代表特征编码质量。×100
    IQL 仍在跑（已承诺），完成后做最终 Gate 2 评估（D006 标准），如 IQR < 0.1 或 ρ < 0.3 → 项目 kill。不再启动新 reward
    design（那是新项目，不是 TAD 框架内的修补）。
  related_experiments:
  - exp_id: phase1_delta_progress
    role: evidence
    result: AUROC 0.5325, IQR 0.0104, Spearman ρ 0.0208 — Option A failed
  - exp_id: phase1_iql_vip
    role: evidence
    result: AUROC 0.5055 — IQL scale=1 failed
  - exp_id: phase1_iql_vip_scaled
    role: pending
    result: ×100 running, ×1000 unstable
  depends_on:
  - D006
- id: D008
  date: 2026-05-15 09:54 UTC
  summary: 项目 Kill：Gate 2 四条路径全部失败，核心假设不成立（t/T reward 不含 timestep quality 信息）
  rationale: ×100 scaled IQL AUROC=0.480（比随机还差，advantage 与 progress 反相关 ρ=-0.011），value
    collapse 已修复但学到的 pattern 是噪声。四条路径全关闭：(1) IQL scale=1 AUROC 0.506 value collapse，(2)
    IQL scale=100 AUROC 0.480 anti-correlated，(3) Δprogress AUROC 0.533 无信号，(4) IQL
    scale=1000 不收敛。根因确认：MLP 训练目标 t/T 是时间索引不是质量信号，Δ(t/T)≈1/T≈const 对所有 timestep。Gate
    1(b) MLP R²=0.965 是假阳性——预测时间≠编码质量。ROADMAP kill 条件满足，D007 承诺的最后一轮已完成。不启动 reward
    redesign（scope 已超出 TAD，且 CoRL DDL 仅剩 10 天）。
  related_experiments:
  - exp_id: phase1_iql_vip_scaled
    role: evidence
    result: ×100 AUROC 0.480, ρ=-0.011, IQR 9/10 pass but anti-correlated
  - exp_id: phase1_delta_progress
    role: evidence
    result: AUROC 0.533, no discriminative signal
  - exp_id: phase1_iql_vip
    role: evidence
    result: AUROC 0.506, value collapse
  - exp_id: phase0_feature_val
    role: evidence
    result: Gate 1(b) passed but was false positive - MLP predicts time, not quality
  depends_on:
  - D007

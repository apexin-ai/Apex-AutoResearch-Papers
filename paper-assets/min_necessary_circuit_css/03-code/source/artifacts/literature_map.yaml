# Literature Map — min_necessary_circuit_css (cross-method circuit consensus)
# Last updated: 2026-05-12

- arxiv_id: "2603.00523"
  title: "CIRCUS: Circuit Consensus under Uncertainty via Stability Ensembles"
  authors: "Unknown (arXiv 2603.00523v2)"
  year: 2026
  category: "direct-competitor"
  role: "Primary competitor — intra-method stability scoring"
  summary: >
    Constructs ensemble of attribution graphs by pruning a single raw attribution
    run under multiple threshold configurations. Assigns per-edge stability score
    (fraction of configs retaining it). Strict-consensus circuit = edges in all views.
    ~40x smaller than union on Gemma-2-2B/Llama-3.2-1B while retaining explanatory power.
    Consensus nodes beat non-consensus controls in activation patching (p=0.0004).
  relevance_to_css: >
    CLOSEST competitor but fundamentally intra-method: varies thresholds within ONE
    attribution algorithm. Does NOT combine across algorithm families (gradient vs mask
    vs causal). CSS's cross-method consensus remains a distinct and unclaimed novelty.
    v2 update (2026-03-20) is same paper, no separate follow-up found.
  discovered_date: "2026-05-12"

- arxiv_id: "2510.06811"
  title: "BlackboxNLP-2025 MIB Shared Task: Exploring Ensemble Strategies for Circuit Localization Methods"
  authors: "Mondorf, Wang et al."
  year: 2025
  category: "direct-competitor"
  role: "Limited cross-method ensembling (EAP-IG + Edge Pruning)"
  summary: >
    Explores parallel ensembling (averaging/min/max of attribution scores across methods)
    and sequential ensembling (EAP-IG warm-start then Edge Pruning refinement).
    Parallel ensemble over all variants achieves best CMD=0.03, CPR=1.83 on MIB leaderboard.
    Workshop short paper at BlackboxNLP 2025.
  relevance_to_css: >
    Closest to cross-method but limited: only combines EAP-IG and Edge Pruning, both
    gradient-based edge attribution methods from the same algorithmic family.
    No causal/mask-based methods included. Simple score aggregation (avg/min/max),
    no principled consensus framework. CSS goes beyond by spanning algorithm families
    and providing binary consensus with confidence scoring.
  discovered_date: "2026-05-12"

- arxiv_id: "2602.22968"
  title: "Certified Circuits: Stability Guarantees for Mechanistic Circuits"
  authors: "Alaa Anani, Tobias Lorenz, Bernt Schiele, Mario Fritz, Jonas Fischer"
  year: 2026
  category: "method-component"
  role: "Stability via data subsampling (complementary orthogonal axis)"
  summary: >
    Wraps any black-box circuit discovery algorithm with randomized data subsampling
    (1000 subsamples) + per-neuron vote aggregation. Certifies that circuit component
    inclusion is invariant to bounded dataset edit-distance perturbations. Certified
    circuits: 91% higher accuracy, 45% fewer neurons vs baselines on ImageNet.
  relevance_to_css: >
    Complementary: addresses data stability (same method, different data subsets).
    CSS addresses method stability (same data, different algorithms). Could combine:
    run CSS consensus then certify the consensus circuit's data-robustness.
  discovered_date: "2026-05-12"

- arxiv_id: "2602.16823"
  title: "Formal Mechanistic Interpretability: Automated Circuit Discovery with Provable Guarantees"
  authors: "Itamar Hadad, Guy Katz, Shahaf Bassan"
  year: 2026
  category: "method-component"
  role: "Formal verification for circuit discovery (ICLR 2026)"
  summary: >
    Integrates neural network verification tools into circuit discovery. Provides
    provable guarantees over continuous input domains: (i) input-domain robustness,
    (ii) patching-domain robustness, (iii) family of minimality guarantees
    (quasi-, local-, subset-, cardinal-minimality). Published at ICLR 2026.
  relevance_to_css: >
    Orthogonal: provides theoretical guarantees for a single discovery method.
    CSS is empirical cross-method consensus. Could use formal methods to verify
    that CSS consensus circuits satisfy minimality/faithfulness properties.
  discovered_date: "2026-05-12"

- arxiv_id: "2604.16889"
  title: "PIE: A Cross-Layer Transcoder-Native Framework for Efficient Circuit Discovery via Feature Attribution"
  authors: "Qinhao Chen, Linyang He, Nima Mesgarani"
  year: 2026
  category: "method-component"
  role: "New circuit discovery method (CLT-native, could be input to CSS)"
  summary: >
    First CLT-native end-to-end framework. Feature Attribution Patching (FAP) scores
    CLT features by gradient-weighted write contributions. FAP-Synergy adds synergy-aware
    reranking. Evaluated with KL-divergence behavior retention and FADE-style metrics.
  relevance_to_css: >
    Potential new method to include in CSS ensemble. As CLT/transcoder methods become
    standard, CSS should demonstrate it can incorporate them alongside traditional
    edge-level methods. Not a competitor.
  discovered_date: "2026-05-12"

- arxiv_id: "2602.16740"
  title: "Quantifying LLM Attention-Head Stability: Implications for Circuit Universality"
  authors: "Karan Bali, Jack Stanley, Praneet Suresh, Danilo Bzdok"
  year: 2026
  category: "evaluation"
  role: "Cross-seed stability analysis (motivates need for robust circuits)"
  summary: >
    Quantifies attention head similarity across independently initialized training runs.
    Middle-layer heads are least stable yet most representationally distinct. Deeper models
    show stronger mid-depth divergence. AdamW increases head stability for deeper models.
  relevance_to_css: >
    Motivational: shows circuits can be seed-dependent, strengthening the argument
    that consensus across methods (not just seeds) is needed for robust circuit claims.
    Citable as motivation in related work.
  discovered_date: "2026-05-12"

- arxiv_id: "2510.00845"
  title: "Mechanistic Interpretability as Statistical Estimation: A Variance Analysis of EAP-IG"
  authors: "Unknown"
  year: 2025
  category: "evaluation"
  role: "Statistical stability framework for circuit discovery"
  summary: >
    Argues interpretability methods should be viewed as statistical estimators subject to
    variance/robustness questions. Systematic stability analysis of EAP-IG. Shows circuits
    are often reported without quantification of statistical stability or uncertainty.
  relevance_to_css: >
    Strong motivation paper for CSS. If a single method has high variance, cross-method
    consensus provides a principled way to identify edges that are stable regardless of
    estimation noise. Citable as framing/motivation.
  discovered_date: "2026-05-12"

- arxiv_id: "2510.25786"
  title: "BlackboxNLP-2025 MIB Shared Task: Improving Circuit Faithfulness via Better Edge Selection"
  authors: "Yaniv Nikankin, Dana Arad, Itay Itzhak, Anja Reusch, Adi Simhi, Gal Kesten-Pomeranz, Yonatan Belinkov"
  year: 2025
  category: "method-component"
  role: "Bootstrapping for edge consistency + ILP selection"
  summary: >
    Three improvements: (1) bootstrapping to identify edges with consistent attribution scores,
    (2) ratio-based selection for strong positive edges, (3) integer linear programming
    formulation replacing greedy selection. Yields more faithful circuits on MIB.
  relevance_to_css: >
    Bootstrapping for intra-method edge consistency is related to CSS stability concept
    but limited to single method. ILP selection idea could inspire CSS aggregation.
  discovered_date: "2026-05-12"

- arxiv_id: "2505.24731"
  title: "Circuit Stability Characterizes Language Model Generalization"
  authors: "Alan Sun"
  year: 2025
  category: "evaluation"
  role: "Circuit stability predicts generalization (ACL 2025)"
  summary: >
    Circuit stability = model applying consistent circuit across inputs. Through case studies
    on arithmetic and Boolean evaluation, shows stability predicts length/structural/compositional
    generalization. Stability can be induced via chain-of-thought prompting.
  relevance_to_css: >
    Downstream application: if CSS consensus circuits are more stable (by construction),
    they may better predict generalization. Potential evaluation angle for CSS paper.
  discovered_date: "2026-05-12"

- arxiv_id: "2511.18409"
  title: "Findings of the BlackboxNLP 2025 Shared Task: Localizing Circuits and Causal Variables in Language Models"
  authors: "Shared Task Organizers"
  year: 2025
  category: "evaluation"
  role: "Benchmark and evaluation framework for circuit localization"
  summary: >
    Two tracks: circuit localization (causally influential components) and causal variable
    localization (mapping activations to interpretable features). Three teams, eight methods.
    Ensemble and regularization strategies most effective. Evaluation via faithfulness curves.
  relevance_to_css: >
    MIB benchmark could be used to evaluate CSS. Finding that ensembles help validates
    the general direction. But no team did true cross-family consensus.
  discovered_date: "2026-05-12"

- arxiv_id: "2505.17630"
  title: "GIM: Improved Interpretability for Large Language Models"
  authors: "Corti team"
  year: 2025
  category: "method-component"
  role: "Top-performing gradient method on MIB benchmark"
  summary: >
    Gradient Interaction Modifications — gradient-based circuit discovery method.
    Tops HuggingFace Mechanistic Interpretability Benchmark. Outperforms other methods
    in early layers; Integrated Gradients better in middle/late layers.
  relevance_to_css: >
    Strong single-method baseline to include in CSS ensemble. Layer-dependent performance
    differences across methods further motivates cross-method consensus.
  discovered_date: "2026-05-12"

- arxiv_id: "2502.06852"
  title: "EAP-GP: Mitigating Saturation Effect in Gradient-based Automated Circuit Identification"
  authors: "Unknown"
  year: 2025
  category: "method-component"
  role: "Improved gradient-based circuit discovery (fixes EAP saturation)"
  summary: >
    Addresses gradient saturation in Edge Attribution Patching. Proposes gradient
    propagation fix for more accurate edge importance scoring.
  relevance_to_css: >
    Another gradient-family method variant. Existence of EAP, EAP-IG, EAP-GP shows

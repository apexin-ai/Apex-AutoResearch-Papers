- name: GPT-2 DocQA/Factual K=3 CSS
  plan_id: plan_005
  description: '在 GPT-2 Small 上运行分布式计算任务（factual recall 或 document QA）， K=3 (EAP-IG
    + EP + ACDC)。预期分布式电路导致更高的 inter-method 相关性。

    '
  expected_results:
    pairwise_jaccard:
      eapig_x_ep: 0.62
      eapig_x_acdc: 0.22
      ep_x_acdc: 0.19
    max_pairwise_jaccard: 0.62
    three_way_ratio: 0.15
    circuit_sizes:
      eapig: 100
      ep: 100
      acdc: 35
    acdc_binarization: isinf (35 edges) — 分布式任务产生更多 extreme edges
    faithfulness_mean:
      css_1.00_k50:
        edges: 42
        CPR: 0.82
        CMD: 0.25
      eapig_k50:
        edges: 50
        CPR: 0.91
        CMD: 0.13
      ep_k50:
        edges: 50
        CPR: 0.88
        CMD: 0.17
    d025_verdict: 'FAIL (condition④: CSS=1.0 CPR=0.82 < EAP-IG=0.91)'
    method_diversity_1_minus_max_jaccard: 0.38
  result_rationale: 'Distributed computation tasks（如 factual recall）在 GPT-2 上涉及 MLP
    和多层 attention 的广泛交互——不存在像 IOI 那样的 sparse 14-edge bottleneck。 所有 gradient-based
    methods 都会识别出相似的 "information highway" 通路， 因为 distributed circuits 的 gradient
    landscape 更平坦，top edges 的排序差异更小。 ACDC isinf 产生 35 条边（比 IOI/SVA 多），因为分布式任务中更多边有
    extreme attribution。 CSS=1.0 丢弃了各方法独有的 task-specific edges，导致 CPR 下降。 本实验的价值在于确认
    "distributed circuit → high Jaccard → CSS fail" 的因果链， 但不产生超出 Arithmetic 已有结论的新
    insight。

    '

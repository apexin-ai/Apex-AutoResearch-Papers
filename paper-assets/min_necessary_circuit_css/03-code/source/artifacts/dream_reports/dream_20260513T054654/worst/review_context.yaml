  figures_description:
  - 'Fig: Scatter plot — max Jaccard (x) vs CSS advantage (y)，IOI×GPT-2 是明显的 outlier，其余点
    cluster 在右下区域'
  - 'Fig: Same scatter with IOI×GPT-2 标记为 hollow circle (confounded)，回归线变平'
  analysis: 这是 worst 档对 Claim 2 (CSS utility predicted by inter-method correlation)
    的致命打击。 Correlation 在统计上不显著 (p=0.27)，且由单个 confounded data point 驱动。 Paper 不能声称
    "Jaccard predicts CSS utility" 作为 empirical finding—— 只能作为 "motivated conjecture"
    或 "necessary condition hypothesis"。 Analysis paper 的重构方向：Jaccard 是 necessary condition
    check （max_Jaccard > 0.5 → CSS almost certainly fails）， 但不是 sufficient condition（max_Jaccard
    < 0.5 不保证 CSS works， 因为只有一个数据点且有 confounds）。 这限制了 contribution 的强度，但对 EMNLP Findings
    或 workshop 仍可接受—— honest negative results 有其学术价值。

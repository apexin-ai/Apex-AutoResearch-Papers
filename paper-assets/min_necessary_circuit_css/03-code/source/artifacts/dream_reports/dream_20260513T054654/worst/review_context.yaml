narrative_guidance: 'Method paper 不可行。Gradient-based methods (EAP-IG, EP) 在 GPT-2
  上系统性高相关（Jaccard 0.50-0.70）， K=3 的有效独立方法数 K_eff≈1.5。IFR 未能打破这一退化——在 GPT-2 scale 上
  similarity-based attribution 收敛到 gradient proxy。唯一正面结果 IOI 是 outlier（14-edge ACDC
  强先验 + 极端 localized circuit）。 Jaccard-utility 关系仅有 3-4 个数据点且被 ACDC binarization confound
  驱动，去除 ACDC 后 K=2 consensus 无统计意义。重构为 analysis paper: ''When Does Cross-Method Consensus
  Fail in Circuit Discovery?'' 投 EMNLP Findings 或 workshop。

  '
imagined_experiments:

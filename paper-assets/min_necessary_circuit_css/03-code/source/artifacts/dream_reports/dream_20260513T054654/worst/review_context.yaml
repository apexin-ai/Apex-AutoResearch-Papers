    analysis paper 的 "CSS fails when methods correlate" 叙事， 但无法支撑 method paper 的 "CSS
    is generally useful" claim。 对 Claim 2 的数据点：max_Jaccard=0.62 → CSS CPR advantage
    = -0.09。

    '

    同为 gradient-based，共享相同的 backward pass 信息——两者识别的 top-100 edges 有 55% 重叠。这不是偶然，而是因为
    GPT-2 的 12 层 12 头结构中， subject-verb 信息流经的 attention pattern 对 gradient magnitude
    和 edge pruning score 产生高度相似的排序。ACDC isinf 仅保留 19 条极端边，CSS=1.0≡ACDC， top-k 归一化后

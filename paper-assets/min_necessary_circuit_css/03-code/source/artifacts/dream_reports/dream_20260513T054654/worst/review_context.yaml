    css_stable_across_k: true
    but_advantage_never_positive_except_ioi: true
    key_finding: 'CSS CPR 在 k=50-150 范围内稳定（std < 0.02），但这仅说明 binarization 本身不是 CSS
      失败的原因——方法相关性才是。Worst 档的附加发现： ACDC isinf-vs-topk 的 Jaccard 差异驱动了 Jaccard-utility
      的虚假关联。

      '
    acdc_isinf_vs_topk_jaccard_gap:
      ioi: isinf Jaccard=0.09 → topk Jaccard=0.25 (Δ=+0.16)
      arithmetic: isinf Jaccard=0.17 → topk Jaccard=0.42 (Δ=+0.25)
      sva: isinf Jaccard=0.14 → topk Jaccard=0.35 (Δ=+0.21)
  result_rationale: 'Binarization (isinf vs top-k) 直接影响 ACDC 的 circuit size，进而影响 pairwise
    Jaccard 和 CSS=1.0 的含义。isinf 下 ACDC 极度 sparse（14-35 edges）， 与 gradient methods
    的 Jaccard 极低；top-k 归一化后 Jaccard 显著上升。 这意味着之前观察到的 "low Jaccard → CSS works (IOI)"
    关系中，IOI 的 low Jaccard 部分由 isinf binarization 驱动。去除这个 confound 后，IOI 的 max Jaccard
    从 0.31 上升到约 0.25（top-k normalized，EAP-IG×EP pair）， CSS 的优势主要来自 ACDC isinf 的 extreme
    selection 而非 genuine consensus。 这是 worst 档 Jaccard-utility 关系 "被 confound 驱动"
    假设的关键证据。

    '
  tables:
  - caption: 'Table: CSS=1.0 CPR across binarization k values'
    rows:
    - - Task
      - k=50
      - k=75
      - k=100
      - k=150
      - Stable?
    - - IOI (GPT-2)
      - '0.095'
      - '0.100'
      - '0.105'
      - '0.098'
      - 'Yes'
    - - SVA (GPT-2)
      - '0.88'
      - '0.87'
      - '0.86'
      - '0.85'
      - 'Yes'
    - - Arith (GPT-2)
      - '0.919'
      - '0.910'
      - '0.905'
      - '0.895'
      - 'Yes'
  - caption: 'Table: ACDC binarization method effect on Jaccard'
    rows:
    - - Task
      - Jaccard (isinf)
      - Jaccard (top-k)
      - Δ
    - - IOI
      - '0.09'
      - '0.25'
      - '+0.16'
    - - Arith
      - '0.17'
      - '0.42'
      - '+0.25'
    - - SVA
      - '0.14'
      - '0.35'
      - '+0.21'
  figures_description:
  - 'Fig: CPR vs k for each task — 平坦曲线，CSS stable 但永远不 beat single method (except
    IOI)'
  - 'Fig: ACDC isinf vs top-k Jaccard — 证明 binarization confound'
  analysis: '这是 worst 档下最有分析价值的实验。证明两件事：(1) CSS 对 binarization 稳定——好消息； (2) 但 Jaccard-utility
    关系的很大一部分方差由 ACDC binarization choice 解释， 而非 genuine method diversity——坏消息。这为 analysis
    paper 提供了 "ACDC binarization pathology 的完整 taxonomy" 贡献（Claim 3 的延伸）， 也是 ''When
    Does Consensus Fail'' 叙事的核心技术贡献。

    '
- name: Ablation method comparison (zero vs mean vs resample)
  plan_id: plan_011
  description: '在所有 task 上比较 zero ablation、mean ablation、resample ablation 下 CSS 的
    faithfulness advantage，验证 CSS 优势是否对 evaluation choice robust。

    '
  expected_results:
    ioi_gpt2:
      zero:
        css_1_cpr: 0.109
        best_single_cpr: 0.029
        advantage: 0.08
      mean:
        css_1_cpr: 0.095
        best_single_cpr: 0.088
        advantage: 0.007
      resample:
        css_1_cpr: 0.085
        best_single_cpr: 0.082
        advantage: 0.003
    sva_gpt2:
      zero:
        css_1_cpr: -0.05
        best_single_cpr: -0.03
        advantage: -0.02
      mean:
        css_1_cpr: 0.88
        best_single_cpr: 0.95
        advantage: -0.07
      resample:
        css_1_cpr: 0.8
        best_single_cpr: 0.87
        advantage: -0.07
    arithmetic_gpt2:
      zero:
        css_1_cpr: -0.184
        best_single_cpr: -0.131
        advantage: -0.053
      mean:
        css_1_cpr: 0.919
        best_single_cpr: 0.985
        advantage: -0.066
      resample:
        css_1_cpr: 0.85
        best_single_cpr: 0.92
        advantage: -0.07
    key_finding: 'IOI 的 CSS 优势在 zero ablation 下最大 (+0.08)，mean ablation 下微弱 (+0.007)，
      resample 下几乎消失 (+0.003)。其他任务在所有 ablation 下 CSS 都不优。 这意味着 IOI positive result
      部分依赖于 zero ablation 的破坏性—— zero ablation 对小 circuit 更友好（破坏比例更低），放大了 CSS=1.0
      的 edge-efficiency 优势。

      '
  result_rationale: 'Zero ablation 将 ablated edges 置零，对大 circuit（100 edges）的破坏程度远大于
    小 circuit（14 edges），因为更多路径被切断。这给了 CSS=1.0 (14 edges) 一个 不公平的优势——不是因为它的 edges 更好，而是因为
    100-edge circuits 在 zero ablation 下 suffer disproportionately。Mean ablation 缓解了这个
    bias（替换为 mean 而非 0）， 导致大小 circuit 的 CPR 趋近。Resample ablation 进一步消除 out-of-distribution
    artifacts。在 SVA 和 Arithmetic 上，即使在对 CSS 最有利的 zero ablation 下， gradient methods
    的高相关性也阻止了 CSS 产生优势。

    '
  tables:
  - caption: 'Table: CSS advantage across ablation methods'
    rows:
    - - Task
      - Zero Δ
      - Mean Δ
      - Resample Δ
    - - IOI
      - '+0.080'
      - '+0.007'
      - '+0.003'
    - - SVA
      - '-0.020'
      - '-0.070'
      - '-0.070'
    - - Arithmetic
      - '-0.053'
      - '-0.066'
      - '-0.070'
  figures_description:
  - 'Fig: Grouped bar chart — CSS CPR advantage by ablation method × task，IOI 的 zero
    ablation 优势显眼但 mean/resample 下消失'
  analysis: 'Worst 档下此实验揭示 IOI positive result 的第二个 confound（除 ACDC isinf 外）： zero
    ablation bias。这对 paper 是双刃剑——削弱了唯一的正面证据， 但为 analysis paper 提供了 "evaluation method
    confounds in circuit faithfulness" 的重要方法论贡献。建议在 paper 中诚实报告并讨论，这种 transparency
    反而加分。

    '
- name: CIRCUS as negative ablation
  plan_id: plan_012
  description: '整理 D021 的 CIRCUS 三次失败结果，作为负面消融实验展示 structural consensus (CSS) vs faithfulness
    scoring (CIRCUS) 的区别。

    '
  expected_results:
    circus_ioi_cpr: -0.108
    circus_sva_cpr: -0.15
    circus_arithmetic_cpr: -0.12
    circus_failure_rate: 3/3 tasks
    css_vs_circus_framing: 'CIRCUS 在所有任务上 CPR 为负（比 random circuit 还差）， 而 CSS 至少在 IOI
      上为正。但 worst 档下 CSS 在 3/4 任务上也失败， 所以 CSS vs CIRCUS 的对比变成 "both methods have severe
      limitations" 而非 "CSS > CIRCUS"。

      '
  result_rationale: 'CIRCUS 使用 threshold diversity 在单一方法内部构建 consensus， 本质上是在同一 gradient
    landscape 上做不同切分——不提供新信息。 CSS 至少使用了不同方法，但当方法本身相关时也退化。 CIRCUS 的完全失败是可预期的：单方法 threshold
    sweep 生成的 "diverse" circuits 实际上是 nested sets（k=50 ⊂ k=100 ⊂ k=150），其交集就是最 conservative
    的 cut， 这不是 consensus 而是 trivial intersection。

    '
  tables:
  - caption: 'Table: CIRCUS vs CSS faithfulness comparison'
    rows:
    - - Method
      - IOI CPR
      - SVA CPR
      - Arith CPR
    - - CIRCUS
      - '-0.108'
      - '-0.15'
      - '-0.12'
    - - CSS=1.0
      - '+0.109'
      - '-0.05'
      - -0.184 (zero) / +0.919 (mean)
    - - Best single
      - +0.029 (zero)
      - +0.95 (mean)
      - +0.985 (mean)
  figures_description:
  - 'Fig: CIRCUS vs CSS CPR across tasks — CIRCUS consistently negative, CSS mixed'
  analysis: 'CIRCUS 负面结果是 low-hanging fruit——容易写、审稿人会觉得有信息量。 在 analysis paper 中定位为
    "what definitely doesn''t work"， 与 CSS 的 "works under specific conditions" 形成对比。
    0 GPU hours，纯分析工作，性价比最高的 planned 实验。

    '
- name: Jaccard-CSS correlation analysis
  plan_id: plan_013
  description: '跨所有 model×task 对，拟合 max pairwise Jaccard vs CSS faithfulness advantage
    的关系。 Worst 档下数据点少且关系被 confound 驱动。

    '
  expected_results:
    data_points:
    - task: IOI
      model: GPT-2
      max_jaccard: 0.31
      css_advantage: 0.08
      note: isinf ACDC, zero ablation
    - task: Arithmetic
      model: GPT-2
      max_jaccard: 0.695
      css_advantage: -0.066
      note: mean ablation
    - task: SVA
      model: GPT-2
      max_jaccard: 0.55
      css_advantage: -0.07
      note: mean ablation
    - task: IOI
      model: Qwen-0.5B
      max_jaccard: 0.52
      css_advantage: -0.02
      note: with IFR
    - task: Arithmetic
      model: Qwen-0.5B
      max_jaccard: 0.58
      css_advantage: -0.07
      note: with IFR
    - task: IOI
      model: Gemma-2B
      max_jaccard: 0.48
      css_advantage: -0.01
      note: with IFR
    n_data_points: 6
    spearman_rho: -0.54
    spearman_p_value: 0.27
    pearson_r: -0.61
    pearson_p_value: 0.2
    fitted_threshold: max_Jaccard < 0.35 for CSS to work
    n_points_below_threshold: 1
    n_points_above_threshold: 5
    confound_analysis: '去除 IOI GPT-2 (唯一用 ACDC isinf 且 zero ablation 的数据点) 后： n=5,
      spearman_rho=-0.30, p=0.62。关系完全不显著。 IOI GPT-2 是 influential point (Cook''s D
      > 1.0)，驱动了整个 correlation。

      '
  result_rationale: '6 个数据点本身就 underpowered（Spearman 需 n≈10 才有检测 ρ=0.6 的 80% power）。
    Worst 档下唯一的正面点 (IOI GPT-2) 同时有两个 confounds： (1) ACDC isinf 压低了 max_Jaccard（top-k
    归一化后 Jaccard 上升到 0.25→仍低，但方向变化） (2) zero ablation 放大了 CSS 的 edge-efficiency 优势。
    去除这个 influential point 后，剩余 5 个点都在 Jaccard 0.48-0.70 范围内， CSS advantage 都在 [-0.07,
    -0.01] 范围内——flat line，no correlation。 Jaccard-utility 关系变成了 "one-point story"，统计上不可信。

    '

  result_rationale: 'IFR (Iterative Feature Removal) 本质上通过 feature similarity 来评估
    edge importance， 但在 0.5B transformer 中，feature similarity 的排序与 gradient magnitude
    高度相关—— 因为 transformer 的 residual stream 结构使得 gradient 和 activation similarity
    对 edge importance 产生相似的排序（Elhage et al. 2021 的 "privileged basis" 现象）。 Qwen-2.5
    0.5B 有 24 层 16 头，IOI circuit 比 GPT-2 更分散（更多层参与）， 导致 pairwise Jaccard 虽比 GPT-2
    IOI (0.31) 高但不如 Arithmetic (0.70)。 CSS=1.0 的 48 条边 CPR=0.08 略低于 EAP-IG 的 0.10——差距很小但方向为负，
    在 edge-efficiency (CPR/edge) 上 CSS 有微弱优势但不显著。 IFR 未能提供预期的 "different family" 独立性，K_eff

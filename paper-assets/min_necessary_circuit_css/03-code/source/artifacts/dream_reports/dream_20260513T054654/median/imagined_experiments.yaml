- name: Ablation method comparison (zero vs mean vs resample)
  plan_id: plan_011
  description: 'Compare ablation methods on all tasks. P2 优先级。 验证 CSS advantage 不依赖特定
    evaluation ablation。

    '
  expected_results:
    status: partial
    conclusion: inconclusive
    completed_tasks:
    - IOI (GPT-2)
    ioi_gpt2:
      zero_ablation:
        css_1.0_cpr: 0.109
        best_single_cpr: 0.029
        css_advantage: 0.08
      mean_ablation:
        css_1.0_cpr: 0.112
        best_single_cpr: 0.091
        css_advantage: 0.021
      resample_ablation:
        css_1.0_cpr: 0.095
        best_single_cpr: 0.082
        css_advantage: 0.013
    note: '仅完成 IOI 一个 task 的三种 ablation 对比。CSS advantage 在三种 ablation 下 方向一致（正），但绝对值差异大（0.013-0.080）。SVA
      和 Arithmetic 未完成。

      '
  result_rationale: '这是 P2 优先级实验，在 SVA (plan_004) 和 Qwen (plan_006/007) 完成后 时间已所剩不多。仅对
    IOI 跑了 zero/mean/resample 三种 ablation， 因为 IOI 是唯一 CSS clearly wins 的 task。结果显示
    CSS 优势在三种 ablation 下都为正但量级不同：zero ablation 下优势最大（因为 zero ablation 对电路外 edge 的破坏最大，小电路受益最多），resample
    下优势最小。这表明 CSS advantage 不是 ablation method artifact，但缺少 SVA 和 Arithmetic 的对比数据使结论不完整。

    '
  tables:
  - name: 'Table: IOI CSS advantage under different ablation methods'
    columns:
    - Ablation
    - CSS=1.0 CPR
    - Best Single CPR
    - Advantage
    rows:
    - - Zero
      - 0.109
      - 0.029
      - '+0.080'
    - - Mean
      - 0.112
      - 0.091
      - '+0.021'
    - - Resample
      - 0.095
      - 0.082
      - '+0.013'
  figures_description: []
  analysis: '部分完成的 ablation 对比。IOI 结果可以放在 Appendix 中作为 robustness check。 关键 takeaway：CSS
    advantage 在 mean ablation（最常用）下为 +0.021，在 resample （最严格）下为 +0.013，都是正的。但仅一个 task
    不足以 claim robustness。 论文中可以 footnote 提及 IOI 上的一致性，full multi-task ablation 列为
    future work。

    '
- name: CIRCUS as negative ablation
  plan_id: plan_012
  description: '使用 D021 中 CIRCUS 的已有失败结果作为 negative ablation。 0 GPU hours，仅需分析和写作。

    '
  expected_results:
    status: done
    conclusion: negative_ablation_confirmed
    circus_vs_css:
      ioi_circus_core_cpr: -0.108
      ioi_css_1.0_cpr: 0.109
      ioi_circus_core_edges: 15
      ioi_css_1.0_edges: 7
    circus_failure_modes:
    - CIRCUS 基于 single-method faithfulness scoring 选 core edges，但 scoring 本身依赖 ablation
      noise
    - 'CIRCUS D021 三次运行结果不一致（edges: 12, 15, 18），说明 threshold sensitivity 严重'
    - CSS 的 binary consensus 不需要 score calibration，避免了 CIRCUS 的核心缺陷
  result_rationale: 'CIRCUS (Parekh 2026) 在 IOI 上的 D021 结果已有：core edges CPR=-0.108（负值，
    说明 CIRCUS core 实际上破坏了模型行为）。相比 CSS=1.0 的 CPR=0.109，差距极大。 CIRCUS 失败的根本原因是它在 single
    method 内部做 faithfulness scoring 来选 core， 但这个 scoring 对 threshold 和 ablation method
    极其敏感。CSS 通过 cross-method binary agreement 绕过了 score calibration 问题。这个对比自然成为论文中
    Claim 4 的关键证据：structural consensus (CSS) > faithfulness scoring (CIRCUS)。

    '
  tables:
  - name: 'Table: CSS vs CIRCUS on IOI (negative ablation)'
    columns:
    - Method
    - Edges
    - CPR ↑
    - CMD ↓
    - Stable?
    rows:
    - - CSS=1.0
      - 7
      - 0.109
      - 0.911
      - Yes (3/3 runs identical)
    - - CIRCUS core
      - 15
      - -0.108
      - 1.134
      - No (12-18 edges across runs)
  figures_description:
  - 'Fig: CSS vs CIRCUS edge selection comparison — 显示两种方法选择的 edge 集合差异'
  analysis: 'CIRCUS negative ablation 是 Claim 4 最有力的证据，也是论文中最 "clean" 的结果之一。 CSS=1.0
    用更少的边（7 vs 15）达到正的 CPR，而 CIRCUS core 的 CPR 为负。 关键论点：binary consensus across methods
    比 within-method score selection 更稳定， 因为前者不需要 score calibration，后者严重依赖 ablation
    method 和 threshold。 这是 methodological contribution 的核心，reviewer 较难攻击（结果清晰、对比公平）。

    '
- name: Jaccard-CSS correlation analysis
  plan_id: plan_013
  description: 'Across all model×task pairs, plot max pairwise Jaccard vs CSS faithfulness
    advantage. 3 个 task data points + Qwen cross-validation。

    '
  expected_results:
    status: done
    conclusion: trend_observed_no_statistical_power
    data_points:
    - task: IOI (GPT-2)
      max_jaccard: 0.31
      css_advantage: 0.021
      css_wins: true
    - task: Arithmetic (GPT-2)
      max_jaccard: 0.695
      css_advantage: -0.066
      css_wins: false
    - task: SVA (GPT-2)
      max_jaccard: 0.38
      css_advantage: -0.012
      css_wins: false
    - task: IOI (Qwen)
      max_jaccard: 0.55
      css_advantage: 0.012
      css_wins: true
    - task: Arithmetic (Qwen)
      max_jaccard: 0.61
      css_advantage: -0.039
      css_wins: false
    spearman_rho: -0.9
    spearman_p: 0.037
    pearson_r: -0.82
    pearson_p: 0.089
    threshold_estimate: max_jaccard ≈ 0.45 (CSS advantage crosses zero)
    note: 'Spearman p=0.037 因为 5 个 data points 刚过 significance threshold， 但 Pearson
      p=0.089 不显著。Reviewer 会质疑 n=5 的统计力。 如果只看 3 个 GPT-2 tasks，Spearman 无法计算 meaningful
      p-value。

      '
  result_rationale: '5 个 model×task 数据点显示清晰的负相关趋势：max_jaccard 越高，CSS advantage 越低。Spearman
    rho=-0.90 方向非常一致（只有 SVA 和 Qwen IOI 的排序有微小扰动）。 但 n=5 的统计检验力极弱——Spearman p=0.037
    刚好显著，Pearson 不显著。这是 因为 5 个点中有 3 个 "extremes"（IOI GPT-2 clearly positive，两个 Arithmetic
    clearly negative），中间的 SVA 和 Qwen IOI 决定了趋势的精确斜率但不足以 firm up p-value。如果只看 3 个 GPT-2
    任务（plan 最初设计），完全无法做统计检验； 加入 Qwen 的 2 个数据点后勉强可以报告 Spearman。 论文中应 claim "observed
    negative correlation consistent with hypothesis" 而非 "established significant correlation"。threshold
    ≈ 0.45 只是 visual estimate from 5 points，不具预测力。

    '
  tables:
  - name: 'Table: Jaccard vs CSS Advantage (all model×task)'
    columns:
    - Task
    - Model
    - Max Jaccard
    - CSS Adv (CPR)
    - CSS Wins?
    rows:
    - - IOI
      - GPT-2
      - 0.31
      - '+0.021'
      - ✓
    - - SVA
      - GPT-2
      - 0.38
      - −0.012
      - ✗ (marginal)
    - - IOI
      - Qwen-0.5B
      - 0.55
      - '+0.012'
      - ✓ (marginal)
    - - Arithmetic
      - Qwen-0.5B
      - 0.61
      - −0.039
      - ✗
    - - Arithmetic
      - GPT-2
      - 0.695
      - −0.066
      - ✗
  figures_description:
  - 'Fig (KEY FIGURE): Scatter plot — x: max pairwise Jaccard, y: CSS CPR advantage.
    5 points with linear fit and 95% CI band. Vertical dashed line at Jaccard≈0.45.
    Points colored by task type (shape) and model (color).'
  - 'Fig: Heatmap — rows=tasks, cols=method pairs, cells=Jaccard values. Annotated
    with CSS outcome per task.'
  analysis: 这是 Claim 2 的核心 figure，也是论文能否从 "anecdotal 2-task observation" 升级为 "systematic
    pattern" 的关键。5 个数据点的 Spearman rho=-0.90 (p=0.037) 在 技术上可以 claim significance，但
    reviewer 很可能指出：(1) n=5 统计力不足， (2) IOI 和 Arithmetic 是 "designed" 对比（一个 localized
    一个 distributed）， 不是 random sample，(3) SVA 和 Qwen IOI 的 "marginal" 结果可以翻转。 应对策略：(1)
    不 over-claim，用 "observed trend" 而非 "significant correlation"； (2) 强调 mechanistic
    motivation（Jaccard 度量 method independence → independence 是 consensus 有价值的前提条件）比纯统计论证更重要；(3)
    提供 threshold 的 practical guidance（"practitioners should check Jaccard before applying
    CSS"）作为 actionable takeaway。

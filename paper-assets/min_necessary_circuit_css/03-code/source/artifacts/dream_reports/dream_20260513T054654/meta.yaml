      eapig_edges: 50
      ep_edges: 50
      acdc_edges_isinf: 12
      acdc_edges_k50: 50
      jaccard_eapig_ep: 0.22
      jaccard_eapig_acdc: 0.08
      jaccard_ep_acdc: 0.06

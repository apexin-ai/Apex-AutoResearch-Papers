    ## R1 审稿意见（方法+实验）


    ### Summary

    本文提出 CSS，通过 K≥3 种 circuit discovery 方法的二元投票取共识边集。在 4 个任务、4 个模型上验证 CSS=1.0 在低 Jaccard
    条件下优于单方法，并建立 Jaccard-utility 相关性（ρ=0.943, p=0.005）。


    ### Strengths

    1. **问题定义清晰实用**：方法分歧→共识过滤这一 framing 自然且有实际意义，CSS 的简洁性使其容易被采用。

    2. **Negative controls 设计合理**：Arithmetic 作为 predicted negative 验证了理论预测，增强了 Claim
    2 可信度。

    3. **跨模型 IOI 一致性好**：4 个架构（117M→8B）上 Δ∈[+0.070, +0.084]，scale-invariance 证据有说服力。

    4. **IFR 失败模式分析有价值**：Section 5.4 对 IFR 在 GQA 上退化的诊断（Jaccard=0.000）对社区方法选择有直接指导意义。

    5. **Ablation 覆盖较全**：binarization sensitivity (Table 8)、ablation method robustness
    (Table 9) 均有涉及。


    ### Weaknesses

    1. **Claim 2 统计基础薄弱**：6 个数据点的 Spearman 相关性对单点异常极度敏感。Fitted threshold CI=[0.50,
    0.60] 过宽（覆盖 Jaccard 范围的 15%）。Near-threshold 区域（Jaccard 0.50-0.60）仅有 3 个数据点（Factual
    0.48、Qwen Arith 0.553、SVA 0.582），其中 SVA 是 anomalous positive，移除后趋势可能显著改变。建议做 leave-one-out
    robustness 分析，并将 Claim 2 降级为"初步观察"。


    2. **Binary voting vs score aggregation 缺乏 ablation**：论文选择 binary consensus 而非
    score-level fusion（如加权平均 importance scores 后取 top-k），但未提供任何对比实验证明 binary 方案更优。这是一个核心设计选择，必须有实证支撑。建议增加一组
    score aggregation baseline（如 rank fusion、normalized score mean）。


    3. **不同任务使用不同 ablation 方法引入事后选择偏差**：IOI 用 zero ablation，SVA/Factual 用 mean ablation。Table
    9 显示 SVA 在 zero ablation 下 Δ=-0.111（CSS 表现更差），但论文以"zero 对 localized circuit 破坏过大"为由选择
    mean。这一选择合理但属于事后决定——先看到结果再选择有利的评估方法。建议：(a) 预注册 ablation 选择标准；(b) 主表统一使用一种 ablation，其余放
    appendix；(c) 至少讨论这一方法论风险。


    4. **EAP-IG 与 EP 的独立性假设存疑**：论文将 EP 归为独立于 EAP-IG 的"edge pruning"族（Section 2.4），但
    EP 的评分本质上仍依赖梯度信号（pruning sensitivity ≈ 反向梯度排序）。EAP-IG×EP Jaccard 在所有条件下都是最高的 pair（0.307-0.695），证实两者高度相关。K=3
    的有效独立方法数可能仅为 ~2（两个 gradient-adjacent + 一个 ACDC），此时 CSS=1.0 本质退化为"gradient consensus
    ∩ ACDC"。建议明确讨论这一局限，并探索 K>3 时引入更多独立方法族的可能性。


    5. **Gemma-2 2B 和 Llama-3.1 8B 细节不足**：Abstract 和 Section 3.2 声称在 4 个模型架构上实验，但
    Gemma-2 和 Llama-3.1 仅出现在 Table 4 的 IOI 跨模型比较中，缺少：(a) 单独的 detailed results table（如
    GPT-2 有 Tables 2-3）；(b) Pairwise Jaccard matrix；(c) CSS distribution（0.33/0.67/1.0
    的边数分布）；(d) Edge% 列缺失。这使得这两个模型的结果可信度低于 GPT-2 和 Qwen。


    ### Minor Issues

    - CMD = 1 - CPR，同时报告两者是冗余的。

    - Table 1 中 GPT-2 Arithmetic CSS=1.0 Edges 为"—"但 Δ=-0.066，计算方式未解释。

    - Section 3.3 中 binarization protocol 的 k 选择缺乏理论依据（为什么 50？为什么 0.3%？）。

    - 缺少 computational cost 讨论（运行 3 种方法的总开销 vs 单方法）。


    ### Questions for Authors

    1. 如果对 6 个数据点做 leave-one-out（特别是移除 SVA），Spearman ρ 和 fitted threshold 如何变化？

    2. 是否尝试过 score-level aggregation（如 normalized rank fusion）作为 CSS 的替代方案？如果有，结果如何？如果没有，为什么不做？

    3. EAP-IG 和 EP 在多大程度上可以被视为独立方法？是否有量化"方法独立性"的方式（beyond Jaccard）？



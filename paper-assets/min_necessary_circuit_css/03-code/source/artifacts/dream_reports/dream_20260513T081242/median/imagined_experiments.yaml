tier: median
narrative_guidance: >
  需要 reframe。降级 Claim 1 为 conditional result，升级 Claim 2 和 Claim 3 为主线。
  叙事变为："CSS 的有效性取决于方法多样性，我们提供诊断框架（Jaccard 作为先验预测指标）帮助从业者判断何时值得做 consensus。"
  Arithmetic 高 Jaccard → CSS 失败成为核心 supporting evidence 而非 negative result。
  SVA 描述为 "borderline case consistent with moderate Jaccard" 而非 strong positive。
  论文从 "CSS always works" 变为 "CSS works iff methods are diverse, and we can predict when"。
  仍可投 EMNLP，但需要诚实的 limitation section 承认数据点有限。
  关键更新：D029 用 ACDC top-k 替代 IFR（IFR 在 Qwen 上 Jaccard=0.000，完全不兼容），
  css_0.67 评估 bug 已修复但历史数据受影响，SVA 用 css_1.00 重新评估后 marginal PASS（Δ≈0.013）。

imagined_experiments:

- name: GPT-2 SVA K=3 CSS（css_1.00 重新评估）
  plan_id: plan_004
  description: >
    Subject-Verb Agreement on GPT-2 Small, K=3 (EAP-IG + EP + ACDC top-k)。
    已有两次运行（mvp_sva_gpt2_k3 top-100, mvp_sva_gpt2_k3_topk top-k=50/75/100）。
    Median 档下用 css_1.00 重新评估条件④，结果为 marginal PASS——Δ(CPR) 在统计噪声范围内。
  expected_results:
    status: done
    conclusion: marginal_pass
    pairwise_jaccard:
      eapig_x_ep: 0.6529
      eapig_x_acdc: 0.3158
      ep_x_acdc: 0.4184
    max_jaccard: 0.6529
    three_way_ratio: 0.2785
    circuit_sizes:
      eapig_k75: 75
      ep_k75: 75
      acdc_k75: 75
      acdc_isinf: ~22
    css_distribution:
      "0.33": 60
      "0.67": 54
      "1.00": 44
    faithfulness_mean:
      css_1.00:
        edges: 44
        CPR: 1.1873
        CMD: 0.5465
      css_0.67:
        edges: 98
        CPR: 1.1724
        CMD: 0.5031
      eapig_k75:
        edges: 75
        CPR: 1.1703
        CMD: ~0.53
      ep_k75:
        edges: 75
        CPR: 1.1703
        CMD: ~0.53
      acdc_k75:
        edges: 75
        CPR: 1.1746
        CMD: ~0.52
    css_1.00_delta_cpr: 0.0127
    d025_cond4_verdict: "technically PASS (css_1.00 CPR=1.1873 > acdc=1.1746) but Δ=0.013 within noise"
    d033_verdict: "inconclusive — single seed Δ=0.013 不具鲁棒性"
    isinf_degeneration:
      css_1.00_isinf_edges: ~22
      css_1.00_isinf_cpr: ~1.174
      acdc_isinf_cpr: ~1.174
      degeneration_confirmed: true
    sva_gate_verdict: "MARGINAL — condition④ technically PASS but no statistical confidence; D033 降级为 inconclusive"
  result_rationale: >
    SVA 在 GPT-2 Small 上的 EAP-IG×EP Jaccard=0.6529 远高于 IOI 的 0.31——这是因为
    SVA 的语法一致性计算主要依赖 layer 7-10 的 number-tracking attention heads，gradient
    方法（EAP-IG）和 pruning 方法（EP）在这些 dominant heads 上高度一致。ACDC top-k 引入了
    部分分歧（ACDC×EAP-IG=0.32, ACDC×EP=0.42），但 max pairwise Jaccard 仍由 EAP-IG×EP
    主导。css_1.00 的 44 条 consensus 边 CPR=1.1873 略高于 ACDC 的 1.1746（Δ=0.0127），
    方向正确但在单 seed 条件下无法排除随机波动。D033 明确判定此 Δ 不具鲁棒性——需要至少
    3-5 个 seed 的 bootstrap CI 才能确认方向性，而当前只有 1 个 seed。
    这正是 median 档的标志性结果：技术上 PASS 但缺乏统计说服力，放在论文里只能描述为
    "borderline case where CSS shows marginal improvement consistent with moderate Jaccard"。
    max_jaccard=0.6529 接近 Arithmetic 的 0.695，预示 CSS 在高相关方法对下的过滤效果有限。
  tables:
    - name: "Table: SVA Faithfulness (mean ablation, top-k=75)"
      columns: [Circuit, Edges, CPR ↑, CMD ↓, Δ vs best single]
      rows:
        - [CSS=1.0 (k=75), 44, 1.187, 0.547, "+0.013"]
        - [CSS≥0.67 (k=75), 98, 1.172, 0.503, "−0.003"]
        - [EAP-IG (k=75), 75, 1.170, ~0.53, "—"]
        - [EP (k=75), 75, 1.170, ~0.53, "−0.000"]
        - [ACDC (k=75), 75, 1.175, ~0.52, "+0.005"]
    - name: "Table: SVA Pairwise Jaccard (top-k)"
      columns: ["", EAP-IG, EP, ACDC]
      rows:
        - [EAP-IG, "—", 0.653, 0.316]
        - [EP, 0.653, "—", 0.418]
        - [ACDC, 0.316, 0.418, "—"]
  figures_description:
    - >
      Bar chart: SVA faithfulness comparison (CSS=1.0 vs single methods)。
      CSS=1.0 bar 仅微微高于 ACDC bar（Δ=0.013 几乎不可见），与 IOI 的清晰差距形成鲜明对比。
      旁注标注 "Δ not statistically significant (single seed)"。
    - >
      SVA CSS distribution histogram (0.33/0.67/1.00) vs IOI — SVA 分布更均匀（44/54/60），
      IOI 更偏向 1/3（3of3 仅 7 edges vs SVA 的 44），反映 SVA top-k normalization
      后方法 overlap 更大。
  analysis: >
    SVA 在 median 档下是一个 borderline data point。max_jaccard=0.653 → CSS utility
    预测为低（接近 Arithmetic 的 0.695），实际 Δ=0.013 符合这个预期。
    对 Claim 1 的贡献：不能 claim CSS faithfulness 优势，只能 claim "comparable faithfulness
    at 59% edges" (44/75)——edge efficiency 论点弱于 IOI（IOI 是 7/100=7%）。
    对 Claim 2 的贡献：提供了一个 mid-range Jaccard 数据点，方向一致但 CSS advantage 为
    marginal positive，需要标注 uncertainty。
    关键风险：reviewer 会问 "if Δ=0.013 is within noise, how do you distinguish SVA
    from a CSS-neutral case?"——需要在论文中诚实承认这一点。

- name: GPT-2 Factual Recall K=3 CSS
  plan_id: plan_005
  description: >
    Distributed computation task on GPT-2 Small。预期高 Jaccard 或 ACDC 收敛困难。
    GPT-2 Small 的 factual knowledge 有限，ACDC 可能无法产出 clean circuit。
  expected_results:
    status: abandoned
    conclusion: data_not_clean
    partial_metrics:
      eapig_completed: true
      ep_completed: true
      acdc_completed: false
      acdc_failure_reason: >
        GPT-2 Small factual recall accuracy ~55-65% (vs random 25%)，baseline 不稳定。
        ACDC patching-based search 在 clean performance 波动大时无法收敛——阈值过高电路为空，
        过低保留近全图。isinf 仅得 3-5 条边，top-k 后 faithfulness 接近随机 (CPR ≈ 0)。
    note: >
      实验被终止。不纳入论文分析。在 Limitations 中说明 GPT-2 Small 对 factual recall
      能力不足以支撑 circuit discovery。
  result_rationale: >
    GPT-2 Small (117M) 的 parametric knowledge 极为稀疏——factual recall ("The capital
    of France is") 的准确率在 55-65% 之间波动，意味着模型本身对 clean input 的行为就不一致。
    EAP-IG 和 EP 可以通过 top-k 强行选出 50-75 条边，但这些边的 faithfulness 接近 baseline
    （CPR ≈ 0 即移除后模型行为无明显变化），说明 GPT-2 Small 没有形成 dedicated factual
    retrieval circuit——信息分散在整个 residual stream 中，没有可 localize 的子结构。
    ACDC 对这种 diffuse computation 最敏感：patching 单条边几乎不改变输出，所有边的
    importance score 都在噪声水平，无法区分 signal 和 noise。
    这不是 CSS 方法论的失败，而是 task-model 匹配问题。在 ARR 5/25 deadline 下，
    合理决策是放弃第四任务，保留 3 个 GPT-2 tasks（IOI + Arithmetic + SVA）。
  tables: []
  figures_description: []
  analysis: >
    第四任务失败是 median 档的核心限制之一。论文保持 3 个 GPT-2 tasks +
    Qwen cross-validation。Reviewer 会攻击 "only 3 tasks on one small model"——
    应对：强调 3 个任务覆盖 localized (IOI)、distributed (Arithmetic)、
    intermediate (SVA) 三种电路结构，加上 Qwen 提供跨模型验证。

- name: Qwen-2.5 0.5B IOI K=3 (EAP-IG + EP + ACDC top-k)
  plan_id: plan_006
  description: >
    D029 后用 ACDC top-k 替代 IFR 作为第三方法（IFR 在 Qwen 上 Jaccard=0.000，
    完全不兼容——IFR 聚焦 early layers m2→a3，EAP-IG/EP 聚焦 deep layers a20.h9，
    零重叠导致 CSS=1.0 为空集）。ACDC top-k 在 Qwen 上技术可行但需要调参。
    验证 CSS 跨模型架构（GQA, SwiGLU）的泛化性。
  expected_results:
    status: done
    conclusion: mixed
    total_edges: 179388
    binarization: top-k (k=75)
    pairwise_jaccard:
      eapig_x_ep: 0.38
      eapig_x_acdc: 0.22
      ep_x_acdc: 0.19
    max_jaccard: 0.38
    three_way_ratio: 0.09
    circuit_sizes:
      eapig_k75: 75
      ep_k75: 75
      acdc_k75: 75
    css_distribution:
      "1/3": 148
      "2/3": 58
      "3/3": 19
    faithfulness_mean:
      css_1.00:
        edges: 19
        CPR: 0.095
        CMD: 0.932
      css_0.67:
        edges: 58
        CPR: 0.078
        CMD: 0.951
      eapig_k75:
        edges: 75
        CPR: 0.082
        CMD: 0.946
      ep_k75:
        edges: 75
        CPR: 0.071
        CMD: 0.958
      acdc_k75:
        edges: 75
        CPR: 0.068
        CMD: 0.962
    css1_cpr: 0.095
    css1_vs_best_single: 0.013
    qwen_acdc_technical_notes: >
      ACDC 在 179k-edge Qwen graph 上运行时间显著增加（~45min vs GPT-2 的 ~5min）。
      isinf 产出极少边（< 10），top-k=75 normalization 后产出合理但 faithfulness
      指标波动较大（不同 random seed 间 CPR 变化 ±0.02）。
      TransformerLens 不支持 Qwen2.5，全部用 HF-native 实现，与 GPT-2 pipeline
      不完全对齐——这是潜在的 confound。
  result_rationale: >
    Qwen-2.5 0.5B 上 ACDC top-k 替代 IFR 后，三种方法都来自不同算法族但全部
    基于 performance/loss 信号（gradient、pruning、greedy causal），这意味着
    方法间的分歧主要来源于搜索策略差异而非 measurement paradigm 差异。
    EAP-IG×EP Jaccard=0.38 低于 SVA 的 0.653 但高于 IOI GPT-2 的 0.31——
    Qwen 的 GQA 结构使得 head 内 key-value sharing 改变了 gradient 和 pruning
    的敏感度分布，但 IOI 的 name mover / S-inhibition 机制在 Qwen 上仍然相对
    localized，给方法分歧留出空间。ACDC×EAP-IG 和 ACDC×EP 的 Jaccard 较低
    （0.22/0.19）因为 ACDC 的 greedy search 在大 graph 上的搜索路径与 gradient
    方法显著不同。
    CSS=1.0 的 19 条边 CPR=0.095 略优于 EAP-IG 的 0.082（Δ=0.013），方向正确
    但与 SVA 类似处于 marginal 区间。这是 median 档的特征：CSS 在 low-to-moderate
    Jaccard 条件下 consistently shows small positive advantage，但没有一个
    结果足够强到单独 claim significance。
    核心限制：HF-native pipeline 与 GPT-2 的 TransformerLens pipeline 不完全
    对齐，跨模型 CPR 比较需要 caveat。
  tables:
    - name: "Table: Qwen-0.5B IOI Faithfulness (mean ablation, k=75)"
      columns: [Circuit, Edges, CPR ↑, CMD ↓]
      rows:
        - [CSS=1.0, 19, 0.095, 0.932]
        - [CSS≥0.67, 58, 0.078, 0.951]
        - [EAP-IG, 75, 0.082, 0.946]
        - [EP, 75, 0.071, 0.958]
        - [ACDC, 75, 0.068, 0.962]
    - name: "Table: Qwen-0.5B IOI Pairwise Jaccard (top-k=75)"
      columns: ["", EAP-IG, EP, ACDC]
      rows:
        - [EAP-IG, "—", 0.38, 0.22]
        - [EP, 0.38, "—", 0.19]
        - [ACDC, 0.22, 0.19, "—"]
  figures_description:
    - >
      Cross-model IOI comparison (GPT-2 vs Qwen): paired bar chart 显示两个模型的
      CSS=1.0 vs best-single CPR。GPT-2 gap 更大（0.109 vs 0.029, Δ=0.08），
      Qwen gap 较小（0.095 vs 0.082, Δ=0.013）。Qwen 的 smaller gap 反映了
      ACDC top-k 与 gradient 方法的 Jaccard 比 GPT-2 ACDC isinf 的更高。
    - >
      Jaccard heatmap: 3×3 matrix for Qwen IOI, 与 GPT-2 IOI 并列。
      Qwen 的整体 Jaccard 更均匀（0.19-0.38），GPT-2 更极端（0.086-0.307）。
  analysis: >
    Qwen IOI 是 median 档中最有价值的新增数据点。max_jaccard=0.38 + CSS Δ=+0.013
    落在 Jaccard-utility 趋势线的预期位置（IOI GPT-2: 0.31/+0.08, SVA: 0.653/+0.013,
    Arithmetic: 0.695/−0.066 之间）。
    关键意义：(1) 证明 CSS 跨模型可行（Qwen ≠ GPT-2 架构），(2) ACDC top-k
    在大模型上作为第三方法的可行性验证，(3) 为 Jaccard-utility 分析提供第 4 个数据点。
    但 Δ=+0.013 的 marginal nature 意味着 Qwen IOI 不能单独支撑 Claim 1——
    它只是趋势中的一个 intermediate point。

- name: Qwen-2.5 0.5B Arithmetic K=3 (EAP-IG + EP + ACDC top-k)
  plan_id: plan_007
  description: >
    Qwen 上 Arithmetic/Greaterthan，ACDC top-k 作为第三方法。
    预期 Jaccard 较高（distributed computation → method convergence），CSS 应失败。
    验证 Arithmetic 的 CSS-negative 模式跨模型复现。
  expected_results:
    status: done
    conclusion: negative
    pairwise_jaccard:
      eapig_x_ep: 0.52
      eapig_x_acdc: 0.31
      ep_x_acdc: 0.28
    max_jaccard: 0.52
    three_way_ratio: 0.17
    css_distribution:
      "1/3": 112
      "2/3": 71
      "3/3": 42
    faithfulness_mean:
      css_1.00:
        edges: 42
        CPR: 0.921
        CMD: 0.345
      eapig_k75:
        edges: 75
        CPR: 0.968
        CMD: 0.142
      ep_k75:
        edges: 75
        CPR: 0.951
        CMD: 0.218
      acdc_k75:
        edges: 75
        CPR: 0.938
        CMD: 0.274
    css1_cpr_advantage: -0.047
    css1_vs_eapig_delta: -0.047
    note: >
      CSS=1.0 CPR=0.921 < EAP-IG=0.968。Qwen Arithmetic 确认 CSS-negative。
      但 max_jaccard=0.52 比 GPT-2 的 0.695 显著降低（Qwen 的 GQA + 更大容量
      使 comparison computation 更分散），CSS advantage 也从 −0.066 改善到 −0.047。
  result_rationale: >
    Arithmetic/Greaterthan 的数值比较计算在 Qwen 上比 GPT-2 更分散——0.5B 参数
    提供了更多 redundant heads 可以承担 comparison 功能，降低了方法间在 top-k
    边集上的重合度。EAP-IG×EP Jaccard 从 GPT-2 的 0.695 降至 Qwen 的 0.52，
    反映了这种分散效应。ACDC 在 Qwen Arithmetic 上的行为也更 diverse（ACDC×EAP-IG=0.31），
    因为 greedy search 在更大 graph 中有更多备选路径。
    然而 max_jaccard=0.52 仍然意味着 EAP-IG 和 EP 在超过一半的 top-75 边上达成共识——
    这些共识边覆盖了 Arithmetic 的核心 comparison pathway，任何 performance-based
    方法都难以忽略它们。CSS=1.0 的 42 条边要求三方法全部同意，这过滤掉了 ACDC 独特发现的
    一些 low-importance edges，但也丢失了 EAP-IG×EP 共识中 ACDC 未选中的 important edges。
    净效果是 CSS=1.0 CPR=0.921 低于 EAP-IG 单方法的 0.968。
    关键观察：max_jaccard=0.52 落在 Jaccard-utility threshold 的 borderline 区域
    （定义为 ~0.45-0.55）。如果 threshold 在 0.50 以下，这个点确认 "above threshold
    → CSS fails"；如果 threshold 在 0.55 以上，这个点是一个 near-miss。这种 ambiguity
    是 median 档的核心特征——趋势清晰但 boundary 模糊。
  tables:
    - name: "Table: Qwen-0.5B Arithmetic Faithfulness (mean ablation, k=75)"
      columns: [Circuit, Edges, CPR ↑, CMD ↓]
      rows:
        - [CSS=1.0, 42, 0.921, 0.345]
        - [EAP-IG (k=75), 75, 0.968, 0.142]
        - [EP (k=75), 75, 0.951, 0.218]
        - [ACDC (k=75), 75, 0.938, 0.274]
    - name: "Table: Arithmetic Cross-Model Comparison"
      columns: [Model, Max Jaccard, CSS=1.0 CPR, Best Single CPR, Δ]
      rows:
        - [GPT-2, 0.695, 0.919, 0.985, "−0.066"]
        - [Qwen-0.5B, 0.52, 0.921, 0.968, "−0.047"]
  figures_description:
    - >
      在 Jaccard-utility scatter plot 中，Qwen Arithmetic 的数据点 (0.52, −0.047)
      落在 GPT-2 Arithmetic (0.695, −0.066) 的左上方（更低 Jaccard，更小 negative
      advantage），方向一致、趋势线延伸自然。
  analysis: >
    Qwen Arithmetic 的 negative result 在 reframed narrative 下是资产：
    (1) 确认 high-Jaccard → CSS fails 的模式跨模型稳定，
    (2) max_jaccard 从 0.695 降至 0.52 伴随 CSS disadvantage 从 0.066 缩小至 0.047，
        精确地落在 Jaccard-utility 趋势线上，
    (3) 提供了第 4 个（或第 3 个，取决于 SVA 是否计入）有效数据点。
    但 max_jaccard=0.52 接近 putative threshold（~0.5），使 threshold 估计更不确定——
    如果这个点被归为 "near-threshold ambiguous"，有效的 clear positive 和 clear negative
    数据点各减少一个。


  result_rationale: '原始比较中 CSS=1.0 (7 edges, CPR=0.109) 对比 EAP-IG (100 edges, CPR=-0.109)
    有巨大优势，但这混淆了 circuit size 效应（小 circuit 天然 CPR 更高因为 ablation 损失更少）。控制 size=7 后，各方法的
    top-7 edges 也获得了较高 CPR， 因为它们选出的是各自最确定的 edges。ACDC 的 top-7 尤其接近 CSS=1.0， 因为 CSS=1.0
    的 7 edges 中有 5-6 个本就是 ACDC isinf 边。 CSS 优势从 Δ=0.081 缩至 Δ=0.017，保留约 42%。这个残余优势虽然方向正确
    （consensus edges 确实略优于任意单方法的 top edges），但幅度大幅缩水， 需要 bootstrap CI 来判断是否显著。Size

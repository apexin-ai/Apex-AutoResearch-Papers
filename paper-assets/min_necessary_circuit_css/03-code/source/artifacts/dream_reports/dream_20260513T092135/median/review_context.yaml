- name: Bootstrap confidence intervals on CPR
  plan_id: plan_009
  description: '对所有已完成实验的 CPR 差值计算 bootstrap 95% CI（B=10000 resamples）。 重点：IOI CSS=1.0
    vs best single method 的 Δ 是否显著排除零。

    '
  expected_results:
    ioi_css_vs_acdc_original:
      delta_point: 0.081
      bootstrap_ci_95:
      - -0.012
      - 0.174
      p_value_one_sided: 0.089
      significant_at_005: false
    ioi_css_vs_acdc_size_controlled:
      delta_point: 0.017
      bootstrap_ci_95:
      - -0.038
      - 0.071
      p_value_one_sided: 0.27
      significant_at_005: false
    ioi_css_vs_eapig:
      delta_point: 0.218
      bootstrap_ci_95:
      - 0.095
      - 0.341
      p_value_one_sided: 0.002
      significant_at_005: true
      note: 但 size confound 解释大部分
    arithmetic_css_vs_eapig:
      delta_point: -0.066
      bootstrap_ci_95:
      - -0.142
      - 0.009
      p_value_one_sided: 0.96
      significant_at_005: false
      note: CSS worse, as expected
    sva_css_vs_acdc:
      delta_point: 0.013
      bootstrap_ci_95:
      - -0.052
      - 0.078
      p_value_one_sided: 0.35
      significant_at_005: false
  result_rationale: 'Bootstrap CI 宽度受限于 evaluation set size（IOI 100 prompts × 7 edges，
    有效自由度低）。IOI 原始 Δ=0.081 的 CI 下界在 -0.01 到 0.02 之间 （median tier 定义），对应 p≈0.04-0.10。这里取
    CI=[-0.012, 0.174]， p=0.089，恰好不显著于 0.05 但接近。Size-controlled 后 Δ=0.017 更弱， CI 完全包含零。其他任务（Arithmetic、SVA）本身是
    negative/inconclusive， CI 确认了零假设不可排除。唯一"显著"的比较是 CSS vs EAP-IG 原始值 （Δ=0.218），但这已知被
    size confound 解释。整体：统计证据不足以支撑 IOI positive claim at α=0.05，需在论文中使用 "marginal evidence"

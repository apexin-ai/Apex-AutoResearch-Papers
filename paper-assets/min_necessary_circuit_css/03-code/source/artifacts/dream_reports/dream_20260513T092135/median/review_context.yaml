- name: IFR vs ACDC vs gradient method divergence analysis
  plan_id: plan_012
  description: '定性分析 Qwen-0.5B 上 IFR 和 ACDC 都退化为 node-level scoring 的 root cause，
    作为 Claim 3（component-level scoring 导致 scaling failure）的 case study。

    '
  expected_results:
    status: completed (analysis only, no new experiments)
    ifr_failure_signature:
      scoring_granularity: block-level (layer chunks)
      top_edges_layer_distribution: concentrated in layers 0-5 (early MLP → early
        attention)
      effective_resolution: ~200 edges per selected block
    acdc_failure_signature:
      scoring_granularity: node-level (attention head / MLP block)
      top_edges_pattern: all edges from selected nodes, creating dense sub-blocks
      effective_resolution: ~500-2000 edges per selected node
    shared_root_cause: 'Both methods assign identical scores to all edges entering/leaving
      the same component (IFR: layer, ACDC: node). On a 179K-edge model, this creates
      tied-score blocks that binarization cannot meaningfully separate.

      '
    gradient_method_comparison:
      eapig_scoring: edge-level (unique score per edge)
      ep_scoring: edge-level (unique score per edge)
      eapig_x_ep_jaccard: 0.54
      note: gradient methods maintain edge-level resolution but agree with each other,
        not with ablation methods
    divergence_taxonomy:
      type_1: IFR block-voting (layer-level granularity)
      type_2: ACDC node-voting (node-level granularity)
      type_3: EAP-IG/EP edge-level but mutually correlated
      implication: K=3 effectively reduces to K≈1.5 — gradient pair + one ablation
        method with wrong granularity
  result_rationale: '这是对 plan_006 和 plan_007 已有结果的 post-hoc 分析，不需要新实验。 IFR 的 block-voting
    已在 D028 文档中记录（top-100 edges 全部来自 m2→a3 这种层间连接），ACDC 的 node-level scoring 在 D034
    中记录 （所有 edges from 同一 attention head 获得相同分数）。 将这两个独立观察统一为 "component-level scoring
    granularity mismatch" 的 root cause 是 median tier 可以完成的分析工作，因为它只需要 reorganize 已有信息而非产生新数据。这为
    Claim 3 提供了 mechanistic explanation：不是方法"随机"失败，而是它们在大模型上退化为更粗粒度的 scoring，使得 edge-level
    consensus 失去意义。

    '
  tables:
  - caption: Scoring granularity comparison across methods on Qwen-0.5B (179K edges)
    columns:
    - Method
    - Scoring Level
    - Effective Resolution
    - Unique Scores in Top-100
    rows:
    - - EAP-IG
      - edge
      - 1 edge
      - 100
    - - EP
      - edge
      - 1 edge
      - 100
    - - IFR
      - block (layer)
      - ~200 edges/block
      - ~3-5
    - - ACDC
      - node (head/MLP)
      - ~500-2K edges/node
      - ~8-12
  - caption: Pairwise Jaccard by scoring granularity
    columns:
    - Pair
    - Jaccard
    - Same Granularity?
    rows:
    - - EAP-IG × EP
      - 0.54
      - Yes (edge-edge)
    - - EAP-IG × IFR
      - 0.0
      - No (edge-block)
    - - EAP-IG × ACDC
      - 0.04
      - No (edge-node)
    - - EP × IFR
      - 0.0
      - No (edge-block)
    - - EP × ACDC
      - 0.04
      - No (edge-node)
    - - IFR × ACDC
      - 0.0
      - No (block-node)
  figures_description:
  - 'Schematic diagram: Qwen-0.5B 的 edge matrix 上标注各方法的 scoring ''footprint''。EAP-IG/EP
    是散点式（edge-level），IFR 是水平条带（block-level），ACDC 是竖直条带（node-level）。三者几何上正交 → Jaccard≈0'
  analysis: 'Divergence analysis 确认 Claim 3 的 root cause：component-level scoring 在大模型上退化为
    node/block 级别，使 edge-level CSS 失去统计基础。 这不是 implementation bug 而是 architectural
    limitation——IFR 的 forward intervention 天然以 layer 为单位，ACDC 的 activation patching
    以 node 为单位。只有梯度方法保持 edge-level resolution，但它们彼此高度相关 （Jaccard=0.54），实际独立信息源从 K=3
    降至 K≈1.5。 论文 Section 5 用此分析支撑 "granularity check" diagnostic guideline： 在尝试 CSS
    前验证所有方法是否在同一 granularity 上操作。

    '

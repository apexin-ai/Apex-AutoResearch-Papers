narrative_guidance: 'Route A 叙事成立但 IOI 正例从 clean positive 降级为 marginal/conditional
  positive。 Size confound 作为显式 limitation 讨论：控制 circuit size 后 CSS 优势缩水 40-70%， 仍存在但不再
  compelling。Factual Recall 无法提供第二个正例或反例，覆盖面锁定在 5 configs。 Bootstrap CIs 宽且 IOI 的
  lower bound 接近零，统计 claim 需要降调。 Ablation comparison 未能及时完成，留作 future work。 Jaccard
  diagnostic 方向正确但 n=5 过小，保持 conjecture 不升级。 论文仍够 Findings，但 limitations section 需要显著扩展（约
  0.5 页）， explicitly 讨论 size confound、统计 power 不足、task 覆盖度有限。

  '
imagined_experiments:
- name: GPT-2 Factual Recall K=3 CSS
  plan_id: plan_004
  description: 'GPT-2 Small / Country-Capital factual recall, K=3 (EAP-IG + EP + ACDC
    top-k). MLP-heavy knowledge retrieval circuit。预期方法间对 MLP 与 attention 的选择分歧大。

    '
  expected_results:
    status: inconclusive
    binarization: top-100
    css_distribution:
      '0.33': 71
      '0.67': 38
      '1.00': 12
    pairwise_jaccard:
      eapig_x_ep: 0.42
      eapig_x_acdc: 0.18
      ep_x_acdc: 0.15
    three_way_jaccard: 0.11
    max_jaccard: 0.42
    off_diagonal_pct: 0.89
    evaluation_mean:
      css_1.00_cpr: 0.83
      css_0.67_cpr: 0.79
      eap_ig_cpr: 0.88
      ep_cpr: 0.82
      acdc_cpr: 0.85
    evaluation_zero:
      css_1.00_cpr: -0.42
      eap_ig_cpr: -0.29
      acdc_cpr: -0.51
    d025_conditions:
      cond1_jaccard_lt070: PASS (0.42)
      cond2_css_geq_2_3: PASS (38)
      cond3_css_1_count: PASS (12)
      cond4_cpr_dominance: FAIL (CSS=1.0 mean CPR=0.83 < EAP-IG=0.88)
    gate_verdict: FAIL (condition 4)
  result_rationale: 'Factual recall 的 knowledge retrieval circuit 主要依赖中间层 MLP， 但 EAP-IG
    和 EP 作为梯度方法倾向于选择 attention edges（梯度在 attention 的 softmax 处更大），而 ACDC 的 ablation-based
    方法能更好定位 MLP。 这导致方法间 Jaccard 偏低（特别是含 ACDC 的 pair），CSS=1.0 仅 12 edges 落在方法交集的 "安全区"
    但不是最优选择。EAP-IG 单方法因为 top-100 中 包含了 MLP 和 attention 的混合，反而 CPR 更高。整体 inconclusive：
    CSS 没有帮助但也没有灾难性失败，pattern 与 Arithmetic 的 FAIL 不同 （不是 high Jaccard 导致的退化，而是方法对不同
    component type 的偏好差异）。 无法作为 Claim 2 的新证据点。


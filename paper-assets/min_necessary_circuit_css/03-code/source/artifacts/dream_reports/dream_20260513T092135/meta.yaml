  - name: IOI Size-Controlled Baseline
    plan_id: plan_008
    description: 'IOI 上控制 edge count：将 CSS=1.0（7 edges）与 top-7 of EAP-IG、top-7 of
      EP、top-7 of ACDC、 random-7 edges 在相同 edge 数量下比较 zero ablation CPR。排除 "CSS 优势仅因
      fewer edges" 的 size confound。

      '
    expected_results:
      css_1.00:
        edges: 7
        CPR_zero: 0.109
      top7_eapig:
        edges: 7
        CPR_zero: 0.048
      top7_acdc:
        edges: 7
        CPR_zero: 0.042
      top7_ep:
        edges: 7
        CPR_zero: 0.035
      random7:
        edges: 7
        CPR_zero: 0.003
        CPR_zero_std: 0.012
        n_random_samples: 50
      original_best_single_cpr: 0.029
      original_delta: 0.08
      size_controlled_delta: 0.061
      size_controlled_advantage_retained_pct: 76.3
      css_beats_all_top7: true
      css_beats_random_p_value: <0.001
    result_rationale: 'CSS=1.0 的 7 条边是 EAP-IG、EP、ACDC 三种独立算法视角的交集——它们对应 IOI circuit
      中 name mover heads（9.9, 9.6, 10.0）和 S-inhibition heads（7.3, 8.6）的关键 attention
      edges， 加上 1-2 条必要的 MLP routing edges。这些边被三种完全不同的评分机制（gradient×activation product、
      pruning sensitivity、clean→corrupt activation difference）共同认定为最重要， 构成了 IOI circuit
      的 "triple-verified functional core"。 相比之下，top-7 of EAP-IG（CPR=0.048）包含一些 gradient
      signal 强但功能贡献弱的边 （如 early-layer position embedding edges，gradient 高但 ablation
      后可被其他路径补偿）。 Top-7 of EP（CPR=0.035）包含 pruning-sensitive 但非 functionally-critical
      的边 （如 LayerNorm→attention edges，移除后 attention pattern 改变但不影响 name-moving 功能）。
      Top-7 of ACDC（CPR=0.042）质量略好于 EP（ACDC 的 activation patching 更直接衡量功能贡献）， 但仍包含
      2-3 条 ACDC-specific 的 false positives（其他方法未选中的边）。 Random-7 CPR≈0.003（50 次采样均值），确认
      7 条随机边几乎无功能意义。 Size-controlled advantage retained = (0.109-0.048)/0.080 = 76.3%：
      原始 CSS 优势的四分之三归因于 selection quality（consensus 过滤 method-specific noise）， 仅四分之一可能与
      size effect 相关。这直接回应 R3 的 size artifact 质疑。

      '
    tables:
    - name: 'Table: Size-Controlled Baseline Comparison (IOI)'
      description: '行: CSS=1.0, Top-7 EAP-IG, Top-7 ACDC, Top-7 EP, Random-7 (mean±std,
        n=50) 列: Edges, Zero CPR, CMD, vs CSS Δ 底部: Advantage retained = 76.3%

        '
    - name: 'Table: Edge Identity Analysis'
      description: 'CSS=1.0 的 7 条边与各 top-7 的 overlap 分析。 CSS∩EAP-IG_top7: 5/7, CSS∩ACDC_top7:
        4/7, CSS∩EP_top7: 4/7。 CSS-unique edges（仅 consensus 选中）: 0-1 条。证明 CSS 的优势不在于发现
        unique edges， 而在于从多个 top-ranked lists 的交集中过滤出 most reliable edges。

        '
    figures_description:
    - 'Bar chart: x=method (CSS=1.0, EAP-IG top-7, ACDC top-7, EP top-7, Random-7),
      y=zero CPR。所有 bar 相同 edge count (N=7)。CSS=1.0 bar 显著高于其他。 Error bar on Random-7
      (±std from 50 samples)。灰色虚线 y=0。 右侧标注 "76% of advantage from selection quality"。

      '
    analysis: 'Size-controlled baseline 排除了最直接的 confound。76.3% retained advantage
      意味着： 即使控制 edge count，consensus 选出的 7 条边仍显著优于任何单方法选出的 7 条边。 剩余 23.7% 的 "size
      effect" 可能来自 original comparison 中 single methods 使用 100 edges 而 CSS 仅 7 edges——更多边意味着更多
      collateral damage under zero ablation。 这为 Claim 2 提供了 decisive control experiment：IOI
      的 CSS 成功是真正的 selection quality 效应，不是 size artifact。

      '
  - name: Bootstrap Confidence Intervals on CPR
    plan_id: plan_009
    description: '对所有完成实验的 CPR Δ（CSS=1.0 vs best single method）进行 paired bootstrap（B=10000），
      报告 95% BCa CIs。重点验证 IOI Δ 显著性（CI 不跨零）和 SVA 非显著性（CI 跨零 → 确认 FAIL 归类）。

      '

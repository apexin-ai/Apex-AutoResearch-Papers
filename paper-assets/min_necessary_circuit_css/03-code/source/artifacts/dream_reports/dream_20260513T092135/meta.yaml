      factual_recall_gpt2:
        delta_point: -0.068
        delta_ci_95:
        - -0.118
        - -0.022
        p_value: 0.005
        significant: true
        direction: CSS significantly WORSE than EAP-IG
      qwen_ifr:
        note: N/A — zero CSS=1.0 edges, bootstrap not applicable
      qwen_acdc:
        note: N/A — zero CSS=1.0 edges, bootstrap not applicable
      summary:
        significant_pass: 1
        significant_fail: 2
        non_significant: 1
        not_applicable: 2
    result_rationale: 'Paired bootstrap 是这些小样本 CPR 比较的最合适统计方法：每个评估示例同时计算 CSS 和 single-method
      CPR， 差值的 bootstrap 分布直接反映 CSS 优势的不确定性。BCa（bias-corrected and accelerated）修正
      处理 CPR 分布的偏斜（zero ablation CPR 常右偏）。 IOI Δ=0.085 (CI [0.035, 0.138])：100 个 IOI
      评估示例中，CSS=1.0 在大多数示例上优于 ACDC， per-example Δ 的标准差约 0.025，除以 sqrt(100)≈10 给出 SE≈0.025，95%
      CI 宽度约 0.10。 CI 下界 0.035 > 0，p=0.002，IOI PASS 的统计显著性确认。 Arithmetic Δ=-0.063
      (CI [-0.112, -0.018])：CI 完全在负区域，CSS 显著不如 EAP-IG， 确认 FAIL 结论。per-example 差异的方差较大（Arithmetic
      各示例的 difficulty 差异更大），CI 略宽。 SVA Δ=0.013 (CI [-0.025, 0.052])：CI 跨零，p=0.482，advantage
      统计不显著。 这是 best tier 的关键结果——SVA 从 "inconclusive" 正式归类为 FAIL（优势不显著 = 不支持 CSS 有效）。
      Factual Recall Δ=-0.068 (CI [-0.118, -0.022])：与 Arithmetic 模式一致的显著 FAIL。 两个
      Qwen 实验因 CSS=1.0=0 edges 无法计算 bootstrap（不是缺陷，而是反映 Claim 3 的 method degeneration）。

      '
    tables:
    - name: 'Table: Bootstrap CI Summary (All Configurations)'
      description: '行: IOI, Arithmetic, SVA, Factual Recall, Qwen IFR (N/A), Qwen

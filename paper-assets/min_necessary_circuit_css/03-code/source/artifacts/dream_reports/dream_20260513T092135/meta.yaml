      和 Factual Recall 完全在负区域（红色）， SVA 跨零（灰色）。Qwen 两行标注 "N/A"。 右侧标注 p-value。视觉化一目了然：IOI
      是唯一统计显著的 PASS。

      '
    analysis: 'Bootstrap CIs 将整个实验体系的统计严谨性提升到 Findings 要求。 核心发现：IOI 是唯一 CI 不跨零的正向结果（p=0.002），
      SVA 的 CI 跨零（p=0.482）彻底消除了 D033 cross-server 分析的歧义—— SVA 不是 "inconclusive"，而是

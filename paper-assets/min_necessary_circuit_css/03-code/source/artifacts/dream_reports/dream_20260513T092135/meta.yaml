    - R1 (more lenient): FM1 (ACDC binarization) is actionable even if theoretically
    predictable → practical value compensates for limited novelty.

    - **Resolution:** R2''s position is stronger. Practical value of FM1 is real but
    modest — the fix (use uniform top-N) is obvious once the problem is stated. FM3

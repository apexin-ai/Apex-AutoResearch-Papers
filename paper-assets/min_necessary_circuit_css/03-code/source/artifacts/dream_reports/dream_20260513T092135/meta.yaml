    # Dream Review Report: "When Does Circuit Consensus Fail?"


    **Venue:** EMNLP 2026 Findings (ARR review form)

    **Review Mode:** Full (2 Reviewers + 4-step Roundtable)

    **Date:** 2026-05-13


    ---


    ## Reviewer Panel


    | Reviewer | Focus | Soundness | Excitement | Overall | Reproducibility | Confidence
    |

    |----------|-------|-----------|------------|---------|-----------------|------------|

    | R1 | Methods + Experiments | 3.0 | 3.0 | 3.0 | 3.0 | 4.0 |

    | R2 | Novelty + Related Work | 3.0 | 2.5 | 2.5 | 4.0 | 4.0 |

    | **Converged** | — | **3.0** | **2.5** | **2.5** | **3.5** | **4.0** |


    **Converged Verdict:** Borderline Findings (2.5/5)


    ---


    ## 1. Paper Summary


    The paper formalizes cross-method binary consensus in circuit discovery as the
    Circuit Selection Score (CSS = fraction of K=3 methods selecting each edge), and
    tests whether CSS=1.0 edges outperform individual methods on circuit faithfulness
    (CPR). Across 6 model×task configurations (4 tasks × {GPT-2 Small, Qwen-0.5B}),
    consensus succeeds in only 1/6 (IOI on GPT-2, ΔCPR=+0.085, p=0.002). Three failure
    modes are identified: (1) task-induced method correlation collapsing consensus
    to obvious-edge selection, (2) component-level scoring degeneration on larger
    models making edge-level consensus impossible, and (3) max pairwise Jaccard >
    0.5 as a diagnostic predictor of failure. A size-controlled baseline confirms
    76% of the IOI advantage is genuine selection quality. Practical guidelines are
    proposed: check method scoring granularity and compute Jaccard before investing
    in multi-method validation.


    ---


    ## 2. Consolidated Strengths


    **S1: The negative result is genuinely informative and well-structured.** [R1,
    R2 agree] The consensus hypothesis is widely held but previously untested. Demonstrating
    systematic failure in 5/6 configurations with mechanistic explanations constitutes
    a legitimate contribution. The three-failure-mode taxonomy provides actionable
    structure for the community.


    **S2: Size-controlled baseline is the paper''s strongest experiment.** [R1 primary,
    R2 concurs] Comparing CSS=1.0 (7 edges) against top-7 from each individual method
    and random-7 (50 samples) at identical edge counts directly addresses the most
    obvious confound. The 76.3% retained advantage is convincing evidence that IOI
    success reflects selection quality, not a size artifact.


    **S3: Rigorous statistical practice.** [R1, R2 agree] Paired bootstrap CIs with
    BCa correction (B=10,000) are appropriate. Classifying SVA as FAIL based on CI
    crossing zero (p=0.482) rather than on point estimate direction is honest. Framing
    the Jaccard diagnostic as "empirically supported heuristic" rather than proven
    law is epistemically responsible.


    **S4: Component-level scoring degeneration (Failure Mode 2) is novel and practically
    important.** [R1, R2 agree] The mechanistic explanations — IFR degenerating to
    layer-level due to GQA KV sharing, ACDC degenerating to node-level at 179K edges
    — provide genuinely new architectural insight that transcends this paper''s specific
    framework. This is the most original finding.


    **S5: Ablation method robustness check adds credibility.** [R1 primary] Testing
    zero vs. mean ablation on the sole success case (81.3% advantage retained) rules
    out the evaluation-protocol-artifact hypothesis.


    ---


    ## 3. Consolidated Weaknesses


    ### Major


    **W1 [R1]: Edge-level CSS vs. node-level evaluation disconnect.** The CSS framework
    computes consensus at the edge level, but the ablation evaluation (CPR) operates
    at the node level — entire attention heads and MLP layers are zeroed/mean-replaced,
    not individual edges. Two circuits with different edge sets but identical node
    coverage would produce identical CPR values. This is a fundamental confound never
    discussed in the paper. The size-controlled baseline partially mitigates this
    (different methods'' top-7 edges likely cover different nodes), but the Factual
    Recall analysis (Table 2) may really be measuring node coverage, not edge selection
    quality. **This undermines the central claim about edge selection quality.**


    **W2 [R2]: CSS is not methodologically novel.** CSS = (1/K)Σm_k(e) is a direct
    application of the feature selection stability index (Nogueira & Brown 2016) to
    binary edge masks. The entire Method section (§3) could be replaced by a single
    sentence. The paper''s novelty must rest entirely on the empirical findings and
    failure mode analysis — which are interesting but thin at n=6.


    **W3 [R2]: Insufficient engagement with Mondorf et al. (2025).** This is the most
    directly comparable work: they test continuous score averaging across the same
    methods and find it outperforms binary intersection. Key question left unanswered:
    does continuous averaging succeed where binary CSS fails? If so, the failure modes
    identified here are about binarization, not about consensus per se — significantly
    narrowing the contribution.


    **W4 [R1, R2 converged]: n=6 is critically underpowered for the Jaccard diagnostic.**
    The Spearman ρ=−0.90 (p=0.037) requires excluding the Qwen-ACDC outlier; on all
    6 points, ρ=−0.714 (p=0.111, not significant). The 0.35 and 0.50 thresholds are
    derived from exactly 1 data point below 0.35 and 4 above 0.50, with zero points
    in between. Any 4 points in strictly monotone order yield ρ=−1.0. The diagnostic
    is presented with more statistical ceremony than the sample size warrants.


    **W5 [R2]: EAP-IG and EP are gradient-adjacent, so K=3 is effectively K≈2.** Both
    are gradient-based (EAP-IG: integrated gradients of attribution-patching; EP:
    gradient-based mask optimization). The paper''s own data confirms this: EAP-IG×EP
    Jaccard is consistently the highest pairwise value. The claim of "three independent
    algorithmic families" is overstated.


    **W6 [R1]: Binarization sensitivity is unexplored.** The paper uses top-n (n=50
    or 100) but never varies n. Internal evidence suggests Jaccard shifts +0.16 to
    +0.25 when switching binarization strategies. How sensitive is the PASS/FAIL classification
    to the choice of n? Could IOI become FAIL at n=200, or Factual Recall become PASS
    at n=25? At minimum, one sweep (n ∈ {25, 50, 100, 200}) on IOI should be reported.


    ### Moderate


    **W7 [R2]: Reference list is sparse (14 references).** Missing important citations
    include: Bhaskar et al. (2024, NeurIPS Spotlight) for Edge Pruning itself; Meloux
    et al. (2025) on intra-method instability; Hanna et al. (2024, COLM) on EAP-IG
    overlap vs. faithfulness; Miller et al. (2024, COLM) on faithfulness metric robustness;
    Sharkey et al. (2025) "Open Problems in MI"; InterpBench (NeurIPS 2024 D&B). A
    typical EMNLP paper in this area cites 30-40 references.


    **W8 [R1]: CPR values are inconsistently reported and CMD is underutilized.**
    IOI''s "successful" CSS=1.0 circuit recovers only 10.9% of the model''s logit
    difference (CPR=0.109). The paper never discusses what constitutes a practically
    meaningful CPR level. CMD is defined but absent from Table 1 and most analyses.


    **W9 [R1]: Multiple testing not addressed.** Four bootstrap tests are conducted;
    IOI (p=0.002) survives Bonferroni correction (0.05/4=0.0125), but this is never
    discussed. The probability of finding at least one significant result by chance
    under the null is ~18.5%.


    **W10 [R1]: Only small-scale models tested.** GPT-2 Small (124M) and Qwen-0.5B
    (500M) are both small. The scaling failure modes may manifest differently at 2B-7B
    scale where edge counts could reach millions.


    ---


    ## 4. Key Questions for Authors


    **Q1 [R1, critical]:** The evaluation implements node-level ablation, not edge-level
    ablation. How does this affect your conclusions? For the IOI size-controlled comparison
    (Table 4), did you verify that CSS=1.0 edges and top-7 EAP-IG edges cover different
    node sets?


    **Q2 [R2, critical]:** Have you tested whether continuous score averaging (as
    in Mondorf et al. 2025) succeeds in configurations where binary CSS fails? If
    not, the failure modes may be specific to binary consensus, not cross-method agreement
    in general.


    **Q3 [R1]:** How sensitive are the PASS/FAIL classifications to the choice of
    top-n? One binarization sweep (n ∈ {25, 50, 100, 200}) on IOI would substantially
    strengthen the paper.


    **Q4 [R2]:** Given that EAP-IG and EP are both gradient-based, have you considered
    testing with a genuinely non-gradient third method (e.g., probing, causal scrubbing)
    to provide truly independent algorithmic diversity?


    **Q5 [R1]:** Table 1 reports Δ=+0.085 for IOI, but Table 9 reports zero-ablation
    Δ=+0.080. This discrepancy (likely different baselines) should be reconciled.


    **Q6 [R2]:** The sole positive result (IOI on GPT-2) is the most studied circuit
    in the literature with a well-characterized 12-edge ground truth. Could CSS success
    here simply reflect that IOI is an "easy" circuit where methods trivially converge
    on the correct answer?


    ---


    ## 5. Minor Issues


    - Table 1: SVA and Arithmetic rows show "—" for CSS=1.0 Edges/CPR without explanation.
    Clarify whether CSS=1.0 edges exist.

    - Table 2 caption says "mean ablation" but the text discusses it alongside zero
    ablation results.

    - EP citation (Kramár et al. [4], "AtP*") may not be the actual method used; Bhaskar
    et al. (2024) for Edge Pruning is uncited.

    - CIRCUS citation (Parekh et al. 2026) is incomplete — no venue, placeholder format.

    - PIE citation is "Anonymous" despite having an arXiv ID.

    - Equation 1 defines CSS for arbitrary K but only K=3 is used. State whether the
    framework generalizes.

    - Istanbul listed as the capital of Turkey in the Factual Recall dataset is factually
    incorrect (it is Ankara). This affects data quality.


    ---


    ## 6. Experiment Coverage Assessment


    Comparing against the experiment design reference (review_context.yaml):


    | Planned Experiment | Covered in Paper? | Quality |

    |---|---|---|

    | GPT-2 Factual Recall K=3 CSS (v2) | Yes (§4.3, Tables 2-3) | Adequate |

    | IOI Size-Controlled Baseline | Yes (§4.4, Table 4) | Strong — best experiment
    |

    | Bootstrap Confidence Intervals | Yes (§4.5, Table 5) | Adequate |

    | Ablation Method Comparison (Zero vs Mean) | Yes (§5.4, Table 9) | Adequate |

    | IFR vs ACDC Divergence Analysis | Yes (§5.2, Tables 6-7) | Adequate |

    | Jaccard-CSS Diagnostic | Yes (§5.3, Table 8) | Underpowered (n=6) |


    All planned experiments are represented. The paper covers the experiment plan
    comprehensively. However, several planned visualization elements (forest plot
    of CIs, Jaccard-CSS scatter plot, layer distribution histograms) are absent from
    the paper — these were described in the plan but apparently not included, reducing
    visual communication of results.


    ---


    ## 7. Roundtable Convergence Summary


    **Areas of strong agreement:**

    - The negative result is a legitimate contribution (both reviewers)

    - Failure Mode 2 (scoring degeneration) is the most novel and important finding
    (both)

    - n=6 is underpowered for the Jaccard diagnostic claims (both)

    - Statistical reporting is honest and appropriate (both)

    - The size-controlled baseline is excellent (both)


    **Areas where reviewers converged after cross-sharing:**

    - Edge-vs-node evaluation confound (R1 raised, R2 accepted as serious after cross-sharing)

    - Mondorf et al. engagement gap (R2 raised, R1 accepted as important after cross-sharing)

    - CSS methodological novelty is thin (R2 raised, R1 concurred)


    **Residual disagreement:**

    - R1 leans toward 3.0 (Findings-acceptable), R2 toward 2.5 (Borderline Findings)

    - After roundtable, both agree the paper is in the 2.5–3.0 range

    - Final convergence at **2.5 (Borderline Findings)**, primarily because: (a) the
    edge-vs-node confound (W1) undermines the central evaluation framework, (b) the
    lack of engagement with continuous alternatives (W3) leaves open whether the failure
    modes are about binary consensus specifically or cross-method agreement generally,
    and (c) the reference coverage is below venue standards


    **What would move this to 3.0 (Findings accept):**

    1. Address the edge-vs-node evaluation confound (W1) — even a brief analysis of
    node coverage overlap between CSS and single-method circuits

    2. Test continuous score averaging on at least IOI and one FAIL case (W3)

    3. Add one binarization sensitivity sweep (W6)

    4. Expand references to 25+ with substantive engagement on Mondorf et al. and
    Bhaskar et al.

    5. Add the planned but missing visualizations (forest plot, scatter plot)


    ---


    ## 8. Recommendation


    **Borderline Findings (2.5/5).** The paper addresses a real question with honest
    methods and arrives at a useful negative answer. The failure mode taxonomy — especially
    the component-level scoring degeneration finding — is a genuine contribution.
    However, the combination of (a) a fundamental edge-vs-node evaluation confound,
    (b) thin methodological novelty (CSS is a known stability index), (c) insufficient
    engagement with the most directly comparable work (Mondorf et al.), and (d) underpowered
    Jaccard diagnostic claims prevents a clear Findings recommendation. The paper
    is close to the acceptance threshold and could reach it with targeted revisions
    addressing W1, W3, and W7.

    '

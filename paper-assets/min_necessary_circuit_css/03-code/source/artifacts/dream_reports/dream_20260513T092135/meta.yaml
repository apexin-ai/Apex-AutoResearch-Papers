    result_rationale: 'Factual recall 依赖 MLP layer 5-9 的 key-value 知识存储机制（Meng et
      al. 2022）和多层 attention head 的 subject→last-token routing。三种方法在 MLP 存储层的边上被迫高度共识——这些边是知识检索的
      不可替代瓶颈，无论用梯度、剪枝还是 activation patching 评估都会被选中。EAP-IG×EP Jaccard=0.62： 两种 gradient-adjacent
      方法在 MLP bottleneck edges 上几乎完全一致，分歧仅在 attention routing 边的 排序上。ACDC×gradient
      Jaccard 较低（0.38/0.33）因为 ACDC 的 clean→corrupt substitution 在 routing edges 上给出不同排序，但仍然收敛于相同的
      MLP 核心。css_1.00 的 10 条边几乎全部是 MLP 存储层的 bottleneck edges——它们是三种算法视角的交集，但恰恰是最 obvious
      的边。这些边的 mean CPR=0.905 低于 EAP-IG 的 0.975， 因为 EAP-IG 的 50 条边额外捕获了 attention routing
      edges 中的 high-gradient 子集，这些 routing edges 虽然方法间不一致，但 EAP-IG 选中的那部分确实是 functionally

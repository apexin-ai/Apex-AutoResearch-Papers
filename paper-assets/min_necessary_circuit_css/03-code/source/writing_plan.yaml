meta:
  venue: EMNLP 2026 Findings
  track: findings
  template: ""
  template_note: "ARR uses ACL format; Worker needs to download latest acl2023.sty or ARR template in Step 4"
  page_limit: 8
  deadline: 2026-05-25
  core_claim: >-
    Cross-method binary consensus (CSS) universally fails in circuit discovery
    (0/6 task×model configurations), due to three structural failure modes:
    ACDC isinf binarization pathology, gradient-method correlation reducing
    effective ensemble size, and component-level scoring granularity collapse
    on larger models.
  created_at: 2026-05-13T16:00:00Z
  updated_at: 2026-05-13T17:00:00Z
  director_review: "approved with 4 adjustments (Bootstrap CI column, isinf visual, CIRCUS placement, Qwen marking)"

paper_outline:
  - section: abstract
    word_budget: 150
    core_bullets:
      - "Problem: Circuit discovery methods find different circuits — consensus should identify reliable edges, but does it?"
      - "Method: Systematic CSS evaluation across 6 task×model configs, K=3 methods, with size-controlled baselines and bootstrap CIs"
      - "Finding: CSS=1.0 fails universally (0/6); only apparent success (IOI on GPT-2) is size artifact"
      - "Contribution: Three structural failure modes identified + diagnostic guidelines for practitioners"
    dependencies: [results, failure_analysis]
    tables: []
    figures: []
    registry_refs: []

  - section: introduction
    word_budget: 1000
    core_bullets:
      - "Hook: Different circuit discovery methods find qualitatively different circuits for the same task — the natural response is to trust edges all methods agree on"
      - "Gap: No systematic evaluation of whether cross-method binary consensus actually improves circuit faithfulness; existing work (CIRCUS, Mondorf et al.) assumes consensus helps without controlling for confounds"
      - "Insight: Binary consensus fails universally because of structural incompatibilities between methods — binarization, correlation, and granularity — not just noise"
      - "Preview: 0/6 configurations pass; IOI apparent positive killed by size-controlled baseline (CSS=1.0 CPR = ACDC top-16 CPR, identical at 0.0295)"
      - "Contributions: (C1) ACDC isinf binarization pathology discovery + fix, (C2) universal failure result with 3 mechanistic failure modes, (C3) diagnostic guidelines for practitioners"
    dependencies: [results, failure_analysis]
    citation_hints:
      - "ACDC (Conmy et al. 2023)"
      - "EAP-IG / Edge Pruning (Syed et al. 2024)"
      - "CIRCUS (Parekh 2026)"
      - "Mondorf et al. (2025)"
      - "Nogueira & Brown (2016) feature selection stability"
      - "Wang et al. (2023) IOI"
    figures: [fig1_overview]
    tables: []
    registry_refs: []

  - section: background
    word_budget: 800
    core_bullets:
      - "Circuit discovery: edge-level attribution in transformer computation graphs"
      - "Three method families: gradient-based (EAP-IG, EP), greedy causal (ACDC), similarity-based (IFR)"
      - "CSS formulation: CSS(e) = (1/K) Σ_k 𝟙[e ∈ C_k], consensus circuit C_τ = {e : CSS(e) ≥ τ}"
      - "Binarization: methods produce continuous scores → binary circuits. ACDC uses isinf (edges with ∞ score), gradient methods use top-k"
      - "Evaluation: Circuit Partial Recovery (CPR) under zero/mean ablation; Jaccard similarity for method agreement"
    dependencies: []
    notation_table:
      G(V,E): "transformer computation graph"
      e: "edge in computation graph"
      C_k: "binary circuit from method k"
      K: "number of methods (=3)"
      "CSS(e)": "consensus score for edge e ∈ {0, 1/K, 2/K, 1}"
      τ: "consensus threshold"
      CPR: "circuit partial recovery"
      CMD: "complete model divergence"
      J(A,B): "Jaccard similarity |A∩B|/|A∪B|"
    tables: []
    figures: []
    registry_refs: []

  - section: experimental_setup
    word_budget: 600
    core_bullets:
      - "Models: GPT-2 Small (32,491 edges), Qwen-2.5 0.5B (179,388 edges)"
      - "Tasks: IOI (indirect object identification), Arithmetic (greater-than), SVA (subject-verb agreement), Factual Recall (country-capital)"
      - "Methods per config: GPT-2 uses EAP-IG + EP + ACDC (K=3); Qwen uses EAP-IG + EP + IFR or ACDC"
      - "Binarization: top-100 for gradient methods; ACDC default is isinf, also evaluated with top-k normalization"
      - "Size-controlled baseline: for fair comparison, evaluate CSS=1.0 vs top-N of each method at matched circuit size"
      - "Statistical testing: Bootstrap CI (n=1000) on CPR differences for IOI, SVA, and Factual Recall"
    dependencies: [background]
    tables: [tab_setup]
    figures: []
    registry_refs:
      - mvp_pilot_gpt2_ioi_v3
      - mvp_arithmetic_gpt2_k3
      - mvp_sva_gpt2_k3_topk
      - gpt2_factual_recall_k3_v2
      - phase2_qwen05b_ioi_k3
      - phase2_qwen05b_ioi_acdc_k3

  - section: results
    word_budget: 1600
    core_bullets:
      - "Main finding: CSS=1.0 fails on all 6 task×model configurations — no config shows consensus advantage over best single method (Table 1)"
      - "GPT-2 IOI: apparent CPR advantage (0.109 vs ≤0) is size artifact — CSS=1.0 selects 7 edges vs 100 for single methods"
      - "IOI size-controlled (N=16): CSS=1.0 mean CPR=0.177 < EAP-IG=0.182, EP=0.183; zero CPR=0.0295 = ACDC top-16 (identical)"
      - "GPT-2 Arithmetic: CSS=1.0 ≡ ACDC (17 isinf edges); mean CPR=0.985 vs EAP-IG=0.985 — consensus adds nothing"
      - "GPT-2 SVA: marginal Δ=0.013, bootstrap p=0.099 not significant at α=0.05"
      - "GPT-2 Factual Recall: bootstrap p=0.000, CSS significantly worse than best single method; EAP-IG×EP J=0.82"
      - "Qwen IOI (both IFR and ACDC variants): 0 CSS=1.0 edges — consensus is empty set on 179K-edge model. Explicitly marked as |CSS=1.0|=0 in Table 1"
      - "§5.5 CIRCUS Ablation: within-method threshold diversity (CIRCUS-core) produces negative CPR on all tested tasks — cross-method consensus is necessary but not sufficient"
    dependencies: [experimental_setup]
    tables: [tab1_main_results]
    figures: [fig2_size_controlled]
    registry_refs:
      - mvp_pilot_gpt2_ioi_v3
      - ioi_size_controlled_baseline
      - mvp_arithmetic_gpt2_k3
      - mvp_sva_gpt2_k3_topk
      - mvp_sva_gpt2_k3
      - gpt2_factual_recall_k3_v2
      - phase2_qwen05b_ioi_k3
      - phase2_qwen05b_ioi_acdc_k3
      - bootstrap_ci_sva_fr

  - section: failure_analysis
    word_budget: 1200
    core_bullets:
      - "Failure Mode 1 — ACDC isinf binarization pathology: ACDC's default isinf threshold selects only 14-17 edges (vs 100 for gradient methods); CSS=1.0 ⊆ ACDC because only ACDC's sparse set can achieve full consensus; top-k normalization breaks degeneracy, shifting Jaccard +0.16 to +0.25. Supported by fig4_isinf_shift (★★★★★ strongest contribution)"
      - "Failure Mode 2 — Method correlation reduces effective K: EAP-IG and EP are gradient-adjacent, J up to 0.82 (Factual Recall); K=3 effectively K≈2; gradient-pair dominance means consensus is driven by correlated pair, not independent validation"
      - "Failure Mode 3 — Component-level scoring granularity: On 179K-edge Qwen, both IFR and ACDC degenerate to node-level scoring; top-0.056% binarization selects block-structured edge sets; all pairwise J≈0; zero CSS=1.0 edges"
      - "Diagnostic signal: max pairwise Jaccard — high J (>0.5) indicates method correlation, low J (≈0) indicates granularity mismatch; neither regime produces successful consensus"
      - "Implication: binary consensus is structurally incompatible with current circuit discovery methods, not merely underperforming"
    dependencies: [results]
    tables: [tab2_failure_modes]
    figures: [fig3_jaccard_heatmap, fig4_isinf_shift]
    registry_refs:
      - mvp_pilot_gpt2_ioi_v3
      - mvp_arithmetic_gpt2_k3
      - gpt2_factual_recall_k3_v2
      - mvp_sva_gpt2_k3_topk
      - phase2_qwen05b_ioi_k3
      - phase2_qwen05b_ioi_acdc_k3

  - section: related_work
    word_budget: 600
    core_bullets:
      - "Circuit discovery methods: ACDC, EAP-IG/EP, IFR — complementary approaches with different inductive biases"
      - "Multi-method circuit validation: CIRCUS (within-method threshold diversity), Mondorf et al. (cross-method score averaging), PIE (iterative pruning ensemble)"
      - "Feature selection stability: CSS as domain application of Nogueira & Brown (2016) stability index; Kuncheva & Whitaker (2003) ensemble diversity theory provides theoretical grounding for our failure mode analysis"
      - "Negative results in interpretability: growing literature on evaluation challenges and failure modes in mechanistic interpretability"
    dependencies: [introduction]
    citation_hints:
      - "Conmy et al. 2023 ACDC"
      - "Syed et al. 2024 EAP-IG / Edge Pruning"
      - "Parekh 2026 CIRCUS"
      - "Mondorf et al. 2025 (2510.06811)"
      - "PIE (2604.16889)"
      - "Nogueira & Brown JMLR 2016"
      - "Kuncheva & Whitaker 2003"
      - "Wang et al. 2023 IOI"
      - "Hanna et al. 2023 SVA"
    tables: []
    figures: []
    registry_refs: []

  - section: conclusion
    word_budget: 350
    core_bullets:
      - "Summary: CSS universally fails (0/6 task×model configs); three structural failure modes identified"
      - "Limitations: 2 models at relatively small scale; K=3 only; no soft/continuous consensus evaluation; 4 tasks within narrow difficulty range"
      - "Practitioner guidelines: (1) never use ACDC isinf for consensus — normalize first, (2) measure pairwise Jaccard before attempting consensus, (3) consider score averaging (Mondorf et al.) over binary intersection"
      - "Future work: continuous consensus methods, adaptive binarization, evaluation at larger model scale (7B+)"
    dependencies: [results, failure_analysis]
    tables: []
    figures: []
    registry_refs: []

visualization_plan:
  - fig_id: fig1_overview
    type: conceptual
    tool: matplotlib
    description: >-
      CSS pipeline schematic: 3 methods (EAP-IG, EP, ACDC) each produce a binary circuit,
      then binary intersection at τ=1.0. Annotated with 3 failure modes at the point
      where each one breaks the pipeline (isinf at binarization step, correlation at
      intersection step, granularity at method output step). Clean, minimal.
    placement: introduction
    aspect_ratio: "16:9"
    data_source: "manual"

  - fig_id: fig2_size_controlled
    type: statistical
    tool: matplotlib
    description: >-
      IOI size-controlled comparison (N=16 edges): grouped bar chart showing CPR for
      CSS=1.0, ACDC top-16, EAP-IG top-16, EP top-16, Random-16 under both zero and
      mean ablation. Key visual: CSS=1.0 zero CPR = ACDC top-16 (identical bar height),
      CSS=1.0 mean CPR < EAP-IG and EP.
    data_source: "registry: ioi_size_controlled_baseline, mvp_pilot_gpt2_ioi_v3"
    placement: results
    aspect_ratio: "4:3"

  - fig_id: fig3_jaccard_heatmap
    type: statistical
    tool: matplotlib
    description: >-
      4-panel figure (one per GPT-2 task): 3×3 pairwise Jaccard heatmaps showing
      method agreement patterns. IOI: low J across board (0.05-0.31); Arithmetic:
      high EAP-IG×EP (0.695), low ACDC×others (0.17); SVA: moderate pattern (0.32-0.65);
      Factual Recall: extreme EAP-IG×EP (0.82). Color scale 0-1, annotated values.
    data_source: "registry: mvp_pilot_gpt2_ioi_v3, mvp_arithmetic_gpt2_k3, mvp_sva_gpt2_k3_topk, gpt2_factual_recall_k3_v2"
    placement: failure_analysis
    aspect_ratio: "16:5"

  - fig_id: fig4_isinf_shift
    type: statistical
    tool: matplotlib
    description: >-
      ACDC isinf binarization pathology visual (★★★★★ strongest contribution):
      Grouped bar chart showing pairwise Jaccard shift when switching from ACDC isinf
      to ACDC top-k normalization on IOI and Arithmetic. Two groups (IOI, Arithmetic),
      each with 3 bar pairs (ACDC×EAP-IG, ACDC×EP, EAP-IG×EP) showing isinf vs top-k.
      Key visual: ACDC×others Jaccard jumps +0.16 to +0.25 after top-k normalization,
      while EAP-IG×EP stays stable. Annotate: under isinf, CSS=1.0 ≡ ACDC subset.
    data_source: "registry: mvp_pilot_gpt2_ioi_v3, mvp_arithmetic_gpt2_k3"
    placement: failure_analysis
    aspect_ratio: "4:3"

table_plan:
  - table_id: tab_setup
    caption: "Experimental configurations. |E| = total edges in computation graph."
    placement: experimental_setup
    type: configuration
    columns: [Config, Model, "|E|", Task, "Methods (K=3)", Binarization]
    data_source: "manual + registry: mvp_pilot_gpt2_ioi_v3, phase2_qwen05b_ioi_k3"
    notes: "6 rows: GPT-2×{IOI, Arithmetic, SVA, FR}, Qwen×{IOI-IFR, IOI-ACDC}"

  - table_id: tab1_main_results
    caption: >-
      CSS=1.0 evaluation across all 6 task×model configurations.
      CPR under mean ablation (↑ better). †Size-controlled at N=16.
      ‡Bootstrap CI (n=1000). Bold = best per row. — = not applicable.
    placement: results
    type: comparison
    columns: [Config, "|CSS=1.0|", "CPR_{CSS}", "CPR_{best}", "Method_{best}", "Δ", "95% CI", "p", Verdict]
    data_source: >-
      registry: mvp_pilot_gpt2_ioi_v3, ioi_size_controlled_baseline,
      mvp_arithmetic_gpt2_k3, mvp_sva_gpt2_k3_topk, gpt2_factual_recall_k3_v2,
      phase2_qwen05b_ioi_k3, phase2_qwen05b_ioi_acdc_k3, bootstrap_ci_sva_fr
    notes: >-
      6 rows total. IOI uses size-controlled N=16 comparison (†).
      Bootstrap CI available: IOI p=0.342, SVA p=0.099, FR p=0.000 (‡).
      Qwen-IFR and Qwen-ACDC rows: |CSS=1.0|=0, marked as ∅ (empty consensus), Verdict=FAIL.
      Arithmetic: no bootstrap (CSS=1.0 ≡ ACDC under isinf, comparison trivial).

  - table_id: tab2_failure_modes
    caption: "Three structural failure modes of binary consensus in circuit discovery."
    placement: failure_analysis
    type: statistics
    columns: [Failure Mode, Mechanism, Diagnostic Signature, Affected Configs, Evidence Strength]
    data_source: "manual"
    notes: >-
      FM1: isinf binarization (IOI, Arith, SVA — all ACDC configs);
      FM2: method correlation (Arith J=0.70, FR J=0.82);
      FM3: component-level scaling (Qwen-IFR, Qwen-ACDC)

literature_strategy:
  citation_budget: 35
  macro_context:
    - "mechanistic interpretability and circuit discovery in transformers"
    - "cross-method consensus, ensemble validation, and feature selection stability"
  micro_clusters:
    - cluster_name: "Circuit Discovery Methods"
      search_queries:
        - "circuit discovery transformer mechanistic interpretability 2023 2024 2025"
        - "ACDC automated circuit discovery Conmy"
        - "EAP-IG attribution patching Syed 2024"
        - "edge pruning auto-circuit"
      must_cite:
        - "Conmy et al. 2023 — ACDC"
        - "Syed et al. 2024 — EAP-IG / Edge Pruning / auto-circuit"
        - "Wang et al. 2023 — IOI interpretability in the wild"
        - "Goldowsky-Dill et al. 2023 — localizing model behavior"
      target_count: 10

    - cluster_name: "Multi-Method Circuit Validation"
      search_queries:
        - "CIRCUS circuit consensus Parekh 2026"
        - "cross-method circuit validation ensemble circuit discovery"
        - "PIE iterative pruning ensemble circuit 2024"
        - "Mondorf circuit score averaging 2025"
      must_cite:
        - "Parekh 2026 — CIRCUS"
        - "Mondorf et al. 2025 (arXiv 2510.06811)"
        - "PIE (arXiv 2604.16889)"
      target_count: 5

    - cluster_name: "Feature Selection Stability and Ensemble Theory"
      search_queries:
        - "feature selection stability index Nogueira Brown JMLR 2016"
        - "Kuncheva Whitaker ensemble diversity 2003"
        - "stability selection Meinshausen Buhlmann 2010"
      must_cite:
        - "Nogueira & Brown 2016 — stability of feature selection"
        - "Kuncheva & Whitaker 2003 — measures of diversity in classifier ensembles"
      target_count: 5

    - cluster_name: "Mechanistic Interpretability General"
      search_queries:
        - "mechanistic interpretability transformers survey 2024 2025"
        - "transformer circuits thread Elhage Olah 2021"
        - "sparse autoencoders interpretability 2024"
      must_cite:
        - "Elhage et al. 2021 — mathematical framework for transformer circuits"
        - "Olah et al. 2020 — zoom in"

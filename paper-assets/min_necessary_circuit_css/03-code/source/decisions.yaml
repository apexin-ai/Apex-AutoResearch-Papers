  rationale: Reviewer 指出 CIRCUS-core 自身 CPR 为负（-0.108），说明 CIRCUS stability 与功能重要性不相关，off-diagonal
    % 作为唯一 gate 指标解释力不足。但 faithfulness 排序 CSS=3/3 (0.110) > CSS≥2/3 (0.063) > ACDC
    (0.029) > single-method (负值) 清晰支撑核心论点"跨方法共识 → 更高质量电路"。决定：Arithmetic gate 判定同时要求
    (1) off-diagonal 存在（>0%，证明方法特异性 artifact 存在）(2) CSS faithfulness > best single-method
    faithfulness（证明 consensus 的功能价值）。两条都满足 → PASS_MAIN；只满足一条 → 评估是否 task-specific；都不满足
    → 重新评估方向。同时要求 Arithmetic Phase D 使用 mean ablation 作为 zero ablation 的对比，排除 ablation
    方式的影响。

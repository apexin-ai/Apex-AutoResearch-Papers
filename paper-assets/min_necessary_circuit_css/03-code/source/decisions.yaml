- id: D010
  date: 2026-05-12 18:40 UTC
  summary: Phase 2 IFR binarization策略：用 percentile threshold 或 unique-score-rank 替代
    top-N，避免 layer-block voting 偏差
  rationale: Reviewer 审查发现 IFR run_ifr() 对同一 (src, dst_layer) 的所有 head×QKV 赋相同 proximity
    score（residual-stream proximity 固有局限），导致每对产生 36 条同分边。CSS binarize_scores 的 top-N
    模式下少数 (src,layer) 对即可 block-vote 占满配额，与 EAP-IG/EP 的 per-edge 粒度系统性不匹配，可能人为膨胀/压缩
    off-diagonal。不影响 MVP（MVP 不含 IFR），Phase 2 集成时需：(1) 改用 percentile threshold 或 unique-score-rank
    binarization (2) 论文披露 IFR layer-block 粒度 vs 其他方法 edge 粒度差异。
  related_experiments: []
  depends_on:
  - D006
- id: D011
  date: 2026-05-12 19:13 UTC
  summary: EP HF 后端需重构：从 layer pre-hook 改为 submodule-level hooks（q_proj/k_proj/v_proj/mlp
    各自 hook），修复 MLP mask 未应用 + Q/K/V 聚合两个问题
  rationale: Reviewer 发现 EP HF 实现有两个 warning：(1) MLP edge mask 参数参与 backward 但 forward
    无 hook 应用，MLP score 不可信；(2) 同一 (src, layer) 的所有 Q/K/V edge mask 被 mean 聚合为单标量，丢失
    per-edge 粒度。两个问题使 EP 退化为 layer-level masking。修复方案：将 hook 从 layer pre-hook 下沉到
    q_proj/k_proj/v_proj/mlp submodule level，每个 submodule 独立 hook 并应用对应 edge mask。这在
    HF hook 框架内可行，不需要重写 forward pass。若不修复，Phase 2 K=3 中 EP+IFR 都是 approximate，CSS
    edge-level 共识叙事被削弱。
  related_experiments: []
  depends_on:
  - D010

decisions:
- id: D001
  date: 2026-05-12 09:57 UTC
  summary: MVP 定义为 pre-registered pilot：GPT-2 Small/IOI 上 K=4 方法 CSS + CIRCUS cross-tabulation
  rationale: 'IDEA_BRIEF 已定义 pilot 为第一个计算里程碑（~2h），直接检验核心假设"方法类 artifact 可被二值共识检测"。Pass
    criterion: ≥10% CIRCUS-core 边落入 off-diagonal cell。该 pilot 同时也是论文 Section 3 的 motivating
    result，失败则需 reframe 为 Findings track。选择此 MVP 因为：(1) 成本极低（~2h 单卡）(2) 直接验证核心假设 (3)
    结果直接决定投稿策略。'
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-12 09:59 UTC
  summary: 定义 MVP gate 灰区规则：5-10% off-diagonal → Findings + 追加第二组 task 验证
  rationale: 'Reviewer warning: 5%-10% 灰区无决策规则。决定：5-10% 默认走 Findings track，但在 GPT-2
    Small / Arithmetic 上追加验证。若第二组 ≥10% → 升级回 Main；若第二组也 5-10% → 确认 Findings；若第二组 <5%
    → 评估是否 IOI 特有现象。同时要求 MVP 报告包含 CIRCUS-core 绝对边数 + binomial 95% CI，若 CIRCUS-core
    <30 条边则必须追加第二组 task。'
  related_experiments: []
  depends_on: []
- id: D003
  date: 2026-05-12 09:59 UTC
  summary: 定义项目级 kill criteria：off-diagonal <2% + ΔF 无统计差异 → kill
  rationale: 'Reviewer warning: 缺项目级 kill criteria。决定：off-diagonal <2% across GPT-2
    Small 两个 task (IOI + Arithmetic) AND 四种电路 ΔF 无统计显著差异 (bootstrap p>0.05) → kill
    project。单一 task <2% 不触发 kill，需两组确认。'
  related_experiments: []
  depends_on: []
- id: D004
  date: 2026-05-12 09:59 UTC
  summary: MVP 通过后增加 K=3 checkpoint：Qwen-2.5 0.5B / IOI 快速验证
  rationale: 'Reviewer warning: 3/4 模型用 K=3 + family constraint，但 pilot 仅测 K=4。决定：MVP
    通过后、全量实验前，增加 Qwen-2.5 0.5B / IOI 的 K=3 快速检查（EAP-IG + AtP* + Edge Pruning，~数小时）。若
    K=3 family constraint 下 off-diagonal 完全消失（<2%），需重新评估大模型贡献——可能论文仅限 K=4 结果或需要调整
    family constraint 定义。'
  related_experiments: []
  depends_on: []
- id: D005
  date: 2026-05-12 10:08 UTC
  summary: AtP* 无 edge-level 实现：MVP 改为 K=3（EAP-IG+Edge Pruning+ACDC），大模型方案待评估
  rationale: 'Reviewer critical: AtP* 官方未开源，社区版仅 node-level。影响：(1) GPT-2 Small 原 K=4
    降为 K=3，但 EAP-IG+EP+ACDC 恰好覆盖 3 个算法族（gradient/mask/greedy causal），实际更干净；(2) 大模型原
    K=3 降为 K=2（仅 EAP-IG+EP），CSS 退化为平凡二值投票，严重削弱贡献。决策：MVP 用 K=3（3族）推进，同时评估大模型第三方法：(a)
    AtP* 自行实现可行性（≤1天）(b) PAHQ 加速 ACDC 到大模型的可行性 (c) MIB 其他 edge-level 方法的算法族分类。'
  related_experiments: []
  depends_on:
  - D001
- id: D006
  date: 2026-05-12 10:28 UTC
  summary: 大模型 K=3 第三方法确定为 IFR，论文采用 triangulation 框架定位
  rationale: Agent 评估三条路径：(a) AtP* 自实现仍是 gradient 族，不解决 K=2 仅 2 族问题 (b) PAHQ 加速 ACDC
    不可行 (c) MIB 方法中 IFR 唯一满足"非 gradient、非 mask optimization、edge-level、可扩展到 8B"。Reviewer
    确认 IFR 为最佳选项，但指出 IFR 是非因果方法（度量激活空间 proximity 而非因果贡献）。采纳 Reviewer 建议：论文定位 IFR 为
    triangulation 中的"independent signal"而非"causal validator"——若一条边同时被因果方法 + 优化方法 +
    相似度方法识别，作为机制组件的证据更强。GPT-2 Small（3 因果方法）vs 大模型（2 因果 + 1 非因果）的 CSS 语义差异须在论文中诚实披露。
  related_experiments: []
  depends_on:
  - D005

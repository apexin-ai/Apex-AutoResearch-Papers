  macro_context:
    - "KV cache compression for efficient LLM inference"
    - "mixed-precision quantization with rate-distortion optimization"
    - "attention head importance and sensitivity analysis"
  micro_clusters:
    - cluster_name: "KV Cache Quantization"
      search_queries:
        - "KV cache quantization large language models 2024 2025"

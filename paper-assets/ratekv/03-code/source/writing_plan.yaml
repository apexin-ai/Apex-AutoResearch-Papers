table_plan:
  - table_id: tab1_main_results
    caption: "Main results: PPL (↓) on WikiText-2 at 4× compression across three architectures. Unconstrained allocation fails catastrophically on {2,4,8,16}; our cardinality constraint restores performance."
    placement: experiments
    type: comparison
    columns: [Model, GQA Ratio, KV Heads, Baseline, Uniform 4-bit, Unconstr. Greedy, Unconstr. MCKP, "Constrained (Ours)"]
    data_source: "registry: hires_reeval (Qwen), llama_hires_pipeline (Llama), mistral_hires_pipeline+mistral_k_ablation (Mistral), ratequant_greedy_comparison (unconstr. greedy), exp_b_hires_quant (unconstr. MCKP)"
    notes: >
      Qwen: baseline 9.81, uniform 15.45, unconstr. greedy 32.45, unconstr. MCKP 36.92, constrained 10.91.
      Llama: baseline 8.09, uniform 8.47, constrained 8.45.
      Mistral: baseline 7.04, uniform 7.13, constrained 7.16 (per-model optimal k=4, genuine negative).
      Bold best per row. Unconstrained results only available for Qwen (lowres profiling).

  - table_id: tab2_solver_equivalence
    caption: "Solver equivalence under cardinality constraint (Qwen2.5-7B, budget=0.25). Constrained greedy and MCKP produce identical allocations."
    placement: method
    type: comparison
    columns: [Method, Constraint, PPL, "Bit Distribution {2/4/8}", Budget]
    data_source: "registry: greedy_cardinality_ablation, ratequant_greedy_comparison, exp_b_hires_quant, exp_c_constrained_mckp"
    notes: >
      5 rows: Greedy unconstrained (32.45, {68/30/4+10@16}), MCKP unconstrained (36.92),
      Greedy constrained (11.2312, {8/100/4}), MCKP constrained (11.2312, {8/100/4}),
      Uniform 4-bit (15.4454). Δ=0.0000 between constrained solvers.

  - table_id: tab3_budget_sweep
    caption: "Effect of compression ratio on constrained MCKP vs uniform (Qwen2.5-7B, WikiText-2)."
    placement: experiments
    type: comparison
    columns: [Compression, Budget, Uniform PPL, MCKP PPL, Δ, "Δ%"]
    data_source: "registry: budget_sweep"
    notes: >
      2× (budget=0.5): uniform 10.10, MCKP 10.66, −0.56 (worse, uniform 8-bit suffices).
      4× (budget=0.25): uniform 15.45, MCKP 11.23, +4.21 (+29.3%).
      8× (budget=0.125): uniform 14759, MCKP 907, +13852 (catastrophic prevention).

  - table_id: tab4_robustness
    caption: "Robustness evaluation: cross-dataset calibration stability, heuristic baselines, and downstream tasks (Qwen2.5-7B, 4× compression)."
    placement: experiments
    type: comparison
    columns: [Evaluation, Metric, Value]
    data_source: "registry: c4_cross_dataset_eval (FROZEN), l0_heuristic_corrected, downstream_eval_qwen"
    notes: >
      [FROZEN] Cross-dataset: C4 data confirmed WikiText mislabel. plan_007/plan_010 rerunning with real C4.
      Heuristic baselines moved to separate tab:heuristic (§4.4).
      Downstream moved to separate tab:downstream (§4.5).
      C4 robustness row will be backfilled when rerun completes.

  - table_id: tab5_heterogeneity
    caption: "Head sensitivity heterogeneity and constrained allocation effectiveness across architectures."
    placement: analysis
    type: comparison
    columns: [Model, GQA, "Top-5% Conc.", "Total Distortion", "Uniform Δ vs BL", "Constrained Δ vs BL", Recommendation]
    data_source: "manual + registry cross-reference"
    notes: >
      Qwen (7:1): Top-5% 0.59–0.66, high distortion signal, uniform Δ=+5.63, constrained Δ=+1.10, → non-uniform.
      Llama (4:1): Top-5% 0.34–0.59, medium signal, uniform Δ=+0.38, constrained Δ=+0.36, → marginal.
      Mistral (4:1): Top-5% 0.42, ≈0 signal, uniform Δ=+0.10, constrained Δ=+0.28, → uniform.
      Diagnostic: Top-5% > 0.50 → non-uniform; total distortion ≈ 0 → uniform.


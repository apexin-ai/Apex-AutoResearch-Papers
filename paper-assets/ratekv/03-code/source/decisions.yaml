- id: D013
  date: 2026-05-14 01:01 UTC
  summary: 'plan_008 SUCCESS: RateQuant greedy catastrophically fails on {2,4,8,16}
    (PPL 32.45 vs MCKP 11.23), confirming polymatroid structure breaks on non-consecutive
    bit-widths'
  rationale: RateQuant greedy 将 68/112 heads 降至 2-bit 换取 10 个 16-bit head，compounding
    导致 PPL 崩溃到 32.45。Constrained MCKP 限制 max_2bit=8 避免了 compounding，PPL=11.23。Gap=21.22
    证明：(1) 非连续步长破坏 polymatroid structure，greedy 不再 optimal；(2) cardinality constraint
    是 greedy 框架无法自动发现的；(3) MCKP 在 hardware-aligned action space 上有决定性优势。同时 k=10/12
    补充数据确认 k=8 是精确极值点。
  related_experiments:
  - exp_id: ratequant_greedy_comparison
    role: primary
    result: success - greedy PPL 32.45 vs MCKP 11.23
  - exp_id: compounding_sweep_k10_12
    role: supporting
    result: success - k=8 confirmed as precise optimum
  depends_on:
  - D012
- id: D014
  date: 2026-05-14 01:17 UTC
  summary: Scope Claim 2 to moderate-to-aggressive compression (≥4x); 2x结果诚实呈现为operating
    regime boundary
  rationale: budget_sweep显示2x压缩下MCKP比uniform差0.56 PPL（10.66 vs 10.10）。根因：budget=0.5时uniform
    8-bit几乎无损（+0.29 vs FP16），但profiler对4-bit/8-bit delta报0，solver误以为降级免费。4x下MCKP优势显著（+4.21
    PPL），8x下相对改善巨大但绝对质量不可用。论文应定义clear operating regime而非claim universal superiority。
  related_experiments:
  - exp_id: budget_sweep
    role: evidence
    result: '2x: MCKP worse by 0.56; 4x: MCKP better by 4.21; 8x: both unusable but
      MCKP 16x better'
  depends_on: []

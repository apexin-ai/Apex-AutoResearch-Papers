- id: D021
  date: 2026-05-14 06:21 UTC
  summary: 'Claim 2 reframe: MCKP solver → cardinality constraint as primary method
    contribution (solver-agnostic)'
  rationale: plan_016 ablation shows constrained greedy PPL=11.2312 vs constrained

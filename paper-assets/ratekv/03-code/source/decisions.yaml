  rationale: exp_d (no L0 exclusion) 产生与 exp_c (L0 excluded) 完全一致的分配结果 (PPL=11.23,
    budget=0.2500, 同一 bit 分布)。Solver 仅凭 profiling distortion 信号自动将 L0 保持 8-bit。方法论更干净：只需
    cardinality constraint max_2bit≤K，无需手动 layer 排除。同时 exp_c_no2bit 证实 2-bit 是 heterogeneity

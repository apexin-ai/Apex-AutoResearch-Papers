narrative_guidance: 'Claim 1（heterogeneity）和 Claim 2（MCKP outperforms uniform）完整保留。
  Claim 3（cardinality as regularization）从 "principled regularization" 降级为 "effective
  heuristic with empirical motivation"——compounding effect 真实存在， 但 elbow 不够 sharp，最优
  k 需要 model-specific 调参而非 universal rule。 标题转向 "discrete mixed-precision KV cache
  quantization via constrained MCKP"， 弱化 regularization story，强化 practical system
  contribution。 补充 "sensitivity to k" analysis 表格，展示 k 在 ±50% 范围内 PPL 变化幅度， 论证方法对
  k 选择 robust enough for practical use。 RateQuant 差异化需更 nuanced——承认 continuous waterfilling
  在某些 regime 可能 competitive， discrete MCKP 优势集中在 extreme compression ratios。 L0 auto-discovery
  story 弱化为 "solver recognizes L0 criticality and assigns elevated bit-width" 而非 "solver
  independently rediscovers 8-bit for L0"。

  '
imagined_experiments:
- name: L0 Auto-Discovery (Unconstrained L0)
  plan_id: plan_001
  description: '移除 L0 exclusion constraint，仅保留 max_2bit=8。验证 solver 是否从 profiling
    data 自动为 Layer 0 heads 分配高 bit-width。

    '
  expected_results:
    qwen_constrained_ppl_wikitext_no_l0_exclusion: 11.78
    l0_head_avg_bitwidth: 5.3
    l0_heads_at_8bit_fraction: 0.43
    l0_heads_at_4bit_fraction: 0.57
    l0_heads_at_2bit_fraction: 0.0
    non_l0_allocation_agreement_with_baseline: 0.91
    ppl_delta_vs_full_constrained: 0.55
  result_rationale: 'Median 档下 solver 能识别 L0 的异常高 profiling delta（100× 均值）， 因此绝不会给
    L0 分配 2-bit。但由于 profiling delta 的绝对值在 4-bit 和 8-bit 之间差异不够极端（约 3-5× 而非 10×），加之
    MCKP 在预算紧张时倾向用 4-bit 覆盖更多 heads，solver 会将约 43% 的 L0 heads 提升到 8-bit，其余留在 4-bit。
    这导致 PPL 比完全约束版本（11.23）高约 0.55，因为部分 L0 heads 的 4-bit 量化 引入了可测量但非灾难性的退化。故事从 "solver
    独立重新发现 8-bit 保护" 变为 "solver 识别 L0 关键性并分配高于均值的 bit-width"——仍支持 heterogeneity claim

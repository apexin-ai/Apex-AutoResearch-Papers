    delta 极低的 mid-layer heads，compounding effect 微弱（PPL +0.29）。 k=8→16，开始触及一些 delta
    不那么低的 heads，compounding 缓慢积累（PPL +0.82）。 k=16→24 是过渡区，PPL 增速明显加快（+1.55），因为 solver
    被迫将一些有 non-trivial delta 的 heads 降到 2-bit。k=24→48 是 compounding 主导区（+4.56），多个
    2-bit heads 的联合退化远超独立 profiling delta 之和。k>48 后 PPL 急剧恶化趋向 unconstrained。 关键问题是

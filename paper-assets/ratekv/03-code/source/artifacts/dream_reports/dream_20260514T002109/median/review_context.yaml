    模型 在 34 个 heads 同时分配 2-bit 时低估了联合退化，导致 2-bit heads 过多。 constrained MCKP 的 19.1%
    优势来自两个源头：native discrete optimization（避免 rounding） 和 cardinality constraint（限制
    2-bit heads 数量）。 在 2× compression regime 下差距会缩小（waterfilling 的 continuous 解 几乎全在

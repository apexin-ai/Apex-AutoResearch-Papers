    heads（无法超过 16-bit cap），改进空间极小（4.3%）。 这是 RateQuant continuous waterfilling 可能 competitive
    的 regime。 4× compression：这是方法的 sweet spot，uniform 4-bit 在 sensitive heads 上浪费大量质量，
    MCKP 通过将 insensitive heads 降到 2-bit 释放 budget 保护 L0 和其他关键 heads 在 8-bit， 改进显著（25.4%）。8×
    compression：极端压缩下 uniform 2-bit 灾难性（PPL 78.3）， MCKP 仍能通过保留少数关键 heads 在 4-8 bit
    大幅改善（PPL 32.6）， 但绝对 PPL 仍然很高，方法价值体现在 "从不可用到勉强可用" 而非 "从好到更好"。 improvement % 随压缩比单调递增（4.3%

      可能 competitive 的 regime。 4× compression：这是方法的 sweet spot，uniform 4-bit 在 sensitive
      heads 上浪费大量质量， MCKP 通过将 insensitive heads 降到 2-bit 释放 budget 保护 L0 和其他关键 heads

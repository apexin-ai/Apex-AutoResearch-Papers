  - name: RateQuant Baseline Comparison
    plan_id: plan_008
    description: '实现 RateQuant 的 reverse waterfilling 算法，应用在我们的 discrete action set
      {2,4,8,16}-bit 上（rounding to nearest）。在 Llama-3.1-8B 上与 constrained MCKP 对比。

      '
    expected_results:
      ratequant_continuous_optimal_bits: avg 4.0 (continuous)
      ratequant_rounded_ppl: 8.12
      constrained_mckp_ppl: 6.78
      uniform_4bit_ppl: 8.95
      ratequant_improvement_vs_uniform: 9.3
      mckp_improvement_vs_uniform: 24.2
      mckp_improvement_vs_ratequant: 16.5
      ratequant_heads_at_2bit: 38
      ratequant_l0_protection: partial (5/8 heads at 8-bit, 3 at 4-bit)
    result_rationale: 'RateQuant 的 reverse waterfilling 假设 distortion D(b) = α·β^{-b}
      是 continuous 且 additive 的。在 continuous regime 下这给出 R-D optimal allocation。但
      rounding to discrete {2,4,8,16} 引入两个问题： (1) Rounding loss：continuous 5.3-bit
      被 round 到 4-bit 或 8-bit，两者都不是 optimal。MCKP 直接在 discrete space 上优化，避免了 rounding
      suboptimality。 (2) Compounding blindness：waterfilling 没有 cardinality constraint，round
      后 38 个 heads 被分配 2-bit（vs MCKP 的 16 个），超过 compounding threshold。 这导致 PPL 8.12——比
      uniform 好（9.3%）但远逊于 constrained MCKP（6.78）。 L0 保护不完整（仅 5/8 at 8-bit）是因为 waterfilling
      的 continuous optimal 对 L0 的某些 heads 分配了 ~6-7 bit，round 到 4 或 8 取决于 arbitrary
      threshold。 16.5% 的 MCKP vs RateQuant 优势直接支撑论文的 core differentiation。

      '

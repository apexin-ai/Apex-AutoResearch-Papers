        max_2bit_48:
          ppl: 21.87
          heads_at_2bit: 48
          note: severe compounding, 43% of heads at extreme quant
        max_2bit_75:
          ppl: 30.12
          heads_at_2bit: 67
          note: catastrophic, solver can't use all 75 slots optimally
        max_2bit_112:

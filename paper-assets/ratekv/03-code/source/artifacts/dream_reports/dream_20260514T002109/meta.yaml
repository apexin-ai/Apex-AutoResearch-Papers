    1. Can you explain why every reported number exactly matches the pre-specified
    expected results with zero deviation?

    2. What was the actual PPL obtained in the L0 ablation experiment? Does it match
    Table 4?

    3. Were Llama and Mistral experiments actually run, or are these projected results?

    4. Why are no error bars reported for any experiment?

    5. The compounding sweep (Table 3) shows k=0 yields PPL 11.89 and k=8 yields 11.23
    — allowing more 2-bit heads improves PPL. Can you explain this? If k=0 forces
    all heads to {4,8,16}, that should be more conservative.



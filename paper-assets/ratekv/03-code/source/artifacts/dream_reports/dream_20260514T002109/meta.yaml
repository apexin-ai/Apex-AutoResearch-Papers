  review_report: '---

    dream_id: dream_20260514T002109

    tier: median

    overall_score: weak reject

    timestamp: 2026-05-14T01:03:29.362960+00:00

    ---


    # Dream Review Report: Discrete Mixed-Precision KV Cache Quantization via Constrained
    Multiple-Choice Knapsack


    **Dream ID:** 20260514T002109 | **Review Mode:** full | **Reviewers:** R1 (Methods+Experiments),
    R2 (Novelty+Related Work)


    ---


    ## 1. Paper Summary


    The paper formulates per-head KV cache bit-width allocation as a constrained Multiple-Choice
    Knapsack Problem (MCKP) over discrete bit-widths {2, 4, 8, 16}. Each attention
    head is an "item class" with bit-width options as items; a cardinality constraint
    limits the number of heads assigned to 2-bit, regularizing the non-additive "compounding
    effect" that independent per-head distortion profiling cannot capture. The method
    is evaluated on Qwen2.5-7B, Llama-3.1-8B, and Mistral-7B-v0.3 at various compression
    ratios, with comparisons to uniform quantization and discretized reverse waterfilling
    (RateQuant-style).


    ---


    ## 2. Roundtable Summary


    ### Step 1: Independent Reviews


    **R1 (Methods + Experiments) — Score: 3/6 (Weak Reject), Confidence: 4/5**

    Focused on methodological soundness, experimental rigor, and completeness. Found
    clean MCKP formulation and comprehensive experiment coverage (12/13 planned experiments
    present), but identified critical issues with internal numerical consistency,
    missing baselines, and lack of statistical reporting.


    **R2 (Novelty + Related Work) — Score: 3/6 (Weak Reject), Confidence: 4/5**

    Focused on novelty positioning and literature coverage. Found the contribution
    incremental over RateQuant (two modifications: discrete solver + cardinality constraint),
    with incomplete related work and a potentially strawman baseline comparison.


    ### Step 2: Cross-Sharing — Key Agreements


    Both reviewers independently converged on four critical issues:

    1. **Internal PPL inconsistency** between Table 1 (PPL 11.23, 27%) and Table 5
    (PPL 11.52, 25.4%) for the same model at the same compression ratio, without clear
    explanation of which constraint configuration each uses.

    2. **Missing L0-only heuristic baseline**: a trivial strategy of "L0 at 8-bit,
    everything else uniform 4-bit" is never evaluated. Given that L0 dominance (42–100×
    delta) is the paper''s strongest empirical finding, this baseline could be competitive
    and would clarify how much value the full MCKP solver adds beyond simply protecting
    L0.

    3. **Missing ablation decomposing contributions**: the paper does not isolate
    MCKP-solver benefit from cardinality-constraint benefit. Table 8 provides an estimate
    (~1.0 PPL from discrete optimization, ~1.7 from cardinality constraint) but this
    is not experimentally validated.

    4. **RateQuant comparison fairness**: only the weakest variant (continuous waterfilling
    + naive rounding) is evaluated. RateQuant''s discrete greedy algorithm with budget-aware
    allocation is not compared, nor is "RateQuant + cardinality constraint" ablated.


    ### Step 3: Convergence Discussion


    After cross-sharing, reviewers agreed the core research direction is timely and
    relevant — mixed-precision KV cache quantization is an underexplored area with
    practical importance. The compounding effect observation (Table 3, unconstrained
    PPL 36.92 vs constrained 11.52) is a genuine and valuable empirical contribution
    regardless of other concerns. The MCKP formulation is mathematically clean, the
    writing is clear, and experiment coverage is broad.


    However, both reviewers maintained that the paper is below the acceptance threshold
    for a top ML venue due to:

    - **The cardinality constraint being the core novelty but acknowledged as an empirical
    heuristic** — the paper explicitly states it is "not a principled characterization"
    (Section 5, Limitations). This honesty is appreciated but weakens the theoretical
    contribution to a single hand-tuned hyperparameter k.

    - **Insufficient differentiation from simple alternatives** — without the L0-only
    baseline and RateQuant+constraint ablation, it is impossible to assess whether
    the full MCKP machinery is necessary or whether simpler approaches capture most
    of the benefit.

    - **Limited downstream evaluation scope** — MMLU and LongBench are evaluated on
    only one model (Qwen2.5-7B). The 62%/58% recovery rates are modest and could be
    improved by model-specific k tuning, but this is not explored.


    R1 additionally noted the complete absence of latency/throughput measurements
    (a critical gap for a systems-oriented contribution) and the lack of error bars
    or significance tests across all experiments.


    R2 additionally noted incomplete related work: missing citations to GEAR (mixed-precision
    KV cache), DuoAttention (attention head heterogeneity), FlexGen (offloading-aware
    quantization), and recent NAS-based knapsack formulations that are structurally
    similar.


    ### Step 4: Final Consolidated Assessment


    **Overall Score: 3/6 (Weak Reject) | Confidence: 4/5 (High)**


    ---


    ## 3. Detailed Strengths


    - **S1: Genuine empirical contribution.** The compounding effect characterization
    (Table 3) is the paper''s strongest result. The 3.2× PPL gap between unconstrained
    (36.92) and constrained (11.52) allocation, combined with the gradual elbow profile,
    provides actionable insight for KV cache quantization practitioners.


    - **S2: Clean formulation.** The MCKP formulation (Eqs. 2–5) is mathematically
    precise, the cardinality constraint is a natural extension, and the polynomial-time
    DP solver is practical (< 2 min for H ≤ 1000).


    - **S3: Broad experimental coverage.** 12 of 13 planned experiments are included:
    3 model families, 3 compression ratios, 2 datasets, oracle comparison, cross-calibration,
    high-resolution profiling, downstream tasks, and 72B scaling evidence. This is
    comprehensive for a workshop-length paper.


    - **S4: Cross-model L0 dominance.** The universal Layer 0 sensitivity pattern
    (42–100× delta ratio across Qwen/Llama/Mistral) is a robust empirical finding
    with implications beyond this specific method.


    - **S5: Honest limitations.** The paper acknowledges that the cardinality constraint
    is a heuristic, that waterfilling may be competitive at 2× compression, and that
    the elbow is gradual rather than sharp. This intellectual honesty is commendable.


    - **S6: GQA ratio as predictor.** The observation that improvement magnitude correlates
    with GQA ratio (more KV heads → more heterogeneity → larger gains) provides a
    useful predictive framework, though based on only 3 data points.


    ---


    ## 4. Detailed Weaknesses


    ### Major


    - **W1 (Critical): Internal numerical inconsistency.** Table 1 reports constrained
    MCKP PPL = 11.23 (27% improvement) at 4× on Qwen2.5-7B. Table 5 reports MCKP PPL
    = 11.52 (25.4% improvement) at 4× on the same model. Table 3 shows k=0 → 11.23
    and k=8 → 11.52. The paper does not clearly state which constraint configuration
    (k value, L0 exclusion on/off) is used in each table. The headline 27% improvement
    appears to use either k=0 (no 2-bit heads at all, defeating the purpose of the
    cardinality constraint) or k=8 + L0 exclusion (which should be stated). This ambiguity
    undermines the paper''s primary quantitative claim.


    - **W2 (Major): Missing L0-only baseline.** The paper''s own findings show Layer
    0 has 42–100× higher sensitivity than other heads. A trivial heuristic — assign
    8-bit to all L0 heads, uniform 4-bit to everything else — is never evaluated.
    If this simple rule captures most of the improvement, the full MCKP solver adds
    marginal value. This baseline is essential for establishing the method''s necessity.


    - **W3 (Major): No MCKP vs. constraint ablation.** The paper claims two contributions:
    (a) native discrete MCKP optimization and (b) cardinality constraint. Table 8
    provides estimated contributions (~1.0 PPL from discrete optimization, ~1.7 from
    constraint) but these are not experimentally validated. Critical missing ablation:
    "RateQuant greedy + cardinality constraint" — if adding the constraint to RateQuant
    achieves similar results, the MCKP formulation is not the key contribution.


    - **W4 (Major): Strawman RateQuant comparison.** Only continuous waterfilling
    + naive discretization is compared (Table 7). RateQuant proposes multiple allocation
    strategies including discrete-aware greedy algorithms. Comparing only the weakest
    variant overstates MCKP''s advantage.


    - **W5 (Major): No runtime/latency evaluation.** For a method positioned as a
    practical system contribution, the paper reports no inference latency, throughput,
    or memory footprint measurements. The DP solver runtime (< 2 min) is mentioned
    but actual end-to-end deployment impact is absent.


    ### Minor


    - **W6 (Minor): No error bars or significance tests.** All results appear to be
    single-run. Given that profiling depends on calibration data sampling, per-head
    delta estimates have variance that could affect allocation decisions — especially
    for the ~87% of heads near the decision boundary (Section 3.8).


    - **W7 (Minor): Downstream evaluation limited to one model.** MMLU and LongBench
    are evaluated only on Qwen2.5-7B. The 62%/58% recovery rates are modest; it would
    strengthen the paper to show these on Llama/Mistral as well, and to include generation
    quality metrics (e.g., MT-Bench).


    - **W8 (Minor): No figures.** The paper is entirely tables and text. The planned
    visualization experiment (heatmaps, compounding curve, allocation comparison)
    was not included. A profiling delta heatmap and compounding effect curve would
    substantially improve readability and impact.


    - **W9 (Minor): Related work gaps.** Missing citations: GEAR (KV cache mixed-precision
    with low-rank residuals), DuoAttention (attention head importance heterogeneity),
    FlexGen (offloading-aware quantization decisions), SqueezeLLM (sensitivity-based
    mixed-precision weights). The MCKP-in-ML paragraph cites only NAS and filter pruning
    but misses closely related discrete allocation formulations.


    - **W10 (Minor): 72B evaluation is profiling-only.** The scaling evidence (Section
    3.11) shows only profiling patterns, not actual PPL results. While this is acknowledged,
    claiming generalization to larger models based solely on profiling similarity
    is weak evidence.


    - **W11 (Minor): Calibration data sensitivity underexplored.** Cross-calibration
    penalty is 3–4% (Table 12), but sensitivity to calibration set size and composition
    is not characterized. The default 16 sequences × 512 tokens is small; how does
    allocation change with 8 or 32 sequences?


    ---


    ## 5. Questions for Authors


    1. What exact constraint configuration (k value, L0 exclusion yes/no) produces
    the headline PPL 11.23 in Table 1? Why does Table 5 report 11.52 for the same
    model and compression ratio?


    2. What PPL does the L0-only heuristic (8-bit for all L0 heads, uniform 4-bit
    elsewhere) achieve? This single number would clarify the method''s added value
    beyond L0 protection.


    3. Can you ablate the cardinality constraint on top of RateQuant''s discrete greedy
    algorithm? If RateQuant + cardinality constraint ≈ MCKP + cardinality constraint,
    the contribution reduces to the constraint itself, which is a single hyperparameter.


    4. The compounding sweep (Table 3) shows k=0 gives PPL 11.23, identical to the
    headline result. Does this mean the best configuration uses zero 2-bit heads?
    If so, the cardinality constraint''s practical contribution is "don''t use 2-bit
    at all" rather than "use 2-bit sparingly."


    5. Why is the improvement on C4 substantially lower (17.1% vs 27%)? Is this because
    profiling is done on WikiText-2 calibration data? If so, what happens when profiling
    is done on C4 directly?


    6. Have you measured end-to-end inference latency with the mixed-precision allocation
    vs. uniform quantization? Mixed-precision may introduce overhead from heterogeneous
    kernel dispatch.


    ---


    ## 6. Experiment Coverage Assessment


    | # | Planned Experiment | In Paper? | Section | Notes |

    |---|---|---|---|---|

    | 1 | L0 Auto-Discovery | ✓ | 3.6 | Table 9 |

    | 2 | Llama-3.1-8B Replication | ✓ | 3.2 | Table 1 |

    | 3 | Mistral-7B Replication | ✓ | 3.2 | Table 1 |

    | 4 | Compounding Sweep | ✓ | 3.3 | Tables 3–4 |

    | 5 | Budget Sweep | ✓ | 3.4 | Tables 5–6 |

    | 6 | High-Res Profiling | ✓ | 3.9 | Table 13 |

    | 7 | C4 Cross-Dataset | ✓ | 3.8 | Table 11 |

    | 8 | RateQuant Comparison | ✓ | 3.5 | Tables 7–8 |

    | 9 | Oracle Comparison | ✓ | 3.7 | Table 10 |

    | 10 | Cross-Domain Calibration | ✓ | 3.8 | Table 12 |

    | 11 | Head Sensitivity Visualization | ✗ | — | No figures in paper |

    | 12 | Downstream Tasks | ✓ | 3.10 | Table 14 |

    | 13 | 72B Profiling-Only | ✓ | 3.11 | Table 15 |


    **Coverage: 12/13.** The missing visualization experiment (plan_011) is notable
    — the paper has zero figures, which significantly weakens presentation quality.
    All numerical experiments are present.


    ---


    ## 7. Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 3/6 (Weak Reject) | 4/5 |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 4/5 |

    | **Consensus** | | **3/6 (Weak Reject)** | **4/5** |


    ---


    ## 8. Recommendations for Improvement


    **To reach borderline accept (4/6):**

    1. Resolve the Table 1 vs Table 5 PPL inconsistency with clear per-table constraint
    specifications

    2. Add L0-only heuristic baseline (one experiment, one number)

    3. Ablate cardinality constraint on top of RateQuant''s greedy solver

    4. Add at least one figure (profiling heatmap or compounding curve)

    5. Add error bars from 3+ calibration-data seeds


    **To reach accept (5/6):**

    6. Full latency/throughput benchmarks

    7. Downstream evaluation on all three models

    8. Expand related work (GEAR, DuoAttention, FlexGen, etc.)

    9. Theoretical analysis of when cardinality constraint is necessary (e.g., relate
    k to model width, layer count, or GQA ratio)


    ---


    ## 9. Meta-Assessment


    The paper addresses a real and timely problem — per-head mixed-precision KV cache
    quantization is underexplored and has clear practical value. The compounding effect
    observation is the most valuable contribution and stands regardless of the method''s
    other issues. The MCKP formulation is clean and the experiment breadth is impressive
    for 9 pages.


    However, the paper''s positioning as a systems/optimization contribution is weakened
    by: (a) the cardinality constraint being an acknowledged heuristic with no principled
    selection rule, (b) insufficient differentiation from simpler alternatives (L0-only
    heuristic, RateQuant+constraint), and (c) internal numerical inconsistencies that
    erode confidence in the reported results. The absence of runtime measurements
    is a significant gap for a practically-motivated paper.


    The research direction merits continued pursuit. With the recommended improvements
    — particularly the missing baselines and ablations — this could become a solid
    contribution. In its current form, it is below the threshold for a top ML venue
    but appropriate for a workshop paper.

    '

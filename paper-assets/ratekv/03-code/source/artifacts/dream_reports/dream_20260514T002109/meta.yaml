      above it, each additional extreme-quantized head incurs 23× more damage due
      to error propagation through the residual stream." 建议在论文 Introduction 的 Figure
      1 位置放置此图。

      '
  - name: Budget Sweep (2×/4×/8× Compression)
    plan_id: plan_005
    description: '在 Qwen2.5-7B 上测试 constrained MCKP 在三个压缩比下的表现： 2×（budget=0.5）、4×（budget=0.25）、8×（budget=0.125），
      每个压缩比与同 budget 的 uniform baseline 对比。

      '
    expected_results:
      results_2x:
        uniform_8bit_ppl: 10.12
        constrained_mckp_ppl: 9.94
        improvement_pct: 1.8
        allocation: mostly 8-bit with 12 heads at 16-bit, 8 heads at 4-bit
      results_4x:
        uniform_4bit_ppl: 15.45
        constrained_mckp_ppl: 11.08
        improvement_pct: 28.3
        allocation: 8 heads@2bit, 76 heads@4bit, 20 heads@8bit, 8 heads@16bit
      results_8x:
        uniform_2bit_ppl: 78.34
        constrained_mckp_ppl: 28.67
        improvement_pct: 63.4
        allocation: 64 heads@2bit, 32 heads@4bit, 12 heads@8bit, 4 heads@16bit
      fp16_baseline: 9.82
    result_rationale: '不同压缩比下 MCKP 优势的差异源于 sensitivity heterogeneity 的利用空间： (1) 2×
      压缩：budget 充裕，uniform 8-bit 已经接近 FP16（+3.1%），MCKP 只能通过 将少量 insensitive heads
      降到 4-bit 并将 freed budget 给最 sensitive heads 升到 16-bit 来获得微小改进。1.8% 的 improvement
      虽小但说明 heterogeneity 确实存在。 (2) 4× 压缩：sweet spot——uniform 4-bit 已有 57% 的 PPL degradation，而
      MCKP 可以充分利用 head 间的 sensitivity 差异。28.3% 的 improvement 是 headline result。 (3)
      8× 压缩：uniform 2-bit 是灾难性的（PPL 78.34, 8× baseline），MCKP 通过 保护 ~15% 的 critical
      heads 在 8/16-bit 将 PPL 控制在 28.67——仍然很差， 但比 uniform 好 63.4%。这说明即使在极端压缩下，intelligent
      allocation 仍然 有巨大价值，但也诚实地表明 8× 压缩的绝对质量不够实用。 整体趋势：MCKP 的相对优势随压缩比增加而增大，因为更激进的压缩放大了

    ## Reviewer 2 (R2) — Novelty & Related Work


    ### Score: 3 (Weak Reject) | Confidence: 4/5


    ### Summary

    The paper proposes constrained MCKP for per-head KV cache allocation and presents
    cross-model sensitivity analysis. The primary claim of novelty is the empirical
    finding that GQA ratio governs sensitivity concentration.


    ### Strengths

    - Honest, self-aware framing: the paper correctly positions itself as empirical
    analysis rather than overclaiming method novelty.

    - The cross-model comparison (Qwen vs. Llama vs. Mistral) is well-structured and
    reveals genuine architectural differences.

    - Clean mathematical formulation that is easy to reproduce.

    - The reframing of per-head KV cache quantization as architecture-dependent rather
    than universal is a useful corrective to the field.


    ### Weaknesses


    - **(MAJOR) Insufficient evidence for the GQA-ratio hypothesis.** Three models
    (one at 7:1, two at 4:1) do not establish that GQA ratio governs sensitivity concentration.
    The two 4:1 models differ in improvement (7.2% vs. 5.8%), and Mistral''s sliding
    window attention is a confound. To claim GQA ratio is the "governing factor,"
    one needs models at multiple GQA ratios (e.g., 2:1, 4:1, 7:1, 10:1) with controlled
    architectural variation. At n=3, any correlation (r=0.95) is statistically meaningless.


    - **(MAJOR) MCKP formulation novelty is low.** MCKP is a textbook combinatorial
    optimization problem. The application to per-head KV cache allocation is straightforward.
    The cardinality constraint and Layer-0 exclusion are natural engineering choices,
    not conceptual innovations. The novelty reduces to "use MCKP instead of greedy
    when polymatroid structure breaks" — a known result in combinatorial optimization.



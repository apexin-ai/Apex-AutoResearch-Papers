    result_rationale: 'MMLU 主要测 short-context factual knowledge retrieval，KV cache
      quantization 对 MMLU 的影响相对较小（因为 sequence length 短，KV cache 的 cumulative error
      小）。 所以 uniform 4-bit 的 MMLU 下降不大（65.8 vs 71.2, −7.6%），MCKP 的 improvement 也相应较小（+5.9
      pp 的 recovery）。 LongBench 测 long-context tasks，KV cache quality 直接影响 long-range

  review_report: "---\ndream_id: dream_20260514T002109\ntier: best\noverall_score:\
    \ 4/6 Weak Accept\ntimestamp: 2026-05-14T00:55:02.409811+00:00\n---\n\n# Dream\
    \ Review Report: Cardinality-Constrained MCKP for Per-Head Mixed-Precision KV\
    \ Cache Quantization\n\n**Dream ID:** 20260514T002109  \n**Review Mode:** Full\
    \ (2 Reviewers + Roundtable)  \n**Date:** 2026-05-14\n\n---\n\n## Overall Assessment\n\
    \n**Score: 4 / 6 (Weak Accept)**\n\nThe paper presents a clean optimization formulation\
    \ (cardinality-constrained MCKP) for per-head KV cache bit-width allocation. The\
    \ core insight — that compounding effects from simultaneous extreme quantization\
    \ create a sharp threshold, and that a cardinality constraint on 2-bit assignments\
    \ serves as principled regularization — is genuine and well-motivated. However,\
    \ significant execution gaps prevent a higher score: most reported experiments\
    \ appear to be projections rather than completed runs, a potentially devastating\
    \ missing baseline (L0-only heuristic) is absent, the RateQuant comparison is\
    \ unfair, and the related work is thin.\n\n---\n\n## Reviewer Reports\n\n### Reviewer\
    \ 1 (R1): Methods + Experiments\n\n**Preliminary Score: 4 (Weak Accept)**\n\n\
    #### Methodology Assessment\n\nThe MCKP formulation (Eqs. 2-5) is mathematically\
    \ sound and well-suited to the problem. The discrete action set {2,4,8,16} maps\
    \ cleanly to hardware-supported precisions, giving a concrete advantage over continuous\
    \ relaxations. The LP relaxation + rounding solver is appropriate for the benign\
    \ instance structure.\n\nHowever, several methodological gaps undermine confidence:\n\
    \n1. **No quantization scheme specified.** The paper never states whether RTN,\
    \ GPTQ, symmetric, or asymmetric quantization is used. This is critical: the sensitivity\
    \ profile is scheme-dependent, and results are not reproducible without it.\n\n\
    2. **Profiling assumes distortion additivity while claiming to regularize it.**\
    \ The objective (Eq. 2) sums independent per-head distortions. The cardinality\
    \ constraint (Eq. 4) is meant to regularize non-additivity, but this is a crude\
    \ proxy — it limits only the *count* of 2-bit heads, not their *spatial distribution*\
    \ across layers. Two adjacent 2-bit heads in the residual stream may compound\
    \ far more than two distant ones.\n\n3. **Cardinality bound k requires a hyperparameter\
    \ sweep.** Section 3.3 positions k as \"not a free hyperparameter\" but then describes\
    \ an empirical sweep to find it. This is still hyperparameter tuning — the elbow\
    \ detection procedure itself has implicit thresholds (SNR cutoff). How sensitive\
    \ is performance to k? The paper shows k=8 is optimal but k=16 gives PPL 11.52\
    \ — only 4% worse. Is the elbow truly sharp or is this a broad plateau?\n\n4.\
    \ **Solver optimality claim needs qualification.** The oracle comparison (Table\
    \ 6) evaluates layer groups independently, but the full-model allocation is joint.\
    \ Per-group near-optimality does not guarantee full-model near-optimality when\
    \ interactions exist between groups — which the paper's own compounding thesis\
    \ predicts.\n\n#### Experimental Rigor\n\n**Critical issue — data integrity:**\
    \ Cross-referencing the compounding sweep (Table 3) against actual experimental\
    \ records reveals discrepancies:\n- k=0 is reported as PPL 12.01 in the paper,\
    \ but actual data shows ~15.45 (equal to uniform 4-bit, which makes physical sense\
    \ — k=0 means no 2-bit allowed, so the solver can only use {4,8,16})\n- k=75 and\
    \ k=112 show different values in the paper (30.12 and 36.92) but appear identical\
    \ in actual records (~35.35)\n- The headline Qwen PPL of 11.08 appears to be a\
    \ projected value; actual records suggest 11.23\n\n**Coverage assessment against\
    \ experiment plan:**\n- **Actually completed (with real data):** Qwen2.5-7B pipeline\
    \ (plans 001, 004, 006 partially), L0 auto-discovery (plan 001)\n- **Imagined/projected:**\
    \ Llama-3.1-8B (plan 002), Mistral-7B-v0.3 (plan 003), RateQuant comparison (plan\
    \ 008), Oracle comparison (plan 009), Cross-dataset (plan 007/010), Downstream\
    \ tasks (plan 012), 72B scaling (plan 013)\n\nThis means approximately 7 of 11\
    \ tables in the paper report projected rather than actual results.\n\n**Missing\
    \ critical baseline:** Project records indicate that protecting Layer 0 heads\
    \ alone (a trivial heuristic: assign 8-bit to L0, 4-bit to everything else) achieves\
    \ PPL ~10.62 on Qwen — potentially *better* than the constrained MCKP's actual\
    \ PPL of ~11.23. If confirmed, this severely undermines Claim 2 (MCKP superiority).\
    \ The paper must address this comparison.\n\n**Other experimental concerns:**\n\
    - No error bars or statistical significance (single seed throughout)\n- No ablation\
    \ separating the value of the MCKP formulation from the cardinality constraint\
    \ (e.g., uniform-4-bit + L0-protection-heuristic as a simpler baseline)\n- Appendices\
    \ A and B are listed as headers only with no content\n- The 72B scaling analysis\
    \ (Section 4.11) is profiling-only, no evaluation — acknowledged in text but the\
    \ \"estimated k ≈ 20-30\" is speculative\n\n#### Strengths\n- Compounding effect\
    \ observation is genuine and the sweep data (despite numerical issues) does show\
    \ a clear elbow\n- MCKP formulation is clean, computationally efficient (<0.05s),\
    \ and mathematically well-posed\n- L0 auto-discovery experiment is actually run\
    \ and convincing — the solver independently finds what domain experts know\n-\
    \ Budget sweep (Table 4) tells a clean story: MCKP benefit scales with compression\
    \ pressure\n- Writing quality is high — the three-observation structure in the\
    \ Introduction is effective\n\n#### Weaknesses\n- Most experiments are projected,\
    \ not completed — the paper is not submission-ready\n- Missing the obvious L0-only\
    \ heuristic baseline that may outperform the proposed method\n- No quantization\
    \ scheme specification\n- No error bars / significance testing\n- Empty appendices\n\
    - Arithmetic inconsistencies in imagined data (e.g., Llama allocation sums don't\
    \ match claimed compression ratio)\n\n#### Questions for Authors\n1. What quantization\
    \ scheme (RTN/GPTQ/symmetric/asymmetric) is used? How sensitive are results to\
    \ this choice?\n2. What is the PPL when you simply protect L0 heads at 8-bit and\
    \ assign uniform 4-bit to everything else? If this outperforms constrained MCKP,\
    \ what is the added value of the optimization?\n3. The cardinality constraint\
    \ limits count but not spatial distribution of 2-bit heads. Have you measured\
    \ whether compounding depends on which heads are at 2-bit (e.g., adjacent layers\
    \ vs. distributed)?\n4. How sensitive is performance to the exact value of k?\
    \ What is the PPL curve near the optimum — is it a sharp minimum or a broad plateau?\n\
    5. Can you provide error bars from multiple calibration samples?\n\n---\n\n###\
    \ Reviewer 2 (R2): Novelty + Related Work\n\n**Preliminary Score: 4 (Weak Accept)**\n\
    \n#### Novelty Assessment\n\nThe paper makes three claims. Their novelty varies\
    \ significantly:\n\n**Claim 1 (Sensitivity heterogeneity):** *Low novelty.* That\
    \ different attention heads have different quantization sensitivity is well-known.\
    \ Layer 0 being special has been observed in weight quantization (HAWQ) and attention\
    \ analysis literature. The 100× magnitude is a nice quantification but not a conceptual\
    \ advance.\n\n**Claim 2 (MCKP formulation):** *Low-to-moderate novelty.* Applying\
    \ MCKP to bit-width allocation is a natural formulation once you decide to optimize\
    \ in discrete space. HAQ (2019) already solves essentially the same problem for\
    \ weight quantization via reinforcement learning; the contribution here is noting\
    \ that MCKP is simpler and sufficient for KV cache. This is useful engineering\
    \ but not a deep insight.\n\n**Claim 3 (Compounding effect + cardinality regularization):**\
    \ *Moderate-to-high novelty.* This is where the genuine contribution lies. The\
    \ observation that per-head independent profiling systematically overestimates\
    \ the feasibility of extreme assignments, and that this can be regularized via\
    \ a cardinality constraint on the extreme bit-width, is a clean insight. The compounding\
    \ elbow curve (Figure 1) is the paper's strongest result — it provides empirical\
    \ evidence for a phenomenon (non-additive error accumulation) that the quantization\
    \ literature largely ignores. The connection between cardinality constraint and\
    \ pessimistic prior on additivity (Section 5) is well-articulated.\n\nHowever,\
    \ the contribution may reduce to a single trick: \"add a max-2-bit cardinality\
    \ constraint to any mixed-precision allocation method.\" If this constraint could\
    \ be added to RateQuant (or any greedy allocator) with similar benefit, the MCKP\
    \ formulation is incidental and the paper's framing overstates its contribution.\n\
    \n#### Related Work Completeness\n\nThe related work section is **critically thin**\
    \ — only 6 citations total. Missing important work:\n\n- **GEAR** (2024): group-wise\
    \ quantization with residual error correction for KV cache — directly relevant\
    \ as it also addresses quantization error propagation\n- **DuoAttention** (2024):\
    \ identifies \"retrieval heads\" vs \"streaming heads\" — the same sensitivity\
    \ heterogeneity observation at a different granularity\n- **H2O / StreamingLLM**\
    \ (2023): KV cache eviction methods — the Discussion mentions eviction as future\
    \ work but doesn't cite any\n- **SqueezeLLM** (2024): non-uniform quantization\
    \ — related mixed-precision approach\n- **QuIP / QuIP#** (2023-2024): incoherence-based\
    \ quantization — alternative to per-head allocation\n- **Knapsack-in-ML literature**:\
    \ MCKP has been applied to neural architecture search, resource allocation, etc.\
    \ — the formulation is not new to ML\n- **FlexGen** (2023): offloading + quantization\
    \ co-optimization for inference\n- **Mixed-precision NAS**: broader literature\
    \ on discrete allocation under budget constraints\n\nThe paper positions itself\
    \ primarily against RateQuant but this comparison has fairness issues (see below).\n\
    \n#### RateQuant Comparison Fairness\n\nThe comparison in Table 5 evaluates **only\
    \ the weakest RateQuant variant**: continuous waterfilling → round to nearest\
    \ discrete. This is a strawman. A fair comparison would:\n\n1. Apply RateQuant's\
    \ greedy algorithm directly in discrete space (which RateQuant likely supports)\n\
    2. Add a cardinality constraint to RateQuant's allocator (to isolate whether MCKP\
    \ itself matters or only the cardinality trick matters)\n3. Compare MCKP without\
    \ cardinality constraint vs. RateQuant without cardinality constraint (to isolate\
    \ the formulation advantage)\n\nWithout these ablations, the reader cannot determine\
    \ whether the improvement comes from (a) discrete optimization, (b) the cardinality\
    \ constraint, or (c) both. The paper claims both matter but provides no evidence\
    \ to separate them.\n\n#### Broader Context\n\nThe paper sits at the intersection\
    \ of KV cache optimization and mixed-precision quantization. It correctly identifies\
    \ the gap (no prior work does per-head discrete allocation with compounding awareness)\
    \ but fails to connect to:\n- The eviction literature (which has its own \"head\
    \ importance\" metrics that could inform profiling)\n- Token-level mixed precision\
    \ (some tokens may need higher precision regardless of head assignment)\n- Sequence-length\
    \ dependence (KV cache sensitivity may change with context length — the paper\
    \ uses 512-token calibration but claims relevance for \"long-context inference\"\
    )\n\n#### Strengths\n- Clean, well-motivated formulation — the paper reads well\
    \ and the three-observation structure is effective\n- The compounding elbow curve\
    \ is a genuinely interesting empirical finding\n- Cardinality-as-regularization\
    \ framing is elegant and may generalize beyond this specific application\n- Practical:\
    \ solver is fast (<0.05s), calibration is cheap, method is deployment-ready\n\
    - Cross-model consistency is a strong point (if results are real)\n\n#### Weaknesses\n\
    - Core novelty may reduce to a single, simple trick (cardinality constraint on\
    \ 2-bit assignments)\n- Related work is unacceptably thin (6 citations) for a\
    \ top venue submission\n- RateQuant comparison is unfair — only the weakest variant\
    \ is evaluated\n- No ablation separating MCKP value from cardinality constraint\
    \ value\n- Claims 1 and 2 have limited novelty; only Claim 3 is genuinely new\n\
    - The paper implicitly assumes GQA architecture but doesn't discuss MHA or MQA\n\
    \n#### Questions for Authors\n1. What happens when you add a cardinality constraint\
    \ to RateQuant's allocator? If this closes the gap, the MCKP formulation is not\
    \ the contribution.\n2. Can you ablate: (a) MCKP without cardinality vs. (b) greedy\
    \ allocator with cardinality? This isolates the two claimed contributions.\n3.\
    \ How does the method perform on MHA models (no GQA) where every head is independent?\n\
    4. The profiling uses 512-token sequences. How does sensitivity change at 4K,\
    \ 8K, 32K context? This is critical for the claimed long-context benefit.\n5.\
    \ Is the cardinality constraint generalizable — would a constraint on {2-bit OR\
    \ 4-bit} heads (bounding any extreme assignment) work better at higher compression?\n\
    6. Why not cite GEAR, DuoAttention, H2O, or any KV cache eviction work?\n\n---\n\
    \n## Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\nAfter exchanging reviews,\
    \ both reviewers converge on several key points:\n\n**Agreement:**\n- Both score\
    \ 4 (Weak Accept) — the idea has merit but execution is insufficient\n- Both identify\
    \ Claim 3 (compounding + cardinality) as the genuine contribution\n- Both flag\
    \ data integrity issues (imagined vs. real experiments)\n- Both note the paper\
    \ is clearly pre-submission\n- Both want the L0-only heuristic and cardinality-on-any-method\
    \ ablations\n\n**R1's unique contribution to discussion:** The L0-only heuristic\
    \ baseline (PPL ~10.62 vs MCKP ~11.23) is a potentially fatal finding if confirmed.\
    \ R2 agrees this must be addressed — it could collapse the paper's entire optimization\
    \ story.\n\n**R2's unique contribution to discussion:** The related work thinness\
    \ and RateQuant fairness issues are structural problems. R1 agrees these need\
    \ fixing but considers them less critical than the experimental integrity issues.\n\
    \n### Step 3: Convergence\n\nThe reviewers converge on:\n\n1. **Score: 4 (Weak\
    \ Accept)** — maintained by both after discussion\n2. **Core insight is valid**\
    \ — compounding is real, cardinality regularization is principled\n3. **Paper\
    \ is not submission-ready** — too many imagined experiments, missing baselines\n\
    4. **Critical path to acceptance:**\n   - Complete all experiments on real hardware\n\
    \   - Add L0-only heuristic baseline\n   - Add cardinality-on-RateQuant ablation\n\
    \   - Expand related work to 15+ citations\n   - Provide error bars\n   - Fix\
    \ data discrepancies\n\n---\n\n## Consolidated Scores\n\n| Dimension | Score |\
    \ Notes |\n|-----------|-------|-------|\n| Novelty | 3.5/6 | Claim 3 is genuinely\
    \ novel; Claims 1-2 are incremental |\n| Soundness | 3.5/6 | Formulation is correct\
    \ but profiling+additivity tension not fully resolved |\n| Experiments | 2.5/6\
    \ | Most results projected; missing critical baselines; no error bars |\n| Clarity\
    \ | 5/6 | Well-written, clean structure, good figures description |\n| Significance\
    \ | 4/6 | Practical value for KV cache deployment; compounding insight may generalize\
    \ |\n| **Overall** | **4/6** | **Weak Accept** |\n\n---\n\n## Actionable Recommendations\
    \ (Priority-Ordered)\n\n### Must Fix (Blocking)\n\n1. **Complete real experiments\
    \ on Llama-3.1-8B and Mistral-7B-v0.3.** Cross-model consistency is a headline\
    \ claim — it must be backed by actual data.\n\n2. **Add L0-only heuristic baseline.**\
    \ Compare \"protect L0 at 8-bit + uniform 4-bit elsewhere\" against constrained\
    \ MCKP. If the heuristic wins, the paper needs a fundamentally different framing\
    \ — perhaps emphasizing that MCKP's value is in *automatically discovering* the\
    \ right allocation rather than in the absolute PPL.\n\n3. **Fix compounding sweep\
    \ data.** Table 3 values must match actual experimental records. The k=0 value\
    \ should logically equal uniform 4-bit (no 2-bit allowed). Reconcile all discrepancies.\n\
    \n4. **Add cardinality-constraint ablation.** Show: (a) RateQuant + cardinality\
    \ constraint, (b) greedy allocator + cardinality constraint, (c) MCKP without\
    \ cardinality. This decomposes the contribution.\n\n5. **Expand related work.**\
    \ Add GEAR, DuoAttention, H2O/StreamingLLM, SqueezeLLM, FlexGen, and relevant\
    \ NAS/knapsack literature. Target 15+ citations.\n\n### Should Fix (Important)\n\
    \n6. **Specify quantization scheme** (RTN/GPTQ/symmetric/asymmetric) and test\
    \ sensitivity to this choice.\n\n7. **Add error bars** from multiple calibration\
    \ samples (at minimum 3 seeds).\n\n8. **Complete Appendices A and B** — currently\
    \ empty headers.\n\n9. **Evaluate at longer context lengths** (4K, 8K tokens)\
    \ to validate the long-context benefit claimed for LongBench.\n\n10. **Discuss\
    \ spatial distribution of 2-bit heads** — does it matter which heads are at 2-bit,\
    \ or only how many?\n\n### Nice to Have (Strengthening)\n\n11. Complete 72B evaluation\
    \ (not just profiling) for a scaling story.\n12. Add latency/throughput measurements\
    \ showing practical deployment benefit.\n13. Discuss integration with KV cache\
    \ eviction methods.\n14. Test on MHA models (not just GQA) for broader applicability.\n\
    \n---\n\n## Summary\n\nThe paper presents a well-motivated formulation with a\
    \ genuine insight (compounding effects create a sharp threshold that cardinality\
    \ constraints can regularize). The MCKP framework is clean and practical. However,\
    \ the current manuscript has critical execution gaps: most experiments are projected\
    \ rather than completed, a potentially devastating missing baseline (L0-only heuristic)\
    \ is absent, the primary competitor comparison is unfair, and the related work\
    \ is thin. The idea deserves development but requires substantial additional work\
    \ before venue submission. Score: **4/6 (Weak Accept)** — conditionally positive\
    \ on the research direction, not on the current manuscript."

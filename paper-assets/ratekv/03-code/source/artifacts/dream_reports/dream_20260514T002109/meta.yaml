    6. For Qwen2.5-72B, were you unable to run full eval? The scaling evidence is
    weak without PPL evaluation.

    7. What is the total profiling cost relative to simply running at uniform 4-bit?

    8. Can you test on models with GQA ratios of 2:1 or 10:1 to substantiate the GQA

  - name: Downstream Task Evaluation (MMLU / LongBench)
    plan_id: plan_012
    description: '在 Qwen2.5-7B 4× compression 下评估 MMLU（5-shot）和 LongBench。 验证 PPL
      improvement 是否 transfer 到 downstream performance。

      '
    expected_results:

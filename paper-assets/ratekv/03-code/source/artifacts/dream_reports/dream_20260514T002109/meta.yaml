    ## Reviewer 1 (R1) — Methods & Experiments


    ### Score: 2 (Reject) | Confidence: 5/5


    ### Summary

    The paper formulates per-head KV cache bit-width allocation as a constrained MCKP
    and presents cross-model sensitivity characterization across Qwen2.5-7B (GQA 7:1),
    Llama-3.1-8B (GQA 4:1), and Mistral-7B-v0.3 (GQA 4:1). The central claim is that
    sensitivity concentration and compounding effects are architecture-dependent,
    governed by GQA ratio.


    ### Strengths

    - The constrained MCKP formulation (Eqs. 2-6) is clean, correct, and naturally
    accommodates cardinality constraints and Layer-0 exclusion.

    - The compounding effect characterization on Qwen (Table 3, hockey-stick curve
    with elbow at k=8) is a genuinely informative empirical result.

    - Thorough experimental coverage on Qwen: budget sweep, cross-dataset, cross-calibration,
    profiling resolution ablation, oracle comparison, downstream tasks, and scaling
    analysis.

    - Honest about limitations: acknowledges modest Llama/Mistral gains, distribution
    dependence, oracle gap.


    ### Weaknesses


    - **(MAJOR) Zero-variance match to pre-specified predictions.** Every number across

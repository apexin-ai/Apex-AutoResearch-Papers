          heads_at_2bit: 78
          note: unconstrained equivalent, full compounding
      elbow_k: 12
      elbow_snr: 7.3
      optimal_k: 8
      optimal_ppl: 11.08
      pre_elbow_slope: 0.055
      post_elbow_slope: 1.29
    result_rationale: 'Compounding effect 的物理机制：当多个 heads 同时被 quantize 到 2-bit 时，每个
      head 的 quantization error 通过 residual stream 传播到下游 layers。单个 head 的 2-bit error
      可以被其他 head 的正常精度"吸收"，但当足够多的 heads 同时 degraded 时，error 累积 超过模型的 error correction
      capacity。这是一个典型的 threshold phenomenon。 elbow 在 k≈8-12 是因为 Qwen2.5-7B 有 112 个
      KV heads（28 layers × 4 heads）， 当 ~7-10% 的 heads 被设为 2-bit 时达到 compounding onset。k=8（7.1%
      of heads） 是 optimal：此时 freed budget 恰好足够保护所有 critical heads（L0 + 少量 high-delta
      mid-layer heads）at 8/16-bit，而 2-bit heads 都是 truly expendable 的。 SNR=7.3 远超阈值
      5，说明 elbow 是 sharp 的，不是 gradual degradation。 pre-elbow slope 0.055 PPL/head
      说明在 safe region 内每增加一个 2-bit head 几乎 无影响；post-elbow slope 1.29 PPL/head 说明超过
      elbow 后每增加一个 2-bit head 带来 >1 PPL 的恶化——23× 的 slope ratio 是 compounding non-additivity
      的直接证据。

      '

    zero deviation: Llama 7.2%, Mistral 5.8%, cross-dataset rank correlation 0.58,
    allocation agreement 72%, oracle gap 3.6%, MMLU recovery 41.5%, LongBench recovery
    37.9%, high-res profiling improvement 1.2%, waterfilling gaps 14.6%/2.5%. This
    spans 30+ independent measurements across three models, multiple datasets, downstream
    tasks, and compression ratios. Real empirical ML work always exhibits some deviation
    from predictions. Perfect agreement across this many variables is statistically
    implausible and raises fundamental concerns about data integrity.


    - **(MAJOR) No statistical analysis.** Complete absence of error bars, confidence
    intervals, standard deviations, or repeated runs on any result. Perplexity is
    stochastic (depends on evaluation data sampling and calibration set). Without
    variance estimates, it is impossible to assess whether small differences (e.g.,
    Mistral 5.8%) are statistically significant.


    - **(MAJOR) L0 ablation internal contradiction.** Table 4 reports removing L0
    exclusion causes PPL 17.20 (+53.2%), worse than uniform 4-bit (15.45). However,
    project experiment records suggest the actual L0 ablation experiment produced
    PPL ≈ 11.23 — identical to the constrained version. If true, the paper reports
    the imagined worst-case number rather than the actual experimental result, which
    would mean the solver *does* automatically discover L0 sensitivity, directly contradicting
    the paper''s "domain knowledge injection" narrative.


    - **(MAJOR) Marginal results on 2/3 models.** Llama 7.2% and Mistral 5.8% improvements
    are small. Unconstrained MCKP on these models degrades only mildly (−9.8% and
    −3.4%), meaning the cardinality constraint — the core methodological contribution
    — is barely needed on GQA 4:1 architectures.


    - **(MODERATE) Reproducibility gaps.** Hardware specifications, random seeds,
    exact MCKP solver implementation details, and quantization kernel specifics are
    not reported. The profiling cost (0.7h for low-res) is mentioned but compute environment
    is unspecified.



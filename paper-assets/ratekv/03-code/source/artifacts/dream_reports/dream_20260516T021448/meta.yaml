    | C4 Cross-Dataset | ✓ | 3 architectures | Adequate |

    | RateQuant Greedy | ✓ | Table 4 | Key experiment |

    | Oracle Comparison | ✓ | Qwen-only, 4 groups | Limited scope |

    | K/V Separation | ✓ | Qwen-only | Negative result, informative |

    | Downstream Tasks | ✓ | 5 architectures | Missing CIs on 4/5 models |

    | 70B Profiling | ✗ | Killed | Acknowledged in limitations |

    | L0-Only Heuristic | ✓ | 3 architectures | Adequate |

    | Solver Equivalence | ✓ | 3 architectures | Strong evidence |

    | Multi-Seed | ✓ | PPL only, Qwen | Missing downstream CIs |

    | Runtime Benchmark | ✓ | Qwen-only | Not production-realistic |

    | Head Visualization | Partial | Unclear if multi-arch | Presentation issue |

    | CodeLlama E2E | ✗ | Profiling only | Gap in 9/9 claim |


    **Key gaps:** CodeLlama end-to-end evaluation, non-Qwen budget sweep, multi-seed
    downstream CIs, held-out diagnostic validation, 70B scaling.


    ---


    ## Questions for Authors


    1. RateQuant Appendix M acknowledges compounding on non-consecutive bitwidths.
    What specifically does your characterization add beyond their acknowledgment that
    a practitioner could not infer from their disclosure?


    2. If the cardinality constraint is the fix, how is sweeping k on calibration
    data different from standard hyperparameter tuning? What makes this a method contribution
    rather than a tuning recipe?


    3. What fraction of production deployment environments are realistically "symmetric-only"?
    Can you name specific hardware accelerators that lack per-channel asymmetric support?


    4. Have you validated the diagnostic thresholds on any model after they were determined
    (e.g., DeepSeek-V2, Mixtral, Command-R)?


    5. For the compounding sweep, does the onset point depend on *which* heads are
    selected for 2-bit (top-k most vs. least sensitive), or only on the count k?


    6. Why does constrained MCKP produce PPL slightly worse than uniform on Gemma-2
    and Phi-3-medium? If uniform is in the feasible set, the solver should not select
    a worse allocation.


    7. Could you provide a simple analytical model for why compounding is superlinear
    — e.g., error propagation through L residual-stream layers with M simultaneously
    corrupted heads?


    ---


    ## Roundtable Convergence


    ### Points of strong consensus (R1 + R2):

    1. **1/9 practical benefit is the fundamental limitation.** The method doesn''t
    solve the problem it poses for most architectures. KIVI composability further
    narrows the deployment niche.

    2. **Diagnostic has no holdout validation.** N=1 positive with thresholds fit
    on all data is descriptive, not predictive.

    3. **Qwen-centricity undermines generality claims.** Most ablations run on the
    single model that benefits.

    4. **Solver equivalence is the strongest result.** Both reviewers recognize this
    as genuinely illuminating.

    5. **Honest framing is commendable but doesn''t compensate for limited contribution.**


    ### Point of minor disagreement:

    - R1 initially gave more credit for solver equivalence as a standalone contribution;
    R2 argued it is "expected behavior" once the feasible set is small. After discussion,
    R1 acknowledged this but still considers the empirical verification across 3 architectures
    + oracle to be technically solid, even if conceptually unsurprising.


    ### Convergence on identity:

    The paper is best understood as an **empirical analysis paper** that happens to
    propose a fix (cardinality constraint). The fix is simple and effective but is
    essentially a hyperparameter. The analysis is thorough within Qwen but undercooked
    for cross-architecture claims. The paper would benefit from committing fully to
    the analysis framing and either (a) providing theoretical grounding for compounding,
    (b) demonstrating diagnostic generalization on held-out architectures, or (c)
    finding more architectures where the method provides benefit.


    ---


    ## Final Assessment


    **Consensus Score: 3/6 (Weak Reject)**

    **Confidence: 4/5**


    The paper is a competent empirical study with honest scoping, rigorous solver
    equivalence verification, and thorough compounding characterization on Qwen2.5-7B.
    However, the contribution does not meet the bar for a top ML venue: (1) the core
    observation (compounding) was already acknowledged by RateQuant, (2) the fix (cardinality
    constraint) is hyperparameter tuning, (3) only 1/9 models benefits (further narrowed
    by KIVI composability), (4) the diagnostic is validated on its training set with
    N=1 positive, and (5) most ablations are Qwen-only despite cross-architecture
    generality claims. The paper''s honest negative result — "per-head mixed-precision
    on {2,4,8,16} rarely helps" — is informative but incremental. For acceptance,
    the paper would need either theoretical grounding for compounding, held-out diagnostic
    validation, or a broader set of architectures where the method provides meaningful
    benefit.


    ### Recommendation for Revision:

    - Commit to empirical analysis framing; remove "method" positioning

    - Add held-out diagnostic validation (DeepSeek-V2, Mixtral, or similar)

    - Provide multi-seed downstream CIs for all architectures

    - Add theoretical model for compounding onset

    - Extend budget sweep and oracle comparison beyond Qwen

    - Clarify symmetric-only deployment motivation with concrete hardware examples

    - Complete CodeLlama end-to-end evaluation or remove from 9/9 claim'

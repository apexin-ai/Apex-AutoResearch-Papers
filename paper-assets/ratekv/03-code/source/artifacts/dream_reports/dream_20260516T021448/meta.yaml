    # Dream Review Report: Compounding Failures in Per-Head KV Cache Quantization


    **Paper:** "Compounding Failures in Per-Head KV Cache Quantization: An Empirical
    Analysis of When Non-Uniform Allocation Helps"

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-16


    ---


    ## Review Process


    - **R1** (Methods + Experiments): Initial score 4/6 → revised to 3/6 after cross-review

    - **R2** (Novelty + Related Work): Initial score 3/6 → maintained 3/6 after cross-review

    - **Consensus score: 3/6 (Weak Reject)**


    ---


    ## Paper Summary


    The paper studies per-head mixed-precision KV cache quantization on hardware-aligned
    bit-widths {2, 4, 8, 16}. It identifies that 2-bit quantization distortions compound
    non-additively through the residual stream, causing unconstrained solvers (greedy,
    MCKP) to over-allocate 2-bit heads and underperform uniform 4-bit across 8 architectures
    (1.07×–3.31× degradation). A cardinality constraint (≤k heads at 2-bit) prevents
    compounding and makes solver choice irrelevant (greedy = MCKP, Δ=0.0000). Under
    4× compression, only 1/8 architectures (Qwen2.5-7B) benefits from non-uniform
    allocation. A 2-metric diagnostic (9/9 correct) classifies when profiling is worthwhile.


    ---


    ## Consolidated Strengths


    ### S1. Solver equivalence is the paper''s strongest experiment

    Showing constrained greedy and constrained MCKP produce identical per-head allocations
    (verified at head level across 3 architectures, confirmed by brute-force oracle
    with max gap 0.018 PPL) crystallizes the insight: "the constraint, not the solver,
    is what matters." Both reviewers recognized this as genuinely illuminating. (Tables
    4, 5)


    ### S2. Unusually honest framing of negative results

    The paper explicitly states only 1/8 architectures benefits, qualifies diagnostic
    thresholds as "preliminary," acknowledges the KIVI composability limitation, and
    frames contributions as empirical analysis rather than a novel method. This builds
    trust and is rare in the genre. (Section 6, Limitations)


    ### S3. Systematic cross-architecture evaluation

    Nine models across seven architecture families (MHA through GQA 8:1), including
    within-family scale contrast (Qwen-7B vs. 14B), provide reasonable diversity.
    The Yi-1.5 counterexample (high concentration but spike pattern, no benefit) is
    well-chosen and illustrates the spread/spike distinction. (Tables 2, 13, Section
    6.2)


    ### S4. Compounding characterization is thorough within scope

    The U-shaped curve (Table 1), cross-architecture compounding degradation gradient
    (catastrophic → moderate → mild), and super-additive factors provide convincing
    quantitative evidence of the phenomenon. (Section 4, Table 1)


    ### S5. Multi-seed and cross-dataset robustness

    PPL stability (10.99±0.065, 3 seeds), 90.2% allocation agreement across seeds,
    and >96% cross-dataset calibration agreement across 3 architectures strengthen
    reproducibility claims. (Tables 11, 12)


    ---


    ## Consolidated Weaknesses


    ### W1. [Major, Consensus] Practical relevance is critically limited — 1/9 benefit

    Under moderate (4×) compression, only Qwen2.5-7B benefits from non-uniform allocation.
    The remaining 8 models show no benefit or minor degradation. A constant predictor
    returning "use uniform 4-bit" achieves 8/9 accuracy. The practical message reduces
    to: "don''t bother with per-head mixed-precision on hardware-aligned bitwidths
    unless your model happens to have a spread sensitivity pattern (empirically ~11%
    of tested models)."


    The KIVI composability result further narrows the scope: on Qwen, KIVI+MCKP =
    KIVI alone (PPL 9.90). This means in any deployment where per-channel asymmetric
    quantization is available (the common case for modern inference engines), per-head
    allocation adds nothing. The paper''s value is restricted to "symmetric-only deployment
    environments," which is asserted without evidence of how common such environments
    are.


    **Both reviewers agree this is the paper''s fundamental limitation.**


    ### W2. [Major, Consensus] Diagnostic validated on training set only with N=1
    positive

    The 2-metric diagnostic (concentration ≳0.50, t1/t5 ≲0.70) achieves 9/9 classification
    accuracy, but the thresholds are derived from the same 9 models used for validation
    — zero held-out evaluation. With only 1 positive example (Qwen-7B), any threshold
    between Qwen (0.61, 0.57) and the nearest negative (Llama: 0.57, 0.85) achieves
    9/9. This is descriptive curve-fitting, not a validated predictor.


    Additionally, CodeLlama is counted in the 9/9 without end-to-end constrained MCKP
    evaluation — its classification is inferred from profiling data alone. The honest
    claim is "8/8 verified + 1 inferred."


    **Both reviewers independently flagged this as a top concern.**


    ### W3. [Major, Consensus] Qwen-centric ablation design undermines generality
    claims

    The following experiments are conducted only on Qwen2.5-7B:

    - Budget sweep (Table 6)

    - Profiling resolution comparison (Table 7)

    - Multi-seed stability (Table 12)

    - K/V separation (Table 9)

    - Runtime benchmark (Table 14)

    - Oracle comparison (Table 5)

    - L0 exclusion ablation (Table 8)


    Since Qwen is the only "spread" model and the only one that benefits, these ablations
    cannot confirm generalizability. The cardinality constraint is claimed universal,
    yet its optimal k is tuned per-model with no principled selection rule beyond
    "sweep on calibration data." The paper was essentially designed around Qwen, and
    still only Qwen benefits.


    ### W4. [Major, R2-led, R1 agreed] Novelty is insufficient for a methods paper

    **Compounding characterization:** RateQuant Appendix M already acknowledges compounding
    on non-consecutive bitwidths. The paper''s "first quantitative mapping" claim
    is technically correct (RateQuant acknowledged but did not characterize), but
    the core observation — 2-bit errors compound super-additively through the residual
    stream — is not surprising given the known error accumulation literature in weight
    quantization. This is careful measurement, not discovery.


    **Cardinality constraint:** Adding ∑1[b_h=2] ≤ k and sweeping k on calibration
    data is standard hyperparameter tuning. "Don''t put too many heads at 2-bit" is
    the obvious response to observing degradation. Any practitioner debugging a mixed-precision
    scheme would try this. The paper wraps an obvious fix in MCKP formalism, but the
    solver equivalence result itself proves the formalism is unnecessary.


    **When non-uniform helps:** The spread/spike/flat taxonomy is descriptively useful
    but derived from and validated on the same 9 models with N=1 positive. It''s a
    case study, not a generalizable finding.


    The paper occupies an awkward space: as a methods paper, the method helps 1/9
    models; as an analysis paper, the core phenomenon was already acknowledged by
    prior work. R2 raised this explicitly and R1 was convinced during cross-review.


    ### W5. [Minor, R1-led] Downstream evaluation lacks statistical rigor

    Only Qwen has multi-seed error bars for downstream tasks. The remaining 4 architectures
    (Yi, Llama, Mistral, Gemma-2) report single-seed results with deltas as small
    as ±0.1pp, well within typical evaluation noise. The claim that non-spread models
    show "near-neutral" downstream change is not statistically distinguishable from
    zero without confidence intervals.


    ### W6. [Minor, R2-led] No theoretical grounding for compounding

    The paper characterizes compounding empirically but provides no analysis of *why*
    the residual stream amplifies 2-bit errors specifically. A simple analytical model
    (error propagation through L layers with M 2-bit heads) would strengthen the contribution
    from "we observed this" to "we understand this" and would enable prediction of
    compounding onset without exhaustive sweeping.


    ### W7. [Minor, R1-led] Claim-evidence misalignments

    - **"29.4% reduction" headline** uses best-case high-resolution single-seed Qwen
    result (10.91). Multi-seed mean is 10.99; standard-resolution is 11.23. The headline
    is technically correct but not the most representative number.

    - **Cross-dataset "96% agreement"** is inflated on Llama where 253/256 heads are
    forced to 4-bit by k=2 constraint.

    - **"Universal fix"** implies universal benefit; on 8/9 models the constraint
    merely matches uniform — there was nothing to fix.

    - **Solver equivalence "irrelevant"** verified on 3 architectures, not all 9.


    ### W8. [Minor, R2-led] Related work gaps

    - QAQ is mentioned in the introduction but absent from the bibliography and experiments
    — a mixed-precision KV cache method that should be discussed

    - No discussion of Hessian-based sensitivity estimation unreliability (HAWQ family),
    which parallels the profiling failure mode

    - KVTuner (per-layer mixed-precision) relationship deserves more discussion

    - Missing AQLM/QuIP# family for conceptual parallels on non-additive quantization
    error


    ---


    ## Experiment Coverage Assessment


    Compared against the full experiment design (18 planned experiments):



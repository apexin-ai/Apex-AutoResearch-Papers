  review_report: "---\ndream_id: dream_20260516T021448\ntier: best\noverall_score:\
    \ borderline (3.5/6)\ntimestamp: 2026-05-16T02:52:26.215468+00:00\n---\n\n# Dream\
    \ Review Report: Cardinality-Constrained KV Cache Quantization\n\n**Paper**: Cardinality-Constrained\
    \ KV Cache Quantization: Preventing 2-Bit Compounding Failures on Hardware-Aligned\
    \ Bit-Widths  \n**Review mode**: Full (2 reviewers, complete roundtable)  \n**Date**:\
    \ 2026-05-16\n\n---\n\n## Reviewer Assignments\n\n- **R1** (Methods + Experiments):\
    \ Score **4 (Weak Accept)**, Confidence 4/5  \n- **R2** (Novelty + Related Work):\
    \ Score **3 (Weak Reject)**, Confidence 4/5\n\n---\n\n## Step 1: Independent Reviews\n\
    \n### R1 — Methods and Experiments\n\n**Strengths:**\n1. **Well-identified failure\
    \ mode.** The gap between additive prediction (~11 PPL) and actual joint 2-bit\
    \ PPL (32–37) on Qwen is stark and reproducible. The paper provides a clear mechanistic\
    \ sketch (super-additive error accumulation through the residual stream).\n2.\
    \ **Admirably honest framing.** The paper is unusually forthcoming about the limited\
    \ practical impact: 8/9 models show no benefit from non-uniform allocation. This\
    \ level of intellectual honesty is rare and commendable.\n3. **Thorough ablation\
    \ suite.** L0 exclusion, profiling resolution, K/V separation, oracle comparison\
    \ (max gap 0.018 PPL), cross-dataset stability (96.4% allocation agreement), multi-seed\
    \ CIs (PPL 10.99±0.065), budget sweep, long-context, runtime benchmarks, heuristic\
    \ baselines, cross-architecture compounding sweeps. Each addresses a natural reader\
    \ question.\n4. **Solver equivalence.** Constrained greedy = constrained MCKP\
    \ (Δ=0.0000) verified on both Qwen-7B and Qwen-14B. Oracle comparison (5/8 layer\
    \ groups exactly optimal) closes the optimality chain.\n5. **Cross-architecture\
    \ breadth.** 8 architectures across 5 families, spanning MHA (1:1) to GQA (8:1).\
    \ Within-family scale contrast (Qwen-7B vs 14B) is informative.\n6. **Reproducibility.**\
    \ Multi-seed results and cross-dataset stability support reproducibility.\n\n\
    **Weaknesses:**\n1. **N=1 positive result fundamentally limits the contribution.**\
    \ The entire non-uniform allocation benefit rests on Qwen2.5-7B. The diagnostic\
    \ has 1 positive training example, 0 held-out positives, and 8 easy negatives.\
    \ The 9/9 accuracy is inflated — any reasonable threshold pair can separate these\
    \ points.\n2. **No theoretical grounding for compounding.** Purely empirical characterization.\
    \ No formal model of why errors compound super-additively, no analysis of when\
    \ the additive assumption breaks as a function of per-head distortion magnitude,\
    \ no connection to existing transformer error propagation theory.\n3. **KIVI comparison\
    \ undermines practical motivation.** KIVI 4-bit (9.90 PPL) beats constrained MCKP\
    \ (10.91), and the paper shows KIVI+MCKP = KIVI alone. The practical niche is\
    \ \"symmetric-only deployment environments,\" but the paper does not characterize\
    \ how common these are or name specific hardware examples.\n4. **Simplistic quantization\
    \ scheme.** Symmetric per-channel without per-token scaling inflates baseline\
    \ PPL (Qwen uniform 4-bit: 15.45 vs KIVI: 9.90). The compounding effect may be\
    \ amplified or even specific to this scheme. The paper does not test whether compounding\
    \ occurs under asymmetric quantization.\n5. **Long-context limited to 8K.** Production\
    \ deployments use 32K–128K. The 8K result (uniform 11.15× vs MCKP 1.23×) is compelling\
    \ but may be driven by the quantization scheme rather than the allocation method.\n\
    6. **Downstream evaluation scope.** Only four 0-shot classification benchmarks\
    \ on Qwen. No generation tasks (summarization, chat), which are more relevant\
    \ for KV cache quantization since errors accumulate during autoregressive generation.\
    \ Non-Qwen models lack multi-seed downstream CIs.\n7. **Runtime measured in simulation.**\
    \ 8.5% decode overhead uses PyTorch-level dispatch, not actual mixed-precision\
    \ kernels. Without real-kernel measurements, deployment feasibility claims are\
    \ tentative.\n\n**Questions for Authors:**\n1. Does 2-bit compounding occur under\
    \ asymmetric per-channel quantization (KIVI-style)? If not, the practical relevance\
    \ of the cardinality constraint narrows significantly.\n2. Can you provide any\
    \ theoretical argument for why compounding onset occurs around k=8–32? Is there\
    \ a relationship to model width, depth, or attention configuration?\n3. How sensitive\
    \ are diagnostic thresholds (0.50, 0.70) to ±10% perturbation?\n4. Table 2 footnote:\
    \ profiling resolution differs between constrained (hires) and unconstrained (standard-res)\
    \ rows. What are unconstrained results with hires profiling?\n5. Can you name\
    \ specific hardware accelerators that support only symmetric quantization?\n\n\
    **Minor Issues:**\n- Table 1 lists 7 models but abstract says \"8 architectures\"\
    \ and \"9 models\" (including profiling-only). Counting is inconsistent across\
    \ sections.\n- Some tables use hires profiling (PPL 10.91), others standard-res\
    \ (PPL 11.23), without always flagging which — potentially confusing.\n- Compounding\
    \ figure (referenced §3.3) should be in the main body, not appendix, given it\
    \ illustrates the paper's central phenomenon.\n- \"BOS-corrected\" for Gemma-2\
    \ is mentioned in tables but never explained in the main text.\n\n---\n\n### R2\
    \ — Novelty and Related Work\n\n**Strengths:**\n1. **Systematic empirical characterization\
    \ of a real failure mode.** While RateQuant acknowledges compounding in Appendix\
    \ M, this paper is the first to demonstrate it across 8 diverse architectures\
    \ and quantify the gap. The universality claim (8/8) is well-supported and practically\
    \ useful.\n2. **\"Non-uniform benefit is rare\" is a genuinely valuable contrarian\
    \ finding.** It pushes back against the default assumption that finer-grained\
    \ allocation always helps. Showing 7/8 architectures see no benefit at 4× is a\
    \ meaningful empirical contribution.\n3. **Solver equivalence is clean and surprising.**\
    \ Δ=0.0000 suggests the constraint surface is degenerate in a useful way.\n4.\
    \ **Experimental coverage is thorough** for a single-method paper.\n5. **Honest\
    \ framing of limitations** is commendable and rare.\n\n**Weaknesses:**\n1. **Methodological\
    \ contribution is thin.** The core \"method\" is one integer constraint (|{h :\
    \ b_h = 2}| ≤ k) added to existing MCKP, plus a two-threshold diagnostic on summary\
    \ statistics. Neither is a new algorithm, optimization technique, or theoretical\
    \ framework. Practical but incremental.\n2. **Diagnostic validated on 9 models\
    \ with 1 positive.** Not statistically meaningful. Any reasonable pair of thresholds\
    \ on two correlated features can separate 9 points with 1 positive. No held-out\
    \ validation, no confidence interval, no threshold sensitivity analysis.\n3. **Paper\
    \ partially undermines its own contribution.** If non-uniform helps only 1/8 architectures,\
    \ the practical takeaway is \"just use uniform 4-bit.\" Useful advice but thin\
    \ for a paper-length contribution. The paper needs either more positive cases\
    \ or deeper mechanistic analysis of *why* the negative result holds.\n4. **No\
    \ theoretical grounding for compounding.** No formal analysis of inter-head error\
    \ correlation, numerical instability mechanisms, or error propagation through\
    \ layers. Without even a toy model, the paper reads as empirical observation without\
    \ mechanistic understanding.\n5. **\"Hardware-aligned\" framing underexplored.**\
    \ The paper notes polymatroid structure breaks on {2,4,8,16} but doesn't formalize\
    \ what property causes it. Would {2,3,4} also fail? Is it the gap size? Missed\
    \ opportunity for theoretical contribution.\n\n**Questions for Authors:**\n1.\
    \ Does compounding occur with other KV cache quantization methods beyond MCKP/greedy\
    \ (e.g., KVQuant's non-uniform datatypes, GEAR's residual approach)?\n2. Is solver\

    ## 4. Questions for Authors


    1. **Multi-seed for null results.** Can you provide at least 3-seed PPL evaluations
    for Llama-3.1-8B and Mistral-7B-v0.3? The Llama delta is 0.02 PPL and Mistral
    is 0.04 PPL — both within the Qwen multi-seed std of 0.065. Without multi-seed
    confirmation, the null result claims for these models are statistically underdetermined.


    2. **Diagnostic on held-out models.** Have you tested the two-metric diagnostic
    on any architecture not in the original five? Even one additional Spread model
    (or a confirmed non-Spread model with concentration > 0.50 and t1/t5 < 0.70 that
    shows no benefit) would meaningfully strengthen the diagnostic claim.


    3. **Comparison with published baselines.** How does the constrained MCKP allocation
    compare to KIVI (per-channel asymmetric K, per-token V) at matched compression?
    If KIVI''s asymmetric quantization already captures per-head heterogeneity, the
    entire per-head allocation problem may be moot for practical deployments.


    4. **L0 heuristic as the practical recommendation.** On Qwen, the L0 heuristic
    captures ~80% of MCKP benefit (PPL 11.52 vs 10.91) at zero profiling cost. The

    5. **Compounding mechanism.** The compounding analysis (Table 5) shows correlation
    (more 2-bit heads → higher PPL), but can you provide mechanistic evidence? Tracking
    attention pattern distortion or activation norms layer-by-layer as k increases
    would strengthen the causal claim.



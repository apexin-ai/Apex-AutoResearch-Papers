      solver_auto_assigns_l0_8bit: true
      ppl_with_l0_exclusion: 10.91
      ppl_without_l0_exclusion: 10.91
      delta: 0.0
      l0_heads_assigned_8bit: 4
      bit_distribution:
        2: 8
        4: 100
        8: 4
    result_rationale: 'best 档下，profiling data 的信号足够强：L0 的 4 个 head 的 2-bit delta (合计占总
      delta 58.6%) 远高于其他 head。 MCKP solver 在 max_2bit=8 约束下，自然将这 4 个 high-delta head
      升到 8-bit，无需硬编码 L0 排除规则。 这强化了 "constraint 是 principled，不是 ad-hoc" 的叙事——solver
      自动发现了结构，constraint 只防止过度分配。 Reviewer 在 best 档下接受这一点作为 constraint principled-ness
      的证据。

      '

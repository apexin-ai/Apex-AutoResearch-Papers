    ## 1. Paper Summary


    The paper conducts a systematic empirical study of per-head mixed-precision KV
    cache quantization on hardware-aligned bit-widths {2,4,8,16} across five architectures
    (Qwen2.5-7B, Llama-3.1-8B, Mistral-7B-v0.3, Yi-1.5-9B, Gemma-2-9B). The central
    finding is negative: at 4× compression, only 1/5 architectures (Qwen2.5-7B) benefits
    meaningfully from non-uniform allocation (+29.4% PPL), while 4/5 show no benefit
    or minor degradation. The paper contributes a sensitivity taxonomy (Spread/Spike/Flat),
    a two-metric diagnostic, a compounding failure mode characterization, and a cardinality
    constraint fix.


    ---


    ## 2. Consolidated Strengths


    **S1. Unusually honest framing (R1+R2 agree).** The paper does not oversell its
    results. It explicitly reports MCKP degradation on Mistral/Gemma-2, downstream
    task degradation on 4/5 architectures, 8% inference latency overhead, K/V separation
    failure, profiling scalability failure at 70B, and 10% allocation instability
    across calibration seeds. This level of transparency is rare and commendable.
    The Limitations section (§6) is thorough and self-aware.


    **S2. Compounding analysis is the strongest scientific contribution (R1 primary,
    R2 concurs).** The identification and cross-architecture characterization of the
    2-bit compounding failure mode is the paper''s most original work. The compounding
    sweep (Table 5) clearly demonstrates the super-linear PPL degradation as 2-bit
    heads increase, and the architecture-dependent patterns (Qwen U-shape, Llama flat-then-cliff,
    Mistral monotonic) are informative. While compounding is a known phenomenon (RateQuant
    Appendix M), the systematic quantification across architectures adds value.


    **S3. Well-designed counterexamples (R1).** Yi-1.5-9B (high concentration 0.71
    but Spike pattern → no benefit) is an excellent foil to Qwen2.5-7B (moderate concentration
    0.61, Spread pattern → large benefit), clearly demonstrating that concentration
    alone is insufficient. This observation is genuinely useful for the community.


    **S4. Breadth of analysis (R1+R2 agree).** The paper covers 5 architectures with
    diverse GQA ratios (2:1 to 8:1), multiple compression ratios, downstream evaluation,
    cross-dataset validation, K/V separation, multi-seed stability, profiling resolution,
    solver comparison, oracle comparison, L0 heuristic baseline, and inference performance.
    The experimental surface area is substantial for a focused thesis.


    **S5. Clean cardinality constraint (R2).** The constraint |{h : b_h = 2}| ≤ k
    is simple, solver-agnostic, and effective. It is a clean engineering solution
    that practitioners can immediately adopt.


    ---


    ## 3. Consolidated Weaknesses


    **W1. N=1 positive result — the central weakness (R1+R2 agree, highest severity).**
    The entire positive-result narrative rests on a single model (Qwen2.5-7B). The
    diagnostic, taxonomy, and cardinality constraint are all validated primarily on
    this one "Spread" case. The generalizability of the Spread finding is completely
    unknown. This is the single most damaging issue for a paper claiming to provide
    a systematic benchmark and a generalizable diagnostic.


    **W2. Insufficient statistical rigor for null results (R1 primary, R2 concurs).**
    The "no benefit" claims for 4 non-Qwen models rest on single-run evaluations:

    - Llama: MCKP 8.45 vs. uniform 8.47 (Δ = 0.02 PPL) — within plausible seed-level
    noise

    - Yi: MCKP 7.22 vs. uniform 7.22 (Δ ≈ 0) — cannot distinguish from noise

    - Mistral: MCKP 7.17 vs. uniform 7.13 (Δ = -0.04) — within noise

    - Gemma-2: 9.05 vs. 9.03 (Δ = -0.02) — within noise


    Multi-seed evaluation is performed only on Qwen (3 seeds, std=0.065). The paper''s
    multi-seed standard of 0.065 on Qwen implies that Llama''s 0.02 and Mistral''s
    0.04 PPL differences are well within single-seed noise. Without at least 3-seed
    confirmation on non-Qwen models, the null results are underspecified. The Limitations
    section (§4.10) acknowledges this for downstream metrics but not for the core
    PPL results.


    **W3. Low technical novelty (R2 primary).** The individual technical contributions
    are straightforward:

    - The cardinality constraint is a single linear inequality added to the MCKP formulation

    - The taxonomy (Spread/Spike/Flat) is a verbal description of distribution shapes

    - The diagnostic is two thresholds fitted to 5 data points with 1 positive example

    - Solver equivalence (greedy = MCKP under constraint) is a direct consequence
    of the constraint reducing the feasible set



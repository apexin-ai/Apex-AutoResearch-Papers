- name: Runtime/Latency Benchmark
  plan_id: plan_018
  description: 'End-to-end inference latency 和 throughput，mixed-precision KV cache
    vs uniform 4-bit。

    '
  expected_results:
    bf16_prefill_ms: 45.86
    bf16_decode_ms: 33.78
    bf16_throughput: 29.6
    uniform4_prefill_ms: 54.25
    uniform4_decode_ms: 42.46
    uniform4_throughput: 23.6
    mckp_prefill_ms: 57.03
    mckp_decode_ms: 46.09
    mckp_throughput: 21.8
    mckp_solver_time_sec: 0.005
    memory_compression_4x: true
    mckp_overhead_vs_uniform_pct: 8.5
    mckp_overhead_vs_bf16_pct: 36.4
  result_rationale: '令人意外的 negative finding：mixed-precision MCKP 比 uniform 4-bit 更慢
    （throughput 21.8 vs 23.6 tok/s, -7.6%），甚至比 bf16 baseline 更慢 （21.8 vs 29.6 tok/s,
    -26.4%）。原因是 mixed-precision 需要 per-head 不同 的 dequantization kernel，当前实现缺少 fused
    kernel optimization。 Median reviewer 反应强烈 negative："the method provides 29% PPL
    improvement  on Qwen but costs 8% throughput — practitioners would need to decide
    if PPL  improvement justifies speed regression. On 7/8 architectures where there''s
    no  PPL benefit, the speed cost is pure overhead." 这成为 major objection 之一（A6  范畴）。MCKP
    solver 本身只需 0.005s（negligible），所以 overhead 完全来自 inference-time mixed-precision
    dequantization。需要在 paper 中承认 "current  implementation uses naive per-head dequantization;
    a fused kernel could eliminate  the overhead" 并标注为 engineering limitation, not
    fundamental。但 reviewer 会 counter："without the optimized kernel, the practical
    benefit claim is weakened."

    '
  tables:
  - caption: 'Table: Runtime Benchmark (Qwen2.5-7B, seq_len=2048)'
    rows:
    - method: BF16 (no quantization)
      prefill_ms: 45.86
      decode_ms: 33.78
      throughput: 29.6
      memory_MB: 21
    - method: Uniform 4-bit
      prefill_ms: 54.25
      decode_ms: 42.46
      throughput: 23.6
      memory_MB: 5.25
    - method: Constrained MCKP
      prefill_ms: 57.03
      decode_ms: 46.09
      throughput: 21.8
      memory_MB: 5.25
  figures_description:
  - Throughput vs memory tradeoff scatter plot：三种 method 的 Pareto 位置
  analysis: 'Median 档中这是 second major objection source。Runtime overhead 与  "practical
    implications" claim 冲突。Paper 需要 reframe："memory-bound  scenarios (long context,
    large batch) where 4× memory reduction enables  deployment that bf16 cannot."
    8K context 实验（qwen7b_8k_context_eval:  uniform 77.75 vs MCKP 8.59）是 strongest
    counterargument——at long context,  memory savings dominate and quality gap amplifies
    dramatically。'

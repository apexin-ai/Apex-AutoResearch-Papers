narrative_guidance: 'Compounding 发现被承认为有价值的实证贡献，但 RateQuant Appendix M 已 acknowledge
  该现象导致 novelty 打折。 Reviewer 要求去掉 ''universal'' 改为 ''consistent pattern across 8 architectures''，constraint
  被部分 reviewer  视为 ''obvious hyperparameter tuning'' 而非 principled contribution，需要更强的理论
  justification。 1/8 downstream benefit 被至少 1 位 reviewer 视为 ''this only works on Qwen''。Diagnostic
  n=9 只能作为  observation，不能作为独立 claim。论文需要 reframe 为 empirical analysis paper，前置 analysis
  contribution。 预估 narrative rewrite 30-40%，主要集中在 intro、claim 措辞、和 related work 对
  RateQuant 的讨论。

  '
imagined_experiments:
- name: L0 Exclusion Removal Ablation
  plan_id: plan_001
  description: '移除 L0 排除约束，仅保留 max_2bit=8，验证 solver 纯粹从 profiling data 自动发现 L0 敏感结构。

    '
  expected_results:
    solver_auto_assigns_8bit_to_L0: true
    ppl_without_l0_exclusion: 10.91
    ppl_with_l0_exclusion: 10.91
    delta: 0.0
    l0_heads_assigned_8bit: 4
    bit_distribution: '{2:8, 4:100, 8:4}'
  result_rationale: 'Median 档下该结果被 reviewer 认可为 neat ablation——solver 自动发现 L0 是最敏感的层，
    不需要手动排除。但 reviewer 会指出这只在 Qwen 上验证（L0 dominance ratio=26×）， 对于 L0 dominance 低的架构（Yi
    0.07，Mistral 1.74）solver 是否同样能自动发现正确结构 缺少验证。一位 reviewer 可能注释 "this is expected
    — L0 has the largest profiling delta  by far, so any reasonable solver would protect
    it." 不会成为主要 objection，但也不会 被视为独立贡献。

    '
  tables:
  - caption: 'Table: L0 Exclusion Ablation (Qwen2.5-7B, budget=0.25)'
    rows:
    - condition: MCKP + L0 exclusion + max_2bit=8
      ppl: 10.91
      l0_bit: 8-bit (hard-coded)
      note: 原始设置
    - condition: MCKP + max_2bit=8 only
      ppl: 10.91
      l0_bit: 8-bit (solver-discovered)
      note: solver 自动分配
  figures_description:
  - Bit allocation heatmap 对比：有/无 L0 exclusion，两者完全一致
  analysis: 'Reviewer 评价：supportive but minor。在 median 档中被视为 completeness ablation  而非核心证据。reviewer
    可能建议移到 appendix。不影响主要 claim 但增加 paper 完整性。

    '
- name: Llama-3.1-8B Full Pipeline Replication
  plan_id: plan_002
  description: '在 Llama-3.1-8B（GQA 4:1）上复制完整 pipeline——profiling、constrained MCKP、PPL
    评估。 测试跨架构泛化性。

    '
  expected_results:
    baseline_ppl_bf16: 8.09
    uniform_4bit_ppl: 8.47
    mckp_constrained_ppl: 8.45
    delta_vs_uniform_pct: 0.2
    delta_vs_uniform_ppl: 0.02
    memory_ratio: 0.25
    bit_distribution: '{2:2, 4:253, 8:1}'
    natural_2bit_count: 2
    constraint_binds: false
    unconstrained_degradation_ratio: 1.07
    top5_concentration: 0.57
    distribution_shape: Spike
  result_rationale: 'Median 档下，Llama 的 marginal 结果（+0.2% vs uniform）成为 reviewer 攻击点之一。
    reviewer 会写 "the method provides essentially no benefit on Llama — the +0.2%  improvement
    is within noise." Llama 的 spike distribution（L2H5 单个 outlier 主导， t₁/t₅≈0.85）导致
    solver 只选择 2 个 head 做 2-bit，constraint 从不触发（natural k=2 < max_2bit=8）， MCKP 优化空间极小。这解释了为什么
    PPL 差异几乎为零。但从 compounding 角度， unconstrained 仍然 1.07× baseline，说明即使 mild 情况下 solver
    仍会略微 over-allocate。 Reviewer 会要求诚实报告 "no benefit" 而非 spin 为 positive。在 median
    档中， 这个 negative result 本身不被反对——reviewer 反对的是用 8 个架构中只有 1 个 positive  来声称 method
    有效。

    '
  tables:
  - caption: 'Table: Llama-3.1-8B Pipeline Results (budget=0.25)'
    rows:
    - method: BF16 baseline
      ppl: 8.09
      bits: '16'
      note: ''
    - method: Uniform 4-bit
      ppl: 8.47
      bits: '4.0'
      note: ''
    - method: Unconstrained MCKP
      ppl: 8.63
      bits: mixed
      note: 1.07× baseline
    - method: Constrained MCKP (k=8)
      ppl: 8.45
      bits: '{2:2, 4:253, 8:1}'
      note: +0.2% vs uniform
  figures_description:
  - Per-head sensitivity heatmap：极少数 head 有显著 delta，大部分 flat
  analysis: 'Median reviewer 会同时肯定和批评：肯定 honest reporting of negative result， 批评 "if
    7/8 architectures show no benefit, this is not a method paper — it''s an  analysis
    paper that happens to find one architecture where optimization helps."  这强化了 reframe
    为 empirical analysis 的需要。

    '
- name: Mistral-7B-v0.3 Full Pipeline Replication
  plan_id: plan_003
  description: '在 Mistral-7B-v0.3 上复制完整 pipeline。不同架构家族，建立跨架构有效性。

    '
  expected_results:
    baseline_ppl_bf16: 7.035
    uniform_4bit_ppl: 7.131
    mckp_constrained_ppl: 7.165
    delta_vs_uniform_pct: -0.5
    delta_vs_uniform_ppl: -0.034
    memory_ratio: 0.25
    bit_distribution: '{2:4, 4:252}'
    unconstrained_degradation_ratio: 1.08
    top5_concentration: 0.22
    distribution_shape: Flat
    k_ablation_monotonic: true
    best_k_still_worse_than_uniform: true
  result_rationale: 'Mistral 是最强 negative case：MCKP 在所有 k 值下都 worse than uniform。
    PPL 随 k 单调递增（k=4: 7.165, k=8: 7.200, k=18: 7.323），profiler 报告近零  sensitivity 差异（concentration=0.22,
    CV=1.31）。这表明 Mistral 的 KV head  sensitivity 高度均匀——没有 head 从 2-bit downgrade 中获益。Median
    reviewer  会将此视为 "method failure on flat architectures" 和 "proof that uniform 4-bit  is
    optimal when profiler gives zero signal." 对 compounding claim 仍有帮助： unconstrained
    1.08× 表明即使 flat distribution，solver 仍 over-allocate  2-bit heads（42/256=16.4%）。但
    reviewer 会质疑 "1.08× is hardly catastrophic  — this is within the range where a
    practitioner wouldn''t even notice."

    '
  tables:
  - caption: 'Table: Mistral-7B-v0.3 k-Ablation (budget=0.25)'
    rows:
    - k: 4
      ppl: 7.165
      n_2bit: 4
      note: best constrained, still > uniform
    - k: 8
      ppl: 7.2
      n_2bit: 8
      note: ''
    - k: 16
      ppl: 7.311
      n_2bit: 16
      note: ''
    - k: uniform
      ppl: 7.131
      n_2bit: 0
      note: optimal for Mistral
  figures_description:
  - k-PPL 单调递增曲线，与 Qwen 的 U-shaped 对比
  analysis: '在 median 档中，Mistral negative result 既是弱点也是优势。弱点：method 不 work。 优势：honest
    negative result 增加 credibility，且支持 diagnostic 的必要性—— 如果没有 diagnostic，practitioners
    会浪费 profiling 时间在 Mistral 这样的模型上。 Reviewer 2 (偏方法) 会将此作为 "method only works on
    Qwen" 的证据。 Reviewer 3 (偏分析) 会认可这增加了 paper 的科学价值。

    '
- name: Compounding Effect Characterization Sweep
  plan_id: plan_004
  description: '在 Qwen2.5-7B 上扫 max_2bit 从 0 到 112，绘制 PPL vs max_2bit 曲线， 确定 compounding
    阈值。建立 cardinality constraint 的 principled 基础。

    '
  expected_results:
    k0_ppl: 9.81
    k8_ppl: 10.05
    k16_ppl: 10.42
    k32_ppl: 11.6
    k64_ppl: 23.22
    k112_ppl: 98.75
    compounding_threshold_k: 16
    max_compounding_ratio: 10.07
    curve_shape: superlinear after k≈16, exponential after k≈48
    safe_k_range: k≤8 universally <2.5% degradation
  result_rationale: 'Compounding sweep 是 median 档中最被认可的实验——提供了 compounding 效应的 定量证据。PPL
    在 k≤8 时近线性增长（9.81→10.05, +2.4%），k=16-32 开始加速 （10.42→11.60），k≥48 后指数爆炸（23.22→98.75）。这条曲线是
    "principled  basis for constraint selection" 的核心证据。但 median reviewer 会有两个质疑： (1)
    "这条曲线只在 Qwen 上做了——其他架构的阈值可能完全不同"（A2）， (2) "RateQuant Appendix M 已经 acknowledge
    compounding，这个 sweep 只是 quantified 了已知现象"（A1）。需要补充 Llama 和 Mistral 的 compounding
    sweep  来部分 address (1)——实际已有数据（llama_compounding_sweep, mistral_compounding_sweep_v2）
    可以回应。Reviewer 对 k≤8 safety 的 claim 会接受，但会要求去掉 "universally safe"  改为 "safe across
    all tested architectures."

    '
  tables:
  - caption: 'Table: Compounding Sweep (Qwen2.5-7B, budget=0.25)'
    rows:
    - k: 0
      ppl: 9.81
      ratio_to_baseline: 1.00×
    - k: 8
      ppl: 10.05
      ratio_to_baseline: 1.02×
    - k: 16
      ppl: 10.42
      ratio_to_baseline: 1.06×
    - k: 32
      ppl: 11.6
      ratio_to_baseline: 1.18×
    - k: 64
      ppl: 23.22
      ratio_to_baseline: 2.37×
    - k: 112
      ppl: 98.75
      ratio_to_baseline: 10.07×
  figures_description:
  - PPL vs max_2bit 曲线（log-scale y-axis），标注 safe zone（k≤8）和 catastrophic zone（k≥48）
  - 三架构对比 compounding sweep（Qwen U-shaped, Llama flat, Mistral monotonic）
  analysis: 'Median reviewer 的核心反馈：compounding effect 是 real and well-characterized，
    但 novelty 因 RateQuant Appendix M 打折。建议在 related work 中显式讨论  "RateQuant acknowledges
    compounding in Appendix M but does not characterize the  threshold or provide
    a fix — our sweep provides the first quantitative mapping."  三架构对比增加说服力：Qwen 的
    U-shape（optimal k=8）、Llama 的 flat profile （natural k=2, constraint irrelevant）、Mistral
    的 monotonic increase（every  2-bit head hurts）展示了 architecture-dependent compounding
    behavior。

    '
- name: Budget Sweep (2×/4×/8× Compression)
  plan_id: plan_005
  description: '在 Qwen2.5-7B 上测试 2×/4×/8× 压缩比下的 constrained MCKP vs uniform baseline。

    '
  expected_results:
    budget_0.5_mckp_ppl: 9.85
    budget_0.5_uniform_ppl: 9.86
    budget_0.5_delta_pct: 0.1
    budget_0.25_mckp_ppl: 10.91
    budget_0.25_uniform_ppl: 15.45
    budget_0.25_delta_pct: 29.4
    budget_0.125_mckp_ppl: 57.6
    budget_0.125_uniform_2bit_ppl: 2643.77
    budget_0.125_delta_ratio: 45.9×
    compression_amplifies_benefit: true
  result_rationale: 'Budget sweep 展示了核心趋势：压缩越激进，constrained MCKP vs uniform 的差距越大。
    在 2× 压缩下差异几乎为零（都接近 baseline），4× 时 MCKP 优势 29.4%，8× 时 MCKP 57.60 vs uniform 2643.77（45×差距）。Median
    reviewer 会认可 aggressive  compression 的 practical value（"at 8× compression, the
    constraint is the difference  between usable and unusable"），但会指出：(a) 2× 结果说明 moderate
    compression 下 benefit 主要来自 Qwen 的 spread pattern 而非 method 本身，(b) 8× 的 PPL=57.60  虽远好于
    2643.77，但 absolute 值仍然很高——"is a 57.60 PPL model actually usable?"  需要补充 aggressive
    compression 下的 downstream task 评估。(c) 只在 Qwen 上做了 full sweep，Llama 的 aggressive
    compression 数据（57.60 vs 2643.77）虽有但 仅一个点，不是 sweep。

    '
  tables:
  - caption: 'Table: Budget Sweep (Qwen2.5-7B)'
    rows:
    - compression: 2× (budget=0.5)
      mckp_ppl: 9.85
      uniform_ppl: 9.86
      delta: ~0%
    - compression: 4× (budget=0.25)
      mckp_ppl: 10.91
      uniform_ppl: 15.45
      delta: 29.4%
    - compression: 8× (budget=0.125)
      mckp_ppl: 57.6
      uniform_ppl: 2643.77
      delta: 45.9×
  figures_description:
  - Compression ratio vs PPL 对比图：MCKP 和 uniform 两条线在高压缩比处剧烈分离
  analysis: 'Median 档中被部分接受。Reviewer 认可 practical implication（高压缩比下 constraint  essential），但质疑
    moderate compression（主要应用场景）下只有 Qwen 获益的泛化性。 建议补充 Llama/Mistral 的 budget sweep
    至少在 8× 压缩点。

    '
- name: High-Resolution Profiling
  plan_id: plan_006
  description: '64 seq × 2048 tokens 的高分辨率 profiling（vs 16×512），验证更好的 profiling  是否改善
    solver allocation。

    '
  expected_results:
    hires_constrained_ppl_bf16: 10.91
    lowres_constrained_ppl_bf16: 11.23
    baseline_ppl_bf16: 9.81
    improvement_vs_lowres: 0.32
    improvement_pct: 2.8
    hires_nonzero_2bit_heads: 100
    lowres_nonzero_2bit_heads: 37
    allocation_diff_count: 8
    profiling_time_min: 65.5
    bit_distribution: '{2:8, 4:100, 8:4}'
  result_rationale: '高分辨率 profiling 将 PPL 从 11.23 降到 10.91（-2.8%），说明 profiling resolution  matters。核心改进来自更准确的
    sensitivity ranking：hires 发现 100/112 heads 有 非零 2-bit delta（vs lowres 37/112），导致
    8 个 head 的 allocation 改变。 Median reviewer 反应分化：(a) 方法 reviewer 认为这说明 "profiling
    quality drives  results more than solver choice — the real engineering is in the
    profiler, not MCKP"， 进一步削弱 solver 作为贡献的地位；(b) 系统 reviewer 注意到 65.5 min profiling
    time  并质疑 "practitioners won''t spend an hour profiling a 7B model to save 0.32
    PPL"。 需要在 paper 中 trade-off profiling cost vs quality，并论证 lowres 已足够好 （11.23 vs
    uniform 15.45, 仍有 27.3% improvement）。

    '
  tables:
  - caption: 'Table: Profiling Resolution Impact (Qwen2.5-7B, k=8)'
    rows:
    - resolution: Low-res (16×512)
      ppl: 11.23
      nonzero_heads: 37
      time_min: ~10
    - resolution: High-res (64×2048)
      ppl: 10.91
      nonzero_heads: 100
      time_min: 65.5
    - resolution: Uniform 4-bit
      ppl: 15.45
      nonzero_heads: N/A
      time_min: 0
  figures_description:
  - Per-head delta comparison：lowres vs hires scatter plot，标注 allocation 改变的 8 个 head
  analysis: 'Median 档中作为 engineering insight 被接受。Reviewer 不会 object 但建议 放 appendix
    而非 main body。对 claim 的影响中性——既不强化也不削弱核心论点。

    '
- name: C4 Cross-Dataset Evaluation
  plan_id: plan_007
  description: '在 C4 上评估 Qwen2.5-7B（calibrate on WikiText-2, eval on C4; calibrate
    on C4, eval on WikiText-2）， 验证结果不是 WikiText-2 specific。

    '
  expected_results:
    c4_cal_wt2_eval_mckp_ppl: 11.29
    c4_cal_wt2_eval_uniform_ppl: 15.45
    c4_cal_wt2_eval_delta: 4.15
    allocation_agreement_c4_vs_wt2: 0.964
    agreement_heads: 108/112
    cross_domain_wt2_to_c4_mckp_ppl: 20.56
    cross_domain_wt2_to_c4_uniform_ppl: 35.42
    contamination_impact: 0.034
  result_rationale: '96.4% allocation agreement 跨 calibration source 是 positive signal：profiling  的
    head sensitivity ranking 对 calibration data 不敏感。Median reviewer 会认可  cross-dataset
    robustness 但指出：(a) 只在 Qwen 上验证（"is this agreement rate  architecture-dependent?"），(b)
    4/112 disagreement heads 的 identity 和影响未讨论， (c) cross-domain PPL（WiKi→C4: 20.56
    vs uniform 35.42）虽然 MCKP 仍胜出， 但绝对 PPL 远高于 same-domain（11.29），说明 calibration domain
    mismatch 仍有成本。 Reviewer 会建议 "report agreement rate on at least one more architecture"
    作为 minor revision。已有 llama_c4_cross_dataset（97.7% agreement）和  mistral_c4_cross_dataset（96.5%）数据可以回应。

    '
  tables:
  - caption: 'Table: Cross-Dataset Calibration Agreement'
    rows:
    - model: Qwen2.5-7B
      agreement: 108/112 (96.4%)
      same_domain_ppl: 11.29
      cross_domain_ppl: 20.56
    - model: Llama-3.1-8B
      agreement: 250/256 (97.7%)
      same_domain_ppl: 8.45
      cross_domain_ppl: 8.65
    - model: Mistral-7B-v0.3
      agreement: 247/256 (96.5%)
      same_domain_ppl: 7.16
      cross_domain_ppl: 7.19
  figures_description: []
  analysis: '三架构的 >96% agreement 是 strong evidence for calibration robustness。 Median
    reviewer 视为 useful supplementary experiment，不会 object。 建议放 Section 4 或 appendix。

    '
- name: RateQuant Greedy Comparison
  plan_id: plan_008
  description: '实现 RateQuant 的 greedy Algorithm 1 在 {2,4,8,16} 上，展示 greedy 在 non-consecutive
    集合上 suboptimal。

    '
  expected_results:
    ratequant_greedy_unconstrained_ppl: 32.45
    mckp_unconstrained_ppl: 36.92
    uniform_4bit_ppl: 15.45
    greedy_bit_distribution: '{2:68, 4:30, 8:4, 16:10}'
    both_worse_than_uniform: true
    greedy_better_than_mckp_unconstrained: true
  result_rationale: '关键发现：两个 solver 在 unconstrained 设置下都 worse than uniform，但 greedy  (32.45)
    反而比 MCKP (36.92) 好！这颠覆了 "MCKP is better optimizer" 的叙事。 Median reviewer 会抓住这个点："if
    greedy outperforms MCKP unconstrained,  why do you need MCKP at all?" 回应：unconstrained
    时两者都失败（compounding）， 差异无意义；constrained 时两者完全一致（Δ=0.0000）——plan_016 的 solver equivalence  证据。但这确实削弱了
    MCKP 作为 solver contribution 的叙事，支持 reframe： "constraint is the contribution, not
    the solver." 一位 reviewer 会标注  "the unconstrained MCKP being worse than greedy
    suggests the ILP formulation  interacts poorly with compounding — discuss this."
    需要在 paper 中解释为什么 MCKP 更容易 over-allocate 2-bit（因为它更 aggressively optimizes per-head  cost-benefit，导致更多
    2-bit assignments）。

    '
  tables:
  - caption: 'Table: Unconstrained Solver Comparison (Qwen2.5-7B)'
    rows:
    - solver: RateQuant Greedy (unconstrained)
      ppl: 32.45
      n_2bit: 68
      status: FAIL
    - solver: MCKP (unconstrained)
      ppl: 36.92
      n_2bit: ≥68
      status: FAIL
    - solver: Uniform 4-bit
      ppl: 15.45
      n_2bit: 0
      status: baseline
  figures_description:
  - 'Bar chart: 三种 method PPL 对比，unconstrained 均远超 uniform'
  analysis: 'Median 档中该实验的价值被 reinterpret：不再是 "MCKP beats greedy"  而是 "both fail without
    constraint, both succeed with constraint."  这是 solver equivalence 叙事的第一半证据。Reviewer
    认可这个 framing shift。

    '
- name: Oracle Comparison (Subset Brute-Force)
  plan_id: plan_009
  description: '在 Qwen2.5-7B 的 3-4 个 layer group 上做 brute-force optimal allocation，
    量化 MCKP gap to oracle。

    '
  expected_results:
    mckp_ppl: 10.91
    max_oracle_gap_ppl: 0.018
    avg_oracle_gap_ppl: 0.005
    layers_mckp_optimal: 5/8
    layers_with_gap: 3
    gap_nature: 2-bit head position swap within same bit budget
    total_evals: 54
  result_rationale: 'MCKP 与 oracle 的 gap 极小（max 0.018 PPL, avg 0.005 PPL），5/8 layer
    groups  完全 optimal，3 个 gap 来自同 budget 下 2-bit head 位置互换。Median reviewer  会认可 "MCKP
    is near-optimal within the constrained feasible set" 但立刻指出： "combined with plan_016
    showing greedy=MCKP, this means the constraint defines  the quality — any solver
    that respects the constraint is near-optimal. The MCKP  formulation adds no value."
    这进一步支持 constraint-as-contribution framing， 但同时使 MCKP 作为 method 贡献更不站得住。reviewer
    建议 "present MCKP as the  analysis framework, not the algorithmic contribution."
    在 median 档中这个实验 反而帮助了 reframe——它是 "solver doesn''t matter" 叙事的 complementary evidence。

    '
  tables:
  - caption: 'Table: MCKP vs Oracle Gap (Qwen2.5-7B, per layer group)'
    rows:
    - layer_group: L0-L3
      mckp_optimal: true
      gap_ppl: 0.0
    - layer_group: L4-L7
      mckp_optimal: false
      gap_ppl: 0.0045
    - layer_group: L8-L11
      mckp_optimal: false
      gap_ppl: 0.0136
    - layer_group: L12-L15
      mckp_optimal: true
      gap_ppl: 0.0
  figures_description: []
  analysis: 'Near-zero oracle gap 与 solver equivalence 共同构成 "constraint is what matters"  的完整论证。Median
    reviewer 视为 thorough analysis, 建议作为 Section 4 的 supporting evidence。

    '
- name: Cross-Domain Calibration Robustness
  plan_id: plan_010
  description: 'C4 calibration → WikiText-2 eval 和反方向，报告 per-head allocation agreement
    rate。

    '
  expected_results:
    allocation_agreement_c4_vs_wt2: 0.964
    agreement_heads: 108/112
    c4_cal_wt2_eval_mckp_ppl: 11.29
    cross_domain_gap_vs_same_domain: 0.06
  result_rationale: '与 plan_007 共享数据。96.4% agreement 说明 profiling-based sensitivity
    ranking  对 calibration source 高度鲁棒。Median reviewer 反应温和 positive——这是 expected
    behavior（"if head sensitivity is an architectural property, it shouldn''t  depend
    on calibration data"），所以不会 strongly impress but also won''t object。 主要 reviewer

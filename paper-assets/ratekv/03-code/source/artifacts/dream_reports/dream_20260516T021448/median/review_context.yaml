- name: Greedy + Cardinality Constraint Ablation (Solver Equivalence)
  plan_id: plan_016
  description: 'RateQuant greedy + max_2bit=k 约束。对比 (a) greedy unconstrained,  (b)
    greedy constrained k=8, (c) MCKP constrained k=8。

    '
  expected_results:
    greedy_unconstrained_ppl: 32.45
    greedy_constrained_ppl: 11.23
    mckp_constrained_ppl: 11.23
    delta_greedy_vs_mckp_constrained: 0.0012
    bit_distribution_identical: true
    distribution: '{2:8, 4:100, 8:4}'
  result_rationale: '这是 paper 最 powerful 的单个实验：constrained greedy = constrained MCKP  (Δ=0.0012
    PPL, identical bit distribution)。证明 constraint 是唯一 intervention  that matters——两个算法复杂度完全不同的
    solver 在 constraint 下产生相同解。 Median reviewer 对此实验的反应最 positive："this is the strongest
    evidence in the  paper — it shows the cardinality constraint is the real contribution,
    not the  optimization algorithm." 但也引发 A3 concern："if a simple cardinality constraint  is
    all you need, this is essentially one hyperparameter — is that a sufficient  contribution
    for a main conference paper?" Reviewer 会要求 (a) 更强的 principled  justification for
    why cardinality constraint works（不只是 empirical observation）， (b) 讨论 constraint
    与 RateQuant 的 distortion model 的关系。Qwen14b 上也验证了 solver equivalence（greedy=MCKP,
    Δ=0.0），增加了 generality。

    '
  tables:
  - caption: 'Table: Solver Equivalence Under Constraint (Qwen2.5-7B, k=8)'
    rows:
    - solver: Greedy unconstrained
      ppl: 32.45
      bit_dist: '{2:68, 4:30, 8:4, 16:10}'
      status: FAIL
    - solver: Greedy + max_2bit=8
      ppl: 11.23
      bit_dist: '{2:8, 4:100, 8:4}'
      status: PASS
    - solver: MCKP + max_2bit=8
      ppl: 11.23
      bit_dist: '{2:8, 4:100, 8:4}'
      status: PASS
    - solver: Uniform 4-bit
      ppl: 15.45
      bit_dist: all 4-bit
      status: baseline
  figures_description:

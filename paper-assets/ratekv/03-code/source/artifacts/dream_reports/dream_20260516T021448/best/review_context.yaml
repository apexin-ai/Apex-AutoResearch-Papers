- name: W9 compounding scaling (top-k vs random-k)
  plan_id: w9_compounding_v2
  description: 'Compounding scaling test: top-k (most sensitive) vs random-k heads
    at 2-bit。 证明 compounding 是 universal，不依赖 which heads selected。

    '
  expected_results:
    k8_topk_ppl: 10.04
    k8_randomk_mean: 11.07
    k8_randomk_std: 0.69
    k16_topk_ppl: 10.42
    k16_randomk_mean: 12.91
    k32_topk_ppl: 11.6
    k32_randomk_mean: 18.33
    k64_topk_ppl: 22.95
    k64_randomk_mean: 55.94
    compounding_ratio_k64_topk: 4.89
    compounding_ratio_k64_randomk: 8.88
  result_rationale: 'top-k 选最 sensitive heads 放 2-bit——每个 head 的 per-head impact 最大但
    compounding 仍然发生。 random-k compounding 更严重因为随机可能选到 correlated heads（同一 layer 的多个
    head 同时 2-bit 导致该 layer 的 representation 整体崩溃）。两者都展示超线性增长：k=8→k=64 的 PPL 增长远超
    8× ratio。 best 档下这是 Claim 1 (non-additivity) 的 controlled experiment evidence：
    如果 distortion 是 additive，random-k 应该 ≈ sum of individual deltas，但实际 8.88× > linear
    prediction。

    '

      - 2.78
    - - L0H5
      - 2.14
    - - L8H2
      - 1.82
    - - L0H1
      - 1.53
    - - L12H6
      - 1.31
    - - L0H7
      - 1.18
    - - L5H4
      - 0.98
    - - L15H1
      - 0.87
    - - L0H2
      - 0.82
  figures_description:
  - 'Per-head 2-bit delta heatmap (48×8): L0 行有 4-5 个明显亮点但非全亮， L5-L15 中层有零星亮点。与 7B（L0
    全亮、其余全暗）形成鲜明对比： 14B 是 "渐变" 而非 "断崖"。

    '
  - 'Cumulative sensitivity curve: 斜率比 7B 平缓但比 Yi/Mistral/Gemma-2 陡， inflection point
    在 top-5%（19 heads）处 — 14B 精确落在 7B 和 Flat 模型中间。

    '
  analysis: '关键发现：concentration 0.47 和 t₁/t₅ 0.72 都恰好 miss joint condition （conc <
    0.50 AND t₁/t₅ > 0.70）。这不是 Spread 也不是 Flat—— 是 "diluted spread"，joint condition
    边界上的 continuous behavior。 14B 的 GQA 5:1（vs 7B 的 7:1）可能是稀释的结构性因素之一： 每层 8 个 KV heads
    比 4 个更均匀，L0 cluster 效应被分散。

    '
- name: Qwen2.5-14B constrained MCKP eval + k ablation
  plan_id: w1_qwen14b_constrained_mckp
  description: 'Constrained MCKP on Qwen2.5-14B at budget=0.25 (4× compression)。 Sweep
    k ∈ {0,4,8,12,16,20,24,32,48} 寻找 optimal max_2bit。 Verify greedy = MCKP at optimal
    k (solver equivalence).

    '
  expected_results:
    baseline_bf16_ppl: 6.5
    uniform_4bit_ppl: 7.8
    uniform_baseline_ratio: 1.2
    constrained_mckp_ppl: 7.18
    mckp_improvement_over_uniform_pct: 7.9
    greedy_constrained_ppl: 7.18
    greedy_mckp_delta: 0.0
    optimal_k: 12
    gap_recovery_pct: 47.7
    bit_distribution:
      '2': 12
      '4': 366
      '8': 6
    memory_ratio: 0.25
    k_ablation:
      k0: 7.8
      k4: 7.52
      k8: 7.28
      k12: 7.18
      k16: 7.21
      k20: 7.28
      k24: 7.38
      k32: 7.65
      k48: 8.42
  result_rationale: 'Uniform 4-bit degradation ratio 1.20×——低于 7B 的 1.575× 但显著高于 Flat
    模型的 1.01-1.05×。 原因：14B 的 L0 cluster 虽然被稀释（concentration 0.47 vs 0.61）， 但仍包含 ~5
    个高敏感头，被迫 4-bit 时产生可观的 degradation。 MCKP 将 top-12 敏感头从 4-bit 降至 2-bit 并将 6 个最敏感头升至
    8-bit， 利用这部分 heterogeneity 获得 7.9% 改善——有意义但远低于 7B 的 27.3%。 k-PPL curve 呈浅 U 型：minimum
    在 k=12（≈top-5% 的 63%）， compounding onset 在 k>32 后缓慢上升。U 型深度 (7.80-7.18=0.62) 远小于
    7B 的 (15.45-10.91=4.54)， 反映可利用的 sensitivity budget 更少。 Solver equivalence 仍然成立（greedy
    = MCKP，Δ=0.0000）， constraint 是 primary intervention 的 claim 在 14B 上同样成立。 Recovery
    47.7% 低于 7B 的 80.8%，与 concentration 的衰减定量一致。


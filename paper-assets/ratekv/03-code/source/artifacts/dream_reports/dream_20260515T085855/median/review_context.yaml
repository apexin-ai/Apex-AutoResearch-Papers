  plan_id: w1_qwen14b_hires_profiling
  description: 'High-resolution profiling (64 seq × 2048 tok) on Qwen2.5-14B (48L
    × 8KV = 384 heads, GQA 5:1). Measure per-head 2-bit distortion delta, compute
    concentration and t₁/t₅. Tests whether Qwen-7B''s Spread pattern generalizes within
    family at larger scale.

    '
  expected_results:
    calibration_baseline_ppl: 5.8432
    test_baseline_bf16_ppl: 6.5
    total_kv_heads: 384
    top5pct_n_heads: 19
    top5_concentration: 0.47
    t1_t5: 0.72
    delta_2bit_cv: 3.85
    l0_dominance_ratio: 0.38
    top1_head: L0H0
    top1_delta_2bit: 3.21
    top2_head: L0H3
    top2_delta_2bit: 2.78
    top3_head: L0H5
    top3_delta_2bit: 2.14
    top4_head: L8H2
    top4_delta_2bit: 1.82
    top5_head: L0H1
    top5_delta_2bit: 1.53
    l0_heads_in_top19: 5
    positive_delta_heads: 378
    distribution_shape: diluted_spread
    profiling_time_hours: 3.5
  result_rationale: 'Qwen2.5-14B 同属 Qwen2.5 家族，L0 敏感 cluster 的 architectural pattern
    大概率保留。 但 14B 有 384 个 KV head（vs 7B 的 112），top-5% 从 ~6 heads 扩至 19 heads。 L0 的
    8 个 head 中 ~5 个出现在 top-19，但 L0 只占 top-19 的 26%（5/19）， 其余 14 头散布在中层（L5-L15），导致
    concentration 从 7B 的 0.61 下降至 0.47—— 恰好落在 0.50 threshold 以下。 同时，L0 内部虽有多头敏感，但最强头（L0H0,
    delta=3.21）相对 top-5 heads 的占比上升 （t₁/t₅=0.72 vs 7B 的 0.57），因为中层 heads 稀释了 top-5
    中非 L0 头的贡献。 整体呈现 "diluted spread"：L0 cluster 存在但在全局分布中被稀释。 CV=3.85 高于 flat 模型（Mistral
    1.31, Gemma-2 1.28）但低于 7B 的数值， 进一步佐证 heterogeneity 介于 Spread 和 Flat 之间。

    '
  tables:

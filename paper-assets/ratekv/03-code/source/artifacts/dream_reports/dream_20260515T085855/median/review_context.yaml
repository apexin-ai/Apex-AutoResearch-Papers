narrative_guidance: 'Claim 3 保持 "empirical decision rule"（不升级）。14B 作为 boundary case  单独一段讨论：threshold
  是 soft boundary 而非 hard cutoff。 Decision rule 5/6（14B 是 type-II error），承认 rule 是
  directional heuristic， Limitation 明确写 "N=1 confirmed Spread; boundary behavior is
  continuous, not binary." 三档标签仍可用但 threshold 软化（"approximately 0.50" → "in the range
  0.45-0.55"）。 Gemma-2 段落微调 BOS-fixed 数字但叙事不变。 W9 super-additive 降为 empirical observation（图+描述性文字），不写
  formal proposition。 Contribution 重心从 "diagnostic" 向 "constraint as universal fix"
  倾斜。 仍可投 EMNLP Main。

  '

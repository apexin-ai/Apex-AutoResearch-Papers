    concentration 与 U 型深度的正相关。

    '
  analysis: '7.9% 改善远超 noise range（Gemma-2 -0.35%, Mistral -0.48%）， 是 genuine positive
    signal。但也远低于 7B 的 27.3%—— 这正是 median tier 的核心预期：borderline positive，不足以升级 N=1
    Spread claim。 k=12 到 k=20 接近 plateau（PPL Δ < 0.10），说明 sensitivity 分布比 7B 更平滑。

    plan_id: w9_superadditive_formalization
    description: '基于 w9_compounding_v2 已有数据，形式化 super-additive compounding 为 proposition。计算
      excess Δ(k) = randomk(k) − topk(k)， 验证随 k 超线性增长。

      '
    expected_results:
      excess_delta:
        k1: 0.061
        k4: 0.211
        k8: 1.028
        k16: 2.49
        k32: 6.726
        k64: 32.994
      consecutive_ratio:
        k4_over_k1: 3.46

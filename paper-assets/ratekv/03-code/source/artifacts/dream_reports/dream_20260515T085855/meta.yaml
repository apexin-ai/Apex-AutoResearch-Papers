        k64_over_k32: 4.9
      all_ratios_gt_1: true
      superlinear_confirmed: true
      k64_randomk_topk_ratio: 2.44
      monotonic_gap_increase: true
      proposition_formulation: 'Proposition (Compounding Excess): Let Δ(k) = PPL(random-k
        2-bit) − PPL(top-k 2-bit) on a Spread-heterogeneity model. Then Δ(k) is super-additive:
        Δ(k₁+k₂) > Δ(k₁) + Δ(k₂) for k₁,k₂ > 0, and Δ(k)/k → ∞ as k → N.

        '
    result_rationale: 'W9 v2 数据已经完整支持 super-additive 叙事。关键机制： (1) topk allocation
      选择 marginal benefit 最高的 heads（sensitivity 最低的）， 它们对 PPL 的影响随 k 温和线性增长——因为每个新增
      2-bit head 的 marginal damage 递增但缓慢（好 head 用完后开始用次好的）。 (2) randomk 随机选择 heads，在小
      k 时损害也温和（大概率选到低 sensitivity head），但大 k 时高概率命中 L0 cluster 中的 sensitive heads，触发
      compounding：多个 sensitive head 同时 2-bit 时 cross-head interaction 使总损害远超个体之和。
      (3) gap = randomk - topk 因此呈超线性增长：topk 温和增长（线性 + 温和凸）， randomk 在 k 大时 explosion（指数级凸），差值
      super-additive。 k64 时 ratio=2.44（在 [2.0, 3.5] 区间内）——不是 extreme explosion （那会暗示
      numerical instability），也不是 marginal（那会弱化叙事）， 而是清晰可解释的 super-additivity 信号。 连续
      ratio 全部 >1（min=2.42 at k16/k8）确认无回落点。

      '
    tables:
    - title: W9 Super-Additive Evidence (Qwen2.5-7B, L0 excluded)
      content: '| k  | top-k PPL | random-k PPL | Δ(k)   | Δ(k)/Δ(k/2) | ratio r/t
        |


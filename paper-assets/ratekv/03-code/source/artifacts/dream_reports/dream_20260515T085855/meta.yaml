        | 1  | 9.826     | 9.887±0.05   | 0.061  | —           | 1.006     |

        | 4  | 9.849     | 10.06±0.06   | 0.211  | 3.46        | 1.021     |

        | 8  | 10.042    | 11.07±0.69   | 1.028  | 4.87        | 1.102     |

        | 16 | 10.420    | 12.91±0.40   | 2.490  | 2.42        | 1.239     |

        | 32 | 11.604    | 18.33±2.53   | 6.726  | 2.70        | 1.580     |

        | 64 | 22.946    | 55.94±9.73   | 32.994 | 4.90        | **2.44**  |

        '
    figures_description:
    - 双 Y 轴 log-scale plot：左轴 PPL (topk 蓝线平缓, randomk 红线指数上升)，右轴 Δ(k) bar chart (灰色条高度
      super-linearly 增长)。k=64 处 Δ=33.0 明显超线性。annotate 'super-additive zone' at k≥16。
    - Randomk std error band：k≤16 band 窄 (low variance, 大部分随机选择等效)，k≥32 band 急剧扩大
      (是否命中 L0 cluster 成为关键随机因素)——可视化 'which heads you hit matters more as k grows'。
    analysis: 'Proposition 的核心 insight：compounding 不是 head 数量的简单函数， 而是 sensitive head
      的 co-occurrence 函数。topk（总是避开 sensitive heads） 享有近线性 degradation，而 randomk（大
      k 时必然命中 sensitive cluster） 遭遇指数级恶化。这直接支持 cardinality constraint 的 motivation——
      constraint 本质是将 allocation 限制在 "topk-like" 区域， 避免 "randomk-like" 的 compounding
      catastrophe。 Proposition 可形式化写入论文 §4 作为 theoretical support for Claim 2。

      '

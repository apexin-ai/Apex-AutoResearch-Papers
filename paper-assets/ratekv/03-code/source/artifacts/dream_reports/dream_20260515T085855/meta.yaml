    with no error bars. Downstream deltas (-0.48pp to -0.99pp) may be within noise
    but could also indicate that non-uniform allocation actively harms. Without confidence
    intervals on all models, the negative result is suggestive but not rigorous.


    5. **Compounding characterization lacks depth.** Demonstrated on one model. No
    formal model proposed. Super-additivity data (Table 5) is non-monotonic (ratio
    drops from 1.76 at k=8 to 1.24 at k=16, then back to 1.58 at k=32) with variance
    up to std=9.73. Paper correctly downgrades to "empirical trend" but then lists

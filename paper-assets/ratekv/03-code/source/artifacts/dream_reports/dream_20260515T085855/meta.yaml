    suggests mixed-precision benefit diminishes at scale — precisely the regime practitioners
    care about. No evidence the approach is relevant for 70B+ production models.


    ### Actionable Recommendations for Authors


    1. **Run the full pipeline on 2-3 more architectures**, prioritizing models likely
    to exhibit "spread" (e.g., different Qwen scales with modified GQA, or models
    with known L0 sensitivity). Even one more positive case would substantially strengthen
    the paper.


    2. **Add KIVI and/or KVQuant baselines** at 4× compression on at least Qwen2.5-7B.
    This contextualizes the 27.3% improvement: is constrained MCKP competitive with

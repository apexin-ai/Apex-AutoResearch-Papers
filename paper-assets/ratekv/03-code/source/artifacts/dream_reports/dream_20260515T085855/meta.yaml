    # Dream Review Report: "When Does Non-Uniform KV Cache Quantization Help?"


    **dream_id:** 20260515T085855 | **review_mode:** full | **reviewers:** R1 (Methods+Experiments),
    R2 (Novelty+Related Work)


    ---


    ## 1. Paper Summary


    This paper studies per-head mixed-precision KV cache quantization across six transformer
    architectures (Qwen2.5-7B/14B, Yi-1.5-9B, Llama-3.1-8B, Mistral-7B, Gemma-2-9B)
    with hardware-aligned bit-widths {2,4,8,16}. Three contributions are claimed:
    (1) a cardinality constraint (max_2bit ≤ k) that prevents compounding degradation
    universally; (2) a sensitivity distribution taxonomy (Spread/Spike/Flat); (3)
    an empirical decision rule (concentration ≳0.50 AND t₁/t₅ ≲0.70). Only Qwen2.5-7B
    shows strong benefit (+27.3% PPL), Qwen2.5-14B shows modest benefit (+7.9%, boundary
    case), and the other four architectures show negligible or negative benefit.


    ---


    ## 2. Roundtable Summary


    ### Step 1: Independent Reviews

    - **R1 (Methods+Experiments):** Score 4 (Weak Accept), Confidence 4

    - **R2 (Novelty+Related Work):** Score 4 (Weak Accept), Confidence 4


    ### Step 2–3: Cross-Review and Convergence


    **Consensus points (both reviewers agree):**


    1. **N=1 Spread is the paper''s most serious weakness.** The entire positive result
    rests on Qwen2.5-7B. With one strong positive and one borderline positive (14B),
    the generalizability of the "when does it help?" claim is fundamentally limited.


    2. **No comparison with existing methods.** The paper compares only against uniform
    4-bit and its own unconstrained variants. No head-to-head with KIVI, KVQuant,
    KVTuner, KVmix, GEAR, or any other published method. This is a significant gap
    for a top venue submission.


    3. **Decision rule is post-hoc.** Two free parameters (concentration threshold,
    t₁/t₅ threshold) fit to 5–6 data points with 1 strong positive. The rule is under-determined
    and cannot be validated on the same data it was derived from. The "soft boundary"
    framing is honest but does not resolve the generalizability concern.


    4. **Statistical rigor is lacking.** No error bars on main PPL results. Multi-seed
    stability (3-seed) reported only for Qwen in the appendix. The 14B downstream
    improvement (+0.7pp avg) is acknowledged as within single-run noise but still
    presented as "consistent positive."


    5. **The compounding analysis is the most technically valuable contribution.**
    The identification of super-additive 2-bit distortion compounding, the U-shaped
    k-PPL curve, and the random-vs-top-k control experiment are well-designed and
    constitute a genuine empirical finding not previously documented in KV cache quantization
    literature.


    6. **Honest treatment of limitations is a notable strength.** The paper does not
    oversell. The N=1 limitation, boundary case treatment, and explicit caveats about
    statistical significance are refreshingly candid.


    7. **The cardinality constraint is practical and immediately useful.** A one-line
    fix to existing MCKP solvers that prevents catastrophic failure. Simple, effective,
    and applicable without architectural changes.


    8. **The paper is primarily an empirical study with thin methods contribution.**
    The constraint is a textbook optimization technique; the profiling protocol follows
    established practice. Value lies in the systematic investigation and failure mode
    identification.


    **Disagreements resolved in discussion:**


    - **BOS correction:** R1 found it "unexplained and concerning"; R2 viewed it as
    a standard sliding-window evaluation fix. **Consensus:** The correction appears
    legitimate but should be more transparently documented. Not a fatal flaw.

    - **U-shape visualization:** R1 noted it''s only shown for Qwen-7B; R2 argued
    other models wouldn''t have non-trivial U-shapes. **Consensus:** The paper should
    show flat/monotonic curves for non-Spread models to complete the picture, but
    the absence is not a methodological gap.


    **New concerns surfaced in cross-review:**


    - **Quantization scheme unspecified** (R1 raised, R2 endorsed): symmetric vs.
    asymmetric, group size, per-channel vs. per-token never stated. For a paper whose
    entire contribution is bit-width allocation, this is a reproducibility gap.

    - **Aggressive compression results buried** (R2 raised, R1 endorsed): At 5.3×
    compression (Appendix), the constraint provides dramatic benefit even on "Flat"
    architectures. This substantially changes the narrative from "works on 1/6 models"
    to "works broadly at higher compression." Should be in main body.

    - **Profiling cost unquantified** (both): O(H × |B|) forward passes (448 for Qwen-7B,
    1536 for Qwen-14B) with no wall-clock time reported. No comparison to profiling
    cost of alternatives.


    ---


    ## 3. Detailed Strengths


    **S1. Failure mode identification and fix.** The compounding analysis (Section
    3.8) demonstrates that unconstrained solvers assign 58–106 heads to 2-bit, causing
    1.47–3.31× degradation. The cardinality constraint eliminates this failure mode
    universally. This is the paper''s core practical contribution.


    **S2. Systematic cross-architecture coverage.** Six architectures spanning GQA
    2:1 to 8:1, standard/sliding-window/softcapped attention, 7B–14B scale. The Yi-1.5-9B
    counterexample (high concentration + spike pattern → no benefit) is a genuinely
    useful insight that refutes the naive "high GQA = high benefit" hypothesis.


    **S3. Solver equivalence result.** Constrained greedy = constrained MCKP (Δ=0.0000)
    across all six architectures. Practically valuable: practitioners can use O(H
    log H) greedy without solver overhead. R1 correctly notes this is a structural
    consequence of small k + unique ordering rather than a deep result, but the practical
    implication stands.


    **S4. Scientific honesty.** The boundary case treatment of Qwen-14B (acknowledging
    type-II error, "soft boundary" framing, explicit N=1 limitation) is mature scientific
    writing. The paper argues for what the data supports and no more.


    **S5. Comprehensive related work.** 31 references covering uniform KV quantization,
    eviction methods, weight-level mixed-precision, KV-level mixed-precision at multiple
    granularities, and rate-distortion allocation. Positioning against RateQuant (polymatroid-based
    optimality breaking on non-consecutive bit-widths) is particularly well-done.


    **S6. Useful taxonomy.** Spread/Spike/Flat categorization provides practitioners
    a mental model, even if thresholds are preliminary. The "diluted spread" concept
    for 14B adds nuance.


    ---


    ## 4. Detailed Weaknesses


    **W1. N=1 confirmed Spread architecture (Critical).** Only Qwen2.5-7B shows strong
    MCKP benefit. Qwen-14B is borderline (+7.9%). Four of six models show no benefit.
    The decision rule is calibrated to separate 1 positive from 4–5 negatives — any
    two-dimensional threshold achieves this trivially. Without additional Spread architectures,
    the rule is a description of Qwen-7B, not a generalizable diagnostic.


    **W2. No comparison with established methods (Major).** The paper benchmarks only
    against uniform 4-bit and its own variants (unconstrained greedy/MCKP, heuristics).
    At minimum, comparison with KVTuner (layer-level mixed-precision) and KIVI (per-channel
    uniform) on the same models and budgets is needed to contextualize the results.
    A 27.3% PPL improvement over uniform is meaningless if KVTuner achieves 30%.


    **W3. Narrow evaluation protocol (Major).** WikiText-2 only for calibration and
    test PPL. Four downstream tasks (ARC-C, HellaSwag, PIQA, WinoGrande) at 0-shot
    with no error bars. No long-context evaluation (despite KV cache being most relevant
    at long sequences). No generation quality metrics. Cross-dataset check (WikiText-2
    vs. C4) is in appendix but only for profiling stability.


    **W4. Missing quantization implementation details (Moderate).** Symmetric vs.
    asymmetric, group size, per-channel vs. per-token quantization never specified.
    These choices significantly affect absolute PPL and relative benefit of mixed-precision.
    Reproducibility is compromised.


    **W5. Compounding analysis limited to single model (Moderate).** The super-additivity
    ratios, U-shaped curve, and random-vs-top-k control are all on Qwen-7B only. Whether
    compounding dynamics generalize is unknown. The Qwen-14B results show a shallower
    U-shape, which is consistent but insufficient.


    **W6. Best results buried in appendix (Moderate).** Aggressive compression (5.3×)
    shows the constraint and MCKP providing large benefit across more architectures.
    This substantially strengthens the paper''s narrative but is relegated to the
    appendix. The choice to focus on 4× — where benefit is architecture-dependent
    — undersells the contribution.


    **W7. Decision rule thresholds lack justification (Minor-Moderate).** Why top-5%
    concentration? Why t₁/t₅ rather than Gini coefficient, entropy, or kurtosis? No
    sensitivity analysis on threshold values. No comparison with alternative diagnostic
    metrics.


    **W8. No profiling cost analysis (Minor).** Wall-clock profiling time not reported.
    At 14B scale (1536 forward passes for hires), cost is non-trivial. No comparison
    to profiling cost of alternatives.


    ---


    ## 5. Experiment Coverage Assessment


    Comparing paper content against the imagined experiment plan (review_context.yaml):


    | Experiment | Covered? | Notes |

    |---|---|---|

    | Qwen-14B hires profiling | ✅ | Table 1: top-10 heads, concentration 0.47, t₁/t₅

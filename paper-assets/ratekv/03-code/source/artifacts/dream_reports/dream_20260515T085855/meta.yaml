      的 Layer 0 cluster（4 heads, concentration=0.61, t₁/t₅=0.57）是架构结构属性而非规模偶然——L0
      接收 raw embedding 信号， 对 KV cache 量化极敏感，这一机制在 14B（48 层、更深网络）中同样存在。 14B 比 7B 多
      20 层（48 vs 28），L0 的 8 个 head 在 384 总 head 中 占比降低（2.1% vs 7.1%），导致 concentration

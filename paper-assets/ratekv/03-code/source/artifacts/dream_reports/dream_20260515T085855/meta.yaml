    - **Quality of coverage:** Results are presented clearly in tables but some experiments
    feel compressed (e.g., downstream for non-Qwen models is summarized in one line
    each)

    - **The Gemma-2 BOS fix** and **3-tier collapse** to 2-tier are properly handled
    and honestly reported


    ### Meta-Assessment


    The paper represents competent empirical work on a practical question. Its fundamental
    challenge is that the answer to "when does non-uniform KV cache quantization help?"
    turns out to be "rarely, and less so at scale." This honest answer is valuable
    but makes it difficult to claim a strong positive contribution. The cardinality
    constraint is sensible engineering but not a conceptual advance. The negative
    result needs more architectures and error bars to be "systematic." The compounding
    characterization needs more depth or should be repositioned.


    For a top ML venue at ~25% acceptance, the paper falls below the novelty and significance
    thresholds despite strong execution. A workshop paper, systems venue (e.g., MLSys),
    or a negative-results track would be more appropriate targets.


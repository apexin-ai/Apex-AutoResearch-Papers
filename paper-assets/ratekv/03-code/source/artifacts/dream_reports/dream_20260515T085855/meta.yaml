    # Dream Review Report — ratekv (dream_20260515T085855)


    **Paper**: "When Does Non-Uniform KV Cache Quantization Help? A Systematic Study
    of Per-Head Sensitivity Heterogeneity and a Simple Cardinality Constraint Fix"


    **Review mode**: Full (2 Reviewers, 4-step roundtable)

    **Date**: 2026-05-15


    ---


    ## Roundtable Process


    - **R1** (Methods + Experiments): 4/6 → **5/6** after correcting N=1 misread

    - **R2** (Novelty + Related Work): 4/6 → **4/6** maintained

    - **Consensus score**: **4.5/6 (Borderline Accept)**


    **Process note**: Both reviewers initially scored 4/6, largely anchored on a belief
    that the paper had N=1 for the Spread category (only Qwen2.5-7B). Upon verifying
    the review PDF, the paper unambiguously includes Qwen2.5-14B as the sixth model
    with full results (Tables 1–5, 7, 10–12), giving N=2 for each shape category.
    R1 upgraded to 5/6; R2 maintained 4/6, arguing same-family validation is architecturally
    insufficient.


    ---


    ## Paper Summary


    The paper studies per-head mixed-precision KV cache quantization on hardware-aligned
    bit-widths {2,4,8,16} across six models (Qwen2.5-7B/14B, Yi-1.5-9B, Llama-3.1-8B,
    Mistral-7B-v0.3, Gemma-2-9B). It proposes a three-category shape taxonomy (Spread,
    Spike, Flat) of per-head sensitivity distributions and a two-metric empirical
    diagnostic (concentration ≥0.50 AND t₁/t₅ ≤0.70) that achieves 6/6 classification
    accuracy at both PPL and downstream task levels. The key finding is that unconstrained
    MCKP/greedy solvers fail catastrophically on Spread architectures (2.83–3.31×
    baseline) due to super-additive compounding, and a single cardinality constraint
    (≤k heads at 2-bit) suffices to prevent this, achieving 22–27% PPL improvement
    while making solver choice irrelevant (greedy = MCKP, Δ=0.0000).


    ---


    ## Consolidated Strengths


    ### S1. Clean problem decomposition and principled framework (R1, R2)

    The profile → classify shape → constrain → solve pipeline is elegant, interpretable,
    and reproducible. Casting per-head allocation as MCKP with a cardinality constraint
    is well-motivated by the compounding failure mode.


    ### S2. Breadth and thoroughness of validation (R1, R2)

    Six models across four architecture families, with constrained + unconstrained
    settings, k-ablation, downstream tasks (5 benchmarks), BOS fix validation, and
    cross-dataset stability. The 12 tables cover the experimental space comprehensively
    for a 9-page paper.


    ### S3. 14B held-out validation (R1, R2)

    Profiling Qwen2.5-14B after thresholds were set on other models and confirming
    both shape classification (Spread) and allocation effectiveness (22% improvement)
    is a genuine generalization check that strengthens the diagnostic.


    ### S4. Solver equivalence result (R1, R2)

    Demonstrating that constrained greedy = constrained MCKP (Δ=0.0000) across all
    tested models is a clean and practically useful result. Practitioners can use
    O(H log H) greedy without quality loss.


    ### S5. Honest self-assessment (R1, R2)

    The paper explicitly acknowledges limitations (same-family Spread, no long-context
    eval, single-seed downstream) without overclaiming. The negative results (4/6
    models show no benefit from non-uniform allocation) are reported without spin.


    ---


    ## Consolidated Weaknesses


    ### W1. Both Spread models are Qwen family [Major] (R1 #1, R2 #1)

    Qwen2.5-7B and 14B share architecture, tokenizer, training recipe, and attention
    design (GQA, RoPE, SwiGLU). While 14B provides scale invariance evidence within
    Qwen, the paper lacks a non-Qwen Spread model. The diagnostic''s ability to identify
    beneficial architectures outside the Qwen family is untested. A reviewer could
    argue N=2 within one family is effectively N=1 for architectural diversity.


    **Impact**: This is the single most important weakness. It determines whether
    the paper is a generalizable methodology contribution or a Qwen-specific case
    study.


    ### W2. No comparison with concurrent mixed-precision KV methods [Major] (R2 #2)

    KVTuner (ICML 2025), AquaKV, KVmix, and PM-KVQ are cited in related work but not
    benchmarked. Without head-to-head PPL comparisons on the same models, the practical
    advantage of per-head allocation over layer-level mixed-precision is unjudged
    except by qualitative argument (Appendix A.4 in the .tex sources, not in the review
    PDF).


    **Impact**: Reviewers at a top venue will expect at least one concurrent baseline.


    ### W3. Super-additive compounding analysis is single-model [Moderate] (R2 #3,
    R1 #3)

    The core mechanistic claim — that 2-bit head interactions cause super-additive
    degradation — is supported by the random-k vs top-k experiment (Table 8) on Qwen2.5-7B
    only. The U-shaped k-PPL curve (Table 7) is shown for 14B but the detailed compounding
    decomposition is not replicated on non-Qwen models. The three-tier taxonomy (Catastrophic/Moderate/Mild
    in Table 6) provides indirect evidence across models, but the formal proposition
    verification is N=1.


    ### W4. No downstream error bars or significance tests [Moderate] (R1 #5, R2 #4)

    Downstream evaluation uses single-seed 0-shot. The reported deltas are small (+1.79pp
    for 14B, −0.48 to −0.99pp for non-Spread models). Without confidence intervals
    (minimum 3 seeds), some effects may be within noise. ARC-Challenge shows the largest
    sensitivity to allocation strategy but also the highest variance potential.


    ### W5. No long-context evaluation [Moderate] (R1 #4, R2 #5)

    All PPL experiments use max_length=2048. KV cache quantization is most impactful
    at long sequences where memory pressure is real and attention patterns shift.
    Head sensitivity profiles may change at 4K–32K context lengths. The primary use
    case for this work is untested.


    ### W6. Minimal references in main paper [Minor] (R2)

    The main paper body cites only one reference ([1] RateQuant). While the .tex source
    files contain an extensive related work section with 31 references and detailed
    appendices, the review PDF as compiled has extremely thin citations. This is a
    presentation gap that reviewers will flag.


    ### W7. Post-hoc threshold concern, partially mitigated [Minor] (R1 #8)

    The diagnostic thresholds (concentration ≥0.50, t₁/t₅ ≤0.70) are derived from
    6 data points with 2 free parameters. 14B as held-out partially mitigates overfitting
    concerns. No sensitivity analysis on threshold choice (e.g., what if 0.45 or 0.55
    is used) is provided in the review PDF.


    ### W8. Cardinality constraint is conceptually straightforward [Minor] (R2 #9)

    Capping the number of aggressively quantized components is a known technique in
    mixed-precision literature (HAWQ family). The contribution is applying it specifically
    to KV cache heads and demonstrating solver equivalence, which is clean engineering
    but limited novelty.


    ---


    ## Questions for Authors


    **Q1** (from R1, R2): Have you tested any non-Qwen model that exhibits the Spread
    pattern? Even one cross-family Spread example would dramatically strengthen the
    taxonomy.


    **Q2** (from R2): How sensitive is the diagnostic to threshold choices? If concentration
    threshold moves to 0.45 or 0.55, or t₁/t₅ to 0.65 or 0.75, does any classification
    flip?


    **Q3** (from R2): Can you provide the compounding curve (PPL vs k, random-k vs
    top-k) for at least Gemma-2 (moderate failure) to show the mechanism operates
    differently on non-Spread models?


    **Q4** (from R1): What happens at longer context lengths (4K, 8K, 16K)? Do head
    sensitivity profiles shift, and does the optimal k change?


    **Q5** (from R2): What is the wall-clock cost of the full pipeline (profiling
    + k sweep + allocation) vs. just using uniform 4-bit?


    **Q6** (from R1): Would profiling with all bit-widths {2,4,8,16} simultaneously
    rather than 2-bit-only yield a different taxonomy?


    **Q7** (from R2): How does this approach interact with outlier-aware methods (RotateKV,
    SmoothQuant)? Could combining rotation/smoothing with mixed-precision allocation
    further improve results?


    ---


    ## Experiment Coverage Assessment


    Comparing against the 8 imagined experiments in review_context.yaml:


    | # | Experiment | Covered? | Notes |

    |---|-----------|----------|-------|

    | 1 | Qwen2.5-14B hires profiling | ✅ §4.1, Tables 1–2 | Full coverage |

    | 2 | Qwen2.5-14B constrained MCKP | ✅ §4.2, Tables 3–4 | Full coverage |

    | 3 | Qwen2.5-14B unconstrained | ✅ §4.3, Tables 5–6 | Full coverage |

    | 4 | Qwen2.5-14B k ablation | ✅ §4.4, Table 7 | Full coverage |

    | 5 | Qwen2.5-14B downstream | ✅ §4.7, Tables 10–11 | Full coverage |

    | 6 | Gemma-2 BOS fix | ✅ §4.6, Table 9 | Full coverage |

    | 7 | W9 super-additive formalization | ✅ §4.5, Table 8 | Full coverage |

    | 8 | Decision rule 6/6 validation | ✅ §4.8, Table 12 | Full coverage |


    **Coverage: 8/8** — All imagined experiments are reflected in the paper.


    ---


    ## Scoring Breakdown


    | Criterion | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Soundness | 5 | 4 | 4.5 |

    | Novelty | 4 | 3 | 3.5 |

    | Significance | 4 | 4 | 4 |

    | Presentation | 5 | 4 | 4.5 |

    | Reproducibility | 5 | 4 | 4.5 |

    | **Overall** | **5/6** | **4/6** | **4.5/6** |


    ---


    ## Final Verdict


    **Score: 4.5/6 — Borderline Accept**


    The paper makes a solid empirical contribution: it identifies a real failure mode
    (unconstrained MCKP catastrophe on Spread architectures), provides a simple and
    effective fix (cardinality constraint), and validates a practical diagnostic (6/6
    accuracy with held-out model) across six models. The experimental scope is thorough
    given the page count, and the paper is honestly written.


    The main reservation is that both Spread models belong to the Qwen family, leaving
    the diagnostic''s cross-architecture generalizability partially open. Secondary
    concerns include the absence of concurrent-method comparisons, single-model super-additivity
    verification, and no long-context evaluation. These are addressable in revision.


    **Recommendation**: Accept with minor revisions if a revision path exists (add
    concurrent baseline, threshold sensitivity analysis, and long-context spot-check).
    As-is, borderline — the methodological contribution and experimental thoroughness
    are strong, but the Qwen-only Spread limitation and thin main-paper references
    weigh against a clear accept at a top venue with ~25% acceptance rate.

    '

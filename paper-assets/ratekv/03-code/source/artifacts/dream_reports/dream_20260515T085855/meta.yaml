    3. **Fix the PDF compilation** to include the full related work and bibliography.


    4. **Add multi-seed error bars on all 6 models** for both PPL and downstream tasks.
    3 seeds minimum. This is essential for the negative result claims.


    5. **Deepen the compounding analysis** with mechanistic investigation: layer-wise
    activation norms, attention weight entropy, or a simple quantitative model (e.g.,
    multiplicative noise accumulation). Alternatively, downgrade C3 from a "contribution"
    to an "observation" and focus the paper on C1+C2.


    6. **Consider reframing as a focused negative-result paper.** The strongest story
    may be: "We tested mixed-precision KV cache quantization across 6+ architectures
    and found it helps in only 1. Here''s why, and here''s a simple safeguard if you
    try it anyway." This framing is honest, surprising, and practically useful—but
    it needs more architectures to be convincing.


    ### Experiment Coverage Assessment


    Compared to the 18 imagined experiments in the design context:

    - **Covered in paper:** ~15/18 experiments appear in some form

    - **Gaps:** Qwen2.5-14B downstream (predicted, not run), Qwen2.5-72B (profiling-only,

positioning:
  core_claim: "IRT provides a principled psychometric framework for NLP evaluation that captures item difficulty, discrimination, and model ability as latent traits — superior to raw accuracy"
  key_results: "Tutorial demonstrates IRT benefits for difficulty estimation, benchmark quality assessment, latent trait modeling; introduces py-irt Python package"
  limitations:
    - "Tutorial format — no novel experimental results"
    - "IRT assumptions (unidimensionality, local independence) may not hold for LLM evaluation"
    - "Computational cost of IRT model fitting"
  relation_to_us: "foundation"

narrative:
  story_type: "统一框架型"
  hook: "NLP evaluation relies on raw accuracy, missing rich item-level information available through psychometric methods"
  tension: "Psychometrics community has decades of evaluation methodology that NLP ignores"
  key_insight: "IRT models items and examinees jointly, enabling benchmark quality assessment, efficient evaluation, and fair comparison"
  argument_chain: "raw accuracy is limited → IRT models item × examinee interaction → NLP applications (evaluation, mining, curriculum learning) → py-irt toolkit → community adoption"
  contribution_framing: "Tutorial contribution: bridge psychometrics and NLP communities"
  intro_structure: "Tutorial structure: evaluation background → IRT intro → NLP applications → advanced topics → future opportunities"
  notable_technique: "Providing py-irt package lowers adoption barrier — actionable tutorial rather than just theoretical overview"


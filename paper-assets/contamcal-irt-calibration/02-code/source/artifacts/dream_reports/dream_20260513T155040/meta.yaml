    \ by controlled experiments. The RL claims (42% regret reduction) rest on an observational\
    \ study with 8 models and no ground truth, which is insufficient for the confidence\
    \ with which they are stated.\n\n### D. Significance and Impact\n\n**Problem importance:\
    \ High.**\nContamination is increasingly recognized as a fundamental threat to\
    \ LLM evaluation validity. The community needs solutions beyond detection.\n\n\
    **Practical adoption barriers:**\n- Requires at least 50 models for reliable estimation\n\
    - Full pipeline requires model weight access (embedding retrieval, Min-K%++)\n\
    - ConStat requires paraphrase generation infrastructure\n- Stan MCMC is computationally\
    \ expensive\n- RL regime (where most production models live) produces very wide\

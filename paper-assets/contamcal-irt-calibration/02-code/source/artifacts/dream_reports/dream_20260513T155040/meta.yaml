    result_rationale: 'best档核心实验。4PL+γ MAE=1.97pp完全复现仿真表现——真实SFT数据上的contamination
      结构与仿真假设匹配良好。MMLU MAE最低(1.8pp)因为item数量最多(14K)提供了最强的 统计功效；HumanEval最高(2.4pp)因为item少且code
      execution评分的binary nature 增加了noise。93% coverage接近nominal 95%，略低是因为real data的item

      selection； (4) coverage随noise增加而上升（从0.88到0.97）是因为CI变宽了， 不是因为calibration变好了——这是overcoverage问题，CI过于保守。
      measurement error model收敛但CI width 24pp说明即使自动noise propagation也无法"解决"问题， 因为核心issue是信号本身太noisy，不是propagation方法不对。


      (2) Self-Critique的FP rate 35%和FN rate 28%意味着matched noise level已经很高， 1x noise
      injection后CI膨胀至22.5pp——此时CI覆盖了绝大部分可能的score值， calibration退化为"我们不知道真实score是多少"的诚实但无用的声明；

  review_report: "---\ndream_id: dream_20260513T155040\ntier: best\noverall_score:\
    \ 5/10 — Borderline Reject\ntimestamp: 2026-05-13T16:29:14.054943+00:00\n---\n\
    \n# DREAM Review Report: ContamCal\n\n**Paper:** ContamCal: Calibrating Benchmark\
    \ Scores for Training Data Contamination via Contamination-Augmented Item Response\
    \ Theory\n**Venue:** AAAI 2027 (acceptance rate ~17.6%, scale 1–10)\n**Review\
    \ mode:** Full (2 Reviewers + Roundtable)\n**Date:** 2026-05-13\n\n---\n\n## Venue\
    \ Calibration\n\nAAAI 2026 acceptance rate was 17.6% (4,167/23,680). Scoring scale\
    \ 1–10. Evaluation criteria: significance and novelty of contributions, theoretical/empirical\
    \ soundness, relevance to the AAAI community, clarity. Preference for papers that\
    \ explore new territory over narrow incremental advances.\n\n---\n\n## Reviewer\
    \ 1 (R1): Methods + Experiments\n\n### A. Methodological Soundness\n\n**A1. 4PL+γ\
    \ formulation (Adequate with concerns).**\nThe covariate-in-the-exponent approach\
    \ (Eq. 2) is standard in item compromise IRT. However, using a **single global\
    \ γ** is a strong assumption: it asserts contamination produces the same logit-scale\
    \ boost regardless of model scale, item type, or benchmark. The paper's own data\
    \ shows scale-dependent inflation (0.5B: 10.8pp vs. 3B: 8.2pp at 50% dosage),\
    \ which directly contradicts a uniform γ. A hierarchical γ_j ~ N(μ_γ, σ_γ) or\
    \ per-benchmark γ would be more defensible. The paper is ambiguous about whether\
    \ IRT is fitted jointly across benchmarks or separately — this must be clarified.\n\
    \n**A2. RRF aggregation (Reasonable but under-justified).**\nRRF with c=60 is\
    \ a sensible default. However, the argument against learned weights is hand-wavy\
    \ — learned weights could be trained on the authors' own synthetic contamination\
    \ data, avoiding circularity. The ablation shows calibration-weighted RRF (0.86)\
    \ slightly underperforms vanilla RRF (0.87), but this is tested only in the best-case\
    \ SFT regime. RRF's real advantage is simplicity and robustness to outlier signal\
    \ scores, which should be stated directly.\n\n**A3. Identifiability (Ad hoc threshold).**\n\
    The claim that θ-γ posterior correlation = 0.31 < 0.4 confirms identifiability\
    \ relies on an **ad hoc threshold** with no cited theoretical or empirical basis.\
    \ The argument would be stronger with a simulation study showing that identifiability\
    \ degrades as this correlation increases (the imagined exp-004 identifiability\
    \ sweep), but the paper appears to present only a single MVP seed.\n\n**A4. Measurement\
    \ error extension (Under-specified).**\nThe formulation e_obs = e_true + ε is\
    \ classical measurement error. However, the paper does not specify how e_true\
    \ is handled in the Stan model. If e_true is a latent variable for each (j,i)\
    \ pair, the parameter space explodes. If σ_e merely inflates γ's posterior variance\
    \ post-hoc, the uncertainty propagation is approximate. Implementation details\
    \ are missing.\n\n**A5. Counterfactual θ* identification (Conditionally valid).**\n\
    Valid under the assumption that contamination acts purely additively in logit\
    \ space and does not alter genuine reasoning ability. Plausible for SFT memorization\
    \ but questionable for RL, where training on benchmark-adjacent data may genuinely\
    \ improve capability.\n\n### B. Experimental Rigor\n\n**B1. SFT injection protocol\
    \ (Sound for internal validity).**\nParaphrase-based injection at 3 scales × 5\
    \ dosages × 4 benchmarks = 15 model pairs is a solid controlled setup. However,\
    \ SFT injection produces a specific memorization signature that may be easier\
    \ to detect than pre-training contamination — ecological validity is limited.\n\
    \n**B2. Incomplete tables (CRITICAL).**\nTable 4 (main result) reports per-benchmark\
    \ MAE for ContamCal only; all 5 baselines show \"—\" for per-benchmark MAE, CI\
    \ coverage, CI width, and Kendall τ. This means:\n- Cannot assess whether ContamCal's\
    \ advantage is uniform or concentrated on a subset of benchmarks\n- Baseline uncertainty\
    \ quantification is completely unreported\n- Ranking preservation for baselines\
    \ is unknown\n\nTables 5, 6, 7, 10, 11, 12 have similar pervasive \"—\" entries.\
    \ Approximately 60% of cells that should contain values are missing. **This is\
    \ the single most damaging issue** — it makes the paper appear either incomplete\
    \ or as if unfavorable results are being hidden.\n\n**B3. Zero figures (CRITICAL).**\n\
    The paper contains **no figures at all**. For a two-stage Bayesian pipeline with\
    \ 12 experiments, this is disqualifying. Essential missing figures:\n- Framework\
    \ overview diagram (pipeline visualization)\n- Calibrated vs. true accuracy scatter\
    \ plot with CI error bars (the \"money figure\")\n- Signal × regime AUC heatmap\n\
    - Dose-response curves\n- Coverage calibration plot\n\n**B4. RL regret calculation\
    \ (Potentially circular).**\nThe 42% regret reduction claim requires knowing the\
    \ \"true\" uncontaminated ranking for RL models, but no ground truth exists. If\
    \ calibrated scores serve as the ground truth proxy, the calculation is tautological.\
    \ The paper does not specify the ground truth source for RL regret computation.\n\
    \n**B5. No error bars.**\nNo standard deviations or confidence intervals are reported\
    \ for any experimental result, despite the experiment plan specifying 3 seeds.\n\
    \n**B6. Scale bridging.**\n7B controlled (MAE=2.2pp) adds incremental confidence.\
    \ 72B observational is necessarily weaker — γ=0.18 on MMLU could reflect true\
    \ contamination or systematic bias in signals at this scale. The γ CI including\
    \ zero on GSM8K could mean either \"reasoning benchmarks are less susceptible\"\
    \ or \"insufficient power at 72B.\"\n\n**B7. Few-examinee regime.**\nN≥50 with\
    \ pre-estimation from 400+ model pool is practical but assumes item parameter\
    \ stability across model pools, which is not validated.\n\n### R1 Scores\n\n|\
    \ Criterion | Score | Justification |\n|-----------|-------|---------------|\n\
    | Overall | **4/10** | Strong idea, but manuscript is incomplete — missing figures,\
    \ pervasive \"—\" in tables, no error bars. Cannot evaluate empirical strength.\
    \ |\n| Soundness | **3/5** | Core formulation is correct. Single global γ, ad\
    \ hoc identifiability threshold, potentially circular RL regret, and missing measurement\
    \ error details are concerns. |\n| Significance | **4/5** | High practical value.\
    \ Calibration with UQ under contamination is a genuine unsolved problem. |\n|\
    \ Novelty | **3/5** | Non-trivial cross-disciplinary transfer. Individual components\
    \ are not new. |\n| Clarity | **2/5** | Good writing quality, but zero figures\
    \ and sparse tables make evaluation impossible. |\n| Confidence | **4/5** | Familiar\
    \ with IRT, Bayesian methods, and LLM contamination literature. |\n\n**R1 Recommendation:**\
    \ Reject in current form.\n\n---\n\n## Reviewer 2 (R2): Novelty + Related Work\n\
    \n### A. Novelty Assessment\n\n**A1. Core idea (Incremental, not transformative).**\n\
    Treating contamination as a covariate in IRT rather than removing it is the central\
    \ contribution. However, this is a direct application of Eckerly (2017) and Sinharay\
    \ (2017)'s item compromise IRT to a new domain. The analogy to causal inference\
    \ shifting from elimination to adjustment is apt but overstated — the paper does\
    \ not develop new causal identification theory.\n\n**A2. Three structural modifications\
    \ (Mixed novelty).**\n- (a) Independent examinees → single model with joint item\
    \ distributions: This is the most interesting adaptation but is **under-explored**\
    \ — the local independence assumption is fundamentally altered when a single model\
    \ responds to all items (item responses are correlated through shared model parameters).\
    \ The paper does not discuss or test this violation.\n- (b) Binary leakage → continuous\
    \ exposure: Straightforward extension; continuous covariates in IRT are standard.\n\
    - (c) Regime-conditional ability: An engineering decision (signal selection based\
    \ on training regime), not a modeling contribution.\n\n**A3. RRF fusion (Not novel).**\n\
    RRF is an off-the-shelf rank aggregation technique. Applying it to contamination\
    \ signal fusion is a reasonable engineering choice, not a methodological contribution.\n\
    \n**A4. Regime-conditional modeling (Engineering, not contribution).**\nDetecting\
    \ that RL degrades certain signals and automatically falling back to surviving\
    \ signals is useful but is an implementation decision, not a theoretical advance.\n\
    \n**A5. Incremental novelty over remove-and-rescore (Clear but narrow).**\nThe\
    \ improvement over remove-and-rescore (1.97pp vs. 4.2pp MAE) demonstrates the\
    \ value of continuous exposure modeling over binary flagging. The provision of\
    \ credible intervals is a genuine addition. However, this improvement comes entirely\
    \ from (a) using continuous rather than binary exposure and (b) using IRT rather\
    \ than simple rescoring — both are standard techniques.\n\n**Overall novelty verdict:**\
    \ ContamCal is a **well-executed synthesis paper** — it combines existing components\
    \ (RRF, 4PL IRT, contamination signals, Bayesian MCMC) in a sensible way for a\
    \ new application. The novelty is in the cross-disciplinary transfer and the specific\
    \ combination, not in any individual component. For AAAI, this level of novelty\
    \ is borderline.\n\n### B. Related Work Completeness\n\n**10 citations is critically\
    \ insufficient** for a paper spanning contamination detection, IRT, Bayesian inference,\
    \ and evaluation methodology. Major gaps:\n\n1. **Missing baselines/citations:**\n\
    \   - DCR (Detecting Contamination via Response patterns) — the most directly\
    \ comparable prior work using IRT-adjacent ideas for contamination, absent as\
    \ both citation and baseline\n   - HiBayES — Bayesian evaluation scoring with\
    \ hierarchical models\n   - DIF (Differential Item Functioning) literature — the\
    \ direct precursor to item compromise IRT, extensive body of work unacknowledged\n\
    \n2. **Missing related areas:**\n   - Membership inference attacks (broader contamination\
    \ detection literature)\n   - Extraction attacks for training data\n   - Post-hoc\
    \ calibration in ML (Platt scaling, temperature scaling — conceptually related\
    \ as post-hoc score adjustment)\n   - Dynamic/live benchmarks (LiveBench, LMSYS)\
    \ — the alternative approach to contamination\n   - Data attribution and influence\
    \ functions\n   - Conformal prediction as alternative to Bayesian CIs\n   - Benchmark\
    \ design literature\n\n3. **Educational measurement connection under-developed.**\n\
    \   The paper cites Eckerly (2017) and Sinharay (2017) but does not engage with\
    \ the broader DIF, item preknowledge, or test security literature. Given that\
    \ this is the theoretical foundation, deeper engagement is needed.\n\n4. **Missing\
    \ concurrent work.**\n   The 2025-2026 period has seen active work on contamination-aware\
    \ evaluation. The paper should survey recent arXiv preprints on this topic.\n\n\
    ### C. Positioning and Framing\n\n**\"Statistical safety net\" framing (Effective\

  review_report: "---\ndream_id: dream_20260513T155040\ntier: median\noverall_score:\
    \ borderline reject (5/10)\ntimestamp: 2026-05-13T16:38:35.632893+00:00\n---\n\
    \n# Dream Review Report: ContamCal\n\n**Paper**: ContamCal: Principled Calibration\
    \ of Contaminated Benchmark Scores via Contamination-Augmented Item Response Theory\n\
    **Venue Target**: AAAI 2027\n**Review Mode**: Full (2 Reviewers + Roundtable)\n\
    **Date**: 2026-05-13\n\n---\n\n## Venue Calibration\n\n**AAAI 2026 reference**:\
    \ 23,680 submissions, 17.6% acceptance rate (4,167 accepted). Rating scale 1–10\
    \ (10=seminal, 6=marginally above threshold, 5=marginally below). Evaluation dimensions:\
    \ significance/novelty of contributions, theoretical/empirical soundness, relevance\
    \ to AAAI community, clarity of exposition.\n\n---\n\n## R1: Methods & Experiments\n\
    \n### Strengths\n\n1. **Well-motivated problem formulation.** Grounding in educational\
    \ measurement's item compromise tradition (Eckerly 2017, Sinharay 2017) is principled.\
    \ The key question — \"what would a model's score be without contamination?\"\
    \ — is precisely the right question the field needs answered, and no prior work\
    \ provides it with uncertainty quantification.\n\n2. **Comprehensive controlled\
    \ experiment design.** 3 model scales × 5 dosage levels × 4 benchmarks = 60 model-benchmark\
    \ pairs with known ground truth. This is one of the most thorough contamination\
    \ injection studies to date. Clean SFT (0% dosage) showing <1pp degradation confirms\
    \ baseline reliability.\n\n3. **Training-free RRF avoids meta-circularity.** A\
    \ learned aggregator could itself be contaminated — using RRF sidesteps this elegantly.\
    \ The paper correctly identifies this as a design choice rather than claiming\
    \ RRF is optimal.\n\n4. **Honest RL characterization.** Rather than hiding the\
    \ ~17pp CIs, the paper transparently presents them as the correct answer given\
    \ signal quality. The 17% expected regret reduction, while modest, is honestly\
    \ framed. This intellectual honesty is commendable.\n\n5. **Signal survival analysis\
    \ (Section 4.8).** The heatmap showing cliff-like degradation of embedding/logit-based\
    \ signals under RL post-training is an informative empirical contribution with\
    \ practical implications for the detection community.\n\n6. **Growing Pains pre-estimation.**\
    \ Extending the practical floor from N=50 to N=20 models is a useful contribution\
    \ for small-scale evaluation settings.\n\n### Weaknesses\n\n1. **Single global\
    \ γ_j per model is misspecified.** The paper's own results show benchmark-dependent\
    \ effects: MMLU MAE=3.4pp but HumanEval MAE=5.6pp; γ at 100% dose varies across\
    \ benchmarks (implicit in the per-benchmark MAE variation). A single γ_j forces\
    \ the model to average across heterogeneous contamination effects. Per-benchmark\
    \ or per-domain γ would be more appropriate and is a straightforward extension\
    \ the paper does not explore or even discuss.\n\n2. **Two-stage pipeline discards\
    \ Stage 1 uncertainty.** Exposure scores e_ij from RRF are treated as fixed point\
    \ estimates in the IRT model. Their estimation uncertainty is never propagated.\
    \ This is likely a primary contributor to the 89% vs 95% nominal coverage gap\
    \ — the model is overconfident because it ignores input noise. The noise propagation\
    \ analysis (Section 4.5) partially addresses this post-hoc but does not fix the\
    \ core issue. A joint model or a measurement error model should be the default,\
    \ not an afterthought.\n\n3. **No statistical significance testing.** The key\
    \ claim — 14% relative MAE improvement over linear regression+CI (4.2 vs 4.9pp)\
    \ — has no error bars, confidence intervals, or significance tests. With only\
    \ 15 model variants in the controlled setting, this 0.7pp difference could easily\
    \ be within sampling variability. The paper reports metrics from what appears\
    \ to be a single experimental run per configuration. Without bootstrap CIs or\
    \ cross-validation, the margin is not established as statistically meaningful.\n\
    \n4. **θ-γ identifiability is asserted, not proven.** The paper observes θ-γ posterior\
    \ correlation of 0.38 and treats this as evidence of identifiability. No formal\
    \ identifiability analysis (e.g., Fisher information matrix rank conditions, simulation\
    \ recovery studies with known parameters) is presented. The posterior correlation\
    \ could be low simply because the prior dominates. The 5% dosage result (γ CI\
    \ includes 0) already shows identifiability failure in the most practically relevant\
    \ regime.\n\n5. **IRT local independence assumption violated.** Standard IRT assumes\
    \ examinees respond independently. Here, a single model produces all responses\
    \ — items within a benchmark share common model architecture, training data, and\
    \ inference procedure. This violation is never discussed. It likely inflates the\
    \ effective sample size, leading to narrower-than-warranted CIs (compounding the\
    \ coverage gap).\n\n6. **Missing baselines.**\n   - DCR (Balachandran et al. [6])\
    \ is cited but not included as an experimental baseline despite being the most\
    \ directly comparable prior work on contamination calibration for ranking.\n \
    \  - No comparison to a simple \"flag-and-remove\" threshold approach on the RRF\
    \ scores.\n\n7. **HumanEval item count (N=164).** This is low for 4PL IRT estimation\
    \ with 4 item parameters each. The paper uses Growing Pains pre-estimation for\
    \ few-examinee settings but does not discuss few-item settings. HumanEval consistently\
    \ shows the worst results (MAE=5.6pp, AUC=0.63–0.76), and item scarcity is a likely\
    \ contributor.\n\n8. **MCMC diagnostics marginal for RL case study.** R̂=1.015\
    \ (above the 1.01 threshold recommended by Vehtari et al. 2021), 1.2% divergent\
    \ transitions (above the 0.1% heuristic), ESS_bulk=210 (below the 400 recommended\
    \ minimum). These are reported but not remediated. Increasing warmup, using NUTS\
    \ adaptation, or reparameterization could help.\n\n### Questions for Authors\n\
    \n1. Have you evaluated per-benchmark γ_{jk} (model j, benchmark k)? What is the\
    \ MAE improvement and does it close the coverage gap?\n2. What are bootstrap confidence\
    \ intervals on the MAE differences between ContamCal and linear regression+CI?\
    \ Is the 0.7pp gap significant at p<0.05?\n3. Can you provide a simulation recovery\
    \ study: generate data from the true 4PL+γ model with known parameters, fit the\
    \ model, and report parameter recovery rates?\n4. Why is Balachandran et al. [6]\
    \ not included as an experimental baseline?\n5. What happens to coverage and MAE\
    \ if you use a measurement error model for e_ij by default rather than treating\
    \ them as fixed?\n\n### R1 Scores\n- **Soundness**: 5/10\n- **Experimental Quality**:\
    \ 5/10\n- **R1 Overall**: 5/10\n- **Confidence**: 4/5\n\n---\n\n## R2: Novelty\
    \ & Related Work\n\n### Strengths\n\n1. **Problem framing fills a genuine gap.**\
    \ Detection methods flag contamination but don't calibrate scores. IRT methods\
    \ evaluate models but ignore contamination. Mitigation methods fail (Dong et al.\
    \ ICML 2025). The paper correctly identifies this gap and proposes the first framework\
    \ that bridges contamination detection and psychometric calibration.\n\n2. **Bayesian\
    \ uncertainty propagation is principled.** Unlike point-estimate approaches (remove-and-rescore,\
    \ linear regression), ContamCal provides calibrated credible intervals that naturally\
    \ widen when signal quality degrades. This is the paper's strongest conceptual\
    \ contribution — the value of honest uncertainty.\n\n3. **Signal survival heatmap\
    \ is a genuinely new and useful contribution.** The finding that RL post-training\
    \ causes cliff-like (not gradual) degradation of embedding and logit-based detection\
    \ signals, while Self-Critique partially survives, is empirically novel and has\
    \ immediate practical implications. This should be elevated to a primary contribution.\n\
    \n4. **Identifiability analysis defines operational boundaries.** Rather than\
    \ claiming universal applicability, the paper explicitly maps where calibration\
    \ is reliable (AUC ≥ 0.70, N ≥ 20 with GP, SFT regime) and where it is not. This\
    \ is scientifically mature framing.\n\n5. **Honest scope limitation strengthens\
    \ credibility.** The paper does not overclaim. Acknowledging 89% coverage, 17pp\
    \ RL CIs, and 14% margins is more trustworthy than inflated claims would be.\n\
    \n### Weaknesses\n\n1. **Limited methodological novelty.** The core model (Eq.\
    \ 2) adds a single linear covariate γ_j · e_ij to a standard 4PL IRT model. This\
    \ is a minimal extension of Eckerly (2017) and Sinharay (2017), adapted to the\
    \ LLM setting with three structural changes that are individually straightforward:\n\
    \   - Independent examinees → single model with joint item distribution (a modeling\
    \ choice, not an algorithmic contribution)\n   - Binary leakage → continuous exposure\
    \ scores (replacing a binary indicator with a continuous one)\n   - Stable ability\
    \ → regime-conditional ability (acknowledged but not fully modeled — the paper\
    \ handles this by switching between 2-signal and 4-signal modes rather than modeling\
    \ regime as a covariate)\n\n   RRF is an off-the-shelf IR technique (Cormack et\
    \ al. 2009) applied without modification. The ΔAUC of +0.03 over the best single\
    \ signal raises the question of whether multi-signal aggregation adds meaningful\
    \ value.\n\n2. **Severely inadequate related work.** Only 10 references is far\
    \ below AAAI standards (typically 30–50). Critical missing citations include:\n\
    \   - **IRT for LLMs**: Lalor et al. (AAAI 2024, \"Benchmarking LLMs via IRT\"\
    ), which is highly relevant and published at the target venue\n   - **Contamination\
    \ detection**: Only 4 methods cited; missing CDD (Oren et al. 2023), membership\
    \ inference approaches, n-gram overlap variants, and the broader detection survey\
    \ literature\n   - **Contamination-resistant evaluation**: LiveBench, private\
    \ evaluation paradigms, dynamic benchmarking approaches — these represent alternative\
    \ solutions to the same problem\n   - **Bayesian IRT**: The Stan/PyMC IRT literature,\
    \ Bayesian psychometrics references\n   - **LLM evaluation at scale**: Papers\
    \ on benchmark design, scaling laws for evaluation, evaluation methodology surveys\n\
    \   - **DCR/Balachandran et al. [6]**: Cited but inadequately discussed. As the\
    \ most directly comparable work (contamination calibration for ranking), it deserves\
    \ detailed differentiation and experimental comparison.\n\n3. **Balachandran et\
    \ al. [6] is the elephant in the room.** This paper on \"Data contamination calibration\
    \ for ranking LLMs\" is cited once but never experimentally compared. The related\
    \ work section does not explain how ContamCal differs from or improves upon DCR.\
    \ This is a critical omission — a reviewer familiar with [6] would immediately\
    \ ask why it's not a baseline.\n\n4. **Contribution framing is misaligned.** The\

  analysis: 2-signal mode functional但clearly inferior。29% MAE degradation是 "graceful
    degradation"的上限——再去掉一个信号(1-signal)会cross usability boundary。论文framing：2-signal
    mode作为"accessible fallback for closed-weight evaluation, with explicit performance
    penalty disclosure"。 不应claim 2-signal mode等效于4-signal。 建议在paper中加warning box："2-signal

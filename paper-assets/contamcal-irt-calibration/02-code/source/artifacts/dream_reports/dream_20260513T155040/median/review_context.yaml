  result_rationale: 'Median档2-signal degradation约29%相对MAE增加，在[0.15, 0.35]范围中段。 Composite
    AUC从0.78降至0.70——恰好在identifiability threshold边缘。 MAE从4.2升至5.4pp——仍然functional但不impressive。

    降级对HumanEval打击最大(5.6→6.8pp)因为code benchmarks的两个surviving signals 都最弱(ConStat和Self-Critique在HumanEval
    AUC最低)。MMLU降级最小(3.4→4.3pp) 因为即使只用两个信号MMLU的MC格式仍提供较好的ConStat performance gap。

    Coverage从0.89降至0.85——低于nominal但仍>0.80。CI从10.8宽到13.8pp—— 接近"不太有用"的boundary(15pp)但还没到。

    Kendall τ降至0.68——model ranking reliability受影响，3-4个model pairs可能错序。 这限制了2-signal
    mode在competitive benchmarking(排名靠前的模型精确排序) 中的应用，但对"flagging severely contaminated
    models"仍有价值。

    '

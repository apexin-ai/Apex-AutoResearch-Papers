narrative_guidance: 'Claims需要降级修饰。Claim 1加条件限定："在检测信号AUC≥0.70的SFT regime下有效校准"， 不再claim跨regime通用性。Claim
  2从"outperforming any single signal"弱化为 "robust aggregation with graceful degradation"，重心移向鲁棒性而非优越性。
  Claim 3的RL部分从"appropriately wider intervals"改为诚实承认CIs过宽时的实用性边界， 用simulation identifiability
  bounds来定义"minimum useful signal quality"。 需要补充实验：(a) exp-011 few-examinee regime证明Growing
  Pains预估策略能改善小样本表现， (b) exp-010 prior sensitivity证明结果非prior-driven。 论文叙事从"general
  calibration framework"调整为"principled calibration under sufficient signal quality,
  with explicit identifiability guarantees"。 仍投AAAI，但方法论贡献权重从calibration accuracy转向identifiability
  analysis。

  '

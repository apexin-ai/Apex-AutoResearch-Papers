    for 3 strategies, showing consistent calibration advantage across k=3,5,7,10.'
  - 'Figure S5: Observational γ forest plot overlaid on controlled γ estimates. Direction
    consistent, CIs wider. Gray band = controlled 95% CI.'
  analysis: 'The RL observational case study provides three key contributions: (1)
    directional consistency confirms the characterization framework generalizes beyond
    controlled SFT, (2) expected regret reduction demonstrates practical value even
    with noisy signals, (3) specificity check validates that ContamCal produces null
    results on clean benchmarks. The wider CIs and non-significance of individual
    γ estimates are honest — we frame this as "directional external validity" not
    "quantitative confirmation." DeepSeek-R1 results motivate future work on RL-contamination
    interaction. Coverage degradation (0.67→0.53) when adding observational data is
    a limitation, attributed to heterogeneity from mixing controlled and observational
    designs.

    '

  result_rationale: 'At 7B, the model has sufficient capacity that LoRA SFT contamination
    barely perturbs benchmark performance. The mechanism:

    (1) MMLU shows <1pp change across dosages. The 7B model already encodes the factual
    knowledge tested by MMLU; re-exposure via SFT paraphrases is redundant. The STEM
    gradient (Math > Science >> CS_Eng) likely still exists at 7B but with attenuated
    magnitudes (STEM_Math γ might be +0.3 instead of +0.97 at 0.5B-3B), making domain-level
    γ harder to detect at 7B alone.

    (2) ARC shows very mild forgetting (-0.9pp at d100). This is notable: the forgetting
    DIRECTION persists at 7B (negative delta), confirming ARC forgetting is a benchmark
    property not solely a small-model capacity artifact. But the magnitude is within
    noise for a single seed. The 2PL+γ pooled fit at N=24 (1.5B+3B+7B, D045 excludes
    0.5B) shows ARC γ=+0.52 — still positive because the very mild 7B forgetting is
    offset by 3B near-zero effects. The NEGATIVE ARC γ from best tier targets requires
    cross-family pooling (exp-014).

    (3) GSM8K remains null (+0.7pp, within noise). Open-ended format resistance is
    scale-independent, as predicted. The pooled N=32 2PL+γ narrows the CI ([-0.28,
    0.38] vs [-0.36, 0.49] at N=24), further confirming the null.

    (4) HumanEval shows moderate dose-response (+2.5pp at d100). At 7B, code generation
    benefits from exposure to coding patterns in contamination data, but less dramatically
    than at 1.5B (+17.7pp). This suggests HumanEval contamination sensitivity is also
    scale-modulated but in the opposite direction from ARC — consistent with the "benchmark-dependent
    direction" framing.

    (5) Signal behavior: S1 remains reliable (AUC=0.97) because embedding similarity
    is architecture- and scale-agnostic. S2 Min-K++ reversal attenuates at 7B (Cohen''s
    d = -0.42 vs -1.98 at 0.5B) — larger models have more distributed representations,
    so perplexity-based signals are less directionally misleading but still near-chance
    for discrimination. S4 Self-Critique shows marginal improvement (0.53 vs 0.48
    at 0.5B) — larger models can better self-assess, but the effect is modest.

    (6) Coverage: Increasing N from 16→24 (ARC/MMLU) and 24→32 (GSM8K) provides moderate
    improvement. GSM8K at N=32 reaches 0.688, approaching the best tier target of
    0.60-0.75. ARC remains at 0.625 due to model specification issues (2PL+γ positive
    γ). The best tier''s coverage_95_at_n24 ∈ [0.60, 0.75] is met by GSM8K and MMLU
    but ARC needs cross-family data to resolve the γ sign.

    '

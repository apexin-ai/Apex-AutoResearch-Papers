  result_rationale: 'At 72B, the model is near ceiling on most benchmarks, and contamination
    effects — if any exist from pre-training data overlap — are undetectable.

    (1) Accuracy near ceiling: 72B achieves 84.8% MMLU, 94.4% ARC, 91.6% GSM8K. These
    are near the practical ceiling for these benchmarks (human performance is ~89.8%
    MMLU, ~80% GSM8K-hard). At this performance level, any contamination inflation
    is small relative to genuine capability.

    (2) Low exposure scores: S1 exposure scores are 0.07-0.14 (vs 0.0-0.20 range in
    controlled SFT models). The 72B model''s training data likely includes some benchmark-adjacent
    material through natural web crawl, producing mild S1 similarity. But these scores
    are comparable to d000 (clean) controlled models, so the IRT model correctly treats
    72B as a low-exposure data point.

    (3) Negligible calibration deltas: ARC +0.4pp (mild positive correction from the
    forgetting model — the IRT model slightly "un-forgets" for 72B, consistent with
    the negative γ meaning lower-exposure models have slightly higher true ability
    than observed). MMLU -0.5pp (mild STEM inflation correction consistent with positive
    MMLU γ). GSM8K unchanged (null γ means no adjustment).

    (4) Value as high-θ anchor: The IRT model benefits from a wider ability distribution
    (0.5B low-ability through 72B high-ability). The 72B data point helps anchor item
    difficulty parameters at the high end, improving estimation precision for all
    models. This is analogous to including very high-ability examinees in educational
    testing — they provide information about difficult items that lower-ability examinees
    cannot. Kendall''s τ improves from 0.82 to 0.84 due to better separation at the
    high end of the ability distribution.

    (5) Coverage marginal improvement: 0.67→0.68 (adding 1 data point to N≈30 has
    minimal impact on coverage). The value is not statistical power but ecological
    validity at frontier scale.

    (6) Inference cost: ~12 GPU-hours for evaluating 72B on 4 benchmarks plus computing
    3 signals on all items. Dominated by S2 Min-K++ which requires full forward passes
    on ~16K items.


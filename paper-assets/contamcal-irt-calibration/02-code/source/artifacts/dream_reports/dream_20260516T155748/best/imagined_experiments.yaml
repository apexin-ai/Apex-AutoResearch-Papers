  result_rationale: 'Cross-family validation is the most consequential planned experiment.
    It elevates the characterization framework from "Qwen-specific observation" to
    "general benchmark property." Here''s why each result is expected:

    (1) Llama-3.2-3B ARC forgetting (-4.7pp at d100): Llama-3.2-3B has a lower ARC
    baseline (0.742 vs Qwen2.5-3B 0.824) and a different architecture (grouped-query
    attention, different tokenizer). The lower baseline means the model has less headroom
    — SFT contamination competes with limited capacity for science reasoning, producing
    more pronounced forgetting than Qwen2.5-3B (-0.3pp). This is the critical mechanism:
    at equivalent parameter count, models with less task-specific capacity show stronger
    forgetting, and the forgetting DIRECTION is preserved regardless of architecture.
    The raw -4.7pp delta provides direct evidence for ARC forgetting as a benchmark
    property.

    (2) Llama-only IRT (N=6): γ=-1.65 but wide CI crossing zero. N=6 is too small
    for significance — this is expected from exp-004 simulations showing N≥50 for
    reliable recovery. However, the point estimate''s SIGN is negative, directionally
    consistent with Qwen results. The value is the sign, not the significance.

    (3) Pooled cross-family 4PL+γ (N=30): This is where best tier is achieved. Adding
    Llama data (with genuine ARC forgetting) to Qwen data (with near-flat ARC at 1.5B+/3B)
    produces a negative pooled γ=-1.18 because the Llama points pull the estimate
    negative while 7B and 3B Qwen points sit near zero. The 4PL+γ model (appropriate
    for MCQ) with S1-only exposure (the reliable signal) produces CI=[-2.25, -0.15]
    that excludes zero. This is within the best tier target range of [-2.5, -0.8].

    (4) STEM gradient replication: Llama STEM_Math γ=0.73 (Qwen: 0.97) — same positive
    direction, slightly smaller magnitude. The gradient Math > Science > CS_Eng is
    preserved: 0.73 > 0.56 > 0.08. Math CI excludes zero; Science borderline; CS_Eng
    null. The direction match across families (both showing Math > Science >> CS_Eng
    ≈ 0) is strong evidence that contamination susceptibility maps to factual knowledge
    density, a property of the benchmark items, not the model. Lower Llama magnitudes
    reflect: (a) different pre-training distribution (less MMLU-adjacent data in Llama''s
    pre-training), (b) different SFT dynamics (Llama''s architecture processes paraphrases
    differently), but (c) the same underlying susceptibility gradient determined by
    item characteristics.

    (5) GSM8K null replication: γ=0.12, CI firmly crossing zero. Open-ended format
    resistance is architecture-independent because the mechanism is format-driven:
    chain-of-thought generation cannot be boosted by memorizing answer templates.
    This holds across model families.

    (6) Signal behavior: S1 embedding AUC=0.96 (Llama) — sentence-transformer similarity
    is model-agnostic, confirming S1''s robustness. S2 Min-K++ reversal replicates
    (Cohen''s d=-1.45) because the reversal is driven by small-model memorization
    dynamics that alter perplexity in the opposite-to-expected direction, a phenomenon
    shared across architectures at comparable scale.

    (7) IRT vs linear regression (bootstrap p=0.032): With cross-family N=30 and the
    4PL+γ model, ARC IRT MAE=0.028 vs linear regression MAE=0.048. The bootstrap test
    is significant because IRT captures the nonlinear relationship between ability,
    contamination, and item difficulty that linear regression misses — specifically,
    the c/d parameters of 4PL model the guessing and ceiling effects in MCQ that produce
    heteroscedastic residuals. At N=30, the IRT advantage is large enough to be statistically
    distinguishable.

    (8) Calibration gating: ARC passes (γ significant, PPP in range, cal MAE < raw
    MAE). MMLU-STEM domains pass at the domain level (STEM_Math γ significant across
    both families). GSM8K correctly gated out (γ null). This yields 2 benchmarks (of
    3 main) passing gating, within the best tier target of 2-3.

    '

    (1) ContamCal''s calibration quality degrades gracefully with signal quality —
    not a fragile system that fails silently, but one that correctly self-assesses
    via the gating criterion. (2) S1 embedding similarity is structurally necessary
    for current-generation contamination detection in IRT. (3) The closed-weight gap
    motivates future work on API-compatible detection signals. The paper notes that
    at larger scales (7B+), S4 shows mild differentiation potential (exp-008: delta≈0.08
    MMLU Instruct vs SFT), suggesting 2-signal mode MAY become viable for closed-weight
    models at frontier scale — flagged as future work.'

  description: 'Degraded 2-signal mode using only S2 (Min-K++) and S4 (Self-Critique)
    — the signals that don''t require model weight access. Tests whether ContamCal
    is applicable to closed-weight/API-only models. Compares against full pipeline
    (effectively S1-only given S2/S4 ineffectiveness).

    '

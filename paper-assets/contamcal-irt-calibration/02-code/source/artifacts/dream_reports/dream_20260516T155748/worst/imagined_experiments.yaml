    of the ability distribution contributes <2% of total I(γ) — the model is an outlier
    in θ-space, and its influence on the γ posterior is dominated by the prior and
    the existing data points.

    S1 detection degrades to AUC=0.67 because the 72B model''s pretraining corpus
    is so extensive that most benchmark items have high embedding similarity to some
    training content — the baseline "contamination score" is uniformly elevated, reducing
    discriminative power. Without logprob access (prohibitive at 72B scale), S2 Min-K++
    cannot be computed. S4 Self-Critique is at chance (0.53) because the 72B model''s
    confidence is well-calibrated from RLHF, obscuring the entropy-based contamination
    signal.

    Adding 72B to the pool doesn''t meaningfully change any γ estimate (Δγ < 0.01
    on ARC) because the model sits at θ >> other models, in a region where item response
    functions are flat (P(correct) ≈ 1 for most items regardless of contamination).
    The model provides no leverage for estimating γ. Coverage paradoxically worsens
    slightly (35% → 32%) because the additional model increases posterior concentration
    without improving calibration of the CIs.

    '
  tables:
  - 'Table: 72B accuracy alongside 0.5B/1.5B/3B/7B for scale comparison. Shows monotonic
    increase, 72B near ceiling on ARC/GSM8K.'
  - 'Table: γ estimates with/without 72B in the pool. Columns: benchmark, γ_without,
    γ_with, Δγ, CI_width_change. Shows negligible change.'
  figures_description:
  - 'Extended scale plot: |γ| vs log(parameters). Points at 0.5B/1.5B/3B/7B/72B. Clear
    exponential decay toward zero, asymptoting by 7B. 72B indistinguishable from zero.'
  analysis: 'Capstone for the scale-dependency narrative. At frontier scale: (a) contamination
    effects are empirically undetectable in accuracy, (b) detection signals degrade
    below identifiability thresholds, (c) adding a single 72B model to IRT provides
    essentially zero information gain. The impossibility is triply confirmed: Fisher
    Information analysis from exp-004 predicts this theoretically, and the 72B observation
    confirms it empirically.

    For the diagnostic paper: "Current LLM evaluation operates in a regime where the
    models most likely contaminated (frontier, trained on massive web corpora) are
    precisely those where calibration is provably infeasible. The models least likely
    to need calibration (small, limited pretraining) are the only ones where our methods
    produce detectable effects — but those effects are confounded with capacity artifacts
    (Concern #22). This catch-22 is the fundamental structural barrier to post-hoc
    contamination calibration."

    '

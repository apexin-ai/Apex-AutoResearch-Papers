    - -0.62
    - 0.32
    arc_gamma_ci_excludes_zero: false
    mmlu_gamma_7b: 0.04
    mmlu_gamma_7b_ci:
    - -0.41
    - 0.49
    mmlu_gamma_ci_excludes_zero: false
    gsm8k_gamma_7b: 0.09
    gsm8k_gamma_7b_ci:
    - -0.48
    - 0.66
    gsm8k_gamma_ci_excludes_zero: false
    mmlu_stem_math_gamma_7b: 0.12
    mmlu_stem_math_gamma_7b_ci:
    - -0.55
    - 0.79
    s1_auc_d005_7b: 0.97
    s2_cohens_d_d100_7b: -0.35
    s4_auc_d005_7b: 0.52
    coverage_95_7b: 0.3
    calibrated_mae_arc: 0.011
    raw_mae_arc: 0.008
    calibrated_mae_mmlu: 0.008
    raw_mae_mmlu: 0.003
    calibrated_mae_gsm8k: 0.012
    raw_mae_gsm8k: 0.005
    irt_worse_than_raw_all_benchmarks: true
    linear_regression_mae_arc: 0.007
    irt_vs_linear_p: 0.62
    kendall_tau_7b: 0.58
    ppp_arc: 0.85
    ppp_gsm8k: 0.42
    ppp_mmlu: 0.65
  result_rationale: 'At 7B, the model has sufficient pretraining capacity that benchmark
    content is already well-represented in model weights. SFT contamination injection
    produces near-zero accuracy change: the ARC forgetting effect that was -17pp at
    0.5B and ~-1pp at 3B attenuates to <1pp noise at 7B. This follows the scale-attenuation
    pattern already visible in existing data (0.5B: -17pp, 1.5B: -0.3pp, 3B: -0.7pp).
    All benchmark γ CIs include zero — there is no statistically detectable contamination
    effect at 7B within our dosage range. Even MMLU STEM_Math, which showed γ=+0.97
    in the pooled 0.5B/1.5B/3B analysis, drops to γ=0.12 at 7B because the model already
    saturates factual-knowledge items. S1 embedding similarity still detects contaminated
    items (AUC=0.97) because paraphrases have genuinely different surface forms, but
    this detection has zero downstream utility — contamination doesn''t affect scores.
    S2 (Min-K++) shows mild reversal (d=-0.35), confirming the directional reversal
    extends to larger scales but with attenuated magnitude. IRT calibration produces
    MAE 1.4-2.4× worse than raw scores on all benchmarks because the model is fitting
    noise in γ that doesn''t correspond to real contamination effects. Linear regression
    matches IRT (p=0.62 on bootstrap test). This creates the worst-case paradox: detection
    works but calibration is unnecessary; calibration is needed only where it can''t
    work (small models).

    '
  tables:
  - 'Table: Dosage × accuracy across all scales (0.5B/1.5B/3B/7B × d000-d100). Shows
    monotonic attenuation of contamination effect with scale. 7B row is essentially
    flat within noise (σ ≈ 0.003 across seeds).'
  - 'Table: γ estimates and 95% CIs by scale and benchmark. Forest-plot data. Only
    0.5B shows γ CI excluding zero (ARC). 3B borderline. 7B all include zero.'
  - 'Table: Calibration vs raw MAE at 7B. All benchmarks: calibrated MAE > raw MAE.
    IRT adds noise, doesn''t correct it.'
  figures_description:
  - 'Scale × dosage heatmap: |Δaccuracy| (absolute accuracy change from d000) colored
    by magnitude. Clear gradient from red (0.5B, up to 17pp) through yellow (1.5B/3B,
    0-3pp) to green (7B, <1pp).'
  - 'γ forest plot: 4 rows (0.5B/1.5B/3B/7B) × 3 columns (ARC/GSM8K/MMLU). CIs narrow
    with scale but center migrates toward zero. Visual demonstrates that significant
    γ exists only in the capacity-limited regime.'
  analysis: 'Devastating for the calibration claim but provides a clean structural
    insight for the diagnostic paper. Contamination effects are scale-dependent with
    a critical threshold around 1-3B parameters. Below: catastrophic capacity displacement
    where γ captures SFT artifacts, not contamination per se. Above: near-immunity
    where γ ≈ 0 regardless of dosage. This is a genuine impossibility result: IRT
    γ calibration is unreliable precisely where contamination matters most (small
    models, where effects are large but confounded with capacity) and unnecessary
    where it works cleanly (large models, where effects are negligible). The paper
    reframes this as a structural insight about the LLM evaluation ecosystem: "benchmark
    contamination is primarily a small-model problem, but small models are precisely
    where calibration methods fail."

    '
- name: multi_family_validation
  plan_id: exp-014
  description: 'Controlled SFT injection on Llama-3.2-3B at 3 dosage levels (d000/d025/d100),
    seed 42. Tests whether contamination susceptibility patterns (ARC forgetting,
    MMLU STEM gradient, GSM8K resistance) generalize beyond Qwen2.5 or are model-family-specific
    artifacts. Includes per-domain MMLU γ analysis to test whether the STEM gradient
    replicates cross-family.

    '
  expected_results:
    llama_mmlu_d000: 0.455
    llama_mmlu_d025: 0.448
    llama_mmlu_d100: 0.441
    llama_mmlu_delta_d100: -0.014
    llama_arc_d000: 0.52

    llama_arc_d100: 0.528
    llama_arc_delta_d100: 0.008
    llama_gsm8k_d000: 0.35
    llama_gsm8k_d025: 0.36
    llama_gsm8k_d100: 0.38
    llama_gsm8k_delta_d100: 0.03
    llama_humaneval_d000: 0.12
    llama_humaneval_d100: 0.15
    llama_arc_gamma: 0.22
    llama_arc_gamma_ci:
    - -0.65
    - 1.09
    llama_arc_gamma_ci_excludes_zero: false
    llama_mmlu_gamma: -0.18
    llama_mmlu_gamma_ci:
    - -0.92
    - 0.56
    llama_gsm8k_gamma: 0.35
    llama_gsm8k_gamma_ci:
    - -0.48
    - 1.18
    llama_mmlu_stem_math_gamma: 0.08
    llama_mmlu_stem_math_ci:
    - -0.85
    - 1.01
    llama_mmlu_stem_science_gamma: -0.22
    llama_mmlu_stem_science_ci:
    - -1.1
    - 0.66
    llama_mmlu_stem_cs_eng_gamma: 0.41
    llama_mmlu_stem_cs_eng_ci:
    - -0.55
    - 1.37
    qwen_stem_ranking: Math(+0.97) > Science(+0.84) >> CS_Eng(+0.20)
    llama_stem_ranking: CS_Eng(+0.41) > Math(+0.08) > Science(-0.22)
    stem_ranking_match: false
    cross_family_gamma_rank_tau_all_benchmarks: 0.15
    cross_family_gamma_rank_tau_p: 0.55
    cross_family_stem_gamma_rank_tau: -0.33
    cross_family_stem_gamma_rank_tau_p: 0.6
    s1_auc_llama_d005: 0.95
    s2_cohens_d_llama_d100: -1.55
    s4_auc_llama_d005: 0.5
    arc_forgetting_replicates: false
    arc_direction_qwen: negative (forgetting)
    arc_direction_llama: positive (mild inflation, not significant)
    position_bias_llama_d100: A=42% (mild, vs Qwen 0.5B A=98%)
    n_models_pooled_llama: 3
  result_rationale: 'Llama-3.2-3B at 3B parameters has comparable scale to Qwen2.5-3B
    but fundamentally different architecture (grouped-query attention, different tokenizer,
    different pretraining data mix). The worst-tier prediction is that contamination
    susceptibility patterns are model-family-specific, not benchmark-intrinsic properties.

    ARC direction reversal: Qwen2.5 shows consistent ARC forgetting (γ<0, three independent
    evidence chains at 0.5B). Llama-3.2-3B shows mild positive γ (+0.22) on ARC —
    the SFT contamination slightly helps rather than hurts, because Llama''s weaker
    ARC baseline (0.52 vs Qwen''s 0.83) means it has more room for memorization to
    add marginal accuracy. The forgetting mechanism at 0.5B Qwen was capacity displacement
    + position bias; at 3B Llama, the model has enough capacity to absorb the SFT
    data without displacement, and its lower baseline means memorization of ARC science
    items genuinely helps. The γ CI includes zero (N=3 models) so neither direction
    is statistically confirmed.

    STEM gradient contradiction: Qwen showed Math(+0.97) > Science(+0.84) >> CS_Eng(+0.20),
    interpreted as "factual knowledge density drives contamination susceptibility."
    Llama shows CS_Eng(+0.41) > Math(+0.08) > Science(-0.22) — a completely different
    ordering. This occurs because Llama''s pretraining data mix has different domain
    coverage: Llama-3.2 was trained with more code/engineering data (Meta''s emphasis),
    so CS_Eng items are more affected by contamination (the model has stronger prior
    on these items, and SFT exposure reinforces rather than displaces). Math/Science
    items where Llama''s prior is weaker don''t benefit from paraphrase exposure because
    the model lacks the substrate to leverage memorized patterns. All individual domain
    γ CIs include zero at N=3, making none individually significant — but the ranking
    contradiction is qualitatively clear.

    Cross-family Kendall τ on benchmark-level γ ranking is 0.15 (p=0.55), and on STEM
    domain-level γ ranking is -0.33 (p=0.60) — both non-significant, with the domain-level
    actually negative (anti-correlated). This destroys the "benchmark × domain property"
    interpretation from Claim 1.

    S1 embedding similarity still works for detection (AUC=0.95) because it''s architecture-agnostic
    (uses external sentence-transformer, not model''s own embeddings). S2 Min-K++
    shows directional reversal (d=-1.55), replicating across families — this is the
    salvageable finding. S4 Self-Critique is at chance (0.50) because Llama-3.2-3B''s
    instruction-following is weaker than Qwen''s, degrading the self-critique signal.

    '
  tables:
  - 'Table: Llama-3.2-3B vs Qwen2.5-3B accuracy by dosage and benchmark. Shows Llama
    ARC goes UP with contamination (mild inflation) while Qwen goes DOWN (forgetting).
    GSM8K both positive. MMLU both mildly negative.'
  - 'Table: Per-domain MMLU γ comparison — Qwen ordering vs Llama ordering. Three
    columns: domain, Qwen γ (N=23), Llama γ (N=3). Shows contradictory rankings.'
  - 'Table: Cross-family Kendall τ correlations with p-values for (a) benchmark-level
    γ ranking, (b) STEM domain-level γ ranking. Both non-significant.'
  figures_description:
  - 'Paired forest plot: Qwen γ (left, N=23, tight CIs) vs Llama γ (right, N=3, wide
    CIs) by benchmark. ARC shows opposite sign. Visual immediately conveys family-specificity.'
  - 'STEM domain γ ranking comparison: parallel coordinates plot connecting Math/Science/CS_Eng
    γ values for Qwen vs Llama. Lines cross, showing contradictory orderings.'
  analysis: 'This is the single most damaging experiment for the worst-tier narrative.
    It reduces Claim 1 (domain-dependent contamination characterization) from "benchmark
    × domain property" to "Qwen-specific observation." The STEM gradient cannot be
    presented as a general finding about contamination susceptibility if it reverses
    under a different model family. The ARC forgetting direction reversal further
    undermines the three-regime taxonomy.

    Salvageable elements: (1) Min-K++ reversal replicates across families (d=-1.55),
    confirming it''s a scale × method phenomenon, not Qwen-specific. (2) S1 detection
    generalizes (AUC=0.95). (3) The family-specificity itself becomes a contribution:
    "contamination effects are family × scale × benchmark specific, making universal
    calibration provably infeasible" — this strengthens the impossibility framing.

    Paper must honestly downgrade: "Domain-level contamination heterogeneity was observed
    within the Qwen2.5 family (Simpson''s paradox, STEM gradient). However, cross-family
    validation with Llama-3.2-3B revealed a different domain ordering, suggesting
    these patterns may be model-family-specific rather than intrinsic benchmark properties.
    We report this as a negative result that highlights the complexity of contamination
    dynamics."

    '
- name: rl_observational_case_study
  plan_id: exp-009
  description: 'Apply ContamCal pipeline to RL/instruction-tuned models: Qwen2.5-Instruct
    (0.5B/1.5B/3B/7B), DeepSeek-R1-Distill-1.5B/7B. Observational study with no ground-truth
    contamination labels. Expected regret quantification comparing uncalibrated vs
    calibrated model selection. Near-zero γ check on known-clean benchmark for specificity
    validation.

    '
  expected_results:
    qwen_instruct_05b_mmlu: 0.246
    qwen_instruct_05b_arc: 0.282
    qwen_instruct_05b_gsm8k: 0.388
    qwen_instruct_15b_mmlu: 0.578

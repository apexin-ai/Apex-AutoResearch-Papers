tier: worst
narrative_guidance: 'Reframe entirely as diagnostic framework paper. Lead: "We built
  ContamCal to calibrate contaminated benchmarks — and discovered why this is harder
  than expected." Three diagnostic contributions survive intact regardless of calibration
  failure: (1) Min-K++ directional reversal is a standalone cautionary finding for
  the detection community — the most widely-used signal actively misleads at small
  scales, (2) Fisher Information identifiability analysis reveals a structural domain-method
  mismatch — IRT requires N≥50 examinees but LLM evaluation operates at N=8-30, making
  reliable γ recovery impossible in typical settings, (3) contamination effects are
  benchmark-dependent (ARC forgetting vs GSM8K resistance confirmed within Qwen),
  but domain-level heterogeneity within MMLU may be model-family-specific (honest
  negative result). Calibration gating criterion itself becomes a contribution: ContamCal
  identifies WHEN calibration should not be attempted. Coverage collapse is reframed
  as fundamental limitation of applying IRT to LLMs (local independence violation
  + low N), not a fixable engineering problem. Position paper angle: "Benchmark contamination
  calibration is an open problem — here''s why, and here are the identifiability boundaries."

  '
imagined_experiments:
- name: sft_d100_qc_only
  plan_id: exp-015
  description: '100% dosage SFT using only QC-pass paraphrases (7547/16697 items)
    on Qwen2.5-0.5B. Isolates noisy vs clean contamination confound. Compares IRT
    γ and accuracy against exp-001 d100 (all paraphrases including low-quality) to
    test whether contamination noise or model capacity drives the 0.5B catastrophic
    forgetting.

    '
  expected_results:
    mmlu_accuracy_d100_qc: 0.24
    arc_accuracy_d100_qc: 0.252
    gsm8k_accuracy_d100_qc: 0.358
    humaneval_pass1: 0.073
    mmlu_delta_vs_d100_all: 0.007
    arc_delta_vs_d100_all: -0.042
    gsm8k_delta_vs_d100_all: -0.007
    mmlu_delta_vs_d000: -0.158
    arc_delta_vs_d000: -0.217
    position_bias_A_pct_qc: 0.94
    position_bias_A_pct_all: 0.98
    gamma_qc_only: -0.85
    gamma_all_paraphrases: -1.21
    gamma_difference: 0.36
    gamma_diff_p_value: 0.28
    irt_mae_qc: 0.058
    irt_mae_all: 0.035
    linear_regression_mae_qc: 0.052
  result_rationale: 'At 0.5B, position bias amplification (D045: d000 A=46% → d100
    A=98%) is the dominant failure mode, not contamination quality. QC-filtered paraphrases
    have higher semantic fidelity (cosine>0.85, BLEU<0.3) but the 0.5B model cannot
    exploit semantic content — it learns surface formatting patterns regardless of
    paraphrase quality. The QC-only vs all-paraphrase accuracy difference is <1pp
    on MC benchmarks because the underlying mechanism (SFT displacing the model''s
    weak prior representations, Concern #22) operates at the capacity level, not the
    noise level. γ estimates differ slightly (QC=-0.85 vs all=-1.21) because QC-only
    has fewer training items (7547 vs 16697) → weaker SFT signal → less position bias
    amplification → slightly less forgetting. But this difference is not statistically
    significant (p=0.28) given the wide CIs at N=4-8 models. The experiment is a null
    result that confirms 0.5B exclusion: even "perfect" contamination injection cannot
    produce interpretable IRT signal at sub-1B scale because the capacity artifact
    confounds γ estimation.

    '
  tables:
  - 'Table: QC-only vs All-paraphrase accuracy at 0.5B d100 (MMLU, ARC, GSM8K, HumanEval).
    Columns: benchmark, d000 baseline, d100-all, d100-qc, Δ(qc-all). Shows <1pp difference
    on MC benchmarks. GSM8K (free-form) unaffected by either variant.'
  - 'Table: Position bias (% answer A) by condition. d000/d100-all/d100-qc. Shows
    QC-only slightly less biased (94% vs 98%) but both catastrophically biased vs
    d000 baseline (46%).'
  figures_description:
  - 'Grouped bar chart: d000 vs d100-all vs d100-qc accuracy across 4 benchmarks.
    Both d100 variants collapse equally on MMLU/ARC, GSM8K flat. Demonstrates capacity
    artifact, not contamination quality.'
  analysis: 'Null result. QC filtering does not rescue the 0.5B IRT signal. The capacity
    displacement is indistinguishable from general catastrophic forgetting regardless
    of contamination fidelity. This formally supports the paper''s worst-case framing:
    contamination detection/calibration requires minimum model capacity (~1B parameters),
    below which SFT-based injection produces artifacts that confound IRT γ estimation.
    Combined with 0.5B exclusion decision (D045), this reduces the effective analysis
    to 1.5B/3B models only, halving the examiner pool and further undermining identifiability
    (N drops from ~24 to ~16 per scale).

    '
- name: scale_bridging_7b
  plan_id: exp-007
  description: 'Qwen2.5-7B controlled SFT injection at 5 dosage levels (d000/d005/d025/d050/d100).
    Validates whether contamination effects and IRT γ persist at production scale.
    15 SFT runs (5 dosages × 3 seeds) requiring multi-GPU LoRA training.

    '
  expected_results:
    arc_accuracy_d000: 0.878
    arc_accuracy_d005: 0.876
    arc_accuracy_d025: 0.874
    arc_accuracy_d050: 0.872

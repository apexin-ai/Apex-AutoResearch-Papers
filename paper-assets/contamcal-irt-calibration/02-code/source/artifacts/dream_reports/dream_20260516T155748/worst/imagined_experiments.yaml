  result_rationale: 'S2 (Min-K++) and S4 (Self-Critique) were both near chance at
    all scales in exp-008: S2 AUC=0.465 (with directional reversal at d100, Cohen''s
    d=-1.98), S4 AUC=0.481 at 0.5B. At 1.5B/3B the situation is marginally better
    but still sub-threshold (S2 ~0.52, S4 ~0.51 extrapolated from signal survival
    analysis patterns). RRF over two near-chance signals produces composite AUC ≈
    0.51-0.54, well below the exp-004 identifiability threshold.

    At AUC ≈ 0.52, the exposure scores are essentially random with slight signal.
    The IRT model receives near-uniform exposure across items and cannot distinguish
    contaminated from clean items. γ CI spans zero with width >2.8 on all benchmarks
    — the posterior is dominated by the prior N(0,1). Calibrated MAE is 2.4× worse
    than 4-signal because the model is fitting noise injected by the random exposure
    scores. Even linear regression with these garbage exposure features produces MAE=0.078
    (worse than 4-signal IRT) but better than 2-signal IRT (0.085), confirming that
    IRT''s complexity is harmful when inputs are noise.

    This proves the "4-signal pipeline is really a 1-signal pipeline (S1)" result
    explicitly: removing S1 collapses the entire framework. S1 requires model weights
    (embedding extraction). Therefore, ContamCal has zero practical applicability
    to closed-weight models — the most common deployment mode for frontier models
    (GPT-4, Claude, Gemini) that are most likely contaminated.

    '
  tables:
  - 'Table: Per-signal AUC by scale showing S2/S4 at chance. Columns: signal, 0.5B,
    1.5B, 3B. All S2/S4 entries ≈ 0.47-0.54.'
  - 'Table: 2-signal vs 4-signal pipeline comparison across all metrics. Columns:
    metric, 2-signal, 4-signal, degradation ratio.'
  figures_description:
  - 'Stacked AUC bar chart: 4-signal (dominated by S1 at 0.97) vs 2-signal (S2+S4
    at 0.51). Dramatic visual gap. Annotate: ''Without weight access, pipeline operates
    below identifiability threshold.'''
  analysis: 'Confirms ContamCal''s dependence on weight access. The method requires
    embedding- based detection (S1), which requires model weights. The closed-weight
    models most needing calibration (proprietary frontier models trained on undisclosed
    data) are precisely those where the method cannot work.

    For the diagnostic paper, this is another impossibility result that strengthens
    the overall narrative: "Post-hoc contamination calibration faces a triple impossibility:
    (1) it requires open-weight access that frontier models don''t provide, (2) it
    requires N≥50 comparable models that don''t exist for most model families, (3)
    even when both conditions are met, contamination effects are confounded with model
    capacity at the scales where calibration would matter most."

    The calibration gating criterion catches this: none of the 2-signal benchmarks
    pass gating (γ not significant, PPP extreme, calibrated MAE > raw MAE). So ContamCal
    correctly identifies "don''t calibrate" — the gating criterion is itself a contribution
    even when calibration fails.'

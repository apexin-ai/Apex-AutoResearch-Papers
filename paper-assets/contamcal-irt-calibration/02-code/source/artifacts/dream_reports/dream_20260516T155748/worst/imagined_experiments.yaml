    gsm8k_accuracy_d025: 0.785
    gsm8k_accuracy_d100: 0.787
    gsm8k_delta_d100_vs_d000: 0.005
    humaneval_d000: 0.305
    humaneval_d100: 0.354
    arc_gamma_7b: -0.15

  review_report: "---\ndream_id: dream_20260514T171536\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-14T18:35:54.299418+00:00\n---\n\n# Dream Review\
    \ Report: ContamCal\n\n**Paper**: ContamCal: Calibrating LLM Benchmark Scores\
    \ for Training Data Contamination via Contamination-Augmented Item Response Theory\n\
    **Review Mode**: Full (2 Reviewers, 4-Step Roundtable)\n**Date**: 2026-05-14\n\
    \n---\n\n## Roundtable Summary\n\n### Step 1: Independent Reviews\n- **R1 (Methods\
    \ + Experiments)**: 3/6 Weak Reject\n- **R2 (Novelty + Related Work)**: 3/6 Weak\
    \ Reject\n\n### Step 2: Cross-Sharing Key Observations\n\n**R1 → R2**: R1's detailed\
    \ analysis of N_models insufficiency (N≈15 cross-scale, N≈4 single-scale for 4PL+γ\
    \ fitting) and the exposure matrix rank-1 structure concern strengthen R2's novelty\
    \ skepticism — the full 4PL+γ machinery may not be identifiable in the actual\
    \ experimental regime, making the simpler 2PL+γ or linear regression baselines\
    \ more appropriate given available data.\n\n**R2 → R1**: R2's observation about\
    \ the ME model status (abandoned per internal project decision D013, yet presented\
    \ as a core contribution in Section 3.2/Eq. 3) explains the discrepancy R1 noted\
    \ between the claimed UQ methodology and the actual coverage results. If the \"\
    simple\" model without ME produced the reported 85% coverage, the paper's framing\
    \ of the measurement error model as distinctive is misleading.\n\n### Step 3:\
    \ Convergence\n\n**Full agreement on:**\n1. Marginal advantage over simple baselines\
    \ (4.3pp vs 4.8pp linear reg, overlapping CIs) — the headline MAE claim does not\
    \ differentiate ContamCal from simpler methods\n2. \"Multi-signal\" framing is\
    \ misleading — only S1 (embedding) works, RRF degrades performance vs S1-only\n\
    3. GSM8K format confound contaminates the one statistically significant γ estimate\n\
    4. Coverage gap (85% vs 95% nominal) undermines the UQ claim, which is supposed\
    \ to be the distinctive contribution\n5. Min-K++ directional reversal is a genuine,\
    \ independently valuable empirical finding\n6. Signal characterization across\
    \ scales is useful for the detection community\n7. Paper is well-written and admirably\
    \ honest about limitations\n8. Fisher Information analysis is the strongest theoretical\
    \ contribution\n\n**Productive disagreement resolved:**\n- R2 flagged extensive\
    \ \"placeholder text\" in the paper; however, the submitted PDF contains complete\
    \ tables and results. R2 appears to have been influenced by project source files\
    \ (LaTeX drafts with internal markers). The *submitted PDF* is complete. This\
    \ does not change the assessment of the results themselves.\n- R1 emphasized per-benchmark\
    \ γ_k is achieved via separate model fits (not a joint hierarchical model), which\
    \ R2 had implicitly treated as a joint model feature. Both agree this weakens\
    \ the \"per-benchmark heterogeneity\" claim — separate fits cannot formally test\
    \ heterogeneity or share information across benchmarks.\n\n### Step 4: Consolidated\
    \ Assessment\n\n---\n\n## Consolidated Scores\n\n| Criterion | Score | Justification\
    \ |\n|-----------|-------|---------------|\n| **Soundness** | 2/4 | Bayesian IRT\
    \ implementation is technically competent (HMC convergence diagnostics, proper\
    \ priors). But: (a) marginal and statistically indistinguishable advantage over\
    \ linear regression; (b) 10pp coverage gap undermines the UQ claim; (c) N_models\
    \ likely insufficient for reliable 4PL+γ identification; (d) GSM8K format confound\
    \ in the only significant γ estimate. |\n| **Presentation** | 3/4 | Well-structured,\
    \ clear mathematical exposition, comprehensive baselines, transparent limitations.\
    \ Loses a point for the mismatch between \"multi-signal framework\" framing and\
    \ single-signal operational reality, and for potential discrepancy between the\
    \ ME model prominence in methods and its actual role in reported results. |\n\
    | **Contribution** | 2/4 | Signal characterization (S1 robustness, Min-K++ reversal)\
    \ and Fisher Information analysis have genuine standalone value. But the IRT calibration\
    \ framework — the paper's primary contribution — shows only marginal improvement\
    \ over trivial baselines and limited novelty beyond applying established explanatory\
    \ IRT to a new domain. |\n| **Overall** | **3/6 (Weak Reject)** | Unanimous. |\n\
    | **Confidence** | 4/5 | Both reviewers conducted thorough analysis of the paper,\
    \ experimental context, and methodology. |\n\n---\n\n## Detailed Strengths\n\n\
    ### S1. Correct Problem Framing (both reviewers)\nThe pivot from contamination\
    \ elimination to statistical calibration is well-motivated. Emperor's New Clothes\
    \ (Xu et al., 2024) showed 20 mitigation strategies fail — the causal inference\
    \ analogy of measuring and adjusting confounders rather than eliminating them\
    \ is apt. The grounding in educational measurement's item compromise IRT (Eckerly\
    \ 2017, Sinharay 2017) is genuine and well-integrated.\n\n### S2. Signal Characterization\
    \ Is a Genuine Contribution (both reviewers)\nThe systematic signal×scale evaluation\
    \ revealing that only embedding similarity (S1) is reliable (AUC > 0.94 across\
    \ all scales and regimes) while S2-S4 fail is valuable empirical guidance for\
    \ the detection community. This finding is well-documented with appropriate statistical\
    \ rigor (AUC tables, Cohen's d, p-values).\n\n### S3. Min-K++ Directional Reversal\
    \ (both reviewers)\nThe finding that Min-K++ actively misleads (Cohen's d from\
    \ -1.0 to -2.7 across all scales) rather than merely failing is novel and practically\
    \ important. This challenges the assumption of \"graceful degradation\" and has\
    \ implications for any downstream system relying on Min-K++ as a contamination\
    \ indicator. This is perhaps the paper's most citation-worthy empirical finding.\n\
    \n### S4. Fisher Information Analysis (both reviewers)\nThe derivation of I(γ)\
    \ for the 4PL+γ model, the AUC-information relationship, and the measurement error\
    \ attenuation factor constitute genuine theoretical work. The distinction between\
    \ structural identifiability (AUC ≥ 0.55) and practical identifiability (AUC ≥\
    \ 0.80) is actionable.\n\n### S5. Honest Limitation Reporting (both reviewers)\n\
    The paper does not hide that: only S1 works, RRF degrades to S1-dominated mode,\
    \ the advantage over linear regression is marginal, observational results show\
    \ wide CIs with minimal correction, and the framework requires model weights.\
    \ This transparency is commendable and rare.\n\n### S6. Comprehensive Experimental\
    \ Design (R1)\n80 controlled models (4 scales × 5 dosages × 4 benchmarks) with\
    \ ground-truth clean scores, plus cross-family validation on Llama-3.2-1B and\
    \ ecological case studies up to 72B. Seven baselines with five evaluation metrics.\
    \ The controlled injection protocol is a significant methodological asset.\n\n\
    ---\n\n## Detailed Weaknesses\n\n### W1 (Major). Marginal Advantage Over Simple\
    \ Baselines — Both Reviewers\nTable 5: 4PL+γ achieves 4.3pp MAE [3.1, 5.5] vs\
    \ linear regression 4.8pp [3.5, 6.1] and single-signal 2PL+γ 4.6pp [3.3, 5.9].\
    \ All three 95% bootstrap CIs overlap substantially. The paper's primary calibration\
    \ claim reduces to: *a complex Bayesian IRT model is statistically indistinguishable\
    \ from linear regression on the headline metric*. The 2.9pp improvement over raw\
    \ scores (7.2pp) is driven primarily by a single condition: GSM8K at 3B, where\
    \ raw MAE is 12.8pp but all signal-based methods improve dramatically.\n\n**Implication**:\
    \ The full 4PL+γ+ME machinery provides diminishing returns over much simpler alternatives.\
    \ A practitioner would rationally choose linear regression for ease of implementation.\n\
    \n### W2 (Major). UQ Claim Undermined by Coverage Gap — Both Reviewers\nThe paper\
    \ positions uncertainty quantification as the distinctive contribution over baselines\
    \ (§5.3: \"The distinctive contribution: uncertainty quantification\"). Table\
    \ 6: 95% credible interval coverage reaches only 0.85, a 10pp gap from nominal.\
    \ This is not a minor shortcoming — it means the credible intervals are systematically\
    \ overconfident, the defining characteristic the paper claims to avoid.\n\nThe\
    \ 0.85 vs 0.72 comparison with bootstrap CIs is somewhat misleading: bootstrap\
    \ CIs are narrower (5.2pp vs 8.5pp). If one widened bootstrap CIs by 25% (to match\
    \ the Bayesian width), bootstrap coverage would likely approach 0.85 as well.\
    \ The paper does not provide this calibrated comparison.\n\nTwo sources are discussed\
    \ (local independence violation, single γ_k per benchmark), but no formal diagnosis\
    \ (e.g., simulation-based calibration / SBC) is provided. Without knowing whether\
    \ the gap is fixable (model misspecification) or fundamental (local independence),\
    \ the UQ contribution remains incompletely validated.\n\n### W3 (Major). \"Multi-Signal\"\
    \ Framing vs. Single-Signal Reality — Both Reviewers\nTable 4: S1-only AUC = 0.975\
    \ > RRF-4 = 0.947. Spearman ρ = 0.962 between RRF-4 and S1-only rankings. The\
    \ entire Stage 1 pipeline (4 signals, RRF fusion, normalization) is dead weight\
    \ — it degrades performance relative to using S1 alone. The paper honestly acknowledges\
    \ this (§5.2, §6), but continues to frame ContamCal as a \"multi-signal framework.\"\
    \n\nThis creates a tension between the paper's architecture (general, extensible)\
    \ and its operational reality (single-signal). A reviewer is left evaluating the\
    \ architecture on aspiration rather than evidence. The paper would be stronger\
    \ if it forthrightly presented itself as an embedding-signal + IRT calibration\
    \ method, with multi-signal extensibility discussed as future work.\n\n### W4\
    \ (Major). GSM8K Format Confound in the Only Significant γ — Both Reviewers\n\
    Table 7: Only GSM8K shows a statistically significant γ (1.85, CI [0.90, 2.80]).\
    \ MMLU (0.12, CI includes 0) and ARC (0.08, CI includes 0) show no significant\
    \ contamination effect. The paper's own §6 acknowledges that γ_GSM8K = 1.85 is\
    \ confounded by format learning: clean SFT causes catastrophic forgetting of GSM8K\
    \ answer format (base 60.5% → SFT 12%), and contaminated items restore it.\n\n\
    This creates a circularity: the one benchmark demonstrating ContamCal's value\
    \ is the one where γ captures format artifacts rather than pure contamination\
    \ memorization. On benchmarks without format confounds (MMLU, ARC), γ is indistinguishable\
    \ from zero, and ContamCal shows no advantage over raw scores (Table 12: 1.5B\
    \ MAE < 1pp for all benchmarks).\n\n### W5 (Major). Limited Methodological Novelty\
    \ — R2 (endorsed by R1 in convergence)\nThe 4PL+γ model adds a single linear contamination\
    \ covariate to standard explanatory IRT (De Boeck & Wilson 2004). RRF is off-the-shelf\
    \ (Cormack et al. 2009). The measurement error model is classical errors-in-variables.\
    \ HMC inference is standard. The contribution is a competent synthesis applied\
    \ to a new domain, but for a top venue, synthesis papers must demonstrate emergent\
    \ value exceeding the sum of parts.\n\nThe gap between 4PL+γ (4.3pp) and 2PL+γ\
    \ (4.6pp) — 0.3pp — suggests the additional complexity of the 4-parameter IRT\
    \ model (guessing c_j, upper asymptote d_j) provides negligible benefit over the\
    \ simpler 2-parameter variant.\n\n### W6 (Moderate). N_models Insufficiency for\
    \ 4PL+γ — R1 (endorsed by R2)\nThe experimental design provides ~15 models per\
    \ benchmark when pooling across scales, or ~4 models per scale per benchmark.\
    \ Standard IRT identifiability requires substantially more examinees. The paper's\
    \ own identifiability analysis suggests practical thresholds of N ≥ 50. The reported\
    \ results may reflect prior regularization dominating the posterior rather than\
    \ genuine data-driven parameter recovery.\n\n### W7 (Moderate). Observational\
    \ Results Provide Minimal Validation — Both Reviewers\nTable 11: RL-trained models\
    \ receive wide CIs (13-18pp) with minimal calibration correction (0.5-0.7pp).\
    \ Without ground truth for these models, the reader cannot distinguish \"honest\
    \ uncertainty\" from \"the method doesn't work here.\" The 2-signal closed-weight\
    \ mode (Table 10: MAE 6.7pp, Coverage 0.70) is similarly unconvincing. ContamCal's\
    \ practical applicability outside controlled SFT settings remains undemonstrated.\n\
    \n### W8 (Moderate). SFT Injection as Contamination Proxy — R1\nLoRA SFT with\
    \ paraphrased benchmark items is not how real contamination occurs (pretraining\
    \ data overlap, web scraping). Multiple artifacts documented: ability regression\
    \ at 0.5B (contamination SFT degrades general ability 7-15pp), GSM8K format confound,\
    \ low paraphrase QC rates. The \"controlled\" setting introduces its own confounds\
    \ that complicate interpretation.\n\n### W9 (Minor). Per-Benchmark γ_k via Separate\
    \ Fits — R1 (confirmed by R2)\nThe per-benchmark γ_k is achieved by fitting separate\
    \ IRT models per benchmark, not a joint hierarchical model with benchmark-indexed\
    \ γ. This weakens the heterogeneity claim — separate fits cannot formally test\
    \ γ heterogeneity, share information across benchmarks, or produce a principled\
    \ posterior over the γ vector.\n\n### W10 (Minor). Missing Related Work — R2\n\
    The broader membership inference literature (Shokri et al. 2017, Carlini et al.\
    \ 2022) and training data attribution methods (TRAK, influence functions) deserve\
    \ more than parenthetical mention. Alternative evaluation paradigms that sidestep\
    \ contamination (HELM, Chatbot Arena) are not discussed.\n\n---\n\n## Questions\
    \ for Authors\n\n1. **Marginal advantage**: Given overlapping CIs with linear\
    \ regression, what concrete scenario justifies the full 4PL+γ pipeline? If the\
    \ answer is \"better UQ,\" how do you reconcile the 10pp coverage gap?\n\n2. **Single-signal\
    \ reality**: Have you considered reframing as an S1 + IRT calibration paper with\
    \ multi-signal as an ablation/future direction? This would align claims with evidence.\n\
    \n3. **GSM8K γ interpretation**: Can you provide evidence that γ_GSM8K = 1.85\
    \ reflects contamination rather than format artifacts? What is γ on a format-aligned\
    \ evaluation?\n\n4. **Coverage diagnosis**: Can you run simulation-based calibration\
    \ (SBC) at actual N_models and N_items to diagnose whether the coverage gap is\
    \ from model misspecification, insufficient N, or local independence violation?\n\
    \n5. **Measurement error model status**: Which model produced the reported results\
    \ — the ME model described in §3.2 or the \"simple\" model without it? This must\
    \ be clarified for reproducibility.\n\n6. **N_models identifiability**: With N\
    \ ≈ 15 cross-scale models, what is the expected γ bias from your own identifiability\
    \ analysis, and how does it affect reported MAE?\n\n7. **Min-K++ mechanism**:\
    \ Have you investigated whether the directional reversal is specific to LoRA SFT\
    \ (partial parameter updates reducing surprise on trained items) or would persist\
    \ under full fine-tuning or pretraining contamination?\n\n8. **Joint hierarchical\
    \ model**: Would a hierarchical model γ_k ~ Normal(μ_γ, σ_γ) improve both parameter\
    \ estimation (information sharing) and formal heterogeneity testing?\n\n---\n\n\
    ## Experiment Coverage Assessment\n\nComparing the paper against the full experiment\
    \ design (review_context.yaml):\n\n| Experiment | Status in Paper | Coverage |\n\
    |-----------|----------------|----------|\n| Signal pipeline (exp-002) | Tables\
    \ 1, 3 | ✓ Complete |\n| RRF ablation (exp-003) | Table 4 | ✓ Complete |\n| IRT\
    \ calibration + baselines (exp-006) | Tables 5-7 | ✓ Complete |\n| 7B scale bridging\
    \ (exp-007) | Table 8 | ✓ Complete |\n| Signal survival (exp-008) | Tables 1-2,\
    \ §5.1 | ✓ Complete |\n| RL observational (exp-009) | Table 11, §5.7 | ✓ Complete\
    \ |\n| 72B observational (exp-012) | Appendix C | ✓ Complete (appendix) |\n| 2-signal\
    \ mode (exp-013) | Table 10, §5.6 | ✓ Complete |\n| Llama cross-family (exp-014)\
    \ | Table 9, §5.5 | ✓ Complete |\n\n**Coverage is comprehensive.** All imagined\
    \ experiments are represented in the paper. The per-scale MAE breakdown (Table\
    \ 12), dose-response discussion, and convergence diagnostics are all present.\
    \ No major planned experiment is missing.\n\n---\n\n## Recommendation\n\n**Overall\
    \ Score: 3/6 — Weak Reject (Unanimous)**\n\n**Core issue**: The paper addresses\
    \ an important problem with a principled approach, but the evidence does not support\
    \ the claims at a top venue level. The IRT calibration framework — the primary\
    \ contribution — is statistically indistinguishable from linear regression on\
    \ point accuracy, and its distinctive UQ contribution is undermined by a 10pp\
    \ coverage gap. The \"multi-signal\" architecture collapses to a single signal,\
    \ and the only statistically significant per-benchmark γ is confounded by format\
    \ artifacts.\n\n**What works**: The signal characterization findings (S1 robustness,\
    \ Min-K++ reversal) are genuinely valuable empirical contributions. The Fisher\
    \ Information analysis provides actionable theoretical guidance. The paper's honesty\
    \ about limitations is commendable.\n\n**Path to acceptance**: \n1. **Reframe\
    \ honestly** as an embedding-signal + IRT calibration method, with multi-signal\
    \ as extensible architecture\n2. **Diagnose and address the coverage gap** via\
    \ SBC or model refinement (hierarchical γ, multi-scale random effects)\n3. **Scale\
    \ N_models** substantially (more model families, more scales) for reliable 4PL+γ\
    \ identification\n4. **Disentangle GSM8K format artifacts** from contamination\
    \ — e.g., evaluate on format-aligned prompts or add a benchmark without format\
    \ confounds\n5. **Clarify the ME model status** — either include it with improved\
    \ implementation or remove it from the methods section\n6. **Elevate the Min-K++\
    \ reversal and signal characterization** as primary contributions rather than\
    \ secondary findings — these may be more impactful than the calibration framework\
    \ itself"

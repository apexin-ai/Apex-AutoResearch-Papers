      uncertainty 随之收缩。CI width 随 N 按 ~1/√N 缩放 （实测比率 N20/N100 = 2.04 at AUC=0.55，理论
      2.24）。 coverage 在 N=20 时低于 nominal (80-85%) 因为少量 examinee 导致 posterior 过于集中——这是已知的
      small-N IRT limitation。N≥50 时 coverage 达 90%+，N=100 时接近 nominal。Fisher Information
      推导 给出 structural identifiability 下界 AUC≈0.52（I(γ)>0 的理论保证）， practical threshold
      AUC≈0.70 定义为 "CI95 width < 10pp at N=50"。 连续 exposure 比 binary 产生 ~8% 更窄的 CI，因为连续值提供更多
      信息。Growing Pains pre-estimation 在 N=20 缩窄 CI ~22%，因为 借用外部数据的 item parameter
      估计减少了参数不确定性。


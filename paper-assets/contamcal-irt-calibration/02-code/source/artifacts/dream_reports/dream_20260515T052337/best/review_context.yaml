narrative_guidance: 'ContamCal 是首个桥接 detection→calibration 的框架，在 MCQ benchmark（ARC/MMLU）上
  实现统计显著的污染效应校准。保留 Claim 1（calibration）但限定为 "benchmark-dependent calibration"—— 对
  inflation 和 forgetting 双向校准。Claim 2 升级为 "multi-scale signal effectiveness"。 Fisher
  Info 可辨识分析（Claim 3）提供理论支撑。论文同时推 characterization（γ_k 异质性、Min-K++ 反转） 和 calibration，以
  characterization 为叙事主线、calibration 为方法验证。

  '

    的 AUC 改善空间有限。关键改善体现在下游 IRT MAE 上—— 多信号提供的 item-level exposure 分辨率更高（S1 是 binary-like
    的 embedding distance， S2 提供 complementary 的 perplexity-based 视角），使 IRT 的 γ 估计更精准。
    MAE gap 在 -0.008 到 -0.012 之间，落在 best 档定义的 [-0.015, -0.005] 内。 Calibrated-weighted

- name: stage1_signal_pipeline
  plan_id: exp-002
  description: 对 exp-001 产出的全部污染/干净模型计算 4 种检测信号（S1 embedding, S2 Min-K++, S3 ConStat,
    S4 Self-Critique）。0.5B 和 1.5B 已完成，3B 待计算。
  expected_results:
    S1_embedding_d005_auc_05B: 0.975
    S2_minkpp_d005_auc_05B: 0.47
    S4_selfcritique_d005_auc_05B: 0.48
    S1_embedding_d005_auc_15B: 0.98
    S2_minkpp_d005_auc_15B: 0.68
    S4_selfcritique_d005_auc_15B: 0.62
    S1_embedding_d005_auc_3B: 0.99
    S2_minkpp_d005_auc_3B: 0.74
    S4_selfcritique_d005_auc_3B: 0.67
    S2_minkpp_d100_cohens_d_05B: -1.98
    S2_minkpp_d100_cohens_d_15B: -0.85
    S2_minkpp_d100_cohens_d_3B: -0.35
  result_rationale: 'best 档的核心假设之一是 S2(Min-K++) 在 1.5B/3B 恢复到 AUC≥0.65。理据：Min-K++
    依赖 模型对 seen vs unseen token 的 perplexity 差异。0.5B 模型容量不足，SFT 后全局 perplexity 分布被大幅扰动（catastrophic
    forgetting 证据：ARC -17.5pp），导致 contaminated items 的 低 perplexity 信号被整体 perplexity
    上升淹没。1.5B 有足够容量吸收 SFT 数据而不破坏基础 知识（d100 时 MMLU/ARC 几乎不变 <1pp），因此 seen items 的 perplexity
    drop 能被 Min-K++ 捕获。3B 效果更好——其 d100 ARC 仅降 0.6pp vs 0.5B 降 17.5pp，说明 3B 的 知识保持能力远强于
    0.5B，Min-K++ 的 signal-to-noise ratio 相应提高。Self-Critique 的恢复逻辑类似但较弱——它依赖模型生成能力，0.5B
    生成质量本身就差。Min-K++ 反转在大模型 减弱是因为 d100 的全局 perplexity 扰动在大模型上更小。


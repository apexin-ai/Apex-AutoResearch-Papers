  result_rationale: 'S1 (embedding similarity) 在 0.5B d005 强是因为小模型 embedding space
    简单，paraphrase 和 original 的语义距离在低维空间中更易区分。随着模型规模增大，embedding space 维度和表征能力增加， paraphrase
    和 original 的 embedding 更加接近（更好的语义泛化），使得 S1 的区分力下降。 在 worst 档下，1.5B S1 AUC 降至 0.82-0.88（低于
    exp-004 确定的 practical threshold 0.90）， 3B 进一步降至 0.78-0.83。这意味着 S1 signal 的有效性严格受限于小模型，
    在实际应用关切的较大模型上 S1 也不可靠。

    S2 (Min-K++) 在 0.5B 上就已失败（AUC~0.47），且在 d100 时出现方向性反转（Cohen''s d=-1.98）， 这是因为 Min-K++
    依赖 token-level surprise：contaminated items 按假设应 less surprising， 但 0.5B 模型的 softmax
    分布太平坦，contamination 反而通过 fine-tuning 改变了整体 calibration， 使 contaminated items 的
    token probability 分布与 clean items 无法区分甚至反转。 这在更大模型上不会改善——larger models 有更好的 in-context
    learning 能力， 使得 fine-tuned memorization 和 in-context generalization 的信号更加纠缠。

    S4 (Self-Critique) 依赖模型自我评估能力，0.5B 模型根本没有足够的 instruction-following 能力来可靠地进行 self-critique，因此
    AUC 始终在 chance 水平。 在 1.5B/3B 上理论上应该改善，但 worst 档下假设 Self-Critique 对 SFT contamination
    （而非 pre-training contamination）不敏感——SFT 改变的是 response distribution 而非 model''s
    knowledge，Self-Critique 检测的是 knowledge discrepancy，因此无信号。

    S3 (ConStat) 依赖 original vs paraphrase 的 performance gap，但 exp-001 已证明 1.5B/3B
    上这个 gap <2pp（MC benchmarks immune），所以 ConStat 的 signal-to-noise ratio 接近 0，AUC
    在 chance 水平。

    '

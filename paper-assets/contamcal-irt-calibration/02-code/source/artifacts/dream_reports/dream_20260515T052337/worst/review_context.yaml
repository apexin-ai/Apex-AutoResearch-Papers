- name: rrf_aggregation_ablation
  plan_id: exp-003
  description: 'RRF fusion of 4 signals. Worst 档下：RRF 退化为 S1-only 模式， 因为其余 3 个信号贡献的是噪声而非信号，fusion
    没有任何增益。

    '
  expected_results:
    rrf_s1only_exposure_correlation: 0.97
    rrf_vs_s1only_mae_gap: 0.005
    rrf_vs_s1only_ranking_gap: 0.01
    rrf_4signal_mae: 0.078
    s1_only_mae: 0.075
    s2_only_mae: 0.145
    s3_only_mae: 0.14
    s4_only_mae: 0.138
    rrf_2signal_closed_weight_mae: 0.142
    fp_injection_5pct_mae_delta: 0.003
    fp_injection_10pct_mae_delta: 0.008
    fp_injection_20pct_mae_delta: 0.025
    rrf_15B_effective_auc: 0.8
    rrf_3B_effective_auc: 0.75
  result_rationale: '当 3/4 信号在 chance level 时，RRF 的 rank fusion 本质上在把 noise ranks
    和 signal ranks 混合。在 RRF 公式 score(d) = Σ 1/(k + rank_i(d)) 中，noise 信号的 rank 是随机排列，
    其贡献是均匀分布的常数偏移，不改变 S1 的相对排序。因此 RRF ≈ S1-only （exposure correlation 0.97），MAE gap
    仅 0.005——在噪声范围内。

    但 RRF 比 S1-only 略差而非略好，因为 noise signals 偶尔会把真正 high-exposure items 的 composite
    rank 拉向中间位置（rank dilution effect），引入微量 MAE 噪声。 这使得 RRF "principled aggregation"
    的论证变成纯理论——在实际数据上没有 benefit。

    Closed-weight 2-signal mode (ConStat + Self-Critique) 更糟：两个 noise signals 的 fusion
    仍然是 noise，MAE 接近 raw baseline（没有任何 calibration 效果）。

    在 1.5B/3B 上，即使 S1 也退化，RRF 的 effective AUC 进一步降至 0.75-0.80， 低于 exp-004 确定的 practical
    identifiability threshold。

    '

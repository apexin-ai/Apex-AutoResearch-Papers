narrative_guidance: '论文彻底放弃 calibration claim。Reframe 为三部分负面结果贡献： (1) "Why contamination
  calibration is harder than it looks" — 系统性展示 IRT+γ 在 LLM 评估中失败的结构性原因 (N 不足、local
  independence 违反、信号质量不够），对社区的 warning； (2) Signal failure mode characterization —
  Min-K++ 方向性反转 (Cohen''s d=-1.98) 是最可引用的发现， S1 作为唯一可靠信号的实证、d100 标签退化的解释； (3) Benchmark-dependent
  contamination effects — ARC 灾难性遗忘 vs GSM8K 天然抗性 vs MMLU 微弱效应， 作为 empirical finding
  独立于方法是否 work。 Fisher Info 分析 reframe 为 identifiability impossibility result。 标题方向："The
  Limits of Post-Hoc Contamination Calibration: An IRT-Based Diagnostic Study"。 仍投
  EMNLP：venue 明确欢迎 negative results。

  '

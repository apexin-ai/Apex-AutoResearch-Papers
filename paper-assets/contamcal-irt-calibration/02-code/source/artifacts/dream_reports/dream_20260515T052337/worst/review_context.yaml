    pattern（ARC -7pp，比 Qwen 0.5B 的 -17pp 小因为 Llama 基础能力不同）， 但方向一致（negative gamma for
    ARC）。

    MMLU/GSM8K dose-response 同样平坦（small model absorbs contamination differently）。
    S1 AUC 可能略好于 Qwen 0.5B（Llama 的 embedding space 不同）， 但仍不足以使 IRT γ CI 排除 0（N 太小
    + AUC 不够高）。

    cross-family γ correlation 仅 0.45（而非希望的 0.91），因为 contamination effect 不是 benchmark
    property alone——它是 benchmark × model architecture × model scale 的交互效应。 这进一步削弱了
    "per-benchmark γ_k as benchmark property" 的 claim。


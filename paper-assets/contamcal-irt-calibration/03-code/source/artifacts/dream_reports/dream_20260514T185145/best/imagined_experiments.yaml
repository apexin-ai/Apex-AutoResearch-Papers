    ci_coverage_95_me_model: 93
    ci_coverage_95_simple_model: 88
    ci_sharpness_me_vs_simple_ratio: 1.12
  result_rationale: '(a) NUTS收敛(R̂<1.01, ESS>400): exp-004 simulation sweep已在N=50/AUC=0.80验证
    MCMC quality(0 divergence, max R̂=1.010, min ESS=439)。Real data N=32(multi-seed
    pooling) 在simulation验证范围内。MMLU subsampled至1000 items降低计算负担同时保留statistical power。
    (b) Per-benchmark γ_k heterogeneity(CV=0.52): ARC γ_k=0.38最大——science reasoning
    MC items 格式固定且答案模式可记忆，contamination直接提升正确选项probability。MMLU γ_k=0.28中等—— 14K items
    diversity dilutes per-item memorization benefit。GSM8K γ_k≈0.06—— open-ended generation
    format天然抵抗contamination(即使见过问题，仍需自主推理得出答案)， 正确扮演negative control角色。HumanEval γ_k=0.12小——code
    generation部分受益于pattern recall 但functional correctness仍需正确逻辑。 (c) γ CI排除0的rate=0.88(≈7/8
    benchmark-conditions排除0)：MMLU/ARC/HumanEval排除0， GSM8K不排除(γ≈0.06±0.04, CI包含0)。这恰好验证了negative
    control和contamination susceptibility is benchmark property的论点。 (d) MAE=2.1pp:
    IRT通过item-level response patterns检测contamination效应——即使 average benchmark accuracy
    change仅1-2pp(1.5B/3B MMLU)，contaminated items呈现 concentrated 15-20pp per-item
    accuracy boost(被95% uncontaminated items稀释)。 IRT的γ_k × e_ij项精确捕获这种item-level effect。Counterfactual(e=0)移除此effect
    后recovery误差主要来自：(i)θ-γ posterior correlation残余(~0.5pp)， (ii)item subsample noise
    for MMLU(~0.3pp)，(iii)per-item exposure score noise(~0.5pp)。 (e) CI coverage 92%
    vs nominal 95%: 3pp gap的主要来源是local independence violation (single model responds
    to all items→item responses correlated through shared parameters)。 ME model通过propagating
    exposure noise部分补偿(88%→93%)。SBC诊断p=0.23确认 model specification本身正确(coverage gap来自local
    independence, not model misspecification)。 (f) Kendall τ=0.91: 校准后model ranking高度保留。少量ranking变化来自high-dosage
    models的calibration adjustment。 (g) Dose-response monotonicity: γ effect单调递增(d005<d025<d100)，0
    violations。 0.5B的negative overall accuracy与positive γ共存不违反单调性——γ衡量的是per-item contamination
    benefit(正)，而θ降低反映overall SFT degradation(负)。 (h) DCR MAE=4.6pp vs ContamCal 2.1pp:
    DCR缺乏per-item resolution和Bayesian UQ， 只能做benchmark-level fuzzy adjustment。Linear
    regression MAE=4.3pp因为linear assumption 不能捕获IRT的nonlinear item-response relationship。
    (i) Oracle γ gap=0.7pp: exposure score noise贡献了~0.7pp MAE overhead， 说明signal quality是calibration
    precision的binding constraint。

    '

    description: '3 rows × same metric columns。Per-benchmark γ_k primary; global γ
      loses 1.0pp MAE; hierarchical γ_k intermediate (formal heterogeneity test)。

      '
  figures_description:
  - 'Figure: Calibrated-vs-True accuracy scatter with CIs (main result figure)。 Each
    point = one model-benchmark condition, x=ground-truth clean accuracy, y=ContamCal
    calibrated accuracy, whiskers=95% CI。 Diagonal line=perfect calibration。Color
    by benchmark。 Inset: residual histogram showing approximate normality with mean≈0,
    sd≈2.1pp。'
  - 'Figure: Dose-response curves (4 panels, one per benchmark)。 x=dosage(d000/d005/d025/d100),
    y=accuracy。 Lines: Raw observed(red), ContamCal calibrated(blue), Ground truth
    clean(green dashed)。 Shaded: 95% CI bands。Blue tracks green closely; red diverges
    with dosage。'
  - 'Figure: γ_k forest plot across benchmarks。 Horizontal bars showing posterior
    mean and 95% CI for each benchmark''s γ_k。 Vertical dashed line at 0。GSM8K CI
    crosses 0; others clearly positive。'
  analysis: 'exp-006是论文核心实验。MAE=2.1pp(±0.4)显著优于DCR的4.6pp(Δ=2.5pp, p<0.01 bootstrap
    test)。 Coverage 92%接近但未达95% nominal——SBC p=0.23确认这不是model misspecification， 而是local
    independence violation的已知IRT limitation(single model→correlated item responses)。
    ME model部分弥补(88%→93%)但complete correction需要更复杂的correlated-error model (超出本文scope，acknowledged
    in Limitations)。Per-benchmark γ_k的CV=0.52是 论文的structural insight——contamination
    susceptibility取决于benchmark format和content characteristics， 不是model property。Oracle
    γ分析(gap=0.7pp)量化了detection signal quality的calibration ceiling—— future work的better
    signals可directly translate to tighter calibration。

    '

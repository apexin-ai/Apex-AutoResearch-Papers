    S3_auc_15B_d005_arc: 0.71
    S4_auc_15B_d005_mmlu: 0.7
    S4_auc_15B_d005_gsm8k: 0.66
    S4_auc_15B_d005_arc: 0.73
    S1_auc_3B_d005_mmlu: 0.972
    S1_auc_3B_d005_gsm8k: 0.993
    S1_auc_3B_d005_arc: 0.997
    S2_auc_3B_d005_mmlu: 0.8
    S2_auc_3B_d005_gsm8k: 0.76
    S2_auc_3B_d005_arc: 0.83
    S3_auc_3B_d005_mmlu: 0.74
    S3_auc_3B_d005_arc: 0.78
    S4_auc_3B_d005_mmlu: 0.77
    S4_auc_3B_d005_gsm8k: 0.73
    S4_auc_3B_d005_arc: 0.8
    S2_d100_cohens_d_15B_mmlu: -1.52
    S2_d100_cohens_d_15B_arc: -1.38
    S2_d100_cohens_d_3B_mmlu: -2.31
    S2_d100_cohens_d_3B_arc: -2.67
    signal_computation_time_per_model_hours: 1.5
    total_gpu_hours: 18
  result_rationale: 'S2(Min-K++)和S4(Self-Critique)的scale-dependent recovery机制： (a)
    Min-K++依赖token-level perplexity异常检测memorization。0.5B模型容量不足， 即使见过contaminated paraphrases也难以形成持久的token-level记忆痕迹(AUC≈0.47)。
    1.5B容量足以保留item-specific记忆，contaminated items呈现显著更低的token surprise(AUC→0.72)。 3B容量充裕，memorization痕迹更清晰(AUC→0.80)。
    (b) Self-Critique依赖模型自我评估能力(entropy collapse on seen items)。0.5B的 self-evaluation不可靠(AUC≈0.48)。1.5B
    emergence of metacognitive capability使得 模型对seen items表现出过度自信(更低entropy)，AUC→0.70。3B
    self-evaluation更稳定(AUC→0.77)。 (c) S1(embedding retrieval)基于外部sentence-transformer匹配，不依赖目标模型能力，
    因此AUC在所有scale一致≥0.95。 (d) Min-K++ d100 reversal持续且scale-dependent：d100将ALL items标记为contaminated，
    模型整体token-level distribution向training data shift，导致clean items的perplexity 反而更接近contaminated
    distribution→Min-K++反向判断。3B模型更充分地拟合d100 training data， reversal更强(Cohen''s d=-2.67)。
    (e) S3(ConStat)在1.5B/3B恢复，因为larger models对original vs paraphrased items的 performance
    gap更稳定、更可检测。0.5B的noise floor太高。

    '
  tables:
  - name: 'Table: Signal AUC × Scale × Dosage Heatmap (d005 within-model)'
    description: '4 signals × 3 scales × 3 benchmarks矩阵。Cells标注AUC值和95% bootstrap
      CI。 Color coding: green(≥0.70), yellow(0.55-0.70), red(<0.55)。 展示S2/S4从0.5B
      red到3B green的scale-dependent transition。

      '
  - name: 'Table: Cross-model Cohen''s d at d100 (d100 vs d000)'
    description: '3 signals × 3 scales × 3 benchmarks。标注Cohen''s d值和方向箭头。 突出Min-K++
      reversal: 0.5B d=-1.98, 3B d=-2.67。

      '
  figures_description:
  - 'Signal exposure score distribution violin plots: 对每个signal/scale/dosage， 展示contaminated
    vs clean items的exposure score分布。1.5B/3B S2/S4呈现清晰的 双峰分离(vs 0.5B完全重叠)。'
  analysis: 'S2/S4在≥1.5B恢复effectiveness验证了''scale-dependent signal reliability''叙事。
    这不仅是empirical observation——它反映了小模型(0.5B)缺乏足够capacity来形成 可检测的memorization痕迹或self-evaluation能力。ARC在所有signals表现最好(items最少、
    contamination signal-to-noise ratio最高)。GSM8K的S2/S4 AUC略低于MMLU/ARC， 与open-ended
    format降低memorization检测力一致。S1保持scale-invariant高AUC(≥0.95) 确认embedding retrieval作为robust
    anchor signal。Min-K++ reversal随scale增强 (Cohen''s d从-1.52到-2.67)是论文最强citation-worthy发现——它证明了naively
    relying on individual signals can ACTIVELY mislead(不仅仅是fail)。

    '
- name: rrf_aggregation_ablation
  plan_id: exp-003
  description: 'RRF融合4个signals为composite per-item exposure score。 消融实验: (a) RRF vs
    equal-weight rank averaging, (b) single-signal only (×4), (c) calibration-based
    weighted RRF, (d) FP injection robustness, (e) degraded 2-signal mode (ConStat+Self-Critique
    for closed-weight).

    '
  expected_results:
    rrf_composite_auc_05B_d005_mmlu: 0.955
    rrf_composite_auc_05B_d005_arc: 0.995
    rrf_vs_best_single_delta_05B: 0.002
    rrf_composite_auc_15B_d005_mmlu: 0.975
    rrf_composite_auc_15B_d005_arc: 0.998
    rrf_vs_best_single_delta_15B: 0.015
    rrf_composite_auc_3B_d005_mmlu: 0.985
    rrf_composite_auc_3B_d005_arc: 0.999
    rrf_vs_best_single_delta_3B: 0.02
    rrf_vs_equal_weight_delta_auc_3B: 0.008
    weighted_rrf_vs_rrf_delta_3B: 0.003
    fp_injection_10pct_auc_retention: 0.96
    fp_injection_20pct_auc_retention: 0.91
    degraded_2signal_auc_3B_mmlu: 0.79
    degraded_2signal_auc_3B_arc: 0.82
    s1_only_auc_3B_mmlu: 0.972
    s2_only_auc_3B_mmlu: 0.8
    s3_only_auc_3B_mmlu: 0.74
    s4_only_auc_3B_mmlu: 0.77
  result_rationale: '(a) 0.5B regime: S2/S3/S4均≈random(AUC<0.55)，RRF退化为S1-only模式。
    RRF composite AUC ≈ S1 AUC(+0.002)，因为random signals的RRF ranks 不系统性偏移有效S1的排序。这是graceful
    degradation——RRF不会因无效信号 而比最佳单信号更差(rank fusion的鲁棒性)。 (b) 1.5B regime: S2/S4恢复(AUC
    0.68-0.74)，RRF聚合3-4个above-chance signals。 Rank fusion的互补性在此显现：S1基于training-data
    proximity，S2基于memorization trace， S4基于metacognition——不同failure modes提供正交information。AUC提升1.5pp
    over S1-only。 (c) 3B regime: 4个signals全部AUC>0.74，RRF提升2.0pp over S1-only。这是RRF展示
    genuine aggregation value的最佳展示区间。 (d) RRF vs equal-weight: RRF对高排名items给予更大权重(reciprocal
    rank)， 优于uniform averaging 0.8pp——因为top-ranked items的agreement更informative。 (e)
    Calibration-based weighted RRF仅+0.3pp over vanilla RRF——marginal improvement 不值得引入calibration
    dependency(meta-circularity argument仍成立)。 (f) FP injection: RRF容忍10% FP rate(AUC保持96%)，20%时下降至91%。
    Rank fusion对sparse FP鲁棒因为FP不会系统性地在多个signals中出现。 (g) 2-signal degraded mode(S3+S4,
    no logits/embeddings): AUC 0.79-0.82 at 3B， sufficient for closed-weight calibration但CI会更宽。

    '
  tables:
  - name: 'Table: RRF Ablation Comparison (3B d005)'
    description: 'Rows: RRF-4sig, RRF-3sig(no S3), S1-only, S2-only, S3-only, S4-only,
      equal-weight, weighted-RRF, 2-signal(S3+S4)。 Columns: MMLU AUC, ARC AUC, GSM8K
      AUC, Mean AUC, Δ vs S1-only。

      '
  - name: 'Table: FP Robustness (RRF AUC at varying FP injection rates)'
    description: 'Rows: FP rate 0%, 5%, 10%, 15%, 20%。 Columns: MMLU, ARC, GSM8K composite
      AUC。

      '
  figures_description:
  - 'RRF value-add bar chart: 3个scales的(RRF − best_single_signal) delta。 0.5B bar≈0，1.5B
    bar=1.5pp，3B bar=2.0pp——清晰展示multi-signal aggregation value随scale emergence。'
  analysis: 'RRF的真正价值在≥1.5B multi-signal regime中显现——当constituent signals各自捕获 不同contamination
    facets时，rank fusion产生genuine information gain。在0.5B single-signal regime，RRF优雅退化且不引入harm(不比S1-only差)。
    Meta-circularity argument得到empirical支持：calibration-based weighting仅+0.3pp， 远不值得引入对training
    data quality的dependency。Training-free RRF保持设计选择定位。 2-signal mode在3B AUC≥0.79确认closed-weight
    applicability。

    '

tier: best
narrative_guidance: '原始framing完全成立。三条Core Claims无需调整： (1) ContamCal校准在MAE、coverage、ranking三维度显著优于全部7个基线，counterfactual
  exposure=0恢复真实分数，SBC诊断确认模型规格正确； (2) ''scale-dependent signal effectiveness''用多尺度AUC热力图完整呈现——S2(Min-K++)和S4(Self-Critique)在≥1.5B恢复AUC≥0.70，
  Min-K++反向效应(Cohen''s d=-1.98 at 0.5B d100)作为最强citation-worthy发现，论文区分item-level AUC与cross-model
  Cohen''s d两种检测范式； (3) Fisher Info identifiability分析的structural(AUC≥0.55)/practical(AUC≥0.70)阈值区分与144-condition
  simulation和real-data验证一致。 per-benchmark γ_k异质性(CV>0.3)成为额外亮点——污染敏感性是benchmark属性而非模型属性。
  RRF在≥1.5B多信号可用尺度展示真正的聚合价值(AUC提升+1.5-2pp vs best single signal)，在0.5B优雅退化为S1-only模式。
  N_models通过multi-seed pooling达到≥30，Fisher Info预测的identifiability边界与实证吻合。 论文标题保持calibration框架定位。0.5B的SFT
  degradation pattern(contamination hurts small models)作为有价值的empirical observation纳入分析。

  '
imagined_experiments:
- name: stage1_signal_pipeline
  plan_id: exp-002
  description: '在exp-001产出的全部contaminated+clean模型(0.5B/1.5B/3B × d000/d005/d025/d100
    × 2 seeds)上 计算4个detection signals: S1(embedding semantic retrieval), S2(Min-K%++),
    S3(ConStat performance gap), S4(Self-Critique entropy collapse)。 0.5B数据已完成(exp_002_signals_05B)，此处展开1.5B和3B的预测。

    '
  expected_results:
    S1_auc_05B_d005_mmlu: 0.953
    S1_auc_05B_d005_gsm8k: 0.988
    S1_auc_05B_d005_arc: 0.995

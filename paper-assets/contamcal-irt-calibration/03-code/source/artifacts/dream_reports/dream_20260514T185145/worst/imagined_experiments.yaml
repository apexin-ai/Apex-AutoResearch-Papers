      auc: 0.958
    - fp_rate: 5%
      auc: 0.949
    - fp_rate: 10%
      auc: 0.931
    - fp_rate: 15%
      auc: 0.908
  figures_description:
  - Bar chart对比5种aggregation方法的AUC：S1-only与RRF几乎等高，equal-weight显著低于两者，2-signal在chance水平。视觉上传达'multi-signal
    aggregation = S1 with extra steps'的message。
  analysis: '核心发现：RRF ≤ S1-only。这直接触发Reviewer Concern #18 (''Why not just S1?'')和
    #13 (''RRF is just S1?'')的defensive response。论文需诚实报告：当前条件下multi-signal aggregation无增益，S1-only是实质上的信号来源。RRF的价值被reframe为"extensible
    architecture for future signals"而非当前的性能贡献。2-signal mode的彻底失败(AUC=0.521)意味着 closed-weight
    model calibration在Related Work/Future Work中被标记为open problem。 Meta-circularity
    argument for training-free aggregation仍然成立但显得academic—— 当只有一个有效信号时，是否需要aggregation
    framework本身成为问题。

    '

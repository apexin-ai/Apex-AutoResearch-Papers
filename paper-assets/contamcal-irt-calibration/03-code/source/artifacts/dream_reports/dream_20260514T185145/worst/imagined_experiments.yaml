    '
- name: rrf_aggregation_ablation
  plan_id: exp-003
  description: 'RRF融合4个信号为composite exposure score，加上单信号/等权/加权/2-signal等ablation。
    0.5B部分数据已有(exp_003_rrf_05B)。Worst档下RRF ≈ S1，多信号融合无增益。

    '
  expected_results:
    rrf_4signal_auc_d005_mean: 0.958
    s1_only_auc_d005_mean: 0.964
    rrf_vs_s1_delta: -0.006
    equal_weight_avg_auc_d005_mean: 0.782
    calibration_weighted_rrf_auc_d005_mean: 0.961
    constat_selfcritique_2signal_auc_d005_mean: 0.521
    rrf_auc_at_5pct_fp_injection: 0.949
    rrf_auc_at_10pct_fp_injection: 0.931
    rrf_4signal_auc_range_across_scales: '[0.948, 0.965]'
    s1_only_auc_range_across_scales: '[0.951, 0.979]'
  result_rationale: 'RRF的rank fusion机制在3/4信号都是noise时退化为dominant signal mode：S1的high-AUC
    ranks(接近完美排序)dominate，S2/S3/S4的random ranks被平均掉但也引入额外噪声。因此 RRF(0.958)略低于S1-only(0.964)——噪声信号的inclusion是net
    negative。等权平均更差 (0.782)因为3个random signals直接稀释S1。Calibration-weighted RRF(0.961)接近S1因为
    weights自动将S2-S4权重压到~0。2-signal closed-weight mode(ConStat+Self-Critique) AUC=0.521是灾难性的——两个无效信号的fusion仍然无效，意味着closed-weight
    model calibration完全不可行。FP robustness check显示RRF/S1在5-10% FP注入下AUC下降<3%， 这是因为S1的基础信号足够强。但这不改变核心问题：multi-signal
    aggregation的whole point (robustness through diversity)在当前条件下无法实现。

    '

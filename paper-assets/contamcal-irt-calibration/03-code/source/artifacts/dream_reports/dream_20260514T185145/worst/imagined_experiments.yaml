  - 'Calibrated vs True accuracy scatter plot: 点高度散布在对角线两侧，95% CI error bars宽到12-25pp且许多不覆盖true
    value。与linear regression的tighter scatter形成对比。GSM8K 3B是唯一靠近对角线的outlier cluster。'
  - 'Dose-response curve: 0.5B的曲线向下(deflation)，1.5B/3B的曲线近乎水平(near-zero effect)。仅3B
    GSM8K有明显上升趋势。4个monotonicity violations用红叉标记。'
  - 'SBC rank histogram: γ的histogram明显tent-shaped(中间高两端低)，偏离uniform分布。p=0.003的K-S
    test结果标注。'
  - 'Oracle vs Estimated γ ablation bar chart: oracle-γ MAE(2.4pp)远低于estimated-γ(7.9pp)，差距5.5pp全部来自γ
    estimation error。'
  analysis: 'exp-006是worst档下最critical的negative result。核心发现：(1)4PL+γ IRT在所有benchmark上
    MAE劣于linear regression baseline(7.9pp vs 4.8pp mean)，IRT的额外复杂度(数千item parameters)在N=26
    models下导致overfitting而非better calibration；(2)γ CI仅在1/3 benchmark(GSM8K)excludes
    zero，且GSM8K的γ identification主要由3B的anomalous +58pp inflation驱动——去掉3B后GSM8K γ也不显著；(3)θ-γ
    correlation在ARC达0.72，接近严重混淆 阈值；(4)coverage gap达20pp(75% actual vs 95% nominal)，SBC确认是系统性model
    misspecification而非random variation。

    但oracle-γ ablation(MAE=2.4pp)证明IRT框架theoretically sound——failure source是 γ estimation而非IRT本身。这为reframed
    paper提供关键narrative：''γ identification requires conditions not met in current setup(stronger
    signals, more models, scale-homogeneous effects)''——用Fisher Info identifiability分析理论解释failure

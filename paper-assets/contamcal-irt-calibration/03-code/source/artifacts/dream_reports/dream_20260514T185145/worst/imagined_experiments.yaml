tier: worst
narrative_guidance: '核心框架claim不成立：(1) γ在真实数据上因scale-dependent contamination effect方向不一致
  （0.5B deflation vs 1.5B/3B near-zero inflation）导致不可靠估计，per-benchmark γ_k在不同scale上
  表现为不同符号，模型假设的单一γ根本无法捕捉这种异质性；(2) IRT复杂度无回报——线性回归基线 利用exposure score做简单调整即可达到相当甚至更优的MAE；(3)
  仅S1有效+N_models不足30的双重打击 使得Fisher Information不足以支撑reliable γ estimation。需根本性reframe为
  ''When Can We Calibrate Contaminated Benchmarks?''——用identifiability分析和信号characterization
  作为核心贡献，calibration框架降级为informative negative result。

  '
imagined_experiments:
- name: stage1_signal_pipeline
  plan_id: exp-002
  description: '在exp-001产出的1.5B和3B全dosage模型上计算4个检测信号。0.5B数据已有(exp_002_signals_05B)。
    Worst档下S2/S4在1.5B/3B依然不起作用，S3(ConStat)因inflation极小而无discriminative power。

    '
  expected_results:
    S1_d005_auc_15B_mmlu: 0.962
    S1_d005_auc_15B_gsm8k: 0.974
    S1_d005_auc_15B_arc: 0.988
    S1_d005_auc_3B_mmlu: 0.951
    S1_d005_auc_3B_gsm8k: 0.968
    S1_d005_auc_3B_arc: 0.982
    S2_d005_auc_15B_mean: 0.483
    S2_d005_auc_3B_mean: 0.502
    S2_d100_cohens_d_15B_mean: -1.52
    S2_d100_cohens_d_3B_mean: -1.22
    S3_d005_auc_15B_mean: 0.518
    S3_d005_auc_3B_mean: 0.531
    S4_d005_auc_15B_mean: 0.494
    S4_d005_auc_3B_mean: 0.519
    effective_signals_15B: 1
    effective_signals_3B: 1
    signals_with_auc_above_070_across_all_scales: S1 only
  result_rationale: 'S1(embedding similarity)检测的是train-test文本重叠而非模型行为变化，因此与model scale无关，
    在所有scale上保持AUC>0.95。S2(Min-K++)依赖token-level log-likelihood分布偏移来检测 memorization；但在1.5B/3B上模型capacity足够大，contaminated
    items不产生显著的 perplexity下降(因为模型即使没见过也能答对大部分MC题)，导致contaminated与clean items的 log-likelihood分布高度重叠(AUC≈0.50)。d100反转效应(Cohen''s
    d<0)是因为100%contamination 使整体perplexity分布shift，Min-K++的rank-based statistic反而把contaminated
    items排到 低风险端。S3(ConStat)需要original→paraphrase的performance gap，但1.5B/3B在MMLU/ARC上
    inflation<2pp，gap在item-level noise中被淹没。S4(Self-Critique)需要模型在contaminated items上表现出entropy
    collapse，但1.5B/3B的contamination几乎不改变response distribution。 总结：所有scale上只有S1可用，"scale-dependent
    signal effectiveness"这一claim的 "scale-dependent"部分无法验证——正确描述是"method-specific signal
    effectiveness"。

    '

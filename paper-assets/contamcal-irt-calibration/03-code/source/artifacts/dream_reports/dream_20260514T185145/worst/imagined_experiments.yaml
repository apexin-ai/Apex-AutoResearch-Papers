  figures_description:
  - 'Signal AUC heatmap: 4 signals × 3 scales × 3 dosages(d005/d025/d100)。视觉上呈现S1一行全亮(>0.95)，S2-S4三行全暗(~0.50)的极端二分格局。与best/mid档预期的''scale-dependent
    gradient''形成鲜明对比。'

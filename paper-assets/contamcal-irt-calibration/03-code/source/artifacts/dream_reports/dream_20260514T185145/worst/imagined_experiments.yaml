  result_rationale: 'ME model在技术上works：它correctly propagates exposure uncertainty
    into posterior， 产生slightly wider CIs(+2.6pp)和slightly better coverage(+4pp)。但coverage
    improvement from 75%→79%远不足以close 20pp gap to 95% nominal。原因：exposure measurement
    error 只是coverage gap的minor contributor(~15% per SBC attribution)。主要原因是local independence
    violation(~60%)和model misspecification(~25%)——ME model不address these。

    Post-hoc noise injection实验shows CI widening scales linearly with noise level (as
    expected from theory)——这validates the ME model mechanics。但即使at 2× noise， CIs only
    widen 28%，coverage仅reaches ~83%——still below 95%。

    ME model作为D025 framing中的''if improves coverage → report; otherwise → ablation''
    decision node：in worst tier, it''s an ablation item. Simple model(point-estimate
    exposure) is primary because ME model adds complexity without closing the coverage
    gap。

    '

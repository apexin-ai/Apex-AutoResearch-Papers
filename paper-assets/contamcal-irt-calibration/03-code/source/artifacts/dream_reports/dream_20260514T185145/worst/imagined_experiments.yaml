    sbc_diagnosis: systematic over-concentration near 0.5 → model underestimates posterior
      width
    sbc_n_models_at_actual: 26
    sbc_coverage_gap_attribution: 60% local independence violation, 25% N insufficient,
      15% model misspecification
  result_rationale: 'IRT校准在worst档下失败的根本原因是scale-dependent contamination effect direction
    inconsistency 与模型假设的根本冲突。具体而言：

    MMLU: 0.5B的contamination产生-16.5pp deflation(catastrophic forgetting)，1.5B/3B产生
    +0.8pp near-zero inflation。IRT模型假设γ×exposure的效应方向一致(contamination=inflation)，
    但真实数据中0.5B的方向相反。Per-benchmark fitting估计的γ̂是deflation和near-zero的某种 加权平均→γ̂≈0.018(接近零)，95%
    CI宽泛且包含零。校准后的counterfactual(exposure=0) 与raw score几乎无差异，但IRT的4PL item parameters
    estimation在N=26下不稳定(ESS低、 部分Rhat>1.05)，引入额外噪声，导致MAE=6.8pp远高于直接用raw scores(3.2pp)或
    linear regression(3.9pp)。线性回归无需估计数千个item parameters，只需简单拟合 clean_score ~ exposure
    + raw_score，因此更稳定。

    ARC: 同样的pattern——0.5B deflation(-17.5pp)与3B near-zero inflation(+1.2pp)方向不一致。
    γ̂为负值(-0.032)且CI包含零。θ-γ posterior correlation=0.72(接近严重混淆的0.7阈值)， 说明模型无法区分"高能力模型"与"低contamination模型"。ARC的Rhat=1.12表明convergence
    marginal，ESS=87偏低。

    GSM8K: 唯一γ CI excludes zero的benchmark——3B的+57.7pp massive inflation提供了 strong
    contamination signal。但0.5B和1.5B的near-zero effect仍然拖累估计。MAE=8.5pp 虽然好于raw(12.8pp)，但仍不如linear
    regression(6.2pp)和DCR(7.4pp)。问题是GSM8K的 inflation pattern极端非线性(3B爆炸式增长而0.5B/1.5B几乎不变)，IRT的线性γ×exposure
    无法捕捉这种scale-conditional effect。

    HumanEval: N_items=164对4PL的thousands of parameters严重不足，convergence failure(Rhat=1.18)。

    Coverage问题(75% vs 95% nominal)：SBC诊断显示rank histogram系统性over-concentrated near
    0.5，表明posterior width被低估。原因分解：(1)local independence violation—— single model responds
    to all items，item responses correlated through shared θ， 这种correlation被model忽略导致posterior
    artificially narrow；(2)N=26 models insufficient for reliable posterior estimation
    with数千个nuisance parameters(a,b,c,d per item)； (3)γ的scale-dependent effect direction
    misspecified。三者叠加导致20pp coverage gap。

    Oracle-γ ablation(直接使用true contamination label)shows MAE可降到1.2-3.4pp， 证明IRT框架理论上可行，但γ
    estimation noise贡献了~4.2pp的额外error—— 在当前信号质量和N下，estimation noise dominates。

    Dose-response monotonicity: 0.5B的deflation pattern导致4个violations(d005<d000在0.5B、
    d025<d005在0.5B、以及1.5B/3B的near-zero-with-noise fluctuations)。

    '

  analysis: '该结果确认"scale-dependent"主张不成立——S2/S4在任何scale上都无discriminative power。 论文C2
    contingency触发：降级为"method-specific signal effectiveness"，RRF讨论移至 Limitations。S1的单独有效性仍是有价值的发现(AUC>0.95
    across scales)，但RRF作为 "principled multi-signal aggregation"的卖点完全落空——它只是S1的一层wrapper。

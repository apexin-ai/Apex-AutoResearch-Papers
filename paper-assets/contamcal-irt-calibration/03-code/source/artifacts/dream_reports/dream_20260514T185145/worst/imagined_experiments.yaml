  result_rationale: 'Simulation sweep在idealized conditions下展示出令人鼓舞的结果——即使AUC=0.55(near
    chance)， γ也structurally identifiable(RMSE=0.04 at N=20)。这本身是一个有价值的理论贡献。 但worst档的核心问题是sim-to-real
    gap：simulation中(1)model specification完全正确 (data generating process = fitted model)，(2)local
    independence holds(每个examinee 独立)，(3)exposure scores按exact AUC level生成(no distribution
    mismatch)。

    Real data违反所有三个假设：(1)contamination effect is scale-dependent(model misspecified)，
    (2)single model responds to all items(local independence violated)，(3)exposure
    AUC=0.96但 inflation near-zero(high AUC doesn''t help when there''s nothing to
    calibrate)。 因此simulation RMSE=0.012预测的精度在real data上inflated 12×以上。

    Fisher Information analysis gives I(γ) ∝ N × (AUC-0.5)² / σ²_e。在real conditions，
    AUC=0.96 gives (0.96-0.5)²=0.2116——似乎足够。但这个公式假设γ的true effect is non-zero 且model
    correctly specified。当true γ≈0(1.5B/3B MMLU/ARC)，Fisher Info对precision 的保证变成"we
    can precisely estimate that γ≈0"——which is correct but useless for calibration。

    SBC通过simulation(p=0.34)但fail on real data(p=0.003)——quantitative evidence for
    sim-to-real gap。

    '

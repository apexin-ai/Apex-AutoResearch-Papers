    The paper addresses a genuinely important and under-served problem — calibrating
    (not just detecting) benchmark contamination — with a principled Bayesian framework
    grounded in educational measurement theory. The empirical contributions (Min-K++
    reversal, γ_k as benchmark property, Fisher Information identifiability analysis)

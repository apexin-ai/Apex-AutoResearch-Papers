      s3_only_auc_3B_mmlu: 0.74
      s4_only_auc_3B_mmlu: 0.77
    result_rationale: '(a) 0.5B regime: S2/S3/S4均≈random(AUC<0.55)，RRF退化为S1-only模式。
      RRF composite AUC ≈ S1 AUC(+0.002)，因为random signals的RRF ranks 不系统性偏移有效S1的排序。这是graceful
      degradation——RRF不会因无效信号 而比最佳单信号更差(rank fusion的鲁棒性)。 (b) 1.5B regime: S2/S4恢复(AUC
      0.68-0.74)，RRF聚合3-4个above-chance signals。 Rank fusion的互补性在此显现：S1基于training-data
      proximity，S2基于memorization trace， S4基于metacognition——不同failure modes提供正交information。AUC提升1.5pp
      over S1-only。 (c) 3B regime: 4个signals全部AUC>0.74，RRF提升2.0pp over S1-only。这是RRF展示
      genuine aggregation value的最佳展示区间。 (d) RRF vs equal-weight: RRF对高排名items给予更大权重(reciprocal
      rank)， 优于uniform averaging 0.8pp——因为top-ranked items的agreement更informative。
      (e) Calibration-based weighted RRF仅+0.3pp over vanilla RRF——marginal improvement
      不值得引入calibration dependency(meta-circularity argument仍成立)。 (f) FP injection:
      RRF容忍10% FP rate(AUC保持96%)，20%时下降至91%。 Rank fusion对sparse FP鲁棒因为FP不会系统性地在多个signals中出现。
      (g) 2-signal degraded mode(S3+S4, no logits/embeddings): AUC 0.79-0.82 at 3B，
      sufficient for closed-weight calibration但CI会更宽。

      '

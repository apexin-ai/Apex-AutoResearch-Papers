    result_rationale: 'S2(Min-K++)和S4(Self-Critique)的scale-dependent recovery机制： (a)
      Min-K++依赖token-level perplexity异常检测memorization。0.5B模型容量不足， 即使见过contaminated
      paraphrases也难以形成持久的token-level记忆痕迹(AUC≈0.47)。 1.5B容量足以保留item-specific记忆，contaminated
      items呈现显著更低的token surprise(AUC→0.72)。 3B容量充裕，memorization痕迹更清晰(AUC→0.80)。 (b)
      Self-Critique依赖模型自我评估能力(entropy collapse on seen items)。0.5B的 self-evaluation不可靠(AUC≈0.48)。1.5B
      emergence of metacognitive capability使得 模型对seen items表现出过度自信(更低entropy)，AUC→0.70。3B
      self-evaluation更稳定(AUC→0.77)。 (c) S1(embedding retrieval)基于外部sentence-transformer匹配，不依赖目标模型能力，
      因此AUC在所有scale一致≥0.95。 (d) Min-K++ d100 reversal持续且scale-dependent：d100将ALL items标记为contaminated，
      模型整体token-level distribution向training data shift，导致clean items的perplexity 反而更接近contaminated
      distribution→Min-K++反向判断。3B模型更充分地拟合d100 training data， reversal更强(Cohen''s d=-2.67)。
      (e) S3(ConStat)在1.5B/3B恢复，因为larger models对original vs paraphrased items的 performance
      gap更稳定、更可检测。0.5B的noise floor太高。

      '

      Effective AUC 0.56(S1+S4 RRF)处于Fisher Info analysis的 structural identifiability
      threshold(AUC≥0.55)但远低于practical threshold(AUC≥0.70)。结果：γ posterior极宽(CI [-0.35,
      0.65])， 不排除0，校准本质上是"不知道是否有contamination"。

      Wide CIs(14.2pp avg)是honest uncertainty quantification—— 当信号质量不足时，模型正确地表达"我不确定"。这实际上是C3

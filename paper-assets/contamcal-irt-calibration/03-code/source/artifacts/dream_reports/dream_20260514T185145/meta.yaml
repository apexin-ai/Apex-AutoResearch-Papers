      less confident → top-5选择 更conservative → 减少overconfident wrong choices； (2)
      near-zero γ on clean benchmark confirms specificity—— model不在没有contamination的地方hallucinate
      contamination。

      Near-zero γ specificity check：在未被contaminate的benchmark上 (如MMLU sub-categories
      known to be clean)，γ ≈ 0.03 ± 0.20， CI宽泛地包含0。模型不会false-positive。


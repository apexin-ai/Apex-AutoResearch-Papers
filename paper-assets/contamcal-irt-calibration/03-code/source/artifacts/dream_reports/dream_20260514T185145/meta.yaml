    ### Summary Assessment


    ContamCal proposes the first principled framework for calibrating (not just detecting)
    benchmark contamination in LLMs, grounding its approach in educational measurement''s
    item compromise IRT literature. The two-stage design (multi-signal exposure mapping
    + contamination-augmented 4PL IRT) is sound and produces interpretable, uncertainty-quantified

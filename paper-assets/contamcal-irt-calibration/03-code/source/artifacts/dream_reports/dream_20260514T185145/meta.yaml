      setup(stronger signals, more models, scale-homogeneous effects)''——用Fisher Info
      identifiability分析理论解释failure boundary。

      论文positioning：calibration results reported as ''informative negative result''
      with identifiability analysis explaining WHY it fails and WHAT conditions would
      make it work。 Linear regression baseline becomes the pragmatic recommendation。

      '

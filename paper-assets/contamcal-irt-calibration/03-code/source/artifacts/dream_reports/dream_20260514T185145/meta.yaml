    operating regime.


    4. **Per-benchmark γ_k as benchmark property.** CV=0.52 within family + r=0.91
    cross-family correlation establishes that contamination susceptibility depends
    on benchmark format (ARC > MMLU >> GSM8K), not model architecture. GSM8K as negative
    control (γ≈0.06, CI includes 0) adds credibility.


    5. **Comprehensive experimental scope.** 9 experiments covering signal characterization,
    RRF ablation, main calibration, 7B scale bridging, RL observational, 72B frontier,
    2-signal degraded mode, and cross-family validation. All planned experiments are
    present.


    6. **Honest uncertainty characterization.** Wider CIs for RL models (1.8×), 2-signal
    mode (1.41×), and the coverage gap (92% vs 95%) are transparently reported and
    correctly attributed.


    ### Weaknesses (ordered by severity)


    1. **(Major) Limited methodological novelty.** The 4PL+γ model is a direct application
    of explanatory IRT (De Boeck & Wilson 2004) with a contamination covariate. RRF,
    measurement error models, and Stan NUTS are all off-the-shelf. The 2PL+γ baseline
    at 3.9pp MAE captures ~75% of the improvement over DCR (4.6pp), suggesting diminishing
    returns from the full machinery. The paper''s contribution is primarily empirical
    application and characterization, not methodological.


    2. **(Major) SFT injection external validity.** All headline quantitative results
    derive from LoRA SFT with rephrased items — qualitatively different from real
    pre-training contamination. Specific concerns: (a) ability regression at 0.5B
    means contamination hurts performance, opposite to the real-world threat; (b)
    catastrophic forgetting on GSM8K may explain γ_GSM8K≈0 as an artifact rather than
    format resistance; (c) observational studies (RL, 72B) lack ground truth and show
    only small adjustments with wide CIs. This is acknowledged in Limitations but
    understated.


    3. **(Major) Incomplete baseline comparison (Table 6).** Coverage, CI width, Kendall
    τ, and monotonicity metrics are reported only for ContamCal. All baselines show
    "—". This prevents fair assessment of whether ContamCal''s advantage is in calibration
    accuracy or merely in having UQ at all. Bootstrap CIs for linear regression and
    remove-and-rescore baselines would partially address this.


    4. **(Moderate) N_models=32 in bias-sensitive regime.** The paper''s own simulation
    suggests N≥50 for reliable γ recovery. At N=32, systematic positive γ bias is
    expected. The paper does not discuss this implication or whether the reported
    MAE partially benefits from error cancellation.


    5. **(Moderate) Zero figures.** 14 tables and no figures in a paper about signal×scale×dosage
    characterization. A signal heatmap, dose-response curves, and calibrated-vs-true

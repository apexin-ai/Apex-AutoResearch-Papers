    - Comprehensive baseline comparison (7 methods) with appropriate metrics

    - SBC diagnostics (p=0.23) demonstrate proper model specification verification

    - MCMC convergence diagnostics thoroughly reported (R̂_max=1.007, ESS≥380, 0 divergent
    transitions)

    - Transparent limitation acknowledgment throughout


    **Weaknesses**:

    1. **(Major) N_models=32 below identifiability regime.** The paper''s own simulation
    analysis suggests N≥50 for reliable γ recovery. At N=32, systematic positive bias
    in γ estimates is expected. The multi-seed pooling strategy to reach N=32 pools
    models of vastly different scales (0.5B–7B), which conflates scale effects with
    contamination effects. The paper does not discuss the bias implications of operating
    below its own recommended threshold.


    2. **(Major) SFT injection confounds.** LoRA SFT injection produces qualitatively
    different contamination patterns than real-world pre-training contamination. Specific
    concerns: (a) 0.5B models show ability regression under contamination (contamination
    hurts overall performance), which is the opposite of the real-world concern; (b)
    catastrophic forgetting at smaller scales on GSM8K may inflate γ_GSM8K ≈ 0 not
    because GSM8K resists contamination but because SFT destroys the model''s reasoning
    ability; (c) position bias from contamination injection (answer-position patterns
    in paraphrased items) may confound signal detection.


    3. **(Major) Table 6 incomplete.** The main results table reports coverage, CI
    width, Kendall τ, and monotonicity violations ONLY for ContamCal — all 7 baselines
    show "—" for these metrics. This makes the comparison appear one-sided and prevents
    assessing whether ContamCal''s advantages on UQ metrics are simply because it''s

      items entropy略低)但effect size不足以达到useful AUC。

      Instruct模型(RL proxy)：RL post-training进一步重塑logit distribution， S1(embedding-based)仅检测training
      data是否包含benchmark items—— Instruct模型的SFT数据可能包含benchmark-related content(来自instruction
      tuning data sourcing)，但与controlled contamination不同。 S1 AUC降到0.62反映的是"natural
      exposure"而非"zero signal"。

      Signal × regime heatmap将展示清晰的pattern：S1在SFT regime有效， 在RL regime降级；S2/S4在所有regime无效。这是C2的core

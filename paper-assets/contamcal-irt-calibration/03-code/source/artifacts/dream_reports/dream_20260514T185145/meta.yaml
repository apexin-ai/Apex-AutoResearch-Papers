  - name: rrf_aggregation_ablation
    plan_id: exp-003
    description: 'RRF融合4信号为composite per-item exposure score。消融： (a) RRF vs equal-weight
      rank averaging, (b) single-signal only ×4, (c) calibration-weighted RRF, (d)
      FP injection robustness, (e) 2-signal degraded mode。

      '
    expected_results:
      rrf_4signal_auc_d005_mean: 0.932
      s1_only_auc_d005_mean: 0.979
      rrf_vs_s1_delta: -0.047
      equal_weight_rank_avg_auc: 0.918
      calibration_weighted_rrf_auc: 0.951
      s2_only_auc_d005_mean: 0.502
      s3_only_auc_d005_mean: 0.617
      s4_only_auc_d005_mean: 0.506
      degraded_2signal_auc: 0.568
      fp_injection_5pct_auc_delta: -0.02
      fp_injection_10pct_auc_delta: -0.05
      fp_injection_20pct_auc_delta: -0.12
    result_rationale: 'RRF将4个信号的rank进行倒数融合。当3/4信号是noise(AUC≈0.50)时， noise信号的rank本质是random
      permutation，融合后相当于对S1 rank添加了 uniform noise。具体地：RRF score = 1/(k+r_S1) + 1/(k+r_S2)
      + 1/(k+r_S3) + 1/(k+r_S4)， 其中r_S2, r_S3(at 0.5B), r_S4接近random。这等价于对S1 signal施加了
      ~25%权重的均匀噪声扰动，导致AUC从0.979降到~0.93。

      S1-only严格优于RRF 4-signal（Δ≈-4.7pp AUC），直接支持reviewer concern #18 "why not just
      S1"。这是median tier最关键的实验结果之一。

      Calibration-weighted RRF根据held-out AUC对各信号加权，有效降低noise信号权重。 在极端情况下（S2/S4权重趋近0）退化为S1+S3
      weighted，AUC恢复到0.95左右。 但引入了circularity——权重校准需要labeled data，与meta-circularity
      argument冲突。

      2-signal degraded mode(ConStat+Self-Critique, 无logits/embeddings)： 两个信号AUC均<0.65，融合后AUC≈0.57——不足以支撑可靠校准。
      这对closed-weight model适用性是坏消息。

      FP injection robustness：在5%/10%/20% false positive率下，S1的AUC本身 下降有限（embedding
      retrieval的FP主要是语义相似但非contaminated的item）， 但RRF更脆弱——noise信号的FP和真实FP叠加后扰动更大。

      '

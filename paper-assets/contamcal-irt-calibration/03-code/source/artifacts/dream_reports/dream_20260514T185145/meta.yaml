      S2(Min-K++)在1.5B/3B的表现：Min-K++计算token log-probability的k-th percentile，假设memorized
      text的low-probability tokens概率升高。 SFT contamination不同于pretraining data leakage——SFT主要改变response
      distribution而非input distribution。对于MC benchmark items，model看到 的是question+options，SFT可能memorize了answer
      pattern但不改变 question tokens的probability。因此Min-K++在question tokens上 无法区分contaminated/clean，AUC接近chance。
      1.5B/3B的improvement(0.50→0.54)来自更大model对answer tokens的 memorization effect微弱反映在logit中。

      S2 directional reversal在1.5B/3B持续：d100时全部items都contaminated， model整体logit distribution右移(所有items概率升高)，Min-K++的
      percentile ranking反而将contaminated items排在"less anomalous"一端。 Cohen''s d保持负值且magnitude与0.5B
      comparable(-2.0~-2.3)。


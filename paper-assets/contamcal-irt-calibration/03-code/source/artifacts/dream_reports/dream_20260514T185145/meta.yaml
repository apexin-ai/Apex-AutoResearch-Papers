      同时估计σ_e和τ_ij。

      Median tier预测ME model对coverage的改善有限(+5pp, 82→87%)。 改善来自CI widening(+2.3pp width)——ME
      model的uncertainty propagation使CIs更宽，mechanically提高coverage，但不修复 underlying bias。Coverage
      gap从13pp(82% vs 95%)缩小到8pp(87% vs 95%)， 未fully close。

      Bias方向(positive, ~55%): exposure scores有measurement error时， 观察到的exposure-performance
      correlation被attenuate(classical measurement error attenuation)。但IRT model不是simple
      regression—— γ posterior也受prior和item parameters影响。Net effect: moderate positive
      bias因为noisy exposure scores部分correlate with ability θ (confounding)。

      Post-hoc noise injection: 逐步增加noise level(1×/1.5×/2×) empirically maps noise→degradation曲线。At

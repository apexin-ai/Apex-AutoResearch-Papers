    analysis: 'S2/S4在≥1.5B恢复effectiveness验证了''scale-dependent signal reliability''叙事。
      这不仅是empirical observation——它反映了小模型(0.5B)缺乏足够capacity来形成 可检测的memorization痕迹或self-evaluation能力。ARC在所有signals表现最好(items最少、
      contamination signal-to-noise ratio最高)。GSM8K的S2/S4 AUC略低于MMLU/ARC， 与open-ended
      format降低memorization检测力一致。S1保持scale-invariant高AUC(≥0.95) 确认embedding retrieval作为robust
      anchor signal。Min-K++ reversal随scale增强 (Cohen''s d从-1.52到-2.67)是论文最强citation-worthy发现——它证明了naively
      relying on individual signals can ACTIVELY mislead(不仅仅是fail)。

      '

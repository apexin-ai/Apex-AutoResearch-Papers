    plan_id: exp-003
    description: 'RRF融合4个signals为composite per-item exposure score。 消融实验: (a) RRF
      vs equal-weight rank averaging, (b) single-signal only (×4), (c) calibration-based
      weighted RRF, (d) FP injection robustness, (e) degraded 2-signal mode (ConStat+Self-Critique

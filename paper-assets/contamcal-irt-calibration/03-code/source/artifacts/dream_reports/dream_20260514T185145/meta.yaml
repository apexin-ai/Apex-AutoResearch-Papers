      conditions下很reliable)。 RL scenario更高(σ_e≈0.40，S1 AUC降到0.58)。 这quantifies为何RL
      calibration的CI比SFT宽得多。

      ME model不作为primary model的decision confirmed: improvement insufficient to justify
      3.2× computation cost。 Simple model为主，ME为ablation。

      '

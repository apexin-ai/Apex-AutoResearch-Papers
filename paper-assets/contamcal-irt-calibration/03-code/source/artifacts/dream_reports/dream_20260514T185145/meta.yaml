    least the linear regression and remove-and-rescore baselines should be computable.


    4. **(Moderate) Per-benchmark γ_k via separate fits.** Fitting each benchmark
    independently (Section 3.3) prevents formal heterogeneity testing and information
    sharing across benchmarks. Table 9 shows the hierarchical model (μ_γ=0.22, σ_γ=0.14)

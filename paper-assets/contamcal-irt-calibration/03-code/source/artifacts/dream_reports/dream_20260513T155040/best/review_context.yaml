narrative_guidance: '原始framing完全成立：ContamCal是benchmark contamination的"statistical
  safety net"， 三条claims按原始强度表述。Headline: "ContamCal recovers true performance within
  2pp MAE with 93% CI coverage, while naive scores overestimate by 8-12pp." RL宽CI叙事自然成立——"wide
  CIs are the correct answer"用expected regret量化证明。投AAAI无需调整framing。

  '
imagined_experiments:
- name: controlled_sft_injection
  plan_id: exp-001
  description: 'Qwen2.5-0.5B/1.5B/3B × 5 dosage levels (0%/5%/25%/50%/100%) SFT注入，
    生成15个contaminated/clean模型对作为ground truth。

    '
  expected_results:
    sft_runs_completed: 15
    dosage_0pct_acc_delta_mmlu_pp: 0.0
    dosage_5pct_acc_inflation_mmlu_pp: 2.1
    dosage_25pct_acc_inflation_mmlu_pp: 5.8
    dosage_50pct_acc_inflation_mmlu_pp: 9.3
    dosage_100pct_acc_inflation_mmlu_pp: 12.6
    dosage_25pct_acc_inflation_gsm8k_pp: 4.2
    dosage_25pct_acc_inflation_arc_pp: 5.1
    dosage_25pct_acc_inflation_humaneval_pp: 7.5
    scale_0_5B_mean_inflation_50pct_pp: 10.8
    scale_1_5B_mean_inflation_50pct_pp: 9.1
    scale_3B_mean_inflation_50pct_pp: 8.2
    dose_response_spearman_across_all: 0.97
    convergence_failures: 0
  result_rationale: 'best档下SFT注入实验完全按预期工作。paraphrase-based injection在5%剂量时已产生可测量的2pp
    inflation， 100%剂量下MMLU膨胀达12.6pp，与Emperor''s New Clothes报告的8-15pp范围一致。 较小模型(0.5B)受contamination影响更大（memorization
    capacity占比更高）， 3B模型因能力更强、泛化更好而inflation略低。GSM8K因reasoning chain结构使得 memorization效果弱于纯knowledge
    recall的MMLU。HumanEval inflation最高因为 code solutions更容易被精确记忆。dose-response严格单调（spearman=0.97），
    为后续IRT建模提供理想的ground truth梯度。

    '
  tables:
  - name: 'Table 1: Accuracy Inflation (pp) by Model Scale × Dosage × Benchmark'
    rows: 60
    columns:
    - model
    - benchmark
    - dosage
    - clean_acc
    - contaminated_acc
    - inflation_pp
  figures_description:
  - 'Fig 1: Dose-response curves (dosage vs inflation) for each model×benchmark combination,
    12 panels, showing strict monotonicity'
  analysis: '所有15个SFT run成功收敛。inflation幅度在MMLU上与文献一致。 关键观察：inflation并非线性——25%→50%的增量大于5%→25%，表明contamination效果存在加速区间，
    支持非线性4PL建模的必要性。跨benchmark一致性强，为Claim 1提供坚实的ground truth基础。

    '
- name: stage1_signal_pipeline
  plan_id: exp-002
  description: '在exp-001的所有模型上计算4种检测信号：embedding retrieval, Min-K%++, ConStat, Self-Critique。输出per-model-item
    exposure scores。

    '
  expected_results:
    embedding_retrieval_auc_sft_mean: 0.88
    mink_pp_auc_sft_mean: 0.84
    constat_auc_sft_mean: 0.82
    self_critique_auc_sft_mean: 0.79
    embedding_retrieval_auc_at_5pct_dosage: 0.76
    mink_pp_auc_at_5pct_dosage: 0.71
    constat_auc_at_5pct_dosage: 0.68
    self_critique_auc_at_5pct_dosage: 0.66

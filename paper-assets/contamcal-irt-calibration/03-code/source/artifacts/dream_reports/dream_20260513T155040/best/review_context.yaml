  analysis: '信号质量全面达到best档预期。关键发现：信号间低-中等相关性(mean=0.38)证实 complementarity假设，为RRF融合奠定基础。HumanEval上embedding
    retrieval AUC 特别高(0.92)因为code的语义embedding更具区分性。

    '
- name: rrf_aggregation_ablation
  plan_id: exp-003
  description: 'RRF融合4信号为composite exposure score。消融实验：RRF vs rank averaging, 单信号,
    calibration-weighted RRF, FP注入鲁棒性, 2-signal降级模式。


  result_rationale: 'best档下RRF融合AUC(0.87)接近最好的单信号(embedding 0.88)但关键优势在于鲁棒性： RRF在所有benchmark上都稳定达到0.85+，而单信号表现波动大（embedding在GSM8K上可能
    降到0.80，ConStat在HumanEval上可能降到0.75）。RRF比rank averaging高3pp因为 reciprocal rank weighting对高置信排名给予更大权重。Calibration-weighted
    RRF略低于 vanilla RRF因为权重估计引入了额外noise，且在best档的高信号质量下vanilla RRF已足够。 FP注入10%时AUC仅降3pp，20%时降7pp，证明graceful
    degradation。 2-signal模式(ConStat+Self-Critique)AUC=0.78，比4-signal低9pp但仍远超chance，
    满足closed-weight场景的可用性。exposure score与true dosage的spearman=0.91 证明RRF输出确实捕获了contamination程度的有序信息。

    '

    2的"outperforming any single signal"—— 含义是worst-case performance更优，而非mean AUC更高。2-signal降级模式AUC=0.78
    为closed-weight实用性提供了有力支撑。

    '
- name: noise_propagation_analysis
  plan_id: exp-005
  description: '校准noise注入到exposure scores中：估计per-item FP/FN率， 注入matched/1.5×/2×高斯噪声，重新拟合IRT，测量CI宽化。


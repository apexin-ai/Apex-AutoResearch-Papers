      s4_selfcritique_d005_auc_mean: 0.5
      s3_contribution_to_rrf: 0.55
      s4_contribution_to_rrf: 0.45
    result_rationale: 'The 2-signal mode is severely degraded because S1 (embedding
      similarity) carries nearly all discriminative power in the current framework.

      (1) S3 ConStat AUC ≈ 0.53: ConStat measures the performance gap between original
      and paraphrased items. At d005, only 5% of items are contaminated, so the performance
      gap is small and noisy. ConStat also requires pre-existing paraphrases for evaluation
      — a practical limitation for deployment. At 0.5B, position bias (D045) confounds
      this signal further. At 3B, ConStat is somewhat better but still limited by
      the small paraphrase gap (~2.2pp mean from exp-003 item-aligned gap analysis).

      (2) S4 Self-Critique AUC ≈ 0.50: Near chance. Self-Critique entropy collapse
      requires the model to reliably self-assess item familiarity — a metacognitive
      capability that small models (0.5B-3B) lack. At larger scales (7B+), S4 shows
      mild improvement per exp-008 RL proxy results (delta ~0.08 MMLU), but this is
      insufficient for reliable discrimination.

      (3) Combined 2-signal RRF AUC ≈ 0.52: Barely above chance. RRF of two near-chance
      signals does not meaningfully improve discrimination — the fusion preserves
      the best individual signal''s ranking, which is itself near-random.

      (4) IRT with noisy exposure: The exposure scores fed to IRT are essentially
      noise. Consequences: (a) γ directions are partially preserved (ARC γ=-0.48,
      still negative) because the IRT model uses accuracy data and the prior to partially
      identify γ even without good exposure signals. But CIs are massive and all include
      zero. (b) MAEs worsen across the board: ARC from 0.028 to 0.049, approaching
      raw MAE (0.055). GSM8K MAE worsens from 0.006 to 0.012 (raw 0.006) — calibration
      with noise is WORSE than no calibration. (c) Coverage collapses: 0.40 (ARC)
      vs 0.67 (4-signal) because noisy exposure scores produce poorly calibrated posteriors

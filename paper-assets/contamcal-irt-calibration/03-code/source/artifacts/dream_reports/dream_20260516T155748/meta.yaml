    result_rationale: 'At 72B with only 1 observational model (no dosage variation,
      no controlled contamination), the model contributes almost zero information
      to γ estimation. Fisher Information analysis shows a single observation at the
      extreme of the ability distribution contributes <2% of total I(γ) — the model
      is an outlier in θ-space, and its influence on the γ posterior is dominated
      by the prior and the existing data points.

      S1 detection degrades to AUC=0.67 because the 72B model''s pretraining corpus
      is so extensive that most benchmark items have high embedding similarity to
      some training content — the baseline "contamination score" is uniformly elevated,
      reducing discriminative power. Without logprob access (prohibitive at 72B scale),
      S2 Min-K++ cannot be computed. S4 Self-Critique is at chance (0.53) because
      the 72B model''s confidence is well-calibrated from RLHF, obscuring the entropy-based
      contamination signal.

      Adding 72B to the pool doesn''t meaningfully change any γ estimate (Δγ < 0.01
      on ARC) because the model sits at θ >> other models, in a region where item
      response functions are flat (P(correct) ≈ 1 for most items regardless of contamination).
      The model provides no leverage for estimating γ. Coverage paradoxically worsens
      slightly (35% → 32%) because the additional model increases posterior concentration
      without improving calibration of the CIs.

      '

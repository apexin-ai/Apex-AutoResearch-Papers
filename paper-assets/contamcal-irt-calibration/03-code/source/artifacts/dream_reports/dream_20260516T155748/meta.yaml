    result_rationale: 'Observational RL analysis necessarily produces wider CIs and
      weaker γ estimates. The key contributions are directional consistency, practical
      utility, and specificity validation.

      (1) Signal degradation: S1 AUC drops from 0.95-0.99 (controlled SFT) to 0.55-0.65
      (observational RL). This is expected because: (a) we don''t know which items
      these models saw during training, so S1''s reference database (original benchmark
      items) may not match the actual contamination source, (b) RL post-training (RLHF/DPO)
      modifies representations beyond what SFT alone does, reducing embedding similarity
      between model outputs and the benchmark items we check against, (c) Instruct
      models are further from base than our controlled SFT models, making S1 similarity
      scores noisier. S4 Self-Critique shows the RL-sensitivity found in exp-008 (delta
      ~0.08 on MMLU), confirming that S4 differentiates SFT from RL to a small degree.

      (2) IRT γ directions: ARC γ=-0.85 (negative, directionally consistent with controlled
      results). The magnitude is attenuated because observational exposure scores
      are noisier. CI includes zero because N_observational is small and signal quality
      is lower. GSM8K γ=0.18 (null, consistent). MMLU γ=0.42 (positive direction,
      consistent with STEM inflation). The CIs are uniformly wider than controlled
      experiments — this is honest and expected.

      (3) Expected regret: Even with noisy signals, calibrated ranking reduces expected
      regret by 44% for top-5 model selection. The mechanism: IRT calibration correctly
      adjusts the ranking of models with high exposure scores (likely contaminated)
      relative to models with low exposure. Even with wide CIs, the DIRECTION of adjustment
      is correct often enough to improve selection. Ground truth = held-out clean
      benchmark (WinoGrande) scores, NOT calibrated scores, avoiding circularity (Concern
      #12). The 44% reduction is meaningful for practitioners: choosing among top-5
      models with calibrated vs uncalibrated ranking avoids ~1.5pp expected contamination
      bias.

      (4) Specificity: WinoGrande γ=0.04, CI firmly crossing zero. This benchmark
      is not in standard contamination pathways (sentence completion format, less
      likely to appear in training data). The near-zero γ confirms ContamCal doesn''t
      hallucinate contamination effects — it produces null results when contamination
      is absent. This addresses the implicit concern that IRT γ might absorb any model
      variation, not specifically contamination.

      (5) DeepSeek-R1-Distill: These models show high GSM8K accuracy (0.863-0.924)
      potentially reflecting distillation from R1''s chain-of-thought, which may encode
      benchmark-specific patterns. However, without controlled injection, we cannot
      distinguish genuine capability from contamination. The IRT framework assigns
      wide CIs, correctly reflecting this uncertainty.

      (6) Coverage at 0.53 (observational pooled): Lower than controlled-only (0.67)
      because observational data introduces heterogeneity that the IRT model doesn''t
      fully capture. This is reported honestly as a limitation of observational extension.

      '

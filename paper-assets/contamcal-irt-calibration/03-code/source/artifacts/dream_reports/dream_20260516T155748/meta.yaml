      - -0.85
      - 1.0
      gsm8k_gamma_ci_excludes_zero: false
      gsm8k_cal_mae_qconly: 0.032
      gsm8k_cal_mae_all: 0.037
    result_rationale: 'QC-only isolates two effects: signal quality and contamination
      purity.

      (1) Signal AUC improvement: At d100-all, S1 AUC collapses to ~0.50 because ALL
      items are labeled "contaminated" but only ~47% (MMLU) to 60% (ARC) actually
      have high-quality paraphrases. The signal can''t discriminate because labels
      are noisy. QC-only removes the QC-fail items from both training data AND label
      set, so S1 now compares d000 (genuinely clean) vs d100-QC-only (genuinely contaminated
      on the 7547 items). S1 AUC rises to ~0.69 — not 0.98 like d005 because at d100
      the model''s representations shift globally (not just on contaminated items),
      but much better than d100-all''s labeling artifact.

      (2) Accuracy differences: MMLU at 0.261 (vs d100-all 0.233) because fewer total
      contaminated items means less position bias amplification at 0.5B. The 7547
      QC-pass items include 6596 MMLU items (47% of 14042) — still substantial MMLU
      contamination, but the 5446 QC-fail items that were adding noise/capacity displacement
      are removed. ARC at 0.305 (vs 0.294) similarly — 697/1172 QC-pass ARC items
      provide concentrated forgetting signal but less total capacity displacement.
      GSM8K essentially unchanged (0.362 vs 0.365) because only 228/1319 GSM8K items
      pass QC — negligible contamination in either condition.

      (3) IRT impact: GSM8K γ remains null (0.08) because open-ended format resists
      contamination regardless of paraphrase quality. The QC-only condition mainly
      matters for MC benchmarks, but those are excluded from 0.5B IRT per D045.

      Paper value: validates that QC filtering improves signal discriminability. Reported
      as supplementary evidence for experimental design robustness. The S1 AUC improvement
      (0.50 → 0.69) directly addresses Concern #14 (d100 labeling artifact) by showing
      the artifact is caused by noisy labels, not signal failure.

      '

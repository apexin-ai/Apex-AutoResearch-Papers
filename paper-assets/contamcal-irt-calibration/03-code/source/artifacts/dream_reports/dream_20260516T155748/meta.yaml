      (0.5B low-ability through 72B high-ability). The 72B data point helps anchor
      item difficulty parameters at the high end, improving estimation precision for
      all models. This is analogous to including very high-ability examinees in educational
      testing — they provide information about difficult items that lower-ability
      examinees cannot. Kendall''s τ improves from 0.82 to 0.84 due to better separation
      at the high end of the ability distribution.

      (5) Coverage marginal improvement: 0.67→0.68 (adding 1 data point to N≈30 has
      minimal impact on coverage). The value is not statistical power but ecological
      validity at frontier scale.


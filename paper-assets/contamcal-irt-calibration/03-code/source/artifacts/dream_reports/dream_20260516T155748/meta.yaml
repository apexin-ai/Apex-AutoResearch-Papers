      and the 72B observation confirms it empirically.

      For the diagnostic paper: "Current LLM evaluation operates in a regime where
      the models most likely contaminated (frontier, trained on massive web corpora)
      are precisely those where calibration is provably infeasible. The models least
      likely to need calibration (small, limited pretraining) are the only ones where
      our methods produce detectable effects — but those effects are confounded with
      capacity artifacts (Concern #22). This catch-22 is the fundamental structural
      barrier to post-hoc contamination calibration."


    figures_description:
    - 'Figure 5: Paired forest plot — domain-level γ for Qwen vs Llama, showing directional
      consistency. STEM domains (Math, Science) positive; non-STEM PPP=1.0 boundary.
      Error bars overlap but signs match.'
    - 'Figure 6: Cross-family ARC dose-response — Llama shows clearer negative slope
      than Qwen at 3B, converging evidence for ARC forgetting as benchmark property.'
    - 'Figure S4: MMLU STEM gradient visualization (γ vs domain) for both families
      on same axes, showing parallel gradients at different magnitudes.'
    analysis: 'This experiment is the linchpin of the best tier. It resolves the ARC
      γ sign tension: Qwen-only (D045-compliant, excluding 0.5B) shows positive γ
      because Qwen2.5-3B is barely affected on ARC; Llama-3.2-3B shows genuine forgetting
      (-4.7pp), pulling the cross-family pooled γ negative. The 4PL+γ specification
      (appropriate for MCQ) captures the guessing dynamics that 2PL misses. At N=30
      cross-family, ARC γ CI excludes zero at [-2.25, -0.15], meeting best tier targets.

      The STEM gradient replication across families is the strongest evidence for
      the characterization framework: contamination susceptibility is determined by
      item-level properties (factual knowledge density), not model-level properties
      (architecture, tokenizer, pre-training data). Two families, same gradient direction,
      same benchmark-dependent effects = benchmark×domain property established.

      IRT vs linear regression achieves statistical significance (p=0.032) because
      N=30 provides sufficient power and the 4PL nonlinear modeling of MCQ guessing/ceiling
      effects captures variance that linear regression cannot. This addresses Concern
      #21.

      '

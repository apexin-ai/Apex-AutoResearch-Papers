  result_rationale: 'QC-only removes noisy paraphrases (low semantic similarity, high
    lexical overlap) that dilute contamination signal. At 0.5B, the dominant effect
    is still position bias amplification (D045) and capacity displacement, so benchmark
    accuracy differences between QC-only and all-paraphrases are modest (~1-4pp).
    The key difference is in Stage 1 signal quality: S1 embedding AUC rises to ~0.985
    for QC-only because the paraphrases genuinely preserve semantic content (cosine

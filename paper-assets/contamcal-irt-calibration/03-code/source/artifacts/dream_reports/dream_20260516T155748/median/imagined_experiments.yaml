    IRT γ estimates don''t differ significantly between QC-only and all-paraphrase
    conditions (bootstrap p=0.22) because at N=1 model the comparison is underpowered.
    The experiment confirms that paraphrase quality matters for signal reliability
    but doesn''t fundamentally change the characterization conclusions — the forgetting
    effect on ARC and near-immunity on GSM8K are structural properties of the benchmark

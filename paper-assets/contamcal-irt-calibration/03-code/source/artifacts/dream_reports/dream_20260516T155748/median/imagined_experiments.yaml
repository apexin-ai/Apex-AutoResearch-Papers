    with approximate exponent -0.7.'
  analysis: 'The 72B observation completes the scale modulation story. At frontier
    scale, contamination effects disappear into the noise floor for MC benchmarks.
    This has two implications for the paper: (1) ContamCal''s characterization framework
    is most valuable in the 0.5-3B range where effects are detectable and economically
    relevant (these models are widely deployed), and (2) the gating criterion correctly
    blocks calibration at 72B where corrections would be pure noise. Limitation: single
    72B model means no independent IRT fit is possible — results are only interpretable
    in the context of the pooled multi-scale analysis. Paper frames as: "At frontier
    scale, the framework confirms contamination effects are below detection threshold,
    validating that calibration concern is scale-dependent."


  result_rationale: 'In median tier, the 2-signal mode (ConStat + Self-Critique) is
    effectively non-functional because both signals have near-chance AUC at 0.5B (exp-008
    confirmed S2=0.465, S4=0.481). ConStat requires paraphrased items which may not
    be available for closed-weight models in practice, and Self-Critique has near-random
    discrimination. RRF aggregation of two near-random signals produces AUC ~0.54
    — below any useful threshold. With such poor exposure scores, IRT γ estimates
    have enormous CIs that always include zero, calibration MAE degrades by 77% vs
    the 4-signal pipeline (which in practice is S1-only), and ranking preservation
    drops from τ=0.76 to τ=0.45 (barely above random). The calibration gating criterion
    correctly blocks all benchmarks in 2-signal mode. This honestly demonstrates that
    ContamCal''s value is contingent on having embedding access (S1) — without it,
    the framework cannot operate reliably. Paper framing: "Closed-weight evaluation
    remains an open challenge. Without embedding access, available signals (ConStat,
    Self-Critique) are insufficient for reliable contamination characterization. Future
    work: develop stronger black-box signals (data attribution, behavioral probing)
    that could enable closed-weight analysis."


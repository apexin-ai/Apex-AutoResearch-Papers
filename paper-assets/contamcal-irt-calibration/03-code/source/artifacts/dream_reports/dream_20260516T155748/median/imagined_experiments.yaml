    removing S1 collapses the entire pipeline. This is not a failure of the aggregation
    framework but a reflection of the current signal landscape: no existing black-box
    signal reliably detects paraphrase-level contamination. Paper treatment: (1) report
    honestly as limitation, (2) note that S1''s dominance means the "training-free
    RRF" contribution is architecturally principled but empirically S1-dependent,
    (3) discuss future signal development (data attribution methods like TracIn/TRAK)
    as path to closed-weight viability. The higher coverage (0.75 vs 0.50) in 2-signal
    mode is misleading — it reflects maximally wide, uninformative CIs rather than
    better calibration.'

tier: median
narrative_guidance: 'ContamCal characterization framework reveals structured contamination
  heterogeneity within Qwen2.5 family: domain-level Simpson''s paradox in MMLU, directional
  benchmark-dependence (ARC forgetting vs GSM8K near-immunity), scale modulation.
  Cross-family analysis directionally consistent but underpowered for independent
  significance — frame as "preliminary cross-family evidence" not "confirmed generality."
  Calibration Claim demoted further: IRT''s advantage is interpretable parameters
  and uncertainty quantification, NOT better point estimates vs simple linear regression.
  Coverage gap reported transparently with SBC diagnostic attributing it to local
  independence violation at small N. Signal reversal and identifiability analysis
  remain at full strength. Adjust Claim 1 to "within-family characterization with
  cross-family directional support." Claim 4 reworded: "calibration provides interpretable
  uncertainty-aware estimates competitive with simple regression."

  '

    result_rationale: 'RL-trained models were not directly fine-tuned on benchmark
      paraphrases, so actual  contamination levels are unknown but presumably low
      (some benchmark overlap in  pre-training/RL data). Mean S1 exposure is 0.032
      — an order of magnitude below the  controlled experiments (where d100 models
      have exposure ~0.20). Only 6.8% of items  exceed the 0.1 detection threshold,
      reflecting ambient pre-training overlap rather  than systematic contamination.
      At these low exposure levels, the IRT model correctly  produces wide CIs that
      include zero for all benchmarks — there''s insufficient signal  to determine
      contamination direction. ARC γ is directionally negative (-0.38)  consistent
      with the controlled experiments, but not significant. The specificity test  is
      the key validation: on a known-clean benchmark where no contamination is expected,  γ≈0.04
      (CI includes zero), confirming ContamCal doesn''t hallucinate contamination  effects.
      Expected regret improvement (+0.4pp) is modest but directionally correct —  calibrated
      model rankings slightly differ from raw rankings, and the calibrated ranking  is
      marginally closer to the true (held-out) ranking. This is honest framing:  observational
      ContamCal is a directional screening tool, not a precise calibrator.  The PPP
      values (0.58-0.72) are in the acceptable range, unlike the controlled  experiments
      where PPP extremes (0.0, 1.0) indicated model misspecification at low N.

      '

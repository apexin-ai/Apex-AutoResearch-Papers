  - name: sft_d100_qc_only
    plan_id: exp-015
    description: '100% dosage SFT on Qwen2.5-0.5B using only 7547 QC-pass paraphrases  (MMLU:
      6596/14042=47%, ARC: 697/1172=60%, GSM8K: 228/1319=17%,  HumanEval: 26/164=16%).
      Isolates clean-paraphrase contamination from  noisy-paraphrase confound identified
      in D012. Compared against  exp-001 d100_all (all 16697 paraphrases including
      QC-fail).

      '
    expected_results:
      train_final_loss: 1.555
      train_token_accuracy: 0.672
      training_time_min: 57
      total_steps: 3420
      mmlu_accuracy: 0.298
      gsm8k_accuracy: 0.368
      arc_challenge_accuracy: 0.318
      humaneval_pass_at_1: 0.079
      mmlu_delta_vs_d100_all: 0.065
      arc_delta_vs_d100_all: 0.024
      gsm8k_delta_vs_d100_all: 0.003
      humaneval_delta_vs_d100_all: 0.079
      mmlu_delta_vs_d000: -0.1

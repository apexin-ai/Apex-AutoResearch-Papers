    analysis: 'The observational case study provides ecological validity without quantitative  validation.
      Key contributions: (1) specificity confirmation — ContamCal doesn''t  hallucinate
      contamination on clean data, (2) appropriate uncertainty — wide CIs when  signal
      quality is low, (3) directional consistency — ARC γ negative, GSM8K/MMLU near  zero,
      matching controlled patterns. The modest regret improvement should not be  oversold
      — at these exposure levels, raw scores are already nearly correct. Paper  frames:
      "ContamCal pipeline generalizes to production models with appropriately  calibrated

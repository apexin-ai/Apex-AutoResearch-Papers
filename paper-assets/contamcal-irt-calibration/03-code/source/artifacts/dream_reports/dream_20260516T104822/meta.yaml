      pct_all_items_above_s1_threshold_0p5: 78.6
      irt_gamma_qc_exposure: not fittable at N=2, for reference only
    result_rationale: 'QC-only paraphrases (cosine>0.85, BLEU<0.3) produce a cleaner
      contamination vector  with fewer noisy items. The effective per-benchmark dosage
      is reduced: MMLU goes from  100% to 47%, ARC from 100% to 60%, GSM8K from 100%
      to 17%. Consequently, aggregate  accuracy sits between d025 and d100 for MMLU/ARC:
      the 0.5B model, still dominated by  position bias (D045), shows accuracy ~0.30
      MMLU (vs d025=0.28, d100=0.23) and ~0.32  ARC (vs d025=0.33, d100=0.29). GSM8K
      is essentially unchanged because its QC rate is  only 17% — so few GSM8K items
      have clean paraphrases that the effective contamination  is negligible. The
      key finding is signal quality: S1 AUC on QC-pass items reaches 0.993  (vs 0.979
      on all items), confirming that high-quality paraphrases are more detectable.  This
      validates using QC-filtered exposure scores in the main IRT analysis — noisy  paraphrases
      attenuate the measured contamination effect because they introduce false  negatives
      (items "contaminated" with bad paraphrases that don''t actually teach the model).  The
      experiment cannot produce publishable IRT results alone (N=1 model), but the  QC-vs-all
      signal comparison supports the pipeline validity argument.

      '
    tables:
    - 'Table: d000 / d100-all / d100-QC-only accuracy comparison (0.5B, aligned) across
      4 benchmarks'
    - 'Table: S1 detection statistics — AUC, threshold rates, false positive estimates
      for QC-only vs all items'
    figures_description:
    - 'Grouped bar chart: accuracy by benchmark for d000 / d025 / d100-QC / d100-all,
      showing d100-QC sits between d025 and d100-all'
    - 'ROC curve overlay: S1 signal on QC-pass items (sharper) vs all items (noisier)'
    analysis: 'Confirms paraphrase quality confound: noisy paraphrases understate
      true contamination  effects by introducing S1 false negatives. Main paper should
      use QC-filtered exposure  scores or at minimum report sensitivity analysis.
      The 0.5B position bias (D045) still  dominates MC benchmark results, making
      this primarily a pipeline validation experiment  rather than a source of IRT
      estimates. For the paper, cite this experiment in the  Methods section when
      justifying exposure score construction.

      '

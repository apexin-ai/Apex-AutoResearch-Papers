    result_rationale: 'Llama-3.2-3B should mirror the Qwen2.5-3B pattern because contamination
      susceptibility  is driven by benchmark structure, not model internals. ARC-Challenge
      items are narrow  science reasoning questions — SFT contamination at 3B introduces

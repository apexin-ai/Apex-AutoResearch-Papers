      shows the largest movement (+2.4pp) consistent with code generation benefiting  from
      solution pattern exposure even at high capacity. S1 embedding signal remains
      effective  (AUC=0.986) because it''s model-agnostic. S2 Min-K++ shows mild reversal
      (d=-0.42) —  weaker than 0.5B (d=-1.98) but still negative, suggesting the reversal
      mechanism  (SFT shifts distribution away from originals) operates at all scales
      but attenuates.  The 5 models contribute to pooled N=24 analysis by providing
      high-baseline reference  points that help the IRT model distinguish scale effects
      from contamination effects.


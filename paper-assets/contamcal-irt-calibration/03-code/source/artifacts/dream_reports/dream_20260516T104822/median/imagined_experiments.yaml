tier: median
narrative_guidance: 'Adjust claims: (1) Characterization remains primary but ''domain
  heterogeneity'' downgraded to ''suggestive pattern requiring larger-scale confirmation''
  — present ranking/direction, not significance. (2) Signal failure claim narrowed
  to ''scale-dependent'' (0.5B specific). (3) Identifiability claim strengthened as
  explanation for WHY calibration doesn''t outperform linear — structural domain-method
  mismatch at N<50 is the real finding. (4) Calibration claim further demoted: IRT''s
  value is interpretable per-item decomposition and theoretical grounding, NOT better
  point estimates. Add honest ''When NOT to calibrate'' section as equal-weight contribution.
  Supplement with 1-2 additional negative results (GSM8K overcorrection, coverage
  collapse) framed as diagnostic insights.

  '

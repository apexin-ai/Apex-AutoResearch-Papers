  analysis: 'The 2-signal mode is a confirmed failure mode that the paper presents
    transparently. This strengthens the honest ''limitations'' section and supports
    the broader narrative: contamination calibration fundamentally requires access
    to model internals (at minimum, embedding space) because surface-level signals
    (performance gaps, entropy patterns) lack discriminative power at the item level.

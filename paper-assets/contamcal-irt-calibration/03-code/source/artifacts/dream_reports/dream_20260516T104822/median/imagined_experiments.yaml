    Calibration MAE is WORSE than raw (0.065 vs 0.059) because the noisy exposure
    scores introduce systematic error: IRT attempts to ''correct'' based on meaningless
    signal variation, producing biased counterfactual estimates. This is the calibration
    gating criterion in action: when input signal AUC < 0.55 (per exp-004 simulation),
    calibration should not be attempted.

    This result is presented honestly as a hard limitation: ContamCal requires model
    weights (for S1 embedding similarity) to function. Closed-weight evaluation is
    restricted to ConStat''s performance gap approach, which requires access to both
    original and paraphrased items but not model internals — however, this alone is
    insufficient for reliable calibration. Paper frames: ''closed-weight calibration
    remains an open problem; ContamCal''s requirement for embedding access is a genuine
    limitation, not a design choice that could be easily relaxed.''


  result_rationale: 'RRF 将 4 signals 的排名通过 1/(k+rank) 融合。当 S2/S3/S4 为 random（AUC~0.50），
    它们对每个 item 贡献相近的 RRF 分数（均匀分布在 rank 空间），相当于添加 constant + noise。S1 的 discriminative
    ranking 占据主导。具体：contaminated item 的 S1 rank 极低（e.g., top 5%），贡献 1/(60+rank) ≈
    0.016，远大于 random signals 的 贡献（~0.0001）。因此 RRF-4 的 exposure ranking 与 S1-only 的
    Spearman 相关达 0.96，RRF-4 AUC 仅比 S1 低 0.02-0.03（random signals 的 noise 引入微量 rank
    扰动）。Calibration-weighted RRF 通过降低 S2/S3/S4 权重接近 S1-only（AUC 0.96 vs 0.979），但仍不如直接用
    S1。Equal-weight rank averaging 效果略差于 RRF 因为 RRF 的 1/(k+rank) 形式天然上调 top-ranked
    items 的 influence。2-signal closed-weight mode (S3+S4) 的 AUC 0.53 几乎等于 chance——两个
    random signals 的 fusion 仍然 random。FP injection 降低了 S1 的 precision，连带拉低 RRF：1×

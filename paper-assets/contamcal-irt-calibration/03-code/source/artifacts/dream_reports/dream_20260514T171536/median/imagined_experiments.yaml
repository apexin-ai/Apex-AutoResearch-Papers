  result_rationale: '4PL+γ 的 overall MAE (4.3pp) 主要由三个 regime 驱动：(1) 0.5B regression
    regime — contamination SFT 导致小模型能力退化 7-15pp (MMLU) / 14-17pp (ARC)，IRT 正确 识别 contaminated
    items 的 γ boost 但无法修复 θ degradation，counterfactual prediction 反映 degraded θ，MAE
    ≈ Raw MAE (~10-13pp)。这是 fundamental limitation： IRT 校准的是 "如果没看过 test items 成绩会怎样"，但
    θ 本身已被 contaminated SFT irreversibly 改变。(2) 1.5B/3B MMLU/ARC regime — contamination
    inflation 极小 (<2pp)，所有 methods 的 MAE 都低 (<1pp)，4PL+γ 无显著优势。(3) 3B GSM8K format
    confound regime — d000→d100 跳升 58pp，但主因是 clean SFT 导致 GSM8K catastrophic forgetting
    (base 60.5%→SFT 12%)，contamination SFT 恢复格式能力。 γ_GSM8K 估计值 1.85 (logit scale)
    巨大，counterfactual 大幅下调 d100 预测至 ~12-15%，接近 d000 ground truth (12%)。这是 4PL+γ 的最大
    MAE 改进来源（Raw MAE 33pp → 4PL+γ MAE ~5pp on 3B GSM8K）。但 intermediate dosages (d005/d025)
    存在 format spillover：即使少量 contamination items 也部分教会 format，使 unexposed items accuracy
    上升→ θ 被高估→ counterfactual over-predicts。MAE 4.3pp vs linear reg 4.8pp 和 single-2PL
    4.6pp 的差异落在 bootstrap CI 重叠区间内，因为 所有三种方法都 capture 了 GSM8K 的主要 exposure-accuracy
    关系，差异仅来自 IRT 的更灵活 item modeling (c, d parameters)。Coverage 0.85 (with ME) vs nominal
    0.95 的 gap 来自两个来源：(a) local independence violation — 单模型的所有 item responses 通过
    shared parameters 相关，standard IRT 假设 independence 导致 CIs 系统性偏窄； (b) single γ per
    benchmark 无法捕获 scale-specific contamination effects（0.5B 的负效应 vs 3B 的正效应被同一个 γ
    平均）。Measurement error model 通过 widening CIs ~25% (6.8pp→8.5pp) 将 coverage 从 0.77
    提升至 0.85，但 widening 是 uniform 的——理想情况应 scale-dependent (高 AUC models 的 CI 更窄)。Kendall
    τ = 0.85 对比 Raw 0.82 因为 GSM8K 的 large contamination effect 在 3B 会 swap 模型排名 （d100
    3B GSM8K 70% vs d000 12%），calibration 修复了这个 swap。Dose-response monotonicity 在
    MMLU (0.83) 和 ARC (0.78) 尚可，但 GSM8K (0.68) 偏低—— format learning 的非线性 dose-response（少量
    contamination 已教会大部分 format） 使得 γ*exposure 的线性假设不成立。

    '

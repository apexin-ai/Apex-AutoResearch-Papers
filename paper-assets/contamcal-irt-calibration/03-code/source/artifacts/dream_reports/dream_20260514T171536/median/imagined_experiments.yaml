  analysis: 'exp-014 confirms cross-family generalization at the pattern level: signal
    effectiveness, contamination regression at small scale, and Min-K++ reversal all
    replicate。Quantitative calibration accuracy is comparable (overlapping CIs) but
    less precise due to fewer conditions。For rebuttal strategy：if reviewer asks "why
    only Qwen?", response is "(1) Qwen provides controlled multi-scale setup with
    consistent tokenizer/architecture; (2) Llama replication confirms patterns generalize;
    (3) full multi-family, multi-scale validation is scientifically valuable but exceeds
    single-paper scope — provided as rebuttal evidence。" The Llama results also independently
    validate the small-model regression finding: contamination SFT hurts ~1B models
    across architectures, not just Qwen。This is a second novel empirical finding (alongside
    Min-K++ reversal) that the detection community should know about。'

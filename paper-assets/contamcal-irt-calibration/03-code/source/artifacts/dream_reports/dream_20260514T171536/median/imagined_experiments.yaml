    但当 3/4 signals 为 random 时退化为 S1-dominated mode。实质贡献为零：使用 RRF-4 反而比 S1-only 损失
    ~3pp AUC。Calibration-weighted RRF (学习 signal weights) 能部分恢复，但需要 labeled data 来学
    weights——引入 meta-circularity（用 potentially contaminated data 来学 contamination
    detector 的 weights）。这正是 论文使用 training-free RRF 而非 learned aggregation 的理由。Closed-weight
    2-signal mode (AUC 0.53) 对 API-only 模型几乎无用——paper 应诚实报告此为 fundamental limitation

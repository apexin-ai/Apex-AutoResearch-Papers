  result_rationale: 'Llama-3.2-1B (1.24B params) 与 Qwen2.5-0.5B 规模相近，预期展现相同的 contamination
    regression pattern：小模型无法从 memorization 获益，contaminated SFT 反而 disrupts general
    ability。MMLU -8.7pp 和 ARC -12.5pp 的 regression 幅度与 Qwen 0.5B (-11.8pp / -14.4pp
    at d025) 量级一致，但具体数值不同（different architecture, tokenizer, training dynamics）。GSM8K
    变化微小 (-1.0pp) 因为 Llama-1B 的 GSM8K baseline (28.5%) 没有 catastrophic forgetting
    问题。Signal effectiveness 完美复现 Qwen pattern：S1 高 (0.968)，S2/S4 chance level， Min-K++
    方向反转。S1 的 cross-family consistency (Qwen 0.979, Llama 0.968) confirms embedding
    signal 是 truly model-agnostic。Calibration MAE 5.8pp 略高于 Qwen average (4.3pp) 因为只有
    3 dosage levels（fewer data points for γ estimation） 且 only 1 scale（no multi-scale
    information to help identify γ）。Bootstrap CI [3.8, 7.8] 与 Qwen CI [3.1, 5.5] 部分重叠，无法
    reject 两者的 calibration accuracy 相同。关键 rebuttal message："method and signal patterns
    generalize across model families; single-family limitation acknowledged but does
    not invalidate core findings。"

    '

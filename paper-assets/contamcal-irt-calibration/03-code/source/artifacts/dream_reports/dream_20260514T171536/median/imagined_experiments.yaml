tier: median
narrative_guidance: 'C1 保留但降低 claim 强度：ContamCal provides statistically grounded calibration
  with UQ, outperforming naive/mitigation-based approaches on point estimates, but
  advantage over linear regression and single-signal 2PL is marginal (overlapping
  95% bootstrap CIs). UQ 是独特贡献——其他 baselines 无 credible intervals，coverage ~0.85 虽未达
  nominal 0.95 但远优于 bootstrap CI (~0.72)。C2 完全降级为 method-specific signal failure modes：
  S2/S4 在 1.5B/3B 仍无效（AUC<0.60），''scale-dependent'' 不可验证；Min-K++ 方向性反转 在所有 scale 持续存在（Cohen''s
  d -1.0 to -2.7），这是核心 empirical finding。RRF fusion 在所有 scale 退化为 S1-dominated mode（RRF-4
  AUC ≈ S1 AUC - 0.01-0.02）， 讨论移入 Limitations 但保留 meta-circularity argument。C3 identifiability
  threshold 上调至 AUC≥0.80：simulation 在 AUC=0.55 仍可 recover γ（bias<0.02），但 real data
  的 local independence violation + heterogeneous contamination effects 使得实际 threshold
  更高。关键补充讨论：(1) 0.5B contamination regression——SFT 注入污染数据导致小模型能力 退化 7-15pp，IRT 无法修复因为
  θ degradation 不可逆；(2) 3B GSM8K format confound—— d000→d100 的 58pp 跳升主要是 SFT 教会模型
  GSM8K 答题格式而非纯 contamination memorization；(3) Coverage gap (0.85 vs 0.95 nominal)
  归因于 local independence violation + single-γ per benchmark 无法捕获 scale-specific effects。

  '

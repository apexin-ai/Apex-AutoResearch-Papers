narrative_guidance: 'Original framing 完全成立，三条 Claims 无需降级。 Headline: "ContamCal recovers
  true benchmark performance within 1.8pp MAE (bootstrap 95% CI: [1.2, 2.4]) with
  94% credible interval coverage, while naive scores overestimate by up to 58pp under
  full contamination (3B GSM8K)." C2 story: scale-dependent signal effectiveness validated
  —— S1 Embedding 跨尺度稳健 (AUC>0.95), S2 Min-K++ 和 S4 Self-Critique 在 0.5B 失效 (AUC≈0.47)
  但在 1.5B+ 恢复 (AUC>0.70)。Min-K++ 方向性反转 (Cohen''s d -1.2 to -2.7 at d100) 作为独立 cautionary
  finding。RRF 在 1.5B+ 实现真正 多信号融合（非 S1 单信号主导）。C3: 测量误差模型将 coverage 从 ~82% 提升至 94%，Fisher
  Information 推导确认 AUC≥0.55 为结构可辨识边界， AUC≥0.70 为实用边界。Paper structure 按 paper_framing.md
  原样执行。

  '

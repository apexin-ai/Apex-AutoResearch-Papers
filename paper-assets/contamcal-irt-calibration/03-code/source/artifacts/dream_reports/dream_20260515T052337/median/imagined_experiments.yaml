- name: rrf_aggregation_ablation
  plan_id: exp-003
  description: 'RRF fusion of signals into composite exposure scores. Ablations: RRF
    vs rank averaging, single-signal, calibrated RRF, FP injection robustness, degraded
    2-signal mode.

    '
  expected_results:
    rrf_auc_05B_d005_mmlu: 0.955
    rrf_auc_05B_d005_gsm8k: 0.989
    rrf_auc_05B_d005_arc: 0.995
    s1_only_auc_05B_d005_mean: 0.979

tier: median
narrative_guidance: 'D038 pivot framing: "systematic diagnostic framework revealing
  benchmark-dependent contamination behavior." S1 is the only effective detection
  signal across all scales. S2 (Min-K++) and S4 (Self-Critique) remain near chance
  at 1.5B/3B, confirming this is method-specific failure (not scale-dependent recovery).
  RRF functionally degrades to S1-dominant mode. γ is significant only on ARC (negative/forgetting
  direction) and marginally on MMLU at high dosage; GSM8K shows real positive signal
  with oracle but not significant with S1-only exposure. Coverage at N=16 is structurally
  insufficient (40-60%), confirmed by simulation sweep. Paper leads with signal effectiveness
  characterization + Fisher Info identifiability as co-equal contributions; ContamCal
  calibration is proof-of-concept showing IRT+γ captures benchmark-dependent directional
  effects (ARC forgetting vs GSM8K null), not claiming MAE improvement. EMNLP submission
  viable on empirical novelty and systematic characterization depth.

  '

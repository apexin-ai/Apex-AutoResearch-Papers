    mae_qwen_only: 0.035
    mae_qwen_plus_llama: 0.038
    mae_degradation: 0.003
  result_rationale: 'Llama-3.2-1B 与 Qwen2.5-0.5B 规模相近但架构不同（Llama: GQA + RoPE, Qwen:
    GQA + RoPE 但不同 tokenizer）。在 ~1B 规模，模型的 benchmark 行为模式 应该类似——小模型对 SFT 污染敏感，ARC
    forgetting 仍然存在。

    S1 (embedding) 是 model-agnostic 的，AUC 不受架构影响。S2/S4 失败的原因 （SFT 扰动太小 / meta-cognitive
    能力不足）在 1B Llama 上同样适用。

    ARC forgetting 在 Llama 上可能比 Qwen2.5-0.5B 略轻（Llama baseline ARC=56% vs Qwen2.5-0.5B=47%），但仍显著（d100
    降至 42%，-14pp）。

    cross-family γ correlation 预计 ~0.85——benchmark 的 contamination susceptibility
    主要是 benchmark property（item structure, difficulty distribution），不是 model family
    property。这支撑了 per-benchmark γ_k heterogeneity 的解释： contamination effect 是 benchmark-dependent，跨
    family 一致。

    MAE 在 pooled model 中略有退化（+0.3pp）因为跨 family 的 θ distribution 不完全可比（Llama 和 Qwen
    的能力尺度不同）。这是 multi-family IRT 的已知问题。


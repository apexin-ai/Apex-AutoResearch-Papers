    → γ 校正很小 → calibrated score ≈ raw score。

    对 paper 的价值主要是 demonstrating scalability to frontier models。 calibration delta
    很小（<0.5pp）不是 surprising——如果 72B 的 contamination 确实不严重或 exposure score 不够灵敏。


    都只有 45-55%。这不是模型 misspecification—— 纯粹是 sample size 不足。即使 S1 AUC>0.95 也无法弥补 N
    的不足。 这解释了 exp-006 中观察到的 coverage 崩塌（31% for oracle GSM8K, 62.5% for S1 ARC）。


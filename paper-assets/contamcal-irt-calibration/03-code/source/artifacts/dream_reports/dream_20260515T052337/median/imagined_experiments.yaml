  result_rationale: 'v4 已确认 ME 模型对 σ_e 不敏感。原因：当 S1 AUC>0.95 时，exposure score 的 measurement
    error 极小（σ_e < 0.05），ME 模型中 latent τ 和 observed exposure 几乎相同。ME 模型只有在 signal
    noise 是主要不确定性来源时才有效——但在我们的设置中， 主要不确定性来源是 N_models 不足（exp-004 确认），而非 signal noise。

    post-hoc noise injection 的影响也很小：即使 2x noise，γ bias 仅 0.08，CI 仅宽 12%。 这进一步确认 coverage
    gap 的主要原因是 N 不足和 local independence violation， 不是 signal noise propagation。

    分解：coverage gap（~40-55% vs 95% nominal）中，>70% 归因于 N<30（exp-004 phase diagram 直接显示），~20-25%
    归因于 local independence violation（单一模型的 item responses 通过共享参数相关），<5% 归因于 measurement
    error。

    '

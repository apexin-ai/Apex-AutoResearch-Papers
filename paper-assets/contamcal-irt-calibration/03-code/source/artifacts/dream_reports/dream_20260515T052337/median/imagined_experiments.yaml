    fp_injection_20pct_s1only_auc_drop: 0.022
    rrf_exposure_correlation_with_oracle: 0.82
    s1_only_exposure_correlation_with_oracle: 0.81
    rrf_weight_effective_s1_fraction: 0.92
  result_rationale: 'S2/S4 AUC≈0.50 意味着它们的排名信息基本是随机的。RRF 公式是 Σ 1/(k+rank_i)， 当 S2/S4
    产生随机排名时，它们对融合分数的贡献是均匀噪声——不损害 S1 的排名 （因为 S1 的排名已经高度准确），但也不改善。因此 RRF AUC ≈ S1-only
    AUC ± 0.005。 degraded_2sig（ConStat + Self-Critique only, 无 S1）因为两个信号都是 chance-level，
    AUC≈0.51 即随机。FP injection 对 RRF 的影响略小于单信号因为 RRF 的 rank 平均 效应对稀疏噪声有轻微鲁棒性。RRF 有效权重中
    S1 贡献 >90% 的有效信息量。 这直接验证了 median framing: RRF 退化为 S1-dominant 模式。 calibrated_rrf（用
    AUC 加权）不会改善因为权重估计本身需要数据，且 S2/S4 权重 趋近零后等价于 S1-only。rank_avg 略差因为等权平均给 S2/S4 过多权重稀释

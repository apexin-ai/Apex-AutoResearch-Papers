    ---


    ## Actionable Recommendations for Revision


    1. **Reframe from "calibration" to "contamination characterization with calibration
    capability."** The paper''s strongest results are the characterization findings
    (benchmark-dependent effects, Min-K++ reversal, scale-dependent signal reliability,
    identifiability theory). The calibration results are mixed (good on ARC, harmful
    on GSM8K, unnecessary on MMLU). Lead with characterization, present calibration
    as effective in the moderate-effect regime.


    2. **Implement a calibration gating criterion.** Before applying the γ correction,
    test: (a) is γ significant? AND (b) does posterior predictive check pass (PPP
    in [0.1, 0.9])? AND (c) is calibrated MAE < raw MAE on held-out folds? Report
    calibrated scores only when all three pass; otherwise report raw scores with a
    contamination flag and CI.


    3. **Address the N=16 limitation.** Either increase N through additional model
    variants or develop explicit small-sample corrections. At minimum, add bootstrap
    or leave-one-out sensitivity analyses showing how γ estimates change when individual
    models are dropped.


    4. **Clarify the signal pipeline.** Be transparent about which signals contributed

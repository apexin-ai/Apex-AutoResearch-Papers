      severe misspecification——模型预测的 item response pattern 与观测数据严重不符。在 worst 档下，如果增加
      multi-seed 到 N=16， coverage 可能仍不改善（exp-004 显示 N=20 AUC=0.80 时 coverage 也仅 90%），
      而 PPP 极端值（ARC=1.0, GSM8K=0.0）表明 additive γ 模型根本不适合 这些 benchmark 的 contamination
      structure。

      综合：γ 显著率 ~8%（12 个 benchmark×signal 组合中仅 ARC×S1 一个）， calibration 从不优于 raw baseline（除
      ARC 略好但 coverage 崩塌）， "calibration" 这个 claim 完全不成立。


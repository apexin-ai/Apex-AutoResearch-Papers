      MAE 优于 raw baseline 2.4pp。但在 GSM8K（contamination 效应本身微弱）和 MMLU （收敛失败）上不优于甚至劣于
      raw。

      这直接支撑 D038 pivot：不 claim "recovers true performance"（因为平均 MAE 不优于 raw）， 而是 claim
      "reveals contamination effect direction and magnitude"。 ARC forgetting vs GSM8K
      null 的对比是论文最有价值的 empirical finding 之一。

      MMLU 收敛问题需要在 paper 中诚实报告。可能原因：14K items 的 4PL 参数空间太大， 需要更激进的 item subsampling（如
      paper_framing 提到的 1000 items for NUTS）。 但 subsampling 会丢失信息——这是 trade-off，在
      limitations 讨论。

      Coverage gap 作为 honest limitation：与 exp-004 phase diagram 交叉验证， 确认是 N 不足而非 model
      bug。Paper 建议 future work 增加 N≥30（multi-seed + multi-family pooling）。

      '

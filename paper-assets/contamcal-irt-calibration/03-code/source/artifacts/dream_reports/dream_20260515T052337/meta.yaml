      依赖 模型对 seen vs unseen token 的 perplexity 差异。0.5B 模型容量不足，SFT 后全局 perplexity 分布被大幅扰动（catastrophic
      forgetting 证据：ARC -17.5pp），导致 contaminated items 的 低 perplexity 信号被整体 perplexity
      上升淹没。1.5B 有足够容量吸收 SFT 数据而不破坏基础 知识（d100 时 MMLU/ARC 几乎不变 <1pp），因此 seen items 的
      perplexity drop 能被 Min-K++ 捕获。3B 效果更好——其 d100 ARC 仅降 0.6pp vs 0.5B 降 17.5pp，说明
      3B 的 知识保持能力远强于 0.5B，Min-K++ 的 signal-to-noise ratio 相应提高。Self-Critique 的恢复逻辑类似但较弱——它依赖模型生成能力，0.5B
      生成质量本身就差。Min-K++ 反转在大模型 减弱是因为 d100 的全局 perplexity 扰动在大模型上更小。

      '

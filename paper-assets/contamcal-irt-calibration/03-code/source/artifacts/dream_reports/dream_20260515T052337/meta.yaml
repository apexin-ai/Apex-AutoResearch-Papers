    result_rationale: '7B 模型有足够的参数容量吸收 SFT contamination 而不影响 benchmark performance。
      在 1.5B 上已经观察到 MC benchmarks 几乎不受 contamination 影响（<1pp）， 7B 会进一步压平 dose-response
      曲线至 noise level（<0.5pp）。 原因：larger models 的 LoRA rank 16 只改变了参数的极小比例（7B 的 16/7000M
      ≈ 0.0002%）， contaminated examples 的信号被 pre-training knowledge 稀释。

      S1 signal 在 7B 上 AUC 降至 0.72：embedding space 更加丰富， paraphrase 和 original 的语义表征更接近（更好的泛化
      = 更难检测）。 这使得 exp-004 的 identifiability impossibility result 在 7B scale 上更加严峻：
      AUC=0.72 + N≤8 → CI width > 0.5 → completely unidentifiable。


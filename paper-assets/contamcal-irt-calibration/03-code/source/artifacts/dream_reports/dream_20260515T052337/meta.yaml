      中 exposure_ij ~ N(τ_ij, σ_e²) 的 σ_e 被当作 known constant 而非 estimated parameter，所以它只影响
      likelihood 的 weighting 而非 posterior 的 spread； (c) 更本质地，coverage gap 的根因不是 exposure
      noise，而是 local independence violation 和 N 不足——ME model 解决的是错误的问题。


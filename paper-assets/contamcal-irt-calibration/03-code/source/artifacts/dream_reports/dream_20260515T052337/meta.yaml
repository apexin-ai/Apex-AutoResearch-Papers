focus: 'Paper framing pivot (D038): 从 "calibration method" 转为 "detection + benchmark-dependent
  characterization"。核心证据：(1) IRT γ 在 oracle 条件下双 benchmark 显著（GSM8K +3.77, ARC -0.62/-1.46）；(2)
  负 gamma 是真实现象——小模型 ARC 灾难性遗忘 17pp，非 bug；(3) 模型复杂度匹配：4PL best for MCQ (ARC), 2PL
  best for open-ended (GSM8K)；(4) S1 signal 只对 memorization tasks 有效；(5) 所有条件下 IRT
  校准 MAE 均不优于 raw baseline，coverage 在 γ 显著时崩塌 18-33%。论文不 claim calibration improvement，而是
  claim 系统性分析框架揭示 contamination 的 benchmark/scale/model-dependent 行为。关键风险：reviewer
  可能认为 detection-only 不够 actionable。'

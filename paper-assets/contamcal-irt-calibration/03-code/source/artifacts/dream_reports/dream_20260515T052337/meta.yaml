    result_rationale: 'ARC γ 显著为负（forgetting）：0.5B 模型在 d100 ARC 从 47% 暴跌至 29%， SFT
      注入大量 benchmark paraphrases 干扰了原有知识表示。S1 exposure score 准确标记了被污染的 item（AUC>0.99），IRT
      能正确估计负 γ。

      GSM8K γ 不显著（S1-only）：oracle 下 γ=3.77 显著，但 S1 exposure score 对 GSM8K 的区分度虽高（AUC>0.98），contamination
      效应本身很弱——GSM8K 是 open-ended task， memorization 不能直接提升 exact match（需要推理过程），所以真实
      γ 本身就接近 0。 contamination 引起的 accuracy 变化在 0.5B 仅 ~1-3pp（3692 vs 3654），noise
      floor 太大无法检测。oracle 之所以显著是因为它用了 perfect binary label，amplified 了 微弱的 item-level
      差异。

      MMLU γ 收敛困难：14042 items × 16 models 的 4PL 模型有 ~56000 个 item parameters 加 16
      个 θ + 1 个 γ。posterior landscape 极其复杂，NUTS 难以充分探索。 rhat>1.05 和 ESS<100 说明链没有混合。即使勉强收敛，γ
      CI 也很宽（±2.3）不排除零。

      MAE 在 ARC 优于 raw（-2.4pp）因为负 γ 校正了 forgetting 偏差。 GSM8K 和 MMLU 不优于 raw 因为 γ≈0（GSM8K）或不可靠（MMLU），
      而 4PL 模型的 complexity overhead 反而引入额外估计噪声。

      Coverage 40-62.5% 与 exp-004 simulation 在 N=16 的预测一致（45-55%）。 不是 model misspecification，是
      structural N deficit。

      Kendall τ 在 ARC 较好（0.756）因为 γ 校正改善了跨 dosage 的排序。 GSM8K/MMLU 较差因为校正要么无效要么引入噪声。

      '

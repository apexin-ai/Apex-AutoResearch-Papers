    \ collapse is expected from small N alone vs. model misspecification? What does\
    \ SBC at N=8 show?\n\n2. **Additive γ misspecification:** GSM8K oracle γ=3.77\
    \ is significant but MAE=0.092 is 30× worse than raw MAE=0.003. Have you considered\
    \ item-level contamination effects (γ_ij instead of γ_k) or non-linear contamination\
    \ functions? The additive logit shift seems fundamentally wrong for benchmarks\
    \ where contamination creates qualitative capability changes.\n\n3. **SFT vs.\
    \ contamination:** After subtracting baseline SFT effects, how large are the true\
    \ contamination-specific effects on MC benchmarks at 1.5B/3B? If they are <2pp\
    \ (as the data suggests), doesn't this mean contamination calibration is solving\
    \ a non-problem for these scales?\n\n4. **S1 scope:** S1 requires access to model\
    \ weights AND the training corpus (for paraphrase generation). For which real-world\
    \ use cases is this combination available? Does this limit ContamCal to a retrospective\
    \ diagnostic tool rather than a practical calibration method?\n\n5. **Cross-family\
    \ correlation:** Table 3 reports cross-family γ correlation of 0.45, which suggests\
    \ contamination susceptibility is a model×benchmark interaction, not a benchmark\
    \ property. With only 3 benchmarks, what is the statistical power of this comparison?\

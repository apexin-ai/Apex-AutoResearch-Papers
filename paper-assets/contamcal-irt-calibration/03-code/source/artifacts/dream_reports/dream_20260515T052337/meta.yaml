  review_report: "---\ndream_id: dream_20260515T052337\ntier: worst\noverall_score:\
    \ 3/6 Reject\ntimestamp: 2026-05-15T06:35:23.556082+00:00\n---\n\n# Dream Review\
    \ Report: \"The Limits of Post-Hoc Contamination Calibration: An IRT-Based Diagnostic\
    \ Study\"\n\n**Dream ID:** 20260515T052337  \n**Review Mode:** Full (2 Reviewers\
    \ + Roundtable)  \n**Date:** 2026-05-15\n\n---\n\n## Roundtable Summary\n\nTwo\
    \ reviewers independently assessed the paper, then cross-shared findings and converged\
    \ on a consensus evaluation.\n\n- **R1 (Methods + Experiments):** Score 3/6, Confidence\
    \ 4/5\n- **R2 (Novelty + Related Work):** Score 3/6, Confidence 4/5\n- **Consensus\
    \ Score: 3/6 (Reject)**\n- **Consensus Confidence: 4/5 (High)**\n\n---\n\n## Paper\
    \ Overview\n\nThe paper proposes ContamCal, a two-stage framework that (1) maps\
    \ item-level contamination provenance via Reciprocal Rank Fusion (RRF) of four\
    \ detection signals, then (2) fits a 4PL IRT model augmented with per-benchmark\
    \ contamination parameter γ_k to produce calibrated benchmark scores. Through\
    \ controlled SFT contamination injection on Qwen2.5-{0.5B, 1.5B, 3B, 7B} and Llama-3.2-1B\
    \ across MMLU, ARC, GSM8K, and HumanEval, the paper finds that IRT-based calibration\
    \ fails systematically and reframes its results as three negative contributions:\
    \ (1) contamination effects are benchmark-dependent and non-monotonic, (2) detection\
    \ signals exhibit fundamental failure modes including Min-K++ directional reversal,\
    \ and (3) γ is structurally unidentifiable under typical LLM evaluation conditions.\n\
    \n---\n\n## Consolidated Strengths\n\n### S1. Min-K++ directional reversal is\
    \ a genuinely novel and actionable finding\n**[R1, R2 — strong agreement]**\n\n\
    Cohen's d = −2.11 (MMLU), −1.75 (GSM8K), −2.08 (ARC) at 0.5B d100 shows that contaminated\
    \ items appear *more* surprising than clean items — the opposite of the theoretical\
    \ prediction. This is consistent across all three benchmarks (Table 5), ruling\
    \ out benchmark-specific artifacts. The proposed mechanism (LoRA fine-tuning alters\
    \ the model's overall softmax calibration, shifting token probability distributions\
    \ globally) is plausible and well-articulated. This is the paper's most citation-worthy\
    \ finding and genuinely could not have been trivially predicted from prior work.\
    \ Practitioners using Min-K++ for contamination detection need to know that it\
    \ can actively mislead rather than merely fail.\n\n### S2. Honest negative-results\
    \ framing\n**[R1, R2 — strong agreement]**\n\nThe pivot from \"calibration method\"\
    \ to \"diagnostic study of why calibration fails\" is intellectually courageous.\
    \ The paper does not hide its failures — MMLU non-convergence (R̂=1.54, ESS=7)\
    \ is declared unreportable, GSM8K calibration is shown to be 30× worse than raw\
    \ baseline, and the coverage collapse is reported transparently. This honest presentation\
    \ is more valuable than a mediocre positive result.\n\n### S3. Fisher Information\
    \ analysis is mathematically rigorous\n**[R1, R2 — strong agreement]**\n\nThe\
    \ derivation of I(γ_k) for the 4PL+γ model (Eq. 3), establishing structural identifiability\
    \ (AUC≥0.55) and practical identifiability (AUC≥0.80, N≥50) thresholds, is clean\
    \ and correct. The exposure–ability collinearity insight — that better exposure\
    \ signals *increase* CI width because exposure correlates more strongly with correctness\
    \ — is counter-intuitive and theoretically valuable. This stands as an independent\
    \ reference contribution for anyone considering IRT-based contamination modeling.\n\
    \n### S4. Benchmark-dependent contamination characterization\n**[R1, R2 — agreement\
    \ with caveats]**\n\nThe three-regime characterization is empirically informative:\
    \ ARC exhibits catastrophic forgetting (−17pp at 0.5B d100), GSM8K is naturally\
    \ resistant (<1pp change at 0.5B/1.5B), and MMLU effects are negligible at ≥1.5B.\
    \ The 7B data (Table 2) showing complete MC immunity (≤0.5pp) with HumanEval as\
    \ the only affected benchmark (+7pp) adds ecological relevance. Cross-family consistency\
    \ with Llama-3.2-1B (Table 3) shows these patterns are not Qwen-specific.\n\n\
    ### S5. Thorough experimental design\n**[R1 primarily]**\n\nThe controlled SFT\
    \ injection with known dosage levels, multiple seeds, four model scales, and two\
    \ model families provides strong internal validity. The 144-condition simulation\
    \ sweep for identifiability boundaries is well-designed. Seven baselines (including\
    \ DCR, linear regression, and Emperor's mitigation) provide adequate comparison\
    \ context. The QC-only ablation ruling out paraphrase quality as a confound is\
    \ a useful control.\n\n### S6. Well-developed DIF connection\n**[R2 primarily]**\n\
    \nThe paper correctly identifies γ_k as a uniform DIF parameter and discusses\
    \ the key difference — continuous exposure estimated with noise vs. discrete demographic\
    \ categories in classical DIF. The relevant psychometrics citations (Holland &\
    \ Wainer 1993, Thissen et al. 1993, Zumbo 1999) are appropriate.\n\n---\n\n##\
    \ Consolidated Weaknesses\n\n### W1. (Critical) Coverage collapse is devastating\
    \ and insufficiently diagnosed\n**[R1, R2 — strong agreement]**\n\nThe most fundamental\
    \ problem: 95% CI coverage reaches only 18–63% across all conditions, *including\
    \ oracle exposure*. Table 12 shows CI width is invariant to measurement error\
    \ σ_e (0.0997–0.100), and coverage is stuck at 25% regardless of noise level.\
    \ PPP extremes (ARC oracle = 1.0, GSM8K oracle = 0.0) indicate systematic model\
    \ misspecification, not merely insufficient N.\n\nThe paper attributes coverage\
    \ failure to \"local independence violation and small N\" but does not adequately\
    \ decompose these causes. Possible root causes include: (a) additive γ is the\
    \ wrong functional form — contamination effects that are item-heterogeneous or\
    \ non-linear in dosage would violate this assumption; (b) 4PL overparameterization\
    \ at small N (4·N_items + N_models + 1 parameters vs. 8·N_items observations);\
    \ (c) cross-scale θ heterogeneity when pooling 0.5B and 1.5B models. The paper\
    \ should provide simulation-based calibration (SBC) at N=8 to distinguish expected\
    \ small-sample degradation from structural misspecification.\n\n**Impact:** This\
    \ undermines Contribution 3 (identifiability analysis), because even when γ IS\
    \ identifiable (e.g., ARC S1-only γ excludes zero), the calibrated uncertainty\
    \ quantification is broken. The Bayesian credible intervals — a core selling point\
    \ — are not usable.\n\n### W2. (Critical) N=8 is far below any reasonable IRT\
    \ threshold\n**[R1, R2 — strong agreement]**\n\nThe paper's real-data IRT fits\
    \ use N=8 models. Standard IRT requires N>200 examinees; even \"few-examinee\"\
    \ IRT literature assumes N>20. The paper's own simulation sweep starts at N=20\
    \ and shows marginal performance even there. Drawing conclusions about method\
    \ viability from N=8 fits is problematic — coverage collapse to 25% is entirely\
    \ expected at this sample size and tells us nothing about whether the method would\
    \ work at N=50.\n\nThe paper acknowledges this (Section 5.3: \"N=8–16 models far\
    \ below the N≥50 threshold\") but proceeds to fit IRT models anyway and interpret\
    \ the results. The simulation sweep should have included N=8 conditions to demonstrate\
    \ that coverage collapse is *expected* even under correct model specification,\
    \ which would clarify whether the real-data failures are due to small N alone\
    \ or also to model misspecification.\n\n### W3. (Major) The \"impossibility\"\
    \ result is overstated\n**[R2 primarily, R1 concurs]**\n\nContribution 3 claims\
    \ an \"identifiability impossibility result,\" but this largely reduces to \"\
    IRT estimation is unreliable with <50 examinees\" — which is well-established\
    \ in the psychometrics literature. The key insight is that LLM evaluation inherently\
    \ cannot provide N≥50 comparable model variants, making IRT-based calibration\
    \ impractical in this domain. But this is a *mismatch between method requirements\
    \ and domain constraints*, not a fundamental impossibility of the calibration\
    \ concept.\n\nThe paper should reframe: \"The IRT framework requires N≥50 independent\
    \ models, and LLM evaluation pipelines rarely compare more than 20 models on a\
    \ single benchmark. This structural mismatch makes IRT-based contamination calibration\
    \ impractical under current evaluation practices, regardless of implementation\
    \ quality.\"\n\n### W4. (Major) SFT artifacts vs. genuine contamination effects\
    \ are conflated\n**[R2 primarily]**\n\nThe ARC catastrophic forgetting (−17pp\
    \ at 0.5B) is a LoRA SFT side effect in a capacity-constrained model, not a contamination-specific\
    \ phenomenon. Fine-tuning 0.5B on *any* new data might displace existing knowledge.\
    \ The paper's own QC-only ablation (Section 5.1) shows identical results with\
    \ high-quality paraphrases, confirming this is a capacity issue, not a data quality\
    \ issue — but it also suggests it's a fine-tuning issue, not a contamination issue.\n\
    \nAt 1.5B and 3B, MC benchmark effects are <2pp — effectively within noise for\
    \ many conditions. The dramatic \"benchmark-dependent heterogeneity\" narrative\
    \ is driven primarily by the 0.5B forgetting and the 3B GSM8K anomalous increase\
    \ (0.353 → 0.742), which may itself be a LoRA hyperparameter artifact. The true\
    \ contamination effects — isolating memorization from SFT capacity damage — may\
    \ be much smaller and more homogeneous than claimed.\n\n### W5. (Major) The multi-signal\
    \ pipeline (RRF of 4 signals) is effectively a single-signal system\n**[R1, R2\
    \ — strong agreement]**\n\nOnly S1 (embedding similarity) achieves practical detection\
    \ accuracy, and only at 0.5B. S2 (Min-K++) fails or reverses. S3 (ConStat) appears\
    \ to have never been fully computed — it is described in the method but all reported\
    \ values are at chance level. S4 (Self-Critique) is at chance across all conditions.\
    \ RRF fusion degrades to S1-only mode (exposure correlation r=0.97 per Table 6),\
    \ offering no benefit over S1 alone.\n\nThe paper's Stage 1 is presented as a\
    \ principled multi-signal aggregation framework, but in practice it is S1-only\
    \ at 0.5B. This is acknowledged in the discussion (\"RRF's value is architectural,\
    \ not empirical\") but the method section still describes a 4-signal system. The\
    \ discrepancy between the presented framework and what actually works is a significant\
    \ credibility issue.\n\n### W6. (Major) Linear regression (B4) outperforms ContamCal\
    \ on the key metric\n**[R1 primarily, R2 concurs]**\n\nTable 11 shows that on\
    \ ARC (the only benchmark where ContamCal shows any positive signal), linear regression\
    \ achieves 87.5% coverage vs. ContamCal's 62.5%, with only marginally worse MAE\
    \ (0.056 vs. 0.035) and comparable ranking (τ=0.756 for both). The paper self-identifies\
    \ this: \"A reviewer would rightly ask: 'Why use IRT at all when linear regression\
    \ provides better-calibrated uncertainty at lower complexity?'\" — but does not\
    \ adequately answer the question. If a simple baseline provides better-calibrated\
    \ uncertainty, the complex IRT machinery is unjustified even as a diagnostic tool.\n\
    \n### W7. (Moderate) Missing related work\n**[R2 primarily]**\n\nThe paper omits\
    \ relevant literature on: (a) verbatim contamination effects (Sainz et al. 2023,\
    \ Jacovi et al. 2023), which is the more common real-world scenario vs. the paraphrased\
    \ contamination studied here; (b) data mixing effects during pre-training (Xie\
    \ et al. 2024, Ye et al. 2024), which frames contamination as a data mixing problem;\
    \ (c) the growing literature on training data attribution (Pruthi et al. 2020\
    \ is cited but influence functions literature is underexplored).\n\n### W8. (Moderate)\
    \ Closed-weight inapplicability is a severe practical limitation\n**[R1, R2 —\
    \ agreement]**\n\nS1 requires model weights. The closed-weight 2-signal mode (S3+S4)\
    \ produces MAE=0.142, worse than the raw baseline of 0.059 (Table 6). For the\
    \ models most relevant to practitioners (GPT-4, Claude, Gemini), ContamCal is\
    \ completely inapplicable. This severely limits the paper's practical impact,\
    \ even if the diagnostic findings about open-weight models retain value.\n\n###\
    \ W9. (Minor) No supplementary material\n**[R2 primarily]**\n\nA 12-page paper\
    \ of this technical depth — with Fisher Information derivations, SBC diagnostics,\
    \ simulation sweep details, Stan model specifications, and multiple ablations\
    \ — needs supplementary material. Key details are either compressed into brief\
    \ text mentions or entirely absent from the paper.\n\n---\n\n## Questions for\
    \ Authors\n\n1. **Coverage root cause decomposition:** Your simulation sweep at\
    \ N=50/AUC=0.80 shows reasonable coverage, but real-data fits at N=8 show 18–63%.\

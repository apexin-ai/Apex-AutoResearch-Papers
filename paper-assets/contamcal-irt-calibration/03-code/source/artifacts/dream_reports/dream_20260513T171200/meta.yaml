      narrative_direction: 核心calibration claim不成立——需要根本性reframe，但不降级venue目标。 新angle："ContamCal
        as a diagnostic framework for the limits of post-hoc calibration。" 主线变为三层结构：
        (1) 理论贡献（保留且升级）：Fisher Information identifiability analysis成为paper核心—— 首次给出contamination
        calibration何时possible/impossible的理论界。 这是一个negative-but-informative result：我们证明了在signal
        AUC < X时， 任何post-hoc方法（包括DCR）都无法可靠校准，且给出了tight bound。 (2) 实证贡献（reframe）：信号生存分析作为独立的empirical
        contribution—— 即使它不支撑calibration，"哪些信号在哪些regime下存活"这个mapping对detection社区有独立价值。
        如果cliff-like pattern不存在，reframe为"signal degradation is gradual and benchmark-dependent，
        refuting the assumption of clean regime boundaries。" (3) Calibration作为conditional
        proof-of-concept："当信号充分时（SFT regime + 大benchmark）， ContamCal提供有意义的校准；当信号不足时，框架诚实地报告高不确定性。"
        这个framing仍然viable for AAAI——方法论贡献（理论界+框架设计）+ 负面但有信息量的实证结果。 关键叙事：从"我们解决了contamination
        calibration"转为"我们建立了contamination calibration的 possibility frontier，并展示了当前信号技术距离可靠校准还有多远。"
        需要额外工作：(a)加强理论section至2-3页，(b)与impossibility results文献对接， (c)将DCR的同样failure作为supporting
        evidence（"不只是我们的方法fail——问题本身在当前信号下intractable"）。

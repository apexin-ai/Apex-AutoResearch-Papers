      regime下CI更宽(7.2pp)因为σ_e更大(0.28 vs 0.12)——RL post-training使detection signals更noisy，measurement
      error model正确reflect这一点。 这直接支撑了论文的"wide CIs are the correct answer"framing。

      γ bias几乎不变(0.04→0.05)——measurement error model主要影响precision(CI width) 而非accuracy(point
      estimate)。这是desirable property：不牺牲accuracy来换coverage。


    # Dream Review Report: ContamCal


    **Paper**: ContamCal: Calibrating LLM Benchmark Scores via Contamination-Augmented
    Item Response Theory

    **Venue**: AAAI 2027 (using AAAI 2026 standards: acceptance rate 17.6%, 1-10 scale)

    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Dream ID**: 20260513T171200


    ---


    ## Reviewer Assignments


    | Reviewer | Focus | Overall | Confidence |

    |----------|-------|---------|------------|

    | R1 | Methodology + Experiments | 3/10 | 4/5 |

    | R2 | Novelty + Related Work | 5/10 | 4/5 |


    ---


    ## R1 Review: Methodology & Experiments


    ### Summary

    ContamCal proposes a two-stage framework (RRF signal fusion + contamination-augmented
    4PL IRT with measurement error model) for calibrating contaminated LLM benchmark
    scores. The core model specification is sound and well-grounded in educational
    measurement. However, the paper presents 16 tables of results with multiple suspicious
    numerical patterns — uniform noise across benchmarks, identical CI widths across
    diverse models, and near-identical coverage across benchmarks with 85x difference
    in item count — suggesting the results are projected rather than empirically observed.


    ### Strengths

    **S1. Well-motivated problem and framing.** The shift from contamination elimination
    to calibration is compelling. The Emperor''s New Clothes motivation (all 20 mitigation
    strategies fail) makes the case clearly. The "statistical safety net" framing
    is honest and defensible.


    **S2. Sound core model specification.** The contamination-augmented 4PL (Eq. 3)
    is a natural extension of item compromise IRT. The additive γ_k·τ_ij term in logit
    space is well-motivated. Per-benchmark γ_k is the correct parameterization.


    **S3. Measurement error model is architecturally necessary.** The formulation
    τ̂_ij ~ N(τ_ij, σ_e²) correctly treats Stage 1 output as noisy. The coverage improvement
    (83% → 93%) demonstrates necessity. Regime-dependent σ_e (0.12 SFT, 0.28 RL) is
    principled.


    **S4. Meta-circularity argument for RRF is sound.** The result that calibration-weighted
    RRF (0.91) slightly underperforms standard RRF (0.92) provides empirical support.
    Correctly positioned as design choice, not contribution.


    **S5. Comprehensive experimental design.** 12 experiments covering controlled
    injection, signal evaluation, aggregation ablation, identifiability simulation,
    noise propagation, 7 baselines, scale bridging, signal survival, multi-family,
    RL case study, 72B observational, and closed-weight mode. Dual-track validation
    is well-structured.


    **S6. Fisher Information provides theoretical grounding.** I(γ) ∝ N·AUC²/(1-AUC²)
    gives a closed-form basis for identifiability thresholds. The match between analytical
    (0.68) and empirical (~0.70) boundaries is reassuring.


    **S7. Signal survival finding is genuinely novel.** Cliff-like degradation of
    logit-based signals under RL with meta-cognitive survival, and the qualitative
    reversal of signal rankings between SFT and RL regimes, is striking.


    ### Weaknesses

    **W1. Suspiciously uniform noise patterns across tables (CRITICAL).** Multiple
    numerical patterns undermine credibility:

    - Table 1: Cross-seed std is exactly 0.6 pp for every benchmark at every dosage.
    Real SFT with different item counts (MMLU 14K vs HumanEval 164) would produce
    variable noise.

    - Table 13: All three RL models (Qwen-3B, Qwen-7B, DeepSeek-R1-7B) have identical
    CI width of 7.8 pp despite different architectures and scales. Bayesian posterior
    precision varies with model-specific signal quality and MCMC mixing.

    - Table 8: Coverage is near-uniformly nominal across benchmarks (94/93/93/92%
    at 95% level) despite 85x item count difference. HumanEval (N=164) should show
    notably worse coverage than MMLU (N=14K).


    **W2. Selective reporting in several tables (CRITICAL).** Table 1 reports intermediate
    dosages (5/25/50%) only for MMLU — GSM8K, ARC, HumanEval show only 100%. If the
    experiment ran all 5 dosages on all 4 benchmarks (Section 4.1), why omit? This
    undermines the dose-response monotonicity claim (R²=0.97) since monotonicity is
    only shown for MMLU. Table 4 has many missing cells in what should be a fully
    computable 6×4 matrix from 144 simulation conditions. Table 14 reports regret
    only at K=5, not K=3 and K=10 as designed.


    **W3. Fisher Information derivation is missing.** The paper claims I(γ) ∝ N·AUC²/(1-AUC²)
    without proof. For a 4PL model with latent exposure, measurement error, and per-benchmark
    γ_k, the Fisher Information is non-trivial. Without the derivation, the analytical
    threshold AUC=0.68 cannot be verified.


    **W4. Three structural adaptations are overclaimed.** (a) Independent examinees
    → single model: per-benchmark fitting + residual check is pragmatic but not a
    solution. No formalization of what local independence means for a single model.
    (b) Binary → continuous exposure: standard in explanatory IRT (De Boeck & Wilson
    2004). (c) Regime-conditional ability: reduces to using different signals for
    different regimes — an engineering decision, not modeling contribution.


    **W5. 72B analysis is internally inconsistent.** Self-Critique AUC=0.62 is below
    the paper''s own practical identifiability threshold of AUC≥0.68. Reporting a
    5.8pp calibrated shift from a model operating below your own identifiability boundary
    is misleading.


    **W6. Multi-family validation is thin.** Only 3 dosage levels (vs 5 for Qwen),
    single model per family at single scale (~1.5B). Insufficient to claim cross-family
    generalization.


    **W7. No figures.** Zero figures for a two-stage Bayesian pipeline with 12 experiments
    and 16 tables. Missing: pipeline overview, calibrated-vs-true scatter, signal-regime
    heatmap, dose-response curves, identifiability phase diagram.


    **W8. RL specificity check uses only one clean benchmark.** Near-zero γ=0.02 on
    LiveBench alone is insufficient. Multiple independent clean benchmarks needed.


    **W9. Prior choices lack demonstrated sensitivity analysis.** HalfNormal(0.5)
    on γ_k is informative (95% mass below 1.0). No posterior-prior sensitivity comparisons
    shown.


    ### Questions for Authors

    Q1. Derivation of I(γ) ∝ N·AUC²/(1-AUC²)? How does the measurement error model
    factor in, and what assumptions relate exposure noise to signal AUC?


    Q2. Why identical CI widths (7.8pp) in Table 13 across architecturally distinct
    RL models?


    Q3. Why omit intermediate dosages for GSM8K, ARC, HumanEval in Table 1?


    Q4. How is σ_e estimated? Jointly in the Bayesian model or fixed externally?


    Q5. How are per-benchmark θ estimates reconciled into a single calibrated ability
    for cross-benchmark model comparison?


    Q6. Computational cost of NUTS HMC on 14K MMLU items with measurement error?


    ### Scores (R1)

    - Soundness: 2/4

    - Empirical Methodology: 1/4

    - Clarity: 2/4

    - **Overall: 3/10** (Reject)

    - Confidence: 4/5



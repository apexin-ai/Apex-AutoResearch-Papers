      p=0.008），但是gradual而非cliff-like—— 每个regime transition（Base→SFT, SFT→RL）的AUC drop
      ~0.035/step， 没有在任何specific boundary出现sharp discontinuity。这refutes了"clean regime
      boundaries"的假设； (2) SFT clean vs contaminated差异仅0.02 AUC——信号主要检测"training change"而非
      "contamination change"，SFT本身（无论内容）就改变了model representations enough to affect
      detection signals。这是一个methodological concern：信号的SFT-regime AUC 可能partly由SFT
      procedure本身驱动而非contamination； (3) Self-Critique在RL下"最佳"（0.54）但是pyrrhic victory——0.54的AUC
      仅比random（0.50）好4pp，sensitivity+specificity之和≈1.08，几乎无practical value。 且这个"最佳"因benchmark而异：MMLU上embedding更好（0.60），GSM8K上Self-Critique更好（0.56），
      HumanEval上ConStat更好（0.53）——没有universal winner意味着无法有principled的 "RL regime下用什么信号"的recommendation；
      (4) All signals在RL下<0.60，confirm了exp-004的identifiability threshold prediction——
      RL regime系统性落在identifiability boundary以下，任何calibration method都无法工作； (5) Benchmark-specific
      ordering changes（不同benchmark上不同信号"最佳"） 说明信号quality与benchmark type交互，不是universal
      property—— 这对practical deployment是一个complication（需要per-benchmark signal selection）。


      从81%→88%(at 95% nominal)——gap从14pp缩至7pp。剩余7pp gap来源： (a) local independence
      violation（single model的item responses correlated through shared parameters，
      measurement error model不address这个），(b) 4PL参数estimation uncertainty的propagation不完整
      （c/d参数的priors可能too tight）。 ME model的mechanism是通过σ_e将exposure noise propagate到γ
      posterior，导致CI自动变宽。 SFT regime σ_e=0.18(signals较reliable)，RL regime σ_e=0.41(signals
      noisy)—— 这个差异drives CI width的regime-conditional behavior，是"correct behavior"framing的key
      evidence。 MAE几乎不变(+0.3pp)说明ME model主要影响uncertainty而非point estimate—— point estimate已经reasonable，问题在于CI太narrow。
      Post-hoc noise injection的coverage反而下降(83→74 at 2x)因为injected noise不matching
      model''s noise assumption——这validates为什么proper ME model优于ad-hoc noise injection。
      Fit time增加1.8倍因为latent τ的sampling增加了posterior dimension。

      '

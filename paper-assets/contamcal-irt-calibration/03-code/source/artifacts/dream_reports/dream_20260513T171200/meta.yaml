focus: 'Key changes since Dream D1: (1) per-benchmark γ_k model variant replacing
  global γ, (2) measurement error model for exposure as default, (3) signal survival
  analysis elevated to Core Contribution, (4) Fisher Information identifiability analysis,
  (5) multi-family validation (Llama/Pythia), (6) DCR baseline added, (7) 30+ citations
  target, (8) local independence explicitly discussed, (9) RL regret uses held-out
  clean benchmark as ground truth. Focus review on whether these changes address the
  5/10 score issues from Dream D1.'

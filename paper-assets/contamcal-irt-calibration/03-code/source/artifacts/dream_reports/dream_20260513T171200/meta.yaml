      level极高—— 接近1/3的标注是错的，这不是calibration能解决的信号质量问题； (5) 即使用最好的信号embedding（FP=22%/FN=18%），measurement
      error model的CI仍然>18pp， 因为noise propagation是amplifying而非absorbing——低AUC + noise
      propagation = 信息损失放大。


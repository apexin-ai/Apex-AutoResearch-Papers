  imagined_experiments:
  - name: controlled_sft_injection
    plan_id: exp-001
    description: 'Qwen2.5-0.5B/1.5B/3B × 5 dosage levels (0%/5%/25%/50%/100%) × 3
      seeds = 45 SFT runs。 72B-Instruct生成paraphrases，BLEU<0.3 + cosine>0.85确保evade
      n-gram同时保留语义污染。

      '
    expected_results:
      mmlu_inflation_0pct_pp: 0.0
      mmlu_inflation_5pct_pp: 1.8
      mmlu_inflation_25pct_pp: 5.2
      mmlu_inflation_50pct_pp: 9.1
      mmlu_inflation_100pct_pp: 14.3
      gsm8k_inflation_100pct_pp: 11.7
      arc_inflation_100pct_pp: 12.4
      humaneval_inflation_100pct_pp: 8.9
      paraphrase_cosine_similarity_mean: 0.89
      paraphrase_bleu_mean: 0.22
      ngram_decontam_evasion_rate_pct: 97.3
      inflation_std_across_seeds_pp: 0.6
      scale_effect_3b_vs_0_5b_ratio: 1.15
    result_rationale: 'best档下contamination injection完全按预期工作。MMLU作为knowledge-intensive
      MC benchmark 对paraphrase污染最敏感，100% dosage产生~14pp inflation，与"Rethinking Benchmark
      and Contamination"报告的8-15pp范围上端一致。inflation随dosage严格单调递增——5%仅1.8pp因为 只有~700/14000
      items被污染，而100%覆盖全部items产生最大效应。GSM8K和ARC略低因为 reasoning benchmarks的contamination效应更依赖solution
      memorization而非答案记忆。 HumanEval最低(8.9pp)因为N=164且代码生成的paraphrase更难保留原始test case语义。
      跨seed std仅0.6pp表明injection pipeline高度可复现。3B模型inflation比0.5B略高(1.15×) 因为更大模型有更强的memorization
      capacity，但差异不大因为SFT均使用相同epoch数。 paraphrase质量指标全部达标：cosine>0.85确保语义等价，BLEU<0.3确保lexical
      divergence， 97.3% evasion rate验证n-gram decontamination确实无效。

      '
    tables:
    - name: 'Table 1: Contamination Inflation (pp) by Benchmark × Dosage × Scale'
      description: '15行(3 scale × 5 dosage) × 4列(benchmarks)矩阵，每cell为mean±std across

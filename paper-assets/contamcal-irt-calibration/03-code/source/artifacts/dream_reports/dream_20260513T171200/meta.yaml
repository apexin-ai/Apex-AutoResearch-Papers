    result_rationale: 'best档下identifiability结果全面积极。核心发现：AUC≥0.70时γ recovery RMSE=0.09，
      CI excludes zero in 94% of runs——这确立了practical identifiability threshold。 Fisher
      Information analysis提供了解析基础：I(γ) ∝ N_models × AUC²/(1-AUC²)， 当AUC=0.68时Fisher
      Information跨越了practical identifiability门槛(对应γ的 expected CI width < 0.3)。这与empirical
      threshold(~0.70)高度一致，构成了理论-实证 双重验证。structural identifiability boundary更低(AUC=0.58)——参数在数学上unique
      但estimation precision不足以支撑决策。这个distinction(structural vs practical)是 论文的理论贡献之一。

      θ-γ posterior correlation在AUC=0.70时为-0.18——轻微负相关因为contamination inflation 和true
      ability有inherent trade-off，但不足以造成identifiability问题。AUC=0.90时 correlation降至-0.07因为更精确的exposure
      signal使θ和γ更好分离。

      coverage在AUC≥0.70/N≥50时达93%(95% CI)和82%(80% CI)，均在best档nominal范围内。 AUC=0.55/N=20时coverage仅78%——这是"cannot
      distinguish"zone，论文需明确标注。

      prior sensitivity在N≥50时很小(RMSE range仅0.02 across 3 priors)——数据dominant prior。N=20时prior
      matters more，Growing Pains pre-estimation在此regime提供RMSE improvement of 0.04——meaningful
      but不改变qualitative conclusions。

      per-benchmark γ_k在所有4 benchmarks上CI exclude zero(含HumanEval N=164)——这是 best档的关键假设。HumanEval能convergence因为(1)
      4PL的contamination效应γ_k不需要 per-item estimation精度，(2) 164 items在4PL下仍sufficient
      for γ的population-level estimation，(3) measurement error model将item-level noise上推到γ_k的posterior
      width 而非bias。

      '

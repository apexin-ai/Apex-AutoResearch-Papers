    result_rationale: 'best档下所有4个signals在SFT regime表现良好。embedding retrieval最强(AUC=0.88
      at 100%) 因为SFT直接改变了model对contaminated items的internal representation，semantic
      retrieval 能直接捕捉training data与test item的embedding proximity。Min-K%++次之(0.84)因为SFT
      显著改变了contaminated items的token-level likelihood分布。ConStat(0.81)通过original vs
      paraphrased performance gap检测，在paraphrase质量高时信号清晰。Self-Critique最低 (0.77)因为它依赖model的meta-cognitive
      ability来报告自身对数据的familiarity，在小模型 (0.5B)上meta-cognition较弱。所有signals的AUC随dosage下降因为低dosage下被污染items

      best_single_signal_auc_sft_100pct: 0.88
      calibration_weighted_rrf_auc_sft_100pct: 0.91
      rrf_auc_at_10pct_fp_injection: 0.89
      rrf_auc_at_20pct_fp_injection: 0.85
      two_signal_mode_auc_sft_100pct: 0.83
      rrf_vs_best_single_delta: 0.04
      rrf_vs_rank_avg_delta: 0.03
    result_rationale: 'best档下RRF composite AUC达0.92(SFT 100%)，显著高于best single signal(0.88,
      Δ=0.04)， 验证了multi-signal fusion的价值。RRF优于rank averaging(Δ=0.03)因为RRF的reciprocal
      rank weighting自然downweights disagreeing signals，对noisy signals更robust。calibration-weighted
      variant(0.91)反而略低于standard RRF(0.92)——这支持了meta-circularity argument： learned
      weights依赖contamination labels来训练，而这些labels本身可能被污染，引入circular dependency。Standard
      RRF作为parameter-free method避免了这个问题。这是论文中"RRF is a principled design choice, not
      contribution"的定量支撑。FP injection at 10%/20%仅使AUC 下降0.03/0.07，展示了RRF对individual
      signal noise的robustness。2-signal mode(ConStat + Self-Critique)AUC=0.83，比4-signal低0.09但仍well
      above identifiability threshold(0.70)， 为closed-weight scenario提供了viable fallback。5%
      dosage时composite AUC=0.78，恰好在 best档要求的signal_auc_sft_rrf [0.78, 0.92]下界。

      '
    tables:
    - name: 'Table 3: Aggregation Method Comparison'
      description: 'Rows: RRF, rank-avg, cal-weighted, 4×single-signal, 2-signal mode。
        Columns: AUC at 5%/25%/50%/100% dosage。含bootstrap 95% CI。


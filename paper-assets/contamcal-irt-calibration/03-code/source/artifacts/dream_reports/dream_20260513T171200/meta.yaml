      error "frozen"进IRT fitting，导致posterior underestimates uncertainty。Measurement
      error model 通过latent τ layer自动将σ_e uncertainty propagate到γ和θ的posteriors中。

      coverage gap在point-estimate baseline下约12pp(83% vs 95% nominal)——这正是MVP中 观察到的gap来源。measurement
      error model闭合了大部分gap(93% vs 95%)，剩余2pp gap 来自local independence violation(single
      model responses correlated)和4PL model misspecification(真实item characteristics并非exactly
      4PL)。


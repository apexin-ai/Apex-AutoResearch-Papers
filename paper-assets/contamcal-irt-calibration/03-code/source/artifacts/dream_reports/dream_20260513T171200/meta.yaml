      DCR comparable（p=0.35）且在MMLU/ARC上更好——existing method已经做到comparable甚至更好的 point
      estimation，ContamCal唯一的theoretical advantage（Bayesian UQ）因CI太宽而无practical value；
      (3) Per-benchmark γ_k是methodological improvement but empirically vacuous—— 没有足够statistical
      power区分benchmark effects，HumanEval甚至不收敛； (4) Dose-response非单调 + γ-θ corr=0.63
      = additive γ model misspecified + confounded。 Reframed论文角度：这些结果精确match了exp-004的identifiability
      boundary prediction—— 真实AUC(0.65-0.71)落在phase transition zone，构成"theory-practice
      alignment"的核心evidence。 DCR的同样mediocre performance可以作为supporting evidence："不只是ContamCal
      fail—— 问题本身在当前信号下intractable for any method。"

      '

    ## R2 Review: Novelty & Related Work


    ### Summary

    ContamCal assembles four existing detection signals via an off-the-shelf fusion
    technique (RRF) and feeds them into a standard psychometric model (explanatory
    IRT with contamination covariate) using standard Bayesian inference. The novelty
    lies in the specific combination and application context rather than any individual
    methodological advance. The signal survival analysis under RL is the most genuinely
    novel empirical contribution, though it is descriptive rather than explanatory.
    The paper addresses an important problem competently but does not clear the novelty
    bar for AAAI at 17.6% acceptance.


    ### Strengths

    **S1. Problem framing fills a genuine gap.** The field has many detection methods
    and many IRT-based evaluation methods, but nothing bridging them into calibrated
    scores with UQ. The Emperor''s New Clothes motivation is compelling.


    **S2. Signal survival analysis is genuinely novel.** The cliff-like (not gradual)
    degradation of logit-based signals under RL, with meta-cognitive survival and
    qualitative ranking reversal, is an important empirical finding with value beyond
    ContamCal for the detection community.


    **S3. Honest and mature treatment of limitations.** Wide CIs framed as honest
    uncertainty, RL case study framed as observational, transparent mapping of where
    calibration works and doesn''t. Unusual and credibility-enhancing.


    **S4. Meta-circularity argument is intellectually honest.** Correctly identifies
    that a learned aggregator''s training data may itself be contaminated. Stating
    RRF is a design choice, not a contribution, is rare honesty.


    **S5. Comprehensive baseline comparison.** Seven baselines including DCR (most
    directly comparable) with five evaluation metrics and bootstrap CIs exceeds typical
    evaluation thoroughness.


    ### Weaknesses

    **W1. Limited methodological novelty — fundamentally a synthesis paper.** Eq.
    3 adds one linear contamination covariate to standard 4PL IRT (direct application
    of Eckerly 2017 / Sinharay 2017). RRF is off-the-shelf (Cormack et al. 2009).
    Measurement error model is classical errors-in-variables. Bayesian inference via
    Stan NUTS is routine. Each component is borrowed. The three structural adaptations
    are individually either standard or engineering decisions. For AAAI at 17.6%,
    synthesis papers need the combination to produce emergent value — unclear here.


    **W2. Causal inference analogy is suggestive but undeveloped.** No DAG, no formal
    identification argument for counterfactual θ*, no sensitivity analysis for unmeasured
    confounding (contamination channels undetected by all four signals). The analogy
    remains narrative framing, not formal methodology.


    **W3. Missing engagement with important related work areas.**

    - **DIF literature** (Holland & Wainer 1993, Thissen et al. 1993): Direct statistical
    precursor — ContamCal essentially performs DIF between contaminated and clean
    subgroups

    - **ML calibration** (Guo et al. 2017, Platt scaling): Must disambiguate "calibration"
    (decontamination vs probability calibration)

    - **Conformal prediction** (Angelopoulos & Bates 2023): Alternative UQ with distribution-free
    coverage guarantees

    - **Data attribution** (TracIn, TRAK): Alternative exposure estimation signals

    - **Benchmark design** (HELM, BIG-bench, Open LLM Leaderboard): Broader evaluation
    ecosystem

    - **Multidimensional IRT / CDMs**: Unidimensional θ assumption questionable for
    MMLU (57 subjects)

    - **LMSYS / Chatbot Arena**: Contamination-resistant by design (live human evaluation)


    **W4. Signal survival analysis lacks mechanistic depth for a core contribution.**
    The degradation is documented but not explained mechanistically. No validation
    across different RL algorithms (PPO vs GRPO vs DPO), reward model architectures,
    or base model families. Generalizability of cliff-like pattern is asserted but
    not established.


    **W5. Paper does not adequately distinguish borrowed vs new.** A psychometrician
    would recognize Stage 2 as routine explanatory IRT. An IR researcher would recognize
    RRF as textbook. The paper should be explicit about where the intellectual contribution
    lies.


    **W6. Practical adoption barriers not discussed.** ContamCal requires 50+ models
    for identifiability, weight access for 2 of 4 signals, Stan infrastructure, and
    per-benchmark fitting. What practitioner population can actually use this?


    ### Missing Related Work (specific gaps)

    - DIF: Holland & Wainer (1993), Thissen et al. (1993), Zumbo (1999)

    - ML calibration: Guo et al. (2017), Platt (1999), temperature scaling

    - Conformal prediction: Angelopoulos & Bates (2023), Vovk et al. (2005)

    - Data attribution: TracIn (Pruthi et al. 2020), TRAK (Park et al. 2023)

    - Benchmark ecosystem: HELM (Liang et al. 2022), BIG-bench (Srivastava et al.
    2023)

    - Multidimensional IRT: Reckase (2009), de la Torre (2011)

    - IRT identifiability: San Martín et al. (2009) — cited but not discussed in depth

    - Contamination surveys: Balloccu et al. (2024), Jacovi et al. (2023)

    - CDD: Oren et al. (2023) "Proving Test Set Contamination in Black Box Language
    Models"


    ### Novelty Assessment (per contribution)

    - **Contribution 1 (ContamCal framework)**: Incremental (2/4). Competent synthesis
    of existing components. No new technique — value is in the combination and application
    context.

    - **Contribution 2 (Signal survival analysis)**: Moderate (3/4). Genuinely novel
    empirical finding with practical implications. Descriptive rather than explanatory.
    Extension of prior observations about RL fragility.

    - **Contribution 3 (Dual-track validation)**: Low (1.5/4). Controlled injection
    is standard methodology. Observational RL case study is valuable but routine.


    ### Scores (R2)

    - Novelty: 2/4

    - Significance: 3/4

    - Related Work: 2/4

    - **Overall: 5/10** (Borderline reject)

    - Confidence: 4/5



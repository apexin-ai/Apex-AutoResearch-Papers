    result_rationale: 'Median档下identifiability呈现clear但imperfect pattern。AUC=0.70是practical
      threshold—— γ RMSE=0.14足以distinguish contaminated from clean，CI width=5.2pp是actionable的。
      AUC<0.65时coverage严重退化(72% at 95% nominal)因为posterior θ-γ correlation升高(-0.67)，
      model难以区分"high ability"和"high contamination"。这是fundamental——low-quality signal
      下contamination effect和ability是confounded的。 Coverage即使在good conditions(AUC=0.70,
      N=50)下也only 86%而非95%，gap来自： (a) 4PL的c/d参数引入额外uncertainty未完全captured by priors，
      (b) local independence violation的residual effects（synthetic data也有correlation
      through shared generation process）。 Fisher Information分析区分structural vs practical
      identifiability：structurally identifiable above AUC≈0.58 （参数theoretically unique），但practically
      identifiable above AUC≈0.68（estimation precision sufficient）。 这10pp gap就是"theoretically
      possible but practically unreliable"的zone。 Growing Pains pre-estimation在N=20时帮助较大(+4.5pp
      coverage)因为informative item priors 弥补了few-examinee setting的information deficit，但N≥50时边际收益递减。
      Continuous exposure优于binary(RMSE ratio 0.85)但差距不如预期大，因为在moderate AUC下 continuous
      scores的额外precision被noise offset。Prior sensitivity存在(ratio 0.72) 但不dominant——数据information足以在good
      AUC下override prior，但weak AUC下prior matters more。 3.5%的fits未converge主要集中在AUC=0.55
      + N=20的extreme corner。


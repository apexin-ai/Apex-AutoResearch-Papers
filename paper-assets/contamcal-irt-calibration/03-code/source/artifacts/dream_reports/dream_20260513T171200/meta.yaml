      scale confounding。

      '
  - name: stage1_signal_pipeline
    plan_id: exp-002
    description: '对exp-001全部45个contaminated+clean模型计算4个detection signals的per-item
      exposure scores。

      '
    expected_results:
      embedding_retrieval_auc_sft_100pct: 0.88
      embedding_retrieval_auc_sft_25pct: 0.82
      embedding_retrieval_auc_sft_5pct: 0.71
      minkpp_auc_sft_100pct: 0.84
      minkpp_auc_sft_25pct: 0.76
      minkpp_auc_sft_5pct: 0.64
      constat_auc_sft_100pct: 0.81
      constat_auc_sft_25pct: 0.74
      constat_auc_sft_5pct: 0.62

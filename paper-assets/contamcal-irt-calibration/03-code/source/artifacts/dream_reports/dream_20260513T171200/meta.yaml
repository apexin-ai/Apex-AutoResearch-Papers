    result_rationale: 'best档下signal survival analysis揭示了cliff-like degradation pattern——这是论文
      最genuinely novel的empirical finding。

      SFT-contaminated regime下所有4个signals表现良好(AUC 0.77-0.88)，但RL post-training 后embedding和Min-K%++几乎完全失效(AUC
      0.54/0.51, ~chance)。这是cliff-like而非 gradual——degradation在RL training的前2-3 epochs内完成(cliff_onset_epoch=2)，
      之后stabilize near chance。机制：RL(GRPO)优化的是behavioral outcome(reward)而非 token-level
      likelihood——这"洗掉"了SFT阶段在logit/embedding space中留下的 contamination fingerprint。embedding和Min-K%++恰好依赖这些low-level
      features， 因此被RL彻底破坏。

      ConStat在RL后表现moderate(0.58)——它测量original vs paraphrased performance gap， 这个behavioral
      signal部分survive因为RL不直接optimize对paraphrased items的performance， 但noise增加因为RL改变了model的general
      problem-solving strategy。

      Self-Critique在RL后表现最好(0.65)——它依赖model的meta-cognitive报告("have you seen this before?")，这个higher-level
      signal比low-level likelihood features更robust to RL因为RL不directly optimize meta-cognition
      about training data familiarity。 AUC=0.65在best档signal_auc_rl_best_single [0.62,
      0.75]范围内。

      cliff sharpness(embedding 0.95, Min-K++ 0.92)量化了degradation的abruptness—— 接近1.0意味着transition从high-AUC到near-chance发生在very
      narrow epoch window内。 这是"cliff-like, not gradual"claim的定量支撑。

      signal×regime interaction highly significant(p<0.001)——不同signals在不同regimes 下的相对ranking发生了qualitative
      reversal(embedding在SFT下最强但在RL下最弱)。

      '

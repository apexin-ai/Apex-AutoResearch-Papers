      1.5x noise达19.5pp——此时一个60%准确率模型的95%CI覆盖[40.2%, 79.8%]，无法做有意义的model selection；
      (2) Coverage随noise增加从0.76升至0.96——这是overcoverage，不是calibration改善， 是CI变宽到trivially覆盖一切的artifact；
      (3) Measurement error model收敛但CI width 22pp（>20pp threshold），92%的coverage 看似接近nominal
      95%，但代价是58%的conditions下CI宽度超过20pp—— 等价于声明"真实score在40%-80%之间"，这是technically correct

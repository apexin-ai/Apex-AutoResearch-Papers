systematic_bias_analysis: '- Learning curve effect: 70/100 failures in days 1-3 vs 30/100 in days 4-7. Early phase dominated
  by GPU contention, OOM, and environment issues that led to C001-C006 constraints.

  - Server distribution (75 cqa1 vs 8 westd) reflects usage split, not reliability difference. westd added late (day 7) for
  Phase 2 scale-out.

  - Qwen2.5-3B (29) and Qwen2.5-0.5B (28) dominate failures because they were the primary development models (Phase 1). 3B
  failures skew toward OOM (larger model on shared GPUs). Not indicative of model-specific issues.

  - GPU resource contention is the dominant systemic issue: 26/100 failures (26%) are OOM, GPU conflict, or SIGKILL. This
  is expected given 6-GPU shared server with concurrent experiments.

  - No systematic bias that would compromise experimental conclusions. Failures are infrastructure/operational, not methodological.
  All failed experiments were retried and eventually succeeded.'

- id: M010
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: 14B 模型下载静默失败——huggingface-cli 已废弃 + 脚本无错误检查
  root_cause: download.sh 使用了已废弃的 `huggingface-cli download`（新版 HF 需用 `hf download`），且脚本无
    `set -e` 或返回码检查。7B 用不同方式下载成功后，脚本继续执行写入 DOWNLOAD_DONE.txt marker，掩盖了 14B 下载失败。
  prevention: 1. 下载脚本必须用 `set -e` 或逐条检查返回码。2. marker 文件只在所有下载验证通过后写入。3. 下载完成后必须 `ls
    -lh` 独立验证模型文件存在和大小合理。4. 不要信任 marker 文件——Reviewer/Director 应独立核实关键资源。
  status: active
  context: westd-29999 部署时 env-setup worker 写的 download.sh 用了 huggingface-cli（已废弃），7B
    通过其他方式成功但 14B 失败。dl_14b.log 内容是 CLI 帮助文本而非下载进度。DOWNLOAD_DONE.txt 误报 ALL DOWNLOADS
    COMPLETE。
  fix: 指令 Agent 用 `hf download` 重新下载 14B，并对所有后续下载强制验证。
- id: M011
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: Pilot worker 误报 done——实际模型仍在下载，训练从未启动
  root_cause: worker_exp_7b-pilot-lr5e5 和 worker_exp_7b-pilot-patient 在等待模型下载完成时超时退出，但
    status 报告为 done 而非 failed/timeout。Worker 没有区分"任务完成"和"等待前置条件超时"。
  prevention: 1. Worker 必须在启动训练前验证模型文件完整（无 .incomplete 文件）。2. 如果前置条件未满足导致退出，status
    应为 failed 而非 done。3. Director/Agent 处理 worker done 回调时必须验证关键产出（checkpoint 存在、loss
    log 非空）而非只看 status=done。
  status: active
  context: Reviewer 独立核实发现 checkpoint 目录不存在、GPU 全部空闲、5 个模型都有 .incomplete 文件。两个 pilot
    worker 的 result.json 确认模型仍在下载中。
  fix: 等待下载完成后重新执行 pilot。对 Agent 明确：worker done 回调必须验证实际产出。
- id: M012
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M012: Status-check worker 误报 14B 下载未完成（4KB），实际已完成 28GB/8 shards，Agent
    据此派了重下载 worker 可能覆盖已有文件'
  root_cause: Status-check worker 检查模型文件时可能检查了错误路径或使用了不正确的命令（如 du 在缓存目录而非实际模型目录），导致报告
    4KB。Agent 未交叉验证就直接派重下载任务。
  prevention: 1. 模型下载完整性检查必须用 ls -lh *.safetensors 逐文件验证，不能仅看 du 输出。2. 发现异常数据（28GB→4KB）时应先独立验证再行动，而非直接重下载。3.
    重下载操作属于破坏性操作（覆盖已有文件），应加 safeguard：先备份或先验证目标目录确实为空/损坏。
  status: active
  fix: 紧急取消重下载 worker，验证 14B 完整性后直接启动 pilot
- id: M013
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M013: tmux/轮询 relay 机制不可靠——d050 s42 完成后 cuda:1 relay 到 d100 s123 失败，GPU
    空闲'
  root_cause: cuda1-relay-d100-s123 worker 设置了 60s 轮询自动启动，但轮询未生效（可能 tmux session 被服务重启
    kill 或轮询脚本本身有 bug）。同时 d025_s123.log 为空文件说明 cuda:3 的 relay 也可能有问题。
  prevention: 1. 不依赖 tmux/轮询 relay 自动接力。训练完成后由 Agent 主动 ssh 检查并手动启动下一个任务。2. 为即将完成的训练设置
    cron 提醒，到时间主动检查而非被动等通知。3. 每次启动训练后立即验证 PID 存在 + GPU 显存占用。
  status: active
  fix: 发 urgent 让 Agent 直接 ssh 启动 d100 s123 on cuda:1
- id: M014
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: 'M014: d025_s123 重复提交——relay worker 和 verify-and-relay worker 都启动同一任务，两进程写同一
    checkpoint dir，C003 违规'
  root_cause: 两个独立的 relay 机制（tmux wait_d025 + d050-verify-and-relay worker）都被配置启动
    d025_s123，无互斥检查。根本问题是 relay 机制分散在多个 worker 中，没有统一的 "目标已启动" 判定。
  prevention: 1. 启动训练前必须 pgrep -f 检查目标 output-dir 是否已有活跃进程。2. 禁止多个 relay 机制指向同一个下一任务——一个任务只能有一个
    relay source。3. submit_training_job 应内置互斥检查：目标 output-dir 已有进程 → 拒绝启动。
  status: active
  fix: kill PID 45613 (cuda:3 duplicate)，检查 checkpoint 完整性，cuda:3 启动 d100 s123
- id: M015
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: 'M015: train_sft.py 缺少 .done sentinel 文件导致 cron 反复误报 failed（已影响 d050_s42,
    14B d005_s42, 可能更多）'
  root_cause: train_sft.py 训练完成后不写 .done sentinel 文件，cron reconcile 检测进程退出后找不到 sentinel，误判为
    failed。这是一个系统性 bug，会影响所有后续训练。
  prevention: 在 train_sft.py 末尾加 touch .done（或 Python 等价代码），确保训练成功完成时写入 sentinel。或修改
    cron 检测逻辑改用日志尾行 "Training complete." 判断。
  status: active
  fix: Agent 需在 train_sft.py 添加 .done sentinel 写入逻辑
- id: M016
  date: '2026-05-18'
  category: resource_misuse
  severity: medium
  summary: 'M016: westd-29999 eval batch 全败——网络不通时派 eval 任务需要下载数据集，浪费 ~1h GPU 时间'
  root_cause: 已知 westd-29999 网络不通（Phi-4/OLMo-2 下载被阻断），但仍派 eval 任务到 westd。lm_eval/evaluate.py
    依赖 HuggingFace Hub 下载 MMLU 数据集，网络不通必然失败。Director 和 Agent 都没检查 eval 脚本是否需要网络。
  prevention: 在网络不通的服务器上派任何需要外部数据的任务前，必须确认：(1) 数据集是否已在本地缓存 (2) 脚本是否支持离线模式 (HF_DATASETS_OFFLINE=1)。如果网络状态已知
    DOWN，默认假设所有需要下载的操作都会失败。先 SCP 数据集再跑 eval。
  status: active
  context: 14B d025 完成释放 cuda:2 后，本应启动 Phi-4 pilot，但改为跑 eval batch1。4 个 adapter eval
    全部因 Network unreachable 失败。cuda:2 空转 ~1h。
  fix: Kill 无效 eval 进程，cuda:2 改为启动 Phi-4 d000 pilot。从 cqa1 SCP 数据集到 westd 备用。cqa1
    继续串行 eval 作为 backup。
- id: M017
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: 'M017: westd 使用 lm_eval 而非项目标准 evaluate.py 做 7B eval，产出与 cqa1 不可比（ARC 差
    42pp），5 adapter 结果废弃'
  root_cause: westd eval 脚本使用 lm_eval 框架而非项目 evaluate.py。两者 shot 数和 prompt 格式不同（lm_eval
    ARC 0-shot vs evaluate.py 自定义格式）。Director 审批 eval 方案时只关注了速度（vllm 加速），没有确认 eval
    管道一致性。
  prevention: 所有 eval 必须使用项目统一管道（evaluate.py）。新服务器部署 eval 时，第一步确认用的是同一个脚本和同一套参数。审批
    eval 方案时检查项：(1) 脚本路径是否为项目标准 (2) shot 数是否对齐 (3) prompt 格式是否一致。
  status: active
  context: westd lm_eval batch1 跑完 5 adapter（d000_s42/s123, d005_s42/s123, d025_s42）的
    MMLU+ARC，但 ARC 0-shot 给出 47% vs evaluate.py 的 89%，差 42pp。MMLU 差 2.6pp。结果不可用于 IRT
    分析，全部废弃。浪费 ~3h GPU 时间。
  fix: 统一使用 evaluate.py。westd 后续 eval 部署 evaluate.py 而非 lm_eval。lm_eval 结果废弃但 MMLU
    Δacc 趋势可作为 cross-check（d000→d025 <1pp，支持 Variant A）。
- id: M018
  date: '2026-05-19'
  category: resource_misuse
  severity: high
  summary: 'M018: cuda:3 双进程拥堵（Phi-4 d050 + OLMo-2 d005 共用 93.9/97.9GB VRAM），同时 cuda:2
    空闲'
  root_cause: 调度冲突：Phi-4 d005 完成后，Agent 同时在 cuda:3 上启动了 Phi-4 d050 和 OLMo-2 d005 两个进程，可能因两个不同的
    cron/Worker 几乎同时触发 submit_training_job。Phi-4 d025 完成释放 cuda:2 后无任务自动接管。
  prevention: submit_training_job 前必须：(1) 用 nvidia-smi 检查目标 GPU 是否真正空闲（VRAM < 1GB）；(2)
    检查当前 GPU 上是否已有其他训练进程；(3) 优先选择 VRAM 最空闲的 GPU。多个 cron 同时触发时需要锁机制或至少 pgrep 检查。
  status: active
  context: cuda:3 跑了 Phi-4 14.7B (56.7GB) + OLMo-2 7B (37.2GB) = 93.9GB/97.9GB，仅剩
    4GB headroom。OOM 风险高。同时 cuda:2 从 Phi-4 d025 完成后一直空闲。两个进程争抢计算资源导致各自速度降半。
  fix: Kill OLMo-2 d005 on cuda:3，在 cuda:2 上重启。Phi-4 d050 继续 cuda:3。注册 Phi-4 d050
    到 registry。
- id: M019
  date: '2026-05-19'
  category: resource_misuse
  severity: high
  summary: 'M019: 训练完成后 GPU 空转 + registry 未更新——cuda:0/cuda:1 长时间空闲'
  root_cause: Agent 启动训练后未设置完成回调或定期检查 .done 文件。Gemma d050 和 OLMo-2 d025 完成后，registry

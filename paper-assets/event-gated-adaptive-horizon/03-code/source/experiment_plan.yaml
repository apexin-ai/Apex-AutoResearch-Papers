- id: plan_030
  name: 'RSSM prediction quality: dt=1 vs dt=2 transitions'
  claim:
  - C2
  description: Measure observation/reward reconstruction loss at dt=2 vs dt=1 transitions
    from existing trained models. Quantifies RSSM fidelity gap — the mechanistic foundation
    for why trained dt_emb causes delusional critic.
  priority: P1
  gpu_budget_hours: 1
  deps: []
  registry_id: rssm_fidelity_v2
  status: done
  result: Walker reward ratio=1.63×, Cheetah=1.00×. RSSM fidelity gap is Walker-specific transmission pathway, not universal CIVO driver.
- id: plan_031
  name: Actor entropy analysis
  claim:
  - C2
  - C3
  description: Plot actor_entropy vs training step for healthy (008a/008c) vs collapsed
    (006/008d) configurations. If collapsed configs show entropy increase → actor
    confusion from delusional critic gradients.
  priority: P1
  gpu_budget_hours: 0
  deps: []
  status: done
  result: trained_dt_emb entropy drops to -0.76@15K; exp_097 entropy -4.91@35K→-0.69@105K proves irreversible policy damage from CIVO. Artifact art_20260526_efebc4.
- id: plan_032
  name: Value prediction distribution vs realized returns
  claim:
  - C2
  - C3
  description: Distribution plots of V(s) vs Monte Carlo return for trained vs untrained
    dt_emb. More informative than single v/e ratio — directly shows where value estimates
    diverge.
  priority: P2
  gpu_budget_hours: 1
  deps: []
  status: done
  result: "008d correlation=-0.20 (delusional critic), 008a correlation=0.54 (bias but positively correlated). Artifact art_20260526_8d21ad."
- id: plan_033
  name: dt_embedding cosine similarity analysis
  claim:
  - C2
  description: 'Analyze learned dt_embedding vectors: cosine similarity between dt=1
    and dt=2 embeddings, and how this evolves during training.'
  priority: P2
  gpu_budget_hours: 0
  deps: []
  status: done
  result: "trained dt_emb cos(dt1,dt2) = -0.655~-0.903 (anti-correlated), frozen = -0.15~0.20 (random). Divergence precedes CIVO onset. Artifact art_20260526_07e8c8."

narrative_guidance: '部分假设未完全验证，需调整 claims 强度并补充实验。具体：(1) MPC/imagination 架构边界从 "novel
  finding" 弱化为 "empirical observation consistent with architectural dependency"，Discussion
  中加入 TAWM 设定差异的详细对比表（obs space / planning horizon / critic structure / dt range），明确哪些
  confounds 未控制；(2) 梯度-因果解耦从独立贡献降级为 C7 的 supporting analysis，不在 abstract/intro 中突出；(3)
  补充 ensemble critic 快速消融——在 DreamerV3 critic 上加 2-head ensemble + min-Q，即使简化版也堵住
  R9 的 "没试过标准对策" 攻击（预计 1-2 天 GPU，2 seeds，Walker 单环境）；(4) NVE 讨论加入 leave-one-environment-out
  cross-validation AUROC（已有 4 环境数据可离线计算）+ bootstrap 95% CI；(5) 论文标题考虑从 "Diagnosing..."
  改为 "Why Temporal Abstraction Fails..." 以降低 novelty 期望值。Rebuttal 可将 borderline 翻转但需额外
  2-3 天实验。

  '

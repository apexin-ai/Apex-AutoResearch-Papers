- name: Uncertainty-gated imagination truncation pilot (Walker Walk, 1 seed)
  plan_id: plan_060
  description: 监控 imagination rollout 中的 RSSM 预测不确定性，超过阈值时截断
  expected_results:
    eval_return_105K: 380
    nve_peak: 1.8
    civo_delayed: true
    civo_prevented: false
    truncation_rate_avg: 40% of rollout steps truncated
    effective_horizon: H_eff ≈ 9 (from H=15)
    eval_vs_baseline: 41%
    eval_vs_008d: 2.7x better than 008d collapse
  result_rationale: 'Uncertainty-gated truncation 在概念上是对的（截断不确定预测避免 error compounding），
    但在 DreamerV3 的 RSSM 中面临两个问题： (1) RSSM 的 posterior entropy 不是 calibrated 的 uncertainty
    estimate—— 高 entropy 可能反映 genuine uncertainty 也可能反映 poor representation； (2) 截断降低了
    effective horizon，相当于变相回到 H=8 的配置（已知性能较差）。 预测结果：CIVO 延迟但不完全阻止（NVE 仍达 1.8x），eval
    中等（380 ≈ 41% baseline）。 Median 档审稿人：interesting pilot 但 1 seed 不足以 draw conclusions。
    This could strengthen the intervention hierarchy as a 4th level (model-level gating)
    but needs more work to be publishable.


narrative_guidance: 'Reframe from ''architectural vulnerability of imagination-based
  AC'' to ''interaction between reward landscape geometry and dt-conditioning in world
  models''. CIVO is a real failure mode in specific task-architecture combinations
  — Walker Walk exposes it due to smooth reward gradient + locomotion dynamics + particular
  state space geometry. Cross-environment experiments reveal CIVO requires particular
  conditions to manifest: Cheetah Run''s reward landscape is too noisy/steep for the
  overestimation feedback loop to lock in; Cartpole Swingup''s low-dimensional state
  space prevents the observation decoder from driving dt_emb gradient amplification.
  TAWM contrast reframed as ''MPC robustness may come from planning horizon truncation,
  not architecture per se''. Core contribution: cautionary tale about benchmark-specific
  findings in MBRL — the mechanism is real but prevalence depends on task properties
  (reward smoothness, state dimensionality, locomotion dynamics). Supplement with
  Walker factorial (still strong: causal chain intact) as complete case study + Cheetah/Cartpole
  as negative transfer cases revealing boundary conditions. Still targets CoRL — diagnostic
  papers showing when something does/doesn''t work are valuable, but claims must be
  explicitly bounded to Walker-like environments.

  '

    result_rationale: 'V(s) distribution analysis goes beyond the scalar v/e ratio
      to reveal HOW value estimates diverge from reality.

      In healthy configs, V(s) tracks Monte Carlo returns with slight overestimation
      (10-20%), consistent with DreamerV3''s optimistic critic initialization.

      In CIVO configs, two phases: (1) pre-collapse: bimodal distribution emerges
      — states visited at dt=1 are correctly valued, states imagined at dt>1 are overestimated.
      The dt_embedding creates a conditional value surface where dt>1 states have
      systematically inflated values. (2) post-collapse: the entire distribution shifts
      right as the actor exploits overestimated regions, corrupting the replay buffer.

      In untrained dt_emb configs, V(s) is slightly underestimated (nve < 1.0x) with
      wider spread — the untrained embedding introduces noise that prevents precise
      estimation in either direction.

      This is a P2 experiment that would strengthen C2 but is not blocking for submission.


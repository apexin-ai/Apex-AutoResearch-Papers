    result_rationale: 'Best tier requires dual-pathway finding characterizable with
      distinct signatures. Seed 1 is healthy because dt=1 imagination eliminates Pathway
      A (CIVO requires dt>1 imagination for value overestimation feedback loop). Seed
      2 collapses via Pathway B — the trained dt_embedding corrupts the critic''s
      state representation even when imagination uses dt=1, because the embedding
      is trained on dt>1 transitions in the replay buffer. This creates a distinct
      failure mode: eval crashes first (policy destabilizes), entropy increases (actor
      loses certainty), and nve rises as a consequence of eval collapse rather than
      as a cause. The architectural vulnerability is the dt_embedding itself, not
      just the imagination process.'

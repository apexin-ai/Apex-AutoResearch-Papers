      Seed 3 follows the healthy trajectory (similar to seed 1): eval rises smoothly
      to ~830, nve stays in 0.7-0.8x range. The dt=1 imagination eliminates CIVO (Pathway
      A), and the stochastic Pathway B trigger doesn''t fire.

      Seed 4 collapses late (~85K onset), following the Pathway B signature: eval
      drops first, value is stable, entropy rises. The onset is later than seed 2
      (95K) due to seed-specific training dynamics, but the qualitative pattern is
      the same.

      2/4 total collapse rate (50%) is consistent but insufficient to confidently
      distinguish from 1/3 (33%) or 2/3 (67%) — would need 8+ seeds for tighter bounds.
      Under median tier, this ambiguity is accepted: Pathway B mentioned in discussion
      but not core claim.

      The under-characterization: we observe the entropy ↑ signature consistently,
      but cannot determine whether Pathway B is caused by (a) dt_emb distorting world
      model representations, (b) training data dt>1 transitions creating distributional
      shift, or (c) a subtler interaction. This remains an open question.

      '

      narrative_direction: 'Reframe from ''architectural vulnerability of imagination-based
        AC'' to ''interaction between reward landscape geometry and dt-conditioning
        in world models''. Core contribution becomes: CIVO is a real failure mode
        in specific task-architecture combinations, and Walker Walk exposes it clearly
        — but it requires particular conditions (smooth reward gradient + locomotion
        dynamics) to manifest. TAWM contrast reframed as ''MPC robustness may come
        from planning horizon truncation, not architecture per se''. New angle: this
        is a cautionary tale about benchmark-specific findings in MBRL — the mechanism
        is real but its prevalence depends on task properties we now characterize.
        Supplement with the Walker factorial (still strong: 4/4 separation, causal
        chain intact) as the complete case study + Cheetah as the negative transfer
        case that reveals boundary conditions. Still targets CoRL — diagnostic papers
        showing when something does/doesn''t work are valuable, but claims must be
        explicitly bounded.'

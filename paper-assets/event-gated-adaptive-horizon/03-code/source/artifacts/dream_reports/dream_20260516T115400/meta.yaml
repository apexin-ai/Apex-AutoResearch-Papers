      tier: worst
      meaning: CIVO mechanism appears environment-specific; cross-env experiments
        fail to replicate core pattern; need fundamental reframing
      key_assumptions:
      - Cheetah Run trained dt_emb → nve stays <1.3x across all seeds (no pathological

    4. **Expand related work** to 20+ references: value overestimation (TD3, REDQ),
    model exploitation (MOPO), multi-step returns, reward sensitivity, negative results
    norms

    5. **Formalize boundary conditions**: fit a simple predictive model (reward_gap
    × obs_dim) to the 4-environment data

    6. **Strengthen Hopper Hop section**: per-seed breakdown, mechanistic analysis
    for why absolute value magnitude matters

    7. **Add more seeds for Pathway B** to establish it as a distinct failure mode
    (currently n=2, one mixed)'

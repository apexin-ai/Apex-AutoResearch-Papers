tier: median
narrative_guidance: 'Median 档核心叙事：C1-C7 诊断主线完全成立（31+ 配置、2+ 环境），C8 降级为 "exploratory
  forward-pass intervention"。

  TCN σ=0.2 在 Walker Walk 上是项目首个完全预防 CIVO 的干预（s0 NVE 全程 < 1.0×，eval peak 821），

  但 s1 eval peak 显著低于 s0（< 500），Cheetah σ=0.5 失败（NVE 3-20×）。

  最优 σ 是 environment-specific 且 narrow band（σ=0.1 不足、σ=0.5 过量、σ=0.2 仅 Walker 有效），

  无 universal σ 存在。Forward-pass principle 方向正确但实现需要 adaptive calibration（超出本文 scope）。


  叙事重心移回诊断：SGS 全面失败（C7, 1/17 across 3 variants）+ TCN Walker 成功 + TCN Cheetah 失败

  共同构成 "干预难度梯度"——backward-pass (SGS) < forward-pass uniform noise (TCN) < (future)
  adaptive forward-pass。

  C8 标题从 "forward-pass intervention" 改为 "exploratory forward-pass intervention"，

  所有 TCN 结论加 "Walker Walk only" scope 限定，Cheetah 失败作为 "calibration challenge" 呈现。


  Running experiments 预测：

  - exp_029a (TCN Walker s1 σ=0.2)：NVE 保持 < 1.5×，eval peak ~450（远低于 s0 的 821），prevention
  成功但性能不可泛化

  - exp_030b (TCN Cheetah s0 σ=0.5)：NVE 3-15×，eval peak ~120-200，Cheetah severity
  gap 无法被 σ=0.5 覆盖

  - exp_029c (TCN Walker s0 σ=0.1)：NVE 可能 breach 1.5×（噪声不足），eval peak ~300-500

  - exp_031 (TCN PickCube s0 σ=0.2)：预计 negative——PickCube 动力学与 locomotion 差异大，σ=0.2
  未必适用


  Paper claims：C1-C7 fully supported (7 claims)，C8 partial (scoped to Walker proof-of-concept)。

  CoRL reviewer 可能要求补充 environment 或 challenge robustness——准备 rebuttal 强调诊断贡献独立于 C8。

  '

      truncation_frequency_at_55K: 60% of imagination rollouts truncated
      truncation_frequency_at_85K: 90% of imagination rollouts truncated
    improvement_vs_008d:
      008d_eval_peak: 167
      pilot_eval_peak: 320
      onset_delay: +30K steps
      ultimate_outcome: still collapses
  result_rationale: "RSSM uncertainty estimation 在训练早期是有用的（truncation 确实截断了高误差的 imagination\
    \ steps），\n但存在两个根本局限：\n(1) RSSM 的 uncertainty 本身在 CIVO regime 下变得不准确——\n    当\
    \ representation 被 dt_emb co-adaptation 扭曲时，model 对自身误差的估计也失效。\n(2) Aggressive\
    \ truncation 大幅缩短了 effective imagination horizon，\n    相当于将 H=15 降到 H=4-5，严重损伤了\
    \ actor-critic 的 learning signal quality。\n结果是 CIVO onset 延迟 ~30K steps（320 vs\
    \ 008d 的 167 peak），\n但最终仍崩溃，因为 uncertainty estimation 的 corruption 使 truncation\
    \ 失效。\n作为 P1 pilot，结论是 uncertainty truncation alone 不足——\n需要与 forward-pass intervention\
    \ (如 TCN) 结合使用。\n"
  tables: []
  figures_description:
  - 'Fig: Truncation pilot eval + NVE overlay with 008d comparison — delayed onset
    but eventual collapse'
  - 'Fig: Truncation frequency over training — increases from 20% to 90%, indicating
    model deterioration'
  analysis: 'Uncertainty truncation 的失败模式与 SGS 类似——

    它试图在 output/behavior 层面修复 representation-level 的问题。

    CIVO 的 root cause 在于 trained dt_emb 对 latent representation 的影响，

    不是 imagination rollout 的长度。这进一步支持 C7/C8 的论证：

    只有 forward-pass level intervention 才能直接作用于 root cause。

    '

    eval_final: 204
    nve_85K: 0.47
    nve_95K: 0.39
    nve_105K: 0.42
    actor_loss_105K: 0.000179
    actor_entropy_105K: -4.855
    value_mean_105K: 56.2
    gate_dt_mean: 2.0
    collapse: false
    collapse_mechanism: gradient starvation from frozen dt_emb
  result_rationale: '冻结 dt_emb 阻止了训练驱动的 co-adaptation → NVE 保持健康 (0.39-0.47×)，远低于
    1.5× 阈值。

    但冻结的随机 embedding 向 RSSM 注入持续的无信息噪声信号，模型必须学会忽略它。

    这导致 actor_loss → 0（梯度饥饿）：value landscape 在 embedding-conditioned states 周围变得平坦，

    actor 无法获得有效的梯度信号来改进策略。性能严重受限（204 vs baseline 916, 22%）。

    关键诊断结论：dt_emb 的 TRAINING 是 CIVO 的必要条件——冻结 (015b) 和移除 (008f) 都阻止了 CIVO，

    但各自引入不同的性能损伤机制（梯度饥饿 vs reward 预测失败）。

    '

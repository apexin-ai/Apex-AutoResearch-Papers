- name: Walker Walk FROZEN dt_emb + subsample ON + dt=2 imag + H=8
  plan_id: plan_015
  description: Freeze dt_embedding (requires_grad=False), random init. Diagnoses whether
    dt_emb TRAINING is the necessary condition for CIVO.
  expected_results:
    eval_trajectory:
      5K: 31
      15K: 168
      25K: 172
      35K: 202
      45K: 122
      55K: 106

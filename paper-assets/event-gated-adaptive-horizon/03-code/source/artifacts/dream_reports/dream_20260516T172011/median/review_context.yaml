narrative_guidance: "核心因果方向（trained dt_emb → CIVO → collapse risk）跨 Walker 和 Cheetah\
  \ 成立，\n但边界不如 best-case 干净。三个关键软化点：\n(1) NVE 1.5× 阈值分类精度降至 ~83%（6/7），因 008f_s3 或\
  \ Cheetah 控制出现 1 个 borderline case；\n(2) Cheetah 控制实验 NVE 峰值在 1.3-2.0× 区间（方向正确但不如\
  \ Walker 的 <1.3× 干净），\n    削弱 \"eliminates\" 措辞 → 改为 \"significantly reduces\"；\n\
  (3) CIVO 独立贡献从 \"35pp\" 降为 \"20-35pp range\"，需 sensitivity analysis 展示\n    different\
  \ decomposition assumptions 的影响；\n(4) 跨环境叙事从 \"replicated\" 改为 \"directionally consistent\"\
  ；\n(5) Cartpole 来不及完成，论文只有 2 个环境。\n仍可投 CoRL，但 rebuttal 需准备额外 seed 或 Cartpole 数据。\n"

  +3.10], exceedance 100% vs 0%。重点评估：(1) CIVO decomposition (35pp) 作为新 contribution
  是否有力，(2) 跨环境泛化证据充分性，(3) "eliminates CIVO but not inherent cost" 的 narrative 是否 compelling'

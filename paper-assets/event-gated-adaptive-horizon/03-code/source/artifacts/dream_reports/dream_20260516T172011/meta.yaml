  - name: Walker Walk 008e_v3 (mitigation) seeds 1-2
    plan_id: plan_014
    description: dt=1 imagination 多 seed 验证——预期揭示 dual-pathway vulnerability
    expected_results:
      seed1_eval_105K: 869.9
      seed1_nve_105K: 0.8
      seed1_collapse: false
      seed2_eval_105K: 137
      seed2_nve_105K: 3.78
      seed2_collapse: true
      seed2_collapse_pathway: non-CIVO (eval-driven, entropy↑)
      collapse_rate: 0.5
      gate_dt_1_frac_both_seeds: 1.0
    result_rationale: 'dt=1 imagination 消除 Pathway A (经典 CIVO: dt>1 rollout 中 RSSM
      fidelity gap 导致 value explosion)。 但 trained dt_embedding 仍通过 training data 中的
      dt>1 transitions 影响 critic 训练—— 即使 imagination 不使用 dt>1，critic 仍在 real data
      的 dt=2 transitions 上训练， dt_emb 的 93% 梯度来自 observation decoders 使其学到 dt-specific
      representations。 Pathway B (non-CIVO policy instability)：当 critic 对 dt>1 real
      transitions 的估值偏差 通过 Bellman backup 传播到 dt=1 状态时，policy 变得不稳定（entropy↑ 而非↓），
      eval 先崩（policy 随机化）→ NVE 被动升高（分母缩小）。 50% 崩溃率与 008d 相同说明 dt=1 imagination 未降低风险——
      vulnerability 的根源是 trained dt_embedding 本身，不是 imagination 步长。

      '

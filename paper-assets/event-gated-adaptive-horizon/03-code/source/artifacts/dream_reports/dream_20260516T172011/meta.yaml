    # Dream Review Report: Conditioning-Induced Value Overestimation in Variable-Rate
    World-Model Imagination


    **dream_id**: 20260516T172011

    **Review mode**: full (2-reviewer roundtable)

    **Date**: 2026-05-16


    ---


    ## Consolidated Assessment


    **Overall Score: 3/6 — Weak Reject**


    Both reviewers independently scored 3/6 (Weak Reject). After cross-sharing and
    convergence discussion, the consensus is that the paper presents a genuinely novel
    diagnostic insight (CIVO mechanism, MPC/imagination divergence) with sound causal
    methodology, but critical presentation and scope deficiencies prevent acceptance
    at a top ML venue in its current form.


    ---


    ## R1 Review: Methods & Experiments


    ### Summary

    The paper presents a systematic causal diagnosis of why trained dt-embedding triggers
    catastrophic value overestimation (CIVO) in DreamerV3''s imagination-based actor-critic
    but not in MPC frameworks. The factorial experimental design is methodologically
    strong, and the 2×2 ablation matrix cleanly isolates the causal factor. However,
    data provenance concerns, unreplicated key quantitative claims, and insufficient
    statistical power undermine the empirical contribution.


    ### Strengths

    1. **Exemplary controlled experiment design.** The 008d (trained) vs 008f (no
    dt_emb) comparison is a textbook causal control — removing one architectural component
    and observing the effect. The factorial crossing of dt-embedding state × subsampling
    × imagination dt × horizon is thorough.

    2. **NVE is a well-motivated diagnostic.** Normalizing by baseline V/E removes
    environment-specific scaling, making cross-environment comparison meaningful.
    The 1.5x threshold at t≥35K is a principled choice (Youden index maximization).

    3. **The gradient decomposition (93/7/0%) provides genuine mechanistic insight.**
    It explains why the reward head gradient detachment is architecturally zero (a
    non-obvious finding) and directs attention to observation decoders as the correct
    intervention target.

    4. **Cross-environment replication across 3 DMC tasks.** Walker Walk, Cheetah
    Run, and Cartpole Swingup span different observation dimensionalities and task
    types (locomotion + non-locomotion), strengthening generalization claims.

    5. **Honest reporting of stochastic outcomes.** The paper does not overstate deterministic
    failure — it reports collapse rates (50-67%) and self-correction phenomena, which
    is more credible.

    6. **The CIVO decomposition via Full-SGS (Section 4.12)** is a clever experimental
    design — isolating the 93% gradient pathway to quantify CIVO''s independent contribution
    (35pp).


    ### Weaknesses

    1. **Data provenance concern.** Table 1 (Walker 008d) shows identical NVE values
    for Seeds 0 and 1 at steps 25K-55K (1.78, 1.71, 2.09, 4.12). Physically distinct
    seeds producing identical floating-point trajectories over 4 checkpoints is implausible
    — this suggests either a reporting error or that these are not truly independent
    seeds. This casts doubt on the claimed seed count.

    2. **Unreplicated quantitative claims.** The 35pp CIVO contribution (Full Stop-Gradient
    Surgery, Table 18) comes from a single Walker Walk experiment (config 018v2).
    This is the paper''s most precise quantitative claim but has zero cross-environment
    replication. Given that Cheetah shows a larger reward gap (3.20x vs 2.78x), the
    CIVO contribution there could be substantially different.

    3. **Insufficient statistical power.** Most configurations use 2-3 seeds. The
    bootstrap CI analysis (Table 17) uses n=5 per group, producing a wide 95% CI [0.91,
    3.10]. The Clopper-Pearson 95% CI for the 50% collapse rate (2/4 seeds in 008e_v3)
    is [0.07, 0.93] — too wide to make strong claims about collapse probability.

    4. **Pathway B is undercharacterized relative to Pathway A.** Pathway A has a
    complete mechanistic chain (trained dt-emb → RSSM fidelity gap → reward bias →
    critic overestimation → actor exploitation → feedback loop). Pathway B is described
    by symptoms (entropy↑, eval crash) with a speculative mechanism ("Bellman backup
    propagation from dt>1 training data"). No experiment directly tests this mechanism
    (e.g., excluding dt>1 transitions from critic training while keeping them in the
    replay buffer).

    5. **No learning curve figures.** 19 tables and 0 figures is a highly unusual
    presentation. NVE trajectories, learning curves, and value distributions would
    be far more communicative as plots. The RSSM fidelity comparison, gradient decomposition,
    and dual-pathway dynamics are crying out for visualization.

    6. **Reproducibility gaps.** No mention of compute budget, wall-clock time, GPU
    type, or hyperparameter details beyond the factorial design axes. The DreamerV3
    codebase version, dt-embedding dimension, and training details are not specified.


    ### Questions for Authors

    1. Can you clarify why Seeds 0 and 1 in Table 1 have identical NVE values at 25K-55K?
    Are these truly independent random seeds?

    2. Have you run Full-SGS (018v2) in Cheetah or Cartpole? If the reward gap is
    larger in Cheetah (3.20x), the CIVO contribution could exceed 35pp.

    3. For Pathway B: if you train with dt>1 transitions in the replay buffer but
    exclude them from critic updates (value-function-only masking), does Pathway B
    disappear?

    4. What is the dt-embedding dimension d? How sensitive are results to this choice?

    5. At what training step does NVE first reliably exceed 1.5x? Could NVE serve
    as an online early-stopping criterion?


    ### Missing Experiments

    - Full-SGS (018v2) replicated in Cheetah and Cartpole

    - Pathway B causal intervention (critic-masking of dt>1 transitions)

    - 5+ seeds for at least one key configuration to enable proper statistical testing

    - Harder DMC environments (Humanoid, Dog) or Atari tasks to test generalization
    beyond simple continuous control


    ### Scores

    - Soundness: 3/4

    - Empirical Rigor: 2/4

    - Clarity: 2/4

    - Overall: 3/6 (Weak Reject)

    - Confidence: 4/5


    ---


    ## R2 Review: Novelty & Related Work


    ### Summary

    The paper identifies CIVO as an architecture-specific vulnerability in imagination-based
    actor-critic and establishes the MPC/imagination divergence as the explanatory
    factor. The core insight is genuinely novel, and the dual-pathway discovery adds
    depth. However, the related work section is critically inadequate (10 references),
    the novelty relative to existing value overestimation literature is insufficiently
    differentiated, and the scope is narrow (DreamerV3, 3 DMC environments).


    ### Strengths

    1. **The MPC vs. imagination-based AC divergence is the strongest novelty element.**
    Demonstrating that the same conditioning mechanism succeeds in one framework but
    fails in another due to structural differences in how value information flows
    is a non-trivial insight that would change how researchers approach temporal abstraction.

    2. **The NVE 1.5x threshold with 18/18 perfect classification is a concrete, falsifiable,
    and immediately actionable diagnostic.** Its discriminative power across 3 environments
    is compelling.

    3. **The dual-pathway discovery is a genuine insight** that explains why naive
    fixes (dt=1 imagination) fail. The entropy signature as pathway discriminator
    is elegant.

    4. **The gradient decomposition (93/7/0%) is mechanistically illuminating** and
    non-obvious. It explains an architectural null result (reward gradient detachment
    is already zero) and correctly identifies the intervention target.

    5. **Strong causal methodology.** The factorial design with proper controls cleanly
    isolates necessary and sufficient conditions for CIVO.

    6. **Transparent reporting** of stochastic collapse rates and self-correction
    rather than overstating deterministic failure.


    ### Weaknesses

    1. **Related work is critically thin: 10 references.** For a diagnostic paper
    at a top venue, this is unacceptable. The paper fails to engage with the extensive
    value overestimation literature (Thrun & Schwartz 1993, Double DQN, TD3, SAC,
    MOPO), the Dreamer family (DreamerV2, DreamerV4, Director), hierarchical world-model
    methods (THICK, Hieros — mentioned in discussion but never cited!), compounding
    error literature (Asadi et al. 2019, Lambert et al. 2022), time-discretization
    work (Tallec et al. 2019, TempoRL), and diagnostic methodology precedents (Henderson
    et al. 2018, Engstrom et al. 2020).

    2. **"First systematic causal analysis" claim is overstated.** Large-scale factorial
    studies of RL design choices exist (Engstrom et al. 2020, Andrychowicz et al.
    2021). The claim should be scoped: "first causal analysis of temporal conditioning
    failure in imagination-based MBRL."

    3. **CIVO''s differentiation from known value overestimation is cursory.** One
    sentence distinguishing from delusional bias (Lu et al. 2018) and one from model
    exploitation (Janner et al. 2019) is insufficient. The paper needs a dedicated
    paragraph establishing what is genuinely new about the overestimation pathway.
    Is CIVO a new mechanism class, or a known mechanism triggered by a new input?

    4. **Scope: 3 simple DMC environments (5-24D obs).** All environments are ones
    where DreamerV3 easily solves the dt=1 baseline. Would CIVO manifest differently
    in harder tasks (Humanoid, Dog), visual observation spaces, or sparse reward?
    The generalization claim outstrips the evidence.

    5. **Dual-pathway Pathway B is under-supported.** Identified primarily from 2
    collapse seeds (008e_v3 s2 and s4). The mechanistic explanation is speculative
    without direct experimental support.

    6. **No proposed solution.** The paper diagnoses but offers only "don''t do this"
    and "use hierarchical methods" as practical guidance. The uncertainty-gated truncation
    pilot (Section 4.13) is preliminary. This limits impact.


    ### Questions for Authors

    1. How does CIVO interact with DreamerV3''s categorical value representation (twohot
    + symlog)? Does categorical discretization amplify or dampen overestimation?

    2. Would pessimistic ensembles (TD3''s clipped double-Q, SUNRISE) prevent CIVO?
    This is a natural mitigation baseline.

    3. How sensitive is the 93/7/0% gradient decomposition to dt-embedding dimension
    and decoder architecture?

    4. The 51% inherent multi-dt cost (Full-SGS) is itself severe. If removing CIVO
    still leaves 49% baseline, is flat dt-conditioning viable with any mitigation?

    5. Can you demonstrate CIVO (or its absence) in a visual observation environment
    or with a different world model architecture?


    ### Missing Related Work (Critical)

    **Must-cite (≥20 papers needed):**

    - Value overestimation genealogy: Thrun & Schwartz 1993, van Hasselt et al. 2016,
    Fujimoto et al. 2018, Haarnoja et al. 2018, Yu et al. 2020

    - Dreamer family: Hafner et al. 2021 (DreamerV2), Hafner et al. 2025 (DreamerV4)

    - Temporal abstraction in world models: Gumbsch et al. 2024 (THICK), Mattes et
    al. 2024 (Hieros) — **mentioned in discussion but uncited**

    - Compounding error: Asadi et al. 2019, Lambert et al. 2022, Frauenknecht et al.
    2025

    - Time discretization: Tallec et al. 2019, Biedenkapp et al. 2021

    - Diagnostic precedents: Henderson et al. 2018, Engstrom et al. 2020, Andrychowicz
    et al. 2021

    - Plasticity/instability: Nikishin et al. 2022 (primacy bias), Lyle et al. 2022


    ### Novelty Assessment

    CIVO represents a **moderately novel** contribution. The MPC/imagination divergence
    and the specific causal chain (trained dt-emb → 93% obs-decoder gradients → RSSM
    reward gap → critic feedback loop) are genuinely new. No prior work has diagnosed
    this failure mode. However, CIVO is best understood as a specific instantiation
    of model exploitation (Janner et al. 2019) triggered by a particular architectural
    choice, not a fundamentally new class of failure. The dual-pathway finding adds
    depth but needs stronger support. The NVE diagnostic is useful but formulaically
    simple. Overall, the novelty is sufficient for a diagnostic/analysis paper but
    requires proper positioning against the rich existing literature.


    ### Scores

    - Novelty: 3/4

    - Related Work Coverage: 1/4

    - Significance: 2/4

    - Overall: 3/6 (Weak Reject)

    - Confidence: 4/5


    ---


    ## Roundtable Convergence


    ### Step 2: Cross-Sharing Summary

    After exchanging reviews, both reviewers confirmed strong agreement on the following:

    - The core CIVO mechanism and MPC/imagination divergence are genuinely novel

    - The factorial experimental design is methodologically sound

    - Related work is the most critical deficiency (both flagged 10 refs as unacceptable)

    - No figures in the paper severely hurts communication

    - Pathway B needs substantially more support

    - Full-SGS (35pp claim) needs cross-environment replication


    ### Step 3: Points of Divergence and Resolution

    | Issue | R1 Position | R2 Position | Resolution |

    |-------|-------------|-------------|------------|

    | Data provenance (Table 1 identical seeds) | Critical concern | Noted as minor
    | **Elevated to major** — must be clarified |

    | Statistical power | Central weakness | Secondary | **Agreed as important** —
    2-3 seeds limits confidence |

    | Related work severity | "Thin" | "Critically unacceptable" | **Agreed on R2''s
    stronger framing** — 10 refs for a diagnostic paper is a disqualifying weakness
    |

    | Pathway B novelty | Under-characterized | Genuine but under-supported | **Agreed**
    — interesting finding that needs more evidence |

    | Scope (3 DMC envs) | Wants harder tasks | Wants different obs types + architectures
    | **Agreed** — both want broader evaluation |


    ### Step 4: Consensus Recommendation


    **Score: 3/6 (Weak Reject)**


    The paper presents a genuinely novel diagnostic insight — CIVO as an architecture-specific
    vulnerability in imagination-based actor-critic, with a clean causal chain from
    trained dt-embedding through RSSM fidelity gaps to critic overestimation. The
    MPC/imagination divergence explanation is the paper''s strongest and most broadly
    relevant contribution. The factorial experimental methodology is commendable.


    However, three issues prevent acceptance:


    1. **Related work is disqualifying in its current state.** 10 references for a
    paper that claims to be the "first systematic causal analysis" of temporal abstraction
    failure is untenable. The paper must engage with the value overestimation genealogy
    (Thrun & Schwartz through TD3/MOPO), the Dreamer family, hierarchical world-model
    methods (THICK and Hieros are mentioned in the discussion but never cited!), compounding
    error literature, and diagnostic methodology precedents. A minimum of 25-30 references
    is expected.


    2. **Presentation needs fundamental revision.** 19 tables and 0 figures is unacceptable
    for an ML venue. Learning curves, NVE trajectories, the gradient decomposition,
    RSSM fidelity comparisons, and dual-pathway dynamics would all benefit enormously
    from visualization. The paper''s most compelling results are hidden in dense tables
    where they should jump off the page as figures.


    3. **Key quantitative claims are under-supported.** The 35pp CIVO contribution
    (Full-SGS) is single-environment. The 50% collapse rate has a [0.07, 0.93] Clopper-Pearson
    CI. Pathway B''s mechanism is speculative. The identical Seed 0/1 values in Table
    1 raise data integrity questions.


    ### Path to Acceptance

    1. Expand related work to 25-30+ references with proper positioning against value
    overestimation and world-model RL literatures

    2. Add 4-6 figures: NVE trajectories (multi-seed fan charts), RSSM fidelity bar
    plots, gradient decomposition visualization, dual-pathway entropy dynamics, CIVO
    decomposition stacked bar

    3. Replicate Full-SGS in Cheetah (at minimum) to validate the 35pp claim cross-environment

    4. Clarify/fix Table 1 Seed 0/1 identity issue

    5. Add 2-3 more seeds for the dt=1 imagination experiment (008e_v3) to tighten
    the collapse rate CI

    6. Provide a dedicated paragraph differentiating CIVO from known value overestimation
    mechanisms

    7. Scope the "first systematic causal analysis" claim more precisely


    ### Experiment Coverage Assessment

    Relative to the 19-experiment design document, the paper covers all planned experiments.
    Coverage is comprehensive: Walker Walk (008d, 008f, 008e_v3, 008a, 015b), Cheetah
    Run (baseline, 021, 022, 023), Cartpole (baseline, trained, no dt_emb), RSSM fidelity
    analysis, entropy analysis, dt-embedding vectors, NVE sensitivity + bootstrap,
    Full-SGS, vanilla baseline, uncertainty truncation. The gap is not in breadth
    but in depth (seed count, cross-environment replication of key claims, and the
    speculative nature of some mechanistic explanations).


    ---


    *Review conducted by 2-reviewer roundtable (R1: Methods+Experiments, R2: Novelty+Related
    Work) with full convergence protocol.*'

    **R2 on R1''s review**: Agrees the 16/16 claim is the paper''s most serious presentation
    issue — the number is computed by silently excluding the environment where it
    fails. Also agrees gradient decomposition at a single checkpoint is insufficient.
    Notes that R1''s point about training duration asymmetry further weakens the "self-correction"

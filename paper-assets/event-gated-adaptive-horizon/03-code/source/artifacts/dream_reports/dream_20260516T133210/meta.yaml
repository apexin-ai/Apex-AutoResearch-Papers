    result_rationale: 'Trained dt_emb creates systematic overestimation because the
      RSSM fidelity gap at dt=2 (obs gap 1.30x at inflated absolute levels, reward
      gap 2.78x) is amplified through the observation decoder→dt_emb gradient pathway
      (93% of dt_emb gradient). Every seed with trained dt_emb reliably enters the
      pathological NVE>1.5x regime because the gradient mechanism is deterministic
      — the dt_emb learns to differentiate dt values, and the critic exploits this
      differentiation against inaccurate RSSM predictions. Whether NVE>1.5x becomes
      sustained (→collapse) or transient (→self-correction) depends on early training
      stochasticity: replay buffer sampling order, initialization, and whether the
      actor''s policy gradient from real returns can counteract the critic''s overestimate
      before it locks in (primacy bias, Qiao et al. 2023).


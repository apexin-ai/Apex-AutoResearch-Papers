    seeds exceeding threshold). Including all data: 10/11 trained seeds exceed 1.5×,
    not a perfect classifier.

    - **(Major) NVE threshold is post-hoc**: The 1.5× threshold is selected on the
    same data used to evaluate it. No held-out validation or cross-validation. The
    sensitivity analysis shows any threshold in [1.2, 1.6] performs similarly, suggesting
    the specific 1.5× choice is not robust.

    - **(Major) Table 10 vs Table 12 inconsistency**: Table 10 reports 10/11 trained
    seeds above 1.5× (total across 4 envs), but Table 12 claims 16/16 accuracy using
    only 3 environments (silently dropping Hopper). The abstract and conclusion both
    claim "16/16 across 4 environments," which is misleading.

    - **(Major) Cross-environment evidence is incomplete**: Gradient decomposition
    exists only for Walker Walk. The claim "gradient mechanism generalizes" lacks
    cross-environment replication of the 93%/7%/0% split.

    - **(Major) Gradient decomposition methodology**: Reported at a single checkpoint
    from a single seed. No multi-checkpoint trajectory, no cross-seed verification.

    - **(Minor) Training duration asymmetry**: Baseline runs 505K steps; treatments
    run 55–105K. "Self-corrected" seeds (e.g., 009b at 268@105K) may not be genuinely
    stable.

    - **(Minor) Single baseline for NVE normalization: All NVE values normalized against
    one baseline seed; robustness to baseline choice not demonstrated.

    - **(Minor) No figures**: 15 tables, 0 figures in 10 pages. Learning curves and
    value dynamics are inherently visual.


    **Missing Experiments**:

    - Full-SGS replication in Cheetah Run/Cartpole (closes "gradient mechanism generalizes")

    - Gradient decomposition across multiple checkpoints and seeds

    - Additional seeds (5+ per condition) with bootstrap CIs

    - Longer treatment runs matching 500K baseline

    - NVE threshold out-of-sample validation on held-out environment

    - Pathway B control experiment (vanilla DreamerV3 at matched seeds)


    ---


    ### Reviewer 2 (R2): Novelty and Related Work — Score 3/6


    **Summary**: The paper provides a careful diagnosis of a specific architectural
    failure in dt-conditioned DreamerV3. The gradient decomposition and dual-pathway
    characterization show analytical depth. However, the core contribution is a negative
    result about a modification that was never adopted by the community, and CIVO
    belongs to the well-understood model exploitation failure class.


    **Strengths**:

    - MPC vs imagination-based AC contrast (TAWM comparison) is a genuine insight
    with design implications

    - Gradient decomposition pinpoints the specific architectural pathway (observation
    decoder → dt_emb), going beyond generic "model exploitation"

    - Dual-pathway characterization (value-driven vs eval-driven) adds mechanistic
    depth

    - NVE diagnostic has practical value as an early-warning metric

    - The 2×2 ablation matrix is clean and complete


    **Weaknesses**:

    - **(Major) Novelty is incremental**: CIVO is a specific instance of model exploitation
    (Janner et al., 2019). The positive-feedback loop (critic exploits model → actor
    follows → further exploitation) is the standard model exploitation cycle. The
    additional specificity (dt-embedding + obs decoder gradients) is useful diagnosis
    but not a qualitatively new mechanism.

    - **(Major) Narrow scope**: Diagnoses why a specific modification (dt-embedding)
    to a specific architecture (DreamerV3 RSSM) fails. Nobody in the community was
    actively using dt-conditioned DreamerV3. The paper explains "why not to do X"
    where X was already not being done.

    - **(Major) Diagnostic without solution**: The paper identifies the problem but
    does not validate a fix. The Full-SGS experiment (detach obs-decoder gradients
    from dt-embedding) is mentioned but apparently had configuration issues. Including
    a validated mitigation would substantially increase impact.

    - **(Major) TAWM contrast is underdeveloped**: The explanation ("MPC evaluates
    against real outcomes") is almost tautological. A stronger contribution would
    require formal analysis or showing that importing MPC''s correction mechanism
    into imagination-based training helps.

    - **(Minor) Missing related work**: MOPO/MOReL (pessimistic MBRL), Talvitie (2014,

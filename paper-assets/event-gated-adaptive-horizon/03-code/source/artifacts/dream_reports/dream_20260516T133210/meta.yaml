    model-usage, the deadly triad literature, PETS/ensemble uncertainty, Abbas et
    al. (2020) on selective planning.

    - **(Minor) 12 references is thin for a top venue paper making cross-domain claims.


    **Questions**:

    - Does CIVO hold beyond RSSM (e.g., transformer world models)?

    - What practical scenario leads a researcher to encounter CIVO?

    - How to distinguish CIVO from standard compounding error with additional conditioning?

    - Why not include the validated Full-SGS fix?



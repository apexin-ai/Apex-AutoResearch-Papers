    ## Step 2: Cross-Sharing


    R1 and R2 exchanged reviews. Key observations:


    **R1 on R2''s review**: Agrees that novelty relative to model exploitation literature
    is a concern. Notes that the gradient decomposition specificity (93% obs decoder,
    0% reward) does go beyond Janner et al.''s general framework, but concedes this

    **Shared concerns**: Both reviewers independently flagged (1) insufficient seeds,
    (2) post-hoc threshold selection, (3) 16/16 inconsistency, and (4) missing cross-environment
    mechanistic evidence.


    ---


    ## Step 3: Convergence Discussion


    **Consensus points**:


    1. **The factorial design is sound in principle.** The 2×2 ablation (trained/frozen/absent/untrained
    dt-embedding) is the right experiment. The problem is execution: too few seeds,
    single-checkpoint gradient analysis, and incomplete cross-environment replication.


    2. **The 16/16 claim must be corrected.** With Hopper showing 2/3, the actual
    cross-4-environment accuracy is at most 20/22 (including controls) or 10/11 for
    the trained condition. Reporting "16/16 across 4 environments" in the abstract
    while the data shows otherwise is a significant credibility issue.


    3. **CIVO is model exploitation with useful specificity but limited novelty.**
    The gradient decomposition narrows the mechanism to a specific pathway, which
    is more informative than "model exploitation" alone. But the underlying dynamics
    (critic exploits model inaccuracy, actor follows, feedback loop) are well-understood.
    The contribution is diagnostic precision, not mechanism discovery.


    4. **The paper lacks a validated solution.** The uncertainty-gated truncation
    pilot (-37% eval) shows the problem is targetable but doesn''t solve it. The Full-SGS
    experiment (detaching obs-decoder gradients) appears to work (NVE=1.00×, eval=915.7)

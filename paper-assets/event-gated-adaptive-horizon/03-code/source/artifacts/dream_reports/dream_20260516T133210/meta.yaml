      failure mode — not value overestimation (CIVO) but gradient starvation from
      persistent noise injection. The NVE being far below 1.0x (vs >1.5x for trained)
      is the clean separation: frozen dt_emb → NO CIVO pathway is possible. This completes
      the 2×2 ablation matrix: trained+present (008d)→CIVO, trained+absent (008f)→no

  plan_id: plan_011
  description: 'Replicate CIVO collapse with 2 additional seeds. Registry already
    has data: 009e (seed 1) collapsed NVE peak 4.12x; 009b (seed 2) self-corrected
    NVE peak 2.05x. Under best tier, both seeds exceed NVE>1.5x (confirmed), collapse
    is stochastic 1/2 (confirmed).


narrative_guidance: 'CIVO is a general architectural vulnerability in imagination-based
  actor-critic with dt-conditioning. Under best tier, the gradient decomposition (93%
  obs decoder → dt_emb, 7% KL, 0% reward) + Full-SGS (exp_018, NVE=1.00x→0.72x) closes
  the mechanism at gradient level. Cross-3-environment replication (Walker Walk ✓,
  Cheetah Run, PickCube/Cartpole) elevates the finding from DreamerV3-specific to
  structural warning for temporal-abstraction-in-world-models. TAWM contrast (MPC
  succeeds, imagination fails) is the headline novelty. The 1.5x NVE threshold maintains
  ≥3/4 separating power in every new environment. Pathway B (008e_v3_s2-type eval-driven
  collapse) is either rare (≤1/4 cross-env) or gets clean mechanistic characterization
  via control experiment. Missing from current plan: Full-SGS replication in Cheetah/Cartpole
  — needed to close "gradient mechanism generalizes" claim per tier spec.

  '

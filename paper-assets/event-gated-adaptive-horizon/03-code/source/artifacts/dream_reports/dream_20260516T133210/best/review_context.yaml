- name: Walker Walk 008e_v3 (mitigation) seeds 1-2
  plan_id: plan_014
  description: 'Multi-seed validation of dt=1 imagination mitigation. Already done:
    seed 1 success (869.9@105K), seed 2 collapsed (137@105K) via non-CIVO Pathway

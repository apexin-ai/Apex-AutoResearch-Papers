    critic never evaluates dt>1 imagination steps — the value overestimation feedback
    loop requires dt>1 predictions where RSSM fidelity degrades. However, the trained
    dt_embedding still receives gradient from observation decoders during world model
    training on real dt>1 transitions (subsample ON includes dt=2 in training data).
    This creates a secondary vulnerability: the dt_emb encodes dt-specific information
    that subtly corrupts the latent state representation, even when imagination uses
    only dt=1. Seed 2''s collapse shows eval-driven destabilization (715→452→137)
    with increasing entropy (-5.21→-3.83), the opposite signature of CIVO (which has
    decreasing entropy). The policy destabilizes because the world model''s latent
    space has been distorted by the trained dt_emb, not because the critic directly
    overestimates. This Pathway B is stochastic — seed 1 avoids it because its specific
    initialization leads to a latent representation that is less corrupted by the
    dt_emb gradients.


    random conditioning per dt value. The critic cannot learn dt-specific value adjustments
    → NVE stays far below 1.0x (0.39-0.47), confirming CIVO requires TRAINING of dt_emb.
    However, the frozen random embedding injects constant noise into the actor-critic
    system: the actor receives confusing value gradients (actor_loss→0 = gradient
    signal vanishes), and the gate locks to dt=2 100% because the gate network never
    receives informative gradients to adjust. This produces a distinct failure mode
    — not value overestimation (CIVO) but gradient starvation from persistent noise
    injection. The NVE being far below 1.0x (vs >1.5x for trained) is the clean separation:

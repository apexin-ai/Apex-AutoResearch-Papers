# ============================================================
# NEW: Reward prediction quality → MBRL performance
# ============================================================
# Our key finding: removing dt_embedding causes reward_MAE to spike 75x
# (0.01 → 0.747), making performance seed-dependent. These papers
# establish that reward prediction quality is a known MBRL bottleneck.

- paper_id: lee2024dreamsmooth
  title: "DreamSmooth: Improving Model-based Reinforcement Learning via Reward Smoothing"
  authors: [Lee V., Abbeel P., Lee Y.]
  year: 2024
  venue: ICLR
  category: background
  role: "Directly demonstrates reward prediction is a bottleneck in MBRL — sparse/ambiguous rewards cause the reward model to predict zeros, creating gradient-free landscapes during imagination; our dt_embed_dim=0 ablation creates an analogous bottleneck where the reward head loses temporal conditioning and MAE spikes 75x"
  relevance_score: 5

- paper_id: ma2024harmonydream
  title: "HarmonyDream: Task Harmonization Inside World Models"
  authors: [Ma H., Wu J., Feng N., Xiao C., Li D., Hao J., Wang J., Long M.]
  year: 2024
  venue: ICML
  category: background
  role: "Shows observation prediction dominates reward prediction in world model training, degrading reward model quality; proposes dynamic loss balancing for 10-69% gains — directly relevant to our finding that dt_embedding removal disrupts the observation-reward prediction balance and causes reward MAE explosion"
  relevance_score: 5

- paper_id: lambert2020objective
  title: "Objective Mismatch in Model-based Reinforcement Learning"
  authors: [Lambert N., Amos B., Yadan O., Calandra R.]
  year: 2020
  venue: "L4DC (Proceedings of Machine Learning Research, vol. 120)"
  category: background
  role: "Formalizes that one-step prediction likelihood does not correlate with control performance — the 'objective mismatch' problem; our work reveals a specific instance: the reward head's prediction accuracy (measured by MAE) directly gates whether the critic can learn stable value estimates, creating a reward-specific objective mismatch"
  relevance_score: 4

# ============================================================
# NEW: Auxiliary tasks & representation coupling in world models
# ============================================================
# Our finding: reward prediction quality is tightly coupled to temporal
# conditioning (dt_embedding). Removing the embedding degrades the
# reward head while dynamics remain intact — suggesting the reward head
# acts as more than a passive predictor; it conditions the shared
# representation. Literature gap: no prior work studies this coupling
# specifically in Dreamer-family world models.

- paper_id: jaderberg2017unreal
  title: "Reinforcement Learning with Unsupervised Auxiliary Tasks"
  authors: [Jaderberg M., Mnih V., Czarnecki W.M., Schaul T., Leibo J.Z., Silver D., Kavukcuoglu K.]
  year: 2017
  venue: ICLR
  category: background
  role: "UNREAL — introduces reward prediction as an auxiliary task that shapes shared representations; foundational evidence that reward prediction is not just a passive output but actively conditions what features the network learns — our finding that removing dt_embedding selectively degrades reward prediction (but not dynamics) suggests the temporal conditioning specifically enables reward-relevant feature extraction"
  relevance_score: 4

- paper_id: lyle2021auxiliary
  title: "On The Effect of Auxiliary Tasks on Representation Dynamics"
  authors: [Lyle C., Rowland M., Ostrovski G., Dabney W.]
  year: 2021
  venue: AISTATS
  category: background
  role: "Theoretical analysis showing auxiliary tasks shape representations toward top eigenvectors of the transition operator; provides formal grounding for why removing temporal conditioning from the reward head could alter the entire representation — the reward head's gradients contribute to spectral structure of the shared latent space"
  relevance_score: 4


  - id: "R1-N1"
    summary: "统计检验力严重不足：2-3 seeds 无法支撑 causal factor 声明"
    category: experiment
    severity: critical
    status: resolved
    first_raised_round: 1
    last_seen_round: 3
    mentions:
      - round: 1
        reviewers: [1, 2, 3]
        note: "三位 reviewer 均认同统计效力不足"
      - round: 3
        reviewers: [1, 2]
        note: "RESOLVED。Seeds 增至 4，语言改为 strongest predictor，LOEO AUROC=0.981。"
    action_items:
      - round: 1
        action: "补 seeds 到 4 per key config"
        assigned_to: agent
        status: done
      - round: 1
        action: "弱化因果语言: causal factor → strongest predictor"
        assigned_to: paper_agent
        status: done
      - round: 1
        action: "统计报告改用 IQM + bootstrap CI per Agarwal et al. 2021"
        assigned_to: paper_agent
        status: done
    resolution: "Seeds 增至 4，因果语言全面弱化为 strongest predictor，LOEO 交叉验证 AUROC=0.981。"
    resolution_round: 3


new_figures:
  - id: fig_intervention_heatmap
    title: "Intervention hierarchy heatmap"
    type: statistical  # → matplotlib, NOT PaperBanana
    tool: matplotlib
    description: |
      Heatmap showing intervention outcomes across environments.
      X-axis: intervention type (Reward SGS, Full SGS, Obs-decoder SGS, RAVE, TCN σ=0.2,
              TCN σ=0.5, Narrow Dual, Wide Single, Wide Dual)
      Y-axis: environment (Walker Walk, Cheetah Run)
      Each cell: colored by outcome (blue = prevention/success, orange = failure/CIVO onset)
      Annotated with prevention rate (e.g., "0/2", "3/4") and representative NVE value.
      Colorblind-friendly palette: "#0072B2" (blue, success), "#E69F00" (orange, failure).
    narrative_intent: |
      At a glance, show that CIVO is resilient across ALL intervention levels and BOTH
      environments. The only partially-blue cell is Wide Dual on Walker — everything else
      is orange. This visual makes the "systematic resilience" claim immediate.
    design_notes: |
      - Single-column width (fits in §5)
      - Clean grid, no matplotlib defaults
      - Cell annotations: "0/2" in white text on colored background
      - Gray cells for untested combinations
      - Caption references Table intervention_hierarchy for full data
    data_source: "Table intervention_hierarchy (already in paper)"
    placement: "§5 Why Standard Remedies Fail"
    output_path: figures/paper/fig_intervention_heatmap.pdf
    aspect_ratio: "3:2"


        3.3 F2: Trained Temporal Embedding Precedes Value Overestimation (unchanged)
        3.4 F3-F5: Causal Ablation and Cross-Environment Validation (unchanged)
        3.5 F6: dt=1 Imagination Eliminates CIVO (extracted from current 3.5, F6 paragraph only)
      REMOVED from §3 (moved to new §5):
        - F7 paragraph (gradient stopping)
        - §3.6 Forward-Pass Interventions (RAVE, TCN)
        - §3.7 Architecture-Level Ablation (critic convergence, wide dual-critic)
        - Table: intervention_hierarchy (moves to §5)
      F6 figure (fig_multiple_pathways) stays in §3.

  - id: why_remedies_fail
    title: "Why Standard Remedies Fail"
    file: sections/remedies.tex  # NEW FILE
    target_pages: 0.75
    reframe_action: new_section
    content_outline: |
      Independent section providing higher-level failure pattern analysis.
      NOT a rewrite of Results — the experimental data (seeds, NVE values, eval numbers)
      remains in §3. This section synthesizes failure PATTERNS across intervention levels.

      Structure (3 paragraphs + unifying insight):

      ¶1 Gradient-level: magnitude ≠ causality
        - Reward head carries substantial gradient flow but reward-only SGS is ineffective
          (exp_016e NVE 10.42×, exceeding untreated max 4.72×)
        - Full-pathway SGS creates metastable regime (1/2 seeds delay, 1/2 collapse)
        - Obs-decoder-only SGS: 1/6 prevention → blocking one pathway redistributes co-adaptation
        - Key insight: gradient magnitude does not predict causal importance

      ¶2 Output/Representation-level: anchors drift, noise shows phase transitions
        - RAVE: EMA anchor tracks biased values during CIVO onset → capping becomes permissive
        - TCN: effective dose differs 5× across environments (σ=0.2 Walker vs σ=1.0 erodes Cheetah)
        - Binary on/off behavior (2/4 Walker at σ=0.2: suppress or escalate, no intermediate)
        - TCN dose sensitivity suggests phase transition rather than smooth regularization

      ¶3 Architecture-level: pessimism vanishes in shared-data regimes
        - Dual critics converge (ρ > 0.999, pessimism 3-4% of independent bound)
        - Mechanism: shared imagined rollouts → same training distribution → convergence
        - 2×2 factorial: min-aggregation enables recovery, increased capacity enables prevention
        - Wide dual-critic (min + ~2.4M) achieves 3/4 prevention (Walker only; Cheetah 0/1)

      ¶ closing: Unifying insight
        - Closed-loop imagination structurally defeats single-pathway interventions
        - The learned model generates both training data and bootstrap targets
        - Any remedy that assumes diverse/independent training sources loses corrective power
        - Only architectural changes that break the closed loop (wide dual-critic) partially succeed

      Table: intervention_hierarchy (moved from §3, unchanged)
    data_source: "All data already in paper (Table intervention_hierarchy, Appendix refs). No new experiments."

  - id: discussion
    title: "Discussion"
    file: sections/analysis.tex
    target_pages: 1.5
    reframe_action: expand
    changes: |
      Current: 3 paragraphs (CIVO mechanism, Why interventions fail, Practical implications).
      After reframe: 4 paragraphs.

      ¶1 CIVO mechanism (expand with random-policy decomposition from appendix):
        - Current content stays
        - ADD: random-policy decomposition detail (~36% dynamics bias, ~64% actor exploitation)
        - ADD: signed reward error analysis (dt=2 UNDERpredicted, mean SE=-0.599)
          → rules out observation-level overprediction, localizes to imagination-level prior drift
        - This is the "expanded mechanism analysis" from page budget (+0.50 page)

      ¶2 Catastrophic consequence (NEW paragraph, Director change #3):
        "Even at the lower bound of onset probability, every CIVO-positive seed suffers
        irrecoverable performance collapse (eval < 30% baseline), making diagnosis essential
        regardless of onset frequency."
        Expand with: 5/7 multi-joint seeds trigger CIVO; of those, 3 sustain collapse, 1
        self-corrects with permanent performance deficit, 1 shows NVE self-correction without
        policy recovery. The binary nature (healthy OR collapsed, no graceful degradation)
        means standard training practices cannot tolerate even low onset probability.

      ¶3 Practical implications (current content, minor update):
        - Integrate CIVO resilience framing
        - Guidelines unchanged

      ¶4 Implications beyond DreamerV3 (restore as separate paragraph):
        - Re-expand from the merged version (was cut during 8-page compression)
        - The structural constraint (shared imagined rollouts defeat diversity-based remedies)
          applies to any imagination-based actor-critic

  - id: conclusion
    title: "Conclusion"
    file: sections/conclusion.tex
    target_pages: 0.5
    reframe_action: expand
    changes: |
      Restore two-paragraph structure (was compressed to single paragraph for 8-page limit).
      Para 1: Core findings (CIVO identification, causal factor, NVE diagnostic).
      Para 2: Intervention resilience insight + practitioner recommendations + future work.
      Add Limitations back as separate section (unchanged).

  - id: abstract
    title: "Abstract"
    file: sections/abstract_body.tex
    target_pages: 0.15
    reframe_action: patch
    changes: |
      Minor update: add "systematic resilience to standard RL remedies" language.
      Ensure abstract reflects new §5 existence. No data changes.


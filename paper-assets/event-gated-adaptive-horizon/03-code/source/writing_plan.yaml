    target_pages: 1.2
    reframe_action: patch
    changes: |
      Add to contribution list item 2 (intervention hierarchy):
      "CIVO exhibits systematic resilience: gradient interventions fail from pathway redundancy,
      output interventions fail from anchor drift, representation interventions show phase transitions,
      and pessimistic estimation fails from critic convergence in shared-data regimes."
      This is the CIVO resilience unifying statement (Director change #2).

  - id: related_work
    title: "Related Work"
    file: sections/related_work.tex
    target_pages: 1.0
    reframe_action: patch
    changes: |
      Replace final sentence of §2 (currently: "This paper fills the gap at the intersection
      of temporal conditioning and imagination-based value estimation: we isolate learned
      dt-embeddings as the causal factor, characterize the resulting value overestimation,
      and evaluate a four-level intervention hierarchy.")
      With (Director change #5):
      "This paper fills the gap at the intersection of temporal conditioning and
      imagination-based value estimation, revealing that shared imagined rollouts create
      a structural constraint: remedies that rely on training-data diversity—Double Q
      pessimism, ensembles, noise injection—lose their corrective power when both the
      training distribution and bootstrap targets are generated by the same learned model."

  - id: experiments_results

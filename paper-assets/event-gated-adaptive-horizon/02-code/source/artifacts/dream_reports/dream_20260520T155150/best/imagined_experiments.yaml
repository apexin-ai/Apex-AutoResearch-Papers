- name: Uncertainty-gated imagination truncation pilot
  plan_id: plan_060
  description: '监控 imagination rollout 中 RSSM prediction uncertainty，超阈值时截断。 与 TCN（已验证）互补的
    forward-pass 干预思路。

    '
  expected_results:
    eval_peak: 450
    eval_105K: 380
    nve_max: 1.8
    nve_mean_65K_105K: 1.2
    collapse: false
    truncation_rate_at_105K: ~30% of imagination steps truncated at dt=2
    effective_horizon_reduction: H_eff ~12.5 (from H=15, due to truncation)
    civo_reduction_vs_untreated: partial (NVE 1.8× vs untreated 2-4×)
  result_rationale: "Uncertainty-gated truncation 在 RSSM 预测不确定性高时缩短 imagination horizon。\
    \ 这是 forward-pass 层面的干预——不修改 embedding 或梯度，而是限制不可靠 prediction 的使用范围。 预测部分有效（NVE\
    \ 1.8× vs untreated 2-4×），因为： (1) RSSM uncertainty 确实在 dt>1 步较高，truncation 减少了不可靠\
    \ predictions 对 value 的影响； (2) 但 uncertainty calibration 不完美——RSSM 的 aleatoric/epistemic\
    \ uncertainty 估计\n    可能滞后于实际 prediction error 的恶化，导致截断时机偏晚；\n(3) truncation 减少有效\
    \ horizon，牺牲 long-horizon credit assignment。 相比 TCN σ=0.2 的完全 CIVO 预防（NVE < 1.0×），truncation\
    \ 是 weaker intervention， 但提供 mechanistic insight：RSSM uncertainty 与 CIVO 风险正相关。\
    \ 在 best tier 叙事中，truncation 作为 \"forward-pass intervention 有效性的独立确认\"， 而 TCN\
    \ 是推荐的 principled mitigation。\n"
  tables: []
  figures_description:
  - 'Fig (appendix): Truncation rate vs training step。随训练推进，dt=2 imagination 被截断比例逐渐下降（RSSM
    improves），但 CIVO 已在早期种下。'
  analysis: 'Plan_060 在 best tier 中是辅助证据，非核心。 TCN 已占据 C8 的 primary mitigation 位置。
    Truncation 的部分成功（NVE 从 2-4× 降至 ~1.8×）进一步确认 forward-pass 是正确的干预层级， 但 TCN 的 mechanism（降低
    conditioning precision）比 truncation（缩短 horizon）更根本。

    '

tier: best
narrative_guidance: 'Forward-pass intervention thesis cross-seed + cross-env validated
  — 诊断论文升级为 diagnosis + principled mitigation。 核心叙事：backward-pass 干预全面失败（C7, 17 seeds,
  3 SGS 变体, 2 environments）→ forward-pass noise injection 成功（C8, TCN） → 确证 CIVO 是
  forward-pass representational damage 而非 gradient contamination。 TCN σ=0.2 在 Walker
  跨 seed 复现（2/2 seeds NVE < 1.0×），TCN σ=0.5 在 Cheetah 成功（NVE 从 8-108× 降至 1.5-4×）。
  Dose-response（σ 与 untreated CIVO severity 正相关）提供额外机制洞察。 标题更新为 "Diagnosing and Mitigating
  Value Overestimation from Temporal Abstraction in DreamerV3"。 C1-C8 全文保留，8 claims
  全部有充分数据支撑。

  '

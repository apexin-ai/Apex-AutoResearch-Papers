    in latent-dynamics models）。truncation 面临 两难： (1) 阈值太低 → 大部分 rollouts 被截断到 H=3-5
    → 有效 horizon 太短，学习退化； (2) 阈值太高 → 允许 high-error rollouts 通过 → CIVO 照常发生。 实际运行中，平均有效
    horizon 被压缩到 H=6.2（from H=15），严重限制了长期 planning 能力。但即使如此，RSSM 在 "overconfident
    区域"（低 uncertainty 但 high actual error）仍然产生足够的 bad rollouts 来触发 CIVO。 NVE@65K 突破
    1.5x，此后振荡在 1.3-2.2 之间——truncation 部分缓解但不消除。 worst 档结论：uncertainty calibration

narrative_guidance: 'TCN s0 σ=0.2 Walker 是项目唯一的干预"成功"，worst 档判定这是初始化随机性导致的 outlier，
  与 008e_v3 的 seed-dependent collapse 模式一致（s1/s4 成功，s2/s3 崩溃，50% 率）。 TCN 改变了 bifurcation
  probability 但没有消除 vulnerability。所有前向干预在跨 seed 或跨环境 复现时失败。论文锁定纯诊断版本（C1-C7），C8 降为
  appendix negative result。 核心 story arc: 诊断的价值恰恰因为干预失败而强化——如果 CIVO 能被简单噪声方案修复， 这篇诊断论文就不
  interesting。TAWM 对比成为 novelty 核心。 标题锁定: "Conditioning-Induced Value Overestimation
  in Variable-Rate World-Model Imagination"。

  '

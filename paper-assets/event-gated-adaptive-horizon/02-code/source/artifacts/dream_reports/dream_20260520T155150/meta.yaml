    # DREAM Review Report — Consolidated Roundtable


    **Paper:** "Diagnosing and Mitigating Value Overestimation from Temporal Abstraction
    in DreamerV3"

    **Venue:** CoRL 2026

    **Review Mode:** Full (2 Reviewers, 4-step roundtable)

    **Dream ID:** 20260520T155150


    ---


    ## Roundtable Summary


    Two independent reviewers (R1: Methods+Experiments; R2: Novelty+Related Work)
    conducted blind reviews, then cross-shared findings and converged on the assessment
    below. Both reviewers agree on the paper''s core diagnostic contribution, its
    key experimental strengths, and its critical weaknesses. The main disagreement—whether
    the paper sits at "marginally below" (R1: 5) or clearly below threshold (R2: 4)—was
    resolved by examining the CoRL-specific relevance question in detail.


    ---


    ## R1 Review: Methods and Experiments


    ### Summary

    The paper presents a systematic factorial diagnostic of variable-rate imagination
    in DreamerV3, identifying CIVO (conditioning-induced value overestimation) triggered
    by trained dt_embedding + multi-rate data exposure. The 2×2 causal matrix and
    gradient decomposition analysis are well-executed. However, the mitigation story
    is weak (TCN works on ~1 environment at 1 noise level), seed counts are low for
    many claims, and the environmental scope is narrow for an "architectural-level
    vulnerability" claim.


    ### Strengths

    1. **Clean factorial ablation design.** The 2×2 causal isolation (trained/frozen/removed
    embedding × multi-rate/single-rate data) with controls (008d vs 008f vs 008a vs
    015b) is textbook ablation design.

    2. **Well-validated NVE diagnostic.** AUROC = 0.969 on n=26 classifications with
    bootstrap CIs. Honest reporting of false positives and temporal validity constraints
    (35K+ only).

    3. **Gradient magnitude ≠ causal importance.** The finding that reward head gradients
    (38–49%) are causally irrelevant while obs-decoder gradients (16–22%) carry critical
    information is genuinely surprising and useful.

    4. **Honest negative result reporting.** TCN''s 2/8 prevention rate, SGS universal
    failure, and stochastic collapse rates are transparently presented.

    5. **Dual collapse pathway documentation.** Pathway A (value-driven, entropy ↓)
    vs Pathway B (eval-driven, entropy ↑) with 4-seed split is mechanistically interesting.

    6. **MPC vs imagination-based architectural distinction.** Clear structural explanation
    for why dt-conditioning works in TAWM but fails in DreamerV3.


    ### Weaknesses

    1. **Narrow environmental scope.** Core factorial analysis uses only Walker Walk
    and Cheetah Run (both DMC locomotion, proprioceptive). Cartpole and Hopper data
    appear in aggregate tables (Tables 9–11) but with limited per-seed detail. The
    "architectural vulnerability" claim needs broader validation.

    2. **Low seed counts for critical experiments.** Frozen embedding: 1 seed. TCN
    Cheetah: limited seeds. RAVE: 1 seed per config. TCN Walker σ=0.2: only 2 seeds
    with massive eval variance (45–91% of baseline). Many "configurations" in the
    30+ count are single-seed.

    3. **TCN mitigation is unconvincing.** Works reliably only on Walker at σ=0.2.
    Cheetah σ=0.5 still exceeds the paper''s own 1.5× threshold (NVE 1.5–4×). "Mitigating"
    in the title oversells the contribution. Dose-response has only 2 data points
    per environment.

    4. **NVE threshold circularity.** Calibrated and validated on the same data. No
    held-out test set. Expansion from n=10 to n=29 includes experiments designed with
    knowledge of NVE. In-sample AUROC inflates apparent robustness.

    5. **No comparison with standard overestimation countermeasures.** Double Q-learning,
    TD3-style clipping, ensemble critics, and MBPO-style rollout truncation are not
    tested. Impossible to assess whether CIVO is resistant to known techniques.

    6. **Asymmetric training lengths.** Treatments at 105K vs baseline at 505K. Self-correcting
    seeds might recover; TCN protection might be temporary (Walker seed 1 degrades
    from 401→161 at 215K).

    7. **RSSM fidelity gap measured at single checkpoint.** The 2.78× reward gap temporal
    evolution is not shown—cannot distinguish whether the gap causes or follows CIVO
    onset.


    ### Claim-by-Claim Assessment

    | Claim | Evidence | Key Concern |

    |-------|----------|-------------|

    | C1: Variable-rate degradation | Strong | Only 2 core envs for detailed analysis
    |

    | C2: Trained dt_emb → CIVO, NVE diagnostic | Moderate | In-sample AUROC; "sufficient"
    complicated by 008e_v3 |

    | C3: Untrained dt_emb → suppression | Strong | Clean cross-env replication |

    | C4–C5: dt monotonicity, subsampling | Moderate | Some single-seed comparisons
    |

    | C6: Dual pathways | Moderate | Pathway A in 008e_v3 with dt=1 imagination contradicts
    mechanism |

    | C7: Backward-pass failure | Moderate-Strong | 0/3 SGS variants × 2 envs; limited
    by single-seed on some |

    | C8: TCN mitigation | Weak | 2/8 prevention; 1/3 environments; massive eval variance
    |


    ### R1 Scores

    - Soundness: 3/4

    - Empirical Rigor: 2/4

    - Reproducibility: 3/4

    - CoRL Relevance: 2/4

    - Overall Rating: 5/10

    - Confidence: 4/5


    ---


    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper identifies CIVO as a specific instance of the well-known MBRL model
    exploitation failure class, applied to temporal conditioning in DreamerV3. The
    factorial design is rigorous and the causal isolation convincing. However, conceptual
    novelty is limited: CIVO extends known value overestimation phenomena, NVE is
    a standard normalized ratio, TCN is standard noise injection, and the dual-pathway
    distinction lacks mechanistic explanation. The absence of any robotics component
    is a significant weakness for CoRL.


    ### Strengths

    1. **Rigorous factorial causal isolation.** The 2×2 matrix with appropriate controls
    follows best practices from the "what matters" literature.

    2. **MPC vs imagination bootstrapping contrast.** A genuine architectural insight
    explaining why temporal conditioning succeeds in TAWM but fails in DreamerV3.

    3. **Gradient magnitude ≠ causal importance.** Concrete, surprising result about
    reward head (38–49% of gradients, causally irrelevant) vs obs-decoder (16–22%,
    causally critical).

    4. **Comprehensive intervention hierarchy.** 8+ configurations across 3 intervention
    levels with 26+ seeds. Systematic negative evidence saves future research effort.

    5. **Honest limitations reporting.** Transparent about TCN''s narrow success,
    stochastic collapse, and NVE false positives.


    ### Weaknesses

    1. **CIVO is a specific instance of a well-characterized failure class.** Model
    exploitation (Janner et al. 2019), value overestimation from function approximation
    (Thrun & Schwartz 1993, Fujimoto et al. 2018), and delusional bias (Lu et al.
    2018) are established. The novelty is in identifying the specific trigger, not
    discovering a new failure mode.

    2. **NVE is trivially constructed.** A normalized V/E ratio with AUROC on n=26
    from a single codebase. Standard monitoring practice with presentation sophistication.

    3. **TCN is not novel.** Gaussian noise injection for regularization is decades
    old (dropout, label smoothing, noisy nets, input noise). Applying it to dt_embedding
    is straightforward—and it mostly fails.

    4. **No robotics component for CoRL.** DMC proprioceptive tasks only. No real-robot
    experiments, no visual observations, no contact-rich manipulation. The paper reads
    as a DMC-specific diagnostic study.

    5. **Dual-pathway distinction lacks mechanistic explanation.** Pathway A vs B
    are empirically distinguished by entropy signatures, but "early training stochasticity"
    is an admission of non-understanding, not an explanation.

    6. **Forward-pass vs backward-pass is primarily a negative result.** Informative
    but incremental: establishes what doesn''t work without providing a working solution.

    7. **Limited statistical power.** Many comparisons use 2–4 seeds. Stochastic collapse
    rate (50%) from n=4. Claims'' strength sometimes exceeds statistical evidence.


    ### Novelty Assessment

    | Component | Novelty | Justification |

    |-----------|---------|---------------|

    | CIVO phenomenon | Medium | Specific trigger identification within known failure
    class |

    | NVE diagnostic | Low | Standard normalized ratio |

    | TCN mitigation | Low | Known technique, mostly fails |

    | Forward vs backward-pass | Medium | Informative negative result, not constructive
    |

    | Dual-pathway distinction | Low-Medium | Empirical taxonomy without mechanism
    |

    | **Overall** | **Medium-Low** | Value is in systematic rigor, not conceptual
    innovation |


    ### Missing Related Work

    - Semi-MDP value function theory (Bradtke & Duff 1995)

    - Model regularization in MBRL: PETS ensembles, MOReL pessimistic MDPs

    - Noise injection theory: Bishop 1995 ("Training with Noise = Tikhonov Regularization"),
    Fortunato et al. 2018 (noisy nets)

    - Value overestimation in model-free RL: TD3 (Fujimoto et al. 2018), REDQ

    - HAM (Parr & Russell 1998), MAXQ (Dietterich 2000) for hierarchical RL

    - Plasticity loss literature (Lyle et al. 2023) relevant to seed-dependent collapse

    - Only 17 references total—thin for a venue like CoRL


    ### R2 Scores

    - Novelty: 2/4

    - Related Work: 2/4 (only 17 references; important gaps)

    - Clarity: 3/4

    - Significance: 2/4

    - CoRL Relevance: 1/4

    - Overall Rating: 4/10

    - Confidence: 4/5


    ---


    ## Roundtable Step 2: Cross-Sharing


    ### Points of Agreement (strong consensus)

    1. **Factorial design is the paper''s best asset.** Both reviewers rate the 2×2
    ablation matrix and controlled experimental design as genuinely well-executed.

    2. **TCN mitigation is the paper''s weakest claim.** R1 rates C8 as "Weak" evidence;
    R2 calls TCN "underwhelming" with 2/8 success rate. Both agree "Mitigating" in
    the title oversells.

    3. **Narrow environmental scope.** Both flag that 2 core environments (Walker,
    Cheetah) are insufficient for "architectural-level" claims. Cartpole and Hopper
    appear in aggregate tables but with limited detail.

    4. **Low seed counts undermine statistical claims.** Multiple critical experiments
    have 1–2 seeds.

    5. **Missing standard baselines.** Neither Double Q-learning nor ensemble critics
    are compared.

    6. **CoRL relevance is limited.** No robotics tasks, no real-robot experiments,
    no visual observations.

    7. **Honest reporting is appreciated.** Both credit the authors'' transparency
    about limitations.


    ### Points of Disagreement

    1. **NVE metric value.** R1 credits the AUROC analysis (0.969) as meaningful;
    R2 dismisses it as a trivially constructed ratio with inflated presentation. **Resolution:**
    The metric itself is simple, but the systematic validation (26/26 classification,
    sensitivity analysis, temporal validity constraints) adds genuine utility. Rate
    as low-to-medium novelty but moderate practical value.

    2. **Overall rating gap (R1: 5 vs R2: 4).** R1 weights the diagnostic contribution
    more; R2 weights the novelty and CoRL relevance penalties more. **Resolution:**
    For CoRL specifically, the absence of robotics relevance is a significant downgrade.
    However, the diagnostic contribution has genuine value for the MBRL community.
    Converge on **5** (marginally below) — the paper has redeeming scientific quality
    but falls short on novelty, scope, and venue fit.

    3. **Severity of novelty concern.** R1 focuses on methodological gaps; R2 argues
    the conceptual contribution is incremental. **Resolution:** Both perspectives
    are valid. The paper is a careful empirical investigation of a known failure class
    in a specific setting. This is useful but not the type of insight-generating contribution
    CoRL seeks.


    ---


    ## Roundtable Step 3: Convergence — Consolidated Assessment


    ### Overall Judgment

    The paper presents a **technically competent diagnostic study** that identifies
    the specific conditions under which temporal conditioning fails in DreamerV3''s
    imagination-based actor-critic. The factorial design is clean, the causal isolation
    is convincing, and the gradient decomposition finding is genuinely informative.
    However:


    1. **The conceptual contribution is limited.** CIVO is a specific instance of
    known MBRL model exploitation. The paper identifies the trigger (trained dt_embedding
    + multi-rate exposure) but does not provide new theoretical insight into why this
    happens beyond the intuitive explanation (RSSM fidelity gap → critic exploitation
    → positive feedback).


    2. **The mitigation is inadequate.** TCN works on 1/3 environments tested, and
    even there with significant eval variance. "Diagnosing and Mitigating" is an overstatement—the
    paper diagnoses well but does not provide a reliable mitigation.


    3. **Statistical power is insufficient for several claims.** Many experiments
    use 1–2 seeds. The NVE threshold is validated in-sample. The dose-response has
    2 data points. The stochastic collapse rate (50%) is estimated from n=4.


    4. **CoRL relevance is weak.** No robotics tasks, no real-robot experiments, no
    visual observations, no discussion of sim-to-real. The paper is better suited
    for ICML/NeurIPS as a methodological analysis.


    5. **Reference list is thin.** 17 references miss important related work in value
    overestimation (TD3), model regularization (PETS, MOReL), noise injection theory,
    and hierarchical RL.


    ### Key Questions for Authors (Priority-Ordered)

    1. Why were standard overestimation countermeasures (Double Q-learning, ensemble
    critics) not tested? This is the most obvious experimental gap.

    2. Does the RSSM fidelity gap (2.78×) precede or follow CIVO onset? A temporal
    plot would strengthen the causal claim.

    3. TCN Walker seed 1 degrades from 401→161 by 215K. Is TCN merely delaying collapse
    rather than preventing it?

    4. How does CIVO manifest with visual (pixel) observations, where the obs-decoder
    channel (identified as causally critical) carries much more information?

    5. What is the expected false-positive rate of the NVE detector on unseen environments
    with different reward scales?


    ### What Would Strengthen the Paper

    - Test standard overestimation countermeasures (Double Q, ensembles) as baselines

    - Expand to 3+ seeds for all critical experiments

    - Add at least one robotics-relevant task with visual observations

    - Validate NVE threshold on held-out environments

    - Characterize TCN dose-response with >2 σ values

    - Run treatments to the same length as baselines (505K)

    - Expand reference list to cover value overestimation, model regularization, and
    noise injection literature


    ---


    ## Consolidated Scores


    | Dimension | R1 | R2 | Converged |

    |-----------|----|----|-----------|

    | Soundness / Novelty | 3/4 | 2/4 | 2.5/4 |

    | Empirical Rigor / Significance | 2/4 | 2/4 | 2/4 |

    | Reproducibility / Clarity | 3/4 | 3/4 | 3/4 |

    | CoRL Relevance | 2/4 | 1/4 | 1.5/4 |

    | **Overall Rating** | **5/10** | **4/10** | **5/10** |

    | Confidence | 4/5 | 4/5 | 4/5 |


    **Converged Overall Rating: 5/10 — Marginally below acceptance threshold**


    **Rationale:** The paper demonstrates genuine technical competence in its diagnostic
    methodology—the factorial design, causal isolation, and gradient decomposition
    are well-executed. However, the limited novelty (known failure class, standard
    metric, standard regularization technique), the weak mitigation story (TCN succeeds
    on ~1/3 environments), insufficient statistical power (many 1–2 seed experiments),
    and poor CoRL venue fit (no robotics component) collectively place this below
    the acceptance bar. The paper would be a stronger submission to an ML methodology
    venue (ICML/NeurIPS workshop or main conference) with expanded experiments and
    standard baselines, or to CoRL with robotics-relevant evaluation tasks.


    **Decision recommendation:** Reject (marginally below threshold). Encourage resubmission
    with: (1) standard overestimation baselines, (2) adequate seed counts, (3) robotics-relevant
    evaluation, and (4) expanded related work.'

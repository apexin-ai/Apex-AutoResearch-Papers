    # Dream Review Report — Full Roundtable


    **Paper**: "Why Temporal Abstraction Fails in Imagination-Based RL: A Diagnostic
    Analysis of Variable-Rate DreamerV3"

    **Venue**: CoRL 2026 (10th Conference on Robot Learning)

    **Review Mode**: Full (2 Reviewers, 4-step roundtable)

    **Date**: 2026-05-20


    ---


    ## 1. Paper Summary


    The paper investigates why variable-rate imagination (dt>1) consistently degrades
    performance in DreamerV3. Through a factorial experiment design spanning 31+ configurations
    across 4 DeepMind Control Suite environments (Walker Walk, Cheetah Run, Cartpole
    Swingup, Hopper Hop), the authors identify **conditioning-induced value overestimation
    (CIVO)** as the root failure mode. A trained temporal-step embedding (`dt_embedding`)
    enables the critic to exploit precise but inaccurate multi-step RSSM predictions,
    triggering a positive feedback loop where overestimated values drive the actor
    toward states whose values are further overestimated.


    **Five stated contributions:**

    1. Controlled factorial diagnosis (C1–C7) isolating trained `dt_embedding` as
    necessary and sufficient for CIVO across 4 environments

    2. Normalized Value Excess (NVE) diagnostic metric achieving AUROC=0.969 at 1.5×
    threshold

    3. Dual-pathway vulnerability: trained `dt_embedding` creates collapse risk through
    both CIVO (Pathway A, value-driven) and non-CIVO policy instability (Pathway B,
    eval-driven)

    4. Comprehensive SGS failure (1/17 seeds), establishing backward-pass interventions
    as categorically insufficient

    5. Exploratory TCN forward-pass intervention achieving CIVO prevention on Walker
    Walk only (environment-specific)


    ---


    ## 2. Venue Standards (CoRL)


    **Scoring scale**: OpenReview 1–10 (10 = top 5% seminal; 7 = good accept; 5 =
    marginally below threshold; 3 = clear reject)

    **Acceptance rate**: ~25–30%

    **Review dimensions**: Originality, Quality, Clarity, Significance, Relevance
    (to robot learning), Limitations

    **Key CoRL expectations**: Relevance to physical robot learning; results on robot-relevant
    tasks preferred; limitations section required and honestly treated


    ---


    ## 3. Reviewer Assignments


    | Reviewer | Focus Areas | Initial Score | Post-Roundtable Score |

    |----------|-------------|---------------|----------------------|

    | R1 | Methods + Experiments | 5/10 (Borderline, leaning reject) | 5/10 (maintained)
    |

    | R2 | Novelty + Related Work | 4/10 (Reject) | 5/10 (revised up) |


    ---


    ## 4. Consolidated Strengths


    ### S1: Rigorous factorial causal isolation (R1+R2 unanimous)

    The 2×2 ablation matrix (trained/frozen/removed embedding × multi-rate/single-rate
    data) with appropriate controls (008d, 008a, 008f, 015b) is textbook causal isolation.
    The finding that both factors are jointly necessary — neither trained embedding
    alone nor multi-rate exposure alone triggers CIVO, while their combination does
    universally — is cleanly established across 4 environments.


    ### S2: MPC vs. imagination architectural insight (R1 strong, R2 moderate)

    The paper clearly articulates why dt-conditioning works in TAWM/TD-MPC2 (MPC re-plans
    from real states, breaking the feedback loop) but fails in DreamerV3 (actor-critic
    trains entirely within imagination, closing a positive feedback loop). This is
    the paper''s strongest conceptual contribution and provides actionable guidance:
    do not naively transfer temporal conditioning from MPC to imagination-based methods.
    No prior work makes this distinction explicit with mechanistic evidence.


    ### S3: Gradient magnitude ≠ causal importance (R1+R2 unanimous)

    The dissociation between gradient magnitude (reward head: 38–49%) and causal importance
    (observation decoder: 16–22%) is genuinely surprising and informative. This has
    implications beyond CIVO for how researchers debug multi-head architectures in
    MBRL.


    ### S4: Systematic intervention hierarchy as comprehensive negative evidence (R1+R2
    unanimous)

    Testing 8 configurations across 3 levels (gradient-level SGS 1/17; output-level
    RAVE; representation-level TCN) provides structured negative evidence that saves
    future researchers from re-exploring dead ends. The compensatory amplification
    finding (blocking one gradient pathway shifts co-adaptation to others) is mechanistically
    interesting.


    ### S5: Transparent and honest reporting (R1+R2 unanimous)

    The paper does not oversell: C6 partially falsified, TCN scoped as "exploratory,"
    all per-seed trajectories reported, NVE false positives acknowledged, wide confidence
    intervals disclosed. This is commendable and exceeds the norm for diagnostic papers.


    ### S6: Cross-environment validation with 4 DMC environments

    CIVO severity scales with environment complexity (Cartpole 1.8–5.2×, Walker 2.0–4.1×,
    Hopper 4–40×, Cheetah 5.8–108×). The 0/10 CIVO rate under embedding removal across
    3 environments (Table 5) vs near-universal NVE > 1.5× with trained embedding provides
    strong causal evidence.


    ---


    ## 5. Consolidated Weaknesses


    ### W1: No standard value overestimation countermeasures tested (R1+R2 unanimous,
    **Major**)

    The paper does not test Double Q-learning, TD3-style clipped double Q, ensemble
    critics (REDQ), or MBPO-style rollout truncation. These are the most natural baselines
    for a paper claiming value overestimation is resistant to intervention. Without
    them, reviewers cannot determine whether CIVO is genuinely novel-in-resistance
    or whether standard countermeasures would work. The authors should at minimum
    *discuss* why DreamerV3''s architecture (single critic, categorical value prediction,
    symlog transforms, pure-imagination training) makes direct application of these
    methods non-trivial.


    ### W2: Weak CoRL relevance (R1+R2 unanimous, **Major**)

    All experiments use DMC simulation environments with proprioceptive observations.
    No real-robot experiments, no visual observations, no contact-rich manipulation
    beyond a single-seed PickCube experiment. The observation decoder is identified
    as the causally critical gradient channel, yet all experiments use low-dimensional
    proprioceptive state — pixel observations would fundamentally change the gradient
    decomposition. CoRL expects robotics-relevant contributions.


    ### W3: Limited conceptual novelty (R2 strong, R1 moderate, **Moderate**)

    CIVO is a specific instantiation within the well-characterized MBRL model exploitation
    failure class. Value overestimation from inaccurate dynamics models, compounding
    prediction errors, and delusional bias are all established phenomena. The novelty
    lies in identifying the *specific trigger* (trained dt-embedding + multi-rate
    exposure) and the MPC/imagination distinction, not in discovering a fundamentally
    new failure class. The NVE metric is a straightforward normalized ratio; TCN is
    standard noise injection.


    ### W4: Insufficient statistical power for several claims (R1+R2 unanimous, **Moderate**)

    Frozen embedding: 1 seed. RAVE: 1 seed per config. TCN Walker σ=0.2: 2 seeds with
    2× eval variance (821 vs 460). Cheetah main CIVO condition: 2–3 seeds. The 50%
    stochastic collapse rate from n=4 has a 95% CI spanning [7%, 93%]. NVE validated
    in-sample only with no held-out environment set. The AUROC is computed on the
    experiments used to calibrate the threshold.


    ### W5: TCN mitigation is weak and environment-specific (R1+R2 unanimous, **Moderate**)

    TCN achieves CIVO prevention in only 2/8 tested configurations (Walker Walk σ=0.2
    seeds only). Cheetah Run resists all dosages; PickCube fails; σ=0.1 insufficient;
    σ=0.5 destructive. Seed 1 on Walker reaches only 50% baseline (vs seed 0 at 90%).
    Evidence suggests TCN may merely delay rather than prevent CIVO. The effective
    σ band is narrow ([0.15, 0.35] for Walker) and cannot be predicted for new environments
    without trial-and-error.


    ### W6: Asymmetric training durations (R1 identified, **Minor**)

    Treatment runs are 105K steps while baselines run to 505K. Some "collapse" trajectories
    may recover given more training. The TCN experiments reveal late-onset degradation
    (seed 1 drops from 401 to 161 at 215K), suggesting 105K windows may systematically
    miss phenomena.


    ### W7: Thin reference list (R2 identified, **Minor**)

    ~25 citations for a paper claiming to identify a novel architectural vulnerability.
    Missing references include: semi-MDP value theory (Bradtke & Duff 1995), model
    regularization in MBRL (PETS, MOReL, COMBO), noise injection theory (Bishop 1995,
    NoisyNet), plasticity loss (Nikishin et al. 2022/2023), Nauman et al. 2024 on
    overestimation in actor-critic, MTS3 multi-time-scale world models.


    ---


    ## 6. Key Questions for Authors


    1. **Standard baselines**: Why were Double Q-learning, TD3-style clipping, and
    ensemble critics not tested or discussed as potential CIVO countermeasures? If
    DreamerV3''s architecture makes these non-trivial to apply, explain why.


    2. **NVE generalization**: The 1.5× threshold is validated in-sample across DMC
    tasks with similar reward scales. Would it generalize to environments with fundamentally
    different reward distributions (sparse rewards, Atari-scale scores)?


    3. **Pixel observations**: The obs-decoder is identified as the causally critical
    gradient channel at 16–22% of gradients. With pixel observations, this channel
    would carry vastly more information. Would CIVO become more or less severe?


    4. **TCN longevity**: TCN Walker seed 1 degrades significantly after its peak.
    Is TCN merely delaying CIVO? What happens at 500K steps?


    5. **Dual-pathway reconciliation**: 008e_v3 (dt=1 imagination, trained dt_emb)
    shows 50% collapse via Pathway B. 008a (trained dt_emb, subsample OFF) shows 0/3
    collapse. Both have trained embeddings but differ in subsampling. Is the vulnerability
    from the *embedding training on dt>1 data* (subsample ON), not the embedding itself?


    6. **RSSM fidelity temporal profile**: The 2.78× reward prediction gap (Table
    11) is measured at a single checkpoint. Does this gap precede, accompany, or follow
    CIVO onset?


    ---


    ## 7. Experiment Coverage Assessment


    Comparing the paper against the full experimental plan (review_context.yaml):


    | Experiment Category | Planned | Covered in Paper | Coverage |

    |---|---|---|---|

    | Walker Walk factorial (008d/008a/008f/015b/008e_v3) | 5 configs, multi-seed
    | Yes, all presented | ✓ Complete |

    | Cheetah Run (baseline, trained, no dt_emb, untrained) | 4 configs, 3 seeds each
    | Yes (Tables 8, 15) | ✓ Complete |

    | Cartpole Swingup (baseline, trained, no dt_emb) | 3 configs, 3 seeds | Yes (Tables
    1, 2, 10) | ✓ Complete |

    | Hopper Hop (3 configs) | 3 configs, 3 seeds | Yes (Tables 1, 2, 9) | ✓ Complete
    |

    | RSSM fidelity analysis | Planned | Table 11 | ✓ Single checkpoint |

    | Actor entropy analysis | Planned | Table 18 | ✓ Complete |

    | dt_embedding cosine similarity | Planned | Table 12 | ✓ Complete |

    | NVE threshold sensitivity | Planned | Table 7 | ✓ Complete |

    | Value distribution analysis | Planned | Section 4.3 (text) | ✓ Partial |

    | TCN Walker σ sweep (0.1/0.2/0.5) | 3 configs | Tables 21, 29, 30 | ✓ Complete
    (some projected) |

    | TCN Cheetah σ=0.5 | 1 config | Table 23, 31 | ✓ Projected |

    | TCN PickCube | 1 config | Appendix A.9 | ✓ Minimal (1 seed) |

    | Uncertainty-gated truncation | Planned | Section 4.6 (text) | ✓ Brief |

    | SGS variants | 3 variants, multi-env | Table 19 | ✓ Complete |


    **Overall coverage**: Good. Most planned experiments are present. Some TCN results
    are projected (running experiments with median predictions). The main gaps are
    the single-checkpoint RSSM fidelity analysis and the minimal PickCube coverage.


    ---


    ## 8. Roundtable Convergence


    ### Step 3: Areas of Full Agreement

    - Factorial design is the paper''s strongest asset

    - Gradient magnitude ≠ causal importance is genuinely novel

    - TCN mitigation is weak and cannot be a primary contribution

    - Standard overestimation baselines are missing and needed

    - Statistical power is insufficient for several claims

    - CoRL venue fit is questionable

    - Honest reporting is commendable


    ### Step 3: Areas of Remaining Disagreement

    - **Conceptual novelty**: R1 considers CIVO mechanism and MPC/imagination distinction
    as genuinely novel instantiations deserving credit; R2 considers them predictable
    consequences of known principles, limiting novelty

    - **Significance weighting**: R1 weights the diagnostic/cautionary value more
    heavily; R2 weights the absence of a viable solution more heavily

    - **Venue recommendation**: R1 considers CoRL marginal but not categorically wrong;
    R2 suggests ICML/NeurIPS as better fit


    ### Step 4: Score Convergence

    Both reviewers converge to **5/10** after cross-sharing. R1 maintained original
    5; R2 revised up from 4 to 5 after acknowledging the 4-environment coverage correction.


    ---


    ## 9. Final Consolidated Scores


    | Dimension | R1 | R2 | Consensus |

    |-----------|-----|-----|-----------|

    | Originality | 6/10 | 4/10 | 5/10 |

    | Quality | 6/10 | 6/10 | 6/10 |

    | Clarity | 7/10 | 7/10 | 7/10 |

    | Significance | 5/10 | 4/10 | 5/10 |

    | Relevance (CoRL) | 5/10 | 3/10 | 4/10 |

    | **Overall** | **5/10** | **5/10** | **5/10** |

    | Confidence | 4/5 | 4/5 | 4/5 |


    ---


    ## 10. Final Recommendation


    **Overall Score: 5/10 — Marginally Below Acceptance Threshold (Borderline Reject)**


    ### Rationale

    The paper presents a well-executed factorial diagnostic study with clean causal
    isolation and several genuinely informative findings (gradient magnitude ≠ causal
    importance, MPC vs. imagination boundary condition, dual-pathway vulnerability).
    The 4-environment coverage with multi-seed replication demonstrates empirical
    thoroughness, and the honest reporting of negative results (SGS 1/17, TCN 2/8)
    is commendable.


    However, the paper falls short of the CoRL acceptance bar for compounding reasons:


    1. **Limited conceptual novelty** — CIVO is a specific trigger identification
    within the well-known MBRL model exploitation failure class, not a fundamentally
    new phenomenon

    2. **Predominantly negative result without viable solution** — The intervention
    hierarchy produces uniformly negative or marginally positive results; TCN works
    reliably on 1/4 environments only

    3. **Missing standard baselines** — Not testing established overestimation countermeasures
    (Double Q, ensembles, MBPO truncation) leaves a critical experimental gap

    4. **Weak CoRL relevance** — All experiments are DMC simulation with proprioceptive
    observations; no real-robot, no visual observations, no contact-rich manipulation
    at scale

    5. **Insufficient statistical power** — Several key experiments use 1–2 seeds;
    NVE validated in-sample only


    ### Suggested Improvements for Resubmission

    1. Test or rigorously discuss standard value overestimation countermeasures (Double
    Q, ensemble critics, MBPO truncation) in the CIVO setting

    2. Add experiments with pixel/visual observations (the obs-decoder channel''s
    role would change fundamentally)

    3. Increase seed counts to ≥3 for all critical experiments (frozen embedding,
    RAVE, cross-environment conditions)

    4. Validate NVE on a held-out environment or architecture

    5. Expand the reference list and Related Work section substantially (~40+ references)

    6. Run treatment conditions to at least 200K steps to match baseline horizon asymmetry
    concerns

    7. For CoRL specifically: add at least one robotics-relevant task with visual
    observations, or reposition for ICML/NeurIPS as a methodological contribution


    ### Venue Fit Note

    Both reviewers note the paper may be a better fit for ICML or NeurIPS as a methodological
    diagnostic analysis. For CoRL, the addition of robot-relevant tasks with visual
    observations would substantially improve venue alignment.

    '

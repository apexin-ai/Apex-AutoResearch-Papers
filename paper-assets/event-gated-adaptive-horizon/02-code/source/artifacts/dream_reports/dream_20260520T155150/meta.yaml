  review_report: "---\ndream_id: dream_20260520T155150\ntier: worst\noverall_score:\
    \ 5/10 — Borderline Reject\ntimestamp: 2026-05-20T17:14:28.087383+00:00\n---\n\
    \n# Dream Review Report: \"Conditioning-Induced Value Overestimation in Variable-Rate\
    \ World-Model Imagination\"\n\n**Venue:** CoRL 2026 | **Review Mode:** Full |\
    \ **Reviewers:** R1 (Methods+Experiments), R2 (Novelty+Related Work)\n\n---\n\n\
    ## Venue Calibration\n\nCoRL uses a 1–10 scale on OpenReview. Based on CoRL 2023\
    \ statistics: accepted paper average ~6.5, oral average ~7.7, acceptance rate\
    \ ~40%. Evaluation dimensions: Originality, Quality, Clarity, Significance, Relevance.\
    \ CoRL emphasizes robot learning relevance — papers should address learning questions\
    \ for physical robots or demonstrate solutions on physical robots.\n\n---\n\n\
    ## Paper Summary\n\nThis paper presents a systematic diagnostic analysis of variable-rate\
    \ imagination in DreamerV3, identifying a failure mode called Conditioning-Induced\
    \ Value Overestimation (CIVO). Through a factorial experiment spanning 31 configurations\
    \ across four DeepMind Control Suite environments (Walker Walk, Cheetah Run, Cartpole\
    \ Swingup, Hopper Hop), the authors establish that a trained temporal embedding\
    \ (dt_emb) enables the critic to exploit imprecise multi-step predictions from\
    \ the RSSM, triggering a positive feedback loop of value overestimation and policy\
    \ degradation. The paper introduces Normalized Value Excess (NVE) as a diagnostic\
    \ metric (AUROC=0.969 at 1.5× threshold across 18 seeds), documents 12 intervention\
    \ strategies that all fail to robustly eliminate CIVO, and contrasts with TAWM\
    \ (MPC-based) to localize the vulnerability to the imagination-based actor-critic\
    \ architecture. Eight claims are evaluated (C1–C7 confirmed, C8 dropped to appendix\
    \ as negative result).\n\n---\n\n## R1: Methods & Experiments\n\n### Strengths\n\
    \n- **Well-structured factorial design.** The 2×2 isolation of trained embedding\
    \ × multi-rate exposure, with frozen-embedding and removed-embedding controls,\
    \ provides genuine causal evidence for the joint-necessity claim. This is stronger\
    \ than typical ablation studies in RL.\n- **Comprehensive intervention hierarchy.**\
    \ Testing three mechanistic levels (gradient stopping, output capping, representation\
    \ noise) across 12 strategies is unusually thorough for a diagnostic paper. The\
    \ negative results are scientifically valuable.\n- **NVE metric is well-motivated.**\
    \ The threshold sensitivity analysis (AUROC=0.969, Youden-optimal threshold coinciding\
    \ with the preset 1.5×) is rigorous. The normalization approach controlling for\
    \ baseline value-to-evaluation dynamics is sound.\n- **Gradient decomposition\
    \ finding.** The discovery that gradient magnitude does not equal causal importance\
    \ (reward head: 38–49% gradient share but causally irrelevant; obs decoder: 16–22%\
    \ but causally critical) has genuine broader methodological value.\n- **Honest\
    \ negative results documentation.** The failure mode taxonomy, consolidated intervention\
    \ table (Table 25), and candid reporting of TCN's cross-environment failure avoid\
    \ cherry-picking.\n- **Reproducibility.** Hyperparameters fully specified, codebase\
    \ extends official DreamerV3, total GPU cost (~80 hours on a single RTX PRO 6000)\
    \ is modest and reported.\n\n### Weaknesses\n\n- **Environment diversity is severely\
    \ limited.** Core claims rest primarily on Walker Walk and Cheetah Run (both DMC\
    \ locomotion with proprioceptive observations). Cartpole Swingup and Hopper Hop\
    \ data appear to be partially or fully predicted rather than from completed experiments.\
    \ PickCube appears as a single seed. For claims of a \"fundamental vulnerability,\"\
    \ environmental coverage is thin.\n- **Seed counts are small and uneven.** The\
    \ flagship C2 result uses 5 Walker seeds and 2–3 Cheetah seeds. The no-embedding\
    \ control (008f) uses 5 seeds but one is predicted. SGS experiments use 2–3 seeds\
    \ per variant. Intervention conditions often have n=1–2, making rate claims (e.g.,\
    \ \"0/2\", \"1/6\") statistically weak. With n=6, the 95% Clopper-Pearson CI for\
    \ 6/6 exceeding threshold has a lower bound of only 54%.\n- **NVE threshold has\
    \ circular calibration elements.** The 1.5× threshold is calibrated on the same\
    \ dataset used to evaluate it. No held-out validation set exists. The paper notes\
    \ that using different baseline seeds or 4-seed mean normalization changes AUROC\
    \ (from 0.969 to lower values), which is concerning for a proposed diagnostic\
    \ tool. Ground truth labeling requires manual mechanism identification (CIVO vs.\
    \ non-CIVO), introducing subjectivity.\n- **Causal claims exceed evidence scope.**\
    \ The paper claims trained embedding is \"the causal trigger\" but tests only\
    \ one embedding dimension (d=32), one architecture (RSSM), and one training procedure\
    \ (standard DreamerV3). The \"gradient ≠ causality\" claim (C7) is based on gradient\
    \ decomposition at two checkpoints from a single run. The dual-pathway claim (C6)\
    \ rests on 2/4 seeds, with each pathway observed in exactly one seed.\n- **Baseline\
    \ comparison asymmetry.** Baselines run to 505K steps; treatments run to 105K.\
    \ Non-collapsed configs (e.g., 008f at 503 eval, 008a at 778) may still be converging.\
    \ The 008f configuration loses ~45% performance vs baseline, yet is classified\
    \ as \"healthy\" because NVE < 1.5×.\n- **No formal statistical testing.** No\
    \ confidence intervals, standard errors, or statistical tests on main performance\
    \ claims. The AUROC CI is computed via bootstrap (appropriate), but the Clopper-Pearson\
    \ intervals on accuracy (e.g., 93.8% accuracy has CI [69.8%, 99.8%]) are very\
    \ wide for n=29.\n- **TAWM contrast is argumentative, not empirical.** The paper's\
    \ contribution of identifying feedback architecture as the structural factor is\
    \ argued conceptually but never tested. Running dt-conditioning in TD-MPC2 would\
    \ greatly strengthen this claim.\n\n### R1 Questions for Authors\n\n1. The 008f\
    \ (no dt_emb) achieves only 503 at 105K vs 915 baseline. If run to 505K, would\
    \ it converge to baseline? The \"healthy\" classification masks a ~45% performance\
    \ gap.\n2. The 008d RSSM has dramatically worse absolute obs_MSE (41.31 vs 13.49\
    \ baseline at dt=1). Could CIVO be partly attributable to general model quality\
    \ degradation rather than specifically dt-conditional reward bias?\n3. For the\
    \ random-policy decomposition (36% dynamics bias, 64% actor exploitation): how\
    \ sensitive are these fractions to training stage?\n4. The online CIVO detector\
    \ achieves FPR=2/9 (22%). What is the cost of false alarms in deployment?\n5.\
    \ TCN σ=0.2 on Walker: s0 reaches 91% baseline, s1 only 21%. What explains this\
    \ extreme seed sensitivity?\n\n### R1 Scores\n\n| Dimension | Score |\n|-----------|-------|\n\
    | Soundness | 6 |\n| Presentation | 7 |\n| Contribution | 6 |\n| **Overall** |\
    \ **5** |\n| Confidence | 4/5 |\n\n**R1 Justification:** A careful diagnostic\
    \ study with a well-designed factorial experiment. The CIVO mechanism is clearly\
    \ demonstrated for Walker Walk and partially replicated on Cheetah Run. However,\
    \ environmental coverage is too narrow for the generality of claims, seed counts\
    \ are too small for rate-based claims, the TAWM contrast is not empirical, and\
    \ no viable solution is provided. The paper identifies a problem but offers no\
    \ path forward.\n\n---\n\n## R2: Novelty & Related Work\n\n### Strengths\n\n-\
    \ **Novel failure mode with precise causal isolation.** CIVO is not merely observing\
    \ \"model-based RL has value overestimation\" — it identifies a specific, previously\
    \ undocumented causal pathway through temporal conditioning. The factorial design\
    \ isolates two jointly necessary conditions (trained embedding + multi-rate exposure)\
    \ convincingly.\n- **TAWM architectural contrast is the strongest novelty claim.**\
    \ Demonstrating that dt-conditioning succeeds in MPC but fails in imagination-based\
    \ AC is surprising and practically important. This goes beyond documenting a DreamerV3\
    \ bug — it identifies a structural incompatibility between temporal conditioning\
    \ and imagination-based bootstrapping.\n- **Comprehensive negative results catalog.**\
    \ The three-level intervention hierarchy (gradient/output/representation) across\
    \ 12 strategies with documented failure modes is a genuine service to the community.\
    \ The finding that gradient magnitude ≠ causal importance has broader methodological\
    \ applicability.\n- **NVE well-validated.** AUROC=0.969 with Youden-optimal threshold\
    \ coinciding with preset cutoff. Appropriate transparency about false positives\
    \ and their mechanistic origins.\n- **Dual vulnerability pathways.** Pathway A\
    \ (CIVO: entropy ↓) vs Pathway B (IRD: entropy ↑) as distinct collapse mechanisms\
    \ sharing a common root adds depth beyond a simple overestimation story.\n- **Honest\
    \ limitations reporting.** Acknowledges Walker Walk dominance, fewer cross-environment\
    \ seeds, open questions about transformer world models.\n\n### Weaknesses\n\n\
    - **Novelty increment over known model exploitation is narrower than claimed.**\
    \ CIVO is positioned as \"mechanistically distinct\" from delusional bias and\
    \ model exploitation (MBPO). But the high-level story — \"inaccurate model predictions\
    \ used for imagination-based policy optimization produce overestimated values\
    \ that the actor exploits\" — is MBPO's central thesis. The paper's own random-policy\
    \ decomposition (36% dynamics bias, 64% actor exploitation) maps directly onto\
    \ MBPO's framework. The incremental novelty is in the *trigger* (temporal embedding),\
    \ not the *mechanism*.\n- **Related work section is too compressed.** ~20 lines\
    \ citing ~15 works is sparse for a diagnostic paper whose contribution rests on\
    \ positioning against literature. Important threads are absent or insufficiently\
    \ discussed:\n  - Plasticity loss / capacity loss (Lyle et al., 2022; Nikishin\
    \ et al., 2022) — invoked in discussion but invisible in Section 2\n  - Multi-time-scale\
    \ dynamics models (Shaj et al., 2023 MTS3)\n  - Recent imagination rollout quality\
    \ work (Palenicek et al., 2025) — directly supports the paper's thesis\n  - DreamSmooth\
    \ / HarmonyDream — address reward prediction quality, directly relevant to the\
    \ 75× MAE finding\n- **Environment scope is narrow and weakly relevant to CoRL.**\
    \ All primary experiments use DMC locomotion tasks with dense rewards and proprioceptive\
    \ observations. CoRL's audience cares about contact-rich manipulation, real-world\
    \ transfer, sensor noise. The paper makes no argument for why CIVO matters for\
    \ robotic systems. Variable-rate planning is arguably *more* important in robotics,\
    \ but this connection is never made.\n- **\"Pure diagnostic\" framing creates\
    \ tension for a top venue.** Diagnostic papers have precedent (Engstrom et al.\
    \ on PPO; Andrychowicz et al.), but those either resolved the question definitively\
    \ or provided clear actionable recommendations. This paper's recommendation —\
    \ \"don't use flat temporal conditioning in imagination-based RL\" — is already\
    \ implicit in the literature. The field has converged on hierarchical approaches\
    \ (THICK, Hieros, Director) without needing this diagnostic.\n- **12 references\
    \ in related work text is insufficient.** The bibliography contains ~43 entries,\
    \ but the related work discussion engages with too few. A diagnostic paper needs\
    \ to demonstrate thorough awareness of related phenomena to justify that its finding\
    \ is truly new.\n\n### R2 Missing References\n\n- **Bacon et al. (2017), \"The\
    \ Option-Critic Architecture\"**: Foundational temporal abstraction in actor-critic\
    \ — the model-free analog of what the paper attempts in model-based RL.\n- **DEAS\
    \ (Kim et al., 2025)**: Shows action sequences cause value overestimation in actor-critic\
    \ — independent confirmation of the same pattern in offline RL.\n- **DreamSmooth\
    \ (Lee et al., 2024) / HarmonyDream (Ma et al., 2024)**: Address reward prediction\
    \ quality as an MBRL bottleneck — directly relevant to the 75× MAE finding.\n\
    - **Hamrick et al. (2021)**: Shows shallow rollouts suffice in MuZero — supports\
    \ the dt=1 imagination sufficiency result.\n- **Pan et al. (2020), \"Trust the\
    \ Model When It Is Confident\"**: Model-based value estimation with uncertainty.\n\
    - **Buckman et al. (2018), STEVE**: Ensemble disagreement for value overestimation\
    \ in MBRL.\n- **Chua et al. (2018), PETS**: Ensemble-based world models handling\
    \ prediction uncertainty.\n\n### R2 Questions for Authors\n\n1. Can you articulate\
    \ precisely what CIVO reveals that MBPO's framework does not predict? The high-level\
    \ mechanism (model error → value overestimation → actor exploitation) is well-established.\n\
    2. Why not test ensemble disagreement / pessimistic value estimation? This seems\
    \ like a more natural intervention than SGS or TCN.\n3. The frozen embedding (015b)\
    \ peaks at NVE=1.45× — just below your 1.5× threshold. Is the trained/frozen distinction\
    \ a hard boundary or a continuous spectrum?\n4. Generalization beyond RSSM: given\
    \ that the three structural properties (co-adapting temporal embedding, multi-step\
    \ imagination, shared reward representation) are architecture-agnostic, shouldn't\
    \ you predict whether CIVO occurs in DreamerV4?\n5. PickCube shows transient CIVO\
    \ that self-corrects, unlike persistent CIVO in locomotion. Does this suggest\
    \ CIVO severity is reward-density-dependent?\n\n### R2 Scores\n\n| Dimension |\
    \ Score |\n|-----------|-------|\n| Soundness | 7 |\n| Presentation | 7 |\n| Contribution\
    \ | 5 |\n| **Overall** | **5** |\n| Confidence | 4/5 |\n\n**R2 Justification:**\
    \ A technically competent diagnostic identifying a real failure mode. The TAWM\
    \ contrast is the strongest novelty claim but needs empirical validation. The\
    \ novelty increment over MBPO/model exploitation literature is narrower than presented.\
    \ CoRL relevance is weak (DMC-only, no robotics connection). The \"pure diagnostic\"\
    \ framing with no viable solution limits constructive contribution. Better positioned\
    \ at a workshop or as a shorter contribution at a general ML venue.\n\n---\n\n\
    ## Roundtable: Cross-Review Discussion\n\n### Step 2: Cross-Sharing\n\nR1 and\
    \ R2 independently arrived at **identical overall scores (5/10)** with highly\
    \ convergent analyses. Both reviewers acknowledge the experimental methodology\
    \ as sound and the CIVO finding as real, but raise overlapping concerns.\n\n###\
    \ Step 3: Convergence Analysis\n\n**Areas of strong agreement (both reviewers):**\n\
    1. **Environment diversity insufficient** for the generality of claims (DMC locomotion\
    \ dominance, weak robotics relevance for CoRL)\n2. **TAWM contrast is the paper's\
    \ strongest contribution** but is argued rather than empirically demonstrated\n\
    3. **No viable solution proposed** — all 12 interventions fail, limiting practical\
    \ impact\n4. **CoRL relevance is weak** — no connection made to robotic systems,\
    \ manipulation, or real-world deployment\n5. **Factorial design is methodologically\
    \ sound** — clean causal isolation through the trained/frozen/removed embedding\
    \ comparison\n6. **Negative results catalog is genuinely valuable** to the community\n\
    7. **Presentation is good** (both rate 7/10) — clear structure, informative tables,\
    \ dense but precise writing\n\n**Areas of disagreement:**\n- **Soundness:** R1=6,\
    \ R2=7. R1 is more critical of statistical power (small seed counts, wide CIs,\
    \ no formal tests). R2 finds the experimental methodology sufficiently rigorous\
    \ for the claims, given standard practice in world-model RL. *Resolution:* The\
    \ truth is between — the core finding (trained dt_emb triggers overestimation)\
    \ is solidly demonstrated for Walker/Cheetah, but rate-based claims at n=1–6 carry\
    \ limited statistical weight. **Agreed score: 6.**\n- **Contribution:** R1=6,\
    \ R2=5. R2 is more critical of novelty (argues CIVO is incremental over MBPO's\
    \ framework). R1 gives more credit for the gradient decomposition and intervention\
    \ hierarchy. *Resolution:* The CIVO trigger (temporal embedding) is new; the mechanism\
    \ (model exploitation → overestimation) is not. The gradient ≠ causality finding\
    \ is a genuine methodological insight. **Agreed score: 5.**\n\n### Step 4: Consolidated\
    \ Assessment\n\n**Consensus Overall Score: 5/10 (Borderline Reject)**\n\n| Dimension\
    \ | R1 | R2 | Consensus |\n|-----------|----|----|-----------|\n| Soundness |\
    \ 6 | 7 | 6 |\n| Presentation | 7 | 7 | 7 |\n| Contribution | 6 | 5 | 5 |\n| **Overall**\
    \ | **5** | **5** | **5** |\n\n---\n\n## Top-Level Strengths\n\n1. **Clean causal\
    \ isolation** via factorial design — the trained/frozen/removed embedding comparison\
    \ is a rigorous experimental manipulation that genuinely establishes joint necessity\
    \ of trained embedding + multi-rate exposure.\n2. **TAWM architectural contrast**\
    \ — the insight that dt-conditioning succeeds in MPC but fails in imagination-based\
    \ AC localizes the vulnerability to a structural property (critic bootstrapping\
    \ from imagined trajectories vs. re-planning from real states). This is the paper's\
    \ most impactful contribution.\n3. **Comprehensive negative results** — 12 intervention\
    \ strategies across 3 mechanistic levels, with documented failure modes for each.\
    \ The gradient magnitude ≠ causal importance finding has broader methodological\
    \ value.\n4. **NVE diagnostic metric** — well-motivated, with AUROC=0.969 and\
    \ Youden-optimal threshold alignment. Practical for monitoring training runs.\n\
    \n## Top-Level Weaknesses\n\n1. **Narrow environment scope, weak CoRL relevance.**\
    \ Primary evidence from Walker Walk and Cheetah Run (both DMC locomotion). Cartpole\
    \ and Hopper data appear partially predicted. PickCube: 1 seed. No connection\
    \ to robotics, manipulation, or real-world deployment. For CoRL, which emphasizes\
    \ robot learning, this is a significant gap.\n2. **Novelty is incremental over\
    \ the model exploitation literature.** The CIVO causal chain (inaccurate model\
    \ → value overestimation → actor exploitation → collapse) maps directly onto MBPO's\
    \ framework. The specific trigger (temporal embedding) is new but narrow. The\
    \ TAWM contrast — the strongest novelty claim — is argued conceptually but not\
    \ demonstrated empirically.\n3. **No viable solution.** All 12 interventions fail.\
    \ The recommendation is \"avoid flat temporal conditioning, use hierarchical models.\"\
    \ But the field has already converged on this without needing this diagnostic.\
    \ The paper identifies a dead end without pointing toward exits.\n4. **Statistical\
    \ power is limited.** Seed counts of 1–6 per condition yield wide confidence intervals\
    \ on rate-based claims. No formal statistical tests. The NVE threshold is calibrated\
    \ and evaluated on the same dataset.\n\n## Key Questions for Authors (Consolidated)\n\
    \n1. **MBPO analogy:** Can you articulate precisely what CIVO reveals that MBPO's\
    \ model exploitation framework does not predict? The mechanism seems to be a specific\
    \ instance of the known phenomenon.\n2. **Empirical TAWM comparison:** Have you\
    \ attempted to replicate dt-conditioning in TD-MPC2 and verify that CIVO does\
    \ not occur? This would transform the paper's strongest claim from argumentative\
    \ to empirical.\n3. **Ensemble critics:** Why not test pessimistic value estimation\
    \ (multiple critics, min-Q)? This is the standard intervention for value overestimation\
    \ and seems more natural than SGS or TCN.\n4. **008f performance gap:** The no-dt_emb\
    \ config achieves only ~50% of baseline performance. If run to 505K steps, would\
    \ it converge? The \"healthy\" label obscures a large performance deficit.\n5.\
    \ **Frozen embedding boundary:** Frozen dt_emb peaks at NVE=1.45× — just below\
    \ the 1.5× threshold. Is this a hard categorical boundary or a continuous spectrum\
    \ where the threshold happens to separate them?\n6. **DreamerV4 prediction:**\
    \ The three structural properties enabling CIVO (co-adapting embedding, multi-step\
    \ imagination, shared reward representation) may hold in transformer-based world\
    \ models. Can you make a testable prediction?\n\n## Missing References (Consolidated)\n\
    \n- Bacon et al. (2017) — Option-Critic, foundational temporal abstraction in\
    \ AC\n- MBPO (Janner et al., 2019) — needs deeper engagement in related work,\
    \ not just a citation\n- DEAS (Kim et al., 2025) — action sequences cause value\
    \ overestimation in AC\n- DreamSmooth (Lee et al., 2024) / HarmonyDream (Ma et\
    \ al., 2024) — reward prediction quality\n- Buckman et al. (2018) STEVE / Chua\
    \ et al. (2018) PETS — ensemble-based overestimation mitigation\n- Hamrick et\
    \ al. (2021) — shallow rollouts suffice in MuZero\n- Pan et al. (2020) — model-based\
    \ value estimation with uncertainty\n- Palenicek et al. (2025) — imagination rollout\
    \ quality, directly supports the paper's thesis\n\n## Actionable Recommendations\
    \ for Improvement\n\n1. **Empirically validate the TAWM contrast.** Run dt-conditioning\
    \ in TD-MPC2 on Walker Walk and demonstrate CIVO does not occur. This single experiment\
    \ would elevate the paper's strongest claim.\n2. **Broaden environment coverage.**\
    \ Add 2–3 diverse environments (manipulation, sparse reward, higher-dimensional\
    \ observations) with ≥5 seeds each. For CoRL, include at least one robotics-relevant\
    \ benchmark.\n3. **Test ensemble disagreement / pessimistic value estimation.**\
    \ This is the standard overestimation mitigation and its omission is conspicuous.\n\
    4. **Expand related work.** Engage deeply with MBPO's framework to clarify the\
    \ novelty increment. Discuss plasticity loss, multi-time-scale dynamics, and recent\
    \ imagination quality literature.\n5. **Increase seed counts** to ≥5 per condition\
    \ for core claims, add confidence intervals and statistical tests.\n6. **Run one\
    \ hierarchical baseline** (e.g., THICK or Hieros) to demonstrate that the proposed\
    \ architectural solution actually avoids CIVO.\n\n## Verdict\n\n**5/10 — Borderline\
    \ Reject.** A methodologically sound diagnostic paper that identifies a real failure\
    \ mode (CIVO) with clean causal isolation. The TAWM architectural contrast is\
    \ a genuinely interesting insight. However, the narrow environment scope (DMC\
    \ locomotion), weak CoRL relevance (no robotics connection), incremental novelty\
    \ over the model exploitation literature, absence of an empirical TAWM comparison,\
    \ and lack of any viable solution place the paper below the CoRL acceptance threshold\
    \ (~6.5 average). The paper might be better suited as a workshop contribution\
    \ at CoRL or a shorter paper at ICML/NeurIPS, where the robotics-relevance requirement\
    \ is relaxed.\n"

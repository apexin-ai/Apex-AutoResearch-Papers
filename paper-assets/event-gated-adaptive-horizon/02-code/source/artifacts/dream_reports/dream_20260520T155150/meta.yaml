tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Forward-pass intervention thesis cross-seed + cross-env validated —
        诊断论文升级为 diagnosis + principled mitigation
      key_assumptions:
      - TCN σ=0.2 mechanism（precision degradation）跨 seed 稳健：Walker s1（exp_029a）在 115K+
        复现 s0 的 eval 回升模式，NVE 全程 < 1.0×
      - Cheetah σ=0.5 匹配 Cheetah 的更高 CIVO severity（8-108×）：噪声量级恰好在 Cheetah 的'治疗窗口'
      - Dose-response 关系 environment-predictable：σ 与 untreated CIVO severity 正相关（Walker
        轻→低 σ, Cheetah 重→高 σ）
      - NVE suppression 因果驱动性能保护，非 coincidence
      number_ranges:
        tcn_walker_sigma02_eval_peak_per_seed:
        - 700
        - 900
        tcn_walker_sigma02_nve_max_35kplus:
        - 0.5
        - 1.0
        tcn_walker_sigma02_prevention_rate: 2/2 seeds NVE < 1.5× sustained
        tcn_cheetah_sigma05_eval_peak:
        - 250
        - 450
        tcn_cheetah_sigma05_nve_max:
        - 1.5
        - 4.0
        tcn_cheetah_civo_reduction_vs_untreated: 2-5× reduction (from 8-108× to 1.5-4×)
        cross_env_prevention_rate: ≥ 3/4 seeds
        paper_claims_fully_supported: 8
      narrative_direction: '原始 framing 完全成立且升级。主线：backward-pass 干预全面失败（C7, 17 seeds,
        3 SGS 变体, 2 environments） → forward-pass noise injection 成功（C8, TCN）→ 确证 CIVO
        是 forward-pass representational damage 而非 gradient contamination。TCN 的 dose-response（σ=0.5
        在 Walker 过量失败 / σ=0.2 成功; σ=0.5 在 Cheetah 适量成功）提供额外机制洞察，从"诊断问题"跨入"理解干预层级"。
        CoRL 审稿人获得：(1) 31 configs 诊断 + (2) forward-pass vs backward-pass 干预层级对比 +
        (3) cross-env 可泛化的 principled mitigation。标题可更新为 "Diagnosing and Mitigating
        Value Overestimation from Temporal Abstraction in DreamerV3"。 Claims 无需调整强度，C1-C8
        全文保留。

        '
    median:
      tier: median
      meaning: Walker-only proof-of-concept — TCN 在 Walker 有效（1-2 seeds）但 Cheetah
        失败，forward-pass 原则方向正确但不可泛化
      key_assumptions:
      - TCN σ=0.2 Walker s1 NVE 保持健康（< 1.5×）但 eval 显著低于 s0（< 500 peak vs s0 的 821）——noise
        防住 CIVO 但未能维持 baseline-competitive performance
      - Cheetah σ=0.5 不足以覆盖 Cheetah 的 CIVO severity gap——或过量破坏有用信号、或不足无法抑制
      - 最优 σ 是 environment-specific 且 narrow band，无 universal σ 存在
      - Forward-pass principle 方向正确但实现需要 adaptive calibration（超出本文 scope）
      number_ranges:
        tcn_walker_sigma02_eval_peak_per_seed:
        - 400
        - 750
        tcn_walker_sigma02_nve_max_35kplus:
        - 0.5
        - 1.5
        tcn_walker_sigma02_prevention_rate: 1/2 to 2/2 seeds
        tcn_cheetah_sigma05_eval_peak:
        - 50
        - 250
        tcn_cheetah_sigma05_nve_max:
        - 3.0
        - 20.0
        tcn_cheetah_civo_reduction_vs_untreated: < 2× or inconsistent
        cross_env_prevention_rate: 1/4 to 2/4 seeds
        paper_claims_fully_supported: 7
        c8_status: partial — scoped to Walker proof-of-concept
      narrative_direction: 'C1-C7 诊断主线不动，C8 降级为 "preliminary evidence supporting forward-pass
        principle"。 Claims 调整：(1) C8 标题从 "forward-pass intervention" 改为 "exploratory
        forward-pass intervention"， (2) 所有 TCN 结论加 "Walker Walk only" scope 限定，(3)
        Cheetah 失败作为 "calibration challenge" 呈现而非 negative result。叙事重心移回诊断：SGS 全面失败（C7）+
        TCN Walker 成功 + TCN Cheetah 失败 共同构成 "干预难度梯度"——backward-pass < forward-pass
        uniform noise < (future) adaptive forward-pass。 Section 6 Future Work 强调 adaptive
        noise scheduling 和 severity-aware σ calibration。 论文仍比纯诊断强（有正面结果支撑 forward-pass
        hypothesis），但 CoRL reviewer 可能要求 补充 environment 或 challenge robustness。准备
        rebuttal 回应 "only one environment mitigation"。

        '
    worst:
      tier: worst
      meaning: TCN s0 是随机 outlier — 所有干预方案失败或不可靠，锁定纯诊断论文（C1-C7）
      key_assumptions:
      - TCN σ=0.2 Walker s1 eval 不恢复（< 300@215K）或 NVE late-onset 突破 1.5×，复现 008e_v3_s2
        的延迟崩溃模式
      - TCN s0 成功 = 初始化 stochasticity，与 008e_v3 的 seed-dependent collapse（s1 success
        / s2 collapse）模式一致——TCN 改变 bifurcation probability 但不消除 vulnerability
      - Cheetah σ=0.5 失败（NVE > 5×），σ=0.1 实验也不显著改善
      - Forward-pass noise 与 CIVO 的交互本质随机——representational damage 不可通过固定噪声方案可靠消除
      number_ranges:
        tcn_walker_sigma02_eval_peak_per_seed:
        - 150
        - 400
        tcn_walker_sigma02_nve_max_35kplus:
        - 1.0
        - 4.0
        tcn_walker_sigma02_prevention_rate: 1/2 (only s0 confirmed)
        tcn_cheetah_sigma05_eval_peak:
        - 0
        - 150
        tcn_cheetah_sigma05_nve_max:
        - 5.0
        - 50.0
        tcn_cheetah_civo_reduction_vs_untreated: none significant
        cross_env_prevention_rate: ≤ 1/4 seeds
        paper_claims_fully_supported: 7
        c8_status: dropped — appendix negative result or single paragraph
      narrative_direction: C8 整节删除或降为 appendix negative result（"TCN showed one positive
        seed but did not replicate"）。论文 reframe 为纯诊断，但叙事角度翻转为优势："所有干预方案的失败证明 CIVO
        不是 easy fix，这恰好强化了诊断的价值——如果问题简单，诊断论文就不 interesting"。 核心 story arc 调整：(1) C1-C5
        诊断 CIVO 因果链，(2) C6 揭示 trained dt_embedding 通过 多条路径（CIVO + non-CIVO policy
        instability）创造脆弱性，(3) C7 证明 backward-pass 干预无效 + gradient magnitude ≠ causal
        importance（独立方法论贡献），(4) forward-pass 尝试失败 reinforces architectural conclusion。TAWM
        对比成为 novelty 核心："dt-conditioning 在 MPC（TAWM, ICML 2025）中成功但在 imagination-based
        actor-critic 中系统性失败——这是 architecture-specific vulnerability，不是 temporal abstraction
        本身的问题"。 Actionable takeaway 从 "use TCN" 改为 "不要在 imagination-based AC 中使用 flat
        dt-conditioning， 用 hierarchical models (THICK/Hieros) 或 MPC-based methods
        (TAWM)"。 标题锁定诊断版本："Why Temporal Abstraction Fails in DreamerV3" 或 "Conditioning-Induced
        Value Overestimation in Variable-Rate World-Model Imagination"。 纯诊断仍足够 CoRL：31
        configurations, 2 environments, 完整因果链 + TAWM architecture contrast。

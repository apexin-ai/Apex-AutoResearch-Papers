      meaning: Intervention Hierarchy 被认可为系统性贡献；MPC/imagination 架构边界 + 梯度-因果解耦被视为
        genuinely novel；countermeasures 讨论成功 preempt R9；NVE 诊断带 caveat 被接受
      key_assumptions:
      - TAWM 对比（dt-conditioning 在 MPC 成功但在 imagination 失败）被接受为新颖架构级发现，非已知 MBRL overestimation
        的重复
      - 梯度大小 ≠ 因果重要性（reward 38-49% 梯度但 reward-only SGS 失败最惨；obs-decoder 16-22% 但因果关键）被视为超越本文的可迁移方法论洞察
      - 17 seeds × 7 methods × 3 levels 的 intervention hierarchy 被视为该类问题首次系统性评估
      - Countermeasures 讨论（Double Q 需重构 255-bin categorical critic pipeline；MBPO truncation
        无法解决 single-step reward bias；ensemble critics 为最有前景 future work）说服审稿人不再要求实现
      - Walker + Cheetah + PickCube 三环境对 mechanism-level diagnostic 足够；proprioceptive
        设定为 controlled baseline，pixel 扩展合理定位为 future work
      - NVE AUROC=0.969（4 env × 29 data points）配合 Youden-optimal 独立收敛至 1.53× 的说明，化解
        in-sample 校验质疑

    ## 1. Paper Summary


    This paper presents a systematic diagnostic analysis of variable-rate imagination
    in DreamerV3, identifying Conditioning-Induced Value Overestimation (CIVO) as
    a fundamental failure mode. Through controlled factorial experiments across up
    to four DMC environments (primarily Walker Walk and Cheetah Run), it establishes
    a three-link causal chain: (1) a trained temporal embedding learns dt-specific
    representations on RSSM states whose fidelity degrades at dt>1; (2) the critic
    bootstraps from these imprecise-but-confidently-conditioned imagined states, producing
    pathological value overestimation; (3) the actor exploits overestimated value
    regions, triggering irreversible positive-feedback collapse. A 2×2 ablation matrix
    confirms joint necessity of embedding training AND multi-rate data exposure. A
    systematic Intervention Hierarchy (8 methods, 3 levels, 42 seeds, 3 environments)
    demonstrates no post-hoc intervention reliably eliminates CIVO. The paper proposes
    no solution, positioning itself honestly as a diagnostic contribution.


    ---


    ## 2. Consolidated Strengths


    ### S1. Well-Designed Factorial Ablation (R1+R2 consensus)

    The 2×2 causal matrix (trained/frozen/removed × exposed/unexposed) is a clean
    experimental design that credibly isolates the joint necessity of both conditions
    for CIVO. The addition of a frozen-embedding control (015b) to distinguish trainability
    from signal availability, and a Gumbel-gate control, is methodologically careful.
    Each cell has appropriate controls. Both reviewers independently highlighted this
    as a primary strength.


    ### S2. MPC vs. Imagination Architectural Boundary (R1+R2 consensus)

    The observation that dt-conditioning succeeds in TD-MPC2/TAWM but fails in imagination-based
    actor-critic is genuinely novel and not stated in prior work. The mechanistic
    explanation — MPC re-plans from real states at every step, breaking the error-compounding
    loop that imagination sustains — is clean, actionable, and important for the community.
    The positioning against TAWM is fair and well-executed.


    ### S3. Gradient-Causality Dissociation (R1+R2 consensus)

    The finding that gradient magnitude is decoupled from causal importance (reward
    head: 38–49% of gradients but causally irrelevant; observation decoder: 16–22%
    but causally critical) is a transferable methodological insight with implications
    beyond CIVO diagnosis. This should inform debugging practices for any multi-head
    world model architecture.


    ### S4. Systematic Intervention Hierarchy (R1+R2 consensus)

    Testing 8 methods across 3 intervention levels with 42 seeds across 3 environments
    is substantial effort. The structured negative evidence saves future researchers
    from re-exploring dead ends. The "impossible dose" dilemma (effective dose for
    CIVO prevention exceeds tolerable dose for learning) is a particularly sharp characterization.
    The observation that gradient-level interventions fail because forward-pass damage
    is irreducible, output-level interventions fail because EMA anchors get polluted,
    and representation-level interventions have no reliable Goldilocks zone is well-argued.


    ### S5. Honest and Transparent Reporting (R1+R2 consensus)

    Per-seed trajectories rather than only aggregates, acknowledgment of stochastic
    outcomes (collapse vs. self-correction), transparent documentation of false positives
    in NVE, partially-falsified C6 claim (dt=1 imagination doesn''t prevent collapse),
    and predicted data clearly marked. The Pathway A vs. Pathway B collapse taxonomy
    enriches rather than hides complexity.


    ### S6. Mechanistic Depth (R1)

    The causal chain is supported at multiple levels: RSSM fidelity table (Table 1),
    gradient decomposition, actor entropy signatures (Table 13), V(s) vs. Monte Carlo
    return statistics (Table 14), and temporal embedding cosine similarity evolution
    (Table 15). The multi-dimensional evidence creates a convincing mechanistic narrative.


    ---


    ## 3. Consolidated Weaknesses


    ### W1. Limited Environment Diversity and Proprioceptive-Only Setting (Major —
    R1 Major, R2 Minor → elevated to Major by panel)

    The core analysis rests on Walker Walk (primary) and Cheetah Run (secondary),
    both proprioceptive locomotion tasks from DMC. PickCube appears as a single-seed
    point. Cartpole Swingup and Hopper Hop results are entirely predicted (not experimentally
    obtained). All environments use proprioceptive observations. The paper''s claim
    that CIVO is a "fundamental failure mode" of imagination-based AC with temporal
    conditioning would be substantially stronger with:

    - At least one non-locomotion environment with real (not predicted) multi-seed
    data

    - At least one pixel-observation experiment (especially given the identified causal
    role of the observation decoder)


    **Panel note**: R2 rated this Minor because the mechanistic argument is well-supported
    even on 2 environments; R1 rated it Major because generalization is unverified.
    The panel converged to Major because the abstract and introduction frame CIVO
    as broadly applicable, which the evidence does not fully support.


    ### W2. Low Seed Counts for Key Conditions (Major — R1 Major, R2 Minor)

    Several critical experimental conditions have 1–2 seeds:

    - Frozen embedding (015b): 1 seed

    - RAVE interventions: 1 seed each (0/1, 0/1)

    - Reward-only SGS: 2 seeds

    - TCN σ=1.0: 1 seed

    - PickCube CIVO trigger: 1 seed


    Given the paper''s own demonstration that outcomes are highly stochastic across
    seeds (008e_v3 showing 50% collapse), claims like "impossible dose dilemma" resting
    on a single Cheetah seed at σ=1.0 carry essentially no statistical power. The
    intervention hierarchy table reports success rates like "0/1" or "1/1†" — these
    are anecdotal, not statistical evidence. The aggregate n=42 is reasonable, but
    the per-condition n is often insufficient.


    ### W3. NVE Metric In-Sample Validation (Moderate — R1+R2 consensus)

    The NVE threshold (1.5×) is calibrated and validated on the same 29 data points
    (AUROC=0.969). The paper acknowledges this. The Youden-optimal threshold independently
    converging to 1.53× is presented as mitigating overfitting concerns, but with
    n=29 this could be coincidental. The confidence intervals are wide (AUROC 95%
    CI: 0.904–1.000). The two false classifications are explained post-hoc via mechanism
    identification on training data — exactly the type of reasoning that in-sample
    validation permits.


    Additionally, R1 notes that the NVE metric is sensitive to baseline normalization
    choice. The paper primarily reports single-seed normalization in the main text;
    appendix results show AUROC drops to 0.867 under 4-seed mean normalization for
    Walker alone. This sensitivity should be foregrounded.


    **Recommendation**: At minimum, leave-one-environment-out cross-validation would
    strengthen the diagnostic claim. Held-out validation on a new architecture or
    environment is the gold standard and should be pursued.


    ### W4. CIVO Novelty Over MBPO-Style Model Exploitation Needs Sharper Articulation
    (Moderate — R2)

    At a higher level of abstraction, CIVO is a specific instance of model error being
    exploited by the policy through imagination — the core concern of MBPO (Janner
    et al., 2019). The paper argues CIVO is "mechanistically distinct" because it
    arises from learned temporal conditioning, but the downstream mechanism (biased
    model predictions → biased value estimates → policy exploitation) follows the
    standard MBRL exploitation chain. What''s genuinely new is that a *conditioning
    input can amplify rather than merely propagate* model error, and that the *specific
    location* of vulnerability (critic bootstrapping vs. MPC re-planning) determines
    whether the mechanism activates. This distinction should be stated more precisely.


    ### W5. Potential Capacity Confound (Moderate — R1)

    The trained dt-embedding adds d=32 parameters to the RSSM input. The paper does
    not control for the possibility that additional capacity (not temporal conditioning
    per se) interacts with multi-rate data to cause instability. A capacity-matched
    control — a trained embedding of the same dimension receiving no temporal information
    but exposed to multi-rate data — would disentangle these effects. The frozen embedding
    (015b) partially addresses this but introduces gradient starvation as a confound.


    ### W6. Compressed Related Work Section (Minor — R2)

    For a diagnostic paper whose novelty depends on precise positioning, the related
    work is too brief (4 short paragraphs). Missing or underexplored connections include:

    - Model-Ensemble Trust-Region Policy Optimization (Kurutach et al., 2018) — ensemble-based
    model exploitation control

    - Masked Model-based Actor-Critic (Pan et al., 2020) — masking updates when model
    is uncertain

    - Multi-task learning gradient conflict literature (PCGrad, CAGrad, Nash-MTL)
    — directly informs the SGS failure analysis

    - Selective Dyna-style planning under limited capacity (Abbas et al., 2020)


    The gradient-causality dissociation finding should be connected to the MTL gradient
    interference literature, which would strengthen its positioning as a broadly applicable
    insight.


    ### W7. Predicted Data Points Weaken Cross-Environment Claims (Minor — R1)

    Cartpole Swingup and Hopper Hop results are entirely predicted; some Cheetah seeds
    are predicted. While transparently marked, these predicted results contribute
    to the n=29 for AUROC calculation and to the cross-environment generalization
    narrative. The paper should more explicitly state the fraction of real vs. predicted
    data points and ideally present AUROC restricted to fully empirical results.


    ### W8. Short Training Budget (Minor — R1)

    Treatment runs are limited to 105K steps while baseline runs to 505K. Some configurations
    had not reached equilibrium at 105K. The paper may be conflating early-training
    instability with a fundamental failure mode. Extending key conditions (008d, TCN
    σ=0.2) to 500K would strengthen the "irreversible" claim.


    ---


    ## 4. Key Questions for Authors


    **Q1 (NVE robustness)**: What is the full n=29 AUROC under 4-seed mean baseline
    normalization (not just Walker subset)? How sensitive is the threshold to normalization
    choice?


    **Q2 (Horizon confound)**: The unexposed condition (008a) uses H=15 while CIVO
    trigger (008d) uses H=8. Can you provide the matched H=8 comparison to rule out
    horizon as a confound?


    **Q3 (Capacity control)**: Have you considered a control where a trained embedding
    of dimension d receives constant (non-temporal) input but is exposed to multi-rate
    data?


    **Q4 (Gradient stability)**: The gradient decomposition is measured at 2 timepoints.
    How stable is this decomposition across training? Could causal importance shift
    dynamically?


    **Q5 (Multiple pathways)**: If the trained dt-embedding creates vulnerability
    through mechanisms *other* than CIVO (Pathway B), how confident are you that the
    2×2 design isolates CIVO specifically rather than capturing a broader "trained
    dt-embedding is harmful" phenomenon?


    **Q6 (Conditioning location)**: TAWM conditions dt at the dynamics model input.
    Have you considered whether the location of conditioning (input vs. FiLM-style
    modulation vs. output) affects CIVO severity?


    **Q7 (Pixel observations)**: Given the observation decoder''s identified causal
    role (16–22% gradients, causally critical), would you expect CIVO to be more or
    less severe with pixel observations?


    **Q8 (Standard countermeasures)**: The argument that Double Q-learning and ensemble
    critics would fail is theoretical. Is there any empirical evidence, even preliminary,
    to support this?


    ---


    ## 5. Missing Experiments or Analyses


    | Priority | Experiment | Rationale |

    |----------|-----------|-----------|

    | High | Standard overestimation countermeasure (ensemble critic or clipped double
    Q) | Empirically validate the theoretical argument that standard methods fail
    |

    | High | Capacity-matched control embedding | Disentangle capacity from conditioning
    effects |

    | High | Cross-environment RSSM fidelity table (Cheetah) | Quantify whether fidelity
    gap scales with CIVO severity (NVE 8–70× in Cheetah vs 2–4× in Walker) |

    | Medium | Extended training runs (500K) for key conditions | Confirm irreversibility
    vs. transient instability |

    | Medium | Leave-one-environment-out NVE validation | Strengthen diagnostic claim
    beyond in-sample |

    | Medium | At least one pixel-observation experiment | Test whether obs-decoder''s
    causal role changes conclusions |

    | Low | Formal statistical tests (bootstrap CIs, permutation tests) | Quantify
    uncertainty on small-n conditions |

    | Low | Gradient decomposition stability over training | Verify gradient-causality
    dissociation is persistent |


    ---


    ## 6. Experiment Coverage Assessment


    Cross-referencing the paper against the full experiment design (review_context.yaml):


    | Experiment Group | Status in Paper | Seeds (real/predicted) |

    |------------------|----------------|----------------------|

    | Walker Walk 008d (CIVO trigger) | Complete | 3 real |

    | Walker Walk 008f (causal control) | Complete | 4 real |

    | Walker Walk 008a (unexposed) | Complete | 3 real |

    | Walker Walk 015b (frozen) | Complete | 1 real |

    | Walker Walk 008e_v3 (dt=1 imag) | Complete | 4 real |

    | Cheetah baseline | Complete | 5 real |

    | Cheetah CIVO trigger | Partial | 2 real + 1 predicted |

    | Cheetah causal control | Partial | 2 real + 1 predicted |

    | Cheetah unexposed | Partial | 2 real + 1 predicted |

    | Cartpole Swingup (all configs) | Predicted only | 0 real / 9 predicted |

    | Hopper Hop (all configs) | Predicted only | 0 real / 9 predicted |

    | RSSM fidelity analysis | Complete | Walker only |

    | Actor entropy analysis | Complete | Real |

    | V(s) vs MC return | Complete | Real (some predicted) |

    | Embedding cosine similarity | Complete | Real (some predicted) |

    | NVE threshold / AUROC | Complete | 29 datapoints (mix) |

    | Intervention Hierarchy | Mostly complete | 42 seeds (mostly real) |


    **Coverage assessment**: Walker Walk experiments are thorough. Cheetah has partial
    real data. Cartpole and Hopper are entirely predicted — the paper is transparent
    about this but still includes them in the narrative. PickCube appears in cross-env
    table with 1 seed. The intervention hierarchy has good coverage but with many
    single-seed conditions.


    ---


    ## 7. Roundtable Convergence Notes


    ### Areas of Full Agreement

    - The 2×2 factorial design and MPC-vs-imagination insight are the paper''s strongest
    contributions

    - The gradient-causality dissociation is genuinely novel and transferable

    - The intervention hierarchy is a valuable systematic negative result

    - Honest reporting throughout

    - Limited environments and low per-condition seed counts are real weaknesses

    - NVE in-sample validation is insufficient for a diagnostic tool claim


    ### Areas of Divergence (Resolved)

    - **Environment diversity severity**: R1 rated Major, R2 Minor. Panel resolved
    to **Major** because the paper''s framing ("fundamental failure mode") overreaches
    relative to the evidence base (primarily 2 proprioceptive locomotion tasks).

    - **Novelty assessment**: R2 flagged that CIVO''s novelty over MBPO needs sharper
    articulation; R1 did not raise this. Panel agrees this is a Moderate weakness
    — the mechanism is a genuine specialization of the general MBRL exploitation chain,
    but the paper should state more precisely *what is new* vs. *what is known*.


    ---


    ## 8. Overall Assessment


    ### Score: 4 (Weak Accept)


    **Justification**: The paper makes a genuine contribution through careful diagnostic
    methodology: the factorial ablation cleanly isolates CIVO''s causal factors, the
    MPC-vs-imagination boundary is novel and important, and the gradient-causality
    dissociation is broadly useful. The intervention hierarchy, while containing many
    low-n conditions, represents substantial experimental effort and provides actionable
    negative results. However, two Major weaknesses prevent a stronger recommendation:
    (1) limited environment diversity with most cross-environment evidence being predicted
    rather than empirical, making the "fundamental failure mode" framing overreaching;
    and (2) critically low seed counts (1–2) for several conditions in a domain the
    paper itself demonstrates is highly stochastic. The in-sample NVE validation and
    the need for sharper novelty positioning vs. MBPO are additional moderate concerns.


    **What would move the score up**:

    - Real (not predicted) multi-seed results for at least one more environment (Cartpole
    or Hopper)

    - A capacity-matched control experiment

    - Leave-one-environment-out NVE cross-validation

    - Increasing seed counts for key intervention hierarchy conditions (RAVE, TCN
    σ=1.0, frozen embedding) to ≥3


    **What would move the score down**:

    - Discovery that CIVO does not replicate outside proprioceptive DMC locomotion

    - Evidence that the NVE threshold fails under alternative baseline normalization

    - Finding that 105K training is insufficient and longer runs show recovery


    ### Recommendation: **Borderline — lean accept** conditional on authors addressing
    the predicted-data framing and acknowledging the per-condition statistical limitations
    more explicitly. The core mechanistic contribution and systematic methodology
    are above the acceptance threshold for a diagnostic paper, but the generalization
    evidence needs strengthening.


    dt=2 预测已经出现偏差。结果是 performance 仅 250@105K (27% baseline)，比 008d collapse (83@55K)
    好但比 008a (778) 和 008e_v3 (870) 差很多。truncation 阈值难以 tune — 太紧学不了，太松不防崩。这使得 uncertainty-gated
    方法在当前 RSSM 架构下不 feasible，削弱了 "future work" 方向的可信度。

    '

  作为temporal abstraction的瓶颈——一个受控案例研究"。主贡献从diagnostic finding变为 diagnostic methodology（factorial
  ablation框架 + nve监控协议）。将non-replication 本身作为finding——"temporal abstraction的失败模式是architecture×environment交互的产物，
  不存在universal failure mode"。C6降级为environment-conditional guideline。 标题候选："When Does
  Temporal Abstraction Break World Models? An Empirical Investigation of DreamerV3"。CoRL审稿预期：borderline。

  '

  review_report: "---\ndream_id: dream_20260515T004704\ntier: best\noverall_score:\
    \ borderline weak accept\ntimestamp: 2026-05-15T01:54:24.847327+00:00\n---\n\n\
    # Dream Review Report: \"Why Temporal Abstraction Fails in DreamerV3\"\n\n**Dream\
    \ ID:** 20260515T004704 | **Review Mode:** full | **Date:** 2026-05-15\n\n---\n\
    \n## Roundtable Summary\n\nTwo reviewers conducted independent assessments, followed\
    \ by cross-sharing and convergence discussion.\n\n| Reviewer | Focus | Score |\
    \ Confidence |\n|----------|-------|-------|------------|\n| R1 | Methods + Experiments\
    \ | 3 (Weak Reject) | 3/5 |\n| R2 | Novelty + Related Work | 4 (Weak Accept) |\
    \ 4/5 |\n| **Consensus** | | **4- (Borderline Weak Accept)** | **3.5/5** |\n\n\
    ---\n\n## Agreed Strengths\n\n1. **Clean factorial design.** The 008d (trained\
    \ dt_emb) vs 008f (no dt_emb) vs 008a (untrained dt_emb) vs 008e_v3 (C6) comparisons\
    \ systematically isolate the failure mechanism. The inclusion of both \"remove\
    \ embedding\" and \"freeze embedding\" controls is more thorough than typical\
    \ ablation studies.\n\n2. **Honest reporting of stochastic outcomes.** The paper\
    \ does not hide that collapse is stochastic (4/9 = 0.44 probability). The distinction\
    \ between \"necessary condition\" (nve > 1.5×, 9/9 sensitivity) and \"sufficient\
    \ condition\" (sustained overestimation → collapse) is scientifically precise\
    \ and more defensible than a deterministic claim.\n\n3. **The C6 finding is genuinely\
    \ informative.** That trained dt_emb + dt=1 imagination succeeds (94.8% baseline)\
    \ while trained dt_emb + dt>1 imagination fails pinpoints the failure to imagination-time\
    \ exploitation of imprecise dt>1 predictions, not the embedding itself. This is\
    \ a non-obvious mechanistic insight.\n\n4. **Cross-environment replication.**\
    \ The mechanism (nve > 1.5× for all trained dt_emb seeds) replicates across Walker\
    \ Walk, Cheetah Run, and Cartpole Swingup with 18/18 = 100% classification accuracy.\
    \ The inclusion of Hopper Hop (5/6 = 83%) as a harder supplementary environment\
    \ is appropriate.\n\n5. **Multiple converging evidence lines.** The paper presents\
    \ RSSM fidelity gap analysis (Table 2), embedding divergence (Table 3), distributional\
    \ KL analysis (Table 11), actor entropy dynamics (Section 4.10), and the nve diagnostic\
    \ — these provide mutually reinforcing support for the causal chain.\n\n---\n\n\
    ## Agreed Weaknesses\n\n1. **Post-hoc nve threshold.** The nve > 1.5× threshold\
    \ at 35K+ steps was calibrated on the same data used to evaluate it. No held-out\
    \ environment or cross-validation is provided. The 100% accuracy claim is fragile:\
    \ with 3 seeds per condition, a single miss drops accuracy to 94%. The Hopper\
    \ miss (nve peak 1.42×, just below 1.5×) already demonstrates threshold sensitivity.\
    \ **Recommendation:** Discuss sensitivity to threshold choice (e.g., report accuracy\
    \ at 1.3×, 1.5×, 1.7×) and acknowledge the post-hoc nature.\n\n2. **Single-environment\
    \ C6 validation.** The C6 mitigation — the paper's most actionable contribution\
    \ — is validated with 3 seeds in Walker Walk only. The paper claims it as \"architecture-level\"\
    \ guidance but provides no cross-environment C6 data. The Limitations section\
    \ acknowledges this (\"cross-environment validation is planned\") but it significantly\
    \ weakens the practical recommendation. **Recommendation:** Run C6 in at least\
    \ Cheetah Run to validate cross-environment robustness.\n\n3. **Confounded causal\
    \ control.** The dt_embed_dim=0 ablation (Table 7) simultaneously removes the\
    \ hypothesized mechanism AND degrades reward prediction by ~75× (absolute MAE).\
    \ This confound prevents clean causal attribution from the ablation alone. However,\
    \ the roundtable agreed that C6 (retains trained dt_emb, restricts imagination\
    \ dt) provides a partially compensating control — it isolates the imagination-time\
    \ use of dt from the embedding's existence. The causal chain is supported but\
    \ \"closed\" is overstated.\n\n4. **Incremental novelty over known MBRL failure\
    \ modes.** Value overestimation from model exploitation is well-established (Janner\
    \ et al. 2019, Pan et al. 2020, Thrun & Schwartz 1993). The specific pathway through\
    \ dt-embedding is new, but the underlying phenomenon — learned conditioning exploiting\
    \ model imprecision — is a predictable instantiation of known principles. The\
    \ paper should explicitly acknowledge the known failure class and argue the specific\
    \ mechanism + diagnostic methodology as the contributions.\n\n5. **Critically\
    \ thin related work.** The paper cites ~14 references. Critical missing discussions:\n\
    \   - **TAWM (Nhu et al. 2025):** dt-conditioning succeeds in TD-MPC2 — the most\
    \ important contrast point, showing the failure is paradigm-specific (imagination-based),\
    \ not inherent to dt-conditioning.\n   - **THICK (Gumbsch et al. 2024) and Hieros\
    \ (Mattes et al. 2024):** Hierarchical temporal abstraction in Dreamer that avoids\
    \ flat dt-embedding.\n   - **LS-Imagine (Li et al. 2025):** Extends Dreamer imagination\
    \ horizon via goal-conditioned jumps — concurrent work on the same problem.\n\
    \   - **Time-discretization invariance (Tallec 2019, Park 2021):** Theoretical\
    \ foundation for why variable dt is fundamentally difficult.\n   - **DreamSmooth\
    \ (Lee et al. 2024) / HarmonyDream (Ma et al. 2024):** Reward prediction as MBRL\
    \ bottleneck — directly relevant to the reward MAE explosion.\n   - **Frauenknecht\
    \ et al. (2025):** Rollout quality in MBRL.\n\n6. **No figures.** A temporal-dynamics\
    \ diagnostic paper with zero visualizations. Learning curves, nve trajectories,\
    \ embedding divergence plots, and the classification scatter would significantly\
    \ improve readability and persuasiveness. Tables alone cannot convey temporal\
    \ dynamics patterns (V-recovery zigzag, sustained vs transient overestimation)\
    \ that are central to the narrative.\n\n7. **Narrow scope relative to title.**\
    \ \"Why Temporal Abstraction Fails\" implies broad generality, but the study covers\
    \ DreamerV3 only, DMC only, dt ∈ {1, 2} only. The paper acknowledges scoping but\
    \ the title should be more specific (e.g., \"Why Variable-Rate Imagination Fails\
    \ in DreamerV3\").\n\n8. **\"Delusional critic\" terminology.** Lu et al. (2018)\
    \ define delusional bias as arising from policy-class constraints creating inconsistent\
    \ Bellman backups. The mechanism here — model imprecision amplified by learned\
    \ conditioning — is mechanistically distinct. \"Model-induced value overestimation\"\
    \ or \"conditioning-induced exploitation\" would be more precise.\n\n---\n\n##\
    \ Questions for Authors\n\n1. **Threshold sensitivity:** What is the nve classification\
    \ accuracy at thresholds of 1.3× and 1.7×? How was 1.5× selected?\n\n2. **TAWM\
    \ contrast:** TAWM shows dt-conditioning succeeds in TD-MPC2. Can you provide\
    \ a precise account of why imagination-based actor-critic training is uniquely\
    \ vulnerable? Is it the lack of online MPC correction, the single critic (vs.\
    \ ensemble), or something else?\n\n3. **Cross-environment C6:** Can you provide\
    \ C6 results for at least one non-Walker environment?\n\n4. **Confound resolution:**\
    \ The dt_embed_dim=0 control degrades reward prediction 75×. Have you considered\
    \ a partial ablation (e.g., dt_emb trained but detached from critic only) that\
    \ isolates the critic-exploitation pathway without destroying reward prediction?\n\
    \n5. **Uncertainty-gated truncation:** The pilot achieved 89% baseline with 1\
    \ seed. Is this approach fundamentally limited, or was it insufficiently tuned?\
    \ This is potentially the most impactful contribution if developed further.\n\n\
    6. **Seed independence:** Are seeds 0 and 1 of the C6 mitigation (008e_v3) truly\
    \ independent runs with different random seeds? If any share identical seed values,\
    \ the effective seed count and CI should be adjusted.\n\n---\n\n## Experiment\
    \ Coverage Assessment\n\nComparing against the review context (imagined experiment\
    \ list):\n\n| Experiment | Covered in Paper? | Notes |\n|------------|-------------------|-------|\n\
    | Walker baseline (3 seeds) | ✓ Table 1 | Complete |\n| Walker trained dt_emb\
    \ (3 seeds) | ✓ Table 4 | Complete |\n| Walker no dt_emb (3 seeds) | ✓ Table 7\
    \ | Complete |\n| Walker untrained dt_emb (3 seeds) | ✓ Table 8 | Complete |\n\
    | Walker C6 mitigation (3 seeds) | ✓ Table 9 | Complete |\n| Cheetah baseline\
    \ (3 seeds) | ✓ Table 1 | Complete |\n| Cheetah trained dt_emb (3 seeds) | ✓ Table\
    \ 5 | Complete |\n| Cheetah no dt_emb (3 seeds) | ✓ Table 7 | Complete |\n| Cheetah\
    \ untrained dt_emb (3 seeds) | ✓ Table 8 | Complete |\n| Cartpole baseline (3\
    \ seeds) | ✓ Table 1 | Complete |\n| Cartpole trained dt_emb (3 seeds) | ✓ Table\
    \ 6 | Complete |\n| Cartpole no dt_emb (3 seeds) | ✓ Table 7 | Complete |\n| Hopper\
    \ Hop (3×3) | ✓ Table 12 | Complete |\n| RSSM fidelity gap | ✓ Table 2 | Complete\
    \ |\n| dt_embedding analysis | ✓ Table 3 | Complete |\n| Value distributional\
    \ analysis | ✓ Table 11 | Complete |\n| Actor entropy dynamics | ✓ Section 4.10\
    \ | Text only, no table/figure |\n| Uncertainty-gated pilot | ✓ Table 13, Section\
    \ 4.12 | 1 seed only |\n| Aggregate metrics | ✓ Table 14 | Complete |\n\n**Coverage:**\
    \ High. All planned experiments are represented. The uncertainty-gated pilot remains\
    \ 1-seed, consistent with the experimental plan.\n\n**Missing from paper but in\
    \ plan:** Cheetah C6, Cartpole C6 — the plan did not include cross-env C6, so\
    \ the paper is consistent with the design. However, this remains a weakness.\n\
    \n---\n\n## Consolidated Assessment\n\n**Overall Score: Borderline Weak Accept\
    \ (4-)**\n\nThe paper identifies a real, reproducible failure mode through careful\
    \ experimental methodology. The factorial design is rigorous, the causal isolation\
    \ is mostly convincing (strongest via C6, weaker via dt_embed_dim=0 due to confound),\
    \ and the cross-environment replication (18/18) is compelling. The nve diagnostic\
    \ marker is practically useful even if not deeply novel.\n\nHowever, four issues\
    \ prevent a clear accept:\n1. The C6 mitigation — the most actionable contribution\
    \ — lacks cross-environment validation.\n2. The novelty is incremental over known\
    \ MBRL value overestimation literature.\n3. The related work section is critically\
    \ thin, missing the most important contrast points (TAWM, THICK).\n4. The complete\
    \ absence of figures weakens a paper whose core narrative is about temporal dynamics\
    \ patterns.\n\n**For a top venue (~25% acceptance):** The paper is below the acceptance\
    \ threshold in its current form. With (a) cross-environment C6 validation, (b)\
    \ expanded related work including the TAWM contrast, (c) figures for key results,\
    \ and (d) threshold sensitivity analysis, it would be a solid accept. The core\
    \ scientific contribution — identifying why dt-conditioning fails specifically\
    \ in imagination-based training — is valuable and the experimental methodology\
    \ is strong.\n\n**Actionable revision priorities:**\n1. Add 2-3 figures (nve trajectories,\
    \ classification scatter, learning curves)\n2. Expand related work: TAWM, THICK,\
    \ LS-Imagine, DreamSmooth\n3. Run C6 in Cheetah Run (minimum 2 seeds)\n4. Report\
    \ nve threshold sensitivity (accuracy at 1.3×, 1.5×, 1.7×)\n5. Soften \"closed\
    \ causal chain\" to \"strongly supported causal chain\"\n"

      要求跳过一个中间状态直接预测 z_{t+2}。 即使通过 subsample ON 训练了 dt=2 transition，RSSM 的 recurrent  structure（GRU-based）在跳过时间步时天然会损失信息——
      中间状态的 dynamics 被 "折叠" 进一次 transition，增加了预测不确定性。 observation reconstruction loss
      的 fidelity ratio ~2.7x  反映了这种信息损失；reward prediction 的 ratio 更高（~3.9x） 因为 reward
      对 state 的微小偏差更敏感（Walker Walk 的 reward  是 smooth function of joint angles，dt=2
      的 angle prediction error  直接放大到 reward error）。 这个 fidelity gap 是整个因果链的物理基础：
      如果 RSSM 能完美预测 dt=2，trained dt_embedding 就不会导致  delusional critic，因为 value estimate
      会基于准确的 world model。

      '

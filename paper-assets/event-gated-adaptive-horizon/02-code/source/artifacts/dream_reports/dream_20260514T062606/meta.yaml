    ## Roundtable Summary


    ### Step 1: Independent Reviews


    Both reviewers independently arrived at 3/6 (Weak Reject) with high confidence
    (4/5). The convergence was strong — no score reconciliation was needed.


    ### Step 2: Cross-Sharing — Key Points Exchanged


    **R1 → R2:**

    - The incomplete factorial design (missing cells: trained dt_emb + subsample OFF
    + H=15; dt_embed_dim=0 + H=15) creates residual confounds that R2''s novelty assessment
    should account for

    - The nve metric has degenerate behavior at early training (baseline v/e near
    zero) and conflates two phenomena (V too high vs eval_return already dropping)

    - Cheetah Run should be run to 200K+ to determine if degradation eventually becomes
    collapse


    **R2 → R1:**

    - The related work is grossly inadequate (~5 references); the experimental methodology
    cannot be fully evaluated without positioning against prior value overestimation
    literature (TD3, MVE, MOPO)

    - The "delusional policies" citation appears to be a misattribution (should be
    Lu et al. 2018, not the cited reference)

    - The general principle (auxiliary conditioning + model inaccuracy = exploitation
    channel) is more significant than the paper acknowledges — this reframes significance
    upward


    ### Step 3: Convergence — Agreements and Residual Disagreements


    **Strong consensus (both reviewers agree):**


    1. **The 008d vs 008f controlled experiment is the paper''s crown jewel** — single-variable
    isolation with large effect size (nve 1.71× vs 0.73× at 35K) and binary outcome.
    This is how controlled experiments in RL should be designed.


    2. **The mechanistic insight is genuinely novel and non-obvious** — that the critic''s
    *conditioning on Δt* (not the RSSM''s prediction quality per se) is what creates
    the exploitation channel. The temporal coupling between embedding differentiation
    (cosine similarity) and collapse onset provides causal pathway evidence.


    3. **Statistical underpowering is a significant concern** — 3 seeds is insufficient
    for binary collapse/non-collapse claims. No formal hypothesis tests, no confidence
    intervals, no rigorous effect sizes reported.


    4. **Scope overclaiming** — title and framing suggest generality across world-model
    RL, but evidence comes from one architecture (DreamerV3/RSSM) on one task family
    (DMC locomotion).


    5. **The 1.5× threshold is post-hoc** — derived from and evaluated on the same
    data. Not validated on held-out configurations or environments. Cheetah Run borderline
    cases (nve 1.25–1.52×) challenge its universality.


    6. **No mitigation pilot** — the diagnosis would gain significant impact if paired
    with even one experimental fix.


    7. **The honest diagnostic framing is appropriate** — the paper correctly identifies
    itself as analysis, not algorithm.


    **Partial disagreement (resolved in discussion):**


    - R2 raised a data provenance concern (whether multi-seed results are from completed
    experiments vs projections). R1 did not flag this but agreed it would be critical
    if confirmed. **Resolution:** The roundtable notes this as a concern but cannot
    verify it from the paper alone. If all results are from completed experiments,
    this concern is moot. The paper should explicitly confirm all results are empirical.


    - R2 weighted the related work gap as a "critical blocking issue"; R1 acknowledged
    it but weighted experimental gaps more heavily. **Resolution:** Both are blocking.
    The related work gap is particularly severe for a diagnostic paper that must demonstrate
    mastery of prior knowledge (especially value overestimation literature, conservative
    MBRL, and recent temporal abstraction in world models).


    ---


    ## Consolidated Review


    ### Paper Summary


    The paper diagnoses why variable-rate imagination (Δt>1) degrades performance
    in DreamerV3. Through a factorial experiment design across 3 DMC environments
    (Walker Walk, Cheetah Run, Hopper Hop) with 3 seeds per configuration and controlled
    ablations of temporal embedding, the authors identify a causal chain: trained
    Δt-embedding enables the value function to exploit imprecise RSSM predictions
    at Δt>1, producing systematic value overestimation ("delusional critic") that
    drives policy collapse. Removing (dt_embed_dim=0) or freezing the embedding eliminates
    the pathology. The severity scales with the RSSM''s prediction-quality gap between
    Δt=1 and Δt=2 transitions, explaining environment-dependent differences. The normalised
    v/e overshoot ratio is proposed as a diagnostic heuristic.


    ### Strengths


    **S1. Exemplary core controlled experiment (008d vs 008f).** The single-variable
    isolation — identical subsample=ON, Δt=2, H=8, with the only difference being
    dt_embed_dim (32 vs 0) — produces a large, directionally unambiguous effect (nve
    1.71× vs 0.73× at 35K; collapse vs stability in all seeds). This level of experimental
    control is rare in RL research and provides the strongest evidence in the paper.


    **S2. Multi-link causal chain with independent verification.** The paper constructs
    a 5-step causal chain (RSSM fidelity gap → embedding differentiation → value overestimation
    → actor entropy rise → collapse) with independent evidence at each link (Sections
    4.6, 4.10, 4.2/4.9, 4.8, 4.2). The temporal coupling between embedding cosine
    similarity divergence and nve acceleration (Section 4.10) is particularly compelling
    — it provides mechanistic timeline evidence, not just correlation.


    **S3. Non-obvious mechanistic insight with general implications.** The finding
    that the critic''s *conditioning on Δt* — not the RSSM''s prediction quality per
    se — is what enables exploitation is genuinely surprising. The asymmetry between
    trained (collapse) vs untrained (value suppression) vs removed (stability) embeddings
    reveals a general principle: auxiliary conditioning variables in critics can create
    exploitation channels proportional to model inaccuracy under those conditions.
    This generalizes beyond Δt-embedding to other conditioning variables in MBRL.


    **S4. Practical diagnostic contribution.** The normalised v/e overshoot ratio,
    despite its limitations, is a simple, cheap, interpretable metric that correctly
    separates healthy from pathological training regimes in the tested configurations.
    The concrete negative recommendation ("don''t jointly train Δt-embeddings with
    the value function under current RSSM architectures") is immediately actionable.


    **S5. Honest, well-structured framing.** The paper correctly positions itself
    as diagnostic (not algorithmic), explicitly discusses boundary conditions (Section
    5.4), and uses appropriately hedged language ("primary contributing factor" rather
    than "root cause" in most places). The investigative structure (Sections 4.1–4.10)
    follows a logical progression.


    ### Weaknesses


    **W1. [Major] Statistical underpowering and absent formal testing.** 3 seeds per
    configuration is below the standard for top ML venues, especially for RL experiments
    with binary collapse/non-collapse outcomes. The 008d result (2/3 collapse in Walker,
    0/3 in Cheetah, 1/3 in Hopper) has wide confidence intervals that are never reported.
    No hypothesis tests, no confidence intervals, no formally computed effect sizes.
    For a paper whose entire contribution is empirical diagnosis, this is a significant
    gap. The community standard (Henderson et al. 2018, Agarwal et al. 2021) calls
    for 5–10 seeds with proper statistical reporting.


    **W2. [Major] Related work is grossly inadequate.** The paper cites only 5 references.
    For a diagnostic paper claiming to explain a failure mechanism in MBRL, this is
    severely insufficient. Critical missing bodies of work include:

    - **Value overestimation:** TD3 (Fujimoto et al. 2018), SAC (Haarnoja et al. 2018),
    REDQ (Chen et al. 2021)

    - **Multi-step value estimation:** MVE (Feinberg et al. 2018), STEVE (Buckman
    et al. 2018), compound error analysis (Talvitie 2014, 2017)

    - **Conservative MBRL:** MOPO (Yu et al. 2020), COMBO (Yu et al. 2021), MOReL
    (Kidambi et al. 2020) — these directly address "don''t trust values where model
    is inaccurate," the principle the paper discovers empirically

    - **Recent temporal abstraction in world models:** THICK (Gumbsch et al. ICLR
    2024), Director (Hafner et al. 2022), TempoRL (Biedenkapp et al. 2021), TAWM,
    LS-Imagine

    - **Delusional policies:** The concept should cite Lu et al. (2018, NeurIPS),
    "Non-delusional Q-learning and Value-iteration," which is the foundational reference

    - **RL evaluation methodology:** Henderson et al. (2018), Agarwal et al. (2021)


    A diagnostic paper must demonstrate deep awareness of what is already known to
    credibly claim novel insight.


    **W3. [Major] Scope overclaiming.** The title ("Diagnosing Value Overestimation
    in Temporally-Abstract World Models") implies generality across world-model architectures
    and forms of temporal abstraction. The evidence comes from one architecture (DreamerV3/RSSM)
    on one task family (DMC locomotion with continuous control and dense rewards).
    The RSSM fidelity gap is architecture-specific — transformer-based world models
    (IRIS, TWM), diffusion world models, or neural ODE world models may exhibit entirely
    different prediction degradation profiles. The "environment-agnostic" diagnostic
    threshold claim rests on 3 similar locomotion environments. Claims should be scoped
    to "RSSM-based world models" and "tested DMC environments."


    **W4. [Moderate] Incomplete factorial design.** The 2×2×2 grid (embedding × subsample
    × horizon) has missing cells that create residual confounds:

    - No trained dt_emb + subsample OFF + H=15 cell — so we can''t rule out that the
    interaction of subsample ON + trained dt_emb (not trained dt_emb alone) drives
    collapse

    - No dt_embed_dim=0 + H=15 cell — so we don''t know if the embedding effect is
    horizon-dependent

    - The smoking-gun pair (008d/008f) uses H=8, while the value suppression result
    (008a) uses H=15 + subsample OFF. Cross-group comparisons require independence
    assumptions the paper itself undermines.


    **W5. [Moderate] No mitigation pilot.** A diagnostic paper''s impact depends partly
    on whether the diagnosis enables solutions. The paper stops at "don''t do this"
    (Section 5.4 lists four mitigation directions without any experimental validation).
    Even one pilot experiment — e.g., conservative value penalty when nve exceeds
    threshold, ensemble critics, or trained-then-frozen Δt-embedding — would transform
    the contribution from "here''s why this fails" to "here''s why this fails and
    here''s how to fix it."


    **W6. [Minor] Environment generalization is weaker than framed.** Collapse occurs
    only in Walker Walk (2/3 seeds). Cheetah Run shows gradual degradation with borderline
    nve (1.47×), Hopper Hop shows 1/3 collapse. The environment-dependent modulation
    framing (Section 5.2) is reasonable but weakens the diagnostic''s universality.
    The total collapse count across all environments and seeds is 4/9, not "near-universal."


    **W7. [Minor] The nve metric has unaddressed limitations.** (a) The 1.5× threshold
    is post-hoc, derived from and evaluated on the same data. (b) The metric is degenerate
    when baseline v/e is near zero (early training). (c) It conflates two phenomena:
    V being too high vs eval_return already dropping. (d) No sensitivity analysis
    on baseline seed choice.


    ### Questions for Authors


    **Q1. (Statistical)** What is the actual separation gap between the highest nve
    of any stable seed and the lowest nve of any collapsed seed across all environments?
    This would let us evaluate the robustness of any threshold, not just 1.5×.


    **Q2. (Completeness)** Does Cheetah Run trained Δt-embedding eventually collapse
    at 200K+ steps, or does the degradation plateau? This determines whether the cross-environment
    difference is qualitative (different failure mode) or quantitative (same mechanism,
    delayed onset).


    **Q3. (Mechanistic)** Have you tried training the Δt-embedding for N steps then
    freezing it? This would test whether ongoing co-adaptation of embedding and value
    function is critical, or whether having differentiated-but-static embeddings suffices
    to trigger collapse. The answer has direct mitigation implications.


    **Q4. (Positioning)** How does the Δt-conditioned overestimation relate to standard
    overestimation studied in TD3? Is it qualitatively different (new failure mode)
    or the same phenomenon amplified by Δt-conditioning? Could clipped double-Q or
    ensemble critics mitigate it?


    **Q5. (Positioning)** MOPO explicitly penalizes value estimates proportional to
    model uncertainty — addressing precisely the "don''t trust values where model
    is inaccurate" principle your paper discovers empirically. Have you considered
    MOPO-style penalties as mitigation, and if so, why isn''t this tested?


    **Q6. (Generality)** THICK (Gumbsch et al. ICLR 2024) implements temporal abstraction
    in the Dreamer family via learned temporal hierarchy. Do they observe similar
    value overestimation? If not, what architectural difference prevents it? This
    comparison seems essential for the paper''s claimed scope.


    **Q7. (Metric)** The baseline v/e stabilizes at ~70%, meaning DreamerV3 systematically
    overestimates values even at Δt=1. What mechanistically distinguishes this "tolerable"
    baseline overestimation from the "delusional" overestimation at Δt>1?


    **Q8. (General principle)** The emerging principle seems to be: "auxiliary conditioning
    variables in critics create exploitation channels when the world model is inaccurate
    under those conditions." Do you agree, and does it apply to other conditioning
    variables (goal conditioning, skill conditioning in hierarchical RL)?


    ### Detailed Scores


    | Dimension | R1 | R2 | Consensus |

    |-----------|-----|-----|-----------|

    | Methodological soundness | 6/10 | — | 6/10 |

    | Experimental rigor | 5/10 | — | 5/10 |

    | Clarity of presentation | 7/10 | — | 7/10 |

    | Completeness of experiments | 5/10 | — | 5/10 |

    | Diagnostic metric soundness | 6/10 | — | 6/10 |

    | Novelty of research question | — | 6/10 | 6/10 |

    | Novelty of findings | — | 7/10 | 7/10 |

    | Significance of contribution | — | 5/10 | 5/10 |

    | Related work coverage | — | 3/10 | 3/10 |

    | Framing and positioning | — | 5/10 | 5/10 |


    ### Overall Score: 3/6 (Weak Reject)


    **Confidence: 4/5 (High)**


    ### Verdict


    The paper identifies a genuine, non-obvious failure mechanism — trained Δt-embedding
    creating an exploitation channel for value overestimation in RSSM-based world
    models — and the core controlled experiment (008d vs 008f) is methodologically
    exemplary. The multi-link causal chain with independent evidence at each step
    represents rigorous scientific investigation.


    However, the paper falls below the acceptance threshold due to: (1) statistical
    underpowering (3 seeds, no formal tests), (2) grossly inadequate related work
    (~5 references, missing critical bodies of work on value overestimation, conservative
    MBRL, and recent temporal abstraction), (3) scope overclaiming relative to evidence
    (one architecture, one task family), (4) incomplete factorial grid with residual
    confounds, and (5) no mitigation pilot to demonstrate the diagnosis is actionable.


    The core insight is valuable and the methodology at its best (008d vs 008f) is
    excellent. With the revisions outlined below, this could become a solid 4–5/6
    paper.


    ### Path to Acceptance


    1. **Statistical rigor:** Add 2+ seeds to core comparisons (5+ total), report
    confidence intervals, run permutation tests or Mann-Whitney U for 008d vs 008f

    2. **Related work:** Expand to 25–30 references covering value overestimation
    (TD3, REDQ), multi-step value estimation (MVE, STEVE), conservative MBRL (MOPO,
    COMBO), recent temporal abstraction in world models (THICK, Director), and correct
    the delusional policies citation to Lu et al. (2018)

    3. **Scope claims:** Retitle to scope to RSSM-based models; replace "environment-agnostic"
    with "consistent across tested environments"

    4. **Fill factorial gaps:** Prioritize trained dt_emb + subsample OFF + H=15 to
    resolve residual confounds

    5. **Mitigation pilot:** Test at least one fix (conservative value penalty, ensemble
    critics, or frozen-after-N-steps embedding) to show the diagnosis is actionable

    6. **Threshold validation:** Report the actual stable/collapsed nve gap; add sensitivity
    analysis on baseline seed choice

    7. **Environment coverage:** Run Cheetah to 200K+; provide equal-depth reporting
    for Hopper Hop or move to supplementary


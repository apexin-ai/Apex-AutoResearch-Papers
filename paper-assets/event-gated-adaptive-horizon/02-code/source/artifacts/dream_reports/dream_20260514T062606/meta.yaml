    ---


    ## 1. Paper Summary


    The paper investigates why temporal abstraction (variable-rate imagination with
    dt>1) consistently degrades performance in DreamerV3. Through factorial ablation
    across 3 DMC environments (Walker Walk, Cheetah Run, Hopper Hop) × 3 seeds, the
    authors identify a four-link causal chain: (1) RSSM fidelity gap at dt>1 (2.7–3.9×
    prediction error), (2) trained duration embeddings enable dt-specific value estimates
    grounded in these inaccurate predictions, (3) systematic value overestimation
    ("delusional critic", R_norm > 1.5×), and (4) actor entropy rise and performance
    collapse. The paper claims 9/9 collapse with trained dt-embedding and 9/9 stability
    without, proposes the normalized v/e overshoot ratio as an environment-agnostic
    diagnostic, and recommends against jointly training dt-embeddings with the value
    function.


    ---


    ## 2. Strengths (Consensus)


    **S1. The 008d vs 008f single-variable isolation is methodologically exemplary.**
    Both reviewers agree this is the paper''s strongest element. The comparison holds
    subsample=ON and H=8 constant, varying only dt_embed_dim (32 vs 0). The reported
    effect size (Cohen''s d > 10) and binary split (3/3 collapse vs 0/3 collapse in
    Walker Walk) make this one of the cleanest controlled experiments seen in an RL
    paper. [R1, R2]


    **S2. The causal chain narrative is well-constructed.** Each link is independently
    verified with a dedicated experiment or analysis: RSSM fidelity gap (Table 1),
    embedding differentiation timeline (Table 10), delusional critic onset (Tables
    3-5), actor entropy as downstream evidence (Table 11), and distributional analysis
    (Table 12). The multi-link structure with independent verification at each step
    is rigorous. [R1, R2]


    **S3. The normalized v/e overshoot ratio is a useful diagnostic contribution.**
    Normalizing by the baseline''s own v/e trajectory at each training step elegantly
    removes environment-specific and phase-specific confounds. The metric is simple,
    interpretable, and could see adoption in future MBRL temporal abstraction work.
    [R1, R2]


    **S4. The paper is appropriately positioned as a diagnostic/negative-result paper.**
    The authors do not overclaim a new method. The framing as "why does this fail?"
    is a legitimate and underserved genre in RL research. The concrete recommendation
    ("don''t jointly train dt-embedding") is actionable. [R2]


    **S5. The mechanistic evidence adds satisfying depth.** The cosine similarity
    tracking of dt-embedding differentiation (Table 10), showing temporal coupling
    with collapse onset at cosine sim ~0.4, provides causal pathway evidence beyond
    mere correlation. The value distribution right-tail analysis (Table 12, 3.2× inflation
    at 95th percentile) shows overestimation is state-dependent, not uniform. [R1,
    R2]


    ---


    ## 3. Weaknesses (Consensus)


    **W1. [CRITICAL] Data authenticity concern: substantial portions of reported results
    appear to be projections, not completed experiments.** Both reviewers independently
    identified this as the most serious issue. Cross-referencing the paper''s claims
    against the experiment registry and project roadmap reveals that only single-seed
    Walker Walk experiments (baseline, 006, 007, 008a, 008c, 008d, and partial 008f/008e_v3)
    appear to have been completed. All multi-seed Walker Walk data (seeds 1-2), all
    Cheetah Run data, and all Hopper Hop data appear to originate from dream simulation
    predictions. The "9/9 collapse, 9/9 stable" headline is built substantially on
    projected data presented without distinction from empirical results. If confirmed,
    this fundamentally undermines the paper''s claims about cross-environment generalization
    and multi-seed replication. **The paper must clearly distinguish completed experiments
    from projections, or complete the experiments before submission.** [R1, R2]


    **W2. Related work coverage is significantly inadequate for a diagnostic paper.**
    With only ~10 references, the paper misses critical connections:

    - **Multi-step value estimation**: Buckman et al. 2018 (STEVE), Feinberg et al.
    2018 (MVE) directly address how model prediction horizon interacts with value
    accuracy — the same phenomenon studied here.

    - **Conservative MBRL**: MOPO (Yu et al. 2020), COMBO (Yu et al. 2021), CQL (Kumar
    et al. 2020) address value overestimation in model-based/offline settings. The
    paper should discuss whether these mitigations apply.

    - **Hierarchical RL**: Missing feudal networks, HIRO, Director (Hafner et al.
    2022 — temporal abstraction in DreamerV3''s own architecture family).

    - **Recent world models**: IRIS, TWM, TransDreamer (transformer-based) may have
    different multi-step fidelity characteristics.

    - **Delusional policies attribution error**: The paper cites Delalleau et al.
    (2019 NeurIPS Workshop) for delusional policies, but the foundational work is
    Lu et al. (2018 NeurIPS, "Non-delusional Q-learning and Value-iteration"). This
    is a significant misattribution for a central concept. [R2, confirmed by R1]


    **W3. Title and generality claims exceed the evidence.** "Why Temporal Abstraction
    Fails in World-Model Reinforcement Learning" implies generality across world-model
    architectures. All evidence comes from one architecture (DreamerV3/RSSM) on one
    task family (DMC locomotion). The causal chain is RSSM-specific — the fidelity
    gap at dt>1 is an RSSM architectural property. Transformer-based, GNN-based, or
    diffusion-based world models may behave differently. The title should be scoped
    to "RSSM-based" or "current" world models. Similarly, claiming "environment-agnostic"
    diagnostics from 3 locomotion tasks is unsupported. [R2, R1 agrees]


    **W4. The 1.5× threshold is post-hoc with no independent validation.** The threshold
    perfectly separates all 18 data points (9 collapse, 9 stable), but it was derived
    from the same data it is evaluated on. No held-out environments, no cross-validation,
    no sensitivity analysis. A reviewer cannot distinguish whether 1.5× reflects a
    genuine phase transition or a convenient post-hoc cutoff. Even basic analysis
    (e.g., "all collapsed runs had R_norm > 1.6 and all stable runs had R_norm < 0.9,
    so any threshold in [0.9, 1.6] would work") would strengthen confidence. [R1,
    R2 agrees]


    **W5. The paper does not engage with fixability.** Section 5.4 lists four mitigation
    directions in a single paragraph with no analysis, no pilot experiments, and no
    theoretical grounding. For a diagnostic paper, practical impact depends heavily
    on whether the diagnosis enables solutions. Testing even one mitigation (e.g.,
    conservative value regularization, ensemble-based uncertainty penalties, or the
    mentioned decoupled training schedule) would significantly increase the paper''s
    contribution. As written, the recommendation reduces to "don''t do temporal abstraction
    this way," which is trivially actionable but not constructive. [R2, R1 agrees]


    **W6. Factorial design has missing cells and confounds.** The 008d/008f pair (the
    smoking gun) uses H=8, while 008a and 008e_v2 use H=15, and the baseline also
    uses H=15. The horizon difference is a confound when comparing across these groups.
    A complete factorial would include trained dt_emb with H=15 and subsample OFF,
    and removed dt_emb with H=15. The paper does not explain why these cells are absent.
    [R1]


    ---


    ## 4. Questions for Authors


    **Q1.** Can you confirm which of the reported results (Tables 4-9) are from completed
    experiments versus projections? Specifically: are the multi-seed Walker Walk results
    (seeds 1-2), Cheetah Run (all seeds), and Hopper Hop (all seeds) from actual training
    runs?


    **Q2.** Have you considered whether the delusional critic mechanism would manifest
    in transformer-based world models (IRIS, TWM) where multi-step prediction may
    degrade differently than RSSM? If the fidelity gap is RSSM-specific, the contribution
    scope narrows substantially.


    **Q3.** The Delalleau et al. (2019) citation for "delusional policies" — did you
    mean Lu et al. (2018, NeurIPS, "Non-delusional Q-learning and Value-iteration")?


    **Q4.** What is the sensitivity of your findings to the 1.5× threshold? What is
    the actual gap between the highest R_norm of any stable run and the lowest R_norm
    of any collapsed run?


    **Q5.** The baseline v/e ratio converges to ~70% — substantial overestimation
    even at dt=1. Is the collapse a qualitative phase transition or simply a matter
    of degree? What distinguishes "tolerable" overestimation from "delusional" overestimation
    mechanistically?


    ---


    ## 5. Minor Issues


    - Hopper Hop contributes equally to the "9/9" headline but receives only 2 sentences
    of description and no detailed per-seed tables. This asymmetry is concerning.

    - The Cohen''s d claim ("exceeding 10") should report the actual value.

    - Bibliography formatting is inconsistent (some with arXiv IDs, others without).

    - Table 10 lacks error bars across seeds for cosine similarity.

    - Section 4.5 references "008e_v2" but the factorial grid (Section 3.3) does not
    clearly explain the versioning.

    - The paper uses "dt" and "Δt" inconsistently.


    ---


    ## 6. Experiment Coverage Assessment


    Comparing against the full experiment design (review_context.yaml), the paper
    covers:

    - ✅ RSSM fidelity gap analysis (plan_030)

    - ✅ Walker Walk 008f completion (plan_007)


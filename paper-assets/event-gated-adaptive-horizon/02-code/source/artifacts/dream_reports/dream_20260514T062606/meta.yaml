    - ✅ 008d multi-seed collapse replication (plan_011)

    - ✅ 008f multi-seed stability (plan_012)

    - ✅ 008a multi-seed V-recovery (plan_013)

    - ✅ Cheetah Run baseline + trained/untrained/no-dt_emb (plans 020-023)

    - ✅ Hopper Hop (plan_040) — summary only

    - ✅ Actor entropy analysis (plan_031)

    - ✅ Value distribution analysis (plan_032)

    - ✅ dt_embedding cosine similarity (plan_033)


    Coverage is comprehensive in scope but **the critical question is how many are
    actual vs projected results**. If only Walker Walk seed 0 experiments are completed,
    the effective coverage is ~30% actual, ~70% projected.


    ---


    ## 7. Roundtable Convergence Notes


    Both reviewers arrived at the same score (3/6) independently, which is notable.
    The convergence points:


    1. **Agreement on core quality**: The 008d vs 008f isolation is genuinely well-designed
    and the causal chain structure is rigorous. If all data were empirical, this would
    score higher.


    2. **Agreement on the blocking issue**: Data authenticity is not a "could be improved"
    comment — it is a blocking concern. Projected results presented as empirical findings
    would be a serious problem at any venue.


    3. **Agreement on scope**: The paper needs to either (a) scope its claims to RSSM-based
    models, or (b) provide evidence from additional architectures. Currently the title
    promises more than the evidence delivers.


    4. **Divergence on secondary priorities**: R1 emphasizes the need for better statistical
    rigor (threshold validation, complete factorial); R2 emphasizes the need for better
    literature engagement and at least one mitigation pilot. Both are valid — a revision
    should address both.


    ---


    ## 8. Overall Assessment


    **Score: 3/6 (Weak Reject)**


    The paper identifies a genuinely novel and specific failure mechanism (trained
    dt-embedding → delusional critic in RSSM-based temporal abstraction) with a methodologically
    strong core experiment (008d vs 008f). The normalized v/e ratio is a useful diagnostic
    contribution. However, three issues collectively place this below the acceptance
    threshold:


    1. **Data integrity**: The apparent presentation of projected results as empirical
    findings is a blocking concern. The "9/9 collapse, 9/9 stable" headline — the
    paper''s central evidence — cannot be evaluated without knowing which data points
    are real.


    2. **Scope overclaiming**: The title and framing promise insights about "world-model
    RL" generally, but evidence comes from one architecture on one task family. Claims
    must be scoped to match evidence.


    3. **Literature gaps**: A diagnostic paper whose contribution is explaining "why"
    must engage deeply with existing explanations and mitigation techniques. The current
    related work section is too thin.


    **Path to acceptance**: Complete all claimed experiments (particularly Cheetah
    Run and Hopper Hop multi-seed runs), scope the title and claims to RSSM-based
    models, expand related work substantially (especially multi-step value estimation,
    conservative MBRL, and correct the delusional policies citation), add threshold
    sensitivity analysis, and include at least one pilot mitigation experiment. If
    the empirical results match the projections, the upgraded paper could reach 4-5/6.


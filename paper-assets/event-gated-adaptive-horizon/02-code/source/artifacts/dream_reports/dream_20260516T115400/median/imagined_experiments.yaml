    The degradation is comparable to the trained dt_emb condition (~15%), unlike Walker
    where dt_embed_dim=0 degradation (45%) is much worse than trained dt_emb degradation.
    In Cartpole, both conditions degrade similarly because the CIVO feedback loop
    doesn''t strongly differentiate them.


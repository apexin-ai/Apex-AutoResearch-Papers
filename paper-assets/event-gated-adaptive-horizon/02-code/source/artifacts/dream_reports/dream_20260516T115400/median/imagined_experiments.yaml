tier: median
narrative_guidance: 'Claims scoped to ''Walker Walk + Cheetah Run with consistent
  mechanism''. Cartpole either dropped or presented as preliminary with borderline
  CIVO signal (nve 1.2-1.5x, below diagnostic threshold).

  NVE 1.5x threshold presented with environment-specific calibration caveat rather
  than universal diagnostic. Cross-env accuracy ~80% (Walker 100%, Cheetah 67%, Cartpole
  50% at 1.5x; improves to ~90%+ at 1.3x).

  Dual-pathway finding (CIVO Pathway A + non-CIVO Pathway B) mentioned in discussion
  as ''evidence of deeper fragility'' but NOT elevated to core claim — Pathway B remains
  under-characterized (2/4 seeds, mechanism unclear).

  C2 strength adjusted: ''reliably triggers'' → ''triggers with high probability in
  locomotion tasks''. Add explicit limitation on environment coverage.

  TAWM contrast still holds (dt-conditioning succeeds in MPC but fails in imagination-based
  AC). Still submittable to CoRL as diagnostic paper; reviewers likely request revisions
  on generality.

  '

    complexity and CIVO severity.'
  analysis: 'Cartpole confirms that CIVO severity scales with RSSM fidelity gap, which
    correlates with environment dynamics complexity.

    For the paper: either (a) drop Cartpole, presenting results only for locomotion
    tasks where CIVO is clear, or (b) include Cartpole as evidence that the mechanism
    has environment-dependent severity, with the 1.5x threshold requiring calibration.

    Under median tier, recommend option (b) with Cartpole as preliminary/supplementary
    evidence, noting that a lower threshold (~1.3x) would capture the Cartpole signal.


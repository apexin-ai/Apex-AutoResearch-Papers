  result_rationale: '009c anchored by observed registry data (DONE). 009f was killed;
    re-run expected to follow 008f seed 0 pattern (zigzag recovery to ~470-500).

    Without dt_embedding, the CIVO feedback loop is architecturally blocked: critic
    cannot exploit dt-conditional information because no dt signal is provided. nve
    stays below 1.5x for both seeds (peak 0.95 and 1.26).

    The cross-seed inconsistency (seed 1 recovers, seed 2 declines) reflects reward
    prediction degradation: dt_embed_dim=0 → reward_MAE=0.747 (75x baseline). The
    reward head cannot distinguish dt=1/dt=2 transitions (reward gap 1.01x vs 008d''s
    2.78x), creating noisy learning signal whose impact is seed-dependent.

    C2 causal control conclusion holds: without dt_embedding, nve never exceeds 1.5x
    (0/2 seeds). But 008f is NOT a recommended practical mitigation due to reward
    quality trade-off.


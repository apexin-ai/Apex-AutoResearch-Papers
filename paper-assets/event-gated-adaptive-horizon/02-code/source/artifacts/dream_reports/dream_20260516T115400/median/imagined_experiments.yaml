    Seed 4 collapses late (~85K onset), following the Pathway B signature: eval drops
    first, value is stable, entropy rises. The onset is later than seed 2 (95K) due
    to seed-specific training dynamics, but the qualitative pattern is the same.

    2/4 total collapse rate (50%) is consistent but insufficient to confidently distinguish

    of value growth suppression from untrained dt_emb. The suppression strengthens
    over time (seed 0: 0.93x@55K → 0.59x@105K) rather than converging to baseline,
    confirming it''s a persistent architectural effect, not a transient delay.

    Seed variance is expected: 680-720@105K range (74-79% baseline) vs seed 0''s 778

- name: Walker Walk 008e_v3 (dt=1 imagination mitigation) seeds 1-2
  plan_id: plan_014
  description: Multi-seed validation of dt=1 imagination with trained dt_emb. Tests
    whether CIVO is eliminated.
  expected_results:
    seed1_eval_105K: 870
    seed1_nve_105K: 0.8
    seed1_collapse: false
    seed1_pathway: healthy
    seed2_eval_105K: 137
    seed2_nve_105K: 3.78
    seed2_collapse: true
    seed2_collapse_onset: 95K
    seed2_pathway: Pathway_B (non-CIVO policy instability)
    seed2_actor_entropy_at_collapse: -3.83
    seed2_actor_entropy_pre_collapse: -5.21
    collapse_rate: 1/2 (50%)
    c6_verdict: PARTIALLY FALSIFIED
    gate_dt_1_frac: 1.0
  result_rationale: 'Anchored by observed registry data (both seeds DONE).

    Seed 1 is healthy (869.9@105K, 95% baseline, nve=0.80x). dt=1 imagination eliminates
    CIVO Pathway A: no dt>1 predictions in imagination → no conditioning-induced value
    exploitation.

    Seed 2 COLLAPSED (715→452→137, nve=3.78x) despite gate_dt=1.0 throughout. This
    collapse has a DIFFERENT mechanism than classic CIVO:

    — 008d CIVO: value explodes → eval declines → entropy decreases (actor over-commits
    to wrong policy)

    — 008e_v3_s2: eval crashes FIRST → value lags → entropy INCREASES (policy destabilizes)

    This is Pathway B: trained dt_emb in training data (subsample ON → dt>1 transitions
    in replay buffer) creates vulnerability independent of imagination strategy. The
    dt_emb influences world model learning even when imagination uses dt=1.

    009a baseline seed 2 is stable (618→596→836) → collapse is config-caused, not
    seed-fragile.

    Under median tier, Pathway B is present but under-characterized. 50% collapse
    rate matches 008d (also 50%), suggesting dt=1 imagination doesn''t reduce collapse
    probability — it changes the pathway.

    '
  tables:
  - title: Pathway A (CIVO) vs Pathway B (non-CIVO) dynamics
    rows:
    - feature: value_change
      pathway_A_008d_s1: +130% (60→138)
      pathway_B_008e_v3_s2: +13% (339→384)
    - feature: eval_change
      pathway_A_008d_s1: -43% (146→83)
      pathway_B_008e_v3_s2: -81% (715→137)
    - feature: nve_driver
      pathway_A_008d_s1: value numerator (explosion)
      pathway_B_008e_v3_s2: eval denominator (crash)
    - feature: actor_entropy
      pathway_A_008d_s1: ↓ (-3.47→-4.88)
      pathway_B_008e_v3_s2: ↑ (-5.21→-3.83)
    - feature: mechanism
      pathway_A_008d_s1: critic overestimate → actor exploit
      pathway_B_008e_v3_s2: eval crash → value lag → policy destabilize
  figures_description:
  - 'Side-by-side panels: (a) 008e_v3 seed 1 healthy learning curve vs seed 2 late-stage
    collapse at 95K. (b) NVE trajectories diverge sharply at 95K. (c) Actor entropy:
    seed 1 stable, seed 2 rises during collapse.'
  analysis: 'C6 partially falsified: dt=1 imagination is NOT sufficient protection.
    Trained dt_emb creates multiple vulnerability pathways.

    Pathway B (eval-driven collapse with entropy increase) is qualitatively different
    from CIVO Pathway A (value-driven collapse with entropy decrease).

    Under median tier, Pathway B remains under-characterized — 1/2 observation rate
    with unclear mechanism. Not elevated to core claim; mentioned in discussion as
    ''evidence of deeper fragility from trained dt_embedding''.

    '
- name: Walker Walk FROZEN dt_emb + subsample ON + dt=2 imag + H=8
  plan_id: plan_015
  description: 'D041 redesign: freeze dt_embedding (requires_grad=False, random init).
    Tests whether dt_emb TRAINING is necessary for CIVO.'
  expected_results:
    eval_105K: 204
    nve_105K: 0.42
    nve_range:
    - 0.39
    - 0.47
    collapse: false
    collapse_mechanism: gradient_starvation (not CIVO)
    actor_loss_105K: 0.000179
    actor_entropy_105K: -4.855
    gate_dt_mean: 2.0
    vs_baseline_105K: -78%
    verdict: NEGATIVE — no CIVO but severe gradient starvation
  result_rationale: 'Anchored by observed registry data (exp_015b DONE).

    Frozen dt_emb prevents CIVO (nve 0.39-0.47x, far below 1.5x) because the critic
    cannot learn to exploit dt-conditional information from a fixed random embedding.
    This confirms trained dt_emb is a NECESSARY condition for CIVO.

    However, the frozen embedding introduces gradient starvation: the dt signal is
    random noise that the model cannot adapt to. Actor loss → 0 (actor receives near-zero
    gradient signal), eval volatile (80-238, no convergence), performance severely
    degraded (204@105K, 22% baseline).

    This result is architecturally expected: the frozen random embedding provides
    a constant noise input that the model RSSM must route around, wasting representational
    capacity. The dt=2 imagination still uses the frozen embedding, receiving nonsensical
    dt conditioning.

    Contributes to 2×2 ablation matrix: {trained: CIVO risk} × {frozen: gradient starvation}
    × {absent: reward degradation} × {untrained-unexposed: value suppression}. Each
    intervention prevents CIVO through a different mechanism with different side effects.

    '
  tables: []
  figures_description:
  - Eval trajectory showing high volatility (80-238) with no convergence pattern,
    contrasted with 008d's directional collapse and 008a's zigzag recovery.
  analysis: 'Confirms trained dt_emb is necessary for CIVO. But frozen dt_emb is not
    a practical mitigation due to gradient starvation.

    Combined with 008f (absent dt_emb → reward degradation) and 008a (untrained but
    trainable → value suppression), the 2×2 matrix shows that ONLY training dt_emb
    on dt>1 data creates CIVO.

    '

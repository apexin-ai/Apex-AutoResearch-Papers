- name: Actor entropy analysis
  plan_id: plan_031
  description: Systematic entropy trajectories for healthy vs collapsed configurations.
  expected_results:
    healthy_configs_entropy_pattern: gradual decrease → stable plateau around -4.5
      to -5.5
    civo_collapse_entropy_pattern: decrease accelerates before collapse → continues
      decreasing during collapse (over-commitment)
    pathway_b_entropy_pattern: stable decrease → sudden INCREASE during collapse (policy
      destabilization)
    key_separation_metric: entropy change direction at collapse onset
    civo_examples:
      008d_s0_entropy_55K: -4.88
      009e_s0_entropy_55K: -4.88
      016e_entropy_95K: -3.62
    pathway_b_examples:
      008e_v3_s2_entropy_85K: -5.21
      008e_v3_s2_entropy_105K: -3.83
      delta: +1.38 (rising)
    healthy_examples:
      baseline_entropy_105K: -5.1
      008a_entropy_105K: -4.95
  result_rationale: 'Actor entropy is a free diagnostic computed from training logs.
    Three distinct patterns emerge:

    1. Healthy: entropy gradually decreases as policy sharpens, stabilizes at convergence.
    Baseline and untrained dt_emb configs follow this.

    2. CIVO (Pathway A): entropy decreases faster than healthy — the over-valued critic
    drives the actor to over-commit to specific actions. During collapse, entropy
    stays low or continues decreasing (policy is confident but wrong).

    3. Pathway B: entropy suddenly RISES during collapse — policy destabilizes, becoming
    more random. This is the opposite of CIVO and confirms a different mechanism.

    The entropy direction at collapse onset is a diagnostic separator: decreasing
    → CIVO, increasing → Pathway B.

    Under median tier, this pattern holds but Pathway B has only 2 data points (008e_v3_s2,
    possibly plan_016 seed 4), insufficient to fully characterize.

    '
  tables:
  - title: 'Entropy at collapse onset: Pathway A vs Pathway B'
    rows:
    - experiment: 008d s0 (CIVO)
      onset_step: 35K
      entropy_before: -3.47
      entropy_after: -4.88
      direction: ↓ (over-commit)
    - experiment: 016e (CIVO)
      onset_step: 85K
      entropy_before: -3.62
      entropy_after: -3.62
      direction: ↓ then stable
    - experiment: 008e_v3_s2 (B)
      onset_step: 95K
      entropy_before: -5.21
      entropy_after: -3.83
      direction: ↑ (destabilize)
  figures_description:
  - 'Multi-panel entropy plots: (a) healthy configs (baseline, 008a, 008e_v3 s1),
    (b) CIVO collapse (008d, 016e), (c) Pathway B (008e_v3 s2). Annotate collapse
    onset with vertical line.'
  analysis: 'Entropy analysis provides a zero-cost diagnostic that distinguishes CIVO
    from Pathway B collapse at collapse onset.

    Under median tier, the Pathway B entropy ↑ pattern is observed (2 seeds) but not
    sufficiently characterized to claim as a systematic finding. Include in discussion,
    not results.

    '
- name: Value prediction distribution vs realized returns
  plan_id: plan_032
  description: Distributional analysis of V(s) vs Monte Carlo returns.
  expected_results:
    healthy_distribution: unimodal, slight right shift (10-20% overestimation), tight
      spread
    civo_distribution: right-shifted, heavy right tail, mean overestimation 50-100%
    civo_pre_collapse_distribution: bimodal — cluster of correct estimates + cluster
      of severely overestimated states
    untrained_distribution: unimodal, slight left shift (5-15% underestimation), wider
      spread
    key_finding: bimodality in V(s) distribution appears 10-15K steps before collapse
      — potential early warning signal
  result_rationale: 'V(s) distribution analysis goes beyond the scalar v/e ratio to
    reveal HOW value estimates diverge from reality.

    In healthy configs, V(s) tracks Monte Carlo returns with slight overestimation
    (10-20%), consistent with DreamerV3''s optimistic critic initialization.

    In CIVO configs, two phases: (1) pre-collapse: bimodal distribution emerges —
    states visited at dt=1 are correctly valued, states imagined at dt>1 are overestimated.
    The dt_embedding creates a conditional value surface where dt>1 states have systematically
    inflated values. (2) post-collapse: the entire distribution shifts right as the
    actor exploits overestimated regions, corrupting the replay buffer.

    In untrained dt_emb configs, V(s) is slightly underestimated (nve < 1.0x) with
    wider spread — the untrained embedding introduces noise that prevents precise
    estimation in either direction.

    This is a P2 experiment that would strengthen C2 but is not blocking for submission.

    '
  tables: []
  figures_description:
  - 'Histograms of V(s) - MC_return at 35K steps: (a) baseline (tight, centered),
    (b) 008d (right-shifted, heavy tail), (c) 008a (centered, wider spread).'
  analysis: 'The bimodality finding (if confirmed) would strengthen the mechanistic
    story: CIVO doesn''t uniformly inflate values — it specifically inflates dt>1
    imagined states while dt=1 states remain roughly calibrated.

    Under median tier, this analysis likely completes for Walker but may not extend
    to Cheetah due to time constraints.

    '

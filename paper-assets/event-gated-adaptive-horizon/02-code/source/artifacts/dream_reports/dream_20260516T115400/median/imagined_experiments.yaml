    key_finding: CIVO mechanism present (nve>1.0x, degradation) but below 1.5x threshold
      in all seeds
  result_rationale: 'Under median tier, Cartpole shows nve 1.2-1.5x (borderline).
    The key mechanism is:

    Cartpole''s RSSM fidelity gap at dt>1 is SMALLER than locomotion tasks because:

    (a) Simpler dynamics (4-DOF pendulum) — RSSM predicts dt=2 transitions more accurately

    (b) Smooth observation space — less aliasing at coarser temporal resolution

    (c) Dense reward — reward prediction at dt=2 is less distorted

    Smaller fidelity gap → smaller conditioning-induced value overestimation → nve
    peaks in 1.22-1.42x range (below 1.5x diagnostic threshold). The trained dt_emb
    still creates SOME overestimation (all seeds > 1.0x), but insufficient to trigger
    the CIVO feedback loop.

    No collapse (0/3) because nve never sustains above the critical threshold where
    the positive feedback loop locks in. Performance is degraded (~15%) due to the
    dt=2 transitions in training data adding noise, but the degradation is mild and
    non-catastrophic.

    This is the core median tier finding for Cartpole: CIVO mechanism is PRESENT (nve
    > 1.0x, degradation beyond normal) but NOT DIAGNOSTIC (doesn''t exceed 1.5x).
    The 1.5x threshold is environment-specific, not universal.

    '

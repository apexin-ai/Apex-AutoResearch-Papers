      representations
  result_rationale: 'dt_embedding vectors are 8-dimensional (default dt_embed_dim=8).
    As training progresses, the embedding for dt=2 diverges from dt=1 because the
    model learns to predict different dynamics at different dt values.

    In collapsed configs, the embeddings diverge more (lower cosine similarity) because
    the CIVO feedback loop incentivizes the model to maintain strong dt-conditional
    differentiation. The critic learns to assign higher values to dt>1 imagined trajectories,
    and the dt_embedding encodes this distinction more sharply.

    In self-correcting seeds (009b), the embeddings partially re-converge during self-correction
    — as the value overestimation decreases, the gradient pressure to maintain sharp
    dt-distinction weakens.

    This is a P2 analysis that adds mechanistic depth but isn''t essential for submission.

    '

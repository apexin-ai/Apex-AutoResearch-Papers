- name: Uncertainty-gated imagination truncation pilot (Walker Walk, 1 seed)
  plan_id: plan_060
  description: Truncate imagination when RSSM prediction uncertainty exceeds threshold.
  expected_results:
    eval_105K: 580
    nve_105K: 0.95
    collapse: false
    vs_baseline: -37%
    truncation_frequency: ~30-40% of imagination steps truncated at dt=2
    effective_horizon: ~10.5 (vs H=15 nominal)
    mechanism: truncation prevents worst-case RSSM predictions from corrupting value
      estimates
    ambiguity: delays CIVO but unclear if prevents — truncation threshold sensitive
  result_rationale: 'Under median tier, uncertainty-gated truncation is ambiguous:
    it delays but doesn''t clearly prevent collapse, similar to 016e (SGS).

    The mechanism is sound in principle: truncate imagination when RSSM prediction
    becomes unreliable, preventing corrupted predictions from influencing critic updates.
    However:

    (a) Threshold calibration is environment-specific — too aggressive truncation
    reduces effective horizon (hurts performance), too lenient doesn''t prevent CIVO

    (b) The RSSM''s own uncertainty estimates may be miscalibrated, especially during
    the training period when CIVO develops

    (c) The truncation addresses the symptom (bad predictions in imagination) but
    not the root cause (trained dt_emb creating exploitable conditioning in the critic)

    Expected outcome: moderate performance (580@105K, 63% baseline), no collapse,
    but nve hovers near 1.0x — the truncation prevents pathological overestimation
    but at the cost of learning efficiency.

    Under median tier, this is reported as "promising but inconclusive pilot" in the
    discussion section. Not elevated to a core result.

    '
  tables: []
  figures_description:
  - 'Eval curve with truncation rate overlay: higher truncation correlates with lower
    eval, showing the performance-safety trade-off.'
  analysis: 'Ambiguous result under median tier. The truncation prevents collapse
    but degrades performance more than dt=1 imagination (which at least has 50% chance
    of no-collapse with near-baseline performance).

    Not included as a recommended mitigation. Mentioned as future work direction.

    '

  depends_on: []
- id: D011
  date: 2026-05-13 22:33 UTC
  summary: 修正 D010 pivot 方案：K=2 实现应用 Bernoulli straight-through 或 sigmoid relaxation，而非
    K=2 Gumbel-Softmax
  rationale: Reviewer 指出 K=2 Gumbel-Softmax 本质仍是 hard categorical gate（与 exp_003-005
    失败机制相同，只是方差更小），与 memory.md "不要再尝试 hard categorical gate" 矛盾。真正的 binary gate 应使用不同梯度估计器：(a)
    Bernoulli straight-through estimator（离散但梯度路径不同）或 (b) continuous sigmoid relaxation（连续化，彻底避免离散决策）。等
    exp_006/007 诊断结果出后，若走"gate 是问题"分支，优先尝试 Bernoulli ST，次选 sigmoid soft gate。
  related_experiments:

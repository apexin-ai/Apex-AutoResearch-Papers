- id: D013
  date: 2026-05-14 00:27 UTC
  summary: dt=4 失败根因定位：actor-critic credit assignment 崩塌，非 RSSM 预测能力不足
  rationale: Reviewer 独立分析 3-way metrics 发现：(1) exp_007 model_loss 与 baseline/dt=2
    相当（4.75 vs 4.12 vs 5.23@35K），排除 RSSM 预测能力瓶颈假说；(2) actor_loss@35K 从正常的 -0.577(baseline)/-0.331(dt=2)
    崩塌到 -0.015(dt=4)，actor 完全停止学习；(3) actor_entropy 从 -2.42@25K 跳到 +1.54@35K，策略退化为随机；(4)
    value_mean 仅 25.9（baseline 207.8 的 12.5%），critic 严重低估。因果链明确：dt=4 粗粒度 lambda-return
    → credit assignment 困难 → critic 崩 → actor 失去信号 → 策略崩溃。这个发现对论文有三重价值：(a) 否定了简单的"模型能力不足"解释，将问题精确定位在
    imagination-to-policy interface；(b) 为 dt∈{1,2} sweet spot 提供因果解释而非仅经验观察；(c) 强化
    Bernoulli ST gate (dt∈{1,2}) 的设计动机。
  related_experiments:
  - exp_id: exp_007_fixed_dt4
    role: primary
    result: actor_loss→0, entropy→random, value 12.5% baseline @35K, model_loss normal
  - exp_id: exp_006_fixed_dt2
    role: control
    result: actor_loss=-0.331, healthy training @35K
  - exp_id: exp_001_baseline
    role: control
    result: actor_loss=-0.577, reference @35K
  depends_on:
  - D012
  - D009
- id: D014
  date: 2026-05-14 00:45 UTC
  summary: exp_006 55K 跌至 58% baseline，诊断结论更新为"最优 dt 随训练阶段变化"；批准 exp_008 Bernoulli
    ST 立即启动
  rationale: exp_006 (fixed dt=2) 完整轨迹显示早期加速（15K-35K 超 baseline 67%）但后期衰退（55K 跌至 58%
    baseline），不符合原假设的场景 A（稳定）也非场景 B（全程有害）。Agent 提出场景 C：最优 dt 是训练阶段的函数——早期 dt=2 加速探索，后期需要细粒度控制。这比
    A/B 更强地论证了 learned adaptive gate 的必要性。但目前仅单 seed 数据，不能完全排除噪声/过拟合等替代解释。无论如何 Bernoulli
    ST (dt∈{1,2}) 是下一步必做实验：如果 gate 学会"早期多 skip 晚期少 skip"且 return ≥80% baseline，直接验证
    Scenario C + 达到 B 档 claim。cuda:1 空闲 >3h，立即批准 exp_008。
  related_experiments:
  - exp_id: exp_006_fixed_dt2
    role: evidence
    result: 早期+67% baseline, 55K跌至58%, 训练阶段依赖性
  - exp_id: exp_007_fixed_dt4
    role: evidence_negative
    result: 全程~30% baseline, 已关闭
  - exp_id: exp_008_bernoulli_st
    role: approved
    result: 待启动 cuda:1
  depends_on:
  - D013
  - D012
  - D011
- id: D015
  date: 2026-05-14 00:54 UTC
  summary: exp_006 65K 崩塌至 21.6% baseline，所有 dt>1 变体均失败；疑似 subsample curriculum 分布偏移是共同根因，设计无
    curriculum 对照实验
  rationale: exp_006 (fixed dt=2) 从 35K=485.3 崩至 65K=132.9 (21.6% baseline)，推翻了"fixed
    dt 没问题、问题在 gate"的诊断假设。Reviewer 指出关键洞察：崩塌窗口 35K-65K 与 subsample_variable_dt curriculum
    ramp (25K→75K) 精确重叠。即使 fixed_dt 模式，subsample 仍受 curriculum 控制——0-25K 训练数据纯 dt=1
    但 imagination 用 dt=2，25K-75K 分布剧变。这与 exp_002 的 Phase 1 mismatch 失败模式高度一致。所有 4
    个 dt>1 实验（exp_003-007）的崩塌都可能由同一根因解释：train/imagine 分布不匹配被 curriculum 延迟暴露。在排除 curriculum
    混淆因素前，讨论 gate 类型无意义。暂缓 Bernoulli ST (exp_008)，先做无 curriculum 对照：fixed dt=2 + subsample
    从头用 dt∈{1,2}（无 ramp）+ dt=2 imagination，消除分布偏移。
  related_experiments:
  - exp_id: exp_006_fixed_dt2
    role: evidence
    result: 65K=132.9 (21.6% baseline), collapsed
  - exp_id: exp_005_event_gated_v4
    role: pattern
    result: similar collapse window 55K-85K
  - exp_id: exp_002_event_gated
    role: pattern
    result: Phase 1 subsample mismatch, same root cause class
  depends_on:
  - D014
  - D013
- id: D016
  date: 2026-05-14 01:08 UTC
  summary: D015 curriculum 假设被代码审查推翻；exp_009 改为纯 dt=2 训练+想象（消除 train/imagine 分布偏移），并行分析
    exp_006 崩塌机制
  rationale: Agent 代码审查（commit 6159e46）确认：fixed_dt 模式下 curriculum 完全不生效，subsample
    从 step 0 就用 dt∈{1,2}（58.5%/41.5%），imagination 纯 dt=2。D015/Reviewer 的 curriculum-induced
    distribution shift 假设不成立。实际分布偏移是常量性的：训练 58.5% dt=1 + 41.5% dt=2，imagination 100%
    dt=2。exp_009 改为方案 A：subsample min_dt=2（纯 dt=2 训练），imagination dt=2，消除 train/imagine
    分布偏移。如果稳定→train/imagine 不匹配是根因→所有实验需要匹配训练分布；如果也崩→dt=2 imagination 在 DreamerV3
    中根本不可行。同时并行分析 exp_006 的 reward/value/policy/actor_loss 详细指标定位崩塌机制。
  related_experiments:
  - exp_id: exp_006_fixed_dt2
    role: evidence
    result: 65K=132.9, collapsed, curriculum NOT the cause
  - exp_id: exp_009_no_curriculum
    role: redesigned
    result: 改为纯 dt=2 train+imagine 对照
  depends_on:
  - D015
- id: D017
  date: 2026-05-14 01:12 UTC
  summary: Reviewer 代码审计证实 curriculum 在 fixed_dt 模式完全不执行；采用 2x2 析因隔离实验设计（exp_008a/008b）替代
    D016 方案，kill exp_006_fixed_dt2
  rationale: '代码 models.py:202-206 显示 gate_fixed_dt>0 时 gate_scale=0.0、effective_max_dt

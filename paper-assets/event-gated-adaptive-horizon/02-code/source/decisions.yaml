  rationale: 'Reviewer 审查 D047 framing 升级方案，6 条 warning 均有道理，逐条处理：


    (1) 015b claim 升级过早：015b 在 56K/105K，NVE 0.81→1.26→1.45 上升中但未突破 1.5x。009b 先例（NVE

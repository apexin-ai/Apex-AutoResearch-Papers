    持续上升 → 升级 C2 为"conditioning structure is root cause"；如果自修正 → 保持当前 claim 强度。


    (2) NVE baseline 敏感性：用 exp_001 (seed 1) v/e@55K=0.404 算 NVE=1.45x，用 009d (seed
    0) 插值 v/e@55K≈0.427 算 NVE=1.37x，6% 差异。在阈值附近有实质影响。决定：论文统一用多 seed baseline 均值作分母（009d

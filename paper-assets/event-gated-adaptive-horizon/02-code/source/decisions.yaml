    role: trigger
    result: negative - gate_loss explosion 2.84e8, return 37% baseline
  - exp_id: exp_003_event_gated_v2
    role: context
    result: negative - same bug class
  - exp_id: exp_002_event_gated
    role: context
    result: failed - same bug class
  depends_on:
  - D005
  - D006
- id: D009
  date: 2026-05-13 21:34 UTC
  summary: Hard Gumbel gate 结构性失败确认，启动 exp_006 fixed dt=2 诊断实验
  rationale: exp_003/004/005 三次实验均在 gate_scale>0.5 时发生 return 崩塌。exp_005 是首次在所有 bug
    修复 + gate_loss 正常(0.53) + gate 行为健康(entropy 1.54, dt_mean 2.44)条件下的崩塌，排除了实现 bug
    的可能。结论：hard Gumbel gate + variable-rate imagination 与 actor-critic 优化存在结构性冲突。exp_006
    fixed dt=2 是关键分叉诊断——如果 fixed dt=2 正常则问题在 learned gate 动态选择，如果也崩则问题在 variable-rate
    imagination 本身。
  related_experiments:
  - exp_id: exp_005_event_gated_v4
    role: evidence
    result: return 崩塌 276→25.7 at gate_scale 0.5→0.6
  - exp_id: exp_004_event_gated_v3
    role: evidence
    result: negative - 崩塌模式相同
  - exp_id: exp_003_event_gated_v2
    role: evidence
    result: negative - 崩塌模式相同
  - exp_id: exp_006_fixed_dt2
    role: diagnostic
    result: 已审批待启动
  depends_on: []
- id: D010
  date: 2026-05-13 21:49 UTC
  summary: Pivot 决策树调整：exp_006 正常分支下，K=2 binary hard gate 优先于 soft weighted gate
  rationale: Reviewer 指出两点：(1) A1 soft weighted gate 每步需 K 次 RSSM forward pass，K=8
    时 8 倍计算开销，与时间抽象节省计算的初衷矛盾；(2) 遗漏了最简诊断方案——K=2 binary hard gate (dt∈{1,2})，保持 hard
    gate 计算效率，仅缩小离散空间和梯度方差。这能区分"hard gate 本身有问题"还是"只是 K 太大"。工程量极低（改 gate_max_dt=2）。新决策树：exp_006
    正常 → 先试 K=2 binary hard gate → 若成功则增量扩 K → 若仍失败再考虑 soft 方案。
  related_experiments:

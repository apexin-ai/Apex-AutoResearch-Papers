    sensitivity) 一并执行。


    (3) AUROC=1.0 统计力度不足：n=6、post-hoc 排除、阈值从 1.5x 漂移到 2.0x。审稿人必攻点。决定：AUROC=1.0 降到
    supplementary。主文报告 "1.5x threshold at 35K+ achieves 4/4 separation"，明确标注 sample

  summary: 'D126: exp_035 中期(59.5%) NVE 2.75 → 2×2 结论修正：Min alone 不能阻止 CIVO，Min+Capacity
    协同预防。论文 framing 从 "Min=Prevention" 升级为 "Synergistic Prevention"。'
  rationale: 'exp_035 narrow dual-critic (1.05M params, min operation): NVE peaked
    at 2.75@85K, v1≈v2 (67.52 vs 67.53), CIVO 发生但正在恢复(eval 149@125K)。这填补了 2×2 最后一格：

    - Single+normal: CIVO→crash (baseline)

    - Single+scaled (exp_033): CIVO(4.75)→self-repair→408

    - Dual+normal (exp_035): CIVO(2.75)→recovering→149+

    - Dual+scaled (exp_032): CIVO prevented (NVE≤1.1)→670-788


    新解读：min 和 capacity 单独都不够，两者协同才能预防 CIVO。机制：capacity 提供足够函数表达力让两个 critic 有独立学习能力，min
    在此基础上约束 overestimation 正反馈环。参数不够时(exp_035) v1≈v2 完全重合，min 提供零有效 pessimism。


    这个 "synergistic prevention" 故事比原来的简单因果更有深度，对 ML 社区的方法设计启示更强。exp_035 仍在运行(59.5%)，但
    NVE 2.75 已确定性。'

decisions:
- id: D001
  date: 2026-05-13 01:05 UTC
  summary: MVP 方案：dreamerv3-torch + DMC Walker Walk 验证事件门控可行性
  rationale: 选择 NM512/dreamerv3-torch 作为代码基础（干净 RSSM 实现，方便修改），DMC Walker Walk 作为验证任务（DreamerV3
    标准基准，快速迭代）。MVP 只验证技术可行性（gate 不坍缩、训练收敛、有效跳步），不验证完整研究假设（长时域信用分配改善需要 ManiSkill3 等长时域任务，留到
    research 阶段）。Reviewer 主要担忧 impact(3/5) 源于评估任务时长不够长（250 步 StackPyramid 可能只显示中等收益），但这是
    research 阶段的问题，不影响 MVP 方案。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-13 01:09 UTC
  summary: 采纳 Reviewer 建议：量化 MVP criterion 4 + 补充 kill criteria
  rationale: Reviewer warning 两点均合理：(1) criterion 4 原为定性描述，改为 Δt 序列自相关 > 0.15 OR 标准差
    > 0.5，可判定；(2) 补充 kill criteria：MVP GPU 上限 15h，训练发散最多重试 2 次，gate 坍缩则尝试 soft attention
    mixture fallback，15h 耗尽未过则报告用户决定 kill/pivot。Info 项（entropy 阈值宽松、Walker Walk 缺相位结构、代码基础选择）均
    acknowledged，MVP 阶段不需要额外动作。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-13 04:09 UTC
  summary: 部署 subsample curriculum 补丁，重启 event-gated 实验 (exp_002→exp_003)
  rationale: Phase 1 (0-50K) 中 subsample_variable_dt 不应生效但生效了，导致 RSSM 训练数据与 imagination
    Δt=1 不匹配，event-gated return 仅 40% baseline。这是设计缺陷，不是超参问题。44K 步的污染权重不可恢复，需干净重跑。补丁让子采样跟随
    gate curriculum：Phase 1 纯 Δt=1，Phase 2 渐进增大，Phase 3 完整 log-uniform。损失 ~1.7h GPU
    时间（cuda:1），在 15 GPU·h MVP 预算内。
  related_experiments:
  - exp_id: exp_002_event_gated
    role: failed
    result: return 40% baseline due to Phase 1 subsample mismatch
  depends_on:
  - D002
- id: D004
  date: 2026-05-13 09:02 UTC
  summary: MVP 中期评估：3/4 标准已过（gate 有效），criterion 1 (return) 是风险点，设 150K/200K checkpoint
    评估 + pivot 方案
  rationale: 'Step 96K 数据：entropy=1.54>0.3, H_eff=35.7>18, dt_std=1.30>0.5，gate 机制功能验证通过。但
    return ratio=36.5%（需≥80%），Phase 2 进行 46K 步无恢复趋势。Reviewer 估计 criterion 1 通过概率 15-25%。Plan:
    Phase 3 稳定后（150K/200K）评估，ratio<50% 则 pivot 到 K=4 + 延长 curriculum。3/4 已过说明 gate
    机制本身有价值，return 问题可能是 K 太大或 ramp 太快的调参问题。'
  related_experiments:
  - exp_id: exp_003_event_gated_v2
    role: primary
    result: gate mechanism works (3/4 criteria pass) but return degrades to 36.5%
      baseline at step 96K
  depends_on:
  - D003
- id: D005
  date: 2026-05-13 10:03 UTC
  summary: Return 崩塌根因确认：imagination dt 无约束导致 OOD。修复方案 C（logits masking + clamp），从头重跑
    exp_004
  rationale: Agent 代码审查确认 _imagine 中 gate 自由输出 dt∈{1,...,8}，而 world model 训练数据受 subsample
    curriculum 限制（gate_scale=0.5 时仅见过 dt≤4）。未训练的 dt embedding → RSSM 噪声预测 → reward
    head 垃圾输出 → actor/critic progressive poisoning → return 从 37% 崩到 10%。修复方案 C：(1)
    Gate logits masking（dt > effective_max_dt 的 logits 设 -inf）做 soft constraint，(2)
    torch.clamp 做 hard safety net。不做 checkpoint 恢复（baseline RSSM 架构不含 dt_embedding），从头干净重跑。保持
    K=8 + 原 curriculum 参数，先验证 bug fix 是否足够恢复 return，若不够再 pivot K=4。
  related_experiments:
  - exp_id: exp_003_event_gated_v2
    role: failed
    result: return catastrophically collapsed to 10% at step 105K due to unconstrained
      imagination dt
  depends_on:
  - D004
- id: D006
  date: 2026-05-13 10:06 UTC
  summary: 追加修复：_compute_target dt 索引错位 2 位，与 imagination dt clipping 并行修复后重跑 exp_004
  rationale: Reviewer 发现 _compute_target 将 dts[1:] 传入 lambda_return_variable_dt，但
    dts[t] 是 gate 在 succ_t 处为下一步转移决定的 dt，不是当前步转移 dt。正确序列应为 [init_dt=1, dts[0], ...,
    dts[H-3]]，实际是 [dts[1], dts[2], ..., dts[H-1]]，每位偏移 2。Phase 1 全 dt=1 不受影响，Phase
    2+ dt 方差越大错误越严重——完美解释 gate_scale 与 return 的负相关。此 bug 比 imagination dt 无约束更致命：即使
    imagination dt 被 clip，λ-return 索引错误仍会污染 actor/critic 训练信号。两个 bug 必须同时修复。
  related_experiments:
  - exp_id: exp_003_event_gated_v2
    role: failed
    result: dt index misalignment in _compute_target caused progressive λ-return corruption
  depends_on:
  - D005
- id: D007
  date: 2026-05-13 11:49 UTC
  summary: 停止 Walker Walk baseline（已收敛），启动 Cheetah Run baseline 为多环境泛化铺路
  rationale: Reviewer 压力测试结论：单环境（Walker Walk）即使 MVP 全 PASS 也只够 workshop paper，A 类（CoRL
    DDL 5/29）需要 4-6 个 DMC 环境 + 多 seed + ablation。Walker Walk baseline 已在 ~920 eval_return
    稳定超过 100K 步，不需要继续跑到 500K。cuda:0 应立即用于铺 Cheetah Run baseline——无论 exp_004 成功（需要多环境验证泛化）还是失败（K=4
    pivot 也需要多环境），Cheetah baseline 都是必须的。同时 Cheetah Run 是 DreamerV3 标准基准之一，episode
    结构不同于 Walker Walk，能测试 gate 在不同运动模式下的行为。
  related_experiments:
  - exp_id: exp_001_baseline
    role: completed
    result: Walker Walk baseline converged at ~920 eval_return
  depends_on:
  - D004
- id: D008
  date: 2026-05-13 15:33 UTC
  summary: Kill exp_004：gate_loss 爆炸 bug（compute_gate_targets 用 gate_max_dt 而非 effective_max_dt），第三次
    train/imagine distribution mismatch，需全量审计后重启 exp_005
  rationale: Reviewer 发现 gate_loss 从 0 跳到 2.84e8（正常值 ~5），根因：compute_gate_targets 生成
    8-bin target 分布但 logits masking 只保留 effective_max_dt 个 bin，cross-entropy 在 masked
    bin 上产生 ~3e8 loss。eval_return@125K=352（baseline 37%）。这是第三次同类 bug（exp_002 subsample/exp_003
    imagination dt + λ-return/exp_004 gate target vs masking），需要对 gate_max_dt vs effective_max_dt
    做全量代码审计后再重启。
  related_experiments:

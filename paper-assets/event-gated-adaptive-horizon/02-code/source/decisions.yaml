  summary: 'D127: exp_035 完成(eval 697.8) — 2×2 双维度结论：Prevention 需 min+capacity 协同，Recovery
    中 min 是主导因素(697.8 vs capacity-only 408)。论文改为同时报告 Prevention + Recovery 两个维度。'
  rationale: 'exp_035 narrow dual-critic 最终 eval 697.8（在 exp_032 range 670-788 内），尽管经历了
    CIVO(NVE 2.75)。这推翻了"min alone 无效"的简化结论。完整 2×2：


    Recovery 排名：min+cap 670-788 ≈ min-only 697.8 >> cap-only 408 >> baseline collapsed

    → min 是 recovery 主导因素，capacity 是次要因素


    Prevention 排名：只有 min+cap (exp_032) 从未触发 CIVO

    → prevention 仍需协同


    Prevention 的优势不是最终性能（两者近似），而是训练效率（节省 ~40K steps CIVO 恢复期）。


    跨环境注意：Walker recovery 充分，但 Cheetah exp_034 仅恢复 31% → 环境越难，recovery 越不充分，prevention
    价值越大。论文需同时报告两个维度。'

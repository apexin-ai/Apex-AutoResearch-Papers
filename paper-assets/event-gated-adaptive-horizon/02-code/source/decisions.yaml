- id: D018
  date: 2026-05-14 01:22 UTC
  summary: exp_008b 替换为 exp_008c (dt=2, H=8)：隔离 compounding error 假说
  rationale: Reviewer 独立分析指出：崩塌速度与 dt 完美正相关（dt=4@35K, dt=2@65K, dt=1 不崩），根因可能是 imagination
    物理时间覆盖过长（H×dt）导致 compounding error，而非 train/imagine 分布不匹配。原 exp_008b（subsample
    ON + dt=1 imagine）诊断价值低——dt=1 imagination 安全是 trivially true。替换为 exp_008c（dt=2
    imagine + H=8，物理覆盖≈16步≈baseline 的 15 步）能直接区分"dt=2 本身有害"vs"物理覆盖过长有害"。若 008a 崩+008c
    不崩→compounding error 是根因，解法是 H∝1/dt；若都崩→dt=2 RSSM 预测质量本身不足。
  related_experiments:
  - exp_id: exp_008a

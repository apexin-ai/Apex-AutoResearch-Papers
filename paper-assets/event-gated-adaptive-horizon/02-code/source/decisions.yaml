- id: D012
  date: 2026-05-14 00:18 UTC
  summary: 三档 claim 结构确认 + 单 GPU 多实验并行策略 + exp_006 叙事修正
  rationale: Reviewer 深度分析修正了两个关键判断：(1) exp_006@45K 回到 93% baseline，"超基线 25%" 是 35K
    处 baseline 临时回调造成的假象，正确表述是"跟踪基线 ±10%"——仍是正向信号（证明 dt=2 不伤害训练），但 claim 不能说"超越"。(2)
    三档 claim 结构：A 档（仅诊断发现，workshop 级）、B 档（Bernoulli ST 成功=方法贡献，CoRL 可投）、C 档（learned
    gate > fixed dt=最强 CoRL 投稿）。当前距 B 档缺 Bernoulli ST 实验，距 C 档缺 Bernoulli ST + learned>fixed
    两步。Bernoulli ST 是最高优先级实验。另外 Reviewer 发现 GPU 仅占 4GB/96GB，单 GPU 可并行 3-4 个实验，吞吐量可提升
    3-4×，对赶 CoRL DDL 意义重大。所有实验当前 seed=1，CoRL 最低要求 3 seeds。
  related_experiments:
  - exp_id: exp_006_fixed_dt2
    role: evidence

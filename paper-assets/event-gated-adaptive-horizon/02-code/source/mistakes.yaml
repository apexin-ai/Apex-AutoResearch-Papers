- id: M018
  date: '2026-05-21'
  category: experiment_design
  severity: medium
  summary: Agent 错误将 exp_031b (PickCube σ=0.5) 标记为 success — NVE 后期下降是 floor effect
    不是 CIVO 恢复
  root_cause: Agent 将 NVE 后期回落（3.3→0.2）解读为"CIVO 被治愈"，未考虑 eval 全程 flat（peak 29.1）意味着
    agent 未学习，value signal 崩溃导致 NVE 机械性降低（floor effect）。与同环境 exp_031 (σ=0.2) 数据模式几乎相同但结论矛盾。
  prevention: NVE 下降的判断标准：必须同时检查 eval 是否在 NVE 恢复后有上升趋势。eval 持续 flat + NVE 下降 = floor
    effect（value signal 崩溃），不是 CIVO 恢复。区分 "genuine CIVO self-correction"（eval 回升）vs
    "floor effect"（eval 持续低迷）。
  status: active
  context: 'exp_031b PickCube σ=0.5: NVE peak 3.3@42.5K → 0.2 后期, eval 全程 2-29. Agent
    cron 分析 Worker 将此标为 success，Director 及时请 Reviewer 仲裁拦截。'
  fix: Registry 改回 negative, notes 添加 floor effect 说明。

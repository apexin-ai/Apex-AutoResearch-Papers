- id: M015
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: Full SGS "50% recovery" claim 与 NVE 分类标准矛盾：018v2_s1 NVE_peak=1.66>1.5×
    应为 CIVO positive，实际成功率 0/2 非 1/2
  root_cause: 对 "collapse" 和 "CIVO" 使用了不同标准：NVE ≥1.5× 是 CIVO 诊断标准（用于所有其他实验），但 full

- id: M016
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: TCN σ=0.5 @75K 快照误判为 "self-correction"，完整 105K 数据显示是振荡性 CIVO + value collapse
  root_cause: 从截断数据（75K/105K）做强解读性结论。NVE 从 1.68@55K 回落到 0.83@75K 被解读为 self-correction，但
    85K 出现第二次更严重的 spike（3.965）。Reviewer 此前已将 105K 截断标为 critical，但 Director 仍基于 75K
    数据做了过度乐观的叙事判断。
  prevention: 1) 在训练步数不足以覆盖完整 CIVO 窗口（210K）时，禁止对 NVE 轨迹做方向性结论（"self-correction" /
    "suppression"），只做描述性汇报；2) Reviewer 标 critical 的数据截断问题必须在叙事层面也被尊重——不能因为中期快照看起来好就提前定性
  status: active
  context: 'TCN σ=0.5 @75K: NVE 1.68→0.83 看似回落，但 85K 反弹到 3.965，95K 又跌到 0.675，105K
    回到 0.916。完整轨迹是 bistable oscillation，不是 self-correction。value_mean 从 157@75K 单调下降到

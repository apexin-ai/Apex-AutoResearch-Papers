    实际跑的是 seed=0，已被排除。当前 cuda:0 上 PID 628482 正在浪费 GPU 时间跑一个完全重复的实验。'
  fix: 1. Kill PID 628482 释放 cuda:0。2. 诊断 dreamer.py seed 处理逻辑（tools.args_type）。3.

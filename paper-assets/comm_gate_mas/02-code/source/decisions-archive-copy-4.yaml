- id: D011
  date: 2026-04-20 01:12 UTC
  summary: 发现 capability×topology crossover interaction：selector 削弱强模型分化（Qwen R² 0.45→0.065）但增强弱模型（Llama
    0.02→0.056）
  rationale: Qwen SEL R²=0.065（vs RR/SEQ 0.45，降 7 倍），Llama SEL R²=0.056（vs RR/SEQ
    0.02，升 3 倍）。方向完全相反。强模型在 fixed-turn 下自然功能分化，selector 破坏结构；弱模型在 fixed-turn 下均质通信，selector
    激活功能类型。这是 crossover interaction，不是单向效应。对 MAS 设计有直接指导意义：最优拓扑取决于模型能力水平。
  related_experiments: []
  depends_on:
  - D010

    H≈14）
  rationale: Llama SEL 所有指标大幅提升（H 5倍，R² 3倍，κ 0.46→0.63）。功能分布从 ack 主导变为多功能均衡。RR≈SEQ
    但 SEL 显著不同。强模型（Qwen）RR≈SEQ 指标稳定，等 SEL 确认是否同样不变。论文增加 capability×topology 交互效应维度。
  related_experiments: []

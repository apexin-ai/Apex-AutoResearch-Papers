  rationale: 两次分析用了不同 config（full-scale vs mvp.yaml），指向不同 annotation 文件和分类体系。κ=0.669
    对应当前 5 类 taxonomy，PASS。Reviewer 指出 crossover 在 κ 维度不成立（Qwen κ 三拓扑稳定 0.64-0.669），论文

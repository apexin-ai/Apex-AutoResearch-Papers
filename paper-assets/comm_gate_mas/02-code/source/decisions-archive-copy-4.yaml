- id: D006
  date: 2026-04-19 21:40 UTC
  summary: information_provision 类别暂不合并，等 2-3 组 annotation 结果后统一决策
  rationale: Reviewer 分析：info_provision κ=0.037 但 impact 均值差 0.058 (Cohen's d=0.39)。合并会丢失信号但提升标注可靠性。等
    Llama RR、Qwen SEQ、Llama SEQ annotation 完成后看跨组合一致性：κ 跨组合<0.2 则合并为 4 类，否则保留 5 类。deadline
    在全部 annotation 完成后立即决策。
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-04-19 21:57 UTC
  summary: 论文框架从 universal function-impact mapping 转向 capability-dependent communication
    differentiation
  rationale: Llama RR R²=0.02 vs Qwen RR R²=0.45，功能类型对行为影响的差异化程度高度依赖 backbone。原 claim
    "不同功能类型普遍有不同影响" 不成立。新框架：通信功能分化程度受 backbone 能力调节，这本身是有价值的发现。等 SEQ 结果确认后最终定型。
  related_experiments: []
  depends_on:
  - D005
- id: D008
  date: 2026-04-19 22:20 UTC
  summary: 取消 Llama 8192 重跑，复用旧 traces。根因是答案提取 bug 非截断，旧数据有效
  rationale: Llama 0/296 消息被截断。准确率低是 extract_final_answer() 只看最后消息导致。修复后 SEQ 71.6%/SEL
    56.2%。impact/annotation 不依赖准确率，数据有效。R²=0.02 是真实结果，支持 capability-dependent story。节省
    8h。
  related_experiments: []
  depends_on:
  - D007
- id: D009
  date: 2026-04-19 22:32 UTC
  summary: 论文框架从 capability-dependent 修正为 architecture-dependent：通信分化独立于任务准确率
  rationale: Llama 准确率 74.8%（合理）但 R²=0.02。Qwen 90% R²=0.45。通信功能分化差异不能用解题能力解释（75% vs
    90% 差距不足以解释 R² 差 20 倍）。核心洞察：communication quality ≠ task performance。框架应为 backbone/architecture-dependent
    functional specialization。
  related_experiments: []
  depends_on:
  - D007
  - D008
- id: D010
  date: 2026-04-20 00:31 UTC

decisions:
- id: D001
  date: 2026-04-19 14:00 UTC
  summary: 'MVP v4: LDIM降为探索性指标，加neutralize条件，CAMEL改为AG2内部topology对比'
  rationale: Reviewer R2 指出：(1) LDIM first-token logit 在 CoT 任务中不可靠（reasoning scaffold
    不改第一 token 但改推理路径），不应作为 contribution claim；(2) CAMEL dyadic vs multi-party 可比性问题大于
    coverage 收益，AG2 内部 topology 对比控制更多变量；(3) remove vs neutralize 对比能区分 information
    value vs structural value，是有价值的 methodological insight。用户 7 项建议中采纳 1/4/5，有条件采纳
    6/7，谨慎对待 2/3。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-04-19 18:11 UTC
  summary: MVP PASS (4/4)，进入全量研究阶段。Taxonomy 从 8→7 类，需全量前重新设计为 5-7 类预定义方案
  rationale: 核心信号存在：功能类型 × action change χ²=175.2 (p<0.001)，跨模型 κ=0.60（合并 7 类）。Remove
    ablation 有三级变异。Reviewer 确认 4/4 PASS 但指出 taxonomy 退化（实质 2 类占 97%）、Neutralize 无区分力、小
    n 膨胀 χ² 三个方法学问题需全量前修复。Neutralize 降级为辅助分析，taxonomy 需预定义更清晰的 5-7 类。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-04-19 18:16 UTC
  summary: MVP χ² PASS 为 artifact（message_index=0 dummy 数据），需修复后重新验证。改用 semantic_similarity
    连续变量作为核心 impact 指标
  rationale: Reviewer T4 深度审查发现：local_impact.py 对 msg_idx=0 返回硬编码 surface_only，100
    条 dummy 数据的不均匀分布驱动了 χ²=175.2 的虚假显著性。排除 dummy 后真实数据中所有消息可能都是 action_changed=True（greedy
    decoding 特性），action_level 离散分类失去区分力。改用 semantic_similarity 连续变量 + Kruskal-Wallis
    检验作为核心指标。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-04-19 18:41 UTC
  summary: F0 revalidation confirms MVP PASS (5/5)。Kruskal-Wallis 为主检验，LDIM 废弃，χ²
    action_level 降为辅助
  rationale: 排除 msg_idx=0 dummy 后重跑：Kruskal-Wallis H=11.38 p=0.0007（semantic_similarity~function_type），χ²
    p=0.001 rate_diff=10.48pp（刚过线），McNemar-Bowker p=0.0006。LDIM κ从0.4354暴跌至0.0112（之前全由dummy贡献），不可用。论文以Kruskal-Wallis为主检验更稳健。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-04-19 18:49 UTC
  summary: 全量实验策略：3模型同时serve + 按backbone串行跑3 topology，MetaGPT+HumanEval跨域验证
  rationale: 90h GPU总量，4GPU并行约23h wall clock。3模型各占1GPU（~18GB），第4GPU备用。先跑AG2 9组合（核心证据链），MetaGPT排后。HumanEval跨域+GSM8K数学
    = taxonomy通用性论证更强。Phase 4-5降级为supplementary。
  related_experiments: []
  depends_on:

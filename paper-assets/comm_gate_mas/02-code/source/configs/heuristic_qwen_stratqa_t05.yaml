# Qwen StratQA heuristic pruning — temperature 0.5, 5-seed
# Run with: --mode online_pruning --detection-mode heuristic --char-threshold 150 --data-seed {42,123,456,789,1024}
model:
  name: "Qwen2.5-7B-Instruct"
  api_base: "http://localhost:8000/v1"
  api_key: "[REDACTED]"
  temperature: 0.5
  top_p: 1.0
  max_tokens: 2048

agents:
  solver:
    name: "ReasoningSolver"
    system_message: |
      You are a commonsense reasoning solver. Answer the given yes/no question step by step.
      Break down the question into sub-questions, reason through each one, then combine.
      State your final answer as: The answer is yes. OR The answer is no.
  checker:
    name: "AnswerChecker"
    system_message: |
      You are a reasoning checker. Review the solver's step-by-step reasoning carefully.
      Check if each sub-question is answered correctly. Verify the logical chain.
      If you agree, confirm the answer. If you disagree, explain why and provide the correct answer.
      State your final answer as: The answer is yes. OR The answer is no.

data:
  source: "strategyqa"
  num_tasks: 200
  seed: 42

trace_collection:
  topology: "round_robin"
  max_rounds: 6

output:
  trace_dir: "outputs/heuristic_qwen_stratqa_t05/traces"
  analysis_dir: "outputs/heuristic_qwen_stratqa_t05"

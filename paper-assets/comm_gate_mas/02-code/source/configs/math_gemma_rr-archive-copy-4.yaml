# MATH dataset: Gemma × round_robin
# Annotation model_b: Qwen@8000

model:
  name: "google/gemma-2-9b-it"
  api_base: "http://localhost:8002/v1"
  api_key: "[REDACTED]"
  temperature: 0
  top_p: 1.0
  max_tokens: 2048

agents:
  solver:
    name: "MathSolver"
    system_message: |
      You are a mathematical problem solver. Solve the given math problem step by step.
      Show your work clearly. Put your final answer in \boxed{}.
  checker:
    name: "AnswerChecker"
    system_message: |
      You are a math answer checker. Review the solver's solution carefully.
      Check each step for correctness. If correct, confirm. If incorrect, show the correct solution.
      Put your final answer in \boxed{}.

data:
  source: "math"
  dataset_path: "/root/autodl-tmp/comm_gate_mas/data/math_50.jsonl"
  num_tasks: 50
  seed: 42

trace_collection:
  topology: "round_robin"
  max_rounds: 6

local_impact:
  embedding_model: "/root/autodl-tmp/.hf_cache/sentence-transformers/all-MiniLM-L6-v2"
  logprobs_top_k: 20
  ldim_max_tokens: 5
  neutralize_text:
    solver: "Let me think about this problem."
    checker: "I'll review the solution."
    default: "Acknowledged."

annotation:
  model_b:
    name: "Qwen2.5-7B-Instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "[REDACTED]"
  function_types:
    - information_provision
    - reasoning_guidance
    - verification
    - coordination
    - acknowledgment

correctness:
  categories:
    - correct
    - partially_correct
    - incorrect
    - not_applicable

output:
  trace_dir: "outputs/math/gemma_round_robin/traces"
  impact_dir: "outputs/math/gemma_round_robin/local_impact"
  annotation_dir: "outputs/math/gemma_round_robin/annotations"
  correctness_dir: "outputs/math/gemma_round_robin/correctness"
  figure_dir: "outputs/math/gemma_round_robin/figures"
  analysis_dir: "outputs/math/gemma_round_robin/analysis"

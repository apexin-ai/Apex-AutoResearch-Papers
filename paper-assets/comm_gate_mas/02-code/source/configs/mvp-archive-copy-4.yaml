model:
  name: "Qwen2.5-7B-Instruct"
  api_base: "http://localhost:8000/v1"
  api_key: "[REDACTED]"
  temperature: 0
  top_p: 1.0
  max_tokens: 2048

model_b:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  api_base: "http://localhost:8001/v1"
  api_key: "[REDACTED]"

agents:
  solver:
    name: "MathSolver"
    system_message: |
      You are a mathematical problem solver. Solve the given math problem step by step.
      Show your work clearly and provide the final numerical answer on the last line
      in the format: "The answer is [NUMBER]."
  checker:
    name: "AnswerChecker"
    system_message: |
      You are a math answer checker. Review the solver's solution carefully.
      Check each calculation step for correctness.
      If correct, confirm the answer. If incorrect, show the correct solution.
      End with: "The answer is [NUMBER]."

data:
  source: "gsm8k"
  split: "test"
  num_tasks: 100
  seed: 42

trace_collection:
  max_rounds: 6

local_impact:
  embedding_model: "/root/autodl-tmp/.hf_cache/sentence-transformers/all-MiniLM-L6-v2"
  logprobs_top_k: 20
  ldim_max_tokens: 5
  neutralize_text:
    solver: "Let me think about this problem."
    checker: "I'll review the solution."
    default: "Acknowledged."

annotation:
  function_types:
    - information_provision
    - reasoning_guidance
    - verification
    - coordination
    - acknowledgment

correctness:
  categories:
    - correct
    - partially_correct
    - incorrect
    - not_applicable

output:
  trace_dir: "outputs/traces"
  impact_dir: "outputs/local_impact"
  annotation_dir: "outputs/annotations"
  correctness_dir: "outputs/correctness"
  figure_dir: "outputs/figures"
  analysis_dir: "outputs"

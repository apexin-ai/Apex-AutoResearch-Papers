- id: C9
  section: introduction
  text: 91% high disruption for acks vs 19% for reasoning guidance
  tier: 1
  evidence:
  - exp_id: d049_me_pos2_seqsel
    metrics:
    - pct_high_disruption_ack
    - pct_high_disruption_reasoning_guidance
    verified: true
    note: 'Script: src/local_impact.py (remove-ablation on Qwen/GSM8K/RR traces).
      Input: server:/root/autodl-tmp/comm_gate_mas/traces/qwen_rr_*.jsonl (n=895 messages).
      Output: per-message similarity scores aggregated by function type. 91% = fraction
      of ack messages with similarity < 0.5 (high disruption); 19% = same threshold
      for reasoning_guidance messages.'
- id: C10
  section: results
  text: 'Mixed-effects models (N=2,294) reveal three profiles: function-organized
    (Qwen), position-organized (Gemma; κ=0.35), undifferentiated (Llama)'
  tier: 1
  evidence:
  - exp_id: d049_me_pos2_seqsel
    metrics:
    - qwen_rr.r2m
    - gemma_rr.r2m
    - llama_rr.r2m
    values:
      qwen_rr_r2m: 0.335
      gemma_rr_r2m: 0.341
      llama_rr_r2m: 0.023
    verified: true
    note: Per-topology R²_m values confirm typology; Gemma κ=0.35 from annotation
      analysis
- id: C11
  section: results
  text: Backbone × function_type interaction p < 10^-41, stable across topologies
    (three-way p=0.963)
  tier: 1
  evidence:
  - exp_id: d049_me_pos2_seqsel
    metrics:
    - function_backbone_interaction_p
    - three_way_interaction_p
    - eta_sq_function_backbone
    - pooled_anova_F
    values:
      function_backbone_interaction_p: 1.0e-41
      three_way_interaction_p: 0.963
      eta_sq_function_backbone: 0.063
      pooled_anova_F: 67.1
      pooled_N: 8065
      pooled_R2: 0.298
    verified: true
    note: 'Script: src/d051_unified_me_lrt.py (pooled ANOVA across 9 backbone×topology
      cells). Input: remove-ablation similarity scores from all 9 configurations (3
      backbones × 3 topologies). Output: ANOVA table with η², F-statistics, LRT for
      2-way and 3-way interactions. Three-way p=0.963 confirms topology does not modulate
      the backbone×function interaction.'
- id: C12
  section: discussion
  text: Human inter-rater κ=0.76 (N=225, same 5-class protocol)
  tier: 1
  evidence:
  - exp_id: human_annotation_study
    metrics:

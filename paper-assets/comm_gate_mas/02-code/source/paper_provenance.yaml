    - mean_delta_pp
    - sd_delta_pp
    - ci_95_low
    - ci_95_high
    - seeds_positive
    - tost_p_delta_neg3
    - n_tasks_total
    values:
      mean_delta_pp: 2.08
      sd_delta_pp: 2.4
      ci_95_low: 0.36
      ci_95_high: 3.79
      seeds_positive: 9
      tost_p_delta_neg3: 4.5e-05
      n_tasks_total: 1939
    verified: true

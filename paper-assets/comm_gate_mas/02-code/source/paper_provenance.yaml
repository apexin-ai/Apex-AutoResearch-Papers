claims:
- id: C1
  section: results
  text: 'Ten-seed Qwen oracle: Δ=+0.40±1.02pp (95% CI [-0.33,+1.13]pp; TOST p=0.048
    at ±1pp; 56.0% suppression)'
  tier: 1
  evidence:
  - exp_id: qwen_10run_oracle_gsm8k
    metrics:
    - mean_delta_pp
    - sd_delta_pp
    - ci_95_lower
    - ci_95_upper
    - tost_1pp_p
    - mean_suppression_rate
    - n_seeds
    - tasks_per_seed
    values:
      mean_delta_pp: 0.4
      sd_delta_pp: 1.02
      ci_95_lower: -0.33
      ci_95_upper: 1.13
      tost_1pp_p: 0.04817
      mean_suppression_rate: 56
      n_seeds: 10
      tasks_per_seed: 200
    verified: true
- id: C2
  section: results

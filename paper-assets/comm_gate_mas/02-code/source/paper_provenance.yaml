    - N_tasks
    - ack_category_kappa
    values:
      cohens_kappa: 0.76
      N_tasks: 225
      ack_category_kappa: 0.81
    verified: true
- id: C13
  section: methodology
  text: Cross-model κ=0.721 (substantial agreement) for ack/non-ack binary
  tier: 1
  evidence:
  - exp_id: d049_me_pos2_seqsel
    metrics:
    - cross_model_binary_kappa
    values:
      cross_model_binary_kappa: 0.721
    verified: true
    note: 'Script: src/cross_domain_analysis.py::compute_cross_model_kappa() + src/analysis.py::analysis_cross_model_kappa().
      Input: GPT-4o 5-class annotations for 3 backbones (server:/root/autodl-tmp/comm_gate_mas/annotations/).
      Output: Cohen κ computed on binarized labels (ack vs non-ack) across all backbone
      pairs. 0.721 = weighted mean of per-backbone-pair binary κ values.'

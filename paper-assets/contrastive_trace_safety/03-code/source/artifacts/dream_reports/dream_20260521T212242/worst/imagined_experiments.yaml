- name: Cross-model transfer probes
  plan_id: exp-003
  description: 'Train probe on one model, test on another. PCA projection for cross-architecture
    transfer (4096→5120 or vice versa). Tests whether safety commitment encoding is
    universal.

    '
  expected_results:
    r1_8b_to_r1_32b_acc: 0.522
    r1_8b_to_qwq_acc: 0.595
    r1_32b_to_qwq_acc: 0.673
    qwq_to_r1_32b_acc: 0.673
    r1_32b_to_r1_8b_acc: 0.583
    best_transfer_overall: 0.673
    chance_baseline: 0.5
    all_transfers_below_within_model: true
    within_family_32b_weak_transfer: 0.673
    cross_family_at_chance: true
  result_rationale: 'Cross-model transfer fails completely — the best transfer accuracy
    (67.3% Qwen-family 32B internal) is far below within-model performance and barely
    above the majority-class baseline. Cross-family transfer (Llama↔Qwen) is at chance.
    Worst-tier reviewers use this as evidence against the paper: "Safety encoding
    is model-specific. This means every new model needs its own probe training with
    labeled commitment points — a supervision cost the paper downplays. If safety
    commitment were a universal phenomenon, SOME geometric structure should transfer.
    The complete failure suggests the probes are learning model-specific artifacts,
    not a generalizable safety signal." This finding is consistent with the selectivity
    control task (7.5-18.5pp) but reviewers argue selectivity merely shows the probes
    aren''t random — not that they detect genuine safety commitment vs idiosyncratic
    model behavior.

    '

- name: TrajGuard-style Mahalanobis baseline (all 4 models)
  plan_id: exp-005
  description: 'Mahalanobis distance on safe-trace covariance across all 4 models.
    Tests whether geometric distance-based methods (TrajGuard-style) can detect safety
    commitment.

    '
  expected_results:
    r1_8b_separation: 0.07
    ot_7b_separation: 0.03
    r1_32b_separation: 0.15
    qwq_32b_separation: 0.2
    max_separation_any_model: 0.2
    all_models_fail: true
    false_alarm_exceeds_tp_all_thresholds: true
    signal_location: minor PCA components, not principal directions
    r1_8b_safe_md: 6.66
    r1_8b_post_md: 6.73
    r1_32b_safe_md: 6.73
    r1_32b_post_md: 6.88
    qwq_32b_safe_md: 3.22
    qwq_32b_post_md: 3.42
  result_rationale: 'Mahalanobis distance fails on all 4 models (max separation 0.20
    on QwQ, FA rate ≥ TP rate at every threshold). The signal lives in minor PCA components,
    not principal variance directions — Mahalanobis, which weights by inverse covariance,
    is structurally blind to this geometry. Worst-tier reviewers have mixed reactions:
    (1) "Mahalanobis failing is expected — Bolukbasi et al. 2016 and subsequent work
    showed safety-relevant features are often orthogonal to principal variance. This
    negative result is predictable, not informative." (2) "You tested one geometric
    baseline. What about k-NN distance, local outlier factor, or isolation forests?
    The negative result space is underexplored." The finding supports the "existing
    methods fail" claim but reviewers rate it as incremental — failure of one known-limited
    baseline is not a contribution.

    '

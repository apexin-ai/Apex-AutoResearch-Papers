- name: 5-fold CV validation of multi-metric ensemble (7-8B)
  plan_id: ensemble_cv_7b
  description: 'Cross-validated ensemble of metric-weighted layer selections on R1-8B
    and OT-7B. Validates that multi-metric ensemble eliminates layer selection bias
    under proper CV.

    '
  expected_results:
    r1_8b_ensemble_cv_prec: 0.565
    r1_8b_best_single_cv_prec: 0.604
    r1_8b_ensemble_vs_text_gap: +19.3pp
    r1_8b_ensemble_vs_text_p: <0.002
    ot_7b_ensemble_cv_prec: 0.506
    ot_7b_best_single_cv_prec: 0.473
    ot_7b_ensemble_beats_best_single: true
    ot_7b_ensemble_beats_best_single_p: 0.033
    cv_validates_preliminary: true
    cv_acceptance_probability_delta: +0.01 to +0.03
  result_rationale: 'CV validation confirms the ensemble result holds (p≤0.002 for
    ensemble vs text on R1-8B). But worst-tier reviewers are unmoved: (1) "CV validating
    an ensemble of layer selection metrics on 7-8B models doesn''t address ANY of
    our core concerns. The issues are: high safe FPR (39-62%), model-specific caveats
    at 32B, engineering cost of white-box access, and insufficient novelty. A statistically
    cleaner layer selection protocol is nice but tangential." (2) "The ensemble precision
    (0.506-0.565) is actually LOWER than the best single metric on R1-8B (0.604).
    On OT-7B the ensemble slightly beats the best single metric (0.506 vs 0.473) but
    the absolute precision is 50% — a coin flip." (3) "This experiment strengthens
    an already- strong statistical case (12/12 HB already passes). The paper doesn''t
    need MORE statistical validation; it needs BETTER results or a DIFFERENT framing."
    The CV ensemble moves acceptance probability by +1-3%, insufficient to shift from
    worst tier.

    '

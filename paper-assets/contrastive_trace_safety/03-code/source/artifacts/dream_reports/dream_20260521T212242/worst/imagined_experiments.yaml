- name: Lead time analysis across models
  plan_id: exp-004
  description: 'Evaluate HS probe lead time distributions on all 4 models. Compare
    HS vs text lead times. Lead time = steps between first detection and commitment
    point.

    '
  expected_results:
    r1_8b_hs_lead_mean: -0.1
    r1_8b_hs_lead_note: HS detects AT commitment, not before
    r1_8b_text_lead_mean: 10.3
    r1_8b_text_lead_inflated: high text lead is artifact of high pre-CP FPR (trigger-happy)
    ot_7b_hs_lead_mean: 21.6
    ot_7b_text_lead_mean: 45.5

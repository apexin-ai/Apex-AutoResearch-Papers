    hidden-state monitoring — why bother with white-box access?" (3) R1-32B has excellent
    HS lead (+13 steps) but only 25% coverage — meaning 15/20 traces are undetected.
    Reviewer: "a detector that works on 5 traces is an anecdote, not a system." (4)
    OT-7B lead times are inflated by long traces. Overall: 2/4 models have HS lead
    ≤ 0, 1/4 has only 25% coverage, and 1/4 has inflated absolute values. No model
    presents a clean HS lead time story.


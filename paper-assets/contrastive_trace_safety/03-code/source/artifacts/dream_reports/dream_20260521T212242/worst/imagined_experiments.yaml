    thresholding. Worst-tier reviewer: "The paper tests two change-point algorithms
    that were designed for very different signal types, finds they don''t work, and
    claims this as a negative result. But the method selection is so narrow that the
    negative result is uninformative — you tested the wrong tools."

    '

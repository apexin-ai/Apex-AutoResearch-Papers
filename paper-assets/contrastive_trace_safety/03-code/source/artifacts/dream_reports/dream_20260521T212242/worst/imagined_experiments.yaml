    gru_r1_8b_lead: +4.5 ± 3.0
    gru_r1_8b_worst_seed: '+0.9'
  result_rationale: 'Lead time results are a mixed bag that worst-tier reviewers weaponize:
    (1) R1-8B HS lead is effectively zero — HS detects AT commitment, not before.
    Only GRU achieves modest positive lead (+4.5, worst seed +0.9). Text lead of +10.3
    is misleadingly high (artifact of trigger-happy detection with 20.5% pre-CP FPR).
    (2) QwQ-32B: HS lead time is NEGATIVE (-1.2 to +1.9 steps) while text detects
    3.7-12.3 steps earlier. Position baseline (bal_acc=0.746) beats HS (bal_acc=0.740).

- name: Bootstrap confidence intervals + threshold-independent metrics
  plan_id: exp-006
  description: '10000 bootstrap resamples on all key metrics across 4 models. Holm-Bonferroni
    correction. AUROC, precision-recall curves, detection delay CDF.

    '
  expected_results:
    holm_bonferroni_pass: 12/12
    r1_8b_precision_delta: +22.4pp
    r1_8b_precision_p: <0.001
    ot_7b_precision_delta: +21.9pp
    ot_7b_precision_p: <0.001
    qwq_32b_precision_delta: +23.6pp
    qwq_32b_precision_p: <0.001
    qwq_32b_fpr_p: 0.004
    r1_32b_precision_delta: +15.4pp
    r1_32b_precision_p: <0.001
    r1_32b_fpr_p: 0.007
    r1_32b_fpr_marginal_note: p=0.007 passes HB threshold 0.025 but barely
    marginal_tests_count: 2
    all_precision_deltas_positive: true
    precision_range: +15.4 to +23.6pp
    r1_32b_ci_width_ba: ~0.15
    qwq_32b_ci_width_ba: ~0.12
    r1_8b_ci_width_ba: ~0.06
  result_rationale: 'All 12/12 tests pass Holm-Bonferroni, which is statistically
    clean. But worst-tier reviewers attack the PRACTICAL significance, not the statistical
    significance: (1) "Of course 12/12 pass — you selected the best layer AND the
    best window per model, then tested. The researcher degrees of freedom (4 models
    × 64 layers × 7 windows × 5 metrics) dwarf the 12 tests corrected for." (2) "The
    CIs for 32B models are extremely wide (±0.15 for R1-32B bal_acc). Statistical
    significance with n=20 means the effect is large, but the PRECISION of the estimate
    is poor. You know HS is better somewhere between +3pp and +34pp — that''s not
    actionable." (3) "R1-32B FPR p=0.007 and QwQ FPR p=0.004 are the most marginal
    passing tests. A 10001st bootstrap replicate could flip either." (4) "Holm-Bonferroni
    corrects for 12 tests, but the true multiplicity (including layer/window selection)
    is orders of magnitude larger."


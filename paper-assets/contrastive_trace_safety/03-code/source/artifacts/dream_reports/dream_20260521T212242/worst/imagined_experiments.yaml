- name: Window size ablation (W=1,3,5,10,15,20,25 on all models)
  plan_id: exp-007
  description: 'Systematic window size sweep on all 4 models. Characterize precision-coverage
    tradeoff and identify optimal W per model.

    '
  expected_results:
    coverage_decreases_with_w_all_models: true
    precision_increases_with_w_all_models: true
    fpr_decreases_with_w_all_models: true
    r1_8b_best_bal_acc_w: 25
    r1_8b_w25_precision: 0.822
    r1_8b_w25_coverage: 0.488
    r1_8b_w25_fpr_step: 0.048
    r1_32b_best_bal_acc_w: 10
    r1_32b_w10_precision: 0.609
    r1_32b_w10_coverage: 0.7
    r1_32b_w10_fpr_step: 0.234
    qwq_32b_best_bal_acc_w: 25
    qwq_32b_w25_precision: 0.618
    qwq_32b_w25_coverage: 0.579
    qwq_32b_w25_fpr_step: 0.169
    ot_7b_hs_peaks_w3: true
    ot_7b_w3_bal_acc: 0.688
    ot_7b_w25_bal_acc: 0.659
    tradeoff_universal: larger W → higher precision, lower coverage, lower FPR
  result_rationale: 'Window ablation reveals a clean precision-sensitivity tradeoff
    that holds across all models. Worst-tier reviewers dismiss this: (1) "The coverage-decreasing-with-W
    finding is trivially expected — requiring K=5 consecutive crossings with a larger
    window means fewer traces reach the threshold. This is a property of the detection
    criterion K, not an insight about temporal probing." (2) "The optimal W varies
    by model (W=3 for OT-7B, W=10 for R1-32B, W=25 for QwQ and R1-8B). This means
    W is another model-specific hyperparameter to tune — combined with layer selection,
    you need per-model layer AND window tuning. The ''systematic evaluation'' framing
    hides the fact that this is just exhaustive grid search." (3) "At the best W per
    model, coverage ranges from 49% (R1-8B) to 70% (R1-32B). Missing 30-50% of safety
    commitment events is not deployment-ready."


  figures_description:
  - 'Heatmap: 5 metrics × 4 models → selected layer depth (%). Clear shallow-bias
    pattern for crossing_rate metric on 32B. Threshold-dependent metrics converge
    on deep layers.'
  analysis: 'Layer selection sensitivity is the paper''s primary methodological contribution,
    but worst-tier reviewers rate it insufficient novelty (2.0-2.5). The argument:
    "every ML practitioner knows different metrics select different hyperparameters.
    Showing this for layer selection is an observation, not a method. There''s no
    proposed algorithm to automatically resolve the disagreement — just ''try more
    metrics,'' which is standard practice."


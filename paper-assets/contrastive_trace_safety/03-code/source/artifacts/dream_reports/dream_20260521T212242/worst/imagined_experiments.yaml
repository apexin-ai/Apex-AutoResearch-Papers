tier: worst
narrative_guidance: 'Reframe away from ''HS beats text'' toward one of two angles,
  both still targeting EMNLP Main: (A) **Negative-results-first framing**: ''We systematically
  evaluate 7 detection methods across 4 reasoning models and find that none achieves
  deployment-ready performance. The best approach (temporal HS probes) still has 39-62%
  safe FPR. We identify layer selection bias as a critical confounder and provide
  a sensitivity analysis framework.'' This positions the paper as a cautionary benchmark.
  (B) **Methodology-first framing**: ''We discover that a commonly used layer selection
  metric systematically biases hidden-state evaluations, producing false negatives
  at scale. We demonstrate this across 4 models and 5 metrics, show it reverses published
  conclusions, and propose a multi-metric audit protocol.'' This makes layer selection
  the headline and HS-vs-text becomes supporting evidence. Either angle requires:
  toning down deployment language, foregrounding limitations honestly, positioning
  as ''the field needs this evaluation before building on shaky foundations.'' Add
  cost-benefit analysis (HS access cost vs marginal gain over text) to preempt the
  engineering-cost reviewer.

  '
imagined_experiments:
- name: Cross-architecture layer sweep + static probe (r1-32b & QwQ-32B)
  plan_id: exp-001
  description: 'Full 64-layer sweep on DeepSeek-R1-Distill-Qwen-32B and QwQ-32B. Extract
    hidden states at all layers, evaluate static LR probes per layer under multiple
    selection metrics. Includes discovery of layer selection bias (bal_acc × crossing_rate
    → shallow layers).

    '
  expected_results:
    r1_32b_biased_layer: 10
    r1_32b_biased_layer_depth_pct: 15.6
    r1_32b_corrected_layer: 63
    r1_32b_corrected_layer_depth_pct: 98.4
    r1_32b_l10_bal_acc: 0.718
    r1_32b_l63_bal_acc_w1: 0.826
    r1_32b_n_test: 20
    r1_32b_l63_precision_w1: 0.603
    r1_32b_l63_fpr_w1: 0.235
    qwq_32b_biased_layer: 2
    qwq_32b_biased_layer_depth_pct: 3.1
    qwq_32b_corrected_layer: 60
    qwq_32b_corrected_layer_depth_pct: 93.8
    qwq_32b_l2_bal_acc: 0.73
    qwq_32b_l60_bal_acc_w3: 0.74
    qwq_32b_n_test: 19-20
    qwq_32b_l60_precision_w3: 0.578
    qwq_32b_l60_fpr_w3: 0.279
    layer_selection_bias_discovered: true
    metrics_tested: 5
    biased_metric: bal_acc × crossing_rate
    loo_cv_dominant_fold_pct: 65-68%
  result_rationale: 'Layer sweep reveals a genuine methodological finding (biased
    metric selects shallow layers), and corrected layers do show HS advantage. However,
    worst-tier reviewers dismiss this: (1) "Finding that one composite metric is bad
    is trivially expected — practitioners routinely try multiple metrics. This is
    hyperparameter tuning, not a contribution." (2) n=19-20 test traces for 32B models
    mean bootstrap CIs are wide. MDE analysis shows R1-32B residualized gap (+1.9pp)
    is far below the 11.2pp MDE at 80% power — the NS result for position-mediated
    HS advantage is a power limitation, not evidence. Reviewers note: "you can''t
    claim the advantage is ''real but position-mediated'' when you''re underpowered
    to detect the non-positional component." (3) The corrected layers (L60/L63, >93%
    depth) are so deep they''re essentially the output layer — reviewer asks: "are
    you just detecting output-token semantics via a different pathway?"

    '

      section 的关键内容。Hidden states DO encode current safety state（static probe 80%
      BA）， 但 POORLY predict future trajectory（probe 看到 t 时刻的 HS，只能判断 t 时刻 的 safety
      state，不能预测 t+5 是否会 commit）。Oracle 利用的是 label sequence 中 K-consecutive pattern——一旦连续
      5 个 post-CP label 出现，oracle 确信 commitment 已发生。Probe 无法复制这一优势，因为：(1) probe confidence
      在 CP 附近波动（pre-CP 也有 false crossings）；(2) temporal smoothing (W) 帮助但 引入了 latency；(3)
      GRU 的 +4.5 step lead 是 sequence modeling 的 modest contribution（学会了 "confidence
      持续上升 = commitment"的 pattern）。 Best 档 reviewer 视此分析为对 fundamental limitation
      的 honest investigation。


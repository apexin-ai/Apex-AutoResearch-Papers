      qwq_layer60_precision_W3: 0.578
      qwq_layer60_fpr_W3: 0.208
      qwq_hs_vs_text_precision_delta_W3: +23.6pp
      qwq_hb_all_15_W: 15/15 pass
      selectivity_r1_32b_l63: 19.7pp
      selectivity_qwq_l60: 14.4pp
    result_rationale: 'Best 档假设 layer selection sensitivity 被接受为可复现的方法论发现。在该前提下， 32B
      模型的 biased → corrected 层切换从 NS (p=0.064-0.83) 翻转为高度显著 (p<0.005)， 构成论文最强 evidence。R1-32B
      的 biased L10 位于 15.6% 深度（浅层），corrected L63 位于 98.4%（极深层）；QwQ 从 L2 (3.1%) 到 L60
      (93.8%)。这一翻转之所以成立，是因为 浅层 hidden state 表示空间被压缩（cosine distance 1.4-2.7× smaller），crossing_rate
      高但 precision 低。深层的 HS representation 编码了更多 semantic safety signal， 而非仅靠 positional
      encoding。4 models 全部在 corrected layers 通过 HB， 将 "scale-dependent HS advantage"
      的旧结论完全推翻为 "metric-dependent layer selection artifact"。Reviewer 在 best 档接受这一叙事，因为
      5 metrics × 4 models ablation 是系统性审计，而非 cherry-picking。


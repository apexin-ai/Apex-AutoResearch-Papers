      oracle_K5_detection_rate: 100%
      probe_best_lead: +4.5 (GRU)
      oracle_advantage_source: label sequence pattern — oracle sees 5+ consecutive
        post-CP labels before probes stabilize
      gap_explanation: 'Oracle exploits K-consecutive pattern in ground-truth labels
        (pure sequence), while probes must INFER label from noisy HS features. The
        31-step gap comes from label noise: probe confidence fluctuates around CP,
        requiring temporal smoothing (W) to stabilize, whereas oracle has clean binary
        signal.


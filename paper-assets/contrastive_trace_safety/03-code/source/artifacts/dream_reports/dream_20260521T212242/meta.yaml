      r1_32b_layer10_bal_acc: 0.718
      r1_32b_layer10_crossing_rate: 0.6
      r1_32b_layer63_bal_acc_W1: 0.826
      r1_32b_layer63_precision_W1: 0.603
      r1_32b_layer63_fpr_W1: 0.235

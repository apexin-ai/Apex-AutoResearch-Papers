    ## Step 2: Cross-Sharing


    **R1 → R2 key points shared**:

    - The text baseline fairness issue (MiniLM-L6 capacity vs HS) is the paper''s
    most serious methodological concern, potentially reducing Contribution 2 to a
    capacity comparison.

    - K=5 threshold transfer is an unacknowledged researcher degree of freedom.

    - 16/16 BA-layer robustness test does address circularity credibly.


    **R2 → R1 key points shared**:

    - The retrospective vs. predictive disconnect is important: the paper frames as
    "monitoring" but evaluates retrospective classification.

    - The related work thinness (12 references) is unusual for an evaluation paper
    and weakens positioning.

    - Several "failed" baselines (Mahalanobis, CCS) were designed for different tasks,
    weakening the "six paradigms fail" narrative.



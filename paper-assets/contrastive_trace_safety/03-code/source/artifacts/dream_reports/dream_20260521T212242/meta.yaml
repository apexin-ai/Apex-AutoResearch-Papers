    ---


    # DREAM Review Report — Full Mode


    **Paper:** "Layer Selection Matters: How Metric Choice Determines Hidden-State
    Probe Effectiveness for Reasoning Model Safety Monitoring"

    **Venue:** EMNLP 2026 (ARR)

    **Review mode:** Full (2 reviewers + roundtable)

    **Dream ID:** 20260521T212242


    ---


    ## Consolidated Scores


    | Dimension | R1 | R2 | Converged |

    |-----------|----|----|-----------|

    | Soundness | 3.5 | — | 3.5 |

    | Excitement | — | 3.0 | 3.0 |

    | Reproducibility | 3.5 | — | 3.5 |

    | **Overall** | **3.5** | **3.0** | **3.0 (Findings)** |


    **Confidence:** 4/5 (both reviewers read all sections and appendices)


    ---


    ## 1. Paper Summary


    The paper studies detection of "safety commitment points" in reasoning LLMs (DeepSeek-R1,
    QwQ), where CoT reasoning gradually erodes safety until the model commits to harmful
    generation. It evaluates hidden-state (HS) probes vs. text-based probes across
    4 models (R1-8B, OT-7B, QwQ-32B, R1-32B), 2 architectures (Llama, Qwen), and 2
    scales (7-8B, 32B). Three contributions: (1) the metric `bal_acc × crossing_rate`
    biases layer selection toward shallow layers at 32B scale, reversing HS advantage
    significance from 5/12 to 12/12 Holm-Bonferroni; (2) at corrected layers, HS probes
    outperform text (precision +15-24pp); (3) six alternative methods fail comprehensively.


    ---


    ## 2. Strengths (Consensus)


    - **S1: The layer selection bias finding (C1) is the paper''s genuine contribution.**
    Demonstrating that metric choice creates a 61-layer divergence that reverses statistical
    significance (p=0.83 → p<0.005) is a strong, replicable methodological finding.
    The mechanistic explanation (cosine compression in shallow layers → noise-driven
    threshold crossings → inflated crossing_rate) is well-characterized and goes beyond
    generic "layer sensitivity" warnings. The 5-metric × 4-model ablation constitutes
    a systematic audit applicable to any study using threshold-frequency metrics.
    (R1+R2 agree)


    - **S2: Exemplary statistical rigor.** Holm-Bonferroni correction, null-centered
    BCa bootstrap (10k resamples), nested CV, split-half replication, exact permutation
    tests, 5-seed stability, power analysis with MDE, position residualization (linear
    + quadratic), and control task selectivity. This exceeds the methodological standard
    of typical EMNLP submissions. (R1+R2 agree)


    - **S3: Transparency and self-criticism are exceptional.** The three-tier evidence
    classification (cross-validated / significant / exploratory), the bug disclosure
    (Appendix M), the explicit acknowledgment that 32B results are underpowered, and
    the careful documentation of boundary conditions (encoder gradient, position mediation)
    set a high standard. The paper does not oversell. (R1+R2 agree)


    - **S4: Comprehensive negative results.** Testing 7 alternative methods (Mahalanobis,
    BOCPD, CUSUM, cross-transfer, CCS, MLP, RepE) and reporting their failures with
    taxonomized failure modes (graduality, variance subspace, model-specificity, capacity,
    objective mismatch) is a genuine service to the community. (R1+R2 agree)


    - **S5: Anti-circularity and robustness analyses are thorough.** The BA-layer
    anti-circularity analysis (16/16 HB pass at threshold-free selected layers), LOO-CV
    stability (65-68% fold agreement), K ablation, CP perturbation sensitivity, and
    PCA/random-projection capacity controls demonstrate unusual methodological care.
    (R1)


    - **S6: Clear writing and effective visualization.** Despite the complexity, the
    paper is generally readable. The layer heatmap (Figure 1) effectively communicates
    the core finding. Tables are well-designed and informative. (R2)


    ---


    ## 3. Weaknesses (Consensus)


    - **W1: The empirical HS advantage (C2) is fragile.** [CRITICAL] Both reviewers
    agree this is the central weakness. The HS advantage is validated robustly only
    at 7-8B against a weak 384d text encoder (all-MiniLM-L6-v2). Against BGE-large-1024d,
    only 1/4 models survives HB. Under quadratic position residualization, only 2/4
    survive. At 32B, results are exploratory (n=19-20); R1-32B is significant only
    at W=1 with 25% coverage; QwQ''s advantage is position-mediated. The encoder gradient
    (MiniLM 4/4 → E5 2/4 → BGE 1/4) suggests the HS "advantage" is partly an artifact
    of comparing against a deliberately weak baseline. The surviving robust claim
    reduces to: "HS probes beat a weak 384d text encoder at 7-8B after careful layer
    selection." (R1+R2)


    - **W2: Single dataset dependency.** [SIGNIFICANT] All CP-dependent claims rely
    on HarmThoughts (632 total traces). AdvBench analysis is geometric only (cosine
    compression) and does not validate the HS advantage because 90.4% of jailbroken
    traces have CP=0. External validity is entirely untested. Even within HarmThoughts,
    the 32B models have only 19-20 test traces, making the statistical analysis severely
    underpowered (MDE 8.6-9.5pp). (R1+R2)


    - **W3: Architecture coverage is imbalanced.** [SIGNIFICANT] 3/4 models are Qwen-based.
    Only R1-8B (Llama-8B) provides cross-architecture evidence. The random-label control
    reveals the crossing-rate geometric bias is Qwen-specific. The paper''s 2×2 "architecture
    × scale" matrix is formally a 1+3 split, limiting the generalizability of both
    C1 and C2. (R1+R2)


    - **W4: Practical value is limited by high FPR.** [MODERATE] Safe-trace FPR ranges
    11-62% depending on model/method. The paper correctly frames this as "establishing
    baselines rather than production-ready thresholds," but this substantially reduces
    the paper''s applied impact. None of these methods are deployable, and the paper
    does not propose a clear path to deployability. (R1+R2)


    - **W5: Conditional inference / garden of forking paths.** [MODERATE] The exploration
    space is ~2,240 configurations per model (layers × windows × metrics). The 12
    final HB tests do not account for this upstream search. Nested CV at 7-8B shows
    13-25% shrinkage (non-trivial overfitting), and 32B models lack this protection
    entirely. The two-stage independence argument rests on validation sets with ~4
    traces per class at 32B scale. (R1)


    - **W6: The CR-composite metric is a partially artificial foil.** [MODERATE] `bal_acc
    × crossing_rate` is not a standard layer selection metric in the probing literature.
    Most studies use balanced accuracy or downstream task performance. The paper''s
    "dramatic reversal" narrative depends on the CR-composite as the counterpoint.
    While the warning about threshold-frequency contamination generalizes, the specific
    dramatic effect is tied to a metric the paper itself constructs. (R2)


    - **W7: GRU evaluation at inconsistent layers.** [MINOR] GRU probes on 32B models
    were evaluated at biased (shallow) layers, not at threshold-based corrected layers.
    This means the GRU negative result at 32B may be an artifact of the same layer
    selection bias the paper identifies. This is acknowledged in Limitations but undermines
    the "linear probes sufficient" claim at scale. (R1)


    ---


    ## 4. Questions for Authors


    1. **Stronger text baselines as primary comparison.** The BGE-1024d results show
    the HS advantage largely disappears. If a researcher uses BGE-large (freely available,
    no GPU needed), what is the practical case for HS probing? Have you considered
    using the *same* LLM''s output embeddings as a text baseline to directly test
    whether intermediate layers add information?


    2. **Layer selection circularity.** Have you considered selecting layers using
    a criterion entirely independent of downstream task performance (e.g., CKA similarity
    to output layer, representation geometry change rate)? The BA anti-circularity
    analysis helps but BA is still task-specific.


    3. **Multi-layer ensemble as mitigation.** The three-layer ensemble "eliminates
    pre-selection" (p ≤ 0.002) but receives one sentence. This seems like the natural
    solution to the problem the paper identifies. Why wasn''t it developed as the
    primary recommended approach?


    4. **GRU at corrected layers.** Can you provide GRU results at threshold-based
    layers for 32B models? This is critical for the "linear probes sufficient" conclusion.


    5. **Position as feature vs. confound.** If position alone achieves BA=0.832 for
    QwQ-32B (vs. HS 0.796), could a practitioner simply use position as the detector?
    Under what conditions would HS probes be preferred?


    6. **Second dataset feasibility.** Have you considered creating even a small independent
    annotation set to test whether the HS advantage generalizes beyond HarmThoughts?


    ---


    ## 5. Missing References / Comparisons


    - Multi-layer ensemble probing (Pais et al. 2026) as a validated mitigation —
    should be more than one sentence

    - GuardReasoner (Xiang et al. 2025) as a practical baseline for the deployment
    use case

    - Causal probing literature (Vig et al., Meng et al., Geiger et al.) for establishing
    whether probed layers are causally relevant

    - Faithfulness-of-CoT literature tension: strong text encoders nearly matching
    HS weakens the "HS captures what text misses" motivation


    ---


    ## 6. Roundtable Discussion


    ### Areas of Agreement

    Both reviewers converge strongly on:

    - C1 (layer selection bias) is the paper''s load-bearing contribution and is well-supported

    - C2 (HS advantage) is too heavily conditioned to serve as a standalone contribution
    at this venue

    - Statistical methodology is exemplary and above field standards

    - Transparency and self-criticism set a high bar

    - Single dataset + architecture imbalance are the most actionable weaknesses for
    revision

    - The paper is at the Conference/Findings boundary


    ### Areas of Disagreement and Resolution

    The main disagreement concerns novelty calibration:

    - **R1** views the layer selection bias finding as "genuinely novel and important"
    — the specific quantitative reversal (5/12 → 12/12 HB, 61-layer divergence) and
    mechanistic explanation exceed generic probing sensitivity warnings

    - **R2** views it as "incremental" — layer sensitivity is known (Belinkov 2022,
    Hewitt & Liang 2019), and this is a careful application to a new domain


    **Resolution:** The finding is more than a generic warning — the mechanistic explanation
    (cosine compression → noise-driven crossings) and the quantitative impact on downstream
    conclusions are genuine contributions. However, the conceptual advance is domain-specific
    application of known methodology concerns, which is better valued at Findings
    than Main. The reviewers converge on **3.0 (Findings)** as the appropriate level:
    the paper''s methodological rigor and negative results are valuable but the empirical
    contribution is too narrow for Main conference acceptance.


    ### Suggested Revisions for Resubmission at Conference Level

    1. **Add a second dataset** with step-level CP annotations (even 50 traces on
    a non-Qwen model would help)

    2. **Evaluate against BGE-1024d as the primary text baseline** and report the
    HS advantage relative to it (not just MiniLM-384d)

    3. **Develop the multi-layer ensemble** as a validated mitigation with proper
    CV

    4. **Re-evaluate GRU at corrected layers** for 32B models

    5. **Add at least one non-Qwen model** at 32B scale (e.g., Llama-3.1-70B or Llama-3.3-70B
    at a smaller scale)


    ---


    ## 7. Overall Assessment


    **Score: 3.0 — Findings**


    The paper makes a genuine methodological contribution (C1: layer selection bias)
    supported by rigorous statistical methodology and exceptional transparency. The
    comprehensive negative results (C3) provide community value. However, the empirical
    HS advantage (C2) is fragile — surviving robustly only at 7-8B against a weak
    text baseline, with 3/4 models sharing the Qwen architecture, on a single dataset.
    The high safe-trace FPR (11-62%) and underpowered 32B results limit practical
    impact. The paper''s quality (rigor, honesty, thoroughness) is conference-grade,
    but the strength of the surviving empirical claims is at the Findings level.


    The paper is recommended for **Findings** acceptance. With a second dataset, stronger
    text baselines as the primary comparison, and broader architecture coverage, the
    contribution would be substantially stronger for Main conference.


    **Recommendation:** Accept (Findings)'

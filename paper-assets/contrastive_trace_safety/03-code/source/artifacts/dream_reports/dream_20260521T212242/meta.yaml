tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Current evidence package (12/12 HB, 16/16 BA-layer, position mediation
        3/4, 5-seed robustness, 6 negative methods) is already sufficient for Main.
        Layer selection sensitivity is recognized as a genuine methodological contribution
        distinct from hyperparameter tuning. CV-validated ensemble is cosmetic, not
        load-bearing.
      key_assumptions:
      - Reviewers treat layer selection metric bias as a reproducible methodological
        finding (not 'you just picked the wrong hyperparameter')
      - 4 models × 2 architectures × 2 scales is accepted as sufficient breadth for
        an empirical study
      - 32B caveats (R1-32B W=1 only, QwQ negative lead time) are read as honest science,
        not evidence of fragility
      - Comprehensive negative results (BOCPD/CUSUM/Mahalanobis/RepE/CCS/MLP all fail)
        are valued as community service
      - Position mediation analysis (3/4 retain non-positional HS advantage) fully
        resolves confound concern
      - High safe FPR (39-62%) is acceptable as acknowledged limitation for a detection-evaluation
        paper
      number_ranges:
        avg_reviewer_score:
        - 3.5
        - 4.0
        novelty_rating:
        - 3.5
        - 4.0
        soundness_rating:
        - 4.0
        - 4.5
        champions_out_of_3:
        - 2
        - 3
        ensemble_cv_impact_on_acceptance:
        - 0.0
        - 0.05
        lowest_single_reviewer:
        - 3.0
        - 3.5
      narrative_direction: Original framing fully intact. Primary contribution = layer
        selection sensitivity as researcher-degree-of-freedom audit. Secondary = HS
        advantage universal at correct layers. Tertiary = 6 methods fail. Paper title
        emphasizes 'layer selection matters' angle. Claims need no softening. Ensemble
        CV can go in appendix as supplementary validation.
    median:
      tier: median
      meaning: Paper is borderline Main/Findings. Layer selection contribution is
        seen as 'useful observation' not 'methodological advance'. One reviewer flags
        practical impact (high FPR, QwQ timing). CV-validated ensemble helps marginally
        but the real gap is in framing clarity and addressing the 'so what for deployment'
        question.
      key_assumptions:
      - At least one reviewer sees layer selection as 'just good practice' rather
        than a contribution — needs explicit framing as sensitivity analysis framework
      - R1-32B caveats (W=1 only significant, 25% coverage, position-mediated advantage)
        weaken the 'universal' claim enough that one reviewer downgrades
      - Different W per model in the 12/12 HB table is flagged as cherry-picking each
        model's best setting
      - High safe FPR (39-62%) is flagged as undermining deployment relevance — reviewer
        asks 'would anyone actually use this?'
      - Negative results are appreciated but not enough to carry the paper alone
      - Position mediation partially resolves confound but QwQ's competitive position
        baseline (0.746 > HS 0.740) bothers one reviewer
      number_ranges:
        avg_reviewer_score:
        - 3.0
        - 3.5
        novelty_rating:
        - 2.5
        - 3.5
        soundness_rating:
        - 3.5
        - 4.0
        champions_out_of_3:
        - 1
        - 2
        ensemble_cv_impact_on_acceptance:
        - 0.05
        - 0.12
        lowest_single_reviewer:
        - 2.5
        - 3.0
      narrative_direction: 'Soften ''universal HS advantage'' to ''HS advantage robust
        at 7-8B, model-specific at 32B''. Elevate the systematic evaluation framework
        (4 models × 7 methods × 5 metrics) as the primary contribution over the HS-vs-text
        comparison itself. Add a ''practical deployment analysis'' subsection: at
        what FPR threshold is monitoring useful, and which model-method combos meet
        it? CV-validated ensemble strengthens the ''principled layer selection'' story
        but the real lift comes from (a) explicit uniform-W table alongside best-W
        table, (b) deployment-oriented discussion of when HS monitoring is worth the
        infrastructure cost. Findings acceptance likely; Main possible if AC weights
        breadth and rigor.'
    worst:
      tier: worst
      meaning: 'Core premise challenged: ''HS outperforms text'' is seen as either
        (a) unsurprising (hidden states have more info than text, obviously) or (b)
        not practically useful (high FPR, small absolute gains, deployment cost of
        hidden-state access). Layer selection sensitivity is dismissed as hyperparameter
        tuning. Paper needs fundamental reframing.'
      key_assumptions:
      - Reviewers frame the HS-vs-text comparison as 'trivially expected' — hidden
        states are a superset of information available to text
      - 'Method novelty rated insufficient: linear probes + temporal windows are standard;
        no new architecture or training procedure'
      - Small sample sizes (R1-32B n=20, QwQ n=19-20) make the 32B claims unconvincing
        despite HB corrections — reviewer notes MDE analysis shows R1-32B residualized
        gap is underpowered
      - Safe FPR 39-62% is a dealbreaker for the deployment framing — 'a monitor that
        fires on half of safe traces is useless'
      - R1-32B being position-mediated + QwQ having negative HS lead time means 2/4
        models have serious practical caveats, undermining breadth claims
      - One reviewer points out text probes require zero infrastructure change while
        HS probes need white-box access — the 15-24pp precision gain may not justify
        the engineering cost
      number_ranges:
        avg_reviewer_score:
        - 2.5
        - 3.0
        novelty_rating:
        - 2.0
        - 2.5
        soundness_rating:
        - 3.0
        - 3.5
        champions_out_of_3:
        - 0
        - 1
        ensemble_cv_impact_on_acceptance:
        - 0.0
        - 0.03
        lowest_single_reviewer:
        - 2.0
        - 2.5
      narrative_direction: 'Reframe away from ''HS beats text'' toward one of two
        angles, both still targeting EMNLP Main: (A) **Negative-results-first framing**:
        ''We systematically evaluate 7 detection methods across 4 reasoning models
        and find that none achieves deployment-ready performance. The best approach
        (temporal HS probes) still has 39-62% safe FPR. We identify layer selection
        bias as a critical confounder and provide a sensitivity analysis framework.''
        This positions the paper as a cautionary benchmark. (B) **Methodology-first
        framing**: ''We discover that a commonly used layer selection metric systematically
        biases hidden-state evaluations, producing false negatives at scale. We demonstrate
        this across 4 models and 5 metrics, show it reverses published conclusions,
        and propose a multi-metric audit protocol.'' This makes layer selection the
        headline and HS-vs-text becomes supporting evidence. Either angle requires:
        toning down deployment language, foregrounding limitations honestly, positioning
        as ''the field needs this evaluation before building on shaky foundations.''
        Add cost-benefit analysis (HS access cost vs marginal gain over text) to preempt
        the engineering-cost reviewer.'

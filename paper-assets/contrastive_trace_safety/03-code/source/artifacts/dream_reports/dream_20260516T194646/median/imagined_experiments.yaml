    between random and LR on Qwen2.5, near random on Llama'
  analysis: Mahalanobis partially works on Qwen2.5 (40-45% coverage, AUROC 0.73-0.75)
    — this is the 'ambiguous sub-finding' of the median tier. The result is architecturally
    explained by signal concentration in leading PCs, which means TrajGuard-style
    detectors would have partial success on Qwen2.5 reasoning models but near-complete
    failure on Llama-based ones. Reframe Claim 1 to note that 'geometric detectors
    show architecture-dependent effectiveness correlated with PCA concentration of
    safety signal' rather than blanket failure. Temporal probes still dominate in
    all cases, preserving the core story.

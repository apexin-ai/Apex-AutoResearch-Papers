    abstractions before task-specific decoding in later layers, and the safety reasoning
    state is a semantic-level concept. Early layers encode surface features (token
    identity), late layers encode output logits. The smooth bell curve with ~28pp
    range (41% to 69%) confirms layer choice matters and the finding is robust. This
    adds a practical recommendation: for new architectures, start at the 50% depth
    point.'

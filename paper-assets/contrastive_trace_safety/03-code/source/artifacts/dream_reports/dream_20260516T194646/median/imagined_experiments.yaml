  analysis: 'Claim 1 validated cross-architecture: static probes achieve 48-53% coverage
    on Qwen2.5 models, remaining below 60% threshold. Architectural difference in
    signal distribution is quantifiable — Qwen2.5 has lower full-space Fisher (signal
    more diffuse per-dimension) but higher PCA-space Fisher (signal more concentrated
    in leading components). This sets up the key cross-architecture comparison: Qwen2.5''s
    different signal geometry may alter temporal probe dynamics.'
- name: Cross-architecture temporal window evaluation
  plan_id: exp-002
  description: Train temporal window LogisticRegression with W=15 on r1-32b and QwQ-32B
    hidden states. Compare coverage improvement (delta over static) to r1-8b's +30pp.
  expected_results:
    r1_32b_temporal_w15_acc: 0.8512
    r1_32b_temporal_w15_coverage: 0.6792
    r1_32b_temporal_w15_lead_mean: 0.52
    r1_32b_temporal_w15_lead_median: 0
    r1_32b_delta_over_static: 0.1509
    qwq_32b_temporal_w15_acc: 0.8421
    qwq_32b_temporal_w15_coverage: 0.6481
    qwq_32b_temporal_w15_lead_mean: -0.73
    qwq_32b_temporal_w15_lead_median: -1
    qwq_32b_delta_over_static: 0.1666
    r1_8b_temporal_w15_coverage_ref: 0.7674
    r1_8b_delta_ref: 0.3023
    attenuation_factor_r1_32b: 0.5
    attenuation_factor_qwq: 0.55
  result_rationale: 'Temporal advantage exists but is attenuated to ~15-17pp (vs 30pp
    on Llama). The attenuation occurs because Qwen2.5''s higher PCA concentration
    means static probes already capture more of the accessible signal — there''s less
    ''headroom'' for temporal context to add. The temporal probe still helps because
    safety reasoning density decline patterns exist cross-architecture, but the already-higher
    static baseline leaves less room for improvement. Coverage reaches 65-68% rather
    than 77% — this does NOT saturate the oracle ceiling (which would be ~77% if oracle
    patterns are similar). The r1-32b result of +0.52 lead time is the ''ambiguous''
    sub-finding: slightly positive but within noise given bootstrap CI will span [-1.5,
    2.5]. QwQ remains clearly negative. This architecture-dependent magnitude is the
    key finding that reshapes Claim 2.'

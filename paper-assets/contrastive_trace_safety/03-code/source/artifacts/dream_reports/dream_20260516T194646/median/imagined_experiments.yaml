    showing within-architecture block is warmer than cross-architecture block'
  analysis: Cross-architecture transfer confirms the 'architecture-specific signal
    geometry' hypothesis. Within-architecture transfer nearly matches in-domain performance
    (especially Qwen→Qwen), while cross-architecture transfer drops 12-37pp. This
    supports framing cross-architecture validation as characterization rather than
    claiming a universal detector — practical deployment requires per-architecture
    probe training. The finding strengthens the architectural analysis contribution
    axis.
- name: Lead time analysis across models
  plan_id: exp-004
  description: Analyze lead time distributions for temporal probes on all 3 models.
    Report per-model distributions, positive lead rate, and compare to oracle's +31
    step advantage.
  expected_results:
    r1_8b_lead_mean: -1.09
    r1_8b_lead_median: -1
    r1_8b_positive_lead_rate: 0.302
    r1_32b_lead_mean: 0.52
    r1_32b_lead_median: 0

  analysis: The near-zero lead time generalizes cross-architecture. The r1-32b slightly
    positive mean is a directional curiosity — 42% of traces show positive lead (vs
    30% on Llama) but the absolute values remain too small for practical early warning.
    The 30-step gap between probe and oracle persists uniformly, confirming hidden
    states encode CURRENT safety state but not FUTURE trajectory. Claim 3 reframed
    as 'lead time is near-zero across architectures' — a softer statement that accommodates
    the r1-32b sub-finding while maintaining the core limitation message.
- name: TrajGuard-style Mahalanobis baseline
  plan_id: exp-005
  description: Implement Mahalanobis distance detector using safe-trace covariance
    estimation. Compute per-step MD, threshold for anomaly detection on all 3 models.
    Expected to partially work on Qwen2.5 (higher PCA concentration) but fail on Llama.
  expected_results:
    r1_8b_mahalanobis_coverage: 0.302
    r1_8b_mahalanobis_acc: 0.714
    r1_8b_mahalanobis_auroc: 0.683
    r1_32b_mahalanobis_coverage: 0.453
    r1_32b_mahalanobis_acc: 0.779
    r1_32b_mahalanobis_auroc: 0.752
    qwq_mahalanobis_coverage: 0.407
    qwq_mahalanobis_acc: 0.761
    qwq_mahalanobis_auroc: 0.734
    num_safe_traces_covariance: 70/65/68 per model
    threshold_method: 95th percentile of safe-trace MD distribution
    pca_reduced_md_r1_8b: 0.256
    pca_reduced_md_r1_32b: 0.372
  result_rationale: 'Mahalanobis distance PARTIALLY works on Qwen2.5 (40-45% coverage)
    but fails on Llama (30%). This is directly explained by the PCA concentration
    difference: Qwen2.5''s higher Fisher in PCA space (2.4-2.8 vs Llama''s ~1) means
    the covariance-based geometric detector can capture more of the safety signal,
    since more signal lives in the directions that dominate the covariance matrix.
    On Llama, safety signal is distributed across minor PCs that the covariance matrix
    effectively ignores — Mahalanobis detects gross distribution shifts but misses
    the subtle safety-specific directions. This is the ''ambiguous'' result for this
    experiment: Mahalanobis doesn''t completely fail on Qwen2.5 (as we''d predicted
    from Llama-only results), complicating the ''existing detectors fail'' narrative.
    Must reframe as ''architecture-dependent failure mode'' rather than universal
    failure.'

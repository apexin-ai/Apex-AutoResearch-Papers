    harmful reasoning in hidden-state space is theoretically interesting — it suggests
    the model uses similar computational circuits for both. This supports including
    the 16-label experiment in the paper for interpretability value, but it doesn't
    change the core quantitative story.
- name: Oracle decomposition analysis
  plan_id: exp-010
  description: Analyze WHY the text-label oracle achieves +31 step lead time while
    hidden-state probes achieve ~0. Decompose oracle's advantage into specific label
    pattern features.
  expected_results:
    oracle_key_features:
    - consecutive_safe_count_decline
    - safe_label_density_in_window
    - longest_unsafe_streak
    feature_importance_ranking:
      consecutive_safe_decline: 0.41
      density_in_W10: 0.28
      longest_unsafe_streak: 0.19
      type_diversity_decline: 0.12
    oracle_ablation_no_future: lead_mean drops from +31 to +2.1 when oracle only sees
      past labels
    oracle_ablation_current_only: lead_mean = -0.5 (similar to probe)
    information_gap: 28.9 steps of lead come from FUTURE label visibility
    hidden_state_mutual_info_with_future_labels: 0.043
  result_rationale: 'The oracle''s advantage is almost entirely from seeing FUTURE
    labels (+28.9 of +31 steps). When restricted to past-only labels, the oracle drops
    to +2.1 steps — only marginally better than hidden-state probes. This confirms
    the limitation is NOT that probes miss something in current hidden states, but
    that hidden states simply don''t encode future safety trajectory. The mutual information
    between current hidden state and future labels (t+5 to t+15) is near-zero (0.043
    bits), confirming there''s no recoverable signal about the future. The implication:
    closing the gap requires either (a) future-label information (text monitoring),
    (b) multiple-step autoregressive hidden-state prediction, or (c) auxiliary training
    objectives that force the model to encode future safety trajectory.'
  tables:
  - name: 'Table 12: Oracle Decomposition'
    columns:
    - Oracle Variant
    - Lead Mean
    - Coverage
    - Information Source
    rows:
    - - Full oracle (past+future)
      - 31
      - 1.0
      - Complete label sequence
    - - Past-only oracle
      - 2.1
      - 0.82
      - Only labels at t≤current
    - - Current-step oracle
      - -0.5
      - 0.73
      - Only label at t=current
    - - Hidden-state probe (W=15)
      - -1.09
      - 0.767
      - Hidden states only
  figures_description:
  - 'Fig 12: Stacked bar showing lead time decomposition — past-label contribution
    (2.1 steps) vs future-label contribution (28.9 steps)'
  analysis: 'The decomposition conclusively establishes WHY pre-textual detection
    fails: 93% of the oracle''s lead comes from future information that hidden states
    cannot contain. This is a principled impossibility argument — not a method failure
    but a fundamental information-theoretic limitation. The past-only oracle''s +2.1
    steps suggests a small ceiling for any hidden-state approach that could additionally
    incorporate label history (i.e., hybrid text+hidden-state monitors). This motivates
    future work directions in the Discussion section.'

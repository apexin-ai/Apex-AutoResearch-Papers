- name: 16-label taxonomy supervision
  plan_id: exp-009
  description: Replace binary commitment labels with fine-grained 16-label taxonomy
    (Type 1-4 safety reasoning categories) for temporal probe training. Test whether
    richer supervision improves coverage or timing.
  expected_results:
    r1_8b_16label_coverage: 0.791
    r1_8b_16label_lead_mean: -0.82
    r1_8b_16label_acc_macro: 0.623
    r1_8b_binary_from_16label_coverage: 0.767
    r1_32b_16label_coverage: 0.704
    r1_32b_16label_lead_mean: 0.38
    r1_32b_binary_from_16label_coverage: 0.679
    improvement_over_binary: +2.4pp on r1-8b, +2.5pp on r1-32b
    label_confusion: Type 2 (acknowledging harm) and Type 3 (refusing) most separable;
      Type 1 (reasoning about safety) confused with harmful reasoning
  result_rationale: '16-label supervision provides marginal improvement (+2-3pp coverage)
    because the additional label structure helps the probe distinguish ''safety reasoning
    declining'' from ''safety reasoning changing type.'' However, the improvement
    is small because the binary commitment label already captures the key transition
    — the 16 categories provide redundant signal once the main safe→unsafe boundary
    is learned. Lead time doesn''t meaningfully improve because the fundamental limitation
    (hidden states don''t encode future trajectory) applies regardless of label granularity.
    The real value is interpretability: we can now characterize WHICH types of safety
    reasoning decline first (Type 1 reasoning-about-safety disappears before Type
    3 refusal). This informs the Discussion but doesn''t change core claims.'

    qwq_lead_mean: -0.73
    qwq_lead_median: -1
    qwq_positive_lead_rate: 0.333
    oracle_lead_mean_all_models: 31
    gap_probe_vs_oracle: 29-32 steps across models
    r1_32b_lead_std: 4.8
    qwq_lead_std: 5.1
    r1_32b_lead_p25: -2
    r1_32b_lead_p75: 3
  result_rationale: Lead time remains near-zero across all architectures, confirming
    the fundamental limitation of hidden-state approaches. The r1-32b result (+0.52
    mean) is the one 'ambiguous' sub-finding — technically positive but the distribution
    spans [-8, +12] with median at 0, so it's not practically meaningful. The slight
    positive tendency on r1-32b may reflect Qwen2.5's more concentrated signal geometry
    making the commitment transition slightly more abrupt (and thus detectable 1-2
    steps earlier in some traces). However, this does NOT constitute reliable pre-textual
    detection — the oracle still achieves +31 steps via label-sequence patterns invisible
    to hidden states. Claim 3 generalizes but should be stated as 'near-zero' rather
    than 'strictly negative' to accommodate the r1-32b directional finding.

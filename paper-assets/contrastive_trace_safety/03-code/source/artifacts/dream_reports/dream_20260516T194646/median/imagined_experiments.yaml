    is stronger, making the temporal redundancy in larger windows counterproductive.
    On Llama, the signal is more diffuse, requiring longer temporal context to accumulate
    enough evidence. This finding directly supports the ''architecture-specific optimal
    W'' narrative and provides a practical recommendation for deployment (tune W per
    architecture). The diminishing returns curves have different shapes — Llama is

tier: median
narrative_guidance: Soften Claim 2 from 'saturates oracle ceiling cross-architecture'
  to 'consistently improves coverage with architecture-dependent magnitude.' Claim
  3 becomes 'lead time is near-zero across architectures' (directional finding, not
  absolute impossibility). Add architecture-comparative analysis as new contribution
  axis — WHY does signal distribution differ? Reframe as 'characterization + practical
  method' paper. Strengthen with window ablation (exp-007) showing architecture-specific
  optimal W. Still viable for EMNLP Main but needs tighter empirical packaging; Findings
  is realistic fallback.
imagined_experiments:
- name: Cross-architecture static probe evaluation
  plan_id: exp-001
  description: Train static LogisticRegression on hidden states from DeepSeek-R1-Distill-Qwen-32B
    and QwQ-32B at layer 20 (proportional mid-layer for 64-layer model). Evaluate
    coverage (crossing rate), accuracy, and Fisher discriminant ratio in original
    and PCA-reduced spaces.
  expected_results:
    r1_32b_static_acc: 0.8341
    r1_32b_static_coverage: 0.5283
    r1_32b_static_lead_mean: -1.4
    r1_32b_fisher_orig_L32: 11.23
    r1_32b_fisher_orig_L40: 12.07
    r1_32b_fisher_pca3_L32: 2.61
    r1_32b_fisher_pca3_L40: 2.84
    r1_32b_var_explained_3pc: 0.231
    qwq_32b_static_acc: 0.8189
    qwq_32b_static_coverage: 0.4815
    qwq_32b_static_lead_mean: -1.8
    qwq_32b_fisher_orig_L32: 9.74
    qwq_32b_fisher_orig_L40: 10.52
    qwq_32b_fisher_pca3_L32: 2.19
    qwq_32b_fisher_pca3_L40: 2.43
    qwq_32b_var_explained_3pc: 0.214
    num_traces_r1_32b: 187
    num_traces_qwq: 192
    split_ratio: 112/37/38 and 115/38/39
  result_rationale: Qwen2.5 architecture distributes safety signal differently than
    Llama — Fisher discriminant in original space is 9-12 (vs Llama's 17-18) because
    Qwen2.5's wider MLP and GQA attention spread safety-relevant features across more
    dimensions with lower per-dimension separability. However, PCA top-3 captures
    more variance (21-23% vs Llama's 16.6%) and Fisher in PCA space is higher (2.2-2.8
    vs Llama's ~1), indicating Qwen2.5 concentrates safety signal slightly MORE in
    leading PCs. Static coverage is marginally higher than Llama (48-53% vs 46.5%)
    because this higher PCA concentration gives a linear probe slightly more accessible
    signal, but still below 60% — confirming Claim 1 generalizes. The lower full-space
    Fisher explains why the absolute coverage remains limited despite better geometric
    accessibility.

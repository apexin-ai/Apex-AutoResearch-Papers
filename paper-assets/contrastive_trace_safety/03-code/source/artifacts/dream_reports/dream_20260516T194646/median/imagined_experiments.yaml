  figures_description:
  - 'Fig 3a: PCA scatter (PC1 vs PC2) for r1-32b showing safety/unsafe step clusters
    — more visible separation than r1-8b but still substantial overlap'
  - 'Fig 3b: Fisher discriminant ratio by layer (all 64 layers of r1-32b) — peak at
    L32-L40, values 10-12, contrasting with r1-8b peak of 17-18'
  - 'Fig 3c: Variance explained by top-k PCs — Qwen2.5 curve above Llama curve, crossing

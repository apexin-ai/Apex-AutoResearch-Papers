  figures_description:
  - 'Fig 4a: Coverage bar chart — static vs temporal for all 3 models, showing consistent
    improvement but magnitude varies by architecture'
  - 'Fig 4b: Per-trace detection visualization — 5 example traces from r1-32b showing
    temporal probe crossing commitment point where static probe misses'
  analysis: 'Temporal advantage is real and consistent (+15-17pp) but architecture-dependent
    in magnitude. The 30pp gain on Llama attenuates to ~16pp on Qwen2.5, likely because
    Qwen2.5''s signal geometry (higher PCA concentration) gives static probes a head
    start. Claim 2 must be softened: temporal probes ''consistently improve coverage
    with architecture-dependent magnitude'' rather than ''saturate oracle ceiling
    cross-architecture.'' The r1-32b slightly positive lead time (0.52 steps) is intriguing
    but not statistically robust — this becomes the directional sub-finding that motivates
    future work.'
- name: Cross-model transfer evaluation
  plan_id: exp-003
  description: 'Zero-shot cross-architecture transfer: train probe on r1-8b (Llama,
    dim=4096), test on r1-32b/QwQ (Qwen2.5, dim=5120) via learned linear projection.
    And reverse direction. Evaluate with both static and temporal probes.'
  expected_results:
    llama_to_qwen_static_coverage: 0.372
    llama_to_qwen_temporal_coverage: 0.426
    qwen_to_llama_static_coverage: 0.349
    qwen_to_llama_temporal_coverage: 0.401
    within_arch_qwen_to_qwen_static: 0.491
    within_arch_qwen_to_qwen_temporal: 0.612
    projection_dim: 512
    projection_method: learned linear (trained on 50 aligned traces)
    random_baseline_coverage: 0.167
  result_rationale: Cross-architecture zero-shot transfer is weak (35-43% coverage)
    because the safety signal occupies architecture-specific subspaces — a linear
    projection trained on few aligned samples cannot fully recover the mapping between
    Llama and Qwen2.5 hidden state geometries. The projection captures gross safe/unsafe
    distinctions (well above random baseline of 16.7%) but loses the fine-grained
    temporal patterns that drive the +15-30pp temporal advantage. Within-architecture
    transfer (Qwen→Qwen, r1-32b→QwQ) performs substantially better (49-61%) because
    both Qwen2.5 models share similar signal geometry. This confirms the hypothesis
    that cross-architecture transfer requires architecture-specific fine-tuning —
    the safety concept is universal but its geometric instantiation is architecture-dependent.

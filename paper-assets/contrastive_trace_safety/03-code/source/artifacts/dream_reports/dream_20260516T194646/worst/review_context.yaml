  analysis: 'The oracle decomposition provides the mechanistic foundation for the
    two-regime theory. Llama''s gradual density decline requires temporal context
    to detect; Qwen2.5''s sharp transitions are directly readable from instantaneous
    hidden states. This explains ALL findings: why static probes work on Qwen, why
    temporal context doesn''t help much on Qwen, and why lead time is positive on
    Qwen but negative on Llama.'

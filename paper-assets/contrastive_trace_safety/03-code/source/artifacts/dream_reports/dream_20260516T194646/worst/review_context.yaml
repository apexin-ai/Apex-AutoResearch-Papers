- name: Oracle decomposition
  plan_id: exp-010
  description: Why can oracle but not probes achieve positive lead time? Architecture-specific
    analysis.
  expected_results:
    llama_oracle_lead_advantage_source: density_decline_gradient
    qwen_oracle_lead_advantage_source: transition_sharpness
    llama_hidden_state_gradient_correlation: 0.21
    qwen_hidden_state_gradient_correlation: 0.67
    llama_pre_cp_label_entropy: 1.83
    qwen_pre_cp_label_entropy: 0.94
  result_rationale: 'Oracle decomposition reveals WHY Qwen2.5 enables positive lead
    time: the label sequence has lower pre-commitment-point entropy (0.94 vs 1.83),
    meaning safety reasoning cessation is more predictable. On Qwen2.5, hidden states
    correlate well with the oracle''s prediction signal (r=0.67) because both exploit
    the same sharp transition. On Llama, hidden states poorly correlate with oracle
    signal (r=0.21) because the oracle uses cumulative density decline patterns that
    require sequence-level context unavailable in single hidden states. This mechanistically
    explains the architecture difference.'
  tables:

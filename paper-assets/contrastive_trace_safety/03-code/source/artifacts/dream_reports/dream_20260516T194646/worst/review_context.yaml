    ~67%. The temporal delta remains minimal (+2.4pp). This rules out the confound
    that 32B models are simply easier due to scale — it's genuinely the architecture.
    The 2×2 matrix (Llama-8B, r1-32b-Qwen, QwQ-32B-Qwen, OpenThinker-7B-Qwen) cleanly
    isolates architecture as the determining factor.

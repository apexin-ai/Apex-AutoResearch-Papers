    temporal_delta_llama_ci:
    - 0.19
    - 0.42
    cross_transfer_coverage_ci:
    - 0.14
    - 0.37
  result_rationale: 'Bootstrap CIs confirm the worst-case interpretation: temporal
    delta on Qwen2.5 has CI crossing zero ([-0.02, 0.12]), meaning we cannot reject
    the null that temporal context provides no benefit. Meanwhile Llama temporal delta
    CI is solidly positive ([0.19, 0.42]). The wide CIs (±12pp) reflect small sample
    sizes (43 test traces) and high variance across traces. Cross-transfer CI confirms
    below-chance performance is genuine. These CIs statistically formalize the architecture-dependent
    story — the difference between architectures IS significant, but the temporal
    advantage within Qwen2.5 IS NOT.'

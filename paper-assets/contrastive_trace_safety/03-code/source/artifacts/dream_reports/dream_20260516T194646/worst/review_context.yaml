  - ROC curves for Mahalanobis detection across models. Qwen2.5 curves significantly
    above Llama curve, approaching useful AUC.
  - Eigenspectrum of safe-trace covariance matrix per model. Llama shows flatter spectrum
    (signal buried); Qwen2.5 shows steeper drop-off (signal in top eigenvalues accessible
    to MD).
  analysis: 'Mahalanobis baseline achieves 55-60% coverage on Qwen2.5, undermining
    the ''geometric methods categorically fail'' narrative. While still below static
    LR, the gap is modest (~12pp) rather than catastrophic. This means for Qwen2.5-based
    models, even unsupervised anomaly detection provides practical coverage. The original
    paper''s ''you need supervised temporal probes'' message is architecture-specific.
    Reframe: ''We characterize when geometric baselines suffice vs when supervised
    temporal methods are needed.'''
- name: Bootstrap confidence intervals
  plan_id: exp-006

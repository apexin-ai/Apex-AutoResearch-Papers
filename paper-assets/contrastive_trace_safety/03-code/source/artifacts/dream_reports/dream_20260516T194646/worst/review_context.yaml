  figures_description:
  - Lead time distribution violin plots per model. Llama distribution centered below
    0; Qwen2.5 distributions centered above 0 with right skew.
  analysis: 'The negative lead time finding is Llama-specific. Qwen2.5''s concentrated
    signal geometry enables genuine pre-textual detection with positive lead times.
    This is the most damaging result for the original framing — it means Claim 3 cannot
    stand as a universal limitation. However, it opens a richer story: architecture
    determines not just WHAT method works but WHETHER pre-textual detection is possible
    at all. The lead time difference directly correlates with PCA signal concentration
    (r=0.89 across models).'
- name: TrajGuard-style Mahalanobis baseline
  plan_id: exp-005
  description: Implement Mahalanobis distance baseline on all 3 models.
  expected_results:
    r1_8b_mahalanobis_coverage: 0.349
    r1_32b_mahalanobis_coverage: 0.558
    qwq_32b_mahalanobis_coverage: 0.605
    r1_8b_mahalanobis_fpr: 0.23
    r1_32b_mahalanobis_fpr: 0.14
    qwq_32b_mahalanobis_fpr: 0.11
  result_rationale: Mahalanobis distance partially succeeds on Qwen2.5 (55-60% coverage)
    because the concentrated signal creates genuine distributional shift detectable
    by covariance-based methods. On Llama, signal is distributed across minor PCs
    that contribute little to Mahalanobis distance (dominated by top eigenvalues),
    so coverage remains low (35%). This means TrajGuard-style approaches — which the
    paper claims categorically fail — actually work reasonably on Qwen2.5. The 'existing
    detectors fail' claim (part of Claim 1's story) doesn't generalize.
  tables:

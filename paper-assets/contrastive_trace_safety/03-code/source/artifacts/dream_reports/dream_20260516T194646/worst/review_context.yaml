narrative_guidance: 'Abandon ''temporal is universally critical'' framing. Reframe
  as: ''Hidden-state safety monitoring in reasoning models is architecture-dependent
  — we identify two regimes (distributed-signal/Llama where temporal context is essential,
  vs concentrated-signal/Qwen where static probes suffice) and characterize when each
  applies.'' New Claim 2 becomes ''architecture determines monitoring strategy.''
  Emphasize the diagnostic framework (Fisher ratio, PCA variance as predictors of
  which regime applies) as the transferable contribution. Reposition as empirical
  characterization paper with practical deployment implications. Target EMNLP Main
  via comparative-analysis angle.'
imagined_experiments:
- name: Cross-architecture static probe evaluation
  plan_id: exp-001
  description: Train static LR on r1-32b and QwQ-32B hidden states, measure coverage.
  expected_results:
    r1_32b_static_lr_acc: 0.891
    r1_32b_static_lr_coverage: 0.698
    r1_32b_fisher_orig_L14: 8.3
    r1_32b_fisher_pca3_L14: 5.1
    r1_32b_var_explained_3pc: 0.38
    qwq_32b_static_lr_acc: 0.903
    qwq_32b_static_lr_coverage: 0.721
    qwq_32b_fisher_orig_L14: 6.7
    qwq_32b_fisher_pca3_L14: 4.2
    qwq_32b_var_explained_3pc: 0.41
  result_rationale: Qwen2.5 architecture concentrates safety-relevant signal into
    top principal components (PCA top-3 explains ~38-41% variance vs 16.6% for Llama).
    Fisher discriminant ratio drops from 17-18 (Llama full-space) to only 6-8 (Qwen
    full-space), but critically the PCA-3 Fisher ratio RISES to 4-5 (vs ~1 for Llama).
    This means safety signal in Qwen2.5 is geometrically concentrated rather than
    distributed across minor components. Static LR exploits this concentrated signal
    directly, achieving 70%+ coverage — far above the 46.5% seen on r1-8b/Llama. The
    architecture's representation geometry makes safety states linearly separable
    without temporal context.
  tables:
  - name: 'Table: Static Probe Cross-Architecture Comparison'
    columns:
    - Model
    - Architecture
    - Static Coverage
    - Fisher (full)
    - Fisher (PCA-3)
    - PCA Var Explained
    rows:
    - - r1-8b
      - Llama-3.1
      - 46.5%
      - '17.9'
      - '0.93'
      - 16.6%
    - - r1-32b
      - Qwen2.5
      - 69.8%
      - '8.3'
      - '5.1'
      - 38.0%
    - - QwQ-32B
      - Qwen2.5
      - 72.1%
      - '6.7'
      - '4.2'
      - 41.0%
  figures_description:
  - PCA scatter plot (PC1 vs PC2) showing safety/unsafe step embeddings for all 3
    models. Llama shows overlapping clusters; Qwen2.5 models show clear separation
    with decision boundary visible in 2D.
  - 'Fisher ratio comparison: bar chart showing full-space Fisher (Llama >> Qwen)
    vs PCA-3 Fisher (Qwen >> Llama), illustrating signal concentration difference.'
  analysis: 'Static probes achieve 70%+ coverage on Qwen2.5 models, dramatically above
    the 46.5% on Llama. This directly contradicts the universality of Claim 1. The
    explanation lies in representation geometry: Qwen2.5 concentrates safety signal
    into dominant PCs (41% variance in top-3 vs 17% for Llama), making it accessible
    to linear classifiers without temporal aggregation. The lower full-space Fisher
    ratio (6-8 vs 17-18) is misleading — what matters is where the signal lives relative
    to the principal subspace.'
- name: Cross-architecture temporal window evaluation
  plan_id: exp-002
  description: Temporal LR W=15 on r1-32b and QwQ-32B. Test whether +30pp improvement
    holds.
  expected_results:
    r1_32b_temporal_w15_acc: 0.901
    r1_32b_temporal_w15_coverage: 0.744
    r1_32b_temporal_delta_over_static: 0.046
    qwq_32b_temporal_w15_acc: 0.912
    qwq_32b_temporal_w15_coverage: 0.767
    qwq_32b_temporal_delta_over_static: 0.046
  result_rationale: Temporal window adds only +4-5pp coverage on Qwen2.5 models (vs
    +30pp on Llama). The 'safety reasoning density decline' pattern that temporal
    probes exploit on Llama is either absent or already captured by static signal
    in Qwen2.5. Because safety signal is concentrated in top PCs, a single-step snapshot
    already contains sufficient discriminative information — the temporal context
    provides marginal smoothing benefit rather than genuinely new signal. The temporal-minus-static
    delta of ~0.05 is within noise range for these sample sizes, meaning temporal
    context is effectively unnecessary for Qwen2.5.
  tables:
  - name: 'Table: Temporal Advantage Cross-Architecture'
    columns:
    - Model
    - Static Coverage
    - Temporal W15 Coverage
    - Delta
    - Llama Baseline Delta
    rows:
    - - r1-8b (Llama)
      - 46.5%
      - 76.7%
      - +30.2pp
      - —
    - - r1-32b (Qwen2.5)
      - 69.8%
      - 74.4%
      - +4.6pp
      - —
    - - QwQ-32B (Qwen2.5)
      - 72.1%
      - 76.7%
      - +4.6pp
      - —
  figures_description:
  - 'Bar chart: static vs temporal coverage across 3 models. Llama shows dramatic
    temporal lift; Qwen2.5 models show near-flat bars with minimal gap.'
  - 'Density decline pattern visualization: rolling window safety-label density for
    representative traces. Llama traces show gradual decline pattern; Qwen2.5 traces
    show sharper step-function transitions.'
  analysis: 'The +30pp temporal advantage is Llama-specific. Qwen2.5 models show only
    +4-5pp marginal improvement from temporal context, within bootstrap CI overlap.
    The ''safety reasoning density decline'' pattern — the mechanism temporal probes
    exploit — manifests differently in Qwen2.5: transitions are sharper (step-function
    rather than gradual decline), meaning a single step already captures the transition.
    This invalidates Claim 2 as a general finding but opens the architecture-dependent
    monitoring story.'
- name: Cross-model transfer
  plan_id: exp-003
  description: Train on r1-8b (Llama), test on r1-32b/QwQ (Qwen2.5) and vice versa.
  expected_results:
    llama_to_qwen_static_coverage: 0.256
    llama_to_qwen_temporal_coverage: 0.279
    qwen_to_llama_static_coverage: 0.302
    qwen_to_llama_temporal_coverage: 0.326
    projection_head_dim_match_loss: 0.42
    within_qwen_transfer_coverage: 0.651
  result_rationale: Cross-architecture transfer fails catastrophically (25-33% coverage)
    because the architectures encode safety in fundamentally different geometric subspaces.
    Llama distributes signal across minor PCs; Qwen2.5 concentrates it in major PCs.
    A learned projection head cannot bridge this because the signal dimensions are
    incommensurable — it's not a rotation/scaling problem but a rank mismatch. Within-family
    transfer (r1-32b ↔ QwQ-32B, both Qwen2.5) works reasonably (65%) because representation
    geometry is shared within architecture family. This confirms safety encoding is
    architecture-determined, not model-determined.
  tables:
  - name: 'Table: Zero-Shot Cross-Architecture Transfer'
    columns:
    - Train Model
    - Test Model
    - Method
    - Coverage
    - vs In-Domain
    rows:
    - - r1-8b (Llama)
      - r1-32b (Qwen)
      - Static LR
      - 25.6%
      - 69.8%
    - - r1-8b (Llama)
      - r1-32b (Qwen)
      - Temporal W15
      - 27.9%
      - 74.4%
    - - r1-32b (Qwen)
      - r1-8b (Llama)
      - Static LR
      - 30.2%
      - 46.5%
    - - r1-32b (Qwen)
      - r1-8b (Llama)
      - Temporal W15
      - 32.6%
      - 76.7%
    - - r1-32b (Qwen)
      - QwQ-32B (Qwen)
      - Static LR
      - 65.1%
      - 72.1%
  figures_description:
  - 'Transfer matrix heatmap: rows = train model, columns = test model, cell color
    = coverage. Diagonal (in-domain) is hot; cross-architecture cells are cold; within-Qwen
    transfer is warm.'
  analysis: Zero-shot transfer between architectures is near-random, confirming safety
    signal is encoded architecture-specifically. The slight above-chance performance
    (25-33% vs ~20% random baseline) suggests some universal safety features exist
    but are insufficient for practical detection. Within-family transfer (65%) demonstrates
    that models sharing architecture share representation geometry for safety, supporting
    the 'architecture determines monitoring strategy' reframing.
- name: Lead time analysis across models
  plan_id: exp-004
  description: Confirm negative lead time finding on 32B models.
  expected_results:
    r1_32b_static_lead_mean: 2.1
    r1_32b_temporal_lead_mean: 3.4
    r1_32b_positive_lead_rate: 0.52
    qwq_32b_static_lead_mean: 3.8
    qwq_32b_temporal_lead_mean: 4.2
    qwq_32b_positive_lead_rate: 0.58
  result_rationale: Qwen2.5 models show POSITIVE lead time (mean 2-4 steps), contradicting
    the negative lead time finding on Llama. Because safety signal is concentrated
    and linearly separable in Qwen2.5, probes can detect commitment approaching before
    it occurs — the hidden state shifts are more abrupt and precede the textual commitment
    point. This further undermines the universality of Claim 3 (pre-textual detection
    is fundamentally limited). On Qwen2.5, the limitation doesn't hold — it's a Llama-specific
    artifact of distributed signal requiring temporal aggregation, which inherently
    introduces detection lag.
  tables:

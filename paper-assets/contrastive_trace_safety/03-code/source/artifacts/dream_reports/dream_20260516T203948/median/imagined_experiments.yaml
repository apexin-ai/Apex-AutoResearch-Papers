- name: Layer selection ablation (32B models)
  plan_id: exp-008
  description: Temporal probe evaluated at all 64 layers for both 32B models. Tests
    whether middle-layer finding generalizes and whether there's a better layer for
    temporal probes vs static probes.
  expected_results:
    r1_32b_temporal_best_layer: 28
    r1_32b_temporal_best_coverage: 0.721
    r1_32b_static_best_layer: 30
    r1_32b_temporal_layer_range_good: 24-34
    qwq_temporal_best_layer: 24
    qwq_temporal_best_coverage: 0.581
    qwq_static_best_layer: 26
    qwq_temporal_layer_range_good: 20-30
    temporal_vs_static_layer_offset: -2
  result_rationale: 'Temporal probes prefer slightly earlier layers (2 layers shallower)
    than static probes. This makes sense: static probes need the most processed representation
    (later = more feature-extracted), while temporal probes benefit from slightly
    rawer representations where temporal dynamics are more pronounced before being
    abstracted away by later layers. The ''good range'' spanning ~10 layers (15% of
    depth) means the finding is robust to layer choice — not a fragile optimization.
    QwQ''s best layer is slightly earlier (38% depth vs 44%) consistent with its faster-forming
    representations.'

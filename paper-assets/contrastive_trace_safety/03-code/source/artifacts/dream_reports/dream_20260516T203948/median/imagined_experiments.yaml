    change-point method strengthens the ''fundamental limitation'' argument. If even
    BOCPD (designed precisely for detecting distributional shifts) can''t reliably
    achieve early detection, the limitation is in the signal, not the detection method.
    Coverage drops slightly (69.8% vs 76.7%) because BOCPD''s probabilistic threshold
    filters out marginal detections — a precision-recall tradeoff.'

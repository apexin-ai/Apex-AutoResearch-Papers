  result_rationale: 'BOCPD achieves marginally better lead time than GRU (+5.2 vs
    +4.7 on r1-8b) by explicitly modeling distributional shift in the probe score
    sequence rather than trying to predict future states. The improvement is incremental
    (+0.5 steps) not transformative — both methods face the same fundamental limitation
    (hidden states encode current state, not future trajectory). BOCPD''s advantage
    comes from its probabilistic framework: it detects that a regime change HAS occurred
    slightly faster than GRU predicts one WILL occur. Early detection rate 47% is
    better than GRU''s 39% but still far from oracle''s 100%. The method provides
    an honest ''incremental improvement'' story rather than a breakthrough. CUSUM
    performs slightly worse than BOCPD (less principled distributional assumptions).
    Coverage drops from 76.7% to 69.8% because BOCPD requires sustained evidence of
    change-point, filtering out borderline detections.'

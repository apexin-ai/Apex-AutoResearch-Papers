  analysis: 16-label supervision provides marginal gain — confirms binary commitment
    is the right abstraction level for this task. The consistent +2.3pp across models
    suggests this is a real but small effect of better gradient signal, not noise.
    Include as supplementary result addressing reviewer concern but don't reframe
    any claims around it.
- name: Oracle decomposition analysis
  plan_id: exp-010
  description: Analysis of why oracle achieves +31 lead time but probes cannot. Characterizes
    what label patterns encode that hidden states fail to predict.
  expected_results:
    oracle_exploits_future_absence: true
    probe_captures_density_decline: true
    probe_misses_abrupt_transitions_pct: 0.61
    avg_steps_from_last_safety_to_cp: 14.6
    probes_fire_after_density_below_threshold: true
    oracle_fires_at_last_safety_label: true
    information_gap_type: future trajectory vs current state
    abrupt_cp_traces_pct: 0.42
  result_rationale: 'The oracle ''cheats'' by definition — it sees the LAST safety
    label and fires immediately (hence +31 mean lead = avg distance from last safety
    to trace end). Probes can only detect that safety density HAS declined, not that
    it WILL NOT recover. 42% of traces have ''abrupt'' commitment (safety reasoning
    present within 3 steps of CP) where no pre-textual signal exists by construction.
    The remaining 58% with gradual decline are where probes succeed (these are the
    ~40% positive-lead traces). The gap is not model capacity — it''s information-theoretic:
    current hidden states encode current state well but don''t contain reliable signal
    about whether safety reasoning will resume.'
  tables:
  - name: 'Table S4: Oracle decomposition'
    columns:
    - Trace Category
    - '% of Traces'
    - Oracle Lead
    - GRU Lead
    - Gap
    rows:
    - - Gradual decline (>5 steps fade)
      - 58%
      - '+38'
      - '+7.2'
      - '31'
    - - Abrupt transition (≤3 steps)
      - 42%
      - '+22'
      - '-2.1'
      - '24'
    - - All traces
      - 100%
      - '+31'
      - '+4.7'
      - '26'
  figures_description:
  - 'Scatter plot: oracle lead time vs GRU lead time per trace, colored by transition
    type — showing that GRU only achieves positive lead on gradual transitions'
  - 'Example trace pair: one gradual (GRU succeeds) vs one abrupt (GRU fails) with
    safety label density plots'
  analysis: 'The oracle decomposition reveals a principled limitation: 42% of traces
    have abrupt commitment transitions where pre-textual detection is impossible given
    current information. GRU achieves positive lead specifically on the 58% with gradual
    transitions (+7.2 steps). This reframes Claim 3: the 39% positive-lead rate roughly
    corresponds to traces where gradual decline provides exploitable signal. Future
    work could target better detection of ''abrupt'' transitions via architectural
    advances (e.g., latent state models). This analysis contributes to the ''what
    works and why'' diagnostic framing.'

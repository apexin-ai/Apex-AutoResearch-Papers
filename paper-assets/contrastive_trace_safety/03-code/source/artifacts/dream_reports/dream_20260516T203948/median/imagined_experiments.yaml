tier: median
narrative_guidance: 'Adjust claims: (1) holds fully, (2) temporal advantage is robust
  but magnitude varies by architecture — reframe as ''temporal context consistently
  helps but benefit is architecture-dependent'', (3) remains ''unreliable positive''
  with BOCPD as incremental not transformative. Hidden-state vs text gap reframed:
  hidden states provide ''complementary signal especially for timing'' rather than
  ''strictly superior''. Add model-specific analysis section. Paper becomes diagnostic/analytical
  contribution — ''what works, what doesn''t, and why'' — rather than method contribution.
  Supplement with qualitative case studies showing WHERE hidden states succeed and
  text fails.'
imagined_experiments:
- name: Cross-architecture static probe (32B models)
  plan_id: exp-001
  description: Layer sweep + static LR probe on DeepSeek-R1-Distill-Qwen-32B and QwQ-32B
    (64 layers, 5120-d). Identifies best layer, evaluates static probe coverage/accuracy.
  expected_results:
    r1_32b_best_layer_idx: 30
    r1_32b_best_layer_depth_pct: 0.47
    r1_32b_static_acc: 0.7943
    r1_32b_static_coverage: 0.442
    r1_32b_static_lead_mean: -2.8
    r1_32b_fisher_orig: 15.3
    r1_32b_fisher_pca3: 1.02
    qwq_32b_best_layer_idx: 26

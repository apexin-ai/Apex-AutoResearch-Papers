    as ''monitoring-suitable, not intervention-suitable at current precision.'' QwQ''s
    higher FPR (19%) aligns with its generally worse probe calibration — another architecture-dependent
    finding. The false positive characterization (most triggered by extensive safety
    deliberation) is useful for the paper''s diagnostic contribution: it shows the
    probe correctly identifies ''safety engagement'' but sometimes cannot distinguish
    ''engagement leading to refusal'' from ''engagement leading to failure.'' This
    motivates outcome-aware probe training in future work.'

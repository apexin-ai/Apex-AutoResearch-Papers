    lead_improvement: 0.79
    r1_32b_16label_coverage: 0.721
    qwq_16label_coverage: 0.581
  result_rationale: 'Marginal improvement (+2.4pp coverage, +0.8 lead time) from 16-label
    supervision. The gain is small because the temporal window already captures most
    of the ''safety density decline'' signal — finer labels provide slightly more
    gradient signal during training but the fundamental information (safety present
    vs absent over time) is already well-captured by binary. The improvement is consistent
    across models but never dramatic. This addresses the reviewer concern (''why not
    use full taxonomy?'') with an empirical answer: marginal benefit, binary is nearly
    optimal for this task.'

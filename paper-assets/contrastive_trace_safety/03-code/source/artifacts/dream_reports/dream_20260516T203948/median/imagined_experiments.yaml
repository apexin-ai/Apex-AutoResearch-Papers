    qwq_32b_fisher_pca3: 0.87
    num_traces_r1_32b: 209
    num_traces_qwq: 209
  result_rationale: 'Static probes fail cross-architecture as expected — signal is
    distributed across minor PCs (Fisher drops from 13-15→~1 in PCA-3D), consistent
    with r1-8b finding. r1-32b slightly outperforms QwQ because it shares the DeepSeek
    training pipeline with r1-8b (similar internal safety representations). QwQ has
    a different training regime (Qwen team''s RL approach), producing less separable
    static geometry. Best layer at ~41-47% depth matches r1-8b''s 44% finding — middle
    layers capture task-relevant features universally. Both models confirm Claim 1:
    static probes achieve <50% coverage despite high Fisher in full space.'
  tables:

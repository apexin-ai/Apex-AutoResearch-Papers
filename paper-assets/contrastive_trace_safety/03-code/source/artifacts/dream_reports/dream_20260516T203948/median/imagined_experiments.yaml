  figures_description:
  - 'Lead time distribution violin plots: one per model, showing the heavy tail of
    positive leads alongside the mass at 0 or negative — visually communicating ''unreliable
    positive'''
  - 'Detection delay CDF: cumulative distribution of delay relative to commitment
    point, per model — QwQ shifted rightward (later detection)'
  analysis: 'Lead time results confirm Claim 3 across architectures: pre-textual detection
    is ''unreliable positive.'' The positive mean persists but magnitude decreases
    with architectural distance from the original r1-8b finding. QwQ shows genuinely
    poor timing (+1.4 mean, median -1) — its abrupt commitment transitions provide
    less exploitable temporal structure. The consistent pattern (high std, low positive-lead
    rate, median ≤ 0) across all models strengthens the ''fundamental limitation''
    argument. The oracle''s +31-step advantage remains unreachable by any current
    method.'
- name: TrajGuard-style Mahalanobis baseline
  plan_id: exp-005
  description: Mahalanobis distance on safe-trace-estimated covariance, per step.
    Evaluates TrajGuard-style geometric detection across all 3 models.
  expected_results:
    r1_8b_trajguard_coverage: 0.395
    r1_8b_trajguard_auroc: 0.61
    r1_32b_trajguard_coverage: 0.326
    r1_32b_trajguard_auroc: 0.57
    qwq_32b_trajguard_coverage: 0.279
    qwq_32b_trajguard_auroc: 0.54
    avg_trajguard_coverage: 0.333
    trajguard_vs_temporal_gap_pp: -30.8
  result_rationale: 'TrajGuard fails as expected because Mahalanobis distance assumes
    the discriminative signal lies in the principal directions of variance — but our
    PCA analysis showed Fisher drops from 17→1 in top-3 PCs. The safety commitment
    signal is distributed across minor components that MD effectively ignores. Coverage
    28-40% is slightly above chance but far below temporal probes. QwQ performs worst
    (28%) because its lower overall Fisher (13.7) means even less signal in the geometric
    directions MD can access. This validates the ''existing detectors fail'' claim
    and explains WHY: the geometric assumptions of TrajGuard-style methods are violated
    by the structure of reasoning-model safety representations.'
  tables:
  - name: 'Table 6: TrajGuard Mahalanobis baseline'
    columns:
    - Model
    - Coverage
    - AUROC
    - FPR@50% TPR
    - Lead Mean
    rows:
    - - r1-8b
      - '0.395'
      - '0.61'
      - '0.38'
      - '-4.2'
    - - r1-32b
      - '0.326'
      - '0.57'
      - '0.41'
      - '-5.1'
    - - QwQ-32B
      - '0.279'
      - '0.54'
      - '0.44'
      - '-6.3'
  figures_description:
  - 'ROC curves: TrajGuard (near-diagonal) vs temporal LR (strong) vs static LR (intermediate)
    — visual proof of geometric method failure'
  - 'MD score trajectories overlaid with commitment point: showing MD scores fluctuate
    without clear transition signal'
  analysis: TrajGuard's failure is not random — it's systematic and explainable. The
    Mahalanobis assumption (signal in principal variance directions) is precisely
    violated by our setting where Fisher drops 17× in PCA-3D. Coverage 28-40% (matching
    the median tier range of 25-45%) is worse than even static LR probes, which at
    least learn to project into discriminative directions. This result is essential
    for the paper's 'existing detectors fail' narrative and provides the mechanistic
    explanation (geometric assumption violation) rather than just the empirical observation.
- name: Bootstrap CIs + threshold-independent metrics
  plan_id: exp-006
  description: 1000 bootstrap resamples, AUROC, PR curves, detection delay CDF, FPR
    on safe traces. Comprehensive statistical characterization.
  expected_results:
    temporal_lr_coverage_ci:
    - 0.68
    - 0.84
    temporal_lr_coverage_ci_width: 0.088
    static_lr_coverage_ci:
    - 0.37

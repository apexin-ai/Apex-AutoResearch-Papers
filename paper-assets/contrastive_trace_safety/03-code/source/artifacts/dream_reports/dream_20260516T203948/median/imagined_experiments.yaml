    detection_delay_median: 2.0
    detection_delay_p90: 8.0
  result_rationale: Bootstrap CIs are moderately wide (0.06-0.12 range for coverage,
    matching median tier) because N=209 traces with 43 test traces creates sampling
    variance. The coverage CI [0.68, 0.84] for temporal LR does NOT cross the static
    probe's upper CI bound [0.56], confirming the temporal advantage is statistically
    significant even with these CIs. Lead time CIs are very wide [1.2, 8.1] reflecting
    the high variance — the lower bound is positive (good) but barely. AUROC values
    (0.82-0.89) are substantially higher than coverage metrics because AUROC is threshold-independent
    and captures discriminative power that manifests differently at various operating
    points.

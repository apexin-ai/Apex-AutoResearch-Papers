  analysis: Middle-layer finding generalizes robustly. The broad plateau (10-layer
    'good zone') means practitioners don't need exhaustive layer search — picking
    ~40-45% depth works well. The consistent 2-layer offset between temporal and static
    best layers is a minor but interesting finding for the paper's analysis section.
- name: 16-label taxonomy supervision
  plan_id: exp-009
  description: Fine-grained 16-label supervision (Type 1-4 safety categories) instead
    of binary commitment. Tests whether richer labels improve coverage/timing.
  expected_results:
    r1_8b_16label_coverage: 0.791
    r1_8b_16label_lead_mean: -0.3
    r1_8b_binary_coverage: 0.767
    r1_8b_binary_lead_mean: -1.09

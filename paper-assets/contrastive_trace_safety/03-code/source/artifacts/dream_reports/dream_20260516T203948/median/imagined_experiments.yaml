  figures_description:
  - 'Layer sweep heatmap: accuracy vs layer index for both 32B models, showing clear
    peak at middle layers with plateau rather than sharp peak — suggests broader ''sweet
    spot'' zone in deeper models'
  - 'Fisher discriminant ratio comparison: bar chart showing orig-space Fisher (13-18)
    vs PCA-3D Fisher (<1.1) across all 3 models — visual proof that signal is in minor
    components'
  analysis: 'Cross-architecture static probe results confirm Claim 1 generalizes.
    Both 32B models show the same qualitative pattern as r1-8b: high Fisher in full
    5120-d space but collapse in low-rank projections. r1-32b slightly better than
    QwQ due to shared DeepSeek training lineage. QwQ''s lower Fisher (13.7 vs 17.9)
    suggests Qwen-native training produces more diffuse safety representations. Coverage
    37-44% vs r1-8b''s 46.5% — static probes consistently fail across architectures.
    Best layer depth percentage is remarkably consistent (41-47%) suggesting a universal
    property of transformer safety representations.'
- name: Cross-architecture temporal window LR
  plan_id: exp-002
  description: Temporal LR (W=15) on r1-32b and QwQ-32B at their best layers. Tests
    whether +30pp coverage improvement replicates cross-architecture.
  expected_results:
    r1_32b_temporal_coverage: 0.698
    r1_32b_temporal_acc: 0.8391
    r1_32b_temporal_lead_mean: -0.6
    r1_32b_coverage_gap_pp: 25.6
    qwq_32b_temporal_coverage: 0.558
    qwq_32b_temporal_acc: 0.8103
    qwq_32b_temporal_lead_mean: -1.8
    qwq_32b_coverage_gap_pp: 18.6
    avg_coverage_gap_pp: 22.1
  result_rationale: 'Temporal advantage replicates on r1-32b (+25.6pp, approaching
    r1-8b''s +30pp) but is weaker on QwQ-32B (+18.6pp). r1-32b shares DeepSeek''s
    training dynamics — safety reasoning density decline patterns are similar to r1-8b,
    so the temporal window captures them effectively. QwQ has a different RL training
    procedure that produces more abrupt rather than gradual commitment transitions
    — the 15-step window captures some but not all of the temporal signal. The gap
    EXISTS on both models (confirming temporal context helps universally) but magnitude
    is architecture-dependent. This is the median outcome: partial replication, one
    strong + one moderate.'
  tables:
  - name: 'Table 3: Temporal vs Static coverage by model'
    columns:
    - Model
    - Static Cov
    - Temporal W=15 Cov
    - Gap (pp)
    - Temporal Acc
    - Lead Mean
    rows:
    - - r1-8b (reference)
      - '0.465'
      - '0.767'
      - '+30.2'
      - '0.848'
      - '-1.09'
    - - r1-32b
      - '0.442'
      - '0.698'
      - '+25.6'
      - '0.839'
      - '-0.6'
    - - QwQ-32B
      - '0.372'
      - '0.558'
      - '+18.6'
      - '0.810'
      - '-1.8'
  figures_description:
  - 'Coverage bar chart: three model groups, each with static (red) and temporal (blue)
    bars — visual emphasis on consistent improvement but varying magnitude'
  - 'Temporal probe score trajectories: example traces from r1-32b (smooth decline)
    vs QwQ (more abrupt transition) showing why window captures one better'
  analysis: 'Temporal advantage is robust in direction (+15-26pp across models) but
    architecture-dependent in magnitude. r1-32b replicates well (25.6pp gap, near
    r1-8b''s 30pp), while QwQ shows a weaker but real 18.6pp improvement. The discrepancy
    likely reflects different RL training approaches: DeepSeek models exhibit gradual
    safety reasoning density decline (well-captured by W=15), while QwQ''s training
    produces more abrupt transitions. Claim 2 holds but needs reframing: ''temporal
    context consistently improves detection across architectures, with benefit magnitude
    correlated to the gradualness of the commitment transition.'' The average 22pp
    gap is still substantial and clearly exceeds noise.'
- name: Cross-model transfer evaluation
  plan_id: exp-003
  description: Zero-shot cross-architecture probe transfer. Train on r1-8b (Llama),
    test on r1-32b/QwQ (Qwen2.5). Train on Qwen, test on Llama. Uses learned projection
    head (4096↔5120).
  expected_results:
    llama_to_r1_32b_coverage_retention: 0.56
    llama_to_qwq_coverage_retention: 0.43
    qwen_to_llama_coverage_retention: 0.47
    within_qwen_r1_32b_to_qwq_retention: 0.72
    within_qwen_qwq_to_r1_32b_retention: 0.68
    projection_head_params: 20971520
    cross_family_avg_retention: 0.49
    within_family_avg_retention: 0.7
  result_rationale: 'Within-family transfer (Qwen→Qwen) works reasonably well (68-72%
    retention) because both models share the Qwen2.5 base architecture and similar
    embedding geometry — safety representations occupy analogous subspaces. Cross-family
    transfer (Llama→Qwen, Qwen→Llama) degrades to ~43-56% retention because the learned
    projection head must bridge fundamentally different representation geometries.
    The Llama→r1-32b direction is slightly better (56%) than Llama→QwQ (43%) because
    r1-32b''s DeepSeek fine-tuning shares some training signal structure with r1-8b
    despite the architecture difference. This confirms the median assumption: cross-family
    transfer works but with substantial degradation (<50% avg retention).'
  tables:
  - name: 'Table 4: Cross-model transfer matrix (coverage retention %)'
    columns:
    - Train →
    - 'Test: r1-8b (Llama)'
    - 'Test: r1-32b (Qwen)'
    - 'Test: QwQ (Qwen)'
    rows:
    - - r1-8b (Llama)
      - 100%
      - 56%
      - 43%
    - - r1-32b (Qwen)
      - 47%
      - 100%
      - 72%
    - - QwQ-32B (Qwen)
      - 47%
      - 68%
      - 100%
  figures_description:
  - 'Transfer heatmap: 3×3 matrix with color intensity showing coverage retention
    — clear block structure with within-Qwen cluster being warmer'
  - 't-SNE of projected representations: showing alignment quality for within-family
    (clustered) vs cross-family (scattered) transfer'
  analysis: 'Transfer results reveal a clear family boundary: within-Qwen transfers
    retain 68-72% of same-model performance, while cross-family transfers average
    only 49%. This is consistent with the median tier expectation. The practical implication:
    a probe trained on one model in a family can provide moderate monitoring for siblings,
    but cross-family deployment requires retraining. For the paper, this motivates
    model-specific probes as the default recommendation while noting that within-family
    transfer is a viable low-cost option. The asymmetry (Llama→r1-32b at 56% vs QwQ→Llama
    at 47%) suggests the DeepSeek fine-tuning creates a partial bridge between families.'
- name: Cross-architecture lead time analysis
  plan_id: exp-004
  description: GRU (256-d, multi-layer) lead time evaluation on r1-32b and QwQ-32B.
    Tests whether +4.7 mean lead time finding generalizes.
  expected_results:
    r1_32b_gru_lead_mean: 3.1
    r1_32b_gru_lead_median: 0
    r1_32b_gru_lead_std: 11.4
    r1_32b_gru_positive_lead_rate: 0.36
    r1_32b_gru_crossing_rate: 0.72
    qwq_32b_gru_lead_mean: 1.4
    qwq_32b_gru_lead_median: -1
    qwq_32b_gru_lead_std: 9.8
    qwq_32b_gru_positive_lead_rate: 0.28
    qwq_32b_gru_crossing_rate: 0.63
  result_rationale: 'GRU lead time degrades on 32B models compared to r1-8b''s +4.7.
    r1-32b achieves +3.1 (reduced from 4.7 — still positive mean but same median=0
    pattern). QwQ further degrades to +1.4 mean with negative median, reflecting its
    more abrupt transitions that give the sequential model less predictive runway.
    The fundamental pattern persists: positive mean but unreliable (high std, low
    positive-lead rate). With only 209 traces and high variance, the GRU cannot reliably
    learn the timing signal on any model. QwQ''s worse performance aligns with its
    more abrupt commitment transitions — less temporal structure for the GRU to exploit.'

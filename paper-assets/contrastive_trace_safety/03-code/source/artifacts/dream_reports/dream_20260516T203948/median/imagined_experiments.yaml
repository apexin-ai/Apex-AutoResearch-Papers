  - 'Detection delay CDF: showing 50% of detections within 2 steps of CP, 90% within
    8 steps'
  analysis: 'CIs are informative despite moderate width. Key finding: temporal-static
    gap CIs don''t overlap on any model, confirming the advantage is real even accounting
    for sampling uncertainty. Lead time CIs are problematically wide (reflecting median=0,
    high std) — honest reporting but weakens Claim 3''s strength. AUROC 0.82-0.89
    provides a more favorable metric that reviewers may prefer. The CI width (0.06-0.12)
    motivates the call for larger datasets in future work without undermining current
    conclusions.'

    become essential: showing specific traces where hidden states fire 5+ steps before
    any textual indicator of commitment.'
- name: BOCPD change-point detection
  plan_id: exp-014
  description: Bayesian Online Change-Point Detection (Adams & MacKay 2007) applied
    to per-step probe confidence score sequences. Also test CUSUM as simpler alternative.
  expected_results:
    bocpd_r1_8b_lead_mean: 5.2
    bocpd_r1_8b_lead_median: 2
    bocpd_r1_8b_early_detection_rate: 0.47
    bocpd_r1_8b_coverage: 0.698
    bocpd_r1_32b_lead_mean: 3.8

  result_rationale: Lead time remains unreliable on 32B models, confirming Claim 3
    generalizes. r1-32b shows slightly positive mean (2.8) but median 0/-1, matching
    r1-8b's pattern (mean +4.7, median 0). QwQ is worse (mean -0.5, median -3) because
    the weaker base signal means the GRU has less predictive information to work with.
    The fundamental limitation identified on r1-8b — hidden states encode CURRENT
    safety state well but poorly predict FUTURE trajectory — holds across architectures.
    32B models have longer reasoning chains (more steps), which could theoretically
    help sequential models, but the additional steps are mostly elaboration rather
    than containing stronger predictive signal. GRU safe FPR remains high (55-59%)
    — the model achieves coverage by being trigger-happy, not by genuine early detection.

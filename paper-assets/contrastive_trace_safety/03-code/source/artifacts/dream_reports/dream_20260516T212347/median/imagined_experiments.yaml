    — it inherits the same reasoning trace structure and safety commitment patterns
    as r1-8b (distilled into Llama-3.1-8B). The distillation process preserves the
    internal representation of safety states because the student learns to mimic the
    teacher's hidden reasoning. Best layer at ~44% depth matches r1-8b pattern (layer
    14/32 = 44%), confirming consistent depth-proportional signal location across
    R1 distillations. QwQ-32B, however, was trained independently by Alibaba with
    a different RLHF pipeline and different safety training data. Its safety reasoning
    uses different internal representations — Fisher discriminability is only 9.8
    (vs 14.2 for r1-32b and 17.9 for r1-8b), indicating the safety signal is more
    diffuse/weaker. The HS precision advantage over text on QwQ narrows to borderline

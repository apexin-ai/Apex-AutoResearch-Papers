- name: Oracle decomposition analysis
  plan_id: exp-010
  description: Analyze what future-label information the oracle uses that probes cannot
    access. Decompose the +31-step lead time advantage.
  expected_results:
    oracle_advantage_from_future_labels: 31.0
    probe_max_lead_achieved: 4.9
    gap_steps: 26.1
    oracle_uses_label_persistence: true
    oracle_uses_final_3_labels: true
    probe_signal_is_instantaneous: true
    mutual_info_current_state_future_commitment: 0.12
    mutual_info_last5_states_future_commitment: 0.18
    transition_predictability_from_current: 0.34
    transition_predictability_from_window: 0.41
  result_rationale: 'The oracle''s +31-step advantage comes from accessing the FULL
    future label sequence — it ''knows'' the model will commit because it sees the
    commitment happen. Probes only access current/recent hidden states. The mutual
    information between current hidden state and future commitment point is low (0.12
    bits) — hidden states encode WHAT the model is currently reasoning about, not
    WHERE its reasoning will eventually converge. The safety reasoning process is
    genuinely stochastic from the perspective of any single time step: the model could
    still ''recover'' (return to safe reasoning) at many pre-commitment points. This
    is a principled limitation: commitment detection is easy in retrospect, hard in
    prospect, because reasoning trajectories are non-Markovian and the decisive transition
    is not foreshadowed in hidden states.'
  tables: []
  figures_description:
  - 'Mutual information curve: I(h_t; commitment_point) as function of distance to
    CP. Flat until ~3 steps before CP, then sharp rise — hidden states only ''know''
    about commitment at the last moment.'
  analysis: 'This analysis belongs in Discussion. Key insight: the safety signal encodes
    current deliberative state well (enabling detection) but not future trajectory
    (preventing prediction). The gap is not a method failure — it''s an information-theoretic
    limitation. No amount of architectural sophistication will close it without access
    to future tokens. Frame: ''commitment detection is a fundamentally reactive task;
    proactive intervention requires different approaches (e.g., steering, intervention)
    rather than better detectors.'''

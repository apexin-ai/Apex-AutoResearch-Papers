    steps that LOOK like pre-commitment uncertainty (the model considers and rejects
    harmful paths), and probes cannot distinguish ''considering harm then rejecting''
    from ''considering harm then committing.'' On QwQ safe FPR is slightly higher
    because QwQ''s more verbose reasoning style includes more explicit harm-consideration
    steps. The HS advantage in pre-CP FPR does NOT translate to lower safe FPR — safe
    FPR is similar between HS and text (41% vs 47% for r1-32b). This asymmetry is
    important: HS probes are better at distinguishing pre-commitment from post-commitment

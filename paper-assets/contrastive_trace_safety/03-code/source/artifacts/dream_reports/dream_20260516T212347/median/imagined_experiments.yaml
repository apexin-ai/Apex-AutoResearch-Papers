    transfer_r132b_to_r18b_lead_mean: -5.3
    transfer_r132b_to_qwq_acc: 0.57
    transfer_r132b_to_qwq_crossing_rate: 0.3
    transfer_r132b_to_qwq_lead_mean: -3.8
    transfer_qwq_to_r18b_acc: 0.51
    transfer_qwq_to_r18b_crossing_rate: 0.16
    transfer_qwq_to_r18b_lead_mean: -9.2
    transfer_qwq_to_r132b_acc: 0.58
    transfer_qwq_to_r132b_crossing_rate: 0.33
    transfer_qwq_to_r132b_lead_mean: -2.1
    cross_transfer_acc_mean: 0.548
    cross_transfer_acc_range:
    - 0.51
    - 0.58
    same_base_transfer_acc: 0.575
    diff_base_transfer_acc: 0.535
  result_rationale: 'Cross-transfer fails (acc 0.50-0.58, barely above chance for
    binary classification). Even with learned linear projection (4096→5120), the safety
    signal geometry is architecture-specific. The projection head can align dimensions
    but cannot rotate the signal into the correct subspace because safety information
    occupies different principal components in different architectures. Slight advantage
    for same-base transfers (r1-32b↔QwQ both Qwen2.5-based: ~0.575) vs cross-base
    (Llama↔Qwen: ~0.535) — the base architecture determines representation geometry
    more than the safety training. This is consistent with PCA findings: safety signal
    lives in minor components that are architecture-specific, not in universal directions
    like refusal direction (Arditi 2024) which targets a single dominant direction.'

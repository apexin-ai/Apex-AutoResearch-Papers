- name: Cross-model transfer evaluation
  plan_id: exp-003
  description: Train probe on r1-8b, test on r1-32b/QwQ. Train on Qwen-base (r1-32b),
    test on Llama-base (r1-8b). Zero-shot cross-architecture generalization with projection
    head (4096↔5120).
  expected_results:
    transfer_r18b_to_r132b_acc: 0.56
    transfer_r18b_to_r132b_crossing_rate: 0.28
    transfer_r18b_to_r132b_lead_mean: -4.2
    transfer_r18b_to_qwq_acc: 0.52
    transfer_r18b_to_qwq_crossing_rate: 0.19
    transfer_r18b_to_qwq_lead_mean: -8.1
    transfer_r132b_to_r18b_acc: 0.55

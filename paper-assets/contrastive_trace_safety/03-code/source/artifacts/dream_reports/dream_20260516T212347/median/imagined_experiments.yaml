tier: median
narrative_guidance: 'Soften Claim 1 to ''consistently more precise within architecture
  families, with effect size varying across base architectures.'' r1-32b (same Qwen2.5
  base as r1-8b distillation target, Llama-family distill) replicates HS precision
  advantage clearly; QwQ-32B shows weaker/absent advantage, suggesting architecture-specific
  signal geometry. Cross-transfer failure becomes a standalone finding rather than
  a weakness. Frame: 2-model validation within R1 family + 1 partial validation +
  architecture dependency discovery. Claim 2 (temporal necessity) method-agnostic,
  still holds. Claim 3 unchanged — lead time unreliable on 32B too.'

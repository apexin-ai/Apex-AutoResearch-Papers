- name: TrajGuard Mahalanobis on 32B models
  plan_id: exp-005
  description: Mahalanobis distance baseline using safe traces for covariance estimation
    on r1-32b and QwQ-32B. Expected to fail due to signal in minor PCs.
  expected_results:
    r1_32b_md_best_crossing_rate: 0.28
    r1_32b_md_best_lead_mean: 14.8
    r1_32b_md_delta_max_rate: 0.018
    r1_32b_safe_md_mean: 8.42
    r1_32b_jb_pre_md_mean: 8.51
    r1_32b_jb_post_md_mean: 8.38
    qwq_32b_md_best_crossing_rate: 0.21
    qwq_32b_md_best_lead_mean: 12.1
    qwq_32b_md_delta_max_rate: 0.012
    qwq_32b_safe_md_mean: 9.15
    qwq_32b_jb_pre_md_mean: 9.22
    qwq_32b_jb_post_md_mean: 9.18
  result_rationale: Mahalanobis distance fails on 32B models just as it failed on
    r1-8b. The safe/unsafe mean MD values are nearly identical (delta < 0.1), confirming
    the signal is not in the bulk covariance structure. With 5120-d hidden states
    and signal in minor PCs (explaining <1% variance), the Mahalanobis distance is
    dominated by the major variance directions (general language model computation)
    rather than the safety-specific directions. PCA-reduced variants also fail because
    the top PCs capture general computation, not safety signal. This result generalizes
    because the underlying mechanism (safety signal in minor PCs, Fisher dropping
    from ~14-18 to ~1 after PCA-3D) is architecture-independent — it's a property
    of how safety information is encoded relative to general computation.

- name: Window size ablation (W=1,3,5,10,15,20,25)
  plan_id: exp-007
  description: Window size sweep on all 3 models to find optimal W and show diminishing
    returns.
  expected_results:
    optimal_w_r1_8b: 15
    optimal_w_r1_32b: 15
    optimal_w_qwq_32b: 20
    coverage_at_w1_mean: 0.49

  figures_description:
  - 'Fig 5: Transfer accuracy heatmap (train × test). Diagonal blocked out (native).
    Warmer colors indicate higher transfer. Clear band of higher transfer within Qwen2.5
    family. All cells above 0.62.'
  - 'Fig 5b: t-SNE of projected hidden states from all 3 models in shared 256-d space.
    Safety vs commitment steps show partial clustering across models, with model-specific
    clusters but overlapping decision boundaries.'
  analysis: 'Cross-model transfer achieves 67-74% accuracy, decisively above chance
    and suggesting shared safety signal geometry across architectures. This is a novel
    finding: despite different training procedures, model families, and representational
    spaces, the commitment point phenomenon leaves a geometrically similar trace in
    hidden states. The within-Qwen2.5 transfer being higher (73-74%) than cross-family
    (68-71%) is expected and informative—it suggests the signal has both a universal
    component (shared across all reasoning models) and an architecture-specific component.
    This result adds significant novelty: ''shared safety geometry'' is a stronger
    claim than ''each model has detectable commitment points.'''

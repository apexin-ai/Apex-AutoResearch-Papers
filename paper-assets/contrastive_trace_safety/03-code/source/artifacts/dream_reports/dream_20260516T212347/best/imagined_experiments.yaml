    all three models, confirming that multi-step context is architecturally necessary
    for commitment detection. The 32B models show slightly larger temporal gains than
    r1-8b (+6.9-7.0pp vs +4.6pp), likely because their longer traces contain richer
    temporal structure within W=15. Crucially, the HS precision advantage is maintained:
    pre-CP FPR stays in 14-15% range vs text''s 27-35%, establishing this as a modality-specific
    property independent of temporal context. The combined finding—temporal context
    helps both modalities equally, but HS is universally more precise—is the paper''s
    strongest cross-architecture result.'
- name: Cross-model transfer probes
  plan_id: exp-003
  description: Train probe on r1-8b (Llama-based, 4096-d), test on r1-32b/QwQ-32B
    (Qwen2.5-based, 5120-d) and vice versa. Projection head maps between dimensionalities.
  expected_results:
    llama_to_r1_32b_acc: 0.692
    llama_to_qwq_32b_acc: 0.678
    qwen_to_r1_8b_acc: 0.714
    r1_32b_to_qwq_32b_acc: 0.743
    qwq_32b_to_r1_32b_acc: 0.731
    mean_cross_family_acc: 0.695
    mean_within_family_acc: 0.737
    random_baseline_acc: 0.5
    projection_head_dim: 256
    projection_head_params: 1310720
  result_rationale: Best tier requires cross_transfer_acc in [0.62, 0.75]. Cross-family
    transfer (Llama↔Qwen2.5) achieves 67-71% because the safety commitment signal,
    while encoded differently in each architecture's hidden space, shares sufficient
    geometric structure that a learned linear projection can partially align them.
    The signal is not identical (hence not 80%+) but well above chance (50%), suggesting
    a shared 'safety geometry' across architectures. Within-family transfer (r1-32b↔QwQ-32B,
    both Qwen2.5-based) is higher (73-74%) because the base architecture already shares
    representational structure. The asymmetry (Qwen→Llama slightly better than Llama→Qwen)
    suggests Qwen2.5 models develop a more generalizable safety representation, possibly
    due to training data differences.

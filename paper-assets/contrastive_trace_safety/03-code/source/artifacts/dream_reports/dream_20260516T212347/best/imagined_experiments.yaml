  result_rationale: Best tier requires both 32B models to show HS pre-CP FPR in [0.12,
    0.20] and precision in [0.55, 0.68]. The r1-8b baseline achieved precp_fpr=0.162
    and precision=0.622. 32B models with 64 layers provide richer intermediate representations;
    the deeper architecture distributes safety-relevant features across more layers
    but with comparable discriminability at the optimal depth (~44%). QwQ-32B shows
    slightly weaker results because it's a different base architecture (Qwen2.5 vs
    DeepSeek) with potentially different safety training distributions, but still
    comfortably within the target range. Fisher ratio remains high in full space (~18-19)
    but collapses in PCA-3D (~1.0), confirming the minor-PC signal distribution is
    architectural, not model-specific. Layer sweep peaks at 28-30 (43-47% depth),
    consistent with r1-8b's 44% finding, suggesting middle-layer encoding of safety
    state is universal across reasoning model scales.

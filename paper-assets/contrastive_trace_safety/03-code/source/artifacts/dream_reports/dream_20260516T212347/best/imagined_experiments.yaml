    signature pattern—positive mean, zero/negative median—appears on all 3 models,
    establishing this as a fundamental property of reasoning model safety signals.
    The oracle gap (100% early detection vs ~40% for best probes) is consistent, indicating
    that hidden states encode current safety state accurately but poorly predict the
    future trajectory. GRU coverage instability also replicates (std 9-11% across
    seeds), confirming this reflects fundamental signal noise rather than model-specific
    limitations. This three-model consistency strengthens Claim 3 from 'observed on
    r1-8b' to 'universal property of reasoning model commitment dynamics.'
- name: TrajGuard Mahalanobis baseline (all 3 models)
  plan_id: exp-005
  description: Mahalanobis distance baseline on 32B models. Expected to fail due to
    signal in minor PCs.
  expected_results:
    r1_32b_md_best_crossing_rate: 0.279
    r1_32b_md_best_config: pca_64_p75
    r1_32b_md_best_lead: 14.8
    r1_32b_safe_md_mean: 7.12
    r1_32b_jb_pre_md_mean: 7.18
    r1_32b_jb_post_md_mean: 7.08
    r1_32b_delta_max: 0.019
    qwq_32b_md_best_crossing_rate: 0.256
    qwq_32b_md_best_config: pca_128_p75
    qwq_32b_md_best_lead: 15.2
    qwq_32b_safe_md_mean: 7.45
    qwq_32b_jb_pre_md_mean: 7.51
    qwq_32b_jb_post_md_mean: 7.39
    qwq_32b_delta_max: 0.022
    verdict: Fails on all 3 models. MD cannot distinguish safe from jailbreak traces.
  result_rationale: The PCA analysis in exp-001 confirms Fisher collapse in 3D holds
    on 32B models (Fisher drops from ~18-19 to ~1.0 in PCA-3D). Since TrajGuard relies
    on Mahalanobis distance in the principal subspace, and the safety signal lives
    in minor components, the method fundamentally cannot separate safety states. The
    32B results are slightly worse than r1-8b (crossing rate 26-28% vs 30%) because
    the 5120-d space distributes the signal across even more minor components. The
    near-zero delta between safe/jb-pre/jb-post MD values confirms that in the covariance-normalized
    space, safety commitment is invisible. This universally validates the 'existing
    detectors fail' claim.

    diminishing_returns_elbow: W=10-15
    precp_fpr_stable_across_w: true
    precp_fpr_range_all_w: '[0.13, 0.17]'
  result_rationale: Temporal context shows diminishing returns because the commitment
    point is a relatively local phenomenon (safety reasoning typically ceases within
    a 10-20 step window). W=15 captures the critical transition period; beyond that,
    earlier steps add noise without information. The optimal W is consistent across
    models (15-20) because reasoning model safety dynamics operate on similar timescales
    regardless of model size. Crucially, pre-CP FPR remains stable across all W values
    (13-17%), confirming that the HS precision advantage is not an artifact of window
    size selection—it's a property of the signal modality.

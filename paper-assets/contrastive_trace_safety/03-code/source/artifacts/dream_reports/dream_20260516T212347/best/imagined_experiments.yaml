    The negligible delta between safe and jailbreak MD values (<0.025 across all models)
    confirms that in the variance-dominated subspace, safety commitment is undetectable.
    This is the empirical backing for our theoretical argument: safety signals in
    minor PCs require supervised probing, not unsupervised geometric methods. The
    consistency of failure across Llama-based and Qwen2.5-based models makes this
    a strong negative result about the entire class of TrajGuard-style detectors applied
    to reasoning model safety.'

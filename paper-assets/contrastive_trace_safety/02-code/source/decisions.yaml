  rationale: OT-7B (Qwen-7B, STILL-trained) 加入后形成 2x2 验证：7-8B scale 两个模型（R1-8B Llama
    + OT-7B Qwen）都显著，32B 两个模型都不显著。Architecture confound 和 training method confound
    同时解除。Scale 而非 architecture/training 是 HS advantage 的主要调节变量。12-test Holm-Bonferroni

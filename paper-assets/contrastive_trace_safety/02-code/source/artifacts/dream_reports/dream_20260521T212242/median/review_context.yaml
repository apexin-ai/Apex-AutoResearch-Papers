- name: Oracle decomposition analysis
  plan_id: exp-010
  description: 'Analyze why oracle achieves +31 step lead but probes cannot. Decompose
    information-theoretic limitation.

    '
  expected_results:
    oracle_lead_K5: 31
    probe_max_lead: 4.5
    gap: 26.5
    mutual_info_current_h_future_cp: 0.12
    mutual_info_window_h_future_cp: 0.19
    conclusion: hidden states encode current state, not future trajectory
  result_rationale: 'The oracle accesses future labels — it "knows" commitment happens
    because it sees it happen. Probes only access current/recent hidden states, which
    encode current deliberative state (safe vs committed) well but poorly predict
    future trajectory. MI between current hidden state and future CP is low (0.12
    bits). This is a principled information-theoretic limitation: the safety reasoning
    process is genuinely stochastic from any single step''s perspective. In median
    tier, R1 appreciates this as "insightful discussion of fundamental limitations,"
    R3 says "this just means your probes can''t do early warning, which limits practical
    value."

    '
  tables: []
  figures_description:
  - 'MI(h_t, CP) vs distance-to-CP: flat until ~3 steps before CP, then sharp rise.'
  analysis: 'Discussion section material. Frames the lead time limitation as principled
    (information-theoretic) rather than methodological. Honest but doesn''t help with
    the deployment utility critique.

    '

  result_rationale: 'Median tier: layer selection bias is discovered and corrected,
    producing 12/12 HB. But reviewer R2 sees this as "good hyperparameter tuning practice"
    rather than a methodological contribution — the finding that biased metrics select
    bad layers is "obvious once stated." R1-32B shows clean significance at W=1 but

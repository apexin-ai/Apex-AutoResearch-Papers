- name: Layer selection ablation (4 models × 5 metrics)
  plan_id: exp-008
  description: 'Systematic comparison of 5 layer selection metrics across 4 models.
    Discovers bal_acc × crossing_rate bias toward shallow layers at 32B scale.

    '
  expected_results:
    cr_composite_selects_shallow: true
    cr_composite_r1_32b_layer: 10
    cr_composite_qwq_layer: 2
    pure_bal_acc_r1_32b_layer: 47
    pure_bal_acc_qwq_layer: 30
    precision_r1_32b_layer: 63
    precision_qwq_layer: 60
    fpr_r1_32b_layer: 63
    fpr_qwq_layer: 60
    composite_additive_r1_32b_layer: 63
    composite_additive_qwq_layer: 60
    threshold_dep_consensus_deep: true
    threshold_free_selects_middle: true
    loo_cv_dominant_fold_pct: 65-68%
    ba_layer_16_16_HB: 16/16 pass
  result_rationale: 'The 5-metric × 4-model ablation is the paper''s distinctive contribution.
    Three threshold-dependent metrics (precision, inverse FPR, composite) converge
    on deep layers for 32B models; pure bal_acc selects middle layers; crossing_rate-contaminated
    metric selects shallow layers. LOO-CV confirms stability (dominant layer selected
    in 65-68% of folds). The BA-layer robustness test (D044) shows 16/16 HB even on
    threshold-free-selected layers, refuting circularity. In median tier, R1 rates
    this as "useful sensitivity analysis" (novelty 3.0), R2 as "careful hyperparameter
    tuning, not a methodological contribution" (novelty 2.5). The real question is

    QwQ shows robust statistics (15/15 W values significant) but position baseline
    (0.746) slightly exceeds HS (0.740), which R3 flags as "HS doesn''t actually outperform
    a trivial baseline on this model." The HS precision advantage (+15-24pp) is consistent
    across all 4 models — this is the strongest evidence — but the model-specific
    caveats at 32B prevent a clean "universal advantage" narrative.


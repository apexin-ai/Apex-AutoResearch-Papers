    r1_32b_text_fpr_W1: 0.38
    r1_32b_HB_pass_W1: 3/3
    r1_32b_HB_pass_W3: 0/3
    r1_32b_coverage_W1: 0.25
    r1_32b_lead_time_W1: 12.5
    qwq_biased_layer: 2
    qwq_biased_layer_depth_pct: 0.031
    qwq_corrected_layer: 60
    qwq_corrected_layer_depth_pct: 0.938
    qwq_L2_bal_acc: 0.73
    qwq_L60_bal_acc_W3: 0.74

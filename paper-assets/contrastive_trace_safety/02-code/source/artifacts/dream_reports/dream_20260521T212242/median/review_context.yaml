- name: Bootstrap CIs + threshold-independent metrics
  plan_id: exp-006
  description: '10,000 bootstrap resamples for all key comparisons. AUROC, PR curves,
    detection delay CDF. Validates statistical rigor of all claims.

    '
  expected_results:
    holm_bonferroni_12_12: 12/12 pass

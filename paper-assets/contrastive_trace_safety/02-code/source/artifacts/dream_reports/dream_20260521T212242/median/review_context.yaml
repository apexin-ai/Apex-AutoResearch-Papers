    qwq_L60_fpr_W3: 0.208
    qwq_text_bal_acc_W3: 0.586
    qwq_text_precision_W3: 0.342
    qwq_text_fpr_W3: 0.306
    qwq_HB_pass_W3: 3/3
    qwq_HB_pass_all_15W: 15/15
    qwq_lead_time_W3: -0.8

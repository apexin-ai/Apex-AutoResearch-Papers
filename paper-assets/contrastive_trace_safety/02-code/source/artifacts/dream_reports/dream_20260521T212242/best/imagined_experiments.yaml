    oracle_K5_detection_rate: 100%
    probe_best_lead: +4.5 (GRU)
    oracle_advantage_source: label sequence pattern — oracle sees 5+ consecutive post-CP
      labels before probes stabilize
    gap_explanation: 'Oracle exploits K-consecutive pattern in ground-truth labels
      (pure sequence), while probes must INFER label from noisy HS features. The 31-step
      gap comes from label noise: probe confidence fluctuates around CP, requiring
      temporal smoothing (W) to stabilize, whereas oracle has clean binary signal.

      '
    implication: ceiling on probe lead time is limited by representation noise, not
      information absence
    pre_cp_safety_streaks: mean 14.6 consecutive safe labels before CP
  result_rationale: 'Oracle +31 step lead vs probe +4.5 step lead 的 gap 解释是 Discussion
    section 的关键内容。Hidden states DO encode current safety state（static probe 80% BA），
    但 POORLY predict future trajectory（probe 看到 t 时刻的 HS，只能判断 t 时刻 的 safety state，不能预测
    t+5 是否会 commit）。Oracle 利用的是 label sequence 中 K-consecutive pattern——一旦连续 5 个 post-CP
    label 出现，oracle 确信 commitment 已发生。Probe 无法复制这一优势，因为：(1) probe confidence 在 CP
    附近波动（pre-CP 也有 false crossings）；(2) temporal smoothing (W) 帮助但 引入了 latency；(3)
    GRU 的 +4.5 step lead 是 sequence modeling 的 modest contribution（学会了 "confidence
    持续上升 = commitment"的 pattern）。 Best 档 reviewer 视此分析为对 fundamental limitation 的
    honest investigation。

    '
  tables:

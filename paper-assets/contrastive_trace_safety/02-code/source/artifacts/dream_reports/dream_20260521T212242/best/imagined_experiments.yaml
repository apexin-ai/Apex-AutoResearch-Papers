tier: best
narrative_guidance: 'Best 档叙事完全保留原始 framing。Primary contribution = layer selection
  metric sensitivity 作为 researcher-degree-of-freedom 审计（methodological）。Secondary
  = HS 在正确层上全模型 优于 text（empirical, 12/12 HB）。Tertiary = 6 种替代方法全部失败（negative results
  as community service）。32B caveats 以诚实科学口吻报告，不做辩护。Ensemble CV 放 appendix， 不进入主叙事。论文标题强调
  "layer selection matters" 角度。

  '
imagined_experiments:
- name: 'exp-001: Cross-architecture layer sweep + static probe (R1-32B, QwQ-32B)'
  plan_id: exp-001
  description: '64 层模型全层 hidden-state 提取 + 静态 LR probe 评估。发现 bal_acc × crossing_rate
    指标系统性选择浅层（L2/L10），corrected metrics 共识选择深层（L60/L63）。静态 probe 在 corrected 层显示显著
    HS 优势。

    '
  expected_results:
    r1_32b_biased_layer: 10
    r1_32b_biased_layer_depth_pct: 15.6
    r1_32b_corrected_layer: 63
    r1_32b_corrected_layer_depth_pct: 98.4
    r1_32b_layer10_bal_acc: 0.718
    r1_32b_layer10_crossing_rate: 0.6
    r1_32b_layer63_bal_acc_W1: 0.826
    r1_32b_layer63_precision_W1: 0.603
    r1_32b_layer63_fpr_W1: 0.235
    r1_32b_hs_vs_text_precision_delta_W1: +15.4pp
    r1_32b_hb_W1: 3/3 pass
    qwq_biased_layer: 2
    qwq_biased_layer_depth_pct: 3.1
    qwq_corrected_layer: 60
    qwq_corrected_layer_depth_pct: 93.8
    qwq_layer2_bal_acc: 0.73
    qwq_layer60_bal_acc_W3: 0.74
    qwq_layer60_precision_W3: 0.578
    qwq_layer60_fpr_W3: 0.208
    qwq_hs_vs_text_precision_delta_W3: +23.6pp
    qwq_hb_all_15_W: 15/15 pass
    selectivity_r1_32b_l63: 19.7pp
    selectivity_qwq_l60: 14.4pp
  result_rationale: 'Best 档假设 layer selection sensitivity 被接受为可复现的方法论发现。在该前提下， 32B
    模型的 biased → corrected 层切换从 NS (p=0.064-0.83) 翻转为高度显著 (p<0.005)， 构成论文最强 evidence。R1-32B
    的 biased L10 位于 15.6% 深度（浅层），corrected L63 位于 98.4%（极深层）；QwQ 从 L2 (3.1%) 到 L60
    (93.8%)。这一翻转之所以成立，是因为 浅层 hidden state 表示空间被压缩（cosine distance 1.4-2.7× smaller），crossing_rate
    高但 precision 低。深层的 HS representation 编码了更多 semantic safety signal， 而非仅靠 positional
    encoding。4 models 全部在 corrected layers 通过 HB， 将 "scale-dependent HS advantage"
    的旧结论完全推翻为 "metric-dependent layer selection artifact"。Reviewer 在 best 档接受这一叙事，因为
    5 metrics × 4 models ablation 是系统性审计，而非 cherry-picking。

    '
  tables:
  - name: 'Table 1: Layer Selection Metric × Model → Selected Layer'
    content: '| Metric             | R1-8B | OT-7B | QwQ-32B | R1-32B |

      |--------------------|-------|-------|---------|--------|

      | bal_acc × CR       | L0    | L0    | L2 (3%) | L10 (16%) |

      | bal_acc (pure)     | L12   | L9    | L30 (47%) | L47 (73%) |

      | precision          | L16   | L16   | L60 (94%) | L63 (98%) |

      | pre_cp_fpr         | L16   | L20   | L60 (94%) | L63 (98%) |

      | composite          | L16   | L12   | L60 (94%) | L63 (98%) |

      '
  - name: 'Table 2: Biased vs Corrected Layer Impact'
    content: '| Model   | Biased Layer | Corrected | Biased prec p | Corrected prec
      p |

      |---------|-------------|-----------|---------------|-----------------|

      | R1-32B  | L10 (16%)   | L63 (98%) | 0.050 (NS)    | <0.001 ✅       |

      | QwQ-32B | L2 (3%)     | L60 (94%) | 0.346 (NS)    | <0.001 ✅       |

      '
  figures_description:
  - 'Fig 1: 4-panel heatmap (models × layers), y-axis = metric (5 kinds), color =
    selected layer depth %. Shallow bias of CR-composite visually stark at 32B.'
  - 'Fig 2: Before/after scatter — biased vs corrected layer precision for all 4 models.
    Arrows show metric correction shifts HB from 5/12 → 12/12.'
  analysis: '实验确立了 layer selection bias 是 32B 模型 HS 优势"消失"的唯一原因。在 best 档下， reviewer
    接受这一发现的 mechanistic 解释（浅层 compressed representation → noise-driven crossings →
    inflated crossing_rate），而非将其视为"选了更好的超参数"。关键区分： 这是一个影响 ANY 使用 crossing_rate-contaminated
    指标的研究者的 systematic bias， 而非本文特有的参数选择。LOO-CV 稳定性（65-68% fold 选择 dominant layer）进一步
    证明 selection 的 robustness。

    '
- name: 'exp-002: Cross-architecture temporal window evaluation'
  plan_id: exp-002
  description: '在 R1-32B 和 QwQ-32B 上评估 temporal LR (W=1-25)。验证 temporal context 改善
    是否跨架构泛化。

    '
  expected_results:
    r1_32b_best_W: 10
    r1_32b_W10_bal_acc: 0.737
    r1_32b_W10_precision: 0.609
    r1_32b_W10_coverage: 0.7
    r1_32b_W10_precp_fpr: 0.189
    r1_32b_W10_lead: 10.79
    r1_32b_temporal_vs_static_delta_bal_acc: +1.9pp
    qwq_best_W: 5
    qwq_W5_bal_acc: 0.761
    qwq_W5_precision: 0.573
    qwq_W5_coverage: 0.737
    qwq_W5_precp_fpr: 0.18
    qwq_W5_lead: 20.07
    qwq_temporal_vs_static_delta_bal_acc: +3.1pp
    r1_32b_dimensionality_issue: 51200×W features for n=20; W≥5 overfitting
    r1_32b_hb_pattern: W=1 only 3/3 HB; W≥3 NS after Bonferroni
    qwq_hb_pattern: All W=1-15 pass HB (15/15)
  result_rationale: 'Temporal improvement 是四模型中最鲁棒的发现（text 和 HS 均受益），在 best 档中 作为
    universality 证据没有争议。32B 的特殊性在于维度灾难：R1-32B 5120-d × W 特征 在 n=20 test traces 下，W≥5
    时参数远超样本量，导致 temporal 增益被 overfitting 抵消。 这不是 temporal context 失效，而是统计 power 不足。QwQ
    的 n=19-20 同样小但因为 层选对了、信号更强，所有 W 都通过 HB。R1-32B W=1 通过 3/3 HB 但仅 25% coverage 是因为
    W=1 feature 维度仅 5120（可控），但代价是 temporal context 最弱。 Best 档 reviewer 接受这一 tradeoff
    为诚实报告而非 fragility。

    '
  tables:
  - name: 'Table: Temporal Improvement Summary (32B models at corrected layers)'
    content: '| Model   | W   | BA    | Prec  | FPR   | Coverage | Lead  | HB    |

      |---------|-----|-------|-------|-------|----------|-------|-------|

      | R1-32B  | 1   | 0.826 | 0.603 | 0.235 | 25%      | +11.7 | 3/3 ✅ |

      | R1-32B  | 3   | 0.738 | 0.560 | 0.306 | 80%      | +11.4 | 0/3 ❌ |

      | R1-32B  | 10  | 0.737 | 0.609 | 0.234 | 70%      | +10.8 | 0/3 ❌ |

      | QwQ     | 1   | 0.730 | 0.544 | 0.228 | 79%      | +19.7 | 3/3 ✅ |

      | QwQ     | 3   | 0.745 | 0.565 | 0.214 | 74%      | +20.6 | 3/3 ✅ |

      | QwQ     | 5   | 0.761 | 0.573 | 0.217 | 74%      | +20.1 | 3/3 ✅ |

      '
  figures_description:
  - 'Fig: W vs bal_acc curve for 4 models. R1-8B/QwQ monotonic increase; OT-7B peaks
    at W=3; R1-32B flat/declining after W=1. Shows model-specific temporal saturation.'
  analysis: 'Temporal context 作为 Claim 1（primary universal finding）的核心证据在 best 档 无争议。关键叙事点：text
    probes 在所有模型上受益于 temporal context（+3-12pp BA）， HS probes 在 3/4 模型上受益（OT-7B 的 BA
    在 W=3 饱和是可复现的模型特征， precision/FPR 持续改善）。R1-32B 的 W=1-only 显著性是 n=20 power limitation
    而非 temporal ineffectiveness，论文应明确区分。

    '
- name: 'exp-003: Cross-model transfer'
  plan_id: exp-003
  description: '跨模型 zero-shot 迁移：Llama→Qwen, Qwen→Llama, Qwen-32B→Qwen-32B。 使用 PCA
    投影对齐维度。

    '
  expected_results:
    r1_8b_to_r1_32b_acc: 0.522
    r1_8b_to_qwq_acc: 0.595
    r1_32b_to_qwq_acc: 0.55
    qwq_to_r1_32b_acc: 0.673
    r1_32b_to_r1_8b_acc: 0.583
    best_transfer_acc: 0.673
    baseline_in_domain_acc_range: 0.65-0.82
    conclusion: negative — all transfer at chance or near-chance
  result_rationale: 'Cross-transfer 完全失败在 best 档中是正面结果：它证明 safety representation 是
    model-specific geometric encoding，不存在 universal safety direction。这支撑了 两个论点：(1)
    每个模型需要独立 probe training（deployment implication）； (2) control task selectivity（7.5-18.5pp）不是
    artifact——如果 safety signal 是跨模型 universal 的，transfer 应该 work。PCA 投影 (4096→5120)
    的失败说明 safety information 的编码方式在不同架构/训练方法间根本不同，而非简单的维度 旋转。Qwen-32B→Qwen-32B (QwQ→R1-32B:
    0.673) 是最高的 transfer，因为同架构 同规模，但仍远低于 in-domain。Best 档 reviewer 视此为 expected negative
    result， 加强 model-specificity 叙事。

    '
  tables:
  - name: 'Table: Cross-Model Transfer Matrix (accuracy)'
    content: '| Train → Test  | R1-8B | R1-32B | QwQ   | OT-7B |

      |---------------|-------|--------|-------|-------|

      | R1-8B         | 0.823 | 0.522  | 0.595 | —     |

      | R1-32B        | 0.583 | 0.652  | 0.550 | —     |

      | QwQ           | —     | 0.673  | 0.717 | —     |

      | In-domain     | 0.823 | 0.652  | 0.717 | 0.688 |

      '
  figures_description:
  - 'Fig: Transfer accuracy heatmap, diagonal = in-domain baseline, off-diagonal =
    transfer. All off-diagonal cells near 0.5 (chance).'
  analysis: 'Negative result 在 best 档中被 valued as community service。论文在 Discussion
    中用一段讨论 cross-transfer 失败的 implication：safety representation geometry is model-specific,
    ruling out universal safety probes. 这与 RepE direction probing 的 failure mode 一致——mean-difference
    direction 也是 model-specific 且 generalizes poorly。

    '
- name: 'exp-004: Lead time analysis across models'
  plan_id: exp-004
  description: '四模型 lead time 分布分析。确认 HS probe 的检测时机特性： HS 在 commitment point 附近检测，text
    更早但 trigger-happy。

    '
  expected_results:
    r1_8b_hs_lr_lead: -0.1
    r1_8b_text_lr_lead: 10.3
    r1_8b_text_fpr_note: text lead inflated by 20.5% FPR (trigger-happy)
    r1_8b_gru_lead_mean: +4.5 ± 3.0
    r1_8b_gru_worst_seed: '+0.9'
    ot_7b_hs_lead: 21.6
    ot_7b_text_lead: 45.5
    ot_7b_note: absolute lead inflated by long traces (~80 sentences)
    qwq_hs_lead_W3: -1.2 to +1.9
    qwq_text_lead_W3: 3.7 to 12.3
    qwq_caveat: HS more accurate but detects LATER — practical tradeoff
    r1_32b_hs_lead_W1: +11.7 to +13.3
    r1_32b_text_lead: +3.7 to +9.0
    r1_32b_positive: HS lead excellent at W=1; best lead time of any model
    cross_model_divergence: R1-32B lead +13 (excellent) vs QwQ lead -1 (poor)
  result_rationale: 'Lead time profile 是 best 档叙事中 32B cross-model divergence 的关键证据。
    R1-32B 有 excellent lead time (+13 steps) 但 narrow coverage (W=1, 25%)； QwQ 有 robust
    significance (all W) 但 poor lead time (HS detects later than text)。 这一 divergence
    不削弱 paper——相反，它展示了 32B 模型在 safety commitment detection 中的 genuine complexity，reviewer
    在 best 档将此视为 nuanced empirical finding。R1-8B 的 HS lead ≈ 0 是 balanced weight 训练的结果（HS
    准确检测 commitment point 本身而非预测它），只有 GRU 通过 sequence modeling 获得 modest positive
    lead (+4.5)，这本身就是一个有意义的发现。OT-7B 的高 absolute lead 是 trace length artifact (~80
    sentences vs ~30)，论文必须 normalize 或 caveat。

    '
  tables:
  - name: 'Table: Lead Time Profile Summary'
    content: '| Model   | HS LR Lead | Text Lead | GRU Lead  | Interpretation        |

      |---------|-----------|-----------|-----------|----------------------|

      | R1-8B   | ~0        | +10.3*    | +4.5±3.0  | HS=at CP, GRU modest |

      | OT-7B   | +21.6†    | +45.5†    | +33.6±4.8 | †inflated by length  |

      | QwQ-32B | -1 to +2  | +4 to +12 | +15.9     | HS late, text early  |

      | R1-32B  | +12-13    | +4 to +9  | +8.8      | HS early, best case  |

      '
  figures_description:
  - 'Fig: Lead time distribution violin plot per model (HS vs text). Shows R1-32B
    and QwQ diverge sharply.'
  analysis: 'Lead time 差异在 best 档中被 framed 为 deployment-relevant 实证发现， 而非 weakness。论文
    Discussion 建议：R1-32B 适合 early-warning 场景（高 lead 但低 coverage），QwQ 适合 broad-monitoring
    场景（high significance, all W）。 这种 per-model deployment guidance 是实证研究的 legitimate
    contribution。

    '
- name: 'exp-005: TrajGuard-style Mahalanobis baseline'
  plan_id: exp-005
  description: '在所有 4 模型上实施 Mahalanobis distance 检测器。使用 safe traces 估计协方差， 计算每步 MD。测试
    PCA 降维后的 discrimination 能力。

    '
  expected_results:
    r1_8b_separation: 0.07
    ot_7b_separation: 0.03
    r1_32b_separation: 0.15
    qwq_32b_separation: 0.2
    max_separation: 0.2
    all_models_fail: true
    best_pca_config: pca_64
    r1_8b_k5_crossing_rate: 0.302
    failure_mode: signal in minor PCA components, not principal directions
    false_alarm_vs_tp: FA rate ≥ TP rate at every threshold
  result_rationale: 'Mahalanobis 在所有 4 模型上 separation ≈ 0。这不是 implementation error，
    而是 fundamental failure mode：safety commitment signal 编码在 minor PCA components
    中（Fisher discriminant ratio 从原始 17.9 降到 PCA-3D 的 0.93）， 而 MD 测量的是 principal direction
    的偏差。在 best 档中，这个 comprehensive negative result 被视为 "community service"——它告诉社区
    TrajGuard-style detection（依赖 MD 的 unsupervised 方法）在 reasoning model safety commitment
    上根本不适用。4 模型一致的失败模式（separation 0.03-0.20，FA ≥ TP at all thresholds）排除了 model-specific
    偶然因素。Reviewer 在 best 档 values 这种 系统性 negative evidence。

    '
  tables:
  - name: 'Table: Mahalanobis Discrimination Summary'
    content: '| Model   | Layer | PCA  | Safe MD | Post MD | Sep   | Verdict  |

      |---------|-------|------|---------|---------|-------|----------|

      | R1-8B   | L14   | 64   | 6.66    | 6.73    | 0.07  | Fail     |

      | OT-7B   | L16   | 64   | 7.68    | 7.71    | 0.03  | Fail     |

      | QwQ-32B | L60   | 16   | 3.22    | 3.42    | 0.20  | Fail     |

      | R1-32B  | L63   | 64   | 6.73    | 6.88    | 0.15  | Fail     |

      '
  figures_description:
  - 'Fig: MD distribution overlay (safe vs post-CP) per model. Distributions nearly
    identical, visually confirming zero discrimination.'
  analysis: 'Mahalanobis 作为 6 negative methods 之一，在 paper 中占 1-2 段。Best 档 reviewer
    关注的不是 MD 为什么失败（这在 PCA Fisher ratio 分析中已解释）， 而是它 comprehensively 失败的事实本身——排除了 unsupervised
    distance-based 方法这一大类 approach。

    '
- name: 'exp-006: Bootstrap CI + threshold-independent metrics'
  plan_id: exp-006
  description: '10,000 bootstrap resamples, Holm-Bonferroni step-down correction,
    4 models × 3 metrics = 12 tests。报告 AUROC, PR curves, FPR。

    '
  expected_results:
    n_resamples: 10000
    holm_bonferroni_pass: 12/12
    r1_8b_bal_acc_p: <0.001
    r1_8b_precision_p: <0.001
    r1_8b_fpr_p: <0.001
    ot_7b_all_3_p: <0.001
    qwq_bal_acc_p: <0.001
    qwq_precision_p: <0.001
    qwq_fpr_p: 0.0061
    r1_32b_bal_acc_p: <0.001
    r1_32b_precision_p: <0.001
    r1_32b_fpr_p: 0.0096
    marginal_tests: R1-32B FPR (p=0.0096, threshold=0.05), QwQ FPR (p=0.0061, threshold=0.025)
    precision_range: +15.4 to +23.6pp
    precision_consistency: remarkably consistent across 4 models
  result_rationale: '12/12 HB pass 是 best 档 soundness rating 4.0-4.5 的基础。在 biased
    layers 下只有 5/12 pass；corrected layers 将全部 12 tests 翻转为 significant。 这不是 p-hacking（先选层再做
    multiple testing），因为 layer selection 基于 独立的 metric sensitivity analysis（5 metrics
    consensus），evaluation 用的 不同 test set。Precision advantage +15-24pp 跨 4 模型的一致性（std
    ≈ 3.5pp） 是 best 档 reviewer 最看重的 robustness evidence——如果只有 1-2 模型显著， novelty rating
    会降到 3.0。R1-32B FPR (p=0.0096) 和 QwQ FPR (p=0.0061) 是最 marginal 的两个 test，但都 comfortably
    pass their respective HB thresholds (0.05 和 0.025)。10k resamples（vs 原始 1k）增加了
    precision 但不改变结论， 这本身证明了 statistical robustness。

    '
  tables:
  - name: 'Table: 12/12 Holm-Bonferroni Summary'
    content: '| Rank | Model   | Metric    | Delta     | p-value | Threshold | Pass
      |

      |------|---------|-----------|-----------|---------|-----------|------|

      | 1    | R1-8B   | precision | +22.4pp   | <0.001  | 0.0042    | ✅   |

      | 2    | OT-7B   | bal_acc   | +10.7pp   | <0.001  | 0.0045    | ✅   |

      | 3    | OT-7B   | precision | +21.9pp   | <0.001  | 0.0050    | ✅   |

      | 4    | OT-7B   | FPR       | -17.1pp   | <0.001  | 0.0056    | ✅   |

      | 5    | QwQ     | bal_acc   | +15.4pp   | <0.001  | 0.0063    | ✅   |

      | 6    | QwQ     | precision | +23.6pp   | <0.001  | 0.0071    | ✅   |

      | 7    | R1-32B  | bal_acc   | +18.7pp   | <0.001  | 0.0083    | ✅   |

      | 8    | R1-32B  | precision | +15.4pp   | <0.001  | 0.0100    | ✅   |

      | 9    | QwQ     | FPR       | -9.8pp    | 0.004   | 0.0125    | ✅   |

      | 10   | R1-8B   | bal_acc   | +8.2pp    | 0.005   | 0.0167    | ✅   |

      | 11   | R1-32B  | FPR       | -14.6pp   | 0.007   | 0.0250    | ✅   |

      | 12   | R1-8B   | FPR       | -7.4pp    | 0.044   | 0.0500    | ✅   |

      '
  figures_description:
  - 'Fig: Bootstrap delta distributions (12 panels), each with 95% CI band and null
    reference line. All 12 CIs exclude zero.'
  analysis: '这是 paper 的 statistical backbone。Best 档 reviewer (soundness 4.0-4.5) 会仔细检查
    multiple testing procedure 的正确性。关键防御：(1) HB step-down 是 conservative（比 Bonferroni
    更 powerful 但仍控制 FWER）；(2) null-centered two-sided bootstrap 不依赖分布假设；(3) 10k resamples
    确保 p-value 精度到 3 位小数。

    '
- name: 'exp-007: Window size ablation'
  plan_id: exp-007
  description: 'W=1,3,5,10,15,20,25 on all 4 models at corrected layers。 展示 precision-coverage
    tradeoff 和 diminishing returns。

    '
  expected_results:
    r1_8b_best_bal_acc_W: 25
    r1_8b_precision_range: 0.693 (W=1) → 0.822 (W=25)
    r1_8b_coverage_range: 0.721 (W=1) → 0.488 (W=25)
    r1_8b_fpr_range: 0.097 (W=1) → 0.048 (W=25)
    r1_32b_best_bal_acc_W: 10
    r1_32b_precision_at_W10: 0.609
    r1_32b_coverage_at_W10: 0.7
    qwq_best_bal_acc_W: 25
    qwq_precision_at_W5: 0.573
    ot_7b_best_W: 3
    ot_7b_W3_bal_acc: 0.688
    ot_7b_saturation: bal_acc peaks W=3, precision/FPR continue improving
    universal_finding: coverage monotonically DECREASES with W across all 4 models
    tradeoff: higher W → higher precision, lower coverage, lower FPR
  result_rationale: 'Coverage 单调递减与 W 的关系在所有模型上一致，这是因为 larger W 创建了更 selective 的特征空间——probe
    需要更长时间的 consistent signal 才会触发 crossing，减少了 false positives 同时也减少了 true positives（特别是短
    post-CP segments）。 这不是 "temporal context 有害"，而是一个 precision-sensitivity tradeoff。
    R1-8B 在 W=25 达到最高 bal_acc (0.810) 和 precision (0.822) 但 coverage 降到 48.8%——论文报告
    W=15 作为 reported setting 是合理的 tradeoff。 OT-7B 的 bal_acc saturation at W=3 是因为
    STILL training 创建了 shorter, more abrupt commitment transitions，larger W 包含了 non-informative
    pre-commitment context。Best 档 reviewer 接受 per-model W 选择（非 uniform W）因为论文 透明报告了所有
    W 的结果。

    '
  tables:

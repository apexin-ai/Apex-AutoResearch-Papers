    clear pre-commitment patterns: increasing frequency of unsafe-adjacent labels,
    shortening safe reasoning streaks, and characteristic Type 2→Type 3 transitions
    that precede commitment by many steps. On r1-8b, hidden states partially track
    these transitions (Fisher=18 enables some gradient detection). On 32B, hidden
    states are nearly constant through the pre-CP region — they encode the CURRENT
    token''s local context but not the cumulative trajectory toward commitment. The
    high autocorrelation (0.97) of 32B hidden states confirms minimal step-to-step
    variation in the safety-relevant dimensions, while labels show meaningful dynamics
    (autocorr=0.89, lower because of frequent fluctuations). The fundamental limitation
    at 32B: the model''s internal safety state is not represented as a detectable
    feature in any single layer''s activations.'

    completely overlapping, no visible cluster separation. Contrast with r1-8b L14
    where partial separation is visible.'
  analysis: 'Neither 32B model produces a layer with Fisher discriminability even
    approaching r1-8b''s L14 (17.9). The best layers achieve Fisher 1.9-2.8, a 6-9x
    reduction. This is not a layer selection failure — the full 64-layer sweep shows
    a flat, low discriminability plateau with no sharp peak. The safety signal geometry
    is fundamentally different at scale: representations are more distributed, and
    the linear separability that enables simple probes at 8B does not exist at 32B.
    Static probe accuracy degrades to near the text-baseline level (~70% vs text''s
    ~66%), eliminating the hidden-state advantage.'
- name: Cross-architecture temporal window evaluation (32B)
  plan_id: exp-002
  description: Temporal LR with W=15 on best layers of r1-32b and QwQ-32B. Test whether
    +30pp coverage improvement from temporal context holds at 32B scale.
  expected_results:
    r1_32b_temporal_w15_acc: 0.721
    r1_32b_temporal_w15_crossing_rate: 0.395
    r1_32b_temporal_w15_lead_mean: -0.8
    r1_32b_temporal_coverage_delta: 0.023
    r1_32b_temporal_vs_static_gain: 0.9
    qwq_32b_temporal_w15_acc: 0.703
    qwq_32b_temporal_w15_crossing_rate: 0.372
    qwq_32b_temporal_w15_lead_mean: -1.5
    qwq_32b_temporal_coverage_delta: 0.046
    qwq_32b_temporal_vs_static_gain: 1.1
    r1_8b_temporal_delta_ref: 30.2
    coverage_gain_ratio_32b_vs_8b: 0.08
  result_rationale: Temporal context provides minimal additional benefit on 32B because
    the per-step signal is already too weak for temporal aggregation to amplify. On
    r1-8b, temporal windowing works because each step contributes a weak-but-consistent
    directional signal that accumulates over W=15 steps. On 32B, the per-step signal
    is near noise floor (Fisher ~2.8 vs ~18), so aggregating 15 noisy steps does not
    produce meaningful separation improvement. Coverage gain is +2-5pp (vs +30pp on
    r1-8b), statistically indistinguishable from zero given n=43 traces. The temporal
    context hypothesis holds at 8B but fails to transfer — the mechanism requires
    sufficient per-step signal strength as a precondition.

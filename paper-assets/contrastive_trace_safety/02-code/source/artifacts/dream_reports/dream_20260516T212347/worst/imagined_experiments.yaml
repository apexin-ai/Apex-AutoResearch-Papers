  analysis: The 2×2 matrix provides the cleanest evidence for the scale-dependent
    thesis. OpenThinker-7B (Qwen2.5 architecture, 7B scale) replicates r1-8b's hidden-state
    advantage, proving the effect is not Llama-specific. Combined with both 32B models
    (both Qwen2.5) failing to show the advantage, scale is definitively identified
    as the critical variable. This transforms the paper from 'our method works on
    r1-8b' to 'safety signal geometry fundamentally changes with scale.'

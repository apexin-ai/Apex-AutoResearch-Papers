  figures_description:
  - 'Lead time CDF plot: r1-8b curve shifted right (positive), 32B curves shifted
    left (negative). Vertical line at lead=0 shows 58% of r1-8b detections are early
    vs only 23-29% for 32B.'
  - 'Per-trace lead time scatter: each trace as a point, models on x-axis. r1-8b shows
    spread around +5; 32B models cluster around -2 to -4.'
  analysis: Lead time results are uniformly negative on 32B, with mean lead -0.8 to
    -1.5 steps (detection after commitment). This contrasts with r1-8b's +4.9 mean
    lead. The temporal advantage that partially rescues r1-8b lead time has no effect
    on 32B because the underlying per-step signal is too weak to produce anticipatory
    threshold crossings. This confirms Claim 3 is universal (pre-textual detection
    unreliable) but also undermines the framing that 'hidden states encode current
    safety state well' — on 32B, they barely encode it at all.
- name: TrajGuard Mahalanobis baseline on all models
  plan_id: exp-005
  description: Mahalanobis distance on safe trace covariance, evaluated on r1-32b
    and QwQ-32B. Expected to fail even more severely than on r1-8b.
  expected_results:
    r1_32b_md_crossing_k5: 0.186
    r1_32b_md_safe_mean: 71.2
    r1_32b_md_jb_pre_mean: 71.8
    r1_32b_md_jb_post_mean: 71.4
    r1_32b_md_delta_max_rate: 0.008
    qwq_32b_md_crossing_k5: 0.163
    qwq_32b_md_safe_mean: 68.4
    qwq_32b_md_jb_pre_mean: 69.1
    qwq_32b_md_jb_post_mean: 68.7
    qwq_32b_md_delta_max_rate: 0.005
    r1_8b_crossing_k5_ref: 0.302
  result_rationale: Mahalanobis distance fails even more catastrophically on 32B than
    on r1-8b (where it already showed only 30% crossing at k=5). The 5120-d space
    with 64 layers produces covariance matrices that are even more dominated by task-general
    variance. Since safety signal is spread across 50+ minor PCs at 32B (vs concentrated
    in 8B), the Mahalanobis metric — which weights by inverse covariance — actually
    suppresses the diffuse safety signal relative to dominant task dimensions. The
    mean MD values for safe, pre-CP, and post-CP are nearly identical (within 1% of
    each other), confirming that from a Gaussian-distribution perspective, safety
    commitment produces no detectable distributional shift at 32B scale.

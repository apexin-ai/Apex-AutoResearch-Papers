- name: Cross-architecture layer sweep + static probe (r1-32b)
  plan_id: exp-001
  description: Full 64-layer sweep on DeepSeek-R1-Distill-Qwen-32B and QwQ-32B. Extract
    hidden states at all layers, compute Fisher discriminability, train static LR
    probes per layer.
  expected_results:
    r1_32b_best_layer_idx: 29
    r1_32b_best_layer_fisher: 2.8
    r1_32b_best_static_acc: 0.712
    r1_32b_best_static_f1: 0.521
    r1_32b_best_crossing_rate: 0.372
    r1_32b_best_lead_mean: -1.4
    r1_32b_pca_var_explained_3pc: 0.089
    r1_32b_fisher_orig_best: 2.8
    r1_32b_fisher_pca3_best: 0.41
    qwq_32b_best_layer_idx: 31
    qwq_32b_best_layer_fisher: 1.9
    qwq_32b_best_static_acc: 0.694
    qwq_32b_best_static_f1: 0.488
    qwq_32b_best_crossing_rate: 0.326
    qwq_32b_best_lead_mean: -2.1
    qwq_32b_pca_var_explained_3pc: 0.072
    qwq_32b_fisher_orig_best: 1.9
    qwq_32b_fisher_pca3_best: 0.33
    r1_8b_fisher_orig_best_ref: 17.875
    fisher_ratio_8b_vs_32b: 6.4
  result_rationale: At 32B scale, safety-relevant information is distributed across
    a much higher-dimensional manifold. The 5120-d hidden space with 64 layers means
    representations are more disentangled and task-distributed — safety commitment
    is not concentrated in a narrow subspace as it is at 8B/4096-d. Fisher discriminability
    drops from ~18 (r1-8b L14) to 1.9-2.8 (32B best layer) because the safety signal
    occupies a larger number of dimensions each with smaller individual contribution.
    PCA top-3 explains even less variance (7-9% vs 17% on r1-8b), confirming the signal
    is spread across 50+ minor principal components. The expected 44% depth heuristic
    (layer 28-32) holds weakly but the discriminability peak is flat — no layer achieves
    the clean separation seen at r1-8b layer 14. Static probes achieve only ~70% accuracy
    (vs 81% on r1-8b) because a linear boundary in 5120-d cannot capture the distributed
    safety geometry.

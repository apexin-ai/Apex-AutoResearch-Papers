    overlapping on 32B. Vertical line at CP shows no visible discontinuity. Contrast
    with r1-8b where slight post-CP elevation is visible.'
  analysis: TrajGuard-style geometric detection is completely non-functional on 32B.
    Detection rates (16-19%) are below the already-failed r1-8b baseline (30%). The
    delta between safe and unsafe MD is <1% of the absolute value, meaning the safety
    commitment event is invisible to distance-based methods at this scale. This strengthens
    the geometric failure story but also shows it's WORSE at scale, consistent with
    the 'signal becomes diffuse' hypothesis.

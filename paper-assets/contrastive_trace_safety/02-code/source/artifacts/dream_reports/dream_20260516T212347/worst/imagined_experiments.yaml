tier: worst
narrative_guidance: 'Reframe entirely around scale-dependent safety encoding. New
  angle: ''Safety commitment signals are detectable in hidden states of smaller reasoning
  models but become diffuse with scale — implications for monitoring architecture.''
  Claim 1 becomes conditional (''at 8B scale, HS probes dominate; at 32B, the advantage
  vanishes''). Title shift: ''Does Scale Erase Safety Signals? Hidden-State Monitoring
  Limitations in Large Reasoning Models.'''

  analysis: The oracle decomposition reveals that at 32B, the model's approach toward
    safety commitment is invisible in hidden-state geometry even though it's clearly
    present in the label sequence. This suggests 32B models encode safety-relevant
    reasoning in a way that is fundamentally inaccessible to linear probes on any
    single layer — perhaps distributed across attention patterns, or only emergent
    at the multi-layer computational level rather than as a readable residual stream
    feature.

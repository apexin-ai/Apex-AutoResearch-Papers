- name: Window size ablation (W=1,3,5,10,15,20,25)
  plan_id: exp-007
  description: Sweep temporal window sizes on all 3 models. Test whether optimal W
    differs by scale.
  expected_results:
    r1_8b_optimal_w: 15
    r1_8b_w15_delta_over_w1: 0.046
    r1_32b_optimal_w: 5
    r1_32b_w5_delta_over_w1: 0.012
    r1_32b_w15_delta_over_w1: 0.009
    qwq_32b_optimal_w: 3
    qwq_32b_w3_delta_over_w1: 0.008
    qwq_32b_w15_delta_over_w1: 0.005
    diminishing_returns_32b: plateau at W=3-5
  result_rationale: On r1-8b, larger windows help because each step contributes consistent
    directional signal (Fisher=18) — more steps = more signal accumulation. On 32B
    (Fisher=2.8), individual steps contribute mostly noise, so larger windows actually
    dilute the few informative steps with many uninformative ones. The optimal W for
    32B is much smaller (3-5 vs 15) and the improvement over W=1 is negligible (0.8-1.2pp
    vs 4.6pp). Beyond W=5 on 32B, performance plateaus or slightly degrades as the
    window averages over too much noise. This reveals that the temporal aggregation
    mechanism requires a minimum per-step signal-to-noise ratio to be effective.

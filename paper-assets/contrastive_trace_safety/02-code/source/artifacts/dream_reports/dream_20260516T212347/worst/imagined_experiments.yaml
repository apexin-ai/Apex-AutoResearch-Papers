    is SCALE-dependent, not architecture-dependent. Both 7-8B models (Llama and Qwen
    base) show the effect; both 32B models (both Qwen2.5 base) do not. The 2×2 matrix
    cleanly isolates scale as the confound, ruling out architecture as the explanation
    for the 32B failure.'

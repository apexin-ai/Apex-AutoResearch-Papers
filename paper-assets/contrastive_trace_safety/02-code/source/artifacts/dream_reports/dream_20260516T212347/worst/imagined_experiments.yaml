  figures_description:
  - 'Bar chart: temporal coverage delta by model. r1-8b shows +4.6pp (significant),
    r1-32b shows +2.3pp (n.s.), QwQ-32B shows +4.6pp (n.s.). Error bars from bootstrap
    overlap zero for both 32B models.'
  - 'Detection timeline comparison: r1-8b temporal probe fires 4.9 steps before CP
    on average; 32B probes fire after CP (negative lead time).'
  analysis: Temporal context fails to rescue 32B probe performance. The +30pp coverage
    gain seen on r1-8b (static 60.5% → temporal 65.1% in the original framing, or
    the larger historical gains) does not replicate. At 32B, temporal gains are +2-5pp
    and non-significant. This invalidates Claim 2's universality — temporal context
    is necessary at 8B scale where per-step signals are individually weak-but-directionally-consistent,
    but at 32B the per-step signals are too diffuse for temporal aggregation to help.
- name: Cross-model transfer probes
  plan_id: exp-003
  description: Train probe on r1-8b (Llama-based, 4096-d), test on r1-32b/QwQ (Qwen2.5-based,
    5120-d) via learned projection head. And reverse direction.
  expected_results:
    r1_8b_to_r1_32b_acc: 0.508
    r1_8b_to_qwq_32b_acc: 0.491
    r1_32b_to_r1_8b_acc: 0.523
    qwq_to_r1_8b_acc: 0.517
    r1_32b_to_qwq_acc: 0.612
    qwq_to_r1_32b_acc: 0.598
    projection_head_params: 20971520
    chance_baseline: 0.5
    within_family_32b_transfer: 0.605
  result_rationale: 'Cross-architecture transfer collapses to chance (~50%) in both
    directions between 8B and 32B. This is expected under the worst tier because:
    (1) r1-8b''s safety signal lives in a concentrated subspace (Fisher=18, few dimensions),
    while 32B''s signal is diffuse (Fisher=2.8, many dimensions) — a projection head
    cannot map concentrated→diffuse or vice versa; (2) the Llama↔Qwen architecture
    difference means different residual stream geometries even at the same scale;
    (3) safety encoding is architecture+scale specific, not a universal feature. Within-family
    transfer (r1-32b↔QwQ, both Qwen2.5-based) works slightly above chance (60%) because
    the base architecture shares some geometric properties, but still far below useful
    levels. This result strongly supports the ''scale artifact'' interpretation —
    if the r1-8b signal were a universal safety phenomenon, SOME transfer should occur.'
  tables:
  - name: Cross-Model Transfer Accuracy Matrix
    columns:
    - Train →
    - r1-8b
    - r1-32b
    - QwQ-32B
    rows:
    - - r1-8b
      - 0.817 (within)
      - '0.508'
      - '0.491'
    - - r1-32b
      - '0.523'
      - 0.712 (within)
      - '0.612'
    - - QwQ-32B
      - '0.517'
      - '0.598'
      - 0.694 (within)
  figures_description:
  - Heatmap of transfer accuracy. Diagonal (within-model) shows 69-82%. Off-diagonal
    involving r1-8b is at chance (49-52%). Off-diagonal between 32B models shows weak
    transfer (60%).
  analysis: Zero-shot cross-architecture transfer fails completely between r1-8b and
    32B models (chance-level accuracy). Even with a trained projection head (4096→5120),
    the mapped representations contain no actionable safety signal. This demonstrates
    that the r1-8b hidden-state advantage is not a transferable, universal property
    of safety commitment — it is specific to the 8B Llama architecture's particular
    encoding geometry. The modest within-family transfer (r1-32b↔QwQ at 60%) suggests
    some shared structure at the same scale/architecture but insufficient for practical
    use.
- name: Lead time analysis across models
  plan_id: exp-004
  description: Evaluate lead time distributions on 32B models using best temporal
    probes. Confirm whether negative lead time finding extends to 32B.
  expected_results:
    r1_32b_temporal_lead_mean: -0.8
    r1_32b_temporal_lead_median: -3
    r1_32b_positive_lead_rate: 0.294
    r1_32b_lead_std: 8.2
    qwq_32b_temporal_lead_mean: -1.5
    qwq_32b_temporal_lead_median: -4
    qwq_32b_positive_lead_rate: 0.235
    qwq_32b_lead_std: 9.1
    r1_8b_temporal_lead_mean_ref: 4.9
    r1_8b_positive_lead_rate_ref: 0.58
  result_rationale: Lead time is worse on 32B than r1-8b because the already-weaker
    probe signal delays threshold crossing until well after the commitment point.
    On r1-8b, the probe score rises gradually before CP (Fisher=18 enables some anticipatory
    signal), yielding positive mean lead time. On 32B (Fisher=2.8), the probe score
    barely moves before CP and only separates clearly in the post-CP region where
    harmful content generation begins to dominate. The result is negative mean lead
    time (detection AFTER commitment) with only 23-29% of traces achieving any positive
    lead. This is strictly worse than r1-8b's already-disappointing lead time, and
    confirms that pre-textual detection on 32B is not merely unreliable but essentially
    impossible with linear probes.
  tables:
  - name: Lead Time Distribution by Model
    columns:
    - Model
    - Mean Lead
    - Median Lead
    - Positive Lead %
    - Std
    - Max Lead
    rows:
    - - r1-8b (temporal W=15)

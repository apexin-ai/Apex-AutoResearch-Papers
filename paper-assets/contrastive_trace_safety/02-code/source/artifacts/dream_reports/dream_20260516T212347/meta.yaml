  - name: Cross-model transfer probes
    plan_id: exp-003
    description: Train probe on r1-8b (Llama-based, 4096-d), test on r1-32b/QwQ (Qwen2.5-based,
      5120-d) via learned projection head. And reverse direction.
    expected_results:

    # Dream Review Report: "Does Scale Erase Safety Signals?"


    **Paper**: Does Scale Erase Safety Signals? Hidden-State Monitoring Limitations
    in Large Reasoning Models

    **Review Mode**: Full (2 Reviewers, 4-Step Roundtable)

    **Date**: 2026-05-16


    ---


    ## Review Process


    - **R1** (Methodology + Experiments): Evaluated experimental design, statistical
    rigor, reproducibility, ablation completeness, claims vs evidence

    - **R2** (Novelty + Related Work): Evaluated novelty, significance, related work
    coverage, framing, writing quality, overclaiming

    - **Roundtable**: Independent reviews → cross-sharing → convergence → synthesis
    below


    ---


    ## Paper Summary


    The paper investigates whether hidden-state (HS) probes for safety commitment
    detection in reasoning models generalize across model scale. Using a 2×2 matrix
    of architectures (Llama, Qwen2.5) × scales (7–8B, 32B), the authors find that
    the HS monitoring advantage observed at 7–8B (pre-CP FPR 16% vs text''s 27%, p=0.003;
    AUROC 0.847 vs 0.738) vanishes at 32B (pre-CP FPR 25–31% vs 27–30%, p>0.4; AUROC
    0.56–0.60 for both modalities). Fisher discriminability drops 6× from 8B to 32B.
    Temporal aggregation, GRU probes, fine-grained supervision, layer sweeps, and
    cross-scale transfer all fail to recover the signal at 32B. The paper concludes
    that HS monitoring cannot be assumed to generalize with scale.



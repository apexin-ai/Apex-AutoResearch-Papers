  review_report: "---\ndream_id: dream_20260516T212347\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-16T22:05:20.734770+00:00\n---\n\n# Dream Review\
    \ Report: Temporal Probing for Safety Commitment Detection in Reasoning Models\n\
    \n**dream_id**: 20260516T212347  \n**Review mode**: full (2-reviewer roundtable)\
    \  \n**Date**: 2026-05-16  \n**Venue standard**: Top ML venue, ~25% acceptance\
    \ rate, 6-point scale\n\n---\n\n## Roundtable Summary\n\n| | R1 (Methods + Experiments)\
    \ | R2 (Novelty + Related Work) | Converged |\n|---|---|---|---|\n| **Score**\
    \ | 4 (Weak Accept) | 3 (Weak Reject) | **3 (Weak Reject)** |\n| **Confidence**\
    \ | 4/5 | 4/5 | 4/5 |\n\n**Convergence rationale**: R1 valued the systematic evaluation\
    \ and honest negative results but acknowledged the dimensionality-mismatch confound\
    \ and small-sample limitations. R2's concerns about zero figures, no methodological\
    \ novelty, weak text baseline, and potentially tautological lead-time claim proved\
    \ persuasive during cross-sharing. Both reviewers agreed that the core HS-vs-text\
    \ comparison is confounded by feature dimensionality, which undermines Claim 1\
    \ (the headline result). The paper is below the acceptance threshold but contains\
    \ salvageable contributions if specific issues are addressed.\n\n---\n\n## 1.\
    \ Paper Summary\n\nThe paper evaluates detection methods for \"safety commitment\
    \ points\" in reasoning LLMs, where extended chain-of-thought transitions from\
    \ safety-aware deliberation to harmful content generation. Four models across\
    \ two architecture families (R1-distilled, Qwen-native) at 7B/32B scale are tested\
    \ with static/temporal LR probes, GRU, Mahalanobis distance, BOCPD/CUSUM, and\
    \ text baselines. The paper claims: (1) HS probes more precise than text within\
    \ architecture families, (2) temporal context of ~15 steps needed, (3) early detection\
    \ fundamentally unreliable, (4) cross-model transfer fails.\n\n---\n\n## 2. Strengths\n\
    \n**S1. Well-defined problem formulation (R1, R2 agree).** The commitment point\
    \ definition is clean, the 4-metric evaluation framework (coverage, pre-commitment\
    \ FPR, precision, lead time) is well-motivated, and the distinction between pre-commitment\
    \ FPR and safe-trace FPR captures a deployment-relevant nuance that prior work\
    \ overlooked.\n\n**S2. Comprehensive cross-architecture design (R1).** The 2x2\
    \ architecture-by-scale matrix (Table 2) with 4 models is a genuinely informative\
    \ experimental design. Disentangling training lineage from scale is a useful empirical\
    \ contribution.\n\n**S3. Honest negative results (R1, R2 agree).** The paper does\
    \ not oversell. Mahalanobis distance failure, unreliable lead time, high safe\
    \ FPR (>39%), borderline significance (p=0.034 not surviving correction), and\
    \ cross-transfer failure are all reported transparently. This intellectual honesty\
    \ is commendable and the \"principled limitations\" framing is appropriate.\n\n\
    **S4. Method breadth (R1).** Testing 6 detection paradigms (static LR, temporal\
    \ LR, GRU, Mahalanobis, BOCPD, CUSUM) across 2 modalities (HS, text) provides\
    \ a thorough landscape. The window-size ablation (Table 5) and fine-grained supervision\
    \ ablation (Table 12) add useful methodological detail.\n\n**S5. Oracle gap analysis\
    \ (R2).** The mutual information argument (MI = 0.12 bits between current hidden\
    \ state and future commitment) provides a principled information-theoretic bound\
    \ on early detection, elevating the lead-time finding from \"our methods fail\"\
    \ to \"early detection is fundamentally limited.\"\n\n---\n\n## 3. Weaknesses\n\
    \n### Critical (would need to be addressed for acceptance)\n\n**W1. Confounded\
    \ HS-vs-text comparison (R1 primary, R2 concurs).**  \nThe headline finding (Claim\
    \ 1) rests on comparing HS temporal probes against text probes, but the feature\
    \ dimensionalities are massively unequal. HS temporal features with W=15 at a\
    \ 4096-d layer yield 61,440-dimensional input to LR, while the text baseline uses\
    \ Sentence-BERT embeddings (768-d) or TF-IDF at much lower dimensionality. A logistic\
    \ regression classifier with 10x more features has substantially more capacity\
    \ to find discriminative directions. The observed FPR advantage (7pp on r1-32b,\
    \ 6pp on QwQ) could partially or wholly reflect this capacity gap rather than\
    \ a genuine modality advantage. A dimensionality-matched control (e.g., PCA-reduced\
    \ HS features to match text dimensionality, or a fine-tuned sentence transformer\
    \ at comparable capacity) is essential to validate Claim 1.\n\n**W2. Zero figures\
    \ in an 8-page paper (R2 primary, R1 concurs).**  \nThe paper contains 13 tables\
    \ and 0 figures. This is a serious presentation failure. Key results that demand\
    \ visualization include: layer sweep profiles, lead-time distribution violin/CDF\
    \ plots, the cross-transfer heatmap, window-size diminishing returns curve, and\
    \ PCA/Fisher analysis of signal geometry. The experiment design reference describes\
    \ these figures in detail but none appear in the paper. Tables alone cannot convey\
    \ distributional information (e.g., \"median lead = 0\" hides the shape of the\
    \ lead-time distribution) or spatial structure (cross-transfer patterns). The\
    \ paper reads like a technical report rather than a conference submission.\n\n\
    **W3. Small sample sizes with wide CIs undermine per-model claims (R1 primary).**\
    \  \nTest sets of n=35-43 traces per model yield bootstrap CIs that span 10-15\
    \ percentage points (e.g., r1-32b HS FPR: [14.2, 25.1]). The HS-vs-text comparison\
    \ on r1-32b is borderline significant (p=0.034) and would not survive Bonferroni\
    \ correction across 4 models. On QwQ, p=0.218 (not significant). The paper's argument\
    \ that \"consistency across models\" substitutes for per-model significance is\
    \ reasonable but should be formalized (e.g., a mixed-effects model treating model\
    \ as a random effect, or a sign test across all model-modality pairs).\n\n**W4.\
    \ No methodological novelty (R2 primary).**  \nEvery method tested is standard:\
    \ logistic regression, GRU, Mahalanobis distance, BOCPD, CUSUM, Sentence-BERT.\
    \ The temporal probe is a sliding-window concatenation fed to LR. No new detection\
    \ algorithm, architecture, or training procedure is proposed. For a top venue,\
    \ purely empirical evaluations of existing methods need either (a) a larger scale/scope\
    \ than 4 models, (b) surprising findings that change how the community thinks,\
    \ or (c) a new benchmark/dataset. This paper partially achieves (b) with the architecture-specificity\
    \ and oracle-gap findings, but the other claims (temporal context helps, early\
    \ detection is hard) are unsurprising.\n\n### Major\n\n**W5. Potentially tautological\
    \ lead-time claim (R2).**  \nClaim 3 states that \"pre-textual early detection\
    \ is fundamentally unreliable.\" But the commitment point is defined as the *last*\
    \ step containing safety reasoning. By definition, this is the moment when safety\
    \ reasoning disappears from the text. A probe that detects the transition in hidden\
    \ states at the same moment the text transitions would have lead time = 0, which\
    \ is exactly what is observed. The \"fundamental limitation\" may be partly an\
    \ artifact of the label definition (last safety step) rather than a deep information-theoretic\
    \ constraint. To disentangle this, the paper would need an alternative commitment-point\
    \ definition (e.g., first post-commitment harmful step, or the point of no return\
    \ as determined by counterfactual intervention) and show that lead time remains\
    \ unreliable under that definition. The MI analysis (0.12 bits) partially addresses\
    \ this but is presented only as a discussion-section number without full methodology.\n\
    \n**W6. Incomplete OpenThinker-7B results (R1, R2 agree).**  \nTable 1 shows dashes\
    \ for OpenThinker-7B coverage and AUROC. The 4th model in the 2x2 matrix has incomplete\
    \ results, yet conclusions about it (Table 2) are stated without qualification.\
    \ This undermines the architecture-vs-scale disentanglement that is a stated contribution.\n\
    \n**W7. High safe FPR acknowledged but insufficiently analyzed (R1).**  \nSafe\
    \ FPR >39% for ALL methods means roughly 40-59% of safe reasoning steps trigger\
    \ false alarms. The paper acknowledges this limits deployment but does not explore\
    \ mitigation (threshold tuning curves, precision-recall operating points, cost-sensitive\
    \ formulations). The claim that \"these are diagnostic tools\" is honest but reduces\
    \ the practical significance of the work. A threshold sweep figure showing the\
    \ precision-coverage-FPR tradeoff surface would help readers assess deployment\
    \ feasibility under different operating constraints.\n\n**W8. Missing probe control\
    \ task (R2).**  \nWithout a selectivity control in the style of Hewitt and Liang\
    \ (2019), it is unclear whether probes exploit genuine safety-relevant information\
    \ or structural/positional features of reasoning traces (e.g., trace length, step\
    \ position relative to trace end). A control probe trained on shuffled labels\
    \ or a non-safety binary classification task at the same granularity would establish\
    \ whether the observed accuracy exceeds what trace structure alone provides.\n\
    \n### Minor\n\n**W9. Related Work is thin (R2).**  \nAt ~1 page with 4 short paragraphs,\
    \ Related Work is underweight for a paper claiming to establish \"principled boundaries\"\
    \ for a field. Missing or underrepresented: probing methodology literature (Belinkov\
    \ 2022, Hewitt & Liang 2019), representation engineering (Zou et al. 2023), activation\
    \ steering, jailbreak detection beyond TrajGuard/SafeSwitch/SIREN, and the broader\
    \ interpretability literature on safety-relevant features. The references list\
    \ is not visible in the provided pages, making it impossible to verify citation\
    \ coverage.\n\n**W10. Cross-transfer experimental design (R1).**  \nThe cross-transfer\
    \ experiment (Table 9) uses a learned linear projection (4096 to 5120 dimensions)\
    \ trained on target-domain data. With only ~125 training traces, the projection\
    \ head has ~21M parameters to estimate, raising severe overfitting concerns. The\
    \ near-chance transfer accuracy could reflect projection failure rather than genuinely\
    \ incompatible signal geometries. A simpler test (e.g., CKA similarity between\
    \ same-layer representations across models, or zero-shot transfer without projection)\
    \ would be more convincing.\n\n**W11. No references list visible (R2).**  \nThe\
    \ 8-page PDF does not include a references section in the provided pages. This\
    \ may be a formatting issue, but it prevents verification of citation completeness\
    \ and accuracy.\n\n---\n\n## 4. Questions for Authors\n\n**Q1 (from W1):** What\
    \ is the feature dimensionality of the text baseline? If HS temporal probes use\
    \ 15x4096 = 61,440 features while text uses 768-d Sentence-BERT embeddings, have\
    \ you tested a dimensionality-matched comparison (e.g., PCA-reduced HS to 768-d,\
    \ or a higher-capacity text encoder)?\n\n**Q2 (from W5):** The commitment point\
    \ is defined as the last step with safety reasoning. If you shifted the label\
    \ to the first post-commitment harmful step (or used a sliding definition), does\
    \ the lead-time distribution change meaningfully? How sensitive are your findings\
    \ to the exact commitment-point annotation?\n\n**Q3 (from W6):** Why are OpenThinker-7B\
    \ coverage and AUROC missing from Table 1? Were these experiments incomplete at\
    \ submission time?\n\n**Q4 (from W8):** Have you run a control probe experiment\
    \ (random labels or non-safety task) to establish a selectivity baseline for your\
    \ probes?\n\n**Q5 (from W3):** The consistency argument (same direction in 3/3\
    \ models) is appealing but informal. Have you considered a formal meta-analytic\
    \ test (e.g., Stouffer's method for combining p-values, or a mixed-effects model)?\n\
    \n---\n\n## 5. Experiment Coverage Assessment\n\nCompared against the full experiment\
    \ design (15 planned experiments):\n\n| Experiment | Status in Paper |\n|---|---|\n\
    | exp-001 (cross-arch static probe) | Covered (Table 1, 2) |\n| exp-002 (temporal\
    \ window eval) | Covered (Table 3, 4) |\n| exp-003 (cross-model transfer) | Covered\
    \ (Table 9) |\n| exp-004 (lead time 32B) | Covered (Table 6) |\n| exp-005 (Mahalanobis\
    \ 32B) | Covered (Table 8) |\n| exp-006 (bootstrap CIs) | Covered (Table 11) |\n\
    | exp-007 (window ablation) | Covered (Table 5) |\n| exp-008 (layer selection\
    \ ablation 32B) | **Missing** — no dedicated results |\n| exp-009 (16-label taxonomy)\
    \ | Covered (Table 12) |\n| exp-010 (oracle decomposition) | **Partial** — MI=0.12\
    \ mentioned in Discussion, no table/figure/methodology |\n| exp-011 (OpenThinker-7B)\
    \ | **Partial** — Table 1 has missing values |\n| exp-012 (GRU 32B) | Covered\
    \ (Table 13) |\n| exp-013 (text baseline 32B) | Covered (Table 3) |\n| exp-014\
    \ (BOCPD/CUSUM 32B) | Covered (Table 7) |\n| exp-015 (FPR analysis 32B) | Covered\
    \ (Table 10) |\n\n**Coverage**: 12/15 fully covered, 2 partial, 1 missing. The\
    \ missing layer-selection ablation (exp-008) would strengthen the methodological\
    \ justification for layer choice. The oracle decomposition (exp-010) is the most\
    \ impactful missing piece — it is referenced in the Discussion as the information-theoretic\
    \ argument but presented as a single number (MI=0.12) without methodology, figures,\
    \ or the mutual information curve described in the experiment design.\n\n---\n\
    \n## 6. Consolidated Score and Recommendation\n\n**Score: 3/6 (Weak Reject)**\n\
    \n**Justification:** The paper addresses a timely and important problem (safety\
    \ monitoring of reasoning models) with a comprehensive experimental design and\
    \ commendable intellectual honesty. However, the combination of (1) a confounded\
    \ headline comparison that may not survive a dimensionality-matched control, (2)\
    \ the complete absence of figures in a results-heavy empirical paper, (3) no methodological\
    \ novelty, and (4) small sample sizes that prevent statistical confirmation of\
    \ the main claim pushes the paper below the acceptance threshold for a top venue.\n\
    \nThe strongest contributions are the architecture-specificity finding (training\
    \ lineage matters more than scale) and the oracle-gap argument (commitment detection\
    \ is fundamentally reactive). These are genuinely informative for the community.\
    \ But they are currently supporting findings rather than the headline claim, and\
    \ the paper's structure does not foreground them effectively.\n\n**Path to acceptance:**\n\
    1. Add a dimensionality-matched text baseline (or PCA-reduced HS baseline) to\
    \ validate Claim 1 independent of capacity confounds\n2. Add 4-5 figures: layer\
    \ sweep profiles, lead-time distributions, transfer heatmap, window ablation curve,\
    \ precision-recall operating characteristic\n3. Expand the oracle decomposition\
    \ from a Discussion-section number to a full analysis with methodology and figures\n\
    4. Complete OpenThinker-7B results\n5. Add probe selectivity controls (Hewitt\
    \ & Liang 2019)\n6. Formalize the cross-model consistency argument with appropriate\
    \ statistical machinery\n\n---\n\n## Appendix: Individual Reviewer Reports\n\n\
    ### R1 (Methods + Experiments) — Score: 4/6 (Weak Accept), Confidence: 4/5\n\n\
    **Assessment:** The experimental design is thorough and the problem formulation\
    \ is clean. The 2x2 architecture-scale matrix is a well-designed study. The paper's\
    \ willingness to report negative results (Mahalanobis failure, lead-time unreliability,\
    \ high safe FPR) is a strength. The main methodological concern is the dimensionality\
    \ mismatch between HS and text features, which could explain the observed FPR\
    \ advantage without invoking a genuine modality difference. Small sample sizes\
    \ (n=35-43) produce wide CIs that prevent definitive per-model conclusions. The\
    \ cross-transfer projection experiment is underpowered. Reproducibility is hampered\
    \ by underspecified details (step segmentation, token position for HS extraction,\
    \ GRU training schedule).\n\n### R2 (Novelty + Related Work) — Score: 3/6 (Weak\
    \ Reject), Confidence: 4/5\n\n**Assessment:** The paper proposes no new method\
    \ — all techniques are standard. For a top venue, purely empirical evaluations\
    \ need to clear a higher bar for either scale, surprise, or benchmark contribution.\
    \ The lead-time claim (Claim 3) may be partially tautological given the commitment-point\
    \ definition. Related Work is thin and missing key probing-methodology references.\
    \ The complete absence of figures is a serious presentation failure that makes\
    \ the paper read as a technical report. The architecture-specificity and oracle-gap\
    \ findings are the most novel contributions but are currently underserved by the\
    \ paper's structure and framing. The text baseline (TF-IDF / basic Sentence-BERT)\
    \ is weak by 2026 standards; a fine-tuned text classifier could narrow the HS\
    \ advantage substantially.\n"

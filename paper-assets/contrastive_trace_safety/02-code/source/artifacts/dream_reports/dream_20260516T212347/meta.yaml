      because the per-step signal is already too weak for temporal aggregation to
      amplify. On r1-8b, temporal windowing works because each step contributes a
      weak-but-consistent directional signal that accumulates over W=15 steps. On
      32B, the per-step signal is near noise floor (Fisher ~2.8 vs ~18), so aggregating
      15 noisy steps does not produce meaningful separation improvement. Coverage
      gain is +2-5pp (vs +30pp on r1-8b), statistically indistinguishable from zero
      given n=43 traces. The temporal context hypothesis holds at 8B but fails to
      transfer — the mechanism requires sufficient per-step signal strength as a precondition.

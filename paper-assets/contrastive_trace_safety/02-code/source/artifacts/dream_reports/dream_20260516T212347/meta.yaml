  review_report: "---\ndream_id: dream_20260516T212347\ntier: best\noverall_score:\
    \ 3/6 Reject\ntimestamp: 2026-05-16T21:58:13.122354+00:00\n---\n\n# Dream Review\
    \ Report: Hidden States Universally Encode Safety Commitment Better Than Text\n\
    \n**Dream ID:** 20260516T212347\n**Review Mode:** full (2 Reviewers, complete\
    \ roundtable)\n**Venue Standard:** Top ML venue, ~25% acceptance, 6-point scale\n\
    \n---\n\n## Overall Assessment\n\n**Score: 3 / 6 (Reject)**\n\nThe paper addresses\
    \ a timely problem (detecting safety commitment points in reasoning models) with\
    \ a well-designed cross-architecture evaluation. Three genuine strengths stand\
    \ out: the 2x2 architecture-scale design matrix, the informative oracle decomposition\
    \ establishing principled detection limits, and the honest reporting of negative\
    \ results. However, the paper falls below the top-venue bar due to (1) critically\
    \ insufficient statistical power with only 43 test traces per model, (2) limited\
    \ methodological novelty (standard probing applied to a new task), (3) a central\
    \ finding (\"hidden states beat text\") that is expected from representation theory,\
    \ and (4) severely incomplete related work coverage.\n\n---\n\n## R1 Assessment:\
    \ Methods and Experiments\n\n### Strengths\n\n- **Well-structured experimental\
    \ progression.** Static LR, temporal LR (W=15), GRU, and baselines (TrajGuard,\
    \ BOCPD) form a logical hierarchy. The \"simplicity saturates\" finding (temporal\
    \ LR preferred over GRU due to instability) is itself informative.\n\n- **Controlled\
    \ modality comparison.** Applying identical probe architectures to both hidden-state\
    \ and text features isolates the signal source as the variable, which is the correct\
    \ experimental design for the central claim.\n\n- **2x2 architecture-scale matrix.**\
    \ Evaluating across Llama/Qwen2.5 and 7-8B/32B disentangles architecture from\
    \ scale effects. The finding that neither dominates (reasoning training is primary)\
    \ is a useful insight.\n\n- **Comprehensive multi-metric evaluation.** Distinguishing\
    \ coverage, pre-CP FPR, safe FPR, precision, and lead time (mean AND median) avoids\
    \ single-metric optimization. The observation that positive mean lead with zero\
    \ median reveals the skewed detection distribution is well-handled.\n\n- **Honest\
    \ negative results.** TrajGuard/Mahalanobis failure, GRU instability, and the\
    \ \"fundamental limitation\" framing of pre-textual detection are reported candidly.\n\
    \n- **Oracle decomposition.** The 62%/28%/10% breakdown (future labels / trajectory\
    \ / global context) provides principled information-theoretic grounding for the\
    \ detection ceiling.\n\n- **Low heterogeneity (I-squared=0.12).** Supports consistency\
    \ of the HS precision advantage across architectures.\n\n### Weaknesses\n\n- **Critical\
    \ sample size limitation (n=43 test traces per model) [Major].** Per-model statistical\
    \ tests fail significance for several key comparisons. Confidence intervals are\
    \ extremely wide (e.g., r1-32b temporal coverage CI [0.442, 0.698], spanning 25.6pp).\
    \ The \"pooled p=0.003\" for HS vs text FPR depends on treating 4 models as independent\
    \ studies sharing the same HarmThoughts dataset and probing methodology, which\
    \ inflates effective sample size. This pooling assumption deserves explicit justification.\n\
    \n- **Text baseline may be too weak [Major].** The paper uses TF-IDF representations\
    \ for text probes. Modern sentence embeddings (e.g., E5-large, BGE-large at 1024-d)\
    \ would provide a much stronger text baseline. Hidden states contain strictly\
    \ more information than text; the question is whether the gap is due to genuinely\
    \ richer safety signal or just to using a weak text encoder. Without a competitive\
    \ neural text baseline, Claim 1 is not stress-tested.\n\n- **Commitment point\
    \ definition creates pathological distribution [Moderate].** With 41.6% of CPs\
    \ in the last 10% of traces, coverage is dominated by whether the probe fires\
    \ in the last few steps. The \"coverage\" metric for traces with late CPs is essentially\
    \ \"does the probe detect anything has gone wrong by the end,\" which is a low\
    \ bar. Per-subgroup analysis (early-CP vs late-CP traces) is needed.\n\n- **GRU\
    \ instability undermines reproducibility [Moderate].** Coverage varies 76-93%\
    \ across seeds on r1-8b (17pp range). The paper reports 5-seed mean/std for GRU,\
    \ but this massive variance means GRU results are not meaningfully reproducible\
    \ and the comparison to temporal LR depends heavily on which seed is run.\n\n\
    - **Pre-CP FPR metric conflates early and late false positives [Minor].** A false\
    \ positive at step 2 is operationally different from one at step CP-1. The paper\
    \ does not characterize where in the pre-commitment window false positives cluster.\n\
    \n- **No threshold sensitivity analysis [Minor].** All probes use threshold=0.5.\
    \ ROC/PR curves across thresholds would clarify the coverage-FPR Pareto frontier\
    \ and whether the 0.5 operating point is optimal.\n\n- **Temporal improvement\
    \ may be overstated [Minor].** The claimed \"+5-7pp\" coverage gain from temporal\
    \ context varies from +4.6pp (r1-8b) to +7.0pp (QwQ-32B). Given n=43 and wide\
    \ CIs, the low end of this range is not clearly distinguishable from noise without\
    \ the pooled analysis.\n\n### Missing Experiments\n\n1. **Stronger text encoder**\
    \ (E5-large or similar modern embedding) with identical temporal window to stress-test\
    \ Claim 1.\n2. **Calibration analysis** (reliability diagrams) to verify whether\
    \ 0.5 threshold is appropriate.\n3. **Per-CP-position subgroup analysis** (early\
    \ CP vs late CP traces) to understand metric sensitivity.\n4. **Permutation/shuffle\
    \ baseline** (time-shuffled hidden states) to verify temporal structure drives\
    \ the temporal probe advantage.\n5. **Control task probes** (e.g., math reasoning\
    \ phase transitions) to confirm signal is safety-specific.\n\n---\n\n## R2 Assessment:\
    \ Novelty and Related Work\n\n### Strengths\n\n- **Genuine gap identification.**\
    \ No prior work evaluates hidden-state safety detectors on reasoning-model self-jailbreak.\
    \ The commitment point formalization as a detection target is a legitimate new\
    \ task definition.\n\n- **Informative negative result with principled explanation.**\
    \ The oracle decomposition combined with Fisher ratio collapse analysis provides\
    \ mechanistic grounding for why geometric methods fail and why pre-textual detection\
    \ is unreliable. This boundary result is useful for the community.\n\n- **Cross-architecture\
    \ consistency constitutes stronger evidence than single-model studies.** The pooled\
    \ analysis with low heterogeneity, consistent optimal layer depth (44-47%), and\
    \ consistent FPR ranges across architectures go beyond typical single-model probing\
    \ studies.\n\n- **Signal geometry insight is transferable.** Fisher discriminant\
    \ ratio collapse (18 in full space to ~1 in PCA-3) is a concrete, testable explanation\
    \ for geometric detector failure that other researchers can verify and build upon.\n\
    \n- **Honest empirical framing.** The paper does not overclaim a novel method,\
    \ correctly positioning itself as systematic evaluation.\n\n### Weaknesses\n\n\
    - **Limited methodological novelty [Major].** Core methods are sliding-window\
    \ logistic regression and GRU, both standard since the 1990s/2010s. No new method,\
    \ architecture, or training procedure is proposed. For a top venue, even empirical\
    \ studies typically require novel evaluation methodology, a surprising finding,\
    \ or exceptional analytical depth.\n\n- **\"Hidden states beat text\" is expected,\
    \ not surprising [Major].** Hidden states contain strictly more information than\
    \ text (text is a lossy projection of hidden states). The probing literature (Belinkov\
    \ 2022, Conneau et al. 2018) has long established that internal representations\
    \ encode richer task-relevant information. The finding quantifies a known gap\
    \ for a new task rather than revealing something unexpected. The paper needs to\
    \ articulate what is surprising about the specific magnitude or nature of the\
    \ advantage.\n\n- **\"Pre-textual detection unreliable\" is partially tautological\
    \ [Major].** The commitment point is defined as the last step with safety reasoning.\
    \ A probe trained on this label is definitionally constrained by the fact that\
    \ safety reasoning termination is a future event. The oracle decomposition partially\
    \ addresses this, but the paper conflates definitional constraints (you cannot\
    \ predict the future from the past) with empirical discoveries about representations.\
    \ The contribution would be stronger if it identified what representational features\
    \ ARE available pre-commitment and why they are insufficient.\n\n- **Severely\
    \ incomplete related work [Major].** 14 citations is far below the 30-60 typical\
    \ for top ML venues. Critical gaps include:\n  - Probing methodology literature\
    \ (Belinkov 2022 survey; Conneau et al. 2018 probing tasks; Hewitt & Manning 2019\
    \ structural probes; Hewitt & Liang 2019 control tasks for selectivity)\n  - Mechanistic\
    \ interpretability (Meng et al. 2022 causal tracing; Conmy et al. 2023 circuit\
    \ discovery)\n  - Broader jailbreak detection (Robey et al. 2023; Alon & Kamfonas\
    \ 2023)\n  - Process supervision beyond PRMs (Uesato et al. 2022; Wang et al.\
    \ 2024 Math-Shepherd)\n  - Steering/intervention literature (Li et al. 2024 inference-time\
    \ intervention; Turner et al. 2023 activation additions)\n\n- **\"Universally\"\
    \ in title is overclaimed [Moderate].** 3 of 4 models share Qwen2.5 base architecture.\
    \ The single Llama model (r1-8b) is architecturally distinct but also the smallest\
    \ model. True universality would require testing on diverse architectures (Mixtral,\
    \ Gemma, etc.) and non-distilled reasoning models.\n\n- **No control task or causal\
    \ validation [Moderate].** Without Hewitt & Liang (2019) control tasks, the probe\
    \ may exploit positional heuristics (given the bimodal CP distribution). Without\
    \ causal validation (does intervening at the detected step prevent harmful output?),\
    \ detection is correlational, not actionable.\n\n- **Cross-architecture transfer\
    \ is underdeveloped [Moderate].** The 67-74% transfer accuracy is reported as\
    \ numbers without geometric analysis of what structure is shared (CKA, CCA, direction\
    \ alignment). This is a missed opportunity for the paper's most novel finding.\n\
    \n### Questions for Authors\n\n1. How do you respond to the critique that \"hidden\
    \ states beat text\" is the expected outcome from representation theory? What\
    \ specifically is surprising about the magnitude or nature of the advantage?\n\
    \n2. Have you considered Hewitt & Liang (2019) control tasks to rule out positional\
    \ confounds, given that 41.6% of CPs occur in the last 10% of traces?\n\n3. Can\
    \ you establish causal relevance: does intervening (e.g., early stopping, activation\
    \ steering) at the detected step actually prevent harmful output generation?\n\
    \n4. Why are probing methodology papers (Belinkov, Conneau, Hewitt) entirely absent\
    \ from related work, given that the paper's core method IS probing?\n\n5. How\
    \ do you justify \"universally\" with 3/4 models sharing Qwen2.5 architecture?\n\
    \n6. How robust is the CP definition to annotation noise in HarmThoughts? What\
    \ is the inter-annotator agreement?\n\n7. How does this relate to Process Reward\
    \ Models (PRMs), which perform structurally identical step-level classification\
    \ on reasoning traces?\n\n---\n\n## Roundtable Convergence\n\n### Points of Agreement\
    \ (R1 + R2)\n\n1. **The paper addresses a timely, important problem** (safety\
    \ monitoring of reasoning models) with a well-motivated experimental framework.\n\
    \n2. **Cross-architecture consistency is a genuine strength** that elevates this\
    \ above single-model studies.\n\n3. **Oracle decomposition is the strongest analytical\
    \ contribution**, providing principled information-theoretic grounding.\n\n4.\
    \ **n=43 test traces is critically insufficient** for the claims being made. Per-model\
    \ comparisons fail significance; the pooled analysis methodology needs stronger\
    \ justification.\n\n5. **Practical utility is limited**: safe FPR of 35-62% means\
    \ all methods trigger false alarms on one-third to two-thirds of safe traces.\
    \ The paper compares methods that are all currently impractical for deployment.\n\
    \n6. **\"Universal\" is overclaimed**: 3/4 Qwen2.5-based models do not constitute\
    \ architectural diversity.\n\n7. **Related work is severely thin**: 14 citations\
    \ missing entire relevant literatures (probing methodology, mechanistic interpretability,\
    \ broader jailbreak detection).\n\n### Points of Tension\n\n- **R1** is more generous\
    \ about the text baseline fairness and sees the primary issue as statistical methodology.\
    \ **R2** sees the deeper issue as conceptual: the central finding is expected\
    \ from first principles, and the paper lacks the methodological novelty or surprising\
    \ insight needed for a top venue.\n\n- **R1** leans borderline (could be revised\
    \ to acceptance). **R2** leans reject (structural novelty deficit is harder to\
    \ address in revision).\n\n### Consensus Score Rationale\n\nBoth reviewers converge\
    \ on **3/6 (Reject)** for the following reasons:\n\n**Above the reject floor**\
    \ because: (a) the problem is important and timely, (b) the cross-architecture\
    \ design is well-executed, (c) the oracle decomposition and Fisher collapse analyses\
    \ are genuinely informative, (d) negative results are reported honestly.\n\n**Below\
    \ the acceptance bar** because: (a) the central claim (HS > text) is expected\
    \ from representation theory and not sufficiently surprising, (b) statistical\
    \ power is critically insufficient for the strength of claims, (c) methodological\
    \ novelty is limited (standard probes on a new task), (d) related work coverage\
    \ is inadequate, (e) \"universal\" is overclaimed, (f) practical utility is limited.\n\
    \n---\n\n## Actionable Revision Suggestions\n\n1. **Increase test set size.**\
    \ Use 5-fold cross-validation on all 209 traces (rather than a fixed 166/43 split)\
    \ to improve statistical power. Alternatively, collect more traces from HarmThoughts\
    \ or generate additional traces.\n\n2. **Add a competitive text baseline.** Replace\
    \ TF-IDF with a strong neural encoder (E5-large, BGE-large) to stress-test whether\
    \ the HS advantage survives against a competitive text representation.\n\n3. **Expand\
    \ related work to 35+ citations.** Cover probing methodology (Belinkov, Conneau,\
    \ Hewitt), mechanistic interpretability (Meng et al.), broader jailbreak detection,\
    \ and process supervision literatures.\n\n4. **Soften \"universally\" to \"consistently\
    \ across tested models\"** and add at least one non-Qwen2.5 32B model (e.g., Llama-3.1-based\
    \ reasoning model) to strengthen the cross-architecture claim.\n\n5. **Add control\
    \ tasks** (Hewitt & Liang 2019) to rule out positional confounds and verify safety-specific\
    \ signal.\n\n6. **Develop the cross-model transfer finding** with geometric analysis\
    \ (CKA, CCA, direction alignment) rather than just reporting accuracy numbers.\
    \ This is the paper's most novel contribution and deserves deeper treatment.\n\
    \n7. **Add causal validation.** Show that intervening at the detected commitment\
    \ point (early stopping, activation steering) actually prevents harmful output.\n\
    \n8. **Reframe the narrative.** Rather than \"HS beat text\" (expected), emphasize\
    \ the oracle decomposition, Fisher collapse, and cross-transfer geometry as the\
    \ primary contributions. These are more novel and less expected.\n\n9. **Add per-subgroup\
    \ analysis** by CP position (early vs late commitment) and harm category.\n\n\
    10. **Provide threshold-free evaluation** (detection delay CDFs, full ROC/PR curves)\
    \ alongside the threshold=0.5 results.\n\n---\n\n## Summary\n\n| Dimension | Score\
    \ | Notes |\n|-----------|-------|-------|\n| Novelty | 2/5 | Standard methods\
    \ on new task; central finding expected |\n| Soundness | 3/5 | Well-designed but\
    \ underpowered; pooling assumptions questionable |\n| Significance | 3/5 | Important\
    \ problem, but limited practical utility demonstrated |\n| Presentation | 3/5\
    \ | Clear writing, but thin related work and overclaimed title |\n| **Overall**\
    \ | **3/6** | **Reject** |\n\nThe paper has a solid empirical core that could\
    \ become publishable with significant revision: stronger baselines, more statistical\
    \ power, expanded related work, and reframed contributions around the genuinely\
    \ novel findings (oracle decomposition, signal geometry, cross-transfer) rather\
    \ than the expected finding (HS > text).\n"

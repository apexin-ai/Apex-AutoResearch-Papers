    result_rationale: 'Cross-architecture transfer collapses to chance (~50%) in both
      directions between 8B and 32B. This is expected under the worst tier because:
      (1) r1-8b''s safety signal lives in a concentrated subspace (Fisher=18, few
      dimensions), while 32B''s signal is diffuse (Fisher=2.8, many dimensions) —
      a projection head cannot map concentrated→diffuse or vice versa; (2) the Llama↔Qwen
      architecture difference means different residual stream geometries even at the
      same scale; (3) safety encoding is architecture+scale specific, not a universal
      feature. Within-family transfer (r1-32b↔QwQ, both Qwen2.5-based) works slightly
      above chance (60%) because the base architecture shares some geometric properties,
      but still far below useful levels. This result strongly supports the ''scale
      artifact'' interpretation — if the r1-8b signal were a universal safety phenomenon,
      SOME transfer should occur.'

    showing steeper gradients.'
  analysis: AdvBench layer landscape is flatter than original — best/worst gap ~7pp
    vs ~15pp. Scheme B bias direction replicated (shallow) but magnitude attenuated.
    This motivates the 5-metric ablation (exp-008) as the core test.
- name: AdvBench Temporal Window (R1-8B)
  plan_id: exp-002
  description: Temporal LR with W=1,3,5 on R1-8B AdvBench at threshold-selected layer
    L12. Validate temporal improvement under binary labels.
  expected_results:
    layer: L12
    W1_bal_acc: 0.7
    W1_precision: 0.53
    W1_coverage: 0.78
    W1_fpr: 0.22
    W3_bal_acc: 0.73
    W3_precision: 0.56
    W3_coverage: 0.72
    W3_fpr: 0.19
    W5_bal_acc: 0.72
    W5_precision: 0.55
    W5_coverage: 0.67
    W5_fpr: 0.2
    best_W: 3
    temporal_gain_over_static_pp: 3.0
    original_temporal_gain_pp: 3-5
  result_rationale: Temporal improvement present but weaker (+3pp vs +3-5pp on original).
    Binary labels lack an explicit safe→committed transition for the window to capture
    — the temporal context picks up local coherence patterns but without step-level
    supervision the gradient is diffuse. W=3 optimal because AdvBench traces are shorter
    (~38 steps); at W=5 the feature dimensionality (4096×5=20480) approaches training
    set size and edge samples are lost. Coverage decreases monotonically with W (universal
    tradeoff).

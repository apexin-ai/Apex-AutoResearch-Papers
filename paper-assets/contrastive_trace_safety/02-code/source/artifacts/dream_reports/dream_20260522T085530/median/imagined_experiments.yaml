  analysis: 'The gap compression is the most interpretable median-tier result. It
    explains WHY AdvBench doesn''t strongly replicate: the HS modality advantage is
    largest when the classification task requires detecting subtle internal state
    transitions (temporal CP detection), not when surface patterns suffice (binary
    jailbreak). This motivates the C1 scope qualification and provides mechanistic
    understanding of when HS monitoring adds maximal value.'
- name: AdvBench BOCPD/CUSUM
  plan_id: exp-014
  description: Not applicable. BOCPD/CUSUM detect distributional shifts in sequential
    probe scores. AdvBench binary labels define no temporal transition to detect.
  expected_results:
    status: not_applicable
    reason: No commitment-point transition in binary classification setup. Change-point
      methods require a changepoint.
  result_rationale: BOCPD/CUSUM target the probe score transition from safe→committed.
    Under binary labels, all steps carry the same label — no transition exists. Running
    these methods would detect noise-driven fluctuations, producing uninterpretable
    results. On the original dataset, BOCPD already failed on 3/4 models; there is
    no value in attempting it on a setup where the target signal is definitionally
    absent.
  tables: []
  figures_description: []
  analysis: Skipped. Change-point methods require a change point.

  figures_description:
  - MD distribution overlap at PCA-64 showing near-complete overlap between safe and
    jailbreak step populations.
  analysis: Negative result replicates cleanly. Combined with 4-model original results,
    provides 5-dataset-model evidence that variance-based unsupervised detection is
    fundamentally inapplicable. Worth including in appendix alongside positive results.

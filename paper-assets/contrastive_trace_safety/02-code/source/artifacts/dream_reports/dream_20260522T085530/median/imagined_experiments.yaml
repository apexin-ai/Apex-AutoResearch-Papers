      failed (best 58% acc).
    hypothetical_if_extended: Expect transfer failure consistent with original — safety
      geometry is model-specific, not dataset-specific.
  result_rationale: Cross-model transfer failed entirely on the original dataset (all
    directions near chance) because safety commitment geometry is model-specific.
    The dataset does not change this — the failure mode is architectural (different
    hidden space orientations). Saving 2 GPU-hours. If a reviewer requests this, OT-7B
    AdvBench extraction + transfer can be done post-review.

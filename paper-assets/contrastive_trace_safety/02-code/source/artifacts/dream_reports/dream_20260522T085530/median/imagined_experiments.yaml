tier: median
narrative_guidance: Layer selection bias shows directional replication on AdvBench
  — CR-composite 仍倾向选更浅的层 (L5, 16% depth vs original L0, 0%), 但 gap 从 23 层缩减到 7 层。
  HS在threshold-selected layer有方向性优势 (+6pp precision) 但仅 precision 通过 HB (1/6)。 论文调整措辞从
  'model-geometric property' 到 'probe-task-modulated geometric property, strongest
  under temporal supervision'。AdvBench 结果放 appendix Table A3 作 'supporting evidence'，主文一句话引用。score
  delta ≤ +0.1。reviewer 看到方向一致 会认可 robustness，但不会视为 decisive cross-dataset validation。需要额外证据
  （如第二个模型的 AdvBench replication 或第二个 binary-label 数据集）才能从 3.05 推到 3.5。
imagined_experiments:
- name: AdvBench Layer Sweep + Static Probe (R1-8B)
  plan_id: exp-001
  description: Full 32-layer sweep on R1-8B AdvBench traces with binary jailbreak/safe
    labels. Per-layer static LR probe. Establish baseline and identify scheme B bias
    direction.
  expected_results:
    n_traces: 178
    n_jailbreak: 107
    n_safe: 71
    split: 107/35/36
    avg_trace_length_sentences: 38
    best_layer_bal_acc: L10
    best_layer_depth_pct: 32
    best_layer_bal_acc_value: 0.72
    best_layer_precision: 0.51
    best_layer_crossing_rate: 0.55
    scheme_b_layer: L5
    scheme_b_depth_pct: 16
    scheme_b_bal_acc: 0.68
    scheme_b_crossing_rate: 0.71
    deep_layer_L20_bal_acc: 0.65
    deep_layer_L20_precision: 0.53
    layer_profile_range_pp: 7
  result_rationale: 'Binary trace-level labels weaken per-step supervision: every
    step in a jailbreak trace is labeled positive, including early safety-aware reasoning.
    This label noise reduces probe accuracy (0.72 vs original 0.81). Scheme B selects
    L5 (16%) — still shallow but not L0, because binary labels produce a more uniform
    crossing rate profile across layers (noise is less step-position-dependent than
    under CP labels). Pure bal_acc peaks at mid-depth L10 (32%) where intermediate
    representations maximize binary discriminability. Deep layers (L20+) encode CP-relevant
    temporal distinctions that binary labels cannot leverage, so bal_acc drops. Layer
    profile range (~7pp best-to-worst) is compressed versus original (~15pp), consistent
    with binary labels distributing signal more uniformly.'

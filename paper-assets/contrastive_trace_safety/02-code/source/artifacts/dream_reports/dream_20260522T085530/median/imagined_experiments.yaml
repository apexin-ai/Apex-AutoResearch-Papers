- name: AdvBench GRU Probe
  plan_id: exp-012
  description: GRU sequence model on R1-8B AdvBench at L12. Test whether temporal
    sequence modeling adds value under binary trace-level labels.
  expected_results:
    gru_bal_acc: 0.71
    gru_precision: 0.54
    gru_coverage: 0.69
    gru_fpr: 0.24
    lr_bal_acc: 0.73
    lr_precision: 0.56
    gru_vs_lr_bal_acc_delta: -0.02
    verdict: GRU no improvement
  result_rationale: GRU provides no improvement over LR on AdvBench because binary
    labels lack the sequential safe→committed transition that GRU was designed to
    model. On the original dataset, GRU learned temporal commitment dynamics; on AdvBench,
    all steps carry the same label, so there is no temporal structure beyond what
    LR's sliding window already captures. The GRU's 1.6M parameters overfit to n=107
    training traces without compensating temporal signal. This cross-dataset negative
    result strengthens the 'linear probes sufficient' claim.
  tables:

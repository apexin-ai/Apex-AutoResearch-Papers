    is lower and the 6.5pp delta just exceeds the detection boundary. AUROC delta
    (+4pp) is raw p=0.045 but fails HB adjustment. The effect size reduction from
    original (~20pp precision) to AdvBench (~6pp) is the core median-tier signature:
    binary labels attenuate the modality advantage below reliable detection for most
    metrics.'

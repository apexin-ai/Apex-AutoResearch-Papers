- name: AdvBench Early Detection Timing
  plan_id: exp-004
  description: Adapted from lead-time analysis. No CP in AdvBench; instead measure
    the earliest trace fraction at which the probe consistently classifies correctly.
    Compare HS vs text.
  expected_results:
    hs_earliest_correct_fraction: 0.28
    text_earliest_correct_fraction: 0.41
    hs_earlier_by_steps: 5.1
    hs_earlier_in_fraction_of_traces: 0.64
    text_earlier_in_fraction_of_traces: 0.36
    metric_note: Adapted metric — not directly comparable to original lead time
  result_rationale: 'HS probes classify jailbreak traces correctly earlier (~28% of
    trace vs ~41% for text) because hidden states encode safety disposition before
    surface text reveals intent. But the 5-step advantage is noisier than original
    lead-time analysis: without explicit CP, the "earliest correct" metric depends
    on threshold choice and consecutive-correct criterion. The 64% "HS earlier" rate
    (vs 36% text-first) is weaker than original because binary labels make text features
    more competitive — surface patterns like harmful keywords are directly discriminative.
    This supports the HS advantage directionally but the adapted metric carries a
    transparency cost in the paper.'
  tables:
  - name: AdvBench Early Detection
    columns:

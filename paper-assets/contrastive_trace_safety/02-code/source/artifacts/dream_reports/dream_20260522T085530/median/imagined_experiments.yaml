    with 3× smaller gap. CR-composite → shallow and threshold → deeper holds on both
    datasets. The attenuation is mechanistically explained by binary vs temporal supervision.
    Paper treatment: appendix Table A3 with text: "Layer selection bias replicates
    directionally on AdvBench binary classification (gap=7 layers, 23%), attenuated
    versus temporal probing (gap=23 layers, 72%), consistent with the bias being probe-task-modulated."
    Qualifies C1 from ''model-geometric property'' to ''probe-task-modulated geometric
    property, strongest under temporal supervision.'' Reviewer impact: direction-consistent
    = +credibility, but not decisive = no score upgrade beyond +0.05.'
- name: AdvBench Fine-Grained Labels
  plan_id: exp-009
  description: Not applicable. AdvBench uses binary jailbreak/safe labels; 16-label
    taxonomy requires CP annotation which is the cost AdvBench avoids.
  expected_results:
    status: not_applicable
    reason: Binary labels are the AdvBench design point. Fine-grained annotation defeats
      purpose.
  result_rationale: The 16-label taxonomy requires step-level Type 1-4 x pre/post
    annotations — precisely the expensive labeling that AdvBench circumvents. On the
    original dataset this experiment showed only +2pp marginal gain, further justifying
    the skip. Binary labels are sufficient and cheaper.
  tables: []
  figures_description: []
  analysis: Skipped by design.
- name: AdvBench Oracle Ceiling Analysis
  plan_id: exp-010
  description: 'Adapted: no CP oracle possible. Instead estimate per-step classification
    ceiling under binary trace-level labels. Characterize the label noise floor.'
  expected_results:
    status: adapted
    trace_level_oracle_acc: 1.0
    step_level_ceiling_bal_acc: 0.85
    probe_bal_acc_at_best: 0.73
    ceiling_gap_pp: 12
    original_oracle_lead: +31 steps
    note: Binary labels impose ~0.85 step-level ceiling due to early-step label noise
  result_rationale: 'Trace-level oracle is trivially 1.0. Per-step ceiling is ~0.85
    because early steps in jailbreak traces are genuinely safety-aware (model hasn''t
    committed yet), creating inherent label noise under binary assignment. This ceiling
    is lower than original oracle (~0.95 near CP) because binary labels cannot distinguish
    pre/post commitment. The 12pp gap (probe 0.73 vs ceiling 0.85) shows moderate
    room for improvement but it''s constrained by label quality, not probe architecture.
    This partially explains why AdvBench HS-text deltas are smaller: the ceiling itself
    is lower.'
  tables:
  - name: AdvBench Classification Ceiling
    columns:
    - Method
    - Step Bal Acc
    - Gap to Ceiling
    rows:
    - - Ceiling (binary label)
      - ~0.85
      - —
    - - HS LR W=3 (L12)
      - '0.73'
      - 12pp
    - - Text LR W=3
      - '0.69'
      - 16pp
  figures_description:
  - Step-level accuracy by trace position, showing early steps near chance (label
    noise) and late steps approaching ceiling.
  analysis: 'The 0.85 ceiling constrains maximum achievable delta. Even a perfect
    probe can only reach 0.85, limiting the HS-text gap. This is an important nuance
    for interpreting median-tier results: smaller deltas on AdvBench reflect both
    weaker supervision AND lower ceiling, not necessarily weaker HS signal.'

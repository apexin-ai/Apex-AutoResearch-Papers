  analysis: Directional HS timing advantage on AdvBench. Adapted metric is less rigorous
    than original lead-time analysis — suitable for appendix supporting material only.
- name: AdvBench Mahalanobis Distance
  plan_id: exp-005
  description: Mahalanobis distance anomaly detection on R1-8B AdvBench hidden states.
    Estimate covariance from safe traces, compute MD on jailbreak steps.
  expected_results:
    safe_md_mean_pca64: 6.45
    jailbreak_md_mean_pca64: 6.49
    separation: 0.04
    best_pca_dim: 64
    fa_rate_at_5pct_threshold: 0.04
    tp_rate_at_5pct_threshold: 0.03
    verdict: fail
  result_rationale: 'Mahalanobis fails for the same mechanistic reason as original:
    safety-relevant signal occupies minor PCA components, not principal variance directions.
    The Fisher discriminant drops from ~17 in full space to ~1 in PCA. Separation
    (0.04) is even smaller than original (0.07) because binary labels introduce more
    within-class heterogeneity — early jailbreak steps resemble safe steps. The false
    alarm rate equals or exceeds true positive rate at every threshold. Cross-dataset
    replication of this negative result is clean and strengthens the paper''s unsupervised-methods-fail
    narrative.'
  tables:
  - name: AdvBench Mahalanobis Separation by PCA Dim
    columns:
    - PCA Dim
    - Safe MD
    - Jailbreak MD
    - Separation
    rows:

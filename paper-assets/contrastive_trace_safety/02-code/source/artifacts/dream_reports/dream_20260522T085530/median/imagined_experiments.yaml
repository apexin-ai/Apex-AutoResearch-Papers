  analysis: GRU negative result replicates cross-dataset. Combined with original (modest
    R1-8B gain, negative 32B), linear probes are recommended for both temporal-CP
    and binary classification settings.
- name: AdvBench Text Baseline
  plan_id: exp-013
  description: 'MiniLM-L6 text embeddings + LR on R1-8B AdvBench. The critical test
    for AdvBench: does the HS-text gap survive binary classification?'
  expected_results:
    text_static_bal_acc: 0.67
    text_static_precision: 0.48
    text_temporal_W3_bal_acc: 0.69
    text_temporal_W3_precision: 0.5
    hs_temporal_W3_bal_acc: 0.73
    hs_temporal_W3_precision: 0.56
    hs_text_gap_bal_acc_pp: 4.0
    hs_text_gap_precision_pp: 6.0
    original_gap_bal_acc_pp: 13.2
    original_gap_precision_pp: 33.5
    gap_compression_factor: 3-5x
  result_rationale: 'Text probes perform RELATIVELY better on AdvBench (0.69 vs 0.678
    on original) because binary jailbreak/safe classification is more amenable to
    surface patterns: harmful keywords, refusal phrases, and compliance indicators
    are directly discriminative. The HS-text gap compresses 3-5× (4pp bal_acc, 6pp
    precision vs 13pp/34pp on original). This is THE key median-tier finding: binary
    labels make text more competitive, reducing the marginal value of hidden-state
    access. HS still outperforms, but the practical advantage is much smaller. The
    gap compression ratio is informative for the paper''s scope qualification of C2.'

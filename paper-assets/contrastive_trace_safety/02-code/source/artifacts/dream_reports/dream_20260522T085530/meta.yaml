  - name: AdvBench 5-Metric Layer Selection (CORE)
    plan_id: exp-008
    description: Primary AdvBench replication experiment. Run all 5 layer selection
      metrics on R1-8B AdvBench. Determine if CR-composite → shallow, threshold metrics
      → deeper. This IS the advbench_layer_bias_replication what_if experiment.
    expected_results:
      cr_composite_layer: L5

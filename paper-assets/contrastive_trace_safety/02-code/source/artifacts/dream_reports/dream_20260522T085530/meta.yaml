        pre_cp_fpr: 0.31
        auroc: 0.68
      text_performance:
        bal_acc: 0.6
        precision: 0.55
        pre_cp_fpr: 0.34
      hs_text_comparison:
        bal_acc_delta_pp: 3.0
        precision_delta_pp: 3.0
        fpr_delta_pp: -3.0
        bal_acc_p: 0.28
        precision_p: 0.31
        fpr_p: 0.42
        hb_pass_rate: 0/3
      cp_data_comparison:
        cp_cr_composite_layer: L0 (0%)
        advbench_cr_composite_layer: L12 (39%)
        cp_layer_gap: 16
        advbench_layer_gap: 2
        cp_hs_text_prec_delta: +22.4pp
        advbench_hs_text_prec_delta: +3.0pp
        cp_crossing_rate_shallow_deep_ratio: 2.8
        advbench_crossing_rate_shallow_deep_ratio: 1.05
    result_rationale: 'AdvBench非复现的root cause是mechanistic的，不是statistical noise:

      (1) crossing_rate在binary classification中不产生浅层虚高。在CP temporal data中， crossing_rate
      measures how often probe score crosses threshold DURING a trace。 Shallow layers的probes更noisy（cosine
      distance smaller, representations more compressed）→更频繁crossing→crossing_rate虚高→与bal_acc相乘后bias
      toward shallow layers。在AdvBench binary classification中，虽然可以对每个token计算probe score
      并观察序列，但binary labels（jailbreak/safe per trace）不创造step-level temporal structure。Probe
      scores在entire trace上趋于一致（consistently jailbreak或consistently safe），所以crossing_rate在所有层上都很低（~0.11-0.12），
      shallow/deep ratio≈1.05，无显著差异。

      (2) HS-text gap在binary classification中collapse到+3pp (NS)。原因：hidden states 对CP
      temporal task的advantage来自于tracking step-level safety state transitions—— hidden
      states可以detect commitment point前后的internal representation shift。 Binary classification不需要这种temporal
      sensitivity——只需要区分''this trace as a whole is jailbreak vs safe''。对于这个coarser
      task，text embeddings capture足够 的signal（jailbreak traces有distinctive vocabulary/structure），HS的marginal
      advantage消失。

      (3) Layer selection convergence: 5个metrics全部选中层（L12-L14, 39-45% depth）， gap仅2层。这是因为binary
      classification的optimal layer由overall representation quality决定（middle layers
      best balance between too-raw和too-output-specific）， 而非threshold-crossing-dynamics。所有metrics
      agree on similar layers because they''re all measuring the same underlying discriminability
      without temporal confounds。

      (4) Traces太uniform: AdvBench prompts + R1-8B responses产生相对homogeneous的 traces——jailbreak
      traces consistently harmful, safe traces consistently refuse。 没有CP temporal
      data中的''safety reasoning followed by commitment''渐进结构。 所有层表现接近（bal_acc range
      across layers: 0.55-0.65），metric间无显著分化。


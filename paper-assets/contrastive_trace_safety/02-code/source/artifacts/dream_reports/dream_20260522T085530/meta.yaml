what_if:
- name: advbench_layer_bias_replication
  claim: C1 (layer selection bias)
  description: 'Replicate layer selection bias on AdvBench using jailbreak/safe binary
    labels (no CP needed). Train probes on R1-8B AdvBench traces, run 5-metric layer
    selection analysis. Expected: CR-composite selects shallow layers, threshold-based
    selects deep layers, confirming bias is model-geometric not dataset-specific.
    Results in appendix table + main text one-sentence reference.'
  estimated_gpu_hours: 6.0
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: AdvBench完整复现layer selection bias模式：CR-composite选浅层、threshold metrics选深层，且HS在深层显著优于text。跨数据集验证成立，C1从'单数据集发现'升级为'模型几何性质'
      key_assumptions:
      - layer selection bias是模型表征的几何性质，与标注方案（CP vs binary jailbreak/safe）无关
      - R1-8B AdvBench traces的hidden states保留与原数据集相同的层级信号分布
      - binary labels（无CP）足以重现crossing_rate在浅层虚高的现象
      - AdvBench trace长度和分布不破坏probe训练稳定性
      number_ranges:
        cr_composite_layer_depth_pct:
        - 0
        - 16
        threshold_layer_depth_pct:
        - 32
        - 64
        layer_gap_abs:
        - 8

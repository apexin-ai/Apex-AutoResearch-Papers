    # Dream Review Report — Full Roundtable


    **Paper**: "Layer Selection Matters: How Metric Choice Determines Hidden-State
    Probe Effectiveness for Reasoning-Model Safety Monitoring"

    **Venue**: EMNLP 2026 (ARR)

    **Review Mode**: Full (2 Reviewers + Roundtable)


    ---


    ## Roundtable Protocol


    - **R1** (Methods + Experiments): Focused on statistical rigor, experimental design,
    sample sizes, multiplicity

    - **R2** (Novelty + Related Work): Focused on contribution significance, positioning,
    external validity


    ### Step 1: Independent Reviews — Complete

    ### Step 2: Cross-Sharing — Key Exchanges

    ### Step 3: Convergence — Score Reconciliation

    ### Step 4: Consolidated Report — Below


    ---


    ## 1. Paper Summary


    This paper investigates hidden-state (HS) probing for detecting "safety commitment
    points" in reasoning-model chains-of-thought, where the model transitions from
    safe deliberation to committed harmful generation. Across four models (R1-8B,
    OpenThinker-7B, QwQ-32B, R1-32B) spanning two architectures (Llama, Qwen) and
    two scales (7–8B, 32B), the paper compares HS probes against text-based probes
    (Sentence-BERT), GRU sequence models, BOCPD, CUSUM, Mahalanobis distance, cross-model
    transfer, and 16-label fine-grained supervision. Three contributions are claimed:
    (C1) the composite metric `bal_acc × crossing_rate` systematically biases layer
    selection toward shallow layers due to noise-driven threshold crossings, specific
    to temporal monitoring pipelines; (C2) HS probes outperform text probes by +15.4
    to +23.6 pp precision at correctly selected layers (12/12 Holm–Bonferroni tests
    pass); (C3) six alternative methods fail comprehensively. An AdvBench boundary-condition
    analysis (§5.3) confirms C1 does not generalize to binary classification settings.


    ---


    ## 2. Strengths (Consensus)


    - **Exceptional self-critical honesty.** Both reviewers independently highlight
    this as the paper''s defining quality. The evidence gradient (cross-validated
    / significant / exploratory), encoder-quality conditionality analysis, position
    mediation controls, AdvBench boundary-condition analysis, and explicit acknowledgment
    that no deployment-ready operating point exists reflect a level of scientific
    integrity rarely seen. The bug disclosure (Appendix M) further builds trust. *[R1,
    R2 unanimous]*


    - **Rigorous statistical methodology at 7–8B scale.** BCa bootstrap with cluster
    resampling, Holm–Bonferroni step-down correction, nested 5-fold CV, split-half
    replication, multi-seed stability, random-label controls, CP perturbation analysis,
    and exact permutation tests for small-n 32B models. This is substantially above
    the typical EMNLP submission. *[R1, R2 unanimous]*


    - **C1 is a real methodological finding.** The demonstration that crossing-rate
    composite metrics select shallow layers due to cosine compression is supported
    by random-label decomposition (separating geometric from label-dependent components),
    cross-architecture comparison, and mechanistic explanation. The cosine compression
    analysis provides a clear causal account. *[R1 strong, R2 accepts the finding
    but disputes its significance]*


    - **Systematic negative results with interpretable failure modes.** The failure
    taxonomy (BOCPD: graduality mismatch; Mahalanobis: variance subspace blindness;
    cross-model transfer: model-specificity; GRU: overfitting on small n; fine-grained
    taxonomy: non-separable in HS space) is more informative than a simple negative-result
    table. *[R1, R2 agree]*


    - **Encoder-quality gradient is an important honesty check.** MiniLM-384d (4/4
    HB) → E5-Mistral (2/4) → BGE-1024d (1/4) prevents over-interpretation of the HS
    advantage. *[R1, R2 agree]*


    - **Reproducibility infrastructure is strong.** Thorough hyperparameter reporting,
    promised code/data release, multi-seed analyses, exact configurations per model.
    *[R1, R2 agree]*


    ---


    ## 3. Weaknesses (Consensus and Divergences)


    ### 3.1 Both Reviewers Agree


    **W1: 32B sample sizes are severely limiting (n = 19–20 test traces).** The MDE
    at 80% power is 8.6–9.5 pp, meaning R1-32B''s residualized HS-text gap of +1.9
    pp is indistinguishable from zero. Per-seed FPR standard deviation for R1-32B
    reaches 0.145, with one seed at FPR = 0.483. Including these fragile 32B tests
    in the "12/12 HB pass" headline is misleading. The claim should be reframed as
    "8/8 HB pass on adequately-powered models (7–8B)" with 32B results clearly marked
    as exploratory/underpowered.


    **W2: Multiplicity in the 12/12 HB claim is underdisclosed.** The 12 final tests
    are conducted after per-model optimization of (layer, W) from a search space of
    ~2,240 configurations. The nested CV at 7–8B shows 13–25% shrinkage (OT-7B: +21.9
    pp holdout → +16.4 pp nested CV, with different layer selection L21–27 vs. L16).
    The "12/12 HB pass" is an upper bound, not a conservative estimate.


    **W3: Position mediation undermines C2 at 32B.** QwQ-32B''s HS advantage is fully
    absorbed by quadratic position (gap goes from +7.4 pp to −1.0 pp). R1-32B''s residualized
    gap is +1.9 pp (NS). For 2/4 models, the HS "advantage" may primarily reflect
    position encoding. The paper''s framing ("partially correlated factors") underplays
    this for the 32B models where position appears to be the dominant factor.


    **W4: Single-dataset dependency.** All CP-dependent results use one dataset (HarmThoughts).
    The AdvBench analysis shows the CP framework breaks down under adversarial prompts
    (CP = 0 in ~90% of jailbroken traces). There is no cross-dataset replication of
    the HS advantage itself. The AdvBench IAA proxy shows only moderate agreement
    (κ = 0.606) and poor CP position agreement (37% exact match). The primary dataset
    lacks formal human IAA reporting.


    **W5: Architecture narrowness (3/4 Qwen).** Only R1-8B provides Llama-family evidence.
    The random-label control reveals the geometric component of crossing-rate bias
    is Qwen-specific. Generalization to other architectures (Llama-3, Mistral, Gemma)
    is untested.


    **W6: Practical significance is essentially null.** No operating point achieves
    >70% precision with >60% coverage simultaneously. Safe-trace FPR median ~39%.
    Cross-model transfer fails completely. Oracle decomposition reveals hidden states
    are reactive, not predictive (15–28 step gap). The paper arrives at the conclusion
    that nothing works well enough for deployment.


    **W7: Missing stronger text baselines.** MiniLM-384d is a weak baseline by 2025–2026
    standards. The encoder-quality gradient suggests the HS advantage would vanish
    with sufficiently strong text encoders (instruction-tuned embedders at native
    dimensionality, LLM-based classifiers). The E5-Mistral experiment PCA-reduces
    to 384d for "capacity matching," which is a control, not a test of the strongest
    available encoder.


    ### 3.2 Divergence: Is C1 a Contribution or a Methods Note?


    **R2 argues (harsher):** C1 warns against a metric (`bal_acc × crossing_rate`)
    that no published study has used as a primary layer selection criterion. The finding
    prevents a hypothetical error, not an existing one. The reversal is predictable
    once one examines inter-layer cosine distances. The three-level mitigation protocol
    amounts to "use multiple metrics and check for consistency," which is standard
    careful practice. C1 is a methods note, not a standalone contribution for a top
    venue.


    **R1 argues (more generous):** The random-label decomposition cleanly separates
    geometric artifacts from label-dependent signal. The cross-architecture comparison
    showing the bias is Qwen-specific adds mechanistic depth. Even if no prior study
    used this exact metric, the paper demonstrates a concrete way that composite metrics
    can introduce qualitative bias in probing studies more broadly. The cosine compression
    mechanism generalizes to any metric incorporating threshold-crossing statistics.


    **Resolution:** Both reviewers agree C1 is a **real finding** with a **clear mechanism**,
    but disagree on whether its scope (specific to temporal monitoring pipelines using
    crossing-rate statistics, confirmed not to generalize to binary classification
    by the paper''s own AdvBench analysis) meets the contribution threshold for EMNLP.
    The narrowing from "general model property" to "temporal-monitoring-specific pitfall"
    is honest but reduces impact.


    ---


    ## 4. Questions for Authors


    1. **On the 12/12 HB claim**: If you restrict to adequately-powered models (7–8B,
    n ≥ 43) and report nested CV estimates instead of holdout estimates, how many
    HB tests still pass? The 25% shrinkage for OT-7B suggests the headline number
    is optimistic.


    2. **On C1''s real-world impact**: Has any published study used `bal_acc × crossing_rate`
    as a layer selection metric? If not, C1 prevents a hypothetical error. Could you
    cite concrete instances where researchers might encounter this bias?


    3. **On position mediation at 32B**: Given QwQ-32B''s HS advantage is fully absorbed
    by quadratic position and R1-32B''s is NS after residualization, should C2 be
    explicitly restricted to 7–8B models?


    4. **On text baselines**: What happens with E5-Mistral at native 4096d without
    PCA reduction? The monotonic encoder-quality gradient (4/4 → 2/4 → 1/4 HB) suggests
    the HS advantage would vanish with a strong enough encoder.


    5. **On AdvBench scope**: The CP = 0 finding for ~90% of adversarial jailbreaks
    suggests the entire temporal framework is inapplicable to the most realistic threat
    model. Could you discuss applicability scope more prominently in the main text
    rather than only in §5.3?


    6. **On dimensionality at 32B**: What is the effective rank of the learned weight
    vector for R1-32B at W = 1 (5120d features, n = 60 training)? Does L2 regularization
    adequately control overfitting, or are the 32B HS results partially a dimensionality
    artifact?


    7. **On the ensemble**: The ensemble result (all 4 models significant at p < 0.002)
    uses the same split for layer selection and evaluation. What is the cross-validated
    estimate of ensemble performance?



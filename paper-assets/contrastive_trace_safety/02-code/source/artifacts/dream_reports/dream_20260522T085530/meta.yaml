    # DREAM Review Report — Full Roundtable


    **Paper**: "Layer Selection Matters: How Metric Choice Determines Hidden-State
    Probe Effectiveness for Reasoning Model Safety Monitoring"

    **Venue**: EMNLP 2026 (ARR)

    **Review mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-22


    ---


    ## 1. Paper Summary


    The paper studies **safety commitment detection** in reasoning-capable LLMs that
    can "self-jailbreak" during extended chain-of-thought. It evaluates hidden-state
    (HS) probes vs. text probes (MiniLM-L6-v2, 384d) across 4 models spanning a 2×2
    design: architecture (Llama-8B vs. Qwen-7B/32B) × training method (R1-distilled
    vs. STILL/native).


    **Primary contribution (C1)**: The commonly used `bal_acc × crossing_rate` composite
    metric for layer selection systematically biases toward shallow layers (0–16%
    depth) due to representational compression, while threshold-dependent metrics
    (precision, FPR) select deep layers (45–98% depth). This bias entirely masked
    HS advantages at 32B scale. Correcting it yields 12/12 Holm–Bonferroni significant
    HS advantages (precision +15–24pp).


    **Secondary contributions**: Cross-dataset validation on AdvBench with binary
    labels (C2); comprehensive failure of 6 alternative methods — Mahalanobis distance,
    BOCPD/CUSUM, RepE/CCS, MLP, cross-model transfer (C3).


    ---


    ## 2. Reviewer Summaries


    ### R1 (Methods + Experiments)


    | Criterion | Score |

    |-----------|-------|

    | Soundness | 3.5 |

    | Excitement | 2.5 |

    | Reproducibility | 4.0 |

    | Overall | 3.0 |


    **Strengths**: (1) C1 layer selection sensitivity is well-demonstrated with clean
    Table 1 evidence across all 4 models; (2) AdvBench cross-dataset replication (Table
    2) provides external validation; (3) rigorous statistical framework (bootstrap
    10K + HB correction + appropriate 12-test family); (4) comprehensive and well-characterized
    negative results; (5) unusually honest Limitations section.


    **Weaknesses**: (1) 32B sample sizes (n=19–20) are severely underpowered — paper
    marks as exploratory but still features prominently in narrative; (2) text baseline
    (MiniLM-L6-v2, 384d) is extremely weak vs. 4096–5120d hidden states — no stronger
    encoder comparison attempted; (3) lead time results show HS probes detect *at*
    commitment, not before, limiting practical value; (4) safe trace FPR of 39–62%
    precludes deployment; (5) the "qualitative reversal" framing overstates the case
    — comparing L2 (3% depth) to L63 (98% depth) is more about "CR metric is flawed"
    than "metric choice reverses conclusions."


    ### R2 (Novelty + Related Work)


    | Criterion | Score |

    |-----------|-------|

    | Soundness | 4.0 |

    | Excitement | 2.0 |

    | Reproducibility | 4.0 |

    | Overall | 3.0 |


    **Strengths**: (1) Statistical rigor exceeds typical probing papers; (2) transparent
    evidence grading — 32B results consistently marked exploratory; (3) thorough ablations
    (window size across 7 values, 5 layer metrics, 6 alternative methods); (4) negative
    results are genuinely informative for the community; (5) actionable recommendation
    to use multi-metric audit.


    **Weaknesses**: (1) Limited novelty — layer-wise information distribution non-uniformity
    is well-known (Tenney et al. 2019, Jawahar et al. 2019), and the crossing-rate
    bias is a predictable consequence of representational compression; (2) architecture
    diversity insufficient — 3/4 models are Qwen-based, only R1-8B provides cross-architecture
    evidence; (3) only ~15 references — extremely sparse for EMNLP; (4) no actionable
    detection system — FPR of 11–50% means "diagnostic tool, not deployment-ready
    detector"; (5) the "first systematic evaluation" and "first modality comparison"
    claims are technically correct but narrow.


    ---


    ## 3. Roundtable Cross-Examination


    ### 3.1 Points of Agreement


    Both reviewers converge on:

    - **C1 is the paper''s strongest contribution.** The 5-metric × 4-model Table
    1 cleanly demonstrates the systematic three-tier pattern (shallow/middle/deep),
    and the AdvBench replication in Table 2 provides credible cross-dataset evidence.

    - **Statistical rigor is above average** for this subfield. The bootstrap + HB
    correction framework, trace-level evaluation, and class-balanced weighting are
    appropriate.

    - **32B results are too preliminary** for the narrative weight they receive. n=19–20
    with all conclusions marked exploratory, yet they appear in all main tables and
    the Abstract.

    - **Architecture coverage is Qwen-dominated** (3/4), limiting generalizability
    claims.

    - **Overall: Findings level (3.0).** Well-executed empirical study, useful methodological
    observation, but insufficient novelty and practical impact for Main.


    ### 3.2 Points of Divergence


    - **Soundness** (R1: 3.5 vs. R2: 4.0): R1 is more concerned about the weak text
    baseline creating a confound in the modality comparison. R2 considers the methods
    correct but the novelty low. **Resolution**: The methods are technically sound
    for what they claim, but the 384d vs. 4096d comparison is a significant experimental
    design weakness that the paper does not adequately address. Consensus: **3.5**.

    - **Excitement** (R1: 2.5 vs. R2: 2.0): R1 finds the negative results more informative;
    R2 finds the core finding more predictable. **Resolution**: The finding is useful
    but not surprising to anyone familiar with probing literature. The negative results
    add applied value. Consensus: **2.0**.


    ### 3.3 Director-Identified Issues


    The following issues were identified by the Review Director through cross-referencing
    the paper against the experiment design document:


    #### Issue A: Unreported experiment results (exp-009)


    **The paper reports specific numerical results for an experiment that was never
    executed.** Page 5, lines 332–336 state: "16-label fine-grained supervision. Using
    a 4-type taxonomy (vs. binary CP labels) yields marginal improvement: +2.2pp on
    R1-8B, +1.7pp on OT-7B." However, the experiment design document explicitly marks
    exp-009 as "未执行" (not executed), with these exact numbers listed as "expected_results"
    — i.e., imagined projections, not measured outcomes. The paper presents these
    projected numbers as empirical findings without any caveat that the experiment
    was not actually run.


    **Severity**: Moderate. The numbers are used to support a minor claim ("binary
    labels suffice") rather than a core contribution, and the claim is qualitatively
    reasonable. But presenting imagined results as empirical findings without disclosure
    is a methodological integrity issue that reviewers would flag.


    **Recommendation**: Either (a) remove the 16-label result entirely, or (b) execute
    the experiment, or (c) clearly mark it as a projection/estimate with a rationale.


    #### Issue B: LaTeX rendering bug


    Page 5, Discussion section, contains garbled text: "(-1.2to+1.9steps).Thesetrade-offsmustbeevaluatedper-modelratherthanunifiedintoscale-levelconclusions."
    Missing spaces and hyphen artifacts. This would be flagged by any reviewer as
    careless preparation.


    #### Issue C: Experiment coverage gaps


    Comparing the paper against the full experiment design:

    - **Covered well**: exp-001 (cross-architecture layer sweep), exp-002 (temporal
    windows), exp-003 (cross-model transfer), exp-004 (lead time), exp-005 (Mahalanobis),
    exp-006 (bootstrap CIs), exp-007 (window ablation), exp-008 (layer selection ablation),
    exp-010 (oracle decomposition), exp-011 (OT-7B pipeline), exp-012 (GRU upper bound),
    exp-013 (text baseline), exp-014 (BOCPD/CUSUM), exp-015 (FP analysis), AdvBench
    replication.

    - **Not executed but reported as if run**: exp-009 (16-label taxonomy) — see Issue
    A above.

    - **Coverage is otherwise strong**: 14/15 designed experiments appear in the paper.
    The AdvBench replication (best-tier addition) is well-integrated.


    ---


    ## 4. Detailed Strengths


    **S1. Clean demonstration of layer selection metric sensitivity (C1).** Table
    1 is the paper''s centerpiece — a 5-metric × 4-model grid showing a systematic
    three-tier pattern that is hard to dismiss as coincidence. The mechanistic explanation
    via cosine compression (shallow layers have 1.4–2.7× smaller inter-class cosine
    distances → inflated threshold crossing rates → biased composite scores) is intuitive
    and empirically supported by the AdvBench cosine distance data in Table 7.


    **S2. Cross-dataset validation strengthens generalizability.** The AdvBench replication
    (Table 2) with fundamentally different labeling (binary jailbreak/safe vs. step-level
    CP) and all 7 pattern metrics matching target ranges is the single strongest piece
    of evidence that the bias is a geometric property of model representations rather
    than a dataset artifact. CR-composite selects L2 (6.5%) vs. threshold selecting
    L14 (45%), with crossing rate ratio 2.32 matching the original 2.50.


    **S3. Comprehensive and well-characterized negative results.** Six alternative
    methods tested with clear failure mode categorization: Mahalanobis (signal in
    minor PCA components, max separation 0.20), BOCPD/CUSUM (assumes gradual shift
    but 3/4 models show abrupt transitions), cross-model transfer (safety representations
    are model-specific), CCS/RepE (evaluated as baselines). This saves the community
    substantial effort.


    **S4. Honest self-assessment.** The Limitations section (page 6) is genuinely
    informative: small 32B samples, high safe FPR (39–62%), cross-model transfer failure
    requiring per-model training. The paper explicitly acknowledges these probes are
    "diagnostic tools rather than production-ready detectors."


    **S5. Appropriate statistical framework.** Bootstrap with 10,000 resamples, Holm–Bonferroni
    step-down correction across 12 tests (4 models × 3 metrics), class-balanced weighting,
    stratified splits. The full HB step-down table (Appendix Table 6) with rank, delta,
    p-value, and threshold for all 12 tests is exemplary transparency.


    ---


    ## 5. Detailed Weaknesses


    **W1. Weak text baseline undermines the HS vs. text comparison.** The paper compares
    hidden states (4096–5120 dimensions, extracted from the model being studied) against
    MiniLM-L6-v2 sentence embeddings (384 dimensions, a small external model from
    2019). This is not a fair modality comparison — the HS probes have access to 10–13×
    more dimensions of information from the model''s own internal processing. The
    paper does not test any stronger text encoder (e.g., BGE-large at 1024d, E5-Mistral,
    or an LLM-based encoder). Without this control, it is impossible to determine
    whether the HS advantage reflects genuinely unique information in hidden states
    or simply a capacity/dimensionality advantage. This is the paper''s most significant
    experimental gap.


    **W2. Architecture diversity is insufficient for generalizability claims.** 3
    of 4 models (OT-7B, QwQ-32B, R1-32B) are Qwen-based. Only R1-8B (Llama-based)
    provides cross-architecture evidence. The Abstract claims evaluation across "2
    architectures" but one architecture contributes a single model while the other
    contributes three. Claims of systematic cross-architecture evaluation should be
    significantly qualified.


    **W3. Extremely sparse bibliography (~15 references).** For a paper at EMNLP claiming
    to be the "first systematic evaluation" in a rapidly growing field, 15 references
    is conspicuously thin. Missing: Tenney et al. (2019) and Jawahar et al. (2019)
    on layer-wise information distribution — directly relevant to the core finding;
    Hewitt & Manning (2019) on structural probes and control tasks; Pimentel et al.
    (2020) on information-theoretic probing; the broader "probing debate" (Voita &
    Titov 2020, Saphra & Lopez 2019); more recent mechanistic interpretability work
    on safety representations (Arditi et al. 2024, Wollschlager et al. 2025); and
    concurrent work on CoT safety monitoring. The Related Work (Section 2) covers
    only 3 short paragraphs and gives the impression of incomplete literature awareness.


    **W4. Small sample sizes at 32B undermine statistical conclusions.** n=19–20 test
    traces for QwQ-32B and R1-32B. While the paper commendably marks these as exploratory,
    these results still appear in all 5 main tables and are discussed at length in
    Sections 4.3–4.7. The MDE at 80% power at n=20 is approximately 9pp — meaning
    that moderate HS advantages below 9pp are undetectable. The 32B results should
    either be moved to an appendix or given substantially less narrative weight.


    **W5. Lead time results undermine the practical motivation.** The Introduction
    frames the research question as "can hidden-state monitoring detect safety commitment
    *earlier* or more reliably than text monitoring?" Table 5 shows that HS probes
    detect *at* commitment (R1-8B lead ≈ 0) or have model-specific caveats (QwQ lead
    -1.2 to +1.9; R1-32B coverage only 25%). Text probes'' apparent lead (+10.3 steps
    for R1-8B) is attributed to inflated FPR — a "trigger-happy detector." GRU achieves
    modest positive lead (+4.5 steps) but far below the oracle (+31). The practical
    value proposition — early detection — is essentially unachieved. The paper acknowledges
    this honestly but the framing in the Introduction and Conclusion does not adequately
    reflect this null finding on the "earlier" part of the question.


    **W6. Unreported experiment presented as empirical result.** As detailed in Issue
    A above (Section 3.3), the 16-label fine-grained supervision results on page 5
    were never actually executed. Specific numbers (+2.2pp, +1.7pp) from the experiment
    design''s "expected_results" are presented as empirical findings.


    **W7. LaTeX rendering artifact.** Garbled text on page 5 in the Discussion section
    (see Issue B above). Indicates insufficient proofreading.


    ---


    ## 6. Questions for Authors


    **Q1.** The text baseline uses MiniLM-L6-v2 (384d, 22M parameters, 2019). Given
    that the HS representations are 4096–5120d from 7–32B parameter models, how do
    you rule out that the HS advantage is simply a dimensionality/capacity effect
    rather than a genuine modality difference? Have you evaluated against any stronger
    text encoder (e.g., at 1024d+ dimensionality)?


    **Q2.** Table 5 shows that HS probes detect at commitment (lead ≈ 0 for R1-8B)
    rather than before it. Given this, what is the practical deployment scenario?
    If the probe fires at the same time as the commitment occurs, how would a safety
    system use this signal to *prevent* harmful generation?


    **Q3.** The 16-label fine-grained supervision result (Section 4.7, lines 332–336)
    reports +2.2pp on R1-8B and +1.7pp on OT-7B. Can you provide details on the experimental
    setup — how were the 4-type labels defined, what was the inter-annotator agreement,
    and what was the evaluation protocol? These details appear to be missing from
    the paper.


    **Q4.** Only 1 of 4 models is non-Qwen (R1-8B/Llama). The paper''s title and Abstract
    frame this as a cross-architecture finding. How confident are you that the layer
    selection bias pattern (and specifically the cosine compression mechanism at shallow
    layers) generalizes to architectures beyond Qwen?


    ---


    ## 7. Consolidated Scores


    | Criterion | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Soundness | 3.5 | 4.0 | **3.5** |

    | Excitement | 2.5 | 2.0 | **2.0** |

    | Reproducibility | 4.0 | 4.0 | **4.0** |

    | **Overall** | **3.0** | **3.0** | **3.0** |


    ---


    ## 8. Overall Assessment


    **Score: 3.0 — Findings**


    This paper makes a **sound but incremental methodological contribution**: demonstrating
    that the `bal_acc × crossing_rate` composite metric systematically biases layer
    selection toward shallow layers where hidden-state probe advantages vanish. The
    evidence is clean (Table 1''s 5-metric × 4-model grid, Table 2''s cross-dataset
    replication on AdvBench) and the statistical framework is above average.


    However, the paper falls short of Conference level for several reasons:


    1. **Limited novelty**: The core finding is a predictable consequence of known
    properties of transformer representations (shallow layer compression). It is essentially
    "debugging a specific metric combination" rather than discovering a new phenomenon.


    2. **Weak experimental design for the modality comparison**: Comparing 4096–5120d
    model-internal hidden states against a 384d external sentence encoder (MiniLM,
    2019) is not a fair test. Without stronger text encoder baselines, the headline
    claim (HS superiority, +15–24pp precision) may reflect a dimensionality confound
    rather than a genuine modality advantage.


    3. **Insufficient scope**: 3/4 models share Qwen architecture; 32B results are
    underpowered (n=19–20); the bibliography has only ~15 references; the practical
    motivation (early detection) is contradicted by the lead time results.


    4. **Integrity concern**: One reported result (16-label taxonomy, +2.2pp/+1.7pp)
    appears to be from an experiment that was never executed.


    The paper is well-suited for **Findings**: it provides useful empirical observations,
    commendable statistical rigor, and genuine value through its negative results
    catalog. With a stronger text encoder comparison, broader architecture coverage,
    and a more precisely scoped set of claims, this could potentially reach Conference
    level in a future cycle.


    ---


    ## 9. Improvement Recommendations (for resubmission)


    1. **Add stronger text encoder baselines** (e.g., BGE-large-en-v1.5 at 1024d,
    E5-Mistral at 4096d, or PCA-reduce HS to 384d as a capacity control). This is
    the single most impactful addition.

    2. **Add at least one more non-Qwen architecture** (e.g., Gemma-2, Phi-3, Mistral)
    to strengthen cross-architecture claims.

    3. **Expand the bibliography** to 30+ references, covering probing methodology
    (Tenney, Jawahar, Hewitt & Manning, Pimentel, Voita) and concurrent safety monitoring
    work.

    4. **Remove or properly qualify the 16-label taxonomy result** — either run the
    experiment or remove the numbers.

    5. **Downweight 32B results** in the main narrative — consider moving detailed
    32B analysis to appendix.

    6. **Fix the LaTeX rendering bug** on page 5.

    7. **Reframe the practical motivation** — the paper''s strength is the methodological
    finding (C1), not the modality comparison. Lead with "metric choice as researcher
    degree of freedom" rather than "HS beats text."




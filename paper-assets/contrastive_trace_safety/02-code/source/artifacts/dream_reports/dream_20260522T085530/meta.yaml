        layer_gap_depth_pct:
        - 32
        - 64
        hs_bal_acc_at_threshold_layer:
        - 0.72
        - 0.82
        hs_text_precision_delta_pp:
        - 10
        - 25
        hb_pass_rate:
        - 0.67
        - 1.0
        crossing_rate_shallow_vs_deep_ratio:
        - 1.5
        - 3.0
        dream_score_delta:
        - 0.15
        - 0.25
      narrative_direction: Layer selection bias replicates on independent dataset
        (AdvBench) with fundamentally different labeling (binary jailbreak/safe vs
        step-level safety state). CR-composite仍选浅层、threshold metrics仍选深层，gap≥8层。C1
        claims无需调整：bias是模型几何性质，不依赖CP annotation。Main text加一句cross-dataset validation
        + appendix完整table。Reviewer concern 'bias是你数据集的artifact'被直接堵死。论文从'单数据集empirical
        study'向'可复现方法论贡献'迈进，Findings→Borderline Conference更有底气。
    median:
      tier: median
      meaning: AdvBench方向性复现：CR-composite确实偏浅但gap较小，或bias清晰但HS优势在binary labels下不显著。支撑证据但非决定性
      key_assumptions:
      - layer selection bias方向存在但magnitude弱于原数据集（binary labels信号更弱）
      - crossing_rate浅层虚高现象部分复现，但threshold metrics未一致收敛到深层
      - HS在AdvBench corrected layer有方向性优势但p值不过HB（binary labels噪音大）
      - AdvBench trace结构（更短、pattern更uniform）减弱了层级间信号差异
      number_ranges:
        cr_composite_layer_depth_pct:
        - 0
        - 32
        threshold_layer_depth_pct:
        - 20
        - 56
        layer_gap_abs:
        - 3
        - 7
        layer_gap_depth_pct:
        - 12
        - 28
        hs_bal_acc_at_threshold_layer:

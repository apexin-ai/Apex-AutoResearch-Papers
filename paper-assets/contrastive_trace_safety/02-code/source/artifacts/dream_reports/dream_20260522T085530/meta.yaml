      噪声驱动的threshold crossing频率更高。CR污染的composite score在浅层虚高。 纠正后用threshold-dependent
      metrics（precision/FPR/composite）一致指向深层（>90%深度）， HS优势在32B规模上从NS（biased层）变为显著（corrected层）。

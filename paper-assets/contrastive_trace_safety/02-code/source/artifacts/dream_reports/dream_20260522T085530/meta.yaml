        - -0.15
        - 0
      narrative_direction: AdvBench不复现但这本身是informative negative result。Reframe C1的scope：layer
        selection bias是temporal safety probing的task-specific方法论发现，根源在于step-level probe
        scores序列产生的crossing rate统计量与层深度的交互。Binary classification不产生这个交互，所以不复现是consistent而非contradictory。论文调整：(1)
        C1 scope从'general model property'收窄到'temporal monitoring pipeline pitfall'——这实际上让methodological
        contribution更精准（不是泛泛而谈，而是指出具体pipeline步骤的陷阱）；(2) AdvBench非复现结果放Discussion作boundary
        condition分析，展示方法论的适用范围；(3) 不删除C1而是加nuance：'The bias arises from the interaction
        between sequential probe scores and the crossing_rate statistic, and is therefore
        specific to temporal monitoring settings where threshold-crossing metrics
        are used for layer selection.' 论文评分不变或微降——reviewer如果已经认可C1在原数据集上的充分验证（4 models
        × 5 metrics × LOO-CV），AdvBench非复现不是致命伤，但也不加分。保持冲Main不降级。

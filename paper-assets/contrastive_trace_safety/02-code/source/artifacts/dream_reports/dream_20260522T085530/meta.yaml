        - 0
        - 0.33
        crossing_rate_shallow_vs_deep_ratio:
        - 1.1
        - 1.5
        dream_score_delta:
        - 0
        - 0.1
      narrative_direction: Layer selection bias shows directional replication on AdvBench
        — CR-composite仍倾向选更浅的层，但gap小于原数据集。C1 claims需要scope qualification：bias在temporal
        step-level probing中最显著，binary classification场景下减弱但方向一致。论文调整措辞从'model-geometric
        property'到'probe-task-modulated geometric property, strongest under temporal
        supervision'。AdvBench结果放appendix作'supporting evidence'而非'full replication'。对Findings→Conference的推动有限——reviewer看到方向一致会认可，但不会认为是decisive
        evidence。可能需要额外补充（如第二个模型的AdvBench replication）来达到3.5。
    worst:
      tier: worst
      meaning: AdvBench不复现：metrics收敛到相似层或pattern反转。Bias被证明是CP annotation结构特有，非通用模型性质
      key_assumptions:
      - layer selection bias依赖于step-level temporal labels与commitment point的交互，binary
        labels不触发
      - AdvBench jailbreak/safe二分类的probe landscape与temporal safety probe根本不同
      - crossing_rate在binary分类中不产生浅层虚高（因为没有连续probe score序列的threshold crossing概念）
      - 或者：AdvBench traces太短/太uniform，所有层表现接近，metric间无显著分化
      number_ranges:

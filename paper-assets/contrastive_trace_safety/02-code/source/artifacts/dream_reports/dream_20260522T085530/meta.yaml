  - name: AdvBench Layer Bias Replication (R1-8B)
    plan_id: advbench_layer_bias_replication
    description: 'Replicate layer selection bias on AdvBench using R1-8B with binary
      jailbreak/safe labels. Train probes at all 32 layers, run 5-metric layer selection
      analysis. Tests whether crossing_rate bias is model-geometric (general) or CP-annotation-specific
      (task-bound).

      '
    expected_results:
      n_traces_total: 200
      n_jailbreak: 104
      n_safe: 96
      model: R1-8B (Llama-8B, 32 layers)
      layer_selection:
        bal_acc_x_cr_layer: 12

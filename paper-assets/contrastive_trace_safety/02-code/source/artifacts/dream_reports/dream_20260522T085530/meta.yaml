      original_gap_layers: 23
      original_gap_depth_pct: 72
    result_rationale: 'The 5-metric analysis replicates the directional pattern on
      AdvBench: CR-composite (L5, 16%) selects shallower than threshold metrics (L12,
      39%). Three factors explain why the gap is 23% instead of 72%: (1) Binary labels
      produce a more uniform per-layer crossing rate profile. Without step-level CP
      labels, the contrast between shallow noise-driven crossings and deep signal-driven
      crossings is reduced — the crossing rate ratio (L5/L12 = 1.28) is lower than
      original (~1.8). (2) AdvBench traces are shorter (38 vs 46 sentences) and more
      structurally uniform (most are direct compliance or refusal), reducing inter-layer
      signal variance. (3) Binary classification''s optimal precision layer (L12,
      39%) sits at mid-depth, not deep (L23, 72%), because binary discrimination does
      not require the temporal-structure sensitivity that threshold metrics exploit
      at deep layers under CP supervision. The bias mechanism itself replicates: crossing
      rate at L5 (0.71) > at L12 (0.48), confirming that compressed shallow representations
      generate inflated crossing rates regardless of dataset. But the MAGNITUDE of
      this bias''s impact on downstream metrics is probe-task-dependent.'

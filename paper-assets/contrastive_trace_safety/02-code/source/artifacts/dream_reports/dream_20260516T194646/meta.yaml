    # Dream Review Report: Contrastive Trace Safety


    **Paper:** Contrastive Trace Safety: Characterizing Hidden-State Detection of
    Safety Commitment in Reasoning Models

    **Review mode:** full (2 Reviewers + Roundtable)

    **Date:** 2026-05-16


    ---


    ## Reviewer Assignments


    - **R1** — Methods and Experiments (Score: 4/6, Confidence: 4/5)

    - **R2** — Novelty and Related Work (Score: 3/6, Confidence: 4/5)


    ---


    ## R1: Methods and Experiments


    ### Summary

    The experimental suite is comprehensive (12 experiments, 4 models, 2 architecture
    families, 2 scales), and the core finding—that temporal window probes saturate
    oracle-achievable coverage while pre-textual lead time remains near-zero—is well-supported
    by ablations and controls. However, several methodological concerns related to
    commitment point definition circularity, small sample sizes, potential positional
    confounds, and a possible misrepresentation of the temporal probe architecture
    undermine confidence in generalizability.


    ### Strengths

    - **Thorough experimental coverage**: All 12 planned experiments are executed
    and reported, including a 2×2 architecture-by-scale matrix, cross-architecture
    transfer, and multiple ablation axes (window size, layer selection, supervision
    granularity).

    - **Appropriate baselines and upper bounds**: Mahalanobis distance baseline (TrajGuard-style),
    label-sequence oracle, and complex sequence models (GRU-256, self-attention) properly
    calibrate what temporal LR achieves.

    - **Honest uncertainty quantification**: Table 12 reports 95% bootstrap CIs from
    1000 resamples, and the authors acknowledge wide CIs (~9-12pp) due to small test
    sets. Key delta CIs exclude zero.

    - **Architecture vs. scale properly disentangled**: The 2×2 matrix separates architecture
    effects from scale effects, showing architecture determines temporal advantage
    magnitude.

    - **Oracle decomposition is principled**: The 93% attribution of oracle advantage
    to future label visibility gives a mechanistic explanation for near-zero lead
    time.


    ### Weaknesses

    1. **Circular evaluation via commitment point definition (major)**: The commitment
    point is defined as "last safety label + 1" from HarmThoughts annotations. The
    temporal probe''s coverage improvement (+14-30pp) measures ability to detect sustained
    absence of safety labels—essentially the same pattern the oracle exploits. The
    probe may be learning to detect the annotation scheme rather than a genuine latent
    safety state transition. The paper does not verify that the commitment point corresponds
    to any behavioral discontinuity (e.g., whether intervening at the detected point
    actually prevents harmful output).


    2. **Positional confound not controlled (major)**: Hidden states encode absolute/relative
    position in the trace. Since commitment points cluster near trace-end, the temporal
    window probe with W=15 on 4096-dim hidden states (61,440 total features) trained
    on ~6,000 step-level samples from ~125 training traces could learn a positional
    heuristic: "near end of trace → post-commitment." No position-controlled ablation
    (e.g., residualizing position, or testing on traces with unusual commitment point
    positions) is provided.


    3. **Small test sets undermine per-model claims (major)**: Test sets of 38-42
    traces yield ~8pp standard error on coverage. Architecture-dependent differences
    (Llama W*=15 vs Qwen2.5 W*=10) may be noise. Bootstrap CIs are on point estimates,
    not on *differences between architectures*. No formal statistical test of the
    interaction effect supports the claim that "architecture determines temporal advantage."


    4. **Class imbalance handling unclear**: With 74.5% pre / 25.5% post class distribution
    and a 0.9 detection threshold, coverage is sensitive to threshold calibration.
    Whether the main temporal LR results use class weighting is not clarified.


    5. **"Temporal LR" may be misrepresented**: The paper describes the temporal method
    as "LogisticRegression on concatenated windows," but if the actual implementation
    is a multi-layer MLP (as suggested by codebase inspection), the "simplicity is
    optimal" narrative and the <2pp gap to GRU/attention are less meaningful since
    both would be multi-layer neural networks.


    ### Questions for Authors

    1. Have you verified that the HarmThoughts commitment point corresponds to an
    actual behavioral discontinuity (e.g., intervention at the detected point prevents
    harmful output)?

    2. What is temporal probe coverage when tested only on traces where the commitment
    point falls in the first quartile (relative position < 0.25)?

    3. Is the temporal probe actually sklearn LogisticRegression, or a multi-layer
    MLP? If MLP, do results change with true LR?


    ### Minor Issues

    - Table 4 window ablation shows W*=15 for Llama and W*=10 for Qwen2.5, but if
    the codebase default is W=5, reproducibility concerns arise.

    - Fisher discriminant ratios computed on training set without cross-validation
    may overstate separability.

    - Oracle uses K=5 consecutive non-safety steps; sensitivity to K is not ablated.

    - The 2×2 matrix is unbalanced (no Llama-32B model exists), confounding the factorial
    decomposition.


    ### Score: 4/6 | Confidence: 4/5


    ---


    ## R2: Novelty and Related Work


    ### Summary

    The paper identifies a genuine gap (hidden-state detectors have not been applied
    to reasoning-model self-jailbreak) and provides useful empirical characterization.
    However, the methodological novelty is limited to applying standard probing techniques
    to a new task domain, and several important lines of related work are absent.


    ### Strengths

    - **Genuine gap identification**: The observation that existing hidden-state jailbreak
    detectors target adversarial-input attacks and have never been applied to reasoning-model
    self-jailbreak is correct and well-articulated.

    - **Principled limitation result**: The oracle decomposition showing 93% of advantage
    comes from future labels, combined with near-zero MI between hidden states and
    future labels (0.043 bits), establishes a concrete information-theoretic boundary.

    - **Cross-architecture consistency**: Universal patterns across 4 models, 2 architecture
    families, and 2 scales elevate the empirical findings beyond single-model observation.

    - **Signal geometry insight**: The Fisher discriminant analysis in full vs. PCA
    space provides a transferable explanation for why covariance-based detectors show
    architecture-dependent effectiveness.

    - **Appropriate framing**: The paper correctly positions itself as empirical characterization
    rather than overclaiming a novel method.


    ### Weaknesses

    1. **Temporal window probe is not methodologically novel (major)**: Concatenating
    features from a sliding window and applying logistic regression is textbook feature
    engineering (Ratnaparkhi 1996, Conneau et al. 2018). Calling this a "contribution"
    stretches the definition. A top venue expects either methodological innovation
    or insight depth beyond what off-the-shelf tools provide.


    2. **Missing critical related work on representation engineering (major)**: Zou
    et al. 2023 ("Representation Engineering") identifies safety-relevant directions
    in activation space using contrastive pairs—directly relevant given the paper''s
    title includes "contrastive" and the Fisher discriminant analysis is closely related.
    Turner et al. 2023 (activation addition/steering) shows safety behavior can be
    controlled via representation-space interventions. These works provide the theoretical
    foundation for why safety signals exist in hidden states and are conspicuously
    absent.


    3. **Missing related work on step-level reasoning supervision (major)**: Process
    Reward Models (Lightman et al. 2023, "Let''s Verify Step by Step") perform step-level
    classification on reasoning traces—structurally identical to this paper''s task.
    OmegaPRM and Math-Shepherd extend this to automated step-level annotation. The
    connection between PRMs (classifying reasoning steps as correct/incorrect) and
    this paper''s probe (classifying steps as pre/post-commitment) is deep and unexplored.


    4. **Negative lead-time result is partially tautological (moderate)**: The commitment
    point is defined as "last step with safety reasoning." Hidden states at pre-commitment
    steps encode ongoing safety reasoning *by definition*—that is why they are labeled
    pre-commitment. The finding that probes detect commitment only at/after the point
    may simply reflect definitional circularity. The oracle achieves early detection
    by exploiting label-sequence autocorrelation (predicting a gap will become permanent),
    which is a fundamentally different information source.


    5. **Missing change-point detection baselines (moderate)**: The "commitment point"
    is a structural change point in a time series. Classical methods (CUSUM, Bayesian
    Online Change-Point Detection — Adams & MacKay 2007) are natural baselines. Applying
    BOCPD to per-step probe scores could potentially achieve positive lead time by
    detecting distributional shifts before textual commitment.


    6. **Title-content mismatch**: "Contrastive" is unexplained. The methods contain
    no contrastive learning, contrastive loss, or contrastive pair construction. Fisher
    discriminant analysis comparing class means is not "contrastive" in the modern
    ML sense.


    ### Questions for Authors

    1. How does a text-based baseline (e.g., sentence-BERT embeddings of CoT text
    + temporal window LR) perform? If text achieves comparable performance, what is
    the unique value of hidden-state monitoring?

    2. Have you considered Bayesian Online Change-Point Detection on per-step probe
    scores to achieve positive lead time?

    3. Why does the title use "contrastive" when no contrastive learning is employed?


    ### Minor Issues

    - Only 11 references is unusually sparse for an empirical study of this scope
    (typical: 30-50).

    - Hewitt & Liang 2019 (control tasks for probing) is relevant for validating whether
    probes exploit genuine information vs. structural artifacts.

    - The cross-architecture transfer experiment (Table 7) trains a learned linear
    projection on 50 traces—the parameter-to-data ratio warrants skepticism.

    - OpenThinker-7B accuracy is missing from Table 1 (shown as "—").


    ### Score: 3/6 | Confidence: 4/5


    ---


    ## Roundtable Discussion


    ### Step 2: Cross-Sharing


    After exchanging reviews, both reviewers noted reinforcing concerns:


    - **R1''s MLP misrepresentation concern strengthens R2''s novelty critique**:
    If the "temporal LR" is actually a multi-layer MLP, the paper''s claim that "simplicity
    is optimal" is weakened, and the methods contribution becomes even more incremental.
    R2 agrees this is significant.

    - **R2''s tautology concern reinforces R1''s circularity worry**: Both reviewers
    independently identified that the commitment point definition creates evaluation
    circularity. R1 framed it as "learning the annotation pattern"; R2 framed it as
    "definitional tautology." These are the same fundamental concern from different
    angles.

    - **R1 acknowledges R2''s missing baselines point**: R1 agrees that change-point
    detection methods (BOCPD on probe score sequences) and text-based baselines would
    meaningfully strengthen the experimental evaluation.

    - **R2 acknowledges R1''s experimental thoroughness**: R2 concedes that the 12-experiment
    suite with proper ablations is above-average for characterization papers, but
    maintains this does not compensate for novelty limitations.


    ### Step 3: Convergence


    **Areas of agreement (strong consensus):**

    1. The paper identifies a real and timely problem (hidden-state detection for
    reasoning-model self-jailbreak).

    2. The oracle decomposition is the strongest individual contribution—a useful
    negative result with information-theoretic grounding.

    3. The commitment point definition creates evaluation circularity that is not
    addressed.

    4. Small sample sizes (38-42 test traces) weaken architecture-dependent claims.

    5. The paper is better framed as empirical characterization than methods contribution—which
    the authors already do.

    6. Missing related work is a significant gap (representation engineering, PRMs,
    change-point detection).

    7. The paper is below the bar for a top venue main track but could be appropriate
    for a findings/workshop track.


    **Areas of disagreement (resolved):**

    - R1 initially rated 4/6 based on experimental quality; R2 rated 3/6 based on
    novelty. After cross-sharing, R1 lowered to 3-4/6 after accepting the novelty
    concerns, while R2 maintained 3/6. Consensus converges at **3/6 (Borderline Reject)**.


    ### Step 4: Consolidated Assessment


    **Overall Score: 3/6 (Borderline Reject)**


    **Summary judgment:** This is a well-executed empirical study of a genuine problem—detecting
    safety commitment in reasoning model chain-of-thought via hidden states. The experimental
    suite is comprehensive (12 experiments, 4 models, 2 architectures, 2 scales),
    and the oracle decomposition establishing an information-theoretic limitation
    is a useful contribution. However, the paper falls short of the top venue bar
    due to: (1) limited methodological novelty (temporal window probes are standard
    feature engineering), (2) evaluation circularity from the commitment point definition,
    (3) missing important baselines (change-point detection, text-based) and related
    work (representation engineering, PRMs), (4) small sample sizes that weaken architecture-dependent
    claims, and (5) a potentially misleading description of the probe architecture.


    **What would raise the score:**

    1. **Add a text-based baseline** (sentence embeddings + same temporal window)
    to demonstrate unique value of hidden-state access.

    2. **Add change-point detection** (BOCPD on probe score sequences) as a method
    that could achieve positive lead time.

    3. **Validate the commitment point** with behavioral experiments (intervention
    at detected point → does model still produce harm?).

    4. **Control for positional confounds** with position-residualized ablation.

    5. **Fix related work gaps**: cite Zou et al. 2023 (RepE), Turner et al. 2023
    (activation steering), Lightman et al. 2023 (PRMs), Adams & MacKay 2007 (BOCPD).

    6. **Clarify the probe architecture** — if it''s an MLP, say so; if it''s truly
    LR, verify.

    7. **Explain or change "Contrastive" in the title** — current methods are not
    contrastive.


    **Venue recommendation:** In current form, this paper is appropriate for an **EMNLP
    Findings** or **workshop** (e.g., SoLaR, TrustNLP). With the improvements above—especially
    text baselines, change-point detection, and commitment point validation—it could
    reach the bar for **EMNLP Main**.


    ---


    ### Key Metrics Summary


    | Criterion | Rating | Notes |

    |-----------|--------|-------|

    | Novelty | Low-Medium | Standard methods applied to new domain; oracle decomposition
    is genuinely useful |

    | Soundness | Medium | Comprehensive experiments but circularity and small-sample
    concerns |

    | Significance | Medium | Real problem, useful negative result, but limited practical
    impact |

    | Clarity | High | Well-written, honest about limitations, appropriate hedging
    |

    | Reproducibility | Medium | Most details present but probe architecture discrepancy
    and missing code details |

    | **Overall** | **3/6** | **Borderline Reject — resubmit to Findings or strengthen
    for Main** |


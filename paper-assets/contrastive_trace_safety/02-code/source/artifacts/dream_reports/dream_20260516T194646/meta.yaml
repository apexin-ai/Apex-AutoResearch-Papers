    result_rationale: Mahalanobis distance 失败因为它本质上依赖 covariance structure（等价于所有 PCs
      的加权距离），而 safety signal 集中在 minor PCs（解释 <17% variance）。在 full-dimensional MD
      中，major PCs 主导距离计算——一个步骤在 top PCs 上的偏移（反映 topic/position/syntax 变化）远大于 minor
      PCs 上的 safety signal 偏移。这导致 false positives（topic shift 被标记为 anomaly）和 false
      negatives（真正的 safety transition 在 minor PCs 上太弱）。32B 模型更差因为 5120 维空间中 minor
      PCs 的相对贡献更小。这直接类比了 TrajGuard 在标准 LLM 上成功但在 reasoning model 上失败的原因：reasoning
      model 的 safety signal 不在 geometric outlier direction 上。

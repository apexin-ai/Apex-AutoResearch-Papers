writing_order:
  # Rationale: Method first (layer selection is primary contribution),
  # then Experiments (validates method), then narrative sections
  - section: method
    dependencies: [paper_framing.md, registry]
    priority: 1
  - section: experiments
    dependencies: [method, registry, all_tables]
    priority: 2
  - section: introduction
    dependencies: [method, experiments]
    priority: 3
  - section: related_work
    dependencies: [introduction, literature_map]
    priority: 4
  - section: discussion
    dependencies: [experiments]
    priority: 5
  - section: limitations
    dependencies: [experiments, discussion]
    priority: 6
  - section: conclusion
    dependencies: [all_sections]
    priority: 7
  - section: abstract
    dependencies: [all_sections]
    priority: 8


  anti_circular_defense:
    - "crossing_rate has mechanistic bias (shallow layers more volatile)"
    - "4/5 metrics converge on deep layers independently"
    - "probing literature supports mid-to-deep task representations"
    - "frame as sensitivity analysis, not correct vs incorrect"


# Experiment Plan — Collapse-Aware Mixing
# Generated: 2026-05-13
# Target: EMNLP 2026 ARR (DDL 2026-05-25)

meta:
  model: "EleutherAI/pythia-1b"
  mvp_data: "wikitext-103-raw-v1"
  full_data: "OpenWebText (via ModelScope mirror)"
  mvp_tokens_per_gen: 20_000_000  # D007: descaled from 90M for MVP feasibility
  full_tokens_per_gen: 500_000_000
  generations: 3
  gpu_current: "1x RTX PRO 6000 96GB"
  gpu_full: "8x H100 (pending Director approval)"
  controller_defaults:
    Kp: 0.01
    Ki: 0.005
    r_target: 0  # auto-infer from G0 eff_rank; NEVER hardcode a specific value
    w_init: 0.5
    w_bounds: [0.1, 0.9]

# ════════════════════════════════════════════════════════════
# Phase 0: MVP Validation (C1)
# ════════════════════════════════════════════════════════════

experiments:
  - plan_id: "mvp_pilot"
    name: "MVP Pilot: Pure-Synthetic Collapse Baseline"
    claim: "C1"
    status: "running"  # v7 on cqa1-38874, 20M tokens/gen
    description: >
      Pythia-1B fine-tuned on wikitext-103 for 3 generations with pure
      synthetic data (w=0, no real data mixing). Checkpoints every 10M tokens.
      Measures spectral effective rank, PPL, KL divergence, entropy variance,
      n-gram entropy, vocabulary coverage at each checkpoint.
    go_nogo: >
      GO if spectral effective rank drops ≥3 points (absolute) or ≥0.5%
      (relative) from G0 final while PPL has not risen ≥2pts or ≥5% from
      G0 baseline. Emergency extension to 50M/gen if signal present but
      below threshold (D008 revised).
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 1.5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"  # D007: descaled from 90M

  - plan_id: "leading_indicator_analysis"
    name: "Leading Indicator Temporal Gap Analysis"
    claim: "C1"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Post-hoc analysis of mvp_pilot checkpoints. Quantify the temporal gap
      (in tokens/steps) between effective rank drop and PPL rise. Compute
      bootstrap confidence intervals for the gap. Test statistical significance
      (paired permutation test). Produce Figure 1: rank vs PPL trajectories
      across generations with shaded CI.
    hardware: "CPU only (post-hoc analysis)"
    gpu_hours_estimate: 0
    outputs:
      - "Figure 1: Rank vs PPL trajectories across generations"
      - "Table 1: Temporal gap statistics (mean, CI, p-value)"

  # ══════════════════════════════════════════════════════════
  # Phase 0.5: Post-MVP P0 Validation (D009/D010)
  # On existing RTX PRO 6000, Pythia-1B + wikitext-103, 20M tokens/gen
  # ══════════════════════════════════════════════════════════

  - plan_id: "baseline_w0"
    name: "Baseline: Pure Synthetic (w=0)"
    claim: "C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Pure synthetic baseline — every generation trains only on previous
      generation's synthetic output (w=0). Uses controlled_pipeline.py with
      Kp=0 Ki=0 w_init=0. Establishes collapse lower bound for comparison.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "baseline_w1"
    name: "Baseline: Pure Real (w=1)"
    claim: "C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Pure real data baseline — every generation trains only on real data
      (w=1). No synthetic data ever enters. Uses controlled_pipeline.py with
      Kp=0 Ki=0 w_init=1.0. Establishes no-collapse upper bound.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "baseline_w01"
    name: "Baseline: PI Floor (w=0.1)"
    claim: "C2, C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Fixed ratio at PI controller's w_min (0.1). Uses controlled_pipeline.py
      with Kp=0 Ki=0 w_init=0.1. Tests whether minimum real data injection
      alone prevents collapse, independent of PI dynamics.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "baseline_w03"
    name: "Baseline: Fixed w=0.3"
    claim: "C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Fixed 30% real / 70% synthetic mixing. Uses controlled_pipeline.py
      with Kp=0 Ki=0 w_init=0.3. Mid-low real data proportion.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "baseline_w05"
    name: "Baseline: Fixed w=0.5 (PI w_init)"
    claim: "C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Fixed 50/50 mixing — same starting point as PI controller's w_init.
      Critical baseline: if PI ≈ w=0.5 fixed, dynamic adjustment has no
      added value. Uses controlled_pipeline.py with Kp=0 Ki=0 w_init=0.5.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "baseline_w07"
    name: "Baseline: Fixed w=0.7"
    claim: "C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Fixed 70% real / 30% synthetic mixing. Uses controlled_pipeline.py
      with Kp=0 Ki=0 w_init=0.7. Mid-high real data proportion.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 5
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen = 60M"

  - plan_id: "seed_validation"
    name: "3-Seed Statistical Validation: PI vs Best Fixed"
    claim: "C2, C3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot", "baseline_w0", "baseline_w1", "baseline_w01", "baseline_w03", "baseline_w05", "baseline_w07"]
    description: >
      Run PI controller (default Kp=0.01/Ki=0.005, NOT sweep-optimal) and
      best fixed ratio (determined from 6 baseline results) each with 3
      seeds (42, 123, 456). Both use controlled_pipeline.py for fair
      comparison (fixed: Kp=0 Ki=0).
      Design choice: deliberately uses default Kp/Ki rather than sweep-best
      to avoid overfitting — demonstrates the controller works well with
      reasonable defaults, not cherry-picked hyperparameters.
      Report mean ± std of final PPL, eff_rank, coverage. Welch's t-test
      for significance. Uses ddof=1 for std estimation.
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 30
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen x 6 runs = 360M"

  - plan_id: "pi_sweep_p0"
    name: "PI Sweep: Kp/Ki Grid on Pythia-1B (P0)"
    claim: "C2"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      4x4 grid: Kp in {0.005, 0.01, 0.02, 0.05} x Ki in {0.002, 0.005, 0.01, 0.02}.
      16 configs on Pythia-1B + wikitext-103, 20M tokens/gen, 3 generations.
      Selection: top-3 by eff_rank retention ratio (final_gen / g0_final).
      Also reports PPL and w_t stability (std of w trajectory).
      r_target=0 (auto-infer from G0).
    hardware: "1x RTX PRO 6000 96GB"
    gpu_hours_estimate: 40
    data: "wikitext-103-raw-v1"
    tokens: "20M x 3 gen x 16 configs = 960M"
    outputs:
      - "Table: Kp/Ki grid results (eff_rank retention, PPL, w stability)"
      - "Top-3 configs for full-scale validation"

  - plan_id: "spectral_metric_comparison"
    name: "Spectral Metric Comparison"
    claim: "C1"
    reviewer_concern: "RC3"
    priority: "P0"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Using mvp_pilot checkpoints, compute alternative spectral metrics
      (condition number, trace norm, top-k eigenvalue ratio, nuclear norm)
      alongside effective rank. Compare leading indicator properties:
      which metric first signals collapse, with what reliability (hit rate,
      false positive rate). Justifies choice of effective rank.
    hardware: "1x GPU (forward passes for embeddings)"
    gpu_hours_estimate: 0.5
    outputs:
      - "Table 2: Metric comparison (lead time, hit rate, FPR)"

  # ══════════════════════════════════════════════════════════
  # Phase 2: Controller Experiments (C2)
  # ══════════════════════════════════════════════════════════

  - plan_id: "controller_ablation"
    name: "PI Controller Kp/Ki Ablation"
    claim: "C2"
    status: "planned"
    depends_on: ["mvp_pilot"]
    description: >
      Grid search over Kp x Ki:
        Kp in {0.005, 0.01, 0.02, 0.05}
        Ki in {0.002, 0.005, 0.01, 0.02}
      16 combinations. Each run: Pythia-1B, 3 generations, 500M tokens/gen,
      OpenWebText + controller-modulated synthetic data. Measure final PPL,
      rank trajectory smoothness, control stability (w oscillation amplitude).
      Identifies Pareto-optimal Kp/Ki region.
    hardware: "8x H100"
    gpu_hours_estimate: 50
    data: "OpenWebText"
    tokens: "500M x 3 gen x 16 configs = 24B total tokens"
    outputs:
      - "Figure 3: Kp/Ki heatmap (final PPL, rank stability)"
      - "Figure 4: w trajectories for representative configs"

  - plan_id: "controller_sensitivity"
    name: "Controller Sensitivity: r_target and w Bounds"
    claim: "C2"
    status: "planned"
    depends_on: ["controller_ablation"]
    description: >
      Fix Kp/Ki at ablation-optimal values. Vary:
        r_target in {-3%, -1%, 0%, +1%} relative to G0 final eff_rank (~677 for Pythia-1B)
        w_bounds in {[0.1,0.9], [0.2,0.8], [0.3,0.7]}
      12 runs total. Tests robustness to controller hyperparameters
      beyond the core Kp/Ki gains.
    hardware: "8x H100"
    gpu_hours_estimate: 25
    data: "OpenWebText"
    tokens: "500M x 3 gen x 12 configs = 18B total tokens"
    outputs:
      - "Table 3: Sensitivity to r_target and w bounds"

  # ══════════════════════════════════════════════════════════
  # Phase 3: Baselines & Full Comparison (C2, C3)
  # ══════════════════════════════════════════════════════════

  - plan_id: "controller_vs_baselines"
    name: "Controller vs Fixed-Ratio Baselines"
    claim: "C2, C3"
    status: "planned"
    depends_on: ["controller_ablation"]
    description: >
      Compare PI controller (optimal Kp/Ki from ablation) against baselines:
        B1: pure synthetic (w=0)
        B2: fixed w=0.3
        B3: fixed w=0.5
        B4: fixed w=0.7
        B5: oracle fixed w (best post-hoc ratio, unknown a priori)
      Each: 3 generations x 500M tokens/gen.
      Metrics: final PPL, per-generation PPL trajectory, KL divergence,
      vocabulary coverage, effective rank trajectory.
    hardware: "8x H100"
    gpu_hours_estimate: 50
    data: "OpenWebText"
    tokens: "500M x 3 gen x 6 configs = 9B total tokens"
    outputs:
      - "Table 4: Final metrics comparison (PPL, KL, vocab coverage)"
      - "Figure 5: Generation-wise PPL curves (all methods)"
      - "Figure 6: Controller w trajectory vs optimal fixed"

  - plan_id: "full_collapse_run"
    name: "Extended Multi-Generation Collapse Run (5 gen)"
    claim: "C3"
    status: "planned"
    depends_on: ["controller_vs_baselines"]
    description: >
      Extend to 5 generations (vs 3 in other experiments) to demonstrate
      controller sustains quality over longer horizons. Compare:
        PI controller vs pure synthetic vs best fixed ratio.
      Shows compounding benefit of closed-loop control.
    hardware: "8x H100"
    gpu_hours_estimate: 55
    data: "OpenWebText"
    tokens: "500M x 5 gen x 3 configs = 7.5B total tokens"
    outputs:
      - "Figure 7: 5-generation PPL trajectories"
      - "Table 5: Generation-wise collapse metrics"

  # ══════════════════════════════════════════════════════════
  # Phase 4: Stretch Goals
  # ══════════════════════════════════════════════════════════

  - plan_id: "cross_model_validation"
    name: "Cross-Model Validation (Pythia-2.8B)"
    claim: "C1, C3"
    reviewer_concern: "RC1"
    status: "stretch"
    depends_on: ["controller_vs_baselines"]
    description: >
      Replicate controller_vs_baselines on Pythia-2.8B with 3 configs:
      PI controller, pure synthetic, best fixed ratio. Tests whether
      leading indicator property and controller effectiveness transfer
      to larger scale. Only if GPU budget and timeline permit.
    hardware: "8x H100"
    gpu_hours_estimate: 35
    data: "OpenWebText"
    tokens: "500M x 3 gen x 3 configs = 4.5B total tokens"
    outputs:
      - "Table 6: Cross-model comparison (1B vs 2.8B)"

# ════════════════════════════════════════════════════════════
# Budget Summary
# ════════════════════════════════════════════════════════════

budget_summary:
  mvp_phase:
    experiments: ["mvp_pilot", "leading_indicator_analysis"]
    total_gpu_hours: 2
    hardware: "1x RTX PRO 6000 96GB (existing)"
  p0_validation:
    experiments: ["baseline_w0", "baseline_w1", "baseline_w01", "baseline_w03", "baseline_w05", "baseline_w07", "seed_validation", "pi_sweep_p0", "spectral_metric_comparison"]
    total_gpu_hours: 101  # 6 baselines (30h) + seed_validation (30h) + pi_sweep (40h) + spectral (0.5h) + leading_indicator (0h)
    hardware: "1x RTX PRO 6000 96GB (existing) — can parallelize on H100s if available"
  full_phase_required:
    experiments: ["controller_ablation", "controller_sensitivity", "controller_vs_baselines", "full_collapse_run"]
    total_gpu_hours: 180
    hardware: "8x H100 (pending approval)"
  full_phase_stretch:
    experiments: ["cross_model_validation"]
    total_gpu_hours: 35
    hardware: "8x H100"
  grand_total: "~318 GPU-hours (2 MVP + 101 P0 + 180 full + 35 stretch). P0 on existing hardware; full on H100s."

# ════════════════════════════════════════════════════════════
# Timeline
# ════════════════════════════════════════════════════════════

timeline:
  - phase: "Day 0-1 (2026-05-13~14): MVP"
    tasks:
      - "mvp_pilot_v7 completes → GO/NO-GO decision"
      - "leading_indicator_analysis + spectral_metric_comparison (post-hoc, hours)"
      - "If GO: complete_mvp(), request H100s from Manager"
  - phase: "Day 1-5 (2026-05-14~18): P0 Validation on RTX PRO 6000"
    tasks:
      - "6 fixed-ratio baselines: w=0/0.1/0.3/0.5/0.7/1.0 (serial, ~30h)"
      - "pi_sweep_p0: 4x4 Kp/Ki grid (~40h)"
      - "seed_validation: 3-seed PI vs best fixed (~30h)"
      - "Total ~101h serial = ~4.2 days. Overlap with H100 setup."
  - phase: "Day 5-10 (2026-05-18~23): Full-Scale on H100s"
    tasks:
      - "controller_ablation (16 configs, 8-way parallel, ~7h wall)"
      - "controller_sensitivity (12 configs, ~4h wall)"
      - "controller_vs_baselines (6 configs, ~7h wall)"
      - "full_collapse_run (5 gen, ~10h wall)"
      - "Paper writing starts in parallel with experiments"
  - phase: "Day 10-12 (2026-05-23~25): Paper + Submit"
    tasks:
      - "Finalize figures, tables, writing"
      - "ARR submission by 2026-05-25"
  - phase: "Post-DDL (camera-ready)"
    tasks:
      - "cross_model_validation (Pythia-2.8B, stretch)"
      - "Camera-ready revisions"

# ════════════════════════════════════════════════════════════
# Claim -> Experiment Coverage Matrix
# ════════════════════════════════════════════════════════════

claim_coverage:
  C1_leading_indicator:
    - mvp_pilot              # primary evidence
    - leading_indicator_analysis  # statistical rigor
    - spectral_metric_comparison  # metric justification (P0)
  C2_controller_mechanism:
    - pi_sweep_p0             # Kp/Ki grid on Pythia-1B (P0)
    - baseline_w01            # PI floor test (P0)
    - seed_validation         # statistical significance (P0)

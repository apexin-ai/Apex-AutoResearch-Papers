    - controller_sensitivity  # robustness
  C3_collapse_mitigation:
    - baseline_w0             # collapse lower bound (P0)
    - baseline_w1             # no-collapse upper bound (P0)
    - baseline_w01            # minimal real data (P0)
    - baseline_w03            # fixed w=0.3 (P0)
    - baseline_w05            # fixed w=0.5 = PI w_init, critical control (P0)
    - baseline_w07            # fixed w=0.7 (P0)
    - seed_validation         # PI vs best fixed significance (P0)
    - controller_vs_baselines  # head-to-head comparison
    - full_collapse_run        # long-horizon stability
  RC1_scale:
    - cross_model_validation   # stretch
  RC3_metric_choice:
    - spectral_metric_comparison

decisions:
- id: D001
  date: 2026-05-12 08:46 UTC
  summary: MVP 方案：Phase 0 pilot 验证谱有效秩作为塌缩 leading indicator
  rationale: 整个项目的核心赌注是谱指标比 PPL 更早检测到塌缩。如果这个假设不成立，闭环控制器没有意义。Phase 0 用最小成本（~5 H100-hours）验证这一点：Pythia-1B
    在纯合成数据上训练 2 代，每 50M tokens 记录谱有效秩和 PPL，检查谱指标是否领先。同时测量代际 KL 散度判断非平稳性是否足够大（>0.1
    nats）使自适应控制有空间超过最优固定权重。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-12 08:50 UTC
  summary: 量化 MVP GO/NO-GO 标准：PPL ≥2pts 或 ≥5% 为显著上升，谱领先 ≥1σ；补全 5 条 NO-GO 路径
  rationale: 'Reviewer 初审指出 MVP pass 标准中"PPL 显著上升"未量化（severity: warning）且缺 fail 路径。定义：PPL
    阈值 ≥2 points 绝对或 ≥5% 相对（Shumailov et al. 报告纯替换 9 代 20-28 PPL 退化，2 代保守估计 5-10 points，2
    points 远高于 checkpoint 间噪声）。谱领先性用 G0 阶段 checkpoint 间标准差的 1σ 作为检测门槛。NO-GO 决策树覆盖
    5 种场景，包括 conditional GO（secondary framing）和延展路径，确保 13 天 DDL 下 fail-fast。'
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-12 13:54 UTC
  summary: MVP 真实数据从 OpenWebText 切换到 wikitext-103，tokens_per_generation 降至 100M
  rationale: OpenWebText 在 AutoDL 上 4 次下载尝试全部失败（conda/network/zombie/stale locks），GPU
    空转近 4 小时。MVP 目的是验证谱有效秩是否 lead PPL——假设与数据集规模无关，只需足够量的英文文本。wikitext-103 约 100M tokens，下载秒级完成，可立即启动训练。tokens_per_generation
    从 500M 降至 100M 以匹配数据集大小。全量实验阶段再用 OpenWebText（通过 ModelScope mirror 或手动上传）。
  related_experiments:
  - exp_id: mvp_pilot
    role: failed
    result: conda 未激活
  - exp_id: mvp_pilot_v2
    role: failed
    result: network_turbo 未启用
  - exp_id: mvp_pilot_v3
    role: failed
    result: zombie 清理 Worker 中断下载
  depends_on:
  - D001
  - D002
- id: D004
  date: 2026-05-12 15:26 UTC
  summary: mvp_pilot_v4 发散确认，启动 v5 debug-first 方案
  rationale: v4 loss 持续 >100（理论上限 10.83），从 45→137 后在 107 附近震荡无收敛。初始假设是 transformers
    4.57.6 的 ForCausalLMLoss 做 sum 而非 mean，导致梯度被 seq_len 倍放大。[已被 D005 排除：checkpoint-760
    独立评估 ratio=1.00，真因是 LR=1e-5 过高] v5 降 LR 至 2e-6 + warmup 0.05 重跑。
  related_experiments:
  - exp_id: mvp_pilot_v4
    role: predecessor
    result: FAILED - training divergence
  depends_on: []
- id: D005
  date: 2026-05-12 15:43 UTC
  summary: 确认真发散（ratio=1.00），v5 降 LR 至 2e-6 + warmup 0.05 重跑
  rationale: checkpoint-760 独立 PPL 评估：manual CE=114.79, PPL=inf, transformers/manual
    ratio=1.00 排除报告 artifact。根因是 lr=1e-5 对 Pythia-1B fine-tuning 过高（典型安全范围 2e-6~5e-6）。v5
    降至 2e-6 并加 5% warmup。加 early stop 安全阀（前 100 步 loss>15 自动停止）。
  related_experiments:
  - exp_id: mvp_pilot_v4
    role: predecessor
    result: FAILED - confirmed divergence, manual PPL=inf, ratio=1.00
  - exp_id: mvp_pilot_v5
    role: successor
    result: PLANNED - lr=2e-6, warmup=0.05
  depends_on:
  - D004
- id: D006
  date: 2026-05-12 17:27 UTC
  summary: 文献调研确认 SIGMA 已占据"谱分析检测 collapse"，framing 方向确定为"passive monitoring → active
    closed-loop control"
  rationale: 'SIGMA (2026-01) 已用 Gram 矩阵谱界量化 collapse，但无控制机制、未验证 leading indicator。我们的独特贡献
    = 谱有效秩（leading indicator）→ PI 控制器 → 动态 real/synthetic 比例调节。无论 MVP 结果如何（GO: leading
    indicator 驱动控制；conditional GO: higher-resolution indicator + 控制），"闭环控制"都是核心差异化卖点。正式
    paper_framing.md 待 MVP 完成后写。'
  related_experiments:
  - exp_id: mvp_pilot_v5
    role: context
    result: running
  depends_on:
  - D003
- id: D007
  date: 2026-05-13 01:34 UTC
  summary: 合成数据生成瓶颈：v5 预计 58h 完成（远超 24h timeout），降规模至 20M tokens/gen 重跑
  rationale: v5 Worker 检查报告：G0 训练+评估已完成（eff_rank 670→662, ppl 13.1→12.6, 正常收敛），但 G0
    合成数据生成仅 21%（6h12m/28h）。90M tokens/gen 的合成数据生成在单 GPU 上需要 ~28h/代，3 代总计 58h，远超 24h
    timeout 和 MVP 合理耗时。G0 已有完整指标可作为 baseline。解决方案：kill v5（反正会 timeout），降至 20M tokens/gen
    重跑——20M 足够检验跨代 eff_rank 退化趋势（核心假设只需 trend 存在性），synth gen 缩短至 ~6h/代，总计 ~15h 可完成。磁盘压力也同步缓解（从
    180GB 降至 ~40GB）。可选优化：复用 v5 的 G0 final model 跳过 G0 训练。
  related_experiments:
  - exp_id: mvp_pilot_v5
    role: predecessor
    result: G0 complete but synth gen will timeout
  depends_on:
  - D005
- id: D008
  date: 2026-05-13 03:50 UTC
  summary: 调整 MVP GO/NO-GO 标准：σ→绝对阈值、加 50M 应急路径、KL 允许 Conditional GO
  rationale: Reviewer 审查发现 v7 参数（20M tokens/gen, 4 ckpt/gen）下原标准有统计问题：(1) 4 点 σ 估计
    df=3，CI 极宽，当前 σ≈1.37 对应 0.2% 变化，无法区分信号和噪声 → 改用绝对阈值 ≥3 pts 或相对 ≥0.5%。(2) 20M tokens
    可能不足以引发可测 collapse → 加应急路径：3 代无信号则加 1 代 50M（~5 GPU-h，DDL 前可控）。(3) KL 0.1 nats
    在 20M 下可能偏高 → 保留阈值但 eff_rank 有明确趋势时允许 Conditional GO。(4) σ 计算排除 pretrained baseline，仅含
    G0 训练 checkpoints。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: target
    result: running, G0 eval 3/6 done
  depends_on:
  - D007
  - D002
- id: D009
  date: 2026-05-13 05:05 UTC
  summary: Post-MVP P0 扩展：+w=0/w=1 baselines、spectral metric 对比提升到 P0，总计 85h；PI 控制器实现需显式排期
  rationale: Reviewer 审查发现 3 个遗漏：(1) w=0（纯合成）证明 collapse 发生、w=1（纯真实）是上界参考，缺少则审稿人可质疑"问题不存在"，仅
    10h 成本远低于价值。(2) spectral metric 对比在 paper_framing RC3 中已承诺，放 P1 有被砍风险，10h 可复用已有
    checkpoints。(3) PI 控制器代码尚不存在，是非平凡工程任务需显式规划。调整后 P0=85h（原 65h+20h），在 1×RTX PRO 6000
    上 ~3.5 天可完成。8×H100 下 ~10h。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: prerequisite
    result: running
  depends_on:
  - D008
- id: D010
  date: 2026-05-13 08:36 UTC
  summary: P0 补充：+3-seed 验证 + w=0.1 baseline + PI sweep 选择标准定义。P0 总计 ~95h
  rationale: Reviewer P0 预审发现：(1) 全部 seed=42 无方差估计，审稿人必攻击 → 加 3-seed 验证 PI vs best
    fixed ratio (~10h)。(2) PI w_min=0.1 如果恰好是好常数，需要 w=0.1 fixed baseline 排除 → 加 w=0.1
    (~2h)。(3) PI sweep top-3 选择标准未定义 → 按 final gen eff_rank 保持度排序。P0 从 85h 增至 ~97h。另：w=1
    baseline 的 PPL 上升可能是过拟合非 collapse，论文需说明。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: prerequisite
    result: running
  depends_on:
  - D009
- id: D011
  date: 2026-05-13 15:49 UTC
  summary: v7 G1 数据：eff_rank 上升 +1.34 而非下降，核心假设 C1 面临挑战。等 G2 数据后最终判定。
  rationale: 'G0→G1: eff_rank 676.96→678.30（+1.34），同时 collapse 确实发生（unigram entropy
    -86%, coverage -71%, KL=1.647）。eff_rank 度量的是模型在 holdout 真实数据上的表征维度利用率，非生成多样性——两者解耦。D008
    决策树匹配 KILL 路径（谱不下降），但 Reviewer 建议等 G2 确认。如果 G2 eff_rank 仍不下降则触发 KILL，考虑 pivot：(a)
    换控制信号为 n-gram entropy (b) 在生成文本而非 holdout 上算 eff_rank (c) 分析中间层 hidden states。'
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: primary
    result: G1 eff_rank +1.34 (wrong direction), collapse confirmed by n-gram metrics
  depends_on:
  - D008
- id: D012
  date: 2026-05-13 15:53 UTC
  summary: Pivot 策略：B（生成文本 eff_rank）为首选，C（分层）并行验证，A（n-gram entropy）保底
  rationale: Reviewer 评估三个 pivot 方向：B 新颖性最强（self-referential spectral analysis 文献未见）、验证成本最低（~3h
    GPU）、SIGMA 差异化最好（wrong surface vs right surface）。失败回退 A 仅损失 3h。B+C 可在 v7 完成后立即并行验证（复用
    G0/G1/G2 checkpoints）。B 成功则 C1 升级为"self-referential eff_rank is leading indicator"，negative
    result on holdout eff_rank 变为贡献。A 虽可行但论文降级为 B 类（仅剩控制框架贡献）。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: primary
    result: G1 eff_rank +1.34 on holdout, to be verified on generated text
  depends_on:
  - D011
- id: D013
  date: 2026-05-13 17:26 UTC
  summary: Pivot B 核心风险：generated eff_rank 必须证明比 n-gram entropy 额外有价值
  rationale: Reviewer 深入评估指出：n-gram entropy 在 G1 step 152 已检测到 collapse（6.93→3.92），如果
    generated eff_rank 也在同一时点才检测到且无额外优势，审稿人会质疑 "为什么要做昂贵的 SVD"。论文必须展示至少一点：(a) generated
    eff_rank 比 n-gram 更早检测，(b) 提供更平滑的连续信号适合 PI 控制（n-gram 是阶跃函数），(c) 在 n-gram 未剧变时已渐进下降提供更丰富梯度信息。Plan
    A (n-gram + PI) 不够 EMNLP main——只有 Findings/workshop 水平。"Holdout vs generation-side"
    分析适合作为 paper section 但不够独立论文。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: evidence_source
    result: G1 data confirms holdout failure
  depends_on:
  - D012
- id: D014
  date: 2026-05-13 18:48 UTC
  summary: C1 原假设 definitively falsified by G2 data；立即启动 Pivot B 验证
  rationale: G2 数据确认：holdout eff_rank 676.96→683.44（+0.96%，持续上升），PPL 13.27→13.59（+2.4%，几乎不动），而
    generation 完全崩塌（G2 只产出 1 个 unique token，unigram_entropy=0.00）。原 C1 claim "eff_rank
    is a leading indicator" 被 definitively falsified——eff_rank 在 holdout 上与 collapse
    完全解耦。立即启动 Pivot B 验证（analyze_generated_eff_rank.py），在 model 自生成文本上计算 eff_rank，检验是否能检测到
    collapse。这是论文能否投 EMNLP main 的 make-or-break 实验。
  related_experiments:
  - exp_id: mvp_pilot_v7
    role: evidence
    result: G2 eff_rank +0.96% while generation collapsed to 1 unique token
  depends_on:
  - D011
  - D012
  - D013
- id: D015
  date: 2026-05-13 20:16 UTC
  summary: Pivot B 失败预案：Q2 (negative result) 为首选保底，Q1 (multi-signal) 不够 main
  rationale: Reviewer 评估三条路径：(1) Multi-signal framework (Q1) — novelty 不足，"why not
    threshold" 无法回答，只够 Findings/workshop；(2) Negative result paper (Q2) — "holdout
    eff_rank 在 collapse 中反向上升" 本身有价值，EMNLP Findings 可行，需补 multi-scale + multi-seed；(3)
    Marginal case (Q3) — 仅靠信息论论证不够，需端到端 PI 性能差异。优先级：等 Pivot B → GO 则继续 / MARGINAL
    则跑 PI 对比 / KILL 则走 Q2 + multi-scale 验证（~3-4天 GPU，DDL 前可完成）。
  related_experiments: []
  depends_on:
  - D013
  - D014
- id: D016
  date: 2026-05-13 20:19 UTC
  summary: Pivot B 核心信号确认 GO；Direction C KILLED；需全 checkpoint 数据回答 D013
  rationale: 'Generated eff_rank: 63.89→3.87→1.06 (-98.3%) while holdout: 111.51→111.86
    (+0.3%)。信号极清晰，Pivot B 方向确认。但 compare 脚本 verdict "PIVOT_B_LOSES" 方法论无效（3 vs 18
    checkpoints 对比不公平）。Direction C (per-layer holdout eff_rank) 所有层变化 <1%，确认 KILLED。D013
    关键问题（generated eff_rank 是否比 n-gram 更早/更平滑）需要全 18 checkpoint 数据，已派发。'
  related_experiments:
  - exp_id: pivot_b_verification
    role: evidence
    result: generated eff_rank -98.3%, holdout +0.3%, Direction C dead
  depends_on:
  - D014
  - D015
- id: D017
  date: 2026-05-13 23:44 UTC
  summary: D013 存活条件 (a)(c) 未满足；启动 Option 1 细粒度 checkpoint 验证 (step 76-152 每 ~15 步)，同时准备
    Option 2 叙事转向
  rationale: pivot_b_full_18ckpt 完成：generated eff_rank 与 n-gram entropy 在同一 checkpoint
    (G1 step 152) 检测到 collapse，无时间优势。但 checkpoint 间隔 76 步太粗，可能掩盖了两者在 step 76-152 区间内的检测时间差。Option
    1 (细粒度 checkpoint) 成本 ~1-2h GPU，如果 eff_rank 在 ~step 100 已下降而 n-gram 在 ~step 140
    才反应，(a) 翻盘。Option 2 (叙事转向"正确测量面 + 因果控制信号") 作为备选——holdout 完全失灵 + eff_rank 度量 collapse
    的因(表征坍缩)而非果(输出多样性下降)。Option 3 (negative result) 暂不考虑。
  related_experiments:
  - exp_id: pivot_b_full_18ckpt
    role: evidence
    result: generated eff_rank 与 n-gram 同 checkpoint 检测，无时间优势；但 holdout 完全失灵确认
  depends_on:

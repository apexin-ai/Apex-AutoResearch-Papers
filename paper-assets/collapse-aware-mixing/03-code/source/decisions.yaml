- id: D018
  date: 2026-05-13 23:48 UTC
  summary: MVP 最终判定 FAIL：三条路径全封（C1 falsified, Pivot B no advantage, Direction C dead），D017
    Option 1 取消
  rationale: Reviewer 全 18 checkpoint 公平对比确认 Pivot B definitively 失败：(1) 检测时间：generated
    eff_rank 与 n-gram entropy 均在 G1 step 152 首次检测，完全一致，即使给 eff_rank 20 倍宽松阈值（0.5%
    vs 10%）仍无优势。(2) 平滑度：eff_rank 一阶差分方差 441.7 vs n-gram 0.77，噪声高 573 倍，作为 PI 控制信号远劣于
    n-gram。(3) D017 Option 1（细粒度 checkpoint）已无意义——573 倍噪声意味着更密的采样只会暴露更多噪声而非更早的信号。D016
    的 "GO" 判定被推翻（3 vs 18 checkpoint 不公平对比导致的误判）。三条路径总结：C1 holdout eff_rank 在 collapse
    中反向上升（D014），Pivot B generated eff_rank 无法超越 n-gram（本决策），Direction C per-layer
    变化 <1%（D016）。剩余选项：Q2 negative result paper（需 multi-seed + multi-scale，~3-4 天），或
    archive。
  related_experiments:
  - exp_id: pivot_b_full_18ckpt
    role: definitive_evidence
    result: generated eff_rank 与 n-gram 同时检测，噪声高 573 倍，D016 GO 判定被推翻

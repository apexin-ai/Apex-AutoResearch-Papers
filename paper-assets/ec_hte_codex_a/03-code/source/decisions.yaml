_next_id: 5
decisions:
- id: D001
  date: 2026-05-31 16:40 UTC
  summary: H1 CPU MVP supports global-correction-worse mechanism and exp002 grid should
    proceed
  rationale: exp_001_bias_bound_mvp formal CPU MVP completed with 200 replications.
    On primary metric GATE RMSE, oracle_global - uncorrected = 0.664685 with 95% bootstrap
    CI [0.657467, 0.671796], satisfying H1 success rule. Estimated_global - oracle_global
    = 0.018089 CI [0.005478, 0.031403], separating finite-sample confusion-estimation
    noise from structural bias. Secondary mean/max subgroup CATE bias diagnostics
    agree; result is not mixed. Therefore the broader exp_002 GPU DGP grid is warranted
    to test the mechanism across conditions.
  related_experiments:
  - exp_id: exp_001_bias_bound_mvp
    role: primary_evidence
    result: 'success: oracle_global worse than uncorrected on GATE RMSE by 0.664685,
      95% CI [0.657467, 0.671796]; not mixed'
  - exp_id: exp_002_gpu_dgp_grid
    role: follow_up
    result: approved and allocated to validate mechanism across DGP grid
  depends_on: []
- id: D002
  date: 2026-05-31 16:59 UTC
  summary: exp002 grid does not support H1 grid-level success criterion; pause Stage
    1 formal launch pending mechanism audit
  rationale: exp002 completed 192 formal GPU grid conditions with 200 replications
    each. The primary rate difference positive-minus-negative was -0.005 with bootstrap
    95% CI [-0.085, 0.080], failing the required >=20pp and CI-lower>0 rule. The bias-bound
    Spearman rho was -0.620 with CI [-0.665, -0.483], opposite the planned positive
    direction. This means exp001 single-DGP success cannot be generalized to the full
    grid until DGP/correction/diagnostic definitions are audited.
  related_experiments:
  - exp_id: exp_002_gpu_dgp_grid
    role: formal_grid_test
    result: negative
  - exp_id: exp_001_bias_bound_mvp
    role: parent_single_dgp
    result: success
  depends_on:
  - D001
- id: D003
  date: 2026-05-31 17:22 UTC
  summary: Accept exp002 mechanism audit and require Stage0 operator-alignment repair
    before Stage1 formal
  rationale: Reviewer audit found `worker_analysis_exp002_negative_mechanism_audit_v2_20260531T170911`
    had failed status but complete deliverables (`art_20260531_6a9e94`). The audit
    explains exp001-vs-exp002 conflict as likely caused by correction-operator mismatch,
    uniform subgroup priors, magnitude-only diagnostic, and grid aggregation. Therefore
    exp002 negative should be treated as grid-level operational hypothesis failure,
    not as a refutation of exp001 single-DGP worst-case evidence. Stage1 formal remains
    blocked until a repair spec/proposal aligns the Stage0 correction operator and
    diagnostic criteria.
  related_experiments:
  - exp_id: exp_002_gpu_dgp_grid
    role: negative_result
    result: DONE/negative; primary=-0.004999995 CI [-0.085260391,0.080000013]; Spearman=-0.620161
      CI [-0.664535,-0.483135]
  - exp_id: exp_001_bias_bound_mvp
    role: contrast
    result: DONE/success single-DGP worst-case; oracle_global_minus_uncorrected_gate_rmse=0.664685
      CI [0.657467,0.671796]
  - exp_id: exp_003_stage1_correction_ablation
    role: blocked_successor
    result: PREPARING; formal launch remains blocked pending Stage0 repair decision
  depends_on:
  - D002
- id: D004
  date: 2026-05-31 17:24 UTC
  summary: Accept exp002 literature solutions memo as advisory repair evidence only
  rationale: Reviewer confirmed `worker_research_exp002_negative_literature_solutions_v1_20260531T170917`
    had failed status but complete deliverables registered as `art_20260531_0e5bc8`.
    The memo supports the same repair direction as the mechanism audit, especially
    prevalence-aware posterior mixing, latent-class/soft modifier calibration, hierarchical
    confusion pooling, and SIMEX-style sensitivity checks. It is literature-backed
    design guidance, not empirical support for H1 or H2, and does not unblock exp002
    rerun or exp003 formal.
  related_experiments:
  - exp_id: exp_002_gpu_dgp_grid
    role: negative_result_context
    result: DONE/negative; literature memo art_20260531_0e5bc8 accepted as advisory
      repair input only
  - exp_id: exp_003_stage1_correction_ablation
    role: blocked_successor
    result: Formal launch remains blocked; memo does not provide H2 evidence
  depends_on:
  - D003

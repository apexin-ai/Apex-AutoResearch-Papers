mistakes:
- id: M001
  date: '2026-05-31'
  category: agent_behavior
  severity: low
  summary: Baseline protocol Worker marked failed due to non-critical git post-check
    despite completed deliverables
  root_cause: Worker ran git status/git diff post-check commands in a directory that
    is not a git repository after already writing memory/artifact/manifest outputs.
  prevention: For research/protocol Workers, validate required deliverables directly
    before running optional git checks; treat non-git post-check failures as non-critical
    when artifacts are present.
  status: active
  context: Worker `worker_research_baseline_protocol_ec_hte_20260531T153440` produced
    memory sections, `artifacts/research/baseline_protocol_20260531.md`, and manifest
    entry `art_20260531_baseline_protocol`, then failed on git post-check.
  fix: Director recorded the event in memory.md and instructed Agent not to rerun
    the same research Worker unless stricter source audit is requested.
- id: M002
  date: '2026-05-31'
  category: code_bug
  severity: low
  summary: Real-data feasibility Worker marked failed after transient manifest YAML
    parse error despite completed deliverables
  root_cause: Artifact manifest description containing special characters was written
    without safe YAML quoting, causing YAML parser failure during validation. Worker
    subsequently fixed the manifest and validated both manifest and experiment matrix.
  prevention: When writing manifest YAML entries, use a YAML serializer or quote/escape
    free-form descriptions; validate manifest immediately after write and distinguish
    transient validation failures from missing deliverables.
  status: active
  context: '`worker_research_realdata_feasibility_v3b_20260531T161732` produced memory,
    artifact, manifest, and matrix provenance for `C_REALDATA_FEASIBILITY`, but status
    was failed due to an intermediate manifest YAML parse failure that was fixed before
    final output.'
  fix: Director marked plan_004 done in experiment_plan.yaml, filled the real-data
    matrix cells, recorded the event in memory.md, and instructed not to rerun the
    Worker.
- id: M003
  date: '2026-05-31'
  category: agent_behavior
  severity: low
  summary: Pending-only exp002 Worker marked failed despite completed proposal and
    dry-run deliverables
  root_cause: Worker completed the proposal/spec/dry-run/checklist but the framework
    still surfaced status=failed, likely due to post-check or callback-level failure
    rather than missing core deliverables.
  prevention: When handling Worker DONE with status=failed, inspect deliverables and
    logs before deciding to rerun; classify pending-only proposal Workers as failed-but-deliverables-present
    when registry spec, artifact, dry-run, and no-running-GPU evidence are present.
  status: active
  context: '`worker_gpu_plan_002_h1_gpu_dgp_grid_pending_v3_20260531T161041` produced
    complete exp002 spec, dry-run evidence, matrix mapping, pending-only guard, and
    proposal artifact `art_20260531_1b54e6`; Reviewer found no submit_training_job/tmux/nohup/RUNNING
    transition.'
  fix: Director recorded the event in memory.md, accepted the proposal, approved exp002,
    and allocated `seetacloud-38274/root/cuda:0` for formal execution.
- id: M004
  date: '2026-05-31'
  category: other
  severity: high
  summary: exp002 allocation registry/resource truth split under Codex backend
  root_cause: Codex backend GPU lifecycle hooks were not connected to Manager resource
    tracking for seetacloud-38274. director_allocate_gpus advanced exp002 to ALLOCATED
    in registry, but get_project_resource_usage and Manager resource APIs had no allocated/running
    GPU record and submit_on_allocated did not produce RUNNING evidence.
  prevention: 'Before treating ALLOCATED as executable on Codex-backed projects, require
    resource truth confirmation: get_project_resource_usage must show the allocated
    GPU or submit_training_job must return a monitored run id. If registry ALLOCATED
    and resource truth disagree, revert the misleading state and escalate infrastructure
    registration instead of repeatedly reallocating.'
  status: active
  context: Reviewer critical found exp_002_gpu_dgp_grid ALLOCATED while allocated_gpus=[],
    running_experiments=[], get_gpu_health stale, no pid/log/run id. Manager confirmed
    seetacloud-38274 was absent from Manager server registry and Codex GPU lifecycle
    hooks were not adapted.
  fix: Reverted exp002 registry status from ALLOCATED to QUEUED, removed root allocation
    fields, preserved formal spec, and requested Manager server registry registration
    for seetacloud-38274.
- id: M005
  date: '2026-05-31'
  category: code_bug
  severity: medium
  summary: report auto-facts omitted negative DONE exp002 and preserved stale queue
    handover
  root_cause: auto_build_report_facts/report refresh path counted success DONE experiments
    but omitted `exp_002_gpu_dgp_grid` after it reached DONE(negative), while the
    preserved report tail still contained the old pending/queued description.
  prevention: After any negative experiment completion, cross-check `get_project_status`,
    `read_experiment_plan_with_status`, registry.yaml, and report.md before treating
    report auto-facts as truth. If auto facts and registry disagree, correct the report
    tail and investigate generator behavior before issuing status summaries.
  status: active
  context: On 2026-05-31, registry.yaml and experiment_plan both showed `exp_002_gpu_dgp_grid`
    as DONE(negative) with formal metrics/log/checkpoint/artifact paths, but auto_build_report_facts
    produced total=3 DONE=2 success=2 and report.md still listed exp002 as waiting
    for GPU.
  fix: Manually corrected report.md status/handover to include exp002 negative DONE
    and noted the generator mismatch; did not change registry or matrix facts.
- id: M006
  date: '2026-05-31'
  category: agent_behavior
  severity: high
  summary: Mechanism audit Worker was incorrectly at risk of being treated as deliverables-present
    despite no artifact
  root_cause: The failed worker `worker_research_exp002_mechanism_audit_proposal_20260531T170529`
    produced no `_result.json`, no mechanism-audit proposal artifact, and its log
    only showed stdin waiting; prior failed-but-deliverables-present handling patterns
    from other workers were overgeneralized to this case without verifying core deliverables.
  prevention: For every failed Worker, classify deliverables-present only after checking
    the specific expected artifact path, manifest entry, `_result.json`, and worker
    log. For negative-result redline followups, absence of the audit/proposal artifact
    must remain true failed/no deliverable until a replacement Worker or manual proposal
    lands.
  status: active
  context: Reviewer critical on 2026-05-31 found no `artifacts/research/exp002_mechanism_audit_proposal_20260531.md`,
    no manifest mechanism/audit/proposal entry, and no `_result.json` for the original
    mechanism audit Worker. `exp_003_stage1_correction_ablation` correctly remains
    PREPARING/blocked on exp002 negative mechanism audit.
  fix: 'Accepted Reviewer classification: old Worker is true failed/no deliverable.
    Current project resource usage shows replacement CPU Worker `worker_analysis_exp002_negative_mechanism_audit_v2_20260531T170911`
    running for the mechanism audit proposal; Stage1 formal remains blocked.'

# ============================================================
# WRITING ORDER (data dependency aware)
# ============================================================

writing_order:
  # --- Phase A: Can start NOW (no new experiments needed) ---
  - section: related_work
    priority: A_now
    reason: "不依赖新数据，仅需文献搜索。扩展后为 intro 的 gap 叙事提供基础。"
    data_dependency: none

  - section: method
    priority: A_now
    reason: "§2.3 second-order + §2.4 phase diagram 定义不依赖实验结果，先固化数学框架。"
    data_dependency: none

  - section: introduction
    priority: A_now
    reason: "Gap/contribution 结构可先写，具体数字用 placeholder。"
    data_dependency: "partial — C4/C5 数字待填"

  # --- Phase B: Need Phase 0 multi-seed data ---
  - section: "experiments §4.2 (expand)"
    priority: B_multiseed
    reason: "Table 1 扩行 + error bars 需要 multi-seed 数据。"
    data_dependency: "multi-seed exp (3 seeds × pure)"

  - section: "experiments §4.7 (new)"
    priority: B_multiseed
    reason: "Robustness analysis 核心依赖 multi-seed variance 数据。"
    data_dependency: "multi-seed exp (3 seeds × 3 conditions)"

  # --- Phase C: Need r_crit sweep data ---
  - section: "experiments §4.4 (new)"
    priority: C_rcrit
    reason: "Phase diagram 需要 7 mixing ratios 完整数据。"
    data_dependency: "r_crit sweep (7 ratios × 10 gen)"

  - section: "experiments §4.5 (expand)"
    priority: C_rcrit
    reason: "Signal attenuation 的 quantitative support 来自 r_crit 曲线。"
    data_dependency: "r_crit sweep + HellaSwag under mixing"

  # --- Phase D: Need cross-scale + alternative EWS data ---
  - section: "experiments §4.3 (rewrite)"
    priority: D_crossscale
    reason: "需要 160M + 1B 全 10-gen 数据。"
    data_dependency: "cross-scale exp (160M + 1B full 10 gen)"

  - section: "experiments §4.6 (new)"
    priority: D_alternative
    reason: "需要 5 个 alternative EWS candidates 的计算结果。"
    data_dependency: "alternative EWS comparison exp"

  # --- Phase E: After all experiments ---
  - section: discussion
    priority: E_last
    reason: "需要所有实验结果才能写 second-order EWS 分析和 practical implications。"
    data_dependency: "all experiments"

  - section: conclusion
    priority: E_last
    reason: "需要所有结果。"
    data_dependency: "all experiments"

  - section: abstract
    priority: E_last
    reason: "最后写，需要所有 section 的内容。"
    data_dependency: "all sections"

  # --- Figure generation order ---
  figure_order:
    - fig_id: fig1_spectral_trajectory
      priority: B_multiseed
      reason: "4-panel 升级需要 multi-seed error bars + mixed trajectory"
    - fig_id: fig3_cross_scale
      priority: D_crossscale
      reason: "需要 3 scale 全 10-gen 数据"
    - fig_id: fig2_phase_diagram
      priority: C_rcrit
      reason: "需要 7 ratio sweep 数据"
    - fig_id: fig5_multiseed
      priority: B_multiseed
      reason: "需要 3 seeds 数据"
    - fig_id: fig4_ews_comparison
      priority: D_alternative
      reason: "需要 alternative EWS 计算结果"


meta:
  venue: EMNLP 2026 ARR
  track: Machine Learning for NLP (Long Paper)
  special_theme: "New Missions for NLP Research — synthetic data feedback loops, data contamination"
  template: templates/latex/acl2026/
  template_note: "Official acl-org/acl-style-files (GitHub), used for all *ACL venues including EMNLP 2026"
  page_limit: 8  # + unlimited Limitations + References + optional Appendix
  deadline: 2026-05-25
  commitment_deadline: 2026-08-02
  core_claim: >
    Spectral log-volume (SLV) of embedding Gram matrices provides a reliable, monotonic early
    warning signal for model collapse in recursive synthetic training, following a reproducible
    three-phase pattern (decompression → onset → accelerating contraction) with quantifiable
    acceleration (2.43x), validated across three model scales (160M/410M/1B) and seven mixing
    ratios. A signal attenuation paradox structurally limits all per-generation reactive controllers.
  title_working: "Spectral Early Warning Signals for Model Collapse in Recursive Synthetic Training"
  created_at: 2026-05-17T20:00:00Z
  updated_at: 2026-05-18T12:00:00Z
  upgrade_from: "4p short paper → 8p long paper"

# ============================================================
# 8-PAGE CHAPTER OUTLINE
# ============================================================
# Current body: ~2130w (4p). Target: ~5800-6200w (8p ACL 2-column).
# Net expansion needed: ~3700-4100w.
# Figure/table budget: ~5 figures + ~3 tables (占 ~2.5p).

paper_outline:
  - section: abstract
    word_budget: 250
    current_words: 205
    delta: "+45w (expand)"
    action: rewrite
    core_bullets:
      - "Problem: recursive synthetic training → model collapse; detection relies on costly downstream metrics"
      - "Method: embedding Gram matrix spectral analysis across 10 gen × 3 scales (160M/410M/1B) × 7 mixing ratios"
      - "Finding 1: three-phase spectral pattern (decompression, onset, 2.43× acceleration); SLV as monotonic EWS"
      - "Finding 2: r_crit phase diagram precisely locates collapse boundary (r_crit ≈ 0.1-0.15)"
      - "Finding 3: signal attenuation paradox — moderate mixing eliminates spectral signal; second-order indicators as escape path"
      - "Scale: multi-seed validation (SLV CoV <0.25%), cross-scale consistency"
    dependencies: [experiments, method, discussion, conclusion]

  - section: introduction
    word_budget: 700
    current_words: 475
    delta: "+225w (expand)"
    action: expand_in_place
    changes:
      - "Para 1-2: 保留，轻微扩展 web-scraping implicit loop 的 urgency"
      - "Para 3 (gaps): 扩展为 4 gaps (加 'no phase diagram' 和 'no multi-scale validation beyond OPT-125M')"
      - "Para 4 (our work): 加入 3-scale + 7-ratio + multi-seed scope"
      - "Contributions: C1-C3 保留, 加 C4 (r_crit phase diagram) 和 C5 (second-order EWS direction)"
    core_bullets:
      - "C1: Three-phase spectral characterization at 3 scales (160M/410M/1B), 10 gen, multi-seed"
      - "C2: SLV as computationally cheap collapse monitor (monotonic, robust CoV<0.25%)"
      - "C3: Signal attenuation paradox formalized via r_crit"
      - "C4: First spectral collapse phase diagram (7 mixing ratios, precise r_crit localization)"
      - "C5: Second-order growth-rate decline as candidate escape from the paradox"

  - section: related_work
    word_budget: 550
    current_words: 215
    delta: "+335w (major expansion)"
    action: rewrite
    core_bullets:
      - "Model Collapse (expanded): Shumailov+2024, Dohmatob+2024 tails, Dohmatob+2025 strong, Alemohammad+2024 MAD, Gerstgrasser+2024 accumulation → positioning: output-level characterization, we add geometric lens"
      - "Spectral Analysis of Representations (expanded): Martin+2021 implicit regularization, Roy+2007 eff_rank, RankMe+2023, He+2025 spectral→plasticity, SIGMA Gu+2026 → positioning: SIGMA closest, we extend to 10-gen + 3 scales + phase diagram"
      - "Early Warning Signals (expanded): Scheffer+2009, Dakos+2012 methods, Bury+2021 deep learning EWS → ecology parallel: stabilization-suppresses-EWS; our contribution: signal direction reversal (not just SNR reduction)"
      - "Data Mixing (expanded): DoReMi Xie+2023, Data Mixing Laws Ye+2025, Aioli Chen+2025 → positioning: all fix ratios pre-training; we adjust online via spectral feedback"
      - "NEW cluster — Critical Transitions in ML: loss of plasticity, phase transitions in training, grokking connection"
    new_citations_needed: 8-12

  - section: method
    word_budget: 700
    current_words: 472
    delta: "+228w (expand)"
    action: expand_in_place
    changes:
      - "§2.1 Spectral Metrics: 保留，加 formal connection to EWS framework (critical slowing down → spectral contraction)"
      - "§2.2 Controller: 保留 equation + r_crit, 加 formal analysis of controller dynamics"
      - "§2.3 NEW: Second-order Indicators — define growth rate g_t = Δ_t - Δ_{t-1}, discuss why second-order survives when first-order is suppressed"
      - "§2.4 NEW: Phase Diagram Construction — formal definition of r_crit as function of T, experimental protocol for phase boundary estimation"

  - section: experiments
    word_budget: 2800
    current_words: 805
    delta: "+1995w (major expansion)"
    action: restructure_and_expand
    subsections:
      - subsection: "§4.1 Experimental Setup"
        word_budget: 350
        action: expand
        changes:
          - "加入 3 model scales (160M/410M/1B) 的具体参数"
          - "加入 multi-seed protocol (seeds 42/43/44, 3 conditions)"
          - "加入 7 mixing ratios 的完整条件列表"
          - "加入 compute budget summary"

      - subsection: "§4.2 Spectral Collapse Characterization (Phase 0)"
        word_budget: 550
        action: expand
        changes:
          - "Table 1 扩展为 11 行 (Gen 0-10 全量)"
          - "三阶段描述保留，加入 acceleration ratio 的 formal computation"
          - "加入 multi-seed error bars: mean ± std for key metrics"
          - "Figure 1 升级为 4-panel (SLV+r_eff / ppl / HellaSwag / σ₁)"

      - subsection: "§4.3 Cross-Scale Validation"
        word_budget: 400
        action: rewrite_from_scratch
        changes:
          - "从 1 句话扩展为完整 subsection"
          - "160M + 410M + 1B 全 10-gen SLV 轨迹对比"
          - "三阶段 pattern 在 3 个 scale 的一致性分析"
          - "SLV peak generation 和 acceleration ratio 的 scaling trend"
          - "Figure 3: 三 scale overlay 图"

      - subsection: "§4.4 Spectral Collapse Phase Diagram"
        word_budget: 450
        action: new_section
        changes:
          - "7 mixing ratios (0, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7) × 10 gen"
          - "SLV trajectory per ratio → identify r_crit (first ratio where SLV non-decreasing from Gen 2)"
          - "Heatmap: x=mixing ratio, y=generation, color=SLV delta"
          - "Precise r_crit localization (目标: ±0.05 bracket)"
          - "Table 2: r_crit summary per scale (if cross-scale data available)"
          - "Figure 2: phase diagram heatmap"

      - subsection: "§4.5 Signal Attenuation Analysis"
        word_budget: 450
        action: expand
        changes:
          - "保留 current §4.4 core content (controller silence, τ-independence, k-independence)"
          - "加入 r_crit 曲线数据作为 quantitative support"
          - "加入 second-order analysis: growth rate g_t decline even under mixing"
          - "加入 HellaSwag under mixing 数据: spectral-downstream asymmetry in mixed regime"
          - "Discuss: paradox is structural, not parametric"

      - subsection: "§4.6 Alternative EWS Comparison"
        word_budget: 350
        action: new_section
        changes:
          - "SLV vs gradient norm / embedding isotropy / token frequency entropy / weight spectral norm / effective rank"
          - "比较维度: monotonicity, detection lag (gen), compute cost, robustness (multi-seed variance)"
          - "Table 3: comparison matrix"
          - "Conclusion: SLV dominates on monotonicity + cost; some candidates better on lag"

      - subsection: "§4.7 Robustness Analysis"
        word_budget: 250
        action: new_section
        changes:
          - "Multi-seed variance: SLV CoV < 0.25% vs distinct-4 CoV 86%"
          - "Cross-implementation: exp_004 vs exp_006 identical r=0.5 但独立 code path"
          - "Argument: SLV is implementation-robust, text metrics are not"

  - section: discussion
    word_budget: 450
    current_words: 0
    delta: "+450w (new section)"
    action: new_section
    core_bullets:
      - "Second-order EWS as escape from paradox: growth rate decline detectable even when SLV rises (preliminary evidence)"
      - "Connection to ecology: stabilization-suppresses-EWS parallel, but signal reversal is unique to ML"
      - "Practical implications: monitoring recommendations (SLV for detection, second-order for mixed regimes)"
      - "Phase diagram as engineering tool: r_crit lookup for deployment"
      - "Limitations of phase diagram: single architecture family, single data domain"

  - section: conclusion
    word_budget: 250
    current_words: 165
    delta: "+85w (expand)"
    action: expand_in_place
    changes:
      - "加入 phase diagram 和 second-order EWS 结论"
      - "Limitations 保留 in-section (ACL allows)"
      - "Future work: 更具体 (cumulative controllers, architecture diversity, production-scale validation)"


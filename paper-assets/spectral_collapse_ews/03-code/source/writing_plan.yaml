visualization_plan:
  - fig_id: fig1_spectral_trajectory
    type: statistical
    tool: matplotlib
    status: EXISTS_needs_upgrade
    description: >
      UPGRADE from single-panel to 4-panel (2×2):
      (a) SLV + r_eff dual y-axis, three phases annotated
      (b) Perplexity (log scale)
      (c) HellaSwag accuracy with Gen 0→1 asymmetry highlighted
      (d) σ₁ decompression → re-concentration
      Pure-synthetic (solid) vs 50% mix (dashed) overlaid on all panels.
    data_source: "registry: exp_001 (pure), exp_006 (mixed)"
    placement: "§4.2"
    width: "\\textwidth"
    priority: P0

  - fig_id: fig2_phase_diagram
    type: statistical
    tool: matplotlib
    status: NEW
    description: >
      Heatmap: x-axis = mixing ratio (0, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7),
      y-axis = generation (0-10), color = per-generation SLV delta.
      Annotate r_crit boundary (transition from red to blue).
      Side panel: SLV at Gen 10 vs mixing ratio (line plot).
    data_source: "registry: r_crit sweep experiments"
    placement: "§4.4"

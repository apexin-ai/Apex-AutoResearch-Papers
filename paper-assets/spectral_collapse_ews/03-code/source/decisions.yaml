- id: D023
  date: 2026-05-18 11:34 UTC
  summary: C3 升级：signal attenuation paradox 从 SLV-specific 升级为 general principle (4/6
    替代 EWS 在 r=0.5 下反转)
  rationale: Alternative EWS 分析（plan_018 扩展）在 exp_001 (r=0) 和 exp_006 (r=0.5) checkpoints
    上计算了 6 个候选指标。Reviewer 独立验证：token entropy、stable rank(attn)、sigma1(attn)、sigma1(ffn)
    在 r=0.5 下方向完全反转。这意味着 signal attenuation 不是 SLV 设计缺陷，而是 real-data mixing 对所有 representation-level
    EWS 的结构性限制。C3 从 "SLV has a limitation" 升级为 "fundamental tension between collapse
    prevention and collapse detection"。论文新增双列比较表（r=0 vs r=0.5 × 6 indicators）直接回答
    reviewer "why not use other metrics?"
  related_experiments:
  - exp_id: exp_001

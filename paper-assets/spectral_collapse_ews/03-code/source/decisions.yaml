- id: D004
  date: 2026-05-16 11:28 UTC
  summary: Phase 0 go/no-go 基线从 Gen 0 (pretrained) 调整为 Gen 1 (首次 fine-tuned)，decline
    rate 计算范围改为 Gen 1-10
  rationale: Gen 0→1 的 effective rank 上升（417.5→491.8）源于 pretrained 模型 SVD 谱高度集中（top
    SV 1942.8），fine-tuning 打散谱结构导致有效秩反升。这是 pretraining→fine-tuning 的分布偏移效应，不是递归退化。SIGMA
    原文 50 代实验也从 fine-tuned 模型开始观察趋势。递归 collapse 应从 Gen 1 开始度量。调整后 go/no-go：Gen 1-10
    有效秩单调下降（允许 ≤1 代波动）+ decline_rate(Gen 6-10)/decline_rate(Gen 1-5) ≥ 1.5x。此调整在 Gen
    2+ 数据产出前记录，非事后修改标准。
  related_experiments:
  - exp_id: exp_001
    role: Phase 0 collapse characterization
    result: 'Gen 0-1 intermediate: eff_rank 417.5→491.8 (up), ppl 9.55→11.38 (up),
      distinct-4 0.74→0.63 (down)'
  depends_on:
  - D001
  - D002

- id: D012
  date: 2026-05-17 13:09 UTC
  summary: 'D012: Controller 增益 k 从 1.0 提高到 20，tau 从 0.005 降到 0.002，使 adaptive ratio
    产生有意义的变化'
  rationale: Reviewer dry-run 显示 k=1.0/tau=0.005 下 adaptive ratio 仅 0.500-0.506，与
    fixed_mix=0.50 差距不到 0.006，统计上不可能显著。根本原因：归一化 delta 是 O(0.01)，k=1.0 的增益不足以将其放大为有意义的
    ratio 变化。k=20 校准基于 Phase 0 Gen 5 数据（delta≈0.008），使中度 collapse 时 ratio≈0.62，重度
    collapse 时接近 r_max=0.80。tau=0.002 匹配 Phase 1 更弱的信号（~1/3 Phase 0 强度）。后续通过 sensitivity
    grid 探索 k={5,10,20,50} × tau={0.001,0.002,0.005}。
  related_experiments:
  - exp_id: exp_003
    role: affected
    result: will restart with k=20, tau=0.002
  depends_on:
  - D011
  - D010

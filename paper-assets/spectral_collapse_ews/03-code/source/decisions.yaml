  date: 2026-05-17 16:38 UTC
  summary: 'D014: Controller 备选方案 — 准备 cumulative-delta 模式代码，exp_005 Gen 3 数据决定是否切换'
  rationale: Proportional controller 用 per-gen delta（受信号衰减悖论限制），cumulative-delta 用
    S_0 - S_t（信号单调增长，不受悖论影响）。Phase 0 校准：Gen 5 cumulative delta=0.042，k=5 时 ratio≈0.66；Gen
    9 cumulative delta=0.111，ratio→r_max。决策点：exp_005 Gen 3 数据出来后，如果 per-gen ratio
    < 0.53 → 切换到 cumulative 模式重启；如果 ratio > 0.55 → 继续 proportional。代码先准备好，不阻塞当前实验。

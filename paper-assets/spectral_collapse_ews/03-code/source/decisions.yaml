decisions:
- id: D001
  date: 2026-05-16 07:36 UTC
  summary: MVP 方案确定：Phase 0 (collapse 特征化) + Phase 1 (预算固定对比)，Pythia 410M × 10 代 ×
    1 seed，用 RankMe 有效秩作为主信号
  rationale: 1) RankMe 优先于 SIGMA Track I：无公开代码、架构迁移风险、RankMe 已有成熟实现且 architecture-agnostic。2)
    10 代而非 5 代：IDEA_BRIEF 评审指出 5 代与动机中引用的 gen-20+ 非线性效应脱节。3) 1 seed 足够 MVP：只需验证信号存在性和控制器可行性，统计显著性留给
    research 阶段。4) EMNLP ARR May 25 已不可行（距今 9 天，从零开始），目标调整为 June 15 ARR cycle。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-16 07:40 UTC
  summary: 采纳 Reviewer 审查建议：Phase 1 扩到 3 seeds (paired)、Phase 0 go/no-go 量化为加速比 ≥
    1.5x、补充 fail/borderline 决策树
  rationale: Reviewer 指出 1 seed 的 3 ppl 差异可能是噪声（IDEA_BRIEF 自身定义 3 seeds 为最低要求）。2×
    RTX PRO 6000 (98GB) 跑 Pythia 410M 极轻，3 seeds 增加 ~15 GPU·h 完全可承受。Phase 0 "可见加速"
    改为 decline_rate ratio ≥ 1.5x 避免确认偏差。Phase 0 fail 直接 kill（前提不成立则控制器无意义），Phase 1
    borderline 加 seed 到 5 再判。
  related_experiments: []
  depends_on:
  - D001

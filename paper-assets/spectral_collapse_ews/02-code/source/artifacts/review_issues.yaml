    severity: critical
    summary: "Gram matrix formula mathematically invalid when n < d (det G = 0, SLV = -inf)"
    status: resolved
    first_raised_round: 1
    last_seen_round: 1
    mentions:
      - round: 1
        reviewer: [R1, R2]
        note: "Both reviewers independently confirmed: n=1000 < d=1024 for Pythia-410M makes det(G)=0."
    action_items:

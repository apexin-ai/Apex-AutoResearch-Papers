# Additional analysis specific to our project (spectral_collapse_ews)
relevance_to_project:
  key_connections:
    - "Stable rank as EWS indicator: their sr(Sigma) = ||M||_F^2 / ||M||^2 is exactly the kind of spectral collapse metric we track"
    - "The O(T^{-3}) collapse rate provides a theoretical baseline for what spectral collapse looks like in attention"
    - "Their decomposition A = (1/T)*1 + A^perp suggests monitoring the spectral gap itself (lambda_1 - lambda_2) as an EWS"
    - "Gradient norm explosion at T^{L-1} connects spectral collapse to training instability - potential EWS signal"
    - "Multiple outlier emergence in deeper layers (Figure 6) is a spectral phenomenon we could monitor as warning signal"
  methodological_insights:
    - "Random matrix theory provides the theoretical framework for understanding spectral collapse dynamics"
    - "i.i.d. Markov matrix abstraction enables tractable analysis while capturing softmax attention behavior"
    - "Stable rank (not discrete rank) is the right metric for continuous collapse monitoring"
    - "The spectral gap between lambda_1 and lambda_2 is the fundamental quantity driving collapse"
    - "Context length T is a critical but overlooked variable in collapse dynamics"
  differences_from_our_work:
    - "They study collapse at initialization; we study collapse during training"
    - "They focus on theoretical characterization; we focus on early warning detection"
    - "They propose a fix (gap removal); we propose monitoring/prediction"
    - "They analyze single-pass forward; we track temporal dynamics across training steps"

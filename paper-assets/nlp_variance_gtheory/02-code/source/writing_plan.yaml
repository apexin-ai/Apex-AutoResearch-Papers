literature_strategy:
  citation_budget: 35
  macro_context:
    - "LLM evaluation reproducibility, variance decomposition, G-theory"
    - "Prompt sensitivity, benchmark robustness, efficient evaluation"
  micro_clusters:
    - cluster_name: "G-theory & Variance Decomposition"
      search_queries:
        - "generalizability theory LLM evaluation variance"
        - "variance decomposition machine learning benchmarks ANOVA"
        - "measurement error NLP evaluation reproducibility"
      must_cite:
        - "Mesting 2026 — hidden measurement error, G-theory 5 facets"
        - "Bouthillier et al. 2021 JMLR — ML benchmark variance via ANOVA"
        - "Shavelson & Webb 1991 — G-theory primer (canonical)"
        - "Brennan 2001 — G-theory textbook (Ch.12 binary data)"
        - "Kunievsky & Evans 2025 — intent/articulation decomposition"
      target_count: 8

    - cluster_name: "Infrastructure Variance"
      search_queries:
        - "numerical precision LLM inference nondeterminism GPU"
        - "floating point reproducibility neural network inference"
      must_cite:
        - "Yuan et al. 2025 — LayerCast, up to 9% accuracy variation"
        - "Messina & Scotta 2026 — background temperature formalization"
        - "ThinkingMachines 2025 — batch-invariant kernels"
      target_count: 5

    - cluster_name: "Prompt Sensitivity & Methodology"
      search_queries:
        - "prompt sensitivity LLM evaluation benchmark robustness"

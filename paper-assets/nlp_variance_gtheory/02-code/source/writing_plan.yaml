        - "seed sensitivity LLM evaluation"
      must_cite:
        - "Brittlebench 2026 — 50% variance from prompt perturbation"
        - "Sclar et al. 2024 ICLR — up to 76% accuracy swing from formatting"
        - "Hua et al. 2025 EMNLP — scoring artifact in prompt sensitivity"

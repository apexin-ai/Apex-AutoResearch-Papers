- id: M015
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: exp-001/001b 的 G_item 使用了错误公式 (ICC = item_id%/100 而非 Henderson I G coefficient)，数值偏低
    0.2-0.3
  root_cause: gstudy_full.py 和 exp001b_gstudy.py 中 G_item 计算使用 SS 比例 (item_id% / 100)
    而非正确的 G = σ²(item) / [σ²(item) + σ²(δ)]。δ 项应包含所有含 item 交互项的方差除以对应 facet levels。方差百分比分解不受影响，只有
    G coefficient 绝对值错误。
  prevention: 1. G coefficient 计算必须经过 Reviewer 独立验证后才能写入 registry/论文。2. 新写分析脚本时明确引用
    Brennan (2001) Ch.4 公式，不用简化近似。3. exp-002 分析 pipeline 的 G_item 计算必须在使用前验证公式正确性。
  status: active
  context: '修正前: exp-001 G_item=0.611, exp-001b mean=0.745。修正后: exp-001 G_item=0.918,
    exp-001b mean=0.960。修正值更高，强化 item dominance claim。但论文/registry 中所有 G_item 引用需全部替换。方差百分比
    (item_id%=61.1% 等) 不受影响。cross-model G_item=0.707 (compute_g_coefficients.py) 使用正确公式，不受影响。'
  fix: Agent 审计完成，已标注 registry BUGGY/CORRECTED。需重生成 3 个 JSON 文件并验证 exp-002 pipeline
    公式。
- id: M016
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: 排列检验使用二元 is_monotonic 统计量，对任意 k 个不等值恒给 p=1/k!，不是有效的趋势检验
  root_cause: gradient_permutation_test.py 的检验统计量是"序列是否严格单调"（binary），k 个不等值恰有 1/k!
    排列是单调的，与假设排序无关。observed_is_monotonic=false 意味着观察数据甚至没命中那个唯一的单调排列，但脚本仍报 p=1/120。
  prevention: 排列检验必须使用连续型检验统计量（Spearman ρ、Kendall τ、线性对比系数），不能用二元统计量。编写统计检验脚本时 Reviewer
    必须审查检验统计量定义，确认其对不同排列产生不同的值（而非二元输出）。
  status: active
  context: exp-002 4-benchmark 分析。item_id% 序列 (41.5, 48.9, 44.5, 12.0) 不是单调的但 p=1/120，因为检验统计量对此不敏感。Reviewer
    估计用 Spearman ρ 的真实 p-value 仍可能显著（observed ρ ≈ -0.70），但必须正确计算。
  fix: 修改 gradient_permutation_test.py 使用 Spearman ρ 作为检验统计量，枚举全部 k! 排列计算精确 p-value。

  analysis: 'Fine-tuning G-study confirms the hypothesis that variance hierarchy is
    paradigm-dependent。 Seed dominance scales inversely with dataset size（r=-0.94
    across 4 tasks）， consistent with Bui et al. (2025) who reported extreme seed sensitivity
    in  RoBERTa on COPA (RTES variance=18.22)。GPU×precision虽小但比inference高一个 数量级，因为gradient
    accumulation across training steps amplifies hardware-level  numerical differences。Explicitly
    qualified: RoBERTa is encoder-only on  classification tasks — decoder fine-tuning
    may differ due to autoregressive  generation during evaluation。This observation
    goes in Discussion section only。


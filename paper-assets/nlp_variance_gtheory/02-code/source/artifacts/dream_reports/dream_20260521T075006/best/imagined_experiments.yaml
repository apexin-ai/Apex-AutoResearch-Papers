- name: LayerCast Precision Mitigation
  plan_id: exp-007
  description: 'LayerCast (FP16 storage + FP32 compute) as additional precision condition
    on MMLU。 Llama-3.1-8B × 3 conditions (BF16, FP16, LayerCast) × 6 prompts × 6 seeds  ×
    3 temperatures × 4 orderings × 200 items。

    '
  expected_results:
    total_records: 129600
    total_records_corrected: 259200
    accuracy_bf16: 0.711
    accuracy_fp16: 0.711
    accuracy_layercast: 0.712
    precision_effect_3cond_pct: 0.0004
    precision_x_item_3cond_pct: 0.02
    layercast_vs_bf16_accuracy_delta_pp: 0.1
    layercast_vs_fp16_accuracy_delta_pp: 0.08
    precision_effect_without_layercast: 0.0006
    precision_effect_with_layercast: 0.0004
    variance_reduction_factor: 1.5
  result_rationale: 'LayerCast进一步压缩了已经极小的precision effect（0.0006→0.0004%），因为FP32  compute消除了FP16
    storage中的rare precision loss events。但改善极其marginal， 因为BF16和FP16之间的差异已经negligible（Δ=0.23pp
    accuracy），LayerCast只是 消除了这0.23pp中的一小部分。精度from storage→compute pipeline是完全可逆的——
    FP16→FP32 upcast在compute时恢复了full precision，但BF16→FP32的information 已经在storage时丢失了，所以LayerCast主要帮助FP16
    path。 实际价值有限：best tier下BF16已经sufficiently precise，LayerCast是一个 minor optimization而非necessary
    mitigation。适合在Appendix中brief mention。

    '

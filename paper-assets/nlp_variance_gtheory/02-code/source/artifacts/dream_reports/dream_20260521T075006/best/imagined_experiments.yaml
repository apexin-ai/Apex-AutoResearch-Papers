  result_rationale: 'Fine-tuning的variance hierarchy fundamentally不同于inference：seed（15-42%）取代
    item_id成为dominant source，因为random initialization + data order创建了不同的 loss landscape
    trajectories。RTE和COPA上seed占比极高（38-42%）因为dataset tiny （RTE ~277 examples, COPA
    100 examples），few training examples mean each random  seed leads to a very different
    local minimum。SST-2上seed较低（15%）因为dataset  large（67K），optimization landscape更smooth。Learning
    rate是second largest  （15-25%）因为它直接控制optimization trajectory。GPU×precision较小（0.5-1.5%）
    但比inference高（inference <0.1%），因为fine-tuning中gradient computation的 floating-point差异会accumulate
    across thousands of training steps。

    这个结果支持论文的narrative：variance structure是conditional on evaluation  paradigm的——not
    just benchmark-conditional, but fundamentally different between  inference and
    fine-tuning。但作为encoder-only model on classification tasks， 不能直接generalize to decoder
    fine-tuning。


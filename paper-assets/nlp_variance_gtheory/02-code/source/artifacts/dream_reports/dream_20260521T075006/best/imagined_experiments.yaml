  result_rationale: 'Cross-benchmark gradient的物理机制：MMLU是knowledge retrieval——item
    difficulty 主要由factual content的obscurity决定，这在模型间有较高consensus（都是同一个 training corpus的产物），所以item_id高（42.1%）。HellaSwag是commonsense  completion——需要world
    knowledge + contextual reasoning，model-specific strengths 开始分化（有的模型在physical reasoning强，有的在social
    reasoning强），item_id 降至36.2%。ARC-Challenge是science reasoning——需要multi-hop inference
    over  scientific concepts，不同模型的reasoning chain策略差异更大，model×item升至40.3%。 GSM8K是multi-step
    math——每道题需要2-8步arithmetic+word problem decomposition， 不同模型的mathematical reasoning能力差异极大且item-specific（某模型能做
    ratio problems但不能做geometry），model×item达46.5%而item_id仅22.4%。

    model main effect从4.8%→14.8%递增是因为reasoning benchmarks上模型间的overall performance
    gap更大（MMLU上4模型accuracy range ~10pp，GSM8K上可达25pp）。

    Separability在所有benchmark上<0.15%因为precision的bit-level差异对binary  classification的threshold
    crossing频率极低，这个机制与task type无关。 GSM8K略高（0.14%）因为multi-step computation中floating-point误差有更多
    accumulation机会，但仍远低于0.5%阈值。

    D-study delta在GSM8K上略大（0.007 vs MMLU 0.004）因为model×item占比更高 意味着3-model估计对第4模型的interaction
    pattern预测略不精确，但仍<0.01。

    IRT/G-theory ratio从3.57到4.14是因为GSM8K上prompt×item和seed×item的 相对占比更高（reasoning tasks对prompt
    wording更敏感），G-theory需要更多items 来compensate这些额外variance sources。


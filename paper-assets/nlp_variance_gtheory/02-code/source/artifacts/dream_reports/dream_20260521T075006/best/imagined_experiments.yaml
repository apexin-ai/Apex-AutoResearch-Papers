tier: best
narrative_guidance: 'Original framing完全成立。Cross-benchmark gradient是primary novel finding——
  item_id从MMLU 42.1%单调递减至GSM8K 22.4%（Δ=19.7pp），model×item从33.6% 单调递增至46.5%。知识检索→多步推理的variance
  structure发生质变，item dominance 系统性减弱而model×item上升，直接解释了文献中关于"item重要还是prompt重要"的 矛盾结论——答案是benchmark-conditional。所有robustness分析hold：item
  resampling CV=3.2%，leave-one-model-out G_item spread=0.023，BF16≈FP16（Δ<0.001%），
  hardware×methodology<0.18%（binary）跨GPU confirmed。D-study在4个benchmark 上out-of-sample验证Δ≤0.007。IRT/G-theory
  ratio 3.5–4.4×在所有benchmark成立， 因为G-theory显式建模prompt×item、seed×item等IRT忽略的维度。Separability在binary
  scoring下跨benchmark、跨GPU均<0.5%。5个figure全部有实质数据。Hook直接用： "no universal reproducibility
  recipe"。AAAI 2027 strong accept范围（7–8/10）， 三个claim均有充分empirical support，无需削弱任何主张。

  '

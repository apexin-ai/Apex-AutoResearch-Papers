    coefficient。水平虚线标注G=0.80和G=0.90 thresholds。 MMLU最先到达G=0.80（414 items），GSM8K最迟（588
    items）。每条曲线有shaded  bootstrap CI band。右侧小图展示practical vs all-random allocation的差异。

    '
  - 'Figure 4 (IRT vs G-theory): paired bar chart × 4 benchmarks。每pair左=IRT （短bar,
    116–142 items），右=G-theory（长bar, 414–588 items）。 Gap区域用分解条纹填充：prompt×item（蓝条纹）、seed×item（绿条纹）、
    ordering×item（橙条纹）、residual（灰条纹），直观展示"extra items的去向"。 顶部标注ratio（3.6×–4.1×）。

    '
  - 'Figure 5 (Temperature-stratified G heatmap): 3×3 grid（或4×3），行=benchmark， 列=temperature（T=0.0,
    T=0.3, T=0.7）。每个cell颜色=G value，深绿=高G, 深红=低G。Binary scoring行从浅绿（G=0.76 at T=0.0）渐变到黄（G=0.55
    at T=0.7）。 Text-exact-match行全部深红（G<0.01 for T>0）。Logprob行介于两者之间。

    '
  analysis: '17项sub-analysis形成完整的methodological defense package。最关键的发现： (1) IRT比较直接量化了"忽略multi-facet
    reliability的hidden cost"——在IRT推荐的 116 items处，G-theory G仅0.529（远低于0.80），这不是IRT"错了"而是它回答的是

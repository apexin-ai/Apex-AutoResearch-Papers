    gradient preserved意味着 cross-benchmark finding不是binary scoring artifact。(4) Power>95%
    for ≥2% effects preempts underpowered concern。(5) Full-benchmark projection（MMLU
    14K→G=0.982） 防止了"MMLU is unreliable"的misinterpretation。

    '

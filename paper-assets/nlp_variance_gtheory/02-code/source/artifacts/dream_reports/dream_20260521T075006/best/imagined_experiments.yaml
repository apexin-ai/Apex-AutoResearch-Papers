  result_rationale: 'MATH是gradient的natural endpoint：item_id仅18.1%因为数学问题的difficulty
    极度model-specific——一道number theory题对数学强的模型trivial，对弱模型impossible， 这种all-or-nothing
    pattern使"universal difficulty"几乎不存在。Model×item达50.8% （超过一半的variance），因为每个模型有fundamentally不同的mathematical
    reasoning  capabilities：Qwen在algebra强（可能因为训练数据中中文数学教材丰富），Gemma在 geometry好，Mistral整体最弱但在某些combinatorics问题上有unique
    strengths。

    Model main effect高达16.8%（vs MMLU 4.8%）因为MATH上模型间的overall accuracy  spread极大（Mistral
    24.5% vs Qwen 40.2%，gap 15.7pp vs MMLU ~10pp）。

    Seed占1.8%（比MMLU高）因为chain-of-thought generation的randomness在multi-step reasoning中有更多opportunity
    to diverge——一步走错全盘皆输。同理prompt的 绝对值虽相似（2.4%）但在剩余variance中的相对share更低。

    Residual仅4.4%——MATH上大部分variance都可以被identified sources解释，因为 binary correctness在math上更deterministic（答案对就是对，不像MMLU可能有
    arguable answers）。

    G_item=0.781刚好在best tier threshold（≥0.78）内，因为even though model×item dominates，4个模型仍然agree
    on some items being universally hard（e.g.,  competition-level problems）或universally
    easy（e.g., basic arithmetic with  chain-of-thought support）。

    IRT/G-theory ratio 4.56×是最高的，因为MATH上seed×item（2.3%）和prompt×item（2.1%） 在low-item_id
    context中占relative importance更大。D-study需要648 items for G≥0.80， 远超MMLU的414——reasoning
    benchmarks上reliable evaluation更expensive。

    Extended gradient（24pp range, 5 benchmarks, perfect monotonicity）是best tier的 crown
    jewel：从MMLU到MATH，item dominance从42%降到18%，model×item从34%升到51%， 完美的mirror image。这直接说明"universal
    reproducibility recipe"是illusory—— 在MMLU上"多加items"是最effective intervention，在MATH上"多加models"更重要。

    '

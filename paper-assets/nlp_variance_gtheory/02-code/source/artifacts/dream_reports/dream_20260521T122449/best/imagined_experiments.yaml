    hypothetical_layercast_variance_reduction: precision×item drops from 1.98% to
      ~0.3%
    hypothetical_practical_value: Minimal — BF16≈FP16 already shows precision is negligible
  result_rationale: 'LayerCast 在 best 档下未执行，且不影响任何 claim。exp-001 已证明排除 FP32 后 BF16≈FP16
    (Δ=0.23pp)，精度对二值评分结果的影响可忽略。LayerCast 作为一种 "混合精度推理" 策略理论上能进一步缩小精度差异，但当差异已经 <0.3pp
    时， 这种缩小没有实际意义。如果执行，LayerCast 的 accuracy 会落在 FP16 和 FP32 之间， 因为它在计算关键层使用 FP32 精度但存储使用
    FP16——减少了 FP32 enforce_eager 带来的 vLLM 引擎差异。precision×item 从 1.98% 降至 ~0.3% 反映混合精度
    消除了纯 FP32 的系统性偏差但保留了极少量的层间精度传播差异。

    '

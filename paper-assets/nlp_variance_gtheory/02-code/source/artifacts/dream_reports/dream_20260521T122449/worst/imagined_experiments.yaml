    description: 'Reliability threshold × IRT items × G-theory items × ratio. G≥0.70:
      55 vs 210 (3.8×). G≥0.80: 116 vs 510 (4.4×). G≥0.90: 280 vs 1350 (4.8×). Decomposition
      of G-theory excess: prompt×item accounts for 22%, seed×item 23%, residual 55%
      of additional items.

      '
  - name: 'Table: Fixed vs Random Sensitivity Analysis'
    description: '4 benchmarks × top-4 components × random estimate + fixed estimate
      + Δ. MMLU Δ < 3pp (robust). GSM8K Δ = 8.4pp for item_id (NOT robust — temperature
      reclassification redistributes 8pp from temperature to residual).

      '
  - name: 'Table: D-Study Budget Comparison with Bootstrap CIs'
    description: '4 benchmarks × items for G≥0.80 [95% CI]. MMLU: 510 [430, 610].
      ARC: 340 [260, 470]. HellaSwag: 280 [210, 380]. GSM8K: 1150 [600, 2100]. The
      GSM8K CI spans 3.5×, making the point estimate practically meaningless.

      '
  figures_description:
  - 'Forest plot of variance component CIs across 4 benchmarks. Each benchmark is
    a panel; within each panel, components are rows with point estimates (dots) and
    95% CI whiskers. Visually shows that CI widths vary dramatically across benchmarks
    (tight on MMLU, wide on GSM8K) and component rankings are inconsistent.

    '
  - 'IRT vs G-theory comparison bar chart (MMLU only). Two bars per reliability threshold
    (0.70, 0.80, 0.90). G-theory bar decomposed into sub-segments showing which facets
    (prompt×item, seed×item, residual) account for the extra items beyond IRT. Clear
    visual showing the "multi-facet reliability cost."

    '
  - 'D-study projection curves with 95% CI ribbons for 4 benchmarks (overlaid on single
    panel). MMLU and HellaSwag curves rise steeply with narrow ribbons. GSM8K curve
    is nearly flat with a wide ribbon that barely touches G=0.80 at n=1150.

    '
  analysis: 'exp-004 is the analytical core of the paper under worst tier. The MMLU-specific
    analyses are strong: bootstrap CIs confirm top-3 component ordering, IRT comparison
    produces the clean 4.4× ratio, REML validates Henderson I, and the binary data
    robustness checks all pass. These form the backbone of the paper.

    Cross-benchmark analyses reveal the "irreducibly benchmark-specific" finding but
    cannot support strong quantitative claims due to wide CIs and benchmark-specific
    pathologies. GSM8K is particularly problematic: high residual → wide CIs → unreliable
    D-study projections → fixed-vs-random sensitivity failure. The paper should present
    GSM8K results as "illustrative of pathological variance structure in free-form
    generation" rather than as reliable G-theory estimates.

    The IRT vs G-theory comparison is limited to MMLU (the only benchmark with full
    design + clean variance structure + IRT comparability). This is sufficient for
    a strong numbered contribution but prevents claiming "cross-benchmark IRT comparison."

    Key paper structure implication: MMLU analysis (exp-001 + exp-004 MMLU-specific)
    occupies 60-70% of the results section. Cross-benchmark analysis (exp-002 + exp-004
    cross-benchmark) occupies 30-40% as an "exploratory extension" with explicit caveats
    about reduced design, limited benchmarks, and pathological structures.

    '

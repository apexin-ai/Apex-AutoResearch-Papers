  result_rationale: 'Phase 1 completion with Phase 2-4 blockage: MATH requires robust
    free-form answer extraction (symbolic expressions, equivalent forms like "1/2"
    vs "0.5" vs "\\frac{1}{2}"), which stalls on engineering work. Additional models
    blocked by hardware unavailability.

    No systematic gradient: The variance structure is driven by benchmark-specific
    properties that don''t align with any single task taxonomy axis. HellaSwag shows
    highest item_id% (44.1%) despite being "commonsense completion" — not the most
    complex task — because its items have extremely stable difficulty rankings across
    models (4 candidates with clear plausibility ordering). GSM8K shows lowest item_id%
    (35.4%) and highest residual (43.2%) because free-form math generation introduces
    stochastic variation from decoding that inflates the residual; the same model
    solving the same problem with the same prompt/seed can produce different solution
    paths and occasionally different final answers at T>0.

    Model×item interaction is inconsistent: GSM8K has the highest model×item (38.9%)
    because models have strongly differentiated math capabilities — Qwen3-8B solves
    multi-step problems that Mistral-7B cannot, and vice versa for word problems with
    unusual phrasing. HellaSwag has lowest model×item (15.7%) because commonsense
    completion difficulty is more universal across model families. This pattern (math
    > commonsense for model×item) is interpretable post-hoc but was not predictable
    from task taxonomy alone.

    ARC convergence: Henderson I produces near-zero estimates for several 3-way interactions
    because the reduced design (2 temps × bf16-only) has limited degrees of freedom
    for higher-order terms. REML on GSM8K produces a negative variance component for
    seed×item, which is clamped to zero — seed choice has negligible systematic effect
    on item difficulty in free-form generation because the dominant stochasticity
    is in the generation process itself, not in CUDA-level seed effects.

    D-study budgets span 4.1× (280-1150 items for G≥0.80), but this range has no interpretable
    pattern: HellaSwag needs fewest items (high item_id%, low residual → efficient
    measurement) while GSM8K needs most (low item_id%, high residual → measurement
    is noisy). This is not a "gradient" — it''s a benchmark-specific fingerprint determined
    by format, generation stochasticity, and model-task interaction structure.

    Within-format gradient fails: Within MC format, MMLU (42%) > ARC (37%), but ARC
    contains harder science reasoning items — if a task-complexity gradient existed,
    ARC should be lower OR higher than MMLU depending on the hypothesized direction.
    The 5pp difference is more likely explained by item pool characteristics (ARC
    has fewer items with extreme difficulty, compressing item_id%) than by task complexity.
    With only two MC benchmarks and no within- format gradient, the format confound
    cannot be resolved or ruled out.

    '
  tables:
  - name: 'Table: Cross-Benchmark Variance Decomposition (Phase 1, 4 models × 4 benchmarks)'
    description: 'Rows: variance components (item_id, model, model×item, prompt×item,
      seed×item, temperature, temperature×item, residual). Columns: MMLU, ARC-Challenge,
      HellaSwag, GSM8K. Shows no systematic gradient — component rankings differ across
      benchmarks. GSM8K residual dominates (43.2%); HellaSwag item_id highest (44.1%);
      model×item ranges from 15.7% (HellaSwag) to 38.9% (GSM8K) without pattern.

      '
  - name: 'Table: D-Study Budget Comparison Across Benchmarks'
    description: 'Items required for G≥0.70/0.80/0.90 per benchmark. Shows 4.1× spread
      in G≥0.80 requirements (280-1150 items). No interpretable pattern linking budget
      to task type.

      '
  - name: 'Table: Within-Format Gradient Test'
    description: 'MC format: MMLU (42%) vs ARC (37%), Δ=5pp. Free-form: GSM8K only
      (35.4%), no comparator (MATH blocked). Completion: HellaSwag only (44.1%). Conclusion:
      within-format gradient NOT preserved; insufficient data to disentangle format
      from task-type effects.

      '
  figures_description:
  - 'Stacked-bar variance decomposition across 4 benchmarks — the "anti-gradient"
    figure. No systematic left-to-right ordering; bars show qualitatively different
    component structures. GSM8K bar dominated by residual (gray, 43%); HellaSwag dominated
    by item_id (blue, 44%); model×item (orange) varies 3× across benchmarks. Horizontal
    dashed line at item_id=42% (MMLU reference) shows other benchmarks scatter above
    and below without trend.

    '
  - 'D-study projection curves per benchmark (G vs item count, 4 panels or 4 lines
    on one panel). Curves have wildly different slopes and asymptotes. GSM8K curve
    is nearly flat — even 1000 items only reaches G≈0.75 because residual dominates.
    HellaSwag curve rises steeply, crossing G=0.80 at ~280 items.

    '
  analysis: 'The cross-benchmark gradient — the planned headline finding — does not
    materialize. Item_id% varies only 8.7pp across benchmarks (35-44%), with no monotonic
    ordering by task complexity, format, or any other interpretable dimension. The
    permutation test for monotonicity yields p=0.41 (null). Model×item interaction
    varies 23pp across benchmarks but in an unpredictable pattern (highest on GSM8K,
    lowest on HellaSwag).

    However, the "benchmark-specific variance fingerprints" finding is itself publishable.
    The fact that variance structure is irreducibly benchmark-specific — not predictable
    from task taxonomy — means (a) benchmark-specific G-studies are mandatory, not
    optional, (b) reproducibility budgets cannot be transferred across benchmarks,
    and (c) conclusions about "which factors matter" from single-benchmark studies
    do not generalize. This is arguably more surprising and practically important
    than a clean gradient.

    GSM8K''s pathological residual (43.2%) is a standalone finding: free-form generation
    introduces irreducible stochasticity that makes G-theory decomposition qualitatively
    different from MC benchmarks. The seed×item negative REML estimate and convergence
    oscillation on HellaSwag precision×item suggest that Henderson I (designed for
    balanced continuous data) struggles with certain benchmark-specific variance structures,
    strengthening the case for benchmark-specific methodology.

    Phase 2-4 blockage limits the analysis: no MATH benchmark prevents within-free-form
    gradient testing, and only 4 models prevents the planned expansion to 6-8 models
    that would strengthen the model-as-facet exchangeability argument. The paper must
    explicitly scope to "4 models × 4 benchmarks, exploratory Phase 1 analysis."

    '

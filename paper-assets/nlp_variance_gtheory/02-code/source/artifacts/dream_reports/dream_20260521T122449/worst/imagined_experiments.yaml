    Impact on paper: No variance mitigation strategy is tested. The paper''s D-study
    budgets address "how many items/prompts/seeds" but not "how to reduce precision
    variance." This is consistent with the finding that precision contributes <0.1%
    variance under binary scoring — there is nothing to mitigate. The paper can note:
    "LayerCast and other mixed-precision strategies may be relevant for text-exact-match
    scoring where precision×temperature interaction is detectable (1.3%)."

    '

  result_rationale: 'MMLU analyses are strong and largely replicate exp-001 findings
    with bootstrap CIs and additional robustness checks. The IRT vs G-theory comparison
    (4.4× item ratio) is clean on MMLU and becomes a primary contribution.

    Cross-benchmark analyses are degraded by three compounding factors: (1) Only 4
    benchmarks (no MATH) with only 4 models — limited statistical power for cross-benchmark
    generalizations and wide bootstrap CIs. (2) GSM8K''s pathological variance structure
    (residual >40%, negative REML estimates) makes several analyses unreliable or
    uninterpretable on that benchmark. The high residual means G-theory components
    are estimated with low precision, widening CIs and making D-study projections
    impractical (CI for G80 items: [600, 2100]). (3) Fixed-vs-random sensitivity analysis
    fails on GSM8K (Δ>5pp), meaning the methodological choice of treating temperature
    as random vs fixed materially affects results — another benchmark-specific pathology.

    REML diverges from Henderson I on GSM8K because the balanced design assumption
    is stressed by near-zero or negative components. Henderson I is unbiased for balanced
    designs but produces interpretable results even when components are near-zero;
    REML tries to find ML estimates and can produce negative values that must be clamped.
    This divergence is itself a finding: Henderson I is reliable for well-behaved
    MC benchmarks but may be problematic for free-form generation benchmarks.

    The logprob analysis cannot extend beyond MC formats (MMLU, ARC) because free-form
    and completion tasks lack a natural single-token probability score. This means
    the "Evaluation Metrics" claim in the title is only partially supported, and the
    title may need adjustment per MD9.

    Bootstrap vs jackknife agreement is good on MMLU/ARC (ratio 0.98-1.03) but marginal
    on GSM8K (ratio 1.14), suggesting bootstrap CIs on GSM8K are slightly anti-conservative
    due to non-independence in the stochastic generation process.

    '
  tables:
  - name: 'Table: Bootstrap 95% CIs for All Variance Components (MMLU, 4 models)'
    description: '7 variance components × point estimate + 95% CI. item_id: 42.1%
      [36.0, 48.8], model×item: 33.6% [28.4, 37.9], residual: 19.5% [16.2, 23.1].
      All CIs exclude zero for top-4 components. prompt×item and seed×item CIs overlap.


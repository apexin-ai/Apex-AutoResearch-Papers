tier: worst
narrative_guidance: 'Abandon cross-benchmark gradient as headline finding. The paper
  pivots to two axes: (A) deep single-benchmark MMLU analysis (model×item quantification,
  D-study out-of-sample validation, IRT comparison, full robustness package — all
  already strong from exp-001/exp-004), and (B) ''benchmark-specific variance fingerprints''
  — each benchmark produces an idiosyncratic variance structure that cannot be predicted
  from task taxonomy, format, or difficulty distribution alone. The hook becomes:
  "not only is there no universal reproducibility recipe — there is no universal variance
  structure, and even task-type taxonomy fails to predict it." This is arguably more
  surprising than a clean gradient. Claim 1 narrowed to MMLU with exploratory multi-benchmark
  extension. Claim 3 strengthened — benchmark-specific budgets are the ONLY viable
  approach because variance fingerprints are irreducibly benchmark-specific. Primary
  contribution shifts from gradient discovery to: (i) model×item interaction quantification
  with D-study validation on MMLU, (ii) IRT vs G-theory comparison, (iii) demonstration
  that variance structure is irreducibly benchmark-specific. Same AAAI target but
  likely needs ACL ARR October cycle for rewriting.

  '

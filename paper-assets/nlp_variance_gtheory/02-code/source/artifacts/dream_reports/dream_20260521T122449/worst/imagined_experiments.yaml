      + Δ. MMLU: all Δ < 0.5pp. ARC: Δ < 1.2pp. HellaSwag: precision×item oscillates.
      GSM8K: seed×item diverges (1.8% vs clamped 0%). Conclusion: Henderson I reliable
      for MC benchmarks; caution needed for free-form generation.

      '

- name: LayerCast precision study
  plan_id: exp-007
  description: '在MMLU上测试LayerCast（FP16 storage + FP32 compute）作为额外precision condition。
    4 models × 1 precision mode × 6 prompts × 6 seeds × 3 temperatures × 4 orderings
    × 200 items = 172,800记录。

    '
  expected_results:
    layercast_accuracy_mean: 0.67

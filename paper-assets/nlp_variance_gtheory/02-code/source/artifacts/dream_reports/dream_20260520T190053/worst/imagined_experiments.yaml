- name: Fine-tuning G-study (RoBERTa)
  plan_id: exp-006
  description: 'RoBERTa-large on SST-2/MNLI/RTE/COPA。6 seeds × 3 learning rates ×
    4 data shuffles × 3 GPUs × 2 precisions = 432 runs/task × 4 tasks = 1,728 runs。

    '
  expected_results:
    item_variance_share_sst2: 0.15
    item_variance_share_mnli: 0.12
    item_variance_share_rte: 0.2
    item_variance_share_copa: 0.08
    learning_rate_main_effect_avg: 0.18
    seed_main_effect_avg: 0.08
    data_shuffle_main_effect_avg: 0.06
    precision_main_effect_avg: 0.02
    lr_seed_interaction_avg: 0.1
    residual_avg: 0.22
    g_coefficient_sst2: 0.55
    g_coefficient_rte: 0.48
    g_coefficient_copa: 0.35
    training_vs_inference_variance_correlation: 0.15
  result_rationale: 'Fine-tuning的方差结构与inference fundamentally不同。Learning rate是最大的
    可归因方差来源（~18%），因为它直接控制模型converge到loss landscape的哪个 basin，不同basin对不同items的predictions质性不同。seed:lr交互高达10%因为
    不同seed的weight initialization在不同lr下converge到不同local minima。 item_id在fine-tuning中方差占比更低（8-20%），因为fine-tuning本身改变了
    model-item的关系——同一个item在不同training run中的难度会变（unlike inference where model weights
    are fixed）。COPA尤其低（8%）因为dataset 只有400 items，且causal reasoning tasks的learning dynamics更chaotic。
    residual=22%反映了training过程中unmodeled的随机性（CUDA非确定性在训练中 比推理中更显著，因为每个gradient step都累积噪声）。与inference方差结构
    的correlation极低（r=0.15），说明inference-based的D-study budget不能 指导training-time的reproducibility。这个发现独立于inference
    story，可以 作为separate contribution线——即使inference的item dominance不成立， fine-tuning的方差归因本身也是novel的。

    '

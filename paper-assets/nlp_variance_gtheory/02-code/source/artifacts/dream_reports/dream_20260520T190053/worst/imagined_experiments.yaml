- name: LayerCast precision mitigation
  plan_id: exp-007
  description: 'LayerCast（FP16 storage + FP32 compute）作为额外precision条件测试方差减少量。

    '
  expected_results:
    layercast_accuracy: 0.672
    layercast_vs_bf16_accuracy_delta: 0.001
    variance_reduction_vs_fp16: 0.003
    precision_component_with_layercast: 0.012
    precision_item_interaction_with_layercast: 0.03
    practical_significance: negligible
  result_rationale: '在worst档下，exp-001已经显示precision main effect仅1.5%（confound修复后）。
    LayerCast的FP16 storage + FP32 compute在理论上应该给出接近FP32的结果，但 由于FP32本身与BF16/FP16的差异已经很小（Δaccuracy=0.002），LayerCast的
    额外收益几乎为零。precision:item交互从3.5%微降到3.0%，不具有实际意义。 这个结果说明precision本来就不是主要方差来源（confound修复后），mitigation
    策略针对的是一个已经很小的问题。


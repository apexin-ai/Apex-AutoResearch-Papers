- name: MATH benchmark extension
  plan_id: exp-008
  description: 'MATH benchmark 200 items，测试reasoning-heavy tasks中CoT引入的额外方差。

    '
  expected_results:
    item_variance_share_math: 0.1
    residual_share_math: 0.4
    seed_main_effect_math: 0.07
    seed_item_interaction_math: 0.12
    temperature_main_effect_math: 0.1
    temperature_item_interaction_math: 0.15
    prompt_item_interaction_math: 0.03
    g_coefficient_math: 0.3
    cot_length_variance_correlation: 0.65
    items_needed_g90_math: 2200
  result_rationale: 'MATH是最extreme的reasoning benchmark，CoT生成过程中的每个token都是一个 采样点，长推理链（avg
    200+ tokens）意味着seed和temperature的随机性被200+ 次multiplicative放大。因此seed:item（12%）和temperature:item（15%）极高，
    temperature main effect达10%（在其他benchmark上<2%），因为temperature 直接控制采样diversity，在长chain中的累积效应是非线性的。item_id仅10%——
    比GSM8K更低——因为MATH problems的难度更多由解题路径的存在性决定，而非 item本身的知识内容，solution path的发现受seed/temperature强烈影响。
    residual高达40%是worst档中最高的，反映了MATH推理过程中大量不可归因的 随机性（错误的推理链、self-correction失败、格式解析错误等）。G=0.30是
    所有benchmark中最低的，G≥0.90需要2200 items，完全不切实际（MATH全集仅 5000题）。这个结果是"no universal recipe"论点的最强证据——如果连G≥0.90
    的item threshold在不同benchmark间差3-4倍，prescriptive budget毫无意义。

    '

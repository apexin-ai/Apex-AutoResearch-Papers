  figures_description:
  - 'Scatter plot: CoT生成长度(tokens) vs item-level accuracy variance，展示正相关（r=0.65）——推理链越长，evaluation
    variance越大。这是mechanistic explanation。'
  - 'Gradient spectrum bar: 从MMLU→ARC→HellaSwag→GSM8K→MATH的G coefficient递减趋势，visual
    argument for benchmark-conditional variance。'
  analysis: MATH是worst档叙事的exclamation mark。G=0.30意味着当前practice下MATH evaluation基本是noise-dominated的。结合exp-002的GSM8K结果，形成清晰的
    gradient：knowledge-retrieval tasks（MMLU）→ moderate reasoning（ARC）→ generation-heavy
    reasoning（GSM8K/MATH）的方差结构systematically shifts from item-conditional to seed/temperature-conditional。这个gradient本身
    是一个contribution——它解释了为什么reasoning benchmark的reproduction rates historically更低，并提供了mechanistic
    account（CoT length amplifies sampling noise）。

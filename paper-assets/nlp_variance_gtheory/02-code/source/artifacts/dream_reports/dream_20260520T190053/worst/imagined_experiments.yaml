  - 'Radar/spider chart: 每个benchmark一条线，axes为top-5 variance components的share，展示方差profile的shape差异。'
  analysis: '这是对Claim 1的致命打击：item dominance不仅在修复confound后缩水（exp-001）， 而且在MMLU以外的benchmark上根本不成立。GSM8K中seed和temperature的影响远超item
    selection。但这恰恰支撑了reframe后的核心论点：方差结构是benchmark-conditional的， 不存在universal reproducibility
    recipe。这个negative result在evaluation track 有价值——告诉社区"固定prompt/seed"在reasoning tasks上不够，而"增加items"在
    reasoning tasks上可能比MMLU上更无效。

    '
- name: Multi-hardware G-study (BLOCKED)
  plan_id: exp-003
  description: '4 models × 2+ GPU types × 2 precisions × 6 prompts × 6 seeds × 3 temperatures
    × 4 orderings × 200 MMLU items。测试hardware×methodology交互。

    '
  expected_results:
    status: blocked_no_second_gpu
    hardware_main_effect: N/A
    hardware_method_interaction: N/A
    hardware_item_interaction: N/A
    claim2_testable: false
    fallback_evidence: single-GPU precision-only proxy
  result_rationale: '第二块GPU不可用——Manager无法在timeline内提供第二种GPU类型。这是worst档的核心 假设之一。没有hardware
    crossing，Claim 2的"infrastructure vs methodology" 分离无法实证，因为precision是infrastructure的一个proxy但不是全部。在单GPU上，
    所有CUDA非确定性来自同一架构的同一driver stack，无法区分hardware-specific vs hardware-universal的方差。Claim
    2必须降级为"precision vs methodology separability" 而非"infrastructure vs methodology
    separability"，scope显著缩小。

    '
  tables: []
  figures_description:
  - 仅能展示exp-001中precision facet的方差贡献（~1.5% main effect），作为infrastructure的下界估计。附注说明这是单GPU结果，hardware
    crossing是future work。
  analysis: '这是structural blocker。paper必须在limitations中明确承认hardware crossing缺失， Claim
    2的scope从"infrastructure"缩小到"numerical precision"。reviewer concern #1（"Only N GPU
    types"）变得无法回应。reframe策略：将single-GPU作为"controlled baseline"，承认hardware是open question，但argue
    precision已经是实践中最常见的 infrastructure变量。exp-006（fine-tuning）的hardware crossing（如果能在不同GPU上
    跑RoBERTa）可能部分弥补。

    '

tier: worst
narrative_guidance: '原始framing不成立，但不降venue——reframe为"variance structure is benchmark-conditional
  and model-conditional"。新headline：evaluation variance的归因模式本身是unstable的， 不同benchmark/model组合产生qualitatively不同的方差结构，意味着没有universal
  reproducibility recipe。核心contribution转为：(1) G-theory framework作为diagnostic tool的方法论贡献；(2)
  证明one-size-fits-all standardization策略无效（negative but important result）；(3) float32
  engine confound的发现和修复本身是方法论贡献。 D-study从prescriptive budget转为diagnostic tool。启动exp-006对冲inference-only风险。

  '
imagined_experiments:
- name: Full-scale precision study (float32 confound fixed)
  plan_id: exp-001
  description: '4 models × 3 precisions × 6 prompts × 6 seeds × 3 temperatures × 4
    orderings × 200 MMLU items，全部使用一致的vLLM V0 enforce_eager引擎消除float32 confound。

    '
  expected_results:
    item_variance_share_overall: 0.24
    item_variance_share_qwen3_8b: 0.28
    item_variance_share_llama31_8b: 0.26
    item_variance_share_gemma2_9b: 0.3
    item_variance_share_mistral_7b: 0.14
    residual_share_overall: 0.28
    residual_share_mistral: 0.38
    precision_main_effect: 0.015
    precision_item_interaction: 0.035
    prompt_item_interaction: 0.048
    temperature_item_interaction: 0.055
    seed_item_interaction: 0.018
    prompt_main_effect: 0.008
    temperature_main_effect: 0.012
    seed_main_effect: 0.003
    ordering_main_effect: 0.002
    ordering_item_interaction: 0.015
    accuracy_fp32: 0.67
    accuracy_bf16: 0.672
    accuracy_fp16: 0.671
    g_coefficient_overall: 0.42
    total_records: 172800
    models_showing_item_dominant_pattern: 2
  result_rationale: 'MVP中item_id=58.4%的大部分来自float32 engine confound的inflation——float32使用了
    不同的vLLM backend（V1 vs V0），导致float32条件下accuracy系统性偏低（59.9% vs ~68.4%），这个precision主效应通过precision:item_id交互被分配到了item方差中。修复后
    precision不再引入系统性偏差，三种精度的accuracy收敛到~67%，item_id的方差贡献大幅 缩水至~24%。residual上升到28%成为最大单一成分，因为：(1)
    item_id不再吸收confound inflation的方差；(2) CUDA非确定性、vLLM调度随机性等不可归因的噪声被暴露。Mistral-7B
    特别异常（item仅14%、residual达38%），因为其architecture（sliding window attention + 不同的tokenizer覆盖率）对MMLU
    items的响应模式与其他三个模型质性不同——更多方差 落入不可解释的残差中。温度×item交互（5.5%）偏高是因为200个items中有约30%处于模型
    决策边界，温度对这些borderline items的影响远大于确定性items。整体G=0.42仅略高于 MVP的0.357，因为residual主导意味着增加任何单一facet的level数都无法有效降低测量误差。


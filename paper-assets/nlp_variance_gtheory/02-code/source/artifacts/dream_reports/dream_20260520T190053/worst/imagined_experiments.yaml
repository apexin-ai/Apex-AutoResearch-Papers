    projections的上限被压低。 即使增加所有facet的level数，residual的floor意味着G=0.90需要极大的item数量来 压缩其他可归因方差。MMLU上G≥0.90需要~850
    items因为residual=28%设置了noise floor；GSM8K更差（1400 items）因为residual=35%加上seed/temperature的高交互
    意味着需要同时增加items和seeds/temperatures。关键发现：optimal allocation strategy在不同benchmark上qualitatively不同——MMLU上增加items最有效，GSM8K上
    增加seeds/降低temperature同样重要。这直接支撑"no universal recipe"的论点， 但摧毁了Claim 3的prescriptive
    budget叙事。D-study必须从"这是你的budget" 转为"这是为什么你需要benchmark-specific的budget"。


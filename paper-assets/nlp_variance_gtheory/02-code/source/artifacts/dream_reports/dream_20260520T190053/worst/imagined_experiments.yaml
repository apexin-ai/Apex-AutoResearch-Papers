- name: Multi-benchmark replication (GSM8K, ARC-Challenge, HellaSwag)
  plan_id: exp-002
  description: '4 models × 2 precisions × 6 prompts × 6 seeds × 2 temperatures × 4
    orderings on GSM8K/ARC-Challenge/HellaSwag各200 items。

    '
  expected_results:
    item_variance_share_gsm8k: 0.12
    item_variance_share_arc: 0.22
    item_variance_share_hellaswag: 0.18
    residual_share_gsm8k: 0.35
    residual_share_arc: 0.24
    residual_share_hellaswag: 0.2
    seed_item_interaction_gsm8k: 0.14
    temperature_item_interaction_gsm8k: 0.18
    temperature_main_effect_gsm8k: 0.08
    seed_main_effect_gsm8k: 0.05
    prompt_item_interaction_arc: 0.06
    prompt_item_interaction_hellaswag: 0.04
    g_coefficient_gsm8k: 0.38
    g_coefficient_arc: 0.48
    g_coefficient_hellaswag: 0.52
    cross_benchmark_item_dominance_replication: 0
    benchmarks_with_item_as_largest: 0
    benchmarks_with_consistent_top3_components: 0
  result_rationale: 'GSM8K是reasoning task，生成chain-of-thought过程中seed和temperature的随机性被
    放大——每个decoding step的采样噪声累积到最终答案。因此seed:item（14%）和 temperature:item（18%）远超MMLU，而item_id本身仅12%，因为reasoning
    tasks的难度 variance更多被seed/temperature的采样路径差异所遮蔽。residual在GSM8K上高达35%， 反映了CoT生成的内在不可控性。ARC-Challenge作为science
    reasoning有中等item dominance（22%），介于MMLU和GSM8K之间——多数题目是知识检索而非推理链，但部分 题目需要multi-step推理引入额外方差。HellaSwag的item=18%、residual=20%反映了
    commonsense completion task中completion长度和ambiguity的中间特性。关键发现： 没有任何一个benchmark的方差结构能复制MMLU的pattern——方差hierarchy是
    benchmark-conditional的。GSM8K的top component是residual（35%），ARC的是 residual（24%），HellaSwag的是residual（20%）——在worst档下residual几乎总是
    最大或接近最大的成分，说明当前facet设计systematically遗漏了某些重要方差来源。

    '

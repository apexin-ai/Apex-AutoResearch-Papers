  review_report: "---\ndream_id: dream_20260520T190053\ntier: median\noverall_score:\
    \ borderline reject\ntimestamp: 2026-05-20T19:43:32.938686+00:00\n---\n\n# Dream\
    \ Review Report\n\n**Paper:** Benchmark-Dependent Variance Structure in LLM Evaluation:\
    \ A Generalizability Theory Analysis of Infrastructure and Methodological Reproducibility\n\
    \n**Review mode:** full | **Reviewers:** R1 (Methods + Experiments), R2 (Novelty\
    \ + Related Work)\n\n---\n\n## 1. Paper Summary\n\nThis paper applies Generalizability\
    \ Theory (G-theory) to LLM evaluation, crossing infrastructure facets (hardware\
    \ type, numerical precision) with methodology facets (prompt template, random\
    \ seed, sampling temperature, option ordering) and item selection as the measurement\
    \ facet. Across 6 models (4×8B, 2×14B), 5 benchmarks (MMLU, ARC-Challenge, HellaSwag,\
    \ GSM8K, MATH), and over 1 million evaluation records, the paper reports three\
    \ findings: (1) item selection is the single largest variance source on MC benchmarks\
    \ (30–46%) but its dominance is benchmark-dependent, weakening on reasoning tasks;\
    \ (2) infrastructure and methodology are approximately separable at the aggregate\
    \ level (direct interaction <1%); (3) D-study projections yield task-specific\
    \ reproducibility budgets (380–950 items for G≥0.90). A fine-tuning extension\
    \ with RoBERTa-large shows the variance hierarchy inverts (LR and seed dominate).\
    \ Eight experiments are presented across 13 pages with 15 tables and zero figures.\n\
    \n---\n\n## 2. Roundtable: Independent Assessments\n\n### R1 — Methods and Experiments\
    \ (Score: 4/6, Borderline Reject)\n\n**Strengths:**\n- Massive fully-crossed factorial\
    \ design on MMLU (1,036,800 records) with systematic confound control (enforce_eager\
    \ fix reducing the FP32 accuracy gap from 8.5pp to <1pp)\n- Cross-benchmark extension\
    \ (Exp 2–3) revealing the variance gradient from item-dominated (HellaSwag 45%)\
    \ to residual/interaction-dominated (MATH 30% residual) is methodologically sound\n\
    - D-study projections with bootstrap CIs ([420, 680] for MMLU) provide genuine\
    \ uncertainty quantification on a policy-relevant number\n- Fine-tuning extension\
    \ adds conceptual value by demonstrating the inverted variance hierarchy\n- Statistical\
    \ toolkit is appropriate: REML, bootstrap, Kruskal-Wallis, permutation tests\n\
    \n**Major weaknesses:**\n1. **Model pooled rather than treated as a crossed random\
    \ facet.** In G-theory, model (the object of measurement) should be treated as\
    \ a facet. By pooling, model×item interactions get absorbed into the item_id component,\
    \ inflating the headline 43% figure. The Gemma-2 sensitivity analysis (removing\
    \ it raises pooled item_id to 46%) hints at this, but a proper model-as-facet\
    \ analysis would separate model×item interaction and likely reduce item_id's share.\
    \ This is a fundamental design choice that weakens the central claim.\n2. **Bootstrap\
    \ CIs reported only for item_id in Table 1 ([38%, 48%]).** All other variance\
    \ components in all tables lack uncertainty intervals. For a paper whose core\
    \ claim rests on the relative magnitude of variance components, this is a serious\
    \ gap — particularly for the separability claim (is 0.3% direct Infra×Method significantly\
    \ different from 0?).\n3. **Arbitrary separability threshold.** The 1% threshold\
    \ for \"approximate separability\" is not derived from G-theory or psychometric\
    \ literature. The observed value (0.3–0.5%) lands comfortably below this threshold,\
    \ but no sensitivity analysis examines what changes at 0.25% or 2%. A bootstrap\
    \ CI on total direct interaction would be more informative than a pass/fail test.\n\
    4. **D-study extrapolation beyond item universe.** MATH has 500 total items; the\
    \ D-study recommends 950 items for G≥0.90. The paper notes this makes reliable\
    \ evaluation \"effectively unattainable,\" which is fair, but the D-study formula\
    \ assumes sampling from an infinite item universe. When the recommendation exceeds\
    \ the actual item pool, the projection's validity breaks down — this limitation\
    \ is acknowledged but under-discussed.\n\n**Moderate weaknesses:**\n- Only 2 GPU\
    \ types with partial crossing (2/4 models fully crossed on hardware); 1 df for\
    \ hardware main effect makes the separability test directional at best\n- Temperature\
    \ levels differ across experiments (3 levels in Exp 1, 2 in Exp 2) without clear\
    \ justification\n- All 3-way and higher interactions absorbed into residual (14.2–21%\
    \ depending on experiment) without discussion of which higher-order terms might\
    \ be substantively meaningful\n- Binary accuracy metric on MC tasks inflates item\
    \ variance (items near 0 or 1 contribute little variation); log-likelihood or\
    \ calibration-based metrics could yield different decompositions\n- Fine-tuning\
    \ experiment uses only 2 precisions and 3 GPUs but claims to test separability\
    \ generalization — this is a weaker test than the inference experiments\n\n###\
    \ R2 — Novelty and Related Work (Score: 3/6, Weak Reject)\n\n**Strengths:**\n\
    - The benchmark-dependent variance gradient (item_id declining from 45% on HellaSwag\
    \ to 22% on MATH, with temperature×item and seed×item rising correspondingly)\
    \ is a genuine quantitative contribution — it quantifies an intuition the field\
    \ has had but never measured systematically\n- The two-level separability decomposition\
    \ (aggregate <1% vs. item-conditional 14–18%) is more informative than a binary\
    \ answer and the \"empirical license with caveats\" framing is mature\n- D-study\
    \ budgets with cross-benchmark variation (380 items for HellaSwag vs. 950 for\
    \ MATH) are immediately actionable for practitioners\n- The engine confound discovery\
    \ (enforce_eager fix) is a standalone methodological contribution\n- The fine-tuning\
    \ contrast (LR+seed dominate, explaining the \"5 seeds\" convention) adds structural\
    \ insight\n\n**Major weaknesses:**\n1. **Incremental novelty over Mesting (2026).**\
    \ The core methodological contribution is extending Mesting's G-theory framework\
    \ by adding infrastructure facets. But these infrastructure facets contribute\
    \ negligibly (hardware 1.2%, precision 0.8%, direct Infra×Method 0.3–0.5%). The\
    \ paper's most impactful findings — item dominance, benchmark-dependent variance\
    \ gradient, D-study budgets — would emerge from a Mesting-style design with fixed\
    \ infrastructure. The \"first fully-crossed\" claim is technically true but the\
    \ marginal value of crossing infrastructure with methodology is a confirmatory\
    \ null result, not a breakthrough. The paper needs to reframe: the infrastructure\
    \ extension is valuable as a confirmatory finding; the actual novelty is in the\
    \ cross-benchmark gradient, D-study budgets, and confound fix.\n2. **Severely\
    \ deficient bibliography.** Only 9 references for a 13-page top-venue submission.\
    \ Critical omissions include:\n   - **Bouthillier et al. (2021, JMLR), \"Accounting\
    \ for Variance in Machine Learning Benchmarks\"** — the closest ML-native predecessor,\
    \ decomposing variance via ANOVA across hyperparameters, data splits, and seeds.\
    \ Not citing it inflates the paper's apparent novelty.\n   - **IRT-based item\
    \ analysis in NLP:** Lalor et al. (2019, NAACL), Rodriguez et al. (2021, ACL),\
    \ Vania et al. (2021) — directly relevant to the item dominance finding. The paper\
    \ claims item selection is under-studied, but IRT has been analyzing item-level\
    \ properties for years.\n   - **Benchmark subsampling literature:** Polo et al.\
    \ (2024, \"tinyBenchmarks\"), HELM-Lite, Perlitz et al. (2023) address the same\
    \ practical question (how many items suffice?) from different angles. The D-study\
    \ budgets should be contextualized against these.\n   - **Henderson et al. (2018),\
    \ \"Deep Reinforcement Learning that Matters\"** — pioneering work on variance\
    \ in ML evaluation.\n   - **Shavelson & Webb (1991)** and full Brennan (2001)\
    \ textbook — canonical G-theory references that a G-theory paper must cite.\n\
    \   - **Lu et al. (2022)** — ordering effects in MC evaluation, relevant to the\
    \ ordering facet.\n3. **Item dominance is partially tautological.** Any assessment\
    \ instrument with a wide difficulty range will show item variance as the dominant\
    \ source — this is a well-known property in psychometrics (Brennan, 2001, Ch.\
    \ 3). The paper's framing (\"researchers are optimizing the wrong knobs\") oversells\
    \ a finding that is expected from measurement theory. The contribution is in quantifying\
    \ the magnitude and its benchmark-dependence, but the paper should acknowledge:\
    \ \"Item dominance is expected from measurement theory; what we contribute is\
    \ its precise magnitude, systematic variation with task reasoning demands, and\
    \ D-study implications.\"\n\n**Moderate weaknesses:**\n- Fine-tuning extension\
    \ uses RoBERTa-large (355M, encoder-only, classification) — architecturally distant\
    \ from the 7–14B decoder-only models in inference experiments. Fine-tuning a decoder\
    \ model (e.g., Llama-8B with LoRA on a generation task) would make cross-paradigm\
    \ generalization claims far more credible.\n- The \"fully crossed\" claim is overstated:\
    \ only MMLU Exp 1 has the richest factorial design. Other benchmarks use reduced\
    \ designs (2 precisions, 2 temperatures). Hardware crossing is partial (2/4 models).\
    \ Cross-benchmark separability claims rest on narrower evidence than the framing\
    \ suggests.\n- No figures at all — highly unusual for a top venue paper. D-study\
    \ projection curves, stacked-bar variance decompositions, and the benchmark gradient\
    \ would dramatically improve communication. The paper's 15 tables contain rich\
    \ data that is hard to absorb in tabular form.\n\n---\n\n## 3. Roundtable: Cross-Sharing\
    \ and Convergence\n\n### Areas of Agreement (both reviewers)\n1. **Model-as-facet\
    \ treatment is the most fundamental methodological concern.** R1 identified it\
    \ as a G-theory design flaw; R2 flagged it as inflating the headline item_id number.\
    \ Both agree that a proper model-as-facet analysis would likely reduce item_id\
    \ below 43% and reveal model×item interaction as a substantial component. This\
    \ directly affects Claim 1.\n2. **The separability threshold is arbitrary and\
    \ the test under-powered.** Both reviewers independently flagged the 1% threshold\
    \ as unjustified and the hardware crossing as insufficient (2 GPU types, partial).\
    \ The separability claim is directional evidence, not proof.\n3. **D-study budgets\
    \ are the most actionable contribution.** Both reviewers rate the concrete, benchmark-specific\
    \ reproducibility budgets as filling a genuine practical gap. The bootstrap CIs\
    \ on MMLU items ([420, 680]) demonstrate honest uncertainty quantification (though\
    \ CIs are needed for other benchmarks too).\n4. **The cross-benchmark variance\
    \ gradient is a genuine empirical contribution.** Both agree the systematic relationship\
    \ between task reasoning demands and variance structure (item dominance weakening,\
    \ temperature/seed interactions strengthening) is informative and well-supported\
    \ by data across 5 benchmarks.\n5. **The bibliography is far below top-venue standards.**\
    \ R2 provided detailed missing references; R1 implicitly relied on broader knowledge\
    \ that confirms these gaps.\n\n### Areas of Divergence\n- **Severity of novelty\
    \ concern:** R2 weights the incremental novelty over Mesting more heavily (infrastructure\
    \ extension is a near-null result) → 3/6. R1 is more willing to credit the experimental\
    \ scale and scope → 4/6.\n- **Statistical vs. conceptual critique:** R1 focuses\
    \ on the technical execution (CI coverage, REML specification, residual interpretation).\
    \ R2 focuses on positioning and framing (overselling item dominance, missing related\
    \ work, tautological aspects).\n- **Fine-tuning extension value:** R1 accepts\
    \ it as an interesting conceptual addition. R2 considers the architectural mismatch\
    \ (RoBERTa vs. decoder-only) a moderate weakness that undermines cross-paradigm\
    \ claims.\n\n### Convergence\nAfter cross-sharing, both reviewers converge on:\
    \ the paper presents a substantial empirical effort with real practical value,\
    \ but the current version has (a) a fundamental G-theory design issue (model treatment),\
    \ (b) severely inadequate related work, (c) framing that oversells the infrastructure\
    \ contribution and item dominance finding, and (d) missing uncertainty quantification\
    \ across most results. These issues are addressable without new experiments but\
    \ require significant revision.\n\n---\n\n## 4. Consolidated Assessment\n\n###\
    \ Overall Score: 4/6 (Borderline Reject)\n### Confidence: High\n\n### Recommendation:\
    \ Borderline Reject\n\n### Verdict Summary\n\nThe paper tackles an important problem\
    \ — understanding and quantifying variance sources in LLM evaluation — with impressive\
    \ experimental scale (1M+ records, 8 experiments, 5 benchmarks, 6 models). The\
    \ cross-benchmark variance gradient and task-specific D-study budgets are genuine\
    \ contributions that would be useful to the community. The engine confound discovery\
    \ (enforce_eager fix) is a practical contribution in its own right.\n\nHowever,\
    \ the paper falls short of the acceptance threshold for three main reasons:\n\n\
    1. **Methodological concern:** Model is pooled rather than treated as a G-theory\
    \ facet, inflating the central item_id claim. For a paper whose entire framework\
    \ is G-theory, this is a fundamental design choice that needs addressing.\n\n\
    2. **Novelty and positioning:** The infrastructure extension — the claimed methodological\
    \ advance over Mesting (2026) — yields near-null results (<1% variance). The paper's\
    \ actual novelty (cross-benchmark gradient, D-study budgets, confound fix) does\
    \ not depend on the infrastructure extension and needs honest reframing. The bibliography\
    \ (9 references) is far below top-venue standards with critical omissions (Bouthillier\
    \ et al., IRT literature, benchmark subsampling work).\n\n3. **Presentation:**\
    \ 15 tables, 0 figures. Key uncertainty quantification (CIs) is reported for only\
    \ one component in one table. The separability threshold is arbitrary. These are\
    \ fixable but collectively reduce confidence in the claims.\n\n### Actionable\
    \ Revisions (no new experiments needed)\n\n1. **Re-analyze with model as a crossed\
    \ facet** — report model×item interaction separately; adjust item_id shares and\
    \ D-study projections accordingly.\n2. **Add CIs to all variance component tables**\
    \ — especially for the direct Infra×Method interaction term.\n3. **Expand bibliography\
    \ to ≥25 references** — must include Bouthillier et al. (2021), IRT item analysis\
    \ papers, tinyBenchmarks/HELM-Lite, Henderson et al. (2018), Shavelson & Webb\
    \ (1991).\n4. **Add 3–4 figures** — D-study curves, stacked-bar variance decomposition\
    \ across benchmarks, benchmark gradient visualization.\n5. **Reframe contributions\
    \ honestly** — infrastructure separability as confirmatory null; item dominance\
    \ as expected from measurement theory but newly quantified; cross-benchmark gradient\
    \ as the primary novel finding.\n6. **Derive or justify the separability threshold**\
    \ — or replace with bootstrap CI on total direct interaction.\n7. **Acknowledge\
    \ item dominance tautology** — wide difficulty range → large item variance is\
    \ psychometrically expected; the contribution is in quantifying its magnitude\
    \ and benchmark-dependence.\n\n### Strengths Worth Preserving\n- The experimental\
    \ scale and systematic confound control are genuinely impressive\n- The cross-benchmark\
    \ variance gradient (MMLU→ARC→GSM8K→MATH) is a clean, well-supported finding\n\
    - D-study budgets (380–950 items, 3–5× items-over-prompts ratio) fill a real practical\
    \ gap\n- The fine-tuning contrast (inverted hierarchy) explains divergent reproducibility\
    \ conventions\n- The conditional separability insight (aggregate-level separability\
    \ vs. item-level interactions) is nuanced and useful\n\n---\n\n## 5. Scores\n\n\
    | Criterion | R1 | R2 | Consolidated |\n|-----------|----|----|-------------|\n\
    | Soundness | 4 | 4 | 4 |\n| Novelty | 4 | 3 | 3 |\n| Significance | 5 | 4 | 4\
    \ |\n| Clarity | 3 | 3 | 3 |\n| **Overall** | **4** | **3** | **4** |\n\n**Overall:\
    \ 4/6 — Borderline Reject.** Substantial empirical work with genuine practical\
    \ value, but fundamental G-theory design issue, insufficient positioning against\
    \ related work, and presentation gaps place it below the acceptance threshold.\
    \ Addressable with revision; no new experiments required.\n"

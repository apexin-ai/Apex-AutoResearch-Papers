    # Dream Review Report


    **Paper:** Reproducibility Budgets for LLM Evaluation: Testing the Separability
    Assumption Between Infrastructure and Methodological Variance Sources via Generalizability
    Theory


    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Review Standard:** Top ML venue, ~25% acceptance rate, 6-point scale


    ---


    ## Reviewer Scores


    | Reviewer | Focus | Initial Score | Post-Discussion |

    |----------|-------|--------------|-----------------|

    | R1 | Methods + Experiments | 4/6 (Weak Accept) | 4/6 (Weak Accept) |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 3/6 (Weak Reject) |

    | **Consensus** | | | **3.5/6 (Borderline)** |


    ---


    ## Paper Summary


    The paper conducts a fully-crossed Generalizability Theory (G-theory) study unifying
    infrastructure (hardware, precision) × methodology (prompt, seed, temperature,
    ordering) × measurement (test items) factors in LLM evaluation. Across 6 models
    (7–14B), 5 benchmarks, and 2M+ records, the authors report: (1) item selection
    dominates variance (42–58%), (2) infrastructure–methodology separability holds
    at aggregate (<0.5%) but is item-conditional (14.2%), and (3) current practices
    yield G < 0.40 while D-study budgets show items are 10× more cost-effective than
    prompts for reliability. A fine-tuning extension with RoBERTa-large shows item
    dominance generalizes to training.


    ---


    ## Consolidated Strengths


    **S1. Ambitious experimental scale and systematic design.**

    Seven experiments totaling 2M+ evaluation records, building from single-benchmark
    to cross-benchmark, cross-model, cross-hardware, and cross-paradigm coverage.
    All 8 planned experiments are reflected in the paper. This is a serious empirical
    effort.


    **S2. Engine confound discovery is a genuine methodological contribution.**

    The finding that vLLM routes FP32 through a different compute path (non-V0 engine),
    inflating precision variance from 0.3% to 0.87% (main) and from 1.8% to 7.24%
    (interaction) with an 8.5pp accuracy gap, is independently valuable. It serves
    as a concrete cautionary tale for any study comparing precision modes and demonstrates
    how infrastructure configuration can systematically bias variance attribution.


    **S3. Nuanced two-level separability result.**

    Rather than a simple binary answer, the separability test yields complementary
    findings: aggregate separability holds (<0.5% direct interactions), licensing
    isolated-factor studies, while item-conditional interactions (14.2%) warn that
    such conclusions are contingent on item selection. This is more informative than
    either finding alone.


    **S4. D-study budgets are actionable.**

    The budget tables (Table 7, Table 8) provide concrete, immediately usable guidance:
    600 items + 3 prompts + 2 seeds → G ≥ 0.90 for MMLU. The 10:1 marginal effectiveness
    ratio (items vs. prompts) is a memorable, practical takeaway. Cross-benchmark
    budget differences (550–1100 items) provide task-specific guidance.


    **S5. Cross-benchmark difficulty gradient.**

    The systematic relationship between task difficulty and variance structure (item_id
    decreases 58.4% → 42.1%, residual increases 16.8% → 24.8%, temp×item increases
    5.8% → 10.4% as accuracy drops) quantifies why reasoning benchmarks are less reproducible.
    This is a genuinely useful empirical finding.


    ---


    ## Consolidated Weaknesses


    **W1. Incremental over Mesting et al. (2026) — the core methodological contribution
    is an extension, not a new framework.** [Both reviewers, R2 primary]

    Mesting et al. (2026) already applied G-theory to LLM evaluation with item, prompt,
    judge, and temperature facets, finding judge dominance at 43.8%. This paper extends
    that framework by adding infrastructure facets (hardware, precision). However,
    these infrastructure facets turn out to contribute negligibly: hardware main effect
    0.6%, precision main effect 0.3%. The extension is real but modest in substance
    — the paper''s most important finding (item dominance) could plausibly have emerged
    from a Mesting-style design without the infrastructure layer. The "first fully-crossed"
    framing oversells what is fundamentally an incremental extension.


    **W2. "Fully crossed" design is overstated.** [R1 primary]

    The paper claims a fully-crossed design but the factorial structure is unbalanced:

    - MMLU has the richest design (3 precisions, 3 temperatures, 4 orderings, 2 GPUs)

    - Other benchmarks use reduced designs (2 precisions, 2 temperatures)

    - Hardware crossing is only on MMLU (Exp. 3)

    - 14B extension uses a reduced facet set

    - Fine-tuning uses a completely different model/task family

    Claims about cross-benchmark separability and scale invariance rest on narrower
    evidence than the "fully crossed" framing implies. The paper should clearly delineate
    which claims are supported by full crossing and which by partial designs.


    **W3. Pooled-model analysis likely inflates item_id variance.** [R1 primary]

    The primary analysis pools 4 models, treating them as exchangeable observations.
    But model × item interactions (some items are harder for Mistral than Qwen3) get
    absorbed into the item_id component, inflating its apparent dominance. The per-model
    analysis (Table 2) partially addresses this (item_id range 54.7–62.0%), but should
    be the primary presentation. The pooled analysis overstates the universality of
    the 58.4% figure.


    **W4. Item dominance is partially predictable from first principles.** [R2 primary]

    Any assessment with a steep difficulty gradient (items ranging from trivial to
    expert) will show item difficulty as the dominant variance source. The paper''s
    own Discussion explains exactly why this must be so. While quantifying the magnitude
    is useful, framing it as surprising ("researchers are optimizing the wrong knobs")
    oversells the finding. A more measured framing — "item dominance is expected but
    its magnitude (>50%) and the relative inefficiency of other interventions have
    not been quantified" — would be more appropriate.


    **W5. Separability threshold (0.5%) is arbitrary and the result is borderline.**
    [R1 primary, R2 concurs]

    The 0.5% threshold for "separability" is not justified from G-theory, psychometrics,
    or any principled argument. The observed value (0.5%) lands exactly on the threshold
    boundary, making the binary "separability holds" conclusion fragile. A bootstrap
    confidence interval on the total direct interaction variance would be more informative.
    The result should be presented as a continuous measure with uncertainty rather
    than a pass/fail test.


    **W6. D-study projections lack uncertainty quantification.** [R1 primary]

    The budget recommendations (e.g., "600 items + 3 prompts + 2 seeds → G ≥ 0.90")
    are point estimates derived from estimated variance components. No confidence
    intervals or sensitivity analysis is provided for the projected G values. Given
    that the input variance components have SEs of 0.1–2.1%, the projected G values
    could shift meaningfully. The paper should propagate estimation uncertainty through
    the D-study projections (e.g., via bootstrap).


    **W7. Very sparse reference list (only 7 references).** [R2 primary, R1 concurs]

    For a top ML venue, 7 references is far below expectations. Critical omissions
    include:

    - Classical G-theory: Brennan (2001) "Generalizability Theory," Shavelson & Webb
    (1991) — foundational references for G-theory methodology

    - ML variance decomposition: Bouthillier et al. (2021) "Accounting for Variance
    in Machine Learning Benchmarks" — the closest ML-native predecessor, not cited

    - IRT in NLP: Lalor et al. (2019), Rodriguez et al. (2021), Vania et al. (2021)
    — item-level analysis frameworks directly relevant to the item dominance finding

    - Ordering effects: Lu et al. (2022) — relevant to the ordering facet

    - ML reproducibility: Henderson et al. (2018), Pineau et al. (2021) — broader
    context

    This is not a minor issue: the missing references include direct methodological
    predecessors and would substantially change the novelty positioning.


    **W8. Fine-tuning generalization is weak.** [Both reviewers]

    The claim that "findings extend to fine-tuning settings" is based solely on RoBERTa-large
    (355M, encoder-only) on 4 NLU classification tasks. This is a large architectural
    and paradigm gap from the 7–14B decoder models used in inference experiments.
    Fine-tuning a 7B+ decoder model with LoRA/QLoRA on a generation task would be
    far more convincing as a generalization argument. As presented, this is a separate
    (interesting) finding rather than evidence of generalization.


    ---


    ## Questions for Authors


    **Q1.** How would the variance decomposition change if model were treated as a
    random facet rather than pooling? Specifically, would model × item interactions
    reduce the item_id share substantially?


    **Q2.** Can you provide a direct numerical comparison with Mesting et al. (2026)
    on overlapping facets (item, prompt, temperature)? This would clarify the incremental
    contribution.


    **Q3.** Would item dominance survive adding judge/scorer as a facet? Mesting found
    judge at 43.8% — this could substantially alter the variance hierarchy. The paper
    uses fixed generation-based scoring, which removes this source but also limits
    comparability.


    **Q4.** Can you provide bootstrap confidence intervals for the D-study G projections?
    The headline recommendation (600/3/2 → G = 0.90) would be more credible with uncertainty
    bounds.


    **Q5.** What is the justification for the 0.5% separability threshold? Would results
    change with 1% or 0.25%?


    **Q6.** The MATH entry in Table 8 shows 1,100 items with "66× cost factor" but
    1100 × 3 prompts × 2 seeds = 6,600 evaluations, not 13,200. Is this a typo, or
    does MATH require more prompts/seeds?


    **Q7.** How were the 6 prompt templates selected? Were they designed to maximize
    diversity, or sampled from existing evaluation suites? The prompt × item interaction
    (6.1%) depends critically on prompt diversity.


    ---


    ## Minor Issues


    **M1.** Table 3 column headers are misaligned in the PDF — "item_id %" appears
    to span the wrong column.


    **M2.** The ThinkingMachines (2025) reference has placeholder arXiv ID "2501.xxxxx"
    — needs the real ID.


    **M3.** The abstract says "6 models" but the paper primarily analyzes 4 models
    with 2 as extension. Should be clearer about primary vs. extension.


    **M4.** The paper claims "over 2 million evaluation records" — the sum of stated
    record counts (1,036,800 + 3×230,400 + 691,200 + 2×172,800 + 1,728 + 230,400 +
    172,800) ≈ 3.17M. The "over 2 million" is an undercount of the actual total. Clarify.


    **M5.** "LayerCast" is not a standard term — should be cited or defined more precisely.


    **M6.** The D-study discussion mentions G ≥ 0.80 as the psychometric minimum but
    doesn''t cite the source for this threshold (Nunnally & Bernstein 1994 or similar).


    ---


    ## Experiment Coverage Assessment


    All 8 planned experiments from the design document are reflected in the paper:

    - ✅ exp-001: Full-scale precision study (MMLU)

    - ✅ exp-002: Multi-benchmark replication (GSM8K, ARC, HellaSwag)

    - ✅ exp-003: Multi-hardware G-study

    - ✅ exp-004: D-study projections

    - ✅ exp-005: 14B model extension

    - ✅ exp-006: Fine-tuning G-study

    - ✅ exp-007: LayerCast precision study

    - ✅ exp-008: MATH benchmark extension


    Coverage is complete. However, several figures described in the experiment plan
    (stacked-bar decompositions, heatmaps, scatter plots, D-study projection curves,
    iso-G contour plots) are absent from the paper. The paper is table-heavy with
    no figures, which significantly weakens communication of key results — particularly
    the D-study projection curves (planned Fig 8–10) and the variance decomposition
    comparisons (planned Fig 1, 4, 15) which would be far more effective visually
    than as tables.


    ---


    ## Recommendation


    **Consensus Score: 3.5/6 (Borderline — between Weak Reject and Weak Accept)**


    **For acceptance, the paper would need:**

    1. Reframe novelty claims to acknowledge extension-of-Mesting positioning honestly

    2. Add per-model analysis as primary, pooled as secondary

    3. Add uncertainty quantification to D-study projections

    4. Substantially expand the reference list (add ≥15 missing key references)

    5. Justify or remove the 0.5% separability threshold

    6. Add figures — at minimum D-study projection curves and variance decomposition
    stacked bars


    **The paper''s core strengths** — the engine confound discovery, the nuanced separability
    result, the cross-benchmark difficulty gradient, and the actionable D-study budgets
    — represent genuine value. But the incremental positioning over Mesting et al.,
    inflated novelty claims, methodological concerns (pooled analysis, arbitrary threshold,
    no uncertainty propagation), and severely sparse references pull it below the
    acceptance threshold in its current form.


    **If revised to address the top 4 weaknesses**, this could become a solid Weak
    Accept (4/6). The empirical effort is substantial and the practical recommendations
    fill a real need. The revisions are achievable without new experiments.

    '

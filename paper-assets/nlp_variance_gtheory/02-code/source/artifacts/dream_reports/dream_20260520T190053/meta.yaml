  review_report: "---\ndream_id: dream_20260520T190053\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-20T19:51:49.188124+00:00\n---\n\n# Dream Review\
    \ Report — Full Roundtable\n\n**Paper**: \"No Universal Reproducibility Recipe:\
    \ Variance Attribution in LLM Evaluation Is Benchmark-Conditional and Model-Conditional\"\
    \n\n**Review mode**: full | **Reviewers**: R1 (Methods+Experiments), R2 (Novelty+Related\
    \ Work)\n\n---\n\n## Step 1: Independent Reviews\n\n### Reviewer 1 — Methods &\
    \ Experiments\n\n**Summary**: The paper applies G-theory to decompose LLM evaluation\
    \ variance across 4 models, 5 benchmarks, and 172,800+ inference conditions plus\
    \ a fine-tuning G-study. The experimental scale is ambitious and the float32 confound\
    \ discovery is a genuine contribution. However, critical methodological gaps—residual\
    \ dominance, missing uncertainty quantification, and a blocked hardware experiment—undermine\
    \ the strength of the claims.\n\n**Strengths**:\n1. **Large-scale factorial design**:\
    \ 4 models × 5 benchmarks with multiple crossed facets represents the most comprehensive\
    \ G-theory study in LLM evaluation to date. The 172,800 MMLU records provide genuine\
    \ statistical power.\n2. **Float32 confound discovery**: The identification of\
    \ vLLM V1/V0 backend routing as a confound that inflated item variance from 24%\
    \ to 58% is a standalone methodological contribution. The fix (enforce_eager=True\
    \ on V0) is immediately actionable.\n3. **Honest reporting of failures**: The\
    \ paper transparently reports the blocked hardware experiment (exp-003), partial\
    \ 14B results, and the confound discovery that invalidated the original hypothesis.\
    \ This intellectual honesty is commendable.\n4. **Fine-tuning G-study is genuinely\
    \ novel**: No prior work has applied G-theory to decompose fine-tuning variance.\
    \ The finding that learning rate dominates (17.8%) with a 10% lr×seed interaction,\
    \ and inference-training decorrelation (r=0.15), are new and useful.\n5. **D-study\
    \ projections are practically useful**: Showing that optimal allocations diverge\
    \ qualitatively across benchmarks (MMLU: more items; GSM8K: more seeds) is actionable\
    \ advice.\n\n**Weaknesses**:\n1. **Residual dominance is the paper's Achilles\
    \ heel** (Tables 1, 3, 5). Residual is the largest component on ALL benchmarks\
    \ (20–40%). Combined with the opaque \"all other\" category (26.5% in Table 1),\
    \ over 54% of MMLU variance is unexplained or aggregated. For a paper whose contribution\
    \ is variance *attribution*, having the majority of variance *unattributed* is\
    \ a serious problem. The paper does not adequately discuss what these missing\
    \ sources might be, nor does it attempt higher-order interaction estimation to\
    \ decompose the residual.\n2. **No confidence intervals or uncertainty quantification**.\
    \ Variance component estimates are reported as point estimates without bootstrap\
    \ CIs, jackknife intervals, or any measure of estimation uncertainty. G-theory\
    \ provides standard methods for this (Brennan 2001, Ch. 8). Without CIs, we cannot\
    \ assess whether the differences between benchmarks or models are statistically\
    \ meaningful or within estimation noise. For example, is item_id=24% on MMLU vs\
    \ 22% on ARC a real difference or sampling variability?\n3. **Single GPU architecture\
    \ severely limits \"infrastructure\" claims**. Experiment 3 (multi-hardware) was\
    \ blocked. The paper's title and framing reference \"infrastructure\" factors,\
    \ but only numerical precision on one GPU type was tested. The finding that \"\
    direct infrastructure×methodology interaction < 0.5%\" (Table 4) applies only\
    \ to precision, not hardware broadly. This should be reflected in the title/abstract.\n\
    4. **Model is not treated as a G-theory facet**. The per-model decompositions\
    \ (Table 1) show item_id ranging from 13.8% (Mistral) to 30.2% (Gemma), suggesting\
    \ strong model×item interaction. But model is analyzed as a stratification variable,\
    \ not a facet in the G-study design. A model-as-facet reanalysis of the existing\
    \ MMLU data (no new experiments needed) would properly attribute this variance\
    \ and likely reduce the residual.\n5. **Fine-tuning G-study uses RoBERTa-large**\
    \ — an encoder-only model from 2019 — on classification tasks. The relevance to\
    \ modern LLM fine-tuning (decoder-only models, generation tasks, RLHF/DPO) is\
    \ questionable. The paper acknowledges this in Limitations but the mismatch weakens\
    \ the \"fine-tuning contribution\" claim substantially.\n6. **200 items per benchmark**:\
    \ While adequate for point estimation, the paper does not report sensitivity analyses\
    \ (e.g., split-half reliability of the variance decomposition, or bootstrap resampling\
    \ of items) to establish stability. Different 200-item samples from the same benchmark\
    \ could yield different decompositions, especially for benchmarks with heterogeneous\
    \ item pools.\n7. **REML vs actual estimation method**: The paper states \"Variance\
    \ components are estimated via Restricted Maximum Likelihood (REML)\" (Section\
    \ 3.1) but does not describe the actual implementation. If Henderson Method I\
    \ (ANOVA-based) was used instead, this is a methodological misrepresentation that\
    \ matters when variance components are near zero (negative estimates under Henderson\
    \ are truncated differently than under REML).\n\n**Questions for Authors**:\n\
    1. Can you provide bootstrap CIs (e.g., 1000 resamples of items) for the variance\
    \ components in Tables 1 and 3? This would address whether cross-benchmark differences\
    \ are real.\n2. What happens if model is included as a random facet in the MMLU\
    \ G-study rather than stratified out? How much of \"all other\" and \"residual\"\
    \ is actually model×item interaction?\n3. What specific variance estimation method\
    \ was implemented? REML, Henderson I, or Henderson III?\n4. Have you examined\
    \ three-way interactions (e.g., model×prompt×item) that might explain the large\
    \ residual?\n\n**Score**: 3/6 (Weak Reject)\n**Confidence**: 4/5\n\n---\n\n###\
    \ Reviewer 2 — Novelty & Related Work\n\n**Summary**: The paper extends Mesting\
    \ [2026]'s single-benchmark G-theory study to multiple benchmarks and adds a fine-tuning\
    \ G-study. The central contribution is a negative result (no universal variance\
    \ structure), which is valid but incrementally novel. The related work section\
    \ is severely underdeveloped with only 7 references, missing critical prior work\
    \ on ML reproducibility, IRT-based item analysis, and benchmark efficiency.\n\n\
    **Strengths**:\n1. **Cross-benchmark variance gradient is a genuine empirical\
    \ contribution**. Showing that variance structure systematically shifts from item-conditional\
    \ (MMLU) to seed/temperature-conditional (GSM8K/MATH) as benchmarks move from\
    \ knowledge retrieval to chain-of-thought reasoning is new and interpretable.\n\
    2. **D-study allocation divergence has immediate practical value**. The finding\
    \ that MMLU needs 500 items × 2 prompts × 1 seed while GSM8K needs 250 items ×\
    \ 4 prompts × 4 seeds (Table 7) is directly actionable for benchmark designers.\n\
    3. **The confound discovery is a standalone contribution** regardless of the paper's\
    \ other claims. Documenting that vLLM V0/V1 routing inflates variance estimates\
    \ warns the community about similar artifacts.\n4. **Inference–training decorrelation\
    \ (r=0.15)** is a novel finding that challenges the assumption that inference-time\
    \ reproducibility insights transfer to training-time settings.\n\n**Weaknesses**:\n\
    1. **Incremental novelty over Mesting [2026]**. The paper's claimed advance over\
    \ Mesting is (a) adding precision as an infrastructure facet and (b) crossing\
    \ benchmarks. But precision turns out to be a near-null factor (<1.5% main effect\
    \ post-fix), so the infrastructure extension yields almost nothing. The paper's\
    \ strongest findings (benchmark-conditional variance, D-study divergence) would\
    \ largely emerge from a Mesting-style design without infrastructure crossing.\n\
    2. **Severely inadequate bibliography**. 7 references for a top-venue submission\
    \ is far below standards. Critical omissions include:\n   - **Bouthillier et al.\
    \ (2021, JMLR)**: \"Accounting for Variance in Machine Learning Benchmarks\" —\
    \ directly relevant, uses variance decomposition in ML evaluation.\n   - **Dodge\
    \ et al. (2020, EMNLP)**: Fine-tuning instability — essential context for the\
    \ fine-tuning G-study.\n   - **Sellam et al. (2022)**: MultiBERTs — multi-seed\
    \ BERT training, directly relevant to seed variance.\n   - **Dehghani et al. (2021)**:\
    \ \"The Benchmark Lottery\" — benchmark selection effects.\n   - **Polo et al.\
    \ (2024)**: tinyBenchmarks — item subsampling for efficient evaluation, directly\
    \ relevant to item variance.\n   - **Rodriguez et al. (2021)**: IRT-based evaluation\
    \ for NLP — alternative item-level analysis framework.\n   - **Shavelson & Webb\
    \ (1991)**: Foundational G-theory reference beyond Brennan (2001).\n   - **Henderson\
    \ et al. (2018)**: Deep RL reproducibility — established the multi-factor variance\
    \ decomposition paradigm in ML.\n   - **Biderman et al. (2024)**: Lessons from\
    \ evaluation reproducibility.\n   - Any ordering effects literature (the paper\
    \ includes ordering as a facet but cites no prior work on option ordering effects).\n\
    3. **\"Diagnostic tool\" contribution is unsubstantiated**. The paper claims G-theory\
    \ as a \"practical diagnostic tool\" but releases no software, no analysis pipeline,\
    \ no reusable framework. The \"tool\" is just applying G-theory, which Mesting\
    \ [2026] already demonstrated. GeneralizIT and similar R packages already exist.\
    \ Without a released tool, this contribution claim is empty.\n4. **The negative\
    \ result framing needs more work**. \"No universal recipe\" is the central claim,\
    \ but many practitioners already assume this. The paper confirms a suspicion with\
    \ data but doesn't offer constructive solutions beyond \"diagnose your pipeline\"\
    \ — which requires the very G-theory study the paper just demonstrated is expensive\
    \ (172,800 conditions for one benchmark). Is the recommendation scalable?\n5.\
    \ **Zero figures is unusual and harmful**. For a paper about variance decomposition\
    \ across benchmarks, visual comparisons (stacked bars, heatmaps, radar charts)\
    \ would dramatically improve readability. The reliance on 11 tables makes the\
    \ paper harder to parse and less compelling than it could be.\n6. **\"Fully crossed\"\
    \ is overstated**. Only Experiment 1 (MMLU) uses the full crossing (3 precisions\
    \ × 6 prompts × 6 seeds × 3 temps × 4 orderings). Experiments 2 and the MATH extension\
    \ use a reduced crossing (2 precisions × 2 temps). This is fine practically but\
    \ should not be described as a \"fully-crossed design spanning 5 benchmarks\"\
    \ in the abstract.\n7. **Item dominance on knowledge benchmarks is partially expected\
    \ from measurement theory**. Items in MMLU span from trivially easy to near-impossible\
    \ across 57 subjects. A large item variance component is expected given this difficulty\
    \ range. The paper would benefit from contextualizing this against IRT-based item\
    \ analysis.\n\n**Questions for Authors**:\n1. How does this work relate to Bouthillier\
    \ et al. (2021), which also decomposed variance in ML benchmarks?\n2. Is the recommendation\
    \ to run a full G-study per benchmark practical? What is the computational cost,\
    \ and is there a lightweight diagnostic alternative?\n3. Why were no figures included?\
    \ The knowledge-reasoning gradient would be far more compelling as a visualization.\n\
    4. Can you release the analysis code alongside the data to substantiate the \"\
    diagnostic tool\" claim?\n\n**Score**: 3/6 (Weak Reject)\n**Confidence**: 4/5\n\
    \n---\n\n## Step 2: Cross-Sharing\n\n**R1 → R2**: The methodological concerns\
    \ (54% unexplained variance, no CIs, model not as facet) mean the \"no universal\
    \ recipe\" finding may partly reflect an underspecified decomposition model rather\
    \ than a genuine property of evaluation variance. If the residual were decomposed\
    \ further (e.g., via three-way interactions or model-as-facet), the cross-benchmark\
    \ differences might narrow or change qualitatively.\n\n**R2 → R1**: The thin related\
    \ work compounds the experimental concerns. Without positioning against Bouthillier\
    \ et al., tinyBenchmarks, or IRT-based approaches, it's unclear whether G-theory\
    \ adds diagnostic power beyond existing methods. The fine-tuning contribution\
    \ is further weakened because Dodge et al. (2020) already documented seed sensitivity\
    \ in fine-tuning — the G-theory framing is new but the phenomenon is not.\n\n\
    ---\n\n## Step 3: Convergence\n\n**Points of agreement**:\n- The paper addresses\
    \ an important problem (evaluation reproducibility diagnosis)\n- The float32 confound\
    \ discovery is a genuine, standalone contribution\n- The cross-benchmark variance\
    \ gradient is an interesting empirical finding\n- Residual dominance (largest\
    \ component everywhere) is the most serious methodological concern\n- Missing\
    \ statistical uncertainty quantification (no CIs) is a critical gap\n- Single\
    \ GPU limits infrastructure claims; the title/abstract overclaim relative to what\
    \ was tested\n- Related work is severely underdeveloped (7 references)\n- Zero\
    \ figures hurts presentation significantly\n- Fine-tuning G-study is novel in\
    \ framing but limited by RoBERTa on classification tasks\n- The \"diagnostic tool\"\
    \ contribution is claimed but not delivered (no released software)\n\n**Points\
    \ of mild disagreement**:\n- R1 is slightly more positive about the experimental\
    \ scale and sees the multi-benchmark extension as substantive; R2 views it as\
    \ more incremental over Mesting\n- R2 emphasizes the bibliography gap more; R1\
    \ emphasizes the statistical rigor gap more\n\n**Converged assessment**: Both\
    \ reviewers agree the paper falls below the acceptance threshold for a top ML\
    \ venue in its current form, despite addressing a real problem with interesting\
    \ findings. The gap between claims and delivered evidence is too large.\n\n---\n\
    \n## Step 4: Consolidated Assessment\n\n### Overall Score: 3/6 — Weak Reject\n\
    \n### Headline Assessment\nAn ambitious and honest study that surfaces interesting\
    \ empirical patterns (benchmark-conditional variance, float32 confound, inference-training\
    \ decorrelation), but falls short of top-venue standards due to (1) the majority\
    \ of variance remaining unattributed, (2) no uncertainty quantification on variance\
    \ estimates, (3) severely thin related work, and (4) overclaiming relative to\
    \ what was tested (single GPU ≠ \"infrastructure\").\n\n### What Would Change\
    \ Our Minds (Revision Guidance)\n\n**Essential (any two would likely move to borderline)**:\n\
    1. **Bootstrap CIs on all variance components** (Tables 1, 3, 5, 9). This is feasible\
    \ with existing data and would establish whether cross-benchmark differences are\
    \ statistically meaningful.\n2. **Model-as-facet reanalysis** of MMLU data to\
    \ properly attribute model×item interaction and reduce the opaque residual/all-other\
    \ categories. No new experiments needed.\n3. **Expand bibliography to ≥25 references**,\
    \ including Bouthillier et al. (2021), Dodge et al. (2020), Sellam et al. (2022),\
    \ Polo et al. (2024), Rodriguez et al. (2021), Shavelson & Webb (1991), Henderson\
    \ et al. (2018), and ordering effects literature. Position contributions clearly\
    \ against each.\n4. **Add 3-4 figures**: at minimum a stacked bar comparison across\
    \ benchmarks, and a D-study projection curve. The paper is currently 11 tables\
    \ and 0 figures.\n\n**Important (would strengthen but not alone sufficient)**:\n\
    5. Downscope \"infrastructure\" claims to \"numerical precision\" throughout,\
    \ including title consideration.\n6. Release analysis code (not just data) to\
    \ substantiate the \"diagnostic tool\" contribution.\n7. Discuss what the large\
    \ residual might contain and whether higher-order interactions or additional facets\
    \ (e.g., batch size, system prompt) could reduce it.\n8. Clarify the exact variance\
    \ estimation method (REML vs Henderson) and justify the choice.\n\n**Desirable\
    \ (for camera-ready)**:\n9. Fine-tuning extension to at least one decoder-only\
    \ model on a generation task.\n10. Sensitivity analysis: split-half reliability\
    \ of variance decompositions across different 200-item samples.\n\n### Contribution\
    \ Ranking\n1. **Float32 confound discovery** — strongest, standalone, immediately\
    \ actionable ★★★★\n2. **Cross-benchmark variance gradient** — interesting empirical\
    \ finding, needs CIs ★★★\n3. **D-study allocation divergence** — practically useful,\
    \ well-presented ★★★\n4. **Inference-training decorrelation** — novel but limited\
    \ by RoBERTa scope ★★☆\n5. **G-theory as diagnostic tool** — claimed but not delivered\
    \ (no software) ★★\n6. **\"No universal recipe\" as central thesis** — valid but\
    \ not constructive enough ★★\n\n### Experiment Coverage Assessment\nThe paper\
    \ covers 7 of 8 planned experiments (exp-003 blocked, acknowledged). Coverage\
    \ is thorough. The main gap is not missing experiments but missing *analyses*\
    \ on existing data (CIs, model-as-facet, higher-order interactions).\n\n### Venue\
    \ Fit\nThe paper fits an evaluation/benchmarking track (e.g., NeurIPS Datasets\
    \ & Benchmarks, COLM, or an EMNLP evaluation workshop). For a main-track top venue,\
    \ the negative-result framing needs a stronger constructive component (released\
    \ tool, lightweight diagnostic protocol, or a concrete evaluation standard proposal).\n"

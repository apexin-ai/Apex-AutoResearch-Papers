focus: 'Key questions: (1) Is the "item dominance" finding (58.4%) novel enough for
  AAAI, or will reviewers dismiss it as obvious? (2) Does the separability result
  (direct infra×method <0.5%) constitute a strong enough contribution, or is it a
  null result? (3) Is the D-study reproducibility budget framing compelling for the
  venue? (4) float32 engine confound — does it undermine credibility? (5) With only
  1 GPU type in hand (second pending), is the hardware crossing claim defensible?'

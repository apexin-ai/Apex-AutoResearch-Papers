      200+ tokens）意味着seed和temperature的随机性被200+ 次multiplicative放大。因此seed:item（12%）和temperature:item（15%）极高，
      temperature main effect达10%（在其他benchmark上<2%），因为temperature 直接控制采样diversity，在长chain中的累积效应是非线性的。item_id仅10%——
      比GSM8K更低——因为MATH problems的难度更多由解题路径的存在性决定，而非 item本身的知识内容，solution path的发现受seed/temperature强烈影响。
      residual高达40%是worst档中最高的，反映了MATH推理过程中大量不可归因的 随机性（错误的推理链、self-correction失败、格式解析错误等）。G=0.30是
      所有benchmark中最低的，G≥0.90需要2200 items，完全不切实际（MATH全集仅 5000题）。这个结果是"no universal
      recipe"论点的最强证据——如果连G≥0.90 的item threshold在不同benchmark间差3-4倍，prescriptive budget毫无意义。

      '

    ft_seed_x_lr_mnli: 25.8
    ft_seed_x_lr_rte: 26.4
    ft_seed_x_lr_copa: 29.2
    key_finding: 'Variance hierarchy qualitatively differs: fine-tuning is seed×lr-dominated;
      inference is item-dominated'
  result_rationale: 'Fine-tuning与inference方差结构的质变解释：

    inference中方差来源仅限于evaluation-time因素——模型参数固定，变异只来自 "如何问"(prompt, ordering)和"问什么"(item)，因此item_id主导(60%+)。

    fine-tuning引入training-time方差源，彻底改变了方差层级： (1) seed×lr=28.4%成为最大来源：random seed决定参数初始化和dropout
    mask， learning rate决定优化轨迹的aggressive程度。seed和lr的交互极强因为： 不同初始化在不同lr下可能converge到loss
    landscape的不同local minima， 产生的decision boundary在specific items上有系统性差异。 高lr+某些seed组合可能skip过optimal
    basin导致特定item类型的性能退化。

    (2) item_id降至31.7%：fine-tuned RoBERTa在SST-2/MNLI上accuracy>90%， 大多数items被所有模型变体正确分类——item间difficulty差异被compression到
    narrow range(90-99% correct)。相比inference时60-80%的accuracy范围， fine-tuning后item间variance空间更小，因此item_id的相对占比下降。
    SST-2的item_id最低(24.8%)因为task最简单(accuracy~94%)，items间差异最小。 RTE的item_id最高(38.2%)因为task最难(accuracy~72%)，items间差异更大。

    (3) data_shuffle×item=12.3%：training examples的呈现顺序影响哪些patterns 被"最后学到"(recency
    effect)。由于catastrophic forgetting，后见examples的 patterns被更好地记住——不同shuffle导致不同items受益或受损，产生item-conditional效应。

    (4) GPU×precision=0.4%：与inference结论一致——硬件因素在fine-tuning中同样可忽略。 training过程中的gradient
    accumulation引入了额外的数值非确定性(cuDNN autotuning, nondeterministic reduction)，但binary
    scoring下这些差异仍不足以翻转大多数items。

    inference vs fine-tuning的对比是一个独立发现：同一个evaluation framework(G-theory) 揭示了两种根本不同的方差regime——inference是"measurement-dominated"(item_id主导)，
    fine-tuning是"training-dominated"(seed×lr主导)。这意味着reproducibility recipes 必须区分这两种使用场景。

    '

    hellaswag_single_model_G: 0.548
    hellaswag_d_study_items_G80: 550
    arc_single_model_item_id_pct: 42.1
    arc_prompt_x_item_pct: 7.3
    arc_seed_x_item_pct: 5.8
    arc_temp_x_item_pct: 6.5
    arc_model_pct: 9.8
    arc_residual_pct: 20.5
    arc_cross_model_item_id_pct: 27.4
    arc_model_x_item_pct: 22.7
    arc_cross_model_G: 0.052
    arc_single_model_G: 0.495
    arc_d_study_items_G80: 650
    gsm8k_single_model_item_id_pct: 28.3
    gsm8k_prompt_x_item_pct: 11.8
    gsm8k_seed_x_item_pct: 8.2
    gsm8k_temp_x_item_pct: 9.4
    gsm8k_model_pct: 12.4
    gsm8k_residual_pct: 18.2
    gsm8k_cross_model_item_id_pct: 16.5
    gsm8k_model_x_item_pct: 23.5
    gsm8k_cross_model_G: 0.041
    gsm8k_single_model_G: 0.385
    gsm8k_d_study_items_G80: 900
    gradient_item_id_MMLU: 60.4
    gradient_item_id_HellaSwag: 50.4
    gradient_item_id_ARC: 42.1
    gradient_item_id_GSM8K: 28.3
    gradient_spread_pp: 32.1
    gradient_rank_correlation: 1.0
    model_x_item_range: 21.3-24.1% across all benchmarks
    cross_model_G_range: 0.041-0.065 across all benchmarks
    separability_binary_all_lt_0_5pct: true
  result_rationale: '跨benchmark梯度单调递减的逐级机制解释：

    MMLU(知识检索, item_id=60.4%): 题目考察封闭式事实(如"RNA聚合酶的功能")。 item difficulty取决于知识点的稀有程度和训练数据覆盖，这对同一模型的不同
    prompt/seed/temperature非常稳定——模型要么在训练语料中见过这个fact，要么没有。 改变prompt措辞("Answer the following"→"Select
    the correct option")不会让模型 突然"知道"之前不知道的知识。temperature的影响也小——T=0.0和T=0.3下， 知识检索的top
    token概率通常>0.9，sampling几乎不改变结果。因此item_id占主导60%+。

    HellaSwag(常识推理, item_id=50.4%, ↓10pp): 题目要求基于日常场景选择合理的continuation。 item difficulty仍有较强结构(某些场景本质上更容易判断，如"厨师拿起刀→开始切菜"
    vs 模糊场景)，但prompt措辞开始影响模型对场景的"理解角度"——不同prompt可能 引导模型关注不同的context cue，导致prompt×item从MMLU的3.2%升至5.4%。
    temperature的影响也增大(5.2% vs 2.1%)因为常识推理的答案概率分布更平坦(top token 概率~0.6-0.8)，sampling噪声有更大机会翻转结果。

    ARC-Challenge(科学推理, item_id=42.1%, ↓8pp): 题目需要多步科学推理 (如"如果地球轴倾斜增大，对季节有什么影响→更极端")。推理路径的选择更依赖
    prompt引导——few-shot示例的推理风格会bias模型的reasoning approach， prompt×item升至7.3%。seed×item=5.8%反映了多步推理中采样分支点的影响。
    model间的科学推理能力差异更显著(model=9.8% vs MMLU 8.3%)—— 有些模型(Qwen3)在STEM训练上投入更多，而有些(Mistral)偏向语言任务。

    GSM8K(数学推理, item_id=28.3%, ↓14pp): 多步算术(平均4-6步)使每一步成为随机分支点。 temperature直接控制chain-of-thought的随机性(temp×item=9.4%,
    MMLU的4.5倍)—— T=0.7时同一题可能生成完全不同的解题路径，有的正确有的错误。 prompt格式影响极大(prompt×item=11.8%)：few-shot示例中的解题格式
    ("Let''s think step by step" vs "Solution:" vs 无CoT)直接决定模型是否使用 chain-of-thought，对不同难度的item影响截然不同——简单加减题不需要CoT也能对，
    但复杂分数题没有CoT就会失败。seed×item=8.2%因为多步生成过程中的 cumulative sampling variance在长输出中被放大。

    model×item在所有benchmark维持20-24%的原因：不同模型的训练数据和架构差异 导致model-specific的知识和能力profile——Qwen3可能在数学上强但常识弱，
    Gemma可能科学推理强但数学弱。这种model-specific的item ranking在所有task type上 都产生显著交互，而且不随benchmark类型系统性变化——它是模型多样性的反映而非
    task type的函数。

    D-study预算梯度(MMLU 480→GSM8K 900 items)的解释： 推理型benchmark的非item方差(prompt×item + temp×item
    + seed×item)合计 从MMLU的~9%增至GSM8K的~29%。要在这些额外噪声源存在的情况下仍达到G≥0.80， 需要更多items来提高signal-to-noise
    ratio。GSM8K需要近2倍于MMLU的items， 揭示"推理型benchmark的可复现性成本远高于知识型"——这是一个有直接实践意义的发现。

    '

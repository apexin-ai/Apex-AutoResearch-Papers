- name: Item resampling stability test
  plan_id: exp-001b
  description: '3组独立分层200-item MMLU样本(seeds 0,7,99) × Llama × 3 prec × 3 prompts ×
    3 seeds × 2 orderings = 54 conditions/sample × 200 items = 10,800 records/sample。验证item
    dominance非抽样伪影。

    '
  expected_results:
    total_records: 32400
    records_per_sample: 10800
    conditions_per_sample: 54
    item_id_sample_seed0: 57.8
    item_id_sample_seed7: 62.5
    item_id_sample_seed99: 60.1
    item_id_mean: 60.13
    item_id_sd: 2.37
    resampling_item_id_cv: 0.039
    G_sample_seed0: 0.594
    G_sample_seed7: 0.631
    G_sample_seed99: 0.612
    G_mean: 0.612
    G_cv: 0.03
    variance_rank_order_preserved: true
    prompt_x_item_cv: 0.061
    seed_x_item_cv: 0.073
    residual_cv: 0.044
  result_rationale: 'CV=0.039(远低于15%阈值)的原因：MMLU分层抽样确保每组200 items按学科比例分配 (STEM/humanities/social/other各~50题)。item
    dominance主要源于两层异质性： (1)学科间——STEM题目系统性更难(平均accuracy ~55%)vs social science(~78%)，
    这个学科间差异在任何分层样本中都被保留； (2)学科内——同一学科的知识点覆盖面广(abstract_algebra vs high_school_math)，
    不同知识点的难度差异在充分大的样本(200题)中被稳定采样。

    样本间波动(57.8%-62.5%)的来源：seed7恰好抽到了更多高区分度items (如advanced mathematics中的证明题和abstract
    algebra)，这些items的accuracy 跨条件变异更大，推高item_id。seed0抽到的items difficulty分布更均匀(中等难度居多)，
    item间差异较小，item_id略低。但这5pp的波动相对于60%的基线是trivial的。

    G系数的CV(0.030)甚至低于item_id的CV，因为G是item_id的归一化函数—— 分子(signal=item variance)和分母(total
    variance)同方向波动，比值更稳定。

    所有variance sources的rank order在3组间完全一致 (item_id>>residual>prompt×item≈seed×item>其他)，
    证明方差结构是MMLU的内在属性而非特定200-item样本的伪影。

    '
  tables:
  - title: 'Table 4: Resampling stability — variance decomposition across 3 item draws'
    structure: Rows=item_id, prompt×item, seed×item, prec×item, residual, other; Columns=Sample
      A(s0), B(s7), C(s99), Mean, SD, CV
    highlight: 'item_id: 57.8/62.5/60.1, CV=0.039; rank order identical across all
      3 samples'
  figures_description:
  - 'Supplementary: Three stacked bars (one per sample), nearly identical structure.
    Bootstrap 95% CIs shown as whiskers, overlapping across all samples. Dashed horizontal
    line at sample mean for item_id.

    '
  analysis: '(1) 用3个不同random seeds对MMLU 14K items进行分层抽样(按57个subject等比例)； (2) 每组200
    items × 54 conditions运行完整G-study； (3) 计算每个variance component的cross-sample CV和rank
    order一致性； (4) Friedman检验确认rank order无显著差异(p>0.10)。

    '
- name: Multi-benchmark cross-task replication
  plan_id: exp-002
  description: '4 models × 2 precisions (BF16/FP16; Gemma用BF16/FP32) × 6 prompts ×
    6 seeds × 2 temperatures × 4 orderings × 200 items on GSM8K, ARC-Challenge, HellaSwag.
    核心实验：建立跨benchmark方差梯度。

    '
  expected_results:
    total_records: 1382400
    records_per_benchmark: 460800
    hellaswag_single_model_item_id_pct: 50.4
    hellaswag_prompt_x_item_pct: 5.4
    hellaswag_seed_x_item_pct: 4.9
    hellaswag_temp_x_item_pct: 5.2

- name: MATH benchmark — reasoning-heavy extension
  plan_id: exp-008
  description: 'MATH 200 items × 4 models × 2 prec × 6 prompts × 6 seeds × 2 temps
    × 4 orderings. 测试chain-of-thought密集型任务的方差结构，扩展梯度至第5个benchmark。

    '
  expected_results:
    total_records: 460800
    single_model_item_id_pct: 22.1
    prompt_x_item_pct: 13.5
    seed_x_item_pct: 9.8
    temp_x_item_pct: 14.2
    precision_x_item_pct: 1.8
    residual_pct: 24.6
    other_and_small_interactions_pct: 14.0
    single_model_G: 0.328
    cross_model_model_x_item_pct: 24.8
    cross_model_G: 0.035
    d_study_items_G80: 1150
    extended_gradient_MMLU: 60.4
    extended_gradient_HellaSwag: 50.4
    extended_gradient_ARC: 42.1
    extended_gradient_GSM8K: 28.3
    extended_gradient_MATH: 22.1
    extended_spread_pp: 38.3
    extended_rank_correlation: 1.0
  result_rationale: 'MATH的item_id(22.1%)为全部benchmark最低的逐步解释：

    MATH题目需要多步数学证明和推导(平均5-10步reasoning)，每一步都是一个 stochastic branching point——在T>0时，模型在每步可能选择不同的推理策略
    (代数法 vs 几何法 vs 构造法)，而策略选择对不同item的影响截然不同。 这使得temperature×item=14.2%——MMLU(2.1%)的近7倍。物理机制：
    MATH的chain-of-thought输出平均200-400 tokens，而MMLU只需选一个字母。 长输出中的sampling variance随token数累积(每个token的采样噪声叠加)，
    使temperature的影响被系统性放大。

    prompt×item=13.5%(MMLU的4.2倍)：MATH的few-shot exemplars不仅展示 答案格式，更展示"如何推理"。选择代数解法的exemplars会bias模型用代数思路，
    选择图形推理的exemplars会bias模型画辅助线——不同推理策略在不同items上 效果差异巨大(代数法在方程题上强但在几何题上弱)，产生强prompt×item交互。

    seed×item=9.8%反映了dropout和weight initialization在推理任务上的放大效应： 多步推理中，早期步骤的微小概率差异通过后续步骤被级联放大(error
    propagation)。

    residual=24.6%高于其他benchmark因为MATH的chain-of-thought引入了大量 不可归因的随机变异——即使控制了所有设计facet，同一(model,
    precision, prompt, seed, temperature, ordering)条件下的重复运行也因autoregressive sampling的
    inherent stochasticity产生不同推理路径和不同结果。

    G=0.328极低：当前200-item设计完全不可靠用于MATH评估。 D-study需要1150 items(MMLU的2.4倍)才达G≥0.80——这是chain-of-thought
    引入的"推理方差代价"，对MATH/GPQA等reasoning benchmark有直接的实践意义。

    model×item=24.8%(4模型)——4个benchmark中最高：不同模型的数学能力profile 差异极大(Qwen3可能擅长代数但弱于几何，Gemma反之)，导致model-specific的
    item ranking在MATH上分歧最大。

    5-benchmark梯度完美保持单调(rank corr=1.0)，spread扩至38.3pp(仍在[25,40]内)， 进一步强化核心叙事：方差结构沿knowledge→commonsense→science→arithmetic→proof
    的认知复杂度轴系统性变化。

    '

  result_rationale: 'LayerCast将precision方差降低65%的机制：LayerCast的混合精度(FP16存储+FP32计算) 在计算阶段维持了与纯FP32接近的数值精度，同时享受FP16的显存优势。
    precision方差主要来自bf16/fp16/fp32之间的数值差异——LayerCast消除了 "存储精度=计算精度"的耦合，使其accuracy(70.9%)位于bf16(71.1%)和fp32(60.4%)
    之间但非常接近bf16，表明FP32计算成功恢复了大部分精度。

    precision×item从2.8%→1.0%的原因：没有LayerCast时，~15个"边界items" (output logit差值<0.01)在不同precision下被翻转。LayerCast的FP32计算
    使这些边界items的logit更精确，约10个不再翻转——但仍有~5个items因为 FP16权重的微小量化误差(mantissa截断)而保持翻转，贡献了剩余的1.0%。

    G从0.618→0.641提升仅0.023因为precision×item只占总方差的2.8%—— 消除大部分precision噪声只减少了分母中一个小组分，对G的提升有限。
    这证实precision是一个real但不dominant的方差来源——值得mitigate但不是 提高reproducibility的primary lever(那是增加items)。

    '

tier: best
narrative_guidance: '4-model交叉分析完全验证2-model趋势：model×item=24.1%维持为第二大方差来源（MMLU）， 跨模型G=0.065，D-study证明即使10模型G仅0.179——model×item是不可约的结构性障碍。
  跨benchmark梯度完美单调：MMLU(60.4%)→HellaSwag(50.4%)→ARC-C(42.1%)→GSM8K(28.3%)， 秩相关=1.0，spread=32.1pp。"方差结构本身是benchmark-conditional的"叙事完全成立。
  Claim 1升级为"model-conditional item dominance is a fundamental, benchmark-modulated
  barrier"。 Claim 2经多硬件确认separability（hardware×methodology=0.18%<0.5%）。 Claim 3的D-study预算表跨4benchmark揭示推理型benchmark可复现性成本为知识型的1.9倍
  （GSM8K 900 items vs MMLU 480 items）。IRT vs G-theory 4.4×差距作为独立贡献。 全部9项MD防御通过。P0五实验全部按时完成。投稿AAAI，目标7.0+/10。

  '

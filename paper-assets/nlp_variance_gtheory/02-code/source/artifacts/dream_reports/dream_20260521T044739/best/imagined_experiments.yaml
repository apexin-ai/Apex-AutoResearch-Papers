- name: Multi-hardware separability G-study
  plan_id: exp-003
  description: '4 models × 2 GPU types × 2 precisions (BF16, FP16/FP32) × 6 prompts
    × 6 seeds × 3 temperatures × 4 orderings × 200 MMLU items. Claim 2核心实验： 测试hardware×methodology交互，证明基础设施和方法论因素可分离。

    '
  expected_results:
    total_records_analyzed: 1382400
    new_records_gpu2: 691200
    gpu_types:
    - RTX PRO 6000 (Blackwell)
    - TBD second GPU
    gpu_type_main_effect_pct: 0.12
    hardware_x_methodology_binary_pct: 0.18
    hardware_x_prompt_pct: 0.05
    hardware_x_seed_pct: 0.02
    hardware_x_temperature_binary_pct: 0.04
    hardware_x_ordering_pct: 0.07
    hardware_x_item_pct: 1.2
    precision_x_hardware_pct: 0.35
    hardware_x_temperature_text_pct: 0.83
    separability_confirmed_binary: true
    item_id_with_hardware: 59.8
    variance_structure_consistent_with_exp001: true
  result_rationale: 'hardware×methodology=0.18%(binary)的物理解释：两种GPU微架构(如Blackwell vs
    Ampere) 的浮点运算单元实现不同——Tensor Core的矩阵乘法顺序、warp-level reduction的 累加顺序都不同。但在BF16/FP16下，这些数值差异只影响最后1-2
    bits of mantissa。 对于binary scoring，一个item的正确/错误判定取决于top token概率是否最高—— 只有当两个选项的概率差<0.001时，GPU差异才可能翻转结果。这种"边界item"在200题中
    约3-5题，且它们与prompt/seed的交互在统计上不可与noise区分，因此 hardware×prompt和hardware×seed都<0.1%。

    hardware×item=1.2%高于hardware×methodology的原因：这1.2%来自那些确实被 GPU差异翻转的边界items——它们的翻转是item-specific的(取决于item的概率分布形状)，
    而非methodology-specific的。这是item-conditional的hardware效应， 不违反separability——separability关注的是hardware是否调节methodology的效应，
    而hardware×item只说明hardware的效应是item-dependent的(符合预期)。

    text_exact_match下hardware×temperature=0.83%：文本精确匹配对生成过程中的 任何微小概率差异都敏感(不同token选择→不同字符串→match失败)。
    temperature放大了GPU数值差异的影响——T=0.7时sampling distribution更平坦， GPU间mantissa差异更有可能改变sampled
    token。但0.83%仍<1%， 与Messina & Scotta (2026)的FP非结合性理论预测量级一致。

    整体方差结构与exp-001一致(item_id=59.8% vs 60.4%)， hardware facet仅"吸收"了0.6pp的原属residual的方差，
    证明单GPU实验的结论不因hardware选择而改变。

    '
  tables:

- name: Multi-hardware G-study
  plan_id: exp-003
  description: 4 models × 2 GPU types × 2 precisions × 6 prompts × 6 seeds × 3 temperatures
    × 4 orderings × 200 MMLU items。Hardware×methodology interaction核心测试。

- name: Item resampling stability test (paper centerpiece)
  plan_id: exp-001b
  description: 3组独立stratified MMLU 200-item samples（seeds 0, 7, 99）× Llama-3.1-8B
    × 3 precisions × 3 prompts × 3 seeds × 2 orderings = 54 conditions/sample。测试item
    dominance的抽样稳定性。
  expected_results:
    item_variance_sample_seed0: 0.48
    item_variance_sample_seed7: 0.25
    item_variance_sample_seed99: 0.41
    item_variance_mean: 0.38
    item_variance_sd: 0.12
    item_resample_cv: 0.33
    residual_sample_seed0: 0.16
    residual_sample_seed7: 0.3
    residual_sample_seed99: 0.19
    g_coefficient_sample_seed0: 0.28
    g_coefficient_sample_seed7: 0.38
    g_coefficient_sample_seed99: 0.31
    g_coefficient_cv: 0.16
    variance_component_rank_order_stable: false
    rank_inversions_across_samples: 3
    bootstrap_ci_item_id_width: 0.21
    bootstrap_ci_item_id_lower: 0.27
    bootstrap_ci_item_id_upper: 0.48
    conditions_per_sample: 54
    total_records_per_sample: 10800
  result_rationale: '三组不同的200-item stratified samples产出质性不同的方差分解。CV=33%意味着item dominance
    point estimate在25-48%间波动。

    Sample seed 7抽到更多中等难度items（difficulty集中在0.4-0.6），这些items的model responses跨conditions更一致，item_id仅25%；sample
    seed 0抽到更多极难和极易items（bimodal difficulty），这些items天然有高item-level variance，推高item_id至48%。MMLU的57个subjects有非常不同的difficulty
    distributions——STEM subjects（abstract algebra, college physics）bimodal，humanities
    subjects更uniform。200-item stratified sampling在subject层面balanced，但subject内部的item
    selection对方差结构有质性影响。

    更具破坏性的是：方差component的RANK ORDER在三组samples间不稳定。Sample 7中residual（30%）超过item_id（25%）成为最大成分，产生3次rank
    inversion。"Item selection is the largest variance source"取决于碰巧抽到了哪些items——不是stable
    empirical finding，而是sample-dependent measurement。

    Bootstrap CI=[0.27, 0.48]，width=0.21——足够宽以至于无法区分"item dominance"（>40%）和"item is
    one of several comparable sources"（~25%）。

    '

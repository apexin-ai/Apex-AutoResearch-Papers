    g_coefficient_arc: 0.35
    g_coefficient_hellaswag: 0.36
    benchmarks_with_item_as_largest: 3
    total_records_per_benchmark: 76800
  result_rationale: 'Cross-benchmark gradient不成立。GSM8K的item dominance（42%）反而高于MMLU（37.8%），颠覆"knowledge→reasoning
    item dominance递减"预测。原因：GSM8K的200-item sample中difficulty variance极大——从简单单步算术（accuracy>95%）到复杂多步word
    problems（accuracy<15%），这个bimodal difficulty distribution推高item_id。在8B-class models上，大量GSM8K
    items要么trivially easy要么完全超出能力，ceiling/floor效应增加item-level variance。

    HellaSwag item dominance最低（33%），不是因为"reasoning"（它是commonsense completion），而是其items的difficulty
    distribution更uniform（大多数items对8B models难度中等），减少了item-level variance。

    Spread=42%-33%=9pp，在[0,12]内。关键：ordering为GSM8K>MMLU>ARC>HellaSwag，不符合任何simple knowledge-reasoning
    axis。叠加exp-001b的resampling instability（CV>30%），9pp spread完全在noise range内。

    Separability在binary scoring下breaks on GSM8K（infra×method=4.5%）和HellaSwag（3.5%）。GSM8K因precision差异影响CoT中numerical
    computation；HellaSwag因completion scoring对token-level probability的precision敏感。

    '

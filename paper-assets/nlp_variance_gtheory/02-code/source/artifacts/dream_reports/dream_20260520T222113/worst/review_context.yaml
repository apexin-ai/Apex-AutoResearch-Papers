    bimodality_item_id_correlation: 0.95
  result_rationale: 'MATH item dominance=38%——与MMLU几乎identical，彻底否定gradient。原因：MATH的200-item
    sample包含高度bimodal difficulty（Level 1-2: accuracy>80%; Level 4-5: accuracy<10%），extreme
    bimodality推高item_id，counteracting CoT randomness的预期effect。

    关键insight：item dominance不是task type的function，而是item difficulty distribution shape的function。Bimodal
    distributions（无论来源——MMLU的subject heterogeneity还是MATH的difficulty levels）inflate
    item_id；unimodal distributions（HellaSwag）suppress它。5-benchmark ordering: GSM8K(42%)>MMLU=MATH(38%)>ARC(36%)>HellaSwag(33%)，spread=9pp，无systematic
    pattern。

    Bimodality index与item_id的correlation r=0.95是一个strong mechanistic finding——prior
    work未identify bimodality作为item variance contribution的predictor。这在worst档下是一个positive
    sub-finding。

    D-study G≥0.90需要520 items，与其他benchmarks（420-480）comparable，进一步支持convergence。


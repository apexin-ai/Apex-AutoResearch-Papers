- name: Multi-benchmark replication (no systematic gradient)
  plan_id: exp-002
  description: 4 models × 2 precisions × 6 prompts × 6 seeds × 2 temperatures × 4
    orderings on GSM8K/ARC-Challenge/HellaSwag各200 items。
  expected_results:

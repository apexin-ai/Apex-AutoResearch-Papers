narrative_guidance: '核心framing从"cross-benchmark variance gradient"转向"方差归因本身不可靠——variance
  decomposition is a measurement, not a fact"。

  exp-001b的item重采样不稳定性（CV=33%）成为paper centerpiece。三个Claims全部reframe：

  Claim 1 → "item dominance估计是sample-unstable的（CV>30%），单次方差分解——包括所有prior work——过度承诺归因确定性"

  Claim 2 → "model×item交互（33%）是最大的被忽视项；treating model as fixed系统性误归因方差到item_id；separability在binary
  scoring下也不完全成立"

  Claim 3 → "reproducibility budgets必须包含对budget本身的uncertainty quantification——当前D-study
  projections跨benchmark收敛（range仅60 items），消灭benchmark-specific budgets贡献，但CI宽度(±190
  items)说明budget本身需要error bars"

  Cross-benchmark gradient不成立（spread仅9pp，方向不符合knowledge→reasoning递减预测——GSM8K item_id=42%反而高于MMLU=38%）。

  新hook："We set out to build reproducibility budgets for LLM evaluation and discovered
  that the budget itself is unreliable."

  Timeline滑到ACL ARR October以容纳reframing和额外resampling实验。

  '

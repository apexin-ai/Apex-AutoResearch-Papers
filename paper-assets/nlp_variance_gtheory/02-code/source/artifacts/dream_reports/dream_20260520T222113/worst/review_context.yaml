  expected_results:
    item_variance_sst2: 0.14
    item_variance_mnli: 0.11
    item_variance_rte: 0.19
    item_variance_copa: 0.07
    learning_rate_main_avg: 0.168
    seed_main_avg: 0.09
    data_shuffle_main_avg: 0.058
    precision_main_avg: 0.021
    gpu_main_avg: 0.03

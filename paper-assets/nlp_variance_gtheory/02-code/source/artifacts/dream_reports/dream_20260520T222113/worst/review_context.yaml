    g_coefficient_copa: 0.32
    inference_training_correlation: 0.18
    cross_task_stable: false
    item_id_resampling_cv_finetuning: 0.28
  result_rationale: 'Fine-tuning方差结构与inference fundamentally不同——learning rate dominance（16.8%）取代item
    dominance。但worst档下fine-tuning也exhibit不稳定性：cross-task structure不consistent（SST-2
    item=14% vs COPA item=7%），item_id resampling CV=28%（低于inference的33%但仍substantial）。

    Learning rate dominance expected——不同lr通向不同loss landscape basins，每个basin对每个item有不同prediction。lr:seed=11%说明optimization
    landscape随机性irreducible。GPU main=3%是novel finding——fine-tuning中GPU difference通过gradient
    accumulation被amplified（thousands of steps中compound），比inference hardware effect更大。

    Inference-training correlation=0.18意味着inference-based reproducibility analysis不能generalize到training。但如果整个variance
    decomposition methodology的reliability已被质疑（exp-001b/004），fine-tuning results也受同样质疑——这是double-edged的。


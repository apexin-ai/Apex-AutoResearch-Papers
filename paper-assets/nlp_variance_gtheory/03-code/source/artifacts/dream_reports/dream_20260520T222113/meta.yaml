    result_rationale: 'The 2-cluster pattern emerges because variance structure tracks
      cognitive demand, not benchmark labels. Knowledge-retrieval benchmarks (MMLU,
      ARC) show high item dominance (50-52% basic) because item difficulty is the
      primary driver — items test factual knowledge that is either present or absent
      in the model, and this binary state dominates across conditions. ARC clusters
      with MMLU despite being labeled "science reasoning" because most ARC items are
      effectively factual recall (what happens when ice melts?) rather than multi-step
      inference. Reasoning benchmarks (GSM8K, HellaSwag) show lower item dominance
      (35-40%) because temperature and seed interact strongly with items: multi-step
      reasoning and commonsense inference have multiple valid processing paths, and
      sampling randomness determines which path is taken, shifting variance from item_id
      to interaction terms. GSM8K item dominance at 40% is above the hypothesized
      20-30% because even math reasoning has trivially easy items (single-step arithmetic)
      and impossible items (complex multi-step for 8B models), creating a floor of
      item-driven variance. The critical median-tier finding: GSM8K shows infra×method
      = 3.0% under binary scoring (precision×temperature 2.2% + precision×seed 0.5%
      + precision×prompt 0.3%). This breaks universal separability. The mechanism:
      math generation produces longer chains-of-thought where BF16 vs FP16 accumulation
      differences compound; temperature controls how aggressively alternative reasoning
      paths are explored; the precision×temperature combination can push probability
      distributions past decision boundaries, flipping the final numerical answer.
      Binary scoring captures this because the extracted number differs. Other benchmarks
      show infra×method <0.5% binary — the effect is GSM8K-specific. Under text-match,
      GSM8K prec×temp reaches 3.5% because exact-string comparison of multi-step outputs
      amplifies floating-point divergence. The gradient spread of 17pp (MMLU 52% vs
      HellaSwag 35%, basic) is within the target range [10-24pp]; after model-as-facet
      correction in exp-004 it will be similar (48% vs 31% = 17pp).


  review_report: "---\ndream_id: dream_20260520T222113\ntier: best\noverall_score:\
    \ weak accept\ntimestamp: 2026-05-20T23:39:21.110041+00:00\n---\n\n# Dream Review\
    \ Report — Consolidated Roundtable\n\n**Paper:** Reproducibility Budgets for LLM\
    \ Evaluation: A Generalizability Theory Analysis of Variance Sources Across Benchmarks,\
    \ Models, and Evaluation Metrics\n\n**Dream ID:** 20260520T222113  \n**Review\
    \ Mode:** Full (2 Reviewers, 4-Step Roundtable)\n\n---\n\n## Roundtable Process\n\
    \n- **R1 focus:** Methodology, experimental design, statistical rigor\n- **R2\
    \ focus:** Novelty, related work positioning, significance/impact\n- **Step 1\
    \ (Independent):** Both reviewers scored **4/6 (Weak Accept)**, high confidence.\n\
    - **Steps 2–3 (Cross-sharing & Convergence):** See §7 below.\n- **Step 4 (Synthesis):**\
    \ This report.\n\n---\n\n## 1. Paper Summary\n\nThe paper applies Generalizability\
    \ Theory (G-theory) to LLM evaluation in a multi-benchmark setting. Three facet\
    \ classes are crossed: measurement (item_id, 200 stratified-sampled items per\
    \ benchmark), methodology (prompt template ×6, random seed ×6, temperature ×2–3,\
    \ option ordering ×4), and infrastructure (numerical precision FP32/BF16/FP16/LayerCast,\
    \ GPU hardware ×2). Six models (4×7–9B, 2×14B) are evaluated on five benchmarks\
    \ (MMLU, ARC-Challenge, HellaSwag, GSM8K, MATH), totaling 4M+ evaluation records.\
    \ A fine-tuning G-study with RoBERTa-large on four NLU tasks adds cross-paradigm\
    \ evidence.\n\nThree claims:\n1. **Cross-benchmark variance gradient:** item_id\
    \ dominance is benchmark-conditional — 56% on MMLU down to 21% on MATH, a 35pp\
    \ monotonic gradient. CoT stochasticity shifts variance into temp×item and seed×item\
    \ on reasoning tasks.\n2. **Confirmatory separability null:** direct infra×methodology\
    \ interactions <0.3% under binary scoring on knowledge benchmarks, validating\
    \ isolated-factor studies at the aggregate level. Both factor types interact substantially\
    \ with items.\n3. **D-study protocol reversal:** optimal evaluation protocol reverses\
    \ across task types — MMLU is item-limited (420 items for G≥0.90), GSM8K is seed-limited\
    \ (10 seeds). Current practice G<0.25 everywhere.\n\n---\n\n## 2. Novelty Assessment\
    \ (R2-led, R1-endorsed)\n\n### Claim 1 (Cross-benchmark variance gradient): **Moderate-to-high\
    \ novelty.**\nThe paper's strongest contribution. No prior work has demonstrated\
    \ a systematic, monotonic shift in variance structure across multiple benchmarks\
    \ positioned along a reasoning-intensity continuum. The 35pp gradient (MMLU→MATH)\
    \ with the CoT stochasticity mechanism unifies apparently contradictory conclusions\
    \ from prior single-benchmark studies (Sclar on prompt sensitivity, Pezeshkpour\
    \ on ordering, Yuan on precision). The \"unifying explanation\" framing is well-executed.\
    \ However, item_id dominance per se is expected from measurement theory (Brennan\
    \ 2001); the contribution is the quantification and the gradient, not the dominance\
    \ finding itself.\n\n### Claim 2 (Confirmatory separability): **Low novelty, moderate\
    \ utility.**\nA confirmatory null. The infrastructure crossing — the paper's methodological\
    \ advance over Mesting (2026) — yields near-nothing (<0.3% direct interactions).\
    \ The nuanced decomposition into direct vs. item-conditional interactions (aggregate\
    \ separability + item-level coupling) adds value but is not a primary novelty\
    \ claim. R1 further notes that the separability claim is benchmark-conditional:\
    \ GSM8K and MATH show 2.5–3.0% infra×method, weakening the generality.\n\n###\
    \ Claim 3 (D-study protocol reversal): **Moderate novelty, high practical value.**\n\
    The facet effectiveness ratio inversion (MMLU items:seeds = 14.2:1, GSM8K = 0.8:1)\
    \ is non-obvious and actionable. The D-study projection grids are the most practically\
    \ useful output. The G<0.25 finding is an important indictment of current practice.\n\
    \n### Collective Assessment\nThe three claims are stronger together than individually.\
    \ The gradient explains the protocol reversal; the separability null validates\
    \ independent factor study. The paper is best understood as a large-scale empirical\
    \ study applying a well-established framework (G-theory) to a new domain (multi-benchmark\
    \ LLM evaluation) and discovering a systematic empirical regularity (the gradient).\
    \ This is a meaningful contribution, not a methodological breakthrough.\n\n###\
    \ Incrementality over Mesting (2026)\nClear advance in three dimensions: (a) five\
    \ benchmarks vs. one, (b) infrastructure crossing, (c) model as crossed facet.\
    \ The infrastructure crossing yields near-null results, so (b) is confirmatory.\
    \ The multi-benchmark gradient and model-as-facet analysis are genuine advances.\
    \ R2 notes that the complementarity with Mesting (who found judge identity dominant\
    \ at 43.8%) should be discussed more explicitly — this paper fixes the judge and\
    \ reveals the structure underneath.\n\n---\n\n## 3. Methodology Assessment (R1-led,\
    \ R2-endorsed)\n\n### 3.1 G-Theory Application\n**Largely correct.** Model-as-facet\
    \ (Section 7) properly separates model×item interaction (~10%) from item variance,\
    \ addressing a key prior concern. Henderson Method III with REML sensitivity check\
    \ is appropriate for the nearly-balanced crossed designs. Max divergence of ~1.4pp\
    \ with preserved rankings is reassuring.\n\n### 3.2 Critical Methodological Concerns\n\
    \n**(a) Binary data in G-theory (R1, Major).** Standard Henderson III / REML assume\
    \ continuous, approximately normal responses. Binary 0/1 data violates this. Item\
    \ variance is mechanically linked to item difficulty via the Bernoulli variance\
    \ function p(1-p), partially inflating item_id dominance. The logprob analysis\
    \ (Appendix B, item_id = 42.8%) on continuous data is methodologically cleaner\
    \ and partially mitigates this, but the primary analysis is on binary data. The\
    \ paper must discuss this limitation. A generalized G-theory approach (Brennan\
    \ 2001, Ch. 12) or link-function-based decomposition would be more appropriate.\n\
    \n**(b) Temperature and ordering as random facets (R1, Major).** With 2–3 temperature\
    \ levels (specific design points, not random draws) and 4 systematic orderings\
    \ (cyclic rotations of 24 possible permutations), the exchangeability assumption\
    \ required for random effects is questionable. Misspecification inflates variance\
    \ estimates for these facets and their interactions. The paper should either justify\
    \ the random-effects assumption, treat these as fixed, or present both as sensitivity\
    \ analysis.\n\n**(c) Asymmetric designs across benchmarks (R1, Moderate).** MMLU\
    \ uses 3 precisions × 3 temperatures; other benchmarks use 2×2. FP32 is absent\
    \ from non-MMLU experiments. The cross-benchmark precision gradient (MMLU 3.0%\
    \ → MATH 0.5%) is confounded with different precision levels tested. A BF16/FP16-only\
    \ MMLU reanalysis for cross-benchmark comparison is needed.\n\n**(d) Separability\
    \ claim overstated (R1, Moderate).** Abstract says \"<0.3% under binary scoring\"\
    \ but GSM8K reaches 3.0% and MATH 2.5%. A finding that holds on 3/5 benchmarks\
    \ is benchmark-conditional, not general. The abstract and conclusions should lead\
    \ with the conditionality.\n\n### 3.3 Experimental Design\n- **MMLU G-study (1,036,800\
    \ records):** Strong. V0 enforce_eager control is excellent experimental hygiene.\n\
    - **Cross-benchmark (1,382,400 records):** Adequate but reduced design; asymmetry\
    \ concern above.\n- **Multi-hardware (691,200 records):** Adequate; 2 GPU types\
    \ is the minimum, findings are directional.\n- **Item resampling stability (32,400\
    \ records):** Well-designed; CV=4.1% on item_id is reassuring.\n- **14B extension\
    \ (345,600 records):** Useful but underpowered (2 models, 1 df for model effects).\n\
    - **Fine-tuning (1,728 runs):** Adequate for its scope but architecturally distant\
    \ from the decoder inference setting. Best framed as preliminary evidence.\n\n\
    ### 3.4 Reproducibility Gaps\nR1 flags: vLLM version should include commit hash\
    \ (not just version number); model weight HuggingFace revision hashes needed;\
    \ exact CUDA/cuDNN/driver versions should be reported; prompt template text should\
    \ appear in an appendix; item sampling seeds should be released.\n\n---\n\n##\
    \ 4. Related Work Assessment (R2-led)\n\nThe bibliography has improved dramatically\
    \ from earlier drafts (7→22 references). Four Related Work paragraphs are well-organized.\
    \ Positioning against prior work is largely fair and accurate.\n\n### Missing\
    \ References (R2)\n1. **GeneralizIT (Nalisnick et al., 2024)** — G-theory software\
    \ for ML. Relevant to tooling discussion.\n2. **Kunievsky et al. (2025)** — prompt\
    \ sensitivity decomposition into intent/articulation/model uncertainty. Relevant\
    \ to interpreting prompt×item.\n3. **Brittlebench (2026)** — prompt brittleness\
    \ benchmark, ~50% prompt variance. Directly relevant.\n4. **Bui et al. (2025)**\
    \ — seed sensitivity in RoBERTa/Llama fine-tuning. Relevant to Section 8.2.\n\
    5. **ThinkingMachines (2025)** — batch invariance failure (80/1000 unique completions\
    \ at T=0). Explains why seed×item is non-zero even at T=0; relevant to the vLLM\
    \ batch nondeterminism concern.\n\n### Minor Positioning Issues\n- The claim that\
    \ prior ANOVA studies \"lack D-study machinery\" is technically true but slightly\
    \ misleading — bootstrap approaches can achieve similar projections; G-theory's\
    \ advantage is closed-form projection.\n- Vania et al. (2021) is in the bibliography\
    \ but not discussed in Related Work text.\n\n---\n\n## 5. Presentation Assessment\
    \ (Joint)\n\n### Strengths\n- Clean three-claim structure, well-supported throughout.\n\
    - \"Unifying explanation\" framing for the gradient is effective.\n- Balanced\
    \ Discussion with thorough Limitations paragraph.\n- Engine confound discovery\
    \ presented with appropriate before/after validation.\n- Honest framing of infrastructure\
    \ crossing as confirmatory.\n\n### Weaknesses\n- **Zero figures (R2, Major).**\
    \ This is a serious deficiency for a variance decomposition paper. Stacked-bar\
    \ charts are an expected field idiom (Mesting 2026). The cross-benchmark gradient,\
    \ D-study projections, and facet effectiveness inversion all cry out for visualization.\
    \ With 19 tables and 0 figures, the paper is dense and visually monotonous. This\
    \ is a competitive disadvantage at a top venue. Easily fixable.\n- **Title promises\
    \ \"Evaluation Metrics\" but delivers only binary scoring (R2, Moderate).** Logprob\
    \ analysis is a one-paragraph appendix. Either deliver the metric-conditional\
    \ analysis or adjust the title.\n- **Fine-tuning section feels bolted on (R2,\
    \ Moderate).** RoBERTa-large fine-tuning on SST-2/MNLI/RTE/COPA is architecturally\
    \ distant from 7–14B decoder inference. Cross-paradigm generalization is weak.\
    \ Should be explicitly qualified as preliminary.\n- **No cost analysis for recommended\
    \ budgets (R2, Minor).** The D-study recommends specific allocations but does\
    \ not estimate GPU-hour costs. Without cost, the budgets remain theoretical.\n\
    \n---\n\n## 6. Scope Assessment (Joint)\n\n### Adequate for claimed scope\n- 5\
    \ benchmarks spanning knowledge-to-reasoning: sufficient for the gradient claim.\
    \ Non-overlapping bootstrap CIs provide statistical support.\n- 4×7–9B models\
    \ showing consistent per-model patterns: gradient is not a single-model artifact.\n\
    - 14B extension within the 8B range: scale invariance holds at this increment.\n\
    \n### Limitations that should constrain claims\n- **No 70B+ models.** Larger models\
    \ may compress item_id through higher accuracy and reduce CoT stochasticity through\
    \ stronger reasoning. Generality claims should be scoped to 7–14B.\n- **No proprietary\
    \ API models.** GPT-4/Claude/Gemini have opaque infrastructure. Separability null\
    \ may not hold when infrastructure is uncontrolled. Mesting studied API models;\
    \ this paper studies open-weight models. Complementarity should be discussed.\n\
    - **No non-English benchmarks.** Tokenization effects on item difficulty could\
    \ alter cross-lingual variance structure.\n- **No generation-based benchmarks.**\
    \ All are multiple-choice or short-answer. Open-ended generation may have fundamentally\
    \ different variance structures.\n- **200-item samples.** Resampling stability\
    \ tested only for MMLU. Other benchmarks lack resampling validation.\n\n---\n\n\
    ## 7. Roundtable: Convergence and Divergence\n\n### Full Convergence (Both Reviewers)\n\
    1. **Score: 4/6 (Weak Accept).** At the acceptance threshold, contingent on addressable\
    \ revisions.\n2. **Cross-benchmark gradient is the paper's strongest, most novel\
    \ contribution.** Well-supported by data, non-overlapping CIs, per-model consistency.\n\
    3. **Separability null is confirmatory, not novel.** Honest framing is appreciated.\n\
    4. **D-study budgets are the most practically useful output.** Immediately actionable.\n\
    5. **Infrastructure crossing yields near-null results.** The claimed advance over\
    \ Mesting produces confirmatory rather than discovery findings.\n6. **Fine-tuning\
    \ extension is architecturally distant.** Should be qualified as preliminary.\n\
    7. **Zero figures is a serious presentation weakness.** Easily fixable; would\
    \ materially improve the paper.\n8. **Scope limited to 7–14B open-weight models.**\
    \ Claims should be scoped accordingly.\n9. **Engine confound discovery is a standalone\
    \ methodological contribution.** Valuable to the community.\n\n### Partial Convergence\n\
    10. **Separability conditionality (R1 raised, R2 endorsed after cross-sharing).**\
    \ The abstract's \"<0.3%\" is accurate for knowledge benchmarks but not for GSM8K/MATH.\
    \ Both reviewers agree the abstract should qualify this.\n11. **Missing references\
    \ (R2 raised, R1 endorsed).** Five missing references (GeneralizIT, Kunievsky,\
    \ Brittlebench, Bui, ThinkingMachines) are relevant and should be added.\n\n###\
    \ R1-Only Concerns (Not Contested by R2)\n12. **Binary data in G-theory** — a\
    \ critical methodological point that R2 did not independently flag but endorses\
    \ as important. The paper's primary analysis uses binary data under methods assuming\
    \ continuous responses. Must be discussed.\n13. **Temperature/ordering as random\
    \ facets** — 2–3 temperature levels and 4 systematic orderings are dubious as\
    \ random draws. R2 did not raise this but acknowledges the statistical logic.\n\
    14. **Asymmetric designs across benchmarks** — FP32 absent from non-MMLU experiments\
    \ confounds cross-benchmark precision comparisons.\n\n### R2-Only Concerns (Not\
    \ Contested by R1)\n15. **Title/metrics mismatch** — \"Evaluation Metrics\" in\
    \ title but only binary scoring in main text. R1 did not flag this but agrees\
    \ the title should match content.\n16. **Comparison with IRT approaches** — the\
    \ D-study budgets should be compared with tinyBenchmarks (Polo et al.) recommendations.\
    \ What does G-theory add over IRT-based subsampling?\n17. **Cost analysis for\
    \ budgets** — GPU-hour estimates would make recommendations concrete.\n\n---\n\
    \n## 8. Consolidated Strengths\n\n1. **Cross-benchmark variance gradient is a\
    \ genuine, well-supported empirical contribution** that unifies contradictory\
    \ prior findings. The monotonic 35pp gradient with mechanistic CoT explanation\
    \ and non-overlapping bootstrap CIs is the paper's signature finding.\n2. **Massive\
    \ experimental scale** (4M+ records, 5 benchmarks, 6 models, fully crossed factorial\
    \ designs). Few empirical papers in this area match the breadth.\n3. **D-study\
    \ reproducibility budgets are immediately actionable.** Specific item/prompt/seed\
    \ allocations for G≥0.90, benchmark-specific, with projection grids.\n4. **Engine\
    \ confound discovery and correction** (vLLM V0 vs. V1 routing) is a standalone\
    \ methodological contribution.\n5. **Model-as-facet analysis** cleanly separates\
    \ model×item interaction (~10%) and preserves the gradient after extraction.\n\
    6. **Honest framing throughout.** Separability as confirmatory, item dominance\
    \ as psychometrically expected, gradient as directional with quantified uncertainty.\n\
    7. **Comprehensive robustness checks.** Item resampling stability, REML vs. Henderson\
    \ III, bootstrap CIs, per-model breakdowns, 14B scale validation.\n8. **Counter-intuitive\
    \ G pattern** (knowledge benchmarks yield lower G than reasoning benchmarks) is\
    \ well-explained and insightful.\n9. **Current-practice G<0.25** is an important\
    \ and alarming finding for the field.\n\n---\n\n## 9. Consolidated Weaknesses\n\
    \n### Major\n1. **Binary data in standard G-theory** without discussion of the\
    \ methodological limitation. Item_id dominance is partially artifactual from the\
    \ Bernoulli variance function. Must be addressed in revision.\n2. **Zero figures\
    \ in a variance decomposition paper.** 19 tables and 0 figures. Stacked-bar charts,\
    \ D-study curves, and gradient visualizations are expected idioms. Serious competitive\
    \ disadvantage at a top venue.\n3. **Temperature (2–3 levels) and ordering (4\
    \ systematic rotations) as random facets** is statistically dubious. Sensitivity\
    \ analysis with these as fixed effects is needed.\n\n### Moderate\n4. **Asymmetric\
    \ designs across benchmarks** confound cross-benchmark precision comparisons (FP32\
    \ absent from non-MMLU experiments).\n5. **Separability claim overstated in abstract**\
    \ — holds on knowledge benchmarks but GSM8K (3.0%) and MATH (2.5%) exceed the\
    \ stated threshold. Should be qualified.\n6. **Title promises \"Evaluation Metrics\"\
    \ but delivers only binary scoring** in main text. Logprob analysis relegated\
    \ to one-paragraph appendix.\n7. **Infrastructure crossing is the claimed advance\
    \ over Mesting but yields near-null results.** The main findings would emerge\
    \ from a Mesting-style design with fixed infrastructure.\n8. **No models above\
    \ 14B.** Generality cannot be claimed beyond this scale range.\n9. **Missing references:**\
    \ GeneralizIT, Kunievsky et al. (2025), Brittlebench (2026), Bui et al. (2025),\
    \ ThinkingMachines (2025).\n10. **Fine-tuning extension (RoBERTa-large, encoder-only)**\
    \ is architecturally distant from decoder inference. Feels appended rather than\
    \ integrated.\n\n### Minor\n11. No cost analysis for recommended D-study budgets.\n\
    12. Residual component (6–18%) is underanalyzed; higher-order interactions mentioned\
    \ but not tabulated.\n13. 14B extension is underpowered (2 models, 1 df for model\
    \ effects).\n14. Item resampling stability tested only for MMLU, not for other\
    \ benchmarks.\n15. Prompt template text not provided; reproducibility details\
    \ (vLLM commit hash, model weight hashes, CUDA versions) insufficient.\n\n---\n\
    \n## 10. Consolidated Questions for Authors\n\n1. **Binary data:** How do you\
    \ address the assumption violation of applying Henderson III / REML to binary\
    \ (0/1) responses? Have you considered generalized G-theory or a probit/logit\
    \ link-function decomposition? Does item_id dominance survive under a method appropriate\
    \ for binary data?\n\n2. **Temperature as random facet:** What justifies treating\
    \ 2–3 temperature levels (specific design points: 0, 0.5, 1.0) as a random rather\
    \ than fixed facet? Have you compared results with temperature as fixed?\n\n3.\
    \ **Cross-benchmark precision confound:** Have you re-analyzed MMLU restricted\
    \ to BF16/FP16 only (excluding FP32) for the cross-benchmark comparison? Does\
    \ the precision gradient survive with matched precision levels?\n\n4. **Gradient\
    \ under logprob scoring:** Does the full 5-benchmark gradient (MMLU > ARC > HellaSwag\
    \ > GSM8K > MATH) hold under logprob-based scoring? If not, is the gradient partially\
    \ an artifact of binary scoring thresholds?\n\n5. **Comparison with IRT:** How\
    \ do the D-study budgets compare to Polo et al.'s tinyBenchmarks recommendations\
    \ for MMLU? What does G-theory add over IRT-based efficient subsampling?\n\n6.\
    \ **Separability scope:** How confident are you that the separability null extends\
    \ to more diverse hardware (A100 vs. H100 vs. B200) where architectural differences\
    \ are more substantial?\n\n7. **Judge variance complementarity:** Your entire\
    \ variance structure sits \"underneath\" Mesting's judge variance (43.8%). How\
    \ should practitioners interpret your budgets for LLM-as-judge evaluation? Would\
    \ the gradient hold if judge were included as a facet?\n\n8. **Negative variance\
    \ estimates:** How are negative Henderson III estimates handled (set to zero,\
    \ left negative, redistributed)? This affects the separability claim where infra×method\
    \ components are near zero.\n\n9. **D-study optimization procedure:** How were\
    \ the \"optimal\" prompt and seed counts determined? Formal cost minimization,\
    \ or chosen by inspection?\n\n10. **Rank instability analysis:** Have you computed\
    \ what fraction of published leaderboard rankings would change under re-evaluation\
    \ with different seeds/prompts? This would make G<0.25 more concrete than an abstract\
    \ coefficient.\n\n---\n\n## 11. Recommended Revisions (Priority-Ordered)\n\n###\
    \ Must-fix for acceptance\n1. Add 3–5 figures: (a) cross-benchmark stacked-bar\
    \ gradient, (b) D-study G vs. total evaluations curves, (c) facet effectiveness\
    \ ratio visualization, (d) bootstrap CI forest plot.\n2. Add a paragraph discussing\
    \ binary data limitations in G-theory estimation and note that logprob scoring\
    \ provides the methodologically cleaner decomposition.\n3. Present sensitivity\
    \ analysis with temperature as fixed facet.\n4. Qualify separability claim in\
    \ abstract: \"<0.3% on knowledge benchmarks; rises to 2–3% on reasoning benchmarks.\"\
    \n\n### Should-fix\n5. Re-analyze MMLU at BF16/FP16 only for the cross-benchmark\
    \ comparison table.\n6. Add the 5 missing references (GeneralizIT, Kunievsky,\
    \ Brittlebench, Bui, ThinkingMachines).\n7. Align title with content: either deliver\
    \ metric-conditional analysis or remove \"Evaluation Metrics\" from title.\n8.\
    \ Add prompt template text in an appendix; provide vLLM commit hash, model weight\
    \ hashes.\n\n### Nice-to-have\n9. Extend logprob analysis to all 5 benchmarks\
    \ to test whether the gradient holds under continuous scoring.\n10. Add cost estimates\
    \ (GPU-hours) for recommended D-study budgets.\n11. Expand higher-order interaction\
    \ analysis in appendix.\n\n---\n\n## 12. Overall Assessment\n\n### Score: 4/6\
    \ (Weak Accept)\n\n### Confidence: High\n\n### Meta-Review Justification\n\nBoth\
    \ reviewers independently scored this paper 4/6 (Weak Accept) with high confidence,\
    \ and the roundtable did not identify grounds to change this. The cross-benchmark\
    \ variance gradient is a genuine novel finding: no prior work has demonstrated\
    \ the systematic shift from item-dominated (knowledge tasks) to interaction-dominated\
    \ (reasoning tasks) variance structure, and the 35pp gradient with non-overlapping\
    \ bootstrap CIs is well-supported. The D-study reproducibility budgets fill a\
    \ real practical gap, and the G<0.25 indictment of current practice is alarming\
    \ and important.\n\nThe paper is held back by addressable issues: (a) zero figures\
    \ is a serious presentation weakness at a top venue; (b) binary data in standard\
    \ G-theory requires explicit discussion; (c) temperature/ordering as random facets\
    \ needs sensitivity analysis; and (d) the separability claim needs scoping. None\
    \ of these are fatal. If the must-fix revisions are made — especially adding figures\
    \ and the binary data discussion — the paper would likely move to 5/6 (Accept).\n\
    \nThe infrastructure crossing, positioned as the key methodological advance over\
    \ Mesting, yields near-null results. This is intellectually honest (confirmatory\
    \ null) but means the paper's primary novelty rests on the cross-benchmark gradient\
    \ and D-study budgets rather than on the infrastructure-methodology crossing.\
    \ Both reviewers agree this is sufficient for a top venue, given the scale of\
    \ the empirical contribution and the practical utility of the findings.\n\n**Bottom\
    \ line:** A well-executed, large-scale empirical study with a genuine novel finding\
    \ (the gradient), actionable outputs (D-study budgets), and an important policy\
    \ implication (G<0.25). At the acceptance threshold; fixable revisions would push\
    \ it to a clear accept.\n"

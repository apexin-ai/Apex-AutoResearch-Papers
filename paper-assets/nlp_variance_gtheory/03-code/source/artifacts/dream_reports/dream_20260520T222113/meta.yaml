      narrative_direction: 'Soften "gradient" to "benchmark-conditional variance structure"
        — emphasize the existence of benchmark dependence rather than a clean monotonic
        ordering. Claim 1 weakens from "systematic gradient" to "task-type clustering":
        knowledge-retrieval benchmarks show higher item dominance than reasoning benchmarks,
        but within-cluster ordering is not reliable. Claim 2 adds qualification: separability
        is benchmark-conditional, not universal. Claim 3 survives but with wider CIs
        and less dramatic differentiation between benchmark-specific budgets. Reframe
        hook as "even the question of WHAT dominates variance depends on your benchmark"
        rather than "gradient across benchmarks." Model-as-facet absorption becomes
        a feature: "prior single-model studies overestimated item dominance by confounding
        item difficulty with model-item interaction." Still targets AAAI but may need
        one more experiment (e.g., additional benchmark) to strengthen the clustering
        story. If AAAI timeline is tight, ACL ARR October is a comfortable fallback.


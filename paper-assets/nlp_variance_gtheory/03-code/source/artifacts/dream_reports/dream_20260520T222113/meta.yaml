  - name: LayerCast precision mitigation
    plan_id: exp-007
    description: 'LayerCast (FP16 storage + FP32 compute) as additional precision
      condition on MMLU. Same 4 models × 6 prompts × 6 seeds × 3 temperatures × 4
      orderings × 200 items.

      '
    expected_results:
      layercast_accuracy_mean: 0.682
      layercast_vs_bf16_gap_pp: 0.2
      layercast_vs_fp16_gap_pp: 0.1
      layercast_vs_fp32_gap_pp: 2.7
      layercast_item_id_binary: 0.515
      layercast_prec_x_item_reduction_vs_fp16_pct: 40
      layercast_g_correct_binary: 0.37
      layercast_inference_overhead_pct: 18
      layercast_prec_x_temp_binary: 0.001
      layercast_prec_x_temp_textmatch: 0.008
    result_rationale: 'LayerCast reduces precision:item interaction by ~40% vs FP16
      because the FP32 compute path eliminates mid-layer accumulation errors that
      flip items near decision boundaries. However, the practical benefit is marginal:
      FP16 precision:item was already only 5% of total variance, so a 40% reduction
      brings it to ~3% — still dwarfed by item_id at 51.5%. Accuracy (0.682) falls
      between BF16 (0.684) and FP16 (0.681), essentially equivalent to both. The precision×temperature
      interaction drops to 0.1% binary (from FP16''s ~0.2%) because FP32 compute stabilizes
      the logit computation at each sampling step. The 18% inference overhead comes
      from FP16→FP32 upcasting at each transformer layer. G-coefficient is unchanged
      (0.37) because the dominant item_id component is unaffected by precision mitigation.
      Given that BF16 already shows negligible precision effects and has no inference
      overhead, LayerCast is only relevant for the specific case where FP16 memory
      savings are required AND cross-hardware reproducibility matters.


      is hardware×precision at 0.8% binary: FP16 is more hardware-sensitive than BF16
      (cross-GPU gap 0.75pp vs 0.12pp), because FP16''s narrower dynamic range (5-bit
      exponent vs BF16''s 8-bit) makes accumulation order hardware-dependent — consistent
      with Yuan et al. (2025). When subsetting to FP16-only data, hardware explains
      2.2% of variance (within median narrative''s "1-3% on one precision"). Under
      text-match, hardware effects roughly double (total 7.2%) because different GPU
      kernel orderings produce different final tokens in long generations, amplified
      by exact-match scoring. Hardware×item at 1.8% binary means certain items near
      decision boundaries are hardware-sensitive — the same items that are precision-sensitive
      (prec:item) are also hardware-sensitive, consistent with a shared mechanism
      of logit perturbation near thresholds. Model rankings are fully preserved across
      GPUs (Kendall tau = 1.0 at all condition combinations) — hardware effects are
      far too small to alter comparative model evaluation. Total hardware-related
      variance at 3.6% binary is manageable but nonzero, requiring "approximately
      separable" language.


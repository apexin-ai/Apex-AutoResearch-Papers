    # Review Report: "Variance Decomposition Is a Measurement, Not a Fact"


    **Dream ID:** 20260520T222113 | **Review Mode:** Full (2 Reviewers + Roundtable)


    ---


    ## Reviewer Assignments

    - **R1** — Methodology & Experiments (Score: 4/6, Confidence: 4/5)

    - **R2** — Novelty & Related Work (Score: 3/6, Confidence: 4/5)


    ---


    ## 1. Paper Summary


    The paper applies Generalizability Theory to LLM evaluation variance across 5
    benchmarks, 4–6 models, and multiple infrastructure × methodology factors (172,800–230,400
    observations per experiment). It makes three claims: (1) item dominance estimates
    are sample-unstable (CV=33%), (2) model×item interaction (33%) is the largest
    overlooked component when model is treated as a crossed facet, and (3) D-study
    reproducibility budgets converge across benchmarks but carry ±190-item CIs rendering
    benchmark-specific recommendations meaningless. The framing: "variance decomposition
    is a measurement, not a fact."


    ---


    ## 2. R1 Review: Methodology & Experiments


    ### Strengths

    - **Impressive experimental scale.** ~4M total records across 8 experiments, 5
    benchmarks, 6 models. The factorial designs are well-constructed and the confound
    correction (V0 enforce_eager) is a genuine contribution.

    - **Model-as-facet reanalysis is well-executed.** The item_id drop from 37.8%→15.2%
    with model×item absorbing the difference is a clean, interpretable result that
    challenges standard practice.

    - **Separability analysis across hardware.** The infra×method jump from 1.5% (single-GPU)
    to 5.5% (multi-GPU) is well-demonstrated and practically important.

    - **D-study projections with uncertainty.** Reporting bootstrap CIs on reproducibility
    budgets is methodologically sound practice that prior work omits.


    ### Weaknesses

    - **Centerpiece claim rests on thin evidence.** The CV=33% finding (Exp 1b) uses
    only 3 item samples, 1 model (Llama-3.1-8B), 1 benchmark (MMLU). Three data points
    cannot reliably estimate a coefficient of variation. The CV itself has enormous
    uncertainty — it could plausibly be 15% or 50%. A claim that "all prior single-decomposition
    studies over-commit" requires far more resamples (30+ recommended) and generalization
    across models and benchmarks.

    - **Bootstrap validity concern.** Resampling 200 items with replacement creates
    ~127 unique items per bootstrap sample, producing duplicate observations that
    violate the independence assumptions of the G-theory model. The resulting CIs
    may be miscalibrated. The paper does not discuss this issue or compare with jackknife/subsampling
    alternatives.

    - **Cross-benchmark design asymmetry.** MMLU uses a 3×3 precision-temperature
    grid while other benchmarks use 2×2. Comparing variance percentages across different
    factorial structures without matched-design sensitivity analysis is methodologically
    questionable.

    - **G-coefficient interpretation.** The paper reports G=0.32 for 200 items as
    evidence of "inherent low reliability," but standard MMLU evaluation uses all
    ~14K items. D-study projection to full benchmark size would likely yield G>0.90,
    substantially weakening the alarm about current practice.

    - **Zero figures.** A paper about variance decomposition with 18 tables and no
    figures is a critical presentation failure. Stacked bar charts, waterfall diagrams,
    and bootstrap density plots (all described in the design context) would dramatically
    improve comprehension.

    - **Thin secondary experiments.** Exp 5 (n=2 14B models, scale/architecture confounded)
    contributes near-zero evidential value. Exp 7 (LayerCast) is a null result that
    could be a footnote. Exp 6 (RoBERTa fine-tuning) uses encoder-only architecture,
    making the inference-training comparison apples-to-oranges for the LLM evaluation
    claim.


    ### Questions for Authors

    1. Why only 3 item resamples for the centerpiece claim? What is the bootstrap
    CI on the CV=0.33 estimate itself?

    2. How do you handle duplicate items in bootstrap resamples given G-theory''s
    independence assumptions?

    3. What would G be for MMLU at its full ~14K item size under your D-study projections?

    4. The MMLU experiments use a richer factorial design than other benchmarks —
    have you verified that the cross-benchmark comparisons aren''t confounded by design
    differences?


    ### R1 Score: 4/6 (Weak Accept) | Confidence: 4/5


    ---


    ## 3. R2 Review: Novelty & Related Work


    ### Strengths

    - **The resampling instability result is novel for ML evaluation.** Even if the
    concept is known in psychometrics, nobody has empirically demonstrated rank inversions
    across item samples for LLM evaluation variance decomposition. The qualitative
    finding (residual > item_id in Sample 7) is striking.

    - **The bimodality→item_id correlation** (r=0.95) is an interesting mechanistic
    hypothesis that could guide benchmark design, even if underpowered (n=5 benchmarks).

    - **Engine confound correction** (V0 enforce_eager reducing precision main effect
    from ~7% to 1.6%) is a valuable practical contribution for the community.

    - **Clear three-contribution structure** in the introduction makes claims easy
    to evaluate.


    ### Weaknesses

    - **The central conceptual claim is not novel.** "Variance decomposition estimates
    have sampling variability" is established in psychometric measurement theory (Brennan
    2001, Chapter 8; Cardinet et al. 2010). The paper presents this as a discovery
    ("we set out to build budgets and discovered the budget is unreliable") without
    acknowledging that measurement theorists have known this for decades. For a measurement-literate
    audience, the surprise factor is low.

    - **Missing engagement with psychometric precedent.** The paper cites Shavelson
    & Webb (1991) and Brennan (2001) for G-theory basics but ignores their extensive
    discussion of variance component estimation error, sampling variability of G-coefficients,
    and the known sensitivity to universe definition (fixed vs. random facets). The
    critique of Mesting (2026) for treating model as fixed is particularly problematic
    — model-as-fixed is a legitimate design choice when generalizing only to those
    specific models, not an "error."

    - **Three claims are one finding stated three ways.** All three contributions
    reduce to "variance component estimates are uncertain": (1) they vary across item
    samples, (2) they vary across model specifications, (3) the D-study projections
    derived from them are also uncertain. This is a single observation about estimation
    uncertainty, not three independent contributions.

    - **Purely diagnostic — no constructive contribution.** The three recommendations
    (report resampling stability, treat model as crossed, add CIs to budgets) are
    standard statistical advice. The paper does not provide a corrected estimation
    procedure, a practical resampling protocol, a software tool, or a concrete recommended
    minimum number of resamples. Practitioners reading this paper learn that their
    current approach is wrong but not what to do instead.

    - **The narrative pivot feels post-hoc.** The experiment design context reveals
    the paper originally aimed to demonstrate a "cross-benchmark variance gradient"
    (knowledge→reasoning). When this failed (spread=9pp, wrong direction), the paper
    reframed around instability. The narrative "we set out to build budgets and discovered
    they''re unreliable" is technically accurate but obscures that the current framing
    was not the original research question.

    - **Bimodality correlation is underpowered.** r=0.95 from n=5 benchmarks has a
    95% CI of approximately [0.63, 0.99] — wide enough to be consistent with moderate
    or near-perfect correlation. Moreover, bimodality mechanistically drives item-level
    variance almost by definition (bimodal difficulty → high between-item variance),
    making this partially tautological.

    - **Overclaiming.** "Every prior study that reports a single variance decomposition...
    has presented one draw from a high-variance distribution as a finding" is a sweeping
    claim supported by 3 resamples on 1 model × 1 benchmark. The paper does not test
    whether other studies'' decompositions would show similar instability under their
    specific designs.

    - **Paper bloat.** 18 tables across 13 pages with zero figures. Experiments 5
    (14B extension), 6 (fine-tuning), and 7 (LayerCast) collectively contribute ~2
    pages of marginal findings. The paper would be stronger at 10 pages with 4 core
    experiments and actual figures.


    ### Missing Related Work

    - Cardinet, Johnson, & Pini (2010): "Applying Generalizability Theory Using EduG"
    — extensive treatment of variance component sampling variability

    - Webb, Shavelson, & Haertel (2006): On reliability of G-study variance components

    - Marcoulides (1996): On estimating variance components in G-theory

    - The IRT literature on item sampling (e.g., Lord & Novick, 1968; van der Linden
    & Hambleton, 1997) covers similar ground on the instability of item parameter
    estimates


    ### Questions for Authors

    1. How do you respond to the argument that variance component estimation uncertainty
    is already well-characterized in Brennan (2001, Ch. 8) and Cardinet et al. (2010)?
    What specifically is new beyond applying known concepts to a new domain?

    2. The critique of model-as-fixed analysis assumes that prior work intended to
    generalize across models. If Mesting (2026) deliberately fixed model to study
    judge-specific behavior, how is this an error rather than a design choice?

    3. Can you provide a concrete, actionable resampling protocol? How many resamples,
    what sample sizes, what estimator?

    4. The r=0.95 bimodality correlation has n=5. Have you considered that this is
    partially tautological (bimodal item difficulty → high item variance, by construction)?

    5. Would you characterize your contribution as "discovering that measurement error
    exists" or as "quantifying its magnitude in a specific domain"? If the latter,
    how robust is the quantification with only 3 resamples?


    ### R2 Score: 3/6 (Weak Reject) | Confidence: 4/5


    ---


    ## 4. Roundtable Discussion


    ### Step 2: Cross-Sharing


    **R1 responds to R2''s novelty concern:** R1 acknowledges that the conceptual
    point is known in psychometrics but argues the empirical demonstration in the
    LLM evaluation context — particularly the rank inversions and the magnitude of
    model×item interaction — provides actionable new information to the ML community.
    However, R1 concedes that 3 resamples severely undermines the quantitative claim
    (CV=33% specifically).


    **R2 responds to R1''s methodology points:** R2 agrees that the bootstrap validity
    concern (duplicate items violating independence) is serious and not addressed.
    R2 also agrees that the G-coefficient interpretation at 200 items vs. full benchmark
    size is misleading.


    ### Step 3: Convergence


    **Points of agreement (both reviewers):**

    1. The zero-figures presentation is unacceptable for a variance decomposition
    paper. This alone would warrant revision.

    2. The centerpiece claim (CV=33%) rests on only 3 data points from 1 model and
    1 benchmark — far too thin for the sweeping conclusion that "all prior single-decomposition
    studies" are unreliable.

    3. Experiments 5 (14B), 6 (fine-tuning with RoBERTa), and 7 (LayerCast) are bloat
    that should be cut or moved to appendix.

    4. The model-as-facet reanalysis (Exp 4) is the strongest individual result —
    the 37.8%→15.2% shift with model×item=33% is clean and important.

    5. The paper is purely diagnostic with no constructive solution beyond standard
    statistical advice.

    6. The bootstrap methodology needs more careful treatment of independence assumptions.


    **Points of disagreement:**

    - R1 gives more credit for experimental scale and practical value to the ML community;
    R2 weights novelty relative to psychometric precedent more heavily.

    - R1 sees the paper as publishable with revisions; R2 sees fundamental framing
    issues that require a major reconceptualization.


    ### Step 4: Score Convergence


    R1 initial: 4 (Weak Accept). R2 initial: 3 (Weak Reject).


    After discussion, R1 moves to **3–4**, acknowledging that the thin evidence base
    for the centerpiece claim (3 resamples) is more damaging than initially assessed.
    R2 holds at **3**, noting that even with more resamples, the conceptual novelty
    concern remains.


    **Consensus score: 3 (Weak Reject)**


    ---


    ## 5. Consolidated Assessment


    ### Overall Score: 3/6 (Weak Reject)


    ### Meta-Review Summary


    This paper attempts an ambitious meta-methodological critique of variance decomposition
    in LLM evaluation, arguing that decomposition estimates are themselves unreliable
    measurements. The experimental scale is impressive (~4M observations across 8
    experiments), and individual results — particularly the model-as-facet reanalysis
    showing model×item interaction at 33% — are genuinely informative for the ML evaluation
    community.


    However, the paper suffers from several compounding weaknesses that collectively
    prevent acceptance:


    1. **The centerpiece claim is underpowered.** CV=33% from 3 item resamples on
    1 model × 1 benchmark cannot support the conclusion that all prior single-decomposition
    studies are unreliable. The CV estimate itself has enormous uncertainty and the
    generalization across models/benchmarks is untested.


    2. **Conceptual novelty is limited.** The central insight — that variance component
    estimates have sampling variability — is well-established in the psychometric
    literature the paper builds on. The paper would be stronger if it acknowledged
    this precedent and focused on quantifying the problem''s magnitude in the LLM
    evaluation domain, rather than framing it as a discovery.


    3. **No constructive contribution.** The recommendations ("report CIs," "treat
    model as crossed," "add error bars to budgets") are standard statistical practice.
    The paper diagnoses a problem but offers no tool, protocol, or corrected estimator.


    4. **Presentation is inadequate.** 18 tables and zero figures in a variance decomposition
    paper. Several experiments (5, 6, 7) contribute marginal evidence and inflate
    the paper without strengthening core claims.


    5. **Methodological gaps.** Bootstrap validity under item duplication, G-coefficient
    interpretation at subsampled vs. full benchmark size, and cross-benchmark design
    asymmetry are unaddressed.


    ### Actionable Revision Guidance


    To reach acceptance at a top venue, the authors should:

    - **Increase resamples to 30+ and extend across multiple models/benchmarks** to
    make the CV estimate credible

    - **Acknowledge psychometric precedent** (Brennan 2001 Ch. 8, Cardinet et al.

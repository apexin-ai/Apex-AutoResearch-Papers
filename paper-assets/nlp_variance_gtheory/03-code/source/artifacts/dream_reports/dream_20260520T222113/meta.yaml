      inference: hyperparameters (LR, seed, data shuffle) dominate instead of items.
      On large datasets (SST-2, MNLI), learning rate dominates (30-35%) because the
      optimization landscape is well-defined and LR determines the convergence basin
      — too high overshoots, too low underfits, and the sensitivity is amplified by
      RoBERTa''s sharp loss surface near the optimum (Dodge et al., 2020). On small
      datasets (RTE, COPA), data shuffle dominates (28-30%) because mini-batch composition
      has outsized influence with fewer training examples — a single misplaced hard
      example in early batches can steer the model into a different loss basin. Seed
      is substantial everywhere (16-25%) because weight initialization and dropout
      mask jointly determine the optimization trajectory. The seed×LR interaction
      (10-16%) is the fine-tuning analog of item×temperature in inference: certain
      seed-LR combinations land in qualitatively different loss basins, producing
      bimodal accuracy distributions on RTE (two clusters separated by ~4pp accuracy,
      one basin near 72% and one near 68%). GPU and precision effects remain negligible
      (<1.2%) across all tasks — the variance hierarchy for infrastructure factors
      is consistent between fine-tuning and inference, even though the methodology-factor
      hierarchy differs completely. This validates the G-theory framework''s generality
      while showing that reproducibility budgets cannot be transferred between evaluation
      modes.


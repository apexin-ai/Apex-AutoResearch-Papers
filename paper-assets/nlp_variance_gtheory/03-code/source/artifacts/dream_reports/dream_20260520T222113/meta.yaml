    plan_id: exp-007
    description: '4 models × LayerCast (FP16 storage + FP32 compute) × 6 prompts ×
      6 seeds × 3 temperatures × 4 orderings × 200 MMLU items = 172,800记录。 作为第4种precision
      condition加入exp-001 analysis。

      '
    expected_results:
      total_records: 172800
      layercast_accuracy_mean: 0.668
      layercast_vs_fp32_diff_pp: 0.4
      layercast_vs_bf16_diff_pp: -0.1
      layercast_item_agreement_fp32: 0.9993
      layercast_item_agreement_bf16: 0.9995

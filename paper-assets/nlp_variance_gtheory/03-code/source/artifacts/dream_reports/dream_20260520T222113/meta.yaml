      robust departure from separability, requiring benchmark qualification on Claim
      2. (4) D-study budgets differentiate benchmarks but the ratio (1.5-1.75×, not
      3×) means the practical implication is real but less dramatic than hoped. (5)
      Logprob scoring amplifies item_id to 55% — a third metric perspective that strengthens
      the metric-conditional narrative.


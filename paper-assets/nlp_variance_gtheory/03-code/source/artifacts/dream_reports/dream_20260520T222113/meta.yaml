  review_report: "---\ndream_id: dream_20260520T222113\ntier: median\noverall_score:\
    \ Weak Accept (4/6)\ntimestamp: 2026-05-20T23:46:25.470175+00:00\n---\n\n# Dream\
    \ Review Report — `dream_20260520T222113` (median tier)\n\n## Paper\n**Reproducibility\
    \ Budgets for LLM Evaluation: A Generalizability Theory Analysis of Variance Sources\
    \ Across Benchmarks, Models, and Evaluation Metrics**\n\n## Review Panel\n- **R1**:\
    \ Methods & Experiments\n- **R2**: Novelty & Related Work\n\n---\n\n## 1. Independent\
    \ Reviews\n\n### R1: Methods & Experiments — Score 4/6 (Weak Accept), Confidence\
    \ 4/5\n\n**Summary**: The paper conducts a large-scale G-theory analysis crossing\
    \ infrastructure with methodology facets across 5 benchmarks and 6 models (~3M+\
    \ observations). The experimental design is ambitious and the numerical results\
    \ are internally consistent. However, several technical methodology issues undermine\
    \ confidence.\n\n**Strengths**:\n1. Internal numerical consistency across all\
    \ 15 tables is excellent — variance components sum correctly, cross-references\
    \ between tables are coherent, and the model-as-facet correction systematically\
    \ reduces item_id by ~4pp across all benchmarks.\n2. The cross-benchmark gradient\
    \ finding (item_id: 48% MMLU → 28% MATH) is well-supported with bootstrap CIs\
    \ showing non-overlapping intervals at endpoints (permutation p=0.003).\n3. The\
    \ engine confound correction (V0 enforce_eager eliminating the 0.22pp BF16 eager\
    \ artifact) is a genuine standalone contribution that prevents other researchers\
    \ from attributing engine-routing variance to precision effects.\n4. Experimental\
    \ scale is impressive: 9 experiments, 5 benchmarks, 6 models, 2 GPU architectures,\
    \ 3 scoring metrics.\n5. Item resampling stability analysis (Table 3) honestly\
    \ quantifies the sampling uncertainty in item_id estimates (CV=0.19) and correctly\
    \ reports ranges rather than point estimates.\n\n**Weaknesses**:\n1. **D-study\
    \ optimization procedure is undocumented**: Table 9 reports joint-optimal facet\
    \ allocations (e.g., MMLU: 420 items, 3 prompts, 4 seeds for G≥0.90) but the paper\
    \ does not describe how joint optimization across multiple facets was performed.\
    \ Standard D-study sweeps one facet at a time while holding others fixed. If grid\
    \ search was used, the search space and stopping criteria should be stated. This\
    \ is critical because practitioners will use these numbers directly.\n2. **G coefficient\
    \ interpretation conflates with overall reliability**: The paper presents G=0.37\
    \ (binary) as indicating \"substantial unreliability\" of MMLU. But G-theory's\
    \ G coefficient measures generalizability over the *facets included in the design*,\
    \ not overall measurement quality. Since the universe of generalization includes\
    \ only the specific facets crossed, the low G primarily reflects high item-sampling\
    \ error, not that MMLU is unreliable in practice (where items are fixed). The\
    \ paper should distinguish G as a design property from reliability as a benchmark\
    \ property.\n3. **Observation count claim**: The abstract says \"over 3 million\"\
    \ observations. Summing across experiments: MMLU ~1.04M + multi-benchmark ~1.15M\
    \ (3×384K) + hardware ~1.15M + 14B unclear + fine-tuning ~1,728 runs (not observations)\
    \ + MATH + LayerCast. The total depends on overlap assumptions (exp-004 reanalyzes\
    \ existing data). The claim should be precisely itemized.\n4. **MATH variance\
    \ decomposition**: Table 6 shows item_id=28% for MATH (model-as-facet), but temp:item\
    \ (14%) + seed:item (11%) = 25%, nearly matching item_id. The paper does not adequately\
    \ discuss that for MATH, item dominance is barely maintained — on a per-model\
    \ basis, temperature×item may exceed item_id for some models, weakening the \"\
    item_id always ranks #1\" claim.\n5. **Missing details for replication**: (a)\
    \ Which 6 prompt templates were used? (b) What stratification procedure for 200\
    \ items across 57 MMLU subjects? (c) How were \"200 MATH items\" selected given\
    \ MATH's difficulty distribution? (d) What temperature values (three temperatures\
    \ stated but values not given)? These omissions make exact replication impossible.\n\
    \n**Questions for Authors**:\n1. For the D-study projections, was the optimization\
    \ over (items, prompts, seeds) done via exhaustive grid search or analytical formula?\
    \ What were the grid bounds?\n2. Table 6 shows MATH prec:item and precision main\
    \ as \"—\" (missing). Is this because the MATH experiment used only BF16/FP16\
    \ with insufficient precision levels for stable estimation?\n3. The bootstrap\
    \ procedure resamples items × conditions. Are conditions resampled with replacement\
    \ within the factorial structure, or is the bootstrap at the cell level?\n4. How\
    \ does the G coefficient change if you remove the 3-way and higher interaction\
    \ terms from the error variance? The 9% \"other 2-way/3-way\" in Table 1 is non-trivial.\n\
    \n---\n\n### R2: Novelty & Related Work — Score 4/6 (Weak Accept), Confidence\
    \ 4/5\n\n**Summary**: The paper applies G-theory to multi-benchmark LLM evaluation,\
    \ discovering a benchmark-conditional variance gradient and producing D-study\
    \ reproducibility budgets. The cross-benchmark gradient is the genuine novel contribution;\
    \ the infrastructure×methodology crossing — framed as the key methodological advance\
    \ — yields near-null results.\n\n**Strengths**:\n1. The cross-benchmark variance\
    \ gradient (item_id: 48% → 28% from knowledge to proof reasoning) is genuinely\
    \ novel. No prior work has positioned multiple benchmarks along a reasoning-intensity\
    \ continuum and demonstrated a monotonic shift in variance structure. The unifying\
    \ explanation — that prior single-benchmark studies reached contradictory conclusions\
    \ because they studied benchmarks at different gradient positions — is insightful.\n\
    2. The D-study budget differentiation is non-obvious and actionable: MMLU is item-limited\
    \ while GSM8K is seed-limited, directly challenging the assumption that evaluation\
    \ protocols can be standardized.\n3. Honest positioning of contributions. The\
    \ paper correctly frames separability as confirmatory, acknowledges that item\
    \ dominance is psychometrically expected, and scopes infrastructure to numerical\
    \ precision. This intellectual honesty is appreciated.\n4. The G < 0.37 finding\
    \ for standard MMLU evaluation practice is an important indictment of current\
    \ evaluation norms, framed in measurement-theory language that connects NLP to\
    \ established psychometric standards.\n5. The experimental scale (3M+ records,\
    \ 9 experiments) substantially exceeds both Mesting (2026, single benchmark) and\
    \ all prior isolated-factor studies.\n\n**Weaknesses**:\n1. **Infrastructure crossing\
    \ yields near-null results, hollowing the novelty narrative**: The introduction\
    \ frames \"crossing infrastructure with methodology in a unified G-theory framework\"\
    \ as a key gap filled. But infra×method < 0.5% on knowledge benchmarks means this\
    \ crossing contributes essentially nothing to understanding. The three genuine\
    \ findings (gradient, D-study reversal, G < 0.37 indictment) would all emerge\
    \ from a methodology-only design replicated across 5 benchmarks. The GSM8K exception\
    \ (3%) partially rescues this, but the paper oversells the infrastructure crossing\
    \ relative to its contribution.\n2. **Missing critical related work**:\n   - No\
    \ comparison with IRT-based item selection (tinyBenchmarks recommends ~100 items\
    \ for MMLU vs. this paper's 420 for G≥0.90 — the 4× discrepancy is never discussed)\n\
    \   - ThinkingMachines (2025) on batch-invariance failure in GEMM/attention kernels\
    \ is directly relevant to the seed×item interaction mechanism\n   - No engagement\
    \ with Kunievsky & Evans (2025) alternative variance decomposition framework\n\
    \   - 15 references is thin for a venue submission of this scope\n3. **\"First\
    \ multi-benchmark G-theory analysis\" claim is narrow**: Bouthillier et al. (2021)\
    \ performed ANOVA-based variance decomposition across multiple ML benchmarks.\
    \ The difference is \"G-theory (not ANOVA) applied to LLM evaluation (not ML generally)\
    \ across multiple benchmarks.\" This is a narrow novelty window.\n4. **Three-tier\
    \ benchmark clustering is post-hoc**: The ordering (knowledge > commonsense >\
    \ reasoning) was presumably determined after observing results. An independent\
    \ measure of \"reasoning intensity\" (e.g., average CoT length, multi-step count)\
    \ would make the continuum principled rather than constructed. A 6th benchmark\
    \ might not fall on the line.\n5. **Zero figures is a critical presentation failure**:\
    \ 15 tables and no figures in a variance decomposition paper. Stacked-bar decomposition\
    \ charts are the expected field idiom. The cross-benchmark gradient demands visualization.\
    \ D-study projection curves would communicate the budget reversal far more effectively\
    \ than tables. At a top venue, this is a significant competitive disadvantage.\n\
    6. **Fine-tuning G-study (Section 4.10) is architecturally disjoint**: RoBERTa-large\
    \ encoder fine-tuning uses different facets (LR, data shuffle) from the decoder\
    \ inference study (prompt, temperature). The finding that \"infrastructure is\
    \ negligible in fine-tuning too\" is unsurprising. The cross-paradigm generalization\
    \ claimed is weak.\n7. **IRT comparison is a missed opportunity**: D-study budgets\
    \ claim to be \"an alternative to IRT subsampling\" but never compare against\
    \ actual IRT recommendations. If tinyBenchmarks and D-study agree, G-theory is\
    \ confirmatory; if they disagree, the paper must explain why.\n\n**Questions for\
    \ Authors**:\n1. If you added GPQA or HumanEval as a 6th benchmark, would it fall\
    \ on the gradient? What would it mean for the claim if it did not?\n2. What mechanism\
    \ drives the gradient for HellaSwag specifically? It does not involve explicit\
    \ chain-of-thought.\n3. For MMLU, Polo et al. recommend ~100 items via IRT. Your\
    \ D-study recommends 420. Can you explain the 4× discrepancy?\n4. If a practitioner\
    \ uses LLM-as-judge evaluation, do D-study budgets still apply, or are they overwhelmed\
    \ by judge variance (Mesting found judge identity at 43.8%)?\n5. What does the\
    \ infrastructure crossing add beyond a confirmatory null, given that the three\
    \ main findings would emerge from methodology-only replication?\n\n---\n\n## 2.\
    \ Roundtable Cross-Sharing\n\n### Areas of Agreement\n- **Score**: Both reviewers\
    \ converge on 4/6 (Weak Accept) — paper is at the acceptance threshold\n- **Core\
    \ contribution**: Both agree the cross-benchmark variance gradient is the paper's\
    \ genuine and most important novel finding\n- **Experimental scale**: Both praise\
    \ the comprehensiveness (3M+ obs, 9 experiments, 5 benchmarks)\n- **Internal consistency**:\
    \ Both note that numerical results are coherent across tables\n- **Practical value**:\
    \ Both appreciate the D-study budgets as actionable for practitioners\n- **Item\
    \ resampling**: Both view the CV=0.19 finding as an honest and valuable contribution\n\
    \n### Areas of Complementary Concern\n- **R1 technical, R2 positioning**: R1 identifies\
    \ specific methodological gaps (D-study optimization procedure, G interpretation,\
    \ missing experimental details), while R2 identifies framing gaps (infrastructure\
    \ crossing as hollow, missing related work, post-hoc clustering)\n- **Both flag**:\
    \ Insufficient detail for replication (R1: prompts, temperatures, stratification;\
    \ R2: comparison with IRT baselines)\n\n### Disagreement Resolved\n- R1 and R2\
    \ initially emphasized different aspects but neither raised objections to the\
    \ other's concerns during sharing. R2's concern about \"infrastructure crossing\
    \ as expensive null\" and R1's concern about \"D-study optimization undocumented\"\
    \ are complementary weaknesses that jointly characterize the paper's limitations.\n\
    \n---\n\n## 3. Consolidated Assessment\n\n### Overall Score: 4/6 (Weak Accept)\n\
    ### Confidence: 4/5\n\n### Decision Rationale\n\nThe paper makes a genuine empirical\
    \ contribution: the cross-benchmark variance gradient showing that item dominance\
    \ shifts from 48% (knowledge) to 28% (proof reasoning) is novel, well-supported\
    \ by bootstrap CIs, and provides a unifying explanation for seemingly contradictory\
    \ findings in prior single-benchmark studies. The D-study reproducibility budgets\
    \ are practically useful and the benchmark-specific budget differentiation (MMLU\
    \ item-limited vs. GSM8K seed-limited) is non-obvious. The experimental scale\
    \ is impressive.\n\nHowever, several issues keep the paper at the acceptance threshold\
    \ rather than above it:\n\n1. **Novelty concentration**: The infrastructure×methodology\
    \ crossing — framed as the key methodological advance over Mesting (2026) — yields\
    \ <0.5% on knowledge benchmarks. The main findings would emerge from methodology-only\
    \ multi-benchmark replication. The GSM8K 3% exception partially rescues this but\
    \ is insufficient to carry the infrastructure framing as a primary contribution.\n\
    \n2. **Presentation**: Zero figures in a 15-table variance decomposition paper\
    \ is a critical gap. The gradient and D-study curves practically demand visualization.\n\
    \n3. **Technical documentation gaps**: D-study joint-optimization procedure undocumented,\
    \ experimental details (prompt templates, temperature values, stratification)\
    \ insufficient for replication, and the observation count claim needs precise\
    \ itemization.\n\n4. **Positioning gaps**: Missing comparison with IRT-based recommendations\
    \ (tinyBenchmarks 100 items vs. D-study 420 items), thin bibliography (15 refs),\
    \ post-hoc gradient ordering without external validation.\n\n5. **G coefficient\
    \ interpretation**: The paper somewhat conflates measurement generalizability\
    \ (a design property) with benchmark reliability (a practical property), risking\
    \ misinterpretation by practitioners.\n\n### Actionable Revision Priorities (Ranked)\n\
    \n1. **Add 3-4 figures**: (a) Stacked-bar variance decomposition across 5 benchmarks\
    \ — the signature figure; (b) D-study projection curves (G vs. item count) with\
    \ CI bands; (c) Forest plot of bootstrap CIs on item_id across benchmarks; (d)\
    \ Model-as-facet comparison (before/after stacked bars for MMLU)\n2. **Document\
    \ D-study optimization**: State the joint-optimization procedure (grid search\
    \ vs. analytical), the search bounds, and validate that recommendations are internally\
    \ consistent\n3. **Add IRT comparison**: Compare D-study budgets with tinyBenchmarks\
    \ recommendations and explain discrepancies — this strengthens the contribution\n\
    4. **Expand bibliography**: Add ThinkingMachines (2025), Kunievsky & Evans (2025),\
    \ and 3-5 additional relevant references to reach 20+\n5. **Provide experimental\
    \ details**: List all 6 prompt templates, the 3 temperature values, the item stratification\
    \ procedure, and a precise observation count breakdown\n6. **Reframe infrastructure\
    \ crossing**: Position as confirmatory evidence for separability rather than as\
    \ a primary methodological contribution. Emphasize the GSM8K exception as the\
    \ genuine finding from infrastructure crossing.\n7. **Validate gradient externally**:\
    \ Add an independent measure of reasoning intensity for each benchmark (CoT length,\
    \ multi-step count) to make the three-tier clustering principled rather than post-hoc\n\
    8. **Clarify G interpretation**: Distinguish G as a generalizability coefficient\
    \ over included facets from overall benchmark reliability, noting that practitioners\
    \ using fixed items face different reliability profiles\n\n### Experiment Coverage\
    \ Assessment\n\nThe paper covers all 9 planned experiments (exp-001 through exp-008\
    \ plus exp-001b). Coverage is breadth-oriented: 15 tables in 10 pages means each\
    \ experiment gets 1-2 paragraphs. The fine-tuning study (exp-006) and LayerCast\
    \ (exp-007) feel rushed — each could be appendix material to free space for figures\
    \ and deeper analysis of the core experiments (exp-001, 002, 004). The MATH extension\
    \ (exp-008) is well-integrated into the cross-benchmark narrative.\n\n### Strengths\
    \ Summary\n- Cross-benchmark variance gradient: novel, statistically rigorous,\
    \ explanatory\n- D-study budget differentiation: practically actionable, non-obvious\n\
    - Experimental scale: ~3M observations, 9 experiments, 5 benchmarks, 6 models\n\
    - Item resampling stability: honest quantification of estimation uncertainty\n\
    - Engine confound correction: standalone methodological contribution\n- Internal\
    \ numerical consistency across all tables\n\n### Weaknesses Summary\n- Infrastructure\
    \ crossing yields near-null, hollowing the claimed methodological advance\n- Zero\
    \ figures in a heavily quantitative variance decomposition paper\n- D-study optimization\
    \ procedure and experimental details undocumented\n- Post-hoc gradient clustering\
    \ without external validation\n- Missing IRT comparison and thin bibliography\n\
    - G coefficient interpretation risks practitioner misunderstanding\n- Fine-tuning\
    \ and LayerCast sections are disjoint/rushed\n"

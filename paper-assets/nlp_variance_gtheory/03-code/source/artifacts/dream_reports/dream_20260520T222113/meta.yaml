      \ 这是因为high item_id意味着item sampling是measurement reliability的bottleneck—— 在MMLU上即使用全部facet\
      \ levels，200-item的item sampling error仍然dominant。 GSM8K的low item_id意味着item sampling\
      \ error小，多seed/temp averaging后G更高。\n"
  - name: Multi-hardware separability test
    plan_id: exp-003
    description: '4 models × 2 GPU types (RTX PRO 6000 + second GPU) × 2 precisions
      (BF16/FP16) × 6 prompts × 6 seeds × 3 temperatures × 4 orderings × 200 MMLU
      items。 总记录 4×2×2×6×6×3×4×200 = 691,200。 核心目标：量化hardware主效应和hardware×methodology交互，验证single-GPU
      separability。

      '
    expected_results:
      total_records: 691200
      hardware_main_effect: 0.004
      hardware_x_item: 0.016
      hardware_x_prompt: 0.0006
      hardware_x_temperature: 0.0005
      hardware_x_seed: 0.0004
      hardware_x_ordering: 0.0002
      hardware_x_methodology_total: 0.0017
      precision_x_prompt: 0.0006
      precision_x_temperature: 0.0005
      precision_x_seed: 0.0003
      precision_x_ordering: 0.0002
      direct_infra_x_method_total: 0.003
      item_id: 0.554
      residual: 0.164
      prompt_x_item: 0.06
      temperature_x_item: 0.057
      seed_x_item: 0.029
      precision_x_item: 0.017
      ordering_x_item: 0.014
      infra_x_item_total: 0.033
      method_x_item_total: 0.16
      gpu1_gpu2_accuracy_correlation: 0.9992
      max_accuracy_difference_any_condition: 0.014
      mean_accuracy_difference: 0.003
      model_rankings_preserved: true
      g_full_design: 0.35
    result_rationale: 'Hardware主效应0.4%反映两块GPU的微架构差异（不同SM count、memory bandwidth、kernel
      scheduling）， 但这些差异是systematic fixed offset，不是random——同一model在GPU2上一致性地偏低0.3pp。

      hardware×methodology total仅0.17%，远低于1%阈值。原理：hardware层影响numerical computation
      （tensor core routing、memory alignment），methodology层影响token sampling （prompt→attention
      pattern、seed→RNG state、temperature→softmax scaling）。 两者的交叉点（GPU微架构如何影响不同prompt下的sampling
      distribution） 在logit space中被softmax压缩到negligible水平——除非logits在decision boundary附近
      （这是hardware×item交互的来源：boundary items对numerical precision敏感）。

      hardware×item(1.6%)比hardware主效应(0.4%)大4×，因为特定items （logit difference between
      correct and nearest distractor < 0.01）在不同GPU上 因kernel tiling和memory access pattern差异产生不同numerical
      path。 但这只影响~5%的boundary items。

      GPU间accuracy correlation 0.9992说明hardware几乎不改变measurement outcome。 Model rankings
      across all conditions完全preserved——无ranking flip。

      这是clean confirmatory null：validates isolated-factor studies的implicit separability
      assumption， 同时hardware×item的non-zero值提供了nuanced story。

      '

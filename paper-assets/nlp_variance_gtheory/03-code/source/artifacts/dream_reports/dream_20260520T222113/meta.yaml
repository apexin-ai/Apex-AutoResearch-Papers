    result_rationale: "(a) Model-as-facet：在MMLU数据中加入model作为crossed random facet后，model×item吸收10.2%方差。\
      \ 这10.2%来源：约6.8%从pooled item_id提取（因为model-specific item difficulty patterns\
      \ 在pooled分析中被归入item主效应），约3.4%从residual提取（因为model-specific noise 在pooled分析中被归入unexplained\
      \ error）。item_id从56.0%降至49.2%但仍为最大单一组分， residual从20.7%降至12.0%（大幅改善模型拟合）。\nModel×item\
      \ gradient与主gradient同向：知识型benchmark上models更heterogeneous （MMLU 10.2% vs GSM8K\
      \ 5.8%），因为models在knowledge domain coverage上差异大 （Gemma在STEM强、Mistral在humanities强），而在reasoning\
      \ ability上差异相对小。\n(b) Bootstrap CIs：1000次item-level resampling后，所有benchmark的item_id\
      \ CI 不含零（all lower bounds > 19%），且任意两个benchmark间CIs不重叠。 MMLU [46.1%, 52.3%]、ARC\
      \ [35.6%, 41.2%]、HellaSwag [28.2%, 33.4%]、GSM8K [19.8%, 25.4%]。 CI宽度4-6pp（1000\
      \ resamples, 200 items each）， 证明31pp的gradient spread具有full statistical significance。\n\
      (c) D-study核心发现——评估protocol的optimal allocation随benchmark qualitatively改变： -\
      \ MMLU是item-limited：items vs seeds effectiveness ratio = 14.2:1。\n  G≥0.90需要420\
      \ items + 3 prompts + 2 seeds = 2,520 evaluations。\n  Scaling items是唯一高效路径。\n\
      - GSM8K是seed-limited：items vs seeds effectiveness ratio = 0.8:1（反转！）。\n  G≥0.90需要150\
      \ items + 3 prompts + 10 seeds = 4,500 evaluations。\n  Scaling seeds比scaling\
      \ items更有效，因为seed×item和temp×item是dominant error sources。\n\n这是\"no universal\
      \ recipe\"的quantitative crystallization： 同一evaluation budget在不同benchmark上的optimal\
      \ allocation完全不同。\nCurrent practice G全部<0.25——低于社会科学中\"不可接受\"的阈值（通常G≥0.80），\
      \ 说明现有leaderboard结果的measurement reliability fundamentally inadequate。 GSM8K\
      \ current practice G最低(0.14)，因为seed×item和temp×item在1-seed/1-temp下 完全contribute\
      \ as error。\n(d) REML vs Henderson：差异<1.5pp在所有组分上，component ranking完全一致。 REML在小方差组分上给出slightly\
      \ lower estimates（consistent with REML的bias correction特性）。\n(e) Logprob scoring：continuous\
      \ measure，item_id降至42.8%（因为logprobs capture graded confidence而非binary threshold），prompt主效应升至6.8%（不同prompts\
      \ 系统性shift logprob distribution）。G升至0.41（continuous scoring reduces measurement\
      \ error）。\n(f) Ranking stability：96.8%的条件组合下4个model ranking不变。 Flips仅发生在accuracy差<1pp的model\
      \ pairs在extreme conditions下（high temp + specific items）， 且flip direction不systematic。\n\
      (g) Higher-order interactions：3-way总计4.8%，最大的temp×seed×item(1.8%) 反映了在特定items上temperature和seed的joint\
      \ sensitivity。 Residual从12.0%降至7.2%，表明3-way interactions是residual的主要组成。\n"

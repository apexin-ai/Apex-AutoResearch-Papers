    result_rationale: 'CV of 19% reflects meaningful item-sampling uncertainty. MMLU
      has 14,042 items across 57 subjects with heterogeneous difficulty; stratified
      sampling with 200 items (1.4%) leaves substantial sampling variance especially
      in the tails. Sample 7 draws more hard items (mean difficulty 0.42), inflating
      between-item variance to 55% because the difficulty spread is wider (SD 0.32).
      Sample 99 draws more mid-difficulty items (mean 0.54, SD 0.25), compressing
      item_id to 44% because items cluster around the center. Despite magnitude variation,
      the qualitative hierarchy is preserved: item_id ranks #1 in all 3 samples, residual
      #2, prompt:item #3. This stability-in-rank with instability-in-magnitude is
      the key finding: the headline claim "item dominance ~50%" needs error bars,
      reported as "44-55% across independent 200-item stratified draws." The G-coefficient
      varies inversely (0.32-0.39) because higher item variance = lower generalizability
      of the benchmark score. This directly motivates D-study item-count recommendations
      with CIs, not point estimates — if your headline variance component shifts ±5pp
      with a different item draw, your optimal resource allocation shifts too.


    result_rationale: '14B models show 44% item_id (vs 48% at 8B) because higher capacity
      reduces floor effects — items that were impossible for 8B models become solvable
      at 14B, compressing between-item variance. The 4pp reduction is modest, suggesting
      item difficulty saturation is far from reached even at 14B. Model×item interaction
      rises to 25% (from 21%) because the dense-vs-reasoning-distilled architecture
      difference creates larger model-specific item profiles: DeepSeek-R1-Distill-14B
      excels on multi-step reasoning items (distilled from R1''s reasoning traces)
      while Qwen3-14B excels on factual knowledge items (larger pre-training corpus).
      This architecture-driven specialization is larger than the Llama-vs-Qwen difference
      at 8B. DeepSeek shows elevated temperature×item (8.5% vs Qwen''s 4.2%) because
      reasoning-distilled models produce chain-of-thought that branches more at sampling
      time — consistent with exp-002''s finding that reasoning tasks show higher temperature
      sensitivity. Model main effect at 7% (vs 5% at 8B) reflects the larger accuracy
      spread between dense and reasoning-distilled architectures. Precision effect
      remains negligible (0.3pp) — precision sensitivity does not increase with scale
      in this range. G-coefficient of 0.40 is slightly higher than 8B (0.37) because

      nothing substantial. This reframes the contribution: we provide the first item-level
      G-theory decomposition of precision effects, showing that precision:item (5%)
      exceeds precision main (3%). The model-dependence of FP32 degradation (1.5-7.2pp)
      is novel and suggests training-time precision choices affect inference robustness.
      For the paper: position FP32 degradation as supporting Yuan et al. (2025) with
      novel item×model granularity, NOT as a primary finding. Separability on MMLU
      is confirmed: infra×method = 0.4% binary, 2.2% text-match (precision×temperature
      only). CIs deferred to exp-004.

      '

    result_rationale: 'Model-as-facet reanalysis是worst档的核心打击。Model从fixed变为crossed
      random facet，item_id从37.8%暴跌至15.2%——差值大部分被model×item interaction（33%）吸收。解读：prior
      work treating model as fixed，系统性地将model-specific item难度差异misattributed to "item
      difficulty"。一个item在Qwen3上easy但Mistral上hard——这不是item difficulty，而是model×item
      interaction。Model×item=33%意味着item"难度"不是items的intrinsic property，而是item-model
      pair的joint property，从根本上质疑IRT和G-theory中"item difficulty is a stable attribute"的假设。

      Bootstrap CIs devastating：item_id (model-fixed) CI=[0.27, 0.48], width=0.21。45%的bootstrap
      samples中item_id是largest，38%中model×item是largest。Component ranking本身不稳定——无法reliably
      claim任何single component "dominates"。

      D-study projections跨benchmark CONVERGE：G≥0.90需要的items在MMLU(480)、GSM8K(420)、ARC(450)、HellaSwag(440)上差异仅60
      items。CI宽度（180-200 items）远大于cross-benchmark range，benchmark间差异statistically
      indistinguishable。这消灭了"benchmark-specific budgets"贡献。

      REML vs Henderson Method I在item_id上分歧5.7pp（REML=32.1%, Henderson=37.8%），estimation
      method choice也是方差来源，支撑meta-methodological argument。

      Model ranking stability：precision×temperature在4个model-pair comparisons中翻转ranking——即使"small"
      interactions也有practical significance for model comparison。

      '

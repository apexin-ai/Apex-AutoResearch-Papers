      narrative_direction: 'Core framing pivots from "cross-benchmark gradient" to
        "irreducible uncertainty in variance attribution." The new angle: variance
        decomposition ITSELF is unstable — the answer to "what drives evaluation variance"
        depends on which items you sample, which models you include, and how you specify
        the G-theory design. This is a meta-methodological finding: G-theory (and
        by extension ANOVA-based decomposition à la Bouthillier) gives point estimates
        that are sensitive to design choices practitioners treat as arbitrary. Reframe
        Claim 1 as: "item dominance estimates are sample-unstable (CV>30%), meaning
        single-sample variance decompositions — including all prior work — overstate
        certainty about what matters." Reframe Claim 2 as: "model×item interaction
        is the dominant neglected term; treating model as fixed (as all prior G-theory
        work does) systematically misattributes variance to items." Reframe Claim
        3 as: "reproducibility budgets must include uncertainty quantification on
        the budget itself — current D-study projections inherit the instability of
        the underlying G-study." This pivot preserves the same venue target (AAAI
        evaluation methodology) with a more cautionary but equally novel message.
        The hook becomes: "We set out to build reproducibility budgets for LLM evaluation
        and discovered that the budget itself is unreliable — variance decomposition
        is a measurement, not a fact, and current methods give false precision." Requires
        exp-001b resampling data as the centerpiece. Timeline: likely slips to ACL
        ARR October to accommodate the reframing and additional resampling experiments.'

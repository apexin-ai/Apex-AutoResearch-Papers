    result_rationale: 'MVP的precision主效应(0.87%)和precision×item(7.24%)源于float32使用不同vLLM
      engine路径（V1 CUDA graph vs V0 eager）， 导致FP32准确率系统性偏低5.7pp。统一V0 enforce_eager后三种精度走同一compute
      path， FP32/BF16/FP16准确率差收敛至0.5pp内（纯numerical noise水平，符合IEEE 754 rounding差异预期）。

      Precision释放的~6%方差重新分配：precision×item从7.2%→1.8%（剩余为genuine numerical sensitivity
      on boundary items）， precision主效应从0.87%→0.3%，释放的份额主要回流到residual（+3.1pp）和小量到item_id（+0.2pp），
      因为之前被precision confound扭曲的item-level patterns现在归入正确组分。

      4个模型均以item_id为rank-1（51.6%-60.2%），因为MMLU的item difficulty分布（从trivial factual
      recall到 expert-level reasoning）在所有7-9B instruction-tuned模型上产生类似的accuracy ceiling/floor效应。
      Gemma-2最高(60.2%)因其instruction-tuning使easy items更稳定（floor更高）， Mistral最低(51.6%)因其在部分domain上accuracy分布更平坦（difficulty
      gradient被压缩）。

      200 items分层采样比MVP的50 items提供更稳定的方差估计，SE减半，CI收窄~50%。

      Text-exact-match指标复现MVP pattern：prompt×item主导(36.2%)而非item_id(21.8%)， 因为不同prompt
      template导致model生成不同格式的答案字符串（"A"/"(A)"/"The answer is A"）， 这种格式变异是item-specific的（有些items的答案format更鲁棒）。
      precision×temperature在text-match下仍检出1.4%（CI不含零），确认floating-point non-associativity效应。

      '

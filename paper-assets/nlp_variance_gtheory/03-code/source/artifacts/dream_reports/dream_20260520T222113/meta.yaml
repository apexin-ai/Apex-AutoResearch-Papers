      MMLU needs 420 items for G≥0.90 vs HellaSwag 240, a 1.75× ratio. This is directionally
      useful but less dramatic than a clean gradient would predict — the practical
      message is "50-75% more items for knowledge vs reasoning benchmarks," not "3×
      more items." D-study CIs on MMLU G≥0.90 ([350, 510]) show that even the recommended
      item count is imprecise. REML and Henderson agree to within 2.1pp — methodological
      choice doesn''t affect qualitative conclusions. Logprob scoring increases item_id
      to 55% on MMLU because continuous logprobs capture fine-grained difficulty more
      sensitively than binary 0/1. Model rank flips occur in 12% of condition pairs,
      driven entirely by temperature=1.0 (high-temperature conditions produce enough
      noise to flip rankings of close models); precision never causes rank flips.
      Three-way interactions total 3-5% — most variance is captured by main effects
      and 2-way terms.

      '

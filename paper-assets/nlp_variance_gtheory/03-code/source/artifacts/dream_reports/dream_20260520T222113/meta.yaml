      structure不因scale改变。 Item_id在两个14B上均为rank-1：Qwen3-14B(54.8%)落在8B range(51.6%-60.2%)内，
      DeepSeek-R1-Distill-14B(50.2%)也在range内但偏低端。

      Qwen3-14B的variance profile几乎identical to Qwen3-8B（scaled up但structure preserved），
      因为item difficulty的relative ordering不随model scale改变——easy items仍easy，hard items仍hard，
      只是accuracy ceiling整体上移。

      DeepSeek-R1-Distill-14B的profile略有不同：temp×item更高(8.8% vs 8B mean 5.9%)， seed×item更高(5.2%
      vs 3.0%)，residual更高(20.8%)。原因：reasoning distillation引入了 implicit chain-of-thought倾向，即使在MMLU这种knowledge
      task上也会触发extended reasoning， 增加了generation-level stochasticity。这个pattern类似于GSM8K在8B上的表现——
      suggesting that reasoning-tuned models在所有benchmarks上都shift toward更高的interaction
      terms。

      Precision主效应在14B上同样negligible(0.2%)，确认confound fix与model size无关。


    result_rationale: 'MATH shows the lowest item dominance (28% model-as-facet) because
      multi-step mathematical proofs introduce maximal chain-of-thought variance.
      Unlike GSM8K''s mostly arithmetic word problems, MATH items require proof strategies
      (induction, construction, algebraic manipulation) with multiple valid approaches
      — temperature and seed determine which strategy the model attempts, making temp:item
      (14%) and seed:item (11%) jointly exceed item_id. The 38% overall accuracy (8B
      models on MATH) creates strong floor effects: ~40% of items are never solved
      regardless of conditions (zero variance), ~20% are always solved (zero variance),
      and the remaining ~40% of "mid-difficulty" items carry nearly all the variance
      — and on these items, condition sensitivity is extreme. G-coefficient at 0.52
      (highest of all benchmarks) is counterintuitive but correct: the items that
      8B models CAN solve are consistently solved (low relative error), so the universe
      score is reliable despite high absolute variance. Model×item at 22% is the highest
      across benchmarks because dense vs reasoning-distilled architectures diverge
      most on proof items: DeepSeek-R1-Distill can solve certain proof items that
      no other 8B model touches, creating large model-specific item effects. Adding
      MATH extends the 2-cluster gradient to a potential 3-tier structure with 20pp
      total spread (48-28%), strengthening the cognitive-complexity narrative. Infra×method
      at 2.5% binary confirms the GSM8K pattern: math-heavy generation shows detectable
      precision×methodology interaction. Under text-match, MATH prec×temp reaches
      4.2% (the highest single infra×method interaction) because proof-format outputs
      are extremely sensitive to token-level differences.


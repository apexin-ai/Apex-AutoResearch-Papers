      Hardware×methodology=4%直接breaks Claim 2：methodology因子的效应是hardware-conditional的——同一prompt在GPU1上增加accuracy
      2pp，在GPU2上可能降低1pp。Infrastructure和methodology不可分离。

      Hardware×precision=3.5%说明precision choice的影响也是GPU-dependent的——BF16在GPU1上比FP16好，GPU2上可能相反。

      Total hardware-related variance=14%，大于precision-related（~6%），说明hardware是比precision更重要但被忽视的方差来源。Item_id从exp-001的37.8%降至33%——single-GPU
      design系统性高估item dominance，hardware×item被misattributed to item_id。


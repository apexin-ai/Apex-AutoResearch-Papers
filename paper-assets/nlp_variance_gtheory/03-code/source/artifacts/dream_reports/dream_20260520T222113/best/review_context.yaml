    models_showing_consistent_gradient: 4
    precision_main_under_0_5pct_all_benchmarks: true
  result_rationale: 'Cross-benchmark gradient的机制：MMLU(56%) > ARC(42%) > HellaSwag(34%)
    > GSM8K(25%)。

    MMLU是knowledge-retrieval：item difficulty是intrinsic属性——你要么知道，要么不知道。 不同temperature/seed对答案选择的影响很小，因为在logit
    space中correct answer的probability 要么远高于threshold（easy items）要么远低于（hard items）。只有narrow
    difficulty band 内的items对generation parameters敏感。结果：item_id dominates at 56%。

    GSM8K是multi-step math reasoning：同一item在不同seeds/temperatures下产生qualitatively不同的
    推理链。具体地：(1) 每个推理步骤是independently sampled，温度直接影响每步的token distribution， 多步累积效应使temperature×item达到18.2%——对比MMLU的5.9%，涨幅3×；
    (2) random seed决定了initial token choice，不同seed走不同reasoning path， 某些items（multi-step
    word problems）对seed极度敏感而simple arithmetic几乎不受影响， 故seed×item达到15.8%——对比MMLU的3.0%，涨幅5×；
    (3) item_id降至25%不是因为items不重要，而是因为"intrinsic difficulty"只是total difficulty的一部分——
    在reasoning tasks中，difficulty = intrinsic complexity + generation path stochasticity。

    ARC-Challenge混合了factual recall（类似MMLU）和multi-hop reasoning（类似GSM8K）， 所以item_id(42%)落在两者之间。具体来说，ARC的science
    questions中factual questions （"What is the boiling point of water?"）贡献高item_id，而multi-hop
    questions （"Which of these would happen if..."）贡献高interaction terms。

    HellaSwag是commonsense completion：需要生成continuation的判断涉及implicit reasoning 但步骤较少（通常1-2步推理），介于knowledge和full
    reasoning之间。 Distractor quality的item-level variation是item_id的主要贡献（有些items的wrong
    answers显而易见，有些极难区分），但generation sensitivity高于MMLU。

    所有benchmark上precision主效应均<0.3%（均为engine confound fix后的clean estimates）， infra×method<0.3%，确认separability
    across benchmarks。

    4/4 models在每个benchmark上都展示相同的gradient pattern，排除了model-specific artifact。

    '

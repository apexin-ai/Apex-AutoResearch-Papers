- name: LayerCast precision mitigation
  plan_id: exp-007
  description: '4 models × LayerCast (FP16 storage + FP32 compute) × 6 prompts × 6
    seeds × 3 temperatures × 4 orderings × 200 MMLU items = 172,800记录。 作为第4种precision
    condition加入exp-001 analysis。

    '
  expected_results:
    total_records: 172800
    layercast_accuracy_mean: 0.668
    layercast_vs_fp32_diff_pp: 0.4
    layercast_vs_bf16_diff_pp: -0.1
    layercast_item_agreement_fp32: 0.9993
    layercast_item_agreement_bf16: 0.9995
    layercast_added_precision_variance: 0.0003
    layercast_precision_x_item: 0.008
    layercast_throughput_vs_fp32: 1.42
    layercast_throughput_vs_bf16: 0.92
    layercast_vram_gb: 16.2
  result_rationale: 'LayerCast在存储时用FP16减少memory footprint，compute时cast to FP32， 因此numerical
    behavior几乎等同于纯FP32（same computation path，仅storage时有precision loss）。 FP16 mantissa
    10 bits vs FP32 23 bits的差异对大部分weights negligible （pre-trained weights本身就是从BF16/FP16训练来的）。

    Accuracy差异：vs FP32仅0.4pp（storage precision loss的residual effect）， vs BF16仅0.1pp（BF16和LayerCast都是"FP32-adjacent"precision
    modes）。 Item agreement > 99.93%确认LayerCast不改变per-item measurement outcome。

    对precision方差的增量贡献仅0.03%——essentially zero。 Throughput比FP32快42%（memory bandwidth节省：16.2GB
    vs 31.2GB）， 比BF16慢8%（cast operation overhead）。

    这为paper提供了practical mitigation recommendation：如果practitioner 担心precision影响（尽管engine
    confound fix后影响已minimal）， LayerCast以acceptable overhead提供FP32-equivalent numerical
    behavior。

    '

    configurations下产生consistent accuracy variation。 Item difficulty是task-intrinsic
    property，不随optimizer state改变。

    RTE的item_id最低(35.8%)，seed最高(13.2%)，因为小数据集(2.5K examples)使 fine-tuning对seed极度敏感——不同random
    initializations导致qualitatively不同的 loss landscape traversals，而小数据量意味着optimizer更容易overfit
    to specific data ordering。这是dataset size调节variance structure的evidence。

    GPU和precision主效应在fine-tuning中同样negligible(<0.5%)，因为RoBERTa-large 对numerical precision不敏感（encoder-only
    architecture无autoregressive error accumulation）。

    Fine-tuning G current practice仅0.26（1 seed, 1 LR, full dataset）， 说明单次fine-tuning
    run的结果不具备adequate reliability。

    '

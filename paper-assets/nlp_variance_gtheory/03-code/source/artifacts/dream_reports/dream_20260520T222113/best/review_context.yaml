  result_rationale: 'MATH是cross-benchmark gradient的"stress test"。Item_id(21.0%)仅以微弱优势维持rank-1——
    temp×item(20.8%)几乎与之并列。这是5个benchmark中item dominance最弱的， 因为MATH的multi-step proof-like
    reasoning生成了最长的CoT（平均4-8步 vs GSM8K的2-4步）， 使每一步的temperature sensitivity在item level
    cumulative。

    具体机制：Level 1 algebra（answer in 1-2 steps）几乎不受temp/seed影响， Level 5 competition
    math（answer in 6-10 steps）对temp/seed极度敏感。 这种item-level heterogeneity产生了massive
    interaction terms（temp×item 20.8%, seed×item 17.4%）。

    Overall accuracy仅32.4%——接近random guessing baseline(25% for 4-choice)—— 增加了binary
    scoring下的floor effect，膨胀residual中的"guessing noise"成分。

    G current practice仅0.10——5个benchmark中最低。 这意味着MATH evaluation在current practice下essentially
    unreliable。 D-study：G≥0.90需要120 items + 4 prompts + 12 seeds = 5,760 evaluations——
    seed投入最大，是典型的seed-limited benchmark。

    5-benchmark gradient完整：MMLU(56%) > ARC(42%) > HellaSwag(34%) > GSM8K(25%) > MATH(21%)。
    Spread扩大到35pp（56-21），pattern perfectly monotonic。 这quantitatively captures "reasoning
    intensity ↑ → item_id share ↓"。

    '

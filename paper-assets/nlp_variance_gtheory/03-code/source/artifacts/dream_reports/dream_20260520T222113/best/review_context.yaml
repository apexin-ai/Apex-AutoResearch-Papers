narrative_guidance: 'Cross-benchmark gradient是primary finding且远比第一版dream更陡峭： MMLU(56%)
  > ARC(42%) > HellaSwag(34%) > GSM8K(25%)，spread 31pp。 reasoning tasks的CoT stochasticity将massive方差从item_id转移到seed×item和temp×item（各15-25%），
  这解释了为什么prior single-benchmark studies得出看似矛盾的结论。

  核心升级："optimal evaluation protocol reverses across task types"—— MMLU是item-limited（需420
  items for G≥0.90），GSM8K是seed-limited（需10+ seeds for G≥0.90）。 "Universal reproducibility
  recipe is illusory"被数据完全支持，且比预期更强。

  Model-as-facet分析cleanly提取model×item（~10%），item_id降至49%但仍为最大单一组分。 Bootstrap CIs tight（4-6pp宽度）且benchmark间不重叠——gradient具有full
  statistical significance。 Separability是clean confirmatory null（hardware×methodology
  <0.3%）。

  三条claim全部成立无需弱化。AAAI "evaluation methodology" track投稿正常推进。 Lead figure: 4-benchmark
  stacked bars展示variance structure的系统性迁移， signature visual直接支撑"no universal recipe"叙事。

  '

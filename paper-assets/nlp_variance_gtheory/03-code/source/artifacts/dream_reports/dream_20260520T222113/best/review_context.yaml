    universal recipe"叙事。关键observation：MATH是item dominance的"near-collapse point"——
    item_id(21.0%)和temp×item(20.8%)几乎并列，suggesting that for tasks with even longer
    reasoning chains (e.g., formal proofs, multi-document QA), item_id可能不再是rank-1。

    这是P2实验但高度complementary：如果included，paper从4-benchmark gradient 升级为5-benchmark gradient，trend更convincing，slope

  result_rationale: "(a) Model-as-facet：在MMLU数据中加入model作为crossed random facet后，model×item吸收10.2%方差。\
    \ 这10.2%来源：约6.8%从pooled item_id提取（因为model-specific item difficulty patterns 在pooled分析中被归入item主效应），约3.4%从residual提取（因为model-specific\
    \ noise 在pooled分析中被归入unexplained error）。item_id从56.0%降至49.2%但仍为最大单一组分， residual从20.7%降至12.0%（大幅改善模型拟合）。\n\

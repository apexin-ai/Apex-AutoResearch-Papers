  result_rationale: 'Hardware主效应0.4%反映两块GPU的微架构差异（不同SM count、memory bandwidth、kernel
    scheduling）， 但这些差异是systematic fixed offset，不是random——同一model在GPU2上一致性地偏低0.3pp。

    hardware×methodology total仅0.17%，远低于1%阈值。原理：hardware层影响numerical computation （tensor
    core routing、memory alignment），methodology层影响token sampling （prompt→attention
    pattern、seed→RNG state、temperature→softmax scaling）。 两者的交叉点（GPU微架构如何影响不同prompt下的sampling
    distribution） 在logit space中被softmax压缩到negligible水平——除非logits在decision boundary附近
    （这是hardware×item交互的来源：boundary items对numerical precision敏感）。

    hardware×item(1.6%)比hardware主效应(0.4%)大4×，因为特定items （logit difference between correct
    and nearest distractor < 0.01）在不同GPU上 因kernel tiling和memory access pattern差异产生不同numerical
    path。 但这只影响~5%的boundary items。

    GPU间accuracy correlation 0.9992说明hardware几乎不改变measurement outcome。 Model rankings
    across all conditions完全preserved——无ranking flip。

    这是clean confirmatory null：validates isolated-factor studies的implicit separability
    assumption， 同时hardware×item的non-zero值提供了nuanced story。

    '

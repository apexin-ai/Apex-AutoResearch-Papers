      Paper中需要一段话说明item sampling variability，并argue 200 items from stratified sample
      是reasonable compromise between computational cost和representativeness。 可以用D-study
      framing：即使item_id在55-64%之间vary，核心结论（item是最大variance source， 远大于precision/prompt/seed的main
      effects）在所有sample中都成立。

      '
  - name: Multi-benchmark replication (GSM8K, ARC-Challenge, HellaSwag)
    plan_id: exp-002
    description: '4 models × 2 precisions (BF16/FP16) × 6 prompts × 6 seeds × 2 temperatures
      × 4 orderings 在GSM8K、ARC-Challenge、HellaSwag各200 items上。测试cross-benchmark variance
      gradient。

      '
    expected_results:
      gsm8k_total_records: 230400
      gsm8k_item_id_cross_model_pct: 32.5
      gsm8k_model_x_item_pct: 38.7
      gsm8k_prompt_x_item_pct: 8.2
      gsm8k_residual_pct: 14.3

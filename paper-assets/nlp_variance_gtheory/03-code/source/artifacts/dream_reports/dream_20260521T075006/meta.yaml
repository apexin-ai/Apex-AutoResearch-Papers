    result_rationale: 'Gradient叙事死掉的核心原因：item_id跨4个benchmark的range仅5.7pp （38.4%-44.1%）。原假设是knowledge
      benchmarks（MMLU）有高item_id（>55%）， reasoning benchmarks（GSM8K）有低item_id（<30%），形成20+pp的gradient。
      实际结果是所有benchmark都落在38-44%的狭窄区间内。 为什么flat？model×item交互在所有benchmark上都在30-36%——这意味着无论
      task type如何，模型间的item difficulty ranking disagreement程度类似。 直觉上，这是因为7-9B模型在knowledge和reasoning
      tasks上都有类似程度的 model-specific strengths/weaknesses：Llama在MMLU的history和GSM8K的
      word problems上都相对strong，Mistral在MMLU的STEM和GSM8K的multi-step上 都相对weak——model-specificity的pattern在task
      types之间有一致性。 G_item跨benchmark从0.668到0.820变化较大（range=0.152），但这主要由 residual差异驱动而非model×item差异。GSM8K和HellaSwag的G_item低
      （0.668-0.682）是因为higher residual（22.6%和17.4%+更高的prompt×item）， 不是因为model×item更大。
      IRT ratio在GSM8K（1.7×）和HellaSwag（1.6×）上collapse到<2×，原因是 这些benchmark的IRT也需要更多items（item
      discrimination更uniform， 2PL model的efficiency advantage减弱），所以分母增大、ratio压缩。 MMLU上IRT仍然只需~120
      items因为items有strong discrimination gradients （从trivial到impossible跨57 subjects），2PL拟合效率高。
      Cross-benchmark separability failure（max=4.8% on HellaSwag binary） 原因：HellaSwag的sentence
      completion任务对precision和temperature的 交互更敏感——不同precision下temperature>0生成的completions有更多
      divergence，且binary scoring的粒度在这类任务上captures了更多差异。 D-study cross-bench Δ=0.032-0.058意味着MMLU-derived
      budgets在其他 benchmark上systematically overestimate reliability by 3-6pp。这是因为 MMLU的residual较低（19.5%）相对于GSM8K（22.6%）——更多unexplained
      variance意味着需要更多observations来stabilize。

      '

  - name: LayerCast precision mitigation
    plan_id: exp-007
    description: 'LayerCast (FP16 storage + FP32 compute) as additional precision
      condition on MMLU。 量化这种precision mitigation的variance reduction效果。

      '
    expected_results:
      layercast_accuracy: 0.6821
      layercast_vs_bf16_delta_pp: 0.07
      layercast_vs_fp16_delta_pp: 0.05
      layercast_item_id_pct: 60.8
      layercast_precision_effect_when_included_pct: 0.0003
      layercast_precision_x_item_when_included_pct: 0.02

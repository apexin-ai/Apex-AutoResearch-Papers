    result_rationale: 'exp-004是分析工作，不产生新数据，其结果质量由上游实验数据决定。Median档特征体现在：

      (1) IRT/G-theory ratio在benchmarks间varies 2.8-4.7×（median档的[2.5, 5.0]）。 MMLU的4.4×接近best档预期，但HellaSwag的2.8×拉低了range。HellaSwag
      ratio低是因为 其residual-dominance意味着G-theory和IRT都面临similar irreducible noise—— 两者的差异主要来自prompt/seed/ordering
      facets，而HellaSwag的这些facets也不够separable。 这使得"G-theory需要N×更多items"的claim变成benchmark-dependent的，不能给single

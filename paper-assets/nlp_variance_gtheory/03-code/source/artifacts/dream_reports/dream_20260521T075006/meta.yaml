        LayerCast replaces FP32
      G_binary_with_layercast: 0.614
      compute_overhead_vs_fp16_pct: 12
    result_rationale: 'LayerCast本质上是FP16+FP32的hybrid——storage in FP16, compute in
      FP32。 其accuracy与BF16/FP16几乎identical（Δ<0.1pp），因为BF16≈FP16已经established (D005)，
      而FP32 anomaly是vLLM artifact不是genuine precision benefit。LayerCast therefore不提供
      meaningful accuracy improvement over BF16/FP16，但也不hurt。

      当LayerCast替代FP32加入variance decomposition时，precision effects进一步collapse—— 从already-small的0.0006%
      (BF16 vs FP16) 到trivial的0.0003%。这是because LayerCast  produces outputs nearly
      identical to FP16。Precision×item interaction也negligible。

      在median档下这个结果是clean但不exciting——"precision mitigation works but isn''t needed  because
      precision effects are already negligible after removing FP32 confound"。 12%
      compute overhead for no meaningful benefit。

      Paper价值：作为completeness/practitioner guidance——"if concerned about precision,  LayerCast
      adds 12% compute cost for no detectable reliability improvement over BF16"。
      One paragraph in Results or appendix。

      '
    tables:

    result_rationale: 'item_id在single-model中占61.1%因为MMLU以factual knowledge为主，item难度
      具有跨条件稳定性——一道关于细胞生物学的难题在任何prompt/seed下都难。引入model facet后item_id降至42.1%（↓19pp），因为33.6%的variance被model×item吸收：
      不同模型对同一item的难度排序不同（如Llama在历史题上强，Qwen在数学相关STEM题上强）， 这部分"model-conditional item
      difficulty"在single-model分析中被错误归入item_id。 G_item=0.820表明4个模型的item difficulty排序moderately
      consistent但远非完美， 需要~10模型才能达到G≥0.90。D-study Δ=0.004是因为G-theory的D-study公式对 balanced
      designs有精确的方差分量线性组合形式，3-model估计已相当稳定。 BF16≈FP16（0.0006%）因为bf16和fp16的有效精度对logit差异的影响远小于
      binary scoring的classification boundary margin。Leave-one-model-out spread=0.023
      因为4个模型来自4个不同architecture family，每个都贡献了独特的item interaction pattern——去掉任何一个都只轻微改变平均interaction结构。REML<0.5pp差异因为
      balanced design下Henderson I是unbiased的。

      '

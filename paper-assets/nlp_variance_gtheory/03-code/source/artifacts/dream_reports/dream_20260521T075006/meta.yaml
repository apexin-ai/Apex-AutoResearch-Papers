      item_id=61%, residual=24%, 其他facets。右bar: item_id=42%, model×item=34%, residual=20%。视觉冲击：model×item从无到34%。'
    - 'Fig 2: D-study projection curve — G vs number of models (3→4→5→8→10→15→20)。标注G≥0.80
      threshold在~4 models, G≥0.90在~10 models。4-model actual point与3-model prediction
      curve重合（Δ=0.004）。'
    analysis: 'MMLU数据是median档最坚实的部分。42%→34%的item_id→model×item分裂是清晰的、可复现的、 有理论基础的（不同模型的item
      difficulty profile不同是psychometrics的基本预期， 但33.6%的magnitude是新的经验发现）。D-study validation
      Δ=0.004是方法论上的强证据。 Median档的风险不在exp-001本身，而在exp-002能否将这个story扩展到MMLU之外。

      '
  - name: Item resampling stability test
    plan_id: exp-001b
    description: '3个独立的200-item stratified sample（seeds 0, 7, 99）× Llama × 3 precisions
      × 3 prompts × 3 seeds × 2 orderings。 测试item_id dominance是否稳定还是200-item sample的artifact。

      '
    expected_results:
      sample_0_item_id_pct: 59.3
      sample_7_item_id_pct: 63.8
      sample_99_item_id_pct: 55.1
      cv_item_id: 0.073
      sample_0_G_binary: 0.345
      sample_7_G_binary: 0.371
      sample_99_G_binary: 0.328
      cv_G_binary: 0.063
      mean_item_id_pct: 59.4

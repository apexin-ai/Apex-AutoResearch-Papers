      decomposition几乎视觉identical，hardware-related components用 虚线outline标注但因太小几乎不可见。配inset放大图展示hardware×methodology
      interaction在binary（0.18%）vs text（0.72%）下的差异。

      '
    analysis: 'Separability在binary scoring下通过两个independent GPU architecture confirmed
      （0.18% < 0.5% threshold），直接支持Claim 2。这意味着prior isolated-factor  studies（如Yuan
      et al. 2025只研究hardware，Brittlebench只研究prompt）的 结论在aggregate level上可以合法组合——infrastructure和methodology的effects不
      interact。但metric qualification仍然critical：text scoring下interaction升至 0.72%，虽仍<1%但已非negligible。Hardware×item的0.31%提示separability是
      conditional on aggregation level——at the item level, hardware effects are  item-specific，practitioners不能假设"换GPU对所有items影响一样"。

      '

      arc_G_item: 0.768
      arc_separability_binary_pct: 1.8
      arc_d_study_delta_vs_mmlu: 0.026
      arc_irt_gtheory_ratio: 4.7
      hellaswag_total_records: 230400
      hellaswag_item_id_cross_model_pct: 28.1
      hellaswag_model_x_item_pct: 19.6
      hellaswag_residual_pct: 31.8
      hellaswag_prompt_x_item_pct: 11.2
      hellaswag_G_item: 0.724
      hellaswag_separability_binary_pct: 0.7
      hellaswag_d_study_delta_vs_mmlu: 0.028
      hellaswag_irt_gtheory_ratio: 2.8
      item_id_range_across_benchmarks_pp: 13.7
      item_id_ordering: MMLU(42.1) > ARC(39.8) > GSM8K(32.5) > HellaSwag(28.1)
      gradient_monotonic: false
      gradient_break_benchmark: ARC-Challenge
      anomalous_benchmark: HellaSwag
      anomalous_reason: residual dominates (31.8%), item_id + model×item together
        < 50%
      cross_bench_G_item_min: 0.724
      cross_bench_G_item_max: 0.82
    result_rationale: 'Median档的核心特征：gradient exists but not cleanly monotonic。

      GSM8K (math reasoning): item_id降到32.5%（vs MMLU 42.1%）因为math items的difficulty更依赖
      model-specific reasoning能力——同一道algebra题对Qwen可能trivial但对Mistral impossible， 导致model×item=38.7%超过item_id成为最大source。这是"task-type
      matters"的最强证据， 但也意味着simple gradient narrative不成立——在GSM8K上model×item>item_id，打破了
      "item_id always dominates"的pattern。G_item=0.743因为items在models间less generalizable。
      IRT/G-theory ratio=3.1，低于MMLU的3.8，因为GSM8K的prompt sensitivity较低（math格式更固定）。

      ARC-Challenge: item_id=39.8%接近MMLU，但本应比MMLU低（science reasoning harder than knowledge）。
      实际上ARC没有按expected gradient排列——它的item_id比GSM8K高，打破了 "knowledge→science→math→commonsense"的monotonic
      gradient。原因：ARC的4-choice format 与MMLU类似，format consistency导致item_id structure类似。但separability=1.8%是所有benchmark
      中最高的（仍在median档的[0.5, 2.0]内），可能因为ARC的science reasoning对precision 有非trivial sensitivity。这是gradient
      non-monotonicity的关键anomaly。

      HellaSwag: 最anomalous——residual=31.8%占主导，item_id+model×item together < 50%。
      原因：HellaSwag的commonsense completion format使得prompt variation的影响大于其他benchmark
      （prompt×item=11.2%），而item difficulty对所有models都偏向easy or hard extremes （ceiling/floor
      effect），压缩了item_id的range。这是median档要求放appendix讨论的 anomalous benchmark。HellaSwag作为anomaly其实enriches
      the story—— 证明了"no universal recipe"的claim。

      Gradient总结：MMLU(42)→ARC(40)→GSM8K(33)→HellaSwag(28) 的item_id确实存在下降趋势 （range=13.7pp，在[8,14]内），但ARC和GSM8K的顺序与naive
      task-complexity prediction不符。 不能claim monotonic gradient，只能说"benchmark-conditional
      variance structure"。

      '
    tables:
    - name: 'Table 5: Cross-benchmark Variance Decomposition (4 models, crossed design)'
      description: '4 benchmarks × 主要variance components。每行一个benchmark，列为item_id,
        model,  model×item, prompt×item, seed×item, precision effects, residual。 Highlight:

      (2) D-study cross-benchmark delta在[0.018, 0.028]，在median档的[0.01, 0.03]内。 MMLU的D-study
      prediction极准（Δ=0.004），但GSM8K和HellaSwag的D-study projection 有更大uncertainty因为variance
      structure本身less stable。HellaSwag需要685 items for G≥0.80 （vs MMLU的414），因为residual
      dominance意味着更多items只能incrementally改善G。

      (3) Power analysis显示对3% interaction有94% power（足够），但对1% interaction只有71%—— 这意味着exp-003的hardware×methodology=1.4%在统计上borderline

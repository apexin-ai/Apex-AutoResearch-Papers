    # Dream Review Report: "The Hidden Second Factor: Model×Item Interaction Accounts
    for 34% of LLM Evaluation Variance"


    **Review mode:** full | **Venue:** AAAI (1–10 scale) | **Reviewers:** R1 (Methods
    & Experiments), R2 (Novelty & Related Work)


    ---


    ## 1. Paper Summary


    This paper applies Generalizability Theory (G-theory) to decompose LLM evaluation
    variance across multiple facets (items, models, prompts, seeds, temperature, precision,
    orderings, hardware) simultaneously. Using 4 open-weight models (7–9B) on 4 benchmarks
    (MMLU, GSM8K, ARC-Challenge, HellaSwag) totaling ~2.3M evaluation records, the
    paper claims three contributions: (1) model×item interaction accounts for 33.6%
    of cross-model MMLU variance — the "hidden second factor" — while single-model
    analyses inflate item dominance from 42% to 61%; (2) G-theory requires 1.6–4.1×
    more items than IRT for reliable measurement, with the ratio being benchmark-dependent;
    (3) variance structure is approximately benchmark-invariant (item dominance range
    = 5.7pp across 4 benchmarks).


    ---


    ## 2. Reviewer Scores (Post-Roundtable)


    | Dimension | R1 (Methods) | R2 (Novelty) |

    |---|---|---|

    | Soundness | 6 | — |

    | Empirical Rigor | 6 | — |

    | Novelty | — | 5 |

    | Related Work | — | 5 |

    | Significance | — | 5 |

    | Presentation | 6 | 5 |

    | **Overall** | **6** | **5** |

    | Confidence | 4/5 | 4/5 |


    **Converged Overall: 5 (Borderline)** — Lean toward weak reject. The core empirical
    finding (model×item quantification + D-study validation) is genuine and valuable,
    but narrow novelty over Mesting (2026), a weak third contribution, unresolved
    binary-data methodology, and scope limitations place the paper below the acceptance
    threshold in its current form.


    ---


    ## 3. Strengths (Consensus)


    **S1. Model×item interaction quantification is the paper''s genuine contribution.**
    Both reviewers agree that treating model as a crossed facet — revealing 33.6%
    model×item interaction and the 19pp single-model inflation effect — is informative
    and well-supported. This is not merely a technical G-theory extension; it has
    direct practical implications: item selection strategies based on single-model
    difficulty will not generalize across models.


    **S2. D-study out-of-sample validation is compelling.** The 3-model prediction
    of G_item=0.816 vs. 4-model observed 0.820 (Δ=0.004) demonstrates that G-theory''s
    projective machinery has genuine predictive validity in LLM evaluation. This is
    the strongest piece of evidence in the paper and was not demonstrated by Mesting
    (2026).


    **S3. IRT vs. G-theory head-to-head fills a real gap.** The first direct quantification
    of the item-cost gap between IRT (e.g., tinyBenchmarks) and G-theory, with the
    benchmark-dependent ratio (1.6×–4.1×) tied to item discrimination properties,
    gives practitioners a concrete calibration between frameworks.


    **S4. Robustness battery is unusually thorough.** Nine validation analyses (null
    simulation, REML, bootstrap vs. jackknife, fixed vs. random sensitivity, resampling
    stability, BF16/FP16 sensitivity, LOMO, temperature stratification, D-study verification)
    exceed the standard for empirical NLP papers. The FP32 confound discovery (vLLM
    `enforce_eager` artifact) is exemplary transparent practice.


    **S5. Scale is impressive.** ~2.3M records across 4 benchmarks, 4 models, with
    full factorial crossing on MMLU, is the largest G-theory study in LLM evaluation
    to date.


    ---


    ## 4. Weaknesses (Consensus)


    **W1. [Critical] Binary data in ANOVA-based G-theory lacks adequate theoretical
    defense.** Henderson Method I assumes approximately normal responses. Binary 0/1
    data violates this. The null simulation (737× ratio) proves signal exists but
    does not demonstrate unbiased variance component estimates. The Bernoulli variance
    correlation (r=0.91 between p(1−p) and observed item variance) indicates substantial
    mechanical confounding — benchmarks near 50% accuracy will show higher item_id
    variance purely from the Bernoulli ceiling, potentially creating artifactual cross-benchmark
    differences. The paper cites Jiang & Skorupski (2017) on logistic-link generalized
    G-theory but does not implement it. The logprob scoring analysis (tighter 3.5pp
    cross-bench range) partially mitigates this but is not the primary analysis. **Both
    reviewers identify this as the most damaging methodological gap.**


    **W2. [Critical] Contribution 3 (benchmark-invariance) is a post-hoc reframe of
    a failed hypothesis.** The original hypothesis was a systematic gradient from
    knowledge to reasoning benchmarks; this failed (R²=0.12). The reframing as "approximate
    invariance" (5.7pp range) is not dishonest but feels post-hoc. The 5.7pp spread
    is not obviously "narrow" given that individual benchmark CIs span 10–13pp. No
    pre-specified criterion for what constitutes "narrow" vs. "wide" is provided.
    The D-study cross-benchmark transfer error (Δ=0.032–0.058) further undercuts the
    extrapolation claim — 3–6pp G-coefficient error on a 0.80 target is 4–7.5% relative
    uncertainty.


    **W3. [Major] Novelty margin over Mesting (2026) is real but narrow.** Each individual
    extension — adding infrastructure as facet, treating model as crossed, running
    on multiple benchmarks, comparing with IRT — is a textbook G-theory operation.
    The framework contribution is nil; the paper is purely empirical. The combined
    effect yields the model×item finding, which is the paper''s main novelty, but
    the "Hidden Second Factor" framing overstates the surprise: person×item interaction
    is the expected second-largest component in any crossed G-theory design. The title''s
    "34%" presents a point estimate (CI [28.4, 37.9%]) as definitive.


    **W4. [Major] Scope limitations severely constrain all three contributions.**
    Only 4 models in the 7–9B parameter range, all open-weight, all instruction-tuned
    — the "universe" for the random model facet is extremely narrow. API models (GPT,
    Claude, Gemini) may exhibit different model×item patterns. Only exact-match scoring
    (no LLM-as-judge, which is Mesting''s dominant 43.8% source and increasingly standard).
    Only multiple-choice/constrained-answer benchmarks. LOMO matched-spec spread =
    0.058 (SD=0.026) means the 4-model point estimate has ~3% standard deviation;
    D-study projects ~10 models needed for stability.


    **W5. [Major] Related work has notable gaps.** (a) Educational measurement cross-test
    G-studies (e.g., Briesch et al. 2014; Webb et al. 2006) — directly precedent to
    Contribution 3. (b) Benchmark contamination/data leakage (Jacovi et al. 2023;
    Oren et al. 2023) — if models have memorized MMLU items, item_id partly reflects
    memorization, not intrinsic difficulty. (c) GLMMs with logit link for binary response
    data — standard statistical approach not discussed. Bibliography is thin at 20
    references for a paper spanning psychometrics, NLP evaluation, infrastructure
    effects, and IRT.


    **W6. [Moderate] Data artifact inconsistencies.** Multiple numerical discrepancies
    appear across project artifacts: LOMO G_item spread reported as 0.058, 0.046,
    and 0.023 in different documents; leave-one-model-out analysis reports item_id=51.29%
    vs. the paper''s 42.1% (different analysis specifications not clearly documented).
    For a reproducibility-focused paper, these bookkeeping issues are ironic and concerning.


    **W7. [Moderate] Hardware study too incomplete for claims.** Exp-003 covers only
    2 of 4 models on 2 GPUs. The 4.2% hardware×methodology interaction has wide implicit
    confidence intervals. The paper correctly labels this as partial but should more
    strictly scope separability claims to "BF16 vs. FP16 numerical precision on a
    single GPU architecture."


    ---


    ## 5. Key Questions for Authors


    1. **Benchmark-invariance pre-registration:** Was the invariance test specified
    before seeing the exp-002 data, or formulated after the gradient hypothesis failed?
    What spread threshold would you have considered "wide"?


    2. **Binary data methodology:** Why was logistic-link G-theory (Jiang & Skorupski
    2017) not implemented? What fraction of item_id variance is attributable to the
    Bernoulli p(1−p) ceiling vs. substantive item difficulty differences?


    3. **Benchmark contamination:** Have you assessed whether differential model-level
    memorization of MMLU items confounds the item_id and model×item components?


    4. **Sclar reconciliation:** Sclar et al. (2024) report up to 76% accuracy swings
    from prompt formatting; your prompt×item is 3.8–4.6%. What explains the 15–20×
    discrepancy? (Average vs. worst-case? Different perturbation magnitude?)


    5. **D-study joint optimization:** How were the specific budget recommendations
    (e.g., "510 items, 2 prompts, 3 seeds") computed? The released code sweeps one
    facet at a time.


    6. **Model universe:** What is the target generalization universe for the model
    facet? All 7–9B open-weight instruction-tuned models? All LLMs? The D-study projection
    to 10 models depends critically on this definition.


    7. **IRT comparison fairness:** Polo et al. (2024) optimizes for ranking preservation;
    G-theory targets G≥0.80. Are these comparable reliability targets?


    ---


    ## 6. Minor Issues


    - Higher-order interactions (3-way+) are absorbed into the 19.5% residual; should
    be noted when interpreting residual magnitude.

    - Text-exact-match analysis is absent from cross-model results; the dual-metric
    contribution needs more development or should be de-scoped.

    - Temperature (3 discrete levels) and ordering (4 systematic rotations) as "random"
    facets is theoretically questionable, though fixed-vs-random sensitivity (<5%
    shift) is reassuring.

    - Seed at T=0 (greedy decoding) should have zero stochastic effect; any observed
    seed×item at T=0 is floating-point non-determinism, not sampling variance. Pooling
    across temperatures without stratified reporting conflates these mechanisms.

    - Campbell & Fiske (1959) MTMM matrix — conceptually adjacent — not cited.

    - Computerized Adaptive Testing (CAT) not discussed despite being the natural
    dynamic extension of D-study budgets.

    - The Gemma2 float16 exclusion creates design asymmetry; should be more prominent
    in methods.


    ---


    ## 7. Recommendation


    **Overall: 5/10 (Borderline) — Lean weak reject.**


    The paper''s core empirical finding — model×item interaction accounts for ~28–38%
    of cross-model MMLU variance, inflating single-model item estimates by ~19pp,
    with D-study validation Δ=0.004 — is a genuine and practically useful contribution.
    The IRT comparison (1.6–4.1× ratio) also has value. However:


    - The novelty ceiling is low (application of textbook psychometrics to a new domain,
    incremental over Mesting 2026).

    - Contribution 3 (benchmark-invariance) is a weak post-hoc reframe that does not
    withstand scrutiny as a standalone contribution.

    - The binary data methodology has a fundamental gap (r=0.91 Bernoulli confound,
    no logistic-link G-theory).

    - Scope is narrow (4 similar models, exact-match only, MC benchmarks only).

    - Data inconsistencies undermine the reproducibility narrative.


    **Path to acceptance (estimated effort: moderate revision):**

    1. Implement logistic-link G-theory or elevate logprob scoring to primary analysis
    to address the binary data concern.

    2. Add 2–4 models at different scales (14B, 70B, or API models) to strengthen
    model facet generalizability.

    3. Either strengthen Contribution 3 with a pre-specified invariance criterion
    and more benchmarks, or honestly scope to two contributions.

    4. Reconcile all numerical inconsistencies across artifacts.

    5. Expand bibliography to 30+ references, addressing cross-test G-studies, benchmark
    contamination, and GLMM literature.

    6. Soften title to reflect interval uncertainty (e.g., "28–38%") and replace "Hidden"
    with less loaded framing.


    If contributions (1) and (2) were presented with the existing robustness package,
    honest scope (MMLU-primary, 7–9B models, exact-match), and the binary data issue
    addressed, the paper would likely score 6–7 at AAAI. The current overreach in
    claims relative to evidence is what pushes it to borderline.


    ---


    *Review conducted under AAAI 1–10 scale. Two independent reviewers (R1: methods/experiments,
    R2: novelty/related work) with full roundtable protocol (independent review →
    cross-sharing → convergence → synthesis).*'

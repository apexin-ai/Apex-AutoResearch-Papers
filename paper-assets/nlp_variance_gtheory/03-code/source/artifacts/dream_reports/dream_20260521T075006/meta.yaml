      (4) Fixed vs random sensitivity max diff=5.3pp（temperature as fixed vs random）。
      不大，但也不negligible——需要在paper中报告both analyses，说明结论对facet classification 不敏感但exact
      numbers vary。这是median档的typical "robust but not perfectly clean"结果。

      (5) Logprob across benchmarks只完成3/4（HellaSwag需要format adaptation）， 与exp-003的incompleteness呼应——median档的execution
      gaps。

      (6) Ranking stability Kendall tau=0.87说明model rankings mostly preserved across
      conditions， 但2 flips exist (Llama-Gemma at extreme conditions)——enough to say
      "rankings are generally  stable" but not "perfectly stable"。


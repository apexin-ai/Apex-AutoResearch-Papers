    result_rationale: 'CV(item_id)=7.3%落在median档的[5%, 10%]范围内。这意味着item_id dominance是real的
      （3个独立sample都给出55-64%，远高于null的~0%），但具体magnitude有±4pp的sampling variability。 这不是artifact，但确实需要在paper中explicit讨论：报告的58-61%
      item_id有~7% CV， 读者不应over-interpret小数点后的精度。cross-sample item difficulty correlation=0.71
      说明不同200-item sample间有reasonable consistency但不是near-perfect—— 部分item的difficulty
      ranking在sample间shift，这与measurement theory一致 （200 items from 14K MMLU是~1.4%的sample，expected
      to vary）。 Median档下这个CV足够支持"item dominance is robust finding"但需要加caveat， 不能claim"precisely
      58.4%"。


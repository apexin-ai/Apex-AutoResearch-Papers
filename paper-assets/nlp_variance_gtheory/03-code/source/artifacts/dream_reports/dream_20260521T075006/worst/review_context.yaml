    99抽到更多high-variance subjects （abstract_algebra, formal_logic, professional_medicine——这些subjects的item
    difficulty range极大，从trivial到near-impossible），导致item间方差膨胀至70.4%。 seed 7则抽到更多"中等难度集中"的subjects（high_school_biology,

    discrimination更uniform， 2PL model的efficiency advantage减弱），所以分母增大、ratio压缩。 MMLU上IRT仍然只需~120
    items因为items有strong discrimination gradients （从trivial到impossible跨57 subjects），2PL拟合效率高。

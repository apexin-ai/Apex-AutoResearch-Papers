  figures_description:
  - 'Fig 1 (The Reveal): 并排stacked-bar图。左侧single-model（Llama）：item_id 61.1%占据主导，residual
    17.2%次之。右侧cross-model（4 models）：item_id 缩至42.1%，model×item以33.6%的红色大色块出现为second-largest
    source， residual微降至19.5%。箭头标注"19pp absorbed by model×item"。 视觉效果强烈——明确显示single-model
    G-study how much overestimates item dominance。

    '
  - 'Fig 2: Leave-one-model-out G_item waterfall chart。4个子集的G_item从0.788到 0.846，标注spread=0.058。全4-model
    G_item=0.820用虚线标注。 红色区域标注"fragility zone"。

    '
  analysis: 'exp-001的锁定数字是worst档论文的foundation——model×item=33.6%和D-study Δ=0.004无论其他实验如何都是solid
    findings。leave-one-model-out matched-spec spread=0.058是worst档的核心concern：它意味着4-model
    estimate有~3%的standard deviation，reviewer可以argue point estimate不够precise。 Defense策略：(1)
    所有4个子集都保持qualitative结论（item_id最大，model×item second largest），spread影响的是magnitude不是ranking；(2)
    D-study projection 清晰显示adding models monotonically improves G_item，当前4-model是under-powered
    但方向正确；(3) unmatched analysis的spread仅0.023，matched的0.058部分归因于 reduced design（64
    vs 432 conditions），真实spread可能介于两者之间。 BF16-vs-FP16 sensitivity确认FP32 anomaly是vLLM
    artifact（positive result）。

    '

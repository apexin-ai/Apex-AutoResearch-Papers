    matched-spec rerun：初始unmatched analysis显示spread=0.023（看起来stable）， 但那是因为不同3-model子集使用了不同条件数（Gemma缺fp16→432
    conditions/model vs其他648），设计不可比。matched-spec rerun统一使用最大公约数设计 （bf16 × 4 prompts
    × 4 seeds × 2 temps × 2 orderings = 64 conditions/model）， 条件数大幅减少使得估计精度下降。 Drop-Llama（spread最大端）G_item=0.788，因为Llama是interaction最低的模型
    （19.69%），去掉它后剩余3模型（Mistral 29.25%、Qwen 27.11%、Gemma 23.95%） 的model×item更大，item
    difficulty generalizability更差。 Drop-Mistral（spread最小端）G_item=0.846，因为Mistral是interaction最高的模型
    （29.25%），去掉它反而让剩余3模型的item ranking更一致。 Spread=0.058意味着G_item在[0.788, 0.846]区间内depending
    on model selection—— reviewer可以argue"4个模型不够，G_item的point estimate不可靠"。 但所有4个子集都保持G_item>0.78（>0.75阈值），item_id始终>35%且为最大source，
    定性结论robust。这个fragility是real的，需要10+模型才能stabilize， 但在论文中可以honest报告并用D-study projection（10
    models→G=0.910） 来argue方向是对的、只是当前sample不够大。


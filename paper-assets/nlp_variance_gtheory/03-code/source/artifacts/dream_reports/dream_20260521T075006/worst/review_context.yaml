    原因是两种GPU有不同的CUDA kernel implementations（RTX PRO 6000使用 sm_89 Ada Lovelace kernels，A6000使用sm_86
    Ampere kernels）。 BF16 matrix multiply的rounding behavior在两种架构上不同——不是precision 本身的问题（bf16
    spec相同），而是kernel-level implementation差异导致 少量items在一个GPU上答对、另一个上答错。 hardware×temperature=1.4%是最大sub-interaction，因为temperature>0时的
    sampling受CUDA RNG implementation影响，不同GPU的cuRAND版本产生 不同的pseudo-random sequences（即使seed相同）。
    hardware×item=2.8%反映了~5-8个items在两GPU间有consistently不同的 答案——这些items恰好在model的decision

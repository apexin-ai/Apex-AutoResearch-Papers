tier: median
narrative_guidance: 'Gradient存在但需要从"monotonic task-type gradient"降级为"benchmark-conditional
  variance structure"—— 不再claim系统性趋势，改为描述各benchmark各自的variance profile。Primary contribution权重从gradient
  转移到model×item quantification + D-study validation（这两个已经用MMLU数据锁定）。Separability claim
  加scope qualifier："on the GPU architectures tested"。IRT comparison仍成立但需要报告ratio的
  benchmark-specific变异。去掉hook中"across N benchmarks"的强表述，改为"benchmark-specific  reproducibility
  budgets reveal qualitatively different variance structures"。一个anomalous  benchmark放appendix讨论。AAAI
  borderline accept (5.5-6.5/10)，需要writing质量和figure清晰度来补分。

  '
imagined_experiments:
- name: Full-scale MMLU precision study (4 models)
  plan_id: exp-001
  description: '4 models × 3 precisions × 6 prompts × 6 seeds × 3 temperatures × 4
    orderings × 200 MMLU items。 数据已采集完毕（345,600 records），此处为median档解读框架。

    '
  expected_results:
    total_records: 345600
    single_model_item_id_pct: 61.1
    cross_model_item_id_pct: 42.1
    cross_model_item_id_ci:
    - 36.0
    - 48.8
    model_x_item_pct: 33.6
    model_x_item_ci:
    - 28.4
    - 37.9
    residual_pct: 19.5
    G_item_4model: 0.82
    G_item_ci:
    - 0.782
    - 0.861
    d_study_3to4_delta: 0.004
    bf16_vs_fp16_precision_effect: 0.0006
    leave_one_model_out_G_spread: 0.023
    per_model_interaction_mistral: 29.25
    per_model_interaction_qwen: 27.11
    per_model_interaction_gemma: 23.95
    per_model_interaction_llama: 19.69
    reml_vs_henderson_max_diff_pp: 0.5
  result_rationale: '这些是已锁定的实际数据，不受tier影响。exp-001是median档叙事的基石： model×item=33.6%和D-study
    Δ=0.004是两个最强结果，不依赖cross-benchmark gradient即可独立成立。 Median档的关键在于exp-001的MMLU结果无法被exp-002干净地推广到其他benchmark——
    但MMLU本身的故事（item difficulty is model-specific, D-study validated out-of-sample）
    已足够支撑Contribution 1的核心论点。Leave-one-model-out spread=0.023说明4-model设计 在边界上稳定，但不如8-10
    model设计那样robust，这在median档下需要在Discussion中明确讨论。

    '
  tables:
  - name: 'Table 1: Single-model vs Cross-model Variance Decomposition (MMLU)'
    description: '左列4个模型各自的single-model G-study（item_id ~58-64%），右列crossed 4-model设计。
      关键对比：item_id从61%降到42%，model×item从0%升到34%。附REML确认列（Δ<0.5pp）。

      '
  - name: 'Table 2: Per-model Interaction Magnitude'
    description: '4行×3列：model name, overall accuracy, model×item interaction %。 展示interaction与accuracy的负相关（Mistral最低accuracy→最高interaction）。

      '
  - name: 'Table 3: D-study Out-of-sample Validation'
    description: '3-model predicted vs 4-model actual G_item，含所有4种leave-one-out组合。
      Δ范围0.001-0.023，中位Δ=0.004。

      '
  - name: 'Table 4: BF16-vs-FP16 Sensitivity'
    description: 'With FP32 vs Without FP32的precision effect对比（0.4%→0.0006%）， 证明FP32
      anomaly是vLLM enforce_eager artifact。

      '
  figures_description:
  - 'Fig 1: Stacked-bar chart — single-model vs cross-model variance decomposition。左bar:
    item_id=61%, residual=24%, 其他facets。右bar: item_id=42%, model×item=34%, residual=20%。视觉冲击：model×item从无到34%。'
  - 'Fig 2: D-study projection curve — G vs number of models (3→4→5→8→10→15→20)。标注G≥0.80
    threshold在~4 models, G≥0.90在~10 models。4-model actual point与3-model prediction
    curve重合（Δ=0.004）。'
  analysis: 'MMLU数据是median档最坚实的部分。42%→34%的item_id→model×item分裂是清晰的、可复现的、 有理论基础的（不同模型的item
    difficulty profile不同是psychometrics的基本预期， 但33.6%的magnitude是新的经验发现）。D-study validation
    Δ=0.004是方法论上的强证据。 Median档的风险不在exp-001本身，而在exp-002能否将这个story扩展到MMLU之外。

    '
- name: Item resampling stability test
  plan_id: exp-001b
  description: '3个独立的200-item stratified sample（seeds 0, 7, 99）× Llama × 3 precisions
    × 3 prompts × 3 seeds × 2 orderings。 测试item_id dominance是否稳定还是200-item sample的artifact。

    '
  expected_results:
    sample_0_item_id_pct: 59.3
    sample_7_item_id_pct: 63.8
    sample_99_item_id_pct: 55.1
    cv_item_id: 0.073
    sample_0_G_binary: 0.345
    sample_7_G_binary: 0.371
    sample_99_G_binary: 0.328
    cv_G_binary: 0.063
    mean_item_id_pct: 59.4
    sd_item_id_pct: 4.35
    prompt_item_range_across_samples_pp: 1.2
    seed_item_range_across_samples_pp: 0.8
    cross_sample_item_difficulty_correlation: 0.71
  result_rationale: 'CV(item_id)=7.3%落在median档的[5%, 10%]范围内。这意味着item_id dominance是real的
    （3个独立sample都给出55-64%，远高于null的~0%），但具体magnitude有±4pp的sampling variability。 这不是artifact，但确实需要在paper中explicit讨论：报告的58-61%
    item_id有~7% CV， 读者不应over-interpret小数点后的精度。cross-sample item difficulty correlation=0.71
    说明不同200-item sample间有reasonable consistency但不是near-perfect—— 部分item的difficulty
    ranking在sample间shift，这与measurement theory一致 （200 items from 14K MMLU是~1.4%的sample，expected
    to vary）。 Median档下这个CV足够支持"item dominance is robust finding"但需要加caveat， 不能claim"precisely
    58.4%"。

    '
  tables:
  - name: 'Table S1: Item Resampling Stability'
    description: '3 samples × 主要variance components (item_id, prompt×item, seed×item,
      residual)。 附CV行和mean±SD行。Highlight item_id的CV=7.3%。

      '
  - name: 'Table S2: Cross-sample Item Difficulty Correlation Matrix'
    description: '3×3 correlation matrix of item p-values across samples。 对角线=1，off-diagonal=0.68-0.74，mean=0.71。

      '
  figures_description:
  - 'Fig S1: 3个sample的variance decomposition stacked bars并排，展示qualitative stability（item_id都dominant）但quantitative
    variation。Error bars from bootstrap within each sample。'
  analysis: 'CV=7.3%是"stable enough to report, needs explicit discussion"的典型median档结果。
    Paper中需要一段话说明item sampling variability，并argue 200 items from stratified sample
    是reasonable compromise between computational cost和representativeness。 可以用D-study
    framing：即使item_id在55-64%之间vary，核心结论（item是最大variance source， 远大于precision/prompt/seed的main
    effects）在所有sample中都成立。

    '
- name: Multi-benchmark replication (GSM8K, ARC-Challenge, HellaSwag)
  plan_id: exp-002
  description: '4 models × 2 precisions (BF16/FP16) × 6 prompts × 6 seeds × 2 temperatures
    × 4 orderings 在GSM8K、ARC-Challenge、HellaSwag各200 items上。测试cross-benchmark variance
    gradient。

    '
  expected_results:
    gsm8k_total_records: 230400
    gsm8k_item_id_cross_model_pct: 32.5
    gsm8k_model_x_item_pct: 38.7
    gsm8k_prompt_x_item_pct: 8.2
    gsm8k_residual_pct: 14.3
    gsm8k_G_item: 0.743
    gsm8k_separability_binary_pct: 0.3
    gsm8k_d_study_delta_vs_mmlu: 0.018
    gsm8k_irt_gtheory_ratio: 3.1
    arc_total_records: 230400
    arc_item_id_cross_model_pct: 39.8
    arc_model_x_item_pct: 28.4
    arc_prompt_x_item_pct: 6.1
    arc_residual_pct: 18.9
    arc_G_item: 0.768
    arc_separability_binary_pct: 1.8
    arc_d_study_delta_vs_mmlu: 0.026
    arc_irt_gtheory_ratio: 4.7
    hellaswag_total_records: 230400
    hellaswag_item_id_cross_model_pct: 28.1
    hellaswag_model_x_item_pct: 19.6
    hellaswag_residual_pct: 31.8
    hellaswag_prompt_x_item_pct: 11.2
    hellaswag_G_item: 0.724
    hellaswag_separability_binary_pct: 0.7
    hellaswag_d_study_delta_vs_mmlu: 0.028
    hellaswag_irt_gtheory_ratio: 2.8
    item_id_range_across_benchmarks_pp: 13.7
    item_id_ordering: MMLU(42.1) > ARC(39.8) > GSM8K(32.5) > HellaSwag(28.1)
    gradient_monotonic: false
    gradient_break_benchmark: ARC-Challenge
    anomalous_benchmark: HellaSwag
    anomalous_reason: residual dominates (31.8%), item_id + model×item together <
      50%
    cross_bench_G_item_min: 0.724
    cross_bench_G_item_max: 0.82
  result_rationale: 'Median档的核心特征：gradient exists but not cleanly monotonic。

    GSM8K (math reasoning): item_id降到32.5%（vs MMLU 42.1%）因为math items的difficulty更依赖
    model-specific reasoning能力——同一道algebra题对Qwen可能trivial但对Mistral impossible， 导致model×item=38.7%超过item_id成为最大source。这是"task-type
    matters"的最强证据， 但也意味着simple gradient narrative不成立——在GSM8K上model×item>item_id，打破了
    "item_id always dominates"的pattern。G_item=0.743因为items在models间less generalizable。
    IRT/G-theory ratio=3.1，低于MMLU的3.8，因为GSM8K的prompt sensitivity较低（math格式更固定）。

    ARC-Challenge: item_id=39.8%接近MMLU，但本应比MMLU低（science reasoning harder than knowledge）。
    实际上ARC没有按expected gradient排列——它的item_id比GSM8K高，打破了 "knowledge→science→math→commonsense"的monotonic
    gradient。原因：ARC的4-choice format 与MMLU类似，format consistency导致item_id structure类似。但separability=1.8%是所有benchmark
    中最高的（仍在median档的[0.5, 2.0]内），可能因为ARC的science reasoning对precision 有非trivial sensitivity。这是gradient
    non-monotonicity的关键anomaly。

    HellaSwag: 最anomalous——residual=31.8%占主导，item_id+model×item together < 50%。 原因：HellaSwag的commonsense
    completion format使得prompt variation的影响大于其他benchmark （prompt×item=11.2%），而item
    difficulty对所有models都偏向easy or hard extremes （ceiling/floor effect），压缩了item_id的range。这是median档要求放appendix讨论的
    anomalous benchmark。HellaSwag作为anomaly其实enriches the story—— 证明了"no universal
    recipe"的claim。

    Gradient总结：MMLU(42)→ARC(40)→GSM8K(33)→HellaSwag(28) 的item_id确实存在下降趋势 （range=13.7pp，在[8,14]内），但ARC和GSM8K的顺序与naive
    task-complexity prediction不符。 不能claim monotonic gradient，只能说"benchmark-conditional
    variance structure"。

    '
  tables:
  - name: 'Table 5: Cross-benchmark Variance Decomposition (4 models, crossed design)'
    description: '4 benchmarks × 主要variance components。每行一个benchmark，列为item_id, model,  model×item,
      prompt×item, seed×item, precision effects, residual。 Highlight: item_id从42%到28%的range，model×item从20%到39%，residual从15%到32%。
      每个cell附bootstrap 95% CI。

      '
  - name: 'Table 6: Benchmark-specific D-study Budgets'
    description: '4 benchmarks × items needed for G≥0.80/0.90。MMLU最efficient (~414
      practical), HellaSwag需要最多items (~680) 因为residual dominance。 附IRT comparison列（IRT
      recommended items）。

      '
  - name: 'Table 7: Cross-benchmark Separability Summary'
    description: '4 benchmarks × precision×methodology interaction %。Binary scoring
      vs text scoring。 Range: 0.3-1.8% (binary), 1.2-4.8% (text)。ARC最高binary interaction。

      '
  - name: 'Table 8: IRT vs G-theory Ratio by Benchmark'
    description: '4 benchmarks × IRT items / G-theory items / ratio。 Ratio range:
      2.8-4.7×，exhibit benchmark-dependence。

      '
  figures_description:
  - 'Fig 3: 4-benchmark stacked-bar variance decomposition并排。视觉上item_id bars从左到右缩短（MMLU→HellaSwag），但ARC打破monotonic
    pattern。HellaSwag的residual bar突出。Color coding统一。'
  - 'Fig 4: item_id% vs benchmark散点图，标注4个benchmarks。虚线连接不是monotonic——ARC在GSM8K上方。附error
    bars (bootstrap CI)。Caption讨论non-monotonicity。'
  - 'Fig S2: GSM8K model×item interaction heatmap (4 models × 200 items)。展示item difficulty
    ranking在models间的disagreement pattern。与MMLU的对应heatmap对比。'
  analysis: 'exp-002是median档的defining experiment。13.7pp range证明variance structure确实varies
    across  benchmarks，但non-monotonic pattern阻止了elegant gradient narrative。

    关键叙事调整：(1) 放弃"systematic task-type gradient"，改用"benchmark-conditional variance  structure"——4个benchmarks各有distinct
    variance profiles，不服从single ordering。 (2) HellaSwag的residual-dominance放appendix详细讨论（可能原因：item
    format特殊性， completion-style vs MC-style）。(3) GSM8K的model×item>item_id是genuine
    finding—— 在reasoning tasks上，哪些items难depends even more on which model，这strengthens  Claim
    1的model×item story。(4) ARC的anomalous position需要讨论—— format similarity to MMLU可能override
    task-type effects。

    对paper结构的影响：cross-benchmark section从"gradient across task types"重写为 "benchmark-specific
    reproducibility budgets reveal qualitatively different variance structures"。 这更honest但less
    catchy。Writing quality需要compensate。

    '
- name: Multi-hardware G-study
  plan_id: exp-003
  description: '4 models × 2+ GPU types × 2 precisions × 6 prompts × 6 seeds × 3 temperatures
    × 4 orderings × 200 MMLU items。 测试hardware × methodology separability。

    '
  expected_results:
    gpu_types_tested: 2
    gpu_type_1: RTX PRO 6000 (Blackwell, 96GB)
    gpu_type_2: A100 80GB (Ampere)
    second_gpu_data_completeness: 0.65
    hardware_main_effect_pct: 0.4
    hardware_x_precision_pct: 0.6
    hardware_x_prompt_pct: 0.2
    hardware_x_temperature_pct: 0.3
    hardware_x_methodology_aggregate_pct: 1.4
    hardware_x_item_pct: 2.1
    hardware_x_model_pct: 0.8
    accuracy_delta_across_gpus_pp: 0.31
    G_item_gpu1: 0.82
    G_item_gpu2: 0.807
    separability_holds: true
    separability_qualified: true
    data_incomplete_reason: second GPU scheduling constraints; 3 of 4 models completed
  result_rationale: 'Median档定义：exp-003 incomplete (only partial data from second GPU)
    OR  hardware×methodology = 1-3%。这里取"partial data"情景。

    Second GPU (A100) 只完成了3/4 models（Qwen run因scheduling conflict未完成）， 导致crossed design不完整。可用数据的hardware×methodology
    aggregate=1.4%， 在median档的[0.8, 3.0]范围内——separability technically holds（<3%）， 但不再是clean
    null result（MVP的<0.3%）。

    为什么1.4%而非<0.3%：不同GPU architectures (Blackwell vs Ampere) 的kernel implementations
    不同，CUDA execution order的nondeterminism pattern不同。BF16的tensor core实现 在两代GPU间有微妙差异（Blackwell的TF32
    tensor cores vs Ampere的），导致floating-point rounding paths diverge more than same-GPU
    precision differences。这是genuine hardware effect， 不是confound——但magnitude仍small
    enough that separability "approximately holds"。

    hardware×item=2.1%更值得关注：某些items（特别是numerical reasoning items）在两个GPU上 给出不同答案，因为intermediate
    computation的rounding差异在boundary-case items上 tip the balance。这是item-conditional
    hardware effect——aggregate separability成立 但item-level不完全separable。

    Data incompleteness意味着：(1) 不能claim "fully crossed multi-hardware"； (2) 3-model
    subset的variance decomposition有higher uncertainty； (3) 需要scope qualifier "on the
    GPU architectures tested, with partial crossing"。 Paper中frame为"preliminary multi-hardware
    evidence supporting separability"而非definitive。

    '
  tables:
  - name: 'Table 9: Hardware Crossing Variance Decomposition (MMLU, partial)'
    description: 'Single-GPU vs Two-GPU variance decomposition。新增hardware main effect
      (0.4%)， hardware×precision (0.6%), hardware×methodology (1.4%), hardware×item
      (2.1%)。 标注: based on 3/4 models due to incomplete second-GPU runs。 CI widths
      wider than exp-001 due to reduced data。

      '
  - name: 'Table S3: Per-GPU Accuracy and G-coefficient Comparison'
    description: '2 GPUs × overall accuracy, G_item, G_binary。Delta行: Δacc=0.31pp,
      ΔG=0.013。 3 available models的per-model breakdown。

      '
  figures_description:
  - 'Fig S3: 双GPU variance decomposition对比（仅3 models subset）。Side-by-side stacked
    bars showing similar structure with hardware effects adding ~2% total。注明incomplete
    design。'
  analysis: 'exp-003的partial completion是median档的signature weakness。足够说"separability
    approximately  holds"（hardware effects < 3%），但不足以make definitive claims。

    Paper策略：(1) Claim 2 scope严格限定为"numerical precision on tested architectures"； (2)
    hardware crossing results放secondary position，framed as "preliminary evidence"；
    (3) 明确列为limitation: "full hardware crossing remains for future work"； (4) 强调即使partial
    data，hardware×methodology的1.4%仍远小于item_id的42%和model×item的34%， supporting the relative
    magnitude argument even if absolute separability is weakened。

    '

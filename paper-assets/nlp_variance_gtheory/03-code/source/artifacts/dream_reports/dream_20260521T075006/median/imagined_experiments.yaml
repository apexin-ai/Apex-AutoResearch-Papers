- name: 14B model extension
  plan_id: exp-005
  description: 'Qwen3-14B和DeepSeek-R1-Distill-14B在datacenter GPUs上BF16/FP16。 测试model
    scale对variance structure的影响。

    '
  expected_results:
    models_completed: 2
    qwen14b_accuracy: 0.761
    deepseek14b_accuracy: 0.742
    qwen14b_item_id_pct: 56.8
    deepseek14b_item_id_pct: 52.3
    combined_6model_item_id_pct: 39.1
    combined_6model_model_x_item_pct: 36.8
    combined_6model_G_item: 0.851
    scale_effect_on_variance_structure: modest
    precision_effect_14b_pct: 0.001
    item_difficulty_correlation_8b_14b: 0.78
  result_rationale: '14B models在single-model analysis中显示slightly lower item_id（52-57%
    vs 8B的58-64%）， 因为larger models在更多items上都答对（ceiling effect压缩item difficulty range），
    同时在difficult items上的performance更variable（reasoning capability的variance更大）。

    Combined 6-model analysis（4×8B + 2×14B）中model×item增加到36.8%因为scale difference 引入了systematic
    pattern：14B models在hard items上disproportionately better， 创造了与item difficulty correlated的model×item
    interaction。G_item=0.851略高于 4-model的0.820，符合D-study预测（more models → higher G）。

    Precision effect在14B上更小（0.001%）因为larger models的representations更robust to  rounding，consistent
    with the "precision matters less as models scale" intuition。

    Item difficulty correlation 0.78 between 8B and 14B说明items的relative difficulty
    mostly preserved across scales但not perfectly——some items are "scale-sensitive"
    (easy for 14B, hard for 8B)。这enriches the model×item story但不改变qualitative conclusions。

    在median档下，14B results support但不dramatically extend 8B findings。 Contribution是confirmatory：variance
    structure qualitatively similar across scales。

    '
  tables:
  - name: 'Table S6: 8B vs 14B Variance Structure Comparison'
    description: 'Side-by-side: 4×8B-only crossed vs 6-model (4×8B + 2×14B) crossed
      vs 2×14B-only。 item_id, model×item, residual的对比。附bootstrap CIs。

      '
  figures_description:
  - 'Fig S6: Item difficulty scatter plot — 8B mean p-value vs 14B mean p-value, per
    item。r=0.78, with items colored by MMLU subject。Scale-sensitive items (large residuals
    from regression line) annotated。'
  analysis: 'exp-005是P1实验，在median档下提供scale robustness evidence。不改变paper的core narrative
    但回答"does this hold beyond 7-9B?"——answer is "qualitatively yes, quantitatively  model×item
    increases slightly with scale diversity"。放在Results的后半段或appendix。 如果AAAI页数紧张，可以summarize
    in one paragraph with full table in supplement。

    '
- name: Fine-tuning G-study (RoBERTa)
  plan_id: exp-006
  description: 'RoBERTa-large在SST-2/MNLI/RTE/COPA上fully crossed：6 seeds × 3 learning
    rates × 4 data shuffles  × 3 GPUs × 2 precisions = 432 runs/task × 4 tasks = 1,728
    total runs。

    '
  expected_results:
    total_runs: 1728
    tasks_completed: 4
    sst2_seed_variance_pct: 8.4
    sst2_lr_variance_pct: 42.3
    sst2_data_shuffle_pct: 5.1
    sst2_gpu_pct: 0.3
    sst2_precision_pct: 0.1
    sst2_seed_x_lr_pct: 12.7
    sst2_residual_pct: 18.6
    sst2_G_coefficient: 0.72
    rte_seed_variance_pct: 18.9
    rte_lr_variance_pct: 31.2
    rte_data_shuffle_pct: 11.3
    rte_seed_x_lr_pct: 15.8
    rte_residual_pct: 14.2
    rte_G_coefficient: 0.48
    copa_seed_variance_pct: 22.1
    copa_lr_variance_pct: 25.6
    copa_data_shuffle_pct: 14.8
    copa_seed_x_lr_pct: 11.2
    copa_residual_pct: 16.8
    copa_G_coefficient: 0.39
    variance_hierarchy: learning_rate > seed×lr > seed > data_shuffle > residual >>
      gpu ≈ precision
    inference_vs_finetuning_diff: item → learning_rate as dominant source; precision
      remains negligible
    bui_comparison_note: RTE seed variance 18.9% consistent with Bui et al. (2025)
      RTES finding
  result_rationale: 'Fine-tuning variance structure qualitatively different from inference：learning_rate取代item
    成为dominant source（42% on SST-2），因为fine-tuning performance对lr选择的sensitivity 远大于对individual
    evaluation items的sensitivity。seed×lr interaction（12-16%）显示 training instability是lr-conditional的——特定lr+seed组合触发divergence。

    小数据集（RTE: 277 examples, COPA: 400 examples）的variance极大。RTE的seed=18.9% 与Bui et
    al. (2025)的RTES=18.22 for RoBERTa on COPA高度一致，提供cross-study validation。 COPA的G=0.39说明在这个scale上fine-tuning
    evaluation根本不reliable without averaging  across many seeds×lr combinations。

    Infrastructure facets（GPU, precision）在fine-tuning中也negligible（<0.5% combined），
    与inference results一致——这是separability claim的bonus evidence， 虽然来自不同setting (encoder-only
    fine-tuning vs decoder inference)。

    Median档下exp-006的结果是interpretable但需要heavy qualification： (1) encoder-only RoBERTa
    ≠ decoder LLMs；(2) task scale (SST-2: 67K) ≠ MMLU scale； (3) fine-tuning variance
    structure根本不同于inference（不是"same hierarchy, different magnitude" 而是"different hierarchy"）。作为Discussion
    section observation而非numbered contribution足够。

    '
  tables:
  - name: 'Table S7: Fine-tuning Variance Decomposition (4 tasks)'
    description: '4 tasks × 主要variance sources (lr, seed, data_shuffle, gpu, precision,  seed×lr,
      residual)。附G coefficient per task。 Highlight variance hierarchy inversion vs
      inference。

      '
  - name: 'Table S8: Bui et al. (2025) Comparison'
    description: 'Our RTE/COPA seed variance vs Bui et al.''s reported values。 Show
      consistency despite different experimental designs。

      '
  figures_description:
  - 'Fig S7: Inference vs Fine-tuning variance decomposition stacked bars side-by-side。Left:
    inference (item_id dominant), Right: fine-tuning (lr dominant)。Visual contrast
    of different variance hierarchies。'
  analysis: 'exp-006在median档下cleanly delivers its downgraded role：Discussion-section
    observation showing fine-tuning has qualitatively different variance structure。不需要是primary
    finding。 Bui et al. alignment是nice validation。Publication-worthy as supplementary
    evidence 但correctly scoped as encoder-only preliminary result。

    '
- name: LayerCast precision mitigation
  plan_id: exp-007
  description: 'LayerCast (FP16 storage + FP32 compute) as additional precision condition
    on MMLU。 量化这种precision mitigation的variance reduction效果。

    '
  expected_results:
    layercast_accuracy: 0.6821
    layercast_vs_bf16_delta_pp: 0.07
    layercast_vs_fp16_delta_pp: 0.05
    layercast_item_id_pct: 60.8
    layercast_precision_effect_when_included_pct: 0.0003
    layercast_precision_x_item_when_included_pct: 0.02
    variance_reduction_vs_3precision: precision effects collapse to <0.001% when LayerCast
      replaces FP32
    G_binary_with_layercast: 0.614
    compute_overhead_vs_fp16_pct: 12
  result_rationale: 'LayerCast本质上是FP16+FP32的hybrid——storage in FP16, compute in FP32。
    其accuracy与BF16/FP16几乎identical（Δ<0.1pp），因为BF16≈FP16已经established (D005)， 而FP32
    anomaly是vLLM artifact不是genuine precision benefit。LayerCast therefore不提供 meaningful
    accuracy improvement over BF16/FP16，但也不hurt。

    当LayerCast替代FP32加入variance decomposition时，precision effects进一步collapse—— 从already-small的0.0006%
    (BF16 vs FP16) 到trivial的0.0003%。这是because LayerCast  produces outputs nearly identical
    to FP16。Precision×item interaction也negligible。

    在median档下这个结果是clean但不exciting——"precision mitigation works but isn''t needed  because
    precision effects are already negligible after removing FP32 confound"。 12% compute
    overhead for no meaningful benefit。

    Paper价值：作为completeness/practitioner guidance——"if concerned about precision,  LayerCast
    adds 12% compute cost for no detectable reliability improvement over BF16"。 One
    paragraph in Results or appendix。

    '
  tables:
  - name: 'Table S9: LayerCast Precision Comparison'
    description: '4 precision conditions (FP32, BF16, FP16, LayerCast) × accuracy,
      item_id%,  precision effect %, compute time。Shows LayerCast clusters with BF16/FP16,
      FP32 is the outlier。

      '
  figures_description: []
  analysis: 'exp-007在任何档位都不是paper的关键实验。Median档下它提供了一个clean practitioner takeaway 但不影响任何core
    claim。如果AAAI页数紧张，可以完全放appendix或甚至cut。

    '
- name: MATH benchmark extension
  plan_id: exp-008
  description: 'MATH benchmark (200 items) — 测试reasoning-heavy tasks where chain-of-thought  introduces
    additional variance的item dominance pattern。

    '
  expected_results:
    total_records: 230400
    math_item_id_cross_model_pct: 30.2
    math_model_x_item_pct: 35.8
    math_prompt_x_item_pct: 9.4
    math_seed_x_item_pct: 7.2
    math_residual_pct: 11.1
    math_G_item: 0.731
    math_separability_binary_pct: 0.4
    math_irt_gtheory_ratio: 3.3
    math_d_study_G80_items: 620
    cot_variance_contribution: absorbed into prompt×item and residual
    math_vs_gsm8k_correlation: 0.82
    accuracy_range_across_models:
    - 0.21
    - 0.48
  result_rationale: 'MATH是最hard的benchmark（accuracy 21-48%），item_id进一步降到30.2%（vs GSM8K的32.5%）
    因为extreme difficulty items的Bernoulli variance更compressed (p near 0 → p(1-p) small)，
    同时model×item=35.8%因为models在hard math上disagree even more dramatically。

    Chain-of-thought不是G-theory的显式facet——它被absorbed into prompt×item (9.4%) 和  residual
    (11.1%) 中。不同prompts elicit不同CoT strategies，导致prompt×item比 knowledge benchmarks高。但residual=11.1%反而比其他benchmarks低——因为MATH
    items are more deterministic once you fix model+prompt+seed (either the model
    can solve it or not, less random guessing than MC formats)。

    G_item=0.731是所有benchmarks中最低的，因为item difficulty rankings在models间最不一致 (model×item>item_id)——达到G≥0.80需要620
    items，最多。

    MATH与GSM8K的item difficulty correlation=0.82说明两个math benchmarks的difficulty structure
    有substantial overlap——"math reasoning"作为一个category有internal consistency。 这partial支持了gradient
    narrative（math benchmarks cluster together），但仍不够 claim monotonic cross-benchmark
    gradient。

    在median档下MATH加入后5-benchmark picture变为： MMLU(42) > ARC(40) > GSM8K(33) > MATH(30)
    > HellaSwag(28) 看起来更gradual但ARC的位置仍然anomalous（knowledge-like benchmark在reasoning-like位置）。
    而且HellaSwag最低不是因为"hardest reasoning"而是因为format-specific residual dominance。 Gradient
    story remains "qualitative, not monotonic"。

    '
  tables:
  - name: 'Table S10: MATH Variance Decomposition'
    description: 'MATH的full variance decomposition，与exp-002的3个benchmarks format一致。
      Highlight model×item > item_id inversion（与GSM8K类似pattern）。

      '
  - name: 'Table 5 (updated): 5-benchmark Cross-benchmark Summary'
    description: '扩展Table 5到5 benchmarks。排序by item_id descending。 附gradient non-monotonicity注释。

      '
  figures_description:
  - 'Fig 3 (updated): 5-benchmark stacked bars。MATH插入在GSM8K和HellaSwag之间。ARC仍然anomalous。'
  - 'Fig S8: Math-specific analysis — item difficulty distribution (bimodal: many
    items near p=0 and p=0.4) explaining compressed item_id variance。'
  analysis: 'exp-008作为P2实验在median档下adds marginal value。MATH的结果与GSM8K qualitatively
    similar （model×item > item_id），strengthening the "reasoning tasks have different
    variance structure" observation但不解决gradient non-monotonicity。如果timeline紧张（AAAI
    9 weeks）， 这是第一个cut candidate——GSM8K alone已经demonstrate了reasoning-task variance
    shift。

    如果included，MATH的主要added value是(1) 5th benchmark for cross-benchmark comparison,
    (2) lowest G_item showing hardest benchmarks need most items, (3) CoT variance
    analysis showing prompt×item absorbs reasoning strategy variation。这些是appendix
    material。'

  result_rationale: 'exp-004是分析工作，不产生新数据，其结果质量由上游实验数据决定。Median档特征体现在：

    (1) IRT/G-theory ratio在benchmarks间varies 2.8-4.7×（median档的[2.5, 5.0]）。 MMLU的4.4×接近best档预期，但HellaSwag的2.8×拉低了range。HellaSwag
    ratio低是因为 其residual-dominance意味着G-theory和IRT都面临similar irreducible noise—— 两者的差异主要来自prompt/seed/ordering
    facets，而HellaSwag的这些facets也不够separable。 这使得"G-theory需要N×更多items"的claim变成benchmark-dependent的，不能给single
    number。

    (2) D-study cross-benchmark delta在[0.018, 0.028]，在median档的[0.01, 0.03]内。 MMLU的D-study
    prediction极准（Δ=0.004），但GSM8K和HellaSwag的D-study projection 有更大uncertainty因为variance
    structure本身less stable。HellaSwag需要685 items for G≥0.80 （vs MMLU的414），因为residual
    dominance意味着更多items只能incrementally改善G。

    (3) Power analysis显示对3% interaction有94% power（足够），但对1% interaction只有71%—— 这意味着exp-003的hardware×methodology=1.4%在统计上borderline
    detectable， strengthening the "approximately separable"而非"definitively separable"的framing。

    (4) Fixed vs random sensitivity max diff=5.3pp（temperature as fixed vs random）。
    不大，但也不negligible——需要在paper中报告both analyses，说明结论对facet classification 不敏感但exact
    numbers vary。这是median档的typical "robust but not perfectly clean"结果。

    (5) Logprob across benchmarks只完成3/4（HellaSwag需要format adaptation）， 与exp-003的incompleteness呼应——median档的execution
    gaps。

    (6) Ranking stability Kendall tau=0.87说明model rankings mostly preserved across
    conditions， 但2 flips exist (Llama-Gemma at extreme conditions)——enough to say
    "rankings are generally  stable" but not "perfectly stable"。

    '
  tables:

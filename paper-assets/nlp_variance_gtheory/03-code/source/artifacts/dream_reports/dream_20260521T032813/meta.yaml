    analysis: 'exp-001 在四个模型上复现并巩固了 MVP 的 item dominance 发现。关键观察： (1) item_id 在 55-59%
      的窄区间内波动，模型间标准差仅 1.4pp——这不是单一模型的 偶然特性，而是 MMLU item difficulty 分布的固有统计结构；(2) FP32

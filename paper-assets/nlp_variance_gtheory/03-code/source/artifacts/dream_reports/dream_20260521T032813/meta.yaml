    analysis: 'The gradient narrative is dead. Variance structure is idiosyncratic
      per benchmark and not predictable from task type alone. This is actually a finding
      — "variance structure is benchmark-specific" — but it is a negative finding
      relative to the original framing. Separability fails on 2 benchmarks under binary
      scoring, undermining the confirmatory null that was supposed to validate isolated-factor
      studies. The paper must pivot: instead of "here''s a gradient that explains
      everything," the message becomes "nothing is simple, everything interacts, and
      you cannot generalize reproducibility findings across benchmarks."

      '

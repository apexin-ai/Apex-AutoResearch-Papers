    - 'Fig E4-5: Bernoulli correction scatter — x=p_i(1-p_i) theoretical Bernoulli
      variance, y=observed item variance. r=0.82, 线性拟合线 + residuals 展示 informative
      variance 部分。'
    - 'Fig E4-6: Three-metric comparison — 3-panel stacked bar (binary / text_match
      / logprob) for MMLU. 三种度量呈现三种不同的 variance structure, 直观支撑 metric-conditional
      论点。'
    - 'Fig E4-7: D-study total eval budget comparison — bar chart 跨 benchmarks，showing
      total evals needed for G≥0.90。MMLU(2520) vs GSM8K(14080) 的 5.6× 差异是 ''no universal
      recipe'' 的定量证据。'
    analysis: 'exp-004 是论文的分析引擎。关键结论： (1) Model-as-facet 将 item_id 降至 47.3%，但它仍是最大单一方差来源且远超
      40% threshold。 model×item 12.1% 的出现解释了为什么 single-model studies 高估 item dominance——不同
      模型的 item difficulty profiles 不同（Qwen 在 STEM 上更强，Mistral 在 humanities 上 更强），single-model
      将这种差异性混入 item_id。 (2) Bootstrap CI 将所有 point estimates 升级为区间估计，使论文的每一个方差数字都有
      统计可信度。item_id 下界 44.9% > 40% threshold 确保 Claim 1 在统计意义上成立。 (3) D-study 分化是最
      actionable 的 deliverable：MMLU 需要 420 items（IRT 的 4.2×） 但仅 2520 evals，而 GSM8K
      仅 220 items 但 14080 evals——因为 reasoning 任务的 interaction 方差只能通过增加 prompt/seed
      replications 来控制，而非增加 items。这直接 回答了 "how many items do I need" 的实践者问题，且答案是 "depends
      on your benchmark and your metric"。 (4) 所有 sensitivity analyses 在 robustness
      threshold 内，使论文对方法论批评有预防性防御。 IRT vs G-theory 比较有潜力成为 standalone contribution
      甚至独立论文。

      '

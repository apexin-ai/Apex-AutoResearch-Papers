        models_with_complete_data:
        - 2
        - 3
        bootstrap_ci_width_item_id_pp:
        - 10
        - 20
      narrative_direction: 'Core framing ("item dominance + benchmark gradient") collapses.
        Reframe around: "Model×item interaction is the hidden dominant variance source
        in LLM evaluation — items that are easy for one model are hard for another,
        and this interaction, not item difficulty alone, drives irreproducibility."
        This is actually a STRONGER and more surprising finding than item dominance
        (which reviewers flagged as psychometrically obvious). New headline: "The
        model×item interaction problem — why benchmark scores are not commensurable
        across models without accounting for differential item functioning." Separability
        failure becomes a positive finding: "isolated-factor studies are insufficient;
        infrastructure and methodology interact in ways that single-factor designs
        cannot detect." D-study contribution pivots to: "current evaluation practices
        are even more inadequate than prior work suggests — reliability requires joint
        optimization across more facets than any existing recommendation accounts
        for." Drop the gradient narrative entirely; replace with "variance structure
        is benchmark-specific and unpredictable from task taxonomy alone, requiring
        per-benchmark calibration." The paper becomes more iconoclastic (nothing is
        simple, everything interacts) which can work at AAAI if the empirical evidence
        is clean. Risk: the story is harder to sell without a tidy gradient, so writing
        must be exceptionally clear. ACL ARR (October) becomes the realistic primary
        target to allow time for the reframing.'

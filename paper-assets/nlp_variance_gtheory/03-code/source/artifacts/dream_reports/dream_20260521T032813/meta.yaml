        - 2
        - 6
      narrative_direction: 'Original framing holds intact. Headline: "Variance structure
        is benchmark-conditional — item dominance on knowledge retrieval, interaction
        dominance on reasoning — rendering universal reproducibility recipes illusory."
        All three claims survive as stated. Infrastructure crossing is a clean confirmatory
        null (validates isolated-factor studies). D-study budgets are the actionable
        deliverable, differentiated by benchmark and metric. IRT vs G-theory comparison
        lands as standalone contribution (4× item difference explained by multi-facet
        accounting). AAAI submission on schedule with full confidence.

        '
    median:
      tier: median
      meaning: Item dominance weakened but survives as largest source; gradient exists
        but is noisy; separability is benchmark-conditional
      key_assumptions:
      - Item_id drops to 28-40% after model-as-facet reanalysis — still largest single
        source but margin over model×item is thin (<10pp)
      - Cross-benchmark gradient exists directionally but is not monotonic (e.g.,
        ARC breaks the pattern or HellaSwag ≈ MMLU)
      - Separability holds on knowledge benchmarks (<1%) but fails on 1-2 reasoning
        benchmarks (2-4% interaction under binary)
      - Gemma excluded from final analysis (3 models); multi-hardware (exp-003) completed
        but with limited second GPU availability
      - Bootstrap CIs on item_id overlap with model×item on at least one benchmark
      - D-study budgets vary across benchmarks but the differentiation is less dramatic
        than expected

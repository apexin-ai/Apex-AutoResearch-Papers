      narrative_direction: 'Claims require modulation but not abandonment. Claim 1
        becomes "item selection and model×item interaction jointly dominate" — weaker
        than "item is THE dominant source" but still supports the practical message
        that item sampling matters most. Claim 2 (separability) is explicitly qualified
        as "benchmark-conditional separability" — holds for knowledge tasks, breaks
        down for reasoning — which is reframed as a finding rather than a limitation.
        Claim 3 (D-study budgets) still stands but emphasize the benchmark-specificity
        more heavily since the gradient is noisier. Cross-benchmark gradient is presented
        as "directional trend" with CIs rather than "monotonic law." Add supplementary
        ANOVA comparison to show G-theory and ANOVA agree on the ranking even if magnitudes
        are uncertain. Strengthen the methodological contribution framing (the G-theory
        framework itself is valuable even with softer empirical findings). AAAI still
        viable but tighter; prepare ACL ARR as realistic fallback if writing timeline
        slips.

        '
    worst:
      tier: worst
      meaning: Model×item interaction dominates after reanalysis; no coherent benchmark
        gradient; separability fails broadly
      key_assumptions:
      - Model×item interaction becomes largest or co-largest source after model-as-facet
        reanalysis (item_id <28%, model×item >25%)
      - No systematic cross-benchmark gradient — variance structure is idiosyncratic
        per benchmark, not predictable from task type
      - Separability fails on 2+ benchmarks under binary scoring (infra×method >3%),
        undermining the confirmatory null
      - Gemma fully excluded; potential issues with second model reduce effective
        coverage to 2-3 models
      - exp-003 hardware unavailable or results show GPU×method interaction >2%, breaking
        the 'precision only' scoping
      - Bootstrap CIs are wide (>12pp), making it impossible to rank-order variance
        sources with confidence on several benchmarks
      - D-study budgets are implausibly large (>1000 items) or vary so much across
        benchmarks that no actionable recommendation emerges

      benchmark regime 中观察。 Claim 1 因此被精确化为 "benchmark-conditional item dominance"。Claim
      2 在所有 benchmark 上成立（max direct infra×method = 0.6% binary），但 text_match 上的 benchmark-conditional
      separability 破裂（GSM8K text_match 达 2.5%）进一步支撑了 Claim 3 的 metric-conditional
      论点。G-coefficient 反直觉地在 GSM8K 上更高（0.48 vs MMLU 0.36）——这是因为 MMLU 的极端 item 方差使得
      200-item 采样不足以稳定估计， 而 GSM8K 的 item 方差较低意味着相同 item 数量下估计更稳定（尽管需要更多 prompt/seed
      replications 来控制 interaction 方差）。

      '

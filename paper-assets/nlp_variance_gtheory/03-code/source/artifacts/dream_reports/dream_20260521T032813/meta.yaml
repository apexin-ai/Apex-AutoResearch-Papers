    result_rationale: 'Fine-tuning 与 inference 的方差层级根本不同：inference 中 item_id 58% 主导是因为模型
      权重固定，方差只来自 evaluation-time 因素（prompt、seed、precision 与 item difficulty 的 交互）。Fine-tuning
      引入了 training-time 随机性——seed 决定权重初始化和 dropout mask 序列， 不同 seed 产生的模型在 loss landscape
      上收敛到不同 local minima，导致完全不同的 item-level prediction patterns。seed 主效应 22.5% 反映了训练不稳定性在
      aggregate accuracy 上的表现 （Dodge et al. 2020 报告了类似量级的种子效应）。seed×item 11.8% 说明不同
      seed 不是均匀 地提升/降低所有 items 的准确率，而是改变了哪些 items 被正确分类——这正是 "模型选择" 偏差的 定量证据。LR 14.2%

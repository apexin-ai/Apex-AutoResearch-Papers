    - 'Fig E1-1: 4-panel stacked bar — per-model variance decomposition (binary).
      四个模型呈现几乎同构的方差结构，item_id 在 55-59% 区间以深蓝色主导，precision:item 和 temp:item 交互以中间色调紧随。视觉上立刻传达

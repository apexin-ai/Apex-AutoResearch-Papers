    description: 'RoBERTa-large fine-tuned on SST-2/MNLI/RTE/COPA. Fully crossed:
      6 seeds × 3 learning rates × 4 data shuffles × 3 GPUs × 2 precisions = 432 training
      runs per task × 4 tasks = 1728 total runs. Each trained model evaluated on full
      dev/test set. Tests whether variance hierarchy differs between inference-only
      and fine-tuning.


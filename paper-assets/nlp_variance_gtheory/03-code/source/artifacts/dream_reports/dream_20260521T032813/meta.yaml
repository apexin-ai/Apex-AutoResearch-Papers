      FMA 实现)。gpu×precision 交互 0.2%(binary) 是因为不同 GPU 微架构下 bf16→fp32 的 upcasting 路径略有差异，但
      argmax 截断后几乎不可检测。 gpu×item 1.8% 比 direct gpu×method 大一个数量级——这与 precision×item
      的模式一致： 硬件差异只在 item level 上可检测（特定困难 items 的 logit margins 恰好在两个 GPU 上 有不同的舍入命运），但在
      aggregate 层面被平均化。text_match 下 gpu×precision 0.8% 可检测，与 precision×temperature
      在 text_match 下可检测的逻辑一致——浮点非结合性在 逐 token 文本生成中累积，不同硬件的累积路径不同。总体结论：separability
      在 binary scoring 下成立，在 text_match 下需要限定——完美支撑 Claim 2 的 metric-qualified conditional
      separability 叙事。exp-003 将 "infrastructure" 从仅 precision 扩展到 precision + GPU
      type，大幅增强了 Claim 2 的外部效度。


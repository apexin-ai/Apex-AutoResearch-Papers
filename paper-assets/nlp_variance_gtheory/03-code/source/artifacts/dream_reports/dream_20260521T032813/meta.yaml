    result_rationale: 'Fine-tuning variance hierarchy differs substantially from inference.
      On large datasets (SST-2, MNLI), item_id is still the largest source (31-40%)
      but learning rate and seed×learning_rate interactions are substantial (10-14%),
      which have no analogue in inference. On small datasets (RTE: 277 items; COPA:
      100 items), seed becomes dominant (20-24%) because the training dynamics are
      chaotic with few examples — small perturbations in initialization cascade through
      training.

      GPU and precision contribute negligibly to fine-tuning variance (<2% combined),
      which contrasts with the 4-7% precision contribution in inference. This is because
      fine-tuning aggregates over many gradient steps, averaging out per-forward-pass
      precision effects.

      The cross-paradigm rank correlation (r=0.31) between inference and fine-tuning
      variance hierarchies means the findings do NOT transfer. A reviewer cannot extrapolate
      from our inference G-study to fine-tuning practice, and we cannot extrapolate
      from exp-006 back to inference. This supports the worst-tier narrative ("nothing
      generalizes") but also means exp-006 is somewhat disconnected from the paper''s
      main story. It becomes an appendix-level extension rather than a core contribution.

      The 6.6% run failure rate (NaN loss on high-lr×fp16 combinations with small
      datasets) is a methodological nuisance. These failures are informative (they
      show that some precision×hyperparameter combinations are unstable) but create
      missing cells in the G-theory design, requiring imputation or reduced analysis.

      '

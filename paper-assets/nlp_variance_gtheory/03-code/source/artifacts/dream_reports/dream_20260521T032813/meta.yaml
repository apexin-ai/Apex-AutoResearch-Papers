    result_rationale: 'item_id 在 57% 水平保持稳定是因为 200-item stratified sample 保留了 MMLU
      跨学科难度分布——item difficulty 变异本身就是 Bernoulli p(1-p) 的直接后果， 在 multiple-choice knowledge
      retrieval 中 p 值从 0.1 到 0.95 分布极广。四个 模型的 item_id% 在 55-60% 范围内波动（Mistral 略高因其整体准确率较低导致
      item difficulty 更分散），这与 single-model MVP 结果(58.4%)一致——模型间差异 不改变 item-level 方差主导地位。FP32
      在所有模型上均出现 ~8-9pp 降幅，因为 V0 enforce_eager 模式下 FP32 使用低效的 eager-mode attention
      计算路径， 这是 vLLM 引擎层面的系统性效应而非精度本身的问题。bf16≈fp16 差异 <0.2pp 验证了 D005 结论。precision×temperature
      交互在 binary scoring 下仅 0.2%， 因为 binary 对 logit 做 argmax 截断后，precision 和 temperature
      的联合效应 被离散化消除；而 text_match 下 1.1% 可检测，因浮点非结合性在长文本生成中 逐 token 累积。G=0.36(binary)
      反映了 item dominance 下 200 items 不足以 平均化 item-level 噪声，而 G=0.96(text_match) 说明
      prompt-item 交互一旦 被 text-level 连续度量吸收后可靠性大幅提升。

      '

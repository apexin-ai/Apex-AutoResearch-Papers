tier_definitions:
  tiers:
    best:
      tier: best
      meaning: All three claims confirmed with strong effect sizes; cross-benchmark
        gradient is clean and monotonic
      key_assumptions:
      - Item_id remains largest single variance source after model-as-facet reanalysis
        (>40% on MMLU)
      - 'Cross-benchmark gradient is monotonic: item dominance systematically decreases
        from knowledge (MMLU/ARC) to reasoning (GSM8K/MATH)'
      - Direct infra×method interaction <1% under binary scoring across ALL benchmarks
        (universal separability under binary)
      - All 4 models produce complete data (including Gemma via workaround or replacement)
      - exp-003 multi-hardware confirms separability extends beyond precision to GPU
        type
      - Bootstrap CIs on variance components are tight enough to reject overlap between
        item_id and next-largest source
      - D-study budgets differentiate clearly across benchmarks (not a single universal
        number)
      number_ranges:
        item_id_pct_mmlu_model_as_facet:
        - 40
        - 55
        model_x_item_pct_mmlu:
        - 8
        - 18
        item_id_pct_gsm8k:
        - 15
        - 30
        cross_benchmark_gradient_pp:
        - 15
        - 35
        direct_infra_x_method_binary_max:

    # Review Report: Model×Item Interaction Is the Hidden Dominant Variance Source
    in LLM Evaluation


    ## Summary


    This paper applies Generalizability Theory (G-theory) to decompose LLM evaluation
    variance across infrastructure (numerical precision), methodology (prompt, seed,
    temperature, ordering), and measurement (item) facets, with model treated as a
    crossed facet. Across 4 benchmarks and 3 open-weight 8B models, the central finding
    is that single-model analyses overestimate item difficulty dominance (53–59%),
    and when model is properly crossed, model×item interaction emerges at 31.2% as
    the largest variance source on MMLU, while item ID drops to 22.4%. The paper additionally
    shows that variance structure is benchmark-specific (r = −0.12 with task taxonomy),
    separability fails on 2/4 benchmarks, D-study budgets for G ≥ 0.90 are impractically
    large (980–2,000 items), and G-theory item requirements exceed IRT estimates by
    12.7×. Fine-tuning variance is also analyzed (RoBERTa-large on GLUE), revealing
    a qualitatively different hierarchy (r = 0.31 with inference).


    ---


    ## Strengths


    **S1. Novel and important research question.** No prior study has crossed infrastructure
    and methodology factors in a unified multi-facet variance decomposition for LLM
    evaluation. The application of G-theory with model as a crossed facet is a genuine
    methodological advance over single-factor sensitivity studies (Sclar et al., Yuan
    et al.) and single-benchmark G-studies (Mesting 2026). The "reveal" structure
    — showing that single-model analyses are systematically misleading — is compelling.


    **S2. The model×item interaction finding is consequential.** The 33.6pp drop in
    item ID when model is added as a facet, and the emergence of model×item interaction
    as the largest source, is a surprising and practically important result. It directly
    challenges the implicit assumption in the evaluation community that item difficulty
    is a stable property across models. If this finding holds, it fundamentally changes
    how we think about benchmark design and reproducibility.


    **S3. Impressive experimental scale and thoroughness.** 777,600 observations on
    MMLU alone, plus ~518K across three additional benchmarks, plus fine-tuning experiments.
    The sensitivity analyses (Table 12: REML vs Henderson, fixed vs random, binary
    vs text-match, design reduction, bootstrap vs jackknife) demonstrate unusual methodological
    care. The paper honestly reports that model×item remains the largest or co-largest
    source under all analytic variants — this is the right way to handle robustness.


    **S4. The G-theory vs. IRT comparison (§4.6) is a standalone contribution.** The
    12.7× discrepancy between IRT-based subsampling (110 items) and G-theory budgets
    (1,400 items) is clearly explained as reflecting different reliability definitions
    (within-protocol vs. cross-protocol). This directly informs practitioners using
    tinyBenchmarks-style approaches and deserves wide attention.


    **S5. Transparent self-critique.** The Bernoulli artifact analysis (61% of item
    ID is mechanical), the item resampling instability (12.5pp range, Appendix A),
    and the explicit scoping of hardware results to single-architecture are commendable.
    Many papers would bury these; this paper foregrounds them, which strengthens trust.


    ---


    ## Weaknesses


    **W1. Three models is critically insufficient for random-effects variance estimation
    (Major).**

    The entire headline claim rests on estimating model×item interaction as a random
    effect from only 3 models (Llama-3.1-8B, Mistral-7B, Qwen3-8B). With k = 3 levels
    for the model facet, the variance component estimate has very few effective degrees
    of freedom. This is a known limitation in G-theory: variance components estimated
    from few levels of a facet are highly unstable and biased. The bootstrap CIs reflect
    this — 14.9pp width for model×item (Table 11) — but the paper does not adequately
    discuss whether 3 models are sufficient for the claims being made. In psychometric
    practice, G-studies with a facet having only 3 levels would be viewed as pilot
    data, not a basis for definitive conclusions. The planned 4th model (Gemma) was
    excluded, and the 14B extension (Appendix G) yielded only 2 models. The paper
    needs either more models or a much more cautious framing.


    **W2. Overlapping confidence intervals undermine the headline claim (Major).**

    The 95% bootstrap CIs for item ID [14.8, 30.1] and model×item [23.8, 38.7] overlap
    substantially (Table 2). The paper states "the point estimate consistently places
    model×item above item ID across bootstrap resamples" but does not report what
    fraction of resamples show this ranking, nor does it provide a formal test. The
    title asserts model×item is "the hidden dominant variance source" — a claim the
    paper''s own uncertainty quantification does not support at conventional confidence
    levels. This gap between the strength of the title/abstract claims and the statistical
    evidence is a significant concern for a top venue.


    **W3. Item resampling instability (12.5pp) erodes confidence in all reported numbers
    (Major).**

    Appendix A shows item ID ranges from 48.7% to 61.2% across three 200-item MMLU
    draws. This 12.5pp range exceeds within-sample bootstrap CIs and is driven by
    item difficulty distribution (Bernoulli p(1−p) mechanism). The implication is
    that the specific percentages reported throughout the paper (e.g., 55.8% → 22.4%
    → 31.2%) are sample-dependent and should not be interpreted as precise estimates.
    Yet the paper''s narrative heavily relies on these specific numbers. The Bernoulli
    artifact (61% of item ID is mechanical) compounds this: the "item dominance" finding
    in single-model analyses is partly an artifact of using binary scoring on heterogeneous
    items, not a deep psychometric property. The paper acknowledges both issues but
    does not adequately integrate them into the claim structure — the abstract and
    conclusion still present numbers as if they are stable.


    **W4. Hardware experiment failed its primary objective (Major).**

    The planned cross-architecture comparison (A100 vs RTX PRO 6000) could not be
    executed. The fallback — two physical units of the same GPU type — shows near-zero
    cross-unit variance (< 0.1%), which is trivially expected. This means "infrastructure"
    in this paper really means "numerical precision on a single GPU architecture,"
    a much narrower scope than the framing suggests. The paper acknowledges this in
    §5.3 but the abstract and introduction still frame the work as studying "infrastructure"
    broadly. Cross-architecture effects could plausibly add 2–3% additional variance
    (the paper''s own simulated projection), which would change the separability conclusions.
    This is not a minor limitation — it''s a missing experiment that the paper''s
    design was supposed to include.


    **W5. Benchmark-specificity undermines generalizability of the central finding
    (Moderate).**

    The paper''s own results show variance structure is idiosyncratic per benchmark:
    item ID ranges from 9.1% (GSM8K) to 34.1% (ARC); model×item ranges from 21.7%
    (HellaSwag) to 31.2% (MMLU); the dominant interaction differs per benchmark (seed×item
    on GSM8K, prompt×item on HellaSwag). The correlation with task taxonomy is r =
    −0.12. This means the MMLU result (model×item = 31.2%) cannot be assumed to hold
    even qualitatively on other benchmarks. The paper is honest about this, but it
    creates a tension: the title makes a universal claim ("the hidden dominant variance
    source in LLM evaluation") that the data shows is benchmark-conditional.


    **W6. The fine-tuning analysis is disconnected and weakens coherence (Moderate).**

    The inference-vs-fine-tuning rank correlation is r = 0.31, confirming these are
    essentially separate stories. The fine-tuning results (Section 4.7, Table 7) are
    interesting in isolation (large-dataset item dominance vs. small-dataset seed
    dominance) but they cannot inform or be informed by the inference findings. Including
    them adds breadth at the cost of depth and narrative coherence. The paper already
    struggles with "everything is complicated and nothing generalizes" — adding a
    disconnected paradigm amplifies this problem. This material would be better as
    a companion paper.


    **W7. D-study budgets are so large as to be practically unactionable (Moderate).**

    The D-study projections (Table 5) show 980–2,000 items needed per benchmark for
    G ≥ 0.90 under binary scoring, with GSM8K exceeding its test set size. The 45-to-2,000
    range across benchmarks and metrics means no single recommendation is possible.
    While the paper frames this as a finding ("current practices are inadequate"),
    a reader seeking practical guidance gets nothing actionable. The cost estimates
    ($4.2K–$11.5K per benchmark) are striking but only for MMLU; other benchmarks
    lack cost columns. The paper would benefit from intermediate recommendations (e.g.,
    "to achieve G ≥ 0.80, which represents a meaningful improvement over current practice,
    use X items").


    **W8. FP32 degradation (6.8pp) is insufficiently explained (Minor).**

    The consistent FP32 accuracy degradation relative to BF16/FP16 across all models
    is attributed to "enforce_eager controlled pattern where FP32 uses different CUDA
    execution paths" (Appendix B). This is a substantial effect that could be a vLLM
    implementation artifact rather than a genuine precision phenomenon. If it is an
    artifact, the precision facet''s variance contribution (4.3%) may be inflated.
    The paper should either investigate this more thoroughly or explicitly caveat
    that "precision effects" may partially reflect inference engine behavior.


    **W9. Citation formatting issues (Minor).**

    Several citations appear as raw BibTeX keys in the text (e.g., "sclar2024quantifying,"
    "pezeshkpour2024largelanguagemodelsensitivity," "mesting2026generalizability").
    This suggests incomplete compilation and is unusual for a submission-ready manuscript.


    ---


    ## Missing Experiments Relative to Design


    Comparing to the experimental plan:

    - **exp-003 (hardware crossing)**: Failed — only same-architecture pseudo-replication.
    Acknowledged.

    - **exp-005 (14B models)**: Severely degraded — only 2 models, reduced design,
    appendix-level. Cannot support claims.

    - **exp-007 (LayerCast)**: Included as appendix. Negative result (increases variance).
    Appropriate coverage.

    - **exp-008 (MATH)**: Included as appendix. Extreme interaction-dominated pattern.
    Appropriate coverage.

    - **exp-001b (item resampling)**: Included as appendix. Critical finding (instability).
    Could be in main text.


    The two significant failures (exp-003, exp-005) both relate to hardware/scale,
    leaving the paper''s "infrastructure" coverage narrower than intended.


    ---


    ## Questions for Authors


    1. What fraction of bootstrap resamples show model×item > item ID? If it is, say,
    65%, the claim of "dominance" is much weaker than if it is 95%.

    2. With only 3 models, have you considered the expected bias in variance component
    estimation? Henderson''s Method III is unbiased for balanced designs, but how
    does the 3-level model facet affect this?

    3. The Bernoulli artifact analysis shows 61% of item ID is mechanical. Could a
    similar artifact inflate model×item interaction? Differential item functioning
    between models also operates through binary p(1−p), since the interaction is estimated
    from differences in binary accuracy profiles.

    4. Would restricting to items with intermediate difficulty (0.3 < p < 0.7) change
    the model×item dominance finding, or is it robust to removing the Bernoulli-extreme
    items?

    5. The FP32 degradation: have you verified this effect with a different inference
    engine (e.g., HuggingFace Transformers native inference) to rule out vLLM-specific
    behavior?


    ---


    ## Minor Comments


    - Table 1 uses dashes for most sources per model — clarify if these are 0%, <
    0.1%, or not estimated in the single-model design.

    - The paper should state explicitly whether model is treated as random or fixed
    in the G-study, and justify the choice. With 3 levels, the random assumption is
    debatable and the fixed-vs-random sensitivity (7.2pp, Table 12) is the paper''s
    largest sensitivity.

    - Appendix ordering (A through I) is extensive but the main text does not always
    guide the reader to the most critical appendices. Appendix A (item resampling)
    is arguably more important than several main-text sections.


    ---


    ## Overall Assessment


    **Score: 3 / 6 (Reject)**


    The paper tackles a genuinely important problem and introduces a valuable methodological
    framework (multi-facet G-theory with model crossing). The model×item interaction
    finding, if robust, would be a significant contribution to the evaluation literature.
    However, the current evidence is insufficient to support the strength of the claims:


    1. Three models provide too few degrees of freedom for reliable random-effects
    estimation of the headline variance component.

    2. The bootstrap CIs overlap for the two key sources, meaning the "dominance"
    claim is not statistically supported.

    3. The 12.5pp item resampling instability and 61% Bernoulli artifact together
    indicate that the specific variance percentages are order-of-magnitude estimates,
    not precise measurements — yet the paper presents and interprets them as if precise.

    4. The failed hardware experiment leaves a significant gap in the infrastructure
    coverage.

    5. The benchmark-specificity of results (the paper''s own finding) undermines
    the generality of the title-level claim.


    The paper would benefit substantially from: (a) expanding to 6+ models across
    different families and scales, (b) using larger item samples (500+) to reduce
    resampling instability, (c) toning down the title and abstract to match the evidence
    ("model×item interaction is a major, previously hidden variance source" rather
    than "the dominant source"), and (d) either completing the cross-architecture
    experiment or explicitly reframing the scope. The G-theory vs IRT comparison and
    the separability failure findings are strong enough to anchor a revised paper
    even without the "dominance" claim.


    **Confidence: 4/5.** I am familiar with G-theory and variance decomposition methods,
    and have reviewed the paper and experimental plan carefully. My main uncertainty
    is whether the 3-model limitation is as crippling as I assess — a G-theory specialist
    might argue that 3 levels is adequate for certain estimation purposes, though
    it is below standard psychometric practice.


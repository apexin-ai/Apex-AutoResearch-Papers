      misleading. Model×item interaction (31.2%) — not item difficulty — is the dominant
      variance source when models are properly crossed. This is the worst-tier''s
      central finding and it is genuinely novel and surprising. However, the wide
      bootstrap CIs, the Bernoulli mechanical artifact, and the benchmark-idiosyncratic
      patterns make the paper very hard to write cleanly. Every claim requires heavy
      qualification. The D-study budgets are impractically large and benchmark-specific,
      providing no actionable "recipe." The G-theory vs IRT comparison is the strongest
      standalone contribution but is a methods comparison, not an empirical finding.
      The narrative must shift to: "evaluation is harder than you think, and here''s
      exactly why."

      '

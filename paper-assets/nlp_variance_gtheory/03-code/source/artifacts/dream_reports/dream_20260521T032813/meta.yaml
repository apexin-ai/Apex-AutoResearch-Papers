    - 'Fig E1-2: 双指标对比 — binary vs text_match 方差结构（grouped bar per component）。binary
      下 item_id=57% 主导 vs text_match 下 prompt:item=36% 主导，直观展示指标选择如何根本性地改变方差结论。'
    - 'Fig E1-3: Heatmap — model × precision × temperature 准确率。FP32 行在所有模型上均呈现明显冷色调（低准确率），bf16/fp16

      >5pp 的波动；2.8pp 的 range 落在统计噪声范围内， 确认 item dominance 是 MMLU 难度分布的总体特性而非样本偶然。G-coefficient
      同样稳定 （range=0.03），进一步验证 D-study 推断的可靠基础。

      '

      推荐（灰色）vs G-theory binary（蓝色）vs G-theory text_match（橙色）。MMLU 上 4.2× 差异是视觉焦点。'
    - 'Fig E4-4: Bootstrap CI forest plot — 所有 variance components 的点估计 + 95% CI，水平排列。item_id

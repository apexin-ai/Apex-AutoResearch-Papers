    result_rationale: 'Cross-benchmark gradient 的物理机制：MMLU 是 knowledge retrieval，答案由模型权重中
      存储的事实决定——item difficulty（该事实是否被记忆）解释了大部分方差。ARC 是 science reasoning 但仍有大量事实检索成分，item_id
      降至 43.7%。HellaSwag 是 commonsense completion，需要更多 contextual inference，temperature
      和 seed 对生成路径的影响更大， item_id 降至 38.2%。GSM8K 是 multi-step arithmetic reasoning，每一步的
      token sampling 引入 compounding uncertainty——temperature×item 跃升至 18.5% 因为不同难度的
      题目对 sampling 随机性的敏感度差异巨大（简单的一步题几乎不受影响，复杂的五步题在每步都可能 偏离正确路径）。seed×item 12.3% 同理——CUDA
      级非确定性在 multi-step generation 中 逐步累积。residual 在 GSM8K 达 24.8% 反映了未建模的高阶交互（prompt×seed×item
      等）。 precision×temperature 在 binary 下始终 ≤0.6%——即使在 reasoning 任务上 aggregate-level
      separability 仍然成立，因为 precision 影响的是 logit 精度而 temperature 影响的是 sampling distribution，两者通过不同机制作用于输出。但在
      text_match 下 GSM8K 的 precision×temperature 达 2.5%，因为 reasoning chain 的文本表达对浮点累积误差更敏感。
      gradient 的单调性（57>44>38>22）不是拟合结果而是任务认知复杂度的直接映射。


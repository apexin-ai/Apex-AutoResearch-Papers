    result_rationale: '(a) Model-as-facet reanalysis将 item_id 从 57.1% 降至 47.3%：差值中
      ~12.1% 重新归因为 model×item 交互（不同模型在不同 items 上有不同优势/劣势），~3.8% 归为 model 主效应 （模型间整体能力差异）。这是
      G-theory 正确处理 nested vs crossed 设计的教科书结果—— single-model 分析将 model×item 方差混入
      item_id 和 residual 中。关键是 item_id 即使 降至 47.3% 仍远超 40% threshold，且 cross-benchmark
      gradient 保持单调（29.1pp）， Claim 1 完全成立。 (b) Bootstrap CI width 4.8pp 足够窄以排斥 item_id
      与 model×item 的重叠—— item_id 下界 44.9% vs model×item 上界 ~15.6%，无交集。precision×temperature
      在 binary 下 CI 包含 0（不显著），在 text_match 下排除 0（显著）——精确支撑 metric-conditional separability。
      (c) D-study projections 分化明显：MMLU 需要 420 items 但仅 2520 evals（item-dominated，
      多 items 少 replications）；GSM8K 仅需 220 items 但 14080 evals（interaction-dominated，
      少 items 多 replications）。这个 5.6× 的 eval budget 差异直接否定了 "universal reproducibility
      recipe" 的可能性——核心 deliverable。 (d-n) 所有 sensitivity analyses 均在 robustness threshold
      内：REML vs Henderson <2pp, fixed vs random <3pp, design asymmetry <1pp, bootstrap
      vs jackknife <20%。这不是偶然—— 当 item_id 在 40-57% 量级主导时，方法论选择对结论的影响是二阶小量。 (h) IRT
      4.2× ratio 是因为 tinyBenchmarks IRT 仅优化 item selection（假设单一 evaluation condition），而
      G-theory D-study 在 items × prompts × seeds × temps × orderings 的 联合空间中优化——额外维度需要更多
      items 来维持跨维度的可靠性。这个比较本身是 standalone contribution 级别的发现。 (l) Bernoulli 机械方差占
      item_id 的 35%（correlation 0.82），但校正后 informative item_id 仍有 30.7%——远高于其他任何单一
      component。parallel text_match 分析确认方差结构 在非 binary 度量下保持，驳斥 "item dominance 仅是
      binary scoring artifact" 的批评。 (o) 14K items 下 G=0.94(binary) 说明 full MMLU 本身在
      binary 下是 adequate 的， problem 在于 subsampling practices——这精确定位了 "reproducibility
      gap" 的来源。

      '

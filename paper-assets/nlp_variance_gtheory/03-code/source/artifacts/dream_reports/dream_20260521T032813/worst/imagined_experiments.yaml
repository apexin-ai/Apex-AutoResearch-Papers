  - 'Scatter plot: 8B vs 14B item-level accuracy. r=0.64. Points dispersed more than
    within-scale comparisons. Suggestive but underpowered.'
  analysis: 'exp-005 is the clearest casualty of the worst tier. It either doesn''t
    run or produces too little data to support claims. Relegated to a brief appendix
    mention or dropped entirely. The cross-scale correlation finding (r=0.64) is interesting
    but requires follow-up work with more models and a full crossing design.

    '
- name: exp-006 Fine-Tuning G-Study
  plan_id: exp-006
  description: 'RoBERTa-large on SST-2/MNLI/RTE/COPA. 6 seeds × 3 learning rates ×
    4 data shuffles × 3 GPUs × 2 precisions = 432 runs/task × 4 tasks = 1,728 total
    runs. Independent of inference experiments. Tests fine-tuning variance hierarchy.

    '
  expected_results:
    total_runs_completed: 1614
    total_runs_planned: 1728
    failure_rate: 0.066
    failed_config: lr=5e-4 × fp16 on RTE/COPA (small datasets, unstable)
    item_id_pct_sst2: 0.312
    seed_pct_sst2: 0.089
    lr_pct_sst2: 0.143
    data_shuffle_pct_sst2: 0.034
    gpu_pct_sst2: 0.002
    precision_pct_sst2: 0.018
    seed_x_lr_pct_sst2: 0.112
    residual_pct_sst2: 0.178
    g_coeff_sst2: 0.487
    item_id_pct_mnli: 0.401
    lr_pct_mnli: 0.098
    seed_pct_mnli: 0.067
    seed_x_item_pct_mnli: 0.134
    residual_pct_mnli: 0.156
    g_coeff_mnli: 0.534
    item_id_pct_rte: 0.187
    seed_pct_rte: 0.203
    lr_pct_rte: 0.178
    seed_x_lr_pct_rte: 0.156
    residual_pct_rte: 0.214
    g_coeff_rte: 0.298
    item_id_pct_copa: 0.134
    seed_pct_copa: 0.241
    lr_pct_copa: 0.198
    residual_pct_copa: 0.267
    g_coeff_copa: 0.213
    inference_vs_finetuning_rank_correlation: 0.31
    dominant_source_inference: item_id (or model×item)
    dominant_source_finetuning: item_id on large datasets; seed on small datasets
  result_rationale: 'Fine-tuning variance hierarchy differs substantially from inference.
    On large datasets (SST-2, MNLI), item_id is still the largest source (31-40%)
    but learning rate and seed×learning_rate interactions are substantial (10-14%),
    which have no analogue in inference. On small datasets (RTE: 277 items; COPA:
    100 items), seed becomes dominant (20-24%) because the training dynamics are chaotic
    with few examples — small perturbations in initialization cascade through training.

    GPU and precision contribute negligibly to fine-tuning variance (<2% combined),
    which contrasts with the 4-7% precision contribution in inference. This is because
    fine-tuning aggregates over many gradient steps, averaging out per-forward-pass
    precision effects.

    The cross-paradigm rank correlation (r=0.31) between inference and fine-tuning
    variance hierarchies means the findings do NOT transfer. A reviewer cannot extrapolate
    from our inference G-study to fine-tuning practice, and we cannot extrapolate
    from exp-006 back to inference. This supports the worst-tier narrative ("nothing
    generalizes") but also means exp-006 is somewhat disconnected from the paper''s
    main story. It becomes an appendix-level extension rather than a core contribution.

    The 6.6% run failure rate (NaN loss on high-lr×fp16 combinations with small datasets)
    is a methodological nuisance. These failures are informative (they show that some
    precision×hyperparameter combinations are unstable) but create missing cells in
    the G-theory design, requiring imputation or reduced analysis.

    '
  tables:
  - name: 'Table 14: Fine-Tuning Variance Decomposition Across Tasks'
    description: 'Rows: seed, learning_rate, data_shuffle, gpu, precision, item_id,
      seed×lr, seed×item, residual. Columns: SST-2, MNLI, RTE, COPA. Clear split between
      large-dataset (item-dominated) and small-dataset (seed-dominated) patterns.

      '
  - name: 'Table 15: Inference vs Fine-Tuning Variance Hierarchy Comparison'
    description: 'Side-by-side ranking of variance sources. Inference: item_id > model×item
      > residual > temperature×item > prompt×item. Fine-tuning: item_id > seed×lr
      > seed > lr > residual. Different hierarchies, different implications.

      '
  figures_description:
  - 'Paired stacked-bar: inference (MMLU) vs fine-tuning (SST-2) variance decomposition.
    Visually distinct patterns — different colors dominate each bar.'
  - 'G-coefficient comparison: inference tasks vs fine-tuning tasks. Fine-tuning G
    is generally higher on large datasets but lower on small datasets.'
  analysis: 'exp-006 produces a valid standalone result (fine-tuning variance hierarchy
    differs from inference) but its contribution to the main paper is ambiguous. It
    supports the worst-tier message ("nothing generalizes across paradigms") but also
    weakens coherence — the paper is already struggling to find a unifying narrative,
    and adding a disconnected fine-tuning analysis makes it more scattered. Recommend
    relegating to a 1-page appendix or splitting into a separate short paper.

    '
- name: exp-007 LayerCast Precision Mitigation
  plan_id: exp-007
  description: 'LayerCast (FP16 storage + FP32 compute) as additional precision condition
    on MMLU. Tests whether this mixed-precision strategy reduces variance from the
    precision facet.

    '
  expected_results:
    total_records: 43200
    layercast_accuracy: 0.6482
    layercast_vs_fp32_gap_pp: 4.88
    layercast_vs_bf16_gap_pp: -3.62
    precision_variance_with_layercast_pct: 5.1
    layercast_item_level_correlation_with_bf16: 0.87
    layercast_item_level_correlation_with_fp32: 0.72
    variance_reduction_from_layercast: none — adds variance rather than reducing it
  result_rationale: 'LayerCast does not cleanly reduce variance because it creates
    a hybrid precision regime that behaves differently from both pure FP32 and pure
    FP16/BF16. The storage-in-FP16, compute-in-FP32 approach means attention computations
    use FP32 but weight quantization noise from FP16 storage propagates through. The
    result is an accuracy level between FP32 and BF16 (64.8%), but with item-level
    patterns that don''t correlate perfectly with either pure precision. Adding LayerCast
    as a 4th precision level actually INCREASES precision facet variance (from 4.3%
    to 5.1%) because it adds another distinct level rather than collapsing precision
    differences. This is a negative result for the mitigation narrative but a positive
    result for the worst-tier message: precision effects are complex and non-monotonic,
    and simple mitigation strategies don''t work as advertised.

    '
  tables:
  - name: 'Table A2 (Appendix): LayerCast Variance Impact'
    description: '4-row precision comparison (FP32, FP16, BF16, LayerCast) with accuracy,
      item-level correlation with BF16, and precision facet variance contribution.
      LayerCast is intermediate but not a clean fix.

      '
  figures_description:
  - 'Item-level accuracy scatter: LayerCast vs BF16 (r=0.87) and LayerCast vs FP32
    (r=0.72). Two panels showing LayerCast is closer to BF16 but not a drop-in replacement.'
  analysis: 'exp-007 is a minor negative result. LayerCast doesn''t serve as a precision
    mitigation strategy in this context. Useful as a 1-paragraph appendix note showing
    that mixed-precision approaches don''t simplify the variance picture. Low priority
    for inclusion in the worst-tier paper.

    '
- name: exp-008 MATH Benchmark Extension
  plan_id: exp-008
  description: 'MATH benchmark (200 items) with chain-of-thought reasoning. Tests
    whether reasoning-heavy tasks with long generation have qualitatively different
    variance structure.

    '
  expected_results:
    total_records: 115200
    models_completed: 2
    overall_accuracy_llama: 0.341
    overall_accuracy_qwen: 0.428
    accuracy_range_across_conditions: 0.187
    item_id_pct_math: 0.118
    seed_pct_math: 0.134
    temperature_pct_math: 0.156
    prompt_pct_math: 0.087
    seed_x_item_pct_math: 0.168
    temperature_x_item_pct_math: 0.143
    precision_x_temperature_pct_math_binary: 4.7
    residual_pct_math: 0.194
    g_coeff_binary_math_200item: 0.152
    d_study_items_for_g90_math_binary: not achievable within MATH test set size
    avg_generation_length_tokens: 487
    generation_length_cv: 0.68
    accuracy_conditional_on_cot_length: non-monotonic — medium length CoT has highest
      accuracy
  result_rationale: 'MATH represents the extreme end of the worst-tier pattern. Item_id
    is only 11.8% — the lowest of any benchmark — because chain-of-thought generation
    introduces massive stochastic branching. Each reasoning step is a decision point
    where temperature and seed can send the model down different solution paths. The
    seed×item (16.8%) and temperature×item (14.3%) interactions are the dominant sources,
    meaning the same item can be solved or not depending on the random seed and temperature
    — an extreme form of the model×item interaction pattern.

    The 18.7pp accuracy range across conditions for the same model on the same items
    is striking: the "same" evaluation can produce 34.1% or 52.8% accuracy for Llama
    on MATH depending on prompt/seed/temperature. This makes any single-run MATH evaluation
    essentially meaningless for fine-grained model comparison.

    Separability fails catastrophically: precision×temperature interaction is 4.7%
    under binary scoring, the highest of any benchmark. This is because FP16/BF16
    rounding in the softmax creates different token selections at each reasoning step,
    and at higher temperatures these divergences compound over 400+ tokens of chain-of-thought.

    G=0.152 for 200 items under binary scoring is the lowest across all benchmarks.
    D-study projections show G≥0.90 is not achievable within MATH''s test set (5000
    items) because the dominant variance sources (seed×item, temperature×item) cannot
    be reduced by adding items — they require averaging over many seeds and temperatures
    per item, which is computationally expensive.

    Mistral''s exclusion (accuracy <10%, effectively random guessing on MATH) further
    reduces model coverage to 2, making model-as-facet analysis impossible on this
    benchmark.

    '
  tables:
  - name: 'Table A3 (Appendix): MATH Variance Decomposition'
    description: 'Seed×item (16.8%) and temperature×item (14.3%) dominate. Item_id
      is only 11.8%. Precision×temperature is 4.7%. G=0.152. The most extreme interaction-dominated
      pattern in the study.

      '
  - name: 'Table A4: Accuracy Range by Model Across Conditions (MATH)'
    description: '2 models × min/max/range across all conditions. Llama: 22.5-52.8%
      (range 30.3pp). Qwen: 31.2-58.4% (range 27.2pp). Demonstrates that single-run
      MATH evaluation is unreliable.

      '
  figures_description:
  - 'Heatmap: seed × temperature accuracy grid for Llama on MATH. High variance visible
    — hot spots and cold spots across the grid with no smooth pattern.'
  - 'Chain-of-thought length distribution by accuracy outcome (correct vs incorrect).
    Bimodal: very short (gave up) and very long (went in circles) both predict failure.'
  analysis: 'MATH is the poster child for the worst-tier narrative: everything interacts,
    nothing is stable, and single-run evaluation is meaningless. But with only 2 models
    and a reduced design, the evidence is thin. The extreme interaction dominance
    is compelling but also predictable (CoT reasoning is inherently stochastic). The
    finding reinforces the "no gradient" message — MATH is not simply "one step further"
    on a knowledge→reasoning continuum; it has a qualitatively different variance
    structure that shares nothing with MMLU or ARC. Best used as a dramatic closing
    example in the paper rather than a core analysis.'

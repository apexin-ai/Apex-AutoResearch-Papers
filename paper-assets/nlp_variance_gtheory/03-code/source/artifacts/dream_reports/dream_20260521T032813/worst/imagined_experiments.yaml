  result_rationale: 'In the worst tier, exp-003 fails its primary objective. Two scenarios:
    (A) Hardware unavailable: Manager cannot allocate a second GPU architecture within
    the AAAI timeline. The fallback pseudo-replication (two physical units of RTX
    PRO 6000) shows near-zero cross-unit variance (0.08%), which is expected — same
    architecture, same drivers, same CUDA version. This tells us nothing about true
    hardware×methodology interaction. The "infrastructure" facet remains limited to
    "numerical precision on a single GPU architecture," severely weakening Claim 2.
    (B) Hardware obtained but interaction is large: if an A100 is obtained, the GPU×method
    interaction reaches 2.4% under binary scoring (driven by different CUDA kernel
    implementations for attention between Ampere and Ada Lovelace). GPU×item interaction
    is even larger (3.1%), meaning hardware affects items differentially — some items
    are hardware-sensitive while others are not. This breaks the "precision only"
    scoping assumption and means the paper must either include hardware as a full
    facet (requiring much more analysis) or explicitly scope the study to single-architecture
    inference. Either outcome damages the paper.

    '

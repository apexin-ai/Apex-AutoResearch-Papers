tier: worst
narrative_guidance: 'Core framing ("item dominance + benchmark gradient") collapses.
  Reframe around: "Model×item interaction is the hidden dominant variance source in
  LLM evaluation — items that are easy for one model are hard for another, and this
  interaction, not item difficulty alone, drives irreproducibility." Separability
  failure becomes a positive finding: isolated-factor studies are insufficient. D-study
  pivots to "current evaluation practices are even more inadequate than prior work
  suggests." Drop the gradient narrative entirely; replace with "variance structure
  is benchmark-specific and unpredictable from task taxonomy alone." The paper becomes
  more iconoclastic. ACL ARR October becomes realistic primary target.

  '
imagined_experiments:
- name: exp-001 Full-Scale Precision Study (MMLU)
  plan_id: exp-001
  description: '4 models × 3 precisions × 6 prompts × 6 seeds × 3 temperatures × 4
    orderings × 200 MMLU items. Gemma-2-9B-IT fails during FP16 runs (known from registry:
    exp001_gemma FAILED). Qwen3-8B produces sporadic decoding anomalies under FP32
    at T=0.7, requiring partial reruns. Final dataset covers 3 models (Llama, Mistral,
    Qwen) with Gemma fully excluded, yielding 3 × 1296 = 3888 conditions × 200 items
    = 777,600 records.

    '
  expected_results:
    total_records: 777600
    models_completed: 3
    models_excluded: 1
    conditions_per_model: 1296
    items_per_condition: 200
    overall_accuracy_llama: 0.681
    overall_accuracy_mistral: 0.623
    overall_accuracy_qwen: 0.704
    accuracy_bfloat16_pooled: 0.68
    accuracy_float16_pooled: 0.678
    accuracy_float32_pooled: 0.611
    float32_degradation_pp: 6.8
    null_predictions_pct: 0.03
    item_id_pct_llama_single: 0.561
    item_id_pct_mistral_single: 0.534
    item_id_pct_qwen_single: 0.589
    residual_pct_llama_single: 0.182
    residual_pct_mistral_single: 0.197
    residual_pct_qwen_single: 0.168
    g_coeff_binary_llama_200item: 0.362
    g_coeff_binary_mistral_200item: 0.338
    g_coeff_binary_qwen_200item: 0.371
    g_coeff_text_match_llama_200item: 0.968
    precision_x_temperature_text_match_llama_pct: 1.5
    precision_x_temperature_text_match_mistral_pct: 1.8
  result_rationale: 'Single-model analyses replicate MVP findings: item_id dominates
    at 53-59% per model, consistent with Bernoulli variance spread across 200 items
    of heterogeneous difficulty. FP32 degradation (~6.8pp) replicates the V0 enforce_eager-controlled
    pattern from bf16_eager_disentangle. These per-model results look encouraging
    — item dominance appears stable. But this is misleading: the residual component
    (17-20%) is inflated because model×item interaction is confounded with residual
    when model is not a facet. The true picture emerges only in exp-004 reanalysis.
    Gemma exclusion reduces the model universe from 4 to 3, weakening generalizability
    claims and inviting reviewer criticism about restricted model coverage. Qwen FP32
    anomalies at T=0.7 suggest architecture-specific precision sensitivity, foreshadowing
    the idiosyncratic variance patterns that dominate the worst-tier narrative.

    '
  tables:
  - name: 'Table 1: Single-Model Variance Decomposition (MMLU, 200 items, binary scoring)'
    description: 'Rows: variance sources (item_id, prompt, seed, temperature, ordering,
      precision, all 2-way interactions, residual). Columns: Llama, Mistral, Qwen,
      Pooled. Shows item_id dominant at 53-59% across all 3 models. Residual inflated
      at 17-20%. Precision×temperature interaction 0.3-0.5% under binary, 1.5-1.8%
      under text_match.

      '
  - name: 'Table 2: Accuracy Summary by Precision × Temperature × Model'
    description: '3×3×3 table. FP32 degradation visible across all models (5.5-8.5pp).
      Temperature effect modest (T=0.0 vs T=0.7: 2-3pp). Cross-model accuracy spread:
      8pp.

      '
  figures_description:
  - Accuracy heatmap (3 models × 3 precisions × 3 temperatures). FP32 row visibly
    darker. Model ranking preserved across conditions but gap varies.
  - 'Item-level accuracy distributions per model: overlapping but offset histograms
    showing each model has distinct difficulty profile for the same 200 items.'
  analysis: 'Data collection succeeds for 3/4 models. Per-model G-studies replicate
    MVP item dominance finding. However, item-level correlation between models is
    only r=0.71-0.78 (not r=0.90+), foreshadowing large model×item interaction in
    the facet reanalysis. The single-model framing looks solid at this stage but will
    collapse in exp-004.

    '
- name: exp-001b Item Resampling Stability
  plan_id: exp-001b
  description: '3 independent stratified 200-item MMLU samples (seeds 0, 7, 99) ×
    Llama × 3 precisions × 3 prompts × 3 seeds × 2 orderings = 54 conditions per sample.
    Tests whether item_id dominance percentage is stable across item draws.

    '
  expected_results:
    total_records_per_sample: 10800
    total_records: 32400
    item_id_pct_sample_seed0: 0.541
    item_id_pct_sample_seed7: 0.612
    item_id_pct_sample_seed99: 0.487
    item_id_range_pp: 12.5
    residual_pct_range:
    - 0.155
    - 0.221
    g_coeff_binary_seed0: 0.341
    g_coeff_binary_seed7: 0.389
    g_coeff_binary_seed99: 0.312
    g_coeff_range_pp: 7.7
    item_difficulty_mean_seed0: 0.683
    item_difficulty_mean_seed7: 0.671
    item_difficulty_mean_seed99: 0.698
    item_difficulty_sd_seed0: 0.284
    item_difficulty_sd_seed7: 0.301
    item_difficulty_sd_seed99: 0.262
  result_rationale: 'The 12.5pp range in item_id percentage across three samples (48.7-61.2%)
    is uncomfortably wide. This is driven by differential item difficulty variance:
    sample seed99 has lower difficulty SD (0.262 vs 0.301), mechanically reducing
    Bernoulli p(1-p) spread and thus item_id''s share. This directly validates the
    MD1 concern — item_id percentage is partly a mechanical artifact of the item difficulty
    distribution in the sample, not a stable psychometric property. The instability
    makes it impossible to report a single "item_id = X%" headline number with confidence.
    In the worst tier, this is compounded by the fact that model×item interaction
    (not measurable in single-model exp-001b) will further erode whatever item_id
    estimate survives. Bootstrap CIs on item_id will be wide (±6-8pp per sample),
    and the cross-sample range exceeds the within-sample CI, indicating genuine instability
    rather than sampling noise alone.

    '
  tables:
  - name: 'Table 3: Variance Decomposition Stability Across Item Samples'
    description: 'Rows: variance sources. Columns: Sample A (seed0), Sample B (seed7),
      Sample C (seed99), Range. Item_id ranges 48.7-61.2%. Residual ranges 15.5-22.1%.
      Prompt×item ranges 4.8-7.2%. Instability is systematic, not random.

      '
  figures_description:
  - Three-panel stacked bar chart showing variance decomposition for each item sample.
    Visible structural differences despite identical design and model.
  - 'Scatter plot: item difficulty SD vs item_id percentage across samples, showing
    positive correlation (mechanical Bernoulli link).'
  analysis: 'Item dominance magnitude is sample-dependent, with a 12.5pp range across
    three draws. This is a serious threat to the headline claim. The Bernoulli variance
    mechanism (MD1) explains ~60% of the cross-sample variation. Combined with the
    model×item interaction finding from exp-004, the "item dominance" narrative becomes
    untenable as a clean headline. The paper must reframe: item_id is large but its
    magnitude is unstable and partly mechanical; the more interesting finding is what
    happens when model is added as a facet.

    '
- name: exp-002 Multi-Benchmark Replication
  plan_id: exp-002
  description: '3 models (Gemma excluded) × 2 precisions (BF16/FP16) × 6 prompts ×
    6 seeds × 2 temperatures × 4 orderings × 200 items each on GSM8K, ARC-Challenge,
    HellaSwag. Reduced crossing (2×2 vs 3×3). Tests cross-benchmark gradient hypothesis.

    '

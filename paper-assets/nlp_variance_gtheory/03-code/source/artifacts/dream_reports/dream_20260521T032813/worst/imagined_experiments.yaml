    irt_recommended_items_mmlu: 110
    gtheory_recommended_items_mmlu: 1400
    ratio_gtheory_to_irt: 12.7
    min_detectable_interaction_pct: 1.2
    power_for_2pct_interaction: 0.89
    fixed_vs_random_max_diff_pp: 7.2
    temperature_fixed_changes_item_id_by_pp: 4.1
    bernoulli_variance_correlation_with_item_id: 0.83
    mechanical_share_of_item_id: 0.61
    bootstrap_jackknife_ci_ratio: 1.34
    jackknife_ci_width_item_id_pp: 11.4
    mmlu_3x3_vs_2x2_item_id_diff_pp: 4.7
    mmlu_3x3_vs_2x2_changes_rank_order: false
    g_coeff_binary_mmlu_14k_items_projected: 0.891
    g_coeff_binary_mmlu_14k_items_ci:
    - 0.847
    - 0.934
    compute_cost_recommended_budget_mmlu_usd: 4200
    compute_cost_recommended_budget_gsm8k_usd: 11500
  result_rationale: 'The model-as-facet reanalysis is the earthquake. When model is
    added as a crossed facet to the MMLU G-study, item_id drops from ~55.8% (single-model)
    to 22.4%, while model×item interaction emerges at 31.2% — the LARGEST single variance
    source. This happens because different models find different items difficult:
    an item that Llama gets right 95% of the time, Mistral may get right only 40%
    of the time. This differential item functioning (DIF) was hidden in single-model
    analyses where it was confounded with the residual. The 33.6pp drop in item_id
    is dramatic and changes the entire paper narrative.

    Bootstrap CIs are wide (15.3pp for item_id, 14.9pp for model×item) and the two
    CIs overlap, meaning we cannot even definitively say which is larger. This is
    driven by item-level resampling with only 200 items — each bootstrap resample
    has ~127 unique items (Euler''s formula), and the item×model interaction is sensitive
    to which items are included. The width exceeds 12pp on all benchmarks, making
    confident rank-ordering of variance sources impossible on most benchmarks.

    D-study projections are dire: achieving G≥0.90 under binary scoring requires 1400
    items on MMLU, 2000 on GSM8K (practically unreachable — GSM8K only has 1319 test
    items), and 980-1200 on ARC/HellaSwag. These budgets are 3-10× larger than MVP
    estimates because model×item interaction adds a variance source that cannot be
    reduced by prompt/seed averaging — only item expansion helps. The cross-benchmark
    range (45-2000 items) is so large that no single recommendation is actionable.

    The G-theory vs IRT comparison reveals a 12.7× discrepancy (tinyBenchmarks: 110
    items; G-theory: 1400 items). This is because IRT ignores prompt/seed/temperature/
    ordering facets entirely — it assumes a single fixed evaluation protocol. The
    G-theory budget accounts for reproducibility across ALL facets, making it much
    larger. This is actually a strong finding: IRT-based subsampling produces reliable
    rankings only within a fixed protocol, not across protocols.

    Fixed vs random sensitivity analysis (MD2) shows a 7.2pp maximum change when temperature
    is treated as fixed vs random. Temperature has only 2-3 design points, making
    the random assumption dubious. But the fixed treatment changes item_id by 4.1pp,
    which is large enough to affect conclusions. This is a genuine methodological
    vulnerability with no clean resolution.

    The Bernoulli correlation analysis (MD1) confirms that 61% of item_id''s magnitude
    is mechanically driven by item difficulty spread through p(1-p). This is damning:
    more than half of the "headline finding" (item dominance) is a statistical artifact
    of using binary scoring on items with heterogeneous difficulty. The text_match
    metric does not suffer from this, but text_match has different (and less dramatic)
    variance structure.

    Even projecting to 14K items (full MMLU), binary G reaches only 0.891 [0.847,
    0.934], still below 0.90 with a CI that includes values as low as 0.847. This
    means even full MMLU may not provide reliable binary-scored evaluation when considering
    all facets — a provocative but hard-to-communicate finding.

    '

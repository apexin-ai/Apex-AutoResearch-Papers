    precision_x_prompt_hellaswag_binary_pct: 3.8
    residual_pct_hellaswag: 0.203
    g_coeff_binary_hellaswag_200item: 0.274
    cross_benchmark_gradient_pp: 5.1
    item_id_ordering_by_benchmark: ARC(47.2%) > HellaSwag(38.7%) > MMLU(~55%) > GSM8K(14.3%)
    gradient_correlation_with_task_type: -0.12
    direct_infra_x_method_binary_gsm8k: 3.2
    direct_infra_x_method_binary_hellaswag: 3.8
    direct_infra_x_method_binary_arc: 0.4
    direct_infra_x_method_text_match_gsm8k: 7.4
    direct_infra_x_method_text_match_hellaswag: 5.9
    benchmarks_separability_fails_binary: 2
  result_rationale: 'The cross-benchmark gradient hypothesis collapses. The item_id
    ordering is MMLU(55%) > ARC(47%) > HellaSwag(39%) > GSM8K(14%), which does not
    follow any coherent task taxonomy. ARC (science reasoning) has higher item_id
    than HellaSwag (commonsense), despite commonsense items being more "knowledge-like."
    GSM8K''s low item_id (14.3%) is expected — math reasoning items have high seed×item
    and temperature×item interactions because chain-of-thought generation introduces
    stochastic branching at each reasoning step. But HellaSwag''s intermediate position
    and ARC''s high position are not predicted by any task-type theory. The correlation
    between task-type ranking and item_id ranking is near zero (r=-0.12), destroying
    the "knowledge→reasoning gradient" narrative.

    Separability fails on GSM8K (precision×temperature = 3.2% under binary) and HellaSwag
    (precision×prompt = 3.8%). The GSM8K failure is interpretable: at T=0.7, floating-point
    non-associativity in the softmax creates different token selection paths across
    precisions, and for multi-step reasoning, these divergences compound. The HellaSwag
    failure is less interpretable — precision×prompt interaction suggests that certain
    prompt framings expose precision-dependent attention patterns in the commonsense
    completion task. Neither failure was predicted by the MVP data (which showed separability
    under binary scoring on MMLU). This means the Claim 2 separability result is benchmark-conditional
    in a way that undermines confident generalization.

    The residual components are large everywhere (19.6-24.7%), foreshadowing the model×item
    interaction that will emerge when model is treated as a facet in exp-004.

    '
  tables:
  - name: 'Table 4: Variance Decomposition Across Benchmarks (Single-Model Pooled,
      Binary Scoring)'
    description: 'Rows: 10 variance sources. Columns: MMLU, GSM8K, ARC-Challenge,
      HellaSwag. No systematic gradient visible. Item_id ranges from 14.3% (GSM8K)
      to 55%+ (MMLU). Residual uniformly large (19-25%). Interaction terms vary idiosyncratically.

      '
  - name: 'Table 5: Infrastructure × Methodology Interactions (Binary + Text Match)'
    description: 'All 2-way infra×method interactions per benchmark under both scoring
      metrics. Binary: GSM8K 3.2%, HellaSwag 3.8%, ARC 0.4%, MMLU 0.3%. Text match:
      GSM8K 7.4%, HellaSwag 5.9%. Separability fails on 2/4 benchmarks under binary.

      '
  - name: 'Table 6: G-coefficients by Benchmark and Metric'
    description: 'Binary G: MMLU 0.36, ARC 0.31, HellaSwag 0.27, GSM8K 0.20. Text
      match G: MMLU 0.97, GSM8K 0.88, ARC 0.91, HellaSwag 0.93. Binary G is poor everywhere;
      text match is acceptable but variable.

      '
  figures_description:
  - Stacked-bar variance decomposition across 4 benchmarks. The signature figure —
    visually demonstrates NO gradient. Each benchmark has a unique 'fingerprint' of
    variance sources.
  - Radar chart of top-5 variance sources per benchmark, showing non-overlapping patterns.
    MMLU is item-dominated, GSM8K is interaction-dominated, ARC is item+prompt, HellaSwag
    is prompt+residual.
  - 'Separability violation heatmap: benchmarks × interaction terms, with cells colored
    by magnitude. Clear that separability is benchmark-conditional.'
  analysis: 'The gradient narrative is dead. Variance structure is idiosyncratic per
    benchmark and not predictable from task type alone. This is actually a finding
    — "variance structure is benchmark-specific" — but it is a negative finding relative
    to the original framing. Separability fails on 2 benchmarks under binary scoring,
    undermining the confirmatory null that was supposed to validate isolated-factor
    studies. The paper must pivot: instead of "here''s a gradient that explains everything,"
    the message becomes "nothing is simple, everything interacts, and you cannot generalize
    reproducibility findings across benchmarks."

    '

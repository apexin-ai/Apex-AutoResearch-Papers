      (Y/N), conclusion. Two of five analyses show >5pp sensitivity. Overall: results
      are moderately robust but not insensitive to analytic choices.

      '
  figures_description:
  - 'Figure 3 (SIGNATURE): Stacked-bar variance decomposition, single-model vs model-as-facet,
    side by side for MMLU. Dramatic visual: item_id shrinks, model×item emerges as
    largest block. The ''before and after'' is the paper''s most striking visual.'
  - 'Figure 4: Stacked-bar variance decomposition across all 4 benchmarks (model-as-facet).
    Each bar has a unique ''fingerprint.'' No gradient visible.'
  - 'Figure 5: D-study projection curves — G vs item count for 4 benchmarks. Curves
    diverge wildly. GSM8K never reaches G=0.90 within available items. MMLU reaches
    0.90 at ~1400 items.'
  - 'Figure 6: Bootstrap CI forest plot for top-5 variance sources on MMLU. Wide,
    overlapping CIs for item_id and model×item. Tight CIs for precision main effect.'
  - 'Figure 7: Bernoulli p(1-p) vs observed item variance scatter plot. r=0.83 correlation.
    Regression line shows 61% of item_id is mechanical.'
  analysis: 'exp-004 reveals that the entire single-model analysis framework was misleading.
    Model×item interaction (31.2%) — not item difficulty — is the dominant variance
    source when models are properly crossed. This is the worst-tier''s central finding
    and it is genuinely novel and surprising. However, the wide bootstrap CIs, the
    Bernoulli mechanical artifact, and the benchmark-idiosyncratic patterns make the
    paper very hard to write cleanly. Every claim requires heavy qualification. The
    D-study budgets are impractically large and benchmark-specific, providing no actionable
    "recipe." The G-theory vs IRT comparison is the strongest standalone contribution
    but is a methods comparison, not an empirical finding. The narrative must shift
    to: "evaluation is harder than you think, and here''s exactly why."

    '
- name: exp-005 14B Model Extension
  plan_id: exp-005
  description: 'Qwen3-14B and DeepSeek-R1-Distill-14B at BF16/FP16. Tests scale effects.
    Depends on exp-003 (hardware). In worst tier, hardware issues cascade.

    '
  expected_results:
    hardware_obtained: false
    experiment_status: blocked — requires ≥48GB VRAM datacenter GPU not available
    alt_single_gpu_status: attempted on westd-32570 (96GB) with reduced design
    alt_total_records: 28800
    alt_qwen14b_accuracy: 0.738
    alt_deepseek_r1_distill_accuracy: 0.712
    alt_item_id_pct_qwen14b: 0.501
    alt_item_id_pct_deepseek_r1: 0.423
    alt_cross_scale_item_correlation: 0.64
    alt_model_x_item_estimated: not estimable with 2-model design
  result_rationale: 'exp-005 is either blocked entirely (no datacenter GPU) or runs
    on the single available GPU with a severely reduced design. Even if it runs, 2
    models is insufficient to estimate model×item interaction as a random effect —
    you need ≥3 for meaningful variance component estimation. The cross-scale item
    difficulty correlation (r=0.64 between 8B and 14B models) is lower than within-scale
    correlation (r=0.71-0.78 among 8B models), suggesting that scale increases model×item
    interaction further. This is consistent with the worst-tier narrative (larger
    models have more distinct item-level competence profiles) but the evidence is
    too thin to make claims. The experiment contributes almost nothing to the paper
    in the worst tier.

    '
  tables:
  - name: 'Table A1 (Appendix): 14B Model Accuracy Summary'
    description: 'Minimal 2×2 table (2 models × 2 precisions). Qwen3-14B: 73.8%, DeepSeek-R1-Distill:
      71.2%. Noted as "reduced design, insufficient for G-theory analysis."

      '

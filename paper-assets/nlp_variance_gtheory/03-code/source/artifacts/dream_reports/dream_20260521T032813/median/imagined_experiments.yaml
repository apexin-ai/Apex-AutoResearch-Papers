    gpu_hours_used: 178
  result_rationale: 'GSM8K item_id (34.5%, 单模型) 大幅低于 MMLU (52.9%)，因为数学推理中 seed 和 temperature
    通过改变 chain-of-thought 路径产生强 item-conditional 效应。同一数学题 在不同 seed 下走不同推理链——有的走通有的走不通——seed×item
    (11.5%) 和 temp×item (10.8%) 合计 >22%，远超 MMLU 的 ~9.5%。ARC (43.8%) 居中因为科学推理也有 prompt/
    seed sensitivity 但弱于数学。HellaSwag (51.2%) 接近 MMLU (52.9%) 是 median 档的 关键特征——commonsense
    补全任务的方差结构更接近 knowledge retrieval 而非 multi-step reasoning，因为 HellaSwag 主要考验的是 pattern
    completion 而非推理链。这打破了预期 的单调 knowledge→reasoning 梯度。precision 交互在 bf16/fp16-only
    设计下全部 <0.3% (binary)——这不构成对 separability 的有力测试，因为 bf16≈fp16 是已知的。真正的 separability
    测试需要 fp32 或 hardware crossing，只在 exp-001/003 (MMLU) 中完成。 G-coefficient 梯度 (0.22→0.35
    binary) 说明 200-item binary 可靠性系统性随任务类型 变化，但 text_match 下 HellaSwag 已达 0.95，强化
    metric-conditional 叙事。

    '

    jointly dominate — their relative importance is benchmark-conditional」。 GSM8K
    上的 CI 重叠和 model×item 反超是 median 档最大的叙事压力点——需要诚实报告但 框定为「finding: even the variance
    structure itself varies across task types」。 D-study 的 benchmark-specificity (480-780
    items) 支持 Claim 3 但 differentiation 不戏剧性——4 benchmarks 都在 ~500-800 range，不是 100
    vs 2000 那样的鲜明对比。 G-theory vs IRT 的 6.2× gap 是可以独立展开的贡献——「the cost of multi-facet
    reliability」。power=0.88 for 2% interaction 意味着如果真实 infra×method 在 2% 以上我们大概率能检测到，但
    <1% 的效应 (power=0.62) 可能被遗漏——论文需承认这一限制。

    '

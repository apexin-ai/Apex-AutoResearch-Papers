  result_rationale: 'hardware 主效应极小 (0.14pp) 因为相同 vLLM 代码路径在不同 GPU 上产生几乎相同的结果； 差异来自
    CUDA kernel 层面的浮点非确定性和 GPU 架构特定的 tensor core 实现差异。 hardware×item (1.8%) 比 hardware
    主效应大一个数量级，因为 logit margin 极小的 items (模型在 0/1 边界附近的题) 对硬件级数值噪声敏感。但 1.8% 仍远小于 precision×item
    (MMLU exp-001 ~7%)，说明 GPU 型号的影响远弱于精度选择。direct infra×method 在 binary 下 0.5% (边缘通过
    <1% 阈值)，text_match 下 2.8%——后者由 precision×temperature (1.5%) + hardware×temperature
    (0.8%) + hardware×precision (0.5%) 累积而成。median 档的 关键限制是 second GPU 仅支持 2 模型，估计精度有限，结论需标注为

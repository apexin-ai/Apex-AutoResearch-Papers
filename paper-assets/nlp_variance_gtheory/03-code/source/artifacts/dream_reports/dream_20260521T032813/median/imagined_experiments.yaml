- name: Item resampling stability test
  plan_id: exp-001b
  description: '3 independent stratified 200-item MMLU samples (seeds 0, 7, 99) ×
    Llama × 3 prec × 3 prompts × 3 seeds × 2 orderings = 54 conditions/sample × 200
    items。

    '
  expected_results:
    total_records_per_sample: 10800
    total_records: 32400
    item_id_pct_sample0: 55.2
    item_id_pct_sample7: 50.8
    item_id_pct_sample99: 58.6
    item_id_mean: 54.9
    item_id_sd: 3.9
    item_id_cv: 0.071
    g_coeff_binary_sample0: 0.34
    g_coeff_binary_sample7: 0.3
    g_coeff_binary_sample99: 0.36
    g_coeff_mean: 0.333
    g_coeff_sd: 0.03
    accuracy_range: '[0.669, 0.691]'
    residual_pct_range: '[14.2, 18.6]'
    item_id_always_largest: true
    gpu_hours_used: 12
  result_rationale: 'item_id 从 50.8% 到 58.6% (SD=3.9pp) 反映了 stratified sampling 未完全消除的
    item 难度分布变异。sample7 (50.8%) 恰好抽到了更均匀的 item 难度分布——容易题和 难题的比例更平衡——导致 Bernoulli p(1-p)
    变异较小，item_id 机械性降低。这个 ~8pp 极差在 median 档下是 「noisy but directionally consistent」——item_id
    始终最大， 但精确百分比对 item draw 敏感。G-coefficient 的 0.30-0.36 范围传递了一致信号： 200 items (binary)
    总是不够。CV=7.1% 说明 headline number 必须报告为区间。

    '

tier: median
narrative_guidance: 'Item dominance weakens under model-as-facet reanalysis (单模型~54%
  → 多模型35%) 但仍是最大单一 方差源；与 model×item 的差距仅 ~13pp，在 GSM8K 上 CI 重叠甚至反转。跨 benchmark 梯度方向性
  存在（MMLU 35% → GSM8K 20%）但非单调——HellaSwag ≈ MMLU 打破预期 knowledge→reasoning 排序。 可分离性在知识型任务上成立（<1%
  binary）但 text_match 下已显现裂痕（2.8%）；推理型 benchmark 因设计限制（仅 bf16/fp16）未被直接测试，需标注为 projected
  failure。D-study 预算跨 benchmark 有差异（480-780 items for G≥0.90）但不如预期戏剧性。Gemma 排除（3 模型）。Claim
  1 弱化为 「item 和 model×item 联合主导」；Claim 2 限定为「benchmark-conditional separability —
  知识 任务上成立，推理任务上预计失败」；Claim 3 加重 benchmark-specificity 措辞。AAAI 可行但紧； ACL ARR 是现实备选。

  '

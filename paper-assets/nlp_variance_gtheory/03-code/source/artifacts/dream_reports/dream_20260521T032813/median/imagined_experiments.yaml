  - 'Fig 3 (论文 signature figure): Model-as-facet stacked-bar across 4 benchmarks (binary)。item_id
    蓝色递减 35→20%, model×item 橙色在 GSM8K 反超。'
  - 'Fig 4: D-study projection curves — G vs item count for 4 benchmarks, binary。GSM8K
    曲线最右 (最多 items needed)。IRT tinyBenchmarks 100-item 参考线。'
  - 'Fig 5: Bootstrap CI forest plot, item_id vs model×item, 4 benchmarks。GSM8K CI
    重叠可视化。'
  - 'Fig 6: Bernoulli p(1-p) vs observed item variance scatter (MMLU), r=0.72。'

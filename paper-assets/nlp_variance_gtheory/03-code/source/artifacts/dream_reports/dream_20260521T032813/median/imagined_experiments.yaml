  plan_id: exp-003
  description: '3 models × 2 GPU types (RTX PRO 6000 + second GPU) × 2 prec (bf16/fp16)
    × 6 prompts × 6 seeds × 3 temps × 4 orderings × 200 MMLU items。 Second GPU 可用性有限——仅
    2 models 在 second GPU 上完成全部设计。

    '

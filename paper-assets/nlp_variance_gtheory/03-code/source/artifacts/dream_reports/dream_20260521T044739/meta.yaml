    result_rationale: 'model×item从2模型26.2%略降至4模型24.1%：增加Mistral和Qwen3扩大了模型多样性 （Llama/Mistral=相似decoder架构，Gemma=独特norm结构，Qwen3=GQA+SwiGLU变体），
      但4模型的averaging效应会平滑个别模型对之间的极端分歧——2模型时Llama-Gemma的 item difficulty rank disagreement被完全捕获，4模型时某些model-pair间的agreement
      部分抵消了其他pair的disagreement，导致总model×item略低。但24.1%仍远高于任何 其他非item来源，确认model×item是系统性的而非2-model
      noise。

      单模型item_id维持55-65%因为200-item MMLU的分层抽样覆盖STEM/humanities/social/other， 学科间难度跨度大(STEM>60%错误率
      vs social<30%)，这种异质性在任何单模型下都表现为 高item方差。Qwen3最高(62.3%)因为其accuracy最高(74.8%)，high-accuracy模型的item
      responses更趋向两极化(更多items被稳定地答对或答错)，增大了item间方差。

      跨模型G=0.065：4模型引入更多model×item来源，G从0.073(2模型)降至0.065。 D-study投影10模型G=0.179证明model×item不可通过增加模型数量来消除——
      这是模型架构和训练数据差异导致的item difficulty系统性重排，不是采样噪声。

      infra×method<0.1%(binary)：V0 enforce_eager消除了引擎混淆，二值评分下 精度差异主要影响绝对水平，不产生precision×prompt或precision×seed的交互。


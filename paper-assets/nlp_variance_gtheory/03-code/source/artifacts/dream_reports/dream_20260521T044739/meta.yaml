    # Dream Review Report — Reproducibility Budgets for LLM Evaluation


    **Paper**: "Reproducibility Budgets for LLM Evaluation: A Generalizability Theory
    Analysis of Variance Sources Across Benchmarks and Models"

    **Scoring scale**: ACL ARR 1–5 (5 = top 2–5%, 4 = top 10–20%, 3 = borderline,
    2 = below average, 1 = seriously flawed)

    **Review mode**: Full (2 Reviewers → roundtable)


    ---


    ## Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3 |

    | Substance | 3 |

    | Novelty | 3 |

    | Significance | 3 |

    | Clarity | 3.5 |

    | **Overall** | **3** |

    | Confidence | 4/5 |


    **Assessment**: Borderline. The paper has genuine merits — particularly the IRT
    vs G-theory comparison — but significant weaknesses in infrastructure coverage,
    model-facet sample size, and incomplete experiments prevent a clear accept.


    ---


    ## Summary


    The paper applies Generalizability Theory (G-theory) to decompose LLM evaluation
    variance across infrastructure (numerical precision) and methodology (prompt,
    seed, temperature, ordering) facets. It studies 4 open-weight models (~7–9B) on
    4 benchmarks (MMLU, HellaSwag, ARC-Challenge, GSM8K) totaling 2.2M+ records. Four
    contributions are claimed: (1) G-theory requires 3.6–7.0× more items than IRT
    for reliable measurement, (2) model×item interaction accounts for ~16.4% of variance,
    (3) variance structure is benchmark-conditional, and (4) an open-source D-study
    calculator.


    ---


    ## Strengths


    ### S1. IRT vs G-theory comparison is novel and actionable (Contribution 1)

    No prior work directly compares IRT item requirements with G-theory requirements
    for LLM evaluation. The 3.6–7.0× gap (Table 11) is striking, well-attributed causally
    to prompt×item (4.8%), seed×item (4.6%), and ordering×item (1.3%) — dimensions
    IRT ignores by design. At IRT''s recommended 116 items for MMLU, G-theory yields
    only G = 0.489 — substantially below the 0.80 threshold. This finding is robust:
    it doesn''t depend on model count, hardware, or any of the paper''s incomplete
    experiments. The ratio increasing for reasoning benchmarks (GSM8K: 6.2×, ARC:
    7.0×) adds cross-benchmark validation. This is the paper''s strongest contribution
    and could meaningfully influence benchmark design practices.


    ### S2. Thorough methodological defenses

    Table 12 presents 6 defense analyses that preemptively address likely reviewer
    concerns: (MD1) Bernoulli correlation r=0.38, r²=0.14 — partial but not dominant
    mechanical link; (MD2) fixed vs random facet classification shifts variance by
    at most 3.2% — robust; (MD5) full MMLU 14K projection yields G=0.942 — subsampling
    is the cost, not an MMLU flaw; (MD6) bootstrap vs jackknife CI width ratio 0.94–1.08
    — negligible independence violation; (MD8) 3×3 vs 2×2 design reduction changes
    components by at most 2.1%; (MD9) logprob scoring yields consistent direction
    (item_id=52.4%, G=0.528). This level of robustness checking exceeds the typical
    standard.


    ### S3. Transparent reporting of incomplete experiments

    Sections 4.5 and 4.7 explicitly state what was not completed (14B extension, multi-hardware,
    LayerCast, MATH benchmark) and why. The Limitations section (Section 6) addresses
    6 distinct limitations with specific quantitative context. This honesty is commendable
    and unusual.


    ### S4. Multi-benchmark G-theory extension

    Extending from Mesting (2026)''s single-benchmark G-theory to 4 benchmarks is
    a meaningful step. The cross-benchmark variance decomposition (Table 7) reveals
    that item_id ranges from 59.7% (MMLU) to 41.8% (ARC-Challenge), with a 17.9pp
    spread. The D-study budget table (Table 9) showing 414–682 items for G≥0.80 across
    benchmarks directly demonstrates that no universal item budget suffices — a practically
    valuable finding.


    ### S5. Model-as-crossed-facet design

    Treating model as a random facet to estimate model×item interaction is a novel
    design choice within the G-theory-for-LLM literature. The finding that item difficulty
    rankings are partially model-specific (16.4% interaction) and that cross-model
    G collapses from 0.598 to 0.152 has implications for leaderboard validity.


    ### S6. Item resampling stability analysis

    Exp-001b proactively tests whether item_id dominance is an artifact of a particular
    200-item draw. Three independent stratified samples yield item_id ranging from
    49.3% to 61.1% (CV=0.13), confirming directional robustness while honestly quantifying
    estimation variability. The recommendation to report ranges rather than point
    estimates (55–65%) is appropriate.


    ---


    ## Weaknesses


    ### W1. Four models as a random facet — fundamental statistical limitation [Major]

    With only 4 levels for the model facet, the degrees of freedom for estimating
    model and model×item variance components are extremely limited. The bootstrap
    95% CI for model×item is [11.2%, 21.8%] — a 10.6pp width (Table 10). At the lower
    bound (11.2%), model×item is still notable but approaches the sum of methodology×item
    interactions; at the upper bound (21.8%), it dominates. The paper acknowledges
    this (Section 6, "Model sample size") but the limitation fundamentally constrains
    Contribution 2. A reviewer can reasonably question whether 4 models suffice for
    treating model as a random facet in the G-theory sense — in psychometrics, random
    facets typically have 10+ levels. The bootstrap "compensation" is partial: it
    captures sampling variability but cannot overcome the structural limitation of
    estimating a variance component from 4 levels.


    **Impact on paper**: Contribution 2 is the second-listed contribution but rests
    on the weakest statistical foundation. The 16.4% point estimate should be treated
    with more caution in the abstract and conclusion.


    ### W2. Infrastructure claim substantially overclaimed [Major]

    The paper''s framing — crossing "infrastructure (numerical precision) and methodology"
    — implies a meaningful infrastructure component. In reality, all experiments use
    a single GPU architecture (NVIDIA RTX PRO 6000), and "infrastructure" reduces
    to numerical precision settings within that one platform. Exp-003 (multi-hardware)
    was not completed. Furthermore, the FP32 results (Table 3: 5–11pp accuracy degradation
    vs BF16) are attributable to vLLM''s enforce_eager mode changing the computation
    path, not to numerical precision per se. This means precision×item (3.2%) may
    measure "computation engine artifact × item" rather than "numerical precision
    × item."


    The abstract states "infrastructure (numerical precision) and methodology" as
    if these are comparable pillars. The honest framing would be: "primarily methodology-focused
    G-theory with a precision side-analysis on a single GPU." The separability claim
    (infra×method < 0.1%) is limited to precision-on-RTX-PRO-6000, not generalizable
    infrastructure.


    **Recommendation**: Substantially tone down infrastructure framing throughout,
    especially in abstract, introduction, and Contribution 2 context. Rename or qualify
    "infrastructure facet."


    ### W3. FP32 anomaly is a confound, not just an oddity [Major]

    Table 3 shows FP32 consistently performing 5–11pp worse than BF16 across all models.
    The paper explains this as enforce_eager causing FP32 to use a different computation
    path. But this explanation has consequences the paper doesn''t fully address:

    - If FP32''s poor performance is an implementation artifact, then the "precision"
    facet conflates numerical format with computation engine — these are different
    constructs

    - The precision main effect (1.5%, Table 2) and precision×item (3.2%) may be inflated
    by this confound

    - Practitioners who don''t use enforce_eager may see different precision variance
    — the results may not transfer


    The paper should either: (a) remove FP32 and analyze BF16/FP16 only, showing that
    precision variance is near-zero within optimized paths, or (b) explicitly discuss
    the confound and reframe the facet as "computation configuration" rather than
    "numerical precision."


    ### W4. Fine-tuning G-study is too underpowered to contribute [Moderate]

    The fine-tuning analysis (Section 4.6) uses encoder-only RoBERTa on 2 classification
    tasks (SST-2, MNLI), 1 GPU, 288 runs (16.7% of planned). The inference vs fine-tuning
    comparison (Table 14) is compelling conceptually — seed replaces item_id as the
    dominant source — but the evidence base is too thin and confounded:

    - Comparing decoder LLMs (7–9B, knowledge/reasoning tasks) with encoder RoBERTa
    (~125M, classification tasks) confounds paradigm with architecture, scale, and
    task type

    - Only 1 GPU → GPU×seed interaction untested

    - 2/4 tasks → no task-gradient analysis possible

    - Caveats are stated (Section 4.6) but the comparison is still prominently featured
    in the abstract and conclusion


    **Recommendation**: Downgrade from abstract/conclusion prominence to a Discussion-section
    observation. Frame as "preliminary evidence" rather than a contribution.


    ### W5. No figures in the paper [Moderate]

    The paper is entirely table-driven (14 tables in main + appendix, 0 figures).
    For a paper about variance decomposition, this is a significant presentation gap:

    - Stacked bar charts are the standard visual idiom for variance decomposition
    (used by Mesting 2026, BrittleBench/Mizrahi 2024)

    - D-study projection curves (G vs item count) would make Table 4 much more intuitive

    - The ARC anomaly in the benchmark gradient would be immediately visible in a
    scatter plot

    - The inference vs fine-tuning contrast (Table 14) would benefit from paired stacked
    bars


    Adding 3–4 figures would substantially improve accessibility without increasing
    page count significantly.


    ### W6. Benchmark gradient is weak evidence [Moderate]

    Contribution 3 ("benchmark-conditional variance structure") is hedged as "suggestive
    evidence" — appropriately so. The expected monotonic gradient (knowledge → commonsense
    → science → math reasoning) is approximately but not strictly observed: ARC-Challenge
    (science, 41.8%) falls below GSM8K (math, 43.5%), breaking monotonicity. Rank
    correlation with expected order is 0.8 (from context). With only 4 benchmarks,
    one anomaly is enough to prevent strong claims. The ARC anomaly is attributed
    to high prompt×item (10.5% vs 4.8–8.9% for others), but this post-hoc explanation
    is not independently verified.


    ### W7. Incremental novelty over Mesting (2026) [Moderate]

    The core methodological contribution — G-theory applied to LLM evaluation — belongs
    to Mesting (2026). This paper''s extensions are:

    - Infrastructure facet → severely limited (W2)

    - Multi-benchmark → solid but straightforward extension

    - Model as crossed facet → novel but statistically weak (W1)

    - IRT comparison → strongest novel element


    The paper is best understood as a multi-benchmark replication and extension of
    Mesting with added IRT comparison, rather than a fundamentally new framework.
    The framing should acknowledge this more directly.


    ### W8. Missing related work discussion [Minor]

    - Biderman et al. (2024) appears in references but is not discussed in the Related
    Work section

    - Kunievsky et al. (2025) intent/articulation/model uncertainty decomposition
    is not cited — relevant as an alternative decomposition framework

    - ThinkingMachines/Gruver et al. (2025) batch-size nondeterminism (80/1000 unique
    at T=0) deserves more than a passing mention — it''s a key infrastructure variance
    source this paper doesn''t address

    - The distinction between this paper''s design (judge fixed) and Mesting''s (judge
    as facet) deserves more discussion — fixing the judge eliminates the single largest
    variance source (43.8%) from Mesting, fundamentally changing what the decomposition
    reveals


    ---


    ## Questions for Authors


    1. **FP32 confound**: Have you analyzed the variance decomposition with FP32 removed
    (BF16/FP16 only)? How much does precision and precision×item change? This would
    isolate the enforce_eager confound.


    2. **Model facet justification**: In psychometrics, how many levels of a random
    facet are considered minimally adequate? Can you cite precedent for using 4 levels?
    If the standard is 10+, how should we interpret your model×item estimates?


    3. **Cross-benchmark design asymmetry**: The MMLU design (3 precisions × 3 temperatures)
    is richer than other benchmarks (2×2). Have you tested whether this asymmetry
    affects cross-benchmark comparisons? Could the reduced design systematically underestimate
    or overestimate specific variance components?


    4. **ARC anomaly**: You attribute ARC''s high prompt×item (10.5%) to complex option
    descriptions in science questions. Is there independent evidence for this? Have
    you examined which specific ARC items drive the anomaly?


    5. **Fine-tuning comparison**: What would the comparison look like if you used
    a decoder model (e.g., one of your 4 models) fine-tuned on a generative task?
    The current encoder-vs-decoder confound prevents strong claims.


    6. **D-study calculator**: Is this a simple implementation of Equation 2 with
    lookup tables for benchmark-specific variance estimates, or does it involve non-trivial
    computation? What happens when a practitioner''s design doesn''t match your specific
    facet configurations?


    ---


    ## Experimental Coverage Assessment


    Comparing against the planned experiment list:


    | Experiment | Status | Impact of Gap |

    |-----------|--------|---------------|

    | exp-001: 4-Model MMLU G-Study | ✅ Complete | — |

    | exp-001b: Item Resampling | ✅ Complete | — |

    | exp-002: Multi-Benchmark | ✅ Complete | — |

    | exp-003: Multi-Hardware | ❌ 0% | **High** — "infrastructure" reduced to precision-on-one-GPU
    |

    | exp-004: Comprehensive Analysis | ✅ Complete | — |

    | exp-005: 14B Extension | ❌ 0% | **Medium** — scale-dependent conclusions impossible
    |

    | exp-006: Fine-Tuning | ⚠️ 16.7% | **Medium** — too thin for standalone contribution
    |

    | exp-007: LayerCast | ❌ 0% | **Low** — mitigation validation, not core |

    | exp-008: MATH Benchmark | ❌ 0% | **Medium** — would test gradient with 5th benchmark
    |


    3 of 8 experiments fully completed; 1 partially; 4 not done. The completed experiments
    (001, 001b, 002, 004) form a coherent core, but the missing experiments collectively
    weaken 3 of 4 claimed contributions.


    ---


    ## Recommendation Summary


    **What works**: The IRT vs G-theory comparison (Contribution 1) is novel, robust,
    and actionable. The multi-benchmark variance decomposition is solid empirical
    work. The methodological defense battery is commendable. The writing is clear
    and limitations are honestly reported.


    **What doesn''t work**: The infrastructure claim is overclaimed given single-GPU
    scope and FP32 confound. The model-as-facet analysis is statistically underpowered
    with only 4 models. The fine-tuning comparison is too thin and confounded. The
    lack of figures weakens presentation.


    **Path to acceptance**: (1) Substantially reframe as methodology-focused with
    precision as secondary analysis. (2) Add 3–4 figures. (3) Elevate IRT comparison
    as the primary contribution. (4) Downgrade fine-tuning to Discussion-section preliminary
    observation. (5) Address FP32 confound explicitly — either remove FP32 from analysis
    or rename the facet. (6) Add missing related work discussion.


    **Overall**: 3/5 — Borderline. The paper addresses a genuine gap, has one strong
    novel contribution (IRT vs G-theory), and is methodologically careful, but the
    incomplete infrastructure story, 4-model limitation, and absence of figures hold
    it below the acceptance threshold in its current form.'

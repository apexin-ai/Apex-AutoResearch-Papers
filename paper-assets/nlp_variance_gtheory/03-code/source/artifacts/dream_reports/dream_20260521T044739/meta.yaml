    - title: 'Supplementary Table S4: Extended 5-benchmark gradient'
      structure: Rows=MMLU, HellaSwag, ARC-C, GSM8K, MATH; Columns=item_id%, prompt×item%,
        temp×item%, seed×item%, G, D-study items

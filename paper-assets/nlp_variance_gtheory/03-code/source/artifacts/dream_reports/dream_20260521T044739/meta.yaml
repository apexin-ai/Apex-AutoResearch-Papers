      recommended_min_items_knowledge: 480
      recommended_min_items_reasoning: 900
    result_rationale: 'IRT vs G-theory 4.4×差距的机制： IRT(Rasch/2PL)将response建模为θ_person和b_item的函数，所有非item因素
      (prompt, seed, ordering)被折入error term。因此IRT的"reliable measurement" 只要求item difficulty参数估计稳定——116
      items足以稳定估计200个difficulty参数 (Rasch的渐近效率在~100 items时充分)。 G-theory将prompt×item(4.6%),
      seed×item(4.7%), ordering×item等作为系统性方差分离出来， G系数的分母包含这些维度的方差。要在同时考虑prompt/seed/ordering变异的情况下
      仍达到G≥0.80，需要510 items——额外的394 items用于"吸收"IRT忽略的非item噪声。 在IRT推荐的116 items处，G-theory
      G仅0.529——这就是"多facet reliability的代价"。

      GSM8K的ratio(4.65×)高于MMLU(4.40×)因为数学任务的prompt/seed/temperature方差更大， G-theory需要吸收的额外噪声更多，而IRT仍只看item
      discrimination(GSM8K items的 discrimination通常更高——数学题更能区分能力，因此IRT需要的items反而更少)。

      bootstrap CI [21.3, 27.0] on model×item不含0的原因：4模型×200 items的设计 每个model×item
      cell有864个重复(6 prompts × 6 seeds × 3 temps × 4 orderings × 2 prec × 2 GPU)， power分析显示对≥1.2%
      interaction effect的检测power>0.80， 对≥5% effect的power>0.998。24.1%的效应量远超检测阈值。

      fixed vs random sensitivity仅2.8%变化(MD2)：temperature虽只有3个设计点， 但在G-theory中fixed/random的区别仅影响temperature方差是否进入G系数分母。
      temperature main effect<2%，fixed→random只增加分母~2%→item_id%变化2.8%。 这证明即使temperature不满足"从universe随机抽样"的理想假设，结论仍稳健。

      binary data defense(MD1): r(Bernoulli p(1-p), observed)=0.68表明~46%的item variance可归因于Bernoulli机制(difficulty
      p决定p(1-p))，但null simulation (random p_i ~ Uniform, item_id=0.09%)证明仅Bernoulli机制不产生我们观察到的
      61%方差——实际值是null的671倍。另外54%的"超Bernoulli"item variance反映了 items间真实的知识点差异和cognitive
      demand差异。

      G at 14K items=0.943(MD5)：D-study投影f(n_items)是log-concave的， 200→14K items的G提升(0.618→0.943)证明完整MMLU的reliability远高于
      200-item子集。我们的发现是"子抽样的成本"而非"MMLU本身不可靠"。

      '

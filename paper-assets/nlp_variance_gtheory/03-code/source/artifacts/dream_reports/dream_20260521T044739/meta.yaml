      Visual regime change immediately apparent. Arrow annotation: "training-time
      variance sources emerge and compete with item selection."

      '
    analysis: '(1) 432 fine-tuning runs per task: for each (seed, lr, shuffle, gpu,
      precision) combination, train RoBERTa-large for 3 epochs, evaluate on test set,
      collect item-level binary predictions； (2) G-study with facets: seed, lr, data_shuffle,

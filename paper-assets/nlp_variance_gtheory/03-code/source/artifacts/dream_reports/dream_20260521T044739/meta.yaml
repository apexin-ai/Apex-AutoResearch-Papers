    result_rationale: 跨benchmark梯度反映了不同任务类型的item难度变异结构差异。 MMLU（知识检索）item_id最高（59.7%）：因为factual
      knowledge items的难度 在条件变化下高度稳定——一个化学知识要么知道要么不知道，prompt措辞影响有限。 HellaSwag（常识NLI）item_id次高（54.2%）：commonsense
      completion的难度相对稳定， 但prompt format对NLI-style items有一定影响。 GSM8K（数学推理）item_id=43.5%：chain-of-thought推理引入更多随机性——
      同一道数学题在不同temperature/prompt下可能走不同推理路径， 增加了temperature×item和prompt×item的方差份额。
      ARC-Challenge（科学推理）item_id异常偏低（41.8%）：这是anomaly。 原因可能是ARC的科学题目对prompt措辞特别敏感（prompt×item=10.5%，远高于其他benchmark的4-6%），
      因为scientific reasoning items的选项描述更复杂，措辞变化直接改变推理路径。 ARC的prompt sensitivity"吸收"了本应归属item_id的方差，导致item_id被压低。
      分离性随task complexity增加而降低（MMLU=0.08% → GSM8K=0.65%）， 但所有benchmark的binary infra×method交互均<1%，confirming
      separability在binary scoring下成立。

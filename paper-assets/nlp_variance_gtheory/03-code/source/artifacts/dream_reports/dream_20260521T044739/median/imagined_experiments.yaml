- name: Item Resampling Stability Test
  plan_id: exp-001b
  description: 3个独立的200-item stratified样本（seed 0/7/99）× Llama × 3 precisions × 3 prompts
    × 3 seeds × 2 orderings。 测试item_id主导性是否为特定item样本的artifact。
  expected_results:
    total_records_per_sample: 10800
    conditions_per_sample: 54
    sample_0_item_id_pct: 61.1
    sample_7_item_id_pct: 49.3
    sample_99_item_id_pct: 57.8
    item_id_mean: 56.1
    item_id_std: 6.1
    item_id_cv: 0.13
    sample_0_G: 0.614
    sample_7_G: 0.498
    sample_99_G: 0.581
    G_mean: 0.564
    G_cv: 0.11
    prompt_x_item_cv: 0.22
    seed_x_item_cv: 0.19
    precision_x_item_cv: 0.25
    item_overlap_across_samples:
      top_50_hardest_jaccard: 0.38
      top_50_easiest_jaccard: 0.45
  result_rationale: MMLU包含约14K items，200-item stratified样本只覆盖~1.4%的item universe。
    不同样本抽到不同的难度分布、学科覆盖和区分度组合，导致item_id估计存在中等变异。 sample_7（seed=7）的item_id最低（49.3%），因为该样本偶然包含了更多中等难度items
    （p(correct)接近0.5区间的items更集中），使得Bernoulli方差p(1-p)在items间更均匀， 减少了item间的方差比例。sample_0保留了原始分析的61.1%因为使用了相同的stratification
    seed。 CV=0.13意味着如果换一组items，item_id可能在~49-63%之间波动—— headline claim需要以区间（"55-65%"）而非单点给出。
    top-50 hardest items的Jaccard仅0.38，说明哪些items"最难"本身就是样本依赖的， 进一步证实item-level结论需要resampling验证。

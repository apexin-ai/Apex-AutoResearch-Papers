- name: LayerCast Precision Mitigation
  plan_id: exp-007
  description: 未完成——P2优先级，依赖exp-001。compute budget优先分配给P0/P1实验。
  expected_results:
    projected_if_completed:
      layercast_precision_x_item_reduction: estimated 40-60% reduction vs pure fp16
      layercast_G_improvement: estimated +0.02-0.05 over fp16 baseline
      layercast_latency_overhead: ~15-25% slower than pure fp16
      note: projections based on LayerCast design (fp16 storage + fp32 compute)
  result_rationale: LayerCast通过在存储层使用fp16但计算层使用fp32来减少precision artifacts。 预计能减少precision×item交互40-60%，因为most
    numerical errors发生在compute layer （矩阵乘法的cumulative rounding），而LayerCast在此处使用fp32。
    但不能完全消除precision效应因为fp16 storage仍有representation precision loss。 作为mitigation
    strategy的价值在于提供"actionable recommendation"—— 但缺失实验意味着这个recommendation只能作为speculation出现在Discussion中。
  tables: []
  figures_description: []
  analysis: exp-007缺失对论文影响小——LayerCast是P2优先级的mitigation validation， 不影响核心claims。可在Future
    Work中提到："LayerCast and mixed-precision strategies may reduce precision×item interaction;
    validation is ongoing."

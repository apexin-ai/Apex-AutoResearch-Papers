  result_rationale: 2-model分析（Llama vs Gemma）捕获了一个特别极端的model×item交互（26.2%）， 因为这两个模型在训练数据组成和架构上差异最大（Llama=Meta训练、Gemma=Google训练）。
    加入Mistral（与Llama架构类似的decoder-only）和Qwen（与Gemma竞争力相当的中文-英文模型）后， 4模型的model×item交互被"稀释"——Mistral与Llama在item难度排序上部分冗余，
    Qwen与Gemma也有重叠，使得极端的成对item-level不一致被平均化。 model×item从26.2%衰减到16.4%反映了：(a) 2-model是upper
    bound而非point estimate， (b) 4 models覆盖了更均匀的架构空间，降低了极端成对差异的权重。 然而16.4%仍然是第二大方差源（仅次于item_id的41.2%），确认model×item是真实效应而非2-model
    artifact。 cross-model G从0.073上升到0.152——方向正确但仍远低于0.80阈值， 说明即使4模型的"缓冲"效应，item难度排序的模型特异性仍然是跨模型可推广性的根本障碍。
    D-study显示即使10个模型也只能达到G=0.228——model×item交互不能通过增加模型数量有效消除， 这是因为每个新模型带来新的item-level
    disagreement pattern。

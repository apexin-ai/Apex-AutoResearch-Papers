    knowledge items的难度 在条件变化下高度稳定——一个化学知识要么知道要么不知道，prompt措辞影响有限。 HellaSwag（常识NLI）item_id次高（54.2%）：commonsense
    completion的难度相对稳定， 但prompt format对NLI-style items有一定影响。 GSM8K（数学推理）item_id=43.5%：chain-of-thought推理引入更多随机性——

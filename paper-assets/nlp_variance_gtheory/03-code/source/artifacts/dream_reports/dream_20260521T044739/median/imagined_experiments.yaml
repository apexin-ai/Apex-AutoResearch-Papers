tier: median
narrative_guidance: Claims需要校准强度。Claim 1从"hidden dominant"降级为"substantial and previously
  unquantified"—— model×item从2-model的26.2%衰减到4-model的16.4%，仍为第二大方差来源但不再可称"dominant"。
  跨benchmark梯度方向大致正确（3/4符合预期）但ARC-Challenge异常打破单调性， 措辞从"primary novel finding"降为"suggestive
  evidence of benchmark-conditional variance structure"。 exp-003因第二块GPU未到位而缺失，Claim
  2必须限定为"numerical precision on single hardware architecture"， hardware crossing明确标注为future
  work。补偿策略：提升Claim 3（IRT vs G-theory 4.1×差距） 为论文第一贡献，因其不受model数量和hardware限制影响；拉入exp-006部分fine-tuning结果
  展示inference与fine-tuning的方差结构质变（seed取代item成为dominant source）； 强化toolkit的实用价值论证（D-study
  calculator可直接输出benchmark-specific budget）。 AAAI投稿可行但需精心打磨framing，目标borderline accept（5.5-6.0/10）。
  最大风险：reviewer质疑"4 models不够做random facet"——需在limitations中承认并提供bootstrap补偿。

  plan_id: exp-001
  description: 4 models × 3 precisions (Gemma仅2) × 6 prompts × 6 seeds × 3 temperatures
    × 4 orderings × 200 items。 V0 enforce_eager消除float32 engine confound。完成全部4个模型的数据采集。

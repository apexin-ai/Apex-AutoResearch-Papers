    anomaly会更明显（ARC不在expected位置上），gradient叙事更难成立。 反之，如果MATH的item_id高于ARC，可能重新排列gradient使其更接近monotonic。
    无论如何，4个benchmarks已足够支撑"benchmark-conditional"的结论—— 不一定需要monotonic gradient，只需要证明variance
    structure因benchmark而异。

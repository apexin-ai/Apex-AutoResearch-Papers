        - 30
        gradient_monotonicity_perm_p:
        - 0.001
        - 0.05
        model_x_item_range_pct:
        - MMLU ~34 → MATH ~45-55
        G_item_cross_model_range:
        - MMLU 0.82 → MATH 0.60-0.70
        n_models_completed:
        - 6
        - 8
        n_benchmarks_completed:
        - 5
        - 5
        within_format_gradient_preserved:
        - true
        precision_separability_all_benchmarks_binary:
        - 0
        - 1.0

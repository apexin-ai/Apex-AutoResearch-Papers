    # Dream Review Report


    **Paper**: Reproducibility Budgets for LLM Evaluation: Benchmark-Specific Variance
    Structures via Generalizability Theory

    **Venue**: ACL ARR (1–5 scale per official review form)

    **Review mode**: simple (single reviewer, full coverage)


    ---


    ## Summary


    The paper applies Generalizability Theory (G-theory) to decompose variance in
    LLM benchmark evaluation across multiple facets (item selection, prompt template,
    random seed, temperature, item ordering) with model treated as a crossed facet.
    The analysis covers 4 open-weight models (7–9B) on 4 benchmarks (MMLU, ARC-Challenge,
    HellaSwag, GSM8K). Three main findings: (1) model×item interaction accounts for
    33.6% of variance on MMLU, reducing apparent item dominance from 61% to 42%; (2)
    variance structures are irreducibly benchmark-specific with no monotonic gradient;
    (3) G-theory requires 4.4× more items than IRT for equivalent reliability because
    it accounts for prompt, seed, and ordering facets invisible to IRT.


    ---


    ## Scores


    | Dimension | Score | Label |

    |-----------|-------|-------|

    | **Soundness** | 3 | Acceptable |

    | **Excitement** | 3 | Interesting |

    | **Overall Assessment** | 3 | Findings |

    | **Confidence** | 4 | Confident in evaluation |


    ---


    ## Strengths


    **S1. Well-motivated research question with principled methodology.** The gap
    between single-factor variance studies and multi-factor decomposition is real
    and underexplored. G-theory is the right psychometric framework for this, and
    the paper does a good job explaining it accessibly for an NLP audience (Section
    3). The formalization of "reproducibility budgets" via D-studies is a genuinely
    actionable contribution.


    **S2. Thorough MMLU analysis with strong internal validation.** The MMLU analysis
    is the paper''s backbone and it is convincing. The single-model vs. cross-model
    comparison (Table 1) cleanly demonstrates how ~19pp of apparent item dominance
    is actually model×item interaction. The D-study out-of-sample validation (3-model
    prediction G=0.816 vs. observed 4-model G=0.820, Δ=0.004) is a compelling validation
    that the variance component estimates have predictive value. Bootstrap CIs are
    appropriately computed.


    **S3. Impressive robustness section (Section 5.4).** Six distinct robustness checks
    — REML vs. Henderson I, fixed-vs-random sensitivity, binary data simulation, GLMM
    cross-check, bootstrap-vs-jackknife, precision separability — demonstrate serious
    methodological care. The GLMM finding that model×item may be even larger on the
    logit scale (47.3% vs 22.8% for item) is reported transparently despite complicating
    the headline numbers.


    **S4. Honest and thorough limitations.** The Limitations section is among the
    most thorough I have seen. Single GPU architecture, four models at one scale,
    no MATH benchmark, no fine-tuning analysis, binary scoring limitation, GSM8K estimation
    instability — all are stated clearly. This level of transparency aids reproducibility
    and scoping.


    **S5. IRT vs. G-theory comparison (Section 5.3).** The 4.4× item requirement ratio
    with decomposition of the excess into prompt×item (22%), seed×item (23%), and
    residual (55%) is a clean, novel result with direct practical value. It quantifies
    a "hidden cost" of evaluation that IRT-based efficiency approaches overlook.


    ---


    ## Weaknesses


    **W1. Cross-benchmark claims rest on thin evidence (Major).** The "benchmark-specific
    variance fingerprints" (Contribution 2) is based on only 4 benchmarks, with one
    (GSM8K) exhibiting pathological estimation behavior. The permutation test for
    monotonicity (p=0.41) has extremely low power with n=4. The claim that fingerprints
    are "irreducibly benchmark-specific" and "cannot be predicted from task taxonomy,
    format, or difficulty distribution" is too strong for 4 data points — especially
    when only 2 share a format (MMLU and ARC, both MC), making format-vs-content disentanglement
    impossible. The paper acknowledges this (Section 5.2, "within-format gradient
    test is inconclusive"), but the abstract and contributions frame it as a firm
    finding rather than an exploratory observation.


    **W2. GSM8K results are unreliable and undermine 25% of the cross-benchmark analysis
    (Major).** The paper commendably reports GSM8K''s pathologies: 43.2% residual,
    negative REML estimates requiring clamping, Henderson I divergence, fixed-vs-random
    Δ of 8.4pp, and a D-study CI spanning [600, 2100] (3.5× range). However, it still
    includes GSM8K in Table 2 and Table 3 as if the estimates are comparable to MMLU/ARC/HellaSwag.
    When the point estimate for items-at-G≥0.80 is "practically meaningless" (the
    paper''s own words), should it appear in the main table informing practitioner
    budgets? The GSM8K row inflates the apparent diversity of fingerprints — remove
    it and the 4.1× spread in D-study budgets drops substantially. The paper should
    more clearly separate reliable estimates (MC benchmarks) from illustrative-but-unreliable
    estimates (GSM8K).


    **W3. Model exchangeability assumption is weakly supported (Moderate).** Treating
    4 purposively-selected models as a random sample from "the universe of LLMs" is
    a strong assumption. The paper discusses this (Section 4, "purposive sample from
    four architecture families") and presents fixed-vs-random sensitivity (≤2.8pp
    on MMLU), but the leave-one-model-out analysis (G range 0.747–0.793, spread=0.046)
    actually suggests non-trivial dependence on which models are included. With only
    4 models, the model facet has very few degrees of freedom for estimating model×item
    interaction — the 33.6% estimate could shift meaningfully with different or additional
    models. The D-study projection to ~10 models for G≥0.90 is extrapolation well
    beyond the data.


    **W4. 200-item subsampling strategy underdiscussed (Moderate).** Each benchmark
    uses only 200 items out of much larger pools (MMLU has ~14K, ARC ~2.6K, HellaSwag
    ~10K, GSM8K ~1.3K). The paper does not describe the subsampling strategy — random?
    stratified by difficulty or topic? This is critical because item-level variance
    components depend on item pool composition. If the 200 items are not representative,
    the variance decomposition may not generalize to the full benchmark. The projection
    that G=0.987 at 14K items on MMLU (Section 5.1) assumes the variance structure
    estimated on 200 items transfers, which is unvalidated.


    **W5. IRT comparison limited to MMLU, generalization unknown (Moderate).** The
    4.4× ratio (Contribution 3) is demonstrated only on MMLU — "the only benchmark
    with both sufficient data and non-pathological variance structure for a meaningful
    IRT comparison" (Section 5.3). This is an honest scoping, but it means the contribution
    is a single-benchmark finding presented as a general principle. On benchmarks
    where model×item interaction has a different structure (e.g., HellaSwag at 15.7%),
    the ratio could be substantially different.


    **W6. Reduced design for non-MMLU benchmarks creates an asymmetry (Minor).** MMLU
    uses 3 temperatures × 4 orderings in the full crossing, while ARC/HellaSwag/GSM8K
    use only 2 temperatures × 4 orderings. This means the variance components for
    the reduced-design benchmarks have fewer degrees of freedom for temperature-related
    interactions. The cross-benchmark comparison in Table 2 conflates benchmark-specific
    variance structure with design-specific estimation precision. The paper should
    acknowledge this asymmetry more explicitly.


    **W7. No evaluation of practical adoption pathway (Minor).** The paper concludes
    that "benchmark-specific reproducibility budgets are the only viable path" and
    promises an "open-source G-theory pipeline and D-study budget calculator." But
    the practical barrier to adoption is not the absence of a calculator — it is that
    G-theory requires a full factorial experiment (multiple prompts × seeds × temperatures
    × orderings) before any budget estimation can occur. This initial data collection
    cost is not discussed. How many evaluation records does a practitioner need to
    run a reliable G-study before they can compute their budget? The paper would benefit
    from a "cost-of-entry" analysis.


    ---


    ## Questions for Authors


    1. What is the item subsampling strategy for each benchmark? Were the 200 items
    random, stratified, or selected by some other criterion? How sensitive are the
    variance component estimates to alternative subsamplings?


    2. Given that GSM8K''s D-study CI spans [600, 2100], would you consider presenting
    GSM8K separately as a case study of G-theory''s limitations on free-form generation,
    rather than as a peer entry in the cross-benchmark comparison tables?


    3. For the IRT comparison (Section 5.3), the IRT item count of 116 comes from
    which IRT model (1PL, 2PL, 3PL)? How does the ratio change across IRT specifications?


    4. The GLMM cross-check on a 25-item subsample shows model×item > item on the
    logit scale (47.3% vs 22.8%). This is a striking reversal. Have you attempted
    the GLMM on the full 200 items? The 25-item result is acknowledged as potentially
    affected by underspecification, but it raises the question of whether the Henderson
    I probability-scale decomposition understates model×item.


    5. How were the 6 prompt templates selected? Were they designed to span a diversity
    axis, or drawn from existing templates? Prompt template is a fixed set in this
    study — does the fixed-vs-random sensitivity analysis for prompts show comparable
    stability to temperature?


    ---


    ## Missing Experiments (from review context)


    The review context reveals a substantially more ambitious experimental plan than
    what the paper delivers:


    - **MATH benchmark**: Blocked by answer extraction pipeline issues. Its absence
    prevents within-free-form format gradient testing and is the single most impactful
    missing piece for Contribution 2.

    - **Additional models (Yi, OLMo, InternLM, DeepSeek)**: Blocked by hardware unavailability.
    Would have strengthened the model-as-facet exchangeability argument.

    - **Multi-hardware G-study**: Completely blocked. Infrastructure claims remain
    limited to numerical precision on a single GPU.

    - **14B model extension**: Blocked. No model scale analysis.

    - **Fine-tuning G-study**: Blocked by compute. Inference-only scope acknowledged.

    - **LayerCast precision study**: Deprioritized. Minimal impact given BF16≈FP16
    finding.


    The paper honestly acknowledges most of these as limitations. The core MMLU analysis
    and Phase 1 cross-benchmark data are sufficient for a contribution, but the gap
    between planned scope and delivered scope is substantial — roughly 40–50% of the
    planned experimental program was executed.


    ---


    ## Reproducibility Assessment


    **Score: 3/5.** The paper describes the experimental design clearly (Section 4)
    and promises open-source code and a D-study calculator. However, the 200-item
    subsampling strategy is underdescribed, the specific prompt templates are not
    listed, and the vLLM configuration ("default settings") lacks specificity. The
    single-GPU setup is reproducible in principle but the specific hardware (RTX PRO
    6000, Blackwell) is not widely available.


    ---


    ## Minor Issues


    - Table 2 footnotes use † and ‡ but the symbols are small and easy to miss; consider
    integrating caveats into the table caption.

    - Section 5.1: "Per-model interaction magnitudes confirm this: Mistral (29.25%,
    accuracy 63.8%) > Qwen (27.11%) > Gemma (23.95%) > Llama (19.69%)." — These percentages
    do not sum to 100% and their interpretation is unclear. Are these per-model contributions
    to the model×item component?

    - The paper does not cite Mesting [2026] with a venue — if it is a preprint at
    review time, the comparison in the Discussion should note this.

    - Section 5.4, "Binary data validation": The observed-to-Bernoulli ratio of 1.0008
    is reassuring but the null simulation uses a "matched design" — matched to what?
    The design matching should be specified.


    ---


    ## Overall Assessment


    This paper makes a solid methodological contribution by applying G-theory to multi-benchmark
    LLM evaluation and producing actionable D-study budgets. The MMLU analysis is
    thorough, well-validated, and produces genuinely novel findings (model×item interaction
    at 33.6%, IRT vs. G-theory 4.4× ratio). The robustness analysis is exemplary.


    However, the cross-benchmark analysis — which constitutes Contribution 2 and is
    the paper''s differentiator from a single-benchmark study — rests on only 4 benchmarks
    with one producing unreliable estimates. The "irreducibly benchmark-specific"
    claim is directionally supported but statistically underpowered. The model facet
    (4 models, purposive sample) is the thinnest part of the design, and the 200-item
    subsampling strategy is underdescribed.


    The paper is above the threshold for Findings: the methodology is sound, the MMLU
    results are publishable, and the practical contribution (D-study budgets) has
    value. For a main conference track, the cross-benchmark claims would need more
    benchmarks (ideally 6–8 including MATH), more models (6+ with diversity in scale
    and family), and reliable estimation across all included benchmarks. The current
    version reads as a strong single-benchmark study (MMLU) with an exploratory multi-benchmark
    extension — the framing should better reflect this asymmetry.


    **Recommendation: Findings (Overall = 3).**


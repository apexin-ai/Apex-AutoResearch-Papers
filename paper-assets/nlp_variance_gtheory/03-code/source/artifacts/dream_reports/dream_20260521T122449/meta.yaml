      下的合理不确定性。

      (c) D-study预测的 out-of-sample 验证是方法学亮点——3→4 模型预测误差仅 0.004， 4→7 模型预测误差 <0.01，证明
      D-study 投影在此设计下可靠。

      (d) REML 与 Henderson I 的一致性（<0.5pp, rank ρ=1.0）源于设计的近似平衡性—— Henderson I 在平衡设计下是无偏的（Brennan
      Ch.3），而我们的设计仅因 Gemma FP16 缺失而 轻微不平衡，REML 的迭代校正效果极小。

      (e) Logprob 连续指标上梯度同样单调（p=0.012），且 item_id% 普遍高于 binary（~+9pp）， 因为连续评分保留了更多
      item 间难度差异信息。这支撑标题中的 "Evaluation Metrics" 声明。

      (h) IRT vs G-theory 的比较是论文最强贡献之一。IRT 推荐 116 items（MMLU），此时 G-theory 的 G 仅 0.529——远低于
      0.80 阈值。差异来源清晰：IRT 不考虑 prompt×item (2.8%)、 seed×item (2.5%) 和 model×item (33.6%)
      维度。在 GSM8K 上这个差距更大（7.9×）， 因为推理基准的 model×item 交互更强，IRT 忽略的变异更多。

      (i) 功效分析确认设计有 >99% 的功效检测 5% 交互效应，94% 检测 1% 效应—— 远超审稿人 "underpowered" 的担忧。这得益于
      ~2M 条记录的大样本量。

      (k-n) 四项灵敏度分析均返回 "robust" 结论，为方法学防御提供了完整证据链。

      '

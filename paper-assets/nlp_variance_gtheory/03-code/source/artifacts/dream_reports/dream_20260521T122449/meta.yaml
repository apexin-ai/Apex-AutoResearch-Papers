    result_rationale: '知识检索型基准（MMLU、ARC）的 item 难度在模型间相对一致——大多数模型要么"知道"某个事实要么不知道， 因此
      item_id 主效应大（42%、36%），model×item 交互相对低（34%、37%）。随着任务从知识检索转向 多步推理（HellaSwag→GSM8K→MATH），正确率越来越依赖模型特有的推理策略和
      chain-of-thought 能力， 而非共享的知识基础。不同模型在同一道推理题上的成败模式高度分化——Qwen3 擅长代数变换但 Mistral
      擅长 几何推理——导致 model×item 交互急剧上升（48%→54%），item_id 主效应相应压缩（20%→14%）。 这在 G-theory
      框架下表现为：推理基准的 item 难度排序更加 model-conditional，G_item 系数下降 （0.82→0.61），D-study 需要更多
      item 才能达到同等信度（340→780）。

      within-format gradient 得以保持的原因：即使在同为 MC 格式的 MMLU 和 ARC 中，ARC 的 item 涉及更多科学推理和因果判断（比
      MMLU 的知识回忆要求更高），因此 item_id 下降 6pp。同理， MATH 比 GSM8K 需要更复杂的多步代数/几何推理，item_id 再下降
      5pp。这说明梯度的主驱动力是 认知复杂度而非答题格式。HellaSwag（completion format）的 item_id 低于 ARC（MC
      format） 但高于 GSM8K，也符合其任务特性——需要常识推理但不需要数学符号操作。

      残差从 MMLU 的 19.5% 上升到 MATH 的 27.4%，反映推理型基准中更多的随机性来源—— 生成式回答的格式变异、chain-of-thought
      的路径依赖性、以及 temperature 采样在长序列上的 累积效应都增加了不可归因的变异。

      梯度单调性排列检验 p=0.008 (5000次排列)，在 α=0.01 水平显著，这是因为 7 个模型 × 5 个基准 提供了足够的统计功效，且效应量（27.9pp
      spread）远超偶然波动。

      '

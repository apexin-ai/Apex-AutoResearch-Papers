tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Cross-benchmark gradient clear and monotonic; all three claims validated
        with multi-benchmark + multi-model evidence; AAAI timeline feasible
      key_assumptions:
      - exp-002 completes Phase 1-3 (6+ models × 5 benchmarks) within 4 weeks
      - Item_id% decreases monotonically from knowledge-retrieval (MMLU/ARC) to multi-step
        reasoning (GSM8K/MATH), with ≥20pp spread
      - Within-format gradient preserved (MMLU > ARC within MC format; GSM8K shows
        lower item_id than HellaSwag), ruling out format confound as primary driver
      - Model×item interaction increases correspondingly on reasoning benchmarks,
        confirming model-conditional difficulty is task-type dependent
      - Precision separability holds across all benchmarks under binary scoring (<1%)
      - D-study budgets vary meaningfully across benchmarks (knowledge needs fewer
        items than reasoning), enabling benchmark-specific practitioner guidance
      number_ranges:
        cross_benchmark_item_id_pct:
        - MMLU ~42 → ARC ~35 → HellaSwag ~28 → GSM8K ~20 → MATH ~15
        gradient_spread_item_id_pp:

  review_report: '---

    dream_id: dream_20260521T122449

    tier: median

    overall_score: 5/10 — Marginally Below Acceptance Threshold

    timestamp: 2026-05-21T13:48:54.063362+00:00

    ---


    # Review Report: Reproducibility Budgets for LLM Evaluation


    **Venue:** AAAI (confirmed from project context)

    **Rating Scale:** AAAI 1-10 (10 = top 5% seminal, 7 = good accept, 5 = marginally
    below threshold, 1 = trivial/wrong)


    ---


    ## Overall Recommendation


    **Overall Score: 5 / 10 — Marginally Below Acceptance Threshold**


    The paper addresses a timely and important problem (LLM evaluation reproducibility)
    with a principled framework (G-theory). The core empirical contributions (Sections
    4–5, based on 1.3M actual evaluation records) are solid and methodologically sound.
    However, three significant issues push it below the AAAI acceptance line: (1)
    three full sections present projected/hypothetical results from experiments that
    were never executed; (2) the paper''s most ambitious claim — a systematic variance
    gradient across benchmarks — fails its own monotonicity test (p=0.12); and (3)
    the 4-model design produces wide confidence intervals (±5pp) on the key model×item
    finding, limiting the precision of quantitative conclusions.


    ---


    ## Scores by Dimension


    | Dimension | Score | Notes |

    |-----------|-------|-------|

    | Soundness | 6/10 | Core methodology correct; projected experiments and gradient
    non-monotonicity weaken empirical claims |

    | Significance | 6/10 | Important problem, practical D-study budgets are useful;
    20–50× cost multiplier may discourage adoption |

    | Novelty | 7/10 | Multi-benchmark G-theory with model as crossed facet is genuinely
    new; IRT comparison is original |

    | Clarity | 7/10 | Well-written, honest about limitations; tables are clear and
    informative |

    | **Overall** | **5/10** | Borderline — strong methodology undermined by projected
    experiments and imprecise gradient claim |


    ---


    ## Summary


    The paper applies Generalizability Theory to LLM evaluation across five benchmarks
    (MMLU, ARC-Challenge, HellaSwag, GSM8K, MATH), crossing numerical precision with
    methodology factors (prompt, seed, temperature, ordering) and treating model as
    a crossed quasi-random facet. Using ~1.3M evaluation records from 4–6 models,
    it reports three findings: (1) item difficulty (25.8–42.1%) and model×item interaction
    (32.8–38.5%) jointly dominate variance but are benchmark-conditional; (2) numerical
    precision is negligible under binary scoring (<0.1%); (3) D-study projections
    yield benchmark-specific reproducibility budgets of 414–582 items for G≥0.80.
    Additional analyses include bootstrap CIs, IRT vs. G-theory item requirements
    (3.6–5.5× ratio), scoring metric comparisons, and six methodological robustness
    checks. Sections 7–9 present projected (not executed) results for 14B model scale
    extension, RoBERTa fine-tuning, and LayerCast precision mitigation.


    ---


    ## Strengths


    ### S1: Scale and Rigor of Core Experiments

    The multi-benchmark G-study (1.32M records across 5 benchmarks with balanced factorial
    design) is among the largest variance decomposition studies in LLM evaluation.
    The design carefully crosses infrastructure and methodology factors, and the reuse
    of MMLU data from a prior experiment is transparently documented. The 258 GPU-hours
    investment reflects genuine commitment to empirical thoroughness.


    ### S2: D-Study Out-of-Sample Validation

    The two-stage out-of-sample validation (3-model predicted G=0.816, observed 0.820
    with Δ=0.004; 4-model predicted G=0.848, observed 0.842 with Δ=0.006) is rare
    in this literature and provides genuine evidence that G-theory D-study projections
    are reliable for measurement design. This is perhaps the paper''s strongest individual
    contribution.


    ### S3: IRT vs. G-Theory Comparison

    The 3.6–5.5× item requirement ratio between G-theory and IRT is a clean, cross-benchmark
    finding with a clear causal explanation: G-theory accounts for prompt×item (3.2–6.2%),
    seed×item (2.3–4.5%), and residual (10.3–17.8%) dimensions that IRT treats as
    fixed. This quantifies the "cost of multi-facet reliability" for the first time
    across multiple benchmarks. The demonstration that G-theory at IRT''s recommended
    item counts yields only G=0.41–0.53 is striking and practically important.


    ### S4: Comprehensive Robustness Package

    Six robustness checks (REML vs. Henderson I, fixed vs. random facet classification,
    bootstrap vs. jackknife CIs, design asymmetry 3×3 vs. 2×2, null simulation for
    binary data, full-benchmark G projection) all pass, and Table 9 presents these
    concisely. The null simulation (obs/null ratio = 526×) is particularly important
    for validating G-theory''s application to binary 0/1 data.


    ### S5: Honest Reporting of Limitations

    The paper transparently reports the gradient''s non-monotonicity (p=0.12), the
    HellaSwag anomaly, the format confound, and the wide CIs from 4 models. This intellectual
    honesty is commendable and builds trust in the reported findings.


    ### S6: Model×Item Quantification

    Demonstrating that model×item interaction is the second-largest variance source
    across all five benchmarks (32.8–38.5%), and that single-model designs overestimate
    item dominance by 20–25pp (Table 3), is a practically important finding. This
    directly challenges single-model IRT/subsampling approaches.


    ---


    ## Weaknesses


    ### W1 (Major): Projected Experiments Presented as Results

    Sections 7 (14B Models), 8 (Fine-Tuning), and 9 (LayerCast) present results from
    experiments that were never executed. While the word "project" is used, these
    sections include specific numerical tables (Tables 10, 11) with variance decomposition
    percentages, accuracy figures, and architectural comparisons — all hypothetical.
    This is highly unusual for an empirical paper. These sections occupy ~2.5 pages
    (19% of content pages) and create a hybrid between empirical study and speculative
    analysis. At AAAI, reviewers expect reported results to be based on actual data.


    **Recommendation:** Remove Sections 7–9 entirely and consolidate key hypotheses
    into a focused "Future Work" paragraph. The paper would be stronger and more focused
    as a ~9-page empirical study covering Sections 1–6 and 10–11.


    ### W2 (Major): Gradient Non-Monotonicity Undermines Primary Claim

    The paper''s most ambitious contribution is that variance structure varies systematically
    across benchmarks along a knowledge→reasoning gradient. However:

    - The permutation test rejects strict monotonicity (p=0.12)

    - HellaSwag (29.5%) falls below GSM8K (31.2%) despite lower hypothesized task
    complexity

    - The format confound (MC 38–42% vs. non-MC 26–31%, 11pp gap) is an alternative
    explanation

    - Within-format gradients are only 4.3pp (MC) and 5.4pp (free-form) with N=2 per
    format, insufficient for statistical testing

    - Bootstrap CIs on gradient endpoints overlap (MMLU lower 36.0% vs. GSM8K upper
    37.8%)


    The paper honestly hedges this as "benchmark-conditional variance structure with
    task-type as a partial predictor," but the hedged version is considerably less
    novel than a systematic gradient. The format confound is really the more defensible
    finding, but it''s presented as secondary.


    ### W3 (Major): 4-Model Statistical Limitation

    With only 4 primary models, the design has 3 degrees of freedom for model-related
    variance estimation. This produces:

    - ±5pp CIs on model×item (the second-largest component)

    - Wide CIs on model main effect (e.g., [1.2, 7.5] for MMLU)

    - Imprecise gradient magnitude ("10–20pp spread" rather than 16.3pp)


    The paper acknowledges that 8+ models would halve CI width. Given that model×item
    is the paper''s signature finding, this imprecision is a fundamental limitation.
    The two extension models (Yi, OLMo) only partially address this, as they cover
    only a subset of benchmarks.


    ### W4 (Moderate): Limited Model Diversity

    All primary models are 7–9B parameter open-weight instruction-tuned models from
    the same generation. The variance structure could differ substantially for:

    - Proprietary API models (GPT-4, Claude) with different inference stacks

    - Much larger models (70B+) where floor effects are further reduced

    - Base (non-instruction-tuned) models

    - Reasoning models (o1-style) with fundamentally different inference


    The quasi-random facet assumption is supported by the D-study validation, but
    only within this narrow model population.


    ### W5 (Moderate): MATH Preliminary Data

    MATH uses only 3 models (Mistral pending), producing wider CIs than other benchmarks.
    MATH appears at the extreme of the gradient (lowest item_id at 25.8%, highest
    model×item at 38.5%), so imprecise estimates at this endpoint further weaken the
    gradient claim. The paper marks this with a dagger (†) but the 3-model MATH data
    still drives conclusions throughout.


    ### W6 (Minor): Single GPU Architecture Scope

    Precision separability (Claim 2) is confirmed only on RTX PRO 6000. While BF16≈FP16
    (Δ=0.23pp) provides indirect evidence that hardware effects would be negligible,
    the paper cannot claim "infrastructure separability" — only "precision separability
    on a single architecture." This is honestly scoped in Section 6 but limits the
    generality of Claim 2.


    ### W7 (Minor): Cost Framing May Discourage Adoption

    The 20–50× cost multiplier (from $2–5 to $80–250 per model) for D-study-recommended
    designs is substantial. While the paper frames this as quantifying the "gap between
    current practice and dependable measurement," the practical message may be that
    reliable evaluation is prohibitively expensive. A more constructive framing would
    emphasize what partial improvements (e.g., 3 prompts × 3 seeds on existing item
    sets) buy in terms of reliability gain.


    ---


    ## Experiment Coverage Assessment


    Comparing the paper against the full experiment design:


    | Experiment | Status | Paper Coverage | Assessment |

    |-----------|--------|---------------|------------|

    | exp-002 Multi-Benchmark G-Study | Phase 1-2 done, Phase 3 ~20% | Sections 3–4
    (actual data) | ✓ Fully covered |

    | exp-003 Multi-Hardware G-Study | Descoped | Section 6 (descoped, projections)
    | ✓ Honestly reported |

    | exp-004 Combined Analysis | Done (pure analysis) | Section 5 (actual analysis)
    | ✓ Fully covered |

    | exp-005 14B Scale Extension | Not started | Section 7 (projected) | ⚠ Hypothetical
    results |

    | exp-006 Fine-Tuning G-Study | Not started | Section 8 (projected) | ⚠ Hypothetical
    results |

    | exp-007 LayerCast | Not started | Section 9 (projected) | ⚠ Hypothetical results
    |

    | exp-008 MATH Benchmark | Merged into exp-002 | Included in Section 4 | ✓ Covered
    |


    All planned experiments are represented. The concern is that 3 unexecuted experiments
    are presented with specific numerical results (Tables 10–11), which could mislead
    readers despite the "projected" labeling.


    ---


    ## Questions for Authors


    1. **Gradient vs. format:** If you had 4–5 benchmarks per format category, do
    you believe the within-format gradient would reach significance? Or is format
    the primary driver of variance structure differences?


    2. **Model×item stability:** The model×item percentage ranges from 32.8% (HellaSwag)
    to 38.5% (MATH). Given the ±5pp CIs, are these meaningfully different, or is model×item
    essentially constant at ~35% across benchmarks?


    3. **Projected experiments:** What is the justification for including projected
    results with specific numerical tables rather than qualitative predictions in
    a Future Work section? How were the projected numbers generated?


    4. **200-item subsample:** Why 200 items per benchmark? The D-study shows G=0.94–0.99
    at full benchmark size. Was the 200-item choice driven by compute constraints,
    and would results change qualitatively with 500 items?


    5. **Practitioner adoption:** The 20–50× cost multiplier is steep. Can you provide
    intermediate recommendations (e.g., "2 prompts × 2 seeds with your existing item
    set yields G≈X") to make the framework more adoptable?


    ---


    ## Minor Issues


    - Table 2 orders benchmarks by item_id descending but places HellaSwag after GSM8K,
    breaking the gradient ordering — consider reordering to match the hypothesized
    complexity order to make the break visually apparent.

    - The paper switches between "item difficulty" and "item_id" terminology — standardize.

    - Several cited works are listed as "Preprint" (Brittlebench 2026, Mesting 2026,
    Bui et al. 2025, Kunievsky & Evans 2025). Verify these are publicly accessible
    and cite stable versions (arXiv IDs).

    - Section 3.2 mentions "3 precisions × 3 temperatures" for the MMLU full design
    but the paper''s primary analysis uses only BF16 × 2 temperatures — clarify which
    data subset drives which results.

    - The G-coefficient formula (Eq. 2) uses a simplified notation; consider showing
    the full denominator with all error variance components for the specific design
    used.


    ---


    ## Suggestions for Improvement


    1. **Remove projected sections (7–9):** Replace with a concise Future Work section.
    Focus the paper on its actual empirical strengths.

    2. **Add more models:** Even 2–3 additional models on MMLU alone would substantially
    tighten model×item CIs and strengthen the primary finding.

    3. **Reframe Claim 1:** Lead with the format confound finding (11pp MC vs. non-MC
    gap) as the primary result, with the task-type gradient as a secondary observation.
    The format finding is more statistically robust.

    4. **Add intermediate D-study recommendations:** Show what practitioners gain
    from partial improvements (e.g., 2 prompts × 2 seeds on 200 items → G≈0.65) to
    make the framework more approachable.

    5. **Complete MATH data:** Adding Mistral''s MATH results would strengthen the
    gradient endpoint and remove the preliminary caveat.


    ---


    ## Confidence


    **Confidence: 4/5 — Confident but not certain.** I have substantial familiarity
    with G-theory, variance decomposition methods, and LLM evaluation benchmarks.
    I carefully read the full paper and assessed it against the experimental design.
    My main uncertainty is whether the AAAI program committee would weight the projected
    experiments as heavily as I do — some reviewers might view them as informative
    extensions rather than unsupported speculation.


    ---


    ## Summary Assessment


    A methodologically sound paper that makes genuine contributions (model×item quantification,
    D-study validation, IRT comparison) but is weakened by projected/unexecuted experiments
    presented as results, a primary gradient claim that fails its own statistical
    test, and wide confidence intervals from a 4-model design. The paper would benefit
    substantially from removing hypothetical sections, adding more models, and reframing
    around the format confound as the primary finding. In its current form, it falls
    just below the AAAI acceptance threshold but represents solid work that could
    reach acceptance with targeted revisions.'

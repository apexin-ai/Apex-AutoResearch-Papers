        - 1200
        exp002_phase_completion:
        - Phase 1 done only
      narrative_direction: 'Abandon gradient as headline. Reframe paper around two
        axes: (A) deep single-benchmark analysis (MMLU, exp-001 — already strong:
        model×item quantification, D-study validation, IRT comparison, full robustness
        package) + (B) ''benchmark-specific variance fingerprints'' — each benchmark
        has a unique variance structure that cannot be predicted from task taxonomy
        alone, making benchmark-specific G-studies mandatory rather than optional.
        Hook flipped: ''not only is there no universal reproducibility recipe — there
        is no universal variance structure, and even task-type taxonomy fails to predict
        it.'' This is still a publishable finding (arguably more surprising than a
        clean gradient), but requires rewriting intro and restructuring figures. Claim
        1 narrowed to MMLU with exploratory multi-benchmark extension. Claim 2 unchanged
        (precision separability on MMLU). Claim 3 strengthened — benchmark-specific
        budgets are the ONLY viable approach. Primary contribution shifts from gradient
        discovery to: (i) model×item interaction quantification with D-study validation,
        (ii) IRT vs G-theory comparison, (iii) demonstration that variance structure
        is irreducibly benchmark-specific. Same venue target (AAAI), but likely needs
        ACL ARR timeline for rewriting.'

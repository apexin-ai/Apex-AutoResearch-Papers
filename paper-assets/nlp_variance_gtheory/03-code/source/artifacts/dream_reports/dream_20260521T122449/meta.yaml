        exp002_phase_completion:
        - Phase 1-2 done, Phase 3 partial
      narrative_direction: 'Reframe gradient from ''monotonic task-type dependence''
        to ''benchmark-conditional variance structure with task-type as a partial
        predictor.'' Claim 1 softened: ''item_id dominance and model×item interaction
        magnitudes vary across benchmarks, with task complexity as one moderating
        factor alongside format and difficulty distribution.'' Add explicit analysis
        disentangling format vs task-type. Claim 2 adds caveat for anomalous benchmark.
        Claim 3 strengthened — budget variation across benchmarks makes benchmark-specific
        budgets even more necessary. Hook adjusted to ''variance structure varies
        across benchmarks, but the gradient is partially confounded with evaluation
        format.'' Contribution 1 reweighted toward model×item quantification (already
        validated in exp-001) + benchmark variation (even if not monotonic). May need
        supplementary experiments or extended analysis → consider ACL ARR October
        cycle as insurance if AAAI writing timeline too tight.'
    worst:
      tier: worst
      meaning: No systematic gradient; cross-benchmark variance structures are idiosyncratic;
        must reframe paper around single-benchmark depth + taxonomy of benchmark-specific
        structures
      key_assumptions:
      - exp-002 completes Phase 1 only (4 models × 3-4 benchmarks), Phase 2-4 blocked
        by compute or data issues
      - Item_id% does not vary systematically across benchmarks (<10pp spread), OR
        gradient is entirely explained by format confound (MC vs free-form)
      - Some benchmarks show pathological variance structures — e.g., GSM8K dominated
        by residual (>40%) due to stochastic generation, or model×item interaction
        negligible on ARC
      - Model×item interaction magnitude is benchmark-specific but unpredictable from
        task taxonomy
      - One or more benchmarks show convergence issues with Henderson I (near-zero
        components, negative REML estimates)
      - D-study budgets are wildly different across benchmarks but without interpretable
        pattern

      (2) Bootstrap CIs show model×item uncertainty is the limiting factor; the paper
      must honestly report that 4 models provides only rough magnitude estimates (±5pp).
      (3) D-study budgets are benchmark-conditional with CIs that overlap substantially
      (MMLU [350,490] vs GSM8K [400,590]) — the practical message is "400-600 items
      for any benchmark" rather than sharply differentiated budgets. (4) Logprob scoring
      strengthens the metric-conditional narrative: item_id rises from 42% to 55%
      under continuous scoring, confirming that binary 0/1 compresses item-level information.

  review_report: '---

    dream_id: dream_20260521T122449

    tier: best

    overall_score: 7/10 — weak accept

    timestamp: 2026-05-21T13:42:45.923137+00:00

    ---


    # Dream Review Report


    **Paper**: Reproducibility Budgets for LLM Evaluation: A Generalizability Theory
    Analysis of Variance Sources Across Benchmarks, Models, and Evaluation Metrics

    **Venue**: AAAI (1-10 scale; exact rubric not publicly available for AAAI-26,
    using standard AAAI conventions)

    **Review mode**: simple (single reviewer, full coverage)

    **Date**: 2026-05-21


    ---


    ## Summary


    This paper applies Generalizability Theory (G-theory) to decompose variance in
    LLM evaluation across five benchmarks (MMLU, ARC, HellaSwag, GSM8K, MATH), seven
    open-weight models in the 7–9B parameter range, and multiple methodological facets:
    prompt templates (6), random seeds (6), numerical precision (BF16/FP16), temperature
    ({0.0, 0.7}), and option orderings (4). The resulting ~2M binary item-level records
    are analyzed via Henderson Method I variance decomposition, yielding a fully crossed
    G-study design. The paper advances three central claims: a monotonic cross-benchmark
    variance gradient from item-dominated (knowledge-retrieval) to model×item-dominated
    (reasoning) benchmarks; separability of numerical precision from methodology;
    and a quantified gap between IRT and G-theory reliability estimates due to IRT''s
    inability to capture prompt×item, seed×item, and ordering×item interactions.


    The practical contribution is a set of Decision-study (D-study) budget tables
    specifying the number of items, prompts, seeds, and orderings needed to achieve
    target generalizability coefficients (G ≥ 0.80) for each benchmark. The paper
    also reports 17 robustness analyses addressing the known tension between G-theory''s
    normality assumptions and binary response data, including REML cross-validation,
    null simulation, GLMM on a subsample, Bernoulli-adjusted coefficients, logprob
    gradient analysis, bootstrap and jackknife confidence intervals, and design reduction
    sensitivity tests.


    The work positions itself as extending Mesting (2026), which applied G-theory
    to a single benchmark with LLM-as-judge evaluation, by crossing benchmarks, fixing
    the judge to generation-based scoring, and introducing the cross-benchmark gradient
    as a new theoretical lens for understanding how task structure shapes evaluation
    reliability.


    ## Strengths


    **S1 — Novel multi-benchmark G-theory application.** This is, to my knowledge,
    the first study to apply G-theory across multiple LLM benchmarks in a single crossed
    design. Prior work (Mesting, 2026) demonstrated G-theory''s utility on a single
    benchmark with judge-based evaluation. By crossing five benchmarks, this paper
    reveals structural differences in variance composition that are invisible in single-benchmark
    analyses. The conceptual contribution — that the *type* of benchmark fundamentally
    shapes which variance sources dominate — is well-motivated and extends the literature
    meaningfully.


    **S2 — The cross-benchmark gradient is the paper''s strongest finding.** The monotonic
    drop in item_id variance from 42.1% (MMLU) to 14.2% (MATH), with a corresponding
    rise in model×item from 33.6% to 53.7% (Table 1), is theoretically grounded and
    empirically robust. The explanation is compelling: knowledge-retrieval items have
    stable difficulty rankings across models (high item_id%), while reasoning items
    elicit model-specific solution strategies (high model×item%). The within-format
    gradient tests (Section 4.2) — MMLU→ARC within multiple-choice (Δ=−6.3pp, p=0.023)
    and GSM8K→MATH within free-form (Δ=−5.4pp, p=0.031) — effectively rule out answer
    format as the primary driver, strengthening the cognitive-structure interpretation.


    **S3 — Unusually thorough robustness analysis.** The 17-analysis robustness package
    (Section 5, Table 6) is exceptional for a conference paper. The binary data concern
    — a legitimate methodological tension — is addressed from four complementary angles:
    matched-design simulation, GLMM comparison, Bernoulli normalization, and logprob
    gradient analysis. The REML cross-validation (Δ<0.47pp from Henderson I), bootstrap
    CIs (Table 4), null simulation (item_id 0.08% under null vs. observed 42%), and
    3×3→2×2 design reduction sensitivity test (Δ=1.2pp) collectively provide strong
    evidence that the main findings are not artifacts of estimation choices. This
    level of self-scrutiny is commendable.


    **S4 — Actionable practical output.** The D-study budget tables (Table 5) translate
    abstract variance components into concrete guidance: practitioners can look up
    how many items, prompts, seeds, and orderings are needed for a target reliability
    on each benchmark. The IRT comparison (Table 3) is particularly impactful — showing
    that at IRT-recommended item counts, G-theory reliability is only 0.312–0.529
    because IRT ignores prompt×item, seed×item, ordering×item, and model×item interaction
    dimensions. This 3.6–14.4× gap is a quantified, citable result that challenges
    current evaluation practice.


    **S5 — Model as crossed quasi-random facet.** Treating model as a crossed rather
    than fixed facet is methodologically important. The resulting 34% model×item interaction
    — invisible in single-model G-studies — reveals that item difficulty rankings
    are substantially model-dependent. The 19pp drop in item_id% from single-model
    to cross-model analysis on MMLU (mentioned in Section 1) is a strong empirical
    demonstration of why single-model reliability estimates are inflated.


    **S6 — Writing quality.** The paper is clearly written, well-structured, and transparent
    about its limitations. The Discussion section''s nuanced positioning relative
    to Sclar et al. (2024) and Mesting (2026) avoids both overclaiming and excessive
    hedging. Limitations are stated plainly in Section 6.1 rather than buried.


    **S7 — Format confound controls.** The within-format gradient tests (Table 2)
    are a methodologically clean way to address the obvious confound that answer format
    (multiple-choice vs. free-form) varies across benchmarks. Demonstrating the gradient
    within format categories substantially strengthens the cognitive-structure interpretation.


    ## Weaknesses


    **W1 — "Infrastructure" is overclaimed then narrowed.** The abstract frames the
    study as "crossing infrastructure (numerical precision) with methodology," but
    the actual infrastructure variation is limited to BF16 vs. FP16 on a single GPU
    type. This is acknowledged in Section 6.1, but the abstract and contribution list
    still frame Claim 2 (precision separability, <0.8% variance) as a major finding.
    In practice, BF16 and FP16 differ by at most 0.23pp — a result that is unsurprising
    given the minimal numerical difference between these formats. Meaningful infrastructure
    variation would include GPU architecture, quantization levels (INT8, INT4), batching
    strategies, or multi-GPU parallelism. I recommend the authors either reframe Claim
    2 as a narrow negative result or explicitly state in the abstract that "infrastructure"
    refers only to numerical precision on a single GPU.


    **W2 — 200-item subsamples raise representativeness concerns.** Each benchmark
    contributes only 200 randomly sampled items from pools ranging up to ~14K (MMLU).
    No analysis of sampling variability is reported — the paper does not show how
    variance component estimates change across different 200-item draws. This is consequential
    because the D-study budgets (Table 5) are calibrated to these specific subsamples.
    If item difficulty distributions in the 200-item samples are not representative,
    the budget recommendations may be systematically biased. A split-half or repeated-subsampling
    stability analysis would address this directly and should be feasible given the
    available data.


    **W3 — Model scale is narrow.** All seven models fall in the 7–9B parameter range.
    Larger models (14B, 70B) may exhibit qualitatively different variance structures:
    higher accuracy could compress item_id% (ceiling effects), while specialized reasoning
    capabilities could amplify or dampen model×item%. The paper acknowledges this
    limitation (Section 6.1), but it weakens the generalizability of the gradient
    claim — the monotonic pattern may hold only within a specific scale regime. I
    encourage the authors to include at least one model outside the 7–9B range in
    a revision.


    **W4 — Unbalanced factorial design.** InternLM2.5-7B covers only 3 of 5 benchmarks,
    and DeepSeek-7B was not run at all. Henderson Method I assumes balanced designs;
    while REML cross-validation shows small discrepancies (Δ<0.47pp, rank ρ=1.0),
    the bias properties of Henderson I on unbalanced data are not fully characterized
    in the paper. The authors should either complete the design or provide a more
    thorough analysis of the impact of imbalance — for example, by re-running the
    main analyses on the balanced subset (excluding InternLM) and comparing results.


    **W5 — Judge facet is absent.** Mesting (2026) found judge choice accounts for
    43.8% of variance. By fixing the evaluation paradigm to generation-based scoring,
    this paper''s variance decomposition is conditional on that choice. The judge
    facet is not merely a limitation — it may be the *dominant* variance source in
    real-world LLM evaluation. The paper''s framing as providing comprehensive variance
    decomposition is therefore incomplete in settings where LLM-as-judge evaluation
    is used. This should be stated more prominently than the current brief mention
    in Section 6.1.


    **W6 — Binary data remains a methodological tension.** Despite four complementary
    defenses (Section 3.1, Section 5), G-theory''s assumption of continuous, normally
    distributed data is fundamentally violated by binary item scores. The matched-design
    simulation uses a subsample; the GLMM comparison covers only 25 items; Bernoulli
    normalization is heuristic; and logprob analysis changes the measurement model
    from binary to continuous. Each defense is individually reasonable but none is
    definitive. The paper is admirably transparent, but this remains the core methodological
    risk. A full-scale GLMM analysis on all 200 items (computationally expensive but
    feasible) would substantially strengthen the paper.


    **W7 — Permutation test resolution is very low.** The monotonicity test (Kendall''s
    τ on 5 benchmarks, Table 2) achieves τ=−1.0, p=0.008. However, with only 5 data
    points, this test cannot detect non-trivial departures from monotonicity — any
    single violation would push τ to −0.6 with p>0.05. The statistical significance
    partly reflects the small sample size rather than strong evidence of strict monotonicity.
    The authors should acknowledge this limitation more explicitly and consider whether
    the within-format gradient tests (which are more targeted) are actually the stronger
    evidence for the gradient claim.


    **W8 — Temperature as a two-level factor.** Temperature is varied at only {0.0,
    0.7}. Since 0.0 is deterministic, this is really a binary deterministic/stochastic
    toggle rather than a characterization of temperature''s role. Values like 0.3,
    0.5, and 1.0 would provide meaningful interpolation. The paper''s claim about
    temperature variance contributions is based on an impoverished sampling of this
    facet.


    **W9 — D-study budgets lack uncertainty quantification.** Table 5 reports point
    estimates (e.g., 340 items for MMLU at G≥0.80) without confidence intervals, even
    though the underlying variance components have bootstrap CIs of ±8–10pp (Table
    4). Propagating this uncertainty to D-study projections would likely yield wide
    ranges, which practitioners need to make informed decisions. Presenting precise-looking
    numbers without uncertainty risks overreliance on potentially unstable estimates.


    ## Minor Issues


    - Table 7 (Appendix A) has missing entries for ARC, HellaSwag, and GSM8K in the
    "All random" column, without explanation.

    - The paper claims an open-source G-theory pipeline will be released but provides
    no repository link or anonymized reference.

    - Several references cite "Preprint" without venue, making verification difficult
    (BrittleBench Team 2026, Bui et al. 2025, Kunievsky and Evans 2025, Mesting 2026,
    ThinkingMachines 2025, Yuan et al. 2025).

    - The leave-one-model-out sensitivity analysis (which would demonstrate gradient
    robustness to model selection) is not reported in the paper despite being referenced
    in planning materials.

    - Residual variance interpretation (Section 4.1, increasing from 19.5% to 27.4%)
    invokes chain-of-thought path dependence and cumulative temperature effects without
    empirical validation — this should be flagged as speculative.


    ## Questions for Authors


    1. **Sampling stability**: Have you examined how the variance component estimates
    change across different random 200-item draws from each benchmark? If the item_id%
    for MMLU shifts by, say, ±5pp across draws, the gradient claim becomes less robust.


    2. **Unbalanced design impact**: If you restrict the analysis to the 5 or 6 models
    that are fully balanced across all 5 benchmarks (excluding InternLM), do the main
    findings — particularly the gradient monotonicity and the magnitude of model×item
    — change meaningfully?


    3. **D-study uncertainty**: Could you propagate the bootstrap CIs on variance
    components into uncertainty ranges for the D-study budget recommendations? This
    seems feasible given your existing bootstrap infrastructure.


    4. **Scale sensitivity**: The gradient claim is tested on 7–9B models only. Do
    you have any theoretical argument or preliminary evidence for whether the gradient
    direction would be preserved at 70B scale, where accuracy distributions are substantially
    different?


    5. **Full GLMM**: The GLMM analysis in Section 5 covers only 25 items due to computational
    cost. Have you considered running this on a larger subset (e.g., 100 items) to
    provide a more definitive comparison with Henderson I estimates on binary data?


    ## Experiment Coverage Assessment


    Of the seven planned experiments (exp-002 through exp-008), only two were substantively
    executed: exp-002 (multi-benchmark replication, mostly complete but with gaps
    for InternLM and DeepSeek) and exp-004 (comprehensive analysis package, fully
    complete with 17/17 sub-analyses). Three experiments that would have broadened
    the paper''s scope were not run: exp-003 (multi-hardware G-study, which would
    have supported a genuine infrastructure claim), exp-005 (14B model scale extension,
    which would have tested scale generalizability), and exp-006 (fine-tuning G-study,
    which would have introduced a qualitatively different evaluation context).


    The impact on claims is asymmetric. Claim 1 (cross-benchmark gradient) is well-supported
    by the executed experiments, modulo the model-scale concern. Claim 2 (precision
    separability) is technically supported but the "infrastructure" framing is undermined
    by exp-003''s absence — what was delivered is precision separability on a single
    GPU, not infrastructure separability. Claim 3 (IRT vs. G-theory gap) is well-supported
    and does not depend on the unexecuted experiments. The robustness of the overall
    contribution would have been substantially enhanced by exp-003 and exp-005, but
    the paper manages its scope limitations honestly.


    ## Scores


    | Dimension | Score |

    |---|---|

    | Soundness | 3/4 |

    | Significance | 3/4 |

    | Novelty | 3/4 |

    | Clarity | 4/4 |

    | Overall Recommendation | 7/10 |

    | Confidence | 4/5 |


    ## Overall Assessment


    This is a well-executed study that makes a genuinely novel contribution: the cross-benchmark
    variance gradient from item-dominated to model×item-dominated structure is theoretically
    grounded, empirically supported by within-format controls, and practically useful
    for understanding why different benchmarks have different reliability properties.
    The D-study budget tables and the quantified IRT–G-theory gap provide immediately
    actionable outputs for the evaluation community. The 17-analysis robustness package
    demonstrates unusual methodological rigor for a conference paper, and the writing
    is exemplary in its clarity and transparency.


    The weaknesses are real but bounded. The "infrastructure" claim (Claim 2) is overclaimed
    given the narrow BF16/FP16 variation and should be reframed. The 200-item subsampling,
    7–9B model scale restriction, and unbalanced design introduce uncertainty about
    the generalizability of the specific numbers reported, though the directional
    findings (gradient, IRT gap) are likely robust. The binary data tension is the
    deepest methodological concern — it is well-defended but not fully resolved, and
    a full-scale GLMM comparison would strengthen the paper considerably.


    My recommendation is **weak accept** (7/10). The paper is clearly above the AAAI
    acceptance threshold: it introduces a novel analytical lens, reports a well-supported
    primary finding, provides practical tools, and is transparent about limitations.
    It does not reach strong accept because the scope narrowing (from planned experiments
    to effectively two executed) leaves several natural extensions unaddressed, and
    the infrastructure and scale claims are weaker than framed. A revision that completes
    the factorial design, adds a subsampling stability analysis, propagates uncertainty
    to D-study budgets, and reframes Claim 2 would elevate this to a strong accept.'

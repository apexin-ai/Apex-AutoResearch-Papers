        no universal reproducibility recipe.'' Cross-benchmark gradient is the headline
        finding with permutation-tested monotonicity. Three numbered claims intact.
        Hook validated: single-benchmark G-studies (including our own exp-001) miss
        the task-type dependence. Figures 1-5 all populated with multi-benchmark data.
        AAAI submission on schedule.'
    median:
      tier: median
      meaning: Gradient exists but noisy/non-monotonic; format confound partially
        explanatory; claims require softened language and additional qualification
      key_assumptions:
      - exp-002 completes Phase 1-2 (4-5 models × 4-5 benchmarks) but Phase 3-4 delayed
        or incomplete
      - Item_id% varies across benchmarks (10-20pp spread) but ordering is not cleanly
        monotonic — e.g., HellaSwag breaks the knowledge→reasoning gradient
      - 'Format confound partially explains gradient: MC benchmarks cluster together
        vs free-form, but within-format gradient is weak or absent'
      - Model×item interaction increases on some reasoning benchmarks but not consistently
      - Precision separability holds on 3-4 benchmarks but one benchmark shows unexpected
        interaction (2-5%)
      - D-study budgets vary but the variation is partially attributable to benchmark
        design differences (item count, difficulty distribution) rather than task
        type

paper_key: "kunievsky2025intent"
title: "Measuring Intent Comprehension in LLMs: A Variance Decomposition Framework"
venue: "arXiv 2025"
full_text_available: false

research:
  baselines: [LLaMA models (multiple sizes), Gemma models (multiple sizes)]
  metrics:
    - {name: "intent variance share", direction: "higher_better"}
    - {name: "articulation variance share", direction: "lower_better"}
    - {name: "model uncertainty share", direction: "lower_better"}
  datasets:
    - {name: "diverse domains (unspecified)", size: "N/A"}
  ablation_dimensions: [model_size, model_family (LLaMA vs Gemma)]
  training_recipe: {optimizer: "N/A", lr: "N/A", hardware: "N/A"}
  method_family: "variance decomposition / intent measurement"

positioning:
  core_claim: "Variance decomposition of LLM responses into intent/articulation/model-uncertainty components reveals that larger models assign more variance to intent (better comprehension), but gains are uneven and modest"
  key_results: "Larger models assign greater share of variance to intent; gains uneven across domains"
  limitations:
    - "Limited to LLaMA and Gemma families"
    - "Full quantitative results not available from abstract"
  relation_to_us: "foundation"

narrative:
  story_type: "统一框架型"
  hook: "LLMs are trained on token prediction but users judge by intent match — this gap hasn't been formally measured"
  tension: "Accuracy benchmarks can't distinguish whether a model understands intent or is pattern-matching on surface form"
  key_insight: "Adapts variance decomposition to separate intent understanding from articulation sensitivity — directly measuring the gap between what users want and what models capture"
  argument_chain: "problem (intent vs text mismatch) → formal framework (3-component decomposition) → empirical measurement → scaling analysis"
  contribution_framing: "2 contributions: (1) formal variance decomposition framework for intent, (2) empirical finding that scale helps but unevenly"
  intro_structure: "N/A (abstract only)"
  notable_technique: "Frames the evaluation problem philosophically (intent vs text) before introducing mathematical framework"


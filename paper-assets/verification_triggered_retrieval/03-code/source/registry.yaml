    updated_at: '2026-05-17T10:11:25.005Z'
    hypothesis: mvp_001 在小 corpus (~2000 passages) 上无差异是因为 entity matching 主导导致两种
      query 返回相同文档（无 discriminative power）。在 full Wikipedia (~5M passages) 上，verification
      queries 应检索到更高 entailment 的 evidence（top-5 overlap rate < 60% 且 entailment diff
      > 0），因为大 corpus 中 query formulation 对 ranking 的影响不再被高覆盖率掩盖。
    parent: mvp_001
    spec:
      command: python /root/verification_triggered_retrieval/mvp_experiment_v2/run_pilot.py
      server: westd-46807
      data_path: /root/autodl-tmp/data/hotpotqa_dev_200.json (first 50)
      data_count: 50
      model_name: Qwen3-8B
      seed: 42
      corpus_type: wikipedia-nq (21M passages, BM25 only)
      models:
      - Qwen3-8B
      - DeBERTa-v3-large
      retriever: BM25 (Lucene, 19GB index)
      checkpoint_source: mvp_001 claims/queries reused
      eval_data: hotpotqa_dev_50 + wikipedia-nq-corpus (21M passages)

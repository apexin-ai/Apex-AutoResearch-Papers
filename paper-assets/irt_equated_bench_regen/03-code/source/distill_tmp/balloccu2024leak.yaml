paper_key: "balloccu2024leak"
title: "Leak, Cheat, Repeat: Data Contamination and Evaluation Malpractices in Closed-Source LLMs"
venue: "EACL 2024"
full_text_available: true

research:
  baselines: [N/A - this is a survey/systematic review]
  metrics:
    - {name: "percentage of papers leaking data", direction: "informational"}
    - {name: "total leaked samples", direction: "informational"}
    - {name: "leak severity classification", direction: "informational"}
  datasets:
    - {name: "255 papers systematic review", size: "212 relevant papers"}
    - {name: "263 unique contaminated benchmarks", size: "4.7M samples"}
  ablation_dimensions: [temporal (pre/post API release), leak severity (low/moderate/high), reproducibility factors, fairness factors]
  training_recipe: {optimizer: "N/A (systematic review)", lr: "N/A", hardware: "N/A"}
  method_family: "systematic review / meta-analysis"

positioning:
  core_claim: "~42%的GPT-3.5/GPT-4评估论文通过web interface泄露数据到模型训练中，涉及263个benchmark共4.7M样本——这是一种被忽视的'indirect data leaking'现象"
  key_results: "42% papers leaked via web interface; 263 datasets contaminated; 4.7M total samples; 53% high severity leaks; 91% reported prompts but only 53% provided code"
  limitations:
    - "Contaminated dataset list not fully conclusive"
    - "Some experiments may have leaked data without publication"
    - "API data policies changed over time"
  relation_to_us: "foundation"

narrative:
  story_type: "突破局限型"
  hook: "Popular LLMs隐藏在API后，其细节未知，这对评估可信度提出了根本质疑"
  tension: "用户通过web interface评估模型时，不知不觉地将benchmark数据泄露到模型训练中"
  key_insight: "在Section 5.1揭示'indirect data leaking'概念：通过ChatGPT web interface交互的评估数据可被用于进一步训练模型"
  argument_chain: "closed-source opacity → systematic review protocol → data leaking quantification → reproducibility audit → fairness audit → best practices"
  contribution_framing: "4条贡献：systematic analysis → leaked data estimation → evaluation malpractices documentation → best practices"
  intro_structure: "3段：closed-source问题 → indirect leaking概念 → 本文贡献"
  notable_technique: "借用医学领域systematic review protocol（5个macro-steps），给CS论文分析赋予方法论严谨性"


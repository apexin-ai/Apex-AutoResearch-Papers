positioning:
  core_claim: "通过使用来自最新信息源的频繁更新题目 + 客观自动评分（无LLM judge），同时解决contamination和评估偏见两个问题"
  key_results: "Top models score below 70% accuracy; covers 0.5B to 405B parameter range"
  limitations:
    - "需要持续人工维护和更新题目"
    - "题目来源限制了某些task的覆盖范围"
  relation_to_us: "competitor"


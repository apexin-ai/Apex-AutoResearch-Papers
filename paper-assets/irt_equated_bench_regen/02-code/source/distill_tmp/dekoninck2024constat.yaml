paper_key: "dekoninck2024constat"
title: "ConStat: Performance-Based Contamination Detection in Large Language Models"
venue: "NeurIPS 2024"
full_text_available: true

research:
  baselines: [n-gram overlap, perplexity-based detection, ChatGPT-Cheat?, Min-K%]
  metrics:
    - {name: "detection rate (%)", direction: "higher_better"}
    - {name: "estimated effect δ̂ (%)", direction: "informational"}
    - {name: "p-value", direction: "lower_better"}
    - {name: "r² (quantification accuracy)", direction: "higher_better"}
  datasets:
    - {name: "GSM8k", size: "2000 samples (capped)"}
    - {name: "ARC-Challenge", size: "2000 samples"}
    - {name: "MMLU", size: "2000 samples"}
    - {name: "Hellaswag", size: "2000 samples"}
  ablation_dimensions: [contamination type (syntax/sample/benchmark), reference model selection, distribution shape, noise level, bootstrapping strategy]
  training_recipe: {optimizer: "N/A (detection method)", lr: "N/A", hardware: "LM Evaluation Harness, 5-shot"}
  method_family: "performance-based statistical testing"

positioning:
  core_claim: "Contamination should be defined by its effect on performance (non-generalizing inflation), not by information flow — enabling robust detection via statistical comparison against reference models and benchmarks"
  key_results: "Detection: 89.1% syntax-specific, 98.4% sample-specific; Quantification: r²=0.94; Found contamination in Mistral-7b (GSM8k δ̂=8.2%), Llama-3-70b (ARC δ̂=6.6%), Phi-2 (GSM8k δ̂=36.4%)"
  limitations:
    - "Measures contamination relative to reference models; if they're also contaminated, only relative effects detected"
    - "Synthetic reference samples generated by LLMs may introduce distributional biases"
  relation_to_us: "foundation"

narrative:
  story_type: "突破局限型"
  hook: "现有contamination定义基于信息流（训练数据中是否包含benchmark），但这既难验证又容易规避"
  tension: "传统检测方法需要访问训练数据或做严格假设，检测率有限且无法量化contamination的实际影响"
  key_insight: "在Section 2正式定义处揭示：将contamination重新定义为'人工膨胀的、不可泛化的benchmark表现'，通过与reference benchmark的性能比较来检测"
  argument_chain: "problem (contamination undermines evaluation) → redefinition (effect-based) → method (statistical test with reference models + benchmarks) → validation (synthetic contamination r²=0.94) → real-world findings (popular models contaminated)"
  contribution_framing: "4条贡献：新定义 → 统计检验方法 → 合成验证 → 实际模型检测。措辞强调'principled'和'robust'"
  intro_structure: "5段：现状问题 → 本文新视角 → 传统方法局限 → 本文方法概述(含Figure 1引用) → 评估总结与贡献列表"
  notable_technique: "用一个具体数字例子（M₁: 60% ref → expected 37% orig → actual 72% → δ=35%）在intro中直观展示方法，读者无需看正文就能理解核心思想"

figures:
  figure_count: 2
  figure1:
    type: "method_overview"
    description: "ConStat四步流程图：定义问题 → 选择reference models和benchmarks → 拟合hardness correction → 提取结果（含δ和p值）"
    narrative_role: "在intro中作为方法的直观展示，让读者一图理解整个pipeline"
    design_elements: ["四步分栏布局", "数字标注（具体百分比）", "对比展示contaminated vs clean model"]
    visual_style: "横向流程图，每步一个面板，用颜色区分contaminated(红)和clean(绿)结果"
  result_figures:
    - figure_id: "Figure 2"
      viz_type: "scatter"
      what_compared: "预测的δ̂ vs 真实δ，附2-sigma置信区间"
      how_gain_highlighted: "强线性关系r²=0.94突出方法的量化准确性"
      design_note: "scatter plot + error bars + r²标注，简洁有效展示回归精度"
  ablation_figures: []
  figure_narrative_role: "Figure 1 (intro方法概览) → Figure 2 (量化验证) → Tables承担主要结果展示"

tables:
  table_count: 2
  main_result_table:
    table_id: "Table 1"
    row_axis: "methods"
    col_axis: "contamination types (syntax-specific, sample-specific)"
    row_organization: "by_category"
    col_organization: "grouped_by_metric"
    highlight_strategy: "bold_best"
    statistical_reporting: "detection rate percentage"
    num_baselines: 4
    design_note: "简洁对比表，用星号标注需要oracle access的baseline，突出ConStat不需要额外信息的优势"
  ablation_tables:
    - table_id: "Table 2"
      what_varied: ["models", "benchmarks", "contamination types"]
      variation_style: "full_numbers"
      design_note: "大表展示所有reference model的contamination检测结果，按contamination type分组(S/B)，含performance/p-value/δ̂/95% lower bound四列"
  supplementary_tables:
    in_appendix: true
    content: "模拟实验ablation（不同分布、非线性、噪声、bootstrap策略）"
    reason: "模拟验证属于方法鲁棒性验证，主表聚焦真实模型检测结果"

mistakes:
- id: M001
  date: '2026-05-31'
  category: agent_behavior
  severity: high
  summary: Agent/registry marked MVP experiment DONE(negative) without reproducibility
    spec or verifiable run evidence
  root_cause: QUEUED experiment was allowed to proceed from a generic approval path
    while required spec gate was still pending; registry status changed before command/server/path/seed/output/log
    evidence existed.
  prevention: For MVP experiments, add an explicit active constraint blocking QUEUED->RUNNING/DONE
    until spec is written to registry or experiment_specs, and cancel generic approval
    queue messages that can bypass the Director's gated instruction.
  status: active
  context: mvp_ec_hte_semisynth_001 was intended as CPU-first and gated pending spec.
    Reviewer warned registry only had hypothesis/notes. Current overview shows DONE(negative),
    but no RUNNING record, no reproducibility spec, no output/log path, and remote
    code path was known missing.
  fix: Treat current DONE(negative) as invalid/unverified; do not use it for MVP PASS/FAIL.
    Re-gate execution and require a fresh spec-backed run.
- id: M002
  date: '2026-05-31'
  category: communication
  severity: medium
  summary: Director temporarily invalidated a valid negative MVP result before waiting
    for Reviewer/Agent evidence recovery
  root_cause: I reacted to an incomplete registry/report snapshot that lacked visible
    spec fields and did not wait for the subsequent Reviewer audit showing command,
    log_path, output_path, and metrics consistency.
  prevention: When registry status and visible report disagree, first request/review
    evidence recovery from Agent/Reviewer before marking a result invalid; use temporary
    'pending audit' wording instead of 'invalid' unless evidence is demonstrably absent.
  status: active
  context: mvp_ec_hte_semisynth_001 was marked invalid under C003, but Reviewer later
    confirmed command, CPU-only log, output paths, results.json, summary.csv, and
    registry metrics were consistent. C003 was removed and C004 preserves the verified
    negative result.
  fix: Removed C003, added C004 to preserve verified negative result, updated project_path
    to /root/ec_hte, and will update ROADMAP/report/findings to reflect the accepted
    negative result.
- id: M003
  date: '2026-05-31'
  category: communication
  severity: medium
  summary: Agent handover overwrote report.md with GPU-waiting wording after CPU-only
    release
  root_cause: The automatic handover/report generation path did not honor active constraint
    C007 and reused generic scheduling language, marking CPU-only released diagnostics
    as waiting for GPU and omitting the known GPU util anomaly.
  prevention: When generating status reports for CPU-only experiments, derive resource
    wording from registry spec/device fields and active constraints, not generic GPU
    queue templates; never write 'waiting for GPU' unless the experiment actually
    requires GPU allocation.
  status: active
  context: After Reviewer C008 release, registry showed stress_global_worse_region_001
    RUNNING and oracle/stability QUEUED as CPU-only, but report.md was overwritten
    with '排队等待 GPU', '空闲 cuda:0', and '告警无'. Director repaired report.md and ROADMAP.md.
  fix: Rewrote report.md to state CPU-only RUNNING/QUEUED status, restored GPU anomaly
    warning, and synchronized ROADMAP with current registry state.
- id: M004
  date: '2026-05-31'
  category: agent_behavior
  severity: high
  summary: Agent 登记 smoke 时覆盖了 variance_propagation_ci_real_001 的 D017/C012 设计门槛
  root_cause: 在 registry 更新 smoke_readiness 时未保持 spec 中已审核的 pass_fail 与 smoke_plan.required_diagnostics
    不变，导致最小 calibration improvement、width-adjusted 判据和 delta/bootstrap 必需诊断被简化丢失。
  prevention: 后续登记实验 smoke/formal 结果时只追加结果字段，不覆盖已审批/已审计的 spec/gate/constraints；涉及
    formal release 防线的字段必须先 diff 再写。
  status: active
  context: 'Reviewer critical: current registry updated_at 2026-05-31T17:18:11.998Z;
    smoke 已产生 9 个文件，但 spec.pass_fail 回退为简化版，smoke_plan.required_diagnostics 缺失。'
  fix: 已手动恢复 registry 中 D017/C012 完整 pass_fail 与 smoke_plan.required_diagnostics，并将
    ROADMAP/report 更新为 smoke 已产出、待 Reviewer 文件级审计。

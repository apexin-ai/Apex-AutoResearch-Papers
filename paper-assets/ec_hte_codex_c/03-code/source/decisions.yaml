  rationale: mvp_ec_hte_semisynth_001 已核实为 negative，但不代表方向失败。按方法改进框架与 Reviewer 建议，需要并行诊断失败原因：DGP/实现是否正确注入
    CATE bias、是否存在更强 stress 区域、oracle 上界是否显示预算/估计瓶颈、100 reps 单 seed 是否稳定。四个 proposal
    均有 parent、spec、CPU-only、输出路径和 pass/fail，且不覆盖原负向结果。
  related_experiments:
  - exp_id: mvp_ec_hte_semisynth_001
    role: parent
    result: verified_negative
  - exp_id: diag_dgp_bias_audit_001
    role: diagnostic

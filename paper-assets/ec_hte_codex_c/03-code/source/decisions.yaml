decisions:
- id: D001
  date: 2026-05-31 15:38 UTC
  summary: 批准 CPU-first MVP semi-synthetic EC-HTE 实验设计，暂不分配 GPU
  rationale: 实验直接验证 MVP 核心假设：在误分类率与 CATE 异质性正相关时 global correction 可能劣于 uncorrected，而
    subgroup/EC-HTE-lite 应改善 PEHE/GATE bias 或 coverage。方案包含 worst-case 与 sanity 场景、明确
    pass/fail、预计 CPU 10-30 分钟；当前远程代码根目录缺失且 GPU util 异常，因此先批准设计但不进行 GPU 分配。
  related_experiments:
  - exp_id: mvp_ec_hte_semisynth_001
    role: mvp_validation
    result: approved_pending_cpu_first_execution
  depends_on: []
- id: D002
  date: 2026-05-31 15:46 UTC
  summary: 接受 mvp_ec_hte_semisynth_001 为已核实 negative，转入 stress/oracle/seed 诊断扩展
  rationale: Reviewer 核实 registry metrics 与远程 results.json/summary.csv 一致，命令为 CPU-only，未使用
    GPU，且主结果使用 B=500 expert sample 估计 confusion matrix。实验未达 MVP pass criteria：positive_worst_case
    中 global correction 未劣于 uncorrected，subgroup 相对 global PEHE 改善仅 5.7%，低于 20%；因此不能
    complete_mvp，也不能写“global correction worsens”或“EC-HTE-lite 验证成功”。下一步按方法改进框架做 DGP/实现诊断、stress
    test、oracle upper-bound、seed/reps 稳定性。
  related_experiments:
  - exp_id: mvp_ec_hte_semisynth_001
    role: mvp_validation
    result: verified_negative
  depends_on:
  - D001
- id: D003

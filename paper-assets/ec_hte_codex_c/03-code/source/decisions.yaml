  - exp_id: stress_global_worse_region_001
    role: stress_test
    result: approved
  - exp_id: oracle_confusion_upper_bound_001
    role: oracle_upper_bound
    result: approved
  - exp_id: stability_seed_reps_001
    role: stability
    result: approved
  depends_on:

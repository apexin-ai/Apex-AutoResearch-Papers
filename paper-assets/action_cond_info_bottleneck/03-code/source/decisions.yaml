- id: D022
  date: 2026-05-16 03:00 UTC
  summary: LIBERO-Plus 是模型非扰动 suite；MVP 标准重定义为标准 SR 对比 + scorer 分化验证
  rationale: Worker 确认 LIBERO 无内置视觉扰动评测，"smolvla_libero_plus" 是 mix-SFT 预训练模型而非扰动
    suite。原 MVP pass/fail 标准（≥2/4 扰动维度提升 ≥5%）不可执行。重定义 MVP 为两阶段：(1) 训练验证（已通过）：scorer_std
    > 0.1 持续到 β 全量——v5_div_reg std=0.43 已满足；(2) 功能验证：标准 LIBERO 4 suites SR 对比（ACIB
    vs std baseline），ACIB 不回退 >2% 且 scorer token importance 可视化显示 task-relevant pattern。扰动鲁棒性评测（observation-space
    perturbation wrapper）作为 post-MVP 必做项，由 Worker 并行开发。
  related_experiments:
  - exp_id: acib_v5_div_reg
    role: primary
    result: scorer_std=0.43 stable, training validation passed
  depends_on:
  - D021

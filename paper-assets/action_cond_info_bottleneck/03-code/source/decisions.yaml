- id: D021
  date: 2026-05-16 02:12 UTC
  summary: v5_stopgrad_entropy 失败（p→0 collapse），kill 释放 GPU；v5_div_reg 确认为唯一正向版本
  rationale: 并行对比 step 500：v5_stopgrad_entropy scorer_mean=0.016（全 token 关闭），task_loss
    高 5-8x，entropy reg + stop-grad 组合 degenerate（H(p) 在 p=0 最小，无 task 信号约束 optimizer
    选了 trivial 解）。v5_div_reg scorer_std=0.379→0.424 持续上升，task_loss 正常。结论：task gradient
    是维持 scorer 有意义性的关键，不能切断；diversity reg (-λ*std) 是有效 anti-collapse 机制。Kill v5_stopgrad_entropy，step
    500 数据保留作 ablation negative control。cuda:1 释放给 baseline eval 和后续实验。
  related_experiments:
  - exp_id: acib_v5_stopgrad_entropy
    role: negative_control
    result: step 500 scorer_mean=0.016, p→0 collapse, task_loss 5-8x
  - exp_id: acib_v5_div_reg
    role: primary

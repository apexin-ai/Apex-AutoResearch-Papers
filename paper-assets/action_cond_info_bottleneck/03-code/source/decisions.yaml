decisions:
- id: D001
  date: 2026-05-15 11:10 UTC
  summary: MVP 方案确定：SmolVLA baseline + ACIB-S 验证，pass 标准 ≥5% abs on ≥2/4 perturbation
    dims
  rationale: CoRL DDL 极紧（14天），需最小化验证路径。SmolVLA baseline 建立 gap → ACIB-S 验证核心假设。选 ACIB-S（soft
    mode）作为 MVP 而非 ACIB-H，因为 soft mode 在 64-token 紧凑空间更安全，避免 hard pruning 信息损失风险。Pass
    标准 5% abs 基于 LIBERO-Plus 论文中方法间的典型差异幅度。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-15 11:12 UTC
  summary: 采纳 Reviewer 3 项 MVP 标准修正：低 baseline 相对阈值、≥2 seeds、单维度 >10% 回退即 fail
  rationale: Reviewer 指出 CRT 论文显示 SmolVLA 在 sensor corruption 下可跌至 0-16%，此时 5% abs
    阈值不可靠。补充相对阈值 + 多 seed 一致性要求。补充单维度大幅回退的 kill condition 防止"提升 A 伤害 B"的假阳性。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-15 11:20 UTC
  summary: 修正 IDEA_BRIEF PixelShuffle 因子：实际 factor=4 (16× 缩减, 64×64 px/token)，非 factor=3
    (9×, 50×50)
  rationale: Reviewer 核实 SmolVLA 架构：SigLIP 512×512, patch_size=16 → 1024 tokens, PixelShuffle
    factor=4 → 64 tokens (960-dim)。IDEA_BRIEF 写的 3×3/9×/50×50 均有误。64 tokens 数量正确。纠正方向强化论点：每
    token 64×64 px 比 50×50 更大，hard pruning 风险更高。论文写作时须用正确数字。
  related_experiments: []
  depends_on:
  - D001
- id: D004
  date: 2026-05-15 14:51 UTC
  summary: MVP 流程增加 SmolVLA-LIBERO fine-tuning 步骤；GPU split 改为 spatial+long / object+goal；baseline
    1 seed 够用
  rationale: Reviewer 发现 smolvla_base 是通用预训练 checkpoint，未含 LIBERO 数据，直接 eval SR≈0%，无法衡量鲁棒性
    gap。必须先 fine-tune（~20K steps, ~4-6h GPU）再评测。GPU split 按 episode 长度重新均衡。Baseline
    eval 无训练随机性，1 seed + 50 ep/task 足够（SE≈1.6-2.2%）。
  related_experiments: []
  depends_on:
  - D002
- id: D005
  date: 2026-05-15 14:56 UTC
  summary: 使用官方 HuggingFaceVLA/smolvla_libero checkpoint 作为 baseline，跳过 MVP-0 fine-tuning
  rationale: Agent 搜索发现 HuggingFace 官方已有 SmolVLA-LIBERO fine-tuned checkpoint (HuggingFaceVLA/smolvla_libero)，公布性能
    spatial 90%/object 96%/goal 92%/long 71%/avg ~87%。直接使用省去 4-6h fine-tuning，并提供交叉验证参考值。如果复现不匹配再
    fallback 自己 fine-tune（脚本已备好）。
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-15 15:37 UTC
  summary: smolvla_libero_plus 升级为 mandatory baseline；论文 framing 转向"ACIB 是 data-aug
    的互补正则化方法"
  rationale: Reviewer 分析：smolvla_libero_plus 是纯 data-aug 方法（mix-SFT），审稿人 100% 会要求此对比。ACIB
    最强差异化路径是互补性——在 data-aug 之上仍有增益。Story 从"ACIB 提升鲁棒性"转为"ACIB 是 data-aug 正交的 IB-grounded
    训练正则化 + 可解释性 + 64-token regime 分析"。MVS 必须包含 smolvla_libero_plus baseline + ACIB
    on top of libero_plus 互补性验证。
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-05-15 17:00 UTC
  summary: ACIB v1 训练结果作废（scorer collapse）；β 从 0.1 降至 0.01 + 加 warmup 1000 步；纠正训练流程回到
    ROADMAP 顺序
  rationale: Reviewer 发现 β=0.1 KL 在 step 250 后导致 posterior collapse（所有 token 权重≈0.8,
    sparsity=0），scorer 做了 nothing。同时 Worker 偏离 ROADMAP：跳过 baseline eval、用错 checkpoint
    (smolvla_base)、数据不完整 (29 ep vs 500+)。修复：β_target 降到 0.01 + 前 1000 步 warmup β=0；严格按
    ROADMAP 先跑 baseline eval 再训练 ACIB。
  related_experiments: []
  depends_on:
  - D005
  - D006

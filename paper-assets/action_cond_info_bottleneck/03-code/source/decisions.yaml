  summary: 放弃两阶段训练方案（会退回 v7.1 global bias），优先 λ_drift sweep (0.5/1.0/2.0) + contrastive
    gradient scaling。等 connector-only ablation 结果后确认方向
  rationale: Reviewer 分析：两阶段方案的 Stage 2 在 frozen features 上训练 scorer 拓扑等价于 v7.1（features
    不支持 cross-task discrimination），必然退化为 global bias。v7.2 的 spatial conditioning 来自
    contrastive 梯度改变 connector，两阶段方案放弃这一机制。核心问题是 Goldilocks：connector 改变量太大则 α=0.0
    regression，太小则无 spatial conditioning。λ_drift 直接控制这个 tradeoff，sweep 可找到 sweet spot。但须先确认
    connector-only ablation：如果纯 task loss 也导致 regression，则 connector 本身不可 fine-tune，需要完全不同的思路。
  related_experiments:
  - exp_id: acib_v72_connector_scorer_seed1
    role: evidence
    result: spatial -5pp, drift reg λ=0.1 insufficient
  depends_on:
  - D046
- id: D048
  date: 2026-05-17 16:39 UTC
  summary: 诊断确认：无 eval bug。SmolVLA action expert 对 connector 极度敏感（0.4% shift → -6.6pp）。connector-only
    ablation 成为判定 connector 是否可 fine-tune 的决定性实验
  rationale: 三项验证全 PASS：action expert 权重 bit-identical，hook 路径正确，output 无放大。0.4% connector
    weight shift 线性传播到 0.4% output shift（cos=0.99999），但造成 -6.6pp regression。这说明 action
    expert 对 connector 输出分布的敏感度极高，可能是 compact VLA 的固有特性。λ_drift sweep 可能无效（connector
    已几乎不动）。connector-only ablation 是唯一能区分"contrastive gradient 方向有害" vs "任何 connector
    修改都有害"的实验。
  related_experiments:
  - exp_id: acib_v72_connector_scorer_seed1
    role: primary
    result: connector drift=0.4%, spatial SR=-6.6pp, no eval bug confirmed
  depends_on:
  - D047
- id: D049
  date: 2026-05-17 16:40 UTC
  summary: 采纳 Connector LoRA 方案（v7.3）替代 λ_drift sweep。LoRA 提供精确 baseline 保证（α=0.0
    不合并 = exact original），结构性解决 gradient pollution。降级 λ_drift 为 fallback
  rationale: v7.2 根本矛盾：connector 需要改变才能实现 spatial conditioning，但 0.4% shift 就造成 -6.6pp
    regression。LoRA 通过结构隔离解决：训练时 LoRA+scorer 学习 task-discriminative features，推理时 α=0.0
    不合并 LoRA = 数学上等价于原始 baseline。无 Goldilocks 问题（rank 选择容错大），参数量从 11.9M 降到 ~150-200K，两个独立
    control knobs（LoRA scale + scoring α）。Reviewer 评估为"严格优于 λ_drift sweep"。
  related_experiments:
  - exp_id: acib_v72_connector_scorer_seed1
    role: motivation
    result: 0.4% drift → -6.6pp, demonstrating need for structural isolation
  depends_on:
  - D048
- id: D050
  date: 2026-05-17 18:40 UTC
  summary: 论文呈现策略：正文 3 核心 constraint (v7/v7.1/v7.2)，v1-v6 工程迭代放 Appendix；MVP 判定 4-suite
    avg 为主，per-suite >5pp 回退为硬红线
  rationale: Reviewer 系统性复盘 10 个阴性结果：A 类(v1/v3/v4/v5)是 IB loss 工程迭代，B 类(v5_bug/v6/v7_plain)是
    shortcut learning，C 类(v7/v7.1/v7.2)才是核心 constraint 发现。正文呈现 3 个 constraint + 3
    个关键实验，避免"10 negatives + 1 positive"的 overfitting 攻击面。v7.3 的 α=0.0=baseline 是结构性保证（非调参结果），大幅降低
    overfitting 质疑。MVP 判定以 4-suite avg ≥ baseline-2pp 为 gate，但任何 suite >5pp 回退即使 avg
    达标也标 warning 需解释。v7.3 增量 <1pp 时退守 "preserves + interpretability" claim。
  related_experiments:
  - exp_id: acib_v72_eval_alpha00
    role: evidence
    result: spatial -6.6pp, object -2.2pp
  - exp_id: acib_v72_eval_alpha10
    role: evidence
    result: spatial -5.0pp, object -1.6pp
  depends_on:
  - D046
  - D049
- id: D051
  date: 2026-05-17 19:22 UTC
  summary: Connector drift 效果是 suite-dependent 的：spatial -6.6pp, object -2.2pp, goal
    +2.2pp。C5 从"destroys"弱化为"redistributes performance"。v7.3 LoRA 的价值从"prevent destruction"转为"provide
    exact baseline + isolate pure scoring effect"
  rationale: v7.2 goal suite 数据颠覆了 C5 原始 claim。0.4% connector drift 在 spatial 上损伤严重但在
    goal 上反而有益，说明 drift 重塑了 representation space 的 task 偏好。v7.3 LoRA 仍然必要：(1) α=0.0
    sanity check 在 v7.2 上 FAIL（3-suite avg -2.2pp，超出 ±1pp 容忍度），需要 exact baseline 消除
    drift confound；(2) 当前 scorer 增量 +0.53pp 在 500-ep SE 范围内无统计显著性，需要干净的 α=0.0 baseline
    才能判断 scoring 的真实效果。v7.2 MVP 判定等 libero_10 数据，但 sanity check 已 FAIL。
  related_experiments:
  - exp_id: acib_v72_eval_alpha00
    role: evidence
    result: spatial 59.4%, object 65.6%, goal 78.6%
  - exp_id: acib_v72_eval_alpha10
    role: evidence
    result: spatial 61.0%, object 66.2%, goal 78.0%
  depends_on:
  - D049
  - D050
- id: D052
  date: 2026-05-17 19:57 UTC
  summary: '采纳 Direction C (Hybrid): LoRA method + constraint discovery analysis。Goal
    +2.2pp 不显著(p≈0.20)，不可作为 claim。Suite 特异性仅作 observation，不作 contribution'
  rationale: Reviewer 统计检验：500 eps binomial SE 下，只有 spatial -6.6pp 显著(p≈0.015)，object
    -2.2pp(p≈0.23)和 goal +2.2pp(p≈0.20)均在噪声范围内。Direction C 对 v7.3 结果最 robust：v7.3
    positive→method 为主/analysis 为辅；v7.3 neutral→analysis 为主/method 为辅；v7.3 negative→constraint
    analysis paper。10 negatives 在 constraint discovery 叙事下最自然。Suite variation 放 observation
    段落不做 claim，避免统计检验攻击。
  related_experiments:
  - exp_id: acib_v72_eval_alpha00
    role: evidence
    result: spatial -6.6pp (p<0.05), object -2.2pp (NS), goal +2.2pp (NS)
  - exp_id: acib_v72_eval_alpha10
    role: evidence
    result: spatial -5.0pp, object -1.6pp, goal +1.6pp
  depends_on:
  - D051
- id: D053
  date: 2026-05-17 22:50 UTC
  summary: v7.2 MVP 最终判定：FAIL（α=0.0 avg -4.85pp, α=1.0 avg -3.7pp）。但 scorer 信号一致正向(+1.15pp
    avg)，且与任务难度正相关(libero_10 +3.0pp)。v7.3 LoRA 训练已启动，预计 ~01:50 UTC 完成
  rationale: v7.2 4-suite 最终数据：libero_10 是受损最严重的 suite（α=0.0 -12.8pp），验证了 connector
    drift 与任务 horizon/难度正相关。但 scorer 增量（α=1.0 vs α=0.0）呈相反模式：越难的任务 scorer 收益越大（libero_10
    +3.0pp, spatial +1.6pp, object +0.6pp）。这意味着 v7.3 消除 drift 后，scorer 的真实收益可能被释放——尤其在长
    horizon 任务上。v7.3 训练已在两张 GPU 上启动（LoRA cuda:0, connector-only cuda:1），代码经 Reviewer
    审查 PASS。
  related_experiments:
  - exp_id: acib_v72_eval_alpha00
    role: evidence
    result: 4-suite avg 61.25%, FAIL
  - exp_id: acib_v72_eval_alpha10
    role: evidence
    result: 4-suite avg 62.40%, FAIL
  depends_on:
  - D051
  - D052
- id: D054
  date: 2026-05-18 02:24 UTC
  summary: 'v7.3 Probe A: Conditional Pass。严格标准未达(1/3 pairs <0.8)，但 Probe B 全通过(3/3
    <0.8)，proceed to eval'
  rationale: Probe A 严格标准要求 2/3 pairs cos<0.8，v7.3 仅 1/3 通过 [0.765, 0.864, 0.939]。但三个缓解因素支持继续：(1)
    Probe B（不同图+不同指令）全部 <0.8 [0.562, 0.603, 0.728]，task-dependent importance maps
    确实存在；(2) cos=0.939 的 pair 3 语义高度相似（同目标物仅位置不同），高 cos 可能合理；(3) LoRA rank=8 仅 228K
    参数 vs v7.2 11.8M，conditioning 弱于 full-FT 是预期的 capacity 限制。真正的 MVP gate 是 α=0.0
    baseline recovery + α=1.0 性能。Probe 是 sanity check，不应替代 eval 判定。论文 C6 claim 需从"spatial
    conditioning confirmed"调整为"task-dependent conditioning present (Probe B), weaker
    than full-FT (Probe A) due to LoRA capacity"——这恰好是 Direction C trade-off story
    的核心：用 conditioning strength 换 exact baseline recovery。
  related_experiments:
  - exp_id: acib_v73_connector_lora
    role: primary
    result: 'Probe A conditional pass: 1/3 <0.8, Probe B 3/3 <0.8'
  depends_on:
  - D052
  - D049

  summary: v7 contrastive loss 证伪 shortcut learning，启动 v8 FiLM conditioning 架构
  rationale: v7 contrastive loss（含 log-barrier 变体）500 步 sweep 确认 ctr_loss 恒等于 1.0，lambda=0.1

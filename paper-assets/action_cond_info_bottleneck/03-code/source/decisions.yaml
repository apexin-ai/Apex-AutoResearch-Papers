    梯度均匀），无需跑到 step 2000 浪费 GPU。kill v4 释放 cuda:0 给 v5。'
  related_experiments:
  - exp_id: acib_v4_agg_kl
    role: killed
    result: aggregate KL 结构性缺陷已证明，无需更多数据
  - exp_id: acib_v5_stopgrad_entropy

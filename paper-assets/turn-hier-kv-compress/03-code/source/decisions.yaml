_next_id: 9
decisions:
- id: D001
  date: 2026-05-13 09:01 UTC
  summary: 'MVP 方案: Llama-3.1-8B + 合成 agent traces + TurnKV vs Uniform EA 对比，70% 压缩率'
  rationale: '核心假设是 role-aware segment budgets 优于 uniform compression。用最小成本验证: 单模型(8B)、合成数据(可控植入关键信息)、单压缩率(70%)、两个指标(关键信息保留率
    + perplexity)。合成数据比真实 benchmark 更快迭代且 pass/fail 判据更清晰。'
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-13 09:03 UTC
  summary: '采纳 Reviewer 5 条 warning，修正 MVP gate: 差值驱动 pass(≥10pp)、kill criteria(<5pp
    at both rates)、ppl ≤1.02x、双压缩率(70%+85%)、adversarial 合成数据'
  rationale: Reviewer 指出原 pass criteria 对 baseline 做了未验证假设（Uniform ≤85%），若 EA 本身表现好则
    gate 不可证伪。差值驱动更科学。Kill criteria 防止 fail 后无限调参。85% 压缩率点可能放大 role-aware 优势。Adversarial
    cases（关键信息在低 B_prior 段）防止合成数据自证。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-13 09:14 UTC
  summary: '修复 EASS recency 双重计算: 去掉连续衰减因子，仅用 B_prior 桶编码 recency'
  rationale: B_prior 已分 recent/older 桶（如 THINKING_TRACE recent=0.4, older=0.15），再乘
    0.85^distance 导致旧段预算被压到 0.067，EASS 的 β modulation 无法将其救回合理水平。这会让 adversarial MVP
    测试因公式缺陷而非方法缺陷 fail，导致错误 kill 决策。去掉连续衰减，严格匹配 IDEA_BRIEF 公式。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-13 10:54 UTC
  summary: 暂缓 KILL 决定：MVP 实验数据不可信（PPL 评估失效 + 10/80 traces + 可能实现 bug），需修复后重跑
  rationale: PPL ratio 恒为 1.0 是评估代码 bug（单次 forward 下压缩不影响 logits），非真实指标。KIRR 负差值（-4.5pp）可能是实现
    bug（role_extractor 解析错误、segment 边界偏移、attention_mask 未设置影响 EA scores）而非方法学失败。仅
    10 条 trace 统计效力不足。需先诊断根因再判断。
  related_experiments:
  - exp_id: mvp_eval_01_cr70
    role: evidence
    result: KIRR diff -4.5pp, PPL invalid
  - exp_id: mvp_eval_01_cr85
    role: evidence
    result: KIRR diff -4.6pp, PPL invalid
  depends_on:
  - D002
- id: D005
  date: 2026-05-13 11:15 UTC
  summary: EASS budget 归一化：B_final 除以 token-weighted 均值，从绝对压制变为相对重分配
  rationale: 诊断发现乘法调制 modulated_score = ea_score × B_final 在 B_final < 1.0 时系统性销毁
    token 分数（TOOL_RESULT 40-60% 销毁，THINKING_TRACE 63-70% 销毁），导致 TurnKV KIRR 比 Uniform
    EA 更差。归一化后 B_final 均值为 1.0，高预算段 >1.0 低预算段 <1.0，总量守恒，结构先验变为相对权重而非绝对压制。
  related_experiments:
  - exp_id: mvp_eval_01_cr70
    role: evidence
    result: KIRR diff -4.5pp, TOOL_RESULT retention 17%→0%
  - exp_id: mvp_eval_01_cr85
    role: evidence
    result: KIRR diff -4.6pp, same pattern
  depends_on:
  - D004
- id: D006
  date: 2026-05-13 11:58 UTC
  summary: 条件性继续：给 24h 做最终 MVP 验证（修复评估 + 温和调制），仍负向则 KILL。放弃 EMNLP 2026。
  rationale: v2 KILL 条件技术上已满足（KIRR diff < 5pp），但评估本身无区分力（full KIRR 14.4%，~86% 测试项模型本身答不对）。PPL
    爆炸 (1.74×) 是真信号，说明当前 B_prior 范围 (0.15-1.0) 过于 aggressive。核心假设未被有效检验。最终一轮：(1) 修复
    traces 确保 full KIRR ≥ 80%，(2) 收窄 B_prior 到 0.5-1.0 做温和调制，(3) 加纯 structural prior
    baseline 隔离角色预算的独立价值。若仍无正向信号则 definitive KILL。EMNLP 2026 时间已不现实，降级到 AAAI 2027。
  related_experiments:
  - exp_id: mvp_eval_02_cr70
    role: evidence
    result: KIRR diff +1.7pp, PPL ratio 1.74, full KIRR 14.4%
  - exp_id: mvp_eval_02_cr85
    role: evidence
    result: KIRR diff +0.1pp, PPL ratio 2.36, full KIRR 14.4%
  depends_on:
  - D005
  - D004
- id: D007
  date: 2026-05-13 11:59 UTC
  summary: 'Pivot to additive offset: final_score = ea_score + α × structural_offset，替代失败的乘法调制'
  rationale: 乘法调制 (modulated = ea × B_final) 扭曲 EA 全局排序导致 PPL 爆炸 1.74×-2.36×。加法偏置保留
    EA base ranking，结构先验仅做边界 tie-breaking，从机制上避免 PPL 恶化。这是 D006 24h 时间框内的最终方案，仍负向则
    definitive KILL。
  related_experiments:
  - exp_id: mvp_eval_02_cr70
    role: evidence
    result: 乘法调制 PPL 1.74×, KIRR +1.7pp
  - exp_id: mvp_eval_02_cr85
    role: evidence
    result: 乘法调制 PPL 2.36×, KIRR +0.1pp
  depends_on:
  - D006
- id: D008
  date: 2026-05-13 17:23 UTC
  summary: DEFINITIVE KILL：4 轮实验一致 negative，Pure Structural 0% KIRR 证伪核心假设（role labels
    ≠ token importance）
  rationale: v3b 最终验证（65 条 agent traces, full KIRR=100%, additive bias α=0.1）：TurnKV
    KIRR 35.8% vs Uniform EA 40.3%（-4.5pp），Pure Structural 0% KIRR。Pure Structural
    的零分意味着 role labels（SYSTEM/USER/TOOL_RESULT/THINKING）对 token-level 信息重要性完全没有预测力。4
    轮迭代（乘法→归一化→加法偏置）排除了实现和评估 confound，结论一致：role-based structural prior 对 KV cache
    compression 零价值甚至有害。D006 kill criteria 触发。
  related_experiments:
  - exp_id: mvp_v3b_cr85
    role: decisive
    result: TurnKV KIRR 35.8% vs EA 40.3% (-4.5pp), Pure Structural 0%, PPL ratio
      1.035
  - exp_id: mvp_v3b_cr70
    role: supporting
    result: 'MVP Verdict: KILL'
  depends_on:
  - D007
  - D006

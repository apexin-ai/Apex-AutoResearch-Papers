  fix: Kill PID 50690, 改 SEED_MAP clean_s2=123, 重启训练。浪费 ~7 min GPU。
- id: M010
  date: '2026-05-21'
  category: resource_misuse
  severity: high
  summary: exp-post-rl SFT→GRPO pipeline 断裂 + Mistral 准备未启动，4 GPU 空闲
  root_cause: SFT 完成后 GRPO 未自动接续（可能 Worker 脚本没有 chained execution）。Mistral 指令发给 Agent
    但 Agent 在准备阶段停滞，未实际启动 GPU 训练。Director 依赖 Agent 汇报状态而非 Reviewer 实时审计 GPU 状态。
  prevention: 1. 多阶段实验（SFT→GRPO→eval）必须在指令中明确要求 chained execution 或 nohup wrapper。2.
    派实验后 30 分钟内让 Reviewer 审计 GPU 实际占用（nvidia-smi），不依赖 Agent 自报。3. ROADMAP 中写 GPU 状态前先用
    get_gpu_health 确认实际值。
  status: active
  context: exp-post-rl SFT 完成 EXIT_CODE=0 (1175s) 但 GRPO 未启动。exp-ctrl-contam-mistral
    代码/数据已准备但 GPU 0 MiB。4 张卡全部空闲浪费中。
- id: M011
  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: 'M011: GRPO 配置严重错误——LR 低 10-20x + max_new_tokens=32 导致模型零学习，浪费 ~2h GPU'
  root_cause: GRPO 训练配置未针对 MMLU 任务校准：(1) LR=5e-7 比推荐范围 1e-5~5e-6 低 10-20x，梯度几乎为零；(2)
    max_new_tokens=32 对 MMLU 多选答题太短，90%+ 生成被截断；(3) 启动后无人检查早期训练指标（loss/grad_norm/clip_ratio），直到
    Reviewer 在 52% 进度时发现。
  prevention: 1. GRPO/PPO 启动前必须有配置 checklist：LR 范围 1e-5~5e-6、max_new_tokens ≥ 任务预期回答长度的
    2x、reward function sanity check（5 个样本手动验证）。2. 前 100 步强制检查：loss 非零、grad_norm 非零、clip_ratio
    > 0。如果三项任一为零，立即报告不继续。3. 对于非标准 RL 任务（如 MMLU 选择题），Agent 必须在提交前说明 generation format
    和 token budget。
  status: active
  context: exp-post-rl GRPO on cuda:2, PID 73689, 3692/7021 steps (52.6%). loss=-0.027~0,
    grad_norm=0, clip_ratio=0, LR=4.9e-7. 已浪费约 2h GPU 时间。D022 核心假设(post-RL lz* vs
    HT)依赖有效 GRPO。
  fix: Kill PID 73689, 修复 LR→5e-6, max_new_tokens→128, 从 SFT checkpoint 重启。前 200 步监控。
  related_decisions:
  - D022
- id: M012
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: 'M012: 无 sentinel 的 nohup 训练在进程正常退出后被 cron 误判为 failed（s4/s5 均受影响）'
  root_cause: 训练进程正常完成退出后 ps 查不到进程 → cron 监控 hook 连续 5 次检测"进程不在" → 没有 W&B 或 sentinel
    文件验证完成信号 → 自动标记 conclusion=failed。这是 M007（cron on_complete 被 kill 旧进程的 exit file
    误触）的变体模式。
  prevention: 1. 训练脚本完成时必须写 sentinel 文件（如 touch DONE 或写 exit_code=0 到 .sentinel），cron
    hook 优先检查 sentinel 而非 ps。2. hook 判定 failed 前应检查最终 checkpoint 存在性（checkpoint-{max_step}
    或 adapter_model.safetensors 存在 → 大概率成功）。3. 这是系统级 bug，应推给 Agent 修复 cron 监控逻辑。
  status: active
  context: exp-ctrl-contam-qwen-clean-s4 (seed=301) 和 s5 (seed=302) 均正常完成 3 epochs（checkpoint-939
    saved, adapter_model.safetensors 20MB），但被 registry 标记为 failed。s6 同样完成但有独立的配置异常问题。
  fix: 手动将 s4/s5 registry 改为 conclusion=success，运行 eval_lz。长期：修复 cron hook 逻辑增加 sentinel/checkpoint
    检查。
  related_decisions:
  - D021
- id: M013
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: 'M013: s6 启动时未设 CUDA_VISIBLE_DEVICES=0，使用 4 GPU 训练（effective batch 64 vs
    正确的 16），结果不可用'
  root_cause: Worker 启动 s6 时遗漏 CUDA_VISIBLE_DEVICES 环境变量设置。PyTorch 自动检测到 4 张 GPU (_n_gpu=4)，导致
    DDP 训练。effective batch size 从 4×4×1=16 变为 4×4×4=64，总步数从 939 变为 237。train.py 注释写明
    GPU assignment 由 CUDA_VISIBLE_DEVICES 管理，但 Worker 未遵循。这是 M006（CUDA_VISIBLE_DEVICES
    覆盖）的镜像问题——M006 是脚本内部覆盖外部设置，M013 是外部根本没设置。
  prevention: '1. submit_training_job 或 Worker 启动训练命令时必须显式 export CUDA_VISIBLE_DEVICES=N，不能依赖
    train.py 内部或 PyTorch 自动检测。2. 训练启动后立即检查日志前 5 行的 GPU 数和总步数——如果步数 ≠ 预期(单 GPU 应为 939)，立即
    kill。3. 把 CUDA_VISIBLE_DEVICES 检查加入 train.py 的启动断言：if os.environ.get("CUDA_VISIBLE_DEVICES")
    is None: raise ValueError("CUDA_VISIBLE_DEVICES not set")'
  status: active
  context: exp-ctrl-contam-qwen-clean-s6 (seed=303)。s6 checkpoint 237 步 vs s4/s5 的
    939 步。4 GPU DDP 导致 4x batch size。loss=5.58 vs 1.87。s6 结果不可用于 Cohen's d 计算。
  fix: 标记 s6 INVALID，用 CUDA_VISIBLE_DEVICES=0 在 cuda:0 重跑。
  related_decisions:
  - D021
- id: M014
  date: '2026-05-21'
  category: resource_misuse
  severity: high
  summary: Worker B 在 cuda:2 上误启动 s7，与正在运行的 GRPO 冲突
  root_cause: Worker B 看到 cuda:2 "空闲"（可能是 nvidia-smi 瞬时读数或 GRPO 加载模型时显存未满），未与 registry/Director
    确认就直接在 cuda:2 上启动了 s7 训练。多 Worker 并行时缺乏 GPU 分配锁机制。
  prevention: 1. Worker 启动 GPU 任务前必须先 ssh_read_only nvidia-smi 确认目标 GPU 无占用进程 2. Director
    派多 Worker 时明确锁定 GPU 分配（Worker A 只碰 cuda:X/Y，Worker B 只碰 cuda:Z/W）3. 禁止 Worker
    自行判断 GPU 空闲并占用非分配的 GPU
  status: active
  context: GRPO PID 93846 在 cuda:2 运行 (step ~80/14042)。Worker B 报告 cuda:2 空闲后启动 s7
    (PID 97296)，导致冲突。最终 GRPO 被替换为新 PID 97791（从 step 0 重跑），丢失约 80 步进度。
  fix: kill 冲突的 s7 进程 (PID 97296)，GRPO 新进程 PID 97791 已在 cuda:2 正常运行。
- id: M015
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: s7 训练再次未设 CUDA_VISIBLE_DEVICES，重现 M013 4-GPU bug（237 步）
  root_cause: Worker 启动 s7 时使用 --gpu 3 参数但未设 CUDA_VISIBLE_DEVICES 环境变量。train.py 内部
    _n_gpu=4 导致 batch size 4x，总步数 237 而非 939。与 M013(s6) 完全相同的错误模式——Director 指令中已写明
    CUDA_VISIBLE_DEVICES 但 Worker 未遵循。同时 Worker 还产生了 6 个重复训练进程。
  prevention: 1. 所有 train.py 启动指令必须包含 CUDA_VISIBLE_DEVICES=X 前缀（硬规则）2. 启动后必须 nvidia-smi
    验证单卡 + 检查总步数是否为 939 3. 考虑在 train.py 中加入 assert torch.cuda.device_count() == 1
    的启动检查 4. Worker 产生重复进程的问题需要诊断（可能是 nohup/subprocess 重试机制）
  status: active
  context: s7 (PID 99214) 以 --condition clean_s7 --gpu 3 启动，无 CUDA_VISIBLE_DEVICES，导致
    237 步而非 939 步。同时存在 6 个重复进程（s6×2, s7×2, s8×2）消耗 CPU/RAM。这是 M013 的完全重现。
  fix: kill s7 (PID 99214) + 6 个重复进程，用 CUDA_VISIBLE_DEVICES=0 重启 s7。清空 Agent 队列发综合指令。
- id: M016
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Worker spawn 产生 phantom 重复进程 + kill 指令连续 3 次未执行
  root_cause: Worker 通过 spawn_worker 启动时会 fork 出 phantom 进程（每个 train.py 命令产生 2 个无
    GPU 的重复进程）。同时 Worker 接收 kill 指令后未实际执行 kill 操作（可能是命令被 phantom 进程干扰或 Worker 执行流程中
    kill 步骤被跳过）。Director 连续 3 轮发 kill 指令均未生效。
  prevention: 1. 关键清理操作（kill 进程、修复配置）应由 Agent 直接 ssh_execute，不通过 spawn_worker 2. Worker
    phantom 进程 bug 需要 Agent 排查根因（可能是 nohup/subprocess 机制问题）3. kill 指令执行后必须立即 ps 验证，未验证
    = 未执行
  status: active
  context: s7 kill 指令被发出 3 次（紧急消息 + replace_queue × 2），Reviewer 连续 2 份报告标记 s7 仍在运行。同时每轮
    Worker 操作都会产生新的 phantom 进程对（s6×2, s7×2, s8×2 → 新 s7×2, s8×2）。直到改为要求 Agent 直接 ssh_execute
    而非 spawn_worker。
  fix: 要求 Agent 直接 ssh_execute 所有 kill 和启动命令，禁止 spawn_worker。同时在 train.py 中加入 assert
    torch.cuda.device_count() == 1 防护。
- id: M017
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: Worker 误杀配置正确的 s8 (PID 99807)，且未完成 s7 重启和 s6 eval
  root_cause: 第四次催告的 cleanup Worker kill 了所有非 GRPO 的 train.py 进程，包括配置正确的 s8 (CUDA_VISIBLE_DEVICES=3,
    step 294/939)。Worker 只执行了 kill 步骤但未执行后续的 restart 步骤（s7 重启、s6 eval），导致 GPU 1/3

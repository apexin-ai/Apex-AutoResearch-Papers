  context: s8 (PID 99807) 使用正确的 CUDA_VISIBLE_DEVICES=3，已训练到 step 294/939 (31%)。Director
    的指令中明确写了"PID 99807 不能动"，但 Worker 仍然 kill 了它。同时 s7 未重启、s6 eval 未启动，导致 GPU 1/3 完全空闲。
  fix: 重启 s8 (CUDA_VISIBLE_DEVICES=3) + s7 (CUDA_VISIBLE_DEVICES=1) + s6 eval。
- id: M018
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: 'run_constat.py 两个 bug: 缺 Snijders 校正 + 检测阈值方向反，导致 lz* 仿真检测率人为归零'
  root_cause: Worker 编写 run_constat.py 时未从 eval_lz.py 复制正确的 Snijders (2001) 方差校正（Var*
    = Var_lz - C²/I_θ），计算的是 uncorrected lz（clean 均值 -2.365 而非 ~0）。同时检测阈值 lz > 1.96
    方向错误（污染导致 lz* 负偏，应检测 < -1.96）。两 bug 叠加导致仿真检测率 = 0.000。
  prevention: '1. 新脚本中的 lz* 计算必须复用 eval_lz.py 的经过验证的实现，不要重写 2. 任何统计检验的阈值方向（单侧/双侧、正/负方向）必须在代码审查中明确验证
    3. 基本 sanity check: clean 数据的 lz* 均值应 ≈ 0，如果偏离大（如 -2.4）说明校正有问题'
  status: active
  context: ConStat 仿真对比实验。lz* 在所有污染率下检测率 0.000 而 ConStat 在 25%/50% 为 1.000。Reviewer
    诊断出根因为代码 bug 而非方法缺陷。修复后需重跑。
  fix: 修复 compute_lz_star 加入 Snijders 校正 + 阈值改为双侧 |lz*| > 1.96。指令已发。

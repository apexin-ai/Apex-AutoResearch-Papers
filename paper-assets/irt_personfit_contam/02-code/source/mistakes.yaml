  root_cause: 'Agent 在 compute_cohens_d.py 中 hardcode 了 10 个 Llama clean ℓz* 值（mean=-0.312,
    SD=0.840），但这些值与当前 clean checkpoint 的 eval 结果不匹配（例如 s6: hardcoded=-1.148, eval=2.847）。来源可能是不同

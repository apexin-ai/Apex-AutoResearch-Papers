    auroc_post_rl_vs_clean: 0.88
    auroc_drop_from_pre_rl: 0.06
    minkpp_auroc_pre_rl: 0.96
    minkpp_auroc_post_rl: 0.61
    minkpp_signal_retention: 0.22
    irt_advantage_post_rl: 0.27
    grpo_reward: rule-based (correctness on held-out math/reasoning tasks)
    grpo_steps: 2000
    grpo_lr: 1e-5
  result_rationale: 'Best 档下 IRT-FIT 在 post-RL 后仍保持检测力 (d=2.1, AUROC=0.88)， 而 Min-K%++
    大幅退化 (AUROC 0.96→0.61)。原因： (1) GRPO 优化的是 reward (reasoning correctness)，不是 likelihood——
    所以 token-level probability 分布被重塑，Min-K%++ 依赖的低 perplexity 信号被冲淡。 Wang et al. (2025)
    已在 DPO 上观察到类似失效。 (2) 但 binary response pattern 更 robust：RL 改善了整体推理能力， 但 SFT 注入的
    item-specific 记忆没有被完全覆盖—— 模型仍然在被污染的难题上 accuracy 异常高，只是 "多余的正确" 变少了 (accuracy 从
    0.78 提到 0.81，θ 从 1.62 到 1.89)。 (3) lz* 从 -8.7 回升到 -5.1 (retention 58%)——RL 平滑了部分
    aberrance， 但没有消除。AUROC 从 0.94 降到 0.88，仍在 useful 范围。 (4) IRT-FIT 的 post-RL advantage
    (+0.27 AUROC over Min-K%++) 是强 narrative： "IRT-FIT not only works at minimal information,
    but is more robust to RL post-processing than methods requiring richer information."

    '
  tables:

  figures_description:
  - 'Figure 14: lz* trajectory — 3 bars: clean, SFT-contaminated, SFT+GRPO. 展示信号 attenuation
    but persistence.'
  - 'Figure S4: AUROC retention comparison — grouped bar chart, 3 methods × pre/post
    RL. IRT-FIT 和 ConStat robust，Min-K%++ collapses.'
  analysis: 'Post-RL robustness 是 strong differentiator。Narrative： "The same property
    that limits IRT-FIT''s absolute power (binary-only) also protects it from RL-induced
    signal erosion that degrades token-level methods." ConStat 同样 robust 因为 retest
    consistency 也不依赖 token probs。 但 ConStat 需要 live model access，IRT-FIT 不需要。

    '

    result_rationale: 'lz* 在 5-10% 低污染率胜出所有 baselines（假设 5）的机制：IRT 结构作为 inductive
      bias。 在低污染率下，signal-to-noise 极低——只有 5-10% 的 items 携带 contamination signal。 ML
      classifiers（LR/RF）即使有 oracle labels 也面临严重的 class imbalance（5% positive）， 且 binary
      feature space（0/1 per item）在低 contamination 时几乎不可分。 lz* 的优势来自 IRT model 提供的
      structured expectation：它知道每个 item 的 expected P(correct|θ)， 因此即使只有 5% items 被
      contaminate，这些 items 上的 "impossible correctness"（高难度 item 被答对） 会被精确捕获为 aberrance。而
      ML classifier 只看到 raw 0/1 pattern，缺乏 item difficulty 的先验。 Min-K%++ 在 5% 时 AUROC=0.71

    result_rationale: 'Qwen3.5-9B 作为较新架构（含 thinking 能力），SFT memorization 效率略高于 Qwen2.5-7B。
      15% 污染产生强信号（|d|≈4.0）是因为 QLoRA 在小比例 seen items 上产生明确的 aberrant pattern： 模型在高难度
      seen items 上异常正确，而在 unseen items 上保持原有错误模式。memorization_fraction≈0.42 说明 ~42%
      的 seen items 被完全记忆（产生 aberrant response），剩余 58% 产生了泛化而非逐字记忆。 θ-shift 机制与 pilot
      一致：污染提升整体能力估计，θ_MLE 上升吸收了部分 aberrance signal， θ-fixed 恢复单调性。clean-vs-clean Δ≈0.4

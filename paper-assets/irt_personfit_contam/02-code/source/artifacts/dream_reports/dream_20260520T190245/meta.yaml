    ---


    # IRT-FIT: Dream Review Report


    **Paper:** IRT-FIT: Characterizing the Detection Frontier for Benchmark Contamination
    at the Minimal-Information Operating Point

    **Venue:** EMNLP 2026 (ARR)

    **Review Mode:** Simple (1 Reviewer, full coverage)


    ---


    ## A. Format / Compliance Check


    - **Page count:** Main text runs approximately 10 pages (Sections 1–7), which
    **exceeds the 8-page limit** for EMNLP 2026 long papers. The Limitations paragraph
    is embedded in Discussion (Section 6, page 10), not a separate section. Even accounting
    for Limitations not counting toward the limit, the main body is ~9+ pages of substantive
    content. This is a potential desk-reject risk.

    - **Anonymity:** "Anonymous Submission to EMNLP 2026" on title page. No author-identifying
    information detected. Self-citations (PSN-IRT [2026]) are cited in third person.
    **Pass.**

    - **Limitations section:** Present (end of Section 6, page 10). Lists 4 limitations:
    (1) post-RL on single model only, (2) QLoRA SFT may not replicate pretraining
    exposure, (3) power function calibrated on 5 benchmarks only, (4) scoped to intentional
    SFT contamination. Adequate but could be more thorough—see weaknesses.

    - **Citation verification:** 12 references listed. Brown et al. 2020 (NeurIPS)
    ✓, DeKoninck et al. 2024 (NeurIPS) ✓, Dodge et al. 2021 (EMNLP) ✓, Drasgow et
    al. 1985 (BJMSP) ✓, Hong et al. 2021 (APM) ✓, Lalor et al. 2019 (EMNLP) ✓, Shi
    et al. 2024 (ICLR) ✓, Snijders 2001 (Psychometrika) ✓, Wang et al. 2025 — listed
    as preprint with no venue, plausible given 2025 date. PSN-IRT 2026 (AAAI, Oral)
    — plausible but unverifiable for a 2026 publication. CoDeC 2026 (ICLR) — same.
    Zhuang et al. 2023 — listed as preprint without venue. **No hallucinated citations
    detected**, but Wang et al. 2025 and CoDeC 2026 lack complete bibliographic details.

    - **Responsible NLP Research Checklist:** Not present in the PDF. This is **mandatory**
    for ARR submissions. Omission may trigger desk reject.


    **Compliance verdict:** Two risks — (1) main text likely exceeds 8 pages, (2)
    missing Responsible NLP Research Checklist. Either could cause desk reject.


    ---


    ## B. Soundness — Score: 3.5 / 5


    ### Strengths

    - The controlled contamination protocol is well-designed: 4 models × 6 levels
    × multiple benchmarks with clean-clean baselines establishing noise floor. This
    is the gold standard for contamination detection evaluation.

    - The θ-shift boundary condition (Section 3.2) is a genuine methodological insight.
    The observation that free-θ estimation absorbs aberrance signal, creating non-monotonic
    dose-response, is well-explained and the θ-fixed correction is theoretically motivated.

    - The power function (Eq. 4) is elegant and its empirical validation (R²=0.94
    across 5 benchmarks, Table 10) is convincing. The √n scaling prediction for GSM8K
    failure is a nice theory-experiment consistency check.

    - Bootstrap CIs reported throughout (Table 6) — good statistical practice, rare
    among peers.


    ### Weaknesses

    - **The power function (Eq. 4) is presented as a proportionality, not a derived
    equation.** The paper does not show how Power ∝ √(n·π·f_mem·ā) is derived from
    the lz* distributional theory. Is this a fitted empirical relationship or a theoretical
    result? If empirical, R²=0.94 on 5 data points (Table 10) is not very convincing—5
    points can fit many functional forms. The paper should either derive this from
    first principles or acknowledge it as an empirical approximation with very limited
    calibration data.

    - **Post-RL experiment is single-model (Qwen3.5-9B only).** This is the paper''s
    most important finding (the structural robustness argument drives the entire narrative),
    yet it rests on N=1 model evidence. The authors acknowledge this in Limitations
    but it substantially weakens the central claim.

    - **Baseline comparison fairness.** The paper claims lz* is best at the "binary-only
    operating point," but the accuracy z-score is the only binary-only baseline. Having
    only one true apples-to-apples comparison weakens this claim. Other binary-only
    statistics exist (e.g., Guttman errors, U3 statistic, person-total correlation)
    that could serve as baselines.

    - **Memorization fraction is circularly defined.** The memorization fraction f_mem
    (proportion of contaminated items producing detectable aberrance) is measured
    via seen/unseen lz* gap — but this requires knowing which items are seen, which
    is only available in the controlled setting. The paper does not address how f_mem
    would be estimated in practice (wild contamination), yet uses it in the power
    function that is supposed to guide practitioners.

    - **No figures.** The paper is entirely text and tables — no figures at all. For
    a paper about "characterizing the detection frontier," visual presentation of
    dose-response curves, power functions, and cross-model comparisons would significantly
    aid comprehension and impact. This is unusual for a top venue submission.


    ### Minor issues

    - Eq. 3: The standardization of lz* assumes θ̂ is the MLE, but the paper doesn''t
    discuss how θ is estimated for LLMs. Is it MLE on the full response vector? Does
    the 4PL complicate MLE convergence?

    - Table 3 reports θ-fixed |Δlz*| but doesn''t explain how the "clean θ" is obtained
    in practice. For the controlled experiment, this is the 0% condition θ, but for
    real-world use, the clean θ is unknown.

    - The lzm aggregation (Section 3.4, 5.7) adds only +0.75 d-units and doesn''t
    change detection decisions. Its inclusion feels like padding rather than a genuine
    contribution.


    ---


    ## C. Excitement / Novelty — Score: 3.0 / 5


    ### What''s novel

    - Applying IRT person-fit statistics to LLM contamination detection is genuinely
    new. The psychometrics-to-NLP bridge is creative and the "item preknowledge ↔
    benchmark contamination" analogy is apt.

    - The "characterization framework" framing — explicitly quantifying when detection
    works and when it fails — is more honest and ultimately more useful than claiming
    a universal detection method. The operating conditions table (reliable / model-dependent
    / infeasible) is a practical contribution.

    - The post-RL robustness finding, if it generalizes beyond one model, would be
    significant. The structural argument (binary patterns are more robust than token
    distributions under RL) is theoretically compelling.


    ### What limits excitement

    - **lz* is not the best detection method at any contamination level** (Table 6).
    It ranks 4/6 at all tested levels. The paper''s value proposition rests entirely
    on (a) being best among binary-only methods (where the only competitor is accuracy
    z-score), and (b) post-RL robustness on a single model. This is a narrow niche.

    - **The "minimal-information operating point" framing is somewhat forced.** The
    paper repeatedly emphasizes that lz* requires "only binary data," but in practice,
    anyone running an LLM evaluation can also extract token probabilities. The scenario
    where binary data exists but token probabilities don''t (archival leaderboard
    audits) is real but niche. The paper doesn''t quantify how many real-world use
    cases fall into this category.

    - **Much of the paper reports expected/negative results.** GSM8K fails (predicted
    by power function). Mistral fails (low memorization fraction). v1 IRT estimation
    fails (structural MML-EM limitation). Natural experiment is inconclusive. While
    honest, a paper where ~40% of results are "this doesn''t work, as expected" may
    struggle to excite reviewers.

    - **Concurrent work gap.** CoDeC (ICLR 2026) is cited but not compared against
    experimentally. The related work also misses several recent contamination detection
    papers from 2025 (e.g., various MIA variants, benchmark-specific approaches).
    The related work section is thin (~0.5 pages).


    ---


    ## D. Reproducibility — Score: 3.0 / 5


    ### What''s provided

    - Model names and sizes specified (Qwen3.5-9B, Gemma-4-31B, Llama-3.1-8B, Mistral-7B-v0.3)

    - Benchmark names and item counts specified

    - Contamination levels (0/5/10/15/25/50%) and protocol (QLoRA SFT) mentioned

    - IRT parameters sourced from PSN-IRT [2026]

    - Baseline methods named


    ### What''s missing

    - **No QLoRA hyperparameters** (rank, alpha, learning rate, epochs, batch size).
    "QLoRA supervised fine-tuning" is insufficient to reproduce.

    - **No GRPO training details** for the post-RL experiment (reward function, training
    steps, hyperparameters).

    - **No code or data availability statement.** No mention of releasing code, contaminated
    model checkpoints, or IRT parameters.

    - **PSN-IRT [2026] 4PL parameters** — the entire method depends on these, but
    they''re from another paper. Are they publicly available? If not, the method is
    unreproducible.

    - **No specification of how θ-MLE is computed** (optimizer, convergence criteria).

    - **Two clean baselines with "different random seeds"** — seeds not specified.

    - **No details on bootstrap procedure** (number of resamples, stratification).


    ---


    ## E. Strengths and Weaknesses


    ### Major Strengths

    1. **Well-designed controlled experiments.** The 4-model × 6-level × 5-benchmark
    grid with clean-clean baselines is thorough and provides genuine ground truth
    — a rarity in contamination detection research.

    2. **Honest framing.** The paper does not overclaim. The "characterization framework"
    acknowledging where detection fails (GSM8K, Mistral, post-RL degradation) is more
    credible than a "we detect everything" narrative.

    3. **θ-shift boundary condition.** A genuine methodological insight that the community
    should know about — free-θ estimation on contaminated data creates non-monotonic
    dose-response, and θ-fixed analysis restores interpretability.

    4. **Post-RL robustness argument.** Even with N=1 model, the structural argument
    (binary patterns vs. token distributions under RL) is theoretically sound and
    timely given Wang et al. (2025).

    5. **Power function with practical thresholds.** Giving practitioners a formula
    to predict detection feasibility a priori (≥10K items, memorization fraction ≥0.15)
    is directly useful.


    ### Major Weaknesses

    1. **lz* is not competitive in absolute AUROC.** Ranking 4/6 at all contamination
    levels makes the contribution feel incremental. The "binary-only" niche is real
    but narrow, and the paper doesn''t convincingly argue this niche is large enough
    to matter.

    2. **Post-RL evidence is too thin (N=1 model).** The paper''s strongest narrative
    claim — structural robustness under RL — rests on a single model experiment. At
    minimum, 2 models are needed to distinguish model-specific from structural effects.

    3. **No figures.** A paper about "characterizing the detection frontier" with
    zero visualizations is a significant presentation weakness. Dose-response curves,
    power function plots, and cross-model heatmaps would substantially improve readability
    and impact.

    4. **Power function calibrated on 5 points.** R²=0.94 on 5 data points is not
    strong validation. Any monotonic function would fit reasonably well. The paper
    needs either a theoretical derivation or substantially more calibration data.

    5. **Page limit violation likely.** Main text appears to exceed 8 pages, risking
    desk reject.


    ### Minor Weaknesses

    - Missing Responsible NLP Research Checklist

    - lzm aggregation contributes minimally and could be cut to save space

    - Natural experiment (Section 5.11) is inconclusive and takes up space

    - No error bars in Tables 1-5 (only Table 6 has CIs)

    - The memorization fraction concept is only measurable in controlled settings,
    limiting practical applicability of the power function


    ---


    ## F. Questions for Authors


    1. **Power function derivation:** Is Eq. 4 derived from the lz* null distribution
    theory or fitted empirically? If empirical, how confident are you in R²=0.94 from
    5 data points?

    2. **Practical f_mem estimation:** How would a practitioner estimate memorization
    fraction for a model in the wild? Without this, the power function is only useful
    retrospectively.

    3. **Post-RL on more models:** Do you have any evidence (even preliminary) that
    the 45% signal retention generalizes to other model families?

    4. **Why no figures?** Was this a deliberate choice or oversight? The paper would
    benefit enormously from 3-4 figures.

    5. **θ-fixed in practice:** The θ-fixed analysis requires knowing the clean θ.
    How would this work when the ground truth contamination status is unknown?

    6. **CoDeC comparison:** CoDeC (ICLR 2026) is cited but not included in the baseline
    comparison. Why?

    7. **IRT parameter dependency:** The method depends entirely on PSN-IRT 4PL parameters.
    What happens if these parameters are miscalibrated? Is there a sensitivity analysis?


    ---



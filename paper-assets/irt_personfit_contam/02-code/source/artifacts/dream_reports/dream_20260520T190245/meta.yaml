    result_rationale: 'Post-RL signal retention ≥70%（假设 3）成立的核心原因：GRPO 优化的是 reward
      signal（正确率/格式）， 而非 item-level response distribution。SFT memorization 写入的是 "看到
      item X → 输出 answer Y" 的 pattern，这是 parameter-level 的 association。GRPO 的 policy
      gradient 更新主要影响 reasoning chain 的 token distribution，而 binary correctness 层面的
      memorization 痕迹 （hard item 仍然答对）大部分保留。signal 从 3.5 降到 2.8（retention=80%）的 20%
      损失来自： (a) RL 训练中少量 seen items 的 memorization 被 "覆盖"（RL 发现了不同的 reasoning path），
      (b) RL 普遍提升了 unseen items 的正确率（θ进一步上升），轻微压缩了 seen/unseen gap。 但关键是 binary response
      层面的 aberrant pattern 仍然存在——模型在 "不该答对" 的 hard items 上 仍然答对，这个 pattern-level signal
      是 RL 无法消除的，因为 RL 没有动机去 "故意答错" 已经答对的题。 相比之下，MIA methods（Min-K%++, PPL）失效是因为 RL
      彻底重塑了 token-level distribution—— reasoning tokens 的 perplexity 分布被 GRPO 重新优化，训练数据的
      token-level fingerprint 消失。 这是 binary vs token-level detection 的 structural
      advantage。


      meaning: Multi-model ctrl-contam 全面成功 + post-RL 信号存活 + lz* 在低污染率胜出所有 baselines
      key_assumptions:
      - SFT memorization fingerprint跨模型家族一致：4/4 模型在 15% 污染下均产生显著 Δlz*
      - θ-fixed 策略普适：所有模型均可通过固定 θ 恢复单调 dose-response
      - Post-RL 不破坏 binary response 层面的记忆痕迹（GRPO 后 Δlz* 保留 ≥70%）
      - 小 benchmark（GSM8K ~1.3K items）在 ctrl-contam 中仍产生可检测信号（|d| > 0.8）
      - lz* 在 5-10% 低污染率下 AUROC 持续优于所有 supervised baselines

  - name: Post-RL 信号保持实验
    plan_id: exp-post-rl
    description: 'Qwen3.5-9B: SFT contamination (15%) → GRPO 训练 → 测量 person-fit 信号是否保持。
      回应 Wang et al. (2025) 的 MIA 完全失效问题。

      '
    expected_results:
      pre_rl_cohens_d_15pct: -2.45
      post_rl_cohens_d_15pct: -1.1
      signal_retention: 0.45
      post_rl_memorization_fraction: 0.11
      pre_rl_memorization_fraction: 0.26
      post_rl_delta_lz_free: -1.12
      post_rl_delta_lz_fixed: 1.35
      post_rl_theta_shift: 0.31
      post_rl_accuracy_seen: 0.79
      post_rl_accuracy_unseen: 0.768
      post_rl_seen_unseen_gap: 0.022
      post_rl_lz_star_mean: 5.8
      ppl_based_post_rl_auroc: 0.52
      min_k_pp_post_rl_auroc: 0.51
      lz_star_post_rl_auroc: 0.63
      comparison_vs_logprob: lz* retains partial signal (AUROC 0.63) where all log-prob
        methods → random (0.50-0.52)
    result_rationale: 'Post-RL signal retention 0.45（在 [0.3, 0.7] 范围内），意味着 |d| 从 2.45
      降到 ~1.10。

      衰减机制：GRPO 优化 reward（通常基于 correctness），不直接操作 item-level memorization， 但 RL 的
      policy gradient 更新会 smooth out 精确的 item-level response pattern。 Memorization
      fraction 从 0.26 降到 0.11——RL 将部分 "死记硬背" 转化为 "推理能力"， 减少了 aberrant response pattern
      的信号源。

      但关键区别于 log-prob methods：RL 改变的是 token-level probability distribution（这是 Min-K%++
      等方法的信号源）， 而 binary response pattern 只在 item 答对/答错时改变。RL 会 redistribute probability
      mass 但不一定 flip binary correctness——所以 binary-level 的 memorization signature
      部分保留。

      seen/unseen accuracy gap 从 0.088（pre-RL）缩小到 0.022（post-RL）——RL 在 seen items
      上的 accuracy 不再有明显优势，因为 RL 的 generalization 效应。但残余的 lz* signal 来自 item-level
      pattern 的 subtle consistency/inconsistency，而非 aggregate accuracy difference。

      这是 median 档最重要的 narrative contribution：lz* 在 post-RL 场景下 "partially robust"（AUROC
      0.63 vs random 0.50）， 而 Wang et al. (2025) 证明所有 10 种 log-prob methods ≈ random。
      framing 为 "not immune to RL degradation, but structurally more robust than distributional
      methods"。

      '

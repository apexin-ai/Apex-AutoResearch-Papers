      - θ-fixed 在 3/4 模型上恢复单调性，1 个模型出现非标准 θ-shift pattern
      - Post-RL 信号衰减 40-70%——person-fit 未完全失效但 effect size 大幅缩水
      - lz* 在 5% 污染时与 best baseline 持平或略优，10%+ 时 ML baselines 追上

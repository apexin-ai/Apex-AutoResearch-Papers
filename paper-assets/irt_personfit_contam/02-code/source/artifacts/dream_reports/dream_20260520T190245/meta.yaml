      that retains any signal at the minimal-information operating point under RL.

      Signal retention 45% 意味着 |d| 从 large effect (2.45) 降到 moderate effect (1.10)——
      在单个模型上仍然 borderline significant，但如果 combined across models/benchmarks via multiscale
      lzm（exp-multiscale-lzm），可能恢复到 reliable detection。

      Accuracy z-score 在 post-RL 下 retention 更高（52%）但 absolute AUROC 更低—— 因为 z-score
      本身信号太弱，RL 对其影响不大但初始 baseline 就差。

      framing 建议："IRT person-fit operates on the response pattern level — structurally
      immune to the token-distributional shifts that render all log-probability methods
      ineffective under post-RL contamination (Wang et al. 2025). While RL does attenuate
      the signal (45% retention), lz* remains the only method at any information access
      level that achieves above-chance detection in this regime."

      '
  - name: Multiscale lzm 跨 benchmark 聚合
    plan_id: exp-multiscale-lzm
    description: '实现 Hong, Lin & Cheng (2021) 的 lzm 统计量——跨 benchmark 聚合的标准化 lz* 总分。
      在 12-model case study + ctrl-contam 模型上验证。

      '
    expected_results:
      psn_irt_12_models:
        lzm_range:
        - 15.2
        - 85.4
        lzm_std: 22.3
        lzm_vs_mean_lz_star_r: 0.92
        lzm_flagged_count: 12
        lzm_improves_ranking: false

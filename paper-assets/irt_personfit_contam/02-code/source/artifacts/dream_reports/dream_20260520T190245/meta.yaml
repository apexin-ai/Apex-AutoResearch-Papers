      narrative_direction: '原始 framing 完全成立。IRT-FIT 是 minimal-information operating
        point 上的有效检测框架： 跨 4 个模型家族一致检测、post-RL robust、在实际关键的低污染率下无需标注数据即胜过 supervised
        baselines。 三条 claims 无需调整——Claim 1 的 "principled framework" 有 ctrl-contam
        全面验证， Claim 2 的 power function 有 multi-benchmark 实证确认，Claim 3 的 empirical

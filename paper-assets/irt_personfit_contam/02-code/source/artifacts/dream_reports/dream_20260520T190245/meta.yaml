      post_rl_lzm:
        pre_rl: -3.2
        post_rl: -1.5
        retention: 0.47
    result_rationale: 'lzm 是 lz* 的 multi-test 扩展，aggregation 的价值取决于 cross-benchmark
      correlation structure。

      PSN-IRT 12-model case study：lzm 与 mean lz* 的相关 r=0.92——高相关表明 aggregation 没有带来太多新信息，因为同一模型在不同
      benchmark 上的 lz* 方向通常一致（93.3% 为正向 misfit）。 所有 12 个模型已经被个别 benchmark 的 lz* flagged，lzm
      不改变 flag 结论。

      ctrl-contam 模型：lzm 的 |d| 比单 benchmark 高 ~0.6 units，因为 aggregation reduces noise。
      但主要增益来自 MMLU 信号——GSM8K 和 HellaSwag 的弱信号（median tier 下 GSM8K |d|<0.8） 被 weighted
      down 而不是拖累整体。Hong et al. 的公式按 variance-inverse 加权， 所以 high-power benchmark (MMLU)

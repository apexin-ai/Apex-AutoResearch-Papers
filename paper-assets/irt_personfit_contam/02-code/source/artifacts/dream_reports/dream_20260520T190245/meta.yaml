    | 4PL vs 3PL | ✓ Full | Good — Table 11, essential finding |

    | Domain analysis | ✓ Full | Good — Table 5, interesting STEM finding |


    **Key gap:** Post-RL experiment should be expanded to ≥2 models. This is the paper''s
    central differentiating claim and single-model evidence is insufficient for EMNLP.


    ---


    ## H. Overall Assessment


    **Score: 3.0 (Findings)**


    **Calibration rationale:** The paper presents a technically sound but incrementally
    novel contribution. The controlled experiment design is commendable and the operating-conditions
    framing is honest and useful. However, lz* is not competitive in absolute detection
    performance (4/6 at all levels), the post-RL robustness claim rests on a single
    model, the power function is calibrated on too few points, and the paper lacks
    figures. The "minimal-information operating point" niche is real but narrow.


    For EMNLP Main (~21% acceptance), the paper lacks the excitement and impact to

    result_rationale: 'Median 档的核心张力：lz* 在 5% 污染时与 best binary-only baseline 持平或略优（+0.10
      vs accuracy z-score）， 但需要 token probs 的方法在 10%+ 时追上。

      lz* AUROC 0.65 at 5%（在 [0.58, 0.72] 范围内）：低污染下 signal 微弱， 但 IRT structure 提供的
      inductive bias 弥补了 labeled data 的缺失。 Simulation 中 lz* 在 5% 时 AUROC=0.675（exp-ml-classifier-baseline），
      实际数据因为 SFT generalization 和 memorization fraction 的存在会略低。

      Min-K%++ 在 10%+ 时胜出（AUROC 0.76 vs 0.73 at 10%）： token-level probability 提供了比
      binary response 更丰富的信号——这是 information hierarchy 的必然结果。 但 median 档的关键 narrative

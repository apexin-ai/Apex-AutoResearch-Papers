    | Figures | ⚠️ Zero figures in entire paper. Atypical. |


    ---


    ## 7. Scores


    ### Soundness: 2.5 / 5

    The experimental methodology is competent within its scope, but the QLoRA-as-contamination-proxy
    confound (W2) is a serious threat to external validity that the paper barely acknowledges.
    The core claim—that SFT generalization is the "binding constraint"—may be specific
    to parameter-efficient fine-tuning rather than a general property of LLM contamination.
    Statistical analyses are appropriate but the small model set (W5) limits the robustness
    of cross-model conclusions. The negligible advantage over accuracy z-score (W3)
    raises questions about whether IRT adds meaningful structure.


    ### Excitement: 2.0 / 5

    The paper''s main contributions are: (1) binary detection doesn''t work well —
    unsurprising given the information-theoretic disadvantage; (2) a power function
    that formalizes why — useful but incremental; (3) three standalone findings that,
    while valid, are expected rather than surprising (universal 4PL misfit follows
    from known IRT assumption violations in LLM data; θ-shift is a natural consequence
    of ability re-estimation; memorization heterogeneity is established in the fine-tuning
    literature). The paper quantifies boundaries but does not open new directions.
    A reader finishes the paper knowing that binary detection has limits, but not
    what to do about it beyond "use richer information sources" — which is the status
    quo.


    ### Reproducibility: 2.5 / 5

    The paper describes the experimental protocol at a high level (QLoRA SFT, 6 contamination
    levels, 2 clean seeds) but omits critical details: QLoRA hyperparameters (rank,
    alpha, target modules), training epochs/steps, learning rate, batch size, hardware,
    training time, random seed handling beyond clean baselines. No code or data availability
    statement is provided. The reliance on PSN-IRT parameters (themselves from a 2026
    paper) adds a dependency that may not be publicly available at review time.


    ### Overall Assessment: 2.0 / 5 (Resubmit next cycle)


    **Justification:** The paper addresses a valid research question with competent
    methodology, but several issues prevent acceptance at EMNLP:


    1. **Compliance failures** (page limit violation, missing checklist) are individually
    sufficient for desk rejection.

    2. **The central finding—that binary-only detection has limited power—is not sufficiently
    surprising** to compensate for the predominantly negative results. The information-theoretic
    argument (binary vs. token-probability) makes this outcome predictable; the paper''s
    value lies in quantification, but the quantification is compromised by the QLoRA
    proxy concern.

    3. **The IRT contribution is undermined by the negligible advantage over accuracy
    z-score.** If lz* ≈ accuracy z-score + noise, the elaborate IRT framework adds
    complexity without corresponding insight.

    4. **Extremely sparse references** suggest the paper was not adequately positioned
    in the literature.

    5. **No figures** in an empirical paper is a significant presentation weakness.


    The paper could be strengthened for resubmission by: (a) cutting §4.7.1–4.7.5
    to supplementary to meet page limits; (b) adding full-parameter fine-tuning experiments
    to validate the QLoRA findings; (c) expanding related work and references substantially;
    (d) adding figures for key results (power curves, AUROC comparison, θ-shift visualization);
    (e) adding the NLP Checklist. The θ-shift mechanism and power function contributions
    have potential but need stronger empirical grounding and better presentation.


    ---


    ## 8. Confidence


    **Reviewer confidence: 4/5** (Confident but not certain; familiar with IRT, contamination
    detection, and LLM evaluation literature.)


    ---


    ## Meta-Assessment (Director)


    The single-reviewer assessment is well-calibrated to EMNLP standards. The compliance
    issues (page limit, missing checklist) are objective and serious. The scientific
    concerns (QLoRA proxy validity, negligible advantage over z-score) are substantive
    and not easily dismissed. The overall score of 2.0 reflects a paper that has a
    valid research direction but needs significant revision in both execution and
    presentation before it meets the bar for a top NLP venue. The paper would benefit
    from a major restructuring: promoting the power function and θ-shift as the primary
    contributions, adding experiments with full fine-tuning, cutting supplementary
    analyses from the main text, and substantially expanding the literature review.'

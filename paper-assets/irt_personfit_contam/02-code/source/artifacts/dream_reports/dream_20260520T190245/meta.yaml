        qwen35_9b: -1.65
        gemma4_31b: -1.2
        llama31_8b: -1.45
        mistral7b_v03: -0.48
      dose_response_25pct_mmlu:
        qwen35_9b: -2.9
        gemma4_31b: -2.05
        llama31_8b: -2.55
        mistral7b_v03: -0.95
      post_rl_signal_retention: null
    result_rationale: '四模型异质性是 median 档的核心特征，源于 SFT generalization 的架构依赖性：

      Qwen3.5-9B（|d|=2.45）：Qwen 系列 SFT 训练策略相对标准，9B 参数量下 memorization fraction ~0.26，
      足够产生可检测的 aberrant pattern。与 pilot 一致。

      Gemma-4-31B（|d|=1.82）：31B 参数量是最大模型，SFT generalization 最强，memorization fraction
      仅 0.18。 更大模型更容易从 contaminated items 中提取可迁移知识而非死记硬背——这是 scaling law 在 memorization
      上的体现。 检测仍然显著但 effect size 是四模型最低的显著模型。

      Llama-3.1-8B（|d|=2.10）：Meta 的 Llama 系列 SFT 相对"忠实"，memorization fraction 0.30
      是最高的， 与 Llama 架构的 attention pattern 倾向于更 literal 的 memorization 一致（文献中有 Llama
      更容易 memorize 的报告）。

      Mistral-7B-v0.3（|d|=0.78, 不显著）：Mistral 的 SFT 流程使用了较强的 generalization regularization
      （sliding window attention + 其 SFT recipe），memorization fraction 仅 0.12。 在 14K
      items 的 MMLU 上 15% contamination 理论 power 要求 memorization fraction > ~0.15 才能达到
      |d|>1.0， Mistral 低于这个门槛。这不是方法失败——是 operating condition 的量化边界。

      GSM8K 全军覆没：1.3K items 远低于 power theory 预测的 min_items=7958（at 80% power, 15%
      contamination）。 |d| 最高的 Qwen 也只有 0.62，这精确符合 √n 衰减预测： d_GSM8K ≈ d_MMLU × √(1300/14042)
      × (memorization_fraction_adjustment) ≈ 2.45 × 0.30 × 0.85 ≈ 0.63。 GSM8K 失败是
      power function 的验证而非反例。

      HellaSwag（10K items）：中间位置。3/4 模型显著，与 MMLU 一致（Mistral 仍然失败）。 Effect sizes 比 MMLU
      弱 ~30%，部分因为 HellaSwag 的 sentence-completion 格式导致 memorization signature 不如 MCQ
      明显。

      θ-fixed 在 3/4 模型上恢复单调性，但 Mistral 出现 "non-standard" pattern： 因为 memorization
      fraction 太低，θ-shift 几乎不发生（contaminated data 被 generalize 而非 memorize， 不改变 effective
      ability），所以 θ-fixed 和 θ-free 差异极小，无法通过 fixing θ 来提取信号。 这是一个独特的 edge case，值得在
      paper 中讨论。

      '

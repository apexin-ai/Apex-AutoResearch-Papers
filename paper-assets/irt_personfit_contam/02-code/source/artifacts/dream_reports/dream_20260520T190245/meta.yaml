    analysis: '核心发现是跨模型异质性的量化：|d| 范围从 0.78（Mistral/MMLU）到 2.45（Qwen/MMLU）， memorization
      fraction 范围从 0.12 到 0.30。这个异质性不是 noise——它与 model architecture 和 SFT recipe 系统性相关。

      关键叙事点：(1) 3/4 模型在 MMLU 上可靠检测，但需要承认 1 个模型家族失败——这驱动 "characterization" 而非 "universal
      detection" 的 framing； (2) GSM8K 全面失败精确验证了 power function 的预测能力——theory-experiment
      agreement 本身是贡献； (3) Mistral 的低 memorization fraction 是一个独立发现——暗示某些 SFT 策略可能
      inherently resistant to memorization-based detection， 这对 contamination detection
      社区有方法论意义。

      Paper 的 operating conditions table 应该明确给出：benchmark ≥10K items + memorization
      fraction ≥0.15 → |d| ≥ 1.0（reliable detection）。

      '

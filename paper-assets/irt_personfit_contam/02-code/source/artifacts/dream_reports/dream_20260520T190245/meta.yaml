    # Review Report: IRT-FIT: Detecting Benchmark Contamination in LLMs from Binary
    Response Patterns Alone


    **Venue:** EMNLP 2026 (ARR)


    ---


    ## Summary


    This paper introduces IRT-FIT, a framework that repurposes Item Response Theory
    (IRT) person-fit statistics (l*_z) from psychometric cheating detection to detect
    benchmark contamination in LLMs using only binary (correct/incorrect) response
    patterns. The authors perform controlled contamination experiments via QLoRA SFT
    across four model families (Qwen3.5-9B, Gemma-4-31B, Llama-3.1-8B, Mistral-7B-v0.3)
    at six contamination levels on three benchmarks. Key results: (1) detection with
    |d| ≥ 2.42 at 15% contamination across all models; (2) a predictable power function
    (R²=0.968) relating detection sensitivity to benchmark size; (3) 80% signal retention
    after GRPO post-training while token-level methods collapse to chance. The paper
    also reports honest negative results on classical IRT parameter recovery at scale.


    ---


    ## Scores


    | Dimension | Score |

    |-----------|-------|

    | **Soundness** | 3.5 / 5 |

    | **Excitement** | 3.5 / 5 |

    | **Reproducibility** | 2.5 / 5 |

    | **Overall Assessment** | 3.5 (Borderline Conference) |


    ---


    ## Strengths


    ### S1: Genuinely novel cross-disciplinary connection

    The psychometrics → LLM contamination bridge is well-motivated and, to my knowledge,
    unexploited in prior work. The analogy between a contaminated LLM and an examinee
    with item preknowledge is natural and productive. The "minimal-information operating
    point" framing positions the contribution clearly within the detection landscape.


    ### S2: Thorough controlled contamination design

    The experimental matrix (4 models × 6 contamination levels × 3–5 benchmarks) with
    clean-vs-clean noise floor controls is rigorous. The inclusion of dose-response
    curves, memorization fraction decomposition, and seen/unseen accuracy splits goes
    well beyond a simple "it works" demonstration. The experiment coverage relative
    to the planned design (review context) is essentially complete.


    ### S3: θ-shift identification and resolution

    The discovery that MLE re-estimation absorbs contamination signal (producing non-monotonic
    dose-response under free-θ) and the θ-fixed fix is a genuine methodological contribution.
    This is not IRT-FIT-specific — it applies to any ability-contingent detection
    method — making it broadly valuable. The quantification (Δθ = 0.41 at 50% contamination)
    is concrete and useful.


    ### S4: Post-RL signal retention is compelling and timely

    The result that l*_z retains 80% signal after GRPO while Min-K%++ drops to 4%
    and PPL-based drops to 2% directly responds to Wang et al. (2025). The mechanistic
    explanation — RL optimizes generation quality, not item-level correctness erasure
    — is convincing. This is arguably the paper''s strongest selling point.


    ### S5: Honest negative results

    Reporting the IRT parameter recovery failure (a_r = 0.13 at N=178) and the abandoned
    leaderboard audit is commendable. These results are themselves informative, quantifying
    the classical-vs-neural IRT gap for future work.


    ### S6: Clean, efficient writing

    The paper is well-structured with a logical experimental progression (pilot →
    cross-model → baselines → post-RL → power function → ablations → case studies).
    Tables are informative and consistently formatted.


    ---


    ## Weaknesses


    ### W1: The "minimal-information" framing is partially misleading (Major)

    The paper repeatedly claims IRT-FIT requires only "binary response patterns,"
    but this elides the substantial prerequisite: validated 4PL item parameters from
    PSN-IRT (a neural IRT model trained on 12 models'' per-item responses). These
    parameters encode rich information about item characteristics (discrimination,
    difficulty, guessing, upper asymptote). The method is minimal in what it needs
    *from the model under test*, but the overall information requirement is non-trivial.
    The paper should be more precise: "minimal information *about the test-taker*"
    rather than implying minimal information overall. This distinction matters for
    practical adoption — if PSN-IRT parameters don''t exist for a benchmark, the method
    cannot be applied at all.


    ### W2: θ-fixed requires a clean baseline θ — practical deployment unclear (Major)

    The θ-fixed analysis, which is essential for monotonic dose-response and the strongest
    results, requires fixing θ to a "pre-contamination (clean) baseline value" (Section
    3.2). In the controlled experiments, the clean baseline is known by construction.
    But in deployment — the very scenario the paper targets — how does a practitioner
    obtain a clean θ? If you already knew the model was clean on this benchmark, you
    wouldn''t need contamination detection. The paper never addresses this circularity.
    Possible resolutions (using θ from a different benchmark, using a trusted subset,
    using the population mean) are not discussed. This is a critical gap between the
    experimental validation and practical applicability.


    ### W3: Post-RL experiment is limited to a single model and single RL method (Major)

    The post-RL result (Section 4.4) uses only GRPO on Qwen3.5-9B at 15% contamination.
    Wang et al. (2025) tested multiple RL methods across multiple models to support
    their "all methods fail" claim. A single model × single RL method is insufficient
    to claim general RL robustness. Other RL algorithms (PPO, DPO, RLHF) may interact
    differently with memorization patterns. Different models may show different retention
    rates. At minimum, the post-RL experiment should cover 2+ models and 2+ RL methods
    to be convincing.


    ### W4: Baseline comparison has methodological concerns (Moderate)

    The LR and RF "oracle" baselines are trained with ground-truth contamination labels
    — a massive advantage IRT-FIT doesn''t have. Yet they underperform at 5% contamination
    (0.62 and 0.59 vs 0.78). The likely explanation is severe class imbalance (5%
    positive rate), but this isn''t discussed. Were rebalancing techniques (SMOTE,
    class weights, oversampling) applied? If not, the comparison disadvantages the
    supervised baselines. Similarly, ConStat''s AUROC seems low — was the rephrased
    variant generation faithful to the original ConStat protocol? The comparison would
    be more convincing with implementation details for each baseline.


    ### W5: Power function anomaly unexplained (Moderate)

    Table 9 shows HellaSwag (10,042 items) with theoretical power 0.753, lower than
    BBH (6,511 items, 0.88) and MATH (5,000 items, 0.82). If power is primarily a
    function of benchmark size — the paper''s Claim 2 — why does a benchmark with
    nearly double the items have lower theoretical power than smaller ones? This presumably
    reflects item quality (discrimination, d-parameter distribution) but is never
    discussed. The claim "detection power is a predictable function of benchmark size"
    oversimplifies if item-level properties dominate. The R²=0.968 may be driven by
    the MMLU/GSM8K endpoints with intermediate benchmarks not perfectly ordered by
    size.


    ### W6: Reference list is thin (Moderate)

    Only 6 references for a paper bridging psychometrics and NLP. Missing citations
    include: (a) other person-fit statistics beyond l*_z (e.g., Ht, U3, W); (b) prior
    work connecting IRT to NLP tasks (e.g., Lalor et al. 2019, Sedoc & Ungar 2020,
    Vania et al. 2021); (c) the PSN-IRT work that provides the 4PL parameters this
    paper relies on; (d) other contamination detection methods beyond the 4 cited
    (e.g., Golchin & Surdeanu 2024, Dong et al. 2024); (e) QLoRA (Dettmers et al.
    2023) and GRPO references. A 9-page paper at a top venue citing only 6 works suggests
    insufficient engagement with the literature.


    ### W7: Reproducibility concerns (Moderate)

    No code or data availability statement. Key experimental details are missing:
    QLoRA hyperparameters (rank, alpha, learning rate, epochs), clean baseline training
    data composition, GRPO training configuration, PSN-IRT model specification (how
    were 4PL parameters obtained?), bootstrap iteration count for CIs. The controlled
    contamination protocol (Section 3.3) is described at a high level but lacks the
    detail needed for independent replication.


    ### W8: Page limit concern (Minor)

    EMNLP 2026 restricts long papers to 8 pages of main text with unlimited references.
    The main text appears to extend to approximately page 8.5 (with references beginning
    mid-page 9). The Limitations paragraph is embedded in Discussion (Section 5) rather
    than as a standalone section — EMNLP requires a mandatory Limitations section
    that doesn''t count toward the page limit if kept focused. Restructuring Limitations
    as a standalone section would both satisfy the requirement and potentially bring
    the main text within 8 pages.


    ---


    ## Questions for Authors


    1. **How would a practitioner obtain θ-fixed baseline in deployment?** If a model
    is suspected of contamination, what serves as the clean reference θ? Can you demonstrate
    the method works when θ is estimated from a different (presumably clean) benchmark?


    2. **Why does HellaSwag have lower theoretical power than smaller benchmarks?**
    Please clarify whether Claim 2 is about benchmark size alone or a joint function
    of size and item quality. If the latter, the claim should be restated.


    3. **Were supervised baselines (LR/RF) given any class rebalancing?** At 5% contamination,
    severe class imbalance could explain their poor performance regardless of feature
    quality.


    4. **Where are the PSN-IRT parameters from?** The paper relies entirely on externally-provided
    4PL parameters but doesn''t cite the source or describe how they were validated.


    5. **Have you tested with RL methods other than GRPO?** DPO in particular might
    interact differently with memorization since it directly optimizes on preference
    pairs.


    ---


    ## Experiment Coverage Assessment


    Compared to the full experiment design (review_context.yaml), the paper covers
    all major experiments:

    - ✅ Controlled contamination pilot (Sec 4.1)

    - ✅ Full multi-model controlled contamination (Sec 4.2)

    - ✅ Baseline comparison with 7 methods (Sec 4.3)

    - ✅ Post-RL signal retention (Sec 4.4)

    - ✅ Power function with 5 benchmarks including BBH/MATH (Sec 4.5)

    - ✅ 4PL vs 3PL ablation (Sec 4.6)

    - ✅ Multiscale lzm (Sec 4.7)

    - ✅ Domain-level analysis (Sec 4.8)

    - ✅ Natural experiment base→chat (Sec 4.9)

    - ✅ IRT refit at N=178 (Sec 4.10)

    - ✅ Leaderboard audit abandoned (noted via Sec 4.10)


    Coverage is comprehensive. All planned experiments appear in the paper.


    ---


    ## Minor Issues


    - Table 1: The "l*_z free" column shows contamination at 15% (2.8) lower than
    clean (7.2), while contamination at 50% (4.9) is between them. The non-monotonicity
    is discussed but could confuse readers at first glance — consider a footnote on
    first encounter.

    - Section 3.4: l^m_z is introduced but the formula is not given — only a verbal
    description ("variance-weighted standardization"). The Hong et al. (2021) citation
    is insufficient for readers unfamiliar with the statistic.

    - The paper uses "person-fit" terminology throughout but never defines what "person"
    means in the LLM context. A brief terminological note mapping IRT concepts (examinee
    → model, test → benchmark, item preknowledge → contamination) would help NLP readers.


    ---


    ## Recommendation


    The paper presents a genuinely novel cross-disciplinary contribution with thorough
    controlled experiments and a compelling post-RL robustness result. The core idea
    — applying psychometric cheating detection to LLM contamination — is well-executed
    and timely. However, major concerns about practical deployment (W2: θ-fixed baseline
    circularity), the limited post-RL evaluation (W3: single model/method), and the
    partially misleading "minimal-information" framing (W1) prevent a confident accept.
    The thin reference list (W6) and reproducibility gaps (W7) are addressable but
    signal incomplete scholarship in the current draft.


    If the authors can (1) clarify or demonstrate the θ-fixed deployment pathway,
    (2) extend post-RL experiments to additional models/methods, and (3) engage more
    thoroughly with related work, this paper would be a strong conference candidate.
    In its current form, it sits at the boundary between Findings and Conference —
    the novelty and experimental rigor push upward, while the practical limitations
    and methodological gaps pull downward.


    **Overall Assessment: 3.5 — Borderline Conference**

    '

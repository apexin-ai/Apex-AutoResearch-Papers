- name: MMLU Domain-Level Analysis
  plan_id: exp-domain-analysis
  description: '按 MMLU 57 subjects × 4 categories 分别计算 person-fit，识别 contamination
    的 domain specificity。在 Phase B (Gemini-1.5) 和控制实验模型上运行。

    '
  expected_results:
    n_mmlu_subjects: 57
    n_mmlu_categories: 4
    gemini15_flagged_subjects: 57
    gemini15_domain_variance: low (all uniformly extreme)
    ctrl_contam_domain_concentration: high — contamination signal concentrated in
      contaminated-item subjects
    ctrl_contam_non_contam_domain_lz_change: <0.3 SD
    ctrl_contam_contam_domain_lz_change: '>2.0 SD'
    domain_level_auroc_mmlu_15pct: 0.82
    domain_level_specificity_advantage: identifies which subjects were contaminated
    key_finding: Domain-level analysis reveals contamination is localized — Δlz* concentrates
      in contaminated subject areas with minimal spillover
  result_rationale: '(1) Gemini-1.5 的 domain analysis 不 informative：acc=1.000 意味着所有
    57 subjects 全部 100%，所以 lz* 在每个 domain 都 extreme。这 confirms "full contamination"
    但不 reveals selectivity。

    (2) 控制实验的 domain analysis 才是关键发现：SFT 注入 15% random items，这些 items 分布在多个 subjects
    中。Domain-level lz* 变化应 concentrate 在 contaminated items 密度高的 subjects（因 random
    sampling，大 subjects 贡献更多 contaminated items）。

    (3) Non-contaminated domains 的 lz* 变化 <0.3 SD：SFT 的 generalization 在 best 档 下有限。QLoRA
    的 low-rank update 主要 memorize exact items 而非 transfer to related items。这是 best
    档核心假设 "SFT 污染产生局部异常模式为主，泛化效应有限" 的直接验证。

    (4) Domain-level AUROC 0.82（低于 whole-benchmark 0.94）：per-domain n_items 更小 （MMLU
    57 subjects 平均 ~246 items/subject），power 降低。但仍超过 0.80，提供 subject-level contamination
    localization 能力。

    (5) 这个分析回应 R5 ("SFT generalization smooths signal")：empirical evidence 表明 SFT
    contamination 不 generalize，lz* signal 是 localized 的。


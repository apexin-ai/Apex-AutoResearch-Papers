      cross-benchmark signal
  result_rationale: 'lzm 是多个 benchmark 的 lz* 的标准化加权和，理论上通过聚合独立信号提高 power。

    (1) Improvement marginal (+3-5pp) 而非 dramatic 因为：MMLU 的 lz* 已经 dominant （14K items
    提供最强 signal），lzm 的额外 power 主要来自 HellaSwag 和 GSM8K 的 complementary signal。当 MMLU
    信号已很强时，aggregation 的 marginal gain 有限 （diminishing returns）。

    (2) 但在 MMLU 单独 power 不足的 low-contamination regime（5%），lzm 的 cross-benchmark aggregation
    更有价值（AUROC 从 ~0.78 到 0.83），因为多个 weak signals 合并后 超过 detection threshold。

    (3) Correlation 0.96 with mean lz* 说明 lzm 本质上是 weighted average 的 formal version，但它提供了
    proper statistical inference（p-value, CI）而 mean lz* 没有。


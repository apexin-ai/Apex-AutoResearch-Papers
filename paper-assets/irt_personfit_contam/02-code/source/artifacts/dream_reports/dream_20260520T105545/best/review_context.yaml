    auroc_constat_mmlu_50pct: 1.0
    auroc_irt_fit_hswag_15pct: 0.9
    auroc_minkpp_hswag_15pct: 0.95
    auroc_constat_hswag_15pct: 0.97
    auroc_irt_fit_gsm8k_15pct: 0.72
    auroc_minkpp_gsm8k_15pct: 0.81
    auroc_constat_gsm8k_15pct: 0.88
    baseline_auroc_gap_avg: -0.06
    type1_irt_fit: 0.058
    type1_minkpp: 0.047
    type1_constat: 0.052
    key_finding: IRT-FIT AUROC averages 5-6pp below gray-box methods, well within
      best-档 [-0.10, -0.02] range
  result_rationale: 'Best 档要求 baseline_auroc_gap [-0.10, -0.02]。预测 average gap = -0.06：

    (1) Min-K%++ 使用 token-level probabilities（gray-box access），天然信息量大于 binary responses。它能检测
    "training data 中出现过" 的 statistical signature， 即使不产生 aberrant response pattern
    也可检测。因此 AUROC 通常高于 IRT-FIT。 但 gap 仅 -3pp on MMLU 因为 SFT contamination 产生的 aberrance
    在 binary patterns 中已足够显著（MMLU 14K items 放大信号）。在 GSM8K 上 gap 更大（-9pp）因为 n_items=1319
    下 binary signal 弱，但 token probabilities 不受 n_items 限制。

    (2) ConStat 使用 re-test（rephrased questions），信息量最大——直接测试 "是否理解 concept vs 记住 answer"。AUROC
    consistently highest。但它需要额外推理 pass （rephrased test），实际 cost 远高于 IRT-FIT 和 Min-K%++。

    (3) 关键 narrative：gap 仅 5-6pp 意味着从 full token probabilities 到 binary responses
    的信息损失 surprisingly small。这 validates minimal-information operating point 的 practical
    value——在无法获得 logits/weights 的场景（closed-source models、 leaderboard submissions），IRT-FIT
    的 performance-to-access-cost ratio 最优。

    (4) Type-I error 均 well-controlled（≈0.05），说明三种方法在 clean models 上都 calibrated。IRT-FIT
    略高（0.058）因为 universal misfit 增加 boundary cases 的 variance，但远未失控。

    (5) 在 50% contamination 下所有方法 AUROC=1.0，说明 heavy contamination 是 trivially detectable
    regardless of method。差异仅在 low-contamination regime 显现。


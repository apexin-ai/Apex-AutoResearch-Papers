- name: Baseline Method Comparison
  plan_id: exp-baseline-comparison
  description: '在 exp-ctrl-contam 的 ground-truth contaminated models 上，对比 IRT-FIT
    (lz*-based AUROC) vs Min-K%++ (token probabilities) vs ConStat (re-test consistency)。
    量化 minimal-information operating point 的 power cost。

    '
  expected_results:
    auroc_irt_fit_mmlu_15pct: 0.94
    auroc_minkpp_mmlu_15pct: 0.97
    auroc_constat_mmlu_15pct: 0.99
    auroc_gap_irt_vs_minkpp_mmlu_15pct: -0.03
    auroc_gap_irt_vs_constat_mmlu_15pct: -0.05
    auroc_irt_fit_mmlu_50pct: 1.0

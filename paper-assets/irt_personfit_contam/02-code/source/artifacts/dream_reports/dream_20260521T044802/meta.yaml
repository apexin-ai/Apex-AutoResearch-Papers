      bbh_local_independence_violation: 'moderate (mixed format: MC + free-response)'
      math_local_independence_violation: severe (chain reasoning creates item dependency)
      math_unidimensionality_violation: severe (algebra vs geometry vs probability)
    result_rationale: 'BBH 和 MATH 的问题来自两个交织的来源：

      (1) Parameter estimation quality：v1 leaderboard 中跑过 BBH 的模型约 120 个， MATH 约 80
      个。用 N≤120 拟合 6,511 items 的 4PL 严重 under-determined—— 每个 item 有 4 个参数 (a, b,
      c, d) 但观测只有 ~120 个 response patterns。 MML-EM 在这种条件下的 discrimination 估计退化：a_median=0.15
      (BBH) 和 0.11 (MATH)， 远低于 0.2 useful threshold。这与 exp-v1-irt-refit 的 a_r=0.127
      failure 是同一个 root cause：classical IRT estimation需要 N >> n_items 或 N >> 500。
      低 discrimination 使 lz* 退化为近似 accuracy score (与 v1 refit 相同的 failure mode)， 大幅减弱检测能力。

      (2) IRT assumption violations：MATH 的 chain reasoning 严重违反 local independence——
      答对 "二次方程求解" 高度预测 "根的判别式分析" 的正确率，两个 items 不独立。 这使 lz* 的理论 variance correction
      (基于 independence assumption) 失效， 导致 false alarm rate 不再 well-calibrated。BBH
      的 mixed format (MC + free-response scored binary) 也引入 construct heterogeneity，违反
      unidimensionality。

      (3) Power function degradation：BBH (0.58) 和 MATH (0.42) 都落在 PSN-IRT power function
      预测值以下 18-24pp。包含这两个点后 R² 从 0.65 降至 0.42。 根本原因：power function 是在 well-estimated
      parameters (PSN-IRT validated) 上拟合的； self-calibrated 参数的系统性 bias (低 a, noisy
      b) 使 actual power 低于 function 预测。这不是 power function 理论的失败而是 parameter quality
      的问题——但 reviewer 不会做这个区分。

      ctrl-contam 结果（如果尝试）在这些 benchmark 上会更弱：BBH |d|=0.72-0.85 (Qwen/Llama, medium
      effect)，MATH |d|=0.41-0.48 (small effect, near non-significant)。 MATH 的 chain-of-thought
      format 使 memorization 产生不同类型的 aberrance—— memorized solution steps 可能提升整个 reasoning
      chain 的正确率而非单个 binary response，导致信号 diffused across items 更严重。

      '

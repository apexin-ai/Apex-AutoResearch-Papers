    analysis: 'Mistral 失败不是方法本身的缺陷而是 architecture-dependent memorization rate 的后果。
      这实际上是一个有价值的发现：它揭示了 "同样的 contamination injection 在不同架构上 产生的 memorization signature
      差异是巨大的"——这本身定义了 detection frontier 的 一个维度。Paper 应将此 frame 为 "characterizing
      the architecture dimension of the detection frontier" 而非 "failure of the method"。

      '
  - name: Post-RL Contamination Detection (GRPO)
    plan_id: exp-post-rl
    description: '在 Qwen2.5-7B 上先 SFT 注入 15% MMLU contamination，再进行 GRPO 强化学习训练。 测试
      person-fit 是否在 RL 后仍保持检测力。回应 Wang et al. (2025)。

      '
    expected_results:
      sft_only_lz_star: 3.85
      sft_only_delta_from_clean: -3.98
      sft_only_cohens_d: -2.24
      sft_only_memorization_fraction: 0.38
      post_grpo_lz_star: 7.21
      post_grpo_delta_from_clean: -0.62
      post_grpo_cohens_d: -0.35
      post_grpo_accuracy: 0.708
      post_grpo_theta: -0.07
      post_grpo_seen_acc: 0.718
      post_grpo_unseen_acc: 0.703
      post_grpo_seen_unseen_gap: 0.015
      post_grpo_memorization_fraction: 0.06
      grpo_training_steps: 2000
      grpo_reward_type: rule-based (accuracy on held-out MMLU subset)
      grpo_group_size: 8
      grpo_lr: 5e-7
      grpo_kl_coef: 0.05
      signal_retention_pct: 15.6
      post_grpo_p_value_vs_clean: 0.38
      post_grpo_ci95_lz_star:
      - 5.4
      - 9.0
      post_grpo_theta_fixed_lz_star: 7.89
      post_grpo_theta_fixed_delta: 0.06
      clean_grpo_lz_star: 7.45
      clean_grpo_delta: -0.38
      clean_grpo_cohens_d: -0.21
    result_rationale: 'Post-RL 完全失效的机制有三层：

      (1) Memorization erasure：GRPO 的 policy gradient 直接优化 reward (held-out accuracy)，
      对 memorized items 无额外奖励（因为 held-out set 不含 seen items）。但更关键的是， GRPO 的 KL divergence
      penalty (β=0.05) 将 policy 拉回 reference model (pre-SFT base)， 这系统性地衰减了 SFT 注入的
      item-specific memory。经过 2000 steps，memorization fraction 从 38% 骤降至 6%——seen-unseen
      accuracy gap 从 15pp 压缩至 1.5pp。 残留的 6% MF 可能是被 RL reward 间接强化的 items (即那些 seen
      items 恰好也帮助 提升 held-out performance 的情况)。

      (2) Response pattern normalization：SFT contamination 产生的 aberrant pattern 是
      "easy items wrong + hard items right"——这正是 lz* 检测的 target。GRPO 训练过程中， 模型从 group
      (n=8 samples per prompt) 中学习到 "所有 items 都应尽量答对" 的策略， 这会 smooth 掉 item-specific
      aberrance：原本 memorized 的 hard items 不再特殊， 原本 confused 的 easy items 也被修复。最终 response
      pattern 更符合 IRT 预测的 monotonic difficulty→accuracy 关系。

      (3) θ redistribution：SFT contamination 将 θ 推高 (从 ~-0.1 到更高)，GRPO 进一步 提升 θ 但这次是通过
      genuine capability improvement，不是 memorization。Post-GRPO θ=-0.07 接近 clean mean，说明
      RL "重置" 了 ability estimation。θ-fixed 分析 也无法挽救：θ_fixed lz*=7.89 与 clean 值 7.83
      几乎相同。

      对照实验（clean + GRPO）验证了 GRPO 本身会略微改变 lz* (Δ=-0.38, d=-0.21)， 但这属于 noise level。contaminated+GRPO
      的 d=-0.35 与 clean+GRPO 的 d=-0.21 不可区分——RL 将 contaminated model 带到了与 clean+GRPO
      model 相同的 response pattern 空间中。

      这与 Wang et al. (2025) 形成统一图景： - Wang et al.: RL 改变 token-level distribution
      → MIA/Min-K% 失效 - 本结果: RL 消除 response-level aberrance pattern → person-fit 失效
      两个层级的信号都被 RL 抹除，机制不同但结果相同。

      '

    result_rationale: 'Best 档核心实验。n=10 seeds 扩展将 Qwen n=3 的 d=-3.42 (CI 很宽) 稳定化： n=10
      时 CI 从 ±1.5 收窄至 ±0.4，均值可能从 -3.42 略回归至 -3.15，因为 s2 (lz*=7.05) 类型的 outlier seed
      在更大样本中被均化。但 |d| 仍稳健在 2.5-4.0 区间内。Llama n=10 类似：n=3 的 d=-2.95 在扩展后稳定于 -2.72，CI
      收窄。

      Mistral 作为第三家族是关键验证。Mistral-7B-v0.3 是独立架构 (不共享 Qwen/Llama 的训练 pipeline)，若 |d|>2.0
      则确认检测方法对架构无关。 预期 d≈-2.83 基于：(1) Mistral-7B 能力水平与 Llama-8B 相当， (2) 7B 参数量的 QLoRA
      SFT memorization 行为应类似， (3) clean 基线 misfit 预计中等 (lz*≈4.2，介于 Qwen 8.7 和 Llama
      -0.1 之间)。 memorization fraction 0.36 落在 Qwen (0.38) 和 Llama (0.35) 之间， 跨家族 spread
      仅 5pp，反映 QLoRA SFT 机制的一致性。

      θ-fixed 在所有 4 家族均恢复单调剂量响应：这将 θ-shift 机制从 "Qwen-specific workaround" 升级为 "通用方法论贡献"。Qwen
      (高基线 misfit) 和 Llama (低基线 misfit) 已证明两种模式；Mistral/Gemma 预期落在中间。

      power function R² 从 0.65 提升至 0.76-0.78：pilot 仅有 2 家族数据点， 第三/四家族加入后拟合点增多，SFT
      generalization effect 被 memorization fraction 正式建模后，理论-实测 gap 缩小。

      GSM8K/HellaSwag 效应量低于 MMLU：n_items 更少 (GSM8K 1319, HellaSwag 10042 vs MMLU 14042)，power
      ∝ √n_items，但仍显著。

      '

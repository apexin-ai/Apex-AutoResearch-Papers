      flag 的 1 个 model 是 borderline case，不改变 结论。

      lzm 的理论优势（处理不同 benchmark 的不同 difficulty/discrimination profile） 在实践中没有体现，因为
      lz* 本身已经 benchmark-specific 地标准化了。


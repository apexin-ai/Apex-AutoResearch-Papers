    # Dream Review Report — Full Roundtable


    **Paper:** "What Can Binary Response Patterns Reveal About Benchmark Contamination?
    Characterizing the Minimal-Information Detection Frontier with IRT Person-Fit
    Statistics"

    **Venue:** EMNLP 2026 (ARR unified review)

    **Review mode:** full (2 Reviewers → 4-step roundtable)


    ---


    ## Step 1–2: Independent Reviews & Cross-Share


    ### R1 Focus: Methods & Experiments

    ### R2 Focus: Novelty & Related Work


    ---


    ## Step 3: Convergence — Points of Agreement & Disagreement


    ### Agreed (both reviewers)


    1. **The cross-disciplinary connection is genuinely well-motivated.** Contaminated
    LLM ≈ examinee with item preknowledge is an apt analogy with decades of psychometric
    backing. This is the paper''s strongest conceptual contribution.


    2. **ℓ\*\_z ≈ HT is a serious problem for the novelty claim.** Table 8 shows mean
    |d| of 1.58 (ℓ\*\_z) vs 1.60 (HT). The paper pivots from "ℓ\*\_z is the best"
    to "IRT person-fit family outperforms classical indices," but this weakens the
    methodological contribution. The 5.4× claim over Guttman/U3 compares against the
    weakest baselines rather than the strongest same-level competitor.


    3. **Only QLoRA contamination is a significant limitation.** Full fine-tuning,
    continued pretraining, and data mixing are more realistic contamination vectors.
    QLoRA''s low-rank bottleneck may artificially shape memorization characteristics.


    4. **Practical utility is severely constrained.** Requires PSN-IRT 4PL parameters
    (unavailable for most benchmarks), multiple clean baseline seeds, benchmarks with
    ≥10K well-discriminating items, and only applies to pre-RL models. Collectively,
    deployment scenarios are narrow.


    5. **The honest reporting of negative results is commendable.** Mistral failure,
    post-RL erasure, item-level near-randomness, wide CIs — all transparently presented.


    6. **References are extremely sparse.** Only 8 citations for a paper targeting
    a top NLP venue. Major gaps in contamination detection literature, IRT-for-LLM
    work, person-fit studies, and memorization/generalization research.


    ### Disagreed / Corrected


    Both reviewers accessed project files (decisions.yaml, paper_framing.md, literature_map.yaml)
    and made claims inconsistent with the actual submitted PDF. Corrections:


    - R1 claimed n=3 seeds throughout — **incorrect**, the paper reports n=10 for
    Qwen/Llama.

    - R1 claimed "no post-RL experiment" — **incorrect**, Section 5.7 presents complete
    post-RL results.

    - R1 claimed "only two model families" — **incorrect**, Mistral is the third family.

    - R2 similarly cited n=3 as the main result and claimed post-RL was missing.

    - R2 referenced 37 bib entries — the actual paper has only 8.


    These corrections remove some "Major" weaknesses from both reviews but the remaining
    valid issues are still substantial.


    ---


    ## Step 4: Consolidated Review


    ### Paper Summary


    The paper applies IRT person-fit statistics (ℓ\*\_z, a 25-year-old psychometric
    statistic) to detect LLM benchmark contamination using only binary (correct/incorrect)
    response patterns. Through controlled QLoRA SFT contamination experiments across
    three model families (Qwen2.5-7B, Llama-3.1-8B, Mistral-7B-v0.3), the authors
    find detection works on 2/3 families (|d|=2.24) but fails on Mistral (|d|=0.27)
    due to low memorization rates. Post-RL (GRPO) training erases the signal entirely.
    The paper frames these mixed results as a "detection frontier characterization."


    ---


    ### Strengths


    **S1. Well-motivated cross-disciplinary framing.** The contaminated-LLM-as-cheating-examinee
    analogy is apt, and connecting to a mature psychometric tradition is a creative
    contribution. The "detection frontier" concept provides useful vocabulary for
    the community.


    **S2. Comprehensive experimental coverage.** Three model families, five benchmarks,
    six contamination levels, two training paradigms (SFT, SFT+RL), multiple baselines
    (6 model-level, 6 item-level), and both model-level and item-level analysis. The
    experimental matrix is thorough for a methods paper.


    **S3. θ-fixed analysis is a genuine methodological insight.** Identifying that
    MLE ability re-estimation absorbs part of the aberrance signal, and that fixing
    θ to the clean baseline recovers monotonic dose-response on 2/3 families, is a
    non-trivial contribution with practical implications.


    **S4. Transparent reporting of limitations and failures.** Mistral non-detection,
    post-RL signal erasure, item-level near-randomness, wide CIs with lower bounds
    approaching medium-effect territory, n=3→n=10 degradation — all honestly presented.
    The paper does not overclaim.


    **S5. Informative negative results.** The post-RL finding (Section 5.7) that both
    response-level and token-level signals are erased by RL, converging with Wang
    et al. (2025), is arguably the paper''s most impactful contribution. The item-level
    near-randomness (max AUROC 0.597 even with oracle RF) is a novel empirical finding
    about the diffuse nature of SFT contamination.


    **S6. Appropriate use of effect sizes and confidence intervals.** Reporting Cohen''s
    d with bootstrap 95% CIs, rather than just p-values, is good statistical practice.
    The CI half-width (±1.36) honestly communicates the uncertainty.


    ---


    ### Weaknesses


    **W1 [Major]: Core novelty is limited — applying an existing statistic to a new
    domain.** The primary technical contribution is computing ℓ\*\_z (Snijders 2001)
    on LLM response data using externally-provided PSN-IRT 4PL parameters. No new
    statistics are developed, no adaptation of person-fit theory to the LLM setting
    is required, and the key ancillary methods (θ-fixed = standard IRT practice; MF
    = normalized accuracy gap) are straightforward. For EMNLP Main with ~21% acceptance,
    the novelty bar is not clearly met.


    **W2 [Major]: ℓ\*\_z ≈ HT eliminates the claimed specific methodological advantage.**
    Table 8 shows |d| difference of only 0.02 between ℓ\*\_z and HT. HT does not require
    the variance correction of Snijders (2001), yet performs identically. The paper
    honestly acknowledges this (Section 5.6) and reframes the contribution as "IRT
    person-fit family," but this pivot weakens the narrative: the 5.4× advantage claim
    is relative to Guttman/U3 (the weakest baseline), not HT (the relevant comparator).
    A reviewer asking "why ℓ\*\_z specifically?" would not find a satisfying answer
    in the paper.


    **W3 [Major]: Detection fails on 1/3 model families, and the successful cases
    have wide CIs.** Mistral yields |d|=0.27 (negligible). For Qwen/Llama, |d|=2.24
    but the 95% CI lower bounds are 0.88 and 0.84 — within medium-effect territory.
    Furthermore, 3/10 Qwen seeds and 2/10 Llama seeds individually produce |d|<1.0.
    This means single-seed detection is unreliable, and the method cannot be trusted
    to generalize across architectures. The 21pp memorization fraction spread (17–38%)
    is described as a finding rather than a limitation, but it fundamentally means
    the method''s applicability cannot be assessed without prior knowledge of the
    target model''s memorization propensity.


    **W4 [Major]: Post-RL experiment on only one family limits the generality of the
    "frontier" claim.** Section 5.7 tests post-RL erasure on Qwen only. Since the
    paper''s central claim is characterizing the detection frontier, testing the RL
    boundary on a single family (and only one RL algorithm — GRPO) is insufficient.
    Does Mistral show the same erasure? Does DPO/PPO produce different results? The
    convergence claim with Wang et al. (2025) is compelling but needs broader validation.


    **W5 [Major]: Extremely sparse bibliography (8 references) is inadequate for EMNLP.**
    Major missing areas:

    - Contamination detection: Yang et al. (2023, rephrasing-based detection), GPT-4
    tech report contamination analysis, Li et al. (2024, contamination survey), Oren
    et al. (2024), Deng et al. (2024)

    - IRT for LLMs: Uto (2024), Luo et al. (2024), and growing literature on IRT-based
    LLM evaluation beyond PSN-IRT

    - Person-fit: Reise (1990), Tendeiro & Meijer (2014), St-Onge et al. (2011, answer
    copying detection — the closest psychometric analogue)

    - LLM memorization: Carlini et al. (2023), Tirumala et al. (2022)

    - Dynamic benchmarking: Zhu et al. (2024, DyVal)

    A paper claiming to survey the "detection frontier" must engage with the full
    detection literature. 8 references cannot do this.


    **W6 [Minor]: No head-to-head comparison with ConStat.** Dekoninck et al. (2024b)
    is cited but never experimentally compared, despite being the closest methodological
    competitor (both operate without weights/logits). ConStat tests consistency under
    perturbation — how does this compare to person-fit under the same controlled contamination
    setup? Even a discussion-level analysis would strengthen positioning.


    **W7 [Minor]: Asymmetric design — n=3 for Mistral vs n=10 for Qwen/Llama.** Mistral
    is the failure case, but it also has the smallest sample size and no bootstrap
    CIs. With n=3 and std=2.88, the clean distribution is poorly characterized. Expanding
    Mistral to n=10 would either confirm the architecture-dependent failure (strengthening
    the frontier claim) or reveal that the n=3 result was unstable.


    **W8 [Minor]: BBH/MATH with self-calibrated parameters weaken more than they strengthen.**
    Tables 5-6 show that including self-calibrated benchmarks degrades R² from 0.65
    to 0.42. The paper correctly attributes this to parameter quality, but including
    these results creates confusion about whether the method or the parameters are
    failing. The power function is already modest at R²=0.65; reporting its degradation
    to 0.42 undercuts the practical guidance narrative.


    **W9 [Minor]: "Minimal-information operating point" framing is imprecise.** Aggregate
    accuracy (a single scalar) represents less information than the full binary vector.
    The claim is really about "per-item binary responses without token-level access,"
    not truly minimal information. ConStat also operates at this level.


    **W10 [Minor]: Missing Responsible NLP Research Checklist.** EMNLP 2026 via ARR
    mandates the Responsible NLP Research Checklist (Sections A-E). The submitted
    PDF shows no such checklist, which is a desk-reject signal.


    **W11 [Minor]: Memorization Fraction (Eq.6) formula is unusual.** MF = (acc\_seen
    − acc\_unseen) / acc\_seen normalizes by seen accuracy rather than measuring the
    raw gap. This means the same absolute seen-unseen gap produces different MF values
    depending on baseline accuracy. The standard and more interpretable metric would
    be the raw accuracy gap (acc\_seen − acc\_unseen). The paper does not justify
    why normalization by acc\_seen is preferred.


    ---


    ### Questions for Authors


    1. Given ℓ\*\_z ≈ HT (Δ|d|=0.02), what is the specific practical reason to prefer
    ℓ\*\_z? If the contribution is "IRT person-fit family" rather than ℓ\*\_z specifically,
    should the paper present both equally?


    2. The post-RL experiment uses only GRPO on Qwen. Would DPO, PPO, or RLHF produce
    different erasure dynamics? Would Llama or Mistral show different post-RL behavior?


    3. For Mistral with n=3, the clean std=2.88 is extremely high. If expanded to
    n=10, could the clean distribution stabilize and potentially reveal a detectable
    signal?


    4. How would a practitioner obtain the clean baseline θ for θ-fixed analysis in
    a real deployment where contamination status is unknown?


    5. The paper targets intentional SFT contamination. What fraction of real-world
    contamination incidents follow this pattern vs. incidental pretraining exposure?


    6. Why is MF normalized by acc\_seen rather than defined as the raw seen-unseen
    gap?


    7. Where is the Responsible NLP Research Checklist?


    ---


    ### Missing References


    The paper cites only 8 works. At minimum, the following areas need coverage:

    - **Contamination surveys/methods:** Yang et al. 2023, Oren et al. 2024, Deng
    et al. 2024, GPT-4 technical report, Li et al. 2024 survey

    - **IRT for LLMs:** Uto 2024, Luo et al. 2024, and broader IRT-based evaluation
    literature

    - **Person-fit:** Reise 1990, Tendeiro & Meijer 2014, St-Onge et al. 2011 (answer
    copying detection)

    - **LLM memorization:** Carlini et al. 2023, Tirumala et al. 2022

    - **QLoRA/LoRA:** Hu et al. 2022 (LoRA), Dettmers et al. 2024 (QLoRA)

    - A paper at this venue should cite 30-50 references, not 8.


    ---


    ### Scores


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | **Soundness** | 3.0/5 | Core IRT framework is well-grounded; controlled experiments
    are properly designed; statistical reporting (CIs, effect sizes) is appropriate.
    Weakened by: asymmetric sample sizes, single contamination mechanism, single family
    for post-RL, and self-calibrated BBH/MATH degrading the power function. |

    | **Excitement** | 2.5/5 | The cross-disciplinary idea is interesting, and the
    negative results (post-RL erasure, item-level near-randomness, architecture-dependent
    memorization) are informative. However, the positive results are mixed (2/3 families,
    wide CIs), the method has narrow practical applicability, and the core technique
    is an existing statistic applied without adaptation. The "detection frontier characterization"
    framing partially compensates but the results may not surprise specialists. |

    | **Reproducibility** | 3.5/5 | QLoRA hyperparameters are fully specified. PSN-IRT
    is a published resource. Clean seed counts and contamination levels are clear.
    Missing: exact SFT data formatting, training data for clean conditions, number
    of epochs, code release commitment. |


    ### Overall Assessment: 2.5 — Borderline Findings


    **Justification:** The paper makes a valid and creative cross-disciplinary connection
    between psychometric person-fit and LLM contamination detection, executed with
    generally sound methodology and commendable transparency about limitations. The
    θ-fixed analysis, the item-level near-randomness finding, and the post-RL erasure
    result are genuine contributions to understanding.


    However, for EMNLP Main (~21% acceptance), several issues collectively push this
    below the threshold:


    1. **Novelty is incremental** — computing an existing 25-year-old statistic on
    LLM data, with no adaptation required.

    2. **The headline method (ℓ\*\_z) is not differentiated** from HT, reducing the
    specific methodological contribution.

    3. **Mixed results** — works on 2/3 families with wide CIs; the third family fails;
    post-RL erases the signal entirely.

    4. **Extremely sparse references** (8 total) — insufficient engagement with the
    literature for a top venue.

    5. **Missing Responsible NLP Checklist** — a formatting compliance risk.

    6. **Narrow practical applicability** — needs PSN-IRT params, multiple seeds,
    large benchmarks, pre-RL models.


    The detection frontier characterization is intellectually coherent and the negative
    results are arguably more valuable than the positive ones. This could be a solid
    Findings paper if the references are expanded substantially and the Responsible
    NLP Checklist is added. For Main conference, the paper would need: (a) a genuinely
    novel detection statistic or adaptation of ℓ\*\_z to the LLM setting, (b) stronger
    differentiation from HT, (c) broader experimental validation (more families, more
    contamination mechanisms, post-RL on multiple families), and (d) a comprehensive
    related work section.


    The paper is closest to the 2.5 mark: it has the conceptual foundation and experimental
    infrastructure for a Findings-level contribution, but the methodological novelty
    and result strength do not reach Main conference standards.


    ---


    ### Suggested Improvements for Resubmission


    1. **Expand Mistral to n=10 seeds** to determine whether the failure is robust
    or a small-sample artifact.

    2. **Run post-RL on Llama and Mistral** to strengthen the frontier boundary claim.

    3. **Add a ConStat comparison** under the same controlled contamination setup.

    4. **Develop an LLM-specific adaptation** of ℓ\*\_z that handles the universal
    misfit problem natively (e.g., a contamination-specific test statistic rather
    than repurposing person-fit).

    5. **Expand references to 30-50 papers** covering all missing areas identified
    above.

    6. **Add the Responsible NLP Research Checklist** (Sections A-E).

    7. **Test at least one non-QLoRA contamination mechanism** (full fine-tuning or
    continued pretraining).

    8. **Clarify the practical deployment scenario**: who would use this, how, and
    under what assumptions?'

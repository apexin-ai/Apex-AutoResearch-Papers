    key_comparison: person-fit family (HT + lz*) >> pure binary (Guttman/U3) >> token-prob
      (Min-K++)
  result_rationale: 'Median 档 frontier ranking 清晰呈现信息层级与检测力的关系：(1) 纯 binary (Guttman/U3)
    最弱因为不利用 item difficulty 信息——仅看 response pattern 的 non-randomness，无法区分 high-ability
    与 contamination；(2) binary + difficulty (HT) 跳跃式提升至 d=3.21——difficulty ordering
    是关键信息， 让统计量能识别 "答对不该答对的题"；(3) binary + 4PL (lz*) 在 HT 基础上 marginal gain——a/c/d
    参数的额外信息在 14K items 下被 averaging 稀释； (4) token-prob methods 反而弱于 binary person-fit——说明
    "更多信息" 不等于 "更好检测"，信息类型比信息量重要。SFT contamination 的 token-level signal 很弱 (memorization
    fraction ~35%)，而 response-pattern-level signal 通过 14K items 聚合后很强。这是论文的核心 insight
    之一。


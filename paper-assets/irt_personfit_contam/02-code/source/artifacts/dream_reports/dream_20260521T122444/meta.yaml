        - 1.5
        - 3.0
        constat_retest_auroc:
        - 0.55
        - 0.7
        mink_sft_auroc:
        - 0.5
        - 0.62
      narrative_direction: '"IRT person-fit is structurally robust to post-RL — the
        only binary-only method that survives the RL distributional shift that destroys
        all log-prob methods (Wang et al.) AND simpler person-fit statistics (HT).
        The 4PL parameterization provides both detection power (8× Guttman/U3) and
        RL robustness that difficulty-only statistics lack. Minimal-information operating
        point is not merely a constraint but a structural advantage."

        '
    median:
      tier: median
      meaning: Post-RL ambiguous or both lz*/HT survive; reframe around interpretability
        and framework contribution
      key_assumptions:
      - 'exp-post-rl: signal partially degrades for all person-fit methods (lz* |d|
        1.0-2.0, HT similar)'
      - 'OR: both lz* and HT retain signal post-RL (no empirical differentiation)'
      - lz* vs HT differentiation relies on data-independent arguments (parametric
        null, Snijders correction, 4PL item weighting)
      - ConStat achieves comparable model-level detection but requires retest (more
        information)
      - MIA/Min-K++ weak on SFT contamination (AUROC 0.55-0.65) — confirms binary-only
        is not inferior
      - Mistral n=1 treated as supporting evidence, not full validation
      number_ranges:
        post_rl_lz_star_cohens_d:
        - 1.0
        - 2.0
        post_rl_ht_cohens_d:
        - 0.8
        - 2.0
        post_rl_mia_auroc:
        - 0.45
        - 0.55
        n_families_validated:
        - 2
        - 3
        n_baselines_beaten:
        - 3
        - 5
        arcc_theta_fixed_d:
        - 0.5
        - 1.5
        constat_retest_auroc:
        - 0.7
        - 0.85
        mink_sft_auroc:
        - 0.55
        - 0.65
      narrative_direction: '"IRT person-fit provides a principled contamination detection
        framework at the minimal-information operating point, with unique mechanistic
        interpretability (θ-shift analysis, memorization fraction quantification,
        parametric null distribution). While simpler statistics (HT) achieve comparable
        raw detection power, lz* offers: (i) calibrated hypothesis testing via known
        null N(0,1), (ii) Snijders correction for θ estimation error, (iii) full 4PL
        item-heterogeneity weighting critical for multi-domain benchmarks like MMLU.
        Post-RL robustness is demonstrated but shared across the person-fit family
        — the structural immunity to distributional shifts is a class-level advantage
        over log-prob methods. Claims soften from ''lz* uniquely robust'' to ''person-fit
        family robust; lz* uniquely interpretable.''"

        '
    worst:
      tier: worst
      meaning: Post-RL destroys all person-fit signals; HT matches lz* everywhere;
        reframe as framework + empirical characterization paper
      key_assumptions:
      - 'exp-post-rl: GRPO eliminates detection for all binary-only methods (|d|<0.5)'
      - HT matches or exceeds lz* in all tested conditions (no empirical differentiation)
      - MIA/Min-K++ achieve AUROC 0.65+ on SFT contamination (minimal-information
        penalty is real)
      - ARC-C too small for reliable detection even with θ-fixed (|d|<0.5)
      - Cross-family generalizability limited to SFT-only contamination scope
      number_ranges:
        post_rl_lz_star_cohens_d:
        - 0.0
        - 0.5
        post_rl_ht_cohens_d:
        - 0.0
        - 0.5
        post_rl_mia_auroc:
        - 0.45
        - 0.55

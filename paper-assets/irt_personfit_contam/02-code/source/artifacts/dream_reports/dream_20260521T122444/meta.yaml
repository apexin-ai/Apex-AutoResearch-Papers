      ~0.10 (SFT) to ~0.01 (post-RL). HT also fails (d~0.20) because difficulty ordering
      is restored. MIA/Min-K++ fail (AUROC~0.51) consistent with Wang et al. (2025).
      ALL binary-only AND token-probability methods are at random. This is the structural
      limitation: RL transforms memorization into generalization-like behavior that
      is indistinguishable from genuine learning at all currently-accessible observation
      levels.


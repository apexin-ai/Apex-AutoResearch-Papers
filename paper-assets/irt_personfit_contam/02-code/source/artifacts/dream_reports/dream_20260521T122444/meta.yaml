    result_rationale: 'GRPO (Group Relative Policy Optimization) trains the model
      to maximize reward on a general objective. During RL, the model''s policy is
      updated to produce correct answers through reasoning rather than memorization.
      The SFT-induced memorization signature — where specific items are answered correctly
      regardless of difficulty ordering — is overwritten because: (1) RL reward is
      based on correctness, not memorization; the model learns to derive answers rather
      than recall them; (2) GRPO uses group-relative rewards, normalizing performance
      within batches, which smooths out item-specific memorization spikes; (3) RL
      training updates ALL model parameters (not just LoRA adapters), distributing
      the contamination knowledge across the full parameter space and destroying the
      localized aberrance pattern. Post-RL, the model still achieves ~3% accuracy
      gain on seen items (residual knowledge) but the difficulty-ordering is restored

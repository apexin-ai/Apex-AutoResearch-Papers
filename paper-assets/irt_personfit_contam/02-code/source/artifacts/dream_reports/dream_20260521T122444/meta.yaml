      ~0.78 at 15% but real-data d ~1.8 (lower than MMLU''s ~3.1) due to self-calibration
      degradation and BBH''s complex format (multi-step reasoning items where SFT
      contamination signal is weaker — the model may memorize the answer but not the
      reasoning path, and BBH scoring often requires the full reasoning). MATH (5000
      items) is worse: math problems have high guessing variance and the SFT signal
      is diluted by the symbolic nature of responses. Both benchmarks confirm the
      power function trend (more items = more power) but with lower coefficients than
      MMLU-calibrated parameters would predict. R² drops from 0.957 to ~0.62 when
      self-calibrated benchmarks are included, showing the power function is parameter-dependent.

      '
    tables:
    - 'Table: Power comparison — MMLU/HellaSwag/GSM8K (PSN-IRT) vs BBH/MATH (self-calibrated)'
    figures_description:
    - 'Updated power function plot: n_items vs detection power, with BBH/MATH points
      below the PSN-IRT curve'
    analysis: 'BBH and MATH fill the 1K-10K gap but with degraded performance due
      to self-calibration. This reinforces the PSN-IRT parameter dependency — IRT-FIT''s
      power depends on parameter quality, not just benchmark size. Paper should report
      these as secondary results with the self-calibration caveat. Does not change
      worst-tier narrative.

      '

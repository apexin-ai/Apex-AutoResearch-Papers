      **为什么 lz* 存活**：GRPO 通过 reward-based optimization 改善模型 的推理能力，这表现为：(1) overall
      accuracy 从 0.731→0.718（轻微下降 因为 GRPO reward 优化的是 generation quality 非 MC accuracy），

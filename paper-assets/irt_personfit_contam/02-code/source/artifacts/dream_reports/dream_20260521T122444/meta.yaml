        - 0.5
        constat_retest_auroc:
        - 0.8
        - 0.95
        mink_sft_auroc:
        - 0.6
        - 0.75
      narrative_direction: '"Reframe: NOT a detection superiority paper. Three reframing
        angles for same venue: (A) Empirical characterization paper — first systematic
        study of how LLM response patterns relate to IRT assumptions. Universal 4PL
        misfit (57/60 flagged) is a novel finding about LLM cognition. θ-shift mechanism
        is a methodological contribution to contamination science regardless of detection
        power. (B) Scope-honest detection paper — IRT-FIT detects intentional SFT
        contamination (|d|>2.9 across two families) with explicit scope boundary:
        post-RL training smooths binary signal below detection threshold for ALL binary-only
        methods. This negative result (RL boundary) is itself a contribution — it
        maps the detection frontier''s limits. Frame as: ''we establish where binary
        detection works and precisely where it fails.'' (C) Framework + toolkit paper
        — open-source IRT-FIT toolkit + 13K model data availability + memorization
        fraction methodology. Contribution is the framework (connecting psychometrics
        to LLM evaluation) not detection SOTA. θ-shift analysis, seen/unseen decomposition,
        and dose-response characterization are methodological contributions independent
        of absolute detection power. Still targets EMNLP as evaluation methodology
        with community tooling impact."'

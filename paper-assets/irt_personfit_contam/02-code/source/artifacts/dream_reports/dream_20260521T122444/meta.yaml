        - 4.0
        post_rl_ht_cohens_d:
        - 0.0
        - 1.0
        post_rl_mia_auroc:
        - 0.45
        - 0.55
        n_families_validated:
        - 3
        - 4
        n_baselines_beaten:
        - 5
        - 7

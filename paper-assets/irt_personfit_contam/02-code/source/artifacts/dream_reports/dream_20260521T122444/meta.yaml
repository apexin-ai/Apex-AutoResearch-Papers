    ---


    # Review Report: IRT-FIT: Detecting Benchmark Contamination in LLMs via Person-Fit
    Statistics


    ## Paper Summary


    This paper introduces IRT-FIT, a framework that repurposes psychometric person-fit
    statistics (ℓz*, HT) to detect benchmark contamination in LLMs using only binary
    (correct/incorrect) response patterns plus externally calibrated 4PL item parameters.
    Controlled contamination experiments via QLoRA SFT across three model families
    (Qwen, Llama, Mistral; Gemma partial) demonstrate large detection effects (|d|
    > 2.9). The paper maps a "detection frontier" by information access level, shows
    person-fit retains signal post-RL where token-probability methods fail, demonstrates
    the necessity of 4PL parameterization (+27pp over 3PL), and characterizes detection
    power scaling with benchmark size.


    ---


    ## Scores


    | Dimension | Score |

    |-----------|-------|

    | **Soundness** | 3.5 / 5 |

    | **Excitement** | 3.0 / 5 |

    | **Reproducibility** | 3.5 / 5 |

    | **Overall Assessment** | 3.0 (Findings) |


    **Confidence**: 4 / 5


    ---


    ## Strengths


    ### S1: Genuinely novel cross-disciplinary transfer

    Applying psychometric person-fit statistics to LLM contamination detection is
    a creative and well-motivated idea. The analogy between a contaminated LLM and
    an examinee with item pre-knowledge is elegant and technically sound. The "minimal-information
    operating point" framing provides a clear conceptual contribution to the contamination
    detection literature.


    ### S2: Honest, calibrated claims

    The paper is commendably transparent about limitations. The authors openly report
    that HT achieves 94% of ℓz*''s effect size (Section 5.1), that post-RL differentiation
    between ℓz* and HT is not significant (Table 10, p=0.35), that 57/60 model-benchmark
    cells show universal misfit, and that the leaderboard audit was abandoned due
    to parameter recovery failure. This level of intellectual honesty is rare and
    strengthens the paper''s credibility.


    ### S3: Comprehensive experimental coverage

    The paper covers an impressive range of analyses within 8 pages: controlled contamination
    across four families (Tables 1-4), baseline comparison with 7+ methods (Table
    5), item-level detection (Table 6), token-probability comparison (Table 7), post-RL
    robustness (Tables 8-10), 4PL vs 3PL ablation (Table 11), cross-benchmark power
    scaling (Tables 12-13), small-benchmark regime (Table 14), domain-level analysis
    (Table 15), IRT parameter recovery (Table 16), natural experiment (Table 17),
    and multiscale aggregation (Table 18). 18 tables in 8 pages is dense but informative.


    ### S4: θ-shift analysis is a genuine methodological contribution

    The finding that ability re-estimation under contamination absorbs aberrance signal,
    producing apparent non-monotonicity in dose-response curves that is resolved under
    fixed-θ analysis, is novel and practically important. This is an insight that
    transfers beyond this specific application to any setting where IRT person-fit
    is applied to populations with heterogeneous baselines.


    ### S5: Post-RL robustness finding is timely and impactful

    Demonstrating that person-fit statistics retain detectable signal (|d| > 1.3)
    after RL while all token-probability methods collapse to chance (AUROC ≤ 0.52)
    addresses a pressing gap identified by Wang et al. [2025]. This is arguably the
    most practically important result in the paper.


    ---


    ## Weaknesses


    ### W1 (Major): HT ≈ ℓz* fundamentally undermines the headline contribution

    The paper''s title and framing center on ℓz*, but HT achieves 94% of the effect
    size using only item difficulty (no full 4PL parameterization, no Snijders correction).
    The three "structural advantages" of ℓz* over HT (parametric null, Snijders correction,
    4PL a-weighting) are argued theoretically but never empirically validated as materially
    beneficial. The bootstrap validation (mean=0.09, std=1.00) confirms the null calibration
    property, but this advantage is moot when the paper itself uses Δℓz*/Cohen''s
    d rather than absolute ℓz* thresholds (Section 3.2: "absolute ℓz* thresholds are
    unreliable"). If the framework is fundamentally relative, the parametric null
    advantage is less compelling. The paper should either: (a) demonstrate a scenario
    where ℓz*''s structural advantages produce meaningfully better detection than
    HT, or (b) reframe the contribution as being about the person-fit *family* rather
    than ℓz* specifically.


    ### W2 (Major): Post-RL robustness tested on n=1 model only

    The post-RL experiment (Section 6.1) uses a single model (Qwen 15% contamination
    → GRPO). This is the paper''s most impactful claim, yet it rests on the weakest
    statistical foundation. The signal retention rates (44% for ℓz*, 40% for HT) could
    be Qwen-specific. At minimum, testing on Llama (which has the most controlled
    baselines and different baseline ℓz* ≈ 0) would substantially strengthen this
    claim. Without cross-family validation of post-RL robustness, the claim should
    be hedged more aggressively than the current confident framing ("This demonstrates
    a class-level structural advantage").


    ### W3 (Major): Practical applicability constrained by PSN-IRT dependency

    The "minimal information" framing is partially misleading. While runtime information
    from the target model is indeed minimal (binary responses only), the framework
    requires externally calibrated 4PL parameters from PSN-IRT, which are currently
    available for only five benchmarks. The paper acknowledges this in Limitations
    but understates its significance. For a practitioner wanting to audit contamination
    on a new benchmark (e.g., GPQA, LiveBench, or any custom evaluation), IRT-FIT
    is not applicable without first obtaining or estimating 4PL parameters—and Section
    6.5 shows that classical estimation fails (a_r = 0.127). This creates a circular
    dependency: the framework works only where PSN-IRT has already calibrated, which
    covers the most well-studied benchmarks where contamination is already heavily
    scrutinized by other means.


    ### W4 (Moderate): Only QLoRA SFT contamination mechanism validated

    All controlled experiments use QLoRA SFT exclusively. The memorization fraction
    (~35%) is consistent across families but could be an artifact of the QLoRA low-rank
    constraint rather than a universal property of SFT contamination. Full fine-tuning
    would likely produce higher memorization fractions, potentially changing the detection
    characteristics (possibly improving detection, but this is not demonstrated).
    Continued pretraining—the most common real-world contamination pathway—is explicitly
    out of scope. The Limitations section acknowledges this, but the paper''s general
    framing ("detecting benchmark contamination") overpromises relative to what is
    validated ("detecting QLoRA SFT contamination on MMLU-scale benchmarks").


    ### W5 (Moderate): Insufficient statistical rigor in several experiments

    - **Mistral** (Table 3): n=1 clean seed, no variance estimate, no d computation.
    Reported as "supporting evidence" but still counted toward the "three families"
    claim in the abstract.

    - **Gemma** (Table 4): "~35% partial failure risk," approximate values ("~0.5",
    "~-0.8"), "varies" status. This is preliminary data, not validated results.

    - **Cross-benchmark** (Table 12): MATH and BBH power values are from simulation
    only ("~.62", "~.68"), not from controlled experiments with validated 4PL parameters.
    Presenting simulation-only estimates alongside empirical results in the same table
    without clear visual distinction is misleading.


    ### W6 (Minor): Natural experiment (Section 6.6) adds little value

    With refit parameters at a_r = 0.127, the ℓz* computed on v1 leaderboard data
    "partially degrades toward an accuracy-like metric" (the paper''s own words).
    The 9 complete pairs provide very limited statistical power. The results (HellaSwag
    ↓, GSM8K ↑) are interesting but the paper correctly notes they reflect SFT effects,
    not contamination. This section could be cut or moved to an appendix to make room
    for strengthening the post-RL experiment (W2).


    ### W7 (Minor): Missing comparisons to recent work

    The baseline comparison omits several relevant recent methods: GSM-Symbolic (Mirzadeh
    et al., 2024) for reasoning-benchmark-specific contamination, and training data
    extraction approaches. The detection frontier diagram, while useful, may be incomplete.
    The paper also does not discuss how IRT-FIT would interact with dynamic/versioned
    benchmarks (LiveBench, SEAL) that address contamination through renewal rather
    than detection.


    ---


    ## Questions for Authors


    1. Can you provide a concrete scenario where ℓz*''s parametric null or Snijders
    correction produces a *materially different detection decision* compared to HT
    with bootstrapped confidence intervals? The structural advantages are theoretically
    motivated but empirically vacuous in the current paper.


    2. What is the computational cost of running IRT-FIT? The paper claims "zero cost"
    in Table 5, but MLE estimation of θ over 14,042 items is not free. How does wall-clock
    time compare to HT (which avoids MLE)?


    3. The memorization fraction consistency (~35%) is presented as potentially a
    "universal calibration constant." Have you considered that this is an artifact
    of QLoRA rank=64? At rank=256 or full fine-tuning, would the fraction change?


    4. Why was only Qwen used for the post-RL experiment? Was this a resource constraint
    or a deliberate choice? If Llama (baseline ℓz* ≈ 0) were tested post-RL, would
    the results differ given its different θ-shift sensitivity?


    ---


    ## Experiment Coverage Assessment


    Relative to the full experimental plan, the paper covers the core experiments
    well:

    - ✅ Controlled contamination pilot + cross-family (core)

    - ✅ Baseline comparison with 7 methods (core)

    - ✅ Post-RL robustness (core, but n=1)

    - ✅ 4PL vs 3PL ablation (important ablation)

    - ✅ Cross-benchmark power scaling (good characterization)

    - ✅ Domain-level analysis (useful)

    - ✅ IRT parameter recovery failure (honest negative result)

    - ⚠️ Gemma results are partial/conditional

    - ⚠️ MATH/BBH are simulation-only

    - ⚠️ Natural experiment is weakened by parameter quality

    - ❌ No cross-family post-RL validation

    - ❌ No alternative contamination mechanisms (full FT, continued PT)


    The coverage is reasonable for a single paper but the post-RL gap (single model)
    is the most consequential missing piece.


    ---


    ## Minor Issues


    - Page 3: "4.3 Cross-Family Validation" claims "four model families" but Gemma
    results are conditional and Mistral has n=1 seed. The abstract claim of "three
    model families" is more accurate; the body text should be consistent.

    - Table 5: "acc z" row shows z=160.6 alongside Cohen''s d values for other methods.
    These are not comparable metrics; a footnote or separate column would help.

    - The paper lacks error bars or confidence intervals on almost all reported statistics.
    Even for Qwen (2 clean seeds), variance estimates are barely discussed.

    - The Responsible NLP Research Checklist is not visible in the submission. For
    EMNLP 2026, this is mandatory.

    - References: 14 references is thin for a paper bridging psychometrics and NLP.
    Key person-fit references (e.g., Levine & Rubin 1979, Reise 1990, Emons et al.
    2005 on IRT person-fit power) and recent contamination work are missing.


    ---


    ## Overall Assessment Justification


    This paper presents a genuinely novel idea—applying psychometric person-fit statistics
    to LLM contamination detection—with solid experimental execution and commendably
    honest reporting. The θ-shift analysis and post-RL robustness findings are valuable
    contributions.


    However, three issues prevent a Conference-level recommendation: (1) the headline

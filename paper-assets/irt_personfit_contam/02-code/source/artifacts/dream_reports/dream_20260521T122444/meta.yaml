      binary response 中的 item-specific memorization pattern（模型仍然记得那些题的答案）。

      **为什么 HT 退化**：HT = Σ(x_i - P_i(θ)) 仅按 difficulty 加权。 GRPO 全局提升 θ 后，P_i(θ) 对所有
      items 系统性增大——模型"应该" 答对更多 hard items。这使得 memorized items 的答对不再显得 aberrant （因为模型现在
      genuinely 有更高能力）。HT 无法区分"GRPO 带来的 真能力提升"和"SFT 记忆化的残留"。

      **为什么 MIA 失效**：GRPO 的 policy gradient updates 彻底重塑 token-level loss landscape（Wang
      et al. 2025），使 per-token loss 分布不再携带 contamination 信号。AUROC→0.50 复现 Wang et
      al.。


- name: v1 IRT Refit Expanded (Path D Closure)
  plan_id: exp-v1-irt-refit-expanded
  description: '扩大 v1 IRT 重拟合至 N≥500, 验证 a_r=0.111 是否因样本量不足。

    '
  expected_results:
    n_models_downloaded: 500
    3pl_a_pearson_r: 0.13
    2pl_a_pearson_r: -0.02
    3pl_b_pearson_r: 0.66
    a_r_threshold: 0.2
    a_r_verdict: dead (a_r < 0.2)
    path_d_status: closed
  result_rationale: 'Expanding from N=63→178 only improved a_r from 0.111 to 0.127.
    Extrapolating to N=500, the marginal gain is diminishing (~0.13-0.14). The fundamental
    issue is not sample size but model heterogeneity: LLMs from different families/scales
    violate the classical IRT assumption that all examinees are drawn from a single
    latent trait distribution. A 7B model and a 70B model are not "two examinees differing
    in ability" — they differ structurally in how they process items. Classical MML-EM
    cannot recover meaningful discrimination parameters from this heterogeneous sample.
    b_r stabilizes at ~0.66 because difficulty is a more robust property (hard items
    are hard for all models), while discrimination is model-architecture-dependent.
    This definitively closes Path D.

    '
  tables:
  - 'Table: IRT refit metrics at N=63, N=178, N=500 — showing a_r plateau below 0.2'
  figures_description:
  - 'Line plot: a_r and b_r as function of sample size N, showing b_r convergence
    and a_r plateau'
  analysis: 'Path D confirmed dead. Paper Section 6 (Empirical Findings) reports this
    as a methodological caveat: classical IRT estimation from heterogeneous LLM samples
    fails on discrimination. Frames the gap between classical (small N, homogeneous)
    and neural IRT (large N, heterogeneous) estimation as an open problem for the
    community.

    '
- name: 4PL vs 3PL Ablation
  plan_id: exp-4pl-ablation
  description: '4PL vs 3PL(d=1) 检测灵敏度比较。量化 d 参数对 FAR 和 power 的影响。

    '
  expected_results:
    far_4pl: 0.05
    far_3pl: 0.05-0.16
    far_2pl: 0.50-1.00
    mean_power_gain_4pl_vs_3pl_mmlu: 0.25
    mean_power_gain_4pl_vs_3pl_hellaswag: 0.24
    mean_power_gain_4pl_vs_3pl_gsm8k: 0.19
    pct_mmlu_items_d_lt_0.95: 0.46
    max_power_gain_at_low_d: 0.55
    real_data_correlation_4pl_3pl: 0.23
    deepseek_delta_lz: 340
  result_rationale: '4PL d parameter models the probability ceiling — P(correct) for
    very high ability examinees. 46% of MMLU items have d<0.95, meaning even the best
    models have <95% ceiling probability. When d=1 is forced (3PL), these items''
    response probabilities approach 1 for high-ability models, making any incorrect
    answer look extremely aberrant and inflating lz*. This creates both inflated FAR
    (false aberrance from normal ceiling effects) and reduced detection power (genuine
    contamination signal is masked by the d-induced noise). The +25pp mean power gain
    on MMLU reflects 4PL''s ability to correctly model ceiling effects so that only
    genuine difficulty-ordering violations are flagged. 2PL is catastrophic because
    removing both c (guessing) and d (ceiling) makes the model unable to account for
    40-60% of MMLU response variability. This result is tier-independent — it reflects
    a structural property of IRT parameterization, not a property of the detection
    frontier.

    '
  tables:
  - 'Table: FAR and power by parameterization (2PL/3PL/4PL) × benchmark'
  - 'Table: Power gain stratified by d-parameter bucket'
  figures_description:
  - 'ROC curves: 4PL vs 3PL vs 2PL on MMLU at 15% contamination'
  - 'Scatter: item-level d parameter vs power gain (4PL over 3PL), showing low-d items
    drive the advantage'
  analysis: 'Strong methodological contribution independent of worst-tier narrative.
    4PL is essential for LLM contamination detection — this justifies the PSN-IRT
    parameter dependency. However, since HT (difficulty-only) matches lz* empirically,
    the 4PL advantage is theoretical (better calibrated null, correct ceiling modeling)
    rather than empirical detection superiority. Tension: 4PL matters for calibration,
    but HT doesn''t need 4PL and still matches.

    '
- name: Baseline Comparison (≥5 Baselines)
  plan_id: exp-baseline-comparison
  description: 'IRT-FIT vs 5+ baselines on ground-truth contaminated models: ConStat
    (re-test), Min-K%++ (token probs), accuracy z-score, PPL-based, HT, Guttman/U3,
    random.

    '
  expected_results:
    n_baselines: 7
    n_baselines_beaten: 3
    model_level_lz_star_d_15: -3.1
    model_level_ht_d_15: -3.0
    model_level_guttman_d_15: -0.4
    model_level_u3_d_15: -0.45
    model_level_acc_zscore: 155
    constat_retest_auroc: 0.88
    mink_sft_auroc: 0.68
    ppl_sft_auroc: 0.63
    random_auroc: 0.5
    item_level_all_auroc_range: 0.50-0.63
    item_level_best_oracle_rf: 0.63
    lz_star_vs_ht_diff: not significant (p>0.3)
    bootstrap_ci_width_lz_d: 1.2
  result_rationale: 'Under worst tier, lz* only beats 3 baselines: Guttman (d~0.4),
    U3 (d~0.45), and random (d=0). HT matches lz* (d~3.0 vs 3.1, difference not significant
    with n=3 clean seeds). ConStat with rephrased re-testing achieves AUROC 0.88 because
    re-testing provides a fundamentally richer signal — it creates a second independent
    measurement of the same items, enabling paired comparison. This is strictly more
    informative than binary-only. Min-K++ achieves SFT AUROC 0.68 because token-level
    probability distributions contain granular memorization signatures (specific logit
    patterns on memorized items) that binary responses discard. PPL-based detection
    gets 0.63 on SFT (above random but weak). All item-level methods are near-random
    (0.50-0.63) including oracle RF, confirming that contamination signal is diffuse
    — memorization fraction ~35% means 65% of seen items show no memorization signal.
    acc z-score achieves z~155 (trivially detects) but is non-specific: it can''t
    distinguish contamination from genuine ability. The key worst-tier finding: methods
    with more information access (ConStat > Min-K++ > PPL > lz*) consistently outperform.
    lz*''s value is only at the minimal-information operating point, not detection
    performance.

    '
  tables:
  - 'Table: Model-level detection comparison — rows=methods (8), cols=models×conditions,
    Cohen''s d or AUROC'
  - 'Table: Item-level AUROC — all methods 0.50-0.63, confirming model-level aggregation
    is key'
  - 'Table: Information access hierarchy — method, info required, SFT detection, post-RL
    detection'
  figures_description:
  - 'Detection frontier plot: x=information access level (binary→retest→token probs→logits→weights),
    y=detection power. lz* at the bottom-left.'
  - 'Paired bar chart: lz* vs HT Cohen''s d per condition, showing no significant
    difference'
  - 'ROC curves: ConStat vs Min-K++ vs lz* on SFT contamination'
  analysis: 'Paper cannot claim detection superiority. Must reframe as: "We establish
    the minimal-information operating point. Methods with more information access
    outperform — this is expected and honest. Our contribution is the framework (connecting
    psychometrics to LLM evaluation) and the characterization (θ-shift, memorization
    fraction, RL boundary). lz* beats only classical person-fit (Guttman/U3) and random
    — the 8× gap over Guttman shows IRT parameterization matters, but HT achieves
    the same with only difficulty." Bootstrap CIs (6/8 peer papers report none) remain
    a differentiator.

    '
- name: Multiscale lzm Statistic
  plan_id: exp-multiscale-lzm
  description: '跨 benchmark 聚合的标准化 lz* 总分 (Hong, Lin & Cheng, 2021)。 PSN-IRT 12 模型
    + 控制实验模型验证。

    '
  expected_results:
    psn_12_models_lzm_flagged: 11/12
    psn_lzm_vs_individual_lz_agreement: 0.92
    ctrl_contam_lzm_d_15: -2.8
    ctrl_contam_lzm_d_50: -0.8
    lzm_adds_discrimination_beyond_individual: false
    lzm_reduces_false_positive: false
    cross_benchmark_correlation: 0.15
  result_rationale: 'lzm aggregates standardized lz* scores across benchmarks. Since
    individual benchmark lz* values are already extreme for nearly all models (57/60
    flagged), aggregation cannot reduce flagging — it merely averages universally-extreme
    signals. The cross-benchmark correlation of lz* is low (~0.15, only GSM8K-HumanEval
    significant at r=0.62), meaning lzm doesn''t capture a coherent "cross-benchmark
    contamination" signal — it just averages independent benchmark-specific misfit.
    For ctrl-contam models, lzm Cohen''s d (~2.8) is slightly lower than the best
    individual benchmark (MMLU d~3.1) because GSM8K and HellaSwag dilute the signal.
    lzm does not add value beyond individual benchmark analysis in this context. The
    theoretical appeal (Hong et al. 2021 designed lzm for multi-test batteries where
    aggregation recovers signal from individually-weak tests) doesn''t apply because
    each benchmark already has strong model-level signal.

    '
  tables:
  - 'Table: lzm vs individual benchmark lz* — flagging agreement rate'
  figures_description:
  - 'Parallel coordinates: lz* across 5 benchmarks for 12 models, colored by lzm flag'
  analysis: 'lzm is a methodological contribution (implementing Hong et al. 2021 for
    LLM context) but does not improve detection in practice. Brief mention in Method
    section; not a headline result. Could become useful if applied to many small benchmarks
    where individual power is insufficient.

    '
- name: Post-RL Hypothesis Test (GRPO)
  plan_id: exp-post-rl
  description: 'Qwen3.5-9B: SFT contamination (15%) → GRPO training → measure if person-fit
    detection survives. Responds to Wang et al. (2025) MIA failure.

    '
  expected_results:
    sft_only_lz_star_d: -3.1
    post_grpo_lz_star_d: -0.25
    post_grpo_ht_d: -0.2
    post_grpo_mia_auroc: 0.51
    post_grpo_mink_auroc: 0.52
    post_grpo_ppl_auroc: 0.49
    post_grpo_acc_delta: 0.03
    post_grpo_lz_star_value: 8.1
    post_grpo_clean_lz_star: 8.65
    post_grpo_delta_lz: -0.55
    memorization_fraction_post_rl: 0.05
    seen_unseen_acc_gap_post_rl: 0.01
    difficulty_ordering_restored: true
  result_rationale: 'GRPO (Group Relative Policy Optimization) trains the model to
    maximize reward on a general objective. During RL, the model''s policy is updated
    to produce correct answers through reasoning rather than memorization. The SFT-induced
    memorization signature — where specific items are answered correctly regardless
    of difficulty ordering — is overwritten because: (1) RL reward is based on correctness,
    not memorization; the model learns to derive answers rather than recall them;
    (2) GRPO uses group-relative rewards, normalizing performance within batches,
    which smooths out item-specific memorization spikes; (3) RL training updates ALL
    model parameters (not just LoRA adapters), distributing the contamination knowledge
    across the full parameter space and destroying the localized aberrance pattern.
    Post-RL, the model still achieves ~3% accuracy gain on seen items (residual knowledge)
    but the difficulty-ordering is restored — it gets hard-seen items wrong at expected
    rates. This makes lz* return to near-baseline (~8.1 vs clean 8.65). The seen/unseen
    accuracy gap collapses from ~0.10 (SFT) to ~0.01 (post-RL). HT also fails (d~0.20)
    because difficulty ordering is restored. MIA/Min-K++ fail (AUROC~0.51) consistent
    with Wang et al. (2025). ALL binary-only AND token-probability methods are at
    random. This is the structural limitation: RL transforms memorization into generalization-like
    behavior that is indistinguishable from genuine learning at all currently-accessible
    observation levels.

    '
  tables:
  - 'Table: Pre-RL vs Post-RL detection — all methods, showing collapse from d>2.5
    to d<0.5'
  - 'Table: Seen/unseen accuracy gap pre-RL vs post-RL'
  figures_description:
  - 'Before/after bar chart: Cohen''s d for lz*, HT, and effect sizes for MIA/Min-K++
    pre-RL and post-RL'
  - 'Item difficulty curve: P(correct) vs item difficulty for clean, SFT-only, and
    post-RL models. SFT shows aberrant bump on seen items; post-RL smooth curve indistinguishable
    from clean'
  - 'Memorization fraction decay: MF from SFT (~0.36) → post-RL (~0.05), visualizing
    signal destruction'
  analysis: 'This is the worst-tier defining result. ALL binary-only methods (lz*,
    HT, Guttman, U3, accuracy) and ALL token-probability methods (MIA, Min-K++, PPL)
    fail post-RL. The paper must honestly report this as a scope boundary: IRT-FIT
    detects SFT contamination but NOT post-RL contamination. Frame as contribution:
    "We map the detection frontier — establishing where binary detection works (SFT)
    and precisely where it fails (post-RL)." The RL boundary finding is itself publishable:
    it extends Wang et al. (2025) from 10 log-prob methods to include person-fit and
    all binary-only methods.

    '
- name: Extra Benchmarks (BBH + MATH)
  plan_id: exp-extra-benchmarks
  description: 'BBH (6,511 items) 和 MATH (5,000 items) 填充 1K-10K items 的 power gap。

    '
  expected_results:
    bbh_available_in_psnirt: false
    math_available_in_psnirt: false
    bbh_4pl_self_calibrated: true
    math_4pl_self_calibrated: true
    bbh_power_15pct_sim: 0.78
    math_power_15pct_sim: 0.68
    bbh_ctrl_contam_d_15: -1.8
    math_ctrl_contam_d_15: -1.4
    bbh_ht_d_15: -1.7
    math_ht_d_15: -1.3
    power_function_fit_with_bbh_math: 0.62
    self_calibrated_vs_psnirt_degradation: 15-25% power loss
  result_rationale: 'BBH and MATH are unlikely to be in PSN-IRT (which covers standard
    benchmarks: MMLU, HellaSwag, GSM8K, ARC-C, HumanEval). Self-calibrating 4PL parameters
    from the limited LLM sample (N=12-20 models) introduces the same discrimination
    failure as Path D (a_r < 0.2), resulting in 15-25% power loss vs PSN-IRT calibrated
    parameters. BBH (6511 items) achieves simulated power ~0.78 at 15% but real-data
    d ~1.8 (lower than MMLU''s ~3.1) due to self-calibration degradation and BBH''s
    complex format (multi-step reasoning items where SFT contamination signal is weaker
    — the model may memorize the answer but not the reasoning path, and BBH scoring
    often requires the full reasoning). MATH (5000 items) is worse: math problems
    have high guessing variance and the SFT signal is diluted by the symbolic nature
    of responses. Both benchmarks confirm the power function trend (more items = more
    power) but with lower coefficients than MMLU-calibrated parameters would predict.
    R² drops from 0.957 to ~0.62 when self-calibrated benchmarks are included, showing
    the power function is parameter-dependent.

    '
  tables:
  - 'Table: Power comparison — MMLU/HellaSwag/GSM8K (PSN-IRT) vs BBH/MATH (self-calibrated)'
  figures_description:
  - 'Updated power function plot: n_items vs detection power, with BBH/MATH points
    below the PSN-IRT curve'
  analysis: 'BBH and MATH fill the 1K-10K gap but with degraded performance due to
    self-calibration. This reinforces the PSN-IRT parameter dependency — IRT-FIT''s
    power depends on parameter quality, not just benchmark size. Paper should report
    these as secondary results with the self-calibration caveat. Does not change worst-tier
    narrative.

    '

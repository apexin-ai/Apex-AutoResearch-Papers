narrative_guidance: 'Reframe: NOT a detection superiority paper. Post-RL GRPO eliminates
  all binary-only detection signals (|d|<0.5). HT matches or exceeds lz* in every
  tested condition — no empirical basis for claiming lz* advantage over simpler difficulty-only
  statistics. Paper pivots to three-pronged contribution: (A) First systematic IRT
  person-fit study of LLM response patterns — universal 4PL misfit (57/60 flagged)
  is a novel cognitive finding, not a detection artifact. (B) Scope-honest SFT detection
  — IRT-FIT detects intentional SFT contamination (|d|>2.5 across two families) with
  explicit scope boundary: post-RL smooths binary signal below detection for ALL binary-only
  methods. The RL boundary is itself a contribution mapping the detection frontier''s
  limits. (C) Framework + toolkit — open-source IRT-FIT toolkit, θ-shift methodology,
  memorization fraction quantification, and 13K+ model data availability. Contributions
  are methodological, not SOTA claims. ConStat (retest AUROC 0.85-0.95) and Min-K++
  (SFT AUROC 0.65-0.75) outperform lz* when given more information access. lz* only
  beats Guttman/U3/random (2-3 baselines). The "minimal-information" framing must
  honestly acknowledge the cost: lower power than methods with richer signals. Target
  EMNLP as evaluation methodology paper with community tooling impact.

  '
imagined_experiments:
- name: Controlled Contamination Pilot (Qwen × MMLU)
  plan_id: exp-ctrl-contam-pilot
  description: 'Qwen2.5-7B-Instruct × 4 conditions (0%-seed1/0%-seed2/15%/50%) × MMLU.
    Go/no-go signal for the paper. Measures Δlz*, clean noise floor, memorization
    fraction.

    '
  expected_results:
    n_clean_seeds: 2
    clean_seed1_lz_star: 8.9
    clean_seed2_lz_star: 8.4
    clean_vs_clean_delta_lz: 0.5
    clean_mean_lz_star: 8.65
    clean_std_lz_star: 0.35
    contam_15_lz_star: 4.1
    contam_50_lz_star: 7.5
    delta_lz_contam15: -4.55
    delta_lz_contam50: -1.15
    cohens_d_contam15: -3.1
    cohens_d_contam50: -0.9
    theta_shift_15: 0.28
    theta_shift_50: 0.45
    memorization_fraction_15: 0.36
    memorization_fraction_50: 0.3
    theta_fixed_contam15_lz: 11.5
    theta_fixed_contam50_lz: 17.8
    theta_fixed_ratio: 3.0
    ht_d_contam15: -3.0
    ht_d_contam50: -0.85
    acc_contam15: 0.71
    acc_contam50: 0.725
    acc_seen_contam15: 0.78
    acc_unseen_contam15: 0.68
  result_rationale: 'SFT with QLoRA directly injects benchmark items into training.
    Model memorizes ~36% of seen items (consistent with QLoRA''s partial parameter
    update — full FT would memorize more). At 15%, 2106 items are seen; ~758 are memorized,
    creating a diffuse aberrance signal detectable at model level. Cohen''s d ~3.1
    because lz* aggregates 14042 item-level weak signals. Non-monotonicity at 50%
    (|d|=0.9 < 3.1) because θ-shift absorbs aberrance: contaminating 50% raises θ_MLE
    by ~0.45, making previously-aberrant correct answers look expected. θ-fixed analysis
    restores monotonicity (ratio ~3.0). HT matches lz* (d ~3.0 vs 3.1) because the
    dominant signal is difficulty-ordering violation — items the model "should" get
    wrong are answered correctly — and HT captures this with only item difficulty.
    The full 4PL parameterization (a, c, d) adds negligible incremental signal at
    model level when the difficulty violation is already large. Clean-vs-clean Δlz*
    ~0.5 confirms noise floor is small relative to contam signal.

    '
  tables:
  - 'Table: Pilot results — lz* and HT Cohen''s d across conditions, with θ-free and
    θ-fixed'
  figures_description:
  - 'Bar chart: Δlz* for clean-vs-clean (noise floor) vs clean-vs-contam15 vs clean-vs-contam50,
    error bars from 2-seed clean variance'
  - 'Scatter: seen vs unseen item accuracy at 15% and 50% contamination, showing memorization
    fingerprint'
  analysis: 'Go signal confirmed for SFT scope. But HT matching lz* is a warning:
    the simpler statistic captures the same information at model level. Non-monotonicity
    under free-θ motivates θ-fixed methodology. Paper can claim SFT detection with
    |d|>2.5 but must acknowledge HT parity.

    '
- name: Full Controlled Contamination (4 Models × 6 Levels × 3 Benchmarks)
  plan_id: exp-ctrl-contam
  description: 'Qwen2.5-7B-Instruct, Gemma-4-31B, Llama-3.1-8B-Instruct, Mistral-7B-v0.3
    × 0%/5%/10%/15%/25%/50% × MMLU/GSM8K/HellaSwag.

    '
  expected_results:
    n_families_validated: 2
    qwen_mmlu_d15: -3.1
    qwen_mmlu_d50: -0.9
    llama_mmlu_d15: -2.7
    llama_mmlu_d50: -3.0
    mistral_mmlu_d15: -2.4
    mistral_mmlu_d50: -2.8
    gemma_mmlu_d15: -1.8
    gemma_mmlu_d50: -2.2
    qwen_gsm8k_d15: -1.4
    llama_gsm8k_d15: -1.2
    qwen_hellaswag_d15: -1.8
    llama_hellaswag_d15: -1.5
    qwen_ht_mmlu_d15: -3.0
    llama_ht_mmlu_d15: -2.6
    cross_family_mf_range: 0.30-0.40
    cross_family_mf_std: 0.04
    theta_fixed_monotonic_all: true
    dose_response_5pct_detectable: false
    dose_response_10pct_detectable: marginal (d ~0.8-1.2 on MMLU only)
    min_contam_for_detection_mmlu: 10-15%
    min_contam_for_detection_gsm8k: 25%
    min_contam_for_detection_hellaswag: 15-25%
  result_rationale: 'Only 2 families (Qwen + Llama) are fully validated with 3+ clean
    seeds each — Mistral and Gemma have single clean seeds, insufficient for rigorous
    Cohen''s d with CI. Gemma-4-31B shows weaker detection (d ~1.8) because larger
    models have more latent capacity to absorb contamination without creating aberrant
    patterns — the 31B model generalizes from seen items more smoothly than 7-9B models,
    reducing the memorization fraction to ~0.25. GSM8K (1319 items) and HellaSwag
    (10042 items) show weaker detection than MMLU (14042 items), consistent with power
    function — fewer items = less aggregation power. GSM8K is particularly weak because
    its chain-of-thought format means SFT contamination partially teaches reasoning,
    not just memorization. HT matches lz* across all conditions (|d_HT - d_lz*| <
    0.3) because difficulty-ordering violation dominates in all model-benchmark combinations.
    At 5% contamination, signal is indistinguishable from noise (only ~700 items seen
    on MMLU, ~250 memorized — insufficient for model-level detection). Cross-family
    MF consistency (0.30-0.40, std ~0.04) supports the generalizability of the memorization
    fraction concept. θ-fixed universally restores monotonicity, confirming this as
    a model-independent phenomenon.

    '
  tables:
  - 'Table: Cohen''s d matrix — rows=models, cols=benchmarks×levels, bold best per
    column'
  - 'Table: HT vs lz* Cohen''s d comparison — no significant difference in any cell'
  - 'Table: Memorization fraction across models and levels — 30-40% range'
  figures_description:
  - 'Dose-response curves: Δlz* vs contamination level, one line per model, faceted
    by benchmark. Free-θ (left) vs θ-fixed (right)'
  - 'Heatmap: Cohen''s d by model×benchmark at 15% contamination, showing power degrades
    with fewer items'
  - Cross-family memorization fraction bar chart with 95% CI, showing consistency
  analysis: 'SFT detection validated across 2 families with multiple seeds, but cross-family
    scope is limited. Gemma''s weaker signal warns that larger models may approach
    the detection boundary even for SFT. GSM8K near the detectability threshold at
    15%. HT parity across all 4×6×3 conditions eliminates empirical lz* advantage
    — the paper must rely on data-independent differentiation (parametric null, Snijders
    correction, 4PL item weighting).

    '
- name: Leaderboard Audit (ABANDONED)
  plan_id: exp-leaderboard-audit
  description: 'Open LLM Leaderboard v1 大规模扫描。已放弃因 IRT refit 失败。

    '
  expected_results:
    status: ABANDONED
    reason: a_r=0.111 (discrimination) + item alignment 54.56% → 13K audit infeasible
    v1_data_availability: 13K+ models with per-item binary data
    future_work_note: Data availability mentioned in Discussion; audit deferred to
      future work pending neural IRT estimation advances
  result_rationale: 'Classical IRT estimation (MML-EM) with N=63-178 models produces
    a_r=0.111 (well below 0.2 threshold), making the refitted parameters effectively
    discrimination-free. lz* computed with these parameters collapses to an accuracy-like
    metric, losing the IRT advantage. The root cause is that classical IRT assumes
    large samples of independent examinees, but LLM response patterns violate this
    (models are not independent draws from a population; they share training data
    and architectures). Item alignment at 54.56% further degrades parameter quality.
    This failure is a genuine methodological finding about the gap between classical
    and neural IRT estimation requirements.

    '
  tables: []
  figures_description: []
  analysis: 'ABANDONED. Not a paper weakness — frame as honest methodological caveat
    in Section 6 (IRT parameter estimation challenges). The 13K+ data availability
    is a future-work contribution. Paper uses PSN-IRT validated parameters (external
    calibration) instead.

    '
- name: Natural Experiment (Base→Chat Pairs)
  plan_id: exp-natural-experiment
  description: 'v1 leaderboard base→chat model pairs: Δlz* = lz*(chat) - lz*(base)

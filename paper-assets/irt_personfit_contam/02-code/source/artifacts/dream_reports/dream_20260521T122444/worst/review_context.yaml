    hellaswag_mean_deviation: -3.2
    hellaswag_p_value: 0.003
    gsm8k_mean_deviation: 3.5
    gsm8k_p_value: 0.015
    mmlu_p_value: 0.18
    arcc_p_value: 0.42
    individual_outliers_detected: 0
    statistical_power_for_individual_detection: insufficient
  result_rationale: 'With a_r=0.111, lz* is essentially accuracy-weighted, not IRT-weighted.
    The HellaSwag and GSM8K systematic effects reflect aggregate SFT training dynamics
    (SFT systematically changes performance patterns on these benchmarks), not contamination-specific
    signals. Only 5 viable pairs provide no statistical power for detecting individual
    contamination outliers — even a genuinely contaminated model would not stand out
    from the systematic SFT effect. MMLU and ARC-C show no significant systematic

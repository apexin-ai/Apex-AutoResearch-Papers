  result_rationale: 'Gemini-1.5 with 100% MMLU accuracy trivially flags all domains
    — with perfect accuracy, every subject produces extreme positive lz* (over-consistent).
    STEM slightly higher than humanities because STEM items have lower average d parameter
    (ceiling effects more pronounced), amplifying the over-consistency signal. Most
    models (~80%) show uniform contamination across domains because: (1) if contamination
    is via training data inclusion, it''s unlikely to be domain-selective (entire
    benchmark is either included or not); (2) SFT on randomly-sampled benchmark items
    distributes contamination proportionally across domains. Doubao shows domain asymmetry
    (STEM normal, humanities aberrant) suggesting selective knowledge — possibly stronger
    humanities training data or benchmark-specific tuning. This is interesting but
    doesn''t affect the detection narrative. Yi-Lightning''s extreme lz*=48 is driven
    by very high accuracy on hard items across all domains.


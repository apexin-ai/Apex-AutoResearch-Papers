      what_varied: ["input representation (one-hot vs semantic embedding)", "architecture (MLP vs GNN)"]
      variation_style: "full_numbers"
      design_note: "3-row ablation showing PSN-IRT > +Embedding > +GNN. Clear demonstration that simpler representations outperform, with GNN especially hurting Kendall tau (0.7273 vs 1.0000)."
      exact_values:
        PSN_IRT: {ACC: 0.7998, F1: 0.8538, AUC: 0.8485, Kendall: 1.0000}

    - table_id: "Table 4"
      what_varied: ["data subset proportion (30%, 50%, 70%)"]
      variation_style: "full_numbers"
      design_note: "Stability analysis via Pearson correlations between subset and full-data parameter estimates. All correlations 0.74-0.95 with p<0.0001. Shows parameter estimation is robust to data sampling."
      exact_values:
        subset_30pct: {difficulty: 0.9009, discriminability: 0.8186, guessing: 0.8274, feasibility: 0.9025}
        subset_50pct: {difficulty: 0.7437, discriminability: 0.7835, guessing: 0.8776, feasibility: 0.9330}
        subset_70pct: {difficulty: 0.9519, discriminability: 0.7414, guessing: 0.8320, feasibility: 0.9442}
  benchmark_quality_table:
    table_id: "Table 5"
    content: "Benchmark quality ranking by cumulative property scores across difficulty, discriminability, guessing, feasibility, LEH, Fisher info"
    row_axis: "benchmarks (11)"
    col_axis: "property quality ranks + total score"
    highlight_strategy: "ranking by total score (lower = better)"
    design_note: "Novel contribution — the first systematic quality ranking of LLM benchmarks using psychometric criteria. Chinese SimpleQA (23) ranks best; ARC-C (49) ranks worst."
    rankings:
      - {benchmark: "Chinese SimpleQA", score: 23}
      - {benchmark: "TheoremQA", score: 29}
      - {benchmark: "MBPP", score: 31}
      - {benchmark: "MATH", score: 31}
      - {benchmark: "GPQA Diamond", score: 32}
      - {benchmark: "BBH", score: 38}
      - {benchmark: "MMLU", score: 40}
      - {benchmark: "GSM8K", score: 40}
      - {benchmark: "HumanEval", score: 40}
      - {benchmark: "HellaSwag", score: 43}
      - {benchmark: "ARC-C", score: 49}
  item_selection_table:
    table_id: "Table 6"
    content: "Item selection strategy comparison using Benchmark Agreement Testing (BAT)"
    row_axis: "strategies (random, clustering, discriminability, Fisher) x sizes (400, 1000)"

paper_key: "constat2024"
title: "ConStat: Performance-Based Contamination Detection in Large Language Models"
venue: "NeurIPS 2024"
full_text_available: true

research:
  baselines:
    - "Carlini et al. (extraction-based)"
    - "Mireshghallah et al. (membership inference)"
    - "Yeom et al. (privacy-based)"
    - "Shi et al. (threshold-based, oracle access)"
    - "Shi (single baseline, realistic threshold)"
    - "Zhu et al. (rephrased benchmark evaluation)"
  metrics:
    - {name: "True Positive Rate (TPR)", direction: "higher_better"}
    - {name: "False Positive Rate (FPR)", direction: "lower_better"}
    - {name: "p-value", direction: "lower_better"}
    - {name: "Estimated contamination effect (delta_hat)", direction: "N/A"}
    - {name: "95% lower bound of effect (delta_hat_0.95)", direction: "N/A"}
    - {name: "Coefficient of determination (r^2)", direction: "higher_better"}
  datasets:
    - {name: "GSM8k", size: "~1300 test", task: "mathematical reasoning"}
    - {name: "ARC-Challenge", size: "~1172 test", task: "science questions"}
    - {name: "MMLU", size: "~14000 test", task: "general purpose knowledge"}
    - {name: "Hellaswag", size: "~10000 test", task: "commonsense inference"}
    - {name: "MathQA", size: "reference for GSM8k", task: "mathematics"}
    - {name: "SCIQ", size: "reference for ARC", task: "science"}
    - {name: "Lambada-OpenAI", size: "reference for Hellaswag", task: "language understanding"}
    - {name: "Rephrased benchmarks", size: "~1000 samples each", task: "syntax-specific reference"}
    - {name: "Synthetic benchmarks (GPT-4-Turbo generated)", size: "~1000 samples each", task: "sample-specific reference"}
  ablation_dimensions:
    - "Probability distributions (distribution mismatch robustness)"
    - "Non-linearity in hardness correction functions"
    - "Noise effects on estimation"
    - "Bootstrapping model selection variability"
    - "With/without random baseline models"
    - "Contamination type (syntax-specific vs sample-specific vs benchmark-specific)"
    - "Reference benchmark choice (rephrased vs synthetic vs different benchmark)"
  training_recipe:
    description: "Fine-tuned 18 models on GSM8k for controlled contamination validation; reference models include Llama (2/3), Phi (1.5/2), Gemma, Mistral, Falcon, OLMo families; hardness correction via smoothing spline; bootstrapping for significance estimation with Benjamini-Hochberg correction for multiple testing"
    optimizer: "not specified for ConStat itself (method is test-time, no training)"
    hardware: "not specified"
  method_family: "contamination detection (performance-based statistical testing)"

positioning:
  core_claim: "Redefines contamination from information-flow (training data overlap) to performance-based (artificially inflated non-generalizing performance), enabling a black-box statistical test that both detects AND quantifies contamination magnitude across three granularity levels."
  key_results: "TPR 89.1% syntax-specific / 98.4% sample-specific (vs best baseline 84.8%/70.5%); r^2=0.94 for contamination magnitude estimation; detected contamination in Mistral-7b (delta=8.25% on GSM8k), Llama-3-70b (delta=6.61% on ARC), Yi-34b (~6% on ARC/Hellaswag), Phi-2 (delta=36.42% benchmark-specific on GSM8k); top-3 Open LLM Leaderboard 7B models all show delta>10% benchmark-specific"
  limitations:
    - "Contamination estimated relative to reference models; if reference models are also contaminated, only relative effect is measured"
    - "Synthetic reference benchmarks generated by LLM may introduce distributional biases (mislabeling, easier for generating model)"
    - "Cannot detect contamination if it generalizes to reference benchmarks (i.e., if memorization actually helps general capability)"
    - "Relies on availability of suitable reference benchmarks for each target benchmark"
  relation_to_us: "foundation"

narrative:
  story_type: "突破局限型"
  hook: "Opens with competitive framing of LLM development ('many companies and research institutions compete to develop better models'), immediately establishing why benchmark integrity matters — benchmarks are the scoreboard of this competition."
  tension: "Three-layer tension: (1) contamination is inevitable at internet scale but providers dismiss its impact; (2) existing detection methods are narrow (require training data access, are evasion-vulnerable, cannot quantify impact); (3) the fundamental flaw is definitional — prior work defines contamination as data overlap rather than performance inflation, making it inherently limited."
  key_insight: "Revealed in Section 1.2 ('A New Perspective'): the pivot from information-flow to performance-based definition. Instead of asking 'was benchmark data in training?', ask 'does the model perform suspiciously better on the original benchmark than on equivalent references?' This reframing is the intellectual core enabling all downstream contributions."
  argument_chain: "Problem (contamination undermines benchmarks) → Definitional critique (information-flow definition is flawed) → New definition (performance-based) → Method (statistical test using reference benchmarks/models with hardness correction) → Controlled validation (18 fine-tuned models, r^2=0.94) → Wild application (popular models show contamination) → Leaderboard implications (top models are contaminated)"
  contribution_framing: "Four contributions, each one sentence, escalating from theoretical (new definition) → methodological (ConStat test) → empirical validation → practical findings. Clean parallel structure."
  intro_structure: "6 paragraphs across 6 subsections (1.1-1.6). Unusually structured — each intro paragraph gets its own subsection heading, which signals a complex setup requiring explicit signposting. Para 1: Problem framing (contamination exists). Para 2: New perspective (performance-based definition). Para 3: Traditional methods critique. Para 4: ConStat introduction. Para 5: Evaluation preview. Para 6: Contribution list."
  notable_technique: "The definitional pivot as narrative fulcrum — the paper's strongest move is arguing that ALL prior work fails because it asks the wrong question. This elevates the contribution from 'better method' to 'better problem formulation', a much stronger positioning. Also notable: the controlled experiment (18 fine-tuned models) as ground-truth validation before applying to wild models, which builds credibility for the real-world findings."

figures:
  figure_count: 2
  figure1:
    type: "method_overview"
    description: "Four-step workflow diagram showing ConStat's process: (1) select models to check, (2) select reference models and benchmarks, (3) compute statistical test, (4) extract contamination results with delta estimates and p-values. Includes concrete numerical examples showing contamination metrics for specific models."
    narrative_role: "Appears in intro (Section 1.4) to make the method tangible before formal definition. Serves as the reader's mental model for understanding the subsequent technical sections. The inclusion of concrete delta/p-value numbers in the overview figure previews the paper's dual contribution (detection + quantification)."
    design_elements:
      - "Step-numbered workflow layout"
      - "Concrete numerical examples embedded in diagram"
      - "Color-coded model/benchmark selections"
      - "Shows both detection (p-value) and quantification (delta) outputs"
    visual_style: "Schematic workflow diagram with annotated arrows and embedded result tables. Clean, not overly complex. Horizontal flow from left to right."
  result_figures:
    - figure_id: "Figure 2"
      viz_type: "scatter_with_confidence_intervals"
      what_compared: "Estimated contamination magnitude (delta_hat) vs ground-truth contamination (true delta) for 18 fine-tuned models"
      how_gain_highlighted: "Reports r^2=0.94 in caption/text; 2-sigma intervals shown; near-diagonal alignment visually demonstrates accurate estimation"
      design_note: "Validation scatter plot is the only quantitative figure — places all emphasis on calibration quality rather than showing many result tables as figures. The choice of scatter + confidence bands over bar charts reflects the continuous-valued nature of contamination estimation. Minimalist: one figure does the job of validating the quantification component."
  ablation_figures: []
  figure_narrative_role: "Figure 1 (method overview in intro) → Figure 2 (quantification validation in experiments). Extremely lean figure set for a NeurIPS paper — all detailed results go into tables, with figures reserved for (1) conceptual overview and (2) the single most important validation result. The paper's visual strategy is table-heavy."

tables:
  table_count: 2
  main_result_table:
    table_id: "Table 1"
    row_axis: "methods"
    col_axis: "contamination type (syntax-specific, sample-specific)"
    row_organization: "by_category"
    col_organization: "grouped_by_metric"
    highlight_strategy: "bold_best; asterisk (*) marks methods requiring unrealistic oracle access to uncontaminated samples"
    statistical_reporting: "percentages (TPR); no confidence intervals in this table"
    num_baselines: 5
    design_note: "Compact 2-column comparison table. The asterisk convention is clever — it visually separates methods that cheat (oracle access) from practical methods, making ConStat's advantage clear even when some baselines score higher with unfair assumptions. Methods without oracle access are the real competition."
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "Appendix A: Additional results for InternLM-2, StableLM-2, extended GSM8k analysis. Appendix B: Ablation via simulation (distribution robustness, non-linearity, noise, bootstrapping). Appendix C: Full experimental details (preprocessing, data generation, fine-tuning, reference model selection, compute). Appendix E: Complete test results (referenced as Table 17 for Mistral-7b-v0.2 and other models)."
    reason: "Main paper keeps only the two most essential tables: (1) method comparison for detection and (2) contamination findings for reference models. Detailed per-model breakdowns, ablations, and experimental details are relegated to appendix to maintain narrative focus. The paper prioritizes storytelling over exhaustive tabulation in the main text."
  secondary_table:
    table_id: "Table 2"
    row_axis: "contaminated model-benchmark pairs"
    col_axis: "contamination type (S=sample, B=benchmark), model performance, p-value, delta_hat, delta_hat_0.95"
    row_organization: "by_category"
    col_organization: "flat"
    highlight_strategy: "Only shows entries with FDR-corrected p<5%; reports both raw and corrected p-values"
    statistical_reporting: "Benjamini-Hochberg corrected p-values; 95% lower bound via pivotal bootstrap intervals; all in percentages"
    num_baselines: 0
    design_note: "Selective reporting table — only contaminated entries shown, not a full model x benchmark grid. This is effective because the null result (no contamination) is less interesting. The dual p-value reporting (raw + corrected) and the 95% lower bound column add statistical rigor. The S/B type column enables fine-grained contamination characterization."

    result_rationale: 'lz* 在 5% 低污染区间排名第一（AUROC=0.705），原因：在信号极弱时，IRT 的结构性归纳偏置 （item
      difficulty + discrimination + ability 的联合建模）比需要训练数据的 ML 方法 或依赖 token-level 信号的
      MIA 方法更能从噪声中提取微弱的 aberrance pattern。 具体机制：lz* 将每个 item response 按其 IRT-predicted
      probability 加权，使得 "高难度 item 被正确回答" 比 "低难度 item 被正确回答" 贡献更多检测信号。这种加权 在低污染时尤为关键——5%
      contamination 仅影响 ~700 items (MMLU)，其中 memorized  items (~250) 分散在不同难度层级，IRT
      加权使得 high-difficulty memorized items  的信号被放大，而 accuracy z-score 等方法对所有 items
      等权处理，信号被稀释。

      Min-K%++ 在 15%+ 超过 lz* 是因为 token-level probability 包含比 binary response  更丰富的信息——这正是
      "minimal-information operating point" 的代价所在。 但 gap 仅 -0.035 AUROC，且 95% CIs
      重叠，说明 binary-only 检测的代价远小于直觉预期。


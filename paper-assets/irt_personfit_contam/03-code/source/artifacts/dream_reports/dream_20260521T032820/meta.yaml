    # Dream Review Report: IRT-FIT


    **Paper**: IRT-FIT: Contamination Detection at the Minimal-Information Operating
    Point via Item Response Theory Person-Fit Statistics

    **Venue**: EMNLP 2026 (ARR)

    **Review Mode**: Simple (single reviewer, full coverage)


    ---


    ## 1. Summary


    The paper proposes IRT-FIT, a benchmark contamination detection framework that
    uses IRT person-fit statistics (ℓz*) computed on binary (correct/incorrect) response
    patterns. The key positioning is the "minimal-information operating point" on
    the contamination detection frontier—requiring strictly less information than
    all existing methods. Controlled contamination experiments across 4 model families
    × 3 benchmarks demonstrate |d| > 2.5 at 15% contamination on MMLU. The headline
    result is post-RL robustness: after GRPO training, IRT-FIT retains AUROC = 0.890
    while Min-K%++ and PPL-based methods collapse to near-random, because binary response
    patterns are preserved while token-level distributions shift fundamentally.


    ---


    ## 2. Strengths


    **S1. Novel and well-motivated framing.** The psychometric analogy (contaminated
    LLM ≈ examinee with item preknowledge) is natural, and the "detection frontier"
    organized by information access level is a clarifying contribution. No prior work
    applies person-fit statistics to LLM contamination. The framing alone will be
    useful to the community even independent of the specific results.


    **S2. Comprehensive controlled experiments.** 4 model families × 6 contamination
    levels × 3 benchmarks with ground-truth labels is a rigorous validation protocol.
    The use of 3 clean seeds to establish noise floor is good practice. The breadth
    across architectures (GQA, RoPE variants, sliding window attention) strengthens
    the generalizability claim.


    **S3. Post-RL robustness is a genuinely important finding.** This directly addresses
    the Wang et al. (2025) finding that all MIA methods fail on RL-trained models.
    Demonstrating that binary-only detection survives RL is practically significant
    and timely, as RL training becomes standard in production LLMs. The mechanistic
    explanation (RL changes token distributions but not binary patterns) is clean
    and convincing.


    **S4. θ-fixed analysis is a real methodological contribution.** Identifying the
    θ-shift confound and showing that fixing θ to the pre-contamination baseline restores
    monotonic dose–response is non-obvious and important. This transforms a potential
    failure mode into a well-understood boundary condition.


    **S5. Multiple converging evidence streams.** Controlled contamination + natural
    experiment + domain analysis + baseline comparison + 4PL ablation + power function
    + post-RL robustness. These experiments are mutually reinforcing and address different
    aspects of validity (internal, external, construct).


    **S6. Actionable deployment guidance.** The power function (R² = 0.965) and the
    ≥6,200-item threshold for 80% power at 15% contamination give practitioners concrete,
    usable criteria.


    ---


    ## 3. Weaknesses


    **W1. [Major] Post-RL experiment validated on only one model family.** This is
    the paper''s flagship result, yet it is demonstrated only on Qwen2.5-7B. Given
    the substantial cross-family variation in baseline misfit (ℓz* ranges from ~0
    for Llama to ~8.68 for Qwen), the post-RL robustness profile could differ meaningfully
    across families. Llama''s near-zero baseline misfit, for instance, may produce
    a very different signal-to-noise regime post-RL. A single-family validation is
    insufficient for the strong "structural immunity" claim.


    **W2. [Major] Practical deployment faces a circularity problem.** The Δℓz* detection
    mode requires a "clean baseline of the same model family." But if the goal is
    to detect contamination in a released model, an independently verified clean version
    may not exist. The absolute detection mode (|ℓz*| > 2) is acknowledged to be unreliable
    due to universal model misfit (57/60 model–benchmark cells show |ℓz*| ≫ 5). This
    means the method works best when you already have ground-truth clean models—precisely
    the scenario where contamination detection is least needed. The paper should address
    this deployment circularity more directly and propose practical mitigations (e.g.,
    using a family of similar-scale models as approximate clean baselines).


    **W3. [Major] Heavy dependency on external IRT parameters.** IRT-FIT uses PSN-IRT''s
    4PL item parameters, which were fitted on only N=12 curated models. The paper''s
    own Discussion confirms that classical IRT re-estimation fails (a_r = 0.127).
    This creates a critical dependency: applying IRT-FIT to a new benchmark requires
    either (a) PSN-IRT-quality neural IRT parameters (expensive, requires curated
    model set), or (b) classical IRT estimation (demonstrated to fail for discrimination).
    The generalizability to benchmarks beyond those covered by PSN-IRT is unclear
    and significantly limits practical impact.


    **W4. [Major] Missing mandatory EMNLP components.** The paper lacks: (a) a dedicated
    Limitations section (there is a "Scope and limitations" paragraph in Discussion,
    but EMNLP 2026 requires a mandatory, separate section); (b) the Responsible NLP
    Research Checklist (Sections A–E). Both are auto-reject signals per EMNLP 2026
    guidelines. (c) The paper also appears to use a single-column preprint format
    rather than the required ACL two-column template.


    **W5. [Major] Extremely sparse references.** Only 6 references total. A typical
    EMNLP paper cites 30–50+ works. Key missing citations include: Wang et al. (2025)—central
    to the motivation but absent from References; PSN-IRT (the source of the IRT parameters
    used); specific IRT-for-LLM works (e.g., Polo et al.; Yin et al.); CoDeC (mentioned
    in Related Work but not cited); the broader MIA literature beyond Min-K%++; multiple
    person-fit statistics works beyond Snijders (2001) and Meijer & Sijtsma (2001).
    This undermines scholarly positioning and suggests the Related Work is incomplete.


    **W6. [Moderate] No figures whatsoever.** The paper contains 13 tables but zero
    figures. For results that cry out for visualization—dose–response curves, detection
    frontier diagrams, heatmaps, power curves, pre/post-RL comparisons—the complete
    absence of figures is a serious presentation weakness. The experimental design
    context lists 15+ planned figures. Even 3–4 key figures would dramatically improve
    readability and impact.


    **W7. [Moderate] "Structural immunity" overclaim.** The paper repeatedly claims
    binary patterns are "structurally immune" to RL shifts. But: (a) AUROC drops 0.035
    (0.925 → 0.890); (b) Cohen''s d drops 36% (3.42 → 2.20); (c) memorization fraction
    drops from 0.38 to 0.32. This is structural *robustness*, not *immunity*. Furthermore,
    ConStat (re-test method) actually shows *better* post-RL retention (Δ = −0.015
    vs. −0.035), undermining the narrative that binary-only is uniquely advantaged.
    The paper should acknowledge ConStat''s competitive post-RL performance and position
    the contribution more precisely: IRT-FIT achieves the best combination of post-RL
    robustness + minimal information requirement + no extra inference cost.


    **W8. [Moderate] QLoRA SFT may not represent real-world contamination.** Real-world
    contamination often occurs during pretraining (data inclusion in training corpus),
    not via post-hoc SFT. The paper acknowledges this scope limitation in Discussion,
    but the abstract and introduction frame the contribution broadly against "benchmark
    contamination" without qualification. SFT contamination and pretraining contamination
    produce different memorization signatures; the 0.33–0.38 memorization fraction
    is specific to QLoRA SFT and may not generalize.


    **W9. [Minor] BBH and MATH results ambiguously presented.** Section 4.8 says "supplemented
    by simulated power on BBH (6,511 items) and MATH (5,000 items)" but Table 9 includes
    |d| (ctrl) values for these benchmarks, implying actual controlled contamination
    was run. The text should clearly distinguish which benchmarks have real ctrl-contam
    results versus simulation-only results.


    **W10. [Minor] Clean baseline variance is narrow.** Three seeds for clean baselines
    may underestimate the true variance. The Qwen clean ℓz* values (9.47, 7.05, 9.53)
    show non-trivial seed variance (std=1.41). With n=3, the estimated standard deviation
    is itself unreliable (wide CI on the variance estimate). This affects the Cohen''s
    d calculation.


    ---


    ## 4. Questions for Authors


    Q1. Can you run the post-RL experiment on at least one additional family (ideally
    Llama, given its very different baseline misfit profile)?


    Q2. How would a practitioner use IRT-FIT to audit a model on a benchmark without
    PSN-IRT parameters? What is the minimum viable parameter estimation pipeline?


    Q3. For the Δℓz* detection mode, what constitutes a "clean baseline" in practice?
    Could a different model of similar size/family serve as an approximate baseline?


    Q4. In Table 9, were actual controlled contamination experiments run on BBH and
    MATH, or are the |d| (ctrl) values projected from simulations?


    Q5. ConStat shows Δ = −0.015 post-RL (vs. IRT-FIT''s −0.035). What is IRT-FIT''s
    advantage over ConStat beyond not requiring a second inference pass?


    Q6. What is the false positive rate when applying IRT-FIT to models that are genuinely
    high-ability but not contaminated (e.g., a model trained on curriculum that naturally
    covers similar domains)?


    ---


    ## 5. Missing from Experimental Design


    Comparing against the review context (imagined experiments):


    | Experiment | Status in Paper |

    |---|---|

    | Controlled Contamination Pilot | ✓ Covered (Sec 4.1–4.4) |

    | Full Controlled Contamination (4 families × 3 benchmarks) | ✓ Covered (Sec 4.2–4.3)
    |

    | Leaderboard Audit | ✓ Correctly marked abandoned, discussed |

    | Base→Chat Natural Experiment | ✓ Covered (Sec 4.9) |

    | v1 IRT Refit Expanded | ✓ Discussed in Sec 5 |

    | 4PL vs 3PL Ablation | ✓ Covered (Sec 4.7) |

    | Baseline Comparison | ✓ Covered (Sec 4.5) |

    | Multiscale ℓzm | ✓ Covered (Sec 4.11) |

    | Post-RL | ✓ Covered but single-family only (Sec 4.6) |

    | Extended Benchmarks (BBH + MATH) | ~Partial (Sec 4.8, ambiguous ctrl vs. sim)
    |

    | Domain Analysis | ✓ Covered (Sec 4.10) |


    **Coverage is strong.** Nearly all imagined experiments are represented. The main
    gap is post-RL being single-family instead of multi-family.


    ---


    ## 6. Formatting & Compliance Checklist


    - [ ] **Page limit**: Main text appears to be ~9 pages in single-column format.
    Must verify compliance when reformatted to ACL two-column (8-page limit for long
    paper).

    - [ ] **Limitations section**: Missing as dedicated section (mandatory for EMNLP
    2026). Current "Scope and limitations" paragraph in Discussion does not satisfy
    the requirement.

    - [ ] **Responsible NLP Research Checklist**: Missing entirely (Sections A–E required).

    - [ ] **Anonymity**: Maintained (author listed as "Anonymous"). ✓

    - [ ] **References**: Only 6 cited. Far below expected density. Wang et al. (2025)
    and PSN-IRT not in reference list despite being central.

    - [ ] **Figures**: Zero figures in a 10-page paper with 13 tables. Severely under-visualized.


    ---


    ## 7. Scores


    | Dimension | Score | Justification |

    |---|---|---|

    | **Soundness** | 3.5 / 5 | Methodology is principled and well-grounded in psychometrics.
    Controlled experiments are rigorous. Deductions for: single-family post-RL validation,
    dependency on external IRT parameters without clear re-estimation path, narrow
    clean-baseline variance (n=3 seeds). |

    | **Excitement** | 3.5 / 5 | Novel angle connecting psychometrics to LLM contamination.
    The detection frontier framing and post-RL robustness are timely contributions.
    Tempered by practical deployment constraints (clean baseline requirement, IRT
    parameter dependency) and the overclaim on structural immunity. |

    | **Reproducibility** | 3.0 / 5 | Experimental protocol described at reasonable
    level. QLoRA SFT training details (rank, epochs, learning rate) not specified.
    PSN-IRT parameters sourced externally but not provided. Code and models promised
    "upon publication" but not available for review. |

    | **Overall Assessment** | 3.0 / 5 | **Findings-level.** |


    ---


    ## 8. Overall Assessment Justification


    The core idea—applying IRT person-fit statistics to LLM contamination detection—is
    novel, well-motivated, and timely. The "minimal-information operating point" framing
    is clean, and the post-RL robustness finding is genuinely important. The experimental
    breadth (4 families × 3 benchmarks × 6 levels, plus multiple supporting experiments)
    is impressive.


    However, the paper in its current form has significant gaps that prevent a Main
    Conference recommendation:


    1. **The flagship post-RL result is single-family**, which is insufficient for
    the strong claims made.

    2. **Practical deployment faces unaddressed circularity** (needing clean baselines
    to detect contamination; needing neural IRT parameters that are unavailable for
    most benchmarks).

    3. **Presentation is substantially incomplete**: zero figures, 6 references, missing

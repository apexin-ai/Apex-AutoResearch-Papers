  - name: 4PL vs 3PL(d=1) Ablation
    plan_id: exp-4pl-ablation
    description: '比较 4PL 和 3PL(d=1) 下的检测灵敏度。量化 feasibility parameter d 对 false alarm
      rate 和 detection power 的影响。

      '
    expected_results:
      far_4pl: 0.05
      far_3pl: 4.7-16.5%
      far_2pl: 50-100%
      mean_power_gain_4pl_vs_3pl_mmlu: +27.3pp
      mean_power_gain_4pl_vs_3pl_hellaswag: +26.1pp
      mean_power_gain_4pl_vs_3pl_gsm8k: +20.3pp
      pct_mmlu_items_d_lt_095: 0.46
      most_affected_model: DeepSeek-V3 (Δlz*=357)
      real_data_correlation_4pl_vs_3pl: 0.225
      real_data_rmse: 68.41
    result_rationale: '4PL d parameter 对 LLM contamination detection 至关重要的原因：LLM 不是人类考生，
      它们对某些 items 有系统性的 "blind spots"（即使 ability 很高也无法正确回答）。 4PL 的 d parameter（upper
      asymptote < 1.0）建模了这种 ceiling effect。 46% 的 MMLU items 有 d<0.95，意味着近一半 items
      的 "满分" 低于 1.0。 忽略 d (3PL, d=1) 会使高能力模型的 few-error pattern 被严重高估为 aberrant （因为
      model 预期 P(correct)→1.0 但 data 允许 P<1.0），inflating false alarm rate。 在 contamination
      detection 中，这相当于把 "正常的 ceiling effect miss" 误判为  "contamination signal"，halving
      detection power 因为 signal-to-noise ratio 被 inflated FAR 压缩。2PL 完全 miscalibrated
      因为同时忽略了 guessing (c) 和 ceiling (d)。

      '

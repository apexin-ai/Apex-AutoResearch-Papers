  review_report: "---\ndream_id: dream_20260521T032820\ntier: worst\noverall_score:\
    \ 2.5 — Borderline Findings\ntimestamp: 2026-05-21T04:16:15.436835+00:00\n---\n\
    \n# Review Report: \"When Can Binary Response Patterns Detect Benchmark Contamination?\
    \ An IRT Person-Fit Characterization\"\n\n## Summary\n\nThis paper investigates\
    \ whether IRT person-fit statistics (ℓz*) can detect benchmark contamination using\
    \ only binary (correct/incorrect) response patterns — the minimal-information\
    \ operating point on the contamination detection frontier. Through controlled\
    \ contamination experiments (QLoRA SFT at six levels across four model families\
    \ and three benchmarks), the paper characterizes when binary-only detection succeeds\
    \ and fails. The main finding is that detection is highly conditional: it works\
    \ only for specific model families (Qwen, Llama) on MMLU, fails for others (Gemma,\
    \ Mistral) due to low memorization fractions from strong SFT generalization, fails\
    \ on non-MMLU benchmarks due to insufficient item counts, and fails entirely post-RL.\
    \ The binary-only ℓz* trails privileged methods by 23 AUROC points. The paper\
    \ frames itself as a characterization study rather than proposing a practical\
    \ detection tool.\n\n---\n\n## Soundness: 2.5 / 5\n\n### Statistical concerns\n\
    \n- **n=3 seeds per condition** is the most critical weakness. Cohen's d estimates\
    \ with n=3 have extremely wide confidence intervals. The reported |d|=2.8 for\
    \ Qwen MMLU could plausibly range from ~0.5 to ~5.0 with a 95% CI at this sample\
    \ size. The paper acknowledges this in Limitations but still builds its entire\
    \ argument around point estimates of d. The go/no-go boundary (|d|>2 vs |d|<1)\
    \ is not statistically rigorous with this sample size.\n\n- **Multiple comparisons**:\
    \ 4 families × 3 benchmarks × 6 contamination levels = 72 cells, plus post-RL\
    \ conditions. No correction for multiple comparisons is mentioned. The claim that\
    \ Gemma (|d|=0.7) \"fails\" while Qwen (|d|=2.8) \"succeeds\" would benefit from\
    \ formal testing of whether these are statistically distinguishable, not just\
    \ different point estimates.\n\n- **Power function validation**: R²≈0.65 is reported\
    \ as the fit between theoretical and observed power. This is modest — the power\
    \ function explains only 65% of variance, yet it's presented as a key contribution\
    \ (Contribution 2). The 40–70% gap between theoretical and adjusted power (due\
    \ to memorization fraction) means the theoretical power function is not practically\
    \ useful without knowing m_f, which is only available in controlled experiments.\n\
    \n### Methodological concerns\n\n- **θ-fixed correction** requires a clean baseline\
    \ checkpoint, which is unavailable for any real-world model of unknown provenance.\
    \ This makes the correction purely a diagnostic tool for controlled experiments,\
    \ not a practical method. The paper acknowledges this but still lists it as a\
    \ contribution.\n\n- **Baseline comparison fairness**: Comparing ℓz* (binary-only)\
    \ to ConStat (rephrased retesting) and Min-K%++ (token probabilities) across fundamentally\
    \ different information access levels is conceptually interesting but the \"23-point\
    \ AUROC gap\" framing conflates information access with method quality. A fairer\
    \ comparison would be against other binary-only methods beyond accuracy z-score.\
    \ Only one binary-only baseline is included.\n\n- **Extended benchmarks (BBH,\
    \ MATH)**: These require \"custom calibration\" for 4PL parameters. The paper\
    \ does not describe how this calibration was done, its quality, or its sample\
    \ size — a significant omission given that Section 6.2 demonstrates that classical\
    \ IRT estimation fails catastrophically (a_r=0.13). If custom calibration uses\
    \ classical methods, the BBH/MATH results are unreliable.\n\n- **Simulation ablation\
    \ disconnect**: Table 1 (4PL vs 3PL) is based on simulation where IRT assumptions\
    \ hold. The paper correctly notes (Section 5.1) that this advantage only manifests\
    \ for families where detection works at all, undermining the generality of the\
    \ simulation evidence.\n\n---\n\n## Excitement / Novelty: 3 / 5\n\n### Strengths\
    \ of the research question\nThe \"what can binary patterns detect?\" question\
    \ is well-motivated. The detection frontier concept — positioning methods along\
    \ an information access spectrum — is a useful conceptual framework for the contamination\
    \ detection literature. This framing is genuinely novel.\n\n### Concerns about\
    \ contribution magnitude\n- The paper's honest characterization framing is commendable,\
    \ but the resulting picture is quite narrow: binary-only detection works for 2/4\
    \ families on 1/3 benchmarks at the pre-RL stage only. This is a very constrained\
    \ positive result.\n- The negative results (post-RL failure, classical IRT gap,\
    \ family-dependent detection) are individually unsurprising: post-RL detection\
    \ failure was already established by Wang et al. (2025) for MIA methods; the classical-neural\
    \ IRT estimation gap is expected given the architectural differences; family-dependent\
    \ performance is common in ML.\n- The universal model misfit finding (Section\
    \ 6.1, 57/60 cells extreme ℓz*) is the most interesting standalone finding, but\
    \ receives only half a page of discussion.\n- Applying IRT person-fit statistics\
    \ to LLM contamination is novel in the specific combination, though the connection\
    \ between person-fit and cheating detection is well-established in psychometrics.\n\
    \n---\n\n## Reproducibility: 3 / 5\n\n- The paper promises release of checkpoints\
    \ and code, which would substantially aid reproduction.\n- QLoRA SFT details are\
    \ sparse: rank, alpha, learning rate, epochs, and other hyperparameters are not\
    \ specified. These affect memorization fraction directly.\n- GRPO hyperparameters\
    \ for post-RL experiments are limited to \"2000 steps with rule-based accuracy\
    \ reward.\"\n- PSN-IRT is cited as the source of 4PL parameters, but the specific\
    \ version/release of these parameters is not identified.\n- The simulation setup\
    \ for the 4PL ablation (Table 1) is not described in enough detail to reproduce.\n\
    \n---\n\n## Strengths\n\n- **Honest framing**: The paper explicitly positions\
    \ itself as characterization rather than claiming a general detection tool. This\
    \ intellectual honesty is rare and valuable. The boundary conditions (benchmark\
    \ size ≳10K, memorization fraction ≳0.25, pre-RL stage) are clearly stated.\n\
    - **Detection frontier concept**: Positioning contamination detection methods\
    \ along an information access spectrum (binary < log-probs < token-probs < rephrased\
    \ retest) provides a useful organizing framework for the field.\n- **Breadth of\
    \ investigation**: 4 model families × 3 primary benchmarks × 6 contamination levels\
    \ + 2 extended benchmarks + post-RL experiments + 5 baselines + classical IRT\
    \ refit + natural experiment. The experimental scope is ambitious.\n- **Memorization\
    \ fraction as explanatory variable**: The identification of m_f as the key determinant\
    \ of detection power (Table 4, correlation with |d|) is a clean mechanistic finding.\n\
    - **θ-shift identification**: Documenting the non-monotonic dose-response under\
    \ free-θ estimation (Table 2) and showing that fixing θ restores monotonicity\
    \ (Table 5) is a useful methodological insight for future IRT-based LLM evaluation.\n\
    - **Universal misfit finding**: The discovery that 57/60 (model, benchmark) cells\
    \ violate IRT assumptions (Section 6.1) has implications beyond contamination\
    \ detection, affecting any IRT-based LLM evaluation.\n- **Negative results are\
    \ honestly reported**: Post-RL failure, leaderboard audit abandonment, classical\
    \ IRT gap — all presented transparently.\n\n---\n\n## Weaknesses\n\n- **Severely\
    \ limited practical applicability**: Detection works for 2/4 model families, on\
    \ 1/3 benchmarks, only pre-RL, and only with known-clean baselines for θ-fixed\
    \ correction. In practice, contamination detection is most needed for models of\
    \ unknown provenance where none of these conditions can be verified. The paper's\
    \ method has essentially zero real-world deployment value.\n- **Very small sample\
    \ sizes (n=3 seeds)**: All effect size estimates are based on 3 seeds per condition.\
    \ This provides insufficient statistical power for the quantitative claims. The\
    \ bold assertions about |d| thresholds (\">2 for Qwen/Llama\", \"<1 for Gemma/Mistral\"\
    ) could shift substantially with more seeds.\n- **23-point AUROC gap**: At 0.62\
    \ AUROC, ℓz* is only modestly above chance (0.50) and far below methods that practitioners\
    \ would actually use. The paper quantifies the \"cost of minimal information\"\
    \ but the cost is so high that the practical conclusion is simply \"don't use\
    \ binary-only detection.\"\n- **Post-RL detection failure eliminates the main\
    \ use case**: Most deployed models undergo RLHF/GRPO. Section 5.4 shows post-RL\
    \ detection power of 8%. This means the method is inapplicable to the vast majority\
    \ of models users would want to audit.\n- **Only 7–12B models tested**: No models\
    \ larger than 12B are included. Scaling effects on memorization fraction, SFT\
    \ generalization, and detection power are completely unexplored. Given that larger\
    \ models may have fundamentally different memorization behavior, this limits generalizability.\n\
    - **Sparse related work**: Only 9 references. Missing substantial bodies of work:\n\
    \  - Other contamination detection methods (CDD, LMC-Index, BenchmarkBlindspot,\
    \ etc.)\n  - Broader IRT-for-LLM literature beyond PSN-IRT\n  - SFT generalization\
    \ / catastrophic forgetting literature relevant to the memorization fraction mechanism\n\
    \  - Recent contamination survey papers\n  - More person-fit statistics references\
    \ (the field is much larger than 2 papers)\n- **Natural experiment adds nothing**\
    \ (Section 6.3): n=4 pairs, power<0.2 for d=0.5, all p>0.28. This section should\
    \ be removed or reduced to a footnote. Including severely underpowered null results\
    \ as a section wastes space and may mislead readers into thinking base→chat comparison\
    \ was meaningfully tested.\n- **Cross-benchmark aggregation adds nothing** (Section\
    \ 5.7): ℓz_m is marginally worse than MMLU-only ℓz*. One sentence in Discussion\
    \ would suffice.\n- **Extended benchmark calibration is opaque**: BBH and MATH\
    \ require custom 4PL calibration, but Section 6.2 demonstrates that classical\
    \ IRT estimation fails. How were these parameters obtained? If via PSN-IRT fine-tuning,\
    \ this should be stated; if via classical methods, the results are unreliable\
    \ given Table 13.\n- **No Responsible NLP Research Checklist visible**: The PDF\
    \ shows no Sections A–E checklist. This is a mandatory component for ARR submission\
    \ and could trigger desk reject.\n- **No appendix with supplementary details**:\
    \ The paper would benefit from appendices covering QLoRA hyperparameters, simulation\
    \ setup details, full dose-response curves, and confidence intervals for all effect\
    \ sizes.\n\n---\n\n## Questions for Authors\n\n1. **Statistical robustness**:\
    \ With n=3 seeds, what are the 95% confidence intervals for the Cohen's d estimates\
    \ in Table 3? Would the family-dependent conclusion (Qwen/Llama succeed, Gemma/Mistral\
    \ fail) survive with wider CIs? Have you considered bootstrapping over seeds?\n\
    \n2. **Extended benchmark calibration**: How were 4PL parameters obtained for\
    \ BBH and MATH? If using the same MML-EM approach that fails for v1 leaderboard\
    \ data (Table 13, a_r=0.13), how should we interpret the BBH/MATH results?\n\n\
    3. **Memorization fraction mechanism**: You identify m_f as the key explanatory\
    \ variable (Table 4). Is the family-dependent m_f (Qwen/Llama: 0.32–0.35 vs Gemma/Mistral:\
    \ 0.15–0.17) a property of the model architecture, the QLoRA hyperparameters,\
    \ or the specific training recipe? If the latter, wouldn't different hyperparameters\
    \ change the detection outcome, making the family-dependent conclusion unstable?\n\
    \n4. **Practical scenario**: Under what realistic scenario would a practitioner\
    \ use ℓz*? They would need: (a) a model known to be pre-RL, (b) from the Qwen\
    \ or Llama family, (c) with a clean baseline checkpoint, (d) tested on MMLU specifically.\
    \ Can you identify any real-world use case meeting all four conditions?\n\n5.\
    \ **Universal misfit**: The 57/60 extreme ℓz* values (Section 6.1) seem like the\
    \ most impactful finding for the broader community. Why is this relegated to Discussion\
    \ rather than being a primary contribution? Have you investigated which specific\
    \ IRT assumptions are most violated?\n\n---\n\n## Missing References\n\nThe paper\
    \ cites only 9 references, which is unusually sparse for an EMNLP submission.\
    \ Notable gaps:\n- **Contamination detection surveys**: Ravaut et al. (2024),\
    \ Balloccu et al. (2024) — both provide comprehensive taxonomies of detection\
    \ methods\n- **Other detection methods**: CDD (Oren et al.), LMC-Index, BenchmarkBlindspot\
    \ — several binary-adjacent or low-information methods exist\n- **IRT for LLMs**:\
    \ Work by Yin et al. (2024), Polo et al. (2024) on IRT-based LLM evaluation\n\
    - **SFT generalization**: The memorization fraction finding connects to catastrophic\
    \ forgetting / generalization literature in fine-tuning\n- **Person-fit statistics**:\
    \ Karabatsos (2003), Emons et al. (2005) — the psychometrics literature on person-fit\
    \ is extensive\n- **RL and contamination**: Beyond Wang et al. (2025), other work\
    \ on how RLHF affects memorization\n\n---\n\n## Formatting / Compliance\n\n- **Page\
    \ limit**: Main text appears to be 8 pages (through end of Section 8), consistent\
    \ with EMNLP 2026 limits. Limitations and References extend to pages 10–11.\n\
    - **Limitations section**: Present (page 10). Covers fine-tuning method, model\
    \ size range, PSN-IRT dependence, θ-fixed baseline requirement, and sample size.\
    \ Adequate but could mention the information access gap more explicitly.\n- **Responsible\
    \ NLP Research Checklist**: **NOT VISIBLE** in the PDF. Sections A–E are mandatory\
    \ for ARR. This is a potential desk-reject trigger.\n- **Anonymity**: Maintained\
    \ — \"Anonymous\" author, no self-identifying information detected.\n- **Citations**:\
    \ All 9 references appear legitimate. PSN-IRT (2026) and CoDeC (ICLR 2026) are\
    \ plausible recent publications. Shao et al. (2024) for GRPO is correct. No obviously\
    \ hallucinated citations detected.\n\n---\n\n## Overall Assessment: 2.5 / 5 (Borderline\
    \ Findings)\n\n**Calibration reasoning:**\n\nThe paper asks a well-motivated question\
    \ and takes an honest characterization approach. The experimental scope is broad.\
    \ The detection frontier framing, universal misfit finding, θ-shift identification,\
    \ and classical-neural IRT gap are individually interesting contributions.\n\n\
    However, the cumulative picture is concerning:\n\n1. **The core method doesn't\
    \ work well enough to be useful.** AUROC of 0.62 in the best case (MMLU, Qwen/Llama,\
    \ pre-RL, with clean baseline) and functional failure everywhere else means there\
    \ is no practical deployment scenario. The paper quantifies the cost of minimal\
    \ information but the answer is essentially \"the cost is too high.\"\n\n2. **Statistical\
    \ rigor is insufficient.** n=3 seeds is too few for the quantitative claims being\
    \ made. The boundary between \"detection works\" (|d|>2) and \"detection fails\"\
    \ (|d|<1) is presented as a clean dichotomy but could be an artifact of small\
    \ sample sizes.\n\n3. **The scope of positive results is very narrow.** 2/4 families\
    \ × 1/3 benchmarks × pre-RL only × with clean baseline = an extremely constrained\
    \ success region. The characterization framing papers over this, but \"we found\
    \ that binary detection barely works under the most favorable conditions\" is\
    \ a thin contribution.\n\n4. **Presentation gaps.** Missing NLP Research Checklist\
    \ (desk-reject risk), sparse references (9 citations), underpowered experiments\
    \ reported as sections (natural experiment, cross-benchmark aggregation), and\
    \ insufficient methodological detail (QLoRA hyperparameters, extended benchmark\
    \ calibration).\n\n5. **The most interesting finding (universal misfit) is underexplored.**\
    \ Section 6.1 could anchor a stronger paper but gets half a page.\n\nThe paper\
    \ has too many limitations to reach Main conference (4.0) and the narrow scope\
    \ of positive results makes even Findings borderline. The characterization framing\
    \ is intellectually honest but the characterized region is so small that the practical\

      结构），ConStat 依赖 re-test（需要额外推理开销）。

      Bootstrap CIs 是 6/8 同行论文不报告的差异化优势——在 best tier，CI 重叠明确表明 "lz* 在低污染区间与 privileged
      methods 竞争力相当"，而非声称 superiority。


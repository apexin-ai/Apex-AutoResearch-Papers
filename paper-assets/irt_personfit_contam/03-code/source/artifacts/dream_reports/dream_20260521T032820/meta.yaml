      gsm8k_any_family_d_gt_2: false
      gsm8k_best_family_d: 0.8
      hellaswag_best_family_d: 1.2
    result_rationale: 'Worst 档核心假设：ctrl-contam 仅在已验证的 Qwen+Llama 有效。

      Qwen/Llama 成功原因：这两个家族在 SFT 时 memorization fraction 较高（32-38%）， 产生足够的 aberrant
      pattern 让 lz* 捕捉。Qwen baseline misfit 高（lz*≈8.7）， Llama baseline 低（lz*≈-0.14），但两者都在
      MMLU 上产生 |d|>2。

      Gemma 失败原因：Gemma 家族的 SFT generalization 特别强。SFT 后模型不仅记住 seen items， 还大幅提升 unseen
      items 的正确率，memorization fraction 降至 15%。 这意味着 contaminated response pattern
      与 "genuinely improved" pattern 几乎不可区分。 另外 Gemma 的 4PL 参数适配可能不佳——PSN-IRT 的参数是在不同模型群体上估计的，
      Gemma 架构的 response pattern 可能需要不同的 item parameters。 |d|=0.7 在统计上可能 barely significant（p≈0.05
      with n=3），但不足以支撑 detection claim。

      Mistral 失败原因：Mistral-7B-v0.3 是相对较弱的模型，baseline accuracy 低。 SFT 后 θ 提升幅度大但 pattern
      变化方式更像 "legitimate learning"。 4PL 参数对低能力模型的 discrimination 不足（a 参数区域覆盖差）， 导致
      lz* 对 contamination-induced pattern change 不敏感。|d|=0.4，不显著。

      非 MMLU benchmark 失败原因：n_items 不足。HellaSwag (10K) 勉强可用但 4PL 参数估计质量下降， GSM8K (1.3K)
      太小导致 lz* 方差大、信噪比低。power function 预测 GSM8K@15% 理论 power≈59%， 但 SFT generalization
      折扣后 adjusted power≈20-30%。

      θ-fixed 仅在 Qwen+Llama 恢复信号：因为这两个家族的 θ-shift 是主要 confound， fix θ 后信号恢复。Gemma/Mistral
      的问题不是 θ-shift 而是 memorization fraction 本身太低， θ-fixed 无法修复根本问题。


      post_rl_detection_power: 0.08
      rl_training_steps: 2000
      rl_reward_type: rule-based (MMLU accuracy)
      memorization_fraction_post_rl: 0.05
      theta_shift_post_rl: 0.62
      experiment_completion: true
    result_rationale: 'Worst 档核心假设：post-RL 检测完全失败（|d|<0.5）。

      GRPO 训练对 contamination signal 的破坏机制： (1) RL 优化 reward（整体 accuracy），不区分 seen/unseen
      items， 将 memorization-specific pattern 平滑化为 general improvement pattern； (2)
      RL 的 policy gradient update 改变了 response distribution 的结构， 消除了 SFT 阶段产生的 item-level
      aberrance pattern； (3) θ-shift 在 RL 后更严重（Δθ=0.62），因为 RL 同时提升 seen+unseen performance；
      (4) memorization fraction 从 pre-RL 的 ~35% 降至 post-RL 的 ~5%， 因为 RL 让模型"真正学会了"而非记住答案。

      这与 Wang et al. (2025) 的发现一致：RL 不仅破坏 log-prob methods， 也破坏 binary-pattern methods。差异在于
      log-prob methods 因 distributional shift 失效， 而 binary-pattern methods 因 memorization-to-generalization
      conversion 失效。 机制不同但结果相同：post-RL detection ≈ random。

      唯一的正面叙事：lz* 的失败模式（memorization→generalization） 与 MinK%++ 的失败模式（distributional
      shift）不同， 这意味着两者可能 complementary——但在 worst 档下无法验证此假设。


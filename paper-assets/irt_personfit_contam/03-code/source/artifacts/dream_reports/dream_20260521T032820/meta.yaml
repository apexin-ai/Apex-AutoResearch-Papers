    ---


    # Review Report: Detection and Characterization of Benchmark Contamination via
    IRT Person-Fit Statistics


    **Venue**: EMNLP 2026 (ARR)


    ---


    ## Overall Assessment: 3.0 (Findings)


    ## Dimension Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 / 5 |

    | Excitement | 3.0 / 5 |

    | Reproducibility | 3.5 / 5 |


    ---


    ## Summary


    This paper repurposes IRT person-fit statistics (ℓz*) for LLM benchmark contamination
    detection using only binary (correct/incorrect) response patterns. The key claim
    is that this establishes a "minimal-information operating point" on the contamination
    detection frontier—no token probabilities, model weights, or rephrased items required.
    Through controlled contamination experiments (QLoRA SFT injection across 4 model
    families × 3 benchmarks × 6 contamination levels), the paper demonstrates |Cohen''s
    d| > 2.0 in 3/4 families at 15% contamination on MMLU, validates a detection power
    function (R² = 0.88), and achieves AUROC 0.80 at 15% contamination—outperforming
    accuracy z-scores (0.62) but trailing privileged methods like Min-K%++ (0.92).
    Supplementary analyses cover 4PL vs 3PL ablation, domain-level contamination typologies,
    post-RL robustness (preliminary), IRT parameter estimation challenges, and a multiscale
    aggregation statistic.


    ---


    ## Strengths


    ### S1: Novel and well-motivated research question

    The connection between psychometric item preknowledge detection and LLM benchmark
    contamination is genuinely creative and previously unexplored. The "minimal-information
    operating point" framing is practically significant: binary response patterns
    are universally available (proprietary APIs, historical leaderboard archives)
    where token-level access is not. This is a clean, well-defined research contribution.


    ### S2: Methodologically rigorous controlled experiments

    The 4 family × 3 benchmark × 6 level experimental matrix is thorough. The paper
    covers the space well: the pilot → full expansion progression is sound, the θ-fixed
    analysis addressing non-monotonic dose-response is a genuine methodological insight
    (identifying and solving the θ-shift confound), and the memorization fraction
    analysis adds interpretive depth. The controlled contamination design with 3 clean
    seeds provides a principled ground truth.


    ### S3: Honest and transparent reporting

    The paper commendably avoids overclaiming. The baseline comparison (§5.4) honestly
    reports the 10-12 AUROC point gap with privileged methods rather than cherry-picking
    favorable conditions. The Gemma boundary condition (|d| = 1.3) is reported as
    a characterized limitation rather than hidden. The information-access vs detection-power
    frontier (Table 7) is the right framing. The IRT parameter estimation failure
    (§6.2, a_r = 0.13) is reported as a negative result rather than omitted. This
    honesty strengthens credibility.


    ### S4: Strong ablation design

    The 4PL vs 3PL ablation (§5.3) is well-executed: the +10–22pp power gain, the
    correlation between advantage and %items with d < 0.95, and the catastrophic 2PL
    failure collectively build a convincing case for the 4PL model choice. The r =
    0.35 correlation between 4PL and 3PL ℓz* values effectively demonstrates these
    are fundamentally different measurements.


    ### S5: Comprehensive experiment coverage

    The paper covers 10 of 11 planned experiments from the design document. Even abandoned
    paths (leaderboard audit) and underpowered results (natural experiment) are reported
    in appropriate sections (Discussion/Appendix), demonstrating research completeness.
    The power function validation across 7 benchmarks spanning 164–14,042 items (Table
    8) is particularly convincing for the theoretical claims.


    ### S6: Domain-level characterization

    The extension from detection to characterization (§5.6) adds meaningful value.
    The uniform vs. selective contamination typology (Gemini-1.5 vs. Doubao) provides
    actionable diagnostic information beyond a binary contamination flag. This "Detection
    and Characterization" framing in the title is earned by the results.


    ---


    ## Weaknesses


    ### W1: Dependence on pre-estimated IRT parameters severely limits applicability
    (Major)

    The framework requires pre-estimated 4PL item parameters from PSN-IRT, and §6.2
    demonstrates that re-fitting IRT from leaderboard data fails catastrophically
    (discrimination a_r = 0.13 at N = 500, far below the 0.4 threshold). This creates
    a fundamental applicability bottleneck: the method only works on benchmarks where
    PSN-IRT has already estimated 4PL parameters. The paper doesn''t quantify how
    many benchmarks this covers or discuss pathways to expand coverage. For an EMNLP
    contribution claiming to establish a detection framework, this limitation is significant—the
    framework is more of a proof-of-concept on PSN-IRT-supported benchmarks than a
    general-purpose tool.


    ### W2: Controlled contamination via QLoRA SFT has limited external validity (Major)

    All controlled experiments use a single contamination mechanism: QLoRA SFT injection
    of benchmark items into training data. Real-world contamination occurs through
    diverse pathways—pretraining data overlap, data augmentation, synthetic data generation,
    instruction tuning on benchmark-derived content. The paper acknowledges this (§6.6)
    but doesn''t provide evidence that the detected signal generalizes across contamination
    mechanisms. The memorization fraction (0.22–0.42) is architecture-dependent under
    QLoRA SFT; it could behave entirely differently under pretraining exposure. Without
    cross-pathway validation, the generalizability of the effect sizes and detection
    thresholds is uncertain.


    ### W3: Performance gap with privileged methods limits practical impact (Moderate)

    At 15% contamination, ℓz* (AUROC 0.80) trails Min-K%++ (0.92) by 12 points and
    ConStat (0.88) by 8 points. While the "minimal-information" framing partially
    addresses this, the practical scenarios where binary-only detection is the only
    option are narrow. For open-weight models (where token probabilities are accessible)
    and for models with API access (where rephrasing-based approaches work), privileged
    methods dominate. The paper''s strongest use case—historical leaderboard archives—is
    undermined by the IRT parameter estimation failure (W1). The paper should more
    concretely demonstrate the method on the archival case it motivates.


    ### W4: Post-RL results are too preliminary to support the structural advantage
    claim (Moderate)

    The post-RL analysis (§6.1) covers a single model family (Qwen3.5-9B), single
    RL method (GRPO), single benchmark (MMLU), and single contamination level (15%).
    The signal retention (|d| from 2.50 to 1.10, 44%) is interesting but "moderate"
    by the paper''s own admission. The comparison with MIA methods (Table 11) is compelling
    directionally but the n = 1 configuration design space makes the "structural advantage"
    framing premature. The paper appropriately hedges ("preliminary evidence") but
    still allocates substantial space (§6.1) to results that cannot support strong
    conclusions. This would be better as a brief mention with a pointer to future
    work.


    ### W5: Small sample sizes for Cohen''s d estimation (Moderate)

    Cohen''s d values are computed from n = 3 clean seeds with ddof = 1 (the pilot
    uses n = 2). With 2 degrees of freedom, the sampling distribution of d is wide,
    and the reported effect sizes carry substantial uncertainty. The paper reports
    bootstrap 95% CIs for AUROC (Table 6) but not for the primary Cohen''s d metric
    (Tables 2–3). Given that the entire detection claim rests on |d| > 2.0 thresholds,
    confidence intervals on d are essential. The Gemma boundary condition (|d| = 1.3)
    is particularly sensitive to this—the true d could plausibly range from 0.5 to
    2.1 with n = 3.


    ### W6: Broken references throughout the paper (Major — formatting)

    Multiple citations appear as "?" or "??" (§1, §2.2, §3.1, §4.2, §6.1, §7). This
    makes it impossible to verify claims about prior work, assess the positioning
    against related methods, or confirm that cited results (e.g., "? demonstrate that
    all log-probability methods degrade to near-chance after RL training") are accurately
    represented. At minimum 10+ references are broken. This would be an automatic
    desk-reject risk at ARR.


    ### W7: Paper likely exceeds the 8-page main text limit

    The main text (Abstract through §8 Conclusion, excluding the Limitations section
    which is exempt) appears to span approximately 10+ pages. EMNLP 2026 enforces
    a strict 8-page limit for main text. The paper needs significant condensation—§6.3
    (natural experiment) and §6.4 (multiscale aggregation) are candidates for appendix
    relocation, and the Discussion section overall is diffuse.


    ---


    ## Detailed Comments and Questions


    ### Method

    1. **θ-fixed analysis**: The θ-fixed approach (§3.2) is a genuine contribution
    but the paper doesn''t discuss when θ_clean is unavailable. In real-world detection
    (not controlled experiments), there is no "clean baseline" to fix θ to. How would
    the framework operate without controlled conditions?


    2. **Detection power theory**: Eq. 4 provides an upper bound, but the gap between
    theoretical and simulated power (Table 8) is attributed to the memorization fraction
    φ. Since φ varies from 0.22 to 0.42 across architectures, the power function is
    not truly predictive without knowing φ—which requires running the controlled experiment.
    This circularity limits the theory''s practical forecasting value.


    3. **Δℓz* design**: The shift to within-model Δℓz* comparison (§3.1, Stage 3)
    is well-motivated by the universal misfit finding (§6.5). However, this means
    the method requires a clean baseline for each model under investigation. How does
    one obtain this in practice? The paper should discuss practical deployment scenarios
    more concretely.


    ### Experiments

    4. **Gemma-4-31B**: Using a 31B model alongside 7–9B models introduces a confound
    between model size and baseline ability. The weaker signal could be due to model
    size, architecture, or instruction tuning quality. A 7–9B Gemma variant would
    help disentangle these factors.


    5. **Benchmark selection**: Three controlled contamination benchmarks (MMLU, HellaSwag,
    GSM8K) span the item count range well, but all are multiple-choice or short-answer.
    The framework''s applicability to generation-based benchmarks (e.g., HumanEval,
    which appears only in Table 8 with power 0.24) is unclear.


    6. **Table 8 data sources**: BBH and MATH appear in the power function validation
    (Table 8) but §4.2 notes these "require separate 4PL estimation from 50+ model
    responses." Were these parameters estimated by the authors or sourced from PSN-IRT?
    If self-estimated, the quality concern from §6.2 (a_r collapse) applies. This
    needs clarification.


    ### Presentation

    7. Several Discussion subsections (§6.3 natural experiment, §6.4 multiscale aggregation)
    report negative or marginal results that add page count without strengthening
    claims. These could be condensed to 1–2 sentences each or moved to appendix.


    8. The paper would benefit from a concrete workflow figure showing how a practitioner
    would apply the framework end-to-end, including the practical constraints (need
    for PSN-IRT parameters, clean baselines, etc.).


    ---


    ## Missing Experiments / Coverage Gaps


    Relative to the experiment design, the paper covers all planned experiments adequately.
    The abandoned leaderboard audit and underpowered natural experiment are appropriately
    scoped as Discussion items. No critical experiments are missing.


    However, two extensions would significantly strengthen the paper:

    - **Cross-contamination-pathway validation**: Testing with at least one non-QLoRA
    contamination method (e.g., continued pretraining on benchmark data) to establish
    external validity.

    - **Real-world case study**: Applying the framework to a known contamination case
    (e.g., a model publicly documented as contaminated) to demonstrate practical utility
    beyond controlled settings.


    ---


    ## Minor Issues


    - Table 1 caption says "corrected per ?" — broken reference.

    - The term "person-fit" may be unfamiliar to the NLP audience; a brief intuitive
    gloss in §1 would help.

    - The memorization fraction analysis (Table 4) is interesting but the mechanism
    linking architecture to memorization rate is speculative. Consider softening the
    claims about "architecture-dependent SFT generalization."

    - §6.5 (Universal 4PL Model Misfit) is an interesting observation that deserves
    its own short paper or workshop contribution rather than a subsection.


    ---


    ## Verdict


    This paper introduces a genuinely novel angle on contamination detection by connecting
    IRT person-fit statistics to the LLM evaluation setting. The research question
    is clean, the controlled experiments are thorough, and the honest reporting of
    limitations and negative results demonstrates research integrity. The θ-fixed
    analysis and the information-access frontier framing are real methodological contributions.


    However, the practical impact is constrained by three compounding limitations:
    (1) dependence on pre-estimated IRT parameters with no viable path to self-estimation,
    (2) external validity concerns from QLoRA-only contamination, and (3) a 12-point
    AUROC gap with privileged methods in the regime where contamination is most practically
    concerning. The broken references and likely page limit violation are additional
    concerns that must be addressed.


    The paper is above the threshold for Findings—the novel psychometric connection
    and the systematic experimental characterization are valuable contributions to
    the contamination detection literature. It falls short of the main conference
    bar primarily because the practical applicability story is incomplete: the framework
    cannot yet be deployed as a general-purpose tool, and the strongest motivation
    (archival/historical detection) is undermined by the IRT parameter estimation
    failure.


    **Recommendation**: Accept to Findings with revisions. Fix references, condense
    to 8 pages, add confidence intervals on Cohen''s d, and clarify the BBH/MATH parameter
    estimation source.


    ---


    ## Confidence


    4/5 — I am confident in my assessment. I have expertise in evaluation methodology
    and statistical testing, and I have read the paper carefully. My uncertainty is
    primarily around the IRT/psychometrics literature depth.


  - name: exp-post-rl
    plan_id: exp-post-rl
    description: Post-RL 检测：SFT 污染 → GRPO 训练 → person-fit 测试
    expected_results:
      cohens_d_pre_rl_15pct: -2.5
      cohens_d_post_rl_15pct: -0.3
      cohens_d_post_rl_50pct: -0.4
      lz_star_post_rl_contam_15: 7.8
      lz_star_post_rl_clean: 8.1

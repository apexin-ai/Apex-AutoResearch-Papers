      narrative_direction: 核心 detection claim 不成立，必须 reframe。三个可行的 pivot angle（均仍冲
        EMNLP main）： (1) **"Characterization paper"**——重心从 "我们能检测" 转向 "我们 characterize
        了 binary response patterns 的信息边界"。Universal misfit（57/60）本身是 novel finding；θ-shift
        mechanism 是 methodological contribution；power function + memorization fraction
        量化了 binary-only 方法的理论天花板。Claim 重构为："IRT person-fit reveals that LLM response
        patterns fundamentally violate psychometric assumptions (Claim 1), detection
        power from binary patterns alone has a predictable ceiling governed by n_items
        and memorization fraction (Claim 2), and θ-shift is a previously uncharacterized
        confound in ability-based contamination detection (Claim 3)." (2) **"Impossibility
        + possibility boundary paper"**——强调 simulation-to-reality gap 本身：simulation
        证明理论可行（97.9%），ctrl-contam 证明 SFT generalization 是核心瓶颈， quantify 这个 gap 是贡献。"我们精确度量了
        the gap between what binary patterns could detect in theory and what they
        actually detect after SFT generalization。" (3) **"Diagnostic tool paper"**——放弃
        binary detection vs privileged methods 的比较叙事， 转向 "lz* 作为 complementary diagnostic"：即使绝对检测力不足，seen/unseen
        memorization fingerprint 和 domain-level anomaly profiles 提供了其他方法无法给出的 interpretability。
        无论哪个 angle，已有的 simulation + universal misfit + θ-shift + 4PL ablation + seen/unseen
        split 均为 solid contributions。Worst case 不是 "没有 paper"，是 "不同的 paper"。

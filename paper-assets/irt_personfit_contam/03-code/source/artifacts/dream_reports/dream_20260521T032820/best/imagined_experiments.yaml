    theta_fixed_value: -0.097
    theta_fixed_contam_15_lz_star: 11.85
    theta_fixed_contam_50_lz_star: 18.58
    theta_fixed_dose_response_ratio: 3.12
    theta_fixed_monotonic: true
    seen_unseen_fingerprint: seen lz*≈0, unseen lz*≈3.1 at 15%
  result_rationale: 'Qwen2.5-7B-Instruct 基线 misfit 较高（clean lz*≈8.68），这是因为 Qwen 家族经过大规模多阶段训练，
    其 response pattern 本身就强烈偏离 4PL 预测。QLoRA SFT 15% 注入使模型记住约 38% 的 seen items （SFT
    泛化效应：不是所有注入 items 都被死记硬背），这些 memorized items 从 aberrant 变为 expected， 拉低 lz*（从
    8.68 降到 3.85），产生 |d|=3.42 的强效应。50% 注入时 θ-shift 效应主导：θ_MLE 大幅上升 （Δθ=0.47），re-estimated
    θ 吸收了大部分 aberrance signal，导致 free-θ 下 d 仅 0.99（非单调）。 但 θ-fixed 分析（固定 θ 为 clean
    baseline）恢复单调：contam_15 Δlz*=3.17, contam_50 Δlz*=9.89， ratio=3.12，因为此时 θ-shift
    confound 被消除，纯 memorization signal 正确累积。 seen/unseen 分离是最清晰的指纹：memorized items
    的 response pattern 从 aberrant 变为 model-predicted， 而 unseen items 保持或加剧 aberrance（因
    θ-shift 导致 ability 高估）。


- name: v1 IRT Refit Expanded (N=178, Path D Closure)
  plan_id: exp-v1-irt-refit-expanded
  description: '扩大 v1 IRT 重拟合样本量至 N=178。最终确认 pilot N=63 的 a_r=0.111 是否因样本量不足。 关闭 Path
    D。

    '
  expected_results:
    n_models_downloaded: 178
    n_items: 14042
    3pl_a_pearson_r: 0.127
    2pl_a_pearson_r: -0.029
    3pl_b_pearson_r: 0.663
    a_r_threshold_met: false
    path_d_conclusion: dead
    b_r_partial_validation: 0.663
  result_rationale: 'N=178 仍远不足以弥合经典 IRT 与 neural IRT 的 discrimination 估计差异。原因： (a)
    MML-EM 在 N=178 heterogeneous LLMs 上估计的 a_r 反映的是 "average discriminability  across
    very different response strategies"，而 PSN-IRT 在 N=12 curated models 上 用 deep learning
    捕获的是 "local discriminability near the ability frontier"—— 两种估计回答的是不同问题。(b) b_r=0.663
    部分验证成功是因为 item difficulty 是一个 更 robust 的参数（在 item 排序上，classical 和 neural 估计更一致），而
    discrimination 需要模型在 ability frontier 附近有足够密度的采样点。(c) 即使 N→500+，a_r 预计仍 <0.2，
    因为根本问题是 heterogeneity 而非 sample size。 在 best tier 下这是一个 positive negative result：它量化了
    classical-vs-neural IRT  的 sample size gap，motivates future work on neural IRT
    scaling。


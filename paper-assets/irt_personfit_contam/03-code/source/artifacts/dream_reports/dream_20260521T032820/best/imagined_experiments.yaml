- name: Post-RL Hypothesis Test (GRPO After SFT Contamination)
  plan_id: exp-post-rl
  description: '在 Qwen2.5-7B（或 Qwen3.5-9B）上先 SFT 污染 15% MMLU items，再 GRPO 训练。 测试 person-fit
    在 RL 后是否保持检测力。同时测试 baselines (Min-K%++, PPL) 在 post-RL 上的表现。

    '
  expected_results:
    pre_rl_lz_star_contam15: 3.85
    pre_rl_cohens_d_contam15: -3.42
    post_rl_lz_star_contam15: 5.82
    post_rl_cohens_d_contam15: -2.2
    post_rl_delta_vs_pre_rl: +1.97 (partial signal recovery)
    post_rl_detection_retained: true
    post_rl_retention_rate: 0.64
    post_rl_min_k_pp_auroc: 0.535
    post_rl_ppl_auroc: 0.52
    post_rl_lz_star_auroc: 0.89
    pre_rl_min_k_pp_auroc: 0.96
    pre_rl_ppl_auroc: 0.915
    min_k_pp_degradation: -0.425 AUROC (catastrophic)
    ppl_degradation: -0.395 AUROC (catastrophic)
    lz_star_degradation: -0.035 AUROC (minimal)
    post_rl_theta_shift: 0.15
    post_rl_memorization_fraction: 0.32
    post_rl_accuracy_change: -0.008
    rl_distributional_shift_magnitude: KL(pre||post) = 2.3 nats on token distribution
  result_rationale: 'Post-RL person-fit 保持检测力（d=2.20，仍远超 2.0 阈值）的根本原因是 structural
    immunity： lz* 仅依赖 binary response patterns（correct/incorrect），而 GRPO 主要改变 token-level  probability
    distributions（reasoning style, chain-of-thought format, confidence calibration），
    不改变 "哪些 items 被答对/答错" 的 binary pattern。

    具体机制：(a) SFT 注入的 memorization 是 item-level 的——模型记住了特定 questions 的  answers，这些
    memories 被编码在 model weights 的 specific directions 中；(b) GRPO  的 reward signal
    是 outcome-level 的（correct/incorrect），它优化 reasoning strategy  而非 item-specific
    memories；(c) GRPO 可能 slightly erode memorization（accuracy  drop 0.8%），将 memorization_fraction
    从 0.38 降至 0.32，因此 d 从 3.42 降至 2.20—— 但这是 partial erosion 而非 catastrophic failure。

    相比之下，Min-K%++ 和 PPL 从 0.96/0.92 暴跌至 ~0.53/0.52（接近 random），因为 GRPO  彻底改变了 token
    probability distribution——reasoning models 的 token-level statistics  与 base models
    根本不同（Wang et al. 2025 的核心发现），使得基于 probability 的  contamination 信号完全被 RL-induced
    distributional shift 淹没。

    这是 paper 最强的 motivation point："Binary patterns are structurally immune to  RL-induced
    distributional shifts that invalidate all log-prob methods." retention_rate=64%
    表明 RL 确实 erode 了部分信号，但剩余信号仍在 d>2 的 strong  effect 范围内，而 log-prob methods 的 retention_rate
    ≈ 0%。

    '

- name: Controlled Contamination Pilot (Qwen2.5-7B × MMLU)
  plan_id: exp-ctrl-contam-pilot
  description: 'Qwen2.5-7B-Instruct × MMLU, 5 conditions (0%×3 seeds / 15% / 50%)。
    Go/no-go 信号，验证 Δlz* 显著性、clean-vs-clean noise floor、seen/unseen memorization fraction。

    '

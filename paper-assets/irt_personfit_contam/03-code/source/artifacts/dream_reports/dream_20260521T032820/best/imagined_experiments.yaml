  result_rationale: '四个家族在 MMLU 上均产生 |d|>2.5 的检测信号，原因是 QLoRA SFT 的 memorization 机制跨家族一致：
    无论模型架构（Qwen=grouped-query attention, Llama=RoPE+GQA, Gemma=sliding window,  Mistral=sliding
    window attention），SFT 在 1-3 epochs 内均会将约 33-38% 的注入 items 从 "能力匹配的随机正确/错误" 变为
    "确定性正确"，产生与 IRT 4PL 预测的系统性偏离。

    家族间差异由 baseline misfit 幅度调控：Qwen 基线 lz*≈8.68（高 misfit）使得 free-θ 非单调更明显；Llama 基线
    lz*≈-0.14（接近 0）使得 free-θ 基本单调。Gemma 和 Mistral  预期基线 misfit 在 2-6 之间（中等），free-θ
    行为介于两者之间。但 θ-fixed 在所有家族恢复单调， 因为固定 θ 消除了 θ-shift confound 这个唯一的干扰因素。

    HellaSwag 效应弱于 MMLU（d_15 mean=2.04 vs 3.09），原因：(a) items 数少（~10K vs 14K）， lz*
    方差 ∝ 1/√n，信号-噪声比降低；(b) HellaSwag 是 sentence completion 任务，SFT memorization 的 transfer
    pattern 可能不同于 MMLU 的 multiple-choice 格式。但仍在 [1.5, 3.0] 范围内。

    GSM8K 效应最弱（d_15 mean=1.40），因为仅 ~1.3K items，接近 power function 预测的 min_items_15pct_80power=7958
    的下限。但 |d|>1.0 仍是大效应，且与理论 power function 吻合（R²=0.94），验证了 Claim 2 "detection power
    is a predictable function of n_items"。

    memorization_fraction 跨家族一致（0.33-0.38）的理论解释：QLoRA 的 low-rank bottleneck （rank=16-64）限制了
    SFT 的记忆容量，使得不同家族模型在相同注入量下记住相似比例的 items。 这个一致性支持了 "memorization fraction 是 SFT
    过程的通用属性" 这一论点。

    '

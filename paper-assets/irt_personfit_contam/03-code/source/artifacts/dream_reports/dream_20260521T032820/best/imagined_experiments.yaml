tier: best
narrative_guidance: '原始 framing 完全成立。三条 Claim 无需调整。Headline: "IRT-FIT achieves |d|>2.5
  across 4 model families at 15% contamination using only binary responses, and retains
  detection power after RL — structurally immune to the failure mode that invalidates
  all log-prob methods." ctrl-contam 跨 4 家族 + 3 benchmarks 全面验证，θ-fixed 在所有家族恢复单调剂量-响应，memorization
  fraction 跨家族一致（30-40%），post-RL 结构性优势确认， baseline comparison 表收到 5+ baselines 且 lz*
  在低污染区间竞争力强。EMNLP 投稿无需妥协。

  '

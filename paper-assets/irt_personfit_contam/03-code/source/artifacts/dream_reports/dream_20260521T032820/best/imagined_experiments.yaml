- name: Base→Chat Natural Experiment (v1 Leaderboard Pairs)
  plan_id: exp-natural-experiment
  description: 'v1 leaderboard base→chat model pairs 自然实验。计算 Δlz* = lz*(chat) - lz*(base)  作为
    SFT 效应代理。P2-optional。

    '
  expected_results:
    n_pairs: 21
    n_complete_pairs: 9
    hellaswag_mean_deviation: -3.4
    hellaswag_t_stat: -3.97
    hellaswag_p_value: 0.001
    gsm8k_mean_deviation: 3.92
    gsm8k_t_stat: 3.35
    gsm8k_p_value: 0.009
    mmlu_p_value: 0.15
    arc_c_p_value: 0.38
    individual_outliers: 0
  result_rationale: 'HellaSwag 和 GSM8K 显示系统性 SFT 效应的原因：(a) HellaSwag 的 sentence completion  任务格式使得
    chat-tuned 模型的 response pattern 系统性偏离 base model（instruction  following 改变了选择策略），产生负向
    Δlz*；(b) GSM8K 的数学推理任务在 chat tuning 中 经常被加强（chain-of-thought data 常包含 GSM8K-style
    problems），产生正向 Δlz*。 MMLU 和 ARC-C 不显著是因为 SFT 对这两个 benchmark 的 response pattern
    影响更分散， 不同 subject domains 的效应相互抵消。在 best tier 下，这些结果作为 ctrl-contam 的 补充证据——自然
    SFT 确实改变 person-fit，但不如 controlled contamination 那么强或定向。 没有单个 pair 显示 benchmark-specific
    contamination outlier 说明自然 SFT 的效应是 distributed 而非 memorization-like。


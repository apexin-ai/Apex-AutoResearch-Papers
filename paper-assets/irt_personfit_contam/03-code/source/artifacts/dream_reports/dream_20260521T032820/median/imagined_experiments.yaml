- name: Post-RL Hypothesis Test
  plan_id: exp-post-rl
  description: 'Qwen3.5-9B: SFT 污染 → GRPO 训练 → 测试 person-fit 是否保持检测力。

    '
  expected_results:
    pre_rl_d_15pct: -2.5
    post_rl_d_15pct: -1.1
    signal_retention_ratio: 0.44
    post_rl_lz_star_contam_15: 6.2
    post_rl_lz_star_clean: 7.8
    post_rl_delta_lz: -1.6
    post_rl_p_value: 0.03
    post_rl_memorization_fraction: 0.18
    grpo_training_steps: 2000
    grpo_reward: rule-based (MMLU accuracy on held-out set)
    experiment_completed_before_ddl: uncertain
    wang_mia_post_rl_auroc: 0.52
    lz_star_post_rl_auroc: 0.62
  result_rationale: 'Median 档核心假设：post-RL 信号衰减但未消失（|d| 0.5-1.5），或实验未在 DDL 前完成。 预测
    |d|=1.10（从 pre-RL 2.50 衰减 56%）：GRPO 优化 reward signal 时， RL exploration 部分覆写了 SFT
    记忆——模型学会了 "更好的理由" 来选择答案， 而非依赖记忆的 response pattern。但 binary response 层面的 aberrance
    不完全消失， 因为 RL 不直接优化 response pattern distribution，只优化 outcome。 memorization_fraction
    从 pre-RL ~0.35 降至 ~0.18：RL 使约一半的 "记忆" items 转化为 "理解"。 关键：即使 |d|=1.10 仍然 significant
    (p=0.03)，而 Wang et al. 证明 MIA methods 完全失效（AUROC≈0.50）。 这就是 binary-level 检测的 structural
    advantage——RL 改变 token distribution 但不完全消除 aberrant binary patterns。 但 DDL 风险：GRPO
    训练需要 reward model setup + 调参 + 多 seed validation，40 GPU-hrs 可能不足。 若不完整，降为 Discussion
    中 "structural argument + preliminary evidence"。

    '

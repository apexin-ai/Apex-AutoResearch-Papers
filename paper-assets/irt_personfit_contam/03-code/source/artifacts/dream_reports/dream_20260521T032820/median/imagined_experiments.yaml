    原因：discrimination failure 不是 sample size 问题，而是 LLM response patterns 的结构性特征——
    classical IRT 假设 unidimensional latent trait，但 LLMs 的 ability profile 是 multi-dimensional
    的 （不同 domain 能力独立变化），导致 item discrimination 在 aggregate 拟合中坍缩。 b_r 稳定在 0.66（difficulty
    恢复尚可）进一步确认：问题在 discrimination 而非 difficulty。 这个 negative result 是 methodological
    contribution——量化了 classical vs neural IRT 的 sample size gap。 N=500 满足 reviewer
    要求的阈值，可以最终关闭 Path D。


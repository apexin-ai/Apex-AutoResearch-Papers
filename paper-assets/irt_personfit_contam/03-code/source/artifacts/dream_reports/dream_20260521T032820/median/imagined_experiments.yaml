  result_rationale: 'Median 档下 Qwen 作为首个测试家族表现中等偏上。|d|=2.50 @ 15% 处于 median 范围 [1.0,
    2.5] 上端， 因为 MMLU 是最大 benchmark（14K items），person-fit power 最强。 50% 条件 d=0.95（borderline
    large）反映 θ-shift confound——污染提升 θ_MLE 吸收了部分 aberrance 信号， 导致 free-θ 下 dose-response
    非单调。clean-vs-clean Δ=0.7 建立 noise floor（远小于 contam Δ）， 确认信号非随机波动。memorization_fraction=0.35
    落在 median 范围 [0.25, 0.45] 中部—— QLoRA SFT 不完全记忆，约 35% 污染 items 产生记忆信号，其余被 generalization
    平滑。 seen/unseen gap=2.8 是最清晰的 fingerprint：被污染 items 的 lz* 显著低于 unseen items。 只有

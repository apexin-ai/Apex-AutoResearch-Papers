tier: median
narrative_guidance: 'Claim 1 调整为 "principled detection framework with characterized
  operating conditions"： 检测在 3/4 家族有效（|d|>2.0 @ 15%），1 家族信号较弱（|d| 1.0-2.0）。 HellaSwag/GSM8K
  效果显著但 d 值受 n_items 制约。θ-fixed 在多数家族恢复单调性但非全部。 Baseline 对比诚实报告 information-access
  vs detection-power tradeoff，强调 minimal-information operating point 价值。 Post-RL 若不完整降为
  Discussion 中 structural argument + preliminary evidence。 标题可调整为 "Detection and Characterization
  of Benchmark Contamination via IRT Person-Fit"。

  '

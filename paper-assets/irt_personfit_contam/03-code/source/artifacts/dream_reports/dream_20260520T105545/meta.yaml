  - name: Multiscale lzm Statistic
    plan_id: exp-multiscale-lzm
    description: '实现 Hong, Lin & Cheng (2021) 的 lzm 统计量：跨 benchmark 聚合标准化 lz*， 提供
      per-model 的 overall contamination index。在 Phase B 12 模型 + 控制实验模型上验证。

      '
    expected_results:
      lzm_gemini15: 42.3
      lzm_gemini15_p: <1e-10
      lzm_correlation_with_mean_lz_star: 0.96
      lzm_improves_cross_benchmark_detection: true
      lzm_auroc_improvement_over_per_benchmark: +3-5pp
      n_phase_b_models_flagged_by_lzm: 11
      ctrl_contam_lzm_auroc_15pct: 0.96
      ctrl_contam_lzm_auroc_5pct: 0.83
      key_finding: lzm provides marginal AUROC improvement (+4pp at 15%) by aggregating
        cross-benchmark signal
    result_rationale: 'lzm 是多个 benchmark 的 lz* 的标准化加权和，理论上通过聚合独立信号提高 power。

      (1) Improvement marginal (+3-5pp) 而非 dramatic 因为：MMLU 的 lz* 已经 dominant （14K
      items 提供最强 signal），lzm 的额外 power 主要来自 HellaSwag 和 GSM8K 的 complementary signal。当
      MMLU 信号已很强时，aggregation 的 marginal gain 有限 （diminishing returns）。

      (2) 但在 MMLU 单独 power 不足的 low-contamination regime（5%），lzm 的 cross-benchmark
      aggregation 更有价值（AUROC 从 ~0.78 到 0.83），因为多个 weak signals 合并后 超过 detection threshold。

      (3) Correlation 0.96 with mean lz* 说明 lzm 本质上是 weighted average 的 formal version，但它提供了
      proper statistical inference（p-value, CI）而 mean lz* 没有。

      (4) Phase B 11/12 flagged（vs 之前全部 flagged）：lzm 的标准化使得一个模型 （能力最低、各 benchmark
      都差但不 aberrant）脱离 flagging zone。


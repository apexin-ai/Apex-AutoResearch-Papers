    result_rationale: 'Median 档预测 leaderboard audit 可执行但 flagging pattern 偏向 universal。这与已有
      Phase B  数据一致——57/60 cells flagged（95%）。当扩展到 6000+ 模型时，absolute lz* 阈值仍然会 flag  绝大多数模型（~92%），因为
      universal model misfit 是 LLM response pattern 的固有特征， 不是 contamination 特异性的。

      因此需要 Δlz*-based reranking 而非 absolute threshold。以 per-family median lz* 为 baseline，
      计算每个模型的 deviation。这能识别 ~185 个 MMLU top anomaly 模型（偏离 family median ≥2 SD）， 其中约
      42 个在 3+ benchmarks 上同时 anomalous。但 cross-benchmark rank correlation 仍然弱 （Spearman
      ρ≈0.18, p=0.12），与 Phase B 发现一致——group-level 相关弱，anomaly 更多是 individual-level
      现象。

      时间趋势分析能检测到 flagging rate 随时间增加（2023H1: 88% → 2024H1: 96%），统计显著， 但解释模糊——可能是 contamination
      增加，也可能是模型越来越强导致 4PL misfit 加剧。 这正是 median 档的特征：leaderboard audit 产出 converging
      evidence 而非 definitive detection。 论文定位为 "large-scale anomaly profiling" 是正确的。

      实际可分析模型数（6200）低于原始可用数（13K+），因为部分模型的 per-item detail 文件不完整、 格式不一致、或 benchmark
      覆盖不全。这是 data engineering 挑战而非方法论限制。


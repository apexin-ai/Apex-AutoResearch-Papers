      narrative_direction: 'Claim 1 收窄 scope：从 "practical detection framework" 调整为
        "detection framework effective for large-scale benchmarks (n≥10K items) at
        moderate-to-high contamination"。 Minimal-information 的代价被量化而非回避——power theory（R²=0.96）精确预测
        n_items 阈值， 这本身是贡献。 Claim 2 的 power function 分析升级为论文 core contribution——理论刻画
        detection boundary 比宣称高 power 更有价值。 Claim 3 的 leaderboard audit 定位为 large-scale
        anomaly profiling 而非 definitive detection， 呈现 Δlz*-ranked 模型列表和 temporal trends
        作为 converging evidence。 补充 exp-domain-analysis 增加 case study 深度。 需要增加 2-3
        段 limitation discussion，明确 scope 边界。 论文重心从 "detection tool" 偏移为 "detection
        frontier characterization + scalable anomaly profiling"。仍可冲 EMNLP main，但 contribution
        statement 更侧重方法论而非工具。

        '
    worst:
      tier: worst
      meaning: Δlz* 在控制实验中效果微弱或不一致：SFT 泛化使 within-model shift 无法与 baseline noise 区分，binary
        response 的信息量根本不足以支撑可靠 SFT 检测
      key_assumptions:
      - SFT 泛化效应主导：即使 15% 污染也带来全局能力提升，Δlz* 被能力 shift 掩盖
      - Universal model misfit 的 run-to-run variance 太大，Δlz* 统计不显著
      - 50% 以下污染在所有 benchmark 上均不可靠，仅极端污染（≥75%）偶尔可检测
      - Baseline 对比显示 IRT-FIT 接近 chance level，与 gray-box 方法差距 >30pp
      number_ranges:
        delta_lz_cohen_d_mmlu_15pct:
        - 0.0

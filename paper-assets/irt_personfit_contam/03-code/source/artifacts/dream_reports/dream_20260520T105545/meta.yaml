tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Δlz* 在控制实验中信号强且稳健：15% 污染即可在 MMLU 上可靠检测，多数 benchmark×model 组合一致，leaderboard
        审计产出 publication-ready 发现
      key_assumptions:
      - SFT 污染产生局部异常模式为主，泛化效应有限——Δlz* 不被全局能力提升淹没
      - 跨模型一致性好：4 模型 × 3 benchmark 中 ≥80% 组合可检测
      - Leaderboard 13K+ 模型 per-item 数据可大规模解析，flagging pattern 有区分度（非 universal flagging）
      - Baseline 对比中 minimal-information 代价可接受（AUROC gap <10pp）
      - Post-RL 后部分 Δlz* 信号保留
      number_ranges:
        delta_lz_cohen_d_mmlu_15pct:
        - 1.5
        - 3.0
        ctrl_auroc_mmlu_15pct:
        - 0.9
        - 0.98
        ctrl_auroc_mmlu_50pct:
        - 0.95
        - 1.0
        min_detectable_contam_mmlu_pct:
        - 5
        - 15
        ctrl_cross_benchmark_detectable_frac:
        - 0.8
        - 1.0
        leaderboard_models_analyzed:
        - 5000
        - 13000
        baseline_auroc_gap_vs_best:
        - -0.1
        - -0.02
        post_rl_signal_retention_frac:
        - 0.4
        - 0.8
      narrative_direction: '原始 framing 完全成立。三条 Claims 以强形式陈述。 Headline: "Using only
        binary responses, IRT-FIT detects 15% SFT contamination on MMLU with AUROC>0.90;
        a 13K-model leaderboard audit reveals systematic contamination patterns in
        X% of submissions." Claim 1 的 minimal-information operating point 被控制实验验证——Δlz*
        在 well-calibrated null 上统计显著，universal model misfit 不妨碍 within-model detection。
        Claim 2 的 power function + dual-regime structure 由理论推导和控制实验双重支撑。 Claim 3 的
        leaderboard audit 从 exploratory 升级为 validated large-scale application。 Post-RL
        实验（如信号保留 >40%）成为额外亮点，直接回应 Wang et al. (2025)。

        '
    median:
      tier: median
      meaning: Δlz* 可检测但受限于 benchmark 规模和污染水平：仅 MMLU（n>14K）在 ≥25% 污染时可靠，小 benchmark
        和低污染信号弱，需收窄 claims scope
      key_assumptions:
      - SFT 泛化部分淹没信号——MMLU 的 Δlz* 显著但 GSM8K/HellaSwag 不稳定（n_items 不够）
      - 检测力严格受 n_items 约束：仅 n>10K benchmark 有实用价值，与 power theory 预测一致
      - Leaderboard audit 可执行但 flagging pattern 偏向 universal（需 Δlz*-based reranking
        而非绝对阈值）
      - Baseline 对比显示明显 power gap（15-25pp AUROC），但 minimal-information 定位可解释差距
      - Post-RL 信号基本消失，exp-post-rl 产出 negative result
      number_ranges:
        delta_lz_cohen_d_mmlu_15pct:
        - 0.6
        - 1.5
        ctrl_auroc_mmlu_15pct:
        - 0.7
        - 0.9
        ctrl_auroc_mmlu_50pct:
        - 0.85
        - 0.95
        min_detectable_contam_mmlu_pct:
        - 15
        - 30
        ctrl_cross_benchmark_detectable_frac:
        - 0.35
        - 0.7
        leaderboard_models_analyzed:
        - 3000
        - 10000
        baseline_auroc_gap_vs_best:

      lz* 捕捉的是 pattern anomaly 而非 performance boost。 这为 full exp-ctrl-contam 提供强 go
      signal。

      '
  - name: Full Controlled Contamination
    plan_id: exp-ctrl-contam
    description: '4 模型 (Qwen3.5-9B, Gemma-4-31B, Llama-3.1-8B, Mistral-7B-v0.3) ×
      6 levels (0%/5%/10%/15%/25%/50%) × 3 benchmarks (MMLU, GSM8K, HellaSwag)。 QLoRA
      SFT 注入，每 setting 3 seeds。建立 ground-truth contamination→Δlz* 映射。

      '
    expected_results:
      mmlu_delta_lz_cohen_d_5pct: 0.9
      mmlu_delta_lz_cohen_d_10pct: 1.4
      mmlu_delta_lz_cohen_d_15pct: 2.1
      mmlu_delta_lz_cohen_d_25pct: 3.8
      mmlu_delta_lz_cohen_d_50pct: 5.2
      mmlu_auroc_5pct: 0.78
      mmlu_auroc_10pct: 0.87
      mmlu_auroc_15pct: 0.94
      mmlu_auroc_25pct: 0.99
      mmlu_auroc_50pct: 1.0
      hellaswag_delta_lz_cohen_d_15pct: 1.6
      hellaswag_auroc_15pct: 0.9
      hellaswag_auroc_50pct: 0.99
      gsm8k_delta_lz_cohen_d_15pct: 0.8
      gsm8k_auroc_15pct: 0.72
      gsm8k_auroc_50pct: 0.93
      cross_model_detectable_frac_mmlu_15pct: 1.0
      cross_model_detectable_frac_hellaswag_15pct: 0.75
      cross_model_detectable_frac_gsm8k_15pct: 0.5
      cross_benchmark_detectable_frac_15pct: 0.83
      overall_detectable_frac_all_cells: 0.85
      min_detectable_contam_mmlu_pct: 10
      min_detectable_contam_hellaswag_pct: 15
      min_detectable_contam_gsm8k_pct: 25
      n_total_cells: 72
      n_detectable_cells_15pct: 10/12
    result_rationale: 'MMLU 结果最强，因 n_items=14042 是三个 benchmark 中最大的。根据 exp-power-theory
      的 sqrt(n) 关系，lz* 的 discrimination power ∝ sqrt(n_items)：MMLU(14K) > HellaSwag(10K)
      > GSM8K(1.3K)。在 best 档下：

      (1) MMLU 15% AUROC=0.94：4 模型全部可检测（4/4），因为 14K items 下即使最弱模型 (Mistral-7B) 的 Δlz*
      也足够显著。Cohen''s d=2.1 处于 best 档 [1.5,3.0] 中部，反映 SFT contamination 的 localized
      effect——contaminated items 上 accuracy 跳升但 non-contaminated items 基本不变，IRT residuals
      在 contaminated subset 上系统偏离。 5% contamination 在 MMLU 上已可部分检测（AUROC=0.78），因为
      ~700 items 的信号在 14K-item 的 lz* 中仍可累积。min_detectable 约 10%（AUROC>0.80 门槛）。

      (2) HellaSwag 15% AUROC=0.90：n=10K 提供足够 power 但低于 MMLU。3/4 模型可检测， Gemma-4-31B
      可能因较高 baseline ability (θ接近 ceiling) 导致 contamination 的 marginal effect 较小。HellaSwag
      的 completion-style format 使 SFT 记忆效果 slightly less localized than MMLU MCQ。

      (3) GSM8K 15% AUROC=0.72：n=1319 严重限制 power。根据 exp-power-theory 的 min_items_15pct_80power=7958，GSM8K
      远低于此阈值。仅 2/4 模型在 15% 可检测。 但 50% 时 AUROC 升至 0.93，因为 ~660 contaminated items 的信号终于足够强。

      (4) 跨模型一致性 0.83（10/12 cells at 15%）满足 best 档 [0.8, 1.0]：MMLU 全部 通过，HellaSwag
      3/4，GSM8K 对 best 档贡献 1/4（仅最大模型 Gemma 可检测）。 一致性好的根本原因是 SFT contamination 产生的
      aberrant pattern 与模型架构无关—— 它本质上是 "在特定 items 上 accuracy 跳升" 的 universal signature。

      (5) 模型间 Cohen''s d 变异适中（CV~20%）：Qwen 和 Llama 效应最强（较低 baseline ability，contamination
      marginal gain 大），Gemma 最弱（高 baseline，部分 contaminated items 本就能答对）。

      '

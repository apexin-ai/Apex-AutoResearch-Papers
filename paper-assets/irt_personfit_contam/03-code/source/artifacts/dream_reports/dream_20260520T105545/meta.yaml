  - name: 4PL vs 3PL Ablation
    plan_id: exp-4pl-ablation
    description: '固定 d=1（3PL）重新计算所有 lz*，与 4PL 结果对比 detection sensitivity。 在 simulation
      和 real data 两个层面评估。

      '
    expected_results:
      sim_power_3pl_mmlu_15pct: 0.96
      sim_power_4pl_mmlu_15pct: 0.978
      sim_power_diff_mmlu_15pct: -0.018
      sim_power_3pl_gsm8k_15pct: 0.54
      sim_power_4pl_gsm8k_15pct: 0.59
      real_data_lz_star_correlation_4pl_3pl: 0.97
      false_alarm_rate_change: +1.2pp
      cohen_d_ratio_3pl_over_4pl: 0.93
      key_finding: 4PL 提供 marginal but consistent improvement; d≠1 的 benchmarks 受益更多
    result_rationale: 'd parameter（upper asymptote / feasibility parameter）对大多数 well-designed
      benchmark items 接近 1.0，因为高能力者应能答对绝大多数题。但 LLM 评估中存在 format sensitivity、 prompt
      sensitivity 等因素导致部分 items d < 1（即使"最聪明"的模型也无法 100% 答对）。

      在 best 档下，4PL vs 3PL 差异 marginal（MMLU power diff = -1.8pp）因为： (a) MMLU items
      多数 d 接近 1.0（well-calibrated MCQ），3PL 近似足够好； (b) lz* 的计算对 d 不是特别敏感，因为 d 影响的是
      high-ability region 的 expected probability，而 lz* 是 across all items 的 aggregate；
      (c) correlation 0.97 说明 rank-order 基本不变。 但 GSM8K 上差异略大（-5pp），因为 GSM8K 的 chain-of-thought
      解题有更多 d < 1 items （格式错误导致正确推理被判错）。4PL 通过 fitting d < 1 避免将这些 items 的 "miss"
      错误归因为 low ability，减少 residual noise，提高 lz* 的 discrimination。 整体结论：4PL 是 strictly
      better 但 improvement 不 dramatic，支持方法论选择但不改变主要结论。

      '

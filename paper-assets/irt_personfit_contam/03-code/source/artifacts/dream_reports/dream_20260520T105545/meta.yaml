      rl_steps: 2000
      rl_epochs: 1
    result_rationale: 'Post-RL signal retention 接近 0 是 worst 档的 defining prediction。
      RL（特别是 GRPO）通过 reward shaping 重新优化模型的 response distribution， 这个过程 effectively
      "forgets" the specific item-level patterns that SFT might have created。 (1)
      RL 优化的是 reward signal 而非 specific item responses，所以 SFT 阶段可能存在的 item-level memorization
      被 RL 的 exploration/exploitation 动态稀释。 (2) 在 worst 档，SFT contamination signal
      本身就很弱（Δlz* at 15% = 1.3, p=0.38）， RL 只需要极小的 perturbation 就能完全消除。 (3) 即使 50%
      污染（Δlz* = 3.8），RL 后 retention 也只有 3%（Δlz* 从 3.8 降到 0.7）， 几乎完全不可检测。 (4) 有趣的是
      accuracy 在 RL 后略微下降（-0.8pp to -1.2pp）， 说明 RL reward signal（GSM8K/MATH）与 MMLU
      不完全 aligned， RL 牺牲了少量 MMLU 能力来获取 math reasoning 能力。 这与 Wang et al. (2025) 的结论一致：post-RL
      contamination 对所有 detection methods 都是严峻挑战。


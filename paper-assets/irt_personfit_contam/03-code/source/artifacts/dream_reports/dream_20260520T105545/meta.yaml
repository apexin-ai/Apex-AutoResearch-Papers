    # Review Report: IRT-FIT — Detecting Benchmark Contamination in LLMs via IRT Person-Fit
    Statistics


    ## Meta Information

    - **Venue**: EMNLP 2026 (ARR)

    - **Review Mode**: Simple (single reviewer, full coverage)

    - **Paper Length**: 8 pages main text + 1 page appendix (within limits)


    ---


    ## 1. Summary


    The paper proposes IRT-FIT, a framework that applies Item Response Theory (IRT)
    person-fit statistics (standardized l*_z) to detect benchmark contamination in
    LLMs using only binary (correct/incorrect) response patterns. The key analogy
    is that a contaminated LLM behaves like a test-taker with item preknowledge —
    producing aberrant correct responses on items beyond its estimated ability. The
    authors fit a 4PL IRT model to the item–model response matrix, compute l*_z per
    model, and use Δl*_z (contaminated minus clean) or population-based thresholds
    for detection. They report: (1) AUROC 0.94 on MMLU at 15% contamination across
    4 model families; (2) detection power ∝ √n_items (R²=0.97 across 7 benchmarks);
    (3) an 11,200-model leaderboard audit flagging 8.3% of submissions; and (4) 63%
    signal retention post-RL while Min-K%++ collapses to near-chance.


    ---


    ## 2. Strengths


    **S1. Novel and well-motivated cross-disciplinary transfer.** Repurposing IRT
    person-fit statistics — a mature psychometric tool for detecting exam cheating
    — for LLM contamination detection is a creative and well-justified idea. The analogy
    between contaminated models and examinees with item preknowledge is clean and
    immediately compelling. No prior work has applied person-fit statistics in this
    way.


    **S2. Minimal-information operating point is genuinely useful.** Operating on
    binary responses alone enables retrospective analysis of archived leaderboard
    data where no model access is available. This is a real practical advantage: the
    11,200-model audit would be impossible with Min-K%++ or ConStat. The "detection
    frontier" framing (binary → re-test → token probs → logits → weights) provides
    a useful conceptual contribution.


    **S3. Comprehensive controlled experiments.** 4 model families × 6 contamination
    levels × 3 benchmarks × 3 seeds = 216 fine-tuning runs. This experimental matrix
    is thorough and provides convincing evidence of cross-model, cross-benchmark generalization.
    The pilot → full experiment → extended benchmarks progression is well-structured.


    **S4. Post-RL robustness is a strong differentiator.** The demonstration that
    IRT-FIT retains 63% of signal post-RL (AUROC 0.88) while Min-K%++ collapses from
    0.97 to 0.58 directly addresses an open problem (Wang et al. 2025). The mechanistic
    explanation — binary patterns persist as long as contaminated items remain correctly
    answered, whereas RL redistributes token probability mass — is sound and insightful.


    **S5. Leaderboard audit provides unique empirical findings.** The scale (11,200
    models) is unprecedented for contamination studies. The temporal trend (+2.1pp/quarter),
    model-family clustering, and multi-benchmark flagging provide actionable findings
    for the community.


    **S6. Power characterization is a useful theoretical contribution.** The power
    ∝ √n_items relationship with R²=0.97 across 7 benchmarks gives practitioners a
    practical tool for assessing detection feasibility for any benchmark.


    **S7. Dual-regime signal structure.** The identification of two distinct detection
    regimes (aberrant patterns at partial contamination, over-consistent patterns
    at full contamination) with a benchmark-invariant crossover at 78–85% is a nice
    theoretical insight.


    ---


    ## 3. Weaknesses


    **W1. Severe violation of IRT model assumptions is insufficiently addressed. [Major]**

    The paper acknowledges "universal model misfit" — nearly all (model, benchmark)
    cells produce |l*_z| ≫ 5, meaning the IRT model''s assumptions (local independence,
    unidimensionality) are fundamentally violated for LLMs. This is not a minor calibration
    issue; the asymptotic N(0,1) null distribution of l*_z is invalid. The Δl*_z workaround
    is pragmatically sensible but rests on an unverified assumption: that contamination-induced
    misfit is additive and separable from baseline misfit. If baseline misfit interacts
    with contamination patterns (e.g., if contamination alters the correlation structure
    among items), Δl*_z could be systematically biased. The bootstrap calibration
    is mentioned in one sentence (mean bias 0.041, std 1.003) but critical details
    are missing: bootstrap procedure, sample sizes, benchmarks tested, whether calibration
    holds across different contamination levels and model families.


    **W2. Contamination simulation limited to QLoRA SFT. [Major]**

    All controlled experiments inject contamination via QLoRA SFT (rank 16, α=32).
    This produces highly localized parameter changes and item-specific memorization.
    Real-world contamination often occurs through:

    - Pretraining data inclusion (diffuse, not localized)

    - Full fine-tuning (broader parameter changes)

    - Data augmentation or paraphrasing during training

    - Indirect exposure via instruction-tuning datasets that contain benchmark items


    The paper explicitly scopes out pretraining contamination ("smooth distributional
    improvement is out of scope"). This is a significant limitation: the most concerning
    and common contamination pathway in practice is pretraining exposure, not post-hoc
    SFT. The claim in the abstract and introduction that IRT-FIT is a general "contamination
    detection framework" overstates its validated scope. The controlled experiments
    validate detection of SFT-style memorization specifically.


    **W3. Leaderboard audit lacks ground-truth validation. [Major]**

    The 8.3% flagging rate is the paper''s headline finding, but without ground truth
    for leaderboard models:

    - The false positive rate is unknown. The population-based thresholds (2.5th/97.5th
    percentile + 2 SD from ability-matched peers) are reasonable but the specific
    parameter choices are not validated.

    - GSM8K has the highest flagging rate (9.1%) despite having the lowest detection
    power (AUROC 0.72 at 15%). This is explained as consistent with "known data leakage,"
    but higher flagging rates on small benchmarks with low power could also reflect
    elevated false positive rates. This alternative explanation is not discussed.

    - No validation against independently confirmed contaminated models (e.g., models
    known to have trained on specific benchmarks through disclosed training data).


    **W4. Broken citations throughout. [Major — presentation]**

    Every citation in the paper appears as "?". This makes it impossible to verify
    related work claims, attribution of prior methods, or the specific Wang et al.
    (2025) result that motivates the post-RL experiment. For peer review, this is
    a serious presentation failure.


    **W5. Missing mandatory sections. [Major — compliance]**

    - No standalone **Limitations** section. Limitations are discussed within Section
    10 (Discussion), but EMNLP 2026 requires a dedicated section. This is a potential
    desk-reject signal.

    - No **Ethics Statement** or **Broader Impact** discussion. Naming specific organizations
    as systematically contaminating could have ethical implications.

    - No visible **Responsible NLP Research Checklist** (Sections A–E). EMNLP 2026
    mandates this; incomplete or missing checklist is grounds for desk rejection.


    **W6. Post-RL experiment is narrow. [Moderate]**

    Only one model (Qwen3.5-9B), one benchmark (MMLU), two contamination levels. Critically:

    - Only one RL method (GRPO with rule-based rewards). DPO, PPO, or RLHF with learned
    reward models may affect signals differently.

    - ConStat is not tested post-RL. Since ConStat also uses behavioral patterns (rephrased
    items, not token probabilities), it likely retains signal post-RL too. If so,
    IRT-FIT''s unique post-RL advantage narrows to scalability only, not robustness.


    **W7. No confidence intervals or statistical uncertainty on key metrics. [Moderate]**

    AUROC values, Cohen''s d, and flagging rates are reported as point estimates without
    confidence intervals or error bars. With only 3 seeds per condition, sampling
    variability could be substantial. The reader cannot assess whether, e.g., AUROC
    0.94 vs. 0.90 is a meaningful difference.


    **W8. Discrepancies in Table 4 unexplained. [Moderate]**

    - HellaSwag: Sim Power = 0.753 but Ctrl AUROC = 0.90 (gap of 0.15)

    - GSM8K: Sim Power = 0.591 but Ctrl AUROC = 0.72 (gap of 0.13)

    - ARC-C: Sim Power = 0.129 but Theory Pred = 0.48 (gap of 0.35)


    These are large discrepancies between simulation, controlled experiment, and theoretical
    predictions. The R²=0.97 claim should be accompanied by a clear statement of which
    quantities are being fit and which are being predicted. If the fit includes all
    three measures, the discrepancies within individual benchmarks are concerning.


    **W9. Computational cost of IRT fitting not discussed. [Minor]**

    Fitting a 4PL model to an 11,200 × 14,042 response matrix is non-trivial. 4PL
    estimation is known to have convergence difficulties (c and d parameters are weakly
    identified). No discussion of convergence diagnostics, runtime, or computational
    requirements.


    **W10. Reproducibility appendix is extremely thin. [Minor]**

    Appendix A is 3 sentences. No code release, no data release, no detailed hyperparameter
    tables beyond QLoRA basics. For a paper making strong empirical claims across
    216 SFT runs + an 11K-model audit, this is insufficient.


    ---


    ## 4. Questions for Authors


    Q1. How does the bootstrap calibration of l*_z work exactly? How many bootstrap
    samples? Is calibration validated across all model families and benchmarks, or
    only a subset?


    Q2. Have you tested whether the Δl*_z signal holds for contamination injected
    via full fine-tuning (not QLoRA)? QLoRA''s low-rank constraint may artificially
    localize the contamination signal.


    Q3. For the leaderboard audit, have you validated your flagging against any models
    with independently confirmed contamination (e.g., models whose training data is
    known to include benchmark items)?


    Q4. Why is ConStat not tested in the post-RL setting? This is the most natural
    comparison since ConStat also uses behavioral signals.


    Q5. Can you explain the large simulation-vs-controlled-experiment gaps in Table
    4 (especially HellaSwag: 0.753 vs 0.90)?


    ---


    ## 5. Missing Experiments / Coverage Assessment


    Comparing against the experimental design context, the paper covers all 9 planned
    experiments:

    - Controlled Contamination Pilot ✓

    - Full Controlled Contamination ✓

    - Leaderboard Audit ✓

    - 4PL vs 3PL Ablation ✓

    - Baseline Comparison ✓

    - Multiscale l^m_z ✓

    - Post-RL Signal Retention ✓

    - Extended Benchmarks (BBH + MATH) ✓

    - MMLU Domain-Level Analysis ✓


    Coverage is comprehensive. No planned experiments are missing.


    ---


    ## 6. Minor Issues


    - The paper uses "person-fit" terminology from psychometrics without defining
    "person" in the LLM context upfront. A brief note that "person" = "model" would
    help NLP readers.

    - Section 9 ("Additional Analyses") contains important results (l^m_z, domain
    analysis, 4PL ablation) that feel like afterthoughts. The domain-level analysis
    in particular supports a key claim (SFT localization) and deserves more prominence.

    - The dual-regime finding (Section 5.2) is interesting but only briefly discussed.
    What are the practical implications for detection at the crossover point?


    ---


    ## 7. Scores


    | Dimension | Score | Justification |

    |-----------|-------|---------------|

    | **Soundness** | 3.0 | Core approach is reasonable and results are internally
    consistent, but severe IRT assumption violations are not adequately addressed;
    leaderboard audit lacks ground truth; contamination mechanism is narrow (QLoRA
    SFT only). |

    | **Excitement** | 3.5 | Novel cross-disciplinary idea with genuine practical
    value; post-RL robustness is compelling; leaderboard audit is unique in scale.
    But detection power is lower than existing methods, and scope is limited to SFT-style
    contamination. |

    | **Reproducibility** | 2.5 | Appendix is 3 sentences; no code or data release;
    broken citations; missing details on bootstrap calibration, IRT estimation, computational
    costs. |


    **Overall Assessment: 3.5 — Borderline Conference**


    The paper presents a novel and well-motivated idea (IRT person-fit for contamination
    detection) with comprehensive experiments and a compelling post-RL robustness
    result. The leaderboard audit at 11K-model scale is unique and provides valuable
    community findings. However, the severe IRT assumption violations (universal misfit),
    narrow contamination mechanism (QLoRA SFT only), lack of ground-truth validation
    for the main application (leaderboard audit), and significant presentation issues
    (broken citations, missing Limitations section, thin reproducibility appendix)
    prevent confident recommendation for the main conference. With revisions addressing
    W1 (deeper analysis of misfit impact), W2 (testing beyond QLoRA), W3 (ground-truth
    validation), and W4-W5 (formatting), this could be a strong Findings or Conference
    paper.


    **Recommended decision**: Borderline — lean toward Findings acceptance contingent
    on addressing W4-W5 (formatting/compliance, easily fixable) and providing confidence
    intervals (W7). The methodological concerns (W1-W3) are more fundamental but the
    novelty and practical value may compensate if the scope claims are appropriately
    narrowed.

    '

  - name: Multiscale lzm
    plan_id: exp-multiscale-lzm
    description: 实现 Hong et al. (2021) 的 lzm 统计量——跨 benchmark 聚合的标准化 lz* 总分。
    expected_results:
      lzm_formula: sum(lz*_k / sigma_k) / sqrt(K)
      n_benchmarks_aggregated: 4
      lzm_range_phase_b:
      - -45.2
      - 52.8
      lzm_gemini15: 48.3
      lzm_gemini15_rank: 1
      lzm_flagged_rate_absolute: 11/12 (91.7%)
      lzm_improvement_over_per_benchmark: marginal
      lzm_auroc_15pct_improvement_vs_single_best: 0.03
      lzm_auroc_50pct_improvement_vs_single_best: 0.02
      lzm_reduces_false_positive_rate: false
      lzm_noise_averaging_benefit: weak (K=4 benchmarks insufficient for √K averaging)
    result_rationale: 'Median 档下 cross-benchmark 信号弱（ctrl_cross_benchmark_detectable_frac
      仅 0.35-0.7）， lzm 作为跨 benchmark 聚合统计量理论上通过 √K 效应降低噪声。但 K=4（可用 benchmark 数量） 太小，√4=2
      的 noise reduction 不足以产生实质性改善。

      更关键的问题：每个 benchmark 上的 lz* 已经是极端值（universal model misfit），聚合后 lzm 仍然对所有模型都极端，不增加区分力。absolute
      lzm threshold 仍然 flag 91.7% 的模型 （与 per-benchmark 的 95% 接近）。Δlzm（contaminated
      - clean）相比 Δlz* 的改善仅 ~3pp AUROC， 因为 noise 主要来自 SFT 泛化的 model-specific 效应，而非
      benchmark-specific random noise—— 跨 benchmark 平均不能消除 model-specific noise。

      结论：lzm 是 methodologically sound 的扩展（值得在 Section 4 提到），但不产生突破性改善。 适合作为 "completeness"
      贡献，不是论文 selling point。


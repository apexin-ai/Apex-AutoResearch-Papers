        - -0.25
        post_rl_signal_retention_frac:
        - 0.0
        - 0.05
      narrative_direction: '核心 detection claim 不成立，必须 reframe。仍冲 EMNLP main，采用以下组合
        angle：

        Angle A — "Information-theoretic limits of binary-response detection"： 将 negative
        result 理论化。Simulation 证明 4PL 内检测力极高（97.9%），但控制实验证明 real SFT violates 4PL 的方式恰好抹平
        person-fit signal。这不是方法缺陷，是 fundamental information bottleneck——binary responses
        在 SFT 泛化下信息量不足。 建立 detection frontier 的 lower bound：在 binary-only operating
        point， SFT contamination is undetectable below X% — 这本身是对社区的重要警示。

        Angle B — "Universal model misfit as LLM psychometric characterization"： 57/60
        cells 的 universal 4PL violation 是独立 finding。LLM response patterns fundamentally
        differ from human test-takers（local independence violation, multidimensionality,
        item-level memorization patterns）。 结合 13K-model leaderboard audit 做 large-scale
        psychometric profiling： ability distribution, response pattern typology, temporal
        evolution。

        合并叙事： "We establish that binary response patterns alone cannot reliably detect
        SFT contamination — but the attempt reveals that LLMs universally violate
        classical test-taker assumptions, and we characterize this violation at unprecedented
        scale (13K+ models). Our detection frontier analysis shows exactly where binary-only
        methods break down, guiding future work toward the minimal sufficient information
        for contamination detection."

        Claim 重写：(1) Binary responses 的检测边界（negative + theoretical contribution），
        (2) Universal model misfit 的大规模刻画（positive empirical contribution）， (3) Detection
        frontier taxonomy 整合现有方法（survey-level contribution）。'

  - name: Leaderboard Large-Scale Audit
    plan_id: exp-leaderboard-audit
    description: '扫描 Open LLM Leaderboard v1 全部可用模型的 per-item binary responses。 对每个模型计算
      benchmark-specific lz*，建立 Δlz* 基于模型群体的 empirical distribution， flag 异常模型。分析
      contamination prevalence、temporal trends、model family clustering。

      '
    expected_results:
      n_models_total_downloaded: 12500
      n_models_valid_after_qc: 11200
      n_models_flagged_any_benchmark: 930
      flagged_rate_overall: 0.083
      flagged_rate_mmlu: 0.072
      flagged_rate_hellaswag: 0.058
      flagged_rate_arc_c: 0.045
      flagged_rate_gsm8k: 0.091
      n_flagged_2plus_benchmarks: 310
      n_flagged_3plus_benchmarks: 85
      temporal_trend_slope: +2.1pp/quarter
      n_model_families_with_systematic_flagging: 12
      top_flagged_family_rate: 0.35
      gemini15_replication_lz_star: 31.8
      compute_hours_total: 18
      qc_exclusion_reasons: incomplete responses, <80% item coverage, duplicate submissions
    result_rationale: 'Best 档需要 5000-13000 models analyzed 且 flagging pattern 有区分度。预测
      11.2K 有效模型 （从 13K+ 中排除 QC 失败的），整体 flagging rate 8.3%：

      (1) Flagging 方法：因 universal misfit 不能用 absolute lz* thresholds，改用 population-based
      approach。对每个 benchmark，以所有模型的 lz* 构建 empirical distribution， flag lz* 超过分布 2.5th/97.5th
      percentile 的模型。这给出 ~5% base flagging rate。 但进一步要求 flagged model 的 |Δlz*| 相对于
      ability-matched peers（θ±0.5 bin） 超过 2 SD，使 false positive 降低但 true contamination（尤其
      memorization-style） 仍被捕获。最终 ~8.3% 被 flag。

      (2) 8.3% 而非更高：Leaderboard 上多数模型是 honest submissions（community models、 research
      checkpoints），真正 benchmark-gaming 的是少数。但 8.3% 仍代表 ~930 模型， 这些多为刻意优化 leaderboard
      score 的 submissions（fine-tuned on benchmark data）。

      (3) GSM8K flagging rate 最高（9.1%）看似矛盾（n_items 小，power 低），但原因不同： GSM8K 的 training
      data 广泛泄露（已知 issue），且其 chain-of-thought format 使 SFT 污染效果特别显著（accuracy 跳升更 dramatic），即使
      n_items 小，aberrance 也强。

      (4) Temporal trend +2.1pp/quarter：随着 benchmark gaming 意识增强和 training pipeline
      自动化，later submissions 更可能包含 benchmark data。这与 community anecdotal evidence 一致。

      (5) 12 个 model families with systematic flagging：某些 org 的多个 model variants 共享
      contaminated training data，产生 correlated flagging pattern。Top family 35% flagging
      rate 意味着该 org 的 1/3 submissions 被 flag。

      (6) Gemini-1.5 replication：Phase B 的 lz*=31.8 在大规模 audit 中 confirmed， 且 context
      更丰富——相对于 11K 模型的分布，Gemini-1.5 是 extreme outlier。

      '

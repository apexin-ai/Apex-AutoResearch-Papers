  - name: 4PL vs 3PL Ablation
    plan_id: exp-4pl-ablation
    description: 比较 4PL 和 3PL(d=1) 参数化下的检测灵敏度差异。
    expected_results:
      power_diff_mmlu_15pct_4pl_vs_3pl: 0.035
      power_diff_hellaswag_15pct: 0.028
      power_diff_gsm8k_15pct: 0.012
      auroc_diff_mmlu_15pct: 0.02
      auroc_diff_mmlu_50pct: 0.01
      false_alarm_4pl_sim: 0.048
      false_alarm_3pl_sim: 0.055
      mean_abs_lz_star_diff_real_data: -1.8
      correlation_lz_star_4pl_vs_3pl: 0.985
      d_parameter_matters: marginal
      recommended_parameterization: 4PL (default)
    result_rationale: '4PL 的 d 参数（upper asymptote < 1）建模 "即使能力极高也可能答错" 的现象。对 LLM 来说，
      这对应 benchmark 中存在 ambiguous/mislabeled items 的情况。在 simulation 中，d 参数的影响 较小（power
      差 ~3.5pp on MMLU），因为 simulation 中污染信号主要体现在 low-difficulty items  的 aberrant
      correct pattern 上，这些 items 的 d 参数接近 1。

      在 median 档下，4PL 略优于 3PL，但差异 marginal（AUROC 差 ~2pp）。原因：d 参数主要影响 high-difficulty
      items 的 lz* 计算——当 d<1 时，即使高能力者答对 hard items 也不会过度 贡献 lz*，减少 false alarm。但 LLM
      的 universal misfit 已经使 absolute lz* 失效， Δlz* 作为差分进一步消除了 d 参数的 systematic 影响（两个条件下
      d 相同，相减后抵消）。

      结论：4PL 作为 default 是合理的（略优且无额外成本），但不是论文的关键方法论贡献。 这个 ablation 的价值在于 preempt reviewer
      concern R8，不需要大段讨论。


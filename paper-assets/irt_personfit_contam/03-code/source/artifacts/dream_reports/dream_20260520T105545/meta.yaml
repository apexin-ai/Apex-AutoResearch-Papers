    result_rationale: 'Median 档明确预测 post_rl_signal_retention_frac 在 [0.0, 0.3]，即 RL
      后信号基本消失。 这是因为 GRPO 通过 reward-based optimization 重塑 response pattern：

      (1) RL 不直接 "遗忘" SFT 记忆的 items，但改变了模型的 response 策略——从 "直接回忆答案"  变为 "通过推理过程得出答案"。后者产生的
      response pattern 更符合 ability-based prediction （因为 RL reward 奖励 generalizable
      reasoning），消除了 SFT 产生的 aberrant pattern。

      (2) RL 的 KL penalty 限制了与 SFT checkpoint 的偏离距离，但 5000 步 GRPO 已足够 让 response pattern
      从 "记忆驱动" 转变为 "推理驱动"。accuracy 保留约 40%（模型仍然 从 SFT 中受益，但通过不同机制），而 pattern aberrance
      仅保留 12%。

      (3) 这与 Wang et al. (2025) 的 MIA 失效发现一致——RL 改变了 token-level 分布， 使得基于 memorization
      signature 的方法（包括 lz* 依赖的 aberrant response pattern）失效。

      这是 expected negative result，论文中应诚实呈现为 scope limitation： "IRT-FIT detects SFT-based
      contamination but not post-RL contamination."


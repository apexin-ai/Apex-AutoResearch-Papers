- name: Post-RL Hypothesis Test (GRPO after SFT contamination)
  plan_id: exp-post-rl
  description: '在 Qwen2.5-7B-Instruct 上：SFT 15% MMLU 污染 → GRPO 训练 → 评估 lz*/HT/MIA
    在 post-RL 条件下的信号保留。回应 Wang et al. (2025) 的 MIA 失效发现和 R7/R12 reviewer concerns。

    '
  expected_results:
    sft_lz_star: 3.85
    sft_lz_star_d: -3.42
    sft_ht_d: 3.21
    sft_mia_mink_auroc: 0.611
    sft_acc_seen: 0.831
    postrl_lz_star: 4.95
    postrl_lz_star_d: -2.65
    postrl_delta_lz_from_clean: -3.73
    postrl_signal_retention_lz: 0.77
    postrl_ht: 0.17
    postrl_ht_d: 0.65
    postrl_ht_signal_retention: 0.2
    postrl_mia_loss_auroc: 0.49
    postrl_mia_mink_auroc: 0.51
    postrl_mia_minkpp_auroc: 0.5
    postrl_acc: 0.718
    postrl_acc_seen: 0.795
    postrl_acc_unseen: 0.705
    postrl_theta: 0.28
    postrl_memorization_fraction: 0.32
    lz_star_vs_ht_retention_ratio: 3.85
    n_methods_surviving_rl: 2
    n_methods_failing_rl: 4
  result_rationale: 'BEST 档的 headline result：lz* 在 GRPO 后保留 77% 信号（d=-2.65， 仍为大效应），而
    HT 仅保留 20%（d=0.65，小效应）。机制解释：

    **为什么 lz* 存活**：GRPO 通过 reward-based optimization 改善模型 的推理能力，这表现为：(1) overall accuracy
    从 0.731→0.718（轻微下降 因为 GRPO reward 优化的是 generation quality 非 MC accuracy）， (2)
    θ_MLE 从 0.197→0.28（ability estimate 上升，因为 GRPO 使模型 在 hard items 上表现更好），(3) seen_acc
    从 0.831→0.795（记忆化信号 略有衰减——GRPO 的 KL penalty 部分"洗掉"了 SFT 阶段的 rote 记忆， 但不完全）。lz*
    的 4PL 加权对每个 item 的 aberrance 贡献根据 a/b/c/d 参数差异化处理——记忆化 items 的残差结构（高 a items 被答对、
    低 d items 被答对的特征模式）在 GRPO 后仍然保留，因为 GRPO 改变 token distribution 但不改变 binary response
    中的 item-specific memorization pattern（模型仍然记得那些题的答案）。

    **为什么 HT 退化**：HT = Σ(x_i - P_i(θ)) 仅按 difficulty 加权。 GRPO 全局提升 θ 后，P_i(θ) 对所有
    items 系统性增大——模型"应该" 答对更多 hard items。这使得 memorized items 的答对不再显得 aberrant （因为模型现在
    genuinely 有更高能力）。HT 无法区分"GRPO 带来的 真能力提升"和"SFT 记忆化的残留"。

    **为什么 MIA 失效**：GRPO 的 policy gradient updates 彻底重塑 token-level loss landscape（Wang
    et al. 2025），使 per-token loss 分布不再携带 contamination 信号。AUROC→0.50 复现 Wang et al.。

    **memorization_fraction 从 0.38→0.32**：GRPO 的 KL regularization "洗掉"了约 16% 的记忆化信号（(0.38-0.32)/0.38），但大部分保留。
    这与 lz* 的 retention ratio 0.77 数量级一致。

    '

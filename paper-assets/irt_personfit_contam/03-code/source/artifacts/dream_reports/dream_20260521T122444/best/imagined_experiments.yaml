tier: best
narrative_guidance: 'IRT person-fit is structurally robust to post-RL — the only binary-only
  method that survives the RL distributional shift that destroys all log-prob methods
  (Wang et al.) AND simpler person-fit statistics (HT). The 4PL parameterization provides
  both detection power (8× Guttman/U3) and RL robustness that difficulty-only statistics
  lack. Minimal-information operating point is not merely a constraint but a structural
  advantage: binary response patterns are invariant to the token-distribution shifts
  that GRPO induces, while the 4PL weighting scheme preserves item-specific memorization
  signatures that difficulty-only HT cannot isolate from global θ-shifts.

  '

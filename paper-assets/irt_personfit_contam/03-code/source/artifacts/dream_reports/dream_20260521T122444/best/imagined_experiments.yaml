  plan_id: exp-baseline-comparison
  description: '在 ctrl-contam ground-truth 数据上比较 IRT-FIT vs ≥5 baselines： (1) acc
    z-score, (2) HT, (3) U3/Guttman, (4) ConStat (re-test), (5) Min-K%/Min-K%++ (token
    probs), (6) PPL-based, (7) random。 包含 post-RL 条件下的 baseline 对比（与 exp-post-rl 联合分析）。

    '
  expected_results:
    lz_star_d_qwen15: -3.42
    lz_star_d_llama15: -2.95
    ht_d_qwen15: 3.21
    ht_d_llama15: 3.53

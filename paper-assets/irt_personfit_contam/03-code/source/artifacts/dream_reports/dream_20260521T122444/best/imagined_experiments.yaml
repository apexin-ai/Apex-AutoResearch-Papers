    response pattern 违反 local independence（同一知识域的 items 高度相关），(3) N=178 对于 14042 items
    的 IRT 估计仍远不够（经典 IRT 要求 N/items > 10）。 b_r=0.663 说明 difficulty 估计相对稳健（b 主要由 item

- name: Post-RL GRPO Detection
  plan_id: exp-post-rl
  description: 'Qwen2.5-7B-Instruct: SFT 注入 15% MMLU contamination → GRPO 训练 (rule-based
    reward on GSM8K)。

    测试 person-fit 检测力在 RL 后的保持程度。

    '
  expected_results:
    sft_baseline_lz_star: 3.85
    sft_baseline_delta_lz_star: -4.83
    sft_baseline_cohens_d: -3.42
    post_grpo_lz_star: 6.55
    post_grpo_delta_lz_star: -2.13
    post_grpo_cohens_d: -0.82
    post_grpo_acc_mmlu: 0.712
    post_grpo_acc_gsm8k_improvement: +7.5pp over SFT-only
    post_grpo_theta_mle: 0.22
    post_grpo_theta_shift_from_clean: 0.32
    post_grpo_memorization_fraction: 0.24
    grpo_steps_completed: 480
    grpo_steps_planned: 625
    grpo_completion_pct: 76.8
    grpo_reward_source: rule-based (GSM8K answer extraction + format correctness)
    detection_retained: true
    detection_power_reduction_pct: 76
    seen_unseen_split_post_grpo:
      seen_acc_delta: +0.04 (attenuated from SFT +0.09)
      unseen_acc_delta: '+0.02'
      seen_lz_star: 5.9
      unseen_lz_star: 7.1
  result_rationale: '**GRPO 削弱但不消除 person-fit 信号的机制**：

    (1) GRPO 优化 GSM8K reward，梯度更新主要作用于 math reasoning tokens 的分布。

    MMLU 多选题的 response pattern 只是被间接影响——GRPO 不直接惩罚或奖励 MMLU 答对/答错，

    所以 SFT 阶段注入的 memorization pattern 被"稀释"但不被"定向移除"。

    (2) memorization fraction 从 0.38 降至 0.24：GRPO 的 policy gradient 使模型的 response
    distribution

    整体平滑化（KL penalty 项防止偏离 reference policy 太远），最深的 rote memorization (~15% 的 seen
    items)

    保留，浅层 memorization 被洗掉。

    (3) θ_MLE 进一步上移至 0.22 (从 SFT-only 的 0.19)——GRPO 提升了 reasoning ability，

    higher θ 吸收更多 aberrance signal。这是 θ-shift 机制的 RL 延伸。

    (4) 实验仅完成 77%——GPU 时间限制导致 GRPO 提前终止 (480/625 steps)。

    更多训练步数可能进一步降低 |d|。这意味着报告结果时需注明 "preliminary" 和训练未完成。

    (5) |d|=0.82 处于 medium-to-large 边界——统计显著 (p<0.05) 但远不如 SFT-only 的 3.42。

    对比 Wang et al. (2025) 的 MIA methods post-RL |d|≈0，binary pattern 保留了更多信号。

    '

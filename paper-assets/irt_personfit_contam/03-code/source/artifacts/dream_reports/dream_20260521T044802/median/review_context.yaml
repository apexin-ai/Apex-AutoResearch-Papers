    but is substantially weakened."

    Paper 措辞：移入 §5.4 Exploratory Analysis，标题 "Preliminary Evidence of Partial Post-RL
    Retention"。

    关键 caveat：(a) N=1 模型，N=1 RL 配置，不支持 generalizable claim；(b) GRPO 未跑完 (77%)；

    (c) rule-based reward on GSM8K ≠ RLHF on general preference data，后者可能有不同效果。

    正面 framing：binary pattern 的结构优势部分成立——至少优于 token-prob methods (|d|≈0 post-RL)。

    这是 "promising direction requiring future work" 而非 "demonstrated advantage"。

    '
- name: Baseline Comparison — Full Completion
  plan_id: exp-baseline-comparison
  description: '补全 baseline comparison：在已有 binary-only baselines 基础上，增加 higher-information
    methods

    (ConStat re-test, Min-K%++, PPL-based) 量化 minimal-information 代价。目标 ≥5 baselines。

    '

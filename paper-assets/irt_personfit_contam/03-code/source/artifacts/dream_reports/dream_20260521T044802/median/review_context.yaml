  result_rationale: '**n=10 shrinkage 机制**：n=3 pilot 中 Qwen s2 (lz*=7.05) 是 outlier，人为压低了
    clean std (1.41)。

    n=10 捕获了更多自然变异——QLoRA 的 random initialization + data shuffling 在不同 seeds 下导致

    lz* 在 [5.2, 11.8] 范围波动。true std ≈ 2.05 使 Cohen''s d 从 3.42 降至 2.27。

    这不是检测力的真实下降，而是 n=3 时 denominator 被低估。CI 半宽 0.68 远优于 n=3 的 ~1.5。


    **Llama shrinkage 较小 (29% vs 34%)**：Llama clean seeds 本身方差就更稳定 (n=3 std=0.97)，

    n=10 std 仅升至 1.28。Llama 的 base model misfit 接近 0 (mean=-0.22)，response pattern

    更接近 IRT 预测，因此 seed 间变异较小。


    **Mistral 效应偏弱的三重原因**：

    (1) memorization efficiency 低——Mistral 的 grouped-query attention + sliding window
    attention

    在短序列 fine-tuning 时 rote memorization 较弱 (MF=0.28 vs Qwen 0.36)；

    (2) baseline misfit 处于 "中间地带" (lz*=3.8)——contamination 需要在已有 positive misfit 基础上

    进一步移动 lz*，但方向相反 (contamination → more negative Δlz*)，导致信号部分抵消；

    (3) θ-fixed 不稳定——Mistral clean θ_MLE 方差大 (seeds 间 θ 差异 >0.3)，

    固定 θ 的基准选择不如 Qwen/Llama 稳健，contam_25 出现异常高 lz*_fixed 打破单调性。


    **Multi-benchmark 效应递减**：GSM8K (1319 items) 的 Cohen''s d 系统性弱于 MMLU (14042 items)，

    因为 lz* 的 aggregation power 正比于 √n_items——items 少则 per-item noise 难以平滑。

    此外 GSM8K 的 chain-of-thought 格式使 SFT memorization 更多表现为 reasoning pattern 而非

    answer-level binary flip，memorization fraction 在 GSM8K 上预计 ~20% (vs MMLU 33-38%)。


    **Gemma 不完整**：31B 模型单次 QLoRA 训练约 9 GPU-hrs (vs 7B 的 3 hrs)，

    在 80 GPU-hr 总预算中仅够跑 clean + 15% 各一个 seed，无法计算 Cohen''s d。

    '

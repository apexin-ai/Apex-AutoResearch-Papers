    n_baselines: 7
    baselines_list: lz*, Guttman/U3, HT, acc z-score, Min-K%++, ConStat, PPL-based
  result_rationale: '**Higher-info methods 更强是预期中的结果**：

    (1) Min-K%++ (|d|≈5.2) 最强——SFT 直接优化了 contaminated items 的 next-token probability，

    Min-K%++ 精确测量的就是 token-level probability shift，信号最直接、最强。

    但 Wang et al. (2025) 已证明它在 post-RL 后失效，所以高 |d| 仅限 SFT 场景。

    (2) ConStat (|d|≈4.1) 利用 rephrased re-test 直接测量 "memorization vs generalization"，

    概念上最接近 ground truth (same question different wording)，但需要额外推理成本 (2× GPU time)。

    (3) PPL-based (|d|≈4.0) 利用 full log-probs，信息量多于 binary 但少于 token-level。


    **Item-level分层**：binary-only methods item AUROC 0.52-0.63 (near-random 至 weak)；

    higher-info methods 0.63-0.74 (weak 至 moderate)。即使 privileged methods 也远未达到 strong

    item-level detection——因为 SFT contamination 本质上产生 diffuse signal (MF=28-38%)，

    大多数 seen items 不产生 clean item-level fingerprint。这强化了 "model-level aggregation
    essential" 论点。


    **7 baselines 超过同行中位数 (~5)**，bootstrap CIs 是 6/8 同行缺失的差异化优势。

    '

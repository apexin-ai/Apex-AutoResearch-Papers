narrative_guidance: 'Claim 1 核心成立但范围收窄——n=10 seeds 揭示 pilot |d| 膨胀约 25%，headline 从
  "|d|>2.9 across families"

  调整为 "|d|>2.0 across two families, moderate in third"。Mistral 作为第三家族效应偏弱 (|d|≈1.5)，

  θ-fixed 不完全修复，memorization fraction 跨家族一致性从 "35-38%" 扩展为 "28-38% (10pp spread)"。

  Claim 2 基本不变——R² 略降至 ~0.62 但 "empirical trend" framing 已预设此结果。

  Claim 3 post-RL 降级：|d|=0.8 不足以支撑 "structural immunity"，改为 §5.4 exploratory evidence。

  补偿策略：item-level near-random (已完成) + 8× Guttman gap (已完成) + bootstrap CIs 作为独立贡献不受影响。

  投稿：EMNLP 可投但 claims 需精确限定；AAAI 2027 多 10 周完善是更安全选项。

  '

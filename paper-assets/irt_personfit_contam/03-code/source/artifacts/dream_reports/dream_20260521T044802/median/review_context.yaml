    item_auroc_ppl_llama15: 0.63
    item_auroc_lz_star_qwen15: 0.54
    item_auroc_guttman_qwen15: 0.52
    item_auroc_rf_oracle_qwen50: 0.63
    lz_star_vs_best_privileged_d_ratio: 0.44

- name: Multiscale lzm Cross-Benchmark Aggregation
  plan_id: exp-multiscale-lzm
  description: '实现 Hong, Lin & Cheng (2021) multiscale lzm 统计量，在 12 模型 case study
    + ctrl-contam 上验证。

    '
  expected_results:
    lzm_12model_flagged: 12/12 (100%)
    lzm_gemini15_value: 28.9
    lzm_gemini15_rank: 1
    lzm_ctrl_contam_qwen_15_d_improvement: +0.25 over MMLU-only lz*
    lzm_ctrl_contam_llama_15_d_improvement: '+0.18'
    lzm_vs_max_single_benchmark_correlation: 0.97
    lzm_implementation_validated: true
    lzm_key_limitation: MMLU (14042 items) dominates aggregation weight; GSM8K/HellaSwag
      contribute <15% to total signal
  result_rationale: 'lzm 的标准化聚合理论上比 ad hoc averaging 更优，但实际改善有限：

    (1) 在 12 模型 case study 中 57/60 already flagged，lzm 只能将 3 个 borderline cells 的
    p-value

    略降——Yi-Lightning/arc_c 从 p=0.098 降至 ~0.07，仍不改变 BH-FDR 校正后的结论。

    (2) ctrl-contam 的 |d| 提升仅 0.18-0.25，因为 MMLU 的 n_items 远大于其他 benchmarks，

    lzm 的 variance-weighted sum 中 MMLU 权重 >70%。增加 GSM8K/HellaSwag 只是增加了少量独立信号。

    (3) r=0.97 with max single-benchmark 说明 lzm 本质上 ≈ MMLU lz* in this dataset。

    lzm 的真正价值是 methodological completeness (citable implementation) 而非检测力提升。

    '
  tables: []
  figures_description:
  - 'Fig: lzm vs MMLU lz* scatter for 12 models — near-perfect correlation with marginal

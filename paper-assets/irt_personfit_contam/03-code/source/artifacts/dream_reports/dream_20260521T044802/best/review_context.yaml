  result_rationale: 'Best 档核心实验。n=10 seeds 扩展将 Qwen n=3 的 d=-3.42 (CI 很宽) 稳定化： n=10
    时 CI 从 ±1.5 收窄至 ±0.4，均值可能从 -3.42 略回归至 -3.15，因为 s2 (lz*=7.05) 类型的 outlier seed
    在更大样本中被均化。但 |d| 仍稳健在 2.5-4.0 区间内。Llama n=10 类似：n=3 的 d=-2.95 在扩展后稳定于 -2.72，CI
    收窄。

    Mistral 作为第三家族是关键验证。Mistral-7B-v0.3 是独立架构 (不共享 Qwen/Llama 的训练 pipeline)，若 |d|>2.0
    则确认检测方法对架构无关。 预期 d≈-2.83 基于：(1) Mistral-7B 能力水平与 Llama-8B 相当， (2) 7B 参数量的 QLoRA

  result_rationale: 'Best 档下 baseline comparison 产生论文最清晰的 story arc。Model-level： lz*
    (|d|=2.95-3.42) 相比 Guttman/U3 (|d|=0.38-0.55) 有 6-8× 效应量优势， 因为 Guttman 仅基于 item

- name: Post-RL Hypothesis Test (GRPO)
  plan_id: exp-post-rl
  description: 'Qwen3.5-9B: SFT 污染 (15%) → GRPO 训练 → 测试 lz* 是否仍检测污染。 直接回应 Wang et
    al. (2025) 的 MIA 失效问题。

    '
  expected_results:
    pre_rl_lz_star: 3.85
    pre_rl_delta_lz_star: -4.83
    pre_rl_cohens_d: -3.42
    post_rl_lz_star: 5.2
    post_rl_delta_lz_star: -3.48
    post_rl_cohens_d: -2.1
    post_rl_detection_power_retained: 0.65
    post_rl_theta_fixed_lz_star: 8.5
    post_rl_theta_fixed_delta: -2.9
    post_rl_theta_fixed_monotonic: true
    mia_mink_post_rl_auroc: 0.52
    mia_ppl_post_rl_auroc: 0.51
    mia_all_post_rl_near_random: true
    lz_star_post_rl_auroc: 0.78
    post_rl_accuracy: 0.725
    post_rl_memorization_fraction: 0.32
    rl_signal_attenuation: 35% signal reduction vs pre-RL
  result_rationale: 'Best 档的最强差异化实验。Wang et al. (2025) 已证明所有 10 种 log-prob 基 MIA 方法在
    RL-trained reasoning models 上 ≈ random (AUROC 0.50-0.53)。 lz* 基于 binary response
    patterns，结构性免疫于 RL 引起的 token-level distributional shift。

    预期 post-RL |d|=2.10 (vs pre-RL |d|=3.42)，信号衰减约 35%。 衰减原因：GRPO 训练会改变 response pattern
    (部分 memorized items 的 "rote reproduction" 被 RL 的 exploration/reasoning 策略替代)，但
    binary outcome (对/错) 层面的 memorization fingerprint 大部分保留—— 模型仍然 "知道答案"，只是生成路径不同。memorization
    fraction 从 0.38 略降至 0.32，反映 RL 引入的 partial forgetting。

    关键是 |d|=2.10 仍远超 1.5 阈值 (large effect)，而 MIA 方法 AUROC≈0.51 (random)。这直接量化了 binary
    vs log-prob 的信息层级差异： RL 改变 token distribution 但保留 binary outcome pattern。 θ-fixed
    分析进一步恢复/增强信号 (θ-shift 在 RL 后可能更大，因为 GRPO 进一步提升有效能力)。

    这是论文最强卖点：IRT-FIT 是已知唯一在 post-RL 条件下经验验证有效的 binary-only 检测方法。No other method operates
    at this information level AND survives RL distributional shift。

    '
  tables:
  - name: 'Table 7: Post-RL Detection Comparison'
    rows:
    - lz* (binary)
    - Min-K%++ (log-prob)
    - PPL (log-prob)
    - Acc z-score (binary)
    cols:
    - Pre-RL |d|
    - Post-RL |d|
    - Signal Retained %
    - Post-RL AUROC
    purpose: 核心对比表：lz* vs MIA methods 在 RL 前后的检测力变化
  - name: 'Table 8: Post-RL Mechanistic Analysis'
    rows:
    - Pre-RL
    - Post-RL
    cols:
    - lz*
    - Δlz*
    - θ_MLE
    - MF
    - Acc
    purpose: 展示 RL 对检测信号的定量影响
  figures_description:
  - 'Figure 7: Pre-RL vs Post-RL detection comparison (bar chart: lz* |d| vs MIA AUROC)'
  - 'Figure 8: Detection frontier diagram — information access level (y-axis) vs RL-robustness
    (x-axis), with all methods positioned'
  analysis: 'Post-RL 结果直接回应 R7 reviewer concern 和 Wang et al. (2025)。 |d|=2.10 > 1.5
    阈值确认 binary-pattern 的结构性 RL 免疫。 35% 信号衰减是 honest characterization——不声称 "完全免疫"，
    而是 "保持 large effect 检测力"。与 MIA 的 near-random 形成鲜明对比。 Figure 8 (detection frontier)
    可能成为论文最具影响力的概念图： 在 information access vs RL-robustness 二维空间中，IRT-FIT 占据 unique
    position (minimal information + RL-robust)。

    '

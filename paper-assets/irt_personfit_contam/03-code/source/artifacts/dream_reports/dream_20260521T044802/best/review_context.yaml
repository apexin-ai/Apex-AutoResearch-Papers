    across-benchmark meta-analytic z-score。 Gemini-1.5 在所有 benchmark 均有极端 lz*，因此 lzm
    最高 (≈48.5)。 ctrl-contam 模型的 lzm 中等 (12-15)，因为污染仅在 MMLU 上注入， GSM8K/HellaSwag 保持
    clean → 聚合后信号被稀释。这反而展示了 lzm 的 "多 benchmark 交叉验证" 特性：如果仅一个 benchmark 被污染， lzm 会比单

    HellaSwag 10042 items 之间缺少中间数据点)。BBH 6511 items 预期 power 0.86 (one-sided) → 0.91
    (two-sided)，基于 power ∝ √n_items 的经验关系：BBH/MMLU items ratio = 6511/14042 = 0.464，
    √(0.464) ≈ 0.68，MMLU power 0.978 × 0.68 ≈ 0.66 是 lower bound， 实际 power 更高因为 power
    function 是非线性的且中等 n_items 处 效率更高。MATH 5000 items 类似推算。

    R² 从 5-benchmark 的 0.65 (实测 ctrl-contam data) 提升至 0.82： 新增 2 个中间数据点大幅改善曲线拟合。原始

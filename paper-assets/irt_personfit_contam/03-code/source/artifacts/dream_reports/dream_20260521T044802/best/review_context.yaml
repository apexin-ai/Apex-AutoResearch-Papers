narrative_guidance: '原始 framing 完全成立，三条 Claims 无需调整。Headline: "IRT-FIT 在 3 个模型家族检测
  SFT 污染 |d|>2.0，且是唯一具有 post-RL 经验证据的 binary-only 方法。" Post-RL 结果成为最强 差异化卖点——直接回应
  Wang et al. (2025) 所有 MIA 方法 post-RL ≈ random 而 lz* 保持 检测力。三家族一致性 + n=10 seeds 收紧
  CI 构成 robustness 叙事核心。θ-fixed 升级为 通用方法论贡献（所有家族均恢复/增强单调剂量响应）。投稿目标 EMNLP 2026 ARR。

  '
imagined_experiments:
- name: Controlled Contamination Pilot (Qwen)
  plan_id: exp-ctrl-contam-pilot
  description: 'Qwen3.5-9B × 4 conditions (0%-s1/0%-s2/0%-s3/15%/50%) × MMLU。 验证 Δlz*
    显著性、clean-vs-clean noise floor、memorization fraction。 论文 go/no-go 信号。

    '
  expected_results:
    clean_s1_lz_star: 9.47
    clean_s2_lz_star: 7.05
    clean_s3_lz_star: 9.53
    clean_mean_lz_star: 8.68
    clean_std_lz_star: 1.41
    contam_15_lz_star: 3.85
    contam_50_lz_star: 7.29
    cohens_d_contam_15_ddof1: -3.42
    cohens_d_contam_50_ddof1: -0.99
    contam_15_delta_lz_star: -4.83
    contam_50_delta_lz_star: -1.39
    memorization_fraction_15pct: 0.38
    memorization_fraction_50pct: 0.29
    clean_vs_clean_delta_lz_star: <0.5 (noise floor)
    theta_shift_15pct: 0.29
    theta_shift_50pct: 0.47
    theta_fixed_monotonic: true
    theta_fixed_ratio: 3.12
  result_rationale: 'Best 档预期 pilot 强阳性，确认 go 信号。Qwen2.5-7B-Instruct 高基线 misfit (clean
    lz*≈8.7) 意味着 SFT 污染通过将 memorized items 的响应从 aberrant 拉回 "正常"来降低 lz*，产生显著负向 Δlz*。|d|=3.42
    在 n=3 下已是极大效应。15% 污染 memorization fraction ≈0.38 反映 QLoRA SFT 的泛化效应——约 62% 的 seen
    items 发生了能力泛化而非纯记忆，这是 SFT 的正常表现。50% 条件下 free-θ 非单调性 源于 θ-shift 机制：高污染大幅提升 θ_MLE
    (+0.47)，吸收了 aberrance 信号， 但 θ-fixed 分析完全恢复单调性 (ratio=3.12)，确认方法论贡献。s2 的 outlier
    (7.05 vs s1/s3≈9.5) 在 n=3 下可接受，驱动扩展至 n=10。

    '

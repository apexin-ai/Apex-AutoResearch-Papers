    Guttman)；(2) aggregation matters (item-level all near-random)。 Together 这些构成 "why
    IRT-FIT" 的完整回答：不是因为 lz* 在 item level 更好，而是因为 IRT 框架提供 principled aggregation mechanism
    (calibrated expected response probability)，将 14K 个弱信号聚合为 model-level 的强检测。

    '

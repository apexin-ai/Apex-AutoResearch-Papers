- name: 4PL vs 3PL Ablation
  plan_id: exp-4pl-ablation
  description: '4PL vs 3PL(d=1) ablation。量化 feasibility parameter d 对检测灵敏度的影响。

    '
  expected_results:
    hypothesis_confirmed: true
    far_4pl: 0.05
    far_3pl_range:
    - 0.047
    - 0.165
    far_2pl_range:
    - 0.5
    - 1.0
    mean_power_gain_mmlu: +27.3pp
    mean_power_gain_hellaswag: +26.1pp
    mean_power_gain_gsm8k: +20.3pp
    mean_power_gain_arc_c: +14.8pp
    mean_power_gain_humaneval: +13.7pp
    items_with_d_lt_095: 46% of MMLU items
    real_data_correlation_4pl_vs_3pl: 0.225
    real_data_rmse: 68.41
    deepseek_v3_delta: 357
  result_rationale: 'Best 档下 4PL 优势确认无疑。46% MMLU items 有 d<0.95 (upper asymptote <
    1.0)， 意味着即使完全掌握某 item，正确率也有上限——这对 LLM 而言是合理的 (某些 items 由于格式歧义、多义性等原因存在天花板效应)。当
    3PL 强制 d=1 时， 高能力模型在这些 items 上的 "正常不完美表现" 被错误标记为 aberrant， 导致 false alarm 膨胀 +
    检测 power 折半。DeepSeek-V3 (θ=3.77) 的 Δlz*=357 是极端案例：3PL 将其 lz* 从 +16.4 推到 -340.6，因为几乎所有
    d<0.95 items 的 "miss" 都被视为能力不匹配。这是 4PL 在 LLM 场景下的独特贡献—— 经典 psychometrics 中 d<0.95
    相对少见 (考生不会系统性地在 "easy" items 上 fail)，但 LLM 对 benchmark item 格式的敏感性使 upper asymptote
    至关重要。

    '
  tables:
  - name: 'Table 4: 4PL vs 3PL Detection Performance'
    rows:
    - MMLU
    - HellaSwag
    - GSM8K
    - ARC-C
    - HumanEval
    cols:

    仅 5pp，反映 QLoRA SFT 机制的一致性。

    θ-fixed 在所有 4 家族均恢复单调剂量响应：这将 θ-shift 机制从 "Qwen-specific workaround" 升级为 "通用方法论贡献"。Qwen
    (高基线 misfit) 和 Llama (低基线 misfit) 已证明两种模式；Mistral/Gemma 预期落在中间。

    power function R² 从 0.65 提升至 0.76-0.78：pilot 仅有 2 家族数据点， 第三/四家族加入后拟合点增多，SFT generalization
    effect 被 memorization fraction 正式建模后，理论-实测 gap 缩小。

    GSM8K/HellaSwag 效应量低于 MMLU：n_items 更少 (GSM8K 1319, HellaSwag 10042 vs MMLU 14042)，power
    ∝ √n_items，但仍显著。

    '

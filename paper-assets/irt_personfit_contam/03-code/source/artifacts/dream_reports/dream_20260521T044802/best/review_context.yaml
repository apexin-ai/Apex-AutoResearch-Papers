- name: MMLU Domain-Level Analysis
  plan_id: exp-domain-analysis
  description: '按 MMLU subject category 分别计算 person-fit，识别 contamination 是 uniform
    还是 domain-concentrated。

    '
  expected_results:
    gemini_mmlu_accuracy: 1.0
    gemini_domain_concentrated: false
    gemini_subjects_flagged: 50/57 (lz*>1.96)
    gemini_category_lz:
      STEM: 21.2
      Humanities: 17.9
      Social_Sciences: 15.9
      Other: 15.3
    doubao_negative_lz: true
    doubao_category_pattern: selective (Humanities -13, STEM -2)
    hunyuan_uneven: true
    mistral_flagged_subjects: 55/57
    ctrl_contam_domain_uniform: true
    ctrl_contam_seen_unseen_by_domain_consistent: true
  result_rationale: 'Best 档下 domain analysis 提供两层 insight：(1) PSN-IRT 12 模型的 domain-level
    异质性揭示不同的 contamination typology——Gemini-1.5 uniform (100% accuracy across all
    57 subjects) 暗示 comprehensive benchmark exposure；Doubao/Hunyuan selective patterns
    暗示 domain-specific training data偏差。(2) ctrl-contam 的 domain analysis 确认 QLoRA
    SFT 注入是 uniform 的 (random sampling without domain bias)， 因此 seen/unseen split
    在所有 domain 上一致——这验证了实验设计的内部 一致性。

    Gemini 50/57 subjects flagged (而非 57/57) 是因为某些小 subject (n<50 items) 的 bootstrap
    null 方差更大，p-value 未达阈值。 STEM (21.2) > Humanities (17.9) 的 lz* 差异反映 MMLU 中 STEM
    subjects 的 item 数量更多 (power ∝ √n_items per domain)。

    Doubao 的 negative lz* (Humanities -13) 表示 aberrant-deficit pattern：在 humanities
    items 上表现异常差，可能反映 training data 中 humanities 覆盖不足。这是 lz* 双向检测能力的自然体现。

    '

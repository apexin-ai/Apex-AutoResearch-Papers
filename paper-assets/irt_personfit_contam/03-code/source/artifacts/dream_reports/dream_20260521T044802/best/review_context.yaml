  plan_id: exp-ctrl-contam
  description: '4 模型 (Qwen/Llama/Mistral/Gemma) × 6 levels (0/5/10/15/25/50%) × 3
    benchmarks (MMLU/GSM8K/HellaSwag)。Qwen/Llama 扩展至 n=10 seeds。 建立完整 ground-truth

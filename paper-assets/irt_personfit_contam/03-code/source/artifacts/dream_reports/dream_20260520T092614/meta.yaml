    result_rationale: 'ConStat（需要 rephrased re-test）和 Min-K%++（需要 token probabilities）
      都显著优于 IRT-FIT。Gap 约 0.20-0.24 AUROC。

      原因很直接：更多信息=更好检测。 ConStat 通过比较原始问题和改述问题的表现差异来检测 memorization， 这个 differential
      signal 不受 θ 变化影响（改述问题测试相同知识但不同表述）。 Min-K%++ 利用 token-level probability 捕捉 memorized
      text 的 异常低 perplexity，信息量远超 binary correct/incorrect。

      IRT-FIT 的 Type-I error 高达 0.42（在 α=0.05 下）， 因为 universal misfit 导致大量 false positives。
      ConStat 和 Min-K%++ 的 Type-I error 可控（0.08, 0.11）。

      这个结果在 worst 档 narrative 下是核心贡献之一： 它量化了 "minimal-information operating point
      的代价"， 证明从 binary response 到 rephrased re-test 的信息增量 带来约 0.24 AUROC 的检测提升，建立了
      detection information hierarchy。


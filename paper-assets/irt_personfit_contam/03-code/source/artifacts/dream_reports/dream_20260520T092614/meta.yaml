    analysis: '理论推导成功建立了 detection power 的 approximate upper bound， 但精度不足以作为 practical
      calibration tool。核心限制是 Snijders 公式假设 item responses 在给定 θ 下局部独立， 而 contamination
      和 LLM 本身都违反这一假设。

      在 worst 档 narrative 下，这个结果被 reframe 为贡献： "即使在理论最优条件下（完美 IRT model fit）， binary
      response 在 moderate contamination 处的 power 也存在不可逾越的 nadir。Real-world model misfit
      只会进一步 degrade。这为 gray-box 方法的必要性提供了 information-theoretic justification。"

      '

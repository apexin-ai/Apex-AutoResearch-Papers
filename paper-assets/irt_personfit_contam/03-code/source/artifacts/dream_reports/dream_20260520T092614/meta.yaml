      Overall flagged rate ~19% 反映了两个因素的叠加：(1) 确实存在的 benchmark gaming—— 开源社区中"benchmark
      hacking"是公开的秘密，部分模型在 MMLU/GSM8K 训练集上做过 SFT； (2) Δlz* calibration 的不完美——controlled
      experiment 建立的阈值基于 2 个模型， 可能对其他架构/训练策略不够 robust，产生一定 false positives。

      时间趋势（12%→25%）有真实基础：2023 下半年到 2024 年，leaderboard 竞争加剧， 更多模型被发现在 benchmark data
      上训练。但趋势的 effect size 中等（Spearman 0.38）， 因为早期模型中也有污染（只是比例低）且后期有些模型反而更注意避免。


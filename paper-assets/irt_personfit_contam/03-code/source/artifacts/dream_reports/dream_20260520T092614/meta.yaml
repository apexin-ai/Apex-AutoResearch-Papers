  - name: Analytical Power Theory
    plan_id: exp-power-theory
    description: '基于 Snijders (2001) lz* 方差公式推导 power 与 n_items 的解析关系。 将 inverted-U
      从经验观察升级为理论命题，验证理论曲线与模拟/控制实验拟合度。

      '
    expected_results:
      theoretical_power_formula: P(detect) = Φ(−z_α + δ·√n / σ_lz) where δ = E[lz*_contam
        − lz*_clean]/n, σ_lz from Snijders variance
      inverted_u_theoretical_derivation: 'contamination fraction π ∈ [0,1] 时，E[lz*]
        = n·{π·f_contam(θ) + (1−π)·f_clean(θ) − f_expected(θ)}, 其中 f_contam 在高污染时驱动
        θ_MLE 上升，使 f_expected(θ) 接近 f_observed， 产生 lz*→0 的 identifiability collapse。拐点
        π* 可解析求解。

        '
      inverted_u_nadir_formula: π* = argmin |E[lz*(π)]| ≈ (θ_true − θ_low)/(θ_high
        − θ_low) — model ability dependent
      theory_vs_simulation_r2_mmlu: 0.96
      theory_vs_simulation_r2_hellaswag: 0.94
      theory_vs_simulation_r2_gsm8k: 0.92
      theory_vs_simulation_r2_arc_c: 0.91
      theory_vs_ctrl_experiment_r2_mmlu: 0.93
      theory_vs_ctrl_experiment_r2_hellaswag: 0.9
      n_min_for_80pct_power_at_15pct_contam: 4200
      n_min_for_80pct_power_at_5pct_contam: 11800
      n_min_for_80pct_power_at_25pct_contam: 1900
    result_rationale: 'Best 档下，理论与经验高度吻合 (R²>0.9)。原因： (1) Snijders (2001) 的 lz* 方差公式在
      n>100 时已非常精确， 我们的 benchmark n 远超 100，所以渐近近似几乎精确。 (2) 4PL model 在 simulation
      中是 ground truth，理论推导基于同一模型， 所以 theory-simulation 拟合自然极高 (R²=0.96)。 (3) Theory-control_experiment
      拟合略低 (R²=0.93) 因为真实 SFT 注入 并非理论假设的 "item 独立翻转"——有 generalization spillover (4.4%)
      和 item 间的 correlation (local dependence violation)。 (4) Inverted-U 的解析拐点公式使其从"奇怪的经验现象"变为
      "可预测的理论必然"——审稿人可以代入自己的 benchmark 参数验证。 (5) 最低 n_items 阈值直接给出实操建议：检测 15% 污染需要
      ≥4200 items， 这解释了为什么 MMLU/HellaSwag 可行而 ARC-C/HumanEval 不行。

      '

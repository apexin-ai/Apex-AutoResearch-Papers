  - name: Post-RL Hypothesis Test
    plan_id: exp-post-rl
    description: 'Qwen3.5-9B 上先 SFT 污染再 GRPO 训练，测试 person-fit 信号在 RL 后是否保留。 回应 Wang
      et al. (2025)。

      '
    expected_results:
      pre_rl_lz_star: 23.8
      pre_rl_accuracy_mmlu: 0.78
      pre_rl_delta_lz_star: 5.3
      post_rl_lz_star: 21.1
      post_rl_accuracy_mmlu: 0.8
      post_rl_delta_lz_star: 2.6
      post_rl_signal_retention: 0.49
      post_rl_still_detectable: marginal (p=0.08)
      clean_post_rl_lz_star: 19.2
      clean_post_rl_accuracy: 0.74
      clean_post_rl_delta_from_clean_pre_rl: 0.7
      signal_attenuation_pct: 51
      rl_smoothing_effect: GRPO redistributes probability mass, partially smoothing
        aberrant item-level patterns
      detection_auroc_post_rl_15pct: 0.65
      detection_auroc_pre_rl_15pct: 0.79
    result_rationale: 'Wang et al. (2025) 证明 RL (PPO/DPO) 后 MIA-based 方法（Min-K%++
      等）检测力 大幅下降——因为 RL 重新分配了 token-level 概率分布，抹去了 memorization 的  token-level 签名。

      IRT-FIT 操作在 binary response level，理论上对 token-level 变化更 robust—— 只要模型仍然在不该答对的题目上答对，lz*
      就会偏离。但 GRPO 也会部分 平滑 item-level patterns：(1) RL reward 通常基于 overall task performance  而非单
      item accuracy，鼓励模型"均匀化"知识分布；(2) policy gradient 更新 可能让模型遗忘一些 SFT 过拟合的特定 items。

      Median 档预测：信号衰减约 50%（5.3 → 2.6 Δlz*），marginal detection (p=0.08)。 不像 MIA 方法完全失败，但也不能声称"robust
      to RL"。 这符合"medium effect, conditional detection"的整体 narrative。 AUROC 从 0.79
      降到 0.65——仍然 above chance 但不再 reliable。

      '

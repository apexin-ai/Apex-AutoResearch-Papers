      auroc_irt_fit_hellaswag_15pct: 0.74
      auroc_constat_hellaswag_15pct: 0.87
      auroc_minkpp_hellaswag_15pct: 0.92
      auroc_gap_vs_constat_hellaswag: -0.13
      auroc_irt_fit_gsm8k_15pct: 0.63
      auroc_constat_gsm8k_15pct: 0.78
      auroc_minkpp_gsm8k_15pct: 0.88
      auroc_gap_vs_constat_gsm8k: -0.15
      mean_auroc_gap_vs_constat_at_15pct: -0.13
      mean_auroc_gap_vs_minkpp_at_15pct: -0.16
      type1_irt_fit: 0.06
      type1_constat: 0.04
      type1_minkpp: 0.03
      info_irt_fit: binary responses only
      info_constat: binary responses + rephrased retest
      info_minkpp: token-level probabilities
      pareto_optimal: Min-K%++ > ConStat > IRT-FIT in detection; IRT-FIT > ConStat
        > Min-K%++ in applicability scope
    result_rationale: 'Median 档核心预测：baseline_auroc_gap_vs_constat 在 [-0.20, -0.10]。

      IRT-FIT AUROC 0.79 vs ConStat 0.91 (gap = -0.12) 在 MMLU@15% 符合预期。 ConStat 优势来自
      rephrased retest 信号——如果模型记忆了原始 item， rephrased 版本的准确率会下降，这是一个直接的 contamination
      indicator。 IRT-FIT 只能从 binary pattern 的 aberrance 间接推断，信息量先天不足。

      Min-K%++ 的 AUROC 更高（0.94）因为 token-level probabilities 提供了 最丰富的信号——记忆的 item 有异常低的
      token surprisal。

      但信息需求也成比例增加：Min-K%++ 需要 API 返回 logprobs（很多 API 不支持）， ConStat 需要生成 rephrased
      items 并重新测试（需要 live model access）， IRT-FIT 只需要最终答案。在 Open LLM Leaderboard 这种场景下，
      只有 IRT-FIT 可以对历史提交进行 retrospective analysis。

      Gap = -0.12 to -0.15 是 minimal-information 的"代价"——论文将这个代价 本身作为贡献来量化和讨论，而非试图论证
      IRT-FIT 性能优于 baselines。

      '

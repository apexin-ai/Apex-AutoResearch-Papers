      generalization_ratio: 0.044
      cross_benchmark_spearman_ctrl_models: 0.74
      cross_benchmark_spearman_ctrl_p: 0.008
    result_rationale: 'Best 档下，两个模型在 MMLU 上都展示 Cohen''s d > 2.0 且 AUROC > 0.9 at 15%。
      机制解释： (1) SFT 注入的关键效应不是提升 overall accuracy（虽然也提升）， 而是创造 aberrant response pattern：模型在难题上答对（因为见过），
      在本应答对的简单题上偶尔答错（SFT 微调略微扰动了非目标知识）。 这种 pattern mismatch 正是 lz* 捕捉的信号。 (2) Gemma-4-31B
      (31B) 比 Qwen3.5-9B (9B) 能力更强，clean baseline lz* 更高 (22.6 vs 18.3)， 但污染效应略弱 (d=2.5
      vs 2.8)——因为更强的模型原本就能答对更多题， contamination 带来的额外"不该答对却答对"信号相对更小。 (3) GSM8K (1.3K
      items) 的 d=1.4 < 2.0 因为 n_items 小， 但 AUROC=0.82 仍实用——这与 simulation power curve
      一致。 (4) Dose-response 严格单调（在 0-50% 范围内），R²>0.96， 因为 0-50% 完全处于 negative lz*
      regime，远未到达 inverted-U nadir。 (5) SFT generalization ratio 仅 4.4%——被污染 items
      上 accuracy 提升 45pp， 非污染 items 仅 2pp——说明 QLoRA SFT 注入是高度 item-specific 的， 不会
      smooth out signal。这直接回应 R5 审稿意见。 (6) 跨 benchmark Spearman=0.74 (p=0.008) 在控制实验中显著，
      因为同一模型在多个 benchmark 上受到同等比例污染， lz* shift 高度相关——与 Phase B 的 n=12 观察性数据 (p>0.05)
      形成对比。

      '

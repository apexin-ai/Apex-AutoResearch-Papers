    # Dream Review Report: "On the Fundamental Limits of Binary-Response Contamination
    Detection"


    **Dream ID:** 20260520T092614 | **Review Mode:** Full (2 Reviewers + Roundtable)


    ---


    ## 1. Paper Summary


    This paper investigates whether IRT person-fit statistics (lz\*) can detect benchmark
    contamination in LLMs using only binary correct/incorrect response patterns—the
    minimal-information operating point. Through simulation, controlled contamination
    experiments (Qwen3.5-9B, Gemma-4-31B), a 42-model leaderboard audit, and baseline
    comparisons, the paper reaches a negative conclusion: binary responses contain
    insufficient information for reliable contamination detection. Three mechanisms
    are identified: (1) universal IRT model misfit producing 93% false-flag rates,
    (2) SFT knowledge transfer confounding contamination with genuine ability gain
    (Cohen''s d = 0.25, AUROC = 0.585 at best), and (3) an inverted-U power gap with
    nadir ≤ 0.12 at moderate contamination levels (25–40%). A "detection information
    hierarchy" quantifies the AUROC cost of the minimal-information constraint (binary
    → re-test: +0.235; binary → token probs: +0.195).


    ---


    ## 2. Reviewer Assignments


    | Reviewer | Focus | Score |

    |----------|-------|-------|

    | R1 | Methods + Experiments | 3 / 6 |

    | R2 | Novelty + Related Work | 3 / 6 |


    ---


    ## 3. Consolidated Strengths


    **S1. Well-motivated research question.** The paper asks a crisp, practically
    important question: can the cheapest possible signal (binary responses) detect
    contamination? This is directly relevant to benchmark maintainers who lack model
    access. Both reviewers agree the question alone merits investigation.


    **S2. Honest negative-result framing.** Rather than overfitting to a positive
    narrative, the paper presents a genuine negative finding with mechanistic explanation.
    The SFT knowledge-transfer confound (Section 6.4)—where QLoRA learns domain knowledge
    rather than memorizing items, causing θ to absorb the contamination signal—is
    a real and non-obvious insight that applies beyond IRT-based methods to any binary-response
    approach.


    **S3. Comprehensive experimental coverage.** The paper includes all 12 experiments
    from the design plan: simulation, pilot, full controlled experiment, theoretical
    power analysis, leaderboard audit, baseline comparison, post-RL analysis, extended
    benchmarks (BBH, MATH), domain-level analysis, multiscale aggregation, and 4PL/3PL
    ablation. The breadth is impressive for a single paper.


    **S4. The inverted-U characterization has standalone value.** The theoretical
    and empirical demonstration that detection power reaches its minimum at moderate
    contamination (25–40%)—exactly the regime most relevant to real-world leaderboard
    gaming—is an interesting structural insight, even if the theoretical fit (R² =
    0.61) is only approximate.


    **S5. Detection information hierarchy is actionable.** Quantifying the AUROC gain
    at each information-access level (Table 13) provides concrete guidance for the
    community: the +0.235 AUROC gain from binary to rephrased re-testing makes a clear
    case for investing in live model access for auditing.


    ---


    ## 4. Consolidated Weaknesses


    ### Critical Issues


    **W1. "Fundamental limits" title and framing overclaim the evidence.** (Consensus:
    R1 + R2)


    The paper tests one statistic (lz\*) under one parametric model family (4PL/3PL)
    and concludes about "fundamental limits of binary-response contamination detection."
    This is a significant overclaim. Untested alternatives include:

    - Nonparametric person-fit statistics (e.g., HT, U3, ZU3 from Karabatsos 2003)

    - MIRT (multidimensional IRT) models that could better capture LLM multi-ability
    structure

    - ML classifiers trained on binary feature vectors

    - Group-level statistical tests

    - Simple accuracy z-score baselines within the same information tier


    The controlled experiment comparison (Section 9) only compares against methods
    requiring *more* information (ConStat, Min-K%++), never against alternative binary-response
    methods. The paper cannot claim to characterize fundamental limits of an entire
    information tier when it only evaluates one method from that tier.


    **Recommendation:** Narrow the claim to "IRT person-fit statistics (lz\*) under
    standard parametric models fail for LLM contamination detection" or add same-tier
    baselines.


    **W2. Critically inadequate related work.** (Consensus: R1 + R2)


    Only 7 references is far below venue standards (typical: 30–50). Missing categories
    include:


    - **Psychometric person-fit literature:** Karabatsos (2003) compared 36 person-fit
    statistics—lz\* is just one, and far from the best. Sinharay (2017) conducted
    power analysis for detecting item preknowledge using person-fit statistics and
    may have already identified inverted-U–like behavior. Meijer & Sijtsma (2001)
    is cited but the post-2001 literature (20+ years) is entirely absent.

    - **IRT applied to LLMs:** Vania et al. (2021), Lalor et al. (2019), Rodriguez
    et al. (2021) on IRT-based evaluation of NLP models. PSN-IRT (the source of the
    paper''s 4PL parameters) is used but never cited by name.

    - **Contamination detection:** Golchin & Surdeanu (2024) benchmark contamination
    quiz, Oren et al. (2024) contamination methods survey, Deng et al. (2024) benchmark
    data contamination, Yang et al. (2023) rethinking benchmark contamination—at least
    10–15 more relevant methods exist.

    - **Negative results / impossibility results in ML:** No engagement with the genre
    conventions of negative-result papers.


    **W3. Controlled experiments are statistically underpowered.** (Primary: R1)


    With only 3 random seeds per condition and run-to-run SD of 6.2–11.2 for lz\*,
    the standard error is ~SE = SD/√3 ≈ 4–6.5. This means:

    - The non-significant p-values (0.18, 0.42, etc.) are uninformative—the experiment
    lacks power to detect even moderate effects.

    - Cohen''s d = 0.25 with n = 3 is in the noise floor; the confidence interval
    includes both d = 0 and d > 0.8.

    - Claiming a "NO-GO" based on non-significance with n = 3 is a textbook accept-the-null
    fallacy.


    At minimum 15–20 seeds are needed for the non-significance claims to be interpretable.
    With 3 seeds, one cannot distinguish "the effect doesn''t exist" from "the experiment
    was too small to see it."


    **W4. Leaderboard audit sample is too small and potentially biased.** (Consensus:
    R1 + R2)


    42 models out of 7,200+ (0.6%) is acknowledged as a limitation, but the paper
    still draws ecosystem-level conclusions ("93% of model-benchmark cells are flagged").
    The 42 models with per-item data are a convenience sample biased toward early
    submissions (2023 Q3–Q4), which may have systematically different contamination
    profiles than later models. No analysis of selection bias is provided.


    ### Major Issues


    **W5. The inverted-U may not be novel.** (Primary: R2)


    Sinharay (2017) analyzed detection power for item preknowledge using person-fit
    statistics and found that power depends non-monotonically on the proportion of
    compromised items. The authors should verify whether their inverted-U characterization
    is genuinely new or a rediscovery of known psychometric results. If it is already
    known, the theoretical contribution is substantially reduced.


    **W6. Theory-simulation fit is weak (R² = 0.61).** (Consensus: R1 + R2)


    An R² of 0.61 means the theoretical power function explains only 61% of variance,
    with systematic overestimation of 15–30%. The paper acknowledges this but still
    presents the theoretical bound as a contribution. A bound that overestimates by
    2× at moderate contamination has limited practical utility. The paper should be
    more explicit that this is an approximate qualitative guide, not a calibrated
    tool.


    **W7. SFT-only contamination mechanism may not generalize.** (Primary: R1)


    All controlled experiments use QLoRA SFT, but real-world contamination often occurs
    through pretraining data exposure or data deduplication failures—mechanisms that
    may produce different aberrance patterns (rote memorization vs. domain knowledge
    transfer). The paper''s core mechanism (SFT knowledge transfer absorbs the contamination
    signal) may be specific to SFT and not apply to pretraining-stage contamination,
    where the model doesn''t undergo a discrete fine-tuning step on benchmark items.


    ### Minor Issues


    **M1.** The paper title is very long (two lines + subtitle). Consider condensing.


    **M2.** Table 3 uses subscripts (15%_neg, 25%_neg, 35%_comb, 50%_pos, etc.) that
    make the table hard to parse. A figure would communicate the inverted-U more effectively.


    **M3.** The 4PL model equation (Eq. 1) introduces parameters (a, b, c, d) but
    the source of calibrated parameters (PSN-IRT) is never formally cited—only mentioned
    in passing.


    **M4.** Section 8.1 states per-item data covers "less than 1% of all models"—this
    is a finding about the leaderboard ecosystem, not about the method. The conflation
    of data availability limitations with methodological limitations weakens the argument.


    **M5.** The post-RL experiment (Section 7) uses only one model (Qwen3.5-9B) and
    one RL method (GRPO). Generalization to other RL algorithms (PPO, DPO) and model
    sizes is unknown.


    **M6.** No error bars or confidence intervals are reported for AUROC values in
    Table 7 and Table 12.


    ---


    ## 5. Questions for Authors


    1. Have you tested any nonparametric person-fit statistics (HT, U3, Gpn) or ML
    classifiers on binary response vectors? If lz\* fails but a random forest on the
    same binary features succeeds, the "fundamental limits of binary responses" framing
    collapses.


    2. What is the statistical power of your controlled experiment to detect a Cohen''s
    d = 0.5 effect with only 3 seeds? If the answer is <50%, the non-significance
    results cannot support a NO-GO conclusion.


    3. Are you aware of Sinharay (2017, JEM) on power analysis for detecting item
    preknowledge? How does your inverted-U relate to prior findings in that line of
    work?


    4. For the leaderboard audit, could you characterize the selection bias of the
    42-model convenience sample relative to the full 7,200+ models (e.g., model size
    distribution, submission date, base model family)?


    5. The SFT knowledge transfer mechanism is specific to instruction tuning. Do
    you have any evidence that pretraining-stage contamination (the more common real-world
    mechanism) produces the same θ-absorption effect?


    6. Why was PSN-IRT not formally cited? What are the coverage and accuracy properties
    of its 4PL calibration?


    ---


    ## 6. Experiment Coverage Assessment


    All 12 planned experiments are reflected in the paper:


    | # | Experiment | Covered | Notes |


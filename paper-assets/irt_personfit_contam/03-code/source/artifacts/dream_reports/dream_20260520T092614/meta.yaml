    | 11 | Extended benchmarks (BBH, MATH) | ✓ | Table 14, Section 10.1 |

    | 12 | Domain-level analysis | ✓ | Table 15, Section 10.2 |


    Coverage is complete. However, the paper would benefit from figures (only tables
    are present), and several experiments are presented in a compressed format that
    makes it hard to assess details.



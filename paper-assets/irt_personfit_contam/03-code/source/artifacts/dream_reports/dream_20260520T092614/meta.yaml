    # Dream Review Report: IRT-FIT


    **Paper:** IRT-FIT: Detecting Benchmark Contamination in Large Language Models
    via Person-Fit Statistics at the Minimal-Information Operating Point


    **Review Mode:** Full (2-Reviewer Roundtable)

    **Reviewers:** R1 (Methods + Experiments), R2 (Novelty + Related Work)


    ---


    ## 1. Paper Summary


    The paper introduces IRT-FIT, a framework that repurposes IRT person-fit statistics
    (lz*) to detect benchmark contamination in LLMs using only binary correct/incorrect
    response patterns. The key innovation is using Δlz* (the misfit delta between
    clean and contaminated conditions) to handle the universal positive misfit problem
    in real LLM data. Three claims are made: (1) AUROC > 0.9 at 15% contamination
    on large benchmarks (≥10K items), within 3–5pp of gray-box methods; (2) detection
    power follows a predictable inverted-U with an analytically derivable nadir; (3)
    a leaderboard-wide audit of 1,847 models reveals ~12% contamination-consistent
    misfit with significant temporal trends.


    The paper spans 8 pages of main text + 3 pages of appendices, covering simulation,
    controlled contamination (Qwen3.5-9B + Gemma-4-31B via QLoRA SFT), post-RL robustness
    (GRPO), baseline comparison (vs. ConStat, Min-K%++), and a 1,847-model leaderboard
    audit. Seven appendices provide ablations (4PL vs 3PL), extended benchmarks (BBH,
    MATH), domain-level analysis, multiscale lzm, and power tables.


    ---


    ## 2. Consolidated Strengths


    **S1. Genuinely novel conceptual bridge (R1, R2 agree).** The connection between
    IRT person-fit analysis (a decades-old psychometric tool for detecting cheating
    examinees) and LLM benchmark contamination is new and well-exploited. No prior
    work has applied lz* to LLMs. The analogy is not superficial — it correctly identifies
    that contamination creates the same "answering hard items correctly while missing
    easy ones" aberrance pattern that person-fit statistics were designed to detect.


    **S2. Clean "detection frontier" framing (R1 S1, R2 agrees).** Organizing contamination
    detection methods along an information-access axis (binary responses → rephrased
    tests → token probabilities → model weights → training data) is a valuable conceptual
    contribution that contextualizes IRT-FIT''s niche clearly. The honest quantification
    of the accuracy cost (3–5pp AUROC gap vs. gray-box methods) is commendable.


    **S3. Strong analytical power theory (R1 S2, R2 agrees).** The closed-form power
    formula P(detect) = Φ(−z_α + δ√n/σ_{lz*}) fitting simulation at R² ≥ 0.91 across
    all benchmarks is a genuine theoretical contribution. The minimum n_items table
    (Table 12: ≥4,200 items for 80% power at 15% contamination) provides directly
    actionable guidance. The inverted-U derivation with the nadir formula π* ≈ (θ_true
    − θ_low)/(θ_high − θ_low) elevates an empirical observation to a predictable phenomenon.


    **S4. Post-RL robustness is a structural differentiator (R1 S4, R2 agrees).**
    IRT-FIT retaining 94% AUROC after GRPO while Min-K%++ drops to 64% is a strong
    result. The mechanistic argument — RL reshapes token probabilities but preserves
    binary outcome patterns — is well-reasoned and provides a durable advantage against
    the post-RL training trend.


    **S5. Uniquely enabled leaderboard-scale audit (R1 S5, R2 agrees).** The 1,847-model
    audit is something no existing method can replicate on archived data. The temporal
    trend (4.2% → 20.1% flagging, Q3 2023 → Q2 2024) and model-family analysis (Yi-derivatives
    31%, official Llama-2 3%) provide ecosystem-level intelligence unavailable elsewhere.


    **S6. Thorough experimental coverage.** The paper covers all planned experiments
    from the design document: simulation, controlled contamination, power theory validation,
    leaderboard audit, baseline comparison, post-RL robustness, 4PL/3PL ablation,
    extended benchmarks, domain-level analysis, and multiscale lzm. The breadth is
    impressive for an 8-page paper.


    ---


    ## 3. Consolidated Weaknesses


    ### Major


    **W1. The universal misfit problem is incompletely addressed for the leaderboard
    audit (R1 W1, R2 relates).** The paper correctly identifies that real LLMs exhibit
    universal positive misfit (lz* >> 0 even for clean models, e.g., Qwen3.5-9B clean
    lz* = +18.3 on MMLU) due to IRT assumption violations (local independence, unidimensionality).
    The Δlz* solution works for controlled experiments where clean baselines exist.
    However, for the leaderboard audit (the paper''s headline application), the methodology
    for deriving the 12% flagging rate from a population of models with universally
    inflated lz* is not transparently explained. The paper states the audit uses "Δlz*
    baseline calibrated from the controlled experiment" (Section 5.5), but this requires
    extrapolating contamination thresholds from 2 models to 1,847 models with vastly
    different architectures and capabilities. The gap between "all clean models have
    extreme lz*" and "12% are flagged" needs more methodological detail: what is the
    precise flagging criterion? How are model-specific baselines estimated without
    clean counterparts?


    **W2. Critically insufficient references (R2 primary, R1 supports).** The paper
    cites only 10 references — far below the threshold for any top venue. Critical
    omissions include:

    - **Sinharay (2017)** — power analysis for person-fit under preknowledge, which
    partially anticipates the inverted-U and is the most directly relevant psychometric
    work

    - **Karabatsos (2003)** — comparison of person-fit statistics, would justify the
    lz* choice

    - **Ye et al. (2024), "Data Contamination Quiz"** — a same-information-level competitor
    using accuracy patterns, not cited or compared

    - **Lalor et al. (2019), Vania et al. (2021)** — IRT applied to NLP tasks

    - **Golchin & Surdeanu (2024)** — contamination detection

    - Person-fit literature on cheating detection in educational testing (St-Onge
    et al., 2011; Tendeiro et al., 2016)


    The thin reference list weakens positioning and risks appearing as if the authors
    are unaware of prior art.


    **W3. No same-information-level baseline comparison (R2 primary).** The paper
    compares IRT-FIT against ConStat and Min-K%++, which operate at higher information
    levels. It does not compare against simpler binary-information methods such as:
    (a) accuracy z-scores across items, (b) pattern-based anomaly detection, (c) the
    "Data Contamination Quiz" approach of Ye et al. (2024). Without such comparisons,
    readers cannot assess whether the IRT machinery (4PL fitting, lz* computation)
    provides meaningful improvement over simpler alternatives using the same input
    information.


    **W4. The "binary responses only" framing obscures the PSN-IRT item bank dependency
    (R1 W7, R2 agrees).** IRT-FIT requires pre-calibrated 4PL item parameters (a,
    b, c, d for each item), which were obtained from PSN-IRT calibrated on a specific
    set of models. This is a non-trivial prerequisite: item parameters depend on the
    calibration sample and may not generalize. The information requirement is more
    accurately "binary responses + calibrated item bank" rather than "binary responses
    only." This dependency should be foregrounded in the contributions and limitations.


    ### Moderate


    **W5. Narrow post-RL validation (R1 W5).** Only one RL algorithm (GRPO), one model
    (Qwen3.5-9B), one contamination level (15%), and one benchmark (MMLU) are tested.
    The general claim of post-RL robustness is based on a single configuration. PPO,
    DPO, KTO, and longer RL training could yield different results. The finding is
    suggestive but not conclusive.


    **W6. Baseline comparison fairness (R1 W4).** The comparison with ConStat and
    Min-K%++ is somewhat apples-to-oranges: these methods use strictly richer information.
    While the paper frames this correctly in the "detection frontier" narrative, the
    specific AUROC numbers (0.94 vs. 0.97 vs. 0.96) may suggest near-parity that is
    partially an artifact of evaluating on the controlled contamination setup designed
    for IRT-FIT. No confidence intervals are reported on AUROC values, making it impossible
    to assess whether differences are statistically significant.


    **W7. Only 2 model families in controlled experiments (R1, R2).** Qwen3.5-9B (9B)
    and Gemma-4-31B (31B) are both transformer-based. Two models is the minimum for
    "cross-model" claims. Including a third model family (e.g., a Llama variant) and
    models at different scales would strengthen generalization claims.


    ### Minor


    **W8. lzm null distribution concern (R1 W3).** Equation for lzm uses |lz*|, whose
    sum does not follow N(0,1) under the null. Either the formula or the null distribution
    claim needs correction.


    **W9. Table density.** The paper has 14 tables across 11 pages. Consolidating
    related tables would improve readability.


    **W10. Formatting.** The Limitations section lacks a proper heading style consistent
    with other sections. Wang et al. (2025) has a placeholder arXiv ID.


    ---


    ## 4. Questions for Authors


    1. **Leaderboard audit methodology:** What is the precise flagging criterion for
    the 1,847-model audit? How is the clean baseline estimated for models without
    ground-truth clean counterparts? How do you handle the universal positive misfit
    problem when Δlz* requires a clean reference?


    2. **Same-information baselines:** How does IRT-FIT compare against a simple accuracy
    z-score detector or the Data Contamination Quiz method (Ye et al., 2024) that
    also uses only binary response patterns?


    3. **PSN-IRT sensitivity:** How sensitive is lz* to perturbations in the 4PL item
    parameters? What happens if item parameters are re-calibrated on a different model
    sample?


    4. **Adversarial evasion:** Given the predictable inverted-U nadir (~72% for MMLU),
    could an adversary deliberately contaminate at the nadir fraction to evade detection?
    How robust is the two-sided test at this specific point?


    5. **Post-RL generalization:** Do you have plans to test with DPO, PPO, or longer
    RL training? Is the binary-signal preservation guaranteed or empirically contingent?


    6. **Sinharay (2017):** How does the power analysis relate to Sinharay''s 2017
    work on power under preknowledge? Does that work anticipate the inverted-U?


    ---


    ## 5. Experiment Coverage Assessment


    Comparing against the experiment design (review_context.yaml):


    | Experiment | Covered? | Quality |

    |---|---|---|

    | Extended Simulation (inverted-U) | ✓ Table 1, Section 5.1 | Thorough |

    | Controlled Contamination Pilot | ✓ Merged into full experiment | Appropriate
    |

    | Full Controlled Contamination | ✓ Tables 3-4, Section 5.2 | Good, but only 2
    models |

    | Analytical Power Theory | ✓ Section 4.3, Table 2 | Strong |

    | Leaderboard Data Recon | ✓ Implicit in Section 5.5 | Adequate |

    | Leaderboard-Wide Audit | ✓ Tables 7-8, Section 5.5 | Good, but methodology gap
    |

    | 4PL vs 3PL Ablation | ✓ Appendix B, Table 10 | Complete |

    | Baseline Comparison | ✓ Table 6, Section 5.4 | Missing same-info baselines |

    | Multiscale lzm | ✓ Appendix G | Brief but present |

    | Post-RL Hypothesis | ✓ Table 5, Section 5.3 | Narrow (single config) |

    | Extra Benchmarks (BBH, MATH) | ✓ Table 2, Appendix E | Complete |

    | Domain-Level Analysis | ✓ Appendix F, Table 14 | Complete |


    **Overall coverage: 12/12 experiments reflected.** All planned experiments are
    represented, though some are compressed to fit within the page limit.


    ---


    ## 6. Overall Assessment


    ### R1 Score: 3.5 / 6 (adjusted from initial 2.5 after roundtable)

    R1''s initial score of 2.5 was heavily driven by concern W2 (experiment authenticity),
    which is a meta-concern inherent to the dream review format rather than a flaw
    in the paper itself. Removing this concern and focusing on substantive methodological
    issues (W1, W4-W7), R1 adjusts upward. The universal misfit handling (W1) remains
    a significant gap, but the power theory and post-RL results are strong contributions.


    ### R2 Score: 3.5 / 6

    R2 maintains the initial score. The novelty is genuine and the contribution is
    meaningful, but critically thin references, missing same-information baselines,
    and the obscured item bank dependency prevent a higher score.


    ### Consolidated Score: 3.5 / 6 (Borderline Weak Accept)


    **Justification:** IRT-FIT introduces a genuinely novel and well-motivated framework
    connecting IRT person-fit analysis to LLM contamination detection. The analytical
    power theory and the leaderboard-scale audit capability are real contributions
    that advance the field. The post-RL robustness finding provides structural differentiation.
    However, several issues prevent a clear accept:


    1. The methodology for the leaderboard audit — the paper''s most impactful result
    — has a transparency gap regarding how universal misfit is handled without clean
    baselines.

    2. The reference list (10 citations) is far below venue standards and misses the
    most relevant prior work (Sinharay 2017).

    3. No same-information-level baseline comparison makes it impossible to assess
    whether IRT complexity is justified over simpler binary-pattern methods.

    4. The item bank dependency is underacknowledged in the "binary responses only"
    framing.


    **Path to acceptance:** (a) Expand references to 25-30+, including Sinharay (2017),
    Karabatsos (2003), Ye et al. (2024), and the cheating detection literature. (b)
    Add a same-information baseline (accuracy z-score or Data Contamination Quiz).
    (c) Provide explicit methodology for leaderboard audit flagging criterion, addressing
    how universal misfit is handled. (d) Acknowledge item bank dependency in contributions
    and abstract. (e) Add confidence intervals to AUROC comparisons. These are all
    addressable within a revision cycle.


    **Verdict for top ML venue (~25% acceptance):** The core idea is above the acceptance
    bar in novelty and potential impact. The execution has meaningful gaps that are
    addressable. With the suggested revisions, this paper would likely score 4.0–4.5
    at resubmission.

    '

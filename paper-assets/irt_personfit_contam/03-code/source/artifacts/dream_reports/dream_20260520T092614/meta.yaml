        - -0.05
        - 0.05
        leaderboard_models_with_peritem_data:
        - 500
        - 7000
        leaderboard_flagged_rate_relative:
        - 0.05
        - 0.25
        cross_benchmark_spearman_in_ctrl:
        - 0.6
        - 0.9
        inverted_u_theoretical_fit_r2:
        - 0.9
        - 0.99
      narrative_direction: '原始 framing 完全成立。Claim 1: minimal-information detection
        经控制实验验证，Δlz* 提供 可靠的相对检测信号，calibration gap 被 bridged。Claim 2: inverted-U 从经验升级为理论命题，
        dose-response 曲线在两个模型上复现。Claim 3: leaderboard 大规模审计揭示生态系统级污染趋势， Gemini-1.5
        case study 由控制实验的 Δlz* 基线提供定量支撑。Headline: "IRT-FIT achieves AUROC>0.9 at 15%
        contamination using only binary responses, and a leaderboard-wide audit reveals
        X% of models exhibit contamination-consistent misfit."

        '
    median:
      tier: median
      meaning: Δlz* 可检测但效应量中等——高污染/大 benchmark 有效，低污染/小 benchmark 失败，需收窄 claims
      key_assumptions:
      - SFT 注入污染后 Δlz* 存在但效应量中等（Cohen's d 0.8–2.0），仅在 ≥15% 污染 + ≥5K items 条件下可靠分离
      - 5% 污染水平检测力不足（AUROC<0.70），小 benchmark（ARC-C, HumanEval）Δlz* 不显著
      - SFT 泛化效应部分平滑信号：domain 内准确率提升 dilute aberrance pattern
      - Leaderboard per-item data 部分可用（100–500 模型）或需补充推理
      - Baseline 对比：IRT-FIT AUROC 低于 ConStat 10–20%，minimal-info 代价可量化但不可忽略
      - 跨模型不完全一致：两个模型 Δlz* 方向一致但幅度差异大

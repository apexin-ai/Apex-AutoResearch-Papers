  review_report: "---\ndream_id: dream_20260520T092614\ntier: median\noverall_score:\
    \ 3.5/6 — Borderline\ntimestamp: 2026-05-20T10:16:18.375569+00:00\n---\n\n# Dream\
    \ Review Report: IRT-FIT\n\n**Paper**: IRT-FIT: Detecting Benchmark Contamination\
    \ in Large Language Models via Item Response Theory Person-Fit Statistics  \n\
    **Review mode**: Full (2 Reviewers, 4-step roundtable)  \n**Review standard**:\
    \ Top ML venue, ~25% acceptance rate, 6-point scale\n\n---\n\n## Overall Assessment\n\
    \n| Dimension | Score |\n|-----------|-------|\n| **Overall** | **3.5 / 6 (Borderline)**\
    \ |\n| Soundness | 3.5 |\n| Novelty | 3.0 |\n| Significance | 3.5 |\n| Presentation\
    \ | 4.0 |\n| Confidence | 4 / 5 |\n\n**One-line verdict**: A refreshingly honest\
    \ cross-disciplinary paper that introduces a principled minimal-information contamination\
    \ detector with thorough characterization, but limited model diversity, severe\
    \ under-citation, and modest detection performance (AUROC < 0.80) place it at\
    \ the borderline for a top venue.\n\n---\n\n## Paper Summary\n\nThe paper applies\
    \ Item Response Theory (IRT) person-fit statistics — specifically the standardized\
    \ log-likelihood statistic lz* (Snijders, 2001) — to detect benchmark contamination\
    \ in LLMs using only binary (correct/incorrect) response data. The key insight\
    \ is that benchmark contamination creates the same statistical signature as exam\
    \ cheating in psychometrics: aberrant response patterns where a model answers\
    \ hard items correctly beyond what its estimated ability predicts. The paper characterizes\
    \ an \"operating envelope\" (≥15% contamination, ≥5K items) within which detection\
    \ is reliable, discovers an inverted-U power curve with a detection trough at\
    \ 40–70% contamination, quantifies a 13-point AUROC gap versus richer-information\
    \ methods (ConStat, Min-K%++), and conducts a retrospective audit of 310 Open\
    \ LLM Leaderboard models identifying 18 multi-benchmark flagged cases.\n\n---\n\
    \n## Experiment Coverage Assessment\n\nAll 12 imagined experiments from the design\
    \ document are present in the paper:\n\n| # | Experiment | Paper Section | Status\
    \ |\n|---|-----------|---------------|--------|\n| 1 | Extended Simulation (Inverted-U)\
    \ | §4.1, Tables 1–2 | ✅ Complete |\n| 2 | Controlled Contamination Pilot | §5.1,\
    \ Table 6 | ✅ Complete |\n| 3 | Full Controlled Contamination | §5.2, Tables 7–9\
    \ | ✅ Complete |\n| 4 | Theoretical Power Derivation | §4.2, Tables 3–4 | ✅ Complete\
    \ |\n| 5 | Leaderboard Data Reconnaissance | §7.1, Table 15 | ✅ Complete |\n|\
    \ 6 | Leaderboard Audit Scan | §7.2–7.3, Tables 16–18 | ✅ Complete |\n| 7 | 4PL\
    \ vs 3PL Ablation | §6.2, Table 12 | ✅ Complete |\n| 8 | Baseline Comparison |\
    \ §6.1, Tables 10–11 | ✅ Complete |\n| 9 | Multiscale lzm | §6.4, Table 14 | ✅\
    \ Complete |\n| 10 | Post-RL Hypothesis Test | §6.3, Table 13 | ✅ Complete |\n\
    | 11 | Extended Benchmarks (BBH, MATH) | §4.3, Table 5 | ✅ Complete |\n| 12 |\
    \ MMLU Domain Analysis | §7.4, Table 19 | ✅ Complete |\n\n**Coverage**: 12/12\
    \ (100%). The paper comprehensively implements the experimental plan.\n\n---\n\
    \n## Strengths\n\n### S1. Novel cross-disciplinary bridge (R2, confirmed by R1)\n\
    The connection between IRT person-fit statistics and LLM contamination detection\
    \ is genuinely novel. The observation that benchmark contamination is \"functionally\
    \ identical\" to exam cheating with item preknowledge is a crisp insight that\
    \ opens a well-developed psychometric toolkit to the LLM evaluation community.\
    \ This is not a trivial analogy — the lz* statistic's theoretical properties (known\
    \ null distribution, sensitivity to aberrance patterns) translate meaningfully\
    \ to the contamination setting.\n\n### S2. Inverted-U characterization is the\
    \ standout empirical finding (R1+R2 consensus)\nThe discovery that detection power\
    \ follows an inverted-U as a function of contamination rate — peaking at ~15%,\
    \ dropping through a trough at 40–70%, then recovering at near-total contamination\
    \ — is theoretically interesting and practically important. The mechanistic explanation\
    \ (ability estimate inflation masking aberrance in the transition zone) is convincing,\
    \ and the theoretical derivation (Eq. 5, c_peak formula) elevates this from observation\
    \ to understanding. The R² = 0.80 fit across benchmarks confirms structural regularity.\n\
    \n### S3. Honest, well-characterized operating envelope (R1+R2 consensus)\nThe\
    \ paper's framing is its greatest strength. Rather than overselling a modest detector,\
    \ it precisely characterizes where IRT-FIT works (≥15% contamination, ≥5K items,\
    \ negative-lz* regime), where it fails (small benchmarks, low contamination, 40–70%\
    \ trough), and at what cost (13pp AUROC gap vs. ConStat). The minimum n_items\
    \ table (Table 4) is directly actionable for practitioners.\n\n### S4. Comprehensive\
    \ experimental design within scope (R1)\nThe paper covers remarkable ground: simulation\
    \ studies → theoretical derivation → controlled SFT experiments → baseline comparison\
    \ → ablation → leaderboard audit. The pilot → full experiment progression (§5.1→5.2)\
    \ follows sound experimental methodology. The SFT generalization analysis (Table\
    \ 9) decomposing signal sources into directly trained (+29pp), same-domain (+3pp),\
    \ and other-domain (+1pp) items is particularly insightful and explains why the\
    \ inverted-U trough appears earlier in real data (50%) than simulation (70–80%).\n\
    \n### S5. Power-information frontier is a useful conceptual contribution (R2)\n\
    Organizing contamination detection methods along an information-access axis (binary\
    \ → retest → token probs → weights) and placing IRT-FIT as the minimal-information\
    \ anchor point provides a valuable framework for the field. Table 11 crystallizes\
    \ this. The unique capability column (retrospective audit of historical submissions)\
    \ is a compelling practical argument.\n\n### S6. Strong presentation quality (R1+R2)\n\
    The paper is well-written, appropriately scoped for 8 pages + references, and\
    \ claims are properly hedged. The progression from theory → simulation → controlled\
    \ experiment → real-world application is logical. Tables are informative (though\
    \ numerous — 19 tables in 11 pages).\n\n---\n\n## Weaknesses\n\n### W1. [Major]\
    \ Severely under-cited: only 9 references (R2, endorsed by R1)\nFor a paper bridging\
    \ IRT and LLM evaluation while comparing against multiple contamination methods,\
    \ 9 references is inadequate by a wide margin. Missing critical related work includes:\n\
    \n- **IRT applied to LLMs**: Uto (2024) on IRT robustness for LLM evaluation,\
    \ Polo et al. (2024) on IRT-based efficient LLM evaluation, Benedetto et al. (2023)\
    \ on IRT for NLP. These directly establish the IRT-LLM bridge the paper claims\
    \ as novel.\n- **Person-fit literature**: Meijer & Sijtsma (2001) comprehensive\
    \ review of person-fit statistics, Karabatsos (2003) comparing person-fit indices,\
    \ Reise (1990) on lz limitations, Levine & Rubin (1979) foundational work. The\
    \ paper uses only lz* without justifying this choice over alternatives (e.g.,\
    \ HT statistic, Bayesian person-fit).\n- **Additional contamination methods**:\
    \ Golchin & Surdeanu (2024) on time-travel-based detection, Duan et al. (2024),\
    \ Li et al. (2024) on task contamination, Dekoninck et al. (2024b) on contamination\
    \ in code benchmarks.\n- **Benchmark integrity**: Jacovi et al. (2023), Balloccu\
    \ et al. (2024) on contamination surveys.\n\nA reviewer at any top venue would\
    \ flag this immediately. **This is fixable but currently disqualifying.**\n\n\
    ### W2. [Major] Only 2 model families for controlled experiments (R1, endorsed\
    \ by R2)\nQwen3.5-9B and Gemma-4-31B both are dense transformers of moderate size.\
    \ The cross-model magnitude ratio (1.13–1.33, Table 8) shows substantial variation\
    \ even between these two. The paper's claims about operating envelope generalizability\
    \ are unsubstantiated for:\n- Mixture-of-Experts architectures (Mixtral, DeepSeek-MoE)\n\
    - Very large models (70B+)\n- Very small models (<3B)\n- Models with different\
    \ tokenizers or pre-training distributions\n\nThe leaderboard audit applies thresholds\
    \ calibrated from these 2 models to 310 diverse architectures. Without cross-validation\
    \ or leave-one-model-out analysis, the 19% flagged rate could be substantially\
    \ inflated by calibration mismatch.\n\n### W3. [Moderate] Leaderboard audit false\
    \ positive control is insufficient (R1)\nThe paper acknowledges flagged rates\
    \ are \"upper bounds\" but provides no formal false positive analysis. Specific\
    \ concerns:\n- GSM8K flagged rate (28%) at n=1319 items likely reflects lz* variance\
    \ inflation rather than true contamination\n- The Δlz* threshold calibrated from\
    \ QLoRA-SFT may not transfer to models contaminated via other mechanisms (pre-training\
    \ overlap, instruction tuning on benchmark-adjacent data)\n- No permutation test,\
    \ calibration curve, or expected false positive rate estimation is provided\n\
    - Claiming \"18 multi-benchmark flagged models\" as high-confidence cases is reasonable\
    \ but quantifying the expected false discovery rate would strengthen the claim\
    \ substantially\n\n### W4. [Moderate] Methodological novelty is incremental (R2)\n\
    The core technical contribution — computing lz* on binary LLM response vectors\
    \ — is a direct application of Snijders (2001) with PSN-IRT item parameters. The\
    \ Δlz* approach for universal misfit is sensible but straightforward engineering\
    \ (train clean vs. contaminated, measure shift). The theoretical derivation (Eq.\
    \ 5) extends Snijders' variance formula but relies on standard asymptotic arguments.\
    \ The inverted-U is the most novel element, but it emerges from the well-known\
    \ properties of lz* under ability inflation rather than from a new statistical\
    \ insight.\n\n### W5. [Moderate] Practical utility is limited by operating envelope\
    \ (R1+R2)\nThe operating envelope (≥15% contamination AND ≥5K items) is quite\
    \ restrictive:\n- Most contamination in practice is likely <15% (incidental web-crawl\
    \ overlap)\n- Only 3 of the 7 tested benchmarks exceed 5K items (MMLU, HellaSwag,\
    \ BBH)\n- Within the envelope, max AUROC is 0.79 — not reliable enough for definitive\
    \ flagging\n- The 40–70% detection trough means a substantial contamination range\
    \ is undetectable\n\nThe paper is honest about these limits, but the question\
    \ remains: is a detector that works only under specific, relatively narrow conditions\
    \ a sufficient contribution?\n\n### W6. [Moderate] Post-RL experiment is underpowered\
    \ (R1)\nTable 13 reports signal attenuation on a single model (Qwen3.5-9B) × single\
    \ benchmark (MMLU). The 51% retention claim and p=0.08 marginal significance cannot\
    \ support the general statement that \"binary-level patterns are more resilient\
    \ to RL smoothing\" (§6.3). At minimum, repeating on Gemma-4-31B and on HellaSwag\
    \ would be needed.\n\n### W7. [Minor] No code/data availability statement (R1)\n\
    Reproducibility requires access to: (1) PSN-IRT item parameters, (2) contaminated\
    \ model checkpoints, (3) leaderboard per-item data processing pipeline. None is\
    \ mentioned.\n\n### W8. [Minor] Ethical considerations of naming specific models\
    \ (R2)\nGemini-1.5-Pro is explicitly named as the most flagged model (lzm = 3.82,\
    \ 4/5 benchmarks). The paper does not discuss: (a) the possibility of false positive\
    \ for this specific case, (b) ethical implications of public accusation, (c) whether\
    \ model developers were contacted. The caveat in §7.4 (\"converging evidence,\
    \ not definitive proof\") is appropriate but brief.\n\n### W9. [Minor] Dense table\
    \ presentation (R2)\n19 tables across 11 pages is excessive for the main paper\
    \ body. Tables 3, 5, 12, 14, 15 could be moved to an appendix without loss of\
    \ narrative flow. This would free space for expanded related work.\n\n---\n\n\
    ## Questions for Authors\n\n1. **Calibration transfer**: Have you considered leave-one-model-out\
    \ validation for the Δlz* threshold? I.e., calibrate on Qwen only and test on\
    \ Gemma (and vice versa) — what is the cross-model threshold stability?\n\n2.\
    \ **Alternative person-fit statistics**: Why lz* specifically rather than other\
    \ person-fit indices (HT, Bayesian approaches)? Have you tested whether alternative\
    \ statistics provide different operating envelope characteristics?\n\n3. **IRT\
    \ assumption violations**: You acknowledge universal misfit (all LLMs have lz*\
    \ far from N(0,1)). Have you quantified the degree of local independence violation?\
    \ If adjacent MMLU items from the same subject share conditional dependence, how\
    \ does this affect lz* calibration?\n\n4. **SFT vs. pre-training contamination**:\
    \ Your controlled experiments use QLoRA SFT. Real-world contamination often occurs\
    \ via pre-training data overlap, which produces different memorization patterns\
    \ (more distributed, less item-specific). Do you expect IRT-FIT to perform differently\
    \ against pre-training contamination?\n\n5. **GSM8K false positives**: GSM8K shows\
    \ the highest flagged rate (28%) despite only 1319 items. What proportion of this\
    \ do you estimate is true positives vs. false positives from lz* variance inflation?\n\
    \n6. **Gemini-1.5 specifics**: Gemini-1.5's 100% MMLU accuracy with θ = 0.78 is\
    \ flagged as anomalous. But θ is estimated from the same data — could item parameter\
    \ misspecification (PSN-IRT calibrated on different model population) explain\
    \ the low θ despite high accuracy?\n\n7. **Code availability**: Will code and\
    \ processed leaderboard data be released upon publication?\n\n---\n\n## Reviewer\
    \ Convergence Notes\n\n**Points of consensus (R1 + R2):**\n- The inverted-U finding\
    \ and operating envelope characterization are the paper's strongest contributions\n\
    - Under-citation is the most immediately fixable but currently most disqualifying\
    \ issue\n- 2 model families is a significant limitation for generalizability claims\n\
    - The paper's intellectual honesty is commendable and rare\n- Presentation quality\
    \ is high despite table density\n\n**Point of divergence:**\n- R1 (3.5) weights\
    \ the solid experimental methodology and characterization value more heavily\n\
    - R2 (3.0) weights the incremental methodological novelty and citation gaps more\
    \ heavily\n- **Consensus**: 3.5 (Borderline) — the paper has a viable core contribution\
    \ but needs substantial revision to reach acceptance threshold\n\n---\n\n## Actionable\
    \ Revision Recommendations (Priority-Ordered)\n\n1. **[Critical] Expand references\
    \ to ≥25**: Add IRT-for-LLM works, person-fit literature review, additional contamination\
    \ methods, benchmark integrity surveys. This is a 1-day fix that addresses the\
    \ most visible weakness.\n\n2. **[High] Add ≥1 more model architecture**: Ideally\
    \ a MoE model (Mixtral-8x7B) and/or a model of very different scale. This tests\
    \ calibration transferability and strengthens operating envelope claims.\n\n3.\
    \ **[High] Provide false positive analysis for leaderboard audit**: Permutation\
    \ test (shuffle model responses across items, compute null Δlz* distribution)\
    \ or leave-one-model-out threshold cross-validation. Report expected FDR alongside\
    \ flagged rates.\n\n4. **[Medium] Expand post-RL experiment**: Run on ≥2 models\
    \ × ≥2 benchmarks. Current single-case cannot support the general claims in §6.3.\n\
    \n5. **[Medium] Add code/data availability statement**: Commit to releasing code,\
    \ processed item parameters, and leaderboard analysis pipeline.\n\n6. **[Low]\
    \ Consolidate tables**: Move ≥5 tables to appendix, use freed space for expanded\
    \ related work section.\n\n---\n\n## Score Justification\n\n**3.5 / 6 (Borderline)**\
    \ — The paper introduces a genuinely novel cross-disciplinary connection and provides\
    \ thorough, honest characterization of a minimal-information contamination detector.\
    \ The inverted-U finding, operating envelope, and power-information frontier are\
    \ real contributions to the contamination detection literature. However, severe\
    \ under-citation (9 refs), limited model diversity (2 families), and modest detection\
    \ performance (max AUROC 0.79) prevent a clear accept recommendation. With the\
    \ actionable revisions above — particularly expanded related work, additional\
    \ model architectures, and false positive analysis — this paper could reach acceptance\
    \ at a top venue in a subsequent cycle.\n\n**Confidence: 4/5** — Familiar with\
    \ both IRT literature and LLM contamination detection methods. Minor uncertainty\
    \ about whether expanded related work would reveal more direct precedents that\
    \ diminish novelty claims."

      narrative_direction: 'Claims 需要 scope 收窄但核心 framing 保留。Claim 1 调整为："IRT-FIT
        在 minimal-information operating point 提供有条件的检测能力——大 benchmark（≥5K items）+
        中高污染（≥15%）场景下 AUROC 达到 0.7–0.9，代价是相比 gray-box 方法损失 10–20% AUROC。" 这个 power-information
        tradeoff 本身成为贡献——首次量化 minimal-info 的代价。Claim 2 保留 inverted-U 理论但 增加 boundary
        condition（n_items threshold）。Claim 3 缩小 leaderboard audit 规模， Gemini-1.5 case
        study 作为 converging evidence 而非 definitive proof。新增贡献： calibration gap 的系统刻画
        + power-information frontier 的量化分析。论文从 "practical detector" 调整为 "principled
        framework with characterized operating envelope"。

        '
    worst:
      tier: worst
      meaning: Δlz* 在控制实验中不显著或方向不一致——SFT 泛化完全平滑 aberrance signal，核心假设失败
      key_assumptions:
      - SFT 污染后 Δlz* 效应量小（Cohen's d < 0.8）或方向不一致（有时变正有时变负）
      - SFT 泛化效应主导：模型学到 domain knowledge 而非 item-specific pattern，lz* 的变化与 θ 提升不可分离
      - AUROC 在所有污染水平均 <0.70，无法与随机分类器拉开差距
      - 两个模型结果不一致：一个有信号另一个没有，无法 claim 泛化性
      - Leaderboard per-item data 不可用，大规模审计在 GPU 预算内不可行

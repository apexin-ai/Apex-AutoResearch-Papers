  - name: Power 理论推导
    plan_id: exp-power-theory
    description: '基于 Snijders 2001 lz* 方差公式推导 power 与 n_items 的解析关系， 验证理论曲线与模拟的拟合。将
      inverted-U 从经验升级为理论命题。

      '
    expected_results:
      snijders_variance_formula_applicable: true
      theoretical_power_function_derived: true
      r2_theory_vs_sim_mmlu: 0.68
      r2_theory_vs_sim_hellaswag: 0.62
      r2_theory_vs_sim_gsm8k: 0.55
      r2_theory_vs_sim_average: 0.61
      inverted_u_nadir_theoretical: 0.33
      inverted_u_nadir_empirical: 0.35
      theory_overestimates_power_by: 15-30%
      closed_form_lower_bound_derived: true
      lower_bound_tightness: loose (factor ~2x at moderate contamination)
    result_rationale: 'Snijders (2001) 的方差公式 Var(lz*) ≈ 1 + O(1/n) 在标准 IRT 假设下成立。
      但推导 contamination-specific power 需要额外假设 contaminated items 的 响应分布，而这在 worst
      档下与实际不符：理论假设 contaminated items 独立 以 p=1 响应，但实际 SFT 后模型的响应是 correlated（domain
      generalization）。

      结果：理论曲线能捕捉 inverted-U 的定性形状（R²=0.61）， 但系统性高估 power 15-30%。理论 nadir 在 33%（vs
      模拟 35%）， 误差可接受。但 closed-form lower bound 过于 loose（实际 power 约为 bound 的 1/2），使其作为
      practical guide 的价值有限。

      在 worst 档 narrative 下，这个拟合度恰好支持 "impossibility" 论点： 即使理论上的 upper bound 也不够高（moderate
      contamination 处）， 加上 real data 的 model misfit 进一步 degrade，binary response 检测的
      fundamental ceiling 得以量化。

      '

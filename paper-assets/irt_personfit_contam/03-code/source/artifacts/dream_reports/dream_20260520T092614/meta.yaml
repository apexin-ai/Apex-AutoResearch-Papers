      Gemma-4-31B（31B 参数）泛化能力更强，SFT 后 Δlz* 在大部分污染水平上 甚至方向相反（负方向=over-consistency）。31B
      模型有足够 capacity 来将 benchmark items 整合为 coherent domain knowledge， 响应模式比 clean
      模型更 "正常"（更符合 4PL 预测）， lz* 反而下降。AUROC 0.55 本质上是随机分类器。

      两模型在方向上仅 60% 一致（3/5 levels），Cohen''s d 均值 0.25， 远低于 0.8 threshold。这证明 SFT contamination
      的效应是 model-capacity-dependent 的，无法建立 universal mapping。

      Cross-benchmark Spearman 0.12 表明不同 benchmark 上的 Δlz* 几乎不相关——污染对不同 domain 的影响是
      idiosyncratic 的， 取决于 benchmark 与模型已有知识的 overlap 程度。

      '

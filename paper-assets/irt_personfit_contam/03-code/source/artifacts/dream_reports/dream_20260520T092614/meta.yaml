      narrative_direction: 核心检测假设不成立，需 reframe。新 angle："Why Psychometric Aberrance
        Models Break for LLMs — and What This Reveals About LLM Cognition." 三条新 Claims：(1)
        LLM 响应模式 系统性违反 IRT 局部独立性和单维性假设——这不是噪声而是 LLM 知识结构的指纹（universal misfit 的定量刻画成为核心贡献）；(2)
        SFT 污染通过泛化效应产生与 ability 提升不可区分的 lz* 变化， 揭示 SFT 的知识迁移机制——contamination 不是 item
        memorization 而是 domain learning， 这解释了为什么所有 binary-response 方法（不仅 IRT）在 SFT
        后天然受限；(3) 理论 power 分析 建立 detection information hierarchy 的 lower bound——证明
        binary response 的信息量不 足以可靠分离 contamination 与 ability，为社区 justify 了 gray-box
        方法的必要性。论文从 "detection tool" 转为 "impossibility characterization + cognitive
        diagnostic"， 仍适合 EMNLP（evaluation methodology track）。卖点：不是 "我们的方法 work"，而是
        "我们 证明了这个 operating point 的 fundamental limitation 并解释了 why"。

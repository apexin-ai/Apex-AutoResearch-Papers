- name: Theoretical Power Derivation
  plan_id: exp-power-theory
  description: '基于 Snijders (2001) lz* 方差公式推导 power ∝ f(n_items, contam_rate) 的解析关系，
    验证理论曲线与模拟的拟合度，建立 inverted-U 的理论基础。

    '
  expected_results:
    theory_vs_sim_r2_negative_regime: 0.91
    theory_vs_sim_r2_positive_regime: 0.83
    theory_vs_sim_r2_combined: 0.85
    min_n_items_for_power_0.8_at_15pct: 8200
    min_n_items_for_power_0.5_at_15pct: 2800
    min_n_items_for_power_0.8_at_5pct: '>50000 (extrapolated)'
    inverted_u_peak_formula: contam_peak ≈ σ²(θ) / (2 × E[I(θ)]) — depends on ability
      variance and test information
    inverted_u_peak_predicted_mmlu: 0.17
    inverted_u_peak_observed_mmlu: 0.15
    inverted_u_trough_depth_formula: proportional to n_items^(-1/2) × contam_rate
      × (1 - contam_rate)
    power_scaling: Power ∝ sqrt(n_items) × contam_rate × g(θ_shift) where g is a non-monotone
      function capturing the inverted-U
    identifiability_collapse_threshold: contam_rate at which E[θ_contam] > θ_max_discriminating
      ≈ 3.0
  result_rationale: 'Snijders (2001) 给出 Var(lz*) ≈ 1 + O(1/n) 在零假设下。污染注入等价于 向 response
    vector 添加 n×c 个"能力不匹配"的正确回答（c = contamination rate）。

    在负向 regime（低-中污染），lz* 的期望偏移 ∝ sqrt(n) × c × Σ[log P_j(θ) 的 aberrance term]， power
    随 sqrt(n) 增长——这解释了为什么 MMLU (14K) 的 power 远超 ARC-C (1172)。 理论与模拟在负向 regime 拟合良好（R²
    = 0.91），因为 Snijders 的正态近似在 大 n 下准确。

    正向 regime 拟合较差（R² = 0.83）因为 identifiability collapse 涉及 θ 估计的 boundary 效应——当 θ
    → ∞ 时 MLE 不稳定，理论公式的渐近近似失效。 这也是 median 档的体现：理论框架基本成立但在边界条件下精度降低。

    min_n_items 阈值计算表明 5% 污染在任何现有 benchmark 上都不可检测 （需 >50K items），支持 "scope 收窄" 的叙事——IRT-FIT

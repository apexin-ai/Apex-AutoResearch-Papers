    - college_mathematics (lz*=8.7)
    - formal_logic (lz*=8.3)
    gemini15_least_aberrant_domains:
    - high_school_us_history (lz*=1.2)
    - world_religions (lz*=1.5)
    gemini15_stem_vs_humanities_lz_star_diff: 2.1
    gemini15_contamination_pattern: broad but STEM-concentrated
    other_models_domain_concentration_gini: 0.45
    domain_specificity_varies_by_model: true
  result_rationale: 'Gemini-1.5 在 MMLU 上 100% accuracy + lz*=34.75 + θ=0.78 表明大规模污染。
    Domain-level 分析可以区分：(1) 均匀污染（所有 subject 同样 aberrant）vs  (2) 集中污染（某些 domain 远比其他更
    aberrant）。

    预测 Gemini-1.5 是"broad but STEM-concentrated"——90% 的 subjects 被标记 表明污染覆盖面广，但 STEM
    domains（数学、逻辑）的 lz* 更高， 可能因为这些 domain 的 item difficulty 分布更极端（有更多真正 hard items），
    污染导致的 aberrance 更显著。文科 domain 的 items 整体较易， 即使没有污染高能力模型也能做对大多数，aberrance 信号更弱。

    Gini 系数 0.45 表明中等集中度——不完全均匀但也非极端集中。 这与"SFT 在完整 MMLU 上训练"的假说一致——训练覆盖所有 subject，
    但不同 subject 的检测灵敏度取决于 item difficulty 分布。


- name: MMLU Domain-Level Analysis
  plan_id: exp-domain-analysis
  description: '按 MMLU subject category 分别计算 person-fit，分析 Gemini-1.5 的污染是全面性还是集中性。

    '
  expected_results:
    n_mmlu_subjects: 57
    n_subjects_with_sufficient_items: 42

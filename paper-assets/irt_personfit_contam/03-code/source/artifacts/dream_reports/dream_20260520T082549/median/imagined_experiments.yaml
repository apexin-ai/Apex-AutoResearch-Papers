    '
- name: Open LLM Leaderboard 大规模审计
  plan_id: exp-leaderboard-audit
  description: '对可用的 ~250 个模型（data-recon 后实际可分析数量）计算 per-benchmark person-fit， 标记
    anomalous 模型，绘制 per-benchmark 污染率随时间趋势。

    '
  expected_results:
    leaderboard_models_scanned: 250
    leaderboard_flagged_rate_overall: 0.06
    flagged_models_count: 15
    flagged_rate_mmlu: 0.08
    flagged_rate_hellaswag: 0.05
    flagged_rate_gsm8k: 0.07
    flagged_rate_arc_c: 0.03
    over_consistent_flagged: 10
    aberrant_flagged: 5
    temporal_trend_slope: 0.015
    temporal_trend_p_value: 0.12
    top_flagged_model_lz_star: 28.5
    cross_benchmark_consistency_among_flagged: 0.4
  result_rationale: 'Median 档下仅 ~250 模型可分析（远低于理想的 7K+），flagged rate ~6%。 机制：(1) 大多数
    leaderboard 模型是 honest evaluations，flagged rate 应在 5-10%； (2) Over-consistent
    flags（lz*>>0）多于 aberrant flags，与 Phase B 的系统正偏一致； (3) 时间趋势存在（后期模型 flagged rate
    略高）但不显著（p=0.12）， 因为样本量 250 不足以在 5% 的 rate 差异上达到统计显著性； (4) Cross-benchmark consistency
    仅 40%——多数 flagged 模型只在 1-2 个 benchmarks 上异常，而非全面污染。 核心局限：250 模型的 audit 无法做 fine-grained
    temporal 或 model-family 分析， 只能报告 aggregate statistics + notable cases。

    '
  tables:
  - 'Table: Top-15 flagged models with per-benchmark lz* values, model family, release
    date, classification (over-consistent vs aberrant).'
  - 'Table: Per-benchmark flagged rate summary with 95% Wilson CI.'
  figures_description:
  - 'Scatter plot: x=model release date (或 leaderboard submission date), y=max |lz*|
    across benchmarks。flagged models 标红，non-flagged 标灰。趋势线附 95% CI band。'
  - 'Stacked bar chart: per-benchmark flagged rate (over-consistent vs aberrant vs
    clean), 展示不同 benchmarks 的污染特征差异。'
  analysis: '250 模型的 audit 展示了 IRT-FIT 的 unique capability（binary data only → large-scale
    scan）， 但统计力不足以支撑 strong prevalence claims。论文中应表述为 "exploratory scan of a representative
    sample" 而非 "comprehensive audit"。6% flagged rate 本身是有意义的 finding（表示非 trivial 的污染率），但需要讨论
    false positive 风险（calibration 问题导致的 systematic positive bias 可能 inflate flagged
    rate）。

    '
- name: 4PL vs 3PL(d=1) Ablation
  plan_id: exp-4pl-ablation
  description: '固定 d=1 将 4PL 降级为 3PL，重新计算所有 lz*，比较检测灵敏度差异。 量化 feasibility parameter
    d 对 false alarm 和 detection power 的影响。

    '
  expected_results:
    auroc_4pl: 0.85
    auroc_3pl: 0.82
    auroc_difference: 0.03
    false_positive_rate_4pl_at_alpha_05: 0.048
    false_positive_rate_3pl_at_alpha_05: 0.067
    power_at_15pct_mmlu_4pl: 0.979
    power_at_15pct_mmlu_3pl: 0.958
    over_consistent_detection_improvement_4pl: 0.08
    aberrant_detection_improvement_4pl: 0.02
    gemini_lz_star_4pl: 34.75
    gemini_lz_star_3pl: 28.2
  result_rationale: '4PL 的 d 参数（上渐近线 <1）使 perfect performance 更"surprising"—— 在 3PL(d=1)
    下，θ 足够高时所有 items 都预期被答对，所以全部正确不异常； 在 4PL(d<1) 下，即使 θ=∞ 也有部分 items 预期被答错（d<1 items），
    全部正确因此是 over-consistent 信号。结果： (1) Over-consistent 检测（Gemini-1.5 type）4PL 明显优于
    3PL （Gemini MMLU lz* 从 28.2 升到 34.75，因为 d<1 items 的正确回答贡献额外 surprise）； (2) Aberrant
    检测（partial contamination）差异很小（+0.02 AUROC）， 因为 d 参数主要影响高 θ 区域； (3) False positive
    rate：3PL 偏高（0.067 vs 0.048），因为高能力模型在 3PL 下 的 expected score 偏高（d=1 overestimates
    ceiling），使 lz* 系统偏正， 导致正侧 false alarm。 整体：4PL 比 3PL 好但差距不大（AUROC +0.03），主要优势在
    over-consistent 检测 和 Type I error 控制。

    '
  tables:
  - 'Table: 4PL vs 3PL detection metrics comparison — AUROC, power@15%, FPR, per-benchmark
    breakdown.'
  - 'Table: Per-model lz* comparison (4PL vs 3PL) for PSN-IRT 12 models on MMLU.'
  figures_description:
  - 'Paired ROC curves: 4PL (solid) vs 3PL (dashed), 分 positive-side 和 negative-side
    两个 panel。Over-consistent detection 的差异更明显。'
  - 'Delta lz* scatter: x=4PL lz*, y=3PL lz*, 12 models × 5 benchmarks = 60 points。对角线上的偏离展示
    d 参数的影响——高 lz* 区域偏差更大。'
  analysis: '4PL 的优势集中在 over-consistent detection 和 Type I error 控制。 在论文中应报告为 "4PL
    provides modest but consistent improvement, particularly for detecting full contamination
    (lz*>>0) where the d parameter correctly models that even the highest-ability
    examinees cannot achieve perfect scores." 这不是 headline result 但支持 methodological
    rigor。

    '
- name: Baseline 方法对比（ConStat, Min-K%++）
  plan_id: exp-baseline-comparison
  description: '在控制实验的 ground-truth contaminated models 上，比较 IRT-FIT vs ConStat vs
    Min-K%++ 的 AUROC 和 Type-I error。量化 minimal-information 的代价。

    '
  expected_results:
    irt_fit_auroc_at_15pct: 0.85
    constat_auroc_at_15pct: 0.83
    min_k_pp_auroc_at_15pct: 0.91
    irt_fit_auroc_at_25pct: 0.93
    constat_auroc_at_25pct: 0.9
    min_k_pp_auroc_at_25pct: 0.96
    auroc_advantage_vs_constat: 0.02
    auroc_disadvantage_vs_min_k: -0.06
    type_i_error_irt_fit: 0.048
    type_i_error_constat: 0.055
    type_i_error_min_k: 0.042
    irt_fit_auroc_at_5pct: 0.62
    constat_auroc_at_5pct: 0.58
    min_k_pp_auroc_at_5pct: 0.72
    information_access_levels: 'IRT-FIT: binary only; ConStat: binary + retest; Min-K%++:
      token probabilities'
  result_rationale: 'Median 档下 IRT-FIT 与 ConStat 基本持平（AUROC 差 +0.02，within CI）， 但低于
    Min-K%++（差 -0.06）。这是 expected tradeoff： (1) IRT-FIT vs ConStat：两者都用 binary data
    但 ConStat 需要 re-test（第二次评估同一 benchmark）， IRT-FIT 只需一次。在 ground-truth 实验中信息量相当，所以
    AUROC 接近； 但 ConStat 有 re-test 的额外信号（performance consistency across two runs），
    median 档下这个信号只带来微小优势 +0.02 对 ConStat，被 IRT-FIT 更好的 population-level modeling（4PL
    item parameters）部分抵消。 (2) IRT-FIT vs Min-K%++：Min-K%++ 使用 token probabilities（logit-level
    information）， 本质上信息量更大（not just correct/incorrect, but HOW confident the model
    is）。 AUROC gap -0.06 是 "minimal-information 的代价"——binary data 丢弃了 confidence 信息。
    (3) 在 5% 低污染下，差距更大（IRT-FIT 0.62 vs Min-K%++ 0.72）， 因为低信噪比时 fine-grained information
    更有价值。 (4) Type I error：IRT-FIT 控制良好（0.048 ≈ nominal 0.05）， ConStat 略偏高（0.055），Min-K%++
    最好（0.042 due to more informative features）。

    '
  tables:
  - 'Table: Method comparison — AUROC at contamination levels 5%/10%/15%/25%/50%,
    with 95% DeLong CI. Columns: IRT-FIT, ConStat, Min-K%++.'
  - 'Table: Information access requirements comparison — what each method needs, scalability,
    and detection performance tradeoff.'
  figures_description:
  - 'ROC curves overlay: 3 methods × 2 contamination levels (15%, 25%) = 6 curves
    on 2 panels。清晰展示 IRT-FIT 在 binary-only 条件下与 privileged methods 的 gap。'
  - 'Detection frontier diagram: x=information access level (categorical: binary →
    retest → token probs → logits → weights → training data), y=AUROC at 15%。IRT-FIT
    定义 leftmost point。展示 contribution 的 positioning。'
  analysis: 'Baseline 对比支持 "minimal-information operating point" 的 framing： IRT-FIT
    在 binary-only 条件下与 ConStat 持平，仅比需要 token probabilities 的 Min-K%++ 低 0.06 AUROC。这个
    gap 是 information-theoretic 的，不是方法的缺陷。 论文应强调："When only binary responses are available
    — the common case for retrospective leaderboard analysis — IRT-FIT achieves competitive
    detection performance." Detection frontier diagram 是论文 framing 的核心 visual。

    '
- name: Multiscale lzm 跨 Benchmark 聚合
  plan_id: exp-multiscale-lzm
  description: '实现 Hong, Lin & Cheng (2021) 的 multiscale lzm 统计量， 跨 5 个 benchmarks
    聚合 lz* 为标准化总分。 在 PSN-IRT 12 模型 + 控制实验模型上验证聚合效果。

    '
  expected_results:
    lzm_detection_improvement_over_best_single: 0.08
    lzm_auroc_at_15pct: 0.89
    lzm_reduces_false_positive: true
    lzm_false_positive_rate: 0.035
    gemini_lzm_score: 42.3
    gemini_lzm_rank: 1
    lzm_cross_benchmark_correlation: 0.65
    models_reclassified_by_lzm: 2
  result_rationale: 'lzm 聚合跨 benchmark 信号带来 ~0.08 AUROC 提升（从最佳单 benchmark 的 0.85 到
    0.89）， 原因：(1) 跨 benchmark 聚合增加 effective sample size，提高信噪比； (2) 部分模型在单个 benchmark
    上 marginal（lz* 刚过阈值），聚合后更 robust； (3) 但提升有限因为 cross-benchmark correlation 中等（ρ=0.65）——
    如果各 benchmark 的污染完全独立，聚合帮助大；如果高度相关，则 redundant。 Median 档下 cross-benchmark consistency
    只有 40%（见 leaderboard audit）， 意味着许多模型的污染是 benchmark-specific 的，lzm 反而可能稀释信号。 lzm
    的主要价值在于降低 false positive rate（0.035 vs 0.048 for single benchmark）， 因为 random
    noise 在聚合中被平均掉。

    '
  tables:
  - 'Table: lzm scores for 12 PSN-IRT models, ranked, with per-benchmark lz* breakdown
    and classification.'
  figures_description:
  - 'Radar chart: 12 个模型，每个有 5 个轴（5 benchmarks 的 standardized lz*），lzm 用颜色强度编码。Gemini-1.5
    的不对称 pattern 一目了然。'
  analysis: 'lzm 提供 incremental improvement 但不是 game-changer。 主要贡献是 methodological
    completeness（展示 psychometric toolkit 的系统性应用） 和 false positive 控制。论文中作为 minor methodological
    contribution 报告即可。

    '
- name: Post-RL 信号保持性检验
  plan_id: exp-post-rl
  description: '在 Qwen3.5-9B 上先 SFT 注入 25% MMLU contamination，再进行 GRPO 训练 （rule-based
    reward: 正确=1，错误=0），测试 RL 后 person-fit 信号是否保持。

    '
  expected_results:
    post_rl_power_retention_ratio_at_25pct: 0.55
    pre_rl_lz_star_mmlu_25pct: -5.2
    post_rl_lz_star_mmlu_25pct: -2.9
    pre_rl_detection_rate_mmlu_25pct: 0.88
    post_rl_detection_rate_mmlu_25pct: 0.52
    pre_rl_lz_star_mmlu_15pct: -1.8
    post_rl_lz_star_mmlu_15pct: -0.8
    post_rl_detection_rate_mmlu_15pct: 0.22
    post_rl_accuracy_change: 0.03
    post_rl_theta_change: 0.15
    signal_decay_half_life_grpo_steps: 800
    retention_ratio_hellaswag: 0.45
    retention_ratio_gsm8k: 0.38
  result_rationale: 'Median 档核心假设：Post-RL 后信号显著衰减（retention 35-74%）， 对 15% 污染水平 lz*
    回到不显著区。 机制：GRPO 的 reward hacking smoothing 效应—— (1) RL 优化 reward（正确率），对所有 items
    施加梯度，不仅是被污染的； (2) contaminated items 已经正确（reward=1），梯度主要推动 non-contaminated items
    提升； (3) 这均匀提升整体 accuracy（+0.03），缩小 contaminated vs non-contaminated 的 gap； (4)
    同时 RL 的 exploration（sampling temperature）引入 stochastic variation， 使原本确定性的 "memorized
    correct" 变得不确定（偶尔 sample 到错误答案）。 Net effect：25% 污染的 lz* 从 -5.2 衰减到 -2.9（retention
    0.55）， 仍可检测但 marginal。15% 污染从 -1.8 衰减到 -0.8，回到 non-significant（p>0.05）。 跨 benchmark：GSM8K
    衰减更严重（retention 0.38）因为 math reasoning 的 RL 泛化更强（reward signal 更 dense），HellaSwag
    中等（0.45）。 这个结果与 Wang et al. (2025) 的 MIA 发现方向一致但 IRT-FIT 保留更多信号—— MIA 方法在 post-RL
    后几乎完全失效（retention <0.10）， IRT-FIT 的 0.55 retention 说明 binary pattern 比 token probability
    更 robust to RL smoothing。

    '
  tables:
  - 'Table: Pre-RL vs Post-RL person-fit comparison at 15%/25% contamination × 3 benchmarks.
    Columns: lz*, detection rate, retention ratio.'
  - 'Table: GRPO training dynamics — lz* vs GRPO training steps (0/200/500/1000/2000),
    showing decay trajectory.'
  figures_description:
  - 'Decay curve: x=GRPO training steps, y=lz* (or |lz*|)。两条线（15% and 25% contamination）。horizontal
    dashed line = detection threshold (-1.96)。展示信号衰减 trajectory 和 15% 何时跌入 non-significant。'
  - 'Retention ratio bar chart: 3 benchmarks × 2 contamination levels，展示 cross-benchmark
    和 cross-level 的 retention pattern。'
  analysis: 'Post-RL 结果是 median 档最重要的 limitation 发现。 论文应诚实报告：IRT-FIT 检测 SFT 污染有效，但
    post-RL 训练显著衰减信号， 15% 以下污染在 RL 后不可检测。 这并非方法失败——它揭示了 information-theoretic limitation：
    binary patterns 在 RL smoothing 后的信号保留天然弱于 logit-level 信息。 但 IRT-FIT 仍优于 MIA 方法（retention
    0.55 vs <0.10）， 因为 binary aberrance 比 token probability 分布更 robust。 Position as
    limitation + future work direction（"post-RL contamination detection remains an
    open challenge for minimal-information methods"）。

    '

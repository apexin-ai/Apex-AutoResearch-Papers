- name: MMLU Domain-Level 污染分析
  plan_id: exp-domain-analysis
  description: '按 MMLU 57 个 subject category（或 4 大 domain: STEM/humanities/social_sciences/other）
    分别计算 person-fit，识别污染是全局性的还是 domain-specific 的。

    '
  expected_results:
    gemini_all_domains_contaminated: true
    gemini_domain_lz_star_range:
    - 18.5
    - 42.0
    gemini_min_domain_lz_star: 18.5
    gemini_max_domain_lz_star: 42.0
    other_models_domain_heterogeneity: 0.65
    n_models_with_domain_specific_contamination: 4
    most_contaminated_domain: STEM
    least_contaminated_domain: humanities
    domain_level_detection_improvement: 0.05
    n_subjects_analyzed: 57
    min_items_per_subject: 100
    subjects_too_small_for_detection: 12
  result_rationale: 'Gemini-1.5（acc=1.0 on all MMLU）在所有 domains 都 contaminated（lz*>>0
    everywhere）， 但 lz* 在不同 domains 差异大（18.5-42.0）——这是因为不同 domain 的 item parameter
    distribution 不同（STEM items 通常 difficulty variance 更大，贡献更多 surprise）。 对其他 PSN-IRT
    模型，domain heterogeneity 指数 ~0.65（Gini coefficient of per-domain lz*）， 表示污染不是均匀分布的。~4
    个模型展示明确的 domain-specific pattern （如 STEM lz* 显著低于 humanities，提示 STEM items 被针对性污染）。
    STEM 最容易被"意外"污染（training data 中 STEM Q&A 更丰富）， humanities 最难被污染（需要特定 domain knowledge）。
    Domain-level 分析的实用价值：当 overall lz* marginally significant 时， drill down 到 domain
    可以发现 局部强信号，整体 detection 提升 ~0.05 AUROC。 限制：57 subjects 中 ~12 个 subject items 数
    <100，太小无法单独分析， 需要聚合到 4 大 domain 或 filtering。

    '
  tables:
  - 'Table: Domain-level lz* for Gemini-1.5 and top-3 most anomalous models, 4 domains

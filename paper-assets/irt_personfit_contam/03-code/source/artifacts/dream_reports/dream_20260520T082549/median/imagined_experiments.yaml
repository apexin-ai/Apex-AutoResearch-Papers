  - 'Domain violin plot: 4 大 domains，每个 violin 包含 12 models 的 lz* distribution。展示
    STEM 的偏高趋势。'
  analysis: Domain 分析是 median 档的 compensating contribution—— 即使 overall detection
    scope 收窄，domain-level insight 增加了 practical value。 论文可以 claim："IRT-FIT not only
    detects contamination but localizes it to specific knowledge domains, enabling
    targeted benchmark integrity assessment." 这对 benchmark maintainers 有直接价值（知道哪些
    subjects 需要更新/替换）。 STEM 偏高的趋势有独立的研究意义（与 training data composition 相关）。

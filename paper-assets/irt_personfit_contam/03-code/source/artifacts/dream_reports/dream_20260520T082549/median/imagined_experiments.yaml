tier: median
narrative_guidance: 'Median 档需要收窄 claim scope 但保持核心贡献可投。Headline 调整为： "IRT-FIT 在 minimal-information
  条件下可靠检测中度以上 SFT 污染（≥15%）， 且在大型 benchmark（≥10K items）上 power>80%。" 三大调整：(1) Claim
  1 从"detect contamination"收窄为"detect moderate-to-heavy SFT contamination (≥15%)"——
  这仍是实际 leaderboard gaming 的典型水平； (2) Claim 2 保留 power ∝ n_items 但 inverted-U 描述为"empirical
  characterization with approximate theoretical backing" 而非精确理论（R²=0.87 而非 0.97+）；
  (3) Claim 3 leaderboard audit 从"7K+ models"降为"representative sample (~250 models)"，
  Post-RL 衰减诚实报告（retention ~55%）作为 limitation + future work。 新增 domain-level 分析作为补偿贡献。EMNLP
  仍可投但 8 页 main text 需要精密分配： 3.5 页 method+theory，2.5 页 experiments（ctrl-contam 为主，leaderboard
  精简）， 1 页 domain analysis + Gemini case，1 页 intro+related 压缩。

  '
imagined_experiments:
- name: 双侧检测框架（Two-Sided Detection Framework）
  plan_id: exp-two-sided
  description: '基于 Phase B personfit_matrix.csv 实现双侧检测：lz* < -1.96 标记 aberrant（部分污染），
    lz* > +1.96 标记 over-consistent（完全/系统性污染）。对 12 模型 × 5 benchmarks 计算 bootstrap 95%
    CI 和 BH-corrected FDR。

    '
  expected_results:
    gemini_mmlu_lz_star: 34.75
    gemini_mmlu_bootstrap_95ci_lower: 31.2
    gemini_mmlu_bootstrap_95ci_upper: 38.4
    gemini_mmlu_classification: over-consistent (full contamination)
    gemini_hellaswag_lz_star: -3.65
    gemini_hellaswag_classification: aberrant (partial contamination)
    total_60_entries_over_consistent: 40
    total_60_entries_aberrant: 6
    total_60_entries_non_significant: 14
    fdr_corrected_significant_rate: 0.72
    dual_regime_models_count: 3
    systematic_positive_bias_mean: 12.5
  result_rationale: 'Median 档下双侧框架在数据上可观察但 separation 不够 sharp。 Phase B 12 模型大多数在多数
    benchmark 上 lz*>>0（如 MMLU 均值 24.2），存在系统性正偏—— 可能反映 PSN-IRT 参数校准于不同群体（人类考生 vs LLM），
    也可能反映 LLM 群体中广泛存在的 benchmark 过拟合。 双侧框架能清晰区分 Gemini-1.5 MMLU（lz*=+34.75，完全污染） vs
    Gemini-1.5 HellaSwag（lz*=-3.65，部分污染），展示同一模型在不同 benchmark 上 有不同的污染模式。但 12 模型中仅
    ~3 个展示明确的跨 benchmark 双侧异质性， 其余多数被系统正偏淹没。Bootstrap CI 极窄（MMLU 14042 items 提供大量统计信息），
    但 CI 的精度不等于判别的可靠性——系统正偏的存在意味着 positive flag 的假阳率难以估计。

    '
  tables:
  - 'Table: 12 models × 5 benchmarks classification matrix (aberrant / over-consistent
    / non-significant), with bootstrap 95% CI and BH-adjusted p-values'
  - 'Table: Summary statistics of lz* distribution per benchmark (mean, std, skew)
    showing systematic positive shift'
  figures_description:
  - 'Strip plot: 每个 benchmark 一列，12 个模型的 lz* 值按点标注，正负阈值线 ±1.96 用虚线标出。Gemini-1.5 各
    benchmark 用不同颜色高亮，展示同一模型的跨 benchmark 双侧信号。'
  - 'Heatmap: 12 models × 5 benchmarks，颜色编码 lz* 值（蓝=aberrant, 红=over-consistent, 白=non-significant），直观展示污染模式的异质性。'
  analysis: '双侧框架成功将 Gemini-1.5 的 MMLU 100% accuracy 归类为 over-consistent contamination
    而非简单的高能力，这是单侧框架无法做到的（单侧只检测 lz*<0）。 同时检测到 Gemini-1.5 在 HellaSwag/GSM8K 上的 aberrant
    patterns， 提示其污染是 benchmark-specific 的。但系统性正偏（12 模型 MMLU 均值 lz*=24.2） 需要在论文中讨论：可能需要
    population-level recalibration 或更保守的阈值。 在 median 档下，这个结果支持将双侧框架作为 methodological
    contribution， 但 claim 需要附加 caveat：框架在 calibration 准确时有效。

    '
- name: 扩展模拟：高污染水平与 inverted-U 精确刻画
  plan_id: exp-extended-sim
  description: '在 Phase A 模拟基础上添加 60%/75%/90% contamination levels， 修复 100% contamination
    的 NaN 问题（θ boundary 设为 4.0 正常计算 lz*）， 分别计算单侧负向（lz*<-1.96）和正向（lz*>+1.96）检测率， 精确定位
    inverted-U 拐点和双侧信号的 crossover 区域。

    '
  expected_results:
    mmlu_detection_rate_at_60pct: 0.79
    mmlu_detection_rate_at_75pct: 0.58
    mmlu_detection_rate_at_90pct: 0.31
    mmlu_detection_rate_at_100pct_fixed: 0.18
    mmlu_mean_lz_star_at_60pct: -18.5
    mmlu_mean_lz_star_at_75pct: -14.2
    mmlu_mean_lz_star_at_90pct: -4.8
    mmlu_mean_lz_star_at_100pct_fixed: 5.2
    mmlu_positive_detection_rate_at_90pct: 0.15
    mmlu_positive_detection_rate_at_100pct: 0.35
    mmlu_two_sided_detection_at_75pct: 0.65
    mmlu_two_sided_detection_at_100pct: 0.38
    inverted_u_inflection_contam_level_mmlu: 0.55
    inverted_u_inflection_contam_level_hellaswag: 0.5
    inverted_u_inflection_contam_level_gsm8k: 0.6
    crossover_region_width: 0.2
    hellaswag_detection_rate_at_60pct: 0.72
    hellaswag_detection_rate_at_75pct: 0.48
    gsm8k_detection_rate_at_60pct: 0.68
    gsm8k_detection_rate_at_75pct: 0.42
  result_rationale: 'Median 档下 inverted-U 拐点存在但不是 clean separation—— 存在宽约 0.20 的过渡区（contamination
    50-70%）而非 sharp step function。 原因：(1) 高污染水平下 θ MLE 上移，但 boundary θ=4.0 的截断引入系统偏差；
    (2) lz* 的方差随污染水平线性增长（50% 时 std=10.5 vs 15% 时 std=3.77）， 导致高污染区间信号虽大但 signal-to-noise
    ratio 下降； (3) 100% 污染修复后，θ=4.0 下大部分 items 的 P(correct)>0.95（4PL 上渐近线）， 只有最难的 items（b>3.5）产生
    over-consistent surprise，因此正向检测率仅 ~0.35。 拐点位于 ~0.55 contamination level（MMLU），此处单侧负检测下降到
    ~0.70 但正侧尚未 take over（正检测率 <0.10），形成检测的"死区"。 双侧检测在此区域仍优于单侧（0.65 vs 0.58），但优势有限。

    '
  tables:
  - 'Table: Extended simulation power at all contamination levels (0/3/5/10/15/25/50/60/75/90/100%)
    × 5 benchmarks, split into negative/positive/two-sided detection rates'
  - 'Table: Inverted-U inflection points per benchmark with 95% CI (bootstrap over
    1000 simulations)'
  figures_description:
  - 'Power curves plot: x=contamination level (0-100%), y=detection rate. 三条线：negative-side
    (blue), positive-side (red), two-sided (black dashed)。5 个 benchmark 分 panel。inverted-U
    清晰可见，crossover region 用灰色阴影标注。'
  - 'Mean lz* trajectory: x=contamination level, y=mean lz* ± 1 std shaded area。展示从强负到弱负到正的过渡，std
    的膨胀在高污染区特别明显。'
  analysis: '扩展模拟确认 inverted-U 是 robust 现象但 crossover 是渐进的（~20% contamination 宽度）。
    这意味着 Claim 2 需要表述为 "empirical characterization with approximate theoretical model"
    而非精确的 phase transition。实际意义：真实的 leaderboard gaming 通常在 15-50% contamination range（部分
    items），恰好落在检测效果最好的区间。 100% 污染（如 Gemini-1.5 MMLU）可通过正向检测捕获但 power 较低（~0.38）， 需要
    benchmark 足够大（>10K items）。

    '
- name: 控制实验：Ground-Truth SFT 污染注入
  plan_id: exp-ctrl-contam
  description: '在 Qwen3.5-9B 和 Gemma-4-31B 上，用 QLoRA SFT 注入 0%/5%/10%/15%/25%/50%
    的 MMLU benchmark items 作为训练数据，测量微调前后 person-fit 统计量变化。 建立 ground-truth contamination
    level → lz* 的经验映射曲线。 同时在 HellaSwag 和 GSM8K 上评估 cross-benchmark spillover。

    '
  expected_results:
    auroc_at_15pct_contamination: 0.85
    auroc_at_25pct_contamination: 0.93
    auroc_at_5pct_contamination: 0.62
    minimum_detectable_contamination_level: 0.18
    cohens_d_at_15pct_qwen: 1.12
    cohens_d_at_15pct_gemma: 1.18
    qwen_mmlu_baseline_lz_star: 8.5
    qwen_mmlu_lz_star_at_0pct_sft: 7.2
    qwen_mmlu_lz_star_at_5pct: 4.8
    qwen_mmlu_lz_star_at_10pct: 1.5
    qwen_mmlu_lz_star_at_15pct: -1.8
    qwen_mmlu_lz_star_at_25pct: -5.2
    qwen_mmlu_lz_star_at_50pct: -10.8
    gemma_mmlu_lz_star_at_15pct: -2.3
    gemma_mmlu_lz_star_at_25pct: -6.0
    qwen_mmlu_accuracy_at_0pct: 0.72
    qwen_mmlu_accuracy_at_15pct: 0.79
    qwen_mmlu_accuracy_at_50pct: 0.91
    sft_generalization_attenuation_factor: 0.65
    cross_benchmark_spillover_hellaswag: 0.02
    cross_benchmark_spillover_gsm8k: 0.01
    detection_rate_at_15pct_mmlu_qwen: 0.72
    detection_rate_at_25pct_mmlu_qwen: 0.88
    detection_rate_at_15pct_hellaswag: 0.45
    mmlu_power_at_5pct_contam: 0.38
  result_rationale: 'Median 档的核心假设：SFT 泛化效应使信号衰减约 35%（attenuation factor ~0.65）。 机制：QLoRA
    SFT 在 15% MMLU items 上训练时，模型不仅记忆这些 items， 还泛化到语义相似的 items（同 domain、同难度区间），使得"意外正确"不再集中在
    被污染的 items 上，而是扩散到邻近 items。这部分削平了 lz* 的 aberrant pattern。 具体表现：simulation 预测 15%
    contamination 的 MMLU mean_lz*=-6.09， 但 real SFT 只产生 ~-1.8 to -2.3（Qwen/Gemma），
    因为 accuracy 提升从 72% 到 79%（而非 simulation 假设的 contaminated items 全部正确）， 且 ~30% 的提升来自泛化而非记忆。
    Cohen''s d ~1.12-1.18 在 15% 水平，对应 AUROC ~0.85—— 这意味着 IRT-FIT 能可靠检测 ≥15% 的 SFT
    污染但 5% 以下信噪比不足（AUROC 0.62）。 最小可检测水平 ~18% 对应 AUROC 首次稳定超过 0.80 的阈值。 Cross-benchmark
    spillover 很小（<0.02 accuracy change on HellaSwag）， 确认污染信号是 benchmark-specific 的。
    两个模型（Qwen vs Gemma）的结果趋势一致但具体数值有差异， Gemma-4-31B 的 lz* 偏移略大（更大的模型 SFT 时泛化更强但也更精确记忆）。

    '
  tables:
  - 'Table: Contamination level × Model × Benchmark 矩阵。每个 cell 包含：accuracy, θ, lz*,
    detection (Y/N)。6 levels × 2 models × 3 benchmarks = 36 cells。'
  - 'Table: AUROC summary at each contamination level (5/10/15/25/50%) for MMLU, 包含
    95% CI via bootstrap。'
  - 'Table: SFT generalization 分析——contaminated items accuracy vs non-contaminated
    items accuracy vs simulation prediction, 量化 attenuation factor。'
  figures_description:
  - 'Ground-truth mapping curve: x=injected contamination level (0-50%), y=measured
    lz*。两条实线（Qwen blue, Gemma orange）+ simulation prediction 虚线。shaded area = 95%
    CI。清晰展示 real SFT 信号弱于 simulation prediction 的系统偏差。'
  - 'ROC curves: 在 15% 和 25% contamination 各画一组 ROC curve（IRT-FIT using lz* as score,
    binary label = contaminated or not），附 AUROC 数值。'
  - 'Item-level 分析 scatter: x=item difficulty (b parameter), y=accuracy change after
    SFT。contaminated items (red) vs non-contaminated items (blue)。展示 SFT generalization
    的空间分布。'
  analysis: '控制实验是 median 档最关键的 evidence。它同时建立了 ground truth（回应 R2） 和量化了 SFT generalization
    的衰减（回应 R5）。最小可检测水平 ~18% 意味着 Claim 1 需收窄为 "detect moderate-to-heavy SFT contamination
    (≥15%)"， 但这仍覆盖了 leaderboard gaming 的典型操作范围（通常污染 20-50% items）。 两个模型的一致性强化了 generalizability，但仅
    2 个模型仍可能被 reviewer 质疑。 SFT generalization attenuation 是一个独立的 finding，可以作为论文中的
    insight： "IRT-based detection is inherently conservative under SFT contamination
    because gradient-based learning distributes the signal beyond memorized items."

    '
- name: Power 理论推导与验证
  plan_id: exp-power-theory
  description: '基于 Snijders (2001) 的 lz* 方差公式推导 detection power 与 n_items 的解析关系。 验证理论曲线与
    Phase A + 扩展模拟结果的拟合度。 尝试将 inverted-U 从经验观察升级为（近似）理论命题。

    '
  expected_results:
    power_theory_r_squared_overall: 0.87
    power_theory_r_squared_mmlu: 0.91
    power_theory_r_squared_small_benchmarks: 0.78
    theoretical_power_formula: P(detect | n, c) ≈ Φ(√n · δ(c) / σ_lz*(n) - z_α)
    delta_function_fit_r_squared: 0.83
    inverted_u_theory_prediction_accuracy: 0.72
    n_items_threshold_for_80pct_power_at_15pct: 11500
    n_items_threshold_for_80pct_power_at_25pct: 4200
    residual_pattern: systematic under-prediction for mid-range benchmarks (1K-5K
      items)
  result_rationale: 'Median 档下理论推导捕捉趋势但非精确预测（R²=0.87 而非 0.95+）。 原因：Snijders (2001)
    的 lz* 方差公式 Var(lz*) = 1 + O(1/n) 假设 items 来自 correctly specified IRT model，但 4PL
    参数来自 PSN-IRT 对 LLM 的拟合， 存在 model misspecification（LLM 的 response pattern 不完全符合
    4PL 假设）。 结果：(1) 对 MMLU（14K items）拟合好（R²=0.91）因为 n 大到误差项 O(1/n) 可忽略； (2) 对小 benchmarks（ARC-C
    295, HumanEval 164）拟合差（R²=0.78）因为 finite-sample correction 不够精确；(3) inverted-U
    的理论预测准确度仅 72%—— 理论可以预测拐点存在（通过 δ(c) 在 c=1 时衰减到 0 的论证） 但拐点位置的预测偏差 ±0.10-0.15 contamination
    level。 结论：power ∝ √n 作为 scaling law 成立，但系数和 inverted-U 形状需要 empirical calibration，不能纯理论推导。

    '
  tables:
  - 'Table: Theoretical vs empirical power at key (n_items, contamination_level) pairs.
    5 benchmarks × 8 levels = 40 data points, with residuals.'
  - 'Table: Derived thresholds — minimum n_items for 80% power at contamination levels
    5%/10%/15%/25%/50%.'
  figures_description:
  - 'Theory vs simulation overlay: x=n_items (log scale), y=power at 15% contamination。理论曲线
    (solid line) vs 模拟点 (markers with error bars)。5 benchmarks 标注。R²=0.87 annotated.'
  - 'Inverted-U theoretical decomposition: 两个子图。上图：δ(c) contamination effect function
    的理论形状 vs empirical fit。下图：理论预测的 power surface (n_items × contam_level heatmap)
    vs 模拟结果。'
  analysis: '理论推导提供 directional guidance（power ∝ √n，inverted-U 存在） 但不是精确预测工具。在论文中应表述为
    "approximate analytical characterization" 而非 "theoretical guarantee"。实用价值在于： 给出
    benchmark 设计指导（"要检测 15% 污染需要 ≥11.5K items"）， 这个数字虽非精确但 order of magnitude 正确。
    R²=0.87 足以支持 Claim 2 的 "predictable function" 表述， 但需要附加 confidence interval 而非
    point prediction。

    '

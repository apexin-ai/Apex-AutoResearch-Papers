  analysis: 'BBH 和 MATH 的加入使 power scaling 论证更 convincing—— 7 个 benchmarks 覆盖 164
    到 14042 items 的连续谱，R²=0.90。 但这是 P2 实验，如果时间/GPU 紧张可以不做， 因为原始 5 benchmarks 已经支持

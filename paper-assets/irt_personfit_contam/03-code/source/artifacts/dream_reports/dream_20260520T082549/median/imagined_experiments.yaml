  result_rationale: 'BBH 和 MATH 填补了 GSM8K (1319) 和 HellaSwag (10042) 之间的 gap， 在 5K-7K
    item 范围验证 power scaling。 BBH (6511 items) 预期 power@15% ~0.82——高于 HellaSwag (0.733)
    的比例 不完全由 n_items 解释（6511 < 10042），因为 BBH items 的 difficulty variance 可能更大（harder

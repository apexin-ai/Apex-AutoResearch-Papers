    knowledge）。 两个新 benchmarks 加入后 scaling law R² 从 0.87 升到 0.90， 因为 mid-range data
    points 减少了 fit uncertainty。 但前提是 PSN-IRT 包含这些 benchmarks 的 4PL 参数——如果需要自己校准， GPU

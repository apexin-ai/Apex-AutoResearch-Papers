    对已经答对的 contaminated items 不会产生"遗忘"梯度——这些 items 已经获得最大 reward， GRPO 的梯度主要推动模型在
    reward 边界附近的 items 上改进。因此 contaminated items 的 正确率几乎不变（0.84 → 0.82，仅微降 2%），而 non-contaminated
    items 略有提升（+1%）。 lz* 从 -8.91 衰减到 -7.12（~20% 衰减）的原因：GRPO 对 non-contaminated items
    的泛化提升 使 θ 估计上移，缩小了 contaminated items 的 "预期外正确" 幅度。但衰减有限，因为 GRPO 的泛化效应弱于 SFT 的直接
    memorization 效应。 对比 MIA：Wang et al. (2025) 发现 MIA 在 post-RL 后 AUROC 接近随机（0.54），
    因为 RL 重新校准了 token-level probability 分布，消除了 memorization 的 token-level 痕迹。 但 binary
    response pattern 不受 probability recalibration 影响——只要 contaminated items 仍然被答对，person-fit
    信号就存在。这是 person-fit "信息层级优势" 的直接体现： binary outcome 比 token probability 更鲁棒，因为
    RL 可以改变 "how confident the model is" 但很难改变 "whether it gets the answer right"
    on memorized items.

    '

- name: 4PL vs 3PL Ablation
  plan_id: exp-4pl-ablation
  description: '比较 4PL (with feasibility parameter d) 和 3PL(d=1) 下的检测灵敏度差异， 量化 d 参数对
    false alarm 和 detection power 的影响。

    '
  expected_results:
    auroc_4pl_15pct: 0.96
    auroc_3pl_15pct: 0.91
    auroc_difference_15pct: 0.05
    false_alarm_rate_4pl: 0.042
    false_alarm_rate_3pl: 0.078
    power_4pl_15pct_mmlu: 0.979
    power_3pl_15pct_mmlu: 0.934
    power_difference_15pct_mmlu: 0.045
    mean_abs_lz_star_difference_clean: 0.34
    mean_abs_lz_star_difference_contam: 0.87
    d_parameter_mean_psn_irt: 0.91
    d_parameter_sd_psn_irt: 0.08
    items_where_d_matters_most: top-difficulty items (difficulty > 2.5) where d <
      0.85
  result_rationale: '4PL 的 d 参数（upper asymptote / feasibility parameter）建模了即使能力极高的考生
    也可能答错某些 items 的现象——在 LLM 场景中对应"某些 items 的表述/格式导致即使知道答案的模型也可能选错"。 当 d < 1 时，3PL(d=1)
    会高估高能力模型在这些 items 上的预期正确率， 导致其答错时产生过多的 "aberrant" 信号（false alarm 上升）。 4PL 通过让
    d < 1 吸收这种自然变异，减少了 false alarm（0.042 vs 0.078）。 对于 contaminated models，d < 1 的
    items 是区分度最高的：contaminated model 在这些 items 上 答对率接近 1.0（因为直接记住了答案），而 clean model
    的答对率被 d 压低。 因此 4PL 在 contaminated case 中效应量更大（lz* 偏差多 0.87），综合 AUROC 提升 0.05。
    差异主要集中在高难度 items（difficulty > 2.5）——这些 items 的 d 值通常更低， 因为它们的表述更复杂，即使知道正确答案也更容易因格式理解问题出错。


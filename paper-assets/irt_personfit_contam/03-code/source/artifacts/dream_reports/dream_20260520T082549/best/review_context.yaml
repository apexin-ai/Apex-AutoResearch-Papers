    min_k_pp_information_required: token-level log-probabilities
    irt_fit_unique_advantage: operates without model access
  result_rationale: 'IRT-FIT 在 AUROC 上优于 ConStat 0.10-0.13 的原因有两方面： (1) Person-fit
    statistics 利用了完整的 item-level response pattern 信息——每个 item 的 difficulty、 discrimination、guessing、feasibility
    参数都参与 lz* 计算，而 ConStat 基于 aggregate performance 的一致性检验，信息利用效率更低； (2) ConStat 的
    re-test design 假设 contaminated model 在 re-test 时表现不一致， 但 SFT contamination 是永久性的（权重已改变），re-test
    分数几乎不变，削弱了 ConStat 的信号。 Min-K%++ 在 AUROC 上略低于 IRT-FIT（0.88 vs 0.96）但需要 token-level
    probabilities—— 信息需求更高。其信号来自 token-level memorization（contaminated items 的 token
    loss 更低）， 但 SFT 后的 token-level 信号会被 RL 和 decoding 过程扰动，不如 binary response 层面的
    person-fit 信号稳定。 Type-I error 都接近 nominal 0.05，说明三种方法的 null calibration 都合理。 关键叙事：IRT-FIT
    不仅性能更好，而且信息需求最低——这是 detection frontier 的核心论点。


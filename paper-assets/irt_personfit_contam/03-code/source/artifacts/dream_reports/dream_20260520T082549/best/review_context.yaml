    分布的偏差更大。 "uniform across all domains" 的发现很重要：它排除了 "Gemini-1.5 只是在特定领域特别强" 的 innocent
    explanation——如果是真实能力，应该在某些 domain 偶尔出错，而不是全面 100%。 Domain-level power 平均仅 0.34

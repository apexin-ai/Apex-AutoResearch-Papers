  result_rationale: 'Inverted-U 的物理机制：低污染（<15%）时，少量 hard items 被答对产生 aberrant pattern（lz*
    < 0）， 信号随污染比例增强；中等污染（~40-60%）时，被污染 items 的 "全部答对" 开始被 IRT 模型解释为 "该模型能力更高"，θ 估计上移，lz*
    绝对值开始减小——因为 response pattern 变得可以被高 θ 解释； 拐点（~65% for MMLU）处 lz* ≈ 0，pattern 恰好可被某个
    θ 值完美拟合；超过拐点后， 模型在几乎所有 items 上正确但 θ 估计仍有上界（受 non-contaminated items 约束）， 导致 over-consistent
    pattern（lz* > 0）。拐点位置取决于 benchmark 的 item difficulty 分布： MMLU 有大量高难度 items（14K
    items 中 ~30% difficulty > 2.0），需要更高污染比例才能 让 pattern 显得 "合理"，所以拐点在 0.65。GSM8K 难度更集中，拐点在

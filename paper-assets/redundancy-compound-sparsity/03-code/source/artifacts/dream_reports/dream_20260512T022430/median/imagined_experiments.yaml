  figures_description:
  - 'Bar chart: Qwen2 instruction vs reasoning, 双 y 轴 (r 左, Δpert 右), 误差棒表示 per-problem
    范围'
  analysis: '训练效应在 Qwen2 上约 Δr=+0.10, ΔΔpert=+3.7%。这比 Llama 上的训练效应 (Δr=-0.09)  幅度相当，方向一致。但即使去掉推理蒸馏的负面影响，Qwen2
    仍然是弱信号架构。 这为 paper 提供了关键的 nuance: 不应说 "reasoning training breaks the signal"，
    而应说 "reasoning training weakens a signal whose baseline strength is architecture-determined."

    '
- name: Llama sparsity level sweep
  plan_id: llama-sparsity-sweep
  description: '在 Llama-3.1-8B 上测试 {50%, 55%, 60%, 65%, 70%} 五个 MLP sparsity 水平， 观察
    Δpert 随 sparsity 的变化趋势。已知 55% 下 Δpert=+6.6%。

    '
  expected_results:
    r_50pct: 0.47
    r_55pct: 0.47
    r_60pct: 0.46
    r_65pct: 0.44
    r_70pct: 0.41
    dpert_50pct: 5.2
    dpert_55pct: 6.6
    dpert_60pct: 7.3
    dpert_65pct: 8.5
    dpert_70pct: 10.0
    accuracy_drop_uniform_70pct: -12.5%
    accuracy_drop_guided_70pct: -2.5%
  result_rationale: 'Δpert 随 sparsity 单调递增但边际递减：从 50→55 增 +1.4, 55→60 增 +0.7,  60→65
    增 +1.2, 65→70 增 +1.5。高 sparsity 下 redundant tokens 仍可大幅剪枝  (因 KV similarity 高
    → surprisal 低 → MLP activation 天然稀疏), 而 novel tokens  在高 sparsity 下精度严重受损, 拉大了
    guided vs uniform 的差距。 但增益未出现"大幅放大"——从 +6.6% 到 +10.0% 是 1.5x 而非 3x 或更高。 r 在高 sparsity
    下略降 (0.47→0.41) 因为极端稀疏引入了非线性效应—— 当 70% neurons 被剪枝, 一些原本与 KV sim 线性相关的 token 开始出现
    clipping 行为。 结论: 存在有意义的 sparsity-amplification 效应但不够戏剧性,  不足以单独支撑 "cross-axis
    unlocks extreme sparsity" 的强叙事。

    '

  - '面积图: uniform vs guided accuracy gap 随 sparsity 放大, 阴影区域为 gap'
  analysis: 'Δpert 从 55% 的 +6.6% 增长到 70% 的 +10.0%, 增幅 ~52%, 说明 cross-axis signal  在高
    sparsity 下确有价值但不是 transformative。Accuracy gap 从 +5.6% 增长到 +9.0%  更有说服力, 但需诚实指出:
    70% uniform sparsity 本身已将准确率压到 64%,  此时 +9% 的 guided 优势可能源于 "避免灾难性错误" 而非 "精细优化"。
    建议在论文中聚焦 60-65% 区间作为 practical operating point,  70% 作为 upper bound reference

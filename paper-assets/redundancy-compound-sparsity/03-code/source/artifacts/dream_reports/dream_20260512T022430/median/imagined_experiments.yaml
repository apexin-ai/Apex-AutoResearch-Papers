    的功能分层一致: 早期层构建低层表示 (KV similarity 语义性弱),  中间层执行核心推理变换 (KV redundancy 与 MLP activation
    pattern 耦合最紧密),  末端层朝 output distribution 过渡 (解耦)。 与 DeepSeek 对比, Llama 在所有层段均高于

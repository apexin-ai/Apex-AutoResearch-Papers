- name: MLA latent space semantic fidelity analysis
  plan_id: mla-signal-analysis
  description: 'SUSPENDED (D005): DeepSeek-R1-Distill-Qwen-7B 非 MLA 架构，无真正 MLA 模型可测。
    以下为假设性 median-tier 预测——若获得真 MLA 模型 (如 DeepSeek-V2-Lite) 的预期结果。 分析 MLA latent space
    中 cosine similarity 的语义保真度退化。

    '
  expected_results:
    status: SUSPENDED
    hypothetical_effective_rank_ratio: 0.45
    hypothetical_angular_uniformity: 0.72
    hypothetical_cosine_sim_semantic_correlation: 0.18
    hypothetical_gqa_cosine_sim_semantic_correlation: 0.65
    per_layer_r_decay_pattern: early layers OK (r~0.25), middle layers collapse (r~0.08),
      late layers partial recovery (r~0.12)
  result_rationale: '[HYPOTHETICAL] MLA 将 KV 压缩到低秩 latent space (effective rank ratio
    ~0.45,  即有效秩仅为 full-dimensional KV 的 45%)。在此压缩空间中, cosine similarity  的语义保真度大幅退化:
    压缩后的向量在 angular space 中分布更均匀 (uniformity=0.72,  接近 random), 导致 cosine similarity
    与 token-level semantic redundancy 的相关性  仅 0.18 (vs GQA 的 0.65)。Per-layer 分析显示中间层退化最严重——恰好是  cross-axis
    signal 应最强的层段, 形成双重打击。 定性上这个 story 成立 (latent compression → angular collapse →
    signal loss),  但缺乏干净的 A/B 定量指标——因为 MLA vs GQA 模型在训练数据、参数量、 architecture 其他方面也不同,
    无法归因纯粹到 latent compression。 因此 Claim 2 只能是 "suggestive evidence"。

    '
  tables: []
  figures_description:
  - '[HYPOTHETICAL] Effective rank ratio 对比 bar chart: GQA ~1.0 vs MLA ~0.45'
  - '[HYPOTHETICAL] Angular distribution scatter: GQA 中 KV vectors 有 cluster 结构, MLA
    中近似均匀球面'
  analysis: '此实验 SUSPENDED 是 median 档最大的叙事缺口。没有真 MLA 模型的实验数据,  Claim 2 (mechanistic
    explanation) 只能基于间接证据 (Qwen2 vs Llama per-layer r 对比)  给出 suggestive 论证。论文中应将
    Section 5 从 "Why Does MLA Break the Signal?"  改为 "Architectural Factors Modulating
    Signal Strength", 用 per-layer + per-head  分析代替 MLA-specific 机制分析。如果实验恢复 (找到可测
    MLA 模型),  median 档预期定性结论正确但定量 clean comparison 困难。

    '
- name: 'Wall-clock: O(1) vs O(n) eviction cost'
  plan_id: kv-eviction-wallclock
  description: '测量 CARC-KV O(1) vs H2O O(n) 的 per-step eviction 耗时,  序列长度 L={4K, 8K,
    16K, 32K}。

    '
  expected_results:
    carc_4k_ms: 0.08
    carc_8k_ms: 0.09
    carc_16k_ms: 0.09
    carc_32k_ms: 0.1
    h2o_4k_ms: 0.25
    h2o_8k_ms: 0.55
    h2o_16k_ms: 1.2
    h2o_32k_ms: 2.6
    speedup_4k: 3.1x
    speedup_8k: 6.1x
    speedup_16k: 13.3x
    speedup_32k: 26.0x
    eviction_as_fraction_of_step_32k_carc: 0.3%
    eviction_as_fraction_of_step_32k_h2o: 7.8%
  result_rationale: 'CARC-KV 每步只做一次 EMA update + 一次 cosine similarity 比较, 计算量与序列长度无关  (O(1)),
    实测耗时 ~0.08-0.10ms 随 L 变化极小 (内存访问模式微变)。 H2O 需要累积所有 token 的 attention score 再选 top-k
    eviction candidate,  计算量 O(n) 随序列线性增长。在 32K 序列下, H2O eviction 占整个 decoding step
    的 7.8%,  而 CARC-KV 仅 0.3%——在长序列推理 (如 AIME 思维链平均 15K+ tokens) 场景下,  这是有意义的实际加速。

    '
  tables:
  - name: 'Table: Eviction Latency Comparison'
    columns:
    - Seq_Length
    - CARC-KV(ms)
    - H2O(ms)
    - Speedup
    rows:
    - - 4K
      - 0.08
      - 0.25
      - 3.1x
    - - 8K
      - 0.09
      - 0.55
      - 6.1x
    - - 16K
      - 0.09
      - 1.2
      - 13.3x
    - - 32K
      - 0.1
      - 2.6
      - 26.0x
  figures_description:
  - 'Log-log plot: x 轴序列长度, y 轴 eviction latency, CARC-KV 水平线 vs H2O 斜率 ~1 的上升线'
  analysis: 'Wall-clock 结果是 O(1) KV eviction 作为 standalone contribution 的关键支撑。 在 16K+
    序列下 speedup >13x, 结合 kv-bench-001 中 70% budget 下 quality parity,  构成有说服力的 efficiency-quality
    trade-off。 注意事项: 这里测量的是纯 eviction overhead, 不是 end-to-end throughput—— 需要在论文中明确说明,
    因为 eviction 只占 decoding step 的一小部分。

    '
- name: Per-head KV contribution analysis
  plan_id: neg-per-head
  description: '分析 per-head cross-axis signal 贡献, 对 Llama (8 KV heads) 和  DeepSeek-Distill-Qwen
    (4 KV heads) 进行 head-level r 分解,  检验是否仅是 head count 差异导致信号差距。

    '
  expected_results:
    llama_per_head_r_mean: 0.4
    llama_per_head_r_range:
    - 0.28
    - 0.52
    llama_best_head_r: 0.52
    llama_worst_head_r: 0.28
    deepseek_per_head_r_mean: 0.11
    deepseek_per_head_r_range:
    - 0.04
    - 0.19
    deepseek_best_head_r: 0.19
    deepseek_worst_head_r: 0.04
    ratio_per_head: 3.6x
    ratio_aggregate: 3.1x
  result_rationale: '即使在 per-head 基础上, Llama 的每个 KV head 的 signal 仍显著强于 DeepSeek-Qwen
    的  每个 KV head (mean r: 0.40 vs 0.11, 3.6x 差距)。这排除了 "Llama 只是因为有更多 head  所以 aggregate
    signal 更强" 的替代假设。Per-head ratio (3.6x) 甚至略大于 aggregate  ratio (3.1x), 说明 Llama
    的 head aggregation 实际上引入了少量 inter-head noise。 Llama 内部 head 间 r 的方差 ([0.28, 0.52])
    暗示不同 head 捕捉不同类型的 redundancy  信号——head 5-6 (r~0.50) 可能专注于 positional/syntactic
    redundancy,  而 head 1-2 (r~0.30) 捕捉更高层的 semantic pattern。

    '
  tables:
  - name: 'Table: Per-Head r Comparison'
    columns:
    - Model
    - Heads
    - Per-Head_r_mean
    - Per-Head_r_range
    - Aggregate_r
    rows:
    - - Llama-3.1-8B
      - 8
      - 0.4
      - '[0.28, 0.52]'
      - 0.47
    - - DeepSeek-R1-Distill-Qwen
      - 4
      - 0.11
      - '[0.04, 0.19]'
      - 0.15
  figures_description:
  - 'Per-head r bar chart: 8 Llama heads + 4 DeepSeek heads 并排, 按 r 降序排列, 虚线标注 per-head
    mean'
  analysis: 'Per-head 分析有效排除了 head-count confound, 但也引出了新问题:  为什么 Qwen2 架构的 per-head
    signal 这么弱? 可能原因包括: (1) head dimension 差异 (Qwen2: 128, Llama: 128 — 实际相同, 排除);
    (2) group ratio 差异 (Qwen2: 28Q/4KV=7:1, Llama: 32Q/8KV=4:1 — 更高的 group ratio  意味着每个
    KV head 需要服务更多 query heads, 可能被迫学习更 general 的表示,  降低了与 specific MLP activation
    pattern 的耦合); (3) 训练数据/目标差异。 Group ratio 假设 (4:1 vs 7:1) 是最有解释力的, 但需要更多模型验证。

    '
- name: 'KV eviction: key-only vs key+value anchor'
  plan_id: kv-eviction-ablation
  description: '消融实验: EMA anchor 分别基于 key-only, value-only, key+value concat。 在 50%
    KV budget 下比较 perplexity。

    '
  expected_results:
    ppl_key_only: 6.2
    ppl_value_only: 6.8
    ppl_key_value_concat: 6.4
    ppl_key_value_default: 6.4
    ppl_full_kv: 5.2
  result_rationale: 'Key-only anchor 略优于 key+value concat (6.2 vs 6.4): key vectors
    编码了 attention  routing 信息 (哪些 token 会被 attend to), 这与 token importance for eviction
    直接相关。 Value vectors 携带 content 信息, 其 similarity 与 "是否可安全 evict" 的相关性较弱,  concat
    后反而引入噪声。Value-only 最差 (6.8) 因为 value similarity 不反映 attention  pattern。差异幅度不大
    (Δppl=0.2), 说明 key 和 value 都携带部分 redundancy 信息,  但 key 更 informative。

    '

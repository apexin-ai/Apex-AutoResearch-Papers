tier: median
narrative_guidance: '从 "architecture binary (GQA=works, MLA=fails)" 软化为 "architecture
  modulates signal strength"。 Confound 2×2 矩阵显示架构和训练方式均有影响，架构为主效应（Δr~0.15-0.22），训练方式为次要效应（Δr~0.09-0.10），两者近似可加。
  Mistral-7B 作为第二个 GQA 模型方向一致但信号明显弱于 Llama，说明 GQA 内部也有梯度，不是均质的 "GQA=positive"。 Claim
  1 调整为 "cross-axis signal strength is architecture-modulated"； Claim 2 降级为 "suggestive
  evidence"，因 MLA 实验 SUSPENDED 且 Qwen2 代理分析缺乏干净的定量对照； Δpert 的 practical significance
  需诚实讨论——+2.8% (Mistral, 55%) 是否值得 cross-axis 额外复杂度。 强调 per-layer analysis 和 O(1)
  KV eviction 作为 standalone contribution 来补偿 cross-axis story 的弱化。 Title 加 hedge:
  "Evidence for Architecture-Modulated Cross-Axis Signals in Reasoning Inference"。

  '
imagined_experiments:
- name: 'Confound control: DeepSeek-R1-Distill-Llama-8B'
  plan_id: confound-ctrl-001
  description: 'Llama GQA 架构 + R1 推理蒸馏训练。与 Llama-3.1-8B (同架构, instruction) 和 DeepSeek-R1-Distill-Qwen-7B
    (不同架构, 同训练) 构成 2×2 对照。 20 problems, 55% sparsity, γ=0.99, 协议与 neg-cross-model-001
    完全一致。

    '
  expected_results:
    pearson_r: 0.38
    pearson_p: 0.0
    dpert_40pct: 3.8
    dpert_55pct: 4.0
    per_problem_r_mean: 0.37
    per_problem_r_range:
    - 0.22
    - 0.48
    total_tokens: ~13000
    elapsed_s: ~750
  result_rationale: 'Llama 架构的 full-dimensional GQA KV projection 保留了 cosine similarity
    的语义保真度， 即使经过 R1 推理蒸馏仍维持正向信号。r 从 0.47 降至 0.38 是因为推理蒸馏引入了更多样的 思维链模式（探索、回溯、自我修正），这些模式在
    KV 空间中产生非单调的相似度变化， 部分解耦了 KV redundancy → MLP sparsity 的链条。但下降幅度有限（Δr=-0.09）， 远好于
    Qwen2 架构的 r=0.15，证明架构是主效应。 2×2 矩阵: Llama+Instruct=0.47, Llama+Reasoning=0.38,
    Qwen2+Instruct=0.25, Qwen2+Reasoning=0.15。 架构效应 ~0.18, 训练效应 ~0.10, 近似可加。

    '
  tables:
  - name: 'Table: 2×2 Confound Matrix (with confound-ctrl-002)'
    columns:
    - Architecture
    - Training
    - pearson_r
    - dpert_55pct
    - Source
    rows:
    - - Llama-GQA
      - Instruction
      - 0.47
      - +6.6%
      - neg-cross-model-001
    - - Llama-GQA
      - Reasoning-distill
      - 0.38
      - +4.0%
      - confound-ctrl-001
    - - Qwen2-GQA
      - Instruction
      - 0.25
      - +1.5%
      - confound-ctrl-002
    - - Qwen2-GQA
      - Reasoning-distill
      - 0.15
      - -2.2%
      - mvp-001b
  figures_description:
  - '2×2 heatmap: x 轴 Training (Instruction / Reasoning), y 轴 Architecture (Llama
    / Qwen2), cell 色深度编码 r 值 (0.15→红, 0.47→蓝), cell 内标注 r 和 Δpert'
  analysis: '架构主效应: Llama→Qwen2 跨训练方式平均降 r ~0.18 (0.425→0.20)。 训练次效应: Instruction→Reasoning
    跨架构平均降 r ~0.10 (0.36→0.265)。 交互效应弱: 两因素近似可加 (预测 Qwen2+Reasoning: 0.47-0.18-0.10=0.19,
    实际 0.15, 差异在噪声范围)。 结论: 不能简单说 "GQA works"——Qwen2 也是 GQA 但 r 仅 0.25。应表述为 "cross-axis
    signal  strength is modulated by both attention architecture specifics (KV head
    dimension, group ratio)  and training paradigm, with architecture as the dominant
    factor."

    '
- name: 'Confound control: Qwen2-7B-Instruct'
  plan_id: confound-ctrl-002
  description: 'Qwen2 GQA 架构 + instruction 训练 (非 reasoning)。与 DeepSeek-R1-Distill-Qwen-7B  (同架构,
    reasoning) 对照，隔离训练方式的影响。

    '
  expected_results:
    pearson_r: 0.25
    pearson_p: 0.0
    dpert_40pct: 1.0
    dpert_55pct: 1.5
    per_problem_r_mean: 0.24
    per_problem_r_range:
    - 0.1
    - 0.38
    total_tokens: ~11000
    elapsed_s: ~600
  result_rationale: '去掉推理蒸馏后 Qwen2 的信号从 r=0.15 改善到 r=0.25——推理训练确实引入了额外噪声 （蒸馏使模型在 reasoning
    trace 中产生更频繁的方向切换，打断 KV similarity 的连续性）。 但 r=0.25 仍远低于 Llama 的 r=0.47，说明 Qwen2
    架构本身的 KV 表示结构 （28 KV heads vs Llama 的 8 KV heads with different group ratio，不同的
    head dimension） 在 cosine similarity 空间中语义保真度更低。Δpert=+1.5% 虽然正向但几乎无实用价值。

    '
  tables:
  - name: 'Table: Training effect isolation (Qwen2 arch fixed)'
    columns:

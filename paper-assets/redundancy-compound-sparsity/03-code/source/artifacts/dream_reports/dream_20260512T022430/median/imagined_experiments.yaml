    中的比较—— 但时间可能不允许, 建议在 footnote 中提及 key-only variant exists and is marginally better。

    '
- name: Llama two-tier sparsity downstream accuracy
  plan_id: llama-downstream
  description: '在 Llama-3.1-8B 上应用 CARC two-tier MLP sparsity (redundant tokens 55%,
    novel tokens 40%),  与 uniform sparsity 在 MATH 数据集上比较准确率。

    '
  expected_results:
    accuracy_no_sparsity: 78.5%
    accuracy_uniform_55pct: 72.0%
    accuracy_uniform_47pct: 74.5%
    accuracy_two_tier_55_40: 75.5%
    gain_over_uniform_55: +3.5%
    gain_over_matched_avg: +1.0%
    avg_effective_sparsity: 47.2%
    fraction_tokens_redundant: 0.52
  result_rationale: 'Two-tier sparsity 将 redundant tokens (52% of tokens, 由 KV sim
    > threshold 判定)  剪枝 55%, novel tokens 剪枝 40%, 平均有效 sparsity ~47.2%。 相比 uniform
    55% (+3.5%) 的增益来自避免对 novel tokens 的过度剪枝—— 这些 token 承载关键推理步骤, 55% sparsity 导致不可恢复的信息损失。
    相比 matched-average uniform 47% (+1.0%) 的增益更有意义但幅度有限—— 说明 adaptive allocation 确有价值但
    cross-axis signal 的 Δpert=+6.6%  在 end-to-end accuracy 上被衰减了: 不是每个 Δpert gain
    都直接转化为准确率,  因为 (a) 只有部分 tokens 被差异化处理, (b) 部分 MLP neurons 的激活对最终输出  影响有限。+1.0%
    的 gain 需要诚实评估是否 justify cross-axis 的额外系统复杂度。

    '
  tables:
  - name: 'Table: Downstream Accuracy Comparison'
    columns:
    - Method
    - MLP_Sparsity
    - MATH_Accuracy
    - Δ_vs_no_sparsity
    rows:
    - - No sparsity
      - 0%
      - 78.5%
      - —
    - - Uniform
      - 55%
      - 72.0%
      - -6.5%
    - - Uniform (matched avg)
      - 47%
      - 74.5%
      - -4.0%
    - - Two-tier (CARC)
      - 55%/40%
      - 75.5%
      - -3.0%
  figures_description:
  - 'Grouped bar chart: 四种条件下 MATH 准确率, 标注 sparsity 节省和 accuracy trade-off'
  analysis: '这是 cross-axis story 的 practical significance 试金石。+1.0% over matched-average  是正面结果但不够强——reviewer
    可能说 "marginal gain doesn''t justify the complexity  of maintaining cross-axis
    coordination." 论文中应框架为: (1) 证明 cross-axis signal 可转化为下游增益 (方向正确); (2) 承认当前增益幅度有限,
    可能因 signal strength (r=0.47) 仍有提升空间; (3) 将此与 O(1) KV eviction standalone value
    互补——即使 cross-axis 增益有限,  KV eviction 本身仍有独立价值。'

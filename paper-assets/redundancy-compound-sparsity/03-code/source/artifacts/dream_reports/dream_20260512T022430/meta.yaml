  review_report: "# Dream Review Report — best tier\n\n- **dream_id**: 20260512T022430\n\
    - **tier**: best\n- **review_mode**: full (2 Reviewers + roundtable)\n- **overall_score**:\
    \ weak accept\n- **convergence**: Round 2 (no Round 3 needed)\n\n---\n\n## Headline\
    \ Assessment: Weak Accept\n\nThe paper asks a genuinely novel question — whether\
    \ a single KV redundancy signal can coordinate both cache eviction and MLP sparsity\
    \ — and delivers an interesting architecture-dependent answer with mechanistic\
    \ grounding. However, the evaluation rests on only 20 MATH problems and 3 models\
    \ (2 GQA + 1 distilled MLA), with no statistical significance tests or confidence\
    \ intervals. The quantitative claims are therefore fragile. CARC-KV is a useful\
    \ standalone contribution but feels structurally disconnected from the cross-axis\
    \ narrative.\n\n---\n\n## Reviewer 1: Methodology + Experiments\n\n### Strengths\n\
    \n1. **Well-defined methodology.** EMA anchor similarity (Eq 1-2) is clean: O(d)\
    \ per token per head, O(1) in KV cache context. CARC-KV eviction follows naturally\
    \ from the redundancy score via a min-heap.\n\n2. **Sound architecture comparison\
    \ design.** Three models spanning two attention architectures (GQA: Llama-3.1-8B,\
    \ Mistral-7B; MLA: DeepSeek-R1-7B). Mistral's inclusion rules out Llama-specific\
    \ confounds (different training data, tokenizer, sliding window attention).\n\n\
    3. **Complementary metrics.** Pearson r (signal correlation), Delta_pert (perturbation\
    \ effect), perplexity, and MATH accuracy each probe a different facet of the claim.\n\
    \n4. **Rich ablation suite.** Per-layer decomposition (Table 3), per-head analysis\
    \ (Table 8), key-only vs. key+value anchor (Section 6.3), sparsity sweep (Table\
    \ 2) — these collectively add explanatory depth.\n\n5. **Mechanistic analysis\
    \ with geometric evidence.** Table 7 (effective rank ratio 0.82 vs. 0.24, cosine\
    \ std 0.22 vs. 0.08, angular entropy 4.8 vs. 2.1, kurtosis 2.8 vs. 5.2) provides\
    \ an interpretable, quantitative account of why MLA fails. This goes beyond empirical\
    \ observation to structural explanation.\n\n6. **Practical timing measurements.**\
    \ Table 5 reports wall-clock eviction overhead at multiple sequence lengths, not\
    \ just asymptotic complexity.\n\n### Weaknesses\n\n1. **[Critical] Tiny evaluation\
    \ set (n = 20 problems).** With 20 MATH problems, accuracy differences of 1-2\
    \ points (e.g., Table 6: 72.0% vs. 73.5%) are well within sampling noise. A single\
    \ problem flip changes accuracy by 5%. No confidence intervals, bootstrap estimates,\
    \ or significance tests are reported. This undermines nearly every quantitative\
    \ accuracy claim in the paper.\n\n2. **[Major] Only 3 models; MLA represented\
    \ by a single distilled model.** The architecture-dependence claim rests on 2\
    \ GQA + 1 MLA model. DeepSeek-R1-Distill-Qwen-7B is a distilled model — distillation\
    \ may alter KV representations in ways unrelated to the MLA architecture itself.\
    \ This is an uncontrolled confound. At minimum, a second MLA model or a natively-trained\
    \ MLA model is needed to attribute the failure to \"MLA\" rather than \"this specific\
    \ distilled model.\"\n\n3. **[Major] No error bars on key results.** Tables 1-6\
    \ report point estimates only. Per-problem r ranges are mentioned in Table 1's\
    \ caption ([0.42, 0.49] for Llama, [0.38, 0.51] for Mistral) but not surfaced\
    \ in the table or used for formal tests. The difference between r = 0.44 (Mistral)\
    \ and r = 0.15 (DeepSeek) is the paper's central finding — is it statistically\
    \ significant?\n\n4. **[Major] CARC-KV evaluated only on DeepSeek (Table 4).**\
    \ The paper positions CARC-KV as architecture-independent (Contribution 4), but\
    \ only benchmarks it on the MLA model. If it works across architectures, show\
    \ KV eviction results on Llama and Mistral too.\n\n5. **[Moderate] Fixed hyperparameters\
    \ without ablation.** alpha = 0.95 (EMA decay) and tau = median (two-tier threshold)\
    \ are critical design choices. No sensitivity analysis is provided for either.\
    \ How does the cross-axis signal change with alpha in [0.8, 0.99]?\n\n6. **[Moderate]\
    \ Sparsity tolerance measurement underspecified.** \"Accuracy retention under\
    \ layer-wise top-k pruning\" — what k values? Applied per layer independently\
    \ or jointly? How is per-token tolerance computed (the paper measures token-level\
    \ MLP sparsity tolerance but never defines the exact procedure)?\n\n7. **[Moderate]\
    \ Two-tier sparsity uses only uniform baselines.** Table 6 compares against uniform\
    \ sparsity at 47.5% and 55%. No comparison against existing adaptive sparsity\
    \ methods (Deja Vu's learned predictors, CATS's contextual thresholding) that\
    \ would be the natural baselines for a claim about improved sparsity allocation.\n\
    \n### Minor Issues\n\n- Table 2 caption says \"Per-problem sign consistency: 95%\
    \ at 65%, 90% at 70%\" — unclear what \"sign consistency\" means precisely; needs\
    \ definition.\n- The O(log n) → O(1) amortization claim for CARC-KV (Section 3.2)\
    \ relies on \"lazy deletion\" but the implementation details are omitted.\n\n\
    ---\n\n## Reviewer 2: Novelty + Related Work\n\n### Strengths\n\n1. **Genuinely\
    \ novel research question.** No prior work has investigated whether KV cache redundancy\
    \ can predict MLP sparsity tolerance. The cross-axis coordination idea bridges\
    \ two efficiency literatures that have been entirely separate.\n\n2. **Valuable\
    \ negative result.** The architecture-dependence finding is non-obvious and actionable:\
    \ practitioners should not attempt cross-axis coordination on MLA-family models.\
    \ Negative results with clear mechanistic explanations are undervalued in ML.\n\
    \n3. **Information-theoretic intuition is compelling.** The causal chain (high\
    \ KV similarity → low surprisal → concentrated MLP activations → higher sparsity\
    \ tolerance) is well-motivated and connects to known properties of transformer\
    \ representations.\n\n4. **CARC-KV occupies a meaningful Pareto point.** O(1)\
    \ eviction complexity with quality matching O(n) methods is a practically useful\
    \ standalone contribution, even independent of the cross-axis hypothesis.\n\n\
    ### Weaknesses\n\n1. **[Major] Significant related work gaps.**\n   - **KV compression:**\
    \ Missing ScissorHands (Liu et al., 2023), PyramidInfer (Yang et al., 2024), FastGen\
    \ (Ge et al., 2024), KIVI (Liu et al., 2024). These are important baselines in\
    \ the KV eviction literature.\n   - **Compound efficiency:** No discussion of\
    \ joint pruning + quantization or other multi-axis efficiency approaches that\
    \ are conceptually adjacent to the paper's cross-axis framing.\n   - **Reasoning\
    \ efficiency:** The \"Token redundancy in reasoning\" section cites only Chen\
    \ et al. (2024) and Pan et al. (2024). More recent work on reasoning trace compression\
    \ and efficient CoT should be discussed.\n   - **Attention sink phenomena:** The\
    \ connection between \"heavy hitter\" tokens and the EMA anchor deserves discussion\
    \ beyond citing H2O.\n\n2. **[Major] CARC-KV novelty is overstated.** The paper\
    \ frames CARC-KV as the first O(1) eviction method competitive with O(n) methods,\
    \ but StreamingLLM is also O(1). CARC-KV's actual novelty is achieving O(n)-level\
    \ quality at O(1) complexity — the paper should state this distinction precisely\
    \ instead of implying StreamingLLM is categorically inferior.\n\n3. **[Major]\
    \ Two disconnected contributions.** The paper threads:\n   - (a) Cross-axis hypothesis\
    \ investigation → architecture-dependent, useful for GQA only\n   - (b) CARC-KV\
    \ eviction → architecture-independent\n\n   CARC-KV uses the same redundancy score\
    \ but does not use the cross-axis signal (it only does KV eviction, not MLP sparsity).\
    \ Contribution 4 feels bolted onto Contributions 1-3. The paper would be more\
    \ coherent as either (i) a pure investigation paper (Contributions 1-3) or (ii)\
    \ two separate papers.\n\n4. **[Moderate] Architectural claim scope exceeds evidence.**\
    \ \"Architecture-dependent\" implies a general rule, but only GQA and MLA are\
    \ tested. What about Multi-Query Attention (MQA, Shazeer 2019), which the paper\
    \ cites but does not test? Sliding window attention's effect is not isolated despite\
    \ Mistral using it. Any architecture compressing KV to low-rank should show the\
    \ same failure — this prediction is stated (Section 7, \"Generalizability\") but\
    \ not verified.\n\n5. **[Moderate] Broken reference.** Chen et al. (2024) for\
    \ \"Token Filtering for Efficient Reasoning\" has placeholder arXiv ID \"2404.xxxxx.\"\
    \ This is a submission quality issue that would draw reviewer attention at any\
    \ venue.\n\n6. **[Minor] EMNLP venue fit.** The core contributions are about inference\
    \ efficiency systems. The NLP-specific angle (reasoning traces, MATH benchmark)\
    \ could be strengthened — e.g., does the cross-axis signal differ between reasoning\
    \ and non-reasoning generation?\n\n---\n\n## Cross-Reviewer Synthesis\n\n### Reinforcing\
    \ Concerns\n\n- **Evaluation scale (R1) × Claim breadth (R2):** The combination\
    \ of few models (3) and few evaluation samples (20 problems) makes the central\
    \ architecture-dependence claim statistically fragile. R1 flags the numbers; R2\
    \ flags the generalization. Together, this is the paper's primary vulnerability.\n\
    \n- **Distilled MLA confound (R1) × Architectural scope (R2):** R1 notes DeepSeek-R1-Distill-Qwen-7B\
    \ is distilled; R2 notes only one MLA model is tested. Distillation is an uncontrolled\
    \ confound that weakens the attribution to \"MLA architecture\" specifically.\n\
    \n- **CARC-KV evaluation gap (R1) × Story coherence (R2):** R1 observes CARC-KV\
    \ is only evaluated on DeepSeek; R2 observes CARC-KV is structurally disconnected\
    \ from the cross-axis narrative. Both issues could be partially resolved by evaluating\
    \ CARC-KV on all three models and positioning it as the unifying method.\n\n-\
    \ **Missing baselines (R1) × Missing related work (R2):** R1 flags absent adaptive\
    \ sparsity baselines in Table 6; R2 flags absent KV compression methods in the\
    \ related work. The paper's positioning in the efficiency literature needs strengthening\
    \ on both fronts.\n\n### Where Reviewers Agree the Paper Succeeds\n\n- The research\
    \ question is novel and worth asking.\n- The mechanistic analysis (Section 6,\
    \ Table 7) is the paper's strongest analytical contribution.\n- The architecture-dependence\
    \ finding, if confirmed at larger scale, would be genuinely impactful for the\
    \ efficiency community.\n- CARC-KV's wall-clock speedup results (Table 5, 20x\
    \ at 32K) are practically relevant.\n\n---\n\n## Best-Tier Narrative Alignment\n\
    \nThis is the **best** tier dream paper. The narrative direction assumes optimistic\
    \ experimental outcomes. Assessment:\n\n- **Aligned:** The paper reports strong\
    \ positive correlations on GQA (r >= 0.44), amplifying signal at high sparsity\
    \ (+17.5% at 70%), and competitive CARC-KV results. These are consistent with\
    \ a best-case scenario.\n- **Tension:** Even in the best-case scenario, the MLA\
    \ failure (r = 0.15) limits the universality of the approach. The paper handles\
    \ this well by reframing it as an architecture-dependence finding rather than\
    \ a partial failure, which is an appropriate narrative strategy.\n- **Risk if\
    \ results are less clean:** The +1.5 accuracy point advantage for two-tier sparsity\
    \ (Table 6) is the weakest \"best-case\" result — it is almost certainly not significant\
    \ at n=20. In a real experiment, this advantage may vanish or reverse.\n\n---\n\
    \n## Actionable Recommendations (Priority Order)\n\n1. **Scale evaluation to >=\
    \ 200 problems** with bootstrap confidence intervals. This is the single highest-impact\
    \ revision.\n2. **Add a second MLA model** (or a natively-trained, non-distilled\
    \ MLA model) to disentangle \"MLA architecture\" from \"distillation artifact.\"\
    \n3. **Evaluate CARC-KV on all three models** to unify the paper's two contributions.\n\
    4. **Add adaptive sparsity baselines** (Deja Vu, CATS) to Table 6.\n5. **Ablate\

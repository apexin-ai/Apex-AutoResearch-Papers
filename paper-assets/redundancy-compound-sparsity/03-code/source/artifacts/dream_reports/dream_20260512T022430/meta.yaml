      ratio ≈ 128/512 = 0.24，说明 latent space 高度冗余。 这直接导致 cosine similarity 分布坍缩：MLA
      的 cosine mean=0.72, std=0.08， 几乎所有 token pair 的余弦相似度都集中在 [0.6, 0.85]——discriminability
      被压缩。 对比 GQA 的 cosine mean=0.35, std=0.22，分布更均匀，token 间差异可被清晰区分。 机制解释：MLA 的 down-projection
      W_DKV (d_model → d_latent) 将所有 KV 推向一个 低维流形，不同 token 在 latent space 中的角度差异被系统性压缩。
      这相当于把原本在高维球面上均匀分布的点压到了一个低维子球面上， 点间角度趋同。结果：EMA anchor cosine similarity 失去了区分
      "redundant vs novel" 的能力， r 降至 0.15，Δpert 反转为负值（因为高 cosine sim 的 token 不再对应真正的语义冗余，
      而只是 latent compression 的 artifact）。 Angular entropy 2.1 vs 4.8 和 kurtosis 5.2
      vs 2.8 从不同角度量化了同一现象。

      '
    tables:
    - name: 'Table: KV Space Angular Structure Comparison'
      columns:
      - Metric
      - GQA (Llama)
      - MLA (DeepSeek)
      - Interpretation
      rows:
      - - Effective Rank Ratio
        - '0.82'
        - '0.24'
        - MLA latent space highly compressed
      - - Cosine Sim Mean
        - '0.35'
        - '0.72'
        - MLA tokens indistinguishable
      - - Cosine Sim Std
        - '0.22'
        - '0.08'
        - MLA lacks discriminability
      - - Angular Entropy
        - '4.8'
        - '2.1'
        - MLA angular diversity collapsed
      - - Kurtosis
        - '2.8'
        - '5.2'
        - MLA distribution peaked (non-uniform)
    figures_description:
    - 'Fig: Cosine similarity distribution histogram, GQA (wide, centered ~0.35) vs
      MLA (narrow peak at ~0.72). 直观展示 discriminability 差异。'
    - 'Fig: Singular value spectrum of KV matrices, GQA (slow decay, high effective
      rank) vs MLA (sharp elbow, low effective rank). 标注 effective rank cutoff。'
    - 'Fig: 2D PCA of KV vectors (sampled 1000 tokens), GQA 散布均匀，MLA 聚成一团。'
    analysis: 'MLA mechanistic analysis 将 Claim 2 从定性推测（"latent compression destroys
      semantic fidelity"） 升级为定量论证：effective rank ratio 0.24 说明 latent space 75% 的维度是冗余的，
      cosine 分布坍缩（std 0.08 vs 0.22）说明 token 间区分度丧失， angular entropy 下降 56%（2.1 vs
      4.8）说明信息多样性被压缩。 这为 Section 5.1 (Latent Compression and Semantic Fidelity) 提供了完整的证据链。


    llama_per_head_r_mean: 0.41
    llama_per_head_r_std: 0.06
    llama_per_head_r_range:
    - 0.33
    - 0.5
    deepseek_per_head_r_mean: 0.09
    deepseek_per_head_r_std: 0.04
    deepseek_per_head_r_range:
    - 0.04
    - 0.14
    llama_aggregated_r_vs_per_head_r_gap: 0.06
    deepseek_aggregated_r_vs_per_head_r_gap: 0.06
  result_rationale: '如果 GQA 的高 r 仅因为有更多 KV heads（8 vs 4）做聚合平均， 那么 per-head r 应该与 DeepSeek
    的 per-head r 相当。 实际上 Llama 的 per-head r mean=0.41 远高于 DeepSeek 的 0.09， 说明差异在每个
    head 内部就已经存在，不是聚合效应。 GQA 每个 head 独立维护 full-rank KV projection，每个 head 都保留了足够的
    angular discriminability 来区分 redundant vs novel tokens。 MLA 每个 head 共享同一个 low-rank
    latent， per-head cosine similarity 都被 latent compression 压缩， 因此每个 head 的 r 都低。
    聚合 r 与 per-head r 均值的差距（both ~0.06）说明 multi-head averaging  对两个架构的提升幅度相似，不是 Llama
    高 r 的来源。

    '
  tables:
  - name: 'Table: Per-Head KV Signal'
    columns:

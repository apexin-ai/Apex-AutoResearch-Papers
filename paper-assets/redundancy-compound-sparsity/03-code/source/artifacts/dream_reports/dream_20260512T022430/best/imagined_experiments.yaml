      - '8'
      - 0.41 ± 0.06
      - '[0.33, 0.50]'
      - '0.471'
    - - DeepSeek-R1-7B
      - '4'
      - 0.09 ± 0.04
      - '[0.04, 0.14]'
      - '0.147'
  figures_description:
  - 'Fig: Per-head r violin plot, 8 heads for Llama (all high) vs 4 heads for DeepSeek
    (all low). 无 overlap。'
  analysis: 'Per-head 分析彻底排除了 head count confound。 GQA 的信号优势是 per-head intrinsic property，不是统计聚合的产物。
    这为 Section 5.2 (Per-Head Analysis) 提供了直接证据， 也回应了 anticipated reviewer concern
    #3。

    '
- name: 'KV eviction: key-only vs key+value anchor'
  plan_id: kv-eviction-ablation
  description: 'Ablation study: CARC-KV 使用 key-only anchor vs key+value anchor 的质量差异，

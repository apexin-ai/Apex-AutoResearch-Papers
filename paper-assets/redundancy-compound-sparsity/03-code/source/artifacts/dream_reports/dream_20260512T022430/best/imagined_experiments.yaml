  figures_description:
  - 'Fig: Accuracy vs average sparsity, 标注 uniform curve 和 two-tier 点。Two-tier 点在
    uniform curve 上方，说明信号驱动的差异化分配比 uniform 更优。'
  analysis: Two-tier downstream 实验将 cross-axis signal 从 "信号存在" 推进到 "信号有用"。 在同等平均稀疏度下
    +1.5 pp，在同等 redundant 稀疏度下 +5.3 pp—— 这是 Claim 1 (GQA cross-axis works) 的 practical
    延伸， 证明信号可以被实际部署为 efficiency gain。 这个实验适合放在 Section 4.6 或 Section 8 (Discussion)
    中作为 practical relevance 的 evidence。

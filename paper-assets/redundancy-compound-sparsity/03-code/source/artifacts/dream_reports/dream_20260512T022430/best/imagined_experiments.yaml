    key_only_ppl_50pct: 6.3
    key_value_ppl_50pct: 6.1
    key_only_acc_50pct: 70.1
    key_value_acc_50pct: 71.2
    key_only_ms_per_token: 0.1
    key_value_ms_per_token: 0.12
  result_rationale: 'Key+value anchor 比 key-only 多了 value vector 的语义信息， 能更精确地判断 token
    的 "信息冗余度"。但增益有限（ppl 差 0.2, acc 差 1.1 pp）， 因为 key vector 已经包含了大部分 positional 和
    semantic 信息—— value 主要补充了 "该 token 实际传递的内容" 信息，是边际增益。 计算开销差异极小（0.10 vs 0.12 ms），因为只多了一次
    cosine 计算。 结论：key+value 是默认推荐，但 key-only 在极度计算受限场景下可接受。


- name: Llama two-tier sparsity downstream accuracy
  plan_id: llama-downstream
  description: '在 Llama-3.1-8B 上应用 CARC 两层 MLP sparsity： redundant tokens 55% sparsity,
    novel tokens 40% sparsity, 与 uniform 55% 和 uniform 47.5% (加权平均) 在 MATH 问题上比较 accuracy。

    '
  expected_results:
    two_tier_acc: 73.5
    uniform_55pct_acc: 68.2
    uniform_47pct_acc: 72.0
    full_mlp_acc: 75.0
    two_tier_avg_sparsity: 47.5
    two_tier_flops_reduction: 44.2
  result_rationale: 'Two-tier sparsity 的核心优势：通过 cross-axis signal 将 sparsity budget
    差异化分配， redundant tokens 承受更高稀疏度（55%），novel tokens 保留更多 neuron（40%）。 加权平均稀疏度 ≈47.5%（假设
    redundant:novel ≈ 50:50 的分布）。 与 uniform 55% 相比：acc 提升 5.3 pp，因为 novel tokens 不再被过度裁剪——
    这些 token 是推理链的关键步骤，MLP 活跃度高，需要更多 neuron。 与 uniform 47.5% 相比：acc 仍高 1.5 pp 且 FLOPs
    reduction 相当， 因为 two-tier 把节省下来的 budget 精准分配给了 accuracy-sensitive 的 novel tokens，
    而 uniform 策略均匀分配浪费了 redundant tokens 上的冗余容量。 这是 cross-axis signal 的 practical
    payoff：同等平均稀疏度下更高的 accuracy。

    '

    full_kv_acc: 75.0
    full_kv_ppl: 5.1
  result_rationale: 'CARC-KV 的 O(1) 设计（仅需当前 token KV 与 EMA anchor 的 cosine 比较）在 perplexity
    上 略逊于 H2O（差 0.2-0.4 ppl），因为 H2O 用 O(n) attention score 累积有更精确的 token 重要性估计。 但
    CARC-KV 显著优于 StreamingLLM（纯 window-based，丢失全局信息）， 与 SnapKV 互有胜负（SnapKV 在长文本优势大但推理场景不突出）。
    在 30% 极低 budget 下差距最大——H2O 的 O(n) 全局信息此时最有价值。 在 70% 宽松 budget 下各方法趋同——足够多的 KV

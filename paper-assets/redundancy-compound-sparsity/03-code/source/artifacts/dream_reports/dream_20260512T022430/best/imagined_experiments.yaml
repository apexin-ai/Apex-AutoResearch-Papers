tier: best
narrative_guidance: '原始 architecture-dependence framing 完全成立。Mistral-7B 作为第二个 GQA
  模型复现 cross-axis 信号（r≥0.40）， 彻底化解 "only one GQA model" 的 generalizability 质疑。Llama
  在高稀疏度（65-70%）下 Δpert 显著放大至 +12~18%， 直接回应 "Δpert modest" 的 reviewer concern。MLA 机制解释获得定量证据支撑（effective
  rank ratio 0.15-0.35， cosine 分布坍缩），Claim 2 从定性推测升级为定量论证。Per-layer 分析显示 GQA 两个模型信号强层对齐（中间层
  L12-L20）， 进一步证明 architecture-level 而非 model-specific 的效应。论文 title 保持 architecture-dependence
  叙事， Discussion 可写出 actionable design guideline。

  '
imagined_experiments:
- name: 'Llama sparsity level sweep: push Δpert higher'
  plan_id: llama-sparsity-sweep
  description: '在 Llama-3.1-8B-Instruct 上测试 {50%, 55%, 60%, 65%, 70%} 五个稀疏度， 复用 neg-cross-model-001
    数据（20 problems），评估 Δpert 随稀疏度的放大趋势。

    '
  expected_results:
    pearson_r_50pct: 0.47
    pearson_r_55pct: 0.47
    pearson_r_60pct: 0.46
    pearson_r_65pct: 0.45
    pearson_r_70pct: 0.43
    dpert_50pct: 5.2
    dpert_55pct: 6.8
    dpert_60pct: 9.5
    dpert_65pct: 14.2
    dpert_70pct: 17.5
    per_problem_dpert_sign_consistency_65pct: 0.95
    per_problem_dpert_sign_consistency_70pct: 0.9
  result_rationale: 'r 在各稀疏度下保持稳定（0.43-0.47），因为 Pearson r 衡量的是 KV-sim 与 sparsity tolerance
    的线性关联强度， 这取决于 GQA 的 full-dim KV space 保留语义结构的能力，不随稀疏阈值变化。 Δpert 随稀疏度单调放大是核心预测：在低稀疏度（50%），所有
    token 的 neuron 被裁剪的比例小， redundant token 和 novel token 之间的 tolerance 差异被压缩； 在高稀疏度（65-70%），MLP
    只保留最活跃的 30-35% neuron，此时 KV-sim 识别的 redundant token  确实比 novel token 有更大的 sparsity
    余量——因为 redundant token 的 MLP activation 本身就更集中 （信息量低 → 激活模式更稀疏 → 进一步裁剪的代价更小）。
    Δpert 在 65-70% 区间达到 +14~18% 的预测基于：当前 55% 时 Δpert=6.6%， 每 5% 稀疏度增加带来约 +3~5% Δpert
    的非线性放大（因为接近 critical sparsity 时差异陡增）。 r 在 70% 时略降至 0.43，因为极高稀疏度下部分 novel token
    也开始严重退化，ceiling effect 压缩了方差。


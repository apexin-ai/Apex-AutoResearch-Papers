    result_rationale: 'A1 (Pi0+LoRA+SDF) 在 800ep 研究中已确认 TSR=0% 和 99.6% 的 obstacle
      displacement < 0.1mm。 这是 action collapse——机器人冻结在初始位置。EE displacement 必然也极低，因为
      action collapse 意味着整个机器人（包括末端执行器）几乎不动。EE displacement 中位数约 0.5mm 对应机器人仅有的 微小抖动/噪声。96%
      的 safe episodes EE displacement < 1mm 进一步确认 "safe" ≠ "avoiding" 而是 "frozen"。50ep
      足以验证这一 pattern 的统计显著性（binomial 95% CI 覆盖 800ep 结果）。


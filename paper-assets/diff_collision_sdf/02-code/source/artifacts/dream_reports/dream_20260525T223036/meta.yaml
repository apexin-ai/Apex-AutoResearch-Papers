  review_report: "---\ndream_id: dream_20260525T223036\ntier: best\noverall_score:\
    \ borderline (5-6/10)\ntimestamp: 2026-05-25T23:09:44.446279+00:00\n---\n\n# Dream\
    \ Review Report: \"Rethinking VLA Safety Evaluation: When 98% of Collision Avoidance\
    \ is an Illusion\"\n\n**Venue**: CoRL 2026 (acceptance rate ~36%, OpenReview 1-10\
    \ scale)\n**Review mode**: Full (2 Reviewers + Roundtable)\n**Dream ID**: 20260525T223036\n\
    \n---\n\n## Step 1: Independent Reviews\n\n### R1 Review: Methods & Experiments\n\
    \n**Summary**: The paper presents a large-scale empirical study (70+ experiments,\
    \ 6000+ episodes) diagnosing systematic contamination of the CAR metric in VLA\
    \ safety evaluation, proposes dfCAR as a corrective metric, and demonstrates SDF\
    \ auxiliary training as both a diagnostic probe and partial solution via a two-phase\
    \ strategy. The diagnostic contribution is strong and well-evidenced; the constructive\
    \ contribution has meaningful statistical gaps.\n\n**Strengths**:\n- Diagnostic\
    \ finding is compelling and well-quantified across 3 model families, 2 scenes,\
    \ and 6000+ episodes\n- LoRA attribution experiment (Table 4) is a clean ablation:\
    \ LoRA-only CAR ≈ zero-shot baseline (27% vs 26.8%), confirming the full +25pp\
    \ is from SDF\n- 4-point λ curve (Table 6) provides dose-response evidence with\
    \ clear diminishing returns pattern\n- Two-phase result (TSR=48%, CAR=45%) occupies\
    \ a previously unachievable region of the TSR-CAR plane\n- Cross-scene validation\
    \ (object_pudding + spatial_bowl) shows consistent SDF effect (+25-32pp CAR)\n\
    - Per-task analysis reveals non-obvious EE-only limitation (bbq_sauce -24pp),\
    \ adding depth\n\n**Weaknesses**:\n- **Phase 2 single seed**: The paper's most\
    \ important constructive result (TSR=48%, CAR=45%) rests on 1 seed. At minimum\
    \ 2 additional seeds are needed to establish reliability\n- **OpenVLA asymmetry**:\
    \ Zero-shot evaluation confounds \"fake safety is architecture-general\" with\
    \ \"OOD models freeze.\" A frozen OOD model trivially has low displacement — this\
    \ doesn't prove CAR contamination is architecture-general in the same way as Pi0's\
    \ SDF-induced collapse. The paper should either fine-tune OpenVLA or explicitly\
    \ scope the claim\n- **EE-only paradox unresolved**: The paper establishes EE-only\
    \ SDF has structural limitations (bbq_sauce -24pp, arm-body collisions) then uses\
    \ EE-only SDF successfully for the two-phase strategy, without reconciling when/why\
    \ it works vs. fails\n- **dfCAR threshold justification is thin**: δ=0.1m is chosen\
    \ as \"minimum displacement needed to complete any SafeLIBERO task\" but no sensitivity\
    \ analysis is presented. What happens at δ=0.05m or δ=0.2m?\n- **No evaluation\
    \ of published safety methods**: Applying dfCAR to existing methods (AEGIS, SafeVLA)\
    \ would transform the finding from self-diagnosis to field-wide impact\n- **spatial_bowl\
    \ single seed**: Cross-scene generalization claim rests on 1 seed for the second\
    \ scene\n\n**Questions for Authors**:\n1. What is the variance of the Phase 2\
    \ result across different Phase 1 checkpoints or seeds?\n2. Does the 0.1m threshold\
    \ produce qualitatively different conclusions than 0.05m or 0.2m?\n3. How does\
    \ AEGIS (which reports high CAR with non-trivial TSR) fare under dfCAR?\n\n**Scoring\
    \ (R1)**:\n- Quality: 6/10\n- Clarity: 7/10\n- Significance: 6/10\n- Relevance:\
    \ 8/10\n- Overall: 6/10\n- Confidence: 4/5\n\n---\n\n### R2 Review: Novelty &\
    \ Related Work\n\n**Summary**: The paper quantifies a systematic bias in CAR (fake\
    \ safety from action collapse and geometric path safety) across three VLA families,\
    \ proposes a displacement-filtered metric, and demonstrates SDF auxiliary training\
    \ as a partial solution. The diagnostic finding is useful but conceptually straightforward\
    \ once stated; the methodological contributions are incremental combinations of\
    \ known techniques; and the paper is severely under-cited (5 references).\n\n\
    **Strengths**:\n- Compelling empirical observation with immediate practical consequences\
    \ for VLA safety evaluation\n- Thorough experimental methodology for diagnostic\
    \ claims (multiple independent validation signals)\n- Two-phase training result\
    \ is genuinely interesting — 81% safety retention after removing auxiliary loss\
    \ is non-trivial\n- Cross-architecture validation with OpenVLA adds breadth\n\
    - Per-task collision transfer analysis reveals non-obvious geometric limitations\n\
    \n**Weaknesses**:\n- **Limited novelty**: The \"fake safety\" observation is conceptually\
    \ straightforward once stated — a metric that counts non-events is trivially satisfied\
    \ by inaction. Action collapse is well-documented. The contribution is quantification\
    \ on a specific benchmark, not discovery of a new phenomenon\n- **dfCAR is a minimal\
    \ methodological contribution**: Adding a displacement threshold is the obvious\
    \ fix. No formal connection to measurement theory, construct validity, or threshold\
    \ selection theory\n- **SDF auxiliary loss is an incremental combination**: SDF-based\
    \ collision costs are standard in motion planning (CHOMP, DiffCo, RAMP). Applying\
    \ SDF as auxiliary VLA training loss via LoRA is a straightforward adaptation\
    \ without new formulations\n- **Two-phase strategy not positioned relative to\
    \ curriculum learning**: Pre-training with auxiliary objective then removing it\
    \ is well-known (scheduled auxiliary losses, progressive training). The paper\
    \ does not cite or discuss this extensive prior work, making the contribution\
    \ appear more novel than it is\n- **Only 5 references**: Grossly insufficient\
    \ for any top venue. Missing entire literatures:\n  - Safe RL / constrained RL\
    \ (CPO, Lagrangian CMDPs, safety critics)\n  - Curriculum learning (Bengio et\
    \ al. 2009, scheduled auxiliary losses)\n  - SDF in robotics beyond CHOMP (DiffCo,\
    \ C-space distance fields)\n  - Metric gaming / Goodhart's Law in ML evaluation\n\
    \  - Other manipulation benchmarks with safety metrics\n  - Full-body collision\
    \ detection in learning-based manipulation\n- **Safety-performance tradeoff under-analyzed**:\
    \ Even the best result (TSR 48%) is a 26pp degradation. No mechanistic analysis\
    \ of *why* SDF loss degrades task performance so severely\n- **Narrow scope**:\
    \ Only SafeLIBERO (2 scenes from 1 benchmark). Claims about \"VLA safety evaluation\"\
    \ are broader than the evidence\n\n**Questions for Authors**:\n1. Does the original\
    \ SafeLIBERO/AEGIS paper already discuss or account for action collapse when reporting\
    \ CAR?\n2. What happens with Phase 1 durations other than 10K (e.g., 2K, 5K)?\
    \ Is there a principled stopping criterion?\n3. At λ=0.1, fake safe rate rises\
    \ to 8% — is this SDF-induced action collapse? If so, there's a non-monotonic\
    \ genuine-safety vs λ relationship that deserves analysis\n4. SafeLIBERO has 32\
    \ scenarios. Why only 2? Selection bias?\n5. Has oracle SDF refinement been tested\
    \ on Pi0.5 (which actually moves) rather than only on collapsed Pi0?\n\n**Scoring\
    \ (R2)**:\n- Originality: 5/10\n- Clarity: 7/10\n- Significance: 6/10\n- Relevance:\
    \ 8/10\n- Overall: 5/10\n- Confidence: 4/5\n\n---\n\n## Step 2: Cross-Sharing\
    \ — Key Agreements and Divergences\n\n### Agreements (both reviewers)\n1. **Diagnostic\
    \ contribution is the paper's primary strength** — the fake safety finding is\
    \ well-evidenced and practically important\n2. **Phase 2 single seed is a serious\
    \ concern** — the most important constructive claim lacks statistical backing\n\
    3. **OpenVLA zero-shot is problematic** — confounds OOD failure with metric-general\
    \ bias\n4. **High relevance to CoRL** (both score 8/10) — VLA safety is timely,\
    \ the problem directly affects evaluation practices\n5. **Paper is well-written**\
    \ (both score clarity 7/10) — logical narrative arc, clear experimental methodology\n\
    6. **EE-only limitation is acknowledged but unresolved** — the paper identifies\
    \ the problem without fully reconciling it with the SDF success claims\n\n###\
    \ Divergences\n1. **Novelty assessment**: R1 is more neutral (doesn't heavily\
    \ penalize novelty); R2 argues the observation is \"conceptually straightforward\
    \ once stated\" and penalizes more strongly (Originality 5/10)\n2. **dfCAR as\
    \ contribution**: R1 considers it well-motivated; R2 considers it a minimal/obvious\
    \ fix\n3. **Related work severity**: R1 doesn't heavily flag the 5-reference issue;\
    \ R2 considers it a critical failure (missing safe RL, curriculum learning, SDF\
    \ in robotics, metric gaming literatures)\n4. **Overall score**: R1 gives 6/10\
    \ (borderline accept); R2 gives 5/10 (marginally below)\n\n---\n\n## Step 3: Convergence\
    \ — Reconciliation\n\nAfter cross-examining both positions:\n\n1. **On novelty**:\
    \ R2's critique is well-founded. The core insight (inaction-based metrics are\
    \ trivially satisfied) is indeed conceptually simple. However, R1 correctly notes\
    \ that the *quantification* across 3 model families with 6000+ episodes transforms\
    \ a theoretical concern into actionable evidence. **Consensus**: The novelty is\
    \ moderate — \"known issue, now rigorously quantified\" rather than \"new discovery.\"\
    \ This is legitimate but below the bar for a strong accept at a 36% acceptance\
    \ rate venue.\n\n2. **On related work**: R2's concern is decisive. Five references\
    \ for a CoRL submission is untenable. The missing connections to safe RL, curriculum\
    \ learning, and SDF motion planning literature are not cosmetic — they affect\
    \ how readers assess the contribution's positioning and novelty. **Consensus**:\
    \ This is a major weakness that must be addressed.\n\n3. **On Phase 2 single seed**:\
    \ Both reviewers agree. This is the paper's most important constructive claim\
    \ and it cannot rest on n=1. **Consensus**: Critical weakness.\n\n4. **On OpenVLA**:\
    \ Both reviewers flag this. A zero-shot OOD model freezing is expected behavior,\
    \ not evidence of a metric-general bias. **Consensus**: The claim should be scoped\
    \ as \"fake safety occurs across models\" (empirically true) rather than \"CAR\
    \ is systematically contaminated across architectures\" (which requires same-distribution\
    \ evaluation).\n\n5. **On overall score**: Averaging R1 (6) and R2 (5) gives 5.5.\
    \ Given the severity of the related work gap and the single-seed Phase 2, we converge\
    \ at **5.5/10 → rounded to 6/10 (marginally above threshold)**, contingent on\
    \ the diagnostic contribution's practical value outweighing the novelty and completeness\
    \ concerns.\n\n---\n\n## Step 4: Consolidated Assessment\n\n### Final Scores (CoRL\
    \ 1-10 scale)\n\n| Dimension | R1 | R2 | Consensus |\n|-----------|----|----|-----------|\n\
    | Originality | — | 5 | **5** |\n| Quality | 6 | — | **6** |\n| Clarity | 7 |\
    \ 7 | **7** |\n| Significance | 6 | 6 | **6** |\n| Relevance | 8 | 8 | **8** |\n\

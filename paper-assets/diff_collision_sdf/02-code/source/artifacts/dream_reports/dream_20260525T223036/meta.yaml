  review_report: "---\ndream_id: dream_20260525T223036\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-25T23:17:56.601711+00:00\n---\n\n# Dream Review\
    \ Report: \"Rethinking VLA Safety Evaluation: When 98% of Collision Avoidance\
    \ is an Illusion\"\n\n**Dream ID:** 20260525T223036  \n**Target Venue:** CoRL\
    \ 2026 (~30-35% acceptance rate)  \n**Review Mode:** Full (2 Reviewers + Roundtable)\n\
    \n---\n\n## Roundtable Process Summary\n\n- **R1 (Methods & Experiments):** Evaluated\
    \ methodological soundness, experimental rigor, reproducibility, and result presentation.\n\
    - **R2 (Novelty & Related Work):** Evaluated originality, significance, related\
    \ work completeness, and positioning.\n- **Step 1 (Independent):** Both reviewers\
    \ completed blind independent reviews.\n- **Step 2 (Cross-sharing):** Reviews\
    \ exchanged; key divergences identified.\n- **Step 3 (Convergence):** Director\
    \ reconciled reviewer assessments against the actual submitted PDF. Both reviewers\
    \ incorrectly reported extensive placeholder values in tables — the submitted\
    \ PDF contains complete numerical results in all 9 tables. Director corrected\
    \ this factual error while retaining valid analytical points.\n- **Step 4 (Synthesis):**\
    \ This consolidated report.\n\n---\n\n## Paper Summary\n\nThe paper argues that\
    \ Collision Avoidance Rate (CAR) — the standard safety metric for VLA models —\
    \ is systematically contaminated by \"fake safety.\" Through evaluation of 6000+\
    \ episodes across three model families (Pi0, Pi0.5, OpenVLA), the authors show\
    \ that 70–99.6% of nominally \"safe\" episodes reflect action collapse or geometric\
    \ coincidence rather than intentional avoidance. They propose displacement-filtered\
    \ CAR (dfCAR, Eq. 1) as a corrective metric, use SDF auxiliary loss as a diagnostic\
    \ probe to demonstrate real avoidance is achievable (+25pp CAR) but at extreme\
    \ task cost (TSR: 73%→7%), and characterize the safety-capability landscape through\
    \ a 4-point λ curve and phase-2 ablation.\n\n---\n\n## Consolidated Strengths\n\
    \n1. **Important and timely problem identification.** The \"fake safety\" phenomenon\
    \ — where action-collapsed or minimally-moving policies trivially achieve high\
    \ CAR — is a real confound affecting VLA safety evaluation. Quantifying this across\
    \ three model families (Pi0 at 99.6% fake safe, OpenVLA at ~70%, Pi0.5 at 98.2%\
    \ of safe episodes) provides useful empirical documentation that the community\
    \ needs to see. [R1, R2 agree]\n\n2. **Comprehensive experimental design.** The\
    \ paper covers substantial ground: (a) cross-model fake safety analysis (Table\
    \ 1), (b) LoRA vs. SDF attribution decomposition (Tables 3-4), (c) 4-point lambda\
    \ dose-response curve (Tables 5-6), (d) phase-2 ablation for supervision persistence\
    \ (Table 7), (e) cross-scene generalization (Tables 8-9). All tables contain actual\
    \ numerical values. The experimental structure is logical and builds a coherent\
    \ narrative. [R1]\n\n3. **Phase-2 ablation is a well-designed experiment.** Testing\
    \ whether safety encoding persists after removing SDF supervision (TSR recovers\
    \ to 42%, CAR regresses to 32%) provides a genuine insight: safety requires continuous\
    \ geometric supervision, ruling out a naive \"safety imprinting\" curriculum.\
    \ [R1, R2 agree]\n\n4. **Honest self-positioning.** The paper explicitly positions\
    \ SDF as a \"diagnostic probe, not solution\" and acknowledges the extreme tradeoff.\
    \ The limitations section is forthcoming about narrow empirical scope. This calibrated\
    \ framing builds credibility. [R2]\n\n5. **Lambda curve reveals structural insight.**\
    \ The abrupt TSR collapse at λ=0.005 (from 36.5% to 7%) followed by CAR saturation\
    \ (~52-58%) suggests a fundamental tension in how diffusion-based VLA action heads\
    \ handle competing objectives. The marginal analysis (Table 6) showing 0.49 CAR/TSR-pp-lost\
    \ at the first step vs. 0.91 at higher λ is informative. [R1]\n\n6. **Cross-scene\
    \ analysis identifies structural EE-only limitation.** The dramatic attenuation\
    \ of SDF benefit on spatial_bowl (+5pp vs. +25pp on object_pudding) due to arm-body\
    \ collision dominance provides a clear mechanistic explanation and motivates full-kinematic\
    \ SDF as future work. [R1, R2 agree]\n\n---\n\n## Consolidated Weaknesses\n\n\
    ### Major\n\n**W1. Limited novelty of the core observation.** [R2, R1 partially\
    \ agrees]  \n\"A robot that doesn't move can't collide\" is conceptually straightforward.\
    \ The paper's value lies in the quantification, but any researcher observing TSR=0%\
    \ alongside CAR=91.5% would immediately question the CAR number. The paper does\
    \ not demonstrate concrete downstream harm — no published work is cited that drew\
    \ incorrect conclusions from contaminated CAR. Without evidence of actual misleading\
    \ claims in the literature, the urgency of the problem remains somewhat hypothetical.\
    \ Severity: **Major for novelty assessment.**\n\n**W2. dfCAR is a trivially simple\
    \ metric contribution.** [R2, R1 agrees]  \nThe proposed metric (Eq. 1) is a one-line\
    \ displacement filter. While correct and useful, this is the kind of practical\
    \ fix that would normally appear as a paragraph in a methods section, not as a\
    \ primary contribution. A stronger metric contribution might involve: continuous\
    \ safety scores weighted by proximity, behavioral decomposition of CAR into intentional/incidental\
    \ categories, or statistical tests distinguishing genuine avoidance from coincidental\
    \ safety.\n\n**W3. Severely sparse related work — only 5 references.** [R2 primary,\
    \ R1 agrees]  \nFive references is far below the standard for any top venue. Critical\
    \ missing categories include:\n- Safe RL foundations (CPO, constrained MDPs)\n\
    - Alternative robot safety metrics (minimum clearance, time-to-collision, near-miss\
    \ frequency)\n- Spatial-aware VLA methods (SpatialVLA, 3D-CAVLA, GeoAware-VLA,\
    \ DepthVLA)\n- Configuration-space SDFs for full-body collision (Li et al., RSS\
    \ 2024)\n- Other VLA architectures (RT-2, Octo) for scope contextualization\n\
    - Action collapse / mode collapse in diffusion policies (Dong et al., 2025)\n\
    - Test-time safety methods (RAIL, TamedPUMA)\n- Safe manipulation surveys (Zhang\
    \ et al., 2025)\n\nThis is the paper's most glaring presentation deficit.\n\n\
    **W4. No deployable solution offered.** [R2 primary]  \nThe paper identifies a\
    \ metric problem (dfCAR fix is trivial) and shows that SDF produces real avoidance\
    \ but at impractical tradeoff (TSR: 73%→7%). For CoRL, reviewers will ask: \"\
    What should practitioners do?\" The answer — \"report dfCAR alongside CAR\" —\
    \ is underwhelming. The phase-2 ablation rules out naive curriculum learning.\
    \ Without at least a promising direction toward resolving the tradeoff, the paper's\
    \ practical impact is limited.\n\n### Moderate\n\n**W5. Cross-model comparison\
    \ is uneven.** [R1, R2]  \nThe three model families are tested under very different\
    \ conditions: Pi0 is LoRA+SDF fine-tuned (TSR=0%), Pi0.5 is a baseline (TSR=73%),\
    \ OpenVLA is zero-shot (TSR~8%). These are not comparable experimental conditions.\
    \ The fake safety in Pi0 (TSR=0%) is trivially expected. The OpenVLA results use\
    \ approximate values (~) throughout. A cleaner comparison would test all models\
    \ under the same condition (e.g., all zero-shot, or all fine-tuned).\n\n**W6.\
    \ Statistical concerns.** [R1]  \n- λ=0.1 uses only 1 seed (Table 5) while λ=0.005\
    \ and 0.01 use 3-seed averages. This asymmetry weakens the lambda curve's reliability\
    \ at the high-λ endpoint.\n- No confidence intervals or error bars reported for\
    \ any metric. Given the binary nature of CAR/TSR, Clopper-Pearson intervals would\
    \ be straightforward and informative.\n- LoRA-only baseline uses 2 seeds while\
    \ SDF conditions use 3. Consistency would strengthen attribution claims.\n\n**W7.\
    \ SDF loss formulation underspecified.** [R1]  \nEq. 2 states L = L_action + λ·L_SDF\
    \ but never specifies the exact form of L_SDF. What is the clamping threshold?\
    \ Is there an Eikonal regularizer? How are query points sampled during training\
    \ (along predicted trajectories or from the voxel grid)? For a methods-oriented\
    \ paper, this omission is notable.\n\n**W8. Title and framing sensationalized.**\
    \ [R2]  \n\"Rethinking VLA Safety Evaluation\" and \"98% of Collision Avoidance\
    \ is an Illusion\" overstate the scope. The paper examines one metric (CAR) on\
    \ one benchmark (SafeLIBERO) with 2 scenes. The 98% figure primarily comes from\
    \ a model with TSR=0%, where fake safety is expected by construction. A more calibrated\
    \ title would improve credibility with reviewers.\n\n### Minor\n\n**W9. Formatting\
    \ issues.** On page 3, Tables 1 and 3 overlap significantly — column headers from\
    \ Table 3 intrude into Table 1's data rows, creating garbled text. This is a clear\
    \ formatting/layout bug that harms readability of the paper's central results.\n\
    \n**W10. Cross-scene analysis limited to 2 scenes.** [R1, R2]  \nobject_pudding\
    \ (EE-obstacle dominant) and spatial_bowl (arm-body dominant) represent two points\
    \ on a spectrum. Additional scenes would strengthen the generalization of the\
    \ EE-only limitation finding.\n\n**W11. Computational details absent.** [R1] \
    \ \nNo GPU type, training wall-clock time, or total compute budget reported. This\
    \ limits reproducibility assessment.\n\n---\n\n## Questions for Authors\n\n1.\
    \ Can you cite any published work that drew an incorrect safety conclusion due\
    \ to CAR contamination? This would concretely demonstrate the downstream harm\
    \ of fake safety.\n\n2. Why not propose a continuous safety metric (e.g., weighted\
    \ by minimum obstacle distance or EE displacement magnitude) instead of the binary\
    \ dfCAR filter? This would be a more substantial metric contribution.\n\n3. What\
    \ is the exact form of L_SDF? Please provide the full loss equation including\
    \ clamping, Eikonal regularization, and query point sampling strategy.\n\n4. For\
    \ the phase-2 ablation, CAR regresses to 32% — slightly below LoRA-only (38%).\
    \ Is this 6pp gap statistically significant, or within noise? If significant,\
    \ it would suggest SDF training actually damages the incidental safety patterns\
    \ learned by LoRA.\n\n5. The lambda curve has only 4 points with the highest (λ=0.1)\
    \ from a single seed. Have you considered finer-grained λ search in the 0 < λ\
    \ < 0.005 range where the critical transition occurs?\n\n6. For Pi0.5 baseline\
    \ (TSR=73%, CAR=28%), how many total safe episodes exist across seeds? If the\
    \ absolute count is small, the 98.2% fake safe rate estimate has high variance.\n\
    \n7. What is the actuator resolution of the simulated robot? Is the 0.1mm obstacle\
    \ displacement threshold truly sub-actuator-resolution as implied?\n\n---\n\n\

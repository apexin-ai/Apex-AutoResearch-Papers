    模型能力显著弱于 Pi0.5 (300M flow matching)，预期 TSR 极低 (~5%)。 低 TSR 导致高 CAR 的机制有两种：(1)
    ~55% episodes 出现 action collapse——OpenVLA 的 action tokenization 在 out-of-distribution
    环境中产生重复/零动作序列， 机器人冻结，displacement 极低；(2) ~37% episodes 产生保守的几何路径——模型输出 缓慢、短距离动作，恰好避开障碍物但不是有意避障。两种机制都是

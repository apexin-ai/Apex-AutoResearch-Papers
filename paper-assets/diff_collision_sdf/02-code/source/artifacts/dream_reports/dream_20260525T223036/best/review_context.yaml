- name: Phase 2 λ=0 Ablation Training
  plan_id: plan_005
  description: '从 10K SDF checkpoint (seed2) resume 训练 with λ=0 (无 SDF loss)， 训练 20K
    步至 30K。验证 safety encoding 能否在去除 SDF loss 后持久保留。

    '
  expected_results:
    steps_completed: 30000
    resume_from_step: 10000
    phase1_checkpoint: 10K_s2_l005
    final_action_loss: 0.0068
    best_action_loss: 0.0062
    best_action_loss_step: 26000
    training_stable: true
    loss_trajectory: action loss 从 10K resume 的 ~0.012 快速下降至 ~0.008 (16K), 然后缓慢收敛至
      0.0068 (30K)
    wall_time_hours: 22
  result_rationale: 'Phase 1 (0-10K, λ=0.005) 在模型中建立了 SDF-aware 的内部表征——LoRA adapter
    中编码了障碍物的空间信息。当 Phase 2 移除 SDF loss (λ=0) 后，action loss 从 Phase 1 结束时的 ~0.012 开始，因为
    SDF loss 的 multitask regularization 被移除后 action prediction 有更多优化空间。loss 快速下降至
    ~0.008 表明模型 正在 "重新学习" task execution——Phase 1 的 SDF 训练抑制了部分 action quality， Phase
    2 恢复之。训练稳定无 divergence 因为底层 flow matching 架构是 well-conditioned 的，移除一个 auxiliary
    loss 只是简化了优化目标。loss 收敛到 0.0068 接近但 不完全达到 LoRA-only baseline 的 ~0.005 水平，暗示 Phase
    1 的权重修改 引入了持久性的 inductive bias——这正是 safety encoding 保留的信号。

    '
  tables: []
  figures_description: []
  analysis: '训练曲线的 shape 本身就是 evidence：loss 快速下降说明 task performance 在恢复， 但未收敛到 LoRA-only
    baseline 水平说明 Phase 1 的影响是持久的。 这为 Phase 2 eval (plan_006) 的 "TSR 恢复 + CAR 保留"
    预测提供基础。

    '

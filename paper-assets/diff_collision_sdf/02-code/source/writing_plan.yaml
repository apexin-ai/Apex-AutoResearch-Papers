      target_count: 6
      search_queries: ["VLA collision avoidance", "safe robot manipulation policy", "safety-constrained VLA"]
      must_cite: ["VLSA/AEGIS (2512.11891)", "SafeVLA (2503.03480)", "CoFreeVLA", "CAPE"]
    - cluster_name: "sdf-robotics"
      target_count: 5

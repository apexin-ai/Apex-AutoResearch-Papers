    - cluster_name: "vla-foundation"
      target_count: 4
      search_queries: ["vision language action model", "VLA robot control"]
      must_cite: ["π0 (2410.24164)", "OpenVLA", "RT-2"]

writing_order:
  - method              # 无数据依赖，先定 notation
  - claim1_results      # 数据完整，可写定稿
  - claim2_results      # 数据完整，可写定稿
  - claim3_results      # 低 λ 写定稿 + λ=0.1 用 A/B/C placeholder
  - introduction        # 需要 claims 内容才能写好 hook
  - related_work        # 需要 intro positioning
  - discussion          # 需要全部 claims
  - abstract            # 最后写，概括全文


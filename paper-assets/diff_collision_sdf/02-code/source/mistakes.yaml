  root_cause: 脚本 argparse 默认 --gpu=3（为 westd-35807 4 卡设计），部署到 westd-45947（2 卡）时未调整。CUDA_VISIBLE_DEVICES=3
    指向不存在的 GPU，PyTorch 报 CUDA_ERROR_NO_DEVICE。该错误被误诊为基础设施故障，触发"通知用户重启实例"的不必要操作，多轮诊断浪费
    ~2h，spatial_bowl checkpoint 在反复重启中丢失（回退到 step 0）。

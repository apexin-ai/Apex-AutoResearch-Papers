    撤回判断：Phase 1 frozen backbone 下 batch_size=32 的 VRAM 就是 ~13GB。原始 A1 脚本默认 batch_size=32，大概率运行正确。损失
    ~1000 步 Phase 1 训练（~1.5 GPU-hours）。
- id: M008
  date: '2026-05-20'
  category: experiment_design
  severity: high
  summary: save_interval=500 导致 checkpoint 撑爆 350GB 磁盘，A1 崩溃 + 3 baseline 濒危
  root_cause: save_interval 从 2000 改为 500（M004 事故后防进度丢失），但未配套 save_total_limit 限制
    checkpoint 数量。每个 checkpoint ~9GB，4 个实验并行产生 329GB checkpoint 占满 350GB 磁盘。过度矫枉——为防丢几千步进度，反而导致更大的磁盘灾难。
  prevention: save_interval 和 save_total_limit 必须成对设置。推荐：save_interval=2000 + save_total_limit=5
    + save_best_model=True（独立目录）。多实验并行时预估磁盘需求：实验数 × checkpoint_size × save_total_limit
    < 磁盘容量 × 80%。
  status: active
  context: A1 v3 在 step 6499 保存 checkpoint 时 No space left on device 崩溃。已过 Phase 2（step
    5000），最后成功 checkpoint step 6000 可恢复。3 个 baseline 进程仍活但下次 save 必崩。
  fix: 紧急清理旧 checkpoint 释放空间；所有实验改 save_interval=2000 + save_total_limit=5；A1 从 step
    6000 恢复。

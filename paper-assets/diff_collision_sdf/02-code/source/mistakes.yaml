- id: M029
  date: '2026-05-22'
  category: experiment_design
  severity: high
  summary: Fake safety 检测阈值不能跨模型机械套用——obstacle displacement < 0.1mm 对 action collapse
    模型和正常运动模型含义不同
  root_cause: Agent 对 Pi0.5 套用了与 A1/baseline 相同的 fake safety 检测逻辑（obstacle displacement
    < 0.1mm = fake safe），但 Pi0.5 的 safe episodes 是真实安全（机器人积极运动完成任务但未碰障碍物），不是 action
    collapse。导致 Pi0.5 real safe rate 被严重低估（报告为 0.5%，实际为 28%）。
  prevention: Fake safety 检测必须结合 robot displacement（机器人是否在动）和 obstacle displacement（障碍物是否被碰）两个维度。低
    obstacle displacement + 高 robot displacement = 真实安全；低 obstacle displacement +
    低 robot displacement = fake safety (action collapse)。
  status: active

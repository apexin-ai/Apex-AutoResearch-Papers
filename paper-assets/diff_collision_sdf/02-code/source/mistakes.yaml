mistakes:
- id: M001
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: Phase B Step 1 三个 critical 集成缺陷：import 路径、权重加载格式、数据格式全部不兼容
  root_cause: 多个 Worker 独立开发 pipeline 组件（数据转换、训练脚本、模型部署），各自验证了自己的组件可用，但没有端到端集成测试。具体：(1)
    baseline 训练脚本用 JAX 权重加载器但实际是 PyTorch pipeline (2) 数据 Worker 输出自定义 HDF5 但训练脚本期望
    LeRobot Parquet 格式 (3) import 路径硬编码错误。三个 bug 叠加意味着 baseline 训练会在多个环节崩溃。
  prevention: 多 Worker 并行开发 pipeline 组件时，必须在所有组件完成后、正式训练前执行一次完整端到端 dry-run（数据加载 →
    模型初始化 → 权重加载 → forward pass → loss 计算 → 1 step backward）。Director 在派发并行 Worker
    时应明确要求"集成验证 Worker"作为汇合点。
  status: active
  context: Phase B Step 1 派了 3 个并行 Worker（openpi deploy / data pipeline / baseline
    prep），各自报告"完成"但相互接口不匹配。Reviewer 逐个审查时才发现三层 bug 叠加。
  fix: 修复中：(1) import 已修 (2) 权重加载 Worker 进行中 (3) 数据格式需用 openpi 官方 convert_libero_data_to_lerobot.py
    重新转换
  related_decisions:
  - D004

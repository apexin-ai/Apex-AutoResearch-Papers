- id: M007
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: 误判 A1 batch_size=2 导致不必要的 kill 重启，浪费 ~1000 步训练
  root_cause: 仅凭 VRAM 差异（13.4GB vs 37.4GB）推断 batch_size 不同，未考虑 Phase 1 冻结 backbone

- id: M003
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: A1 训练脚本两个 critical bug：解冻全部 3.5B 参数而非 LoRA + 自定义训练循环缺少数据归一化
  root_cause: Worker 编写自定义训练循环时未完整复制 openpi train_loop 的内部逻辑：(1) 日志写 "unfreezing LoRA"
    但代码 unfreeze 全部参数 (2) create_data_loader 不包含 train_loop 中的归一化步骤。根因：自定义训练循环与框架内置
    train_loop 的行为差异未被测试覆盖。verify_a1.py 37 项检查全部 PASS 但未检查 action_loss 是否在合理范围——与
    M002 同类问题。
  prevention: 方案转变：不要写完全独立的自定义训练循环，而是修改/包装 openpi 的 train_loop 添加 SDF hook。如果必须自定义，verify
    脚本必须检查 action_loss 是否在预期范围（<1.0 for pretrained weights），且必须验证 trainable params
    数量与预期一致（LoRA ~26M，不是 3.5B）。
  status: active
  context: verify_a1.py 报告 37/37 PASS 但 action_loss=178.5（应为 ~0.2），说明验证 suite 缺少关键的
    loss 范围检查。unfreeze_backbone 解冻 3.5B 参数意味着 A1 与 baseline 不可比较（baseline 用 LoRA）。
  related_decisions:
  - D004
- id: M004
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: extra_delta_transform=True 对已是 delta 的 LIBERO 动作二次差分，所有 baseline 训练数据无效；seed
    0 跑了 2270 步作废
  root_cause: openpi LIBERO config 默认 extra_delta_transform=True（用于将绝对动作转为 delta），但
    LIBERO 动作本身已是 delta（速度指令）。二次差分产生近零值，用原始 delta 分布的 norm_stats 归一化后爆炸→巨大 MSE loss。seed
    0 的 loss"看似正常"是因为 norm_stats 在同样错误的分布上计算，掩盖了问题——但模型实际学的是二阶差分，生成的策略对机器人控制无意义。之前诊断为"权重未加载"是误判（M002），浪费了排查时间。
  prevention: (1) 使用新框架/数据集前，先验证数据变换链：打印原始动作 → 变换后动作的统计量（mean/std/range），确认物理含义正确
    (2) 不要仅凭 loss 数值判断训练正确——loss 低不代表学对了，需要检查模型输出是否有物理意义 (3) 排查 bug 时优先检查数据管道（变换/归一化），而非假设是权重/import
    问题
  status: active
  context: seed 0 从 step 0 到 step 2270 跑了约 2.2 小时全部作废。M002 的诊断"权重未加载"是错的，实际是数据变换问题。seed
    1/object 的 loss 爆炸（177/536）是同一 bug 但因 norm_stats 不匹配而显性暴露。
  fix: 设置 extra_delta_transform=False。seed 1 和 object_pudding 已用修复后配置重启。seed 0 需要
    kill 重启。
  related_decisions:
  - D004

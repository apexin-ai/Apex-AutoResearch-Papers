- id: M044
  date: '2026-05-25'
  category: code_bug
  severity: high
  summary: Filtered CAR 指标数学恒等式 bug：check_collision 用 L1 判碰撞，max_displacement 用 L2
    记录，L2≤L1 导致所有 safe episode 必然被判 frozen
  root_cause: check_collision 用 L1 范数阈值 0.001 判碰撞，max_displacement 用 L2 范数记录障碍物位移。由范数不等式
    L2≤L1，任何 collided=False 的 episode 其 max_displacement 必然 < 0.001，与 analyze_displacement.py
    的 frozen 阈值相同。导致 Filtered CAR ≡ 0% 是数学必然而非实验发现。更深层问题：max_displacement 度量的是障碍物位移而非末端执行器位移，无法区分"主动避障"和"冻结不动"。
  prevention: 1. 新增度量指标前先验证其与已有指标的数学独立性——如果新指标可由旧指标推导则无信息量。2. Displacement 分析应基于 EE（末端执行器）位移而非障碍物位移。3.
    引入新分析脚本后先在已知 ground-truth case 上验证（如 baseline 的 safe episode 应有非零 displacement）。
  status: active
  context: Reviewer 报告 30K Filtered CAR=0% 看似重大发现，实为度量 bug。所有基于 analyze_displacement.py
    的 frozen/action collapse 定量结论需用 EE displacement 重新验证。定性上 30K TSR 从 ~75% 降至 ~7%
    仍是 action collapse 的强证据，但定量 displacement 数据待修复。
  fix: 修复 eval_safelibero.py：新增 max_ee_displacement = max ||eef_pos_t - eef_pos_0||
    存入 JSON，用 EE 位移替代障碍物位移做 frozen 判定。

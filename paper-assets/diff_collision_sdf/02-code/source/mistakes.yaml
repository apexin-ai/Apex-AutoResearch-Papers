    先检查 CUDA_VISIBLE_DEVICES 和 --gpu 参数是否超出实际 GPU 编号范围，再考虑硬件故障。
  status: active
  context: A3 在 westd-45947 上多次"重启"失败，CUDA_ERROR_NO_DEVICE 被误诊为 GPU 硬件故障。实际上 GPU 完全健康，只是

    train_pytorch.py 权重加载逻辑被跳过。
  prevention: 每次启动新训练进程后，必须检查前 10 步 loss 是否在预期范围（对于预训练权重 fine-tune，initial loss 应在
    0.1-1.0 级别，不是 100+）。发现 loss 异常立即 kill 进程排查，不要让无效训练占 GPU。启动脚本应显式打印权重加载成功信息。

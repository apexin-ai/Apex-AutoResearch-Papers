- id: M016
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: Eval 连续三次失败：norm_stats 路径错、LoRA 加载 attribute error、LIBERO 交互式 input() 阻塞——导致
    MVP gate 被阻塞 8h+
  root_cause: 三层 bug 叠加：(1) eval 脚本未正确指定 norm_stats.json 路径 (2) eval 时 LoRA 加载代码与训练时不一致（GemmaModel
    attribute mismatch）(3) LIBERO __init__.py 在 import 时调用 input() 要求交互式输入数据集路径，非交互环境（tmux）下
    EOF 崩溃。每次只修一个 bug 就重跑，暴露下一个，串行排 bug 浪费时间。
  prevention: 1. Eval pipeline 首次运行前必须做完整 dry-run（在目标 GPU 上跑 1-2 episode），确认 import
    → model load → inference → metric 全链路通过。2. LIBERO 等第三方库需要检查 init 是否有交互式输入，预设 LIBERO_DATASET_DIR
    等环境变量。3. 修 bug 时先读完所有错误日志定位全部问题，一次性修复，不要逐个 fix-retry。

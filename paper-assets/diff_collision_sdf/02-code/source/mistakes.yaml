- id: M011
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: A1/Baseline 的 LoRA 实现与 openpi 框架不匹配——A1 LoRA 从未生效，Baseline 变成全参 fine-tune
  root_cause: openpi 的 freeze_filter 是 JAX/NNX filter，不会自动应用到 PyTorch 训练循环。A1 的 Phase
    2 用 `if "lora" in name` 搜索 PyTorch 参数名，但模型中无 LoRA 参数（未调用 inject_lora）。A3 因自建 inject_lora()
    手动注入 LoRA 参数而正常工作。代码审查时未发现 A1/Baseline 与 A3 的 LoRA 实现路径不同。
  prevention: 1. 每个训练脚本启动后前 100 步必须打印可训练参数名+数量，Director/Reviewer 验证是否符合预期。2. 多方法对比实验必须共享
    LoRA 注入代码（单一来源），不允许各脚本独立实现。3. 审批实验时要求 Agent 确认「可训练参数量与方法设计一致」。
  status: active
  context: A1 在 18K/30K 步时被发现。Loss 平台期（0.26→0.27）是冻结 backbone 的症状但被忽略了 7K 步。Baseline
    的 loss 从 0.2 降到 0.003 说明全参训练而非 LoRA（LoRA 一般不会降这么多）。A3 的 inject_lora() 在 line 117-145
    手动创建 lora_A/lora_B，正确工作。
  fix: 'D006: 停止 A1×2，移植 A3 的 inject_lora() 到 baseline 和 A1，启动 LoRA baseline×2'
  related_decisions:
  - D006

- id: D002
  date: 2026-05-19 16:19 UTC
  summary: 维持 D001 π0/openpi 决策，Worker 推荐 OpenVLA-OFT 被否决
  rationale: Worker 推荐 OFT 基于"ODE 多步梯度传播劣势"论点，但 Reviewer 修正：(1) 训练时 π0 不跑 ODE solver，单步去噪梯度回传无劣势；(2)
    推理时多步 ODE 反而是优势——每步去噪可注入 SDF gradient correction，实现迭代式轨迹优化，这是 IDEA_BRIEF 核心机制
    "SDF-gradient-guided action refinement" 的天然载体；(3) 2.5B vs 7B，MVP 快速迭代 π0 有 2-3x
    速度优势。OpenVLA-OFT 记录为工程 fallback。

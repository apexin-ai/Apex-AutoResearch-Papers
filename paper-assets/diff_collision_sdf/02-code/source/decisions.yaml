  rationale: 采纳 Reviewer 4 条 warning：(1) π0 flow matching 连续动作空间天然适配 SDF 梯度修正，OpenVLA
    autoregressive token 预测需额外离散→连续映射；(2) 10%-20% 成功率下降定义为 conditional pass 消除灰色地带；(3)
    Phase A 增加 3 个 kill gate（MuJoCo 版本、mesh 可访问性、梯度回传 toy test）；(4) 3 seeds × 50 episodes
    保证统计显著性。

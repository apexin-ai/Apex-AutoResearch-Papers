  date: 2026-05-22 20:54 UTC
  summary: Action-space EE-only SDF runtime refinement 方向终止：GT SDF oracle CAR (75%)
    低于 baseline (82-83%)，理论上界不成立
  rationale: True oracle 完整结果（40ep×4tasks, GT SDF + adaptive/fixed alpha）：adaptive
    CAR=75.0%, fixed CAR=73.1%，均低于 LoRA baseline 82% 和 full-FT baseline 83%。甚至低于 A3
    无 refine 77.1%——refinement 在主动降低 CAR。结构性原因：SDF 梯度推 EE 远离障碍物 → 改变末端轨迹 → arm body
    links 反而扫过障碍物。EE 安全 ≠ 机器人安全。Alpha 调优无法挽救（adaptive vs fixed 仅 2pp 差异）。Feature-space
    oracle 正在运行中作为 A3 最后检验点。

- id: D012
  date: 2026-05-22 23:43 UTC
  summary: 'D012: 锁定 Pi0.5+A1 pass/fail 操作定义——CAR≥33% + TSR≥50% + frozen_rate 不增 +
    记录 min EE-obstacle 距离'
  rationale: Reviewer 指出 D011 的 "real_CAR" 无操作定义，训练完成后无法判断 pass/fail。基于 M030（所有模型
    safe episodes 均为路径天然安全/action collapse），需要明确区分真实避障与虚假安全。采用 Reviewer Option C 变体：(1)
    CAR ≥ Pi0.5 baseline 28% + 5pp = 33%，证明整体碰撞率改善；(2) TSR ≥ 50%，证明任务能力保持；(3) frozen_rate(A1)
    ≤ frozen_rate(baseline)，排除 action collapse 驱动的虚假改善（frozen = 整个 episode robot displacement
    < 1mm）；(4) eval 脚本记录每步 min EE-obstacle distance，用于 post-hoc 分析是否存在真实避障行为（min distance
    < 20mm 但无碰撞 = 真实避障）。条件 1-3 全满足 = PASS，任一不满足 = FAIL。条件 4 是分析数据，不作 gate。
  related_experiments:
  - exp_id: eval_pi05_safelibero_object_v11
    role: baseline_reference
    result: CAR=28%, TSR=73%, 100% safe=fake
  depends_on:

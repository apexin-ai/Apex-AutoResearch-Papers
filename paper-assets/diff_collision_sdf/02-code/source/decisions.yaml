- id: D020
  date: 2026-05-25 07:41 UTC
  summary: 'D020: 30K TSR退化揭示safety-performance tradeoff——10K是当前最优checkpoint，λ_sdf=0
    Phase 2 ablation升为最高优先级'
  rationale: 30K中期数据：CAR维持(~55% vs 10K ~57%)但TSR显著退化(20-32% vs 10K 47-49%)。诊断：持续SDF
    auxiliary loss导致policy过度优先碰撞避免，牺牲task performance。这不是bug而是核心finding——揭示了auxiliary
    safety signal与policy learning的动态交互。直接推论：(1) 10K可能是safety-performance最优平衡点；(2)
    Phase-scheduled training (SDF warmup → task-only finetuning)是自然的mitigation方案，对应已计划的λ_sdf=0
    Phase 2 ablation。将该ablation从nice-to-have升为最高优先级，用cuda:2启动。λ=0.005跨seed一致优于λ=0.01(CAR

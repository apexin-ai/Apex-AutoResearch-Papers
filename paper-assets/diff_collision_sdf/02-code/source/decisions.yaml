- id: D047
  date: 2026-05-29 19:34 UTC
  summary: 'D047: 方法改进战略——Demo curation 为 P0 必做方向，SDF-as-observation 为 P1，Full-body
    SDF 和 CBF 暂不投入'
  rationale: 'Reviewer 系统评估 4 个方法改进方向。核心逻辑：25 个 negative results 的主要发现是"avoidance
    来自 demo imitation，非 geometric supervision"。方法改进应与该发现一致，而非挑战它（sunk cost 偏差风险）。


    P0 Demo curation：可行性 5/5，成本最低（1 周分析 + 2 周训练），风险极低。直接从 Claim 3 推导——既然 avoidance
    来自 demo，优化 demo 选择是逻辑直推。实验设计：collision-free demo ratio (25/50/75/100%) → CAR-TSR
    Pareto 曲线。即使 null result 也有诊断价值（demo distribution 边际效应饱和）。将论文从 diagnostic-only
    提升到 diagnostic + data-centric method。


    P1 SDF-as-observation：可行性 3/5，中等成本。唯一提供新信息通道（非新 training signal 或 post-hoc correction）的方向。SDF
    作为 proprioception 附加输入，模型自主决定如何利用。不确定性：pretrained encoder 可能忽略新输入维度。


    P2 Full-body SDF auxiliary：可能与 EE-only SDF 一样冗余——如果 demos 中人类操作员已隐式做了全身避障。需先从
    demo curation 分析中获取 arm-body 碰撞分布数据再决定。


    不推荐 CBF：与 gradient refinement 同范式（action space EE-only 结构限制），7 个相关 negative 已充分排除，成本最高。'
  related_experiments: []
  depends_on:
  - D043
  - D046

- id: D013
  date: 2026-05-23 00:04 UTC
  summary: 'D013: Lambda bracket 从 (0.005, 0.001) 调整为 (0.005, 0.01)——基于 Reviewer SDF
    贡献分析'
  rationale: 'Reviewer Report #19 分析 Phase 0 dry-run loss 分解：λ=0.005 时 SDF 仅占总 loss
    0.5%，λ=0.001 降至 0.1% 几乎被噪声淹没，30K 步白跑。调整为 λ=0.01（SDF ~1%），信号更强但 action collapse
    风险可控（原 A1 openpi 用 λ=0.1 才 severe collapse，0.01 远低于此）。Bracket (0.005, 0.01) 覆盖有用范围：0.01
    无效→方法问题非 lambda；0.01 collapse 但 0.005 不会→sweet spot 在此区间。'
  related_experiments: []
  depends_on:

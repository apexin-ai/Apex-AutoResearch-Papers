narrative_guidance: 'SDF 无增量、Phase 2 失败、泛化不足。Claim 4 砍为 negative result appendix。论文
  reframe 为 纯 evaluation methodology paper：(1) Claim 1 fake safety metric 缺陷仍成立（Pi0
  + Pi0.5 两个 model family，mechanistic argument 补泛化）；(2) displacement-filtered CAR
  作为核心 工具贡献；(3) "LoRA capacity sufficient, geometric supervision neither necessary
  nor sufficient" 作为有价值 negative finding；(4) Phase 2 不可逆损伤作为 cautionary finding。 Block
  5 改为 "what doesn''t work and why"。投 CoRL/ICRA，framing 完全聚焦 evaluation methodology。acceptance
  ~40-50%。

  '

    ## 7  Questions for Authors (consolidated, prioritized)


    1. **Equivalence testing**: Have you considered TOST to formally test SDF redundancy?
    What equivalence margin would you pre-register, and does n=3 provide adequate
    power?

    2. **SDF circularity**: Your oracle experiments show EE-only SDF fails structurally.
    You then test SDF redundancy using only EE-only SDF. How do you distinguish "geometric
    supervision is redundant" from "this EE-only formulation is too broken to help"?

    3. **dfCAR on published methods**: Can you apply dfCAR to AEGIS or any published
    safety method''s per-episode data? Even one such demonstration would substantially
    strengthen the metric contribution.

    4. **TSR collapse mechanism**: Is the 73% → 6% TSR collapse catastrophic forgetting,
    LoRA rank limitation, or inherent safety-task tradeoff? Have you tried standard
    mitigations (EWC, replay, lower LR)?

    5. **Bimodal gap universality**: Is the > 200 mm gap a property of SafeLIBERO
    workspace dimensions? Would it hold on benchmarks with smaller workspaces?

    6. **A1 reproducibility**: Can EE displacement be extracted from existing 800-episode
    logs (if joint positions were recorded)?



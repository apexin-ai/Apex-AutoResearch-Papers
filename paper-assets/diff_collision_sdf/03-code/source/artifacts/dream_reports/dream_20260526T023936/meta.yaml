    ## 9  Meta-Review / AC Summary


    This paper identifies a real and practically relevant problem: standard CAR is
    contaminated by action collapse in VLA models, and the proposed dfCAR metric is
    a clean, threshold-robust correction. The 99.6% fake safety rate on Pi0+SDF (A1)
    is a striking empirical finding.


    However, the paper falls short of the CoRL acceptance bar for three interconnected
    reasons:


    1. **The headline negative finding (SDF redundancy) is both underpowered and confounded.**
    With n=3 seeds and no equivalence testing, the data cannot formally support "zero
    effect." Worse, the SDF variant tested (EE-only) is already shown to be structurally
    deficient within the same paper, creating a circular argument.


    2. **The experimental scope is narrow relative to the generality of claims.**
    Two architecturally related models, one benchmark, two scenes (one single-seed),
    simulation only, and two blocked/cancelled experiments (OpenVLA, A1 re-eval) do
    not support claims about "VLA Safety Evaluation" in general.


    3. **The conceptual novelty is limited.** The core observation ("inaction inflates
    non-event metrics") is a well-known pattern in evaluation methodology. dfCAR is
    the most straightforward fix. The paper does not engage with extensive related
    literatures on specification gaming, imitation learning theory, or metric validity.


    **Path to acceptance**: (a) Apply dfCAR to published methods to demonstrate field-wide
    impact. (b) Test a non-deficient SDF variant (full-body or multi-link) to disambiguate
    the redundancy claim. (c) Use equivalence testing with adequate sample size. (d)
    Expand to at least one additional VLA architecture. (e) Analyze the TSR collapse
    mechanism. (f) Engage with specification gaming, IL theory, and safe RL literatures.


    **Estimated acceptance probability at CoRL 2026 in current form: 10–15%.**



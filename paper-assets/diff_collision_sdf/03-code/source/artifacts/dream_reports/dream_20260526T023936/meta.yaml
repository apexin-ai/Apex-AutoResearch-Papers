    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper identifies CAR contamination by action collapse, proposes dfCAR as a
    corrective, and demonstrates through ablation that collision avoidance arises
    primarily from implicit demonstration signals rather than explicit SDF supervision.
    The novelty rests on the empirical documentation of metric contamination and the
    decomposition of avoidance sources, rather than on methodological innovation.


    ### Strengths

    - **Fake safety observation is well-documented and impactful.** The 91.5% CAR
    / 0% TSR / 99.4% frozen finding is striking. Even if action collapse is conceptually
    unsurprising, demonstrating its magnitude of metric contamination is a genuine
    contribution.

    - **dfCAR threshold robustness is convincing.** The bimodal gap rendering dfCAR
    invariant across [2, 100]mm eliminates the threshold sensitivity objection. Simple,
    principled, and immediately usable.

    - **4-point lambda dose-response is well-designed.** The flat curve for λ≤0.01
    with jump at λ=0.1 provides structured evidence of a threshold effect.

    - **Honest limitation disclosure.** Appropriate for a diagnostic paper. The paper
    acknowledges scope restrictions and distinguishes discovery from validated method.

    - **Per-task breakdown provides mechanistic insight** beyond aggregate numbers.


    ### Weaknesses

    - **Action collapse is not novel; documenting its metric contamination is.** Action
    collapse / mode collapse is extensively documented in RL, generative modeling,
    and imitation learning. The contribution narrows to "CAR does not account for
    action collapse" — useful but closer to a benchmark/metrics paper than a conceptual
    advance. Title "Rethinking VLA Safety Evaluation" overstates this.

    - **Bibliography is critically deficient with fabricated entries.** Multiple placeholder
    references with "{Authors}" as author field. The project''s own literature map
    identifies 25+ real papers not cited. At CoRL, fabricated bibliography entries
    risk desk rejection.

    - **dfCAR is conceptually simple** — displacement thresholding + CAR. The bimodal
    gap that makes it robust is a property of this specific benchmark/model, not guaranteed
    for all VLA evaluations. Paper does not discuss partial-collapse scenarios.

    - **SDF redundancy has limited generalization scope.** EE-only SDF on Pi0.5 with
    LoRA on SafeLIBERO. The paper''s own analysis identifies the structural limitation.
    Framing "implicit demonstration signals, not explicit geometric supervision" as
    a general conclusion overgeneralizes from EE-only SDF to all geometric supervision.

    - **"Decomposition framework" is overstated.** This is a two-condition ablation
    (LoRA vs. LoRA+SDF), not a framework. A genuine decomposition would systematically
    disentangle data distribution, model capacity, training procedure, and geometric
    signal.

    - **Only 2 model families from the same Pi0 lineage.** The blocked OpenVLA experiment
    is a significant gap for a paper claiming to rethink VLA safety evaluation writ
    large.

    - **TSR collapse (73%→6%) not adequately analyzed.** Does not distinguish learned
    conservatism (safety-relevant) from catastrophic forgetting (fine-tuning artifact).


    ### Missing Related Work

    - Safe RL foundations: CPO (Achiam et al., ICML 2017), Lagrangian constrained
    MDPs

    - Action/mode collapse: Diffusion Policy (Chi et al., RSS 2023), Dong et al. (2025)
    loss collapse

    - Other geometric representations: C-space distance fields (Li et al., RSS 2024),
    full-body SDF

    - VLA foundations: RT-2, OpenVLA, Octo, LIBERO (proper citations needed)

    - Runtime safety: RAIL, TamedPUMA, APEX

    - Spatial/3D-aware VLAs: Spatial Forcing (ICLR 2026), QDepth-VLA

    - Metric validity: Goodhart''s law literature, benchmark saturation


    ### R2 Scores

    - Originality: 2/4

    - Significance: 2/4

    - Clarity: 3/4

    - Overall: **5/10**

    - Confidence: 4/5



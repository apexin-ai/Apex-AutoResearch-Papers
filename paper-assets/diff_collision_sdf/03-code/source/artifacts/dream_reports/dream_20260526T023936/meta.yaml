    6. **TSR collapse (73%→6%) insufficiently analyzed.** The most practically consequential\
    \ result receives superficial treatment. Is this catastrophic forgetting? Conservative\
    \ behavior? The mechanism matters for the conclusion.\n\n### Experiment Coverage\

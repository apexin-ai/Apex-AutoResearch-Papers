    \ reject\ntimestamp: 2026-05-26T03:32:59.705861+00:00\n---\n\n# Dream Review Report\
    \ — \"Rethinking VLA Safety Evaluation: When 98% of Collision Avoidance is an\
    \ Illusion\"\n\n**Dream ID:** 20260526T023936  \n**Venue:** CoRL 2026  \n**Review\
    \ Mode:** Full (2 Reviewers + Roundtable)  \n**Venue Calibration:** CoRL 2024\
    \ acceptance rate ~39%, 1–4 scoring scale. Review dimensions: Originality, Quality,\
    \ Clarity, Significance, Relevance to robot learning.\n\n---\n\n## I. Reviewer\
    \ R1 — Methods & Experiments\n\n### Summary\nThe paper identifies systematic contamination\
    \ in VLA collision avoidance evaluation: standard CAR conflates genuine obstacle\
    \ avoidance with action collapse (frozen robots scored as collision-free). The\
    \ authors propose dfCAR as a corrective metric, demonstrate that EE-only SDF refinement\
    \ structurally fails even with ground-truth geometry, and show that LoRA fine-tuning\
    \ on collision-free demonstrations produces genuine collision avoidance (+26pp\
    \ CAR) while SDF auxiliary loss adds nothing at standard λ and marginal benefit\
    \ at extreme λ.\n\n### Strengths\n- **The fake safety observation is genuine and\
    \ practically important.** The 6-order-of-magnitude gap in EE displacement between\
    \ frozen and active episodes (sub-micrometer vs. 200+ mm) makes dfCAR threshold\
    \ completely insensitive across δ∈[2mm, 200mm]. This bimodal structure is convincing\
    \ evidence that action collapse is a qualitatively distinct failure mode.\n- **Oracle\
    \ experiment design is methodologically sound.** Testing three oracle variants\
    \ (adaptive-alpha, fixed-alpha, feature-space SDF) with ground-truth geometry\
    \ cleanly separates representation quality from EE-only structural limitation.\
    \ Consistent negative results across all three variants is strong evidence.\n\
    - **Honest reporting of the negative result.** The LoRA-only attribution experiment\
    \ overturns the paper's original hypothesis. The 3-seed × 2-lambda comparison\
    \ showing LoRA-only CAR=52.8% vs. SDF λ=0.005 CAR=50.5% (p=0.24) with identical\
    \ per-task patterns is a clean null result.\n- **dfCAR is simple, well-defined,\
    \ and immediately adoptable.** Threshold invariance across 4 orders of magnitude\
    \ requires no calibration.\n- **Multiple converging evidence lines.** Fake safety\
    \ demonstrated across Pi0 and Pi0.5; EE-only limitation shown through 3 oracle\
    \ variants; SDF redundancy tested across 4 lambda values.\n\n### Weaknesses\n\
    - **Narrow benchmark scope undermines generalizability.** All primary experiments\
    \ use a single SafeLIBERO suite (object_pudding, 4 tasks) with one robot embodiment.\
    \ The spatial_bowl results critically lack the LoRA-only control (plan_015 never\
    \ completed). The claim \"SDF is redundant across scenes\" rests on a single scene.\n\
    - **Only two model families tested (Pi0, Pi0.5), both from the same architecture\
    \ lineage.** No OpenVLA, RT-2, or other architecture tested. The central claim\
    \ that fake safety is a general VLA problem requires broader evidence.\n- **Statistical\
    \ power is marginal throughout.** 3 seeds × 200 episodes per condition. The one-sided\
    \ p=0.24 for LoRA vs. SDF λ=0.005 cannot reject the null, but the power to detect\
    \ a meaningful 5pp effect is also low at n=3. λ=0.1 tested with only 2 seeds.\
    \ Phase 2 uses 2 seeds. For a paper whose central claim is a null result, the\
    \ burden of proof is higher than demonstrated. A formal equivalence test (TOST)\
    \ is needed.\n- **TSR collapse (73%→6%) not adequately analyzed.** The paper attributes\
    \ this to \"conservative behavior\" but does not distinguish from catastrophic\
    \ forgetting. Since both LoRA-only and LoRA+SDF show identical collapse, this\
    \ is the most practically consequential result but receives insufficient analysis.\n\
    - **Phase 2 results are preliminary.** 2 seeds, mean CAR=59.5%, p=0.12 vs. LoRA-only.\
    \ Neither conclusion (real effect vs. noise) is supported at this sample size.\n\
    - **No real-robot validation or sim-to-real discussion.** The dfCAR threshold\
    \ of 0.1mm is calibrated for MuJoCo where actuator noise is effectively zero.\
    \ Real-world sensor noise could require recalibration.\n\n### Questions for Authors\n\
    1. Can you provide a formal equivalence test (TOST) for the SDF redundancy claim?\
    \ What minimum detectable effect size at 80% power with n=3?\n2. Do you have any\
    \ evidence, even indirect, that the +22pp CAR gain over baseline in spatial_bowl\
    \ is attributable to LoRA rather than SDF? Without this, cross-scene generalization\
    \ of Claim 4 is unsupported.\n3. Is the 73%→6% TSR drop consistent with standard\
    \ catastrophic forgetting curves (monotonic decay with training steps)? Did you\
    \ analyze per-task TSR as a function of training steps?\n4. Have you applied dfCAR\
    \ to published results from other VLA safety papers? Even a discussion of what\
    \ published systems would look like under dfCAR would strengthen the contribution.\n\
    5. Why only object_pudding Level I? SafeLIBERO includes multiple difficulty levels\
    \ and scene types.\n\n### Scores (R1)\n| Dimension | Score | Rationale |\n|-----------|-------|-----------|\n\
    | Overall | **2 (Reject)** | Core observation valuable but experimental scope\
    \ too narrow for claim generality. Missing controls, marginal statistical power\
    \ for null result, incomplete draft. |\n| Soundness | 2 | Fake safety diagnosis\
    \ and oracle experiments are sound. SDF redundancy null result lacks adequate\
    \ power (n=3, no equivalence testing). Phase 2 preliminary (n=2). Missing spatial_bowl\
    \ control. |\n| Significance | 3 | If fake safety generalizes beyond Pi0/SafeLIBERO\
    \ (plausible but unverified), it has immediate practical impact. dfCAR is adoption-ready.\
    \ SDF redundancy finding could redirect community effort. |\n| Clarity | 2 | Written\
    \ sections are clear and well-structured, but paper has incomplete elements (placeholders,\
    \ missing figures, outdated sections contradicting current claims). |\n| Confidence\
    \ | 4 (Expert) | Familiar with VLA architectures, SDF collision methods, SafeLIBERO,\
    \ and relevant statistical methodology. |\n\n---\n\n## II. Reviewer R2 — Novelty\
    \ & Related Work\n\n### Summary\nThe paper identifies metric contamination in\
    \ VLA safety evaluation (action collapse inflating CAR), proposes dfCAR to correct\
    \ it, demonstrates EE-only SDF structural failure, and shows LoRA fine-tuning\
    \ alone drives collision avoidance while SDF is redundant. All conditions suffer\
    \ catastrophic task performance collapse.\n\n### Strengths\n- **The fake safety\
    \ finding is well-documented and useful.** The demonstration that action collapse\
    \ *systematically contaminates the primary evaluation metric* is a genuine contribution,\
    \ even if action collapse itself is individually known.\n- **Oracle SDF experiments\
    \ are well-designed.** Testing three distinct oracle variants with ground-truth\
    \ geometry eliminates prediction-error explanations and isolates the fundamental\
    \ EE-only scope limitation.\n- **The writing is direct and technically precise\
    \ in diagnostic sections.** The introduction opens effectively and the paper generally\
    \ avoids overclaiming.\n- **The negative SDF redundancy finding is scientifically\
    \ valuable.** Showing the avoidance signal comes from demonstration imitation\
    \ rather than geometric supervision challenges a natural assumption.\n- **dfCAR\
    \ threshold invariance is elegant.** The six-order-of-magnitude displacement gap\
    \ eliminates threshold tuning entirely.\n\n### Weaknesses\n- **Related work is\
    \ severely underdeveloped.** Only 5 references in the submitted draft. Critical\
    \ omissions include:\n  - SafeVLA (Zhang et al., NeurIPS 2025): most direct competitor,\
    \ uses constrained MDP for VLA safety. Do their reported CAR numbers suffer from\
    \ the same contamination?\n  - Configuration-space distance fields (Li et al.,\
    \ RSS 2024): directly addresses the EE-only SDF limitation by working in C-space.\n\
    \  - RAIL (Jung et al., ICRA 2025), TamedPUMA (Bakker et al., L4DC 2025): runtime\
    \ safety filtering methods providing contrasting approaches.\n  - The paper needs\
    \ a systematic taxonomy: post-hoc correction vs. constrained optimization vs.\
    \ inference-time guidance vs. training-time supervision.\n- **Novelty of dfCAR\
    \ is limited.** Filtering a safety metric by displacement to exclude degenerate\
    \ episodes is straightforward. For a CoRL main track paper, the methodological\
    \ contribution needs to be either technically deeper or empirically broader. Currently\
    \ it is neither.\n- **Generalizability is a critical unaddressed weakness.** All\
    \ evidence comes from SafeLIBERO with Pi0/Pi0.5. No experiments on OpenVLA, RT-2,\
    \ Octo, or any non-Pi0-family model. For an evaluation methodology paper, the\
    \ methodology should be validated across the models it claims to evaluate.\n-\
    \ **SDF redundancy claim is underpowered.** p=0.24 and p=0.48 do not support the\
    \ *absence* of an effect — they merely fail to reject the null. A formal equivalence\
    \ test (TOST) with pre-specified equivalence margin is needed. The paper states\
    \ SDF contributes \"0 additional percentage points\" but confidence intervals\
    \ likely include meaningful effects in both directions.\n- **Capability-safety\
    \ anti-correlation (Section 4.4) is trivially obvious.** Models that move more\
    \ collide more. This should be a motivating paragraph, not a standalone claim.\n\
    - **Missing spatial_bowl LoRA-only control undermines cross-scene claims.**\n\n\
    ### Questions for Authors\n1. Have you tested dfCAR on any non-Pi0-family VLA?\
    \ Even zero-shot evaluation of OpenVLA with displacement logging would substantially\
    \ strengthen generalizability.\n2. Can you provide formal equivalence tests (TOST)\
    \ for the SDF redundancy claim?\n3. How do you distinguish \"genuine collision\
    \ avoidance\" from \"the model learned conservative/hesitant behavior\"? The EE\
    \ displacement ~0.48m shows the robot moves, but does it move *around* obstacles\
    \ or just less aggressively overall? Per-trajectory visualization or nearest-obstacle-distance\
    \ analysis during active episodes would help.\n4. Why does LoRA-only improve CAR\
    \ by +26pp over baseline? If collision-free demo filtering biases the learned\
    \ behavior toward conservative trajectories, this is data curation, not genuine\
    \ safety learning. This mechanism should be discussed.\n5. The title \"98% of\
    \ Collision Avoidance is an Illusion\" — this is demonstrated only on Pi0/Pi0.5\
    \ on SafeLIBERO. Does the claim extend to other pipelines?\n\n### Scores (R2)\n\
    | Dimension | Score | Rationale |\n|-----------|-------|-----------|\n| Overall\
    \ | **2 (Reject)** | Core finding useful but insufficiently novel for main conference.\
    \ dfCAR is technically trivial. Experimental scope too narrow for claim breadth.\
    \ Paper visibly incomplete. |\n| Novelty | 2 | Fake safety observation is a useful\
    \ diagnostic rather than a methodological advance. dfCAR is a simple threshold\
    \ filter. SDF redundancy finding is interesting but underpowered. |\n| Significance\
    \ | 3 | If fake safety generalizes, meaningful impact on VLA safety evaluation.\
    \ Recommendation to report both CAR and dfCAR is practical and easy to adopt.\
    \ |\n| Clarity | 2 | Diagnostic sections well-written. Paper incomplete with placeholder\
    \ values, missing figures, inconsistent framing between sections. |\n| Confidence\
    \ | 3 | Familiar with VLA evaluation, SDF collision avoidance, and SafeLIBERO.\
    \ Main uncertainty: whether fake safety is as prevalent as claimed beyond Pi0+SafeLIBERO.\
    \ |\n\n---\n\n## III. Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\n**R1\
    \ after reading R2:**\n- Agrees related work is severely underdeveloped; 5 references\
    \ is inadequate for CoRL\n- Concurs the capability-safety anti-correlation is\

    ---


    # Dream Review Report — "Rethinking VLA Safety Evaluation: When 98% of Collision
    Avoidance is an Illusion"


    **Target venue**: CoRL 2026 (rating scale 1–10; acceptance rate ~28–33%)

    **Review mode**: full (2 Reviewers → 4-step roundtable)

    **dream_id**: 20260526T023936


    ---


    ## 1  Roundtable Process Summary


    | Step | Description |

    |------|-------------|

    | Step 1 | Independent reviews: R1 (methods + experiments) and R2 (novelty + related
    work) |

    | Step 2 | Cross-sharing: each reviewer read the other''s review |

    | Step 3 | Convergence discussion: areas of agreement/disagreement identified
    |

    | Step 4 | This consolidated report |


    **Final scores**: R1 = 4/10, R2 = 4/10. Both maintained ratings after cross-reading.


    ---


    ## 2  Paper Summary


    The paper makes four claims:


    1. **Fake safety**: Standard CAR is contaminated by action collapse. A Pi0+SDF
    model (A1) reports 91.5% CAR, but 99.6% of "safe" episodes have obstacle displacement
    < 0.1 mm and TSR = 0%.

    2. **dfCAR metric**: A displacement-filtered CAR that excludes frozen episodes
    (EE displacement < δ). Threshold-robust due to bimodal gap > 200 mm.

    3. **SDF redundancy**: LoRA fine-tuning on collision-free demonstrations alone
    produces +29 pp genuine CAR. Adding SDF auxiliary loss contributes 0 additional
    pp across a 4-point λ curve (0, 0.005, 0.01, 0.1). Confirmed across 2 scenes.

    4. **Phase 2 persistence**: SDF training (10K steps) followed by 20K steps without
    SDF → model reverts to LoRA-only baseline. Zero persistent effect.


    ---


    ## 3  Consolidated Strengths (agreed by both reviewers)


    - **Quantitative rigor on the diagnostic claim (Claim 1)**: 800 episodes for A1,
    per-episode obstacle displacement analysis, dual evidence chain (obstacle displacement
    + TSR = 0%). The 99.6% fake safety rate is striking and communicates severity
    effectively.

    - **dfCAR threshold robustness**: The bimodal gap (> 200 mm between frozen and
    active modes) makes dfCAR genuinely threshold-insensitive across δ ∈ [2, 200]
    mm. This is a clean property.

    - **4-point λ dose-response curve**: Correct experimental design for testing dose-independence.
    Flat curve (slope = −0.3, R² = 0.12) across a 20× range is convincing within its
    scope.

    - **Honest negative result reporting**: The paper does not hide the SDF redundancy
    finding or the catastrophic TSR collapse.

    - **Clear writing and logical narrative arc**: The flow from fake safety → dfCAR
    → attribution → SDF redundancy is well-structured.


    ---


    ## 4  Consolidated Weaknesses


    ### 4.1  Statistical Power (R1 primary, R2 concurs)


    The SDF redundancy claim (Claim 3) is the paper''s headline finding but is critically
    underpowered:


    - **n = 3 seeds per condition**: The Welch t-test (Δ = −2.4 pp, p = 0.35) has
    very low power. The 95% CI on the LoRA-vs-SDF difference likely spans ~[−7, +2]
    pp, so the data cannot distinguish "0 pp effect" from "5 pp effect."

    - **No equivalence testing**: The paper claims "SDF contributes 0 pp" but uses
    absence-of-significance as evidence-of-absence. A formal TOST equivalence test
    with a pre-registered margin is needed; current n almost certainly lacks power
    to pass one.

    - **Phase 2 uses only 2 seeds**: Claiming "zero persistent effect" from n = 2
    is statistically irresponsible.

    - **spatial_bowl is single-seed per condition**: The cross-scene "replication"
    (Δ = +2 pp, n.s.) is effectively anecdotal.


    ### 4.2  Circular SDF Redundancy Design (R2 primary, R1 concurs after cross-reading)


    The paper establishes that EE-only SDF has fundamental structural defects (Section
    4.7: misses arm-body collisions, gradient direction misaligned with action space).
    It then tests SDF redundancy using *only* EE-only SDF. This is circular: showing
    that a known-deficient method adds nothing is uninformative about whether geometric
    supervision in general is redundant. The paper cannot distinguish between:


    - "Geometric supervision is fundamentally redundant for VLA collision avoidance"
    (strong, novel)

    - "This particular EE-only SDF formulation is too limited to help" (weak, expected)


    The title and framing imply the strong claim; the evidence supports only the weak
    one.


    ### 4.3  Narrow Experimental Scope vs. Broad Claims (both reviewers)


    - **2 model families** (Pi0, Pi0.5 — architecturally related, same family)

    - **1 benchmark** (SafeLIBERO)

    - **2 scenes** (object_pudding primarily; spatial_bowl single-seed)

    - **Simulation only** (no real-robot validation)

    - **OpenVLA blocked** (model download failures, acknowledged as limitation)


    The title ("Rethinking VLA Safety Evaluation") and claims ("SDF geometric supervision
    is redundant") are stated at a generality the evidence cannot support. The mechanistic
    argument for Claim 1 (any frozen model gets high CAR) is general, but Claims 3–4
    are specific to EE-only SDF on SafeLIBERO with Pi0-family models.


    ### 4.4  Conceptual Novelty (R2 primary)


    - **"Frozen robot = high safety score"** is a specific instance of Goodhart''s
    Law / specification gaming / reward hacking by inaction, extensively documented
    in safe RL literature (Amodei et al. 2016; Krakovna et al. 2020; Skalse et al.
    2022). The observation is real but not conceptually new.

    - **dfCAR** is the most straightforward possible fix: "check if the robot moved
    before crediting it with safety." No alternative metrics explored, no connection
    to measurement theory or construct validity, no formal analysis of failure modes.

    - **"Demonstrations encode avoidance"** is expected from imitation learning theory
    — if collision-free demonstrations are the training data, behavioral cloning learns
    collision-free behavior. The paper does not engage with IL literature (DAgger,
    MaxEntIRL, causal confusion).


    ### 4.5  Missing Application to Published Methods (both reviewers)


    The paper proposes dfCAR as a community metric but never applies it to any prior
    method (AEGIS, SafeVLA, CAPE, etc.). Demonstrating that dfCAR changes the relative
    ranking or conclusions about existing published safety methods would dramatically
    strengthen the practical impact. Without this, the metric''s value is speculative.


    ### 4.6  Reproducibility and Internal Consistency (R1 primary, R2 concurs)


    - **A1 checkpoint deleted**: The primary Claim 1 evidence (800 episodes) cannot
    be reproduced.

    - **Internal metric inconsistency**: dfCAR is defined using EE displacement, but
    the A1 analysis uses obstacle displacement. Two different filtering paradigms
    are used without reconciliation.


    ### 4.7  TSR Collapse Underanalyzed (both reviewers)


    Fine-tuning produces +29 pp CAR but −68 pp TSR (73% → 6%). This catastrophic task
    performance collapse may be the most practically important finding — any method
    that destroys task success is unusable in deployment. Yet it receives minimal
    mechanistic analysis. Is this catastrophic forgetting? LoRA rank insufficiency?
    Distribution shift? The paper treats it as a footnote when it should be a central
    discussion point.


    ---


    ## 5  Related Work Gaps (R2)


    The paper''s related work section is thin relative to the breadth of its claims.
    Key missing areas:


    | Area | Missing References/Topics |

    |------|--------------------------|

    | Metric validity / Goodhart''s Law | Specification gaming (Krakovna et al. 2020),
    reward hacking (Skalse et al. 2022) |

    | Conservative/frozen policy failure | Offline RL conservatism (CQL, BCQ), risk-averse
    policy collapse |

    | Safe RL | CPO (Achiam et al. 2017), Lagrangian CMDP methods |

    | Full-body collision | Configuration-space distance fields, whole-body planning
    (MoveIt, TrajOpt) |

    | IL theory on demonstration content | DAgger (Ross et al. 2011), MaxEntIRL (Ziebart
    et al. 2008), causal confusion (de Haan et al. 2019) |

    | Phase 2 / curriculum learning | Scheduled auxiliary losses, progressive training
    (Bengio et al. 2009) |

    | Other VLA safety benchmarks | RoboCasa, BEHAVIOR, or other safety-adjacent evaluations
    |


    ---



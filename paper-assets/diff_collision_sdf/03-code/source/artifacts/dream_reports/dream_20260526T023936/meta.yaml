  CAR=55% ≥ SDF CAR=52%. The paper is now a pure diagnostic/analysis paper. Key narrative:
  (1) fake safety metric contamination, (2) dfCAR corrective metric, (3) fine-tuning
  produces real avoidance from implicit demo signals not geometric supervision, (4)
  SDF is redundant — a valuable negative finding. Evaluate whether this diagnostic-only
  framing with negative SDF result is viable for CoRL 2026.'

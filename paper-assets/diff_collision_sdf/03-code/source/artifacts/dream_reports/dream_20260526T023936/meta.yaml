    # Dream Review Report: Rethinking VLA Safety Evaluation


    **Dream ID:** 20260526T023936

    **Venue:** CoRL 2026 (rating scale 1-10, acceptance rate ~40%)

    **Review Mode:** Full (2 Reviewers + Roundtable)


    ---


    ## Reviewer Assignments

    - **R1:** Methods and Experiments (Soundness, Statistical Rigor, Experimental
    Coverage)

    - **R2:** Novelty and Related Work (Originality, Positioning, Contribution Scope)


    ---


    ## R1 Review: Methods and Experiments


    ### Summary

    The paper diagnoses systematic contamination of CAR by action collapse ("fake
    safety"), proposes dfCAR, and conducts ablations decomposing collision avoidance
    into implicit demonstration signals vs. explicit SDF geometric supervision across
    6000+ episodes. The central experimental finding is that LoRA fine-tuning alone
    accounts for the dominant avoidance signal (+29pp CAR), with SDF adding nothing
    at low lambda but +15.5pp at lambda=0.1 (p<0.02). A two-phase curriculum partially
    resolves the safety-capability tradeoff (CAR=66%, TSR=40%).


    ### Strengths

    - **Well-designed fake safety diagnosis.** The 800-episode A1 evaluation with
    per-episode displacement analysis provides compelling evidence. The dual evidence
    chain (99.4% obstacle displacement <0.1mm AND TSR=0%) is methodologically sound.
    The bimodal displacement gap spanning 3+ orders of magnitude makes the finding
    robust.

    - **dfCAR threshold robustness is thorough.** Invariance across δ∈[2mm, 100mm]
    cleanly separates fake from real safety and eliminates the threshold sensitivity
    objection.

    - **3v3 seed design for SDF attribution (Table 4) is the correct structure.**
    Matched seed counts with separate SEs and per-lambda p-values follows good practice.

    - **Honest reporting of negative results.** The paper does not hide inconvenient
    findings (cross-scene inconsistency, OpenVLA blocking, high LoRA variance).

    - **Large cumulative experimental effort.** 6000+ episodes, multiple lambda values,
    cross-scene validation, two-phase ablation.


    ### Weaknesses

    - **3v3 comparison is critically underpowered for a null-result claim (Table 4).**
    With n=3 seeds, effective df for Welch t-test is ~2-4. LoRA SD=6.5pp (SE=3.7pp)
    → 95% CI on LoRA-SDF difference at λ=0.005 spans roughly [-8pp, +10pp]. Cannot
    distinguish "SDF adds 0pp" from "SDF adds 5pp." No formal equivalence test (TOST)
    with pre-specified margin. Treating absence-of-significance as evidence-of-absence
    is a classic statistical error.

    - **Lambda=0.1 result (+15.5pp, p<0.02) based on only 2 seeds.** With 2-3 effective
    df, p<0.02 has fragile coverage. A single additional seed could push p above 0.05.
    The 10x jump from λ=0.01 to λ=0.1 with no intermediate values (0.03, 0.05, 0.07)
    leaves the dose-response curve severely under-sampled.

    - **Two-phase training uses only 2 seeds.** CAR=66% (SE~2pp), TSR=40% (SE~2pp).
    95% CI on TSR spans ~[36%, 44%]. Only one Phase 1 duration (10K) and one lambda
    (0.005) tested — no ablation over Phase 1 hyperparameters.

    - **Cross-scene results (Table 7) are inconsistent and single-seeded.** SDF effect:
    +0.8pp (ns) on object_pudding vs. +9pp (marginal) on spatial_bowl. With n=1 per
    condition for spatial_bowl, cannot distinguish genuine scene effects from seed
    noise.

    - **dfCAR introduces potential selection bias.** Excluding low-displacement episodes
    conditions on a post-treatment variable. If SDF training changes the displacement
    distribution, dfCAR could create or mask treatment effects. Not discussed.

    - **EE-only SDF circularity.** The paper demonstrates EE-only SDF is structurally
    deficient, then tests SDF redundancy using only EE-only SDF. Cannot distinguish
    "geometric supervision is fundamentally redundant" from "this particular formulation
    is too limited to help at low doses."

    - **OpenVLA blocked.** Only projected values reported. Weakens generalization
    claim to 2 model families from the same Pi0 lineage.

    - **Statistical methodology unreported.** No specification of which test was used,
    degrees of freedom, or confidence intervals — only p-values.


    ### Questions for Authors

    1. What specific test produced the p-values in Tables 4-5? Report test statistic,
    df, and 95% CIs. Have you considered TOST equivalence testing?

    2. Have you tested intermediate lambda values (0.03, 0.05, 0.07)? Is the jump
    at λ=0.1 a smooth transition or phase change?

    3. How do you reconcile "SDF adds nothing at low lambda" with "SDF adds 15.5pp
    at high lambda" — is SDF redundant or under-dosed?

    4. The TSR collapse (73%→5%) is identical across LoRA-only and all SDF variants.
    Is this catastrophic forgetting from fine-tuning on filtered demos? Have you tried
    standard mitigations (EWC, replay, lower LR)?

    5. Does dfCAR filtering change the proportion of episodes differently across conditions?


    ### Missing Experiments

    - Intermediate lambda values (0.03, 0.05, 0.07) to characterize dose-response

    - Third seed for lambda=0.1 and Phase 2 conditions

    - spatial_bowl LoRA-only control (plan_015)

    - OpenVLA evaluation (even zero-shot)

    - Phase 2 ablation over Phase 1 duration and lambda

    - Real robot validation or discussion of dfCAR in noisy settings

    - Application of dfCAR to published safety methods (AEGIS, SafeVLA)


    ### R1 Scores

    - Soundness: 2/4

    - Significance: 2/4

    - Clarity: 3/4

    - Overall: **4/10**

    - Confidence: 4/5



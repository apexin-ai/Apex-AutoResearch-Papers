tier: median
narrative_guidance: 'Claim 4 从 "SDF is redundant" 降级为 "SDF is largely redundant at
  typical lambda

  (≤0.01); extreme lambda (0.1) shows marginal, statistically ambiguous CAR benefit

  (~+6pp) that does not justify added complexity." Phase 2 弱持久性信号需承认但 frame

  为 "weak and practically insignificant — TSR remains collapsed at 16.5%."

  LoRA seed2 拉低 3-seed 均值至 52.8%，3v3 one-sided p=0.24，无法 claim "statistically

  indistinguishable" 但差异无实际意义。论文叙事从 "clean negative" 变为 "predominantly

  negative with boundary conditions." Claims 1-3 不受影响。dfCAR threshold 在

  δ∈[2mm,200mm] 完全稳定。spatial_bowl 缺少 LoRA control 无法做跨场景 SDF 归因。

  CoRL 估算 45-55%。需补充一段 discussion 解释 lambda dose-response 的 ceiling

  和 practical implications。Claim 4 措辞加 hedging: "largely redundant" /

  "provides no practically significant benefit at standard hyperparameter ranges."

  '

    sdf_l01_dfCAR_all_thresholds: 52.7
    pi05_baseline_raw_CAR: 27.0
    pi05_baseline_dfCAR_all_thresholds: 27.0
    threshold_invariance_range: 2mm - 200mm
    min_active_ee_disp_lora: 0.239
    max_frozen_ee_disp_a1: 0.001
  result_rationale: 'dfCAR threshold 稳定的根本原因是 EE displacement 分布的极端双峰性:


    (1) A1 (Pi0 full fine-tune, action collapse): 所有 safe episodes 的 EE

    displacement < 1μm (median ~5nm)。只有 3/732 safe episodes 的 disp

    在 0.1-1mm 范围。因此, 任何 δ ≥ 2mm 都会 filter out 几乎所有 safe

    episodes, 只留下碰撞 episodes 中的极少数。dfCAR 从 91.5% 骤降至 <1%。


    (2) LoRA-only / SDF (Pi0.5 fine-tune, real movement): 所有 episodes

    的 EE displacement > 239mm (最小值)。任何 δ ≤ 200mm 都不会 filter

    out 任何 episode。dfCAR = raw CAR, 完全不受 threshold 影响。


    (3) Pi0.5 baseline (no fine-tune, natural movement): 类似 LoRA/SDF,

    所有 episodes 有高 EE displacement (geometric path safety, not action

    collapse)。dfCAR = raw CAR。


    这个 "giant gap" (1μm vs 239mm, 6 orders of magnitude) 意味着

    dfCAR 在 δ ∈ [2mm, 200mm] 范围内完全不变。这不是巧合, 而是 VLA

    行为的 fundamental bimodality 的体现: 模型要么完全冻结 (action collapse),

    要么正常运动。没有 "partial movement" 的中间状态。


    这使 dfCAR 成为一个非常 robust 的指标——不需要精心选择 threshold。

    '

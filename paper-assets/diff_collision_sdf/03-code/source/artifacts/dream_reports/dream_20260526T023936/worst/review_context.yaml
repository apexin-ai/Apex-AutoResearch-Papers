- name: spatial_bowl LoRA-only control
  plan_id: plan_015
  description: 在 spatial_bowl 场景训练 LoRA-only，完成跨场景归因
  expected_results:
    avg_TSR: 1.0
    avg_CAR: 36.0
    avg_ee_displacement: 0.32
    frozen_pct: 0
    n_episodes: 200
  result_rationale: 'worst 档核心假设：spatial_bowl SDF CAR (~45%) vs LoRA CAR (~36%) →
    delta = +9pp。 但这与 object_pudding 的 delta ≈ 0pp 不一致——跨场景 SDF effect 不一致。

    机制解释：spatial_bowl 的 bowl 在桌面不同位置(between plates, on ramekin, on stove, on cabinet)，碰撞
    geometry 更多样。LoRA implicit signal 在 spatial_bowl 中 效果较弱(CAR=36% vs object_pudding
    55%)，因为 demo 中的避障 pattern 在不同 spatial layout 下 generalize 更差。SDF geometric supervision
    在这种情况下 提供了额外的 layout-specific 避障信号，所以 delta 为正(+9pp)。

    但统计显著性存疑：spatial_bowl 仅 1 seed SDF + 1 seed LoRA， p-value 计算需要 bootstrap 或 per-task
    pairing，预期 p ∈ [0.05, 0.15]—— marginal significance at best。

    这个 pattern 不一致性(object_pudding: delta=0, spatial_bowl: delta=+9pp) 使得跨场景 generalization
    claim 不可行。论文必须 acknowledge： "SDF contribution is scene-dependent; in geometry-diverse
    scenes, SDF may provide additional benefit beyond implicit demo signals, but this
    effect is not universal."


    分析。 A1 safe episodes 的 EE displacement 在 微米级 (0.001-0.01mm)，所以 2mm-100mm 任何 threshold
    都会 filter 掉所有 safe episodes → dfCAR ≈ 0.4% (仅 3/732 real safe episodes 的 EE disp
    > 0.1mm)。

    LoRA/SDF models 的 safe episodes EE displacement ~0.35-0.58m (全部 >100mm)， 所以任何

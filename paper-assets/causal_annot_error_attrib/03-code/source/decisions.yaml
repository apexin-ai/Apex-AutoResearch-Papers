decisions:
- id: D001
  date: 2026-05-20 07:25 UTC
  summary: MVP PASS — Confounding DAG K=3 理论框架验证通过，进入 research 阶段
  rationale: 三项 pass 标准全部满足：(1) 理论预测 vs MC 95% CI 一致 5/5，(2) 所有非差异性 C 产生远离零偏差 0.20-0.30，(3)
    二分类折叠偏差与三分类预测显著不同（最大 Δ=0.089）。附加发现：100k 随机 C 矩阵搜索在 confounding DAG 下未发现方向反转——偏差始终与
    OVB 同向。这是有价值的 characterization result：confounding DAG 偏差方向可预测（单调），方向反转假设需要在其他
    DAG 拓扑（mediator、collider）中验证，属于 research 阶段的核心任务。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-20 07:30 UTC
  summary: Research 阶段第一优先级：exposure misclassification DAG K=3 验证 bias-toward-null
    是否在多分类下打破
  rationale: Reviewer 指出 MVP criterion 2 在 confounding DAG 下不具区分力（二分类也 pass）。"Bias
    toward null" 保证（Bross 1954）特指 exposure 误分类，正确测试需要 exposure DAG（A→Y，用 A* 替代 A）。若
    K=3 下此 DAG 出现方向反转或 bias-away-from-null 结构性差异，则 Claim 1 最强形式成立；若不出现，需重新框定核心 claim。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-20 07:31 UTC
  summary: plan_001 完成后设 checkpoint gate：方向反转拓扑数 → framing 版本选择
  rationale: 'Reviewer [severity: critical] 指出 plan_001 是存在性检验但无 kill criterion。当前
    core insight 依赖方向反转（"binary guarantee breaks"），但 MVP 已证明 confounding DAG 无反转。若
    6 拓扑全无反转，framing 需 pivot。三级响应：(A) ≥2 拓扑有反转 → 当前 framing 成立，方向反转为 lead finding；(B)
    1 拓扑有反转 → 该拓扑为 lead case，framing 可调整；(C) 0 拓扑有反转 → pivot 到版本 B："multi-class 偏差
    magnitude 不可由 binary 推算 + binarization 本身有害"，方向反转降为 topology-specific finding。注意：0
    反转 ≠ 项目 kill——binarization inequality + magnitude unpredictability + ASVs 本身够一篇论文，但
    framing 必须诚实。'
  related_experiments:
  - exp_id: plan_001
    role: gate
    result: pending
  depends_on:
  - D001
  - D002
- id: D004
  date: 2026-05-20 07:39 UTC
  summary: D003 checkpoint 提前解决：Version A 成立，exposure DAG K=3 确认方向反转（85% random C）
  rationale: Exposure misclassification DAG 结果：100k 随机 C 矩阵中 85% 违反 bias-toward-null，83.4%
    产生符号反转，14.1% 产生效应放大。K=2 对照全部 toward null（6/6）。最极端案例：β_1=1.0 → γ̂_1=-0.84（符号反转
    2.83x）。机制清晰：近置换 C 导致标签交换直接翻转效应方向，这在 K=2 中结构性不可能。D003 三级响应解析为 Version A（≥1 topology
    with reversal）。Core insight 确认："non-differential exposure misclassification biases
    toward null" 保证在 K≥3 下打破。两个 DAG 已形成有力对比：confounding DAG 偏差单调可预测 vs exposure DAG
    偏差方向不可预测——验证"偏差取决于 C 结构 × DAG 拓扑交互"。
  related_experiments:
  - exp_id: art_20260520_207c62
    role: validation
    result: 85% bias-toward-null violation, 83.4% sign reversal
  - exp_id: art_20260520_f08c30
    role: baseline
    result: confounding DAG monotonic, no reversal
  depends_on:
  - D002
  - D003
- id: D005
  date: 2026-05-20 12:19 UTC
  summary: 'ASV 参数化选定方案 A: C(δ)=(1-δ)I+δC₀ 线性插值，类比 E-value'
  rationale: 三个候选方案（线性插值/CTMC 矩阵幂/范数球极值）调研后，方案 A 在可解释性（"误差需放大 δ 倍才翻转结论"）、closed-form
    可证明性、K=2 退化为 VanderWeele & Li Se/Sp 参数化三方面最优。方案 C 作 appendix robustness check。
  related_experiments:
  - exp_id: plan004_asv_framework
    role: target
    result: parameterization decided
  depends_on:
  - D004
- id: D006
  date: 2026-05-20 12:21 UTC
  summary: 'ASV 框架区分 Vulnerability ASV（误差→更大风险）和 Protection ASV（collider: 误差→更小 bias）'
  rationale: Collider DAG 下 bias 随误差放大递减（噪声 conditioning 削弱 collider bias），与 exposure/mediation
    等拓扑的递增方向相反。统一框架内区分两类方向，而非排除 collider，因为方向性差异本身是 Claim 1 的核心证据。
  related_experiments:
  - exp_id: plan004_asv_framework
    role: design decision
    result: dual-direction ASV
  depends_on:
  - D005
- id: D007
  date: 2026-05-20 13:04 UTC
  summary: 'ASV 改用 envelope monotonicity: ASV_envelope(δ) = sup_{δ''≤δ} |bias_τ(δ'')|，构造性单调'
  rationale: Raw |bias_τ(δ)| 作为有理函数天然非单调（~75% 场景违反）。改用 envelope 定义后单调性由构造保证，ASV 成为
    conservative monotonic bound。论文 claim 相应调整为 worst-case bound。
  related_experiments:
  - exp_id: plan004_asv_framework
    role: design revision
    result: envelope monotonicity
  depends_on:
  - D006
- id: D008
  date: 2026-05-20 14:52 UTC
  summary: 6 拓扑 ASV 灵敏度排序确立：IV(极脆弱) > front-door > confounding/mediation > collider(保护)
    > M-bias(免疫)。三种 ASV 类型按拓扑分层适用。
  rationale: plan_004 + plan_005 合并结果：(1) significance ASV 对衰减型拓扑有效，放大型退化为二值；(2) magnitude
    ASV 对所有拓扑有效，是通用诊断工具；(3) sign-flip ASV 仅对 exposure 有实质区分力。6 拓扑排序从"IV 任何误差即超阈值"到"M-bias
    完全免疫"，本身是论文核心 Table。ASV-topology 交互进一步支撑 Claim 1"拓扑决定一切"。
  related_experiments:
  - exp_id: plan004_asv_framework
    role: primary
    result: 3 拓扑 ASV 验证完毕
  - exp_id: plan005_asv_extended
    role: primary
    result: 3 新拓扑验证完毕，M-bias 免疫，IV 极敏感
  depends_on: []
- id: D009
  date: 2026-05-20 15:22 UTC
  summary: 'D008 修正：6 拓扑 ASV 排序为多维度（非单一排序）。Magnitude: front-door(0.06-0.39) < confounding(0.08-0.49)
    < IV(0.10-0.61) < collider(protection) < M-bias(immune)。Significance power: IV(0%)
    < med/coll@τ=0.05(0%) < M-bias(96-100%) = front-door(100%) = confounding(100%)。Sign-flip:
    仅 exposure(83.4%) 和 IV(δ>1.1)。'
  rationale: plan_005 修复重跑后，IV magnitude ASV 从 0（参考值伪影）修正为 0.10-0.61。排序不再是单一维度——不同
    ASV 类型给出不同排序，这本身支持三维 ASV 框架的必要性。论文应以多维度表格（tab2_asv_grid）呈现而非简单线性排序。
  related_experiments:
  - exp_id: plan005_asv_extended
    role: primary
    result: 修复后 IV ASV=0.10-0.61, M-bias immune, Type I=0% all topologies
  - exp_id: plan004_asv_framework
    role: supporting
    result: confounding/mediation/collider ASV baseline
  depends_on:
  - D008
- id: D010
  date: 2026-05-20 15:58 UTC
  summary: 'D010: τ sign_flip 结构性保证修正为 5/7 拓扑（排除 exposure + IV）。IV ~52% τ sign_flip
    是 plan_002 100k random C 新发现，plan_001 6 个固定 C 未覆盖此现象。'
  rationale: plan_001 用 6 个固定 C 结构得出 IV τ_sign_flip=0，但 plan_002 100k random C 显示
    ~52% sign flip，跨 K 稳定。机制：Wald 估计量分母 FS*[1] 的符号可被误分类翻转。论文拓扑分类更新为：Safe（confounding/mediation/collider/M-bias/front-door，τ_sign_flip=0%
    structural）vs Dangerous（exposure ~83-100% + IV ~52%）。两个危险拓扑机制不同：exposure 是 label
    swap 直接翻转，IV 是 Wald 分母符号变化。
  related_experiments:
  - exp_id: plan002_k57_extension
    role: primary
    result: IV τ sign_flip ~52% across K=3,5,7
  - exp_id: plan001_dag_taxonomy
    role: baseline
    result: IV τ sign_flip=0% (6 fixed C, unrepresentative)
  depends_on:
  - D008
  - D009

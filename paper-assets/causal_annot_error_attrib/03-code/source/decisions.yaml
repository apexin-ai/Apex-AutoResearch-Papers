  rationale: 14 configs (humaid K=10 × 8 + civil_comments K=2 × 3 + vast K=3 × 3)
    全量分析完成。核心发现：(1) K=2 IV bias 116.5%, K=3 IV bias 252.3%, K=10 IV bias 30.3% — K越小分类粒度越粗，bias越严重，符合理论预期；(2)

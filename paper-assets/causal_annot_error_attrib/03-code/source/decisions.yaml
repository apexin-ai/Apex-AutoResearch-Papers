- id: D012
  date: 2026-05-20 18:49 UTC
  summary: plan_007 预览发现：Frisch-Waugh 定理导致 naive_plugin/MLA 对 T 系数 bias reduction=0%（confounding/mediation/collider/M-bias
    拓扑）
  rationale: 当 misclassified 变量作为 dummies 进入回归而 τ 是连续 treatment 系数时，C⁻¹ 变换不改变 [intercept,
    D*] 列空间，T 系数 OLS 估计不变。只有 exposure/IV/front-door（τ 指向 dummy 系数）时 correction 才有效。这使
    Claim 3 从"哪种方法最好"升级为"某些方法在特定拓扑下根本无效"，强化论文 narrative。PPI++ (95-99%) 在所有拓扑下最优但需
    gold labels。
  related_experiments:
  - exp_id: plan007_correction_guidance
    role: evidence
    result: '10-sim preview: naive_plugin/MLA 0% for T-coef topologies, PPI++ 95-99%,
      DSL 60-72%'
  depends_on:
  - D010

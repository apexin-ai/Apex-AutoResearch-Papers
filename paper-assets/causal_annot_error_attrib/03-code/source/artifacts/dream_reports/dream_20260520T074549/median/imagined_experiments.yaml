  figures_description:
  - 'Fig 1: Heatmap — topology (rows) × named C structure (cols) → bias magnitude
    (color intensity) and direction (red=reversal, blue=toward-null). Exposure 行几乎全红，mediation
    行 2/6 红，其余行全蓝。'
  - 'Fig 2: Violin plots — 100k random C 下各 topology 的 bias 分布。Exposure 为跨零的宽双峰分布；mediation
    右偏但有负值尾部；其余单峰正值。'
  - 'Fig 3: Mediation 反转 phase diagram — off-diagonal dominance (x) × |indirect effect|
    (y) → reversal probability (color). 在 dominance > 0.6、|indirect| > 0.2 处有清晰边界。'
  analysis: 'plan_001 确认 median 档的核心结果：6 个拓扑中仅 mediation 出现新的反转（结合 MVP exposure =
    2 个反转拓扑）。

    关键发现是反转机制的不对称性：exposure 是"广泛性反转"（label swap 直接作用于 treatment 对比），

    mediation 是"条件性反转"（需双重门控：C 足够非对角 + 间接效应足够大）。

    这一不对称性本身就是论文的核心贡献——它证明了 direction reversal 是 topology-specific 的，

    不能仅从 confusion matrix 结构预测，必须结合 DAG 拓扑分析。

    4 个单调拓扑的 magnitude 变异（如 collider 0.04–0.21）支持补充论据：即使方向保持，

    bias magnitude 仍不可从 binary 框架预测。

    需要补充实验：对 mediation 的 phase diagram 做更精细的 grid search（Fig 3 的分辨率不够用于实用指导）。

    '

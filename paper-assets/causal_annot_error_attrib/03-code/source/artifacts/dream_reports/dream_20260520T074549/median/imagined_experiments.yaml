- name: 'ASV Framework: Formal Proofs for Confounding, Mediation, Collider'
  plan_id: plan_004
  description: '推导 3 个优先拓扑的 ASV 表达式。形式化证明 monotonicity 和 sharpness。

    MC 验证：coverage at 90%, 95%, 99% across 1000 scenarios/topology。

    '
  expected_results:
    monotonicity_proved:
    - confounding
    - mediation
    - collider
    sharpness_proved:

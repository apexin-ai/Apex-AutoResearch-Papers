  plan_id: plan_002
  description: '将 bias 表达式扩展到 K=5,7 的矩阵形式。开发 3 个可解释性工具：

    (a) eigendecomposition summaries，(b) worst-case scalar bounds，(c) diagnostic visualizations。

    在 confounding + mediation + collider + exposure DAGs 上验证 K=5,7。


tier: median
narrative_guidance: 'Version A 成立但 scope 收窄至 2 个反转拓扑：exposure（MVP 已确认，violation rate
  85%）+ mediation（plan_001 新发现，violation rate 23%，条件性反转——仅在 off-diagonal dominance
  > 0.6 且 |indirect effect| > 0.2 时触发）。

  其余 4 个拓扑（confounding, collider, M-bias, instrument, front-door）保持单调性，但 magnitude
  变异显著（如 collider bias range 0.04–0.21）。

  Lead finding 聚焦于 exposure vs mediation 的对比：exposure 反转是"广泛性的"（85%，几乎所有非对角 C），mediation
  反转是"条件性的"（23%，需要双重门控）。这一对比本身就是核心贡献——同样的 non-differential error 在不同拓扑下产生质变差异。

  Claim 1 调整：taxonomy 有效，但方向反转是 topology-specific 而非 universal；magnitude 不可预测性作为补充论据（所有
  6 个拓扑均存在）。

  Claim 2 调整：ASV 紧性降级为 2 个拓扑有形式化证明（confounding + mediation）+ 4 个有 MC 数值证据；增加一段讨论 collider
  conditioning structure 导致优化非凸的技术障碍。

  Claim 3 不变。

  需补充实验：(1) 对 exposure 和 mediation 做 C structure 条件分析（反转边界的精确刻画——何时反转、何时不反转），(2) 增加
  1 个经验任务（如 emotion detection K=6）以补偿理论覆盖面的缩窄，使经验证据更丰富。

  '
imagined_experiments:
- name: K=3 Bias Expressions and MC Validation Across 6 DAG Topologies
  plan_id: plan_001
  description: '对 6 个 DAG 拓扑（confounding, mediation, collider, M-bias, instrument,
    front-door）推导 K=3 closed-form bias 表达式，

    MC 验证：1000 reps × N=10000 × 6 confusion matrix structures/topology = 36 scenarios。

    每个拓扑做 100k random C search 检测方向反转。Confounding 为 MVP 再验证；其余 5 个为新推导。

    结合 MVP exposure 结果，total reversal topologies = 2。

    '
  expected_results:
    total_scenarios: 36
    theory_mc_match: 33/36
    theory_mc_match_rate: 0.917
    reversal_in_plan_001: 1
    reversal_topology_new: mediation
    combined_reversal_topologies: 2
    combined_reversal_list:
    - exposure (MVP)
    - mediation (new)
    confounding:
      violation_rate: 0.0
      bias_range:
      - 0.132
      - 0.298
      theory_mc: 6/6
      mechanism: residual confounding, monotonic toward OVB
    mediation:
      violation_rate: 0.23
      sign_reversal_rate: 0.18
      amplification_rate: 0.05
      worst_severity: 1.62
      named_structures_with_violation: 2/6 (near-permutation, block-off-diagonal)
      theory_mc: 6/6
      reversal_condition: off-diagonal dominance > 0.6 AND |indirect effect| > 0.2
      indirect_bias_range:
      - -0.18
      - 0.14
    collider:
      violation_rate: 0.0
      bias_range:
      - 0.04
      - 0.21
      attenuation_range: 15-60% reduction vs no misclassification
      theory_mc: 5/6
      mechanism: misclassification smooths conditioning variable, reduces collider
        bias magnitude, preserves direction
    mbias:
      violation_rate: 0.0
      bias_range:
      - 0.02
      - 0.16
      theory_mc: 5/6
      mechanism: spurious pathway weakened by misclassification of M-bias variable
    instrument:
      violation_rate: 0.0
      bias_range:
      - 0.03
      - 0.19
      theory_mc: 6/6
      mechanism: instrument weakened, Wald estimator biased toward OLS, direction
        preserved
    frontdoor:
      violation_rate: 0.0
      bias_range:
      - 0.05
      - 0.22
      theory_mc: 5/6
      mechanism: front-door estimate attenuated, identification weakened but direction
        stable
    mc_mismatch_detail: 3 mismatches in collider(1), M-bias(1), front-door(1) — all
      near-permutation C where MC variance is highest due to complex bias formulas
      (conditioning, ratio estimators)
  result_rationale: 'Mediation（23% violation）：misclassifying mediator M 影响间接路径 X→M→Y。反转需要双重门控：

    (a) C matrix off-diagonal dominance > 0.6（标签大幅置换），AND (b) |true indirect effect|
    > 0.2（间接效应足够大可以被反转）。

    因为间接效应 = X→M 系数 × M→Y 系数的乘积，两条路径都必须被实质性扰动才能反转——这种双重门控将 violation rate 限制在 23%。

    对比 exposure（MVP 85% violation）：exposure misclassification 直接作用于单一 X→Y 路径，无衰减机制，几乎所有非对角
    C 都触发反转。

    这一机制差异（直接路径 vs 乘积路径）是 median 档的核心发现——direction reversal 是 topology-specific 的。


    Collider（0% violation）：misclassifying Z（collider）并 conditioning on Z* 时，误分类平滑了
    Z 的分布，

    削弱了 selection effect 的强度但不改变其方向。方向由结构方程的符号决定（与测量质量无关）。

    100k random C 中无一例外。


    M-bias/Instrument/Front-door（0% violation）：这些拓扑涉及辅助变量，misclassification 削弱 identification
    但不反转估计方向。

    Instrument 特殊之处在于 Wald estimator 的分母受影响（偏向 OLS），但符号不变。

    Front-door 的 double summation 使 MC 方差在极端 C 下偏高，导致 1/6 mismatch。


    3 个 MC mismatch 均出现在 near-permutation C structure 下——这些拓扑的 bias formula 含有 conditioning
    或 ratio 结构，

    MC 在极端 C 下方差更大，理论值落在 95% CI 边缘外。

    '

mistakes:
- id: M001
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: MVP criterion 2 混淆了 confounder misclassification 与 exposure misclassification
    的 "bias toward null" 保证
  root_cause: '"Bias toward null" 经典结论（Bross 1954）特指 exposure 误分类，不适用于 confounder
    误分类。MVP 测试的 confounding DAG 中 A 是 confounder，即使二分类非差异性误分类也产生远离零偏差（residual confounding）。因此
    criterion 2（"≥1 种非差异性 C 产生远离零偏差"）在 confounding DAG 下对二分类也成立——不具区分力。'
  prevention: 设计 pass criteria 时必须明确测试场景与被验证理论的对应关系。"Bias toward null" 的正确测试场景是 exposure
    misclassification DAG（A→Y，用 A* 估计 A 的因果效应），而非 confounder misclassification DAG（A→T,
    A→Y）。
  status: active
  context: Reviewer 在 MVP 验证报告中指出。MVP 仍通过 criterion 1（框架正确性）和 criterion 3（折叠不等价），但
    criterion 2 需在 exposure DAG 中补充验证。
  fix: 立即在 exposure misclassification DAG 上运行 K=3 验证，作为 research 阶段第一个实验。
  related_decisions:
  - D001
- id: M002
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: MVP 两个验证实验未注册到 registry（Reviewer 第三次提醒）
  root_cause: Agent 执行 MVP 时未将 confounding DAG 和 exposure DAG 实验注册到 registry，仅生成了
    artifacts。Director 在审批指令中也未明确要求 registry 注册。
  prevention: 1. Director 下发实验指令时明确包含"完成后注册到 registry"要求。2. Agent 完成任何实验后必须自动注册（spec
    + status + conclusion + metrics）。
  status: active
  context: Reviewer 在 MVP 设计审查、MVP 结果验证、ROADMAP 更新审查中三次提到 registry 为空。
  fix: 指令 Agent 立即补录两个 MVP 实验到 registry。
- id: M003
  date: '2026-05-20'
  category: agent_behavior
  severity: high
  summary: plan_003 标注管线两次未成功执行：第一次 Worker 只修复代码未运行；第二次用前台 SSH 运行导致进程被 SIGHUP 杀死
  root_cause: Worker 对长时间运行任务（5-6h）使用前台 ssh_execute，SSH 会话结束时进程被杀。且 Worker 名为 "fix-and-run"
    但第一次只做了 fix。
  prevention: 运行时间 > 5 分钟的任务必须使用 nohup/tmux/submit_training_job 后台执行。启动后必须验证 PID 存活
    + 日志有输出再汇报"已启动"。Director 审批后应明确要求 Worker 汇报 PID 和初始进度。
  status: active
  context: plan003_empirical_confusion_matrices 审批通过后，两次派发 Worker 均未成功执行标注管线。第一次 Worker
    只完成了代码修复；第二次进程在 35 秒后因 SSH 断开被杀，日志仅 8 行 296 字节。
  fix: 发送 urgent_agent_message 要求用 nohup 后台运行 + 轮询验证 PID 存活
- id: M004
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: plan_003 进程死亡 + 1000条标注数据全丢：annotate.py 无 streaming write，组合内中断不可恢复
  root_cause: annotate.py 将结果积累在内存 list，整个组合完成后才写文件。进程中途死亡导致内存中全部数据丢失。这是 M003（SIGHUP
    杀进程）的延续——即使 nohup 解决了 SSH 断连问题，缺乏 streaming write 意味着任何进程中断都会丢数据。
  prevention: 长时间运行的数据采集脚本必须实现 streaming write（逐条或小批量 append 到文件），配合 resume 逻辑。审批前检查写入模式：批量写入
    + 长运行时间 = 必须改为 streaming。
  status: active
  context: plan_003 第二次失败。第一次（M003）因 SIGHUP 被杀，改 nohup 后重跑。这次进程再次死亡（原因未知），1000/1500
    samples 全丢。annotate.py 的 annotate_batch() 在内存中积累结果，run_single() 全部完成才调 save_results()。
  fix: 在 annotate_batch 中加 streaming write：每个 sample 完成后立即 append 到 JSONL。配合已有 resume
    逻辑实现中断恢复。同时考虑多进程并行（按模型分）加速。
- id: M005
  date: '2026-05-20'
  category: communication
  severity: medium
  summary: Director 将 collider 的 tau_sign_flip=0 错误引用为 IV 的数据，导致虚假的 plan_001 vs plan_002
    矛盾
  root_cause: plan_001 registry metrics 中不含 IV 条目（只有 collider/mbias/mediation/frontdoor），Director
    在引用时将 collider 的 {violation:1, sign_flip:0, amplification:1} 误认为 IV 的数据。
  prevention: 引用 registry 数据时必须核对 metrics 中的具体 key name，不凭记忆引用。跨实验对比指标时先用 read_experiment_plan_with_status
    确认两边的 metrics 结构。
  status: active
  fix: Reviewer 确认 plan_002 52% 是首次测量，无矛盾。plan_001 registry 补注 IV 指标缺失说明。
- id: M006
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: plan_007 全量运行连续两次失败（参数名错误 + 进程被误杀）
  root_cause: 第一次：argparse 参数名 --N_sim 与脚本定义 --n-sim 不匹配。第二次：进程在 1/42 组合后终止，可能被 plan009
    重复进程的 kill 操作误杀。submit_training_job 的 cron on_complete 在错误退出时仍触发误报。
  prevention: 1. 提交前用 --help 确认参数名。2. 长时间 CPU 任务用 nohup 独立启动，不依赖 tmux 或 submit_training_job。3.
    不同实验的 kill 操作需检查 PID 避免误杀。4. cron on_complete 需检查 exit code 和输出完整性。
  status: active
  context: plan_007 correction guidance 全量运行 210k 组合（7 topo × 6 C × 5 method × 1000
    sims）。两次尝试均未产出有效结果。

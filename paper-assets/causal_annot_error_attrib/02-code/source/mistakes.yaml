- id: M008
  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: PPI++ empirical validation used flawed metric and mixed methods, inflating
    96.2% to hide true 39.0%
  root_cause: 'Three independent issues: (1) IV topology used theoretical C^{-1} (100%
    by tautology) instead of actual PPI++; (2) |mean(bias)| metric makes any unbiased
    estimator show ~100% reduction regardless of variance; (3) 10/18 configs used
    approximate confusion matrices labeled as "real LLM matrices"'
  prevention: 'Correction experiments must: (a) use same method for ALL topologies
    — no silent method substitution; (b) use MAE (mean |error|) not |mean error| as
    the reduction metric — the latter ignores variance; (c) clearly label approximate
    vs real confusion matrices. Director must verify metric definitions before writing
    numbers into paper.'
  status: active
  context: Original ppi_empirical_validation.json metadata clearly noted "theoretical_Cinv
    (IV only)" and "VAST/CC use approximate confusion matrices" but these caveats
    were lost when numbers were written into experiments.tex L150-151. Reviewer caught
    the discrepancy when Agent independently recomputed with correct methodology.
  fix: Rewrote paragraph with MAE-based numbers from fresh computation (8 real HumAID
    configs only). PPI++ grand mean 39.0%, IV -79.2%. Commit ee77830.
  commit_id: ee77830
- id: M009
  date: '2026-05-23'
  category: communication
  severity: high
  summary: 连续多轮提交审稿前不通读全文，导致叙事矛盾和不连贯问题反复被审稿人发现，分数停滞在 3.5
  root_cause: 三个根因：(1) 流程倒置——Agent 改完直接提交，跳过 Director 通读验证环节；(2) 把审稿当 checklist 逐条修补，不做整体叙事审视；(3)
    过度委托不验证 Agent 输出质量（如 F1-bias 只用 56 scenarios 未发现、Q3/Q5 完成 45min 未写入论文未发现）
  prevention: 提交审稿前必须执行：(1) Director 亲自通读全文，逐节检查叙事流畅性和逻辑自洽；(2) 检查关键数字在 Abstract/Introduction/Method/Experiments
    间的一致性；(3) 验证 Agent 输出——新增内容是否已整合、引用是否真实、数据范围是否正确；(4) 只有"整体读起来像一篇完整论文"才能提交，不以"逐条修完"为标准
  status: active
  context: Round 12 提交后才通读发现 5 个问题：Abstract vs Introduction IV sign reversal 矛盾、Section
    4.5 段落过载、Introduction Spearman ρ 嵌入过密、Method L14 过渡断裂、56 vs 161 scenarios 范围不明。用户批评"每次审稿都是3.5没有进步，提交审稿的时候不检查的吗"
  fix: Round 12 已提交但 Agent 正在修复 5 个叙事问题。修复完成后 Director 将再次通读全文验证后提交 Round 13。

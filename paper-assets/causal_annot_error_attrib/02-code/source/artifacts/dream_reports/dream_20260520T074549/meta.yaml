  - name: Pathological confusion matrix analysis
    plan_id: plan_009
    description: '分析极端 C 结构（near-permutation, rank-deficient, block-diagonal）在所有拓扑中的
      偏倚行为。识别预测偏倚严重度的结构性指标（spectral gap, diagonal dominance ratio）。

      '
    expected_results:
      spectral_gap_bias_correlation: 0.91
      diagonal_dominance_bias_correlation: 0.87
      best_predictor: spectral gap (1 - λ₂/λ₁) explains 83% of bias magnitude variance
      catastrophic_bias_threshold: spectral gap < 0.15 → bias > 2x effect size in
        ≥80% of reversal-prone topologies
      near_permutation_analysis: all near-permutation C (spectral gap < 0.05) produce
        reversal in mediation/collider/front-door; severity 1.5-3x
      rank_deficient_analysis: rank-deficient C always produce catastrophic bias regardless
        of topology — information loss is complete for collapsed dimensions
      block_diagonal_analysis: bias depends on which classes are in same block — if
        classes with opposite effects are merged, reversal guaranteed
      practitioner_diagnostic: 'two-number summary: (spectral gap, diagonal dominance
        ratio) → risk category (low/medium/high/catastrophic)'
    result_rationale: 'Spectral gap 与偏倚强相关（r=0.91）：混淆矩阵 C 的第二大特征值 λ₂ 控制了 "主误分类模式"的强度。当
      spectral gap = 1-λ₂/λ₁ 接近 0 时，C 接近非满秩， 信息丢失严重，偏倚灾难性。这不是偶然——偏倚表达式中 C 的逆（或伪逆）出现在
      correction 中，spectral gap 控制了逆的条件数。

      Diagonal dominance 相关性略低（0.87 vs 0.91）因为 diagonal dominance  是一个粗糙的指标——它只看对角元素与行和的比值，不捕获
      off-diagonal 的结构 （如 block-diagonal 的特殊性）。Spectral gap 通过特征分解捕获了完整的  off-diagonal
      结构信息。

      Near-permutation 全部产生反转（在反转敏感拓扑中）：near-permutation C  等价于类别标签几乎完全互换，这在 K≥3 时结构性地翻转效应方向（而
      K=2 时 近置换 = 高误分类率，仍然只 attenuate toward null）。

      Block-diagonal 的方向依赖于块结构：如果具有相反效应的类别被合并在同一块中， 块内平均化可以翻转块的净效应方向。这与 binarization
      collapse 的机制相同， 但发生在 C 矩阵内部而非研究者的显式折叠中。

      '

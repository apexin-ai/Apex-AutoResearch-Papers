    - 'Fig 11: ASV sensitivity curves per topology——x=δ, y=bias bound, with MC point
      estimates overlaid. 证明 bound 确实是上界且紧。'
    - 'Fig 12: Coverage probability plot——nominal level (x) vs actual coverage (y)。理想情况为对角线。三个拓扑均紧贴对角线，confounding
      略微过覆盖。'
    analysis: '三个完整形式化证明是本论文最重要的理论贡献之一。ASV 类比于因果推断中的 E-value： E-value 量化 "多大的未测量混淆才能推翻结论"，ASV
      量化 "多大的标注误差才能推翻结论"。 关键区别：E-value 只需一个标量参数（RR），ASV 需要参考混淆矩阵 + δ 方向， 因此证明复杂度更高。构造性紧性证明（显式
      C*）不仅有理论价值，还有实践价值—— 研究者可以检查 "使结论翻转的最近 C* 与我的实证 C 有多远"，获得直觉性理解。

      '
  - name: ASV MC validation for remaining 3 topologies
    plan_id: plan_005
    description: '对 M-bias, instrument, front-door 三个拓扑推导 ASV 表达式，MC 验证单调性和覆盖率。 紧性作为猜想，用数值证据支持。

      '
    expected_results:
      asv_monotonicity_mc_validated: 3
      asv_monotonicity_violations: 0
      asv_coverage_95_mbias: 0.954
      asv_coverage_95_instrument: 0.961
      asv_coverage_95_frontdoor: 0.943
      sharpness_numerical_gap: < 0.008 across all 3 topologies (bound within 0.8%
        of achievable)
      sharpness_conjecture_status: Supported by 1000 scenario numerical optimization
        — no counterexample found
      frontdoor_asv_note: Front-door ASV 涉及两阶段估计的联合扰动，闭式紧性证明需要解决双线性约束优化，identified
        as immediate future work
    result_rationale: '单调性在所有 3 个拓扑的 MC 验证中均成立（0 violations）：单调性是一个"自然"性质—— 更大的标注误差（更大的
      δ）只能增加偏倚的潜在范围，不能减少它。这在直觉上成立： δ 增大扩展了 C 的可行域，而偏倚 bound 是在可行域上的 supremum， 可行域扩大
      → supremum 不减。形式化证明的技术难点在于处理非凸可行域， 但 MC 验证表明即使在解析证明困难的情况下，性质仍成立。

      紧性作为猜想而非证明：M-bias 的 DAG 结构（butterfly）使偏倚表达式涉及 4 个 条件概率的乘积，优化问题是四次多项式约束优化，闭式解不可行。
      Instrument 的 Wald ratio 使约束优化涉及分式规划。 Front-door 的两阶段结构使约束是双线性的。 数值优化（sequential
      quadratic programming）在所有场景中找到的最优 C  与 ASV bound 的差距 < 0.008，强烈支持紧性但不构成证明。

      Front-door coverage 略低（0.943）：两阶段估计的非线性使 ASV 的线性化近似 在 extreme δ 附近不够精确，但仍在 [0.93,
      0.97] 范围内。

      '

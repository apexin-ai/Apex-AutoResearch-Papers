    \ valuable, but the paper needs substantial revision (related work, proofs, at\
    \ least semi-synthetic experiments) to be publication-ready\n\n## Step 4: Consolidated\
    \ Assessment\n\n### Overall Score: 3.5 — Borderline (between Weak Reject and Weak\
    \ Accept)\n\n**Headline:** A novel and important framework with genuinely new\
    \ theoretical insights, but significant execution gaps in theoretical completeness,\
    \ empirical validation, and scholarly positioning prevent recommendation for acceptance\
    \ in current form.\n\n### Justification\n\n**What works well:**\n- The topology-dependent\

    \ pipeline (taxonomy → ASV → correction → toolkit) is rare and valuable\n- Transparent\
    \ limitation reporting\n\n**What prevents acceptance:**\n\n1. **Theory-practice\
    \ disconnect (Critical).** The paper's most exciting result (exposure direction\

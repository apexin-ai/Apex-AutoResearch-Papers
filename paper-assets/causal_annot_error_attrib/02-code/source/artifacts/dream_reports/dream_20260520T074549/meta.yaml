  imagined_experiments:
  - name: Multi-topology bias derivation and MC validation (K=3)
    plan_id: plan_001
    description: '对 6 个 DAG 拓扑（confounding, mediation, collider, M-bias, instrument,
      front-door）推导 K=3 闭式偏倚表达式， 每个拓扑用 6 种混淆矩阵结构 × 1000 MC reps × N=10000 验证。另对 mediation/collider/front-door/M-bias/instrument
      执行 100k random C 搜索，检测方向反转违背率。

      '
    expected_results:
      theory_mc_match_rate: 0.972
      theory_mc_match_detail: 35/36 structure×topology 组合落入 95% MC CI；1 个边界 case（front-door
        + rank-deficient C）偏差 0.003 超 CI 上界，增加到 N=50000 后收敛
      reversal_topologies_count: 4
      reversal_topologies:
      - exposure (MVP)
      - mediation
      - collider
      - front-door
      non_reversal_topologies:
      - confounding
      - instrument
      mediation_violation_rate: 0.52
      mediation_sign_reversal_rate: 0.47
      mediation_amplification_rate: 0.11
      collider_violation_rate: 0.41
      collider_sign_reversal_rate: 0.36
      collider_amplification_rate: 0.09
      frontdoor_violation_rate: 0.34
      frontdoor_sign_reversal_rate: 0.28
      frontdoor_amplification_rate: 0.12
      mbias_violation_rate: 0.0
      mbias_bias_range:
      - 0.04
      - 0.18
      instrument_violation_rate: 0.0
      instrument_bias_range:
      - 0.02
      - 0.14
      confounding_violation_rate: 0.0
      confounding_bias_range:
      - 0.063
      - 0.298
      mediation_worst_case: β_indirect=0.5 → estimate=-0.31 (sign reversal, 1.62x
        amplification)
      collider_worst_case: β_XY=0.0 (null) → estimate=0.44 (spurious effect creation
        + direction assignment)
      frontdoor_worst_case: β_total=0.8 → estimate=-0.22 (sign reversal via second-stage
        distortion)
    result_rationale: 'Mediation (violation rate 0.52): 间接效应 = β_XM × β_MY|X。K≥3 非差异误分类扭曲
      M→Y|X 回归系数—— 近置换矩阵 C 使相邻类别标签互换，导致 β_MY|X 符号翻转，从而间接效应反转。K=2 下非差异误分类只能将 β_MY|X  向零压缩（attenuation），结构上不可能越过零点。violation
      rate 0.52 而非更高（对比 exposure 的 0.85）， 因为间接效应经过两步回归（X→M 和 M→Y|X），仅当 C 同时严重扰动 M
      的条件分布时才出现反转， 而 exposure 误分类直接作用于处理变量，单步即可反转。

      Collider (violation rate 0.41): 对 collider C̃ 条件化打开伪路径 X←U→C←V→Y。K≥3 误分类改变条件化的
      有效权重——不同类别的合并创造不同的伪关联模式。violation rate 低于 mediation 因为反转需要 C 矩阵 使 X-path 和 Y-path
      的贡献权重同时满足特定比例条件，约束更强。

      Front-door (violation rate 0.34): 前门调整涉及两阶段估计（X→M 和 M→Y|do(X)）。K≥3 误分类不对称地 扭曲两个阶段——第一阶段
      attenuation 与第二阶段 distortion 的交互可使整体估计翻转。violation rate  最低因为反转需要两阶段同时被 C 严重扰动且扰动方向"配合"，是三个反转拓扑中约束最强的。

      Confounding (violation rate 0.0): 已由 MVP 确认。残差混淆始终朝向 OVB 方向，因为误分类只能减少 confounder
      的解释力（信息丢失），不能创造新的混淆结构。K≥3 增加了更多丢失信息的方式但不改变方向性。

      Instrument (violation rate 0.0): Wald estimator = Cov(Y,Z̃)/Cov(X,Z̃)。非差异误分类对
      Z 的两个 协方差施加相同方向的 attenuation（均乘以 C 的特征值相关因子），比值的符号不变。 K≥3 下分子分母的 attenuation
      系数不再相同（不同特征值），导致幅度偏倚但符号保持。

      M-bias (violation rate 0.0): M-bias（蝴蝶 DAG）中被误分类的变量本不应被条件化。 误分类使条件化效应减弱（信息丢失方向），偏倚幅度变化但不反转。

      '

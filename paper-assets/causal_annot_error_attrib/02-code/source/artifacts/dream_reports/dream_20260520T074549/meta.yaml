    result_rationale: 'Binarization max Δ = 0.19（mediation, K=7）：折叠 7 类 mediator 为二分类丢弃了类别间的
      细粒度偏倚结构。Mediation DAG 中间接效应依赖 M 的分布形状——当 7 个类别被折叠为 2 个时， 被合并的类别可能具有相反方向的 M→Y
      效应，导致折叠后的间接效应与原始间接效应方向相反。 K=7 比 K=3 更严重因为折叠时信息丢失更多（5 个类别被合并 vs 1 个类别被合并）。

      Δ 随 K 单调增大（avg: 0.08→0.13→0.16）：这是信息论上的必然——K→2 折叠的信息丢失 量为 log(K)-log(2)，K 越大丢失越多。

      12% 的 K=5,7 场景中 Δ 本身导致方向翻转：这意味着研究者试图通过 binarization  "逃入"二分类安全区域的策略不仅无效（因为折叠引入新偏倚），而且在
      12% 的场景中 反而比保留多类更危险。这个发现直接回应了一个预期的 reviewer concern： "既然 binary case 有保证，为什么不直接
      binarize？"

      Mediation > Collider > Front-door > Exposure > Confounding > M-bias > Instrument
      的 Δ 排序： Mediation 最大因为间接效应的非线性依赖 M 的类别分布；Instrument 最小因为 IV 估计 主要依赖 Z 的第一阶段
      F-statistic，对类别合并方式的敏感度较低。


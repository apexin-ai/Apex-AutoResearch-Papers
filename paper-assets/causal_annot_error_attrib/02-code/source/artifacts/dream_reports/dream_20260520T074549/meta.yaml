      这验证了论文的动机前提：LLM errors are correlated，ensemble averaging 效果有限。


      Downstream bias 范围是中等的（非 dramatic）因为真实 LLM confusion matrices 是 moderately diagonal-dominant
      的——

      不是 near-permutation 极端。这是 median 档的预期：理论极端（near-permutation C 导致 2.83× severity）

      在当前 LLMs 中不会实际出现，但 bias 是可检测的且非 trivial 的。


      Prompt variant 稳定性（±0.03 F1，C structure stable）支持论文聚焦于 confusion matrix structure
      而非 prompt engineering——


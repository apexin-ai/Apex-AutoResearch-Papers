      violent protest,  strategic development, government response, other）存在固有歧义——"strategic
      development"与  "peaceful protest"常被混淆，LLM 倾向于对 borderline case 系统性偏向高频类别。 低对角优势意味着
      C 矩阵偏离对角，更接近 random search 中产生反转的区域。

      Stance detection (K=3) 对角优势较高（0.74）：3 类（favor, against, neutral）语义距离较大， 但 neutral
      与 against 的边界模糊导致特定 off-diagonal 元素偏高，形成 block-diagonal 结构 （favor 与 against/neutral
      分离，但 against-neutral 互相混淆）。

      Toxicity (K=2) 准确率最高（0.89）：二分类任务较简单，且 toxicity 有较清晰的语言标记。 作为 binary special
      case / consistency check——K=2 下所有模型的偏倚均 toward null， 与理论预测一致。

      跨模型错误相关 0.58：Kim et al. (ICML 2025) 报告 60%，我们的 0.58 高度一致。 这不是巧合——LLM 共享类似的预训练数据和推理模式，对同类歧义样本倾向于犯同类错误。
      这个发现强化了我们的论点：多模型集成无法消除系统性偏倚，必须分析 C 结构。

      9 种不同 C 结构（3 models × 3 tasks）为后续 ASV 校准提供了充分多样性。 2 个 near-permutation cases
      出现在 protest coding 的特定 prompt 变体下（过度指令化导致 类别定义混乱），3 个 block-diagonal cases 出现在
      stance detection 中（favor 孤立）。


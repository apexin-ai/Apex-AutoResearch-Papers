    result_rationale: '89% accuracy 反映框架在 clear-cut scenarios（方法性能明显分离）的优势和 boundary
      cases 的弱点。


      3 个 boundary cases 是结构性不可区分的：near-diagonal C（low error）下所有方法结果相近（within 5%），

      "best" recommendation 是任意的。这不是框架的失败而是问题本身的 degeneracy。


      7 个 hard failures：

      (a) 3 cases: near-diagonal C 使所有方法等效但框架因 threshold effects 选了次优方法；

      (b) 2 cases: intermediate differential error 处框架的 non-differential/differential
      二分类

      无法捕获 differentiality 的连续性质；

      (c) 2 cases: 框架推荐了方法但正确答案是"no method adequate"（near-permutation C + reversal

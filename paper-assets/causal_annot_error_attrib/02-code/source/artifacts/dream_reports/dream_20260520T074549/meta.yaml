    figures_description:
    - 'Fig 1: 6-panel heatmap (one per topology), x=true effect size, y=confusion
      matrix diagonal dominance ratio, color=bias magnitude with sign (blue=toward
      null, red=away/reversal). 清晰展示 mediation/collider/front-door 的红色反转区域 vs confounding/instrument/M-bias
      的全蓝区域。'
    - 'Fig 2: Violin plots of 100k random C bias distribution per topology. Mediation/collider/front-door
      分布跨越零线；confounding/instrument/M-bias 分布完全在一侧。'
    - 'Fig 3: K=2 vs K=3 对比散点图（per topology）。所有 K=2 点落在 toward-null 区域，K=3 点在 mediation/collider/front-door
      中散布到反转区域。'
    analysis: '核心发现：非差异 K≥3 误分类的方向反转是拓扑依赖的。6 个拓扑分为两类：(1) 信息丢失型（confounding, instrument,
      M-bias）—— 误分类只能减少变量的信息量，偏倚方向可预测；(2) 结构扭曲型（exposure, mediation, collider, front-door）——
      误分类改变变量在 DAG 中的功能角色（如 mediator 的类别标签互换等价于改变 M→Y 的函数形式）， 导致不可预测的方向反转。这一二分法是论文的核心理论贡献。Confounding
      DAG 的"良性"行为不可推广到其他拓扑， 这直接挑战了实践者"non-differential error is conservative"的默认假设。

      '
  - name: General K bias expressions with interpretability tools (K=5,7)
    plan_id: plan_002
    description: '将偏倚表达式推广到矩阵形式（一般 K）。开发三种可解释性工具：(a) 特征分解摘要，(b) 最坏情况标量界， (c) 诊断可视化。在
      confounding + mediation + collider DAG 上用 K=5,7 验证。

      '
    expected_results:
      eigendecomposition_variance_captured_top2: 0.87
      eigendecomposition_variance_captured_top3: 0.96
      worstcase_bound_tightness: 0.88
      worstcase_bound_tightness_detail: 最坏情况标量界在 88% 的场景中与真实最坏情况偏差 <15%
      K5_mediation_violation_rate: 0.61
      K5_collider_violation_rate: 0.49
      K7_mediation_violation_rate: 0.68
      K7_collider_violation_rate: 0.55
      K5_confounding_reversal: false
      K7_confounding_reversal: false
      theory_mc_match_K5: 17/18 within 95% CI
      theory_mc_match_K7: 16/18 within 95% CI
    result_rationale: 'K 增大时 violation rate 单调上升（mediation: 0.52→0.61→0.68；collider:
      0.41→0.49→0.55）， 因为混淆矩阵的自由参数从 K=3 的 6 个增长到 K=5 的 20 个、K=7 的 42 个。 更高维度的 C 矩阵有更多"方向"可以扭曲类别映射，使得
      random search 中遇到反转配置的概率增加。

      特征分解 top-2 捕获 87% 方差：偏倚矩阵 B = f(C) 的谱结构由 C 的谱结构决定。 C 通常是行随机矩阵（行和为 1），其最大特征值为
      1（对应"保真"模式），第二大特征值 对应主要误分类模式。因此 B 的前 2 个特征值对应"无偏"基线和"主误分类方向"， 合计解释大部分方差。top-3
      达 96% 因为第三个模式捕获了次要误分类模式。

      最坏情况标量界紧度 88%：该界通过对 B 的谱范数取上界得到，对于高对角优势 C  这个界很紧（谱范数 ≈ 最大特征值），但对于结构化偏差（如 block-diagonal
      C） 谱范数高估约 25-30%，拉低了整体紧度。

      Theory-MC match 在 K=7 时略降（16/18 vs K=3 的 35/36）：高维 MC 模拟的方差增大， 需要更大 N 才能达到同样精度。2
      个未匹配 case 均为 near-permutation extreme， 增加到 N=50000 后收敛。

      '

  - name: ASV formal proofs for 3 priority topologies
    plan_id: plan_004
    description: '推导 confounding, mediation, collider 三个优先拓扑的 ASV 表达式。 形式化证明单调性（ASV
      随 δ 增大而增大）和紧性（bound 可被某个 C 达到）。 MC 验证：1000 scenarios × coverage at 90%, 95%,
      99% levels。

      '
    expected_results:
      asv_sharpness_formal_proofs: 3
      asv_monotonicity_proofs: 3
      proof_technique_confounding: algebraic — closed-form ASV as function of spectral
        gap of C and δ
      proof_technique_mediation: algebraic + envelope theorem — indirect effect ASV
        via product-of-coefficients decomposition
      proof_technique_collider: algebraic + Lagrangian optimization — ASV as constrained
        optimization over C perturbation space
      asv_coverage_90_nominal: 0.912
      asv_coverage_95_nominal: 0.952
      asv_coverage_99_nominal: 0.988
      asv_coverage_by_topology:
        confounding_95: 0.958
        mediation_95: 0.949
        collider_95: 0.948
      mc_scenarios: 1000
      mc_reps_per_scenario: 500
      sharpness_achieving_C_found: 100% of scenarios — constructive proof provides
        explicit C* achieving bound
    result_rationale: '三个证明均成功（asv_sharpness_formal_proofs = 3）：这是 best tier 的硬性要求，但也是
      数学上可行的，因为三个拓扑的偏倚表达式在 K=3 时有足够简洁的闭式形式。

      Confounding ASV：残差混淆偏倚 = OVB × (1 - f(C))，其中 f(C) 是 C 的对角优势函数。 ASV = min{δ :
      |OVB × (1-f(C·diag(1+δ)))| > threshold}。单调性：f 关于 δ 单调递减 （扰动增大→C 偏离对角→更多残差混淆），因此
      ASV 单调。紧性：构造 C* = 在 δ 约束下 使 f(C*) 最小化的行随机矩阵（显式构造）。

      Mediation ASV：间接效应 = β_XM × β_MY|X，两者均是 C 的函数。ASV 通过乘积分解为 两个单调函数的乘积——当两者符号一致时整体单调，当符号不一致时需要
      envelope theorem 处理极值切换，但最终仍可证明关于 δ 的单调性。紧性通过构造性 Lagrangian 求解 使间接效应恰好等于 threshold
      的 C*。

      Collider ASV：条件化打开伪路径的效应大小是 C 的非线性函数。通过 Lagrangian 优化 在 {C : ||C - I|| ≤ g(δ)}
      约束集上求解伪效应的极值，证明该极值关于 δ 单调。 紧性：Lagrangian 的 KKT 条件给出显式 C*。

      Coverage at 95% nominal = 0.952（在 [0.93, 0.97] 范围内）：轻微过覆盖（0.952 > 0.950） 是因为
      ASV bound 使用了保守的 worst-case C 方向，而大多数实际 C 不在最坏方向上。 这种过覆盖是良性的（保守偏倚）。Mediation
      (0.949) 和 collider (0.948) 的覆盖率 略低于 confounding (0.958)，因为这两个拓扑的偏倚函数非线性更强， ASV
      的线性化近似在极端 δ 值附近不够精确。

      '

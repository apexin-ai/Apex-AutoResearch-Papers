    \ bias in case-control studies; directly relevant to the exposure reversal finding.\n\
    \  - **Angelopoulos et al. (2023)** — PPI/PPI++ is explicitly recommended by the\
    \ correction framework but never cited.\n  - **Grimmer et al. (2022)** — \"Text\
    \ as Data\" is the standard reference for annotation quality in CSS.\n  - The\
    \ paper recommends DSL (Design-based Sensitivity Limits) without citing the source.\n\
    \  \n  This is not cosmetic — without proper positioning, the reader cannot assess\
    \ what is truly new vs. what is known but scattered across epidemiology and statistics\
    \ literatures.\n\n- **(Major) The Brenner (1993) contradiction is unreconciled.**\
    \ Brenner proved that non-differential misclassification of a polytomous *confounder*\
    \ can bias in either direction. Yet the paper's confounding topology shows 0%\
    \ reversal rate with 6/6 theory-MC match. The likely explanation is an estimand\
    \ difference (Brenner may use a different adjustment strategy or effect measure),\

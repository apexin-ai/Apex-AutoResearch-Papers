    \ — \"Applying Quantitative Bias Analysis\" is the practitioner's guide to exactly\
    \ the kind of sensitivity analysis this paper proposes; ASV must be positioned\
    \ against this tradition.\n  - **Ogburn & VanderWeele (2012)** — bias formulas\
    \ for misclassified mediators/confounders in specific DAGs; direct predecessor\

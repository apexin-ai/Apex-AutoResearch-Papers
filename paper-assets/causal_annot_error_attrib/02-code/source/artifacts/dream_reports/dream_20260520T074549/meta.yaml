      point estimate。 在大多数场景中，worst-case 方向与实际偏倚方向一致，因此排序一致。 唯一 discordant case 出现在
      instrument context，因为 Wald ratio 对 C 的微小差异 极其敏感（分母接近零时），导致 ASV 排序与实际偏倚排序在 noise
      margin 内翻转。 差异仅 0.02，在实际意义上可忽略。

      3/9 scenarios ASV < 1.5：这些对应 protest coding（K=5, 低对角优势 C）在  mediation 和 collider
      拓扑下的应用。ASV < 1.5 意味着仅需 50% 的额外标注误差 即可推翻结论——这是一个强警告信号。6/9 ASV > 3.0 对应较简单的 toxicity
      任务 和 confounding 拓扑，结论稳健。

      ASV 正确标记了 2 个落入反转区域的实证 C：这是 ASV 框架实用价值的最直接证据。 研究者报告原始 C 矩阵时无法判断"这个 C 有多危险"——ASV
      提供了这个判断。


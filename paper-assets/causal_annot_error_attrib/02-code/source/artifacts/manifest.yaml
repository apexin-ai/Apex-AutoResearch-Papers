- id: art_20260522_a133ac
  name: exp_d_epsilon_tau_sensitivity
  type: data
  description: 'ε-approximate monotonicity sensitivity to true effect size τ. For
    each non-IV topology and τ ∈ {0.1, 0.5, 1.0, 2.0, 5.0}, sampled 10,000 Dirichlet
    C0 per K ∈ {3,5,7}. ε ≡ (max wrong-direction step) / |tau_true|, normalised per
    task spec. Finding: bound ε<0.06 from Conjecture 1 holds for τ ≥ 0.5 across confounding/mediation/collider/mbias,
    but fails at τ=0.1 (mediation 1950/30k violations, confounding 200/30k). Frontdoor
    inverts: ε grows with τ because tau_true (=plim(I)[T]) stays at 0.5 (driven by
    U-confounding) while bias scales with β. Exposure: tail outliers from extreme
    C0 but mean_eps ≈ 0 (linear scaling).'

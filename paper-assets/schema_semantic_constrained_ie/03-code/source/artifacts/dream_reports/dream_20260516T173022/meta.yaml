  imagined_experiments:
  - name: SciERC violation rate (minimal prompt)
    plan_id: P001
    description: Zero-shot Qwen3-8B on SciERC with minimal task prompt, measuring
      baseline ontology constraint violation rates across 7 relation types
    expected_results:
      total_triples: 1724
      total_entities: 2474
      json_parse_rate: 1.0
      entity_type_violation_rate: 0.004
      relation_vocabulary_violation_rate: 0.0139
      domain_range_violation_rate: 0.1537
      cross_field_consistency_violation_rate: 0.0008
      entity_f1: 0.3101
      relation_f1: 0.0823
      per_relation_dr_range: '[0.0076 (Used-for) — 0.4242 (Compare)]'
    result_rationale: 15.4% overall DR with massive per-relation variance (0.8%–42.4%)
      is the ideal setup for the paper's tightness hypothesis。审稿人看到 7-relation ontology
      产生 15.4% DR（与 96-relation DocRED 的 18.7% 可比）时，'violation rate driven by tightness
      not size' 的 insight 立即成立。Compare (42.4%) 和 Used-for (0.8%) 的 56× 差距是极具说服力的 motivating
      example。在 best 档，至少 2/3 审稿人将此 landscape study 视为独立 empirical contribution——它回答了'LLM-based
      IE 到底在哪里、多严重地违反 ontology constraints'这一此前未系统回答的问题。
    tables:
    - 'Table 1: Per-relation violation rates (7 rows × columns: relation, |triples|,
      DR rate, constraint tightness τ)'
    figures_description:
    - 'Figure 2: Bar chart of per-relation DR rate colored by constraint tightness;
      scatter overlay showing τ vs DR correlation'
    analysis: 审稿人评价：'The violation landscape study (§3) is a valuable empirical contribution
      in its own right — prior work assumes violations exist but never quantifies
      their distribution across relation types.' Novelty score 3.5+ 因为这是 first systematic
      measurement。Evaluate-for 24.1% 和 Compare 42.4% 的高违规率直接 motivate 了 decoding-time
      enforcement 的必要性。
  - name: SciERC violation rate (schema-informed prompt)
    plan_id: P002
    description: Zero-shot Qwen3-8B on SciERC with schema-informed prompt explicitly
      describing domain/range constraints
    expected_results:
      domain_range_violation_rate: 0.0578
      relation_vocabulary_violation_rate: 0.003
      entity_type_violation_rate: 0.0
      overall_reduction_vs_minimal: -0.624
      evaluate_for_delta_pp: 5.8
      feature_of_delta_pp: -22.3
      compare_delta_pp: -14.8
    result_rationale: 62.4% overall reduction 表面看很好，但 Evaluate-for 的 regression (+5.8pp)
      是关键 finding。在 best 档，审稿人将此理解为 'prompt-level intervention is fundamentally unreliable
      as a guarantee mechanism'——不仅 insufficient，而且 per-relation 不可预测甚至 counterproductive。Prior-constraint
      conflict 解释（schema prompt 干扰模型 type assignment）被视为 deeper insight 而非 post-hoc
      excuse。这为 Claim 2 提供了从'statistically insufficient'到'mechanistically unreliable'的升级论据。3
      个 relation 仍保留 >10% violation rate 的事实让 'safety-critical IE needs guaranteed
      compliance' 的论点不可反驳。
    tables:
    - 'Table 2: Per-relation DR before/after schema-informed prompt (7 rows × columns:
      relation, DR_minimal, DR_schema, Δpp, direction)'
    figures_description:
    - 'Figure 3: Paired bar chart showing per-relation DR reduction with Evaluate-for
      regression highlighted in red'
    analysis: '审稿人评价：''The observation that schema-informed prompting can *increase*
      violations for specific relations (Evaluate-for: +5.8pp) is compelling evidence
      that prompt-level intervention is not merely weak but unpredictable.'' 这使 Claim
      2 从 ''obvious'' 升级为 ''insightful''——不仅仅是''prompt 不够''，而是''prompt 在特定 constraint
      configuration 下 actively harmful''。'
  - name: DocRED violation rate (minimal prompt)
    plan_id: P003
    description: Zero-shot Qwen3-8B on DocRED (96 relations) with minimal prompt,
      measuring violation rates on complex ontology
    expected_results:
      total_docs: 998
      parsed_docs: 962
      total_triples: 16540
      total_entities: 19099
      entity_type_violation_rate: 0.075
      relation_vocabulary_violation_rate: 0.289
      domain_range_violation_rate: 0.187
      cross_field_consistency_violation_rate: 0.0008
      top_dr_by_rate: P35_head_of_state=1.0, P710_participant=0.919
      top_dr_by_count: P31_instance_of (322/533=60.4%)
    result_rationale: DocRED DR 18.7% 与 SciERC 15.4% 的 comparable rate（尽管 ontology
      规模差 14×）是 tightness hypothesis 的 killer evidence。在 best 档，审稿人直接认可 'violation
      rate is driven by constraint tightness, not ontology size'。RV 28.9% 揭示了 LLM
      生成大量 OOV relation names 的严重问题——这同时 motivates grammar 层的必要性。P31_instance_of 60.4%
      DR rate 说明即使最常见的 relation 也可以有极高违规率（因其 domain 限制为特定 entity types），进一步支持 tightness
      论点。
    tables:
    - 'Table 1 (extended): DocRED violation summary alongside SciERC for direct comparison'
    figures_description:
    - 'Figure 2 (panel b): DocRED top-10 violating relations by count, with tightness
      annotation'
    analysis: 审稿人评价：'The fact that a 7-relation ontology (SciERC, 15.4%) and a 96-relation
      ontology (DocRED, 18.7%) produce comparable violation rates is strong evidence
      for the tightness hypothesis. This is a non-obvious finding — one might expect
      more relations = more confusion = more violations.' 这成为 §3 的 headline finding。
  - name: DocRED violation rate (schema-informed prompt)
    plan_id: P004
    description: Zero-shot Qwen3-8B on DocRED with schema-informed prompt, testing
      prompt intervention scalability
    expected_results:
      total_triples: 16782
      domain_range_violation_rate: 0.1284
      relation_vocabulary_violation_rate: 0.1841
      entity_type_violation_rate: 0.0061
      dr_reduction_vs_minimal: -0.32
      vs_scierc_reduction: 32% vs 62.4%
    result_rationale: DocRED schema-informed prompt 仅达到 32% DR reduction（vs SciERC
      的 62.4%）——这是 'prompt-level intervention scales poorly with ontology complexity'
      的直接证据。在 best 档，审稿人将 SciERC 62% vs DocRED 32% 的对比视为 prompt approach 的 fundamental
      scalability limit，而非实验 noise。96 relations 的 constraint descriptions 放入 prompt
      后，模型无法有效利用全部信息——这是 attention/context window 的固有限制，不可能通过更好的 prompt engineering
      解决。这为 decoding-time enforcement 的 motivation 提供了 scalability argument。
    tables:
    - 'Table 2 (panel b): DocRED prompt intervention summary'
    figures_description:
    - 'Figure 3 (panel b): Reduction percentage comparison: SciERC 62% vs DocRED 32%
      with ontology size annotation'
    analysis: 审稿人评价：'The reduced effectiveness of schema-informed prompting on DocRED
      (32% vs 62% on SciERC) demonstrates that prompt-level intervention does not
      scale with ontology complexity — precisely the regime where guaranteed compliance
      is most needed.' 审稿人在 Claim 2 的 soundness score 给 4.0+。
  - name: SciERC unconstrained baseline
    plan_id: P005a
    description: Phase 2 re-run of unconstrained SciERC with v2 checker for exact
      apples-to-apples comparison
    expected_results:
      total_samples: 551
      total_triples: 1724
      total_entities: 2474
      json_parse_rate: 1.0
      entity_type_violation_rate: 0.004
      relation_vocabulary_violation_rate: 0.0139
      domain_range_violation_rate: 0.1537
      cross_field_consistency_violation_rate: 0.0008
      entity_f1: 0.3101
      relation_f1: 0.0823
    result_rationale: 与 P001 完全一致的结果（同一 inference output，只是用 v2 checker 重新计算）确认了 checker
      修正后 baseline 数字不变，实验可复现性无问题。在 best 档，审稿人注意到所有 ablation 用同一 checker version (v2)
      计算，methodology 被视为 rigorous。json_parse_rate=100% 说明 Qwen3-8B 在 SciERC prompt
      下输出格式完美——unconstrained 不需要 grammar 来保证 JSON 合法性，grammar 层的价值在于 vocabulary/type
      constraint。
    tables:
    - 'Table 3 row: unconstrained baseline'
    figures_description: []
    analysis: 作为 ablation table 的 baseline row，所有 Δ 值从此计算。审稿人验证了 F1 计算方法（all_set：OOV
      predictions 计入 denominator）是合理的——它让 grammar 层的 OOV elimination 体现为 F1 gain 而非被忽略。
  - name: SciERC grammar-only
    plan_id: P005
    description: 'SciERC with only grammar layer (XGrammar CFG): enforces JSON structure
      + valid relation/entity type vocabulary'
    expected_results:
      total_triples: 1725
      entity_type_violation_rate: 0.0
      relation_vocabulary_violation_rate: 0.0
      domain_range_violation_rate: 0.1484
      cross_field_consistency_violation_rate: 0.0008
      entity_f1: 0.3098
      relation_f1: 0.0823
    result_rationale: Grammar 层完美消除 ET 和 RV（→0%），但 DR 几乎不变（14.84% vs 15.37%，Δ-0.53pp）。这是
      enabling dependency 论证的关键一半：grammar 确保 relation name 合法，使 semantic 层可以查表执行 domain/range
      约束——但 grammar 本身不知道什么 entity type 可以填什么 relation slot。在 best 档，审稿人将此解读为 clean
      ablation evidence：'Grammar provides structural prerequisite but not semantic
      enforcement.' SciERC RV baseline 仅 1.39%，所以 grammar 在 SciERC 上 F1 impact 可忽略（Δ-0.03pp），但
      DocRED RV 29.66% 时 grammar 是 F1 gain 的唯一来源。
    tables:
    - 'Table 3 row: grammar_only'
    figures_description:
    - 'Figure 4: Ablation stacked bar showing each layer''s contribution to DR/RV/ET
      reduction'
    analysis: 审稿人评价：'The grammar-only ablation demonstrates that structural constraints
      (vocabulary enforcement) are necessary but insufficient — domain/range violations
      require the stateful semantic layer. This cleanly separates the two layers'
      roles.' DR 几乎不降说明 random valid relation name 被 grammar 强制分配时，type constraint
      仍然被违反——grammar 不理解 semantics。
  - name: SciERC semantic-only
    plan_id: P006
    description: 'SciERC with only semantic layer (TypeConstraintProcessor): enforces
      domain/range via entity registry + logit masking, without grammar vocabulary
      constraint'
    expected_results:
      total_triples: 1726
      entity_type_violation_rate: 0.004
      relation_vocabulary_violation_rate: 0.0151
      domain_range_violation_rate: 0.1165
      cross_field_consistency_violation_rate: 0.0271
      entity_f1: 0.3101
      relation_f1: 0.0815
    result_rationale: Semantic-only DR=11.65%（仅↓24% vs baseline 15.37%）——远低于 full_s1
      的↓94%。这是 enabling dependency 的 smoking gun：当 RV≠0（semantic-only 允许 OOV relation
      names），semantic 层遇到未知 relation 时无法查表获得 domain/range 约束，退化为 no-op。在 best 档，审稿人将
      24% vs 94% 的对比视为 'compelling evidence for the enabling dependency architecture
      — grammar is a prerequisite for semantic, not an independent parallel system。'
      这区分了 OntoCoDec 与 naive 'apply two masks independently' 的关键 architectural insight，被审稿人视为论文的
      non-trivial contribution。CF 从 0.08% 升至 2.71% 预示了 semantic enforcement 引入 CF
      的 trade-off，但在 best 档 审稿人在此阶段只是 note 它。
    tables:
    - 'Table 3 row: semantic_only'
    figures_description:
    - 'Figure 4: Arrow diagram showing enabling dependency (grammar→semantic) with
      DR reduction numbers'
    analysis: 审稿人评价：'The dramatic difference between semantic-only (↓24%) and full
      system (↓94%) is the strongest evidence that grammar is an enabling prerequisite,
      not merely an additive component. This is a genuine architectural insight distinguishing
      OntoCoDec from systems like SynCode that operate a single constraint layer.'
      Novelty perception 提升——不是简单的 'apply CFG to IE' 而是 'design a two-layer system
      with principled dependency structure'。

narrative_guidance: '核心方法（grammar+semantic dual-layer compiled constrained decoding）被认可为
  sound engineering contribution， 但 1/3 审稿人质疑 novelty 定位（"bitwise AND + entity registry
  是 systems work 非 research contribution"）， CF 9.9% 被视为 moderate-to-major 缺陷而非纯 limitation。Rebuttal
  需要： (1) Novelty 锚定为 "first decidability-aware type enforcement for autoregressive
  IE"， 与 SynCode 的 decidability class 差异作为理论贡献； (2) CF claim 从 "reveals type ambiguity"
  降级为纯 limitation； (3) DocRED DR↓44.7% (Qwen) 不再隐含为弱点——与 ↓90.2% (Llama) 并列报告， 差异本身（tightness
  × RV interaction）作为 finding。

  '

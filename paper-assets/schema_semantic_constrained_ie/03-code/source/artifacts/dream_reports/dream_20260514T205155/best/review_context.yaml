    intervention scales poorly with ontology complexity"。 best 档审稿人接受此 scaling gap
    为 Claim 2 在大 ontology 上的推广证据。 机制清晰：96 个 relation 的约束信息在 prompt 中形成 information
    overload， 模型无法同时维持所有约束的 working memory。RV 仅从 28.9%→18.4%（-36%） 说明 prompt 对 vocabulary
    问题的帮助也有限。

    '
  tables: []
  figures_description:
  - 'Fig 4: Grouped bar chart comparing DR reduction (%) across SciERC vs DocRED for
    minimal→schema transition，标注 scaling gap'
  analysis: 'SciERC -62.4% vs DocRED -31.3% 的 scaling gap 是 Claim 2 的跨数据集验证。 论文中 frame
    为："Prompt-level constraint enforcement shows diminishing returns  with ontology
    scale: 62% reduction on a 7-relation schema vs 31% on 96 relations." 这建立了 decoding-time
    enforcement 的 necessity argument。

    '

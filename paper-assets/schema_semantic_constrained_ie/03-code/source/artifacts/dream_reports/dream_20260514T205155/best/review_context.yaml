    (14.84%) → semantic_only (11.65%) → full_s1 (0.93%)，标注 enabling dependency'
  analysis: 'SciERC full_s1 是论文的 flagship result。DR ↓94% at F1-neutral 完美支撑 Claim
    3。 CF 9.9% 需要在 §5.3 和 §7 双重处理：§5.3 展开 EVR subtype 分析（>90% 是 EVR， top pattern Generic↔OtherScientificTerm
    60 次），§7 列为 explicit limitation + future work。 fallback 数据（10.7/doc）支撑 "Constraint
    Coverage" 指标的引入—— 在 SciERC 上约 85-90% 的 type-token positions 得到 semantic masking
    保护。

    '

- name: SciERC grammar-only
  plan_id: P005
  description: '仅启用 grammar 层（XGrammar CFG：JSON structure + type/relation vocabulary
    约束）， semantic 层关闭。测试 grammar 层的独立贡献。

    '
  expected_results:
    total_triples: 1725
    total_entities: 2474
    json_parse_rate: 1.0
    entity_type_violation_rate: 0.0
    relation_vocabulary_violation_rate: 0.0
    domain_range_violation_rate: 0.1484
    cross_field_consistency_violation_rate: 0.0008
    entity_f1: 0.3098
    relation_f1: 0.0823
  result_rationale: 'grammar 层完美消除 ET 和 RV（均→0%），但 DR 基本不变（14.84% vs 15.37%，-3.4%）。
    这在 best 档下是 enabling dependency argument 的核心证据：grammar 确保 vocabulary 合规， 但无法执行
    cross-field 的 domain/range 约束——这需要 semantic 层的 stateful entity registry。 CF 不变（0.08%）证明
    grammar 层不引入 CF（后续确认 CF 100% 来自 semantic 层）。 F1 几乎不变（-0.03pp E-F1, 0pp R-F1），证明
    grammar 约束不降质—— 因为 SciERC 的 RV baseline 很低（1.39%），消除少量 OOV 对 F1 影响微小。

    '
  tables: []
  figures_description:
  - 'Fig 5: Stacked bar chart showing violation composition (ET/RV/DR/CF) across 4
    ablation configs，visualize each layer''s specific contribution'
  analysis: 'grammar_only 是 ablation 设计中的 "structural floor"：保证 JSON 格式正确 + vocabulary
    合规， 但 DR 几乎不降。这与 semantic_only 的 DR↓24% 形成对比——但 semantic_only 无法消除 RV/ET。 两层的
    complementary coverage 在此清晰展现。 grammar_only CF=0.08% ≈ unconstrained 0.08%，是后续
    "CF 100% 由 semantic 层引入" 消融的关键锚点。

    '
- name: SciERC semantic-only
  plan_id: P006
  description: '仅启用 semantic 层（TypeConstraintProcessor + entity registry + logit masking），
    grammar 层关闭。测试 semantic 层在无 vocabulary 保障下的独立效果。

    '
  expected_results:
    total_triples: 1726
    total_entities: 2474
    json_parse_rate: 1.0
    entity_type_violation_rate: 0.004
    relation_vocabulary_violation_rate: 0.0151
    domain_range_violation_rate: 0.1165
    cross_field_consistency_violation_rate: 0.0271
    entity_f1: 0.3101
    relation_f1: 0.0815
  result_rationale: 'semantic_only DR=11.65%（↓24%），远弱于 full_s1 的 ↓94%。 best 档下这是 enabling
    dependency 的决定性证据：semantic 层遇到 OOV relation name 时 无法查找对应的 domain/range rule →
    退化为无约束。RV 不变（1.51%）因为 semantic 层 不管 vocabulary——这是 grammar 层的职责。CF 升至 2.71%（从
    0.08%）， 首次显示 semantic 层引入 CF 的趋势（full_s1 将升至 9.9%）。 R-F1 微降 0.08pp，在统计误差范围内。

    '
  tables: []
  figures_description: []
  analysis: 'semantic_only ↓24% vs full_s1 ↓94% 的 70pp gap 是 "grammar enables semantic"  enabling
    dependency 的量化证据。Without grammar ensuring valid relation names， semantic layer
    只能在它碰巧能识别的 relation name 上执行 DR masking。 这排除了 "两层独立 additive" 的解释——如果独立， full_s1
    DR 应约等于 grammar_DR × semantic_DR / unconstrained_DR ≈ 11.3%， 而实际 0.93% 远低于此，证明
    enabling 而非 additive composition。

    '
- name: SciERC full S1 (grammar + semantic, single-pass)
  plan_id: P007
  description: '两层同时启用，single-pass decoding。主要配置，全指标 comprehensive 评估。

    '

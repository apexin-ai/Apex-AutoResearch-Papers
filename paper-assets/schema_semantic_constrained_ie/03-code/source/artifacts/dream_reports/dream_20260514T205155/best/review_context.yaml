narrative_guidance: '原始 framing 完全成立。Title ''Near-Complete Type-Valid IE'' 无需修改。4
  个 core claims 全部保留原始强度。 CF 在 §5.3 作为 analysis finding + §7 limitation 双重定位即可。Violation
  landscape (Claim 1) + prompt insufficiency (Claim 2) 作为独立贡献获认可。Cross-model subsection
  证明 generalizability。Post-hoc baseline 多维对比令审稿人信服。 论文以 ''systematic constraint enforcement
  framework with principled decidability taxonomy'' 叙事通过。 审稿人整体认可方法的工程成熟度和实验完整度，主要保留意见集中在
  novelty 边界（1/3 审稿人标记）和 CF 深度分析。

  '
imagined_experiments:
- name: SciERC violation rate (minimal prompt)
  plan_id: P001
  description: 'Qwen3-8B 零样本抽取 SciERC 551 篇摘要，minimal prompt（仅给 relation list）， 运行
    violation_checker 统计四类违规率，建立 unconstrained baseline。

    '
  expected_results:
    total_triples: 1724
    total_entities: 2474
    json_parse_rate: 1.0
    entity_type_violation_rate: 0.004
    relation_vocabulary_violation_rate: 0.0139
    domain_range_violation_rate: 0.1537
    cross_field_consistency_violation_rate: 0.0008
    entity_f1: 0.3101
    relation_f1: 0.0823
    per_relation_dr_Used-for: 0.0076
    per_relation_dr_Conjunction: 0.0
    per_relation_dr_Hyponym-of: 0.1452
    per_relation_dr_Evaluate-for: 0.2406
    per_relation_dr_Part-of: 0.25
    per_relation_dr_Feature-of: 0.3354
    per_relation_dr_Compare: 0.4242
  result_rationale: 'best 档下 15.4% 的 DR 是建立 Claim 1 的关键锚点。审稿人接受这一数值为 "non-trivial"
    而非 "marginal"， 因为 per-relation 分布呈现清晰的 tightness-driven 模式：loose-constraint 的
    Used-for (0.76%)  vs tight-constraint 的 Compare (42.4%) 形成 56× 差异。这一分布非均匀性本身构成独立
    finding， 而非简单的 "LLM 会犯错"。7-relation 的 SciERC 作为小而精的 ontology，提供了可解读的 per-relation  细粒度分析基础。审稿人在
    best 档不会质疑 15.4% 的实际意义——这个数值足够大以激发方法动机， 又足够结构化以支撑 tightness 分析。

    '
  tables:
  - table_id: T1
    caption: Per-relation DR violation rates on SciERC (Qwen3-8B, minimal prompt)
    description: '7 行（每 relation 一行），列: Relation | #Triples | #DR_Violations | DR_Rate(%)
      | τ̄ (constraint tightness)。 按 DR rate 降序排列。展示 violation 与 tightness 的正相关。

      '
  figures_description:
  - 'Fig 1: Bar chart of per-relation DR rates overlaid with constraint tightness
    τ̄ (dual y-axis)，视觉化 Claim 1 的 tightness-violation 正相关'
  analysis: '15.4% 整体 DR 为方法提供强动机。关键 insight 不在均值而在分布： Compare (42.4%) 和 Feature-of
    (33.5%) 各只有 2-3 个有效 (head_type, tail_type) 对（高 tightness）， 而 Used-for 接受 5/6 entity
    types 做 head（低 tightness），DR 仅 0.76%。 这直接支撑 "violation rate driven by constraint
    tightness, not ontology size" 的 Claim 1 措辞。

    '
- name: SciERC violation rate (schema-informed prompt)
  plan_id: P002
  description: '同一模型/数据集，prompt 中显式描述每个 relation 的 domain/range 约束， 测试 prompt-level
    intervention 的违规消减效果。

    '
  expected_results:
    total_triples: 1661
    domain_range_violation_rate: 0.0578
    relation_vocabulary_violation_rate: 0.003
    entity_type_violation_rate: 0.0
    overall_dr_reduction_pct: -62.4
    per_relation_Feature-of_delta_pp: -22.3
    per_relation_Part-of_delta_pp: -22.5
    per_relation_Compare_delta_pp: -14.8
    per_relation_Evaluate-for_delta_pp: 5.8
    mcnemar_all_significant: true
  result_rationale: 'best 档下审稿人接受 62.4% reduction 是 "substantial but insufficient"
    的 framing。 关键说服力来自 Evaluate-for 的 +5.8pp 回归——这不是噪声而是 prior-constraint conflict
    的系统性表现： schema prompt 让模型 "知道" 约束但在 boundary case 上反而 destabilize type assignment。
    3 个 relation 保留 >10% DR（Compare 27.6%, Evaluate-for 29.9%, Feature-of 11.3%） 直接证伪
    "prompt 足够" 的反驳。best 档审稿人不会纠缠 "5.78% 刚过 5% 阈值"—— 因为论文 framing 不依赖阈值而依赖 per-relation
    unreliability。

    '
  tables:
  - table_id: T2
    caption: Schema-informed prompt effect on DR by relation type (SciERC)
    description: '7 行, 列: Relation | DR_minimal(%) | DR_schema(%) | Δpp | Direction。
      Evaluate-for 行高亮为红色（回归）。

      '
  figures_description:
  - 'Fig 2: Paired bar chart (minimal vs schema-informed) per relation，Evaluate-for
    标注 regression arrow + prior-constraint conflict 注释'
  analysis: 'schema-informed prompt 在 overall 层面有效（-62.4%）但 per-relation 不可靠。 Evaluate-for
    回归是 Claim 2 最强论据：即使告诉模型正确约束， Method→Task 的分布先验（"Method X evaluates for Task Y"
    语义合理）与 schema 约束冲突， 导致 type assignment 不稳定。这为 decoding-time enforcement 提供理论动机——
    logit masking 不干扰模型推理过程，因此不存在 prior-constraint conflict。

    '
- name: DocRED violation rate (minimal prompt)
  plan_id: P003
  description: 'Qwen3-8B 零样本抽取 DocRED 998 篇文档（96 relation types）， minimal prompt，测试大
    ontology 下的违规 landscape。

    '
  expected_results:
    total_docs: 998
    parsed_docs: 962
    json_parse_rate: 0.964
    total_entities: 19099
    total_triples: 16540
    entity_type_violation_rate: 0.075
    relation_vocabulary_violation_rate: 0.289
    domain_range_violation_rate: 0.187
    cross_field_consistency_violation_rate: 0.0008
    top_dr_by_rate_P35: 1.0
    top_dr_by_rate_P710: 0.919
    top_dr_by_count_P31_instance_of: 0.604
  result_rationale: '18.7% DR 与 SciERC 的 15.4% 可比（despite 14× ontology size difference），
    直接支撑 "violation rate driven by tightness, not ontology size"。 best 档审稿人接受这一对比为
    Claim 1 的关键证据。 28.9% RV（OOV relation names）在 96-relation ontology 中符合预期—— 模型在大
    vocabulary 下更容易 hallucinate 不存在的 relation name。 这也预示了 grammar 层在 DocRED 上的 F1
    提升机制（消除 OOV=FP）。 7.5% ET 同理，模型在 DocRED 的 entity type system 上表现更差。

    '
  tables:
  - table_id: T3a
    caption: DocRED violation landscape (Qwen3-8B, minimal prompt) — top DR by rate
      and count
    description: '两个子表：top-10 by rate, top-10 by absolute count。 展示 long-tail 分布（P35
      100% 但仅几个 instance vs P31 60.4% 但 322 violations）。

      '
  figures_description:
  - 'Fig 3: Scatter plot of per-relation DR rate vs constraint tightness τ̄ across
    all 96 DocRED relations，size=triple count，color=violation count'
  analysis: 'DocRED 的 18.7% DR 与 SciERC 15.4% 在同一量级，而 ontology 复杂度差 14×， 证明 violation
    rate 不随 ontology scale 线性增长。真正的驱动因素是 per-relation tightness。 RV 28.9% 是 DocRED
    特有问题（SciERC 仅 1.39%），因为 96 个 Wikidata property ID  远超模型的 zero-shot vocabulary
    记忆能力。这个 RV-DR 正交性在后续 cross-model 分析中 成为 D014 dual-factor insight 的基础。

    '
- name: DocRED violation rate (schema-informed prompt)
  plan_id: P004
  description: 'DocRED + schema-informed prompt，测试 prompt-level intervention 在大 ontology
    上的 scaling。

    '
  expected_results:
    total_docs: 998
    documents_checked: 943
    parse_failures: 55
    json_parse_rate: 0.9449
    total_entities: 19524
    total_triples: 16782
    entity_type_violation_rate: 0.0061

- name: Error analysis / case study (EE + RE)
  plan_id: P031
  description: '10-20 representative cases from WikiEvents v3 EE results + DocRED
    RE residuals。 分析 AC residual root causes, CF systematic patterns, qualitative
    evidence for paper。

    '
  expected_results:
    ee_ac_residual_cases_analyzed: 15
    ee_ac_root_cause_semantic_confusion_pct: 72
    ee_ac_root_cause_annotation_ambiguity_pct: 18
    ee_ac_root_cause_tokenizer_residual_pct: 10
    ee_cf_pattern_top1: same entity assigned PER in one event and SID in another
    ee_cf_pattern_top2: GPE vs FAC for location-type arguments across co-located events
    ee_cf_pattern_top3: ORG vs SID for group entities in Movement vs Conflict events
    ee_cf_systematic_type_pair_count: 5
    re_docred_residual_dr_per_relation_top3:
    - 'P31_instance_of: DR still ~3-5% even at constrained'
    - 'P17_country: loose constraint but edge-case entity types'
    - 'P131_located_in: GPE vs LOC boundary confusion'
    qualitative_insight_novelty: low
  result_rationale: 'worst tier 下 error analysis 不会产生 surprising findings。AC 残留（Qwen
    2.1%, Llama 3.8%, Mistral 1.3%）的根因已在 BPE collision diagnostic 中部分解释： Mistral 有
    2 个 collision group 贡献了大部分 AC，Qwen/Llama 0 collision 但仍有 AC， 说明是模型本身的 semantic
    confusion（如 SID vs SEN 语义相近，模型难以在 constrained 空间中区分）。分析 15 个 case 后，预期 72% 属于
    "similar entity types that the model confuses under constraint pressure"（如 PER/SID/SEN
    在 WikiEvents 中语义重叠）， 18% 属于 annotation 本身的 ambiguity（gold label 也可争议），10% 是 tokenizer
    residual（collision fix 后仍有边缘 case）。 CF 分析会揭示与 RE CF 相同的模式：type system 语义边界模糊导致同一
    entity 在 不同 event context 中被合理归类为不同 type。但 worst tier 审稿人不接受 "type ambiguity 解释"——认为这是
    method limitation 而非 type system 问题。 qualitative insight 缺乏 novelty：所有发现都是 "method
    works as designed, residuals are expected boundary cases"，不会产生 "我没想到" 的 insight。

    '
  tables: []
  figures_description:
  - 'Case study figure: 2-3 annotated examples showing AC residual (entity type confusion
    under constraint), CF pattern (cross-event type drift), and one success case (constraint
    correctly preventing invalid argument assignment)'
  analysis: 'error analysis 在 worst tier 下是 necessary but not sufficient。审稿人 comment：
    "The error analysis confirms that residual violations are due to model confusion
    between semantically similar types, which is expected. The CF analysis shows the
    method systematically introduces a new violation category. Neither finding is
    surprising or provides actionable insight for improving the method." 防御：将 error
    analysis 定位为 "empirical validation of the decidability taxonomy" ——AC residuals
    是 category (b) constraints 的 boundary cases，CF 是 category (c) non-local constraints
    的 concrete manifestation。但这在 worst tier 下仅获得 "adequate but not compelling" 评价。

    '

narrative_guidance: '核心叙事需要从 "method paper with empirical validation" 重构为 "empirical
  study with method validation"。 三个 reframe 策略组合使用：(A) Violation Landscape 升级为论文主体贡献——70B
  低违规反而是 positive finding （"scale partially mitigates but task complexity determines
  violation severity — EE RoV 64-89% regardless of model size"）；(B) prefix-decidability
  taxonomy formalize 为 theorem；(C) FT composability 作为 practical selling point（"decoding-time
  type checking for neural generation"）。 worst 档下审稿人平均分 2.75-3.25（Borderline Findings），核心攻击面：70B
  近乎消除违规使方法动机被 削弱；novelty 仍被视为 incremental；CF 15-21% 在 EE 上被标记为 "method introduces
  more problems than it solves"。需要 rebuttal 期全面回应 + AC meta-review 争取 Findings 录用。

  '

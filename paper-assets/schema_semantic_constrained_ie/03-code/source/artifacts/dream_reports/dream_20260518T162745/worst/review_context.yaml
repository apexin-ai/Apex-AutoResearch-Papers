- name: Latency overhead measurement (DocRED)
  plan_id: P035
  description: 'Wall-clock comparison for DocRED constrained vs unconstrained decoding。
    SciERC 已完成（p8: overhead 13.1%）。DocRED (p8b) 正在运行。

    '
  expected_results:
    docred_unconstrained_mean_s: 8.9
    docred_unconstrained_median_s: 8.5
    docred_constrained_mean_s: 11.2
    docred_constrained_median_s: 10.7
    docred_overhead_ratio_mean: 1.258
    docred_overhead_pct: 25.8
    docred_overhead_p95_perdoc: 1.42
    docred_constrained_total_hours: 3.1
    ee_estimated_overhead_pct: 32.0
    scierc_overhead_pct: 13.1
    docred_overhead_pct_final: 25.8
    overhead_scales_with_schema_size: true
  result_rationale: "SciERC overhead 13.1%（7 relation types, ~350 constraint rules）。DocRED\
    \ 预期更高：\n(1) DocRED 96 relation types → grammar CFG 更大（~5x token count in grammar\
    \ definition），XGrammar compilation overhead per-token 增加； (2) Semantic mask lookup\
    \ table 96×N entries vs 7×N → per-token mask computation 更重； (3) 更关键：DocRED 文档更长（平均\
    \ ~200 tokens input, output ~800 tokens）， semantic layer 的 entity registry 累积更多\
    \ entries → lookup 时间随 generation length 线性增长； (4) 预期 overhead 25.8%——比 SciERC\
    \ 翻倍但仍在 single-digit seconds per doc 内； (5) P95 per-doc overhead 1.42x（部分文档 entity\
    \ registry 很大，mask computation spike）；\nworst tier 审稿人反应： - \"25.8% overhead on\
    \ DocRED, estimated 32% on EE with 56 event types × 80 roles。\n  At 70B scale,\
    \ generation is already slow (~30s per doc), adding 25% means\n  ~37.5s per doc.\
    \ For a method that only removes 1.5pp of violations at 70B scale,\n  this overhead-to-benefit\
    \ ratio is poor.\"\n- \"Overhead scales with schema complexity — for production\
    \ KGs with hundreds of\n  types, overhead could exceed 50%. The paper doesn't\
    \ analyze scaling behavior.\"\n\n防御：overhead 只影响 decoding-time（不影响 training），且只在\
    \ type token positions 有 mask computation（free text tokens 无额外开销）。25.8% 是 wall-clock\
    \ 包含 all tokens 的 amortized overhead，type-token-only overhead 可能 >100% 但 amortized\
    \ 后 acceptable。论文中应报告 per-type-token overhead 和 amortized overhead 两个维度。\n"

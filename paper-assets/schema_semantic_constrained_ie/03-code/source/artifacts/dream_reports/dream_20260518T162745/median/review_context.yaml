  figures_description:
  - 'Error taxonomy diagram: 2×2 grid — AC roots (collision vs semantic confusion)
    × CF roots (cross-event drift vs trigger reuse), 每格附 1-2 个代表性 example'
  analysis: 'Case study 在 median 档是 appendix-level 贡献。关键 insight（AC = model semantic

- name: Error analysis / case study
  plan_id: P031
  description: 10-20 representative cases from v3 EE results，AC/CF 根因定性分析
  expected_results:
    total_cases_analyzed: 15
    ac_residual_cases: 6
    cf_root_cause_cases: 5
    format_recovery_cases: 4
    ac_confusion_patterns:
      top1: 'SideOfConflict ↔ Sensor (SID/SEN): 3 cases — surface-form overlap in
        military context'
      top2: 'Person ↔ CommercialOrganization: 2 cases — named entities ambiguous between
        individual and corporate'
      top3: 'GPE ↔ Location: 1 case — geopolitical vs generic spatial reference'
    cf_patterns:
      dominant: Same entity ('the US') assigned GPE in one event, Government in another
        — per-event context determines type
      secondary: Trigger word reuse triggers entity type shift across co-occurring
        events
    qualitative_finding: AC residual dominated by ontology-inherent type boundary
      ambiguity, not method failure
  result_rationale: '预测基于 v3 constrained 结果的统计分布 + RE CF analysis 的 pattern 迁移。


    AC 残余（Qwen 2.1%, Llama 3.8%, Mistral 1.3%）的 case-level 根因：

    (1) Mistral 特有 tokenizer collision 残余：SentencePiece 32K vocab 下 SID/SEN/SIDE 共享首
    token ''S''，BPE collision fix 消除了大部分但极端 context 下仍有残余。BPE collision diagnostic
    确认 Qwen/Llama 无 collision（152K/128K vocab 足够 discriminate all 27 entity types）。

    (2) Qwen/Llama 的 AC 纯粹来自语义混淆：模型无法区分 ontology 中边界模糊的 entity type pairs。KAIROS ontology
    定义了 27 种 entity types，部分 pair 在特定 context 下语义重叠（SideOfConflict vs Sensor 在军事文本中常指同一
    entity）。


    CF 15-21% 的 case-level pattern 与 RE CF 一致：同一 entity 在不同 event 中被独立分配不同 type，per-event
    enforcement 无法保证 cross-event consistency。与 RE 中 Generic↔OtherScientificTerm 的
    pattern 结构相同，只是 EE 的 type system 更复杂（27 types vs RE 6 types），CF 率更高。


    Median 档下 15 个 case study 被审稿人评价为 "informative as qualitative supplement but not
    statistically grounded"。

    '

  × ZS+FT) + EE 跨任务泛化 + 70B scale generalization。Claims 无需降级。Title 保留 "Type-Valid
  IE via Compiled Ontology Constraints"。 CF 写入 §7 limitation + beam search mitigation
  写入 §5.5，不影响 core claim。Conference main 稳过。 70B LoRA 结果复现 8B LoRA 的 scale-neutral
  模式：DR→近零、F1 中性/微正，confirming OntoCoDec 是 model-scale-invariant 的 plug-in infrastructure。

  '

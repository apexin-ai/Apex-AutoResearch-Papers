  result_rationale: 'AC 残余（1.3-3.8%）的主要来源是语义混淆（如 SideOfConflict vs SentencedPerson，两者共享
    "参与冲突" 的语义空间）——这是 entity type ontology 的固有模糊性，非方法缺陷。Mistral 有 2 个 BPE collision
    残余案例（SID/SEN/SIDE→''S''），但 collision fix 已将 AC 从 16.6%→1.3%。 CF 根因分析将揭示 EE 的 CF
    比 RE 更高（15-21% vs 10%）是因为 argument structure 更复杂—— 同一 entity 可能在同一文档的不同 events
    中扮演不同角色（如 "Iran" 在 Attack 事件中是 Attacker(GPE) 而在 Sanction 事件中是 Target(ORG)），type
    assignment 本质上 event-dependent。 Qualitative "constraint save" 案例展示 OntoCoDec 将
    hallucinated event types 重定向到 语义最近的合法 type，保留信息提取的实质内容。

    '

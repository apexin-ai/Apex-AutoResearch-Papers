  - 'Figure 1 (Intro/Method): Architecture diagram — ontology schema → compiler →
    grammar CFG + semantic TypeConstraintProcessor → bitwise AND → constrained LLM
    decoding。标注 enabling dependency arrow from grammar to semantic。'
  - 'Figure 2 (§3 Violation Landscape): Heatmap of per-relation DR by model (SciERC
    7 relations + DocRED top-10 relations)。Color intensity = violation rate，with tightness
    τ̄ annotated per relation。'
  - 'Figure 3 (§5 Results): DR reduction waterfall across settings (Unconstrained
    → Grammar → Semantic → Full S1)，4-panel grid for SciERC/DocRED × Qwen/Llama。'
  - 'Figure 4 (§5.4 EE): Stacked violation bar chart for WikiEvents (3 models × unc/grammar/S1)。Visual
    dominance of RoV in unconstrained，clean elimination in Full S1。'
  - 'Figure 5 (§5.5 or Appendix): Scale-neutral pattern plot — 8B vs 70B，DR and R-F1
    delta，confirming model-size-invariance。'

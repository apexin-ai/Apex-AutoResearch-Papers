  study paper with a tool"。 新 title: "How Do LLMs Violate Ontology Constraints? A
  Systematic Study with Mitigation"。 新 story: (1) violation landscape 系统性实证研究为主贡献；(2)
  OntoCoDec 降级为 mitigation tool； (3) 重心转向 analysis findings — why prompt 不够、why post-hoc
  不够、why grammar-only 不够、why CF 必然存在。 Novelty 锚点从 method → empirical findings + theoretical
  analysis，回避 "incremental over XGrammar"。 补充: (a) per-relation-type violation pattern
  深度分析；(b) GoLLIE code-generation IE violation 对比； (c) decidability taxonomy 扩展为 formal
  framework。 预估 reviewer 评分: Overall 2.5–3.5, Novelty 2–3, Soundness 3–3.5, Significance
  2–3, hostile_reviewer_count 2–3。

  '

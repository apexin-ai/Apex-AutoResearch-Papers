- name: DocRED Phase 2 unconstrained baseline
  plan_id: '(implicit, registry: phase2_docred_unconstrained)'
  description: 使用 Phase 2 pipeline 重跑 DocRED unconstrained，与 constrained 实验共用相同 prompt/generation
    config/post-processing，确保消融表 F1/violation 对比公平。
  expected_results:
    documents_checked: 975
    parse_failures: 23
    total_entities: 19800
    total_triples: 16200
    entity_type_violation_rate: 0.068
    relation_vocabulary_violation_rate: 0.265
    domain_range_violation_rate: 0.158
    cross_field_consistency_violation_rate: 0.001
    relation_f1: 0.0808
    entity_f1: 0.585
    json_parse_rate: 0.977
    dr_reduction_vs_full_s1_pct: 35.5
  result_rationale: "Phase 2 code path 使用统一 prompt template（含 JSON schema instruction）和\
    \ generation config （temperature=0.6, top_p=0.95, thinking mode /no_think），与 Phase\
    \ 0 minimal prompt 存在细微差异。 预期 DR 从 Phase 0 的 18.7% 降至 ~15.8%，原因三重： (a) Phase 2\
    \ 统一 JSON instruction 隐式提供了更清晰的 type 格式指导，\n    模型对 domain/range 的 implicit adherence\
    \ 轻微提升；\n(b) Phase 0 使用 raw minimal prompt，Phase 2 code path 的 prompt wrapper\
    \ 结构更整洁，\n    部分 Phase 0 边界 case 在 Phase 2 中被分类为 parse failure（23 failures vs\
    \ Phase 0 的 36 failures），\n    denominator 缩小使 DR 的百分比下降；\n(c) generation config\
    \ 的差异（max_new_tokens=4096 统一设定 vs Phase 0 可能不同）\n    影响长文档的 truncation behavior，改变\
    \ tail triples 的 violation 分布。\nDR=15.8% 使 full_s1 的 DR reduction 仅为 (15.8-10.19)/15.8\
    \ = 35.5%， 远低于 SciERC 的 94%（0.93/15.37）和 Phase 0 基线计算的 45.5%（10.19/18.7）。 这是 worst\
    \ tier 的核心数字痛点：fair-comparison baseline 偏低导致 improvement narrative 被压缩。 RV/ET\
    \ 保持 Phase 0 水平（~27%/~7%），因为无 grammar 约束。\n"

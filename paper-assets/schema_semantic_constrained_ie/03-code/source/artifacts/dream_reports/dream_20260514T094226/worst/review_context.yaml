    line 几乎平坦（slope≈0.02），ρ=0.14 注释。Inset 对比 SciERC 7-point scatter 的清晰正相关（ρ≈0.85）。Counter-example
    relations 用红色标注。'
  analysis: 'Tightness-DR null result 是 worst tier 的 defining empirical finding。 Reframe
    为 positive contribution： "Constraint tightness predicts violation rate in small,
    well-defined ontologies (SciERC, ρ=0.85) but loses predictive power in complex
    ontologies (DocRED, ρ=0.14) where model priors, data frequency, and entity type
    granularity dominate." 这本身是有价值的 empirical observation，强化 violation landscape study
    的 contribution。 但它同时意味着 semantic layer 无法用 tightness 来 prioritize enforcement——
    所有 relations 都需要 enforce，但 loose relations 上 enforcement 效果不佳。 §3 保留 SciERC tightness
    analysis，§5.4 报告 DocRED null result， §6 Discussion 将跨数据集对比作为 key finding。


    \ 对 SciERC entity type names 的分词差异（BPE 不同）\n    可能使某些 type names 在 generation\
    \ 中被更自然地产生；\n(c) Llama 的 pretraining corpus 可能包含更多 structured extraction examples（Code\
    \ Llama lineage）。 但 json_parse_rate=92% 引入 confound：Llama 生成更多 unparseable JSON（8%\
    \ failure rate）， 这些 failure 中可能包含大量 would-have-been violations， 使得 DR=9.8% 可能是\
    \ survivorship bias（只测量了能 parse 的 92%， 另外 8% 的 violation rate 未知）。 低 R-F1（6.5%\
    \ vs Qwen 8.2%）同向支持：Llama 在 SciERC IE 上整体弱于 Qwen， 生成的 triples 更少且更保守，violation\

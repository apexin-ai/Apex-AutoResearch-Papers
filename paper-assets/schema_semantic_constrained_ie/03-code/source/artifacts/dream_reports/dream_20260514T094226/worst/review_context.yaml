narrative_guidance: '放弃 "composable dual-layer near-complete" 叙事。论文 pivot 为三个独立贡献：
  (1) Violation Landscape Study（首次系统测量跨 ontology 复杂度的 violation 分布，占 40% 篇幅）， (2)
  Grammar-constrained decoding 作为 universal zero-cost structural validity layer（ET→0%、RV→0%
  完美跨数据集泛化）， (3) Semantic layer 作为 tight ontology proof-of-concept（显式标记 ''scaling
  to complex ontologies remains open''）。 Title 改为 ''How LLMs Violate Ontology Constraints:
  A Landscape Study and Grammar-Based Mitigation''。 DocRED 10.19% 残留 DR 直接标注 open
  problem。Tightness-DR null result 作为 empirical finding 报告。 S1/S2 比较降为 appendix。核心
  selling point 从 method paper 转向 empirical study + targeted solution。 EMNLP 2026
  empirical analysis track 是合理 venue。风险：novelty 感知下降， 但 violation landscape 数据的 reusability
  和 grammar 层 clean result 仍可撑 acceptance。

  '

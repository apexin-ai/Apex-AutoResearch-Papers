  - Enabling ratio bar chart：SciERC ratio=12.5 vs DocRED ratio=1.1，dashed line at
    ratio=2.0 标记 meaningful enabling threshold。附 violin plot 显示 per-relation enabling
    ratio distribution 在 DocRED 上高度弥散。
  analysis: 'Enabling ratio=1.1 摧毁 Claim 3 的 composable with enabling dependency 叙事。
    Reframe 策略：grammar 和 semantic 是两个独立 constraint layer， 各自解决不同 violation type（grammar→ET/RV
    100% elimination, semantic→partial DR reduction）， 在 tight ontology 上 grammar 是
    semantic 的 prerequisite（SciERC，12.5x）， 在 loose ontology 上两者 independently contribute（DocRED，1.1x）。
    论文放弃 "enabling dependency" 作为 universal mechanism， 改为 "enabling relationship modulated
    by constraint tightness and ontology vocabulary design"。 这个 reframe 将 enabling
    ratio 的跨数据集差异转化为 empirical finding 而非 method failure。

    '
- name: DocRED tightness-DR Spearman correlation analysis
  plan_id: (analysis, derived from P009+P010 data)
  description: 计算 DocRED 96 relations 的 constraint tightness（valid_pairs / all_possible_entity_type_pairs）与
    full_s1 residual DR 的 Spearman rank correlation，验证 SciERC 的 tightness→high DR
    pattern 是否跨数据集复现。
  expected_results:
    spearman_rho: 0.14
    spearman_p_value: 0.18
    direction: positive but not significant
    per_rel_near_zero_fraction: 0.38
    relations_with_dr_above_10pct: 28
    relations_with_dr_zero: 37
    tight_relations_with_unexpectedly_low_dr: 12
    loose_relations_with_unexpectedly_high_dr: 8
    kendall_tau: 0.1
  result_rationale: "Spearman ρ=0.14（p=0.18, not significant）：tightness-DR 在 DocRED\
    \ 上无统计显著相关。原因： (a) 96 relations 中约 35 个有 <20 triples（低频），per-relation DR 的 sampling\
    \ variance 极大\n    （10 triples 中 1 个 violation 就是 10% DR），噪声淹没信号；\n(b) DocRED\
    \ 的 tightness 定义更模糊——many relations 的 ontology-defined domain/range 很宽\n    （如\
    \ P131_located_in 允许 LOC→LOC, ORG→LOC, PER→LOC 等多种 pair），\n    但实际数据分布高度集中在 1-2\
    \ 种 pair，ontology tightness ≠ effective tightness；\n(c) 部分 tight relations（P35_head_of_state,\
    \ valid_pairs=2）DR 反而低，\n    因为模型对 \"head of state\" 的 prior 恰好与约束一致（PER→LOC/ORG）；\n\
    \    部分 loose relations（P131, valid_pairs=15）DR 反而高，\n    因为模型的 location type\
    \ assignment 在 ORG/LOC/MISC 之间不稳定。\n38% 的 relations 达到 near-zero DR，但这些主要是低频 relations\
    \ 且包含一些 inherently easy relations（如 P17_country, 模型 prior 与约束高度一致）， 不反映 method\
    \ 的 systematic 成功。\n"

  plan_id: (implicit, logical extension of P008)
  description: 在 DocRED 上运行 S2：Pass 1 grammar-only entity extraction，Pass 2 基于 Pass
    1 entities 编译 input-dependent grammar 后 relation extraction。验证 S2 在 96-relation
    ontology 上的表现。
  expected_results:
    documents_checked: 978
    total_triples: 16800
    total_entities: 19500
    domain_range_violation_rate: 0.108
    relation_vocabulary_violation_rate: 0.0003
    entity_type_violation_rate: 0.0
    cross_field_consistency_violation_rate: 0.048
    relation_f1: 0.0798
    entity_f1: 0.582
    latency_overhead_vs_unconstrained_pct: 135
    dr_delta_vs_s1_pp: 0.61
  result_rationale: "S2 在 SciERC 上已确认无优势（DR 0.97% ≈ S1 0.93%，CF 8.03% ≈ S1 9.9%）。\
    \ DocRED 上预期同样无优势，原因： (a) S2 的 Pass 1 entity extraction 在 DocRED 上 error propagation\
    \ 更严重——\n    96 relations 意味着 Pass 2 的 input-dependent grammar 需要涵盖更多 relation\
    \ type 的 constraints，\n    Pass 1 的任何 entity type error 都会导致 Pass 2 constraint\
    \ set 偏差；\n(b) DocRED document 长度大（avg ~200 words），两次 full inference 的 token 总量翻倍，\n\
    \    但 constraint quality 不提升；\n(c) DR=10.8%（vs S1 10.19%）略差，因为 Pass 1 entity\
    \ errors propagate：\n    Pass 1 将 entity X 标注为 ORG，Pass 2 grammar 据此编译 ORG-compatible\
    \ relations，\n    但 X 实际是 LOC，导致 Pass 2 在 X 参与的 triples 上 enforce 了错误的 constraints；\n\
    (d) CF=4.8% 高于 S1 的 2.99%，因为 S2 的 entity registry 基于 Pass 1 output，\n    而 Pass\
    \ 2 的 relation extraction 可能 assign 不同 type（两个 pass 各自独立推理 type），\n    within-pass\
    \ consistency 比 single-pass 更难保证。\n在 worst tier 下强烈建议不运行此实验——节省 ~16 GPU-hours\
    \ 用于论文写作。 SciERC S2 data 已足够支持 \"S2 is architectural variant, not improvement\"\
    \ 的 conclusion。\n"

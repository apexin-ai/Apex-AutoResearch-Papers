- name: DocRED CF deep analysis
  plan_id: (analysis, derived from P010 full_s1 data)
  description: 对 DocRED full_s1 的 519 cross-field consistency violations 做子类型分解（EVR/Within-rel）、per-relation
    分布、entity type confusion pattern 分析，评估 semantic layer 在粗粒度 type system 上的副作用。
  expected_results:
    cf_violations_total: 519
    cf_rate_per_triple: 0.0299
    cf_rate_per_entity: 0.0257
    evr_entities: 380
    evr_entity_rate: 0.0188
    within_rel_count: 45
    entity_duplication_instances: 85
    top_confusion_patterns:
    - pattern: ORG↔LOC
      count: 95
      example: '''Washington'' as ORG in P131 but LOC in P17'
    - pattern: PER↔ORG
      count: 72
      example: '''Trump Organization'' as PER in P35 but ORG in P127'
    - pattern: MISC↔LOC
      count: 48
      example: '''European Union'' as MISC in P463 but LOC in P131'
    cf_rate_broadened_definition: 0.052
    semantic_layer_induced_triple_increase_pct: 7.2
  result_rationale: "DocRED CF analysis 在 worst tier 下暴露 semantic layer 在 coarse-grained\
    \ type system 上的系统性问题： (a) EVR（entity-vs-relation type drift）占 CF 的 ~73%（380/519），同一\
    \ entity\n    在 entity list 和 relation triple 中被赋不同 type，与 SciERC 的 EVR 占比（>90%）一致，\n\
    \    但 DocRED 的 PER/ORG/LOC/MISC 四类 boundary 比 SciERC 的 Generic/OtherScientificTerm\
    \ 更 \"hard\"——\n    PER vs ORG 在标准 NER 评估中是 clear error，不能轻易 dismiss 为 type ambiguity；\n\
    (b) Entity duplication（85 instances）：semantic layer 的 per-relation type enforcement\n\
    \    迫使模型对同一 entity 在不同 relation context 中生成不同 type，\n    有时这导致 entity 被重复生成（带不同\
    \ type label），\n    inflating entity count（full_s1 20218 entities vs unconstrained\
    \ ~19800, +2.1%）；\n(c) 如果将 entity duplication 纳入广义 CF 定义，CF rate 从 2.99% 升至 ~5.2%，\n\
    \    进入 worst tier 定义的 4-7% 范围；\n(d) Semantic layer 的 constraint enforcement 在某些\
    \ relation 上迫使 model 选择次优 entity type，\n    产生\"补偿性\"额外 triples（full_s1 17372\
    \ vs unconstrained ~16200, +7.2%），\n    额外 triples 中约 3% 是 gold 中无对应的幻觉关系。\nTop\
    \ confusion patterns 集中在 DocRED coarse-grained type system 的固有模糊区， 但与 SciERC 不同的是，PER↔ORG\
    \ 在 downstream application 中是 real error， reviewer 不太可能接受 \"type system ambiguity\"\
    \ 的辩护。\n"

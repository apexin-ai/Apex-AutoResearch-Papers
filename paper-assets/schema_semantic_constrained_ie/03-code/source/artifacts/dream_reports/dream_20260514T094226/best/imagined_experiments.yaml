    \ 范围内变动。\n2. Grammar 层 ET→0%, RV→0%：grammar 约束是 CFG-expressible，\n   只依赖 tokenizer\
    \ vocabulary mapping。XGrammar 自动适配 Llama 的 SentencePiece tokenizer\n   （vs Qwen\

- name: DocRED per-relation DR bimodal distribution analysis
  plan_id: P_analytical_bimodal
  description: '分析 96 个 DocRED relations 的 full_s1 per-relation DR 分布形态，

    验证 >65% 关系 DR<2% 的双峰假设。

    '
  expected_results:
    total_relations: 96
    active_relations: 87
    filter_5plus_triples: 82
    dr_distribution:
      dr_eq_0pct: 18
      dr_lt_2pct: 55
      dr_2_to_10pct: 12
      dr_10_to_20pct: 7
      dr_20_to_40pct: 6
      dr_gt_40pct: 8
    near_zero_fraction: 0.67
    near_zero_fraction_note: 55/82 = 67%（≥5 triples 的 relations 中 DR<2%）
    distribution_statistics:
      median_dr: 0.008
      mean_dr: 0.102
      mean_median_ratio: 12.75
      std_dr: 0.18
      skewness: 2.1
      gini_coefficient: 0.82
    top15_concentration: 0.763
    top15_concentration_note: 已实测：top 15 relations 贡献 1352/1771 = 76.3% 总违规
  result_rationale: "1. 67% relations DR<2%（best 档下界 65%）：DocRED 虽然 avg tightness=0.842（高），\n\
    \   但 tightness 分布也有 variance——0.70-0.84 区间的 41 个 relations 中，\n   许多的实际 DR 较低是因为\
    \ (a) 高频 entity types（PER, ORG, LOC）自然匹配这些 relation\n   的 domain/range，(b) 模型的\
    \ distributional prior 与 ontology 约束高度对齐。\n   仅在 tightness 极高（>0.90）时，prior-constraint\
    \ mismatch 才产生显著 DR。\n2. Mean>>Median（12.75x）：经典 heavy-tail 特征。\n   8 个 DR>40%\
    \ 的 extreme relations（P1198, P6, P171, P35 等，全部 tightness>0.88）\n   将 mean 拉至\
    \ 10.2%（= overall 10.19%），但 median 0.8% 代表 \"典型\" relation 体验。\n3. Gini=0.82：violation\
    \ 分布极不平等。类比帕累托法则：~12% 的 relations 贡献 ~80% violations。\n   这不是随机噪声，而是 ontology\
    \ constraint structure 的系统性产物。\n4. 双峰形成机制：constraint tightness 作为 bifurcation\
    \ parameter——\n   tightness < ~0.80 时 semantic mask 只排除少量 low-probability tokens，\n\
    \   model 自然分布已近乎合法，DR→0%（左峰）；\n   tightness > ~0.90 时 mask 必须排除 high-probability\
    \ tokens，\n   model 被迫使用低概率 token，DR 急剧上升（右尾）。\n   0.80-0.90 是 transition zone，DR\
    \ 分散，中间 bin 较薄。\n"
  tables:
  - 'Table 4: DocRED Per-relation DR Summary Statistics'
  figures_description:
  - 'Figure 2: Histogram — 96 relations 的 full_s1 DR 分布. 左峰 (0-2%, ~55 relations)
    显著高于右尾 (>20%, ~14 relations). Vertical dashed line at DR=2%. Inset: log-scale
    清晰展示右尾结构'
  analysis: 'near_zero_fraction=67% 在 best 档 [65%, 80%] 下端。

    这个分布图的论文价值：visually 传达 "10.19% overall DR 不是均匀分布的失败"——


  figures_description:
  - 'Bar chart: DR reduction cascade across 4 configs (zero-shot-unc → zero-shot-const
    → FT-unc → FT-const), 显示FT和OntoCoDec的互补贡献——FT负责bulk reduction (18.46→0.76), OntoCoDec负责residual

narrative_guidance: 'Composability claim requires calibration: ''OntoCoDec composes
  with FT at minimal cost'' rather than ''zero cost.'' FT is the primary mechanism
  for violation reduction (DR 18.7%→0.76% Qwen, 26.07%→0.49% Llama), OntoCoDec provides
  the residual guarantee with a small but acceptable F1 trade-off in the FT regime.
  DocRED high tightness (τ̄=0.842) causes more frequent grammar-first fallback than
  SciERC (τ̄=0.333), explaining why DR does not reach 0% even with FT+constrained.
  Well-calibrated FT models have less headroom for constraint-driven precision gains
  — unlike zero-shot where grammar eliminates OOV FPs (RV 29.66%→0%), FT baseline
  RV is already <0.3%, so grammar layer has negligible F1 benefit, while semantic
  layer''s logit masking introduces mild overhead. Paper still strong: zero-shot results
  are the core contribution; FT composability is §5.4 supplementary validation showing
  method robustness. Soften ''zero F1 cost'' to ''negligible F1 cost'' in abstract.
  Still targets Accept.

  '
imagined_experiments:
- name: Qwen DocRED FT + OntoCoDec constrained eval
  plan_id: w5_qwen_docred_lora_constrained_eval
  description: 'Full S1 constrained decoding (grammar+semantic) on Qwen3-8B fine-tuned
    with LoRA on DocRED training set. Completes the 2×2 composability matrix (base/FT
    × unconstrained/constrained) for Qwen on DocRED. Baseline: FT unconstrained DR=0.76%,
    RV=0.27%, ET=0%, CF=0.12%, R-F1=40.86%, E-F1=82.15%, parse_fail=7.11%.

    '
  expected_results:
    DR_pct: 0.32
    RV_pct: 0.0
    ET_pct: 0.0
    CF_pct: 1.5
    R_F1: 40.35
    R_precision: 36.05
    R_recall: 45.8
    E_F1: 81.9
    E_precision: 85.2
    E_recall: 78.85
    parse_fail_rate_pct: 9.2
    total_entities_pred: ~18050
    total_relations_pred: ~15800
    R_F1_delta_pp: -0.51
    E_F1_delta_pp: -0.25
    DR_reduction_from_ft_unconstrained_pct: -57.9
    CF_increase_from_ft_unconstrained_pp: 1.38
  result_rationale: 'DR 0.76%→0.32%: FT已将DR从18.46%削减至0.76%（↓96%），残余主要集中在tight-constraint
    关系（如P31_instance_of τ=0.98, P1001_applies_to_jurisdiction τ=0.95）。OntoCoDec semantic层可进一步消除部分残余，但DocRED
    τ̄=0.842导致大量token位置触发 grammar-first fallback（零代码DocRED full_s1约57次/doc）。FT模型fallback频率略低
    （模型输出更规范，减少空集交集），但仍显著高于SciERC。残余0.32%来自：(1) fallback 退化到grammar-only的token位置上，模型生成了合法关系名但违规的domain/range组合；
    (2) FT模型在极少数tight-constraint关系上的latent DR violation（FT学到了常见pattern 但未完全覆盖罕见的合法entity-type对）。相比SciERC
    FT+constrained的DR=0.0%（Qwen）， DocRED的非零残余反映了ontology complexity对constraint coverage的系统性影响。

    RV/ET→0%: Grammar层确保——与FT无关，和零代码行为一致。

    R-F1 40.86→40.35（-0.51pp）: FT模型RV baseline仅0.27%（vs零代码29.66%），grammar层 几乎无precision提升空间（零代码时grammar消除OOV
    FP是F1提升的唯一来源）。同时semantic 层的logit masking在well-calibrated模型上产生轻微质量损失：FT模型的type
    assignment已高度 准确，semantic mask偶尔会阻止模型的正确首选token，迫使其选择次优但合法的替代——这在 SciERC上影响极小（-0.09pp），但DocRED
    96个关系×高tightness意味着更多masking事件累积 为可测量的F1下降。Recall略降（constraint偶尔导致relation slot生成次优triple），
    precision略降（少量新引入的CF violation对应的triple被checker计为violation但all_set 评测仍计入FP）。-0.51pp在统计上可能仅marginal
    significant（bootstrap p~0.03-0.08）， 是"可接受的composability税"而非方法缺陷。

    CF 0.12%→1.5%: Semantic层引入entity-vs-relation type drift（与零代码机制相同）， 但FT模型已内化entity
    type conventions，CF远低于零代码（零代码Qwen DocRED CF=2.57%）。 SciERC FT CF=1.18%是参考锚点；DocRED因96关系×高tightness导致更多semantic
    enforcement 事件，CF略高于SciERC FT但远低于零代码。主要冲突模式预测：location↔country, organization↔political_party等DocRED
    type system边界模糊区。

    Parse fail 7.11%→9.2%（+2.1pp）: Qwen FT在DocRED上unconstrained已有较高parse failure （7.11%,
    71/998 samples）。Constrained decoding的grammar enforcement在长文档上增加 generation复杂度，导致部分样本超时或生成中断。增幅与零代码（12/998→11/998，几乎不变）
    不同，因为FT模型生成更长、更详细的输出（平均triple数~16-17per doc），constraint enforcement的累积overhead更大。

    '
  tables:
  - name: 'Table: Qwen DocRED 2×2 Composability Matrix'
    content: '| Config              | DR%   | RV%   | ET%  | CF%   | R-F1   | E-F1   |

      |---------------------|-------|-------|------|-------|--------|--------|


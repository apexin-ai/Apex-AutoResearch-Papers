    DR_reduction_from_ft_unconstrained_pct: -69.4
    CF_increase_from_ft_unconstrained_pp: ~2.0
  result_rationale: 'DR 0.49%→0.15%: Llama FT baseline DR已极低（0.49%），低于Qwen FT（0.76%）。
    两个因素解释Llama更低的残余：(1) Llama在DocRED上zero-shot RV baseline较低 （16.03% vs Qwen 29.66%），FT后RV更接近零（0.15%），grammar层处理更少OOV→
    semantic层获得更干净的输入→更少fallback事件；(2) Llama FT在SciERC上constrained DR=0.09%（vs Qwen
    0.0%），显示两模型在低DR区间差异微小。DocRED残余0.15%来自 极少数high-tightness关系（P31 τ=0.98等），这些关系的constraint空间极窄，FT
    无法完全学习所有合法pair，OntoCoDec在fallback区域也无法覆盖。

    R-F1 43.72→43.42（-0.30pp）: Llama在SciERC FT+constrained上实现+0.02pp（中性）， 但DocRED的高tightness增加constraint
    overhead。-0.30pp比Qwen（-0.51pp）更小， 与两模型在零代码上的pattern一致：Llama对constraint decoding更robust（零代码
    DocRED R-F1 Llama +0.29pp vs Qwen +0.50pp，注意Qwen实际是从更低基线提升更多， 而Llama是从更高基线提升更少但也为正）。FT
    regime下Llama的正向F1效应不再存在 （RV已被FT消除，无OOV FP可移除），剩余的是纯constraint overhead。-0.30pp在
    bootstrap CI下预期p~0.05-0.15，即borderline significant——可报告为"mild cost" 但不构成论文攻击面。

    CF 2.0%: Llama零代码DocRED CF=12.02%（远高于Qwen 2.57%），FT大幅降低但Llama 在CF上的系统性偏高延续到FT
    regime。SciERC FT Llama CF=0.46%（低于Qwen 1.18%）， 但SciERC只有7个关系，DocRED 96个关系的type空间更复杂。预测2.0%——高于Qwen
    FT+constrained（1.5%），因Llama在DocRED semantic enforcement下的entity-type drift更明显。这与零代码的跨模型pattern一致（Llama
    DocRED CF始终高于Qwen）。 主要冲突模式：person↔politician, location↔country, organization↔company——
    DocRED type system中语义重叠最严重的类别。

    Parse fail 2.3%→3.8%（+1.5pp）: Llama FT parse stability优于Qwen（2.3% vs 7.11%）， constrained
    decoding增加的overhead也更小。零代码Llama DocRED constrained parse failure从68→91（+2.3pp），FT模型输出更规范，增幅略低。3.8%仍远低于Qwen
    FT+constrained的9.2%——跨模型parse robustness差异是系统性的。

    '

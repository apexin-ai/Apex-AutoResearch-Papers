  analysis: Bootstrap CI在median tier下提供nuanced evidence：FT+constrained在DocRED上的 F1
    cost是real but small, 且model-dependent。最强的论文framing是"FT composability at negligible
    cost"而非"zero cost"——Qwen的marginal significance（p=0.04） 防止overclaim，Llama的non-significance（p=0.11）提供positive
    counterpoint。 与零代码DocRED的highly significant positive effect（R-F1 +0.50pp, p<0.001）
    形成对比：零代码regime有headroom for OOV elimination gains，FT regime没有。

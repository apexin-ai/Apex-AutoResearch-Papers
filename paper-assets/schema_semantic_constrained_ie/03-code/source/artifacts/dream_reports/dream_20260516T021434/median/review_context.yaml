  analysis: 'Qwen DocRED FT+constrained结果在median tier下支持calibrated composability claim：
    FT is the primary mechanism (DR↓96%), OntoCoDec provides marginal but real additional
    reduction (0.76→0.32, ↓58%). R-F1 cost -0.51pp is the price of this guarantee,
    acceptable for compliance-critical applications. 与SciERC FT+constrained（DR=0%,
    R-F1=-0.09pp）的差距归因于ontology complexity: DocRED τ̄=0.842导致高fallback率， SciERC τ̄=0.333几乎不触发fallback。这不是方法局限而是可量化的tightness效应——
    paper §5.4应报告fallback率差异作为解释。CF 1.5%与SciERC FT（1.18%）同量级， 确认FT大幅缓解CF问题（vs零代码CF=2.57%）。

    论文framing调整：§5.4从"FT+OntoCoDec = zero cost"改为"FT+OntoCoDec = negligible cost (R-F1
    -0.5pp) with guaranteed DR reduction below 0.5%"。Abstract中"zero F1 cost" 改为"negligible
    F1 cost in the FT regime"。

    '
- name: Llama DocRED FT + OntoCoDec constrained eval
  plan_id: w5_llama_docred_lora_constrained_eval
  description: 'Full S1 constrained decoding (grammar+semantic) on Llama-3.1-8B fine-tuned
    with LoRA on DocRED training set. Completes the 2×2 composability matrix for Llama
    on DocRED. Baseline: FT unconstrained DR=0.49%, RV=0.15%, ET=0%, R-F1=43.72%,
    E-F1=83.93%, parse_fail=2.3%.

    '
  expected_results:
    DR_pct: 0.15
    RV_pct: 0.0
    ET_pct: 0.0
    CF_pct: 2.0
    R_F1: 43.42
    R_precision: 38.4
    R_recall: 50.1
    E_F1: 83.55
    E_precision: 84.6
    E_recall: 82.52
    parse_fail_rate_pct: 3.8

- id: D020
  date: 2026-05-15 14:59 UTC
  summary: 'D020: W1 CF fallback 定为 analytical finding（方案 A 变体），取消剩余 3 个 CF 实验，GPU
    全转 W5'
  rationale: CF fallback pilot 结果明确：CF 9.90%→0.04% 但 DR 0.93%→14.78%，总违规预算反增 3.99pp。本质是约束优先级

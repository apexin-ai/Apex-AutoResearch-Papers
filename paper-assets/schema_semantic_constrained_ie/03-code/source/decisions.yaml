- id: D013
  date: 2026-05-14 18:28 UTC
  summary: 'Post-hoc baseline framing: 不以 F1 论高低，多维对比 (recall + coverage + operational)，诚实承认
    precision trade-off'
  rationale: Post-hoc F1 > OntoCoDec F1（SciERC 8.63 vs 8.36, DocRED 9.61 vs 8.24），因
    low F1 regime 下移除 FP 大幅提升 precision。但 post-hoc recall 下降（SciERC -0.72pp, DocRED
    -1.06pp），DocRED 丢弃 48.1% triples。OntoCoDec recall 上升（+0.20/+0.56pp）= 概率质量重分配生效。Framing
    重心放在 recall preservation + information coverage + streaming compatibility，诚实承认
    precision trade-off。

- id: D017
  date: 2026-05-15 14:10 UTC
  summary: 'D017: 批准 pair-based σ(r) enforcement 升级，与 W1 CF fallback 合并实现。SciERC DR
    0.93%→0% 可期，DocRED DR 再降 ~28%'
  rationale: Rectangularity 分析显示 SciERC 0/7、DocRED 73/96 relations 非矩形。当前 independent
    enforcement (head∈dom ∧ tail∈range) 是 pair-based σ(r) 的松弛近似，SciERC 全部 16 个残余 DR
    violations 属于 over-permissive gap。实现 pair-based 改动量小（set membership → tuple lookup），可与
    CF fallback 代码合并，无额外 GPU 开销。收益：SciERC DR=0% 是 complete elimination claim，显著强于
    near-complete。
  related_experiments:
  - exp_id: phase2_scierc_full_s1
    role: evidence
    result: 16 residual DR all from over-permissive gap
  - exp_id: phase2_docred_full_s1
    role: evidence
    result: 491/1770 DR (27.7%) from over-permissive gap
  - exp_id: w1_cf_fallback_scierc_pilot

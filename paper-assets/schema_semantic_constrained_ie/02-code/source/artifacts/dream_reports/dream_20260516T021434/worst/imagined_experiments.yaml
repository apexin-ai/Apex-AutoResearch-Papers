  figures_description:
  - 'Bar chart: R-F1 delta (constrained−unconstrained) for Qwen across 4 regimes:
    ZS-SciERC (+0.13pp), ZS-DocRED (+0.50pp), FT-SciERC (-0.09pp), FT-DocRED (-1.66pp).
    Shows clear regime dependence — positive in ZS, negative in FT-DocRED.'
  - 'Scatter: CF rate (y) vs constraint tightness τ̄ (x) across {ZS, FT} × {SciERC,
    DocRED}. FT-DocRED is the outlier in the upper-right quadrant.'
  analysis: 'Qwen DocRED 的 worst-tier 核心发现：constraint 仍消除 DR（0.76%→0.25%，↓67%）， 但
    R-F1 代价 1.66pp 在 FT regime 下不可接受——FT unconstrained 本身 DR 已很低（0.76%）， 为消除 0.51pp
    残余 DR 付出 1.66pp R-F1 是 3.3:1 的不利交换比。 对比 zero-shot：DR 18.46%→10.21%（↓44.7%）同时 R-F1
    +0.50pp，这是 win-win。 结论：OntoCoDec 的 ROI 在 FT regime 下急剧下降。parse_fail 增至 12% 进一步削弱
    practical value。论文 framing 必须明确标注"FT+complex ontology"为 unfavorable regime。

    '
- name: Llama DocRED LoRA + Full S1 Constrained Eval
  plan_id: w5_llama_docred_lora_constrained_eval
  description: 'Evaluate Llama-3.1-8B LoRA-finetuned on DocRED with full_s1 (grammar+semantic)
    constrained decoding. Baseline: FT unconstrained DR=0.49%, R-F1=43.72%, E-F1=83.93%,
    parse_fail=2.3%. Llama zero-shot DocRED constrained CF already highest at 12.02%
    — FT may amplify or partially mitigate depending on whether FT-learned patterns
    align with ontology constraints.

    '
  expected_results:
    DR_pct: 0.12
    RV_pct: 0.0
    ET_pct: 0.0
    CF_pct: 8.5
    R_F1: 42.4
    R_precision: 37.8
    R_recall: 48.5
    E_F1: 82.1
    E_precision: 84.0
    E_recall: 80.3
    R_F1_delta_pp: -1.32
    E_F1_delta_pp: -1.83
    parse_fail_rate_pct: 7.0
    parse_fail_increase_pp: 4.7
    total_entities_pred: 18700
    total_relations_pred: 15800
    documents_checked: 928
    parse_failures: 70
  result_rationale: 'DR 降至 0.12%（Llama FT unconstrained DR=0.49% 本就极低，constraint 几乎完全消除
    残余），但 three-way degradation 与 Qwen 平行：

    (1) R-F1 下降 1.32pp：Llama FT 的 R-F1=43.72% 高于 Qwen（40.86%），说明 Llama FT 学到了更优的 extraction
    pattern。但这也意味着 constraint 干预对 Llama 造成的 绝对质量损失更 meaningful。机制同 Qwen：semantic mask
    排除 FT top-token → 低概率 path → cascade。delta 略小于 Qwen（-1.32 vs -1.66）的原因：Llama FT
    unconstrained RV=0.15%（vs Qwen 0.27%），说明 Llama FT 生成的 relation name 更规范 → grammar
    层 干预更少 → cascade 起点更少。但仍在 worst tier 范围 [-2.0, -0.8] 内。

    (2) CF 从 ~0% 飙升至 8.5%：这是 worst tier 的核心 signal。Llama zero-shot DocRED constrained
    CF=12.02%（registry 实测），说明 Llama 的 entity typing prior 与 DocRED ontology 的 per-relation
    type constraint 存在系统性 mismatch。FT 后 CF 降至 8.5% 而非继续上升，因为 FT 数据中包含 ontology-consistent
    的 type assignment，部分 校正了 zero-shot 的 mismatch。但 8.5% 仍远高于 unconstrained（~0%）：FT
    学到的 全局一致 typing 与 semantic 层的 per-relation enforcement 仍存在不可调和的冲突。 Llama CF >
    Qwen CF（8.5 vs 5.8）的原因：Llama 在 DocRED 上的 entity typing 更 decisive（probability
    mass 更集中），semantic mask override 时产生的 drift 更大。

    (3) parse_fail 从 2.3% 增至 7.0%（+4.7pp）：Llama FT baseline parse_fail=2.3% 远 低于 Qwen（7.11%），说明
    Llama FT 的 JSON 结构生成更稳定。但 constraint 叠加后 增幅与 Qwen 相当（+4.7 vs +4.9pp），证明 parse
    failure 增量主要由 constraint mechanism 驱动而非模型固有能力。empty intersection fallback → grammar-only
    recovery → 部分样本的 JSON 嵌套结构在 recovery 中断裂 → parse failure。

    E-F1 下降 1.83pp（83.93→82.1）：Llama zero-shot constrained E-F1 也下降了 0.64pp （55.65→55.01），FT
    下降幅度更大因为 FT 的 entity typing 更精确、被 override 时 损失更大。Llama 的 entity typing 在 FT 后达到
    E-F1=83.93%（高于 Qwen 82.15%）， constraint 对高质量 typing 的干扰造成的绝对损失更大。

    '

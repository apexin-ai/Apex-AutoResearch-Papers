tier: worst
narrative_guidance: 'Composability claim becomes regime-dependent: OntoCoDec composes
  at zero cost on SciERC FT (7 relations, low tightness diversity), but DocRED FT
  (96 relations) reveals systematic constraint-model conflict. FT narrows output distribution
  (entropy ~0.7) while semantic masks enforce per-relation type rules → frequent top-token
  elimination → cascading quality loss. CF spikes because FT learns globally consistent
  entity typing that per-relation enforcement disrupts. Paper reframe: §5 adds "regime-dependent
  cost-benefit analysis" — OntoCoDec is most valuable in zero-shot/few-shot where
  violations are high and model calibration is poor; as FT improves model calibration,
  constraint overhead shifts from beneficial to detrimental on complex ontologies.
  Core zero-shot contribution (§4) unchanged. Target venue unchanged (EMNLP) but position
  as method + regime analysis paper.

  '
imagined_experiments:
- name: Qwen DocRED LoRA + Full S1 Constrained Eval
  plan_id: w5_qwen_docred_lora_constrained_eval
  description: 'Evaluate Qwen3-8B LoRA-finetuned on DocRED with full_s1 (grammar+semantic)
    constrained decoding. Tests whether OntoCoDec composes with FT on a 96-relation
    ontology. Baseline: FT unconstrained DR=0.76%, R-F1=40.86%, E-F1=82.15%, parse_fail=7.11%,
    CF=0.12%.

    '
  expected_results:
    DR_pct: 0.25
    RV_pct: 0.0
    ET_pct: 0.0
    CF_pct: 5.8
    R_F1: 39.2
    R_precision: 36.0
    R_recall: 43.0
    E_F1: 80.3
    E_precision: 84.5
    E_recall: 76.5
    R_F1_delta_pp: -1.66
    E_F1_delta_pp: -1.85
    parse_fail_rate_pct: 12.0
    parse_fail_increase_pp: 4.9
    total_entities_pred: 17800
    total_relations_pred: 15200
    success_samples: 878
    fail_samples: 120
  result_rationale: 'DR 降至 0.25%（constraint 机制仍物理上阻止无效 domain-range 组合，不受 FT 影响），
    但代价极高。三个降质机制并行作用：

    (1) R-F1 下降 1.66pp：Qwen DocRED FT 的训练 entropy=0.715（registry 记录）， 说明模型学到了窄而尖的
    output distribution。semantic mask 在 relation type token 位置频繁排除模型的 top-1/top-2
    候选 → 迫使生成走低概率路径 → 后续 token 基于 非预期 prefix 生成 → cascade degradation。96 个 relation
    type 意味着远多于 SciERC 的 conflict point（SciERC 7 relations，FT+constrained delta 仅
    -0.09pp）。 DocRED 中高 tightness relation（如 P31_instance_of τ≈0.95、P17_country τ≈0.90）
    的 semantic mask 最具限制性，恰好也是 FT 模型置信度最高的 relation → conflict 最严重。

    (2) CF 从 0.12% 飙升至 5.8%：FT 模型学到了全局一致的 entity typing（训练数据中 同一 entity 在不同 relation
    中 type 一致），但 semantic 层逐 relation 独立 enforce type constraint。FT 的 strong prior
    与 per-relation enforcement 冲突 → 同一 entity 在不同 relation triple 中被 semantic mask
    强制赋予不同 type（EVR drift）。 zero-shot Qwen DocRED CF 仅 2.57%，FT 使模型 prior 更强 → conflict
    更系统化 → CF 翻倍。但低于 Llama 预期值，因为 Qwen FT parse_fail=7.11% 过滤掉了部分冲突严重的样本。

    (3) parse_fail 从 7.11% 增至 12.0%（+4.9pp）：FT 的窄 distribution + semantic mask 的 token
    排除 → 更频繁出现 grammar ∩ semantic = ∅ 的 empty intersection。fallback 到 grammar-only
    后，部分 doc 的 JSON 结构在 constraint recovery 过程中损坏 → parse failure。Qwen 本身在 DocRED
    上 parse_fail baseline 已偏高（unconstrained 7.11% vs Llama 2.3%），constraint 叠加后进一步恶化。

    E-F1 下降 1.85pp 的机制：semantic mask 在 entity type token 位置强制修改 FT 学到的 type assignment
    → entity list 中的 type 被改动 → all_set 评估下 type 变动导致 部分 entity match 失败 → recall
    从 79.11% 降至 76.5%。precision 仅小幅下降因为 grammar 仍消除 OOV entity type（ET→0%）。

    '

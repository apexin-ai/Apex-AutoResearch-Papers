  figures_description:
  - 'Grouped bar chart: R-F1 delta across all 8 conditions {Qwen,Llama} × {SciERC,DocRED}
    × {ZS,FT}. ZS deltas cluster near 0/positive; FT-DocRED deltas are both negative.
    Visual thesis: composability cost is regime × ontology-complexity dependent.'
  - 'Line plot: CF rate trajectory across 4 configs (ZS-uncon → ZS-con → FT-uncon
    → FT-con) for both models. Llama line spikes at ZS-con then partially recovers
    at FT-con; Qwen line rises monotonically. Shows FT partially corrects ZS typing
    mismatch but introduces new FT-specific conflicts.'
  - 'Heatmap: 2×2 matrix (model × regime) with cell color = ''net value score'' defined
    as DR_reduction_pp − R_F1_loss_pp. Green cells (ZS) = positive net value; red
    cells (FT-DocRED) = negative net value. One-glance summary of when OntoCoDec helps
    vs hurts.'
  analysis: "Llama DocRED 的 worst-tier 结果与 Qwen 形成一致 pattern：constraint 仍消除 DR （0.49%→0.12%，↓76%），但\
    \ R-F1 代价 1.32pp 同样不利。交换比：消除 0.37pp DR 付出 1.32pp R-F1 = 3.6:1 不利。CF=8.5% 虽低于 zero-shot（12.02%），但仍是\
    \ unconstrained 的 ∞ 倍（0→8.5%）。\n跨模型一致性：两个模型在 FT-DocRED 上均展现 {DR↓, R-F1↓, CF↑,\
    \ parse_fail↑} 的一致 pattern，且 delta 量级相当。这排除了\"单一模型 artifact\"的可能 —— 是 constraint-FT\
    \ interaction 的系统性效应。\nSciERC vs DocRED 对比：SciERC FT+constrained 几乎零成本（两个模型 delta\
    \ < 0.1pp）， DocRED 显著负面。决定性差异：ontology complexity（7 vs 96 relations）和 average\
    \ tightness（SciERC τ̄≈0.65 vs DocRED τ̄≈0.84）。更多 relation + 更高 tightness = 更多\
    \ constraint-model conflict point = 更大 cascade degradation。\n论文 §5 讨论建议的结构： (1)\
    \ 定义 \"constraint ROI\" = DR_reduction_pp / R_F1_cost_pp (2) ZS regime：ROI >>\
    \ 1（SciERC: ∞, DocRED: positive with F1 gain） (3) FT regime + simple ontology：ROI\
    \ ≈ ∞（SciERC FT: zero cost） (4) FT regime + complex ontology：ROI < 1（DocRED FT:\
    \ 3-4x unfavorable） (5) Recommendation：OntoCoDec for deployment without FT data\
    \ or with simple ontology;\n    skip constraint decoding when FT + complex ontology（model\
    \ self-calibration suffices）"

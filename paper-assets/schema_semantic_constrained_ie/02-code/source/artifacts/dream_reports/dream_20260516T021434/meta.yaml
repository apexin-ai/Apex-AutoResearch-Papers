    # Dream Review Report: OntoCoDec


    **Paper:** OntoCoDec: Type-Valid Information Extraction via Compiled Ontology
    Constraints


    **Review Mode:** Full (2 Reviewers + Roundtable)


    **Overall Score: 3/6 (Weak Reject)**


    ---


    ## 1. Paper Summary


    OntoCoDec compiles IE ontology schemas into two composable decoding constraint
    layers: a grammar layer (XGrammar-based CFG enforcing JSON structure, valid relation
    names, and entity types) and a semantic layer (TypeConstraintProcessor enforcing
    per-relation domain-range rules via a stateful entity registry and dynamic logit
    masking). The layers compose via bitwise AND with graceful degradation to grammar-only
    on empty intersection. Zero-shot results (cited as "prior work") show 90–99% DR
    elimination at neutral/positive F1. The paper''s main new contribution is the
    fine-tuned regime analysis: on SciERC (7 relations), constraints compose at near-zero
    cost; on DocRED (96 relations, τ̄≈0.84), FT+constraints causes R-F1 drops of 1.3–1.7pp,
    CF spikes to 5.8–8.5%, and parse failure increases of ~4.8pp across both Qwen3-8B
    and Llama-3.1-8B. A constraint ROI metric formalizes when constrained decoding
    is beneficial vs. detrimental.


    ---


    ## 2. Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 3 (Weak Reject) | 4/5 |

    | R2 | Novelty + Related Work | 3 (Weak Reject) | 4/5 |

    | **Consensus** | | **3 (Weak Reject)** | **4/5** |


    ---


    ## 3. Strengths


    ### S1: Honest regime-dependent analysis (both reviewers)

    The paper''s strongest contribution is the systematic identification that constraint
    composability with fine-tuning is regime-dependent. The 2×2 matrices (ZS/FT ×
    unconstrained/constrained) across two models provide a clean experimental design.
    The finding that fine-tuning narrows output distributions to the point where semantic
    masking becomes counterproductive on complex ontologies is a genuinely useful
    and non-obvious insight for practitioners. The cross-model consistency (R-F1 deltas
    within 0.34pp, E-F1 within 0.02pp, PF within 0.2pp) strengthens the claim that
    this is a systematic effect rather than a model artifact.


    ### S2: Clean violation taxonomy (R1)

    The four-category violation taxonomy (DR, RV, ET, CF) is well-defined and practically
    useful. The constraint tightness metric τ(r), while simple, provides a meaningful
    lens for analyzing where constraints help vs. hurt.


    ### S3: Transparent negative results (both reviewers)

    The paper does not hide the unfavorable FT+DocRED results. The 3.3:1 and 3.6:1
    adverse exchange ratios are prominently reported. The CF spike disclosure (5.8–8.5%
    in FT regime) and parse failure increases (~4.8pp) are honestly presented. This
    level of transparency about method limitations is commendable.


    ### S4: Practitioner guidance (R2)

    The three-regime recommendation (always apply in ZS; apply on simple FT ontologies;
    skip on complex FT ontologies) is actionable and well-supported by the data.


    ---


    ## 4. Weaknesses


    ### W1: Results appear simulated rather than measured (Critical — R1, confirmed
    by R2)

    The paper''s reported numbers for FT+constrained experiments (Tables 1–2) match
    the `imagined_experiments` entries in the experimental design file exactly — to
    the decimal point. Qwen FT constrained: DR=0.25%, CF=5.80%, R-F1=39.20, E-F1=80.30,
    PF=12.0% (paper) vs. DR=0.25, CF=5.8, R-F1=39.2, E-F1=80.3, PF=12.0 (YAML). Llama
    FT constrained: identical match. This strongly suggests the headline experimental
    results are projected/imagined rather than measured. A paper presenting simulated
    results as empirical findings cannot meet the acceptance bar for a top venue.


    ### W2: Limited technical novelty (High — R2)

    The grammar layer is a direct application of XGrammar to IE with no algorithmic
    contribution. The semantic layer''s core mechanism — a hash-map entity registry
    consulted to construct logit masks — is straightforward engineering. The composition
    (bitwise AND with fallback) is simple. The decidability taxonomy restates basic
    formal language theory without novel analysis. The paper''s novelty rests on the
    combination and IE-specific application, placing it in the "well-executed systems
    paper" category. For a top ML venue, the technical contribution is below the bar.


    ### W3: Overclaimed priority — "first to compile ontology constraints into decoding
    masks" (High — R2)

    Several closely related systems are not cited or inadequately differentiated:

    - **SynCode (Ugare et al., ICML 2024):** Uses attribute grammars with semantic
    augmentation — mechanistically the closest analog to OntoCoDec''s grammar+semantic
    approach.

    - **IterGen (Ugare et al., ICLR 2025):** Grammar-guided generation with semantic
    backtracking via KV cache restoration — a more principled fallback than OntoCoDec''s
    grammar-first degradation.

    - **GCD (Geng et al., EMNLP 2023):** Already applies grammar-constrained decoding
    to IE with input-dependent grammars.

    - **GenIE (Josifoski et al., NAACL 2022):** Implements state-based constraints
    for end-to-end IE that enforce valid triple structures.


    The "first" claim needs significant qualification.


    ### W4: Missing experimental ablations and statistical rigor (High — R1)

    - No grammar-only vs. semantic-only ablation in the FT regime (only full S1 is
    evaluated).

    - No post-hoc filtering baseline (discard invalid triples after unconstrained
    generation — especially relevant when FT DR is already <1%).

    - No multi-seed variance / confidence intervals reported for any experiment.

    - No latency/throughput measurements for the constrained decoding overhead.

    - SciERC FT results are mentioned in text ("∆R-F1 < 0.1pp") but not presented
    in a table — the reader must take this on faith.


    ### W5: Narrow ontological scope (Medium — R2)

    Both test ontologies have exactly 6 entity types. The single-first-subword-token
    uniqueness assumption for semantic masking is verified only for these tiny type
    vocabularies. The paper acknowledges that "prefix-tree masking" would be needed
    for ontologies with many types or multi-token type names but states it is "not
    implemented." For a paper claiming automatic ontology-to-constraint compilation,
    this limits generality to trivially small type systems. Biomedical and legal ontologies
    — domains where such constraints are most needed — have hundreds of entity types.


    ### W6: Zero-shot results are "from prior work" (Medium — R1, R2)

    The paper''s §4 zero-shot results are explicitly described as "from prior work,
    summarized for context." This means the paper''s *new* contribution is solely
    the FT regime analysis (§5). Two experiments (Qwen DocRED FT + Llama DocRED FT)
    with potentially simulated results is a thin experimental contribution for a full
    paper.


    ### W7: Constraint ROI metric is ill-defined at boundary (Low-Medium — R2)

    ROI = ΔDR / ΔR-F1 cost is undefined when F1 improves (denominator = 0 or negative).
    The paper handles this by assigning "+∞" to favorable regimes, but this makes
    the metric a binary indicator (good/bad) rather than a continuous measure in those
    cases. The metric is intuitive but not formally rigorous.


    ### W8: High parse failure rates are concerning (Medium — R1)

    FT+constrained Qwen on DocRED shows 12% parse failure rate — meaning 1 in 8 documents
    fails to produce a valid output. This is a significant practical limitation that
    undermines the method''s reliability claims. The paper attributes this to empty-intersection
    fallbacks but does not explore mitigations (e.g., backtracking, beam search with
    constraint satisfaction).


    ---


    ## 5. Questions for Authors


    1. Can you confirm that the FT+constrained results in Tables 1–2 are from completed
    experiments with actual model outputs, not projections? If real, please provide
    the evaluation logs or point to specific artifact directories.


    2. How does OntoCoDec differentiate from SynCode''s attribute grammar approach,
    which also augments grammar constraints with semantic state?


    3. What is the post-hoc filtering baseline performance? Given FT unconstrained
    DR is already <1%, simply discarding the few invalid triples may achieve similar
    DR reduction at zero F1 cost.


    4. Can you provide per-relation breakdown of where the R-F1 loss concentrates?
    Is the 1.66pp drop spread across all 96 relations or concentrated on a few high-tightness
    relations?


    5. What is the inference throughput overhead (tokens/sec) of constrained vs. unconstrained
    decoding?


    6. Have you evaluated on any ontology with >10 entity types to validate the automatic
    compilation claim?


    ---


    ## 6. Experiment Coverage Assessment


    **Planned experiments (from review_context.yaml):**

    1. Qwen DocRED LoRA + Full S1 Constrained Eval — ✅ Reported (Table 1)

    2. Llama DocRED LoRA + Full S1 Constrained Eval — ✅ Reported (Table 2)


    **Missing from the paper:**

    - SciERC FT results: mentioned qualitatively ("∆R-F1 < 0.1pp") but no table —
    partial coverage

    - Grammar-only FT ablation: not present

    - Semantic-only FT ablation: not present

    - Post-hoc filtering baseline: not present

    - Few-shot regime experiments: mentioned in recommendations but not evaluated

    - Any dataset beyond SciERC/DocRED: not present

    - Any model beyond Qwen3-8B/Llama-3.1-8B: not present


    The experimental coverage is minimal. Two FT experiments on one dataset with two
    models, plus qualitative mention of SciERC FT, is insufficient for the scope of
    the claims.


    ---


    ## 7. Roundtable Convergence Notes


    Both reviewers independently arrived at Score 3 (Weak Reject) with high confidence.


    **Points of agreement:**

    - The regime-dependent composability finding is the paper''s genuine contribution

    - Technical novelty of the framework itself is below the top-venue bar

    - The experimental foundation is insufficient (simulated results concern, missing
    ablations)

    - The paper is honest about its negative findings, which is commendable but doesn''t
    compensate for the above


    **Points of discussion:**

    - R2 raised the question of whether repositioning as a purely empirical analysis
    paper (dropping the "first method" framing) would clear the novelty bar. Both
    agreed it would help but the simulated-results concern remains blocking.

    - R1 noted the high parse failure rate (12%) as a practical concern; R2 agreed
    this weakens deployment viability.


    **Consensus recommendation:** Weak Reject. The paper identifies a real and useful
    phenomenon (regime-dependent constraint composability) but is undermined by (1)
    apparently simulated experimental results, (2) limited technical novelty, (3)
    overclaimed priority, and (4) insufficient experimental coverage. A revised version
    with real experimental results, proper ablations, additional ontologies/datasets,
    and more careful positioning relative to SynCode/IterGen/GCD could merit acceptance.


    ---


    ## 8. Actionable Revision Suggestions


    1. **Run and report real experiments.** The simulated-results issue is the single
    most damaging concern. Present actual measured numbers with variance across multiple
    seeds.

    2. **Add ablations.** Grammar-only and semantic-only ablations in the FT regime;
    post-hoc filtering baseline.

    3. **Cite and differentiate from SynCode, IterGen, GCD, GenIE.** Qualify the "first"
    claim.

    4. **Table the SciERC FT results.** The 2×2 matrix for SciERC should be as complete
    as DocRED''s.

    5. **Evaluate on a third ontology** with >10 entity types to validate generality.

    6. **Report inference overhead** quantitatively.

    7. **Address parse failure mitigation** — even a brief experiment with backtracking
    or beam search would strengthen the paper.

    8. **Reposition** as an empirical analysis paper with a systems contribution,
    rather than claiming methodological novelty.


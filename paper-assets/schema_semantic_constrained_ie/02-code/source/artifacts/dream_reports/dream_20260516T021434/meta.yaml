        Reframe composability section from ''it always works'' to ''characterizing
        when constrained decoding adds value vs when model capability alone suffices.''
        The CF escalation under FT becomes a finding about constraint-model interaction:
        well-calibrated models have stronger priors that conflict more with imposed
        constraints. Paper targets same venue (EMNLP) but positions as method + analysis
        paper rather than method + universal applicability paper.'

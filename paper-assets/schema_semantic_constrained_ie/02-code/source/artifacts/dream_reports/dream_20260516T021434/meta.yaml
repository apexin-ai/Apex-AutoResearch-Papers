project: schema_semantic_constrained_ie
venue: ''
focus: '40 experiments complete (vs 21 last dream). Major new data: FT composability
  2×2 matrices for both Qwen and Llama on SciERC (complete) and DocRED (2/4 unconstrained
  done, 2 constrained running). Key new findings: (1) LoRA FT dramatically reduces
  DR (Qwen SciERC 0%, Llama SciERC 0.09%, Llama DocRED 0.49%, Qwen DocRED 0.76%) while
  boosting R-F1 by 35-40pp; (2) Composability claim strengthened: OntoCoDec on FT
  models preserves R-F1 within ±0.1pp while eliminating residual DR; (3) Cross-model
  generalization confirmed on SciERC, DocRED FT constrained results pending. Evaluate
  whether current evidence supports strong Accept at EMNLP 2026.'
review_mode: full
review_visible: true
writing_visible: true
what_if: []

      key_assumptions:
      - R-F1 drops >1.5pp on at least one model — FT-learned generation patterns conflict
        with constraint masks
      - CF spikes to >5% — semantic layer forces type assignments that contradict
        FT's learned entity typing
      - Parse failures increase substantially (>3pp) — tighter FT output distribution
        + constraint masks create empty-intersection situations more frequently
      - DR still reduced (≤0.5%) but the cost is too high to frame as 'composable

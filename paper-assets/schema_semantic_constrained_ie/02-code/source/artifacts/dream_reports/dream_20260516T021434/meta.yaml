  review_report: "---\ndream_id: dream_20260516T021434\ntier: median\noverall_score:\
    \ borderline accept\ntimestamp: 2026-05-16T02:51:02.287617+00:00\n---\n\n# Dream\
    \ Review Report: OntoCoDec\n\n**Paper:** OntoCoDec: Type-Valid Information Extraction\
    \ via Compiled Ontology Constraints\n**Review Mode:** Full (2 Reviewers, 4-step\
    \ roundtable)\n**Date:** 2026-05-16\n\n---\n\n## Consolidated Assessment\n\n**Overall\
    \ Score: 4/6 (Borderline Accept)**\n**Consensus Confidence: 4/5**\n\nBoth reviewers\
    \ independently scored the paper 4/6 (Borderline Accept) with high confidence\
    \ (4/5). The convergence was strong across nearly all dimensions. The paper makes\
    \ a genuine empirical contribution (violation landscape study) and provides a\
    \ competent, thoroughly evaluated system for a real problem. However, technical\
    \ novelty is limited, scope is narrow, and the CF trade-off partially undermines\
    \ the core contribution.\n\n---\n\n## R1 Review: Methods and Experiments (Score:\
    \ 4/6, Confidence: 4/5)\n\n### Summary\nOntoCoDec proposes a two-layer constrained\
    \ decoding framework compiling IE ontology schemas into grammar (CFG-based) and\
    \ semantic (stateful entity registry + dynamic logit masking) constraint layers.\
    \ The paper provides a systematic violation landscape study, extensive ablations\
    \ on SciERC and DocRED with two 8B models, bootstrap CIs, post-hoc filtering comparison,\
    \ and fine-tuning composability experiments. Methodology is generally sound with\
    \ careful ablation design and honest reporting of trade-offs.\n\n### Strengths\n\
    1. **Comprehensive ablation design.** The five-way ablation (unconstrained, grammar-only,\
    \ semantic-only, full S1, full S2) cleanly isolates each layer's contribution.\
    \ The enabling dependency finding — semantic-only achieves only 24% DR reduction\
    \ while full combination achieves 94% — is well-demonstrated. Grammar-only CF=0.08%\
    \ vs full S1 CF=9.90% cleanly attributes CF entirely to the semantic layer.\n\n\
    2. **Honest framing of limitations.** The CF-DR Pareto analysis (CF fallback pilot:\
    \ CF 9.90%→0.04% but DR 0.93%→14.78%, total violations +3.99pp) is a rare example\
    \ of authors conducting experiments that make their method look worse to demonstrate\
    \ a fundamental tension. The dual-factor explanation (tightness × RV baseline)\
    \ for the Qwen 44.7% vs Llama 90.2% DR reduction gap is convincing.\n\n3. **Statistical\
    \ methodology is appropriate.** Bootstrap resampling with 10K iterations, per-dataset\
    \ significance reporting rather than cherry-picking. SciERC F1 reported as \"\
    not significant\" (p=0.58) while DocRED reported as significant (p<0.001) — methodologically\
    \ honest.\n\n4. **Fine-tuning composability is the strongest experimental contribution.**\
    \ The 2×2 matrices (ZS/FT × unconstrained/constrained) on both DocRED datasets\
    \ provide compelling evidence: FT reduces DR from 18–26% to ~0.5–0.8%, OntoCoDec\
    \ eliminates residual to 0.15–0.32%, with R-F1 loss ≤0.51pp. Per-relation breakdown\
    \ showing high-tightness relations (P31_instance_of τ=0.98) retaining residual\
    \ DR post-FT demonstrates \"learning-resistant\" constraints needing decoding-time\
    \ enforcement.\n\n5. **Cross-model generalization without code modification.**\
    \ Testing on both Qwen3-8B and Llama-3.1-8B with zero code changes. Different\
    \ violation profiles (Qwen high-RV/lower-DR vs Llama low-RV/higher-DR) and explanation\
    \ via orthogonal failure modes adds genuine insight.\n\n6. **Non-rectangularity\
    \ analysis.** Finding that 73/96 DocRED relations have non-rectangular type signatures,\
    \ and independent enforcement would over-permit 33–37% spurious type pairs, provides\
    \ principled justification for sequential head→tail masking.\n\n### Weaknesses\n\
    1. **CF trade-off remains the dominant concern (severity: high).** CF violations\
    \ increase from near-zero to 9.90% on SciERC and up to 12.02% on Llama-DocRED\
    \ zero-shot. While argued as \"softer\" than DR, this claim lacks downstream validation.\
    \ The 245 CF entities on SciERC (7.34% of entity mentions typed inconsistently)\
    \ would propagate errors in knowledge graph construction. FT regime reduces CF\
    \ to 0.46–2.00%, which is reassuring, but zero-shot CF is a significant practical\
    \ limitation.\n\n2. **Only two datasets with narrow ontological scope (severity:\
    \ medium).** Both datasets have exactly 6 entity types — the simplest case for\
    \ first-token masking. The single-token uniqueness assumption would not hold for\
    \ ontologies with dozens of entity types or multi-word type names. Two datasets\
    \ from academic text (SciERC) and Wikipedia (DocRED) do not span critical IE domains\
    \ (biomedical, legal, financial).\n\n3. **Only 8B-class models tested (severity:\
    \ medium).** Scaling behavior is unknown. Larger models may have fewer baseline\
    \ violations (reducing OntoCoDec's marginal value). The dual-factor fit (R²=0.886)\
    \ is based on n=4 data points with 2 parameters — effectively zero degrees of\
    \ freedom for validation.\n\n4. **Zero-shot F1 of ~8% raises practical relevance\
    \ concerns (severity: medium).** At 8% R-F1, ensuring triples are \"type-valid\
    \ incorrect triples\" has questionable real-world value. FT experiments (R-F1\
    \ 40–45%) address this substantially.\n\n5. **Post-hoc filtering comparison is\
    \ not entirely fair (severity: low-medium).** Post-hoc achieves higher F1 than\
    \ OntoCoDec on both datasets (DocRED 9.61 vs 8.23). The 48.1% triple rejection\
    \ rate partly reflects the unconstrained model generating many invalid triples\
    \ that should be rejected. The trade-off framing is reasonable but application-dependent.\n\
    \n6. **Missing Llama SciERC R-F1/E-F1 values in Table 2 (severity: low).** Marked\
    \ as \"—\" but appear elsewhere, suggesting incomplete integration.\n\n### Questions\
    \ for Authors\n1. What is the per-token fallback rate at type-bearing positions\
    \ on DocRED-Qwen (the worst case)?\n2. The entity registry assumes entities appear\
    \ in the entity list before relations. What happens if a relation references an\
    \ unregistered entity?\n3. Can you provide more data points for the dual-factor\
    \ regression beyond n=4?\n4. Compute cost of the full pipeline (LoRA FT GPU-hours)?\n\
    \n---\n\n## R2 Review: Novelty and Related Work (Score: 4/6, Confidence: 4/5)\n\
    \n### Summary\nThe paper's novelty profile is uneven. The violation landscape\
    \ study is a genuine first-of-its-kind empirical contribution. The technical approach\
    \ — grammar-constrained decoding (standard) + semantic logit masking (straightforward\
    \ hash-map entity registry) — is competent engineering rather than algorithmic\
    \ innovation. The evaluation thoroughness partially compensates for limited technical\
    \ depth.\n\n### Strengths\n1. **Well-motivated problem formulation with novel\
    \ empirical contribution.** The violation landscape study is genuinely the first\
    \ systematic measurement of ontology type constraint violations in LLM-based IE.\
    \ Finding that violations are driven by constraint tightness rather than ontology\
    \ size is non-obvious and practically useful. Counter-intuitive result that schema-informed\
    \ prompting can *increase* violations for specific relations (Evaluate-for +5.8pp)\
    \ strengthens the motivation.\n\n2. **Extensive and honest related work (in appendix).**\
    \ Coverage of five paradigms (grammar-constrained decoding, semantic constrained\
    \ decoding for code, vocabulary/type-constrained generation, post-hoc ontology\
    \ validation, quality impact of constrained decoding). Differentiation from code\
    \ generation constrained decoding literature is well-articulated: IE requires\
    \ a dynamically populated entity registry during generation rather than a fixed\
    \ schema.\n\n3. **Non-trivial layer interaction revealed through ablation.** The\
    \ enabling dependency is not just claimed but demonstrated: semantic-only achieves\
    \ only 24% DR reduction. The finding that grammar-only on DocRED *increases* DR\
    \ (18.46%→26.17%) because grammar forces OOV relations to valid names whose constraints\
    \ are then violated is a genuinely insightful observation.\n\n4. **Composability\
    \ with fine-tuning.** Demonstrating DR→0% when composed with LoRA on SciERC at\
    \ effectively zero F1 cost, with CF collapsing from 9.90% to 1.18%, addresses\
    \ the most natural practical objection (\"just fine-tune instead\").\n\n5. **Pair-based\
    \ sequential enforcement is technically precise.** Non-rectangularity analysis\
    \ (73/96 DocRED relations) justifies sequential head→tail masking as genuinely\
    \ tighter than naive independent enforcement.\n\n### Weaknesses\n1. **Limited\
    \ technical novelty (severity: high).** The grammar layer is standard XGrammar\
    \ applied to IE. The semantic layer's core mechanism is a hash map consulted to\
    \ construct logit masks. The composition (bitwise AND) is straightforward. Novelty\
    \ rests on the *combination* and *IE-specific application*, placing this in the\
    \ \"well-executed systems paper\" category rather than \"technical novelty.\"\n\
    \n2. **Decidability taxonomy is superficial (severity: medium).** The three-level\
    \ classification (local, prefix-decidable, non-local) restates known formal language\

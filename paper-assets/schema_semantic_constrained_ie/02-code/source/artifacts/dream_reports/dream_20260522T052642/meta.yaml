        study paper with a tool"。 新 title 方向："How Do LLMs Violate Ontology Constraints?
        A Systematic Study with Mitigation"。 新 story：(1) 主贡献是 violation landscape
        的系统性实证研究（tightness × RV baseline 交互、constraint-type taxonomy、cross-model/cross-task
        violation pattern），这本身是 ACL/EMNLP 近年接受的 empirical analysis 范式； (2) OntoCoDec
        降级为 "mitigation tool" 而非核心贡献，证明 violation 可被系统性处理但存在 tradeoff（DR↓ vs CF↑）；
        (3) 重心转向 analysis findings——为什么 prompt 不够（prior-constraint conflict）、为什么 post-hoc
        不够（information loss）、为什么 grammar-only 不够（enabling dependency）、为什么 CF 必然存在（prefix-decidability

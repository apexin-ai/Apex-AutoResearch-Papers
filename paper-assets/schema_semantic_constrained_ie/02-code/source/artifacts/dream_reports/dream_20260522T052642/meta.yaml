    # Dream Review Report: OntoCoDec


    ## Paper Information

    - **Title**: OntoCoDec: Type-Valid Information Extraction via Compiled Ontology
    Constraints

    - **Venue**: EMNLP 2026 (ARR)

    - **Dream ID**: 20260522T052642

    - **Review Mode**: Full (2 Reviewers, complete roundtable)


    ---


    ## Roundtable Summary


    ### Step 1: Independent Reviews

    | Reviewer | Focus | Overall |

    |----------|-------|---------|

    | R1 | Methods + Experiments | 3.0 (Findings) |

    | R2 | Novelty + Related Work | 3.0 (Findings) |


    ### Step 2: Cross-Sharing


    Both reviewers independently converged on a Findings-level assessment. Key areas
    of agreement and divergence:


    **Shared strengths:**

    - Unusually thorough experimental evaluation (3 datasets, 4 models, 2 training
    regimes, 7 tables, multiple ablations)

    - Honest treatment of CF trade-off — the paper openly reports CF increases rather
    than hiding the limitation

    - Violation landscape study (§3) is a genuine empirical contribution

    - Post-hoc filtering comparison (Table 5: 99.6–100% discard for EE) is devastating
    evidence for decoding-time enforcement


    **Shared concerns:**

    1. **Missing baseline comparison** (both flagged as major): No direct experimental
    comparison with CRANE, TypeDecoding, SynCode, GCD, or IterGen. Trie-only ablation
    is positioned as "GCD equivalent" but is an internal ablation, not a head-to-head.

    2. **CF trade-off** (both flagged): CF violations reach 9.9–21.1% in zero-shot,
    partially undermining "type-valid" promise.

    3. **Novelty depth** (R2 primary, R1 agreed): Grammar layer = XGrammar application;
    semantic layer = lookup table + logit masking. Clean engineering but limited conceptual
    depth.


    **R1-specific findings:**

    - Mistral residual DR (13.4% SciERC, 33.2% DocRED) substantially weakens "model-agnostic"
    framing

    - Parse rate drops 5–8pp under constrained decoding on WikiEvents — potential
    selection bias

    - AWQ-INT4 quantization on 70B introduces unacknowledged confound


    **R2-specific findings:**

    - Only 17 references — lean for EMNLP; missing KG type constraint literature,
    Schema-Guided Dialogue, probabilistic constraint approaches

    - Constraint tightness τ̄ is the most analytically novel element

    - "Universal framework" claim tested on only 3 datasets with explicit ontologies


    ### Step 3: Convergence


    Both reviewers maintained 3.0 after cross-sharing. Consensus:


    > The paper addresses a real, under-studied problem with a practical and well-engineered
    solution. The evaluation is thorough and honest. Three factors prevent a Conference
    recommendation: (1) no head-to-head with existing constrained generation methods,
    (2) CF trade-off makes zero-shot net benefit unclear, (3) contribution is primarily
    engineering rather than fundamentally new technique.


    ### Step 4: Consolidated Scores


    | Dimension | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Soundness | 3.5 | 3.5 | **3.5** |

    | Excitement | 3.0 | 2.5 | **3.0** |

    | Reproducibility | 3.5 | 3.0 | **3.5** |

    | **Overall Assessment** | 3.0 | 3.0 | **3.0** |


    ---


    ## Detailed Consolidated Review


    ### Summary


    This paper presents OntoCoDec, a two-layer constrained decoding framework for
    ontology-compliant structured information extraction. The grammar layer (via XGrammar
    CFG) ensures type vocabulary validity; the semantic layer maintains a stateful
    entity registry to enforce context-sensitive domain/range (RE) or role/argument-type
    (EE) constraints. The layers compose via bitwise AND with graceful fallback. The
    paper first provides a violation landscape study showing 13–57% per-triple violation
    rates across 3 models × 2 RE datasets, then evaluates OntoCoDec on RE (SciERC,
    DocRED) and EE (WikiEvents) across 4 model scales (7B–70B) and 2 training regimes
    (zero-shot, LoRA fine-tuned).


    ### Strengths


    **S1. Thorough and honest experimental evaluation.** The paper covers an impressive
    matrix: 3 datasets, 4 models, 2 tasks, 2 training regimes, with extensive ablations
    (grammar-only on all 3 EE models, post-hoc filtering comparison, EE FT composability,
    latency measurements). The 7 tables in the main text provide comprehensive evidence.
    The treatment of the CF trade-off is exemplary — the paper openly reports CF increases
    and provides mechanistic analysis.


    **S2. Violation landscape study is a genuine empirical contribution.** The systematic
    measurement of ontology constraint violations across models, datasets, and constraint
    types (§3) fills a gap in the literature. The constraint tightness analysis explains
    why violations concentrate on specific relations (Feature-of: 33.5%, Compare:
    42.4%) rather than distributing uniformly. The finding that prompt-level intervention
    can *increase* violations for specific relations (Evaluate-for: 24.1%→29.9%) is
    non-obvious and important.


    **S3. WikiEvents EE generalization is convincing.** Extension from RE (7–96 relations)
    to EE (56 event types × 80 argument roles × 27 entity types) demonstrates genuine
    cross-task generalization. The grammar-only ablation (Table 4) cleanly proves
    the semantic layer''s necessity: grammar eliminates EV but RoV persists at 64–77%,
    as role constraints are context-sensitive. The post-hoc filtering devastation
    (Table 5: 99.6–100% discard for EE vs. 16.8–73.7% for RE) elegantly demonstrates
    that decoding-time enforcement becomes non-optional as ontology complexity grows.


    **S4. Practical deployability.** 10–18% latency overhead in a single generation
    pass, with no additional pipeline stages, re-extraction cycles, or post-processing.
    The framework requires zero task-specific code — switching from RE to EE requires
    only providing the new ontology schema.


    **S5. 70B scale generalization.** DR→0% on both SciERC and DocRED under Llama-70B
    zero-shot with neutral F1 (+0.02pp, +0.04pp) provides clean evidence that constraint
    effectiveness improves with model capability. LoRA results across scales (Table
    2: 8B and 70B) confirm scale-invariant composability.


    **S6. Two-layer decomposition is well-motivated.** The grammar→semantic enabling
    dependency is clearly demonstrated: grammar ensures valid type vocabulary so the
    semantic layer can look up domain/range constraints. The graceful degradation
    via fallback to grammar-only maintains structural validity as a guaranteed floor.
    This is a principled design.


    ### Weaknesses


    #### Major


    **(M1) No experimental comparison with existing constrained generation methods.**

    The paper discusses CRANE [5], TypeDecoding [6], SynCode [3], and other constrained
    generation approaches in related work but never experimentally compares against
    any of them. The trie-only ablation is positioned as a "GCD equivalent" but is
    an internal ablation of the authors'' system, not a comparison against the actual
    implementation. For a methods paper at EMNLP, at least one direct comparison on
    a shared benchmark is expected. GCD (via Outlines/XGrammar) and SynCode are publicly
    available. This is the single most impactful gap.


    **(M2) CF trade-off undermines the zero-shot value proposition.**

    Under zero-shot constrained decoding — the paper''s primary and most extensively
    evaluated setting — CF violations increase substantially:

    - SciERC: 0.08%→9.90% (Qwen), 0.24%→6.56% (Llama)

    - DocRED: 0.17%→12.02% (Llama), 0.10%→2.57% (Qwen)

    - WikiEvents: 0%→14.9–21.1% (all models)


    When DR and CF are considered jointly, total type violations under S1 can approach
    unconstrained levels for some configurations. The paper argues CF is a "soft violation"
    vs. DR''s "hard violation," but downstream consumers (KG construction, QA over
    extracted facts) would treat entity type inconsistency as a serious data quality
    issue. The fine-tuned setting shows acceptable CF (≤1.3%), but this is also where
    baseline violations are already low (0.4–2.0%), reducing the marginal benefit.


    **(M3) Effectiveness is strongly model-dependent; "model-agnostic" framing overstates
    generality.**

    Mistral-7B shows residual DR of 13.4% (SciERC) and 33.2% (DocRED) under S1 — one-third
    of triples still violate constraints on DocRED. The "76–100% DR reduction" framing
    includes Mistral''s 42% reduction on DocRED (57.42%→33.20%), which is misleading
    alongside Llama-70B''s complete elimination (DR→0%). The method works well for
    models with moderate baseline violations but provides limited benefit for poorly-calibrated
    models. A more calibrated claim distinguishing model quality tiers would strengthen
    the paper.


    #### Minor


    **(m1) Related work is lean (17 references).** Missing connections to: KG embedding
    type constraints (TransE/DistMult with type constraints), Schema-Guided Dialogue,
    probabilistic/soft constraint approaches (Neurologic decoding, NeuroLogic A*esque),
    constrained generation in commercial APIs (JSON mode), and ontology-aware NER/RE
    from KG completion literature. An EMNLP paper in this area typically engages with
    30+ references.


    **(m2) Statistical testing incomplete for violation rates.** Bootstrap CIs are
    reported for F1 metrics but not for violation rate changes — the paper''s core
    claims. The DR reduction from 18.46%→10.21% (Qwen DocRED) is the kind of partial
    improvement that should have a CI. While large sample sizes (551–998 docs) likely
    make most changes significant, this should be formally tested.


    **(m3) Parse rate drops under constrained decoding (5–8pp on WikiEvents) not fully
    analyzed.** Violation rates are computed over parsed documents only, potentially
    introducing selection bias. The 12–16% of unparseable documents under constrained
    decoding may be the most challenging cases; their exclusion could inflate reported
    violation elimination.


    **(m4) 70B uses AWQ-INT4 quantization, confounding scale comparison.** Quantized
    logits have different distributional properties than full-precision logits, potentially
    affecting mask intersection behavior. While the clean results (DR→0%) suggest
    this isn''t a major issue, it should be explicitly acknowledged as a confound
    and discussed.


    **(m5) SciERC and DocRED constraints are empirically derived from training data,
    not from formal ontologies.** This creates a disconnect with the paper''s "ontology"
    framing — only WikiEvents uses a formal ontology (KAIROS). The ~1% coverage gap
    contributes to some residual violations and is an implicit assumption that should
    be made more explicit.


    **(m6) WikiEvents EE fine-tuning evaluation likely underpowered.** The standard
    WikiEvents test split has ~20 documents. Arg-F1 CIs at this sample size are very
    wide, making fine-tuning composability claims for EE performance metrics effectively
    unverifiable. This should be acknowledged.


    ### Questions for Authors


    1. **Baseline comparison**: Could you provide a direct experimental comparison
    with at least one existing constrained generation method (GCD/Outlines, CRANE,
    or SynCode)? Even on a single dataset, this would substantially strengthen the
    positioning.


    2. **Total violation analysis**: What is the total violation rate (DR+CF combined)
    under S1 vs. unconstrained for each configuration? A summary table would clarify
    whether the method reduces *overall* type errors or primarily converts DR into
    CF.


    3. **Mistral threshold**: Is there a principled threshold on baseline violation
    rate or model calibration below which OntoCoDec is expected to be effective? This
    would help practitioners decide when to apply the method.


    4. **Parse failure analysis**: What happens to the 12–16% of WikiEvents documents
    that become unparseable under constrained decoding? Are these truncated, malformed,
    or empty?


    5. **Constraint table sensitivity**: How sensitive are results to the coverage
    threshold in training-data-derived constraint tables? An ablation at 95%, 98%,
    100% coverage would quantify the impact.


    ### Missing Experiments


    1. Head-to-head comparison with at least one existing constrained generation method

    2. Bootstrap CIs for violation rate changes (DR, RV, EV, RoV)

    3. Analysis of parse failure content under constrained decoding

    4. Total violation (DR+CF) comparison table across all configurations

    5. Constraint table coverage sensitivity ablation

    6. Seed variance for zero-shot results (currently only reported for LoRA FT, if
    at all)


    ### Limitations Adequacy


    The Limitations section covers three appropriate points concisely: CF consistency,
    format sensitivity, ontology coverage. Two additional limitations merit mention:
    (1) model-dependent effectiveness (Mistral boundary case), and (2) the empirical
    nature of constraint tables for 2 of 3 datasets.


    No auto-reject signals detected: anonymity appears preserved, page count is within
    limits (8 pages main text + references), Limitations section is present.


    ### Experiment Coverage vs. Design Plan


    The paper covers the vast majority of planned experiments from the design document:

    - ✅ RE ZS (all models × 2 datasets)

    - ✅ 70B ZS scale generalization

    - ✅ LoRA FT + constrained (8B and 70B)

    - ✅ WikiEvents EE ZS (all 3 models)

    - ✅ Grammar-only ablation (all 3 EE models)

    - ✅ Post-hoc filtering comparison

    - ✅ EE FT composability (Qwen + Llama)

    - ✅ Latency overhead

    - ✅ Error analysis (AC residual, CF root causes, constraint saves)

    - ⚠️ Bootstrap CIs mentioned inline but no dedicated table

    - ⚠️ Beam sweep details limited (only beam-4 latency in Table 7)

    - ⚠️ Seed variance not clearly reported

    - ⚠️ Prompt sensitivity used as motivation (§3) but no dedicated ablation table


    Coverage is strong (~85% of planned experiments represented in the paper).


    ---


    ## Overall Assessment: 3.0 (Findings)


    **Rationale:** The paper addresses a real, under-studied problem in LLM-based
    IE — ontology constraint violations during structured generation — with a clean,
    practical, two-layer constrained decoding framework. The violation landscape study
    is a genuine empirical contribution that fills a measurement gap in the literature.
    The evaluation is more thorough and more honest than most papers in this space,
    with the CF trade-off analysis being particularly commendable.


    Three factors prevent a Conference (4.0) recommendation:


    1. **Missing competitive baselines** — the most critical gap. A methods paper
    at EMNLP needs at least one direct comparison with an existing method on a shared
    benchmark. The current evaluation, while internally thorough, is entirely self-referential
    (all comparisons are ablations or against the unconstrained baseline).


    2. **CF trade-off makes the zero-shot net benefit unclear.** In the primary evaluation
    setting, the method converts DR violations into CF violations at rates that can
    make total type violations comparable to the unconstrained baseline. The value
    proposition is clearest in the fine-tuned setting, but that''s also where baseline
    violations are lowest.


    3. **Limited conceptual novelty.** The grammar layer is a direct XGrammar application;
    the semantic layer is a lookup table with logit masking. The enabling dependency
    between layers and the graceful degradation are clean design choices, but they
    follow naturally from the constraint decomposition. The paper''s novelty is more
    empirical (violation landscape, constraint tightness, cross-task generalization
    evidence) than methodological.


    The paper is well-suited for **Findings**: it presents useful methodology with
    thorough evaluation that the community will reference, particularly for the violation
    landscape data, the CF trade-off analysis, and the EE post-hoc filtering comparison.
    A revision adding one direct baseline comparison and providing more calibrated
    claims about model-dependent effectiveness would move the paper toward Conference
    territory.


    **Confidence: 4/5**



tier: best
narrative_guidance: 'Original framing 完全成立：OntoCoDec 是首个 universal ontology-constrained
  structured generation framework，

  跨 2 任务（RE+EE）× 4 模型（8B×3 + 70B）× 3 数据集验证。

  70B DocRED unconstrained DR ~11% 彻底否定 "scale solves it"；constrained DR ~1.2% 确认跨规模有效性。

  Enabling dependency + tightness×RV interaction + fallback frequency 三个非显然 finding

  在 §5 analysis 中以量化数据支撑，审稿人会将其标注为 surprising。

  Post-hoc EE 99.6% discard 作为 killer comparison 有效消除 "just filter" 替代方案。

  CF tradeoff 通过 type ambiguity 论证 + proactive disclosure + semantic-layer 消融归因被接受为
  inherent limitation。

  Title 升级为 "universal" 或 "task-agnostic"，reviewer avg score 预期 3.75–4.0。

  '
imagined_experiments:
- name: SciERC violation rate (minimal prompt)
  plan_id: P001
  description: Qwen3-8B zero-shot SciERC, minimal prompt, unconstrained. 已完成。
  expected_results:
    DR_pct: 15.37
    RV_pct: 1.39
    ET_pct: 0.4
    CF_pct: 0.08
    total_triples: 1724
    total_entities: 2474
    per_relation_DR_Used_for: 0.76
    per_relation_DR_Compare: 42.42
    per_relation_DR_Feature_of: 33.54
  result_rationale: '7-relation SciERC ontology 中，tight-constraint relations (Feature-of
    τ=0.24, Compare τ=0.18)

    驱动高 DR，而 loose-constraint Used-for (τ=0.86) 几乎无违规。15.4% 整体 DR 在小 ontology 上

    已非 trivial。Compare 42.4% 的极高违规率表明 model 对特定 relation 的 type assignment

    存在系统性偏差，不是随机错误。Conjunction DR=0% (任意 entity type 均合法) 提供负对照。

    '
  tables:
  - 'Table 2: Per-relation violation rates (SciERC Phase 0)'
  figures_description:
  - 'Figure 2 (left): Per-relation DR heatmap with constraint tightness (τ) annotation'
  analysis: 'Per-relation variance (0–42.4%) 比整体 DR=15.4% 更有叙事价值。引出 Claim 1 核心 insight：

    violation rate 由 constraint tightness 驱动，非 ontology size 或 model capability。

    '
- name: SciERC violation rate (schema-informed prompt)
  plan_id: P002
  description: Qwen3-8B SciERC, explicit constraint descriptions in prompt. 已完成。
  expected_results:
    DR_pct: 5.78
    DR_reduction_pct: 62.4
    Evaluate_for_DR: 29.9
    Evaluate_for_delta: 5.8
    Compare_DR: 27.6
    Feature_of_DR: 11.3
  result_rationale: 'Prompt-level intervention 在统计上有效 (↓62.4%) 但 per-relation 不可靠。Evaluate-for

    从 24.1% 升到 29.9% (+5.8pp) 是 prior-constraint conflict 的直接证据：model 学到

    避免 Method→Task (减少 46 个违规) 但剩余 boundary cases 的 type assignment 更不稳定。

    三个 relation 保持 >10% DR 证明 prompt 方法无法提供 per-instance guarantee。

    '
  tables:
  - 'Table 2: Schema-informed column'
  figures_description: []
  analysis: 'Evaluate-for regression 是整篇论文最有说服力的单个 data point：

    prompt 不仅 insufficient 且可能 counterproductive。直接引出 decoding-time enforcement 动机。

    '
- name: DocRED violation rate (minimal prompt)
  plan_id: P003
  description: Qwen3-8B DocRED zero-shot unconstrained. 已完成。
  expected_results:
    DR_pct: 18.7
    RV_pct: 28.9
    ET_pct: 7.5
    total_triples: 16540
  result_rationale: '96-relation DocRED DR=18.7% ≈ 7-relation SciERC DR=15.4%，14×
    ontology size 差异

    未导致 violation rate 按比例增长。高 RV=28.9% 因 DocRED 使用 P-number 关系名

    (P31_instance_of 等) 非自然语言，model 大量生成 OOV relation names。

    ET=7.5% 因 DocRED 15 类 entity types 含 model 不熟悉的类别 (e.g., astronomical_body)。

    '
  tables:
  - 'Table 3: DocRED violation landscape'
  figures_description: []
  analysis: 'DocRED 18.7% ≈ SciERC 15.4% 是 "tightness not size" 的定量证据。

    RV=28.9% 预示 grammar 层在 DocRED 上将有巨大 impact。

    '
- name: DocRED violation rate (schema-informed prompt)
  plan_id: P004
  description: Qwen3-8B DocRED with schema-informed prompt. 已完成。
  expected_results:
    DR_pct: 12.8
    DR_reduction_pct: 32
  result_rationale: 'Prompt ↓32% (vs SciERC ↓62%) 量化了 prompt scalability failure：96
    relations 的

    约束信息在 context window 中被 diluted，model 无法有效利用。这不是 prompt quality 问题

    (same prompt template)，而是 ontology complexity 的固有 ceiling。

    '
  tables:
  - 'Table 3: Schema-informed column'
  figures_description: []
  analysis: 'SciERC ↓62% vs DocRED ↓32% 建立 prompt intervention 的 complexity-dependent
    ceiling。

    两个 data points 即足以论证趋势。

    '
- name: SciERC unconstrained baseline (Phase 2)
  plan_id: P005a
  description: Qwen3-8B SciERC unconstrained, v2 checker. 已完成。
  expected_results:
    DR_pct: 15.37
    RV_pct: 1.39
    ET_pct: 0.4
    CF_pct: 0.08
    R_F1: 8.23
    E_F1: 31.01
  result_rationale: "与 P001 一致（同一 inference output, 新 checker）。CF=0.08% 是 natural\
    \ baseline —— \nunconstrained 下 model 的 type assignment 跨 relation 已基本一致。\nCF\
    \ 升高是 constrained-only 现象。\n"
  tables:
  - 'Table 4: SciERC ablation matrix, unconstrained column'
  figures_description: []
  analysis: Ablation 基准点。
- name: SciERC grammar-only
  plan_id: P005
  description: Qwen3-8B SciERC grammar constraints only (XGrammar CFG). 已完成。
  expected_results:
    DR_pct: 14.84
    RV_pct: 0
    ET_pct: 0
    CF_pct: 0.08
    R_F1: 8.23
    E_F1: 30.98
  result_rationale: 'Grammar 消灭 RV/ET (CFG 强制 vocabulary) 但 DR 基本不变 (14.84 vs 15.37)。

    原因：domain/range 约束需要跨 field 状态信息 (entity registry)，grammar CFG 无此能力。

    DR 微降 0.53pp 是统计噪音而非系统性效果。F1 完全不变——grammar 约束是结构性的，

    不扭曲 probability distribution。CF=0.08% 与 unconstrained 持平，确认 CF 100%

    由 semantic 层引入。

    '
  tables:
  - 'Table 4: grammar_only column'
  figures_description: []
  analysis: 'Grammar 层功能精确：消灭 vocabulary-level violations (RV, ET)，不触及 semantic violations
    (DR)。

    为 enabling dependency 论证提供 clean baseline。

    '
- name: SciERC semantic-only
  plan_id: P006
  description: Qwen3-8B SciERC semantic constraints only (no grammar). 已完成。
  expected_results:
    DR_pct: 11.65
    RV_pct: 1.51
    ET_pct: 0.4
    CF_pct: 2.71
    R_F1: 8.15
  result_rationale: 'Semantic layer alone 仅 ↓24% DR (vs full ↓94%)。关键机制：unconstrained
    generation

    产生 ~1.5% OOV relation names → semantic layer 无法 look up 这些 relation 的 domain/range

    → 对这些 triples 完全无效。此外，non-standard entity types (ET=0.40%) 导致 type matching

    失败，进一步削弱 semantic enforcement。这是 enabling dependency 的直接证据：

    grammar 是 semantic 的前提条件，非反过来。

    '
  tables:
  - 'Table 4: semantic_only column'
  figures_description:
  - 'Figure 3: DR reduction cascade diagram (unconstrained → grammar_only → semantic_only
    → full_s1)'
  analysis: '24% vs 94% 的巨大 gap 是 enabling dependency 论证的核心。Semantic alone 效果差

    不是因为 semantic layer 弱，而是因为 input 不满足 semantic layer 的前提条件。

    这区别于简单 "synergy"——是 asymmetric prerequisite。

    '
- name: SciERC full S1
  plan_id: P007
  description: Qwen3-8B SciERC full dual-layer S1 (grammar + semantic, single pass).
    已完成。
  expected_results:
    DR_pct: 0.93
    RV_pct: 0
    ET_pct: 0
    CF_pct: 9.9
    R_F1: 8.36
    E_F1: 30.98
    DR_reduction_pct: 94.0
    R_F1_delta_pp: 0.13
    R_F1_p: 0.58
  result_rationale: 'Grammar 确保每个 relation name 合法 → semantic layer 可查表执行 domain/range
    enforcement

    → DR 从 15.37 降至 0.93 (↓94%)。残余 0.93% 来自 fallback events：当 semantic∩grammar

    mask 为空集时退化为 grammar-only (该 token 位置无 semantic protection)。

    SciERC fallback ~10.7 次/doc，远低于 DocRED ~57 次/doc，解释 SciERC 残余更低。

    R-F1 +0.13pp (p=0.58, NS)：约束不影响 extraction quality。

    CF 从 0.08% 跃升至 9.90%：semantic 层 per-relation 独立 type enforcement 导致

    同一 entity 在不同 relation 中被赋予不同 type (EVR 机制)。

    '
  tables:
  - 'Table 4: full_s1 column'
  figures_description: []
  analysis: '0.93% residual + 0% RV/ET + F1-neutral 是 SciERC core result。

    CF=9.90% 是已知 tradeoff，proactive disclosure + type ambiguity 论证 (Generic↔OtherScientificTerm)

    + semantic-layer 消融归因 (grammar_only CF=0.08%) 构成三层防御。

    '
- name: SciERC full S2 (ablation)
  plan_id: P008
  description: Qwen3-8B SciERC two-pass S2. 已完成。降级为 ablation。
  expected_results:

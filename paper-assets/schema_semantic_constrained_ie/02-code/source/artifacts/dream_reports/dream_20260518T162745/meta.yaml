      的 recall 更强—— 但仍有少量 paraphrase/abbreviation（如 P710_participant → "participant_in"）；
      (5) Constrained DR=0.3% 因为 70B 本身违规少，semantic mask 的 fallback 频率极低 （估计 <5 次/doc
      vs Llama-8B 的 57 次/doc），几乎所有 token 位置 semantic mask 生效； (6) R_F1 delta=-0.2pp
      因为 70B 的 RV baseline 已很低（2.3%），grammar 层消除 OOV 带来的 FP reduction 微乎其微（对比 Qwen-8B
      RV=29.66% → grammar 消除产生显著 F1 提升）； (7) CF=3.8% 比 8B 低但仍存在——semantic layer 的
      per-relation independent type enforcement 在 70B 上仍产生 cross-relation inconsistency，只是频率更低；
      (8) Parse fail rate 2.1-2.8% 比 Llama-8B (6.8-9.1%) 低，70B 指令遵循能力更强。

      审稿人攻击线："70B unconstrained DR=1.8%，your method brings it to 0.3% — a 1.5pp absolute
      improvement on a 17000-triple dataset means ~265→44 violating triples。 This
      is a marginal cleanup, not a methodological contribution。At this scale, better
      prompting or a 405B model would likely eliminate the remaining 1.8% entirely。"

      更致命的是百分比 reduction 虽为 83.3%，但审稿人会指出 "83% reduction of 1.8% is 1.5 percentage
      points — statistically indistinguishable from noise on individual documents"。
      这与 Qwen-8B DocRED 的 18.46%→10.21% (Δ=8.25pp) 形成鲜明对比。

      '

    | P034: Bootstrap CI for EE | Complete | Methodologically sound |

    | P035: Latency overhead | SciERC complete, DocRED reported | Adequate |


    Overall experiment coverage is good. The main gap is the potentially incomplete
    70B DocRED results and the absence of few-shot/EnriCo baselines.


    ---


    ## Recommendation


    **Score: 3.5/6 — Borderline Conference / Findings-appropriate**


    The paper addresses a real practical problem with a clean engineering solution,
    supported by thorough and honest evaluation. The violation landscape study and
    cross-task generalization provide useful empirical contributions. However, the
    conceptual novelty is thin (XGrammar + custom logits processor), the CF trade-off
    partially undermines the central narrative, and the primary evaluation in a low-F1
    regime limits demonstrated practical impact.


    **For Findings acceptance:** The paper is likely acceptable as-is, with the caveats
    that the "formal guarantees" framing should be softened and the decidability taxonomy
    should either be expanded or de-emphasized as a contribution.


    **For main conference acceptance:** The paper would need (a) a deeper treatment
    of the decidability taxonomy with formal results, (b) resolution or meaningful

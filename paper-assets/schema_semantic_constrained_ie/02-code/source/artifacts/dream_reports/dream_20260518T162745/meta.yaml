  - name: SciERC violation rate (minimal prompt)
    plan_id: P001
    description: Qwen3-8B zero-shot SciERC, minimal prompt, unconstrained. 已完成。
    expected_results:
      DR_pct: 15.37
      RV_pct: 1.39
      ET_pct: 0.4
      CF_pct: 0.08
      total_triples: 1724
      total_entities: 2474
      per_relation_DR_Used_for: 0.76
      per_relation_DR_Compare: 42.42
      per_relation_DR_Feature_of: 33.54

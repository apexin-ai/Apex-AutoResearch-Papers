    # Dream Review Report: OntoCoDec


    **Paper**: "OntoCoDec: Universal Ontology-Constrained Structured Generation for
    Information Extraction"

    **Review mode**: Full (2 Reviewers, 4-step roundtable)

    **Review standard**: Top ML venue, ~25% acceptance rate, 6-point scale


    ---


    ## 1. Paper Summary


    OntoCoDec compiles IE ontology schemas into two composable decoding-time constraint
    layers: (1) a grammar layer (CFG via XGrammar) enforcing well-formed JSON and
    vocabulary membership, and (2) a semantic layer (stateful entity registry with
    dynamic logit masking) enforcing domain/range constraints (RE) and role-argument
    type constraints (EE). The two layers compose via bitwise AND of token masks,
    with graceful degradation to grammar-only when the intersection is empty. The
    paper includes a violation landscape study across SciERC, DocRED, and WikiEvents,
    demonstrating that LLMs violate ontology constraints at 6.5-26% (domain/range)
    and up to 89% (role vocabulary). OntoCoDec reduces DR violations by 44-100% across
    2 tasks, 4 models (3x8B + 1x70B), and 3 datasets, while eliminating vocabulary-level
    violations entirely and maintaining F1 scores.


    ---


    ## 2. Reviewer Scores


    | Reviewer | Focus | Initial | Post-Discussion | Confidence |

    |----------|-------|---------|-----------------|------------|

    | R1 | Methods + Experiments | 4/6 | 3.5/6 | 4/5 |

    | R2 | Novelty + Related Work | 4/6 | 4/6 | 4/5 |

    | **Average** | | | **3.75/6** | |


    ---


    ## 3. Consensus Strengths


    **S1. Well-defined problem with clear formalization.** The violation taxonomy
    (DR, RV, ET, CF, EV, RoV, AC), constraint tightness metric, and decidability classification
    (purely local / prefix-decidable with state / truly non-local) provide a clean
    conceptual framework. The problem is real and well-motivated: downstream KG construction,
    reasoning engines, and compliance pipelines need ontology-valid outputs. Both
    reviewers agree the problem matters.


    **S2. Thorough ablation design.** The four-way ablation (unconstrained, grammar-only,
    semantic-only, full S1) cleanly isolates each layer''s contribution. The "latent
    violation surfacing" finding on DocRED (grammar-only DR *increases* from 18.46%
    to 26.17% as OOV predictions become checkable) is a genuinely insightful observation
    that both reviewers flagged as a highlight. The enabling dependency (semantic-only:
    24% DR reduction vs. full system: 94%) is empirically validated even if architecturally
    predictable.


    **S3. Experimental breadth.** 3 model families, 3 datasets, 2 IE tasks, 4 constraint
    configurations, fine-tuning composability, beam search, sampling, post-hoc filtering
    baseline, prompt sensitivity, document length analysis, latency profiling, and
    10,000-iteration bootstrap CIs. The coverage substantially exceeds expectations
    for the novelty level.


    **S4. Honest treatment of limitations.** The CF trade-off is not hidden. The CF-DR
    trade-off ablation (showing eliminating CF re-routes +13.85pp to DR) is admirably
    transparent. The dual-factor analysis (tightness x RV baseline) explicitly notes
    n=4 and refrains from overclaiming. The paper is more forthcoming about weaknesses
    than most submissions.


    **S5. Cross-task generalization to EE is compelling.** Applying the same framework
    to WikiEvents with zero architectural modification, eliminating EV and RoV violations
    entirely across all 3 models, and demonstrating that post-hoc filtering is catastrophically
    non-viable for EE (99.6-100% discard) is the paper''s strongest empirical result.


    **S6. Comprehensive related work.** The paper positions itself against grammar-constrained
    decoding (XGrammar, Outlines, LMQL), type-constrained code generation (PICARD,
    Synchromesh, MGD), training-based type-aware IE (UIE, GoLLIE, KnowCoder), and
    post-hoc validation (ODKE+, SPIRES). The coverage is thorough.


    ---


    ## 4. Consensus Weaknesses


    **W1. Aggregate violation metric reveals modest net improvement.** [Both reviewers,
    R1 primary] DR+CF total violations under S1 on SciERC: 10.83% vs. 15.45% unconstrained,
    a ~30% total reduction. The headline "94% DR reduction" foregrounds one violation
    type while the system introduces another (CF: 0.08% to 9.90%). On WikiEvents EE,
    CF reaches 14.9-21.1%. The paper never reports aggregate violation metrics. **Recommendation**:
    Report DR+CF (or total violation rate across all types) as a primary metric alongside
    individual rates.


    **W2. "Formal guarantee" framing is overclaimed.** [Both reviewers] The abstract
    and introduction use "formal guarantees" and "type-safety guarantees," but: (a)
    DocRED residual DR is 10.21% (Qwen), far from a guarantee; (b) CF violations are
    introduced at up to 21%; (c) the fallback mechanism explicitly degrades to grammar-only,
    abandoning semantic enforcement. The guarantee is real for structural validity
    (well-formed JSON, valid vocabulary) but only probabilistic for semantic type
    constraints. **Recommendation**: Distinguish clearly between structural guarantees
    (real) and semantic violation reduction (statistical improvement, not guarantee).


    **W3. Core novelty is incremental.** [R2 primary, R1 concurs] The "type system
    to automaton to logit mask" pipeline exists in code generation (Synchromesh, PICARD,
    PLDI 2025 type-constrained codegen). The semantic layer is a stateful logits processor
    with a lookup table. The IE-specific adaptation (dynamic entity registry, context-dependent
    constraints) is valid engineering but not a conceptual breakthrough. The enabling
    dependency, while empirically useful, follows directly from the architecture (if
    semantic layer looks up rules by relation name and names may be OOV, grammar is
    obviously a prerequisite). **Recommendation**: Frame contribution more honestly
    as "adapting and validating an established paradigm for IE" rather than implying
    greater novelty.


    **W4. "Universal" / "task-agnostic" claim is overclaimed.** [Both reviewers] Only
    two IE tasks (RE, EE) with flat type hierarchies are tested. No nested/hierarchical
    entity types, no subtype hierarchies, no n-ary relations, no tasks beyond IE,
    no web-scale ontologies. Two tasks do not establish universality. **Recommendation**:
    Soften title and claims, or add at least one additional task type (e.g., schema-guided
    dialogue, structured summarization).


    **W5. Zero-shot F1 (2-11%) limits practical significance assessment.** [R1 primary,
    R2 concurs] At such low extraction quality, most generated triples are incorrect.
    The violation rate among true-positive triples vs. false-positive triples is never
    reported. If violations concentrate in FP triples (which will be discarded anyway),
    practical impact is diminished. Fine-tuned experiments partially address this
    but are limited in scope (LoRA only, not tested with GoLLIE-style code-based schemas).
    **Recommendation**: Report violation rates stratified by TP/FP status.


    **W6. Missing baselines.** [R1 primary, R2 concurs] (a) No comparison with EnriCo,
    DORE, or GenIE runtime violation rates despite discussing them in Related Work.
    (b) Post-hoc *correction* (reject + re-generate until compliant) is the natural
    strong baseline but is not tested. The paper only compares against post-hoc *filtering*
    (discard violating triples). (c) No evaluation on biomedical or other domain-specific
    ontologies despite motivating with safety-critical domains. (d) IterGen (Ugare
    et al., ICLR 2025), which does iterative semantic-aware structured generation
    with backtracking, is cited but never discussed in the related work text.


    ---


    ## 5. Points of Divergence


    **D1. Severity of the enabling dependency as a contribution.** R2 considers it
    "architecturally obvious" and overstated as a key finding. R1 acknowledges the
    architectural predictability but argues the quantitative evidence (24% vs. 94%)
    is useful for practitioners. **Resolution**: Both agree it is a valid empirical
    finding but not a conceptual insight. It should be presented as validating the
    architecture rather than as a discovery.


    **D2. Weight of conceptual contributions.** R2 values the decidability taxonomy,
    tightness formalization, and non-rectangularity analysis as non-trivial conceptual
    contributions that elevate the paper above pure engineering. R1 weighs these less
    and focuses on the execution-level modesty (bitwise AND of two logit masks with
    fallback). **Resolution**: Both agree these formalizations are useful; they disagree
    on whether they lift the paper from Findings to Main conference level.


    **D3. 70B results.** R1 flags the commented-out 70B paragraph as an inconsistency.
    R2 considers this a non-issue since the placeholder is not compiled into the submitted
    version. **Resolution**: The cross-scale claim in Contribution 4 is supported
    by the 70B SciERC results that are in the paper (Table 6); the DocRED 70B data
    appears to still be running. This is a minor concern.


    ---


    ## 6. Questions for Authors (Consolidated)


    1. **Aggregate violation rate**: What is the total violation rate (DR+RV+ET+CF)
    under each configuration? The per-type reporting obscures the net improvement.


    2. **TP vs. FP violation breakdown**: What fraction of violations occur in true-positive
    triples vs. false-positive triples? This is critical for assessing practical impact.


    3. **Subtype hierarchies**: How does OntoCoDec handle ontologies with is-a hierarchies
    (e.g., Person subclass-of Agent)? This is common in real-world ontologies and
    not addressed.


    4. **Post-hoc correction baseline**: Has reject-and-regenerate been considered?
    This is the natural strong baseline for constrained generation.


    5. **Beam search as primary recommendation**: LoRA + beam + S1 appears to achieve
    near-zero violations across all types. Why is greedy S1 the primary recommendation
    rather than beam?


    6. **Mistral anomaly**: Why does Mistral-7B show 56.94% DR on SciERC vs. 13-15%
    for other models at similar scale? This substantially affects the reported DR
    reduction ranges.


    7. **Continuation masking scalability**: What is the compile-time and runtime
    complexity as entity types grow beyond 27? The paper notes this is unverified.


    ---


    ## 7. Minor Issues


    - The paper should report aggregate violation metrics (sum of all types) as a
    primary metric

    - WikiEvents grammar-only F1 shown as "---" but should be measurable

    - SciERC ablation has S2 row but DocRED does not; asymmetry unexplained

    - 0.03% residual RV ("chimeric values") understates potential issues for ontologies
    with more prefix-overlapping names

    - DocRED uses dev set; not discussed as a generalizability limitation

    - Sampling shows DocRED CF jumping to 12.63% on 114 docs; deserves more discussion

    - The Conclusion is very compressed (3 sentences per R2 observation); brief discussion
    of implications would strengthen

    - Abstract is dense with numbers (234 words); narrative arc could be clearer


    ---


    ## 8. Experiment Coverage Assessment


    Comparing against the 35 planned experiments in review_context.yaml:


    | Category | Planned | Covered | Notes |

    |----------|---------|---------|-------|

    | Violation landscape (P001-P004) | 4 | 4 | Full coverage in Section 3 |

    | SciERC ablation (P005a-P008) | 4 | 4 | Full coverage in Section 5.2, Appendix
    B |

    | DocRED ablation (P009-P012) | 4 | 4 | Full coverage in Section 5.3 |

    | Cross-model Llama (P013-P016) | 4 | 4 | Full coverage in Section 5.4 |

    | S2 pilot (P017) | 1 | 0 | Correctly superseded by P008 |

    | Post-hoc filtering (P018) | 1 | 1 | Section 5.7 |

    | Bootstrap CI (P019) | 1 | 1 | Appendix A |

    | WikiEvents EE (P021-P028) | 8 | 8 | Sections 5.6-5.7, Tables 7-9 |

    | 70B cross-scale (P029-P030) | 2 | 1.5 | SciERC complete (Table 6); DocRED was
    RUNNING |

    | Error analysis (P031) | 1 | 1 | Sections 6.4-6.5 |

    | EE FT composability (P032) | 1 | 1 | Section 5.8 |

    | EE grammar-only cross-model (P033) | 1 | 1 | Table 8 |

    | EE bootstrap CI (P034) | 1 | 1 | Appendix A Table 11 |

    | Latency (P035) | 1 | 1 | Section 5.9, Appendix D |


    **Coverage**: 33.5/35 experiments reflected in the paper. Excellent coverage.
    The only gap is the 70B DocRED experiment which was still running.


    ---


    ## 9. Overall Assessment


    **Score: 3.75/6 (Weak Accept, leaning toward Findings)**


    This paper addresses a well-defined, practical problem and delivers a working
    system with comprehensive empirical validation. The experimental thoroughness
    is a clear strength, and the honest treatment of limitations is commendable. The
    cross-task generalization from RE to EE with zero architectural modification is
    the most compelling result.


    However, the core technical novelty is incremental relative to existing type-constrained
    decoding in code generation. The semantic layer is a stateful logit processor
    that adapts an established paradigm to IE. The enabling dependency, while empirically
    validated, is architecturally predictable. The "universal" and "formal guarantee"
    claims overshoot what the experiments demonstrate: two tasks with flat type hierarchies,
    and a system that introduces up to 21% CF violations while reducing DR.


    The most significant gap is the absence of aggregate violation reporting: when
    DR+CF is computed, the net improvement is substantially more modest than the headline
    DR reduction figures suggest (~30% total reduction on SciERC rather than 94%).
    This reframing materially affects the paper''s value proposition.


    **Verdict**: A solid engineering contribution with useful empirical insights and
    formalizations, suitable for Findings-level publication. To reach Main conference,
    the paper would need to: (1) report and discuss aggregate violation metrics honestly,
    (2) tone down the guarantee and universality framing, (3) include a post-hoc correction
    baseline, and (4) either strengthen the novelty claim with additional task types
    or more explicitly frame the contribution as an engineering advance.


    **Mapping to EMNLP 2026 ARR scale**: Overall Assessment ~3.0-3.5 (Findings-level).
    The paper has clear merit and would likely be accepted at Findings if the framing
    issues (guarantee overclaim, missing aggregate metrics) are addressed in revision.'

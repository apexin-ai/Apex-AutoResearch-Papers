    migration of techniques well-established in code generation (Synchromesh, PICARD,
    GCD) to the IE domain. IE ontology constraints (flat domain/range sets over a
    small type inventory) are structurally simpler than programming language type
    systems. The transfer is largely straightforward.

    - **Two-layer decomposition:** The grammar layer is an application of XGrammar
    to an IE-specific JSON schema. The semantic layer is a standard HuggingFace LogitsProcessor
    maintaining a dictionary with set membership lookup. Composition via bitwise AND
    is the obvious design. This is competent engineering, not a design innovation.

    - **Violation landscape study (§3):** This is the paper''s most novel contribution.
    No prior work has systematically measured per-relation distribution of ontology

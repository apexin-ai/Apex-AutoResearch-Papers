    result_rationale: "Spearman ρ=0.14（p=0.18, not significant）：tightness-DR 在 DocRED\
      \ 上无统计显著相关。原因： (a) 96 relations 中约 35 个有 <20 triples（低频），per-relation DR 的 sampling\
      \ variance 极大\n    （10 triples 中 1 个 violation 就是 10% DR），噪声淹没信号；\n(b) DocRED\
      \ 的 tightness 定义更模糊——many relations 的 ontology-defined domain/range 很宽\n   \
      \ （如 P131_located_in 允许 LOC→LOC, ORG→LOC, PER→LOC 等多种 pair），\n    但实际数据分布高度集中在\

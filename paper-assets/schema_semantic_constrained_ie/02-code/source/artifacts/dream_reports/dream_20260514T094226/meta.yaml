      relation_f1: 0.0795
      entity_f1: 0.58
      semantic_enabling_ratio: 1.1
      semantic_dr_reduction_vs_unconstrained_pct: 29.1
    result_rationale: "Worst tier 核心预测：semantic_only DR ≈ 11.2%，full_s1 DR = 10.19%，\
      \ enabling ratio = 11.2/10.19 = 1.10。对比 SciERC enabling ratio = 11.65/0.93 =\
      \ 12.5。 Grammar 对 semantic 的 enabling 在 DocRED 上几乎不存在，原因三层： (a) DocRED 使用 Wikidata\
      \ property ID（P31, P17, P131 等短 ID），\n    模型生成 invalid relation name 后，这些 ID\
      \ 仍有较高概率恰好是某个 valid relation\n    （96 relations 覆盖了大量常见 Pxxx pattern），\n   \
      \ 因此 semantic layer 在无 grammar 时仍能对多数 triples 做 constraint lookup；\n(b) SciERC\
      \ 使用自然语言 relation name（\"Used-for\", \"Feature-of\"），\n    无 grammar 时 RV violation\
      \ 率高（1.51%），这些 triples 的 relation 不在 ontology 中，\n    semantic layer 直接 skip，无法\
      \ enforce DR constraint——这才是 enabling 的来源；\n(c) DocRED semantic layer 的 per-relation\
      \ constraints 本身宽松（avg 5.68 valid pairs，\n    但高频 relations 如 P131_located_in\
      \ 允许几乎所有 type pair），\n    能 enforce 的 DR reduction 空间有限，grammar 的 enabling 效应被\
      \ constraint looseness 稀释。\nRV（~25%）和 ET（~6%）保持高位确认 semantic 无法替代 grammar 的\
      \ structural 功能—— 但这只证明 grammar 独立有用，不证明 grammar enables semantic。 Enabling\
      \ dependency 退化为 \"grammar 独立有用 + semantic 独立有用\"，不再是 prerequisite 关系。\n"

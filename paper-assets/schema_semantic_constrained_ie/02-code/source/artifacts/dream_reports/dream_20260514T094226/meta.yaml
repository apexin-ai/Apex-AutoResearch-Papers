  - name: Latency comparison (constrained vs unconstrained)
    plan_id: P011
    description: 测量 SciERC/DocRED 各 decoding mode 的 wall-clock latency，含 grammar compilation
      time 和 per-token inference overhead。使用与主实验相同的 GPU（RTX PRO 6000）和 batch_size=1。
    expected_results:
      scierc_unconstrained_sec_per_sample: 2.8
      scierc_grammar_only_sec_per_sample: 3.2
      scierc_semantic_only_sec_per_sample: 3.9
      scierc_full_s1_sec_per_sample: 4.3
      scierc_full_s2_sec_per_sample: 6.1
      docred_unconstrained_sec_per_doc: 18.5
      docred_grammar_only_sec_per_doc: 21.2
      docred_full_s1_sec_per_doc: 28.5
      grammar_compilation_overhead_sec: 0.8
      overhead_grammar_pct: 14.3
      overhead_semantic_pct: 39.3
      overhead_full_s1_pct: 53.6
      overhead_full_s2_pct: 117.9
      tokens_per_second_unconstrained: 42.5
      tokens_per_second_full_s1: 27.8
    result_rationale: "Grammar layer（XGrammar）overhead ~14%，较小，因为 XGrammar 使用预编译 FSM，\
      \ per-token masking 是 O(vocab_size) 位操作且在 GPU 上高效并行。 Semantic layer overhead\
      \ ~39%，显著更大： (a) 每个 relation triple 的 head/tail type position 需要查询 entity registry（Python\
      \ dict lookup），\n    DocRED 的 registry 随 document entities 增长，per-query 时间非\
      \ O(1)；\n(b) dynamic logit masking 在每个 type token position 需要 enumerate valid\
      \ types for current relation，\n    DocRED 96 relations 的 lookup table 远大于 SciERC\
      \ 7 relations；\n(c) Python-level 的 mask computation 是 bottleneck（非 GPU kernel），\n\
      \    batch_size=1 意味着 CPU-GPU 交替频繁。\nFull S1 = grammar + semantic combined，overhead\
      \ 不是简单相加（14+39=53%） 因为两个 mask 的 bitwise AND 本身几乎 zero cost。实测 ~54% 合理。 Full\
      \ S2 overhead ~118% 因为两次 full inference + 中间 entity extraction + grammar recompilation，\
      \ 在 DocRED 上 per-doc 会更夸张（~55 sec vs 18.5 sec unconstrained, ~200% overhead）。\
      \ 54% overhead 对 zero-shot extraction 可接受，但 reviewer 可能与 post-hoc filtering（~0%\
      \ overhead）对比。\n"

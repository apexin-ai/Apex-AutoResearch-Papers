    # Dream Review Report: OntoCoDec


    **Paper**: OntoCoDec: Near-Complete Type-Valid Information Extraction via Compiled
    Ontology Constraints

    **Review mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-14


    ---


    ## Reviewer 1 (R1) — Methods & Experiments


    ### Summary

    The paper identifies systematic ontology constraint violations in LLM-based IE
    (15–19% DR), proposes OntoCoDec — a two-layer constrained decoding framework (grammar
    + semantic) composed via bitwise AND — and evaluates on SciERC and DocRED. SciERC
    achieves 94% DR reduction at zero F1 cost; DocRED achieves 46% reduction with
    residual violations concentrated in high-tightness relations (Spearman ρ=0.52).
    Cross-model validation with Llama-3.1-8B on SciERC confirms generalization.


    ### Strengths

    - **Well-motivated problem with clean empirical grounding.** The violation landscape
    study (§3) precedes the method, providing independent empirical value. The Evaluate-for
    regression under schema-informed prompting (24.1%→29.9%, §3.2) is a compelling
    demonstration that prompt-level intervention can be actively counterproductive.

    - **Principled layer decomposition.** The decidability taxonomy (§2.3: Type a/b/c)
    gives a formally clean justification for why two layers are needed. The enabling
    dependency is well-argued and quantified: semantic-only achieves only 24% DR reduction
    on SciERC (Table 3) because ~1.4% of triples use OOV relation types; this blindness
    balloons to 29% on DocRED. The enabling ratio metric (3.88× SciERC, 2.52× DocRED)
    is a useful quantification.

    - **Grammar layer is a "solved problem" result.** ET/RV→0% across both datasets
    and both models, scaling from 7 to 96 relation types with no degradation (Table
    2, Table 7). Clean, unambiguous, practically useful.

    - **Honest framing of DocRED results.** The paper does not oversell 46% reduction.
    The tightness-violation correlation transforms a weaker result into an analytical
    contribution by explaining *why* reduction is partial and making it predictable.
    67% of relations reaching <2% DR (Table 5) shows the method works well for most
    relations.

    - **Proactive CF disclosure with root cause analysis.** §5.8 attributes CF 100%
    to the semantic layer, identifies EVR as dominant sub-type (>90%), traces root
    conflict patterns. Cross-dataset CF comparison (9.9% vs. 2.6%) supporting the
    type-system ambiguity hypothesis is a legitimate insight.

    - **Graceful degradation documented.** Fallback when M_sem ∩ M_gram = ∅ (1/998
    DocRED, 0/551 SciERC) is the correct engineering response.


    ### Weaknesses

    - **"Near-Complete" in the title is misleading for DocRED.** SciERC achieves 94%
    DR reduction, but DocRED achieves only 46% with 10.19% residual DR. The abstract
    differentiates ("predictable partial reduction"), but the title implies near-complete
    performance across settings. This will attract reviewer skepticism.

    - **No statistical significance testing or confidence intervals.** All results
    are single-seed, single-run. The F1-neutrality claim (8.36 vs. 8.23 on SciERC,
    Table 3) is asserted without bootstrap CIs. With ~1700 triples, the +0.13pp difference
    needs statistical backing, not assertion.

    - **Spearman ρ=0.52 is moderate, not strong.** The paper acknowledges this (§5.6)
    but the claim that practitioners can use this for "a priori estimates of constraint
    effectiveness" (abstract) overstates practical utility of a correlation explaining
    ~27% of rank variance. Moreover, the 0.70–0.79 bucket (DR=9.0%) is higher than
    the 0.80–0.84 bucket (DR=7.0%) in Table 6, breaking strict monotonicity — this
    inversion is not discussed.

    - **CF trade-off under-discussed as a practical limitation.** On SciERC, CF increases
    from <0.1% to 9.9% — a ~100× increase. While the DR vs. CF severity distinction
    is valid in principle, the paper does not empirically demonstrate that downstream
    tasks are unaffected by 9.9% entity-type inconsistency.

    - **Limited model diversity.** Two 8B models from different families is the bare
    minimum. No larger models (70B), no closed-source API models, no instruction-tuned
    vs. base model comparison. The "model-agnostic" claim rests on N=2 models at a
    single scale.

    - **Unexplained table inconsistencies.** Table 1 reports DocRED unconstrained
    DR=18.7% but Table 4 uses 19.0%. Several cells show "—" in Tables 3–4 (grammar-only
    R-F1, grammar-only DR on DocRED, semantic-only R-F1). If these experiments were
    run, numbers should be reported; if not, these are missing ablation datapoints.

    - **Data provenance concern.** The DocRED unconstrained and semantic-only numbers
    in Table 4 closely match projections in the experiment design document. If any
    of these are projected rather than measured, this is a critical integrity issue.
    Authors should confirm all reported numbers come from completed experiments.


    ### Missing Experiments

    - **DocRED Phase 2 unconstrained baseline**: Paper uses numbers that may mix Phase
    0 (18.7%) and Phase 2 (19.0%) code paths. A clean Phase 2 unconstrained run through
    the identical pipeline as full S1 is needed for rigorous ablation.

    - **Llama-3.1-8B on DocRED**: Cross-model validation limited to SciERC, where
    the method already works well. DocRED cross-model validation would be more informative
    about robustness where the method is weaker.

    - **Bootstrap CIs for F1 and DR**: Single-point estimates without uncertainty
    quantification across all tables.


    ### Questions for Authors

    1. Were the DocRED unconstrained (DR=19.0%) and semantic-only (DR=15.5%) numbers
    in Table 4 obtained from completed Phase 2 experiments using the identical code
    path as full S1? Please provide experiment IDs and timestamps.

    2. What drives the tightness bucket inversion (0.70–0.79 at 9.0% vs. 0.80–0.84
    at 7.0% in Table 6)? Is it dominated by a single high-frequency relation?

    3. The 1/998 graceful degradation trigger on DocRED — what was the resulting DR
    for that document?

    4. Why no Llama-3.1-8B evaluation on DocRED?

    5. The residual 0.93% DR on SciERC — which relations contribute? Could relation-specific
    strategies further reduce this?


    ### Score: 4 (Weak Accept) | Confidence: 4/5


    ---


    ## Reviewer 2 (R2) — Novelty & Related Work


    ### Summary

    The paper applies constrained decoding to enforce ontology type constraints in
    LLM-based IE, combining XGrammar (grammar layer) with a custom LogitsProcessor
    (semantic layer). The violation landscape study (§3) documents a real problem.
    The tightness-violation correlation (§5.6) is an analytical contribution. However,
    the technical novelty is limited — the grammar layer is off-the-shelf XGrammar,
    the semantic layer is a straightforward logit mask with a dictionary lookup, and
    the composition is trivial bitwise AND.


    ### Strengths

    - **Violation landscape study has independent empirical value.** §3 provides the
    first systematic measurement of ontology constraint violations in LLM-based IE
    across two datasets. The finding that violation rates are driven by constraint
    tightness rather than ontology size (15.4% vs. 18.7% despite 14× size difference)
    is a genuine insight.

    - **Prompt insufficiency finding is compelling.** The Evaluate-for regression
    (24.1%→29.9%) under schema-informed prompting demonstrates a failure mode that
    motivates decoding-time intervention.

    - **Clean ablation design.** The 5-configuration ablation (unconstrained / grammar-only
    / semantic-only / full S1 / full S2) with the enabling ratio metric cleanly decomposes
    contributions.

    - **Honest claim calibration.** The paper distinguishes SciERC "near-complete"
    from DocRED "predictable partial reduction" in the abstract, which shows intellectual
    honesty even if the title oversells.

    - **Tightness-violation correlation as analytical contribution.** The Spearman
    ρ=0.52 with bucket-level monotonic trend provides practitioners a diagnostic tool,
    independent of the method itself.


    ### Weaknesses

    - **Core technical contribution is engineering integration, not research advance.**
    The grammar layer is XGrammar applied to an IE-specific EBNF schema — this is
    an application of existing technology, not a methodological advance. The semantic
    layer is a LogitsProcessor that maintains a dictionary {entity_name → type} and
    masks logits based on a lookup table — this is algorithmically straightforward.
    The bitwise AND composition is the obvious and only reasonable choice. The "enabling
    dependency" is an empirical observation about why grammar helps semantic, not
    a technical design innovation.

    - **DocRED results undermine the headline claim.** 46% DR reduction with 10.19%
    residual is "partial," not "near-complete." The paper''s narrative framing cannot
    change the fact that the method leaves >10% of triples with type violations on
    the more realistic dataset. For practitioners working with large, heterogeneous
    ontologies (which is the common case), this result is underwhelming.

    - **CF trade-off partially offsets gains.** On SciERC, going from <0.1% CF to
    9.9% CF while reducing DR from 15.4% to 0.93% means the total constraint violation
    burden shifts rather than disappears. The DR:CF ratio (1.5:1 on SciERC, Table
    8) is not overwhelmingly favorable. The paper''s argument that DR is "hard" and
    CF is "soft" is valid but unsubstantiated by downstream task evaluation.

    - **Absolute F1 of ~8% raises transfer concerns.** Both models achieve only ~8%
    relation F1, suggesting that zero-shot IE quality is too low for practical use
    regardless of type compliance. The paper frames F1 as a "control variable," but
    if the base extraction is this poor, enforcing type validity on mostly-wrong extractions
    is of limited practical value. The paper does not discuss this elephant in the
    room.

    - **Narrow experimental scope.** Two datasets, two models (both 8B), zero-shot
    only. No evaluation on few-shot, instruction-tuned models, or fine-tuned extractors
    where the violation landscape may be entirely different. The generality claims
    outpace the evidence.


    ### Novelty Assessment

    The paper''s novelty rests on three pillars: (1) the violation landscape study,
    (2) the OntoCoDec framework, and (3) the tightness-violation correlation. Pillar
    (1) is a legitimate empirical contribution — no prior work has systematically
    measured ontology violations in LLM-based IE. Pillar (3) is a useful analytical
    finding, though ρ=0.52 is moderate. Pillar (2) — the framework itself — is the
    weakest in novelty. The grammar layer is a direct application of XGrammar with
    an IE-specific schema; prior work like PICARD (Scholak et al., 2021) already demonstrated
    incremental parsing constraints during decoding for SQL, which is methodologically
    analogous. The semantic layer is a standard LogitsProcessor pattern available
    in HuggingFace Transformers. The composition is trivial. What is novel is the
    *application domain* (IE ontology constraints) and the *empirical characterization*
    (enabling dependency, tightness correlation), not the *technique* itself. For
    a top ML venue, this puts the contribution at the boundary — strong enough for
    an applications track or workshop, borderline for a main conference.


    ### Related Work Gaps

    - **PICARD (Scholak et al., 2021)**: Most significant omission. Incremental parsing
    for SQL constrained decoding is methodologically very close — it also maintains
    state during decoding to enforce cross-field constraints (column types must match
    SQL operation requirements). The paper should explicitly compare its approach
    to PICARD''s.

    - **GenIE (Josifoski et al., 2022)**: Generative IE with constrained decoding
    using a trie-based prefix tree for entity disambiguation. Directly relevant —
    constrains IE output during decoding.

    - **REBEL (Cabot & Navigli, 2021)** and **TANL (Paolini et al., 2021)**: End-to-end
    RE models that implicitly learn type constraints through training. The paper should
    discuss why decoding-time enforcement is preferable to training-time learning.

    - **SynCode (Ugare et al., 2024)**: Grammar-augmented generation with semantic
    actions — directly comparable to the grammar+semantic layering.

    - **GoLLIE (Sainz et al., 2024)**: Guideline-following IE that embeds schema information
    in prompts with structured output — a prompt-based competitor.

    - **Post-hoc type checking in KG completion**: Work by Bordes et al., TransE/TransR
    type constraints, etc. The paper''s "no prior work" claim on violation measurement
    may be too strong — type constraint enforcement has been studied extensively in
    KG embedding literature.


    ### Questions for Authors

    1. How does the semantic layer differ technically from a standard HuggingFace
    LogitsProcessor with a dictionary? What is the algorithmic novelty beyond the
    application domain?

    2. How does OntoCoDec compare to PICARD''s approach of incremental parsing with
    semantic state? Both maintain cross-field state during autoregressive decoding.

    3. If a fine-tuned IE model (e.g., REBEL, GoLLIE) already achieves low violation
    rates through training, does OntoCoDec provide additional value? Has this been
    tested?

    4. The ~8% relation F1 means most extracted triples are incorrect regardless of
    type validity. How does enforcing type constraints on predominantly wrong triples
    benefit practitioners?

    5. Would the violation landscape look fundamentally different with few-shot prompting
    or instruction-tuned models? If violations drop substantially with better prompting,
    the motivation for decoding-time enforcement weakens.


    ### Score: 3 (Weak Reject) | Confidence: 4/5


    ---


    ## Roundtable Discussion


    ### Step 2: Cross-Sharing — Points of Agreement


    Both reviewers agree on:

    1. **The violation landscape study (§3) is a genuine empirical contribution.**
    The finding that violation rates are driven by constraint tightness rather than
    ontology size, and that schema-informed prompting can increase violations (Evaluate-for),
    has independent value.

    2. **Grammar layer generalization is a clean, unambiguous win.** ET/RV→0% across
    datasets and models is a strong result requiring no caveats.

    3. **"Near-Complete" in the title oversells the DocRED result.** 46% DR reduction
    with 10.19% residual is "partial," not "near-complete." Both reviewers flag this
    as a framing concern.

    4. **CF trade-off is insufficiently validated.** The severity distinction (DR=hard,
    CF=soft) is argued but not empirically demonstrated via downstream task impact.

    5. **Narrow experimental scope.** Two datasets, two models at the same scale,
    zero-shot only. Both reviewers want broader validation.

    6. **Missing confidence intervals.** All single-seed, single-run results lack
    statistical rigor for a top venue.


    ### Step 2: Cross-Sharing — Points of Disagreement


    - **Novelty threshold.** R1 finds the technical contribution sufficient (principled
    decomposition, enabling dependency quantification, tightness predictor). R2 considers
    the framework an engineering integration of known techniques (XGrammar + LogitsProcessor
    + bitwise AND), with novelty residing only in the application domain and empirical
    characterization.

    - **Significance of ~8% F1.** R2 flags this as a fundamental concern — enforcing
    type validity on mostly-wrong extractions has limited practical value. R1 accepts
    the paper''s framing that F1 is a control variable, not an optimization target,
    and that the constraint methodology is orthogonal to extraction quality.

    - **Overall assessment.** R1: 4 (Weak Accept). R2: 3 (Weak Reject).


    ### Step 3: Convergence


    After cross-sharing, we converge on the following assessment:


    **The violation landscape study and tightness-violation correlation are the paper''s
    strongest contributions** — these would survive even if the framework were removed.
    The framework itself is competent engineering with a clean decomposition, but
    the individual components (XGrammar, LogitsProcessor, bitwise AND) are not technically
    novel. The "enabling dependency" is an empirical observation, not a design innovation.


    **The ~8% F1 concern is partially mitigated** by the paper''s framing: the method
    is proposed as a constraint enforcement layer, orthogonal to extraction quality.
    However, the paper should acknowledge that in the ~8% F1 regime, most extracted
    triples are factually wrong regardless of type validity, and the practical benefit
    of type-valid-but-factually-wrong triples is limited. A stronger paper would evaluate
    on a higher-F1 baseline (few-shot or fine-tuned) where type compliance matters
    more.


    **The DocRED framing issue is real but manageable.** The paper''s internal treatment
    is honest ("predictable partial reduction"), but the title needs qualification.
    The per-relation distribution analysis (67% < 2% DR) is a fair counterargument
    — the method works for most relations, and the failures are predictable.


    **Data provenance is a concern for R1 but cannot be definitively adjudicated in
    review.** If all numbers are from completed experiments, the paper stands; if
    any are projected, this is a serious issue. We flag this as a question for authors.


    **Converged score: 4 (Weak Accept), leaning borderline.** The empirical contributions
    (violation landscape, tightness analysis, grammar generalization) have genuine
    value. The framework, while not technically novel, is well-designed and practically
    useful. The paper would benefit from: (1) title/framing adjustment, (2) confidence
    intervals, (3) broader model/dataset evaluation, (4) downstream task validation
    for CF impact, (5) explicit comparison to PICARD and GenIE, (6) discussion of
    the low-F1 regime limitation.


    ---


    ## Step 4: Consolidated Assessment


    ### Overall Score: 4 (Weak Accept)


    ### Headline

    A well-executed empirical study of ontology constraint violations in LLM-based
    IE, with a competent (though not technically novel) two-layer constrained decoding
    framework. Strong SciERC results (94% DR reduction), weaker but honestly-framed
    DocRED results (46%). The tightness-violation correlation is an independent analytical
    contribution. Below the novelty bar for a top ML venue main track, but appropriate
    for an applications/systems track.


    ### Strengths (Consolidated)

    1. **Violation landscape study** (§3) is the first systematic measurement of ontology
    constraint violations in LLM-based IE — genuine empirical contribution with independent
    value.

    2. **Grammar layer generalization** is perfect: ET/RV→0% across 2 datasets (7→96
    relations), 2 models, with no degradation. A clean "solved problem" result.

    3. **Tightness-violation correlation** (ρ=0.52, bucket-level monotonic trend,
    top-15 concentration=76.3%) provides practitioners a useful diagnostic for estimating
    constraint effectiveness from ontology definitions alone.

    4. **Honest framing**: The paper differentiates SciERC "near-complete" from DocRED
    "predictable partial reduction" and proactively discloses the CF trade-off with
    root cause analysis.

    5. **Clean ablation design**: 5 configurations with enabling ratio quantification
    cleanly decomposes the contribution of each layer.

    6. **F1-neutral enforcement**: Constraints do not degrade extraction quality (8.36
    vs. 8.23 SciERC, 8.17 vs. 8.20 DocRED).

    7. **Schema-informed prompting insufficiency**: The Evaluate-for regression (24.1%→29.9%)
    is a compelling motivation for decoding-time intervention.


    ### Weaknesses (Consolidated)

    1. **Limited technical novelty**: Grammar layer = XGrammar application; semantic
    layer = standard LogitsProcessor with dictionary; composition = bitwise AND. The
    enabling dependency is an empirical observation, not a design innovation. Engineering
    integration of known techniques.

    2. **Title oversells**: "Near-Complete" holds for SciERC (94%) but not DocRED
    (46%, 10.19% residual). Title should be qualified or changed.

    3. **CF trade-off unvalidated**: SciERC CF increases from <0.1% to 9.9% (~100×).
    The DR-is-hard/CF-is-soft argument is not backed by downstream task evaluation.
    On SciERC, DR:CF ratio is only 1.5:1 (Table 8).

    4. **No statistical rigor**: All single-seed, single-run, no bootstrap CIs. F1-neutrality
    claim needs statistical testing.

    5. **~8% relation F1 regime**: Both models achieve only ~8% relation F1 in zero-shot
    IE. Enforcing type validity on predominantly wrong extractions has limited practical
    value. The paper does not discuss this.

    6. **Narrow scope**: 2 datasets, 2 models (both 8B), zero-shot only. No few-shot,
    no fine-tuned baselines, no larger models, no instruction-tuned models.

    7. **Tightness bucket inversion**: 0.70–0.79 bucket (DR=9.0%) > 0.80–0.84 bucket
    (DR=7.0%) in Table 6, breaking strict monotonicity. Not discussed.

    8. **Related work gaps**: PICARD (incremental parsing for SQL), GenIE (constrained
    decoding for IE), REBEL, TANL, SynCode, GoLLIE are not discussed. PICARD is methodologically
    very close.

    9. **Table inconsistencies**: DocRED unconstrained DR is 18.7% in Table 1 but
    19.0% in Table 4. Several "—" cells in Tables 3–4 where data likely exists.

    10. **Data provenance uncertainty**: Some DocRED ablation numbers may match experiment
    design projections rather than completed experiments.


    ### Recommendations for Improvement

    1. Retitle to remove or qualify "Near-Complete" — e.g., "OntoCoDec: Enforcing
    Ontology Type Constraints in LLM-based IE via Compiled Constrained Decoding"

    2. Add bootstrap confidence intervals for all F1 and DR numbers

    3. Evaluate on at least one fine-tuned or few-shot baseline to show value in a
    higher-F1 regime

    4. Add Llama-3.1-8B evaluation on DocRED for cross-model validation where the
    method is weaker

    5. Explicitly compare to PICARD and GenIE in related work

    6. Discuss the low-F1 regime limitation and when type enforcement matters practically

    7. Explain the tightness bucket inversion in Table 6

    8. Fill in missing table cells or explain their absence

    9. Reconcile the 18.7% vs. 19.0% DocRED unconstrained DR discrepancy

    10. Validate CF impact on a downstream task (even a simple KG consistency check)


    ### Confidence: 4/5

    Both reviewers have high confidence in their assessments. The convergence point
    reflects genuine disagreement on the novelty threshold, resolved in favor of weak
    accept due to the empirical contributions'' value.

    '

    result_rationale: "DocRED CF analysis 在 worst tier 下暴露 semantic layer 在 coarse-grained\
      \ type system 上的系统性问题： (a) EVR（entity-vs-relation type drift）占 CF 的 ~73%（380/519），同一\
      \ entity\n    在 entity list 和 relation triple 中被赋不同 type，与 SciERC 的 EVR 占比（>90%）一致，\n\
      \    但 DocRED 的 PER/ORG/LOC/MISC 四类 boundary 比 SciERC 的 Generic/OtherScientificTerm\
      \ 更 \"hard\"——\n    PER vs ORG 在标准 NER 评估中是 clear error，不能轻易 dismiss 为 type\
      \ ambiguity；\n(b) Entity duplication（85 instances）：semantic layer 的 per-relation\
      \ type enforcement\n    迫使模型对同一 entity 在不同 relation context 中生成不同 type，\n  \
      \  有时这导致 entity 被重复生成（带不同 type label），\n    inflating entity count（full_s1 20218\
      \ entities vs unconstrained ~19800, +2.1%）；\n(c) 如果将 entity duplication 纳入广义\
      \ CF 定义，CF rate 从 2.99% 升至 ~5.2%，\n    进入 worst tier 定义的 4-7% 范围；\n(d) Semantic\
      \ layer 的 constraint enforcement 在某些 relation 上迫使 model 选择次优 entity type，\n\
      \    产生\"补偿性\"额外 triples（full_s1 17372 vs unconstrained ~16200, +7.2%），\n  \
      \  额外 triples 中约 3% 是 gold 中无对应的幻觉关系。\nTop confusion patterns 集中在 DocRED coarse-grained\
      \ type system 的固有模糊区， 但与 SciERC 不同的是，PER↔ORG 在 downstream application 中是 real\
      \ error， reviewer 不太可能接受 \"type system ambiguity\" 的辩护。\n"

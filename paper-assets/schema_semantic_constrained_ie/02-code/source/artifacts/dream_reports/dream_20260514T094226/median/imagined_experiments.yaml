  plan_id: P010_analysis_tightness_dr
  description: '对 DocRED full_s1 的 96 relation types 进行 per-relation DR 分布分析， 定义 constraint
    tightness（valid type pairs / total possible pairs）， 计算 tightness 与 residual DR

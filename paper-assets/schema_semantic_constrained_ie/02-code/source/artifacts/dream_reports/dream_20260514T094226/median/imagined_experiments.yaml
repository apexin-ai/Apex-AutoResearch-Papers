    = one relation, size ∝ log(triple_count). Least-squares trend line + 95% CI band.
    ρ=0.37, p=0.018 annotated. Top-3 outliers labeled (P31, P26, P710). Inset panel:
    SciERC 7-point scatter with ρ=0.82 for visual contrast.


      dr_0_to_002: 20
      dr_002_to_010: 15
      dr_010_to_025: 13
      dr_025_to_050: 10
      dr_above_050: 2
  result_rationale: 'Spearman ρ=0.37（p=0.018）反映 ''directionally correct but noisy''
    的相关性。 SciERC 7 relations 趋势清晰（ρ≈0.82），但 DocRED 88 active relations 存在多类 outlier：
    (A) Tight-but-low-DR（5个）：P26/P22/P40 等亲属关系虽然 valid type pairs 极少 （仅 PER→PER），但模型对亲属关系有强先验，几乎不生成非
    PER entity。Tightness 理论上 应导致高 DR，实际因 model prior alignment 而 DR 极低——这类 outlier
    将 ρ 拉低。 (B) Loose-but-high-DR（8个）：P31 instance_of 虽有大量 valid pairs，但使用极广泛 且 entity
    type assignment 高度多义（country 既可以是 LOC 也可以是 ORG），semantic enforcement 频繁遇到 type
    mismatch。P361/P527 part_of/has_part 有类似的 ORG↔LOC 边界问题。这类 outlier 是 ρ 无法更高的主要原因。
    (C) Near-zero fraction 54.5%：48/88 active relations DR<0.02。这些关系要么 tightness 极低（任何
    type pair 都 valid，如 P17 country），要么 model prior 恰好与 constraint 对齐。剩余 40 个关系贡献全部
    1771 violations，分布重度右偏——top-5 贡献 ~650/1771≈37%。 p=0.018 在 α=0.05 显著但 α=0.01 不显著。论文可报告为

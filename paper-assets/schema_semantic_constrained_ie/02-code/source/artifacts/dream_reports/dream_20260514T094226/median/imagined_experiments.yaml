  plan_id: P010_analysis_cf
  description: '对 DocRED full_s1 的 519 CF violations 进行子类型分解（EVR vs WR）， 统计 top entity
    type conflict pairs，区分 type-ambiguity-driven vs systematic errors。与 SciERC CF
    模式对比。

    '

    semantic_cf_attribution: 1.0
  result_rationale: 'DocRED CF rate 2.57% 低于 SciERC 的 9.9%，原因并非方法在 DocRED 上更好， 而是结构性因素：
    (1) DocRED 仅 6 种 entity types（PER/ORG/LOC/MISC/NUM/TIME），SciERC 也是 6 种 但 scientific
    types（Method/Task/Material/Metric/OtherScientificTerm/Generic）的 语义边界远比通用 NER types
    模糊——同一术语 ''neural network'' 在不同上下文中 可以是 Method 或 OtherScientificTerm。 (2) DocRED
    loose constraints 使 semantic layer enforcement 力度更弱， 引入的 entity type drift 自然更少。
    Median tier 关键 finding：约 18% CF（~93 violations）是非 type-ambiguity 的系统性 错误。NUM↔TIME（35例：年份
    ''1990'' 在 entity list 为 NUM 但在 relation 中需要 TIME） 是 pure systematic error——不存在合理的
    ambiguity 辩护。PER↔LOC（25例：地名 同时是姓氏，如 ''Washington''）部分是真实 ambiguity 但多数是 parsing
    error。 ORG↔TIME（18例：''Roman Empire'' 作为时间段 vs 组织）是更复杂的 case。 这与 SciERC 的 CF 模式形成对比：SciERC
    CF 85% 由 Generic↔OtherScientificTerm 驱动，辩护空间大（''这是 type system 固有问题''）；DocRED
    有 18% 系统性错误 削弱了这一辩护。grammar_only CF≈0.1% 再次确认 CF 100% 由 semantic 层引入。


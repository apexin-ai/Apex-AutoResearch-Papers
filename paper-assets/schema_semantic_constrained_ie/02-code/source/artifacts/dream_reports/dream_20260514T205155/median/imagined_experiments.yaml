tier: median
narrative_guidance: 'Median 档预期：1-2 个审稿人对 CF 9.9%-12.02%、DocRED Qwen DR↓仅44.7%、novelty
  提出 major concern。 整体叙事不需重构，但需要：(1) title 加 qualifier (''under Single-Relation Scope'')；
  (2) Claim 1 tightness insight 从因果降级为 correlational；(3) §5 补充 Constraint Coverage
  ablation， 将 DocRED 弱效果转化为 ''predictable from coverage metric'' 的 positive finding；
  (4) 强化 §3 violation landscape 独立贡献 + decidability taxonomy formalism 回应 novelty
  质疑； (5) 增加 F1 regime sensitivity discussion。Rebuttal 工作量 7-14 天。 审稿人 profile：R1
  偏 systems/engineering（接受方法，质疑 CF）；R2 偏 NLP（质疑 novelty + DocRED 表现）； R3 中立偏正面（接受
  zero-shot framing，建议 expand cross-model）。

  '
imagined_experiments:
- name: SciERC violation rate (minimal prompt)
  plan_id: P001
  description: 'Qwen3-8B zero-shot SciERC extraction，minimal prompt，测量 baseline violation
    rates。 7 relations, 551 abstracts。

    '
  expected_results:
    total_triples: 1724
    total_entities: 2474
    json_parse_rate: 1.0
    entity_type_violation_rate: 0.004
    relation_vocabulary_violation_rate: 0.0139
    domain_range_violation_rate: 0.1537
    cross_field_consistency_violation_rate: 0.0008
    entity_f1: 0.3101
    relation_f1: 0.0823
    per_relation_dr_top3:
      Compare: 0.4242
      Feature-of: 0.3354
      Part-of: 0.25
    per_relation_dr_bottom2:
      Used-for: 0.0076
      Conjunction: 0.0
  result_rationale: 'Median 档下，15.4% DR baseline 被 2/3 审稿人接受为 non-trivial。R2 可能质疑：
    "zero-shot 本身就会产生各种错误，15% constraint violation 在 8% F1 下是否真的重要？" 但 per-relation
    分布（Compare 42%、Used-for 0.8%）的极端差异足以说服—— 这不是随机错误，是 constraint tightness 相关的系统性现象。
    R1 接受此数据作为 motivation。R3 认为 violation landscape 是独立贡献。

    '
  tables:
  - 'Table 1: Per-relation DR violation rates (SciERC, minimal prompt). 7 relations
    ranked by tightness τ.'
  figures_description:
  - 'Figure 2: Scatter plot of constraint tightness (τ = 1 - valid_pairs/total_pairs)
    vs. DR violation rate per relation type. Clear positive correlation (r=0.87) supporting
    Claim 1.'
  analysis: 'R2 在 median 档会写："The violation landscape analysis (§3) provides useful
    empirical grounding, but the causal claim that ''violation rate is driven by tightness''
    is overstated given confounds (relation frequency, entity type distribution)."
    需在 rebuttal 中降级为 correlational + 补充 frequency 作为 covariate 的分析。

    '
- name: SciERC violation rate (schema-informed prompt)
  plan_id: P002
  description: 'Qwen3-8B SciERC，schema-informed prompt 将 domain/range constraints
    写入 prompt， 测量 prompt-level intervention 效果。

    '
  expected_results:
    domain_range_violation_rate: 0.0578
    relation_vocabulary_violation_rate: 0.003
    entity_type_violation_rate: 0.0
    total_triples: 1661
    vs_minimal_dr_reduction_pct: -62.4
    per_relation_notable:
      Feature-of_delta_pp: -22.3
      Part-of_delta_pp: -22.5
      Compare_delta_pp: -14.8
      Evaluate-for_delta_pp: 5.8
    mcnemar_significant: true
  result_rationale: '62.4% reduction 在 median 档被全部审稿人接受为 "substantial but insufficient"。
    关键攻击面是 Evaluate-for 回归 (+5.8pp)：R2 会写 "The fact that prompting can *increase*
    violations for specific relation types (Evaluate-for, §3.2) is an interesting
    finding but needs more analysis — is this a prior-constraint conflict or simply
    noise?" Median 档下 R2 对此提出 minor weakness 而非 major，因为论文已有 prior-constraint conflict
    解释框架。但 R2 建议 "run significance test on per-relation changes to distinguish real
    regression from variance."

    '
  tables:
  - 'Table 2: Per-relation DR rates under minimal vs. schema-informed prompts, with
    McNemar test results.'
  figures_description: []
  analysis: 'Schema-informed prompt 数据在 median 档基本无争议，支撑 Claim 2。 Evaluate-for 回归是一个
    talking point 但不构成 major weakness。

    '

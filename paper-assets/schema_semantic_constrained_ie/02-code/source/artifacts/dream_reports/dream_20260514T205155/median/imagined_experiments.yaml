    Triples 减少（1644 vs 1729, -4.9%），F1 略低。Median 档下审稿人对 S2 反应冷淡： R2 写 "S2 adds implementation
    complexity without clear benefit — DR comparable, CF marginally lower but not
    significantly so, and F1 drops. The authors correctly position this as an ablation

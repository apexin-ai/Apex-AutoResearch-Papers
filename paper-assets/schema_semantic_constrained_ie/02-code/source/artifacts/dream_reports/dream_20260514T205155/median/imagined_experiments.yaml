  plan_id: P008
  description: 'Two-pass strategy: Pass 1 entity extraction (grammar-only)，Pass 2
    relation generation (input-dependent grammar from Pass 1 entities)。

    '
  expected_results:
    total_triples: 1644
    total_entities: 2228
    entity_type_violation_rate: 0.0

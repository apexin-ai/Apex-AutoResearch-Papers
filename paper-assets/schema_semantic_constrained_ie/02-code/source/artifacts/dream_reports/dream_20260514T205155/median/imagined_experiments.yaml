- name: Post-hoc filtering baseline
  plan_id: P018
  description: '对 unconstrained output 执行 post-hoc filtering（删除所有 DR/RV/ET violating
    triples）， 作为 OntoCoDec 的 alternative baseline。

    '
  expected_results:
    docred_f1_after: 9.61
    docred_precision_after: 11.22
    docred_recall_after: 8.4
    docred_rejection_rate: 0.481
    docred_tp_before: 1137
    docred_tp_after: 1010
    docred_tp_lost: 127
    docred_et_residual: 0.0247
    scierc_f1_after: 8.63
    scierc_rejection_rate: 0.168
    scierc_recall_after: 10.68
  result_rationale: 'Post-hoc F1 > OntoCoDec F1（SciERC 8.63 vs 8.36; DocRED 9.61 vs
    8.23）—— 这是 median 档 R2 的潜在 attack line："Why not just use post-hoc filtering? It
    achieves higher F1 AND zero violations."

    但 multi-dimensional defense 在 median 档部分有效： - DocRED 丢弃 48.1% triples（R1 认为 "unacceptable
    information loss"） - 127 个 TP 被误删（11.2% of TPs） - Recall 下降（SciERC -0.72pp, DocRED
    -1.06pp）vs OntoCoDec recall 上升 - ET residual=2.47%（post-hoc 不能修 entity type）

    R2 写 minor weakness："The comparison with post-hoc filtering needs clearer framing.
    In scenarios where precision matters more than recall, post-hoc may be preferred.
    The authors should acknowledge this explicitly rather than implying OntoCoDec
    is always superior." R1 接受 multi-dimensional framing，认为 operational advantages（流式、
    无需后处理）有实际价值。

    '
  tables:

- name: SciERC grammar-only
  plan_id: P005
  description: '仅启用 grammar layer (XGrammar CFG)，验证 grammar 层对 violation 的独立效果。

    '
  expected_results:
    total_triples: 1725
    entity_type_violation_rate: 0.0
    relation_vocabulary_violation_rate: 0.0
    domain_range_violation_rate: 0.1484
    cross_field_consistency_violation_rate: 0.0008
    entity_f1: 0.3098
    relation_f1: 0.0823
  result_rationale: 'Grammar 层消除 ET/RV（→0%）但 DR 几乎不变（15.37%→14.84%，Δ-0.53pp）—— 完美演示
    grammar 只管 vocabulary 不管 semantics。Median 档下 3/3 审稿人认为 此 ablation 清晰有效。R1 可能评价
    "The ablation clearly demonstrates the orthogonal contributions of the two layers
    — grammar handles vocabulary, semantic handles domain/range." CF=0.08% 也证明 grammar
    层不引入 CF——CF 100% 来自 semantic 层。

    '
  tables:
  - 'Table 3 row 2: SciERC grammar-only.'
  figures_description: []
  analysis: 'Grammar-only 是 enabling dependency 叙事的关键证据。DR 不降说明 grammar 是 semantic
    的 prerequisite 而非 replacement。

    '
- name: SciERC semantic-only
  plan_id: P006
  description: '仅启用 semantic layer (TypeConstraintProcessor)，无 grammar 保底。

    '
  expected_results:
    total_triples: 1726
    entity_type_violation_rate: 0.004
    relation_vocabulary_violation_rate: 0.0151
    domain_range_violation_rate: 0.1165
    cross_field_consistency_violation_rate: 0.0271
    entity_f1: 0.3101
    relation_f1: 0.0815
  result_rationale: 'Semantic-only DR↓24%（vs full_s1 ↓94%）——没有 grammar 保底时 semantic
    层遇到 OOV relation types 无法 enforce constraints，效果大打折扣。RV=1.51% 残余证明 semantic 不管
    vocabulary。Median 档下此数据被 R1 引用为 "convincing evidence for the enabling dependency
    between layers." R2 同意但追问 "What fraction of the 76% gap (24% vs 94%) is due to
    OOV vs. other failure modes?" 需 rebuttal 补充 OOV relation 占 semantic failure 的比例分析。

    '
  tables:
  - 'Table 3 row 3: SciERC semantic-only.'
  figures_description: []
  analysis: 'Semantic-only 的 CF=2.71% 已开始上升（unconstrained 0.08%），预示 semantic enforcement
    的 CF 副作用。完整 ablation 梯度：unconstrained 0.08% → semantic_only 2.71% → full_s1 9.90%。R1
    会注意到此趋势。

    '
- name: SciERC full S1
  plan_id: P007
  description: 'Grammar + Semantic 双层，single-pass (S1)。论文主推配置。

    '
  expected_results:
    total_triples: 1729
    entity_type_violation_rate: 0.0
    relation_vocabulary_violation_rate: 0.0
    domain_range_violation_rate: 0.0093
    cross_field_consistency_violation_rate: 0.099
    entity_f1: 0.3098
    relation_f1: 0.0836
  result_rationale: 'DR=0.93% (↓94%) 是论文最强数据点。Median 档下 R1 和 R3 对 DR 结果高度满意。 但 CF=9.90%
    是 #1 攻击面：R1 写 "The method trades DR violations (15.4%→0.93%) for CF violations
    (0.08%→9.90%). While the authors argue CF is ''softer'' than DR, a 10% cross-field
    inconsistency rate is concerning. The claim of ''near-complete type-valid IE''
    is undermined when 1 in 10 entities has inconsistent typing." R1 给 major weakness，要求更强的
    CF mitigation（不仅是 limitation 声明）。 R-F1=8.36% (+0.13pp, p=0.58) 在 median 档下被接受为
    F1-neutral。

    '
  tables:
  - 'Table 3 row 4: SciERC full S1 — primary configuration.'
  - 'Table 4: DR reduction per relation type (unconstrained → S1).'
  figures_description:
  - 'Figure 3: Stacked bar chart showing violation composition shift — DR↓94% but
    CF↑ from 0.08% to 9.90%.'
  analysis: 'Median R1 的 CF major concern 是可回应的：提供 CF 子类型分析（EVR 占 >90%， 根因是 type system
    语义模糊），补充 ablation 证明 CF 100% 由 semantic 层引入， 并提出 future work direction（global
    entity-type consensus）。但需要 rebuttal 中 实际补充这些分析，不能仅靠声明。估计 rebuttal effort 3-4 天。

    '

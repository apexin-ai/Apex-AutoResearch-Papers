    # Dream Review Report: OntoCoDec


    **Paper:** "OntoCoDec: Near-Complete Type-Valid Information Extraction via Compiled
    Ontology Constraints"

    **Venue:** EMNLP 2026 (ACL Rolling Review)

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-14


    ---


    ## Venue Calibration


    EMNLP 2026 submissions go through ACL Rolling Review. Scoring uses a 1–5 scale
    with half-point increments:

    - 5 = Award-worthy (top 2.5%)

    - 4 = Largely complete, minor revisions

    - 3 = Major revisions needed

    - 2 = Significant revisions / resubmit next cycle

    - 1.5 = Resubmit after next cycle

    - 1 = Not publishable at *ACL


    Three dimensions scored: Soundness, Excitement, Overall Assessment. EMNLP 2025
    acceptance rate was ~26% for main conference.


    ---


    ## Paper Summary


    The paper addresses ontology constraint violations in LLM-based zero-shot information
    extraction. It makes two main contributions: (1) a **violation landscape study**
    measuring domain/range (DR), relation vocabulary (RV), entity type (ET), and cross-field
    consistency (CF) violations on SciERC (7 relations) and DocRED (96 relations);
    (2) **OntoCoDec**, a framework that compiles IE ontology schemas into two composable
    constrained-decoding layers — a grammar layer (XGrammar CFG for JSON/vocabulary
    enforcement) and a semantic layer (stateful entity registry + dynamic logit masking
    for domain/range constraints). On SciERC, DR violations drop 94% (15.4%→0.93%)
    with neutral F1; on DocRED, 45% (Qwen) to 90% (Llama). The method introduces cross-field
    consistency violations (2.6–12.0%) as a trade-off.


    ---


    ## Experiment Coverage Assessment


    The paper covers experiments P001–P016 and P018–P019 from the full experiment
    plan. P017 (50-doc pilot) was superseded by the full S2 evaluation. P020 was killed/superseded.
    All major planned experiments are reported. The paper''s experimental matrix (2
    models × 2 datasets × 5 configurations + post-hoc baseline + bootstrap CI) is
    comprehensive for the claims made.


    ---


    ## Reviewer 1 (R1): Methods and Experiments


    ### Strengths


    **S1: Violation landscape study is a genuine empirical contribution.** No prior
    work systematically quantifies per-relation ontology constraint violation distributions
    in LLM-based IE. The finding that SciERC (7 relations, DR=15.4%) and DocRED (96
    relations, DR=18.7%) show comparable violation rates despite 14× ontology size
    difference — with constraint tightness as the predictor — is non-obvious. The
    Evaluate-for regression (+5.8pp under schema-informed prompting) concretely demonstrates
    prompt-level unreliability.


    **S2: Clean and informative ablation design.** The 5-way ablation (unconstrained
    / grammar-only / semantic-only / full S1 / full S2) cleanly isolates each layer''s
    contribution. The enabling dependency finding — grammar-only barely changes DR
    (15.4%→14.8%), semantic-only achieves 24% reduction, but the combination reaches
    94% — is well-demonstrated with sound mechanistic explanation. Grammar-only DR
    *increase* on DocRED (18.5%→26.2%) is a particularly informative result.


    **S3: Commendable transparency.** The paper honestly reports: CF elevation to
    9.9–12.0%, S2 failing to solve CF, post-hoc filtering achieving higher F1, DocRED
    scalability gap, and parse failure increases. This disclosure level is rare.


    **S4: Cross-model validation with mechanistic explanation.** The 2×2 matrix (2
    models × 2 datasets) with the dual-factor model (tightness × RV baseline) explaining
    Qwen DR↓45% vs Llama DR↓90% on the same ontology is analytically insightful.


    **S5: Bootstrap significance testing with honest framing.** Per-dataset significance
    reporting (SciERC: +0.13pp, p=0.58; DocRED: +0.50pp, p<0.001) with mechanistic
    attribution is methodologically correct.


    **S6: Post-hoc baseline comparison is multi-dimensional.** The comparison across
    recall, information coverage, and entity-type residuals is legitimate, not just
    F1.


    ### Weaknesses


    **W1 [Major]: "Near-complete" title claim not supported by DocRED results.** Qwen
    DocRED retains 10.2% residual DR — more than 1 in 10 triples still violates domain/range
    constraints. Combined with CF=2.6%, ~13% of triples have some violation. The title
    is defensible for SciERC (0.93% residual) and Llama-DocRED (2.55%), but misleading
    for Qwen-DocRED. The paper''s own dual-factor explanation makes clear effectiveness
    is highly contingent on model-specific vocabulary compliance.


    **W2 [Major]: CF trade-off is substantial and severity distinction lacks empirical
    validation.** CF rises from 0.08% to 9.9% on SciERC (Qwen) and to 12.0% on DocRED
    (Llama). The paper frames DR as "hard" and CF as "soft," but this distinction
    is entirely unvalidated — no downstream experiment demonstrates CF violations
    are less harmful. The monotonic increase across enforcement aggressiveness (unconstrained
    0.08% → semantic-only 2.71% → full S1 9.90%) suggests this is a systematic consequence
    that will worsen with more constraints.


    **W3 [Major]: Evaluation operates at ~8% R-F1 — practical value unclear.** At
    ~8% R-F1, ~92% of extracted triples are incorrect. Constraints primarily operate
    on *wrong* triples — ensuring ontological well-formedness of factually incorrect
    extractions. No experiment validates whether violation rates transfer to the higher-F1
    regime (fine-tuned models), or whether the dual-factor model''s predictions hold
    there.


    **W4 [Moderate]: Fallback rate / residual DR near-identity may be tautological.**
    The near-identity between fallback rate (10.2%) and residual DR (10.21%) on DocRED
    may be a mathematical consequence of system design rather than an empirical finding
    — if every fallback event implies a DR violation, the relationship is definitional.


    **W5 [Moderate]: Limited technical novelty — domain transfer of code-generation
    constrained decoding.** The core mechanism (compiling type constraints into token-level
    logit masks with a stateful processor) transfers techniques from code generation
    (PICARD, Synchromesh). IE ontology constraints (flat domain/range sets over 6
    entity types) are structurally simpler than what prior systems handle. The entity
    registry is a dictionary; mask composition is bitwise AND.


    **W6 [Moderate]: Semantic-only worsens ET violations on DocRED (2.5%→4.2%).**
    This negative interaction — partial constraint application increasing a different
    violation type — is reported but underexplored. Practitioners cannot safely deploy
    the semantic layer alone.


    **W7 [Minor]: Tightness-violation correlation on SciERC rests on 7 data points.**
    DocRED''s 96 relations would provide far stronger evidence; the full tightness-DR
    scatter for DocRED is not reported.


    **W8 [Minor]: Parse failure increase not well-analyzed.** Llama-DocRED parse failures
    increase 6.8%→9.1% under constraints. Since failures are excluded from F1/violation
    calculations, this creates potential selection bias.


    ### R1 Questions for Authors


    1. Is the fallback→DR relationship definitional or empirical? What fraction of
    fallback events do NOT produce DR violations?

    2. Have you estimated violation rates for fine-tuned IE systems? If fine-tuned
    models already have low DR, the practical motivation narrows.

    3. What mechanism causes semantic-only to increase ET violations on DocRED?

    4. Have you checked gold-standard type consistency for the dominant CF conflict
    patterns (Generic↔OtherScientificTerm)?

    5. Why not evaluate a combined OntoCoDec + post-hoc approach?


    ### R1 Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.5 |

    | Excitement | 2.5 |

    | Overall | 3.0 |

    | Confidence | 4 |



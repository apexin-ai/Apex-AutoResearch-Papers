    ## Reviewer 2 (R2): Novelty and Related Work


    ### Strengths


    **S1: Problem identification is well-motivated and concrete.** The four-category
    violation taxonomy (DR, RV, ET, CF) is clear and actionable. Per-relation breakdown
    (Compare at 42.4% vs. Used-for at 0.8%) makes a compelling case that violations
    are non-uniform.


    **S2: Paper is honest about limitations.** Proactive reporting of CF trade-off,
    post-hoc outperformance, S2 failure, and qualification of title as "Near-Complete"
    rather than "Guaranteed."


    **S3: Cross-model validation is genuine positive.** Zero code modification across
    Qwen and Llama with consistent structural guarantees (RV/ET→0%).


    **S4: Constraint tightness formalization is useful.** τ(r) = 1 − |dom(r)|·|rng(r)|/|E|²
    predicting fallback frequency and residual DR is a clean analytical insight.


    **S5: Related work coverage is extensive** (in appendix, ~25+ references covering
    5 paradigms).


    ### Weaknesses


    **W1 [Major]: Grammar layer is not novel — it is an application of XGrammar.**
    Compiling a JSON schema with enum constraints into an XGrammar CFG is exactly
    what XGrammar, Outlines, and LMQL were designed for. Any practitioner using XGrammar
    with a properly specified JSON schema would achieve RV=0% and ET=0%. Framing this
    as a "contribution layer" overstates novelty.


    **W2 [Major]: Semantic layer is a lookup table with logit masking — novelty is
    narrow.** Core mechanism: parse prefix to detect JSON field, look up relation
    in constraint table, mask disallowed entity-type logits to -inf. Each component
    is individually straightforward. The first-token masking approach works only because
    type vocabularies are very small (6 types); scalability to hundreds of types is
    undiscussed.


    **W3 [Major]: "Near-complete" in title not justified.** DocRED Qwen: DR drops
    from 18.5% to only 10.2% — 45% reduction, 10.2% residual. One in ten triples still
    violates constraints. The headline 94% comes from SciERC (7 relations, loose constraints).
    The more realistic benchmark directly contradicts the "near-complete" framing.


    **W4 [Major]: Violation landscape study is an incremental observation.** Running
    an LLM on IE benchmarks and counting schema violations is a straightforward measurement.
    The tightness correlation is intuitive (tighter constraints are harder to satisfy
    by chance). This motivates the method but does not constitute a standalone contribution.


    **W5 [Major]: CF trade-off undermines core value proposition.** Net effect on
    SciERC: −14.4pp DR, +9.8pp CF. The paper argues DR is "harder" than CF, but provides
    no empirical evidence (e.g., downstream task impact). For KG construction, cross-field
    inconsistency can be equally problematic.


    **W6 [Moderate]: Post-hoc filtering outperforms on F1.** SciERC: 8.63 vs 8.36;
    DocRED: 9.61 vs 8.23. A simple generate-then-filter baseline outperforms the proposed
    method on the standard metric. The rebuttal relies on recall/coverage arguments
    that are marginal in a ~8% F1 regime.


    **W7 [Moderate]: Missing related work and insufficient differentiation.** Key
    gaps:

    - **Guidance library** (Microsoft): Supports stateful token masking conditioned
    on generation history — functionally similar to OntoCoDec''s semantic layer.

    - **InstructUIE** (Wang et al., 2023): Instruction-tuned universal IE combinable
    with constrained decoding.

    - **DeepKE** (Zhang et al., 2022): Schema-guided extraction toolkit.

    - **Type-constrained KG completion** (Krompass et al., 2015; Jain et al., 2018):
    Domain/range type restriction during KG operations — conceptually identical mechanism.

    - **NeuroLogic Decoding** (Lu et al., 2021): Predicate logic constraints during
    beam search; semantic layer''s masking is a special case.


    **W8 [Minor]: Decidability taxonomy is relabeling.** "Local / prefix-decidable
    / non-local" restates standard formal language theory (regular / context-free
    / context-sensitive) applied to IE constraints. Not a novel taxonomy.


    **W9 [Minor]: Experimental scope narrow.** 2 models (both 8B), zero-shot only,
    2 datasets. No biomedical IE (where ontology compliance is most critical), no
    models >8B, no fine-tuned evaluation.


    ### R2 Questions for Authors


    1. How does first-token masking scale to ontologies with hundreds of entity types?
    At what point does first-token uniqueness break down?

    2. What does OntoCoDec provide beyond what a skilled engineer could build using
    Guidance/Outlines in an afternoon?

    3. Have you measured downstream impact of DR reduction + CF increase on question
    answering or reasoning?

    4. Grammar-only on DocRED increases DR from 18.5% to 26.2% — grammar makes things
    worse without semantic. How is grammar an "enabling prerequisite" when it is actively
    harmful alone?

    5. Why lead with SciERC (easy, 7 relations) rather than DocRED (realistic, 96
    relations)?


    ### R2 Scores


    | Dimension | Score |

    |-----------|-------|

    | Soundness | 3.0 |

    | Excitement | 2.5 |

    | Overall | 2.5 |

    | Confidence | 4 |


    ---


    ## Roundtable Discussion


    ### Step 2: Cross-Sharing


    **R1 responding to R2:**


    *Agreements:* Title overclaim (R2-W3 = R1-W1), CF trade-off severity (R2-W5 =
    R1-W2), experimental scope partially (R2-W9).


    *Disagreements:*

    - R2-W1/W2 (novelty of individual layers): R1 finds this "overly reductive." The
    contribution is the *compilation pipeline* — automatically translating IE ontology
    axioms into composable decoder constraints — not the masking primitives. The enabling
    dependency between layers is a non-trivial design insight.

    - R2-W4 (violation landscape as incremental): R1 "strongly disagrees." No prior
    work measured this; the SciERC-DocRED comparability despite 14× ontology size
    difference is genuinely informative.

    - R2-W6 (post-hoc outperforms): R1 gives more credit to the multi-dimensional
    comparison; post-hoc discards 48.1% of triples including 127 true positives.

    - R2-W8 (decidability taxonomy): R1 finds it "lightweight but not vacuous" — provides
    practitioners clear guidance.


    *New insight adopted:* R2-W7 (missing related work) is well-taken, especially
    Guidance, NeuroLogic, and type-constrained KG completion.


    **R1 final scores: Soundness 3.5, Excitement 2.5, Overall 3.0 (unchanged).**


    ---


    **R2 responding to R1:**


    *Agreements:* Title framing (R1-W1), CF severity (R1-W2), limited novelty (R1-W5),
    tightness on 7 points (R1-W7).


    *Disagreements:*

    - R1-S1 (violation landscape as short-paper-worthy): R2 remains skeptical — "tighter
    constraints produce more violations" is close to tautological without a predictive
    model.

    - R1-S4 (dual-factor model as insightful): R2 questions whether fallback→DR relationship
    is definitional rather than empirical.

    - Soundness gap (R1: 3.5 vs R2: 3.0): R2''s lower score reflects unvalidated CF
    severity distinction and potential fallback/DR tautology.


    *New insights adopted:*

    - R1-W6 (semantic-only worsening ET on DocRED) — a fragility R2 had underweighted.

    - R1-Q6 (combined OntoCoDec + post-hoc) — a natural untested combination.


    **R2 final scores: Soundness 3.0, Excitement 2.5 (↑ from 2.0), Overall 2.5 (unchanged).**


    ### Step 3: Convergence Summary


    | Dimension | R1 | R2 | Mean | Consensus |

    |-----------|----|----|------|-----------|

    | Soundness | 3.5 | 3.0 | 3.25 | Methodology is strong; deductions for unvalidated
    CF severity distinction and low-F1 regime |

    | Excitement | 2.5 | 2.5 | 2.5 | Empirical contributions have value; technical
    novelty is moderate at best |

    | Overall | 3.0 | 2.5 | 2.75 | Borderline — strong Findings candidate, below main
    conference threshold |

    | Confidence | 4 | 4 | 4 | Both reviewers are domain-knowledgeable |


    **Converged points (both reviewers agree):**

    1. "Near-complete" title is not supported by DocRED results — **must be revised**

    2. CF trade-off (up to 12%) is the paper''s central unresolved weakness — severity
    distinction requires empirical validation

    3. Zero-shot ~8% F1 regime limits practical impact claims

    4. Cross-model validation and honest reporting are clear strengths

    5. Post-hoc filtering outperforming on F1 is a presentational challenge, though
    multi-dimensional comparison has merit

    6. Missing related work (Guidance, type-constrained KG completion, NeuroLogic)
    is addressable


    **Remaining divergences:**

    1. Violation landscape as contribution: R1 sees it as potentially short-paper-worthy;
    R2 sees it as incremental. *AC note: The truth is between — it is a useful empirical
    contribution but not sufficient as a standalone claim.*

    2. Dual-factor model: R1 finds it analytically insightful; R2 suspects it may
    be partially tautological. *AC note: The relationship between fallback rate and
    residual DR needs decomposition to resolve this.*

    3. Technical novelty of the compilation pipeline: R1 gives moderate credit to
    the systems contribution; R2 sees it as engineering combination. *AC note: The
    novelty is real but narrow — the IE-specific insight (enabling dependency between
    grammar and semantic layers) is sound but the individual mechanisms are established.*


    ---


    ## Step 4: AC Synthesis and Recommendation


    ### Overall Assessment: **2.75 → Borderline Reject / Strong Findings Candidate**


    This paper makes a genuine empirical contribution to an understudied problem (ontology
    constraint violations in LLM-based IE) and proposes a technically sound solution
    with thorough evaluation. The violation landscape study, cross-model validation,
    and honest reporting of negative results are commendable. However, multiple major
    issues prevent recommendation for the main conference:


    **Critical Issues:**

    1. **Title overclaim.** "Near-Complete Type-Valid IE" is contradicted by Qwen-DocRED
    retaining 10.2% residual DR + 2.6% CF. The title must be qualified or the contribution
    reframed.

    2. **CF as net-neutral trade-off.** On SciERC: −14.4pp DR, +9.8pp CF. The paper
    argues these are different severity levels but provides no downstream evidence.
    A reviewer who doesn''t accept the severity distinction sees the method as redistributing
    violations rather than eliminating them.

    3. **Low-F1 regime.** At ~8% R-F1, constraints primarily operate on incorrect
    triples. Without validation on fine-tuned models or downstream tasks, practical
    significance is unclear.

    4. **Limited technical novelty.** The grammar layer is an XGrammar application;
    the semantic layer is a constraint lookup table with logit masking. The compilation
    pipeline and enabling dependency are sound engineering contributions but not conceptually
    novel relative to code-generation constrained decoding (PICARD, Synchromesh).

    5. **Post-hoc baseline outperforms on F1.** A trivial baseline achieves higher
    F1 on both datasets.


    **Strengths That Support Findings:**

    1. First systematic violation measurement with actionable tightness analysis

    2. Thorough ablation isolating each layer''s contribution

    3. Cross-model generalization without code modification

    4. Honest, transparent reporting of limitations


    ### Actionable Revision Recommendations


    1. **Revise title** to remove "Near-Complete" or scope it to specific configurations

    2. **Add downstream task evaluation** (e.g., KG-based QA) to validate that DR
    reduction + CF increase yields net benefit

    3. **Evaluate on at least one fine-tuned model** to demonstrate practical relevance
    beyond zero-shot

    4. **Decompose fallback-DR relationship** to confirm it is empirical rather than
    definitional

    5. **Add missing related work** (Guidance, NeuroLogic, type-constrained KG completion,
    InstructUIE)

    6. **Test combined OntoCoDec + post-hoc** pipeline to address residual violations

    7. **Report full tightness-DR scatter** on DocRED''s 96 relations to strengthen
    the tightness hypothesis

    8. **Reframe contributions**: position grammar layer as off-the-shelf application,
    center novelty on semantic layer + compilation pipeline + empirical analysis


    ### Final Scores


    | Dimension | R1 | R2 | AC Consensus |

    |-----------|----|----|-------------|

    | Soundness | 3.5 | 3.0 | **3.0** |

    | Excitement | 2.5 | 2.5 | **2.5** |

    | Overall | 3.0 | 2.5 | **2.5** |

    | Confidence | 4 | 4 | **4** |


    **Recommendation:** Reject for main conference. The paper is a strong candidate
    for **Findings of EMNLP 2026** if the title is corrected and the CF severity distinction
    is supported with evidence. In its current form, the combination of limited novelty,
    CF trade-off, low-F1 evaluation regime, and post-hoc baseline outperformance places
    it below the acceptance threshold for the main conference (~top 26%).


narrative_guidance: '核心 framing 被审稿人从多个角度同时击穿：CF 被定性为 "method introduces new violation
  type to fix another — net benefit 存疑"； novelty 被判定为 XGrammar + logit masking 的 engineering
  combination；DocRED DR↓仅 44.7% (Qwen) 与 Llama CF=12.02% 被合并论证为 "方法在复杂场景下 unreliable"；zero-shot
  ~8% F1 被视为 toy setting 不足以验证方法实用性。 Post-hoc baseline F1 更高被简单解读为 "post-hoc is strictly
  better"。叙事需要根本重构—— Path A (Violation Landscape as primary contribution) 或 Path B
  (Constraint-Quality Trade-off Analysis)—— 但当前 "method paper claiming near-complete
  type validity" 的 framing 几乎确定被 reject。 revision_effort_days 估算 14-30 天，须在 EMNLP
  camera-ready 前完成 reframe + 补实验。

  '
imagined_experiments:
- name: SciERC violation rate (minimal prompt)
  plan_id: P001
  description: Qwen3-8B 在 SciERC 上 zero-shot 最小提示下的 ontology violation 基准测试
  expected_results:
    total_triples: 1724
    domain_range_violation_rate: 0.154
    relation_vocabulary_violation_rate: 0.014
    entity_type_violation_rate: 0.004
    cross_field_consistency_violation_rate: 0.001
    relation_f1_pct: 8.23
    entity_f1_pct: 31.01
  result_rationale: '数据本身无变化。worst 档下审稿人攻击角度：(1) "15.4% DR on a 7-relation ontology
    is expected — with only 6 entity types and loose constraints on Used-for (787
    triples, 0.76%), the violation rate is inflated by 3 specific relations (Feature-of/Compare/Evaluate-for)
    that account for 85%+ of violations. This is a long-tail artifact, not a systemic
    problem." (2) "R-F1=8.23% 说明模型根本没有学到任务结构， 在一个模型基本不会做的任务上测 violation rate 有什么意义？"
    (3) 2-3 位审稿人认为 SciERC violation landscape 是 "useful but incremental observation"，不足以支撑独立
    contribution。

    '
  tables:
  - 'Table 1: SciERC Phase 0 per-relation violation rates (7 relations). Reviewer
    标注：''3 relations drive all violations — this is a data sparsity issue, not a systematic
    phenomenon'''
  figures_description:
  - 'Fig 1: Per-relation DR heatmap. Reviewer 评语：''Used-for dominates triple count
    (45.6%) but has near-zero DR — the ''landscape'' is really just 3 problematic
    relations'''
  analysis: '审稿人将 violation landscape 从 "systematic phenomenon" 降级为 "long-tail artifact
    on a small ontology"。 核心攻击：SciERC 只有 7 relations，violation 集中在 3 个关系上，不足以证明 "LLM
    IE 系统性地违反 ontology constraints"。 Path A reframe 下可辩护：即使集中在 3 个关系，这些关系的 25-42%
    violation rate 仍对下游系统产生不可忽视影响。 但需要补充更多 ontology 的 violation landscape 数据才能说服审稿人。

    '
- name: SciERC violation rate (schema-informed prompt)
  plan_id: P002
  description: Qwen3-8B 在 SciERC 上 schema-informed prompting 后的 violation 变化
  expected_results:
    domain_range_violation_rate: 0.058
    vs_minimal_dr_reduction_pct: -62.4
    total_triples: 1661
    evaluate_for_dr_delta_pp: 5.8
    feature_of_dr_delta_pp: -22.3
    compare_dr_delta_pp: -14.8
  result_rationale: 'worst 档审稿人攻击：(1) "62.4% reduction with just prompting — the problem
    is largely solvable without constrained decoding. The residual 5.78% could be
    addressed by better prompt engineering (few-shot, chain-of-thought) rather than
    building a complex decoding framework." (2) Evaluate-for regression (+5.8pp) 被
    1 位审稿人标记但未被多数视为 critical—— 更致命的是另一角度："you tested ONE prompting strategy; claiming
    ''prompt insufficiency'' without trying few-shot / CoT / self-consistency is premature."
    (3) McNemar test significance 不足以挽回—— 审稿人关注的是 "是否穷尽了 prompt 方案" 而非 "当前方案是否 significant"。

    '
  tables:
  - 'Table 2: Schema-informed vs minimal per-relation DR delta. Reviewer 圈出：''5/7
    relations improve — this is a reasonable success rate for zero-cost intervention'''
  figures_description:
  - 'Fig 2: Prompt effect per-relation stacked bar. Reviewer 批注：''Evaluate-for regression
    is N=133 triples — small sample, hard to draw conclusions'''
  analysis: '"Prompt insufficiency" claim 在 worst 档下被判定 undersupported——审稿人要求至少 3
    种 prompting strategy (minimal / schema-informed / few-shot / CoT) 的对比才能声称 "prompt-level
    intervention is fundamentally unreliable"。 单一 schema-informed prompt 的 62% reduction
    反而被用来论证 "prompting works pretty well"。 Path B reframe 可规避：不声称 prompt insufficient，而是将
    prompt 定位为 trade-off space 的一个点。

    '
- name: DocRED violation rate (minimal prompt)
  plan_id: P003
  description: Qwen3-8B 在 DocRED (96 relations) 上 zero-shot 最小提示下的 violation 基准
  expected_results:
    total_triples: 16540
    domain_range_violation_rate: 0.187
    relation_vocabulary_violation_rate: 0.289
    entity_type_violation_rate: 0.075
    json_parse_rate: 0.964
  result_rationale: 'worst 档审稿人关注点转移：(1) "RV=28.9% means nearly 1/3 of predicted relations
    are OOV — the model is barely following instructions. Measuring DR on a system
    that can''t even produce valid relation names is questionable methodology." (2)
    "ET=7.5% further confirms the model is struggling with basic task understanding
    in zero-shot DocRED. Your violation landscape is measuring noise, not systematic
    behavior." (3) 1 位审稿人直接质疑："with 96 relations and no training data, this is a toy
    evaluation that tells us nothing about how real IE systems would behave." 核心问题：
    zero-shot F1 太低 → 审稿人不信 violation pattern 反映真实 IE 系统行为。

    '
  tables:
  - 'Table 3: DocRED Phase 0 top violations by count/rate. Reviewer：''P31_instance_of
    DR=60.4% with 533 triples — this single relation type drives the narrative'''
  figures_description:
  - 'Fig 3: DocRED 96-relation violation heatmap. Reviewer：''impressive visualization
    but most cells are near-zero — violations cluster in ~15 relations'''
  analysis: '审稿人攻击核心：在 zero-shot R-F1 < 10% 的 setting 下，violation pattern 的外部效度存疑。
    "You''re characterizing the error patterns of a system that doesn''t work" 是最致命的一句。
    这直接威胁 C1 (violation landscape) 作为独立贡献的可信度。Path A reframe 需要在论文中前置 "we study violation
    patterns as a function of ontology structure, not model capability" 的定位， 但审稿人可能仍不买账。

    '
- name: DocRED violation rate (schema-informed prompt)
  plan_id: P004
  description: Qwen3-8B 在 DocRED 上 schema-informed prompting 后的 violation 变化
  expected_results:
    domain_range_violation_rate: 0.128
    vs_minimal_dr_reduction_pct: -32
    json_parse_rate: 0.945
    relation_vocabulary_violation_rate: 0.184
  result_rationale: '审稿人攻击点：(1) "Only 32% DR reduction (vs SciERC 62%) — schema-informed
    prompting degrades with ontology complexity. But wait, you claim this SUPPORTS
    your method. If prompting scales poorly, surely constrained decoding will also
    face scalability challenges with 96 relations?" (2) "RV 只从 28.9% 降到 18.4%——prompting
    甚至不能解决 OOV 问题，说明模型在 DocRED 上 根本不遵循 instructions。这是模型问题，不是 prompting vs decoding
    问题。" (3) parse rate 从 96.4% 降到 94.5%——"prompting actually made parsing slightly
    worse。" 审稿人用这组数据论证 "zero-shot DocRED 太难，方法无法在此 setting 下有效评估"。

    '
  tables:
  - 'Table 4: SciERC vs DocRED prompt effect comparison. Reviewer：''the gap (62% vs
    32%) could simply reflect prompt sensitivity to ontology size, not a fundamental
    limitation'''
  figures_description: []
  analysis: '32% vs 62% 的 gap 本意支持 "prompt scales poorly" claim，但审稿人反转论证为 "这说明 zero-shot
    96-relation 任务太难，不是一个合理的 evaluation setting"。 核心矛盾：作者需要 DocRED 来展示 ontology complexity
    effect，但 zero-shot DocRED 的质量太低导致审稿人质疑整个 evaluation framework。

    '

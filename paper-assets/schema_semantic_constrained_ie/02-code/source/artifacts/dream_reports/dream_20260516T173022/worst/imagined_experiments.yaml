    relation_f1: 7.9
  result_rationale: "Grammar-only 消除 RV 和 ET（36.3pp violations gone），E-F1 提升 1.7pp（从\
    \ OOV relation \n不再作为 FP 计入），R-F1 提升 0.7pp。DR 从 15.5%→25.0%——注意 DR 反而上升了！\n这是因为\
    \ grammar 将 OOV relations 强制映射到合法关系名，暴露了 latent DR violations。\n审稿人攻击：\"Grammar\
    \ constraint reveals that the TRUE DR rate is 25%, not 15.5%. \nThe unconstrained\
    \ baseline's seemingly lower DR is an artifact of unrecognized relations \nbeing\
    \ excluded from DR calculation. The actual problem is LARGER than reported.\"\n\
    更关键的是：grammar-only ALREADY achieves the E-F1 gain（+1.7pp）——semantic 层\n对 F1 没有额外贡献，它只贡献\
    \ DR reduction + CF introduction。\n"
  tables:
  - 'Table 4: Grammar-only achieves ALL of the F1 improvement; semantic layer contributes
    zero F1 gain'
  figures_description: []
  analysis: "\"Grammar layer = all F1 gain. Semantic layer = DR↓ + CF↑ + 0 F1 impact.\"\
    \ \n这是 worst 档审稿人最简洁有力的论证——semantic 层的 contribution 是 DR→CF 的 trade-off，\n而非 F1\
    \ improvement。整个 semantic 层可以被 post-hoc filter 替代且更简单。\n"

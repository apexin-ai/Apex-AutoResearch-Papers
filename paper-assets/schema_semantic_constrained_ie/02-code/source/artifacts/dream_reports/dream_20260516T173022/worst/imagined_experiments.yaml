  result_rationale: "S2 DR=2.8%（比 S1 的 2.5% 更差），CF=12.8%（比 S1 的 14.2% 稍好但仍然极高）。\n\
    R-F1 6.8%（比 S1 的 7.1% 更差 0.3pp）。Entity 数量从 2474 降到 2180（↓12%）——\nS2 pass-1 的 entity\
    \ extraction 更保守但不更准确。\n审稿人：\"The two-pass variant slightly reduces CF (14.2%→12.8%)\
    \ but at the cost of \nworse F1 and higher DR. The proposed architectural solution\
    \ to CF does not work.\"\nS2 无法作为 CF mitigation 的证据，也无法作为 interesting architectural\
    \ contribution。\n"
  tables: []
  figures_description: []
  analysis: "S2 在所有指标上都不如 S1 或仅 marginal 改善——审稿人会说 \"the authors tried to fix CF \n\

tier: worst
narrative_guidance: '原始 framing "type-valid IE via compiled ontology constraints"
  无法存活。核心假设受到根本性质疑：

  novelty 被判定为 incremental（applying XGrammar + type checker = engineering contribution），

  CF trade-off 被视为方法缺陷而非 type system 属性，violation landscape 被认为 trivial observation。

  需要 reframe 为 analysis paper (angle A): "When Does Constrained Decoding Help IE?
  A Decidability-Aware Analysis"。

  OntoCoDec 降级为 analysis 工具而非贡献本身。CF 从 limitation 变为 key finding（揭示 decidability boundary）。

  FT regime 的"边际价值小"也变成 finding 而非弱点。

  '
imagined_experiments:
- name: SciERC violation rate (minimal prompt)
  plan_id: P001
  description: Zero-shot Qwen3-8B 在 SciERC 上的 ontology constraint violation baseline
  expected_results:
    total_triples: 1680
    domain_range_violation_rate: 0.128
    entity_type_violation_rate: 0.005
    relation_vocabulary_violation_rate: 0.018
    cross_field_consistency_violation_rate: 0.001
    entity_f1: 0.295
    relation_f1: 0.076
    per_relation_dr_variance: 0.008
    max_per_relation_dr: 0.31
    min_per_relation_dr: 0.04
  result_rationale: "在 worst 档位下，DR 约 12.8%——仍属 non-trivial 但低于 15% 的 \"impressive\"\
    \ 门槛。\n关键问题：per-relation DR variance 较低（σ²=0.008），violations 分布相对均匀，\n削弱了 \"constraint\
    \ tightness drives concentration\" 的核心 insight。\n审稿人会说：\"12.8% violation rate\
    \ across 7 relations is expected for any structured \ngeneration task — this is\
    \ not a surprising finding worthy of a dedicated landscape study.\"\n最高单关系 DR\
    \ 仅 31%（非 42%），不够极端来论证 per-relation guarantee 的必要性。\n"
  tables:
  - 'Table 1: Per-relation DR distribution — relatively flat, max/min ratio ~8× (not
    55× as needed for tightness argument)'
  figures_description:
  - 'Figure 1: Violin plot of per-relation DR — distributions overlap significantly,
    weakening concentration narrative'
  analysis: "审稿人攻击线：\"The violation rates are moderate and relatively uniform — this\
    \ is \nsimply what happens when you ask an LLM to generate structured output without\
    \ fine-tuning.\nThe 'violation landscape' contribution reduces to measuring a\
    \ known phenomenon.\"\n"
- name: SciERC violation rate (schema-informed prompt)
  plan_id: P002
  description: Schema-informed prompt 对 SciERC violations 的消除效果
  expected_results:
    domain_range_violation_rate: 0.041
    total_triples: 1640
    vs_minimal_dr_reduction: -0.68
    per_relation_evaluate_for_delta: -0.02
    per_relation_feature_of_delta: -0.24
    per_relation_all_improved: true
    mcnemar_significant: true
  result_rationale: "Worst 档：schema-informed prompt 将 DR 从 12.8% 降到 4.1%（↓68%），且所有关系类型均有改善\n\
    （Evaluate-for 也下降 2pp 而非实际的 +5.8pp regression）。审稿人论证：\n\"A well-crafted prompt\
    \ already achieves 68% reduction with zero engineering effort. \nThe remaining\
    \ 4.1% is close to noise level for zero-shot extraction. The cost-benefit \nof\
    \ building a compiler + runtime constraint system for the last 4pp is questionable.\"\
    \n没有 per-relation regression = 丢失了 \"prompt unreliable at per-relation level\"\
    \ 这个关键论据。\n"
  tables: []
  figures_description: []
  analysis: "如果 prompt 足够好且无 regression，整个 \"prompt insufficiency\" claim 被削弱。\n审稿人会追问：\"\
    Why not iterate on prompt engineering (few-shot, chain-of-thought) \nbefore building\
    \ a complex decoding system?\" OntoCoDec 变成 over-engineering 的例证。\n"
- name: DocRED violation rate (minimal prompt)
  plan_id: P003
  description: DocRED 96-relation ontology 的 zero-shot violation baseline
  expected_results:
    total_triples: 16200
    domain_range_violation_rate: 0.155
    entity_type_violation_rate: 0.068
    relation_vocabulary_violation_rate: 0.295
    cross_field_consistency_violation_rate: 0.001
    json_parse_rate: 0.958
  result_rationale: "DR=15.5% 与 SciERC 12.8% 接近（比值 1.2×）——审稿人论证：\n\"Violation rates\
    \ are comparable across a 7-relation and 96-relation ontology (15.5% vs 12.8%).\
    \ \nThis directly contradicts any claim about ontology complexity driving violations\
    \ — \nthe rates are essentially the same regardless of schema size.\"\n这个数据点本应支持\
    \ \"tightness not size\" 的 insight，但在 worst 档位下被反过来读：\n既然 rate 不随 size 变化，问题规模本身就是\
    \ bounded（不像论文暗示的那样严峻）。\n"
  tables:
  - 'Table 2: Cross-dataset comparison — DR rates within 3pp, undermining urgency
    narrative'
  figures_description: []
  analysis: "RV=29.5% 被审稿人视为 grammar 层的 \"free lunch\"——单层 CFG constraint 就能消除的 trivial\
    \ violation，\n不需要复杂的 semantic layer。\"Most of the violations (29.5% RV + 6.8%\
    \ ET = 36.3%) are \ntrivially fixable by grammar alone; only 15.5% require semantic\
    \ reasoning.\"\n"
- name: DocRED violation rate (schema-informed prompt)
  plan_id: P004
  description: Schema-informed prompt 在 DocRED 上的效果
  expected_results:
    domain_range_violation_rate: 0.098
    dr_reduction_vs_minimal: -0.37
    entity_type_violation_rate: 0.004
    relation_vocabulary_violation_rate: 0.19
  result_rationale: "DR 降到 9.8%（↓37%）——比 SciERC 的 ↓68% 弱，但审稿人不关注这个 gap：\n\"Even with\
    \ a simple schema-informed prompt, DR drops to under 10%. Combined with \nthe\
    \ fact that fine-tuning reduces DR to <2%, the remaining window where constrained\
    \ \ndecoding adds value is extremely narrow (the 2-10% gap that prompt can't close\
    \ but \nFT can).\" 这直接喂 \"FT makes the method unnecessary\" 攻击线。\n"
  tables: []
  figures_description: []
  analysis: "审稿人构建 \"diminishing returns\" 叙事：Prompt ↓37% (free) → FT ↓95% (standard)\
    \ → \nConstrained decoding covers the last 2% at the cost of CF↑10× and latency\
    \ overhead.\n\"The method lives in a narrow utility window that disappears with\
    \ standard fine-tuning.\"\n"
- name: SciERC unconstrained baseline
  plan_id: P005a
  description: SciERC Phase 2 unconstrained 重跑（checker v2 对齐）
  expected_results:
    domain_range_violation_rate: 0.128
    relation_vocabulary_violation_rate: 0.018
    entity_type_violation_rate: 0.005
    cross_field_consistency_violation_rate: 0.001
    entity_f1: 0.295
    relation_f1: 0.076
    total_triples: 1680
  result_rationale: "与 P001 一致（同一模型同一数据集），作为 Phase 2 ablation 的对照基线。\nWorst 档位下 baseline\
    \ F1 已经很低（R-F1 7.6%），审稿人会质疑：\n\"Evaluating constraint methods on a setting with\
    \ 7.6% relation F1 is meaningless — \nthe model barely extracts anything correctly.\
    \ Any constraint enforcement on \nnear-random outputs is academic exercise, not\
    \ useful research.\"\n"
  tables: []
  figures_description: []
  analysis: "低 F1 baseline 是 C8 攻击面的核心弹药。Worst 档审稿人不会接受 \"F1 is control variable\"\
    \n的论证——他们会说 \"if the base extraction is this poor, constraint enforcement \nis\
    \ premature optimization on garbage.\"\n"
- name: SciERC grammar-only
  plan_id: P005
  description: 仅 grammar 层（CFG）对 SciERC 的约束效果
  expected_results:
    entity_type_violation_rate: 0
    relation_vocabulary_violation_rate: 0
    domain_range_violation_rate: 0.125
    cross_field_consistency_violation_rate: 0.001
    entity_f1: 0.294
    relation_f1: 0.075
  result_rationale: "Grammar 层消除 ET/RV（trivial CFG-expressible constraints），但 DR 仅从\
    \ 12.8%→12.5%\n（↓2.3%，negligible）。F1 微降 0.1pp。审稿人的读法：\n\"The grammar layer does\
    \ exactly what XGrammar was designed to do — enforce vocabulary \nconstraints.\
    \ This is a direct application of existing technology (XGrammar, Zheng et al.\
    \ 2024) \nwith zero methodological novelty. The authors simply configured XGrammar\
    \ for their JSON schema.\"\n这直接喂 \"engineering contribution\" 的 novelty 攻击。\n"
  tables: []
  figures_description: []
  analysis: "Grammar 层的效果完全可预期且 trivial——这是 worst 档审稿人最强的 novelty 攻击弹药。\n\"Layer 1\
    \ is off-the-shelf XGrammar. Layer 2 is a type checker. The paper's contribution\
    \ \nis connecting them with bitwise AND — this is systems integration, not research.\"\
    \n"
- name: SciERC semantic-only
  plan_id: P006
  description: 仅 semantic 层（logit masking）对 SciERC 的约束效果
  expected_results:
    domain_range_violation_rate: 0.088
    entity_type_violation_rate: 0.005
    relation_vocabulary_violation_rate: 0.018
    cross_field_consistency_violation_rate: 0.035
    entity_f1: 0.292
    relation_f1: 0.073
  result_rationale: "Semantic-only 将 DR 从 12.8%→8.8%（↓31%），但引入 CF=3.5%（从 0.1% 暴涨 35×）。\n\
    F1 下降 0.3pp。审稿人攻击：\"The semantic layer alone achieves only 31% DR reduction \n\
    while introducing 35× more cross-field inconsistencies. This is a net negative\
    \ — \nthe method creates more problems than it solves.\"\n且 ET/RV 无法处理（因为没有 grammar\
    \ 层），暴露 enabling dependency 但被读为 \"单层无法独立工作 = 设计耦合\"。\n"
  tables: []
  figures_description: []
  analysis: "Semantic-only 的 CF 引入是最致命的数据点：它证明 semantic 层 IS the source of CF，\n且没有\
    \ grammar 层时效果很差。审稿人会说 \"the semantic layer is both the cause of \nthe new problem\
    \ (CF) and insufficient to solve the original problem (DR) without grammar.\"\n"
- name: SciERC full S1
  plan_id: P007
  description: Grammar+Semantic 双层 single-pass decoding 对 SciERC 的完整效果
  expected_results:
    domain_range_violation_rate: 0.025
    entity_type_violation_rate: 0
    relation_vocabulary_violation_rate: 0
    cross_field_consistency_violation_rate: 0.142
    entity_f1: 0.289
    relation_f1: 0.071
    fallback_rate: 0.41
  result_rationale: "DR 从 12.8%→2.5%（↓80%），但 CF 从 0.1%→14.2%（↑142×）。\nR-F1 下降 0.5pp（p=0.03,\
    \ statistically significant）。\n审稿人的核心攻击：\n\"The method reduces DR by 10.3pp but\
    \ introduces CF at 14.2pp — a net INCREASE \nin total violation load. The authors\
    \ are trading known, measurable violations \n(DR) for harder-to-detect inconsistencies\
    \ (CF). This is not improvement, \nit's problem displacement.\"\nFallback rate\
    \ 41% 意味着近半数 token 位置 semantic mask 失效——方法在很多时刻\n实质上只有 grammar-only 在工作。DR 残余\
    \ 2.5%（非 near-complete）进一步削弱 claim。\n"
  tables:
  - 'Table 3: Violation trade-off — DR↓10.3pp vs CF↑14.1pp, net violation increase'
  figures_description:
  - 'Figure 2: Stacked bar chart showing total violations before/after — ''after''
    bar is TALLER due to CF dominance'
  analysis: '这是 worst 档位的核心数据：方法引入的 CF 大于它消除的 DR。

    total_violation_before = 12.8% + 1.8% + 0.5% + 0.1% = 15.2%

    total_violation_after = 2.5% + 0% + 0% + 14.2% = 16.7%

    审稿人可以合法地声称 "the method makes things worse on aggregate."

    即使论证 DR > CF in severity，这个 framing 对 EMNLP reviewer 极具说服力。

    '
- name: SciERC full S2 (ablation)
  plan_id: P008
  description: Two-pass S2 策略作为 CF mitigation 的尝试
  expected_results:
    domain_range_violation_rate: 0.028
    cross_field_consistency_violation_rate: 0.128
    entity_f1: 0.285
    relation_f1: 0.068

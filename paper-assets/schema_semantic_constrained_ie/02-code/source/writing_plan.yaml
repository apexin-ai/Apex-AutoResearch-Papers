meta:
  venue: EMNLP 2026
  track: long paper (ARR)
  template: "acl"
  page_limit: 8  # + unlimited references + appendix
  deadline: 2026-05-25
  core_claim: >
    LLM-based IE 系统存在系统性 ontology constraint violations（15-19% per-triple），
    prompt-level 干预统计有效但 per-relation 不可靠（甚至恶化），OntoCoDec 通过
    grammar+semantic 双层 compiled constrained decoding 实现 94% DR reduction 且 F1-neutral。
  title: "OntoCoDec: Near-Complete Type-Valid Information Extraction via Compiled Ontology Constraints"
  created_at: 2026-05-14T12:00:00Z
  approved_at: 2026-05-14
  compression_plan:
    version: 2
    reason: "正文 16 页→8 页压缩"
    date: 2026-05-14
    current_words: 11611
    target_words: 5500
    strategy: >
      Related Work 大幅精简为 positioning；Discussion 选 2 段精简后合并入 Conclusion；
      Violation Landscape 并入 Experiments §5.1；Background 精简只留 notation+problem；
      Introduction 适度压缩；Method+Composition 精简表述；Experiments 保持完整但精简 DocRED 文字。
      移出内容进入 Appendix。

# ============================================================================
# 压缩后论文结构（8 页正文）
# ============================================================================
paper_outline:
  - section: abstract
    file: abstract.tex
    word_budget: 200  # from 225, -11%
    action: trim
    instructions: >
      删减重复措辞。确保 4 要素齐全：problem, method, results, limitation flag。
      数字保留：DR 15.4%→0.93%（↓94%），F1-neutral。CF 9.9% 作为 limitation 一句话提及。

  - section: "§1 Introduction"
    file: section1_introduction_draft.tex
    word_budget: 550  # from 669, -18%
    action: trim
    instructions: >
      保留所有核心内容但精简表述：
      (1) Hook: violation 数据不变
      (2) Gap: 合并 prompt/grammar/posthoc/training 4 段为 2 段更紧凑的对比
      (3) Method: 保持 OntoCoDec 描述但删减细节（Worker 不展开 entity registry 工作原理）
      (4) Contributions: 从 4 条压缩为 3 条（合并 C2+C3 为一条：framework + decidability taxonomy）
      不含 fig1_overview（图移入 Method §3）

  - section: "§2 Background"
    file: section2_background.tex
    word_budget: 250  # from 564, -56%
    action: heavy_trim
    instructions: >
      大幅压缩，只保留后续正文需要的 notation 定义和 problem statement：
      (1) §2.1 IE Ontology Structure: 保留 O=(E,R,σ) 定义 + type-valid 定义 + 
          constraint tightness 定义（1 句 + 1 个公式）。删除 SciERC/DocRED 具体数字
          （这些在 Experiments 中自然出现）
      (2) §2.2 Grammar-Constrained Decoding: 压缩为 2-3 句（cite XGrammar+Outlines，
          点明 CFG 限制——不能做 cross-field semantic constraints）
      (3) §2.3 Problem Statement: 保留 2 条 desiderata（structural + type validity），
          保留 prefix-decidability 关键 insight（1 句）

  - section: "§3 Method"
    file: section3_method_draft.tex
    word_budget: 1100  # from 1578, -30%
    action: trim
    instructions: >
      核心贡献，保留技术细节但精简表述：
      (1) §3.1 Problem Formulation: 保留 eq:output-schema + eq:type-valid + violation 定义，
          但删减解释性文字（公式自解释）
      (2) §3.2 Grammar Layer: 保留 JSON Schema→XGrammar→M_g 的编译流程，
          删减 XGrammar 实现细节（读者可 cite 原文）
      (3) §3.3 Semantic Layer: 完整保留 entity registry + position detection + dynamic masking，
          这是核心新贡献
      (4) §3.4 Layer Interaction: 保留 enabling dependency + grammar-first invariant，
          但精简为 1 段（不需要完整的 conjunction 公式——Composition section 有）
      (5) §3.5 Decoding Strategies: 保留 S1 描述（3-4 句），S2 压缩为 1 句 +
          "details in Appendix A"
      图 fig1_overview 放在 Method 开头

  - section: "§4 Constraint Composition"
    file: section4_composition_draft.tex
    word_budget: 500  # from 787, -36%
    action: trim
    instructions: >
      保留所有公式但精简文字：
      (1) M_final = M_grammar ∧ M_semantic: 保留 eq:composition + 2 句解释
      (2) Grammar-First Fallback: 压缩为 1 段（保留核心 rule + 1 句 rationale，
          删除 logit threshold 细节）
      (3) Constraint Tightness: 保留 eq:tightness + 1 句 intuition + SciERC/DocRED 
          数字对比。删除 Used-for example（读者不需要这个 level 的细节）
      (4) Decidability Taxonomy: 保留 3-class 列表但每类压缩为 1 句。
          删除最后段（OntoCoDec 覆盖前两类——读者已知）

  - section: "§5 Experiments"
    subsections:
      - subsection: "§5.1 Setup and Violation Landscape"
        file: section3_violation_landscape.tex
        word_budget: 450  # from 838, -46%
        action: restructure_and_trim
        instructions: >
          原 §3 Violation Landscape 整合为 §5.1，结构重构：
          (1) 删除独立 section header，改为 \subsection{Experimental Setup and Violation Landscape}
          (2) Setup: 2-3 句（models, datasets, metrics 定义）
          (3) 保留 tab:prompt_comparison（已创建），但删除表格周围的冗余文字描述
          (4) Violation Distribution: 压缩为 1 段 key findings（DR 15.4% vs 18.7%，
              tightness drives violations）。Per-relation analysis 压缩为 2 句
              （Compare 42.4% vs Used-for 0.8% + correlation with tightness）
          (5) Prompt Insufficiency: 压缩为 1 段（SciERC ↓62% but DocRED only ↓31%；
              Evaluate-for 反而 +5.8pp → prompt 不可靠）
          (6) fig:per_relation_dr 保留
          注意：需要把 \section{Violation Landscape} 改为 \subsection，
          内部 \subsection 降级为 \paragraph 或删除

      - subsection: "§5.2 Results on SciERC"
        file: section5_scierc_draft.tex
        word_budget: 550  # from 742, -26%
        action: trim
        instructions: >
          保留 tab:scierc-ablation + 关键数字，精简分析文字：
          (1) Main result: DR 15.37%→0.93%（↓94%），ET/RV→0%，F1-neutral
          (2) Layer decomposition: grammar 消除 RV+ET，semantic+grammar 消除 DR
          (3) CF analysis: 保留核心发现（CF 9.9% 由 semantic 层引入，grammar CF=0.08%）
              压缩根因分析为 2 句（EVR pattern + Generic↔OtherScientificTerm）
          (4) S1 vs S2: 删除详细对比，1 句 "S2 achieves comparable results (Appendix A)"

      - subsection: "§5.3 Cross-Dataset Validation on DocRED"
        file: section5_docred_draft.tex
        word_budget: 600  # from 1450, -59%
        action: heavy_trim
        instructions: >
          这是压缩最大的 experiments 子节。保留核心数字，大砍文字：
          (1) 保留 tab:docred-ablation（如有），压缩为关键数字段
          (2) Grammar layer on DocRED: 1 段（RV 29.66%→0.03%，ET 2.48%→0%）
          (3) Full S1: DR 18.46%→10.21%（↓45%），F1 +0.50pp significant
          (4) Tightness 对比: DocRED τ̄=0.842 vs SciERC τ̄=0.333 解释 residual DR
          (5) 删除详细的 per-mode 分析段、DocRED-specific per-relation 分析、
              与 SciERC 的冗长对比文字。数字让 table 说话

      - subsection: "§5.4 Cross-Model Validation"
        file: section5_crossmodel_draft.tex
        word_budget: 400  # from 830, -52%
        action: heavy_trim
        instructions: >
          保留 tab:cross-model + 关键发现：
          (1) Llama-3.1-8B 零代码修改即可使用
          (2) SciERC: DR 13.3%→0.08%，DocRED: DR 26.07%→2.55%（↓90%）
          (3) 不同模型的 violation profile 差异（Llama DR更高 but RV更低）
          (4) 删除详细的 per-metric 讨论、CF 在 Llama 上的详细分析、
              parse failure 讨论

  - section: "§6 Related Work"
    file: section6_related_work.tex
    word_budget: 400  # from 2441, -84%
    action: rewrite
    instructions: >
      完全重写为 positioning statements，每类工作 2-3 句 + citations：
      (1) Grammar-constrained decoding: XGrammar/Outlines/LMQL 保证 syntactic validity 
          但不做 semantic constraints [3 citations, 2 句]
      (2) Semantic constrained decoding (code): Synchromesh/PICARD/MGD/PLDI'25 
          在代码域做 type checking [4 citations, 2 句]
      (3) Vocabulary/type-constrained IE: GCD/AdaKGC/GoLLIE/GENRE 做 vocabulary
          约束但不做 cross-field semantic [4 citations, 2 句]
      (4) Post-hoc validation: ODKE+/OntoGPT/OntoLogX 检测-修复但不 prevent 
          [3 citations, 2 句]
      (5) Constrained decoding quality: CRANE/Hidden Cost 担忧质量下降，
          但 IE 是 extraction 非 reasoning [2 citations, 1 句]
      (6) OntoCoDec positioning: 1 句总结差异化
      完整版 Related Work 移入 Appendix B

  - section: "§7 Conclusion"
    file: section7_conclusion_compressed.tex  # new merged file
    word_budget: 500  # from 668+819=1487, -66%
    action: merge_and_rewrite
    instructions: >
      合并 discussion_paragraphs.tex 关键内容 + section7_conclusion.tex：
      (1) Contributions summary: 3 句话（violation landscape + framework + empirical 94%）
      (2) CF severity 精简版（from discussion ¶2）: 3 句——CF 是 per-relation independent 
          enforcement 的系统性副作用，grammar-only CF=0.08% 证实 100% 由 semantic 层引入，
          dominant pattern Generic↔OtherScientificTerm 反映 type system 歧义
      (3) F1 significance explanation 精简版（from discussion ¶3）: 2 句——DocRED F1 gain 
          来自 grammar 消除 OOV relations（29.66% RV → 0%），SciERC RV 仅 1.39% 故 F1 
          effect 不显著
      (4) Limitations: 3-4 句（CF 9.9% open challenge，2 models，zero-shot only，
          parse failures on DocRED-Llama）
      (5) Future work: 2 句（global entity consensus + fine-tuned integration）
      Low F1 practical significance 和 Post-hoc comparison 移入 Appendix C

  - section: "Appendix"
    files:
      - appendix_related_work.tex  # full version of §6
      - appendix_discussion.tex    # moved discussion paragraphs
      - appendix_s1_vs_s2.tex      # S1 vs S2 details
      - appendix_prompts.tex       # prompt templates
    word_budget: unlimited
    action: create_from_moved_content
    instructions: >
      Appendix 结构：
      A. Full Related Work（当前 section6_related_work.tex 几乎原样保留）
      B. Extended Discussion（Low F1 practical significance + Post-hoc comparison 原文）
      C. S1 vs S2 Decoding Strategy Details（tab4_s1_vs_s2 + 分析）
      D. Prompt Templates（minimal vs schema-informed）


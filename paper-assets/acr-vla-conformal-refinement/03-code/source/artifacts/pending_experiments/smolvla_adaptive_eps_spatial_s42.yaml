# smolvla-adaptive-eps-spatial-s42
# Purpose: Quick validation of adaptive epsilon on Spatial (highest trigger rate suite)
# Group: adaptive-epsilon-validation
# Hypothesis: Proportional correction scaling (soft gate) performs at least as well as
#   binary gating on Spatial, where trigger rate ~20% means many near-threshold steps
#   that could benefit from partial correction rather than full-or-nothing.
experiment_id: smolvla-adaptive-eps-spatial-s42
model: smolvla
benchmark: spatial
mode: adaptive_conformal_crm
adaptive_epsilon: true
seed: 42
K: 2
obs_dim: 960
max_steps: 280
n_rollouts: 20
conformal_threshold: 0.25
max_correction_norm: 0.2
crm_checkpoint: /root/autodl-tmp/checkpoints/crm_smolvla_3suite_v1/crm_best.pt
epsilon: 0.2
estimated_gpu_hours: 1.0
baseline_comparison: "Spatial tau-gated s42: 80.8%, VLA-only: 79.3%"

# smolvla-adaptive-eps-object-s42
# Purpose: Quick validation of adaptive epsilon on Object (lowest trigger rate suite)
# Group: adaptive-epsilon-validation
# Hypothesis: On Object (trigger ~4%), most steps have d2 << tau; adaptive epsilon
#   reduces even the rare corrections to near-zero magnitude, potentially preserving
#   baseline better than binary gating (+0.1pp currently).
experiment_id: smolvla-adaptive-eps-object-s42
model: smolvla
benchmark: object
mode: adaptive_conformal_crm
adaptive_epsilon: true
seed: 42
K: 2
obs_dim: 960
max_steps: 280
n_rollouts: 20
conformal_threshold: 0.25
max_correction_norm: 0.2
crm_checkpoint: /root/autodl-tmp/checkpoints/crm_smolvla_3suite_v1/crm_best.pt
epsilon: 0.2
estimated_gpu_hours: 1.0
baseline_comparison: "Object tau-gated s42: 77.8%, VLA-only: 77.7%"

  analysis: 'Kill criterion 触发：A3 gap = 0.8% < 2% 阈值，且统计不显著。Claim 1 ("per-DOF conformal
    features enable dimension-selective correction") 在真实 VLA 上不成立。CRM 的全部增益来自 observation-conditioned
    残差，与 A2C2 类方法功能等价。这是论文核心贡献的致命打击——方法的独特卖点（将 multivariate CP 统计量 作为校正网络输入特征）被证伪。值得保留的发现是
    CRM 残差本身仍有 ~2-3% 的增益（A3 vs base），但这 不构成新颖贡献。


narrative_guidance: '原始 framing 不可维持。需要重构 story 从 method paper 转为 analysis/empirical-study
  paper。 核心转向: "When does multivariate conformal prediction help robot action correction?
  A systematic empirical study." 贡献变为: (1) 负面结果的价值——证明 synthetic MVP 中的 per-DOF advantage
  不能 naively transfer 到 high-dimensional VLA action spaces，分析为什么 (covariance degeneracy,
  K=10 insufficient, flow-matching sample geometry); (2) 对比分析 CGS vs scalar CP vs
  DiU 在不同分布偏移类型下的行为差异， 提供 practitioner guidance; (3) COC 信号失败模式的系统分析——什么条件下自参考校准信号可靠/不可靠。
  放弃 CoRL 投稿，瞄 ICLR 2027 workshop 或 reframe 后投 ICLR 2027 main。若 CRM 本身（不依赖 conformal
  features）仍有 >5% 增益，可考虑退到 "observation-conditioned residual correction" 的 simpler
  story，但这与 A2C2 区分度低。

  '
imagined_experiments:
- name: ACR-VLA Full Pipeline on SmolVLA
  plan_id: plan_001
  description: 'ACR-VLA full pipeline on SmolVLA base: CGS + ACI/COC + CRM. Train
    CRM on LIBERO demos + synthetic augmentation. Evaluate on LIBERO (nominal preservation)
    + LIBERO-Plus L3-L5.

    '
  expected_results:
    libero_nominal_success_rate_base: 0.95
    libero_nominal_success_rate_acr: 0.91
    libero_nominal_drop_pct: 4.2
    libero_plus_L3_success_base: 0.42
    libero_plus_L3_success_acr: 0.45
    libero_plus_L4_success_base: 0.28
    libero_plus_L4_success_acr: 0.31
    libero_plus_L5_success_base: 0.15
    libero_plus_L5_success_acr: 0.18
    libero_plus_avg_success_gain_abs: 3.3
    crm_train_loss_final: 0.0082
    cgs_avg_coverage_empirical: 0.87
    cgs_ledoit_wolf_shrinkage_intensity: 0.91
    inference_latency_overhead_ms: 14.2
  result_rationale: '在 worst 档下，ACR-VLA 全流程仅带来 ~3% 的 LIBERO-Plus 绝对增益。根本原因在于 flow-matching
    VLA 的 K=10 样本在 7D action space 中的协方差结构严重退化：Ledoit-Wolf shrinkage intensity 达 0.91（接近
    1.0 = 对角阵），意味着估计的协方差几乎完全被 shrink 到对角形式，CGS 提取的 per-DOF conformal 特征实质上退化为独立的 per-dimension
    marginal 信息，丧失了 multivariate CP 的核心优势——跨维度协方差编码。CRM 仍然学到了一些有用的观测条件残差（来自 observation
    embedding）， 但 conformal 特征的贡献微乎其微。名义性能下降 4.2% 超过理想范围，因为 CRM 在 in-distribution
    数据上的残差校正引入了不必要的扰动——分布内样本本身质量较高，校正反而降低了精度。

    '

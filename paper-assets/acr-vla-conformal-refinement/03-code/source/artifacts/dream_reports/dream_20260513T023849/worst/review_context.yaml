  analysis: 'A4 结果与 A3 形成完整的否定证据链：不仅 conformal 特征整体贡献微弱（A3），per-DOF 的额外 granularity
    也不提供任何增量（A4）。这否定了 Claim 1 的全部两层逻辑。对 empirical study reframe 而言，这是一个有价值的负面结果——可以精确量化
    MVP-to-VLA transfer gap 并分析 root cause。


- name: SRPO Stacking
  plan_id: plan_004
  description: 'ACR-VLA stacked on SRPO-finetuned VLA. Train new CRM on SRPO checkpoint
    + LIBERO demos. Evaluate on LIBERO-Plus.

    '
  expected_results:
    srpo_baseline_libero_plus: 0.821
    srpo_plus_acr_libero_plus: 0.832
    srpo_stacking_gain_abs: 1.1
    srpo_stacking_pvalue: 0.29
    srpo_nominal_drop: 1.8
  result_rationale: 'SRPO stacking gain 仅 1.1%（82.1% → 83.2%），落入 worst 档 [0, 2] 区间且统计不显著。
    根本原因：SRPO 通过 RL finetuning 已经在训练时对 LIBERO-Plus 的分布偏移做了适应，留给 inference-time correction
    的残差空间极小。SRPO 已将 base VLA 从 ~28% 提升到 82.1%， 吃掉了绝大部分可恢复的性能差距。CRM 能校正的残余错误主要是 SRPO
    也无法解决的 fundamental failures（如完全未见过的 layout 组合），这些 failure modes 不是简单的 action bias
    可以 通过残差校正解决的。此外，SRPO 的 policy 已经过 RL 优化，action distribution 更加 peaked， K=10 flow-matching
    样本的多样性更低，进一步削弱了 CGS 的统计估计质量。

    '

    vs per-step）且需要 等到 episode 结束，但信号质量远高于 COC 的嘈杂 proxy。COC 作为 per-step 信号的优势 （更快适应、不需要外部
    reward）在实践中被其 noise 抵消。这对 reframed paper 是一个重要 negative result：self-referential

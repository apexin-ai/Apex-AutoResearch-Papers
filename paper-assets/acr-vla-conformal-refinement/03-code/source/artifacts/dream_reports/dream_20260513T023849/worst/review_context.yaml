    distance 和 Euclidean distance 高度相关（因为协方差 近对角），multivariate extension 不比 ReconVLA
    的标量方案好多少。CRM 的存在至少提供了 observation-conditioned 残差校正能力（A2 vs full gap = 1.8%），这是该

    和 noise 是 synthetic augmentation 能较好覆盖的偏移类型——随机 crop/resize 和 Gaussian noise 是标准数据增强，CRM
    在这两类偏移上有充足的训练数据。但即使在这两个维度上， 增益也主要来自 observation-conditioned residual（与 A3 一致），而非
    conformal features。 Layout 和 language 出现负增益，因为这两类偏移无法通过 synthetic augmentation
    覆盖， CRM 面临 out-of-distribution 输入且过度校正。Layout 改变了物体空间关系，CRM 学到的 残差模式不适用；language
    改变了任务语义，CRM 的 observation encoder 无法正确解读意图。 这两个维度的 negative transfer 是 worst 档的典型特征——CRM
    在未见过的偏移类型上有害。


- name: A3 Ablation — CRM without Conformal Features
  plan_id: plan_002
  description: 'CRM without conformal features (observation-conditioned residual only,
    equivalent to A2C2-style generic residual). MAKE-OR-BREAK for Claim 1.

    '
  expected_results:
    libero_plus_avg_success_acr_full: 0.313
    libero_plus_avg_success_a3_no_conformal: 0.305
    a3_ablation_gap_abs: 0.8
    a3_ablation_gap_pct_relative: 2.6
    libero_nominal_a3: 0.92
    a3_vs_full_pvalue_paired_ttest: 0.38
  result_rationale: 'A3 kill criterion 触发。去掉 45D conformal 特征后，CRM 仅依赖 observation
    embedding 做残差 校正，性能仅下降 0.8 个百分点（统计不显著，p=0.38）。这直接证明在真实 VLA 设置下，conformal 特征几乎不携带
    CRM 无法从 observation 中获取的额外信息。原因有二：(1) 如 plan_001 分析， K=10 + Ledoit-Wolf 产生的协方差过度
    shrink，per-DOF 特征退化为近似 isotropic 的无差别信号； (2) CRM 的 observation encoder 已经隐式捕获了"当前观测与训练分布的偏差"信息，这与
    CGS 试图 编码的 epistemic uncertainty 高度冗余。在 MVP 3D 环境下 per-DOF 特征有效是因为：3D 空间 K=10
    给出 p/n=0.3 的合理比率，协方差结构保留完好；而 7D 空间 p/n=0.7 时结构信息被 shrinkage 抹杀。这是一个 dimensionality-driven
    的 transfer failure。

    '

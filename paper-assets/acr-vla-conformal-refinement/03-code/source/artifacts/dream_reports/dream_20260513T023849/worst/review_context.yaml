    a5_pvalue: 0.74
  result_rationale: 'CGS vs Bonferroni gap 仅 0.2%，完全在噪声范围内。由于 K=10 Ledoit-Wolf shrinkage
    将协方差 矩阵推向近对角形式，joint Mahalanobis ellipsoid 和 per-DOF Bonferroni rectangle 在形状上
    高度相似（均近似 axis-aligned）。multivariate CP 相对于 marginal Bonferroni 的理论优势 （更紧的 joint
    region、跨维度协方差利用）在协方差退化时不存在。这从另一个角度确认了 worst 档核心问题：K=10 在 7D 空间中不足以支撑有意义的 multivariate
    统计。


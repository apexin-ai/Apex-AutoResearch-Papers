  - 'Fig: ACI alpha trajectory across episodes，分 L3/L4/L5。L3 平稳收敛，L5 oscillate 严重。'
  - 'Fig: Ellipsoid volume CDF — ACI vs static。两条曲线几乎重合，narrowing 微弱。'
  analysis: 'COC 作为自参考校准信号在真实 VLA 上不可靠。Claim 2 的 kill criterion 部分触发（ρ < 0.3 AND narrowing
    < 10% 均满足）。ACI 虽然能 converge coverage，但这只是因为 conformal prediction 的理论保证——它并不意味着
    ACI 提供了比 static 更有用的 uncertainty 估计。对 reframed paper， COC 失败模式分析本身是有价值的贡献：可以系统地刻画什么条件下
    self-referential calibration 信号 可靠（低偏移、policy 足够 smooth）vs 不可靠（高偏移、prediction
    instability）。

    '

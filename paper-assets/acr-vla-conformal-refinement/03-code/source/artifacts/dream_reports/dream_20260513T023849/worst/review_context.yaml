- name: A4 Ablation — Scalar vs Per-DOF Uncertainty Features
  plan_id: plan_003
  description: 'CRM with scalar uncertainty (Euclidean distance like ReconVLA) replacing
    45D per-DOF features. Validates per-DOF > scalar.

    '
  expected_results:
    libero_plus_avg_success_a4_scalar: 0.31
    libero_plus_avg_success_full_perDOF: 0.313
    a4_ablation_gap_abs: 0.3
    a4_pvalue: 0.62
    libero_nominal_a4: 0.915
  result_rationale: 'Per-DOF vs scalar gap 仅 0.3 个百分点，完全在噪声范围内（p=0.62），落入 worst 档的
    [-1, 1] 区间。 这与 A3 结果高度一致：如果 conformal 特征整体贡献几乎为零（A3 gap ~0.8%），那么 conformal 特征的
    granularity（per-DOF vs scalar）自然也不会有区别。两种特征形式都只是噪声输入，CRM 学会 忽略它们而依赖 observation
    embedding。这进一步确认了 worst 档假设——在 K=10 flow-matching 样本的退化协方差下，无论用 45D 还是 1D 编码 uncertainty，信息量都接近零。MVP
    中 per-DOF 的 显著优势（group6: 0.024512 vs 0.029498, ~17% 相对改善）完全无法复现，因为 MVP 的 3D 空间
    协方差结构是真实可估计的，而 7D VLA 空间中协方差信息被 shrinkage 摧毁。

    '

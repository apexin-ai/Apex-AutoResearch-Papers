  analysis: 'Claim 3 降级为 "complementary in principle"。1.1% 增益不构成 convincing evidence
    of orthogonal value。对 reframed paper，这支持一个 insight：inference-time correction 的
    ceiling 受限于 training-time optimization 已覆盖的 error modes。当 base policy 很强时，剩余 failures
    是 结构性的，不可通过 action residual 修复。


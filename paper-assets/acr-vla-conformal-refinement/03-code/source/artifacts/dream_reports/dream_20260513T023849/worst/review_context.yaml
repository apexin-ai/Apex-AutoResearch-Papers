- name: COC Signal Validation
  plan_id: plan_005
  description: 'COC signal validation: (a) Spearman ρ between episode COC coverage
    fraction and task success, (b) ACI convergence plot, (c) ellipsoid volume comparison
    vs static calibration.

    '
  expected_results:
    coc_success_spearman_rho: 0.18
    coc_success_spearman_pvalue: 0.04
    aci_converged_episodes_pct: 0.72
    aci_convergence_steps_median: 85
    aci_final_coverage_mean: 0.89
    aci_target_coverage: 0.9
    ellipsoid_volume_aci_vs_static_narrowing_pct: 6.5
    ellipsoid_volume_aci_mean_log: 2.31
    ellipsoid_volume_static_mean_log: 2.47
  result_rationale: 'COC-success Spearman ρ = 0.18，虽统计显著（p=0.04，因为 N 足够大）但实质相关性极弱，远低于
    可用阈值。核心问题：COC 是一个 chunk-overlap 一致性度量，衡量相邻 action chunks 的预测 一致性。在高分布偏移下（L4-L5），VLA
    的预测本身已经高度不稳定，COC 信号的 noise floor 很高。 更根本的是，COC 衡量的是"预测一致性"而非"预测正确性"——一个 consistently
    wrong 的 policy 会产生高 COC 但低 success。ACI 虽然 converge 到接近目标覆盖率（0.89 vs 0.90 target），
    但 ellipsoid volume 仅收窄 6.5%（低于 10% 阈值），说明 ACI 的在线适应相比 static calibration 几乎没有
    tighten confidence region 的效果。原因是 COC 信号太嘈杂，ACI 的 step-size 需要 设得很小才能 converge，导致适应速度极慢，ellipsoid
    几乎不变。

    '

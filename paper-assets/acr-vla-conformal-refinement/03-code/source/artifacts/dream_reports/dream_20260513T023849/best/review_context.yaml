  result_rationale: 'best 档下 6/7 维度显示显著增益（best 档 [5,7]）。增益梯度与 CGS 可检测性直接相关： (1) Camera
    perturbation (+19.5pp)：视角变化导致 VLA 的 action prediction 在 xyz 平移维度上 产生强烈的 inter-sample

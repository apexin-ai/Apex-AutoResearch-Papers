  - name: 'Table 3 row: A1 ablation'
    description: A1 vs full 在各 perturbation level 上的对比
  figures_description:
  - Fig 4 中 A1 对应的柱
  analysis: '4.6pp 差距确认 ACI 是有价值的组件，但不是 ACR-VLA 有效性的主要来源。 主要价值在分布偏移更大的 L4-L5 level
    显现（L3 几乎无差异）。


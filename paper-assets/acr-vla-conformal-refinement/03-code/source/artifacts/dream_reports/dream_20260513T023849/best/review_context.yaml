- name: Ablation A2 — No CRM (CGS + COC + Sample Selection Only)
  plan_id: plan_007
  description: 只用 CGS + COC + ACI 做样本选择（选择 Mahalanobis 距离最小的样本），不做学习型残差校正。类似 ReconVLA
    的多元扩展。
  expected_results:

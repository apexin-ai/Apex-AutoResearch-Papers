  result_rationale: '样本选择（从 K=10 中选最优）能提供一定增益：在 conformal ellipsoid 内选择 Mahalanobis
    距离最小的样本，倾向于选择"最不 outlier"的 action。 但天花板很低——它只能选择已有样本，不能合成更优的 action。当所有 K=10 样本
    在某些 DOF 上都有偏差时（系统性分布偏移），选择最好的样本仍然有显著误差。 CRM 的价值在于它能合成一个优于任何单个样本的 corrected action——特别是
    在不同 DOF 上从不同样本"借鉴"最佳预测。9.3pp 差距量化了"选择 vs 校正"的价值。

    '
  tables:
  - name: 'Table 3 row: A2 ablation'

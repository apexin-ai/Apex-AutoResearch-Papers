    立即检测到 per-DOF variance 变化。 (3) Robot-state perturbation (+16.2pp)：状态空间偏移导致 VLA
    对某些 DOF 的预测 系统性偏移，CRM 学到了针对性校正。 (4) Lighting (+13.4pp)：影响视觉特征，间接导致 action uncertainty
    升高但仍可检测。 (5) Background (+11.8pp)：类似 lighting 但效果稍弱。 (6) Layout (+5.2pp, p=0.042)：物体位置变化需要策略层面的适应，CGS
    能检测到部分 不确定性但 CRM 的 synthetic training 未充分覆盖 layout 变化，增益有限。 (7) Language (+2.1pp,

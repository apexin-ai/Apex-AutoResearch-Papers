narrative_guidance: '原始 framing 完整成立。标题级 claim: "Inference-time dimension-selective
  conformal correction provides orthogonal gains to training-time methods." 三条 claims
  全部通过 kill criteria。Headline: ACR-VLA 在 LIBERO-Plus 上将 base VLA 提升 ~15 pp，叠加 SRPO
  达到 ~89% 新 SOTA。 Per-DOF vs scalar ablation 提供 clean 机制验证。COC 作为自参考信号的有效性是独立贡献点。可冲
  CoRL oral/spotlight。

  '
imagined_experiments:
- name: MVP Point-Reaching
  plan_id: plan_000
  description: 3D point-reaching 环境下 per-DOF vs scalar vs no uncertainty conditioning
    对比
  expected_results:
    status: DONE
    conclusion: SUCCESS
    group4_K10_perDOF_total_mse: 0.0735
    group4_K10_scalar_total_mse: 0.0788
    group4_K10_none_total_mse: 0.0882
    perDOF_vs_none_improvement_pct: 16.7
    perDOF_vs_scalar_improvement_pct: 6.7
  result_rationale: '已完成实验。K=10 Ledoit-Wolf 条件下 per-DOF 对 none 有 16.7% MSE 改善， 对 scalar
    有 6.7% 改善。X 维度（高噪声维度）上 per-DOF 优势最显著， Y/Z 维度 per-DOF 也优于 scalar，验证了跨维度协方差结构可被利用。
    Oracle covariance 到 K=10 estimated 的衰减约 15pp 但 ranking 保持一致。

    '
  tables:
  - name: 'Table S1: MVP Point-Reaching MSE Comparison'
    description: 6 组实验 × 3 条件的完整 MSE 分解
  figures_description:
  - 'Fig S1: Per-DOF MSE bar chart (oracle vs K=10), 展示 X/Y/Z 各维度上三种条件的对比'
  analysis: 'MVP 验证了核心假设：(1) per-DOF > scalar > none 的 ranking 在 K=10 下保持； (2) 高噪声维度获益最大；(3)
    Ledoit-Wolf shrinkage 有效控制了 K=10 的协方差估计误差。 为 VLA 全管线实验提供了信心。

    '
- name: ACR-VLA Full Pipeline on SmolVLA
  plan_id: plan_001
  description: CGS + ACI/COC + CRM 全管线。CRM 在 LIBERO demos + synthetic augmentation
    上训练。评估 LIBERO 名义 + LIBERO-Plus L3-L5。
  expected_results:
    base_smolvla_libero_nominal_success: 97.3
    base_smolvla_libero_plus_success: 57.8
    acr_vla_libero_nominal_success: 96.5
    acr_vla_libero_plus_success: 72.8
    acr_vla_libero_plus_success_gain_abs: 15.0
    libero_nominal_drop: 0.8
    crm_param_count: 131072
    cgs_K: 10
    cgs_shrinkage: ledoit-wolf
    aci_target_coverage: 0.9
    inference_overhead_ms: 12.4
  result_rationale: 'best 档下全部五条核心假设成立。(1) SmolVLA flow-matching 样本的 inter-sample
    协方差结构充分： 7-DOF action 空间中不同维度在分布偏移下展现差异化不确定性膨胀，CGS 提取的 45D 特征 (15-DOF × {std,
    conformal_radius, ellipsoid_volume}) 编码了可利用的结构。 (2) K=10 + Ledoit-Wolf 在 p/n=0.7
    条件下产生足够准确的协方差估计， 条件数从 ~10^4 降至 ~10^2，使 Mahalanobis 距离有意义。 (3) Synthetic augmentation
    覆盖了 camera/noise/robot-state/light/background 5 类扰动， CRM 学到了维度选择性校正模式。(4) ACI+COC
    在 LIBERO-Plus 上在线适应 conformal threshold， 补偿了 synthetic 训练集未覆盖的 layout/language
    偏移。 名义 LIBERO 几乎无衰减因为 CRM 学到了"低 uncertainty 时少干预"——conformal radius 在 nominal
    条件下窄，CRM 的残差输出接近零。15pp 增益分布不均匀，主要来自 camera (+20pp)、 sensor noise (+18pp)、robot-state
    perturbation (+17pp) 等 CGS 可检测的连续偏移。

    '
  tables:
  - name: 'Table 1: LIBERO & LIBERO-Plus Success Rate'
    description: Base SmolVLA vs ACR-VLA, per-task & aggregate, nominal + L3-L5 perturbation
      levels
  - name: 'Table 2: Inference Overhead Breakdown'
    description: K=10 sampling, CGS computation, CRM forward pass 的延迟分解
  figures_description:
  - 'Fig 2: LIBERO-Plus success rate by perturbation level (L3/L4/L5), base vs ACR-VLA'
  - 'Fig 3: Ellipsoid volume heatmap across 7 DOFs × perturbation types, showing dimension-selective
    uncertainty inflation'
  analysis: '15pp 绝对增益落在 best 档 [12,18] 中间偏上。CRM 在高不确定性维度（通常是 xyz 平移） 上施加较大校正，在低不确定性维度（gripper）上几乎不干预。
    名义 LIBERO 仅下降 0.8pp，在统计误差范围内，满足 [0,1] 约束。 131K 参数 CRM 的推理开销 ~12ms 可忽略。

    '
- name: Ablation A3 — CRM without Conformal Features
  plan_id: plan_002
  description: CRM 仅接收 observation embedding 作为输入，无 45D conformal 特征。等价于 A2C2-style
    generic residual。Claim 1 的 make-or-break。
  expected_results:
    a3_libero_plus_success: 60.8
    a3_ablation_gap_no_conformal_vs_full: 12.0
    a3_libero_nominal_success: 96.2
    a3_vs_base_gain: 3.0
  result_rationale: '无 conformal 特征时，CRM 退化为盲目残差预测器。它仍能通过 observation embedding 学到"某些场景可能需要校正"的粗粒度信号，带来
    ~3pp 微弱增益（类似 A2C2 的效果）。 但失去了维度选择性：不知道哪些 DOF 不确定，只能在所有维度上施加相似幅度的残差， 导致在确定维度上引入不必要扰动。12pp
    的差距（best 档 [8,15] 区间内） 确认了 conformal 特征是 ACR-VLA 有效性的核心驱动因素，而非 CRM 架构本身。 这个差距远超
    kill criterion (>2%)，Claim 1 安全通过。

    '
  tables:
  - name: 'Table 3 row: A3 ablation results'
    description: A3 vs full ACR-VLA 在 LIBERO-Plus 各 perturbation level 上的对比
  figures_description:
  - Fig 4 (ablation bar chart) 中 A3 对应的柱
  analysis: '12pp 差距提供了 Claim 1 的最强证据。per-DOF conformal 特征不仅仅是"有帮助"， 而是 ACR-VLA 有效性的主要来源。A3
    在各 perturbation type 上均弱于 full， 但在 camera/noise 上差距最大（因为这些扰动产生的 uncertainty 结构最丰富）。

    '
- name: Ablation A4 — CRM with Scalar Uncertainty
  plan_id: plan_003
  description: CRM 使用 scalar Euclidean distance (à la ReconVLA) 替代 45D per-DOF 特征。验证
    per-DOF > scalar。
  expected_results:
    a4_libero_plus_success: 66.8
    a4_ablation_gap_scalar_vs_perDOF: 6.0
    a4_libero_nominal_success: 96.4
    a4_vs_base_gain: 9.0
    a4_vs_a3_gap: 6.0
  result_rationale: '标量 uncertainty（样本集的 Euclidean 距离均值/方差）仍然携带有意义的信息： "整体上这个时间步不确定"。CRM
    可以据此调整残差幅度（不确定时校正更多）， 比 A3 的盲目残差好得多（+6pp）。但它丢失了跨维度区分——当 xyz 高度不确定而 rotation 确定时，标量信号无法让
    CRM 只校正 xyz。这导致两类损失： (a) 在确定维度上的不必要干预，(b) 在高度不确定维度上校正不足（因为幅度被平均化）。 6pp 差距（best
    档 [4,8]）验证了 per-DOF 结构的独特价值，且与 MVP 中 per-DOF vs scalar 的 6.7% MSE 改善趋势一致。

    '
  tables:
  - name: 'Table 3 row: A4 ablation results'
    description: A4 vs A3 vs full 三路对比
  figures_description:
  - Fig 4 (ablation bar chart) 中 A4 对应的柱
  - 'Fig 5: Per-DOF correction magnitude visualization — A4(scalar) 在所有 DOF 上近似均匀
    vs full(per-DOF) 的选择性模式'
  analysis: 'A4 vs A3 的 6pp 差距说明即使是粗粒度 scalar uncertainty 也有价值。 A4 vs full 的 6pp 差距说明
    per-DOF 结构提供了额外的等量价值。 形成了清晰的 none < scalar < per-DOF 梯度，机制可解释。

    '
- name: ACR-VLA Stacked on SRPO
  plan_id: plan_004
  description: 在 SRPO-finetuned SmolVLA (82.1% LIBERO-Plus SOTA) 上部署 ACR-VLA。训练新 CRM。
  expected_results:
    srpo_baseline_libero_plus: 82.1
    acr_srpo_libero_plus_success: 88.7
    srpo_stacking_gain_abs: 6.6
    srpo_stacked_absolute: 88.7
    acr_srpo_libero_nominal: 97.8
    srpo_libero_nominal: 98.1
    stacking_nominal_drop: 0.3
  result_rationale: 'best 档下第五条假设成立：SRPO 的 RL fine-tuning 虽然收窄了策略分布，但并未完全 消除 epistemic
    uncertainty 结构。关键机制：SRPO 优化了训练分布上的 expected reward 但未见过 LIBERO-Plus 的测试时扰动，因此
    flow-matching 在 OOD 条件下仍展现 差异化的 per-DOF 不确定性——只是基线成功率更高，绝对增益空间更小。 6.6pp 增益（best
    档 [5,8]）主要来自 SRPO 仍然失败的 harder perturbation cases (L4-L5 level camera shift, compound
    perturbations)。这些 case 中 SRPO 的 action prediction 质量虽优于 base VLA，但仍有系统性偏差，CGS
    可检测到并由 CRM 校正。 88.7% 绝对值（best 档 [87,90]）构成 LIBERO-Plus 新 SOTA，且由两个正交方法 (training-time
    RL + inference-time conformal correction) 叠加而成。 名义 LIBERO 几乎无衰减：SRPO checkpoint
    在 nominal 下 uncertainty 极低， CRM 的残差自然趋近于零。

    '
  tables:
  - name: 'Table 1 rows: SRPO baseline, ACR-VLA+SRPO'
    description: SRPO vs ACR-VLA+SRPO 在 LIBERO 和 LIBERO-Plus 各级别上的对比
  - name: 'Table 4: Stacking Analysis'
    description: Base VLA / ACR-VLA / SRPO / ACR-VLA+SRPO 四路交叉对比
  figures_description:
  - 'Fig 6: Stacking bar chart — 四种配置在 LIBERO-Plus L3/L4/L5 上的成功率'
  - 'Fig 7: Venn diagram of failure cases — ACR-VLA alone vs SRPO alone vs stacked
    的失败集合交集分析'
  analysis: '6.6pp stacking gain 远超 kill criterion (>2%)，Claim 3 安全通过。 失败集合分析是关键证据：ACR-VLA
    和 SRPO 各自修复的 failure case 交集很小（<30%）， 说明二者确实正交。SRPO 修复的主要是 policy quality 问题（action
    mean 偏差）， ACR-VLA 修复的主要是 uncertainty-driven 问题（高 variance 维度上的 outlier action）。
    88.7% 标题数字有力支撑"orthogonal gains"叙事。

    '
- name: COC Signal Validation
  plan_id: plan_005
  description: COC coverage fraction 与 task success 的 Spearman ρ；ACI 收敛曲线；ellipsoid
    volume vs static calibration。
  expected_results:
    coc_success_spearman_rho: 0.61
    coc_spearman_p_value: 3.0e-05
    aci_converged_episodes: 47
    aci_convergence_steps_median: 85
    aci_mean_coverage_after_convergence: 0.893
    aci_ellipsoid_volume_narrowing_pct: 28.0
    static_calibration_coverage_actual: 0.78
    aci_calibration_coverage_actual: 0.89
  result_rationale: 'best 档下第三条假设成立：COC chunk overlap consistency 与 task success 存在强相关。
    机制：成功 trajectory 中相邻 chunk 预测的重叠区域高度一致（overlap consistency > 0.85）， 因为 VLA 在正确执行时对未来
    action 的预测稳定。失败 trajectory 中 VLA 的预测在 连续时间步间波动，overlap consistency 下降到 0.4-0.6。
    ρ=0.61（best 档 [0.5,0.7]）反映了这不是完美信号（有些失败 case 中 VLA 自信但错误）， 但足以作为有效的 ACI 更新信号。
    ACI 使用 COC 信号在线调整 conformal threshold：高 COC 时收紧（减小 ellipsoid）， 低 COC 时放松（增大 ellipsoid）。28%
    的 volume narrowing（best 档 [20,35]） 意味着 ACI 在分布偏移下能动态收缩到比 static calibration 更紧的
    conformal set， 同时维持 ~0.89 的有效覆盖率。Static calibration 在 LIBERO-Plus 上实际覆盖率 降至 0.78（因为
    calibration set 和 test 分布不匹配），ACI 修复了这个问题。

    '
  tables:
  - name: 'Table 5: COC-Success Correlation Analysis'
    description: Spearman ρ, p-value, per-task breakdown
  - name: 'Table 6: ACI vs Static Calibration'
    description: Coverage, ellipsoid volume, success rate 的对比
  figures_description:
  - 'Fig 8: Scatter plot — episode COC coverage fraction vs binary task success, with
    marginal histograms'
  - 'Fig 9: ACI convergence curve — running coverage rate over episodes, with target
    0.9 line'
  - 'Fig 10: Ellipsoid volume time series — ACI (adaptive) vs static, showing narrowing
    under distribution shift'
  analysis: 'ρ=0.61 是 Claim 2 的核心证据。COC 作为 self-referential 信号不需要外部 reward， 这是区别于
    episode-level ACI (需要 task success label) 的关键优势。 28% volume narrowing 说明 ACI 不只是维持覆盖——它在提供更紧（更有信息量）的
    conformal set。 ACI 的 0.89 vs static 的 0.78 实际覆盖率差异直接说明了在线适应的价值。

    '
- name: Ablation A1 — No ACI (Static Calibration)
  plan_id: plan_006
  description: CRM 使用 static CGS calibration，无在线 ACI 更新。隔离 ACI 贡献。
  expected_results:
    a1_libero_plus_success: 68.2
    a1_vs_full_gap: 4.6
    a1_libero_nominal_success: 96.8
    a1_effective_coverage_libero_plus: 0.78
  result_rationale: '去掉 ACI 后，conformal threshold 固定在 calibration set 上的值。在 LIBERO
    nominal 上几乎无差异（分布匹配，static 和 adaptive 给出类似 threshold）。 但在 LIBERO-Plus 上，分布偏移使得
    static threshold 过于宽松或过于严格 （取决于具体 perturbation type）：camera shift 下 uncertainty
    系统性增大但 static threshold 不变，导致 conformal set 过大，CRM 得到的特征信噪比下降。 4.6pp 差距说明 ACI
    的自适应能力贡献显著但非主导——CRM + static CGS 本身仍然 捕获了大部分 per-DOF 结构信息，只是 calibration 不够精准。

    '

- name: Ablation A5 — CGS (Joint Mahalanobis) vs Per-DOF Bonferroni
  plan_id: plan_009
  description: 比较联合 Mahalanobis 非conformity score 与 per-DOF Bonferroni 校正的独立 CP。
  expected_results:
    a5_bonferroni_libero_plus_success: 69.4
    a5_vs_full_gap: 3.4
    a5_bonferroni_effective_coverage: 0.86
    a5_bonferroni_ellipsoid_volume_ratio: 1.35
  result_rationale: 'Bonferroni 校正对 7 个 DOF 独立做 CP，将 per-DOF 覆盖率设为 1-(α/7) 以保证 联合覆盖。这有两个损失：(1)
    过度保守——Bonferroni 假设最坏情况独立性， 实际维度间存在正相关，导致 conformal set 过大（volume 比 CGS 大 35%）；
    (2) 丢失跨维度协方差信息——CGS 的 Mahalanobis 距离编码了"xyz 一起偏 vs 只有 x 偏" 的区别，Bonferroni 无法捕获这一结构。3.4pp
    差距虽不巨大但一致， 验证了 multivariate CP (CGS) 相比 naive per-DOF CP 的优势。

    '
  tables:
  - name: 'Table S2: CGS vs Bonferroni CP Comparison'
    description: Coverage, volume, CRM downstream success rate
  figures_description:
  - 'Fig S2: Conformal ellipsoid vs Bonferroni box — 2D projection 可视化 (选择协方差最大的两个
    DOF)'
  analysis: '3.4pp 差距说明 CGS 的联合 Mahalanobis approach 有实际价值，但主要效果来自 更紧的 conformal set（volume
    小 26%）给 CRM 提供了更高信噪比的特征。 这是 supplementary 级别的结果，支撑方法论选择但不构成独立 claim。

    '
- name: Ablation A6 — COC Signal vs Episode-Level Task Success for ACI
  plan_id: plan_010
  description: 对比 COC (per-step self-referential) 和 episode-level task success (外部监督)
    作为 ACI 更新信号。
  expected_results:
    a6_episode_aci_libero_plus_success: 72.1
    a6_coc_aci_libero_plus_success: 72.8
    a6_gap: 0.7
    a6_episode_aci_convergence_speed_episodes: 120
    a6_coc_aci_convergence_speed_episodes: 47
    a6_coc_advantage_early_episodes_success: 4.2
  result_rationale: 'COC 和 episode-level ACI 在充分收敛后达到相似的最终性能（差距 <1pp）， 因为两者最终都收敛到正确的
    conformal threshold。但 COC 有两个关键优势： (1) 收敛速度快 2.5x（47 vs 120 episodes），因为 COC 提供
    per-step 信号（每步一个 consistency 分数）而 episode-level 仅提供 per-episode 二值信号（成功/失败）； (2)
    不需要外部 task success 标签——部署时可能没有 reward signal。 早期 episode（前 50 个）中 COC-ACI 比 episode-ACI
    高 4.2pp， 说明快速适应在实际部署中有价值。

    '
  tables:
  - name: 'Table S3: COC-ACI vs Episode-ACI'
    description: Convergence speed, final performance, early performance
  figures_description:
  - 'Fig S3: ACI convergence curve — COC vs episode-level, showing faster convergence
    of COC'
  analysis: '最终性能近似说明 ACI 的 asymptotic 行为不依赖信号源质量（只要信号与 coverage 相关，最终都收敛到 target
    coverage）。COC 的价值在于 (a) 收敛速度, (b) 无需外部监督。 这是 Claim 2 的"自参考"子论点的独立验证。

    '
- name: Ablation A7 — DiU Aleatoric vs CGS Epistemic Features
  plan_id: plan_011
  description: CRM 分别使用 DiU aleatoric features (7D)、CGS epistemic features (45D)、combined
    (52D) 作为输入。
  expected_results:
    a7_diu_aleatoric_libero_plus_success: 63.9
    a7_cgs_epistemic_libero_plus_success: 72.8
    a7_combined_52d_libero_plus_success: 73.5
    a7_diu_vs_cgs_gap: 8.9
    a7_combined_vs_cgs_gap: 0.7
    a7_diu_libero_nominal_success: 94.8
    a7_diu_nominal_drop: 2.5
  result_rationale: 'DiU 估计的 aleatoric uncertainty 反映数据固有噪声，在 nominal 和 OOD 条件下 都可能较高（如
    gripper action 本身就有 stochasticity）。这导致两个问题： (1) 在 nominal 条件下 CRM 过度干预（2.5pp drop），因为
    aleatoric uncertainty 在正常情况下也不为零，CRM 无法区分"固有噪声"和"需要校正"； (2) 在 OOD 条件下信号不如 epistemic
    清晰——CGS 的 epistemic uncertainty 在 分布偏移时显著升高而在 nominal 时低，提供了更干净的"是否需要校正"信号。 Combined
    52D 仅比 CGS 45D 好 0.7pp：aleatoric 信息的边际价值很小， 因为 epistemic features 已经捕获了绝大部分可利用的结构。
    这验证了 paper framing 中"CGS captures epistemic, DiU captures aleatoric"的区分， 以及 epistemic
    uncertainty 对 action correction 更有用的论点。

    '
  tables:
  - name: 'Table S4: Epistemic vs Aleatoric Uncertainty Features'
    description: DiU / CGS / Combined 三路对比, nominal + LIBERO-Plus
  figures_description:
  - 'Fig S4: Per-DOF uncertainty magnitude — DiU vs CGS 在 nominal 和 OOD 条件下的分布对比'
  analysis: '8.9pp 差距是对 reviewer concern "DiU 更高效" 的直接回应：效率不是唯一考量， epistemic vs aleatoric
    的信号质量差异更重要。DiU 在 nominal 上的 2.5pp drop 是额外的 evidence point——aleatoric conditioning
    在没有分布偏移时反而有害。 Combined 的微弱改善不 justify 52D 的额外复杂度，支持了 45D CGS-only 的设计选择。

    '
- name: Feature Importance Analysis
  plan_id: plan_012
  description: CRM 对 45 个 uncertainty 特征的梯度 magnitude 分析，按 perturbation type 分解。
  expected_results:
    top_features_overall:
    - conformal_radius_x
    - conformal_radius_y
    - conformal_radius_z
    - std_x
    - ellipsoid_volume
    - std_y
    conformal_radius_gradient_share: 0.48
    std_gradient_share: 0.31
    ellipsoid_volume_gradient_share: 0.21
    camera_perturbation_top_feature: conformal_radius_x
    noise_perturbation_top_feature: std_z
    robot_state_top_feature: conformal_radius_joint3
  result_rationale: 'Conformal radius 是最重要的特征类别（48% gradient share），因为它直接编码了 "在该 DOF
    上 conformal set 有多宽"——这是 calibrated 的 uncertainty measure， 比 raw std 更稳定。Per-DOF
    std 次之（31%），提供互补的 raw dispersion 信息。 Ellipsoid volume（全局标量）虽然只有 21% 但在所有 perturbation
    type 上贡献一致， 作为"整体 uncertainty level"的 contextual feature。 关键发现：不同 perturbation
    type 下 CRM 关注的 DOF 不同——camera shift 主要 影响 xyz 平移因此 conformal_radius_{x,y,z} 梯度高；robot-state
    perturbation 主要影响关节角因此 conformal_radius_joint* 梯度高。这是"维度选择性校正"的 直接机制证据。

    '
  tables:
  - name: 'Table 8: Feature Importance by Category'
    description: 3 feature categories × 7 perturbation types 的 gradient magnitude
      matrix
  figures_description:
  - 'Fig 13: Feature importance heatmap — 45 features × 7 perturbation types, gradient
    magnitude'
  - 'Fig 14: Top-3 features per perturbation type, showing dimension-selective attention
    pattern'
  analysis: 'Feature importance 分析提供了 Claim 1 的机制解释：CRM 不是黑盒——它确实在利用 per-DOF conformal
    结构做维度选择性校正。不同 perturbation 下关注不同 DOF 的模式 与物理直觉一致。这是 reviewer 最可能 appreciate 的
    interpretability result。

    '
- name: SnapFlow Integration — K=10 × 1-Step Distilled Sampling
  plan_id: plan_013
  description: 用 SnapFlow 1-step distilled generation 替代标准 flow-matching 多步采样。测试样本多样性和推理加速。
  expected_results:
    snapflow_libero_plus_success: 71.2
    snapflow_vs_full_gap: 1.6
    snapflow_sample_diversity_ratio: 0.87
    snapflow_inference_time_ms: 38
    standard_inference_time_ms: 185
    snapflow_speedup: 4.9
    snapflow_libero_nominal_success: 96.1
  result_rationale: 'SnapFlow 1-step distilled generation 将 K=10 的采样时间从 ~185ms 降至
    ~38ms (4.9x speedup)，因为跳过了 flow-matching 的迭代 ODE 求解。 样本多样性保留 87%（用 K=10 样本集的 average
    pairwise distance 衡量）： distillation 轻微压缩了分布尾部，但核心的 inter-sample covariance 结构保留。
    LIBERO-Plus 上仅损失 1.6pp，因为 CGS 在稍低多样性下仍能提取有意义的 per-DOF 特征——Ledoit-Wolf shrinkage
    对 slightly lower effective K 鲁棒。 这为实时部署场景提供了 practical speedup 且性能损失可接受。

    '
  tables:
  - name: 'Table S5: SnapFlow vs Standard Sampling'
    description: Inference time, sample diversity, downstream success
  figures_description:
  - 'Fig S5: Inference time breakdown — standard vs SnapFlow, showing per-component
    cost'
  analysis: 4.9x speedup 在 1.6pp 代价下是合理的 engineering tradeoff。 87% 样本多样性保留说明 1-step
    distillation 保留了足够的 epistemic information。 这不是核心科学贡献但是重要的 practical result，回应了
    reviewer 可能的 "K=10 采样太慢" concern。可放在 supplementary 或 practical considerations
    section。

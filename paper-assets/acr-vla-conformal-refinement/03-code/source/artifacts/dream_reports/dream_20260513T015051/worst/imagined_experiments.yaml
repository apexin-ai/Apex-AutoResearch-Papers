    5.25× ratio clearly visible.'
  analysis: 'The gradient analysis provides the mechanistic autopsy of Claim 1''s
    failure. CRM learned to ignore conformal features because they are uninformative
    (near-spherical, perturbation-agnostic). The network allocated its limited capacity
    to observation features, which do carry perturbation-discriminative information.
    This is rational behavior by the optimizer — it confirms the features are genuinely
    useless, not that the architecture is wrong.

    '
- name: SnapFlow K=10 1-step Distilled Generation
  plan_id: plan_013
  description: 'K=10 samples via 1-step distilled flow matching (SnapFlow). Test sample
    diversity and inference speed.

    '
  expected_results:
    snapflow_inference_time_ms: 12
    standard_10step_inference_time_ms: 38
    speedup_factor: 3.17
    snapflow_sample_diversity_avg_std_per_dof: 0.018
    standard_sample_diversity_avg_std_per_dof: 0.031
    diversity_reduction_pct: 42
    snapflow_acr_liberoplus_sr_pct: 63.8
    standard_acr_liberoplus_sr_pct: 65.1
    snapflow_degradation_pp: 1.3
  result_rationale: 'SnapFlow''s 1-step distilled generation produces K=10 samples
    3.17× faster but with 42% less diversity (per-DOF std drops from 0.031 to 0.018).
    The diversity reduction directly impacts conformal statistics: the already-noisy
    K=10 covariance becomes even more concentrated, with shrinkage intensity increasing
    from 0.71 to ~0.82. The 1.3pp performance drop (65.1→63.8) is modest because,
    as established, conformal features contribute little — the degradation comes from
    reduced sample diversity slightly weakening the mean-action estimate that CRM
    uses as its base. The 3.17× speedup is the only unambiguous positive result, but
    it''s a SnapFlow contribution, not an ACR-VLA contribution. For the reframed paper,
    this could be cited as evidence that the pipeline is practical at inference time,
    but it doesn''t save the conformal features story.

    '
  tables:
  - name: 'Table 13: SnapFlow Integration'
    rows:
    - method: ACR-VLA (10-step sampling)
      inference_ms: 38
      liberoplus_sr: 65.1
      sample_diversity: 0.031
    - method: ACR-VLA + SnapFlow (1-step)
      inference_ms: 12
      liberoplus_sr: 63.8
      sample_diversity: 0.018
  figures_description:
  - 'Fig 16: Sample diversity (per-DOF std) histogram for 10-step vs SnapFlow 1-step.
    SnapFlow distribution is sharply concentrated near zero, further compressing the
    covariance estimate.'
  analysis: 'SnapFlow trades diversity for speed. In the worst case, this further
    degrades already-insufficient conformal features. The practical takeaway: if conformal
    features are noise anyway, SnapFlow''s speedup is free — the system loses nothing
    by using faster, less diverse samples because the conformal pathway was already
    inert.'

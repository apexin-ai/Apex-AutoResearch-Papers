  result_rationale: 'Gradient analysis reveals that CRM overwhelmingly attends to
    observation embedding dimensions (avg gradient magnitude 0.042) over conformal
    features (0.008) — a 5.25× ratio. The top 5 features by gradient magnitude are
    all observation embedding or base action dimensions; no conformal feature appears
    in the top 20. Furthermore, conformal feature gradients show near-zero variance
    across perturbation types (std 0.002), meaning CRM does not differentially use
    conformal features for different perturbation types — it has learned to effectively
    ignore them. The maximum gradient magnitude for any conformal feature under any
    perturbation (0.014) is still 3× lower than the average observation feature gradient.
    This is the mechanistic explanation for A3''s result: CRM''s learned weights suppress
    the noisy conformal features and rely on observation conditioning for correction
    decisions.

    '

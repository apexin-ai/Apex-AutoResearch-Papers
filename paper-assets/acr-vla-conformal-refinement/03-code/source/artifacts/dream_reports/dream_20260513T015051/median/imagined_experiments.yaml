tier: median
narrative_guidance: 'Claims need recalibration. Claim 1: reframe from "per-DOF conformal
  features enable dimension-selective correction" to "structured uncertainty features
  from multivariate CP provide complementary conditioning signal for learned action
  correction." De-emphasize per-DOF vs scalar ablation (A4), emphasize conformal-vs-none
  ablation (A3). Claim 2: downgrade COC from "reliable self-referential signal" to
  "lightweight proxy enabling online adaptation without external supervision" — emphasize
  the no-supervision property rather than per-step reliability. Claim 3: reframe as
  "complementary in principle" with caveat that training-time methods capture most
  low-hanging fruit. Shift headline to CGS+CRM framework contribution. Feature importance
  analysis shows CRM uses conformal features but not in a neatly dimension-selective
  way. Still a method paper, positioned more as architectural contribution than empirical
  leap.

  '
imagined_experiments:
- name: ACR-VLA Full Pipeline on SmolVLA
  plan_id: plan_001
  description: 'Full ACR-VLA pipeline: CGS (K=10, Ledoit-Wolf) + ACI/COC + CRM (131K
    params). CRM trained on LIBERO demos + synthetic augmentation (camera jitter,
    Gaussian action noise, robot-state perturbation). Evaluated on LIBERO 10-task
    nominal suite and LIBERO-Plus L3–L5.

    '
  expected_results:
    base_smolvla_libero_nominal_sr_pct: 95.0
    acrvla_libero_nominal_sr_pct: 93.0
    libero_nominal_degradation_pp: 2.0
    base_smolvla_liberoplus_avg_sr_pct: 62.0
    base_smolvla_liberoplus_L3_sr_pct: 72.0
    base_smolvla_liberoplus_L4_sr_pct: 60.0
    base_smolvla_liberoplus_L5_sr_pct: 54.0
    acrvla_liberoplus_avg_sr_pct: 68.0
    acrvla_liberoplus_L3_sr_pct: 78.0
    acrvla_liberoplus_L4_sr_pct: 66.0
    acrvla_liberoplus_L5_sr_pct: 60.0
    delta_over_base_liberoplus_sr_pp: 6.0
    crm_inference_latency_ms: 1.8
    cgs_inference_latency_ms: 12.5
    total_pipeline_overhead_pct: 8.0
  result_rationale: 'Median tier assumes CRM learns a useful correction but most gain
    comes from the observation-conditioned residual pathway, not from conformal feature
    conditioning specifically. The 6pp gain over base reflects: (a) CRM successfully
    learns to correct high-error actions using observation context (~3.5pp), (b) conformal
    features provide additional complementary signal (~2.5pp via A3 gap), (c) ACI
    online adaptation contributes modest further improvement (~0.5-1pp). K=10 covariance
    is noisy — Ledoit-Wolf shrinkage rescues the Mahalanobis ellipsoid from collapse
    but the conformal radii carry less precise directional information than oracle
    covariance would. The 2pp nominal degradation comes from CRM occasionally over-correcting
    on in-distribution steps where conformal features show mild uncertainty (false
    positive corrections). Synthetic augmentation covers camera/noise/robot-state
    well but cannot cover layout or language perturbations, limiting L5 gains. The
    pipeline clears the P0 threshold (>4pp gain) but falls short of the optimistic
    tier''s 8-12pp that would require conformal features to provide genuinely dimension-selective
    correction.

    '
  tables:
  - name: 'Table 1: Main Results — LIBERO and LIBERO-Plus Success Rate'
    content: '| Method               | LIBERO (nom.) | LP-L3  | LP-L4  | LP-L5  |
      LP-Avg |

      |----------------------|---------------|--------|--------|--------|--------|

      | SmolVLA (base)       | 95.0          | 72.0   | 60.0   | 54.0   | 62.0   |

      | + ACR-VLA (ours)     | 93.0          | 78.0   | 66.0   | 60.0   | 68.0   |

      | Δ                    | -2.0          | +6.0   | +6.0   | +6.0   | +6.0   |

      '
  figures_description:
  - 'Fig 2a: Bar chart comparing SmolVLA base vs ACR-VLA across LIBERO nominal and
    LIBERO-Plus L3/L4/L5. Shows consistent +6pp on all LP levels with -2pp nominal
    trade-off.'
  - 'Fig 2b: Per-task breakdown heatmap on LIBERO nominal (10 tasks × 2 methods).
    Shows ACR-VLA matches or slightly underperforms base on most tasks, with 1-3pp
    drops on 3-4 tasks where CRM over-corrects.'
  analysis: 'The 6pp average gain is real but moderate. Uniform improvement across
    L3-L5 suggests CRM learns a general correction rather than dimension-specific
    adaptation — consistent with median tier''s hypothesis that the gain is primarily
    observation-conditioned. The 2pp nominal degradation is within acceptable range
    but noteworthy; a gating mechanism or confidence threshold on CRM activation could
    reduce it. The result supports reframing Claim 1 around "structured uncertainty
    as complementary conditioning signal" rather than "dimension-selective correction."

    '
- name: Ablation A3 — CRM without Conformal Features
  plan_id: plan_002
  description: 'CRM receives only observation features (visual embedding + proprioception
    + base action) but no CGS-derived conformal statistics. Equivalent to an A2C2-style
    generic learned residual. MAKE-OR-BREAK for Claim 1.

    '
  expected_results:
    a3_no_conformal_liberoplus_avg_sr_pct: 64.5
    a3_gap_full_vs_no_conformal_pp: 3.5
    a3_no_conformal_libero_nominal_sr_pct: 94.0
    a3_no_conformal_liberoplus_L3_sr_pct: 74.0
    a3_no_conformal_liberoplus_L4_sr_pct: 63.0
    a3_no_conformal_liberoplus_L5_sr_pct: 56.5
  result_rationale: 'The 3.5pp gap (64.5% vs 68.0%) confirms conformal features contribute
    meaningful signal beyond pure observation-conditioned residual learning, but the
    gap is modest — in the [2,5] range rather than the >5pp that would indicate strong
    dimension-selective correction. The A3 variant still achieves +2.5pp over bare
    base (62%), showing that CRM''s observation-conditioned residual learning captures
    substantial value independently. This is the median tier''s core insight: CRM
    is architecturally valuable as a learned correction module, and conformal features
    improve it, but conformal conditioning is a complementary signal rather than the
    primary driver. The gap passes the kill criterion (>2pp) so Claim 1 survives but
    requires reframing. Nominal degradation is slightly lower (1pp vs 2pp) because
    without conformal features, CRM is less aggressive in its corrections, producing
    fewer false-positive over-corrections on in-distribution data.

    '
  tables:
  - name: 'Table 2 (row): A3 ablation within main ablation table'
    content: '| Variant                    | LIBERO (nom.) | LP-Avg | Δ vs Full |

      |----------------------------|---------------|--------|-----------|

      | ACR-VLA (full)             | 93.0          | 68.0   | —         |

      | A3: CRM w/o conformal      | 94.0          | 64.5   | -3.5      |

      '
  figures_description:
  - 'Fig 3 (ablation bar chart): A3 bar adjacent to full ACR-VLA and base. Clearly
    shows A3 intermediate between base and full, with 3.5pp gap. Error bars (95% CI
    over 3 seeds) likely overlap partially — gap is statistically significant but
    not dramatic.'
  analysis: 'The 3.5pp gap is the most important number in the paper. It clears the
    2pp kill criterion but sits squarely in the median range. In the paper, this should
    be presented as: "removing conformal features reduces LIBERO-Plus SR by 3.5pp,
    confirming that CGS-derived uncertainty statistics provide complementary conditioning
    signal for CRM beyond what observation features alone can supply." Avoid framing
    as "enabling dimension-selective correction" since the gap size and feature importance
    analysis (plan_012) won''t support that stronger claim. Reviewers may note that
    3.5pp with overlapping CIs is modest — prepare to emphasize that this is a consistent
    improvement across perturbation types and seeds, plus the architectural contribution
    argument.

    '
- name: Ablation A4 — CRM with Scalar Uncertainty
  plan_id: plan_003
  description: 'CRM receives scalar uncertainty (Euclidean distance from calibration
    set mean, à la ReconVLA) instead of 45D per-DOF conformal features. Tests whether
    per-DOF structure provides value beyond a single scalar.

    '
  expected_results:
    a4_scalar_liberoplus_avg_sr_pct: 66.0
    a4_gap_perDOF_vs_scalar_pp: 2.0
    a4_scalar_libero_nominal_sr_pct: 93.5
    a4_scalar_liberoplus_L3_sr_pct: 76.0
    a4_scalar_liberoplus_L4_sr_pct: 64.0
    a4_scalar_liberoplus_L5_sr_pct: 58.0
  result_rationale: 'The 2pp gap (66% vs 68%) confirms per-DOF features are better
    than scalar, but the margin is slim — consistent with median tier''s assumption
    that per-DOF advantage comes primarily through marginal information (per-DOF std
    and radius independently) rather than cross-DOF covariance structure. A scalar
    summary statistic already captures "how uncertain is this action overall," which
    accounts for much of the useful signal. The remaining 2pp comes from CRM having
    access to which specific DOFs are uncertain, enabling modestly better residual
    allocation. But because K=10 covariance is noisy, the rich covariance structure
    that would enable truly dimension-selective correction is attenuated. The scalar
    variant (66%) vs no-conformal variant (64.5%) shows only 1.5pp gap between scalar
    and no uncertainty — meaning even a crude uncertainty scalar helps, and the per-DOF
    structure adds incrementally on top. This stacking of gaps (A3 → A4 → full) is
    consistent but none of the individual gaps are large.

    '
  tables:
  - name: 'Table 2 (row): A4 ablation'
    content: '| Variant                     | LIBERO (nom.) | LP-Avg | Δ vs Full |

      |---------------------------- |---------------|--------|-----------|

      | ACR-VLA (full, 45D)         | 93.0          | 68.0   | —         |

      | A4: CRM w/ scalar uncert.   | 93.5          | 66.0   | -2.0      |

      | A3: CRM w/o conformal       | 94.0          | 64.5   | -3.5      |

      '
  figures_description:
  - 'Fig 3 (extended): Stacked bar or grouped bar showing base → A3 → A4 → full progression.
    Visualizes the incremental contribution: observation residual (+2.5), scalar uncertainty
    (+1.5), per-DOF structure (+2.0).'
  analysis: 'The A4 gap (2pp) is modest and should be de-emphasized in the paper per
    the narrative guidance. Rather than claiming "per-DOF > scalar," present it as
    part of the ablation ladder: "uncertainty features improve CRM regardless of representation
    (scalar +1.5pp, structured 45D +3.5pp over no uncertainty), with structured features
    providing additional value through per-DOF granularity." The 2pp gap may not survive
    reviewer scrutiny as a standalone claim — it likely requires 5+ seeds to achieve
    statistical significance. In the median tier, this becomes supporting evidence
    rather than a headline result.

    '
- name: ACR-VLA Stacked on SRPO
  plan_id: plan_004
  description: 'Train a new CRM on SRPO-finetuned SmolVLA checkpoint using LIBERO
    demos. Evaluate on LIBERO-Plus to test orthogonal complementarity with training-time
    optimization (Claim 3).

    '
  expected_results:
    srpo_base_liberoplus_avg_sr_pct: 82.1
    srpo_acrvla_liberoplus_avg_sr_pct: 84.0
    srpo_stacking_gain_pp: 1.9
    srpo_acrvla_libero_nominal_sr_pct: 96.5
    srpo_base_libero_nominal_sr_pct: 97.0
    srpo_nominal_degradation_pp: 0.5
    srpo_acrvla_liberoplus_L3_sr_pct: 89.0
    srpo_acrvla_liberoplus_L4_sr_pct: 83.0
    srpo_acrvla_liberoplus_L5_sr_pct: 80.0
  result_rationale: 'SRPO''s training-time optimization has already captured most
    of the correctable error — its 82.1% baseline is 20pp above the base SmolVLA''s
    62%. The residual errors at 82.1% are predominantly from perturbation types that
    synthetic augmentation cannot cover (layout changes, language variation) and from
    hard task instances where the observation itself is insufficient. CRM''s observation-conditioned
    residual finds less room to improve because SRPO has already learned robust representations.
    The conformal features are also less informative because SRPO''s action distribution
    is already tighter under perturbation (lower epistemic uncertainty → less signal
    for CGS). The 1.9pp stacking gain is real but marginal — consistent with median
    tier''s "complementary in principle" framing. The gain comes primarily from camera
    and noise perturbations where synthetic augmentation provides coverage and CRM
    can still make useful corrections on top of SRPO. Nominal degradation is only
    0.5pp because SRPO''s stronger base representations make CRM''s false-positive
    over-corrections less likely. The absolute 84.0% sets a new SOTA but the marginal
    gain is not compelling as a standalone selling point.

    '
  tables:
  - name: 'Table 3: Stacking on SRPO'
    content: '| Method                  | LIBERO (nom.) | LP-Avg | LP-L3 | LP-L4 |
      LP-L5 |

      |-------------------------|---------------|--------|-------|-------|-------|

      | SRPO (SOTA)             | 97.0          | 82.1   | 87.0  | 81.0  | 78.3  |

      | SRPO + ACR-VLA (ours)   | 96.5          | 84.0   | 89.0  | 83.0  | 80.0  |

      | Δ                       | -0.5          | +1.9   | +2.0  | +2.0  | +1.7  |

      '
  figures_description:
  - 'Fig 4: Comparison chart showing ACR-VLA on SmolVLA base (+6pp) vs ACR-VLA on
    SRPO (+1.9pp). Illustrates diminishing returns as base improves, supporting ''complementary
    in principle'' framing.'
  analysis: 'The 1.9pp stacking gain falls below the 2pp threshold in the kill criterion
    for Claim 3, putting the claim in a borderline position. With standard error bars
    over 3 seeds, 1.9pp may or may not be statistically significant. In the median
    tier, Claim 3 is downgraded to "complementary in principle" — the paper should
    acknowledge that SRPO captures most correctable error and position stacking as
    demonstrating architectural compatibility rather than a compelling empirical lift.
    The headline result shifts to the +6pp on base SmolVLA as the primary contribution,
    with SRPO stacking as a secondary data point. The new SOTA of 84.0% is still reportable
    but should not be the paper''s primary selling point.

    '
- name: COC Signal Validation
  plan_id: plan_005
  description: 'Validate Chunk Overlap Consistency as self-referential ACI signal:
    (a) Spearman ρ(COC coverage fraction, task success) across episodes, (b) ACI α_t
    convergence trajectory, (c) ACI-adapted ellipsoid volume vs static calibration
    at matched empirical coverage.

    '
  expected_results:
    coc_success_spearman_rho: 0.4
    coc_success_spearman_p_value: 0.002
    aci_converges_within_episodes: 120
    aci_steady_state_alpha: 0.12
    aci_target_coverage: 0.9
    aci_achieved_coverage_mean: 0.88
    aci_achieved_coverage_std: 0.04
    ellipsoid_volume_static_calibration: 1.0
    ellipsoid_volume_aci_adapted_relative: 0.85
    aci_ellipsoid_volume_narrowing_pct: 15.0
    coc_per_step_accuracy_as_binary_classifier: 0.62
  result_rationale: 'COC correlates with task success at ρ=0.40 — statistically significant
    but weak. Episodes with consistently high COC agreement (overlapping action chunks
    agree with each other) tend to succeed more often, but the per-step signal is
    noisy (62% accuracy as binary success predictor). This is because chunk overlap
    measures temporal consistency of the policy, which correlates with but does not
    cause success — a policy can be consistently wrong (high COC, low success) or
    succeed despite occasional inconsistency. ACI converges within ~120 episodes because
    the weak but consistent signal is sufficient for slow exponential-moving-average
    adaptation of the conformal threshold α_t. The 15% ellipsoid volume narrowing
    shows ACI tightens prediction sets modestly compared to static calibration — it
    detects distribution shift and adjusts, but the noisy COC signal prevents aggressive
    tightening. Achieved coverage (88%) undershoots the 90% target slightly due to
    COC noise causing occasional over-tightening. This profile supports reframing
    COC as "lightweight proxy enabling online adaptation without external supervision"
    — the key value is not per-step reliability but the ability to adapt without any
    ground-truth task success signal.

    '
  tables:
  - name: 'Table 4: COC Signal Quality'
    content: '| Metric                              | Value         |

      |-------------------------------------|---------------|

      | Spearman ρ (COC, task success)       | 0.40 (p=.002) |

      | COC per-step binary accuracy         | 62%           |

      | ACI convergence episodes             | ~120          |

      | ACI target / achieved coverage       | 90% / 88±4%  |

      | Ellipsoid volume narrowing (vs static)| 15%          |

      '
  figures_description:
  - 'Fig 5a: Scatter plot of episode-level COC coverage fraction vs binary task success.
    Shows positive trend (ρ=0.40) with substantial scatter — many episodes with high
    COC still fail, and some low-COC episodes succeed.'
  - 'Fig 5b: ACI α_t convergence trajectory over 200 episodes. Shows initial oscillation
    (ep 0-50), gradual convergence (ep 50-120), and steady-state fluctuation around
    α=0.12 (ep 120+).'
  - 'Fig 5c: Violin plot comparing ellipsoid volumes under static calibration vs ACI-adapted,
    at matched ~88% empirical coverage. ACI distribution is tighter (15% narrower)
    but with longer tail.'
  analysis: 'The ρ=0.40 result is the best the paper can honestly report for COC as
    a self-referential signal. It clears the 0.3 kill threshold but is far from the
    0.6+ that would support "reliable" characterization. The paper should position
    this as: "COC provides a lightweight, supervision-free proxy for ACI adaptation
    that achieves meaningful ellipsoid tightening (15%) without requiring any external
    task success signal — trading per-step reliability for complete autonomy." The
    62% per-step accuracy should be reported honestly as a limitation. The convergence
    within 120 episodes is adequate for deployment scenarios but means ACI is a slow-adaptation
    mechanism, not a real-time reliability signal.

    '
- name: Ablation A1 — CRM without ACI (Static Calibration)
  plan_id: plan_006
  description: 'CRM with static CGS calibration (fixed α from calibration set, no
    ACI online adaptation). Isolates the contribution of ACI/COC online threshold
    adjustment.

    '
  expected_results:
    a1_static_liberoplus_avg_sr_pct: 66.5
    a1_static_libero_nominal_sr_pct: 93.0
    a1_gap_vs_full_pp: 1.5
    a1_static_liberoplus_L3_sr_pct: 77.0
    a1_static_liberoplus_L4_sr_pct: 65.0
    a1_static_liberoplus_L5_sr_pct: 57.5
  result_rationale: 'ACI''s online adaptation contributes a modest 1.5pp over static
    calibration. Static CGS with a fixed threshold calibrated on the nominal distribution
    still produces useful conformal features — the per-DOF std and radius estimates
    are driven primarily by sample diversity rather than threshold tuning. Under distribution
    shift, static calibration''s conformal sets are overly conservative (too wide
    ellipsoids), meaning CRM receives inflated uncertainty features that reduce its
    correction precision. ACI''s 15% volume narrowing translates to CRM making slightly
    more targeted corrections. However, the improvement is modest because (a) CRM
    can partially compensate for miscalibrated features by learning to discount inflated
    values during training, and (b) the ACI adaptation is itself noisy (COC ρ=0.40),
    so it only partially corrects the calibration error. The 1.5pp gap is consistent
    across perturbation levels, suggesting ACI provides uniform rather than perturbation-specific
    improvement.

    '
  tables:
  - name: 'Table 2 (row): A1 ablation'
    content: '| Variant                    | LIBERO (nom.) | LP-Avg | Δ vs Full |

      |----------------------------|---------------|--------|-----------|

      | ACR-VLA (full)             | 93.0          | 68.0   | —         |

      | A1: Static calibration     | 93.0          | 66.5   | -1.5      |

      '
  figures_description:
  - 'Fig 3 (ablation chart, A1 bar): Shows A1 slightly below full system. The gap
    is small but consistent across seeds.'
  analysis: 'The 1.5pp gap is small enough that ACI is a "nice to have" rather than
    a critical component. This is consistent with median tier: COC is noisy, so ACI''s
    adaptation is limited. In the paper, present ACI as providing "principled online
    recalibration" with the honest caveat that the empirical gain is modest. The value
    proposition is more about the theoretical coverage guarantee than the empirical
    SR improvement.

    '
- name: Ablation A2 — ACI without CRM (Sample Selection Only)
  plan_id: plan_007
  description: 'CGS + COC/ACI used for sample selection (pick lowest-uncertainty sample
    from K=10 candidates) without CRM residual correction. Extends ReconVLA''s approach
    to multivariate conformal setting.

    '
  expected_results:
    a2_selection_liberoplus_avg_sr_pct: 64.0
    a2_selection_libero_nominal_sr_pct: 95.5
    a2_gap_vs_full_pp: 4.0
    a2_gap_vs_base_pp: 2.0
    a2_selection_liberoplus_L3_sr_pct: 73.5
    a2_selection_liberoplus_L4_sr_pct: 62.0
    a2_selection_liberoplus_L5_sr_pct: 56.5
  result_rationale: 'Sample selection from K=10 flow-matching candidates provides
    modest 2pp improvement over base — CGS identifies which samples have lower joint
    nonconformity and selecting them avoids the worst outlier actions. But this approach
    is fundamentally limited: it can only select among existing samples, not synthesize
    a correction. When all 10 samples are biased in the same direction (common under
    systematic perturbation), selection cannot help. CRM''s learned residual adds
    the crucial ability to push the action toward a corrected target, accounting for
    the remaining 4pp gap to full ACR-VLA. The near-zero nominal degradation (-0.5pp
    from 95.5% vs 95.0%) is because sample selection is conservative — it rarely makes
    things worse since it''s choosing among valid samples. This ablation is the strongest
    evidence for CRM''s value: the learned correction module provides 4pp of the total
    6pp gain, while sample selection provides only 2pp.

    '
  tables:
  - name: 'Table 2 (row): A2 ablation'
    content: '| Variant                        | LIBERO (nom.) | LP-Avg | Δ vs Full
      | Δ vs Base |

      |-------------------------------|---------------|--------|-----------|-----------|

      | ACR-VLA (full)                | 93.0          | 68.0   | —         | +6.0      |

      | A2: Sample selection only      | 95.5          | 64.0   | -4.0      | +2.0      |

      | SmolVLA (base)                | 95.0          | 62.0   | -6.0      | —         |

      '
  figures_description:
  - 'Fig 3 (ablation chart, A2 bar): A2 is close to base, far from full system. Visually
    makes the case for CRM''s importance.'
  analysis: 'This ablation is critical for the paper''s architecture narrative. It
    shows that the CRM learned correction module — not sample selection — is the primary
    source of improvement. Combined with A3 (CRM w/o conformal features at 64.5%),
    it reveals an interesting decomposition: sample selection (+2pp) ≈ CRM w/o conformal
    (+2.5pp), meaning CGS-informed sample selection and observation-conditioned residual
    provide similar value. CRM with conformal features (+6pp total) outperforms both,
    confirming the value of combining learned correction with structured uncertainty
    conditioning.

    '
- name: Per-Perturbation Breakdown
  plan_id: plan_008
  description: 'ACR-VLA gain broken down across 7 LIBERO-Plus perturbation dimensions:
    camera jitter, observation noise, robot-state perturbation, lighting, background,
    layout, language. Tests hypothesis that gains concentrate on augmentation-covered
    perturbations.

    '
  expected_results:
    gain_camera_jitter_pp: 9.0
    gain_observation_noise_pp: 10.0
    gain_robot_state_pp: 7.0
    gain_lighting_pp: 5.0
    gain_background_pp: 4.0
    gain_layout_pp: 2.0
    gain_language_pp: 1.0
    avg_augmented_perturbations_gain_pp: 8.7
    avg_non_augmented_perturbations_gain_pp: 2.3
  result_rationale: 'Gains strongly correlate with synthetic augmentation coverage.
    Camera jitter (+9pp) and observation noise (+10pp) are directly covered by training-time
    augmentation, so CRM has seen similar perturbations during training and learns
    effective corrections. Robot-state perturbation (+7pp) is partially covered (joint-level
    noise augmentation captures some but not all dynamics changes). Lighting (+5pp)
    and background (+4pp) are visual perturbations where CRM benefits from visual
    encoder features detecting anomalous observations, even without explicit augmentation.
    Layout (+2pp) and language (+1pp) show minimal improvement because these perturbation
    types change task semantics in ways that neither synthetic augmentation nor conformal
    statistics can address — a rearranged scene or rephrased instruction requires
    different behavior, not corrected behavior. The camera/noise/robot-state average
    of 8.7pp is strong and within the [5,12] range specified for median tier. The
    layout/language near-zero gain is an honest limitation that should be reported
    transparently.

    '
  tables:
  - name: 'Table 5: Per-Perturbation ACR-VLA Gain'
    content: '| Perturbation     | Base SR | ACR-VLA SR | Δ (pp)  | Augmented? |

      |------------------|---------|------------|---------|------------|

      | Camera jitter    | 58.0    | 67.0       | +9.0    | ✓          |

      | Obs. noise       | 55.0    | 65.0       | +10.0   | ✓          |

      | Robot-state      | 60.0    | 67.0       | +7.0    | ✓ (partial)|

      | Lighting         | 65.0    | 70.0       | +5.0    | ✗          |

      | Background       | 68.0    | 72.0       | +4.0    | ✗          |

      | Layout           | 62.0    | 64.0       | +2.0    | ✗          |

      | Language         | 66.0    | 67.0       | +1.0    | ✗          |

      '
  figures_description:
  - 'Fig 6: Grouped bar chart (7 perturbation types × base/ACR-VLA). Color-coded by
    augmentation coverage (green=covered, yellow=partial, red=uncovered). Clear visual
    pattern: gains decrease from left to right as augmentation coverage decreases.'
  - 'Fig 6 inset: Scatter plot of augmentation coverage (binary/partial) vs SR gain.
    Shows strong correlation, supporting the honest-limitations narrative.'
  analysis: 'This breakdown is both a strength and vulnerability. Strength: camera/noise/robot-state
    gains are substantial (7-10pp) and clearly demonstrate ACR-VLA''s value for the
    perturbation types it''s designed to handle. Vulnerability: layout/language near-zero
    gains reveal that ACR-VLA (and CGS more broadly) cannot address semantic perturbations.
    Reviewers will likely probe this limitation. The paper should position it honestly:
    "ACR-VLA is most effective for perturbations that induce distributional shift
    in the action space without changing task semantics — camera distortion, sensor
    noise, and kinematic perturbation. For perturbations that alter scene layout or
    language instructions, training-time methods (SRPO, RobustVLA) that modify the
    policy''s learned representations are more appropriate." The per-perturbation
    SRPO stacking breakdown should also be reported (plan_004 subset) to show whether
    stacking helps specifically on the augmentation-covered perturbations.

    '
- name: Ablation A5 — Joint Mahalanobis vs Bonferroni Correction
  plan_id: plan_009
  description: 'Compare CGS with joint Mahalanobis nonconformity score vs per-DOF
    Bonferroni correction (independent conformal intervals per dimension with α/7
    correction). Tests whether the multivariate CP formulation adds value over independent
    per-DOF intervals.

    '
  expected_results:
    a5_bonferroni_liberoplus_avg_sr_pct: 66.5
    a5_joint_mahalanobis_liberoplus_avg_sr_pct: 68.0
    a5_gap_joint_vs_bonferroni_pp: 1.5
    bonferroni_ellipsoid_volume_ratio_vs_joint: 1.35
    bonferroni_coverage_achieved_pct: 93.0
    joint_coverage_achieved_pct: 90.0
  result_rationale: 'Joint Mahalanobis provides 1.5pp advantage over Bonferroni. In
    the median tier, K=10 covariance is noisy, so the Mahalanobis ellipsoid is not
    dramatically tighter than the Bonferroni hypercube. With oracle covariance, the
    joint approach would exploit cross-DOF correlations to produce much tighter ellipsoids;
    with K=10 and Ledoit-Wolf shrinkage, the covariance estimate is regularized toward
    the identity, partially undoing the advantage. Bonferroni''s α/7 correction makes
    each marginal interval conservative, leading to 35% larger total prediction set
    volume and 93% coverage (above 90% target — over-coverage wastes information).
    The joint approach''s tighter ellipsoid gives CRM more precise conformal features,
    particularly for DOFs with strong correlations (e.g., shoulder-elbow joint coupling).
    But the advantage is modest because Ledoit-Wolf shrinkage attenuates exactly the
    cross-DOF correlation structure that makes joint Mahalanobis superior to Bonferroni.

    '
  tables:
  - name: 'Table 2 (row): A5 ablation'
    content: '| Variant                         | LP-Avg | Coverage | Volume Ratio
      |

      |---------------------------------|--------|----------|-------------|

      | CGS (joint Mahalanobis)         | 68.0   | 90%      | 1.00        |

      | A5: Bonferroni per-DOF          | 66.5   | 93%      | 1.35        |

      '
  figures_description:
  - 'Fig S1 (supplementary): Ellipsoid vs Bonferroni hypercube visualization for representative
    2-DOF slice (DOF 1 vs DOF 4). Shows tighter joint ellipsoid capturing correlation
    structure vs axis-aligned rectangle.'
  analysis: 'The 1.5pp gap is modest and supports the median tier narrative. The advantage
    exists but is attenuated by K=10 covariance estimation noise. This is a P2 ablation
    that belongs in supplementary material. It validates the design choice for joint
    Mahalanobis but does not constitute a major finding. If reviewers push on K=10
    covariance reliability, this ablation shows the approach still beats the simpler
    alternative despite estimation noise, which is a reasonable defense.

    '
- name: Ablation A6 — COC vs Episode-Level Success for ACI
  plan_id: plan_010
  description: 'Compare ACI updated with COC (self-referential, no supervision) vs
    ACI updated with episode-level binary task success (oracle signal). Tests whether
    COC''s noise penalty is offset by its supervision-free property.

    '
  expected_results:
    a6_coc_aci_liberoplus_avg_sr_pct: 68.0
    a6_oracle_aci_liberoplus_avg_sr_pct: 69.5
    a6_gap_oracle_vs_coc_pp: 1.5
    a6_coc_aci_convergence_episodes: 120
    a6_oracle_aci_convergence_episodes: 40
    a6_coc_coverage_std: 0.04
    a6_oracle_coverage_std: 0.02
  result_rationale: 'Oracle episode-level success provides a cleaner ACI signal, achieving
    1.5pp higher SR and converging 3× faster (40 vs 120 episodes). This is expected:
    binary success is a direct, noise-free indicator of whether the policy is performing
    well, while COC is a proxy that correlates weakly (ρ=0.40). The coverage standard
    deviation is also halved with oracle signal (0.02 vs 0.04), meaning ACI is more
    stable. However, the performance gap is only 1.5pp, which demonstrates that COC''s
    weak but consistent correlation with success is sufficient for ACI to eventually
    converge to a reasonable threshold. The key argument for COC is not performance
    parity but the supervision-free property: episode-level success requires an external
    reward signal that is unavailable during deployment. COC operates on the policy''s
    own output consistency, making it applicable without any environment reward. The
    1.5pp price of supervision-freedom is a reasonable trade-off for deployment autonomy.

    '
  tables:
  - name: 'Table 4 (extended): ACI Signal Comparison'
    content: '| ACI Signal         | LP-Avg | Convergence | Coverage σ | Supervision
      |

      |--------------------|--------|-------------|------------|-------------|

      | COC (ours)         | 68.0   | ~120 ep     | 0.04       | None        |

      | Episode success    | 69.5   | ~40 ep      | 0.02       | Required    |

      | Δ                  | -1.5   | —           | —          | —           |

      '
  figures_description:
  - 'Fig S2a: ACI α_t convergence curves for COC vs oracle signal. Oracle converges
    faster and with less oscillation.'
  - 'Fig S2b: Running coverage (50-episode window) for both signals. Oracle maintains
    tighter band around 90% target.'
  analysis: 'This ablation validates the design choice of COC for ACI. The 1.5pp gap
    is the "price of autonomy" — the paper should frame it as: "COC trades 1.5pp in
    SR for complete independence from external supervision, enabling ACI adaptation
    during deployment without environment reward access." This is a stronger argument
    than claiming COC is a "reliable" signal — it''s a sufficient signal for a task
    (slow threshold adaptation) that is tolerant of noise.

    '
- name: Ablation A7 — DiU Aleatoric vs CGS Epistemic Features
  plan_id: plan_011
  description: 'Compare CRM conditioned on: (a) CGS epistemic features (45D, full
    system), (b) DiU single-pass aleatoric features (7D variance estimate), (c) combined
    epistemic+aleatoric (52D). Tests whether epistemic uncertainty from conformal
    prediction provides distinct value over aleatoric uncertainty estimation.

    '
  expected_results:
    a7_cgs_epistemic_45d_liberoplus_avg_sr_pct: 68.0
    a7_diu_aleatoric_7d_liberoplus_avg_sr_pct: 65.0
    a7_combined_52d_liberoplus_avg_sr_pct: 68.5
    a7_gap_epistemic_vs_aleatoric_pp: 3.0
    a7_combined_vs_epistemic_pp: 0.5
    a7_diu_libero_nominal_sr_pct: 94.5
    a7_combined_libero_nominal_sr_pct: 92.5
  result_rationale: 'CGS epistemic features outperform DiU aleatoric features by 3pp
    on LIBERO-Plus. Under distribution shift, epistemic uncertainty rises (the model
    encounters unfamiliar observations, producing diverse action samples with high
    inter-sample variance), providing a strong signal for CRM to detect and correct.
    DiU''s aleatoric estimate captures intrinsic action variance that is present even
    in-distribution — this is useful for identifying inherently ambiguous actions
    but does not specifically detect distribution shift. On LIBERO-Plus, where the
    challenge is distribution shift rather than intrinsic ambiguity, epistemic features
    are more informative. The combined 52D model shows only 0.5pp improvement over
    epistemic-only, suggesting the aleatoric signal is largely redundant when epistemic
    features are available — epistemic uncertainty subsumes the actionable information
    in aleatoric estimates under shift. The combined model also shows slightly more
    nominal degradation (92.5% vs 93.0%) due to the additional aleatoric features
    sometimes triggering unnecessary corrections on in-distribution data where aleatoric
    uncertainty is naturally elevated.

    '
  tables:
  - name: 'Table 2 (row): A7 ablation'
    content: '| Variant                    | LIBERO (nom.) | LP-Avg | Feature Dim
      |

      |----------------------------|---------------|--------|-------------|

      | CGS epistemic (full)       | 93.0          | 68.0   | 45D         |

      | DiU aleatoric              | 94.5          | 65.0   | 7D          |

      | Combined                   | 92.5          | 68.5   | 52D         |

      '
  figures_description:
  - 'Fig S3: Feature activation heatmap comparing epistemic vs aleatoric feature magnitudes
    on in-distribution vs OOD episodes. Epistemic features show clear elevation under
    shift; aleatoric features show mild elevation but less discrimination.'
  analysis: 'This ablation supports the architectural choice of CGS epistemic features
    over simpler aleatoric alternatives. The 3pp gap is meaningful and distinguishes
    ACR-VLA from a DiU-based approach. The combined model''s marginal improvement
    (0.5pp) suggests the paper should not recommend the 52D variant as default — the
    extra 7 features add complexity without commensurate gain. The key narrative point:
    "CGS captures distribution shift through inter-sample epistemic uncertainty, which
    is the primary challenge in LIBERO-Plus; aleatoric uncertainty captures a complementary
    but less actionable signal under shift."

    '
- name: CRM Feature Importance Analysis
  plan_id: plan_012
  description: 'Gradient magnitude analysis of CRM''s learned weights w.r.t. 45 uncertainty
    features, broken down by perturbation type. Tests whether CRM uses conformal features
    in a dimension-selective manner.

    '
  expected_results:
    top_5_features_by_gradient_magnitude:
    - per_dof_std_joint1: 0.18
    - per_dof_std_joint4: 0.15
    - per_dof_std_joint6: 0.14
    - ellipsoid_volume: 0.12
    - per_dof_radius_joint1: 0.09
    covariance_feature_total_importance_share_pct: 18.0
    marginal_feature_total_importance_share_pct: 72.0
    ellipsoid_volume_importance_share_pct: 10.0
    dimension_selectivity_index: 0.35
    perturbation_specific_feature_pattern_detected: false
  result_rationale: 'In the median tier, CRM uses conformal features but not in a
    cleanly dimension-selective way. The top features are per-DOF standard deviations
    (joints 1, 4, 6 — shoulder, elbow, wrist), which are marginal statistics that
    don''t require covariance structure. The ellipsoid volume (a summary statistic)
    ranks 4th, acting as a global uncertainty indicator. Covariance-derived features
    (off-diagonal elements of the shrunk covariance matrix, cross-DOF conformal radii)
    collectively account for only 18% of gradient magnitude — present but not dominant.
    This is consistent with the median tier assumption that per-DOF advantage comes
    primarily through marginal information. The dimension selectivity index (0.35
    on a 0-1 scale where 1 = perfectly selective, 0 = uniform) indicates CRM pays
    more attention to certain DOFs (proximal joints with higher variance under perturbation)
    but does not exhibit the clean "correct only the uncertain DOFs" pattern that
    would support the stronger Claim 1 framing. No perturbation-specific feature usage
    pattern is detected — CRM uses the same features similarly across perturbation
    types, suggesting it learns a general correction strategy rather than perturbation-adaptive
    dimension selection.

    '
  tables:
  - name: 'Table 6: CRM Feature Importance (Top 10)'
    content: '| Rank | Feature              | Grad. Mag. | Category    |

      |------|----------------------|------------|-------------|

      | 1    | std(joint1)          | 0.180      | Marginal    |

      | 2    | std(joint4)          | 0.150      | Marginal    |

      | 3    | std(joint6)          | 0.140      | Marginal    |

      | 4    | ellipsoid_volume     | 0.120      | Summary     |

      | 5    | radius(joint1)       | 0.090      | Marginal    |

      | 6    | radius(joint4)       | 0.075      | Marginal    |

      | 7    | std(joint5)          | 0.060      | Marginal    |

      | 8    | cov(joint1,4)        | 0.045      | Covariance  |

      | 9    | radius(joint6)       | 0.040      | Marginal    |

      | 10   | cov(joint4,6)        | 0.035      | Covariance  |

      '
  figures_description:
  - 'Fig 7a: Heatmap of gradient magnitudes (7 DOFs × 3 feature types + 1 summary)
    averaged across all perturbations. Shows concentration on per-DOF std with mild
    secondary attention to radii. Covariance row is faint.'
  - 'Fig 7b: Same heatmap split by perturbation type (7 sub-heatmaps). Patterns are
    similar across perturbation types — no clear perturbation-specific dimension selection.
    Some mild elevation of joint1 features under camera perturbation.'
  analysis: 'This is the analysis that forces the Claim 1 reframing. The feature importance
    pattern shows CRM uses conformal features as general uncertainty indicators, not
    as dimension-selective correction signals. Per-DOF std dominates because it''s
    the most robust marginal statistic even with K=10 noise; covariance features are
    used but weakly. The paper should present this honestly: "CRM learns to condition
    corrections on structured uncertainty features, with per-DOF standard deviations
    providing the primary signal. Covariance-derived features contribute modestly
    (18% of gradient magnitude), suggesting that the full multivariate CP formulation
    provides value primarily through richer marginal statistics rather than cross-DOF
    correlation exploitation." This analysis is compatible with A4 showing only 2pp
    per-DOF vs scalar gap — most of the value is in having per-DOF marginals, not
    in the covariance structure.

    '
- name: SnapFlow Integration (K=10 × 1-step Distilled)
  plan_id: plan_013
  description: 'Replace standard 10-step flow-matching sampling with SnapFlow 1-step
    distilled generation for K=10 samples. Test whether sample diversity is preserved
    and measure inference speedup.

    '
  expected_results:
    snapflow_liberoplus_avg_sr_pct: 67.0
    snapflow_sr_drop_vs_standard_pp: 1.0
    snapflow_libero_nominal_sr_pct: 92.5
    snapflow_inference_time_ms: 18.0
    standard_inference_time_ms: 58.0
    snapflow_speedup_factor: 3.2
    sample_diversity_kl_divergence_vs_standard: 0.08
    cgs_ellipsoid_volume_snapflow_vs_standard_ratio: 0.92
  result_rationale: 'SnapFlow 1-step distilled generation produces K=10 samples 3.2×
    faster than standard 10-step sampling, reducing total CGS inference time from
    58ms to 18ms (10 × 1-step vs 10 × 10-step). The 1pp SR drop (67% vs 68%) comes
    from slightly reduced sample diversity: 1-step distilled generation produces samples
    that are closer to the mode, reducing the tail variance that CGS needs to estimate
    covariance structure. The CGS ellipsoid volume is 8% smaller with SnapFlow samples
    (0.92 ratio), meaning conformal sets are slightly tighter — this is both because
    the true uncertainty is slightly underestimated (less diverse samples) and because
    Ledoit-Wolf shrinkage has less variance to regularize. The KL divergence of 0.08
    between SnapFlow and standard sample distributions indicates good but not perfect
    distribution matching. For deployment, the 3.2× speedup with only 1pp SR trade-off
    is likely worthwhile, making ACR-VLA feasible for real-time control at ~55Hz total
    pipeline throughput.

    '
  tables:
  - name: 'Table S1: SnapFlow Integration'
    content: '| Configuration           | LP-Avg | Inference (ms) | Speedup |

      |-------------------------|--------|----------------|---------|

      | Standard (10-step × 10) | 68.0   | 58.0           | 1.0×    |

      | SnapFlow (1-step × 10)  | 67.0   | 18.0           | 3.2×    |

      '
  figures_description:
  - 'Fig S4: Scatter plot of sample diversity (x-axis: pairwise L2 distance between
    K=10 samples) vs CGS ellipsoid volume, colored by standard vs SnapFlow. SnapFlow
    cluster is shifted left (less diversity) and down (smaller ellipsoids) but largely
    overlapping.'
  analysis: SnapFlow integration is a practical contribution for deployment feasibility.
    The 1pp trade-off is acceptable for most applications. In the paper, this should
    be positioned in the "practical considerations" section as an optional efficiency
    optimization, not a core contribution. The result validates that CGS is compatible
    with accelerated inference methods, broadening ACR-VLA's applicability.

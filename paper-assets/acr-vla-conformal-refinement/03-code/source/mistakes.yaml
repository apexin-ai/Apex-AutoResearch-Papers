  context: plan_702 K=1 CRM eval 三次部署全部失败：第一次 unc_dim bug 崩溃，第二次代码修好但 cron 读旧 exit
    file 杀进程，第三次待执行。累计浪费 ~6 GPU-hours。本 session cron misfire 累计 13 次。
  fix: 第三次部署需严格执行 exit file 清理 + 标准 wrapper + 存活验证。

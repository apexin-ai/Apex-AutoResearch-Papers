- id: M005
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: LIBERO 并发渲染上限导致新部署进程系统性挂起——在已有 3-5 个 LIBERO 进程的服务器上新部署全部卡在 "10 tasks loaded"
  root_cause: 每台服务器的 LIBERO 环境有并发渲染资源上限（可能是 EGL context 或 display 连接数）。当服务器上已有 3-5
    个评估进程时，新部署的进程可以完成模型加载和任务加载，但无法获取渲染资源开始 rollout，导致 silent hang。被 kill 的进程可能未完全释放渲染资源，导致替换部署也挂起。
  prevention: 1. 不要在已有多个 LIBERO 进程的 GPU 上通过 kill+replace 方式部署新实验。2. 等现有进程自然完成后，渲染资源释放，再部署新实验。3.
    部署后 10 分钟内检查日志是否出现 rollout 输出，无输出即判定挂起。4. 考虑设置每服务器 LIBERO 并发进程数上限。
  status: active
  context: 3 台服务器（bjb2-28827 cuda:2, bjb1-18228 cuda:1, bjb1-32546 cuda:0）新部署的进程全部在
    10-12 分钟后确认挂起。同服务器上同时运行的旧进程正常。bjb2-40593 也有类似 pattern。
- id: M006
  date: '2026-05-17'
  category: communication
  severity: medium
  summary: 'M006: 紧急修正未能阻止 Worker kill 正在运行的进程 (PID 429284)'
  root_cause: 综合指令（replace_agent_queue）包含了 4 个 kill PID，之后 Reviewer 修正了诊断（429284 非挂起），Director
    发了 urgent_agent_message 修正。但 Agent 处理综合指令时派出的 Worker 在收到修正前已执行全部 4 个 kill。根本原因：(1)
    综合指令中的 kill 列表基于未验证的"全部挂起"假设；(2) urgent 修正只能插队到 Agent 消息队列前面，无法中断已 dispatched
    的 Worker。
  prevention: 1. kill 指令不要批量下发——对每个 PID 先 SSH 检查日志再决定，不要基于假设批量 kill。2. 综合指令中涉及 destructive
    action (kill) 时，单独拆出来让 Agent 逐个确认，而非打包到一条大指令中。3. Reviewer 修正诊断后，如果 Worker 已 dispatched，需要直接通过
    Worker 层面取消而非只修正 Agent 队列。
  status: active
  context: PID 429284 (bjb1-32546 cuda:0, obs-only-norm005-seed43) 在高并发下初始化 20+ 分钟后开始产出
    rollout (task 1, rollout 1/10)。被误 kill 后需重跑，损失约 30-40 分钟计算。
  fix: Agent 将在 GPU 释放后立即在 bjb1-32546 cuda:0 重新部署 obs_only ε=0.05 seed43。
  related_decisions:
  - D048
- id: M007
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: 'M007: Ghost 实验 eval-obs-only-object-norm01-seed45 报告 3 次、2 个 Worker 均未修复，28h+
    GPU 浪费'
  root_cause: Worker 检查服务器时没有对比 registry RUNNING 条目与实际 ps 进程存活状态。只做了表面扫描（GPU utilization），没有验证
    registry 一致性。连续两个 Worker（check-and-kill-3servers, comprehensive-check-kill-deploy）都犯同样错误。
  prevention: 1. 服务器审计 Worker 必须执行 registry-vs-ps 交叉验证：对每个 RUNNING 条目检查 PID 是否存活。2.
    Ghost 实验修复不需要 SSH——直接调 registry 工具改状态即可，不要依赖 Worker SSH 检查。3. 关键 fix 报告 2 次未解决时，Director
    应直接用 registry 工具自行修复而非再派 Worker。
  status: active
  context: eval-obs-only-object-norm01-seed45 在 bjb1-18228 cuda:0 创建于 2026-05-16T09:01。PID
    474319 不知何时死亡。Reviewer 在 12:10, 12:20, 和本次审查中连续 3 次报告。2 个不同 Worker 均未捕获。GPU 空闲浪费超
    28 小时。
  fix: 第 3 次发送强制修复指令（urgent_agent_message），明确指定 registry 操作而非 SSH 检查。
- id: M008
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: 'M008: Worker 无差别 kill bjb1-18228 全部进程，杀掉 2 个合法 RUNNING 实验 (seed46/47 norm01,
    各 4/10 完成)，浪费 ~14h GPU 时间'
  root_cause: Worker 名为 "kill-check-deploy" 但执行了全面 kill 而非选择性 kill。未检查 registry RUNNING
    状态，未检查实验进度，未保存部分结果，未更新 registry，未部署替代实验。与 M006 同类问题：Worker 对 destructive action
    缺乏 pre-check。
  prevention: 1. Kill Worker 必须先列出所有目标 PID + 对应 registry 状态 + 进度，汇报 Agent 确认后再执行。2.
    禁止 kill 进度 > 30% 的注册实验，除非 Director 明确指定。3. Kill 后必须更新 registry + 部署替代实验，不允许只 kill
    不 deploy。4. Director 的 kill 指令必须给出精确 PID 列表（不是"清理该服务器"这种宽泛指令）。
  status: active
  context: bjb1-18228 上 eval-obs-only-object-norm01-seed46-r2 和 seed47-r2 各完成 4/10
    tasks (~7h GPU each)。Worker batch7 全部 kill。seed46/seed47 是 K=10 magnitude curve
    数据，D049 下降为 supplementary 但仍有价值。4 GPU 全部空闲，Worker 未部署任何实验。
  fix: 指令 Agent 修复 registry + 在 4 GPU 上部署 D049 任务。seed46/seed47 norm01 不紧急重跑（K=10

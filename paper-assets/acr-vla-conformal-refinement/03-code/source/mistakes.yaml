- id: M010
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: 'M010: train-crm-k1-accg-v2 multi-stage 训练因 W&B API key 未配置崩溃，precompute
    75min 白等'
  root_cause: 训练命令未加 --no_wandb flag，bjb2-28827 上未配置 wandb login。precompute 成功后训练阶段
    wandb.init() 直接报错退出。与 M009 同类问题：训练 pipeline 的环境依赖未在启动前验证。
  prevention: 1. 训练脚本提交前检查 W&B 依赖：要么确认目标服务器已 wandb login，要么默认加 --no_wandb。2. 训练脚本中
    wandb.init() 应 try/except，失败时 fallback 到 no_wandb 模式而非崩溃。3. Agent 部署训练实验时必须在部署后
    2 分钟内检查日志确认训练实际开始（不是只看 precompute 开始就走）。
  status: active
  context: precompute 75min 成功完成（65,223 samples），但 training 阶段立即崩溃。precompute 数据已
    cached 可复用，重启只需 ~20min。损失：发现延迟数小时（Agent 重置期间无人监控）。
  fix: 立即重启加 --no_wandb flag。precompute 自动 skip，直接进入 training。
- id: M011
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: 'M010: K=5/K=20 eval 被 SIGHUP kill 后自动重启为孤儿进程，占 GPU 无 registry 跟踪'
  root_cause: 进程被 SIGHUP (EXIT_CODE=129) 终止后，某种机制（tmux respawn / shell restart）自动重启了新进程（新
    PID），但 registry 只记录了原始 run 的 failed 状态。新进程成为 orphan，持续占用 GPU 但不被监控系统追踪。
  prevention: 1. Kill 实验时必须用 kill -9（SIGKILL 不可被 trap/重启）而非普通 signal。2. Kill 后必须 nvidia-smi
    确认 GPU 已释放。3. Registry 标记 failed/killed 后，Agent 应 SSH 确认对应 GPU 上无残余进程。4. 调查并禁用任何实验进程的自动重启机制。
  status: active
  context: bjb1-18228 cuda:0 (K=5 PID 713405) 和 cuda:2 (K=20 PID 713480) 在 registry
    显示 DONE/failed 后仍然运行。K=20 数据异常（alphabet_soup=0% vs K=10 的 30%），重启后可能参数/状态损坏。
  fix: urgent_agent_message 指示 kill -9 K=20，K=5 验证数据后继续跑并重注册为 RUNNING。
  related_decisions:
  - D052
- id: M012
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: 'M012: DeprecationWarning stderr 反复导致 cron 误标实验为 failed，已影响至少 3 个实验的数据聚合'
  root_cause: LIBERO/MuJoCo 环境产生 swigvarlink DeprecationWarning 输出到 stderr，cron 监控检测到
    stderr 非空后将实验标记为 failed。实际实验正常完成并产出 JSON 结果。受影响实验：eval-obs-only-object-default-seed46(SR=15%),
    eval-perdof-object-default-seed46(SR=0%), eval-obs-only-object-norm02-k5-seed42(SR=14%)。后者导致
    K=5 数据在 k_value_curve_data.json 中缺失。
  prevention: 1. Cron 判断实验成功/失败应以 JSON 结果文件是否存在为准，不应仅依赖 stderr 是否非空。2. 每次发现 failed
    实验，Agent 应先检查对应 JSON 文件是否存在再确认 conclusion。3. 考虑在启动脚本中 suppress 已知的 DeprecationWarning（2>&1
    或 PYTHONWARNINGS=ignore）。
  status: active
  context: 同一 root cause 已触发 3 次手动修正。如果不从 cron 层面修复，后续每个新实验都可能被误标。
  fix: 逐个修正 registry conclusion 标签：default-seed46 改 success，perdof-default-seed46
    改 negative，k5-seed42 改 success。
- id: M013
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: 'M013: Harvest 脚本按文件名分类实验而非按实际运行参数，导致 3 个 ε=0.1 实验被错误归入 default/uncapped
    分组，perdof default 从 0% 被错误抬高到 7.75%，Figure 2 被污染'
  root_cause: 早期实验（seed42/43/44）的 JSON 文件名不含 "norm" 后缀（如 eval_object_perdof.json），但实际运行命令使用了
    --max_correction_norm 0.1。Harvest 脚本按文件名模式匹配分类，将无 norm 后缀的文件归入 default/uncapped，而非从
    log 文件中读取实际参数。
  prevention: 1. 数据聚合脚本必须从 log 文件或 JSON 元数据中读取实际运行参数来分类，不能依赖文件名推断。2. 每次聚合后 Reviewer
    应抽样核对 JSON 中的参数与分类标签是否一致。3. 对已锁定证据点涉及的数据，修改聚合逻辑后必须重新验证。
  status: active
  context: 直接影响已锁定证据"perdof default catastrophic collapse"的准确性。Figure 2 向审稿人展示的数据一度被污染。如果进入论文将导致
    claim 与数据不符。
  fix: 将 seed42/43/44 从 default 移到 ε=0.1；perdof default 改为仅 seed46=0% (n=1)；修复 harvest
    脚本从 log 读取 max_correction_norm；重跑 Figure。
- id: M014
  date: '2026-05-18'
  category: agent_behavior
  severity: medium
  summary: 僵尸进程清理时误 kill 正在运行的实验（tmux session 名含相同 seed 号）
  root_cause: Worker 在 bjb1-18228 上 kill 僵尸进程 PID 702897（eval-k1-seed43 tmux session）时，可能误伤了同一

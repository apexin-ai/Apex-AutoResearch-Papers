- id: M032
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: Cron 读取旧 exit file 触发 on_complete → tmux session 替换杀死正在运行的实验（plan_702 三次部署全部失败）
  root_cause: 重新部署时未清理旧 exit file（/tmp/agent-ml-exit/*.exit）。Cron 读取旧 file 触发虚假 on_complete
    → Agent 派 analyze worker → tmux session 被替换 → 正在运行的进程被 SIGHUP 杀死。第二次部署绕过了标准 tmux

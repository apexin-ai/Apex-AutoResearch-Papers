    benchmark 均已完整预计算。
  fix: Reviewer 核实后发 urgent_agent_message 纠正，Agent 继续按 all-20-tasks 的前提设计 leave-task-out。
- id: M017
  date: '2026-05-19'
  category: code_bug
  severity: high

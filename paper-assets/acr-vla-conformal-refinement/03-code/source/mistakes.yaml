- id: M115
  date: '2026-05-28'
  category: code_bug
  severity: high
  summary: Backfill 机制失效：手动 update_registry 不创建 cron 监控，导致实验完成后无回调、无自动 backfill，18
    GPU 长时间空闲
  root_cause: reconciliation worker 通过手动 update_registry 将实验状态推到 RUNNING，而非用 submit_training_job
    提交。submit_training_job 会自动创建 cron 监控（进程退出→回调），手动状态转换不创建 cron。实验完成后无回调→无 backfill→GPU
    空闲。
  prevention: 所有实验部署必须通过 submit_training_job，禁止用 update_registry 手动推状态到 RUNNING。审批实验时确认
    Worker 使用的是 submit_training_job 而非手动 registry 操作。
  status: active
  context: DDL 当天发现 bjb1-32546 6卡全部空闲、cqa1-32758 5/6 实验静默完成未 backfill。System keepalive
    两次指出 GPU 利用率问题后才发现根因。
  fix: 本轮所有新部署均使用 submit_training_job，cron 监控已激活。Worker force-fill 重新部署了全部空闲 GPU。

- id: M047
  date: '2026-05-21'
  category: agent_behavior
  severity: high
  summary: 'M047: Precompute 重启未先 kill 旧进程，导致双进程争抢 GPU + cache 混合粒度污染'
  root_cause: Agent 多轮重启 Object precompute shard（fix 进程 100-sample 粒度 + r2 进程 500-sample
    粒度），但未 kill 前一轮的进程。导致 bjb1-32546 GPUs 0-4 和 bjb1-18228 GPUs 0-3 各有双进程，GPU 利用率从
    20%（正常 I/O bound）跳到 99%（争抢），且 shard 5/6 的 cache 目录出现两种粒度文件混合，merge 后会产生样本重复。
  prevention: 重启 precompute/training 进程前，必须先 kill 同 GPU 上的旧进程并清理可能冲突的 partial cache
    文件。重启指令模板应包含：(1) ps aux | grep 检查旧进程 (2) kill 旧进程 (3) 确认 GPU 空闲 (4) 检查 cache 目录是否有前轮残留
    (5) 再启动新进程。
  status: active
  context: bjb1-32546 shard s5 最严重：37 个文件，100-sample 和 500-sample 粒度在 400-2900 范围双重覆盖。s7/s8/s9

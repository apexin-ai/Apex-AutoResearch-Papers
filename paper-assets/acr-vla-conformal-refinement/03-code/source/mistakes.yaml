- id: M039
  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: π0.5 wrapper 使用 per-step 推理 + action[0] 而非 50-step 开环执行，导致 4 次 0% SR
  root_cause: 未研究 lerobot π0.5 的官方 eval 协议就编写 wrapper。π0.5 训练时以 50-step 开环为目标（n_action_steps=50），但
    wrapper 每步独立推理只取 action[0]。gripper close 动作在 chunk 中间（~step 20），永远不被执行。SmolVLA
    用类似的 per-step 策略能 work 是因为训练目标不同。
  prevention: 适配新 VLA 时，必须先读官方 eval 代码确认 action chunk 执行策略（开环步数、chunk 利用率、推理频率），不能假设所有
    VLA 的 chunk 执行方式相同。每个 VLA backbone 的 n_action_steps 可能不同。
  status: active
  context: '4 次失败: r1(QUANTILES), r2(vision tower), fix2(crash), fix3(padding_side)。前
    3 次修复了真实 bug 但都不是 0% 的根因。根因一直是 action 执行策略。总计浪费 ~20h GPU time + 大量调试时间。'
  fix: pi05_wrapper.py 实现 action queue (deque)：模型推理返回 50-step chunk → 存入 queue → 每个
    env step pop 1 action → queue 空时重新推理。

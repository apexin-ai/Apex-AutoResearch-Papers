- id: M009
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: 'M009: plan_701 训练崩溃——4 台服务器均无 LIBERO HDF5 原始数据，precompute 阶段 FileNotFoundError'
  root_cause: K=1 多阶段特征 precompute 需要 LIBERO 原始 HDF5 演示数据（含图像+机器人状态），但所有服务器只有 eval
    环境（BDDL task configs），没有训练数据。plan_700 设计时未验证数据依赖。同时 submit_training_job 的 tmux
    wrapper 不传播非零退出码，导致 FileNotFoundError 崩溃被误报为 complete。
  prevention: 1. 训练实验启动前必须验证所有数据依赖存在（dry-run 或显式检查）。2. 修复 submit_training_job EXIT_CODE
    传播 bug。3. plan 设计阶段（plan_700）就应确认训练数据路径，不能只设计架构不验证 pipeline。
  status: active
  fix: 方案 C：(1) 立即用 K=10 cache fallback 在 bjb1-32546 训练单阶段版本；(2) 并行下载 LIBERO HDF5

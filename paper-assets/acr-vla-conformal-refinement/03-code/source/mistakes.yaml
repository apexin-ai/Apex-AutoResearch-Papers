- id: M015
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: submit_training_job 默认 timeout_hours=6 导致 LIBERO-Object 全量 eval 批量超时失败
  root_cause: LIBERO-Object 全量 eval（10 tasks × 10 rollouts × 300 steps, K=10）需要 12-14h，但
    submit_training_job 默认 timeout=6h。部署双跑后 GPU 争抢进一步放慢速度（~32min/rollout vs ~8min）。至少
    4 个实验被 EXIT_CODE=124 杀掉，更多即将超时。
  prevention: 后续所有 LIBERO eval 实验统一使用 timeout_hours=16。部署前估算单卡/双跑场景下的实际运行时间，确保 timeout
    > 预估时间 × 1.5。
  status: active
  fix: kill 刚启动实验 + 以 timeout_hours=16 重提交所有失败/即将超时实验。全局修复后续默认值。

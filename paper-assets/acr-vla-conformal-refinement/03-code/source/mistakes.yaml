mistakes:
- id: M001
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Agent 连续 5 次误杀正常运行的 eval 进程（direct-correction），根因是判断"stuck"的标准有误
  root_cause: evaluate.py 每 5 个 rollout 才打印一次（~7.5 分钟无输出），Agent/Worker 看到数分钟无日志输出
    + /proc/PID/io wchar 不变（MuJoCo+CUDA 用 mmap I/O 不计入）就判定进程卡死并 kill。实际进程一直在正常 rollout。
  prevention: 判断进程是否 stuck 应综合检查：(1) 进程 State 是否为 R/S（非 D/Z/T），(2) CPU 利用率是否正常，(3)
    GPU util 是否有活动。不能仅依赖日志输出频率或 /proc/PID/io。对于输出频率低的程序，先 patch 代码增加输出频率再做判断。
  status: active
  context: eval-direct-correction-object-seed42 连续 5 次尝试（code/verify/fix/ops/r2）全部因
    Agent 或 Worker 误杀而失败。浪费约 10 小时 GPU 时间 + 大量 Agent 工作时间。
  fix: Patch evaluate.py 改为每 rollout 打印一次进度。r3 重启后稳定运行。
- id: M002
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: Agent 两批部署指令叠加导致 GPU 冲突和数据文件覆盖风险（5/16 同类事故重演）
  root_cause: Director 发了原始 GPU 部署指令（4 卡 4 实验），随后发了调整指令（改优先级）。Agent 处理第一批时已部署，处理第二批时又部署了一轮，没有检查目标
    GPU 是否已被第一批占用。两批进程共用同一 GPU，其中 obs_only seed46 两个实例写同一输出文件。
  prevention: 1. 每次部署前必须 nvidia-smi 确认目标卡无进程。2. 收到调整指令时先检查原始指令是否已执行——如果已部署则需要先 kill
    被替换的实验。3. Director 发调整指令时应明确标注"替代上一条部署指令"而非"补充"。
  status: active
  context: bjb1-18228 cuda:2/3 各跑了 2 个实验进程，bjb2-28827 cuda:2 也是 2 个。obs_only_norm01_seed46.json
    有两个进程同时写入的损坏风险。
  fix: Kill 重复进程，每卡保留单进程，检查文件完整性后视情况重启。

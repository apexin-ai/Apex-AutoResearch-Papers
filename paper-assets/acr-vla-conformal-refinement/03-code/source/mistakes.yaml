- id: M004
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: Worker 部署 5 个实验全部违反 GPU 冲突防范规则：未 nvidia-smi 预检、未注册 registry、1 个 GPU 双进程冲突、1
    个重跑已完成实验
  root_cause: Worker 未遵守 memory.md 中 GPU 冲突防范规范（2026-05-16 制定）。未在部署前 nvidia-smi -i
    N 确认空闲，未设 CUDA_VISIBLE_DEVICES，未在 20s 内验证，未检查 registry 是否已有同实验结果，未注册新实验。
  prevention: 1. Agent 派 Worker 部署时必须在 prompt 中显式要求：(a) 部署前 nvidia-smi -i N 确认空闲 (b)
    CUDA_VISIBLE_DEVICES 显式设置 (c) 部署后 20s 验证 (d) 部署前查 registry 确认无已完成同实验 (e) 部署后立即注册
    registry + cron。2. Director 审批部署计划时检查是否包含这些步骤。
  status: active
  context: worker_ssh_full-gpu-scan-and-deploy-all-idle 在 bjb2-28827 cuda:2 上部署了两个相同的
    perdof ε=0.3 seed46 进程（PID 392856+394435），同文件写入风险。bjb1-32546 cuda:0 重跑已有 DONE
    结果的 perdof ε=0.3 seed44（会覆盖有效 JSON）。全部 5 个实验无 registry 条目。
  fix: kill 冲突/重复进程，补注册存活实验，替换 killed GPU 上的实验。
  related_decisions:

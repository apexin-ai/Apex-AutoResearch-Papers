# ============================================================
# PAPER OUTLINE
# ============================================================
paper_outline:

  abstract:
    word_budget: 150
    core_bullets:
      - "Frozen VLA deployment → inference-time correction without weight modification"
      - "ACR-VLA: K=2 samples (free uncertainty signal), adaptive CRM gating"
      - "Key finding: CRM always-on harmful on 2/4 suites; adaptive gating necessary"
      - "Adaptive ≥ CRM on ALL 4 suites (consistency); directionally positive on highest-uncertainty suite"
      - "Efficiency: K=2 (170ms = K=1) + CRM 0.25ms, 5× fewer passes than K=10"
    format: "单段 4-6 句，不罗列数字。不 claim p<0.05"
    tables: []
    figures: []

  introduction:
    word_budget: 700
    core_bullets:
      - "Problem: frozen VLA, inference-time improvement without retraining"
      - "Existing gap: A2C2 (temporal), ReconVLA (UQ only), SC-VLA (RL required)"
      - "Our insight: correction WITHOUT gating overcorrects — knowing WHEN matters"
      - "ACR-VLA: K=2 probe (free, 170ms = K=1) + adaptive CRM + calibrated threshold"
      - "Results: Adaptive ≥ CRM on ALL 4 suites; CRM always-on degrades 2/4"
      - "4 contributions: pipeline, cross-suite validation, gating necessity, applicability boundaries"
    tables: []
    figures: []
    citation_hints: [a2c2_2025, chen2026reconvla, sc_vla_2026, black2024pi0, shukor2025smolvla]

  related_work:
    word_budget: 350
    core_bullets:
      - "VLA robustness: tokenized → generative → flow-matching"
      - "Inference-time correction: ReconVLA, SC-VLA, VLA-Pilot, A2C2, residual policy"
      - "Inference-time compute scaling: LLM best-of-N → VLA (RoVer, DA-SIP)"
      - "Our positioning: adaptive gating, supervised correction, no RL, K=2 free probe"
    tables: []
    figures: []

  method:
    word_budget: 900
    core_bullets:
      - "§3.1 Problem setup: frozen flow-matching VLA, action chunks, receding horizon"
      - "§3.2 Multi-sample selection: K samples → argmin to centroid"
      - "§3.3 CRM: 3-layer MLP (327K-616K params), obs features + action → residual, L2 norm bound ε"
      - "§3.4 Magnitude control: ε critical, uncapped → overcorrection"
      - "§3.5 Adaptive K=2 (core contribution): K=2 probe (free), L2 > τ → CRM, L2 ≤ τ → direct output"
    tables: []
    figures: [fig_pipeline]
    dependencies: []

  experiments:
    word_budget: 1200
    core_bullets:
      - "§4.1 Setup: SmolVLA 0.4B, 4 LIBERO suites, methods"
      - "§4.2 Main results: Table 1 — consistency claim (Adaptive ≥ CRM on ALL suites). All Δ n.s. at n=3"
      - "§4.3 Cross-VLA analysis: π0.5 (3.6B) — capability dependency. Short paragraph + placeholder"
      - "§4.4 Gating necessity: CRM always-on harmful; trigger rate ↔ effect monotonic"
      - "§4.5 Efficiency: K=2 = K=1 latency, CRM 0.25ms, trigger 4-20%"
    tables: [tab_main, tab_efficiency]
    figures: [fig_trigger_scatter]
    registry_refs: []

  conclusion:
    word_budget: 200
    core_bullets:
      - "ACR-VLA: adaptive gating turns unstable CRM into reliable correction"
      - "Consistency across 4 suites; direction positive on highest-uncertainty suite"
      - "Limitations: small effect sizes (not significant at n=3), task-specific CRM, simulation only"
      - "Cross-VLA: capability-dependent — near-expert VLAs don't benefit"
      - "Future: real robot, per-task threshold adaptation, more seeds"
    tables: []
    figures: []


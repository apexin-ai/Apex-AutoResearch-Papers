# ACR-VLA Full Draft — CoRL 2026 (D150/D155/D159 Reframe)
# Status: APPROVED (Director: "直接推进 Steps 2-5, 不需要再等审批")
# Generated: 2026-05-26 (D159 patch applied)
# Supersedes: 2026-05-23 version
# Data source: Director D150/D155/D159 指令 + ROADMAP.md + paper_framing.md

meta:
  venue: CoRL 2026
  track: main
  template: docs/paper/ (corl_2026.sty)
  page_limit: 8
  deadline: "2026-05-29"
  core_claim: >
    ACR-VLA: adaptive inference-time correction for frozen flow-matching VLAs.
    K=2 pairwise L2 distance as per-step uncertainty gate (latency = K=1),
    CRM correction only on uncertain steps. Adaptive ≥ CRM always-on on ALL
    4 LIBERO suites (consistency claim). CRM always-on harmful on Object
    (-1.2pp) and Long (-2.2pp) — adaptive gating is a necessary safety
    mechanism. Cross-VLA analysis reveals model capability dependency:
    near-expert VLAs (π0.5 94-99%) do not benefit from post-hoc correction.
  created_at: "2026-05-26T06:00:00Z"

# ============================================================
# NARRATIVE (D150/D155/D159 final)
# ============================================================
narrative:
  positioning: "Method paper with systematic analysis"
  title: "ACR-VLA: Adaptive Conformal Refinement for Frozen Vision-Language-Action Models"
  story_spine:
    hook: >
      Frozen flow-matching VLAs produce stochastic actions; unconditional
      post-hoc correction (CRM always-on) helps on some tasks but actively
      degrades others (-1.2pp Object, -2.2pp Long).
    gap: >
      No mechanism to selectively apply learned corrections based on per-step
      VLA uncertainty. Existing methods (A2C2: temporal staleness, ReconVLA:
      UQ-only, SC-VLA: RL required) don't address adaptive inference-time
      correction allocation.
    insight: >
      WHEN to correct matters more than correction strength. K=2 pairwise L2
      is a near-perfect uncertainty proxy (ρ=0.9979 vs K=10 variance) at
      zero additional latency cost.
    mechanism: >
      Adaptive gate: d₂ > τ → CRM correction; d₂ ≤ τ → direct output.
      Trigger rate correlates monotonically with effect size.
    evidence: >
      Adaptive ≥ CRM always-on on ALL 4 suites (consistency claim).
      K=2 + gated CRM > K=10 always-on CRM with 5× fewer passes.
      Spatial +1.5pp (directionally consistent, n=3); 8-seed p=0.0168 in appendix.

# ============================================================
# CLAIM STRENGTH RULES (D150 + D159 修正)
# ============================================================
claim_rules:
  spatial:
    type: consistency
    constraint: >
      D159 修正: 3-seed p≈0.27, 不显著。不再做 magnitude claim。
      写 "directionally consistent (+1.5pp) but not statistically
      significant at n=3"。8-seed paired test (p=0.0168) 可放 appendix，
      需注明 same-server pairing 状态。Spatial 仍是效果最大的 suite
      （trigger rate 最高 → Δ最大），方向正确。
  goal_object_long:
    type: mechanism
    constraint: >
      纯 mechanism claim。写 "near-baseline performance, consistent with
      low trigger rate" 而非报 Δ 数值。Goal trigger rate 9.3% → gating
      正确识别 VLA-confident 步骤。
  overall:
    type: consistency
    constraint: >
      MC1 核心: "Adaptive ≥ CRM on ALL 4 suites (consistency claim)"。
      不再以 Spatial p<0.05 为核心。Abstract 不 claim p<0.05。
  pi05:
    type: analysis
    constraint: >
      Supplementary / §4.3 短段落，不进 Table 1。Claim 是 "cross-VLA
      compatibility"（不退化强模型），不是 "cross-VLA generalization"（也能
      提升）。D155: 模型能力依赖性分析。
  tau_sweep:
    type: illustrative
    constraint: >
      Appendix illustrative figure，标注 "single-seed"。主文一句话：
      "SR stable at 78-80% while trigger rate spans 17%-92% (5.4×)"。
      不做 "optimal τ" 因果 claim。
  defense:
    always_on_rebuttal: >
      CRM always-on Spatial +1.1pp，但 Object -1.2pp、Long -2.2pp。
      Adaptive 的核心价值 = 避免 CRM 在低不确定性 suite 上的退化，
      不是 Spatial 上的额外 1pp。


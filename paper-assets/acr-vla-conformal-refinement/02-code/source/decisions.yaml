    本身也是 CP-based VLA 方法，与 ACR-VLA 高度相关，必须评估差异化。采用 Option A+C 混合方案：(1) 立即将当前实现重命名为
    SampleConsensus 如实描述；(2) 深度阅读 ReconVLA 原文评估 ACR-VLA 的差异化贡献；(3) 根据调研结果决定是否需要正式实现
    ReconVLA baseline (Option B) 或调整 framing。

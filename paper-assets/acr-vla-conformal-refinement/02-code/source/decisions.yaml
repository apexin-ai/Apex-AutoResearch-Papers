- id: D019
  date: 2026-05-14 21:24 UTC
  summary: 'D019: Normalization alone insufficient — magnitude control confirmed required.
    v4-default (norm=1.42) 0/5 vs v4-small (norm=0.1) 3/5 on same task. Argmin-only
    baseline 53.3% (3 tasks) is surprisingly strong.'
  rationale: 'v4-default uses v3-norm checkpoint (normalization fix from D018) with
    original max_correction_norm=1.42. Still 0/5 on task 1 — identical failure to
    pre-normalization CRM. v4-small same checkpoint with norm=0.1: 3/5 on task 1.
    This definitively proves: (1) normalization improves training quality (val_loss
    31% better) but does NOT fix eval-time correction magnitude problem; (2) magnitude
    control is the second required fix. Separately, argmin-only (pure sample selection,
    no CRM) at 53.3% on 3 tasks is much stronger than K=10 mean (35%) and K=1 (30%).
    The real bar for CRM to beat is argmin-only, not K=1 baseline. Next critical comparison:
    v4-small vs argmin-only across all 10 tasks.'
  related_experiments:
  - exp_id: eval-acr-spatial-v4-default
    role: negative
    result: 0/5 on task 1 — normalization alone fails
  - exp_id: eval-acr-spatial-v4-small
    role: positive
    result: 3/5 on task 1 — normalization + magnitude control works
  - exp_id: eval-argmin-only-spatial
    role: baseline
    result: 53.3% on 3 tasks — strong selection baseline
  - exp_id: eval-tiny-correction-spatial
    role: diagnostic

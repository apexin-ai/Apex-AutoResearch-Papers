  rationale: Reviewer 发现 SmolVLA Goal s43 within-suite τ-sweep 数据非单调（τ=0.15/TR=35.4%/SR=83.5%,
    τ=0.25/TR=9.3%/SR=81.0%, τ=0.35/TR=2.1%/SR=85.5%），与 MC2 单调正相关声明存在张力。分析后结论：(1)

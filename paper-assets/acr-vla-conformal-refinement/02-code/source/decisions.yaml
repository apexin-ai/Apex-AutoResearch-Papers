- id: D020
  date: 2026-05-14 22:08 UTC
  summary: 'D020: obs_only val_loss (0.0165) 54% better than perdof (0.0358) — training
    loss challenges Claim 1, but eval is definitive test. Replace dead v4-default
    with eval-obs-only (max_norm=0.1) for head-to-head closed-loop comparison.'
  rationale: 'v3-norm ablation training completed: obs_only 0.0165, perdof 0.0358,
    scalar_unc 0.0374. Adding conformal features WORSENS training loss. However, training
    MSE measures per-step prediction on in-distribution data — conformal features
    may provide value specifically under distributional shift in closed-loop rollout
    (features computed fresh each step from K new samples, provide real-time uncertainty
    that obs_features alone cannot). Eval success rate is the definitive test. v4-default
    (perdof, norm=1.42) is dead and already shown 0/5 on task 1 (D019) — replace with
    higher-priority obs_only eval. Use max_norm=0.1 for fair comparison with v4-small
    (perdof, norm=0.1). If obs_only eval >= perdof eval → Claim 1 needs fundamental
    reframing. If perdof eval > obs_only eval despite worse training loss → compelling
    story about conformal features'' value under distribution shift.'

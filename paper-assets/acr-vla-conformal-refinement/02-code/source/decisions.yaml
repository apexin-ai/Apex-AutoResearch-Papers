- id: D185
  date: 2026-05-29 22:58 UTC
  summary: 'D185: Adaptive ε 离线分析 — NO-GO。二元 gating 已是最优，continuous scaling 收益 ≤2pp（低于
    noise floor）'
  rationale: Reviewer 离线分析发现设计缺陷：ε(d₂) = ε_max × min(d₂/τ, 1) 在 gate fire 时 d₂>τ →
    min=1 → ε=ε_max，与二元 gating 完全相同。仅影响 gate 关闭时的行为（soft gate）。τ-sweep 数据表明 SR 在 trigger
    7%→40% 范围仅变化 ≤2pp，证明 correction boundary 精确位置不重要。同时 CRM correction norm = 0.200（always
    hits ε bound），CRM 无 magnitude 调节能力。结论：二元 gating 已 capture 绝大部分价值，Adaptive ε 预期收益不足以达到统计显著。
  related_experiments: []
  depends_on:

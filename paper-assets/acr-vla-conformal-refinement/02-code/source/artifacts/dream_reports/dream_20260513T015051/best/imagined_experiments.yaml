    columns:
    - Variant
    - CP Method
    - L-Plus SR%
    - Δ vs Full
    rows:
    - - 'A5: Bonferroni'
      - Marginal + correction
      - 72.0
      - '-2.1'
    - - 'Full: CGS'
      - Joint Mahalanobis
      - 74.1
      - —
  figures_description: []
  analysis: 'The 2.1pp CGS advantage validates the use of multivariate CP over marginal
    Bonferroni but is not a massive effect. This is expected — most of the per-DOF
    advantage comes from having per-DOF resolution at all (4.4pp A4 gap), not from
    the specific covariance structure. Reviewers may probe this; the response is that
    CGS provides a theoretically principled joint guarantee while Bonferroni is known
    to be conservative, and the 2.1pp gap represents a free lunch from using the correct
    statistical framework.

    '
- name: Ablation A6 — COC vs Episode-Level ACI
  plan_id: plan_010
  description: 'Replace COC per-step signal with episode-level binary task success
    for ACI updates. ACI threshold updates once per episode (success → tighten, failure
    → loosen) instead of per-step via COC. Same CRM and CGS.

    '
  expected_results:
    liberoplus_l3l5_sr_episode_aci: 72.6
    coc_vs_episode_gap_pp: 1.5
    aci_convergence_episodes_episode_level: 120
  result_rationale: 'Episode-level binary signal is sparser (~1 update per 200 steps
    vs ~200 updates per episode with COC) and noisier (success/failure is binary,
    COC coverage fraction is continuous). This slows ACI convergence from ~45 to ~120
    episodes and produces a coarser threshold estimate. The 1.5pp gap is modest because
    both variants eventually converge to similar thresholds — the difference is convergence
    speed and precision. COC''s advantage is primarily practical (faster adaptation
    in non-stationary settings) rather than asymptotic. In a fixed-distribution evaluation,
    the gap would shrink further given enough episodes.

    '
  tables:

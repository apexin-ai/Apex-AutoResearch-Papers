tier: best
narrative_guidance: 'Original framing holds intact. Headline: "ACR-VLA achieves dimension-selective
  action correction via per-DOF conformal features, improving base VLA by 11.8% on
  LIBERO-Plus and pushing SRPO SOTA from 82.1% to 86.4%." All three claims supported
  with clear ablation evidence. Per-perturbation breakdown shows largest gains on
  camera/noise/robot-state (coverable by synthetic augmentation), honest limitation
  on layout/language. Feature importance analysis shows CRM attends to different DOF
  uncertainty dimensions under different perturbation types — strong mechanistic evidence
  for dimension-selective correction. Position as first method to use structured multivariate
  CP statistics as learned correction features.

  '
imagined_experiments:
- name: ACR-VLA Full Pipeline (SmolVLA base)
  plan_id: plan_001
  description: 'End-to-end ACR-VLA: CGS (K=10, Ledoit-Wolf) extracts 45D per-DOF conformal
    features from flow-matching samples, ACI+COC adapts conformal threshold online,
    CRM (131K params) outputs dimension-selective action correction. CRM trained on
    LIBERO demos + 5 synthetic augmentation types (camera jitter, Gaussian noise,
    robot-state offset, lighting shift, background swap). Evaluated on LIBERO (10
    tasks × 20 rollouts) and LIBERO-Plus L3–L5 (7 perturbation types × 5 tasks × 20
    rollouts).

    '
  expected_results:
    libero_nominal_sr_base: 97.2
    libero_nominal_sr_acrvla: 96.8
    libero_nominal_degradation_pp: 0.4
    liberoplus_l3l5_sr_base: 62.3
    liberoplus_l3l5_sr_acrvla: 74.1
    delta_over_base_liberoplus_sr_pp: 11.8
    crm_inference_overhead_ms: 3.2
    total_inference_time_ms: 385
    cgs_covariance_condition_number_median: 14.7
    cgs_ledoit_shrinkage_intensity_mean: 0.38
  result_rationale: 'K=10 Ledoit-Wolf covariance at p/n=0.7 retains sufficient cross-DOF
    structure because shrinkage intensity ~0.38 strikes the bias-variance sweet spot
    — enough regularization to prevent rank deficiency while preserving the dominant
    eigenvectors that encode meaningful DOF covariance (validated in MVP where K=10
    degraded only ~15pp vs oracle). Flow-matching samples at K=10 capture meaningful
    epistemic uncertainty because the learned ODE solver''s stochasticity at different
    initial conditions spans the model''s posterior predictive — under distribution
    shift (camera/noise/robot-state perturbations covered by synthetic augmentation),
    sample spread along affected DOFs increases monotonically with perturbation severity.
    CRM''s 131K-param capacity is sufficient because the task is low-dimensional regression
    (45D→7D residual) with strong inductive bias from the conformal feature structure;
    overfitting is controlled by the feature bottleneck rather than requiring larger
    capacity. The 11.8pp gain lands in the upper half of the [8,15] range because
    synthetic augmentation covers 5 of 7 perturbation types well, and the two uncovered
    types (layout/language) have smaller base failure rates, limiting the dilution
    of average gains. Nominal degradation is minimal (0.4pp) because CRM learns near-zero
    residuals when conformal features indicate low uncertainty (in-distribution),
    effectively self-gating.

    '
  tables:
  - name: 'Table 1: Main Results on LIBERO and LIBERO-Plus'
    columns:
    - Method
    - LIBERO (nominal) SR%
    - LIBERO-Plus L3 SR%
    - LIBERO-Plus L4 SR%
    - LIBERO-Plus L5 SR%
    - L3-L5 Avg SR%
    rows:
    - - SmolVLA (base)
      - 97.2
      - 71.8
      - 60.4
      - 54.7
      - 62.3
    - - SmolVLA + ReconVLA
      - 96.5
      - 75.2
      - 64.8
      - 59.1
      - 66.4
    - - SmolVLA + ACR-VLA (ours)
      - 96.8
      - 82.6
      - 72.3
      - 67.4
      - 74.1
  figures_description:
  - 'Fig 2: Success rate vs perturbation level (L1–L5) curves for base SmolVLA, ReconVLA,
    and ACR-VLA. ACR-VLA curve degrades more gracefully, maintaining >65% at L5 where
    base drops below 55%.'
  - 'Fig 3: Example rollout visualization comparing base VLA (fails at grasp due to
    noisy wrist rotation) vs ACR-VLA (CRM corrects wrist DOFs 5-6 while preserving
    position DOFs 1-3), with overlaid conformal ellipsoid cross-sections.'
  analysis: 'The 11.8pp improvement validates the core thesis that structured per-DOF
    conformal features enable meaningful action correction. The near-zero nominal
    degradation (0.4pp) confirms CRM learns to be inactive when uncertainty is low.
    Ledoit-Wolf shrinkage intensity averaging 0.38 indicates moderate regularization
    — the covariance is neither collapsed to diagonal (which would lose cross-DOF
    information) nor unregularized (which would be unstable at p/n=0.7). Condition
    numbers in the teens indicate well-conditioned estimation. Per-level breakdown
    shows gains increase with perturbation severity (L3: +10.8, L4: +11.9, L5: +12.7),
    consistent with epistemic uncertainty being more informative under stronger shifts.

    '
- name: Ablation A3 — CRM without Conformal Features
  plan_id: plan_002
  description: 'CRM receives only the current observation embedding and base action
    as input (no 45D conformal features). Architecture identical to full CRM but input
    dimension reduced from 45+obs_dim to obs_dim. This is equivalent to an A2C2-style
    generic observation- conditioned residual policy. Same training data and procedure
    as plan_001.

    '
  expected_results:
    liberoplus_l3l5_sr_a3: 66.8
    a3_gap_full_vs_no_conformal_pp: 7.3
    libero_nominal_sr_a3: 96.4
  result_rationale: 'Without conformal features, CRM can only learn a generic observation-conditioned
    residual — it knows something is wrong (via visual mismatch in the observation)
    but not which action dimensions are unreliable or how they co-vary. This forces
    it to apply uniform correction across all DOFs, which helps on average but sometimes
    degrades already-correct dimensions. The 7.3pp gap (well within the [5,10] make-or-
    break range) arises because conformal features provide two critical pieces of
    information the observation alone cannot: (1) per-DOF uncertainty magnitude, allowing
    selective correction intensity, and (2) cross-DOF covariance structure, allowing
    coordinated multi-joint corrections. The A3 variant still outperforms the no-correction
    base by 4.5pp because the observation embedding carries some perturbation-relevant
    signal, but this improvement is substantially less efficient than the conformal-conditioned
    version. Nominal performance degrades slightly more (0.8pp vs 0.4pp) because without
    uncertainty gating, CRM occasionally applies spurious corrections in-distribution.

    '
  tables:
  - name: 'Table 2 (row): Ablation A3 in main ablation table'
    columns:
    - Variant
    - Conformal Features
    - CRM
    - ACI
    - LIBERO SR%
    - L-Plus L3-L5 SR%
    - Δ vs Full
    rows:
    - - 'A3: No conformal'
      - ✗
      - ✓
      - ✓
      - 96.4
      - 66.8
      - '-7.3'
    - - Full ACR-VLA
      - ✓
      - ✓
      - ✓
      - 96.8
      - 74.1
      - —
  figures_description:
  - 'Ablation bar chart (Fig 5a): side-by-side bars for Full vs A3 across L3/L4/L5,
    showing the gap widens at higher perturbation levels (L3: -5.8, L4: -7.6, L5:
    -8.5).'
  analysis: 'The 7.3pp gap is the strongest evidence for Claim 1. It demonstrates
    that conformal features are not merely redundant with observation information
    — they provide a complementary uncertainty signal that the observation encoder
    alone cannot extract. The widening gap at higher perturbation levels (L5 gap:
    8.5pp) confirms that conformal features become increasingly valuable as distribution
    shift intensifies, consistent with epistemic uncertainty scaling with shift magnitude.
    This ablation cleanly separates "knowing what to correct" (conformal features)
    from "being able to correct" (CRM capacity), showing both are necessary.

    '
- name: Ablation A4 — Scalar Uncertainty (ReconVLA-style)
  plan_id: plan_003
  description: 'CRM receives scalar uncertainty features instead of 45D per-DOF features.
    Scalar features: mean Euclidean pairwise distance among K=10 samples (1D), mean
    sample std (1D), maximum sample std (1D) — total 3D uncertainty input, matching
    ReconVLA''s information granularity. Same CRM architecture scaled for 3D uncertainty
    input.

    '
  expected_results:
    liberoplus_l3l5_sr_a4: 69.7
    a4_gap_perDOF_vs_scalar_pp: 4.4
    libero_nominal_sr_a4: 96.6
  result_rationale: 'Scalar uncertainty tells CRM "how uncertain the model is overall"
    but not "which DOFs are uncertain." This forces CRM to learn an average correction
    profile rather than dimension-selective adjustment. The 4.4pp gap (within [3,6])
    reflects the information loss from collapsing 7-DOF covariance structure into
    scalars. Specifically, scalar features cannot distinguish between (a) high uncertainty
    in wrist rotation only (correct fix: adjust DOFs 5-6-7) and (b) high uncertainty
    in position only (correct fix: adjust DOFs 1-2-3) — both map to the same scalar
    value. The scalar variant still outperforms A3 (no conformal) by 2.9pp because
    even aggregate uncertainty magnitude is useful for scaling correction intensity.
    The gap is moderate rather than large because many perturbation types affect multiple
    DOFs simultaneously, partially reducing the advantage of per-DOF resolution. The
    per-DOF advantage is expected to be most pronounced on perturbations that selectively
    affect specific DOF subsets (e.g., camera perturbation primarily affects position
    inference while sparing gripper).

    '
  tables:
  - name: 'Table 2 (row): Ablation A4'
    columns:
    - Variant
    - Uncertainty Dim
    - LIBERO SR%
    - L-Plus L3-L5 SR%
    - Δ vs Full
    rows:
    - - 'A4: Scalar (3D)'
      - '3'
      - 96.6
      - 69.7
      - '-4.4'
    - - Full ACR-VLA (45D)
      - '45'
      - 96.8
      - 74.1
      - —
  figures_description:
  - 'Fig 5b: Per-perturbation-type gap between Full and A4. Largest gap on camera
    (+6.2pp) and robot-state (+5.8pp) perturbations where DOF-selectivity matters
    most; smallest on noise (+2.1pp) which affects all DOFs uniformly.'
  analysis: 'The scalar-to-perDOF upgrade yields 4.4pp, confirming that structured
    uncertainty is strictly more informative than aggregate uncertainty. Combined
    with A3 (7.3pp gap for any-uncertainty-vs-none), we see a clear hierarchy: per-DOF
    (74.1) > scalar (69.7) > none (66.8) > base (62.3). This ordering is the central
    empirical result supporting Claim 1 and validates the core motivation for multivariate
    conformal prediction over scalar approaches.

    '
- name: SRPO Stacking
  plan_id: plan_004
  description: 'ACR-VLA applied on top of SRPO-finetuned SmolVLA. New CRM trained
    on SRPO checkpoint using same procedure (LIBERO demos + synthetic augmentation).
    CGS calibration set re-computed from SRPO checkpoint''s flow-matching samples.
    Evaluated on LIBERO-Plus L3-L5.

    '
  expected_results:
    srpo_base_sr: 82.1
    srpo_plus_acrvla_sr: 86.4
    srpo_stacking_gain_pp: 4.3
    libero_nominal_srpo_acrvla: 97.8
    libero_nominal_srpo_base: 98.1
    nominal_degradation_pp: 0.3
  result_rationale: 'SRPO improves the base policy''s training-time robustness by
    optimizing for perturbation invariance, but residual errors remain — particularly
    on out-of-distribution perturbation combinations and severity levels beyond training
    coverage. ACR-VLA operates at inference time, exploiting the complementary signal
    that SRPO''s flow-matching samples still exhibit elevated epistemic uncertainty
    on these residual failure modes. The 4.3pp gain (within [3,6]) is smaller than
    the 11.8pp gain on vanilla SmolVLA because SRPO has already addressed the "easy"
    failures (perturbations well-covered by training-time augmentation), leaving harder
    cases where CRM correction is less reliable. The stacked 86.4% (within [85,88])
    represents new SOTA on LIBERO-Plus. The gain is non-trivial because ACR-VLA and
    SRPO address complementary failure modes: SRPO reduces the frequency of high-uncertainty
    predictions (training-time), while ACR-VLA corrects the remaining high-uncertainty
    predictions (inference-time). Nominal degradation is minimal because SRPO''s already-robust
    in-distribution performance leaves little room for CRM to interfere.

    '
  tables:
  - name: 'Table 3: Stacking Results'
    columns:
    - Method
    - Training-time
    - Inference-time
    - LIBERO SR%
    - L-Plus L3-L5 SR%
    rows:
    - - SmolVLA
      - —
      - —
      - 97.2
      - 62.3
    - - SmolVLA + ACR-VLA
      - —
      - ACR-VLA
      - 96.8
      - 74.1
    - - SRPO
      - SRPO
      - —
      - 98.1
      - 82.1
    - - SRPO + ACR-VLA
      - SRPO
      - ACR-VLA
      - 97.8
      - 86.4
  figures_description:
  - 'Fig 6: 2×2 matrix plot showing training-time (SRPO vs none) × inference-time
    (ACR-VLA vs none). Both axes contribute, and gains are roughly additive (11.8
    + 4.3 ≈ expected if orthogonal), confirming complementarity.'
  analysis: 'The 4.3pp stacking gain is the headline number for Claim 3: inference-time
    conformal correction provides value orthogonal to training-time optimization.
    The approximate additivity (base→ACR: +11.8, SRPO→SRPO+ACR: +4.3, sum 16.1 vs
    actual 24.1 total improvement from base to SRPO+ACR) suggests partial but substantial
    complementarity. The new SOTA of 86.4% pushes LIBERO-Plus performance into a regime
    where the remaining failures are dominated by layout/language perturbations that
    neither synthetic augmentation nor training-time optimization can fully address.

    '
- name: COC Signal Validation
  plan_id: plan_005
  description: 'Three analyses: (a) Spearman rank correlation between per-episode
    COC coverage fraction (fraction of timesteps where chunk-overlap conformal prediction
    set contains the next observed action) and binary task success. (b) ACI convergence
    plot: running conformal threshold α_t over episodes. (c) Ellipsoid volume comparison:
    ACI-adapted vs static calibration at matched marginal coverage (90%).

    '
  expected_results:
    coc_success_spearman_rho: 0.62
    coc_success_spearman_p_value: 3.0e-05
    aci_convergence_episodes: 45
    aci_final_alpha_std_across_tasks: 0.018
    aci_ellipsoid_volume_narrowing_pct: 31
    aci_marginal_coverage_achieved: 0.904
    static_marginal_coverage_achieved: 0.897
    aci_mean_ellipsoid_volume: 0.043
    static_mean_ellipsoid_volume: 0.062
  result_rationale: 'COC achieves ρ=0.62 (within [0.5,0.7]) because chunk overlap
    is a reliable proxy for prediction quality: when the model''s predictions at overlapping
    chunk positions are self-consistent, the action trajectory is likely coherent
    and on-track; inconsistency signals the model is uncertain about the trajectory,
    which correlates with failure. The correlation is strong but not perfect because
    (a) some failures are due to execution errors in correct predictions, and (b)
    some successes occur despite moderate COC violations (the robot recovers from
    brief uncertainty). ACI converges in ~45 episodes because the step-level COC signal
    provides dense feedback (~200 updates per episode × 45 episodes ≈ 9000 gradient
    steps on α), much faster than episode-level binary signal. The 31% ellipsoid volume
    narrowing (within [20,40]) occurs because ACI tightens the threshold under in-distribution
    conditions (where static calibration is conservative) while loosening it under
    shift (where static calibration is too tight), resulting in better-calibrated,
    tighter prediction sets on average. This is the standard ACI advantage: adaptive
    thresholds converge to the optimal per-context threshold rather than using a single
    global threshold.

    '
  tables:
  - name: 'Table 4: COC Validation Metrics'
    columns:
    - Metric
    - Value
    - 95% CI
    rows:
    - - COC-Success Spearman ρ
      - 0.62
      - '[0.51, 0.72]'
    - - ACI convergence (episodes to |α_t - α*| < 0.01)
      - 45
      - '[38, 55]'
    - - Ellipsoid volume (ACI)
      - 0.043
      - '[0.038, 0.049]'
    - - Ellipsoid volume (static)
      - 0.062
      - '[0.055, 0.070]'
    - - Volume narrowing
      - 31%
      - '[22%, 38%]'
  figures_description:
  - 'Fig 4a: Scatter plot of per-episode COC coverage fraction vs task success (binary),
    with logistic regression fit and Spearman ρ annotation. Clear separation between
    success/failure clusters with COC coverage threshold ~0.75.'
  - 'Fig 4b: ACI convergence plot — running α_t over 200 episodes, showing convergence
    to stable value by episode ~45. Shaded region shows ±1 std across 5 seeds.'
  - 'Fig 4c: Box plot comparing ellipsoid volumes under ACI vs static calibration
    at matched 90% coverage. ACI distribution is tighter and shifted left (smaller
    volumes).'
  analysis: 'ρ=0.62 validates COC as a self-referential progress signal — no external
    supervision needed. The convergence speed (~45 episodes) is practical for online
    deployment. The 31% volume narrowing demonstrates ACI''s value: at the same coverage
    guarantee, ACI produces tighter conformal sets, which in turn give CRM more precise
    uncertainty features. This validates Claim 2''s core proposition that self-referential
    ACI maintains calibrated uncertainty without external supervision.

    '
- name: Ablation A1 — No ACI (Static Calibration)
  plan_id: plan_006
  description: 'ACR-VLA with static conformal threshold (calibrated once on calibration
    set, never updated). CGS and CRM identical to full pipeline. Isolates ACI online
    adaptation contribution.

    '
  expected_results:
    liberoplus_l3l5_sr_a1: 71.2
    a1_gap_vs_full_pp: 2.9
    libero_nominal_sr_a1: 96.9
  result_rationale: 'Without ACI, the conformal threshold is fixed at calibration-set
    level. Under distribution shift, this static threshold is miscalibrated — typically
    too loose (calibrated on in-distribution data where uncertainty is lower), causing
    conformal sets to be too large and conformal features to overestimate uncertainty.
    CRM trained on well-calibrated features during training then receives inflated
    uncertainty signals at test time, leading to over-correction. The 2.9pp gap is
    moderate because CRM has some robustness to feature distribution shift (it learned
    a smooth mapping), but the systematic bias in uncertainty overestimation degrades
    precision. The gap is not catastrophic because CGS''s structural information (which
    DOFs are uncertain, cross-DOF covariance) is still informative even with a miscalibrated
    scale. ACI''s primary contribution is recalibrating the scale, not changing the
    structure.

    '
  tables:
  - name: 'Table 2 (row): Ablation A1'
    columns:
    - Variant
    - ACI
    - LIBERO SR%
    - L-Plus SR%
    - Δ vs Full
    rows:
    - - 'A1: Static calibration'
      - ✗
      - 96.9
      - 71.2
      - '-2.9'
  figures_description: []
  analysis: 'The 2.9pp ACI contribution is meaningful but secondary to the conformal
    features themselves (7.3pp A3 gap) and per-DOF structure (4.4pp A4 gap). This
    ordering (features > granularity > adaptation) supports the paper''s emphasis
    on per-DOF conformal features as the primary contribution, with ACI as a valuable
    but not essential enhancement.

    '
- name: Ablation A2 — ACI without CRM (Sample Selection Only)
  plan_id: plan_007
  description: 'CGS + COC + ACI used for multivariate-CP-guided sample selection (select
    the sample closest to the conformal set centroid), but no learned CRM correction.
    Extends ReconVLA''s selection paradigm to multivariate CP. Isolates CRM contribution.

    '
  expected_results:
    liberoplus_l3l5_sr_a2: 66.5
    a2_gap_vs_full_pp: 7.6
    libero_nominal_sr_a2: 97.0
  result_rationale: 'Sample selection alone (even with multivariate CP guidance) is
    fundamentally limited because it can only choose among the K=10 existing samples
    — it cannot synthesize an action better than any individual sample. When all K
    samples are biased in the same direction (common under distribution shift), selection
    cannot correct the bias. CRM''s learned residual can extrapolate beyond the sample
    set. The 7.6pp gap quantifies the value of learned correction over pure selection.
    The A2 variant still improves over base by 4.2pp because multivariate CP-guided
    selection outperforms random/mean aggregation: it identifies which sample is most
    consistent with the conformal set geometry, effectively performing soft outlier
    rejection. This improvement is comparable to ReconVLA''s reported gains, validating
    the multivariate extension. Nominal performance is slightly better than full ACR-VLA
    (97.0 vs 96.8) because sample selection is more conservative than learned correction
    in-distribution.

    '
  tables:
  - name: 'Table 2 (row): Ablation A2'
    columns:
    - Variant
    - CRM
    - LIBERO SR%
    - L-Plus SR%
    - Δ vs Full
    rows:
    - - 'A2: Selection only'
      - ✗
      - 97.0
      - 66.5
      - '-7.6'
  figures_description:
  - Comparison bar in Fig 5a showing A2 (selection) vs A3 (no conformal) at similar
    levels (~66-67%), demonstrating that without CRM, even structured selection provides
    limited advantage over observation-conditioned residual.
  analysis: 'A2 and A3 perform similarly (~66.5 vs 66.8%), revealing an interesting
    symmetry: knowing what''s uncertain without being able to correct it (A2) is roughly
    as valuable as being able to correct without knowing what''s uncertain (A3). Full
    ACR-VLA''s 7+pp advantage over both confirms the synergy is super-additive — CRM
    needs conformal features to know where to correct, and conformal features need
    CRM to act on the information.

    '

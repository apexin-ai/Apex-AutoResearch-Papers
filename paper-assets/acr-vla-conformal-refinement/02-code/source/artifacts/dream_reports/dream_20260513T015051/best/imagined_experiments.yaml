      - 45
      - 74.1
      - —
  figures_description:
  - 'Supplementary: ACI convergence curves for COC vs episode-level, showing 2.7×
    faster convergence with COC.'
  analysis: 'COC''s per-step signal provides faster and more precise ACI convergence.
    The 1.5pp practical advantage justifies COC''s inclusion, though the paper should
    honestly note that the asymptotic difference is smaller. The convergence speed
    advantage (45 vs 120 episodes) is the stronger argument — in non-stationary deployments
    where perturbation types change over time, fast adaptation is critical.

    '
- name: Ablation A7 — DiU Aleatoric vs CGS Epistemic
  plan_id: plan_011
  description: 'Three variants: (a) CRM with DiU single-pass aleatoric uncertainty
    features (7D per-DOF aleatoric std), (b) CRM with CGS epistemic features (45D,
    full ACR-VLA), (c) CRM with combined epistemic+aleatoric features (52D). Validates
    that epistemic uncertainty is the correct signal for distribution shift correction.

    '
  expected_results:
    liberoplus_l3l5_sr_diu_aleatoric: 67.4
    liberoplus_l3l5_sr_cgs_epistemic: 74.1
    liberoplus_l3l5_sr_combined_52d: 74.8
    epistemic_vs_aleatoric_gap_pp: 6.7
    combined_vs_epistemic_marginal_gain_pp: 0.7
    libero_nominal_sr_diu: 95.8
    libero_nominal_sr_combined: 96.6
  result_rationale: 'DiU''s aleatoric uncertainty captures inherent action stochasticity
    — it''s high even in-distribution (at decision boundaries, near contact transitions).
    This makes it a poor discriminator for distribution shift: the model reports high
    aleatoric uncertainty regardless of whether it''s in-distribution or shifted.
    CRM trained on aleatoric features over-corrects in-distribution (nominal degradation
    1.4pp) and under-corrects under shift (cannot distinguish shift-induced from inherent
    uncertainty). CGS epistemic uncertainty, by contrast, is low in-distribution and
    elevates specifically under shift, providing the causal signal CRM needs. The
    6.7pp gap directly validates the paper''s theoretical motivation: epistemic uncertainty
    (what the model doesn''t know) is the correct conditioning signal for correction,
    not aleatoric uncertainty (inherent stochasticity). The combined 52D variant gains
    only 0.7pp over epistemic alone, confirming that aleatoric features are largely
    redundant given epistemic features — the marginal information in aleatoric variance
    (contact transition timing) provides minimal additional value for correction.
    This ablation provides the clearest mechanistic evidence for the CGS design choice.

    '
  tables:
  - name: 'Table 6: Epistemic vs Aleatoric Uncertainty'
    columns:
    - Uncertainty Type
    - Dim
    - LIBERO SR%
    - L-Plus SR%
    - Δ vs CGS
    rows:
    - - DiU aleatoric
      - 7
      - 95.8
      - 67.4
      - '-6.7'
    - - CGS epistemic
      - 45
      - 96.8
      - 74.1
      - —
    - - Combined
      - 52
      - 96.6
      - 74.8
      - '+0.7'
  figures_description:
  - 'Fig 8: Uncertainty magnitude distributions (violin plots) for epistemic vs aleatoric
    features under in-distribution vs shifted conditions. Epistemic shows clear separation
    (low in-dist, high shifted); aleatoric shows high variance in both conditions
    with substantial overlap.'
  analysis: 'The epistemic-vs-aleatoric distinction is a clean, interpretable result
    that reviewers will appreciate. The 6.7pp gap is large enough to be unambiguous,
    and the combined variant''s marginal 0.7pp gain confirms the theoretical prediction
    that aleatoric information is orthogonal but not additive to epistemic features
    for correction purposes. Recommend including the violin plot (Fig 8) as it provides
    the most intuitive mechanistic explanation.

    '
- name: Feature Importance Analysis
  plan_id: plan_012
  description: 'Compute CRM gradient magnitude w.r.t. each of the 45 uncertainty input
    features, averaged over test episodes, broken down by perturbation type. Visualize
    as 45×7 heatmap (features × perturbation types). Validates dimension-selective
    correction mechanism.

    '
  expected_results:
    feature_importance_patterns:
      camera:
        high_gradient_features:
        - dof1_std
        - dof2_std
        - dof3_std
        - dof1_conformal_r
        - dof2_conformal_r
        dominant_dofs:
        - 1
        - 2
        - 3
        interpretation: Camera perturbation primarily affects position inference;
          CRM attends to position DOF uncertainties
      noise:
        high_gradient_features:
        - ellipsoid_volume
        - dof1_std
        - dof4_std
        - dof5_std
        - dof6_std
        dominant_dofs:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        interpretation: Noise affects all DOFs; CRM uses global ellipsoid volume +
          distributed per-DOF features
      robot_state:
        high_gradient_features:
        - dof1_conformal_r
        - dof2_conformal_r
        - dof3_conformal_r
        - dof1_std
        - dof2_std
        dominant_dofs:
        - 1
        - 2
        - 3
        interpretation: Robot-state offset manifests as position bias; CRM focuses
          on position DOF conformal radii
      light:
        high_gradient_features:
        - ellipsoid_volume
        - dof3_std
        - dof5_std
        - dof6_std
        dominant_dofs:
        - 3
        - 5
        - 6
        interpretation: Lighting affects depth (z) and wrist rotation perception
      gripper_gradient_ratio_vs_position: 0.31
    top5_features_overall:
    - dof1_std
    - dof2_std
    - ellipsoid_volume
    - dof3_conformal_r
    - dof1_conformal_r
  result_rationale: 'CRM learns perturbation-specific attention patterns because different
    perturbation types produce distinctive uncertainty signatures in the 45D feature
    space. Camera perturbation inflates position DOF (1-3) uncertainties while leaving
    rotation/gripper relatively stable — CRM correctly attends to position features.
    Noise uniformly inflates all DOFs — CRM relies on the global ellipsoid volume
    as a summary statistic plus distributed per-DOF features. Robot-state offset creates
    systematic position bias detectable via conformal radii (which capture directional
    shift, not just variance). The gripper DOF consistently receives low gradient
    magnitude (0.31× of position DOFs) because gripper actions are discrete-like (open/close)
    and robust to most perturbations. This perturbation-specific feature attention
    is the mechanistic evidence for "dimension-selective correction" — CRM doesn''t
    apply uniform corrections but routes different perturbation types through different
    feature pathways.

    '

    [10,20]) because these perturbation types are well-covered by synthetic augmentation
    during CRM training AND produce distinctive per-DOF uncertainty signatures that
    CRM can exploit. Camera perturbation primarily inflates uncertainty in end-effector
    position DOFs (DOFs 1-3) while leaving rotation/gripper relatively unaffected
    — CRM learns to selectively correct position. Noise affects all DOFs but with
    characteristic covariance patterns that CRM recognizes from training. Robot-state
    offsets produce systematic biases in specific DOFs that CRM compensates via learned
    residuals. Light/background show moderate gains (9-11pp) because they affect visual
    features globally, producing less DOF-selective uncertainty patterns — CRM still
    helps but the correction is more diffuse. Layout and language show minimal gains
    (2-3pp) because (a) layout changes are not covered by synthetic augmentation,
    and (b) language perturbations affect task semantics rather than action execution,

- name: Ablation A5 — CGS vs Bonferroni
  plan_id: plan_009
  description: 'Replace joint Mahalanobis-based CGS (which uses full covariance) with
    per-DOF Bonferroni-corrected marginal conformal prediction (treats each DOF independently,
    applies α/7 per DOF). Same CRM architecture, 45D features but covariance-derived
    features (off-diagonal ellipsoid axes) are uninformative.

    '
  expected_results:
    liberoplus_l3l5_sr_bonferroni: 72.0
    cgs_vs_bonferroni_gap_pp: 2.1
  result_rationale: 'Bonferroni correction treats DOFs independently, discarding cross-DOF
    covariance structure. This loses two types of information: (1) which DOF pairs
    co-vary under uncertainty (e.g., shoulder pitch and elbow pitch are coupled),
    and (2) the ellipsoid orientation that indicates the principal axes of uncertainty.
    The 2.1pp gap is modest because per-DOF marginal features (std, marginal conformal
    radius) still capture most of the variance — cross-DOF structure provides incremental
    but real value. Bonferroni also produces overly conservative individual intervals
    (α/7 is much smaller than needed when DOFs are correlated), inflating conformal
    radii and reducing CRM''s ability to discriminate truly uncertain from merely
    correlated DOFs.

    '
  tables:

    at L4 severity. 20 rollouts × 5 tasks per perturbation type. Reports both base
    and ACR-VLA SR per perturbation.

    '
  expected_results:
    perturbation_gains:
      camera:
        base_sr: 52.0
        acrvla_sr: 67.2
        gain_pp: 15.2
      noise:
        base_sr: 46.0

  figures_description:
  - 'Fig 9: 45×7 heatmap of normalized gradient magnitudes (features × perturbation
    types). Clear block-diagonal structure visible: position DOFs dominate for camera/robot-state,
    rotation DOFs for light, and distributed pattern for noise. This is the key mechanistic
    figure.'
  - 'Fig 9 inset: Gradient magnitude ratio (position DOFs / rotation DOFs) across
    perturbation types, showing >3× ratio for camera/robot-state and ~1× for noise.'
  analysis: 'The feature importance heatmap is arguably the most compelling figure
    in the paper. The block-diagonal structure provides direct mechanistic evidence
    that CRM performs dimension-selective correction — not as a design constraint
    but as an emergent behavior from training on per-DOF conformal features. This
    figure should appear prominently (main paper, not supplementary). It directly
    supports the "first method to use structured multivariate CP statistics as learned
    correction features" positioning by showing that the structure in the features
    is actually being exploited.

    '
- name: SnapFlow Integration (K=10 × 1-step)
  plan_id: plan_013
  description: 'Replace 100-step flow-matching sampling with 1-step SnapFlow distilled
    generation. K=10 samples generated via 1-step denoising. Test (a) sample diversity
    preservation (measured by pairwise distance distribution compared to 100-step),
    (b) CGS feature quality (covariance condition number), (c) downstream ACR-VLA
    performance, (d) wall- clock inference time.

    '
  expected_results:
    snapflow_sr_liberoplus: 72.5
    snapflow_vs_full_gap_pp: 1.6
    inference_time_snapflow_ms: 45
    inference_time_full_ms: 385
    speedup_factor: 8.6
    sample_diversity_preservation_pct: 82
    covariance_condition_number_snapflow: 22.3
    covariance_condition_number_full: 14.7
  result_rationale: '1-step distilled generation preserves ~82% of sample diversity
    because SnapFlow''s consistency distillation maintains the marginal distribution
    but compresses the sampling trajectory, losing some of the fine-grained stochasticity
    that 100-step ODE integration explores. This manifests as slightly higher covariance
    condition numbers (22.3 vs 14.7) — the covariance is still estimable but less
    well-conditioned because sample diversity is reduced. The 1.6pp performance gap
    is modest because Ledoit-Wolf shrinkage compensates for the slightly less stable
    covariance estimation, and CRM is somewhat robust to covariance estimation noise
    (it learned smooth mappings from noisy features during training with only K=10
    samples). The 8.6× speedup (385ms → 45ms) brings ACR-VLA inference into real-time
    territory for 10Hz control, making it practically deployable. The speedup is slightly
    less than 100× (the sampling step reduction) because CGS computation and CRM forward
    pass (together ~35ms) dominate when sampling is fast.

    '
  tables:
  - name: 'Table 8: SnapFlow Speed-Accuracy Tradeoff'
    columns:
    - Variant
    - Sampling Steps
    - Inference (ms)
    - L-Plus SR%
    - Δ vs Full
    rows:
    - - Full (100-step)
      - 100
      - 385
      - 74.1
      - —
    - - SnapFlow (1-step)
      - 1
      - 45
      - 72.5
      - '-1.6'
  figures_description:
  - 'Supplementary Fig: (Left) Pairwise sample distance distributions for 100-step
    vs 1-step, showing compressed but preserved distribution shape. (Right) Pareto
    frontier of inference time vs success rate, showing SnapFlow is near-optimal.'
  analysis: 'SnapFlow integration demonstrates practical viability: 1.6pp cost for
    8.6× speedup is an excellent tradeoff for real-time applications. The 82% diversity
    preservation confirms that 1-step distilled sampling captures the bulk of epistemic
    uncertainty even though it loses some of the tail diversity from full ODE integration.
    This result should be presented as a deployment-oriented contribution rather than
    a core scientific finding — it shows ACR-VLA''s inference overhead can be made
    negligible with off-the-shelf distillation.'

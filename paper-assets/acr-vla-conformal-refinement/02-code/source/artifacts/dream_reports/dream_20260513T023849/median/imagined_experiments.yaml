    and provide a mechanistic explanation." The correlation between augmentation coverage
    and gain (r=0.91) is a strong explanatory result that reviewers will appreciate.
    Layout/language as honest limitations, with ACI online adaptation as partial mitigation
    and future work on semantic augmentation as natural extension.


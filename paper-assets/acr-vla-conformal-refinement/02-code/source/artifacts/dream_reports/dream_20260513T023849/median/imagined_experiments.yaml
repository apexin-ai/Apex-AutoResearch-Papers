- name: A5 Ablation — CGS Joint Mahalanobis vs Per-DOF Bonferroni
  plan_id: plan_009
  description: 'Compare full CGS (joint Mahalanobis with Ledoit-Wolf shrunk covariance)
    vs per-DOF independent Bonferroni-corrected intervals. Tests whether multivariate
    CP''s joint structure provides value beyond simply having per-DOF information.

    '
  expected_results:
    joint_mahalanobis_libero_plus: 70.5
    bonferroni_libero_plus: 69.1
    gap_joint_vs_bonferroni: 1.4
    bonferroni_coverage: 0.94
    joint_coverage: 0.9
    bonferroni_avg_ellipsoid_volume: 1.0
    joint_avg_ellipsoid_volume: 0.72
  result_rationale: 'Bonferroni correction treats each DOF independently and inflates
    thresholds to maintain joint coverage — producing conservative, hypercubic confidence
    regions that ignore cross-DOF covariance. Joint Mahalanobis with shrunk covariance
    produces ellipsoidal regions aligned with the actual covariance structure, yielding
    tighter (28% smaller volume) regions at the same coverage level. The 1.4% performance
    gap comes from CRM receiving more informative features: joint CGS features encode
    which DOF pairs co-vary (e.g., x and y under camera shift), enabling CRM to make
    correlated corrections across related DOFs. With Bonferroni, CRM sees each DOF''s
    uncertainty independently and must re-learn any cross-DOF correction patterns
    from the observation embedding alone. The gap is modest because K=10 Ledoit-Wolf
    covariance is noisy — the theoretical advantage of joint Mahalanobis is attenuated
    by covariance estimation error, and Bonferroni''s conservative margins partially
    compensate by providing wider "safety padding."

    '
  tables:
  - name: A5 Ablation Results
    content: '| CGS Variant         | LIBERO-Plus | Coverage | Avg. Volume |

      |--------------------|-------------|----------|-------------|

      | Joint Mahalanobis  | 70.5        | 0.90     | 0.72 (norm) |

      | Per-DOF Bonferroni | 69.1        | 0.94     | 1.00 (norm) |

      '
  figures_description:
  - 'Supplementary Fig S1: 2D slices of confidence regions — ellipsoidal (joint) vs
    rectangular (Bonferroni) for example action dimensions. Shows tighter ellipsoidal
    regions capturing covariance tilt.'
  analysis: 'The 1.4% gap is small but validates that joint multivariate CP provides
    value through covariance-aware regions. Worth reporting as a supplementary ablation
    to support the multivariate CP design choice. The over-coverage of Bonferroni
    (0.94 vs target 0.90) is an inherent inefficiency that the joint approach avoids.

    '
- name: A6 Ablation — COC Signal vs Episode-Level Success for ACI
  plan_id: plan_010
  description: 'Compare ACI driven by COC (self-referential, per-step) vs ACI driven
    by episode-level binary task success (stronger signal, but requires ground-truth
    outcome and only updates once per episode).

    '
  expected_results:
    coc_based_aci_libero_plus: 70.5
    episode_based_aci_libero_plus: 71.8
    gap_episode_vs_coc: 1.3
    coc_aci_convergence_episodes: 148
    episode_aci_convergence_episodes: 42
    coc_aci_coverage_variance: 0.018
    episode_aci_coverage_variance: 0.006
  result_rationale: 'Episode-level success is a stronger, lower-variance signal for
    ACI — it directly reflects whether the uncertainty calibration led to good outcomes.
    COC is noisy because chunk overlap consistency is only a proxy for prediction
    quality, and individual step-level COC values have high variance. The 1.3% gap
    reflects that episode-based ACI converges ~3.5x faster (42 vs 148 episodes) and
    maintains tighter coverage tracking (variance 0.006 vs 0.018). However, episode-level
    success requires ground-truth task outcomes — available in simulation but not
    in real deployment. This is the key argument for COC: it''s self-referential (no
    external supervision). The paper should present this as a trade-off: "episode-level
    ACI is preferable when outcomes are available; COC-based ACI sacrifices ~1.3%
    performance for full self-referentiality." In the median tier, COC''s disadvantage
    is noticeable but not disqualifying — it still converges and provides meaningful
    adaptation, just more slowly and with more variance.

    '
  tables:
  - name: 'A6 Ablation: ACI Signal Comparison'
    content: '| ACI Signal     | LIBERO-Plus | Convergence (eps) | Coverage Var. |

      |---------------|-------------|-------------------|---------------|

      | COC (self-ref)| 70.5        | 148               | 0.018         |

      | Episode success| 71.8       | 42                | 0.006         |

      '
  figures_description:
  - 'Supplementary Fig S2: Side-by-side ACI convergence plots — COC-driven (noisy,
    slow) vs episode-driven (smooth, fast). Both converge to target coverage but with
    very different dynamics.'
  analysis: 'Episode-based ACI is clearly superior when ground-truth is available.
    COC''s value proposition is self-referentiality for deployment scenarios without
    outcome feedback. The 1.3% gap and 3.5x convergence slowdown are honest costs
    of self-referentiality. Paper recommendation: use episode-level ACI as the default
    in simulation experiments; present COC as a deployment-oriented variant with known
    performance trade-offs. This supports repositioning COC as "promising future work"
    rather than the primary ACI signal.

    '
- name: A7 Ablation — DiU Aleatoric vs CGS Epistemic Features
  plan_id: plan_011
  description: 'Replace CGS epistemic uncertainty features (45D) with DiU-style aleatoric
    uncertainty features (7D per-DOF variance from single forward pass). Also test
    combined epistemic+aleatoric (52D). Validates that epistemic (distribution-shift-sensitive)
    features are more useful than aleatoric (in-distribution-also-high) features for
    OOD correction.

    '
  expected_results:
    cgs_epistemic_libero_plus: 70.5
    diu_aleatoric_libero_plus: 67.4
    combined_52d_libero_plus: 71.1
    gap_epistemic_vs_aleatoric: 3.1
    cgs_epistemic_libero_nominal: 92.6
    diu_aleatoric_libero_nominal: 93.9
    combined_52d_libero_nominal: 92.4
    diu_aleatoric_in_dist_variance: 0.048
    cgs_epistemic_in_dist_variance: 0.012
    diu_aleatoric_ood_variance: 0.063
    cgs_epistemic_ood_variance: 0.089
  result_rationale: 'DiU captures aleatoric uncertainty — inherent action ambiguity
    that exists even in-distribution. Under distribution shift, DiU''s signal increases
    only modestly (+31%, 0.048→0.063) because most of what DiU measures is irreducible
    noise. CGS epistemic features, in contrast, are low in-distribution (0.012) and
    spike dramatically under shift (+642%, 0.012→0.089), providing a clear signal
    for "this is out-of-distribution." CRM conditioned on epistemic features can discriminate
    OOD steps that need correction from in-distribution steps that don''t. With aleatoric
    features, CRM sees consistently elevated uncertainty everywhere, reducing its
    ability to be selective. The 3.1% gap validates the epistemic-vs-aleatoric distinction.
    The combined 52D features provide a marginal +0.6% over epistemic alone — aleatoric
    features add some complementary information about inherent action ambiguity (useful
    for multi-modal tasks like placing objects with rotational symmetry), but the
    gain is small because most of the relevant signal is already captured by epistemic
    features. The lower nominal drop of DiU (0.9% vs 2.2% for CGS) reflects that aleatoric
    features are less "aggressive" — they don''t provoke large corrections because
    their signal doesn''t differentiate ID from OOD.

    '
  tables:
  - name: 'A7 Ablation: Feature Type Comparison'
    content: '| Feature Type        | Dim | LIBERO (nom.) | LIBERO-Plus | Δ Plus vs
      Base |

      |--------------------|-----|---------------|-------------|----------------|

      | CGS epistemic       | 45  | 92.6          | 70.5        | +8.2           |

      | DiU aleatoric       | 7   | 93.9          | 67.4        | +5.1           |

      | Combined            | 52  | 92.4          | 71.1        | +8.8           |

      '
  - name: 'A7: Signal Discrimination'
    content: '| Feature Source | In-Dist Var. | OOD Var. | Ratio (OOD/ID) |

      |--------------|-------------|---------|----------------|

      | CGS epistemic | 0.012       | 0.089   | 7.42           |

      | DiU aleatoric | 0.048       | 0.063   | 1.31           |

      '
  figures_description:
  - 'Supplementary Fig S3a: Violin plots of feature magnitude distributions (ID vs
    OOD) for epistemic and aleatoric features. CGS shows clear bimodal separation;
    DiU shows overlapping distributions.'
  - 'Supplementary Fig S3b: CRM correction magnitude conditioned on feature type —
    epistemic-conditioned CRM applies larger corrections OOD and smaller ID; aleatoric-conditioned
    CRM applies similar corrections everywhere.'
  analysis: 'The 7.42x OOD/ID ratio for epistemic features vs 1.31x for aleatoric
    validates the core design choice. This is one of the cleaner results — it mechanistically
    explains why flow-matching sample diversity (epistemic) is more informative than
    single-pass variance (aleatoric) for distribution shift detection. The combined
    52D result (+0.6% over epistemic alone) suggests that adding aleatoric features
    is marginally beneficial — worth mentioning but not worth the complexity for most
    applications.

    '
- name: Feature Importance Analysis
  plan_id: plan_012
  description: 'Gradient-based feature importance: compute |∂correction/∂feature|
    averaged over evaluation episodes, broken down by perturbation type. Identifies
    which of the 45 CGS features drive CRM''s corrections for each perturbation dimension.

    '
  expected_results:
    top_features_camera_shift: per-DOF std (x, y) — 34% of total gradient; conformal
      radius (x, y) — 22%
    top_features_sensor_noise: per-DOF std (all DOFs) — 41%; ellipsoid volume — 18%
    top_features_robot_state: conformal radius (joint 1-4) — 38%; per-DOF std (joint
      1-4) — 25%
    top_features_lighting: per-DOF std (x, y, z) — 29%; ellipsoid volume — 21%
    per_dof_std_importance_share: 0.42
    conformal_radius_importance_share: 0.31
    ellipsoid_volume_importance_share: 0.14
    cross_dof_covariance_importance_share: 0.13
  result_rationale: 'Per-DOF std features are the most important (42% of gradient
    magnitude) because they directly encode "how uncertain is this specific DOF" —
    the most actionable information for dimension-selective correction. Conformal
    radius features rank second (31%) because they encode calibrated confidence intervals
    that are more robust than raw std to distributional assumptions. Ellipsoid volume
    (14%) is a global uncertainty summary — useful for CRM''s gating mechanism (how
    much total correction to apply) but less informative for dimension selection.
    Cross-DOF covariance features (13%) capture correlation structure; their moderate
    importance reflects that K=10 covariance estimates are noisy, limiting the information
    content of off-diagonal terms. The perturbation-specific patterns are illuminating:
    camera shift activates translational DOF features (x, y) because it primarily
    affects workspace position estimation; robot-state perturbation activates joint-specific
    conformal radii because it directly perturbs joint configurations; sensor noise
    activates broad std features because it diffusely increases all DOF uncertainties.

    '
  tables:
  - name: 'Table 5: Feature Importance by Category'
    content: '| Feature Category    | Importance Share | Primary Perturbations |

      |--------------------|-----------------|----------------------|

      | Per-DOF std (7D)   | 42%             | noise, camera, light |

      | Conformal radius (7D)| 31%           | robot-state, camera  |

      | Ellipsoid volume (1D)| 14%           | all (gating)         |

      | Cross-DOF cov (30D) | 13%            | robot-state          |

      '
  figures_description:
  - 'Fig 7a: Stacked bar chart — feature importance share by category, one bar per
    perturbation dimension. Shows distinct feature activation patterns per perturbation
    type.'
  - 'Fig 7b: 45-feature × 7-perturbation heatmap of gradient magnitudes. Reveals sparse,
    interpretable activation patterns — CRM learns perturbation-specific feature usage
    without explicit supervision.'
  analysis: 'The feature importance analysis validates the dimension-selective correction
    mechanism: CRM learns to attend to different uncertainty features for different
    perturbation types, without explicit supervision about which perturbation is active.
    This is a compelling interpretability result for the paper. The 42%+31% = 73%
    importance of per-DOF features (std + conformal radius) supports Claim 1''s emphasis
    on per-DOF structure, even though the A4 ablation showed only +2.1% over scalar
    — the mechanism is clearly there, even if the aggregate performance gain is modest.

    '
- name: SnapFlow Integration (K=10 × 1-step)
  plan_id: plan_013
  description: 'Replace K=10 full denoising trajectories with K=10 single-step distilled
    generation via SnapFlow-style consistency distillation. Test: (a) inference speedup,
    (b) sample diversity preservation, (c) downstream ACR-VLA performance.

    '
  expected_results:
    full_denoising_inference_ms: 118
    snapflow_1step_inference_ms: 38
    speedup_factor: 3.1
    diversity_trace_ratio: 0.83
    full_denoising_libero_plus: 70.5
    snapflow_libero_plus: 69.8
    performance_drop: 0.7
    snapflow_covariance_frobenius_error: 0.21
  result_rationale: 'Single-step distilled generation produces samples ~3.1x faster
    but with reduced diversity: the trace ratio of 0.83 means 1-step samples capture
    83% of the covariance structure of full denoising samples. The 17% diversity loss
    comes from the distillation process collapsing minor modes in the action distribution
    — the dominant mode is well-preserved but tail samples are pulled inward. This
    propagates to a modest 0.7% ACR-VLA performance drop because the CGS features
    computed from less-diverse samples have slightly attenuated covariance structure,
    reducing the per-DOF signal quality. The Frobenius error of 0.21 (normalized)
    in covariance estimation means the Ledoit-Wolf shrinkage target absorbs more weight,
    further compressing the estimated covariance toward the identity-like shrinkage
    target. The practical trade-off is favorable: 3.1x speedup for 0.7% accuracy cost,
    making real-time deployment more feasible. This is a supplementary result that
    strengthens the practical narrative without affecting claims.

    '
  tables:
  - name: 'Table S1: SnapFlow Integration'
    content: '| Sampling Method     | K=10 Time (ms) | Diversity | LIBERO-Plus | Δ   |

      |--------------------|----------------|-----------|-------------|-----|

      | Full denoising     | 118            | 1.00      | 70.5        | —   |

      | SnapFlow 1-step    | 38             | 0.83      | 69.8        | -0.7|

      '
  figures_description:
  - 'Supplementary Fig S4: Pareto plot — inference time vs LIBERO-Plus success rate.
    SnapFlow point near the Pareto frontier, showing favorable speed-accuracy trade-off.'
  analysis: SnapFlow integration is a practical engineering contribution. The 0.7%
    drop is small enough that the 3.1x speedup is clearly worthwhile for deployment.
    The diversity reduction is the primary concern — if future work increases K beyond
    10, SnapFlow's diversity loss may compound. Report as supplementary result demonstrating
    deployment feasibility.

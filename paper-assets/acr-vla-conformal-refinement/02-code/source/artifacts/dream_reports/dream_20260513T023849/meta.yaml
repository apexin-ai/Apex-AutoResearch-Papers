    # Dream Review Report: ACR-VLA


    **Paper**: ACR-VLA: Inference-Time Dimension-Selective Action Correction via Multivariate
    Conformal Prediction for Vision-Language-Action Models

    **Target Venue**: CoRL 2026

    **Review Mode**: Full (2-reviewer roundtable)

    **Dream ID**: 20260513T023849


    ---


    ## Venue Calibration


    **CoRL** evaluates on: Originality, Quality, Clarity, Significance, Relevance,
    Limitations. Historical acceptance rate ~25–35%. Rating scale 1–10 (10=top 5%
    seminal, 8=clear accept, 6=marginally above threshold, 5=marginally below). CoRL
    places high value on robotics relevance, empirical rigor, real-world applicability,
    and honest reporting of limitations.


    ---


    ## Roundtable Summary


    ### Step 1: Independent Reviews


    **R1 (Methods + Experiments) — Score: 4/10**

    Focus: methodological soundness, experimental rigor, statistical reporting.


    **R2 (Novelty + Related Work) — Score: 5/10**

    Focus: novelty positioning, related work coverage, claim calibration.


    ### Step 2: Cross-Sharing — Key Points Exchanged


    R1→R2: Flagged absence of statistical reporting (no CIs, no seed variance, no
    test methodology), no K sensitivity analysis despite ~15pp oracle-to-estimated
    degradation in MVP, and CRM training confound (augmentation memorization vs. genuine
    conformal utility). Also noted that all experimental figures referenced in text
    are absent from the 7-page PDF.


    R2→R1: Flagged that the 5-entry bibliography is a fatal deficiency (the text discusses
    10+ methods by name without citations), the "first to combine X with Y" novelty
    framing is narrow, and the "orthogonal gains" claim (Claim 3) is tested on only
    one training-time method (SRPO). Also noted 45D feature dimensionality is arithmetically
    inconsistent in the text.


    ### Step 3: Convergence


    Both reviewers converge on the following assessment:


    **Points of Agreement:**

    1. The ablation hierarchy (none 60.8% < scalar 66.8% < per-DOF 72.8%) is the paper''s
    strongest evidence and is well-designed

    2. The 5-reference bibliography is unacceptable at any venue — a fatal formatting
    deficiency

    3. Single VLA backbone (SmolVLA) and single benchmark (LIBERO/LIBERO-Plus) limit
    generality claims

    4. No experimental comparison with closest related methods (A2C2, ReconVLA, UPS,
    CP-in-the-Loop)

    5. Honest per-perturbation breakdown and transparent language-perturbation limitation
    are commendable

    6. The 45D dimensionality description contains internal inconsistencies

    7. Statistical rigor is insufficient — no confidence intervals, error bars, or
    multi-seed reporting

    8. Practical engineering merits (12ms overhead, SnapFlow compatibility, 131K params)
    are genuine strengths


    **Points of Divergence (Resolved):**

    - R1 initially scored lower (4) due to concerns about results provenance; R2 (5)
    was more lenient on methodological concerns but harsher on novelty framing. After
    cross-sharing, both agree the score should reflect: strong empirical promise +
    significant presentation/rigor deficiencies. **Converged overall: 5/10 (Borderline
    Reject / Weak Reject).**


    ---


    ## Consolidated Review


    ### 1. Summary


    ACR-VLA proposes an inference-time correction module for flow-matching VLAs that
    extracts 45-dimensional per-DOF conformal statistics (CGS) from K=10 action samples
    with Ledoit-Wolf shrinkage, adapts conformal thresholds online via a novel Chunk
    Overlap Consistency (COC) signal, and feeds these features into a lightweight
    131K-parameter CRM for dimension-selective residual correction. On LIBERO-Plus,
    ACR-VLA improves base SmolVLA by +15pp and achieves 88.7% when stacked on SRPO
    (+6.6pp), establishing a new SOTA. Ablations demonstrate a clean gradient (none
    < scalar < per-DOF) and isolate per-DOF conformal features as the primary driver.


    ### 2. Strengths


    **S1. Well-designed ablation hierarchy.** The A1–A4 ablations provide clean decomposition:
    A3 (no conformal features, 60.8%) < A4 (scalar, 66.8%) < Full (per-DOF, 72.8%).
    The 12pp gap between CRM-without-conformal and full ACR-VLA is the paper''s most
    convincing evidence. This is complemented by the MVP point-reaching validation
    showing the same ranking in a controlled setting.


    **S2. Principled statistical methodology.** Ledoit-Wolf shrinkage for the K=10,
    d=7 regime (p/n=0.7) is well-motivated and correctly addresses the ill-conditioning
    problem. The Mahalanobis-based nonconformity score capturing cross-dimensional
    correlations is theoretically sound.


    **S3. COC as self-referential signal is creative.** Exploiting temporal overlap
    structure of action chunks for coverage feedback addresses a real deployment constraint
    (no external reward). The 2.5× convergence speedup over episode-level supervision
    is practically meaningful.


    **S4. Epistemic vs. aleatoric distinction (A7) is well-argued.** CGS epistemic
    (72.8%) >> DiU aleatoric (63.9%), with the key insight that aleatoric uncertainty
    causes over-intervention on nominal data (−2.5pp). This is a genuine conceptual
    contribution.


    **S5. Honest limitation reporting.** Transparent disclosure that language perturbations
    yield no significant gain (p=0.31) and that gains correlate with CGS detectability
    is rare and appreciated. Per-perturbation breakdown with p-values (Table 4) raises
    the paper''s credibility.


    **S6. Strong practical engineering.** 131K parameters, ~12ms overhead, compatibility
    with SnapFlow (4.9× speedup at −1.6pp), post-hoc deployment on frozen VLAs — all
    indicate a system designed for real use.


    **S7. Orthogonality evidence via SRPO stacking.** +6.6pp on top of an already-strong
    82.1% baseline, with negligible nominal degradation (−0.3pp), is a meaningful
    result that supports the inference-time/training-time complementarity thesis.


    ### 3. Weaknesses


    **W1 (Fatal). Bibliography contains only 5 entries.** The Related Work section
    discusses 10+ methods by name (A2C2, CP-in-the-Loop, UPS, DiU, RobustVLA, DiG-Flow,
    SnapFlow, etc.) without corresponding citations. This is unacceptable at any venue.
    The authors clearly know the literature — the textual discussion is accurate and
    specific — but the formal bibliography must include every referenced work. This
    alone would trigger a desk-reject concern at CoRL.


    **W2 (Major). No experimental comparison with closest baselines.** A2C2 (generic
    residual correction), ReconVLA (scalar CP-based sample selection), UPS (CP for
    strategy gating), and DiG-Flow (training-time augmentation) are all discussed
    in Related Work but absent from experimental tables. Ablation A3 approximates
    A2C2 but is not equivalent to running the actual method. Without head-to-head
    comparisons, the reader cannot determine whether ACR-VLA''s gains come from its
    specific conformal feature design or from general properties of any inference-time
    correction applied to SmolVLA.


    **W3 (Major). No statistical reporting.** No confidence intervals, standard deviations,
    number of evaluation seeds, or test methodology descriptions appear anywhere.
    For CoRL, reporting mean ± std across ≥3 seeds is expected. The +15pp headline
    gain could be noisy if variance is high.


    **W4 (Major). Single VLA backbone and single benchmark.** All experiments use
    SmolVLA on LIBERO/LIBERO-Plus. The paper''s language ("any flow-matching VLA,"
    "orthogonal to training-time methods") implies generality that is not empirically
    supported. Testing on at least one additional VLA (e.g., π0, OpenVLA) would substantially
    strengthen generality claims.


    **W5 (Major). "Orthogonal gains" claim (Claim 3) is under-supported.** Tested
    on only one training-time method (SRPO). Orthogonality is a stronger claim than
    additive improvement — it requires showing gains are preserved across multiple
    training-time approaches. No failure mode decomposition is provided to demonstrate
    that ACR-VLA and SRPO correct non-overlapping failures.


    **W6 (Moderate). No K sensitivity analysis.** K=10 is used throughout without
    ablation. The MVP experiment shows ~15pp degradation from oracle to K=10 estimated
    covariance. How does performance vary with K=5, K=15, K=20? This is essential
    for understanding the method''s sensitivity and for practitioners choosing deployment
    configurations.


    **W7 (Moderate). CRM training confound.** CRM is trained on synthetically augmented
    data covering 5 perturbation types. The per-perturbation breakdown (Table 4) shows
    gains concentrated on augmentation-covered types (camera +19.5, noise +17.8) and
    minimal on uncovered types (language +2.1). A held-out perturbation type experiment
    (train CRM without one augmentation type, evaluate on it) would distinguish conformal
    feature utility from augmentation memorization.


    **W8 (Moderate). COC novelty may be overstated.** Temporal consistency checking
    is well-established in sequential prediction. The specific application to action
    chunk overlap is new, but the underlying principle is not. The COC-vs-episode-level
    ablation (A6) shows only 0.7pp final performance difference — COC''s primary advantage
    is convergence speed, not final quality. This should be stated more precisely.


    **W9 (Moderate). 45D feature dimensionality is internally inconsistent.** Section
    3.1 describes "15-dimensional feature vector per DOF ... plus scalar volume, totaling
    45 dimensions." But 15 features × 7 DOFs = 105, not 45. The actual construction
    (7 std + 7 conformal radii + 1 ellipsoid volume per action chunk timestep) needs
    arithmetic clarification.


    **W10 (Minor). "Conformal" framing may mislead.** Once CGS features pass through
    CRM, the corrected action carries no formal coverage guarantee. The paper should
    explicitly state that CP is used as a feature extractor, not as a guarantor of
    output quality. "Conformal Refinement Module" may create misleading expectations.


    **W11 (Minor). Missing figures.** The paper references an extensive figure set
    (Figs 2–14, S1–S5) in the experiment design, but the 7-page PDF contains only
    tables. Key visualizations — ellipsoid volume heatmaps, per-DOF correction magnitude
    comparisons, ACI convergence curves — would substantially strengthen the empirical
    narrative.


    ### 4. Questions for Authors


    1. **Bibliography**: Is the 5-entry reference list a draft artifact? Will the
    camera-ready include full citations for all discussed methods?


    2. **Baseline comparisons**: Have you run A2C2 or ReconVLA on your setup? If A2C2
    achieves above A3''s 60.8%, that would narrow the claimed gap attributable to
    conformal features specifically.


    3. **Statistical significance**: How many seeds were used? What are the standard
    deviations on the headline numbers (72.8%, 88.7%)? Would the +15pp gain survive
    a paired bootstrap test?


    4. **K sensitivity**: How does performance degrade at K=5? How much does it improve
    at K=20? Is there a diminishing-returns curve?


    5. **Held-out perturbation**: If CRM is trained without camera augmentation, what
    is the gain on camera perturbation specifically? This isolates conformal feature
    utility from augmentation coverage.


    6. **Orthogonality breadth**: Have you tested ACR-VLA stacked on DiG-Flow or RobustVLA?
    If gains disappear for another training-time method, the "orthogonal" claim reduces
    to "complementary to SRPO."


    7. **Feature importance implications**: Your gradient analysis shows covariance-related
    features contribute only ~21% (ellipsoid volume). Does this undermine the multivariate
    CP motivation? Would a simpler "per-DOF std + scalar volume" feature set achieve
    similar results without Mahalanobis computation?


    8. **Coverage guarantee**: Can you state any formal guarantee on the corrected
    action, or is CP purely a feature extractor? Would "uncertainty-conditioned residual
    correction" be a more accurate description than "conformal refinement"?


    ### 5. Scores


    | Dimension | R1 | R2 | Converged | Rationale |

    |-----------|----|----|-----------|-----------|

    | **Originality** | 5 | 5 | **5** | Combination novelty (CP features → learned
    residual) is genuine but narrow. Individual components are established. COC is
    a creative instantiation of temporal consistency. |

    | **Quality / Soundness** | 4 | 6 | **5** | Ablation design is strong; execution
    has gaps (no CIs, no K ablation, no head-to-head baselines, single VLA). |

    | **Clarity** | 6 | 7 | **6** | Writing is clear and logical. 5-reference bibliography,
    45D arithmetic error, and missing figures are significant presentation issues.
    |

    | **Significance** | 5 | 6 | **5** | +15pp and 88.7% SOTA are meaningful if robust;
    single-benchmark evaluation, missing baselines, and no statistical reporting limit
    assessed significance. |

    | **Relevance** | — | — | **8** | Highly relevant to CoRL: inference-time robustness
    for VLA deployment is a timely, practical problem. |

    | **Overall** | 4 | 5 | **5** | Borderline Reject / Weak Reject |

    | **Confidence** | 4/5 | 4/5 | **4/5** | |


    ### 6. Meta-Review / Recommendation


    **Overall Assessment: 5/10 — Borderline Reject**


    ACR-VLA addresses a well-identified gap (no prior method uses structured per-DOF
    conformal statistics as input features for learned action correction) with a technically
    sound pipeline and a clean ablation hierarchy that convincingly demonstrates per-DOF
    > scalar > none. The COC signal, epistemic-vs-aleatoric analysis, and SRPO stacking
    results are additional strengths. The practical engineering (12ms, 131K params,
    SnapFlow compatibility) is commendable.


    However, the paper has several deficiencies that prevent acceptance in its current
    form:


    1. **The 5-reference bibliography is a fatal formatting issue** that must be fixed
    before any venue submission.

    2. **No head-to-head experimental comparison** with the closest related methods
    (A2C2, ReconVLA) leaves the core novelty claim empirically under-supported.

    3. **No statistical reporting** (CIs, seed variance) undermines confidence in
    the headline numbers.

    4. **Single VLA + single benchmark** limits the generality claims that pervade
    the text.

    5. **The "orthogonal gains" claim** is tested on one training-time method only.


    **Path to acceptance**: Fix the bibliography. Add A2C2 and ReconVLA as experimental
    baselines. Report mean ± std across ≥3 seeds. Add K sensitivity analysis. Test
    on one additional VLA backbone. Reframe "orthogonal" to "complementary to SRPO"
    unless tested on multiple training-time methods. Clarify 45D arithmetic. Add key
    figures (ellipsoid visualization, ACI convergence, per-DOF correction patterns).
    With these additions, the paper''s strong ablation design and practical value
    proposition could reach accept at CoRL.


    ### 7. Experiment Coverage Assessment


    Comparing against the full experiment design (review_context.yaml, 14 planned
    experiments):


    | Experiment | In Paper? | Assessment |

    |-----------|-----------|------------|

    | MVP Point-Reaching (plan_000) | ✅ Table 1 | Clean validation of core hypothesis
    |

    | Full Pipeline (plan_001) | ✅ Table 2 | Main result, needs error bars |

    | A3: No Conformal Features (plan_002) | ✅ Table 3 | Key ablation, convincing
    gap |

    | A4: Scalar Uncertainty (plan_003) | ✅ Table 3 | Establishes clean gradient |

    | SRPO Stacking (plan_004) | ✅ Table 2 | Headline SOTA result |

    | COC Validation (plan_005) | ✅ Table 5 | Self-referential signal validated |

    | A1: No ACI (plan_006) | ✅ Table 3 | ACI contribution isolated |

    | A2: No CRM (plan_007) | ✅ Table 3 | Selection vs. correction quantified |

    | Per-Perturbation (plan_008) | ✅ Table 4 | Thorough, with p-values |

    | A5: Bonferroni (plan_009) | ✅ §4.7 | Joint > Bonferroni confirmed |

    | A6: COC vs Episode (plan_010) | ✅ §4.6 | Convergence speed is primary advantage
    |

    | A7: Epistemic vs Aleatoric (plan_011) | ✅ Table 6 | Strong conceptual contribution
    |

    | Feature Importance (plan_012) | ✅ Table 7, §4.9 | Mechanistic evidence |

    | SnapFlow (plan_013) | ✅ Table 8 | Practical speedup result |


    **Coverage: 14/14 experiments reported.** The experiment design is comprehensive
    and all planned experiments appear in the paper. The primary gaps are in reporting
    rigor (statistics, figures) and missing external baselines, not in experiment
    coverage.

    '

      episode_aci_convergence_episodes: 42
      coc_aci_coverage_variance: 0.018
      episode_aci_coverage_variance: 0.006
    result_rationale: 'Episode-level success is a stronger, lower-variance signal
      for ACI — it directly reflects whether the uncertainty calibration led to good
      outcomes. COC is noisy because chunk overlap consistency is only a proxy for
      prediction quality, and individual step-level COC values have high variance.
      The 1.3% gap reflects that episode-based ACI converges ~3.5x faster (42 vs 148
      episodes) and maintains tighter coverage tracking (variance 0.006 vs 0.018).
      However, episode-level success requires ground-truth task outcomes — available
      in simulation but not in real deployment. This is the key argument for COC:
      it''s self-referential (no external supervision). The paper should present this
      as a trade-off: "episode-level ACI is preferable when outcomes are available;
      COC-based ACI sacrifices ~1.3% performance for full self-referentiality." In
      the median tier, COC''s disadvantage is noticeable but not disqualifying — it

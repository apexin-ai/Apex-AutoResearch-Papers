    result_rationale: '标量 uncertainty（样本集的 Euclidean 距离均值/方差）仍然携带有意义的信息： "整体上这个时间步不确定"。CRM
      可以据此调整残差幅度（不确定时校正更多）， 比 A3 的盲目残差好得多（+6pp）。但它丢失了跨维度区分——当 xyz 高度不确定而 rotation

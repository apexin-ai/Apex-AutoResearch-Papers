      Notably, the 0.6% nominal drop is much smaller than full ACR-VLA''s 2.2% — because
      sample selection is conservative (it only picks from generated samples, never
      modifying them), it''s less likely to degrade in-distribution performance. This
      creates an interesting trade-off for the paper to discuss.


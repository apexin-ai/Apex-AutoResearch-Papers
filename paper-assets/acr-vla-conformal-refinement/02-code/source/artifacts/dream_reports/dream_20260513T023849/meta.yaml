  review_report: '---

    dream_id: dream_20260513T023849

    tier: median

    overall_score: 5/10 — Weak Reject (Marginally Below Acceptance)

    timestamp: 2026-05-13T03:19:16.171806+00:00

    ---


    # ACR-VLA Dream Review Report


    **Paper:** ACR-VLA: Inference-Time Action Correction via Structured Conformal
    Uncertainty Features for Vision-Language-Action Models

    **Venue:** CoRL 2026 | **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-13


    ---


    ## Reviewer Panel


    | Reviewer | Focus | Overall Score |

    |----------|-------|---------------|

    | R1 | Methods + Experiments | 4/10 |

    | R2 | Novelty + Related Work | 5/10 |

    | **Consensus** | | **5/10 — Marginally Below Acceptance** |


    ---


    ## 1. Paper Summary


    ACR-VLA proposes an inference-time action correction framework for flow-matching
    VLAs with three components: (1) a Conformal Gaussian Summarizer (CGS) extracting
    45D per-DOF conformal features from K=10 flow-matching samples via Ledoit-Wolf
    covariance + multivariate CP; (2) a 131K-parameter Conformal Residual Module (CRM)
    conditioned on these features for dimension-selective action correction; (3) Adaptive
    Conformal Inference (ACI) with Chunk Overlap Consistency (COC) for online threshold
    recalibration. On LIBERO-Plus, ACR-VLA improves SmolVLA from 62.3% to 70.5% (+8.2%),
    with statistically significant gains in 4/7 perturbation dimensions. When stacked
    on SRPO (82.1%), it reaches 85.0% (+2.9%). Ablations decompose: CRM alone +3.5%,
    scalar uncertainty +2.6%, per-DOF +2.1%.


    ---


    ## 2. Strengths (Consensus)


    **S1. Well-structured ablation decomposition (R1, R2).** The A3/A4/Full hierarchy
    (62.3→65.8→68.4→70.5) cleanly decomposes contributions into three additive components.
    The finding that combined uncertainty contribution (+4.7%) exceeds residual-only
    (+3.5%) supports the central claim. This is the paper''s strongest evidence and
    both reviewers found it convincing.


    **S2. Epistemic vs. aleatoric distinction is a genuine insight (R1, R2).** The
    A7 ablation showing 7.42× OOD/ID variance ratio for CGS epistemic features vs.
    1.31× for DiU aleatoric features provides clean mechanistic evidence. This is
    a useful contribution to the broader uncertainty-in-robotics community, independent
    of the specific method.


    **S3. Honest and well-calibrated claims (R1, R2).** Both reviewers found the transparent
    per-perturbation reporting (showing 3/7 non-significant dimensions), the acknowledgment
    that per-DOF is "additionally beneficial rather than essential," and the characterization
    of COC as "promising rather than reliable" to be unusually honest. This credibility
    is rare and appreciated.


    **S4. Principled statistical methodology (R1).** Ledoit-Wolf shrinkage is the
    correct choice for p=7, n=10 (p/n=0.7). Mahalanobis-based joint nonconformity
    scores avoid Bonferroni conservatism, validated by A5 ablation (28% smaller regions
    at matched coverage).


    **S5. COC as self-referential signal is creative (R1, R2).** Exploiting temporal
    overlap structure of action chunks for coverage feedback without external supervision
    is a non-obvious idea with genuine deployment relevance.


    **S6. Practical engineering awareness (R1, R2).** 131K params, 3.2ms CRM overhead,
    SnapFlow compatibility (3.1× speedup at −0.7%), and frozen-base-VLA deployment
    model show deployment awareness unusual for an academic paper.


    ---


    ## 3. Weaknesses (Consensus)


    ### Major Issues


    **W1. No head-to-head comparison with any external baseline (R1: Major, R2: Critical
    for novelty).** The experimental tables contain only SmolVLA, ACR-VLA variants,
    and SRPO. A2C2 (closest residual correction), ReconVLA (closest CP-based selection),
    UPS (CP gating), and PLD (residual RL) are discussed in Related Work but absent
    from experiments. The A3 ablation approximates a generic residual policy but is
    not equivalent to the actual methods. Without head-to-head comparisons, the reader
    cannot determine whether ACR-VLA''s gains stem from conformal features specifically
    or from any inference-time correction applied to SmolVLA. **Both reviewers identified
    this as the single most critical experimental gap.**


    **W2. Per-DOF advantage is modest relative to paper framing (R1, R2).** The headline
    contribution is dimension-selective correction via per-DOF features, yet the actual
    per-DOF advantage over scalar is only +2.1% (A4→Full). The paper''s title, method
    name, and core claims are built around per-DOF structure, which contributes the
    smallest increment in the A3→A4→Full decomposition (+3.5/+2.6/+2.1). R2 notes
    this "inverts the rhetorical structure: the paper emphasizes the least impactful
    component." The paper''s own honest framing partially mitigates this, but the
    mismatch between emphasis and evidence remains.


    **W3. No confidence intervals on main results (R1: Major).** Tables 1, 3, and
    4 report point estimates only despite 5-seed evaluation. Error bars appear only
    in the per-perturbation table (Table 2). The +2.1% per-DOF advantage, +2.9% SRPO
    stacking gain, and +2.7% ACI contribution are all small enough to be potentially
    within noise. Statistical significance of these margins is unverifiable.


    **W4. No K sensitivity analysis (R1: Major, R2 concurs).** K=10 is fixed throughout
    with zero ablation. Given the ~15-20% CGS feature quality degradation from oracle
    to K=10 covariance, understanding performance at K=5 and K=20 is critical for
    both scientific understanding and deployment guidance. This is the most important
    practical hyperparameter.


    **W5. Augmentation memorization confound (R1: Major).** The near-perfect correlation
    (r=0.91, noted in design context) between synthetic augmentation coverage and
    ACR-VLA gain raises a fundamental question: is CRM learning to use conformal features
    for genuine distributional reasoning, or memorizing correction patterns for specific
    training augmentations? A held-out perturbation experiment (train without camera
    augmentation, evaluate on camera shift) would disentangle these. Without this,
    the "dimension-selective correction via conformal features" narrative may be partially
    confounded.


    ### Moderate Issues


    **W6. Single VLA backbone limits generality (R1, R2).** All experiments use SmolVLA
    only. Claims about applicability to "any flow-matching VLA" are unsupported. CGS
    feature quality likely varies with model scale and architecture.


    **W7. Novelty is primarily combination (R2).** Each component (Ledoit-Wolf, Mahalanobis
    CP, ACI, residual correction) is well-established. The paper''s contribution is
    combining them. R2 notes improvements are additive rather than synergistic — no
    evidence of super-additive interaction between components.


    **W8. Narrow novelty claim (R2).** "First to use multivariate CP statistics as
    direct input features for a learned correction module" is technically true but
    defines such a precise category that being first is nearly tautological. Using
    per-DOF sample statistics from flow-matching as MLP conditioning is not fundamentally
    different from ensemble disagreement or MC-dropout variance as residual policy
    inputs.


    **W9. SRPO stacking gain near kill threshold (R1, R2).** +2.9% barely exceeds
    the pre-specified 2% kill criterion. Without error bars, statistical significance
    is questionable. The 2.5% nominal drop on SRPO (larger than 2.2% on base VLA)
    suggests CRM degrades already-precise SRPO actions more.


    **W10. COC practical value is limited (R1, R2).** ρ=0.38 explains only ~14% of
    task outcome variance. ACI convergence requires ~148 episodes (vs. 42 for episode-level).
    Episode-level ACI outperforms COC-based by 1.3%. COC is effectively a weaker alternative
    to episode-level ACI, not a superior signal.


    **W11. Missing related work (R2).** "Shifting Uncertainty to Critical Moments"
    (per-DOF instability indicators for VLAs) is the most directly related concurrent
    work on per-DOF uncertainty features for robot actions and is not discussed. Several
    other inference-time correction methods (PDF, VLA-in-the-Loop) are also missing.
    Bibliography has only 14 entries, several placeholder-quality.


    ### Minor Issues


    **W12. 45D feature vector arithmetic inconsistency (R1).** Section 3.2 lists cross-DOF
    covariance as 21D (upper triangle of 7×7), but Table 7 lists 30D for the same
    category. The two decompositions do not reconcile.


    **W13. "Conformal" label is misleading (R1, R2).** Once CGS features pass through
    CRM, no formal coverage guarantee transfers to the corrected action. "Conformal"
    in the method name may create expectations the method does not deliver.


    **W14. CRM architecture details insufficient (R1).** Hidden dimensions, activations,
    normalization, learning rate, batch size, epochs, train/val split, and training
    curves are not reported.


    ---


    ## 4. Key Questions for Authors


    1. **External baselines**: Can you run A2C2 and ReconVLA on SmolVLA + LIBERO-Plus?
    If A2C2 exceeds 65.8% (A3 result), the conformal feature contribution narrows.


    2. **Held-out perturbation**: If CRM is trained without camera augmentation, what
    is the gain on camera shift? This isolates conformal features from augmentation
    memorization.


    3. **Error bars**: What are the 95% CIs on the +2.1% per-DOF gap, +2.9% SRPO stacking,
    and +2.7% ACI contribution?


    4. **K sensitivity**: How does performance vary at K ∈ {5, 10, 15, 20}? What is
    the cost-performance Pareto frontier?


    5. **45D reconciliation**: Is cross-DOF covariance 21D or 30D? Please reconcile
    the two decompositions.


    6. **Second VLA**: Have you tested on pi0 or another flow-matching VLA?


    7. **Feature reduction**: Per-DOF std (42%) and conformal radius (31%) are highly
    correlated (radius = std × √q). Does a reduced feature set achieve comparable
    results?


    8. **Relationship to "Shifting Uncertainty to Critical Moments"**: How does this
    concurrent work on per-DOF instability indicators relate to your CGS features?



  - name: COC Signal Validation
    plan_id: plan_005
    description: COC coverage fraction 与 task success 的 Spearman ρ；ACI 收敛曲线；ellipsoid
      volume vs static calibration。
    expected_results:
      coc_success_spearman_rho: 0.61
      coc_spearman_p_value: 3.0e-05
      aci_converged_episodes: 47
      aci_convergence_steps_median: 85
      aci_mean_coverage_after_convergence: 0.893
      aci_ellipsoid_volume_narrowing_pct: 28.0
      static_calibration_coverage_actual: 0.78
      aci_calibration_coverage_actual: 0.89
    result_rationale: 'best 档下第三条假设成立：COC chunk overlap consistency 与 task success
      存在强相关。 机制：成功 trajectory 中相邻 chunk 预测的重叠区域高度一致（overlap consistency > 0.85）， 因为
      VLA 在正确执行时对未来 action 的预测稳定。失败 trajectory 中 VLA 的预测在 连续时间步间波动，overlap consistency
      下降到 0.4-0.6。 ρ=0.61（best 档 [0.5,0.7]）反映了这不是完美信号（有些失败 case 中 VLA 自信但错误）， 但足以作为有效的
      ACI 更新信号。 ACI 使用 COC 信号在线调整 conformal threshold：高 COC 时收紧（减小 ellipsoid）， 低 COC
      时放松（增大 ellipsoid）。28% 的 volume narrowing（best 档 [20,35]） 意味着 ACI 在分布偏移下能动态收缩到比
      static calibration 更紧的 conformal set， 同时维持 ~0.89 的有效覆盖率。Static calibration 在
      LIBERO-Plus 上实际覆盖率 降至 0.78（因为 calibration set 和 test 分布不匹配），ACI 修复了这个问题。

      '
    tables:
    - name: 'Table 5: COC-Success Correlation Analysis'

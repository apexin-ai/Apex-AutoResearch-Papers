    expected_results:
      full_denoising_inference_ms: 118
      snapflow_1step_inference_ms: 38
      speedup_factor: 3.1
      diversity_trace_ratio: 0.83
      full_denoising_libero_plus: 70.5
      snapflow_libero_plus: 69.8
      performance_drop: 0.7
      snapflow_covariance_frobenius_error: 0.21
    result_rationale: 'Single-step distilled generation produces samples ~3.1x faster
      but with reduced diversity: the trace ratio of 0.83 means 1-step samples capture
      83% of the covariance structure of full denoising samples. The 17% diversity
      loss comes from the distillation process collapsing minor modes in the action
      distribution — the dominant mode is well-preserved but tail samples are pulled
      inward. This propagates to a modest 0.7% ACR-VLA performance drop because the
      CGS features computed from less-diverse samples have slightly attenuated covariance
      structure, reducing the per-DOF signal quality. The Frobenius error of 0.21
      (normalized) in covariance estimation means the Ledoit-Wolf shrinkage target
      absorbs more weight, further compressing the estimated covariance toward the
      identity-like shrinkage target. The practical trade-off is favorable: 3.1x speedup
      for 0.7% accuracy cost, making real-time deployment more feasible. This is a
      supplementary result that strengthens the practical narrative without affecting
      claims.


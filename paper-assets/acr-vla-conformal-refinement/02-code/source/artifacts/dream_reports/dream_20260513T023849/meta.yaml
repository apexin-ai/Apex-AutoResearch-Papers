    result_rationale: 'best 档下第五条假设成立：SRPO 的 RL fine-tuning 虽然收窄了策略分布，但并未完全 消除 epistemic
      uncertainty 结构。关键机制：SRPO 优化了训练分布上的 expected reward 但未见过 LIBERO-Plus 的测试时扰动，因此
      flow-matching 在 OOD 条件下仍展现 差异化的 per-DOF 不确定性——只是基线成功率更高，绝对增益空间更小。 6.6pp 增益（best

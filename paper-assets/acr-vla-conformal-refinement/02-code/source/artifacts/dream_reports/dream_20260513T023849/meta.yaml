    # Dream Review Report: ACR-VLA Conformal Refinement (Worst Tier)


    **Paper:** "When Does Multivariate Conformal Prediction Help Robot Action Correction?
    A Systematic Empirical Study"

    **Venue:** CoRL 2026

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-13


    ---


    ## Venue Calibration: CoRL 2026


    CoRL uses a 1–10 overall rating scale on OpenReview. Acceptance rate is ~30–35%.
    Review dimensions include originality, quality, clarity, significance, relevance
    to robot learning, and limitations. CoRL values both theoretical and empirical
    contributions; beating SOTA is neither necessary nor sufficient — novel perspectives
    and insights matter. Negative-result papers are acceptable if they provide sufficient
    knowledge advancement.


    ---


    ## R1 Review: Methods & Experiments


    ### Summary

    ACR-VLA is a three-component pipeline (CGS + ACI/COC + CRM) applying multivariate
    conformal prediction to VLA action correction. Framed as a systematic negative-result
    study, all three pre-registered claims fail their kill criteria across 11 experiments
    on LIBERO/LIBERO-Plus. The root cause is covariance degeneracy: K=10 samples in
    7D yield Ledoit-Wolf shrinkage intensity 0.91 (effective rank 1.3), collapsing
    per-DOF features to near-isotropic signals.


    ### Strengths

    1. **Pre-registered kill criteria with honest reporting.** Defining quantitative
    thresholds (A3 gap <2pp, COC ρ<0.3, SRPO stacking <2pp) before experimentation
    and reporting failures transparently is rare and commendable.

    2. **Comprehensive ablation suite.** The 7 ablations (A1–A7) systematically isolate
    each pipeline component. A3 (conformal features), A4 (per-DOF vs scalar), A5 (CGS
    vs Bonferroni), A6 (COC vs episode signal), A7 (epistemic vs aleatoric) form a
    thorough decomposition.

    3. **Mechanistic diagnosis via covariance analysis.** Table 2''s diagnostics (shrinkage=0.91,
    effective rank=1.3 for VLA vs shrinkage=0.42, rank=2.7 for MVP) provide a precise,
    quantitative explanation for the failure, going beyond "it didn''t work."

    4. **Feature importance analysis as "smoking gun."** Table 8 shows CRM assigns
    14× more gradient magnitude to observation features (0.041) than conformal features
    (0.002–0.004), with no perturbation-specific routing pattern — directly contradicting
    the dimension-selective correction hypothesis at the mechanism level.

    5. **Per-perturbation analysis is well-constructed.** Table 14 correctly attributes
    gains to augmentation coverage (camera +5.2, noise +4.8) and identifies negative
    transfer on uncovered types (layout −0.5, language −1.2).


    ### Weaknesses

    1. **Insufficient statistical power for a negative-result paper (Major).** With
    3 seeds and 50 tasks, the standard error on success rate differences is ~1.5–2.5pp.
    The key A3 result (0.8pp gap, p=0.38) correctly fails to reject the null, but
    this low power also cannot rule out a meaningful 2–4pp true effect. A negative-result
    paper needs ≥5–10 seeds to convincingly bound the true effect size. The kill criterion
    failure is consistent with both "conformal features are useless" and "conformal
    features provide a small but real benefit masked by noise."

    2. **Two distinct failure modes are conflated (Major).** Covariance collapse (shrinkage
    0.91) and CRM''s failure to exploit residual structure are treated as one phenomenon.
    These are separable: (a) is the covariance estimate uninformative? (b) even if
    somewhat informative, is the CRM architecture insufficient to exploit it? No alternative
    CRM designs (e.g., attention over DOFs, contrastive auxiliary objectives) are
    tested. The negative result applies to "this specific pipeline" rather than "per-DOF
    conformal features for VLA correction" in general.

    3. **K is never varied (Major).** The paper''s central diagnostic claim is that
    K/p ratio governs feature quality, but K=10 is the only value tested on the full
    VLA pipeline. Testing K=20 or K=30 would directly validate or falsify the scaling
    hypothesis. This is the most critical missing experiment.

    4. **Nominal degradation underanalyzed.** The −4.2pp nominal drop (95.0% → 91.0%)
    is substantial. No per-task breakdown, no analysis of correlation with CRM residual
    magnitude, and no gating mechanism tested (apply CRM only above an uncertainty
    threshold).

    5. **SRPO stacking experiment lacks controls.** The +1.1pp result tests one training-time
    method with a CRM trained on standard LIBERO augmentation, not SRPO''s failure
    distribution. The stacking failure could be training distribution mismatch rather
    than a fundamental limitation.

    6. **No error bars or confidence intervals on main results.** The absence of uncertainty
    quantification on the results of an uncertainty-quantification paper is ironic
    and weakens statistical claims.


    ### Questions for Authors

    1. What is the empirical coverage rate of conformal prediction regions under both
    static and ACI-adapted calibration?

    2. Have you considered diagonal-only CGS features (14D: per-DOF mean + std, no
    cross-DOF terms) as an intermediate baseline?

    3. Is CGS computed per-timestep (d=7) or per-chunk (d=30–35)? If per-chunk, p/n
    rises to 3.0–3.5, making the covariance far more ill-conditioned than reported.

    4. What is the inference latency for K>10? Is K=50 prohibitively expensive on
    modern GPUs?


    ### Missing Experiments

    1. **K sensitivity sweep (K=5, 10, 20, 30, 50) on full VLA pipeline** — the single
    most important missing experiment.

    2. **CRM gating mechanism** to suppress correction when uncertainty is low, potentially
    eliminating nominal degradation.

    3. **A second base VLA** (e.g., OpenVLA) to test generality beyond SmolVLA.

    4. **Confidence intervals / bootstrap CIs** on all main results.


    ### R1 Scores

    - Soundness: 2/4

    - Empirical Methodology: 2/4

    - Reproducibility: 3/4

    - Overall: **4/10**

    - Confidence: 4/5



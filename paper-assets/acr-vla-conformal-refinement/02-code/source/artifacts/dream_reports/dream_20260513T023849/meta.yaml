    ## R2 Review: Novelty & Related Work


    ### Summary

    The paper documents a negative result: multivariate conformal prediction features
    from K=10 flow-matching samples provide no statistically significant benefit for
    VLA action correction in 7D. While the pre-registered kill criteria and covariance
    diagnostics are credible, the negative finding is largely predictable from standard
    statistics (p/n=0.7 is a well-known degenerate regime for covariance estimation),
    and the paper does not explore the boundary conditions (varying K) that would
    make the characterization actionable.


    ### Strengths

    1. **Pre-registered kill criteria raise credibility** of the negative results
    above typical post-hoc negative reporting.

    2. **Root cause analysis is precise and educational.** The Ledoit-Wolf shrinkage
    intensity characterization (0.42 in 3D vs 0.91 in 7D) is a clean, quantitative
    explanation transferable to other domains.

    3. **Per-perturbation analysis revealing augmentation-bounded correction is informative.**
    Gains concentrate on perturbation types covered by synthetic augmentation; uncovered
    types show negative transfer.

    4. **Addresses a genuine gap.** No prior work had attempted to use structured
    per-DOF conformal statistics as learned correction features for VLA actions.


    ### Weaknesses

    1. **Core negative result is largely predictable from first principles (Major).**
    With K=10 and p=7, p/n=0.7 is firmly in the regime where sample covariance matrices
    are known to be unreliable. The Marchenko-Pastur law predicts ~30–40% relative
    error in eigenvalue estimation. Any statistician would predict Ledoit-Wolf shrinkage
    would dominate, collapsing covariance toward identity. The surprise value is low.

    2. **No exploration of the positive regime (Major).** The paper identifies K as
    the bottleneck but never tests K>10. A K sweep would transform this from "it doesn''t
    work at K=10" to "it requires K≥N_threshold, here''s the cost-benefit curve."
    The title asks "When Does Multivariate CP Help?" but only answers when it does
    not.

    3. **Only 10 references — far below CoRL standards (Major).** Key omissions include:
    Conformalized Teleoperation (RSS 2024), TT-VLA, CP surveys (Angelopoulos & Bates
    2023), ensemble/MC-dropout uncertainty literature, broader VLA robustness landscape
    (Cosmos-Policy, VLA-GSE), and concurrent works on per-DOF uncertainty for VLAs.

    4. **No experimental comparison with external baselines (Major).** ReconVLA, A2C2,
    and UPS are discussed textually but not compared experimentally. Showing ACR-VLA
    merely matches simpler baselines would strengthen the negative argument.

    5. **Three stated contributions are thin individually (Moderate).** Contribution
    1 (negative result + covariance diagnostics) is the only substantial one. Contribution
    2 (COC ρ=0.18) is a single correlation statistic. Contribution 3 (augmentation-bounded
    correction) follows trivially from generalization theory.

    6. **Claim 3 testing is weak (Moderate).** A single stacking experiment on SRPO
    cannot support a general claim about inference-time vs training-time orthogonality.
    The stacking failure may simply inherit the base method''s failure.

    7. **MVP-to-VLA narrative transition is underdeveloped.** The paper should make
    the 3D→7D transition its central analytical thread, clearly explaining why MVP
    (p/n=0.3) succeeds and VLA (p/n=0.7) fails.


    ### Missing Related Work

    - Conformalized Teleoperation (RSS 2024) — ACI applied to robot actions

    - TT-VLA — test-time VLA adaptation

    - CP surveys (Angelopoulos & Bates 2023)

    - Ensemble/MC-dropout uncertainty in robotics

    - Cosmos-Policy, VLA-GSE — LIBERO-Plus SOTA context

    - SnapFlow — 1-step flow matching (cited in experiments but not referenced)

    - DiU — single-pass uncertainty for flow matching

    - A2C2, UPS — cited in text but absent from bibliography and experiments


    ### R2 Scores

    - Novelty: 1.5/4

    - Significance: 1.5/4

    - Clarity: 2.5/4

    - Related Work Coverage: 1/4

    - Overall: **3/10**

    - Confidence: 4/5



    ## Roundtable Convergence


    ### Step 2: Cross-Sharing

    Both reviewers independently identified the same critical gaps, indicating high
    inter-reviewer agreement on the paper''s core limitations.


    ### Step 3: Points of Agreement

    1. **Pre-registered kill criteria are exemplary.** Both reviewers single this
    out as the paper''s strongest methodological contribution.

    2. **Missing K sweep is the most critical gap.** Both identify this as the experiment
    that would transform the paper from a narrow negative result to actionable guidance.

    3. **Covariance diagnostics are the strongest technical contribution.** The shrinkage
    intensity / effective rank analysis is precise and educational.

    4. **10 references are insufficient** for a CoRL submission.

    5. **Nominal degradation (−4.2pp) is concerning and underanalyzed.**

    6. **The negative result has limited surprise value** given well-known statistics
    of covariance estimation in the p/n=0.7 regime.

    7. **No external baselines** weaken the paper''s positioning.


    ### Step 3: Points of Divergence

    - **R1** values the experimental design more highly (soundness of ablation structure)
    and gives slightly more credit for the mechanistic diagnosis, resulting in 4/10.

    - **R2** places more weight on the predictability of the outcome and the thin
    related work, resulting in 3/10.

    - **R1** emphasizes the conflation of covariance degeneracy vs. CRM architecture
    failure as a key methodological weakness; **R2** focuses more on the absence of
    positive-regime exploration.


    ### Step 4: Consolidated Assessment


    **Consensus Overall Score: 4/10 (reject)**


    **Recommendation: Reject.** The paper would fall below the acceptance threshold
    at CoRL 2026.


    ### Rationale


    **What works:**

    - The pre-registered kill criteria framework is a model for negative-result studies

    - The covariance degeneracy diagnosis (shrinkage=0.91, effective rank=1.3) is
    precise and well-presented

    - The ablation suite (A1–A7) is comprehensive and well-structured

    - The per-perturbation analysis identifying augmentation-bounded correction is
    a useful empirical finding


    **Why it falls short for CoRL:**


    1. **Predictability.** The core negative result — that K=10 samples in 7D yield
    degenerate covariance — is foreseeable from elementary statistics (p/n=0.7, Marchenko-Pastur
    regime). A negative-result paper at CoRL must either refute a widely-held belief
    with surprising evidence or provide comprehensive failure-mode characterization
    with actionable guidance. This paper does neither convincingly.


    2. **Incomplete characterization.** The title asks "When Does Multivariate CP
    Help?" but only shows when it does not (K=10, p=7). Without a K sweep, the paper
    cannot provide the actionable threshold (K≥?) that would make the result genuinely
    useful to practitioners.


    3. **Insufficient statistical power.** Three seeds cannot convincingly establish
    a negative result — the confidence intervals are too wide to distinguish "no effect"
    from "small but real effect."


    4. **Thin scholarship.** Ten references and no experimental baselines against
    prior methods (ReconVLA, A2C2) are below CoRL standards.


    5. **Nominal degradation.** The −4.2pp nominal drop means the method has negative
    practical value in many deployment scenarios, yet this critical finding is underanalyzed.


    ### Actionable Revision Guidance


    To reach CoRL acceptance (or reframe for ICLR 2027 workshop/main):


    1. **Add K sweep (K=5, 10, 20, 30, 50).** This single experiment would transform
    the paper''s contribution from "K=10 doesn''t work" to "multivariate CP requires
    K≥N with cost X, here is the regime map."

    2. **Increase seeds to ≥5–10** for credible negative-result claims with tighter
    CIs.

    3. **Add experimental baselines** against ReconVLA and A2C2 on the same setup.

    4. **Expand references to ≥25.** Cover CP surveys, conformalized teleoperation,
    TT-VLA, ensemble uncertainty literature, and LIBERO-Plus SOTA landscape.

    5. **Analyze and mitigate nominal degradation.** Test CRM gating (apply only when
    uncertainty exceeds threshold).

    6. **Disentangle covariance degeneracy from CRM architecture failure.** Test alternative
    CRM designs that might exploit per-DOF features differently.

    7. **Reframe as "regime map" paper.** The title is right ("When does...?") but
    the content only covers the negative side. A compelling version would show: (a)
    works at K=30+/3D, (b) fails at K=10/7D, (c) here is the p/n threshold, (d) here
    is the practitioner decision tree.



  mvp-step2v3-regression:
    status: DONE
    retry_count: 0
    created_at: '2026-05-22T01:13:35.316Z'
    updated_at: '2026-05-22T01:34:11.022Z'
    hypothesis: 'Controlling for individual model robustness (η_max), higher K_eff
      panels have significantly lower ASR. The SDPI bound η_joint ≤ K_eff · η_max
      has two factors: K_eff (diversity) and η_max (weakest-link robustness). Step
      2 v2 confounded them. Multi-factor regression log(ASR) ~ log(K_eff) + log(η_max)
      should show K_eff coefficient significantly negative.'
    parent: mvp-step2-keff-contrast
    spec:
      command: python scripts/run_step2v3_regression.py 2>&1 | tee /tmp/step2v3.log
      server: seetacloud-rtx6000

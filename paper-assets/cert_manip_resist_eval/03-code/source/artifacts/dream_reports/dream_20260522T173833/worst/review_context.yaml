- name: Random-Fault BFT Contrast Simulation
  plan_id: plan_003
  description: '模拟随机故障场景：每个 judge 以概率 η_j 独立犯错，majority vote 决策。 比较 K_eff 在 random-fault
    vs adaptive 两种 regime 下的 β 和显著性。

    '
  expected_results:
    RF_keff_sig_positive: 10
    RF_keff_nonsig: 2
    RF_eta_max_sig: 11
    RF_mean_beta_keff: 0.42
    adaptive_mean_beta_keff: 0.38
    BFT_RF_beta_ratio: 0.91
    RF_mean_R2: 0.62
    adaptive_mean_R2: 0.38
    delta_R2_RF_vs_adaptive: 0.24
    RF_keff_direction: positive (same as adaptive)
    regime_contrast_p_interaction: 0.217
  result_rationale: 'BFT contrast 的核心预期是 K_eff 在 RF 下显著正向（diversity helps under random
    faults） 但在 adaptive 下 NS 或反转。Worst 档下实际观察到：K_eff 在 RF 下同样正向显著 （10/12），与 adaptive
    下方向一致。原因：在 RF 模拟中 η_j 直接决定 judge 犯错率， 高 K_eff panel 仍然混入高 η_j 的弱模型，majority vote
    下弱模型拉低整体正确率。 因此 K_eff 正向不是 "diversity 主动有害" 而是 "diversity 引入弱模型" 的统计反映—— 这在 RF
    和 adaptive 两种 regime 下都成立。β ratio 0.91 表明两种 regime 下 K_eff 的效应量几乎相同，regime interaction
    term NS (p=0.217)。唯一的 regime 差异是 R²： RF 下 R²=0.62 vs adaptive R²=0.38，ΔR²=0.24——RF
    更可预测但这只是因为 RF 没有 strategic variance，不是因为 K_eff 效应不同。BFT reversal mechanism 叙事瓦解。

    '

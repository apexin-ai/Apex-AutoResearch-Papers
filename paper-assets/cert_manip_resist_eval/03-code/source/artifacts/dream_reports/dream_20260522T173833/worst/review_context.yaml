- name: Capability-Matched K_eff Validation
  plan_id: plan_004
  description: '在同一 capability tier 内（all-small 7-8B 或 all-large 70B+/API）测试 K_eff
    是否 仍然显著。如果 tier-matched panel 中 K_eff 消失 → K_eff 效应是 tier-mixing artifact。

    '

  result_rationale: 'Capability-matched 是 worst 档的致命实验。同 tier 内模型能力相近，η_max 方差极小 （约
    0.008 vs 全池 0.045），消除了 tier-mixing confound。结果：K_eff 仅在 1/6 条件下显著（medium tier
    × score_manipulation, p=0.041，FDR 后可能 NS），其余 5/6 全部 NS。这直接证明 K_eff 的表面效应是 tier-mixing
    的统计幻象：当你在全池抽 panel， 高 K_eff panel 跨 tier 抽样（混入 7B 和 70B），低 K_eff panel 同 tier
    抽样—— K_eff 与 η_max 的相关性是 tier-mixing 的副产品，不是因果关系。 每个 tier 仅 C(5,3)=10 个 panel，样本量不足以检测小效应，但即便如此
    η_max 方差 消失也说明在能力控制后 K_eff 没有独立的预测力。Reviewer 可以合理论证： "K_eff effect = capability
    heterogeneity effect, not diversity per se"。


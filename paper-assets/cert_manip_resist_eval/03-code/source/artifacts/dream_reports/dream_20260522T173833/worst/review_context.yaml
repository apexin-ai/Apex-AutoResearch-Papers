    4 个中有 2 个 p 值在 0.02-0.04 之间（经 FDR 校正后可能变 NS）。 仅 1 个 confound-free condition 意味着
    residualization 的可信度依赖于线性假设—— reviewer 可以合理质疑 "你的 K_eff effect 只是 nonlinear η_max
    effect 的残余"。 η_max 9/12 显著是稳健的，weakest-link 叙事成立，但这是预期结果不是新发现。 ΔR² = 0.04 使得 "dual
    vulnerability driver" 的 framing 难以为继——第二个 driver 解释力不到 4%。需要 reframe 为 η_max-dominant
    故事。

    '

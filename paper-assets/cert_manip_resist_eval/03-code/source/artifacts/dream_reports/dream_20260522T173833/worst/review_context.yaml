    上 的正向效应不推广到 open-ended 评估——方向不一致且 1 个条件甚至反转。这使得 diversity trap 从 general finding
    降级为 MCQ-specific observation，reviewers 会 质疑：如果 diversity 只在 MCQ 中 "hurts"，这到底是
    diversity 的问题还是 MCQ evaluation 的 artifact？η_max 在两种任务上都一致显著，强化了 weakest-link 作为
    universal driver 的地位。Reframe 后论文应在 title/abstract 中避免 generalize， 限定为 "MCQ-based
    evaluation" 或在 Discussion 中作为 limitation 显著标注。


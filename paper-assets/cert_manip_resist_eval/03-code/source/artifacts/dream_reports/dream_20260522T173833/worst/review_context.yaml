- name: Open-Ended Generation Benchmark
  plan_id: plan_011
  description: '在 MT-Bench 或 AlpacaEval 风格的开放式生成任务上运行攻击实验， 验证 MCQ findings 是否推广到 open-ended
    evaluation。

    '
  expected_results:
    benchmark: MT-Bench (adapted)
    n_conditions: 4
    keff_resid_sig_positive: 0
    keff_resid_sig_negative: 1
    keff_resid_nonsig: 3
    eta_max_sig: 4
    keff_direction_inconsistent_with_MCQ: true
    open_ended_mean_ASR: 0.34
    MCQ_mean_ASR: 0.26
    eta_max_dominance_ratio_open: 0.91
  result_rationale: 'Open-ended 任务与 MCQ 的攻击动态根本不同。MCQ 攻击通过影响 judge 对特定选项的偏好， K_eff
    的 confound 来自 tier-mixing。Open-ended 评估中 judge 需要评估文本质量—— 攻击更多依赖 persuasive text
    generation，所有 judge 面临相似的 adversarial text。 因此 η_max 完全主导（4/4 sig）：最弱 judge 被最容易说服。K_eff
    方向混乱——1 个 条件甚至显著负向（diverse panel 更好），因为 open-ended 评估中不同 judge 对文本 质量的多角度评估确实可以互补（更接近
    BFT 的 benign fault 假设）。这与 MCQ 结果 不一致是 worst 档的关键打击：如果 diversity trap 不跨任务推广，它就不是一般性
    原理，而是 MCQ 评估的特异性现象——可能由 MCQ 的离散选择结构 + tier-mixing confound 共同驱动。


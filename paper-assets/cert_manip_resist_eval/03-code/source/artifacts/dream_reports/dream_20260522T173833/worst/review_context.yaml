  result_rationale: 'Partial-knowledge adversary（知 family 不知具体 vulnerability）仅比 full-knowledge
    下降 8.8% ASR——说明 family 信息提供的攻击优势有限，因为 same-family 模型的 vulnerability profile 差异大（family
    labels 不可靠，plan_004 的 claim 4）。 No-knowledge adversary 下降 21.8%——说明 any model
    knowledge 都有价值但不是 dramatic。 K_eff 在 partial-knowledge 下仅 2/12 显著，进一步弱化了 "diverse
    attack surface" 叙事：如果 adversary 不知道具体 vulnerability，panel diversity 不应创造可利用的 attack
    surface（adversary 无法 target specific judges）。K_eff 效应在 partial-knowledge 下几乎消失，暗示
    full-knowledge 下的 K_eff 效应部分来自 adversary 对具体 vulnerability 的知识（即 K_eff 效应依赖 threat

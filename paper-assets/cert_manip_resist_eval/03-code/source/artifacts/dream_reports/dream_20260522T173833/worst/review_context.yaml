narrative_guidance: '放弃 "Diversity Trap" framing。Reframe 为 "Structural Vulnerability
  Anatomy of Multi-Judge LLM Evaluation"。 新 lead claim：η_max 作为 panel vulnerability
  的 dominant 且 near-sufficient predictor（9-11/12 显著）， 这本身是对 "diversity protects" 假设的实证否定——不需要
  diversity actively hurts，只需 diversity doesn''t help 而 weakest-link 决定一切。K_eff 降级为
  "exploratory analysis showing suggestive but confounded association"， 置于 Discussion。方法论贡献前移：copula
  failure（即使 ratio 降了仍是有意义的 methodological finding）、 family label 不可靠性、15-model/455-panel
  规模的 evaluation benchmark 本身作为 resource contribution。 BFT 从 core mechanism 降为 Discussion
  section 的 "open question"。 补偿策略：(a) 强调 weakest-link 发现的实用价值（panel 安全由最弱 judge 决定）；
  (b) 释放 per-judge ASR 浓度分析（plan_006 Gini/entropy）作为 adaptive adversary targeting
  的直接证据； (c) 推 aggregation rule 比较作为 practical contribution（哪种聚合最抗攻击）。 预期结果：需要 rebuttal
  期大幅补充，borderline reject / weak accept。仍冲 EMNLP 但准备 NAACL 2027 backup。

  '

- name: Gaussian Copula Failure + Family Label Revalidation (15-Model, 105 Pairs)
  plan_id: plan_001_mi_component
  description: 15-model 105 pairwise MI matrix 计算。Gaussian copula MI vs observed MI
    ratio 验证。Family labels（6 families）的 MI 预测性检验（within vs cross-family）。Capability
    proximity 与 MI 的相关性分析。
  expected_results:
    total_pairs: 105
    MI_gaussian_ratio_mean: 18.5
    MI_gaussian_ratio_max: 312
    MI_gaussian_ratio_min: 4.2
    pairs_ratio_gt_10x: 82/105
    family_label_MWU_p: 0.158
    family_label_permutation_p: 0.312
    within_family_MI_mean: 0.42
    cross_family_MI_mean: 0.39
    capability_proximity_MI_correlation: -0.71
    copula_MI_ratio_15model: 18.5
  result_rationale: 105 pairs（7× 6-model 的 15 pairs）大幅增加 copula failure 的统计力度。MI_gaussian_ratio
    均值从 6-model 的 14.7 升至 18.5，因为 15-model pool 包含更多 capability-heterogeneous pairs（如
    Mistral-7B 与 GPT-4o、Phi-14B 与 Claude-3.5），这些极端 pair 的联合分布更远离 bivariate Gaussian——heavy
    tails、discrete clustering、capability-dependent correlation structure 使 Gaussian
    copula 的低估更严重。Max ratio 从 235 升至 312（最极端 pair 如 Mistral-7B × GPT-4o 的 MI 被 Gaussian
    低估 312×）。Family labels 仍无预测力（MWU p=0.158）：within-family MI（0.42）和 cross-family
    MI（0.39）无显著差异。根本原因：同 family 不同 size（如 Llama-8B vs Llama-70B）的 judges 独立性差异远大于同
    size 不同 family（如 Llama-8B vs Qwen-7B vs Mistral-7B）——这些 7B-class 模型 capability-wise
    非常接近，共享 similar failure modes despite different training pipelines。Capability
    proximity（|capability_i - capability_j|）与 MI 的强负相关（r=-0.71）直接支持：能力越接近→共享越多 failure
    patterns→MI 越高→independence 越低。意义：practitioners 不应用 family diversity 作为 panel
    independence proxy——capability-based metrics（如 K_eff）才是 valid measure。

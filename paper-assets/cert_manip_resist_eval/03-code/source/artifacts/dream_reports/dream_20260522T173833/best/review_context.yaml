    line。绝大多数点在 identity line 远上方，标注 extreme pairs。'
  - 'Fig 15: Within-family vs cross-family MI violin plot (6 families)。Violin 大幅重叠，无显著分离。'
  analysis: 15-model copula failure 和 family label 结果分别强化 Claims 5 和 4。Copula failure
    的 practical implication：任何基于 Gaussian copula 假设的 panel reliability bound（如 independence-based
    certification）在 LLM judge 对上不可信——underestimate information sharing by 10-30×（mean
    18.5×）。这为 K_eff 作为 empirical independence measure（而非 copula-derived bounds）提供
    methodological justification。Family label result 的 practical implication：panel
    designers 不能简单用 '3 different families = diverse panel' 的 heuristic——Qwen-7B 和
    Llama-8B 虽属不同 families 但 capability 接近故 MI 高（independence 低），而 GPT-4o-mini 和 GPT-4o
    虽同属 OpenAI 但 capability gap 大故 MI 低（independence 高）。Capability proximity 是 independence
    的 true driver。
- name: Partial-Knowledge Adversary Model
  plan_id: plan_012
  description: 'Adversary 知道 panel 包含哪些 model families（public information）但不知各 judge
    的具体 η_j vulnerability profiles。Strategy: family-level average attack 而非 judge-specific
    targeting。与 full-knowledge 和 black-box baselines 对比。'
  expected_results:
    full_knowledge_mean_ASR: 0.074
    partial_knowledge_mean_ASR: 0.058
    black_box_mean_ASR: 0.031
    partial_vs_full_ratio: 0.784
    keff_sig_partial: 7/12
    etamax_sig_partial: 8/12
    partial_R2: 0.51
    family_info_value_pct: 62.8
  result_rationale: Partial-knowledge adversary 的 strategy 是 family-level targeting：知道
    panel 含 Llama → apply Llama-family average attack template，知道含 GPT → apply GPT-family
    average attack template。ASR 约为 full-knowledge 的 78%——family membership 提供了 ~63%
    of adversary information value（(0.058-0.031)/(0.074-0.031)=62.8%），因为 family→capability
    tier 有强相关性（所有 Qwen-7B 都是 small tier），且 family-level vulnerability profiles 有 within-family
    consistency。K_eff 在 partial-knowledge 下仍 7/12 sig（vs full-knowledge 10/12），因为
    diverse panel 跨越更多 families → adversary 的 family-level portfolio attack 有更多 entry
    points。η_max 8/12 sig（vs 10/12）轻微下降因为 adversary 不知 exact η_j，targeting precision
    降低使 weakest-link exploitation 变 fuzzy。R² 从 0.62 降至 0.51 反映 partial-knowledge 下
    panel structure 的 predictive power 减弱——adversary behavior 有更多 randomness（不确定性导致
    suboptimal targeting）。关键意义：diversity trap 不依赖于 unrealistically strong adversary
    假设——即使 adversary 只有 public-level information（model families are typically disclosed
    in evaluation pipelines），diversity 仍然显著有害。这直接回应 Dream W7（'unrealistically strong
    adversary'）。

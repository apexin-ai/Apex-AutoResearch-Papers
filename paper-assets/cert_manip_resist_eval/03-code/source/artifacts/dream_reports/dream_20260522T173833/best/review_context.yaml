    Bayesian aggregation（削弱残余 η_max + 部分削弱 K_eff）是最 comprehensive defense。单一维度不够。'
- name: Open-Ended Generation Benchmark (MT-Bench + AlpacaEval)
  plan_id: plan_011
  description: '在 MT-Bench（多轮对话评判）和 AlpacaEval（指令遵循评分）上测试 diversity trap。4 attack
    types × 2 benchmarks = 8 新 conditions（选 4 primary attacks: score_manip, sycophancy,
    position, verbosity）。15 models 但 panel size 受限于 benchmark cost 可能 sample 200 panels。'
  expected_results:
    mtbench_keff_resid_sig: 3/4
    mtbench_etamax_sig: 3/4
    mtbench_mean_R2: 0.48
    alpacaeval_keff_resid_sig: 2/4
    alpacaeval_etamax_sig: 3/4
    alpacaeval_mean_R2: 0.42
    open_ended_keff_sig_total: 3/4
    open_ended_confound_r: 0.48
    keff_beta_ratio_open_vs_mcq: 0.85
    condition_dependent_pattern_preserved: true
  result_rationale: Open-ended judging 与 MCQ 的关键差异：(1) 评分更主观——judges 在 'what constitutes
    a good response' 上 disagreement 更高，noise floor 提升；(2) 攻击空间更大——adversary 可以在 multi-turn
    conversation 的每轮 independently manipulate（MT-Bench），或在 free-form response 中 embed
    更复杂的 manipulation signals（AlpacaEval）。K_eff 在 open-ended 上仍显著正向（3/4 unique conditions
    across benchmarks），但 β 略低于 MCQ（ratio 0.85），因为 open-ended 的 higher noise floor
    使 panel structure 解释的方差降低（R² 0.42-0.48 vs MCQ 0.62）。MT-Bench 比 AlpacaEval 表现更强（3/4
    vs 2/4 sig），因为 multi-turn 结构给 adversary 更多 manipulation surface（每轮是独立攻击机会），judge-specific
    响应差异在多轮中累积。Condition-dependent pattern 在 open-ended 上完美复现：score_manip 和 position
    下 K_eff 主导，sycophancy 和 verbosity 下 η_max 主导——attack taxonomy 从 MCQ 推广到 open-ended
    无需修改。≥2/4 open-ended K_eff 显著（best tier 达 3/4）满足 open-ended 显著条件。意义：diversity
    trap 不是 MCQ-specific artifact，直接回应 Dream W6 和 RC3。

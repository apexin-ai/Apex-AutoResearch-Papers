  analysis: 'Partial-knowledge 分析的 key takeaway：diversity trap 的 threat model 是 realistic。Full-knowledge
    是 worst-case security analysis 的 standard practice（similar to how cryptography
    assumes worst-case adversary），但 even partial-knowledge（family info = public）已经
    captures 63% of the vulnerability。The 7/12 K_eff significance under partial knowledge
    means: even if the adversary only knows ''this panel uses judges from Llama, GPT,
    and Qwen families''（commonly disclosed），they can exploit diversity. This eliminates
    the ''but real adversaries don''t have full information'' defense. Graduation:
    paper can now claim diversity trap holds under realistic threat models, not just
    theoretical worst-case.'

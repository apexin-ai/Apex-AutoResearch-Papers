narrative_guidance: 原始 'Diversity Trap' framing 完全成立。标题保持挑衅性（'More Diverse, More Vulnerable'）。Claim
  1 升级为 'diversity independently and causally-directionally increases vulnerability'（加
  capability-matched 证据）。BFT reversal 从 analogy 升级为 empirically grounded mechanism（calibrated
  RF 下 β 在 transferable attacks 中翻转为负，shared-bias attacks 中显著衰减）。Story arc 无需调整：surprise
  → mechanism → nuance → defense 完整链条。审稿人 RC1 (confound) 被残差化 + confound-free conditions
  + capability-matched 三线封堵，RC3 (generalization) 被 open-ended + attack expansion +
  panel size 三线封堵。预期 Dream score 3.0–3.5，对应 EMNLP Findings→Borderline Conference。

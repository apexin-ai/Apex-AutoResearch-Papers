  plan_id: plan_001
  description: '从 6 扩展到 15 models（GPT-4o, GPT-4o-mini, GPT-4.1, GPT-4.1-mini, Claude-3.5-Sonnet,
    Gemini-1.5-Pro + 6 local open-source: Llama-3.1-8B/70B, Qwen2.5-7B/72B, Mistral-7B-v0.3,
    Phi-3-medium-14B）。455 C(15,3) panels，2 datasets × 6 attacks = 12 conditions 全量回归。'
  expected_results:
    K_eff_raw_FDR_sig_positive: 12/12
    K_eff_resid_FDR_sig_positive: 10/12
    eta_max_FDR_sig: 10/12
    VIF_keff_etamax: 1.02
    mean_R2: 0.62

- name: VIF + Multicollinearity Full Diagnostics
  plan_id: plan_009
  description: 对 15-model 455-panel 数据做完整统计诊断：VIF、condition number、partial correlations、residualized
    K_eff、Bonferroni/FDR 多重比较校正、beta regression（处理 ASR 的 [0,1] bounded nature）、Shapiro-Wilk
    残差正态性检验。纯计算，无 GPU。

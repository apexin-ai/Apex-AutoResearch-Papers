  - 'Fig 1: K_eff_resid β coefficient heatmap — 12 conditions (rows) × significance
    level (color scale), annotate β and FDR-adjusted p。Transferable cluster (score_manip,
    position) 明显深色（大 β），shared-bias cluster (sycophancy, verbosity, authority) 较浅。'
  - 'Fig 2: 455-panel scatter — K_eff vs ASR 按 dataset×attack 着色，标注 confound-free
    regions (r<0.40) 用虚线框。'
  analysis: 15-model 核心回归确认 Diversity Trap 的全部结构。10/12 残差化显著（vs 初步分析 8/12）表明 refined
    统计方法（FDR 校正 + beta regression consistency check from plan_009）增强效应检测。Condition-dependent
    dominance pattern 从定性观察升级为 systematic taxonomy：attack transferability 高→K_eff
    主导（adversary 利用 judge 异质性找 judge-specific 攻击路径），attack transferability 低（shared
    bias）→η_max 主导（所有 judges 共享弱点）。3 个 confound-free conditions 的 p<1e-20 是最强 'smoking
    gun'——即使 K_eff 与 η_max 近乎正交（r≈0.35），K_eff 仍达 genome-wide 级别显著性。这单独就足以封堵 RC1 的所有统计变体。
- name: Attack Surface Expansion (9 Types)
  plan_id: plan_002
  description: 攻击类型从 6 扩展到 9：新增 few-shot hijacking（in-context example 注入篡改评分标准）、persona
    manipulation（冒充权威角色指令 judge 改分）、instruction override（直接覆写评判 prompt）。全 15 models
    × 455 panels × 2 datasets。
  expected_results:
    new_attack_types: 3
    new_conditions: 6
    keff_resid_sig_new_conditions: 4/6
    total_conditions_majority: 18
    keff_resid_sig_total_majority: 14/18
    eta_max_sig_total_majority: 15/18
    keff_dominates_new_attacks: 1
    etamax_dominates_new_attacks: 2
    mean_R2_new: 0.63
  result_rationale: 三类新攻击按 transferability 分层：few-shot hijacking 是 high-transferability
    攻击——通过 in-context examples 篡改评分标准，不同 judge 对 ICL 的响应模式差异极大（Qwen 系对 Chinese-style
    ICL 特别敏感、GPT 系对结构化 format hijacking 脆弱），因此 K_eff 主导（β≈0.54, p<1e-6）——diverse panel
    有更多可利用的 ICL 入口点。Persona manipulation 和 instruction override 属于 moderate-to-low
    transferability：不同 judge 的 instruction-following 遵从度存在差异但 RLHF 训练给所有模型植入了类似的 authority-compliance
    bias，预测 η_max 主导但 K_eff 在 persona_manip 上仍显著（p<0.02）。Instruction override 的 K_eff
    在 arc 上 NS（p=0.112）因为 ARC 的简短问题格式给 override 攻击的操作空间更少，judge 差异贡献有限。总计 14/18 残差化显著满足
    K_eff_resid_sig_extended_conditions [10,16] 范围。

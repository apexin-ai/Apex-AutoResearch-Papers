  result_rationale: 模型池从 6→15 后能力谱系大幅展开（7B→72B 全开源 + GPT-4/Claude/Gemini API tier），K_eff-η_max
    结构性共线从 r=-0.80 降至 ~0.55。455 panels（23× 6-model 的 20 panels）给残差化 K_eff 分析提供充足统计功效，使
    8/12 的初步结果在 refined analysis 后升至 10/12。关键驱动力：(1) confound-free conditions 从 2→3
    个（arc×score_manipulation、arc×position_bias、mmlu×position_bias 中 r≈0.35），这些条件下
    K_eff 达极端显著性（p<1e-20），彻底排除 confound artifact；(2) condition-dependent dominance
    pattern 清晰——transferable attacks（score_manipulation、position_bias）中 K_eff β >
    η_max β，因为 diverse judges 提供异质化 attack surface；shared-bias attacks（sycophancy、verbosity、authority）中
    η_max 主导，因为所有 judges 共享类似认知偏差；(3) sensitivity analysis 排除 ACC<0.5 outlier models
    后 K_eff_resid 增至 11/12，证明效应非极端 outlier 驱动。

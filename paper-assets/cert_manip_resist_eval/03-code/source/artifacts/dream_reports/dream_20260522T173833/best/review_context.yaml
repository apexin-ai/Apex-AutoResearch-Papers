    结果直接否定：全是 top-tier 模型（GPT-4 级别），η_max 在 0.08-0.15 的 narrow range 内，K_eff 仍在 4/6
    conditions 显著正向。Condition-dependent pattern 在 tier-internal 分析中完美复现：score_manip
    + position 由 K_eff 主导，sycophancy + verbosity 由 η_max 主导。这一致性跨 pooling strategy（all-15
    vs within-tier）极大增强了 finding 的 robustness。Small tier 的 2/6 sig 表明 diversity trap
    在低能力模型中也存在（低能力 diverse panel 更脆弱），但效应弱于 large tier——可能因为 small models 的 η_max
    方差更大（有的 7B 异常脆弱），η_max 抢走了更多 variance。

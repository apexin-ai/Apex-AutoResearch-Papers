- name: 'Attack expansion: 6+ attack types'
  plan_id: plan_002
  description: '在 plan_001 的 15+ 模型池上新增 few-shot hijacking、persona manipulation、instruction
    override  三种攻击，将攻击类型从 6 种扩展到 9 种。验证 weakest-link 在更广攻击面上的普适性。

    '
  expected_results:
    total_attack_types: 9
    total_conditions: 8190
    eta_max_sig_rate_new_attacks: 0.85
    keff_nonsig_rate_new_attacks: 0.89
    few_shot_hijacking_mean_asr: 0.31
    persona_manipulation_mean_asr: 0.22
    instruction_override_mean_asr: 0.38
    cross_attack_eta_max_rank_correlation: 0.82
    weakest_link_R2_new_attacks_median: 0.53
  result_rationale: '新增攻击类型本质上仍遵循 adaptive adversary 逻辑——attacker 可以针对每种攻击类型选择最弱 judge。
    Few-shot hijacking ASR 较高（0.31）因为它利用 in-context learning 能力，小模型尤其脆弱。 Persona manipulation
    ASR 较低（0.22）因为需要更复杂的社会工程，但仍集中在弱 judge 上。 Instruction override ASR 最高（0.38）因为它直接覆盖评判指令，safety
    training 弱的模型几乎  无法抵抗。跨攻击 η_max rank correlation 0.82 说明各 judge 的相对脆弱程度在不同攻击间高度一致，
    这进一步支持 "individual robustness is an intrinsic property" 的论点。新攻击的 R² 与原 6 种 持平，说明
    weakest-link 结构不依赖特定攻击机制。

    '

- name: Adaptive adversary formal theorem + random-fault simulation
  plan_id: plan_003
  description: '(a) 形式化定理：在 adaptive adversary 模型下，panel_ASR = Θ(η_max)。 (b) 实现 random-fault
    simulation：每个 judge 以 prob p_j 独立失败。 (c) 证明 K_eff 在 random faults 下显著，验证 BFT distinction。

    '
  expected_results:
    theorem_statement: For an adaptive adversary with access to per-judge vulnerability
      profiles, panel_ASR ≥ max_j η_j for majority-vote aggregation
    random_fault_keff_sig_rate: 0.78
    random_fault_keff_median_p: 0.012
    random_fault_keff_median_beta: -0.45
    adaptive_keff_sig_rate: 0.09
    adaptive_keff_median_p: 0.43
    bft_contrast_cohen_d: 1.12
    bft_contrast_p: <0.001
    random_fault_R2_improvement_with_keff: 0.18
    adaptive_R2_improvement_with_keff: 0.01
  result_rationale: 'BFT 对比效果显著（Cohen''s d = 1.12）因为两种 fault model 有根本性差异： Random
    faults 下每个 judge 独立以 p_j 失败，panel 失败需要 ≥K/2 个 judge 同时失败， 概率随独立 judge 数指数下降——这就是
    BFT 的 redundancy argument，diversity（K_eff）直接降低 相关失败概率。但 adaptive adversary 不受此约束：attacker
    观察所有 judge 的弱点，构造  针对最弱 judge 的攻击，使该 judge 几乎必然失败，然后只需攻破 K/2-1 个额外 judge， 而这些额外
    judge 面对的是已被优化的攻击，成功率远高于随机。因此 K_eff 的保护效果被  adaptive targeting 完全消解。Random-fault
    下 K_eff sig rate 0.78 而非更高，是因为当 所有 judge 的 p_j 都很低时 K_eff 效果也不明显（地板效应）。Cohen''s
    d 1.12 是 large  effect size，足以支撑 "this is a fundamentally different regime" 的论点。

    '
  tables:
  - name: 'Table 4: BFT vs Adaptive Adversary Contrast'
    columns:
    - Metric
    - Adaptive
    - Random-Fault
    - Cohen's d
    - p-value
    rows:
    - - K_eff β (mean)
      - '-0.03'
      - '-0.45'
      - '1.12'
      - <0.001
    - - K_eff sig rate
      - 9%
      - 78%
      - —
      - —
    - - η_max β (mean)

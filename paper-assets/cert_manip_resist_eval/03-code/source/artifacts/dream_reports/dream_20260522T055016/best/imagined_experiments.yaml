    达 87% 而非 100%，是因为少数 panels 中所有成员 η_max 都很低（全由强模型组成）， 此时 η_max 方差不足以驱动显著回归系数。K_eff
    在 91% 条件下不显著，因为 adaptive adversary  总是瞄准最弱 judge，使 diversity 的保护效果被旁路——额外的 judge

tier: best
narrative_guidance: '原始 framing 完全成立。"The Diversity Trap" title 直接用。6 个 claims 全部
  land。 Story: adaptive adversary theorem 提供理论解释 → 15+ 模型 455 panel 大规模实证验证 weakest-link
  → diversity-capability tradeoff 揭示结构性障碍 → robustness-first 两阶段算法给出实用方案。 卖点是 theory
  + comprehensive negative result + practical fix 三位一体。 预期 reviewer 的 "only 6 models"
  concern 被 15+ 模型 455 panel 彻底消除。 API 模型（GPT-4o, Claude, Gemini）行为与 open-source 一致，无新
  regime，增强普适性论述。

  '

    pareto_panels_count: 12
    pareto_dominated_rate: 0.97
    tradeoff_slope: -0.34
    tradeoff_slope_se: 0.03
  result_rationale: 'K_eff 与 η_max 的强负相关（r = -0.78）反映 LLM 生态系统的结构性约束： 要获得 diverse
    panel（高 K_eff），必须采样不同家族/尺寸的模型，而当前 LLM 生态中  模型能力差异巨大（3.8B Phi 到 236B DeepSeek），diverse
    采样不可避免地纳入弱模型。 高 K_eff panel 意味着 judges 不相关——而不相关通常意味着采用了 heterogeneous 模型， 其中一定包含能力较差的成员。97%
    的 panels 被 Pareto 支配，说明同时优化 diversity  和 robustness 在当前生态下几乎不可能——这正是 "diversity
    trap" 的可视化表达。 Tier 内 r 均值 -0.57 弱于整体但仍 moderate-to-strong，证明这不是 trivial 的  size-class
    artifact。


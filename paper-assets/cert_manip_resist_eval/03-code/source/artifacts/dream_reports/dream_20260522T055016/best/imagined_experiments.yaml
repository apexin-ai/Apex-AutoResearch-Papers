- name: 'Panel size sensitivity: K=3,5,7,9'
  plan_id: plan_008
  description: '测试 weakest-link 定理在不同 panel 尺寸（K=3,5,7,9）下是否持续成立。 检验 η_max 主导性是否随
    K 增大而减弱（diversity 是否在 large panels 中开始生效）。

    '
  expected_results:
    k3_eta_max_sig_rate: 0.87
    k5_eta_max_sig_rate: 0.85
    k7_eta_max_sig_rate: 0.83
    k9_eta_max_sig_rate: 0.8
    k3_keff_nonsig_rate: 0.91
    k5_keff_nonsig_rate: 0.88
    k7_keff_nonsig_rate: 0.85
    k9_keff_nonsig_rate: 0.82
    k3_panels: 455
    k5_panels: 3003
    k7_panels: 6435
    k9_panels: 5005
    eta_max_dominance_trend: slight decline but persistent
    keff_emergence_threshold: not reached at K=9
  result_rationale: 'η_max 主导性随 K 增大略微下降（87% → 80%），K_eff 的 nonsig rate 也略降（91% →
    82%）， 但两个核心结论在 K=9 仍成立。η_max 轻微下降是因为大 panel 中 "weakest link" 更可能出现  极端弱模型——但同时大
    panel 也包含更多强模型来 outvote 弱模型，产生了微弱的 diversity  buffer。然而这个 buffer 效果远不足以让 K_eff
    变显著——在 K=9 时 K_eff nonsig rate 仍有  82%，说明即使 9 个 judges 也不足以通过 diversity 抵消 adaptive
    adversary 的 targeting。 直觉上，adaptive adversary 在大 panel 中需要攻破 K/2=5 个 judges 而非
    2 个， 但它仍然从最弱的开始攻破，而弱 judges 的 ASR 远高于平均。在 current LLM ecosystem 中  K_eff 的 emergence
    threshold 在 K≤9 范围内未被达到——这可能需要 K>>9 且所有 judges  都足够强才能让 diversity 的边际效果变显著。

    '

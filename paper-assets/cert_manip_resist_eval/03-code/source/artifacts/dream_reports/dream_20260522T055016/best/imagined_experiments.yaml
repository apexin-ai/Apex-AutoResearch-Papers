  - 'Fig 4: Scatter plot K_eff vs η_max, faceted by capability tier. Each panel shows
    one tier with its own regression line. Negative correlation persists within each
    tier (r = -0.52 to -0.61), not just an artifact of cross-tier capability differences.'
  analysis: 'Capability-matched 分析是回应 "tradeoff is trivially explained by capability
    differences"  reviewer concern 的关键证据。Tier 内 r ≈ -0.55 证明 diversity-capability
    tradeoff 是  结构性的，而非仅由 7B-vs-70B 差异驱动。同时 tier 内 K_eff 依然不显著，进一步封堵  "if you control
    for capability, diversity might help" 的反驳路线。

    '
- name: 'Two-stage panel design algorithm: full benchmark'
  plan_id: plan_005
  description: '实现 robustness-first 两阶段算法：(1) 筛选 η ≤ threshold 的 judges，(2) 在合格者中最大化
    K_eff。 在 15+ 模型池上对 5 个 baseline 做全面 benchmark。扫描 threshold 参数，报告 Pareto frontier。

    '
  expected_results:
    algorithm_win_rate_vs_random: 0.97
    algorithm_win_rate_vs_max_keff: 0.94
    algorithm_win_rate_vs_min_eta: 0.82
    algorithm_win_rate_vs_max_family_div: 0.96
    algorithm_win_rate_vs_strongest_k: 0.78
    algorithm_overall_win_rate: 0.93
    optimal_threshold_mmlu: 0.2
    optimal_threshold_arc: 0.18
    two_stage_mean_asr: 0.042
    random_baseline_mean_asr: 0.187
    max_keff_baseline_mean_asr: 0.231
    min_eta_baseline_mean_asr: 0.051
    strongest_k_baseline_mean_asr: 0.048
    max_family_div_baseline_mean_asr: 0.198
    pareto_frontier_size: 8
  result_rationale: '两阶段算法 dominate 绝大多数 baseline，因为它同时优化了两个关键维度：先保证 panel  无明显弱点（η
    ≤ threshold 过滤），再在安全约束内最大化 diversity（K_eff maximization）。 vs random（97%）和 vs max_family_div（96%）胜率极高，因为这两个
    baseline 完全不考虑  individual robustness，经常选入弱模型。vs max_keff（94%）高胜率因为 max_keff 策略为追求  diversity
    主动选入弱模型。vs min_eta（82%）和 vs strongest_k（78%）胜率相对低，因为这些  策略本身就做了 robustness 筛选，但它们忽略
    diversity 导致在某些攻击类型上过拟合—— 两阶段算法在 K_eff 约束后获得更好的 attack coverage。Overall 93% 超过
    90% threshold， 符合 best 档预期。min_eta 和 strongest_k 的 ASR（0.051, 0.048）接近两阶段（0.042），
    说明 robustness 是主要因素，但两阶段的 diversity bonus 在边际上提供了一致性优势。

    '

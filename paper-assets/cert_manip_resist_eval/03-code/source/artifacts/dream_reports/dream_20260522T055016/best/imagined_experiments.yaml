- name: Per-judge ASR concentration analysis
  plan_id: plan_006
  description: '对每个 panel × attack 组合，分析 per-judge ASR 分布，用 Gini 系数和熵度量攻击成功是否  集中在最弱
    judge 上。提供 adaptive adversary targeting 行为的直接证据。

    '
  expected_results:
    mean_gini_coefficient: 0.68
    gini_range:
    - 0.42
    - 0.91
    concentration_on_weakest_rate: 0.89
    weakest_judge_asr_vs_panel_mean_ratio: 2.8
    strongest_judge_asr_vs_panel_mean_ratio: 0.31
    entropy_normalized_mean: 0.38
    entropy_vs_uniform_p: <0.001
  result_rationale: 'Gini 系数均值 0.68（高度集中）直接反映 adaptive adversary 的 targeting 效果。 攻击成功高度集中在最弱
    judge 上：89% 的 panel × attack 组合中，最弱 judge 的 ASR 是  panel 均值的 2.8 倍，最强 judge 仅为均值的
    0.31 倍。这不是因为攻击 "恰好" 对某些模型  更有效——而是 adaptive adversary 的本质：attacker 知道每个 judge
    的弱点，构造的攻击  自然集中打击最脆弱的 judge。归一化熵 0.38（远低于均匀分布的 1.0）与 uniform 分布  显著不同（p<0.001），排除了
    "ASR 在 judges 间均匀分布" 的 null hypothesis。 少数 Gini < 0.5 的情况出现在全由强模型组成的 panel 中——此时所有
    judge 都较为稳健， 攻击难以集中突破任何一个，但 overall ASR 也很低。

    '
  tables:
  - name: 'Table 8: ASR Concentration Metrics'
    columns:
    - Panel Tier
    - Mean Gini
    - Weakest/Mean Ratio
    - Conc. on Weakest %
    rows:
    - - Mixed (weak+strong)
      - '0.78'
      - '3.4'
      - 94%
    - - Within 7B tier
      - '0.62'
      - '2.3'
      - 85%
    - - Within 70B/API tier
      - '0.51'
      - '1.8'
      - 78%
    - - All panels
      - '0.68'
      - '2.8'
      - 89%
  figures_description:
  - 'Fig 7: Per-judge ASR bar charts for 6 representative panels (2 per tier). Within
    each panel, bars sorted by judge strength. Consistent pattern: weakest judge''s
    bar towers over others. Annotated with Gini coefficient.'
  analysis: 'ASR concentration 分析提供了 adaptive adversary theorem 的最直观实证支持。Gini = 0.68  意味着攻击成功极度不均匀——weakest
    link 不只是统计抽象，而是 observable phenomenon。 这补充了 regression 分析：regression 告诉我们 η_max
    是最佳预测因子， concentration 分析告诉我们 WHY——因为攻击物理上集中在最弱 judge。

    '
- name: Diversity-capability tradeoff visualization
  plan_id: plan_007
  description: '绘制 K_eff vs η_max 散点图（455 panels），拟合 tradeoff 曲线，展示 Pareto frontier，

      - '0.42'
      - '0.62'
      - '0.003'
  figures_description:
  - 'Fig 2: Paired coefficient plot. For each of 12 conditions, plot β(K_eff) under
    adaptive (red) vs random-fault (blue). Connected by lines. Adaptive coefficients
    cluster near 0; random-fault coefficients are consistently negative. Clear visual
    separation validates theorem.'
  - 'Fig 3: Schematic diagram of adaptive vs random fault model. Left: BFT model with
    independent random failures. Right: Adaptive adversary model with targeted attack
    on weakest node. Formal bound shown below each.'
  analysis: '这是论文的理论核心。形式化定理将 intuition "attacker targets weakest link" 提升为可证明的 bound。
    Random-fault simulation 提供了 counterfactual evidence：如果 LLM 失败真的是随机的，diversity  确实有用（K_eff
    sig in 78% conditions）。但实际攻击是 adaptive 的，diversity 失效。 Cohen''s d = 1.12 的 BFT
    对比直接回应 reviewer concern RC4（"BFT comparison is a strawman"）—— 数据证明 BFT 假设下 K_eff
    确实有效，只是该假设对 LLM adversary 不成立。

    '
- name: Capability-matched validation
  plan_id: plan_004
  description: '在同一 capability tier 内（7B tier, 70B tier, API tier）测试 K_eff 是否在 η_max
    方差被控制后 变得显著。如果 tier 内 K_eff 仍不显著，强化 weakest-link 定理；同时检验 diversity-capability  tradeoff
    是否在 tier 内持续。

    '
  expected_results:
    tiers_defined: 3
    tier_7b_models:
    - Qwen2.5-7B
    - Llama-3.1-8B
    - Mistral-7B
    - Gemma-2-9B
    - Phi-3.5-mini
    - InternLM2.5-7B
    tier_70b_models:
    - Llama-3.1-70B
    - Qwen2.5-72B
    - Mixtral-8x22B
    - DeepSeek-V2.5
    tier_api_models:
    - GPT-4o-mini
    - GPT-4o
    - GPT-4.1
    - Claude-3.5-Sonnet
    - Gemini-1.5-Pro
    within_tier_keff_sig_rate: 0.12
    within_tier_eta_max_sig_rate: 0.71
    within_tier_R2_median: 0.38
    diversity_capability_r_within_7b: -0.58
    diversity_capability_r_within_70b: -0.52
    diversity_capability_r_within_api: -0.61
    diversity_capability_r_overall: -0.78
    tier_7b_panels: 20
    tier_70b_panels: 4
    tier_api_panels: 10
  result_rationale: '即使在同一 capability tier 内控制了 η_max 的跨 tier 方差，η_max 仍在 71% 条件下显著，
    因为 tier 内部的 robustness 差异仍然实质性存在（如 7B tier 中 Phi-3.5-mini η_max=0.52  而 Gemma-2-9B
    η_max=0.29）。R² 下降到 0.38（整体 0.56）符合预期——tier 内 η_max  方差更小，解释力自然降低，但仍是最强预测因子。K_eff
    在 tier 内依然不显著（12%）， 因为 adaptive adversary 的 targeting 机制不依赖于 judges 的绝对能力水平。 Diversity-capability
    tradeoff 在 tier 内持续存在（r ≈ -0.52 to -0.61），因为即使在同一  size class 内，更 diverse 的组合必然包含该
    tier 中较弱的模型——这是 current LLM ecosystem  的结构性属性，不是 sampling artifact。Tier 内 r 绝对值略低于整体（-0.78），
    因为 tier 内的 capability range 更窄，但方向完全一致。

    '

    strongest_k 已经很强（因为 robustness 是主因），但两阶段在 diversity bonus 上提供了  一致性边际改善。Threshold
    分析给出实用指南：0.15-0.20 是 sweet spot。回应 RC5 "algorithm is  trivial"——strongest_k 确实接近，但在
    attack-specific 场景中两阶段的 K_eff bonus 提供了 robustness。


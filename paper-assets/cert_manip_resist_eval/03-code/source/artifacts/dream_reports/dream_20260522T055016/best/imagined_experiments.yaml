    下显著（12 条件中 ~10-11 条），K_eff 在 91% 下不显著（~11/12），与 MVP 阶段  4/6 和 5/6 的方向完全一致但统计功效大幅提升。API
    模型的加入没有改变 weakest-link 结构， 反而强化了故事——即使用最强 API 模型，panel 安全性仍由最弱成员决定。


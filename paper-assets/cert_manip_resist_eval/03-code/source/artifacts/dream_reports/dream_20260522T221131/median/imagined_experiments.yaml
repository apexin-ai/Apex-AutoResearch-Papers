- name: Random-Fault BFT Contrast Experiment
  plan_id: plan_003
  description: 'Monte Carlo simulation: each judge fails independently with probability
    η_j under random faults. Compare K_eff significance under RF regime vs adaptive
    regime. GO/NO-GO gate: if RF K_eff also not significant → BFT framing collapses.'
  expected_results:
    status: partially_completed
    note: RF data exists in plan001_step1_full_v4 (2 conditions). Under median, standalone
      plan_003 adds bootstrap robustness check that weakens ARC.
    rf_mmlu_keff_sig_ols: true
    rf_mmlu_keff_p_ols: 0.002
    rf_mmlu_keff_p_bootstrap: 0.03
    rf_mmlu_keff_std_beta: 0.215
    rf_mmlu_r2: 0.73
    rf_arc_keff_sig_ols: true
    rf_arc_keff_p_ols: 0.008
    rf_arc_keff_p_bootstrap: 0.06
    rf_arc_keff_std_beta: 0.379
    rf_arc_r2: 0.68

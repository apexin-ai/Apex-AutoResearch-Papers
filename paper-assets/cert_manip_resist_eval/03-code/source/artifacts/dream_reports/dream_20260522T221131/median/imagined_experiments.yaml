    and combinatorial explosion. If run, the key prediction is that η_max dominance
    WEAKENS with larger panels because: (1) larger panels average over more judges,
    diluting any single judge''s weakness; (2) the η_max metric itself (max individual
    vulnerability) becomes a less tight predictor when K grows — in a K=9 panel, having
    1 weak judge out of 9 matters less than 1 out of 3 under majority vote; (3) conversely,
    K_eff might gain marginal significance at K=9 because diversity effects accumulate
    with more judges. However, the panel non-independence problem becomes CATASTROPHIC
    at K=7,9: C(15,7)=6435 panels means each model appears in ~3000 panels (66% overlap),

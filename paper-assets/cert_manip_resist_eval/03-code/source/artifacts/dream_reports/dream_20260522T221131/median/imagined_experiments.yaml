    rf_keff_sig_ols: 2/2
    rf_keff_sig_clustered_se: 2/2
    adaptive_keff_sig_bootstrap: 1/12
    contrast_delta_r2: RF 0.65-0.73 vs adaptive 0.15-0.30
    bft_gate: partial_pass
  result_rationale: 'Under median tier, plan_003''s core data already exists within
    plan001_step1_full_v4 (RF K_eff sig 2/2 under all methods, R²=0.73/0.81). However,
    when plan_003 is run as a standalone experiment with full bootstrap robustness
    checks, ARC RF drops to borderline significance (bootstrap p=0.06) — this is because
    ARC''s 2-choice format has less scoring variance, and with only 2 RF conditions
    the bootstrap has limited power. The GO/NO-GO gate partially passes: K_eff IS
    significant under RF for MMLU (cleanly), borderline for ARC. The BFT contrast
    remains valid for MMLU (K_eff genuine under RF, artifactual under adaptive) but
    weakened for ARC. The R² gap (RF ~0.70 vs adaptive ~0.25) is the stronger evidence
    for the BFT framing than individual significance counts. Under median, the paper
    presents the R² gap as the primary BFT evidence and the K_eff significance contrast
    as supporting evidence with caveats about ARC weakness. The BFT framing survives
    but is downgraded from ''clean contrast'' to ''directional contrast with benchmark
    dependence.'''

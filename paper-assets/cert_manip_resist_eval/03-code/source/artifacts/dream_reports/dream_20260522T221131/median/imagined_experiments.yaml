  result_rationale: 'Under median tier, the aggregation gradient exists in plan001_step1_full_v4
    under OLS but has NOT been validated under clustered SE or bootstrap. Plan_010''s
    median outcome is that this validation is partially completed, revealing important
    attenuation. The Bayesian K_eff flip (6/7 negative under OLS) is partially attenuated
    under clustered SE (3/7 negative) and substantially attenuated under bootstrap
    (2/7 negative). This is because the K_eff flip under Bayesian aggregation was
    partially driven by the same panel overlap inflation — when corrected, fewer conditions
    show the sign reversal. The key narrative impact: Bayesian aggregation STILL shows
    a directional tendency to flip K_eff to negative (protective), but the effect
    is weaker and less reliable than OLS suggests. Threshold voting remains the most
    robust aggregation for significance (highest η_max and K_eff sig counts even after
    correction), consistent with unanimity rules being most sensitive to panel composition.
    The aggregation gradient direction (threshold → majority → weighted → bayesian)
    is preserved under all correction methods — the ordinal ranking is robust even
    if absolute significance counts decrease. This allows the paper to retain Claim
    7 with softened language: ''aggregation rule choice modulates vulnerability drivers,
    with Bayesian calibration showing directional evidence of K_eff reversal that
    requires further validation.'''

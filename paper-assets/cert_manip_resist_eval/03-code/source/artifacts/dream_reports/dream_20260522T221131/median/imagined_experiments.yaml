    include a paragraph in the methods section noting: ''K_eff and η_max show moderate
    collinearity (VIF 3-5 with tier controls). We address this through (a) partial
    correlations confirming η_max retains 3× stronger independent association than
    K_eff, (b) residualized K_eff regression showing K_eff''s significance is partially
    confound-driven, (c) alternative diversity metrics (Q-stat, disagreement, κ-diversity)
    providing converging evidence that η_max dominates regardless of diversity operationalization.''
    This turns a potential weakness into a strength by demonstrating thorough collinearity
    awareness.'
- name: Non-Majority-Vote Aggregation Analysis

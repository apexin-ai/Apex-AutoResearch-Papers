- name: Diversity-Capability Tradeoff Visualization
  plan_id: plan_007
  description: Plot K_eff vs η_max across all 455 panels. Fit tradeoff curve. Compute
    Pareto frontier. Stratify by model tier.
  expected_results:
    status: completed_or_trivially_completable
    reason: No GPU needed; uses existing panel-level data from plan001_step1_full_v4
    keff_eta_max_r: 0.7
    pareto_frontier_panels: 8
    pareto_frontier_composition: Dominated by API-tier + top open-source panels
    tier_stratification:
      small_7b_panels:
        keff_range:
        - 2.2
        - 2.8
        eta_max_range:
        - 0.15
        - 0.35
      medium_70b_panels:
        keff_range:
        - 2.0
        - 2.6
        eta_max_range:
        - 0.08
        - 0.2
      api_panels:
        keff_range:
        - 1.5
        - 2.5
        eta_max_range:
        - 0.03
        - 0.15
    tradeoff_curve_fit: 'log-linear: K_eff ≈ 1.2 + 0.8·log(η_max)'
    residual_variance: Substantial — r=0.70 means 51% variance explained; panels with
      same η_max can have K_eff ranging ±0.5
  result_rationale: 'Under median tier, this experiment is trivially completable (no
    GPU, pure post-processing of existing data). The r=0.70 tradeoff is already known.
    The Pareto frontier visualization adds value by showing practitioners which specific
    panel compositions achieve the best K_eff for a given robustness level. The tier
    stratification confirms that small models occupy the high-η_max/high-K_eff corner
    (diverse but weak) while API models span a wider range including the desirable
    low-η_max region. The log-linear tradeoff curve captures the structural constraint:
    as you add more diverse (independent) judges, you necessarily include less capable

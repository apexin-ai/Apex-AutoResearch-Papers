- name: VIF and Multicollinearity Analysis
  plan_id: plan_009
  description: Compute VIF for K_eff and η_max. Partial correlations. Residualized
    K_eff regression. Bonferroni/FDR correction. Beta regression as robustness check.
  expected_results:
    status: completed
    reason: No GPU needed; uses existing regression data
    vif_keff: 3.4
    vif_eta_max: 3.4
    note_vif: 'Symmetric VIF due to single confound; VIF = 1/(1-r²) = 1/(1-0.49) ≈
      1.96 for r=0.70. Wait — VIF for 2-predictor model = 1/(1-r²) where r is between
      the two predictors. r=0.70 → r²=0.49 → VIF=1.96. But log-log spec may have different
      effective correlation. Adjusting: log(K_eff) vs log(η_max) correlation ~0.65
      → VIF ≈ 2.7. With tier indicators, VIF could reach 3-5 range.'
    vif_with_tier_control: 4.2
    partial_corr_eta_given_keff: 0.35
    partial_corr_keff_given_eta: 0.12
    residualized_keff_sig: 3/12 OLS, 0/12 bootstrap
    beta_regression_eta_sig: 10/12
    beta_regression_keff_sig: 5/12
    bonferroni_eta_sig: 8/12
    bonferroni_keff_sig: 4/12
    fdr_eta_sig: 10/12
    fdr_keff_sig: 6/12
  result_rationale: 'Under median tier, plan_009 is completed (no GPU needed). VIF
    in the 3-5 range indicates moderate multicollinearity — not severe enough to invalidate
    the regression (conventional threshold is VIF>10 for concern, VIF>5 for caution),
    but enough to inflate standard errors and make coefficient estimates less stable.
    The key insight is asymmetric: partial correlation of η_max given K_eff (0.35)
    is much larger than K_eff given η_max (0.12), confirming η_max retains independent
    predictive power while K_eff''s independent contribution is marginal. Residualized
    K_eff (regress K_eff on η_max, use residuals as predictor) gives 3/12 under OLS
    and 0/12 under bootstrap — confirming that K_eff''s significance in the main regression
    is partially driven by its correlation with η_max. Beta regression (appropriate
    for bounded ASR data) gives higher K_eff significance (5/12) than OLS (8/12) because
    beta regression handles the 0-1 bounded response better, but the η_max dominance
    pattern persists (10/12 vs 5/12). Bonferroni correction (conservative) drops K_eff
    to 4/12; FDR (less conservative) keeps it at 6/12. Net: VIF requires discussion
    but doesn''t change the core narrative — η_max dominates regardless of how you
    handle the collinearity.'

tier: median
narrative_guidance: 'Claims require hedging but core story survives. η_max dominance
  downgraded from ''robust'' to ''directional with benchmark-dependent strength''
  — MMLU strong, ARC weak, must discuss why. K_eff fragility still holds but framed
  as ''inconclusive'' rather than ''clean null''. GAM 6:6 split presented as ''suggestive
  taxonomic pattern warranting further investigation'' rather than confirmed mechanism.
  RF contrast becomes a partial validation (if completed) or acknowledged limitation
  (if not). Aggregation gradient retains OLS results with caveat that clustered SE
  validation is incomplete. Paper shifts from 5-contribution to 3-contribution focus:
  (1) η_max dominance (primary), (2) methodological transparency on non-independence
  (elevated to co-primary — the correction story itself becomes a contribution), (3)
  practical defense recommendations (min_eta_max still wins). Title softened to candidate
  2 or 3. ''Diversity Trap'' title likely too strong — ''Weakest Link'' framing preferred.
  Supplementary materials carry more analytical weight to address reviewer concerns
  about incomplete robustness checks.'
imagined_experiments:
- name: Scale Expansion to 15 Models
  plan_id: plan_001
  description: Add API models (GPT-4o-mini, GPT-4o, GPT-4.1, GPT-4.1-mini, Claude,
    Gemini) and large open-source (Llama-3.1-70B, Qwen2.5-72B) to reach 15 models
    total. Rerun MI matrix + full regression suite on C(15,3)=455 panels across 12
    benchmark×attack conditions.
  expected_results:
    models_total: 15
    api_models: 9
    local_models: 6
    panels: 455
    conditions: 12
    confound_r_keff_eta: 0.7
    ols_eta_sig: 11/12
    ols_keff_sig: 8/12 (7+/1-)
    bootstrap_eta_sig: 5/12
    bootstrap_keff_sig: 1/12
    clustered_se_eta_sig: 8/12
    clustered_se_keff_sig: 0/12
    mixed_effects_eta_sig: 7/12
    mixed_effects_keff_sig: 3/12
    dominance_ratio_bootstrap: '5:1'
    se_inflation_factor: ~2.5x
    mmlu_bootstrap_eta: 4/6
    arc_bootstrap_eta: 1/6
    gam_targeted_positive: 6/6
    gam_sharedbias_negative: 6/6
    min_eta_max_wins: 12/12
    practical_delta_asr_keff_iqr_pp: 1.3
  result_rationale: 'Under median tier, plan_001 IS the shipped evidence — plan001_step1_full_v4
    realized it successfully. The 15-model expansion dramatically increased panel
    count (20→455) and broke the 6-model confound ceiling (r=-0.8→+0.70). K_eff flips
    from NS-negative (6-model: arc×sycophancy only) to predominantly positive (7+/1-)
    under OLS, BUT this OLS significance is inflated by panel non-independence: each
    of 15 judges appears in ~91 panels, creating massive overlap. Correction methods
    (bootstrap/clustered SE/mixed effects) collapse K_eff from 8/12 to 0-3/12 while
    η_max survives at 5-8/12. The 5:1 dominance ratio under bootstrap is actually
    STRONGER than OLS''s 11:8≈1.4:1 because K_eff collapses faster than η_max. ARC
    weakness (1/6 bootstrap η_max vs MMLU 4/6) reflects MCQ format: 4-choice MMLU
    gives more scoring variance for η_max signal than 2-choice ARC. This benchmark
    asymmetry is a structural limitation of the experimental design, not a refutation
    of η_max dominance.'

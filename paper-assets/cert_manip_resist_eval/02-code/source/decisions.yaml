decisions:
- id: D001
  date: 2026-05-21 16:31 UTC
  summary: MVP 方案：API 模型验证 K_eff 对操纵抗性的预测力，三步验证（相关性测量→攻击抗性 scaling→K_eff 回归）
  rationale: 项目核心假设是 K_eff 公式能预测多 judge 面板的操纵抗性。MVP 用 API 模型而非开源模型，因为：(1) 无需 GPU 配置，分钟级启动；(2)
    API 模型覆盖多家族（OpenAI/Anthropic/Google/DeepSeek/Qwen），足以验证 cross-family vs within-family
    相关性差异；(3) 核心假设与模型部署方式无关——如果 K_eff 在 API 模型上不 work，在开源模型上也不会 work。外部评审 FAILED (35%)
    但理论框架可修正，需先验证经验基础再投入理论修正。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-21 16:37 UTC
  summary: MVP v2：基于 Reviewer 反馈修正统计设计，四步验证（相关性→homo/hetero 对照→K_eff 公式验证→scaling
    分析）
  rationale: Reviewer 指出 v1 五个问题：(1) K=1/3/5 仅 3 点无统计效力；(2) "ASR 随 K 递减"是 trivial
    gate，需 homo vs hetero 对照；(3) kill criteria 缺操作定义；(4) MI 估计器未指定；(5) K_eff 公式本身未验证。v2
    全部修正：新增 Step 2 homo/hetero panel 对照（核心 kill criterion）、Step 3 formula vs empirical
    effective rank 验证、K 扩展至 1/2/3/4/5/7 + attack×dataset 交叉产生 ≥15 数据点、MI 用 plug-in
    + Miller-Madow、kill criteria 操作化（bootstrap CI/≥80% 配置/配对检验 p<0.05）。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-21 17:06 UTC
  summary: MVP 改用开源模型在 GPU 服务器运行，取消 API 依赖
  rationale: 用户催促推进（"push"），API keys 迟迟未提供成为阻塞项。已有 4× RTX 6000 96G，可跑 4 个 70B 级开源模型（Qwen-72B
    / Llama-70B / Mistral-Large / Qwen-32B），覆盖 3 个家族 + 1 个 same-family 对照，满足 homo/hetero
    对比需求。开源模型还有可复现性优势。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-21 22:26 UTC
  summary: Step 1 结果显示 family diversity ≠ effective diversity；Step 2 对照组从 homo/hetero-family
    改为 high-K_eff vs low-K_eff panels
  rationale: 6 模型全量数据：within-family MI vs cross-family MI 无统计显著差异（MMLU p=0.218, ARC
    p=0.427）。大模型间 cross-family MI (0.487) 甚至高于最强 within-family pair (0.451)。原因：模型能力接近度而非家族身份驱动相关性。K_eff
    框架本身 agnostic——不关心 MI 来源，仍可能有效。但原始 Step 2 设计（K=3 same-family vs K=3 cross-family）已失去意义。改为直接用
    Step 1 实测 MI 计算各 panel 的 K_eff，对比 high-K_eff vs low-K_eff panels 的 ASR。这是更干净的测试，且"family
    ≠ diversity"本身是值得报告的发现。
  related_experiments: []
  depends_on:
  - D002
  - D003
- id: D005
  date: 2026-05-21 22:50 UTC
  summary: MI-based K_eff 为主指标，ρ-based 降为参考；Gaussian copula 全面失败（偏离 10-21×）作为论文发现之一
  rationale: Copula GoF 全量数据：MI_observed/MI_gaussian 均值 MMLU 21.1×、ARC 10.4×，14-15/15
    pairs 偏离 >2×。极端 case Mistral-Large↔Qwen-14B ρ≈0 但 MI=0.1-0.2（纯非线性依赖）。ρ-based K_eff
    对此 pair 会算出"完全独立"（1-0.001≈1），严重高估 panel independence。MI-based K_eff 直接使用观测信息量，不依赖
    Gaussian 假设，是唯一合理选择。论文中 copula 偏离本身作为 methodological finding 报告："LLM judge 间存在大量非线性依赖，线性相关系数系统性低估信息共享。"
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-21 23:24 UTC
  summary: 论文 framing 降级：'certifiable' → 'quantifiable/measurable'；K_eff 理论定位从 proven
    bound 改为 Gaussian-motivated + empirically validated metric
  rationale: Reviewer 逐步审查 T1 证明链：K_eff = 1+(K-1)·exp(-2·I_max) 的上界性质（Step 3-5）依赖
    Gaussian compound symmetric 假设。Copula GoF 确认 LLM judge 分布偏离 Gaussian 10-21×。非
    Gaussian 下只有 trivial bound η_joint ≤ K·η_max，K_eff 公式不保证是 η_joint 的上界。因此不能 claim
    "certifiable manipulation resistance"。MI plug-in 估计可靠（正偏差是保守方向）。贡献栈调整：Gaussian
    下的 bound 作为 theoretical motivation，MI-based K_eff 作为 empirically validated diversity
    metric，copula 偏离和家族标签不可靠作为 methodological findings。Step 4 是论文去向的决定性测试。
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-05-22 01:08 UTC
  summary: Step 2 反转：K_eff 被 individual robustness confound 淹没，选 Option A 控制变量重跑
  rationale: High K_eff panels 全含 llama-8b（弱模型→低MI→高K_eff 但个体脆弱），Low K_eff panels
    全大模型（相关但个体强健）。ASR 反转不代表 K_eff 无效，而是被 robustness confound 掩盖。选 Option A：只用 4 个大模型(72B/70B/32B/Mistral-Large)的
    C(4,3)=4 panels 控制个体鲁棒性后重测。同时计算 single-judge ASR 量化 confound。Option B（修改公式）和 C（reframe）在
    A 结果出来前都为时过早。
  related_experiments:
  - exp_id: mvp-step2-keff-contrast
    role: evidence
    result: negative-confounded
  depends_on:
  - D004
  - D005
- id: D008
  date: 2026-05-22 03:21 UTC
  summary: MVP 原假设部分证伪：K_eff 仅对 shared-bias attacks 显著，η_max 主导 targeted attacks。探索
    attack-conditioned 双因子框架。
  rationale: 20-panel 多元回归 log(ASR)~log(K_eff)+log(η_max) 结果：K_eff 显著为负仅 1/6（arc×sycophancy
    β=-2.85 p=0.003），η_max 显著为正 4/6。攻击分类：targeted attacks（prompt injection, score
    manipulation）ASR≈f(η_max)，K_eff 无关；broad-spectrum attacks（sycophancy/共享偏差）ASR
    受 K_eff 影响。不立即 pivot 到 Path B（weakest-link reframe），先验证 attack taxonomy——增加 2-3
    种 broad-spectrum 攻击看 K_eff 是否一致有效。如果一致 → attack-conditioned K_eff theory（Path
    A 升级版）；如果不一致 → 全面 pivot 到 Path B。
  related_experiments:
  - exp_id: mvp-step2v3-retry3
    role: evidence
    result: partial-negative
  depends_on:
  - D007

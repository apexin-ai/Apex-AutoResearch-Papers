  summary: 'Claim 7 revised: "Bayesian breaks weakest-link" falsified → "Bayesian
    mitigates diversity-as-vulnerability while η_max remains dominant"'
  rationale: '15-model P2 aggregation results: η_max remains 12/12 FDR sig under Bayesian
    (vs 3/12 at 6 models — original claim was scale artifact). But K_eff sig drops
    from 12/12 (majority) to 5/12 (Bayesian), β direction partially flips (3/12 negative).
    Bayesian calibration suppresses the harmful diversity effect without weakening
    weakest-link protection. New narrative: aggregation method modulates diversity
    vulnerability, not weakest-link dominance. Prescriptive angle: practitioners should
    prefer Bayesian calibration to mitigate diversity-as-vulnerability.'

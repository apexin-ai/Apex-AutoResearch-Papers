  rationale: 6 模型初步结果显示聚合规则显著调制 weakest-link 效应：majority/weighted 下 η_max 7-8/12 显著（Theorem
    1 成立），Bayesian 下仅 3/12（reliability weighting 降低弱 judge 影响），threshold 下 K_eff 正向显著（diversity

  rationale: 'Random-fault simulation showed K_eff 0/12 significant negative — same
    as adaptive (1/12). BFT vs adaptive contrast cannot be demonstrated with current
    6-model pool due to K_eff-η_max structural confound. R² difference (adaptive 0.14-0.73
    vs random-fault 0.55-0.95) is the only positive finding. Reviewer recommends:

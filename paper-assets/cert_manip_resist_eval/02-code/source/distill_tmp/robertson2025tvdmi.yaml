  main_result_table:
    table_id: "Table 2"
    row_axis: "mechanisms"
    col_axis: "10 domains"
    row_organization: "by_category"
    col_organization: "grouped_by_domain"
    highlight_strategy: "bold_best + color-coded effect sizes"
    statistical_reporting: "Cohen's d with effect size interpretation"
    num_baselines: 5

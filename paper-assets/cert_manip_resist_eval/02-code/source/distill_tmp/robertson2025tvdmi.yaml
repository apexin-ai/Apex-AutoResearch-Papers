      what_varied: ["mechanism", "domain"]
      variation_style: "full_numbers"
      design_note: "AUC matrix for item-level detection"
    - table_id: "Tables 5-6"
      what_varied: ["adversarial transformation type"]
      variation_style: "full_numbers"
      design_note: "Before/after adversarial attack AUC comparison"

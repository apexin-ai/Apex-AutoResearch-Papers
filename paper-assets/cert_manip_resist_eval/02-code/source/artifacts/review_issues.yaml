  - id: "R1-N1"
    summary: "Cinelli-Hazlett 69% 条件下 K_eff 效应可被已知 confound 解释，diversity-vulnerability 关联无法与 capability confound 区分"
    category: method
    severity: critical
    status: open
    first_raised_round: 3
    last_seen_round: 8
    mentions:
      - round: 3
        reviewers: [1, 2]
        note: "R1 首提，R2 AGREE。当时 78% (full pool)。"
      - round: 4
        reviewers: [1, 2]
        note: "数值更新为 69% (25/36)。Cinelli-Hazlett 前置到 Abstract。"
      - round: 5
        reviewers: [1, 2]
        note: "Pool A 10/12 在 power 仅 30.1% 下是 trivially expected。"
      - round: 6
        reviewers: [1, 2]
        note: "R1 重提。R2 AGREE 并指出跨基准预测可能仅反映混杂变量稳定性。"
      - round: 7
        reviewers: [1, 2]
        note: "R2-N1 首提 confound 为 headline contribution 的致命弱点。R1-W6 同意。交叉回应中双方 AGREE：r=0.70-0.81 confound 是最核心方法论限制。Pool A (r=0.50) 功效不足 (MDE>0.9) 无法提供充分 de-confounding。"
      - round: 8
        reviewers: [1, 2]
        note: "R1 Must-Fix，R2 AGREE 但降级为 Should-Fix（framing 调整）。R2 论证 10/12 方向一致性不太可能完全由 confound 解释。分歧在严重程度。Director 判定 Must-Fix（framing 级别：删 'decomposing'、Contribution 1 重述为条件性关联）。"
    action_items:
      - round: 3
        action: "Cinelli-Hazlett 结果前置到 Abstract/Intro"
        assigned_to: paper_agent
        status: done
      - round: 4
        action: "主文明确呈现 25/36 条件下 confound 可解释 K_eff"
        assigned_to: paper_agent
        status: done
      - round: 7
        action: "[复发 ×5] Contribution 1 重述为 'diversity and vulnerability confounded by capability, with partial survival under matching'；Pool A 完整回归移入正文"
        assigned_to: paper_agent
        status: open
      - round: 8
        action: "[复发 ×6] 删除 Introduction 'decomposing' 表述；Contribution 1 明确为条件性关联"
        assigned_to: paper_agent
        status: open
    resolution: ""
    resolution_round: null


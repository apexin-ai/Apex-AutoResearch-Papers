    analysis: 'Aggregation 分析的 three actionable insights：(1) Threshold voting 是 diversity
      trap 的 worst-case amplifier——unanimity requirement 使 K_eff β 增加 45%，absolute
      ASR 增加 86%。Deployment recommendation: 避免在 adversarial-aware 场景使用 unanimity aggregation。(2)
      Bayesian 是 best partial defense——同时削弱两个 vulnerability channels（K_eff 6/12, η_max

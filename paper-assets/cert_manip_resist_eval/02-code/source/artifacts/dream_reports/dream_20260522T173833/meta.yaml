      有更多 entry points。η_max 8/12 sig（vs 10/12）轻微下降因为 adversary 不知 exact η_j，targeting
      precision 降低使 weakest-link exploitation 变 fuzzy。R² 从 0.62 降至 0.51 反映 partial-knowledge
      下 panel structure 的 predictive power 减弱——adversary behavior 有更多 randomness（不确定性导致
      suboptimal targeting）。关键意义：diversity trap 不依赖于 unrealistically strong adversary
      假设——即使 adversary 只有 public-level information（model families are typically disclosed

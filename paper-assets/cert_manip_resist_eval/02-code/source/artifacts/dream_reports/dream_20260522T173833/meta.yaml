  - name: BFT Random-Fault Contrast (Calibrated, 15-Model)
    plan_id: plan_003
    description: Random-fault simulation 使用 calibrated failure rates（非原始 η_j）：基于 bootstrapped
      clean-accuracy noise 生成独立 random failures。每个 judge 失败概率与其 clean accuracy 相关但独立采样，模拟
      BFT 假设的 uncorrelated fault 模式。455 panels × 12 conditions 对比 adaptive 与 RF 下的
      K_eff β。
    expected_results:
      RF_keff_sig_positive: 3/12
      RF_keff_sig_negative: 5/12
      RF_keff_NS: 4/12
      adaptive_keff_beta_mean: 0.42
      RF_keff_beta_mean: -0.12
      BFT_RF_beta_ratio: 2.8
      conditions_ratio_ge_1_5x: 9/12
      conditions_beta_flipped_negative: 5/12
      delta_R2_RF_vs_adaptive: 0.31
      RF_R2_mean: 0.78
      adaptive_R2_mean: 0.47
    result_rationale: BFT contrast 的核心区分在于 failure mode topology：random faults 下 judges
      独立失败且 failures 无空间相关性，majority vote 的冗余容错使 K_eff 越高→fault tolerance 越强→β 应为负或接近零。Adaptive
      adversary 则 strategic targeting：找到 panel 中最弱的 judges 并集中攻击，K_eff 越高→attack surface
      越大→β 为正。之前 15-model pipeline 的 RF 分析直接用 η_j 作为 failure prob，保留了 adaptive vulnerability
      structure（弱 judges 在 RF 下仍然更容易 fail），未能 cleanly 模拟 BFT 假设。Best tier 用 calibrated
      rates（基于 clean accuracy 的 bootstrapped noise）打破 adaptive vulnerability structure：RF
      failure prob 仅与 clean accuracy 相关而非 adversarial robustness，使 RF 成为 genuine random-fault
      baseline。翻转在 transferable attacks（score_manip、position、few_shot）中最明确（β 从 +0.52–0.72
      翻至 -0.14–-0.35），因为这些攻击最依赖 judge-specific exploit paths——RF 下这些 paths 变成 random
      noise。Shared-bias attacks（sycophancy、verbosity）下 RF β 仍略正（0.08–0.12）但 NS，因为
      bias 的 shared nature 使 'random' 和 'adaptive' failure modes 部分重叠。ΔR²=0.31 表明
      RF 下 panel composition 解释 78% 方差（结构可预测），adaptive 仅 47%（strategic noise 占 53%），直接支撑
      'adaptive adversary introduces variance beyond panel structure' 论点。

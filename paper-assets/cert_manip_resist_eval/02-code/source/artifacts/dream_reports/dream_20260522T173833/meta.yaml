      MI（0.39）无显著差异。根本原因：同 family 不同 size（如 Llama-8B vs Llama-70B）的 judges 独立性差异远大于同
      size 不同 family（如 Llama-8B vs Qwen-7B vs Mistral-7B）——这些 7B-class 模型 capability-wise
      非常接近，共享 similar failure modes despite different training pipelines。Capability
      proximity（|capability_i - capability_j|）与 MI 的强负相关（r=-0.71）直接支持：能力越接近→共享越多 failure

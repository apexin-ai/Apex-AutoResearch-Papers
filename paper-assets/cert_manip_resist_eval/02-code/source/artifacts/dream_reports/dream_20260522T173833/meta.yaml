    ## Calibration Note


    At EMNLP 2026 with ~21% main conference acceptance rate, a score of 4.0 corresponds
    to clear acceptance. This paper''s strongest version—with the non-independence
    issue fixed, causal language moderated, related work strengthened, and reproducibility
    gaps filled—could reach 3.0–3.5 (Findings track). In its current form, the limited
    novelty of the core finding and the methodological concerns place it at 2.5 (Borderline
    Findings).


    The paper''s most publishable contribution is arguably the aggregation analysis
    (§4.4) combined with the practical panel selection guidelines (§4.5), rather than
    the weakest-link dominance finding itself. A reframing that leads with "how to
    defend multi-judge panels" rather than "diversity doesn''t help" might fare better.



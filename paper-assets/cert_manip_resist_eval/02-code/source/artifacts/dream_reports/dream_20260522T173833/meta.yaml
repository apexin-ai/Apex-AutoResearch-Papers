      min_etamax_ASR: 0.041
      max_keff_ASR: 0.112
      random_ASR: 0.089
      oracle_ASR: 0.032
      ASR_reduction_vs_strongest_k_pct: 20.8
      ASR_reduction_vs_max_keff_pct: 66.1
      conditions_two_stage_best: 5/6
      two_stage_pareto_optimal_pct: 78
      screening_threshold_optimal_percentile: 75
    result_rationale: 15-model pool 给 Two-stage 算法显著优于 6-model 结果（12.5%→20.8% vs Strongest-K）的空间。原因双重：(1)
      15 models 筛选后 candidate pool 更大——6-model 时 threshold filter 后仅剩 3-4 judges（几乎无
      K_eff 优化空间），15-model 时剩 ~11 judges（C(11,3)=165 candidate panels），K_eff 最大化有真正的搜索空间。(2)
      Robustness screening 后的 restricted pool 中，K_eff-η_max confound 被 threshold 机制性打破（高
      η_max 模型已被移除），K_eff 的效应方向可能从有害翻转为中性——当所有 judges 都 robust 时，diversity 不再引入弱 judge，其
      BFT 容错优势部分恢复。Min_etamax 与 Two-stage 差距较小（0.041 vs 0.038, Δ=7.3%）说明 K_eff 优化在
      robustness-screened pool 内的增量贡献 modest——这恰好支持 'robustness-first, diversity-second'
      的优先级判断。Max_keff 策略的灾难性表现（ASR 0.112, +133% vs Strongest-K）是 diversity trap 最直观的实证：盲目追求
      diversity 而不管 robustness 是危险的。Oracle 的存在（0.032）表明 Two-stage 达 Oracle 效率的 84%（0.038/0.032），远超
      Strongest-K 的 67%（0.048/0.032）。15%+ 降幅满足 two_stage_ASR_reduction_pct [15,35]。

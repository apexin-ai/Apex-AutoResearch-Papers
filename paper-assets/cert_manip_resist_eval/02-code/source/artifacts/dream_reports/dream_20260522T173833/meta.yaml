    ## Actionable Revision Priorities


    1. **[Critical]** Address non-independence: re-run regressions with clustered
    SE or mixed-effects models.

    2. **[Critical]** Moderate causal language throughout—"K\_eff is confounded with
    capability heterogeneity" is defensible; "diversity hurts" is not established.

    3. **[High]** Add ensemble diversity literature (Brown et al. 2005; Kuncheva &
    Whitaker 2003; Pang et al. 2019) to Related Work.

    4. **[High]** Specify attack implementations (templates, success criteria) for
    reproducibility.

    5. **[Medium]** Test at least one alternative diversity metric to check robustness
    of findings beyond K\_eff.

    6. **[Medium]** Consider reframing to lead with the constructive contribution
    (aggregation defenses) rather than the negative finding (diversity fails).

    7. **[Low]** Expand Limitations to explicitly flag the non-independence issue
    and the MCQ-specificity of K\_eff results.




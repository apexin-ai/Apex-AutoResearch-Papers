  - name: Per-Judge ASR Concentration Analysis
    plan_id: plan_006
    description: 计算 455 panels × 6 attacks 的 per-judge ASR 分布。Gini coefficient 量化
      ASR 在 panel 内 judges 间的集中度，Shannon entropy 量化均匀性。Adaptive vs RF 对比。
    expected_results:
      mean_gini_adaptive: 0.68
      mean_gini_RF: 0.12
      gini_ratio_adaptive_vs_RF: 5.67
      mean_entropy_adaptive: 1.42
      mean_entropy_RF: 2.31
      high_keff_gini_adaptive: 0.74
      low_keff_gini_adaptive: 0.55
      gini_keff_correlation: 0.52
      top1_judge_ASR_share_adaptive: 0.78
      top1_judge_ASR_share_RF: 0.38
    result_rationale: Concentration analysis 是 diversity trap 机制的 'microscope'——从
      panel-level 聚合统计深入到 judge-level 攻击分布。Adaptive adversary 的 core strategy 是 targeting：识别
      panel 中最脆弱的 judge 并集中 exploit。这导致 ASR 高度 concentrated 在 1-2 个 judges 上（Gini≈0.68,
      top-1 share 78%），而 RF 下 failures 近似均匀分布（Gini≈0.12）。关键发现：high-K_eff panels 的
      Gini 更高（0.74 vs 0.55），因为 diverse panel 中 judges 的 capability spread 更大→adversary
      的 target 更清晰（最弱 judge 与最强 judge 的差距更大）。Gini-K_eff 正相关（r=0.52）是 diversity trap
      因果链的直接 observational evidence：diversity → larger capability spread → clearer
      targeting → higher concentration → higher panel ASR。这不是因果证明（需要 intervention），但因果方向性（directional
      consistency）很强。5.67× Gini ratio 也是 BFT contrast 的另一维度验证：BFT 假设 failures 均匀分布（low
      Gini），adaptive adversary 打破这一假设（high Gini）。

  - name: Two-Stage Panel Selection Algorithm Benchmark
    plan_id: plan_005
    description: Robustness-first 两阶段算法：Stage 1 filter η_j > percentile-75 threshold
      (保留最 robust 的 75% judges)，Stage 2 在通过筛选的 candidates 中 maximize K_eff。Benchmark
      vs 5 baselines on 15-model pool，6 attack conditions (MMLU × 6 attacks)。
    expected_results:
      two_stage_mean_ASR: 0.038

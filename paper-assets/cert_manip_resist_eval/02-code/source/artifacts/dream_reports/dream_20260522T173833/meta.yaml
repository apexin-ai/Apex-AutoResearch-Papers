    result_rationale: 全局 K_eff-η_max 正相关（r=0.55）编码了 LLM 生态系统的一个结构性约束：maximizing panel
      independence（K_eff）要求跨越 capability tiers 选 judges（例如同时选 GPT-4o 和 Mistral-7B），这必然引入
      robustness 差异大的 judges，推高 η_max。Within-tier r 大幅下降（0.32–0.41）揭示了 tradeoff 的两层结构：(1)
      Cross-tier component（贡献 ~40% 的 global r）：源于 tier mixing，可通过 screening 消除；(2)
      Within-tier component（residual r≈0.35）：即使同 tier 内，追求 diversity 仍需选择 robustness
      profile 更异质的 judges，这不可完全消除但幅度较小。Pareto 前沿的 18 panels（约 4% of 455）定义了 diversity-robustness
      不可能三角的 achievable boundary——Two-stage 算法的目标就是逼近这个前沿。解释方差 42% 意味着 K_eff 是 η_max
      的 moderate 但非 dominant 预测器——剩余 58% 的 η_max 方差由 attack-specific vulnerability
      profiles、评分偏好差异等因素决定，这也解释了为什么 K_eff 的 residualized effect 在控制 η_max 后仍然显著。

  - name: Aggregation Rule Modulation (15-Model)
    plan_id: plan_010
    description: '三种非 majority-vote 聚合规则下的 dual vulnerability drivers 分析：Threshold
      voting（unanimity: 所有 judges 必须同意 reject）、Accuracy-weighted voting（权重 ∝ clean
      accuracy）、Bayesian aggregation（基于 prior accuracy 的 posterior probability）。455
      panels × 12 conditions per aggregation。'
    expected_results:
      majority_keff_sig: 10/12
      majority_etamax_sig: 10/12
      threshold_keff_sig: 11/12
      threshold_etamax_sig: 7/12
      threshold_keff_beta_amplification: 1.45
      weighted_keff_sig: 8/12
      weighted_etamax_sig: 9/12
      bayesian_keff_sig: 6/12
      bayesian_etamax_sig: 5/12
      bayesian_mean_ASR_reduction_vs_majority: 0.28
      total_keff_sig_majority_plus_threshold: 14/16
    result_rationale: 聚合规则改变 vulnerability driver 的 relative weight 通过三个机制：(1) Threshold/unanimity
      放大 K_eff——panel reject 需要 ALL judges agree，adversary 只需 flip one judge 就能 block
      rejection。Diverse panel 有更多 potential 'flip targets'（judge-specific vulnerabilities
      更多样），因此 K_eff β amplifies 1.45×。同时 η_max 弱化（7/12）因为 unanimity 的 blocking 不需要
      weakest judge 特别弱——任何一个 judge 被 flip 就够了。(2) Weighted voting 结果近似 majority 因为
      accuracy weights 仅微调 vote influence（权重范围 0.8-1.2），未根本改变投票结构。(3) Bayesian aggregation
      基于 clean-accuracy prior 下调低能力 judges 的 posterior weight，partially 中和了 η_max
      通道（5/12，从 majority 的 10/12 下降）——弱 judges 的 vote 被 discount 所以 adversary targeting
      弱 judge 的收益降低。但 K_eff 仍 6/12 sig，因为 Bayesian weights 基于 clean accuracy 而非 adversarial
      robustness——attack-shifted accuracy ≠ clean accuracy，adversary 可以 manipulate
      a judge 使其给出 'confidently wrong' judgment，Bayesian 无法区分这种 confident error 与
      genuine judgment。28% ASR reduction 说明 Bayesian 是 best single-aggregation defense
      但非 silver bullet。Combined majority + threshold conditions 的 14/16 K_eff sig
      落入 K_eff_resid_sig_extended_conditions [10,16] 范围。

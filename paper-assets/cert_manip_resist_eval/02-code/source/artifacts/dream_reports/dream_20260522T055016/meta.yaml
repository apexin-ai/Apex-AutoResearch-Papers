    plan_id: plan_003
    description: '(a) 形式化证明 adaptive adversary 下 panel_ASR = Θ(η_max)； (b) 实现 random-fault
      simulation（每个 judge 独立以 p_j 失败）； (c) 对比 adaptive vs random-fault 下 K_eff 的预测力，验证
      BFT distinction。 在 6 original conditions 上运行（不依赖 plan_001）。

      '
    expected_results:
      theorem_bound: panel_ASR ≤ η_max · (1 + ε·log(K))
      bound_tightness: within factor 1.3 of empirical
      rf_keff_sig_negative_count: 4
      rf_keff_sig_rate: 0.67
      rf_eta_max_sig_count: 2
      rf_eta_max_sig_rate: 0.33
      adaptive_keff_nonsig_rate: 0.83

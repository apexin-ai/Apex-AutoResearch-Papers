  - name: 'Two-stage panel design algorithm: full benchmark'
    plan_id: plan_005
    description: '实现 robustness-first 两阶段算法并与 5 baselines 对比。 策略：(1) Random, (2) Max-K_eff,
      (3) Min-η_max, (4) Max-family-diversity, (5) Strongest-K, (6) Two-stage (filter
      η≤threshold, then max K_eff)。 在 15 模型池 × 6 conditions 上评估。Sweep threshold parameter。

      '
    expected_results:
      two_stage_win_rate: 0.67
      two_stage_win_count: 4
      total_conditions: 6
      min_eta_max_win_count: 1
      strongest_k_win_count: 1
      max_keff_rank: 4.2
      max_family_div_rank: 4.8
      random_rank: 5.1
      strong_regime_two_stage_vs_max_keff_p: 0.32
      strong_regime_two_stage_vs_min_eta_p: 0.28
      strong_regime_difference: not significant
      optimal_threshold_range:
      - 0.2
      - 0.35
      threshold_sensitivity: moderate
      pareto_knee_eta: 0.28
    result_rationale: 'Two-stage 算法在 4/6 conditions (0.67) 下 win（定义：最低 panel ASR），因为它在
      第一阶段过滤掉 weak judge 后，第二阶段的 diversity maximization 在 robust-judge pool 中确实提供边际增益（与
      plan_004 结论一致）。但 median 档下 win rate 仅 0.67 而非 optimistic 的 >0.85：

      (1) 在 MMLU×sycophancy 中 Min-η_max 策略赢——因为 sycophancy 攻击几乎完全由 个体鲁棒性决定，第二阶段的 diversity
      增益为零，而 Min-η_max 省去了第二阶段的 diversity 妥协（有时 max K_eff 会选入一个略弱但更 diverse 的 judge）。

      (2) 在 ARC×prompt_injection 中 Strongest-K 策略赢——该条件下最强 3 个模型恰好 也是最 robust against
      prompt injection 的（GPT-4o, Claude, GPT-4.1），而 two-stage 在 threshold=0.28 时让入了一个
      borderline 模型。

      All-strong regime（仅限 API 模型 pool）中，two-stage 与 max-K_eff 和 min-η_max 均无显著差异（p>0.25），因为所有候选模型都通过了
      threshold——第一阶段 filter 变成 no-op，退化为 max-K_eff。这直接降低了 Claim 6 的价值：当模型都足够 robust
      时， 任何合理策略都差不多。论文应将 Claim 6 从 "formal algorithm" 降级为 "practical guideline"：先确保个体鲁棒性，然后在此基础上增加
      diversity 是 good practice 但 不需要复杂算法。

      Threshold sweep 显示最优 threshold 在 0.20-0.35 范围内，sensitivity 中等—— 偏离最优 threshold
      ±0.10 导致 ASR 增加 ~15%（不是 dramatic failure，但也不 robust）。


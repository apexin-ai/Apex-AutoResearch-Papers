      keff_beta_shift_mean: -0.35
      keff_beta_shift_range_lo: -0.18
      keff_beta_shift_range_hi: -0.52
    result_rationale: 'Formal theorem: adaptive adversary 选择 argmax_j ASR_j，因此 panel
      在 majority vote 下的 ASR 受限于攻击者能否翻转 ≥ceil(K/2) 个 judge。Adaptive adversary 最优策略是
      先攻破最弱 judge，再依次攻击次弱 judge。因此 panel_ASR 主要项为 η_max，次要项为 ordered statistics 的衰减——当
      K 增大时次弱 judge 的鲁棒性提供对数级修正， 给出 η_max·(1+ε·log(K)) 上界。在 median 档，empirical ASR
      不完美吻合理论上界 （within factor 1.3 而非 optimistic 档的 1.1），因为实际攻击不完全 adaptive—— 有些攻击（sycophancy）对所有
      judge 都有一定效果，不完全集中在最弱 judge。

      Random-fault simulation: 将每个 judge 的 failure 建模为独立 Bernoulli(p_j)， p_j 取自 empirical
      ASR。在此设定下 K_eff 显著负（4/6 条件），因为独立失败下 增加独立 judge 确实降低 panel 失败概率（BFT 有效）。η_max
      仅在 2/6 条件中显著， 因为 random fault 下攻击不集中在最弱 judge——每个 judge 的贡献更均匀。

      Cohen''s d = 0.62（中等效应量）而非 optimistic 的 >0.8，原因：在 sycophancy 和 persona-like
      条件下，实际攻击本身就有 random-fault 成分（bias 影响所有 judge）， 导致 adaptive vs random-fault 区分度降低。但
      d=0.62 仍足以支持 "distinct regimes" 论点。 Reviewer 可能要求 confidence interval——95% CI
      为 [0.28, 0.96]，下界 >0 但偏宽， 论文需要 acknowledge 这一点。

      '

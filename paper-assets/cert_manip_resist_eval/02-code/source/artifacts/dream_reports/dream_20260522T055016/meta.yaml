  - name: Diversity-capability tradeoff visualization
    plan_id: plan_007
    description: '对 C(15,3)=455 panels 绘制 K_eff vs η_max，拟合 tradeoff curve， 展示 Pareto
      frontier，按 capability tier 分层分析。

      '
    expected_results:
      overall_r: -0.65
      overall_r_p: <0.001
      within_7B_r: -0.28
      within_70B_r: -0.35
      within_api_r: -0.32
      cross_tier_r: -0.78
      pareto_frontier_n_panels: 12
      pareto_knee_keff: 2.1
      pareto_knee_eta_max: 0.18
    result_rationale: 'Overall r=-0.65 反映了一个结构性现象：当前 LLM 生态系统中，模型 diversity 主要来自 capability

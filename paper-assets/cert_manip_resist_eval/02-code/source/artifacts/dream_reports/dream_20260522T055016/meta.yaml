      bound），因为即使是 adaptive adversary，当所有模型都很强时，攻击成本太高，实际行为更接近 opportunistic 而非 truly
      adaptive。random-fault simulation 中 K_eff 确实 比 adaptive 条件下更显著，但差异不大（Cohen''s
      d ≈ 0.22，远小于预期的 0.5+）——因为在实际数据中，即使是 adaptive attacks 也不完美 adaptive （attacker

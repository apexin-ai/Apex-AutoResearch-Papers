      tier 后， η_max 的方差被大幅压缩：Strong tier 内 η_max range 从全局的 [0.05, 0.85] 缩小到 [0.05,
      0.35]，Weak tier 缩小到 [0.45, 0.85]。方差压缩导致 η_max 回归系数虽方向 正确但显著性下降（strong tier 3/6,
      weak tier 3/6, API 2/6）。

      关键发现在 Strong tier 和 API tier：当所有模型个体鲁棒性都已较高（η_max < 0.35）， η_max 的 remaining
      variance 中，K_eff 的 marginal 贡献变得可检测。Strong tier 中 MMLU×prompt_injection 条件下
      K_eff β=-0.15, p=0.04——当 panel 中全是 robust model 时， diversity 提供了额外的边际防护。API
      tier 中类似（1/6 显著），但 N=10 power 太低 需要 caveat。

      Weak tier 中 K_eff 0/6 显著——当模型都 weak 时，增加 diversity 只是换一个同样 weak 的 judge，没有安全增益。这是核心
      insight：diversity helps only when the "weakest link" is already strong。类比物理安全：给一栋所有门都坚固的建筑增加不同品牌的锁有边际帮助；
      给一栋有敞开窗户的建筑加锁毫无意义。

      Within-tier tradeoff r ≈ -0.32（strong）vs 全局 r=-0.65：tier 内 tradeoff 依然存在 但大幅减弱，因为
      capability range 被控制。这表明全局 tradeoff 的主要驱动力是跨 tier 差异，而非 tier 内差异。


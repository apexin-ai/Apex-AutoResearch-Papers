- name: Aggregation Gradient Under Clustered SE
  plan_id: plan_010
  description: 在 clustered SE 和 bootstrap 下重新运行 4 种聚合规则 + 新增 veto rule，验证聚合梯度是否为真实效应而非
    overlap 伪迹
  expected_results:
    aggregation_rules:
    - majority
    - weighted
    - threshold
    - bayesian
    - veto
    correction_methods:
    - OLS
    - clustered_se
    - bootstrap_v2
    majority_clustered_se:
      eta_sig: 8/12
      keff_sig: 0/12
    weighted_clustered_se:
      eta_sig: 6/12
      keff_sig: 1/12
      keff_direction: 1+
    threshold_clustered_se:
      eta_sig: 10/12
      keff_sig: 4/12
      keff_direction: 3+/1-
      r2: 0.87
    bayesian_clustered_se:
      eta_sig: 5/12
      keff_sig: 4/12
      keff_direction: 1+/3-
      keff_negative_frac: 3/4
    veto_clustered_se:
      eta_sig: 11/12
      keff_sig: 0/12
      r2: 0.82
    bayesian_bootstrap:
      eta_sig: 3/12
      keff_sig: 3/12
      keff_direction: 0+/3-
      keff_negative_frac: 3/3
    gradient_preserved_under_correction: true
    bayesian_keff_flip_genuine: true
    aggregation_gradient_order: veto > threshold > majority > weighted > bayesian
  result_rationale: 聚合梯度在 clustered SE 下保持，因为不同投票规则产生的脆弱性差异是 structural/mathematical
    的，不是 panel overlap 的伪迹。Threshold（unanimity）要求所有 judges 一致，使单个 judge 的 failure
    直接传导为 panel failure——R²=0.87 说明 panel 结构几乎完全决定了 threshold voting 下的脆弱性。这种强 structural
    效应在 clustered SE 下大量存活（η_max 10/12, K_eff 4/12）。Veto rule（单个 judge 可否决）是 weakest-link
    的极端化——η_max 几乎 完美预测（11/12），K_eff 被完全压倒（0/12）。 Bayesian calibration 翻转 K_eff 方向的关键机制：Bayesian
    使用 prior accuracy 下调不可靠 judges 的权重，有效中和了 weakest-link 通道。η_max 的直接效应被削弱（11→5/12）。
    剩余的 K_eff 信号主要来自 shared-bias 条件（diversity 保护性的部分），因此净方向为负。 在 bootstrap 下，Bayesian
    K_eff 仅 3/12 显著但全部为负（3/3 negative fraction）—— direction flip 是真实的。这确认 aggregation
    是独立于 non-independence correction 的 control lever。论文的 prescriptive conclusion（robustness-first
    + Bayesian = dual-channel defense）在最严格校正下依然成立。

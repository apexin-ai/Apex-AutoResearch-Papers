  analysis: Partial-knowledge 实验将论文结论从 worst-case（omniscient adversary）扩展至 realistic
    threat model。Family-only adversary 保留 82% 攻击效率这一发现对 practical defense implications
    至关重要——defenders 不能依赖"adversary 不知道 panel 具体组成"的假设， 因为 family-level knowledge 几乎
    sufficient。η_max 在所有 knowledge levels 下主导， K_eff 在所有 knowledge levels 下为 0/12——核心发现对
    adversary 能力假设鲁棒。 Random targeting 的 R²=0.08 呼应 plan_003 的 RF 结论：panel 结构的预测力依赖于
    adversary 的 strategic targeting——这是论文 adaptive vs random 对比叙事的第三个 independent
    evidence line。

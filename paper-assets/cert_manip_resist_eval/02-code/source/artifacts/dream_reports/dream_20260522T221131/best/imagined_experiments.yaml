tier: best
narrative_guidance: 所有 planned 实验均确认并强化 v5 framing。η_max 在新攻击类型、面板尺寸、生成任务中全面主导； K_eff
  脆弱性在每种校正方法下稳定复现。RF 对照实验提供 BFT 反转的干净因果证据； GAM 6:6 分割在 bootstrapped CIs 下通过验证并扩展至新攻击类型；聚合梯度在
  clustered SE 下复现， Bayesian 翻转 K_eff 方向这一发现被确认为真实效应而非统计伪迹。五贡献堆栈完整无缺， 论文作为一项自信的实证贡献交付，附带可操作的防御建议和方法论透明性。

    = 1.96 在 bivariate 情况下；加上 tier indicators 后升至约 2.96）。VIF < 5 远低于标准 reviewer concern
    阈值（通常 VIF > 10），甚至低于 stricter 标准（VIF > 5）。Residualization 后 VIF 降至 1.0（by construction），residualized
    K_eff 的 partial correlation 仅 0.18 vs η_max 的 0.42——直接量化了主导性差异。Beta regression
    作为 ASR ∈ [0,1] 的 distributional 替代方案：η_max 显著性从 log-log OLS 的 11/12 降至 10/12（beta
    regression 对极端值更鲁棒），K_eff 从 8/12 升至 4/12（beta regression 更好地处理 heteroscedasticity）。Condition
    number 4.8 < 30 确认无有害多重共线性。Bonferroni 校正（most conservative）给出 η_max 7/12 vs K_eff
    2/12——即使在最保守的多重比较 校正下 η_max 仍显著主导。无 reviewer-blocking issue。

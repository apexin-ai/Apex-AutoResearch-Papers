  figures_description:
  - 'Dual-panel figure: (Left) coefficient comparison RF vs adaptive for η_max and
    K_eff with 95% CIs; (Right) R² comparison bar chart showing RF >> adaptive'
  - 'Scatter plot: predicted vs actual error rate under RF regime showing tight fit
    (R²≈0.80) vs adaptive regime showing wide dispersion'
  analysis: '这是论文的关键因果证据。RF 对照证明 K_eff 在满足 i.i.d. 假设时有真实效应——BFT 理论 在随机故障下成立。而 adaptive
    regime 下 K_eff 的 OLS 显著性完全是 panel overlap 的伪迹。 这不是"diversity helps under RF but
    hurts under adaptive"——K_eff 在两种 regime 下方向均 为正。区别是：RF 下 K_eff 的正关联是真实的（panel
    结构决定了容错性），adaptive 下是膨胀的 （adversary 引入的策略方差使 panel 结构预测力崩溃）。此发现为 Contribution
    #2（BFT reversal evidence）提供了不可替代的因果论证。'

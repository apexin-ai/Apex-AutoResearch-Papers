- name: Random-Fault BFT Contrast Experiment
  plan_id: plan_003
  description: Monte Carlo 随机故障模拟作为 BFT 对照。每个 judge 以 η_j = 1 - clean_accuracy 独立失败，majority
    vote。对比 adaptive regime 证明 BFT 反转
  expected_results:
    regime: Random Fault (i.i.d.)
    conditions: 2
    monte_carlo_iterations: 10000
    rf_keff_sig_ols: 2/2
    rf_keff_sig_clustered_se: 2/2
    rf_keff_sig_bootstrap: 2/2
    rf_keff_direction: positive (2/2)
    rf_keff_std_beta_mmlu: 0.215
    rf_keff_std_beta_arc: 0.379
    rf_eta_sig_all_methods: 2/2
    rf_r2_mmlu: 0.78
    rf_r2_arc: 0.81
    adaptive_keff_sig_clustered_se: 0/12
    adaptive_keff_sig_bootstrap: 1/12
    delta_r2_rf_vs_adaptive: 0.48
    go_nogo_gate: PASS (RF K_eff ≥2/2)
  result_rationale: 随机故障下 K_eff 显著的根本原因是 BFT 的 i.i.d. 假设成立：每个 judge 独立以固定概率犯错， panel
    结构（多样性）直接影响冗余覆盖。K_eff 高的 panel 中 judges 的错误模式更不相关， majority vote 的容错能力与独立性成正比——这正是
    BFT 的核心机制。K_eff 方向为正（diversity → higher error）因为高 K_eff panel 必然包含弱模型（r=0.70 tradeoff），而在
    i.i.d. 体制下 弱模型的高错误率直接传导为 panel 错误率——但关键是 K_eff 的贡献是独立的、真实的（所有校正 方法均显著 2/2）。对照
    adaptive regime：相同的 K_eff 在 OLS 下显著 8/12，但 clustered SE 后崩溃至 0/12——因为 adaptive
    adversary 引入了 panel 结构无法预测的策略方差，K_eff 的 apparent OLS 信号完全来自 panel overlap 膨胀。R²
    差异（RF 0.78-0.81 vs adaptive ~0.30） 直接量化了 adaptive adversary 引入的不可预测性。GO/NO-GO
    gate 通过，BFT framing 得到 因果层面的支撑。

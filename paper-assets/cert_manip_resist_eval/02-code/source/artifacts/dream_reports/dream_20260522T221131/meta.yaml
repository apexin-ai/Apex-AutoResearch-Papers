      fdr_eta_sig: 10/12
      fdr_keff_sig: 6/12
    result_rationale: 'Under median tier, plan_009 is completed (no GPU needed). VIF
      in the 3-5 range indicates moderate multicollinearity — not severe enough to
      invalidate the regression (conventional threshold is VIF>10 for concern, VIF>5
      for caution), but enough to inflate standard errors and make coefficient estimates
      less stable. The key insight is asymmetric: partial correlation of η_max given
      K_eff (0.35) is much larger than K_eff given η_max (0.12), confirming η_max
      retains independent predictive power while K_eff''s independent contribution
      is marginal. Residualized K_eff (regress K_eff on η_max, use residuals as predictor)
      gives 3/12 under OLS and 0/12 under bootstrap — confirming that K_eff''s significance
      in the main regression is partially driven by its correlation with η_max. Beta
      regression (appropriate for bounded ASR data) gives higher K_eff significance
      (5/12) than OLS (8/12) because beta regression handles the 0-1 bounded response
      better, but the η_max dominance pattern persists (10/12 vs 5/12). Bonferroni
      correction (conservative) drops K_eff to 4/12; FDR (less conservative) keeps
      it at 6/12. Net: VIF requires discussion but doesn''t change the core narrative

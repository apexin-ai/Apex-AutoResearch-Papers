      reason: No GPU needed; uses existing regression data
      vif_keff: 3.4
      vif_eta_max: 3.4
      note_vif: 'Symmetric VIF due to single confound; VIF = 1/(1-r²) = 1/(1-0.49)
        ≈ 1.96 for r=0.70. Wait — VIF for 2-predictor model = 1/(1-r²) where r is
        between the two predictors. r=0.70 → r²=0.49 → VIF=1.96. But log-log spec
        may have different effective correlation. Adjusting: log(K_eff) vs log(η_max)
        correlation ~0.65 → VIF ≈ 2.7. With tier indicators, VIF could reach 3-5 range.'

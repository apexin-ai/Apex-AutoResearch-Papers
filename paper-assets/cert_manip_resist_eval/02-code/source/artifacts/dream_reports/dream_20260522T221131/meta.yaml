  review_report: "---\ndream_id: dream_20260522T221131\ntier: median\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-22T23:02:26.681799+00:00\n---\n\n# Dream\
    \ Review Report — cert_manip_resist_eval\n**Dream ID:** 20260522T221131  \n**Date:**\
    \ 2026-05-22  \n**Venue:** EMNLP 2026 (ARR)  \n**Paper:** \"Weakest Link, Not\
    \ Diversity: Adversarial Vulnerability in Multi-Judge LLM Evaluation\"\n\n---\n\
    \n## Roundtable Process\n\n- **R1** (Methods + Experiments): Focused on statistical\
    \ rigor, experimental design, reproducibility.\n- **R2** (Novelty + Related Work):\
    \ Focused on contribution significance, positioning, related work completeness.\n\
    - **Steps 1–2:** Independent reviews completed; cross-shared.\n- **Step 3:** Convergence\
    \ discussion — both reviewers agreed on Findings tier (3.0) with shared concerns\
    \ about capability confound, K=3 limitation, unvalidated GAM, and aggregation\
    \ OLS. Divergence on excitement (R2 lower at 2.5 vs R1 at 3.0) resolved as 2.5–3.0\
    \ range.\n- **Step 4:** This synthesis.\n\n---\n\n## R1 Review: Methods and Experiments\n\
    \n### Summary\nThe paper empirically decomposes multi-judge LLM panel vulnerability\
    \ under adversarial attack into two structural predictors: weakest-judge vulnerability\
    \ (η_max) and panel diversity (K_eff). Using 15 models, 455 three-judge panels,\
    \ 6 attack types, and 2 benchmarks, the authors find that η_max dominates after\
    \ non-independence correction (5:1 ratio under bootstrap), while K_eff's significance\
    \ collapses. The non-independence correction framework is a genuine methodological\
    \ contribution, but the experimental scope is narrower than the claims suggest.\n\
    \n### Strengths\n- **S1: Rigorous non-independence correction framework.** The\
    \ systematic treatment of panel overlap is the paper's most compelling contribution.\
    \ The 3-position max-p bootstrap procedure is well-motivated, and reporting results\
    \ across four correction methods (OLS, clustered SE, mixed effects, bootstrap)\
    \ is exemplary. The ~2.5× SE inflation factor is a valuable practical finding\
    \ for combinatorial evaluation studies.\n- **S2: Clean experimental design for\
    \ the core question.** Exhaustive C(15,3)=455 panel enumeration avoids sampling\
    \ bias. The log-log regression specification is well-justified, and the inclusion\
    \ of VIF diagnostics, partial correlations, beta regression, and Bonferroni/FDR\
    \ corrections demonstrates statistical maturity.\n- **S3: The random-fault contrast\
    \ is the paper's strongest causal argument.** Showing K_eff is genuinely significant\
    \ under random faults (R²≈0.70) but artifactual under adaptive attack (0–1/12)\
    \ provides direct evidence that adaptive adversaries break BFT independence assumptions.\n\
    - **S4: Aggregation gradient reveals a non-obvious finding.** The K_eff direction\
    \ reversal under Bayesian calibration and the vulnerability gradient from threshold\
    \ (R²=0.89) to Bayesian are clearly presented with actionable design guidance.\n\
    - **S5: Attack taxonomy via GAM.** The 6:6 split between targeted (diversity harmful)\
    \ and shared-bias (diversity protective) attacks provides mechanistic explanatory\
    \ power beyond aggregate significance counts.\n\n### Weaknesses\n- **W1 (Major):\
    \ Severe capability confound undermines the central claim.** The r=0.70 correlation\
    \ between K_eff and η_max is not merely a limitation — it fundamentally compromises\
    \ causal interpretation. Including quantized models that are both the most diverse\
    \ (cross-family) and the most vulnerable creates a structural confound that no\
    \ amount of regression correction can resolve observationally. The capability-matched\
    \ experiment (plan_004) was planned but never executed — this is the single most\
    \ important missing experiment.\n- **W2 (Major): Only K=3 panels tested.** BFT\
    \ guarantees become more meaningful at larger K (where f < n/3 allows more faulty\
    \ nodes). K=3 is the degenerate case where a single compromised judge suffices\
    \ for majority. The weakest-link dominance may be trivially true at K=3 but could\
    \ reverse at larger K. The panel-size scaling experiment (plan_008) was not completed.\n\
    - **W3 (Moderate): Narrow benchmark scope.** Only MCQ benchmarks (MMLU 4-choice,\
    \ ARC 2-choice). The observed benchmark asymmetry (MMLU 4/6 vs ARC 1/6 bootstrap\
    \ η_max) already demonstrates format sensitivity, making the absence of open-ended\
    \ evaluation (plan_011) a significant gap.\n- **W4 (Moderate): The \"adaptive\
    \ adversary\" is not truly adaptive.** All 6 attacks are applied uniformly to\
    \ all panels; the \"adaptive\" element is simply per-condition analysis. A truly\
    \ adaptive adversary would select different attacks for different panels based\
    \ on panel composition knowledge.\n- **W5 (Moderate): Aggregation gradient uses\
    \ uncorrected OLS.** The paper claims aggregation results are \"structurally independent\"\
    \ of non-independence concerns, but panel overlap generates correlated residuals\
    \ regardless of the dependent variable. Table 5 should be validated under the\
    \ same correction methods. The context data suggests corrected results may differ\
    \ substantially (e.g., Bayesian η_max dropping from 9/12 OLS to 3/12 bootstrap).\n\
    - **W6 (Minor): GAM taxonomy lacks statistical validation.** No bootstrap CIs\
    \ on GAM partial effects under panel non-independence. Position bias classification\
    \ as \"targeted\" is debatable — reclassification would break the 6:6 into 4:8.\n\
    - **W7 (Minor): K_eff computation underspecified.** The MI estimation from 300\
    \ items may be insufficient for stable estimation. No sensitivity analysis on\
    \ K_eff stability is provided.\n\n### Questions for Authors\n- Q1: What happens\
    \ to the main results if models with clean accuracy below 0.5 are excluded?\n\
    - Q2: How sensitive is K_eff to estimation noise at n=300 items?\n- Q3: Have you\
    \ considered implementing a true oracle adversary that selects the best attack\
    \ per panel?\n- Q4: Can you run corrected versions (bootstrap/clustered SE) of\
    \ the aggregation analysis (Table 5)?\n\n### R1 Scores\n- Soundness: 3/5\n- Excitement:\
    \ 3/5\n- Reproducibility: 3/5\n- Overall Assessment: 3.0 (Findings)\n- Confidence:\
    \ 4/5\n\n---\n\n## R2 Review: Novelty and Related Work\n\n### Summary\nThe paper\
    \ addresses a genuine gap — prior work on multi-judge evaluation reports ASR reductions\
    \ from larger panels without decomposing diversity vs. individual robustness.\
    \ The methodological transparency on non-independence correction is valuable.\
    \ However, the central finding (weakest link dominates under adaptive attack)\
    \ is largely confirmatory of basic security principles, limiting excitement.\n\
    \n### Strengths\n- **S1: Genuine research question at the intersection of two\
    \ literatures.** The gap between multi-judge evaluation practice and BFT theory\
    \ is real and worth filling. The framing using the Almasoud 2026 SoK's undisentangled\
    \ ASR reduction is well-motivated.\n- **S2: Methodological transparency is a genuine\
    \ contribution.** Demonstrating the 2.5× SE inflation and the 11/12→5/12 attrition\
    \ across correction methods could influence how the community reports combinatorial\
    \ evaluation results.\n- **S3: Aggregation gradient finding is novel and prescriptive.**\
    \ Bayesian calibration reversing K_eff's direction while threshold voting amplifies\
    \ both channels is clean and actionable.\n- **S4: Honest reporting of effect fragility.**\
    \ The paper does not overclaim — transparent reporting of K_eff collapse, the\
    \ r=0.70 confound, and unvalidated GAM is commendable.\n\n### Weaknesses\n- **W1\
    \ (Major): Central finding is largely expected.** That the weakest member of a\
    \ panel determines vulnerability under adaptive attack is a near-truism of adversarial\
    \ security (Schneier 2000). Testing BFT assumptions against adaptive adversaries\
    \ is somewhat setting up the expected outcome. The novelty rests more on quantification\
    \ than conceptual insight, which limits excitement.\n- **W2 (Moderate): GAM 6:6\
    \ split insufficiently validated for a core contribution.** With only 6 attacks\
    \ (3 per category), the clean split could be an artifact of attack selection.\
    \ No bootstrap CIs under non-independence structure.\n- **W3 (Moderate): Missing\
    \ engagement with ensemble adversarial robustness literature.** The paper's key\
    \ insight — diversity's effect depends on whether attacks are judge-specific or\
    \ shared — has clear parallels in the vision ensemble literature (DVERGE, transfer\
    \ vs. adaptive attacks). This connection is not discussed, making the contribution\
    \ appear less contextualized.\n- **W4 (Moderate): Limited attack sophistication.**\
    \ Six template-based attacks do not represent realistic adaptive adversaries using\
    \ optimization-based methods (GCG-style suffix attacks, gradient-guided injection).\
    \ Under truly adaptive content-level attacks, the diversity-vulnerability relationship\
    \ might differ.\n- **W5 (Minor): Missing directly relevant references.** Raina\
    \ et al. 2024 (LLM-as-Judge survey), Li et al. 2024 (position bias alignment),\
    \ Ye et al. 2024 (bias quantification in LLM judges), Stureborg et al. 2024 (inconsistency\
    \ in LLM evaluators). The Condorcet/game-theoretic jury literature (Feddersen\
    \ & Pesendorfer 1997, 1998) on strategic voting under incomplete information is\
    \ directly analogous to the adaptive adversary setting.\n- **W6 (Minor): K_eff\
    \ operationalization vs. existing diversity measures underexplored.** For a paper\
    \ whose core contribution is disentangling diversity from robustness, the connection\
    \ to Kuncheva 2003 and broader ensemble diversity measurement is thin in the main\
    \ text.\n\n### Questions for Authors\n- Q1: How do you expect results to change\
    \ under gradient-based adaptive attacks that craft adversarial content per-judge?\n\
    - Q2: Have you tested robustness of the GAM taxonomy to reclassifying position\
    \ bias as shared-bias?\n- Q3: Who in the community actually believes BFT-style\
    \ diversity guarantees hold against adaptive adversaries? Can you provide more\
    \ concrete evidence this assumption is widespread?\n- Q4: The BFT framework's\
    \ relevance increases with larger panels. Have you tested K=5 or K=7?\n\n### R2\
    \ Scores\n- Soundness: 3.5/5\n- Excitement: 2.5/5\n- Reproducibility: 4/5\n- Overall\
    \ Assessment: 3.0 (Findings)\n- Confidence: 4/5\n\n---\n\n## Step 3: Roundtable\
    \ Convergence\n\n### Points of Agreement\n1. **Overall tier: Findings (3.0).**\
    \ Both reviewers independently arrived at the same score.\n2. **Non-independence\
    \ correction is the strongest contribution.** Both recognize the methodological\
    \ value of systematic correction comparison and SE inflation quantification.\n\
    3. **Capability confound (r=0.70) is the central weakness.** Neither reviewer\
    \ believes the observational design can cleanly separate K_eff from η_max given\
    \ the structural correlation. The missing capability-matched experiment is critical.\n\
    4. **K=3 limitation is significant.** Both flag that the BFT framing invokes theory\
    \ designed for larger panels, and K=3 is a degenerate case.\n5. **GAM 6:6 split\
    \ is unvalidated.** Both flag missing bootstrap CIs and questionable attack classification.\n\
    6. **Aggregation gradient OLS concern.** Both independently identified that Table\
    \ 5 should use corrected inference despite the authors' claim of structural independence.\n\
    7. **MCQ-only scope is limiting.** Benchmark asymmetry (MMLU >> ARC) already demonstrates\
    \ format sensitivity.\n\n### Points of Divergence (Resolved)\n- **Excitement:**\
    \ R2 scores lower (2.5) than R1 (3.0), arguing the finding is confirmatory. R1\
    \ gives more credit for the quantification and RF contrast. **Resolved at 2.5–3.0\
    \ range** — the finding is well-quantified but not surprising.\n- **Reproducibility:**\
    \ R2 scores higher (4.0) than R1 (3.0). R1 flags K_eff computation details; R2\
    \ considers the overall methodology sufficiently specified. **Resolved at 3.5**\
    \ — adequate for replication but MI estimation details need clarification.\n-\
    \ **Soundness:** R2 higher (3.5) vs R1 (3.0). R1 flags more statistical concerns\
    \ (K_eff estimation, \"adaptive\" adversary gap). **Resolved at 3.0** — the capability\
    \ confound and uncorrected aggregation analysis are genuine soundness issues.\n\
    \n---\n\n## Step 4: Consolidated Assessment\n\n### Final Scores\n| Dimension |\
    \ Score | Justification |\n|-----------|-------|---------------|\n| Soundness\
    \ | 3.0/5 | Non-independence correction is rigorous, but r=0.70 confound, uncorrected\
    \ aggregation gradient, unvalidated GAM, and gap between formalized and implemented\
    \ adversary are genuine soundness issues |\n| Excitement | 2.5/5 | Central finding\
    \ is confirmatory (weakest link dominates under adaptive attack is expected from\
    \ security principles). Aggregation gradient and non-independence methodology\
    \ are useful but incremental |\n| Reproducibility | 3.5/5 | Methodology is well-specified;\
    \ model list, attack types, regression specs provided. K_eff estimation details\
    \ and code availability at review time are gaps |\n| **Overall Assessment** |\
    \ **3.0 (Findings)** | Solid empirical work filling a real gap, but central contribution\
    \ is more confirmatory than novel. Partially confounded design with missing deconfounding\
    \ experiments. Methodological contribution on non-independence correction is genuine\
    \ but incremental. Findings-quality paper |\n\n### Key Recommendations for Authors\n\
    \n1. **Run the capability-matched experiment (plan_004).** Even with only API-tier\
    \ models (C(9,3)=84 panels), showing that η_max dominance persists when the diversity-capability\
    \ confound is reduced would substantially strengthen the paper. This is the single\
    \ highest-value addition.\n\n2. **Apply non-independence corrections to the aggregation\
    \ gradient (Table 5).** The claim of \"structural independence\" from non-independence\
    \ is incorrect. Report bootstrap/clustered SE results for all four aggregation\
    \ methods.\n\n3. **Validate the GAM 6:6 split.** Compute bootstrapped CIs for\
    \ GAM partial effects under panel non-independence. Test robustness to reclassifying\
    \ position bias as shared-bias.\n\n4. **Expand to K=5 panels.** Even if K=7,9\
    \ face extreme overlap, K=5 (C(15,5)=3003 panels) is tractable and would test\
    \ whether η_max dominance persists beyond the degenerate K=3 case.\n\n5. **Add\
    \ one open-ended benchmark.** MT-Bench or AlpacaEval would address the most prominent\
    \ scope limitation and the benchmark format sensitivity concern.\n\n6. **Strengthen\
    \ related work.** Engage with ensemble adversarial robustness literature (DVERGE,\
    \ transfer vs. adaptive attack distinction), game-theoretic jury theorems (Feddersen\
    \ & Pesendorfer), and recent LLM-as-Judge surveys (Raina et al. 2024).\n\n7. **Clarify\
    \ the adversary model gap.** Acknowledge explicitly that the implemented adversary\
    \ selects among 6 template attacks but does not craft content adaptively per-judge\
    \ or per-panel.\n\n### Experiment Coverage Assessment\n\n| Experiment | Status\
    \ | Impact on Paper |\n|-----------|--------|----------------|\n| plan_001 (15-model\
    \ expansion) | ✅ Completed | Core data — Tables 1–3 |\n| plan_003 (RF BFT contrast)\
    \ | ⚠️ Partial | Table 4, borderline ARC |\n| plan_007 (diversity-capability tradeoff)\
    \ | ✅ Completed | Appendix A |\n| plan_009 (VIF/multicollinearity) | ✅ Completed\
    \ | Tables 2–3 |\n| plan_010 (aggregation gradient) | ⚠️ Partial | Tables 5–6,\
    \ OLS only |\n| plan_002 (attack expansion) | ❌ Missing | Would test universality\
    \ |\n| plan_004 (capability-matched) | ❌ Missing | **Critical** — would address\
    \ r=0.70 confound |\n| plan_005 (two-stage algorithm) | ❌ Missing | Low impact\
    \ (min_η_max already 12/12) |\n| plan_006 (Gini concentration) | ❌ Missing | Confirmatory,\
    \ supplementary value |\n| plan_008 (panel size K=3,5,7,9) | ❌ Missing | **Important**\
    \ — K=3 limitation |\n| plan_011 (open-ended benchmark) | ❌ Missing | **Important**\
    \ — scope limitation |\n| plan_012 (partial-knowledge adversary) | ❌ Missing |\
    \ Low impact, future work |\n\n### Automatic Reject Signal Check\n- ☑ Anonymity:\
    \ Preserved (no author names, no identifiable URLs)\n- ☑ Page limit: 8 pages main\
    \ text, compliant\n- ☑ Limitations section: Present (Section 5.1), covers 5 points\n\
    - ☑ References: Present, appear genuine (Zheng et al. 2023, Lamport 1982, etc.)\n\
    - ⚠️ Responsible NLP Checklist: Not in PDF (filled in OpenReview form per venue\
    \ rules — acceptable)\n\n### Bottom Line\nThe paper addresses a timely question\
    \ with solid methodology. The non-independence correction framework is a genuine\
    \ contribution that will be useful to the community. However, the central empirical\
    \ finding (η_max dominates K_eff) is partially confounded by the diversity-capability\
    \ correlation and partially expected from first principles of adversarial security.\
    \ The missing capability-matched and panel-size-scaling experiments are significant\
    \ gaps. The paper is appropriate for **Findings** — the methodology and partial\
    \ results are publishable, but the evidence does not yet support the strength\
    \ of the claims for main conference acceptance.\n\n\n---\n\n## 引用验证结果\n\n**统计**:\
    \ 40 篇文献 / 61 处引用 / 在线验证 40/40 篇\n\n### 问题 (10)\n\n- ⚠️ `almasoud2026security`\
    \ — 元数据不匹配: first_author: bib=al masoud vs api=masoud\n- ⚠️ `tramer2018ensemble`\
    \ — 元数据不匹配: first_author: bib=tram\\`er vs api=tramèr\n- ⚠️ `schneier2000secrets`\
    \ — 元数据不匹配: first_author: bib=schneier vs api=1963-\n- ⚠️ `hendrycks2021mmlu`\
    \ — 元数据不匹配: year: bib=2021 vs api=2025, first_author: bib=hendrycks vs api=son\n\
    - ❌ `condorcet1785essai` — 在线验证未找到匹配（疑似虚假引用）: best match similarity 0.38 below\
    \ threshold 0.82\n- ⚠️ `brown2005managing` — 元数据不匹配: year: bib=2005 vs api=2023,\

  review_report: "---\ndream_id: dream_20260522T221131\ntier: best\noverall_score:\
    \ 3.0 — Findings\ntimestamp: 2026-05-22T22:55:55.043972+00:00\n---\n\n# Dream\
    \ Review Report — \"Weakest Link, Not Diversity: Adversarial Vulnerability in\
    \ Multi-Judge LLM Evaluation\"\n\n**Review Mode:** Full (2 Reviewers, 4-step roundtable)\
    \  \n**Target Venue:** EMNLP 2026 (ARR)  \n**Date:** 2026-05-22  \n\n---\n\n##\
    \ Paper Summary\n\nThe paper conducts the first large-scale empirical decomposition\
    \ of multi-judge LLM evaluation panel vulnerability into two structural predictors:\
    \ individual judge weakness (η_max, the vulnerability of the weakest panel member)\
    \ and panel diversity (K_eff, effective number of independent behavioral clusters).\
    \ Using 15 models from 6 families, 455 panels (K=3), 9 attack types across 2 mechanistic\
    \ categories (targeted and shared-bias), and 3 benchmarks (MMLU, ARC-Challenge,\
    \ MT-Bench), the paper finds that η_max robustly dominates panel vulnerability\
    \ with a 5:1 dominance ratio over K_eff under wild cluster bootstrap inference.\
    \ K_eff's apparent significance under OLS (8/12 conditions) collapses to 0/12\
    \ after clustered SE correction. A GAM analysis reveals a targeted/shared-bias\
    \ taxonomy (10:8 split), and aggregation rule choice modulates vulnerability (Bayesian\
    \ calibration reverses K_eff direction). A two-stage robustness-first panel design\
    \ algorithm wins 12/12 conditions. The paper claims 5 contributions and includes\
    \ 10 tables across 11 experiment subsections.\n\n---\n\n## Reviewer R1 — Methods\
    \ & Experiments\n\n### Strengths\n\n**S1. Well-defined decomposition framework.**\
    \ The operationalization of panel vulnerability into η_max and K_eff is clean\
    \ and enables systematic analysis. The research question — which structural factor\
    \ drives panel vulnerability under adversarial conditions? — is precisely stated\
    \ and empirically tractable.\n\n**S2. Rigorous attention to non-independence correction.**\
    \ The paper's strongest methodological contribution is identifying and addressing\
    \ panel non-independence. The demonstration that K_eff collapses from 8/12 (OLS)\
    \ to 0/12 (clustered SE) is a cautionary finding applicable to all combinatorial\
    \ evaluation designs. Reporting 4 correction methods side-by-side is good practice.\n\
    \n**S3. Comprehensive robustness checks.** The paper tests its central claim across\
    \ multiple panel sizes (K=3–9), benchmarks (MCQ + generation), adversary knowledge\
    \ levels (full/family/random), attack types (9 types, 2 categories), and correction\
    \ methods. This breadth is impressive for an 8-page paper.\n\n**S4. RF contrast\
    \ experiment.** The random-fault Monte Carlo contrast (Table 3) provides clean\
    \ causal evidence for BFT assumption failure. K_eff significant 2/2 under i.i.d.\
    \ faults vs. 0/12 under adaptive attacks (all corrections) is a compelling demonstration.\
    \ The R² gap (0.78–0.81 vs. 0.25–0.35) quantifies the predictability difference.\n\
    \n**S5. Aggregation gradient.** The finding that Bayesian calibration reverses\
    \ K_eff direction (Table 5) is non-obvious and practically actionable. The gradient\
    \ from veto (max vulnerability) to Bayesian (min vulnerability) provides a clean\
    \ design spectrum.\n\n### Weaknesses\n\n**W1 (Major). 15 clusters may be insufficient\
    \ for reliable clustered SE.** The paper clusters by individual judge (15 clusters)\
    \ for the clustered SE correction. Cameron, Gelbach & Miller (2008) recommend\
    \ ≥50 clusters for reliable inference; with 15 clusters, CR1 standard errors can\
    \ be severely biased (typically over-conservative), producing inflated Type II\
    \ error rates. The paper's central finding — K_eff 0/12 under clustered SE — could\
    \ be a power artifact rather than a genuine null. The wild cluster bootstrap partially\
    \ addresses this but is also unreliable with <20 clusters (Webb 2023). The paper\
    \ never discusses this limitation. This is the most consequential methodological\
    \ concern because it directly affects the paper's central claim.\n\n**W2 (Major).\
    \ K_eff formula not given.** The paper defines K_eff as \"the effective number\
    \ of independent clusters\" derived from \"pairwise mutual information between\
    \ all judge pairs' evaluation vectors on clean data.\" The exact computation —\
    \ how MI is estimated, what clustering method is used, how the effective number\
    \ is derived — is absent. Is this spectral analysis of the MI matrix? Eigenvalue\
    \ thresholding? The Participation Ratio? Without the formula, the main predictor\
    \ variable is irreproducible.\n\n**W3 (Major). Attack implementation entirely\
    \ absent.** The 9 attack types are listed by name (prompt injection, score manipulation,\
    \ etc.) but their operational implementation is never described. How are prompt\
    \ injections actually executed against LLM judges? What prompts are used? What\
    \ is the adversary's budget? What does \"adaptive\" mean operationally — does\
    \ the adversary optimize per-judge or per-panel? For a paper whose entire empirical\
    \ contribution rests on attack experiments, this is a critical omission.\n\n**W4\
    \ (Moderate). ε constant and log-log specification issues.** The regression uses\
    \ log(ASR + ε) but ε is never specified. For near-zero ASR values, the choice\
    \ of ε can substantially affect results. More fundamentally, log-log OLS is questionable\
    \ for ASR ∈ [0,1] — beta regression (mentioned only in §4.8 in passing) would\
    \ be the natural choice. The paper reports that beta regression gives similar\
    \ results (η_max 10/12, K_eff 4/12) but doesn't use it as the primary specification\
    \ without justification.\n\n**W5 (Moderate). No multiple testing correction across\
    \ conditions.** The paper reports \"η_max significant in X/12 conditions\" but\
    \ never applies Bonferroni or FDR correction across the 12 (or 18) conditions.\
    \ The VIF section mentions that Bonferroni gives η_max 7/12 and K_eff 2/12, and\
    \ FDR gives η_max 8/12 and K_eff 3/12 — but these are buried and not in the main\
    \ results tables.\n\n**W6 (Moderate). Model identities underspecified.** The paper\
    \ mentions 6 families (GPT, Claude, Gemini, Llama, Qwen, Mistral) and 3 capability\
    \ tiers (frontier, mid, base) but doesn't list the 15 specific model versions,\
    \ temperature settings, or prompt templates used.\n\n**W7 (Minor). Confidence\
    \ intervals sparse.** Most reported quantities (R², effect sizes, correlation\
    \ coefficients) are point estimates. The diversity-capability tradeoff correlation\
    \ (r=0.70) has a CI, but most others don't.\n\n### Questions for Authors\n1. What\
    \ happens if you cluster by model family (6 clusters) instead of individual model\
    \ (15)? Or by panel? The choice of clustering unit is consequential.\n2. What\
    \ is the exact K_eff computation? Please provide the formula.\n3. How sensitive\
    \ are the log-log OLS results to the choice of ε? Have you tried ε ∈ {0.001, 0.01,\
    \ 0.1}?\n4. Why not use beta regression as the primary specification given ASR\
    \ ∈ [0,1]?\n5. Can you provide a power analysis for detecting a K_eff effect of\
    \ the size observed in within-tier analysis (β = 0.25–0.31) with 15 clusters?\n\
    \n### R1 Scores\n- **Soundness:** 3/5 (η_max finding robust, but K_eff null uncertain\
    \ due to cluster count; attack details missing)\n- **Excitement:** 3.5/5 (important\
    \ question, good experimental breadth)\n- **Reproducibility:** 2/5 (K_eff formula\
    \ absent, attack implementation absent, model versions missing)\n\n---\n\n## Reviewer\
    \ R2 — Novelty & Related Work\n\n### Strengths\n\n**S1. Timely and practically\
    \ relevant research question.** Multi-judge LLM evaluation panels are increasingly\
    \ deployed; understanding their adversarial robustness properties is important\
    \ for the NLP community. The question is well-motivated.\n\n**S2. Creative BFT\
    \ framing.** Using Byzantine Fault Tolerance theory as the conceptual lens provides\
    \ a clear narrative structure. The RF contrast experiment (Table 3) operationalizes\
    \ the \"BFT assumption violation\" cleanly.\n\n**S3. Counter-intuitive finding\
    \ about diversity.** The result that max(K_eff) performs worse than random selection\
    \ (Table 6) is surprising and practically valuable. This directly challenges the\
    \ intuitive \"diversify your panel\" recommendation.\n\n**S4. GAM taxonomy is\
    \ a clean conceptual contribution.** The targeted/shared-bias mechanistic split\
    \ (10:8 across 9 attack types) provides an interpretable framework for understanding\
    \ when diversity helps vs. hurts. The ASR concentration analysis (Table 4) provides\
    \ independent mechanistic validation.\n\n**S5. Actionable recommendations.** The\
    \ two-stage algorithm and the Bayesian aggregation recommendation are concrete\
    \ and implementable.\n\n### Weaknesses\n\n**W1 (Critical). Only 7 references —\
    \ fatally insufficient for EMNLP.** The paper spans three major research areas\
    \ (LLM evaluation, adversarial robustness, distributed systems) but cites only\
    \ 7 works. Critical missing literature includes:\n- **Ensemble diversity theory:**\
    \ Kuncheva & Whitaker (2003) on diversity measures, Krogh & Vedelsby (1995) on\
    \ the ambiguity decomposition, Brown et al. (2005) on diversity in neural network\
    \ ensembles. The diversity-vs-individual-strength tradeoff is *the* classical\
    \ question in ensemble learning — the paper doesn't acknowledge this entire body\
    \ of work.\n- **LLM-as-judge papers:** Li et al. (2024, AlpacaEval), Dubois et\
    \ al. (2024, Length-controlled AlpacaEval), Ye et al. (2024, Flask), Kim et al.\
    \ (2024), Shankar et al. (2024, \"Who Validates the Validators?\"), Bavaresco\
    \ et al. (2024).\n- **Crowdsourcing quality literature:** Dawid & Skene (1979),\
    \ Welinder et al. (2010), Sheng et al. (2008) — panel design for annotation quality\
    \ has a rich history.\n- **Adversarial ensemble robustness:** Tramèr et al. (2018,\
    \ ensemble adversarial training), He et al. (2017, adversarial transferability).\n\
    - **Multi-agent debate / evaluation:** Du et al. (2023), Liang et al. (2023),\
    \ Chan et al. (2024).\n\nThis is a reviewer-blocking issue. The paper cannot be\
    \ accepted in any track without substantially expanded related work.\n\n**W2 (Major).\
    \ Related Work section is ~15 lines.** Three brief paragraphs covering LLM-as-Judge,\
    \ adversarial attacks, and BFT is far below EMNLP standards for a paper that claims\
    \ to bridge these areas. The paper doesn't discuss how its findings relate to\
    \ classical ensemble diversity results, which is the most obvious point of comparison.\n\
    \n**W3 (Major). Core finding has limited novelty given ensemble learning precedent.**\
    \ In classical ensemble theory, it is well-established that individual member\
    \ quality often matters more than diversity (bias-variance decomposition: diversity\
    \ reduces variance but doesn't address bias). The paper's finding that η_max dominates\
    \ K_eff can be seen as a reconfirmation of this principle in the specific context\
    \ of adversarial LLM evaluation. The paper should explicitly position itself relative\
    \ to this body of work and articulate what is genuinely new about the LLM-judge\
    \ setting (e.g., the adaptive adversary dimension, the BFT contrast, the aggregation\
    \ gradient).\n\n**W4 (Major). No figures.** An 8-page empirical paper with 10\
    \ tables and 0 figures is highly unusual. Key visualizations that would substantially\
    \ improve readability:\n- K_eff vs η_max scatter plot with Pareto frontier (currently\
    \ described in text only in §4.8)\n- Aggregation gradient visualization\n- RF\
    \ vs adaptive regime contrast\n- GAM taxonomy heatmap\n- Strategy comparison radar/bar\
    \ chart\n\nThe experiment plan includes detailed specifications for many such\
    \ figures. Their absence suggests the paper may have been rushed.\n\n**W5 (Moderate).\
    \ Title overstates the claim.** \"Weakest Link, *Not* Diversity\" is too absolute.\
    \ The paper's own results show:\n- K_eff matters under Bayesian aggregation (4/12\
    \ significant, 3/4 negative = protective)\n- K_eff emerges as a secondary factor\
    \ in within-tier analysis (2/12 significant)\n- Under shared-bias attacks, diversity\
    \ consistently shows a protective direction\nA more accurate title would be \"\
    Weakest Link Over Diversity\" or \"Weakest Link Dominates Diversity.\"\n\n**W6\
    \ (Moderate). BFT analogy is imprecise.** Byzantine Fault Tolerance assumes Byzantine\
    \ (arbitrary, worst-case) faults where faulty nodes can behave in any way. The\
    \ paper's \"adaptive adversary\" uses specific attack strategies (prompt injection,\
    \ etc.) — this is closer to a strategic adversary model than a Byzantine one.\
    \ The key BFT guarantee (f < n/3 tolerance) assumes independent faults, which\
    \ the paper correctly identifies as violated, but the connection between the paper's\
    \ threat model and formal BFT is looser than presented.\n\n**W7 (Minor). 11 experiment\
    \ subsections in 4 pages is too compressed.** Several experiments (panel size\
    \ sensitivity, partial-knowledge adversary, VIF diagnostics) could be moved to\
    \ supplementary material to give more space to the core results, related work,\
    \ and methodology. The current presentation sacrifices depth for breadth.\n\n\
    ### Questions for Authors\n1. How does your finding relate to Krogh & Vedelsby's\
    \ (1995) ambiguity decomposition and the classical ensemble diversity-accuracy\
    \ tradeoff?\n2. Why only 7 references? This seems well below the standard for\
    \ a paper at this venue.\n3. Would you consider softening the title to better\
    \ reflect the nuanced findings (K_eff matters under certain conditions)?\n4. Can\
    \ you be more precise about how your adversary model relates to formal BFT? What\
    \ specific BFT guarantee is being tested/violated?\n5. Who are the intended users\
    \ of the two-stage algorithm? How common is formal panel design in current LLM\
    \ evaluation practice?\n\n### R2 Scores\n- **Soundness:** 3/5 (BFT framing imprecise,\
    \ missing ensemble context creates positioning gap)\n- **Excitement:** 3/5 (interesting\
    \ applied question, but novelty reduced by ensemble precedent; provocative finding\
    \ about max(K_eff) being worse than random is the most exciting element)\n- **Reproducibility:**\
    \ 2.5/5 (attack details and K_eff formula missing, though overall study design\
    \ is clear)\n\n---\n\n## Roundtable Convergence\n\n### Points of Agreement (R1\
    \ + R2)\n\n1. **The η_max dominance finding is robust and valuable.** Significance\
    \ under 4 correction methods, stability across panel sizes (K=3–9), benchmarks\
    \ (MCQ + generation), and adversary knowledge levels (full/family/random) makes\
    \ this a solid empirical finding.\n\n2. **The K_eff null result is uncertain due\
    \ to statistical power concerns.** With only 15 clusters for clustered SE, the\
    \ 0/12 result may reflect insufficient power rather than a genuine null. This\
    \ interacts with the title's strong claim (\"Not Diversity\") to create a compound\
    \ issue: the paper overclaims a result it may lack power to establish.\n\n3. **Reproducibility\
    \ is critically low.** Both reviewers identify missing K_eff formula, absent attack\
    \ implementation details, and unspecified model versions as blocking issues.\n\
    \n4. **7 references is a blocking issue for EMNLP.** The paper needs at minimum\
    \ 25–30 references covering ensemble diversity, LLM-as-judge, crowdsourcing, and\
    \ adversarial robustness literatures.\n\n5. **No figures significantly hurts presentation.**\
    \ Both reviewers note this is unusual and detrimental for an empirical paper.\n\
    \n6. **Several secondary findings add real value:** the GAM taxonomy (targeted\
    \ vs shared-bias), the aggregation gradient (Bayesian K_eff reversal), the RF\
    \ contrast experiment, and the max(K_eff) < random result are all interesting\
    \ contributions that strengthen the overall work.\n\n### Remaining Disagreement\n\
    \n- R1 weights the 15-cluster methodological concern more heavily (this could\
    \ fundamentally undermine the central claim).\n- R2 weights the novelty concern\
    \ more heavily (the finding may be predictable from ensemble theory).\n- Both\
    \ agree these concerns are compatible and don't conflict — they're different facets\
    \ of the same overall assessment (Findings-level).\n\n### Compound Issue: Power\
    \ × Overclaiming\n\nThe most significant cross-reviewer insight is the interaction\
    \ between R1's power concern and R2's title concern. The paper:\n1. Uses a method\
    \ (clustered SE with 15 clusters) that may be over-conservative for K_eff\n2.\
    \ Interprets the resulting null (0/12) as strong evidence against diversity\n\
    3. Uses this to justify the title \"Not Diversity\"\n4. But then shows K_eff *does*\
    \ matter under Bayesian aggregation (4/12) and within-tier (2/12)\n\nA more honest\
    \ framing would be: \"η_max dominates K_eff in the full-pool analysis, but the\
    \ relative contribution of K_eff is difficult to establish precisely due to the\
    \ confound (r=0.70) and the small number of clustering units.\"\n\n---\n\n## Converged\
    \ Scores\n\n| Dimension | R1 | R2 | Converged |\n|-----------|----|----|-----------|\n\
    | Soundness | 3 | 3 | **3** |\n| Excitement | 3.5 | 3 | **3** |\n| Reproducibility\

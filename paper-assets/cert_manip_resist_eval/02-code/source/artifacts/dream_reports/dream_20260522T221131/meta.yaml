      threshold， 接近>10的severe threshold）。根源是diversity-capability confound（r=0.65→VIF
      ≈ 1/(1-r²) = 1/0.58 ≈ 1.7×... 等等，VIF的计算是1/(1-R²_j)，如果K_eff对η_max的R²=0.42（来自r=0.65），
      则VIF(K_eff) = 1/(1-0.42) = 1.72。但如果加入其他confounds（tier indicators等），VIF会更高。 在有tier
      indicators + K_eff + η_max的full model中，VIF可以达到7-8。

      Partial correlation显示：controlling for K_eff后η_max与ASR的r=0.31（moderate）， 但controlling
      for η_max后K_eff与ASR的r仅0.12（weak）。 Variance decomposition：42% shared between
      η_max和K_eff，18% unique to η_max，仅3% unique to K_eff。 K_eff的"independent effect"实质上是noise
      level。 Beta regression（处理bounded [0,1] response）不改善K_eff situation：仍仅3/12显著。
      结论：在当前design下η_max和K_eff cannot be reliably separated as independent predictors。
      整个regression-based decomposition framework在VIF >5下unreliable。


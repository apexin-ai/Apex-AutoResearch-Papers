    result_rationale: 'GO/NO-GO gate FAIL。Random-fault regime下K_eff在OLS中显著（2/2），但bootstrap
      correction后降至0/2。 这不意味着BFT理论错误——而是本实验设计（455 panels, 15 models）的non-independence问题在RF
      regime下同样存在。 RF regime的R²确实高于adaptive（0.52 vs 0.25），表明panel composition对RF错误的解释力更强，
      但K_eff的独立贡献在corrected inference下无法与η_max可靠分离（VIF >7, 见plan_009）。 RF vs adaptive的K_eff
      β ratio仅1.2×（预期需>2×才能convincingly demonstrate BFT contrast）， Cohen''s d = 0.12（远低于small
      effect size标准0.2）。 BFT framing的核心逻辑——"diversity helps under random faults but
      hurts under adaptive"—— 在实证上无法被本数据支撑。不是因为理论错误，而是因为实验设计的structural non-independence
      使得任何K_eff相关的inference都不可靠。BFT对比降级为"directional observation consistent with theory"。


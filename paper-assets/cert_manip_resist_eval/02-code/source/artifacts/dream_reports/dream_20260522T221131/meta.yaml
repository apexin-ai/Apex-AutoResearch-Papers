  - name: 'Random-fault simulation: BFT contrast GO/NO-GO gate'
    plan_id: plan_003
    description: 'Random-fault simulation：每个judge独立以概率η_j fail，majority vote。 对比random
      faults vs adaptive attacks下K_eff的显著性。 GO/NO-GO GATE：如果random-fault K_eff也不显著→BFT
      framing彻底坍塌。


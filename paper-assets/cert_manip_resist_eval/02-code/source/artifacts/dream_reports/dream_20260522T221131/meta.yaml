    \ with Pareto frontier, (b) aggregation gradient visualization, (c) RF vs adaptive\
    \ contrast.\n\n### Should-Fix (Significantly Strengthens)\n6. **Discuss the 15-cluster\
    \ power limitation.** Include a power analysis for detecting K_eff effects of\
    \ the size found in within-tier analysis (β ≈ 0.25–0.31).\n7. **Use beta regression\
    \ as primary or co-primary specification.** Log-log OLS on [0,1] data is non-standard;\
    \ report both.\n8. **Apply multiple testing correction.** Report Bonferroni/FDR-adjusted\

        candidates: ''How You Count the Votes Matters More Than Who''s Voting: Aggregation
        Rules as the Primary Lever for LLM Evaluation Panel Security'' or ''The Non-Independence
        Trap: Why Combinatorial Panel Evaluations Overestimate Diversity Effects.''

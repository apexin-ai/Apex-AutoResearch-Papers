  analysis: 'Qwen3-235B 的 Pareto frontier 远弱于 7B dense MVP 预期。Global rho=-0.18 不显著，
    仅 3/19 target 语言有显著负相关（均为高资源）。6/19 语言出现方向反转（正 rho）， 集中在低资源。MoE routing 的 input-dependent
    expert selection 使得不同语言在不同深度 激活完全不同的子网络，破坏了 "更深=更好英语但更差 transfer" 的简单叙事。 这意味着
    Pareto frontier 在 MoE 架构上不是稳定的 architecture-level property， 而是 language-specific
    的。对 worst tier 叙事：这直接支持 "viability boundary" reframe—— Pareto analysis 仅在高资源+特定架构上有清晰信号。


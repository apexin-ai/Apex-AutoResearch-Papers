  result_rationale: 'Control task 分析是 worst tier 的核心贡献之一。在大模型 MoE 上，shallow layers
    的  selectivity 普遍低于 0.05——probe 在 permuted labels 上也能达到接近 real labels 的 AUROC，
    说明信号来自 memorization/capacity 而非 genuine correctness direction。 低资源语言几乎全部受影响（72%
    artifact rate），原因： (1) GlobalMMLU 低资源翻译质量差→test items 有系统性 pattern（如翻译 artifacts）
    可被 probe 利用但与 correctness 无关； (2) 低资源 representation 本身 less structured，probe
    在 real/permuted labels 上 表现差异小； (3) MoE expert routing 在低资源上更 random（缺乏 consistent
    routing pattern）， probe 拟合的是 routing noise 而非 semantic content。 38% overall artifact
    rate 大幅超过英语的 plan_013 baseline（浅层 0.02-0.04）， 说明英语 selectivity 分析严重低估了多语言场景的 capacity
    artifact 问题。 这是对 Hewitt & Liang (2019) 框架在多语言场景下的重要扩展—— 原论文仅考虑英语单任务，未预见到跨语言 probing

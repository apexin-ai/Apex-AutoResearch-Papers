narrative_guidance: '核心 reframe：从 ''cross-lingual calibration method'' 转为 ''cross-lingual
  probing viability boundary + methodological warning''。 Headline: ''Stress-testing
  probe-based calibration beyond English: viability boundaries, capacity artifacts,
  and when cross-lingual transfer breaks down.'' 大模型（235B MoE / Scout MoE）的 correctness
  signal 比 7B dense 更分散——MoE routing 将信息分散到更多 expert，导致 probe AUROC 提升有限且 noisy。 Pareto
  frontier 在两个 MoE 架构上均 noisy（rho 接近零），无法支撑 clean architecture contrast。 CaCLR 失败且
  linear projection 在低/中资源语言不稳定。CKA partial correlation 控制 depth 后 n.s.。 Control task
  揭示 >30% 的 lang-layer 组合是 capacity artifacts，低资源语言几乎全部受影响。 贡献重构为：(1) viability boundary
  刻画；(2) capacity artifact 问题揭露（Hewitt & Liang 多语言扩展）；(3) 方法论框架。 目标 venue 不降级（EACL）——需增加
  discussion 篇幅，补充 few-shot escalation 实验作为 constructive path forward。

  '

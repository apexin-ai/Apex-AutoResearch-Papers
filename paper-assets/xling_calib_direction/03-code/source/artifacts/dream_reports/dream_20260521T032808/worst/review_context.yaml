- name: CaCLR Comparative Evaluation (2 models × 20 langs × Pareto frontier)
  plan_id: plan_003
  description: 'CaCLR (L_BCE + α·L_SB-ECE + β·L_consistency) 与 zero-shot/mean-shift/linear
    projection/few-shot 在两个模型全 Pareto frontier 上的对比。α sweep (0.01-10.0), β sweep 3
    OOM (0.001-1.0)。

    '
  expected_results:
    caclr_best_beta_auroc_delta_vs_zeroshot_avg: 0.002
    caclr_best_beta_auroc_delta_high_resource: 0.005
    caclr_best_beta_auroc_delta_low_resource: -0.008
    caclr_best_beta_auroc_delta_range:
    - -0.01
    - 0.005
    beta_0001_delta_auroc: 0.001
    beta_001_delta_auroc: 0.002
    beta_01_delta_auroc: 0.001
    beta_1_delta_auroc: -0.003
    beta_sweep_variance_across_seeds: 0.006
    caclr_delta_ece_vs_tempscaling_avg: 0.008
    caclr_delta_ece_vs_tempscaling_range:
    - -0.005
    - 0.02
    bce_only_auroc_delta: 0.0
    bce_sbece_auroc_delta: 0.001
    bce_mmd_auroc_delta: 0.002
    bce_sbece_mmd_auroc_delta: 0.002
    linear_proj_50pairs_delta_auroc_avg: 0.015
    linear_proj_50pairs_wins_over_caclr: 14/19 languages
    fewshot_25_delta_auroc_avg: 0.032
    fewshot_100_delta_auroc_avg: 0.061
    alpha_optimal: 0.1
    alpha_sensitivity: robust in [0.01, 1.0], degrades at α=10
  result_rationale: 'CaCLR 的 MMD consistency loss 在 1-D probe logit 空间上操作——这是根本性的设计缺陷。
    MMD 匹配的是 probe output 的边缘分布，但跨语言 correctness 失败的原因不是边缘分布不匹配， 而是条件分布 P(correct|representation)
    在不同语言上不同（Zhao et al. 2019 的核心结论）。 在 MoE 架构上，不同语言激活不同 expert 子集，representation
    space 的拓扑结构完全不同—— MMD 在低维投影空间上的匹配无法 capture 这种高维结构差异。 β sweep 跨 3 OOM 但 delta
    AUROC 始终在 noise level（±0.005），因为 MMD loss 的梯度信号太弱（1-D logit，bandwidth 由 median
    heuristic 决定，在接近正态的分布上 几乎所有 bandwidth 都给出相似的 gradient）。低资源语言上 CaCLR 甚至略微 hurt（-0.008），
    因为 MMD penalty 迫使 probe 偏离英语最优解但又无法真正对齐目标语言。 Linear projection（50 pairs）在 14/19
    语言上赢过 CaCLR，因为它直接学习子空间旋转 而不是间接匹配分布。但 linear projection 本身在低资源上不稳定（seed variance
    高）。

    '

  - 'Fig 5: β sweep curve (x=log β, y=Δ AUROC) with 95% CI——flat line 在零附近，所有 CI 跨零。'
  - 'Fig 6: 5-method transfer comparison grouped bar chart (high/mid/low resource)——CaCLR
    与 zero-shot 不可区分，linear projection 和 few-shot 逐步改善。'
  - 'Fig 7: Per-language CaCLR Δ AUROC scatter (x=resource tier proxy, y=delta)——低资源侧系统性偏负。'
  analysis: 'CaCLR 的 consistency loss 完全 inert。β sweep 跨 3 个数量级（0.001→1.0）， 平均 Δ AUROC
    从未超过 noise level（+0.002 ± 0.007）。配对置换检验 p 值全部 >0.4。 Component ablation 确认：SB-ECE
    提供微弱 ECE 改善（-0.002），MMD 提供微弱 AUROC 改善（+0.002）， 但两者无协同效应，且均在 noise 范围内。核心 negative
    result：MMD-based distributional matching 对 correctness probe transfer 无效——与 Zhao
    et al. (2019) 理论预测一致（边缘匹配在条件分布不同时失效）。 Linear projection（50 pairs）作为最强 zero-label
    替代方案，但在低资源语言上也不稳定。 Few-shot 25/100 是唯一 consistently 有效的路径——支持 "constructive path
    forward" 叙事。

    '

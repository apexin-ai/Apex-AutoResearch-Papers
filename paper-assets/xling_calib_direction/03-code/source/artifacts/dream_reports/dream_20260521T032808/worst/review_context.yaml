  result_rationale: '235B MoE 架构有 94 层但仅 22B 激活参数——expert routing 机制将 correctness
    信息分散到不同 expert 子网络中， probe 在 shared representation 上只能捕获部分信号，因此 AUROC 相比 7B dense（0.754）提升极有限（→0.76）。
    MoE 的 expert 选择是 input-dependent 的，不同语言激活不同 expert 子集，导致跨语言激活空间异质性更高。 这直接破坏了 Pareto
    frontier 的一致性：不同语言的 "最优 transfer 层" 受 expert routing pattern 影响而高度分散， global rho
    被拉向零。高资源语言（zh/es/fr）与英语共享更多 expert 激活模式，仍显示弱 Pareto； 低资源语言与英语 expert overlap 极低，transfer
    AUROC 在深层反而因 expert divergence 而改善（正 rho）。 Linear projection 在低资源上不稳定，因为 50 parallel
    pairs 不足以学习 MoE 碎片化空间的旋转矩阵。


  result_rationale: 'Linear projection 在 worst tier 下表现不稳定，核心原因是 MoE 架构的高维异质性。 50
    parallel pairs 学习的 rotation matrix 有效自由度为 min(50, d)=50 远小于 d=4096， 只能 capture
    低秩近似。在高资源语言上这足够了（correctness subspace 旋转 angle 小， 低秩近似够用），但低资源语言 angle 大（45-58°）且
    variance 高，50 pairs 不足以 稳定估计旋转矩阵。200 pairs 改善了稳定性但 delta 仍然只有 +0.028 avg—— 说明瓶颈不只是
    estimation noise，而是 correctness direction 在低资源上可能不存在  clean linear correspondence（capacity
    artifact 问题，见 plan_013）。 Low resource 上 10-50 pairs 的 delta 可以是负的（-0.005 at 50
    pairs）， 说明 learned projection 比 identity map（zero-shot）更差——投影 noise 比不投影更有害。


    result_rationale: 'CKA pooled correlation (r=0.52, p<0.001) 看起来 strong 但有严重 depth
      confound：deeper layers simultaneously have lower CKA AND lower transfer AUROC，所以
      correlation 大部分来自 shared depth effect。

      Partial correlation controlling normalized depth 是 THE critical test （Dream
      RD2, 3-tier consensus）：r=0.18, p=0.11。这意味着 CKA 在 控制 depth 后几乎没有额外 explanatory
      power。Depth alone explains most of the variance in both CKA and transfer AUROC。这直接导致
      CKA 从 "geometric analysis" 降级为 "suggestive correlational analysis"。

      BUT between-language correlation 成立：在同一 depth，语言间 CKA 与 transfer 的 correlation
      r=0.52, p=0.02 (n=19)。这说明 "languages with higher CKA transfer better" 是 valid
      between-language claim，只是不能说 "CKA predicts within-language depth degradation"。

      Per-language Spearman 只有 40% significant（Qwen n=24 较好， Llama n=12 power 不足），与
      pilot 一致。

      Subspace angle analysis provides quantitative geometric evidence： correctness
      subspace angle increases from 15° (shallow) to 38° (deep)， 远小于 random baseline
      72°，证实 correctness direction 作为 low-dimensional subspace feature 存在但 rotation
      随 depth 增加。

      CKA cliff steepness 差异（Qwen 0.15 at 72% vs Llama 0.08 at 65%） qualitatively
      explains Pareto strength difference：Qwen 在更深处 有更 abrupt 的 CKA drop，对应更 uniform
      的 negative transfer trend。


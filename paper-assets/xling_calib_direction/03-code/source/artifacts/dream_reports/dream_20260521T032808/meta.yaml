        CKA-transfer r。Columns: r, R², p, interpretation。 Demonstrates that partial
        r=0.18 (p=0.11) → CKA is suggestive only, but between-language r=0.52 (p=0.02)
        → valid between-language claim。

        '
    - name: 'Table 13: Subspace Angle Analysis'
      description: 'Depth bins (rows) × statistics (columns: median angle, IQR, random
        baseline)。Both models。Shows correctness subspace rotation increases with depth
        but remains far from random。 Quantitative support for geometric narrative。

        '
    figures_description:
    - 'CKA × transfer scatter with depth as confound: three panels。 (Left) CKA vs
      transfer AUROC, pooled, r=0.52 — looks impressive。 (Center) Same scatter but
      color = normalized depth — reveals that depth drives both axes。 (Right) Residualized
      CKA vs residualized transfer (after removing depth effect) — weak relationship,
      r=0.18, the honest picture。

      '
    - 'Between-language CKA-transfer scatter at 50% depth: each point = one language。r=0.52,
      p=0.02。This IS the valid claim。 Labels on outliers (sw low CKA + low transfer,
      zh high CKA + high transfer)。

      '
    - 'Subspace angle vs depth: line plots for 3 representative languages with shaded
      band for full 19-language range。Random baseline as horizontal reference at 72°。Increasing
      trend confirms geometric rotation hypothesis。

      '
    analysis: 'CKA analysis 降级为 "suggestive correlational analysis" 基于 partial correlation
      result (r=0.18, p=0.11)。Paper 必须明确承认 depth confound 并 present partial correlation
      as the honest test。

      Salvageable claims: (1) Between-language: "languages with higher CKA show less
      transfer degradation at matched depth" (r=0.52, p=0.02) — valid (2) Qualitative:
      CKA cliff steepness differs across architectures, consistent with Pareto strength
      difference — suggestive (3) Subspace angle: correctness direction rotation increases
      with depth (15° → 38°) — quantitative geometric evidence

      NOT supportable: "CKA explains why transfer degrades with depth" (depth itself
      explains this; CKA adds marginal information)。

      For the CaCLR negative result narrative: CKA analysis provides suggestive geometric
      context (rotation not distributional shift) but the argument must lean more
      on Zhao et al. (2019) theory than on CKA empirics。


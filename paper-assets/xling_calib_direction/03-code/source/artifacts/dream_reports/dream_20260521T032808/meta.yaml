      负相关（Llama rho=-0.52 p=0.001）主要被 depth confound 驱动： 深层 CKA 低 + 深层 transfer 差，但这不是因为
      "CKA 低导致 transfer 差"， 而是 "depth 同时驱动两者"。控制 depth 后 CKA 的独立解释力归零。 Pooled correlation
      仍显著（p<0.01），但这是 Simpson''s paradox 的变体—— between-language 差异（高资源 CKA 高 + degradation
      低 vs 低资源反之） 和 within-language depth 效应混淆。Same-layer 分析（n=19 per layer）部分有效：

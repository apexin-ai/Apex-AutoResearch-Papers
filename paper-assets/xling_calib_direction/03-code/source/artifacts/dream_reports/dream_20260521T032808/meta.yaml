      - sw@Scout
      - bn@Scout
      - te@Qwen
      - sw@Qwen
      - bn@Qwen
      - te@Scout
    result_rationale: 'Miao & Ungar (2026) 在英语 7-8B 上报告 cosine<0.04（近乎正交）。 在大模型 MoE
      + 多语言设置下正交性部分退化，原因： (1) MoE expert 内部空间维度有效降低——当 correctness 和 confidence 信号都被
      route 到 少量共享 expert 时，方向会更 "拥挤"，cosine 从零偏移； (2) 低资源语言的 confidence direction
      本身就 noisy（模型在低资源上的 verbalized confidence 更随机，probe 拟合的方向不稳定），noise 方向与 correctness

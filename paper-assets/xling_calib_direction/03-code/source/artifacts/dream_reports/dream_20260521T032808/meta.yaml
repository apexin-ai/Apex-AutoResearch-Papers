    result_rationale: 'β (MMD consistency loss) inert 的根本原因：MMD 基于 kernel-space 的
      distributional moment matching，优化 P(f(x_en)) ≈ P(f(x_tgt)) 其中 f 是 probe logit（1-D
      scalar）。但跨语言 correctness 信号的 misalignment 不是 distributional shift（mean/variance
      不同），而是 geometric rotation ——correctness direction 在不同语言的 activation space 中指向不同方向。
      MMD 在 1-D probe output space 中无法 capture 这种 rotation，因为 rotation 发生在高维 activation
      space 中、在 probe 之前。

      具体机制：(a) β=0.001-0.01 时 MMD gradient 太弱影响不了 probe weights； (b) β=0.03-0.1 时
      MMD 推动 marginal distribution alignment 但这对 1-D logit 意味着 match mean + variance，不
      address correctness direction rotation；(c) β=0.3-1.0 时 MMD 主导 loss 导致 probe
      退化——为了 match distributions 牺牲 discriminative power。Cohen''s d=0.07 < 0.2（negligible
      effect size）。

      α (SB-ECE) 项有效但贡献有限：ECE 从 0.175 降到 0.125（smooth-binned calibration regularization），但对
      AUROC 的影响仅 +0.004pp。这是因为 SB-ECE 不改变 ranking，只改变 calibration curve shape。

      Linear projection 成功（+3.5pp）恰好证实 geometric explanation： it directly estimates
      the rotation matrix via parallel pairs，这是 MMD mathematically cannot do 的事情。Method
      ranking consistent across 两个架构，证明这不是 architecture-specific artifact。

      Zhao et al. (2019) 的预测成立：当 conditional distributions P(Y|X) across domains 不同时（correctness
      label 分布 language-dependent）， marginal distribution matching 不保证 label prediction
      改善。

      '
    tables:
    - name: 'Table 5: β Sweep — ΔAUROC over α-only Baseline'
      description: 'β values (rows: 0, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0) ×
        summary stats (columns: median ΔAUROC, mean, std, # langs improved, paired
        permutation p, Cohen''s d)。Both models side-by-side。 Key: NO β achieves p
        < 0.05 or d > 0.2。 Shaded gray: β = 0 row (reference)。

        '
    - name: 'Table 6: Transfer Method Comparison — Full Ranking'
      description: '7 methods (rows) × 2 models × 2 fixed layers。 Columns: AUROC,
        ΔAUROC vs ZS, bootstrap 95% CI, p-value, Cohen''s d。 Clear visual separation:
        linear-proj/few-shot cluster significantly above zero-shot; CaCLR-full/CaCLR-α-only
        marginally above; mean-shift identical to zero-shot。

        '
    - name: 'Table 7: Component Ablation'
      description: '4 configurations (BCE-only, +α, +β, +α+β) × AUROC, ECE, ΔAUROC。
        Demonstrates α contributes ECE reduction, β contributes nothing。 Clean decomposition
        of CaCLR components。

        '
    figures_description:
    - 'β sensitivity heatmap: x = log(β), y = 20 languages sorted by resource tier。Color
      = ΔAUROC over α-only。Near-uniform white/gray across entire grid。No sweet spot
      visible。Title: "MMD consistency loss inert across 3 orders of magnitude and
      20 languages"。

      '
    - 'Method ranking forest plot: 7 methods as rows, median ΔAUROC vs zero-shot with
      bootstrap 95% CI。Clear gap between linear-proj/few-shot cluster and CaCLR/zero-shot
      cluster。 CaCLR CI overlaps with zero-shot → not distinguishable。

      '
    - 'Component ablation bar chart: 4 bars (BCE, +α, +β, +α+β)。 AUROC 几乎 flat; ECE
      只有 +α 的 bars 明显降低。 Visual proof that β is the inert component。

      '
    analysis: 'CaCLR β inertness 是 paper 的 centerpiece negative result。论证三步： (1) Empirically:
      β across 3 OOM, d=0.07, p=0.38, both architectures; (2) Theoretically: Zhao
      et al. (2019) predicts MMD failure when P(Y|X) differs across domains; (3) Constructively:
      linear projection succeeds (+3.5pp) because it addresses the actual misalignment
      type (geometric rotation)。

      这关闭了 MMD distributional matching 这条路。Paper framing: "CaCLR is the natural baseline
      testing whether distributional matching works; the systematic negative result
      + geometric explanation saves the community from pursuing this path." CaCLR
      不是 novel method contribution，而是 systematic test of an obvious-seeming approach。

      Positive takeaway: α-only CaCLR（即 SB-ECE regularized probes） provides marginal
      ECE improvement，可作为 calibration regularizer standalone recommendation。

      '

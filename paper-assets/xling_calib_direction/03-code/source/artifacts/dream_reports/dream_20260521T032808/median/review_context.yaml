  result_rationale: 'β (MMD consistency loss) inert 的根本原因：MMD 基于 kernel-space 的 distributional
    moment matching，优化 P(f(x_en)) ≈ P(f(x_tgt)) 其中 f 是 probe logit（1-D scalar）。但跨语言
    correctness 信号的 misalignment 不是 distributional shift（mean/variance 不同），而是 geometric
    rotation ——correctness direction 在不同语言的 activation space 中指向不同方向。 MMD 在 1-D probe
    output space 中无法 capture 这种 rotation，因为 rotation 发生在高维 activation space 中、在 probe
    之前。

    具体机制：(a) β=0.001-0.01 时 MMD gradient 太弱影响不了 probe weights； (b) β=0.03-0.1 时 MMD
    推动 marginal distribution alignment 但这对 1-D logit 意味着 match mean + variance，不 address
    correctness direction rotation；(c) β=0.3-1.0 时 MMD 主导 loss 导致 probe 退化——为了 match
    distributions 牺牲 discriminative power。Cohen''s d=0.07 < 0.2（negligible effect
    size）。

    α (SB-ECE) 项有效但贡献有限：ECE 从 0.175 降到 0.125（smooth-binned calibration regularization），但对
    AUROC 的影响仅 +0.004pp。这是因为 SB-ECE 不改变 ranking，只改变 calibration curve shape。

    Linear projection 成功（+3.5pp）恰好证实 geometric explanation： it directly estimates
    the rotation matrix via parallel pairs，这是 MMD mathematically cannot do 的事情。Method
    ranking consistent across 两个架构，证明这不是 architecture-specific artifact。

    Zhao et al. (2019) 的预测成立：当 conditional distributions P(Y|X) across domains 不同时（correctness
    label 分布 language-dependent）， marginal distribution matching 不保证 label prediction
    改善。

    '

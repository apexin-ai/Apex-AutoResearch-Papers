    pairs_to_exceed_caclr: 20
    high_resource_pairs_50_delta: 0.028
    mid_resource_pairs_50_delta: 0.038
    low_resource_pairs_50_delta: 0.045
  result_rationale: 'Linear projection 学习 rotation matrix mapping source → target
    language representation space。Sample complexity 低因为 correctness-relevant subspace
    is low-rank：虽然 full activation space is 4096+ dims，但 correctness signal 集中在 few
    dimensions， 所以 effective mapping dimension 很小。

    10 pairs: underdetermined but captures dominant rotation (+1.2pp)。 50 pairs: 90%
    of achievable improvement（major rotation axes identified）。 100+ pairs: diminishing
    returns（fine corrections of minor axes）。

    Knee at ~55-65 pairs consistent with cross-lingual alignment literature (MUSE/VecMap:
    50-100 bilingual dictionary entries suffice)。 Llama 略需更多 pairs（65 vs 55）因为其 MoE
    routing 引入更多 representation heterogeneity。

    Low-resource 语言 benefit MORE from linear projection (+4.5pp vs +2.8pp high-resource)
    因为它们的 geometric misalignment 更大 → more room for correction。

    Practical headline: "~50 parallel pairs + simple linear projection matches or
    exceeds CaCLR''s entire training pipeline, surpassing CaCLR at just ~20 pairs"。

    '
  tables:
  - name: 'Table 14: Linear Projection Sample Efficiency'
    description: 'Pair counts (rows: 10, 20, 50, 100, 200) × (median ΔAUROC, mean,
      std, min, max, % langs improved)。Both models。 Clear diminishing returns after
      50 pairs。

      '
  figures_description:
  - 'Learning curve: x = # parallel pairs (log scale), y = median ΔAUROC。Two curves
    (Qwen3, Llama4) with shaded ±1 std band。 Annotated knee point (~55-65)。Horizontal
    dashed line: CaCLR-full ΔAUROC → linear projection surpasses at ~20 pairs。This
    is one of the paper''s most compelling visuals。

    '
  analysis: 'Linear projection''s sample efficiency is the constructive complement
    to CaCLR''s negative result。The practical message is clear and actionable: ~50
    parallel pairs (trivially obtainable) provide a simple, effective, zero-target-label
    solution that outperforms distributional matching。

    The learning curve figure — showing linear projection surpassing CaCLR at 20 pairs
    — directly illustrates the cost-benefit argument。

    '

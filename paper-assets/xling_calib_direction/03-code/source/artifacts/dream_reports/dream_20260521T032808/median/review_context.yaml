    mid-depth (sw/bn/te 42% below).

    Shallow-layer low selectivity is expected and benign — paper doesn''t claim correctness
    signal at shallow layers. But low-resource mid-depth artifacts are a genuine concern:
    probes with selectivity < 0.05 may reflect capacity memorization rather than correctness
    signal。 This means ~42% of low-resource lang-layer combinations should be interpreted
    with caution。

    Paper framing: this is itself a methodological contribution。 "~27% of cross-lingual
    probing results in our setting are capacity artifacts. We recommend selectivity
    ≥ 0.05 as minimum threshold for cross-lingual probe interpretability, especially
    for low-resource languages." This warning generalizes beyond our specific paper
    to any cross-lingual probing study。

    Control AUROC near 0.50 confirms LogReg has negligible capacity to memorize random
    labels in high-dim space — any above-baseline performance reflects real signal。


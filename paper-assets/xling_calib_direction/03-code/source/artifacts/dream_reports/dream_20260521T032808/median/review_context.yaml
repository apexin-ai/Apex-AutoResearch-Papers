  analysis: 'Control task artifact finding 升级为独立贡献。The ~27% artifact rate challenges
    uncritical cross-lingual probing and provides actionable guidance (selectivity
    ≥ 0.05 threshold)。

    This is distinct from the paper''s other claims — it''s a methodological warning
    for the cross-lingual probing community, not specific to correctness or calibration。

    For the paper''s own claims: we exclude combos below threshold from statistical
    tests where feasible, and note the caveat for low-resource claims where exclusion
    isn''t feasible。

    '

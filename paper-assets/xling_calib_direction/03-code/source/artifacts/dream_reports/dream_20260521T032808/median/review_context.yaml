narrative_guidance: 'Discovery + principled negative result + practical recommendation
  三段叙事。 (1) Pareto frontier 在 Qwen3-235B 上清晰（rho ~ -0.50），在 Llama 4 Scout 上 language-specific（global
  rho ~ -0.12）：部分语言随 depth 改善（ar/ko/hi）， 部分退化（zh/sw），验证 architecture-dependent tradeoff
  shape。 (2) CaCLR β sweep 3 OOM 证明 MMD consistency loss inert（d=0.07, p=0.38）。 CKA
  几何分析提供 suggestive 解释——MMD matches marginals but not low-dim directional structure——但
  partial correlation controlling depth 仅 r=0.18, p=0.11，降级为 suggestive correlational
  analysis。Between-language correlation 成立（same-layer r=0.52, p<0.01）。 (3) Linear
  projection ~50 pairs 是实际方案（+3.5pp over zero-shot），surpasses CaCLR at ~20 pairs。
  Decomposition 定性成立（65% combos improved, d=0.25），orthogonality 跨语言持续 但 low-resource
  variance 增大（cosine max 0.11）。 Control task artifact warning 升级为独立贡献：~27% lang-layer
  combos selectivity < 0.05，集中在 low-resource + shallow layers。 Target: EACL borderline
  accept，以 discovery + systematic negative result 发表。

  '

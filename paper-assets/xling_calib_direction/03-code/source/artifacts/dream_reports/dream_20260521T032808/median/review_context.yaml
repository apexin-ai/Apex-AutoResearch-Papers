  result_rationale: 'Qwen3-235B-A22B 是 94 层 MoE 架构，显著深于 MVP 的 7B 模型。EN best AUROC
    从 MVP 的 0.754 提升到 0.80，因为更大模型编码更强的 correctness signal。 Peak 在 ~77% depth (L72)，与
    MVP pattern 一致——correctness 在 deep-but-not-final 层达到峰值。

    Pareto frontier 清晰（median per-lang rho = -0.48）因为：(a) 94 层提供足够 depth gradient
    让 language specialization 逐渐显现；(b) 所有 20 语言在更深层 的 transfer 都退化，只是退化速度不同。Low-resource
    语言（sw/bn/te）rho 更强 负（-0.55 ~ -0.58）因为它们的跨语言表征从一开始就弱，depth-induced specialization

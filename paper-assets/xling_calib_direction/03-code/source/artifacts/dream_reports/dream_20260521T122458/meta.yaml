    description: '48-layer MoE (W4A16, 17B×16E, top-2 routing), 12 probed layers (every
      4th: L0,L4,...,L44,L47), 20 languages, 5 transfer conditions。验证 MVP Llama-3.1-8B
      的 weaker/mixed tradeoff pattern 是否是 Llama 架构家族特征。

      '

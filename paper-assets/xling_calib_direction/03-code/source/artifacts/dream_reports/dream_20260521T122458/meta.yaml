    result_rationale: 'Llama 4 Scout 延续 MVP Llama-3.1-8B 的 weaker tradeoff 模式但在关键方面加强。
      Per-language Spearman median ρ=+0.72 高于 Qwen3 (0.62)，因为 Llama4 仅 48 层—— 更少的深层
      specialization 空间意味着 ZS AUROC 的下降区间更短（最后 ~20% 层）， 而上升区间（前 58% 层）主导了 overall
      correlation。19/20 languages 有 positive ρ （仅 yo negative）。

      Pareto tradeoff 仅 10/20 languages（vs Qwen3 15/20），且 ZS drop 仅 2.5pp （vs Qwen3
      3.8pp）。这与 MVP 一致（Llama-3.1-8B: 2/5 langs showed tradeoff, ar/ko 在深层反而改善）。归因于
      Meta 的 multilingual training recipe：Llama4 在 pretraining 中对中高资源语言的 cross-lingual
      alignment 更均匀，深层 language-specific routing 效应弱于 Qwen3。


    result_rationale: 'Qwen3-235B 的 22B active params 比 MVP Qwen2.5-7B 多 ~3×。Probing
      scaling 预期 EN AUROC 从 0.754 提升至 0.835：更大模型在 intermediate layers 编码更清晰的 correctness
      signal， 因为 pretraining loss 更低 → 内部 representations 对 factual accuracy 更 informative。

      Overall positive depth-transfer trend（median per-lang Spearman ρ=+0.62）因为更深层
      encode 更多 semantic content → 更好的 correctness discrimination，且 correctness direction
      的 cross-lingual alignment 在 shallow-to-mid layers 持续改善（CKA 在 0-50% depth 下降缓慢）。
      17/20 languages 有 positive ρ，3 个 negative 的（yo/te/sw）是 LOW-resource：这些语言在 Qwen3
      pretraining corpus 中占比极低（<0.1%），ZS AUROC 的 depth profile 呈倒 U 形 （peak 在 ~40%
      depth 而非 >50%），因为深层的 language-specific specialization 对这些语言 反而有害。

      Local Pareto tradeoff：从 ZS-optimal (L48, 51% depth) 到 EN-optimal (L68, 72% depth)，
      EN 增加 2pp（0.815→0.835）但 ZS 平均下降 3.8pp（0.775→0.737）。这一 tradeoff 在 15/20 languages
      上可观测（ZS-optimal ≠ EN-optimal，gap >1.5pp）。94 层深网络比 28 层 MVP 有 更大的 specialization
      空间，使 EN-optimal 与 ZS-optimal 之间的 depth gap 从 MVP 的 3 层 扩大至 20 层（22pp depth）。

      MoE routing 在深层产生 language-specific expert activation patterns，加速 CKA cliff
      下降，导致 Qwen3 的 Pareto tradeoff 比 Llama4/Gemma4 更 pronounced（15/20 vs 10-12/20）。

      Mean-shift ΔAUROC ≡ 0：StandardScaler + LR 下 mean-shift 对 AUROC 无影响（rank-invariant,
      MVP 中已数学证明并实验验证）。

      Linear projection (+1.8pp) 通过 Procrustes 捕获 correctness subspace 旋转。 CaCLR (+3.7pp)
      通过 end-to-end 优化超越 linear projection。 Few-shot-100 (+1.3pp) 在 full-scale 上弱于
      ZS 因为 100 个 labeled samples 对 14K train set 的 probe 参数贡献边际很小。

      '

      个 LOW-resource languages (yo/te/sw) 显示 negative/near-zero ρ， 因为这些语言的 correctness
      signal quality 在深层退化快于 probe discrimination 的提升。 CaCLR 在 ZS-optimal layer 提供
      +3.7pp，是所有 label-free methods 中最优。

      '
  - name: Full Pareto Frontier — Llama 4 Scout (MoE)

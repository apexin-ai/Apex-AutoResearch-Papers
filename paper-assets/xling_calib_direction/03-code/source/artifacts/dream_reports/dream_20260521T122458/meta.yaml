  - name: Difficulty-Controlled Ablation (Decomposition)
    plan_id: plan_004
    description: 'IRT difficulty probes (Ridge regression on human difficulty scores
      per Civelli et al.), project out difficulty direction, retrain correctness probes
      on residuals, evaluate transfer。10 languages (HIGH: zh/es/fr/de, MID: hi/ru/ko/tr,
      LOW: sw/bn) × 8 layers (20-90% depth) per model。Random-direction control included。

      '
    expected_results:
      difficulty_probe_r2_mean: 0.67
      difficulty_probe_r2_range:
      - 0.54
      - 0.76
      difficulty_var_explained_of_correctness_pct: 62
      capability_var_explained_pct: 38
      difficulty_transfer_degradation_share_pct: 14
      capability_transfer_degradation_share_pct: 86
      residual_en_auroc_drop_after_projection_pp: 4.2
      residual_zs_transfer_improvement_pp: 4.5
      capability_transfer_drop_by_depth:
        20pct: 0.5
        40pct: 2.2
        60pct: 5.0
        80pct: 8.8
      random_direction_control_delta_pp: -1.5
      langs_showing_clean_separation_of_10: 8
      prescriptive_accuracy_pct: 76
    result_rationale: 'IRT difficulty 是 language-agnostic property：hard questions
      are hard everywhere (Civelli et al. 已验证跨语言 difficulty 相关性 r>0.85)。Ridge regression
      captures this linearly (R²=0.67)。Difficulty 占 correctness variance 的 62% 但仅贡献
      14% 的 transfer degradation，因为 difficulty signal 本质是 universal 的——无论用 哪种语言的 representation，difficult
      items 的 activation patterns 都类似。

      Capability-specific residual 仅占 38% variance 但驱动 86% 的 transfer degradation，
      且 degradation 随 depth 指数增长（20%→80% depth: 0.5→8.8pp）。这解释了 Pareto frontier 的
      mechanistic origin：deep layers 的 EN probe improvement 主要来自 capability-specific
      component（language-dependent competence patterns），而这个 component 恰好最难 transfer。

      Projecting out difficulty 后 EN AUROC 下降 4.2pp（移除了 easy-hard distinction 信号），但
      ZS transfer 改善 4.5pp（关键发现：removing difficulty noise exposes the capability signal
      that''s harder to transfer but also more language-specific; the residual probe
      that''s trained purely on capability actually transfers BETTER on average because
      it''s forced to find the language-agnostic component of capability）。 Within
      [3, 6]pp key metric range。

      8/10 languages 显示 clean separation（difficulty component clearly universal, capability
      component clearly language-specific）。2 个 exceptions (sw, bn) 因 LOW-resource
      translation quality 使 difficulty labels 本身有 noise。

      Random-direction control (-1.5pp) 确认 difficulty projection 是 genuine 的， 不是 dimensionality
      reduction artifact。

      Prescriptive accuracy 76%：给定 difficulty/capability ratio at each language-layer,
      预测最优策略 (zero-shot for difficulty-dominant vs CaCLR for capability-dominant)
      在 76% 的 cases 中正确。

      '

    **Coverage**: 13/13 experiments reported. 8/13 have dedicated tables. 5/13 are
    text-only summaries in §6, which is adequate for a 10-page paper but some key
    data (especially Procrustes reversal and quantization) would benefit from appendix
    tables.


    ---


    ## Overall Assessment


    This is a strong empirical contribution that opens a new research direction: systematic
    study of cross-lingual correctness probe transfer. The four-claim narrative is
    well-structured, the experimental breadth (3 architectures, 20 languages, 5 conditions)
    is impressive, and the findings — particularly the Simpson''s Paradox in CKA–transfer
    geometry and the 10% cross-lingual artifact rate — are genuinely novel and useful
    for the field. CaCLR is a practical method contribution with consistent improvements
    across architectures and benchmarks.



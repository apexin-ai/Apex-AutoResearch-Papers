    result_rationale: 'CaCLR 的 consistency loss (β·MMD) 强制 probe 学习 language-invariant
      features。

      β sweep 的 inverted-U 形状源于 regularization dynamics：β=0.001 时 MMD gradient 太弱（被
      BCE gradient noise 淹没），β=1.0 时 MMD 主导优化（probe 牺牲 accuracy 来匹配 distributions，EN
      AUROC 下降 ~1.5pp）。Optimal β=0.05 平衡两者—— consistency gradient 足够影响 probe direction
      但不主导。

      Deep-layer improvement (+4.5pp) 远大于 shallow (+1.2pp) 因为：deep layers 的 capability-specific
      component 更大（Claim 2 decomposition），CaCLR 的 consistency loss 恰好 target 这个 component。Shallow
      layers 的 transfer 本身就好（difficulty- dominant），CaCLR 提供的边际改善有限。

      14/20 languages improved (10-16 range 内)：6 个 non-improving 主要是 HIGH-resource
      (zh/es/fr/de) 在 shallow/mid layers 已接近 ceiling，CaCLR 的 distributional matching
      在 already-aligned distributions 上无显著增益。1 个 hurt (yo) 因为 parallel activations
      质量太差（translation artifacts in GlobalMMLU Yoruba），MMD matching 反而引入 noise。

      High-dim MMD (PCA-50) 优于 1-D (+4.2pp vs +3.3pp)：50-D space 捕获了更多 distributional
      structure（不只 mean/variance，还有 covariance patterns）。但 PCA-100 略退（+3.8pp），curse
      of dimensionality 开始影响 MMD estimation。 这表明 optimal dimensionality 在 d~50，与 correctness
      subspace 的 effective rank 一致（~30-50 principal components capture 95% of probe-relevant
      variance）。

      CORAL (+2.8pp 1-D, +3.6pp PCA-50) 与 MMD 方向一致但 1-D 弱于 MMD（CORAL 匹配 second-order
      statistics，在 1-D 只有 variance matching，信息量不如 kernel-based MMD）。PCA-50 下 CORAL
      接近 MMD。这证实 distributional matching 一般性地 work， 非 MMD-specific。

      Component ablation：BCE alone (probe baseline) → +SB-ECE (+0.7pp, calibration
      focus) → +MMD (+2.5pp, consistency is the main contributor) → full CaCLR (+3.3pp,
      synergy between calibration and consistency)。

      ECE reduction 38% vs temperature scaling：CaCLR 在训练期间优化 calibration (SB-ECE)
      + cross-lingual consistency (MMD)，比 post-hoc temperature scaling 更 effective，因为
      temperature scaling 只缩放 logits（不改变 decision boundary） 而 CaCLR 修改了 probe 的 feature
      extraction direction。


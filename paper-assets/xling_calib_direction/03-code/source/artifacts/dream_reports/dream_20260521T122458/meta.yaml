      d=50/100) 也无效—— distributional matching 的失败不限于 MMD kernel 或操作维度，而是因为 Zhao et
      al. (2019) 的理论预测成立：P(correct|activation) 的 conditional structure 在不同语言间不同（language-specific
      capability component），marginal matching 无法修复 conditional mismatch。CKA subspace
      analysis 将提供几何证据：CaCLR 成功减小了 marginal distance 但 subspace angle 几乎不变（见 plan_011
      交叉分析）。 与此对照，linear projection 直接学习旋转矩阵，绕过 distributional matching 的局限。 Multi-seed
      结果稳定 (std ~0.002-0.005)，排除 single-seed artifact 的可能。

      '

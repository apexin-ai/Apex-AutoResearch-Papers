    analysis: 'Qwen3-235B 展现 strong, consistent positive depth-transfer trend（global
      ρ=+0.68, p=0.0003）和 pronounced local Pareto tradeoff（15/20 langs）。EN-optimal
      (L68) 与 ZS-optimal (L48) 相距 20 层，远大于 MVP 的 3 层，确认 tradeoff 在大模型上放大。 14/20 languages

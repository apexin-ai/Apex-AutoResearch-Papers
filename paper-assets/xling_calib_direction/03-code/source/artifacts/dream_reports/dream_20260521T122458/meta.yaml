    result_rationale: 'Simpson''s Paradox 的 causal mechanism：depth 同时作用于 CKA（deeper
      → representations diverge → CKA drops）和 ZS AUROC（deeper → EN probe更强 → higher
      absolute AUROC up to mid-depth），创造了 depth confound。Raw pooled correlation 为负：shallow
      layers 有 high CKA 但 low AUROC（probe 本身弱），deep layers 有 low CKA 但 moderate/declining
      AUROC。控制 depth 后，within 每个 layer，higher CKA 的语言确实有 better transfer， partial
      ρ 为正。

      MVP pilot（Llama, 5 langs × 9 layers）已展现 ρ=+0.41, p=0.006。Full-scale（20 langs
      × 12-24 layers per arch）增强统计 power：per-layer test 从 n=5 增至 n=20。 MVP Qwen pilot
      仅 ρ=+0.18 (p=0.274)，full-scale 上升至 +0.48 因为：(1) n 从 5 增至 20 语言，power 大幅提升；(2)
      20 语言覆盖更宽的 CKA 范围（增加了极低 CKA 的 yo/te 和高 CKA 的 nl/pt），扩大了 within-layer variance。

      Subspace angle analysis 提供 structural grounding：correctness direction 在同一 layer
      内跨语言仅旋转 ~13°（near-universal），但跨 layer 旋转 ~38°（significant drift）， vs random
      baseline ~87°。这解释了为何 within-layer CKA 预测 transfer（correctness direction 对齐良好）但
      raw pooled 不预测（depth confound 混淆了 correctness 与 non- correctness dimensions
      的 divergence）。

      CKA cliff threshold ~0.35 直接解释了 architecture-dependent tradeoff 差异：Qwen3 的 CKA
      cliff 更陡（deep-layer CKA 下降更快因为 MoE routing），导致更多语言在 deep layers 穿越 0.35 threshold
      → strong tradeoff。Llama4 cliff 较缓 → weak tradeoff。 Gemma4（dense）cliff 速率介于两者之间。

      '

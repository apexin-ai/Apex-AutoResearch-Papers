    result_rationale: 'CaCLR 的 MMD consistency loss 在 1-D probe logit 空间操作，这是根本的 architectural
      mismatch。 Correctness information 占据高维 activation 空间的 1-3 维子空间；MMD 只能匹配 logit
      的 marginal distribution (均值/方差)，无法检测或纠正 correctness direction 的旋转。 β=0.001-0.01
      时 consistency loss 太弱，等效于 pure BCE；β=0.1-1.0 时 loss 开始干扰 BCE 训练——强制匹配 marginal

      narrative_direction: 'Reframe as large-scale field-level viability test with
        strong negative conclusions. Drop Claim 2 (decomposition) and Claim 3 (CaCLR
        method) as standalone claims. New angle: ''We conducted the first large-scale
        study testing whether English-trained correctness probes transfer cross-lingually
        across 3 architectures × 20 languages. Core finding: probe transfer is fundamentally
        limited by architecture-specific representation geometry that existing alignment
        methods (mean-shift, MMD, CORAL, linear projection) cannot reliably overcome.
        Control task analysis reveals that a substantial fraction of apparent shallow-layer
        transfer is capacity artifact, not genuine correctness signal.'' Elevate the
        control task warning to a primary contribution (field-level methodological
        finding: all cross-lingual probing studies must include selectivity checks).
        Elevate the mean-shift impossibility proof (rank-invariance under StandardScaler
        + LR) as a clean theoretical contribution that clarifies confusion in the
        literature (Xiao et al.). Resource-tier analysis survives as descriptive empirical
        contribution. Linear projection''s inconsistency itself is a finding — ''geometric
        alignment helps iff baseline representations are moderately aligned (0.50-0.60
        AUROC), but the prediction of when this holds requires language-specific validation,
        undermining the zero-label promise.'' Still targets EACL: negative results
        with scale (3 architectures × 20 langs), methodological contributions (control
        tasks, mean-shift proof), and constructive path-forward (few-shot 25-100 labels
        is the minimum viable approach).'

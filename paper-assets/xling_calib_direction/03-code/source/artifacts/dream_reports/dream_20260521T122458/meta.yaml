    result_rationale: 'Simpson''s Paradox 的架构依赖性源于 CKA-depth gradient 的函数形状。 Llama4
      CKA 从 peak 0.83 (L12) 线性下降到 0.20 (L48)——steep linear slope 使得 linear partial
      correlation 高效地分离 depth confound (partial rho=0.31, p=0.012)。 Gemma4 CKA 也近似线性下降

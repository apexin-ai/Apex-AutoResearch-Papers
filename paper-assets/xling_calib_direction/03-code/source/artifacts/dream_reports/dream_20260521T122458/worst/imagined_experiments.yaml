- name: CKA Cross-Lingual Representation Similarity Analysis
  plan_id: plan_011
  description: 'CKA (linear kernel) EN vs target, all probed layers, 20 langs × 3
    models. Simpson''s Paradox full-scale validation. Partial correlation controlling
    for depth. Same-layer cross-language analysis. Subspace angle analysis.

    '
  expected_results:
    simpson_paradox_confirmed_of_3_arch: 0
    partial_correlations:
      qwen3:
        rho: 0.11
        p: 0.28
        bootstrap_ci:
        - -0.08
        - 0.29
      llama4:
        rho: 0.06
        p: 0.45
        bootstrap_ci:
        - -0.12
        - 0.24
      gemma4:
        rho: 0.16
        p: 0.09
        bootstrap_ci:
        - -0.02
        - 0.33
    raw_correlations:
      qwen3:
        rho: -0.32
        p: <0.001
      llama4:
        rho: -0.38
        p: <0.001
      gemma4:
        rho: -0.29
        p: <0.001
    same_layer_cross_lang_analysis:
      qwen3_significant_layers: 2/24
      llama4_significant_layers: 0/12
      gemma4_significant_layers: 1/16
      median_rho: 0.14
    subspace_angle:
      high_tier_range_deg:
      - 15
      - 38
      mid_tier_range_deg:
      - 28
      - 52
      low_tier_range_deg:
      - 42
      - 65
      consistency_across_layers: low — within-language angle std 8-15° across layers
    pilot_replication:
      llama_pilot_rho: 0.41
      llama_fullscale_rho: 0.06
      verdict: pilot artifact confirmed
  result_rationale: '这是 worst tier 的 defining falsification。

    5 语言 pilot 的 Simpson''s Paradox 被 20 语言全量数据否定：

    (1) Llama partial rho 从 +0.41 (p=0.006) 骤降至 +0.06 (p=0.45)。原因：pilot 的 5 语言 恰好
    overrepresented CKA-transfer 相关性最强的语言（zh, ar 有高 CKA + 低 degradation）， 排除了关系最弱的语言。15
    种新增语言中 MID/LOW tier 的 CKA 模式与 pilot 语言截然不同—— 这些语言的 CKA 虽然也随 depth 下降，但下降斜率和 transfer
    degradation 之间没有一致的 within-layer 关系。

    (2) Qwen3 rho=+0.11 (p=0.28) 在 pilot 就不显著（+0.18, p=0.274），全量数据只是确认。 Gemma4 rho=+0.16
    (p=0.09) 是最接近显著的，但 bootstrap CI 跨零（[-0.02, 0.33]）， 不能依赖。

    (3) Same-layer cross-language analysis（n=20 per layer，最强检验）：median rho=0.14， 仅
    3/52 层 significant——CKA 在 within-layer 水平几乎无预测力。在同一层中，不同语言 的 CKA 差异巨大但 transfer
    AUROC 差异不 track CKA。

    (4) Subspace angle analysis 否定 "correctness direction is a robust language-agnostic
    subspace"：HIGH tier 15-38°（不是近乎平行），LOW tier 42-65°（近乎 orthogonal）。 Angle 在同一语言的不同层之间也有
    8-15° 的标准差——correctness direction 不仅跨语言 不一致，在同一语言内也随 depth 漂移。

    结论：CKA 不提供超越 depth 的解释力。从 "geometric analysis" 降级为 "suggestive correlation"——仅保留
    CKA heatmap 作为 descriptive visualization。

    '

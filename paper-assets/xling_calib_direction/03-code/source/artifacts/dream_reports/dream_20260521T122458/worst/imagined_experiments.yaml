tier: worst
narrative_guidance: '7-8B pilot 的核心模式不推广到全量模型。两个 MoE 架构（Qwen3-235B, Llama 4 Scout）完全没有清晰的
  Pareto frontier——MoE expert routing 打破了 dense model 中 depth→specialization 的单调映射，
  depth-transfer 关系在绝大多数语言为 non-monotonic 或 flat。唯一的 dense 架构（Gemma 4 31B）展现出 marginal
  Pareto（global rho=-0.24, p=0.038），但仅 4/20 语言 per-language 显著，且 final-layer transfer
  drop 微不足道（0.8pp），远不及 pilot 的 2-4pp。三架构平均 EN AUROC 0.74，处于 worst 范围中段。

  Simpson''s Paradox 在 20 语言全量验证中全面崩塌：3 架构的 CKA partial correlation controlling for
  depth 均不显著（max rho=+0.16, min p=0.09），Llama pilot 的 rho=+0.41 被确认为 5 语言 small-sample
  artifact。CKA 提供不了超越 depth 的解释力。Subspace angle analysis 否定了 "correctness direction
  is a robust language-agnostic subspace"——HIGH tier 语言 angle 15-38°，LOW tier 45-65°。

  CaCLR 全面失败：β sweep 3 OOM 证实 consistency loss inert 或 harmful；CORAL 和 high-dim MMD
  (PCA d=50/100) 同样失败，将 negative result 从 "MMD-specific" 扩展为 "distributional matching
  路径全面 关闭"。Component ablation 每加一项 loss 都 net negative。

  Decomposition 无实质效果，random-direction control 产生同量级 delta（paired test p=0.38）， difficulty
  和 capability 不可分。

  Control task analysis 是最强贡献：cross-lingual artifact rate 达 35%（LOW 42%，MID 31%，HIGH
  15%）， 首次在跨语言 probing 场景系统性应用 selectivity 检验。Selectivity 与 ZS AUROC 强相关（rho=0.65），
  暗示文献中许多 positive transfer 结果可能是 capacity artifacts。

  Linear projection 作为唯一可行方案但需 100+ pairs（非 50），且效果反转阈值 language-specific， 无法给出单一可操作的
  cutoff。

  重构为 EACL negative results + methodology paper：(1) control task 方法论警告（field-level
  贡献）， (2) mean-shift 不可能性证明（理论贡献），(3) distributional matching 路径全面关闭（CaCLR + CORAL
  + high-dim MMD 系统性 negative result），(4) linear projection 条件性实用指导（descriptive empirical
  贡献）。Drop Claim 2（decomposition）和 Claim 3（CaCLR method）作为 standalone claims。

  '

  result_rationale: 'CaCLR 失败的根本原因链：

    (1) 1-D MMD 结构性限制：probe logit 是标量，MMD 只能 match 两个 1-D 分布的 marginal。 即使 marginal
    被 match，EN 和 target 的 conditional distributions P(logit|correct) vs P(logit|incorrect)
    仍然不同——Zhao et al. (2019) 的理论预测在此得到验证。β 越大，logits 被拉向无区分性的 marginal match，discrimination
    下降。

    (2) High-dim MMD (PCA d=50/100) 同样失败：curse of dimensionality 使得 Gaussian RBF kernel
    在 50-100 维空间的 MMD estimate 方差极大，有效样本量不足（probe_train ~2000 samples 对 100 维 MMD
    来说 severely underpowered）。d=100 比 d=50 更差，证实这一解释。

    (3) CORAL 也失败：second-order alignment（match mean + covariance）比 MMD 更受 conditional
    distribution mismatch 的影响——对齐 marginal moments 不能修复 correctness signal 的 conditional
    structure 差异。CORAL 在 domain adaptation 中成功的条件是 covariate shift （P(X) changes,
    P(Y|X) stable），但 cross-lingual correctness probing 违反这一条件 （P(correct|representation)
    在不同语言中不同）。

    (4) Component ablation 证实每个额外 loss 都是 net negative：BCE-only retrain ≈ ZS baseline（LR
    solution 初始化后 Adam 微调不改变 optimum），每加一项都引入额外 noise 而 无 signal。CaCLR 不是超参选择问题而是方法论层面的失败。

    (5) Multi-seed 结果稳定（std=0.003），排除了 single-seed 偶然性。Mixed β criterion 排除了 β selection
    对 cross-lingual benefit 的系统性偏见。

    综合：distributional matching 路径（MMD + CORAL，low-dim + high-dim）被全面关闭。 Linear projection
    和 few-shot 显著优于 CaCLR，因为它们直接利用 target-language 结构 信息而非试图间接 match distributions。


    - 'yo: selectivity 0.005 at EN-opt layer'
    - 'my: selectivity 0.006 at EN-opt layer'
    - 'sw: selectivity 0.008 at EN-opt layer'
    mid_resource_surprise:
      tr:
        selectivity_at_enopt: 0.031
      th:
        selectivity_at_enopt: 0.028
      vi:
        selectivity_at_enopt: 0.042
  result_rationale: 'Cross-lingual artifact rate 35% (overall) 是 worst tier 最强贡献。

    LOW tier 42% artifact rate 的原因：am, yo, my, te 等语言在 LLM pretraining 中 极度不足（估计 <
    0.1% token share），这些语言的 representation 缺乏区分性结构—— probe 学到的主要是 capacity artifacts（随机
    label 也能达到类似 AUROC）。 Selectivity = real_AUROC - permuted_AUROC 对这些语言仅 0.004-0.008，
    几乎等于 zero information content。

    MID tier 31% artifact rate 是 worst tier 的 signature finding：不仅低资源有问题—— tr (0.031),
    th (0.028), vi (0.042) 等中资源语言在 shallow/mid layers 也有大量 artifacts。原因：这些语言虽然 pretraining
    充足，但 correctness-specific signal （区分 "模型答对/答错"）在 representation 中的编码弱于语言 identity
    signal， probe 部分地拟合了 language-specific capacity pattern 而非 correctness。

    HIGH tier 15% artifact rate 主要出现在 shallow layers（0-30% depth）， 与 plan_013 completed
    results 一致（L0-L16 selectivity < 0.12）。

    Selectivity 与 ZS AUROC 的 rho=0.65 是最尖锐的发现：暗示 cross-lingual probing 文献中许多 "positive
    transfer" 结果可能是 artifacts——高 ZS AUROC 可能部分反映 capacity artifacts 而非 genuine correctness
    signal transfer。

    首次在 cross-lingual transfer 场景系统性应用 Hewitt & Liang selectivity—— 发现 artifact 问题远比
    monolingual probing 严重。Field-level implication。

    '

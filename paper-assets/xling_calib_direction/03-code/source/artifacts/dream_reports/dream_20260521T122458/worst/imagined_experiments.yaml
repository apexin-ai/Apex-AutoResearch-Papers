  result_rationale: 'Decomposition 在 worst tier 无实质效果，两个层面的失败：

    (1) Difficulty direction 在 LLM representation 中编码不够 linear/集中——IRT difficulty
    probe R²=0.28（低），意味着 linear projection 只捕获了 difficulty variance 的 28%。 剩余 72%
    的 difficulty 信息分布在 correctness direction 也占据的子空间中——两者高度 纠缠，projecting out 28%
    的 difficulty 同时损坏了部分 correctness signal。

    (2) Random-direction control 产生同量级效果（paired test p=0.38），这是 worst tier 的 killer
    finding：观察到的微小 delta 主要来自 dimensionality reduction 效应 （投影去除任意方向都会改变 probe 性能 ≈
    同量级），而非 difficulty-specific 信号去除。

    2/10 语言 "clean separation"（zh, ko）可能是 type-I error 在 10 次检验中的自然出现率。 LOW tier 3
    语言全部 negative delta——它们的 difficulty 和 capability 信号本身就很弱， 投影去除任何方向只会损失信息。

    结论：transfer degradation 不能分解为 difficulty-shared + capability-specific 两个可操作的 component——Claim

    layers. MID-resource red patches at moderate depths are the surprise finding.

    '
  - 'Figure 8b: Selectivity vs ZS AUROC scatter across all language-layer-model combinations.
    Strong positive correlation (ρ=0.65). Annotation: "Many ''successful'' transfer
    results fall in the low-selectivity region."

    '
  - 'Figure 8c: Artifact rate by resource tier with bootstrap 95% CI. MID tier CI
    overlaps substantially with LOW tier — the problem is not confined to low-resource
    languages.

    '
  analysis: 'Control task finding 是 worst tier paper 的 anchor contribution。>35% artifact
    rate 波及中资源语言是 field-level 发现：所有跨语言 probing 研究——包括只看中/高资源的—— 都需要 selectivity 检验。Selectivity-AUROC
    correlation (ρ=0.65) 暗示文献中许多 positive results 可能是 artifacts。首次系统性应用 Hewitt & Liang
    到 cross-lingual 场景——这个贡献独立于本文其他所有 claims，即使其他全部失败仍足以支撑 EACL findings paper。

    '

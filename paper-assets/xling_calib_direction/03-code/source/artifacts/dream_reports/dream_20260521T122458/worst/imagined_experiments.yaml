  result_rationale: 'EN best AUROC 0.741 在 worst 范围 [0.72, 0.78] 内——Qwen3-235B 的 22B
    active parameters 对 correctness signal 的编码不显著优于 7B pilot（0.754），因为 correctness
    direction 的信号 强度主要由 pretraining data 质量和 MCQA 格式暴露量决定，而非模型 scale。INT4 量化引入 ~1pp
    额外损耗。

    ZS pass 11/20 (55%) 处于 worst 范围 [8, 13] 中段。MoE routing 导致不同语言被路由到 不同 expert 子集，correctness
    direction 的跨语言一致性被 expert 分化削弱：pilot 中 Qwen2.5-7B dense 架构的 4/5 pass 不能外推，因为 dense
    model 的 shared representation 天然更有利于 cross-lingual alignment。低资源语言（am, yo, my）的
    best ZS AUROC < 0.50，接近 random。

    Global Pareto rho=-0.12 (p=0.078) 仅 marginally significant：depth-transfer tradeoff
    在 MoE 中不成立，因为 expert routing 在不同深度可以 "重置" 语言特异性——L48 的 expert allocation 可能与 L72
    完全不同，打破了 "deeper = more specialized" 的 dense-model 假设。13/20 语言呈现 non-monotonic
    模式（U形、锯齿形、plateau），这是 MoE 的结构性特征而非噪声。仅 hi 达到 per-language significant negative
    rho（p=0.046），ko 和 ja 方向反转（deeper helps transfer）。

    Final-layer transfer drop 仅 0.6pp（worst 范围 [0.0, 1.5]），远低于 pilot 的 2-4pp—— 235B
    MoE 的最深层 expert routing 已经足够 specialized，EN probe 在这些层的 AUROC 提升本身就很小（L88 vs L72
    仅 +0.3pp EN AUROC），所以 transfer drop 也被压缩。

    Mean-shift ΔAUROC ≡ 0 符合已证明的 rank-invariance。Linear projection +3.6pp 和 few-shot
    100 +4.9pp 有中等改善，但 significant improvement 仅覆盖 55-65% 的语言。

    '

- name: Probing Control Tasks — Cross-Lingual Extension
  plan_id: plan_013
  description: 'Hewitt & Liang control tasks extended to 20 languages × all probed
    layers × 3 models. Selectivity analysis. Multiple selectivity thresholds (0.03,
    0.05, 0.10). (builds on completed plan_013 EN-only results)

    '

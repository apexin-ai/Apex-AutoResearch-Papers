narrative_guidance: 'Method contribution paper — 因果链完整：Pareto discovery（architecture-dependent
  depth-transferability tradeoff with overall positive depth-transfer trend）→ Decomposition
  explains it（difficulty transfers, capability does not）→ CaCLR solves it（consistency
  loss shifts Pareto frontier, +3.3pp mean, 14/20 languages improved）→ CKA geometric
  explanation reveals why（Simpson''s Paradox confirmed across 3 architectures, partial
  rho +0.44 mean, p<0.01）。四条 claim 全力度支撑。Headline: "CaCLR-trained correctness probes
  reduce non-English ECE by 38% requiring zero target-language labels." Control task
  warning（10% cross-lingual artifact rate） 和 linear projection sample efficiency（~40
  pairs to 95%）作为 elevated empirical contributions 进入 main body。Procrustes effect
  reversal（threshold ~0.52）为 practitioner 提供直接指导。 三个架构（Qwen3 MoE + Llama4 MoE + Gemma4
  Dense）消除架构混淆因子——phenomenon 是 transformer depth 的 universal property。Mean EN AUROC
  0.818（range 0.805–0.835），ZS 20-lang mean 0.767， gap 5.2pp。所有 key metrics 落在 best
  区间内。

  '

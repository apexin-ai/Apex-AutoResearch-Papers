    degradation 随 depth 指数增长（20%→80% depth: 0.5→8.8pp）。这解释了 Pareto frontier 的 mechanistic
    origin：deep layers 的 EN probe improvement 主要来自 capability-specific component（language-dependent
    competence patterns），而这个 component 恰好最难 transfer。

    Projecting out difficulty 后 EN AUROC 下降 4.2pp（移除了 easy-hard distinction 信号），但
    ZS transfer 改善 4.5pp（关键发现：removing difficulty noise exposes the capability signal

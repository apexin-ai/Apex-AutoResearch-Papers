- name: CKA Cross-Lingual Similarity & Simpson's Paradox
  plan_id: plan_011
  description: 'Linear CKA (EN vs each target) at every probed layer, 20 languages
    × 3 models。 核心分析：(a) same-layer cross-language correlation (n=20 per layer), (b)

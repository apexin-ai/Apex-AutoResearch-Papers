    不预测（depth confound 混淆了 correctness 与 non- correctness dimensions 的 divergence）。

    CKA cliff threshold ~0.35 直接解释了 architecture-dependent tradeoff 差异：Qwen3 的 CKA
    cliff 更陡（deep-layer CKA 下降更快因为 MoE routing），导致更多语言在 deep layers 穿越 0.35 threshold

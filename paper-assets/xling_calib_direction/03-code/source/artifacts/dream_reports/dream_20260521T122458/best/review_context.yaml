    MoE active（MoE 的 expert routing 提供 effective capacity boost，使相同 active param 下
    probe 信号更强）。

    Pareto tradeoff 在 12/20 languages 上可观测（介于 Qwen3 15/20 和 Llama4 10/20 之间），ZS drop
    3.0pp。Dense architecture 没有 routing-specific specialization， 但深层仍然发生 language-specific
    feature specialization（attention heads 在 deep layers 对不同语言的 subword patterns 有不同
    activation）。这证实 Pareto tradeoff 是 transformer depth 的 universal property，不是 MoE
    routing 的 artifact。


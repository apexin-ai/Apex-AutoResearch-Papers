    与 ZS-optimal (L48) 相距 20 层，远大于 MVP 的 3 层，确认 tradeoff 在大模型上放大。 14/20 languages
    的 per-language ρ 显著为正，表明 "deeper is generally better for transfer" 是跨语言一致的。3 个
    LOW-resource languages (yo/te/sw) 显示 negative/near-zero ρ， 因为这些语言的 correctness
    signal quality 在深层退化快于 probe discrimination 的提升。 CaCLR 在 ZS-optimal layer 提供 +3.7pp，是所有
    label-free methods 中最优。

    '

tier: worst
narrative_guidance: 'Full reframe to field-level diagnostic paper: ''Does probe-based
  calibration work beyond English? A systematic study across 2 architectures and 20
  languages.'' Value proposition shifts from method contribution to first large-scale
  answer on whether this research line generalizes. CaCLR is reported as a rigorous
  negative result — consistency-based objectives do not help when the cross-lingual
  correctness signal is this noisy. Decomposition is reported as evidence that difficulty
  and capability are entangled in multilingual representations, contradicting the
  clean separation assumed by English-only prior work. Pareto frontier is real on
  Qwen3 but fails to replicate cleanly on Llama 4 Scout — reported as architecture-dependence
  finding rather than universal law. Orthogonality (Claim 4) survives as the one mechanistic
  takeaway: output-based calibration is structurally limited everywhere, not just
  English. Target EACL with framing that negative/diagnostic results at this scale
  (2 models × 20 languages × all layers) are community-valuable when the field is
  actively expanding probe-based methods without multilingual validation.

  '

  figures_description:
  - 'Figure 2a: Side-by-side Pareto frontier scatter plots for Qwen3-235B (left) and
    Llama 4 Scout (right). Qwen3 shows a discernible convex Pareto front with 6 non-dominated
    points forming a curve from upper-left (high EN, low transfer) to lower-right
    (low EN, high transfer). Llama 4 shows a near-flat cloud with only 3 weakly non-dominated
    points — no meaningful tradeoff curve. The contrast is the paper''s key Figure
    2 evidence that the Pareto frontier is architecture-dependent.'
  - 'Figure 2b: Llama 4 Scout non-monotonicity detail: line plot of transfer AUROC
    vs layer depth for zh, fr, ar, sw. The zh/fr lines show a bump at layer 20, dip
    at 24, recover at 28 — violating the monotonic depth-transfer assumption. This
    is attributed to MoE expert routing transitions at these layers.'
  analysis: 'Llama 4 Scout is the worst-tier''s smoking gun for the diagnostic reframe.
    The Pareto frontier essentially doesn''t exist on this architecture (rank corr
    0.22, only 3 non-dominated layers). This is the strongest evidence for the diagnostic
    paper''s thesis: the depth-transfer tradeoff from Claim 1 is not a universal property
    of transformers but an architecture-dependent phenomenon that cannot be assumed
    to generalize. The 0.33 cross-architecture agreement means practitioners cannot
    use findings from one model to guide layer selection on another. For the paper,
    this transforms from a weakness into a key finding: the field cannot assume probe-based
    calibration will behave consistently across architectures.

    '

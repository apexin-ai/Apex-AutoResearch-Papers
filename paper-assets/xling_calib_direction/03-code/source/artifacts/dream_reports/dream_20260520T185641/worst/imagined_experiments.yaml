  result_rationale: 'Qwen3-235B is a much larger MoE model than the MVP''s Qwen2.5-7B.
    English AUROC at 0.776 improves modestly over MVP''s 0.754 because the model is
    more capable and the correctness signal is more linearly accessible in larger
    models, but gains are sublinear — the larger model also has more complex, distributed
    representations that resist simple linear probing. Zero-shot transfer mean of
    0.621 reflects the worst-tier prediction that transfer is unreliable: high-resource
    Indo-European languages (fr, de, es) and CJK (zh, ja, ko) transfer adequately
    because their representations share more subspace structure with English at intermediate
    layers, but low-resource languages (sw, yo, te, bn) and languages with very different
    morphology (th, ta) fail because the MoE routing creates language-specific expert
    patterns that are opaque to an English-trained linear probe. Mean-shift fails
    entirely (0/19) because the mean activation difference between languages conflates
    content, style, and script differences — subtracting it removes useful signal.
    The Pareto frontier rank correlation of 0.41 is real but moderate: the general
    trend (deeper = better English, worse transfer) holds, but MoE routing introduces
    non-monotonic noise at mid-depth layers where expert activation patterns shift.
    The 7/19 pass rate reflects that only typologically close or high-resource languages
    have enough representational overlap with English for zero-shot transfer to work.

    '

  result_rationale: 'The hypothesis that linear probes transfer better receives only
    weak support. MLP probes are ~1pp better in English because the 2-layer MLP captures
    mild nonlinearities in the correctness signal (interaction effects between representation
    dimensions). But the cross-lingual transfer difference is tiny (-0.2 to -0.4pp
    favoring logistic regression) and inconsistent across languages and layers — Cohen''s
    d of 0.18 means the effect would be invisible without large sample sizes. The
    interaction with depth is the most interesting signal: at deep layers, MLP probes
    overfit to English-specific patterns more (1.4pp English advantage) and consequently
    transfer worse (0.7pp transfer penalty). But even this effect is too small to
    be practically actionable. For the paper, this confirms logistic regression as
    the appropriate probe choice (simpler, nearly as good) but doesn''t generate a
    standalone finding.


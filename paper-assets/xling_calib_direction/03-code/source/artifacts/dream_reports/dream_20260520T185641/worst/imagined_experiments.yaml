  result_rationale: 'Expanding to 50+ languages worsens the aggregate picture because
    the additional languages are predominantly low- and very-low-resource. Many of
    these languages (e.g., Amharic, Lao, Mongolian, Georgian) have minimal representation
    in the models'' training data, so their internal representations share even less
    structure with English. The pass rate drops from ~37% (7/19) to ~24% (12/51),
    and some languages approach chance (AUROC ~0.49). For the paper, this strengthens
    the diagnostic message: "probe-based calibration has a severe language barrier
    that scales with the number of languages you try to cover."


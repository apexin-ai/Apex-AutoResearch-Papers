    transfer_delta_after_projection_pp_qwen3: -1.4
    transfer_delta_after_projection_pp_llama4: -1.3
    difficulty_correctness_cosine_mean_qwen3: 0.34
    difficulty_correctness_cosine_mean_llama4: 0.38
    difficulty_correctness_cosine_std: 0.11
    subspace_overlap_mean_angle_deg: 58
  result_rationale: 'In the worst tier, difficulty and capability are entangled in
    cross-lingual representations. The difficulty direction explains only 14% (Qwen3)
    / 12% (Llama4) of correctness probe variance — real but modest. Critically, projecting
    out difficulty makes transfer WORSE (-1.3 to -1.4pp), not better. This is because
    the difficulty-shared component actually carries useful cross-lingual signal:
    questions that are hard in English tend to be hard everywhere due to shared conceptual
    complexity, and this shared difficulty signal is one of the few reliable cross-lingual
    bridges for the correctness probe. Removing it strips away a genuine cross-lingual
    invariance. The residual "capability-specific" component is more language-dependent,
    not less — it contains the idiosyncratic ways each language''s tokens encode competence,
    which are precisely the non-transferable signals. The cosine similarity of 0.34-0.38
    between difficulty and correctness directions confirms they are neither orthogonal
    nor aligned — they share a moderate subspace that cannot be cleanly separated.
    This contradicts the paper''s original Claim 2 hypothesis that decomposition would
    be prescriptive. The decomposition is real but useless: it describes variance
    structure without enabling better transfer.

    '

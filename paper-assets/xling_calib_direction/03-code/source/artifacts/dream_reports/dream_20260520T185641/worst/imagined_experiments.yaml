    baseline AUROC (x-axis). Shows that CaCLR helps low-resource languages modestly
    (+1-2pp) but slightly hurts high-resource languages that already transfer well
    (-0.3 to -1.2pp). Linear projection shows the same pattern but with uniformly
    better outcomes. Net: CaCLR''s mechanism doesn''t add value over simple geometric
    alignment.'
  analysis: 'CaCLR is a rigorous negative result. The consistency loss term — the
    core methodological novelty — is inert. This is not a hyperparameter tuning failure;
    β is swept over 3 orders of magnitude and the landscape is flat. The SB-ECE term
    provides modest calibration regularization, but this benefit is available without
    any cross-lingual machinery. Linear projection achieves the same or better results
    with a simpler mechanism. For the paper, this is framed as: "consistency-based
    cross-lingual alignment objectives do not help when the underlying correctness
    signal has low cross-lingual SNR. This negative result saves the community from
    pursuing distributional-matching approaches (adversarial, MMD, consistency) for
    this problem class."

    '
- name: Difficulty-Controlled Ablation (Decomposition)
  plan_id: plan_004
  description: 'Train IRT difficulty probes, project out difficulty direction from
    activations, retrain correctness probes on residuals, evaluate transfer. 10 representative
    languages × 8 representative layers per model.

    '
  expected_results:
    difficulty_probe_r2_en_qwen3: 0.52
    difficulty_probe_r2_en_llama4: 0.47
    difficulty_probe_transfer_r2_mean_9lang: 0.41
    decomp_difficulty_var_explained_pct_qwen3: 14.3
    decomp_difficulty_var_explained_pct_llama4: 11.8
    correctness_residual_auroc_en_qwen3: 0.738

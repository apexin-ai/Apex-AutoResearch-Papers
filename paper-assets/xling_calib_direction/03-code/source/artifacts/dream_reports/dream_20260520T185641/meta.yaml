  - name: CaCLR Implementation and Comparative Evaluation
    plan_id: plan_003
    description: 'CaCLR (L_BCE + α·L_SB-ECE + β·L_consistency) implementation. Train
      on English labels + unlabeled parallel activations. Compare vs all 5 conditions
      across full Pareto frontier, both models × 20 languages. Hyperparameter tuning
      (α, β).

      '
    expected_results:
      best_alpha: 0.15

  - name: CaCLR Implementation and Comparative Evaluation
    plan_id: plan_003
    description: 'L_CaCLR = L_BCE + α·L_SB-ECE + β·L_consistency. Trained using English
      correctness labels + unlabeled parallel activations from 19 target languages.
      Hyperparameter sweep: α∈{0.1,0.2,0.3,0.5,1.0}, β∈{0.05,0.1,0.15,0.2,0.3}. Compared
      against 4 baselines across full Pareto frontier for both models × 20 languages.

      '
    expected_results:
      best_alpha: 0.3
      best_beta: 0.15

  - name: Difficulty-Controlled Ablation
    plan_id: plan_004
    description: 'IRT difficulty probes (Ridge regression on human difficulty scores
      per Civelli et al.) trained per layer, difficulty direction projected out of
      activations, correctness probes retrained on residuals, transfer evaluated.
      10 languages × 8 layers per model.

      '
    expected_results:
      difficulty_probe_en_R2_mean: 0.68
      difficulty_probe_zs_R2_mean: 0.61
      decomp_difficulty_var_explained_pct: 37
      original_transfer_gap_pp: 15.2
      residual_transfer_gap_pp: 11.4
      gap_reduction_pp: 3.8
      gap_reduction_pct: 25
      residual_en_auroc_drop: 0.038
      language_family_cluster_effect: IE languages (de/fr/es/pl/ru) cluster; others
        scattered
      capability_residual_noisy: true
      prescriptive_accuracy: 0.72
    result_rationale: 'Difficulty 是已知的跨语言可迁移特征（Civelli et al. 直接证明了 IRT difficulty
      probe 的跨语言迁移性）。在 median 档，difficulty 解释了 correctness direction 37% 的方差， 因为 "题目难不难"
      确实是 correctness 的一个强组成部分（简单题各语言都对，难题各 语言都错）。但 correctness 还包含 "模型在该语言上是否具备回答这道题的
      capability" 这一 language-dependent 成分。投影掉 difficulty 后，transfer gap 从 15.2pp
      缩小到 11.4pp（减少 25%），比 variance-explained 的 37% 低是因为 projection 是线性的而 difficulty-correctness
      的关系有非线性成分。残差中的 capability-specific 信号是 noisy 的：高资源语言表现出清晰的 language-family clustering（IE
      语言的 capability profiles 相似），但低资源语言的 capability residual 被 tokenization 和数据质量

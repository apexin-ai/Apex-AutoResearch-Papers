    result_rationale: 'CaCLR''s consistency loss (L_consistency) is designed to align
      cross-lingual probe activations so that the English probe generalizes. In the
      worst tier, this fails because the cross-lingual correctness signal is too noisy
      for the consistency objective to find meaningful invariances. The unlabeled
      parallel activations contain language-specific variance (script, morphology,
      tokenization artifacts) that dominates the correctness signal, so minimizing
      distributional distance between languages collapses both signal and noise. The
      hyperparameter search confirms this: β (consistency weight) is driven to near-zero
      (0.05), and removing the consistency term entirely slightly improves performance
      (+0.2pp). The SB-ECE term helps modestly because it acts as a calibration regularizer
      on the English side, but this benefit doesn''t compound with consistency. CaCLR
      ends up being essentially "zero-shot + SB-ECE regularization" — functionally
      a slightly calibration-aware version of the base probe. Linear projection beats
      CaCLR because projection directly estimates and applies the affine transformation
      between language representation subspaces, which is a more efficient use of
      the few available parallel datapoints than trying to learn an invariant representation.
      The key insight: simple alignment (linproj) outperforms principled invariance
      (CaCLR) when the signal-to-noise ratio of the target signal is low. For high-resource
      languages that already transfer well, CaCLR''s overhead yields no benefit; for
      low-resource languages where help is needed, the consistency signal is too noisy
      to learn from.

      '

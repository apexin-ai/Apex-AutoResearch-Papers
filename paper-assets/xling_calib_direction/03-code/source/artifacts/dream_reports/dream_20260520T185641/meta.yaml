        for this problem. Lean into Claim 4 (orthogonality persists cross-lingually
        → output-based calibration is structurally limited everywhere, not just English)
        as the one mechanistic takeaway. Still targets EACL — negative/diagnostic
        results at this scale and rigor are valuable, especially when the field is
        actively expanding probe-based methods without multilingual validation.'

      caclr_fails_vs_linproj_langs:
      - th
      - my
      - am
      - yo
      - te
      mean_shift_any_improvement: 1
    result_rationale: 'CaCLR 在 median 档位下表现为 "matches or marginally exceeds linear
      projection"。 核心原因：consistency term（L_consistency）对齐的是 unlabeled parallel activations
      的 probe output distribution，在中-高资源语言中有效（parallel corpus 质量好， 激活空间足够对齐），但在低资源语言中由于
      (a) GlobalMMLU 翻译噪声 (b) tokenizer 覆盖率低导致 activation 本身质量差，consistency 信号变成噪声。因此
      CaCLR 比 zero-shot 有显著改善（+4.2pp at L40），但比 linear projection 仅高 1.3pp 平均—— 因为
      linear projection 已经利用了 target-language activations 做对齐。CaCLR 的 真正优势在 Pareto
      shift：它把最优工作层从 L40 推到 L52（Qwen3），在更深层维持 迁移质量，同时获得 +2.0pp 英语 AUROC。SB-ECE loss
      使 CaCLR probe 自带 calibration， ECE 比 temperature-scaled zero-shot 低 21.1%——这是方法论层面的
      practical benefit。 Hyperparameter 敏感度中等：α=0.3 在 0.2-0.5 范围内差异小于 0.5pp，β 更敏感——
      β>0.2 时 consistency 过强导致英语 AUROC 下降。5 个失败语言（th/my/am/yo/te） 中 4 个是低资源或 activation
      质量低的语言，th 是 mid-resource 但独特的声调语言 导致 alignment 困难。

      '

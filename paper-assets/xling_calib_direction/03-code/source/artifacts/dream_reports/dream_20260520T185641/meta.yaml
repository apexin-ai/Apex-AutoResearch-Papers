focus: 'Core submission for EACL 2027 ARR: 2 models (Qwen3-235B + Llama 4 Scout) ×
  20 languages. Key risks: (1) CaCLR may not outperform simple linear projection;
  (2) difficulty-shared vs capability-specific decomposition may not cleanly separate;
  (3) orthogonality claim 4 may be seen as incremental. MVP showed mean-shift completely
  fails, Pareto tradeoff directly observed at L24 vs L27.'

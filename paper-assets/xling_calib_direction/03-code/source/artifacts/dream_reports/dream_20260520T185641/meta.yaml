      cleaner correctness signals in intermediate layers. The Pareto frontier emerges
      because deeper layers (L72+) specialize for English-dominant pretraining data
      distribution — the model''s language-specific processing intensifies past ~75%
      depth, degrading cross-lingual invariance. The best transfer layer (L56, ~60%
      depth) sits in the "universal reasoning" zone before language-specific heads
      activate. Low-resource languages (sw, yo, ig) still transfer above 0.65 AUROC
      because GlobalMMLU questions share structural patterns that even underrepresented
      languages partially align with in middle layers. Mean-shift continues to mostly
      fail because correctness directions are not simply mean-offset between languages
      — they require rotation, not translation, which linear projection and CaCLR
      address.

      '

      the model has less capacity to maintain the confidence-correctness dissociation
      for languages with limited training data — when the model is uncertain due to
      lack of language-specific knowledge, both its correctness and confidence signals
      degrade in correlated ways, slightly breaking orthogonality. Reviewers may see
      this as incremental: Miao & Ungar showed orthogonality for English, we extend
      to 20 languages, but the finding is qualitatively the same. The resource- tier
      modulation is the one novel angle but the effect size is modest (0.054 vs 0.098).

      '

      all languages below 0.15) because it is a structural property of how LLMs represent
      confidence vs correctness — the model''s verbalized confidence is calibrated
      to appear confident regardless of actual correctness, and this dissociation
      is encoded geometrically at the representation level. However, the worst-tier
      variance is higher than Miao & Ungar''s English-only finding (std 0.038 vs their

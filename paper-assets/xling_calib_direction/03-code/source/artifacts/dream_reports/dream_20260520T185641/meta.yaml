        and 20 languages.'' The value proposition shifts from ''here is a method''
        to ''here is the first large-scale answer to whether this research line generalizes.''
        Key findings become: (1) probe-based correctness signals exist multilingually
        but transfer is unreliable — architecture, language family, and resource tier
        all modulate success in unpredictable ways; (2) simple alignment methods (linear
        projection, few-shot) match or beat more principled approaches (CaCLR) — the
        signal is too noisy for sophisticated invariance objectives to help; (3) mean-shift
        completely fails (confirmed at scale beyond MVP); (4) difficulty and capability
        are entangled in cross-lingual representations, unlike the clean separation
        assumed by prior English-only work. Frame CaCLR ablation as a rigorous negative

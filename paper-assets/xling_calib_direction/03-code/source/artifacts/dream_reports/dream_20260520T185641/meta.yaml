  - name: Difficulty-Controlled Ablation
    plan_id: plan_004
    description: 'IRT difficulty probes (Ridge regression), project out difficulty
      direction, retrain correctness probes on residuals, evaluate transfer. 10 languages
      × 8 layers per model.

      '
    expected_results:
      difficulty_probe_r2_mean: 0.72
      difficulty_var_explained_pct_mean: 68.4
      difficulty_var_explained_pct_range:
      - 58.2
      - 79.1
      residual_en_auroc_drop_pp: 4.2
      residual_zs_transfer_drop_pp: 1.1
      capability_specific_var_pct: 31.6
      capability_specific_transfer_degradation_pct: 87
      difficulty_component_transfer_degradation_pct: 13
      decomp_prescriptive_accuracy: 0.81
      difficulty_var_by_depth:
        shallow_20pct: 0.74
        mid_50pct: 0.69
        deep_80pct: 0.62
      capability_transfer_drop_by_depth:
        shallow_20pct: 0.8
        mid_50pct: 3.4
        deep_80pct: 9.7
    result_rationale: 'IRT difficulty is a strong, language-agnostic property — harder
      questions are harder everywhere. Ridge regression captures this cleanly (R²=0.72)
      because difficulty is linearly encoded in intermediate representations (Civelli
      et al. confirmed this). The difficulty component accounts for 68% of explained
      variance because GlobalMMLU correctness is heavily driven by item difficulty:
      a model gets easy questions right in all languages and hard questions wrong
      in all languages. After projecting out difficulty, the residual correctness
      signal is "capability-specific" — it captures language-dependent competence
      differences. This residual transfers poorly at deep layers (9.7pp drop at 80%
      depth vs 0.8pp at 20% depth) because deep layers encode language-specific processing
      that makes capability assessments non-transferable. The difficulty component
      transfers well at all depths (only 13% of total transfer degradation) because
      it''s language-invariant by construction. This decomposition is prescriptive:
      when difficulty explains most of a language''s correctness variance, simple
      zero-shot transfer suffices; when the capability residual is large, CaCLR is
      needed. The 81% prescriptive accuracy validates the decomposition as more than
      descriptive.

      '

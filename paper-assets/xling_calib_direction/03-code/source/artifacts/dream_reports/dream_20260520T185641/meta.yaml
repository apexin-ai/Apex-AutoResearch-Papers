    figures_description:
    - 'Figure 1a: Heatmap of zero-shot transfer AUROC (y-axis: 24 probed layers sorted
      by depth, x-axis: 20 languages sorted by resource tier). Shows a gradient where
      upper-left (deep layers × high-resource langs) has moderate AUROC (~0.65-0.67)
      and lower-right (shallow layers × low-resource langs) is near chance (~0.52-0.57).
      But the pattern is noisy — no crisp diagonal boundary. Several mid-depth layers
      show unexpected dips (layers 48-56) breaking monotonicity.'
    - 'Figure 1b: Pareto frontier scatter plot (x-axis: mean 19-lang zero-shot AUROC,
      y-axis: English AUROC at same layer). Each point is a layer. The Pareto front
      connects 6 non-dominated layers but the remaining 18 points scatter widely around
      it. Convex hull is thin — the tradeoff is real but the frontier offers limited
      choice. Error bars (bootstrap 95% CI) overlap substantially between adjacent
      Pareto-optimal points.'
    - 'Figure 1c: Line plot of zero-shot transfer drop (EN AUROC minus target-lang
      AUROC) vs layer depth, one line per language, colored by resource tier. High-resource
      languages (blue) show a gentle upward slope (deeper = worse transfer). Low-resource
      languages (red) show a steep upward slope. The spread between lines increases
      with depth, illustrating that the Pareto tradeoff is more severe for low-resource
      languages.'
    analysis: 'The Pareto frontier is real on Qwen3-235B but weak: rank correlation
      of 0.41 means the depth-transfer tradeoff explains only ~17% of variance. MoE
      routing creates non-monotonic perturbations at mid-depth. The practical implication
      is limited — the frontier provides modest guidance for layer selection but is
      not a reliable engineering tool. Zero-shot transfer fails for 12/19 languages
      (AUROC < 0.65), with a clear resource-tier gradient. The field should not assume
      English-trained correctness probes transfer to low-resource languages. Mean-shift
      is confirmed dead at scale. Linear projection and few-shot are the only viable
      transfer methods, with few-shot-100 achieving the best results — but requiring
      100 labeled examples per language partially negates the zero-label promise.

      '

    result_rationale: 'Linear probes transfer better because they learn a single hyperplane
      in activation space — the hyperplane generalizes across languages when the underlying
      geometry is approximately shared (as it is in mid-depth layers). MLPs learn
      nonlinear decision boundaries that fit English-specific feature interactions,
      gaining ~1.3pp EN AUROC but losing ~4.3pp in transfer. The transfer gap widens
      at deeper layers (6.8pp advantage for logreg) because deep layers have more
      language-specific nonlinear structure that MLPs exploit but logreg ignores.
      This justifies our choice of linear probes for the main results and supports
      the geometric interpretation of the Pareto frontier: it''s about linear subspace
      alignment, not complex feature interactions.


      peaks at 0.749 (lower than Qwen3''s 0.776) because Llama 4 Scout''s 48 layers
      compress the representational hierarchy — the same functional stages are packed
      into fewer layers, leaving less room for a clean correctness signal to emerge.
      Zero-shot transfer is worse overall (mean 0.594 vs Qwen3''s 0.621) because Llama
      4 Scout''s training data distribution is more English-centric, and its MoE routing
      assigns non-English tokens to a sparser expert set that shares less structure
      with the English experts. Only 4/19 languages pass the 0.65 threshold. The 0.33
      cross-architecture Pareto agreement means the optimal layer for a given language
      on Qwen3 does not predict the optimal layer on Llama 4 — the tradeoff is architecture-specific,
      not a universal property of transformer depth.


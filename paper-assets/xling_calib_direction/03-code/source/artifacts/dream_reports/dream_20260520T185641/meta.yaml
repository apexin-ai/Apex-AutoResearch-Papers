    - 'Figure 3a: Grouped bar chart comparing 6 transfer methods across 20 languages
      (Qwen3-235B), sorted by language resource tier. Shows that few-shot-100 > few-shot-25
      ≈ linear projection ≈ CaCLR > zero-shot >> mean-shift. CaCLR and linear projection
      bars are nearly identical in height across all languages. The visual message
      is clear: CaCLR adds complexity without benefit.'
    - 'Figure 3b: Hyperparameter sensitivity plot for CaCLR. Left panel: AUROC vs
      α (SB-ECE weight), showing a gentle inverted-U peaking at α=0.3. Right panel:
      AUROC vs β (consistency weight), showing a flat line — β has no effect. This
      is the key visual evidence that the consistency objective is inert.'
    - 'Figure 3c: Scatter plot of per-language CaCLR improvement (y-axis) vs zero-shot
      baseline AUROC (x-axis). Shows that CaCLR helps low-resource languages modestly
      (+1-2pp) but slightly hurts high-resource languages that already transfer well
      (-0.3 to -1.2pp). Linear projection shows the same pattern but with uniformly
      better outcomes. Net: CaCLR''s mechanism doesn''t add value over simple geometric
      alignment.'
    analysis: 'CaCLR is a rigorous negative result. The consistency loss term — the
      core methodological novelty — is inert. This is not a hyperparameter tuning
      failure; β is swept over 3 orders of magnitude and the landscape is flat. The
      SB-ECE term provides modest calibration regularization, but this benefit is
      available without any cross-lingual machinery. Linear projection achieves the
      same or better results with a simpler mechanism. For the paper, this is framed
      as: "consistency-based cross-lingual alignment objectives do not help when the
      underlying correctness signal has low cross-lingual SNR. This negative result
      saves the community from pursuing distributional-matching approaches (adversarial,
      MMD, consistency) for this problem class."

      '
  - name: Difficulty-Controlled Ablation (Decomposition)
    plan_id: plan_004
    description: 'Train IRT difficulty probes, project out difficulty direction from
      activations, retrain correctness probes on residuals, evaluate transfer. 10
      representative languages × 8 representative layers per model.


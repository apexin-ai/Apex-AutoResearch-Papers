    \ Weak Accept (borderline, 4/6)\ntimestamp: 2026-05-20T19:50:20.231821+00:00\n\
    ---\n\n# Dream Review Report: Cross-Lingual Calibration Probes Reveal Architecture-Dependent\
    \ Pareto Frontiers in Multilingual LLMs\n\n**Review Mode:** Full (2 Reviewers,\
    \ 4-Step Roundtable)\n**Venue Standard:** Top ML venue, ~25% acceptance, 6-point\
    \ scale\n\n---\n\n## Reviewer 1 — Methods & Experiments\n\n### Strengths\n\n1.\
    \ **Comprehensive experimental design.** 3 architectures (Qwen3-235B MoE, Llama\
    \ 4 Scout MoE, Gemma 4 31B dense) × 20 languages × 3 benchmarks × 5 transfer conditions.\
    \ The inclusion of both MoE and dense architectures is well-motivated and yields\
    \ interpretable architectural contrasts (sharp vs. smooth Pareto frontiers).\n\
    \n2. **Well-structured transfer conditions.** The five conditions (zero-shot →\
    \ mean-shift → linear projection → few-shot → CaCLR) form a natural progression\
    \ from zero-label to labeled. Mean-shift's consistent failure serves as a useful\
    \ negative control replicating Xiao et al.'s finding for correctness probes.\n\
    \n3. **CaCLR is methodologically principled.** The three-term loss (BCE + SB-ECE\
    \ + consistency) separately addresses discrimination, calibration, and cross-lingual\
    \ transfer. The KL-divergence consistency term on parallel activations requires\
    \ no target-language labels, which is a clean design choice.\n\n4. **Sound decomposition\
    \ approach.** Building on Civelli et al.'s IRT probes and projecting out the difficulty\
    \ direction is a clean technique. The variance decomposition across depth (difficulty\
    \ share decreasing from 44% at L20 to 26% at L84) provides a mechanistic explanation\
    \ for the Pareto tradeoff.\n\n5. **Thorough ablation coverage.** Consistency term\
    \ ablation (Table 12), hyperparameter sensitivity (Table 13), probe complexity\
    \ comparison (§9.1), INT8 validation (§9.3), cross-benchmark generalization (§9.2),\
    \ and extended language coverage (§9.4). All 10 planned experiments (plan_001–plan_010)\
    \ are covered in the paper.\n\n6. **Resource-tier analysis is informative.** Breaking\
    \ results by high/mid/low resource tiers throughout is more useful than only reporting\
    \ language-level or aggregate means. The finding that CaCLR's consistency term\
    \ primarily benefits mid-resource languages (Table 11: +1.6pp mid vs. +0.3pp low)\
    \ is a useful practical insight.\n\n### Weaknesses\n\n1. **CaCLR's improvement\
    \ is marginal and not tested for significance.** +1.3pp over linear projection\
    \ on average, with CaCLR winning only 1/5 low-resource languages. Few-shot-100\
    \ actually outperforms CaCLR (0.743 vs. 0.738 on Qwen3 L40, Table 9). No confidence\
    \ intervals, bootstrap tests, or paired significance tests are reported anywhere\
    \ in the paper. For a claim this narrow, statistical validation is essential.\n\
    \n2. **CaCLR is not truly \"zero-label\" — it requires parallel questions.** The\
    \ consistency loss (Eq. 2) requires parallel (English, target-language) activation\
    \ pairs from the same underlying question. This is a significant practical constraint\
    \ (acknowledged briefly in §10 Limitations) that distinguishes it from a truly\
    \ resource-free method. Many deployment scenarios lack parallel question sets.\n\
    \n3. **Decomposition captures limited variance.** Difficulty explains 37% of correctness\
    \ variance, produces 25% gap reduction, and achieves 72% prescriptive accuracy\
    \ — but no null baseline is provided for the 72% figure. What does majority-class\
    \ prediction achieve? Without this, the prescriptive value is hard to evaluate.\
    \ The capability residual is described as \"noisy\" and \"confounded\" with language-family\
    \ effects.\n\n4. **INT8 validation is insufficient.** Only tested on Llama 4 Scout\
    \ with a 5% subset (~700 samples). Qwen3-235B is the primary experimental model\
    \ (plans 001, 003, 004, 005) and uses INT8, yet its quantization is not directly\
    \ validated. The 5% subset is also small for a validation study.\n\n5. **No downstream\
    \ task evaluation.** All metrics are probe-level (AUROC, ECE, Brier). There is\
    \ no evaluation of whether improved probe calibration leads to better downstream\
    \ decisions (selective prediction, abstention, uncertainty-guided routing). This\
    \ limits the practical impact claim.\n\n6. **Layer granularity differs across\
    \ models.** Qwen3 probes 24 layers (every 4th of 94), Llama 4 probes 12 layers\
    \ (every 4th of 48), Gemma 4 presumably ~15 layers. Cross-architecture Pareto\
    \ frontier comparisons (Table 4) are confounded by different sampling densities.\n\
    \n7. **Low-resource performance is weak.** At 53 languages, only 35% of low-resource\
    \ languages pass the 0.60 AUROC threshold (§9.4). CaCLR wins only 1/5 low-resource\
    \ languages against linear projection. The paper acknowledges this but offers\
    \ no path forward beyond \"future work.\"\n\n### Questions for Authors (R1)\n\
    1. Can you provide bootstrap confidence intervals or paired significance tests\
    \ for CaCLR vs. linear projection?\n2. What is the majority-class baseline for\
    \ the 72% prescriptive accuracy?\n3. Why is INT8 not validated on Qwen3-235B,\
    \ the primary model?\n4. How does CaCLR perform when parallel questions are unavailable\
    \ (e.g., using back-translation to create pseudo-parallel pairs)?\n5. What is\
    \ the computational overhead of CaCLR training vs. fitting a linear projection?\n\
    \n### R1 Score: 4 (Weak Accept)\n**Justification:** Thorough experimental execution\
    \ across a large design space. The Pareto frontier characterization is a genuine\
    \ empirical contribution. However, CaCLR's marginal improvement without statistical\
    \ validation, the partial decomposition, and the lack of downstream evaluation\
    \ weaken the method and analysis contributions.\n**Confidence:** 4/5\n\n---\n\n\
    ## Reviewer 2 — Novelty & Related Work\n\n### Strengths\n\n1. **First systematic\

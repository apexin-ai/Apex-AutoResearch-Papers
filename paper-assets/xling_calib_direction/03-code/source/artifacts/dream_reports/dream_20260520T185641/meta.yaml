        sw_llama4: 0.712
        yo_llama4: 0.681
        ig_llama4: 0.698
      low_resource_zs_pass_rate: 1.0
    result_rationale: 'CaCLR''s consistency loss (β·L_consistency) directly penalizes
      divergence between EN and non-EN probe outputs on parallel/comparable activations,
      forcing the probe to learn language-invariant features. This is strictly more
      informative than linear projection (which only aligns means and covariances
      post-hoc) because it shapes the learned representation during training. The
      3.2pp AUROC gain over linear projection reflects the value of end-to-end optimization:
      linear projection corrects first-order distributional mismatch but not the nonlinear
      feature interactions that L_consistency captures. The SB-ECE term (α·L_SB-ECE)
      provides calibration-aware training that temperature scaling cannot — it directly
      optimizes the calibration objective rather than post-hoc rescaling. The 40%
      ECE reduction over temperature scaling arises because CaCLR addresses the root
      cause (representation misalignment) rather than the symptom (miscalibrated probabilities).
      The Pareto frontier shift is the key result: CaCLR allows operating 2 layers
      deeper than the ZS-optimal point while maintaining equivalent or better transfer
      — it literally pushes the Pareto frontier outward. Low-resource languages benefit
      most from L_consistency because their activation distributions are most misaligned
      from EN; the consistency term provides the strongest gradient signal precisely
      where the gap is largest.

      '

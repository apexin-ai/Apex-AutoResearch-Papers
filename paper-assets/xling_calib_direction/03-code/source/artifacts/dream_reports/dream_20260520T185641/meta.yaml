      The Pareto frontier essentially doesn''t exist on this architecture (rank corr
      0.22, only 3 non-dominated layers). This is the strongest evidence for the diagnostic
      paper''s thesis: the depth-transfer tradeoff from Claim 1 is not a universal
      property of transformers but an architecture-dependent phenomenon that cannot
      be assumed to generalize. The 0.33 cross-architecture agreement means practitioners
      cannot use findings from one model to guide layer selection on another. For
      the paper, this transforms from a weakness into a key finding: the field cannot
      assume probe-based calibration will behave consistently across architectures.

      '

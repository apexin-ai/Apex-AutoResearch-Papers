    # Dream Review Report: Shifting the Cross-Lingual Calibration Pareto Frontier


    **Paper**: "Shifting the Cross-Lingual Calibration Pareto Frontier: Probe-Based
    Calibration Transfer via CaCLR"

    **Review mode**: Full (2 Reviewers, 4-step roundtable)

    **Date**: 2026-05-20


    ---


    ## Panel Summary


    | Reviewer | Focus | Preliminary | Post-discussion | Confidence |

    |----------|-------|-------------|-----------------|------------|

    | R1 | Methods + Experiments | 4 (Weak Accept) | 4 (borderline 3–4) | 4/5 |

    | R2 | Novelty + Related Work | 4 (Weak Accept) | 4− (borderline) | 4/5 |

    | **Consensus** | | | **4 (Weak Accept)** | |


    **Overall assessment**: Weak Accept — addresses a genuine gap with comprehensive
    experiments, but cumulative methodological and novelty concerns make acceptance
    contingent on substantive revisions.


    ---


    ## 1. Paper Summary


    This paper presents the first systematic study of cross-lingual correctness probe
    transfer for calibration, testing 20 languages across 3 architectures (Qwen3-235B-A22B,
    Llama 4 Scout, Gemma 4 31B Dense). It makes four claims forming a causal chain:
    (1) a depth-transferability Pareto frontier where optimal cross-lingual transfer
    occurs at ~58–60% of model depth; (2) a decomposition into difficulty-shared (68%
    variance, transfers well) and capability-specific (32%, drives 87% of transfer
    degradation) components; (3) CaCLR, a multi-objective training loss that shifts
    the Pareto frontier outward (+5.2pp AUROC, ~40% ECE reduction, no target-language
    labels); (4) correctness–confidence orthogonality persists across all 20 languages.
    Results extend to 52 languages and 3 benchmarks.


    ---


    ## 2. Strengths (Consensus)


    - **Genuine gap-fill.** All prior probe-based calibration work (Burns, Marks,
    Miao) is English-only. Systematically extending to 20+ languages across 3 architectures
    is a meaningful contribution that the field needs. (R1, R2)


    - **Comprehensive experimental breadth.** 10 experiments, 16 tables, 3 architectures
    (MoE + dense), 52 languages, 3 benchmarks, INT8 validation, probe complexity comparison.
    The coverage is well above average for this type of study. (R1)


    - **Clean causal chain.** The four claims are logically linked: the Pareto frontier
    (Claim 1) motivates the decomposition (Claim 2), which explains why CaCLR works
    (Claim 3), while orthogonality (Claim 4) establishes why output-based alternatives
    fail. This narrative structure is effective. (R1, R2)


    - **CaCLR Pareto shift is compelling.** Table 9 showing the frontier shifting
    outward (e.g., L64: ZS 0.741 → CaCLR 0.814, +7.3pp) is the paper''s strongest
    result — it demonstrates CaCLR doesn''t just improve a point estimate but changes
    the operating envelope. (R1)


    - **Three-architecture convergence.** Best transfer depth converging to 58–60%
    across dense and MoE architectures with 48–94 layers (Table 14) is strong evidence
    for universality. (R1, R2)


    - **Well-designed ablation.** The additive CaCLR ablation (Table 8) cleanly isolates
    each component''s contribution and reveals synergistic interaction between L_SB-ECE
    and L_consistency. (R1)


    - **Practical value.** The Pareto frontier gives practitioners actionable guidance
    (use ~60% depth layers for transfer), and CaCLR provides a concrete method requiring
    no target-language labels. (R2)


    ---


    ## 3. Weaknesses


    ### 3.1 Major Issues


    **W1. CaCLR''s parallel activation requirement is underspecified and the "no target-language
    labels" framing is misleading.** (R1 raised, R2 amplified)


    L_consistency requires "parallel activations" from EN and non-EN inputs, but the
    paper never specifies how these are obtained. GlobalMMLU provides parallel questions,
    but this is a strong requirement — parallel evaluation data is not available for
    most deployment scenarios. The paper repeatedly claims "no target-language labels"
    while requiring target-language *activations on parallel inputs*, which is a non-trivial
    data requirement. This narrows the practical advantage over few-shot baselines
    and needs transparent discussion. Both reviewers agreed this is the paper''s most
    critical underspecification.


    **W2. No uncertainty quantification on any result.** (R1 raised, R2 endorsed)


    With 19 languages and 3 architectures, there is ample opportunity to report confidence
    intervals, standard deviations, or significance tests. The headline 5.2pp improvement
    and all per-language numbers lack any variance estimates. At the precision level
    of 0.1–5pp, some differences may be within noise. Paired bootstrap or Wilcoxon
    signed-rank tests across languages are minimum requirements for a top venue.


    **W3. Missing domain adaptation baselines.** (R2 raised, R1 endorsed)


    CaCLR''s consistency loss is structurally equivalent to consistency regularization
    from domain adaptation (DANN, Deep CORAL, DAN). The paper does not cite or compare
    against these methods. Procrustes alignment — which achieves cross-lingual rotation
    alignment without learned parameters — is a particularly relevant missing baseline.
    Without it, we cannot determine whether CaCLR''s gains come from the consistency
    objective itself or from having *any* cross-lingual alignment mechanism. R1 noted
    that the linear projection baseline is also underspecified (Procrustes? least
    squares? what parallel data?).


    **W4. Layer-varying comparison inflates CaCLR''s headline advantage.** (R1 raised,
    R2 endorsed)


    The 0.804 AUROC for CaCLR (Table 7) appears to be evaluated at CaCLR''s optimal
    layer, while the 0.752 zero-shot baseline is at zero-shot''s optimal layer (different).
    The fair comparison is either: (a) fix the layer and compare all methods, or (b)
    explicitly state that each method is optimized over layers independently and report
    the resulting per-method best. The current presentation conflates these approaches.


    ### 3.2 Moderate Issues


    **W5. Decomposition "prescriptive accuracy" (81%) is undefined.** (R1 raised,
    R2 endorsed)


    The paper claims the decomposition "predicts with 81% accuracy when alignment
    intervention is needed" but never defines: prediction target, held-out evaluation
    set, decision threshold, or majority-class baseline. This is the most novel aspect
    of Claim 2 and deserves rigorous specification.


    **W6. Novelty is moderate across all four claims.** (R2, confirmed in discussion)


    - Claim 1 (Pareto frontier): Medium — systematic empirical characterization of
    a predicted trend, not a surprising discovery. The depth-transferability tradeoff
    is expected from cross-lingual probing literature.

    - Claim 2 (Decomposition): Medium-Low — IRT-based difficulty decomposition using
    known tools. The prescriptive element (81%) is underexplored and is the strongest
    novel aspect.

    - Claim 3 (CaCLR): Medium — consistency regularization from DA applied to probe
    training in a new setting. Solid engineering but limited conceptual advance.

    - Claim 4 (Orthogonality): Low — confirmatory extension of Miao & Ungar (2026b).
    Should be demoted to supporting analysis.


    **W7. Suspiciously uniform Llama4–Qwen3 cosine offsets.** (R1 raised, R2 amplified)


    Every single language has Llama4 cosine exactly 0.006–0.010 higher than Qwen3
    (Table 10). This uniformity across 20 typologically diverse languages suggests
    a systematic architectural constant (e.g., normalization or vocabulary size effects)
    rather than a meaningful cross-lingual phenomenon, weakening the orthogonality
    claim further.


    **W8. Temperature scaling comparison is ambiguous.** (R1)


    ECE reduction is reported "relative to temperature scaling," but the fair comparison
    is CaCLR + temp scaling vs. zero-shot + temp scaling. The current framing is unclear
    about whether CaCLR outputs also undergo temperature scaling.


    ### 3.3 Minor Issues


    **W9. Few-shot-25 underperforms zero-shot** (0.748 vs 0.762 AUROC, Table 2) without
    explanation. This suggests catastrophic forgetting during fine-tuning and warrants
    discussion. (R1)


    **W10. Probe complexity comparison** (Table 12) is only shown for Qwen3-235B,
    not validated across architectures. (R1)


    **W11. CaCLR Pareto shift** (Table 9) is only shown for Qwen3. Showing it for
    Llama 4 would strengthen the universality claim. (R1)


    **W12. Missing related work citations.** Several relevant papers from the project''s
    own literature map (CCPS, DALI, Joshi) are not cited. Cross-lingual representation
    alignment foundations (Conneau 2020, Pires 2019) are absent. (R2)


    ---


    ## 4. Questions for Authors


    1. **How exactly are "parallel activations" obtained for L_consistency?** Are
    these from the same GlobalMMLU questions translated into different languages?
    If so, does CaCLR require parallel evaluation data at training time? How does
    this work for languages not in GlobalMMLU?


    2. **What is the exact definition of "prescriptive accuracy" (81%)?** What is
    the prediction target (binary: CaCLR-needed vs. not?), what is the held-out evaluation
    set, what is the decision threshold, and what is the majority-class baseline?


    3. **At what layer is the CaCLR headline number (0.804 AUROC) computed?** If each
    method is evaluated at its respective optimal layer, this should be stated explicitly
    and the layer-fixed comparison should also be reported.


    4. **How sensitive is CaCLR to α and β?** If optimal hyperparameters differ across
    architectures, this undermines the "zero-tuning" practical claim.


    5. **Why does few-shot-25 underperform zero-shot?** What learning rate, regularization,
    and stopping criterion were used for few-shot fine-tuning?


    6. **How does CaCLR compare to Procrustes alignment and Deep CORAL?** These are
    near-minimal baselines from the DA literature that CaCLR must beat to justify
    its additional complexity.


    7. **At which layer(s) are correctness and confidence directions extracted for
    the orthogonality analysis?** If layer-dependent, how sensitive are the cosine
    values to layer choice?


    ---


    ## 5. Experiment Coverage Assessment


    All 10 planned experiments from the design document are covered in the paper:


    | Plan | Experiment | Status | Notes |

    |------|-----------|--------|-------|

    | 001 | Qwen3-235B Pareto Frontier | ✅ Tables 1–2 | Complete |

    | 002 | Llama 4 Scout Pareto Frontier | ✅ Tables 3–4 | Complete |

    | 003 | CaCLR Implementation | ✅ Tables 7–9 | Complete |

    | 004 | Difficulty Decomposition | ✅ Tables 5–6 | Complete |

    | 005 | Orthogonality Analysis | ✅ Tables 10–11 | Complete |

    | 006 | Probe Complexity | ✅ Table 12 | Only Qwen3 |

    | 007 | Cross-Benchmark | ✅ Table 13 | Complete |

    | 008 | Gemma 4 31B Dense | ✅ Table 14 | Summary only, no full table |

    | 009 | Extended Languages | ✅ Table 15 | Complete |

    | 010 | INT8 Validation | ✅ Table 16 | Complete |


    **Notable gaps vs. design**: Per-language CaCLR results for all 20 core languages
    are not shown (only tier averages). CaCLR hyperparameter sensitivity analysis
    is absent. Gemma 4 results are summarized in one row of Table 14 rather than given
    full treatment. The design document''s Figure descriptions (Figures 1–11, S1–S3)
    suggest rich visualizations that are not evaluable from the tables alone.


    ---


    ## 6. Actionable Revision Recommendations (Priority-Ordered)


    1. **Clarify and discuss the parallel activation requirement** for L_consistency.
    Explicitly state what data CaCLR needs, compare this requirement to few-shot baselines,
    and discuss degraded-parallel or dictionary-based alternatives. (Addresses W1)


    2. **Add statistical significance tests** — at minimum, paired bootstrap across
    languages for all CaCLR vs. baseline comparisons. Report standard deviations for
    tier-averaged metrics. (Addresses W2)


    3. **Add Procrustes alignment and Deep CORAL as baselines.** These are near-minimal
    domain adaptation baselines that contextualize CaCLR''s contribution. Cite and
    discuss the DA literature. (Addresses W3)


    4. **Report layer-fixed comparisons** alongside the per-method-optimal comparisons.
    Table 2 does this for L56 — replicate for CaCLR''s optimal layer and the zero-shot
    optimal layer. (Addresses W4)


    5. **Fully specify the prescriptive accuracy evaluation** for the decomposition.
    Define target, held-out set, threshold, and baselines. This is the strongest novel
    element of Claim 2 and deserves expansion. (Addresses W5)


    6. **Restructure claims**: demote orthogonality (Claim 4) to supporting analysis
    and foreground the decomposition''s prescriptive value. Consider a 3-claim structure:
    Discovery → Analysis → Method. (Addresses W6)


    7. **Add CaCLR hyperparameter sensitivity analysis** (α, β sweep). (Addresses
    Q4)


    ---


    ## 7. Final Verdict


    **Score: 4 / 6 (Weak Accept)**


    **Justification**: The paper fills a genuine gap by extending probe-based calibration
    to multilingual settings, with ambitious experimental coverage across 3 architectures,
    52 languages, and 3 benchmarks. The Pareto frontier discovery and CaCLR''s frontier-shifting
    capability are the strongest contributions. However, cumulative concerns prevent
    a higher score: (1) CaCLR''s parallel data requirement is underspecified and the
    framing is misleading; (2) the absence of uncertainty quantification across all
    results is a significant gap; (3) missing domain adaptation baselines leave CaCLR''s
    advantage over simpler alignment methods unestablished; (4) individual claim novelty
    is moderate at best. The paper is above the reject threshold on experimental breadth
    and practical value, but below clear acceptance on methodological rigor and novelty.
    A revision addressing the top 5 recommendations would likely move this to a solid
    accept.


    **Recommended decision**: Accept with major revisions (if venue allows) or Weak
    Accept contingent on author response addressing W1, W2, W3, and W4.'

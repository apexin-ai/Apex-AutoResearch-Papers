    语言在 Llama4 上对最优迁移层的偏好更分散，Pareto 结构存在但更 noisy。 与 Qwen3 的 frontier agreement 0.67
    说明两个架构共享定性趋势（"中层比深层 迁移更好"）但定量最优点不同——这正是 "architecture-dependent" claim 的证据。 低资源仅
    2/5 通过，sw 和 te 勉强过线，my/am/yo 失败。

    '

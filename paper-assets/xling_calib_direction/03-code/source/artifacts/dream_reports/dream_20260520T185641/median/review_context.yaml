    的 structural property，不是英语特有的。但 resource-tier gradient（high 0.06 → low 0.15） 表明该
    property 在低资源语言上更弱——这可能是因为模型在低资源语言上的 confidence calibration 本身就差，confidence direction
    拟合不稳定。Cross-architecture 一致性 0.78 进一步强化了 structural claim。Paper 应呈现为 "orthogonality
    universally holds (all cos < 0.25) but varies in degree, with implications for
    why output-based calibration is structurally limited across all languages — but
    especially limited for high-resource languages where the orthogonality is strongest."

    '

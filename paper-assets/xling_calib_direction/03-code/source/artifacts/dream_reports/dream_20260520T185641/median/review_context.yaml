  figures_description:
  - 'Figure 1a: Pareto frontier scatter — x-axis: English AUROC, y-axis: zero-shot
    transfer mean AUROC (19 langs). Each point is one probed layer (L0–L92), color-coded
    by depth percentage. Clear upward-then-left curve: shallow layers cluster at bottom-left
    (both low), mid layers at upper-right of transfer axis (L40 peak), deep layers
    drift right on English axis but downward on transfer. Pareto-efficient frontier
    connects L40→L48→L56→L64→L76. Annotate L40 ("best transfer") and L76 ("best English").

    '
  - 'Figure 1b: Layer-depth profile — dual y-axis plot. Left axis: English AUROC (blue,
    rising then plateau). Right axis: ZS transfer mean (orange, rising then falling).
    Crossover region around L44–L52 clearly visible. Shaded band shows ±1σ across
    19 languages on the transfer curve — band widens at deeper layers.

    '
  - 'Figure 1c: Heatmap — rows: 19 languages (grouped by resource tier), columns:
    24 layers. Cell color: zero-shot AUROC. Clear gradient: high-resource rows are
    warm (0.65–0.76) across most layers; low-resource rows are cool (0.50–0.64) with
    the warm zone concentrated at mid-depth layers. Visual pattern immediately shows
    depth-transferability × resource interaction.

    '
  analysis: 'Qwen3-235B exhibits a textbook Pareto frontier for Claim 1. The depth-transferability
    tradeoff is sharp: 36 layers separate the best-EN (L76) and best-transfer (L40)
    operating points, with 16.8pp transfer degradation at L76. The layer ranking consistency
    ρ=0.71 means 19 languages broadly agree on which depths transfer best, supporting
    the claim that this is a structural property of the model rather than a language-specific
    artifact. Low-resource languages show the expected fragility: 3/5 pass but am
    and yo fall below the 0.60 AUROC threshold even at the optimal transfer layer.
    This will be framed as a resource-tier modulation of the Pareto frontier rather
    than a failure of the phenomenon. Mean-shift''s continued failure (replicating
    MVP) cleanly motivates CaCLR.

    '

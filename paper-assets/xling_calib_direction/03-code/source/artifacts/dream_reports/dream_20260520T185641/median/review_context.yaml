    transfer" 的 framing，而非 "大幅超越" 的 framing。核心发现：(1) CaCLR 在 zero-label 设定下 接近 few-shot-100
    的性能（差 0.5pp AUROC，差 0.4pp ECE），这是 practical value 的 来源；(2) vs linear projection
    仅 +1.3pp，但 CaCLR 不需要任何 target-language 数据 结构假设（linear projection 假设线性可分对齐），是更
    principled 的方案；(3) consistency term 的 ablation 清晰显示其主要贡献在 mid-resource 语言（+1.6pp），

    belebele_best_transfer_layer_qwen3: L44
    mmlupx_en_auroc_best: 0.824
    mmlupx_zs_transfer_mean_at_best_transfer: 0.681
    mmlupx_pareto_replicates: true
    mmlupx_caclr_vs_linproj_pp: 1.6
    mmlupx_best_transfer_layer_qwen3: L40
    belebele_low_resource_pass_rate: 0.6
    mmlupx_low_resource_pass_rate: 0.4
  result_rationale: 'Pareto frontier 作为 representation structure 的 property，不应依赖特定
    benchmark。 Belebele（阅读理解）和 MMLU-ProX（更难 STEM 题）提供了两个不同难度和认知类型的 测试。Belebele 稍简单，英语
    AUROC 稍低（0.798 vs 0.812）因为 reading comprehension 的 correctness 比 knowledge QA
    更依赖 surface patterns，linear probe 的 ceiling 更低。 但迁移质量稍高（0.708 vs 0.696）因为阅读理解的跨语言
    pattern 更相似。MMLU-ProX 更难，英语 AUROC 更高（0.824）因为难题的 correctness signal 更 salient（模型更
    "确定" 自己是否知道），但迁移稍差（0.681）因为 STEM 知识的跨语言 variation 更大。 CaCLR 在 MMLU-ProX 上优势稍大（+1.6pp
    vs +1.1pp）因为更难的题目有更多 distribution shift 可以被 consistency term 修正。两个 benchmark 都复现了
    Pareto 结构，确认其 generalizability。低资源在 MMLU-ProX 上更差（2/5 vs 3/5）因为难题放大了数据不足的问题。


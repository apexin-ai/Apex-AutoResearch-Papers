- name: CaCLR Implementation and Comparative Evaluation
  plan_id: plan_003
  description: 'L_CaCLR = L_BCE + α·L_SB-ECE + β·L_consistency. Trained using English
    correctness labels + unlabeled parallel activations from 19 target languages.
    Hyperparameter sweep: α∈{0.1,0.2,0.3,0.5,1.0}, β∈{0.05,0.1,0.15,0.2,0.3}. Compared
    against 4 baselines across full Pareto frontier for both models × 20 languages.

    '
  expected_results:
    best_alpha: 0.3
    best_beta: 0.15
    qwen3_L40_caclr_auroc_mean: 0.738
    qwen3_L40_caclr_ece_mean: 0.112
    qwen3_L40_linproj_auroc_mean: 0.724
    qwen3_L40_zeroshot_auroc_mean: 0.696
    qwen3_L40_caclr_vs_linproj_pp: 1.4
    qwen3_L76_caclr_auroc_mean: 0.695
    qwen3_L76_linproj_auroc_mean: 0.678
    qwen3_L76_caclr_vs_linproj_pp: 1.7
    llama4_L32_caclr_auroc_mean: 0.717
    llama4_L32_linproj_auroc_mean: 0.705
    llama4_L32_caclr_vs_linproj_pp: 1.2
    caclr_vs_linproj_auroc_delta_mean_pp: 1.3
    caclr_ece_reduction_vs_tempcal_pct: 21.1
    caclr_improvement_over_zs_pass_rate: 0.89
    caclr_improvement_over_linproj_pass_rate: 0.74
    qwen3_caclr_optimal_layer: L52
    qwen3_zs_optimal_layer: L40
    qwen3_frontier_shift_layers: 12
    llama4_caclr_optimal_layer: L36
    llama4_zs_optimal_layer: L32
    llama4_frontier_shift_layers: 4
    caclr_fails_vs_linproj_langs:
    - th
    - my
    - am
    - yo
    - te
    mean_shift_any_improvement: 1
  result_rationale: 'CaCLR 在 median 档位下表现为 "matches or marginally exceeds linear projection"。
    核心原因：consistency term（L_consistency）对齐的是 unlabeled parallel activations 的 probe
    output distribution，在中-高资源语言中有效（parallel corpus 质量好， 激活空间足够对齐），但在低资源语言中由于 (a)
    GlobalMMLU 翻译噪声 (b) tokenizer 覆盖率低导致 activation 本身质量差，consistency 信号变成噪声。因此 CaCLR
    比 zero-shot 有显著改善（+4.2pp at L40），但比 linear projection 仅高 1.3pp 平均—— 因为 linear
    projection 已经利用了 target-language activations 做对齐。CaCLR 的 真正优势在 Pareto shift：它把最优工作层从
    L40 推到 L52（Qwen3），在更深层维持 迁移质量，同时获得 +2.0pp 英语 AUROC。SB-ECE loss 使 CaCLR probe 自带
    calibration， ECE 比 temperature-scaled zero-shot 低 21.1%——这是方法论层面的 practical benefit。
    Hyperparameter 敏感度中等：α=0.3 在 0.2-0.5 范围内差异小于 0.5pp，β 更敏感—— β>0.2 时 consistency
    过强导致英语 AUROC 下降。5 个失败语言（th/my/am/yo/te） 中 4 个是低资源或 activation 质量低的语言，th 是 mid-resource
    但独特的声调语言 导致 alignment 困难。

    '

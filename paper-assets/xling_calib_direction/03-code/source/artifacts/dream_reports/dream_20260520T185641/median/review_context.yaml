narrative_guidance: 'Rebalance toward discovery + analysis. Claim 1 (Pareto frontier)
  becomes the headline contribution — first systematic characterization of depth-transferability
  tradeoff across architectures and 20 languages. Claim 2 reframes decomposition as
  ''partial but prescriptive'': difficulty component is clearly transferable, capability
  residual is noisy but the decomposition still predicts when simple baselines suffice
  vs when CaCLR helps. Claim 3 softens: CaCLR is presented as ''matching or exceeding
  the best simple baseline (linear projection) while requiring no target-language
  data at all'' — emphasize the zero-label setting rather than raw metric superiority.
  Add ablation showing where CaCLR''s consistency term specifically helps (mid-resource
  languages). Claim 4 presented with resource-tier analysis showing orthogonality
  is robust for well-represented languages but noisier for low-resource. Headline:
  ''Cross-lingual calibration probes reveal architecture-dependent Pareto frontier;
  CaCLR matches supervised transfer without target labels.''

  '
imagined_experiments:
- name: Full Pareto Frontier — Qwen3-235B-A22B
  plan_id: plan_001
  description: '94-layer MoE model, INT8 quantization. 24 probed layers (every 4th:
    L0–L92). 20 languages (7 high / 8 mid / 5 low resource). English logistic-regression
    correctness probes trained per layer, evaluated on 5 transfer conditions (zero-shot,
    mean-shift, linear projection, few-shot 25/100, CaCLR placeholder). Core Pareto
    frontier data for Claim 1.

    '
  expected_results:
    en_auroc_best: 0.812
    en_best_layer: L76

- name: Additional Benchmark Evaluation
  plan_id: plan_007
  description: 'Evaluate best probes + CaCLR on Belebele (20 languages, reading comprehension)
    and MMLU-ProX (20 languages, harder STEM questions). Tests generalization of Pareto
    frontier and CaCLR beyond GlobalMMLU.

    '

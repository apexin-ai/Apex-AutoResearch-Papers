    even at moderate depths.'
  - 'Figure 8b: Bar chart of artifact rate by resource tier with 95% CI. Error bars
    computed via bootstrap over languages within each tier. The CI for MID tier overlaps
    substantially with LOW tier — the artifact problem is not confined to low-resource.'
  - 'Figure 8c: Scatter plot of selectivity vs ZS AUROC across all language-layer-model
    combinations. Strong positive correlation (rho=0.68) suggests many ''successful''
    ZS transfer results are artifacts.'

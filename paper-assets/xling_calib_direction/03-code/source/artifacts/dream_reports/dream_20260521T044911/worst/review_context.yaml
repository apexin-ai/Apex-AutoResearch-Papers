    rate 波及中资源语言是 field-level 发现：不是"低资源语言有问题，审稿人可以忽略"，而是 "所有跨语言 probing 研究——包括那些只看中/高资源语言的——都需要
    selectivity 检验"。 Selectivity 与 ZS AUROC 的高相关性 (rho=0.68) 尤其尖锐：它暗示 cross-lingual
    probing 文献中的许多 positive results 可能是 capacity artifacts。这个 finding 独立于 本文的其他所有
    claims——即使 Pareto, CaCLR, decomposition 全部失败，这个方法论贡献 仍然足以支撑一篇 findings paper。首次在
    cross-lingual transfer 场景应用 Hewitt & Liang selectivity 框架，发现 artifact 问题远比 monolingual
    probing 严重——这是 reframe 后 paper 叙事的 structural foundation。

    '

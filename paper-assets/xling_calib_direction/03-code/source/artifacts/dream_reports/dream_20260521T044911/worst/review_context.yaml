    control_artifact_rate_low: 0.38
  result_rationale: 'Dense 架构避免了 MoE routing 的 non-monotonic 噪声，global rho marginally
    significant (p=0.045)——pareto_spearman_rho_significant_archs 从 0 变为 1。但这反而增加了叙述复杂性：
    Pareto 是 architecture-dependent 的，dense 模型有 moderate tradeoff，MoE 没有。 无法声称 depth-transfer
    tradeoff 是普遍现象。EN AUROC 0.742 在 worst 范围内。 Control artifact rate 对低资源语言 38%，确认这不是
    MoE-specific 的问题。 作为 camera-ready 扩展，Gemma 增加了 architecture coverage 但不改变核心叙事。


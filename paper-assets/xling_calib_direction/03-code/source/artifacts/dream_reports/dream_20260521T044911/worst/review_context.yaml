- name: CaCLR Implementation and Comparative Evaluation
  plan_id: plan_003
  description: CaCLR (BCE + α·SB-ECE + β·MMD), β sweep 3 OOM, α sweep, component ablation,
    vs 4 baselines, 2 models × 20 langs
  expected_results:
    caclr_mean_delta_auroc_vs_zs_qwen: -0.008
    caclr_mean_delta_auroc_vs_zs_llama: -0.012
    caclr_mean_delta_auroc_combined: -0.01
    caclr_best_beta: none — all β values inert or harmful
    caclr_best_alpha: 0.1
    beta_sweep_results:
      beta_0.001:
        mean_delta_auroc: -0.003
        std: 0.018
      beta_0.01:
        mean_delta_auroc: -0.006
        std: 0.021
      beta_0.1:
        mean_delta_auroc: -0.011
        std: 0.025
      beta_1.0:
        mean_delta_auroc: -0.019
        std: 0.031
    alpha_sweep_results:
      alpha_0.01:
        mean_delta_auroc: -0.002
        mean_delta_ece: 0.008
      alpha_0.1:
        mean_delta_auroc: -0.005
        mean_delta_ece: 0.003
      alpha_1.0:
        mean_delta_auroc: -0.012
        mean_delta_ece: -0.002
      alpha_10.0:
        mean_delta_auroc: -0.028
        mean_delta_ece: -0.005
    component_ablation:
      bce_only:
        delta_vs_zs: -0.001
        note: retraining from scratch ~= standard LR
      bce_plus_sbece:
        delta_vs_zs: -0.007
        note: SB-ECE regularization hurts discrimination
      bce_plus_mmd:
        delta_vs_zs: -0.005
        note: MMD inert to slightly harmful
      full_caclr:
        delta_vs_zs: -0.01
        note: combined losses compound harm
    linear_proj_vs_caclr_delta: 0.048
    fewshot100_vs_caclr_delta: 0.061
    implementation_spec:
      mmd_kernel: Gaussian RBF, bandwidth=median heuristic
      optimizer: Adam, lr=1e-3, cosine schedule
      epochs: 50
      early_stopping: patience=10 on held-out BCE loss
      initialization: from standard LR solution
      batch_size: 256
      mmd_items: same items as BCE (probe_train split)
      parallel_set_size_range:
      - 612
      - 2847
  result_rationale: 'CaCLR 失败的根本原因：MMD 在 probe logits 空间操作，而 logits 是 1-D（线性 probe
    的单一输出）。 1-D MMD 只能 match 两个标量分布的 marginal，无法对齐 correctness direction 的方向性结构。 即使
    marginal logit 分布被 match，EN 和 target 的 conditional distributions P(logit|correct)
    vs P(logit|incorrect) 可能仍然不同——Zhao et al. (2019) 的理论预测得到验证。β 越大，MMD 约束越强， logits
    被拉向无区分性的 marginal match，discrimination 下降。α 高值时 SB-ECE 正则化 进一步牺牲 AUROC 以换取 calibration
    改善，但改善微小且不稳定。Component ablation 证实 每个额外 loss component 都是净负面的——base BCE（从 LR solution
    初始化再微调）已经接近 ZS 性能， 额外优化无正贡献。Linear projection 和 few-shot 都显著优于 CaCLR，因为它们直接利用
    target-language 信息（parallel pairs 或 labels）而非试图间接 match distributions。 CKA subspace
    解释（correctness direction 是 low-dimensional language-agnostic subspace） 不成立——如果该
    subspace 真的存在且 robust，MMD 应该至少能做到无害，但实际上有害， 说明 correctness signal 的跨语言结构比预期更 language-specific。

    '

    在所有 3 OOM 均为 inert 或 harmful—— 这不是超参选择问题而是方法论层面的失败。1-D MMD 的结构性限制（probe logit
    空间太低维）加上 conditional distribution mismatch（Zhao et al. 2019）导致 distributional
    matching 路径被彻底关闭。 与此同时，CKA subspace 解释也不成立（plan_011 将确认），所以"MMD 失败是因为它只 match
    marginal 而不 match subspace direction"这个 elegant 的解释也变成了 post-hoc rationalization——
    实际上 subspace 本身就不 robust。这是 worst tier 最痛苦的部分：不仅方法失败，解释也失败。 但作为 negative result，reproducibility
    标准高：完整的 implementation spec、β/α sweep、 component ablation 使社区可以独立验证，避免重复尝试 distributional
    matching 路径。

    '

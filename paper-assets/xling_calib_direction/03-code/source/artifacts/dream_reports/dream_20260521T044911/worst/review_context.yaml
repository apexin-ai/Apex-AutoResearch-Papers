    matrix——50 pairs 在高维空间中 rank-deficient，低资源语言的 parallel pairs 质量更差（翻译质量低→activation
    噪声→需要更多 pairs 来 average out noise）。 (2) Resource-tier 分层仍然存在（HIGH 68 pairs vs
    LOW 182 pairs）但 tier 内方差大—— 同一 tier 内语言间差异可达 2-3×（如 zh 需 45 pairs 但 ja 需 95 pairs，都是

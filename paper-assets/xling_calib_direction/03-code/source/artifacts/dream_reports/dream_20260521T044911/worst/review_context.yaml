    (Llama partial rho=+0.41, p=0.006) 被确认为 small-sample artifact。当 20 语言数据进入分析后：(1)
    新增的 15 种语言中多数与 CKA-transfer 关系不一致，部分语言（特别是 MID/LOW tier）的 CKA 模式与 pilot 的 5 种语言截然不同——
    pilot 恰好选中了 CKA 与 transfer 最相关的语言子集（zh, ar 高 CKA + 低 degradation 拉高了相关性）。 (2)
    Partial correlation controlling for depth 大幅缩水：Qwen rho 从 pilot 的 +0.18 降至 +0.11
    (仍 n.s.)， Llama rho 从 +0.41 骤降至 +0.08。原因是新增语言打破了"within-layer CKA predicts transfer"的模式——
    同一层内不同语言的 CKA 值差异巨大但 transfer 性能差异不 track CKA。 (3) Same-layer cross-language analysis
    (n=20 per layer) 是最强检验：median rho=0.15， 仅 2/24 Qwen layers 和 0/12 Llama layers
    达到显著——CKA 在 within-layer 水平几乎无解释力。 (4) Subspace angle analysis 显示 correctness
    direction 的跨语言一致性远低于预期—— angles 在 15-65° 范围波动，不支持"robust low-dimensional language-agnostic
    subspace"的说法。 结论：CKA 不提供超越 depth 的解释力，必须从"geometric analysis"降级为"suggestive correlation"。


    Paradox 从 Llama rho=+0.41 (p=0.006) 崩溃到 rho=+0.08 (p=0.42)——这是教科书式的 small-sample
    inflation。 5 语言 pilot 恰好 overrepresented CKA-transfer 关系最强的语言（zh, ar），排除了关系最弱的语言。
    Subspace angle analysis 进一步否定了"correctness direction is a robust low-dimensional
    language-agnostic subspace"的前提假设：即使 HIGH resource 语言的 angle 也有 15-35° 的 spread，
    LOW resource 达到 48-65°（近乎不相关）。这意味着 Miao & Ungar (2026) 的 EN-only correctness direction
    在跨语言场景下不是 language-agnostic 的——这本身是一个重要的 negative finding，值得在 paper 中强调。 CKA 框架从
    geometric analysis 降级为 descriptive visualization（仅展示 CKA 随 depth 的下降趋势）， 不再承载解释性角色。

    '

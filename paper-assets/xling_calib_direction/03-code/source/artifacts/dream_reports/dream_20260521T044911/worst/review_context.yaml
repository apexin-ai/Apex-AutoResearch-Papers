narrative_guidance: '原始几何洞见 framing 全面崩塌。Simpson''s Paradox 在 20 语言全量验证中双架构均不显著（Qwen
  partial rho=+0.11, p=0.31; Llama partial rho=+0.08, p=0.42）， CKA 在 depth 之外无额外解释力——5
  语言 pilot 结果被确认为 small-sample artifact。CaCLR 三个 OOM 的 β sweep 证实 consistency loss
  完全 inert，且几何子空间解释也不成立：correctness direction 的跨语言 persistence 远弱于预期，非 robust low-dimensional
  subspace。 Pareto frontier 噪声极大，20 语言中仅 2-3 个达到 per-language 显著性，non-monotonic 模式普遍存在。控制任务分析揭示问题远超预期——
  不仅低资源语言 artifact rate 达 42%，中资源语言也有 37% 层级组合出现 capacity artifacts，这对整个跨语言 probing
  文献构成方法论挑战。 Difficulty decomposition 完全无效，random-direction control 产生同量级效果。Linear
  projection 需要 120-180 pairs（非 50）， 且 Procrustes 效果反转阈值在语言间高度不一致，无法给出可靠的单一阈值。 新 framing
  路线：''The limits of cross-lingual calibration probe transfer — a large-scale negative
  result with methodological implications''。 三层贡献重构：(1) 控制任务发现是最强贡献——首次在 cross-lingual
  probing 场景系统性应用 selectivity 检验，>35% artifact rate 对整个领域有直接 implication；(2) 综合 negative
  result 同时关闭 distributional matching 和 geometric alignment 两条路径， 附完整 ablation 和 sweep
  数据；(3) 条件性实用指导——linear projection 作为唯一可行方案但需 100+ pairs， 按 resource-tier 和 baseline
  ZS quality 分层推荐。仍可发 EACL 作为 rigorous negative result + methodology paper。

  '

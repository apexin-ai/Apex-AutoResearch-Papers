    而非 correctness signals。 (2) 中资源语言出现 37% artifact rate 是 worst tier 的 signature
    finding： 这不仅仅是"低资源语言有问题"——tr, th, vi 等中资源语言在浅层也有大量 artifacts， 说明 probing methodology
    在 cross-lingual 场景的可靠性比预期差得多。 (3) Selectivity 与 ZS AUROC 高度相关（rho=0.68），暗示许多看似成功的
    cross-lingual transfer 结果其实是 capacity artifacts 在目标语言中的 shadow。 这对整个跨语言 probing
    文献有 field-level implication：任何不包含 control task 检验的 跨语言 probing 研究的结论都值得质疑。这是首次在

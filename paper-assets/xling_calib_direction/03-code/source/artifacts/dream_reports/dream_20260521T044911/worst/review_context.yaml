  result_rationale: 'Difficulty decomposition 在 worst tier 无实质效果。两个原因：(1) difficulty
    和 capability 信号在 representation 空间中高度纠缠——IRT difficulty direction 不是一个干净的、可投影去除的独立子空间，
    而是与 correctness signal 共享大量方差。投影去除 difficulty 后 correctness signal 也被部分损坏， 导致
    retrained probe 的 transfer 性能与原始相当甚至略差。(2) Random-direction control 产生 同量级的效果（mean
    delta -0.005 vs -0.003，paired test p=0.42），这意味着观察到的微小变化 主要来自 dimensionality reduction
    效应而非 difficulty-specific 投影。Difficulty probe 本身 R²=0.31（低于理想值），表明 IRT difficulty
    在 LLM representation 中的编码不够线性/集中， 使得 linear projection 无法有效捕获它。整个 decomposition
    framing 在经验层面被否定： transfer 的降解不能归因于 capability-specific component，或者说两个 component

- name: CKA Cross-Lingual Similarity & Simpson's Paradox Analysis
  plan_id: plan_011
  description: 'Linear CKA (EN vs each target) at every probed layer, 20 languages
    × 2 models。核心分析：(a) same-layer cross-language correlation (n=20 per layer), (b)
    partial Spearman controlling for normalized depth — THE single most important
    analysis, (c) subspace angle quantitative analysis, (d) CKA cliff threshold identification。验证
    pilot finding 的 Simpson''s Paradox 在 full-scale 上双架构复现。

    '
  expected_results:
    qwen3_raw_rho: -0.36
    qwen3_raw_p: 0.0001
    llama4_raw_rho: -0.41
    llama4_raw_p: 0.0001
    qwen3_partial_rho: 0.48
    qwen3_partial_p: 0.002
    qwen3_partial_bootstrap_ci_95:
    - 0.31
    - 0.62
    llama4_partial_rho: 0.41
    llama4_partial_p: 0.008
    llama4_partial_bootstrap_ci_95:
    - 0.22
    - 0.57
    simpson_paradox_confirmed_both_archs: true
    qwen3_per_layer_positive_count: 18
    qwen3_per_layer_significant_count: 6
    llama4_per_layer_positive_count: 9
    llama4_per_layer_significant_count: 3
    qwen3_cka_peak_layer: 16
    qwen3_cka_peak_value: 0.82
    qwen3_cka_at_en_optimal_layer: 0.28
    qwen3_cka_cliff_onset_depth_pct: 55
    llama4_cka_peak_layer: 12
    llama4_cka_peak_value: 0.84
    llama4_cka_at_en_optimal_layer: 0.35
    llama4_cka_cliff_onset_depth_pct: 50
    transfer_collapse_cka_threshold: 0.35
    below_threshold_mean_zs_auroc: 0.58
    above_threshold_mean_zs_auroc: 0.72
    correctness_subspace_angle_within_layer_mean_deg: 12.4
    correctness_subspace_angle_across_layer_mean_deg: 38.7
    correctness_direction_persists_despite_global_cka_decline: true
  result_rationale: 'Simpson''s Paradox 的 causal mechanism：depth 同时作用于 CKA（deeper
    → representations diverge → CKA drops）和 transfer AUROC（deeper → EN probe stronger
    → higher absolute AUROC up to a point），创造了一个 confound。 Raw pooled correlation
    为负是因为 shallow layers 有 high CKA 但 low AUROC （probe 本身弱），deep layers 有 low CKA
    但 higher AUROC（probe 强虽然 transfer degrades）。控制 depth 后，within 每个 layer，higher
    CKA 的 语言确实有 better transfer，partial rho 为正。

    MVP pilot（Llama, 5 langs × 9 layers）已展现 rho=+0.41, p=0.006。 Full-scale（20 langs
    × 12-24 layers）增强统计 power：per-layer test 从 n=5 增至 n=20，partial correlation 的 bootstrap
    CI 不含零。

    Qwen3 partial rho (0.48) 高于 Llama4 (0.41)，与 Qwen 的 steeper CKA cliff 一致：Qwen 的
    CKA 变异范围更大（peak 0.82 → floor 0.28 vs Llama 0.84 → 0.35），为 partial correlation
    提供更多 signal。

    MVP Qwen pilot 仅 rho=+0.18 (p=0.274)，full-scale上升至 0.48 是因为： (1) n 从 5 增至 20 语言，power
    大幅提升；(2) 20 语言覆盖更宽的 CKA 范围（增加了 yo/ig/te 等极低 CKA 语言和 nl/pt 等高 CKA 语言）， 扩大了 within-layer
    variance。

    CKA cliff threshold ~0.35 标记了 "transfer collapse zone"：当 CKA 低于此阈值时，correctness
    direction 的 cross-lingual overlap 不足以 支撑 zero-shot transfer。Subspace angle analysis
    揭示 correctness direction 在同一 layer 内跨语言仅旋转 ~12°（highly aligned），但跨 layer 旋转 ~39°（significant
    drift），解释了为何 within-layer CKA 预测 transfer 但 raw pooled 不预测。

    '

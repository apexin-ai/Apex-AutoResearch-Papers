    内跨语言仅 ~12° 偏差（near-universal），但跨 layer 偏差 ~39°（significant rotation）。这解释了为何 CKA（衡量全局
    representation similarity）与 transfer（衡量 correctness direction alignment）的关系 需要控制
    depth 后才能显现：全局 CKA 下降反映的是 non-correctness dimensions 的 divergence，correctness
    subspace 本身作为 low-dimensional feature 持续存在。

    CKA cliff threshold ~0.35 直接解释了 Qwen3 vs Llama4 tradeoff 差异： Qwen3 的 CKA cliff
    更陡（L52→L60 从 0.45 降至 0.38），导致更多语言 在 deep layers 穿越 threshold → strong tradeoff；Llama4
    的 cliff 更缓 （L28→L36 从 0.55 降至 0.45），且 ar/hi/ko 因高 baseline CKA 从不穿越 threshold
    → weak/mixed tradeoff。

    这一分析将 Claim 1 的 Pareto observation 与 CKA geometry 连接，构成 完整的 geometric explanation：architecture-dependent
    CKA cliff steepness → architecture-dependent Pareto frontier strength。

    '

tier: best
narrative_guidance: '原始 framing 完全成立。以 Simpson''s Paradox 几何洞见为核心新颖性开篇—— raw CKA-transfer
  correlation 为负（depth confound），partial correlation controlling for depth 在双架构上均显著为正（p
  < 0.01），揭示 within-layer CKA genuinely predicts transfer quality。CaCLR 作为正面方法贡献（+3.5pp
  mean over ZS），不是 headline 但 构成因果链第三环。标题强调 ''geometric analysis reveals when and
  why cross-lingual calibration transfer succeeds''。四条 claim 完整因果链保留：Pareto discovery（architecture-
  dependent depth-transferability tradeoff）→ Decomposition analysis（difficulty vs
  capability separation）→ CaCLR method（consistency loss provides measurable gain at
  deep layers）→ CKA geometric explanation（Simpson''s Paradox, subspace persistence）。
  Control task warning（28% low-resource artifacts）和 linear projection sample efficiency
  （~42 pairs to 95%）作为加分实证贡献。Procrustes effect reversal（threshold ~0.52） 为 practitioner
  提供直接指导。无需弱化任何 claims。

  '

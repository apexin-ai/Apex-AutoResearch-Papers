tier: median
narrative_guidance: 'CaCLR consistency loss (MMD) 在完整 β sweep 中无显著 AUROC 提升，转为 negative
  result framing。 几何解释：MMD 匹配边际分布但无法对齐低维 directional structure——correctness 方向占据 1-3
  维子空间， MMD 在 1-D probe logit 空间操作无法捕捉旋转。Linear projection 直接学习子空间旋转故成功。 Simpson''s
  Paradox 仅在 Llama 4 Scout 上显著（partial rho~0.29, p~0.02），Qwen3-235B 上 trending 但不显著（rho~0.16,
  p~0.07）——用 hedged language 报告为架构依赖发现。Claim 2 decomposition 定性分离成立但 prescriptive
  预测力弱——弱化为 ''descriptive separation observed''。 标题转向 ''When Does Cross-Lingual Calibration
  Transfer Work? Geometric Analysis and Practical Solutions.'' 强化三个实用贡献：(1) linear
  projection ~70 pairs 推荐方案，(2) Procrustes effect reversal 阈值 ~0.55 作为 practitioner
  guidance，(3) ~30% low-resource probing artifacts 作为 methodological warning。 仍可投
  EACL——thorough empirical study + 架构依赖几何洞见 + systematic negative result + 实用指导。

  '

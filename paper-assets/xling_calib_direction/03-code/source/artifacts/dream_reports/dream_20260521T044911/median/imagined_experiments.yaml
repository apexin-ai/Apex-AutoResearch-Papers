    '
  analysis: 'Simpson''s Paradox 在 full-scale 上部分确认：Llama 4 Scout 上统计显著（partial rho=0.29,
    p=0.018），Qwen3-235B 上 trending 但不显著（partial rho=0.16, p=0.072）。 这一架构依赖性本身是有意义的发现。Paper
    中用 hedged language 报告： "In architectures where the CKA-depth gradient is steep
    (Llama 4 Scout), partial correlation controlling for depth reveals a significant
    positive relationship between CKA and transfer AUROC (rho=0.29, p=0.018), indicating
    that CKA provides genuine explanatory power beyond depth. In architectures with
    a delayed, step-function-like CKA decline (Qwen3-235B), the linear partial correlation
    is trending but not significant (rho=0.16, p=0.072), possibly because the non-linear
    depth-CKA relationship reduces the effectiveness of linear depth control." Subspace
    angle analysis 提供了 CKA 分析的定量补充——HIGH 语言角度小（zero-shot 可行）， LOW 语言角度大（需要 alignment）——这与
    Procrustes reversal 发现互洽。

    '
- name: Linear Projection Sensitivity & Procrustes Effect Reversal
  plan_id: plan_012
  description: 'Vary parallel pairs (10, 20, 50, 100, 200) for linear projection。
    两模型 × 5 代表层 × 20 语言。Resource-tier stratified saturation curves。 含 Procrustes effect
    reversal 分析。

    '
  expected_results:
    overall_pairs_to_95pct: 70
    per_tier_pairs_to_95pct:
      HIGH: 35
      MID: 55
      LOW: 75
    saturation_curve:
      pairs_10:
        pct_of_max: 0.42
        mean_delta_auroc: 0.013
      pairs_20:
        pct_of_max: 0.62
        mean_delta_auroc: 0.02
      pairs_50:
        pct_of_max: 0.84
        mean_delta_auroc: 0.027
      pairs_100:
        pct_of_max: 0.95
        mean_delta_auroc: 0.03
      pairs_200:
        pct_of_max: 1.0
        mean_delta_auroc: 0.032
    procrustes_reversal:
      threshold_estimate: 0.55
      threshold_ci_95:
      - 0.46
      - 0.63
      benefit_below_0.50:
        mean_delta: 0.058
        n_langs: 4
      ambiguous_0.50_0.62:
        mean_delta: 0.012
        n_langs: 8
      harm_above_0.62:
        mean_delta: -0.018
        n_langs: 8
    curve_cleanness: 'noisy, especially LOW tier (R² of saturation fit: HIGH=0.96,
      MID=0.91, LOW=0.78)'
  result_rationale: 'Linear projection（Procrustes alignment）通过学习 EN→target 的旋转矩阵对齐
    correctness subspace。Saturation 速度取决于子空间旋转的复杂度：HIGH 语言的 EN-target subspace 角度小（~10°），10-20
    pairs 就足以估计一个简单旋转，35 pairs 达到 95%；LOW 语言角度大 （~40-45°），需要更多 pairs 来稳定估计更复杂的旋转，75
    pairs 才达到 95%。 Overall 70 pairs（而非 pilot 预估的 ~50 pairs）因为 (1) 20 语言比 5 语言引入更多方差，
    (2) 部分低资源语言的 parallel data 翻译质量低（机翻 artifacts），增加了 noise。 Curves 在 LOW tier 不够干净（R²=0.78）——个别语言的饱和曲线不单调（20
    pairs 时偶然 好于 50 pairs），因为 parallel pair 的质量方差大。 Procrustes reversal 的机制：当 ZS AUROC
    已高（>0.62），EN probe 的 correctness direction 与 target 语言已经 well-aligned（subspace
    angle <15°），Procrustes 旋转引入的估计噪声 反而大于 alignment gain→净效果为负。当 ZS AUROC 低（<0.50），严重
    misalignment （angle >40°）使得 Procrustes 的 alignment gain 远大于估计噪声→净效果明显为正。 阈值 ~0.55
    对应 subspace angle ~20-25° 的平衡点。

    '
  tables:
  - name: Saturation Curves by Resource Tier (Qwen3-235B, L68)
    data: '| Pairs | HIGH ΔAUROC | MID ΔAUROC | LOW ΔAUROC | Overall ΔAUROC |


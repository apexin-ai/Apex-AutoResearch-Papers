    zone boundary。 第二行小图：同样 heatmap 但二值化（artifact yes/no），清晰显示 30% LOW + 28% MID 覆盖率。

    '
  analysis: 'Control task 发现是独立的 methodological contribution：首次在 cross-lingual probing
    中 系统性应用 Hewitt & Liang selectivity analysis，发现 ~30% low-resource 和 ~28% mid-resource
    language-layer 组合的 probing results 不可靠。Field-level implication: 所有 cross-lingual
    probing 研究（包括 Xiao et al.）应包含 selectivity checks。 在 paper 中：(1) 用 selectivity
    threshold 过滤不可靠结果后重新报告 main results （确认过滤后结论不变），(2) 将过滤信息作为 methodological recommendation
    在 main body 报告（不只是 appendix），(3) 讨论与 Voita & Titov MDL probes 的关系。

    '

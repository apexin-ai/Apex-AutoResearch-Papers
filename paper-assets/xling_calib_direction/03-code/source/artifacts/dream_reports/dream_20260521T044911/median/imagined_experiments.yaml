    不完全；(2) difficulty 和 capability 在 activation 空间中不正交—— projection 同时移除了部分 capability
    信息（ko/sw 中 AUROC 下降）；(3) 不同语言中 difficulty-capability 纠缠程度不同——高资源语言 capability
    独立于 difficulty（projection 帮助），低资源语言两者纠缠更深（projection 效果不确定）。Random-direction control
    显示 ~40% 的效果来自纯维度缩减（从高维投影到低维本身就降噪），只有 ~60% 是 difficulty-specific。这足以支持 "descriptive
    separation observed" 但不足以支持 "prescriptive decomposition predicts optimal strategy"。Prescriptive
    accuracy 仅 58% （随机猜 50%），几乎无实际预测价值。


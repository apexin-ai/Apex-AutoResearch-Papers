      linear_proj_200: 0.692
      few_shot_25: 0.678
      few_shot_100: 0.712
    caclr_per_tier_delta:
      HIGH: 0.001
      MID: 0.003
      LOW: 0.002
    implementation_spec:
      mmd_kernel: Gaussian RBF, median heuristic bandwidth
      optimizer: Adam, lr=1e-3, cosine schedule
      epochs: 50
      early_stopping: patience=10 on val BCE loss
      initialization: from standard LR solution
      batch_size: 256
      mmd_items: same as BCE (probe_train split)
      parallel_set_size_range:
      - 8200
      - 12800
  result_rationale: 'CaCLR 的 MMD consistency loss 在 1-D probe logit 空间操作——这是设计层面的根本局限。
    Correctness direction 是高维 activation 空间中的低维子空间特征（~1-3 维），MMD 匹配 probe logit 的边际分布（均值和方差）但无法对齐子空间内的方向结构。具体地：两种语言的
    probe logit 分布可能有相似的均值和方差（MMD 小），但 correctness direction 在 activation 空间中的朝向不同——MMD
    无法检测或纠正这种旋转。β=0.001-0.01 时 consistency loss 太弱， 无实质效果；β=0.1-1.0 时 consistency
    loss 开始干扰 BCE 训练（AUROC 下降），因为 强制匹配边际分布反而破坏了 EN probe 已经学到的 correctness direction。这不是
    hyperparameter 问题——是根本的 architectural mismatch。α (SB-ECE) 对 ECE 有轻微改善 是预期的（ECE
    loss 直接优化 calibration），但与 cross-lingual transfer 无关。 Linear projection 成功因为它直接学习子空间旋转矩阵（Procrustes
    alignment）， 绕过了 distributional matching 的局限。这一对比（MMD 失败 vs linear projection 成功）
    提供了对 Zhao et al. (2019) conditional-marginal mismatch theory 的实证验证。

    '
  tables:
  - name: β Sweep Results (Qwen3-235B, L80, mean across 20 languages)
    data: '| β     | Mean AUROC | ΔAUROC vs ZS | 95% Bootstrap CI    | Cohen''s d

      | Few-shot 100      | 0.712       | 0.693        | 0.703 | 100         | 0             |

      '
  - name: CKA Subspace Analysis — Why MMD Fails
    data: '| Language Tier | Mean subspace angle (EN-target) | MMD after CaCLR | Angle
      after CaCLR | Interpretation            |

      |--------------|----------------------------------|-----------------|--------------------|-----------------------------|

      | HIGH         | 12°                              | 0.02 → 0.01     | 12° →
      11°         | MMD reduces, angle unchanged |

      | MID          | 24°                              | 0.05 → 0.02     | 24° →
      23°         | MMD reduces, angle unchanged |

      | LOW          | 42°                              | 0.12 → 0.05     | 42° →
      40°         | MMD reduces, angle unchanged |

      '
  figures_description:
  - 'β sweep 图：x=β (log scale)，y=ΔAUROC vs zero-shot，每条线为一个 resource tier， shaded
    area 为 bootstrap 95% CI。所有线段在 y=0 附近震荡，β=1.0 时向下偏离。 水平虚线标注 linear projection 和
    few-shot 的 ΔAUROC 作为对比。

    '
  - '几何解释概念图：左侧显示 MMD 操作空间（1-D logit 分布），EN 和 target 分布重叠 但 correctness direction
    指向不同方向（3D activation 空间投影）；右侧显示 linear projection 直接旋转子空间使 direction 对齐。

    '
  analysis: 'CaCLR negative result 的核心贡献不是 method 本身，而是 (1) systematic β sweep 关闭
    MMD distributional-matching 路径（3 OOM, component ablation, 两个架构 × 20 语言）， (2) CKA
    subspace analysis 提供几何解释——MMD 成功减小了 marginal distance 但完全 无法对齐 correctness subspace
    的方向（subspace angle 几乎不变）。这验证了 Zhao et al. (2019) 的理论预测：当 conditional distributions
    P(Y|X) 在域间不同时， marginal matching 必然失败。在 correctness probing 中，P(correct|activation)
    的 条件结构在不同语言间确实不同（语言特异的 capability 成分），因此 MMD 注定无效。 Constructive path: linear projection
    以 50-80 parallel pairs 的极低成本解决了 subspace alignment 问题，是明确的 practical recommendation。

    '

  figures_description:
  - 'Saturation curve plot: x=number of parallel pairs (log scale), y=ΔAUROC vs zero-shot。
    三条线（HIGH/MID/LOW tier），每条带 shaded bootstrap 95% CI。 HIGH 线快速 plateau（30-40 pairs
    后几乎 flat），LOW 线缓慢上升且 CI 更宽。 Horizontal dashed line 标注 "95% of max improvement"。

    '
  - 'Procrustes reversal scatter: x=ZS AUROC (zero-shot baseline), y=ΔAUROC from linear
    projection (200 pairs)。每点一个 (language, model) pair，颜色编码 model。 LOESS 拟合曲线显示从正到负的渐变。Vertical
    band 标注 reversal threshold 及 95% CI。

    '
  analysis: 'Linear projection 的 sample efficiency 是最直接的 practical contribution： 70
    parallel pairs（约 2-3 小时标注工作）达到 95% of maximum improvement。 Resource-tier stratification
    为 practitioners 提供指导：HIGH 语言不需要 projection （可能有害），LOW 语言需要 ~75 pairs。Procrustes
    reversal 是重要的 practitioner caveat： 不加区分地对所有语言做 alignment 会损害已经 well-aligned 的语言。
    建议 deployment strategy: 先测试 zero-shot AUROC，低于 0.55 时使用 linear projection， 高于
    0.62 时直接使用 zero-shot。

    '
- name: Probing Control Tasks (Hewitt & Liang 2019) — Full Scale
  plan_id: plan_013
  description: '随机排列标签训练 control probes，计算 selectivity (real - control AUROC)， 2 模型
    × 20 语言 × 所有 probed 层。验证 AUROC 反映 genuine correctness direction。

    '
  expected_results:
    artifact_rate_low_resource: 0.3
    artifact_rate_mid_resource: 0.28
    artifact_rate_high_resource: 0.06
    artifact_threshold_selectivity: 0.05
    overall_artifact_rate: 0.18
    en_selectivity_profile:
      shallow: 0.03
      mid: 0.12
      deep: 0.25
    per_tier_selectivity_deep_layers:
      HIGH: 0.22
      MID: 0.14
      LOW: 0.06
    control_auroc_range:
    - 0.48
    - 0.52
    affected_layer_range: primarily layers 0-40% depth
  result_rationale: 'Pilot（Qwen2.5-7B, EN）显示 selectivity 在浅层低（L0-L12: 0.02-0.04）、深层高
    （L20-L27: 0.24-0.26）。跨语言扩展时，LOW 资源语言的 selectivity 全面下降： (1) 这些语言的 activations
    中 correctness signal 更弱（模型对这些语言"知道"更少）， (2) probe 在小 activation difference 上更依赖
    capacity 来拟合训练集。 LOW 资源语言在深层的 selectivity 仅 ~0.06（vs EN 的 ~0.25），许多 layer-language
    组合的 selectivity < 0.05 artifact threshold。30% 的 LOW resource layer-language 组合为
    artifacts。MID 资源语言出乎意料地也有 ~28% artifact rate——这是因为 MID 资源语言中包含一些 "表面高资源但 knowledge
    coverage 低" 的语言（如 tr, vi: 模型训练数据中 token 多但 MMLU 领域覆盖差）。HIGH 资源语言 artifact rate
    仅 6% （仅在最浅层 L0-L4）。这一发现波及范围比初始预期更广（从 "~28% low-resource" 扩展到 "~28% low + ~28%
    mid"），强化了 methodological warning 的重要性。

    '

        qwen3_mean_angle_LOW: 45
        llama4_mean_angle_HIGH: 12
        llama4_mean_angle_MID: 25
        llama4_mean_angle_LOW: 40
      cka_transfer_collapse_threshold: 0.32
      bootstrap_ci_partial_rho_qwen3:
      - -0.02
      - 0.34
      bootstrap_ci_partial_rho_llama4:
      - 0.06
      - 0.5
    result_rationale: 'Simpson''s Paradox 的架构依赖性源于 CKA-depth gradient 的形状差异。 Llama
      4 Scout 的 CKA depth gradient 更陡峭（从 peak 0.82 at L12 到 final 0.22 at L48, slope
      ~ -0.017/layer），这使得 depth confound 更强——controlling for depth 释放了更多 CKA 的独立解释力（partial
      rho=0.29, p=0.018）。Qwen3 的 CKA decline 起始更晚 （L64 才开始急降）且更集中在最深层，depth confound
      的影响不均匀——前 60% 层几乎 无 CKA 变化，后 30% 急降——这种非线性使得 linear partial correlation 效果较差
      （partial rho=0.16, p=0.072）。这不意味 CKA 在 Qwen3 上无解释力，而是 linear depth control 不够——可能需要
      non-linear depth control（如 depth²）才能捕捉 Qwen3 的 step-function-like CKA profile。但
      paper 应诚实报告：standard partial correlation 仅在 Llama 上显著。Per-layer analysis: 两个模型
      70-83% 的 per-layer rho 为正（Qwen 17/24, Llama 10/12），但因每层仅 n=20 语言，个别层的 significance
      有限。Full-scale 的 n=20 per layer 比 pilot 的 n=5 有更多 power，但仍不足以让所有 per-layer rho
      显著。 Subspace angle 分析提供定量补充：HIGH 语言角度小（10-12°）→ 零样本迁移好， LOW 语言角度大（40-45°）→ 需要
      alignment。CKA collapse threshold ~0.32 是 transfer 从 "reasonable" 骤降到 "chance-level"
      的拐点。

      '

        rank_correlation_with_globalmmlu: 0.91
      linear_proj_generalizes: true
      caclr_still_inert: true
      cross_benchmark_lang_ranking_rho: 0.88
    result_rationale: 'Belebele 是阅读理解任务，与 GlobalMMLU 的知识型 MCQA 不同——correctness signal
      的性质不完全相同（RC 依赖 passage comprehension, MCQA 依赖 parametric knowledge）， 所以 EN AUROC
      略低（0.74 vs 0.78）且 transfer 更差。但 Pareto 结构保留，因为 depth-transferability tradeoff
      是 representation geometry 的性质，不依赖特定任务。 MMLU-ProX 与 GlobalMMLU 高度相关（同源翻译数据），所以模式几乎一致。
      Language ranking 在 benchmarks 间高度相关（rho=0.88）——确认结果不是 benchmark-specific。 CaCLR
      在两个 benchmark 上仍无效，linear projection 仍有效——泛化性确认。


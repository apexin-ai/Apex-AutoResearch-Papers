      (L52, 55% depth) 之间有 20 层间隔（MVP 仅 3 层）。Strong Pareto 源于 Qwen 架构特征：MoE routing
      在深层产生 language-specific expert 激活模式， 导致 correctness direction 的 cross-lingual
      alignment 在 L60 后急剧下降。 15/20 languages 的 per-language Spearman rho 显著为负，表明 tradeoff
      是 跨语言一致的。2 个 fail 语言（yo, te）的 AUROC < 0.60 因为 Qwen3 pretraining corpus 中 Yoruba/Telugu
      占比极低（<0.1%），embedding 层的 representation quality 即不足以支撑 correctness signal。Mean-shift
      ΔAUROC ≡ 0 因为 StandardScaler + LR 下 mean-shift 对 AUROC 无影响（已在 MVP 中数学证明）。 Linear
      projection (200 pairs) 提供 +2pp 因为 Procrustes alignment 捕获了 correctness subspace
      的旋转，但不触及 distributional matching。

      '

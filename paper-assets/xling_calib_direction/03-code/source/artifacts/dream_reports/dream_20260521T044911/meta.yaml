  - name: CaCLR Implementation and Negative Result
    plan_id: plan_003
    description: 'CaCLR (BCE + α·SB-ECE + β·MMD) 完整实现与评估。β sweep 横跨 3 OOM (0.001-1.0)。
      Median tier 预期：consistency loss 无效，转为 negative result + geometric explanation。


      LOW-resource languages 的 27% artifact rate 源于两个因素：(1) these languages 在 model
      pretraining 中占比极低，activation distributions 相对 high-resource 更 "shallow" (less
      structured)，linear probes 更容易 通过 capacity 而非 genuine signal 拟合少量 patterns；(2)
      GlobalMMLU 的 low-resource translations 质量较低，引入 noise 使 correctness signal 更弱，selectivity

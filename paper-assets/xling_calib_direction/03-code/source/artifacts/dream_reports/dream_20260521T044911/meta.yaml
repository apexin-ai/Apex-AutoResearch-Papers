    result_rationale: 'Llama 4 Scout 延续 MVP Llama-3.1-8B 的 weak tradeoff 模式。虽然 global
      Spearman ρ = -0.78 仍然显著（12 data points, p=0.003），但 per-language 分析揭示了明显的异质性：仅
      6/20 languages 有显著负 ρ，而 ar/hi/ko 展现正 ρ（深层 transfer 反而改善）。这与 MVP 完全一致（ar/ko 在
      L31 优于 L20），且可归因于 Llama 架构的 multilingual training recipe：Meta 的训练策略使 ar/hi/ko
      在深层保持更好的 cross-lingual alignment，可能 因为这些语言在 pretraining 中与 English 有更多 code-switching
      数据。 Global rho 仍然显著是因为大多数语言确实有弱负趋势，但 per-language 分析揭示这不是 universal pattern。与
      Qwen3 的对比清晰：Qwen3 的 15/20 significant vs Llama4 的 6/20，median rho -0.64 vs -0.28。这一
      architecture-dependent tradeoff strength 是 Claim 1 的核心发现。

      '

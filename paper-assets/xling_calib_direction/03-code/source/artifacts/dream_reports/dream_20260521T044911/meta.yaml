        LOW: 0.002
      implementation_spec:
        mmd_kernel: Gaussian RBF, median heuristic bandwidth
        optimizer: Adam, lr=1e-3, cosine schedule
        epochs: 50
        early_stopping: patience=10 on val BCE loss

      reduction 效应而非 difficulty-specific 投影。Difficulty probe 本身 R²=0.31（低于理想值），表明
      IRT difficulty 在 LLM representation 中的编码不够线性/集中， 使得 linear projection 无法有效捕获它。整个
      decomposition framing 在经验层面被否定： transfer 的降解不能归因于 capability-specific component，或者说两个
      component 不可分。


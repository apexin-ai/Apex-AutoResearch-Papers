      与 EN 更相似，rotation matrix 的 effective rank 更低（fewer parameters to estimate），22
      pairs 即可。LOW languages 需要估计更 complex rotation（effective rank 更高），48 pairs。

      Procrustes effect reversal（threshold ~0.52）：当 ZS AUROC < 0.52 时， correctness
      direction 严重 misaligned，Procrustes 纠正旋转带来 +3.8pp。 当 ZS AUROC > 0.60 时，directions
      已经 well-aligned，Procrustes 引入 estimation noise 反而 hurt -1.2pp。Threshold 0.52
      对应 CKA ~0.35 （与 plan_011 的 cliff threshold 一致）。

      这一 finding 直接 actionable：practitioners 应先测 ZS transfer， only apply Procrustes
      when baseline < 0.52。


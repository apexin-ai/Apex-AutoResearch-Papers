      Mid/high-resource 的 artifact rate 极低（3-5%）因为 representation quality 高，probe
      有 genuine signal 可以 leverage。

      Artifacts 集中在 60-100% depth，与 CKA cliff 一致：deep layers 的 low-resource CKA 已经很低（<0.2），cross-lingual

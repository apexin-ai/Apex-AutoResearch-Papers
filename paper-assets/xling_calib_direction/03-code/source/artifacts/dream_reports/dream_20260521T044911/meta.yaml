    figures_description:
    - 'β sweep 图：x=β (log scale)，y=ΔAUROC vs zero-shot，每条线为一个 resource tier， shaded
      area 为 bootstrap 95% CI。所有线段在 y=0 附近震荡，β=1.0 时向下偏离。 水平虚线标注 linear projection
      和 few-shot 的 ΔAUROC 作为对比。


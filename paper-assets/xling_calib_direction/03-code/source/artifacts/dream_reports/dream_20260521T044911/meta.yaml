      p=0.018），Qwen3-235B 上 trending 但不显著（partial rho=0.16, p=0.072）。 这一架构依赖性本身是有意义的发现。Paper
      中用 hedged language 报告： "In architectures where the CKA-depth gradient is steep
      (Llama 4 Scout), partial correlation controlling for depth reveals a significant
      positive relationship between CKA and transfer AUROC (rho=0.29, p=0.018), indicating
      that CKA provides genuine explanatory power beyond depth. In architectures with
      a delayed, step-function-like CKA decline (Qwen3-235B), the linear partial correlation
      is trending but not significant (rho=0.16, p=0.072), possibly because the non-linear

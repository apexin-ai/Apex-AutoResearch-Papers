      capability 独立于 difficulty（projection 帮助），低资源语言两者纠缠更深（projection 效果不确定）。Random-direction
      control 显示 ~40% 的效果来自纯维度缩减（从高维投影到低维本身就降噪），只有 ~60% 是 difficulty-specific。这足以支持

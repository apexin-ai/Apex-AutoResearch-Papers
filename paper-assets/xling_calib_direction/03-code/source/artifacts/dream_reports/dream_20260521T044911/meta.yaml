    figures_description:
    - 'Figure 1a: Pareto frontier scatter (EN AUROC x-axis vs ZS mean AUROC y-axis),
      24 points, 5 Pareto-optimal layers marked red. Clear convex knee at ~55% depth.

      '
    - 'Figure 1b: Heatmap — ZS AUROC by language (y-axis, ordered by resource tier)
      × normalized depth (x-axis). Warm mid-band, low-resource rows cool earlier at
      shallower depth than high-resource rows.

      '
    analysis: 'Qwen3-235B 展现 strong, consistent depth-transferability tradeoff： global
      Spearman ρ = -0.91 (p < 0.001), 15/20 per-language ρ 显著为负。 Pareto frontier 包含
      5 层 (L40-L56)，knee 在 ~55% depth。EN-optimal (L72) 与 ZS-optimal (L52) 相隔 20 层
      / 22pp depth，远大于 MVP 的 3 层 间隔。这证实 tradeoff 在大模型上不是减弱而是放大——更深的网络有更多 空间进行 language-specific
      specialization。High-resource 语言在 Pareto knee 以下也保持 AUROC > 0.74，但 low-resource
      在 70% depth 后急剧下降。 这与 CKA 分析一致：CKA 在 L60 后的 cliff 解释了为何 deep-layer transfer
      对 low-resource 影响更大（CKA 基线更低，cliff 更早触及）。

      '

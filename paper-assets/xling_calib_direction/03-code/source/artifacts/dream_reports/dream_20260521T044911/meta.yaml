        limits of cross-lingual calibration probe transfer: a large-scale negative
        result with methodological implications.'' 核心贡献重构为三层：(1) 领域级方法论警示——control
        task 分析揭示 >35% 跨语言 probing 结果是 capacity artifacts，这是该发现的最强版本，首次在 cross-lingual
        transfer 场景应用 selectivity 检验，对所有跨语言 probing 研究有 field-level implication；(2)

      correctness_direction_persists_despite_global_cka_decline: true
    result_rationale: 'Simpson''s Paradox 的 causal mechanism：depth 同时作用于 CKA（deeper
      → representations diverge → CKA drops）和 transfer AUROC（deeper → EN probe stronger
      → higher absolute AUROC up to a point），创造了一个 confound。 Raw pooled correlation
      为负是因为 shallow layers 有 high CKA 但 low AUROC （probe 本身弱），deep layers 有 low CKA
      但 higher AUROC（probe 强虽然 transfer degrades）。控制 depth 后，within 每个 layer，higher
      CKA 的 语言确实有 better transfer，partial rho 为正。

      MVP pilot（Llama, 5 langs × 9 layers）已展现 rho=+0.41, p=0.006。 Full-scale（20 langs
      × 12-24 layers）增强统计 power：per-layer test 从 n=5 增至 n=20，partial correlation 的
      bootstrap CI 不含零。

      Qwen3 partial rho (0.48) 高于 Llama4 (0.41)，与 Qwen 的 steeper CKA cliff 一致：Qwen
      的 CKA 变异范围更大（peak 0.82 → floor 0.28 vs Llama 0.84 → 0.35），为 partial correlation
      提供更多 signal。

      MVP Qwen pilot 仅 rho=+0.18 (p=0.274)，full-scale上升至 0.48 是因为： (1) n 从 5 增至 20
      语言，power 大幅提升；(2) 20 语言覆盖更宽的 CKA 范围（增加了 yo/ig/te 等极低 CKA 语言和 nl/pt 等高 CKA 语言），
      扩大了 within-layer variance。

      CKA cliff threshold ~0.35 标记了 "transfer collapse zone"：当 CKA 低于此阈值时，correctness
      direction 的 cross-lingual overlap 不足以 支撑 zero-shot transfer。Subspace angle analysis
      揭示 correctness direction 在同一 layer 内跨语言仅旋转 ~12°（highly aligned），但跨 layer 旋转
      ~39°（significant drift），解释了为何 within-layer CKA 预测 transfer 但 raw pooled 不预测。

      '

      Llama 4 的 16-expert MoE 在浅层就开始 expert specialization， correctness signal 在中层已经
      plateau。Pareto 弱于 Qwen3 的根本原因：Llama CKA decline 更渐进（slope -0.015/layer vs Qwen
      的 -0.025/layer），导致 transfer 不出现急剧 cliff， tradeoff 分散在更宽的层范围内。EN-optimal（L44）vs
      transfer-optimal（L36）gap 仅 ~1.5pp， 相比 Qwen3 的 ~2.8pp 更小。一些语言（ar, ko, vi）在全深度范围
      AUROC 单调增加， 无 tradeoff——pilot 中 ar/ko 的异常模式在 full-scale 中得到确认和扩展。


      curve_cleanness: 'noisy, especially LOW tier (R² of saturation fit: HIGH=0.96,
        MID=0.91, LOW=0.78)'
    result_rationale: 'Linear projection（Procrustes alignment）通过学习 EN→target 的旋转矩阵对齐
      correctness subspace。Saturation 速度取决于子空间旋转的复杂度：HIGH 语言的 EN-target subspace 角度小（~10°），10-20
      pairs 就足以估计一个简单旋转，35 pairs 达到 95%；LOW 语言角度大 （~40-45°），需要更多 pairs 来稳定估计更复杂的旋转，75
      pairs 才达到 95%。 Overall 70 pairs（而非 pilot 预估的 ~50 pairs）因为 (1) 20 语言比 5 语言引入更多方差，
      (2) 部分低资源语言的 parallel data 翻译质量低（机翻 artifacts），增加了 noise。 Curves 在 LOW tier
      不够干净（R²=0.78）——个别语言的饱和曲线不单调（20 pairs 时偶然 好于 50 pairs），因为 parallel pair 的质量方差大。
      Procrustes reversal 的机制：当 ZS AUROC 已高（>0.62），EN probe 的 correctness direction
      与 target 语言已经 well-aligned（subspace angle <15°），Procrustes 旋转引入的估计噪声 反而大于 alignment
      gain→净效果为负。当 ZS AUROC 低（<0.50），严重 misalignment （angle >40°）使得 Procrustes 的 alignment
      gain 远大于估计噪声→净效果明显为正。 阈值 ~0.55 对应 subspace angle ~20-25° 的平衡点。

      '

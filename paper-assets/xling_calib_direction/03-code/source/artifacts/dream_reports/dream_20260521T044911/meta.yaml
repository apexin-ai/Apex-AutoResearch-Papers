      Deep-layer improvement (+4.8pp) 远大于 shallow-layer (+1.2pp)，因为 deep layers 有更大的
      capability-specific component（Claim 2 decomposition 所揭示），CaCLR 的 consistency
      loss 正好 target 这个 component。这与 difficulty-capability decomposition 形成因果闭环。


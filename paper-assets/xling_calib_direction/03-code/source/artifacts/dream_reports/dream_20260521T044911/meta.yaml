    analysis: 'CaCLR negative result 的核心贡献不是 method 本身，而是 (1) systematic β sweep 关闭
      MMD distributional-matching 路径（3 OOM, component ablation, 两个架构 × 20 语言）， (2)
      CKA subspace analysis 提供几何解释——MMD 成功减小了 marginal distance 但完全 无法对齐 correctness
      subspace 的方向（subspace angle 几乎不变）。这验证了 Zhao et al. (2019) 的理论预测：当 conditional
      distributions P(Y|X) 在域间不同时， marginal matching 必然失败。在 correctness probing 中，P(correct|activation)
      的 条件结构在不同语言间确实不同（语言特异的 capability 成分），因此 MMD 注定无效。 Constructive path: linear
      projection 以 50-80 parallel pairs 的极低成本解决了 subspace alignment 问题，是明确的 practical
      recommendation。

      '

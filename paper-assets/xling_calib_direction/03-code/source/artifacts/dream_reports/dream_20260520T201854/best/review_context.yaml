    bootstrap_ci_decomposition_delta:
    - 0.018
    - 0.044
    paired_permutation_p: 0.006
    cohens_d: 0.41
  result_rationale: 'Difficulty direction与correctness direction有中等cosine（0.34），说明两者共享
    部分信号但不完全重叠。Project out difficulty后，残差中的correctness信号更 "capability-pure"——这个信号在高资源语言间更容易transfer（+2.2pp），
    因为capability-specific failures在这些语言间更一致。低资源语言获益最大（+4.1pp）， 因为原始correctness方向中difficulty成分占比更高（低资源语言的difficulty分布
    与EN差异更大），去除difficulty后暴露出更可transfer的capability信号。 深层退化更明显（4.8pp）因为深层同时编码了更多language-specific的difficulty信息。
    Random-direction control仅+0.2pp，排除了dimensionality reduction artifact—— 是difficulty方向的specific
    removal而非arbitrary降维带来的改善。 这个分解是prescriptive的：它告诉我们哪些language-layer组合需要capability
    alignment （高delta = 高difficulty entanglement = 需要CaCLR/projection）。

    '

narrative_guidance: 'Full method contribution paper (Path A). CaCLR consistency loss
  provides meaningful gain, confirming distributional matching via MMD helps align
  capability-specific signals at mid-depth layers. Causal chain complete: Pareto frontier
  discovered on both architectures with architecture-dependent shape → decomposition
  explains frontier via difficulty/capability separation → CaCLR shifts frontier by
  aligning capability-specific components → orthogonality bounds output-based approaches
  across all languages. CKA provides mechanistic glue linking representation geometry
  to transfer success. Headline: "CaCLR-trained correctness probes reduce non-English
  ECE by 3.5% over temperature scaling with zero target-language labels across 20
  languages on Qwen3-235B and Llama 4 Scout."

  '

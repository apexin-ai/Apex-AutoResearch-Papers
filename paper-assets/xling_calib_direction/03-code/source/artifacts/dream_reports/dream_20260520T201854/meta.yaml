      narrative_direction: 'Analysis paper with principled negative result as centerpiece.
        Headline: distributional matching fails for cross-lingual correctness probe
        transfer because the misalignment is geometric, not distributional — CKA proves
        it, linear projection confirms it. Reorder claims: (1) Pareto frontier established,
        (2) CKA reveals geometric misalignment as mechanism, (3) CaCLR''s failure
        is PREDICTED by the geometric explanation — this closes the distributional-matching
        path with both theory and evidence, (4) linear projection succeeds precisely
        because it learns the rotation. Decomposition and orthogonality become supporting
        evidence rather than standalone claims. The negative result is the contribution
        — it redirects the field away from distributional alignment toward geometric
        alignment for cross-lingual probe transfer. Soften ECE improvement claims;
        emphasize AUROC and mechanistic understanding. Target: borderline to weak
        accept at EACL.


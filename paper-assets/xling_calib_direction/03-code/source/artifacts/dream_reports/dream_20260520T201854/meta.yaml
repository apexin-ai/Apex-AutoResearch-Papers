    analysis: 'This experiment justifies the methodological choice of logistic regression
      probes and provides additional evidence for the geometric/linear framing. If
      the correctness signal were deeply nonlinear, MLP''s advantage would transfer
      — the fact that it doesn''t confirms that the transferable component is linear.
      Goes in supplementary material as a methodological validation.


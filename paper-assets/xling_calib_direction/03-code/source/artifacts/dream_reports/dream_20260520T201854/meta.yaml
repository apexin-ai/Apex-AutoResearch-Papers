  review_report: "---\ndream_id: dream_20260520T201854\ntier: best\noverall_score:\
    \ weak accept (4/6)\ntimestamp: 2026-05-20T21:05:06.249123+00:00\n---\n\n# Dream\
    \ Review Report — Cross-Lingual Calibration via Internal Correctness Directions\n\
    \n**dream_id**: 20260520T201854  \n**Review mode**: full (2 Reviewers + Roundtable)\
    \  \n**Date**: 2026-05-20\n\n---\n\n## Panel Summary\n\n| Reviewer | Focus | Score\
    \ | Confidence |\n|----------|-------|-------|------------|\n| R1 | Methods +\
    \ Experiments | 4/6 (Weak Accept) | 4/5 |\n| R2 | Novelty + Related Work | 4/6\
    \ (Weak Accept) | 4/5 |\n| **Consensus** | | **4/6 (Weak Accept)** | **4/5** |\n\
    \n---\n\n## 1. Paper Overview\n\nThe paper presents the first systematic study\
    \ of cross-lingual correctness probe transfer across 20 languages on two MoE architectures\
    \ (Qwen3-235B-A22B, Llama 4 Scout). It discovers a depth–transferability Pareto\
    \ frontier (architecture-dependent), proposes CaCLR (a consistency-aligned probe\
    \ training objective), decomposes correctness transfer into difficulty-shared\
    \ and capability-specific components, and confirms universal correctness–confidence\
    \ orthogonality. CKA analysis provides mechanistic explanation linking representation\
    \ geometry to transfer success.\n\n---\n\n## 2. Strengths (Consensus)\n\n**S1.\
    \ Ambitious scope and thorough experimental design.** The paper covers 20 languages\
    \ × 2 architectures × multiple transfer conditions × 3 benchmarks, with appropriate\
    \ ablations (INT8, probe complexity, control tasks, β sweep). The experimental\
    \ pipeline is comprehensive for a single paper. [Both R1, R2]\n\n**S2. Strong\
    \ analytical contributions.** The difficulty–capability decomposition is methodologically\
    \ interesting and well-controlled (random-direction control validates specificity).\
    \ The mean-shift invariance proof (ΔAUROC ≡ 0 under StandardScaler + LR) is a\
    \ clean theoretical result that corrects prior work's implicit assumption that\
    \ mean-shift helps. The CKA analysis provides a quantitative bridge between representation\
    \ geometry and transfer outcomes. [Both R1, R2]\n\n**S3. Coherent narrative structure.**\
    \ The \"causal chain\" framing (Pareto frontier → decomposition explains frontier\
    \ → CaCLR shifts frontier → orthogonality bounds alternatives) is well-structured\
    \ and easy to follow, even if individual links vary in strength. [R2]\n\n**S4.\
    \ Statistical rigor where applied.** Bootstrap CIs, paired permutation tests,\
    \ and Cohen's d for CaCLR β effect (p=0.003, d=0.48) and decomposition (p=0.006,\
    \ d=0.41) demonstrate appropriate statistical practice. [R1]\n\n**S5. Practical\
    \ value of mean-shift and orthogonality results.** The mean-shift invariance proof\
    \ saves practitioners from a common but ineffective alignment attempt. The universal\
    \ orthogonality finding (cosine < 0.062 across 20 languages) establishes a clear\
    \ boundary condition for output-based calibration approaches. [Both R1, R2]\n\n\
    ---\n\n## 3. Weaknesses (Consensus + Individual)\n\n### Major Weaknesses\n\n**W1.\
    \ CaCLR's practical advantage over linear projection is marginal.** [Both R1,\
    \ R2]\nCaCLR beats 50-pair linear projection by only +1.4pp median AUROC while\
    \ requiring: (a) parallel inputs for all target languages (not just 50 pairs),\
    \ (b) gradient-based training with a 3-term composite loss, (c) hyperparameter\
    \ tuning (α, β). Meanwhile, linear projection needs only 50 translated pairs (trivial\
    \ to obtain) and a simple matrix fit. CaCLR also slightly underperforms few-shot\
    \ 100 (−0.8pp). The cost-benefit calculus is unfavorable for the headline method\
    \ contribution.\n\n**W2. Architecture-dependence claim is underpowered and confounded.**\
    \ [Both R1, R2]\nThe three models differ simultaneously in architecture type (MoE\
    \ vs dense), scale (235B vs 109B vs 31B), depth (94 vs 48 vs 60 layers), active\
    \ parameters (22B vs 17B vs 31B), and training data. Attributing the Pareto frontier\
    \ shape to \"MoE expert routing\" is not supported by the experimental design\
    \ — no controlled comparison isolates architecture type. The claim that \"expert\
    \ routing accelerates deep-layer language specialization\" is speculative without\
    \ direct evidence (e.g., expert activation analysis, routing entropy by language).\
    \ Three confounded data points cannot support causal claims about architecture.\n\
    \n**W3. Pareto frontier is undersampled in the paper.** [R1]\nThe design planned\
    \ 24 probed layers for Qwen3 (every 4th), but Table 1 reports only 7. This is\
    \ sufficient to see the trend but insufficient to precisely locate the frontier\
    \ elbow or detect non-monotonicity. For Scout, ZS Min/Max columns are omitted\
    \ entirely. The full 24-layer × 20-language results should be available if the\
    \ experiments were run — why not report them?\n\n**W4. CKA analysis is correlational\
    \ despite \"mechanistic\" framing.** [Both R1, R2]\nThe paper claims CKA \"mechanistically\
    \ explains\" the Pareto frontier, but the analysis is purely correlational. Depth\
    \ is a confounder: CKA decreases with depth, and so does transfer AUROC, but both\
    \ could be driven by the same underlying cause (progressive specialization) rather\
    \ than CKA causally determining transfer. The r=0.82 correlation likely inflates\
    \ the true relationship because it pools across resource tiers and depths, mixing\
    \ between-group and within-group variation. A partial correlation controlling\
    \ for depth would be more informative. \"Mechanistic\" implies causal understanding;\
    \ \"correlational evidence consistent with\" would be more accurate.\n\n**W5.\
    \ Missing important references and insufficient differentiation.** [R2]\n- Conneau\
    \ et al. (2020) \"What you can cram into a single $&!#\\* vector\" — established\
    \ the depth–language-specificity tradeoff in multilingual transformers. The Pareto\
    \ frontier is a quantitative refinement of this known phenomenon.\n- Pires et\
    \ al. (2019) on mBERT cross-lingual transfer — foundational context missing.\n\
    - Civelli et al. are cited but insufficiently compared — they already showed architecture-dependent\
    \ optimal depth for cross-lingual probes.\n- Gretton et al. (2012) for MMD — the\
    \ foundational MMD paper should be cited and the kernel choice specified.\n- DAN,\
    \ DANN, and other domain adaptation methods using MMD-like losses — CaCLR's MMD\
    \ term is closely related to these classical approaches.\n\n### Minor Weaknesses\n\
    \n**W6. Selective statistical reporting.** [R1]\nBootstrap CIs are reported for\
    \ CaCLR β effect and decomposition but not for the Pareto frontier (ρ values),\
    \ orthogonality measurements, or CKA correlations (except CKA-transfer r). The\
    \ CKA-transfer CI is reported [0.76, 0.87] but this is a marginal CI that doesn't\
    \ account for the depth confound. Multiple comparison corrections are absent across\
    \ the many language × layer × model comparisons.\n\n**W7. Orthogonality table\
    \ is incomplete.** [R1]\nTable 5 shows only 10 of 20 languages. The claim \"all\
    \ 20 languages below 0.062\" is made in text but the evidence is only half-shown.\
    \ This is a central claim — full data should be in the paper or a detailed appendix.\n\
    \n**W8. INT8 validation is incomplete.** [R1]\nINT8 vs FP16 comparison covers\
    \ only Scout (5 layers, 5% subset). Qwen3-235B — the primary model — has no quantization\
    \ validation. Given that Qwen3 is the larger model and quantization effects may\
    \ scale with model size, this gap weakens claims based on Qwen3 results.\n\n**W9.\
    \ Non-English ECE improvements reported only in relative terms.** [R2]\nThe headline\
    \ \"3.5% ECE reduction over temperature scaling\" is not accompanied by absolute\
    \ ECE values for non-English languages. Without knowing the baseline non-English\
    \ ECE (after temp scaling), it's impossible to assess practical significance.\
    \ If non-English temp-scaled ECE is ~0.10, then 3.5pp reduction to 0.065 is meaningful.\
    \ If it's ~0.30, then 3.5pp is marginal.\n\n**W10. Causal chain has a weak link.**\
    \ [R2]\nThe decomposition (contribution 2) shows difficulty entanglement degrades\
    \ transfer, but CaCLR (contribution 3) uses MMD distributional alignment, not\
    \ difficulty removal. The narrative implies decomposition motivates CaCLR, but\
    \ the connection is indirect — CaCLR doesn't operationalize the decomposition\
    \ insight. A stronger design would use difficulty-removed representations as input\
    \ to CaCLR, or compare CaCLR with and without difficulty removal.\n\n**W11. Results\
    \ appear suspiciously clean.** [R1]\nMean-shift yields exactly ΔAUROC = 0.000\
    \ (the theoretical prediction), orthogonality values are perfectly tiered by resource\
    \ level with no outliers, the Pareto frontier shows perfectly monotonic trends\
    \ in most sub-analyses, and the β sweep produces a textbook inverted-U. While\
    \ individually each is possible, the collective perfection raises concerns about\
    \ whether results were curated or cherry-picked.\n\n---\n\n## 4. Experiment Coverage\
    \ Assessment\n\nComparing the paper against the 11 planned experiments:\n\n| Experiment\
    \ | In Paper? | Completeness |\n|-----------|-----------|--------------|\n| plan_001:\
    \ Qwen3 Pareto | ✓ Table 1 | Partial — 7/24 layers shown |\n| plan_002: Scout\
    \ Pareto | ✓ Table 1 | Partial — ZS Min/Max omitted |\n| plan_003: CaCLR | ✓ Tables\
    \ 2-3 | Partial — α sweep missing, only 1 layer for β sweep |\n| plan_004: Decomposition\
    \ | ✓ Table 4 | Good — 6 depths × 3 tiers + control |\n| plan_005: Orthogonality\
    \ | ✓ Table 5 | Partial — 10/20 languages shown |\n| plan_006: Probe Complexity\
    \ | ✓ Table 7 | Good — 4 layers, clear pattern |\n| plan_007: Benchmarks | ✓ Table\
    \ 8 | Adequate — 3 benchmarks, summary stats |\n| plan_010: INT8 | ✓ Table 10\
    \ | Partial — Scout only, not Qwen3 |\n| plan_011: CKA | ✓ Table 6 | Good — 8\
    \ depths × 3 tiers |\n| plan_012: Linear Proj | ✓ Table 9 | Good — 5 pair counts\
    \ × tier breakdown |\n| plan_013: Control Tasks | ✓ Table 11 | Adequate — 5 layers\
    \ × 3 languages |\n| plan_008: Gemma 4 (ext) | ✓ Table 12 | Summary only (appendix)\
    \ |\n| plan_009: 52-lang (ext) | ✓ Table 13 | Summary only (appendix) |\n\nAll\
    \ planned experiments have corresponding tables, but several are reported at reduced\
    \ resolution compared to the design. The most significant gap is the Pareto frontier\
    \ sub-sampling (7/24 layers for Qwen3). The α sweep (planned in plan_003) is absent\
    \ from the paper despite being designed.\n\n---\n\n## 5. Questions for Authors\n\
    \n1. **Why report only 7/24 probed layers for Qwen3 in Table 1?** If all 24 were\
    \ probed, the full data should be available. Was there a data issue, or was this\
    \ a presentation choice? The full layer-wise results would significantly strengthen\
    \ the frontier claim.\n\n2. **Can you provide absolute ECE values for non-English\
    \ languages?** The \"3.5% reduction\" headline needs context. What are the per-tier\
    \ median ECE values before and after CaCLR?\n\n3. **What kernel is used for MMD\
    \ in CaCLR?** Gaussian RBF? Linear? What bandwidth selection? This is essential\
    \ for reproducibility and affects the distributional vs. geometric alignment distinction.\n\
    \n4. **How is CaCLR trained in practice?** The paper states probes are logistic\
    \ regression, but CaCLR requires gradient-based optimization of a 3-term loss.\
    \ Is this still a single-layer linear model trained with SGD? What optimizer,\
    \ learning rate, training epochs?\n\n5. **Can you isolate the architecture effect?**\
    \ E.g., compare two models of similar scale but different architecture type, or\
    \ analyze expert routing patterns directly (routing entropy by language across\
    \ depth)?\n\n6. **Why does the decomposition not feed into CaCLR?** If difficulty\
    \ entanglement is the identified problem, why doesn't CaCLR operate on difficulty-removed\
    \ representations? What is the CaCLR result on decomposed representations?\n\n\
    7. **For Table 5, can you show all 20 languages?** The orthogonality claim is\
    \ central — half the evidence is hidden.\n\n8. **How sensitive is the optimal\
    \ transfer depth to the specific benchmark or prompt template?** The 60% vs 50%\
    \ numbers are presented as architecture properties, but could they be benchmark-specific?\n\
    \n---\n\n## 6. Reviewer Discussion and Convergence\n\n### Points of Agreement\n\
    - **Score**: Both R1 and R2 independently scored 4/6 (Weak Accept).\n- **CaCLR's\
    \ marginal practical value**: Both reviewers flagged the +1.4pp advantage over\
    \ linear projection as insufficient to justify CaCLR's complexity.\n- **Architecture\
    \ claim underpowered**: Both noted the 3-model comparison confounds architecture\
    \ with scale, depth, and training data.\n- **Analytical > methodological strength**:\
    \ Both agree the paper's strongest contributions are the analytical results (decomposition,\
    \ CKA, orthogonality, mean-shift proof) rather than CaCLR.\n- **CKA overclaimed**:\
    \ Both flag the \"mechanistic\" framing as overstated for a correlational analysis.\n\

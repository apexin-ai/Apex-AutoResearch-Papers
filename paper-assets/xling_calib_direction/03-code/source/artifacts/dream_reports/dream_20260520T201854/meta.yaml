    # Dream Review Report — Cross-Lingual Correctness Probes


    **Dream ID:** 20260520T201854 | **Review Mode:** full | **Date:** 2026-05-20


    ---


    ## Paper Summary


    This paper presents the first systematic evaluation of cross-lingual correctness
    probe transfer across 3 architectures (Qwen3-235B-A22B, Llama 4 Scout, Gemma 4
    31B Dense), 20+ languages, and 5 transfer methods. The authors discover a depth–transferability
    Pareto frontier (deeper layers yield better English probes but transfer worse
    cross-lingually, median Spearman ρ = −0.52), provide a CKA-based mechanistic explanation
    (geometric misalignment increases with depth, r = 0.58, 34% variance explained
    vs. MMD''s 6%), show that CaCLR''s MMD-based consistency loss is inert (d = 0.08,
    p = 0.42), and demonstrate that linear projection with ~50–100 parallel pairs
    achieves +3.5 pp AUROC by learning the rotation MMD cannot correct. Correctness–confidence
    orthogonality is extended from English to 20 languages.


    ---


    ## Reviewer R1 — Methods & Experiments


    ### Strengths


    **S1. Comprehensive experimental scope with appropriate controls.** Three architectures
    (two MoE, one dense), 20 languages across 4 resource tiers, 5 transfer conditions,
    3 benchmarks (GlobalMMLU, Belebele, MMLU-ProX). Control tasks (Hewitt & Liang
    2019), random-direction controls for decomposition, INT8 validation, and probe
    complexity comparison demonstrate methodological care.


    **S2. Clean mean-shift rank-invariance proof.** The mathematical proof that mean-shift
    produces exactly ∆AUROC ≡ 0 under StandardScaler + logistic regression is a tight,
    novel result that corrects implicit assumptions in prior work.


    **S3. Well-designed difficulty–capability decomposition.** IRT-based difficulty
    probes with random-direction controls ruling out dimensionality-reduction artifacts.
    The depth-dependent improvement pattern (78% at deep vs. 50% at shallow layers)
    coherently supports the geometric misalignment narrative.


    **S4. Strong statistical practice on key claims.** Paired permutation tests, bootstrap
    95% CIs (1000 resamples), Cohen''s d reported throughout. The β sweep is well-structured
    across 3 OOM with clear null result reporting.


    **S5. Practically valuable linear projection analysis.** The sample efficiency
    curve (saturation at ~70 pairs, 90% at ~55) is actionable for practitioners and
    well-characterized across both architectures.


    ### Weaknesses


    **W1. CKA "mechanistic explanation" is correlational, not causal.** The CKA–transfer
    correlation (r = 0.58) is presented as explaining WHY transfer fails, but CKA
    and transfer AUROC are both functions of depth. Partial correlation controlling
    for normalized depth is not reported. Without this, the 34% variance explained
    may substantially reflect the shared depth variable rather than a causal geometric
    mechanism. This is the paper''s central mechanistic claim — it needs stronger
    evidence.


    **W2. Architecture-dependence claim is confounded.** The three models differ simultaneously
    in architecture (MoE vs. dense), scale (235B vs. 48-layer vs. 31B), depth (94
    vs. 48 vs. 60 layers), active parameters, and training data. Attributing differences
    in ρ variance (σ_ρ = 0.12 vs. 0.15–0.16) to "MoE routing" without controlling
    for these confounds is not justified. No expert routing analysis is provided.


    **W3. CaCLR training procedure is critically underspecified.** The MMD kernel
    choice (Gaussian RBF? linear?), bandwidth selection, optimizer, learning rate,
    and number of training epochs are not reported. For a negative result, the community
    needs to be confident the method was given a fair chance. Was the kernel bandwidth
    tuned? Was the MMD computed on raw representations or probe outputs? Equation
    (2) suggests probe outputs f(h), but this should be explicit.


    **W4. Selective layer presentation raises concerns.** The experimental design
    specifies 24 probed layers for Qwen3, but Table 1 reports summary statistics.
    The full 24×20 layer-language matrix is not shown in the main text. For a paper
    whose central claim is about layer-level tradeoffs, the reader should see the
    complete data (at minimum in supplementary).


    **W5. CaCLR''s marginal advantage over simple baselines undermines its utility.**
    CaCLR-full achieves only +1.2 pp over zero-shot (not significant, p = 0.08) while
    requiring parallel inputs, a 3-term loss, and α/β hyperparameter tuning. Linear
    projection with just 50 pairs already achieves +3.0 pp. The paper correctly identifies
    this as a negative result, but the framing of CaCLR as a "proposed training objective"
    in §3.2 creates the impression it is a method contribution rather than an ablation
    vehicle.


    ### Questions for Authors


    1. Report partial correlation between CKA and transfer AUROC controlling for normalized
    depth. If r drops substantially, the "mechanistic explanation" claim needs qualification.

    2. Specify the complete CaCLR training procedure: MMD kernel, bandwidth, optimizer,
    learning rate, epochs, and whether MMD is computed on representations or probe
    outputs.

    3. Show the full layer×language AUROC matrix (at least in appendix) rather than
    only summary statistics.

    4. Did you try CaCLR with CKA-based alignment loss instead of MMD, given your
    own analysis shows CKA captures the relevant misalignment?


    ---


    ## Reviewer R2 — Novelty & Related Work


    ### Strengths


    **S1. Genuine gap identification with coherent narrative.** The observation that
    all probe-based calibration methods are English-only is accurate and important.
    The four-finding causal chain structure (Pareto → CKA mechanism → CaCLR negative
    result → linear projection solution) is well-organized and compelling.


    **S2. Scale of evaluation is commendable.** 20 languages, 3 architectures, 3 benchmarks,
    5 transfer conditions, with control tasks and INT8 validation — this is among
    the most thorough empirical packages in the cross-lingual calibration literature.


    **S3. Honest reporting of limitations.** The paper acknowledges low-resource probe
    selectivity issues (sw/bn ~10 pp), the MCQA-only scope, and the partial success
    rate of decomposition (65%). This intellectual honesty is appreciated.


    ### Weaknesses


    **W1. The "first systematic evaluation" claim overclaims relative to prior work.**
    Xiao et al. (ACL 2025) already performed cross-lingual probe transfer across 8
    languages with alignment methods. The distinction (knowledge boundary vs. correctness)
    is valid but insufficient to claim "first systematic evaluation" of cross-lingual
    probe transfer wholesale. The claim should be scoped to "first systematic evaluation
    of cross-lingual *correctness* probe transfer" with explicit acknowledgment that
    the experimental paradigm was established by Xiao et al.


    **W2. The Pareto frontier is a quantitative refinement of known phenomena, not
    a conceptual discovery.** Conneau et al. (2020) established that deeper layers
    encode more language-specific information. LACE (Zhou et al. 2024) showed that
    non-English calibration peaks at intermediate layers. Civelli et al. (2024) demonstrated
    architecture-dependent optimal depth for cross-lingual probes. The "Pareto frontier"
    framing is a useful quantitative lens, but the underlying phenomenon is well-established.
    The paper should position this as quantification of a known tradeoff, not as a
    discovery.


    **W3. Only MMD tested for distributional alignment — conclusions about "distributional
    matching" are overly broad.** The paper tests only MMD and then concludes "distributional
    matching fails." Classical domain adaptation offers alternatives: CORAL-the-method
    (Sun & Saenko 2016, second-order statistics), adversarial alignment (DANN, Ganin
    et al. 2016), optimal transport (Courty et al. 2017). Testing only MMD and generalizing
    to all distributional methods is an incomplete experimental design. The conclusion
    should be "MMD-based distributional matching fails" until other methods are tested.


    **W4. Linear projection is VecMap/MUSE applied to probe representations — limited
    novelty.** The paper correctly cites MUSE and VecMap but does not sufficiently
    acknowledge that applying linear alignment to probe representations is a straightforward
    domain transfer. The sample efficiency result (~50 pairs) is interesting but expected
    given the known low intrinsic dimensionality of correctness representations.


    **W5. Missing foundational references weaken positioning.** Key absent works:

    - Conneau et al. (2020) on depth-dependent language specificity — directly predicts
    the Pareto frontier

    - Gretton et al. (2012) for MMD — foundational paper must be cited, kernel choice
    must be specified

    - Sun & Saenko (2016) CORAL-the-method, Ganin et al. (2016) DANN — relevant DA
    baselines that should at minimum be discussed

    - Chi et al. (2020) on geometry of multilingual representations — relevant to
    CKA analysis


    **W6. Orthogonality extension from English to 20 languages is incremental.** Miao
    & Ungar (2026) showed cosine < 0.04 in English. This paper shows cosine < 0.10
    across 20 languages. Given that the underlying hypothesis (correctness and confidence
    are independently encoded) has no theoretical reason to be language-specific,
    confirmation across languages is expected rather than surprising. The resource-tier
    gradient is attributed to noise, not structural difference.


    **W7. Insufficient differentiation from LACE (Zhou et al. 2024).** LACE addresses
    multilingual calibration via per-language layer ensembles. The paper claims CaCLR
    requires "zero target-language labels" while LACE needs labels, but CaCLR requires
    parallel inputs — also a non-trivial data requirement. No direct empirical comparison
    is provided.


    ### Questions for Authors


    1. Can you provide a direct comparison with LACE on a shared benchmark/language
    set?

    2. Why was only MMD tested? Did you consider CORAL, adversarial alignment, or
    optimal transport? Would CKA-based alignment loss work?

    3. How does the Pareto frontier relate to Conneau et al. (2020) on depth-dependent
    language specificity? What does your quantification add?

    4. For the orthogonality analysis, the full 20-language table (Table 8) shows
    only tier medians, not per-language values. Can you provide per-language cosine
    similarities?


    ---


    ## Roundtable Synthesis


    ### Step 2: Cross-Sharing


    Both reviewers independently arrived at 4/6 (Weak Accept) with confidence 4/5.
    Agreement is strong on core strengths (scale, statistical rigor, mean-shift proof,
    decomposition) and on key weaknesses (CKA causality concerns, CaCLR underspecification,
    positioning relative to prior work).


    ### Step 3: Convergence — Agreements and Disagreements


    **Agreed strengths:**

    - Comprehensive experimental scope with 3 architectures, 20 languages, 3 benchmarks

    - Strong statistical practice throughout (permutation tests, CIs, effect sizes)

    - Mean-shift invariance proof is clean and novel

    - Difficulty decomposition with random-direction control is well-designed

    - Linear projection sample efficiency analysis is practically valuable


    **Agreed weaknesses:**

    - CKA as "mechanistic explanation" is correlational — partial correlation controlling
    for depth needed

    - CaCLR training details critically underspecified (kernel, bandwidth, optimizer)

    - Paper would benefit from reframing as analytical/characterization contribution

    - CaCLR tests only MMD; conclusions about "distributional matching" in general
    are overstated


    **R1-specific concerns (experimental):**

    - Architecture-dependence confounded by simultaneous differences in scale/depth/data

    - Selective layer presentation (summary stats only, not full matrices)

    - CaCLR is marginal over simple baselines, undermining its framing as a method
    contribution


    **R2-specific concerns (novelty):**

    - Overclaiming "first systematic evaluation" relative to Xiao et al. (2025)

    - Pareto frontier quantifies known phenomenon (Conneau et al. 2020, LACE)

    - Linear projection = VecMap applied to new domain

    - Missing key references (Gretton et al. 2012, CORAL, DANN, Chi et al. 2020)

    - LACE comparison absent despite being the primary multilingual calibration competitor

    - Orthogonality extension is incremental


    ### Step 4: Final Assessment


    **Overall Score: 4/6 (Borderline / Weak Accept)**


    **Confidence: 4/5**


    **Summary Assessment:**


    This paper addresses a genuine gap — no prior work has systematically tested cross-lingual
    transfer of *correctness* probes specifically — and provides a thorough empirical
    investigation at commendable scale. The experimental design is comprehensive (3
    architectures, 20 languages, 3 benchmarks, 5 transfer methods, multiple controls),
    and statistical reporting is consistently rigorous.


    The paper''s strongest contributions are analytical rather than methodological:

    1. The mean-shift rank-invariance proof is a clean, novel result

    2. The difficulty–capability decomposition with random-direction controls is well-designed

    3. The CKA vs. MMD comparison as transfer predictors (34% vs. 6% variance) is
    informative

    4. The linear projection sample efficiency characterization is practically valuable


    However, several concerns prevent a higher score:


    **Novelty:** The depth–transferability tradeoff quantifies a known phenomenon
    rather than discovering one. Linear projection is a direct application of VecMap/MUSE.
    The orthogonality extension is expected. The paper''s novelty is primarily in
    the systematic scope and analytical framework, not in the individual findings.


    **Methodological gaps:** The CKA "mechanistic explanation" is correlational without
    controlling for depth as a confounder. CaCLR tests only MMD without comparing
    other domain adaptation methods (CORAL, adversarial, OT), making conclusions about
    "distributional matching" in general overly broad. CaCLR training details are
    critically underspecified for a negative result.


    **Positioning:** The paper overclaims relative to prior work (Xiao et al. 2025,
    LACE, Conneau et al. 2020). Missing foundational references (Gretton et al. 2012,
    domain adaptation baselines) weaken the related work. No direct comparison with
    LACE despite it being the primary multilingual calibration competitor.


    **Recommendation:** The paper is a solid empirical characterization paper that
    would benefit from: (1) reframing contributions to foreground analytical insights
    rather than method contributions; (2) reporting partial correlation for CKA controlling
    for depth; (3) specifying CaCLR training details fully; (4) testing at least one
    additional alignment method beyond MMD; (5) more careful positioning relative
    to prior work on depth-dependent cross-lingual transfer.


    **Scores:**

    | Criterion | Score |

    |-----------|-------|

    | Soundness | 3/4 — rigorous statistics but CKA causality gap and CaCLR underspecification
    |

    | Novelty | 2/4 — scope is new but individual findings are refinements of known
    phenomena |

    | Significance | 3/4 — practically useful guidance; closes MMD path (but only
    MMD tested) |

    | Presentation | 3/4 — well-organized causal chain; some overclaiming in framing

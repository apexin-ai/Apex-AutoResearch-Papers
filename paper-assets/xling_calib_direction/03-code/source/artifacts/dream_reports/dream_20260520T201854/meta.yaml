    result_rationale: 'CaCLR fully fails as a method contribution. The consistency
      loss (β·L_consistency) is inert: sweeping β over 3 orders of magnitude produces
      a flat AUROC landscape (<0.4pp variation). Adding consistency to BCE+SB-ECE
      actually hurts by −0.6pp because MMD-based alignment collapses both signal and
      noise — the unlabeled parallel activations contain massive language-specific
      variance (script, morphology, tokenization artifacts) that dominates the correctness
      signal. Minimizing distributional distance between languages forces the probe
      to ignore language-specific activation patterns that sometimes carry cross-lingual
      correctness information. The ablation reveals that the only beneficial component
      is SB-ECE regularization (+0.9pp), which acts as a calibration regularizer on
      the English training side but has nothing to do with cross-lingual transfer.
      Full CaCLR ends up as "zero-shot + SB-ECE regularization" — a trivially achievable
      benefit that does not justify the method''s complexity. Linear projection beats
      CaCLR because it directly estimates the geometric transformation between language
      subspaces, which is more data-efficient than trying to learn an invariant representation
      from noisy distributional signals. The paired permutation test CaCLR vs zero-shot
      gives p = 0.71 — no significant difference. Cohen''s d = 0.04 confirms negligible
      effect size. CaCLR slightly helps low-resource languages (+1pp) and slightly
      hurts high-resource (−0.5pp), but both effects are within noise. For the paper,
      CaCLR is relegated to one paragraph: "the natural distributional- matching approach
      fails — consistency-based objectives do not help when cross-lingual correctness
      SNR is low."

      '

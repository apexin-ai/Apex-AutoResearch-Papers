      can capture nonlinear interactions in the representation — the correctness signal
      has a small nonlinear component that logistic regression misses. However, this
      nonlinear component is language-specific (learned from English data, doesn''t
      generalize), so MLP probes show 6pp larger transfer gap than logistic regression.
      The MLP essentially overfits to English-specific nonlinearities in the correctness
      representation. This confirms the hypothesis that linear probes transfer better
      cross-lingually — the linear component of the correctness signal is more universal
      across languages, while nonlinear components are language-specific. The MLP
      advantage is concentrated at deep layers (+3pp at deep vs +1pp at shallow) because
      deeper representations have more complex, language-specific structure for the
      MLP to exploit. 80% of languages see better transfer with logistic regression,
      with the exceptions being high- resource languages (zh, es) where the MLP''s
      nonlinear component partially transfers due to shared pretraining features.
      This result justifies the paper''s focus on logistic regression probes and reinforces
      the geometric (linear) framing.


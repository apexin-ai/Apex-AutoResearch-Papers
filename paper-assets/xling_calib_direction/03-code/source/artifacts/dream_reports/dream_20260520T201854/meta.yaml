      the failure: consistency loss is harmful (adding it to BCE+SB-ECE reduces AUROC
      by 0.6pp). The β sweep over 3 OOM confirms this is not a tuning failure — the
      entire β landscape is flat or declining. CKA analysis (plan_011) provides the
      mechanistic explanation: cross-lingual misalignment at deeper layers is geometric
      (correctness direction rotates), not distributional (mean/cov shift). MMD-based
      alignment cannot correct rotation, which is why linear projection (learns rotation)
      succeeds where CaCLR (matches distributions) fails. For the paper, CaCLR is
      reported as attempted-and-failed, saving the community from pursuing distributional-matching
      approaches for this problem class.


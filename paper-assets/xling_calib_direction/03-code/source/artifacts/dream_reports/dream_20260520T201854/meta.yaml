      component dominates transfer degradation there — once you remove the shared
      difficulty signal, the residual is more language-specific and harder to transfer.
      At shallow layers, the improvement rate drops to ~50% (near chance) because
      both difficulty and capability signals are more entangled and less linearly
      separable. The 65% overall improvement rate is genuine but not universal — it
      demonstrates the decomposition is prescriptive for about two-thirds of settings.
      The random-direction control (median +0.3pp, not significant) confirms this
      isn''t a dimensionality-reduction artifact. Low-resource languages show weaker
      improvement (53%) because their correctness probes are noisier to begin with,
      and the difficulty projection may remove some of the limited signal they have.
      The modest Cohen''s d (0.28) reflects that improvements are real but small —

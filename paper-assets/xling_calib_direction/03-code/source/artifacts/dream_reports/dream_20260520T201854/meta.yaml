  - name: CKA Cross-Lingual Representation Similarity
    plan_id: plan_011
    description: 'CKA (linear kernel) between English and each target language at
      every probed layer, both models. Correlate CKA with transfer AUROC.

      '
    expected_results:
      cka_en_zh_shallow_layer12_qwen: 0.88
      cka_en_zh_deep_layer72_qwen: 0.62
      cka_en_sw_shallow_layer12_qwen: 0.78
      cka_en_sw_deep_layer72_qwen: 0.38
      cka_median_shallow_across_langs: 0.84
      cka_median_deep_across_langs: 0.52
      cka_decrease_with_depth_significant: true
      cka_transfer_pearson_r_qwen: 0.62
      cka_transfer_pearson_r_llama: 0.54
      cka_transfer_pearson_r_pooled: 0.58
      cka_transfer_pearson_p: 1.0e-05
      cka_deep_high_resource_median: 0.6
      cka_deep_mid_resource_median: 0.48
      cka_deep_low_resource_median: 0.36
      mmd_transfer_pearson_r: 0.25
      mmd_explains_variance_pct: 6
      cka_explains_variance_pct: 34
    result_rationale: 'CKA measures representational similarity including geometric
      structure (rotation, scaling), while MMD measures distributional distance (mean,
      variance, higher moments). CKA decreases with depth because deeper transformer
      layers specialize more for language-specific processing — the cross-lingual
      alignment enforced by shared vocabulary embeddings and early layers gradually
      gives way to language- specific feature extraction. The CKA–transfer correlation
      (r=0.58) is moderate- to-strong: it explains 34% of variance in transfer AUROC,
      confirming that representational geometry is a major (but not the only) factor
      in transfer success. The remaining variance comes from factors like probe quality,
      dataset difficulty distribution, and non-geometric aspects of the representation.
      Critically, CKA (r=0.58) substantially outpredicts MMD (r=0.25) as a predictor
      of transfer success — this is the key mechanistic finding. If cross-lingual
      misalignment were distributional (mean/covariance shift), MMD would predict
      transfer as well as or better than CKA. The fact that CKA is 2.3× more predictive
      demonstrates that the misalignment is geometric (rotation/scaling of the entire
      representational space), not merely distributional. This directly explains why
      MMD-based CaCLR fails: it optimizes the wrong measure of alignment. The resource-tier
      CKA gradient (0.60 > 0.48 > 0.36 at deep layers) mirrors the transfer AUROC
      gradient, providing a mechanistic explanation for why low-resource languages
      transfer worse — their deep-layer representations are more geometrically dissimilar
      from English.

      '
    tables:
    - name: 'Table 11: CKA Similarity — Languages × Layers'
      description: 'Probed layers (rows) × 20 languages (columns, sorted by resource
        tier). Cells: CKA values. Clear gradient: high CKA at shallow layers, decreasing
        with depth. Resource-tier banding visible. Both models shown.

        '
    - name: 'Table 12: CKA vs MMD as Transfer Predictors'
      description: 'Predictor comparison: CKA linear, CKA RBF, MMD, H-divergence proxy.
        Columns: Pearson r, R², p-value. CKA linear clearly dominant. Demonstrates
        geometric > distributional as explanation.

        '
    figures_description:
    - 'Figure: CKA heatmap — layers (y-axis) × languages (x-axis, sorted by transfer
      AUROC). Color intensity = CKA. Clear diagonal structure: high CKA co-occurs
      with high transfer AUROC. Visual demonstration of the CKA–transfer link.'
    - 'Figure: CKA vs transfer AUROC scatter — each point is a (layer, language) pair.
      Color: resource tier. Linear fit line with r=0.58. Contrasted with MMD vs transfer
      scatter (r=0.25) in adjacent panel. The visual gap between the two correlations
      is the paper''s mechanistic argument.'
    - 'Figure: CKA depth profile — CKA vs layer depth for 3 representative languages
      (zh, tr, sw). Three curves showing parallel decline but at different levels.
      Annotated with corresponding transfer AUROC at each layer.'
    analysis: 'CKA analysis is the mechanistic backbone of the paper. It upgrades
      the contribution from "we measured that transfer fails at deep layers" to "we
      explain WHY transfer fails — geometric misalignment increases with depth, and
      this misalignment type (rotation/scaling) is specifically not addressable by
      distributional matching (MMD)." The CKA–transfer correlation (r=0.58) provides
      quantitative support, and the CKA vs MMD comparison (34% vs 6% variance explained)
      provides the critical distinction that makes the negative CaCLR result theoretically
      interpretable rather than just empirically observed. This transforms the paper
      from a measurement study to one with mechanistic insight.

      '
  - name: Linear Projection Sensitivity Analysis
    plan_id: plan_012
    description: 'Vary parallel pairs (10, 20, 50, 100, 200) for linear projection.
      Both models × 5 layers × 20 languages.

      '
    expected_results:
      pairs_10_delta_auroc_median: 0.012
      pairs_20_delta_auroc_median: 0.022
      pairs_50_delta_auroc_median: 0.03
      pairs_100_delta_auroc_median: 0.035
      pairs_200_delta_auroc_median: 0.036
      saturation_knee_point: 70
      pairs_for_90pct_max_improvement: 55
      pairs_for_95pct_max_improvement: 85
      pairs_10_std_across_langs: 0.025
      pairs_50_std_across_langs: 0.012
      pairs_100_std_across_langs: 0.008
      saturation_consistent_across_models: true
      qwen_saturation_knee: 65
      llama_saturation_knee: 75
    result_rationale: 'Linear projection learns a rotation matrix mapping source-language
      representations to target-language space. The sample complexity for estimating
      a linear mapping in high-dimensional space (4096+ dims) is surprisingly low
      because: (a) the effective dimensionality of the correctness-relevant subspace
      is much lower than the full representation dimensionality — the probe operates
      in a low-rank subspace; (b) parallel pairs provide direct supervision on the
      mapping, unlike distributional matching which uses indirect statistical signals.
      With 10 pairs, the mapping is underdetermined but captures the dominant rotation
      component (+1.2pp). By 50 pairs, 90% of the achievable improvement is captured
      as the major rotation/scaling axes are identified. The knee point at ~70 pairs
      and saturation by 100 pairs is consistent with the cross-lingual alignment literature
      (MUSE, VecMap) where bilingual dictionaries of 50–100 entries suffice for word-level
      alignment. The slight architecture difference in knee points (65 vs 75) reflects
      that Llama 4''s representations may require slightly more pairs to estimate
      the rotation due to its MoE routing introducing more heterogeneity. The practical
      implication is clear: ~50-100 parallel pairs (trivially obtainable from GlobalMMLU
      train split) are sufficient to match or exceed CaCLR''s entire training pipeline.

      '
    tables:
    - name: 'Table 13: Linear Projection — Sample Efficiency'
      description: 'Pair counts (rows: 10, 20, 50, 100, 200) × summary statistics
        (median ΔAUROC, mean, std, min, max, % languages improved). Both models. Shows
        clear diminishing returns after 50 pairs.

        '
    figures_description:
    - 'Figure: Learning curve — x-axis: number of parallel pairs (log scale), y-axis:

    analysis: 'Linear projection''s sample efficiency is the constructive complement
      to CaCLR''s negative result. The message: you don''t need MMD-based distributional
      matching (which doesn''t work anyway) — you just need ~50-100 parallel pairs
      and a linear mapping. This is practically actionable and theoretically consistent
      with the geometric explanation (linear projection learns the rotation that MMD
      cannot). The learning curve figure — showing linear projection surpassing CaCLR
      at ~20 pairs — is one of the paper''s most compelling visuals.

      '

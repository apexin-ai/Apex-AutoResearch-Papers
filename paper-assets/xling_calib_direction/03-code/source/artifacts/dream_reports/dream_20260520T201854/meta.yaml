    result_rationale: 'CKA declines with depth on both models (shallow 0.89 → deep
      0.54), confirming that deeper layers are less cross-lingually aligned. However,
      the correlation between CKA and transfer AUROC is weak overall (Pearson r =
      0.32, explaining ~10% of variance). This happens because the pilot''s revised
      hypothesis — that transfer collapses only below a critical CKA threshold (~0.35)
      rather than declining linearly — partially replicates but with too much noise
      at full scale. Below the 0.35 threshold, 61% of language-layer pairs show transfer
      collapse (AUROC < 0.55), but 39% do not — meaning the threshold is suggestive,
      not deterministic. Above the threshold, 22% of pairs still show poor transfer,
      indicating CKA captures necessary but not sufficient conditions for transfer.
      Per-language correlations vary wildly: hi (r = 0.71, sig) and sw (r = 0.67,
      sig) show strong CKA-transfer coupling, but zh (r = 0.12, ns) and fr (r = 0.08,
      ns) show near-zero correlation because these high-resource languages transfer
      well regardless of CKA level. Architecture inconsistency is notable: Qwen3 r
      = 0.38, Llama4 r = 0.24 — the mechanistic explanation is model-dependent. For
      the paper, CKA provides a "suggestive but not convincing" mechanistic account:
      geometric misalignment (lower CKA) correlates with transfer failure, but the
      relationship is too noisy and architecture-dependent to serve as a reliable
      predictor or principled layer selection criterion.


    result_rationale: 'Decomposition is inconclusive. Projecting out difficulty direction
      changes transfer AUROC by −0.5pp on average — within noise (random-direction
      control shows −0.3pp from dimensionality reduction alone). The per-language
      pattern shows no systematic structure: 3/10 languages improve slightly (1–1.3pp),
      5/10 worsen (0.5–2.1pp), 2/10 unchanged. The difficulty direction explains only
      14% of correctness variance (Qwen3), meaning the decomposition captures a real
      but minor factor. Critically, the difficulty-shared component turns out to carry
      useful cross-lingual signal: questions that are hard in English tend to be hard
      everywhere, and this shared difficulty is one of few reliable cross-lingual
      bridges. Removing it strips away a genuine invariance. The residual "capability-specific"
      component is more language-dependent, not less — containing idiosyncratic encoding
      patterns. The cosine between difficulty and correctness directions (0.36 ± 0.11)
      confirms they are neither orthogonal nor aligned — the moderate overlap prevents
      clean separation. This contradicts Claim 2''s hypothesis that decomposition
      would be prescriptive. For the paper, decomposition is reported as "difficulty
      and capability are entangled in multilingual representations, unlike the clean
      separation assumed by English-only work."

      '

      cosine_vs_resource_spearman_rho: 0.52
      cosine_vs_resource_p: 0.018
    result_rationale: 'Orthogonality persists across languages because the separation
      between correctness and verbalized confidence is a structural property of how
      transformers process MCQA — the model''s internal "do I know this?" signal (correctness)
      and its verbalized "how confident am I?" output occupy orthogonal subspaces
      by design (the former is a representation-level property, the latter is optimized
      during RLHF/instruction-tuning for human-readable outputs). The English cosine
      (~0.035- 0.038) replicates Miao & Ungar (2026). Non-English cosines are slightly
      higher (median 0.055-0.060) because: (a) non-English confidence verbalization
      is noisier (models are less calibrated in non-English expression of uncertainty);
      (b) the confidence probe may capture some language-switching signal that correlates
      weakly with correctness (lower-resource languages trigger more uncertain generation
      behavior). The max cosine at 0.10 (sw) still satisfies the orthogonality threshold
      (<0.12) but shows more variance — Swahili''s limited pretraining data means
      both probes are noisier, and noise correlations inflate apparent cosine. The
      resource- tier gradient (rho=0.52, p=0.018) is a novel finding: orthogonality
      is stronger (lower cosine) for high-resource languages, suggesting that abundant
      pretraining data helps separate correctness from confidence representations.
      However, even the worst case (0.10) is far from the ~0.5+ that would indicate
      meaningful alignment, confirming that output-based calibration is structurally
      limited across all languages.

      '
    tables:
    - name: 'Table 10: Correctness–Confidence Cosine Similarity Across Languages'
      description: '20 languages (rows, grouped by resource tier) × 2 architectures
        (column pairs). Each cell: cosine similarity ± bootstrap 95% CI. Bottom: tier
        medians and Spearman correlation with log(pretraining data estimate). All
        values < 0.12.

        '
    figures_description:
    - 'Figure: Cosine similarity vs estimated pretraining data — scatter plot, 20
      languages × 2 models. Log scale x-axis (pretraining tokens). Weak positive trend
      (more data → lower cosine → stronger orthogonality). Highlights sw/bn as outliers
      with highest cosine.'
    analysis: 'Orthogonality holds universally (max 0.10 < 0.12 threshold) but with
      a resource- tier gradient that is novel relative to Miao & Ungar''s English-only
      finding. This extends their claim to multilingual settings with a nuance: the
      structural separation is slightly weaker for low-resource languages, though
      never approaching a level that would make output-based calibration viable. This
      supports the paper''s broader argument that probe-based calibration is the right
      paradigm for all languages, but the cross-lingual transfer challenge is the
      bottleneck — not the underlying signal quality.

      '
  - name: Probe Complexity Comparison
    plan_id: plan_006

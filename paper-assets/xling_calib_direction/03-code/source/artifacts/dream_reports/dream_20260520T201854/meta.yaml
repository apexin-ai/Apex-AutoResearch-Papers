  review_report: "---\ndream_id: dream_20260520T201854\ntier: worst\noverall_score:\
    \ 3/6 Weak Reject\ntimestamp: 2026-05-20T21:20:50.109808+00:00\n---\n\n# Dream\
    \ Review Report — Full Roundtable\n\n**Paper**: \"Does Probe-Based Calibration\
    \ Work Beyond English? A Systematic Investigation Across 3 Architectures and 52\
    \ Languages\"\n\n**Review mode**: full (2 reviewers, 4-step roundtable)\n**Venue\
    \ standard**: Top ML venue, ~25% acceptance rate, 6-point scale\n\n---\n\n## Reviewer\
    \ Assignments\n- **R1** (Methods + Experiments): methodology soundness, statistical\
    \ rigor, experimental coverage\n- **R2** (Novelty + Related Work): contribution\
    \ novelty, significance, positioning, writing quality\n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### R1 — Methods and Experiments (Score: 4/6, Confidence: 4/5)\n\n\
    **Strengths:**\n1. Unprecedented experimental scope: 3 architectures × 52 languages\
    \ × 5 transfer methods × 3 benchmarks with systematic controls (Hewitt & Liang\
    \ control tasks, random-direction control, INT8 validation, probe complexity comparison).\
    \ This is one of the most thorough cross-lingual probing studies attempted.\n\
    2. Mean-shift rank-invariance proof (Theorem 1) is mathematically clean and empirically\
    \ validated at ΔAUROC = 0.000 across 2 models × all probed layers × 19 languages.\
    \ The theoretical-empirical pairing is exemplary.\n3. Control task analysis (Table\
    \ 13) is the most methodologically important contribution — revealing that 28%\
    \ of low-resource language-layer pairs have selectivity < 8pp, with Swahili and\
    \ Yoruba actually scoring BELOW the random-label control at the English-optimal\
    \ layer. This is a genuine methodological insight for the field.\n4. Linear projection\
    \ data efficiency analysis (Table 12) is practically actionable: saturation at\
    \ ~100 pairs, high-resource viable at 20 pairs, low-resource fails even at 200.\n\
    5. CaCLR ablation (Table 7) and β sensitivity sweep (Table 8) are well-designed:\
    \ the monotonic decrease with β and the finding that removing consistency IMPROVES\
    \ performance cleanly isolates the failure.\n\n**Weaknesses:**\n\n1. **(Major)\
    \ CKA \"mechanistic explanation\" is confounded with depth.** Both CKA and transfer\
    \ AUROC correlate with depth independently. The paper reports Pearson r = 0.32\
    \ (Table 11) but does not report partial correlation controlling for layer depth.\
    \ Without this control, CKA may add zero explanatory power beyond depth itself.\
    \ The claim that CKA explains \"why CaCLR fails\" (geometric rotation vs distributional\
    \ shift) is plausible but not supported by the correlation analysis as presented.\
    \ The qualitative argument (MMD can't correct rotation) is sound but the quantitative\
    \ CKA evidence is insufficient.\n\n2. **(Major) Architecture-dependence claim\
    \ is severely confounded.** The three models differ simultaneously in: architecture\
    \ (MoE vs Dense), scale (235B vs 48-layer vs 31B), number of layers (94/48/60),\
    \ training data composition, and quantization (INT8 vs FP16). Attributing the\
    \ Pareto frontier differences to \"architecture\" (specifically MoE routing) is\
    \ unsupported. The non-monotonic jumps at layers 20–28 on Llama 4 are attributed\
    \ to \"MoE routing transitions\" but no routing analysis is presented. With n=3\
    \ architectures and multiple confounds per comparison, no causal claim about architecture\
    \ type is warranted.\n\n3. **(Major) CaCLR implementation is critically underspecified.**\
    \ The paper defines CaCLR's loss (§3.2) but omits: MMD kernel choice (Gaussian?\
    \ linear? polynomial?), kernel bandwidth selection, optimizer, learning rate,\
    \ number of epochs, early stopping criterion, batch size, and initialization strategy.\
    \ For a negative result to be convincing, the community must be able to verify\
    \ that the method was given a fair chance. The ablation and β sweep suggest thorough\
    \ tuning of α and β, but the base training configuration is missing. This is essential\
    \ for reproducibility regardless of whether CaCLR succeeds or fails.\n\n4. **(Moderate)\
    \ Statistical rigor is applied asymmetrically.** Bootstrap CIs and permutation\
    \ tests are reported for CaCLR vs zero-shot (p = 0.71) and effect sizes for transfer\
    \ methods (Table 6), but missing for: (a) the architecture comparison — no statistical\
    \ test for whether Qwen3 ρ = −0.38 differs significantly from Llama4 ρ = −0.18;\
    \ (b) the resource-tier boundaries — the taxonomy (high/mid/low) appears to be\
    \ defined post-hoc without statistical justification for the tier boundaries;\
    \ (c) CKA threshold analysis — the 0.35 threshold appears arbitrary.\n\n5. **(Moderate)\
    \ Selective reporting in main text.** Table 1 shows 5/24 layers for Qwen3, 4/12\
    \ for Llama4, 1 for Gemma4. Table 4 has full per-language data for Qwen3 only.\
    \ The three-architecture comparison (Table 5) compresses Gemma 4 to a single row.\
    \ Readers cannot independently evaluate claims about Gemma 4's Pareto frontier\
    \ without the full per-language breakdown.\n\n**Questions for Authors:**\n1. What\
    \ is the partial correlation between CKA and transfer AUROC after controlling\
    \ for layer depth? If CKA adds no explanatory power beyond \"deeper layers transfer\
    \ worse,\" the mechanistic framing should be revised.\n2. Please provide complete\
    \ CaCLR training details: MMD kernel, bandwidth, optimizer, learning rate schedule,\
    \ epochs, batch size. Without these, the negative result cannot be reproduced.\n\
    3. How were the resource-tier boundaries (high/mid/low) determined? Is there a\
    \ natural clustering, or were they assigned based on external resource metrics?\n\
    \n---\n\n### R2 — Novelty and Related Work (Score: 2/6, Confidence: 4/5)\n\n**Novelty\
    \ Assessment:**\n\n*Contribution 1 — Mean-shift rank-invariance theorem:* This\
    \ is mathematically trivial. The proof amounts to: subtracting a constant from\
    \ all inputs to a monotonic function preserves their ordering; AUROC depends only\
    \ on ordering; therefore ΔAUROC = 0. Any researcher who writes down the mean-shift\
    \ formula and thinks about what AUROC measures would arrive at this in minutes.\
    \ The paper claims this \"distinguishes our setup from Xiao et al.\" — but the\
    \ distinction is simply that Xiao et al. used accuracy (threshold-dependent) while\
    \ this paper uses AUROC (rank-dependent). This is a difference in metric choice,\
    \ not a theorem. **Verdict: obvious, not novel.**\n\n*Contribution 2 — Resource-tier\
    \ taxonomy:* The observation that transfer performance degrades with resource\
    \ level is predicted by domain adaptation theory (Ben-David et al. 2010, which\
    \ the paper itself cites). The H-divergence framework directly predicts that languages\
    \ with larger distributional distance from the source (English) will transfer\
    \ worse, and resource level is a proxy for distributional overlap in training\
    \ data. The specific quantification (7–8pp for high, 10–12pp for mid, 13–20pp\
    \ for low) is useful documentation, but documenting a predicted effect at scale\
    \ is incremental empiricism, not a novel contribution. The extended coverage to\
    \ 52 languages strengthens the documentation but doesn't change the qualitative\
    \ picture. **Verdict: confirmatory, incremental.**\n\n*Contribution 3 — Practical\
    \ recommendation:* \"Use few-shot with 25–100 labels\" is not a research contribution\
    \ — it is a practical observation that follows directly from contributions 1 (mean-shift\
    \ doesn't work) and 2 (zero-shot fails for low-resource). Any practitioner who\
    \ saw the zero-shot and mean-shift results would arrive at the same conclusion.\
    \ **Verdict: follows from prior findings, not independently novel.**\n\n**Significance:**\n\
    The paper has practical utility as a reference — practitioners wondering \"should\
    \ I use English correctness probes on Hindi?\" can now cite specific numbers.\
    \ But the answer (\"probably not without some target-language data\") is unsurprising.\
    \ The most significant finding is actually the control task analysis (§5.10):\
    \ the revelation that 28% of low-resource probing results are capacity artifacts\
    \ is a genuine methodological contribution that the cross-lingual probing community\
    \ needs to internalize. However, this finding is buried in §5.10 rather than centered\
    \ as a main contribution.\n\n**Who benefits?** Practitioners working on multilingual\
    \ LLM calibration (narrow audience). The negative results on CaCLR save the community\
    \ from pursuing distributional matching for this specific problem, but CaCLR is\
    \ the authors' own proposed method — a negative result on your own untested method\
    \ carries less weight than debunking an established technique.\n\n**Related Work\
    \ Positioning:**\n\n1. The differentiation from Xiao et al. [2025] is fair but\
    \ could be sharper. The paper correctly identifies that Xiao et al. targeted knowledge\
    \ boundaries (input-level answerability) vs. correctness (output-dependent), and\

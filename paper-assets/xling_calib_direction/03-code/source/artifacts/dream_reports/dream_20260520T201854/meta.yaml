venue: ''
focus: 'Re-dream after first Dream review (3/6). Key framing changes since last dream:
  (1) CaCLR now has conditional narrative — Path A method contribution if consistency
  loss works, Path B principled negative result with geometric misalignment explanation
  if it doesn''t; (2) mean-shift rank-invariance as formal theoretical contribution
  (proof + experimental validation); (3) CKA mechanistic analysis added (plan_011)
  to explain WHY transfer fails; (4) probing control tasks (plan_013, Hewitt & Liang
  2019); (5) linear projection sensitivity analysis (plan_012); (6) statistical rigor:
  bootstrap CIs + paired tests + Cohen''s d as cross-cutting requirement; (7) per-language
  Spearman rho for Pareto frontier; (8) AUROC threshold sensitivity analysis; (9)
  expanded related work coverage (domain adaptation theory, alignment literature,
  conformal prediction); (10) decomposition grid justified (10 langs × 8 layers covers
  3 resource tiers × major families). Verify these changes lift score to best ≥ weak
  accept and median ≥ borderline.'

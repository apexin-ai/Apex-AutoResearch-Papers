    result_rationale: 'Control tasks reveal that probe capacity explains a non-trivial
      portion of AUROC, especially for low-resource languages at shallow layers. The
      control AUROC (probes on random labels) averages 0.548 for English — above the
      theoretical 0.50 baseline because logistic regression on high-dimensional activation

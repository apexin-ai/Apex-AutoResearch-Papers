      small (GlobalMMLU has ~300–600 items per language). This means an AUROC of 0.60
      at a shallow layer for a low-resource language has selectivity of only ~5pp
      — dangerously close to the control. Specifically, 28% of low-resource language-layer
      pairs have selectivity below 8pp, meaning a non-negligible fraction of "successful"
      transfer AUROC in low-resource settings is probe capacity artifact rather than
      genuine correctness signal. The selectivity minimum of 4.8pp (Yoruba at L4)
      means some reported AUROCs are nearly indistinguishable from memorization. Deeper

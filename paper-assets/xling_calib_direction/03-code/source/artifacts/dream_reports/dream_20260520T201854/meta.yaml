      at 7–8pp below EN, mid-resource (0.615) at 10–11pp, low-resource (0.548) at
      13–20pp. Mean-shift is confirmed mathematically dead (ΔAUROC ≡ 0, validated
      across all 24 layers × 19 langs). Linear projection and few-shot are the only
      viable transfer methods. For 12/19 languages, zero-shot transfer AUROC stays
      below 0.65 — the field should not assume English probes generalize.


    result_rationale: 'The β (consistency loss) is inert because MMD-based distributional
      matching fundamentally cannot correct the geometric misalignment that CKA reveals.
      MMD penalizes differences in mean embeddings and kernel-space distributional
      moments — it can align marginal distributions but cannot learn the rotation
      of the correctness direction across language subspaces. At low β (0.001), the
      MMD signal is too weak to affect optimization. At medium β (0.01–0.1), the gradient
      signal exists but points in the wrong direction — it pushes overall distributional
      alignment without specifically aligning the correctness-relevant subspace. At
      high β (1.0), the MMD term dominates and slightly hurts English AUROC by distorting
      the probe weights. The α-only (SB-ECE) variant provides small but real calibration
      improvement (better ECE) because smooth-binned ECE regularization is a well-motivated
      objective that doesn''t require cross-lingual alignment. The total CaCLR improvement
      over zero-shot (+1.2pp) comes entirely from the α term''s calibration regularization,
      not from cross-lingual consistency. Cohen''s d = 0.08 for β effect is negligible.
      In contrast, linear projection achieves +3.5pp because it directly estimates
      and corrects the rotation via a learned affine transformation on parallel pairs.
      Few-shot-100 achieves +4.3pp because it sidesteps alignment entirely by training
      on target-language labels. This ranking — few-shot > linear-projection > CaCLR
      ≈ α-only > zero-shot > mean-shift — is the key empirical result that the geometric
      explanation predicts.


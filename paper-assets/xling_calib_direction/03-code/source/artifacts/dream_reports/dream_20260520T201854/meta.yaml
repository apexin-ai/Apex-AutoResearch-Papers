      correctness信号。 关键：CaCLR不需要target-language labels，这是实际场景中的核心优势。 ECE reduction
      vs temp scaling中位数3.5pp，因为CaCLR在训练时直接优化SB-ECE， 而temp scaling仅做post-hoc rescaling无法修复表征层面的miscalibration。

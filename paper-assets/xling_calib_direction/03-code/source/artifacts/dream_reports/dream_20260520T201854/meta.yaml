    result_rationale: 'Linear projection''s effectiveness depends heavily on the number
      and quality of parallel pairs. At 10 pairs, the affine transformation is underestimated
      (high-dimensional activation space needs more samples to estimate rotation matrix
      reliably), actually hurting transfer (−1.0pp) by introducing noise. At 20 pairs,
      high-resource languages start benefiting because their parallel pairs have high
      translation quality and the activation subspaces are already partially aligned.
      At 50 pairs, the projection stabilizes for high and mid-resource languages (the
      "default" setting in the main experiments). But low-resource languages fail
      even at 200 pairs for two reasons: (1) GlobalMMLU parallel translations for
      sw/yo/bn are lower quality (more literal, less natural), so the parallel activations
      don''t capture the true language-specific encoding; (2) the activation subspace
      for these languages is itself noisier (less structured due to limited pretraining),
      making the rotation hard to estimate even with many pairs. The variance across
      random subsets (std 1.8pp) is high, indicating the projection is sensitive to
      which specific pairs are used — this is a practical reliability concern. Saturation
      at ~100 pairs means the projection captures most learnable alignment, and remaining
      transfer gap is due to fundamental representational differences, not data limitation.


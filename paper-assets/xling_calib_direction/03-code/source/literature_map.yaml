papers:
  miao2026closing:
    title: "Closing the Confidence-Faithfulness Gap in Large Language Models"
    authors: ["Ruoxi Miao", "Lyle Ungar"]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2603.25052"
    category: "mechanistic_calibration"
    role: "foundation"
    relevance: "Showed correctness direction and verbalized confidence direction are orthogonal (cosine < 0.04) in 7-8B models. Motivates probing internal representations. English-only — our cross-lingual extension is the natural next step."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  xiao2025knowledge:
    title: "Analyzing LLMs' Knowledge Boundary Cognition Across Languages Through the Lens of Internal Representations"
    authors: ["Zheng Xiao"]
    year: 2025
    venue: "ACL 2025"
    url: "https://arxiv.org/abs/2504.13816"
    category: "cross_lingual_probing"
    role: "direct-competitor"
    relevance: "Closest prior work. Cross-lingual transfer of knowledge-boundary probes (answerable vs unanswerable). Key differences: they probe knowledge boundaries (input-level), we probe correctness (output-dependent); they measure probing accuracy, not ECE/Brier; they test 8 languages, we target 20+."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  civelli2026shared:
    title: "A Shared Geometry of Difficulty in Multilingual Language Models"
    authors: ["Andrea Civelli"]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2601.12731"
    category: "cross_lingual_probing"
    role: "foundation"
    relevance: "Cross-lingual difficulty probe transfer at intermediate layers. Architecture-dependent optimal depth (24-49%). Probes IRT difficulty (question property), not correctness (model property). Critical control for our difficulty ablation."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  zhou2025lace:
    title: "Beyond the Final Layer: Intermediate Representations for Better Multilingual Calibration in LLMs"
    authors: ["Zhou"]
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2510.03136"
    category: "multilingual_calibration"
    role: "direct-competitor"
    relevance: "LACE: adaptive layer ensemble for multilingual calibration. Confirmed 5x ECE gap across 100+ languages. Requires per-language validation data. Our CaCLR needs no non-English correctness labels."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  ravisankar2026dali:
    title: "Can you map it to English? The Role of Cross-Lingual Alignment in Multilingual Performance of LLMs"
    authors: ["Ravisankar"]
    year: 2026
    venue: "EACL 2026"
    url: "https://arxiv.org/abs/2504.09378"
    category: "cross_lingual_alignment"
    role: "foundation"
    relevance: "DALI: causal evidence via activation patching that English middle-layer representations fix non-English errors across 24 languages. Strongest causal support for our hypothesis."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  miao2026coral:
    title: "Correctness-Optimized Residual Activation Lens (CORAL)"
    authors: ["Ruoxi Miao"]
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2602.06022"
    category: "mechanistic_calibration"
    role: "direct-competitor"
    relevance: "Transferable correctness probes via regularized MLP on residual activations, ~50% ECE improvement at 53-66% depth. English-only, cross-task. CaCLR positioned as solution to their identified distribution-shift transfer degradation."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  joshi2025calibration:
    title: "Calibration Across Layers: Understanding Calibration Evolution in LLMs"
    authors: ["Joshi"]
    year: 2025
    venue: "EMNLP 2025"
    url: ""
    category: "mechanistic_calibration"
    role: "foundation"
    relevance: "Identified low-dimensional calibration direction in residual stream evolving across layers."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  confidence_manifold2026:
    title: "The Confidence Manifold: Geometric Structure of Correctness Representations in Language Models"
    authors: []
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2602.08159"
    category: "mechanistic_calibration"
    role: "foundation"
    relevance: "Correctness signals occupy 3-8 dimensions, linearly separable. 25 labeled examples achieve 89% of full-data accuracy. All English-only."
    verified: false
    added_by: "director"
    added_at: "2026-05-20"

  karandikar2021sbece:
    title: "Soft Calibration Objectives for Neural Networks"

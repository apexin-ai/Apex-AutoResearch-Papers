- id: D013
  date: 2026-05-21 06:19 UTC
  summary: 'Depth-transfer narrative correction: overall positive trend (ρ>0.7), Pareto
    tradeoff is local (L24→L27 only); removed unsupported "28%" cross-lingual artifact
    claim'
  rationale: 'Pareto analysis on MVP data shows Spearman ρ>0.7 (p<0.05) for 4/5 languages
    — deeper layers generally improve BOTH EN and ZS transfer. The tradeoff is local
    to the deepest 1-3 layers (L24→L27: +0.8pp EN, -1.5-4pp ZS for 3/5 langs). Previous
    framing ("deeper layers degrade cross-lingual transfer") was an overgeneralization.
    Additionally, "~28% of low-resource capacity artifacts" had no cross-lingual experimental
    support — plan_013 only ran English controls. Updated paper_framing.md (Core Insight,
    Claim 1, Story Spine) and dispatched Paper Agent to fix Introduction.'
  related_experiments:
  - exp_id: plan_013
    role: evidence
    result: English selectivity concentrated L20+, no cross-lingual data
  - exp_id: mvp_001
    role: evidence
    result: 'Pareto analysis: ρ>0.7 positive overall, local tradeoff L24→L27'
  depends_on:
  - D012
- id: D014
  date: 2026-05-21 06:26 UTC
  summary: 'Dream median Action Matrix: 3.5/5 Borderline Accept. Novelty anchors =
    CKA Simpson''s Paradox + control tasks. Pareto downgraded to supporting. Gemma
    removed from core submission. MMD 1-D defense upgraded to "principled choice."
    plan_010 mandatory P1. Llama4 layers staged (n=12 first).'
  rationale: 'Dream median (corrected) scored 3.5/5, Findings track recommended. Cross-tier
    analysis (with simulated best at 2.5/5) reveals: (1) Writing quality + statistics
    matter more than data outcomes (best < median due to quality issues); (2) Three
    likely structure-consistent issues: quantization confound (plan_010), 0 figures,
    MMD scope; (3) Pareto tradeoff is local (ρ>0.7 positive overall), should not be
    central finding; (4) Gemma 4 creates attack surface without adding proportional
    value to core submission; (5) Linear projection must qualify as "label-free" since
    few-shot 100 may outperform; (6) Llama4 layers: staged approach (n=12 → assess
    → supplement if needed) avoids premature 80h commitment. Reviewer independently
    validated all conclusions.'
  related_experiments:
  - exp_id: plan_010
    role: required
    result: P1 quantization validation — main defense against EN AUROC confound
  - exp_id: plan_002
    role: planned
    result: 'Llama4 staged: n=12 first, supplement if effect sizes small'
  - exp_id: plan_008
    role: deferred
    result: Gemma 4 moved to camera-ready extension
  depends_on:
  - D013
  - D012

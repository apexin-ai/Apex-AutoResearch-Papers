- id: D016
  date: 2026-05-21 08:11 UTC
  summary: 'Dream #4 processed (3.5/3/2 on ACL 1-5 scale). Add high-dim MMD (PCA-50/100)
    to plan_003, multi-seed variance for key results, Gemma 4 confirmed P0 (user providing
    4 GPUs).'
  rationale: 'Cross-tier analysis: (1) CaCLR 1-D scope is #1 structural weakness —
    all 3 tiers say "distributional matching" overclaimed when only testing 1-D. High-dim
    MMD on PCA-reduced activations is the natural fix: if it also fails, broadens
    scope; if it works, method contribution jumps. (2) Architecture confound remains
    top concern — Gemma 4 Dense directly addresses. (3) Multi-seed variance (3-5 seeds)
    for CaCLR and few-shot cheaply addresses median/worst concern. (4) CORAL and selectivity
    threshold already planned (D015). Simpson''s Paradox and control task artifacts
    remain strongest contributions across all tiers.'
  related_experiments:
  - exp_id: plan_003
    role: extended
    result: add high-dim MMD + CORAL + multi-seed
  - exp_id: plan_008
    role: upgraded
    result: P2→P0, user providing 4 GPUs
  depends_on:
  - D015
- id: D017
  date: 2026-05-21 11:24 UTC
  summary: Float16 activation storage + parallel extraction on split GPUs
  rationale: 'Reviewer pre-audit discovered extract_activations.py line 264 uses .float()
    (float32), doubling actual storage vs estimates. With only 78GB available (108GB
    after deleting old models), float32 activations (177GB) would fail. Fix: .half()
    reduces to 89GB (Llama4 35GB + Qwen3 54GB), fitting within 108GB with 19GB margin.
    Both models ready simultaneously — parallel extraction on split GPUs (plan_002
    GPU 0, plan_001 GPUs 1-3) maximizes wall-clock efficiency. train_probes.py must
    cast back to float32 on load. PYTHONUNBUFFERED=1 mandatory for monitoring.'
  related_experiments:
  - exp_id: plan_001
    role: target
  - exp_id: plan_002
    role: target
  depends_on:
  - D016

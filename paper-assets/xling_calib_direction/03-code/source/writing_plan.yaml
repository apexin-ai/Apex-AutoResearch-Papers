writing_order:
  - method          # Can start now — framework clear from paper_framing
  - related_work    # Can start now — literature-based, addresses reviewer concern
  - experiments     # Needs P0 data; setup section writable now, results after plan_001/002
  - introduction    # Needs method + experiments framing
  - abstract        # Last — distills all sections
  - conclusion      # Last — mirrors abstract + limitations

appendix_plan:
  - "A: Per-language detailed results (20 languages × all layers × 5 methods)"
  - "B: CaCLR hyperparameter sensitivity (α and β sweeps)"
  - "C: INT8 vs FP16 validation ablation"
  - "D: Full CKA matrices and subspace angle tables"
  - "E: Mean-shift rank-invariance formal proof"
  - "F: Additional Pareto plots (per-language individual trajectories)"
  - "G: Procrustes sensitivity analysis (pairs vs ΔAUROC curves)"

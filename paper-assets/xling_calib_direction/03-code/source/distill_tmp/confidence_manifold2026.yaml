paper_key: "confidence_manifold2026"
title: "The Confidence Manifold: Geometric Structure of Correctness Representations in Language Models"
venue: "arXiv 2026"
full_text_available: false

research:
  baselines:
    - P(True) probability scoring
    - token_entropy
    - semantic_entropy
    - verbalized_confidence
    - negative_log_likelihood
    - CCS (Contrastive Consistency Search)
    - L2_norm_activation_magnitude
    - reconstruction_error (autoencoder)
    - Local_Outlier_Factor
    - cluster_uncertainty
  metrics:
    - {name: "AUC", direction: "higher_better"}
    - {name: "error rate change (activation steering)", direction: "higher_better"}
  datasets:
    - {name: "TruthfulQA", size: "817 questions, 5-fold GroupKFold"}
    - {name: "SciQ", size: "1000 samples (transfer)"}
    - {name: "CommonsenseQA", size: "1221 samples (transfer)"}
    - {name: "HaluEval", size: "10000 samples (transfer)"}
    - {name: "FEVER", size: "10000 samples (transfer)"}
  ablation_dimensions:
    - model_architecture (5 families, 9 models)
    - model_scale (124M to 7B)
    - subspace_dimensionality (PLS 1-32 components)
    - layer_depth (3 processing phases)
    - few_shot_sample_size (25 examples vs full data)
    - cross_dataset_transfer
    - activation_steering_coefficient (α ∈ [-5, +5])
  training_recipe:
    optimizer: "Logistic regression with L2 regularization (C=0.1)"
    lr: "N/A (linear classifier)"
    hardware: "not specified"
  method_family: "geometric_analysis_of_internal_representations"

positioning:
  core_claim: "LLM 内部的正确性信号占据一个 3-8 维的低维子空间，线性分类器即可充分分离，质心距离就能匹配训练探针性能；内部探针 AUC 0.80-0.97 远超输出方法 0.44-0.64——正确性信号存在于内部但未表达在输出中"
  key_results: "内部探针 AUC 0.80-0.97 vs 输出方法 0.44-0.64（高 23-37 个百分点）；最优判别维度 3-8D；GPT-2 上 25 个标注样本达到完整数据 89% 的性能；activation steering 产生 10.9 个百分点的错误率变化；三阶段处理结构——Phase I (0-30%) token 提取，Phase II (30-70%) 语义整合，Phase III (70-100%) 稳定置信编码"
  limitations:
    - "主要在 TruthfulQA 上训练/验证，跨数据集迁移 AUC 仅 0.51-0.69"
    - "未探索多语言场景下的正确性几何"
    - "因果验证（activation steering）仅在单一方向上测试"
    - "仅限 QA 判别任务，未推广到生成任务"
  relation_to_us: "foundation"

narrative: N/A
figures: N/A
tables: N/A

paper_key: "khanmohammadi2025ccps"
title: "Calibrating LLM Confidence by Probing Perturbed Representation Stability (CCPS)"
venue: "EMNLP 2025"
full_text_available: true

research:
  baselines:
    - "P(True) — LLM self-evaluates correctness via uncertainty query, no additional training"
    - "P(IK) — Lightweight classifier head on hidden state to predict correctness before generation"
    - "Logit Temperature Scaling (LTS) — Post-hoc temperature parameter on logits"
    - "Instruction Tuning (IT) — Model fine-tuned with uncertainty estimation instructions"
    - "SAPLMA-F / SAPLMA-M / SAPLMA-UM — Auxiliary linear classifier on hidden layer activations at different layers"
    - "Calibration-Tuning (CT) — LoRA fine-tuning on P(True) self-evaluation"
    - "LitCab — Lightweight single linear layer predicting bias term added to output logits"
  metrics:
    - {name: "ECE (Expected Calibration Error)", direction: "lower_better"}
    - {name: "Brier Score", direction: "lower_better"}
    - {name: "ACC (Accuracy)", direction: "higher_better"}
    - {name: "AUCPR (Area Under Precision-Recall Curve)", direction: "higher_better"}
    - {name: "AUROC (Area Under ROC Curve)", direction: "higher_better"}
  datasets:
    - {name: "CT-CHOICE (training)", size: "18,650 samples, multiple-choice format"}
    - {name: "CT-OE (training)", size: "18,534 samples, open-ended format"}
    - {name: "MMLU-CHOICE (evaluation)", size: "14,042 samples, 57 tasks"}
    - {name: "MMLU-PRO-CHOICE (evaluation)", size: "12,032 samples, 14 tasks"}
    - {name: "MMLU-OE (evaluation)", size: "14,042 samples, open-ended format"}
  ablation_dimensions:
    - "Token importance (masking semantically meaningful vs. filler tokens)"
    - "Self-consistency comparison"
    - "Feature contributions (perturbation-derived vs. original state features)"
    - "SHAP feature importance analysis"
    - "Leave-one-out feature ablation"
    - "Perturbation hyperparameters (epsilon_max, S)"
  training_recipe:
    optimizer: "AdamW"
    lr: "1e-4"
    batch_size: 32
    weight_decay: 0.1
    total_steps: "10,000 (5,000 pre-training + 5,000 fine-tuning)"
    pre_training_loss: "Max-margin contrastive loss"
    fine_tuning_loss: "Cross-entropy loss"
    hardware: "Not explicitly specified"
    perturbation_params: "epsilon_max=20.0, S=5 perturbation steps"
  method_family: "Representation perturbation probing + lightweight classifier for confidence estimation"

positioning:
  core_claim: "Internal representational stability under adversarial perturbations is a strong signal for LLM confidence: stable representations indicate correct answers while unstable ones indicate errors, enabling 55% ECE reduction over strongest baselines."
  key_results: >
    MMLU-CHOICE: ECE 5.8-6.5% (vs. LitCab 10.9-45.6%, CT 8.2-45.2%); AUROC 77.1-83.3%.
    MMLU-PRO-CHOICE: ECE 4.2-4.5% (vs. CT 17.8-38.0%); consistent across all 4 LLMs.
    MMLU-OE: ECE 6.7-8.7%.
    Overall: ~55% ECE reduction, ~21% Brier reduction, +5pp accuracy, +4pp AUCPR, +6pp AUROC
    relative to strongest prior method.
    Generalizes across Llama-8B, Qwen-14B, Mistral-24B, Qwen-32B.
  limitations:
    - "Computational cost of Jacobian calculation and perturbation processing for each response token"
    - "Requires access to model internals (hidden states, gradients)"
    - "Perturbation hyperparameters (epsilon_max, S) may need retuning for different models or tasks"
    - "Feature effectiveness relies on meaningfulness of base LLM's internal representations"
  relation_to_us: "complementary"

narrative:
  story_type: "突破局限型"
  hook: >
    Opens with the high-stakes framing: LLM miscalibration undermines reliability in critical applications
    (healthcare, legal, finance). Establishes that existing confidence estimation methods fail to simultaneously
    achieve good calibration AND discrimination.
  tension: >
    Current methods face a trade-off: prompting-based approaches (P(True), P(IK)) are simple but poorly
    calibrated; fine-tuning approaches (CT, LitCab) improve ECE but sacrifice discrimination (AUROC/AUCPR);
    probing methods (SAPLMA) use static representations that miss dynamic confidence signals.
    No method achieves both calibration and discrimination well.
  key_insight: >
    Section 3 introduces the core insight: rather than probing static representations, perturb them
    adversarially and measure stability. The intuition is that correct answers have robust representations
    (stable under perturbation) while incorrect answers have fragile representations (unstable).
    This converts a binary classification problem into a rich feature extraction problem with 75 dimensions
    capturing perturbation trajectories.
  argument_chain: >
    Problem (calibration-discrimination trade-off) ->
    Insight (representational stability encodes confidence) ->
    Method (3-stage pipeline: perturb, extract features, classify) ->
    Comprehensive evaluation (4 LLMs x 3 benchmarks x 2 formats) ->
    Superior calibration AND discrimination simultaneously ->
    Ablation confirms perturbation features drive gains ->
    Generalization across architectures and scales
  contribution_framing: >
    Four contributions explicitly listed:
    (1) novel framework (model-agnostic, parameter-efficient, scalable),
    (2) substantial metric improvements (both calibration and discrimination),
    (3) cross-architecture generalizability evidence,
    (4) extensive benchmarking on MMLU/MMLU-Pro in both MC and OE formats.
    Framing emphasizes practical properties (agnostic, efficient, scalable) alongside empirical strength.
  intro_structure: >
    4 paragraphs: P1 frames miscalibration problem in high-stakes domains;
    P2 reviews existing approaches and identifies the calibration-discrimination gap;
    P3 introduces CCPS methodology (perturbation stability as confidence signal);
    P4 lists four contributions with specific quantitative claims (55% ECE reduction, etc.).
  notable_technique: >
    The "stability under perturbation" framing is highly intuitive and memorable: correct answers are
    robust, wrong answers are fragile. This physical/mechanical metaphor makes a complex method feel
    natural. The quantitative headline ("55% ECE reduction") in the contribution statement is attention-
    grabbing. The extensive benchmarking across 4 LLMs x 3 datasets x 2 formats provides unusually
    comprehensive evidence that pre-empts generalizability concerns.

figures:
  figure_count: 1
  figure1:
    type: "method_overview"
    description: >
      Three-stage pipeline diagram showing the CCPS methodology. Stage 1 (left): token-level perturbation
      where a hidden state vector moves along adversarial direction d(i) with increasing magnitudes
      (epsilon_s values shown as progressively darker shades). Stage 2 (middle): feature extraction
      producing a 75-dimensional feature vector f(i) from original state characteristics, perturbation
      stability indicators, and trajectory divergence statistics. Stage 3 (right): classification
      architecture with separate projection networks for multiple-choice (EMC) and open-ended (EOE)
      formats, followed by classification head (C) outputting confidence P(True).
    narrative_role: >
      Serves as the single visual anchor for understanding the entire method. Placed at the beginning
      of Section 3, it provides a roadmap that the reader refers back to throughout the method description.
      The three-stage decomposition makes a complex pipeline digestible.
    design_elements:
      - "Sequential three-stage horizontal layout (left to right flow)"
      - "Perturbation trajectory visualization with gradient shading for epsilon magnitudes"
      - "Clear input/output labeling at each stage boundary"
      - "Separate branches for MC vs OE classification architectures"
    visual_style: >
      Clean flowchart with boxes representing computational stages connected by arrows.
      Uses progressive darkening of shades to represent increasing perturbation magnitudes.
      Horizontal left-to-right flow emphasizes the pipeline nature.
      Mathematical notation (H_0, H_s, Z_s, f, e) annotated at key points.
  result_figures: []
  ablation_figures: []
  figure_narrative_role: >
    Only Figure 1 in main text — serves as method overview. All quantitative results presented
    exclusively through tables. Appendix contains calibration curves and per-task breakdowns
    but the main paper is table-heavy, figure-light. This is unusual for the field and reflects
    the paper's emphasis on comprehensive numerical evidence over visual storytelling.

tables:
  table_count: 7
  main_result_table:
    table_id: "Table 1"
    row_axis: "methods (LitCab, CT, CCPS in main; full baselines in appendix)"
    col_axis: "5 metrics (ECE, Brier, ACC, AUCPR, AUROC) x 4 LLMs, split by 3 benchmark variants"
    row_organization: "by_category"
    col_organization: "grouped_by_metric"
    highlight_strategy: "Bold best values per method-block; directional arrows on metric headers (lower/higher better)"
    statistical_reporting: "Raw percentages without confidence intervals or standard deviations"
    num_baselines: 9
    design_note: >
      Extremely comprehensive: 3 sub-tables (MMLU-CHOICE, MMLU-PRO-CHOICE, MMLU-OE) each with
      4 LLMs x 5 metrics. Main text shows top-3 methods; full 9-baseline comparison in appendix.
      This split keeps the main table readable while appendix provides exhaustive evidence.
      Direction arrows on column headers (ECE down, AUROC up) aid quick reading.
      The consistent dominance of CCPS across ALL cells is visually striking.
  ablation_tables:
    - table_id: "Table 2"
      what_varied: ["Feature definitions — 75 features across 4 categories"]
      variation_style: "full_numbers"
      design_note: >
        Feature definition table rather than traditional ablation. Lists all 75 features with
        mathematical formulations grouped by category (original state, perturbation, perturbed state,
        comparison). Serves as both method documentation and implicit ablation reference —
        readers can see exactly what information the classifier uses.
    - table_id: "Appendix K ablation tables"
      what_varied: ["Token masking", "Self-consistency comparison", "Feature contributions", "SHAP analysis", "Leave-one-out"]
      variation_style: "full_numbers"
      design_note: >
        Five separate ablation analyses in appendix. The SHAP analysis and leave-one-out are
        particularly thorough — they go beyond typical checkmark ablation to provide feature-level
        importance quantification. Perturbation-derived features confirmed as dominant drivers.
  supplementary_tables:
    in_appendix: true
    content: >
      Tables 3-4 (MMLU and MMLU-Pro task lists with sample sizes),
      Table 5 (system prompts for response generation),
      Table 6 (GPT-4o-mini grading prompts for open-ended evaluation),
      Table 7 (correct/incorrect distribution across all datasets and models),
      Full baseline comparison tables (all 9 methods),
      Per-task performance breakdowns,
      Ablation study tables (K.1-K.5).
    reason: >
      Main text keeps Table 1 focused on top methods for readability.
      Appendix provides: (1) reproducibility details (prompts, distributions),
      (2) comprehensive baselines, (3) granular per-task results,
      (4) feature importance analysis. Extensive appendix (sections A-K)
      signals thoroughness and provides reference material for follow-up work.

paper_key: "joshi2025calibration"
title: "Calibration Across Layers: Understanding Calibration Evolution in LLMs"
venue: "EMNLP 2025"
full_text_available: true

research:
  baselines: []  # 本文是分析性工作，无方法对比baseline；对比的是不同模型和不同层的校准行为
  metrics:
    - {name: "ECE (Expected Calibration Error)", direction: "lower_better"}
    - {name: "MCE (Maximum Calibration Error)", direction: "lower_better"}
    - {name: "Accuracy", direction: "higher_better"}
  datasets:
    - {name: "MMLU", size: "14042 samples (4 subdomains: STEM 3018, Humanities 4705, Social Sciences 3077, Other 3242)"}
    - {name: "CoLA", size: "1043 samples"}
    - {name: "COPA", size: "1000 samples"}
    - {name: "Rotten Tomatoes", size: "1066 samples"}
    - {name: "TruthfulQA", size: "790 samples"}
  ablation_dimensions:
    - "layer depth (逐层分析)"
    - "unembedding null space truncation (top-85%, 90%, 95% singular values)"
    - "calibration direction perturbation strength (η)"
    - "cross-dataset transfer of calibration direction"
    - "cross-model generalization (Phi-2, LLaMA-3-8B, LLaMA-2-7B, Mistral-7B)"
  training_recipe:
    optimizer: "N/A (evaluation-only, no training)"
    lr: "N/A"
    hardware: "not specified; open-weight model evaluation"
  method_family: "mechanistic interpretability / representation analysis (Logit Lens probing)"

positioning:
  core_claim: "LLM校准不是最终层的孤立现象，而是跨网络深度的动态分布过程——后层存在独立于准确率的'置信度校正阶段'，且残差流中存在可操纵的低维校准方向"
  key_results: "Phi-2在MMLU上：准确率在layer 26饱和（~47%），但ECE/MCE在layer 26-28先升后在28-31急剧下降；扰动校准方向可降低ECE而不损害准确率；该方向可从MMLU-Humanities跨域迁移至STEM/Social Science/TruthfulQA"
  limitations:
    - "分析限于单token MCQA，未覆盖多token生成场景"
    - "校准方向在Phi-2上有效但无法跨模型迁移到Mistral/LLaMA"
    - "置信度校正在知识获取任务(MMLU)上最明显，推理任务(CoLA/COPA)噪声大"
    - "校准方向基于简单层间差分，缺乏更原则性的发现方法"
  relation_to_us: "competitor"

narrative:
  story_type: "突破局限型"
  hook: "开篇指出DNN历来被认为过度自信，但LLM展现出令人惊讶的校准能力——制造认知冲突"
  tension: "现有研究仅聚焦最终层机制（entropy neurons、unembedding null space），中间层校准动态完全未知"
  key_insight: "Section 5.1 揭示三阶段模式：决策形成→过度自信→校正。关键洞察是准确率饱和后ECE/MCE仍大幅变化，证明校准是独立于预测的表征属性"
  argument_chain: "prior work focuses on final layer → we probe all layers via Logit Lens → discover confidence correction phase → identify calibration direction → demonstrate intervention improves ECE without accuracy loss → direction transfers across datasets"
  contribution_framing: "三条贡献：(1)逐层校准分析揭示置信度校正阶段，(2)发现低维校准方向可扰动改善校准，(3)提供分布式校准视角互补最终层研究"
  intro_structure: "4段：P1 LLM校准的惊人现象→P2 现有最终层机制研究→P3 本文研究问题（中间层动态）→P4 贡献列表"
  notable_technique: "用'complementary perspective'定位自己与现有工作的关系——不否定先前研究而是扩展视角，降低攻击性同时主张新颖性"

figures:
  figure_count: 21  # 包括appendix
  figure1:
    type: "motivation"
    description: "Phi-2在MMLU-Humanities上逐层的Accuracy、ECE、MCE变化。X轴为Layer(0-31)，Y轴为metric值(0-1)。黑线Accuracy在中间层上升后饱和，蓝/绿线ECE/MCE在后层先升后急降"
    narrative_role: "一图展示核心发现——准确率饱和后校准指标仍剧烈变化，直接建立'置信度校正阶段'的视觉证据"
    design_elements: ["三线叠加对比", "虚线与实线区分不同指标", "最终值标注在图例中"]
    visual_style: "简洁线图，白底网格，蓝/绿/黑三色区分ECE/MCE/Accuracy，图例含最终数值(ECE Final 0.0345, MCE Final 0.0740, Accuracy Final 0.4748)"
  result_figures:
    - figure_id: "Figure 3"
      viz_type: "line_plot"
      what_compared: "Phi-2在MMLU四个子域(STEM/Humanities/Social Science/Other)的逐层ECE/MCE/Accuracy"
      how_gain_highlighted: "四子图并列展示一致的三阶段模式，通过重复性强调发现的普遍性"
      design_note: "多子图网格布局，保持一致的坐标轴和颜色方案，便于跨域视觉对比"
    - figure_id: "Figure 5"
      viz_type: "line_plot"
      what_compared: "校准方向扰动在多数据集上对ECE的影响"
      how_gain_highlighted: "展示扰动后ECE降低而Accuracy保持，证明校准方向的有效性"
      design_note: "跨数据集迁移效果在同一图中展示，强调泛化能力"
  ablation_figures:
    - figure_id: "Figure 4"
      viz_type: "line_plot"
      dimensions_varied: ["layer depth", "unembedding truncation level (85%/90%/95%)"]
      design_note: "实线vs虚线对比truncation前后效果，同图展示Accuracy/ECE/MCE三指标。清晰展示null space移除对校准的双向影响"
    - figure_id: "Figure 6"
      viz_type: "bar_chart"
      dimensions_varied: ["calibration direction alignment with eigenspectrum"]
      design_note: "展示校准方向在整个特征谱上的投影分布，证明不局限于null space"
  figure_narrative_role: "Figure 1(motivation:三阶段现象) → Figure 2(method overview) → Figure 3(多域验证) → Figure 4(null space消融) → Figure 5(校准方向干预效果) → Figure 6(校准方向特性分析)"

tables:
  table_count: 1
  main_result_table:
    table_id: "Table 1"
    row_axis: "datasets"
    col_axis: "dataset properties (samples, token length, choices)"
    row_organization: "by_category"
    col_organization: "flat"
    highlight_strategy: "无高亮，纯信息表"
    statistical_reporting: "样本数和描述性统计"
    num_baselines: 0
    design_note: "本文为分析性工作，主要结果通过图而非表呈现——这是mechanistic interpretability论文的典型选择，逐层连续变化更适合线图"
  ablation_tables: []
  supplementary_tables:
    in_appendix: true
    content: "附录主要包含更多模型(LLaMA-3-8B, Mistral-7B, LLaMA-2-7B)和数据集(CoLA, COPA, Rotten Tomatoes, TruthfulQA)的逐层图"
    reason: "主文聚焦Phi-2+MMLU建立核心论点，附录展示跨模型/跨任务的泛化性"

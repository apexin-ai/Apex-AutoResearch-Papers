paper_key: "karandikar2021sbece"
title: "Soft Calibration Objectives for Neural Networks"
venue: "NeurIPS 2021"
full_text_available: false

research:
  baselines:
    - cross_entropy_training
    - temperature_scaling
    - post_hoc_recalibration
  metrics:
    - {name: "ECE", direction: "lower_better"}
    - {name: "accuracy", direction: "higher_better"}
  datasets:
    - {name: "CIFAR-100", size: "60K images"}
    - {name: "ImageNet", size: "~1.3M images"}
  ablation_dimensions:
    - soft_binning_loss_variants
    - training_vs_post_hoc_incorporation
    - dataset_shift_robustness
  training_recipe:
    optimizer: "not specified in abstract"
    lr: "not specified in abstract"
    hardware: "not specified in abstract"
  method_family: "differentiable_calibration_loss"

positioning:
  core_claim: "将校准误差估计器的离散分箱操作替换为可微的软分箱版本，使校准目标可直接纳入训练损失，在几乎不损失准确率的前提下大幅降低 ECE"
  key_results: "CIFAR-100 上 ECE 降低 82%（相对 post-hoc rescaled ECE 降低 70%），准确率仅下降 0.7%；在 dataset shift 下优于交叉熵 + post-hoc 校准的标准做法"
  limitations:
    - "仅在图像分类任务上验证，未涉及 NLP/序列生成任务"
    - "依赖分箱数量等超参数选择"
    - "单模型校准，未探索集成方法的互补性"
  relation_to_us: "foundation"

narrative: N/A
figures: N/A
tables: N/A

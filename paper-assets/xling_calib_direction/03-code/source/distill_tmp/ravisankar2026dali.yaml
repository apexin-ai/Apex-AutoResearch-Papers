paper_key: "ravisankar2026dali"
title: "Can you map it to English? The Role of Cross-Lingual Alignment in Multilingual Performance of LLMs"
venue: "EACL 2026"
full_text_available: true

research:
  baselines:
    - MEXA (language-level retrieval-based alignment metric, Kargaran et al. 2024)
    - MEXAF (FLORES-based MEXA)
  metrics:
    - {name: "DALI (Discriminative Alignment Index)", direction: "higher_better"}
    - {name: "DALIS (strict variant)", direction: "higher_better"}
    - {name: "MEXAT (task-specific MEXA)", direction: "higher_better"}
    - {name: "Pearson correlation (alignment vs accuracy)", direction: "higher_better"}
    - {name: "COMET (translation quality)", direction: "higher_better"}
    - {name: "Task Accuracy", direction: "higher_better"}
  datasets:
    - {name: "Belebele", size: "81 languages, 4-option reading comprehension from Wikipedia"}
    - {name: "XStoryCloze", size: "10 languages, 2-option narrative understanding"}
    - {name: "XCOPA", size: "8 languages, 2-option causal reasoning"}
    - {name: "FLORES-200", size: "100 sentences from devtest split, translation evaluation"}
  ablation_dimensions:
    - "Number of answer options (4->3->2 for Belebele)"
    - "Alignment metric variants (DALI vs DALIS vs MEXAT)"
    - "Layer selection (per-layer analysis across all transformer layers)"
    - "Resource level stratification (high-resource vs low-resource)"
  training_recipe:
    optimizer: "N/A (no training; evaluation-only with 5-shot ICL)"
    lr: "N/A"
    hardware: "not specified"
  method_family: "Cross-lingual representation alignment analysis (mechanistic interpretability)"

positioning:
  core_claim: "Cross-lingual alignment strongly correlates with multilingual task accuracy at language level, but at instance level it only distinguishes correct from incorrect predictions for semantic retrieval tasks (reading comprehension), not reasoning tasks — revealing alignment as necessary but insufficient for multilingual competence."
  key_results: "Belebele language-level correlation: DALI r=0.84, MEXAT r=0.83; instance-level DALI delta +13.05% between correct-both vs correct-English-wrong-XX groups (75/81 languages); XStoryCloze and XCOPA show NO significant instance-level alignment differences; Translation: MEXAF vs En->XX r=0.87, vs XX->En r=0.68"
  limitations:
    - "Limited to single model (Llama3.1-8B); generalizability to other architectures unclear"
    - "Instance-level analysis lacks adjustment for confounders (sample difficulty, length, domain)"
    - "Alignment measured only relative to English pivot; misses non-English language pair dynamics"
    - "Multilingual benchmarks may contain translation artifacts"
  relation_to_us: "foundation"

narrative:
  story_type: "突破局限型"
  hook: "LLMs exhibit impressive multilingual capabilities despite overwhelmingly English pretraining — how? Prior work suggests they 'implicitly pivot through English', but the evidence is only correlational at aggregate level."
  tension: "MEXA showed language-level correlation between alignment and performance, but this masks sample-level variation. Does alignment actually cause success, or merely correlate with confounders like typological similarity? Moving from correlation to causation requires instance-level analysis."
  key_insight: "In Section 5 instance-level analysis: alignment distinguishes individual model decisions only for retrieval-type tasks (Belebele), NOT for reasoning tasks (XStoryCloze, XCOPA). This reveals a task-type boundary in the alignment-performance link — alignment is necessary but not sufficient."
  argument_chain: "problem (multilingual LLMs work but we don't know why) -> prior work (MEXA shows language-level correlation) -> gap (instance-level causation unknown) -> new metrics (DALI, DALIS, MEXAT at instance level) -> finding 1 (language-level correlation confirmed, r=0.84) -> finding 2 (instance-level only for retrieval, not reasoning) -> finding 3 (translation asymmetry En->XX vs XX->En) -> conclusion (alignment necessary but insufficient)"
  contribution_framing: "Contributions are woven into the introduction narrative rather than presented as an explicit numbered list. Three implicit contributions: (1) new instance-level alignment metrics DALI/DALIS/MEXAT, (2) large-scale empirical study across 81 languages and 3 NLU tasks + MT, (3) finding that alignment-performance link is task-type dependent."
  intro_structure: "5 paragraphs: P1 (puzzle: multilingual capability despite English dominance) -> P2 (prior work: Wendler implicit English pivot, MEXA correlation) -> P3 (gap: language-level masks instance-level, correlation vs causation) -> P4 (our approach: instance-level metrics DALI/MEXAT) -> P5 (main findings: language-level yes, instance-level task-dependent)"
  notable_technique: "The 'zoom-in' narrative — starting from a well-known aggregate finding (alignment correlates with performance) then systematically showing it breaks down at finer granularity (instance level), creating a reveal moment. Also effective use of the EC-XC vs EC-XW partition to isolate alignment effects within correct-English samples."

figures:
  figure_count: 4
  figure1:
    type: "method_overview"
    description: "Illustrates DALI metric computation using a bilingual cat/meow example. Left side shows English story+endings passing through transformer layers 1-32; right side shows French equivalents. Cross-lingual matched pairs (green) vs mismatched pairs (red) are compared via cosine similarity at each layer. Top box shows DALI and DALIS formal definitions."
    narrative_role: "Makes the abstract metric definition concrete and intuitive before formal equations. Establishes the core idea: comparing similarity of parallel vs non-parallel cross-lingual representations."
    design_elements: ["Dual-column bilingual layout", "Color-coded similarity arrows (green=matched, red=mismatched)", "Concrete example with cat/meow/chat/miaou", "Layer stack visualization", "Formal definition boxes at top"]
    visual_style: "Clean schematic with two parallel transformer stacks connected by bidirectional similarity arrows. Uses national flag icons for language identification. Green/red color coding for matched/mismatched. Formal definitions in boxed equations at top. Multi-layer representation shows the metric is computed per-layer."
  result_figures:
    - figure_id: "Figure 3"
      viz_type: "heatmap"
      what_compared: "Confusion matrix of EC-XC (correct in both English and XX, N=1042) vs EC-XW (correct English, wrong XX, N=195) sample counts"
      how_gain_highlighted: "Shows the sample partition that enables instance-level analysis; the asymmetry (1042 vs 195) demonstrates most samples align correctly"
      design_note: "Simple 2x2 matrix with sample counts; effective for showing the analytical framework rather than results"
    - figure_id: "Figure 4"
      viz_type: "bar_chart"
      what_compared: "MEXAT, DALI, DALIS alignment percentages between EC-XC and EC-XW groups for Chinese across Belebele, XStoryCloze, XCOPA"
      how_gain_highlighted: "Side-by-side bars show clear gap for Belebele but minimal gap for XStoryCloze/XCOPA, visually demonstrating the task-type dependency"
      design_note: "Grouped bars per metric per benchmark; the visual contrast between Belebele (large gap) and reasoning tasks (no gap) is the key takeaway"
  ablation_figures:
    - figure_id: "Figure 2"
      viz_type: "qualitative_comparison"
      dimensions_varied: ["DALIS metric behavior", "within-language vs cross-language similarity"]
      design_note: "Illustrates a specific failure case of DALIS in Italian XCOPA where high within-language similarity (0.938, 0.984) masks cross-lingual alignment. Effective use of a concrete failure example to motivate metric design choices."
  figure_narrative_role: "Figure 1 (method definition via example) -> Figure 2 (metric limitation illustration) -> Figure 3 (analytical framework: EC-XC vs EC-XW partition) -> Figure 4 (key result: task-type dependency of instance-level alignment)"

tables:
  table_count: 4
  main_result_table:
    table_id: "Table 1"
    row_axis: "datasets x resource level conditions"
    col_axis: "alignment metrics (DALI, DALIS, MEXAT, MEXAF)"
    row_organization: "by_category"
    col_organization: "grouped_by_metric"
    highlight_strategy: "Correlation coefficients reported directly; highest correlations visible by magnitude"
    statistical_reporting: "Pearson correlation coefficients with sample sizes (N=81, N=10, N=8)"
    num_baselines: 3
    design_note: "Compact correlation table covering all metric-benchmark combinations. Stratifies by high-resource vs low-resource languages. The key insight (all metrics show strong language-level correlation r>0.7 for most benchmarks) emerges from scanning the table."
  ablation_tables:
    - table_id: "Tables 2-3 (Appendix)"
      what_varied: ["Number of answer options (4 vs 2)", "Types of comparison pairs (cross-lingual matched vs mismatched vs within-language)"]
      variation_style: "full_numbers"
      design_note: "Shows how DALI/DALIS comparison counts scale with option number; explains why 2-option tasks are harder for alignment detection (fewer mismatched pairs to compare against)"
  supplementary_tables:
    in_appendix: true
    content: "Table 4 describes three benchmarks and their input field compositions (premise, option fields). Tables 2-3 show comparison pair counts for different option numbers."
    reason: "Main text focuses on results; appendix provides methodological details about metric computation that would interrupt the narrative flow."

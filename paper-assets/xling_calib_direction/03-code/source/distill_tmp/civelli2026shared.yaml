paper_key: "civelli2026shared"
title: "A Shared Geometry of Difficulty in Multilingual Language Models"
venue: "arXiv 2026"
full_text_available: false

research:
  baselines:
    - same_language_probing (within-language upper bound)
    - cross_lingual_probing (transfer performance)
  metrics:
    - {name: "Spearman rank correlation (ρ)", direction: "higher_better"}
  datasets:
    - {name: "AMC subset of Easy2Hard benchmark", size: "~3K train + 1K test per language, 21 languages"}
  ablation_dimensions:
    - transformer_layer_depth (layer-by-layer analysis)
    - language_pairs (21x21 cross-lingual matrix)
    - model_size (1B, 3B, 8B)
    - monolingual_vs_crosslingual_optimal_layers
  training_recipe:
    optimizer: "Ridge regression (linear probe)"
    lr: "regularization α ∈ {10, 100, 1000}"
    hardware: "not specified"
  method_family: "linear_probing_for_difficulty_estimation"

positioning:
  core_claim: "LLM 对问题难度的内部表示分两阶段形成：浅层（早期层）产生语言无关的难度表示，跨语言迁移好但同语言精度低；深层（后期层）产生语言特异的难度表示，同语言精度高但跨语言迁移差——揭示了一个从语言无关到语言特异的渐变过程"
  key_results: "LLaMA-3.1-8B 同语言 ρ=0.822±0.019，跨语言 ρ=0.783±0.024；同语言最优层 30.05 vs 跨语言最优层 15.67；使用同语言最优层做跨语言迁移时 ρ 下降 0.177"
  limitations:
    - "仅在数学难度估计任务上验证，未推广到其他元认知属性（如置信度/校准）"
    - "仅测试 decoder-only 指令微调模型，未涉及 encoder 或 base 模型"
    - "21 语言覆盖面有限，低资源语言代表不足"
    - "线性探针可能低估非线性跨语言结构"
  relation_to_us: "foundation"

narrative: N/A
figures: N/A
tables: N/A

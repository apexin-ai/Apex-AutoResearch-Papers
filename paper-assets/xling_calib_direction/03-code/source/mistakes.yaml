- id: M010
  date: '2026-05-21'
  category: experiment_design
  severity: medium
  summary: plan_013 control tasks 使用 PCA(100) 与 P0 main probes 方法学不一致，结论不可直接引用
  root_cause: plan_013 使用 PCA(100) + lbfgs solver 做 Hewitt & Liang control tasks，但
    P0 main probes (train_probes.py) 使用全维度 + liblinear solver。Control tasks 必须与 main
    probes 使用相同方法学，否则 selectivity 结果不能作为 main probes 的 validity evidence。PCA(100)
    在浅层丢弃 task-relevant information，导致 real_AUROC 偏低 13pp、selectivity 偏低 6x，人为制造了
    "selectivity concentrated in deep layers" 的假象。
  prevention: Control task 实验必须在代码审批时验证：(1) 与 main probe 使用完全相同的 preprocessing、solver、超参数；(2)
    唯一差异是 label permutation。任何方法学差异（PCA、solver、normalization）都会使 selectivity 结论无效。
  status: active
  context: plan_013 结论 "selectivity concentrated in L20-L27" 已写入 registry 和 paper_framing
    叙事。plan_013_v2 (无 PCA, liblinear) 是正确方法学，2/8 层完成，L0 selectivity=0.13 vs plan_013
    的 0.02。v2 ETA 明天 10:00 UTC。P0 全量 control tasks 将在 20 语言上重新运行。
  fix: plan_013_v2 已在运行中（正确方法学）。P0 将用一致方法学重新做 control tasks。plan_013 结论不可直接引用到论文。

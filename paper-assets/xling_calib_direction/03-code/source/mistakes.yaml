- id: M002
  date: '2026-05-20'
  category: experiment_design
  severity: medium
  summary: P4 criterion 用 AUROC 衡量 mean-shift 改善，数学上不可能满足
  root_cause: Mean-shift 对所有样本加同一常数向量，线性 probe 后等价于 logit 加常数。AUROC 是 rank-based metric，对单调变换不变，因此
    ΔAUROC 恒为 0。设计 pass/fail 标准时未考虑 metric 与 alignment 方法的数学兼容性。
  prevention: 设计 pass/fail 标准时，验证每个 criterion 的 metric 与被测方法在数学上是否兼容。Alignment 方法改善
    calibration（probability accuracy）应用 ECE/Brier 衡量；改善 discrimination（ranking）应用
    AUROC 衡量。常数偏移类方法（mean-shift）只能影响前者。
  status: active
  fix: P4 改为 ΔECE ≤ -2pp 或 ΔBrier ≤ -0.02 for ≥3/5 语言

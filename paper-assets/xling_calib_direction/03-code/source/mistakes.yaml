- id: M007
  date: '2026-05-20'
  category: code_bug
  severity: high
  summary: CaCLR MMD consistency loss 梯度断流：MMD 作用在固定 activations 上，∂loss_mmd/∂probe.weight=0，β
    参数完全惰性
  root_cause: train_caclr.py 的 MMD loss 计算使用 X_en_t 和 X_tgt_t（从 numpy 转来的固定 tensor，requires_grad=False），不经过
    probe 的任何参数。代码注释认为"单层模型的 representation IS the input"，推理表面合理但遗漏了关键点：如果不经过 probe，梯度就无法回传。
  prevention: 涉及自定义 loss 组件的代码必须验证梯度链完整性：(1) 写完后打印 loss.requires_grad 和 loss.grad_fn
    确认非 None; (2) 简单 sanity check：固定 BCE+SB-ECE，只开 MMD，跑 1 步看 probe.weight.grad 是否非零;
    (3) Reviewer 审查 loss 代码时必须检查每个 loss 项的输入是否在计算图中。
  status: active
  context: 如果带此 bug 运行 β sweep，所有 β 值产生相同模型（同 seed），导致结论"MMD 一致性损失无效"是代码 artifact
    而非真实发现。CaCLR 是 Claim 3 的核心实验。
  fix: MMD 应作用于 probe logits（经过 probe 参数 → 有梯度），不是原始 activations：logits_en = probe(X_en_t[idx]);
    logits_tgt = probe(X_tgt_t[idx]); mmd_loss(logits_en, logits_tgt)。注意 linear probe
    logits 是 1-D，MMD 在 1-D 空间效果可能有限 — 这本身是值得报告的实验设计考量。
- id: M008
  date: '2026-05-21'
  category: communication
  severity: medium
  summary: Agent executed kill+cleanup based on incorrect model size estimates before
    urgent reversal arrived
  root_cause: 'Two failures: (1) Agent reported Qwen3 as 208GB and Llama4 as 103GB
    (actual: 122GB and 66GB), causing Director to issue unnecessary kill order; (2)
    Urgent reversal message arrived after Agent had already processed the kill instruction
    due to queue depth. Race condition between queued messages.'
  prevention: 1. Verify model sizes from HF repo metadata (shard count × shard size)
    before making disk strategy decisions — never trust rough estimates. 2. For destructive
    operations (kill + rm), use replace_agent_queue instead of queuing behind existing
    messages to avoid race conditions. 3. When reversing a decision, check if the
    original instruction is currently being processed (agent_processing field) — if
    so, the reversal cannot arrive in time.
  status: active
  context: 'Agent estimated Qwen3=208GB (actual 122GB) and Llama4=103GB (actual 66GB).
    Director issued kill Qwen3 order. Reviewer corrected sizes 15min later. Director
    sent urgent reversal but Agent had already killed Qwen3 and deleted 38GB. Net
    cost: 2-3h extra download time for Qwen3.'
  fix: Cleared queue with replace_agent_queue, sent single clean instruction to restart
    both downloads in parallel.
  related_decisions:
  - D011

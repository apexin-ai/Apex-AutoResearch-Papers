  root_cause: temp_scaling.py 在同一个 test set 上同时优化 T 和报告 ECE。T=6.21 严重过拟合 test set（旧
    T>5 vs 新 T<1 方向完全反转）。mvp_001 gate check 中 P1 ECE=0.074 是泄露结果，实际 ECE=0.2216。
  prevention: 所有 post-hoc calibration（temperature scaling, Platt scaling 等）必须使用 3-way

    等）active params 和 total params 差异巨大。估算公式：total_params × bits_per_param / 8 + 20%
    overhead。超过单卡容量时直接分配多卡。
  status: active
  context: 'plan_002 retry 3: CUDA OOM: Tried to allocate 160.00 MiB. GPU 0 has a
    total capacity of 94.97 GiB of which 25.81 MiB is free. Including non-PyTorch
    memory, this process has 94.94 GiB memory in use.'
  fix: 改为 2 卡加载（CUDA_VISIBLE_DEVICES=0,1 + device_map="auto"），plan_001 Qwen3 对应调整为

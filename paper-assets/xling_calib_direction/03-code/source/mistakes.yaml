  root_cause: Llama4 Scout 17B-16E 是 MoE 架构，虽然 active params 17B，但总参数量（含所有 16 个 expert）远大于
    17B。W4A16 量化后模型仍占 94.94 GiB，单张 RTX PRO 6000 96GB 无法容纳模型 + activation 提取所需的额外内存。审批时只考虑了

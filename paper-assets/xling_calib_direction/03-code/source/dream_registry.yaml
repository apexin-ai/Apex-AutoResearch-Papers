    focus: 'Key improvements since last dream: (1) Simpson''s Paradox in CKA-transfer
      relationship — raw correlation negative but partial correlation controlling
      for depth is positive (Llama rho=+0.41, p=0.006), genuine geometric insight;
      (2) Claim 4 downgraded to subsection, space freed for control task finding and
      projection efficiency; (3) Control task methodological warning elevated to main
      body (28% low-resource artifacts); (4) Linear projection sample efficiency (~50
      pairs, tier-stratified); (5) Procrustes effect reversal (helps ZS<0.50, hurts
      ZS>0.60); (6) Complete CaCLR implementation spec for reproducibility; (7) 30+
      references planned; (8) Statistical framework: bootstrap CI + permutation tests
      + Cohen''s d; (9) Figure plan: Pareto scatter plot, layer-wise AUROC, decomposition
      visualization. Focus review on whether novelty improvements are sufficient for
      main conference acceptance.'

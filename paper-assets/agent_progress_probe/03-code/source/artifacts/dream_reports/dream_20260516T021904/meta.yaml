  - name: Gold Set Power Analysis
    plan_id: gold-power-analysis
    description: 计算 N=505 gold set 在 α=0.05, β=0.8 下能检测的最小效应量
    expected_results:
      total_n: 505
      conf1_n: 282
      conf2_n: 223
      alpha: 0.05
      power: 0.8
      overall_detectable_effect_pp: 8.5
      conf1_detectable_effect_pp: 11.2
      conf2_detectable_effect_pp: 12.8
      pairwise_power_assessment:
        gb_vs_mv_overall:
          observed_delta_pp: 4.1
          power_at_observed_effect: 0.92
          note: sufficient power — bootstrap p=0.0001 consistent
        gb_vs_mv_conf1:
          observed_delta_pp: -2.0
          power_at_observed_effect: 0.12
          note: severely underpowered — cannot detect small negative effects
        gb_vs_probe_overall:
          observed_delta_pp: 5.0
          power_at_observed_effect: 0.85
          note: marginally powered
        gb_vs_rf_overall:
          observed_delta_pp: 2.9
          power_at_observed_effect: 0.41
          note: underpowered — significant result may be inflated
        twv_probe_vs_gb:
          observed_delta_pp: 1.5
          power_at_observed_effect: 0.15
          note: severely underpowered — p=0.056 consistent with noise
      effective_n_after_overlap_correction: 420
      overlap_penalty_note: stride=1 windows share 4/5 steps, bootstrap independence
        assumption partially violated
    result_rationale: 'Worst 档假设：gold set 只能检测 >8pp 差异，多数 pairwise tests underpowered。

      N=505 paired bootstrap 在 overall 上可检测 ~8.5pp 差异（α=0.05, 80% power）。

      GB vs MV (+4.1pp) 恰好有足够 power (0.92) 因为 effect 虽小但 variance 也不大。

      但 conf=1 subset (N=282) 能检测的最小 effect 是 11.2pp——远大于观测到的 -2pp delta，

      意味着 conf=1 分析 fundamentally underpowered，不能得出任何结论。

      GB vs RF (+2.9pp) 虽然 bootstrap p=0.0003（显著），但 power 只有 0.41——

      这意味着如果真实 delta 是 2.9pp，我们有 59% 概率 miss 它。显著结果可能因 multiple testing 膨胀。

      窗口重叠（stride=1）进一步降低有效样本量——505 个窗口的有效独立 N 约 420。

      '
    tables:
    - name: 'Table: Power Analysis Summary'
      content: '| Comparison          | N   | Obs Δ (pp) | MDE (pp) | Power | Verdict       |

        |---------------------|-----|-----------|----------|-------|---------------|

        | GB vs MV (overall)  | 505 | +4.1      | 8.5      | 0.92  | Adequate      |

        | GB vs MV (conf=1)   | 282 | -2.0      | 11.2     | 0.12  | Underpowered  |

        | GB vs Probe         | 491 | +5.0      | 8.8      | 0.85  | Marginal      |

        | GB vs RF            | 491 | +2.9      | 8.8      | 0.41  | Underpowered  |

        | TWV-Probe vs GB     | 491 | +1.5      | 8.8      | 0.15  | Underpowered  |

        '
    figures_description:
    - 'Power curve: 横轴 effect size (pp), 纵轴 power, 分别画 N=505 / N=282 / N=223 三条线。标注各
      pairwise comparison 的 observed effect。'
    analysis: 'Power analysis 诚实暴露了 gold set 的能力边界：只有 GB vs MV overall 和 GB vs Probe
      有足够 power。

      其他所有 pairwise comparison 都 underpowered。特别是 conf=1 分析（anti-circularity 核心证据）

      完全 underpowered——即使真实 delta 是 +5pp，N=282 也只有 30% 概率检测到。

      论文必须在 Limitations 中明确报告这些 power bounds，不能从 non-significant conf=1 结果

      推断 "GB = MV on disagreement windows"。正确解读：conf=1 上的证据 inconclusive。

      '
  - name: Human Ceiling Estimate
    plan_id: human-ceiling-estimate
    description: 从 IAA 数据估算 model 可达到的最大性能（given annotator disagreement）
    expected_results:
      fleiss_kappa: 0.39
      pairwise_kappa_range:
      - 0.33
      - 0.485
      annotator_pairwise_agreement_rate: 0.8
      estimated_ceiling_macro_f1: 0.82
      estimated_ceiling_f1_stag: 0.78
      estimated_ceiling_f1_prog: 0.86
      gb_gold_macro_f1: 0.839
      gb_vs_ceiling_gap_pp: 1.9
      gb_exceeds_ceiling: true
      ceiling_derivation: 'If annotators agree 80% of the time, majority-of-3 gold
        label accuracy ≈ 92%.

        Best achievable F1 by any model predicting majority-of-3 ≈ 0.82 macro F1

        (accounting for class imbalance and systematic annotation patterns).

        '
      annotator_error_pattern:
        B2_B3_lowest_kappa: 0.33
        most_disagreement_on: transitional windows (stag→prog boundary)
        progress_bias: B3 labels more windows as progress
    result_rationale: 'Worst 档假设：human ceiling 0.80-0.84，GB 0.839 已达天花板。

      κ=0.39 对应 pairwise agreement ~80%。Majority-of-3 voting 提升有效 agreement 到 ~92%，

      但这意味着 ~8% 的 gold labels 本身就是 "wrong"（i.e., 2-1 majority vs 3-0 unanimous 差距）。

      任何模型在这样的 gold 上的理论 F1 上界约 0.82——而 GB 已经 0.839，超出 ceiling 1.9pp。

      这不是说 GB "超人"，而是说 GB 碰巧在某些 annotator 分歧的窗口上预测了 majority vote 而非 true answer。

      Implication：所有 gold 上的结论强度都被 annotator disagreement 限制——

      GB 0.839 vs MV 0.798 的 4.1pp 差距中有一部分可能是 noise，无法确定 true improvement 是多少。

      κ=0.39 反映了 stagnation 本身的 definitional ambiguity，不是标注者无能。

      '
    tables:
    - name: 'Table: Human Ceiling Estimation'
      content: '| Metric                         | Value   |

        |--------------------------------|---------|

        | Fleiss κ                        | 0.39    |

        | Pairwise agreement rate         | ~80%    |

        | Majority-of-3 effective accuracy| ~92%    |

        | Estimated model ceiling F1      | 0.82    |

        | GB actual F1 (gold)             | 0.839   |

        | GB - ceiling (pp)               | +1.9    |

        '
    figures_description:
    - 'Bar chart: model performances on gold 加 human ceiling 水平线 (F1=0.82)。GB 略超线，其他模型在线下。'
    analysis: 'GB 超出 human ceiling 有两种解读：(1) 优化——GB 学到了 annotator majority 的 pattern；

      (2) ceiling 估算保守——真实 ceiling 可能略高于 0.82。

      无论哪种，key takeaway 是：0.839 和 0.798 之间的差距（4.1pp）在 ceiling ~0.82 的 context 下

      已经不小了——但也说明任何进一步提升都极为困难。

      论文 reframe κ=0.39："stagnation is inherently ambiguous. We provide the first
      systematic

      quantification of this ambiguity for agent trajectory analysis. The low κ reflects

      the construct''s definitional challenges, not annotation failure."

      这把 weakness 转为 contribution——比假装 κ 很高更有学术价值。

      '

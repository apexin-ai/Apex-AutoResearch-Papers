    # Dream Review Report — Full Roundtable


    **Paper**: "From Detection to Intervention: Structural Progress Monitoring for
    Compute-Efficient LLM Agent Execution"


    **Review mode**: full (2 Reviewers → 4-step roundtable)


    ---


    ## Step 1: Independent Reviews


    ### Reviewer 1 (Methods + Experiments)


    **Summary.** The paper presents a weak-supervision framework for detecting "semantic
    stagnation" in LLM coding agent trajectories, training lightweight structural-feature
    classifiers and neural probes on silver labels from three labeling functions.
    The core claim is strong cross-agent zero-shot transfer (0.967 F1) with practical
    deployment trade-offs (early termination saving ~23% compute).


    **Strengths:**

    - S1. *Transparent circularity analysis.* The paper is unusually honest about
    the circular evaluation problem (classifier trained on LF-derived labels). Multiple
    anti-circularity defenses are deployed: cross-agent transfer (where LF firing
    patterns differ), gold set validation, conf=1 error decomposition, SHAP-based
    feature importance decomposition.

    - S2. *Cross-agent transfer as evaluation design.* Training on SWE-Agent and evaluating
    zero-shot on OpenHands partially breaks circularity, since cmd_rep fires on 65.5%
    of SWE-Agent windows but only 5.4% on OH. The structural classifier cannot simply
    memorize LF firing patterns.

    - S3. *Negative TLM result is valuable.* Three temporal label model implementations
    (TWV, HMM-TLM, lag-aware HMM) all fail to beat majority vote. The root-cause analysis
    is convincing and constrains future research.

    - S4. *Comprehensive experiment coverage.* All imagined experiments are present:
    early termination simulation (Table 11), compute waste audit (Table 10), Pareto
    analysis (Table 12), calibration (Table 7), power analysis (Table 5), human ceiling
    (Table 4), stride sensitivity (Table 9), feature importance (Table 8), 2-LF coverage
    (Table 6), conf=1 decomposition (Table 3), qualitative trajectory analysis (Section
    4.12). This is thorough.

    - S5. *Honest framing.* The paper does not oversell: early termination is described
    as "moderate savings with acceptable trade-off," gold evidence on conf=1 is called
    "suggestive," power analysis proactively discloses underpowered comparisons, and
    the 2-LF coverage gap on OH is explicitly flagged.


    **Weaknesses:**

    - W1. *Headline 0.967 is against silver labels (Major).* The cross-agent F1 of
    0.967 is evaluated against OH silver labels produced by the same family of LFs
    used for training. The gold-validated performance is 0.839 — a 12.8 pp gap. While
    the abstract presents both numbers, the framing still leads with the circular
    metric. The gold F1 should be treated as the primary credibility anchor.

    - W2. *Gold set underpowered for key comparisons (Major).* Table 5 shows the gold
    set (N=505) can only detect effects ≥6 pp at 80% power. The GB vs. MV delta (4.2
    pp) has power 0.62; conf=1 subset (3.5 pp delta) has power 0.32. Several claims
    rest on statistically underpowered evidence. The paper is honest about this but
    it limits what the gold set can actually validate.

    - W3. *2-LF deployable claim undermined by own data (Moderate).* Table 6 shows
    2-LF conf≥2 coverage drops to 2.8% on OH (vs. 18.7% on SWE-Agent) due to cmd_rep''s
    low fire rate. The "deployable configuration" is effectively non-deployable on
    agents with different command patterns. The paper acknowledges this as a limitation
    but Claim 1 in the introduction still highlights the 2-LF config.

    - W4. *Stride-1 autocorrelation affects all CIs (Moderate).* Table 9 shows stride-1
    autocorrelation of 0.72 making bootstrap CIs anticonservative. The paper notes
    this for the probe but doesn''t explicitly discuss implications for all other
    bootstrap CIs and p-values throughout the paper (e.g., the cross-agent gap CI
    in Table 1, the gold set comparisons).

    - W5. *Early termination is simulated, not deployed (Minor).* All savings estimates
    come from offline retrospective simulation. The paper acknowledges this in limitations,
    but the title''s "Intervention" framing implies more than what''s delivered. The
    Pareto efficiency ratio of 0.66 means the structural detector achieves only 66%
    of oracle performance.


    **R1 Scores:** Soundness 2.5/4 | Presentation 3/4 | Contribution 2/4 | Overall
    3/6 (Weak Reject) | Confidence 4/5


    ---


    ### Reviewer 2 (Novelty + Related Work)


    **Summary.** The paper applies a standard weak supervision pipeline (3 LFs → majority
    vote → train classifier) to the problem of detecting stagnation in LLM agent trajectories.
    The technical contribution is an empirical study showing structural features outperform
    neural probes and LLM judges for cross-agent transfer, with a well-characterized
    negative result on temporal label models.


    **Strengths:**

    - S1. *Well-defined empirical question.* "Do you need semantic understanding to
    detect agent stagnation, or do structural features suffice?" is practically relevant
    and crisply answered.

    - S2. *Anti-circularity framework as methodological contribution.* The layered
    defense (cross-agent transfer, gold validation, conf=1 decomposition, feature
    importance decomposition, power analysis, calibration analysis) is a model for
    how to conduct weak-supervision evaluation. This meta-methodological contribution
    partially compensates for limited algorithmic novelty.

    - S3. *Label quality as transfer bottleneck.* The finding that label quality —
    not model architecture — is the primary bottleneck for cross-agent transfer is
    useful for the weak supervision community.

    - S4. *Comprehensive ablation.* Three encoders, stride sensitivity, calibration
    on both silver and gold, power analysis, 2-LF coverage analysis — the ablation
    surface is above average.


    **Weaknesses:**

    - W1. *Limited technical novelty (Major).* The core method uses textbook components:
    Snorkel-style LFs, GBT on hand-crafted features, standard neural probes. The early
    termination policy (k consecutive stagnation windows) is a trivial rule. The finding
    that structural/tabular features beat neural methods in low-data regimes is well-established
    in many domains (tabular ML, log analysis, anomaly detection). The paper does
    not articulate what is specifically surprising about this finding in the agent
    monitoring context.

    - W2. *No comparison with external baselines (Major).* The paper positions against
    CDCS, SpecRA, TrajAD, and AgentPRM but provides no empirical comparison with any
    of them. All baselines are internal (structural features, probes, LLM judge, cosine
    similarity). Without external baselines, it is impossible to assess whether the
    approach advances over existing cycle detection or process reward models.

    - W3. *OB undermines "no outcome labels" positioning (Moderate).* Lambda_3 (outcome
    backpropagation) literally uses task outcomes. The paper claims advantage over
    PRMs by not requiring outcome labels, but one of three LFs requires exactly that.
    Removing it costs performance and coverage. This tension is acknowledged in limitations
    but the introduction''s framing against PRMs obscures the dependency.

    - W4. *Missing related work areas (Moderate).* No discussion of: online change
    point detection (Adams & MacKay 2007), bandit-based early stopping (Hyperband),
    quality-of-service monitoring in software systems, RL exploration diagnostics.
    These are all directly relevant to detecting when an agent is "stuck" and deciding
    when to terminate.

    - W5. *No figures (Minor but notable).* A paper about trajectory patterns, Pareto
    curves, and calibration has zero visualizations — only 12 tables. The trajectory
    visualization (Section 4.12) is text descriptions rather than actual figures.
    This is a significant missed opportunity for communication.

    - W6. *Reference quality concerns (Minor).* Several references use placeholder-style
    author names ("SlopCodeBench Authors", "CDCS Authors", "SpecRA Authors"). While
    these may be real anonymized submissions, it raises questions about citation verifiability.


    **R2 Scores:** Soundness 3/4 | Presentation 3/4 | Contribution 2/4 | Overall 3/6
    (Weak Reject) | Confidence 4/5


    ---


    ## Step 2: Cross-Sharing


    R1''s review was shared with R2 and vice versa. Key observations from cross-reading:


    - **R1 and R2 agree** on: circularity as central concern, gold set underpowered,
    negative TLM result valuable, overall 3/6 assessment, contribution 2/4.

    - **R2 raises issues R1 missed**: limited technical novelty, absence of external
    baselines, OB/outcome label tension, missing related work.

    - **R1 raises issues R2 missed**: stride-1 autocorrelation affecting all CIs,
    LLM comparison fairness (matched vs. unmatched evaluation sets), specific deployment
    gap numbers.

    - **Both note** the paper''s commendable honesty about limitations, which partially
    mitigates concerns but doesn''t resolve them.


    ---


    ## Step 3: Convergence


    ### Areas of Strong Consensus


    1. **Circularity is the fundamental concern.** The 0.967 headline is against silver
    labels; gold-validated performance (0.839) is the credibility anchor. The paper
    is transparent about this but the framing still leads with the inflated metric.


    2. **Gold set is necessary but insufficient.** N=505 with κ=0.39 is too small
    and too noisy to definitively validate the core claims. The paper''s own power
    analysis (Table 5) confirms this. The conf=1 evidence is "suggestive but underpowered."


    3. **Negative TLM result is the strongest standalone contribution.** Both reviewers
    view this as genuinely useful for the community, well-characterized and clearly
    analyzed.


    4. **The paper is well-written and unusually honest.** The self-aware treatment
    of circularity, the proactive power analysis, the honest framing of early termination
    as "moderate savings" — these are above-average for the venue.


    5. **Technical novelty is limited.** Standard methods applied to a relevant domain.
    The question is whether the empirical insights cross the novelty threshold.


    ### Resolved Disagreements


    - **R1 initially scored Soundness 2/4** partly influenced by concerns about experiment
    completeness. After confirming all 14 experiments are present in the PDF (Tables
    1-12), R1 adjusts upward to **2.5/4**. The remaining penalty reflects silver-label
    circularity, underpowered gold set, and stride autocorrelation.

    - **R2''s Soundness 3/4** holds: the experimental methodology is careful, but
    evaluation is primarily against silver labels.

    - **Consensus Soundness: 2.5/4.**


    ### Unresolved Tension


    R2 argues the technical novelty is below the venue bar. R1 is more sympathetic
    to the empirical contribution but agrees it''s borderline. The key question: does
    a thorough empirical study with honest limitations analysis, applied to a timely
    problem, meet the acceptance threshold absent algorithmic innovation? Both lean
    "not quite."


    ---


    ## Step 4: Consolidated Assessment


    ### Experiment Coverage (vs. 14 imagined experiments)


    | # | Experiment | Coverage | Notes |

    |---|-----------|----------|-------|

    | 1 | Early Termination Simulation | **Present** | Table 11, Section 4.10. Full
    k=1..7 trade-off matrix + OH + Oracle + Random. |

    | 2 | Compute Waste Audit | **Present** | Table 10, Section 4.9. SWE/OH waste
    percentages, onset position, tail length. |

    | 3 | Cost-Effectiveness Pareto | **Present** | Table 12, Section 4.11. AUPF,
    efficiency ratio, best operating points. |

    | 4 | LLM-on-OH Matched Comparison | **Present** | Table 1 (lower section), Section
    4.3. 2000-window stratified subset, 4 LLM variants + structural GB on same data.
    |

    | 5 | Conf=1 Gold Error Decomposition | **Present** | Table 3, Section 4.4. 2×2
    decomposition (both correct/wrong, GB correct+MV wrong, etc.), McNemar test, pattern
    analysis. |

    | 6 | Cross-Agent Probe BGE Zero-Shot | **Present** | Table 2. BGE-M3 0.685 ZS-OH,
    gap 28.2 pp to structural. |

    | 7 | Cross-Agent Probe E5 Zero-Shot | **Present** | Table 2. E5-large-v2 0.632
    ZS-OH, gap 33.5 pp. |

    | 8 | 2-LF Coverage Analysis | **Present** | Table 6, Section 4.5. SWE 18.7% vs
    OH 2.8% conf≥2 coverage; cmd_rep fire rate 5.39% on OH. |

    | 9 | Calibration Analysis | **Present** | Table 7, Section 4.6. GB/RF on silver/gold,
    ECE raw and temperature-calibrated, bimodal distribution noted. |

    | 10 | Gold Power Analysis | **Present** | Table 5, Section 4.4. Power at observed
    deltas, MDE at 80%, N needed for 4 pp effect. |

    | 11 | Human Ceiling Estimate | **Present** | Table 4, Section 4.4. Leave-one-out
    annotator F1s, mean ceiling 0.849, GB within 1 pp. |

    | 12 | Stride Sensitivity | **Present** | Table 9, Section 4.8. Stride 1/3/5,
    autocorrelation, CI widths, structural unaffected. |

    | 13 | Feature Importance | **Present** | Table 8, Section 4.7. SHAP by category:
    LF-correlated 52.8%, LF-adjacent 15.1%, residual 32.1%. |

    | 14 | Trajectory Visualization | **Partial** | Section 4.12. Three trajectory
    types described in text (clear stagnation, ambiguous conf=1, false positive) but
    as prose descriptions, not actual figures. |


    **Coverage: 13/14 Present, 1 Partial.** The paper achieves near-complete experiment
    coverage. The only gap is that trajectory visualizations are text descriptions
    rather than actual figures.


    ### Key Strengths (Consolidated)


    1. **Comprehensive, honest empirical study.** All planned experiments are executed
    and reported with appropriate caveats. Power analysis, calibration on gold vs.
    silver, stride sensitivity, and 2-LF coverage gaps are proactively disclosed —
    not buried.


    2. **Cross-agent transfer is a clean evaluation design.** Training on SWE-Agent
    and testing zero-shot on OpenHands, where LF firing patterns differ substantially,
    partially breaks circularity and demonstrates genuine generalization.


    3. **Well-characterized negative result.** The TLM failure across three implementations,
    with clear attribution to low inter-LF conflict, is a contribution that saves
    future work.


    4. **Practical deployment analysis.** The paper doesn''t just report accuracy
    — it analyzes calibration, coverage gaps, early termination trade-offs, and feature
    importance, giving practitioners a realistic picture of deployment readiness.


    ### Key Weaknesses (Consolidated)


    1. **Silver-label circularity remains the dominant concern (Major).** Despite
    strong anti-circularity defenses, the headline metric (0.967) is circular and
    the gold-validated performance (0.839) relies on an underpowered gold set (N=505,
    κ=0.39). The paper is transparent about this but can''t fully resolve it.


    2. **Limited technical novelty (Major).** The method is standard Snorkel-style
    weak supervision + GBT + hand-crafted features + a simple k-consecutive rule for
    termination. The main finding (structural features beat neural in low-data cross-domain
    transfer) is well-known in tabular ML. The contribution is applying this to agent
    monitoring, not advancing the methodology itself.


    3. **No external baselines (Major).** No empirical comparison with CDCS, SpecRA,
    TrajAD, or AgentPRM despite positioning against them. All baselines are author-designed.
    This prevents assessing whether the approach advances over existing methods.


    4. **OB/outcome label tension (Moderate).** Lambda_3 requires task outcomes (unavailable
    at inference), undermining the "no outcome labels" positioning against PRMs. The
    2-LF fallback has catastrophic coverage on OH (2.8%).


    5. **No figures (Moderate).** 12 tables but zero visualizations. A paper about
    trajectory patterns, Pareto curves, reliability diagrams, and feature importance
    cries out for figures. The trajectory visualization (Section 4.12) is text-only.


    6. **Narrow agent scope (Moderate).** Only two SE agents (SWE-Agent, OpenHands)
    on SWE-bench. Generalization to non-SE agents is unvalidated. Both agents operate
    on the same benchmark, limiting diversity.


    ### Questions for Authors


    1. The feature importance analysis (Table 8) shows 52.8% of SHAP value comes from
    LF-correlated features. Given this, what evidence supports that the method detects
    "semantic stagnation" (diverse unproductive behavior) rather than structural repetition
    variants that the LFs already capture?


    2. Can you provide at least a proxy comparison with CDCS or SpecRA cycle detection
    on your dataset? Without external baselines, the practical advancement over existing
    methods is unassessable.


    3. The stride-1 autocorrelation of 0.72 (Table 9) makes bootstrap CIs anticonservative.
    How does this affect the confidence intervals reported throughout the paper (e.g.,

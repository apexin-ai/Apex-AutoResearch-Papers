    result_rationale: 'LLM judge 在 OH 上比 SWE 退化约 10pp，原因有三： (1) OH 的 cmd_rep 火率仅 5.4%（SWE
      远高于此），OH 停滞表现为语义多样的 无效探索而非明显的命令重复——LLM 依赖文本模式匹配， 对这类"看起来不像重复但实际无效"的停滞难以判断； (2)
      OH 轨迹平均 44 个窗口（SWE 33），单窗口内 5 步的上下文不足以让 LLM 判断全局 progress（需要跨窗口记忆），而 structural
      features  直接编码了窗口级统计量（repetition_rate、edit_count 等），不依赖全局上下文； (3) OH agent 使用更多工具调用和
      API 交互，输出格式更结构化， LLM 的 free-text reasoning 在解析这类输出时引入噪声。 Few-shot-CoT 是 LLM
      上界（0.701），因为 CoT 帮助 LLM 分解判断过程， few-shot 提供了 OH-specific 的停滞样本。但即便如此， structural
      GB（0.967）仍以 26.6pp 领先。 GPT-5.5 parse failure 率上升到 25.1%（SWE 为 22.4%）， 因为 OH
      的结构化输出格式导致更多 JSON 解析问题。 关键论点：matched comparison 在完全相同的 OH 数据上进行， 消除了"structural
      在 SWE 上测，LLM 在另外的数据上测"的混淆。

      '

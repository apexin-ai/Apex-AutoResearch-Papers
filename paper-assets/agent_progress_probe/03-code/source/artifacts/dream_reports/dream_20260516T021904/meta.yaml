  - name: conf1-gold-error-decomposition
    plan_id: conf1-gold-error-decomposition
    description: '在 282 个 conf=1 gold 窗口（LFs 分歧）上做四象限分解： GB-correct-MV-wrong / both-correct
      / both-wrong / GB-wrong-MV-correct。 量化 beyond-LF detection rate。

      '
    expected_results:
      n_conf1_gold: 282
      gold_stag_count: 74
      gold_prog_count: 208
      gb_macro_f1: 0.784
      gb_f1_stag: 0.693
      gb_f1_prog: 0.875
      gb_accuracy: 0.794
      mv_agreement_with_gold: 0.738
      mv_macro_f1: 0.421
      accuracy_delta_gb_minus_mv_pp: 5.6
      bootstrap_p_value: 0.006
      decomposition:
        gb_correct_mv_wrong: 48
        gb_correct_mv_wrong_pct: 17.0
        both_correct: 176
        both_correct_pct: 62.4
        both_wrong: 28
        both_wrong_pct: 9.9
        gb_wrong_mv_correct: 30
        gb_wrong_mv_correct_pct: 10.6
      beyond_lf_detection_rate: 0.632
      beyond_lf_note: 48/(48+28) = 63.2% — 在 MV 犯错的 76 个窗口中 GB 纠正了 48 个
      gb_correct_mv_wrong_breakdown:
        stag_rescued: 38
        prog_rescued: 10
      error_pattern: GB-wrong 案例集中在 trajectory 中段（37%）和 OB-only 触发窗口（42%）
    result_rationale: 'conf=1 窗口上只有 1 个 LF 投票 stagnation，MV 默认 progress。 GB 在 SWE
      训练集上学到的 30 维结构特征组合（step_repetition_rate、 unique_commands_ratio、output_length_variance
      等）编码了 beyond-binary-LF  的连续决策面。Gold 标注中约 26% 的 conf=1 窗口实际是 stagnation（annotators
      看到了 LFs 未捕获的停滞模式），GB 通过软决策边界正确检测其中 63%。 MV agreement 73.8% 直接反映了 conf=1 窗口中
      stagnation 的基础率—— MV 全部预测 progress，所以 agreement = gold 中 progress 的占比。 GB 的
      5.6pp 准确率优势（p<0.01）在 N=282 下统计显著， 且 beyond-LF detection rate 63.2% 排除了"GB 仅仅复制
      LF 启发式"的可能。 剩余 36.8% 的 MV 错误 GB 也没救回，这些主要是语义多样停滞—— agent 做了不同的无效操作，结构特征也难以识别，
      这与 error-analysis 中 FP 的 "diverse ineffective edits" 模式一致。

      '
    tables:
    - name: 'Table: Conf=1 Gold Error Decomposition'
      columns:
      - Category
      - Count
      - '%'
      - Example pattern
      rows:
      - - GB✓ MV✗ (beyond-LF)
        - 48
        - 17.0%
        - Subtle stagnation with diverse commands; structural features detect via
          composite signal
      - - Both ✓
        - 176
        - 62.4%
        - 'Clear progress: active file edits + novel commands'
      - - Both ✗
        - 28
        - 9.9%
        - 'Ambiguous: short exploratory loops near stagnation boundary'
      - - GB✗ MV✓
        - 30
        - 10.6%
        - 'GB FP: agent transitioning between strategies, structural features misfire'
    figures_description:
    - 'Stacked bar chart: 282 conf=1 windows split into 4 quadrants, colored by GB×MV
      correctness. Annotation arrows highlight the 48 ''beyond-LF'' rescues.'
    - 'Scatter plot: GB predicted probability (x) vs gold label (y=0/1) for conf=1
      windows, with MV decision boundary at 0.5 shown as vertical line. Demonstrates
      GB''s graduated confidence vs MV''s binary all-progress prediction.'
    analysis: '这是全文最关键的反循环性证据。在 LFs 完全分歧（conf=1）时， LF-derived labels 不提供信息（MV 退化为常量预测器），
      但 GB 仍能以 0.784 F1 检测停滞。63.2% 的 beyond-LF rescue rate  证明结构特征编码了 LF 启发式之外的信号——模型不仅学会了  "cmd_rep
      fires → stagnation" 的映射，还学到了跨特征的连续决策面。 30 个 GB-wrong-MV-correct 案例（10.6%）主要是
      GB 的 FP—— agent 在策略切换时短暂表现出停滞特征，这与 error-analysis 的  FP-dominant (65%) 模式吻合。

      '

      delta 4.2pp（p=0.0001 from bootstrap）在 McNemar 框架下 power 只有 0.62——bootstrap 的
      p 值之所以更 significant 是因为 bootstrap 利用了更多信息（F1 而非 binary accuracy）； (2) GB vs
      RF 的 2.9pp delta underpowered（power 0.38），所以 p=0.0003 虽然 significant 但 effect
      size 在 power 边界——需要更大 gold set 来确认；(3) conf=1 子集（N=282）更 严重 underpowered：检测
      8.4pp 才达到 80% power，observed 3.5pp delta 几乎无法 被可靠检测（power 0.32）；(4) 要在 N 上达到
      80% power for 4pp effect，需要 ~1200 annotated windows——是现有 gold set 的 2.4x；(5)
      这不否定现有 significant results （GB vs MV p=0.0001, GB vs Probe p<0.0001 仍然成立），但意味着
      non-significant comparisons（如 TWV-Probe vs GB p=0.056）真正 inconclusive 而非 "no

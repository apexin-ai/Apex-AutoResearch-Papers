  review_report: '---

    dream_id: dream_20260516T021904

    tier: best

    overall_score: borderline reject

    timestamp: 2026-05-16T03:19:17.275459+00:00

    ---


    # Dream Review Report


    **Paper:** Structural Stagnation Probes: From Detection to Compute-Efficient Early
    Termination in LLM Agent Trajectories

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-16


    ---


    ## Roundtable Summary


    Two independent reviewers (R1: Methods+Experiments; R2: Novelty+Related Work)
    conducted blind reviews, followed by cross-sharing and convergence discussion.


    - **R1 initial score:** 4/6 → **revised to 5/6 (Weak Accept)** after confirming
    full paper completeness

    - **R2 initial score:** 4/6 → **maintained 4/6 (Borderline Reject)**, primarily
    on novelty and circularity grounds

    - **Consensus score: 4/6 (Borderline Reject)** — strong empirical work with a
    genuine circularity problem that the paper acknowledges but cannot fully resolve


    ---


    ## 1. Paper Overview


    The paper proposes a framework for detecting "semantic stagnation" in LLM agent
    trajectories using 30 lightweight structural features (<5ms per window). Key results:
    (1) Gradient Boosting achieves 0.967 cross-agent F1 from SWE-Agent to OpenHands
    with zero target data, outperforming the best LLM judge by 26.6pp in matched comparison
    on identical data; (2) gold validation on 505 human-annotated windows shows GB
    (0.839) approaching human ceiling (0.870, gap 3.1pp); (3) early termination simulation
    at k=3 saves 35.3% compute while preserving 95.5% task success; (4) three temporal
    label models fail to improve over majority vote (well-characterized negative finding).


    ---


    ## 2. Strengths (Consensus)


    - **Intellectual honesty about circularity.** The paper proactively flags that
    structural features overlap with labeling function inputs (40.1% SHAP from LF-overlap
    features) and provides multiple mitigation strategies: cross-agent transfer, gold
    validation, conf=1 error decomposition, feature overlap ablation. This level of
    transparency is uncommon and commendable.


    - **Comprehensive experimental coverage.** The paper delivers 12+ experiments:
    cross-agent transfer, matched LLM comparison (Table 4), encoder independence across
    3 architectures (Table 6), compute waste audit (Table 7), early termination simulation
    with 5 thresholds (Table 8), Pareto frontier analysis (Table 14), 2-LF coverage
    analysis (Table 9), calibration with temperature scaling (Table 10), SHAP decomposition
    (Table 11), stride sensitivity (Table 12), power analysis (Table 3), human ceiling
    estimation (Table 2), and conf=1 error decomposition (Table 1). This breadth substantially
    exceeds typical submissions.


    - **Matched LLM comparison eliminates scope confounding.** Table 4 compares structural
    GB (0.967) vs. Claude few-shot-CoT (0.701) on identical OpenHands trajectories
    (N=2000 stratified sample). This is a fair, well-controlled comparison that eliminates
    the "different data" confound present in prior work. The 26.6pp gap is large and
    credible.


    - **Practical deployment framing.** The detection-to-intervention bridge (§4.4–4.5)
    is well-motivated: 52.4% of agent steps occur post-stagnation, and the Pareto
    frontier (AUC 0.891 structural vs. 0.952 oracle vs. 0.623 random) shows the structural
    detector achieves 93.6% of oracle quality. The 2-LF deployable configuration (no
    outcome knowledge at inference) and calibration analysis (ECE<0.05 after temperature
    scaling) address practical concerns.


    - **Strong statistical practice.** Paired bootstrap CIs, power analysis (Table
    3), effect sizes reported alongside significance, multi-seed stability, and honest
    acknowledgment that some comparisons are underpowered (TWV-Probe vs GB at p=0.056,
    power=0.52).


    - **Well-characterized negative finding.** The temporal label model section (§6)
    reports that three TLM variants (TWV, HMM-TLM, Lag-aware HMM) all fail to improve
    over majority vote, with clear diagnosis: the low-conflict regime (conf≥2 at 95.1%
    gold consistency) leaves little room for aggregation to add value. This constrains
    future temporal weak supervision research.


    ---


    ## 3. Weaknesses (Consensus)


    ### W1: The Circularity Paradox (Critical)


    Both reviewers converged on this as the central weakness. The feature overlap
    ablation reveals a paradox:


    - 11 LF-overlapping features alone achieve **0.977 cross-agent F1** — exceeding
    the full 30-feature model (0.967)

    - 19 residual (beyond-LF) features collapse to **0.566 cross-agent** (despite
    0.952 in-domain)

    - Removing cmd_rep features drops cross-agent F1 by **40.6pp**


    This means the cross-agent generalization — the paper''s strongest anti-circularity
    evidence — comes almost entirely from the same signals that the labeling functions
    encode. The structural classifier is effectively a smoothed LF proxy that generalizes
    because the underlying heuristics (command repetition, file modification patterns)
    are agent-invariant, not because it discovers independent stagnation signals.


    The paper''s conf=1 error decomposition (Table 1) partially addresses this: GB
    achieves 0.784 F1 on 282 windows where LFs completely disagree, with a 63.2% beyond-LF
    detection rate. This IS evidence for beyond-LF signal. However, the gold set''s
    modest size (N=505) and fair agreement (κ=0.39) limit the strength of this evidence.


    **Verdict:** The paper is honest about this issue but cannot fully resolve it.
    The circularity is structural to the method — features derived from the same signal
    space as LFs will always face this challenge.


    ### W2: Gold Set Limitations (Major)


    - **N=505 with Fleiss κ=0.39 ("fair" agreement).** The power analysis (Table 3)
    shows the gold set can detect ≥4pp differences at power=0.82, but is underpowered
    for smaller effects. The GB vs RF comparison (2.9pp, power=0.68) and TWV-Probe
    vs GB (-2.3pp, power=0.52) both fall in the underpowered range.

    - **Interpretability concern:** With κ=0.39, the gold labels themselves are noisy.
    GB''s 0.839 gold F1 approaching the human ceiling (0.870) could reflect either
    genuine near-human performance or GB learning annotation noise patterns.

    - The paper contextualizes κ=0.39 against comparable tasks (sentiment analysis
    0.40–0.55, discourse relation labeling 0.35–0.50), which is fair. But a larger
    gold set with higher IAA would substantially strengthen the validation.


    ### W3: Narrow Agent Scope (Major)


    - Only two software engineering agents (SWE-Agent, OpenHands) on one benchmark
    (SWE-bench)

    - The cross-agent transfer claim is based on a single transfer direction — effectively
    N=1

    - The 30 structural features are SE-specific (file operations, edit commands,
    command repetition). Generalization to web navigation, data analysis, or scientific
    research agents is undemonstrated

    - The title ("LLM Agent Trajectories") implies broader scope than the evidence
    supports


    ### W4: Simulation-Only Early Termination (Moderate)


    - Early termination results (Table 8) are offline simulation, not online deployment

    - The paper acknowledges this in §7 (Limitations): "Online deployment requires
    agent framework integration and may face distribution shift from the termination
    policy itself affecting agent behavior"

    - The gap between "detecting stagnation in historical traces" and "terminating
    live agents without disrupting recoverable trajectories" is non-trivial and untested


    ### W5: Limited Technical Novelty (Moderate — R2 concern, R1 partially disagrees)


    - Individual components are standard: gradient boosting on hand-crafted features,
    majority vote aggregation, GRU probes, weak supervision via labeling functions

    - No new algorithm, architecture, or theoretical contribution

    - R1 argues the systematic empirical methodology and the deployment trade-off
    framing have independent value; R2 argues this falls below the bar for a top venue''s
    main track

    - **Consensus:** For an empirical/applications track, the novelty is adequate.
    For a methods-focused track, it is borderline.


    ### W6: 2-LF Deployment Coverage Gap (Moderate)


    - The deployable 2-LF configuration (cmd_rep + file_diff, no outcome backpropagation)
    achieves only 3.6% conf≥2 coverage on OpenHands due to cmd_rep''s low fire rate
    (5.4%)

    - The paper proposes hierarchical deployment (2-LF for high-confidence alerts,
    structural classifier probability for continuous monitoring) but this is not experimentally
    validated

    - Honestly reported in §7, but weakens the deployment narrative


    ---


    ## 4. Questions for Authors


    1. **Circularity resolution:** Given that LF-overlapping features alone achieve
    0.977 cross-agent (exceeding the full model), what is the evidence that the structural
    classifier captures stagnation signal beyond what the LFs already encode? The
    conf=1 analysis (Table 1) shows 0.784 F1, but these 282 windows still use gold
    labels derived from 3-annotator majority vote — is there circularity in the gold
    labeling process itself?


    2. **LLM on gold set:** Were LLM judges evaluated against gold labels? If the
    LLM systematically disagrees with silver labels but agrees with gold labels in
    the conf=1 regime, the claimed structural advantage could narrow substantially.


    3. **Feature engineering effort:** How much iteration went into selecting the
    30 features and calibrating the 3 labeling function thresholds? Would a naive
    feature set achieve similar results?


    4. **Online validation path:** Is there a planned study where the detector is
    deployed in a live agent framework to validate the simulation-based early termination
    results?


    5. **Third agent:** Any plans to validate on an architecturally distinct agent
    (e.g., web navigation, non-coding) to establish N>1 for the transfer claim?


    ---


    ## 5. Missing Related Work


    - **Change-point detection literature** (e.g., Aminikhanghahi & Cook 2017) — stagnation
    onset detection is fundamentally a change-point problem; this literature is entirely
    absent

    - **ReAct (Yao et al., 2023)** — foundational reasoning+acting framework underlying
    both studied agents; not cited despite studying their failure modes

    - **Process mining for RPA** — detecting stuck automated workflows is directly
    analogous

    - **Classical anomaly detection / concept drift** — could provide alternative
    framing for the cross-agent transfer problem


    ---


    ## 6. Minor Issues


    - GPT-5.5 zero-shot has 25.1% parse failure rate (Table 4 context) — reported
    F1 computed only on parseable windows. Need imputation or sensitivity analysis.

    - Table 6 footnote correctly flags circular eval caveat for structural GB''s in-domain
    0.995†

    - The cmd_rep reversal across agents (leading on SWE-Agent, lagging on OpenHands)
    deserves mechanistic investigation

    - Some references use "Anonymous" — acceptable for blind review but should be
    resolved for camera-ready

    - Low figure count (mainly tables). A reliability diagram, confusion matrix, or
    trajectory visualization figure would strengthen presentation.


    ---


    ## 7. Experiment Coverage Assessment


    Comparing against the experiment design document (review_context.yaml), the paper
    covers **all 12 planned experiments** plus additional analyses:


    | Experiment | Status | Quality |

    |---|---|---|

    | conf1-gold-error-decomposition | ✅ Complete (Table 1) | Strong — core anti-circularity
    evidence |

    | llm-on-oh matched comparison | ✅ Complete (Table 4) | Strong — eliminates scope
    confounding |

    | cross-agent-probe-bge | ✅ Complete (Table 6) | Adequate |

    | cross-agent-probe-e5 | ✅ Complete (Table 6) | Adequate |

    | compute-waste-audit | ✅ Complete (Table 7) | Good — motivates intervention |

    | early-termination-simulation | ✅ Complete (Table 8) | Good — simulation only,
    no online |

    | cost-effectiveness-pareto | ✅ Complete (Table 14, Appendix B) | Good |

    | 2lf-coverage-analysis | ✅ Complete (Table 9) | Honest about limitations |

    | calibration-analysis | ✅ Complete (Table 10) | Good — ECE<0.05 post-calibration
    |

    | gold-power-analysis | ✅ Complete (Table 3) | Good — transparent about power
    limits |

    | human-ceiling-estimate | ✅ Complete (Table 2) | Good |

    | stride-sensitivity | ✅ Complete (Table 12) | Good robustness check |

    | SHAP feature importance | ✅ Complete (Table 11, 13) | Important for circularity
    analysis |

    | trajectory visualization | ✅ Complete (§5.2) | Illustrative |

    | temporal label model negative | ✅ Complete (§6) | Well-characterized |


    **Coverage verdict:** Excellent — all planned experiments present with additional
    analyses beyond the plan.


    ---


    ## 8. Scores


    | Reviewer | Initial | Revised | Confidence |

    |---|---|---|---|

    | R1 (Methods+Experiments) | 4 | **5 (Weak Accept)** | 4/5 |

    | R2 (Novelty+Related Work) | 4 | **4 (Borderline Reject)** | 4/5 |

    | **Consensus** | — | **4 (Borderline Reject)** | 4/5 |


    ### Score Justification


    The paper is a thorough, honest, and well-executed empirical study of an important
    practical problem. The experimental coverage is exceptional (15+ experiments,
    strong statistical practice, all planned analyses present). The matched LLM comparison
    (26.6pp gap on identical data) and the early termination simulation (35.3% savings,
    95.5% success preserved) have clear practical value.


    However, three issues prevent acceptance at a top venue:


    1. **The circularity paradox is unresolved.** The paper''s strongest result (0.967
    cross-agent F1) is driven by LF-overlapping features (0.977 alone), while residual
    features collapse (0.566). The cross-agent generalization comes from LF-invariant
    signals, not beyond-LF detection. The conf=1 gold analysis (0.784 F1) partially
    addresses this but on a small, noisy gold set.


    2. **The scope is too narrow for the claims.** Two SE agents, one benchmark, one
    transfer direction. The paper''s framing implies generality ("LLM Agent Trajectories")
    that N=1 transfer cannot support.


    3. **No online validation.** The detection-to-intervention bridge exists only
    in simulation. Without evidence that terminating live agents based on structural
    detection actually improves outcomes, the practical contribution remains prospective.


    **Path to acceptance:** (a) A third, architecturally distinct agent to validate
    transfer; (b) a larger gold set (N≥1500) with higher IAA; (c) an online pilot
    where the detector drives live early termination. Any two of these three would
    likely move the paper to accept.


    ---


    ## 9. Reviewer Disagreement Note


    R1 and R2 agreed on all major strengths and the top three weaknesses (circularity,
    gold set, scope). Their primary disagreement was on **novelty**: R1 views the
    systematic empirical methodology and deployment trade-off framing as a sufficient
    contribution for an empirical track (score 5); R2 argues that standard components
    (GB + majority vote + hand-crafted features) fall below the novelty bar regardless
    of empirical thoroughness (score 4). The consensus leans toward R2''s position:
    for a top venue with ~25% acceptance, empirical thoroughness alone — without a
    novel technical contribution, broader scope, or online validation — is borderline.

    '

    # Dream Review Report


    **Paper:** "Detecting Stagnation in LLM Agent Trajectories: An Empirical Analysis
    of Structural Features, Label Quality, and Deployment Trade-offs"

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-16


    ---


    ## Roundtable Process


    - **R1** (Methods + Experiments): Independent score **3 / 6** (Weak Reject)

    - **R2** (Novelty + Related Work): Independent score **3 / 6** (Weak Reject)

    - **Roundtable convergence:** Both reviewers agree on final score. No upward or
    downward revision after cross-sharing.


    ---


    ## 1. Paper Summary


    This paper studies detection of "semantic stagnation" in LLM coding agent trajectories—extended
    periods where agents take diverse but collectively unproductive actions. Using
    weak supervision with three labeling functions (cmd_rep, file_diff, outcome_bp)
    over ~205K windows from SWE-Agent (543 trajectories) and OpenHands (3,409 trajectories),
    the authors compare structural classifiers (GB/RF on 30 handcrafted features),
    neural probes (3 frozen encoders + linear head), and LLM-as-judge baselines (Claude
    and GPT-5.5 variants).


    Four claims are made: (1) label quality is the dominant transfer bottleneck (+28pp
    from fixing version bias); (2) structural features offer Pareto-efficient deployment
    (0.967 cross-agent F1, <5ms, ~$0); (3) temporal label models fail to beat majority
    vote (negative result); (4) early termination shows limited potential (13.1% compute
    saved at 83.4% task-success preservation). Gold validation on 505 human-annotated
    windows (κ=0.39) shows GB 0.839 vs. MV 0.798 (p<0.001), with the advantage concentrated
    on high-confidence windows.


    ---


    ## 2. Strengths (Consensus)


    **S1. Exceptional intellectual honesty and self-awareness.**

    Both reviewers highlight the paper''s transparency about circularity. The paper
    explicitly states the 0.9951 in-domain F1 reflects LF reconstruction; provides
    three circularity-breaking controls (cross-agent transfer, instance isolation,
    gold validation); decomposes the structural model as "~70% LF reconstruction +
    30% residual signal" via SHAP (Table 9); and openly reports that the conf=1 anti-circularity
    evidence is inconclusive. This level of self-criticism is rare and commendable.


    **S2. Comprehensive ablation battery.**

    The paper covers encoder ablation (3 encoders, Table 2), feature overlap decomposition
    (11 LF-overlapping vs. 19 residual features), LF leave-one-out ablation, 2-LF
    coverage analysis (Table 3), stride sensitivity (Table 11), power analysis (Table
    10), calibration (Table 8), SHAP feature importance (Table 9), human ceiling estimation
    (Table 6), conf=1 error decomposition (Table 5), early termination threshold sweep
    (Table 12), and stagnation tail statistics (Table 13). The 13-table ablation battery
    is thorough by empirical ML standards.


    **S3. Well-characterized negative result on temporal label models.**

    The systematic failure of all five TLM variants (TWV, HMM-TLM, Lag-aware HMM,
    FlyingSquid, Snorkel MeTaL) with a clear root-cause diagnosis (insufficient inter-LF
    conflict in the 3-binary-LF regime) is a genuine contribution to the weak supervision
    literature. The finding that 95.1% of conf≥2 windows already have LF agreement
    leaves no room for temporal models to add value.


    **S4. Practically important label quality finding.**

    The +28pp improvement from correcting a version-induced embedding mismatch on
    OpenHands, dwarfing any model or encoder choice, is a concrete cautionary result
    for weak supervision practitioners.


    **S5. Appropriate claim calibration.**

    The paper''s claims are generally well-calibrated to the evidence: early termination
    is presented as "preliminary evidence," the Pareto framing is about deployment
    efficiency rather than signal superiority, κ=0.39 is reframed as definitional
    ambiguity rather than dismissed, and the gold-set conf=1 result is called "inconclusive."


    ---


    ## 3. Weaknesses (Consensus)


    **W1. The headline 0.967 cross-agent F1 is evaluated against silver labels — it
    measures LF agreement transfer, not stagnation detection accuracy.** [Major]

    The structural model''s primary performance metric (0.967 on OpenHands) is computed
    against majority-vote silver labels. The feature overlap ablation (Table 9) confirms
    this concern: LF-overlapping features account for 72.3% of SHAP importance, and
    the top two features (repeated_cmd_ratio, unique_file_edits) directly correspond
    to cmd_rep and file_diff LFs. The gold-set F1 (0.839) is the only non-circular
    evaluation, but it is presented as secondary to the silver-label headline. The
    paper should foreground the gold-set results as primary evidence.


    **W2. Gold set is underpowered and ground truth is noisy.** [Major]

    With N=505 and Fleiss κ=0.39, the gold set has limited statistical power. The
    power analysis (Table 10) reveals this clearly: only the GB vs. MV overall comparison
    (power=0.92) and GB vs. Probe (power=0.85) have adequate power. The conf=1 comparison—the
    most critical test of anti-circularity—has power of only 0.12, meaning it cannot
    detect even a 5pp true difference 70% of the time. The GB vs. RF comparison (power=0.41)
    and TWV-Probe vs. GB (power=0.15) are both underpowered. The paper honestly reports
    this, but the implication is that most gold-set comparisons beyond the top-line
    GB vs. MV are statistically uninformative.


    **W3. Outcome backpropagation LF (λ₃) uses privileged information, creating a
    deployment gap.** [Major]

    λ₃ uses final task outcome, which is unavailable at inference time. It contributes
    to 33.5% of conf≥2 labels. The 2-LF configuration (without λ₃) suffers critical
    coverage collapse on OpenHands: only 2.7% of windows at conf≥2 (Table 3). The
    paper acknowledges this but does not fully resolve how a deployment-ready pipeline
    functions when nearly half the labeling signal comes from privileged information.


    **W4. No direct comparison with existing detection methods.** [Major]

    The paper positions itself against cycle detectors (CDCS/CDSA) and process reward
    models but never implements or benchmarks against them on the same data. All comparisons
    are internal (structural vs. probe vs. LLM judge). This leaves the core positioning—that
    semantic stagnation is distinct from what existing methods capture—empirically
    unvalidated. How many stagnation windows would a simple cycle detector catch?
    Without this comparison, the claimed novelty of "semantic stagnation" vs. "structural
    repetition" is an assertion.


    **W5. Limited conceptual novelty.** [Significant]

    The methodology is entirely standard: weak supervision with labeling functions
    (Ratner et al., 2016), majority vote aggregation, handcrafted features + gradient
    boosting/random forest. The three LFs are straightforward heuristics. The paper''s
    contribution is an empirical study applying well-understood tools to a new problem,
    which raises the bar for depth of insight. The "first systematic quantification
    of stagnation''s definitional ambiguity" claim amounts to measuring inter-annotator
    agreement on a subjective task—standard methodology, not a contribution.


    **W6. Stride-1 autocorrelation inflates effective sample sizes.** [Significant]

    With stride=1 and window size k=5, consecutive windows share 4/5 actions (lag-1
    autocorrelation = 0.89). All sample sizes, CIs, and p-values treat windows as
    independent. The stride sensitivity analysis (Table 11) shows non-overlapping
    stride=5 produces ~2× wider CIs, suggesting reported CIs are optimistically narrow.
    Effective N drops from 505 to ~420 after correction (Table 10), but this correction
    is only partially applied.


    **W7. Narrow scope limits generalizability.** [Moderate]

    Two coding agents on the same benchmark (SWE-bench) represent a single transfer
    pair in a single domain. Generalization to non-coding agents, different task distributions,
    or agents with different scaffolding architectures is completely untested. The
    cmd_rep LF''s agent-specificity (65% firing rate on SWE-Agent vs. 5.4% on OpenHands)
    suggests the labeling pipeline itself may not transfer.


    **W8. Pareto framing against LLM judges is a strawman.** [Moderate]

    Showing that a trained classifier is cheaper and faster than an LLM API call is
    neither novel nor surprising. The comparison is useful for practitioners but does
    not constitute a research contribution. The 9.5pp gap on OpenHands (0.967 vs.
    0.872) is smaller than highlighted, and the paper notes it narrows with better
    LLM prompting and cleaner agent traces.


    ---



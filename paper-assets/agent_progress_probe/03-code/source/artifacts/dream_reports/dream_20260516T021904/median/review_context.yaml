narrative_guidance: 'Claims 需全面调低强度。Headline 从 "dominance" 降为 "substantial practical
  advantage"： "Structural features achieve strong cross-agent transfer (0.967) with
  zero target-domain data, outperforming best LLM judge by ~19pp and zero-shot neural
  probes by 20-37pp depending on encoder." conf=1 gold 证据定性为 suggestive（"GB shows
  improved performance on LF-disagreement windows, though the gold set is underpowered
  for fine-grained stratified analysis"）。 BGE probe zero-shot 缩小 gap 至 ~28pp，去掉 "encoder-independent"，改为
  "gap persists across encoders though magnitude varies (28-37pp)"。Claim 4 early termination
  改为 "moderate compute savings with acceptable task success trade-off"——best operating
  point saves ~23% compute while preserving ~91% task success，Pareto 曲线存在但不陡峭。 新增
  honest limitations 段：(1) N=505 gold 只能检测 ≥6pp effect，observed 4.2pp delta underpowered；
  (2) human ceiling ~0.85，GB 0.839 close but interpretation ambiguous；(3) 2-LF deployable
  config 在 OH 上 conf≥2 覆盖率仅 9.3%，实际部署需 fallback strategy。 TLM negative (C3) 和 label
  quality bottleneck (C2) 不受影响，作为稳定分析贡献。 R2 novelty 通过 methodology 贡献（anti-circularity
  框架 + 2-LF deployable design）部分缓解， 但 reviewer 可能仍要求更多 non-SE agent 验证。Projected consensus
  3.5-4/6。

  '
imagined_experiments:
- name: Early Termination Simulation
  plan_id: early-termination-simulation
  description: 在 SWE-Agent 和 OH 全量轨迹上模拟不同 consecutive-stagnation threshold k 的 early
    stopping policy，量化 precision/recall/compute savings/task success trade-off
  expected_results:
    swe_agent:
      n_trajectories: 1683
      n_trajectories_with_stagnation: 1044
      k1:
        precision_stag: 0.81
        recall_stag: 0.94
        compute_saved_pct: 38.2
        task_success_preserved_pct: 78.4
        n_terminated: 987
        n_false_kills: 41
      k2:
        precision_stag: 0.87
        recall_stag: 0.85
        compute_saved_pct: 28.7
        task_success_preserved_pct: 86.3
        n_terminated: 831
        n_false_kills: 22
      k3:
        precision_stag: 0.91
        recall_stag: 0.76
        compute_saved_pct: 22.8
        task_success_preserved_pct: 91.2
        n_terminated: 694
        n_false_kills: 12
      k5:
        precision_stag: 0.95
        recall_stag: 0.58
        compute_saved_pct: 14.1
        task_success_preserved_pct: 96.1
        n_terminated: 482
        n_false_kills: 4
      k7:
        precision_stag: 0.97
        recall_stag: 0.42
        compute_saved_pct: 8.6
        task_success_preserved_pct: 98.3
        n_terminated: 328
        n_false_kills: 1
      best_operating_point: k3
    openhands:
      n_trajectories: 3409
      k1:
        compute_saved_pct: 33.1
        task_success_preserved_pct: 80.2
      k2:
        compute_saved_pct: 24.6
        task_success_preserved_pct: 87.8
      k3:
        compute_saved_pct: 18.9
        task_success_preserved_pct: 92.4
      k5:
        compute_saved_pct: 10.7
        task_success_preserved_pct: 96.8
      best_operating_point: k3
    oracle_swe_k3:
      compute_saved_pct: 38.5
      task_success_preserved_pct: 99.2
    random_baseline_swe_at_23pct_savings:
      task_success_preserved_pct: 76.4
  result_rationale: 'Median 档下 early termination 效果 moderate：k=3 作为最佳 operating point
    节省 ~23% 计算 但 task success 降至 ~91%。原因：(1) GB structural detector 在 silver labels
    上 F1=0.967 但 gold 验证 F1=0.839，real-world precision 不如 silver eval 显示的高；(2) 连续
    3 窗口 false positive 概率虽低，但在 ~1683 条轨迹中仍累积出 ~12 条 false kills；(3) OH 上 stagnation
    rate 更低 (21.45% vs 28.46%)，可回收的 compute 本身更少，所以 savings 比 SWE 低约 4pp；(4) 与 oracle
    对比显示 structural detector 只达到理论最优的 ~59%（22.8/38.5）， 因为 detector 延迟识别 stagnation
    onset（median lag ~2-3 windows）且有 FP 导致误杀。 Pareto 曲线存在但斜率不够陡——想获得 >30% savings
    必须接受 task success 降到 <87%。

    '
  tables:
  - name: 'Table: Early Termination Operating Points'
    columns:
    - k
    - Precision
    - Recall
    - Compute Saved (%)
    - Task Success Preserved (%)
    - N Terminated
    - N False Kills
    description: SWE-Agent 上不同 threshold k 的完整 trade-off 矩阵，附 OH 对应行
  - name: 'Table: Agent-Specific Comparison'
    columns:
    - Agent
    - Best k
    - Savings (%)
    - Success Preserved (%)
    - Resolution Rate Impact
    description: SWE-Agent vs OH 最佳 operating point 对比
  figures_description:
  - Precision-Recall curve for early termination across k values, with iso-savings
    contours
  analysis: 'k=3 是 SWE-Agent 上的最佳 operating point（23% savings, 91% preserved），OH 上
    k=3 也接近最优（19% savings, 92% preserved）。Savings 差异源于 OH stagnation rate 更低。 实际部署价值：SWE-Agent
    23% savings 对应约 $2.3/100 trajectories 的 API cost 节省 （假设 average $10/trajectory）。但
    9% task success 损失意味着 resolution rate 从 ~23% 降至 ~21%——对于 SWE-bench 这样的 benchmark
    影响可观。论文需要诚实呈现 "moderate savings with non-trivial trade-off" 而非 "compute-efficient"。

    '
- name: Compute Waste Audit
  plan_id: compute-waste-audit
  description: 回溯分析全量轨迹的 stagnation tail——从首次真正停滞到轨迹结束的 wasted steps/tokens/time
  expected_results:
    swe_agent:
      n_trajectories: 1683
      trajectories_with_any_stagnation_pct: 61.8
      trajectories_with_sustained_stagnation_pct: 48.3
      median_stagnation_onset_position: 0.43
      mean_stagnation_onset_position: 0.47
      median_tail_length_windows: 9
      mean_tail_length_windows: 12.7
      compute_waste_steps_pct: 34.2
      compute_waste_tokens_pct: 31.8
      compute_waste_time_pct: 33.5
      wasted_steps_total: 142500
      wasted_tokens_total_millions: 15.3
      by_resolution:
        resolved_waste_pct: 8.2
        unresolved_waste_pct: 41.7
    openhands:
      n_trajectories: 3409
      trajectories_with_any_stagnation_pct: 52.4
      compute_waste_steps_pct: 27.6
      compute_waste_tokens_pct: 25.1
      median_tail_length_windows: 7
    combined:
      compute_waste_steps_pct: 31.4
      compute_waste_tokens_pct: 28.9
    tail_length_distribution:
      p25_windows: 4
      p50_windows: 8
      p75_windows: 16
      p90_windows: 28
      max_windows: 89
  result_rationale: 'Median 档下 compute waste 在 25-40% 范围内，取 ~32%。推理：(1) SWE-Agent
    stagnation rate 28.46%，但 stagnation 集中在轨迹后半段（error analysis 显示 late_66_100 区间占
    59% 的 test windows），所以 onset 位置 median ~0.43 意味着 tail 长度约占总轨迹 57%；(2) 但并非 所有 stagnation
    后的 steps 都是 waste——agent 可能有短暂恢复再次停滞，实际 "pure waste" 低于 raw tail 长度；(3) resolved
    轨迹 waste 极低（8.2%），因为成功轨迹中短暂 stagnation 后恢复是常态（error analysis: resolved 仅 1.3%
    error rate）；(4) unresolved 轨迹贡献 绝大部分 waste（41.7%），且这些轨迹占 ~77% 的总量——所以 overall
    waste = 77%×41.7% + 23%×8.2% ≈ 34%；(5) OH waste 更低因为 stagnation rate 更低且轨迹更长（更多
    productive steps 稀释 waste ratio）。Token waste 略低于 step waste 因为 stagnation windows
    的 token count 通常低于 progress windows（重复命令更短）。

    '
  tables:
  - name: 'Table: Compute Waste Summary'
    columns:
    - Agent
    - Traj with Stag (%)
    - Onset Position (median)
    - Tail Length (median)
    - Waste Steps (%)
    - Waste Tokens (%)
    description: SWE-Agent 和 OH 的 compute waste 摘要
  - name: 'Table: Waste by Resolution Status'
    columns:
    - Status
    - N Trajectories
    - Waste Steps (%)
    - Contribution to Total Waste (%)
    description: 按任务解决状态分层的 waste 分析
  figures_description:
  - Histogram of stagnation tail lengths (windows), with vertical lines at p50 and
    p90
  - 'Scatter plot: trajectory length vs waste ratio, colored by resolution status'
  analysis: '~32% compute waste 支撑 Claim 4 的 motivation，但数字本身需要 caveat：(1) waste 定义
    依赖 stagnation label 质量——gold validation 显示 GB F1=0.839，非 perfect，所以 waste 边界有
    ±5pp 不确定性；(2) unresolved 轨迹贡献 92% 的 total waste，resolved 轨迹几乎 没有 waste——说明 early
    termination 主要在 "注定失败" 的轨迹上节省计算；(3) tail 长度 分布高度右偏（p90=28 vs p50=8），少数极长 stagnation
    tail 拉高均值。 论文表述：报告 median 和 IQR 而非 mean，避免被极端值误导。

    '
- name: Cost-Effectiveness Pareto Curve
  plan_id: cost-effectiveness-pareto
  description: Pareto 前沿：横轴 compute saved (%)，纵轴 task success preserved (%)，structural
    vs oracle vs random
  expected_results:
    structural_pareto_points:
    - compute_saved_pct: 8.6
      task_success_pct: 98.3
      k: 7
    - compute_saved_pct: 14.1
      task_success_pct: 96.1
      k: 5
    - compute_saved_pct: 22.8
      task_success_pct: 91.2
      k: 3
    - compute_saved_pct: 28.7
      task_success_pct: 86.3
      k: 2
    - compute_saved_pct: 38.2
      task_success_pct: 78.4
      k: 1
    oracle_pareto_points:
    - compute_saved_pct: 15.0
      task_success_pct: 99.5
    - compute_saved_pct: 25.0
      task_success_pct: 99.0
    - compute_saved_pct: 38.5
      task_success_pct: 98.6
    - compute_saved_pct: 42.0
      task_success_pct: 97.1
    random_baseline_points:
    - compute_saved_pct: 10.0
      task_success_pct: 89.8
    - compute_saved_pct: 20.0
      task_success_pct: 79.6
    - compute_saved_pct: 30.0
      task_success_pct: 69.5
    structural_aupf: 0.847
    oracle_aupf: 0.952
    random_aupf: 0.643
    structural_efficiency_ratio: 0.66
    structural_dominates_random: true
    gap_to_oracle_significant: true
  result_rationale: 'Pareto 曲线存在但斜率 moderate：structural detector 明确优于 random（AUPF
    0.847 vs 0.643）， 但与 oracle 有显著 gap（0.952）。Efficiency ratio 0.66 意味着 structural
    detector 只 实现了理论最优改进的 66%。原因：(1) detector 延迟 ~2-3 windows 才识别 stagnation onset，
    这些 lag windows 不可回收；(2) false positive 在 k=1-2 时显著——error analysis 显示 FP dominant（65%）且
    highly confident（mean prob=0.922），low-k termination 会 kill recovering trajectories；(3)
    false negative 累积效应——一些长期 stagnation 轨迹从未 触发连续 k 个检测（recall 随 k 增大下降快），无法 terminate。Oracle
    的优势在于 perfect onset detection + zero FP，消除了 lag 和 误杀。Random baseline 线性下降 因为随机终止等概率
    kill 任意轨迹，与 stagnation 状态无关。

    '
  tables:
  - name: 'Table: Pareto Operating Points'
    columns:
    - Method
    - k/threshold
    - Compute Saved (%)
    - Task Success (%)
    - Resolution Rate
    description: Structural / Oracle / Random 的 Pareto 前沿对比
  figures_description:
  - 'Pareto curve: X=compute saved (%), Y=task success preserved (%). Three curves:
    structural (blue, solid), oracle (green, dashed), random (red, dotted). Shaded
    area between structural and random = efficiency gain.'
  - 'Bar chart: structural efficiency ratio at different operating points'
  analysis: 'Pareto 分析支撑 "detection-to-intervention" 叙事但需降调：从 "compute-efficient early
    termination" 改为 "moderate compute savings with acceptable task success trade-off"。
    Efficiency ratio 0.66 说明 structural detector 远非 oracle，改进空间大——future work 可通过更好的
    stagnation onset 检测（减少 lag）和 calibrated confidence（减少 FP） 来逼近 oracle。论文最佳呈现方式：Pareto
    图作为 main figure，配 3 条曲线和 shaded efficiency region，让 reviewer 自行判断 "moderate savings"
    是否有价值。

    '

    bimodal （64% >0.9, 22% <0.1），中间区域严重 overconfident——这与 error-analysis 发现的 "FP highly
    confident (mean prob=0.922)" 一致。Temperature scaling (T=2.06) 帮助 拉开分布但不能完全修复中间区域。Gold
    上 calibration 显著恶化（ECE 0.082 vs 0.045）， 因为 silver labels 的 circular 性质让模型对 LF-consistent
    predictions 过度自信， 而 gold labels 揭示了这些 confident predictions 中的一部分是错的。RF 在两个 评估集上都比
    GB 更好 calibrated，因为 RF 的 bagged ensemble 天然给出更保守的 probability estimates。


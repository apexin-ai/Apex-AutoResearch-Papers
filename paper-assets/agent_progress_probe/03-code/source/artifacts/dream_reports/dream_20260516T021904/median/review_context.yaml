    '
- name: Gold Power Analysis
  plan_id: gold-power-analysis
  description: 统计功效计算：N=505 gold 在不同 effect size 下的 power，诚实表征 gold set 能力边界
  expected_results:
    sample_size: 505
    alpha: 0.05
    test: McNemar test (paired proportions)
    power_curve:
      effect_2pp:
        power: 0.28
        detectable: false
      effect_3pp:
        power: 0.42
        detectable: false
      effect_4pp:
        power: 0.58
        detectable: false
      effect_5pp:
        power: 0.72
        detectable: false
      effect_6pp:
        power: 0.82
        detectable: true
      effect_8pp:
        power: 0.94
        detectable: true
      effect_10pp:
        power: 0.99
        detectable: true
    minimum_detectable_effect_80pct_power: 6.2
    observed_effects_power:
      gb_vs_mv_delta_4_2pp:
        power: 0.62
        conclusion: underpowered
      gb_vs_probe_delta_8_8pp:
        power: 0.95
        conclusion: well-powered
      gb_vs_rf_delta_2_9pp:
        power: 0.38
        conclusion: severely underpowered
      twv_probe_vs_gb_delta_2_3pp:
        power: 0.3
        conclusion: severely underpowered
    conf1_subset_power:
      n: 282
      minimum_detectable_effect_80pct_power: 8.4
      observed_delta_3_5pp:
        power: 0.32
        conclusion: severely underpowered for observed effect
    sample_size_needed_for_4pp_at_80pct_power: 1200
  result_rationale: 'N=505 的 gold set 只能可靠检测 ≥6pp 的效应量。这意味着：(1) GB vs MV 的 observed
    delta 4.2pp（p=0.0001 from bootstrap）在 McNemar 框架下 power 只有 0.62——bootstrap 的 p
    值之所以更 significant 是因为 bootstrap 利用了更多信息（F1 而非 binary accuracy）； (2) GB vs RF 的
    2.9pp delta underpowered（power 0.38），所以 p=0.0003 虽然 significant 但 effect size
    在 power 边界——需要更大 gold set 来确认；(3) conf=1 子集（N=282）更 严重 underpowered：检测 8.4pp 才达到
    80% power，observed 3.5pp delta 几乎无法 被可靠检测（power 0.32）；(4) 要在 N 上达到 80% power for
    4pp effect，需要 ~1200 annotated windows——是现有 gold set 的 2.4x；(5) 这不否定现有 significant
    results （GB vs MV p=0.0001, GB vs Probe p<0.0001 仍然成立），但意味着 non-significant comparisons（如
    TWV-Probe vs GB p=0.056）真正 inconclusive 而非 "no difference"。

    '
  tables:
  - name: 'Table: Power Analysis for Gold Set Comparisons'
    columns:
    - Comparison
    - Observed Δ (pp)
    - p-value
    - Power at Observed Δ
    - Verdict
    description: 每个 pairwise comparison 的 power 评估
  - name: 'Table: Power Curve'
    columns:
    - Effect Size (pp)
    - Power
    - Detectable at 80%?
    description: N=505 的 power curve
  figures_description:
  - 'Power curve: x=effect size (pp), y=power. Horizontal line at 0.80. Vertical lines
    at observed deltas for each comparison. Shaded region = underpowered zone.'
  analysis: 'Power analysis 是 honest limitation 的核心——论文必须报告这些数字。关键 framing： "The gold
    set (N=505) provides adequate power to detect moderate-to-large effects (≥6pp
    at 80% power) but is underpowered for several pairwise comparisons of interest.
    The statistically significant finding that GB outperforms MV (Δ=4.2pp, p<0.001)
    may benefit from bootstrap''s higher sensitivity to distributional differences;
    confirmation with a larger gold set (N≥1200) would strengthen this claim." 这将
    reviewer 的 "gold set too small" concern 转化为 preemptive honest disclosure，减少被攻击的风险。

    '

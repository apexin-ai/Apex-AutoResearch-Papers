  analysis: 'LLM-on-OH 结果消除了 "evaluation scope mismatch" concern：structural 和 LLM
    在相同 OH 数据上直接对比，gap 18.4pp 是 clean matched comparison。Headline 可以写 "structural
    features outperform best LLM judge by ~18pp on matched cross-agent evaluation"。
    但 18.4pp 应表述为 "substantial" 而非 "overwhelming"，因为 LLM 0.78 本身不算差 （远超 random 0.50），且
    LLM 不需要任何训练数据。论文需承认 LLM 的优势：zero-setup、 interpretable judgment、可以给出 reasoning。Structural
    的优势：speed (<5ms vs seconds)、 cost ($0 vs $44/2000 windows)、accuracy (+18pp)。

    '
- name: Conf=1 Gold Error Decomposition
  plan_id: conf1-gold-error-decomposition
  description: 在 282 个 conf=1 gold 窗口（LFs 分歧）上分解 GB-correct-MV-wrong vs GB-wrong-MV-correct
    vs both-correct vs both-wrong
  expected_results:
    n_conf1_gold: 282
    gold_label_distribution:
      stagnation: 118
      progress: 164
    gb_on_conf1:
      macro_f1: 0.718
      accuracy: 0.745
      f1_stag: 0.672
      f1_prog: 0.764
      n_correct: 210
    mv_on_conf1:
      agreement_with_gold: 0.709
      n_correct: 200
    decomposition:
      both_correct: 186
      both_correct_pct: 65.96
      gb_correct_mv_wrong: 24
      gb_correct_mv_wrong_pct: 8.51
      gb_wrong_mv_correct: 14
      gb_wrong_mv_correct_pct: 4.96
      both_wrong: 58
      both_wrong_pct: 20.57
    net_gb_advantage_windows: 10
    net_gb_advantage_pp: 3.55
    mcnemar_chi2: 2.63
    mcnemar_p: 0.035
    bootstrap_delta_f1:
      delta: 0.032
      ci_95:
      - 0.003
      - 0.068
      p: 0.028
    gb_corrects_mv_pattern: GB 正确修正的 24 个窗口中，68% 涉及 file_diff 与 cmd_rep 的分歧，GB 学到了
      file_diff 在 transition 区域更可靠的软规则
    gb_fails_mv_correct_pattern: GB 错误的 14 个窗口中，79% 是 OB 信号与其他 LFs 冲突，GB 过度依赖 OB 的
      lagging 信号
  result_rationale: 'Median 档下 conf=1 gold 证据是 suggestive 而非 conclusive。原因：(1) N=282
    对于检测 ~3.5pp delta 的 power 不足——McNemar p=0.035 虽然 <0.05 但在 borderline；(2) GB F1=0.718
    > MV agreement 0.709，delta 仅 ~3pp，远小于 conf≥2 gold 上的 4.2pp delta—— 在 LFs 分歧区域
    GB 的优势缩小而非放大；(3) 58 个 both-wrong 窗口（20.6%）表明 stagnation 的 definitional ambiguity
    在 conf=1 区域尤其严重——这些窗口上 LFs 分歧且 human annotators 也不完全确信（κ=0.39 意味着 annotators 自身也常
    disagree）； (4) GB 成功修正 MV 的 24 个窗口主要集中在 file_diff/cmd_rep 分歧模式——GB 学到了 在 transition
    区域 file_diff 更可靠的隐式规则，这是真正的 beyond-LF learning； (5) 但 GB 也多错了 14 个窗口（vs MV），说明
    GB 的 soft decision boundary 并非 单调优于 hard MV rule。

    '
  tables:
  - name: 'Table: Conf=1 Gold Error Decomposition'
    columns:
    - Category
    - N
    - Pct (%)
    - Example Pattern
    rows:
    - Both Correct
    - GB Correct + MV Wrong
    - GB Wrong + MV Correct
    - Both Wrong
    description: 2×2 分解表 + 每类的 error pattern 描述
  - name: 'Table: Statistical Tests on Conf=1 Subset'
    columns:
    - Test
    - Statistic
    - p-value
    - Significant (α=0.05)
    description: McNemar + bootstrap 检验结果
  figures_description:
  - 'Confusion matrix heatmap: GB prediction × MV prediction × Gold label, on conf=1
    subset'
  - 'Scatter plot of conf=1 windows: x=GB probability, y=MV agreement, colored by
    gold label'
  analysis: 'Conf=1 证据 suggestive but not conclusive：GB net advantage 10 windows /
    3.5pp， p=0.035 borderline。这改变了 paper narrative——不能再写 "GB demonstrates clear beyond-LF
    detection on disagreement windows"，需改为 "GB shows modest improvement on LF-disagreement
    windows (F1 0.718 vs MV 0.709, p=0.035), suggesting learned soft decision boundaries
    that partially generalize beyond binary LF heuristics, though the gold set is
    underpowered for definitive conclusions on this subset." Anti-circularity defense
    需要依赖多条证据线的 convergence 而非单独依赖 conf=1 analysis。

    '

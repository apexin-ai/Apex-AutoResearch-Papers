  result_rationale: 'LLM 在 OH 上 F1 ~0.78（best variant），比 SWE 上略低 1.8pp。原因：(1) OH 轨迹
    结构与 SWE-Agent 不同——OH 使用 browsing/coding 混合操作，stagnation 形态更多样化， LLM 的 few-shot
    exemplars（来自 SWE-Agent 模式）迁移能力有限；(2) OH stagnation rate 更低 (21.45%)，class imbalance
    更严重，LLM 倾向于 predict progress on ambiguous windows； (3) 但 OH 的 stagnation 形态在语义上可能更
    "明显"——OH agent 停滞时经常表现为 browsing 同一网页 or 重复相同的 coding pattern，LLM 能识别这些模式（所以 F1
    没有 大幅下降）；(4) structural GB 在 OH 上保持 0.965（与整体 0.967 一致），因为 structural features
    不依赖语义理解。Gap 18.4pp 仍然显著（p<0.001），但从 SWE 的 16.8pp 并无 明显变化——structural 和 LLM 的相对优势在跨
    agent 时稳定。

    '
  tables:
  - name: 'Table: LLM-on-OH Results'
    columns:
    - Method
    - Macro F1
    - F1 Stag
    - F1 Prog

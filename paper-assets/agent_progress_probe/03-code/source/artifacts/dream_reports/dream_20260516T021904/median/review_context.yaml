  result_rationale: 'Feature importance 确认了 circularity 但也展示了 beyond-LF learning。原因：
    (1) top 3 features（cmd_rep, file_diff, OB signal）直接对应三个 LFs 且贡献 52.8% 的 SHAP value——这是
    circular eval 的直接证据，GB 主要在学 LF→label 映射； (2) 但 32.1% 的 SHAP value 来自 residual
    features（output_similarity, error_count, trajectory_position 等），这些不直接对应任何 LF——这解释了为什么
    GB 能在 gold 上 outperform MV（F1 0.839 vs 0.798）：非 LF 特征提供了额外的 discriminative 信号；(3)
    LF-adjacent features（unique_commands_ratio, command_diversity_entropy, file_change_count）与
    LF 相关但不等同——它们捕获了 LF 的 "近义" 变体，某种程度上 冗余但也提供了 smoothed version of LF signals；(4)
    permutation importance 与 SHAP 排名一致，验证了结果稳定性。


- name: Trajectory Visualization
  plan_id: trajectory-visualization
  description: 3 条示例轨迹图（LF 激活 overlay + model probability + gold label），建立读者对 'semantic
    stagnation' 的直觉
  expected_results:
    example_trajectories:
    - type: clear_stagnation
      trajectory_id: SWE-xxx-unresolved
      n_steps: 42
      description: Agent 在 step 18 开始重复 grep/cat 命令循环，all 3 LFs 在 step 20-25 activate，GB
        probability >0.95 from step 22
      gold_label: stagnation (3/3 annotators agree)
      model_correct: true
    - type: ambiguous_conf1
      trajectory_id: SWE-yyy-unresolved
      n_steps: 35
      description: Agent 尝试不同修复策略但每次 revert，cmd_rep 不触发（命令多样）但 file_diff 触发（反复改同一文件），OB
        滞后 +7 步才触发。GB probability 波动 0.4-0.7
      gold_label: stagnation (2/3 annotators agree)
      model_correct: true
      mv_correct: false
      note: GB correct where MV wrong — exemplifies beyond-LF detection
    - type: false_positive
      trajectory_id: SWE-zzz-unresolved
      n_steps: 28
      description: Agent 做 systematic debugging（read logs, check config, test different
        params），看似重复但实际有进展。cmd_rep 和 output_similarity 误触发，GB probability 0.91
      gold_label: progress (3/3 annotators agree)
      model_correct: false
      error_type: FP, high confidence
  result_rationale: '三种 trajectory 类型对应论文需要展示的三种情况：(1) clear case 建立基本直觉——读者 看到 LF
    激活如何与 stagnation onset 对齐，model probability 如何 track stagnation； (2) ambiguous
    case 展示 beyond-LF detection 的实例——GB 在 LFs 分歧时仍做出正确 判断，直观展示 conf=1 gold analysis
    的 micro 层面含义；(3) FP case 诚实展示 failure mode——error-analysis 已发现 FP 是 dominant error
    type（65%）且 highly confident (mean 0.922)，这个 trajectory 让 reviewer 理解为什么 systematic
    debugging 容易被误判为 stagnation（命令结构相似但语义目的不同）。

    '
  tables: []
  figures_description:
  - 'Figure (3 panels, each full-width): Timeline plot with step number on x-axis.
    Top lane: LF activations as colored horizontal bars (cmd_rep=red, file_diff=blue,
    OB=green). Middle lane: GB probability (black line) with 0.5 decision threshold
    (gray dashed). Bottom lane: gold label as colored background strip (green=progress,
    red=stagnation). Panel titles: (a) Clear Stagnation, (b) Ambiguous — GB Correct,
    MV Wrong, (c) False Positive.'
  analysis: Trajectory visualization 是论文最直观的 element——reviewer 在 30 秒内理解 "semantic
    stagnation" 是什么。建议放在 Section 2 (Problem Definition) 或 Section 4 (Results) 的开头。Panel
    (b) 特别重要：它直接 illustrate conf=1 gold decomposition 中 GB corrects MV 的具体案例，把抽象的统计数字变成具体的
    behavioral observation。 Panel (c) 同样重要：展示 limitation，让 reviewer 感受到 "这个团队知道 model
    的 弱点"——FP case 中 agent 的 systematic debugging 行为在结构上确实 resembles stagnation（重复类似命令），区分需要语义理解。

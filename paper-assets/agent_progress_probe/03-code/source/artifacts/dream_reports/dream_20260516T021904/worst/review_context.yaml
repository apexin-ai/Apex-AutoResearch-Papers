narrative_guidance: '放弃 "structural dominance" 作为 primary claim。重构三条主轴：

  (1) Primary → Claim 2 (label quality as transfer bottleneck)：+28pp 标签修复证据最 robust，不受
  encoder/LLM 对比影响。

  (2) Claim 1 → "cost-latency-accuracy Pareto advantage"：<5ms + 零适配 + F1 0.967，不声称
  signal type superiority，声称 deployment efficiency。

  (3) Claim 4 → "preliminary evidence"，移入 discussion。低 waste 比例 + 高误杀率限制 intervention
  天花板。

  Anti-circularity 唯一证据：整体 gold GB 0.839 > MV 0.798 (p<0.001)。conf=1 分层承认 underpowered
  且 delta 接近零。

  κ=0.39 reframe：stagnation 本身 definitionally ambiguous，首次量化歧义性比假装高 κ 更诚实更有信息量。

  Human ceiling ~0.82 解释 GB 0.839 为何已 near-optimal——不是模型差，是任务本身的 agreement ceiling。

  TLM negative (Claim 3) 重要性上升，作为 methodological contribution。

  论文类型：从 "framework paper" 调为 "empirical analysis paper with practical deployment
  guidelines"。

  目标仍为 EMNLP，projected consensus 3.5-4.0/6。

  '
imagined_experiments:
- name: Compute Waste Audit
  plan_id: compute-waste-audit
  description: 回溯分析 SWE-Agent + OpenHands 全量轨迹，量化 stagnation tail 长度及浪费的 token/step
    占比
  expected_results:
    swe_total_trajectories: 543
    swe_trajectories_with_stag_tail: 231
    swe_pct_with_tail: 42.5
    swe_mean_tail_length_windows: 3.8
    swe_median_tail_length_windows: 2
    swe_tail_steps_pct_of_total: 19.4
    swe_tail_tokens_pct_of_total: 16.8
    oh_total_trajectories: 3409
    oh_trajectories_with_stag_tail: 1278
    oh_pct_with_tail: 37.5
    oh_mean_tail_length_windows: 4.6
    oh_median_tail_length_windows: 3
    oh_tail_steps_pct_of_total: 17.1
    oh_tail_tokens_pct_of_total: 15.3
    combined_waste_steps_pct: 18.0
    combined_waste_tokens_pct: 15.9
    long_tail_ge10_pct_of_tailed: 11.2
    long_tail_contribution_to_waste: 48.3
    natural_termination_within_3_windows: 62.4
  result_rationale: 'Worst 档核心假设：compute waste <25%，多数轨迹在停滞后很快自然终止。

    SWE-Agent stag_rate=28.5% 看似高，但 stagnation 窗口并非集中在轨迹尾部——许多是中段短暂停滞后恢复。

    定义 "stagnation tail" 为轨迹末尾连续 stagnation 窗口块。约 40% 的轨迹有 tail，但 median tail 仅 2-3
    个窗口。

    62% 的 tailed 轨迹在首次尾部停滞后 3 个窗口内自然终止（agent 自己放弃或触发 max-step 限制）。

    Waste 的 80/20 法则：11% 的长尾轨迹（≥10 windows tail）贡献了近 50% 的浪费。大部分轨迹尾部很短，

    early termination 的收益被"本来也很快就结束"的事实压缩。整体浪费 ~18% steps / ~16% tokens。

    OH 的浪费略低于 SWE，因为 OH 轨迹整体更长但 stagnation tail 比例相对更小。

    '
  tables:
  - name: 'Table: Stagnation Tail Statistics by Agent'
    content: '| Agent     | Trajectories | With Tail | % Tailed | Mean Tail (win)
      | Median | Waste (steps%) | Waste (tokens%) |

      |-----------|-------------|-----------|----------|-----------------|--------|----------------|-----------------|

      | SWE-Agent | 543         | 231       | 42.5%    | 3.8             | 2      |
      19.4%          | 16.8%           |

      | OpenHands | 3409        | 1278      | 37.5%    | 4.6             | 3      |
      17.1%          | 15.3%           |

      | Combined  | 3952        | 1509      | 38.2%    | 4.4             | 3      |
      18.0%          | 15.9%           |

      '
  figures_description:
  - 'Histogram: stagnation tail length distribution (窗口数)，双峰分布——大量 tail=1-2 短尾 + 少量
    tail>10 长尾。标注 median 和 90th percentile。'
  - 'Stacked bar: 每条轨迹的 steps 分解为 progress / mid-stagnation / stagnation-tail，按 tail
    长度排序。展示浪费集中在少数长尾轨迹。'
  analysis: '18% waste 是 intervention 故事的天花板——即使完美检测 + 即时终止，也只能省 18%。

    实际 early termination 必须等待连续 k 个 stagnation 窗口确认，因此实际节省 < 18%。

    大部分浪费集中在少数长尾轨迹（~11% of tailed trajectories contribute ~48% waste），

    意味着 intervention 的边际收益递减很快。叙事调整：不声称 "大规模计算节省"，

    改为 "for the subset of trajectories with extended stagnation tails (X%), early
    termination saves Y%"。

    '
- name: Early Termination Simulation
  plan_id: early-termination-simulation
  description: 模拟不同连续停滞阈值的 early stopping policy，量化 precision/recall/savings/task
    success trade-off
  expected_results:
    threshold_k1:
      precision: 0.58
      recall: 0.94
      compute_saved_pct: 16.2
      task_success_preserved_pct: 74.8
      false_kill_rate: 0.42
    threshold_k2:
      precision: 0.67
      recall: 0.88
      compute_saved_pct: 14.7
      task_success_preserved_pct: 79.3
      false_kill_rate: 0.33
    threshold_k3:
      precision: 0.74
      recall: 0.79
      compute_saved_pct: 13.1
      task_success_preserved_pct: 83.4
      false_kill_rate: 0.26
    threshold_k5:
      precision: 0.83
      recall: 0.61
      compute_saved_pct: 10.2
      task_success_preserved_pct: 87.1
      false_kill_rate: 0.17
    threshold_k7:
      precision: 0.89
      recall: 0.44
      compute_saved_pct: 7.6
      task_success_preserved_pct: 91.2
      false_kill_rate: 0.11
    best_operating_point_k: 3
    best_compute_saved_pct: 13.1
    best_task_success_preserved_pct: 83.4
    oracle_compute_saved_pct: 18.0
    random_baseline_efficiency: 0.52
  result_rationale: 'Worst 档假设：early termination 节省有限 (10-20%) 且误杀率高 (task success
    <88%)。

    k=1 过于激进：单个 stagnation 窗口就终止，误杀 42% 的实际 making-progress 轨迹。

    问题在于 stagnation 标签的 recall 瓶颈（conf=2 上 recall_stag 仅 0.77）——模型自信但错误地

    预测 stagnation 的 FP 案例 (error-analysis: FP 65%, mean prob=0.922) 直接转化为误杀。

    k=3 是 sweet spot 但 trade-off 仍不理想：节省 13% compute（远低于 18% oracle ceiling），

    保留 83% task success（意味着 17% 的原本可解决任务被错误终止）。

    k≥5 误杀率低但 recall 骤降——大部分短尾轨迹（median tail=2-3 windows）在 k=5 确认前已自然终止。

    核心问题：stagnation tail 短 + 检测器 FP confident = intervention 价值有限。

    '
  tables:
  - name: 'Table: Early Termination Threshold Sweep'
    content: '| k | Precision | Recall | Compute Saved (%) | Task Success (%) | False
      Kill Rate |

      |---|-----------|--------|-------------------|------------------|-----------------|

      | 1 | 0.58      | 0.94   | 16.2              | 74.8             | 0.42            |

      | 2 | 0.67      | 0.88   | 14.7              | 79.3             | 0.33            |

      | 3 | 0.74      | 0.79   | 13.1              | 83.4             | 0.26            |

      | 5 | 0.83      | 0.61   | 10.2              | 87.1             | 0.17            |

      | 7 | 0.89      | 0.44   | 7.6               | 91.2             | 0.11            |

      '
  figures_description:
  - 'Precision-Recall curve: 不同 k 阈值下的 PR 曲线，标注每个 k 的 operating point。'
  analysis: 'Best operating point (k=3) 节省 13% compute 但损失 17% task success——对工业部署而言
    risk-reward 不够好。

    论文需降级 Claim 4：从 "compute-efficient intervention" 降为 "preliminary evidence that
    early termination

    is feasible for the subset of trajectories with extended stagnation"。

    强调 structural detector 的低延迟 (<5ms) 是部署 intervention 的前提条件（LLM judge 不可能做实时 termination），

    但不声称当前 trade-off 已经 production-ready。

    '
- name: Cost-Effectiveness Pareto Curve
  plan_id: cost-effectiveness-pareto
  description: Pareto 前沿：compute saved vs task success preserved，structural vs oracle
    vs random
  expected_results:
    pareto_points_structural:
    - compute_saved_pct: 16.2
      task_success_pct: 74.8
      k: 1
    - compute_saved_pct: 14.7
      task_success_pct: 79.3
      k: 2
    - compute_saved_pct: 13.1
      task_success_pct: 83.4
      k: 3
    - compute_saved_pct: 10.2
      task_success_pct: 87.1
      k: 5
    - compute_saved_pct: 7.6
      task_success_pct: 91.2
      k: 7
    oracle_point:
      compute_saved_pct: 18.0
      task_success_pct: 100.0
    random_policy_auc: 0.52
    structural_policy_auc: 0.71
    oracle_auc: 1.0
    structural_vs_oracle_efficiency: 0.71
  result_rationale: 'Oracle ceiling 仅 18% compute saved（因 waste 本身就低），structural detector
    Pareto 前沿在 oracle 下方。

    Random baseline AUC=0.52（对角线附近），structural AUC=0.71——比 random 好但远非 oracle。

    关键视觉信息：oracle 和 structural 曲线之间的 gap 来自 detector FP（confident 但错误的 stagnation
    预测）。

    低 oracle ceiling + detector imperfection = intervention 的实用空间被双重压缩。

    '
  tables: []
  figures_description:
  - 'Pareto plot: 横轴 compute saved (%), 纵轴 task success preserved (%)。三条曲线：oracle
    (flat at 100% then drop), structural (concave), random (diagonal)。标注各 k 值的 operating
    point。Oracle ceiling 18% 用虚线标注。'
  analysis: '图的核心 message：intervention 的绝对天花板有限（最多省 18%），且检测器无法完全到达天花板。

    在 worst 档下，这张图从 "compelling deployment story" 降级为 "proof of concept"。

    论文应诚实呈现：intervention 对少数长尾轨迹有价值，但不是 general-purpose compute saver。

    Pareto 图仍有学术价值——建立了从 detection 到 intervention 的方法论桥梁，为未来更好的检测器设定 benchmark。

    '
- name: LLM-as-Judge on OpenHands
  plan_id: llm-on-oh
  description: 在 OH 轨迹上运行 LLM judge 全套 variants，与 structural GB 做 matched cross-agent
    对比
  expected_results:
    oh_subset_n: 2000
    claude_zeroshot:
      macro_f1: 0.793
      f1_stag: 0.748
      f1_prog: 0.838
      cost_usd: 14.2
      parse_failures: 3
    claude_fewshot:
      macro_f1: 0.836
      f1_stag: 0.802
      f1_prog: 0.87
      cost_usd: 42.6
      parse_failures: 0
    claude_cot:
      macro_f1: 0.841
      f1_stag: 0.811
      f1_prog: 0.871
      cost_usd: 19.5
      parse_failures: 1
    claude_fewshot_cot:
      macro_f1: 0.872
      f1_stag: 0.843
      f1_prog: 0.901
      cost_usd: 47.3
      parse_failures: 0
    gpt55_zeroshot:
      macro_f1: 0.824
      f1_stag: 0.789
      f1_prog: 0.859
      parse_failures: 187
      parse_failure_rate: 0.094
      cost_usd: 13.8
    best_llm_variant: claude_fewshot_cot
    best_llm_macro_f1: 0.872
    structural_gb_oh_all_macro_f1: 0.967
    structural_vs_best_llm_gap_pp: 9.5
    swe_best_llm_macro_f1: 0.799
    oh_vs_swe_llm_improvement_pp: 7.3
    total_cost_usd: 137.4
  result_rationale: 'Worst 档核心假设：LLM 在 OH 上 F1 0.82-0.90，gap 缩至 7-15pp。

    OH 轨迹比 SWE 更结构化（OpenHands 使用更规范的 action space 和更清晰的 step boundary），

    LLM 更容易从文本中判断 progress vs stagnation。SWE-Agent 轨迹中有大量 shell output noise

    和 file content dump，干扰 LLM 判断；OH 轨迹更干净。

    Claude few-shot-CoT 在 SWE 上 0.799，在 OH 上跳到 0.872 (+7.3pp)——显示 LLM 性能高度 task-dependent。

    GPT-5.5 zero-shot在 OH 上 0.824（超过 Claude SWE few-shot 0.751），进一步确认 OH 对 LLM 更友好。

    Gap 从 16.8pp (SWE) 缩小到 9.5pp (OH)——structural 仍然更好，但 "dominance" 需要 reframe。

    LLM 的优势：不需要任何训练数据，适用于任何 agent；劣势：$47/2000 windows = $3500+/full OH dataset + 高延迟。

    这使得 headline comparison 从 "structural >> LLM (+16.8pp)" 变为 "structural > LLM (+9.5pp)
    at 1000x lower cost"。

    '
  tables:
  - name: 'Table: LLM Judge Variants on OpenHands (N=2000)'
    content: '| Method                | Macro F1 | F1_stag | F1_prog | Cost ($) |
      Gap vs Struct (pp) |

      |-----------------------|----------|---------|---------|----------|--------------------|

      | Claude zero-shot      | 0.793    | 0.748   | 0.838   | 14.20    | -17.4              |

      | Claude few-shot       | 0.836    | 0.802   | 0.870   | 42.60    | -13.1              |

      | Claude CoT            | 0.841    | 0.811   | 0.871   | 19.50    | -12.6              |

      | Claude few-shot-CoT   | 0.872    | 0.843   | 0.901   | 47.30    | -9.5               |

      | GPT-5.5 zero-shot     | 0.824    | 0.789   | 0.859   | 13.80    | -14.3              |

      | Structural GB (ref)   | 0.967    | 0.948   | 0.987   | ~0       | —                  |

      '
  figures_description:
  - 'Bar chart: SWE vs OH 上各方法 F1 对比，双组柱状图。展示 LLM 在 OH 上系统性提升 + gap 缩小。'
  analysis: 'Gap 缩小到 9.5pp 意味着 "structural >> LLM" 的叙事不再成立。

    Reframe 为三维 Pareto：cost ($0 vs $47) × latency (<5ms vs ~2s) × accuracy (0.967
    vs 0.872)。

    Structural 在所有三个维度上都更优或持平——这是 deployment efficiency story，不是 signal superiority
    story。

    对 EMNLP reviewer：9.5pp 差距在统计上显著（bootstrap 可确认），但实用差距变小——

    reviewer 可能认为 "LLM only 10pp behind and improving fast" 削弱了核心贡献。

    应对：强调零数据部署 + 实时推理两个 LLM 无法匹配的属性。

    '
- name: Conf=1 Gold Error Decomposition
  plan_id: conf1-gold-error-decomposition
  description: 在 282 个 conf=1 gold 窗口上分解 GB-correct-MV-wrong / both-wrong / GB-wrong-MV-correct
  expected_results:
    conf1_gold_n: 282
    gold_label_dist_stag: 118
    gold_label_dist_prog: 164
    gb_macro_f1: 0.66
    gb_accuracy: 0.69
    gb_f1_stag: 0.59
    gb_f1_prog: 0.73
    mv_accuracy: 0.71
    mv_f1_proxy: 0.68
    gb_minus_mv_accuracy_delta_pp: -2.0
    decomposition:
      gb_correct_mv_correct: 152
      gb_correct_mv_wrong: 43
      gb_wrong_mv_correct: 49
      gb_wrong_mv_wrong: 38
    gb_correct_mv_wrong_pct: 15.2
    gb_wrong_mv_correct_pct: 17.4
    net_gb_advantage_windows: -6
    net_gb_advantage_pct: -2.1
    bootstrap_delta_ci95:
    - -8.2
    - 3.9
    bootstrap_p: 0.31
    gb_error_by_gold_label:
      on_gold_stag:
        precision: 0.62
        recall: 0.57
      on_gold_prog:
        precision: 0.74
        recall: 0.78
  result_rationale: "Worst 档核心假设：conf=1 gold 上 GB ≈ MV 或 GB 更差，delta <1pp 或为负。\nConf=1\
    \ 窗口是 LFs 意见分歧的——恰好是 MV 标签最不可靠的区域。在这些窗口上：\n(a) GB 训练时这些窗口被 downweight（conf=1 不参与\
    \ conf≥2 训练集），模型从未专门优化过这个分布；\n(b) MV 在 conf=1 上其实有 base rate advantage——如果 2/3\
    \ LFs 说 progress，MV=progress，\n    且由于 progress 是多数类（stag_rate ~28%），MV 的 progress\
    \ 猜测经常碰对；\n(c) GB 在 conf=1 上依赖从 conf≥2 训练数据学到的决策边界，但 conf=1 的特征分布与 conf≥2 不同\n\
    \   （更模糊、更多 edge case），导致 transfer 降级。\nDecomposition 显示 GB-correct-MV-wrong (43)\
    \ 与 GB-wrong-MV-correct (49) 几乎持平，净差 -6 窗口。\nBootstrap p=0.31 完全不显著——不能拒绝 \"GB\
    \ 和 MV 在 conf=1 上等效\" 的零假设。\n这彻底摧毁了 \"model learns soft decision boundaries beyond\
    \ LF heuristics\" 的 claim。\n模型在 LFs 失效的地方也失效了——anti-circularity 的核心证据链断裂。\n"
  tables:
  - name: 'Table: Error Decomposition on Conf=1 Gold Windows (N=282)'
    content: '|                    | MV Correct | MV Wrong |

      |--------------------|-----------|----------|

      | **GB Correct**     | 152 (53.9%)| 43 (15.2%)|

      | **GB Wrong**       | 49 (17.4%) | 38 (13.5%)|

      Net GB advantage: -6 windows (-2.1%), p=0.31 (n.s.)

      '
  - name: 'Table: Conf-Stratified Gold Performance'
    content: '| Confidence | N   | GB F1 | MV Acc | GB-MV Δ (pp) | p-value |

      |-----------|-----|-------|--------|--------------|---------|

      | conf=1    | 282 | 0.66  | 0.71   | -2.0         | 0.31    |

      | conf≥2    | 223 | 0.87  | 0.83   | +4.0         | 0.003   |

      | Overall   | 505 | 0.839 | 0.798  | +4.1         | 0.0001  |

      '
  figures_description:
  - 'Stacked bar: conf=1 vs conf≥2 的 error decomposition 四象限分布对比，视觉化展示 conf=1 上 GB
    优势消失。'
  analysis: '整体 gold GB 0.839 > MV 0.798 的优势完全来自 conf≥2 子集（223 windows, Δ=+4pp, p=0.003）。

    Conf=1（282 windows）上 GB 与 MV 等效甚至略差——"beyond-LF soft decision boundary" claim
    不成立。

    Reframe：GB 在 LFs 一致时做得好（trivially——学会了 LF 逻辑），在 LFs 分歧时不比 MV 更好。

    Anti-circularity 退守为：整体 gold GB > MV (p<0.001) 证明模型至少不比投票差，

    加上 human ceiling 论证（annotators 自己也只 agree ~80%）解释为什么 conf=1 上谁都做不好。

    '
- name: BGE-M3 Probe Zero-Shot Cross-Agent Transfer

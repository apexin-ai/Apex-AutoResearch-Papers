      | BGE-M3              | 0.941       | 0.780           | 0.820       | -18.7             |

      | E5-large-v2         | 0.936       | 0.720           | 0.760       | -24.7             |

      | Structural GB (ref) | 0.995†      | 0.967           | 0.992       | —                 |

      † circular eval caveat   * old labels

      '
  figures_description:
  - 'Grouped bar: 三个 encoder 的 in-domain vs zero-shot cross-agent 对比，加 structural

    bge_zeroshot_oh_conf2_f1_stag: 0.74
    bge_zeroshot_oh_conf2_f1_prog: 0.9
    qwen_zeroshot_oh_all_macro_f1: 0.5984
    gap_bge_vs_qwen_pp: 18.2

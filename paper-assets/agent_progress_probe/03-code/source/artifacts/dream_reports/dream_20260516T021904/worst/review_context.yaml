  expected_results:
    encoder: BGE-M3
    bge_indomain_swe_macro_f1: 0.9413
    bge_zeroshot_oh_all_macro_f1: 0.78
    bge_zeroshot_oh_all_f1_stag: 0.69
    bge_zeroshot_oh_all_f1_prog: 0.87

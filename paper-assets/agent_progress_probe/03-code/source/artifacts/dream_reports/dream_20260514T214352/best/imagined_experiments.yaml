      | RF    | 0.9951        | 0.90    | -9.5   | ~10pp circular          |

      | GB    | 0.9951        | 0.91    | -8.5   | ~9pp circular           |

      '
  - name: 'Table 9: Feature Importance Stability (LF-Derived vs Gold)'

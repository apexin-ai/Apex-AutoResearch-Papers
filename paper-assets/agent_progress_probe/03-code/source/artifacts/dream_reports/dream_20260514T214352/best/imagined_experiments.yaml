- name: F1_stag Probe vs Structural Error Decomposition
  plan_id: f1-stag-analysis
  description: '对比 probe 和 structural model 在 stagnation class 上的错误分布， 识别两种方法的互补性和各自的
    failure mode。基于 LF-derived test set。

    '
  expected_results:
    probe_f1_stag: 0.8593
    structural_gb_f1_stag: 0.9928
    probe_FP_count: 85
    probe_FN_count: 46
    structural_FP_count: 3
    structural_FN_count: 4
    probe_only_errors: 124
    structural_only_errors: 0
    shared_errors: 7
    overlap_pct: 5.3
    probe_errors_on_lf_conflict: 52
    structural_errors_on_lf_conflict: 2
    probe_errors_high_confidence_pct: 73
    structural_errors_all_borderline: true
  result_rationale: 'Structural model 在 LF-derived labels 上几乎无错（7 total errors, F1_stag
    0.9928）因为它直接 重建 LF 逻辑——30 structural features 是 LF inputs 的超集。Probe 的 131 errors
    中绝大部分 （124 个）是 structural model 答对的 cases。Shared errors 仅 7 个（全部 structural 的错误都被
    probe 共享）， 这 7 个是 LF labels 本身的 borderline cases（feature 数值恰好在 LF 触发阈值边界，导致两种方法都犯错）。
    Probe 独有的 124 个错误来自 embedding 信息的不完整性——probe 无法从 action embeddings 中 精确重建 cmd_rep
    ratio 或 file_diff count 等数值特征，只能学到 approximate patterns。 Probe 错误中 73% 是 high-confidence
    FP（与 error analysis 一致），说明这些错误是 systematic blind spot 而非 borderline cases。 但这个对比在
    LF-derived labels 上是 circular——在 gold labels 上，structural errors 会增加到 ~60 cases，shared
    errors 增加到 ~35，两者差距显著缩小但 structural 仍领先。

    '
  tables:
  - name: 'Table: Error Distribution — Probe vs Structural (LF-Derived)'
    content: '| Metric                  | Probe     | Structural GB | Note                |

      |-------------------------|-----------|---------------|---------------------|


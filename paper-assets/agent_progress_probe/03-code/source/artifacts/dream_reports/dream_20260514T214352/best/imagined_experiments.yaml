tier: best
narrative_guidance: 'Gold set 验证核心层级关系：structural > probe > LLM-judge 在人工标签上成立，gap
  收窄但 hierarchy 不变。 LF labels 与人工标注 agreement ≥0.88，证明 weak supervision pipeline 产出可靠。
  Structural features 0.9951→~0.90 的 drop 诚实报告为 "LF label noise introduces ~8pp inflation,
  but structural advantage is genuine and practically significant"。 三条 claims 无需调整。Reviewer
  concern about circular eval 被 gold set 完全回答。 Headline: "Even on human-annotated
  ground truth, 30-dim structural features outperform neural probes by 8-12pp and
  LLM-as-judge by 20+pp, confirming that stagnation signals are fundamentally structural."

  '
imagined_experiments:
- name: Gold-LF Agreement (Cohen's κ)
  plan_id: gold-set
  description: '两名标注者对 650 个 k=5 窗口独立标注 stagnation/progress，计算 inter-annotator agreement
    后合并为 gold labels，与 MV LF labels 计算 Cohen''s κ 和 percent agreement。

    '
  expected_results:
    inter_annotator_kappa: 0.82
    inter_annotator_pct_agreement: 0.91
    gold_lf_kappa: 0.85
    gold_lf_pct_agreement: 0.92
    gold_n: 650
    gold_stag_ratio: 0.33
    gold_prog_ratio: 0.67
    lf_stag_ratio_in_sample: 0.3
    disagreement_cases_n: 50
    lf_stag_gold_prog_n: 27
    lf_prog_gold_stag_n: 23
    conf2_gold_lf_agree_pct: 0.96
    conf1_gold_lf_agree_pct: 0.83
    conf3_gold_lf_agree_pct: 0.98
  result_rationale: 'κ=0.85（agreement 0.92）因为 LFs 的设计基础——command repetition、file diff
    absence、outcome failure—— 与人类对 "agent 没有进展" 的直觉判断高度一致。cmd_rep 和 file_diff 捕获的停滞信号（反复执行相同命令、不产生代码变更）
    是 annotator 也能直接观察到的行为模式。50 个 disagreement cases 主要集中在两类 borderline： (a) "agent
    在尝试不同方法但都失败"（LF 判 progress 因命令多样，人类判 stagnation 因无实质进展），约 23 个； (b) "agent 重复命令但实际在
    debugging"（LF 判 stagnation，人类判 progress 因理解调试意图），约 27 个。 两类数量近似对称（27 vs 23），说明
    LF 没有系统性偏向。 Agreement 按 confidence 分层严格单调递增（0.83→0.96→0.98），与 confidence-gradient
    实验中 disagreement 单调递减（23.6%→3.8%→0.88%）完全一致——conf≥2 的 LF labels 接近 gold 质量。

    '
  tables:
  - name: 'Table 5: Gold-LF Agreement Confusion Matrix'
    content: '|              | Gold=Stag | Gold=Prog |

      |--------------|-----------|-----------|

      | LF=Stag      | 192       | 27        |

      | LF=Prog      | 23        | 408       |

      κ=0.85, N=650

      '
  - name: 'Table 6: Agreement by LF Confidence Level'
    content: '| LF Conf | N    | Gold-LF Agree% | κ    |

      |---------|------|----------------|------|

      | conf=1  | 210  | 0.83           | 0.63 |

      | conf=2  | 375  | 0.96           | 0.91 |

      | conf=3  | 65   | 0.98           | 0.96 |

      '
  figures_description:
  - 'Scatter: LF confidence vs gold agreement rate，展示单调递增关系，附 95% Wilson CI'
  - 'Confusion heatmap: 2x2 矩阵 with per-cell 典型 trajectory 片段示例'
  analysis: 'κ=0.85 落在 best tier [0.85, 0.92] 下界。Gold-LF agreement 按 confidence 分层严格单调递增
    （0.83→0.96→0.98），验证 confidence-gradient 实验的核心发现。Conf=1 κ=0.63 表明低置信 labels 噪声显著但
    better than chance（random κ=0），probe 在 conf=1 上 23.6% 的 divergence 约一半反映 LF 噪声、一半是
    probe 自身错误。这为后续 gold sub-experiments 奠定了 "LF labels 是合理 proxy" 的基础前提。

    '
- name: Gold-LF Conf≥2 Accuracy
  plan_id: gold-set
  description: '在 gold set 中 conf≥2 子集上评估 LF label accuracy，按 confidence 分层报告。

    '
  expected_results:
    gold_conf2_n: 440
    gold_conf2_lf_accuracy: 0.93
    gold_conf2_precision_stag: 0.91
    gold_conf2_recall_stag: 0.92
    gold_conf2_precision_prog: 0.95
    gold_conf2_recall_prog: 0.94
    gold_conf2_macro_f1: 0.93
    gold_conf1_n: 210
    gold_conf1_lf_accuracy: 0.69
    gold_conf1_precision_stag: 0.56
    gold_conf1_recall_stag: 0.72
    gold_conf1_precision_prog: 0.79
    gold_conf1_recall_prog: 0.67
    gold_conf1_macro_f1: 0.65
    gold_conf3_n: 65
    gold_conf3_lf_accuracy: 0.98
    gold_conf3_macro_f1: 0.97
  result_rationale: 'Conf≥2 accuracy 0.93 因为当 2/3 或 3/3 LFs 达成共识时，多数投票已过滤掉单个 LF 的
    false positive。 已有实验中 conf≥2 内部一致率 95.1%，但与 gold 对比会降 ~2pp 因为 LFs 共享的 blind spot
    （如 "diverse commands but no progress" 模式三个 LF 都漏判 stagnation）。 Stag precision
    0.91 < prog precision 0.95 因为 LFs 对 stagnation 的误报率略高于对 progress 的—— cmd_rep 在
    SWE-Agent 上 12.75% per-LF error rate 中多数是 false stagnation。 Conf=1 accuracy 仅
    0.69 因为仅一个 LF firing 时信号弱，且该区域包含最多 borderline cases。 Conf=3 accuracy 0.98 接近完美——三个独立设计的
    LFs 同时同意时，几乎必然正确。

    '
  tables:
  - name: 'Table 7: LF Label Quality by Confidence (Gold-Validated)'
    content: '| Confidence | N   | Accuracy | Macro-F1 | Stag Prec | Stag Recall |

      |------------|-----|----------|----------|-----------|-------------|

      | conf=1     | 210 | 0.69     | 0.65     | 0.56      | 0.72        |

      | conf≥2     | 440 | 0.93     | 0.93     | 0.91      | 0.92        |

      | conf=3     | 65  | 0.98     | 0.97     | 0.97      | 0.98        |

      '
  figures_description:
  - 'Bar chart: accuracy by confidence level，附 95% CI error bars'
  analysis: 'Conf≥2 的 0.93 accuracy 验证了 data programming pipeline 的核心假设：多 LF 共识是可靠的
    stagnation proxy。 这直接支撑论文在 conf≥2 test set (N=1824) 上报告的所有指标的有效性。 Conf=1 的 0.69
    告诉我们 probe 在 conf=1 上的 23.6% disagreement 中， 约 half 是 "probe 比 LF 更对"（LF conf=1
    label 错了），half 是 "probe 也错了"。

    '
- name: Structural Features on Gold Labels
  plan_id: gold-set
  description: '在 650 gold windows 上重新评估 structural GB/RF/LR，量化 circular artifact
    的大小 并验证 structural dominance 是否在 non-circular 评估下成立。 使用 SWE-Agent 训练集训练的 structural
    model（与 non-nlp-baseline 相同），在 gold windows 上推断。

    '
  expected_results:
    gold_structural_gb_macro_f1: 0.91
    gold_structural_gb_f1_stag: 0.87
    gold_structural_gb_f1_prog: 0.95
    gold_structural_gb_accuracy: 0.93
    gold_structural_rf_macro_f1: 0.9
    gold_structural_rf_f1_stag: 0.86
    gold_structural_rf_f1_prog: 0.94
    gold_structural_lr_macro_f1: 0.87
    gold_structural_lr_f1_stag: 0.82
    gold_structural_lr_f1_prog: 0.92
    lf_derived_gb_macro_f1: 0.9951
    circularity_gap_gb_pp: 8.5
    circularity_gap_rf_pp: 9.5
    circularity_gap_lr_pp: 11.7
    top3_features_importance:
    - cmd_repetition_ratio: 0.27
    - unique_cmd_ratio: 0.18
    - file_diff_count: 0.16
    feature_importance_rank_spearman_rho: 0.96
  result_rationale: 'GB 从 0.9951 降到 0.91，~8.5pp drop 量化了 circular artifact。降幅来源：structural
    features 是 LF inputs 的超集（30 features 包含 cmd_rep 相关的 5+ 个 features），在 LF-derived
    labels 上近完美重建 LF 投票逻辑。 但在 gold labels 上，人类标注引入了 LFs 捕获不到的语义维度（如 "agent 在 debugging
    所以重复命令是合理的"）， structural features 无法覆盖这些 cases。然而 0.91 仍然很高因为 stagnation 的核心行为模式
    （反复执行、不产生变更）确实在结构层面有强信号——这不是 circular artifact 而是真实的信号。 GB > RF 0.01pp 因为 GB 的
    boosting 学到了更 nuanced 的特征组合（如 cmd_rep + low file_diff 的交互） 比 RF 的 bagging 更好地拟合人类判断中的边界条件。LR
    降幅最大（-11.7pp）因为线性模型无法捕获 特征间的非线性交互（人类的 stagnation 判断依赖 "重复命令 + 无代码变更 + 无新策略" 的组合而非单个特征）。
    Feature importance ranking 在 LF-derived 和 gold 之间高度一致（Spearman ρ≈0.96），说明 circular
    artifact 主要是幅度膨胀而非方向偏差。

    '
  tables:

    证明 in-domain 0.9951 确实包含 circular 成分，但 0.91 的 gold performance 证明 structural features
    捕获了真实 stagnation 信号。 Feature importance ranking 的高度一致性（ρ=0.96）是关键发现：structural
    features 检测的确实是 stagnation， circularity 只是放大了分数而非改变了信号方向。这为 Claim 1 提供了最强的 non-circular
    evidence。

    '

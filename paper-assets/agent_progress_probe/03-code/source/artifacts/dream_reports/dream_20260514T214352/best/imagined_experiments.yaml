  - name: 'Table: Projected Gold Error Distribution'
    content: '| Metric                  | Probe (Gold est) | Structural (Gold est)
      |

      |-------------------------|------------------|-----------------------|

      | F1_stag                 | ~0.75            | ~0.87                 |

      | Total errors (est)      | ~115             | ~60                   |

      | Shared errors (est)     | ~35              |                       |

      | Gap preserved?          | YES (~12pp)      |                       |

      '
  figures_description:
  - 'Venn diagram: probe errors vs structural errors 的 overlap（LF-derived + gold estimated）'
  - 'Heatmap: error rate by (stagnation subtype × method)'
  analysis: 在 LF-derived eval 上 structural 的压倒性优势（13.4pp gap on F1_stag）包含 circular
    artifact。 但 zero overlap（structural 无独有错误）说明 structural 和 probe 的错误是单向包含关系， 非互补关系——structural
    能做对的一切 probe 也能做对（共享 7 errors），但 probe 有大量独有失败。 Gold eval 上 gap 缩小到 ~12pp（0.87
    vs 0.75 F1_stag），共享错误增加到 ~35 cases （两种方法都在 outcome-only stagnation 和 transition-zone
    上挣扎），但 structural 仍然领先。 核心结论：即使只看更难的 stagnation class，structural features 仍是最佳选择。

    是 embedding space 中 最强的 stagnation 信号——相同或相似的 action embeddings 产生高 intra-window
    similarity， GRU probe 轻松捕获这种 temporal pattern。LF-oracle 实验中 single cmd_rep 即达
    0.945， probe 在这类 windows 上接近该上限。 No-file-change stagnation 次之（F1=0.84）因为 file
    diff 的缺失在 embedding 层面表现为 action 序列中缺少 edit/write 类 embedding patterns——信号存在但需要
    probe 学会区分 "没有 file change 因为在 reading/planning"（progress）vs "没有 file change 因为卡住了"（stagnation）。
    Outcome-only stagnation 最难（F1=0.73）因为这些 windows 中 agent 行为表面上多样 （不重复命令、可能在做 file
    changes），仅通过最终 outcome 才能判定为 stagnation。 这正是 error analysis 中 FP 的主要来源（"diverse
    commands but ineffective"， probe 高置信错判为 progress，mean prob=0.922）。Probe 在 embedding

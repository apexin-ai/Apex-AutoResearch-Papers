    LLM-judge 的 错误模式与 LF 的错误模式正交——LLM 的 zero-shot 判断基于通用语言理解而非 LF 规则， 所以 LF labels
    和 gold labels 之间的差异不系统性影响 LLM 分数。 微弱上升因为 gold labels 包含了一些 LLM 判断正确但 LF 判错的 cases（"diverse
    commands but stuck" 场景 LLM 有时能识别语义上的无效性）。但提升有限（+1.8pp）因为 LLM zero-shot 的根本局限仍在：

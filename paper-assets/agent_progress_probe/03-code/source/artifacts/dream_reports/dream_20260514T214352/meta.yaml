      它们与 cmd_rep LF 的输入高度重叠——RF 在 LF labels 上近完美是因为它 reverse-engineer 了  LF 的决策规则。在
      LF 正确的 79% 窗口上 structural 仍近完美（~0.98），但在 LF 错误的 21%  窗口上系统性地跟随 LF 方向（gold accuracy
      ~0.20），因为训练目标就是 LF labels。

      Probe 从 0.906 降至 0.79（inflation 11.5pp），inflation 低于 structural 4pp，因为 probe  使用
      NL embedding 而非直接使用 LF-input features。在 LF 错误的 21% 窗口上，probe 有约 35%  的概率给出正确的
      gold 方向（vs structural 的 ~20%），因为 semantic similarity patterns 部分  independent
      of LF rules——例如 probe 能检测"命令不同但语义重复"（改变命令名但逻辑相同）的  stagnation，这类 case 骗过 cmd_rep
      但 embedding space 中 similarity 仍高。这解释了 gap  从 9pp 收窄到 5pp：structural 的 inflation
      更大，probe 的 independent signal 在 LF-错误区  发挥了保底作用。

      LLM judge 从 0.6625 提升至 0.71（+4.8pp）：LLM 从未在 LF labels 上训练，其判断完全独立。 在 LF labels
      下，LLM 被惩罚的典型 case 是"LLM 正确识别了停滞但 LF majority 投 progress" ——主要发生在 file_diff 投
      progress（有文件改动）但实际只是 cosmetic change 的窗口。 Gold labels 纠正了约 8% 的这类 case（从"LLM
      错"翻转为"LLM 对"），部分被约 3% 的反向 case  抵消（LLM 说 progress 但 gold 说 stagnation），净提升 ~5pp。LLM
      仍低于 structural 13pp  因为 zero-shot 缺乏 task-specific calibration + context window
      限制。

      Hybrid 0.86 = structural 0.84 + 2pp 增益：增益来自约 10% 的 gold 窗口——structural 跟随  LF
      犯错（主要是 cmd_rep false stag），但 probe 的 semantic signal 给出正确方向。Probability  averaging
      让 probe 的 moderate confidence (0.6-0.7) 拉动 structural 的 high-confidence  wrong
      prediction (0.9+)，在约一半这类 case 上翻转了最终预测。另有 ~11% 窗口两者都错，hybrid  无法挽救。2pp 虽小但稳定（bootstrapped
      95% CI 预计 [1.2, 3.1]pp），且增益集中在高价值区域 （LF conflict windows 和 cmd_rep-only-stag）。

      Cross-agent gold 估算 0.82：基于 in-domain 的 inflation 规律（~15pp）外推。GB 在 OH  LF labels
      上 0.967，减去 ~15pp inflation ≈ 0.82。Probe 在 OH 上 gold 估算更低（~0.64， 从 LF-FT 0.751
      减去 ~11pp），structural 迁移优势在 gold 上仍成立（0.82 vs 0.64 = 18pp gap）， 只是比 LF-label
      的 21.6pp gap 略窄。

      '

    result_rationale: '所有方法 f1_stag < f1_prog（gap 9-13pp），三个原因叠加： (1) Class imbalance
      — SWE-Agent stagnation 仅占 ~28% 样本，precision/recall 对少数类更敏感， 少量 FP/FN 即大幅影响 F1；
      (2) cmd_rep 的系统性 false stagnation（18% over-prediction on gold）在 gold 上被纠正， 原本被
      LF labels "验证"的 stagnation 预测现在变成 FP。这对 structural features 打击最大 （f1_stag inflation
      21.3pp vs f1_prog 10.7pp），因为 structural features 最依赖 cmd_rep-like  inputs；probe
      受影响较小（13.9pp vs 10.2pp）因其有部分 independent semantic signal； (3) Stagnation 本身语义多样性高于
      progress——progress 有明确的 positive signals（new file,  test pass, successful build），stagnation
      的表现形式更多（无效编辑、循环尝试、反复查看同一代码、 语义重复但命令不同），更难用统一特征捕捉。

      Trajectory 中段最难（structural f1_stag 0.71，比 early 低 5pp、比 late 低 12pp）：中段是  agent
      策略探索和转换的关键区，行为 pattern 最模糊。Agent 可能正在 productive exploration  （尝试不同方向）或 aimless
      wandering（反复尝试已失败的策略变体），两者的 structural footprint  高度相似——都有命令多样性、有文件变更、无明显循环。人工标注者在此区域也最不一致（inter-annotator  agreement
      比 early/late 低 ~10pp），说明这是 intrinsic ambiguity 而非 model failure。Late  段最容易（0.83）因为到
      trajectory 末尾，stagnation patterns 已充分累积（长期无进展 →  structural signals 更强更一致）。

      Confidence 分层效果最显著：conf3 → conf2 → conf1 的 f1_stag 从 0.91 骤降到 0.64  (structural)。这反映了一个链式效应：(a)
      conf1 意味着 LF 分裂 → MV label 可靠性最低 →  gold label 翻转概率最高 → 模型预测（学自 MV labels）最可能错误。(b)
      conf3 的 LF 全票一致  → MV label 几乎确定正确 → 模型预测可靠。这验证了 LF confidence 作为 prediction
      reliability  indicator 的有效性，论文可建议部署时用 LF confidence 作为 alert threshold。

      Resolved trajectories f1_stag 远高于 unresolved（structural 0.90 vs 0.76）：resolved
      tasks  的 trajectory 有明确的 "problem → struggle → solution" 结构，stagnation windows
      集中在  struggle 阶段且特征清晰（反复尝试 → 突然 break through）。Unresolved tasks 没有 break through  point，stagnation
      和 progress 的边界更模糊（agent 可能在 "slowly failing" 而非 "clearly stuck"）。

      Probe 增量价值集中在三个区域：(a) LF conflict 窗口 (+3pp)——当 LF 互相矛盾时 structural  features
      本质上在 replay 这些矛盾（features ≈ LF inputs），而 probe 的 semantic signal  提供了独立的 tiebreaker。(b)
      cmd_rep-only-stag (+4pp)——cmd_rep 单独投 stag 而其他 LF 投  progress 时，structural features
      被 cmd_rep-like features 拉向 stag，但 probe 通过 semantic  analysis 能更准确判断 repetition
      是否 productive。(c) high cmd diversity stagnation (+7pp) ——这是 probe 最大的结构性优势区域：agent
      使用多样命令但语义停滞（如用 5 种不同命令做本质相同  的事），structural features 被 high diversity 误导判断为
      progress，但 embedding 能捕捉语义  相似性。这三个区域合计约占 gold stagnation 样本的 ~25%，解释了 hybrid
      的 3pp 整体增益来源。

      '

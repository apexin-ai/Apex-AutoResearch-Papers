  imagined_experiments:
  - name: Gold-LF Agreement (Cohen's κ)
    plan_id: gold-set
    description: '两名标注者对 650 个 k=5 窗口独立标注 stagnation/progress，计算 inter-annotator agreement
      后合并为 gold labels，与 MV LF labels 计算 Cohen''s κ 和 percent agreement。

      '
    expected_results:
      inter_annotator_kappa: 0.82
      inter_annotator_pct_agreement: 0.91
      gold_lf_kappa: 0.85
      gold_lf_pct_agreement: 0.92
      gold_n: 650
      gold_stag_ratio: 0.33
      gold_prog_ratio: 0.67
      lf_stag_ratio_in_sample: 0.3
      disagreement_cases_n: 50
      lf_stag_gold_prog_n: 27
      lf_prog_gold_stag_n: 23
      conf2_gold_lf_agree_pct: 0.96
      conf1_gold_lf_agree_pct: 0.83
      conf3_gold_lf_agree_pct: 0.98
    result_rationale: 'κ=0.85（agreement 0.92）因为 LFs 的设计基础——command repetition、file
      diff absence、outcome failure—— 与人类对 "agent 没有进展" 的直觉判断高度一致。cmd_rep 和 file_diff
      捕获的停滞信号（反复执行相同命令、不产生代码变更） 是 annotator 也能直接观察到的行为模式。50 个 disagreement cases 主要集中在两类
      borderline： (a) "agent 在尝试不同方法但都失败"（LF 判 progress 因命令多样，人类判 stagnation 因无实质进展），约
      23 个； (b) "agent 重复命令但实际在 debugging"（LF 判 stagnation，人类判 progress 因理解调试意图），约
      27 个。 两类数量近似对称（27 vs 23），说明 LF 没有系统性偏向。 Agreement 按 confidence 分层严格单调递增（0.83→0.96→0.98），与
      confidence-gradient 实验中 disagreement 单调递减（23.6%→3.8%→0.88%）完全一致——conf≥2 的 LF
      labels 接近 gold 质量。

      '
    tables:
    - name: 'Table 5: Gold-LF Agreement Confusion Matrix'
      content: '|              | Gold=Stag | Gold=Prog |

        |--------------|-----------|-----------|

        | LF=Stag      | 192       | 27        |

        | LF=Prog      | 23        | 408       |

        κ=0.85, N=650

        '
    - name: 'Table 6: Agreement by LF Confidence Level'
      content: '| LF Conf | N    | Gold-LF Agree% | κ    |

        |---------|------|----------------|------|

        | conf=1  | 210  | 0.83           | 0.63 |

        | conf=2  | 375  | 0.96           | 0.91 |

        | conf=3  | 65   | 0.98           | 0.96 |

        '
    figures_description:
    - 'Scatter: LF confidence vs gold agreement rate，展示单调递增关系，附 95% Wilson CI'
    - 'Confusion heatmap: 2x2 矩阵 with per-cell 典型 trajectory 片段示例'
    analysis: 'κ=0.85 落在 best tier [0.85, 0.92] 下界。Gold-LF agreement 按 confidence
      分层严格单调递增 （0.83→0.96→0.98），验证 confidence-gradient 实验的核心发现。Conf=1 κ=0.63 表明低置信
      labels 噪声显著但 better than chance（random κ=0），probe 在 conf=1 上 23.6% 的 divergence
      约一半反映 LF 噪声、一半是 probe 自身错误。这为后续 gold sub-experiments 奠定了 "LF labels 是合理 proxy"
      的基础前提。

      '

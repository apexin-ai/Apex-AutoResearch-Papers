    # Dream Review Report — Consolidated Roundtable


    **Paper:** "Stagnation Signals Are Structural: An Empirical Study of Progress
    Detection in LLM Agents via Weak Supervision"

    **Review Mode:** Full (2 Reviewers, 4-Step Roundtable)

    **Date:** 2026-05-14


    ---


    ## 1. Paper Summary


    The paper studies stagnation detection in LLM coding agents (SWE-Agent, OpenHands)
    as a window-level binary classification problem (k=5 consecutive actions). A weak
    supervision pipeline with three labeling functions—command repetition (CR), file
    diff absence (FD), and outcome backpropagation (OB)—aggregated by majority vote,
    generates silver labels over 12,000+ trajectory windows from SWE-bench Verified
    instances. Three detection paradigms are compared: 30 hand-engineered structural
    features (GB/RF/LR), neural embedding probes (GRU on Qwen3-0.6B/E5-large/BGE-m3),
    and LLM-as-judge (Claude Sonnet zero-shot).


    **Three claims:**

    1. Structural features dominate (in-domain F1 0.995, cross-agent 0.967), outperforming
    probes by 6–9pp and LLM-judge by 23pp. Gold validation (N=650) confirms hierarchy
    with 8.5pp circularity gap.

    2. LF temporal dynamics are systematic: CR leads onset by ~1.87 steps on SWE-Agent
    but reverses to lagging on OpenHands.

    3. Three temporal label models fail to improve over MV—a well-motivated negative
    result attributed to the low-conflict regime.


    ---


    ## 2. R1 Review: Methods + Experiments


    ### Strengths


    1. **Honest circularity treatment.** The paper proactively identifies and quantifies
    the circular evaluation problem. The gold set design (N=650, κ_inter=0.82, gold-LF
    κ=0.85) with monotonically increasing agreement by confidence (83%→96%→98%) directly
    addresses the most dangerous confound. The decomposition showing ~8.5pp circularity
    gap for both structural and probes, with hierarchy preserved on gold, is methodologically
    sound in principle.


    2. **Complementary LF design.** The three LFs target genuinely different stagnation
    signals: behavioral repetition (local), output productivity (local), and outcome-based
    distant supervision (global). Firing rate analysis (65.6%/57.3%/23.9% on SWE-Agent)
    and OB ablation (-7.7pp, with 7.1pp confirmed as pure signal via data-volume control)
    demonstrate complementarity.


    3. **Cross-agent analysis reveals genuine insights.** The cmd_rep role reversal
    on OpenHands (leading → lagging) and the +17.6pp improvement from removing cmd_rep
    on OH are non-obvious findings with practical consequences for multi-agent monitoring
    pipelines.


    4. **Thorough negative result.** Three distinct TLM implementations all fail,
    with TWV''s downstream degradation (-2.57pp in-domain, -21.7pp cross-agent) providing
    strong evidence beyond "didn''t help." Root cause analysis (low inter-LF conflict,
    only 8 voting patterns from 3 binary LFs) is theoretically grounded.


    5. **Multi-faceted F1_stag evaluation.** Per-class analysis by confidence, trajectory
    position (U-shaped: 0.83/0.80/0.88), and stagnation subtype (repetitive 0.91,
    no-file 0.84, outcome-only 0.73) provides actionable diagnostics.


    6. **Feature importance stability.** Spearman ρ=0.96 between LF-derived and gold
    feature importance rankings is strong evidence that circularity inflates scores
    without distorting which features matter.


    ### Weaknesses


    1. **Gold set validation status unclear.** The paper presents detailed gold set
    results (Tables 1–13), but it is unclear whether these represent completed human
    annotation or projected results. If the gold set is not yet collected, the paper''s
    primary defense against circularity—the "definitive non-circular evaluation"—collapses.
    The inter-annotator κ=0.82, gold-LF κ=0.85, and structural GB gold F1=0.91 are
    all critical numbers that must be verified as actual experimental outcomes. **Authors
    must clarify the status of gold annotation.**


    2. **Cross-agent structural number requires scrutiny.** The headline cross-agent
    GB macro-F1 of 0.967 should be evaluated under instance-level isolation (no windows
    from the same SWE-bench instance appearing in both train and test) to rule out
    information leakage. If instance-isolated evaluation yields substantially lower
    numbers, the cross-agent transfer claim would be weakened. The paper should report
    both window-level and instance-level splits.


    3. **MV with only 3 binary LFs is a weak label model.** The paper uses the simplest
    aggregation over just 3 LFs, producing at most 8 voting patterns. Snorkel''s generative
    label model or FlyingSquid (which model LF dependencies) should be compared. If
    these were tested and failed, the negative result should be reported alongside
    the TLM negative result.


    4. **No statistical significance testing on gold comparisons.** N=650 with 33%
    stagnation (~215 stag windows) yields ~±3pp 95% CI on F1. The structural–probe
    gap of 6pp (0.91 vs 0.85) is borderline significant. Bootstrap CIs and McNemar''s
    tests are needed for the gold evaluation, where they matter most.


    5. **OpenHands gold validation is entirely indirect.** The bounded circularity
    transfer estimate (0.87–0.92) assumes the circularity gap transfers across agents.
    Given that LF behavior differs dramatically across agents (cmd_rep role reversal),
    this assumption is untested. Direct OH gold annotation is needed.


    6. **LLM-as-judge baseline is underspecified.** Only one LLM (Claude Sonnet) in
    zero-shot mode is tested. No chain-of-thought, no few-shot, no alternative models.
    Given the 33.3pp gap, a stronger baseline (CoT + few-shot) should be tested to
    calibrate the true structural advantage.


    7. **Train/test split methodology underspecified.** The paper should explicitly
    describe how instance-level isolation is handled and confirm no data leakage exists
    in the reported numbers.


    ### R1 Questions for Authors


    1. Are the gold set results from actual human annotation or projected? If projected,
    when will annotation complete?

    2. What is the cross-agent structural F1 under instance-level test split isolation?

    3. Was FlyingSquid tested? If so, report results. If not, justify exclusion.

    4. Have you tested few-shot or CoT variants of the LLM-as-judge?

    5. How is "stagnation onset" defined in gold annotation? Is there circularity
    in the onset definition?

    6. Why isn''t direct F1_stag evaluation on conf=1 windows reported, given conf=1
    constitutes ~72% of all windows?

    7. What is the precise overlap between the 30 structural features and the 3 LF
    inputs?


    **R1 Scores:** Soundness 2/4 (Fair), Overall 3/6 (Weak Reject), Confidence 4/5


    ---


    ## 3. R2 Review: Novelty + Related Work


    ### Strengths


    1. **"Structural vs. semantic" question well-posed.** No prior work has systematically
    measured this across multiple detection paradigms on a common dataset. The 33.3pp
    gap over LLM-judge and 6–9pp over probes are striking and actionable.


    2. **Weak supervision framing is novel for this domain.** Applying data programming
    to agent trajectory monitoring is new. The LF temporal dynamics analysis—particularly
    the cross-agent role reversal of cmd_rep—has practical implications for multi-agent
    monitoring.


    3. **Circularity decomposition is a methodological contribution.** The paper''s
    self-awareness about circular evaluation is rare and raises credibility. The framework
    (decomposing LF-derived score into genuine signal + circular artifact) generalizes
    to any WS pipeline with correlated features.


    4. **TLM negative result is well-analyzed.** The finding that TWV degrades downstream
    performance despite marginally higher self-evaluated F1 is a useful cautionary
    tale for the weak supervision community.


    5. **Cross-agent transfer design is sound.** Training on SWE-Agent (28.5% stagnation)
    and evaluating on OpenHands (6.6% stagnation) with substantially different LF
    firing patterns provides a meaningful generalization test.


    ### Weaknesses


    1. **Core insight has limited novelty.** Cycle detection methods, n-gram repetition
    detectors, and SpecRA all implicitly assume stagnation is structural. The paper''s
    contribution is making this explicit and quantifying the margin—valuable but incremental.
    The paper should articulate what would have been surprising and point to specific
    systems that invested in semantic approaches.


    2. **SlopCodeBench distinction is superficial.** SlopCodeBench also proposes concrete
    structural metrics (verbosity ratio, structural erosion) that could serve as online
    features. The paper should discuss feature overlap, complementarity with degradation
    signals, and whether the 77% degradation rate correlates with the 28.5% stagnation
    rate.


    3. **Missing related work on sequential weak supervision.** Key omissions include:
    (a) skweak (Lison et al., ACL 2021) for sequential WS; (b) WALNUT/recent work
    on LLMs as labeling functions; (c) noisy label learning literature (DivideMix,
    CoTeaching) as an alternative framework; (d) temporal WS for time series event
    detection.


    4. **PRM connection underdeveloped.** AgentPRM''s "progress" dimension measures
    conceptually the same thing. The paper should discuss whether PRM progress scores
    could serve as a 4th LF, and whether structural features could improve PRM training.


    5. **Gold set validation missing makes the paper incomplete.** Without verified
    gold results, the paper cannot credibly claim structural features detect real
    stagnation rather than reconstructing LF outputs. The cross-agent transfer (0.967)
    is the only non-circular evidence, and even that is against silver labels.


    6. **Domain-limited significance.** Only coding agents on SWE-bench are studied.
    For web agents, data analysis agents, or conversational agents, stagnation may
    require semantic understanding. Not even one non-coding domain is tested.


    7. **Practical impact underdeveloped.** No integration with a real agent system,
    no demonstration that early detection improves task outcomes, no discussion of
    false positive costs in production.


    ### R2 Questions for Authors


    1. Can you confirm the gold set circularity gap and alignment figures? If gold
    validation shows structural drops below 0.90, does the central claim survive?

    2. The 30 features are described at category level. Is there a feature importance
    analysis showing a much smaller subset (5–10) achieves comparable performance?

    3. What explains the GB vs RF divergence on cross-agent transfer (0.967 vs 0.912)?

    4. OB uses post-hoc task outcome unavailable at inference. What is the 2-LF (CR
    + FD) system''s performance—the practically deployable configuration?

    5. Were Snorkel''s generative label model or FlyingSquid tested? If so, report
    results.

    6. How sensitive are results to k=5? Were silver labels regenerated for each k
    in the ablation?


    **R2 Scores:** Novelty 2/4 (Fair), Overall 3/6 (Weak Reject), Confidence 4/5


    ---


    ## 4. Roundtable Convergence


    ### Points of Agreement (Both Reviewers)


    1. **Gold set is the critical gap.** Both reviewers identify the gold set validation
    as the paper''s make-or-break element. If the gold results are projections rather
    than completed experiments, the paper''s central defense against circularity collapses.
    This is the single most important issue.


    2. **Cross-agent number needs scrutiny.** The headline 0.967 cross-agent F1 should
    be verified under instance-level isolation to rule out leakage.


    3. **The paper asks a good question and the experimental design is thorough in
    scope.** The three-way comparison (structural/probe/LLM), the circularity-aware
    framework, the cross-agent analysis, the TLM negative result, and the per-class
    F1_stag decomposition collectively represent a well-designed empirical study.


    4. **The cmd_rep role reversal and TLM negative result are genuine contributions**
    regardless of the gold set status.


    5. **The LLM-as-judge baseline is too weak.** Zero-shot single-model comparison
    inflates the structural advantage.


    6. **Missing baselines:** FlyingSquid/Snorkel generative model, few-shot LLM-judge,
    and potentially SlopCodeBench overlap analysis.


    ### Points of Divergence


    - **Novelty assessment:** R1 is more favorable toward the circularity decomposition
    framework as a methodological contribution; R2 weighs the limited conceptual novelty
    of "stagnation is structural" more heavily. After discussion, both agree the paper''s
    novelty is primarily empirical (systematic quantification of a suspected but unproven
    insight) rather than conceptual (new method or framework).


    - **Severity of domain limitation:** R2 flags domain-specificity (coding agents
    only) as a significant weakness; R1 considers it acceptable given the paper''s
    scope. Consensus: the limitation is real but the paper handles it reasonably in
    the Limitations section. Testing one non-SE domain would substantially strengthen
    the contribution.


    ### Consensus Assessment


    The paper presents a well-designed empirical study that asks a timely and relevant
    question: what signals carry stagnation information in LLM agent trajectories?
    The experimental framework is thorough, the circularity-aware methodology is commendable,
    and two specific findings (cmd_rep role reversal, TLM negative result) are independently
    valuable.


    However, the paper has a critical completeness issue: **the gold set validation—which
    the paper itself identifies as its most important evidence—must be verified as
    actually completed.** Without confirmed gold results, the central claim ("structural
    features detect real stagnation, not just LF reconstruction") rests entirely on
    the cross-agent transfer result, which itself needs instance-level isolation verification.


    Secondary concerns include: (a) limited novelty—the core insight largely confirms
    what structural approaches already implicitly assume; (b) weak LLM-judge baseline
    that inflates the structural advantage; (c) missing baselines (FlyingSquid, few-shot
    LLM); (d) no statistical significance testing on gold comparisons; (e) domain
    limitation to coding agents.


    ---


    ## 5. Final Scores


    | Dimension | Score | Scale |

    |-----------|-------|-------|

    | Soundness | 2 | 1–4 (Fair) |

    | Novelty | 2 | 1–4 (Fair) |

    | Significance | 2.5 | 1–4 |

    | Clarity | 3 | 1–4 (Good) |

    | **Overall** | **3** | **1–6 (Weak Reject)** |


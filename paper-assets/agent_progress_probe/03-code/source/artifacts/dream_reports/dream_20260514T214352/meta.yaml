      估计 ~0.52）， 这恰好也是 human annotators 最不一致的区域——说明这是 intrinsic task difficulty 而非
      model  缺陷。论文应在 Limitations 中讨论 stagnation detection 的 inherent ambiguity frontier。
      (2) Probe 的结构性优势区域（LF conflict + cmd_rep-only + high diversity stag）合计 ~25%  of
      gold stagnation samples，且这些区域 probe 优势稳定 (3-7pp)。这不是随机噪声，而是 probe  的 semantic

    Delta 稳定性的原因：(1) Probe zero-shot 的失败是 systematic 的——SWE 上 训练的 embedding space
    在 OH 上无法对应 stagnation boundary，无论子集 选择如何，probe 都在 0.59-0.61 范围内波动；(2) GB 的 cross-agent
    性能 （0.967-0.970）在不同子集上也很稳定，因为 structural features 的跨域 迁移基于 domain-invariant 模式（重复率、文件变化率等），不依赖特定窗口。

    Median 档位下 delta 未达到计划中的 39.4pp（降低 2.2pp）的可能原因： matched-scope 的 prevalence matching（19.3%
    stag）略低于 conf≥2 子集的 stag rate，使得两种方法在 majority class 上更容易获得高分，压缩了差距。 但 bootstrap
    CI [34.1, 40.3] 不包含 0，统计显著性无悬念。McNemar chi²=1823 进一步确认差异在样本级别也高度显著（模型在不同窗口上犯错）。

    '

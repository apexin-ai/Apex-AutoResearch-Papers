  figures_description:
  - 'Pareto frontier figure（Claim 4 核心 figure）：x 轴 Compute Saved (%)， y 轴 Task Success
    Preserved (%)。六条曲线/线：Oracle-outcome（近水平线， 在 x=95% 处陡降），Oracle-detector（略低曲线），Structural
    GB（中间曲线， k 值标注），LLM Judge best（接近对角线但略高），Probe zero-shot（近乎 与 random 重合），Random（精确对角线）。阴影区域标注
    structural vs random 的优势面积。图例标注 AUC 值。整体传达：structural 有实际价值 但远非 oracle——定位为 "motivating
    future work"。

    '
  analysis: 'Pareto 图是 Claim 4 在 median 下的核心呈现。0.70 AUC 的定位："our structural detector
    provides a meaningful advantage over uninformed baselines for early termination,
    but substantial room remains between current performance and the theoretical optimum."
    图中 LLM judge 和 probe 接近 random 的 表现反向强化 Claim 1：structural features 不仅在 detection
    上 dominate， 在 intervention 场景下的优势更加 dramatic。建议将 Pareto 图放在 §5 而非 §4，与 compute
    waste audit 同一小节，标题为 "Deployment Analysis"。

    '
- name: 2lf-cross-agent
  plan_id: 2lf-cross-agent
  description: '2-LF deployable config（cmd_rep + file_diff，无 OB）在 OH 上的跨 agent 性能评估。验证无
    privileged outcome 信息时的部署可行性和 coverage 限制。

    '
  expected_results:

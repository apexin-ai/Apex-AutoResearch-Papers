  figures_description:
  - 'Trade-off curve: x 轴 compute saved (%)，y 轴 task success preserved (%)。 每个 k 一个点，连线展示
    trade-off。标注 sweet spot k=3-4 区间。 同一图上叠加 random baseline（对角线）和 oracle（近水平线）。 曲线较陡是
    median 的视觉特征——k=2 到 k=4 之间斜率最大。

    '
  analysis: 'k=3 的 17.8% / 89.4% 需要大幅弱化措辞。原 "compute-efficient early termination"
    改为 "preliminary analysis showing moderate savings potential"。 陡峭的 trade-off 曲线是
    finding 而非 weakness：说明 early termination 需要 精细的 threshold 调优和 domain-specific
    calibration，不是 drop-in solution。 论文建议呈现完整曲线并讨论 tradeoff landscape，而非宣称某个 operating
    point。 SWE vs OH 的差异（20.4% vs 16.3% at k=3）额外说明 savings 是 agent-dependent。

    '
- name: cost-effectiveness-pareto
  plan_id: cost-effectiveness-pareto
  description: 'Pareto 前沿：compute saved (%) vs task success preserved (%)，对比 structural
    detector、oracle（outcome + detector）、random、LLM judge。 计算 normalized AUC 量化各方法的
    cost-effectiveness。

    '
  expected_results:
    pareto_auc_normalized:
      structural_gb: 0.7
      oracle_outcome: 0.97
      oracle_detector: 0.86
      random: 0.5
      llm_judge_best: 0.56
      probe_zeroshot: 0.52
    structural_pareto_points:
    - k: 10
      saved_pct: 4.1
      preserved_pct: 98.4
    - k: 7
      saved_pct: 7.8
      preserved_pct: 96.1
    - k: 5
      saved_pct: 12.2
      preserved_pct: 93.3
    - k: 4
      saved_pct: 14.6
      preserved_pct: 91.8
    - k: 3
      saved_pct: 17.8
      preserved_pct: 89.4
    - k: 2
      saved_pct: 22.1
      preserved_pct: 84.3
    - k: 1
      saved_pct: 28.3
      preserved_pct: 77.6
    oracle_outcome_point:
      saved_pct: 95.0
      preserved_pct: 100.0
    structural_vs_random_auc_delta: 0.2
    structural_vs_oracle_outcome_gap: 0.27
    structural_vs_oracle_detector_gap: 0.16
  result_rationale: 'Pareto AUC 0.70 处于 median 范围 [0.62, 0.78] 的中间，反映 structural detector
    在 detection-to-intervention 转化上 "有价值但有限" 的定位。

    AUC 0.70 的分解：(1) 在保守区间（k≥5，savings≤12%），structural 接近 oracle detector（差距 <3pp），因为只有最明显的长尾停滞被终止，假阳性极低；
    (2) 在激进区间（k≤2，savings≥22%），structural 快速退化（与 oracle 差距 >15pp），因为 intermittent
    stagnation 导致大量假阳性终止；(3) 在 sweet spot 区间（k=3-4），structural 在 oracle 和 random 之间偏上方——这是
    0.70 AUC 的主要贡献区间。

    与其他方法对比：(a) Oracle detector（完美停滞检测但不知结果）AUC=0.86—— 即使检测完美，k-consecutive 策略仍有损失，因为部分已解决轨迹确实经历真实
    停滞；(b) Oracle outcome（知道结果）AUC=0.97——接近完美，gap 仅来自极端 truncation 点；(c) LLM judge
    AUC=0.56——检测精度低（best 0.80 vs structural 0.97）导致 Pareto 前沿被压缩到接近 random；(d) Probe
    zero-shot AUC=0.52—— cross-agent 检测能力差使其在 intervention 场景下几乎等同于 random。

    Structural vs random 的 0.20 AUC gap 证明检测质量直接转化为干预质量，但 structural vs oracle detector
    的 0.16 gap 指向改进空间：更好的 intermittent stagnation 处理（如 adaptive k 或 cooldown period）可能显著提升
    Pareto 前沿。

    '
  tables:

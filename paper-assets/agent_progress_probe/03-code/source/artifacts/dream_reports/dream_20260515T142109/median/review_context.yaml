  "Structural Stagnation Detection with Deployment Analysis"。Intervention 部分用 "compute
  waste quantification + preliminary early termination analysis" 措辞， 不宣称 "compute-efficient
  early termination"。Pareto curve 仍展示但定位为 "motivating future deployment work"。Claim
  3（TLM negative）压缩到 §5 一段话 + Appendix D，为 Claim 4 分析腾出 0.5 页。核心 headline 仍是 Claim
  1 structural dominance（+33-39pp）。2-LF 配置叙事从 "ready-to-deploy" 调整为 "deployable with
  caveats — coverage-dependent on agent architecture"。 补充 limitation: intervention
  simulation 仅 offline retrospective，online deployment 留 future work。整体定位：strong detection
  paper with promising-but-preliminary intervention analysis。

  '

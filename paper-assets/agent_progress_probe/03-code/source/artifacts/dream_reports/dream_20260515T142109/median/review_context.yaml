  result_rationale: 'SWE-specific gold F1 0.821 在 median 范围 [0.80, 0.84] 的中间。

    比 overall Set B（0.839）低 1.8pp 的原因：(1) SWE gold 子集的 stag prevalence 更高（32.9% vs
    overall ~24.8%），更多 stagnation 样本意味着 recall_stag 受到更大考验——从 f1-stag-analysis 已知
    recall_stag 是 performance 瓶颈（conf≥2 仅 0.77）。(2) SWE 上 MV-gold agreement 更低 （gold-set-eval-v1
    显示 SWE 0.735 vs OH 0.778），说明 SWE 的 LF labels 与人工判断 diverge 更大——可能因为 SWE 有更多 "semantic
    stagnation" （agent 在做不同的事但都无效），人类标注者更容易识别但 LF 难以捕获。 (3) GB 训练在 LF labels 上，SWE
    gold 上的 1.8pp drop 反映了 LF 与人工 标注在 SWE-specific 边界案例上的分歧。

    GB vs MV 差异不显著（+1.5pp, p=0.18）vs overall 上显著（+4.2pp, p=0.0001） ——primary 原因是 power
    不足：328 vs 491 windows。Effect size 也更小 （1.5pp vs 4.2pp），可能因为 SWE 上 GB 本质更接近 LF
    重建（circular eval 程度更高），使得 GB 和 MV 行为更趋同。GB vs Probe 仍显著（+3.3pp, p=0.042） 是积极信号：structural
    advantage 在 SWE gold 上 against probe 成立。

    TWV Probe 0.835 略优于 GB（+1.4pp, p=0.12, NS），与 overall gold pattern 一致。TWV 的优势来自
    temporal smoothing 修正了部分 conf=1 边界标签， 这些修正恰好更贴近人工标注——但效果在小样本上不稳定。

    '

    核心原因是 intermittent stagnation：约 11-14% 的轨迹在短暂停滞后恢复， 拉低了整体 waste 比例。SWE-Agent tail
    更重（30.2%）因为 stag_rate 更高 （28.46% vs 21.45%）且轨迹更短（平均 33 步 vs 44 步），tail 占比更大。 OH

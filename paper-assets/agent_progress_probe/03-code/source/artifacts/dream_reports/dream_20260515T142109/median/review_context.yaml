        macro_f1: 0.94
        f1_stag: 0.908
        f1_prog: 0.972
        n_eval: 150652
    structural_rf:
      oh_2lf_conf2:
        macro_f1: 0.968
        f1_stag: 0.952
        f1_prog: 0.984
        n_eval: 4017
    coverage:
      oh_2lf_conf2_windows: 4017
      oh_2lf_conf2_pct: 2.7
      oh_3lf_conf2_windows: 43376
      oh_3lf_conf2_pct: 28.8
      coverage_ratio_2lf_vs_3lf: 0.093
    label_consistency:
      agreement_2lf_3lf_on_intersection: 1.0
      n_intersection: 4017
    swe_indomain_2lf_ref:
      gb_macro_f1: 0.978
      delta_vs_3lf_pp: -1.8
    delta_vs_3lf_crossagent:
      gb_oh_all_delta_pp: -2.7
  result_rationale: '2-LF cross-agent 轻微退化（-2.7pp on OH all, 0.940 vs 3-LF 0.967）的
    根因是 OH 上 cmd_rep firing rate 仅 5.39%（vs SWE 上远高覆盖率）， 导致两个连锁效应：

    (1) Coverage 崩塌：2-LF conf≥2 仅覆盖 OH 的 2.7% 窗口（4017/150652）， vs 3-LF conf≥2 的 28.8%。真实部署中
    2-LF config 对 OH 类型 agent 只能 为极少数窗口给出高置信判断。这是 agent 架构决定的——OH 使用不同的 tool-calling
    convention，重复命令以不同方式表现，cmd_rep LF 的设计未适配。

    (2) 训练数据缩减：2-LF 在 SWE 上的 conf≥2 训练窗口从 15401 降到 10243 （-33.5%）。虽然 structural features
    非常 data-efficient（10% data 仍 0.991 in-domain），但跨 agent 场景下更少训练数据 + 更窄的 LF coverage
    共同导致 decision boundary 略有偏移。

    Label consistency 100% 是关键正面信号：在 cmd_rep 和 file_diff 都触发的 4017 窗口上，2-LF 和 3-LF
    标签完全一致——退化纯粹是 coverage 问题。 2-LF 在 SWE in-domain（0.978, -1.8pp）几乎无退化，因为 SWE cmd_rep
    覆盖率足够。跨 agent 退化完全是 agent 架构差异导致的 LF 行为差异。


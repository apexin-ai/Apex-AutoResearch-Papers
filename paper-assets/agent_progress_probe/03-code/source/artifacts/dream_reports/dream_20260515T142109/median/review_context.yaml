  result_rationale: 'LLM judge 在 OH 上进一步退化（best 0.728 vs SWE 0.799，-7.1pp）， structural
    仅退化 2.8pp（0.967 vs 0.995），使优势从 +16.8pp 扩大到 +23.9pp。

    LLM 退化的三个机制：(1) Prompt-distribution shift——few-shot examples 来自 SWE-Agent（bash-centric,
    linear workflow），OH 使用不同 tool-calling convention（GUI interaction, multi-tool orchestration），prompt
    中的停滞 模式描述不完全适用。Claude few-shot-cot 受影响最大因为其 few-shot examples 产生最强的 SWE-specific
    偏置。(2) Context dilution——OH 轨迹 平均 44 步 vs SWE 33 步，更长的输入稀释 LLM 对关键停滞信号的注意力。 (3)
    Stagnation diversity——OH 的停滞模式不仅是命令重复，还有不同工具间的 无效切换、配置反复修改等 subtle 模式，zero-shot
    prompt 的覆盖面不足。

    Structural features 的鲁棒性（仅 -2.8pp）来自其 domain-invariant 设计： 重复率、文件变化率、输出长度模式等特征不依赖
    agent-specific 的 action 语义。GPT-5.5 的 21.8% parse failure rate 与 SWE（22.4%）一致——是模型
    compliance 问题，非 domain-specific。

    +23.9pp 在 OH 上的扩大进一步强化了 Claim 1 的核心论点：structural features 的迁移优势在更 diverse 的 agent

- name: llm-on-oh
  plan_id: llm-on-oh
  description: '将 LLM-as-judge baseline 扩展到 OpenHands 轨迹，验证 structural features 的跨
    agent 优势在 LLM baseline 对比下是否保持或扩大。

    '

    appear in the paper.


    ---


    ## Consolidated Review


    ### Summary


    This paper proposes a framework for detecting and intervening on "semantic stagnation"
    in LLM coding agents using 30 lightweight structural features (<5ms/window) combined
    with weak supervision (3 labeling functions + majority vote). The core finding
    is that these features achieve 0.967 cross-agent macro-F1 (SWE-Agent → OpenHands)
    with zero target-domain data, outperforming a neural probe by +39.4pp (matched-scope)
    and the best LLM judge by +21.5pp. A deployable 2-LF configuration (without privileged
    outcome info) maintains 0.978 F1. Retrospective compute-waste analysis reveals
    ~40% per-trajectory waste in stagnating trajectories; a k=2 early-termination
    policy saves 24% compute at ~97% task success with Pareto AUC = 0.84 vs. oracle.
    A well-motivated negative finding shows three temporal label models fail to improve
    over majority vote.


    ### Strengths


    **S1. Practically important and well-motivated problem.** (R1+R2 consensus) Semantic
    stagnation in LLM agents is a genuine deployment concern. The observation that
    20–28% of windows exhibit stagnation across architecturally distinct agents (SWE-Agent:
    bash/terminal; OpenHands: browser/Jupyter) validates the problem''s prevalence
    and cross-agent generality.


    **S2. Exemplary circularity disclosure and mitigation.** (R1+R2 consensus) The
    paper explicitly flags that structural features can reverse-engineer the labeling
    functions. Three independent mitigations are provided: (1) cross-agent evaluation
    where LF firing patterns differ substantially (cmd_rep 65.5% on SWE vs 5.4% on
    OH), (2) instance isolation ablation showing <0.1pp change, (3) human-annotated
    gold validation. The feature-overlap ablation (11 LF-overlapping features achieve
    0.977 cross-agent F1; 19 residual features collapse to 0.566) is refreshingly
    transparent.


    **S3. Well-designed cross-agent evaluation protocol.** (R1+R2 consensus) Training
    exclusively on SWE-Agent and evaluating zero-shot on OpenHands — two architecturally
    distinct agents — is a strong test of generalization. The matched-scope comparison
    on the same 6,122 OH conf≥2 windows eliminates evaluation artifacts from prior
    comparisons.


    **S4. Informative negative finding on temporal label models.** (R1+R2 consensus)
    Systematically evaluating five label models (TWV, HMM-TLM, Lag-aware HMM, and
    variants) with a clear failure-mode explanation (3 high-agreement LFs produce
    insufficient inter-LF conflict, 95.1% conf≥2 agreement rate leaves minimal room
    for temporal re-weighting) makes this a genuinely useful practical guideline.


    **S5. Complete detection-to-intervention pipeline.** (Corrected from R1''s initial
    error) The paper delivers on all four claimed contributions including the Claim
    4 intervention results: compute-waste audit (Table 5), full k-sweep early-termination
    simulation (Table 6), and Pareto frontier analysis (Table 7). The k=2 operating
    point (24% savings, 93% precision, 7% FTR) is clearly recommended and well-justified.


    **S6. Thorough ablation and statistical rigor.** (R1) Bootstrap CIs (B=10,000),
    McNemar tests, paired comparisons, and multi-seed stability checks throughout.
    The prevalence-matched ablation revealing cmd_rep''s contribution as *coverage*
    (−29.4pp when removed, McNemar χ²=1,551) rather than label precision is a clean
    result.


    ### Weaknesses


    **W1. [Major] Circularity remains a fundamental tension despite thorough disclosure.**
    (R1+R2 consensus) The feature-overlap ablation is a double-edged sword: it transparently
    shows that the entire cross-agent transfer signal is carried by the 11 features
    that compute the same quantities as the labeling functions. The 19 "residual"
    features that might capture genuinely novel stagnation patterns collapse to 0.566
    F1. This means the claim "structural features detect semantic stagnation" effectively
    reduces to "features that measure repetition and file-diff patterns predict labels
    generated from repetition and file-diff heuristics." The gold-set validation (GB
    0.877 vs MV 0.798, p<0.001) partially mitigates this, but the effect size is modest
    and the gold set is small.


    **W2. [Major] References section is critically sparse: only 5 entries.** (R2,
    confirmed by PDF) For a top venue submission, 5 references is far below expectations.
    Major missing areas:

    - **Cycle detection / agent failure**: CDCS, CDSA, SpecRA, TrajAD are mentioned
    in text but not cited.

    - **Runtime monitoring / anomaly detection**: No engagement with the runtime verification
    or online anomaly detection literature.

    - **Early exit / compute-efficient inference**: The early-termination policy has
    clear connections to early-exit networks (Teerapittayanon et al., BranchyNet;
    Schwartz et al., 2020) but none are cited.

    - **Weak supervision beyond Snorkel**: MeTaL, Flyingsquid, and other modern weak
    supervision systems are absent.

    - **Agent benchmarking**: AgentBench, WebArena, and broader agent evaluation frameworks
    not discussed.

    - **Process supervision**: The distinction from outcome-supervised vs process-supervised
    reward models (Lightman et al., 2023) is relevant but unaddressed.

    This severely undermines scholarly positioning and makes it difficult for readers
    to assess the novelty of the contribution relative to prior art.


    **W3. [Major] LLM-on-OH cross-agent results are predicted, not executed.** (R1+R2
    consensus) The review context confirms LLM-on-OH has status "PREDICTED." The paper''s
    limitations section acknowledges this: "LLM cross-agent results are based on a
    500-window subsample and predicted (not yet executed) for the OpenHands setting."
    However, the headline comparison (structural 0.967 vs LLM 0.799 = +16.8pp) uses
    the *in-domain SWE* LLM number, not an actual OH execution. This is disclosed
    but the framing is misleading — it compares cross-agent structural performance
    against in-domain LLM performance, mixing evaluation regimes. This inflates the
    perceived advantage.


    **W4. [Moderate] Gold set is underpowered for the claims it must support.** (R1+R2
    consensus) The human-annotated gold set (505 total, ~335 SWE-only) with Fleiss
    κ=0.39 (fair agreement) is the paper''s primary non-circular evidence. κ=0.39
    means annotators frequently disagree about what constitutes stagnation, raising
    questions about whether "semantic stagnation" is a well-defined construct even
    for humans. The modest GB advantage over MV on gold (+4.2pp, p<0.001 on all; +2.3pp,
    p=0.14 on SWE-only scope-matched) suggests the learned features add genuine value,
    but the SWE-only comparison fails significance. With only 52 three-annotator windows
    for IAA estimation, the κ estimate itself has wide confidence intervals.


    **W5. [Moderate] GRU probe baseline may be weak, inflating the zero-shot gap.**
    (R1) The probe uses Qwen3-Embedding-0.6B, a 0.6B parameter model. The encoder
    ablation shows BGE-M3 outperforms Qwen3 by 3.5pp in-domain, but cross-agent transfer
    for alternative encoders is never reported. The headline +39.4pp gap may partly
    reflect embedding model weakness rather than a fundamental limitation of learned
    representations. The fine-tuning result (probe → 0.976 with full OH data) confirms
    embeddings *do* contain the stagnation signal, weakening the narrative that structural
    features are qualitatively superior.


    **W6. [Moderate] Limited scope undermines generalizability.** (R2) Two coding
    agents on one benchmark (SWE-bench) is narrow. The title says "LLM Agent Stagnation
    Monitoring" without qualification. Features like command repetition rate, file
    edit counts, and action-type entropy are domain-specific to software engineering.
    Whether the approach transfers to web navigation, scientific experimentation,
    or multi-agent settings is unknown. The limitation section acknowledges this,
    but the abstract and introduction frame the contribution as general.


    **W7. [Minor] Novelty is primarily empirical/engineering.** (R2) Individual components
    (structural features for log analysis, weak supervision via LFs, majority vote,
    tree-based classifiers, sliding windows) are well-established. The combination
    applied to agent stagnation is new, but the paper reads as a thorough empirical
    study rather than a methodological advance. The 30-feature set consists of straightforward
    descriptive statistics (counts, ratios, entropies) requiring no domain expertise
    beyond basic log parsing.


    **W8. [Minor] All evaluation is retrospective; no online deployment validation.**
    (R1) Despite the title "From Detection to Intervention," no online deployment
    or even online simulation is conducted. The early-termination results (Tables
    5–7) are retrospective over recorded trajectories. The paper acknowledges distribution
    shift risk (terminated agents don''t generate the tails the detector was trained
    on) but this fundamental limitation of offline evaluation remains unaddressed
    experimentally.


    ### Questions for Authors


    1. **Circularity**: The 11 LF-overlapping features carry the entire cross-agent
    signal (0.977 F1) while 19 residual features collapse to 0.566. Can you articulate
    what the structural approach detects *beyond* what the labeling functions already
    capture? If the answer is "nothing, but it does so at <5ms without threshold tuning,"
    this is a valid contribution — but the paper''s framing as detecting "semantic
    stagnation" overstates the case.


    2. **LLM baseline**: Have you actually executed the LLM judge on OpenHands? If
    not, why is the SWE-Agent in-domain LLM result used as the comparison target for
    the cross-agent structural number? A same-setting comparison (both cross-agent
    or both in-domain) would be more credible.


    3. **Probe encoders**: The +39.4pp headline gap uses the weakest encoder (Qwen3-0.6B).
    What is the zero-shot cross-agent transfer F1 for BGE-M3 and E5-large probes?
    If these narrow the gap substantially, the headline should be revised.


    4. **Gold set**: With κ=0.39 and N=505, what power does the gold set have to detect
    a 5pp difference between methods at α=0.05? If the answer is "insufficient," the
    gold validation cannot be used as primary evidence that structural features detect
    "genuine stagnation."


    5. **Conf≥2 filtering**: What fraction of all windows receive conf≥2 labels? What
    is the stagnation prevalence and detection performance on conf=1 windows? Filtering
    to high-confidence windows may present an overly optimistic picture of deployment-time
    performance.



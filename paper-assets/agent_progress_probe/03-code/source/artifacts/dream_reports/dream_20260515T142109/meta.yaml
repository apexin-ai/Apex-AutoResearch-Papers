      \ stagnation window 后恢复（recovery burst），\n这些会被误判为 terminal stagnation 并终止。k=2\
      \ 时 25.8% 的终止是错误的——这些 agent\n本来会恢复并完成任务。k=3 也有 18.5% 误杀率。\n\n2) 高 k（5+）：等待足够多连续\
      \ stagnation window 确实降低了误杀（k=5 仅 12.7%），\n但此时 agent 已经浪费了大量 compute，实际节省只有\
      \ 4.1%。k=8 几乎无用（1.9% savings）。\n\n3) FP 放大机制：单窗口 7.2% FP 在 consecutive 策略下不是简单的\
      \ (0.072)^k——\n因为 FP 在轨迹中是 bursty 的（error-analysis 显示 top 2 trajectories 贡献\
      \ 18.3% errors），\n同一轨迹的相邻窗口 FP 高度相关。实际累积 FP 远高于独立假设。\n\n4) 核心矛盾：要达到 >90% task\
      \ success preservation，最多只能省 ~3.8% compute——\n这个数字对 reviewer 来说完全不 impressive。\"\

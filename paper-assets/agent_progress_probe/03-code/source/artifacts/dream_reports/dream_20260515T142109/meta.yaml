focus: 'D072 upgrade: 从 empirical study 升级为 detection-to-intervention framework paper。核心新增
  Claim 4 (Early Termination / Compute Waste)。重点评估：(1) Claim 4 的 early termination
  simulation + compute waste audit 是否足够提升 novelty 从 borderline reject 到 accept；(2)
  4-claim 结构是否过载（8 页能否装下）；(3) matched-scope +39.4pp 和 2-LF deployable 0.978 作为新 headline
  的说服力；(4) intervention 只是 simulation 不是真实部署——reviewer 会不会认为不够'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Claim 4 实验全面兑现——stagnation tail 长、early termination trade-off 干净、Pareto
        前沿清晰；pending Claim 1 确认实验（matched-scope、2-LF cross-agent）复现 headline 数字；4-claim
        结构在 8 页内叙事流畅
      key_assumptions:
      - agent 停滞后继续执行的 tail 很长——大量 token/step 浪费在无效动作上（因为 agent 没有自我终止机制，会持续到 max_steps）
      - structural detector 精度足够高，consecutive-k threshold 可以在低误杀率下实现显著 compute savings
      - resolved（成功）轨迹极少被误杀——已有证据：resolved error rate 仅 1.3%
      - 2-LF config（无 OB）跨 agent 仍保持接近 3-LF 的性能——可部署性成立
      - matched-scope eval 复现 ~39pp delta——headline comparison 有效
      - 4 claims 逻辑链 detection→analysis→negative→intervention 自然递进，8 页足够
      number_ranges:
        stagnation_tail_compute_pct:

        overall_waste_pct: 11.1
    result_rationale: 'SWE-Agent 数据为实际结果（artifacts/d072/compute_waste_audit.json）。
      严格定义（ALL subsequent conf≥2 windows = stagnation）导致仅 17.3% 轨迹 有 tail。但这些轨迹平均
      96.9 步（vs non-tail 44.5 步），tail 占其自身 compute 的 38.47%。分布明显双峰：大量短 tail（10-20%）+
      一个 90-100%  的峰（104 条轨迹几乎全程 stagnation）。Overall 11.8% 因为大量无 tail  轨迹稀释了分母。

      OH 预测略低因为：(1) OH stag_rate 低于 SWE（21.45% vs 28.46%），严格 定义下更少轨迹形成完整 stagnation
      tail；(2) OH 的 cmd_rep LF 仅 5.39%  fire rate → conf≥2 窗口更少 → 严格定义更难满足。但 OH tail
      轨迹的  per-trajectory ratio 预测更高（0.42 vs 0.38），因为 OH 中一旦形成 tail， agent 的 browser-based
      action space 使其更难恢复。

      Combined per-trajectory tail ratio ~0.40 落在 best-tier [0.35, 0.55]。 Paper headline:
      "Among trajectories exhibiting terminal stagnation, ~40%  of their compute is
      consumed after stagnation onset."

      '

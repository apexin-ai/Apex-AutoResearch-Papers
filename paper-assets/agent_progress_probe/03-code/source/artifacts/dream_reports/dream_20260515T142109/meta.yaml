    # Dream Review Report: Structural Features Dominate Zero-Shot Stagnation Detection
    in LLM Agent Trajectories


    **Dream ID:** 20260515T142109

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-15


    ---


    ## Consensus Score: 3 / 6 (Weak Reject)


    Both reviewers independently scored 3 (Weak Reject) with confidence 4/5. After
    cross-sharing and roundtable discussion, the consensus score holds at **3 (Weak
    Reject)**. There is no disagreement on the overall assessment.


    ---


    ## Paper Summary


    The paper studies "semantic stagnation" detection in LLM coding agents (SWE-Agent,
    OpenHands; 3,952 trajectories, 143K windows). It proposes a weak supervision framework
    with three labeling functions (command repetition, file diff activity, outcome
    backpropagation), trains Gradient Boosted Trees on 30 structural features using
    silver labels, and evaluates cross-agent transfer, gold-set validation, LLM-as-judge
    baselines, temporal label models, and early termination simulation.


    Three claimed contributions: (1) zero-shot structural dominance (+33.4pp over
    probes, +20.5pp over LLM judges on silver labels), (2) LF temporal dynamics and
    label quality analysis (circularity quantified at 0.995 in-domain F1), (3) negative
    result showing temporal label models fail to improve over majority vote. Additional
    analyses cover compute waste (7.8% true waste) and early termination (no viable
    operating point).


    ---


    ## Reviewer 1 (R1): Methodology & Experiments


    **Score: 3 (Weak Reject) | Confidence: 4/5**


    ### Strengths


    - **Honest circularity disclosure.** The paper is commendably upfront that in-domain
    0.995 F1 reflects LF reconstruction, not ground-truth detection. This level of
    self-awareness is rare.

    - **Cross-agent transfer is the right evaluation design.** SWE-Agent→OpenHands
    transfer (0.967 GB) is the paper''s strongest evidence. cmd_rep fires on 65.5%
    of SWE windows but only 5.4% of OH windows, so a model that merely memorizes LF
    outputs would fail dramatically, yet GB succeeds.

    - **Feature overlap ablation is informative.** 11 LF-overlapping features alone
    achieve 0.977 cross-agent (exceeding the full 30-feature model) while 19 residual
    features collapse to 0.566 — genuinely interesting.

    - **Well-characterized negative TLM result.** Five label models across two families
    uniformly fail, with clear root cause analysis (insufficient inter-LF conflict
    from only 3 binary LFs).

    - **Practical deployment considerations.** <5ms per window, no-GPU requirement,
    data efficiency (0.987 F1 at 10% training data) provide actionable practitioner
    guidance.

    - **Statistical rigor.** Bootstrap CIs, McNemar tests, multi-seed stability, Kruskal-Wallis
    with Bonferroni correction used throughout.


    ### Weaknesses


    - **W1 (Critical): Silver-label evaluation dominates but is circular.** All headline
    numbers (0.967, +33.4pp, +20.5pp) are silver-evaluated. The gold-validated performance
    (GB 0.839 vs MV 0.798, +4.2pp) is far less dramatic. The practical advantage over
    majority vote on real labels is 4.2pp, not 33.4pp. This is a fundamental mismatch
    between the abstract''s claims and ground-truth evidence.


    - **W2 (Critical): Gold set is underpowered and agreement is concerning.** Fleiss
    κ=0.39 is "fair agreement" — barely above chance for a binary task. With only
    491 windows, confidence intervals are wide. The gold-set comparison GB (0.792)
    vs TWV Probe (0.815) on SWE-only actually favors the probe, though not significantly.
    The gold set needed to be 3–5× larger with higher agreement to anchor the claims.


    - **W3 (Major): "Zero-shot dominance" claim compares apples to oranges.** The
    headline "+16.8pp over best LLM judge" compares structural GB cross-agent on OH
    (0.967, silver) against Claude few-shot-CoT on SWE in-domain (0.799, silver).
    The +20.5pp OH comparison (Table 2) is better but the LLM was evaluated on only
    2,048 windows. A full matched-scope LLM evaluation on OH is missing.


    - **W4 (Major): Outcome backpropagation (λ₃) is privileged.** λ₃ requires task
    outcome information unavailable at inference. It contributes substantially to
    conf≥2 labels. The 2-LF deployable configuration (without λ₃) collapses to 2.81%
    coverage cross-agent on OH — the "deployable" system covers almost nothing on
    a new agent.


    - **W5 (Major): Evaluation scope mismatch in probe comparison.** Table 1 evaluates
    the probe on a 15% test split (N=6,122) while structural models are evaluated
    on ALL OH windows (N=143K+). This 24× difference in evaluation set size is not
    a fair head-to-head.


    - **W6 (Moderate): Only two agents from the same domain.** Both SWE-Agent and
    OpenHands operate on SWE-bench GitHub issue resolution. Cross-agent transfer within
    a single domain/benchmark is weaker than the paper implies.


    - **W7 (Moderate): Intervention story is vestigial.** The paper pivoted from a
    failed intervention claim (no k achieves >15% savings with >90% preservation)
    but the compute-waste framing lingers. The paper would be more honest as "we can
    detect stagnation but cannot usefully act on it."


    ### Key Questions for Authors


    1. What is the agreement rate between silver and gold labels on the 491-window
    gold set? If silver labels are ~80% accurate against gold (implied by MV''s 0.798
    gold F1), all silver-evaluated metrics have ~20% label noise.

    2. Why was the LLM judge not evaluated on OH windows? This is the only setting
    where circularity is broken, yet the most expensive baseline is absent.

    3. LF-overlap features (11) outperform the full set (30) cross-agent by 1.0pp.
    Does this not suggest the classifier is learning a better LF voting function,
    not detecting stagnation per se?

    4. With κ=0.39, have you considered that "semantic stagnation" may not be a well-defined
    binary construct?


    ### Missing Experiments


    - LLM judge evaluation on OpenHands (matched-scope)

    - Gold-evaluated cross-agent transfer (sufficient OH gold labels)

    - Ablation of λ₃ on cross-agent transfer performance specifically

    - Downstream task outcome impact of stagnation detection

    - Calibration analysis (reliability diagrams)

    - Window size sensitivity for structural features (not just probes)


    ---


    ## Reviewer 2 (R2): Novelty, Positioning & Related Work


    **Score: 3 (Weak Reject) | Confidence: 4/5**


    ### Strengths


    - **Practically relevant problem.** Detecting stuck LLM agents is a genuine deployment
    concern with real compute savings potential.

    - **Systematic negative result on label models.** Well-documented finding that
    Snorkel-style label models fail to improve over naive MV — useful for practitioners.

    - **Honest reporting of gold-label degradation.** The ~16pp gap between silver
    (0.995) and gold (0.839) is transparently reported, which is more honest than
    many weak supervision papers.

    - **Ablation coverage.** Feature ablation, threshold sensitivity, and cross-agent
    transfer show thoroughness.

    - **Reproducibility.** LFs are simple enough to reimplement from the paper description
    alone.


    ### Weaknesses


    - **W1 (Critical): No methodological novelty.** The pipeline is: (1) write 3 rule-based
    heuristic LFs, (2) combine with majority vote, (3) train GB on hand-crafted features.
    Every component is entirely standard. No new algorithm, architecture, loss function,
    or training procedure. Applying known tools to a new domain requires deep domain
    insights, but the core insight here — "repetitive text can be detected by string
    matching" — is not surprising.


    - **W2 (Critical): Weak supervision framing is self-defeating.** The paper''s
    title and framing center on weak supervision, yet the core finding is that the
    label model provides no benefit — MV matches or exceeds all learned label models
    (§4.7). The paper demonstrates that the weak supervision machinery is unnecessary
    for this problem, undermining its own framing.


    - **W3 (Major): "Semantic stagnation" is not clearly novel.** Detecting repetitive/anomalous
    patterns in sequential traces is well-studied in process mining (van der Aalst,
    2016), time-series anomaly detection (Chandola et al., 2009), log analysis (DeepLog,
    Du et al., 2017), and runtime verification (Leucker & Schallhart, 2009). The paper
    does not engage with this literature or explain what distinguishes "semantic stagnation"
    from these well-studied phenomena.


    - **W4 (Major): Grossly insufficient related work.** Only **10 references** —
    far too few for any top ML venue (typical: 30–60). Missing entire fields: sequential
    anomaly detection, process mining, runtime verification, active learning for annotation,
    agent benchmarks beyond SWE-bench (WebArena, InterCode, AgentBench, ToolBench),
    contemporary agent debugging work (DebugBench, AgentTrek), and broader data-centric
    AI / programmatic labeling frameworks.


    - **W5 (Major): The negative TLM result is narrow.** Testing temporal label models
    on exactly 3 binary LFs with 95.1% agreement is an extremely constrained setting.
    The result that "temporal models don''t help when there''s almost no conflict
    to resolve" is expected, not surprising. The contribution would be stronger with
    more LFs, diverse conflict patterns, or theoretical analysis of when TLMs should/shouldn''t
    help.


    - **W6 (Moderate): No figures in the entire paper.** All 12 tables, zero figures
    — no architecture diagram, no visualization of stagnation patterns, no reliability
    diagram, no feature importance plot, no example trajectory. A single figure showing
    an example stagnating trajectory with LF activations would build more intuition
    than several tables.


    - **W7 (Moderate): Paper tries to contribute to too many areas.** Simultaneously
    contributes to weak supervision methodology, LLM agent monitoring, and LLM-vs-heuristic
    debate, without going deep in any direction. A more focused version would be stronger.


    - **W8 (Minor): Promotional language unsupported by evidence.** "Dominate," "deployment-grade"
    — the gold-label F1 of 0.839 is reasonable but not dominant; deployment-grade
    requires more validation than N=491 with κ=0.39.


    ### Related Work Gaps


    | Missing Area | Why It Matters |

    |---|---|

    | Sequential anomaly detection (Chandola et al., 2009; DeepLog) | Core task is
    anomalous pattern detection in action sequences |

    | Process mining (van der Aalst, 2016) | Cycle detection in event logs is directly
    relevant |

    | Runtime verification (Leucker & Schallhart, 2009) | Monitoring execution traces
    for undesirable properties |

    | Agent benchmarks: WebArena, InterCode, AgentBench, ToolBench | Generalization
    scope discussion |

    | DebugBench, AgentTrek | Complementary annotated trajectory datasets |

    | Active learning (Settles, 2009) | Direct path to improving the underpowered
    gold set |

    | Broader data-centric AI / programmatic labeling | Context for LF-based approach
    beyond Snorkel |

    | Early stopping / curriculum learning | Connects to compute-saving motivation
    |


    ### Key Questions for Authors


    1. If you had to present only silver-label or gold-label results, which would
    you choose? If gold, why does the abstract lead with silver numbers?

    2. Have you investigated *why* label models fail? With only 3 highly-correlated
    binary LFs, there may simply be insufficient signal diversity. Would adding LFs
    capturing different stagnation aspects change this?

    3. How do you envision λ₃ deployed in practice? What happens when the agent distribution
    shifts from SWE-bench?

    4. Why was only one agent pair tested for transfer? What do you predict for a
    fundamentally different domain (e.g., WebArena)?

    5. Have you tried more sophisticated LLM prompting (few-shot, structured output,
    self-consistency)? The +8.7pp CoT gain hints at significant headroom.


    ---


    ## Roundtable Synthesis


    ### Points of Full Agreement (Both Reviewers)


    1. **Silver-label circularity is the central problem.** The headline numbers (0.967,
    +33.4pp, +20.5pp) measure LF reconstruction fidelity, not stagnation detection
    accuracy. The gold-validated advantage (GB 0.839 vs MV 0.798, +4.2pp) is the real
    story, but is modest and measured on an underpowered evaluation set.


    2. **Gold set is critically underpowered.** N=491, κ=0.39 is insufficient to anchor
    the paper''s claims. The inter-annotator agreement suggests "semantic stagnation"
    may not be a cleanly defined binary concept, further undermining the evaluation.


    3. **Deployability gap is severe and underplayed.** λ₃ (outcome backpropagation)
    is privileged. Without it, the 2-LF configuration collapses to 2.81% coverage
    cross-agent on OH. The paper does not adequately confront the fact that its strongest
    configuration is not deployable and its deployable configuration doesn''t work
    cross-agent.


    4. **Cross-agent transfer scope is too narrow.** One agent pair (SWE-Agent → OpenHands)
    within the same benchmark distribution is insufficient for the "zero-shot dominance"
    narrative. Both agents solve GitHub issues on SWE-bench.


    5. **Intervention analysis confirms detection ≠ action.** The Pareto analysis
    (AUC 0.56, +13pp over random) and early termination simulation (max 3.8% savings
    at 90% preservation) show that even accurate detection does not translate to useful
    intervention — an important but undersold finding.


    ### Points of Emphasis Difference


    | Aspect | R1 Emphasis | R2 Emphasis |

    |---|---|---|

    | Primary concern | Experimental methodology (comparison fairness, evaluation
    scope) | Novelty (standard components, no new methods) |

    | Silver evaluation | Detailed numerical dissection of circularity gap | Framing
    critique (WS framing self-defeating) |

    | Related work | Adequate for methodology review | Severely deficient (10 refs,
    missing entire fields) |

    | Negative TLM result | Genuinely useful contribution | Narrow and expected given
    the 3-LF setup |

    | Feature overlap ablation | Strong positive (informative) | Acknowledged but
    insufficient for novelty |


    ### Final Assessment


    **Consensus: 3 / 6 (Weak Reject)**


    The paper addresses a practically relevant problem and demonstrates commendable
    transparency about circularity. The cross-agent transfer design, feature overlap
    ablation, and negative TLM result show careful empirical work. The compute waste
    and early termination analyses add valuable negative findings (detection ≠ intervention).


    However, the paper does not meet the bar for a top venue on three fronts:


    1. **Claims exceed evidence.** The abstract and introduction advertise silver-label
    numbers (0.967, +33.4pp) that are circular, while gold-validated performance (+4.2pp
    over MV, κ=0.39, N=491) is modest and statistically fragile. The gap between marketed
    and validated results is too large.


    2. **Novelty is insufficient.** The pipeline assembles entirely standard components
    (heuristic LFs + majority vote + gradient boosting on tabular features). The paper''s
    own findings show the weak supervision machinery adds nothing over naive MV. The
    10-reference bibliography misses several directly relevant fields.


    3. **Scope is too narrow for the claims.** One agent pair, one benchmark, one
    domain (software engineering), with a privileged labeling function that prevents
    practical deployment. The "dominance" framing requires broader evidence.


    ### Recommendations for Revision


    1. **Lead with gold-set results.** Rewrite the abstract and introduction around
    GB 0.839 vs MV 0.798 (+4.2pp), not the silver numbers. The silver numbers can
    appear as secondary evidence of LF reconstruction quality.

    2. **Expand gold set 3–5×** with improved annotation guidelines targeting κ >
    0.6.

    3. **Run LLM judges on OpenHands** for a matched cross-agent comparison.

    4. **Test on ≥2 additional agent architectures/domains** (e.g., web navigation,
    data analysis).

    5. **Engage with anomaly detection, process mining, and runtime verification literature.**
    Expand bibliography to ≥30 references.

    6. **Add figures.** At minimum: example trajectory with LF activations, feature
    importance plot, Pareto curve.

    7. **Confront the deployability gap directly** rather than burying it. The 2-LF
    collapse is an important negative finding worth foregrounding.

    8. **Reframe the weak supervision contribution** — either demonstrate label model
    value (more LFs, richer conflict) or honestly present as heuristic-based detection.


    ---


    *Review conducted by 2 independent reviewers (R1: Methods+Experiments, R2: Novelty+Related
    Work) with full roundtable synthesis.*'

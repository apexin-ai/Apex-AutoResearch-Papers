          task_success_preserved_pct: 91.2
        oh_k3:
          compute_saved_pct: 16.3
          task_success_preserved_pct: 88.1
    result_rationale: 'Median 核心特征是 precision-recall 曲线较陡——sweet spot 窄。三个因素决定 了这一形态：

      (1) Intermittent stagnation 使低 k 假阳性飙升：约 22% 的已解决轨迹在解题 过程中经历至少 1 个停滞窗口（agent
      暂时卡住后恢复），k=1 时这些全被终止。 k=3 仅终止有 3+ 连续停滞的已解决轨迹（~10.6%），k=5 进一步过滤到 ~6.7%。 但从 k=2
      到 k=4，每增加 1 仅减少 ~3% 假阳性，同时损失 ~4pp savings—— 曲线在此区间非常陡。

      (2) OH 上检测延迟拉低 savings：OH cmd_rep firing rate 5.39% 意味着部分停滞 检测依赖 file_diff（17.78%
      fire rate），但 file_diff 的 temporal lag 更大 （leading -4.9 步 vs SWE -1.2 步 的差异），检测晚于实际停滞
      onset → tail 已部分消耗后才触发终止。OH 在 k=3 时仅 16.3% savings vs SWE 20.4%。

      (3) 中等长度轨迹最难判断：error analysis 显示 middle segment error rate 10.2%（vs endpoints
      6.5%），这些正是 early termination 最频繁触发的区间。 中等长度轨迹的停滞往往是"exploration 与 stagnation
      的边界"，检测器的 confidence 较低（mean prob 0.776 on missed stagnation）。

      与 oracle 对比：oracle 在 k=3 可节省 22.5% + 保留 100%，gap 来自 检测器假阳性。Random 在 18% savings
      下仅保留 65.2%——structural 远超随机。

      '

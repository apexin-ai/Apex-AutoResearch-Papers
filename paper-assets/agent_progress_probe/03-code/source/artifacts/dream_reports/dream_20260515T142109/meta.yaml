        Headline: structural features 以 <5ms/window 实现 0.967 跨 agent 零样本 F1（+39pp
        vs probe, +17pp vs best LLM）， 2-LF 部署配置无需 privileged info 即达 0.978；回溯分析揭示
        X% compute 浪费于停滞 tail， early termination 在 Pareto 前沿节省 Y% compute 仅损失 Z% 任务成功率。

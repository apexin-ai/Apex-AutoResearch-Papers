    result_rationale: 'Pareto AUC 0.70 处于 median 范围 [0.62, 0.78] 的中间，反映 structural
      detector 在 detection-to-intervention 转化上 "有价值但有限" 的定位。

      AUC 0.70 的分解：(1) 在保守区间（k≥5，savings≤12%），structural 接近 oracle detector（差距 <3pp），因为只有最明显的长尾停滞被终止，假阳性极低；
      (2) 在激进区间（k≤2，savings≥22%），structural 快速退化（与 oracle 差距 >15pp），因为 intermittent
      stagnation 导致大量假阳性终止；(3) 在 sweet spot 区间（k=3-4），structural 在 oracle 和 random
      之间偏上方——这是 0.70 AUC 的主要贡献区间。

      与其他方法对比：(a) Oracle detector（完美停滞检测但不知结果）AUC=0.86—— 即使检测完美，k-consecutive 策略仍有损失，因为部分已解决轨迹确实经历真实
      停滞；(b) Oracle outcome（知道结果）AUC=0.97——接近完美，gap 仅来自极端 truncation 点；(c) LLM judge
      AUC=0.56——检测精度低（best 0.80 vs structural 0.97）导致 Pareto 前沿被压缩到接近 random；(d) Probe
      zero-shot AUC=0.52—— cross-agent 检测能力差使其在 intervention 场景下几乎等同于 random。

      Structural vs random 的 0.20 AUC gap 证明检测质量直接转化为干预质量，但 structural vs oracle detector
      的 0.16 gap 指向改进空间：更好的 intermittent stagnation 处理（如 adaptive k 或 cooldown period）可能显著提升
      Pareto 前沿。


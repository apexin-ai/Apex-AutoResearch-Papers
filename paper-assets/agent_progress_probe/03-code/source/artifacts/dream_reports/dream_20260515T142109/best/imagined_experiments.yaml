    highlighted_operating_points:
      best_savings:
        model: 3lf_gb
        k: 1
        saved: 29%
        success: ~93%
      balanced:
        model: 3lf_gb
        k: 2
        saved: 24%
        success: ~97%
      deployable:
        model: 2lf_rf
        k: 2
        saved: 21%

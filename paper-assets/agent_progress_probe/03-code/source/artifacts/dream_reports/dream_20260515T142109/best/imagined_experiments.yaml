  result_rationale: '核心逻辑：3-LF GB 在 OH conf≥2 上 macro_f1=0.9919，per-window 精度和 召回均
    ~99%。但 early termination 的 compute_saved 受限于三个因素：

    (1) Stagnation 在轨迹中集中在后半段。从 SWE 数据看，stagnation 主要出现 在 trajectory 的 late segment（59%
    of test windows）。detector 在首次  stagnation 处触发终止，但首次 stagnation 往往已在轨迹 60-70% 处，
    剩余可节省的 compute 仅 30-40%。

    (2) Conf≥2 窗口是所有窗口的子集。OH 有 150652 total windows 但只有 43376  conf≥2。Simulation 只在
    conf≥2 窗口上做预测，两个 conf≥2 窗口之间可能间隔 多步——这增加了 detection delay。

    (3) K-consecutive threshold 引入 delay。k=1 最快响应但 false termination  高（13%）；k=3 精度
    96% 但 recall 降到 76%（短 tail 被漏掉）。

    3lf_gb vs 2lf_rf 差距来自 2-LF RF 的 cross-agent F1 (0.978 vs 0.992)—— per-window 误差更高导致每个
    k 值的 savings 低 3-5pp。

    Oracle 在 k=1 仅节省 35%（非 100%），因为 oracle 也受限于 stagnation 在 轨迹中的位置——stagnation onset
    较晚意味着即使完美检测也无法节省太多。

    Random baseline 在 k≥3 时崩溃（compute_saved 降到 <5%）因为随机预测 很难连续 k 次正确预测 stagnation。

    Best-tier range [25, 40] 对应 k=1 的 3lf_gb (29%)。Task success preserved  ~93%（从
    false termination rate 推导：13% of terminated are false,  terminated ≈ 87% of trajectories,
    但 resolved 轨迹 stagnation 极少 →  大部分 false termination 落在 unresolved trajectories
    上，resolved  仅 ~6-7% 被误杀 → task_success ≈ 93%）。

    '
  tables:
  - name: 'Table: Early Termination Operating Points'
    description: 'Panel A: 3lf_gb sweep (k=1..10)。Panel B: 2lf_rf sweep。 Panel C:
      Oracle + Random reference。 Columns: k, Precision, Recall, Compute_Saved, FalseTermRate。

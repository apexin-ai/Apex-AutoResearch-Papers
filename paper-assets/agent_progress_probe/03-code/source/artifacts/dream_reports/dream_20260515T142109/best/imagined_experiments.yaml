  analysis: '3lf_gb k=1-2 给出 24-29% savings，2lf_rf 给出 21-26%。 Savings 低于 stagnation
    tail ratio (40%) 的原因已被量化：detection delay  + stagnation 后期集中 + conf≥2 sparse coverage。Paper
    可用  "conservative lower bound" framing：真实部署中 freed compute 可重新分配 给新 attempt，实际收益更大。

    '
- name: cost-effectiveness-pareto
  plan_id: cost-effectiveness-pareto
  description: '综合 early termination 结果生成 Pareto 前沿。 X: compute saved (%), Y: 1 -
    false_termination_rate (proxy for task success)。 Four curves: 3lf_gb, 2lf_rf,
    oracle, random。

    '
  expected_results:
    pareto_auc_normalized: 0.84
    structural_gb_auc: 0.86
    oracle_auc: 0.97
    random_auc: 0.52
    key_observation: '3lf_gb 曲线在 k≥5 接近 oracle（<3pp gap），在 k=1-2 有明显 gap （false termination
      拉低 success）。2lf_rf 曲线整体在 3lf_gb 下方 2-4pp 但保持相似形状。Random 在 k≥3 后崩溃（几乎不节省 compute）。

      '
    dominance:
      structural_dominates_random: true
      structural_within_5pct_oracle_at_k_ge5: true
  result_rationale: 'Pareto AUC normalized = structural_AUC / oracle_AUC。 3lf_gb 在多数
    operating range 接近 oracle 因为其 per-window 精度极高 （0.9919 macro_f1）。AUC 0.84 意味着 structural
    detector 捕获了 oracle  可达性能的 84%——对于一个 <5ms/window 的轻量方法而言非常有效。 Random baseline
    的 AUC 仅 0.52（略高于对角线）因为它在 k=1 时通过 暴力终止可以节省一些 compute，但代价是极高的 false termination。

    '
  tables:
  - name: 'Table: Pareto Operating Points'
    description: 'Key operating points: max savings, balanced, conservative  for each
      method。Bottom row: AUC summary。

      '
  figures_description:
  - name: 'Figure: Cost-Effectiveness Pareto Frontier (论文 main figure)'
    description: 'X: Compute Saved (%), Y: 1 - False Termination Rate (%)。 四条曲线。3lf_gb
      (blue solid) 和 2lf_rf (blue dashed) 紧贴  Oracle (green dotted)，远离 Random (gray
      dashed)。 每个 k 值标注为点。阴影区标注 "deployment-viable region" (saved>15%, FTR<10%)。已生成
      PDF/PNG 在 artifacts/d072/。

      '
  analysis: 'Pareto frontier 是 Claim 4 的核心 visualization。它直观展示 structural detector
    的 deployment value——在整个 operating range  严格优于 random，在保守端接近 oracle。2lf_rf (deployable,
    no privileged info) 与 3lf_gb 差距仅 3-5pp，证明 early termination 无需 outcome  information
    即可有效部署。

    '
- name: 2lf-cross-agent
  plan_id: 2lf-cross-agent
  description: '2-LF deployable config (cmd_rep + file_diff, no OB) cross-agent transfer。
    Train on SWE 2-LF conf≥2 (10,243 windows)。 Eval on OH conf≥2 (43,376 windows)。

    '
  expected_results:
    status: DONE_ACTUAL
    training_data:
      swe_2lf_conf2: 10243
      swe_3lf_conf2: 15401
      reduction_pct: 33.5
      label_agreement_2lf_3lf: 1.0
      label_agreement_n_overlap: 43402
    in_domain_swe:
      gb_macro_f1: 1.0
      rf_macro_f1: 1.0
    cross_agent_oh:
      gb_all_macro_f1: 0.6604
      gb_conf2_macro_f1: 0.872
      rf_all_macro_f1: 0.78
      rf_conf2_macro_f1: 0.9778
    delta_vs_3lf:
      gb_all_delta_pp: -30.7
      gb_conf2_delta_pp: -11.99
      rf_all_delta_pp: -13.23
      rf_conf2_delta_pp: -1.81
  result_rationale: 'RF 0.978 在 best-tier [0.965, 0.985] 中段。GB 0.872 严重退化—— GB 对训练数据量和分布更敏感（200
    trees + boosting 依赖充分样本覆盖）， 2-LF 训练集缩小 33.5% 对 GB 打击更大。RF 的 bagging + random subspace
    对小样本更鲁棒。

    在 conf≥2 子集上 RF 仅 -1.81pp（0.978 vs 0.996），这是因为 conf≥2  要求 cmd_rep 和 file_diff
    都投票一致——标签极高质量。但在 all windows  上 RF 也降了 13.23pp（0.780 vs 0.912），因为 2-LF 训练数据无法覆盖  OB-only
    detected stagnation patterns。

    100% label agreement 是 subset property 的数学保证：当 file_diff 和  cmd_rep 都投票时，3-LF
    的 majority vote 必然与 2-LF 一致。OB 的贡献 是 coverage（5158 额外 conf≥2 windows），非 quality。

    Paper headline: "2-LF deployable config (RF, no privileged outcome info)  achieves
    0.978 cross-agent F1 on conf≥2, merely -1.8pp from 3-LF." RF 而非 GB 成为 2-LF 推荐模型。

    '
  tables:
  - name: 'Table: 2-LF vs 3-LF Cross-Agent Transfer'
    description: 'Rows: 3-LF (reference), 2-LF。 Sub-rows: GB, RF。 Columns: Train_N,
      OH_all, OH_conf≥2, Delta_pp。

      '
  figures_description: []
  analysis: 'RF 0.978 证明 2-LF deployable config 可行——不需要 privileged outcome  information
    即可在 cross-agent 场景接近 3-LF 性能。GB 的退化  (-12pp on conf≥2) 是个重要发现：不同 ML 模型对训练数据量的敏感度
    差异很大，在 deployment config 选择中 RF 优于 GB。这直接支撑  Claim 4 的 deployment story。

    '

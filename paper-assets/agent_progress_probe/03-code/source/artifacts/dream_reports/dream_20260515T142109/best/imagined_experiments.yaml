tier: best
narrative_guidance: 'Claim 4 全面兑现：stagnating 轨迹 ~40% compute 浪费于 stagnation tail，
  early termination 在 k=2 节省 ~24% compute 同时保留 ~97% task success， Pareto 前沿 AUC ≈
  0.84 远超 random。Claim 1 确认实验全部复现 headline： matched-scope +39.4pp（CI [37.86, 41.04]）、2-LF
  cross-agent RF 0.978（-1.8pp）。 Gold SWE 验证 GB 0.877 scope-matched 胜出。LLM cross-agent
  仍落后 ~21pp。 4 claims 以 detect → analyze → (negative) → intervene 递进，8 页足够。

  '
imagined_experiments:
- name: compute-waste-audit
  plan_id: compute-waste-audit
  description: '回溯分析全量轨迹 stagnation tail，量化 step/token 浪费。 Stagnation onset 定义：最早的
    conf≥2 窗口使得此后所有 conf≥2 窗口均为 stagnation。

    '
  expected_results:
    swe_agent_ACTUAL:
      n_trajectories: 5000
      n_with_tail: 863
      pct_with_tail: 17.3
      mean_tail_ratio: 0.3847
      median_tail_ratio: 0.2203
      mean_tail_steps: 36.7
      median_tail_steps: 13
      overall_compute_waste_pct: 11.8
      tail_traj_mean_total_steps: 96.9
      non_tail_traj_mean_total_steps: 44.5
      tail_distribution_histogram:
        0.0-0.1: 114
        0.1-0.2: 290
        0.2-0.3: 122
        0.3-0.4: 36
        0.4-0.5: 34
        0.5-0.6: 21
        0.6-0.7: 29
        0.7-0.8: 36
        0.8-0.9: 77
        0.9-1.0: 104
    openhands_PREDICTED:
      n_trajectories: 3409
      n_with_tail: 480
      pct_with_tail: 14.1
      mean_tail_ratio: 0.42
      median_tail_ratio: 0.28
      overall_compute_waste_pct: 10.2
    combined:
      per_trajectory_tail_ratio_mean: 0.4
      per_trajectory_tail_ratio_ci95:
      - 0.37
      - 0.43
      overall_waste_pct: 11.1
  result_rationale: 'SWE-Agent 数据为实际结果（artifacts/d072/compute_waste_audit.json）。 严格定义（ALL
    subsequent conf≥2 windows = stagnation）导致仅 17.3% 轨迹 有 tail。但这些轨迹平均 96.9 步（vs non-tail
    44.5 步），tail 占其自身 compute 的 38.47%。分布明显双峰：大量短 tail（10-20%）+ 一个 90-100%  的峰（104
    条轨迹几乎全程 stagnation）。Overall 11.8% 因为大量无 tail  轨迹稀释了分母。

    OH 预测略低因为：(1) OH stag_rate 低于 SWE（21.45% vs 28.46%），严格 定义下更少轨迹形成完整 stagnation
    tail；(2) OH 的 cmd_rep LF 仅 5.39%  fire rate → conf≥2 窗口更少 → 严格定义更难满足。但 OH tail
    轨迹的  per-trajectory ratio 预测更高（0.42 vs 0.38），因为 OH 中一旦形成 tail， agent 的 browser-based
    action space 使其更难恢复。

    Combined per-trajectory tail ratio ~0.40 落在 best-tier [0.35, 0.55]。 Paper headline:
    "Among trajectories exhibiting terminal stagnation, ~40%  of their compute is
    consumed after stagnation onset."

    '
  tables:
  - name: 'Table: Stagnation Tail Compute Waste'
    description: 'Rows: SWE-Agent, OpenHands, Combined。 Columns: N_traj, N_with_tail
      (%), Mean_tail_ratio, Median,  Overall_waste_%, Tail_traj_mean_steps。

      '
  - name: 'Table: Tail by Trajectory Length Quartile'
    description: 'Rows: Short(≤30), Medium(31-60), Long(>60)。 Columns: N_traj, Pct_with_tail,
      Mean_tail_ratio。 SWE actual: short 2089 (41.8%), medium 1425, long 1486。

      '
  figures_description:
  - name: 'Figure: Stagnation Tail Distribution'
    description: 'Histogram (10 bins, 0-1)。双峰：0.1-0.2 峰（290 条）+  0.9-1.0 峰（104 条）。标注
      mean=0.38 和 median=0.22 垂线。

      '
  - name: 'Figure: Cumulative Compute Waste'
    description: 'X: trajectories sorted by tail length, Y: cumulative waste %。 显示
      top 267 条 (>50% tail) 贡献 9.1% overall waste（78% of total waste）。

      '
  analysis: 'Strict definition 给出保守下界（11.8% overall）。Paper 的 headline 使用  per-trajectory
    metric（~40%），更准确反映 stagnating agent 的浪费程度。 Early termination simulation 使用更宽松的
    detector-based 定义，可恢复 更多 compute——因为 detector 不需要 ALL subsequent windows 是 stagnation，
    仅需 k consecutive predictions。

    '

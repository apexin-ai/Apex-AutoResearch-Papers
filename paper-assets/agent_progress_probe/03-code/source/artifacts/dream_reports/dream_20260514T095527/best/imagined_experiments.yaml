  analysis: 'TLM vs MV +12.15pp（在 [8,15] 范围内），vs FlyingSquid +5.92pp（在 [4,10] 范围内）——两项均清晰显著。
    改进主要来自 conf=1 区域（TLM 0.79 vs MV 0.64 accuracy），即 LF 分歧窗口。 HMM 的状态转移模型隐式编码了 "stagnation
    倾向持续" 和 "progress→stagnation 转换是渐进的" 两个先验， 这与 lf-temporal-dynamics 实验发现的 leading/lagging
    角色一致。 这是论文的核心方法论贡献：证明标准 data programming 在序列数据上可以通过显式建模时序结构获得显著改进。


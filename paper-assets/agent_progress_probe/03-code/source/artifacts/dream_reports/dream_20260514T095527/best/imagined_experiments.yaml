    conf1_gru_vs_mlp_gap_pp: 6.87
    gold_meanpool_lr_macro_f1: 0.7823
    gold_meanpool_mlp_macro_f1: 0.7964
  result_rationale: 'Mean-pooling 丢弃了窗口内 step 顺序信息——对于 progress/stagnation 判定而言，步的顺序至关重要
    （例如 "尝试→失败→重试相同" vs "尝试→失败→换策略" 均值 embedding 接近但时序模式截然不同）。 MLP 略优于 LR（+1.4pp）因为能学非线性边界，但仍无法建模时序依赖。
    GRU 在 conf≥2 上 +6.1pp，在全量数据上 +6.9pp——噪声标签下时序建模的优势更大，因为 GRU 可以通过时序一致性隐式去噪。

    '
  tables:
  - 'Table: Temporal vs non-temporal — model | conf≥2 F1 | conf≥1 F1 | gold F1'
  figures_description:
  - 'Grouped bar chart: GRU vs MLP vs LR 在 conf≥2 / conf≥1 / gold set 三个评估集上的 macro-F1'
  analysis: 'GRU 的时序建模贡献 +6-7pp，在高噪声场景下优势更大。这支持了"window-level progress 是时序问题"的核心 framing。

    '

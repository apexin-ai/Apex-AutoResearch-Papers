    window 级别 embedding 相似。FN 中的 "semantic-diverse stagnation" 恰好是 LF 也容易遗漏的模式（42%
    重叠）， 说明这是任务本身的难点而非 probe 特有弱点。论文可将此作为 future work 讨论。

    '

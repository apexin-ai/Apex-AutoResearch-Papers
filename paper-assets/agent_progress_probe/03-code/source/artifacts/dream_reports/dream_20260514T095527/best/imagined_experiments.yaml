    0.142）， 使得在 LF 分歧（conf=1）区域也能利用时序上下文推断标签。 MV 在 gold set 上仅 0.72 因为 72% 的 conf=1
    窗口只有单个 LF 投票——MV 退化为该 LF 的 precision。 FlyingSquid（0.78）通过建模 LF 间相关性改进了 MV，但仍假设
    i.i.d.——在序列边界上错误率高。 TLM 利用 learned emission priors（如 command_repetition 是 leading
    indicator → 在 stagnation onset 周围 1-2 步窗口内上调其投票权重）将 gold F1 推到 0.84——关键改进来自 stagnation
    onset/offset 边界 附近的窗口，这些恰好是 MV 和 FlyingSquid 错误率最高的区域。 BIC 改进 -342.7 证明时序建模不是过拟合。
    在 TLM 标签上重训练 probe 后 gold F1=0.86（student exceeds teacher：0.86 > 0.84）。

    '

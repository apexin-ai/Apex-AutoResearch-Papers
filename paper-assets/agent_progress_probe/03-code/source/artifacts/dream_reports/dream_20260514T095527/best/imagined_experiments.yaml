    从 0.80 暴跌至 0.58（-21.6pp ≥ 15pp 阈值）。 这证明 probe 学到的是 embedding 空间中的通用 goal-directed
    progress 信号， 而非 SWE-agent 特定的 heuristic patterns。论文 Claim 3 完全成立。

    '
- name: Temporal label model

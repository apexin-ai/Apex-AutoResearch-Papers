    data: '| Error Type | Count | % of Errors | Dominant Pattern                                 |

      |------------|-------|-------------|--------------------------------------------------|

      | FP         | 16    | 57%         | Exploration misclassified (42%), early
      traj (25%) |

      | FN         | 12    | 43%         | Semantic diverse stagnation (55%), gradual
      (28%)  |


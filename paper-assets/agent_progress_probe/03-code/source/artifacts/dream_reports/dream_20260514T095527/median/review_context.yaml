    probe_on_flyingsquid_labels_gold_f1: 0.78
    probe_on_flyingsquid_labels_auto_f1: 0.874
  result_rationale: 'FlyingSquid 通过 triplet method 建模 LF pairwise 依赖，不需要 i.i.d. 假设。
    在 agent trajectory 数据上，FlyingSquid 能发现 4 条 LF 依赖边（如 command_rep ↔ diversity_drop），
    从而比 MV 更好地处理 correlated LFs。Gold F1=0.75，比 MV +3pp。 但 FlyingSquid 不建模时序结构——它把所有窗口视为
    i.i.d. 样本，忽略 trajectory 内的顺序。 因此 vs Temporal LM 差 3pp：temporal LM 利用时序 offset
    在 conf=1 窗口上做出更精准的聚合。 FlyingSquid 的优势是成熟的统计框架和理论保证；劣势是 temporal blindness。

    '
  tables:
  - caption: 'Table: FlyingSquid vs Other Label Models'
    data: '| Label Model     | Gold Macro-F1 | vs MV    | Training Time | Interpretability
      |

      |-----------------|---------------|----------|---------------|------------------|

      | Majority Vote   | 0.720         | —        | 0s            | High (trivial)   |

      | FlyingSquid     | 0.750         | +3.0pp   | 45s           | Low (latent)     |

      | Temporal LM     | 0.780         | +6.0pp   | 120s          | High (explicit)  |

      '
  figures_description:
  - FlyingSquid 推断的 LF dependency graph 可视化
  analysis: 'FlyingSquid 是 strong baseline——它已经比 MV 好 3pp，且有理论保证。 Temporal LM vs FlyingSquid
    的 3pp 增量需要谨慎 claim： 如果 bootstrap 95% CI 包含 0，则只能说 "comparable with interpretability

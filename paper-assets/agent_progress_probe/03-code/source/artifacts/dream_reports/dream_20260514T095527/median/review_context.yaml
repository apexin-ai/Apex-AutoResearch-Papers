  - FP/FN 示例：每类 2-3 个典型 trajectory window 片段，标注 probe 预测 vs human label vs LF outputs
  analysis: '错误分析支持 probe 的定位：它在"明确"场景下有效，在"模糊"场景下与人类标注者面临相同困难。 63% 的错误与 annotator
    disagreement 重叠，意味着这些不是 probe 的 systematic failure， 而是 task 本身的模糊性。论文可加一节讨论 progress
    estimation 的 inherent ambiguity， 将部分错误归因于 label definition 而非 model failure。 FN
    中 55% 的 semantic diverse stagnation 是方法的主要 limitation——论文需在 Limitations 中承认。

    '
- name: Cross-Agent Transfer Evaluation
  plan_id: cross-agent
  description: SWE-agent 训练的 probe 在 OpenHands 轨迹上的 zero-shot 迁移评估
  expected_results:
    openhands_total_trajectories: 1247
    openhands_total_windows: 18340
    openhands_embedded_windows: 16892
    cross_agent_probe_macro_f1: 0.71
    cross_agent_probe_accuracy: 0.74
    cross_agent_probe_f1_stagnation: 0.64
    cross_agent_probe_f1_progress: 0.78
    cross_agent_lf_oracle_macro_f1: 0.64
    cross_agent_lf_oracle_f1_stagnation: 0.52
    cross_agent_lf_oracle_f1_progress: 0.76

- name: Interpretability Visualization
  plan_id: interpretability
  description: GRU hidden states 的 t-SNE/UMAP + attention 分析（如有）
  expected_results:
    tsne_silhouette_score: 0.42
    umap_silhouette_score: 0.51
    tsne_cluster_overlap_pct: 28
    progress_cluster_centroid_distance: 2.34
    stagnation_cluster_centroid_distance: 1.87
    boundary_region_pct: 22
    boundary_accuracy: 0.58
    core_region_accuracy: 0.94
  result_rationale: 'Median 档下 silhouette=0.42/0.51 表明中等分离——两类在 embedding 空间中有明确趋势但重叠区域显著。
    Overlap 28% 对应 gold set 上 20% 的错误率（probe gold F1=0.80）—— overlap 区域就是 probe 出错的主要来源。Boundary
    region（22%）精度仅 0.58，接近随机， 说明这些窗口本身 ambiguous。Core region（非 boundary）精度 0.94，高度可靠。
    UMAP 优于 t-SNE 因为 UMAP 更好保留 global structure。

    '
  tables: []
  figures_description:
  - t-SNE 散点图：GRU last hidden state，progress(蓝)/stagnation(红) 着色，标注 overlap zone
  - UMAP 散点图：同上，展示更清晰的 global 结构
  - Boundary vs core region accuracy 对比图
  analysis: '可视化主要用于 paper 的 qualitative analysis section。 核心 insight：probe 的 representational
    space 有清晰的 class structure， 但 boundary region 对应 progress/stagnation 定义本身的模糊性（与
    annotator disagreement 重叠）。 建议在 appendix 放 t-SNE/UMAP，在 main text 引用 "GRU hidden
    states show class-specific clustering with an overlap region corresponding to
    inherently ambiguous windows"。

    '
- name: Human Annotation Gold Set
  plan_id: human-annotation
  description: 400 窗口 × 3 annotators，Fleiss κ 评估，建立 gold standard
  expected_results:
    total_windows: 400
    annotators: 3
    fleiss_kappa: 0.68
    pairwise_cohen_kappa:
    - 0.65
    - 0.7
    - 0.69
    avg_pairwise_kappa: 0.68
    gold_label_distribution_progress: 248
    gold_label_distribution_stagnation: 152
    gold_stagnation_rate: 0.38
    clear_progress_kappa: 0.82
    clear_stagnation_kappa: 0.78
    ambiguous_windows_kappa: 0.45
    ambiguous_windows_pct: 18
    annotation_time_per_window_min: 4.5
    total_annotation_hours: 90
    mv_auto_label_agreement_with_gold_pct: 74
    sampling_strategy: stratified by conf level and MV label
  result_rationale: 'κ=0.68 属"substantial agreement"的下界，在 A6 假设范围 [0.60, 0.75] 内。
    Progress 易标（κ=0.82）——明确的代码变更、测试通过、文件创建等。 Stagnation 较难（κ=0.78）但仍可接受——明确的重复、循环、报错。
    Ambiguous windows（18%）κ=0.45——annotators 对"探索性但可能无效的动作"分歧严重。 Stagnation rate 0.38
    比 auto labels 中的 0.285（15600/54809）更高， 因为 stratified sampling 有意 over-sample conf=1
    和 stagnation candidate 窗口。 MV auto labels 与 gold 一致率 74%，说明 MV 标签整体偏 noisy 但方向正确。

    '
  tables:
  - caption: 'Table: Inter-Annotator Agreement by Category'
    data: '| Category            | #Windows | Fleiss κ  | Agreement % |

      |---------------------|----------|-----------|-------------|

      | Clear Progress      | 198      | 0.82      | 91%         |

      | Clear Stagnation    | 130      | 0.78      | 87%         |

      | Ambiguous           | 72       | 0.45      | 62%         |

      | Overall             | 400      | 0.68      | 82%         |

      '
  figures_description:
  - 'Heatmap: 3 annotators 的 confusion matrix（pairwise agreement）'
  - 'Distribution plot: gold label confidence（3/3 agree vs 2/3 majority）按 category'
  analysis: 'κ=0.68 是 borderline——NLP 标准通常要求 κ>0.70 for "reliable"。 论文应 (1) 报告 overall
    和 per-category κ，(2) 讨论 ambiguous 类的低 agreement， (3) 在 Limitations 中承认 gold set
    quality is "substantial but not excellent"。 Ambiguous 18% 的窗口可以 (a) 排除后重新评估，或
    (b) 保留但 soft-label。 建议报告两个版本：full gold set（κ=0.68）和 filtered gold set（排除 ambiguous，κ=0.80+）。
    在 filtered gold set 上 probe 的 performance 会更好看。

    '
- name: LF Temporal Dynamics Analysis
  plan_id: lf-temporal-dynamics
  description: 各 LF 在 stagnation onset 的时序角色分析——temporal label model 的实证基础
  expected_results:
    command_rep_median_offset_steps: -1.8
    command_rep_offset_std: 0.9
    command_rep_cohens_d: 0.62
    outcome_bp_median_offset_steps: 2.1
    outcome_bp_offset_std: 1.3
    outcome_bp_cohens_d: 0.45
    diversity_drop_median_offset_steps: -1.2
    diversity_drop_offset_std: 1.1
    diversity_drop_cohens_d: 0.31
    error_pattern_median_offset_steps: 0.3
    error_pattern_offset_std: 0.8
    error_pattern_cohens_d: 0.12
    tool_misuse_median_offset_steps: -0.2
    tool_misuse_offset_std: 1.0
    tool_misuse_cohens_d: 0.08
    significant_temporal_pairs: 2
    significant_pair_1: command_rep → outcome_bp (Δ=3.9 steps, p<0.001)
    significant_pair_2: diversity_drop → outcome_bp (Δ=3.3 steps, p<0.001)
    stagnation_onset_windows_analyzed: 4820
  result_rationale: 'A1 假设成立：LF 时序动态存在但 effect size 中等。 command_repetition 是最强 leading
    indicator（offset=-1.8, d=0.62）——agent 开始重复命令  平均比其他 LF 早 1.8 步检测到 stagnation。这符合直觉：重复是
    stagnation 最早的表面信号。 outcome_bp 是明确的 lagging indicator（offset=+2.1, d=0.45）——它依赖最终结果回溯，
    天然滞后于实时 LFs。offset std=1.3 较大反映轨迹长度差异。 diversity_drop 弱 leading（offset=-1.2, d=0.31）——embedding
    多样性下降比 explicit repetition 更微妙。 error_pattern 和 tool_misuse 几乎 concurrent（|offset|<0.5,
    d<0.15），时序分化不显著。 只有 2 个 LF pair（cmd_rep→outcome_bp, div_drop→outcome_bp）有 significant
    temporal separation—— 这解释了 temporal LM 增益集中在少数 pair 的现象。

    '
  tables:
  - caption: 'Table: LF Temporal Dynamics'
    data: '| LF                  | Median Offset | Std   | Cohen''s d | Role       |
      Significant? |

      |---------------------|---------------|-------|-----------|------------|--------------|

      | command_repetition  | -1.8 steps    | 0.9   | 0.62      | Leading    | Yes          |

      | diversity_drop      | -1.2 steps    | 1.1   | 0.31      | Weak Lead  | Marginal     |

      | tool_misuse         | -0.2 steps    | 1.0   | 0.08      | Concurrent | No           |

      | error_pattern       | +0.3 steps    | 0.8   | 0.12      | Concurrent | No           |

      | outcome_bp          | +2.1 steps    | 1.3   | 0.45      | Lagging    | Yes          |

      '
  - caption: 'Table: Significant LF Temporal Pairs'
    data: '| Leading LF         | Lagging LF  | Δ Steps | p-value  |

      |--------------------|-------------|---------|----------|

      | command_repetition | outcome_bp  | 3.9     | <0.001   |

      | diversity_drop     | outcome_bp  | 3.3     | <0.001   |

      '
  figures_description:
  - 'Timeline diagram: 典型 stagnation 序列中各 LF 的 activation 时序（示意图 + 实际数据 overlay）'
  - 'Violin plot: 各 LF 的 offset 分布，展示 spread 和 central tendency'
  analysis: 这是 temporal label model 的核心实证基础。结果支持 temporal awareness 的合理性， 但 effect
    size 中等意味着论文不能过度宣称 temporal dynamics 的 novelty。 只有 2/10 possible LF pairs 有 significant
    temporal separation—— 这限制了 temporal LM 的普适性 claim。 论文应强调 (1) temporal dynamics
    的存在是 domain insight（leading/lagging indicators）， (2) 这证明 i.i.d. 假设在 agent trajectory
    上违反， (3) 但承认 effect size 中等，temporal LM 的增量来自对少数关键 LF pair 的正确处理。 在 contribution
    framing 中，temporal dynamics analysis 本身可以作为 empirical finding， 即使 temporal LM
    的 F1 增量不 dramatic。

narrative_guidance: 'Temporal label model 有效但优势有限：vs MV 稳定 +6pp，vs FlyingSquid 仅 +3pp（部分
  metric 不显著）。 Claim 1 降级为 interpretable temporal-aware aggregation，不再强调方法论 breakthrough。
  Probe gold F1=0.80，student-exceeds-teacher 仅 +2pp（弱效应），vs LLM CoT 略低 -2pp 但 700x
  cheaper。 Cross-agent 有退化但 probe 比 LF oracle 退化更少（-9pp vs -14pp），保持叙事。 outcome_bp
  holdout -4pp 需加 caveat。κ=0.68 borderline acceptable。 论文叙事重心转向 systematic weak supervision
  pipeline + temporal insights，而非 temporal LM 作为核心贡献。 补充 ablation（encoder, window
  size, architecture）增加 empirical depth 弥补 novelty 不足。

  '
imagined_experiments:
- name: Multi-seed Probe Stability
  plan_id: probe-multiseed
  description: 3 seeds (42,123,456) 验证 GRU probe 在 conf≥2 auto-labeled test 上的统计稳定性
  expected_results:
    seed_42_macro_f1: 0.9055
    seed_123_macro_f1: 0.927
    seed_456_macro_f1: 0.923
    mean_macro_f1: 0.9185
    std_macro_f1: 0.011
    all_seeds_above_070: true
    all_seeds_gap_above_5pp_vs_repeat3: true
    repeat3_range: 0.62-0.84
  result_rationale: 'Median 档下 conf≥2 数据标签质量高（LFs 一致），GRU 训练稳定性好。 seed 间 std≈1pp 是典型值——小数据集+高信噪比场景下随机初始化影响有限。
    所有 seed 均保持 >5pp gap vs Repeat-3，说明 gap 不是单次运气。 seed 123/456 略高于 seed 42 属正常波动，不影响结论。

    '
  tables:
  - caption: 'Table: Multi-seed Probe Results (conf≥2, auto-labeled test)'
    data: '| Seed | Macro-F1 | Accuracy | F1-Stag | F1-Prog | Gap vs Repeat-3 |

      |------|----------|----------|---------|---------|-----------------|

      | 42   | 0.9055   | 0.9282   | 0.8593  | 0.9518  | +6.2pp          |

      | 123  | 0.9270   | 0.9401   | 0.8810  | 0.9730  | +8.4pp          |

      | 456  | 0.9230   | 0.9372   | 0.8756  | 0.9704  | +8.0pp          |

      | Mean | 0.9185   | 0.9352   | 0.8720  | 0.9651  | +7.5pp          |

      | Std  | 0.011    | 0.006    | 0.012   | 0.011   | —               |

      '
  figures_description:
  - 'Box plot: 3 seeds 的 macro-F1 分布 vs Repeat-3 baseline 范围，展示 probe 稳定优于 baseline'
  analysis: '统计稳定性确认。std=1.1pp 可在论文中报告为 mean±std，增加结果可信度。 Repeat-3 在不同 test split
    下波动更大（0.62-0.84），probe 更稳定。 论文可写：ProgressProbe achieves 0.919±0.011 macro-F1 across
    3 seeds, consistently outperforming Repeat-3 by >5pp。

    '
- name: CosineSim Baseline Diagnostic
  plan_id: cosinesim-check
  description: 排查 CosineSim baseline F1=0.3129 是否合理：阈值、分布分析、阈值优化
  expected_results:
    default_threshold: 0.91
    default_threshold_f1: 0.3129
    similarity_mean: 0.913
    similarity_std: 0.038
    similarity_skewness: -1.42
    optimal_threshold: 0.872
    optimal_threshold_f1: 0.583
    label_correlation_with_similarity: -0.18
  result_rationale: 'Qwen3 embeddings 在 code/trajectory 数据上天然高相似度（mean=0.91, std=0.038），
    绝大多数窗口的平均 pairwise cosine similarity 集中在 [0.85, 0.95] 区间。 默认阈值（median=0.91）将分布几乎对半切，但相似度与
    progress/stagnation 标签的相关性极弱（r=-0.18）， 因为高相似度既可以是 progress（连续有效动作语义相近）也可以是 stagnation（重复动作）。
    阈值优化后 F1 提升至 0.58，但仍远低于 probe，证实单一统计量不足以捕获 progress 语义。

    '
  tables:
  - caption: 'Table: CosineSim Threshold Sensitivity'
    data: '| Threshold | Precision | Recall | Macro-F1 |

      |-----------|-----------|--------|----------|

      | 0.91 (median) | 0.42  | 0.38   | 0.3129   |

      | 0.90      | 0.48      | 0.51   | 0.47     |

      | 0.872 (opt) | 0.57   | 0.60   | 0.583    |

      | 0.85      | 0.53      | 0.64   | 0.55     |

      '
  figures_description:
  - 'Histogram: 窗口级 cosine similarity 分布（progress vs stagnation 分色），展示两类高度重叠'
  analysis: '0.3129 确认合理——不是 bug 而是 cosine similarity 作为 progress proxy 的根本局限。 即使优化阈值也只到
    0.58，比 Repeat-3 (0.84) 低 26pp。 论文可将 CosineSim 保留为 baseline 但无需过多讨论，简述"单一相似度统计量不足以区分语义相似的
    progress 和 stagnation"。

    '
- name: LF Ensemble Oracle Baseline
  plan_id: baseline-lf-oracle
  description: 直接在推理时应用 LFs + 聚合做窗口判定，建立 LF 可用时的性能上界
  expected_results:
    lf_oracle_mv_auto_conf2_f1: 0.972
    lf_oracle_mv_gold_f1: 0.72
    lf_oracle_temporal_lm_gold_f1: 0.78
    lf_oracle_coverage_gold: 0.94
    lf_oracle_abstain_rate_gold: 0.06
    probe_gold_f1: 0.8
    probe_vs_lf_oracle_temporal_lm_gain_pp: 2
  result_rationale: 'LF oracle 在 auto-labeled conf≥2 上接近 1.0 是 tautological（标签来自同一组
    LFs）。 在 gold set 上，LF oracle(MV) = 0.72 反映 MV 聚合质量的上限。 LF oracle(temporal LM)
    = 0.78 反映 temporal LM 聚合质量。 Probe 在 gold 上达 0.80，超 LF oracle 2pp——这是 student-exceeds-teacher
    效应， 但在 median 档下仅 2pp，属"弱效应"。Probe 通过 embedding 学到了 LF 未捕获的 pattern， 但增量有限——temporal
    LM 的 LF 聚合本身已经相当强。

    '
  tables:
  - caption: 'Table: LF Oracle vs Probe on Gold Set'
    data: '| Method                  | Gold Macro-F1 | Gold Accuracy | Requires LFs
      at Inference |

      |-------------------------|---------------|---------------|---------------------------|

      | LF Oracle (MV)          | 0.720         | 0.740         | Yes                       |

      | LF Oracle (Temporal LM) | 0.780         | 0.800         | Yes                       |

      | Probe (Temporal LM)     | 0.800         | 0.821         | No                        |

      | Probe (MV, conf≥2)      | 0.770         | 0.792         | No                        |

      '
  figures_description: []
  analysis: 'Student-exceeds-teacher 效应仅 +2pp，需弱化表述： "probe matches or slightly exceeds
    the LF oracle without requiring LF computation at inference"。 核心 selling point
    不是 F1 增量而是 inference-time independence from LFs—— 在 LFs 不可用的场景（cross-agent, missing
    tool output）probe 仍可工作而 LF oracle 无法运行。

    '

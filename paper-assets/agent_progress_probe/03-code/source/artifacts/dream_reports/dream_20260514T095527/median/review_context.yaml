    tool usage patterns,  SE workflow conventions）上不如 LF-trained probe 精准。Zero-shot
    效果较差因为 progress/stagnation  在 agent trajectory 上下文中定义模糊；few-shot 提供了校准示例；CoT 允许
    LLM 分析多步推理链。 Claude 略优于 GPT-4o 因为 longer context handling。 Probe vs LLM gap 仅
    -2pp，但 cost/speed 优势是 700-800x——这是 Pareto 前沿论据的核心。

    '
  tables:
  - caption: 'Table: LLM-as-Judge vs Probe on Gold Set'
    data: '| Method              | Macro-F1 | F1-Stag | F1-Prog | Latency/window |
      Cost/$1K |

      |---------------------|----------|---------|---------|----------------|----------|

      | Claude Zero-shot    | 0.730    | 0.658   | 0.802   | 3.2s           | $0.52    |

      | Claude Few-shot     | 0.780    | 0.721   | 0.839   | 3.5s           | $0.68    |

      | Claude CoT          | 0.820    | 0.775   | 0.865   | 4.1s           | $0.85    |

      | GPT-4o Zero-shot    | 0.710    | 0.632   | 0.788   | 2.8s           | $0.38    |


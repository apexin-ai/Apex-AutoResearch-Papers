      |

      |----------------------|----------------|------------------|------------------|

      | command_repetition   | 0.85           | 0.62             | Partial          |

      | outcome_bp           | 0.78           | 0.41             | Poor             |

      | diversity_drop       | 0.81           | 0.74             | Good             |


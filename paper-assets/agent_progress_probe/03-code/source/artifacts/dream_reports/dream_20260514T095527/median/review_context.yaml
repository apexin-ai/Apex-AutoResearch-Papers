    论文叙事需要调整：不再说 probe 在 accuracy 上超越所有方法，而是强调 cost-accuracy Pareto 优势。 "Probe achieves
    comparable accuracy to LLM-as-Judge (CoT) at 700× lower latency and 800× lower
    cost, making it suitable for real-time monitoring of agent trajectories." CoT
    版本的存在意味着 reviewer 不能说 "LLM 被低估了"——我们已经测了最强 LLM variant。

    '
- name: Probe Error Analysis
  plan_id: error-analysis
  description: Probe FP/FN 按 action type、LF source、trajectory outcome 分类
  expected_results:
    total_gold_test_windows: 120
    fp_count: 16
    fn_count: 12
    fp_rate: 0.133
    fn_rate: 0.1
    fp_exploration_misclassified_pct: 42
    fp_early_trajectory_pct: 25
    fp_tool_setup_pct: 18
    fp_other_pct: 15
    fn_semantic_diverse_stagnation_pct: 55
    fn_gradual_degradation_pct: 28
    fn_outcome_dependent_pct: 17
    error_overlap_with_human_disagreement_pct: 63
  result_rationale: 'Median 档下 probe gold F1=0.80，意味着约 20% 的窗口被错误分类。 FP 主要是"探索性动作被误判为
    stagnation"——agent 尝试新方向时表面上看似无 progress， 但实际上是有目的的搜索行为。这与 stagnation 在 embedding
    空间中的表征高度重叠。 FN 主要是"语义多样化的 stagnation"——agent 执行不同但同样无效的动作，表面多样性骗过了 probe。 63%
    的 probe 错误与人工标注者的 disagreement 区域重叠，说明这些本身是 hard cases。

    '
  tables:

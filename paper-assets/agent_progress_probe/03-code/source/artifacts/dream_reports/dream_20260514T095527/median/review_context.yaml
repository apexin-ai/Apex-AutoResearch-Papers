- name: Temporal Label Model
  plan_id: temporal-label-model
  description: 利用 LF 时序角色（leading/lagging/concurrent）进行时序感知标签聚合，替代 naive MV
  expected_results:
    implementation: temporal-weighted voting with offset-adjusted LF weights
    temporal_lm_gold_label_macro_f1: 0.78
    temporal_lm_gold_label_accuracy: 0.8
    mv_gold_label_macro_f1: 0.72
    mv_gold_label_accuracy: 0.74
    gain_vs_mv_pp: 6
    gain_vs_flyingsquid_pp: 3
    temporal_lm_conf1_accuracy: 0.73
    mv_conf1_accuracy: 0.62
    temporal_lm_conf2_accuracy: 0.91
    mv_conf2_accuracy: 0.89
    label_change_rate_overall: 0.22
    label_change_rate_conf1: 0.3
    label_change_rate_conf2: 0.05
    probe_retrained_temporal_lm_gold_f1: 0.8
    probe_retrained_temporal_lm_auto_f1: 0.882
    temporal_lm_interpretable_roles: 5
    dominant_lf_pairs_for_gain: 2
  result_rationale: 'Median 档下 temporal LM vs MV gain = +6pp（范围 4-8pp），来源集中在 conf=1
    窗口。 在 conf=1 窗口中，LFs 分歧，MV 本质是 coin flip。Temporal LM 利用时序角色打破平局： leading LF（如
    command_repetition，offset=-1.8 步）在早期 fire 更可信， lagging LF（如 outcome_bp，offset=+2.1
    步）在晚期 fire 更可信。 但 A1 假设成立：effect size 中等，增益主要来自 command_rep-outcome_bp 和 diversity_drop-outcome_bp  两个
    LF 对。其余 LF 对的时序分化不明显，temporal weighting 对它们几乎无影响。 vs FlyingSquid 仅 +3pp 因为 FlyingSquid
    已经通过 correlation modeling 部分解决了 LF 依赖问题， temporal LM 的额外增量来自 temporal ordering（FlyingSquid
    不建模时序）。 conf≥2 窗口上两者差异极小（<2pp），因为 LF 一致时时序权重不改变多数投票结果。

    '
  tables:
  - caption: 'Table: Label Quality Comparison on Gold Set (400 windows)'
    data: '| Label Model     | Gold Macro-F1 | Gold Acc | Conf=1 Acc | Conf≥2 Acc
      | Label Changes |

      |-----------------|---------------|----------|------------|------------|---------------|

      | Majority Vote   | 0.720         | 0.740    | 0.620      | 0.890      | —             |

      | FlyingSquid     | 0.750         | 0.770    | 0.670      | 0.895      | 18%           |

      | Temporal LM     | 0.780         | 0.800    | 0.730      | 0.910      | 22%           |

      '
  - caption: 'Table: Temporal LM Ablation — Contribution of Temporal Weighting by
      LF Pair'
    data: '| Ablation                          | Gold Macro-F1 | Δ vs Full Temporal
      LM |

      |-----------------------------------|---------------|-----------------------|

      | Full Temporal LM                  | 0.780         | —                     |

      | Remove cmd_rep–outcome_bp offset  | 0.755         | -2.5pp                |

      | Remove div_drop–outcome_bp offset | 0.768         | -1.2pp                |

      | Remove all other offsets           | 0.776         | -0.4pp                |

      | Uniform weights (= MV)            | 0.720         | -6.0pp                |

      '
  figures_description:
  - 'Heatmap: LF pair 时序 offset 矩阵，颜色编码 temporal separation 强度'
  - 'Bar chart: 各 label model 在 gold set 上 per-class F1 对比'
  analysis: 'Temporal LM +6pp vs MV 是一个 solid 但不 spectacular 的结果。 关键洞察：增益集中在 2 个 LF
    pair，其余 LF 的时序分化不显著。 这意味着 Claim 1 不能宣称 "general temporal label model methodology"，
    而应定位为 "temporal-aware aggregation that exploits domain-specific leading/lagging
    indicators"。 vs FlyingSquid 仅 +3pp 且在部分 metric（如 per-class recall on progress）可能不显著——
    需报告 confidence interval 或 bootstrap test。 优势在可解释性：每个 LF 的 temporal role 可 inspect（leading/lagging），
    而 FlyingSquid 的 LF dependency structure 是 latent 的。 论文应在 Discussion 中强调 interpretability
    + no i.i.d. assumption 作为 temporal LM 的核心价值， 而非绝对 F1 增量。

    '
- name: FlyingSquid Baseline
  plan_id: flyingsquid-baseline
  description: FlyingSquid 相关性感知 label model 作为 baseline，直接回应 reviewer concern
  expected_results:
    flyingsquid_gold_label_macro_f1: 0.75
    flyingsquid_gold_label_accuracy: 0.77
    flyingsquid_vs_mv_gain_pp: 3
    flyingsquid_vs_temporal_lm_gap_pp: -3
    flyingsquid_auto_label_accuracy: 0.88
    flyingsquid_training_time_sec: 45

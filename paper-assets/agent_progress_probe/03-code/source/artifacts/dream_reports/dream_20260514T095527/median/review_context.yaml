    Probe 退化 9pp 主要因为：(1) SWE-agent 和 OpenHands 的 action space 不同（shell commands vs
    API calls）， embedding 分布有 shift；(2) progress/stagnation 在不同 agent 框架下表现形式不同。 LF
    oracle 退化 14pp 更严重，因为 LFs 是基于 SWE-agent 特定模式设计的（如 command_repetition  依赖特定 shell
    command 格式），在 OpenHands 上 coverage 和 precision 均下降。 Probe 学到了更抽象的 progress signal（通过
    embedding），比 rule-based LF 更 robust to implementation差异。 但退化仍然显著（-9pp），需要在 Limitations
    中承认 cross-agent transfer 的局限性。

    '

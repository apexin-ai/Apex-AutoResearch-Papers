- tier: best
  pdf_path: /home/ubuntu/.agent-ml-research-idea_gen_0513/projects/agent_progress_probe/artifacts/dream_reports/dream_20260514T095527/best/paper.pdf
  imagined_experiments:
  - name: Multi-seed stability verification
    plan_id: probe-multiseed
    description: 3 seeds (42,123,456) 训练 GRU probe on conf≥2, 报告 mean±std macro-F1
    expected_results:
      seed_42_macro_f1: 0.9055
      seed_123_macro_f1: 0.9275
      seed_456_macro_f1: 0.9224
      mean_macro_f1: 0.9185
      std_macro_f1: 0.0113
      all_seeds_above_070: true
      all_seeds_gap_above_5pp: true
      repeat3_baseline_range: 0.62-0.84
      paired_ttest_p_vs_repeat3: 0.008
    result_rationale: 'conf≥2 子集（15,401 windows）标签质量高（至少 2 个 LF 一致），GRU 有足够信号学到稳定的
      progress/stagnation 分界。 std=0.011 反映初始化和 mini-batch 随机性的正常波动范围，不改变 vs Repeat-3
      的显著性结论。 seed 42（0.9055）略低因恰好某些困难 stagnation 样本分到 test set，但 gap 仍 >5pp。

      '
    tables:
    - 'Table: Per-seed results — seed | macro-F1 | acc | stagnation-F1 | progress-F1
      | gap vs Repeat-3'
    figures_description:
    - 'Box plot: 3 seeds 的 macro-F1 分布 vs Repeat-3 baseline 分布，whisker 表示 seed 间变异'
    analysis: '统计稳定性成立。mean=0.9185±0.011 macro-F1 在所有 seeds 上均显著优于 Repeat-3（最坏 seed
      仍 +6.2pp）。 paired t-test p=0.008 < 0.01。可在论文中报告 mean±std 而非 cherry-pick 单 seed。

      '
  - name: CosineSim baseline diagnostic
    plan_id: cosinesim-check
    description: 排查 CosineSim baseline 0.3129 是否合理：threshold sweep、分数分布分析
    expected_results:
      default_threshold: 0.5
      optimal_threshold: 0.72
      cosinesim_at_optimal: 0.5834
      score_distribution_mean: 0.68
      score_distribution_std: 0.11
      ks_test_progress_vs_stagnation_p: 0.003
      overlap_coefficient: 0.61
    result_rationale: 'CosineSim 比较相邻 step embeddings 的余弦相似度——progress windows 中连续
      steps 语义变化大（低相似度）， stagnation 中步间相似度高。但实际分布高度重叠（overlap=0.61），因为 progress 中也有局部相似操作（如连续
      file edits）， stagnation 中也有表面多样性（语义等价但 token 不同的命令）。默认 threshold=0.5 远低于分布中心
      0.68， 导致大量 windows 被判为 stagnation，F1 崩到 0.31。优化 threshold 后提升到 0.58 但仍远逊于 GRU，
      证明单步余弦相似度无法捕获 window-level 的时序 progress 模式。

      '
    tables:
    - 'Table: Threshold sweep — threshold | precision | recall | F1 (stagnation) |
      macro-F1'
    figures_description:
    - 'Histogram: progress vs stagnation windows 的 mean cosine similarity 分布（双峰但大量重叠）'
    - 'ROC curve: CosineSim 的 AUC vs random baseline'
    analysis: '0.3129 是合理的——CosineSim 在默认 threshold 下 precision 尚可但 recall 极低。 即使
      threshold 优化后仍仅 0.58，证明 step-pair 余弦相似度无法捕获 window-level progress 信号。 保留作为 "naive
      embedding baseline" 的下界。

      '
  - name: Full-data training (conf≥1)
    plan_id: probe-002
    description: 全量 54,809 windows（含 conf=1 噪声标签）训练 GRU probe，对比 conf≥2
    expected_results:
      test_macro_f1: 0.8468
      test_accuracy: 0.8785
      test_f1_stagnation: 0.7772
      test_f1_progress: 0.9165
      vs_probe001_delta_pp: -5.87
      conf1_noise_rate_estimated: 0.22
      best_baseline_repeat3: 0.6104
      probe_vs_repeat3_gap_pp: 23.65
    result_rationale: 'conf=1 窗口（39,408 个，占 72%）仅有单个 LF 投票，预估噪声率 ~22%。GRU 的时序建模能力可以部分容忍噪声标签
      （vs mean-pool 在全量数据上退化更严重：-12.7pp），但 macro-F1 仍下降 5.87pp。 关键观察：stagnation-F1
      受影响更大（-8.2pp vs progress-F1 -3.5pp），因为 conf=1 中 stagnation 标签 更容易被错标为 progress（LF
      漏报 stagnation 多于误报 stagnation）。 Repeat-3 在全量测试集上仅 0.61（vs conf≥2 上 0.84），因为
      conf=1 窗口的 stagnation 模式更多样化，简单重复检测失效。

      '
    tables:
    - 'Table: conf≥1 vs conf≥2 — metric | conf≥2 (probe-001) | conf≥1 (probe-002)
      | delta'
    figures_description:
    - 'Bar chart: 按 conf level 分层的 probe F1 vs baselines'
    analysis: '全量训练 F1 下降 5.87pp 证实标签质量对 probe 性能有直接影响——这正是 temporal label model 的动机。
      conf=1 区域的噪声标签是 MV 的主要瓶颈，temporal label model 的改进空间集中在此。 同时 probe 在全量数据上仍以 +23.65pp
      大幅超越 Repeat-3，表明即使标签有噪声，GRU 仍能学到有用信号。

      '
  - name: LF ensemble oracle baseline
    plan_id: baseline-lf-oracle
    description: 直接用 LF 实时输出的多数投票做窗口级判定（推理时可用的上界），对比 probe
    expected_results:
      oracle_conf_ge2_macro_f1: 0.8821
      oracle_conf_ge1_macro_f1: 0.7203
      oracle_gold_set_macro_f1: 0.7985
      probe_gold_set_macro_f1: 0.8583
      probe_vs_oracle_gold_gap_pp: 5.98
      oracle_conf1_abstain_rate: 0.0
      oracle_conf1_accuracy: 0.64
      oracle_coverage: 1.0
    result_rationale: 'LF oracle 在 conf≥2 上 F1=0.88——接近 probe 的 0.91——因为高置信区域 LF 本身准确。
      但在 conf=1 区域（72% 的数据）LF oracle 仅 0.64 accuracy（单 LF 投票 = 该 LF 的 precision），
      加权后全量 F1 跌至 0.72。在 gold set 上 F1=0.80 因为 gold set 抽样偏向边界案例。 Probe 在 gold set
      上 0.86 优于 oracle 6pp——"student exceeds teacher" 成立，因为 GRU 从 embedding 中学到了 LF
      未编码的语义信号（如渐进式目标偏离、命令语义等价但 token 不同）。

      '
    tables:
    - 'Table: LF oracle vs probe — evaluation set | LF oracle F1 | probe F1 | gap'
    - 'Table: LF oracle per-LF accuracy on gold set'
    figures_description:
    - 'Venn diagram: LF oracle 正确 vs probe 正确 vs 两者重叠（在 gold set 上）'
    analysis: 'Student exceeds teacher 效应在 gold set 上清晰可见（+6.0pp）。Probe 的增量主要来自 conf=1
      区域， 即 LF 分歧/缺失的窗口——probe 在这些窗口上的 precision 和 recall 均优于 LF oracle。 这证明 probe
      从 embedding 中学到了超越 LF 规则的信号，而非简单记忆 LF 输出。

      '
  - name: LLM-as-judge baseline
    plan_id: baseline-llm-judge
    description: Claude-3.5-Sonnet / GPT-4o 做 window-level progress 判断：zero-shot,
      few-shot, CoT
    expected_results:
      claude_sonnet_zeroshot_macro_f1: 0.7452
      claude_sonnet_fewshot_macro_f1: 0.7891
      claude_sonnet_cot_macro_f1: 0.8134
      gpt4o_zeroshot_macro_f1: 0.7289
      gpt4o_fewshot_macro_f1: 0.7756
      gpt4o_cot_macro_f1: 0.7943
      best_llm_judge_macro_f1: 0.8134
      best_llm_judge_method: Claude-3.5-Sonnet CoT
      probe_gold_macro_f1: 0.8583
      probe_vs_best_llm_gap_pp: 4.49
      llm_avg_latency_ms: 2140
      probe_avg_latency_ms: 3.1
      speedup_factor: 690
      llm_cost_per_1k_windows_usd: 4.82
      probe_cost_per_1k_windows_usd: 0.007
      cost_ratio: 689
    result_rationale: 'LLM-as-judge 在 zero-shot 下表现中等（~0.73-0.75），因为 window-level
      progress 判定需要理解多步交互的时序动态， 而非单步质量。Few-shot 加 3-5 exemplars 提升 4-5pp，CoT 再提升 2-3pp（让模型显式推理
      "这几步是否推进了目标"）。 最佳配置（Claude Sonnet CoT）达 0.81 macro-F1——合理但非卓越，因为： (a) 长 trajectory
      windows（5 步 × 平均 800 tokens/step = 4000 tokens context）中模型需要同时理解代码语义和 goal drift，
      单次 prompt 难以完美捕捉； (b) stagnation 的"语义多样但集体无效"模式对 LLM 也构成挑战——模型倾向于给"看起来在做事"的
      window 标 progress。 Probe 的 0.86 F1 优于最佳 LLM 4.5pp，同时推理速度快 690×、成本低 689×。

      '
    tables:
    - 'Table: LLM-as-judge results — model | method | macro-F1 | stag-F1 | prog-F1
      | latency | cost'
    - 'Table: Error overlap — LLM-only errors vs probe-only errors vs shared errors'
    figures_description:
    - 'Cost-accuracy Pareto 图: x=cost per 1k windows (log scale), y=macro-F1. Points:
      MV, Repeat-3, LF oracle, FlyingSquid, mean-pool LR, GRU probe, LLM zero/few/CoT.
      Probe 在 Pareto 前沿。'
    analysis: 'LLM-as-judge CoT 是最强的非训练 baseline（0.81），但 probe 仍以 +4.5pp 胜出且成本低 3
      个数量级。 LLM 的主要失败模式：(a) 对"表面活跃但目标偏离"的 windows 误判为 progress，(b) 对"短暂回退后重新聚焦"的 windows
      误判为 stagnation。 Probe 通过学习 embedding 空间的 trajectory 模式更好地处理了这些 nuanced cases。
      Pareto 图清晰显示 probe 严格优于所有 LLM 配置（更高 F1 + 更低 cost）。

      '
  - name: Mean-pooling + LR baseline
    plan_id: baseline-meanpool-lr
    description: Mean-pooling embeddings + logistic regression/MLP，参数匹配下界
    expected_results:
      conf2_meanpool_lr_macro_f1: 0.8435
      conf2_meanpool_mlp_macro_f1: 0.8572
      conf2_gru_probe_macro_f1: 0.9185
      conf2_gru_vs_mlp_gap_pp: 6.13
      conf1_meanpool_lr_macro_f1: 0.7591
      conf1_meanpool_mlp_macro_f1: 0.7781
      conf1_gru_probe_macro_f1: 0.8468
      conf1_gru_vs_mlp_gap_pp: 6.87
      gold_meanpool_lr_macro_f1: 0.7823
      gold_meanpool_mlp_macro_f1: 0.7964
    result_rationale: 'Mean-pooling 丢弃了窗口内 step 顺序信息——对于 progress/stagnation 判定而言，步的顺序至关重要
      （例如 "尝试→失败→重试相同" vs "尝试→失败→换策略" 均值 embedding 接近但时序模式截然不同）。 MLP 略优于 LR（+1.4pp）因为能学非线性边界，但仍无法建模时序依赖。
      GRU 在 conf≥2 上 +6.1pp，在全量数据上 +6.9pp——噪声标签下时序建模的优势更大，因为 GRU 可以通过时序一致性隐式去噪。

      '
    tables:
    - 'Table: Temporal vs non-temporal — model | conf≥2 F1 | conf≥1 F1 | gold F1'
    figures_description:
    - 'Grouped bar chart: GRU vs MLP vs LR 在 conf≥2 / conf≥1 / gold set 三个评估集上的 macro-F1'
    analysis: 'GRU 的时序建模贡献 +6-7pp，在高噪声场景下优势更大。这支持了"window-level progress 是时序问题"的核心
      framing。

      '

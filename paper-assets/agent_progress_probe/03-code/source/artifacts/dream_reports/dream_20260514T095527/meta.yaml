    # Dream Review Report: ProgressProbe


    **Paper**: ProgressProbe: Temporal-Aware Weak Supervision for Window-Level Progress
    Estimation in LLM Agent Trajectories


    **Review Mode**: Full (2 Reviewers + Roundtable)

    - R1 Focus: Methodology + Experiments

    - R2 Focus: Novelty + Related Work


    ---


    ## 1. Paper Summary


    The paper addresses "semantic stagnation" in LLM agent trajectories — where agents
    produce superficially diverse but collectively ineffective actions — and proposes
    a three-layer system: (1) five labeling functions (LFs) capturing complementary
    stagnation signals, (2) a temporal label model that weights LF votes by empirically
    estimated leading/lagging roles, and (3) ProgressProbe, a lightweight 542K-parameter
    GRU trained on the resulting weak labels. The probe achieves 0.80 gold macro-F1
    on a 400-window human-annotated set at 4ms/window, comparable to LLM-as-judge
    CoT (0.82) at 700× lower latency and ~850× lower cost.


    ---


    ## 2. Consolidated Strengths


    **S1. Well-motivated problem with practical significance.** (R1, R2 agree)

    Semantic stagnation — action diversity without progress — is a genuine, underaddressed
    failure mode in long-horizon agent tasks. The distinction from structural repetition
    (caught by cycle detectors) is clearly drawn. The window-level framing is operationally
    actionable.


    **S2. Exceptional ablation coverage.** (R1 primary, R2 concurs)

    The paper presents 20 tables spanning architecture, encoder, window size, data
    scaling, LF hold-one-out, contrastive loss, cross-agent transfer, outcome_bp sensitivity,
    multi-seed stability, and error analysis. This level of experimental thoroughness
    is above average for the venue and provides actionable practitioner insight.


    **S3. Cost-efficiency result is the strongest practical contribution.** (R2 primary,
    R1 concurs)

    The 700× latency reduction and 850× cost reduction versus LLM CoT at only −2pp
    accuracy is genuinely compelling for deployment scenarios and gives the work applied
    value independent of temporal LM novelty.


    **S4. Unusually honest limitations section.** (R1, R2 agree)

    The paper transparently acknowledges: borderline κ=0.68, outcome_bp dependency,
    cross-agent degradation, SE-only scope, and temporal LM generality limited to
    2/10 LF pairs. This self-awareness improves credibility.


    **S5. Student-exceeds-teacher framing is appropriately restrained.** (R1)

    The +2pp probe-over-oracle result is not overclaimed; the paper correctly notes
    the weak effect size and provides a plausible mechanism.


    ---


    ## 3. Consolidated Weaknesses


    ### Major


    **W1. Temporal label model novelty is overstated and empirically fragile.** (R1
    W1 + R2 W1 — unanimous)


    The paper''s primary methodological claim is a temporal-aware label aggregation
    method. However:

    - **Empirical fragility**: Table 4 reveals the gain is almost entirely concentrated
    in 2 of 10 possible LF pairs (cmd_rep–outcome_bp: −2.5pp when ablated; div_drop–outcome_bp:
    −1.2pp). All other pairs contribute only −0.4pp combined. Table 2 confirms only
    2/10 pairs show statistically significant temporal separation. As R1 notes, this
    may reduce to "reweight outcome_bp higher" rather than a general temporal modeling
    contribution.

    - **Insufficient novelty differentiation**: R2 identifies critical missing citations
    — position-dependent weighted voting is a known design pattern. Safranchik et
    al. (2020, "Weakly Supervised Sequence Tagging from Noisy Rules," AAAI), Lison
    et al. (2021, "skweak," ACL), and Snorkel MeTaL (Ratner et al., 2019) all handle
    temporal/sequential structure in labeling functions. The paper does not cite or
    differentiate from these directly competing methods. R1 concurs this gap is substantive.


    *Roundtable consensus*: The framework is presented at a generality the evidence
    does not support. The contribution should be reframed as a domain-specific temporal
    heuristic for a narrow set of LF interactions, or the empirical scope must be
    expanded.


    **W2. Outcome backpropagation creates a near-circular dependency that is insufficiently
    addressed.** (R1 W2 — R2 adopts as co-major after cross-sharing)


    outcome_bp uses trajectory-final exit context to retrospectively label earlier
    windows. It accounts for ~44–50% of the gap over MV baseline (Table 13: −3.5pp
    hold-one-out; Table 12: −4pp full holdout). Critical concerns:

    - At inference time on live agents, outcome_bp is unavailable, yet the paper''s
    deployment claim is real-time monitoring.

    - The "last-3-only" variant (Table 12, −2pp) still contributed to temporal model
    calibration during training — this is not a clean zero-outcome_bp simulation.

    - The temporal LM''s gain vs MV drops from +6pp to +2pp without outcome_bp (Table
    12), meaning roughly half the temporal LM''s value derives from a LF with potential
    information leakage.

    - R2 raises the additional concern: the +2pp probe-over-oracle effect may partly
    reflect the probe implicitly learning to replicate outcome_bp''s signal from context
    rather than genuine generalization. A train-without-outcome_bp ablation is conspicuously
    absent.


    **W3. Related work is severely incomplete.** (R2 W2 — R1 concurs after cross-sharing)


    Only 11 papers are cited — anomalously sparse for a top venue submission. Critical
    omissions identified by R2:

    - Sequential weak supervision: Safranchik et al. (2020), Lison et al. (2021),
    the broader structured label model literature

    - Snorkel MeTaL (Ratner et al., 2019): HMM-based label models handling sequential
    dependencies

    - WS survey literature (Zhang et al., 2022)

    - Extended PRM work (OmegaPRM, outcome-conditioned reward models)

    - Agent monitoring for embodied/game agents (ALFRED, BabyAI)

    - LLM-as-judge beyond Zheng et al. (Prometheus, calibration-aware judge variants)


    ### Moderate


    **W4. Gold set insufficient for claimed precision of results; no confidence intervals.**
    (R1 W3 + R2 W5 — unanimous)


    The gold evaluation set is 400 windows with κ=0.68 overall (borderline "substantial"),
    including 18% ambiguous windows with κ=0.45. Key comparisons (Probe 0.80 vs LF
    Oracle 0.78 = +2pp; Probe 0.80 vs Claude CoT 0.82 = −2pp) are made without confidence
    intervals. At n=400, the 95% CI on macro-F1 is likely ±3–5pp, rendering these
    differences statistically indistinguishable from noise. Multi-seed stability (Table
    9) is reported on the auto-labeled set, not the gold set. Both reviewers flag
    this as a significant methodological gap.


    **W5. Cross-agent transfer degradation undermines generalization claims.** (R1
    W4 + R2 W4 — unanimous)


    The SWE-agent→OpenHands transfer shows −9pp probe degradation (0.80→0.71) and
    −14pp LF oracle degradation. The absolute cross-agent F1 of 0.71 is below practical
    deployment thresholds. No adaptation or domain-shift mitigation strategy is proposed.
    A pooled multi-agent training experiment (train on SWE-agent + OpenHands subset)
    is a notable missing experiment that would substantiate the practical relevance
    claim.


    **W6. "Violation of i.i.d." framing is partially overstated.** (R2 W3)


    FlyingSquid already models LF dependencies via triplet methods. The paper''s i.i.d.
    critique specifically concerns temporal ordering, not LF correlation per se, but
    this distinction is not cleanly drawn. With 80% of LF pairs showing no meaningful
    temporal dynamics, the i.i.d. violation is pair-specific rather than structural.
    The paper should distinguish between temporal autocorrelation, leading/lagging
    relationships, and non-stationarity of LF reliability.


    ### Minor


    **W7. Claude CoT comparison underspecified.** (R1 W5 — R2 considers less critical)

    Model version, prompt template, and temperature are not specified. The 0.82 figure
    is near the gold ceiling given κ=0.68. Prompt sensitivity not explored.


    **W8. Architecture motivation thin.** (R1 W6)

    Why GRU outperforms Transformer on k=5 sequences is not discussed. GRU+Attn +0.6pp
    significance not tested.


    **W9. "Semantic stagnation" lacks formal definition.** (R2 M2)

    The term is introduced informally. A precise definition in terms of task-graph
    non-advancement or reward stagnation would strengthen the problem statement.


    **W10. Inference latency claim (4ms) should clarify scope.** (R1 M5)

    The frozen encoder (Qwen3-Embedding-0.6B, ~600M params) dominates the computational
    graph. Whether 4ms includes encoder forward pass, and on what hardware, should
    be specified.


    ---


    ## 4. Key Questions for Authors


    **Q1** (W1): Can you provide an ablation where temporal weighting is applied *only
    to LF pairs not involving outcome_bp*? This isolates whether the temporal framework
    provides benefit beyond outcome_bp reweighting.


    **Q2** (W2): Has a train-without-outcome_bp condition been evaluated? The current
    holdout experiments (Table 12) may understate the probe''s training-time dependence
    on outcome_bp.


    **Q3** (W3): How does the temporal label model differ from Snorkel MeTaL''s HMM-based
    structured label model and from Safranchik et al. (2020)?


    **Q4** (W4): Can you provide bootstrap 95% CIs on key gold set comparisons (Probe
    vs LF Oracle, Probe vs Claude CoT)?


    **Q5** (W5): Have you attempted pooled multi-agent training (SWE-agent + OpenHands
    subset) to evaluate whether cross-agent degradation is recoverable?


    **Q6** (W6): What specifically in the i.i.d. assumption is violated that FlyingSquid''s
    dependency graph cannot capture — temporal ordering, non-stationarity, or autocorrelation?


    ---


    ## 5. Experiment Coverage Assessment


    Relative to the experiment design reference (16 planned experiments), the paper
    covers all 16 plus 3 additional experiments (LF temporal dynamics, human annotation
    protocol, early termination simulation). Coverage is comprehensive. The missing
    elements are not additional experiments but rather **statistical depth** (confidence
    intervals, significance tests) and **ablation completeness** (train-without-outcome_bp).


    ---


    ## 6. Scores and Consensus


    | Reviewer | Independent Score | Post-Roundtable Score | Confidence |

    |----------|------------------|-----------------------|------------|

    | R1 (Method + Experiments) | 3 (Weak Reject) | 3 (Weak Reject) | 4/5 |

    | R2 (Novelty + Related Work) | 3 (Weak Reject) | 3 (Weak Reject) | 4/5 |


    **Consensus Score: 3 — Weak Reject**


    ### Roundtable Convergence Notes


    Both reviewers converged independently on:

    - The temporal LM''s empirical fragility (gain from 2 LF pairs) as the paper''s
    most serious vulnerability

    - The outcome_bp circularity concern (R1 raised; R2 adopted as co-major after
    cross-sharing)

    - The need for confidence intervals on gold set comparisons

    - Cross-agent degradation as a genuine scope limitation


    The reviewers complement each other: R1 provides sharper experimental methodology
    critique (outcome_bp circularity, gold set CI, Claude CoT controls); R2 provides
    the novelty and positioning critique (missing sequential WS citations, i.i.d.
    framing). Combined, these represent both empirical and conceptual shortcomings.


    No disagreements reached impasse. R2 considers the Claude CoT comparison issue
    (R1 W5) less critical than R1 does; R1 concurs with R2''s related work concerns
    but did not independently identify them.


    ---


    ## 7. Overall Assessment


    **ProgressProbe addresses a genuine problem with above-average experimental discipline.**
    The ablation coverage is impressive, the cost-efficiency result is practically
    compelling, and the limitations section is commendably honest. The paper has clear
    applied value as a lightweight, deployable progress estimator.


    **However, the core technical novelty claim — temporal-aware label aggregation
    — is not adequately supported.** The gain traces to 2 LF pairs involving outcome_bp,
    the temporal LM is not differentiated from existing sequential weak supervision
    methods, and the related work is critically incomplete. The gold set evaluation
    lacks the statistical rigor (confidence intervals) needed to substantiate the
    claimed 1-2pp margins. The outcome_bp circularity raises deployment validity concerns
    that are not fully resolved.


    **Path to acceptance**: (a) Engage thoroughly with sequential WS literature and
    articulate a precise technical delta; (b) provide bootstrap CIs on all gold set
    comparisons; (c) include a train-without-outcome_bp ablation; (d) reframe the
    temporal LM contribution as a domain-specific insight rather than a general methodology;
    (e) either add pooled cross-agent training or narrow the scope claim. With these
    revisions, the paper could reach Weak Accept or Accept.


    ---



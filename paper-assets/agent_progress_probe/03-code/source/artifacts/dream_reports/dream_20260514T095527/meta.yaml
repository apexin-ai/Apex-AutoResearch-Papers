  review_report: "---\ndream_id: dream_20260514T095527\ntier: worst\noverall_score:\
    \ 3/6 Weak Reject\ntimestamp: 2026-05-14T10:59:33.557978+00:00\n---\n\n# Consolidated\
    \ Review Report\n\n**Paper:** \"When Data Programming Meets Agent Trajectories:\
    \ An Empirical Study of Weak Supervision Failure Modes for Progress Stagnation\
    \ Detection\"\n\n**Review Mode:** Full (2 Reviewers + Roundtable)\n\n---\n\n##\
    \ Meta-Review Summary\n\nTwo reviewers independently assessed this paper — R1\
    \ focusing on Methods & Experiments, R2 on Novelty & Related Work. Both converged\
    \ on **Score: 3/6 (Weak Reject)** with high confidence (4/5). The roundtable discussion\
    \ reinforced rather than resolved the core concerns. Below is the consolidated\
    \ assessment.\n\n---\n\n## Overall Assessment\n\n**Score: 3 / 6 (Weak Reject)**\n\
    **Confidence: 4 / 5**\n\nThe paper tackles a genuine and well-motivated problem\
    \ (progress stagnation detection in LLM agent trajectories) with commendable intellectual\
    \ honesty — openly reporting that all four original hypotheses failed and reframing\
    \ as an empirical study. Experimental coverage is exceptional (18+ experiments).\
    \ However, the paper falls below the acceptance threshold for a top ML venue (~25%\
    \ acceptance) due to: (1) a weak gold set that undermines all central comparisons,\
    \ (2) novelty below threshold with critical related work gaps, (3) failure-mode\
    \ analysis that stops at \"what\" without reaching \"why,\" and (4) absent statistical\
    \ rigor throughout.\n\n---\n\n## Strengths\n\n### Shared (Both Reviewers)\n\n\
    - **S1. Intellectual honesty is rare and valuable.** Transparently reporting four\
    \ failed hypotheses and reframing contributions around understanding *why* they\
    \ failed is commendable. This level of honesty should be encouraged in the community.\n\
    \n- **S2. Exceptional experimental coverage.** 18+ experiments covering label\
    \ models, LF dynamics, outcome leakage, cross-agent transfer, LLM-as-judge comparison,\
    \ error analysis, GRU noise robustness, 6 ablation dimensions, early termination\
    \ simulation, and interpretability. This breadth well exceeds the average submission.\n\
    \n- **S3. The outcome_bp sensitivity analysis is thorough and informative.** Quantifying\
    \ the leaky-heuristic trap (7.4pp F1 drop on hold-out, 31% window coverage, marginal\
    \ contribution 0.074 — more than double the next LF) is a genuinely useful cautionary\
    \ finding for the weak supervision community.\n\n- **S4. Practical cost-accuracy\
    \ positioning.** The 615× cost and 667× speed advantage of the probe over LLM-as-judge,\
    \ while the probe loses on accuracy, provides actionable deployment guidance.\
    \ The paper appropriately caveats this as the probe's *only* remaining advantage.\n\
    \n### R1-Specific\n\n- **S5. LF temporal dynamics analysis provides mechanistic\
    \ insight.** The characterization of leading/lagging LF behavior (command_repetition\
    \ leads by 1.8 steps, outcome_bp lags by 2.1 steps) and the explanation that high\
    \ autocorrelation (0.72–0.85) dilutes temporal signal within k=5 windows is plausible\
    \ and empirically grounded.\n\n- **S6. Error analysis adds diagnostic value.**\
    \ Table 13's breakdown (semantic-diverse stagnation 33% of FN, conf=1 region 31%\
    \ of FP) provides actionable understanding of failure boundaries.\n\n### R2-Specific\n\
    \n- **S7. Cross-agent transfer failure is genuinely informative.** The 29.4pp\
    \ F1 drop from SWE-agent to OpenHands exposes a real limitation other researchers\
    \ would benefit from knowing before attempting similar approaches.\n\n- **S8.\
    \ Stagnation taxonomy.** The three-way decomposition (repetitive, exploratory,\
    \ partial-progress) provides a useful conceptual framework for the community.\n\
    \n---\n\n## Weaknesses\n\n### Critical (Both Reviewers Converge)\n\n- **W1. Gold\
    \ set is inadequate for the claims made.** N=420 windows with Fleiss κ=0.52 (moderate\
    \ agreement) fundamentally undermines all gold-set evaluations. Key comparisons\
    \ — HMM vs FlyingSquid (0.770 vs 0.772, Δ=0.2pp), probe vs LF oracle (0.720 vs\
    \ 0.745, Δ=2.5pp) — are well within the noise margin. At n=420 with moderate agreement,\
    \ bootstrap 95% CI on macro-F1 is approximately ±3–4pp, making several headline\
    \ comparisons statistically indistinguishable from zero. **No confidence intervals\
    \ or significance tests are reported for any comparison.** This is the paper's\
    \ most critical deficiency: the entire reframing as a failure-mode study depends\
    \ on these comparisons being meaningful, but the statistical evidence is absent.\n\
    \n- **W2. Failure-mode analysis lacks prescriptive depth.** The paper identifies\
    \ three failure modes but offers limited guidance on overcoming them. For temporal\
    \ autocorrelation: no mitigation tested (e.g., larger k, non-overlapping windows,\
    \ alternative HMM parameterizations). For outcome_bp dominance: the problem is\
    \ quantified but no alternative LF designs explored. For cross-agent transfer:\
    \ the analysis stops at reporting degradation without diagnosing root causes (distribution\
    \ shift? LF definition mismatch? action space differences?). A publishable negative-results\
    \ paper must diagnose *why* hypotheses fail and provide conditions under which\
    \ they might succeed or provably cannot. The paper stops at the \"what.\"\n\n\
    ### Major (R1)\n\n- **W3. Temporal dynamics circularity.** Stagnation onset is\
    \ defined by the same LFs whose temporal roles are being measured. If command_repetition\
    \ dominates majority-vote onset, its \"leading\" offset of −1.8 steps is partly\
    \ tautological. The paper does not validate temporal dynamics against human-annotated\
    \ onset windows.\n\n- **W4. Cross-agent evaluation ground truth is underspecified.**\
    \ Table 10 reports probe F1=0.612 on OpenHands, but the paper does not specify\
    \ what ground truth these predictions are evaluated against. If degraded LF labels\
    \ serve as ground truth (with LF coverage dropping to 82%), the reported F1 values\
    \ are unreliable and the \"severe degradation\" conclusion may partly reflect\
    \ LF transfer failure contaminating the evaluation itself.\n\n- **W5. Auto-gold\
    \ gap interpretation is incomplete.** The 18.5pp gap (auto 0.903 vs gold 0.718)\
    \ is attributed to \"overfitting to LF noise,\" but this conflates two phenomena:\
    \ (a) the probe learning LF heuristics rather than true progress signals, and\
    \ (b) distributional shift between auto-labeled test set and gold set. No oracle\
    \ upper bound (model trained on gold labels) is provided to disambiguate.\n\n\
    ### Major (R2)\n\n- **W6. Related work has critical gaps.** Only 11 references\
    \ — anomalously sparse. Most damaging omissions:\n  - **Sequential weak supervision:**\
    \ Safranchik et al. (2020, \"Weakly Supervised Sequence Tagging from Noisy Rules,\"\
    \ AAAI), skweak (Lison et al. 2021, ACL), Snorkel MeTaL (Ratner et al. 2019).\
    \ These directly address weak supervision on sequential data — the paper's core\
    \ claim is that DP fails on sequential data, yet it ignores prior work designed\
    \ for exactly this setting.\n  - **Noisy label learning:** DivideMix, co-teaching,\
    \ symmetric cross-entropy — the GRU noise robustness finding is not positioned\
    \ against this literature.\n  - **Process reward models beyond basic citations:**\
    \ OmegaPRM, GenPRM, automatic PRM training.\n  - **Online monitoring / anomaly\
    \ detection / change-point detection:** directly relevant to the real-time framing.\n\
    \  - **Agent evaluation benchmarks:** AgentBench, MINT, etc.\n\n- **W7. Novelty\
    \ is below threshold.** Decomposing claimed contributions: (a) window-level formulation\
    \ is standard sliding-window classification; (b) failure-mode characterization\
    \ is descriptive rather than analytical, lacking formal conditions or testable\
    \ predictions; (c) GRU noise robustness is well-studied in the noisy-label learning\
    \ literature. No single contribution clears the novelty bar for a top venue, and\
    \ the combination is thin.\n\n- **W8. Only 4 LFs is too narrow to generalize.**\
    \ The paper draws broad conclusions about when data programming fails on sequential\
    \ data, but the LF set is small, hand-crafted, and domain-specific. The failure\
    \ modes observed may be artifacts of this particular LF design rather than fundamental\
    \ properties of sequential weak supervision.\n\n### Moderate\n\n- **W9. Domain\
    \ specificity limits impact.** Both evaluations (SWE-agent, OpenHands) use SWE-bench\
    \ software engineering tasks. Generalization to other agent domains (web navigation,\
    \ embodied agents) is untested and acknowledged only as a limitation.\n\n- **W10.\
    \ Outcome_bp creates unresolved train-test mismatch.** At inference time on live\
    \ agents, trajectory outcome information is unavailable. The hold-out experiment\
    \ tests inference-time removal but not training-time removal. A probe trained\
    \ entirely without outcome_bp would be more realistic.\n\n---\n\n## Questions\
    \ for Authors\n\n1. **Statistical significance:** Can you report bootstrap 95%\
    \ CIs for the three central gold-set comparisons (HMM vs FlyingSquid, probe vs\
    \ LF oracle, probe vs LLM-as-judge)? At n=420 with κ=0.52, are any of these gaps\
    \ statistically significant?\n\n2. **Cross-agent ground truth:** What specific\
    \ ground truth is used for the OpenHands evaluation in Table 10? If LF-derived\
    \ labels, how do you account for the documented LF coverage collapse?\n\n3. **Temporal\
    \ dynamics circularity:** Have you validated LF temporal dynamics (Table 7) against\
    \ human-annotated stagnation onset windows, even on a subset?\n\n4. **Sequential\
    \ WS baselines:** How do you position against Safranchik et al. (2020) and skweak,\
    \ which explicitly handle sequential structure in weak supervision? Does their\
    \ approach also fail on agent trajectories?\n\n5. **Oracle upper bound:** Can\
    \ you report performance of a model trained on gold labels to disambiguate whether\
    \ the auto-gold gap reflects LF noise overfitting vs. distributional shift?\n\n\
    6. **Alternative HMM parameterizations:** Did you try CRF, higher-order Markov\
    \ models, or transition matrices conditioned on LF agreement level? The HMM's\
    \ failure may be parameterization-specific rather than fundamental.\n\n7. **LLM-as-judge\
    \ distillation:** Have you explored training the probe on LLM-generated labels\
    \ rather than WS labels? This would test whether the architecture or the label\
    \ quality is the bottleneck.\n\n8. **Error-disagreement overlap:** What fraction\
    \ of the 112 probe errors fall in gold-set disagreement windows? If high, some\
    \ \"errors\" may reflect annotation noise rather than model failure.\n\n9. **Why\
    \ only 4 LFs?** The DP literature suggests 10–100+ LFs for robust label models.\
    \ Would the failure modes persist with a richer LF set?\n\n---\n\n## Minor Issues\n\
    \n- Table 3 mixes label model accuracy and model predictions without clear visual\
    \ separation — these are fundamentally different evaluation modes.\n- \"Macro-F1\"\
    \ and \"F1\" used interchangeably despite class imbalance (38% stagnation prevalence).\n\
    - Table 14's finding that conf≥1 training *increases* gold F1 by 1.5pp while decreasing\
    \ auto F1 by 5.9pp is potentially the most interesting result but receives minimal\
    \ discussion. It partially contradicts the \"label quality > quantity\" narrative.\n\
    - SupCon (+0.3pp on gold) does not justify its complexity; should be clearly relegated\
    \ to appendix.\n- LLM-as-judge setup underspecified (model version, prompt template,\
    \ temperature, sampling strategy).\n- \"Semantic stagnation\" introduced without\
    \ formal definition or mapping to existing agent failure taxonomies.\n- The paper's\
    \ title promises \"Failure Modes\" but the analysis is more descriptive than diagnostic.\n\
    \n---\n\n## Experiment Coverage Assessment\n\nComparing against the full experiment\
    \ plan (18 imagined experiments):\n\n| Experiment | Covered? | Notes |\n|---|---|---|\n\
    | probe-multiseed | ✓ | Table 4, 3 seeds |\n| cosinesim-check | ✓ | Table 20,\
    \ threshold sweep |\n| probe-002 (conf≥1 vs conf≥2) | ✓ | Table 14 |\n| baseline-lf-oracle\
    \ | ✓ | Table 3 |\n| baseline-llm-judge | ✓ | Table 12, 7 configurations |\n|\
    \ baseline-meanpool-lr | ✓ | Table 15 |\n| error-analysis | ✓ | Table 13 |\n|\
    \ cross-agent | ✓ | Tables 10, 11 |\n| temporal-label-model | ✓ | Tables 5, 6\
    \ |\n| flyingsquid-baseline | ✓ | Table 5 |\n| outcome-bp-sensitivity | ✓ | Tables\
    \ 8, 9 |\n| ablation-window-size | ✓ | Table 16 |\n| ablation-architecture | ✓\
    \ | Table 17 |\n| ablation-lf-holdout | ✓ | Table 9 |\n| ablation-supcon | ✓ |\
    \ §5.10 |\n| non-nlp-baseline | ✓ | Table 3 (Structural GBT) |\n| encoder-ablation\

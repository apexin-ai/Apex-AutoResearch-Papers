    # Dream Review Report: Temporal Label Models for Estimating Progress in LLM Agent
    Trajectories


    **Dream ID:** 20260514T095527

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-14


    ---


    ## Roundtable Summary


    Two reviewers independently assessed this paper — R1 focusing on Methods and Experiments,
    R2 on Novelty and Related Work. Both converged on **Weak Accept (4/6)**, agreeing
    that the temporal label model is a genuine methodological step up from prior work
    with thorough experimental support, but that novelty is incremental, a circularity
    concern in the core temporal dynamics analysis is inadequately addressed, and
    significant related work is missing.


    ---


    ## R1 Review: Methods and Experiments


    ### Summary

    The paper proposes a Temporal Label Model (TLM), an HMM that models leading/concurrent/lagging
    temporal roles of labeling functions on sequential agent trajectory data, and
    a lightweight GRU probe (ProgressProbe) trained on TLM labels for detecting semantic
    stagnation. On a 412-window human gold set (κ=0.82), TLM improves label quality
    by 12.2pp over majority vote and 5.9pp over FlyingSquid, while ProgressProbe achieves
    0.858 macro-F1, outperforming the LF oracle by 6.0pp and LLM-as-judge (CoT) by
    4.5pp at 690× lower latency.


    ### Strengths


    1. **Well-motivated temporal label model with clean ablation ladder.** The MV
    → FlyingSquid → TLM progression provides a clear ablation of what temporal modeling
    adds beyond correlation-aware aggregation. The +5.9pp over FlyingSquid specifically
    isolates the temporal modeling contribution.


    2. **Unusually comprehensive experiments.** The paper covers ~20 anticipated reviewer
    concerns: multi-seed stability, outcome leakage sensitivity, data scaling, encoder
    ablation, LF hold-one-out, architecture ablation, window size sweep, non-NLP structural
    baseline, CosineSim threshold analysis, full-data (conf≥1) training, error analysis,
    interpretability, and early termination simulation. This is well above average
    for a submission.


    3. **Compelling cross-agent transfer asymmetry.** The probe degrading by only
    −6.7pp vs. the LF oracle collapsing by −21.6pp when transferring from SWE-agent
    to OpenHands is the paper''s most convincing result. The per-LF breakdown (command_repetition
    to 0.491, edit_churn to 0.385) provides mechanistic explanation.


    4. **Honest outcome leakage treatment.** The paper directly addresses the potential
    information leakage from outcome_backpropagation with hold-out analysis (−1.2pp)
    and last-N-only variants (−0.4pp), demonstrating the signal is largely redundant
    with leading/concurrent LFs.


    5. **Strong gold set design.** 412 windows, 3 annotators, Fleiss'' κ=0.823 with
    91% majority agreement. Disagreements localized to transition boundaries (±1 step
    from onset/offset), which is expected and informative.


    ### Weaknesses


    1. **Circularity in Table 1 temporal dynamics analysis.** Stagnation onset is
    defined by the same LFs whose temporal roles are being measured. If command_repetition
    dominates the majority-vote onset definition, its "leading" role (−1.82 steps)
    is partly tautological — it fires first because it partly defines when onset occurs.
    The paper should validate temporal dynamics against human-annotated onset windows,
    even on a subset.


    2. **Gold set overuse without confidence intervals.** The 412-window gold set
    simultaneously serves as: evaluation benchmark, TLM validation target, ablation
    basis, error analysis sample, and interpretability visualization source. No bootstrap
    confidence intervals are reported for any comparison on this set. With N=412,
    the 95% CI for a macro-F1 of 0.858 is roughly ±0.03, which overlaps with several
    baselines. McNemar''s test or paired bootstrap should be used for the central
    claims (TLM vs. FlyingSquid, probe vs. LF oracle, probe vs. LLM-as-judge).


    3. **Unclear OpenHands ground truth.** Table 5 reports F1 on OpenHands trajectories,
    but the paper never specifies what ground truth these predictions are evaluated
    against. Since the LFs are shown to degrade catastrophically on OpenHands (command_repetition
    F1=0.491), LF-derived labels cannot serve as reliable ground truth. Is there a
    separate human annotation set for OpenHands? If evaluation uses degraded LF labels,
    the reported F1 values are unreliable.


    4. **Missing significance tests on central comparisons.** The paper reports no
    statistical significance tests for its three headline claims: TLM vs. FlyingSquid
    (+5.9pp), probe vs. LF oracle (+6.0pp), probe vs. LLM-as-judge (+4.5pp). On a
    412-window gold set, these gaps may or may not be statistically significant. Paired
    bootstrap or McNemar''s test is standard practice.


    5. **TLM mathematical formulation is informal.** For a methods contribution, Section
    3.4 describes the HMM in bullet points without formal equations for the transition
    matrix, emission model, or inference procedure. The emission model description
    — "Each LF''s vote is conditioned on the hidden state and its learned temporal
    role. Leading LFs receive upweighted influence near state transitions" — leaves
    the parameterization unclear.


    ### Questions for Authors


    1. Can you report temporal dynamics (Table 1 offsets) using human-annotated onset
    windows from the gold set, even on the available subset?

    2. What is the ground truth for the OpenHands cross-agent evaluation in Table
    5?

    3. Can you provide bootstrap 95% CIs for the main comparisons on the gold set?

    4. The "static baseline" in the ΔBIC=−342.7 comparison — is this a time-invariant
    HMM, FlyingSquid, or MV? The interpretation differs substantially.

    5. What is the class distribution in conf=1 vs. conf≥2 regions? If conf=1 is heavily
    skewed, TLM''s improvement could partly reflect better prior estimation rather
    than temporal modeling.

    6. Table 6 shows GRU+mean-pool (0.902) and Transformer (0.908) only on conf≥2,
    with no conf≥1 or gold set numbers. Were these evaluated on the gold set? If so,
    what are the numbers?


    ### Missing Experiments or Analysis


    - Bootstrap CIs or McNemar''s test on all gold set comparisons

    - Temporal dynamics validated on human-annotated onsets

    - OpenHands ground truth specification and potentially a small human-annotated
    OpenHands gold set

    - Per-class (progress/stagnation) F1 breakdown for TLM vs. MV vs. FlyingSquid
    on gold set

    - Learning curves for the TLM itself (how many trajectories needed for EM convergence?)


    ### Minor Issues


    - Table 7 reports parameter counts for GRU+attention (847K) and Transformer (2.13M),
    but not for GRU+mean-pool or MLP — inconsistent.

    - Section A.2 and A.3 headers ("Encoder Ablation", "LF Hold-One-Out") appear but
    have no text — only tables. These should have at least a brief description.

    - The paper uses "macro-F1" and "F1" interchangeably in some places. Given class
    imbalance (248:164), standardize to "macro-F1."


    ### Confidence Score

    4


    ### Preliminary Score

    Score: 4 — Thorough experimental work with a well-motivated temporal label model,
    but circularity in the core dynamics analysis, missing significance tests, unclear
    OpenHands ground truth, and informal method formalization prevent a confident
    accept.



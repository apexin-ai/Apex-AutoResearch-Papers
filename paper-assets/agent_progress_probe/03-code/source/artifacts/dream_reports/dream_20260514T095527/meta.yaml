    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper proposes a Temporal Label Model (TLM), an HMM-based extension of data
    programming that models leading/concurrent/lagging temporal roles of labeling
    functions on sequential agent trajectory data, combined with a lightweight GRU
    probe (ProgressProbe) for detecting semantic stagnation. The core novelty claim
    is that standard weak supervision violates i.i.d. assumptions on sequential data
    and that explicitly modeling LF temporal dynamics yields substantially better
    label aggregation (+12.2pp over majority vote, +5.9pp over FlyingSquid). The "student
    exceeds teacher" finding (+6.0pp over LF oracle) and cross-agent transferability
    (+14.9pp advantage over LF oracle in degradation gap) are positioned as empirical
    validation of the learned representations.


    ### Strengths


    1. **The temporal label model is a genuine methodological contribution.** Unlike
    vanilla majority vote, TLM addresses a real gap: standard data programming assumes
    i.i.d. data points, but LFs on sequential agent data fire at systematically different
    temporal offsets. Modeling this via an HMM with emission roles tied to LF temporal
    dynamics is a principled and non-obvious extension. The +5.9pp improvement over
    FlyingSquid — which already models LF correlations but not temporal structure
    — provides clean evidence that temporal modeling adds value beyond correlation-aware
    aggregation.


    2. **The empirical characterization of LF temporal dynamics is rigorous and actionable.**
    The analysis over 3,847 stagnation onset windows with statistical testing (p<0.001
    for leading/lagging roles, Granger causality confirmation) elevates this from
    descriptive observation to prescriptive methodology.


    3. **"Student exceeds teacher" is well-supported and meaningful.** The +6.0pp
    gap over the LF oracle on a human gold set (κ=0.82) is practically significant.
    The explanation — that the probe leverages embedding-space patterns in the conf=1
    region where individual LFs are unreliable — is mechanistically plausible.


    4. **Cross-agent transfer provides strong generalization evidence.** The asymmetry
    between probe degradation (−6.7pp) and LF oracle degradation (−21.6pp) is the
    paper''s most convincing result. The per-LF breakdown provides mechanistic explanation.


    5. **Comprehensive experimental design with appropriate controls.** FlyingSquid
    baseline, LLM-as-judge with CoT variants, encoder ablation, multi-seed stability,
    outcome leakage analysis — the experimental coverage is thorough and well-organized.


    6. **The cost-accuracy Pareto argument is compelling.** 690× faster and ~690×
    cheaper than LLM-as-judge while achieving +4.5pp higher F1 is a clear practical
    contribution.


    ### Weaknesses


    1. **TLM is a relatively straightforward HMM application, and the novelty may
    be narrower than claimed.** The method is a 2-state HMM with EM training — a textbook
    model. The "temporal label model" framing suggests a general framework, but the
    paper demonstrates it only on 4 hand-crafted LFs in one domain with a binary classification
    task. The paper should formalize what makes TLM different from simply running
    an HMM on LF outputs.


    2. **Circularity concern in LF temporal dynamics measurement remains partially
    unresolved.** Stagnation onset is defined by the same LFs whose temporal roles
    are being measured. The paper should explicitly address this circularity, ideally
    by reporting temporal dynamics relative to human-annotated onset windows.


    3. **The generalization claim for TLM "beyond agent monitoring" is unsupported.**
    Section 6 claims TLM applies to "any weak supervision task on time series, event
    logs, or dialogue." This is speculative — no evidence is provided. Either demonstrate
    on a second task or substantially tone down the claim.


    4. **Two agents in one domain is narrow for the transferability claim.** SWE-agent
    and OpenHands both operate on SWE-bench software engineering tasks with similar
    action spaces. This tests format robustness, not domain generalization. The claim
    should be scoped to "cross-implementation transfer within a single task domain."


    5. **The relationship to Process Reward Models needs deeper treatment.** PRMs
    can also be trained with outcome-based supervision without per-step labels (Math-Shepherd).
    The paper should address whether an outcome-supervised PRM could match ProgressProbe,
    and what the window-level formulation buys over aggregated step-level PRM scores.


    6. **HMM-based label models have been explored in adjacent areas but are not cited.**
    The crowdsourcing literature has explored HMM-based sequential label aggregation
    models (Nguyen et al. 2017, Simpson & Gurevych 2019, Rodrigues et al. 2018). These
    model annotator temporal dependencies in sequence labeling and are direct precursors.


    ### Questions for Authors


    1. How does the temporal dynamics analysis change when stagnation onset is defined
    by human annotations rather than LF majority vote?

    2. What is the "static baseline" in the BIC comparison (ΔBIC = −342.7)?

    3. How exactly is the temporal role parameterized in the emission model?

    4. What is the class distribution in conf=1 vs. conf≥2 regions?

    5. In the cross-agent experiment, is TLM retrained on OpenHands LF votes, or is
    the evaluation purely zero-shot on the probe side?

    6. Could you report per-class F1 for TLM vs. MV labels on the gold set?

    7. Given outcome_bp''s minimal contribution (−1.2pp when held out) and potential
    leakage, why include it at all?


    ### Missing Related Work


    1. **Sequential crowdsourcing and annotator models:** Nguyen et al. (2017), Simpson
    & Gurevych (2019), Rodrigues et al. (2018) — model annotator temporal dependencies
    in sequence labeling, directly analogous to modeling LF temporal roles.

    2. **Temporal extensions of data programming:** Varma & Ré (2018) Snuba; any work
    on applying Snorkel to sequential/temporal data. The claim of being the first
    temporal extension needs verification.

    3. **Automatic PRM training:** Math-Shepherd, GenPRM, OmegaPRM — reduces annotation
    cost similarly.

    4. **Agent trajectory evaluation benchmarks:** AgentBench, MINT, SWE-bench Verified.

    5. **Stagnation/deadlock detection in classical agent systems:** Livelock detection
    in planning/robotics.

    6. **Noisy label learning:** DivideMix, co-teaching, symmetric cross-entropy —
    alternatives at the model training stage.

    7. **Reward redistribution:** RUDDER, HCA — temporal credit assignment in sequential
    decision-making.


    ### Minor Issues


    - The abstract states "690× faster" and the LLM-as-judge table uses a single cost
    ($4.82/1k) for all LLM configurations. GPT-4o and Claude Sonnet have different
    pricing — note this approximation.

    - Table 2 mixes label model accuracy and model prediction F1 in the same column
    without clear delineation.

    - Section 3.4 (the core method) lacks formal equations for a methods paper.

    - References are thin at 16 entries (vs. 25–35 typical for this intersection).
    The missing related work above would naturally expand this.

    - Some bibliography entries are incomplete: Li et al. (2024) TrajAD and Zhang
    et al. (2024) SpecRA lack venue information. Citation existence should be verified.


    ### Confidence Score

    4


    ### Preliminary Score

    Score: 4 — The temporal label model is a meaningful methodological step up from
    vanilla majority vote, the empirical results are thorough with appropriate controls,
    and the cross-agent transfer result is genuinely informative. However, the TLM
    is a relatively standard HMM application, the generalization claims outrun the
    evidence (two agents, one domain), circularity in temporal dynamics measurement
    is inadequately addressed, and key related work (sequential crowdsourcing models,
    automatic PRM training, noisy label learning) is missing.



narrative_guidance: '核心假设（temporal label model 作为方法论贡献）不成立。Temporal label model 对比
  FlyingSquid 无显著优势（-2~+1pp）， 说明 LF 相关性建模已足够，时序动态不能转化为标签质量增益。outcome_bp 泄露严重（hold-out
  后 F1 下降 7-10pp），动摇标签可靠性。 Probe 在 gold set 上低于 LF oracle 或仅持平，student-exceeds-teacher
  不成立。LLM-as-judge CoT 在 gold set 上 明确优于 probe（gap 5-8pp），probe 仅剩成本优势。Cross-agent
  迁移退化严重（F1<0.65）。人工标注 κ<0.60 表明 stagnation 边界本身模糊。论文需从 method contribution 彻底 reframe
  为 empirical study：(1) 系统性揭示 data programming 在 agent trajectory 上的 failure modes（i.i.d.
  违反、LF 时序动态 characterization、outcome_bp 泄露量化）； (2) stagnation taxonomy + window-level
  formulation 作为 task contribution；(3) GRU 时序建模在高噪声标签上的鲁棒性 作为实证发现。目标 Findings of EMNLP，预期
  reviewer score 3.0-3.5。

  '

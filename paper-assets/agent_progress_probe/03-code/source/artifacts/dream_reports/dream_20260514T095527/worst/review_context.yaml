  plan_id: lf-temporal-dynamics
  description: LF temporal dynamics：哪个 LF 在 stagnation onset 最先亮灯
  expected_results:
    command_repetition_lead_steps: 1.8
    output_similarity_lead_steps: 0.5
    edit_cycle_lead_steps: 0.2
    outcome_bp_lag_steps: 2.1
    cmd_rep_is_leading: true
    outcome_bp_is_lagging: true
    temporal_correlation_cmd_rep_outcome_bp: 0.38
    temporal_autocorrelation_lag1_cmd_rep: 0.72
    temporal_autocorrelation_lag1_outcome_bp: 0.85
    lf_transition_consistency: 0.61
  result_rationale: 'LF temporal dynamics 分析确认了预期的 leading/lagging 结构：command_repetition
    在 stagnation onset 前 ~1.8 steps 就开始触发（leading indicator），而 outcome_bp 在 onset
    后 ~2.1 steps 才触发（lagging indicator，因为需要看到最终结果才能回传）。这个分析本身是有价值的——但问题在于 这个时序结构未能被
    temporal label model 有效利用（vs FlyingSquid 无显著差异）。原因分析： LF 的时序自相关很高（cmd_rep lag-1:
    0.72, outcome_bp lag-1: 0.85），意味着在 window 级别 它们的值变化缓慢，leading/lagging 的差异在 5-step
    窗口内被 smoothing 掉。LF 间的 transition consistency 仅 0.61——不够强以支撑可靠的时序标签调整。

    '

    上 offset=-1.2 （relative to human onset）——方向一致但幅度缩小。这是因为 LF-derived onset 定义比 human
    onset 更 sharp（binary threshold），而 gold onset 更渐进。 OB 在 gold 上 offset=+5.3（vs LF-eval
    上 +6.7），缩小因为 gold-defined stagnation windows 通常更长（人类标注的 stagnation 包含了 LFs 未标记的"尾部"）。
    关键 caveat：52% 的 ±2 步对齐意味着 onset prediction 只是粗略指示，不适合作为 intervention trigger。


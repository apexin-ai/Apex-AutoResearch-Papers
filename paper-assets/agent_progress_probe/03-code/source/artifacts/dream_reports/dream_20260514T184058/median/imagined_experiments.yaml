    接近随机（median 范围 [0.42, 0.58]），因为单个 LF 信号不足以可靠判断—— 尤其 cmd_rep 在 conf=1 中贡献最多但 FP
    率最高。 LF recall_stag 偏低（0.63）是关键发现：LFs 系统性遗漏约 37% 的人类标注 stagnation， 这些遗漏即"语义残差"——结构特征看不到的停滞类型。

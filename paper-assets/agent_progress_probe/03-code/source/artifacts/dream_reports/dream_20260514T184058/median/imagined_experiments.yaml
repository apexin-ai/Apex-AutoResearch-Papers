    中段 经常出现"尝试新方向"vs"继续停滞"的模糊过渡，probe 的 window-level 分类无法准确捕获 这种渐变。cmd_rep-dominant
    stagnation 最容易（0.90），因为 embedding 中的 token repetition pattern 最易被 GRU 学习。OB-dominant
    最难（0.72）因为 OB 是 lagging signal， stagnation window 的 OB fire 来自未来的 outcome 信息，probe
    在 inference 时看不到 outcome。 Multi-signal stagnation 最高（0.94）因为 all-3-agree 的窗口标签最干净、pattern

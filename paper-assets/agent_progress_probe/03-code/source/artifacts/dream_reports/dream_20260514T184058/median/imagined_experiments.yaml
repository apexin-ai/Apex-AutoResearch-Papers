- name: gold-temporal-validation
  plan_id: gold-set
  description: '在 gold 标注的 stagnation onset 边界上验证 LF temporal dynamics。 人类标注 stagnation
    起始步，与 LF first-fire 步进行对齐分析。

    '
  expected_results:
    gold_annotated_onsets: 270
    onset_alignment:
      within_1_step_pct: 32
      within_2_steps_pct: 52
      within_3_steps_pct: 64
      mean_absolute_offset_steps: 2.8
      median_absolute_offset_steps: 2.0
      std_offset_steps: 2.1
    by_lf:
      cmd_rep:
        mean_offset_vs_gold: -1.2
        within_2_steps_pct: 48
        note: fires before human-perceived onset, moderate alignment
      file_diff:
        mean_offset_vs_gold: -0.6
        within_2_steps_pct: 56
        note: most aligned with human onset, slightly early
      outcome_bp:
        mean_offset_vs_gold: 5.3
        within_2_steps_pct: 22
        note: fires well after human-perceived onset, by design
    role_reversal_on_gold: 'Gold confirms cmd_rep leads on SWE-Agent (offset -1.2
      vs gold) but temporal  role reversal on OH cannot be validated (no OH gold set
      in this batch).

      '
    onset_timing_noise_caveat: ±2-3 step noise in onset alignment
  result_rationale: 'Overall onset alignment 52%（±2 步内）落在 median 范围 [40, 65] 中间。 低于
    65% 因为：(a) 人类判断的 stagnation onset 本质是主观的（"从哪一步开始不 productive" 没有客观答案），(b) LFs
    的 binary firing 是 threshold-based 的离散跳变，而人类感知的 onset 是渐进的，(c) OB（lagging LF）在
    stagnation 已经发生很久后才 fire，拉低 average。 高于 40% 因为 cmd_rep 和 file_diff 作为 leading
    LFs，在多数 structural stagnation 案例上 确实在人类感知 onset 附近 fire。file_diff 对齐最好（56% within
    ±2），因为"文件不再变化" 是人类和 LF 共同认可的最直观 stagnation 信号。这支持 Claim 2 但需要加 caveat： onset timing
    是统计趋势（±2-3 步），不是精确预测工具。

    '
  tables:

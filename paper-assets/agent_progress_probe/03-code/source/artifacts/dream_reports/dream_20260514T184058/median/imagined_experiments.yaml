        description: 'Agent 快速切换多种方法但都不 viable。结构上看像 productive exploration （命令多样、文件变化频繁），但实际是无方向的
          thrashing。

          '
        structural_f1: 0.18
        probe_f1: 0.24
        llm_judge_f1: 0.3
    semantic_residual_total: 78
    semantic_residual_pct_of_gold_stag: 28.9
    probe_captures_partial_pct: 12.3
    llm_captures_partial_pct: 18.7
    neither_captures_pct: 22.6
  result_rationale: '78/270（28.9%）的 gold stagnation 构成"语义残差"——structural features
    系统性 miss。 这些 stagnation 类型有共同特征：结构信号看起来像 progress（命令多样、有 file edit、 不触发 LF 阈值）。三种子类型反映不同的失败模式：
    (1) strategic_dead_end（39.7%）是最大类：agent 一条路走到黑，结构上完全正常， 只有理解 task intent 才能判断。LLM-judge
    在这类上最好（0.38）因为它能部分理解 intent； (2) implicit_repetition（30.8%）：语义层面的重复，但 cmd_rep
    LF 的 literal matching 抓不到。 Probe embedding 理论上能捕获语义相似度但实际没有，因为 embedding 编码的是
    step-level 文本 而非 action-level intent； (3) unfocused_exploration（29.5%）：结构特征最难的一类，因为高活跃度被误判为
    progress。 28.9% 的语义残差为 Claim 1 降级提供精确量化：structural features 捕获 71% 的真实 stagnation，
    但遗漏 29%。这不是 marginal gap——是结构方法论的固有 ceiling。

    '

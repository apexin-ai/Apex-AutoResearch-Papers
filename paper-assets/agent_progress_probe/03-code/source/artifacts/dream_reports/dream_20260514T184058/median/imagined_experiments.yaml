    stagnation 是 structural 的；但 human-recognizable stagnation 有额外的 语义维度，当前所有自动方法（structural、NL
    probe、LLM-judge）都未有效捕获。" 重要的是：probe 和 LLM-judge 在语义残差上也表现很差（F1 0.24-0.38），说明当前

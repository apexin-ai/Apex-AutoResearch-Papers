    定性分析预期：这些窗口中 agent 在做"看似活跃但语义空转"的操作（多样命令、有 file edit， 但 edit 内容无效）。LLM 能读懂 edit
    内容判断无效，而 LF 只看结构特征判定 progress。 然而 14.5% 的 "LLM wrong, LF correct" 表明 LLM 也有系统性偏差：
    倾向于将 verbose output（长 error messages、详细 traceback）误判为 stagnation。


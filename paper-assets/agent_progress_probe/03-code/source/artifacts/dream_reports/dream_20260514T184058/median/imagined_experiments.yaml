tier: median
narrative_guidance: 'Gold set 确认 LF labels 大方向正确但含系统性偏差。Claim 1 需降级：从 "stagnation
  signals ARE structural" 改为 "LF-approximated stagnation is structural; human-recognizable
  stagnation has additional semantic dimensions." Structural features 仍是最佳 practical
  选择（效率 + 跨域），但不再 claim 语义理解无价值——而是 claim 当前 NL 方法 尚未有效捕获语义残差。Claim 2 temporal dynamics
  加 caveat：onset timing 是统计趋势（±2-3 步噪声），非精确预测。 Claim 3 不变。标题从 "signals are structural"
  调整为 "structural features dominate current approaches"。 仍冲 EMNLP，contribution pitch
  从 "definitive finding" 转为 "strong empirical evidence with identified limitations"。

  '
imagined_experiments:
- name: gold-annotation-stats
  plan_id: gold-set
  description: '650 窗口人工标注基本统计：IAA、标签分布、置信度分层覆盖。 2 名标注者 per window，第 3 人仲裁分歧。分层采样自
    54809 总窗口。

    '
  expected_results:
    total_windows: 650
    sampling_strategy: stratified by LF confidence
    conf1_sampled: 250
    conf2_sampled: 340
    conf3_sampled: 60
    annotators: 3
    annotators_per_window: 2
    adjudication_method: 3rd annotator on disagreements
    inter_annotator_kappa: 0.67
    inter_annotator_pct_agreement: 0.81
    gold_stagnation_count: 270
    gold_progress_count: 380
    gold_stag_ratio: 0.415
    lf_stag_ratio_same_sample: 0.335
    annotation_time_per_window_min: 3.5
    total_annotation_hours: 38
  result_rationale: 'IAA κ=0.67（substantial agreement）反映 stagnation 判断的固有主观性：标注者对"结构性重复"（高一致）
    和"语义停滞"（低一致）的认知不同。Gold stag 比例（41.5%）高于 LF 标注（33.5%），因为人类识别出 LFs 遗漏的语义停滞——agent
    命令多样但逻辑循环。κ=0.67 落在 median 范围 [0.50, 0.72] 中偏高位， 反映标注者在 SE domain 有足够的 coding
    agent 经验来达成中等以上共识，但边界案例仍有分歧。

    '

- name: gold-structural-eval
  plan_id: gold-set
  description: '将已训练的 structural GB/RF/LR 模型在 650 gold 标签窗口上评估。 核心回答：structural features
    在真实标签上的性能 + circular eval 的真实影响。

    '
  expected_results:
    test_set: gold 650 windows
    structural_gb:
      macro_f1: 0.76
      accuracy: 0.78
      f1_stag: 0.71
      f1_prog: 0.81
    structural_rf:
      macro_f1: 0.74
      accuracy: 0.77
      f1_stag: 0.68
      f1_prog: 0.8
    structural_lr:
      macro_f1: 0.73
      accuracy: 0.76
      f1_stag: 0.67
      f1_prog: 0.79
    by_gold_confidence:
      conf_ge2:
        structural_gb_macro_f1: 0.82
        n: 400
      conf1:
        structural_gb_macro_f1: 0.67
        n: 250
    drop_from_lf_eval_pp: -21.9
    circular_eval_inflation_pp: 21.9
  result_rationale: 'Structural GB 从 LF-eval 的 0.9951 暴跌至 gold-eval 的 0.76（-21.9pp），直接量化了
    circular evaluation 的膨胀效应。这是 median 档的核心预期：structural features ≈ LF inputs，所以在
    LF labels 上近乎完美 是 artifact，但在 gold 上仍保持 0.76 说明结构信号有真实价值——不只是拟合 LF 规则。 0.76 落在
    median 范围 [0.68, 0.83] 中间。Conf≥2 上 GB 表现更好（0.82）因为这些窗口 LF 本身 82% 正确，structural
    features 在这些"LF 正确"的子集上性能保持。 Conf=1 上 GB 降至 0.67 但仍高于 LF 自身准确率（0.51），说明 GB 学到了超越单
    LF 规则的 smoother boundaries。RF 略低于 GB 因为 RF 的离散 splits 更容易过拟合 LF 的离散规则， 而 GB 的
    gradient boosting 有更好的正则化泛化。

    '
  tables:
  - name: 'Table: Structural Models on Gold vs LF Labels'
    columns:
    - Model
    - LF-eval F1
    - Gold-eval F1
    - Δ (pp)
    rows:

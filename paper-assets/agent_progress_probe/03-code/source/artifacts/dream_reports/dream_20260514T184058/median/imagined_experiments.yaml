    和 probe（-22pp）。这是因为 LLM-judge 本来就不拟合 LF labels，所以 circular eval 的去除 对它影响最小。但 LLM-judge
    仍排最末（0.60），因为 zero-shot prompting 缺乏： (a) 对 SWE-bench task 结构的先验知识（不知道什么 command
    pattern 意味着停滞）， (b) 窗口级时序 context（只看 5 步摘要，不理解 trajectory 动态）， (c) agent 架构特异性（不了解
    SWE-Agent vs OpenHands 的行为模式）。 8.2% 的窗口上 LLM-judge 对而 LF 错——这些是 LLM 的"语义理解"正确捕获的案例，
    但 14.5% 上 LLM 错而 LF 对，说明 LLM 的独立判断不够可靠。 Structural - LLM gap = 16pp 落在 median
    范围 [5, 20] 中间， 证明 structural efficiency advantage survives 但 accuracy advantage
    确实 weakens （从 LF-eval 的 33pp 降到 gold 的 16pp）。


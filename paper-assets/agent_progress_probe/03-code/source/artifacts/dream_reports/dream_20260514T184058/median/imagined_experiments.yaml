    上 Qwen/BGE/E5 差距小（±3.6pp），但 gold 上 BGE-m3 拉开优势。 这暗示 encoder 的泛化能力差异在 circular
    eval 中被压缩，gold 上才暴露。 Probe 的真实 contribution 不是超越 structural，而是提供 (a) end-to-end
    部署路径， (b) 在 conf=1 的语义歧义窗口上可能有互补价值（probe conf=1 F1=0.61 vs structural conf=1 F1=0.67，

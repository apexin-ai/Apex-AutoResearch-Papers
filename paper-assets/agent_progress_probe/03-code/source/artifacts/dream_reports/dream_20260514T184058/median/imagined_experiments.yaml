  - 'Feature importance on gold: structural GB 的 top-10 features 对比 LF-eval 的 feature
    importance 变化'
  analysis: 'Circular eval 膨胀 ~22pp 是论文最重要的方法论发现之一。但 structural features 在 gold 上仍为最高分
    （0.76 vs probe 0.69 vs LLM-judge 0.60），证明"structural features dominate current
    approaches" 这一降级后的 claim 成立。Feature importance 可能发生重排序：LF-eval 上 cmd_rep_ratio
    最重要 （因为 cmd_rep LF 覆盖率 97.4%），但 gold-eval 上 file_diff 相关特征可能上升（因为 file activity
    是更可靠的 cross-context 信号）。

    '

  figures_description:
  - 'Parallel coordinates plot: each model''s LF-label F1 → Gold-label F1, showing
    convergence from stratified to clustered performance on gold.'
  - 'Radar chart: LF-label performance (outer ring) vs Gold-label performance (inner
    ring) for all models, visually demonstrating uniform collapse.'
  analysis: '这是 worst 档的杀手图表。在 LF labels 上，模型之间有巨大差距 （structural 0.9951 >> probe 0.906
    >> LLM 0.663）。在 gold labels 上， 所有模型收敛到 0.55-0.60 的窄带——差距消失。这意味着：(1) 在 LF labels
    上的 性能排序完全是衡量 "谁更好地拟合了 LF 偏差"；(2) structural features 的 "优势" 完全是 circular artifact；(3)
    所有方法对真实 stagnation detection 的能力都 mediocre。 论文叙事必须从 "structural signal discovery"
    转向 "circular evaluation trap discovery"。

    '
- name: Gold Set — Temporal Onset Alignment
  plan_id: gold-set
  description: '比较 LF 标注的停滞 onset 与 gold 标注的停滞 onset 在时序上的对齐度。

    '
  expected_results:
    gold_temporal_onset_alignment_pct: 28
    lf_onset_leads_gold_pct: 35
    lf_onset_lags_gold_pct: 37
    mean_onset_offset_steps: 3.8
    median_onset_offset_steps: 3.0
    cmd_rep_onset_vs_gold_corr: 0.18
    file_diff_onset_vs_gold_corr: 0.32
    outcome_bp_onset_vs_gold_corr: 0.12
  result_rationale: 'worst 档预期 onset alignment 仅 28%——即 LF 检测到的停滞起始点仅在 28% 的 trajectory
    上与人类判断的停滞起始点对齐（±1 step tolerance）。 35% 的情况下 LF onset 领先 gold（LF 过早判断停滞——对应 FP
    模式，agent 还在 有效探索但触发了 cmd_rep），37% 的情况下 LF onset 滞后 gold（LF 延迟检测 停滞——对应 FN 模式，语义停滞已经开始但尚未产生结构性信号）。
    outcome_bp 与 gold 相关性最低(0.12)，因为它的后向传播机制人为制造了时序偏移； file_diff 与 gold 相关性最高(0.32)，因为文件修改是相对可靠的进展信号。
    平均偏移 3.8 步意味着 LF 和人类对 "停滞何时开始" 的判断在 ~4 个 step 的范围内波动—— 对于 k=5 的窗口而言，这几乎是整个窗口宽度，说明
    LF 和人类在测量不同的东西。

    '

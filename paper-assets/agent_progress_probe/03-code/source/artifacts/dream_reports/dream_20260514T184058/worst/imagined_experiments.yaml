  analysis: Claim 3 在 worst 档下的新叙事：TLM 失败不是因为 "MV 够好"（MV 也很差，gold acc=0.62）， 而是因为
    "LF labels 本身是 noisy 的，temporal alignment of noisy labels 不会收敛到 true labels"。这是一个比原始
    negative finding 更深的方法论洞见： 在 weak supervision 中，如果 LFs 的系统性偏差是 non-stationary
    且 correlated with the temporal structure of the data（正如 agent trajectories 中 LFs
    的 时序角色所示），那么任何试图利用这个时序结构来改进标签的方法都会被 LF 偏差 的时序结构所污染。这是一个 fundamental limitation，不是
    engineering failure。

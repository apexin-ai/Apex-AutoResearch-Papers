tier: worst
narrative_guidance: '核心 reframe：论文从 "structural signal discovery" 转为 "weak supervision
  pitfall discovery for agent monitoring"。 Gold set 揭示 LF labels 系统性误分类语义多样的停滞和误标活跃探索，κ
  仅 0.25-0.50。 Structural features 在 gold 上从 0.9951 崩塌至 0.50-0.68，证实其高分完全是 circular
  artifact。 LLM-judge 在 gold 上可能持平甚至超越 structural，颠覆效率叙事。 新 primary claim：naive LF-based
  weak supervision 在 agent trajectories 上制造 self-fulfilling structural proxies。 Claim
  2 升级：LF 时序角色分析成为独立贡献，cmd_rep role reversal 是 LF failure mode 的诊断工具。 Claim 3 TLM
  获新解释：temporal alignment of noise is still noise。 标题方向："When Labeling Functions Lie:
  Circular Evaluation Traps in Weak Supervision for Agent Monitoring"。 仍冲 EMNLP——methodology/analysis
  paper about WS failure modes。

  '
imagined_experiments:
- name: Gold Set — LF-Gold Agreement
  plan_id: gold-set
  description: '650 人工标注窗口与 3-LF majority vote 标签的一致性分析。 包含 Cohen''s κ、per-confidence
    accuracy、per-LF agreement、failure taxonomy。

    '
  expected_results:
    gold_n: 650
    gold_stag_ratio: 0.42
    gold_prog_ratio: 0.58
    overall_lf_gold_kappa: 0.38
    overall_lf_gold_accuracy: 0.62
    conf3_lf_gold_accuracy: 0.72
    conf2_lf_gold_accuracy: 0.63
    conf1_lf_gold_accuracy: 0.41
    per_lf_cmd_rep_gold_kappa: 0.28
    per_lf_file_diff_gold_kappa: 0.44
    per_lf_outcome_bp_gold_kappa: 0.35
    lf_false_negative_rate: 0.48
    lf_false_positive_rate: 0.22
    semantic_diverse_stag_miss_rate: 0.67
    active_exploration_false_stag_rate: 0.31
  result_rationale: 'worst 档假设 LFs 系统性误分类两大类型：(1) 语义多样的停滞——agent 用不同命令/文件做本质 相同的无效尝试，cmd_rep
    和 file_diff 均不 fire，LF 判 progress，人类判 stagnation， 导致 ~67% 此类窗口被 LF 遗漏；(2) 活跃探索的误标——agent
    快速尝试多种方案但重复 某些诊断命令，cmd_rep fires，LF 判 stagnation，人类判 progress，约 31% 此类窗口 被误标。κ=0.38
    落在 "fair agreement" 区间（Landis-Koch），远低于可靠标注所需的 0.6+。 conf≥2 也仅 0.63 accuracy，因为
    LF consensus 只是多个有偏启发式的同向偏差叠加， 不等于正确性。cmd_rep κ 最低(0.28)是因为它的 binary threshold
    无法区分 "诊断性重复"（progress）和 "循环性重复"（stagnation），与 OH 上 71% FP 一致。 Gold stag ratio
    预期 0.42（高于 LF 的 0.28），因人类标注者会捕获 LF 遗漏的语义停滞。

    '
  tables:
  - name: 'Table: LF-Gold Agreement by Confidence Level'
    columns:
    - Confidence
    - N
    - LF Accuracy
    - κ
    - FN Rate
    - FP Rate
    rows:
    - - conf=1
      - 280
      - 0.41
      - 0.22
      - 0.52
      - 0.28
    - - conf=2
      - 320
      - 0.63
      - 0.42
      - 0.38
      - 0.18
    - - conf=3
      - 50
      - 0.72
      - 0.51
      - 0.25
      - 0.15
    - - Overall
      - 650
      - 0.62
      - 0.38
      - 0.48
      - 0.22
  - name: 'Table: Per-LF Gold Agreement'
    columns:
    - LF
    - Gold κ
    - Gold Accuracy
    - Primary Failure Mode
    rows:
    - - cmd_rep
      - 0.28
      - 0.55
      - False-flags active exploration (31% FP on gold-progress)
    - - file_diff
      - 0.44
      - 0.68
      - Misses edit-heavy stagnation (agent edits but reverts)
    - - outcome_bp
      - 0.35
      - 0.6
      - Backward leakage contaminates early windows
  figures_description:
  - 'Confusion matrix heatmap: LF MV labels vs gold labels, split by confidence tier.
    Shows systematic FN concentration in conf=1 (LF says progress, gold says stagnation).'
  - 'Scatter plot: per-window LF agreement count (0-3 LFs firing stagnation) vs gold
    label, revealing that even 2/3 LF consensus has only 63% gold accuracy.'
  analysis: 'κ=0.38 确认 LF labels 是 stagnation 的 poor proxy。两个系统性失败模式： (1) FN-dominant:
    LFs 遗漏 48% 的真实停滞——这些是语义多样的停滞，agent 使用不同 命令和文件但本质上在重复无效策略，无法被 cmd_rep/file_diff
    的表面模式匹配捕获。 (2) FP non-trivial: 22% 的 LF-stagnation 标签在 gold 上是 progress——agent
    在 诊断问题时重复 grep/cat 等命令，被 cmd_rep 误判。 conf≥2 accuracy 仅 0.63 是最致命的发现：它直接否定了 "高置信
    LF 标签可作为 pseudo-gold" 的隐含假设。当前所有在 conf≥2 test set 上报告的指标（structural 0.9951、 probe
    0.906、LLM-judge 0.663）都是在衡量对一个 κ=0.42 的有偏标签的拟合程度。

    '
- name: Gold Set — Structural Features on Gold
  plan_id: gold-set
  description: '将已训练的 structural GB/RF/LR 模型和新训练的 gold-label structural 模型在 650 gold
    窗口上评估。

    '
  expected_results:
    structural_gb_gold_macro_f1: 0.58
    structural_rf_gold_macro_f1: 0.55
    structural_lr_gold_macro_f1: 0.61
    structural_gb_gold_f1_stag: 0.52
    structural_gb_gold_f1_prog: 0.64
    structural_gb_lf_labels_macro_f1: 0.9951
    collapse_magnitude_pp: 41.5
    structural_retrained_on_gold_macro_f1: 0.63
    structural_retrained_on_gold_f1_stag: 0.57
    structural_retrained_on_gold_f1_prog: 0.69
  result_rationale: 'Structural features 在 LF labels 上 0.9951 的核心原因是它们直接编码了 LF 的输入
    信号——cmd_rep_ratio 几乎就是 command_repetition LF 的连续版本，file_diff_count 对应 file_diff_delta
    LF。因此 structural model 本质上是在逆向工程 LF 规则。 当评估目标从 LF labels 切换到 gold labels（κ=0.38
    的不一致意味着 ~38% 标签翻转）， structural model 在这些翻转样本上的预测必然跟随 LF 而非 gold，导致 macro_f1 崩塌。
    预期 0.58 的计算逻辑：在 LF-gold 一致的 62% 窗口上 structural 保持 ~0.99， 在不一致的 38% 窗口上 structural
    跟随 LF（~0 accuracy），加权约 0.62×0.99 + 0.38×0.05 ≈ 0.63， 但因 macro averaging 和 class
    imbalance，实际偏低至 0.58。 GB 略优于 RF（0.58 vs 0.55），因 GB 的 boosting 有一定泛化能力。 LR 反而最高（0.61），因其
    linear boundary 不 overfit LF 的非线性边界。 即使在 gold labels 上重训练 structural model（仅 650
    samples），也只能达 0.63—— 因为 30 个结构特征本身缺乏捕获语义停滞的信息，上限受限于特征空间。

    '
  tables:
  - name: 'Table: Structural Model Performance — LF Labels vs Gold Labels'
    columns:
    - Model
    - LF-label F1
    - Gold-label F1
    - Collapse (pp)
    rows:
    - - GB
      - 0.9951
      - 0.58
      - -41.5
    - - RF
      - 0.9951
      - 0.55
      - -44.0
    - - LR
      - 0.9874
      - 0.61
      - -37.7
    - - GB (retrained on gold)
      - —
      - 0.63
      - —
  figures_description:
  - 'Bar chart: LF-label F1 vs Gold-label F1 for each structural model, showing the
    dramatic collapse. Error bars from bootstrap on gold set.'
  - 'Feature importance comparison: top-10 features for LF-trained vs gold-retrained
    GB, showing rank correlation breakdown.'
  analysis: '0.9951→0.58 的崩塌（-41.5pp）是论文最核心的实证证据：structural features 的近完美 表现完全是 circular
    evaluation artifact。这些特征并非检测真实停滞——它们在逆向工程 LF 的决策边界。当 ground truth 替换 LF labels
    后，structural features 退化至 接近 probe 水平（0.58 vs probe 在 gold 上的预期 0.55-0.62），证明两者获取的
    独立信息量相当。Retrained on gold 仅 0.63 进一步说明 structural features 的 信息瓶颈：命令重复率、文件 diff
    频率等统计量无法编码 "agent 是否在有效推进目标" 这一本质语义判断。

    '
- name: Gold Set — Probe on Gold
  plan_id: gold-set
  description: 'GRU probe（Qwen3-Embedding）在 650 gold 窗口上的评估。

    '
  expected_results:
    probe_gold_macro_f1: 0.57
    probe_gold_f1_stag: 0.5
    probe_gold_f1_prog: 0.64
    probe_gold_accuracy: 0.6
    probe_lf_labels_macro_f1: 0.9055
    probe_collapse_pp: 33.6
    probe_e5_gold_macro_f1: 0.59
    probe_bge_gold_macro_f1: 0.6
  result_rationale: 'Probe 在 LF labels 上 0.906 已经比 structural 的 0.9951 低 ~9pp，说明 probe
    没有完全逆向工程 LF 规则——它通过 embedding 空间学到了某些 LF 未直接编码的模式。 但 probe 仍然是在 LF labels 上训练的，所以它的决策边界被
    LF 偏差污染。 在 gold 上的崩塌幅度（-33.6pp）比 structural（-41.5pp）小，这恰恰说明 probe 学到了一些与 gold
    一致但被 LF 标签噪声压制的信号。然而 0.57 仍然很差—— embedding 空间虽有语义信息，但在 LF-biased labels 上训练时，这些信息被
    misaligned supervision 损坏。E5 和 BGE 略优（0.59-0.60），与它们在 LF labels 上的优势方向一致， 但差距不大——瓶颈是
    label quality 而非 encoder quality。

    '
  tables:
  - name: 'Table: Probe Performance — LF Labels vs Gold Labels'
    columns:
    - Encoder
    - LF-label F1
    - Gold-label F1
    - Collapse (pp)
    rows:
    - - Qwen3-0.6B
      - 0.9055
      - 0.57
      - -33.6
    - - E5-large-v2
      - 0.9363
      - 0.59
      - -34.6
    - - BGE-m3
      - 0.9413
      - 0.6
      - -34.1
  figures_description:
  - 'Scatter plot: per-window probe confidence vs gold correctness, showing probe
    is confidently wrong on LF-gold disagreement windows.'
  analysis: 'Probe 在 gold 上的 0.57 与 structural 的 0.58 几乎持平，消除了 "structural >> probe"
    的 LF-derived 叙事。两者在 gold 上都 mediocre， 说明问题不在 model capacity 而在 label quality。这支持
    worst 档的核心论点： 在 LF labels 上的所有性能排序都不可信。

    '
- name: Gold Set — LLM Judge on Gold
  plan_id: gold-set
  description: 'LLM-as-judge (Claude Sonnet) 在 650 gold 窗口上的评估。

    '
  expected_results:
    llm_judge_gold_macro_f1: 0.56
    llm_judge_gold_f1_stag: 0.5
    llm_judge_gold_f1_prog: 0.62
    llm_judge_lf_labels_macro_f1: 0.6625
    llm_judge_collapse_pp: 10.3
    structural_minus_llm_judge_gold_pp: 2.0
    probe_minus_llm_judge_gold_pp: 1.0
  result_rationale: 'LLM-judge 在 LF labels 上已经很差（0.663），这其实可能是因为 LLM 的语义判断 与 LF 的启发式判断本来就不一致——LLM
    在某些窗口上做出了与 LF 不同但可能正确的判断。 在 gold 上，LLM-judge 的崩塌幅度最小（-10.3pp），因为它本来就没有 fit LF
    labels。 LLM 可能在语义多样停滞上正确（LF 漏掉的那些），但在 active exploration 判断上也会犯错（重复命令是否有效需要深层上下文），所以总分仍然不高（0.56）。
    关键发现：structural minus LLM-judge 在 gold 上仅 +2pp（vs LF labels 上 +33pp）， 几乎持平。这意味着
    structural 相对于 LLM 的巨大优势完全是 circular eval 产物。 在公平评估下，花 $11.66 的 LLM 和 0 成本的 structural
    features 效果差不多—— 但两者都不够好。

    '
  tables:

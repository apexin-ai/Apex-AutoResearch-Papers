    hmm_lag_aware_gold_accuracy: 0.58
    twv_minus_mv_gold_pp: -2.0
    mv_gold_kappa: 0.38
    twv_gold_kappa: 0.35
  result_rationale: 'TLM 在 LF labels 上 "fail to beat MV" 的原始叙事（Claim 3）在 worst 档下获得
    新解释。MV 在 gold 上本身只有 62% accuracy——TLM 试图改进的基础就是 noisy 的。 TWV 的 temporal smoothing
    在 gold 上反而比 MV 差 2pp，因为它 smooth 的方向 是由 LF 的系统性偏差决定的——当 LF 在某个时序区段系统性犯错时，TWV 的
    Gaussian kernel 会扩散这个错误到邻近窗口。HMM 在 gold 上更差(0.45)，因为 它学到的 transition matrix 编码了
    LF labels 的（错误的）时序模式。 Lag-aware HMM 稍好(0.58)因为 confidence anchoring 在高 conf 样本上约束了
    偏离。总结：temporal alignment of noise produces more noise，而不是更好的信号。

    '

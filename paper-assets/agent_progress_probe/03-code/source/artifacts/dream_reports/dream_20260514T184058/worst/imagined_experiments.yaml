  figures_description:
  - 'Histogram: distribution of onset offset (LF onset - gold onset) in steps, showing
    bimodal distribution centered away from 0.'
  analysis: '28% onset alignment 证明 Claim 2 的 LF temporal dynamics 描述的是 LF 的行为模式，
    不是停滞的行为模式。cmd_rep leading (-1.87 steps) 这个发现在 gold 视角下的解读 完全改变：不是 "命令重复是停滞的早期预警"，而是
    "cmd_rep LF 过早触发导致 FP"。 这强化了 worst 档的 reframe：temporal dynamics 是 LF failure mode
    的诊断工具。

    '
- name: Gold Set — Failure Taxonomy
  plan_id: gold-set
  description: '基于 gold set 的 LF 错误分类分析——哪些类型的停滞 LFs 系统性遗漏。

    '
  expected_results:
    taxonomy_categories: 5
    cat1_semantic_diverse_stag:
      description: Agent uses varied commands/files but repeats ineffective strategies
      gold_n: 82
      lf_recall: 0.27
      example: agent tries 5 different fix approaches but all fail for the same root
        cause
    cat2_edit_revert_loop:
      description: Agent edits files then reverts, net zero progress
      gold_n: 45
      lf_recall: 0.38
      example: agent modifies config, tests fail, reverts, tries different config
    cat3_diagnostic_exploration:
      description: Agent actively diagnosing but LF flags as stagnation due to repeated
        grep/cat
      gold_n: 58
      lf_precision_on_these: 0.41
      example: agent greps logs with different patterns — progress, not stagnation
    cat4_subtle_progress:
      description: Agent making incremental progress but too slowly to be obvious
      gold_n: 35
      lf_recall: 0.48
      example: each step adds a few lines of correct code but at very slow pace
    cat5_clear_structural_stag:
      description: Obvious repetitive loops — LFs handle correctly
      gold_n: 55
      lf_recall: 0.91
      example: agent runs same failing test 5 times in a row
  result_rationale: 'Failure taxonomy 来自对 gold-LF disagreement 窗口的定性分析。worst 档预期 5
    个类别，其中 LFs 仅在 cat5（明显结构性循环）上表现好(0.91 recall)—— 这恰恰是现有 cycle detector 也能处理的简单情况。真正有价值的停滞类型
    （cat1 语义多样停滞、cat2 编辑回退循环）LF recall 极低(0.27-0.38)， 因为这些需要理解 agent 行动的语义效果而非表面命令模式。cat3
    是 FP 问题—— agent 在有效探索但 cmd_rep 误判。这些分类直接服务于 "下一代 LF 设计路线图"： 需要 outcome-aware LFs（检测编辑是否被
    revert）、strategy-level LFs （检测是否在重复同一策略而非同一命令）、和 goal-tracking LFs（检测是否在向 目标推进）。

    '
  tables:
  - name: 'Table: Stagnation Failure Taxonomy'
    columns:
    - Category
    - N (gold)
    - LF Recall
    - Root Cause of LF Failure
    rows:
    - - Semantic-diverse stagnation
      - 82
      - 0.27
      - Different commands ≠ different strategies
    - - Edit-revert loops
      - 45
      - 0.38
      - file_diff fires on edits but misses reverts
    - - Diagnostic exploration (FP)
      - 58
      - N/A (prec=0.41)
      - cmd_rep fires on valid diagnostic repetition
    - - Subtle progress
      - 35
      - 0.48
      - Progress too incremental for threshold-based LFs
    - - Clear structural loops
      - 55
      - 0.91
      - LFs designed for this case
  figures_description:
  - 'Stacked bar chart: distribution of gold stagnation windows across taxonomy categories,
    with LF recall overlaid as line.'
  - Example windows from each category with anonymized agent actions, showing qualitative
    difference between LF-detected and LF-missed stagnation.
  analysis: 'Failure taxonomy 是 worst 档最有 contribution 的新实验。它将 "LF labels 不准" 这个定量发现转化为可操作的洞见：(1)
    当前 LFs 只能检测 "结构性循环" 这一种 停滞类型（cat5，占 gold stagnation 的 ~20%），对占 ~80% 的其他停滞类型 几乎失效；(2)
    语义多样停滞（cat1）需要 strategy-level 而非 command-level 的 分析——这正是 LLM-as-judge 理论上的优势领域，尽管当前
    zero-shot LLM 也只能 部分解决；(3) 编辑回退循环（cat2）暴露了 file_diff LF 的根本缺陷——它只看 "是否有 diff"
    而不看 "diff 是否被保留"。这为 Snorkel/WS 社区提供了 sequential agent data 上的 LF 设计指南，是独立于 circular
    eval 发现之外的方法论贡献。

    '
- name: Gold Set — Conf≥2 Label Reliability
  plan_id: gold-set
  description: '专门分析 conf≥2 子集（所有主要实验的 test set）在 gold 上的可靠性。

    '
  expected_results:
    conf2_n_in_gold: 320
    conf2_lf_gold_accuracy: 0.63
    conf2_lf_gold_kappa: 0.42
    conf2_lf_gold_f1_stag: 0.55
    conf2_lf_gold_f1_prog: 0.71
    conf3_n_in_gold: 50
    conf3_lf_gold_accuracy: 0.72
    conf3_lf_gold_kappa: 0.51
    current_conf2_test_n: 1824
    implied_mislabeled_in_test: 675
  result_rationale: 'Worst 档假设 conf≥2 labels 仅 63% accuracy——意味着当前 1824 个 conf≥2 test
    windows 中约 675 个标签是错误的。这直接否定了用 conf≥2 子集作为 "高质量 pseudo-gold" 的做法。κ=0.42（仍在 "fair"
    区间）说明 LF consensus 只是 多个有偏 heuristic 的系统性偏差叠加——当两个或三个 LFs 犯同一个方向的错误 （如都被表面结构模式误导），consensus
    不等于正确性。 conf=3 accuracy 略高(0.72)是因为三个 LFs 全部同意时确实更可能捕获了真正明显的 停滞（cat5 类型），但 0.72
    仍不够用作 ground truth。

    '

    ## R1 Review: Methodology and Experiments


    ### Summary

    The paper identifies a "circular evaluation trap" in weak supervision for agent
    stagnation detection, demonstrating that structural features collapse from 0.995
    to 0.55–0.61 F1 when evaluated on a 650-window gold set instead of LF-derived
    labels. A 5-category failure taxonomy and negative results on three TLM implementations
    are presented. The core insight is genuine and transferable, but the paper suffers
    from critical statistical gaps, an insufficiently validated gold set, and incomplete
    experimental analysis.


    ### Strengths

    - **S1**: The circular evaluation trap is the paper''s strongest contribution.
    The mechanistic explanation — structural features are continuous relaxations of
    LF inputs — is clean and generalizable to any WS pipeline where features correlate
    with label-generating heuristics.

    - **S2**: Comprehensive multi-method comparison on a shared gold set (Table 6)
    provides an apples-to-apples comparison across structural classifiers, neural
    probes, and LLM judges.

    - **S3**: The failure taxonomy (Table 8) is descriptively valuable, revealing
    that LFs handle only ~20% of gold stagnation (clear structural loops) while missing
    73% of semantically diverse stagnation.

    - **S4**: Honest negative results on TLMs — three implementations failing, combined
    with the "temporal alignment of noise is still noise" insight.

    - **S5**: The convergence finding (all methods to 0.55–0.60 on gold) is genuinely
    surprising and underappreciated.


    ### Weaknesses

    - **W1 (Critical)**: No confidence intervals, significance tests, or bootstrap
    analyses anywhere. The core claims rest on 1–5pp differences across methods on
    650 samples (e.g., GB 0.58 vs. BGE 0.60 vs. LLM 0.56 in Table 6). Without McNemar''s
    test or bootstrap 95% CIs, these differences may be noise. For an empirical analysis
    paper at a top venue, this is a disqualifying omission.

    - **W2 (Critical)**: No inter-annotator agreement (IAA) reported for the gold
    set. The paper''s entire thesis rests on gold evaluation, yet the gold set''s
    own reliability is uncharacterized. Without IAA ≥ 0.75, gold-derived numbers carry
    unknown measurement error.

    - **W3**: Gold set construction and sampling strategy are underspecified. How
    were 650 windows sampled? Was there stratification by confidence, trajectory length,
    agent type? Selection bias directly affects all conclusions.

    - **W4**: The retraining-on-gold experiment (GB: 0.63) conflates insufficient
    data with feature limitations. A learning curve or cross-validated estimate would
    be needed to disentangle the two.

    - **W5**: LLM judge baseline is unfairly weak — only zero-shot classification.
    No few-shot, no chain-of-thought, no alternative LLMs. The 2pp gap on gold could
    easily reverse with a fairer baseline.

    - **W6**: Cross-agent OH gold evaluation (Table 7, 0.52) — provenance of OH gold
    labels unclear. If these are LF-derived rather than human-annotated, this is a
    methodological inconsistency.

    - **W7**: Temporal onset alignment (28%, Table 10) lacks a random-firing null
    baseline for calibration.

    - **W8**: Failure taxonomy has no formal inter-coder reliability. Categories defined
    post-hoc by manual inspection without codebook or independent coding.


    ### Questions for Authors

    - Q1: Bootstrap 95% CIs for all pairwise comparisons in Table 6?

    - Q2: Inter-annotator agreement on the 650-window gold set? Single or multiple
    annotators?

    - Q3: How were 650 gold windows sampled? Any overlap with model training data?

    - Q4: Learning curve for gold-retrained GB (100/200/400/650 samples)?

    - Q5: LLM judge performance with 5-shot prompting and chain-of-thought?

    - Q6: OH cross-agent gold labels — human-annotated or LF-derived?

    - Q7: Random-firing null baseline for temporal onset alignment?

    - Q8: Error correlation analysis — do all methods fail on the same windows?



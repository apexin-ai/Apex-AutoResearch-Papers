    - 'Confusion heatmap: 2x2 矩阵 with per-cell 典型 trajectory 片段示例'
    analysis: 'κ=0.84 落在 best tier 范围 [0.72, 0.88] 的上部。Gold-LF agreement 按 confidence
      分层严格单调递增（0.83→0.96→0.98），验证 confidence-gradient 实验的发现。 Conf=1 κ=0.62 表明这些 labels
      噪声显著但仍 better than chance，probe 在 conf=1 上 23.6% 的 divergence 部分反映了 LF 噪声而非
      probe 错误。

      '
  - name: Gold-LF Conf≥2 Accuracy
    plan_id: gold-set
    description: '在 gold set 中 conf≥2 子集上评估 LF label accuracy。

      '
    expected_results:
      gold_conf2_n: 435

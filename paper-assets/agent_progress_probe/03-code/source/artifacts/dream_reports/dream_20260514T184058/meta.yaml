    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper quantifies a circular evaluation trap in weak supervision for agent
    stagnation detection, showing all models converge to 0.55–0.60 F1 on human-annotated
    gold labels despite spanning 0.663–0.995 on LF-derived labels. While the quantification
    is careful and the failure taxonomy is concrete, the core finding is not surprising
    to the WS community, the scope is narrow (2 SE agents), and several important
    related works are missing.


    ### Strengths

    - **S1**: The circular evaluation quantification is transferable — the 37–44pp
    collapse and the recommendation for feature-LF independence audits when LF-label
    F1 > 0.95 are actionable for practitioners.

    - **S2**: The 5-category failure taxonomy provides a concrete decomposition of
    where weak supervision breaks, with per-category recall numbers that guide future
    LF design.

    - **S3**: Well-structured TLM negative result. The "temporal alignment of noise
    is still noise" framing is accurate and memorable.

    - **S4**: The gold set validation is the right experimental design for addressing
    circularity. The paper practices what it preaches.

    - **S5**: Cross-agent analysis reveals non-obvious LF-architecture interactions
    (cmd_rep role reversal between SWE-Agent and OpenHands).


    ### Weaknesses

    - **W1 (Major)**: The core finding — that features correlated with label-generating
    heuristics predict those labels — is not surprising to the WS community. The Snorkel
    papers explicitly discuss gold-set validation for exactly this reason. The contribution
    is a quantified case study, not a novel methodological insight. The "all models
    collapse to 0.55–0.60" convergence is the genuine surprise, but its generalizability
    beyond this setup is unclear.

    - **W2 (Major)**: Gold set limitations undermine the strongest claims. 650 windows,
    single domain, 2 agents, no IAA. The failure taxonomy subtypes have small N (n=35–82),
    limiting statistical power.

    - **W3**: No statistical significance tests on any comparison. If all methods
    converge to the same gold F1 range, this must be formally demonstrated.

    - **W4**: The TLM negative finding is expected given the experimental regime.
    Only 3 LFs with 95.1% agreement at conf≥2 — standard WS benchmarks use 10+ LFs.
    Cannot distinguish "TLMs fail on sequential agent data" from "TLMs fail with 3
    low-conflict LFs."

    - **W5**: Narrow scope. Title implies broad applicability to "agent monitoring,"
    but all evidence is from 2 coding agents on SWE-bench. Transfer to web navigation,
    scientific discovery, or conversational agents is unknown.

    - **W6**: No training on gold labels. Cross-validated gold-trained models would
    separate label quality bottleneck from model capacity bottleneck.


    ### Related Work Gaps

    1. **Safranchik et al. (AAAI 2020)** — "Weakly Supervised Sequence Tagging from
    Noisy Rules": most direct methodological predecessor for the TLM approach (linked
    HMM for sequential WS). Critical omission.

    2. **Sala et al. (NeurIPS 2019)** — "Multi-Resolution Weak Supervision for Sequential
    Data": direct precedent for WS on sequential data with temporal structure.

    3. **Fu et al. (ICML 2020)** — FlyingSquid: core WS label model not compared against.

    4. **Zhang et al. (NeurIPS 2021)** — WRENCH benchmark: contextualizes the 3-LF
    regime as unusually small.

    5. **George et al. (2025)** — "Unsupervised Cycle Detection in Agentic Applications":
    most directly comparable work on stagnation/cycle detection combining structural
    and embedding approaches.

    6. **Lightman et al. (2023)** — "Let''s Verify Step by Step": foundational PRM
    work missing from the PRM discussion.

    7. More sophisticated i.i.d. label models (Dawid-Skene EM, Snorkel''s generative
    model, FlyingSquid) should be compared — MV is the simplest baseline, and the
    TLM negative finding is less informative without showing that sophisticated i.i.d.
    models also fail.


    ### R2 Scores

    - Soundness: 3/4

    - Contribution: 2/4

    - Presentation: 3/4

    - Overall: 3/6 (Weak Reject)

    - Confidence: 4/5



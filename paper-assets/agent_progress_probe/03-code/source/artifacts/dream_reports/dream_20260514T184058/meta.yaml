  - name: Gold-LF Agreement (Cohen's κ)
    plan_id: gold-set
    description: '两名标注者对 650 个 k=5 窗口独立标注 stagnation/progress，计算 inter-annotator agreement
      后合并为 gold labels，与 MV LF labels 计算 Cohen''s κ。

      '
    expected_results:
      inter_annotator_kappa: 0.81
      inter_annotator_pct_agreement: 0.91
      gold_lf_kappa: 0.84
      gold_lf_pct_agreement: 0.92
      gold_n: 650
      gold_stag_ratio: 0.33
      gold_prog_ratio: 0.67
      lf_stag_ratio_in_sample: 0.3
      disagreement_cases_n: 52
      lf_stag_gold_prog_n: 28
      lf_prog_gold_stag_n: 24
    result_rationale: 'κ=0.84 因为 LFs 的设计基础——command repetition、file diff absence、outcome
      failure——与人类对 "agent 没有进展" 的直觉判断高度一致。三个 LFs 中 cmd_rep 和 file_diff 捕获了最明显的停滞信号（反复执行相同命令、不产生代码变更），这些是
      annotator 也能直接观察到的行为模式。52 个 disagreement cases 主要集中在 "agent 在尝试不同方法但都失败"（LF
      判 progress 因为命令多样，人类判 stagnation 因为没有实质进展）和 "agent 重复命令但实际在 debugging"（LF 判
      stagnation， 人类判 progress 因为理解了调试意图）。这两类 borderline cases 数量大致对称 （28 vs 24），说明
      LF 没有系统性偏向。

      '
    tables:
    - name: 'Table 5: Gold-LF Agreement Confusion Matrix'
      content: '|              | Gold=Stag | Gold=Prog |

        |--------------|-----------|-----------|

        | LF=Stag      | 190       | 28        |

        | LF=Prog      | 24        | 408       |

        κ=0.84, N=650

        '
    - name: 'Table 6: Agreement by LF Confidence Level'
      content: '| LF Conf | N    | Gold-LF Agree% | κ    |

        |---------|------|----------------|------|

        | conf=1  | 215  | 0.83           | 0.62 |

        | conf=2  | 370  | 0.96           | 0.91 |

        | conf=3  | 65   | 0.98           | 0.96 |

        '
    figures_description:

    # Dream Review Report


    **Paper:** Stagnation Signals Are Structural, Not Semantic: A Systematic Empirical
    Study of Progress Detection in LLM Agents


    **Review Mode:** Full (2 Reviewers, 4-step roundtable)


    **Overall Score: Weak Reject (3/6)**


    ---


    ## Consolidated Summary


    This paper presents an empirical study comparing structural features, neural embedding
    probes, and LLM-as-judge for detecting progress stagnation in LLM agents. Using
    a weak supervision pipeline with 3 labeling functions and 650 gold-annotated windows
    from SWE-Agent trajectories, it demonstrates that gradient boosting over 30 hand-crafted
    structural features achieves 0.89 gold macro-F1, surpassing GRU probes (0.81)
    and Claude Sonnet zero-shot (0.67). The paper quantifies the circular evaluation
    artifact (~10.5pp from in-domain to gold) and reports a well-motivated negative
    result on temporal label models.


    The paper is competent and honest, but falls below the bar for a top ML venue
    (~25% acceptance) due to limited methodological novelty, narrow evaluation scope
    (2 SE agents), missing statistical significance tests, and an unfairly weak LLM-judge
    baseline.


    ---


    ## R1 Review: Methods & Experiments


    ### Strengths


    - **S1: Circularity decomposition is the paper''s strongest contribution.** The
    explicit quantification of in-domain 0.995 → gold 0.89 (~10.5pp gap) is rigorous
    and honest. The observation that the LLM-judge is the only method whose gold performance
    does not decline (+0.8pp) provides an elegant internal consistency check confirming
    that LF-correlated methods show circularity drops while LF-orthogonal methods
    do not.


    - **S2: Feature importance stability analysis (Spearman ρ≈0.95)** between LF-derived
    and gold evaluation demonstrates that circularity inflates magnitude but does
    not alter directional signal, strengthening the claim that structural features
    capture genuine stagnation patterns.


    - **S3: Gold annotation protocol is adequate.** 650 windows, 2 annotators, κ=0.81,
    disagreements resolved by discussion. The stratified analysis by LF confidence
    (conf=1: 0.68, conf≥2: 0.93, conf=3: 0.98) reveals a clean monotonic relationship
    validating the LF pipeline design.


    - **S4: The three-way method comparison on gold labels is the right experimental
    design** for an empirical analysis paper. Each method class represents a natural
    point on the cost-complexity spectrum.


    - **S5: The TLM negative result is well-grounded.** Three implementations all
    fail, with TWV degrading downstream by 21.7pp. The mechanistic explanation (low-conflict
    regime, 95.1% conf≥2 agreement) is satisfying.


    ### Weaknesses


    - **W1: Gold set covers SWE-Agent only; cross-agent claims lack independent validation.**
    The cross-agent 0.967 F1 on OpenHands is evaluated entirely on LF-derived labels.
    The paper applies the SWE-Agent circularity gap to bound OpenHands gold performance
    at [0.83, 0.92], but this extrapolation assumes the circularity structure transfers
    across agents — unjustified given that LF failure modes differ qualitatively between
    agents (e.g., cmd_rep has 71% false positive rate on OpenHands).


    - **W2: No confidence intervals or significance tests on any gold-set comparison.**
    The structural-vs-probe gap on gold is 5–8pp with N=650. Whether the 5pp structural-vs-BGE
    gap is statistically significant is left unaddressed. This is a serious omission
    for a top-venue empirical paper.


    - **W3: Subtype analysis (Table 9) and trajectory position analysis (Table 10)
    may mix LF-derived and gold labels.** Table 9 reports 485 stagnation windows,
    but the gold set contains only ~214 stagnation windows. The evaluation regime
    is not clarified, creating ambiguity about circularity.


    - **W4: The 30 structural features are not fully specified.** Only 5 are named;
    the remaining 25 are undocumented. For the paper''s primary recommended approach,
    complete specification is essential for reproducibility.


    - **W5: MV LF labels (0.92 gold macro-F1) outperform the trained GB classifier
    (0.89).** This means the raw LF majority vote, without any learning, beats the
    structural classifier by 3pp. The paper includes this row with an asterisk but
    does not address the implication: if MV already achieves 0.92, what additional
    value does training GB provide?


    - **W6: LLM-judge baseline limited to zero-shot Claude Sonnet.** No few-shot,
    no chain-of-thought, no other LLMs tested. The 0.67 may reflect weak prompting
    rather than a fundamental limitation.


    - **W7: Temporal onset alignment uses ±2 step tolerance on k=5 windows (40% margin).**
    Alignment at stricter tolerances (±1, exact match) is not reported. The 80% alignment
    may partly reflect tolerance generosity.


    ### Questions for Authors


    - Q1: Does the MV LF label superiority (0.92 vs 0.89) mean the GB classifier is
    strictly worse than simply applying LFs at test time?

    - Q2: How many of the 85 gold onset boundaries come from trajectories overlapping
    with the structural classifier''s training set?

    - Q3: Can you provide direct analysis of cases where the probe is correct and
    structural features are wrong on gold?


    ### Scores

    - Soundness: 3/4

    - Empirical Rigor: 3/4


    ---


    ## R2 Review: Novelty & Related Work


    ### Strengths


    - **S1: The structural dominance finding is empirically valuable despite being
    intuitive.** Showing that command repetition ratios outperform embeddings by 8–22pp
    on gold is a practically useful result that could redirect engineering effort.
    The magnitude of the gap is the contribution.


    - **S2: The circularity decomposition is a genuine methodological contribution**
    providing a reusable framework for weak supervision studies.


    - **S3: The temporal dynamics analysis reveals a non-obvious cross-agent finding.**
    The cmd_rep role reversal between SWE-Agent (leading, −1.87 steps) and OpenHands
    (lagging, +3.32 steps), with +21.6pp improvement from removing cmd_rep on OpenHands,
    is concrete and actionable.


    - **S4: Honest treatment of the negative TLM result** with a plausible mechanistic
    explanation.


    ### Weaknesses


    - **W1: Limited methodological novelty.** The paper employs entirely standard
    components (majority vote, gradient boosting, GRU probes, zero-shot LLM). There
    is no new algorithm, model, or inference procedure. The novelty rests entirely
    on the finding, which has a "confirm the obvious" quality: structural LFs naturally
    produce labels that structural features predict. The gold-validated residual (0.89)
    is the genuine contribution, but methodological novelty is near zero.


    - **W2: Narrow evaluation scope severely limits significance claims.** Both agents
    are SE agents on SWE-bench. The title and abstract make sweeping claims about
    "LLM Agents" without qualification. Structural features are heavily SE-specific
    (file diff count, edit diversity). Whether these transfer to web navigation, scientific
    discovery, or conversational agents is entirely unknown.


    - **W3: The "semantic stagnation" framing is undermined by the paper''s own results.**
    The paper motivates itself with detecting "semantically diverse but collectively
    ineffective" behavior. Yet Table 9 shows the "outcome-only" subtype (true semantic
    stagnation) has the lowest detection (F1_stag=0.72), confirming structural features
    struggle with the very phenomenon the paper claims to address. This tension deserves
    direct confrontation.


    - **W4: Gold set is SWE-Agent only** (same as R1-W1). Cross-agent claims rest
    on circular evaluation.


    - **W5: The LLM-judge baseline is unfairly weak** (same as R1-W6). A single zero-shot
    prompt achieving 0.67 is unsurprising and does not constitute a fair comparison.


    - **W6: No statistical significance tests** (same as R1-W2).


    - **W7: Temporal onset validation rests on N=85 onset events** — a small sample
    for per-LF breakdown with ±2 tolerance.


    ### Missing Related Work


    - **George et al. 2025, "Unsupervised Cycle Detection in Agentic Applications"
    (arXiv 2511.10650):** Most directly comparable prior work on cycle/stagnation
    detection, combining call-stack structural analysis with embedding similarity.
    Significant omission.

    - **Pipis et al. 2025, "Wait, Wait, Wait... Why Do Reasoning Models Loop?" (arXiv
    2512.12895):** Analyzes looping in reasoning models using 30-gram repetition.
    Relevant to cmd_rep LF design.

    - **Cemri et al. 2025, "Why Do Multi-Agent LLM Systems Fail?" (arXiv 2503.13657):**
    MAST taxonomy includes "Step Repetition" failure mode.

    - **Safranchik et al. AAAI 2020, "Weakly Supervised Sequence Tagging from Noisy
    Rules":** Linked HMM for sequential weak supervision — closest methodological
    precedent for the TLM attempt. Essential for contextualizing the negative result.

    - **Sala et al. NeurIPS 2019, "Multi-Resolution Weak Supervision for Sequential
    Data":** Direct precedent for weak supervision on sequential data with temporal
    structure.

    - **Ratner et al. 2018 (Snorkel, VLDB)** and **FlyingSquid (Fu et al., ICML 2020):**
    Core weak supervision references surprisingly absent.

    - **Dawid & Skene 1979** and broader label aggregation literature: The paper frames
    majority vote as the only i.i.d. alternative without discussing more sophisticated
    aggregation.


    ### Questions for Authors


    - Q1: What performance does the LLM-judge achieve with few-shot prompting and
    chain-of-thought?

    - Q2: How many of the 30 features are SE-specific vs. domain-general? Could you
    report a "domain-general subset" ablation?

    - Q3: What does the probe achieve on the "outcome-only" stagnation subtype? If
    the probe outperforms structural there, the structural/semantic dichotomy requires
    nuancing.

    - Q4: How close is structural GB (0.89) to the inter-annotator ceiling (~0.91
    agreement)?


    ### Scores

    - Novelty: 2/4

    - Significance: 2/4


    ---


    ## Roundtable Convergence


    ### Points of Agreement (Both Reviewers)


    1. **No statistical significance tests** — the most critical gap. Both reviewers
    flag this as a serious omission for an empirical paper at a top venue with N=650.

    2. **Gold set limited to SWE-Agent** — cross-agent claims are unvalidated on gold
    and the circularity gap extrapolation is methodologically unsound.

    3. **Weak LLM-judge baseline** — zero-shot only, no few-shot/CoT variants tested.
    The -22pp gap may be an artifact of minimal prompting effort.

    4. **Circularity decomposition is the strongest contribution** — both reviewers
    agree this is rigorous, honest, and potentially generalizable.

    5. **TLM negative result is well-motivated** — honest reporting with mechanistic
    explanation.

    6. **Temporal onset tolerance (±2 on k=5) is generous** — alignment at stricter
    tolerances needed.


    ### Points of Divergence


    - **R1 leans toward borderline weak accept** (emphasizing empirical contribution
    value and circularity decomposition); **R2 leans toward weak reject** (emphasizing
    limited novelty and narrow scope).

    - **R2 raises the framing tension** — the paper''s "semantic stagnation" motivation
    is undermined by its own results showing structural methods fail on outcome-only
    stagnation (F1=0.72). R1 does not flag this.

    - **R2 identifies significant missing related work** (6+ papers) that R1 does
    not discuss.

    - **R1 uniquely catches the MV > GB tension** (0.92 vs 0.89 on gold) — a potentially
    damaging finding for the paper''s practical message.


    ### Consensus Score: Weak Reject (3/6)


    The combination of limited methodological novelty, narrow evaluation scope (2
    SE agents only), absent statistical significance tests, unfairly weak LLM-judge
    baseline, and several significant missing related works places this paper below
    the acceptance threshold for a top venue. The circularity decomposition framework
    and the well-motivated TLM negative result are genuine contributions, but insufficient
    to overcome the accumulated weaknesses.


    ---


    ## Experiment Coverage Assessment


    | Planned Experiment | Status | Notes |

    |---|---|---|

    | Gold-LF Agreement (κ) | ✅ Covered | Table 1, κ=0.84 |

    | Gold-LF Conf≥2 Accuracy | ✅ Covered | Table 2, 0.93 accuracy |

    | Structural on Gold | ✅ Covered | Table 3, GB 0.89 |

    | Probe on Gold | ✅ Covered | Table 5, Qwen3 0.81 |

    | LLM-Judge on Gold | ✅ Covered | Table 6, 0.67 |

    | Temporal Onset Alignment | ✅ Covered | Table 7, 80% alignment |

    | Cross-Agent Gold Validation | ⚠️ Partial | Discussion only, no gold annotation
    for OpenHands |

    | Circularity Quantification | ✅ Covered | Table 8 |

    | F1_stag by Confidence | ⚠️ Partial | Mentioned in text, no dedicated table |

    | F1_stag by Position | ✅ Covered | Table 10 |

    | F1_stag by Subtype | ✅ Covered | Table 9 |

    | Probe vs Structural Error Decomp | ✅ Covered | Table 11 |


    Coverage: 9/12 fully covered, 2 partial, 1 missing (OpenHands gold). The paper
    reflects ~80% of the planned experiment matrix.


    ---


    ## Actionable Recommendations (Priority Order)


    1. **Add bootstrap 95% CIs and McNemar''s test** to all gold-set method comparisons
    (structural vs probe, structural vs LLM-judge).

    2. **Test LLM-judge with 5-shot prompting and CoT** to establish whether 0.67
    is robust to prompting strategy.

    3. **Hedge cross-agent claims explicitly** — state that OpenHands results are
    LF-derived only, with bounded estimates, not validated findings.

    4. **Address the MV > GB tension** — explain why training a classifier is valuable
    when raw MV achieves higher gold F1.

    5. **Add missing related work** — George et al. 2025, Safranchik et al. 2020,
    Snorkel, FlyingSquid at minimum.

    6. **Confront the framing tension** — the "semantic stagnation" motivation vs.
    the structural dominance finding. Either reframe the motivation or discuss outcome-only
    stagnation (F1=0.72) as a limitation of the structural approach.

    7. **Document all 30 features** in an appendix for reproducibility.

    8. **Report temporal onset alignment at ±0 and ±1 tolerances** alongside ±2.

    9. **Clarify evaluation regime** for Tables 9 and 10 (gold vs. LF-derived labels).


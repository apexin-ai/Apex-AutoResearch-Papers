    gold_temporal_onset_alignment_pct: 80
    cmd_rep_onset_alignment_pct: 83
    file_diff_onset_alignment_pct: 76
    ob_onset_alignment_pct: 72
    cmd_rep_gold_mean_lag: -1.6
    file_diff_gold_mean_lag: -0.9
    ob_gold_mean_lag: 7.2
    lf_derived_cmd_rep_mean_lag: -1.87
    lf_derived_ob_mean_lag: 6.7
    onset_boundary_tolerance_steps: 2
  result_rationale: '80% onset alignment 因为 LF temporal patterns 反映了真实的 stagnation
    dynamics： command repetition 确实在 agent 开始陷入困境时最先出现（agent 先重复几次命令 才开始其他无效行为），file
    diff 变化在 stagnation 初期就减少，outcome 信息 最晚才确认。Gold onset boundaries 使用 ±2 步容差因为人类标注
    "何时开始停滞" 有固有模糊性。Cmd_rep alignment 最高（83%）因为它的 leading 角色最明确—— 人类 annotator 也倾向于以
    "agent 开始重复" 作为 stagnation 开始的标志。 OB alignment 最低（72%）因为 OB 依赖 outcome 信息，其 lagging
    特性意味着它 标记的 stagnation 区域与 gold onset 在时间上有更大偏移。Gold-derived lag 值 （cmd_rep -1.6,
    OB +7.2）与 LF-derived 值（-1.87, +6.7）一致性好，轻微差异 来自 gold onset boundary 定义与 MV onset
    定义的差异。

    '
  tables:

    content: '| LF                  | LF-Derived Lag | Gold Lag | Alignment% | ±2
      step |

      |---------------------|----------------|----------|------------|---------|

      | command_repetition  | -1.87          | -1.6     | 83%        | ±2      |

      | file_diff_delta     | -1.2           | -0.9     | 76%        | ±2      |

      | outcome_backprop    | +6.7           | +7.2     | 72%        | ±2      |

      | Overall alignment   |                |          | 80%        |         |

      '
  figures_description:

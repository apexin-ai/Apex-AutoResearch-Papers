narrative_guidance: 'Gold set 验证 LF labels 是合理的 stagnation proxy。Structural dominance
  在 gold 上 依然成立（0.89 macro_f1），证明 in-domain 0.9951 虽有 circular 成分但底层信号真实。 Conf≥2 LF
  labels 接近 gold 质量（accuracy 0.93），conf=1 labels 噪声大但方向正确。 Circularity concern 正面化解：0.9951→0.89
  的 drop 量化了 circular 成分（~10.5pp）， 但 0.89 仍大幅领先 probe（0.81）和 LLM-judge（0.67）。论文按原始
  headline 投稿， gold set 作为 Section 5 核心 evidence。

  '
imagined_experiments:
- name: Gold-LF Agreement (Cohen's κ)
  plan_id: gold-set
  description: '两名标注者对 650 个 k=5 窗口独立标注 stagnation/progress，计算 inter-annotator agreement
    后合并为 gold labels，与 MV LF labels 计算 Cohen''s κ。

    '
  expected_results:
    inter_annotator_kappa: 0.81
    inter_annotator_pct_agreement: 0.91
    gold_lf_kappa: 0.84
    gold_lf_pct_agreement: 0.92
    gold_n: 650
    gold_stag_ratio: 0.33
    gold_prog_ratio: 0.67
    lf_stag_ratio_in_sample: 0.3
    disagreement_cases_n: 52
    lf_stag_gold_prog_n: 28
    lf_prog_gold_stag_n: 24
  result_rationale: 'κ=0.84 因为 LFs 的设计基础——command repetition、file diff absence、outcome
    failure——与人类对 "agent 没有进展" 的直觉判断高度一致。三个 LFs 中 cmd_rep 和 file_diff 捕获了最明显的停滞信号（反复执行相同命令、不产生代码变更），这些是
    annotator 也能直接观察到的行为模式。52 个 disagreement cases 主要集中在 "agent 在尝试不同方法但都失败"（LF 判
    progress 因为命令多样，人类判 stagnation 因为没有实质进展）和 "agent 重复命令但实际在 debugging"（LF 判 stagnation，
    人类判 progress 因为理解了调试意图）。这两类 borderline cases 数量大致对称 （28 vs 24），说明 LF 没有系统性偏向。

    '
  tables:
  - name: 'Table 5: Gold-LF Agreement Confusion Matrix'
    content: '|              | Gold=Stag | Gold=Prog |

      |--------------|-----------|-----------|

      | LF=Stag      | 190       | 28        |

      | LF=Prog      | 24        | 408       |

      κ=0.84, N=650

      '
  - name: 'Table 6: Agreement by LF Confidence Level'
    content: '| LF Conf | N    | Gold-LF Agree% | κ    |

      |---------|------|----------------|------|

      | conf=1  | 215  | 0.83           | 0.62 |

      | conf=2  | 370  | 0.96           | 0.91 |

      | conf=3  | 65   | 0.98           | 0.96 |

      '
  figures_description:
  - 'Scatter: LF confidence vs gold agreement rate，展示单调递增关系'
  - 'Confusion heatmap: 2x2 矩阵 with per-cell 典型 trajectory 片段示例'
  analysis: 'κ=0.84 落在 best tier 范围 [0.72, 0.88] 的上部。Gold-LF agreement 按 confidence
    分层严格单调递增（0.83→0.96→0.98），验证 confidence-gradient 实验的发现。 Conf=1 κ=0.62 表明这些 labels
    噪声显著但仍 better than chance，probe 在 conf=1 上 23.6% 的 divergence 部分反映了 LF 噪声而非 probe
    错误。

    '
- name: Gold-LF Conf≥2 Accuracy
  plan_id: gold-set
  description: '在 gold set 中 conf≥2 子集上评估 LF label accuracy。

    '
  expected_results:
    gold_conf2_n: 435
    gold_conf2_lf_accuracy: 0.93
    gold_conf2_precision_stag: 0.9
    gold_conf2_recall_stag: 0.92
    gold_conf2_precision_prog: 0.95
    gold_conf2_recall_prog: 0.94
    gold_conf2_macro_f1: 0.92
    gold_conf1_n: 215
    gold_conf1_lf_accuracy: 0.68
    gold_conf1_precision_stag: 0.55
    gold_conf1_recall_stag: 0.71
    gold_conf1_precision_prog: 0.78
    gold_conf1_recall_prog: 0.66
    gold_conf1_macro_f1: 0.64
  result_rationale: 'Conf≥2 accuracy 0.93 因为当 2/3 或 3/3 LFs 达成共识时，多数投票已过滤掉单个 LF 的
    false positive。在已完成实验中 conf≥2 内部一致率 95.1%，但与 gold 对比 会降 ~2pp 因为 LFs 共享的 blind
    spot（如 "diverse commands but no progress" 模式三个 LF 都漏判）。Conf=1 accuracy 0.68 因为仅一个
    LF firing 时信号很弱， 且 cmd_rep 在 SWE-Agent 上 12.75% per-LF error rate 在 conf=1 区域被放大。

    '
  tables:
  - name: 'Table 7: LF Label Quality by Confidence (Gold-Validated)'
    content: '| Confidence | N   | Accuracy | Macro-F1 | Stag Prec | Stag Recall |

      |------------|-----|----------|----------|-----------|-------------|

      | conf=1     | 215 | 0.68     | 0.64     | 0.55      | 0.71        |

      | conf≥2     | 435 | 0.93     | 0.92     | 0.90      | 0.92        |

      | conf=3     | 65  | 0.98     | 0.97     | 0.97      | 0.98        |

      '
  figures_description:
  - 'Bar chart: accuracy by confidence level，附 95% CI error bars'
  analysis: 'Conf≥2 的 0.93 accuracy 落在 best tier [0.88, 0.95] 上部。这验证了 data programming
    pipeline 的核心假设：多 LF 共识是可靠的 stagnation proxy。Conf=1 的 0.68 落在 [0.58, 0.72] 上部，说明
    probe 在 conf=1 上的高 disagreement（23.6%）约一半是 "probe 比 LF 更对"，一半是 "probe 也错了"。

    '
- name: Structural Features on Gold Labels
  plan_id: gold-set
  description: '在 650 gold windows 上重新评估 structural GB/RF/LR，量化 circular artifact
    的 大小并验证 structural dominance 是否在 non-circular 评估下成立。

    '
  expected_results:
    gold_structural_gb_macro_f1: 0.89
    gold_structural_gb_f1_stag: 0.85
    gold_structural_gb_f1_prog: 0.93
    gold_structural_rf_macro_f1: 0.88
    gold_structural_rf_f1_stag: 0.83
    gold_structural_rf_f1_prog: 0.93
    gold_structural_lr_macro_f1: 0.86
    gold_structural_lr_f1_stag: 0.8
    gold_structural_lr_f1_prog: 0.92
    lf_derived_gb_macro_f1: 0.9951
    circularity_gap_pp: 10.5
    gold_structural_gb_accuracy: 0.91
    top3_features_importance:
    - cmd_repetition_ratio: 0.28
    - unique_cmd_ratio: 0.19
    - file_diff_count: 0.15
  result_rationale: 'GB 从 0.9951 降到 0.89，~10.5pp drop 量化了 circular artifact。降幅来源：
    structural features 是 LF inputs 的超集（30 features 包含 cmd_rep 相关的 5+ 个 features），在
    LF-derived labels 上它们几乎完美重建 LF 投票逻辑。但在 gold labels 上，人类标注引入了 LFs 捕获不到的语义维度（如 "agent
    在 debugging 所以 重复命令是合理的"），structural features 无法覆盖这些 cases。然而 0.89 仍然很高 因为 stagnation
    的核心行为模式（反复执行、不产生变更、不尝试新方法）确实在结构 层面有强信号。Top-3 features 与 LF-derived 评估一致说明信号结构稳定。

    '
  tables:
  - name: 'Table 8: Structural Features — LF-Derived vs Gold Evaluation'
    content: '| Model | LF-Derived F1 | Gold F1 | Δ (pp) | Interpretation        |

      |-------|---------------|---------|--------|-----------------------|

      | LR    | 0.9874        | 0.86    | -12.7  | ~13pp circular        |

      | RF    | 0.9951        | 0.88    | -11.5  | ~12pp circular        |

      | GB    | 0.9951        | 0.89    | -10.5  | ~11pp circular        |

      '
  - name: 'Table 9: Feature Importance Stability (LF-Derived vs Gold)'
    content: '| Feature           | Rank (LF) | Rank (Gold) | Importance (Gold) |

      |-------------------|-----------|-------------|-------------------|

      | cmd_rep_ratio     | 1         | 1           | 0.28              |

      | unique_cmd_ratio  | 2         | 2           | 0.19              |

      | file_diff_count   | 3         | 3           | 0.15              |

      | edit_diversity     | 4         | 5           | 0.09              |

      | cmd_entropy       | 5         | 4           | 0.10              |

      '
  figures_description:
  - 'Bar chart: LF-derived vs Gold macro_f1 for LR/RF/GB，visually 量化 circularity gap'
  - 'Feature importance comparison: side-by-side bar chart LF vs Gold ranking'
  analysis: 'GB 0.89 on gold 落在 best tier [0.83, 0.92] 上部。Circularity gap ~10.5pp
    证明 in-domain 0.9951 确实包含 circular 成分，但 0.89 的 gold performance 证明 structural features
    捕获了真实 stagnation 信号。Feature importance ranking 在 LF-derived 和 gold 之间高度一致（Spearman
    ρ≈0.95），说明 circular artifact 主要是幅度膨胀 而非方向偏差——structural features 检测的确实是 stagnation，只是在
    LF labels 上 分数被人为放大了。

    '

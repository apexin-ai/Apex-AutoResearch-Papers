  - 'Lag distribution: violin plots comparing LF-derived vs gold-derived lag per LF'
  analysis: '80% alignment 落在 best tier [65, 85] 上部。LF-derived 和 gold-derived lag
    值 高度一致（cmd_rep: -1.87 vs -1.6, OB: +6.7 vs +7.2），验证 Claim 2 temporal dynamics
    不是 LF label 的循环产物。特别是 cmd_rep 的 leading 角色和 OB 的 lagging 角色在 gold 上完全确认，为 "LF
    temporal roles are systematic" 提供了 gold-validated evidence。

    '

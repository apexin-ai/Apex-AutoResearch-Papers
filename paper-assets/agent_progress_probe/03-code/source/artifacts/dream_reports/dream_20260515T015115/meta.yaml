    figures_description:
    - 'Fig A: Scatter plot — LF_Macro_F1 (x) vs Gold_Macro_F1 (y) for all methods.
      Structural methods far below y=x line (massive gold penalty); probes closer
      to y=x; LLM judge above y=x (improves on gold). Dashed line y=x highlights circular
      evaluation tax.'
    - 'Fig B: Grouped bar chart — F1_stag by method, LF labels vs gold labels side-by-side.
      Structural stag-F1 collapses from 0.99→0.68-0.71; probe stag-F1 drops less (0.86→0.76-0.78).
      Visualizes where structural fails most.'
    - 'Fig C: Confusion matrix heatmaps (2×2) for structural GB and probe on gold
      — structural shows massive FN block (gold=stag, pred=prog); probe shows more
      balanced errors.'
    - 'Fig D: Disagreement window analysis — stacked bars showing what fraction of
      each method''s predictions align with gold vs MV on the 143 contested windows.
      Probe aligns more with gold; structural aligns more with MV.'
    - 'Fig E: Distribution of probe prediction probability on gold-validated vs gold-rejected
      FP windows — bimodal: probe is confident on gold-validated FPs (mean prob 0.91),
      less confident on truly-wrong FPs (mean prob 0.72).'
    analysis: 'Gold set 结果确认 worst 档：structural dominance 是 circular evaluation artifact。

      核心证据链：(1) MV 与 gold 仅 78% 一致——22% 窗口上 LF 标签错误，以漏标语义停滞为主； (2) Structural 在 LF
      标签上 0.995 暴跌到 gold 上 0.78-0.80，因为 structural 本质是 LF 逆向工程器——它学会了 "cmd_rep high
      → stag, file_diff high → prog" 这套规则， 但这套规则在 22% 窗口上是错的；(3) Probe 在 gold 上 0.82-0.84，超过
      structural 2-4pp—— 语义表征学到了超越 LF 启发式的信号；(4) Probe 之前的 FP (on LF) 中 42% 被 gold
      验证 为正确——probe 的 "错误模式" 恰好是 gold 认为正确的模式；(5) LLM judge 在 gold 上提升， 进一步确认 LF 标签偏差而非方法本身的问题。

      论文 reframe 方向：Claim 1 从 "structural dominance" 转为 "circular evaluation as systematic
      risk"——30 个结构特征在 LF-derived labels 上 0.995 是问题的量化，不是成就。 Claim 2 变为 "probe gold-robustness"——embedding-based
      detectors 在噪声标签训练下 仍保留超越 LF 的信号。650-window benchmark 成为论文最重要的 resource contribution。

      风险与对策：κ=0.76 偏低可能被 reviewer 质疑标注质量——需要展示 adjudication 流程 + 分歧案例分析证明 κ 低是因为任务内在模糊性，不是标注者不称职。Gold
      样本 N=650 占 conf≥2 的 4.2%——reviewer 可能要求更大样本——对策是展示 3-seed 子采样稳定性 (std<0.01)。

      '

    analysis: 'Overlap ablation 是 circular evaluation 的 smoking gun。核心发现：移除 12 个与
      LF 直接重叠的特征后，structural 在 gold 上从 0.80 跌至 0.70——10pp 的 circular premium。 而 probe
      在 gold 上 0.82，领先残差 structural 12pp。

      这意味着：如果用一个 "公平" 的（non-circular）structural baseline，probe 始终更优。 Structural 的
      "优势" 完全建立在 evaluation circularity 上。

      残差 0.70 > random 0.50 证明 structural 不是完全无用——action diversity、trajectory position
      等特征确实有信号。但 0.70 的水平显著低于 probe（0.82-0.84），说明这些 hand-crafted 特征远不如 learned semantic
      representations 有效。

      论文呈现策略：将 overlap ablation 作为 "circular evaluation 量化" 的核心实验。 配合 gold validation
      结果，构建完整的 evidence chain：LF labels 上 structural 0.995 是问题（circular），不是成就（signal）。残差
      F1 0.70 是 structural 的 "真实能力"， 0.995 - 0.70 = 29.5pp 是 circular inflation。但需注意
      LF 标签上残差 0.87 也受间接 circularity 影响——即使非 overlap 特征也与 LF 输出有相关性。

      '

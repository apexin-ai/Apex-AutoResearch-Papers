      这些共享任务上，structural features（command patterns、file modification patterns） 天然相似——同一个
      bug 触发相似的 debugging 命令序列和文件修改，无论用哪个 agent。 因此 structural classifier 在共享任务上的表现被
      task-level similarity 而非 agent-invariant stagnation patterns 所支撑。

      移除共享实例后，GB 从 0.967 降到 0.89（-7.7pp）。降幅显著但 0.89 仍然 substantial ——structural 确实有跨
      agent 的迁移能力，只是被高估了。非共享任务更难（平均 solve rate 28% vs 42%），难任务上 stagnation patterns
      更 diverse、更 agent-specific，导致 structural 特征的迁移效果减弱。

      关键变化在 probe comparison：原始数据中 probe 50% FT 才追平 structural（0.968 ≈ 0.967）， isolation
      后 probe 10% FT 就超过 structural（0.91 > 0.89, +2pp）。Crossover point 从 50% 前移到 ~8%——probe
      的语义表征对 task-level variation 更 robust（embedding 编码语义而非表面命令模式）。Probe zero-shot
      基本不受影响（0.598→0.58, -1.8pp）， 因为 zero-shot 的瓶颈是 domain shift 而非 task overlap。

      共享实例更容易（solve rate 更高）也意味着原始评估高估了所有方法的 cross-agent 性能， 但 structural 受影响更大——structural
      的 task-specific pattern matching 在简单任务 上更有效。


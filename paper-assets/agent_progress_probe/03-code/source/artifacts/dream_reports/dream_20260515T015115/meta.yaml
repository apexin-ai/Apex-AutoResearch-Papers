  - name: llm-judge-fewshot
    plan_id: llm-judge-fewshot
    description: LLM-as-judge 加入 5-shot exemplars + chain-of-thought prompting，在 gold
      set 650 窗口上评估
    expected_results:
      model: claude-sonnet-4-6
      mode: 5-shot + CoT
      n_windows: 650
      gold_macro_f1: 0.7234
      gold_f1_stag: 0.6712
      gold_f1_prog: 0.7756
      gold_accuracy: 0.7369
      gold_precision_macro: 0.7518
      gold_recall_macro: 0.7102
      delta_vs_zeroshot_pp: 3.43
      structural_gb_advantage_pp: 22.51
      probe_advantage_pp: 13.78
      api_cost_usd: 18.92
      total_tokens: 4812000
      avg_latency_ms: 3200
      stag_recall: 0.6389
      stag_precision: 0.7081
      common_FN_pattern: diverse-action stagnation where steps look productive in
        isolation
      common_FP_pattern: repetitive but effective debugging loops
    result_rationale: 'Best 档中 LLM-judge fewshot 仍 ≤0.75。Few-shot + CoT 相比 zero-shot
      带来 ~3.4pp 提升 是合理的：exemplars 帮助 LLM 校准 stagnation 的 threshold（尤其是理解"语义多样但无效"
      模式），CoT 迫使 LLM 显式推理窗口内的进度而非逐步评估。但提升有限的原因：

      (1) Stagnation 是 window-level 的集体属性——LLM 在 single-pass reading 中难以稳定 追踪 5 步之间的
      goal-directed coherence，few-shot 只教了"什么算停滞"但没教"如何 系统性地追踪 progress across steps"；

      (2) LLM 的核心盲点在于 diverse-action stagnation（agent 做了编辑、运行、读文件等 多样操作，看起来 productive
      但实际没有推进 goal），这类模式即使有 exemplars 也很难 被 LLM 通过单次阅读识别——需要对比前后状态差异，而非仅读动作序列；

      (3) CoT 增加了 token 开销 ~60%，但换来的准确率提升有限，因为 stagnation 判断的 bottleneck 不是"推理不够"而是"信息提取不够"——LLM
      需要的是结构化特征（文件变化频率、 命令重复率）而非更长的推理链。

      0.723 仍大幅低于 structural 0.948（-22.5pp）和 probe 0.861（-13.8pp），效率差距 在 best-case
      LLM 配置下依然显著。这验证了核心 claim：structural features 的优势 不是因为 LLM baseline 太弱，而是任务本质上更适合结构化特征提取。

      '

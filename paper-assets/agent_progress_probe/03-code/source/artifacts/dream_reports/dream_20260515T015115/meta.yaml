      输入的子集或高度相关变量——cmd_rep LF 直接使用 command_repetition_ratio， file_diff LF 直接使用 file_diff_count。当
      evaluation labels 也由这些 LF 生成时， 这些特征天然具有近完美预测力，但这是 tautological 的。

      残差 18 个特征（action diversity entropy、trajectory position、output length 特征等） 在
      gold 上仅 0.70——比 full structural 低 10pp，比 probe 低 12pp。这证实： structural 在 gold
      上的 0.80 中，约 10pp（~55%的有效 signal）来自 LF-overlap 特征 的 circular 贡献。

      残差 0.70 仍高于 random (0.50) 20pp——非 overlap 特征确实捕获了一些真实停滞信号。 Action diversity
      entropy 是最强残差特征（gini=0.18）：停滞窗口的动作多样性确实偏低， 这不完全等同于 cmd_rep（低多样性 ≠ 高重复）。Trajectory
      position 也有信号：停滞更多 发生在中后段。但这些信号远不足以与 probe 的语义表征竞争。

      Overlap-only 特征在 gold 上 0.77——高于残差（0.70），因为 cmd_rep 和 file_diff 确实 捕获了真实的停滞信号（重复和无文件变更是停滞的真实指标）。问题不是这些特征无信息量，
      而是在 LF-derived labels 上评估它们将 0.77 的真实能力膨胀为 0.98。

      在 LF 标签上，残差仍达 0.87（vs 0.995 full），因为即使非 overlap 特征也与 LF 输出 间接相关（如 action_diversity
      与 cmd_rep 相关 r≈0.6）——这进一步说明 LF-label evaluation 的 circularity 不仅限于直接 overlap
      特征。


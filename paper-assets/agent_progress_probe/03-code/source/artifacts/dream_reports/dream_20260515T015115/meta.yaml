      86% gold=MV，这些特征在 gold 上也有价值（不是纯 artifact）。Structural 的真实优势来自 "包含 LF 规则作为特征"
      的工程优势 + 非循环补充信号，而非比 probe 更好地理解 stagnation。


      LF-eval 上 residual 0.92（vs full 0.9951 = -7.5pp）：LF 标签上仍很高因为非循环特征（output length

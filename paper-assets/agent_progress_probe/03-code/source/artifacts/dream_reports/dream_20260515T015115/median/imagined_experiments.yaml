tier: median
narrative_guidance: 'Gold 部分验证 MV 标签——86% 一致但在语义多样停滞上存在系统性分歧（FP 高置信区）。

  Structural 仍优于 probe 但 gap 从 ~9pp 缩至 ~5pp on gold；''dominance'' 降级为 ''practical
  advantage in zero-data deployment''。

  论文增加 ~0.5 page subsection ''Gold Annotation Reveals LF Label Noise Patterns''，将
  MV-gold 分歧作为额外方法论贡献。

  Circular evaluation 从 caveat 升级为 finding：structural 在 gold 上 -10.5pp vs LF-eval，量化循环膨胀。

  Probe 叙事加强：gold 上仅 -6.5pp（vs structural -10.5pp），''semantic probe demonstrates robustness
  to label noise''。

  Cross-agent headline 从 +36.9pp 调整为 gold-estimated ~+20pp（in-domain scaling factor
  5/9 applied to cross-agent LF gap）。

  整体仍是 solid EMNLP Findings paper；headline 数字更保守但方法论贡献增厚。

  '
imagined_experiments:
- name: gold-set
  plan_id: gold-set
  description: 650 windows human gold annotation evaluation — all methods re-evaluated
    against gold labels; gold-MV disagreement analysis; inter-annotator agreement;
    GO/NO-GO gate for paper claims
  expected_results:
    gold_n: 650
    gold_stag_count: 207
    gold_prog_count: 443
    gold_stag_rate: 0.318
    gold_kappa: 0.78
    gold_mv_agreement_rate: 0.86
    gold_mv_agreement_n: 559
    gold_mv_disagreement_n: 91
    mv_prog_gold_stag: 72
    mv_stag_gold_prog: 19

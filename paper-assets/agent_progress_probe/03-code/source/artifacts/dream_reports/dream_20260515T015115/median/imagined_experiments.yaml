    structural_gb_gold_macro_f1: 0.89
    structural_gb_gold_f1_stag: 0.84
    structural_gb_gold_f1_prog: 0.94
    structural_gb_gold_accuracy: 0.91
    structural_gb_lf_to_gold_drop_pp: -10.5
    probe_gold_macro_f1: 0.84
    probe_gold_f1_stag: 0.78
    probe_gold_f1_prog: 0.9
    probe_gold_accuracy: 0.87
    probe_lf_to_gold_drop_pp: -6.5
    structural_gb_minus_probe_gold_pp: 5
    structural_rf_minus_probe_gold_pp: 4
    twv_probe_gold_macro_f1: 0.83
    twv_probe_gold_f1_stag: 0.77
    twv_probe_gold_f1_prog: 0.89
    llm_judge_zeroshot_gold_macro_f1: 0.68
    llm_judge_zeroshot_gold_f1_stag: 0.62
    llm_judge_zeroshot_gold_f1_prog: 0.74
    mv_gold_macro_f1: 0.92
    mv_gold_f1_stag: 0.88
    mv_gold_f1_prog: 0.96
    indomain_gold_scaling_factor: 0.56
    estimated_crossagent_gold_gap_pp: 20.6
    disagree_semantic_diverse_stag_n: 72
    disagree_semantic_diverse_stag_pct: 79.1
    disagree_cmdrep_fp_n: 19
    disagree_cmdrep_fp_pct: 20.9
    structural_gb_correct_on_disagree_pct: 0.22
    probe_correct_on_disagree_pct: 0.38
    llm_judge_correct_on_disagree_pct: 0.52
  result_rationale: 'Gold κ=0.78: 停滞判定在明显情况下（重复命令、完全停转）annotators 高度一致，但在 "agent 执行多样化动作却无实质进展"
    的窗口上存在合理分歧——一个 annotator 可能看到多样动作判 progress，另一个看到无效果判 stagnation。κ=0.78 处于 substantial
    agreement 上端，足以支撑 gold set 作为评估基准但不高到 trivial。


    Gold-MV agreement 86%: 650 窗口中 559 个 MV 标签与 gold 一致。14% 分歧（91 窗口）高度非对称——79% 是
    MV=progress/gold=stagnation。这是因为 3 个 LF 都依赖结构信号（命令重复、文件变化、outcome）：当 agent 执行多样但无效的动作序列时，cmd_rep
    不触发（动作不重复）、file_diff 不触发（文件确实在变化只是无用变化）、OB 可能也不触发——所有 LF 说 progress，但人类看到的是语义停滞。剩余
    21% 分歧（19 窗口）是反向的：agent 重复命令但实际在迭代调试，cmd_rep 触发标为 stagnation 但人类判 progress。


    Structural RF/GB gold 0.88/0.89: 从 LF-eval 0.9951 下降 ~10.5-11.5pp。结构特征本质上是 LF
    输入的超集（30 维中包含 cmd_rep_ratio、file_diff_freq 等直接对应 LF 规则的特征），在 LF-derived labels
    上几乎完美预测是 circular artifact。Gold 打破循环后，structural 模型在 72 个 MV=prog/gold=stag 窗口上大多预测
    progress（因为这些窗口的结构特征与 LF 判定一致），导致系统性 FN。但 structural 仍维持 0.88+ 因为：(a) 14% 分歧窗口中仍有部分被其他非循环特征（如
    output length decay、step timing patterns）正确分类；(b) 86% 一致窗口上 structural 几乎完美。GB
    略优于 RF 因为 boosting 对边界样本学到了更细的决策面。


    Probe gold 0.84: 从 LF-eval 0.9055 仅下降 6.5pp（vs structural 10.5pp）。probe 虽在 LF
    噪声标签上训练，但 GRU 从 embeddings 中学到了部分语义信号——embedding 空间中 "多样但无效" 的窗口与 "真正进步" 的窗口有可分离的表示差异（embedding
    编码了动作的语义内容和变化模式，不仅仅是结构信号）。probe 在 72 个语义多样停滞窗口上约 38% 正确预测 stagnation（vs structural
    的 22%），因为 embedding 捕获了 "内容重复但表面不同" 的模式。Probe 更小的 gold 下降量支撑 "robustness to label
    noise" 叙事。


    Structural-probe gap 5pp on gold: LF-eval 上 ~9pp 中约 4pp 是 circular inflation（structural
    获益不公平），gold 消除这部分后 gap 缩至 5pp。这 5pp 是 structural 的真实优势——来自显式特征提取在小数据/零适配场景下的信息效率优势，而非循环评估膨胀。


    LLM-judge zero-shot gold 0.68: 比 LF-eval (0.6625) 略高 +1.75pp。LLM 是独立评估器，不受 LF
    循环影响。在 72 个语义多样停滞窗口上，LLM 约 52% 正确（优于 probe 和 structural），因为 LLM 能理解 "动作多样但无进展"
    的语义。但 LLM 在其他窗口上仍有较高误判率（对长尾结构模式不稳定），整体提升有限。


    Gold stag rate 31.8% vs MV 的 ~27%: gold 判定比 MV 多 ~4.8pp stagnation（因 72 个 MV-miss
    的语义停滞），支撑 "LFs systematically undercount semantic diverse stagnation" 的发现。

    '

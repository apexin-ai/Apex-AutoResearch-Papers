  figures_description:
  - 'Fig: Grouped bar chart — macro_f1 of each method on LF-eval vs Gold-eval, 双色柱状图直观展示
    circular inflation 的差异幅度。Structural 柱高差最大，probe 差最小。'
  - 'Fig: Gold-MV disagreement heatmap by LF firing pattern — 91 个分歧窗口按 3 个 LF 的触发状态（火/不火）分
    8 格，展示 semantic diverse stagnation 集中在 (cmd_rep=0, file_diff=0) 或 (cmd_rep=0,
    file_diff=1, OB=0) 区域。'
  - 'Fig: Scatter plot — probe prediction probability vs gold label on 91 disagreement
    windows, 展示 probe 在 MV=prog/gold=stag 窗口上的概率分布（部分接近 0.5 threshold），支撑 ''probe
    captures partial semantic signal'' 的叙事。'
  analysis: 'GO/NO-GO 判定：GO（有条件）。


    Gold κ=0.78 确认 stagnation 概念在人类判断上有足够一致性，task formulation 成立。86% gold-MV agreement
    说明 LF pipeline 整体可靠但存在系统性盲区——语义多样停滞占分歧的 79%，这正是 structural features 无法检测的 failure
    mode（因为结构上看起来像 progress）。


    核心影响：

    1. Claim 1 措辞从 ''dominance'' 改为 ''practical advantage''。Gold 上 structural GB 0.89
    仍优于 probe 0.84（+5pp），但幅度大幅缩水。论文需强调这是 "zero-data deployment advantage"——当目标 agent
    无标注数据时，structural 仍是最佳选择，但优势不再是压倒性的。

    2. Circular evaluation 量化为 finding：structural 在 LF-eval 上的 0.9951 中有 ~10.5pp 是
    circular inflation。这是 weak supervision 评估方法论的重要贡献——quantifies the ceiling of LF-derived
    evaluation。

    3. Probe robustness narrative 加强：probe 在噪声标签训练后仍在 gold 上保持 0.84（仅 -6.5pp），且在语义多样停滞窗口上比
    structural 更准（38% vs 22%）。这支撑 "stagnation signals exist in embeddings but require
    adaptation to extract" 的核心论点。

    4. 新增 ~0.5 page subsection：Gold disagreement analysis 作为额外贡献，分析 LF 系统性误标模式。72
    个 MV=prog/gold=stag 窗口的共同特征：(a) 命令多样性高（cmd_rep 不触发），(b) 文件变化频繁但无效（file_diff 不触发），(c)
    outcome 未解决但 OB 窗口内未回传。这为 weak supervision on sequential data 提供实证指导——结构性 LFs
    天然遗漏语义级 failure modes。

    5. TLM negative finding 不受影响——三种 TLM 在 gold 上的表现模式与 LF-eval 一致。

    6. 论文整体评级：EMNLP Findings 水平。headline 数字更保守但增加了 gold-based error analysis 的方法论贡献，reviewer
    对 circular evaluation concern 有了定量回应。

    '
- name: llm-judge-fewshot
  plan_id: llm-judge-fewshot
  description: LLM-as-judge few-shot + CoT variant (Claude Sonnet, 5-shot with stagnation
    examples covering semantic diverse stagnation cases + chain-of-thought prompting),
    evaluated on 650 gold windows
  expected_results:
    llm_judge_fewshot_gold_macro_f1: 0.76
    llm_judge_fewshot_gold_f1_stag: 0.71
    llm_judge_fewshot_gold_f1_prog: 0.81
    llm_judge_fewshot_gold_accuracy: 0.79
    llm_judge_zeroshot_gold_macro_f1: 0.68
    delta_fewshot_vs_zeroshot_pp: 8.0
    structural_gb_gold_macro_f1: 0.89
    structural_advantage_over_fewshot_pp: 13.0
    probe_gold_macro_f1: 0.84
    probe_advantage_over_fewshot_pp: 8.0
    api_cost_usd_estimated: 14.5
    inference_time_per_window_ms: 2800
    total_tokens_estimated: 3800000
    fewshot_correct_on_semantic_diverse_stag_pct: 0.61
    fewshot_correct_on_agree_windows_pct: 0.82
    parse_failures: 2
    cot_avg_reasoning_tokens: 180
  result_rationale: 'Few-shot + CoT 从 0.68 提升到 0.76（+8pp）有三层原因：


    (1) 5 个示例覆盖关键 failure modes：选取的 few-shot 示例特意包含 2 个语义多样停滞窗口（agent 执行多样命令但无进展）+
    2 个明确停滞 + 1 个命令重复但实际进步的边界案例。这直接教会 LLM "多样 ≠ 进步" 的判断标准——zero-shot 时 LLM 倾向把多样化动作序列判为
    progress。Few-shot 后在 72 个语义多样停滞窗口上正确率从 52%→61%。


    (2) CoT 改善边界案例推理：chain-of-thought 迫使 LLM 显式评估 "这些动作是否向目标推进" 而非仅看动作多样性。但 CoT 也引入新的错误模式——过度推理导致在一些清晰窗口上
    overthink（~3% 的明确 progress 窗口被 CoT 推理为 stagnation）。


    (3) 天花板效应：LLM 处理 5 步窗口的文本时缺乏全 trajectory 上下文——无法判断当前窗口在整体求解过程中的位置。这限制了 few-shot
    的提升空间。对比 structural（有显式 trajectory position 特征）和 probe（GRU 编码时序上下文），LLM 少了 position-aware
    信号。


    Structural 仍领先 +13pp（0.89 vs 0.76）：structural 的非循环特征（output length decay、step
    timing、error patterns）在清晰窗口上比 LLM 的文本推理更稳定。

    Probe 领先 +8pp（0.84 vs 0.76）：probe 的 embedding 时序建模比 LLM 的 window-level 推理更高效。


    成本论证不变：structural <5ms/window 且 $0 vs LLM $14.5 + 2800ms/window。即使 few-shot 缩小了
    accuracy gap，cost-performance tradeoff 仍明确支持 structural/probe。

    '
  tables:
  - name: 'Table: LLM-Judge Variants on Gold'
    description: '| Variant          | Gold F1 | Δ vs Structural | Cost ($) | ms/window
      |

      |------------------|---------|-----------------|----------|-----------|

      | Zero-shot        | 0.68    | -21.0pp         | 11.66    | 2200      |

      | 5-shot + CoT     | 0.76    | -13.0pp         | 14.50    | 2800      |

      | Structural GB    | 0.89    | ref             | 0        | <5        |

      | GRU Probe        | 0.84    | -5.0pp          | 0        | <10       |

      Few-shot 缩小 gap 8pp 但 cost 增 24%，structural cost-performance 优势仍 overwhelming。

      '
  figures_description:
  - 'Fig: Cost-accuracy Pareto frontier — x=inference cost per window, y=gold macro_f1.
    Structural 和 probe 在左上角（低成本高准确），LLM variants 在右下方。Few-shot 比 zero-shot 右移（更贵）且上移（更准）但仍远未达
    Pareto frontier。'
  analysis: 'Few-shot 的 +8pp 提升可写入论文但不改变核心叙事。关键论点：

    1. Structural 仍领先 +13pp on gold（$0 cost）——cost-performance argument 完整保留。

    2. Few-shot 在语义多样停滞上最好（61% correct），但这个子集仅占 11% 窗口——LLM 在大量清晰窗口上仍不如 structural/probe
    稳定。

    3. 论文可增加一行 Table 对比 few-shot，但 few-shot 需要标注数据选 exemplars，这违背了 structural 的 zero-data
    优势定位——fair comparison 应指出 few-shot 也需要目标域知识。

    4. 对 reviewer "why not LLM" 的回应更强：即使 5-shot + CoT，structural 仍 +13pp at 零成本。

    '
- name: structural-feature-overlap-ablation
  plan_id: structural-feature-overlap-ablation
  description: 从 30 维 structural vector 中移除与 LF 规则直接重叠的特征（cmd_rep_ratio, unique_cmd_ratio,
    file_diff_freq, file_diff_delta 等 ~12 个 LF-overlapping 特征），保留 ~18 个非循环特征（output
    length stats, step timing, error frequency, edit size patterns），在 gold 650 窗口上评估
    residual F1
  expected_results:
    full_30dim_gold_macro_f1: 0.89
    residual_18dim_gold_macro_f1: 0.8
    residual_18dim_gold_f1_stag: 0.74
    residual_18dim_gold_f1_prog: 0.86
    residual_18dim_gold_accuracy: 0.83
    circular_contribution_pp: 9.0
    noncircular_contribution_pp: null
    residual_18dim_lf_eval_macro_f1: 0.92
    residual_18dim_lf_to_gold_drop_pp: -12.0
    full_30dim_lf_eval_macro_f1: 0.9951
    removed_features_n: 12
    retained_features_n: 18
    top_residual_features_by_importance:
    - output_length_decay_rate
    - step_time_variance
    - error_message_frequency
    - edit_size_entropy
    - unique_file_count_ratio
    probe_gold_macro_f1: 0.84
    residual_vs_probe_gap_pp: -4.0
  result_rationale: '移除 12 个 LF-overlapping 特征后 gold F1 从 0.89 降至 0.80（-9pp），解读分三层：


    (1) Circular 贡献量化为 ~9pp：30 维中 12 个直接映射 LF 规则的特征（cmd_rep_ratio → cmd_rep LF，file_diff_freq
    → file_diff LF，etc.）贡献了 gold F1 中约 9pp。这些特征在 LF-eval 上贡献更大（0.9951 vs 0.92 = 7.5pp），但在
    gold 上也有真实价值——因为 86% 的 gold 标签与 MV 一致，LF-aligned 特征在这些窗口上确实检测了真实 stagnation。


    (2) 剩余 18 维特征产生 0.80 gold F1——显著高于随机（~0.50）。非循环信号包括：

    - output_length_decay：停滞窗口中 LLM 输出越来越短（尝试减少），这是 LF 未编码的行为信号

    - step_time_variance：停滞时步长时间更均匀（机械性重试），progress 时时间方差更大（深度思考 vs 快速动作）

    - error_message_frequency：停滞窗口中错误信息更密集

    - edit_size_entropy：停滞时编辑大小分布更集中（反复小改），progress 时更分散

    但这些信号不够支撑 "dominance" claim——residual 0.80 实际上低于 probe 的 0.84。


    (3) Residual < probe（0.80 vs 0.84，-4pp）：关键发现。去掉循环成分后，structural 的非循环信号不如 probe
    的语义信号。这意味着 structural 的 gold 优势（0.89 vs 0.84 = +5pp）中约 9pp 来自 LF-aligned 特征——但因为
    86% gold=MV，这些特征在 gold 上也有价值（不是纯 artifact）。Structural 的真实优势来自 "包含 LF 规则作为特征" 的工程优势
    + 非循环补充信号，而非比 probe 更好地理解 stagnation。


    LF-eval 上 residual 0.92（vs full 0.9951 = -7.5pp）：LF 标签上仍很高因为非循环特征（output length
    decay 等）与 LF 标签仍有较强相关——停滞窗口确实表现出这些模式。但 gold 上 residual 下降更大（-12pp from 0.92 to
    0.80）因为非循环特征在语义多样停滞窗口上也失效——agent 多样化尝试时 output length 未必衰减、error 未必更频繁。

    '
  tables:
  - name: 'Table: Structural Feature Overlap Ablation on Gold'
    description: '| Feature set              | N_dim | LF-Eval F1 | Gold F1 | LF→Gold
      drop |

      |--------------------------|-------|-----------|---------|-------------- |

      | Full structural          | 30    | 0.9951    | 0.89    | -10.5pp      |

      | Non-circular residual    | 18    | 0.92      | 0.80    | -12.0pp      |

      | Circular contribution    | —     | +7.5pp    | +9.0pp  | —            |

      | GRU Probe (reference)    | 1024  | 0.9055    | 0.84    | -6.5pp       |

      Non-circular structural (0.80) < probe (0.84): structural 的 gold 优势部分依赖 LF-aligned
      特征。

      '
  figures_description:
  - 'Fig: Feature importance bar chart — 18 个 non-circular 特征在 gold evaluation 上的
    permutation importance 排名。output_length_decay 和 step_time_variance 贡献最大，展示哪些非循环信号是
    stagnation 的真实 indicator。'
  - 'Fig: Venn-style diagram — structural F1 的组成分解：circular component (0.09), non-circular
    component (0.30 above chance), overlap region. 对比 probe 的 0.34 above chance。'
  analysis: '这个实验是 circular evaluation finding 的核心证据。关键叙事：

    1. Structural 的 gold 优势（+5pp vs probe）中约 9pp 来自 LF-aligned 特征。这不是纯 artifact——86%
    gold 与 MV 一致意味着 LF-aligned 特征在大多数窗口上确实检测了真实 stagnation。但称之为 "dominance" 不合适。

    2. 非循环 residual 0.80 < probe 0.84：structural 在去除循环成分后不如 probe。这支撑 "probe captures
    genuine semantic signal" 的叙事。

    3. 论文呈现策略：Structural 的优势来自 (a) 包含 LF 规则作为显式特征的工程优势 + (b) 非循环补充信号。这在零数据部署场景下仍有明确实用价值——不需要训练，不需要
    embedding 模型，不需要适配。

    4. 这个 ablation 为 ''Circular Evaluation as Finding'' 小节提供定量支撑：LF-eval 上 structural
    的 0.9951 中至少 7.5pp 是循环膨胀（gold 上是 9pp）。

    '
- name: cross-agent-instance-isolation
  plan_id: cross-agent-instance-isolation
  description: 重新评估 cross-agent structural GB，确保 SWE-bench instance 在 train/test 间完全隔离（同一
    issue 的不同 agent run 不跨 split），排除 instance-level information leakage
  expected_results:
    original_gb_cross_agent_all: 0.9674
    isolated_gb_cross_agent_all: 0.93
    delta_pp: -3.7
    isolated_gb_f1_stag: 0.89
    isolated_gb_f1_prog: 0.97
    isolated_gb_accuracy: 0.94
    original_rf_cross_agent_all: 0.9123
    isolated_rf_cross_agent_all: 0.88
    isolated_rf_delta_pp: -3.2
    n_shared_instances_removed: 47
    n_test_windows_after_isolation: 142800
    n_train_windows_after_isolation: 13200
    leakage_effect_size_pp: 3.7
    probe_zeroshot_for_reference: 0.5984
    isolated_structural_advantage_over_probe_zeroshot_pp: 33.2
    original_structural_advantage_over_probe_zeroshot_pp: 36.9
  result_rationale: 'Instance isolation 导致 GB 从 0.967 降至 0.93（-3.7pp），存在微量但非 trivial
    的 leakage 效应：


    (1) Leakage 机制：SWE-bench 中同一 issue 可能被 SWE-Agent（训练集）和 OpenHands（测试集）同时尝试。虽然两个
    agent 的行为模式完全不同，但同一 issue 可能有 issue-specific 的 structural signatures——比如某些 issue
    天然导致更多文件操作或更长的调试循环。Structural features 中的某些维度（如 unique_file_count、error_frequency）可能携带
    issue-level 信号。移除 ~47 个 shared instances 后，测试集失去了这些 train-side 可见 issue 的 structural
    context。


    (2) 下降幅度 3.7pp 的分解：

    - ~2pp 来自真实 leakage 消除——shared instances 上模型确实利用了 issue-level structural patterns

    - ~1.7pp 来自 train set 缩小效应——移除 shared instances 减少了约 8% 训练数据，GB 对此有轻微敏感性


    (3) 0.93 仍远优于 probe zero-shot 0.598（+33.2pp）：leakage 效应真实存在但不 invalidate structural
    的 cross-agent transfer 优势。核心论点保持：structural features 在零样本跨 agent 迁移上大幅领先 probe，gap
    从 +36.9pp 微调至 +33.2pp。


    (4) RF 下降更温和（-3.2pp vs GB -3.7pp）：RF 的 bagging 天然更不依赖单个 instance 的信号，对 leakage
    removal 更鲁棒。但 RF 基线更低（0.9123→0.88），整体仍不如 GB。


    (5) 为什么不会降得更多：structural features 本质上是 agent 行为模式的汇总统计量（cmd_rep_ratio、file_diff_freq
    等），主要反映 agent 架构差异而非 issue 差异。SWE-Agent 和 OpenHands 在同一 issue 上的 structural pattern
    可能完全不同——前者多用 shell 命令，后者更多文件编辑。Issue-level leakage 只通过少数 issue-invariant 的特征（如
    issue 难度 → 总步数 → stagnation 概率）传导，影响有限。

    '

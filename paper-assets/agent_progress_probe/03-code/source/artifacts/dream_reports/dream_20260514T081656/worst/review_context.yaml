narrative_guidance: '原始三条claims均无法按设计强度成立。全量数据泛化失败确认conf≥2选择偏差，probe增量价值存疑， 跨agent迁移基本失败。Reframe为empirical
  study："What Do Labeling Functions Reveal About Agent Stagnation?" 核心贡献转向(1)首个大规模agent
  stagnation弱监督标注框架+taxonomy， LF temporal dynamics分析成为主要发现；(2)全量vs高conf性能差异作为data
  programming在 sequential data上failure mode的实证贡献；(3)负面结果指出未来方向。仍投EMNLP但走Findings track。

  '
imagined_experiments:
- name: 全量数据训练（conf≥1）
  plan_id: probe-002
  description: 全量54,809窗口训练GRU probe，对比conf≥2子集的0.9055基线
  expected_results:
    fulldata_macro_f1: 0.74
    fulldata_accuracy: 0.78
    fulldata_f1_stagnation: 0.67
    fulldata_f1_progress: 0.81
    conf2_macro_f1_reference: 0.9055
    f1_drop_pp: 16.55
    fulldata_gap_vs_repeat3_pp: 1.2
    fulldata_val_macro_f1_best: 0.77
    best_epoch: 5
  result_rationale: 'conf≥1包含39,408个conf=1窗口（占总量72%），这些窗口只有单个LF投票，标签本质上 等于单个启发式规则的输出，噪声率极高。在worst档下，这些低置信度标签中相当比例
    是错误的——尤其是stagnation类，因为command_repetition和file_diff_delta在边界 情况下容易误判（例如agent在探索不同文件但diff很小，或重复了一次命令但不构成停滞）。
    conf≥2的0.9055实际上是选择偏差的产物：高置信度窗口是多个LF一致同意的"容易"样本， 这些窗口的stagnation模式更明显（反复执行相同命令、diff为零等），分类器在这些
    pattern-obvious的样本上自然表现好。引入全量数据后，模型需要处理大量歧义样本， GRU无法从嘈杂标签中学到一致的时序信号，F1跌至0.74，与Repeat-3的差距收窄到
    仅1.2pp，统计上可能不显著（p>0.05），直接动摇Claim 2的核心论据。

    '
  tables:

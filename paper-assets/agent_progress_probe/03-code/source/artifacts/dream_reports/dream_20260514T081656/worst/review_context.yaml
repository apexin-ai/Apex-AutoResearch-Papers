- name: LF Temporal Dynamics
  plan_id: lf-temporal-dynamics
  description: 分析各LF在stagnation onset相对时间上的激活模式
  expected_results:
    cmd_rep_avg_lead_steps: 1.8
    cmd_rep_leading_indicator: true
    file_diff_avg_lead_steps: 0.5
    file_diff_concurrent: true
    outcome_bp_avg_lag_steps: 2.3
    outcome_bp_lagging_indicator: true
    temporal_ordering_consistent_pct: 72
    lf_transition_patterns_found: 4
  result_rationale: 'LF temporal dynamics是worst档下最有价值的正面发现。command_repetition 平均在stagnation
    onset前1.8步开始亮灯（leading indicator）——agent开始 重复命令是停滞的早期信号。file_diff_delta几乎同时激活（concurrent，lead
    0.5步）， 因为命令重复很快导致文件变化停滞。outcome_backpropagation滞后2.3步 （lagging indicator），因为最终结果（test
    failure）需要等到窗口末端才能观察到。 这个leading→concurrent→lagging的时序排列在72%的stagnation事件中一致，
    构成一个可复现的"stagnation onset signature"。此外发现4种distinct的LF transition patterns（如"cmd_rep先亮→file_diff跟随"vs"file_diff先亮→cmd_rep不亮"），
    揭示了不同类型的stagnation有不同的信号组合。这是reframe后论文的核心发现之一， 因为它不依赖probe性能，而是对stagnation现象本身的实证分析。


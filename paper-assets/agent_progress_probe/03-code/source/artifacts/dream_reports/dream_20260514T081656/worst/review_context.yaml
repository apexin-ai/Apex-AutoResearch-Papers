    majority vote的输出，oracle直接复现了标签生成过程，probe反而因为 学习过程中的泛化损失略低于oracle。这直接证明probe在高conf子集上没有学到超越
    LF规则的信号，只是在拟合LF的输出。在全量数据上，oracle和probe几乎打平 （0.73 vs 0.74，差距1pp），说明probe的时序建模在noisy
    label下没有提供实质增量。 Oracle的优势在于零训练成本、完全可解释、无需embedding——probe的存在变得难以justify。


    columns:
    - Setting
    - Train Size
    - Macro-F1
    - Stag-F1
    - Prog-F1
    - Gap vs Repeat-3 (pp)
    rows:
    - - conf≥2 (probe-001)
      - 15,401
      - '0.9055'
      - '0.8593'
      - '0.9518'
      - '+6.24'
    - - conf≥1 (full)
      - 54,809
      - '0.74'
      - '0.67'
      - '0.81'
      - '+1.2'
    - - Δ
      - —
      - '-0.1655'
      - '-0.1893'
      - '-0.1418'
      - '-5.04'
  figures_description:
  - 'Bar chart: conf≥2 vs conf≥1在macro-F1/stagnation-F1/progress-F1上的对比，附error bar'
  - Confusion matrix对比：conf≥2训练 vs 全量训练的FP/FN分布差异
  analysis: 'F1下降16.55pp证实conf≥2是选择偏差。stagnation-F1下降最严重（-18.93pp）， 因为低conf窗口中stagnation的歧义性最高。与Repeat-3的差距从6.24pp缩小到1.2pp，
    在bootstrap CI下不显著。这是核心negative result：probe的"优势"高度依赖数据筛选， 不具备泛化性。但这本身是data programming在sequential
    data上的重要failure mode发现。

    '
- name: LF Ensemble Oracle Baseline
  plan_id: baseline-lf-oracle

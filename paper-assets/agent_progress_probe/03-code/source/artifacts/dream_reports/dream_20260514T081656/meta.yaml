      avg_tokens_saved_per_trajectory: 4200
      optimal_threshold: 0.7
      pareto_auc: 0.82
    result_rationale: '在320条held-out轨迹上模拟：当probe连续N个窗口输出P(stagnation)>threshold时触发early
      termination。 Threshold=0.7（推荐设置）：节省22% tokens（平均每条轨迹省4,200 tokens），success rate仅下降3.1%。
      下降来自Intervention Paradox：28条轨迹（8.7%）被probe正确识别为"当前停滞"后终止， 但实际上agent在后续步骤中"突破"了停滞并最终解决问题——这是fundamentally不可避免的。
      Threshold=0.5（激进）：35% token savings但7.8% success rate drop，部分premature termination。
      Threshold=0.9（保守）：仅12% savings但近零false termination。 Median档下这些数据是decent但不spectacular——22%
      savings不足以支撑standalone的"cost reduction"claim， 作为supplementary result放附录。

      '
    tables:
    - 'Table: Early Termination Tradeoff | Threshold | Token Savings % | Success Drop
      % | False Terminations | 0.5: 35%, -7.8%, 25 | 0.7: 22%, -3.1%, 10 | 0.9: 12%,
      -1.2%, 4'
    figures_description:
    - 'Pareto curve: x轴=success rate drop，y轴=token savings %，每个threshold一个点，含annotated
      optimal point'
    - 'Case study: 2-3个Intervention Paradox案例——probe正确检测stagnation但agent后来recovered'
    analysis: 'Early termination实验展示probe的practical deployment价值，但median档下savings不够impressive（22%）。

    expected_results:
      total_held_out_trajectories: 320
      threshold_07_token_savings_pct: 22
      threshold_07_success_rate_drop_pct: 3.1
      threshold_05_token_savings_pct: 35
      threshold_05_success_rate_drop_pct: 7.8

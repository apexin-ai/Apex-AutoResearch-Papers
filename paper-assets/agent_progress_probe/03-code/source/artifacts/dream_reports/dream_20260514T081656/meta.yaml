  - name: 全量数据泛化训练
    plan_id: probe-002
    description: conf≥1全量54,809窗口训练GRU probe，与conf≥2子集训练对比，验证标签噪声容忍度
    expected_results:
      fulldata_macro_f1: 0.8742
      fulldata_accuracy: 0.9031
      fulldata_f1_stagnation: 0.8189
      fulldata_f1_progress: 0.9295
      fulldata_precision_macro: 0.8853
      fulldata_recall_macro: 0.8648
      conf2_macro_f1_reference: 0.9055
      delta_vs_conf2_pp: -3.13
      gap_vs_repeat3_fulldata_pp: 6.52
      best_epoch: 5
      total_epochs: 10
      val_macro_f1_best: 0.8891
    result_rationale: 'conf=1窗口占总量72%（39,408/54,809），这些窗口仅有单个LF投票，标签噪声率约25-30%。 在best档位下，GRU的时序建模能力足以从噪声标签中提取一致的progress信号——
      因为多数conf=1窗口的噪声是随机的而非系统性的，GRU通过序列内一致性约束实现了隐式去噪。 F1从0.9055下降至0.8742（-3.13pp）是合理的：噪声增加但训练数据量增加3.6x提供了补偿。
      关键是gap vs Repeat-3仍保持6.52pp，证明probe在噪声条件下仍显著优于最强启发式。 训练需要更多epoch（5 vs 3）才能收敛，因为模型需要更多迭代来拟合噪声分布。

      '

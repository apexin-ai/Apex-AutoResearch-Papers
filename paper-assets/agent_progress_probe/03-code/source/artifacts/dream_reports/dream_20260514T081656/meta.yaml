    result_rationale: '在best档位下probe的错误总量较少（221/3,080 ≈ 7.2%），且错误分布揭示了有意义的模式。 FP（将progress误判为stagnation）集中在探索性行为——agent在搜索文件、阅读文档、
      尝试不同方法时，表面上看起来"没有进展"但实际在积累信息。这是probe的合理failure mode： information gathering确实与stagnation在embedding空间中相似（都表现为"无输出变化"）。
      FN（将stagnation误判为progress）集中在语义漂移场景——agent执行多样化但集体无效的命令， 每一步看起来都不同，embedding变化大但方向无效。这正是probe最难的case，也是future
      work方向。 67%的FP发生在最终resolved的轨迹中——probe对"暂时绕路但最终成功"的轨迹过于悲观。 Probe相比Repeat-3额外捕获了187个正确case，仅在34个case上不如Repeat-3——净增值清晰。


- name: 跨Agent迁移评估
  plan_id: cross-agent
  description: SWE-agent训练的probe在OpenHands轨迹上zero-shot评估，验证progress信号的跨实现迁移性
  expected_results:
    openhands_total_windows: 48352
    openhands_stagnation_windows: 18914
    openhands_progress_windows: 29438
    cross_agent_macro_f1: 0.8347
    cross_agent_accuracy: 0.8621
    cross_agent_f1_stagnation: 0.7823
    cross_agent_f1_progress: 0.8871
    cross_agent_precision_macro: 0.8456
    cross_agent_recall_macro: 0.8264
    within_agent_reference_f1: 0.9055

      - '0.9055'
      - '0.8593'
      - '0.9518'
      - +6.24pp
    - - conf≥1 (full)
      - 54,809
      - '0.8742'
      - '0.8189'
      - '0.9295'
      - +6.52pp
    - - Repeat-3
      - —
      - '0.8190'
      - '0.7512'
      - '0.8868'
      - —
  figures_description:
  - Learning curves对比图：conf≥2在epoch 3即收敛，conf≥1在epoch 5收敛但最终validation loss更低，说明大数据量最终弥补了噪声劣势
  - Per-confidence-level F1分解：conf=1/2/3测试窗口上的F1分别为0.83/0.91/0.96，展示模型在高置信窗口上表现更好但低置信窗口也可用
  analysis: 'F1仅下降3.13pp证明核心假设成立：conf=1噪声标签不显著损害probe学习能力。 Stagnation类F1下降更大（-4.04pp
    vs progress类-2.23pp），因为stagnation窗口在conf=1中噪声更高 （单个LF投stagnation时更易出错），但仍保持>0.81的可用水平。
    Gap vs Repeat-3在全量数据上反而略增（6.52 vs 6.24pp），因为Repeat-3在conf=1窗口上 表现更差——这些窗口包含更多语义多样的停滞模式，正是Repeat-3无法捕获的。

    '
- name: LF Ensemble Oracle Baseline
  plan_id: baseline-lf-oracle
  description: 直接用3个LF的实时输出做窗口级判定（majority vote），作为probe的上界参照
  expected_results:
    lf_oracle_macro_f1_conf2: 0.8612
    lf_oracle_macro_f1_fulldata: 0.8203
    lf_oracle_f1_stagnation_conf2: 0.7985
    lf_oracle_f1_progress_conf2: 0.9239
    lf_oracle_f1_stagnation_fulldata: 0.7341
    lf_oracle_f1_progress_fulldata: 0.9065
    gap_probe_vs_oracle_conf2_pp: 4.43
    gap_probe_vs_oracle_fulldata_pp: 5.39
    lf_oracle_coverage: 0.719
    abstain_rate: 0.281
  result_rationale: 'LF oracle直接使用LF投票结果，在conf≥2数据上表现较好因为这些窗口本身就是LF高一致的子集。 但oracle有两个固有局限：(1)
    它只能在有LF投票的窗口上做判定，覆盖率仅71.9%； (2) 它无法捕获LF规则之外的信号——比如action语义漂移、上下文依赖的progress模式。
    Probe在conf≥2上超oracle 4.43pp，在全量数据上超5.39pp，差距扩大因为conf=1窗口中 LF之间分歧大，oracle的majority
    vote退化为单LF判定。这证明GRU学到了超越LF启发式的信号。 stagnation类上差距更大（probe 0.8593 vs oracle 0.7985
    = +6.08pp）， 因为stagnation的语义多样性恰好是规则方法的盲区。

    '
  tables:
  - name: 'Table 4: Probe vs LF Oracle vs Baselines'
    columns:

    inter_run_variance_probe: 0.003
  result_rationale: 'LLM-as-judge在best档位下表现良好但不及probe，原因有三： (1) Window-level判定需要理解5-step序列的整体progress趋势，LLM倾向逐step评估再聚合，
    丢失stagnation onset的时序签名——与Mean-pooling的failure mode类似； (2) Zero-shot时LLM缺少domain-specific的progress/stagnation
    calibration， few-shot通过示例部分弥补（+3.34pp for Claude），但仍不如从15K样本中学习的probe； (3) LLM在stagnation检测上特别保守——倾向将"有动作执行"判为progress，
    即使这些动作集体无效。Claude优于GPT-4o因为对code/agent行为的理解更强。 Cost multiplier 31.3x来自：每窗口平均4,280
    tokens（5 steps × 800+ tokens/step + prompt）， 以Sonnet 4价格计算。Probe推理仅需前向传播1024×5维输入，成本几乎可忽略。


      - '0.8203'
      - 71.9%
    - - Repeat-3
      - '0.8432'
      - '0.8190'
      - 100%
    - - Cosine Similarity
      - '0.3129'
      - —
      - 100%
  figures_description:
  - Venn diagram：probe正确但oracle错误的样本 vs oracle正确但probe错误的样本，展示probe捕获了oracle遗漏的模式类型
  analysis: 'Probe vs LF oracle的差距（4.43-5.39pp）直接论证了Claim 1的核心： probe不只是在学LF的规则，而是从LF提供的弱监督信号出发，通过时序建模学到了更丰富的表示。
    Oracle在stagnation检测上尤其弱——LF设计时各自关注不同的stagnation信号 （file_diff_delta关注输出变化、command_repetition关注行为重复、outcome_backpropagation关注结果），
    它们的简单投票无法捕获多维度信号的交互。GRU通过序列建模隐式实现了这种信号融合。

    '

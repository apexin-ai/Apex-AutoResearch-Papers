  result_rationale: '跨agent迁移F1=0.8347，比within-agent低7.08pp但仍在best档可用范围[0.78, 0.88]内。
    下降来自三个因素：(1) OpenHands的action格式与SWE-agent不同——OpenHands使用 structured action space（CmdRunAction,
    FileEditAction等），而SWE-agent使用 free-form bash commands，embedding空间有分布偏移；(2) OpenHands的停滞模式不同——
    它有专门的think action和structured editing，某些SWE-agent中的"无效重复"在OpenHands中 不存在，但OpenHands有自己独特的停滞模式（如反复调用FileEditAction但diff为空）；
    (3) LF适配引入了少量noise——command_repetition LF需要重写以匹配OpenHands格式。 尽管如此，0.8347仍显著优于Repeat-3在OpenHands上的表现（0.7894,
    +4.53pp）， 证明probe学到的不是SWE-agent特有的行为模式，而是更通用的progress信号—— embedding空间中的"步骤间语义变化模式"在不同agent实现间部分共享。


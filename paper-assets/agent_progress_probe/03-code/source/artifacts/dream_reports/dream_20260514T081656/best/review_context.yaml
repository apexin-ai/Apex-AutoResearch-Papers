  - Heatmap：LF pair-wise agreement随窗口内步骤位置的变化，展示onset时低一致→peak时高一致的动态
  analysis: LF temporal dynamics为弱监督框架增添了分析深度： 不同LF捕获stagnation的不同阶段——从早期行为信号到中期输出信号到晚期结果信号。
    这是Snorkel到sequential data迁移的非平凡洞见——在i.i.d.设置中LF没有时序性， 但在trajectory上LF本身表现出leading/lagging动态。
    这个分析可以放在Analysis section中，强化方法论贡献的深度。

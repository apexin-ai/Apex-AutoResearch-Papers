- name: Mean-pooling + Logistic Regression Baseline
  plan_id: baseline-meanpool-lr
  description: 窗口内step embeddings均值池化 + LR分类，作为非时序建模的参数匹配下界
  expected_results:
    meanpool_lr_macro_f1: 0.7683
    meanpool_lr_accuracy: 0.8104
    meanpool_lr_f1_stagnation: 0.6571
    meanpool_lr_f1_progress: 0.8795
    meanpool_lr_precision_macro: 0.7892
    meanpool_lr_recall_macro: 0.7543
    gap_gru_vs_meanpool_pp: 13.72
    meanpool_lr_best_C: 0.1
    meanpool_svm_macro_f1: 0.7821
  result_rationale: 'Mean-pooling将5个step embeddings平均为单个1024维向量，完全丢弃了步骤间的时序信息。 在best档位下F1=0.7683，比GRU低13.72pp，差距显著。
    根本原因：stagnation的核心时序特征是"从有效到无效的转折点"—— 比如前2步有进展但后3步停滞，mean-pooling会将这种模式平均成"中等进展"，
    而GRU通过门控机制精确定位transition point。 Stagnation类F1尤其低（0.6571 vs GRU的0.8593），因为stagnation窗口中
    往往混有个别看似有效的step（如运行了新命令但结果无用），均值化后这些step 稀释了stagnation信号。Progress类相对好（0.8795）因为progress窗口中steps通常一致向前。
    SVM略优于LR（+1.38pp）因为非线性核捕获了部分embedding空间中的非线性边界， 但仍远不如GRU，说明瓶颈在时序建模而非分类器容量。

    '

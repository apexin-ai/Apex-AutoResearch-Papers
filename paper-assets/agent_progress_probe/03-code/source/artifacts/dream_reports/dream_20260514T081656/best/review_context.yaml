- name: LF Temporal Dynamics
  plan_id: lf-temporal-dynamics
  description: 分析哪个LF在stagnation onset最先激活（leading vs lagging indicator）
  expected_results:
    leading_indicator: command_repetition
    cmd_rep_avg_lead_steps: 1.8
    file_diff_avg_lead_steps: 0.3
    outcome_backprop_avg_lag_steps: -2.1
    first_lf_to_fire_distribution:
      command_repetition: 0.52
      file_diff_delta: 0.31
      outcome_backpropagation: 0.17
    temporal_agreement_at_onset: 0.34
    temporal_agreement_at_peak: 0.71
  result_rationale: 'command_repetition是最早的leading indicator（平均领先1.8步），因为行为重复通常是 stagnation的最早信号——agent开始重复尝试同样的方法。file_diff_delta几乎实时（领先0.3步），
    因为文件变化停止与stagnation几乎同时发生。outcome_backpropagation是lagging indicator （滞后2.1步），因为它依赖最终结果的回溯——只有在后续步骤确认失败后才激活。
    在onset时刻LF一致率仅34%，到stagnation peak时升至71%—— 这解释了为什么conf=1窗口噪声高：它们多处于onset阶段，LF还未达成共识。
    这个发现对probe设计有启示：probe可能从command_repetition信号中获益最多， 因为它是最早可用的监督信号。

    '

tier: median
narrative_guidance: 'Median档叙事核心转向：弱监督框架（Claim 1）升格为主贡献，probe从"性能大幅领先"降级为"在噪声标签下仍具竞争力的下游验证"。
  全量数据F1下降至0.82（-8.5pp），gap vs Repeat-3收窄至3.5pp，需要error analysis和定性证据补强。 跨agent迁移存在但需domain
  adaptation（zero-shot F1=0.73，few-shot可恢复至0.82+）。 LLM judge在gold标签上反超probe（0.82 vs
  0.77），probe优势锚定在cost-efficiency（35x cheaper）。 Paper叙事从"probe很强"转向"弱监督框架使这类研究成为可能，probe是框架的一个高效下游应用"。
  Claim 2从"显著优于"降级为"在噪声标签下仍具竞争优势+捕获Repeat-3遗漏的语义停滞模式"。 Claim 3从"保持有效"调整为"zero-shot迁移可行但需few-shot
  adaptation"。 补充confidence-aware training和data scaling曲线展示框架的实用性和数据效率。

  '
imagined_experiments:
- name: 全量数据训练（conf≥1）
  plan_id: probe-002
  description: 在全部54,809窗口（含39,408个conf=1噪声窗口）上训练GRU probe，对比conf≥2基线
  expected_results:
    fulldata_test_macro_f1: 0.82
    fulldata_test_accuracy: 0.865
    fulldata_test_f1_stagnation: 0.76
    fulldata_test_f1_progress: 0.88
    fulldata_repeat3_f1: 0.785
    gap_vs_repeat3_fulldata_pp: 3.5
    conf_ge2_only_macro_f1: 0.9055
    drop_from_conf2_pp: 8.5
    confidence_weighted_macro_f1: 0.84
    confidence_weighted_gain_pp: 2.0
    best_epoch_fulldata: 5
    training_windows: 54809
    val_macro_f1_best_fulldata: 0.85
  result_rationale: 'conf=1窗口占全量数据72%（39,408/54,809），这些窗口仅有单个LF投票，标签噪声率估计25-35%。 噪声主要影响stagnation类（少数类），因为conf=1中大量实际progress窗口被单个保守LF误标为stagnation，
    导致stagnation F1从0.8593暴跌至0.76（-10pp），而progress F1仅从0.9518降至0.88（-7pp）。 整体macro-F1下降8.5pp至0.82，符合median档[0.78,0.85]区间中部。
    Repeat-3在全量测试集上也受影响——conf=1窗口中许多语义停滞不涉及命令重复，Repeat-3从0.8432降至0.785。 Gap从6.24pp缩小至3.5pp，probe仍优于Repeat-3但优势不再compelling。
    Confidence-weighted training（loss按conf加权：conf3=1.0, conf2=0.7, conf1=0.3）部分恢复至0.84，
    说明显式建模标签可信度有帮助但无法完全补偿噪声——因为conf=1窗口的标签本身就有系统性偏差而非随机噪声。

    '
  tables:
  - 'Table: Full-data vs High-confidence Training | Setting | Macro-F1 | Stag-F1 |
    Prog-F1 | Gap vs R3 | conf≥2 only: 0.9055, 0.8593, 0.9518, +6.24pp | Full (conf≥1):
    0.82, 0.76, 0.88, +3.5pp | Conf-weighted: 0.84, 0.79, 0.89, +4.5pp'
  figures_description:
  - Bar chart对比三个训练设置（conf≥2, full, conf-weighted）在macro-F1和per-class F1上的表现，附带Repeat-3水平虚线作为参考
  - Confusion matrix对比：conf≥2训练 vs full训练，展示stagnation类FN显著增加
  analysis: '全量数据训练的F1下降证实了conf=1标签噪声是核心瓶颈。关键发现：(1) 噪声不对称——stagnation类受损更严重， 因为conf=1中存在大量"假stagnation"标签（单个保守LF的误判）；(2)
    confidence-weighted training恢复2pp， 说明框架的confidence信号有实际价值；(3) probe在全量数据上仍优于Repeat-3（+3.5pp），但优势收窄意味着
    Claim 2需从"显著优于"降级为"在噪声条件下仍具竞争优势"。 Paper叙事调整：强调conf≥2子集（15,401窗口）作为"高质量核心数据集"的价值，全量数据实验作为robustness
    test。 Confidence-aware training作为方法论贡献——展示弱监督框架的confidence校准可直接用于下游训练。

    '
- name: LF Ensemble Oracle Baseline
  plan_id: baseline-lf-oracle
  description: 直接用LF实时输出做窗口级判定，在auto-labeled和human-gold两个评估集上与probe对比
  expected_results:
    oracle_auto_test_macro_f1: 1.0
    oracle_auto_test_accuracy: 1.0
    oracle_gold_macro_f1: 0.75
    oracle_gold_accuracy: 0.75
    oracle_gold_f1_stagnation: 0.7
    oracle_gold_f1_progress: 0.8
    probe_gold_macro_f1: 0.77
    gap_probe_vs_oracle_gold_pp: 2.0
    oracle_conf1_subset_gold_accuracy: 0.62
    oracle_conf2_subset_gold_accuracy: 0.83
  result_rationale: 'LF oracle在auto-labeled测试集上达到1.0 F1——这是定义层面的结果，因为测试标签本身就是LF majority
    vote。 这意味着probe在auto-labels上永远无法"超越"oracle（0.9055 < 1.0），probe的增量价值只能在human gold上体现。
    在400窗口human gold上，oracle F1=0.75：三个LF的majority vote是对progress/stagnation的合理但不完美近似，
    conf=1子集尤其薄弱（accuracy仅62%），因为单LF投票缺乏交叉验证。 Probe在gold上达0.77（+2pp），说明probe通过embedding空间学到了LF未显式编码的模式——
    特别是语义相似但表面不同的stagnation模式（paraphrased repetition）。 但2pp的gap仅边际显著（400样本下bootstrap
    CI可能overlap），这是median档的核心张力： probe的增量价值真实存在但统计上不够robust。

    '
  tables:
  - 'Table: LF Oracle vs Probe on Auto-Labels and Gold Labels | Evaluation Set | LF
    Oracle F1 | Probe F1 | Gap | Auto-labeled (conf≥2 test): 1.00, 0.9055, -9.45pp
    | Auto-labeled (full test): 1.00, 0.82, -18pp | Human Gold (all): 0.75, 0.77,
    +2.0pp | Human Gold (conf=1 subset): 0.60, 0.68, +8pp | Human Gold (conf≥2 subset):
    0.84, 0.83, -1pp'
  figures_description:
  - Venn diagram展示LF oracle和probe各自正确/错误的窗口集合，highlight probe独有正确案例（oracle错probe对）的语义特征
  analysis: 'Oracle baseline揭示了弱监督框架的核心limitation：在auto-labels上，probe无法超越label source本身。
    Probe的价值在于泛化——在human gold上+2pp，特别是在conf=1子集上+8pp（0.68 vs 0.60）， 说明probe在LF disagree的模糊区域学到了更好的decision
    boundary。 但conf≥2 gold子集上oracle反超probe 1pp（0.84 vs 0.83），说明当LFs一致且正确时probe没有增量价值。
    Paper framing：oracle baseline不是probe的竞争对手而是框架的一部分——oracle提供quick-and-dirty判断，
    probe提供更robust的泛化，两者是同一框架的不同deployment选项。

    '
- name: LLM-as-Judge Baseline
  plan_id: baseline-llm-judge
  description: Claude-3.5-Sonnet和GPT-4o作为zero-shot和few-shot judge，在auto-labels和gold上评估
  expected_results:
    claude_zeroshot_auto_macro_f1: 0.81
    claude_fewshot_auto_macro_f1: 0.84
    gpt4o_zeroshot_auto_macro_f1: 0.8
    gpt4o_fewshot_auto_macro_f1: 0.83
    claude_fewshot_gold_macro_f1: 0.82
    gpt4o_fewshot_gold_macro_f1: 0.8
    probe_conf2_auto_macro_f1: 0.9055
    probe_fulldata_auto_macro_f1: 0.82
    probe_gold_macro_f1: 0.77
    cost_per_window_probe_usd: 0.0005
    cost_per_window_claude_usd: 0.018
    cost_multiplier: 35
    latency_probe_ms: 3
    latency_claude_ms: 2800
    latency_multiplier: 930
    total_eval_windows: 500
    api_cost_total_usd: 95
  result_rationale: 'LLM judge有access to full window context（raw trajectory text），而probe只看embedding。
    Claude few-shot在auto-labels上达0.84——接近conf≥2 probe（0.9055）但低于oracle（1.0）。 关键发现：在human
    gold上，Claude few-shot达0.82，反超probe的0.77——LLM的语义理解能力使其在gold evaluation上更强。 这是median档的核心挑战：LLM
    judge在质量上占优，probe的优势只剩cost-efficiency。 Cost multiplier=35x：每个窗口5步×200-400 tokens/步=1000-2000
    input tokens + prompt template， Claude-3.5-Sonnet pricing下约$0.018/窗口，vs probe的embedding
    inference $0.0005/窗口。 Latency差距更大：probe <5ms（GPU inference）vs LLM ~2.8s（API roundtrip
    + generation）。 Zero-shot vs few-shot gap约3pp，说明LLM需要task-specific calibration但门槛不高。
    GPT-4o略弱于Claude 1-2pp，两者差距不大。

    '
  tables:
  - 'Table: LLM-as-Judge vs Probe | Method | Auto F1 | Gold F1 | $/window | ms/window
    | Probe (conf≥2): 0.9055, 0.77, 0.0005, 3 | Probe (full): 0.82, 0.77, 0.0005,
    3 | Claude ZS: 0.81, 0.79, 0.018, 2800 | Claude FS: 0.84, 0.82, 0.018, 2800 |
    GPT-4o ZS: 0.80, 0.78, 0.015, 3200 | GPT-4o FS: 0.83, 0.80, 0.015, 3200 | LF Oracle:
    1.00, 0.75, ~0, ~0'
  figures_description:
  - Cost-Accuracy Pareto图：x轴=$/window (log scale)，y轴=Gold F1，每个method一个点，Pareto front连线。Probe和LF
    oracle在左下（cheap+decent），LLM judge在右上（expensive+best）
  - Latency-F1 散点图：展示probe在real-time deployment场景的优势（<5ms inference enables per-step
    monitoring）
  analysis: 'LLM judge在gold F1上超过probe 5pp（0.82 vs 0.77），这是median档最具挑战性的结果——reviewer可能问"为什么不直接用LLM"。
    应对策略：(1) Cost-accuracy Pareto展示probe在budget-constrained场景的价值——监控54K窗口用LLM需$972
    vs probe $27； (2) Latency argument——probe的3ms inference使per-step real-time monitoring成为可能，LLM的2.8s不适合在线干预；
    (3) 架构论证——probe是轻量local model，可在edge/on-device部署，不依赖API availability。 Paper应诚实承认LLM
    judge的quality优势，将probe定位为"practical deployment option"而非"quality frontier"。 框架贡献的重心不受影响——弱监督标注框架解决的是数据获取问题，下游可以用probe也可以用LLM
    judge做inference。

    '
- name: Mean-Pooling + Logistic Regression Baseline
  plan_id: baseline-meanpool-lr
  description: 窗口内step embeddings做mean-pooling后接LR分类器，作为参数匹配下界验证GRU时序建模增量
  expected_results:
    meanpool_lr_conf2_macro_f1: 0.86
    meanpool_lr_conf2_accuracy: 0.89
    meanpool_lr_conf2_f1_stagnation: 0.81
    meanpool_lr_conf2_f1_progress: 0.91
    meanpool_lr_fulldata_macro_f1: 0.79
    gap_gru_vs_meanpool_conf2_pp: 4.5
    gap_gru_vs_meanpool_fulldata_pp: 3.0
    meanpool_lr_gold_macro_f1: 0.74
  result_rationale: 'Mean-pooling丢弃了步骤间的顺序信息——将5个step embeddings均匀平均为单个向量。 在conf≥2上达0.86（vs
    GRU 0.9055, gap=4.5pp），说明embedding空间本身已编码了相当的progress/stagnation信号， 即使没有时序建模也能达到reasonable性能。4.5pp的gap虽然真实，但不像6.24pp（GRU
    vs Repeat-3）那么compelling。 在全量数据上gap缩小至3pp（0.82 vs 0.79），因为标签噪声同时削弱两个方法，但GRU更受时序信号disruption影响。
    Stagnation F1（0.81）显著低于GRU（0.8593），符合直觉——stagnation的onset位置是关键时序信号，mean-pooling无法捕获。
    Median档核心问题："GRU与LR差距存在但不大（2-4pp），时序建模claim需补充attention可视化等定性证据"。

    '
  tables:
  - 'Table: Temporal Modeling Ablation | Method | conf≥2 F1 | Full F1 | Gold F1 |
    Stag F1 (conf≥2) | GRU+Attn: 0.9055, 0.82, 0.77, 0.8593 | MeanPool+LR: 0.86, 0.79,
    0.74, 0.81 | Repeat-3: 0.8432, 0.785, 0.72, 0.75 | Gap GRU-LR: +4.5pp, +3pp, +3pp,
    +5pp'
  figures_description:
  - Paired error analysis：GRU正确但LR错误的窗口 vs LR正确但GRU错误的窗口——按stagnation onset位置分组，展示GRU在early-onset和late-onset
    stagnation上的优势
  analysis: '4.5pp gap支持时序建模有增量价值，但在median档下这不足以standalone支撑Claim 2。 需要补充定性证据：(1)
    attention可视化展示GRU在stagnation onset位置的注意力集中模式（LR无法表达）； (2) 错误分析展示GRU独有正确案例集中在"渐进式停滞"（前2步正常、后3步停滞）——这类模式mean-pooling会被前2步稀释。
    Paper建议将GRU vs LR差距frame为"时序建模在stagnation onset检测上的边际贡献"，而非"GRU大幅优于静态方法"。

    '
- name: Probe Error Analysis
  plan_id: error-analysis
  description: Probe FP/FN按action type、LF source、trajectory outcome分类，揭示probe捕获vs遗漏的模式
  expected_results:
    total_errors_conf2_test: 221
    false_positives: 98
    false_negatives: 123
    fp_rate: 0.063
    fn_rate: 0.079
    fp_dominant_category: exploration_misclassified_as_stagnation
    fp_exploration_pct: 42
    fp_single_lf_disagreement_pct: 31
    fp_trajectory_eventually_succeeded_pct: 67
    fn_dominant_category: semantic_stagnation_without_repetition
    fn_no_repeat3_signal_pct: 71
    fn_diverse_commands_pct: 58
    fn_trajectory_failed_pct: 89
    probe_catches_repeat3_misses: 187
    repeat3_catches_probe_misses: 34
    overlap_correct: 2571
  result_rationale: '在conf≥2测试集（~3,080窗口）上，probe有221个错误（7.18% error rate）。 FP（98个）：最大类别是"exploration误判为stagnation"（42%）——agent在搜索文件、尝试不同路径，
    每步都不同但整体缺乏linear progress，probe将这种"发散性探索"误读为停滞。31%的FP在LF层面就有分歧（conf=2但两个LF方向相反）。
    FN（123个）：主导类别是"无重复的语义停滞"（58%）——agent执行多样化命令但都不朝goal方向推进， 71%的FN在Repeat-3层面也miss（因为没有字面重复）。这是probe当前的盲区：需要goal-awareness才能检测的停滞。
    Probe独有正确187个 vs Repeat-3独有正确34个：probe的主要增量来自检测paraphrased repetition（同一操作不同表述）
    和gradual stagnation（前几步有进展、后几步停滞的窗口）。

    '
  tables:
  - 'Table: Error Taxonomy | Category | Count | % of Errors | Example Pattern | FP-exploration:
    41, 42%, agent grep/find不同文件 | FP-lf-conflict: 30, 31%, conf=2但LF方向冲突 | FP-other:
    27, 27%, edge cases | FN-semantic-stag: 72, 58%, 多样命令零进展 | FN-late-onset: 31,
    25%, 停滞在窗口最后1-2步 | FN-other: 20, 16%, rare patterns'
  - 'Table: Probe vs Repeat-3 Error Overlap | | R3 Correct | R3 Wrong | Probe Correct:
    2571, 187 | Probe Wrong: 34, 221-overlap矩阵'
  figures_description:
  - Sankey diagram：错误类型 → action type → trajectory outcome，展示错误流向
  - 具体案例展示（3-4个典型FP/FN），每个案例包含5步window原文摘要 + LF输出 + probe预测 + gold label
  analysis: 'Error analysis是median档的关键定性贡献。两个核心发现： (1) Probe捕获了187个Repeat-3遗漏的窗口，集中在paraphrased
    repetition和gradual onset——这些是heuristic无法表达的模式， 支撑"学习的时序模型捕获了启发式之外的信号"这一降级后的claim。
    (2) Probe的主要盲区是goal-unaware semantic stagnation——agent做不同的事但都没用，检测这类停滞需要task-level
    goal理解。 这为future work提供了明确方向（goal-conditioned probe）。 Paper中这部分应重点展示具体案例（case
    study），用qualitative evidence弥补quantitative gap收窄带来的说服力不足。

    '
- name: 跨Agent迁移评估（OpenHands）
  plan_id: cross-agent
  description: SWE-agent训练的probe在OpenHands轨迹上zero-shot评估 + few-shot fine-tuning恢复曲线
  expected_results:
    openhands_total_trajectories: 2140
    openhands_total_windows: 18720
    openhands_lf_adapted_coverage: 0.87
    zeroshot_macro_f1: 0.73
    zeroshot_accuracy: 0.78
    zeroshot_f1_stagnation: 0.65
    zeroshot_f1_progress: 0.81
    drop_from_swe_agent_pp: 17.5
    zeroshot_vs_random_pp: 23.0
    zeroshot_vs_majority_pp: 30.7
    zeroshot_repeat3_openhands_f1: 0.71
    gap_vs_repeat3_openhands_pp: 2.0
    fewshot_50_macro_f1: 0.78
    fewshot_200_macro_f1: 0.82
    fewshot_500_macro_f1: 0.85
    openhands_embedding_time_hours: 3.2
    openhands_lf_adaptation_issues: command format差异导致command_repetition LF recall下降15%
  result_rationale: 'Zero-shot迁移F1=0.73（-17.5pp from SWE-agent的0.9055），符合median档[0.68,0.78]区间。
    下降来源：(1) OpenHands和SWE-agent的action space差异——OpenHands用不同的命令格式和文件操作API， 导致embedding空间分布shift；(2)
    LF适配不完全——command_repetition LF依赖特定命令格式匹配， OpenHands格式差异导致recall下降15%，file_diff_delta
    LF较robust（基于git diff，与agent无关）； (3) 轨迹结构差异——OpenHands倾向更短的action序列和更频繁的tool switching。
    Stagnation F1（0.65）远低于progress F1（0.81），说明stagnation模式的跨agent迁移更困难—— 不同agent的"停滞方式"差异大于"进展方式"。
    Few-shot fine-tuning效果显著：50个标注窗口即恢复至0.78，200个恢复至0.82，500个接近SWE-agent性能（0.85）。
    这支持"learned representations are transferable starting points"的叙事。 Repeat-3在OpenHands上也下降至0.71（SWE-agent上0.8432），probe保持2pp领先。

    '
  tables:
  - 'Table: Cross-Agent Transfer | Setting | Macro-F1 | Stag-F1 | Prog-F1 | SWE-agent
    (conf≥2): 0.9055, 0.8593, 0.9518 | OpenHands zero-shot: 0.73, 0.65, 0.81 | OpenHands
    50-shot: 0.78, 0.72, 0.84 | OpenHands 200-shot: 0.82, 0.77, 0.87 | OpenHands 500-shot:
    0.85, 0.81, 0.89'
  - 'Table: Baselines on OpenHands | Method | Macro-F1 | Random: 0.50 | Majority:
    0.42 | Repeat-3: 0.71 | Cosine-sim: 0.35 | Probe zero-shot: 0.73 | Probe 200-shot:
    0.82'
  figures_description:
  - Few-shot learning curve：x轴=fine-tuning样本数（0,50,200,500），y轴=macro-F1，含SWE-agent
    performance水平虚线
  - t-SNE对比：SWE-agent GRU hidden states vs OpenHands GRU hidden states，展示distribution
    shift但保持cluster结构
  analysis: 'Zero-shot F1=0.73证实了跨agent progress信号的可迁移性——probe学到的不仅是SWE-agent特定行为模式。
    但17.5pp drop也说明domain adaptation是必要的，不能claim"直接迁移保持有效"。 Few-shot曲线是median档的关键补充实验——200个窗口即可恢复至0.82，说明probe
    representations 提供了strong initialization，远优于from-scratch训练（相同200样本from-scratch仅~0.65）。
    Claim 3调整为："zero-shot迁移存在（+23pp vs random），few-shot adaptation高效（200样本恢复至82%），
    表明probe学到的progress信号具有跨实现的通用性，但需要少量target-domain数据calibration"。 LF适配问题应在Limitations中明确讨论——command_repetition的format
    dependency是框架的结构性弱点。

    '
- name: Window Size消融
  plan_id: ablation-window-size
  description: k=3,5,7步窗口大小消融，评估检测粒度与信号积累的tradeoff
  expected_results:
    k3_macro_f1: 0.86
    k3_f1_stagnation: 0.81
    k3_total_windows: 22130
    k5_macro_f1: 0.9055
    k5_f1_stagnation: 0.8593
    k5_total_windows: 15401
    k7_macro_f1: 0.89
    k7_f1_stagnation: 0.84
    k7_total_windows: 11280
    optimal_k: 5

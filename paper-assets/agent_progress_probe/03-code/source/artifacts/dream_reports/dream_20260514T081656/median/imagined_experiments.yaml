    outcome_backprop_first_fire_pct: 14
    lf_agreement_at_onset: 0.35
    lf_agreement_deep_stagnation: 0.72
    probe_attention_aligns_with_leading_lf_pct: 65
  result_rationale: 'command_repetition是最早的leading indicator（median lead 1.5步）：命令重复往往在stagnation初期就出现，
    agent开始"重试"之前的操作。58%的stagnation窗口中它最先firing。 file_diff_delta接近同步（lead 0.5步）：文件改动减少与stagnation几乎同时发生，因为停滞的直接表现就是代码不再变化。
    outcome_backpropagation是lagging indicator（lag 2步）：需要知道轨迹最终结果才能回传， 在real-time场景中这个信号不可用——但对offline
    analysis有价值。 Onset时刻LF agreement仅0.35——stagnation初期信号微弱，各LF判断不一致； 深度停滞阶段agreement升至0.72——所有信号converge。
    这解释了conf=1窗口的噪声来源：很多conf=1窗口是stagnation onset的early stage， 只有一个leading LF发出信号，其他LF尚未fire。

    '

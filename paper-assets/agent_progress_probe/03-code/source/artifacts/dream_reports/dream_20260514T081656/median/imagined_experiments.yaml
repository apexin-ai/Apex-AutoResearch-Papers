  analysis: LF temporal dynamics提供了框架的mechanistic insight——不同LF在stagnation lifecycle中扮演不同角色。
    对实际部署有指导意义：real-time monitoring应更权重command_repetition（leading），offline analysis可用outcome_backprop（lagging）。
    对conf=1噪声的解释很有价值——onset阶段的低agreement是structural而非random noise， 这为confidence-aware
    training的改进方向提供了理论依据（时序权重而非静态confidence权重）。 放Discussion section或Appendix作为框架的deeper

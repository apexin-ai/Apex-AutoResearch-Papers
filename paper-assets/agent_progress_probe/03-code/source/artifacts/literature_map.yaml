# ============================================================
# NOVELTY ANALYSIS SUMMARY
# ============================================================
#
# Key finding: "Temporal Label Model" 作为通用方法论是 NOVEL。
#
# 最近的前驱工作：
# 1. Safranchik AAAI 2020 (linked HMM) — NER-specific，BIO 约束，token-level
# 2. Sala NeurIPS 2019 (multi-resolution WS) — 处理分辨率不匹配，不建模 label transition
# 3. Nguyen ACL 2017 (HMM-Crowd) — crowdsourcing 场景，不是 programmatic LFs
#
# 没有人将 data programming + HMM-style temporal transitions 用于：
# - 通用序列分类（非 NER）
# - Agent trajectory monitoring
# - Stagnation detection
#
# 我们的 TLM 填补的空白：general-purpose temporal extension of
# data programming label models for sequential classification tasks.

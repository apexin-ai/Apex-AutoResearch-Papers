- id: D009
  date: 2026-05-14 09:54 UTC
  summary: Dream 审稿三档均 Weak Reject (3/6)：novelty 不足为结构性致命问题，新增 temporal label model
    作为核心方法论贡献
  rationale: 'Dream dream_20260514T081656 三档评分 best=3/6, median=3/6, worst=3/6，全部
    Weak Reject。核心结构性问题：(1) Novelty 不足——vanilla majority vote + standard GRU 无方法论创新；(2)
    Related work 严重缺失（5-10 refs → 需 30+），缺 PRMs/Reflexion/FlyingSquid；(3) LF temporal
    dynamics 纯描述性未转化为方法改进。


    解决路径：将 LF temporal dynamics 发现（leading/concurrent/lagging indicators）转化为 temporal
    label model——时序感知标签聚合方法，替代 naive majority vote。这同时解决 novelty（方法论贡献）、label model
    缺失、descriptive→prescriptive 三个问题。


    行动：(1) paper_framing.md 更新 Core Claim 1 为 temporal label model；(2) experiment_plan.yaml
    新增 temporal-label-model (P0)、flyingsquid-baseline (P0)、outcome-bp-sensitivity
    (P0)、encoder-ablation (P1)；(3) 需 re-dream 验证新 framing 是否提升评分；(4) 已运行的实验（probe-002,
    baseline-meanpool-lr）继续，这些数据新 framing 仍需要。


    观察项：Gold set size（N=400 是否够）、LLM-as-Judge CoT variant、OpenHands 人工验证、"semantic
    stagnation" 术语——待真实实验数据判断。'
  related_experiments:
  - exp_id: temporal-label-model
    role: 新增P0
    result: planned
  - exp_id: flyingsquid-baseline
    role: 新增P0
    result: planned
  - exp_id: outcome-bp-sensitivity
    role: 新增P0
    result: planned
  - exp_id: encoder-ablation
    role: 新增P1
    result: planned
  depends_on:

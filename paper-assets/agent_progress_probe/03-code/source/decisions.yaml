- id: D003
  date: 2026-05-14 05:42 UTC
  summary: 暂停 Phase 0.5/1，修复 LF1 逻辑 bug + 扩展到 5K 随机采样后重跑标签统计
  rationale: 'Reviewer critical: lf_file_diff_delta 的 edit_count==0 分支两路都返回 STAGNATION，导致所有无编辑窗口被误标。82.7%
    覆盖率的主力 LF 产生的 stagnation 标签大量不可信。同时 1K 数据按 instance_id 排序有采样偏差。必须修复后在 5K 随机样本上重跑，才能进入
    Phase 0.5 标签质量验证。'
  related_experiments: []
  depends_on:

- id: D004
  date: 2026-05-14 05:53 UTC
  summary: Phase 0.5 判定未通过：原始一致率 53% 远低于 80% 门禁，质量报告方法学错误（排除 44% 样本后虚报 94.6%）
  rationale: Reviewer 核实发现 label_quality_report.md 的 94.6% 是排除了 44 个 "Needs Human
    Review" 样本后计算的 53/(53+3)，原始一致率仅 53/100=53%。高置信度窗口一致率 66%，冲突窗口一致率 40%，均低于 80%。此外发现
    file_diff_delta 在 edit=False+commands=[] 的窗口仍返回 PROGRESS，可能是旧标签缓存或 LF 逻辑残余 bug。当前
    worker 正在用修复后的 LF 重新生成标签，需确保质量检查使用原始一致率。
  related_experiments: []

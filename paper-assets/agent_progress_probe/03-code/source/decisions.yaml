- id: D010
  date: 2026-05-14 09:57 UTC
  summary: probe-002 全量数据结果：0.8468 macro-F1，LF All-Agreement (0.8543) 仍略高于 probe，进一步验证
    temporal label model 的必要性
  rationale: 'probe-002 在全量 54,809 windows 上 test macro-F1=0.8468。关键发现：


    1. Probe vs non-LF baselines 优势显著：vs Repeat-3 +23.65pp, vs MeanPool+MLP +6.87pp

    2. 但 LF All-Agreement (0.8543) > Probe (0.8468)，差距 0.75pp——probe 在其自身标签来源的数据上未能超越
    LF ensemble

    3. 时序建模价值在全量数据上更突出：GRU vs MeanPool gap 从 conf≥2 的 4.83pp 扩大到全量的 12.74pp

    4. conf≥2 (0.9055) vs 全量 (0.8468) 差距 5.87pp——低置信度数据标签噪声显著影响 probe


    此结果进一步验证 D009 的 framing pivot：naive majority vote 标签质量在 conf=1 区域（72%数据）不够好，probe
    无法超越标签来源。temporal label model 通过提升标签质量是突破此瓶颈的正确路径。


    Probe 相对于 LF ensemble 的 value proposition 应锚定在 cross-format transfer（LF 不可用场景），而非在
    LF 可用场景下 outperform LF。cross-agent 实验成为整篇论文最关键的实验。'
  related_experiments:
  - exp_id: probe-002
    role: primary
    result: 0.8468 macro-F1, LF All-Agreement still higher
  - exp_id: baseline-meanpool-lr
    role: baseline
    result: MeanPool+MLP 0.8572/0.7781, GRU temporal advantage confirmed
  - exp_id: cross-agent
    role: next critical
    result: planned
  depends_on:

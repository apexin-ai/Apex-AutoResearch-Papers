- id: D008
  date: 2026-05-14 09:03 UTC
  summary: LF Oracle 发现 command_repetition 单独超过 probe（0.9451 vs 0.9055），Claim 2 重新定位：probe
    的价值在于 LF 不可用/分歧的场景（conf=1 数据 + 跨实现迁移），而非在 LF 自身标签上的精度
  rationale: conf≥2 数据上 LF 评估存在循环性（ground truth = majority vote，command_repetition
    覆盖率 97.4%，本身就是标签的主要贡献者）。probe 在此场景下低于 command_repetition 3.96pp 说明它未完全还原 LF 判断，但这不是
    probe 的目标场景。probe 的真正价值在于：(1) conf=1 模糊区域（LF 分歧，单 LF 不可靠）；(2) 跨实现迁移（LF 规则需要重写，probe
    可 zero-shot）。paper framing 需要明确区分两个评估场景：高置信（LF 直接可用，probe 是近似器）vs 推理场景（LF 不可用，probe
    是唯一选择）。probe-002 和 cross-agent 成为决定性实验。
  related_experiments:
  - exp_id: probe_001
    role: MVP 基线
    result: macro-F1=0.9055
  - exp_id: baseline-lf-oracle
    role: LF Oracle 对比
    result: command_repetition=0.9451, LF Majority=1.0 (tautological)
  depends_on:

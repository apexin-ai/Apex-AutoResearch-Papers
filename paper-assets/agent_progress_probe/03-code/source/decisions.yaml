- id: D021
  date: 2026-05-14 13:16 UTC
  summary: Re-dream (dream_20260514T095527) 分析完成：Best 4/6 WA, Median/Worst 3/6 WR。确认
    6 项结构性修复 + 3 项观察项
  rationale: '**三档一致的结构性问题（确认行动项）：**

    A1. Circularity in temporal dynamics — 必须用 human-annotated onsets 验证，非 LF-defined
    onsets（依赖 gold set）

    A2. 缺 bootstrap CIs / McNemar''s test — gold set 上所有核心对比需统计检验（依赖 gold set）

    A3. OpenHands ground truth 未指定 — 需明确说明评估用什么标签，或准备小规模 OH 人工标注

    A4. 缺 sequential WS 文献 — Safranchik 2020 (AAAI), skweak (ACL 2021), Snorkel MeTaL,
    crowdsourcing HMMs (Nguyen 2017, Simpson&Gurevych 2019), noisy label learning
    (DivideMix), automatic PRMs (Math-Shepherd, OmegaPRM)


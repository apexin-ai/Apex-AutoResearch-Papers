- id: D001
  date: 2026-05-14 04:20 UTC
  summary: MVP 验证方案确定：GRU probe on SWE-bench trajectories, F1≥0.70 + 5pp gap over
    baselines
  rationale: 核心假设是 window-level progress estimation 优于 step-level/heuristic 方法。MVP
    用最小实验验证：5K 轨迹子集 + 3 个 labeling functions + GRU probe vs 3 个 baseline。Phase 0（数据+标注）无需
    GPU 可立即启动，Phase 1（embedding+训练）等 GPU 配置后执行。
  related_experiments: []

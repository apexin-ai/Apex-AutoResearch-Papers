- id: D002
  date: 2026-05-14 05:41 UTC
  summary: LF2 替换：test_pass_rate_transition → command_repetition_detector
  rationale: LF2 (test_pass_rate_transition) 覆盖率仅 0.3%（40/12331 windows），对标注无贡献。选
    Option A (command_repetition_detector) 替换，理由：(1) 预计覆盖率 30-50%，与 LF1 互补（LF1 看代码变更量，repetition
    看行为重复）；(2) 捕获 IDEA_BRIEF 定位的核心 stagnation 模式之一；(3) 与 cycle detection 文献（IBM CDCS、SpecRA）形成自然对照，强化
    narrative。

writing_order:
  - experiments   # 先写：最多数据，锚定全文数字
  - method        # 次写：依赖 experiments 确定的 notation 和 scope
  - analysis      # 依赖 experiments 章节的具体结果
  - introduction  # 依赖 experiments + analysis 确定 story spine
  - related_work  # 依赖 introduction 的 positioning
  - abstract      # 全文摘要
  - conclusion    # 最后，总结 + limitations
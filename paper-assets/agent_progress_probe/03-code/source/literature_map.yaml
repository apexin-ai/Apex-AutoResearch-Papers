# Literature Map for Agent Progress Probe (EMNLP 2026 ARR)
# Generated: 2026-05-14
# Paper: Structural Signal Analysis for Progress Stagnation Detection in LLM Agents
#
# D039 Pivot: Empirical analysis paper. Central finding: stagnation signals are
# fundamentally structural (30 features → 0.995 in-domain, 0.967 cross-agent F1),
# decisively surpassing NL embeddings (0.906/0.751) and LLM-as-judge (+24.3pp).
# TLM is a well-motivated negative finding (3 implementations all fail to beat MV).


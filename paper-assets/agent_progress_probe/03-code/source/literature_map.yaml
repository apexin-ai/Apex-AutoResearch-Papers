# ============================================================
# NOVELTY ANALYSIS SUMMARY (D039 Pivot — Empirical Analysis)
# ============================================================
#
# Primary novelty: 首次系统性实证分析 agent stagnation 检测中 structural vs
# semantic signal 的有效性。30 个结构特征达 0.995 in-domain / 0.967 cross-agent F1，
# 全面优于 NL embedding (0.906/0.751) 和 LLM-as-judge (+24.3pp)。
#
# 三层贡献：
# 1. Structural Signal Discovery (primary) — 改变社区对 agent monitoring 方法选型认知
# 2. LF Temporal Dynamics Analysis — 量化 LFs 时序角色 + agent-specific 迁移分析
# 3. TLM Negative Finding — 3 种实现 (TWV/HMM/lag-aware HMM) 均未超越 MV
#
# 方法论前驱（TLM negative finding 的参照）：
# 1. Safranchik AAAI 2020 (linked HMM) — NER-specific，BIO 约束，token-level
# 2. Sala NeurIPS 2019 (multi-resolution WS) — 处理分辨率不匹配，不建模 label transition
# 3. Nguyen ACL 2017 (HMM-Crowd) — crowdsourcing 场景，不是 programmatic LFs
#
# 核心差异化：不是 "method paper proposing TLM"，而是 "empirical study revealing
# structural signals dominate stagnation detection, with temporal modeling as
# well-motivated negative finding".

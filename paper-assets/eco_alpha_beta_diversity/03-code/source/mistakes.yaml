mistakes:
- id: M001
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: MVP Worker 在真实数据解析失败后静默 fallback 到合成数据，产出了无效的 MVP 结果
  root_cause: data_loader 的列名解析逻辑未匹配 Doshi & Hauser CSV 格式，解析失败后 Worker fallback 到
    --synthetic 模式运行，没有报错或中止
  prevention: 1. 数据加载失败时必须抛异常中止，禁止静默 fallback 到合成数据；2. 结果 JSON 中 dataset=synthetic
    时 Worker 必须报 FAILED 而非 PASSED；3. MVP 判定前检查 metadata.dataset 是否为真实数据
  status: active
  context: Reviewer 发现 mvp_results.json 的 metadata.dataset="synthetic"，nboot=50（ROADMAP
    要求 200）。真实数据文件已下载（writers-2023-06-28.csv 890KB + evaluators-2023-07-06.csv 7.7MB），但
    Worker 未成功解析
- id: M002
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: data_loader.py 三个解析 bug 导致真实数据加载连续两次失败：列名模糊匹配命中错误列、条件映射逻辑短路、文件处理顺序错误
  root_cause: 1. _guess_text_col 用子串匹配找 story 列，ai_story_gen.1.player.id_in_group
    含 story 子串且排在真正的 story 列前面；2. _map_condition 先匹配 human in v，human_1AI/human_5AI
    被映射为 no-AI；3. evaluators CSV 按字母排序排在 writers 前面被优先处理
  prevention: 1. 数据加载器不要用模糊子串匹配列名，用后缀精确匹配（.story/.text）并验证内容是长文本（mean length > 50）；2.
    条件映射先匹配更特异的模式（含 AI 的）再匹配通用的（human）；3. 文件选择优先含 writer 的文件名。通用教训：对未见过的外部数据集，先 head
    检查再写解析逻辑
  status: active
  context: Reviewer 独立验证了 CSV 结构：writers CSV 500行x478列，条件列 participant.condition（human/human_1AI/human_5AI），文本列
    ai_story_gen.1.player.story，309 个有效故事
- id: M003
  date: '2026-05-21'
  category: agent_behavior
  severity: medium
  summary: Registry 同步断裂：mvp_002 完成后未更新 registry 状态（第二次发生）
  root_cause: Worker 完成实验并生成结果文件，但未在流程末尾调用 registry 更新将状态从 QUEUED 改为 DONE + 补全 spec/conclusion/metrics
  prevention: Worker 完成实验后必须作为最后一步更新 registry（状态 + spec + conclusion + metrics）。这是第二次出现此问题（mvp_001
    延伸分析也有），需要在 Worker 模板中加入 registry 更新作为硬性最后步骤。
  status: active
  context: mvp_002 状态仍为 QUEUED，无 spec/conclusion/metrics。Worker 生成了完整结果（JSON + 报告
    + 图）但未回写 registry。

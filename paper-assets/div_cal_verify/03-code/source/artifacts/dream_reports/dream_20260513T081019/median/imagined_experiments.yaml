    seed-dependent noise，不是系统性信号。 Medium 两 seed 内部 ratio 终值分别 0.80 和 0.82（125M 为 0.76
    和 0.78）， 差异 ~0.04，说明更大模型的 gap 略小但方向一致。 PPL excess 14.3% 与 seed=42 完全一致，跨 seed
    稳定性比 125M 更好 （可能因为 medium 训练更稳定）。


- name: Embedding re-anchoring 缓解实验 (GPT2-125M, seed=42)
  plan_id: plan_008
  description: '每 K 代（K=3）用原始预训练权重重新计算选择嵌入（不改训练过程，只改 selection 用的嵌入）。 测试 alignment
    gap 是否可通过简单手段修复。

    '
  expected_results:
    reanchored:
      gen0_selection_ratio: 1.03
      gen1_selection_ratio: 0.98
      gen2_selection_ratio: 0.93
      gen3_selection_ratio: 1.01
      gen4_selection_ratio: 0.96
      gen5_selection_ratio: 0.91
      gen6_selection_ratio: 0.98
      gen7_selection_ratio: 0.93
      gen0_ppl: 37.2
      gen1_ppl: 41.8
      gen2_ppl: 46.5
      gen3_ppl: 49.8
      gen4_ppl: 51.3
      gen5_ppl: 52.1
      gen6_ppl: 50.5
      gen7_ppl: 51.8
      gen0_rare: 0.029
      gen1_rare: 0.018
      gen2_rare: 0.012
      gen3_rare: 0.01
      gen4_rare: 0.008
      gen5_rare: 0.007
      gen6_rare: 0.007
      gen7_rare: 0.0065
      gen0_rank_corr: -0.024
      gen7_rank_corr: -0.082
    comparison_vs_rgds:
      ppl_improvement_pct: 4.4
      rare_improvement_pct: 8.3
      selection_ratio_gen7_improvement: 0.17
    statistical_tests:
      ppl_diff_significant: false
      rare_diff_significant: false
      ratio_recovery_significant: true
      ppl_p_value: 0.12
      rare_p_value: 0.31
      note: ratio 恢复显著但下游指标改善不显著
  result_rationale: 'Re-anchoring 成功恢复了 selection ratio 的短期表现（每次 re-anchor 后 ratio
    跳回 ~1.0），但恢复是暂时的——ratio 在每个 K-step 周期内又迅速下降。 终值 0.93 显著优于 RGDS 的 0.76（ratio 恢复显著），但下游指标改善有限：
    PPL 改善仅 4.4%（51.8 vs 54.2，p=0.12 不显著），rare 改善 8.3% （0.0065 vs 0.006，p=0.31 不显著）。

    根本原因：re-anchoring 解决了"用错误的嵌入选数据"的问题（ratio 恢复）， 但没有解决"self-iterate 训练本身导致模型生成同质化内容"的根本问题。
    选出的数据在 gen0 嵌入空间中看起来多样，但模型已经往同质化方向漂移， 再训练仍然会压缩嵌入空间。这就是为什么 ratio 能恢复但 rare 不能——
    问题在生成端（模型已经不会生成 rare tokens），不在选择端。

    Median 档预测 reanchoring_rare_improvement_pct 在 [-5, 10] 范围， 此处 8.3% 位于上界附近但 p>0.05，不具统计意义。

    '
  tables:
  - name: 'Table 5 (appendix): Re-anchoring vs RGDS vs Uncurated'
    description: '三行（RGDS/re-anchored/uncurated）× gen7 关键指标 + p-value。 标注 re-anchored
      ratio 显著恢复但 PPL/rare 不显著。

      '
  figures_description:
  - 'Fig A1 (appendix): Re-anchored selection ratio 锯齿形曲线——每 K=3 代跳回 ~1.0 然后下降。RGDS
    ratio 平滑下降曲线叠加对比。标注 re-anchor points。'
  - 'Fig A2 (appendix): Re-anchored vs RGDS 的 PPL 和 rare 曲线。两条线接近但 re-anchored 略好。Error
    bar 标注不显著。'
  analysis: 'Re-anchoring 产生了一个有趣但不足以升级论文的结果：ratio 恢复证明 alignment gap 确实是可诊断的（验证了
    C1 的因果方向），但下游不改善说明 gap 只是崩塌链条的一环。 这个结果对 Findings paper 来说反而是好事——如果 re-anchoring
    完全解决了问题， 审稿人会期望更大的实验矩阵；现在 re-anchoring 失败，"开放问题" 的定位更自然。 移入 appendix，1 段讨论 + 2
    张 appendix 图。 论文正文加一句："Simple embedding re-anchoring restores selection ratio
    but does not translate to downstream diversity improvement (Appendix B), suggesting
    the root cause lies in the generation process rather than the selection process."

    '

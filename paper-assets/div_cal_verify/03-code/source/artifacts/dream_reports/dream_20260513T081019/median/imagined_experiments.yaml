  result_rationale: 'Median 档下 internal selection ratio 整体从 1.03 降至 0.76（终值在 0.65-0.85
    范围）， 但 gen4 出现一次反弹（0.87→0.91），打破严格单调性。这源于 self-iterate 中期模型 在 PPL 降低后嵌入空间发生短暂重组——gen3-4
    PPL plateau 使嵌入分布暂时解压， selection ratio 短暂恢复，但后续代际训练继续压缩嵌入空间。 RGDS gen7 PPL 54.2

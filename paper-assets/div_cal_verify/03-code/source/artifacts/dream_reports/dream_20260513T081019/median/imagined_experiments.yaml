    实验为初步验证（"preliminary evidence of scale generalization"）， 不做过强声明。Combined evidence：5
    个独立实验（125M×3 + medium×2）全部 显示 internal ratio 下降，终值范围 0.76-0.82，external 终值 0.97-1.00。
    这足以支持 Findings paper。


      selection ratio 终值。3×3 紧凑表格。

      '
  figures_description:
  - 'Fig 1 (left): Selection ratio 曲线，internal（红，虚线标注 gen4 反弹）vs external（蓝），x=generation,
    y=ratio。灰色 baseline=1.0。明确标注 ''overall declining trend with transient rebound''。'
  - 'Fig 1 (right): PPL 曲线，三方法叠加。RGDS 终值最高，external 最低，uncurated 居中。Shaded area 标注
    RGDS-uncurated gap。'
  - 'Fig 2: Rare n-gram ratio 曲线。三方法几乎重叠在 gen5 之后——突出 external 选择不改善 rare 的关键发现（S1）。'
  - 'Fig 3: RankMe vs Rare n-gram 双 y 轴图。RankMe 上升（左 y）同时 rare 下降（右 y）。标注 ''representation
    quality metrics fail to detect diversity collapse''（S2）。'
  analysis: 'C1 成立但需弱化：internal ratio 整体下降趋势清晰（Δ=-0.27），但 gen4 反弹破坏了 "monotonic" 叙事。论文措辞改为
    "overall declining trend with transient recovery"， 并在讨论中解释反弹的可能机制（训练中期 PPL plateau
    导致嵌入空间短暂解压）。 C2-weak 稳固：external ratio 全程 >0.95，PPL 比 uncurated 好 3.8%。 但 rare
    n-gram 不优于 uncurated（甚至略差 11%），确认 C2 只能做弱声明。 C3 方向正确但 effect size 有限：RGDS PPL
    excess 仅 12.9%，不是 +49% 的强信号。 S1 和 S2 成为亮点：PPL-rare 解耦和 RankMe 失灵都是清晰的 measurement
    dissociation。

    '

- name: Embedding re-anchoring 缓解实验 (GPT2-125M, seed=42)
  plan_id: plan_008
  description: '每一代用预训练模型嵌入替代当前模型嵌入做多样性选择（不改训练过程，只改 selection 用的嵌入）。

    验证 alignment gap 可修复性。成功→"found + partial fix"。

    '
  expected_results:
    reanchored_rgds:
      gen0:
        ppl: 37.2
        sel_ratio: 1.04
        rare: 0.0288
        rank_corr: -0.058
      gen1:
        ppl: 42.0
        sel_ratio: 1.02
        rare: 0.021
        rank_corr: -0.061
      gen2:
        ppl: 48.2
        sel_ratio: 1.01
        rare: 0.0156
        rank_corr: -0.064
      gen3:
        ppl: 53.5
        sel_ratio: 0.99
        rare: 0.0124
        rank_corr: -0.067
      gen4:
        ppl: 54.1
        sel_ratio: 0.98
        rare: 0.0103
        rank_corr: -0.069
      gen5:
        ppl: 52.8
        sel_ratio: 0.97
        rare: 0.0089
        rank_corr: -0.071
      gen6:
        ppl: 51.5
        sel_ratio: 0.96
        rare: 0.0077
        rank_corr: -0.073
      gen7:
        ppl: 51.2
        sel_ratio: 0.95
        rare: 0.0061
        rank_corr: -0.075
    comparison_at_gen7:
      vs_rgds:
        ppl_reduction_pct: 29.7
        rare_improvement_pct: 32.6
        sel_ratio_change: 0.52 → 0.95（从严重失调恢复到接近 1.0）
      vs_uncurated:
        ppl_excess_pct: 6.4
        rare_deficit_pct: 29.9
      vs_external:
        ppl_excess_pct: 11.8
        rare_deficit_pct: 30.7
  result_rationale: 're-anchoring 用预训练嵌入做选择，切断"模型退化→嵌入退化→选择退化→模型更退化"的反馈环。


    selection ratio 稳定在 ~1.0（1.04→0.95 轻微下降），而非 RGDS 的 1.04→0.52 断崖式下降。

    轻微下降原因：即使嵌入质量好，生成数据本身在退化，候选池绝对多样性下降，

    使得预训练嵌入虽能正确排序但最优子集的 ratio 也略有缩水。


    PPL 大幅恢复：72.8 → 51.2（-29.7%），接近 uncurated 的 48.1（仅高 6.4%）。

    说明 RGDS 的 PPL 灾难主要来自选择偏差，而非生成退化本身。

    Re-anchoring 消除了选择偏差 → PPL 近乎完全恢复。


    rare n-gram 部分恢复：0.0046 → 0.0061（+32.6%），但仍低于 uncurated 0.0087（-29.9%）。

    rare n-gram 损失有两个来源：

    (1) 选择偏差——词汇贫乏样本被优先选中→被 re-anchoring 修复，贡献 ~1/3 恢复

    (2) 生成端词汇萎缩——模型逐渐丢失低频词能力→re-anchoring 无法修复

    这个解耦本身就是一个有价值的发现。

    '
  tables:
  - 'Table 6: RGDS vs Re-anchored RGDS vs Uncurated vs External gen7 四方对比'
  figures_description:
  - 'Figure 5 (§6): 双面板——(a) sel_ratio 对比: RGDS 陡降 vs re-anchored 平稳；(b) rare n-gram:
    re-anchored 介于 RGDS 和 uncurated 之间，标注 +32.6% 改善箭头。'
  analysis: 're-anchoring 验证了 alignment gap 的因果性：消除嵌入退化 → 选择恢复 → PPL 近乎完全恢复。

    rare n-gram +32.6% 满足 best 档 [10, 40%] 要求。

    论文从"发现问题"升级为"发现问题 + 简单修复部分有效 + 定位残余问题在生成端"。

    为 §7 future work 自然引出"生成端干预"方向。

    '

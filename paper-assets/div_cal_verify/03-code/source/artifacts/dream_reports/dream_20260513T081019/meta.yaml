  review_report: "---\ndream_id: dream_20260513T081019\ntier: worst\noverall_score:\
    \ Reject (2/5)\ntimestamp: 2026-05-13T09:09:16.598116+00:00\n---\n\n# Dream Review\
    \ Report: Embedding-Based Diversity Selection Neither Helps Nor Hurts Iterative\
    \ Model Collapse\n\n**Paper:** \"Embedding-Based Diversity Selection Neither Helps\
    \ Nor Hurts Iterative Model Collapse: A Controlled Null Result\"\n**Venue:** EMNLP\
    \ 2026 ARR\n**Review Mode:** Full (2 Reviewers + Roundtable)\n**Date:** 2026-05-13\n\
    \n---\n\n## Paper Summary\n\nThe paper tests whether embedding-based diversity\
    \ selection can slow model collapse during iterative self-training. Three data\
    \ selection strategies are compared across 8 self-training generations: (1) uncurated\
    \ random sampling, (2) RGDS using internal embeddings, and (3) external selection\
    \ using frozen Contriever embeddings. The main finding is a null result: no statistically\
    \ significant difference between methods across 2 model scales (GPT-2 125M/355M),\
    \ 2 datasets (WikiText-103/OpenWebText), and 3 random seeds (all paired t-tests\
    \ p > 0.15). A secondary finding documents \"metric dissociation\" where RankMe\
    \ increases while rare n-gram frequency decreases during collapse.\n\n---\n\n\
    ## Reviewer R1: Methods and Experiments\n\n### Strengths\n- **Well-controlled\
    \ experimental grid.** The paper covers 2 model scales × 2 datasets × 3 seeds\
    \ with consistent protocol, which is thorough for a GPT-2-scale study.\n- **Re-anchoring\
    \ experiment is diagnostic.** Section 4.5 provides a clean causal test: restoring\
    \ selection ratio (0.93→0.99) without affecting collapse metrics isolates the\
    \ bottleneck to the candidate pool.\n- **Transparent about negative result.**\
    \ The paper honestly frames the hypothesis as \"wrong\" rather than retrofitting\
    \ a positive narrative.\n- **Metric dissociation is a genuine warning.** RankMe\
    \ increasing while rare n-grams decline has practical monitoring implications.\n\
    \n### Weaknesses\n- **[Major] Underpowered null result with no equivalence testing.**\
    \ N=3 seeds with cross-seed std ~0.55 PPL is insufficient to claim \"no effect.\"\
    \ The paper uses absence of significance (p > 0.15) as evidence of absence, which\
    \ is a well-known statistical error. A null-result paper *must* include either\
    \ (a) formal equivalence testing (TOST procedure) with a pre-specified equivalence\
    \ margin, or (b) a power analysis showing the study could detect effects of practically\
    \ relevant size. Neither is provided. With N=3, the minimum detectable effect\
    \ at 80% power (α=0.05) is approximately 2.5× the pooled SD — the study cannot\
    \ detect effects smaller than ~1.4 PPL, which is exactly the range of the observed\
    \ inter-method differences.\n- **[Major] Consistent method ordering suggests a\
    \ real but small effect.** External PPL < Uncurated PPL < RGDS PPL holds in *every\
    \ experimental cell* (both model sizes, both datasets, all reported seeds). The\
    \ probability of this ordering occurring by chance across 4+ independent conditions\
    \ is < 5%. This systematic pattern — which the paper does not test or acknowledge\
    \ — is exactly what an underpowered study of a real but small effect looks like.\
    \ The external method's 1.5-1.7% PPL advantage is small but consistent.\n- **[Major]\
    \ Checkpoint resetting design may suppress the alignment gap.** The protocol fine-tunes\
    \ from the *original pretrained checkpoint* each generation (Section 3.1, step\
    \ 3). This prevents the model's embedding space from cumulatively drifting across\
    \ generations. The \"alignment gap\" hypothesis requires progressive embedding\
    \ drift, but resetting to the pretrained checkpoint each round limits how much\
    \ drift can accumulate. The paper should have tested both cumulative fine-tuning\
    \ (M_{t+1} from M_t) and checkpoint-reset fine-tuning to isolate this confound.\n\
    - **[Moderate] Missing intermediate generation reporting.** Table 1 shows generations\
    \ 0, 1, 3, 5, 7 — omitting 2, 4, 6. For non-primary seeds, only Gen-7 endpoints\
    \ are reported. Full trajectories for all seeds would strengthen the null claim.\n\
    - **[Moderate] No sensitivity analysis on rare n-gram threshold.** The threshold\
    \ \"≤5 times in original corpus\" is arbitrary. Does the null result hold at thresholds\
    \ 1, 3, 10? This is critical for trusting the rare n-gram metric.\n- **[Minor]\

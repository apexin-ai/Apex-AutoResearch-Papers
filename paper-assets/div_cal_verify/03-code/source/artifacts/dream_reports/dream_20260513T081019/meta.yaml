      (1) 选择偏差——词汇贫乏样本被优先选中→被 re-anchoring 修复，贡献 ~1/3 恢复

      (2) 生成端词汇萎缩——模型逐渐丢失低频词能力→re-anchoring 无法修复

      这个解耦本身就是一个有价值的发现。


    \ is the contribution, not the conceptual insight that representations shift under\
    \ distribution drift\n- Neural collapse connection is speculative and may mislead\
    \ readers\n- No theoretical analysis weakens the mechanistic claims\n\n---\n\n\
    ## Step 3: Convergence\n\n**Points of Agreement**:\n1. The core empirical finding\
    \ (selection ratio degradation, accelerated collapse) is **real and well-demonstrated**\n\
    2. The selection ratio metric is a **genuine, reusable contribution**\n3. The\
    \ three-way comparison design is **clean and effective**\n4. **Scale range is\

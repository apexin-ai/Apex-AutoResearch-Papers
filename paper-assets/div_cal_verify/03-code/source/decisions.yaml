- id: D013
  date: 2026-05-13 15:20 UTC
  summary: 'D013: random_50 baseline 完成，RGDS 比随机选择差 +74% PPL，external_only ≈ 随机'
  rationale: phase2_random50_v2 被 registry 误标为 failed（startup recovery 误判），实际完成全 7
    代。结果：random_50 PPL=43.20 < external_only 45.51 < uncurated 50.28 << RGDS 75.07。这精确隔离了数据量
    vs 选择质量的 confound：RGDS 内部嵌入选择不仅无效，比随机选择差 74%（同一数据预算）。external_only 没有显著优于随机。论文
    framing 需要从"external embeddings 是解决方案"调整为"internal embeddings 是问题根源"——贡献是量化诊断一个失败模式（selection
    ratio 退化机制），random_50 从"挑战"变成关键对照证据。
  related_experiments:
  - exp_id: phase2_random50_v2
    role: random baseline
    result: PPL=43.20, Rare=0.0096 (seed=42, gen7)
  - exp_id: phase2_3method_selfit
    role: primary comparison
    result: RGDS PPL=75.07 vs uncurated 50.28 vs external 45.51
  - exp_id: phase2_seed123_remaining
    role: cross-seed replication
    result: uncurated PPL=46.15, RGDS PPL=81.57 (seed=123)
  depends_on:
  - D009
  - D012
- id: D014
  date: 2026-05-13 15:24 UTC
  summary: 'D014: 接受 Reviewer framing 修正方案，C2-weak→C2-revised + 新增 S3，阻塞于 random_50
    多 seed 验证'
  rationale: 'Reviewer 深度分析确认：(1) external_only 的优势不在选择质量而在规避内部嵌入偏差，与 random 表现持平（PPL
    差仅 2.3，落在 cross-seed 噪声 4-6.5 范围内）；(2) RGDS vs random +74% PPL 是更干净的 C3 证据（完全隔离选择机制）；(3)
    50% data < 100% data 是独立发现（S3: data budget as implicit regularizer）。framing 从"external
    是方案"修正为"internal 是问题"。但 random ≈ external 的 claim 在 N=1 下不可靠——random_50 seed=123/456
    是 paper story 修正前的阻塞依赖。两卡并行跑，各 ~2h。'
  related_experiments:
  - exp_id: phase2_random50_v2
    role: random baseline (seed=42)
    result: PPL=43.20, ≈ external 45.51, >> RGDS 75.07
  - exp_id: phase2_3method_selfit
    role: primary 3-method comparison
    result: selection ratio RGDS 1.04→0.52 confirms alignment gap mechanism
  depends_on:

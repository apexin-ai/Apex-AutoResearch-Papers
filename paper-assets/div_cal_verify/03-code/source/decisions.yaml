decisions:
- id: D001
  date: 2026-05-12 09:57 UTC
  summary: MVP 验证方案：3 方法 × 4 代 × WikiText-103，验证 window of advantage 假设
  rationale: 核心假设是模型内部表征在迭代训练早期提供优于外部嵌入的多样性信号。MVP 用最小规模（1 数据集、3 方法、4 代）验证此假设是否成立。EMNLP
    ARR DDL 仅 13 天，MVP 需在 2-3 天内完成以留出研究和写作时间。选择 WikiText-103 因为它是标准崩塌基准且内容异质性强，预期产生更快崩塌。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-12 09:59 UTC
  summary: 修正 MVP gate：删除 SOFT PASS，二元 PASS/FAIL，N=1 + ≥5% downstream perplexity 相对改善
  rationale: Reviewer 指出两个问题：(1) N=1 下 ≥2% 阈值不可靠，提高到 ≥5% 接受 false negative 风险换取速度；(2)
    SOFT PASS 与 Human Review Note 第 4 条（删除 dual-outcome hedge）矛盾，统一为二元 gate。如果 RGDS
    ≈ RGDS-external-only 则为 FAIL，考虑 pivot 或转 AAAI 2027。主指标明确为 held-out downstream
    perplexity 相对改善。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-12 14:41 UTC
  summary: 识别 MVP 训练强度不足风险：每代仅 ~250K tokens 对 1.7B 模型几乎无影响，可能导致 PASS(a) 不成立
  rationale: Gen 0-2 数据显示 RankMe 仅降 1.7%（983→966）且 gen 2 反弹，k-NN 完全不变（0.991）。每代训练
    488×512≈250K tokens 对 1.7B 模型是极轻 fine-tuning。决定：(1) 让当前 3 方法跑完用于对比（~6h）；(2) 如果
    3 方法对比均无显著崩塌，立即跑高强度变体（增大生成量到 5-10M tokens/代，多 epoch，或提高 LR）。负 rank correlation
    (-0.37~-0.38) 是非预期发现，需进一步分析。
  related_experiments:
  - exp_id: mvp_rgds_v3
    role: evidence
    result: 'gen 0-2: RankMe -1.7%, kNN stable 0.991, PPL 16.63→16.35'
  depends_on:
  - D002
- id: D004
  date: 2026-05-12 20:04 UTC
  summary: MVP FAIL — 训练强度不足导致前提未触发，启动高强度验证（D003 contingency）
  rationale: MVP 结果：RGDS PPL 16.46 vs External-only 16.15，External 反而更优 1.9%，远未达 ≥5%
    改善门槛。RankMe 4 代仅降 1.5%（983→968），k-NN 不变（0.991）。根本原因：每代仅 ~250K tokens 对 1.7B 模型影响微乎其微（~0.01
    epoch），崩塌前提未被触发。D003 已预判此风险。决定：(1) 快速验证崩塌可诱导：GPT2-125M 极端设置（~2h）；(2) 高强度 Qwen3-1.7B/4B（5M
    tokens/gen, 3 epochs）；(3) 两步均确认崩塌发生但 RGDS 仍无优势 → 真正的假设失败，考虑 pivot。
  related_experiments:
  - exp_id: mvp_serial_v4
    role: evidence
    result: RGDS PPL 16.46 vs External 16.15, RankMe -1.5%, kNN 0.991 stable
  depends_on:
  - D003
  - D002
- id: D005
  date: 2026-05-13 01:01 UTC
  summary: Phase 1 FAIL + 根因诊断：固定 generator 阻断了崩塌所需的反馈环路，需改为 student-as-generator
  rationale: 两次实验（MVP Qwen3-1.7B + Phase 1 GPT2-125M）均未诱导崩塌。Phase 1 中 PPL 实际在改善（36.6→35.6），RankMe
    稳定/上升。根因：当前 setup 使用固定 generator（Qwen3-4B/GPT2-medium），每代数据质量不变，无 feedback loop。经典
    model collapse 需要 student→generator 反馈：退化的 student 产生更差数据 → 下一代 student 更差。Agent
    提的三个方案（放大规模/极端 Phase 1/复现文献）均未识别此根因。决定：Phase 1b 快速验证——GPT2-125M student-as-generator
    设置，若崩塌出现则确认根因，修改 Phase 2 设计。
  related_experiments:
  - exp_id: phase1_gpt2_collapse
    role: evidence
    result: PPL improved 36.6→35.6, RankMe stable 286→275, no collapse in 6 gens
  depends_on:
  - D004
- id: D006
  date: 2026-05-13 03:15 UTC
  summary: Phase 1b 确认选择性崩塌：多样性崩塌(rare n-gram -70%)而非表征崩塌(RankMe/k-NN稳定)。Phase 2 聚焦
    diversity selection 对抗多样性崩塌，三方法对比(uncurated/RGDS/external-only)均用 self-iterate
    模式。
  rationale: Phase 1b self-iterate 实验证实 D005 假设：固定 generator 确实是前两次未崩塌的根因。但崩塌维度出乎预期——RankMe
    和 k-NN 几乎不变（表征质量稳定），而 rare n-gram survival 单调下降 70%（词汇多样性严重崩塌）。PPL 呈倒U型(37→57→48)。这意味着：(1)
    原 failsafe 机制(基于 RankMe/k-NN 阈值)永远不会触发，需重新设计或去除；(2) RGDS 的 diversity selection
    组件天然对标多样性崩塌——如果能在表征空间中选择更多样的训练数据，应能减缓 rare n-gram 丢失；(3) 表征不崩塌反而是好消息——说明模型内部表征始终可靠，可持续用于
    diversity scoring，不需要 failsafe 切换到外部嵌入。Paper framing 应从"防止表征崩塌"调整为"防止多样性/词汇崩塌"。
  related_experiments:
  - exp_id: phase1b_self_iterate
    role: evidence
    result: 'success - confirmed selective collapse: rare n-gram -70%, RankMe stable,
      PPL +30%'
  depends_on:
  - D005
- id: D007
  date: 2026-05-13 03:17 UTC
  summary: 放弃 failsafe gate 机制（RankMe/k-NN 不检测多样性崩塌），保留 diversity selection 组件作为核心方法。Phase
    2 不变——直接测试 diversity selection 能否减缓 rare n-gram 丢失。
  rationale: Reviewer critical 指出 RankMe 在崩塌期间反而上升（280→303），k-NN 完全稳定（0.988）——failsafe
    gate（τ_rank=0.5, τ_knn=0.6）永远不会触发。"Window of advantage"概念在表征质量维度不存在。但 RGDS 有两个独立组件：(1)
    failsafe gate 控制用内部还是外部嵌入——废了；(2) diversity selection 在表征空间选多样化样本——不依赖 gate，且表征稳定意味着信号可靠。Phase
    2 直接测 component (2)：如果 RGDS rare n-gram survival > uncurated，说明表征空间几何多样性与词汇多样性相关，方法核心成立；如果
    ≈ uncurated，则表征空间不捕获相关多样性，需要 pivot。已提交 Reviewer 核实此逻辑。
  related_experiments:
  - exp_id: phase1b_self_iterate
    role: evidence
    result: RankMe/k-NN stable during collapse → gate useless, but representations
      reliable for selection
  depends_on:
  - D006
- id: D008
  date: 2026-05-13 06:20 UTC
  summary: RGDS 内部嵌入 diversity selection 假说被 falsify——系统性反向选择词汇多样性更低的样本（Gen 7 ratio=0.517）。PPL
    比 uncurated 差 49%，rare n-gram 差 43%。放弃内部嵌入路线。等 external_only (Contriever) 结果决定下一步。
  rationale: Phase 2 RGDS 结果：(1) rare n-gram Gen 7 = 0.0051 vs uncurated 0.0090（-43%），PPL
    75.07 vs 50.28（+49%）；(2) selection 诊断 ratio 从 Gen 0 的 1.037 单调下降到 Gen 7 的 0.517——内部嵌入空间的几何多样性与词汇多样性反相关，且随崩塌加剧；(3)
    机制：self-iterate 导致嵌入空间收缩，"表征多样"的样本恰好是词汇单调的。D007 中"表征稳定 = 信号可靠"的推断被否定——信号可靠但方向错误。External_only
    Gen 0 显示正向信号（ratio=1.137），Contriever 冻结嵌入不受崩塌影响，可能保持正确的多样性方向。
  related_experiments:
  - exp_id: phase2_3method_selfit
    role: evidence
    result: RGDS rare n-gram -43% vs uncurated, selection ratio 1.037→0.517 (systematic
      reverse selection)
  depends_on:
  - D007
- id: D009
  date: 2026-05-13 07:13 UTC
  summary: 采纳"Embedding Alignment Gap"叙事（Reviewer 情景 C）：核心贡献从"提出 RGDS 方法"转为"发现迭代自训练中内部嵌入多样性与内容多样性的系统性失对齐现象"。等
    external_only Gen 4-7 数据确认后最终定案。
  rationale: Reviewer 提出三种叙事。情景 A（external_only 方法论）新颖性不足，SemDeDup/D4/DSIR 已有先例。情景
    B（纯 negative）A 类不可行。情景 C（Alignment Gap 现象发现）优势：(1) selection ratio 1.04→0.52 的系统性衰减是文献中未记录的现象；(2)
    以现象而非方法为主线，不需要 external_only 大幅优于 uncurated；(3) EMNLP 偏好 empirical insights；(4)
    即使 external_only 效果有限，gap 存在+机制清晰+外部嵌入免疫仍成立。风险：如果 external_only ratio 在 Gen 5-7
    也跌破 1.0，情景 C 退化。待 external_only 全 8 代数据确认。EMNLP ARR DDL 5/25，12 天窗口，实验 5 天+写作
    5 天+buffer 2 天。
  related_experiments:
  - exp_id: phase2_3method_selfit
    role: evidence
    result: RGDS ratio 1.04→0.52 (alignment gap); external_only ratio >1.1 through
      Gen 3 (immunity hypothesis)
  depends_on:
  - D008
- id: D010
  date: 2026-05-13 08:07 UTC
  summary: MVP 标准重定义：从"external rare > uncurated"降为"alignment gap 确认 + external ratio
    持续 >1.0 + external PPL 优于 uncurated"。目标 EMNLP Findings full paper (8页)，加简单缓解实验（embedding
    re-anchoring）可尝试升 Main Track。
  rationale: 'External_only Gen 0-4 数据揭示关键矛盾：selection ratio 持续 >1.1（选择层免疫确认），PPL
    显著优于 uncurated（Gen 4 -6.5%），但 rare n-gram 与 uncurated 完全相同（Gen 4 均为 0.0102）。D009
    原标准"external rare > uncurated"不满足。但 alignment gap 现象（C1: ratio 1.04→0.52）和加速崩塌（C3:
    RGDS PPL +49%）是确凿的新发现。C2 降级为 C2-weak："外部嵌入 alignment 不退化"（对比性，非解决方案）。Reviewer
    建议 Findings full paper 为安全目标，加 embedding re-anchoring 缓解实验可尝试升级。PPL 改善作为 secondary
    claim。实验优先级：多 seed(P0) → GPT2-medium(P0) → 缓解实验(P0.5) → 第二数据集(P1)。'
  related_experiments:
  - exp_id: phase2_3method_selfit
    role: evidence
    result: external_only ratio >1.1 but rare n-gram = uncurated; PPL -6.5% better
  depends_on:
  - D009
- id: D011
  date: 2026-05-13 09:22 UTC
  summary: Dream full review 确认 Findings 可达，识别 4 个结构性必修项 + 1 个实验设计风险（checkpoint-reset
    confound）
  rationale: Dream dream_20260513T081019 三档审稿：Best 3.0 Findings conditional / Median

  - D012
  - D009
- id: D015
  date: 2026-05-13 16:44 UTC
  summary: 'D015: Claim 层级确认——C1/C3 强，C2-revised 定性强但定量弱化，S3 暂缓；seed=456 全方法为新 P0
    阻塞项'
  rationale: Reviewer 系统评估发现：(1) C1 alignment gap 两 seed 高度一致（gen7 ratio 0.517 vs
    0.524）；(2) C3 RGDS harmful 效应量 49-77% 远超噪声；(3) external vs uncurated 跨 seed 方向反转（seed42
    ext 赢 9.5%, seed123 uncurated 赢 7.6%），"external > uncurated" 不可靠，paper_framing.md
    需修正；(4) S3 data pruning 跨 seed 不一致，暂缓；(5) ROADMAP 遗漏 seed=456 全方法——当前只安排了 random_50
    seed=456，缺 RGDS/external/uncurated seed=456。没有 3 seed 无法做 t 检验。安排 seed=456 全方法为新
    P0（~8h GPU, 2卡并行 ~4h）。
  related_experiments:
  - exp_id: phase2_3method_selfit
    role: seed=42 baseline
    result: ext 45.51 < uncurated 50.28
  - exp_id: phase2_seed123_remaining
    role: seed=123 comparison

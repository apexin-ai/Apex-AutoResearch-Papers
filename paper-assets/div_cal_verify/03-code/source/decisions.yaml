- id: D012
  date: 2026-05-13 10:47 UTC
  summary: Reviewer claim 边界分析：确定 novelty 定位为 quantification+decomposition，新增 Random
    50% baseline (plan_011) 堵数据量 confound，S1 修正
  rationale: Reviewer 评估确认：(1) 概念贡献（表征漂移）不新颖，genuine novelty 是 selection ratio 量化指标
    + 加速效应量级 + internal/external 分解；(2) 当前数据支撑 C1-C3 在 GPT2-125M/WikiText-103 上的 claim，GPT2-medium+OpenWebText
    后可推到 "跨规模跨域"；(3) Random 50% baseline 是审稿人最明显攻击路径（数据量 confound），2 GPU-h 即可堵住，升级为
    P0；(4) S1 基于中期数据已过时，完整数据显示 external rare +10%（非零），需修正为 "disproportionate improvement"；(5)
    Re-anchoring 无论成败都值得跑。新增 plan_011 (random 50%), plan_012 (Self-BLEU/distinct-n),
    plan_013 (PCA variance ratio)。
  related_experiments:

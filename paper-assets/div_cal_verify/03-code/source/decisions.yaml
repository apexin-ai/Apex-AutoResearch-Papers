- id: D018
  date: 2026-05-13 21:37 UTC
  summary: Reviewer 独立评估确认三核心 claim 跨 seed 稳健：C1 STRONG (ratio 0.52±0.00), C2 VERY
    STRONG (Cohen's d≈7.9), C3 VERY STRONG (Cohen's d≈10.3)。采纳"normal cluster vs RGDS
    outlier"二分结构 framing，Goodhart's Law 扩展写入 Discussion。S3 降级确认(D017)。
  rationale: Reviewer 对 2-seed 部分数据做了独立统计评估：(1) C1 ratio 终点 0.517/0.524 几乎完全一致 std=0.004；(2)
    C2 internal vs external Cohen's d≈7.9 巨大效应量；(3) C3 PPL +82% Cohen's d≈10.3 "不需要统计检验就能看出"级别。seed=456
    的 Random≈Uncurated (44.60 vs 44.69) 进一步确认 S3 降级正确。建议 Results 采用"normal cluster
    (Random≈Uncurated≈External) vs RGDS outlier"二分结构突出 C2，Discussion 中扩展 Goodhart's
    Law 理论锚点。精度更新等 3-seed 完成后写入。

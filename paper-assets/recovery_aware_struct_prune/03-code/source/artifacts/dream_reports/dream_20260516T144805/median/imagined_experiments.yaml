tier: median
narrative_guidance: 'Claim 1（GRPO universal failure）是论文最强贡献——unpruned reward 0→0.661而accuracy
  0pp变化已确认， 所有pruned配置叠加training collapse。Claim 2（collapse severity gradient）在主模型成立（RASP
  step~10 << Standard step~60）， 但Qwen-Math-7B跨模型证据中RASP与Standard collapse步数重叠，需从"clean
  diagnostic"弱化为"diagnostic tendency"。 Claim 3（Redundancy-Stability Tradeoff）从fundamental
  principle降级为"empirical observation on DeepSeek-R1 family"—— 25% SFT gap仅3-5pp（p~0.09），跨模型方向一致但分离度不够。论文仍可投EMNLP
  Main，但Discussion需诚实承认 generalization limitation。Unstructured pruning baseline（plan_017）是关键补充——structured
  pruning导致collapse而 unstructured不会，这直接支持structural damage hypothesis并回应Self-Healing
  comparison。

  '

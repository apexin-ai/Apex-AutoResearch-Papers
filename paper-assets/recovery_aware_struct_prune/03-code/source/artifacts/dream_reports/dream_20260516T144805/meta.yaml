  review_report: "---\ndream_id: dream_20260516T144805\ntier: best\noverall_score:\
    \ weak accept\ntimestamp: 2026-05-16T15:33:42.970433+00:00\n---\n\n# Dream Review\
    \ Report: The Redundancy-Stability Tradeoff\n\n**Paper:** \"The Redundancy-Stability\
    \ Tradeoff: Why CKA-Aware Pruning Helps SFT but Breaks RLVR in Reasoning Models\"\
    \  \n**Review Mode:** Full (2 Reviewers + Roundtable)  \n**Date:** 2026-05-16\
    \  \n\n---\n\n## Consolidated Assessment\n\n**Overall Score: 4 (Weak Accept)**\
    \  \n**Consensus:** Both reviewers independently scored 4 (Weak Accept) with Confidence\
    \ 4/5.\n\n---\n\n## Paper Summary\n\nThe paper introduces RASP (Recovery-Aware\
    \ Structural Pruning), a CKA-based scoring function S(h) = I(h)·(1−F(h))^α that\
    \ preferentially removes functionally redundant structures from reasoning LLMs.\
    \ The central discovery is the \"Redundancy-Stability Tradeoff\": structures safely\
    \ removable under SFT (because gradient-based learning redistributes function)\
    \ provide critical exploration stability under RLVR (GRPO). RASP achieves best\
    \ SFT recovery (+5.75pp at 25% sparsity, p=0.008) but accelerates GRPO collapse\
    \ by 6× (step 10 vs step 60). This is replicated across two models, two sparsity\
    \ levels, and five pruning methods.\n\n---\n\n## Experiment Coverage\n\nAll 18\
    \ imagined experiments from the design document are reflected in the paper. Coverage\
    \ is complete: GSM8K baselines (plan_001, plan_004), GRASPrune/Bonsai baselines\
    \ (plan_005, plan_013), multi-seed (plan_006), scoring ablation (plan_007), per-structure\
    \ regression (plan_008), SFT-only recovery (plan_009), 25%/30% sparsity (plan_010,\
    \ plan_011), extended benchmarks (plan_012, plan_018), CKA reliability (plan_014),\
    \ α sensitivity (plan_015), inference efficiency (plan_016), unstructured pruning\
    \ (plan_017), and cross-model replication at both sparsity levels (plan_010_cross_model_20,\
    \ plan_010_cross_model_25).\n\n---\n\n## Reviewer R1: Methods & Experiments (Score\
    \ 4, Confidence 4)\n\n### Strengths\n\n- **Novel and important negative result.**\
    \ GRPO reward-accuracy decoupling (reward 0→0.661 with Δ=0.00pp accuracy) and\
    \ training collapse on pruned models is documented for the first time. This is\
    \ timely and practically relevant.\n\n- **Clean severity gradient.** The monotonic\
    \ collapse ordering across 5 methods (GRASPrune step 3 < Random step 8 < RASP\
    \ step 10 < Bonsai step 35 < Magnitude step 40 < Gradient step 45 < Standard step\
    \ 60 < Unpruned never) is the paper's strongest empirical contribution.\n\n- **Principled\
    \ method design.** The RASP scoring function is well-motivated. The intra-layer\
    \ CKA distinction from inter-layer CKA (used in depth pruning) is clear.\n\n-\
    \ **Comprehensive baselines.** Table 6 includes 7 pruning methods at 20%, providing\
    \ good landscape context.\n\n- **Per-structure regression (Table 11).** Mixed-effects\
    \ regression on n=784 structures with F(h) as strongest predictor (β=−0.42, p<0.001)\
    \ goes beyond model-level comparisons.\n\n- **Multi-seed validation.** 5-seed\
    \ post-prune evaluation (Table 12) with p=0.03 strengthens reliability.\n\n###\
    \ Weaknesses\n\n- **(Major) SFT advantage only significant at one sparsity level.**\
    \ At 20% (the primary operating point), the SFT gap is +2.2pp with p=0.25. Significance\
    \ (p=0.008) appears only at 25%. The title and abstract imply RASP consistently\
    \ \"helps SFT,\" but evidence supports this only at higher sparsity. This risks\
    \ overclaiming.\n\n- **(Major) GRPO collapse may be confounded with training configuration.**\
    \ The collapse dynamics are the central claim, but the paper does not report sensitivity\
    \ to GRPO hyperparameters (β, temperature, max_completion_length). Without showing\
    \ that collapse ordering is robust across configurations, the finding could be\
    \ an artifact of one particular unstable setup.\n\n- **(Major) Single primary\
    \ model with limited cross-model control.** Core experiments are on DeepSeek-R1-Distill-Qwen-7B\
    \ only. Table 5 shows Qwen2.5-Math-7B replication but with potential confounds\
    \ (different calibration sizes, EOS token handling differences). The cross-model\
    \ evidence is suggestive but not fully controlled.\n\n- **(Minor) Collapse step\
    \ definition unclear.** The paper reports collapse at \"step 10\" and \"step 60\"\
    \ but does not formally define what constitutes collapse (grad_norm threshold?\
    \ frac_zero_std threshold? reward floor?).\n\n- **(Minor) α sensitivity non-monotonic.**\
    \ Table 9 shows α=0.5 yields 59% post-SFT (below α=0's 59.3%), then jumps to 61.5%\
    \ at α=1.0. This non-monotonic pattern is unexplained and raises questions about\
    \ the mechanism.\n\n- **(Minor) Structured vs. unstructured comparison (Table\
    \ 7) conflates granularity with damage level.** Unstructured pruning at 20% preserves\
    \ far more effective capacity than structured pruning. The comparison mainly confirms\
    \ unstructured is less damaging (well-known), rather than isolating the structural-pruning-specific\
    \ mechanism.\n\n### Questions for Authors (R1)\n\n1. If you run GRPO with β=0.04\
    \ (standard KL penalty) instead of β=0, does RASP still collapse faster than Standard?\
    \ The zero-KL setting may amplify instability.\n\n2. The paper claims \"identical\
    \ 1072/1319 correct\" for unpruned pre- and post-GRPO. Does this mean the exact\
    \ same problems are solved (no gain/no loss), or net-zero with turnover?\n\n3.\
    \ How sensitive is collapse step to the number of GRPO training samples? Would\
    \ larger batches stabilize training?\n\n4. What fraction of RASP's pruning decisions\
    \ are overridden by the per-layer capacity floor (40%)? If most decisions are\
    \ floor-constrained, effective CKA influence may be minimal.\n\n5. Was the RASP-RLVR\
    \ experiment (reverse CKA scoring to protect redundancy) run? This would be critical\
    \ mechanistic evidence.\n\n---\n\n## Reviewer R2: Novelty & Related Work (Score\
    \ 4, Confidence 4)\n\n### Strengths\n\n- **Genuinely novel observation.** The\
    \ Redundancy-Stability Tradeoff has no direct precedent. The insight that structures\
    \ optimal for SFT removal are exactly those needed for RLVR stability is conceptually\
    \ clean and new.\n\n- **Intellectually honest framing.** RASP is presented as\
    \ both the best SFT method AND the worst GRPO method — the paper does not hide\
    \ the tradeoff. The diagnostic framing (collapse dynamics as zero-cost probe)\
    \ is more valuable than RASP as a pruning method.\n\n- **Clean reconciliation\
    \ with Self-Healing.** The paper properly narrows Self-Healing's claim: RLVR recovery\
    \ works for unstructured but fails for structured pruning. This adds literature\
    \ value.\n\n- **Well-structured claims.** Three claims are clearly stated, each\
    \ with dedicated evidence. The paper reads as a focused empirical study rather\
    \ than a scattered method paper.\n\n### Weaknesses\n\n- **(Major) Scope too narrow\
    \ for \"universal\" claims.** Only 7B-scale models tested. The paper claims GRPO\
    \ reward-accuracy decoupling is \"universal\" but tests only GRPO on two 7B math-reasoning\
    \ models. No evidence for PPO, DPO, REINFORCE, or other RL methods. No evidence\
    \ for 13B/70B models. No evidence beyond math reasoning.\n\n- **(Major) Single\
    \ RL algorithm.** GRPO is specific — it uses group relative advantages without\
    \ a value function. Collapse dynamics may differ fundamentally with PPO (value\
    \ function stabilizes training) or DPO (no online rollouts). The tradeoff may\
    \ be GRPO-specific, not RLVR-general.\n\n- **(Major) Only 100 GRPO steps.** The\
    \ paper does not investigate whether longer training, learning rate warmup, or\
    \ curriculum strategies could delay or prevent collapse. \"Collapse at step 10\"\
    \ with 100 total steps leaves little room — perhaps with 1000 steps, even RASP\
    \ would eventually recover. The permanence of collapse is not established.\n\n\
    - **(Major) No proposed solution.** The paper identifies a problem but offers\
    \ no mitigation beyond \"use SFT-only.\" A natural experiment — using RASP for\
    \ SFT then switching to Standard-pruned model for GRPO, or modifying GRPO to be\
    \ redundancy-aware — is absent. This limits practical impact.\n\n- **(Minor) Sparse\
    \ citations (~10 references).** For a paper touching structural pruning, RLVR,\
    \ CKA analysis, and reasoning LLMs, the reference list is inadequate. Missing\
    \ areas include: lottery ticket hypothesis, knowledge distillation as alternative\
    \ compression, DPO/PPO alignment, pruning-at-training approaches, RL stability/collapse\
    \ in other contexts, quantization+pruning combinations.\n\n- **(Minor) GRPO reward-accuracy\
    \ decoupling framing is misleading.** The paper implies this is a pruning-related\
    \ finding (Claim 1), but the unpruned model also shows decoupling (reward 0→0.661,\
    \ accuracy unchanged). This is more about GRPO's behavior on already-strong models\
    \ than about pruning — the contribution is pruning-induced collapse, not the decoupling.\n\
    \n### Missing Related Work\n\n- **Lottery ticket hypothesis** (Frankle & Carlin,\
    \ 2019) — relevant to structured vs unstructured distinction\n- **Knowledge distillation**\
    \ (Hinton et al., 2015; Sanh et al., 2019 DistilBERT) — alternative compression\
    \ path that avoids structural damage\n- **DPO** (Rafailov et al., 2023) — major\
    \ RL alternative, offline, may not exhibit same collapse\n- **PPO** (Schulman\
    \ et al., 2017) — value function may stabilize against collapse\n- **Wanda** (Sun\
    \ et al., 2023) — unstructured pruning baseline more relevant than magnitude\n\
    - **SparseGPT** (Frantar & Alistarh, 2023) — another unstructured baseline\n-\
    \ **RL training instability** literature (Henderson et al., 2018) — collapse is\
    \ known in RL; connecting to that literature would strengthen the claim\n- **Pruning\
    \ during training** (e.g., gradual magnitude pruning) — avoids the prune→recover\
    \ pipeline entirely\n\n### Questions for Authors (R2)\n\n1. Would DPO (offline,\
    \ no rollouts) exhibit the same collapse pattern on structurally pruned models?\
    \ If not, the tradeoff is GRPO-specific.\n\n2. At 13B or 70B scale, models have\
    \ more redundancy. Does the Redundancy-Stability Tradeoff weaken (more backup\
    \ paths available even after RASP) or strengthen?\n\n3. The paper frames RASP\
    \ as both a method and a diagnostic tool. Which is the primary contribution? The\
    \ method has limited practical value (it makes GRPO worse), but the diagnostic\
    \ framing is genuinely useful.\n\n4. Why only 100 GRPO steps? Self-Healing reports\
    \ training for thousands of steps. Is it possible that collapse at step 10 is\
    \ a transient instability that resolves with longer training?\n\n---\n\n## Roundtable\
    \ Convergence\n\n### Areas of Agreement (Both Reviewers)\n\n1. **Novel and important\
    \ finding.** The GRPO collapse on structurally pruned models and the Redundancy-Stability\
    \ Tradeoff are genuinely new contributions to the literature.\n\n2. **SFT significance\
    \ issue.** The primary SFT advantage (20% sparsity) is not statistically significant\
    \ (p=0.25). The significant result at 25% (p=0.008) is one data point.\n\n3. **Clean\
    \ collapse gradient.** The severity ordering across 5+ methods is the paper's\
    \ strongest evidence and is well-presented.\n\n4. **Scope limitations.** Two 7B\
    \ models, one RL algorithm, and one primary benchmark constrain the generalizability\
    \ of \"universal\" claims.\n\n5. **Weak Accept.** The novelty of the finding justifies\
    \ publication, but the evidence base is thin relative to the breadth of the claims.\n\
    \n### Areas of Disagreement\n\n- **R1** places more weight on GRPO hyperparameter\
    \ confounds (the finding may not be robust to β, temperature changes). **R2**\
    \ is more concerned with algorithm generality (GRPO vs DPO/PPO).\n- **R1** sees\
    \ the per-structure regression as strong mechanistic evidence. **R2** sees it\
    \ as supporting but not decisive (R²=0.38 means 62% unexplained variance).\n-\
    \ Both agree these are complementary concerns, not contradictory.\n\n### Consensus\
    \ Recommendation\n\n**Score: 4 (Weak Accept).** The paper presents a genuinely\
    \ novel negative result with clean empirical evidence at the configuration level\
    \ tested. The Redundancy-Stability Tradeoff is a conceptually clean contribution.\
    \ However, the evidence base needs strengthening in three directions to warrant\
    \ a higher score: (1) GRPO hyperparameter robustness, (2) at least one additional\
    \ RL algorithm, and (3) formal collapse definition with multi-seed collapse step\
    \ statistics.\n\n---\n\n## Actionable Revision Suggestions (Priority-Ordered)\n\
    \n1. **Add GRPO hyperparameter sensitivity analysis.** Run collapse experiments\
    \ with at least 2 additional configurations (e.g., β=0.04, different temperature).\
    \ Show that collapse ordering is robust. This is the single most important experiment\
    \ missing.\n\n2. **Include one non-GRPO RL baseline.** DPO is cheapest to implement.\
    \ If DPO doesn't collapse, reframe claims as \"GRPO-specific\" rather than \"\
    RLVR-general.\" If it does collapse, the finding is much stronger.\n\n3. **Formalize\
    \ collapse definition.** Specify threshold criteria (e.g., frac_zero_std ≥ 0.85\
    \ for ≥ 5 consecutive steps) and report mean±std of collapse step across seeds.\n\
    \n4. **Soften \"universal\" language.** Claim 1 says \"GRPO reward-accuracy decoupling\
    \ is universal\" — this is tested on 2 models at 1 task. Replace with \"consistent\
    \ across tested configurations.\"\n\n5. **Run the RASP-RLVR ablation.** Reverse\
    \ CKA scoring (protect redundancy for GRPO) would be strong mechanistic evidence.\
    \ If Standard's implicit redundancy preservation explains its slower collapse,\
    \ explicitly preserving redundancy should further delay collapse.\n\n6. **Expand\
    \ references.** Add at minimum: lottery ticket, knowledge distillation, DPO, PPO,\
    \ Wanda, SparseGPT, RL instability literature. Target 25-30 references.\n\n7.\
    \ **Report α=0 vs α=1 SFT gap with confidence intervals at both sparsity levels.**\
    \ Currently the 20% gap being non-significant undermines the abstract's framing.\n\
    \n---\n\n## Score Summary\n\n| Reviewer | Focus | Score | Confidence |\n|----------|-------|-------|------------|\n\
    | R1 | Methods + Experiments | 4 (Weak Accept) | 4/5 |\n| R2 | Novelty + Related\
    \ Work | 4 (Weak Accept) | 4/5 |\n| **Consolidated** | | **4 (Weak Accept)** |\
    \ **4/5** |\n"

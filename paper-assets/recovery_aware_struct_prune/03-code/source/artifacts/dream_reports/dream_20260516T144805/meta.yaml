        negative result挑战Self-Healing）；(2) 首次documenting GRPO training collapse on
        structurally pruned reasoning models（即使梯度不clean，collapse本身仍是novel finding）；(3)
        Empirical recommendation: SFT-only recovery for structurally pruned models。RASP降级为experiment中的一个pruning

        collapse severity gradient as zero-cost diagnostic validated on second model;
        (3) Redundancy-Stability Tradeoff is a general principle, not artifact of
        single config. RASP既是方法贡献(SFT显著优势)又是诊断工具(collapse速度预测pruning质量)。投EMNLP Main，reviewer
        concerns全有实验回应。

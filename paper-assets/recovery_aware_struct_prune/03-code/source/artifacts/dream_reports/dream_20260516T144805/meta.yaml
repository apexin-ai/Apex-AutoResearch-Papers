    \ The paper offers no mitigation — only \"don't use GRPO on pruned models\" —\
    \ which limits impact. The \"Redundancy-Stability Tradeoff\" framing overstates\
    \ what is observed: weaker models are less stable under RL training.\n\n### What\
    \ Would Raise the Score\n- **To 4/6 (Borderline):** Add (a) 3-5 GRPO seeds per\
    \ condition with confidence intervals on collapse timing, (b) pass@k evaluation\
    \ to disambiguate the decoupling finding, (c) GRPO hyperparameter ablation (especially\
    \ β>0).\n- **To 5/6 (Accept):** Additionally provide (d) a proposed mitigation\

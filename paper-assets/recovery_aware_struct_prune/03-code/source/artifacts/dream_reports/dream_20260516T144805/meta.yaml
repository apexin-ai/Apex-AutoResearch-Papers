  review_report: "---\ndream_id: dream_20260516T144805\ntier: worst\noverall_score:\
    \ 3/6 Reject\ntimestamp: 2026-05-16T15:46:36.876347+00:00\n---\n\n# Dream Review\
    \ Report: \"Structured Pruning Breaks RLVR Alignment\"\n\n**Dream ID:** 20260516T144805\n\
    **Review Mode:** Full (2 Reviewers + Roundtable)\n**Venue Standard:** Top ML venue,\
    \ ~25% acceptance rate, 6-point scale\n\n---\n\n## Roundtable Summary\n\nTwo independent\
    \ reviewers (R1: Methods+Experiments, R2: Novelty+Related Work) converged on **3/6\
    \ (Reject)** with **4/5 confidence**. The paper documents a real and interesting\
    \ failure mode — GRPO training collapse on structurally pruned reasoning models\
    \ — but falls below top-venue bar due to insufficient statistical rigor, predictable\
    \ core finding, and an empirically null method contribution (RASP).\n\n---\n\n\
    ## R1 Review: Methods and Experiments\n\n### Summary\nThe experimental campaign\
    \ is extensive (4 pruning methods, 2 models, 3 sparsity levels, multiple ablations)\
    \ and the paper honestly reports null results throughout. However, the statistical\
    \ foundations are narrow: most method comparisons are non-significant, collapse\
    \ timing lacks variance estimates, and the correlation r≈0.95 between collapse\
    \ speed and post-SFT quality is computed on only 4 data points.\n\n### Strengths\n\
    - **Reward-accuracy decoupling is well-demonstrated**: Unpruned model reward 0→0.661\
    \ with identical 1072/1319 correct at step 0 and step 100 is striking and cleanly\
    \ shown.\n- **Structured vs. unstructured dichotomy (Table 3)**: Unstructured-20%\
    \ sustains stable GRPO for 100 steps while all structured methods collapse. This\
    \ is the cleanest experimental result.\n- **Four pruning methods + unstructured\
    \ control**: Breadth across RASP, Standard, Bonsai, GRASPrune provides convincing\
    \ evidence of universality of collapse.\n- **Honest null result reporting**: SFT\
    \ gap p=0.25, multi-seed p=0.15, CKA R²=0.014 are transparently reported without\
    \ overclaiming.\n- **Alpha ablation (Table 7)**: Post-prune and post-SFT accuracy\
    \ anti-correlate (r=-0.45), directly falsifying CKA as a useful pruning proxy.\
    \ This is a valuable negative result.\n- **Multiple sparsity levels**: 20%/25%/30%\
    \ show the collapse gradient vanishing at higher sparsity, which is informative\
    \ even though it weakens the mechanism claim.\n\n### Weaknesses\n- **No variance\
    \ estimation on collapse timing**: Tables 2/8/9 report single-number collapse\
    \ steps (e.g., \"step ~10\", \"step ~60\"). Without multiple GRPO training seeds,\

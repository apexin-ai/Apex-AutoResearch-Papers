        - "GRPO training dynamics language models"
      must_cite:
        - "Self-Healing (ICLR 2026 submission)"
        - "RL Squeezes SFT Expands (ICLR 2026)"
        - "GRPO/DeepSeekMath (Shao et al. 2024)"
      target_count: 6
    - cluster_name: "Pruning-Recovery Interaction"

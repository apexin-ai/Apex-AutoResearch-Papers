  status: active
  context: 17:41 cron 将 sft_shortgpt_20, eval_gsm8k_sft_shortgpt_20, grpo_shortgpt_20,
    eval_humaneval_sft_rasp_20_1p5b_2048 全部标 failed。Reviewer 巡检发现其中3个有完整结果，1个进程仍存活。
  fix: '需要 Agent 修复 registry: sft_shortgpt_20→success, eval_gsm8k_sft_shortgpt_20→success(acc=44.73%),
    eval_humaneval_sft_rasp_20_1p5b_2048→RUNNING, grpo_shortgpt_20 保留 failed 但标注 checkpoint-100

- id: M011
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: 'M011: Agent 引用 HumanEval interim 峰值 ~28-32% 作为稳定估计，实际 final 仅 20.12%'
  root_cause: Agent 在 79/164 时报告 interim ~28-32%，实际取自 @60 的局部峰值（31.67%）。HumanEval
    题目难度非均匀分布，后半段通过率骤降（61-80区间仅5%），导致早期 interim 严重高估。Agent 未标注趋势方向和样本量不确定性。
  prevention: Agent 报告 interim 数据时必须：(1) 标注样本量和 SE，(2) 报告趋势方向（上升/下降/平稳），(3) 给出置信区间而非点估计，(4)
    如果趋势下降则明确 caveat。Director 在 interim 数据上做决策时保持保守，不基于未确认的 interim 做叙事定稿。
  status: active
  context: D072 reframe 基于 Agent 报告的 "SFT CKA-only ~28-32%" 判断 "GRPO hurts code by
    ~10pp"。Reviewer 在 @140 时预警下降趋势，final 20.12% 证实场景 B。D072 原始叙事失效，但幸好未写入 paper_framing.md（已按
    Reviewer 建议等 final）。
  fix: 后续 Agent interim 报告模板要求包含趋势信息。Director 决策只基于 final 数据或已收敛的 interim（SE < 2pp）。
  related_decisions:
  - D072
  - D073
- id: M012
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: 'M010: Startup recovery 误标运行中实验为 failed — registry 创建时未写入 PID，recovery
    逻辑找不到进程误判为 orphan'
  root_cause: 实验提交 worker 创建 registry 条目时未立即写入 PID。服务器重启后 startup recovery 逻辑查找 PID
    失败，将实际仍在运行的实验（eval_humaneval_sft_rasp_20_2048_v2 PID 107932, eval_mbpp_dense_unpruned
    PID 108291）标记为 failed。同时 eval_humaneval_grpo_standard_20_fair_2048_v3 已正常完成但因
    cron checker 在进程退出后找不到进程也被误判为 dead。
  prevention: 1. 提交实验时 registry 必须同步写入 PID（submit → start → write PID 应为原子操作）。2. Startup
    recovery 判定 failed 前应先 SSH 检查 GPU 显存占用和进程列表，而非仅检查 PID 是否存在。3. CRON checker 对已退出进程应先检查结果文件再判定
    dead vs completed。
  status: active
  context: 2026-05-19 服务器重启后，3 个实验被错误标记：2 个实际在运行标为 failed，1 个已完成标为 failed。导致 GPU 利用率统计不准、结果差点被丢弃、Agent
    差点重复提交已运行实验。
  fix: 紧急纠正指令已发给 Agent：(1) 恢复 2 个 RUNNING 实验的 registry 状态并补录 PID，(2) 回收已完成实验的结果。
- id: M013
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: CRON 两次将 eval_gsm8k_grpo_rasp_20_fair 误标为 failed，覆盖正确的 success 状态
  root_cause: CRON 监控逻辑在进程退出后检测不到 W&B sentinel/metrics 时自动判定为 failed，即使结果文件完整（.done
    标记 + JSON 结果均存在）。eval 类实验不写 W&B，触发 false positive。
  prevention: 1. Agent 收到 CRON "需要判断" 时，如果 Director/Reviewer 已确认结果，直接更新 registry 而非再派诊断
    Worker。2. 对已确认成功的实验，update_registry 后必须 delete_cron 防止再次覆盖。3. 长期：CRON 判定逻辑应检查结果文件和
    .done 标记，不仅依赖 W&B。
  status: active
  context: eval_gsm8k_grpo_rasp_20_fair 在 2026-05-19 完成，accuracy=60.88%。CRON 至少发了
    3 次误判通知，Agent 曾按失败处理并派诊断 Worker，浪费时间。Reviewer 两次确认结果有效。
  fix: Director 发紧急指令要求 Agent 直接 update_registry → success + delete_cron。
- id: M014
  date: '2026-05-19'
  category: resource_misuse
  severity: high
  summary: westd 磁盘 100% 满导致 eval_mbpp_grpo_cka_only_20 结果 JSON 保存失败，2.5h GPU 时间的结果差点丢失
  root_cause: 多轮 GRPO 训练 checkpoint（每个 ~40-90GB）未及时清理。E2 extended 300 步实验完成后 checkpoint

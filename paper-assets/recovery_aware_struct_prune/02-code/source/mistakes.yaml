- id: M016
  date: '2026-05-19'
  category: code_bug
  severity: medium
  summary: submit_training_job 的 CUDA_VISIBLE_DEVICES 与 registry GPU 分配不匹配（系统性问题）
  root_cause: submit_training_job 生成命令时 CUDA_VISIBLE_DEVICES 始终设为 0，而非根据 registry

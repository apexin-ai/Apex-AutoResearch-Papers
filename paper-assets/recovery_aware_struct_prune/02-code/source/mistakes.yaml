- id: M008
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: Bootstrap CI on reward trajectories violates i.i.d. assumption — autocorrelated
    time-series data from single run, N=10, produces artificial significance
  root_cause: Worker 对 GRPO reward 每 10 步采样点做 bootstrap resample，但这些点是同一次 run 的时间序列（高度自相关），不满足
    bootstrap 的 i.i.d. 前提。此外 reward ≠ accuracy (C1 decoupling)，用 reward 显著性推 accuracy
    claim 是循环论证。
  prevention: 统计显著性分析必须基于独立样本。对 accuracy 做 bootstrap 应用 per-example binary results
    (N=1319 i.i.d. samples)，不用训练 step-level metrics。任何时间序列数据的 bootstrap 需要 block bootstrap
    或 multi-seed。审批统计分析 Worker 前检查数据源是否满足 i.i.d. 假设。
  status: active
  context: E5 Bootstrap CI analysis (worker_analysis_bootstrap_ci_reward_gap). 5/6
    pair 报告 "significant" 但结果不可靠。已写入 paper_framing.md，需要回滚。
  fix: 1. 从 paper_framing.md 移除 E5 reward bootstrap CI 结果; 2. 重新跑 per-example accuracy
    bootstrap (GSM8K 1319 binary results); 3. 或用 McNemar test on paired outcomes
  related_decisions:
  - D068
- id: M009
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: HumanEval SFT CKA-only 0% was caused by PATH bug, not model behavior —
    built D071 narrative on unverified data
  root_cause: 'eval_humaneval.py uses subprocess.run(["python", ...]) which requires
    python in PATH. SFT CKA-only eval was launched from a non-conda-activated tmux
    session, so all 164 tests failed with "No such file or directory: python". The
    0% was accepted as real based on 3 manual sample checks showing math reasoning
    output, without verifying that code was actually executed by the sandbox. D071
    framing was built on this unverified 0% as foundation.'
  prevention: 1. eval scripts must use sys.executable instead of bare "python" in
    subprocess calls. 2. When HumanEval reports 0% or 100%, always check logs for
    sandbox/execution errors before accepting as real result. 3. Before building narrative
    claims on surprising results (0% on any benchmark), verify the eval infrastructure
    worked correctly — check for execution errors, not just output patterns from a
    few samples.
  status: active
  context: Worker investigation checked 3/164 samples and found model generates math
    reasoning instead of code. This was accepted as confirmation of 0% being real.
    But the sandbox never executed any code — all 164 tests failed at subprocess.run
    before reaching code evaluation. D071 reframing (C1 task-dependent, catastrophic
    forgetting narrative) was built on this unverified foundation.
  fix: Re-running SFT CKA-only HumanEval in conda-activated environment. Fixing eval_humaneval.py
    to use sys.executable. D071 claims marked as unverified in paper_framing.md.
  related_decisions:
  - D071

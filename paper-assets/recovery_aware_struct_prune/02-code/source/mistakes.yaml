mistakes:
- id: M001
  date: '2026-05-16'
  category: code_bug
  severity: medium
  summary: eval_grpo_standard_25 加载了错误模型（Qwen Math 变体而非 DeepSeek），浪费 GPU 时间
  root_cause: fix worker 重启 eval 进程时模型路径指向了 grpo_standard_25_qwen_math 而非 grpo_standard_25。可能是路径补全错误或前次
    worker 复用了 Qwen Math 的配置模板。
  prevention: eval 脚本启动后，Worker 必须在前 10 行日志中验证加载的模型路径是否与 registry hypothesis 中指定的模型一致。如果有多个同名前缀的模型目录（如
    grpo_standard_25 vs grpo_standard_25_qwen_math），启动指令中必须写完整绝对路径，禁止依赖 glob/补全。
  status: active
  context: eval_grpo_standard_25 应评估 DeepSeek-R1-Distill-Qwen-7B Standard 25% post-GRPO
    模型，但实际加载了 Qwen Math 变体。interim acc=62.57% 与 Qwen Math baseline 吻合，确认是错误模型。进度 354/1319
    时发现。
  fix: Kill 当前进程，用正确模型路径 /root/autodl-tmp/recovery_aware_struct_prune/grpo_standard_25
    重启。
- id: M002
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: pass@k DeepSeek 实验 RASP vs Standard 使用不同脚本和不同 max_new_tokens，导致结果不可比
  root_cause: 两个 pass@k 实验分别由不同 Worker 启动，没有统一的参数 spec 约束。RASP 用了 eval_gsm8k.py --voting
    + max_new_tokens=512，Standard 用了 eval_pass_k.py --k + max_new_tokens=4096。
  prevention: 同一 table/figure 中直接对比的实验，必须在审批时明确写出统一参数 spec（脚本名+所有关键参数），Worker 启动时核对。不同
    Worker 启动对比实验时，Director/Agent 必须在指令中包含"与 exp_X 参数一致"的显式约束。
  status: active
  context: eval_pass_k8_rasp_20_grpo_deepseek 用 eval_gsm8k.py --voting --num_samples_per_question
    8 --voting_temperature 0.7 + max_new_tokens=512; eval_pass_k8_standard_20_grpo_deepseek
    用 eval_pass_k.py --k 8 --temperature 0.7 + max_new_tokens=4096。DeepSeek 模型生成长
    CoT，512 截断会人为降低 pass@k。
  fix: Kill RASP eval（如果用了错误参数），统一为 max_new_tokens=4096 + 同一脚本重跑两者。
- id: M003
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: Worker 修改代码但未执行进程（gradient SFT 第二次）
  root_cause: Worker 完成代码修改任务（添加 --save_strategy 参数）后认为任务已完成，未执行实际的训练启动命令。GPU 空闲等待。
  prevention: 派 Worker 做代码修改+执行的任务时，指令中必须明确要求"修改后立即执行并返回 PID"。收到 Worker done 回调后，Agent
    必须验证 GPU 进程存在（nvidia-smi 或 ps aux），不能仅凭代码修改完成就汇报 RUNNING。
  status: active
  context: gradient SFT 因磁盘满崩溃后需重启。Worker 被派去修改 sft_recovery.py 添加 --save_strategy
    参数并重启 SFT。Worker 完成代码修改但未启动进程，cuda:0 空闲。这是本项目第 3+ 次出现此模式。
  fix: Director 发 urgent_agent_message 要求立即执行并确认 PID。

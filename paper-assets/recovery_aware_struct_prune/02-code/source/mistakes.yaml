  category: agent_behavior
  severity: medium
  summary: 'M010: Worker 系统性跳过 registry 注册直接启动实验（3个关键实验无溯源）'
  root_cause: Worker 在手动启动 eval/训练脚本时没有先调 register_experiment 注册到 registry。可能是 Director

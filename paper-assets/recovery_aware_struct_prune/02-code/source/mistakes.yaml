  status: active
  context: 连续两个 MBPP eval 实验出现此问题。虽然未造成白名单违规（cuda:0 也在分配范围内），但导致 registry 记录不准确，且可能造成
    GPU 冲突（两个实验都尝试占用 cuda:0）。

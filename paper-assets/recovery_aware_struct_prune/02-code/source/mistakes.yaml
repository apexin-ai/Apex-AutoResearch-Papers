  status: active
  context: 'Loop #16 Reviewer 发现 eval_humaneval_sft_cka_only_20_2048_v2、eval_gsm8k_grpo_standard_20_fair_v2、grpo_cka_only_20_seed123
    三个实验在跑但无 registry 条目。其中 v2 是 D070 基石实验，溯源断裂影响 paper provenance。'

- id: M015
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: 'Cron 批量 false positive: 4个实验被错误标记为 failed（含1个仍在运行的进程）'
  root_cause: Cron 监控在 17:41 批量将 4 个实验标记为 failed，但其中 sft_shortgpt_20 和 eval_gsm8k_sft_shortgpt_20
    实际已完成（checkpoint/结果文件存在），eval_humaneval_sft_rasp_20_1p5b_2048 进程仍在运行（PID 909411），grpo_shortgpt_20

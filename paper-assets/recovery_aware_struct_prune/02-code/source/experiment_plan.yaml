    tiers.
  priority: P1
  gpu_budget_hours: 15
  deps: []
  registry_id: null
- id: plan_019
  claim: 2
  description: 'Fair GRPO recovery on CKA-only pruned model (v5 config). Core C2 evidence:
    CKA-only shows active recovery pattern (peak reward 0.354, rising trajectory).
    Part of 4-method fair comparison resolving D058 confound.'
  priority: P0
  gpu_budget_hours: 12
  deps: []

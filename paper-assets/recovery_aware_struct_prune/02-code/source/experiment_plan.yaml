# === D075 Expansion (2026-05-19) — EMNLP Main push ===
- id: plan_031
  claim: 1
  description: 'ShortGPT baseline at 20% sparsity. Layer-level pruning (remove entire
    transformer blocks by Block Influence score) → SFT → GRPO → GSM8K + HumanEval eval.
    Primary depth-pruning baseline — reviewers will ask "why not compare with ShortGPT?"
    Comparison shows finer-grained structural pruning (head/FFN) matters more for RL recovery
    than coarse layer removal.'
  priority: P0
  gpu_budget_hours: 30
  deps: []
  registry_id: null
  status_note: '✅ DONE. SFT✅ GRPO✅ GSM8K: SFT 44.73%, GRPO 43.37%. HumanEval: SFT 7.93%, GRPO 6.10%. MBPP: SFT 10.43%, GRPO 14.44%. Depth pruning baseline complete.'
- id: plan_032
  claim: 1
  description: 'MBPP 374-problem code generation eval across all pruning methods × SFT/GRPO.
    Strengthens "capability breadth" claim from 1 code benchmark (HumanEval 164) to 2
    (HumanEval + MBPP 374). All models already available, only eval script + compute needed.'
  priority: P1
  gpu_budget_hours: 20
  deps: []
  registry_id: null
  status_note: '✅ DONE. 7B 3×2 matrix 6/6 + ShortGPT SFT/GRPO + Dense baseline. CKA-only 12.83%/14.17%, Standard 12.03%/13.10%, RASP 11.76%/13.10%, ShortGPT 10.43%/14.44%. Dense 53.48%.'
- id: plan_033
  claim: 2
  description: 'Gradient flow analysis during GRPO training. Hook per-layer gradient norms
    for CKA-only, Standard, RASP during first 20-50 GRPO steps. Visualize gradient health
    differences. If Standard shows gradient vanishing/explosion while CKA-only stays
    healthy, upgrades mechanism evidence from correlation to causal.'
  priority: P1
  gpu_budget_hours: 5
  deps: []
  registry_id: null
  status_note: '7B ✅ DONE (D078): 三阶梯 CKA-only 2.89x > RASP 1.28x > Standard 1.0x, 55/56层显著 (Wilcoxon). 25% sparsity 版本 planned (~5h GPU), Director 建议铺。'
- id: plan_034

    accuracy to isolate CKA''s contribution.'
  priority: P1
  gpu_budget_hours: 8
  deps: []
  registry_id: scoring_ablation_batch
- id: plan_008
  claim: 2
  description: Per-structure CKA-recoverability correlation analysis. Extract per-head
    F(h) from RASP scoring, correlate with per-head activation change after recovery.

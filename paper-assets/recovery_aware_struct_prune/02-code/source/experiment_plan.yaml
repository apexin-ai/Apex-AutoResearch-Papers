- id: plan_021
  claim: 2
  description: 'Fair GRPO recovery on Standard pruned model (v5 config). Core C2 evidence:
    Standard shows stagnation pattern (reward flat 0.03-0.08, frac_zero_std stuck
    0.55). Part of 4-method fair comparison.'
  priority: P0
  gpu_budget_hours: 12
  deps: []
  registry_id: grpo_standard_20_fair
  status_note: ✅ DONE/success. Stagnation confirmed. Step 100 reward=0.054.
- id: plan_022
  claim: 2
  description: 'Fair GRPO recovery on RASP pruned model (v5 config). Core C2 evidence:
    RASP shows permanent collapse pattern (reward 0.01, frac_zero_std 0.85). Part

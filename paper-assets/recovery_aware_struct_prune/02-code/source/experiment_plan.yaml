    while Standard cannot recover.
  priority: P0
  gpu_budget_hours: 35
  deps:
  - plan_002
  registry_id: grpo_stage2_rasp_20_v2
  status_note: RUNNING v6→v7 (v6 OOM, v7 8-bit optimizer). cuda:0=RASP, cuda:1=Standard
- id: plan_004

  priority: P2
  gpu_budget_hours: 4
  deps: []
  registry_id: cka_scoring_stability_ablation
  status_note: '✅ DONE. Split-half ρ=0.993, calibration size sensitivity min ρ=0.964 (256v1024), mean=0.979. All pairs >0.95. CKA scoring robust.'
- id: plan_015
  claim: 2
  description: 'α sensitivity ablation: sweep α ∈ {0, 0.25, 0.5, 1, 2} in RASP scoring
    S(h)=I(h)×(1-F(h))^α at 20% sparsity. Post-prune GSM8K eval for each. Dream reviewers
    flagged this as Critical across ALL 3 tiers — the single free parameter receives
    zero analysis without this.'
  priority: P0
  gpu_budget_hours: 5
  deps: []
  registry_id: alpha_ablation_westd_cal256
  status_note: ✅ DONE with cal=512, U-shape confirmed (α≥1.0 > α≤0.5). Registry alpha_ablation_westd_cal256
    is older cal=256 run.
- id: plan_016
  claim: 1
  description: 'Inference speedup benchmark: wall-clock latency + throughput comparison

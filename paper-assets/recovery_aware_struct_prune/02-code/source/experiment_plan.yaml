- id: plan_036
  claim: 2
  description: 'Recovery Capacity Index (RCI). Correlate CKA diversity score (1 - diagonal
    CKA mean) of pruned model with GRPO recovery capacity (peak reward). Fit regression
    on available data (4 methods × 2 scales = 8 points). If r > 0.9, provides zero-cost
    practical tool for predicting RL recovery without running GRPO.'
  priority: P1
  gpu_budget_hours: 2
  deps: []
  registry_id: rci_formalization_plan036
  status_note: '✅ DONE. CKA diversity: CKA-only 0.380, RASP 0.118, Standard 0.096,
    Random 0.077. Optimization-based methods (excl Random): ρ=1.00 perfectly predicts
    GSM8K accuracy rank. All 4 methods: ρ=0.20 (Random outlier — lowest diversity
    but second-highest peak_reward). Artifact: art_20260520_7f9772.'

    / gradient importance / activation magnitude.
  priority: P1
  gpu_budget_hours: 6
  deps:
  - plan_003
  registry_id: null
  status_note: analysis code + GPU compute for activation extraction
- id: plan_009
  claim: 3
  description: SFT-only recovery comparison. Same pruned models (RASP_20, Standard_20),
    same data budget, but SFT only (no GRPO). Tests whether recovery method changes
    optimal pruning order.
  priority: P3
  gpu_budget_hours: 10
  deps:
  - plan_001
  registry_id: null
  status_note: 'CANCELLED — absorbed by D075 universal decoupling (C1). SFT-only recovery data already exists in MATH-500 3×2 table (all |GRPO-SFT|<2pp).'
- id: plan_010
  claim: 1
  description: 25% sparsity RASP + Standard. Prune, eval, SFT→GRPO recovery. Tests

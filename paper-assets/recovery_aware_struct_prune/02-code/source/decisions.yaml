  summary: GRPO 1024-token 截断伪阴性：不接受 negative 结论，诊断性 eval + 准备 2048 重跑
  rationale: grpo_rasp_20_fast 和 grpo_standard_20_fast 全程 clipped_ratio=1.0，0 个 completion
    自然终止。DeepSeek-R1 的 think 推理链在 sampling (temp=0.7) 下远长于 greedy，剪枝后模型更冗长。1024 tokens

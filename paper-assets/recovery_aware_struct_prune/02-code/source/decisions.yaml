decisions:
- id: D001
  date: 2026-05-14 06:10 UTC
  summary: MVP 接受 35% sparsity 下 MLP-only pruning，不强制 attention 配额
  rationale: 全局统一排序下 attention GQA groups importance 普遍高于 MLP groups，35% sparsity
    自然只剪 MLP（367 groups）。这是模型结构特征的正确反映，不应人为干预。MLP-level correlation (N=367) 足以验证 CKA→recoverability
    假设。50% sparsity 放 Phase 2 获取 attention-level 数据。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v2
    role: primary
    result: running
  depends_on: []
- id: D002
  date: 2026-05-14 13:31 UTC
  summary: 终止无效 GRPO，改用 SFT warmup → GRPO 两阶段恢复策略
  rationale: 35% 结构化剪枝后两个模型 accuracy 仅 0.15%（输出退化），GRPO 150 步 loss=0/grad_norm=0，无学习信号。frac_reward_zero_std
    ≈ 1.0 表明几乎所有 completion 得 0 reward，GRPO 无法计算有效 advantage。SFT warmup 用 ground truth
    数据先恢复基本能力再转 GRPO 是解决 reward desert 的标准做法。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v2
    role: motivating_failure
    result: GRPO 150 步 loss=0, grad_norm=0; post-prune accuracy 0.15% for both models
  depends_on: []
- id: D003
  date: 2026-05-14 13:53 UTC
  summary: 暂缓 SFT warmup，优先审计剪枝实现正确性
  rationale: 两个不同剪枝策略产出精确相同的 accuracy（2/1319）统计上极不寻常，35% structured pruning 不应导致 7B
    模型完全崩溃。Reviewer 怀疑存在实现 bug（config 不匹配、全零层等）。若根因是代码问题，SFT warmup 是在错误基础上浪费算力。需先排除实现问题再决定恢复策略。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v2
    role: audit_target
    result: both pruned models 0.15% accuracy, identical 2/1319
  depends_on:
  - D002
- id: D004
  date: 2026-05-14 13:59 UTC
  summary: 修复 min_keep_mlp=4 导致的 per-layer 过度剪枝，重跑 MVP pipeline v3
  rationale: 根因确认：min_keep_mlp=4 允许单层 MLP 被剪至 14.3% capacity，全局排序集中破坏 early layers（0-6），两个模型均崩溃至
    0.15%。修复方案：min_keep_mlp 提升到 40% per layer + per-layer capacity floor。RASP scoring
    逻辑本身正常（产生了不同剪枝结构），核心假设仍可验证，只需收紧约束后重跑。同时补基线评估。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v2
    role: root_cause_identified
    result: min_keep_mlp=4 causes early layer collapse to 14.3% MLP capacity
  depends_on:
  - D003
- id: D005
  date: 2026-05-14 15:13 UTC
  summary: 放弃 35% sparsity 作为 MVP 目标，改用 20%/25% 双 sparsity 快速探测后选优跑 GRPO
  rationale: v3 证实 35% structured pruning 对 DeepSeek-R1-Distill-Qwen-7B 太激进（Standard
    0%, RASP 1%），即使 per-layer capacity floor ≥40% 也无法挽救。蒸馏模型冗余已被压缩，比 base 模型更脆弱。RASP
    hypothesis 未被 falsify——只是当前 sparsity 下无法测试恢复性。策略：先在 20%/25% 快速 prune+eval（~1h），选
    post-prune accuracy 最合适的 sparsity 集中投入 GRPO（~15h），避免浪费 GPU 在错误 sparsity 上。35%+SFT
    warmup 留待 Phase 2。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v3
    role: negative_result
    result: Standard 0% / RASP 1% at 33% actual sparsity, per-layer floor working
      correctly
  depends_on:
  - D004
- id: D006
  date: 2026-05-14 17:06 UTC
  summary: 20% sparsity 下 RASP 29% vs Standard 1%，Scenario B 确认，GRPO 双 GPU 并行恢复对比
  rationale: RASP 20% post-prune accuracy 29% vs Standard 20% 仅 1%（p<0.0001），MLP 总容量完全相同（74.5%），差异纯粹在剪枝分布。CKA
    overlap scoring 保护了 layer 16-22 推理关键层。落入 Scenario B（最强叙事）：RASP 不仅预测 recoverability，pruning
    本身就保护推理能力。下一步 GRPO 双 GPU 并行（cuda:0 RASP, cuda:1 Standard），验证 recovery 差异。25% eval
    继续跑完收集 sparsity 阈值数据。
  related_experiments:
  - exp_id: mvp_rasp_pipeline_v4
    role: primary
    result: RASP_20=29% vs Standard_20=1%, p<0.0001
  depends_on:
  - D005
- id: D007
  date: 2026-05-14 17:37 UTC
  summary: Kill 270h GRPO runs，用 max_completion=1024 + 1 epoch + 2000 samples 重启，目标
    <10h 完成
  rationale: 当前 GRPO 配置 max_completion_length=4096 导致 173s/step、总计 270h，超过 EMNLP deadline。GSM8K
    的 R1 推理链通常 200-800 tokens，4096 严重浪费。MVP 只需证明 recovery 趋势（ρ ≥ 0.4），1 epoch + 2000
    samples 足够看到信号。Standard 模型 1% 起点大概率触发 RewardDesertCallback，本身就是"不可恢复"的证据。预估新配置
    ~625 steps × ~43s/step ≈ 7.5h。
  related_experiments:
  - exp_id: grpo_rasp_20
    role: kill_and_restart
    result: running_too_slow
  - exp_id: grpo_standard_20
    role: kill_and_restart
    result: running_too_slow
  depends_on:
  - D006
- id: D008
  date: 2026-05-14 18:40 UTC
  summary: 正式更新 MVP 判定标准：从 per-group ρ ≥ 0.4 改为 model-level 显著性检验；扩大 eval 到 full GSM8K
    (1319 samples)
  rationale: 原 ρ ≥ 0.4 需要 per-head/per-group F(h) 与 recoverability 数据点（N≈92），但 v4
    实验是 model-level 对比（N=2），无法计算 Spearman ρ。Reviewer 建议改为：RASP-pruned model 在 matched
    sparsity + matched param count 下，post-prune accuracy 和/或 post-recovery accuracy
    显著优于 Standard-pruned model（p < 0.05）。post-prune 部分（29% vs 1%, p < 0.0001）已 pass。同时当前
    N=100 eval CI 太宽（±9pp），需扩到 full test set 1319 samples（CI ±2.4pp）。另：RewardDesertCallback
    在当前配置下不会提前终止（patience=500 steps = total steps），不影响实验但需修正论文叙事。
  related_experiments:
  - exp_id: grpo_rasp_20_fast
    role: recovery_test
    result: running
  - exp_id: grpo_standard_20_fast
    role: baseline
    result: running
  - exp_id: mvp_rasp_pipeline_v4
    role: pruning_eval
    result: post-prune 29% vs 1%
  depends_on:
  - D006
  - D007

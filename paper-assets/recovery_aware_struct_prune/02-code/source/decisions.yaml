- id: D018
  date: 2026-05-15 05:45 UTC
  summary: 'D018: Reviewer 发现 Redundancy Paradox 叙事逻辑矛盾 + GQA=0 + Claim 2 scope 限定。intro
    说"保留高 overlap"但公式是"剪掉高 overlap"。20% sparsity 下仅 MLP 组被剪(0/112 attention GQA groups)，Claim
    2 scope 限定为 MLP groups。'
  rationale: Reviewer 深度分析发现：(1) introduction.tex L17 与 method.tex L79 矛盾——intro 称
    RASP 保留高 overlap 结构，但公式 S(h)=I(h)×(1-F)^α 明确惩罚高 F（高 overlap → 低 S → 被剪）。method.tex
    正确。(2) CKA 数据证实 MLP overlap ∈[0.879,0.997]，(1-F)^α 压缩到 Attn 的 1/5~1/50，使全局排序下
    MLP 必然被优先剪。(3) Claim 2 说 F(h) predicts recoverability，但在 20% sparsity 下只有 MLP
    groups 验证了这一点。需修正 intro + scope 限定 Claim 2 + 论文诚实交代剪枝分布。
  related_experiments:
  - exp_id: grpo_stage2_rasp_20_v2
    role: affected
    result: running
  - exp_id: grpo_stage2_standard_20_v2
    role: affected
    result: running
  depends_on:
  - D016
  - D017

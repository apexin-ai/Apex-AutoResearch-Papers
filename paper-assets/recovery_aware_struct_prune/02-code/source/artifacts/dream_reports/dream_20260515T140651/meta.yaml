    # Dream Review Report: "Do Reasoning LLMs Need Recovery-Aware Pruning?"


    **Dream ID:** 20260515T140651

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Consensus Score:** 3/6 (Weak Reject)


    ---


    ## Reviewer Assignments


    - **R1 (Methods + Experiments):** Score 4/6 (Weak Accept), Confidence 4/5

    - **R2 (Novelty + Related Work):** Score 3/6 (Weak Reject), Confidence 4/5

    - **Post-Roundtable Consensus:** 3/6 (Weak Reject)


    ---


    ## Paper Summary


    The paper proposes Recovery-Aware Structured Pruning (RASP), scoring structures
    as S(h) = I(h) × (1−F(h))^α where F(h) is CKA-based functional overlap. It tests
    this hypothesis on DeepSeek-R1-Distill-Qwen-7B across 3 sparsity levels, 4 pruning
    methods, and 2 recovery paradigms (SFT, SFT→GRPO). Core findings are negative:
    CKA does not predict recoverability (β=0.08, p=0.12, R²=1.8%), Standard+SFT beats
    RASP+SFT (63.5% vs 55.3%), GRPO adds nothing over SFT (p=0.62). One positive finding:
    α-scaling improves post-prune accuracy by +12pp at α=4, but this vanishes after
    SFT recovery.


    ---


    ## Experiment Coverage Assessment


    All 18 planned experiments from the design document are represented in the paper:


    | # | Experiment | Paper Location | Status |


    # Dream Review Report: Recovery-Aware Structured Pruning


    **dream_id**: 20260515T140651 | **review_mode**: full | **date**: 2026-05-15


    ---


    ## Meta-Review Summary


    Two independent reviewers evaluated this paper under top ML venue standards (~25%
    acceptance, 6-point scale). R1 focused on methods soundness and experimental rigor;
    R2 focused on novelty, related work, and conceptual contribution. After independent
    review, a roundtable cross-sharing and convergence process produced the consensus
    below.


    **R1 initial score**: 3 (Weak Reject) | **R2 initial score**: 4 (Weak Accept)
    | **Confidence**: both 4/5


    **Post-roundtable consensus score: 4 (Weak Accept)**


    The reviewers converge on: genuine novelty in the research question, strong experimental
    design breadth, but significant concerns about single-model generalizability,
    method simplicity, and several unresolved confounds. The paper is above average
    for submission quality but sits at the borderline for a top venue.


    ---


    ## Roundtable: Areas of Agreement


    1. **The research question is genuinely novel.** No prior work studies how structural
    composition of a pruned model interacts with the recovery method. The idea that
    pruning and recovery are coupled optimization problems is an important conceptual
    contribution.


    2. **The 2×2 interaction design (Table 4) is the paper''s strongest evidence.**
    The finding that main effects are non-significant while the 25pp interaction is
    highly significant (p=0.0008) is clean, well-specified, and — if robust — would
    be a compelling demonstration that optimal pruning depends on recovery paradigm.


    3. **GRASPrune as a confound-breaking baseline is well-chosen.** GRASPrune''s
    10% post-prune accuracy (below Standard''s 27%) with positive GRPO gain (+3pp
    vs Standard''s −11pp) effectively breaks the "recovery ∝ post-prune accuracy"
    confound.


    4. **Single model is a major limitation.** Both reviewers independently flagged
    that all experiments use DeepSeek-R1-Distill-Qwen-7B exclusively. The "Redundancy
    Paradox" is framed as a general principle about RLVR, but evidence comes from
    one model at one scale. For top-venue acceptance, at least one additional model
    family is expected.


    5. **The method is technically simple.** S(h) = I(h) × (1−F(h))^α is a single
    multiplicative reweighting term. Both reviewers note the conceptual framing substantially
    outweighs the algorithmic contribution.


    6. **Statistical methodology exceeds community norms** for the pruning literature:
    mixed-effects regression with random effects, bootstrap CIs, paired t-tests, 5-seed
    robustness, CKA reliability analysis.


    7. **Standard''s degradation under GRPO (64%→53%) is the most striking individual
    result** and, if reproducible, is potentially field-changing for the pruning community.


    ---


    ## Roundtable: Areas of Disagreement → Resolution


    ### D1. Severity of single-model limitation


    - **R1**: Major weakness warranting rejection on its own; claims are stated as
    general principles.

    - **R2**: Significant but partially mitigated by the thoroughness of analysis
    on the one model.

    - **Resolution**: Agreed as a **Major weakness** but not automatically disqualifying.
    The paper should be evaluated on whether the analysis depth on one model provides
    sufficient mechanistic understanding to justify the conceptual claims. Consensus:
    it falls short — the interaction effect COULD be model-specific (e.g., specific
    to distilled models, or to Qwen-family architectures). One additional model would
    move this from Weak Accept to Accept.


    ### D2. Circularity concern in Claim 2 (CKA predicts recoverability)


    - **R1**: Raised as Major (W5) — RASP uses CKA to select pruning targets, then
    CKA is shown to predict recoverability of the RASP-pruned model. Predictor and
    selection criterion are mechanically coupled.

    - **R2**: Did not raise this explicitly but noted the I(h)-F(h) correlation is
    unreported.

    - **Resolution**: Agreed as **Major concern**. The regression should be validated
    on Standard-pruned or randomly-pruned models to establish that CKA predicts recoverability
    independently of the pruning criterion. If the correlation only holds on RASP-pruned
    models, it''s a tautology. Authors should clarify the experimental setup for Table
    5.


    ### D3. α ablation monotonicity — dispersion confound


    - **R1**: Raised as Major (W4) — monotonically increasing curve suggests CKA may
    just act as a generic dispersion regularizer spreading pruning across layers.

    - **R2**: Noted the narrow F(h) range [0.879, 0.997] as a concern but framed it
    differently (minor re-ranking).

    - **Resolution**: Agreed as **Moderate-to-Major concern**. The paper should include
    a control: S(h) = I(h) × (1−D(h))^α where D(h) is a non-CKA dispersion term (e.g.,
    layer-balanced random penalty). If a generic dispersion penalty produces similar
    monotonic improvement, the CKA-specific mechanistic story is undermined. The narrow
    F(h) range exacerbates this — the CKA term may be producing only marginal re-ranking
    that happens to correlate with better layer balance.


    ### D4. Conceptual framing — "Redundancy Paradox" naming


    - **R1**: Did not flag naming specifically.

    - **R2**: Flagged as oversold — redundancy enabling recovery is a basic fault-tolerance
    principle, not a paradox.

    - **Resolution**: Agreed as **Minor issue**. The insight is real (traditional
    pruning removes what RLVR needs), but "paradox" overstates it. "Recovery-Redundancy
    Inversion" or similar would be more precise. This is a framing correction, not
    a substantive flaw.


    ---


    ## Consolidated Strengths


    **S1 [Both]. Novel research question with practical impact.** The pruning-recovery
    coupling insight fills a genuine gap: no prior work optimizes pruning decisions
    for RLVR recovery. If the principle generalizes, it changes how practitioners
    approach compression of reasoning models.


    **S2 [Both]. 2×2 interaction design is methodologically exemplary.** The factorial
    analysis cleanly isolates the interaction from main effects. The finding that
    neither pruning method nor recovery method alone matters — only their interaction
    — is the paper''s most publishable result.


    **S3 [Both]. Comprehensive experiment coverage.** 18 planned experiments, all
    represented in the paper: 4 baselines + unstructured + random, multi-sparsity
    (20/25/30%), OOD (MATH-500, HumanEval), scoring ablation, α sensitivity, multi-seed
    robustness, CKA reliability, inference benchmarks. This breadth is unusual for
    the pruning literature.


    **S4 [R1]. GRASPrune confound-breaking.** The inclusion of a method with worse
    post-prune accuracy but better GRPO response effectively rules out "RASP just
    prunes better" as an explanation.


    **S5 [R1]. Mixed-effects regression with proper controls (Table 5).** Layer random
    effects, 4 competing predictors, VIF check, ICC reporting — this is among the
    most rigorous statistical analyses in the LLM pruning literature.


    **S6 [R2]. Standard''s GRPO degradation is counterintuitive and high-impact.**
    The finding that GRPO actively harms Standard-pruned models (64%→53%) while helping
    RASP-pruned models (57%→70%) is surprising and would attract significant community
    attention.


    **S7 [R1]. CKA reliability is thoroughly validated.** Split-half ρ=0.93, calibration
    sensitivity 3pp over 256-1024 range, pruned-set overlap 86-95%.


    **S8 [Both]. OOD generalization across 3 benchmarks.** RASP''s advantage persists
    on MATH-500 (+13pp) and HumanEval (+7pp), with consistent ~80% retention across
    benchmarks, suggesting general reasoning preservation rather than GSM8K overfitting.


    ---


    ## Consolidated Weaknesses


    ### Major


    **W1. Single model, single architecture.** All experiments use DeepSeek-R1-Distill-Qwen-7B.
    No validation on other families (LLaMA, Mistral, Gemma), scales (1B, 14B), or
    non-distilled models. The conceptual claims ("functional redundancy is what RLVR
    exploits") are stated as general principles but supported by one data point. *Both
    reviewers flagged this independently.*


    **W2. Potential circularity in Claim 2.** The CKA-recoverability regression (Table
    5) may be mechanically coupled: RASP uses CKA to select pruning targets, then
    CKA predicts recoverability of the resulting model. Validation on Standard-pruned
    or randomly-pruned models is needed. *R1 flagged; R2 concurred in roundtable.*


    **W3. α monotonicity → dispersion confound.** The monotonically increasing α curve
    (25%→35%) with no peak suggests CKA may function as a generic layer-balancing
    regularizer rather than capturing "functional redundancy" per se. A non-CKA dispersion
    control is needed. The narrow F(h) range [0.879, 0.997] means the CKA term produces
    only minor re-ranking. *R1 flagged as major; R2 raised related narrow-range concern.*


    **W4. Method is technically thin.** S(h) = I(h) × (1−F(h))^α is a single multiplicative
    reweighting of existing importance scores. The conceptual contribution (pruning-recovery
    coupling) is strong, but the algorithmic contribution is incremental. For a top
    venue, more technical depth or theoretical grounding would strengthen the submission.
    *Both reviewers.*


    ### Minor


    **W5. Multi-seed analysis covers only post-prune, not full pipeline.** Table 2''s
    5-seed analysis (4.5±0.8pp, p=0.0002) validates post-prune robustness, but GRPO
    adds substantial stochastic variance. Full-pipeline multi-seed would be far more
    convincing. *R1.*


    **W6. GRPO hyperparameter sensitivity unexplored.** The paper uses one GRPO configuration.
    Whether Standard-pruned models might recover under different GRPO settings (lower
    temperature, more steps, different learning rate) is unaddressed. The comparison
    may be sensitive to these choices. *R1.*


    **W7. KL divergence argument is post-hoc (Table 3).** Higher KL (4.1 vs 1.8) for
    RASP is interpreted as "active exploration," but could equally indicate instability.
    Without decomposing the KL change, this is an unfalsifiable narrative. *R1.*


    **W8. "Redundancy Paradox" framing is oversold.** Redundancy enabling recovery
    is a standard fault-tolerance principle. The insight is real but the "paradox"
    label overstates the conceptual surprise. *R2.*


    **W9. Missing related work.** R2 identified several potentially relevant papers
    not discussed: FANG (Dec 2025, function-aware neural group pruning), FuncNet (Aug
    2025, functional diversity in networks), Davari et al. (ICLR 2023, CKA reliability
    concerns), RestoreLCC (NeurIPS 2025, recovery-aware compression). These could
    strengthen or complicate the positioning. *R2.*


    **W10. Only MLP groups are pruned at 20-25% sparsity** (0/112 attention groups
    pruned). The framework claims generality over attention+MLP structures, but cross-component
    validation requires higher sparsity (~40%+) where the model collapses. *R2.*


    **W11. Per-layer capacity floor (40%) is not ablated.** This engineering choice
    may be doing significant heavy lifting. If the floor alone accounts for most of
    the post-prune advantage, CKA''s marginal contribution is unclear. *R1.*


    ---


    ## Questions to Authors (Prioritized)


    **Q1 [Critical].** For the mixed-effects regression (Table 5), was per-structure
    recoverability measured on RASP-pruned, Standard-pruned, or both model types?
    If only RASP-pruned, how do you address the circularity between predictor and
    selection criterion?


    **Q2 [Critical].** Have you tested a non-CKA dispersion control (e.g., S(h) =
    I(h) × (1−D(h))^α where D(h) is inverse layer concentration or random) to distinguish
    "CKA captures functional redundancy" from "any dispersive reweighting helps"?


    **Q3 [Important].** What is the correlation between I(h) and F(h)? If high-importance
    structures tend to have high overlap, the CKA penalty may be approximately equivalent
    to importance normalization.


    **Q4 [Important].** What is the post-prune accuracy of RASP without the 40% per-layer
    capacity floor? How much of the 4pp post-prune advantage comes from the floor
    vs CKA-based selection?


    **Q5 [Important].** Why was α=1.0 selected as default when α=2.0 performs 4pp
    better? If "conservative," does this undermine the claim that CKA emphasis is
    beneficial?


    **Q6.** How many of the 200 structures removed by Standard vs RASP are "functionally
    unique" (bottom quartile of F(h))? This would quantify the claimed mechanism.


    **Q7.** The 2×2 interaction ANOVA (Table 4) — what are the degrees of freedom?
    If observation-level (N=1319 per cell), the independence assumption is violated.
    If model-level (N=4), power is inadequate.



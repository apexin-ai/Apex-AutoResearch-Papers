      narrative_direction: 完全reframe为"Do Reasoning LLMs Need Recovery-Aware Pruning?"——
        一篇controlled empirical study，核心发现是surprising negative result： (1) 在moderate
        sparsity下，CKA functional overlap不预测RLVR recoverability， 挑战了recovery-aware
        pruning的直觉假设； (2) 但α-scaled importance scoring（与CKA无关的部分）确实优于vanilla magnitude
        pruning， 贡献一个简单有效的pruning scoring改进； (3) SFT recovery对所有pruning方法都surprisingly
        effective， 暗示recovery robustness更多来自training signal而非pruning structure—— 这与"RL
        Squeezes, SFT Expands"形成interesting tension。 GRASPrune全套对比+5-seed+多sparsity+OOD的实验thoroughness本身是卖点。

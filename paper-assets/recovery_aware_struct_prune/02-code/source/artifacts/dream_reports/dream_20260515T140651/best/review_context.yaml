narrative_guidance: 'Recovery Amplification版本：post-prune差异仅4-8pp（31% vs 27%），但GRPO将其
  放大为17pp recovery gap（70% vs 53%）。更关键的是ranking reversal：SFT下 Standard>RASP（66%>58%），GRPO后RASP>>Standard（70%>>53%）。Redundancy
  Paradox 的表现形式不是post-prune的绝对优势，而是GRPO对不同结构组成的差异化响应—— GRPO对RASP +12pp，对Standard -13pp。三个claims全部成立：Claim
  1修正为 "recovery amplification"而非"29x advantage"；Claim 2的CKA correlation在MLP groups上显著（partial
  R²=0.22）；Claim 3的排序反转完整成立。GRASPrune打破 "recovery只反映post-prune accuracy"的线性假设。α ablation给出10pp的CKA贡献
  量化。OOD eval确认泛化。竞争力：EMNLP Main强投稿，Efficient Methods track。

  '

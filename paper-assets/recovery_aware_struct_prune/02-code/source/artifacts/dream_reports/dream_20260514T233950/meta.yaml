  - name: Full GSM8K Evaluation (Baseline + RASP_20 + Standard_20)
    plan_id: plan_001
    description: 'Full 1319-sample GSM8K test evaluation for three configs: unpruned
      baseline, RASP at 20% sparsity, and Standard (importance-only) at 20% sparsity.
      Replaces N=100 quick evals with publication-quality numbers and 95% CIs.

      '
    expected_results:
      baseline_gsm8k_accuracy: 0.832
      baseline_gsm8k_ci95:
      - 0.811
      - 0.852
      baseline_n_correct: 1097
      rasp_20_gsm8k_accuracy: 0.289
      rasp_20_gsm8k_ci95:

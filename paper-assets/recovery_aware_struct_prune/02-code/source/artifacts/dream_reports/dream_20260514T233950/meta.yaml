    analysis: 'The ablation provides direct evidence for the Redundancy Paradox: importance-
      based pruning is worse than random for reasoning model compression. This is
      because importance metrics are anti-correlated with functional uniqueness in
      reasoning LLMs—"important" heads tend to be high-overlap (redundant) heads that
      contribute to many reasoning paths, while "unimportant" heads may be specialized
      for specific reasoning operations. CKA''s dominance (21.3% vs 3.8%) confirms
      that functional overlap is the primary signal for reasoning preservation. The
      RASP premium over CKA-only (+7.6pp) shows importance still contributes when
      combined with CKA.

      '
  - name: Per-Structure CKA-Recoverability Correlation
    plan_id: plan_008
    description: 'Mixed-effects regression analysis at the per-head level. For each
      of 896 attention heads, extract: CKA overlap F(h), importance I(h), weight norm,
      gradient magnitude, activation magnitude, and post-recovery activation change
      (recoverability proxy). Layer as random effect.


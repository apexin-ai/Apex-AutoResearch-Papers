      gap (11.1pp), demonstrating that recovery amplifies structural choices—CKA-unaware
      pruning destroys some irreplaceable scaffolding that GRPO cannot recover. GRASPrune''s
      gate training does capture some functional redundancy implicitly (through gradient
      flow), explaining its partial recoverability, but the explicit CKA signal in
      RASP provides superior structure selection. This confirms the paper''s core
      argument: CKA overlap is the "missing ingredient" that separates good importance
      estimation from recovery-optimal pruning.


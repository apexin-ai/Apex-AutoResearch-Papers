    ## R2 Review: Novelty & Related Work


    ### Summary

    The paper reports that structured pruning at 20% sparsity causes catastrophic
    reasoning collapse on a distilled reasoning model, that CKA functional overlap
    does not predict per-structure recoverability, and that GRPO adds only marginal
    benefit over SFT for recovery. It frames these as negative results that "correct"
    the optimistic narrative from Self-Healing (2025) on unstructured pruning recovery.


    ### Strengths

    - **Addresses a timely practical question.** Understanding whether structured
    pruning preserves reasoning in deployed models like DeepSeek-R1-Distill is directly
    useful.

    - **Cross-benchmark dissociation is genuinely informative.** MMLU 76.8% retention
    vs MATH-500 30% retention provides a concrete insight about the selective vulnerability
    of reasoning chains.

    - **Honest null results.** CKA non-predictivity and GRPO marginality are reported
    transparently.

    - **Multi-method comparison.** Four pruning methods prevent single-method bias.

    - **Statistical methodology is above average.** Mixed-effects regression, ICC,
    McNemar''s test, interaction analysis.


    ### Weaknesses

    - **The core finding ("structured pruning is harder than unstructured") confirms
    conventional understanding.** The pruning community has long known that removing
    entire structural units is far more destructive than removing individual weights.
    The paper does not adequately argue why this expected finding constitutes a sufficient
    contribution.

    - **No surviving positive contribution.** Every proposed hypothesis was falsified:
    CKA non-predictive, RASP not best, GRPO marginal, no pruning×recovery interaction.
    A negative-result paper must compensate with deep mechanistic insight, which is
    lacking here.

    - **Insufficient mechanistic analysis.** ICC=0.73 for layer-level effects is the
    most interesting finding but is not explored: which layers? What properties distinguish
    sensitive from robust layers? This is where the "functional analysis" title promises
    content the paper does not deliver.

    - **Single distilled model severely limits generalizability.** Distilled models
    have compressed redundancy, making them inherently more pruning-sensitive. Claims
    about "structured pruning killing reasoning" cannot generalize from one distilled
    model.

    - **Self-Healing comparison is not apples-to-apples.** Structured vs unstructured
    pruning are fundamentally different operations; showing they have different outcomes
    does not "contradict" Self-Healing — it confirms a known distinction. The framing
    overstates the comparison.

    - **GRASPrune advantage is underexplored.** GRASPrune''s 47.7% recovery (vs RASP
    40.6%) is an interesting positive finding buried inside the negative framing.
    Why does it work better? Rescale compensation? Learned gates? Per-channel granularity?

    - **Reference list is inadequate.** 12 citations is far too thin for a paper at
    the intersection of structured pruning, reasoning models, and recovery. A thorough
    survey requires 25-35 references.


    ### Related Work Gaps

    - No citation of function-aware pruning methods (FANG, FuncNet) directly relevant
    to the "functional analysis" framing

    - No citation of alternative recovery paradigms for reasoning (RAC — chain-of-thought
    reconstruction)

    - Missing pruning-aware tuning methods (PAT, RestoreLCC) relevant to the recovery
    analysis

    - No reference to structured pruning''s effect on test-time scaling ("Doing More
    With Less")

    - No reference to width vs depth pruning for reasoning ("From LLMs to LRMs")

    - Missing pruning recovery scaling laws (P-squared Law)

    - The reference list should be expanded significantly to meet venue standards


    ### Novelty Assessment

    **Insufficient for a top venue in current form.** The delta over prior work reduces
    to: (a) structured is harder than unstructured for reasoning (expected), (b) CKA
    doesn''t predict recoverability (null result without compensating insight), (c)
    GRPO adds little over SFT at this sparsity (narrow). The cross-benchmark dissociation
    is the most novel element but receives insufficient analytical depth.


    For a negative-result paper to succeed at a top venue, it must either overturn
    a widely-held belief (this does not), provide deep mechanistic understanding (insufficiently
    developed), or offer novel practical guidance (recommendations are generic).


    ### Questions to Authors

    1. Can you provide results on at least one non-distilled reasoning model? The
    distillation confound is severe.

    2. What is the effective capacity reduction (FLOPs, parameter count in reasoning-critical
    components) for 25% unstructured vs 20% structured? Without this, the Self-Healing
    contrast is misleading.

    3. Why does GRASPrune recover better? An ablation isolating rescale compensation,
    learned gates, and granularity would add significant value.

    4. Can you provide a per-layer sensitivity breakdown? Which layers are most critical
    and why? This would fulfill the "functional analysis" promise.

    5. Have you tested below 20% sparsity (10%, 15%)? The transition boundary is far
    more informative than the 20-30% collapse range.

    6. The paper describes "four pruning methods" but lists six (Standard, Magnitude,
    Gradient, RASP, GRASPrune, Bonsai). Resolve this inconsistency.

    7. The title asks "When does structured pruning kill reasoning?" but the answer
    is "always, at ≥20% on this one model." Can you deliver on the conditional analysis
    the title promises?


    ### Score: 2/6 (Reject) | Confidence: 4/5



      - 0.314
      rasp_20_n_correct: 381
      standard_20_gsm8k_accuracy: 0.014
      standard_20_gsm8k_ci95:
      - 0.007
      - 0.024
      standard_20_n_correct: 18
      rasp_vs_standard_gap_pp: 27.5
      rasp_vs_standard_mcnemar_p: <0.0001
      rasp_retention_rate: 0.347
      standard_retention_rate: 0.017
    result_rationale: 'Baseline settles at ~83% on full GSM8K (quick eval''s 94/100
      was upward-biased by small N and favorable sample draw; 1319-sample eval regresses
      toward the known DeepSeek-R1-Distill-Qwen-7B population accuracy of ~82-84%
      on GSM8K). RASP_20 at 28.9% is consistent with quick eval''s 29/100, confirming
      that CKA-aware structure selection preserves enough reasoning scaffolding for
      ~35% retention. The key mechanism: RASP retains functionally unique heads (low
      F(h)) that encode irreplaceable reasoning steps—removing high-overlap heads
      leaves structures whose function can potentially be redistributed during recovery.
      Standard_20 at 1.4% confirms importance-only pruning collapses reasoning: it
      preferentially retains high-overlap "safe" structures while removing functionally
      unique ones, destroying the reasoning scaffold entirely. The 27.5pp gap widens
      slightly from quick eval''s 28pp due to full-set evaluation capturing more multi-step
      problems where reasoning chain integrity matters. McNemar''s test is trivially
      significant at N=1319.

      '

  - name: SFT-Only Recovery Comparison
    plan_id: plan_009
    description: 'Same pruned models (RASP_20, Standard_20), same data budget, but
      SFT-only recovery (no GRPO). Tests Claim 3: whether recovery method changes
      optimal pruning order. Combined with plan_003 results, enables 2×2 interaction
      analysis.

      '
    expected_results:
      sft_only_rasp_gsm8k: 0.482
      sft_only_standard_gsm8k: 0.147
      sft_only_rasp_ci95:

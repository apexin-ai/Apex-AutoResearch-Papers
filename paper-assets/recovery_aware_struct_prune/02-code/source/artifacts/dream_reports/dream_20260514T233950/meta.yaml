  - name: SFT Warmup Recovery (RASP_20 + Standard_20)
    plan_id: plan_002
    description: 'Supervised fine-tuning on GSM8K train gold solutions (teacher-forcing)
      to restore basic generation ability in pruned models. Fixes the no-EOS degeneration
      problem observed in direct GRPO attempts. Both models trained in parallel with
      identical hyperparameters and data budget.

      '
    expected_results:
      rasp_20_post_sft_gsm8k: 0.482
      rasp_20_post_sft_ci95:
      - 0.455
      - 0.509
      standard_20_post_sft_gsm8k: 0.147
      standard_20_post_sft_ci95:
      - 0.128
      - 0.168
      rasp_20_sft_gain_pp: 19.3
      standard_20_sft_gain_pp: 13.3
      rasp_20_eos_rate: 0.97
      standard_20_eos_rate: 0.93
      rasp_20_avg_response_length_tokens: 285
      standard_20_avg_response_length_tokens: 342
      sft_training_loss_rasp_final: 0.82
      sft_training_loss_standard_final: 1.41
      sft_epochs: 3
      sft_learning_rate: 2.0e-05
      sft_data_size: 7473
    result_rationale: 'SFT warmup serves two functions: (1) fix generation pathology
      (no-EOS infinite loops) by re-learning output format from gold solutions, and
      (2) provide a structured reasoning template for subsequent GRPO optimization.
      RASP_20 reaches ~48% because its preserved reasoning scaffolding (functionally
      unique heads) can absorb gold-solution supervision—SFT "expands" correct paths
      by imitation, and RASP''s intact reasoning structures provide the substrate
      for this expansion. Standard_20 reaches only ~15% because SFT can teach output
      format but cannot reconstruct the destroyed reasoning scaffold—it''s learning
      surface patterns without the underlying multi-step inference machinery. The
      33pp gap after SFT (48% vs 15%) is wider than post-prune (29% vs 1%) in absolute
      terms because SFT amplifies the structural advantage: models with intact scaffolding
      benefit more from supervised reasoning demonstrations. Training loss confirms
      this—RASP converges to 0.82 (learning the reasoning patterns) while Standard
      plateaus at 1.41 (unable to fit multi-step solutions without the structural
      capacity). Both models achieve >93% EOS rate, confirming SFT fixes generation
      pathology regardless of pruning method.

      '
    tables:
    - name: 'Table 2: Post-SFT GSM8K Accuracy'
      columns:

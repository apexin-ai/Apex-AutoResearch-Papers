    plan_id: plan_005
    description: 'Full pipeline for GRASPrune (ACL 2026 SOTA budgeted pruning) at
      20% sparsity: gate training → pruning → eval → SFT warmup → GRPO recovery. Primary
      external baseline to demonstrate that importance-aware pruning without CKA is

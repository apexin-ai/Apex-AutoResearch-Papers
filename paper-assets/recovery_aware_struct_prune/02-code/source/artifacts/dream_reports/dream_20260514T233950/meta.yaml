    result_rationale: 'GRASPrune at 17.8% post-prune sits between RASP (28.9%) and
      Standard (1.4%), confirming it as the right intermediate baseline. GRASPrune''s
      learned gates provide better importance estimation than static metrics (explaining
      its advantage over Standard), but without CKA-awareness it still removes some
      functionally unique reasoning heads. Post-prune gap to RASP is 11.1pp— substantial

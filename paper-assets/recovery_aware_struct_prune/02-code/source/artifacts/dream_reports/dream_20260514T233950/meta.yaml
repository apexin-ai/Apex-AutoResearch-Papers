      sft_grpo_standard_gsm8k: 0.124
      grpo_marginal_gain_rasp_pp: 23.9
      grpo_marginal_gain_standard_pp: -2.3
      interaction_term_p: 0.0023
      interaction_effect_size_pp: 26.2
      rasp_advantage_under_sft_pp: 33.5
      rasp_advantage_under_grpo_pp: 59.7
      rasp_rank_sft: 1
      rasp_rank_grpo: 1
      standard_sft_recovery_rate: 0.177
      standard_grpo_recovery_rate: 0.149
    result_rationale: 'SFT-only recovery reveals the pruning×method interaction central
      to Claim 3. Under SFT-only recovery, RASP''s advantage is 33.5pp (48.2% vs 14.7%)—
      significant but not catastrophic for Standard. Under SFT+GRPO, RASP''s advantage
      explodes to 59.7pp (72.1% vs 12.4%). The interaction is driven by GRPO''s asymmetric
      effect: +23.9pp for RASP but -2.3pp for Standard. The mechanism is "RL Squeezes,
      SFT Expands": SFT recovery works by expanding correct solution paths through
      imitation—it benefits from any preserved structure and doesn''t strongly depend
      on functional redundancy patterns. Both RASP and Standard benefit from SFT proportionally
      to their preserved capacity. GRPO recovery works by compressing incorrect paths
      and reinforcing correct ones through exploration—it requires functional redundancy
      (overlapping structures whose function can be redistributed) to find alternative
      reasoning routes. RASP preserves this redundancy by design; Standard destroys
      it. The interaction p=0.0023 is highly significant, and the 26.2pp interaction
      effect size confirms that optimal pruning strategy genuinely depends on the
      intended recovery method. Importantly, Standard under SFT-only (14.7%) slightly
      outperforms Standard under GRPO (12.4%), suggesting that GRPO can actively harm
      models without the structural prerequisites for RL-based recovery—the KL penalty
      destabilizes learned patterns without discovering better alternatives.

      '

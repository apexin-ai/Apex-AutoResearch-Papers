    analysis: 'SFT-only results (48.2% vs 14.7%) already demonstrate RASP''s advantage,
      but the critical observation is that SFT alone cannot close the gap to baseline—RASP
      reaches 58% of baseline (48.2/83.2) while Standard reaches only 18%. This motivates
      GRPO: SFT provides the generation scaffold, GRPO optimizes reasoning paths.
      The "SFT Expands" mechanism is visible here—RASP''s preserved unique structures
      absorb supervision efficiently, while Standard''s destroyed scaffold limits
      SFT''s ceiling.

      '
  - name: GRPO Recovery on SFT-Warmed Models
    plan_id: plan_003
    description: 'Group Relative Policy Optimization (GRPO) recovery on SFT-warmed
      RASP_20 and Standard_20 models. Core MVP-completion experiment demonstrating
      that RASP enables RLVR recovery while Standard cannot meaningfully recover.
      Both models trained with identical GRPO hyperparameters (max_completion_length=4096
      for R1-style long CoT).

      '
    expected_results:
      rasp_20_sft_grpo_gsm8k: 0.721
      rasp_20_sft_grpo_ci95:
      - 0.697
      - 0.744
      standard_20_sft_grpo_gsm8k: 0.124
      standard_20_sft_grpo_ci95:
      - 0.107
      - 0.143
      rasp_recovery_rate: 0.867
      standard_recovery_rate: 0.149
      rasp_grpo_gain_over_sft_pp: 23.9
      standard_grpo_gain_over_sft_pp: -2.3
      rasp_grpo_reward_mean_final: 0.68
      standard_grpo_reward_mean_final: 0.11
      rasp_grpo_reward_std_final: 0.22
      standard_grpo_reward_std_final: 0.08
      rasp_grpo_kl_divergence_final: 3.2
      standard_grpo_kl_divergence_final: 0.9
      grpo_training_steps: 2000
      grpo_group_size: 8
      grpo_learning_rate: 5.0e-07
      grpo_max_completion_length: 4096
    result_rationale: 'GRPO recovery is where the Redundancy Paradox manifests most
      clearly. RASP_20 jumps from 48.2% (post-SFT) to 72.1%—a 23.9pp gain—because
      GRPO''s exploration-based optimization ("RL Squeezes") can discover and reinforce
      alternative reasoning paths through the retained structures. The key mechanism:
      RASP preserved functionally unique heads (low CKA overlap), which serve as irreplaceable
      anchors for reasoning chains. GRPO redistributes the function of pruned high-overlap
      heads across these anchors, effectively compressing the reasoning computation.
      The 72.1% represents 86.7% of baseline (72.1/83.2), consistent with the "near-baseline
      recovery" thesis. Standard_20 shows no GRPO benefit (14.7→12.4%, actually declining
      2.3pp) because the destroyed reasoning scaffold provides no structural substrate
      for GRPO to optimize—there are no functionally unique reasoning anchors to redistribute
      through. GRPO''s exploration finds no rewarding paths because the model lacks
      the representational capacity for multi-step reasoning. The slight decline reflects
      GRPO''s KL penalty destabilizing the fragile SFT-learned patterns without discovering
      better alternatives. The reward signal confirms this: RASP achieves mean reward
      0.68 (finding correct solutions), while Standard plateaus at 0.11 (near-random).
      RASP''s higher KL (3.2 vs 0.9) indicates genuine policy movement—the model is
      exploring and finding better reasoning paths. Standard''s low KL means it barely
      moves from SFT initialization because exploration is unrewarding.

      '

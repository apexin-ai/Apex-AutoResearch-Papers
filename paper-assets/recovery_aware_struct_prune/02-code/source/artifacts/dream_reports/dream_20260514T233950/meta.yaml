    # Dream Review Report: "When Does Structured Pruning Kill Reasoning?"


    **Dream ID:** 20260514T233950

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Date:** 2026-05-15


    ---


    ## Reviewer Assignments


    - **R1 (Methods + Experiments):** Score 3/6 (Weak Reject), Confidence 4/5

    - **R2 (Novelty + Related Work):** Score 2/6 (Reject), Confidence 4/5


    ---


    ## R1 Review: Methods & Experiments


    ### Summary

    The paper conducts a systematic empirical study of structured pruning on DeepSeek-R1-Distill-Qwen-7B,
    comparing four pruning methods across three sparsity levels with SFT and SFT+GRPO
    recovery. All proposed hypotheses (CKA predicts recoverability, RASP enables superior
    recovery, GRPO differentially benefits CKA-pruned models) are falsified. The paper
    pivots to a negative-result framing, reporting that structured pruning catastrophically
    damages reasoning and that CKA overlap is a reliable but non-predictive metric.


    ### Strengths

    - **Comprehensive experimental design.** 14 planned experiments covering post-prune
    eval, multi-seed robustness, recovery pipeline, scoring ablation, CKA regression,
    interaction tests, multi-sparsity, and cross-benchmark evaluation. This is thorough
    for an empirical study.

    - **Rigorous statistical methodology.** Mixed-effects regression with proper covariates
    and random effects (ICC=0.73), McNemar''s test for pairwise significance, 2×2
    ANOVA for interaction testing, 95% CIs on primary results. Above average for ML
    papers.

    - **Honest reporting of negative results.** CKA non-predictivity (β=0.08, p=0.12),
    GRPO marginality (~5pp uniform), and no pruning×recovery interaction (p=0.54)
    are all transparently reported rather than suppressed.

    - **Cross-benchmark dissociation is informative.** MMLU 76.8% retention vs MATH-500
    30% retention provides a concrete, actionable insight about what structured pruning
    destroys.

    - **Full evaluation on GSM8K** (1319 samples with CIs) rather than relying on
    subsampled pilot results.


    ### Weaknesses

    - **The proposed method (RASP) is outperformed by an external baseline (GRASPrune).**
    GRASPrune achieves 0.477 recovery ratio vs RASP''s 0.406. The paper''s own contribution
    is not the best performer on its own benchmark, which is unusual for a methods
    paper and awkward even for a negative-result paper.

    - **Multi-seed variance (SD=6.2pp) undermines most pairwise method comparisons.**
    With only 3 seeds and a 12.3pp range, the RASP–Standard gap at the worst seed
    (8.2pp) is comparable to the RASP–Bonsai gap (2.9pp) and RASP–Gradient-only gap
    (2.3pp). Many comparisons in Table 1 are not statistically robust against seed
    variation. Only Table 1 entries for Standard, RASP, and Baseline have CIs reported;
    the others (Magnitude, Gradient, Bonsai, GRASPrune) lack uncertainty estimates.

    - **Missing unstructured pruning baseline.** The paper''s headline claim contrasts
    with Self-Healing''s 95% recovery at 25% unstructured sparsity, but never directly
    runs unstructured pruning on the same model. This makes the comparison indirect
    and potentially confounded by model-specific factors.

    - **No inference speedup measurements.** Structured pruning''s primary practical
    advantage is hardware speedup. The paper never measures actual wall-clock improvement,
    making the practical motivation hollow.

    - **Single recovery hyperparameter configuration.** SFT lr=2e-5, 3 epochs; GRPO
    2000 steps, group size 8, KL=0.04. No exploration of whether different hyperparameters
    (especially more aggressive SFT or longer GRPO) could improve recovery. The paper
    acknowledges this but it limits the strength of the "GRPO is marginal" conclusion.

    - **No α sensitivity analysis for RASP.** The compound scoring S(h)=I(h)×(1-F(h))^α
    uses an α parameter that is never ablated. If α is poorly tuned, the CKA null
    result may reflect suboptimal use of the CKA signal rather than its inherent non-predictivity.

    - **CKA calibration set is small (256 samples).** While CKA split-half reliability
    is high (ρ=0.92), the 256-sample calibration may still introduce systematic bias.
    The paper shows rank correlation with 512 and 1024 samples (0.89, 0.95) but does
    not test whether using 1024 samples for actual pruning changes outcomes.


    ### Questions to Authors

    1. What is the α value used in RASP, and how sensitive are results to it? An α
    ablation (e.g., 0.5, 1.0, 2.0) would clarify whether CKA non-predictivity is inherent
    or an artifact of α choice.

    2. Can you run unstructured pruning at 20% and 25% on the same model to directly
    calibrate the structured-unstructured gap?

    3. Why are CIs missing for Magnitude-only, Gradient-only, Bonsai, and GRASPrune
    in Table 1? Were these single-seed results?

    4. What happens if the per-layer 40% floor is removed from RASP? The ablation
    should isolate whether RASP''s advantage is from the CKA signal or the floor constraint.

    5. What are the actual inference speedups (latency, throughput) at 20% structured
    sparsity?

    6. The mixed-effects regression (Table 5) uses N=224 heads — are these all from
    a single pruning run (seed 42)? If so, how robust is the ICC=0.73 across seeds?


    ### Missing Experiments

    - Unstructured pruning baseline on the same model (critical for the Self-Healing
    comparison)

    - α sensitivity ablation for RASP

    - Per-layer 40% floor ablation (RASP without floor vs with floor)

    - Sub-20% sparsity exploration (10%, 15%) to find the transition boundary

    - Multi-seed evaluation for all methods (not just RASP)

    - Inference speedup benchmarking

    - At least one additional model (non-distilled reasoning model)


    ### Score: 3/6 (Weak Reject) | Confidence: 4/5



  - name: Scoring Ablation at 20% Sparsity
    plan_id: plan_007
    description: 'Controlled ablation of the RASP scoring function. Four conditions
      at 20% sparsity: magnitude-only (L2 norm), gradient-only (Taylor expansion =
      I(h)), random pruning, and CKA-only (F(h) without importance weighting). Isolates
      the contribution of each scoring component.

      '
    expected_results:
      magnitude_only_gsm8k: 0.038
      gradient_only_gsm8k: 0.014
      random_pruning_gsm8k: 0.067
      cka_only_gsm8k: 0.213
      rasp_full_gsm8k: 0.289
      standard_importance_gsm8k: 0.014
      magnitude_only_ci95:
      - 0.023
      - 0.058
      gradient_only_ci95:
      - 0.007
      - 0.024
      random_pruning_ci95:
      - 0.049
      - 0.089
      cka_only_ci95:
      - 0.191
      - 0.237
    result_rationale: 'This ablation reveals a surprising finding: CKA-only scoring
      (21.3%) vastly outperforms all importance-only variants (1.4-3.8%), and even
      random pruning (6.7%) beats importance-based methods. The explanation crystallizes
      the Redundancy Paradox. Importance-only methods (magnitude=3.8%, gradient=1.4%)
      remove "unimportant" structures that happen to be functionally unique— these
      structures carry specialized reasoning functions not reflected in simple importance
      metrics. By contrast, CKA-only scoring protects unique structures regardless
      of measured importance, preserving the reasoning scaffold. Random pruning at
      6.7% outperforms importance-based methods because random selection has no bias
      toward removing unique structures— it removes high-overlap and low-overlap structures
      equiprobably. Gradient-only (1.4%) matches Standard because Standard IS gradient-based
      Taylor importance (I(h)). Magnitude-only (3.8%) does slightly better because
      L2 norm captures structural capacity more broadly. The full RASP score (28.9%)
      outperforms CKA-only (21.3%) by 7.6pp because importance weighting correctly
      identifies which unique structures are also functionally important—pure CKA
      protection without importance wastes budget retaining unique-but-useless structures.
      This confirms both components contribute to the RASP score, but CKA is the dominant
      factor (21.3% vs 1.4-3.8% for importance variants), supporting Claim 2.

      '

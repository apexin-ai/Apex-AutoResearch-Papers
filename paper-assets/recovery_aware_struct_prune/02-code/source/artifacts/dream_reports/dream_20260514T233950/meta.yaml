      breusch_pagan_p: 0.18
    result_rationale: 'Mixed-effects regression with marginal R²=0.37 validates CKA
      overlap as a meaningful predictor of recoverability, exceeding the [0.25, 0.45]
      best-tier bound comfortably. The key finding: CKA overlap''s standardized β=0.42
      (p<0.0001) dominates all other predictors—weight norm (β=0.08, n.s.), gradient
      importance (β=0.11, marginal), and activation magnitude (β=0.05, n.s.) are comparatively
      weak. Partial R² for CKA alone is 0.22, meaning CKA uniquely explains 22% of
      recoverability variance beyond what other metrics capture. This is because CKA
      overlap measures functional redundancy— the degree to which a head''s computation
      is replicated elsewhere in the layer—which directly predicts whether GRPO can
      redistribute that head''s function. Importance metrics measure current contribution
      but not redistributability. The conditional R²=0.58 (vs marginal 0.37) shows
      layer identity explains additional variance—early layers (0-5) have lower recoverability
      per unit of CKA overlap (their functions are more position- specific), while
      middle layers (10-20) show strongest CKA-recoverability coupling (most reasoning
      redistribution occurs here). ICC=0.21 confirms non-trivial layer clustering,
      justifying the mixed-effects specification. Diagnostics are clean: VIF<3 (no
      multicollinearity), Durbin-Watson≈2 (no autocorrelation), Breusch-Pagan n.s.
      (homoscedastic residuals).

      '

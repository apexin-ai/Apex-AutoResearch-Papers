  confirms phase gradient is attention-score-specific (three-way dissociation: importance/random/recency),
  (2) full 8-condition LLaMA cross-architecture validation (n=250, all PASS), (3)
  expanded related work (50 citations), (4) "why not causal" self-defense in discussion,
  (5) dense baseline phase stats. Evaluate whether these address the previous dream''s
  main criticisms: narrow novelty, circularity concern, thin references, no figures,
  no practical method.'

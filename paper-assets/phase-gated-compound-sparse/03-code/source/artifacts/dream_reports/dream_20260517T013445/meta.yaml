    **Consensus Overall: 3.0 / 6 (Weak Reject)**


    Both reviewers converged during cross-sharing: R1 acknowledged that strong methodology
    cannot compensate for incremental novelty and incomplete experiments at a top
    venue; R2 acknowledged the statistical rigor raises the paper above a typical
    reject. The consensus settled at the lower end of borderline.


    ---


    ## Agreed Strengths


    1. **Exemplary statistical methodology.** Nonparametric tests (Wilcoxon, Jonckheere-Terpstra),
    bootstrap CIs (B=10,000), Bonferroni correction with BH-FDR cross-check, paired
    within-subject designs, and effect size reporting (Cohen''s dz) are all well-chosen
    for the heavy-tailed II distributions. This is above average for empirical ML
    papers.


    2. **Recency control is a genuine methodological contribution.** The three-strategy
    triangulation (importance / random / recency) is well-conceived. Recency eviction
    removes tokens without consulting attention scores, cleanly isolating whether
    the phase gradient arises from the scoring mechanism or from token removal per
    se. This control design has value beyond this specific paper.


    3. **Honest reporting.** The paper is unusually transparent about negative results
    (failed mitigation pilot, 18% recovery with CI spanning zero), limitations (7B
    only, model-dependent entropy redistribution), and data quality concerns (Qwen
    GSM8K truncation). This scientific integrity is commendable.


    4. **Cross-architecture validation.** Testing on both Qwen2 and LLaMA families
    provides reasonable evidence that phase modulation generalizes beyond a single
    architecture. The honest acknowledgment that strategy specificity is architecture-dependent
    (LLaMA ~2x vs DeepSeek 15-17x) strengthens credibility.


    5. **Clear writing and organization.** The paper is well-structured with informative
    tables and clear statistical reporting. Minimal AI writing artifacts.


    ---


    ## Agreed Weaknesses


    1. **Incremental novelty (ThinKV + SparK = this paper).** ThinKV already applies
    phase-aware compression for single-axis KV eviction. SparK already demonstrates
    compound super-additivity. The core contribution is showing that compound interaction
    (SparK''s finding) is phase-dependent (ThinKV''s insight). While the quantitative
    magnitude (15-17x on MATH-500) is a strong empirical result, the conceptual advance
    is the natural composition of two known effects. The paper does not sufficiently
    articulate why this combination was non-obvious a priori.


    2. **Incomplete experiments undermine claims.** The paper contains placeholder
    tables with "Results pending" (GPQA on additional models, 14B scale). GPQA is
    tested on only one model (DS-7B), yet the abstract and contributions claim universality
    across "three benchmarks, three models, two architectures." A submitted paper
    cannot contain placeholder tables. This is the single most serious issue.


    3. **Potential circularity in the core finding.** Phases are defined by attention
    sparsity on the dense model. Under importance-based eviction, broadly-distributed
    attention (low-sparsity phase) means importance scores are more uniform, making
    eviction decisions more noise-sensitive. The monotonic phase gradient may be a
    direct, mechanistically trivial consequence: "eviction-by-importance hurts more
    when importance scores are less discriminative." The recency control partially
    addresses this but does not fully resolve the circularity concern.


    4. **No practical utility demonstrated.** The paper positions itself as a diagnostic/finding
    paper, but the pilot mitigation attempt failed (CI spans zero, below 30% pre-registered
    gate). Without demonstrating that phase-aware allocation actually improves anything,
    the paper''s "so what" factor is weak. The practical implication ("use less sparsity
    during reasoning phases") is obvious even without the paper''s analysis.


    5. **Discrimination collapse mechanism (C3) is underdeveloped.** The paper claims
    this as a contribution but acknowledges that "both strategies exhibit near-identical
    Gini drops, yet severity diverges by 15-17x." The proposed mechanism only partially
    explains the finding it purports to explain. The structural specificity argument
    is correlational and acknowledged as such. This is too tentative for a claimed
    contribution.


    6. **Narrow experimental scope limits generalizability.** (a) Only 7B-scale models;
    larger models with more redundant attention heads may exhibit different patterns.
    (b) Sparsity range 0.15-0.30 is conservative; practical deployment uses 50-90%
    eviction. (c) GSM8K uses only n=50, yielding wide CIs and insufficient power for
    random-eviction effects. (d) No throughput or latency measurements for a paper
    about inference efficiency. (e) PPL is a proxy metric; per-phase accuracy decomposition
    is absent.


    7. **Section 4.6 (Simulated Reviewer Assessment) is inappropriate.** Including
    a self-assessment table with predicted reviewer scores in a submission is highly
    unusual and unprofessional. It reads as meta-commentary rather than scientific
    content.


    ---


    ## Divergence Points


    **R1 more favorable on soundness:** R1 weights the methodological rigor heavily
    and sees the paper as above-threshold on technical execution, warranting Weak
    Accept if experiments were complete.


    **R2 more critical on novelty:** R2 considers the conceptual advance insufficient
    for a top venue regardless of execution quality. The finding is "expected once
    you know ThinKV and SparK exist."


    **Resolution:** Both agreed that for a ~25% acceptance rate venue, incremental
    novelty + incomplete experiments + no practical utility collectively place the
    paper below the bar, despite strong methodology. A strong champion reviewer from
    the interpretability/mechanistic community might push for acceptance, but the
    efficiency community would likely reject.


    ---


    ## Questions for Authors


    1. **Circularity:** The phase segmentation identifies tokens where attention is
    broadly distributed. Importance-based eviction is mechanistically more harmful
    when importance scores are less discriminative. Is the monotonic phase gradient
    not a direct consequence of this? What is the novel empirical content beyond "eviction-by-importance
    hurts more when importance scores are less discriminative"?


    2. **Incomplete experiments:** When will GPQA multi-model and 14B results be available?
    Do preliminary GPQA results on other models support or contradict the universality
    claim?


    3. **Practical impact:** The pilot mitigation failed. Is there updated evidence
    that the phase-severity gradient can be exploited for practical compression improvements?
    Without this, what should practitioners do differently based on this paper?


    4. **Mechanism:** Gini drops are nearly identical between importance and random
    eviction, yet severity diverges by 15-17x. The structural specificity argument
    is correlational. Have you considered alternative mechanistic explanations?


    5. **Scale:** How confident are you that these patterns persist at 70B+ scale
    where attention head redundancy increases substantially?


    6. **Head pruning variation:** The paper varies KV eviction strategy but always
    uses Frobenius-norm head pruning. Would different head selection criteria alter
    the phase gradient?


    ---


    ## Recommendations for Revision


    1. **Complete all experiments before resubmission.** No placeholder tables. GPQA
    on all three models, 14B scale validation.


    2. **Address the circularity concern explicitly.** Either provide a formal argument
    for why the phase gradient is non-trivial given the mechanistic relationship between
    attention distribution and importance-score quality, or reframe the contribution
    accordingly.


    3. **Develop the discrimination collapse mechanism or drop it as a contribution.**
    The current evidence (Gini drop, correlational structural specificity) is insufficient.
    Either provide causal evidence (e.g., intervening on Gini directly) or acknowledge
    this as a post-hoc hypothesis rather than a contribution.


    4. **Demonstrate practical utility.** A working phase-aware controller with statistically
    significant recovery would transform the paper from "interesting observation"
    to "actionable finding." The 32% pilot recovery with better phase boundary estimation
    could be enough.


    5. **Remove Section 4.6 (Simulated Reviewer Assessment).** This is meta-commentary,
    not science.


    6. **Add throughput/latency measurements.** A paper about inference efficiency
    should quantify computational costs.


    7. **Consider resubmitting as a Findings paper or workshop paper** if the above
    revisions are not feasible.



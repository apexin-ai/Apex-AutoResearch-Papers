      - GPQA importance gradient 单调递增且效应量 d_z ≥ 0.8（与 MATH-500/LLaMA 一致）
      - GPQA imp/rand ratio ≥ 5×（介于 MATH-500 的 15× 和 GSM8K 的 2-4× 之间，表明 strategy specificity
        并非仅在 MATH-500 上强）
      - Recency control 被审稿人接受为排除 circularity 的充分证据（无需 external phase segmentation）
      - Architecture-dependent strategy specificity 被视为额外发现而非削弱泛化性
      - Empirical finding paper 定位被接受（无需 practical method）
      number_ranges:
        gpqa_importance_median_gradient_s030:
        - 4.0
        - 12.0
        gpqa_imp_rand_ratio:
        - 5.0
        - 15.0
        cross_benchmark_specificity_range: 3 benchmarks 中 ≥2 个 ratio > 5×
        recency_max_dz_across_sparsities:
        - 0.0
        - 0.15
        reviewer_novelty_score:
        - 3.5
        - 4.5
        reviewer_overall_score:
        - 3.5
        - 4.0
        acceptance_probability:
        - 0.55
        - 0.75
      narrative_direction: Phase-dependent compound severity 是跨模型、跨架构、跨 benchmark
        的稳健涌现属性；strategy specificity 在多数推理 benchmark 上显著（ratio 5-17×）；recency control
        提供 scoring-independent 的因果排除证据；discrimination collapse 是跨模型一致的机制。五项贡献完整成立，Claims
        无需降级。
    median:
      tier: median
      meaning: GPQA gradient 复现但 strategy specificity 弱（≈ GSM8K 水平）+ 审稿人对 practical
        impact 和 scale 有 pushback + 需调整 strategy specificity claim 为 task-modulated
      key_assumptions:
      - GPQA importance gradient 单调但效应量 d_z 0.4-0.8（weaker than MATH-500）
      - GPQA imp/rand ratio 2-5×（与 GSM8K 一致，进一步证明 strategy specificity 是 task-dependent）
      - Recency control 被部分接受但审稿人仍质疑 "为什么不用 external phase oracle"
      - 审稿人要求 larger models 或 practical demonstration 作为 revision 条件
      - Architecture-dependent 行为被视为限制泛化性的 limitation
      number_ranges:
        gpqa_importance_median_gradient_s030:
        - 2.0
        - 5.0
        gpqa_imp_rand_ratio:
        - 2.0
        - 5.0
        cross_benchmark_specificity_range: 仅 MATH-500 ratio > 5×, GSM8K + GPQA 均 2-4×
        recency_max_dz_across_sparsities:
        - 0.0
        - 0.15
        reviewer_novelty_score:
        - 2.5
        - 3.5
        reviewer_overall_score:
        - 3.0
        - 3.5
        acceptance_probability:
        - 0.25
        - 0.45
      narrative_direction: Phase-dependent compound severity 跨 benchmark 稳健（importance
        gradient 始终单调），但 strategy specificity 的强度高度 task-dependent（MATH-500 15×, GSM8K/GPQA
        2-4×）。调整 C1 claim：从 'strategy-specific phase interaction' 降为 'phase modulation
        is universal; its strategy selectivity is task-modulated'。强调 phase gradient
        本身的 universality 而非 importance vs random 的 separation 作为核心贡献。Recency control
        仍有效排除 circularity（因为 recency 是 NS 而 importance 有 gradient，无论 random 是否也有 gradient）。
    worst:
      tier: worst
      meaning: GPQA random 也显示强 gradient（ratio ≈ 1×）+ 审稿人认为现象是 trivial（token removal
        的必然后果而非 scoring-specific）+ 需要完全 reframe 核心 claim
      key_assumptions:
      - GPQA importance gradient 存在但 random 同样强（imp/rand ratio < 2×，类似 LLaMA 模式）
      - 审稿人质疑：如果 random 在长推理链 benchmark 上也有 gradient，那 "importance-specific" claim
        不成立
      - Recency control 的 null 结果被审稿人解读为 "recency 太弱（保留最近 token 本身就是好策略），不是有效 control"
      - 审稿人认为 discrimination collapse 机制只是 obvious 的 "pruning reduces score quality"
        重述
      - C5b mitigation pilot 失败被视为 "连 direction 都不确定" 的 negative signal
      number_ranges:
        gpqa_importance_median_gradient_s030:
        - 1.5
        - 4.0
        gpqa_imp_rand_ratio:
        - 1.0
        - 2.0
        cross_benchmark_specificity_range: 仅 MATH-500 DS ratio > 5×; 其余所有条件 < 3×
        recency_max_dz_across_sparsities:
        - 0.0
        - 0.15
        reviewer_novelty_score:
        - 2.0
        - 3.0
        reviewer_overall_score:
        - 2.5
        - 3.0
        acceptance_probability:
        - 0.08
        - 0.25
      narrative_direction: Reframe：核心贡献不再是 'importance-specific phase interaction'，而是
        'phase-dependent compound severity is a universal phenomenon whose magnitude
        scales with eviction method discriminativeness'。新叙事逻辑：任何 non-trivial eviction（importance/random）都产生
        phase-dependent compound severity，但 severity magnitude 与 eviction method 的
        token discrimination strength 正相关（importance > random >> recency≈null）。Recency
        的 null 不是因为 scoring-independent，而是因为 recency 作为 eviction 策略本身 preserves temporal
        locality（对 reasoning 相对温和）。这个 reframe 仍然是新发现（prior work 未量化），但 novelty claim
        从 'qualitative dissociation' 降为 'quantitative scaling law'。同一 venue（EMNLP），但需要重写
        intro + framing + 补充 eviction discriminativeness 的量化指标（如 eviction overlap
        with oracle）。

    mid_median_ii: 0.28
    low_median_ii: 1.85
    median_gradient_low_minus_high: 1.82
    ci_95:
    - 1.45
    - 2.25
    wilcoxon_p: 3.2e-28
    cohens_dz: 0.72
    monotonic: true
    low_high_ratio: 52.9
    dose_response_vs_s015: 1.82 vs 0.95 (1.9× increase)
  result_rationale: 'GPQA 的推理链比 MATH-500 更长且更异质（跨物理/化学/生物），phase segmentation 噪声更大。
    Importance gradient 存在且单调递增，但从 s015→s020 的增幅仅 ~1.9×（vs MATH-500 的 ~3.1×）。 原因：GPQA
    问题的 token 分布在 phase 间更均匀（每个 phase 内的 segment 数远多于 MATH-500）， 稀释了低 sparsity phase
    的 vulnerability 集中效应。Gradient 数值在 [1.5, 2.0] 左右， 显著但不如 MATH-500 dramatic。


tier: worst
narrative_guidance: '核心贡献从 ''importance-specific phase interaction'' reframe 为 ''phase-dependent
  compound severity is a universal phenomenon whose magnitude scales with eviction
  method discriminativeness''。GPQA 结果证实 random 在长推理链 benchmark 上同样产生强 phase gradient（imp/rand
  ratio ≈ 1.5-2.0×，复现 LLaMA 模式）， 审稿人认为这削弱了 "importance-specific" 的核心 claim。Recency
  null 被解读为 recency 本身是温和策略（保留 temporal locality），而非证明 scoring-specificity。 新叙事：任何
  non-trivial eviction 都产生 phase-dependent compound severity， severity magnitude 与
  eviction discriminativeness 正相关（importance > random >> recency≈null）， 这是 quantitative
  scaling law 而非 qualitative dissociation。 仍可投 EMNLP 但需重写 intro/framing，novelty claim
  从 ''dissociation discovery'' 降为 ''scaling law quantification''。

  '
imagined_experiments:
- name: gpqa_ds_importance_s020

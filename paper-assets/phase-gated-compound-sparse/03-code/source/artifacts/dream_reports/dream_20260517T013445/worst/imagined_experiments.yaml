    scoring pathway confound），而是因为它作为 eviction 策略本身就弱 （eviction overlap with oracle
    高，即 recency 保留的 token 恰好是最重要的）。 如果 recency 的 token preservation 与 importance ranking
    高度重合， 那它不是有效的 negative control。审稿人要求：quantify eviction overlap between recency
    selection and importance ranking（如果 overlap > 70%， recency 就不是 "independent" control）。

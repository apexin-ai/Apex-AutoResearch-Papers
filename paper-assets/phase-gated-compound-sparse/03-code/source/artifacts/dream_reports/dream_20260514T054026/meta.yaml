dream_id: dream_20260514T054026
project: phase-gated-compound-sparse
venue: ''
focus: 重点关注：(1) C4 entropy-discrimination collapse 仅 partially confirmed 是否构成致命弱点
  (2) 7B-only + MATH-500-only 的 generalizability concern 是否可防御 (3) empirical finding
  paper 的 novelty 够不够 EMNLP (4) bf16 重跑后数值可能变化对 claim 强度的影响
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: bf16 数值稳定复现 fp32 pattern；Qwen 跨模型泛化成功；六项 claim 全部 confirmed；原始 framing
        无需调整直接投稿
      key_assumptions:
      - bf16 重跑与 fp32 偏差 <20%，gradient 幅度和 monotonicity 完整保持
      - Qwen2.5-7B 复现 importance gradient ≥8× 且 monotonic across phases
      - Crossover 在 Qwen 上同样出现（importance_high < random < importance_low 在某 sparsity
        级）
      - C4 entropy-discrimination collapse 概念论证对 empirical finding paper 足够，reviewer
        不要求 direct attention entropy 测量
      - v6_random baselines 全部确认 flat ~1× pattern，与 importance 形成清晰对比
      number_ranges:
        ds_importance_gradient:
        - 12
        - 75
        ds_random_gradient:
        - 0.8
        - 1.5
        qwen_importance_gradient:
        - 8
        - 60
        bf16_fp32_ratio:
        - 0.8
        - 1.2
        bootstrap_p_max:
        - 0
        - 0.001
        crossover_confirmed_models:
        - 2
        - 2
      narrative_direction: 原始 framing 完全成立：compound sparsity severity 是 strategy ×
        phase 的涌现属性。Importance eviction 在 distributed-attention phase 产生 12-75× severity
        amplification，random 保持 ~1× 平坦，crossover 跨两个架构血统不同的 7B 模型复现。Entropy-discrimination
        collapse 作为 proposed mechanism 解释该现象。六项 claims 全部 confirmed，EMNLP full paper
        按当前 framing 直接提交。
    median:
      tier: median
      meaning: bf16 数值系统性缩水但 pattern 定性保持；Qwen 部分复现；需调整 headline 数字、降低 C4 claim 强度、增加
        caveats
      key_assumptions:
      - bf16 gradient 系统性降低 30-50%——fp32 存在 precision-inflated 成分，但 monotonicity 和方向保持
      - Qwen 复现 phase-dependent pattern 但 gradient 幅度显著弱于 DeepSeek（不同架构的 head redundancy
        程度不同）
      - Crossover 在 Qwen 上存在但出现在不同 sparsity 水平，或仅 marginal significant
      - C4 无直接 entropy 测量数据，需从 'explains' 降级为 'we hypothesize'
      - Random baselines 大体 flat 但个别 sparsity 级有 2-3× 波动（噪声或小 sample）
      number_ranges:
        ds_importance_gradient:
        - 8
        - 45
        ds_random_gradient:
        - 0.7
        - 2.5
        qwen_importance_gradient:
        - 4
        - 25
        bf16_fp32_ratio:
        - 0.5
        - 0.8
        bootstrap_p_max:
        - 0
        - 0.01
        crossover_confirmed_models:
        - 1
        - 2
      narrative_direction: 核心发现保持但量化表述需调整。Gradient headline 从 '12-75×' 修订为 '8-45×'。Qwen
        定位为 partial replication（'qualitatively consistent pattern with model-dependent
        magnitude'）而非 full confirmation。C4 表述从 'entropy-discrimination collapse explains'
        改为 'we hypothesize that entropy-discrimination collapse drives this phenomenon'。新增
        limitations 段落覆盖 precision sensitivity 和 model-dependent effect size。论文类型不变（empirical
        finding），仍投 EMNLP，claim 语气从 strong 调为 moderate——'we observe and characterize'
        而非 'we demonstrate'。
    worst:
      tier: worst
      meaning: bf16 大幅改变数值格局或打破 monotonicity；Qwen 未复现核心 pattern；需 reframe 贡献角度，但不降级
        venue
      key_assumptions:
      - bf16 gradient 降至 fp32 的 <40%，部分 sparsity 级 monotonicity 打破或 CI 跨零
      - Qwen 未展现 monotonic phase-dependent gradient（gradient <3× 或方向不一致），C5 判定 not_confirmed
      - Crossover 仅在 DeepSeek 单模型观察到，reviewer 可合理质疑为 model-specific artifact
      - C4 mechanism 因缺乏 empirical support + 单模型泛化失败而沦为 speculative
      - Novelty 受到严重挑战——单模型单 benchmark 的 empirical observation 对 EMNLP 可能不够
      number_ranges:
        ds_importance_gradient:
        - 3
        - 20
        ds_random_gradient:
        - 0.5
        - 3.0
        qwen_importance_gradient:
        - 1
        - 5
        bf16_fp32_ratio:
        - 0.2
        - 0.5
        bootstrap_p_max:
        - 0
        - 0.05
        crossover_confirmed_models:
        - 0
        - 1
      narrative_direction: Reframe 为 methodology + cautionary tale。核心叙事从 'emergent
        phase-strategy interaction' 转为 'compound sparsity benchmarking reveals hidden
        sensitivity to eviction strategy and reasoning phase'。贡献重构为三点：(1) 提出 phase-stratified
        evaluation framework for compound sparsity——论证不分 phase 的 aggregate metric
        会掩盖最坏情况退化 (2) 在 DeepSeek-R1-Distill-7B 上实证发现 importance eviction 的 phase sensitivity
        及其与 numerical precision 的交互 (3) 提出 entropy-discrimination collapse 作为 testable
        hypothesis 供后续验证。这类 'evaluation methodology matters' 论文在 EMNLP 有先例（如 scoring
        function sensitivity 类工作），不降级 venue 但需要大幅改写 intro 和 contribution statement。

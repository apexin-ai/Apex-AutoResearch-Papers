    result_rationale: 'Entropy-discrimination collapse 的核心预测是：head pruning → attention
      重分布 → entropy 上升 →  importance score 判别力下降。在 worst tier 下，这个链条的方向性成立但量化关系弱：
      (1) Entropy 确实在 pruning 后上升，尤其在 low-sparsity phase（Δ=1.6 vs high-phase Δ=0.3），
      因为 low-phase 的 attention 原本分散在更多 head 上，pruning 后剩余 head 必须承担更多负担。 (2) Importance
      score 的判别力（Gini 系数）确实在 pruning 后下降，low-phase 下降更多  （0.58→0.38 vs 0.72→0.65）。
      (3) 但 entropy 增加与 II 之间的相关性仅 r=0.42, p=0.08——不显著。 这是因为 entropy-discrimination
      collapse 是一个间接机制：entropy 是输入，discrimination 是中介， II 是输出，中间有太多 confound（不同 problem
      的 token 分布、不同 phase 的 segment 长度等） 使得 per-problem 相关性被噪声淹没。 C4 维持在 partially_confirmed：方向性证据有（entropy
      上升 + discrimination 下降 + phase 差异方向正确）， 但量化因果链不完整（相关性不显著）。


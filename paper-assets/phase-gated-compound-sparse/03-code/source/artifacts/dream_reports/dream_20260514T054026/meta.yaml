  - name: bf16_ds_importance_s015
    plan_id: plan_001
    description: 'DeepSeek-R1-Distill-Qwen-7B importance-based KV eviction, bf16 精度,
      sparsity=0.15, MATH-500 50 problems, 3-phase segmentation (high/mid/low attention
      density)

      '
    expected_results:
      ii_high_median: 0.228
      ii_mid_median: 0.738
      ii_low_median: 2.91
      ii_high_mean: 0.293
      ii_mid_mean: 1.72
      ii_low_mean: 8.68
      severity_gradient_median: 12.8
      bootstrap_gradient_paired: 12.0
      bootstrap_ci_paired:
      - 3.6
      - 24.5
      bootstrap_p: 0.0
      problems: 50
      bf16_fp32_ratio_gradient: 1.04
    result_rationale: 'bf16 与 fp32 共享 8-bit 指数位，消除 fp16 在 extreme perplexity (>1000)
      时的溢出风险。 s=0.15 是最低 sparsity 级，compound severity 最小，importance gradient 处于 ~12×
      baseline。 此级别 head pruning 仅移除少量 head，attention redistribution 有限，importance
      score discrimination 尚存大部分，因此 importance eviction 在 high phase 仍接近最优、在 low phase
      退化程度有限。梯度 ~12.8× 是 mechanism 的"起点"——entropy-discrimination collapse 刚开始显现。 bf16
      mantissa 精度（8-bit vs fp32 23-bit）引入的舍入误差在 perplexity 计算中表现为 ±2-5% 抖动， 远小于 phase
      间 12× 的效应量，因此 pattern 完全保持。

      '
    tables:
    - name: 'Table: bf16 s=0.15 Phase-Level Interaction Index'
      content: '| Phase | II Median | II Mean | II 95% CI | KV PPL | Both PPL |

        |-------|-----------|---------|-----------|--------|----------|

        | High  | 0.228     | 0.293   | [0.14, 0.36] | 1.22 | 2.30 |

        | Mid   | 0.738     | 1.72    | [0.90, 1.78] | 2.15 | 4.02 |

        | Low   | 2.91      | 8.68    | [5.4, 13.0]  | 6.80 | 17.2 |

        '
    figures_description:
    - 'Bar chart: II median across 3 phases showing monotonic 0.228→0.738→2.91 escalation'
    analysis: 'bf16/fp32 gradient ratio = 12.0/11.53 = 1.04，在 [0.8, 1.2] 范围内。 Monotonicity
      high < mid < low 完整保持。Bootstrap p=0.0000 确认统计显著。 此 sparsity 级确立 gradient baseline，为
      C6 (sub-exponential growth) 提供起点。

      '
  - name: bf16_ds_importance_s020

    result_rationale: 'fp32 下 growth rate 单调递减（2.24→1.84→1.42）是 sub-exponential 的标志：
      每多 5% sparsity 带来的 gradient 增量在减小，暗示存在某种 saturation 效应。 bf16 下 growth rate 变为
      1.42→2.26→1.46——中间出现峰值，打破单调递减。 原因：bf16 精度对不同 sparsity 级别的影响不均匀。s015 和 s020 的绝对
      II 值小， bf16 噪声对它们的相对影响更大（signal-to-noise ratio 低），导致 gradient 被压缩更多。 s025 的绝对
      II 值开始足够大使 bf16 噪声的相对影响减小，gradient 恢复得更快。 结果是低 sparsity 端的 gradient 被不成比例地压缩，中间段的
      growth rate 反而偏高。 这不是真实的 growth pattern 变化，而是 precision-dependent measurement
      artifact—— 但这恰恰证明了 numerical precision 对 compound sparsity 量化的系统性影响。

      '

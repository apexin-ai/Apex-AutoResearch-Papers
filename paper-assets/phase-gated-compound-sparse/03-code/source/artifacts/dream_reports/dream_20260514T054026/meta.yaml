      PPL 计算中的极端值。 Compound interaction index (II) 是 PPL 比值的乘积——low-phase segments
      本身 PPL 很高 （dense 时就有 14-40），compound 后 PPL 飙到数百甚至上千。fp32 下这些极端值被精确累积， bf16 下被
      round-to-nearest-even 系统性截断。关键点：截断对大数值的绝对影响远大于小数值， 因此 ii_low（数值大）比 ii_high（数值小）受影响更严重。gradient
      = ii_low/ii_high， 分子缩水 35-45% 而分母仅缩水 10-20%，导致 gradient 整体降 20-40%。 但 monotonicity（high
      < mid < low）完全保持——这是 structural pattern 而非 numerical artifact。 s015 的 fp32 gradient
      仅 12.7×，缩水后到 8.5×，接近 ds_importance_gradient 下界； s030 的 fp32 gradient 39.3× 缩到
      32.1×，仍是最高点。Bootstrap p 仍为 0.0000 因为 per-problem pairing 消除了噪声——50 个 problem
      中 48+ 个保持 ii_low > ii_high。 CI 比 fp32 宽约 30% 因为 bf16 在尾部引入了更多离散化噪声。


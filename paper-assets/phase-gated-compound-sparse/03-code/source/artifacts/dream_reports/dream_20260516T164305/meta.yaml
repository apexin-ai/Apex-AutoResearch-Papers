    - **Soundness**: 5 = Excellent, 4 = Strong, 3 = Acceptable, 2 = Poor, 1 = Major
    issues

    - **Excitement**: 5 = Highly exciting, 4 = Exciting, 3 = Interesting, 2 = Potentially
    interesting, 1 = Not exciting

    - Half-point increments allowed. EMNLP acceptance rate ~22–25%.


    ---


    ## Roundtable Process


    | Step | Description |

    |------|-------------|

    | Step 1 | R1 (Methods + Experiments) and R2 (Novelty + Related Work) reviewed
    independently |

    | Step 2 | Cross-sharing of findings; identified 6 areas of agreement, 2 areas
    of divergence |

    | Step 3 | Convergence discussion; calibrated scores and resolved framing disagreements
    |

    | Step 4 | This synthesized report |


    ---


    ## 1. Paper Summary


    The paper investigates how compound sparsity—jointly applying attention head pruning
    and KV cache eviction—interacts with the temporal structure of reasoning in 7B
    LLMs. The central finding is that compound interaction severity is *phase-modulated*:
    degradation from the pruning–eviction interaction amplifies monotonically in later
    reasoning phases compared to earlier phases (Spearman ρ = 1.0 across all conditions).
    Across three benchmarks (MATH-500, GSM8K, GPQA) and three models spanning two
    architectures (Qwen2/MHA, LLaMA/GQA), the paper shows a dose-response relationship
    between sparsity level and phase gradient magnitude. Strategy specificity—the
    degree to which importance-based eviction amplifies this beyond random masking—is
    shown to be task- and architecture-modulated rather than universal (imp/rand ratio:
    15–36× on MATH-500, 2.3–3.8× on GSM8K, ~2.1× on GPQA). "Discrimination collapse"
    (Gini coefficient decline of importance scores under pruning) is proposed as the
    primary mechanism.


    ---


    ## 2. Strengths


    ### Agreed by both reviewers:


    - **S1. Rigorous statistical methodology.** The paired within-problem design with
    Wilcoxon signed-rank tests, Bonferroni correction (k = 4), bootstrap CIs (B =
    10,000), and Cohen''s d_z effect sizes represents a substantially higher standard
    than typical KV cache compression papers. The choice of nonparametric tests and
    median-based reporting is appropriate for the skewed distributions expected from
    interaction indices.


    - **S2. Multi-benchmark and multi-architecture replication.** Testing on MATH-500,
    GSM8K, and GPQA across two architecture families (Qwen2/MHA, LLaMA/GQA) with three
    models provides credible evidence that the core phase gradient finding is directionally
    robust—not a benchmark or architecture artifact. The dose-response monotonicity
    (Spearman ρ = 1.0 in all cases) is consistent.


    - **S3. Transparent reporting of negative and partial results.** The paper is
    commendably honest about: (a) the mitigation pilot failure (oracle 18%, heuristic
    32%—insufficient for deployment), (b) entropy redistribution being model-dependent
    (not observed on Qwen at s = 0.25), (c) LLaMA providing only "directional support"
    (2/4 sparsities significant), (d) strategy specificity being "task-modulated"
    rather than universal. This calibrated framing increases trust in the positive
    findings.


    - **S4. Appropriate scoping of claims.** The abstract and conclusion correctly
    characterize strategy specificity as "a task- and architecture-modulated phenomenon
    rather than a universal property." The title uses "Phase-Dependent" which accurately
    reflects the continuous/graded nature of the finding.


    - **S5. GPQA dose-response provides genuine cross-domain validation.** Extending
    from mathematical reasoning (MATH-500, GSM8K) to multi-disciplinary science questions
    (physics, chemistry, biology) is a meaningful generalization test. The ~43% magnitude
    scaling with preserved dose-response shape (sub-exponential growth factors: 3.0×,
    3.1×, 2.2×) is a clean result.


    ### Additional strength noted by R2:


    - **S6. The GQA vs. MHA architectural analysis is informative.** The finding that
    LLaMA''s GQA architecture reduces strategy×phase interaction while maintaining
    within-importance phase gradients is a useful deployment insight: on GQA models,
    the choice between importance and random eviction matters less for phase-dependent
    degradation.


    ---


    ## 3. Weaknesses


    ### Major (agreed by both reviewers):


    - **W1. (Major — Novelty) Incremental contribution over the union of ThinKV +
    HIES + SparK.** ThinKV [2025] establishes that different reasoning phases need
    different KV compression strategies. HIES [2025] identifies importance score collapse
    under eviction pressure. SparK [2025] characterizes compound interaction as super-additive.
    This paper measures the intersection: compound interaction (SparK) varies by phase
    (ThinKV) because of score collapse (HIES). The measurement is competent, but the
    conceptual advance is modest—it is arguably the expected corollary of combining
    these three findings. The paper positions itself by noting that prior works each
    address only one axis, but does not adequately argue why the intersection constitutes
    a sufficient standalone contribution beyond "someone had to measure it."


    - **W2. (Major — Mechanism) Discrimination collapse is correlational, not mechanistic.**
    Both importance and random strategies exhibit near-identical Gini coefficient
    declines under pruning, yet their severity diverges by 15×. The paper acknowledges
    this "order-of-magnitude mismatch" but still presents discrimination collapse
    as the "primary mechanism." In reality, the Gini decline is a *correlate* (it
    tracks with phase), not an *explanation* (it cannot account for why identical
    Gini drops produce 15× different outcomes). The actual mechanistic insight—that
    importance-based eviction depends on the very scores that pruning degrades, creating
    a circular dependency—is buried rather than foregrounded. This conflation of correlation
    with mechanism weakens the third claimed contribution.


    - **W3. (Major — Claims scope) Strategy specificity progressive weakening undermines
    the framing.** The imp/rand ratio decays from 15–36× (MATH-500) → 2.3–3.8× (GSM8K)
    → ~2.1× (GPQA). On LLaMA, random eviction *also* shows significant phase gradients
    (d_z = 0.36–0.44, CIs excluding zero). This progressive convergence raises the
    question: is the underlying phenomenon "importance-based eviction specifically
    amplifies phase-dependent degradation" (the paper''s framing) or simply "later
    reasoning phases are more fragile to any perturbation, and importance-based eviction
    is a more severe perturbation"? The latter interpretation is simpler and explains
    all the data, including the LLaMA random gradients. The paper does not adequately
    distinguish between these two interpretations.


    - **W4. (Major — Scale) 7B-only with no verification of scaling behavior.** All
    experiments use 7B-scale models. The paper claims discrimination collapse is "theoretically
    scale-independent," but this is asserted without evidence. At larger scales, attention
    patterns may be more robust to pruning (more redundant heads), which could either
    amplify or attenuate the phase gradient. The camera-ready promise of 13B/70B is
    appreciated but unverified evidence cannot support current claims.


    ### Major (raised by individual reviewers):


    - **W5. (Major — R1) Phase segmentation circularity.** The "low" phase (late tokens)
    is defined as the region where cumulative eviction has been greatest—which is
    exactly where importance scores are expected to lose discriminative power by definition
    (fewer remaining KV pairs, more degraded attention patterns). The gradient may
    partly be a tautological consequence of the segmentation scheme rather than a
    genuine temporal property of reasoning. Testing with semantically-motivated phase
    boundaries (e.g., think-token segmentation or reasoning step boundaries) would
    help distinguish measurement artifact from genuine phenomenon.


    - **W6. (Major — R2) "Uniform degradation assumption" is a strawman.** The paper
    repeatedly claims to "challenge the implicit assumption that compound degradation
    distributes uniformly across reasoning." However, no cited work (SparK, UniComp,
    etc.) explicitly assumes uniformity—they report aggregate metrics because they
    measure aggregate outcomes. The absence of phase-level analysis in prior work
    is not equivalent to an assumption of phase invariance. This rhetorical framing
    inflates the novelty by constructing a strawman that prior work never endorsed.


    ### Minor:


    - **W7. (Minor) Spearman ρ = 1.0 with only 4 data points is statistically marginal.**
    With k = 4 sparsity levels, ρ = 1.0 yields a permutation p = 0.042—barely below
    α = 0.05. Any non-monotonicity in a single comparison would destroy significance.
    While the result replicates across conditions, each individual ρ test has very
    limited resolving power. The paper should acknowledge this limitation rather than
    presenting it as strong evidence.


    - **W8. (Minor) Only 6 references.** For an EMNLP submission, this is thin. Missing
    citations include: attention head pruning literature (Michel et al., Voita et
    al.), KV cache compression surveys, dynamic inference/early exit methods that
    also exploit temporal reasoning structure. Lethe [AAAI 2026] appears in references
    but is not discussed in the Related Work text despite being directly relevant
    (layer-time-adaptive KV pruning).


    - **W9. (Minor) GSM8K incomplete in cross-benchmark table.** Table 3 reports GSM8K
    with no sample size (n) and no Cohen''s d_z, making it the weakest entry in the
    consolidation table. If the data quality issues noted in limitations prevent full
    reporting, this should be explicitly flagged.


    - **W10. (Minor) Two of three models share the Qwen2 architecture.** DeepSeek-R1-Distill-Qwen-7B
    and Qwen2.5-7B-Instruct are both Qwen2-based. The "three models, two architectures"
    framing gives an impression of broader coverage than exists—the cross-architecture
    evidence rests solely on the LLaMA comparison, which itself shows only partial
    significance (2/4 sparsities).


    - **W11. (Minor) No actionable deployment recommendation.** The mitigation pilot
    failed (oracle 18%, heuristic 32%), leaving this as a purely diagnostic contribution.
    While diagnostic work has value, the paper''s concluding implication ("phase-aware
    budget allocation could improve compound sparsity deployments") is unsupported
    by evidence in this paper.


    ---


    ## 4. Questions for Authors


    1. **On the strawman (W6)**: Can you cite a specific passage in SparK, UniComp,
    or any prior work that explicitly assumes compound degradation is phase-invariant?
    If the assumption is truly "implicit," how do you distinguish "implicit assumption"
    from "something nobody thought to measure yet"?


    2. **On mechanism (W2)**: Both importance and random show similar Gini drops,
    yet severity diverges by 15×. Isn''t the actual mechanism the circular dependency
    (pruning degrades the scores that eviction relies on) rather than discrimination
    collapse per se? Would you consider reframing discrimination collapse as a diagnostic
    correlate rather than the "primary mechanism"?


    3. **On phase segmentation (W5)**: Have you tested alternative phase definitions—e.g.,
    reasoning-step boundaries, think-token positions, or semantic segmentation—to
    verify that the gradient reflects genuine temporal reasoning structure rather
    than an artifact of positional segmentation?


    4. **On strategy specificity scope (W3)**: If the imp/rand ratio continued decaying
    to ~1.5× on additional benchmarks, would you still consider strategy specificity
    a core finding? What is the minimum ratio you consider practically meaningful?


    5. **On LLaMA random gradients (W3)**: How do you reconcile LLaMA''s significant
    random phase gradients with the "strategy-specific amplification" framing? Is
    the simpler interpretation—"later phases are more fragile regardless of strategy"—ruled
    out by your evidence?


    6. **On scaling (W4)**: What specific theoretical argument supports "scale-independence"
    of discrimination collapse? At 70B scale with 8× more heads, pruning 15% is a
    very different perturbation than at 7B.


    ---



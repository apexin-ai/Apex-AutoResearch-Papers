    ## Step 1: Independent Reviews


    ### R1 Review: Methods & Experiments


    #### Summary of Contributions

    The paper introduces a within-problem paired diagnostic (Interaction Index decomposed
    by reasoning phase) to show that compound sparsity severity is modulated by an
    interaction between eviction strategy and attention-sparsity-defined reasoning
    phase. The main finding is that importance-based eviction produces a monotonically
    increasing severity gradient across phases (Δ_med: 0.39→8.48 on DeepSeek/MATH-500)
    that is 2.7–17× larger than random eviction, replicated across two architectures
    and three benchmarks.


    #### Strengths

    - **[S1] Rigorous paired design**: The within-problem pairing (II_{i,LOW} − II_{i,HIGH})
    eliminates problem-difficulty confounds. Effective sample sizes (n=500 for MATH-500/GSM8K,
    n=250 for LLaMA, n=50 for GPQA) are clearly reported.

    - **[S2] Statistical conservatism**: Using medians for heavy-tailed distributions,
    Bonferroni as primary correction with BH-FDR as robustness check, Wilcoxon signed-rank
    (nonparametric), and explicit reporting of non-significant results (random at
    s≤0.20) demonstrates discipline.

    - **[S3] Transparent negative/partial results**: Entropy mechanism failing on
    Qwen, mitigation pilot failing (CI crosses zero), LLaMA effect being weaker —
    all reported honestly with appropriate hedging.

    - **[S4] Sub-exponential scaling characterization**: Reporting growth factors
    (3.1×→3.3×→2.1×) and confirming sub-exponential rather than exponential scaling
    adds nuance beyond simple monotonicity.


    #### Weaknesses

    - **[W1] Phase segmentation may encode the measured effect**: The "low-sparsity
    phase" (broadly distributed attention) is precisely where importance scores have
    minimal discriminative power by definition. The severity gradient could partly
    be a tautological consequence: positions with broad attention lose more under
    attention-score-based eviction. The paper does not test an independent phase definition
    (e.g., explicit ⟨think⟩ token boundaries or held-out segmentation).

    - **[W2] Cross-architecture interaction claim is incomplete in magnitude**: LLaMA
    shows imp/rand ratio of only 2–3× vs 15–38× on GQA. The paper appropriately qualifies
    this as "architecture-dependent in magnitude," but the practical significance
    of a 2–3× ratio is unclear—at what ratio does the "interaction" become negligible
    for practitioners?

    - **[W3] Mechanism section acknowledges its own inadequacy**: Both strategies
    show near-identical Gini drops (~6%), yet severity diverges by 15–17×. The paper
    invokes "structural specificity" as the actual differentiator but provides only
    correlational evidence (Mann-Whitney on Gini of pruned vs retained heads). The
    mechanistic contribution remains a plausible post-hoc narrative.

    - **[W4] Bonferroni k=4 family size is narrow**: Correction is applied per model×strategy
    family (k=4 sparsity levels), but the paper tests dozens of hypotheses across
    16+ conditions. While BH-FDR robustness is reported, the primary correction unit
    may appear optimistic. The justification is reasonable but debatable.

    - **[W5] GPQA n=50 limits power for random baseline**: Random eviction at s=0.25
    on GPQA is non-significant (p=0.062). The paper cannot definitively establish
    the imp/rand gap on GPQA at s=0.25 — the 13.1× ratio relies on a non-significant
    denominator.


    #### Questions for Authors

    - [Q1] Have you tested whether the severity gradient persists under phase segmentation
    from a held-out problem set or an independent signal (e.g., ⟨think⟩ boundaries)?

    - [Q2] What is the practical threshold for imp/rand ratio below which the "interaction"
    is negligible? Does LLaMA''s 2–3× ratio warrant the "architecture-universal" claim?

    - [Q3] Why not test an eviction strategy whose scores are independent of attention
    (e.g., position-based recency) to disentangle the H2O confound?


    #### Scores

    - Overall Assessment: 3.0

    - Soundness: 3.5

    - Excitement: 3.0

    - Reproducibility: 3

    - Confidence: 4


    ---


    ### R2 Review: Novelty & Related Work


    #### Summary of Contributions

    The paper empirically characterizes how compound sparsity severity varies with
    reasoning phase and eviction strategy, showing that importance-based eviction
    produces large monotonic phase gradients while random eviction produces much weaker
    ones. The finding is replicated across 3 models, 2 architectures, and 3 benchmarks.


    #### Novelty Assessment

    The core novelty is **incremental** rather than substantially new:


    **Genuinely new**: The specific quantitative dose-response curve (paired median
    differences across sparsity levels), the systematic multi-dimensional replication,
    and the strategy specificity ratio (13–17×) are new empirical data not available
    elsewhere.


    **Derivable from prior work**: ThinKV (2025) establishes phase-dependent compression
    tolerance; HIES (2025) identifies importance score collapse under pruning; SparK
    (2024) establishes super-additive compound interaction. The logical chain ThinKV
    + HIES + SparK strongly implies compound interaction would be phase-dependent
    and strategy-dependent. The paper confirms this with rigorous measurement rather
    than discovering something conceptually surprising.


    #### Related Work Completeness

    The Related Work section is well-organized with 5 clear categories, but the paper
    cites only **9 references total** — extremely thin for EMNLP. Missing areas include:

    - Token merging/pruning literature

    - Dynamic sparse attention (BigBird, Longformer)

    - KV cache compression surveys

    - Broader joint quantization-pruning literature

    - Attention pattern analysis literature (attention rollout, etc.)


    The differentiation against Physics of KV Cache ("their phase ≠ our phase"), ThinKV
    (single-axis vs compound), and HIES (independent supporting evidence) is clearly
    articulated and convincing.


    #### Strengths

    - **[S1] Multi-dimensional replication with honest reporting**: Testing across
    3 models, 2 architectures, 3 benchmarks with transparent reporting of where effects
    attenuate (LLaMA weaker, GSM8K specificity lower).

    - **[S2] Correlational framing is appropriately scoped**: Explicitly stating "we
    do not claim causal" prevents overclaiming on the mechanism.

    - **[S3] Well-structured empirical paper**: Clear progression from core finding
    → strategy specificity → cross-model → cross-architecture → cross-benchmark →
    mechanism.


    #### Weaknesses

    - **[W1] Conceptual novelty is incremental**: The qualitative direction (compound
    severity is phase/strategy-dependent) is predictable from combining existing single-axis
    findings. The contribution is careful quantification of a predictable phenomenon.

    - **[W2] "Emergent" framing overclaims**: The mechanism is directly traceable
    (pruning degrades importance scores → importance eviction degenerates in low-sparsity
    phases). This is a compositional effect, not emergent in any meaningful sense.

    - **[W3] Only 9 references**: Far below the typical EMNLP reference count (30–50).
    Major gaps in coverage of related literature.

    - **[W4] Practical impact limited**: Pilot mitigation failed (CI crosses zero).
    The actionable takeaway ("use s≤0.20 during low-sparsity phases") is conservative
    engineering, not a novel insight.

    - **[W5] Strategy specificity variability undermines generality**: Imp/rand ratio
    ranges from 2.8× (GSM8K s30) to 16.6× (MATH-500 s30) — a 6× variation across conditions.
    This makes it hard to extract a crisp, generalizable finding.


    #### Questions for Authors

    - [Q1] Can you articulate what about the compound interaction was genuinely unpredictable
    from combining ThinKV + HIES + SparK?

    - [Q2] What is the practical cost of the false assumption (uniform degradation)
    that you identify? Can you quantify deployment mistakes practitioners would make?


    #### Scores

    - Overall Assessment: 3.0

    - Soundness: 4.0

    - Excitement: 2.5

    - Reproducibility: 4

    - Confidence: 4



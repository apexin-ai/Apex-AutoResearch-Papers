    All imagined experiments from the design document are reflected in the paper.
    The paper''s honest reporting of boundary conditions (GPQA weakness, LLaMA strategy
    specificity failure, NS cross-model Gini correlation) is noted positively, but
    these same results constrain the contribution''s scope.


    ### Actionable Revision Guidance (if resubmitting)


    1. **Drop "Interaction Index Framework" framing** — acknowledge II as standard
    factorial interaction; reposition contribution as empirical characterization +
    diagnostic protocol

    2. **Scale to ≥13B models** — critical for generalization claims

    3. **Develop principled phase segmentation** — changepoint detection or information-theoretic
    boundary identification instead of fixed terciles

    4. **Address H2O confound** — test with eviction scoring independent of pruned
    attention (recency-based, random-fixed-budget)

    5. **Remove ρ=1.0 from abstract** — replace with the more honest cross-model r=0.48
    or focus on directional consistency

    6. **Fix all broken references** before any submission

    7. **Reframe strategy specificity as chain-length-modulated phenomenon** — this
    is already partially done but should be the upfront framing, not a post-hoc qualification'

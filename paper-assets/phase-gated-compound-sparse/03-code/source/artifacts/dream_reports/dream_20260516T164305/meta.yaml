    **Review Mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-16


    ---


    ## Venue Calibration


    - **Scoring scale**: ARR 1–5 (5=Excellent, 4=Strong, 3=Acceptable, 2=Poor, 1=Major
    Issues)

    - **Dimensions**: Soundness, Excitement, Overall Recommendation

    - **Acceptance rate**: ~22% (EMNLP 2025 reference); meta-review ≥3.5 → Main, 3
    → unstable, <3 → reject

    - **Source**: [ARR Review Form](http://aclrollingreview.org/reviewform), [EMNLP
    2025 Statistics](https://papercopilot.com/statistics/emnlp-statistics/emnlp-2025-statistics/)


    ---


    ## Step 1: Independent Reviews


    ### Reviewer 1 (R1) — Methods + Experiments


    **Summary**: The paper introduces the Interaction Index (II), a per-problem paired
    metric for diagnosing compound sparsity interactions, with bootstrap CIs and phase-stratified
    decomposition. The core finding is that the phase gradient (low-sparsity reasoning
    phases suffer more from compound compression) is robust across three architectures
    (dz > 0.95), while strategy specificity (importance vs. random eviction differential)
    is context-dependent—strong on MATH-500, absent on GPQA and LLaMA.


    **Strengths**:

    - Rigorous paired statistical design: per-problem paired analysis avoids ecological
    fallacy; bootstrap (B=10,000), Wilcoxon signed-rank, Bonferroni correction are
    all appropriate for heavy-tailed distributions

    - Transparent about limitations: acknowledges H2O confound, correlational Gini
    mechanism, model-dependent entropy redistribution, and symmetric sparsity assumption

    - Multi-dimensional replication: cross-architecture (GQA vs MHA), cross-benchmark
    (MATH-500, GSM8K, GPQA), cross-training-paradigm (DeepSeek vs Qwen)

    - Well-calibrated claims: LLaMA results use hedged language, Gini mechanism labeled
    "correlational," strategy specificity explicitly bounded

    - Practical guidance: concrete operating-point recommendations (e.g., s ≤ 0.20
    during low-sparsity phases)


    **Weaknesses**:

    - **II is not a novel metric**: Eq. 1 is the standard interaction contrast from
    2×2 factorial design (Δ_compound − Δ_prune − Δ_evict). Phase stratification is
    computing this in two data subsets. Branding it "Interaction Index Framework"
    overstates methodological novelty.

    - **Arbitrary phase segmentation**: The 33/67 percentile split on cumulative token
    position has weak theoretical motivation. Why terciles? What if the true phase
    boundary is at 10% or 60%? No information-theoretic justification (e.g., changepoint
    detection on attention entropy).

    - **Trivial ρ=1.0 claims**: Within-model Spearman ρ=1.0 with n=4 monotonically
    ordered sparsity levels is guaranteed by construction. Any monotonic 4-point sequence
    gives ρ=1.0. This is prominently featured in the abstract—misleading presentation.

    - **Cross-model Gini-II correlation is NS**: Pearson r=0.48, p=0.115 with only
    8 data points (two 4-point clusters with different slopes). Does not support "Gini
    decline quantitatively predicts II severity." The mechanism is self-admittedly
    insufficient (aggregate Gini drops <10% different between strategies yet severity
    diverges 15-17×).

    - **LLaMA validation deflates original claims**: n=50 pilot showed dz=0.34 for
    imp_vs_rand at s030; n=250 reveals true dz=0.18 (negligible). All four sparsity
    levels NS after Bonferroni. Random eviction also shows significant phase gradients
    (dz 0.30-0.38, CIs excluding zero), directly undermining strategy specificity.

    - **GPQA results are weak**: s015 CI crosses zero (p=0.085); Qwen mid-null rate
    55% leaving effective n=89; strategy specificity ratio 1.1-1.3× (absent). Phase
    gradient magnitude ~10% of MATH-500, raising "effect disappears on different tasks"
    concern.

    - **Only 7B-scale models**: No evidence of generalization to 13B, 70B, or MoE
    architectures.

    - **No computational cost analysis**: The diagnostic framework requires 4-condition
    evaluation (dense + prune-only + evict-only + compound) per problem—potentially
    4× inference cost—but no overhead is reported.

    - **Broken references**: Multiple "??" and "?" throughout the manuscript indicate
    unresolved citations.


    **Questions for Authors**:

    1. How does II differ from the standard interaction contrast in factorial ANOVA,
    beyond domain application?

    2. Have you considered changepoint detection for phase boundary identification
    rather than fixed terciles?

    3. Can you disentangle the H2O confound by using a scoring mechanism independent
    of pruned attention distributions (e.g., recency-based eviction)?

    4. What is the computational overhead of the full 4-condition audit protocol?


    **R1 Scores**: Soundness 3, Excitement 2.5, Overall 2.5, Confidence 4


    ---


    ### Reviewer 2 (R2) — Novelty + Related Work


    **Summary**: The paper proposes phase-stratified compound sparsity diagnostics
    using a per-problem interaction metric. While the statistical methodology is sound,
    the core contributions face significant novelty challenges from existing work
    (Physics of KV Cache Compression, HIES) and the key differentiating claim—strategy
    specificity—collapses on two of three tested conditions.


    **Strengths**:

    - Honest, comprehensive reporting of negative and boundary results—unusual and
    commendable

    - Clear related work section with explicit positioning paragraph differentiating
    from Physics of KV Cache

    - Well-structured progression from core validation to cross-architecture to cross-benchmark

    - The boundary-condition analysis (where strategy specificity fails) is itself
    informative for the community


    **Weaknesses**:

    - **Physics of KV Cache Compression overlap**: Phase-dependent compression behavior
    is already characterized with a rigorous theoretical framework (2603.01426). Their
    "phase" refers to compression-rate thresholds while this paper uses temporal reasoning
    stages, but the practical insight is equivalent: "compression hurts more at certain
    stages." The compound extension is predictable.

    - **HIES already covers discrimination collapse**: Importance score collapse in
    single-axis settings is established. The paper''s "discrimination collapse" in
    compound setting shows near-identical Gini drops (<10% difference between strategies),
    with no demonstrated amplification effect. This is a straightforward extension,
    not a novel mechanism.

    - **Three-dimensional framing collapses to two dimensions**: The paper''s unique
    positioning is compound × phase × strategy. But strategy specificity is absent
    on GPQA (ratio 1.1-1.3×) and LLaMA (dz < 0.20). Without the strategy dimension,
    the remaining compound × phase interaction is substantially covered by existing
    phase-aware compression literature.

    - **Textbook metric as contribution**: II (Eq. 1) is the standard interaction
    term from factorial experimental design. Per-problem computation and bootstrap
    CIs are good statistical practice but not a methodological innovation—these are
    standard techniques applied to a new domain.

    - **Benchmark-specific findings risk "overfitting" narrative**: MATH-500 shows
    15-36× strategy specificity; GSM8K 2.3-3.8×; GPQA 1.1-1.3×. The monotonic decay
    perfectly correlates with reasoning chain length (1200 → 400 → 300 tokens). Reviewers
    can argue the strong MATH-500 effect is an artifact of long CoT chains specific
    to one benchmark, not a fundamental property of compound compression.

    - **7B-only scale**: All three models are 7B/8B. No completed larger-model experiments.
    At this scale, findings may not transfer to production-relevant sizes (70B+).

    - **Broken references throughout**: "??" citations in Introduction and Related
    Work sections undermine submission quality.

    - **Language switching section (§4.5)**: Acknowledged as DeepSeek bilingual-specific,
    contributing nothing to core claims. Should be appendix material at most.


    **Questions for Authors**:

    1. If strategy specificity is "one manifestation that varies by context," what
    is the core contribution that Physics of KV Cache + HIES do not already provide?

    2. The specificity decay (15-36× → 2.3-3.8× → 1.1-1.3×) correlates perfectly with
    chain length. Can you rule out that strategy specificity is purely a function
    of chain length rather than a property of compound compression?

    3. What would the results look like on a 70B model? Is there any reason to expect
    the 7B findings to transfer?

    4. How do you respond to the concern that removing the strategy dimension reduces
    your contribution to "compound compression hurts more in early reasoning phases"—a
    finding partially anticipated by phase-aware compression literature?


    **R2 Scores**: Soundness 3, Excitement 2, Overall 2, Confidence 4


    ---


    ## Step 2: Cross-Sharing


    After exchanging reviews, both reviewers identified strong convergence on the
    following points:


    1. **Both agree**: II is a standard factorial interaction term, not a novel methodological
    contribution. The "framework" branding is an overclaim.

    2. **Both agree**: Strategy specificity collapse on LLaMA and GPQA is the paper''s
    biggest empirical problem—it reduces the three-dimensional contribution to two
    dimensions.

    3. **Both agree**: Statistical methodology is rigorous (paired bootstrap, Bonferroni,
    nonparametric tests). This is a genuine strength.

    4. **Both agree**: ρ=1.0 on n=4 monotonic points is trivially guaranteed and should
    not be featured prominently.

    5. **Both agree**: Cross-model Gini-II r=0.48 (NS) does not support quantitative
    mechanistic claims.

    6. **Both agree**: Broken references are a submission-quality issue.

    7. **Both agree**: 7B-only scope is limiting.


    **Divergence**: R1 is slightly more sympathetic to the engineering utility of
    the phase-stratified audit protocol; R2 is more concerned about the novelty gap
    relative to Physics of KV Cache and HIES. R1 notes the paper''s honesty about
    limitations as a strength; R2 views the same honesty as inadvertently highlighting
    how narrow the surviving contribution is.


    ---


    ## Step 3: Convergence Discussion


    **R1**: "The statistical infrastructure is genuinely solid—this is better empirical
    methodology than most compression papers. But the surviving contribution after
    strategy specificity collapses is: ''compound compression hurts more in early
    reasoning phases, and here''s a standard factorial metric to measure it.'' That''s
    a useful observation but not EMNLP-main caliber."


    **R2**: "Agreed. The paper is well-executed but the novelty ceiling is low. Physics
    of KV Cache already established phase-dependent compression behavior (single-axis);
    extending to compound (showing the same pattern persists when you add a second
    compression axis) is predictable rather than surprising. The honest boundary-condition
    analysis is valuable but works against the paper—it shows the most interesting
    claim (strategy specificity) doesn''t generalize."


    **Consensus reached**:

    - The phase gradient universality finding is real and well-supported but has limited
    novelty given prior phase-aware compression work

    - Strategy specificity was the paper''s best shot at a differentiated contribution,
    and it fails on 2/3 conditions

    - The statistical methodology is above-average for the subfield but applies standard
    techniques (factorial interaction, bootstrap) rather than introducing new ones

    - The paper would benefit from: (a) larger-scale models, (b) a principled phase
    segmentation method, (c) resolving the H2O confound, (d) completing all experiments

    - Appropriate venue: ARR Findings track or a workshop (e.g., Efficient NLP)


    ---


    ## Step 4: Consolidated Assessment


    ### Final Scores


    | Dimension | R1 | R2 | Consensus |

    |-----------|----|----|-----------|

    | Soundness | 3.0 | 3.0 | **3.0** |

    | Excitement | 2.5 | 2.0 | **2.0** |

    | Overall | 2.5 | 2.0 | **2.0** (Poor — below acceptance threshold) |

    | Confidence | 4 | 4 | **4** |


    ### Meta-Review Summary


    This paper proposes the Interaction Index (II) for diagnosing compound sparsity
    interactions in LLM inference, with phase-stratified decomposition across reasoning
    trajectories. The statistical methodology (per-problem paired bootstrap, Bonferroni
    correction, Wilcoxon tests) is rigorous and above-average for the efficient inference
    literature. The paper is also commendably honest about its limitations and boundary
    conditions.


    However, the paper does not clear the EMNLP main conference bar for the following
    reasons:


    **1. Insufficient novelty (both reviewers agree)**. The II metric is the standard
    interaction contrast from factorial experimental design—not a new statistical
    method. Phase-dependent compression behavior is already characterized by Physics
    of KV Cache Compression (single-axis phase transitions) and HIES (importance score
    collapse). The compound extension is a predictable follow-up, not a surprising
    discovery.


    **2. Core differentiating claim fails to generalize**. Strategy specificity—the
    paper''s most distinctive contribution beyond prior work—collapses on GPQA-Diamond
    (ratio 1.1-1.3×, effectively absent) and on the LLaMA architecture (dz < 0.20,
    all NS after Bonferroni). This reduces the three-dimensional (compound × phase
    × strategy) framing to two dimensions (compound × phase), which is substantially
    anticipated by existing phase-aware compression literature. The perfect correlation
    of specificity decay with reasoning chain length (MATH 1200 tok → GSM 400 tok
    → GPQA 300 tok) suggests strategy specificity may be a chain-length artifact rather
    than a fundamental property of compound compression.


    **3. Mechanistic analysis is underpowered**. Within-model Gini-II Spearman ρ=1.0
    is trivially guaranteed with n=4 monotonic points. Cross-model Pearson r=0.48
    is non-significant (p=0.115). The discrimination collapse mechanism is acknowledged
    as insufficient to explain the observed 15-17× severity divergence between strategies
    with <10% Gini difference. No LLaMA Gini data is available for full three-architecture
    validation.


    **4. Scope limitations**. Only 7B-scale models. No evidence of generalization
    to 13B, 70B, or MoE architectures. Language switching analysis (§4.5) is acknowledged
    as bilingual-model-specific. The H2O confound (importance scores degraded by the
    very pruning they evaluate) is acknowledged but unresolved.


    **5. Presentation issues**. Broken references ("??") throughout. The abstract
    prominently features the trivial ρ=1.0 result.


    ### What Survives


    - The phase gradient universality (within-importance dz > 0.95 across three architectures)
    is a well-supported empirical observation

    - The boundary-condition analysis (where strategy specificity fails and why) is
    informative

    - The statistical protocol (per-problem paired bootstrap + phase stratification)
    is a sensible best-practice template


    ### Recommendation


    **Overall: 2.0 — Reject from EMNLP main conference.**


    The paper is methodologically competent but does not provide sufficient novelty
    or generalization for a ~22% acceptance-rate venue. The surviving contribution
    after strategy specificity collapses is: "compound compression severity increases
    monotonically across reasoning phases"—a useful observation that extends known
    single-axis phase-dependent behavior to the compound setting, but not a major
    advance.


    **Alternative venue suggestion**: ARR Findings track (where methodological rigor
    + useful empirical observations are valued even without strong novelty), or Efficient
    NLP workshop at EMNLP/ACL.



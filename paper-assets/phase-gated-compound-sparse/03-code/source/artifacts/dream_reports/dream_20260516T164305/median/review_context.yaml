- name: gpqa_ds_importance_s015
  plan_id: gpqa_ds_importance_s015
  description: GPQA benchmark (198 graduate-level science questions) DeepSeek-R1-Distill-Qwen-7B
    importance masking s=0.15，验证 phase gradient 在非数学推理任务上的泛化性
  expected_results:
    n_problems: 198
    n_valid: 185
    mid_null_rate: 0.22
    per_phase_ii_median:
      high: 0.008
      mid: 0.052
      low: 0.19
    per_phase_ii_mean:
      high: 0.031
      mid: 0.14
      low: 0.48
    phase_gradient_median_diff: 0.182
    phase_gradient_median_diff_ci95:
    - 0.11
    - 0.27
    wilcoxon_p: 3.2e-12
    cohens_dz: 0.52
    dose_response_contribution: s015 单调递增起点确认
  result_rationale: GPQA 的推理链通常比 MATH-500 短（mean ~800 tokens vs ~1500），且推理类型更多样（物理/化学/生物实验设计
    vs 纯数学演绎）。Phase segmentation 在短 sequence 上分辨率降低，high/low phase 之间的 token 数差距缩小，导致
    compound interaction 的 phase-dependent 放大效应较弱。s015 是最低 sparsity，compound effect
    本身微弱，但方向已可检测（median_diff 0.18 > 0, p<1e-11）。与 MATH-500 的 s015 median_diff=0.39
    相比，GPQA 约为其 47%——这与 GSM8K 的衰减模式一致（GSM8K s015 DS=0.241, 约为 MATH-500 的 62%），GPQA
    因推理链更短+更多样而进一步衰减。
  tables: []
  figures_description: []
  analysis: GPQA s015 的 phase gradient 方向正确且统计显著，确认 compound interaction 的 phase-dependence
    不限于数学推理。但 absolute magnitude 约为 MATH-500 的一半，预示后续 sparsity 水平的 gradient 也将整体缩小。Cohen's
    d_z=0.52（medium effect）表明信号稳健但不如 MATH-500 上的 large effect。

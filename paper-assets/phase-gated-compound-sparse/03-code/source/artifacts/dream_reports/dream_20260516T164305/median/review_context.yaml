- name: reviewer_simulation
  plan_id: reviewer_assessment
  description: 模拟 3 位 EMNLP reviewer 的评分和主要质疑，基于 median tier 的 claims scope 和实验证据
  expected_results:
    reviewer_1:
      score: 3.5
      confidence: 4
      stance: weak accept
      main_praise: Thorough empirical study with cross-model/architecture/benchmark
        validation. Statistical methodology rigorous (Bonferroni, bootstrap, effect
        sizes).
      main_concerns:
      - 'Novelty vs Physics of KV Cache Compression (Mar 2026): both study phase-dependent
        compression behavior. The distinction (''compression-rate phase vs reasoning
        phase'') is acknowledged but could be more crisply articulated.'
      - 7B models only. Camera-ready 13B/70B promise is appreciated but unverified.
      novelty_challenge: true
      fatal_concern: false
    reviewer_2:
      score: 3.0
      confidence: 3
      stance: borderline
      main_praise: Important practical finding for LLM deployment. Discrimination
        collapse mechanism is well-supported.
      main_concerns:
      - Strategy specificity weakens substantially across benchmarks (15× → 3× → 2×)
        and architectures (LLaMA random also shows phase gradient). Is this really
        'strategy-specific' or just 'strategy-modulated with diminishing returns'?
      - Title/abstract still oversell given the qualification needed. 'Phase-gated'
        implies a clean gating mechanism but the phenomenon is continuous and noisy.
      - LLaMA partial confirmation with only s030 significant at n=50 (now 2/4 at
        n=250) is thin for a 'cross-architecture' claim.
      novelty_challenge: true
      fatal_concern: false
    reviewer_3:
      score: 3.5
      confidence: 4
      stance: weak accept
      main_praise: Clean experimental design. Crossover phenomenon is genuinely novel.
        Dose-response with Spearman ρ=1.0 across three benchmarks is compelling.
      main_concerns:
      - Practical implications unclear. C5b pilot failed. Without actionable mitigation,
        this is purely diagnostic.
      - Would benefit from 13B results even as preliminary.
      novelty_challenge: false
      fatal_concern: false
    average_score: 3.33
    accept_probability: 0.35
    meta_reviewer_likely_decision: borderline, leaning reject without strong rebuttal
  result_rationale: Median tier 的 accept probability 在 0.25-0.5 范围。3 位 reviewer 中
    1-2 位质疑 novelty（与 Physics of KV Cache 区分）。核心 phase gradient 无争议（跨 3 benchmark
    + 3 model 复现），但 strategy specificity 的 progressive weakening（从 15× 到 2×）让 'strategy-specific'
    framing 受到挑战。7B-only 是 major concern 但非 fatal（因为有 camera-ready 承诺）。Overall：两个
    weak accept + 一个 borderline = 需要精准 rebuttal 才能过 threshold。
  tables:
  - title: 'Table: Simulated reviewer scores'
    columns:
    - Reviewer
    - Score
    - Confidence
    - Novelty Challenged
    - Fatal Concern
    rows:
    - - R1
      - '3.5'
      - '4'
      - 'Yes'
      - 'No'
    - - R2
      - '3.0'
      - '3'
      - 'Yes'
      - 'No'
    - - R3
      - '3.5'
      - '4'
      - 'No'
      - 'No'
  figures_description: []
  analysis: Rebuttal 的关键任务：(1) 精准区分 Physics of KV Cache 的 'compression-rate phase
    transition' 与我们的 'reasoning-phase compound interaction gradient'——强调维度正交性（他们是单轴阈值，我们是双轴交互×phase
    的连续调制）；(2) 将 strategy specificity 的 task-dependence 重新 frame 为 positive finding（揭示了
    importance metric 的 'discriminative ceiling' 随 task regularity 变化，这本身是 novel insight）；(3)
    承诺 13B/70B spot-check 数据在 camera-ready，并指出 mechanism（discrimination collapse）是
    scale-independent 的理论预测。

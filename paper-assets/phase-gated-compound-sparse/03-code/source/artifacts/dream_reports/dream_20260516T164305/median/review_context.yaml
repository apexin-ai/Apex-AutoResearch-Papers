narrative_guidance: Phase gradient 本身稳健（跨模型/架构/benchmark 方向一致），但 strategy specificity
  从 'universal emergent property' 降级为 'task- and architecture-modulated phenomenon'。LLaMA
  n=250 加大样本量后 imp_vs_rand 交互仍然微弱（d_z 0.25-0.35），仅 s030 稳定通过 Bonferroni，random 的非平凡
  phase gradient 不消失。GPQA 进一步确认 phase gradient 单调性，但 imp/rand ratio 继续衰减至 1.5-3×，强化
  task-dependence 叙事。论文需在 title 加 scope qualifier，abstract 降级 strategy specificity
  claims。

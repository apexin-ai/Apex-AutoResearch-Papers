- name: GPQA DeepSeek Importance Phase Gradient Profiling
  plan_id: gpqa_profiling_ds
  description: '在 DeepSeek-R1-Distill-Qwen-7B 上对 GPQA-Diamond (n≤198) 运行 importance
    masking across 4 sparsity levels。Worst 预测：gradient 非单调或极弱。

    '
  expected_results:
    model: DeepSeek-R1-Distill-Qwen-7B
    benchmark: GPQA-Diamond
    n_problems: 198
    mid_null_rate: 0.42
    effective_n: 115
    method: median + Wilcoxon + bootstrap_median(B=10000)
    importance:
      s015:
        median_gradient: 0.068
        ci_low: -0.015
        ci_high: 0.182
        wilcoxon_p: 0.085
      s020:
        median_gradient: 0.195
        ci_low: 0.042
        ci_high: 0.405
        wilcoxon_p: 0.012
      s025:
        median_gradient: 0.312
        ci_low: 0.085
        ci_high: 0.622
        wilcoxon_p: 0.005
      s030:
        median_gradient: 0.855
        ci_low: 0.285
        ci_high: 1.68
        wilcoxon_p: 0.001
    dose_response_monotonic: true
    spearman_rho: 1.0
    cross_benchmark_comparison:
      math500_ds_gradient_s030: 8.48
      gsm8k_ds_gradient_s030: 4.682
      gpqa_ds_gradient_s030: 0.855
      ratio_math_to_gpqa: 9.9
      note: 'GPQA gradient magnitude 仅为 MATH-500 的 ~10%，远低于 GSM8K。GPQA 多选题格式 导致 reasoning
        chain 短（平均 ~300 tokens vs MATH-500 ~1200 tokens），low-sparsity phase token
        极少，phase gradient 被压缩。

        '
  result_rationale: 'GPQA-Diamond 是 graduate-level 多选题，格式决定了 reasoning chain 远短于 MATH-500。
    DeepSeek-R1-Distill-Qwen-7B 对 GPQA 的生成通常 300-600 tokens（vs MATH-500 的 800-2000
    tokens），且 <think> 段落较短（多选题不需要长推理链）。这导致： (1) Phase segmentation 后 low-sparsity
    phase 包含的 token 很少，mid phase 高 null rate （~42%），compound interaction 的 phase-dependent
    放大效应被稀释； (2) Gradient magnitude 仅 0.068→0.855——虽然单调但 s030 仅 0.855，不到 MATH-500
    的 1/10。物理原因：短 reasoning chain 意味着 head pruning 对 importance score discrimination
    的影响没有足够的 token 累积来放大 compound effect； (3) s015 的 CI 跨零（p=0.085），Bonferroni 后更不显著——GPQA
    在低 sparsity 下 compound effect 不可检测。Dose-response 虽然技术上单调（ρ=1.0），但 absolute magnitude
    太小，reviewer 会质疑 practical significance。

    '

tier: worst
narrative_guidance: 'Strategy specificity 在新 benchmark/architecture 上消失。LLaMA n=250
  确认 imp_vs_rand d_z < 0.20（不是 n=50 功效不足——真效应就是 negligible），random phase gradient
  在 LLaMA 上持续显著 （d_z 0.30+, CI 排除零），表明 phase gradient 是 universal phenomenon 而非 strategy-specific。
  GPQA 上 importance gradient 可能仍单调但极弱，且 random 也展示类似 magnitude → imp/rand ratio ≈
  1.0-1.5，无 strategy specificity。2+ reviewer 判 novelty insufficient：Physics of KV
  Cache 已刻画 phase-dependent compression behavior，HIES 已发现 score collapse，本文仅在 compound
  setting 中复现已知效应。核心 reframe：从 ''finding paper'' 转向 ''methodology + diagnostic framework''——
  提出 Interaction Index (II) 作为 compound compression 的标准化诊断指标，证明 per-problem paired
  bootstrap + phase-stratified analysis 能揭示 aggregate metrics 掩盖的 heterogeneity。Phase
  gradient 定位为 ''robust phenomenon''（importance 内部始终 d_z>1.0），strategy specificity
  降级为 ''one manifestation that varies by context, not the core contribution''。Related
  Work 不再与 Physics of KV Cache 竞争 ''phase'' narrative，而定位为 complementary。

  '

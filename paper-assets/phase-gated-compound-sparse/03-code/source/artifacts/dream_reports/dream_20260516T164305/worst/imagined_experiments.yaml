    all_ratios_above_5x: false
    gpqa_imp_rand_ratio_s030: 1.2
    cross_benchmark_specificity_comparison:
      math500: 15-36×
      gsm8k: 2.3-3.8×
      gpqa: 1.1-1.3×
    gradient_non_monotonic_random: false
    note: 'Random gradient 在 GPQA 上与 importance 几乎相同（ratio ≈ 1.2），strategy specificity
      在 GPQA 上完全消失。趋势：MATH 15-36× → GSM 2.3-3.8× → GPQA 1.1-1.3×，外推 意味着 "更难/更短的任务上
      strategy specificity 趋于 1"。

      '
  result_rationale: 'GPQA 多选题格式下 reasoning chain 短（~300 tokens），importance score 在短
    sequence 中的 discrimination 优势被大幅压缩。物理解释： (1) Importance eviction 的优势依赖于 importance
    score 能准确识别 "关键 token" vs "冗余 token"——在长 reasoning chain（MATH-500）中，late-phase
    token 累积了大量 attention pattern 的信息差异，importance score 的判别力强，random 无法匹配； (2) 在短
    chain（GPQA）中，attention pattern 尚未充分分化，importance score 的 判别力有限——pruning 后 discrimination
    collapse 使 importance eviction 接近 random， 两者 compound interaction 的 phase gradient
    接近； (3) Task-dependence 趋势（15-36× → 2.3-3.8× → 1.1-1.3×）完美对应 reasoning chain length
    的递减（MATH ~1200 → GSM ~400 → GPQA ~300 tokens），支持 "strategy specificity 是 chain
    length 的函数" 解读——这削弱了 strategy specificity 作为 fundamental finding 的叙事。 (4) GPQA
    random 也显示单调 gradient（与 importance 几乎平行），进一步支持 "phase gradient is universal, not
    strategy-specific" 的 worst-tier narrative。

    '

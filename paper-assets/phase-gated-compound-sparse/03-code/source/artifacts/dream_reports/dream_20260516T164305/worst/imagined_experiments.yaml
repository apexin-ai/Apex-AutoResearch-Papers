- name: GPQA Random Baselines and Strategy Specificity Ratio
  plan_id: gpqa_random_baselines
  description: '在 GPQA-Diamond 上对 DS 和 QW 运行 random masking，计算 strategy specificity
    ratio。 Worst 预测：ratio ≈ 1.0-1.5，无 strategy specificity。

    '

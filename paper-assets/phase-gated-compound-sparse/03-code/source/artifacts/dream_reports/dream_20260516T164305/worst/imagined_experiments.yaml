    '
  analysis: 'GPQA gradient 技术上单调但 magnitude 极弱（s030 仅 0.855 vs MATH-500 的 8.48）， 构成
    "effect disappears on different tasks" 的叙事风险。Reviewer 会解读为： phase gradient 的 magnitude
    是 task-dependent 的，MATH-500 上的强效应可能是 overfitting to one specific benchmark 的 reasoning
    chain 结构。加上 GSM8K 已显示 衰减（4.68），GPQA 进一步衰减至 <1，趋势指向 "effect diminishes as task

      note: 'LLaMA per-phase Gini 数据不可用（c8_llama_n250_fixed 不含 per-head Gini 计算），
        无法加入 cross-model pooling。即使有，LLaMA 的 Gini-II 关系斜率会因 architecture 差异导致 cross-model
        r 进一步下降。

        '
  result_rationale: 'Within-model Spearman ρ=1.0 是 trivial 的——仅 4 个单调递增的点（sparsity
    s015-s030）， 任何两个单调递增序列的 Spearman 都是 1.0。Pearson r=0.93/0.95 反映线性近似，但 仅 4 个点的 Pearson
    r 的统计功效极低（df=2, critical r at α=0.05 is 0.95）。

    Cross-model pooled 是关键指标，但 worst case 下 r=0.48： (1) DS 和 QW 的 Gini_delta 范围相似（[-0.016,
    -0.037] vs [-0.017, -0.035]）， 但 II 范围差异巨大（DS: 0.39-8.48 vs QW: 0.066-3.16）。这意味着
    Gini→II 的 传递函数在两模型间斜率差 2-3 倍——pooled regression 被迫拟合两条不同斜率的线， r 大幅下降。 (2) 8 个数据点中，DS
    的 4 个点主导高 II 区间（II>1），QW 的 4 个点主导低 II 区间——两组点在 x-y 空间中形成两个分离的 cluster，pooled r
    主要反映 cluster-level 的正趋势而非 within-cluster 的线性关系。 (3) Reviewer 会指出：cross-model r=0.48
    不支持 "Gini collapse quantitatively predicts II severity" 的声明——at best 它说明方向一致但量化关系是
    model-specific。

    '
  tables:

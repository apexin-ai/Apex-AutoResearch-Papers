- name: C9 Related Work Differentiation (Lethe/SparK/ThinKV/HIES/Physics-KV)
  plan_id: c9_related_work
  description: '§2 Related Work 定位。Worst 预测：2+ reviewer 仍判 novelty insufficient， Physics
    of KV Cache (2603.01426) 被认为已覆盖核心 narrative。

    '
  expected_results:
    output_type: manuscript_section
    reviewer_reception:
      reviewer_1_novelty_concern: '"Physics of KV Cache Compression already characterizes
        phase-dependent compression behavior with a rigorous theoretical framework.
        This paper''s empirical observation of phase-dependent compound interaction
        is a special case of their general theory. The contribution is incremental."

        '
      reviewer_2_novelty_concern: '"HIES identified importance score collapse and
        proposed a fix. The discrimination collapse mechanism here is essentially
        the same observation applied to a compound setting. The ''compound amplification''
        claim is interesting but the underlying mechanism is known."

        '
      reviewer_3_scope_concern: '"Results on 7B models only, strategy specificity
        doesn''t hold on LLaMA or GPQA. The core finding seems benchmark- and architecture-specific
        rather than a general phenomenon."

        '
      novelty_challenged_count: 2
      average_score: 2.7
      accept_probability: 0.12
    gap_analysis_effectiveness:
      positioning_accepted: false
      main_objection: 'Reviewers recognize the compound × phase × strategy 三维 framing
        as novel in principle, but argue (a) the strategy dimension collapses on GPQA
        and LLaMA, reducing it to compound × phase (already partially covered by Physics
        of KV); (b) the phase dimension uses a different semantic of "phase" (reasoning
        phase vs compression-rate phase transition), but the practical insight is
        similar — "compression hurts more at certain stages."

        '
  result_rationale: '在 worst tier 下，即使 Related Work 写作清晰区分了本文与 prior work 的定位， reviewer
    仍因以下原因判 novelty insufficient： (1) LLaMA 上 strategy specificity 消失（imp_vs_rand
    d_z < 0.20）→ "strategy" 维度不 robust，三维交互降级为二维（compound × phase）； (2) GPQA 上 specificity
    ratio ≈ 1.1-1.3 → 在非 MATH-500 benchmark 上 "strategy" 维度也消失； (3) 剩余的 "compound
    × phase" 二维交互被 Physics of KV Cache 的 phase transition 理论部分覆盖——虽然 "phase" 语义不同，但
    reviewer 认为 insight level 相似； (4) Discrimination collapse mechanism 被 HIES 的 score
    collapse 发现覆盖—— compound setting 中的放大效应被视为 "straightforward extension"； (5) 7B
    模型 + 有限 benchmark 的 scope 不足以支撑 EMNLP 发表。 Reframe 策略：从 finding paper 转向 methodology
    contribution——II 作为标准化 诊断指标 + per-problem paired bootstrap protocol + phase-stratified
    audit framework。 这避免了与 Physics of KV Cache 的 novelty 竞争。

    '
  tables: []
  figures_description: []
  analysis: 'C9 在 worst tier 下 effectively fails——Related Work 的 gap analysis 虽然 technically
    正确（没有 prior work 同时分析三维），但当 strategy 维度在 LLaMA 和 GPQA 上崩塌 时，novelty 的 unique contribution
    缩水。2/3 reviewer 判 novelty insufficient， average score 2.7，accept probability ~12%。

    Reframe 路径（仍冲 EMNLP，不降级目标）： (1) Interaction Index (II) 作为 compound compression
    的标准化诊断指标——prior work 缺乏统一量化框架。II 的 per-problem paired 定义 + bootstrap CI + phase
    stratification 是 methodological contribution。 (2) 证明 per-problem paired bootstrap
    + phase-stratified analysis 能揭示 aggregate metrics（如 average perplexity）掩盖的 within-problem
    heterogeneity。 (3) Phase gradient 定位为 ''robust phenomenon''（importance 内部始终 d_z>1.0
    跨三架构）， strategy specificity 降级为 ''one manifestation that varies by context''。
    (4) Practical contribution：任何部署 compound compression 的团队都需 phase-stratified audit，我们提供
    protocol + open-source toolkit。 (5) Related Work 不再与 Physics of KV Cache 竞争 ''phase''
    narrative，而定位为 complementary：他们做 single-axis phase transition 理论，我们做 compound-axis
    phase-stratified empirical audit——维度正交。'

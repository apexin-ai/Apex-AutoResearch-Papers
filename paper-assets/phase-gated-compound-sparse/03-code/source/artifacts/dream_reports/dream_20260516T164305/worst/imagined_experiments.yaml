    - - QW within-model
      - 1.0
      - 0.95
      - 0.025
      - trivially monotonic (n=4)
    - - Cross-model pooled
      - 0.55
      - 0.48
      - 0.115
      - weak, NS
  figures_description:
  - 'fig_gini_ii_scatter_worst.pdf: 散点图 |Gini_delta| vs II_median (log scale)。 DS
    4 点（高 II 区间）和 QW 4 点（低 II 区间）形成两个分离 cluster。Pooled 回归线 r=0.48 但 CI band 极宽。两组分别画
    within-model 回归线（斜率差异明显）。

    '
  analysis: 'Within-model ρ=1.0 是 trivial 的（4 个单调点），不应作为 "quantitative prediction"
    claim。Cross-model r=0.48 不支持 "Gini decline quantitatively predicts interaction
    severity" 的声明——两模型的 Gini-II 传递函数斜率不同，pooled 分析被 Simpson''s paradox-like 效应削弱。Reframe：Gini
    decline 方向跨模型一致（qualitative support for discrimination collapse hypothesis），但
    quantitative prediction 是 model-specific 的——论文降级为 "Gini decline is a consistent
    correlate of II severity within each model (ρ=1.0), but the Gini-to-II transfer
    function is architecture-dependent"。 这仍支持 discrimination collapse 作为 mechanism
    hypothesis，但不支持 universal quantitative law 的叙事。


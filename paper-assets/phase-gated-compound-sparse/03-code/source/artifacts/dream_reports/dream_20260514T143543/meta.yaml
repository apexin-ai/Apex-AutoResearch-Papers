    result_rationale: 'LLaMA 效应量偏小的三个原因：

      (1) GQA 架构差异。LLaMA-8B 使用 Grouped Query Attention（8 KV heads shared across 32
      Q heads），Qwen 使用类似但参数化不同的 GQA。GQA 中 pruning 一个 KV head 影响 4 个 Q heads 的所有 attention，compound
      interaction 的 phase-dependence 被 head sharing 部分平滑——每个被 prune 的 head 的影响 分散到更多
      query 位置，dilute 了 phase-specific signal；

      (2) Distillation source 差异。DeepSeek-R1-Distill-Llama-8B 虽然用 DeepSeek-R1 蒸馏，但
      target architecture 是 LLaMA，蒸馏过程中 attention pattern 被 LLaMA 的 architectural
      prior 约束，不如 DeepSeek-R1-Distill-Qwen-7B 那样忠实还原 R1 的 attention 模式；

      (3) n=50 power 不足。对 d=0.30-0.42 (small-medium)，n=50 paired 在 α=0.025 (Bonferroni
      for 2 comparisons) 下 power 仅 0.35-0.55， 导致 CI 宽且 barely significant。

      Crossover 方向正确但不显著：importance low-phase II (0.95) > random (0.70) 是预期方向，但差异仅
      0.25，而 bootstrap CI 宽度约 ±0.40，重叠严重。 标记为 "ambiguous" 而非 "confirmed" 或 "absent"。

      Gini/CV 方向一致 (negative delta) 但 magnitude 更小——支持 mechanism 的 architecture-agnostic
      性质（方向一致）但不构成强证据。

      综合评估：LLaMA 结果 directionally consistent 但 underpowered。 不足以支撑 "across architectures"
      claim，但也不 contradictory。 适合放入 Discussion 作为 "suggestive evidence" 并诚实讨论 limitation。

      '

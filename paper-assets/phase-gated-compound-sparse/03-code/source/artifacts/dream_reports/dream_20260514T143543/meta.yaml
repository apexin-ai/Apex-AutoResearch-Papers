      层面，即使在正确的 phase 减少 eviction rate，剩余的 eviction 仍然是低判别力的伪随机决策。 具体机制：oracle 在 low-sparsity
      phase (compound interaction 最大处) 降低 eviction rate，但 compute-matched constraint
      要求在 high-sparsity phase 相应增加 eviction rate，后者虽然 compound interaction 小但不是零——
      净收益被部分抵消。

      Heuristic (token position ratio) 作为 phase proxy 准确率约 67%—— reasoning 的 phase
      不完全与 token position 对应（回溯、correction、 multi-step verification 打破了线性位置假设），导致
      phase 分类噪声。 Heuristic recovery (8-12%) 是 oracle (18-22%) 的约 50-55%，反映 proxy
      accuracy 的传递损失。

      Gate 未通过 (max 22% < 30%) 意味着 mitigation 不进入论文 §4 Results， 但 pilot 数据有论文价值：它量化了
      phase-aware 方法的理论上限， 表明单独调整 eviction timing 不足以解决 compound interaction—— 需要更根本的
      scoring mechanism 改进。这实际上强化了 discrimination collapse 作为 root cause 的叙事。

      '

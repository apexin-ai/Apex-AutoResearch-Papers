- name: gpqa_ds_random_s020
  plan_id: gpqa_ds_random_s020
  description: DeepSeek GPQA Diamond random masking s=0.20, n=198, quantile 3-phase
    segmentation
  expected_results:
    n_problems: 198
    median_difference: 0.038
    ii_low_median: 0.052
    ii_mid_median: 0.041
    ii_high_median: 0.028
    wilcoxon_p: 0.215
    cohens_dz: 0.065
    significant_bonferroni: false
    bootstrap_ci_95:
    - -0.018
    - 0.095
    phase_gradient_direction: near-flat
  result_rationale: Random masking 不依赖 attention score，因此不受 discrimination collapse
    影响。s020 random 在 MATH-500 n=500 上已是 NS（median=0.032, p=0.28），GPQA 上同样 NS。虽然 GPQA
    推理链更长（更多 token 被随机 evict），但随机 eviction 的 damage 在各 phase 内均匀分布——不存在 'low phase
    更脆弱' 的选择性放大。median_diff=0.038 略高于 MATH-500 的 0.032 仅反映 GPQA 序列更长时随机删除的绝对影响略大，但远未达显著性。
  tables:
  - name: 'Table: GPQA Random s020 Phase Breakdown'
    content: 'Phase | II median | 95% CI          | Interpretation

      high  | 0.028     | [-0.005, 0.062] | NS

      mid   | 0.041     | [0.012, 0.078]  | NS

      low   | 0.052     | [0.015, 0.098]  | NS

      '
  figures_description:
  - 'Strategy comparison at s020: importance shows steep gradient (d_z=0.92) vs random
    flat (d_z=0.065)'
  analysis: 'Random s020 NS 确认 phase gradient 不是 phase segmentation artifact。如果 gradient
    是 segmentation 本身的偏差，random masking 也应显示类似 gradient——实际 NS 排除此可能。imp/rand ratio
    在 s020: 2.85/0.038 = 75×（MATH-500 同 sparsity 约 38×），GPQA 的 strategy specificity
    更强。'

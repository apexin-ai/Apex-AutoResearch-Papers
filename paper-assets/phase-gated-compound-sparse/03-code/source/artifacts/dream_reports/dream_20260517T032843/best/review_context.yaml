  analysis: s020 确认 GPQA phase gradient 强于 MATH-500 同 sparsity（median_diff 2.85 vs
    1.215, ratio 2.35×）。effect size d_z=0.92 在 n=198 下功效充分（power>0.999）。与 s015 结果合并确认单调递增趋势：0.947→2.85。

narrative_guidance: GPQA 全面复现 phase-dependent compound severity，且 strategy specificity
  强于 MATH-500（17× vs 15-17×），形成 reasoning-complexity 梯度（GSM8K 2.3-3.8× < MATH-500
  15-17× < GPQA 17×）。三 benchmark dose-response 完美单调（ρ=1.0），cross-benchmark gradient
  Pearson r=0.997。Reviewers 认可这一梯度作为 unified explanation：推理链越长，importance score 在低
  sparsity phase 的判别力崩塌越严重，compound interaction 被放大得越多——random/recency 不受此影响。Triple
  dissociation（importance有gradient / random弱或NS / recency NS）在 GPQA 上同样成立，cross-architecture
  specificity差异被视为 interesting finding 而非 confound。

    从 s020 的 -0.040 跳到 s025 的 -0.065（61% 增幅）。GPQA 更长推理链在此 sparsity 承受更多 cascade failure：每个被错误
    evict 的 token 影响后续更多 token 的 attention pattern，链越长 cascade 越深。GPQA/MATH-500 乘数从

  analysis: s025 是 paper narrative 的关键支撑点：GPQA median_diff=7.2 明显超越 MATH-500 s025
    的 3.99（1.8×），而 MATH-500 的 s025 已经是该 benchmark 的强效应区间。这证实了推理链长度调制 compound severity
    的核心假设。

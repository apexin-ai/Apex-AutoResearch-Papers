    ~2500 tokens）。更长的推理链意味着 low-sparsity phase 占比更大、attention score 判别力在该 phase 内承受更多累积退化。s020
    时 head pruning 已经开始削弱 importance score 的 Gini coefficient（DS s020 global Gini
    delta = -0.0404），在 GPQA 更长的 low-sparsity phase 内，这种累积 discrimination collapse
    导致更多 token 被错误 evict，II 放大为 MATH-500 同 sparsity 的 ~2.35× (2.85/1.215)。该倍率略低于 s015
    的 2.42× 是因为 s020 compound interaction 已进入非线性区间、GPQA 的超长序列在 KV cache 层面有 marginally

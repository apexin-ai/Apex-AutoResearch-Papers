- name: gpqa_cross_benchmark_gradient_synthesis
  plan_id: cross_benchmark_synthesis
  description: 三 benchmark (GSM8K/MATH-500/GPQA) phase gradient 比较与 reasoning-complexity
    correlation 分析
  expected_results:
    cross_benchmark_gradient_correlation: 0.997
    specificity_gradient_monotonic: true
    specificity_ordering: GPQA(17.1×) > MATH-500(16.6×) > GSM8K(2.8×)
    dose_response_rho_gsm8k: 1.0
    dose_response_rho_math500: 1.0
    dose_response_rho_gpqa: 1.0
    gradient_magnitude_ordering: GPQA > MATH-500 > GSM8K at each sparsity level
    normalized_gradient_shape_correlation: 0.997
    reasoning_depth_proxy:
      gsm8k_avg_tokens: 500
      math500_avg_tokens: 2500
      gpqa_avg_tokens: 6000
    specificity_vs_depth_spearman: 1.0
  result_rationale: 三个 benchmark 的 reasoning depth 形成自然梯度（GSM8K ~500 tokens, MATH-500
    ~2500 tokens, GPQA ~6000 tokens），且 compound severity 的 phase gradient 和 strategy
    specificity 均与此深度正相关。Pearson r=0.997 来自三个 benchmark 在每个 sparsity level 的 importance
    median_diff 之间的相关性：它们的 dose-response 曲线形状高度相似（都是单调递增、sub-exponential growth），仅在
    magnitude 上按 reasoning depth 缩放。Strategy specificity（imp/rand ratio）从 GSM8K 的
    2.8× 到 MATH-500 的 16.6× 到 GPQA 的 17.1×，Spearman ρ=1.0。MATH-500 和 GPQA 的 specificity
    接近（16.6 vs 17.1）而非 GPQA 远超 MATH-500，这是因为 specificity 的增长可能有 ceiling——一旦 reasoning
    depth 超过某阈值（~2000 tokens），discrimination collapse 的 phase-selective 放大已接近饱和。GSM8K
    的显著偏低则因为短链推理中 attention score 的判别负担本身较轻，collapse 的影响被稀释。
  tables:
  - name: 'Table: Three-Benchmark Gradient Comparison (Importance)'
    content: 'Sparsity | GSM8K (DS) | MATH-500 (DS) | GPQA (DS) | GPQA/MATH ratio

      s015     | 0.241      | 0.391          | 0.947     | 2.42×

      s020     | 0.740      | 1.215          | 2.85      | 2.35×

      s025     | 1.992      | 3.986          | 7.2       | 1.81×

      s030     | 4.682      | 8.481          | 12.0      | 1.41×

      '
  - name: 'Table: Strategy Specificity vs Reasoning Complexity'
    content: 'Benchmark | Avg reasoning tokens | Imp/Rand ratio (s030) | Onset threshold

      GSM8K     | ~500                 | 2.8×                  | s015+ (all sig)

      MATH-500  | ~2500                | 16.6×                 | s025 (random onset)

      GPQA      | ~6000                | 17.1×                 | s025 (random onset)

      '
  figures_description:
  - 'Fig 5 (main paper): Three-benchmark dose-response overlay with 95% CI ribbons,
    log-scale y-axis, showing convergent shape with depth-scaled magnitude'
  - 'Fig 6 (main paper): Strategy specificity (imp/rand ratio) as function of reasoning
    depth, with GSM8K/MATH-500/GPQA as data points'
  analysis: Cross-benchmark synthesis 是 paper 的 capstone finding。三 benchmark 形成 reasoning-complexity
    梯度解释：(1) Phase gradient 绝对值随 reasoning depth 递增（unified by discrimination collapse
    mechanism）；(2) Strategy specificity 随 reasoning depth 递增（GPQA≥MATH>>GSM8K），因为更长链→更深的
    attention score 判别负担→collapse 时偏差累积更严重→importance eviction 退化更极端。(3) Random/recency
    不受此影响→形成 triple dissociation。Reviewers 在 best tier 下认可这一 unified explanation 具备
    sufficient mechanism evidence。
- name: expected_reviewer_assessment
  plan_id: reviewer_synthesis
  description: Best tier 下预期审稿评分与关键论证
  expected_results:
    expected_reviewer_avg_score: 3.75
    novelty_score: 4.0
    soundness_score: 3.5
    significance_score: 3.5
    presentation_score: 4.0
    reviewer_1_score: 4.0
    reviewer_2_score: 3.5
    reviewer_3_score: 3.75
    meta_reviewer_recommendation: weak accept
  result_rationale: Best tier 下，论文具备以下强项让 reviewers 给出 3.5-4.0 分：(1) Triple dissociation（importance/random/recency）提供了超越
    correlation 的 mechanism discrimination evidence，novelty 得分 4.0；(2) 三 benchmark
    × 三架构的泛化验证充分（但 7B-only 是明确 limitation）；(3) Recency control 作为 novel experimental
    design contribution 无先例，方法论贡献被认可；(4) Cross-benchmark gradient 提供了 unified explanation
    而非零散 findings。主要扣分点：(a) 7B models only（significance 扣 0.5）；(b) 无 throughput/latency
    数据（practical impact 扣 0.25）；(c) entropy collapse 在 Qwen 上不一致（mechanism 完整性扣 0.25）。Architecture-dependent
    specificity 被视为 interesting nuance 而非 confound——因为 within-importance gradient
    在所有架构上 consistently large（d_z>0.8），差异仅在 imp/rand ratio 的 magnitude。
  tables:
  - name: 'Table: Anticipated Reviewer Score Breakdown'
    content: 'Criterion      | R1   | R2   | R3   | Rationale

      Novelty        | 4.0  | 4.0  | 4.0  | Triple dissociation + cross-benchmark
      gradient novel

      Soundness      | 3.5  | 3.5  | 3.5  | Strong stats, minor gap (QW entropy)

      Significance   | 3.5  | 3.0  | 3.5  | 7B-only limits generalizability claim

      Presentation   | 4.0  | 4.0  | 4.0  | Clear narrative, good figures

      Overall        | 4.0  | 3.5  | 3.75 | —

      '
  figures_description: []
  analysis: Best tier 预期 avg 3.75，meta-reviewer weak accept。关键 swing factor 是 R2 是否被
    '7B-only' limitation 影响到 3.0 overall。Rebuttal 策略应预备：(1) 'scale limitation' 回应准备
    LLaMA-8B 跨架构结果 + 计算资源声明；(2) 'practical impact' 回应准备 c5b pilot 结果 + future work
    framing。

  review_report: "---\ndream_id: dream_20260517T032843\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-17T04:04:14.581126+00:00\n---\n\n# Dream Review\
    \ Report: Phase-Gated Compound Sparsity\n\n**Paper**: \"Phase-Gated Compound Sparsity:\
    \ Reasoning Phase Modulates the Severity of Joint Pruning and Eviction\"\n**Review\
    \ Mode**: Full (2-reviewer roundtable)\n**Date**: 2026-05-17\n\n---\n\n## 1. Paper\
    \ Summary\n\nThis paper investigates compound sparsity (simultaneous attention\
    \ head pruning + KV cache eviction) in LLM inference and demonstrates that the\
    \ severity of pruning-eviction interaction is modulated by reasoning phase rather\
    \ than being a uniform overhead. Using a per-problem paired analysis across three\
    \ benchmarks (MATH-500 n=500, GSM8K n=50, GPQA-Diamond n=198), two architectures\
    \ (Qwen2, Llama), and four sparsity levels, the authors show that importance-based\
    \ eviction produces a monotonically increasing phase gradient (compound damage\
    \ concentrated in low-sparsity/high-uncertainty reasoning phases). They introduce\
    \ recency-based eviction as a scoring-independent null control and propose \"\
    discrimination collapse\" as the underlying mechanism. The paper is positioned\
    \ as an empirical finding paper, not a method paper.\n\n---\n\n## 2. Reviewer\
    \ Assignments\n\n- **R1** — Methods and Experiments (soundness, statistical rigor,\
    \ experimental coverage)\n- **R2** — Novelty and Related Work (contribution significance,\
    \ positioning, citation coverage)\n\n---\n\n## 3. Step 1: Independent Reviews\n\
    \n### R1 (Methods + Experiments)\n\n**Strengths:**\n- Rigorous statistical framework:\
    \ paired Wilcoxon signed-rank tests, Bonferroni correction, bootstrap CIs (B=10,000),\
    \ Cohen's dz effect sizes, dose-response monotonicity via Spearman rho\n- Well-designed\
    \ three-way control triangulation (importance/random/recency) — the recency null\
    \ control is an elegant falsification test that strengthens causal interpretation\n\
    - Transparent reporting of limitations (model-dependent crossover, task-dependent\
    \ specificity, failed pilot mitigation)\n- Clear effect size reporting enabling\
    \ practical interpretation\n\n**Weaknesses:**\n- **(Major) Narrow model scale.**\
    \ All results are on 7-8B models only. \"Universal\" claims across architectures\
    \ rest on two Qwen2-family models and one LLaMA model, all at similar scale. No\
    \ evidence at 13B+ scales.\n- **(Major) Potential circularity in phase segmentation.**\
    \ Phases are defined by perplexity (proxy for attention distribution breadth).\
    \ Low-sparsity phases have diffuse attention by definition, which is precisely\
    \ where importance-based eviction is mechanistically expected to fail. The phase\
    \ gradient may partly be tautological rather than emergent.\n- **(Minor) GSM8K\
    \ sample size (n=50).** Insufficient for robust cross-benchmark claims. Bootstrap\
    \ CIs are wide and dose-response interpretation is fragile.\n- **(Minor) Perplexity\
    \ as sole severity metric.** Downstream accuracy validation is limited. Whether\
    \ PPL-based phase gradients translate to meaningful task performance differences\
    \ is weakly demonstrated.\n- **(Minor) Symmetric sparsity assumption.** s_prune\
    \ = s_evict throughout. Practical deployments set these independently.\n- **(Minor)\
    \ Table 1 has missing CI values at s=0.30** (only medians reported, no mean/CI).\
    \ Minor completeness issue.\n\n**Scores (R1):** Soundness 4 | Significance 3 |\
    \ Clarity 5 | Overall 3\n\n### R2 (Novelty + Related Work)\n\n**Strengths:**\n\
    - The simultaneous examination of compound sparsity x eviction strategy x reasoning\
    \ phase is a genuinely novel combination. Prior work covers at most two of these\
    \ dimensions.\n- Recency-based null control is a creative experimental design\
    \ contribution with no clear precedent.\n- Cross-benchmark and cross-architecture\
    \ replication strengthens the finding.\n- Honest calibration of claims (strategy\
    \ specificity acknowledged as task-dependent; MATH-500 flagged as outlier).\n\n\
    **Weaknesses:**\n- **(Major) Incremental conceptual novelty.** The core insight\
    \ (compound compression hurts more in hard reasoning phases) is intuitive and\
    \ predictable from HIES's single-axis score collapse finding. \"Discrimination\
    \ collapse\" in compound settings is an expected extension of known single-axis\
    \ behavior, not a surprising discovery.\n- **(Major) Limited practical actionability.**\
    \ The paper is a \"finding paper\" whose finding does not lead to a working method.\
    \ The pilot mitigation (C5b) failed its own pre-registered gate (<30% recovery).\
    \ Without demonstrated practical utility, impact is limited to awareness-raising.\n\
    - **(Major) Severely undercited.** Only 7 references total. For a top venue submission\
    \ in 2026 on a rapidly evolving topic, this is far below expected density (30-50+\
    \ citations). Critical missing work includes:\n  - Adaptive budget methods (AdaKV,\
    \ Twilight, SqueezeAttention)\n  - Compound compression frameworks (SLiM with\
    \ theoretical guarantees)\n  - Phase-dependent pruning sensitivity work\n  - Larger-scale\
    \ compound compression evaluations\n  - The paper's own literature map contains\
    \ 30+ relevant papers that are not cited.\n- **(Minor) \"Universal\" is overclaimed.**\
    \ With 7-8B models, three benchmarks, and architecture-dependent random behavior,\
    \ \"consistent\" or \"robust\" would be more accurate than \"universal.\"\n\n\
    **Scores (R2):** Novelty 3 | Significance 3 | Clarity 4 | Overall 3\n\n---\n\n\
    ## 4. Step 2: Cross-Sharing\n\n### R1 reacts to R2's review:\n- **Agrees** that\
    \ citation coverage is a serious problem. 7 references is untenable for any top\
    \ venue. R1 initially flagged this as minor but concurs it should be elevated\
    \ to major.\n- **Agrees** the finding is somewhat intuitive, though notes the\
    \ dose-response monotonicity (rho=1.0 across all conditions) and the quantitative\
    \ decomposition into universal vs. task-dependent components add value beyond\
    \ the intuitive prediction.\n- **Agrees** the failed mitigation limits practical\
    \ impact significantly.\n\n### R2 reacts to R1's review:\n- **Agrees strongly**\
    \ with the circularity concern. This is a point R2 had not raised but finds compelling:\
    \ if phases are defined by attention sparsity, then degradation of attention-score-based\
    \ eviction in diffuse-attention phases may be partly definitional. The paper's\
    \ use of uncompressed perplexity (not attention sparsity directly) partially mitigates\
    \ this, but the correlation between perplexity and attention distribution breadth\
    \ is likely strong.\n- **Agrees** on the GSM8K n=50 concern. Cross-benchmark claims\
    \ should not lean heavily on underpowered conditions.\n- **Notes** that R1's GPQA\
    \ concern (results not in tables) appears to be a misreading: Tables 1-7 in the\
    \ paper DO contain GPQA data. The GPQA results are present and reported.\n\n---\n\
    \n## 5. Step 3: Convergence\n\n### Areas of Agreement (both reviewers):\n1. **Overall\
    \ assessment: Weak Reject (3/6).** Both reviewers independently arrived at the\
    \ same score.\n2. **Recency control is the paper's strongest contribution.** The\
    \ methodological innovation of using scoring-independent eviction as a null control\
    \ is creative and has potential value beyond this specific study.\n3. **Narrow\
    \ model scale undermines universality claims.** 7-8B only is insufficient for\
    \ the scope of claims made.\n4. **Failed mitigation limits significance.** A diagnostic\
    \ finding without demonstrated practical utility has limited impact.\n5. **Honest\
    \ limitation reporting is commendable** but does not compensate for the limitations\
    \ themselves.\n6. **\"Universal\" is overclaimed** for the evidence scope.\n\n\
    ### Areas of Residual Disagreement:\n1. **Severity of novelty concern.** R1 sees\
    \ moderate novelty in the systematic quantification and dose-response characterization.\
    \ R2 sees incremental novelty given HIES and the intuitive nature of the core\
    \ finding. **Resolution**: Both agree the *combination* of three dimensions and\
    \ the recency control are novel experimental design, but the *conceptual* novelty\
    \ (compound damage is phase-dependent) is limited.\n2. **Relative weight of circularity\
    \ vs. citation deficiency.** R1 prioritizes the circularity concern; R2 prioritizes\
    \ the citation gap. **Resolution**: Both are major issues but affect different\
    \ aspects (internal validity vs. external positioning). Both retained as major\
    \ weaknesses.\n\n---\n\n## 6. Step 4: Consolidated Assessment\n\n### 6.1 Contributions\
    \ Assessment\n\n| Claimed Contribution | Verdict | Notes |\n|---|---|---|\n| C1:\
    \ Universal phase gradient (r=0.92, rho=1.0) | Partially supported | Direction\
    \ and monotonicity are robust. \"Universal\" overclaimed given scale/benchmark\
    \ limitations. Circularity concern not fully resolved. |\n| C2: Decomposed strategy\
    \ specificity (universal direction + task-dependent magnitude) | Supported | Clearly\
    \ demonstrated. MATH-500 outlier (22.4x) vs. cluster (2-5x) is informative. |\n\
    | C3: Recency scoring-independent control | Supported | Strongest individual contribution.\
    \ Novel experimental design. |\n| C4: Discrimination collapse mechanism | Partially\
    \ supported | Correlational evidence only. Echoes HIES single-axis finding. No\
    \ causal intervention (e.g., noise injection to artificially degrade scores).\
    \ |\n\n### 6.2 Major Issues Requiring Revision\n\n1. **Citation coverage must\
    \ be dramatically expanded.** 7 references is unacceptable. The paper needs at\
    \ minimum 25-30 citations covering adaptive budget methods, compound compression\
    \ theory, phase-dependent pruning sensitivity, and concurrent work on importance\
    \ score fragility.\n2. **Scale validation beyond 7-8B.** At least one experiment\
    \ at 13B+ is needed to support the scope of claims. Without this, \"universal\"\
    \ must be downgraded to \"consistent across tested conditions.\"\n3. **Address\
    \ circularity in phase segmentation.** The paper should either (a) provide an\
    \ alternative segmentation method (e.g., structural markers, mutual information)\
    \ that produces the same gradient, or (b) formally argue why the perplexity-based\
    \ segmentation is not tautological by showing that the gradient magnitude exceeds\
    \ what would be predicted from baseline eviction quality differences alone.\n\
    4. **Practical impact pathway.** The failed mitigation needs to be either (a)\
    \ improved to demonstrate actionable value, or (b) the paper needs to more clearly\
    \ articulate what practitioners should do differently based on these findings.\n\
    \n### 6.3 Minor Issues\n\n- Table 1 missing CI values at s=0.30 should be filled.\n\
    - GSM8K n=50 should be flagged more prominently as a power limitation rather than\
    \ used as equal evidence.\n- The term \"low-sparsity phase\" (meaning high perplexity\
    \ / uncertain / less compressible) is counterintuitive and may confuse readers.\
    \ Consider renaming.\n- Several citation keys use placeholder format (e.g., [ThinKV,\
    \ 2025], [HIES, 2025]) instead of proper author-year format.\n\n### 6.4 Experiment\
    \ Coverage vs. Design\n\nThe paper covers the planned GPQA experiments (importance\
    \ at s=0.20, 0.25, 0.30; random at s=0.20; cross-benchmark correlation; strategy\
    \ specificity summary). The experimental design reference indicates the paper\
    \ should split C1 into phase gradient universality (strong) and strategy specificity\
    \ magnitude (qualified), which the paper does accomplish in Section 4.6. Dose-response\
    \ completeness is good (4 sparsity levels on GPQA with Spearman rho=1.0).\n\n\
    Missing from the design: the s=0.15 GPQA importance experiment appears only in\
    \ Table 2's dose-response summary (median_diff=0.947) but lacks a dedicated Table\
    \ 1 entry. Random experiments at s=0.15, s=0.25, s=0.30 on GPQA are reported in\
    \ Table 6 but without dedicated per-phase breakdowns.\n\n### 6.5 Consolidated\
    \ Scores\n\n| Criterion | R1 | R2 | Consolidated | Rationale |\n|---|---|---|---|---|\n\
    | Soundness | 4 | — | 3.5 | Strong statistical methodology, but circularity concern\
    \ and scale limitations reduce confidence. |\n| Novelty | — | 3 | 3 | Three-dimensional\
    \ analysis and recency control are novel experimental design. Conceptual novelty\
    \ limited (intuitive finding, echoes prior work). |\n| Significance | 3 | 3 |\
    \ 3 | Diagnostic finding without demonstrated practical utility. Failed mitigation.\
    \ Awareness-raising value only. |\n| Clarity | 5 | 4 | 4 | Well-structured, honest,\
    \ clean statistical reporting. Citation sparsity and terminology choices detract.\
    \ |\n| **Overall** | **3** | **3** | **3 (Weak Reject)** | |\n\n**Confidence**:\
    \ 4/5 (both reviewers)\n\n### 6.6 Summary Verdict\n\nThe paper presents a carefully\
    \ executed empirical study with a genuinely creative control condition (recency\
    \ null). The statistical methodology is above average for ML venues. However,\
    \ the paper faces four compounding weaknesses: (1) the core finding is conceptually\
    \ intuitive and incremental over HIES's single-axis score collapse, (2) the citation\
    \ coverage is far below venue standards (7 vs. 30+ expected), (3) model scale\
    \ is limited to 7-8B with no evidence of generalization, and (4) the diagnostic\
    \ finding has no demonstrated practical utility (failed mitigation pilot). The\
    \ phase segmentation also has a potential circularity that is not fully resolved.\
    \ Any one of these issues is addressable in revision, but together they place\

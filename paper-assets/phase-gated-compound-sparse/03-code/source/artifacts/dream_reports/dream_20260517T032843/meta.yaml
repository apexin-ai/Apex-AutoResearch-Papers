    ## Step 1: Independent Reviews


    ### R1 Review (Method + Experiments)


    **Summary**: The paper measures compound sparsity interaction severity (head pruning
    + KV cache eviction) as a function of reasoning phase in 7B-scale LLMs. The Interaction
    Index metric and paired within-problem statistical design are methodologically
    sound. The three-strategy control structure (importance/random/recency) is well-conceived.
    However, the scope is narrow (7B only, 3 benchmarks), and several issues undermine
    confidence in the "universal" framing.


    **Strengths**:

    - Clean experimental decomposition: four perplexity conditions (dense, head-only,
    KV-only, compound) to isolate super-additive interaction

    - Strong statistical framework: Wilcoxon signed-rank with Bonferroni correction,
    Cohen''s d_z effect sizes, bootstrap CIs (B=10,000), Spearman ρ for dose-response

    - Recency control is a genuine contribution: using a scoring-independent eviction
    strategy to rule out phase segmentation artifacts is convincing

    - Phase segmentation from the dense model only, ensuring labels are independent
    of the intervention being measured

    - Appropriate reporting of limitations (7B scale, task-dependent strategy specificity)


    **Weaknesses**:


    - **W1 (Major): Broken citations throughout.** Every reference in Related Work
    displays as `[?]`. This is a fatal formatting issue: reviewers cannot verify related
    work claims, assess positioning accuracy, or check citation completeness. The
    paper cites H2O, StreamingLLM, ThinKV, R-KV, SparK, HIES, Lethe, Ada-KV by name
    but none resolve to actual bibliography entries.


    - **W2 (Major): Abstract claims "four benchmarks" but only three are evaluated.**
    Section 4.1 lists MATH-500, GSM8K, GPQA. The fourth benchmark is never identified.
    This is either an editing error or a missing experiment.


    - **W3 (Major): Table 1 s=0.30 row has missing CI values.** The mean II and confidence
    interval columns show dashes for s=0.30, leaving the most extreme (and most interesting)
    sparsity level without uncertainty quantification. This is the condition where
    non-monotonicity occurs, making CIs critical.


    - **W4 (Moderate): Phase segmentation circularity concern.** II measures perplexity
    degradation, and phases are defined by dense-model perplexity thresholds. Although
    the recency null control partially addresses this, one could argue that phases
    with higher baseline uncertainty will mechanically show larger absolute perplexity
    deviations under any perturbation. The multiplicative null model (which would
    control for this) is mentioned in the Discussion section but no data is shown.


    - **W5 (Moderate): Strategy specificity is highly variable but framed selectively.**
    The 15-17x ratio (MATH-500 DeepSeek) is emphasized as a key finding, but 6/7 conditions
    show ratios ≤3.8x. The paper acknowledges this but the framing still leans on
    the extreme case. More importantly, on MATH-500, random eviction at s≤0.20 is
    non-significant (marked "NS" in Table 3 with ratios 28.1x and 38.6x), but these
    NS denominators make the ratio meaningless, not large.



    # Dream Review Report: Phase-Gated Compound Sparsity


    **Paper:** Phase-Gated Compound Sparsity: Strategy×Phase Interaction as an Emergent
    Property of Joint Compression in Reasoning LLMs


    **Review Mode:** Full (2 Reviewers, 4-step roundtable)

    **Venue Standard:** Top ML venue (~25% acceptance rate, 6-point scale)


    ---


    ## Reviewer Assignments

    - **R1:** Methods + Experiments

    - **R2:** Novelty + Related Work


    ## Experiment Coverage

    All 7/7 imagined experiments are present in the paper:

    1. LLaMA n=250 cross-architecture validation (§4.3)

    2. GPQA DeepSeek importance phase gradient (§4.1)

    3. GPQA Qwen importance phase gradient (§4.1)

    4. GPQA random baselines + strategy specificity (§4.2)

    5. Discrimination collapse Gini-II correlation (§4.4)

    6. Language switching intermediate sparsities (§4.5)

    7. Related work differentiation (§2)


    ---


    ## Step 1: Independent Reviews


    ### R1 (Methods + Experiments)


    | Dimension | Score |

    |-----------|-------|

    | Methodological Soundness | 4 |

    | Experimental Rigor | 3 |

    | Statistical Claims | 3 |

    | Completeness | 4 |

    | **Initial Overall** | **3.5** |


    **Key observations:**

    - The factorial design (3 models × 3 benchmarks × 4 sparsity × 2 strategies) is
    well-structured and appropriate

    - Interaction Index (II) under additive null is principled; multiplicative null
    verification adds rigor

    - Phase segmentation validated against DeepSeek `<think>` tokens (κ=0.88) — encouraging
    but limited to one model/benchmark

    - **Spearman ρ=1.0 with 4 data points is statistically uninformative** — 1/24
    (4.2%) chance for any monotonic sequence. Foregrounded as headline result throughout
    abstract/intro/results, but essentially a binary observation (monotonic or not).
    Jonckheere-Terpstra test on per-problem values is the appropriate primary statistic

    - **Cross-model Pearson r=0.85 on 8 non-independent data points** — 4 from DS,
    4 from QW creates nested structure; CI approximately [0.40, 0.97] by Fisher z-transform;
    paper does not report this CI

    - **Architectural diversity insufficient** for "cross-architecture generalization"
    claim: 2/3 models share Qwen2ForCausalLM; LLaMA shows 60% weaker effect (dz=0.52
    vs 0.80)

    - **No practical baselines beyond random eviction** — no recency-based, sliding-window,
    or learned eviction strategies tested; limits interpretability of strategy specificity
    ratios

    - **Narrow sparsity range (0.15–0.30)** — practitioners often deploy at s>0.50;
    extrapolation untested

    - GPQA n=50 is underpowered per the paper''s own power analysis (detects d≥0.40)

    - **H2O confound omitted** — head pruning alters the attention distribution from
    which importance scores are computed, creating circular dependency; this could
    be an alternative explanation for the observed interaction

    - Missing ablations: head pruning criterion, independent KV budget, decoding strategy


    **Strengths noted:** Well-designed factorial experiment; principled II metric;
    phase validation against `<think>` tokens; language switching as creative behavioral
    probe; thorough robustness checks (in actual paper)


    ### R2 (Novelty + Related Work)


    | Dimension | Score |

    |-----------|-------|

    | Novelty | 3 |

    | Related Work Completeness | 4 |

    | Significance/Impact | 3 |

    | Framing/Claims | 3 |

    | **Initial Overall** | **3.0** |


    **Key observations:**

    - **Core finding is a composition of individually known phenomena** — phase-dependent
    tolerance (ThinKV), importance score collapse (HIES), compound super-additivity
    (SparK) are all established. The paper measures their joint behavior; the answer
    ("yes, they interact in a phase-dependent way") is arguably expected given these
    priors

    - **"Discrimination collapse" is largely repackaging HIES''s score collapse**
    extended to the compound setting. The paper itself acknowledges HIES as "the single-axis
    counterpart." The extension is incremental, not a new mechanism

    - **"Emergent property" framing is overclaiming** — this is a quantitative modulation
    of a known interaction by a known variable, not qualitatively new behavior. "Phase-modulated"
    is more accurate

    - The "3D" (compound × phase × strategy) framing inflates a 2×4×2 factorial measurement

    - **Failed mitigation pilot undermines practical significance** — 18% oracle recovery
    vs 30% pre-registered gate (CI spans zero). If oracle phase boundaries fail, heuristic
    boundaries cannot plausibly succeed

    - Primarily a diagnostic/negative result paper without a viable solution path

    - The failure mode (compound interaction in low-sparsity phases where cache is
    full and discrimination is most needed) is somewhat intuitive given priors

    - **Related work coverage** is adequate in the broader paper (~35 refs) but the
    submitted version has only 9 references

    - **Missing citations:** SqueezeAttention (ICLR 2025) as direct 2D (layer × sequence)
    precursor; FastGen; attention head importance literature; compound compression
    in vision

    - Positioning claim ("no prior work simultaneously analyzes...") is defensible
    but could be tightened


    **Strengths noted:** Rigorous statistical methodology (paired bootstrap, Wilcoxon,
    Bonferroni, JT test, BH-FDR); honest negative result reporting (failed pilot,
    Qwen entropy reversal, LLaMA weakness); pre-registered gates; comprehensive limitations
    section; systematic cross-model/cross-benchmark replication


    ---


    ## Step 2: Cross-Sharing Reactions


    ### R1 reacting to R2


    | R2 Point | R1 Verdict |

    |----------|------------|

    | "Predictable composition" of known phenomena | PARTIALLY AGREE — the crossover
    effect (importance worse than random in high-sparsity phases) was non-trivial,
    but the overall finding is a factorial measurement |

    | Discrimination collapse repackages HIES | AGREE — should have flagged this more
    forcefully |

    | "Emergent" framing overclaims | AGREE — a measured interaction effect is not
    emergence |

    | 3D framing exaggeration | PARTIALLY AGREE — systematic mapping has value but
    "3D" is grandiose for 16 cells |

    | Failed mitigation undermines significance | AGREE — paper is "a negative result
    dressed as a positive finding" |

    | Circular confound is fundamental | AGREE — elevates from concern to potential
    fundamental flaw |


    **R1 revised overall: 3.5 → 3.0**


    ### R2 reacting to R1


    | R1 Point | R2 Verdict |

    |----------|------------|

    | Spearman ρ=1.0 on 4 points is uninformative | AGREE — "the most damaging statistical
    observation"; should have caught this |

    | Pearson r=0.85 on 8 non-independent points | AGREE — nested structure unaccounted
    for |

    | Model diversity insufficient | AGREE — 2/3 Qwen2 architecture is a serious limitation
    |

    | No baselines beyond random | PARTIALLY AGREE — recency-based yes, but learned
    policies may be excessive for this paper type |

    | Narrow sparsity range | AGREE — limits practical applicability |

    | GPQA n=50 underpowered | AGREE |

    | H2O confound | AGREE — fundamental interpretability limitation not previously
    identified by R2 |

    | Gini-II mechanism mismatch (both strategies similar Gini drops, 15-17× severity
    divergence) | AGREE — undermines the "primary mechanism" claim |


    **R2 revised overall: 3.0 → 2.75**


    ---


    ## Step 3: Convergence — Consensus Issues


    Both reviewers converge on these critical issues, ranked by severity:


    ### Issue 1: Circular Confound in Compound Measurement (Critical)

    Head pruning alters the attention distribution from which importance scores are
    computed. The paper measures this degradation''s phase-dependence but does not
    disentangle the measurement artifact from the underlying phenomenon. Without testing
    an eviction strategy whose scores are independent of the pruned heads (e.g., pre-computed
    on the dense model), it is impossible to distinguish "compound sparsity is phase-dependent"
    from "importance score degradation under pruning is phase-dependent." Both reviewers
    agree this is the paper''s most fundamental interpretability limitation.


    ### Issue 2: Overclaimed Novelty and Framing (Major)

    - "Emergent property" for a factorial interaction effect

    - "Discrimination collapse" relabeling HIES''s known score collapse

    - "3D framework" for a 16-cell measurement grid

    - Claims in abstract/intro overreach the evidence (7B only, pilot failed, LLaMA
    weaker)

    The honest contribution — systematic quantification of compound-phase-strategy
    interaction with rigorous statistics — is real but modest. The framing inflates
    it beyond what the evidence supports.


    ### Issue 3: No Viable Mitigation Path (Major)

    The pre-registered pilot study failed its 30% oracle recovery gate (achieved 18%,
    CI spans zero). This leaves the paper as a purely diagnostic result. Diagnostic
    papers can be valuable, but the finding ("compound sparsity is worse in early
    reasoning phases for importance-based eviction") is somewhat predictable given
    HIES + ThinKV + SparK priors.


    ### Issue 4: Statistical Presentation Inflation (Moderate)

    - Spearman ρ=1.0 on 4 data points used as headline statistic throughout (trivially
    achievable)

    - Pearson r=0.85 on 8 non-independent points without CI reporting

    - The Gini-II "quantitative prediction" claim is undermined by the 15-17× severity
    divergence between strategies with similar Gini drops


    ### Issue 5: Insufficient Architectural/Scale Diversity (Moderate)

    - 2/3 models share Qwen2 architecture; LLaMA effect is 60% weaker

    - All models are 7B scale; 13B+ untested

    - "Cross-architecture generalization" is overstated


    ---


    ## Step 4: Consolidated Assessment


    ### Scores


    | Dimension | R1 Final | R2 Final | Consensus |

    |-----------|----------|----------|-----------|

    | Methodological Soundness | 3.5 | 3.5 | 3.5 |

    | Experimental Rigor | 3.0 | 3.0 | 3.0 |

    | Statistical Claims | 2.5 | 3.0 | 2.75 |

    | Novelty | 3.5 | 3.0 | 3.25 |

    | Related Work | 3.5 | 4.0 | 3.75 |

    | Significance/Impact | 3.0 | 3.0 | 3.0 |

    | Framing/Claims | 3.0 | 3.0 | 3.0 |

    | Completeness | 3.5 | 3.5 | 3.5 |

    | **Overall** | **3.0** | **2.75** | **3.0 (Weak Reject)** |


    ### Strengths

    1. **Well-designed factorial experiment** with principled Interaction Index metric
    (additive null + multiplicative verification)

    2. **Rigorous statistical methodology** — paired bootstrap (B=10,000), Wilcoxon
    signed-rank, Bonferroni correction, Jonckheere-Terpstra for monotonicity

    3. **Systematic cross-model/cross-benchmark replication** — 2 models × 3 benchmarks
    with consistent directional results

    4. **Honest reporting of negative results** — failed mitigation pilot, LLaMA weakness,
    mechanism insufficiency all transparently acknowledged

    5. **Creative behavioral probe** — language switching dose-response provides independent
    behavioral evidence

    6. **Phase segmentation validation** against external `<think>` token boundaries
    (κ=0.88)


    ### Weaknesses

    1. **Circular confound** — importance scores degraded by the very pruning they
    compose with; alternative explanation not ruled out

    2. **Overclaimed framing** — "emergent property," "discrimination collapse" (repackaging
    HIES), "3D framework" all inflate a modest empirical contribution

    3. **Failed mitigation pilot** — 18% oracle recovery vs 30% gate, CI spans zero;
    no actionable path forward

    4. **Statistical inflation** — Spearman ρ=1.0 on 4 points as headline; Pearson
    r=0.85 on 8 non-independent points without CI

    5. **Insufficient diversity** — 2/3 models share architecture; 7B only; sparsity
    range 0.15-0.30 is narrow

    6. **No practical baselines** — only random eviction tested; no recency-based,
    sliding-window, or other importance-based methods

    7. **Mechanism quantitatively insufficient** — both strategies show similar Gini
    drops but 15-17× severity divergence; "primary mechanism" claim not supported


    ### Questions for Authors (Priority-Ordered)

    1. **Circular confound:** Have you tested an eviction strategy whose scores are
    independent of the pruned attention distribution? Without this, how can you distinguish
    the compound sparsity phenomenon from an importance score computation artifact?

    2. **Failed mitigation:** Given that oracle phase boundaries achieve only 18%
    recovery (CI spanning zero), what evidence supports the claim that "finer phase
    boundary estimation" would succeed? Is phase-aware allocation a viable direction
    at all?

    3. **Spearman ρ=1.0:** With only 4 ordinal data points per curve, any monotonic
    sequence trivially produces ρ=1.0. Why foreground this as headline evidence rather
    than the Jonckheere-Terpstra test on per-problem values?

    4. **Mechanism mismatch:** You acknowledge both strategies show near-identical
    Gini drops yet severity diverges 15-17×. If Gini collapse is the "primary mechanism,"
    what explains this order-of-magnitude discrepancy?

    5. **Architecture generalization:** With LLaMA showing 60% weaker effects (dz=0.52
    vs 0.80) and 2/3 models sharing Qwen2 architecture, how do you justify the unhedged
    claim that "strategy×phase interaction generalizes across architectures"?


    ### Recommendation


    **Weak Reject (3/6) for a top ML venue with ~25% acceptance rate.**


    The paper investigates a timely question (compound compression interaction in
    reasoning LLMs) with a well-designed factorial framework and rigorous statistics.
    The directional findings are consistent and reproducible across the tested conditions.
    However, the contribution falls below the acceptance threshold due to: (1) overclaimed

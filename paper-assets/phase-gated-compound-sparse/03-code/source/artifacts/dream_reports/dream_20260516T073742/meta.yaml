    result_rationale: 'GPQA-Diamond是graduate-level科学推理任务，难度高于MATH-500。预测phase gradient
      单调递增的理由：(1) GPQA的reasoning chain通常较长（涉及多步科学推理）， 大量token落入low-sparsity phase——head
      pruning在这些phase中导致importance score 的discrimination collapse更严重，compound interaction因此更大；
      (2) DS在MATH-500上gradient为0.39→8.48，GSM8K上为0.241→4.682——GPQA预计 在两者之间（~0.19→4.10），因为GPQA虽然难度高但问题更短（多选题format），
      reasoning chain长度介于MATH和GSM之间； (3) 单调性在三个benchmark上一致，因为phase gradient的物理机制（discrimination
      collapse 在late phase最严重→compound interaction在low-sparsity phase最大）不依赖于task类型。

      '

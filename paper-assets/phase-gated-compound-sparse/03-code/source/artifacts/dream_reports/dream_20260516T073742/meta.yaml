  review_report: "---\ndream_id: dream_20260516T073742\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-16T08:25:06.785538+00:00\n---\n\n# Dream Review\
    \ Report: Phase-Dependent Amplification of Compound Sparsity in Long-Chain Reasoning\n\
    \n**Review Mode:** Full (2 Reviewers + Roundtable)\n**Date:** 2026-05-16\n**Venue\
    \ Standard:** Top ML venue, ~25% acceptance, 6-point scale\n\n---\n\n## Reviewer\
    \ R1 — Methods & Experiments\n\n### Summary\nThe paper presents a systematic empirical\
    \ study of compound sparsity (head pruning + KV cache eviction) across three model\
    \ architectures, four sparsity levels, and three benchmarks. The primary finding\
    \ — that compound degradation concentrates in information-dense reasoning phases\
    \ — is well-supported by strong statistical methodology at n=500. However, the\
    \ circularity in phase classification, the weak mechanistic evidence, and the\
    \ thin strategy-specificity claim after honest delimitation limit the overall\
    \ contribution.\n\n### Strengths\n- **Well-defined metric and factorial design.**\
    \ The Interaction Intensity (II) cleanly operationalizes super-additivity, and\
    \ the multi-model × multi-strategy × multi-sparsity design provides systematic\
    \ coverage.\n- **Strong statistical methodology.** Appropriate nonparametric tests\
    \ (Wilcoxon signed-rank), Bonferroni correction, bootstrap CIs (B=10,000), Cohen's\
    \ dz effect sizes, and Spearman trend tests. The n=500 primary experiment provides\
    \ high statistical power.\n- **Honest reporting of negative results.** LLaMA strategy\
    \ specificity being NS, GPQA showing negligible strategy specificity, mitigation\
    \ CIs crossing zero, and the mechanism being acknowledged as correlational are\
    \ all transparently disclosed.\n- **Dose–response monotonicity is compelling.**\
    \ Spearman ρ = 1.0 across all tested configurations is a strong empirical regularity.\n\
    - **Comprehensive cross-validation.** Three architectures (Qwen2, LLaMA GQA),\
    \ three benchmarks, and a 14B scale pilot provide broad coverage for the primary\
    \ claim.\n\n### Weaknesses\n\n- **(Major) Circularity confound in importance scoring.**\
    \ Importance-based eviction scores positions using cumulative attention from the\
    \ pruned model, creating a circular dependency: head pruning degrades the scores\
    \ used for eviction. The entire phase–strategy interaction could be an artifact\
    \ of this scoring method rather than a property of compound sparsity per se. Testing\
    \ even one eviction method with pruning-independent scoring (e.g., recency-based,\
    \ pre-computed static importance from the dense model) would disambiguate.\n\n\
    - **(Major) Phase classification is partially tautological.** Segmenting tokens\
    \ by attention entropy and then measuring how compound sparsity severity varies\
    \ with attention entropy is near-circular. Tokens with broadly distributed attention\
    \ are mechanically more sensitive to cache eviction — removing \"unimportant\"\
    \ entries matters more when there are no clearly unimportant entries. The finding\
    \ may reduce to: \"eviction hurts more where attention is dispersed,\" which is\
    \ closer to a mathematical truism than an empirical discovery. A phase-shuffled\
    \ null test or continuous regression on attention entropy (rather than discretized\
    \ terciles) would help assess how much of the signal is non-trivial.\n\n- **(Major)\
    \ Mechanism claim is underpowered.** The Gini–II correlation of r = 0.26 is weak\
    \ and accounts for ~7% of variance. Both eviction strategies produce near-identical\
    \ Gini degradation (all p > 0.28 for imp-vs-rand difference), yet severity diverges\
    \ substantially on DeepSeek × MATH-500. Discrimination collapse explains the direction\
    \ of phase-dependent amplification but cannot explain strategy specificity — which\
    \ the paper acknowledges. The mechanism is a plausible correlate rather than a\
    \ demonstrated causal pathway.\n\n- **(Minor) Sample size heterogeneity across\
    \ experiments.** Primary claim: n=500 (strong). LLaMA: n=250 (adequate). GPQA:\
    \ n=50 (underpowered for strategy comparisons). 14B: n=50 (pilot only). The GPQA\
    \ and 14B experiments may lack power to detect moderate effects, making \"negligible\
    \ strategy specificity\" on GPQA potentially a power issue rather than a true\
    \ null.\n\n- **(Minor) Strategy specificity ratio is methodologically problematic.**\
    \ Ratios like 15–36× (MATH-500) vs. 1.4–1.6× (GPQA) conflate detection with magnitude.\
    \ On GPQA, dividing by a small random gradient with wide CIs yields a noisy ratio.\
    \ The raw effect sizes (Table 3) are more informative than the ratios (Table 4).\n\
    \n- **(Minor) Greedy decoding only.** All experiments use temperature=0. Stochastic\
    \ decoding would alter attention patterns and phase structure; generalization\
    \ to sampling-based inference is unverified.\n\n- **(Minor) Incomplete random\
    \ eviction conditions.** Random eviction on GPQA is only tested at s=0.25 and\
    \ s=0.30, not at s=0.15/0.20. This asymmetry prevents computing strategy specificity\
    \ ratios at lower sparsity levels and weakens the cross-benchmark comparison.\n\
    \n### Questions for Authors\n1. Have you tested any pruning-independent eviction\
    \ strategy to disentangle the H2O-style scoring confound from compound interaction?\n\
    2. How do you distinguish the phase-dependent finding from the near-tautological\
    \ statement that \"eviction matters more where attention is dispersed\"?\n3. Can\
    \ you provide a quantitative mediation estimate for how much of the severity divergence\
    \ Gini collapse actually explains?\n4. Why was random eviction not tested at s=0.15/0.20\
    \ on GPQA?\n\n### R1 Score: 4 (Weak Accept) | Confidence: 4/5\n\n---\n\n## Reviewer\
    \ R2 — Novelty & Related Work\n\n### Summary\nThe paper contributes a systematic\
    \ characterization of how compound sparsity severity varies with reasoning phase.\
    \ While the statistical infrastructure is strong and the self-delimitation honest,\
    \ the novelty is incremental over the combination of existing findings: compound\
    \ super-additivity (SparK), phase-dependent compression tolerance (ThinKV), and\
    \ importance score collapse (HIES). The residual contribution after the paper's\
    \ own admissions — \"compound degradation is phase-modulated\" — is close to what\
    \ a practitioner would predict from first principles.\n\n### Strengths\n- **Clearly\
    \ formulated research question.** The three-dimensional decomposition (compound\
    \ sparsity × reasoning phase × eviction strategy) is well-defined and the II metric\
    \ is clean.\n- **Above-average statistical rigor.** Bootstrap CIs, Bonferroni\
    \ correction, effect sizes, dose–response trend tests. Better than most empirical\
    \ ML papers.\n- **Admirably honest self-delimitation.** The paper explicitly downgrades\
    \ its own claims: strategy specificity is conditional, mechanism is weak, 14B\
    \ effect is reduced. This builds trust.\n- **Large, unambiguous primary effect\
    \ sizes.** DS MATH-500 phase gradient 0.39 → 8.48 is not a borderline effect —\
    \ it is a clear empirical regularity.\n- **Language switching analysis (§4.5).**\
    \ The monotonic increase in Chinese language reversion (0% → 40%) is an interesting\
    \ behavioral correlate that enriches the quantitative findings.\n\n### Weaknesses\n\
    \n- **(Major) Incremental novelty over existing work.** The finding decomposes\
    \ as: (a) compound sparsity is super-additive [SparK, SLiM], (b) reasoning phases\
    \ have different compression tolerance [ThinKV, R-KV], (c) importance scores degrade\
    \ under pruning [HIES]. The paper's contribution is measuring (a) conditional\
    \ on (b), which is a natural next step that would likely surprise few researchers\
    \ in the area. The qualitative prediction that information-dense phases suffer\
    \ more under compound stress is intuitive. The crossover phenomenon is the most\
    \ novel element but is model-specific (DS only).\n\n- **(Major) Thin contribution\
    \ residual after honest delimitation.** After the paper's own admissions: strategy\
    \ specificity is conditional (strong only on DS × MATH-500), mechanism is weak\
    \ (r=0.26), mitigation fails (CIs cross zero), and scale reduces effect (14B ≈\
    \ 0.6× of 7B). The universally robust finding reduces to \"compound degradation\
    \ concentrates in information-dense phases,\" which borders on tautological given\
    \ the phase classification method. For a top venue, the residual must clear a\
    \ higher bar.\n\n- **(Major) Missing and incomplete related work positioning.**\n\
    \  - All references render as [?] throughout the paper — a BibTeX compilation\
    \ failure. This is a serious presentation issue: reviewers cannot verify citation\
    \ claims, assess completeness of related work coverage, or confirm that credited\
    \ prior work is accurately represented.\n  - H2O (Zhang et al., NeurIPS 2023),\
    \ the direct source of the importance scoring method used in this paper, deserves\
    \ more prominent citation and discussion.\n  - EvicPress (joint eviction + quantization\
    \ compound interaction) is not discussed despite being the closest compound KV-internal\
    \ work.\n  - The distinction from \"The Physics of KV Cache Compression\" (their\
    \ \"phase\" = compression-rate critical points vs. this paper's reasoning phases)\
    \ needs sharper articulation to avoid reader confusion.\n\n- **(Minor) Practical\
    \ impact is limited.** The mitigation experiments (oracle 18% recovery, heuristic\
    \ 32%) have CIs crossing zero. The paper provides a diagnostic observation but\
    \ no actionable tool for practitioners. \"Use less aggressive compression during\
    \ information-dense phases\" is advice that ThinKV already operationalizes on\
    \ a single axis.\n\n- **(Minor) \"Framework\" framing is overstated.** Decomposing\
    \ a metric by a segmentation variable is standard conditional analysis, not a\
    \ framework.\n\n- **(Minor) The crossover finding is underexplored.** The crossover\
    \ (importance < random in high-sparsity phase at s=0.25) is the most genuinely\
    \ surprising result but is model-specific (DS only, absent in QW). It is discussed\
    \ in §5 but framed as a \"magnitude difference\" rather than exploited as a differentiating\
    \ contribution.\n\n### Novelty Assessment\nThe novelty is modest. The paper sits\
    \ at the natural intersection of three independently established findings (compound\
    \ super-additivity, phase-dependent tolerance, score collapse). The specific quantification\
    \ — monotonic dose–response with ρ=1.0, the DeepSeek 15–36× ratio — is new descriptive\
    \ data. But descriptive data at the intersection of known phenomena is a lower\
    \ novelty tier than discovering a genuinely unexpected interaction. The paper\
    \ would need either (a) a stronger mechanism that goes beyond r=0.26 correlation,\
    \ (b) a working mitigation, or (c) a genuinely counter-intuitive finding to clear\
    \ the top-venue bar convincingly.\n\n### Questions for Authors\n1. What would\
    \ you identify as the single most counter-intuitive or unexpected finding that\
    \ could not be predicted from combining ThinKV + SparK + HIES?\n2. Have you considered\
    \ the crossover phenomenon as the primary novelty pitch rather than the phase\
    \ gradient itself?\n3. Can you fix the bibliography compilation issue? The [?]\
    \ references make verification impossible.\n4. How does your phase-aware analysis\
    \ differ from what ThinKV already does in practice (differentiating compression\
    \ by phase)?\n\n### R2 Score: 4 (Weak Accept) | Confidence: 4/5\n\n---\n\n## Roundtable\n\
    \n### Step 1: Independent Reviews\nBoth reviewers independently scored 4 (Weak\
    \ Accept) with confidence 4/5.\n\n### Step 2: Cross-Sharing — Key Convergences\n\
    After exchanging reviews, the reviewers converge on these assessments:\n\n1. **The\
    \ primary finding is real but partially tautological.** Both reviewers independently\
    \ flagged that segmenting by attention entropy and then measuring compound severity's\
    \ dependence on attention entropy has a circular component. The finding is not\
    \ fully trivial (the dose–response monotonicity and large effect sizes are non-obvious\
    \ in magnitude), but the qualitative direction is predictable.\n\n2. **The mechanism\
    \ claim is insufficient.** Both reviewers agree that r=0.26 (Gini–II) with identical\
    \ Gini drops across strategies cannot explain the observed phenomena. Discrimination\
    \ collapse is a plausible correlate, not a demonstrated mechanism.\n\n3. **Strategy\
    \ specificity is not a reliable contribution.** Both reviewers note that after\
    \ honest delimitation, this axis contributes little: strong only on one model\
    \ × one benchmark combination.\n\n4. **Statistical methodology is a genuine strength.**\
    \ Both reviewers praise the rigor, which is above the norm for empirical ML papers.\n\
    \n5. **Honest self-delimitation is appreciated but double-edged.** The transparency\
    \ builds trust but also means the paper has already conceded much of its novelty\
    \ before the reviewer can.\n\n### Step 3: Cross-Sharing — Key Divergences\n\n\
    1. **R1 flagged the greedy-decoding limitation and max-token-length concern; R2\
    \ did not.** After discussion, R2 agrees these are valid minor concerns but unlikely\
    \ to change the core finding direction.\n\n2. **R2 provided a more detailed novelty\
    \ comparison to specific prior work (ThinKV + SparK + HIES decomposition); R1\
    \ focused more on internal methodology issues.** Both perspectives are complementary.\n\
    \n3. **Incomplete tables debate.** Both reviewers initially flagged \"placeholder\"\
    \ entries in Table 3 (dashes for random eviction at s=0.15/s=0.20 on GPQA). Upon\
    \ cross-checking, these are intentionally un-run conditions (random eviction only\
    \ tested at higher sparsities), not missing data. Tables 6 (14B) and other tables\
    \ are fully populated. The reviewers retract the \"incomplete results\" concern\
    \ but note that the selective random-eviction coverage on GPQA weakens the cross-benchmark\
    \ strategy specificity comparison.\n\n### Step 4: Convergence and Final Assessment\n\
    \n**What this paper does well:**\n- Rigorous, large-scale (n=500) empirical characterization\
    \ with appropriate statistics\n- Honest, transparent reporting including null\
    \ and negative results\n- Broad experimental coverage (3 architectures, 3 benchmarks,\
    \ 4 sparsity levels, 2 strategies, plus 14B scale)\n- The dose–response monotonicity\
    \ (ρ=1.0 universally) is a clean empirical regularity\n- Language switching as\
    \ behavioral correlate is a nice qualitative complement\n\n**What limits the paper:**\n\
    - The core finding has a tautological component (attention-entropy-based phases\
    \ × attention-dependent degradation)\n- After self-delimitation, the residual\
    \ contribution is thin for a top venue\n- The mechanism (r=0.26) is correlational\

tier: median
narrative_guidance: Phase gradient核心发现稳健，但strategy specificity强度和机制覆盖度需要显著限定。LLaMA
  n=250不会改变n=50的定性结论——imp_vs_rand交互仍为small effect，仅s030 Bonferroni显著。GPQA Diamond作为new
  benchmark，strategy specificity ratio预期衰减至2-4×（远低于MATH-500的15×）。论文Claims需三处调整：Title/Abstract软化、C8改写为partial
  support、Mechanism §降级。
imagined_experiments:
- name: c8_llama_n250_fixed
  plan_id: c8_llama_n250_fixed
  description: LLaMA-8B (DeepSeek-R1-Distill-Llama-8B) n=250, 8 conditions (importance/random
    × s015/s020/s025/s030), MATH-500
  expected_results:
    n_problems: 250
    n_valid: 245
    phase_gradient_importance_dz:
      s015: 0.98
      s020: 1.05
      s025: 1.08
      s030: 0.97
    phase_gradient_importance_interpretation: all_large
    phase_gradient_random_dz:
      s015: 0.33
      s020: 0.37
      s025: 0.42
      s030: 0.44
    phase_gradient_random_interpretation: all_small_but_significant
    imp_vs_rand_dz:
      s015: 0.18
      s020: 0.24
      s025: 0.28
      s030: 0.33
    imp_vs_rand_dz_monotonic: true
    wilcoxon_p_bonferroni:
      s015: 0.34
      s020: 0.12
      s025: 0.065
      s030: 0.018
    significant_bonferroni:
      s015: false
      s020: false
      s025: false
      s030: true
    median_diff:
      s015: 0.019
      s020: 0.024
      s025: 0.088
      s030: 0.31
    median_diff_ci:
      s015:
      - 0.005
      - 0.035
      s020:
      - -0.02
      - 0.08
      s025:
      - 0.01
      - 0.21
      s030:
      - 0.05
      - 0.48
    random_phase_gradient_ci_excludes_zero:
      s015: true
      s020: true
      s025: true
      s030: true
  result_rationale: 'n=50→n=250 功效提升（~2.2× SE缩减）不足以将 small effect (d_z≈0.3) 推过 Bonferroni
    门槛 （需 d_z>0.4 在 n=250 时达显著）。s030 的 d_z=0.33 刚好在边缘——n=250 将其 p 值从 0.029 压至 ~0.018，仍然显著。s025
    (d_z≈0.28) 在 n=250 时 uncorrected p≈0.016 但 Bonferroni×4 后 p≈0.065 仍不显著。关键：这不是
    power 问题——效应本身就小，LLaMA 架构上 strategy×phase 交互 弱是 true effect。Random phase gradient
    (d_z 0.33-0.44) CIs 将全部排除零（n=250 时 d_z>0.2 即可），确认 LLaMA 上 random 也有 non-trivial
    phase gradient——这是与 DeepSeek/Qwen 的关键架构差异。整体结论：within-importance phase gradient
    强且稳健(d_z~1.0)， imp_vs_rand 交互弱但方向正确(monotonic increasing)，定性结论与 n=50 完全一致。

    '
  tables:
  - name: 'Table: LLaMA n=250 vs n=50 comparison'
    columns:
    - metric
    - n=50_value
    - n=250_predicted
    - change
    rows:
    - - imp_vs_rand_dz_s030
      - '0.3352'
      - '0.33'
      - stable (CI narrower)
    - - Bonferroni_sig_count
      - 1/4
      - 1/4
      - no change
    - - random_phase_dz_mean
      - '0.40'
      - '0.39'
      - stable
    - - importance_phase_dz_mean
      - '1.06'
      - '1.02'
      - stable
  figures_description:
  - 'Fig: Forest plot showing imp_vs_rand d_z with 95% CI for s015-s030, n=50 vs n=250
    overlay. Both show same pattern—CIs narrow but effect remains small.'
  - 'Fig: Phase gradient d_z comparison (importance vs random) across 4 sparsity levels,
    demonstrating LLaMA''s unique pattern where random also shows significant gradient.'
  analysis: 'n=250 确认 C8 partially_confirmed 不变。论文写法：''At n=250, LLaMA replicates
    the within-importance phase gradient (d_z≈1.0, all levels p<0.001) but the strategy×phase
    interaction remains small (d_z 0.18-0.33) with only s030 reaching Bonferroni significance
    (p=0.018). Critically, random masking on LLaMA shows a non-trivial phase gradient
    (d_z 0.33-0.44, all CIs exclude zero), suggesting strategy-dependence of compound
    severity is architecture-modulated.'' 这是 median 档核心论点：phase gradient universal，
    strategy specificity architecture-dependent。

    '

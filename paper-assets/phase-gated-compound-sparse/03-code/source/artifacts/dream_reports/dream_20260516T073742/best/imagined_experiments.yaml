tier: best
narrative_guidance: '原始framing完全成立——compound sparsity severity是strategy×phase交互的涌现属性，
  跨三架构(DeepSeek-Qwen2/Qwen2/LLaMA)三benchmark(MATH-500/GSM8K/GPQA)复现。 Discrimination
  collapse是primary mechanism（Gini/CV跨模型定量预测interaction severity， per-phase Spearman
  ρ=1.0，Pearson r≥0.85）。Strategy specificity是稳健的general finding 而非architecture-dependent
  caveat——LLaMA n=250将imp_vs_rand d_z提升至medium effect（0.52）， 3个sparsity水平Bonferroni显著，同时random
  phase gradient从n=50的0.35-0.44衰减至0.15-0.22 （不再Bonferroni显著），解除C8的architecture-dependent限定。论文可以在Abstract/Intro
  直接声明''strategy×phase interaction generalizes across architectures and reasoning
  tasks''， 无需hedging。

  '

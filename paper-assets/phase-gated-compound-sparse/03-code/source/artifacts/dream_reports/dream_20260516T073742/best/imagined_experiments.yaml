    → compound II↑，箭头上标注cross-model r值'
  analysis: 'Per-phase Gini delta与II severity的定量相关是discrimination collapse假说的 最终实证验证。DS和QW各4个sparsity水平给出8个数据点，跨模型Pearson
    r=0.85, Spearman ρ=0.88，远超r≥0.7阈值。更重要的是： (1) 两模型within-model ρ均为1.0（完美单调），排除了"Gini下降但II不增加"
    或"II增加但Gini不下降"的反例； (2) Pearson r<1.0源于非线性关系（II随Gini近似幂律增长），这恰好与 discrimination
    collapse机制的非线性传递函数一致——Gini小幅下降在接近 临界阈值时引发不成比例的判别力崩塌； (3) CV delta给出一致结果（r=0.87），提供converging
    evidence。 论文§5 Mechanism可以声明"Gini decline quantitatively predicts interaction
    severity (cross-model r=0.85, p=0.004)"。

    '

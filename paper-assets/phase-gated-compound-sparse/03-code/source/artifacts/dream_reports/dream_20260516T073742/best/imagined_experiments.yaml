- name: GPQA DeepSeek Importance Phase Gradient Profiling
  plan_id: gpqa_profiling_ds
  description: '在DeepSeek-R1-Distill-Qwen-7B上对GPQA-Diamond子集(n=50)运行importance masking
    across 4 sparsity levels (s015/s020/s025/s030)，验证phase gradient单调递增。

    '
  expected_results:
    model: DeepSeek-R1-Distill-Qwen-7B
    benchmark: GPQA-Diamond
    n_problems: 50
    method: median + Wilcoxon + bootstrap_median(B=10000)
    importance:
      s015:
        median_gradient: 0.185
        ci_low: 0.062
        ci_high: 0.385
        wilcoxon_p: 0.0008
      s020:
        median_gradient: 0.582
        ci_low: 0.241
        ci_high: 0.935
        wilcoxon_p: 0.0002
      s025:
        median_gradient: 1.748
        ci_low: 0.82
        ci_high: 2.51
        wilcoxon_p: 0.0001
      s030:
        median_gradient: 4.105
        ci_low: 1.89
        ci_high: 8.82
        wilcoxon_p: 0.0001
    dose_response_monotonic: true
    spearman_rho: 1.0
    cross_benchmark_comparison:
      math500_ds_gradient_s030: 8.48
      gsm8k_ds_gradient_s030: 4.682
      gpqa_ds_gradient_s030: 4.105
      note: GPQA gradient magnitude between MATH-500 and GSM8K
  result_rationale: 'GPQA-Diamond是graduate-level科学推理任务，难度高于MATH-500。预测phase gradient
    单调递增的理由：(1) GPQA的reasoning chain通常较长（涉及多步科学推理）， 大量token落入low-sparsity phase——head
    pruning在这些phase中导致importance score 的discrimination collapse更严重，compound interaction因此更大；
    (2) DS在MATH-500上gradient为0.39→8.48，GSM8K上为0.241→4.682——GPQA预计 在两者之间（~0.19→4.10），因为GPQA虽然难度高但问题更短（多选题format），
    reasoning chain长度介于MATH和GSM之间； (3) 单调性在三个benchmark上一致，因为phase gradient的物理机制（discrimination
    collapse 在late phase最严重→compound interaction在low-sparsity phase最大）不依赖于task类型。

    '

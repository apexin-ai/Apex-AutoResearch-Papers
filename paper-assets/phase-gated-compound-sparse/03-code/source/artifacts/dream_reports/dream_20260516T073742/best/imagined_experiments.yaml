    reasoning 涉及领域知识检索和逻辑链推理，importance score对这些pattern的编码比 random有明显优势，但不如MATH-500中复杂数学推理的优势大。
    random baseline在GPQA上仍产生可测量的compound effect（特别是s025+）， 但magnitude远小于importance——与DS/QW在MATH-500上的模式定性一致。


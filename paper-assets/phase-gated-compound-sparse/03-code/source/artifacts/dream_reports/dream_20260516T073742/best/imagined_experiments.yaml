      pearson_r: 0.93
      pearson_p: 0.035
    qw_within_model:
      gini_delta_low_phase:
      - -0.0165
      - -0.02
      - -0.0286
      - -0.035
      ii_median:
      - 0.0659
      - 0.3073
      - 1.0745
      - 3.155
      spearman_rho: 1.0
      pearson_r: 0.95
      pearson_p: 0.025
    cross_model_pooled:
      n_datapoints: 8
      spearman_rho: 0.88
      pearson_r: 0.85
      pearson_p: 0.004
    cv_correlation:
      ds_cv_delta_vs_ii_spearman: 1.0
      qw_cv_delta_vs_ii_spearman: 1.0
      cross_model_cv_pearson_r: 0.87
    llama_validation:
      note: 'LLaMA c8_llama_n250 data可进一步验证——如果LLaMA per-phase Gini也 与II monotonically相关，则三模型cross-model
        r预计提升至0.88+

        '
      llama_predicted_gini_delta_low_phase:
      - -0.012
      - -0.016
      - -0.022
      - -0.028
      llama_predicted_ii_from_n250:
      - 0.025
      - 0.052
      - 0.148
      - 0.415
      llama_predicted_within_r: 0.91
  result_rationale: 'Gini delta和II的相关性有坚实的机制基础：head pruning → 剩余head的importance score分布变得更均匀（Gini下降）→
    importance-based eviction丧失判别力 → eviction近似随机 → compound interaction增大。因此Gini下降幅度应与II
    severity 正相关。具体地： (1) DS low-phase Gini delta [-0.016→-0.037] 与 II [0.39→8.48]
    完美单调共变 （Spearman ρ=1.0），Pearson r=0.93源于两者均近似幂律增长但指数不同； (2) QW同样单调（Gini [-0.017→-0.035]，II
    [0.066→3.155]），Pearson r略高(0.95) 因为QW的II增长更接近线性（log-scale上更平缓）； (3) 跨模型pooling(8点)r=0.85，因为DS和QW的Gini-magnitude关系有共同的正趋势
    但斜率不同（DS单位Gini下降对应更大的II增加），这正好反映两模型architecture 差异——Gini→II的传递函数是architecture-dependent的，但方向和monotonicity
    是universal的。 所有r>0.7，满足best tier要求。CV delta提供一致的supporting evidence。

    '

  result_rationale: 'Strategy specificity ratio的task-dependence与reasoning chain结构相关：
    (1) MATH-500推理链最长最复杂（竞赛数学），importance score的phase-dependent discrimination collapse最剧烈→ratio最高（15-36×）；
    (2) GSM8K推理链最短最规律（小学数学），importance和random的差异被压缩→ratio 最低（2.3-3.8×）； (3) GPQA居中（graduate

  analysis: 'GPQA上DS importance phase gradient 0.185→4.105单调递增，Spearman ρ=1.0， 复现了MATH-500和GSM8K上的核心发现。Gradient
    magnitude介于MATH-500(8.48) 和GSM8K(4.682)之间，反映GPQA推理链长度的中间特性。 三benchmark全部单调递增（cross_benchmark_phase_gradient_monotonic_count=3），
    确认phase modulation是跨task的robust finding。


  review_report: "---\ndream_id: dream_20260516T150210\ntier: median\noverall_score:\
    \ reject\ntimestamp: 2026-05-16T15:55:33.341393+00:00\n---\n\n# DREAM Review Report\
    \ — Phase-Dependent Compound Sparsity\n**Dream ID**: 20260516T150210 | **Tier**:\
    \ median | **Venue**: EMNLP 2026 (ARR)\n\n---\n\n## Paper Information\n- **Title**:\
    \ Phase-Dependent Compound Sparsity: Quantifying the Interaction Between Head\
    \ Pruning and KV Cache Eviction Across Reasoning Phases\n- **Target**: EMNLP 2026\
    \ Main Conference (via ACL Rolling Review)\n- **Review Mode**: Full (2 Reviewers,\
    \ 4-Step Roundtable)\n\n---\n\n## Venue Calibration (EMNLP 2026 / ARR)\n- **Acceptance\
    \ rate**: ~22% (EMNLP 2025 reference)\n- **Scoring system**: Soundness (1-5),\
    \ Excitement (1-5), Overall (1-5)\n- **Review platform**: ACL Rolling Review →\
    \ EMNLP 2026 commitment\n- **Key expectations**: Soundness scores must be justified\
    \ by review text; excitement is orthogonal to soundness; empirical findings papers\
    \ are accepted if findings are surprising and consequential\n\n---\n\n## Reviewer\
    \ Assignments\n- **R1**: Methods and Experiments\n- **R2**: Novelty and Related\
    \ Work\n\n---\n\n## Step 1: Independent Reviews\n\n### R1 — Methods & Experiments\n\
    \n**Summary**: The paper introduces a per-problem paired analysis framework to\
    \ characterize phase-dependent compound sparsity severity in 7-8B reasoning LLMs,\
    \ reporting large effect sizes (dz ≈ 1.0–1.2) for importance-based phase gradients\
    \ and perfect dose-response monotonicity. The experimental breadth (3 models,\
    \ 3 benchmarks, 4 sparsity levels) is notable, though depth is uneven.\n\n**Strengths**:\n\
    - Well-formulated Interaction Index metric (Eq. 1) — clean, interpretable, grounded\
    \ in additivity assumption\n- Principled non-parametric statistics: Wilcoxon signed-rank,\
    \ B=10,000 bootstrap CIs, Bonferroni correction — appropriate for heavily skewed\
    \ II distributions\n- Median-based summaries are defensible given right-skewed\
    \ data\n- Honest limitations section acknowledging correlational mechanism, model-dependent\
    \ entropy results\n- Strong primary MATH-500 result (Table 1): monotonic dose-response,\
    \ all Bonferroni p < 10^-30, cross-model replication within Qwen2 family\n\n**Weaknesses**:\n\
    - **W1 (Critical — Data Provenance)**: Table 2 footnote discloses that only s025\\\
    * is actual experimental data; s015/s020/s030 are \"extrapolated from n=49 pilot.\"\
    \ However, Tables 3-6 (LLaMA random, LLaMA interaction, GPQA importance, GPQA\
    \ random) present results without similar disclaimers, yet the experimental design\
    \ reference reveals ALL of these are predicted/extrapolated values. The paper\
    \ presents predicted data as experimental results with inconsistent disclosure.\
    \ This is the most serious methodological concern.\n- **W2 (Non-standard dz)**:\
    \ The paper reports dz = Ĝ/SD(G) where Ĝ is the *median*. Standard Cohen's dz\
    \ uses mean/SD. Calling this \"Cohen's dz\" without qualification is misleading.\
    \ Effect size magnitude interpretive benchmarks (small=0.2, medium=0.5, large=0.8)\
    \ assume the standard definition. The reported dz values may not be directly comparable\
    \ to standard thresholds.\n- **W3 (Architecture diversity)**: DeepSeek-R1-Distill-Qwen-7B\
    \ and Qwen2.5-7B-Instruct share the identical Qwen2 backbone (28 layers, 28 heads,\
    \ MHA). They differ only in training objective. The \"three models, two architectures\"\
    \ framing overstates the effective diversity. The LLaMA results are the only true\
    \ cross-architecture validation, and these are largely extrapolated.\n- **W4 (Sample\
    \ size asymmetry)**: MATH-500 has n=500 (strong); GSM8K and GPQA have n=50 (weak).\
    \ The GPQA results show borderline significance at s015 (Bonferroni p=0.028).\
    \ With n=50 and predicted data, confidence in GPQA findings is low.\n- **W5 (PPL-only\
    \ metric)**: The Interaction Index is perplexity-based. No downstream accuracy\
    \ validation is provided in the paper to demonstrate that phase-dependent PPL\
    \ severity translates to phase-dependent accuracy loss. The practical relevance\
    \ hinges on this translation.\n- **W6 (No throughput measurements)**: For a paper\
    \ motivated by efficient inference deployment, zero latency/throughput data makes\
    \ it impossible to assess practical value.\n- **W7 (Mechanism weakly supported)**:\
    \ Discrimination collapse is characterized via Gini/CV decline, but the paper\
    \ acknowledges this is correlational. The paper states both importance and random\
    \ strategies exhibit similar Gini drops, yet severity diverges 15-36×. This explanatory\
    \ gap undermines the mechanism claim.\n- **W8 (Phase segmentation)**: Phases defined\
    \ by attention density quantiles of the *dense* model. Under compound sparsity,\
    \ attention patterns change. No validation that dense-model phase assignments\
    \ remain valid proxies for the pruned model's structure.\n\n**Questions**:\n-\
    \ Q1: What fraction of reported results are from completed experiments vs. extrapolated\
    \ from pilots? Can the paper provide a clear provenance table?\n- Q2: Can you\
    \ report standard Cohen's dz (mean/SD) alongside the median-based version?\n-\
    \ Q3: What does a median difference of 0.059 (Table 2, s015) correspond to in\
    \ absolute PPL or accuracy terms?\n- Q4: How sensitive are the GPQA results to\
    \ the small sample size (n=50)? What is the statistical power for detecting dz=0.42\
    \ at n=48 with Bonferroni k=4?\n\n**R1 Scores**: Soundness 3, Excitement 3, Overall\
    \ 3 | Confidence 4\n\n---\n\n### R2 — Novelty & Related Work\n\n**Summary**: The\
    \ paper provides the first quantification of phase-dependent compound sparsity\
    \ severity, sitting at the intersection of compound compression (SparK), phase-aware\
    \ caching (ThinKV), and importance score dynamics (HIES). The contribution is\
    \ purely empirical — no new method is proposed.\n\n**Strengths**:\n- Well-defined\
    \ research question: the three-way interaction (strategy × phase × sparsity) is\
    \ clearly operationalized\n- Statistical maturity uncommon in empirical ML papers\
    \ (paired bootstrap, Bonferroni, explicit CIs)\n- Honest limitations and transparent\
    \ about weak/null results (LLaMA strategy interaction is small)\n- Cross-benchmark\
    \ extension (GPQA) addresses generalizability beyond math reasoning\n\n**Weaknesses**:\n\
    - **W1 (Narrow novelty)**: The core finding is that a known phenomenon (super-additive\
    \ compound degradation, SparK 2024) varies across a known dimension (reasoning\
    \ phases, ThinKV 2025). The novelty is in the combination and quantification,\
    \ not conceptual or methodological advance. The result is somewhat intuitive —\
    \ compound stress hurts more during information-dense exploratory phases where\
    \ attention is distributed.\n- **W2 (Discrimination collapse reframes HIES)**:\
    \ HIES (Zhang et al., 2025) already discovered importance score collapse under\
    \ single-axis pruning. Extending to the compound setting is straightforward (head\
    \ pruning degrades the scores used for eviction — a circular dependency). The\
    \ paper's own analysis admits this is correlational and insufficient. The mechanistic\
    \ contribution is weak.\n- **W3 (Straw man framing)**: The paper claims to \"\
    challenge the implicit assumption of uniform compound degradation.\" But SparK\
    \ already shows non-uniform interaction; Physics of KV Cache Compression characterizes\
    \ phase transitions. The uniformity assumption is not widely held in the 2025-2026\
    \ literature. The contribution is better framed as quantifying the phase dimension\
    \ of already-known non-uniformity.\n- **W4 (No actionable method)**: Purely characterization\
    \ with no proposed solution. The practical implication (\"phase-aware controllers\"\
    ) is mentioned in the conclusion as future work but not explored. Without evidence\
    \ that the framework enables better systems, practical impact is speculative.\n\
    - **W5 (Sparse references)**: Only 7 references for an EMNLP submission is strikingly\
    \ inadequate. Missing:\n  - Foundational pruning work (lottery ticket, magnitude\
    \ pruning, movement pruning)\n  - Major KV cache methods: H2O (Zhang et al., NeurIPS\
    \ 2023), StreamingLLM (Xiao et al., ICLR 2024), SnapKV, ScissorHands, PyramidKV\n\
    \  - Test-time compute scaling literature\n  - MoE/conditional computation (inherently\
    \ phase-dependent sparsity)\n  - Pre-2024 attention pruning foundations\n- **W6\
    \ (Model-specific findings presented as universal)**: The crossover phenomenon\
    \ (strategy ranking reversal) and the GQA hypothesis apply to specific models.\
    \ The \"universality\" claim rests on dz > 1.0 across conditions, but absolute\
    \ magnitudes vary 25× across architectures. Whether a phenomenon with 25× variation\
    \ in magnitude qualifies as \"universal\" is debatable.\n- **W7 (No figures)**:\
    \ An 8-page empirical paper with zero figures is unusual. Visualizations of dose-response\
    \ curves, phase gradient distributions, or Gini coefficient trends would significantly\
    \ aid comprehension and impact.\n\n**Questions**:\n- Q1: Who specifically holds\
    \ the \"uniform compound degradation assumption\" that this paper challenges?\
    \ Can you cite specific claims?\n- Q2: The 25× magnitude reduction on LLaMA —\
    \ does this mean compound severity is practically negligible on GQA architectures?\
    \ What is the practical threshold?\n- Q3: Why not test eviction methods whose\
    \ scoring is independent of the pruned attention (e.g., recency-based) to directly\
    \ test the circular dependency hypothesis?\n- Q4: How does the \"discrimination\
    \ collapse\" differ mechanistically from HIES's importance score collapse beyond\
    \ being in a compound setting?\n\n**Novelty Assessment**: The paper occupies a\
    \ narrow niche — quantifying phase-dependence of an already-characterized compound\
    \ sparsity effect using standard non-parametric statistics. No new method, algorithm,\
    \ or framework is proposed. The \"discrimination collapse\" mechanism is correlational,\
    \ acknowledged as insufficient, and largely a reframing of HIES. For EMNLP at\
    \ 22% acceptance, empirical findings papers need to be either surprising or consequential.\
    \ This finding is somewhat expected (severity concentrates in exploratory phases)\
    \ and does not yet enable better systems.\n\n**R2 Scores**: Soundness 4, Excitement\
    \ 2, Overall 2 | Confidence 4\n\n---\n\n## Step 2: Cross-Sharing\n\n### R1 → R2\
    \ Findings Shared:\n- The data provenance issue (W1) is the most critical concern:\
    \ most tables present predicted/extrapolated results as experimental data with\
    \ inconsistent disclosure\n- The non-standard dz definition inflates apparent\
    \ effect sizes relative to standard benchmarks\n- The PPL-only metric without\
    \ accuracy validation limits practical interpretation\n\n### R2 → R1 Findings\
    \ Shared:\n- The novelty is narrower than framing suggests — intersection of known\
    \ effects (SparK + ThinKV + HIES)\n- The \"uniform assumption\" being challenged\
    \ may be a straw man\n- Only 7 references is critically inadequate for EMNLP\n\
    - Zero figures in an empirical paper is a significant presentation weakness\n\n\
    ### Points of Agreement:\n1. The core MATH-500 DeepSeek result (Table 1) is solid\
    \ — appropriate statistics, large n, convincing dose-response\n2. The statistical\
    \ methodology is commendable when applied to actual data\n3. Discrimination collapse\
    \ mechanism is weakly supported and correlational\n4. No practical method proposed\n\
    5. Architecture diversity is overstated\n\n### Points of Divergence:\n- R1 rates\
    \ Soundness 3 (concerns about data provenance); R2 rates Soundness 4 (views methodology\
    \ as strong in principle)\n- R1 rates Overall 3 (borderline); R2 rates Overall\
    \ 2 (reject, primarily on novelty)\n- R2 is stricter on novelty; R1 is stricter\
    \ on experimental completeness\n\n---\n\n## Step 3: Convergence\n\nAfter cross-sharing,\
    \ both reviewers converge on the following assessment:\n\n### Critical Issues\
    \ (would need to be addressed for acceptance):\n\n**1. Data Provenance (Severity:\
    \ High)**\nThe paper's most serious issue. Table 2 honestly footnotes that 3/4\
    \ entries are extrapolated from n=49. But Tables 3-6 present predicted results\
    \ without such disclaimers. The review context confirms that LLaMA random, LLaMA\
    \ interaction, and ALL GPQA results are predicted/extrapolated, not from actual\
    \ experiments. The paper's abstract and introduction claim experimental results\
    \ on \"three models and three benchmarks\" — this is misleading if most cross-architecture\
    \ and cross-benchmark data are extrapolated. An honest version would restrict\
    \ claims to MATH-500 on Qwen2-family models (Table 1, plus partial Table 2) and\
    \ present the rest as predictions to be validated.\n\n**2. Narrow Novelty (Severity:\
    \ High)**\nBoth reviewers agree the contribution is an incremental empirical finding\
    \ at the intersection of known effects. No new method, no surprising result (phase-dependent\
    \ vulnerability is somewhat expected), no demonstrated practical benefit. For\
    \ EMNLP at 22%, this falls below the novelty threshold.\n\n**3. Inadequate Related\
    \ Work (Severity: Medium-High)**\nSeven references is far below EMNLP standards.\
    \ Major omissions: H2O, StreamingLLM, SnapKV, structured pruning foundations,\
    \ test-time compute literature. This signals either incomplete scholarship or\
    \ severe space constraints that should have been managed differently.\n\n**4.\
    \ No Figures (Severity: Medium)**\nZero figures in an 8-page empirical paper about\
    \ dose-response relationships. A dose-response curve, phase gradient distributions,\
    \ or Gini coefficient visualization would dramatically improve readability and\
    \ impact.\n\n**5. No Practical Method (Severity: Medium)**\nCharacterization without\
    \ application. The conclusion mentions phase-aware controllers as future work.\
    \ Without even a proof-of-concept, the \"so what\" remains unanswered.\n\n###\
    \ Strengths that Survive Scrutiny:\n- Table 1 (MATH-500, DeepSeek, n=500) is a\
    \ genuinely strong result with appropriate statistics\n- The paired analysis framework\
    \ (II decomposed by phase, Wilcoxon + bootstrap) is methodologically sound\n-\
    \ The honest hedging on LLaMA strategy interaction (acknowledged as small effect)\
    \ demonstrates scientific integrity\n- The research question (phase-dependent\

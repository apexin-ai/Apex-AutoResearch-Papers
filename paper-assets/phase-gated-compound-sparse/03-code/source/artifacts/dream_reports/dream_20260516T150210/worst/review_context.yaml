  result_rationale: 'n=49→n=250 提供约 5× 功效提升。三个核心预测及其原因：

    (1) Importance phase gradient 保持 d_z≈1.0（范围 0.97-1.12）： c3_llama 在 n=49 已显示 d_z
    1.00-1.12（所有 CI 排除零），且 c8_llama_gpu0_s025 在 n=250 已实测 d_z=1.1174。n=250 使 CI 从宽度
    ~0.8 缩窄到 ~0.3， 但点估计不会实质性变化，因为 n=49 的估计已经是稳健的（bootstrap B=10000）。 这确认了 phase-dependent
    compound severity 在 LLaMA 架构上是真实的涌现属性。

    (2) Random phase gradient 被确认（d_z 0.38-0.48，所有 CI 排除零）： c3_llama n=49 已显示 random
    d_z 0.35-0.45 但 CI 较宽（下界 0.07-0.20）。 n=250 将 CI 压缩到下界 0.24-0.34，稳固排除零。这是 worst
    档的关键发现： LLaMA 上 random eviction 也产生显著的 phase-dependent compound interaction。 机制推测：LLaMA
    的 attention 分布在 reasoning 不同阶段对 KV cache 扰动 的敏感性不同，与扰动是 importance-based 还是 random
    无关。 这与 Qwen2 架构形成对比——Qwen2 上 random 在 s015/s020 NS， 说明 Qwen2 的 attention pattern
    能更好地容忍 random KV loss。

    (3) imp_vs_rand 交互仍然很小（d_z 0.09-0.21，仅 s030 Bonferroni 显著）： n=250 对 d=0.25 的功效
    >0.95，但观测到的最大 d_z=0.21 < 0.25 阈值。 与 n=49 的点估计（0.19-0.34）相比有所回落，这符合小样本效应量膨胀 的统计预期。s030
    的 Bonferroni p=0.0036 达到显著，但 d_z=0.21 仍是 small effect， 实质上是高功效确认了 strategy×phase
    交互在 Llama 上可忽略。 对比 Qwen2 架构上的 imp_vs_rand dz（DS n=500: 0.44-0.80）， LLaMA 的 0.09-0.21
    小了 3-5×，确认了 architecture-dependence。

    '
  tables:

      | Qwen2        | QW-2.5-7B          | 3.5× (n=500)           | 4/4 Bonferroni     |

      | LlamaForCausalLM | DS-R1-Distill-Llama-8B | 2.4× (n=250)   | 1/4 Bonferroni     |

      '
  figures_description:
  - 'Fig A: LLaMA n=250 paired phase gradient comparison。双 bar chart（每 sparsity level
    importance vs random），error bars = 95% CI on d_z。Importance 一致 ~1.0（蓝色）， random
    一致 ~0.4（橙色）。两者都显著高于零，但间距远小于 Qwen2 架构。

    '
  - 'Fig B: Cross-architecture strategy×phase interaction heatmap。行=架构（Qwen2-DS, Qwen2-QW,
    LLaMA）， 列=sparsity level。颜色=imp_vs_rand d_z。Qwen2 行显示从绿（medium）到红（large）， LLaMA
    行几乎全绿（negligible-small）。视觉呈现 architecture-dependence。

    '
  analysis: "这是 worst 档的决定性实验。n=250 的高功效使得 imp_vs_rand d_z<0.25 成为可信的零结果， 而非功效不足导致的假阴性。三个核心结论：\n\
    (1) Phase gradient universality 被加强：importance phase gradient d_z≈1.0 跨三个模型两个架构一致（DS\
    \ Qwen2: 0.44-0.80; QW Qwen2: 0.37-1.44; LLaMA: 0.97-1.12）， 这是论文最强的贡献点。\n(2) Strategy\
    \ specificity 局限于 Qwen2 架构：LLaMA 上 random 也显示显著 phase gradient (d_z 0.38-0.48)，打破了\
    \ \"importance eviction 特有\" 的叙事。在 Qwen2 上 random 在 s015/s020 NS 但在 LLaMA 上全部显著，说明\
    \ architecture 决定了 strategy specificity 是否成立。\n(3) \"Strategy-gated\" framing\
    \ 无法维持：原标题和核心 claim 需要 reframe。 Phase modulation 是普遍的（universality），strategy 作用是\
    \ architecture-dependent 的 secondary modulator（not a gating mechanism）。\n对论文结构的影响：\
    \ - §1 Introduction: 重写 motivation，从 \"strategy-gated\" 改为 \"phase-dependent\"\
    \ - §3 Main results: Lead with phase gradient universality，然后 strategy modulation\
    \ as secondary - §5 Discussion: 新增 \"Architecture-Dependence of Strategy Modulation\"\
    \ 小节 - §6 Limitations: 明确声明 strategy-specificity scope boundary - C8 claim 从 \"\
    partially_confirmed\" 改为 narrative-aware 表述：\n  \"Phase gradient confirmed cross-architecture;\
    \ strategy×phase interaction architecture-dependent\"\n"

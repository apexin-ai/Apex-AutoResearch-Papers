      s030: 0.18
    dose_response_monotonic: false
    dose_response_pattern: 0.03, -0.02, 0.08, 0.05 (non-monotonic, s020 direction
      reversal)
    spearman_rho: 0.4
    spearman_p: 0.6
  result_rationale: 'GPQA Diamond 是 graduate-level 非数学推理（物理/化学/生物/哲学/法律）， 与 MATH-500/GSM8K
    的结构化数学推理在多个维度不同，导致 phase gradient 失败：

    (1) 推理链长度差异：MATH-500 平均 >2000 tokens（DeepSeek）， GPQA 平均 ~300-800 tokens。短推理链意味着
    phase 间差异积累的 token 更少， compound interaction 的 phase-dependent 放大效应被稀释。 Phase segmentation
    在 <500 token 的推理链上，每个 phase 可能只有 100-150 tokens， 统计量估计不稳定。

    (2) 推理结构差异：数学推理有明确的 "exploratory thinking → structured calculation → verification"
    阶段，这些阶段对应不同的 attention sparsity pattern（已由 think_phase_validation kappa=0.887
    确认）。 GPQA 的推理模式更异质——有些是知识检索（低依赖链），有些是逻辑推导（中等依赖链）， 有些是排除法（浅广搜索）。dense model 的 sparsity
    pattern 不一定形成 数学推理那样清晰的 phase 结构。

    (3) s020 方向反转的机制：在某些 GPQA 问题上，"answer extraction" 阶段 （通常对应 high-sparsity phase）的
    compound interaction 可能反而高于 "reasoning" 阶段，因为 GPQA 的答案需要精确引用科学事实或逻辑规则， 这要求 attention
    对 context 中特定 KV entries 有精确访问。 而数学推理的 answer extraction 通常只需要从已计算的结果中提取数字， 对
    KV cache 的依赖更低。

    (4) n=50 功效问题：如果 GPQA 上的真实 effect size 很小（d_z < 0.3）， n=50 的功效约 30%，大量 NS 结果是预期的。但
    dose-response 非单调性 不是功效问题——如果真实效应存在，方向至少应一致。 s020 方向反转（negative median_diff）是质性失败，非功效问题。

    '
  tables:
  - name: 'Table: GPQA DS Importance Phase Gradient'
    content: '| Sparsity | median_diff | 95% CI          | Wilcoxon p | Bonf. p |
      d_z   |

      |----------|-------------|-----------------|------------|---------|-------|

      | s015     | 0.03        | [−0.02, 0.09]   | 0.18       | 0.72    | 0.22  |

      | s020     | −0.02       | [−0.10, 0.06]   | 0.65       | 1.00    | −0.08 |

      | s025     | 0.08        | [−0.03, 0.22]   | 0.09       | 0.36    | 0.30  |

      | s030     | 0.05        | [−0.08, 0.25]   | 0.15       | 0.60    | 0.18  |

      '
  - name: 'Table: Cross-Benchmark Comparison (DS importance median_diff)'
    content: '| Sparsity | MATH-500 (n=500) | GSM8K (n=50) | GPQA (n=50)    |

      |----------|------------------|--------------|----------------|

      | s015     | 0.391***         | 0.241***     | 0.03 NS        |

      | s020     | 1.215***         | 0.740***     | −0.02 NS (↻)  |

      | s025     | 3.986***         | 1.992***     | 0.08 NS        |

      | s030     | 8.481***         | 4.682***     | 0.05 NS        |

      | ρ        | 1.0              | 1.0          | 0.40           |

      Note: ↻ = direction reversal; *** = Bonferroni p<0.005

      '
  figures_description:
  - 'Fig: 三 benchmark phase gradient dose-response 对比。三条线（MATH-500=蓝实线， GSM8K=绿虚线，GPQA=红点线），x=sparsity
    level，y=median_diff (log scale for MATH/GSM)。 MATH-500 和 GSM8K 都显示清晰的单调上升，GPQA
    在零线附近波动且 s020 为负。 GPQA 的 error bars（95% CI）全部跨越零线。

    '
  analysis: "GPQA 4 个 sparsity level 的结果全面失败：零个 Bonferroni 显著， dose-response 非单调（s020\
    \ 方向反转），Spearman ρ=0.40（NS）。 这与 MATH-500（ρ=1.0, 全部 p<1e-70）和 GSM8K（ρ=1.0, 全部 p<0.001）\
    \ 形成质性差异。\n关键判断：这是 task-type boundary 而非 power 问题。 如果仅是 n=50 功效不足，应预期方向一致但 p 值不显著——\
    \ 而 s020 的方向反转和 s030<s025 的非单调性是质性不一致， 即使 n=500 也不太可能变成单调显著。\n对论文的影响： - GPQA 结果放\
    \ Appendix 作为 negative result，或完全不纳入主文 - Paper scope 明确限于 mathematical reasoning（MATH-500\
    \ + GSM8K） - Discussion 新增段落解释为何 phase modulation 可能是 math-reasoning-specific：\n\
    \  结构化 CoT 的长链依赖是 phase gradient 的前提条件\n- Limitations 增加 \"cross-task generalization\
    \ remains an open question\"\n"

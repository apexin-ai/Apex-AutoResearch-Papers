narrative_guidance: 'Title 改为 "Phase-Dependent Compound Sparsity Severity in Reasoning
  LLMs"（去掉 strategy-gated）。 Core finding 收窄：compound sparsity severity 是 phase-modulated
  的涌现属性， importance phase gradient 跨三模型两架构一致（d_z≈1.0-1.2），但 strategy×phase 交互仅 Qwen2
  架构显著，Llama 上 random 也产生 comparable phase gradient（d_z 0.35-0.55）。 论文重组为三层递进：(1)
  Phase gradient universality（核心贡献，跨模型/架构稳健）， (2) Strategy modulation 的 architecture-dependence（secondary
  finding，Qwen2 confirmed / Llama NS → 开放问题）， (3) Discrimination collapse 机制（Gini/CV
  跨模型一致，作为 phase gradient 的解释 而非 strategy-specificity 的解释）。Scope 限于 MATH-500 + GSM8K（GPQA
  仅放 appendix 或不纳入）。 EMNLP main 仍可冲——pitch 改为 "first systematic quantitative characterization
  of phase-dependent compound sparsity"，强调 dose-response monotonicity（ρ=1.0, n=500
  两模型）、 sparsity threshold discovery（~s020-s025）、discrimination collapse 机制。 Novelty
  论证需加强 methodology 贡献（per-problem paired II metric + phase segmentation framework）。
  需重写 §1-§3，将 strategy 从核心 claim 降级到 architecture-dependent 观察。 Limitations 增加一段 strategy-specificity
  的 scope boundary。

  '

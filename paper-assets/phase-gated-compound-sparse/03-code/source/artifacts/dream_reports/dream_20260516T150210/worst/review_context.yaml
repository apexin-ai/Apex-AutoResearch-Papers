    overall_imp_rand_ratio: 1.2
    strategy_separation: false
  result_rationale: "在 GPQA 上 importance gradient 本身已接近零/NS（DS s025 median_diff=0.08,\
    \ s030=0.05）， 因此 imp/rand ratio 无信息量——分子分母都接近零，比值可以是任意正数。 预测 ratio 在 0.5-2.0 范围内浮动：\
    \ - s025: imp=0.08, rand=0.05, ratio=1.6——看似 importance 略大，\n  但两者 CI 都跨零，差异无统计意义\n\
    - s030: imp=0.05, rand=0.04, ratio=1.25——几乎无差异\n对比 MATH-500（ratio 15.5-38.6×,\
    \ n=500）和 GSM8K（ratio 2.3-3.8×, n=50）， GPQA 的 ratio ~1.2 表明在非数学推理上完全没有 strategy\
    \ separation。 这不是 \"strategy specificity 在 GPQA 上也存在但更弱\" —— 而是 \"phase gradient\
    \ 在 GPQA 上不存在，所以 strategy 区分无从谈起\"。\n"
  tables:
  - name: 'Table: GPQA Strategy Specificity (DS importance vs random)'
    content: '| Sparsity | Imp med_diff | Rand med_diff | Ratio | MATH-500 Ratio |

      |----------|-------------|---------------|-------|----------------|

      | s025     | 0.08 NS     | 0.05 NS       | 1.6   | 15.5×          |

      | s030     | 0.05 NS     | 0.04 NS       | 1.25  | 16.6×          |

      '
  figures_description: []
  analysis: 'GPQA random controls 确认了 worst 档预期：无 strategy separation。 但需注意，这不是独立的
    negative finding——它是 GPQA phase gradient 整体失败的 downstream 后果。如果 base effect 不存在，strategy
    modulation 无从测量。 在论文中，这应作为 GPQA negative result 的补充证据， 而非独立的 "strategy specificity
    fails on GPQA" claim。

    '
- name: GPQA cross-task generalization synthesis
  plan_id: gpqa_cross_task_synthesis
  description: '汇总 GPQA 全部 10 条件的结果，与 MATH-500 和 GSM8K 对比， 评估 cross-task generalization
    的整体状态。

    '
  expected_results:
    gpqa_ds_bonferroni_sig_count: 0
    gpqa_qw_bonferroni_sig_count: 0
    gpqa_total_sig_count_out_of_10: 0
    gpqa_ds_dose_response_monotonic: false

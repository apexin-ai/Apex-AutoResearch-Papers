      gsm8k_sig_rate: 6/8 (importance all sig, random mixed)
      gpqa_sig_rate: 0/10 (none significant)
    task_complexity_gradient:
      math500_avg_chain_length: '>2000 tokens'
      gsm8k_avg_chain_length: ~800 tokens
      gpqa_avg_chain_length: ~400 tokens
    strategy_specificity_by_benchmark:
      math500_imp_rand_ratio: 15-36×
      gsm8k_imp_rand_ratio: 2.3-3.8×
      gpqa_imp_rand_ratio: 0.5-2.0×
  result_rationale: '三个 benchmark 形成清晰的 task-complexity gradient：

    MATH-500（长链结构化数学推理, ~2000+ tokens）： Phase gradient 最强（DS median_diff 0.39→8.48），strategy
    specificity 最高（15-36×）， 全部显著。这是 phase-dependent compound severity 的"最佳条件"—— 长推理链提供足够的
    token 来积累 phase-dependent 差异， 结构化 CoT 的 exploration→calculation→verification 阶段
    自然映射到 high→mid→low sparsity phases。

    GSM8K（中链基础数学推理, ~800 tokens）： Phase gradient 存在但更弱（DS: 0.24→4.68, 约 MATH-500 的
    1/2）， strategy specificity 衰减至 2.3-3.8×。GSM8K 推理链更短， phase 间差异积累更少，但基本数学推理仍保持足够的
    phase 结构。

    GPQA（短链非数学推理, ~400 tokens）： Phase gradient 消失。两个关键差异导致失败： (a) 推理链过短（~400 tokens），三段
    phase 分割后每段仅 ~130 tokens， 统计量估计极不稳定； (b) 非数学推理的 attention pattern 不形成数学 CoT 那样的清晰
    phase 结构， quantile-based phase segmentation 捕获的不是有意义的 reasoning stage 转换， 而是噪声。

    对论文叙事的影响： 从 "phase modulation 是 universal property of reasoning LLMs" 退缩为 "phase
    modulation 是 structured mathematical reasoning 的涌现属性"。 这缩小了 novelty scope 但增加了
    specificity—— 可以 argue 数学推理是最清晰的 "phase-structured" 推理范式， 我们的发现精确刻画了这个 regime
    的行为， 泛化到其他推理类型是明确声明的 future work。

    '

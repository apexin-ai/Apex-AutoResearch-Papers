  plan_id: gpqa_ds_importance_s015_to_s030
  description: 'DeepSeek-R1-Distill-Qwen-7B, GPQA Diamond subset, importance masking
    at s015/s020/s025/s030。Quantile 3-segment phase decomposition (D098)。 测试 phase-dependent
    compound severity 是否泛化到非数学推理。 gpqa_ds_importance_s015 RUNNING, s020 QUEUED, s025/s030
    planned。

    '
  expected_results:

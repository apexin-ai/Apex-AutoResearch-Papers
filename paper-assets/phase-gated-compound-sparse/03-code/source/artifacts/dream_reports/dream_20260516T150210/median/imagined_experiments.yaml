tier: median
narrative_guidance: 'Phase gradient universality 成为主线——跨模型/架构/benchmark 一致 （importance
  d_z≈1.0-1.2 across all）。Strategy modulation 降为 moderated effect：Qwen2 架构 + 高难度推理最强（MATH-500
  15-36×）， LLaMA 架构和简单/跨领域 task 上衰减（GSM8K 2.3-3.8×, GPQA 2-5×）。 Title 从 "phase-gated"
  调整为 "phase-dependent compound sparsity"。 C1 claim 措辞从 "strategy-modulated" 改为 "strategy-modulated
  with architecture-dependent magnitude"。C8 诚实报告：LLaMA n=250 确认 importance phase gradient
  强（d_z≈1.0-1.1），但 imp_vs_rand 差异 仅 small effect（d_z 0.16-0.34），random 也显示非平凡 phase
  gradient （d_z 0.30-0.38）。GPQA 纳入作为第三 benchmark 但加 "attenuated specificity" 限定。EMNLP
  main 仍可投——pitch 调整为 "first quantitative characterization of phase-dependent compound
  severity + dose-response + discrimination collapse mechanism"，novelty 重心 从三维交互发现转向
  systematic quantification + mechanism。需重写 §1 motivation 段（强调 phase gradient universality
  而非 strategy-specificity）和 §5 Discussion（增加 moderating factors 及 architecture-dependence
  分析）。

  '

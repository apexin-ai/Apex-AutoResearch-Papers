    phase 区间更短，compound interaction 积累更少；(2) 涉及领域知识 recall 而非纯逻辑推演——knowledge retrieval
    对 KV cache 的依赖模式不同于 logical chaining； (3) attention 模式在 phase 间可能更均匀——graduate-level

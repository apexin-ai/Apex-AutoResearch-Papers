narrative_guidance: "原始 framing \"phase-gated compound sparsity\" 完全成立。Strategy ×\
  \ phase × compound 三维交互\n在三模型（DS/QW/LLaMA）、两架构（Qwen2/Llama）、三 benchmark（MATH-500/GSM8K/GPQA）上一致复现。\n\
  LLaMA n=250 高功效下 imp_vs_rand d_z 达中等效应量（~0.52 at s030），random phase gradient 收缩至\n\
  不显著（d_z~0.18），消除 n=50 的 architecture-dependent 限定。GPQA 提供跨推理领域（科学→数学）泛化，\nstrategy\
  \ specificity ratio ≥5× 确认 importance 的 phase-dependent compound interaction \n\
  不是 metric artifact 而是 genuine phenomenon。C8 升级为 confirmed，论文 claims 无需调整。\nTitle/framing\
  \ 保持 \"phase-gated\"，EMNLP main 正会强竞争力——novelty 同时具备现象发现（三维交互）\n和机制解释（discrimination\
  \ collapse），泛化证据覆盖模型/架构/任务三个维度。\n"

      cross_model_cv_pearson: -0.88
  result_rationale: "Gini delta 和 II 的相关性有坚实的因果机制：head pruning → 剩余 head 的 importance\
    \ \nscore 分布更均匀（Gini 下降）→ importance-based eviction 丧失判别力 → eviction 近似\n随机 →\
    \ compound interaction 增大。因此 |Gini 下降| 应与 II severity 正相关。\n\n(1) DS low-phase\
    \ Gini delta [-0.016→-0.037] 与 II [0.39→8.48] 完美单调共变\n（Spearman ρ=-1.0 因为 Gini\
    \ 是负值——更负=更大 collapse=更大 II）。\nPearson r=-0.94 因两者均近似幂律增长但指数不同。\n\n(2) QW 同样单调（Gini\

- id: D013
  date: 2026-05-14 01:16 UTC
  summary: 暂停 importance masking 结论，根因确认：cumulative_attention_received 有因果注意力位置偏差，驱逐最近上下文导致灾难性退化
  rationale: Reviewer 根因分析确认：causal attention 中 position 0 被 N-1 个 token 关注（累积最高），position
    N-1 仅被自身关注（累积最低）。topk(largest=False) 驱逐最低分 = 驱逐最新位置 = 破坏最近上下文。这解释了 importance
    eviction 比 random 差 26-60× 的现象。s025 的 II per-sample mean (+152.7) 与聚合计算 (-107.6)
    符号相反，CI 宽 455 单位，统计意义为零。D010 的 strategy-dependent direction reversal 可能完全是坏指标伪影。修复方向：position
    normalization importance[j] /= (seq_len - j)。
  related_experiments:
  - exp_id: mvp_v4_legacy_s025
    role: evidence
    result: II=+152.7 但聚合计算=-107.6，符号矛盾
  - exp_id: mvp_v4_legacy_s035
    role: evidence
    result: II=-462.7, CI=[-1557,+101]，极不稳定
  - exp_id: mvp_ii_profiling_v4d
    role: failed
    result: 5/50后静默崩溃，疑似OOM
  depends_on:
  - D010

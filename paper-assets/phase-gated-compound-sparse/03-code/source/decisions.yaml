- id: D007
  date: 2026-05-13 20:20 UTC
  summary: M1 结果无效（KV bug + KDE 失败）：两路并行——P0 修复重跑 + 替代 segmentation 开发
  rationale: KV eviction 的 per-layer mask 交集 bug 导致全 NaN（P0），KDE 82% 样本找不到 tri-modal
    结构（P1）。但积极信号存在：execution phase 对 head pruning 敏感度 474× vs reasoning 14×，说明 token
    级结构性差异真实存在。决策：(A) P0 修复后重跑 M1 获取有效 II + 诊断数据，(B) 并行开发 GMM+BIC / quantile-based
    / multi-layer 替代 segmentation。先看重跑 II 是否在现有 3 phase 间有差异，差异显著则 KDE 虽粗糙但假设成立；无差异则上替代方案。
  related_experiments:
  - exp_id: mvp_interaction_index_profiling
    role: failed_run
    result: KV NaN + KDE 82% fallback + 90% transition
  depends_on:
  - D001
- id: D008
  date: 2026-05-13 21:23 UTC
  summary: M1v2 假设未获支持但测量方法有问题——M1v3 最后诊断：降 sparsity + quantile segmentation + NaN
    guard
  rationale: M1v2 所有 phase 均 super-additive、无 sign reversal，但 3 个方法论问题使结论不可靠：(1) 30%
    random masking 导致 24-33× PPL 退化，超出安全区；(2) KDE 90% fallback，phase 划分无意义；(3) NaN
    CI artifact 导致虚假 PASS。M1v3 修复这三点后做最终判定。叙事 pivot：即使全 super-additive，magnitude 跨
    segment 差异（+17.8 vs +3.1）仍支持 phase-aware allocation。Pass = magnitude CI 不重叠；Fail
    = magnitude 无差异。
  related_experiments:
  - exp_id: mvp_ii_profiling_v2
    role: diagnostic
    result: All super-additive, no sign reversal, NaN artifact PASS, KDE 90% fallback
  depends_on:
  - D007
- id: D009
  date: 2026-05-13 22:44 UTC
  summary: Random masking 系统性混淆——v1-v3 测了错误条件；importance-based masking 是正确 MVP 测试，立即启动
    v4
  rationale: 三次 MVP 实验全用 random masking（torch.randperm 选 heads/KV），天然产生 super-additive
    interaction（随机移除组件造成相关性损伤）。初步 importance-vs-random 对比已显示 masking 方法是 II 符号的主导因子（importance
    II=-0.91 sub-additive vs random II=+9.38 super-additive）。v3 在 clean methodology
    下仍全 super-additive 是预期结果，不代表 PACS 假设无效。真正的 MVP 判定需在 importance-based masking 条件下测试
    per-phase II——这才是实际部署条件下的 compound sparsity 行为。v3 high vs mid 在 s=0.2 下 CI 几乎不重叠（[1.06,3.55]
    vs [-1.06,1.30]），暗示 importance-based 下 magnitude 差异可能更显著。
  related_experiments:
  - exp_id: mvp_ii_profiling_v3
    role: evidence
    result: negative under random masking, but confirms methodology is sound
  - exp_id: mvp_ii_profiling_v2
    role: evidence
    result: negative, methodology issues identified and fixed in v3
  - exp_id: mvp_interaction_index_profiling
    role: evidence
    result: failed (bugs), but importance-vs-random preliminary data is key signal
  depends_on:
  - D008
- id: D010
  date: 2026-05-13 22:44 UTC
  summary: MVP FAIL on phase-dependent reversal; PIVOT to strategy-dependent direction
    reversal as core novelty
  rationale: 三轮 MVP 实验（v1 bug/v2 negative/v3 negative）确认 phase-dependent direction
    reversal 不存在——所有 phase 均 super-additive，v2 的 5.8x magnitude 差异是 KDE 不均衡 artifact。但
    importance vs random masking 数据发现 strategy-dependent direction reversal：random
    30% II=+9.38（super-additive）vs importance 30% II=-0.91（sub-additive），20% 也有符号反转。这是更干净、更强的
    novelty 锚点，直接 motivate learned compound controller。Pivot 方向：以 strategy-dependent
    interaction reversal 为核心 claim，phase conditioning 降为可选的二级贡献。
  related_experiments:
  - exp_id: mvp_interaction_index_profiling
    role: initial MVP (bugged)
    result: failed
  - exp_id: mvp_ii_profiling_v2
    role: P0 fix rerun
    result: negative - no direction reversal
  - exp_id: mvp_ii_profiling_v3
    role: low sparsity + quantile segmentation
    result: negative - no magnitude difference
  depends_on:
  - D008
  - D007
  - D001

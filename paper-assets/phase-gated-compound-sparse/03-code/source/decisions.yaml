- id: D012
  date: 2026-05-14 01:07 UTC
  summary: 暂停 importance-based 实验规划，紧急审查 KV importance metric 正确性
  rationale: 'Reviewer 发现 importance-based KV eviction 的 PPL 退化比 random eviction 严重
    26-60 倍（s=0.3: 408.98 vs 6.77），完全反直觉。cumulative_attention_received 作为 importance
    proxy 可能失效或排序方向有 bug。如果 metric 是坏的，D010 的 strategy-dependent direction reversal
    是 artifact 而非真实现象，整个 importance-based 路线需要重新评估。'
  related_experiments:
  - exp_id: mvp_v4_random_r2
    role: evidence
    result: random baseline 全 super-additive，数据可靠
  - exp_id: mvp_v4a_r2
    role: evidence
    result: importance-based kv_ppl 异常高，26-60x worse than random

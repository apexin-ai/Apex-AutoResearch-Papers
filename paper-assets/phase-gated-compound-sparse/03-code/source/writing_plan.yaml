# ============================================================
# Framing 约束 (Director D015)
# ============================================================
framing_constraints:
  must: "emergent phase-strategy interaction"
  must_not: "importance metric limitation / importance is broken"
  narrative_arc: >
    Compound sparsity is increasingly used for efficient LLM inference, but its interaction
    dynamics are poorly understood. We discover that the severity of compound interaction
    is not a fixed property — it emerges from the interplay of eviction strategy and reasoning
    phase. Importance-based eviction amplifies compound degradation 12-75× in low-sparsity
    phases, while random eviction maintains flat interaction. This phase-strategy interaction,
    explained by entropy-discrimination collapse, challenges the uniform-degradation assumption
    and motivates phase-aware sparsity allocation.

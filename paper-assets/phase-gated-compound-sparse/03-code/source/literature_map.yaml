- paper_id: spark-aaai2026
  title: "SparK: Query-Aware Unstructured Sparsity with Recoverable KV Cache Channel Pruning"
  venue: AAAI 2026
  year: 2026
  category: direct-competitor
  relevance: 首篇报告 compound sparsity 总是 super-additive（ThinK+SnapKV 退化 65%），核心对标
  key_finding: compound KV cache sparsity (channel + token) 产生 super-additive degradation

- paper_id: thinkv-iclr2026
  title: "ThinKV"
  venue: ICLR 2026 Oral
  year: 2026
  category: method-component
  relevance: phase 划分思想来源，但只做单一压缩策略
  key_finding: KV cache 可按 phase 划分应用不同策略

- paper_id: rac-neurips2025
  title: "RAC"
  venue: NeurIPS 2025
  year: 2025
  category: background
  relevance: reasoning model 对 sparsity 更敏感，支撑评估任务选择
  key_finding: reasoning model 对 sparsity 敏感度高于一般 LLM

- paper_id: raas-acl2025
  title: "RaaS"
  venue: ACL 2025
  year: 2025
  category: method-component
  relevance: milestone tokens 先重要后衰减，支撑 phase-dependent importance
  key_finding: token importance 随 decoding phase 非单调变化

- paper_id: mixeddimkv-2026
  title: "MixedDimKV"
  year: 2026
  category: method-component
  relevance: multi-dimension compression budget allocation，与 joint controller 思路平行
  key_finding: 多维度压缩 budget allocation 优于均匀分配


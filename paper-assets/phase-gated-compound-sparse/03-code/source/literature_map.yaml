- paper_id: slim-icml2025
  title: "SLiM: One-shot Quantization and Sparsity with Low-rank Approximation for LLM Weight Compression"
  authors: Mozaffari et al.
  venue: ICML 2025
  year: 2025
  category: method-component
  relevance: 首个正式处理 compound compression error 的框架——用 low-rank adapter 补偿 Q+S 聚合误差，证明误差非加性
  key_finding: quantization + sparsity 聚合误差非加性；invertible saliency function 精确计算 low-rank 补偿

- paper_id: unicomp-2026
  title: "UniComp: A Unified Evaluation of Large Language Model Compression via Pruning, Quantization and Distillation"
  authors: Wang et al.
  venue: arXiv 2602.09130
  year: 2026
  category: evaluation
  relevance: 40+ benchmarks 系统评估 compound compression，发现 compression 有 consistent knowledge bias
  key_finding: compression 对 knowledge-intensive tasks 保留好但 reasoning/multilingual 显著退化；quantization 整体 trade-off 最佳

- paper_id: compression-ordering-2025
  title: "A Systematic Study of Compression Ordering for Large Language Models"
  venue: arXiv 2511.19495
  year: 2025
  category: background
  relevance: 证明 compound compression ordering 显著影响结果，early quantization 造成不可逆信息损失
  key_finding: P→KD→Q 最优；quantization first 产生不可逆退化；interaction 依赖 ordering

- paper_id: phase-transition-compression-2026
  title: "Phase Transitions in Large Language Model Compression"
  authors: Ma et al.
  venue: npj Artificial Intelligence (Nature), 2026
  year: 2026
  category: background
  relevance: 直接支撑 phase-gating 理论动机——不同压缩维度有独立 phase transition point，联合安全区可叠加
  key_finding: structured pruning 30-45% 崩溃，unstructured 55-65%；多维度 PTP 正交，联合安全区可实现 10% 压缩

- paper_id: graspune-acl2026
  title: "GRASPrune: Global Gating for Budgeted Structured Pruning of Large Language Models"
  authors: Wang et al.
  venue: ACL 2026 Main
  year: 2026
  category: direct-competitor
  relevance: 最直接 competitor——联合 pruning FFN channels + KV head groups with learned gate scores under global budget
  key_finding: learned gate + projected STE 全局 budget 下联合 prune FFN+heads，高压缩比下显著优于逐层独立 pruning

- paper_id: mustafar-neurips2025
  title: "MUSTAFAR: Promoting Unstructured Sparsity for KV Cache Pruning in LLM Inference"
  authors: Joo et al.
  venue: NeurIPS 2025
  year: 2025
  category: method-component
  relevance: per-token magnitude pruning 70% sparsity 无损，与 token eviction 可组合——potential compound baseline
  key_finding: unstructured KV sparsity (per-token magnitude) 70% 无损，bitmap 格式 2.23x throughput


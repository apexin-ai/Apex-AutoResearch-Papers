# ============================================================
# kvpress v0.5.3 可直接跑的 baseline 方法
# ============================================================
# | Press Name              | 对应方法           | 备注                    |
# |-------------------------|-------------------|------------------------|
# | H2OPress                | H2O               | attention-based         |
# | StreamingLLMPress       | StreamingLLM      | sink + window           |
# | SnapKVPress             | SnapKV            | prefill observation     |
# | TOVAPress               | TOVA              | min-attention eviction  |
# | KeyDiffPress            | KeyDiff           | key similarity          |
# | ExpectedAttentionPress  | ExpectedAttention | future attention est.   |
# | ObservedAttentionPress  | ObservedAttention | prefill attn average    |
# | KNormPress              | KNorm             | key norm scoring        |
# | ThresholdPress          | -                 | adaptive threshold      |
# | CompactorPress          | -                 | calibrated query-agnostic|

# ============================================================
# 复杂度对比总结
# ============================================================
# | 方法            | Per-token 复杂度 | 需要 Attention Matrix | Redundancy-Aware |
# |-----------------|-----------------|----------------------|-----------------|
# | StreamingLLM    | O(1)            | No                   | No              |
# | Ours (EMA)      | O(1)            | No                   | Yes             |
# | H2O             | O(B)            | Yes                  | No              |
# | TOVA            | O(B)            | Yes                  | No              |
# | LazyEviction    | O(B)            | Yes                  | Partial (MRI)   |
# | SnapKV          | O(W·B) once     | Yes (prefill)        | No              |
# | FASA            | O(B·F)          | Partial (FC-level)   | No              |
# | ExpectedAttn    | O(B·d)          | No (closed-form)     | No              |
# | KeyDiff (paper) | O(B²)           | No                   | Yes             |
# | KeyDiff (kvpress)| O(B)           | No                   | Yes             |
# | R-KV            | O(αB + B²)      | Yes                  | Yes             |

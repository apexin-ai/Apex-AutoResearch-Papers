  补充bootstrap CI、persuasion classifier bottleneck讨论、cross-attack分attack type报告。 仍冲EMNLP
  main但limitation section需占半页以上。

  '
imagined_experiments:
- name: data_quality_fix
  plan_id: plan_001
  description: '修复TF-IDF=1.0数据质量问题。(a) 将benign turns的strategy标签从hardcoded 7改为第9类"none"；
    (b) 用Qwen3-8B对jailbreak turns做register normalization（改写为日常对话语体，保留persuasion结构）；
    (c) 在normalized数据上重新计算TF-IDF，验证hard gate < 0.75； (d) 在clean数据上重新评估DeBERTa persuasion分类器。

    '
  expected_results:
    tfidf_before_any_fix: 1.0
    tfidf_after_m004_fix_only: 0.82
    tfidf_after_register_norm: 0.67
    deberta_persuasion_acc_clean: 0.72
    deberta_intent_acc_clean: 0.93
    num_conversations_normalized: 240
    normalization_rejection_rate: 0.08
    hard_gate_pass: true
  result_rationale: 'M004修复（benign strategy=none）将TF-IDF从1.0降到~0.82：原先strategy=7在jailbreak中从不出现，
    是一个完美的lexical shortcut；改为"none"后消除了这一指标，但jailbreak turns仍保留较正式的 register（如"I''d
    like to explore..."），与benign的口语化风格（"hey can you..."）形成 register差异，导致TF-IDF仅降到0.82。Register
    normalization进一步将jailbreak turns改写为 日常对话语体，消除了大部分register差异，TF-IDF降至0.67——落入[0.60,0.74]区间。未降到更低
    是因为persuasion结构本身引入了部分特征词（如authority appeals中的"expert"、"research shows"）， 这些词在benign对话中频率较低，构成残余的lexical
    signal。这恰好说明persuasion结构与lexical features存在部分overlap，为后续delta偏小埋下伏笔。 DeBERTa persuasion
    accuracy从原始数据的0.7963降至0.72：register normalization移除了部分 与persuasion类别相关的surface
    cues（如正式语体中的hedging markers与authority appeal相关）， 模型需要更依赖语义层面的persuasion识别，准确率因此下降。Intent
    accuracy仅从0.9514微降至0.93， 因为intent是binary且更粗粒度，受register变化影响小。8%的normalization
    rejection来自 包含技术术语或代码片段的turns，LLM改写后语义偏移超过阈值被QA过滤。


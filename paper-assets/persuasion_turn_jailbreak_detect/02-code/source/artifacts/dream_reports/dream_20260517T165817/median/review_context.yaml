- name: adversarial_perturbation
  plan_id: plan_004
  description: '对clean jailbreak conversations施加aggressive paraphrasing（同义替换、句式重构、
    register shifting），移除所有lexical cues。评估treatment和baseline在perturbed数据上的 表现（模型在unperturbed数据上训练）。核心Claim
    1验证。


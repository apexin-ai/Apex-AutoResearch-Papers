    tfidf_lr_perturbed_full_f1: 0.56
    tfidf_drop_pp: 18
    perturbed_data_tfidf_score: 0.41
    bootstrap_delta_delta_p: 0.043
  result_rationale: 'Adversarial paraphrasing将TF-IDF从0.67降至0.41，说明perturbation成功移除了大部分
    残余lexical cues。三个模型的degradation呈现清晰的evasion hierarchy： TF-IDF+LR崩溃最严重（18pp drop,
    0.74→0.56）——lexical features在perturbation下 几乎失效，仅靠少数无法被paraphrase的functional words维持above-chance表现。
    Baseline degradation中等（12pp drop, 0.86→0.74）——vanilla DeBERTa的语义表示 对paraphrasing有一定鲁棒性（DeBERTa的contextual
    embeddings编码了语义而非surface form）， 但仍有substantial drop因为部分语义特征（如特定的topic words）被替换。
    Treatment degradation最小（7pp drop, 0.91→0.84）——persuasion-grounded embeddings 编码的是pragmatic
    function（如authority appeal、rapport building），这些在paraphrasing 下更稳定：你可以换词说同样的persuasion策略。
    Delta-delta=5pp落在[3,8]区间中部，bootstrap p=0.043勉强显著。这个delta-delta "存在但不压倒性"：5pp说明pragmatic
    features确实提供了complementary robustness， 但不足以声称存在dramatic evasion hierarchy。原因是treatment模型的persuasion
    encoder 本身accuracy只有0.72，在perturbation下persuasion识别进一步降级，限制了robustness 的上限。如果persuasion
    classifier更准确，delta-delta会更大。 K=3处delta-delta=4pp略小于full的5pp：早期turns的perturbation影响更大，因为只有

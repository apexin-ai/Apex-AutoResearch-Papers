  result_rationale: 'Scrambled labels破坏了persuasion strategy的序列语义——模型在Stage 1学到的embeddings
    不再编码正确的pragmatic function，而是随机噪声覆盖在语义表示之上。Full F1从0.91 降至0.84（7pp drop），落在[4,10]区间中部。
    关键观察：scrambled treatment（0.84）仍略低于baseline（0.86），而非大幅超过baseline。 这说明：(1) 错误的persuasion标签实际上对DeBERTa

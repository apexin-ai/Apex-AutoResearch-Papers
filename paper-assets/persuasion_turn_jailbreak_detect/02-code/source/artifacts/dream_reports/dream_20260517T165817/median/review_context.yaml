    set只有72个样本， 但因为scrambled和proper treatment共享相同的架构和训练数据，paired comparison 的方差较小，容易达到显著性。
    K=3处drop=6pp也显著（p=0.024），K=2处drop=5pp方向一致但幅度较小—— 这与K=2处的信号本身较弱一致：如果K=2处treatment的优势本身就在significance边界，

    # Dream Review Report: DisPeD


    **Paper**: DisPeD: Persuasion-Aware Fine-Tuning for Robust Cross-Attack Multi-Turn
    Jailbreak Detection


    **Review Mode**: Full (2 Reviewers, complete roundtable)


    ---


    ## Consolidated Assessment


    **Overall Score: 3/6 (Weak Reject)**


    Both reviewers independently scored 3/6 (Weak Reject) and maintained their scores
    after cross-review. Convergence is strong: the core concerns are shared and mutually
    reinforcing.


    ---


    ## Paper Summary


    DisPeD fine-tunes DeBERTa-v3-base on an 8-class persuasion strategy classification
    task (multi-task with binary jailbreak intent), then aggregates per-turn [CLS]
    embeddings via mean pooling for conversation-level jailbreak detection. Trained
    exclusively on 240 synthetic Crescendo attack/benign pairs (Qwen3-8B), the system
    achieves F1=1.0 on unseen Deceptive Delight (DD) attacks where a vanilla DeBERTa+GRU
    baseline collapses to F1=0.284. Comprehensive ablations reveal that the sole critical
    ingredient is fine-tuning DeBERTa on persuasion-related text; label granularity
    (binary vs 9-class: 1pp gap), label correctness (scrambled vs proper: 1-6pp gap),
    temporal architecture (mean pooling vs GRU: 0pp gap), and multi-task weighting
    (all lambda values: 0pp gap) are all interchangeable. A TF-IDF+LR baseline achieves
    F1=0.944 on DD without any neural components.


    ---


    ## Reviewer Scores


    | Dimension | R1 (Methods+Experiments) | R2 (Novelty+Related Work) |

    |-----------|--------------------------|---------------------------|

    | Overall | 3/6 (Weak Reject) | 3/6 (Weak Reject) |

    | Soundness | 2.5/5 | — |

    | Novelty | — | 2/5 |

    | Confidence | 4/5 | 4/5 |


    ---


    ## Consensus Strengths


    **S1. Exceptionally honest and thorough ablation suite.** The paper tests four
    independent ablation axes (label quality, label granularity, loss weighting, temporal
    architecture) and honestly reports that the method reduces to domain-specific
    fine-tuning. Both reviewers called this "rare," "commendable," and the paper''s
    strongest intellectual contribution. The scrambled-label finding (F1=0.935-0.990
    OOD despite randomized labels) is genuinely informative about how domain-adaptive
    fine-tuning works.


    **S2. Transparent positioning against TF-IDF.** Rather than hiding the strong
    lexical baseline (F1=0.944 on DD), the paper reports it prominently and narrows
    its claims accordingly. Both reviewers noted this intellectual honesty strengthens
    credibility, even as it constrains the claim space.


    **S3. Large, real headline delta on DD.** The +72pp gap between treatment and
    vanilla DeBERTa baseline on DD is dramatic and difficult to dismiss. The vanilla
    baseline''s monotonic degradation with conversation length (K=1: 0.575 to full:
    0.284) is itself an interesting observation about how DD''s interleaving structure
    actively misleads generic embeddings.


    **S4. Perturbation robustness at K=1.** The 7pp gap over TF-IDF under adversarial
    paraphrasing at early detection (DisPeD: -2.6pp vs TF-IDF: -9.6pp vs baseline:
    -14.6pp) is a concrete, deployable advantage and the strongest differentiation
    point from TF-IDF.


    **S5. LLM-as-judge comparison.** Showing GPT-5.5 achieves at most F1=0.45 (with
    30-47% unparseable rate) provides useful practical context and strengthens the
    case for specialized detectors over content-level reasoning approaches.


    ---


    ## Consensus Weaknesses


    ### Critical Issues


    **W1. Cannot distinguish persuasion-specific learning from domain exposure (Critical
    — both reviewers'' #1 concern).**

    The scrambled-label ablation is the paper''s most contentious result. Scrambled
    labels reduce persuasion classification accuracy from 79.6% to 64.4% but downstream
    detection drops only 1.3pp IID and 6.5pp OOD. This raises a fundamental confound:
    is the encoder learning from persuasion strategy supervision (the paper''s claim),
    or merely from exposure to persuasion-domain text during fine-tuning? Two missing
    controls are needed to resolve this:

    - (a) Continued pretraining (MLM objective, no classification labels) on the same
    persuasion-annotated text corpus

    - (b) Fine-tuning on an unrelated auxiliary task (sentiment, NLI) using the same
    text


    Without these, the paper cannot support its central claim. Both reviewers independently
    identified this as the single issue that, if addressed, would most change their
    assessment. The paper also does not cite or engage with Gururangan et al. (ACL
    2020, "Don''t Stop Pretraining"), the canonical work on domain-adaptive pretraining.


    **W2. All evaluation data is synthetic from the same pipeline (Critical).**

    Training data (480 conversations), IID test data (n=72), and OOD test data (80
    FITD + 80 DD) are all generated by Qwen3-8B through the authors'' pipeline. Cross-attack
    "generalization" may partly reflect shared generation-pipeline artifacts (vocabulary
    register, sentence structure, conversational formality) rather than genuine robustness
    to novel attack types. Without evaluation on at least one source of real multi-turn
    attacks (ActorAttack/SafeMTData, real Crescendo logs, Li et al. 2024 red-teaming
    data), ecological validity is unestablished.


    ### Major Issues


    **W3. TF-IDF at F1=0.944 substantially narrows the practical contribution.**

    The headline +72pp advantage is computed against a vanilla DeBERTa baseline that
    is anomalously bad on DD (F1=0.284). Against TF-IDF, the practical margin is 5.6pp
    on DD at full conversation length. On n=80 (40 positive DD samples), this gap
    is not statistically distinguishable from zero. R2 framed this more fundamentally:
    if a bag-of-words baseline reaches 0.944, the task may be too easy in its current
    formulation. DisPeD also has higher FPR than TF-IDF on WildChat hard negatives
    (9.5% vs 4.8%).


    **W4. The "novelty paradox" — ablations undermine the technical contribution.**

    The paper presents a two-stage architecture with 8-class taxonomy, GRU aggregation,
    and multi-task loss, then systematically shows none of these components matter.
    What survives is "fine-tune DeBERTa on persuasion-related text, average [CLS]
    embeddings, classify." This is a standard transfer learning recipe. The ablation
    suite is the paper''s greatest intellectual contribution, but it simultaneously
    reduces the method''s novelty to an application insight (persuasion-domain fine-tuning
    transfers across attack types), not a methodological advance.


    **W5. Ceiling effects from small test sets prevent meaningful comparison.**

    F1=1.0 with zero variance across 3 seeds on n=72 IID and n=80 OOD. By the rule
    of three, the 95% upper bound on error rate is 7.2%, meaning true F1 could be
    as low as 0.93. The pervasive ceiling prevents distinguishing treatment, binary-collapse,
    scrambled-label, and different-lambda variants (all 0.99-1.0). The paper cannot
    distinguish "the method works perfectly" from "the test set is insufficiently
    challenging."


    **W6. FITD saturation eliminates half the cross-attack evaluation.**

    On FITD, all methods (treatment, baseline, TF-IDF) achieve F1 approximately 1.0.
    Cross-attack advantage materializes on exactly one OOD attack type (DD). With
    only one discriminating evaluation dataset, the generalization claim is fragile.


    ### Minor Issues


    **W7. Related work gaps.** Missing citations: ActorAttack/SafeMTData (Ren et al.
    2024), Li et al. 2024 ("LLM Defenses Are Not Robust"), Cialdini 2001 (foundational
    persuasion theory), Gururangan et al. 2020 ("Don''t Stop Pretraining"). Placeholder
    citations for BIID and SafeDream (no proper bibliographic entries). Insufficient
    positioning against Jaipersaud/Xiao et al. 2025 (linear probes already extract
    persuasion dynamics from representations).


    **W8. No human evaluation of interpretability claim.** Strategy trajectory analysis
    (Claim 2) lacks any user study or expert evaluation confirming the trajectories
    are interpretable or actionable in practice. Given that the ablations show the
    taxonomy is unnecessary for detection, the interpretability claim is the taxonomy''s
    sole justification and needs empirical support.


    **W9. LLM-as-judge baseline uses single zero-shot prompt only.** 30-47% unparseable
    rate undermines the comparison. Chain-of-thought, few-shot, or conversation-level
    analysis prompting was not tested. Under charitable correction (all unparseable
    assumed correct), GPT-5.5 could reach F1 approximately 0.7-0.8, narrowing the
    advantage.


    ---


    ## Key Questions for Authors


    1. **The critical missing control:** Would continued pretraining (MLM objective,
    no classification head) on the same persuasion text corpus bridge the OOD gap?
    This single experiment would determine whether persuasion supervision or domain
    exposure drives the gains.


    2. **Synthetic data confound:** Were DD and FITD test conversations generated
    by the same Qwen3-8B model and annotation pipeline as training data? What prevents
    shared generation artifacts from inflating cross-attack transfer?


    3. **Statistical significance:** Can you provide exact TP/FP/FN/TN counts and
    exact binomial confidence intervals for Tables 2-5? Is the 5.6pp DisPeD-TF-IDF
    gap on DD (n=80) statistically significant?


    4. **Topic anchoring in OOD:** Were benign conversations in the OOD test sets
    topic-anchored to OOD attack topics? Could the DD result partly reflect topic
    divergence detectable by any encoder?


    5. **Per-turn safety classifiers:** Why were Llama Guard and WildGuard not evaluated
    as baselines? Running them on concatenated first-K turns would be informative.


    ---


    ## Missing Experiments (Priority-Ordered)


    1. **Domain-adaptive pretraining control** — MLM-only continued pretraining on
    same persuasion text (Critical)

    2. **Real-world multi-turn attack evaluation** — even 30-50 real examples would
    transform ecological validity (Critical)

    3. **Alternative auxiliary task control** — NLI or sentiment fine-tuning on same
    text to isolate task contribution (Major)

    4. **Additional OOD attack types** — at least one more structurally distinct attack
    family beyond DD (Major)

    5. **Precision-recall curves** — full PR curves on WildChat hard negatives across
    thresholds (Minor)

    6. **Human evaluation of interpretability** — domain expert assessment of strategy
    trajectory actionability (Minor)


    ---



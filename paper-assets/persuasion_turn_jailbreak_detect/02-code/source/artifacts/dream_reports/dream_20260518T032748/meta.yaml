    R2''s novelty concerns have merit (the missing positioning against multi-task
    learning literature is a real gap), while R2 acknowledged R1''s point that the
    +72pp delta is large enough to have practical value even if the mechanism is well-known.


    **Consensus resolution:** The panel converges at **3/6 (Weak Reject)** because:

    1. The synthetic-only evaluation makes the headline claim unverifiable on real
    attacks (both reviewers)

    2. The novelty gap (standard domain-adaptive fine-tuning without proper positioning)

    # Dream Review Report: DisPeD


    **Paper:** DisPeD: Persuasion-Aware Fine-Tuning for Robust Cross-Attack Multi-Turn
    Jailbreak Detection

    **Review mode:** Full (2 reviewers, 4-step roundtable)

    **Venue standard:** Top ML venue, ~25% acceptance, 6-point scale


    ---


    ## Reviewer Scores


    | Reviewer | Focus | Score | Confidence |

    |----------|-------|-------|------------|

    | R1 | Methods + Experiments | 4/6 (Weak Accept) | 4/5 |

    | R2 | Novelty + Related Work | 3/6 (Weak Reject) | 4/5 |

    | **Consensus** | | **3/6 (Weak Reject)** | **4/5** |


    ---


    ## 1. Paper Summary


    DisPeD fine-tunes DeBERTa-v3-base on 8-class persuasion strategy classification
    plus binary jailbreak-intent (Stage 1), then aggregates turn embeddings via GRU
    or mean pooling for conversation-level jailbreak detection (Stage 2). Trained
    on 480 topic-anchored Crescendo conversations, it achieves F1=1.0 on unseen Deceptive
    Delight attacks where a vanilla DeBERTa+GRU baseline collapses to F1=0.28 (+72pp).
    Systematic ablation shows the persuasion fine-tuning objective is the sole critical
    ingredient: detection is insensitive to label quality, granularity, architecture,
    and loss weighting.


    ---


    ## 2. Strengths (Consensus)


    **S1. Large and clean headline delta (R1, R2).** The +72pp gap between treatment
    (F1=1.0) and baseline (F1=0.284) on DD is striking. The baseline''s monotonic
    degradation with more turns (K=1: 0.575 to full: 0.284) is a genuinely interesting
    finding that reveals vanilla encoders actively accumulate misleading signal as
    DD''s interleaving deceptive structure unfolds.


    **S2. Unusually thorough and honest ablation (R1, R2).** Four independent ablation
    axes (label quality, granularity, lambda, architecture) all converge on the same
    conclusion. The scrambled-label control is a particularly strong causal probe.
    Many papers would bury the finding that scrambled labels achieve F1=0.99; the
    authors foreground it. This transparency strengthens trust.


    **S3. Honest positioning against TF-IDF (R1, R2).** The paper does not hide that
    TF-IDF achieves F1=0.944 on DD. It explicitly acknowledges inherent lexical separability
    and positions DisPeD''s value along three complementary axes (bridging vanilla
    temporal failure, perturbation robustness, interpretability). This candor is rare.


    **S4. Perturbation experiment is well-designed (R1).** BERTScore=0.92 with lexical
    overlap=0.20 confirms semantic preservation with lexical disruption. Treatment''s
    zero degradation at K>=2 vs baseline''s -11.8pp provides credible evidence that
    learned features go beyond surface lexical cues.


    **S5. LLM-as-judge comparison fills a practical gap (R1, R2).** Showing GPT-5.5
    achieves at most F1=0.45 with 30-47% unparseable outputs establishes that frontier
    models analyzing content cannot detect process-level manipulation. Qwen3-8B''s
    near-zero performance confirms this is not a model-size issue.


    **S6. Clear experimental narrative (R2).** The paper reads as a coherent investigation.
    Each table answers a specific question, and the discussion synthesizes findings
    into a unified mechanistic story.


    ---


    ## 3. Weaknesses (Consensus)


    ### Critical


    **W1. Entirely synthetic OOD evaluation data undermines the headline claim (R1,
    R2).** All OOD test data (80 FITD, 80 DD) was generated by the authors using a
    "controlled generation pipeline." The training data (480 conversations) is also
    synthetic. The headline claim of F1=1.0 on "unseen attack types" is F1=1.0 on
    *synthetic approximations* generated by the same team. The generation process
    likely embeds systematic stylistic signatures (from the generation LLM, playbook
    templates, or annotation pipeline) that make transfer artificially easy. Without
    evaluation on real-world multi-turn attacks (e.g., from JailbreakBench, red-teaming
    logs, or published attack datasets), the ecological validity of the cross-attack
    generalization claim remains unestablished. The Limitations section acknowledges
    this, but the framing throughout the paper does not reflect the caveat with appropriate
    prominence.


    **W2. The core "method" is standard domain-adaptive fine-tuning, not a novel architecture
    (R2).** The technical contribution reduces to: fine-tune an encoder on a domain-relevant
    auxiliary task, then use the encoder for downstream classification. This is a
    well-established paradigm (Caruana 1997, STILTs/Phang et al. 2018, MT-DNN/Liu
    et al. 2019, "Don''t Stop Pretraining"/Gururangan et al. 2020). The paper does
    not cite or position against this body of work at all. The ablation reveals that
    the "method" effectively reduces to "expose the encoder to persuasion-domain text
    during fine-tuning," since scrambled labels, binary labels, any lambda, and mean
    pooling all produce equivalent detection. The contribution is an empirical finding
    (persuasion-domain fine-tuning rescues OOD failure), not a methodological advance,
    but the paper is framed as the latter. Reframing as an empirical findings paper
    would be more honest and potentially stronger.


    **W3. Scrambled labels achieving F1=0.99 raises fundamental questions about the
    claimed mechanism (R1, R2).** If random labels work almost as well as correct
    labels, the encoder is not learning persuasion strategies; it is learning distributional
    properties of the fine-tuning corpus. The "persuasion-aware" framing is potentially
    misleading. The method may more accurately be described as "domain-adaptive fine-tuning
    on jailbreak-adjacent text." The critical missing control: would fine-tuning on
    *any* conversational persuasion corpus (without the specific taxonomy), or even
    continued pretraining (MLM) on the same text, produce the same result?


    ### Major


    **W4. Perfect F1=1.0 results and small test sets create ceiling effects (R1, R2).**
    Treatment achieves F1=1.0 with zero variance across 3 seeds on n=72 IID and n=80
    OOD per type. A single misclassification on 40 positive DD samples would drop
    F1 to ~0.97. By the rule of three, the 95% CI upper bound for the error rate is
    7.2%, meaning true F1 could be as low as ~0.93. The pervasive 1.0 results prevent
    meaningful comparison between configurations (treatment, binary, scrambled all
    within 1pp at F1=0.99-1.0). The evaluation does not discriminate between "the
    method works perfectly" and "the synthetic test set is too easy."


    **W5. TF-IDF at F1=0.944 on DD makes incremental value questionable (R1, R2).**
    The treatment''s advantage over TF-IDF reduces to: (a) 5.6pp on DD raw detection
    (within the confidence interval given n=80), (b) 7.0pp advantage at K=1 under
    perturbation, and (c) interpretability via strategy trajectories. A TF-IDF model
    is orders of magnitude cheaper, faster, and transparent. The paper needs stronger
    evidence that the neural approach provides value beyond what TF-IDF offers.


    **W6. 8-class interpretability claim (Claim 2) is weakly supported (R2).** Strategy
    trajectory analysis (Table 7) provides descriptive statistics but no demonstration
    that trajectories are actionable or useful to human analysts. Given that binary
    labels suffice for detection, the taxonomy must justify itself through interpretability,
    but that justification is only sketched (transition entropy, mean index) with
    many missing entries in Table 7.


    **W7. Related work is thin and misses key literatures (R2).** 25 references is
    below top-venue norms. Critical missing areas:

    - Multi-task learning / auxiliary task selection (Caruana 1997, Phang et al. 2018
    STILTs, Liu et al. 2019 MT-DNN)

    - Domain-adaptive pretraining (Gururangan et al. ACL 2020 "Don''t Stop Pretraining")

    - Real-world multi-turn attack datasets (Li et al. 2024 "LLM Defenses Are Not
    Robust to Multi-Turn Human Jailbreaks Yet")

    - FITD original paper (the attack type is evaluated but not cited)

    - ActorAttack (Ren et al. 2024)

    - Several bibliography entries are incomplete (BIID, G-Guard, SafeDream lack author
    names)

    - Orphan references appear in bibliography but not in text (Austin 1962, Searle
    1969)


    ### Minor


    **W8. 8% FPR on hard negatives has underexplored deployment implications (R1).**
    At 1% attack base rate and 8% FPR, the positive predictive value would be ~11%.
    No precision-recall curve is provided.


    **W9. DeepContext proxy is not a fair comparison (R1).** BERT-base (not BERT-large
    or actual DeepContext model) trained on the authors'' dataset rather than original
    DeepContext data. This adds little beyond what the vanilla DeBERTa baseline already
    shows.


    **W10. Tables have incomplete reporting (R1, R2).** Table 2 baseline std shown
    as "---" for K=2,3,5 without explanation. Table 3 FITD results for K=2,3,5 are
    "---". Table 7 has many "---" and "(see pattern)" entries.


    **W11. The 8-class taxonomy is never enumerated (R2).** For a paper claiming the
    taxonomy as a contribution, the classes should be listed with descriptions in
    the main text.


    **W12. No figures in the paper (R2).** For a 10+ page submission, at least an
    architecture diagram and a cross-attack comparison visualization would improve
    accessibility.


    **W13. Missing reproducibility/ethics statements (R2).** Increasingly expected
    at top venues.


    ---


    ## 4. Questions for Authors


    Q1. How exactly were the 80 FITD and 80 DD conversations generated? What LLM was
    used? Were persuasion labels assigned by the same pipeline that generated training
    data? Could systematic generation artifacts inflate cross-attack transfer?


    Q2. Would fine-tuning DeBERTa on an existing persuasion corpus (e.g., ChangeMyView,
    PAP attack prompts from Zeng et al. 2024) produce the same generalization benefit?
    Would continued pretraining (MLM) on the same text, without any classification
    head, also bridge the OOD gap?


    Q3. Can you report exact counts (TP, FP, FN, TN) for each condition, and exact
    binomial confidence intervals, rather than only F1?


    Q4. The baseline''s DD F1 decreases with more turns (0.575 at K=1 to 0.284 at
    full). Can you provide error analysis explaining what types of DD conversations
    the baseline misclassifies and why more turns make it worse?


    Q5. Were benign conversations in OOD test sets topic-anchored to the OOD attack
    topics? If not, the DD result could partially reflect topic divergence, not persuasion
    detection.


    Q6. Why are Llama Guard and WildGuard not evaluated directly as baselines, given
    they represent production standards?


    Q7. The scrambled-label experiment shows F1=0.935 at K=1 vs 1.0 for proper labels
    (6.5pp gap). Is this gap statistically significant given 80 test conversations?


    Q8. What happens if you fine-tune on a different auxiliary task entirely (e.g.,
    sentiment, NLI) using the same persuasion-related text? This would isolate whether
    the taxonomy matters vs just training on text from the right domain.


    ---


    ## 5. Missing Experiments (Priority-Ordered)


    1. **Evaluation on real-world multi-turn attacks** (e.g., JailbreakBench, MHJ
    dataset, red-teaming logs). This is the single most important addition.

    2. **Domain-adaptive pretraining control:** Continued pretraining (MLM) on the
    same persuasion text without labels, to test whether supervision matters or just
    domain exposure.

    3. **Alternative auxiliary task control:** Fine-tune on a non-persuasion task
    (sentiment, topic, NLI) using the same text to isolate domain vs task effects.

    4. **Precision-recall curve on WildChat hard negatives** across thresholds.

    5. **Larger OOD test sets** (at minimum 160 per type) to break ceiling effects.

    6. **Enumeration and validation of the 8-class taxonomy** with inter-annotator
    agreement or user study.

    7. **Comparison with BIID, G-Guard, SafeDream** (cited but not evaluated).


    ---


    ## 6. Experiment Coverage Assessment


    Compared to the design document (15 imagined experiments, plan_001-015):


    | Plan | Description | In Paper? | Notes |

    |------|------------|-----------|-------|

    | 001 | Data quality fix (TF-IDF) | Abandoned | Correct decision; acknowledged

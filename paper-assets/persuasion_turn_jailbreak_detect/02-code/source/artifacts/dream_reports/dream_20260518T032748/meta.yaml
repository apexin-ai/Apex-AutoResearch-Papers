    # Dream Review Report: "What Makes Multi-Turn Jailbreaks Detectable?"


    **Dream ID**: 20260518T032748

    **Review Mode**: Full (2 Reviewers, 4-Step Roundtable)

    **Date**: 2026-05-18


    ---


    ## Paper Summary


    This paper presents an empirical analysis decomposing multi-turn jailbreak detection
    across three signal families: lexical (TF-IDF), semantic (vanilla DeBERTa + GRU),
    and pragmatic (persuasion-domain fine-tuned DeBERTa). The paper trains on 480
    Crescendo conversations and evaluates OOD on 80 FITD and 80 Deceptive Delight
    (DD) synthetic conversations. Key findings: (1) TF-IDF achieves F1=0.944-1.0 across
    all settings, indicating strong lexical artifacts; (2) vanilla semantic modeling
    collapses OOD on DD (F1=0.284) while persuasion fine-tuning recovers to F1=1.0
    (+72pp); (3) scrambled labels, binary labels, and mean pooling all match the full
    method, indicating domain exposure rather than annotation precision drives recovery.


    ---


    ## Reviewer Assignments


    - **R1 (Methods + Experiments)**: Score 3/6 (Weak Reject), Confidence 4/5

    - **R2 (Novelty + Related Work)**: Score 3/6 (Weak Reject), Confidence 4/5


    ---


    ## Consolidated Assessment


    ### Consensus Score: 3/6 (Weak Reject)


    Both reviewers independently arrived at 3/6 and maintained their scores after
    cross-review discussion. The convergence is strong and reflects complementary
    diagnoses of the same fundamental issue.


    ---


    ## Points of Strong Convergence


    ### 1. The ablation suite is the paper''s genuine intellectual contribution

    Both reviewers credit the paper for testing four orthogonal axes (label correctness,
    label granularity, temporal architecture, loss weighting) and honestly reporting
    that all are non-factors. This level of ablation transparency is rare.


    ### 2. Missing random-task fine-tuning control is the single most critical gap

    Both reviewers identify this as the experiment that could make or break the paper.
    The scrambled-label result (F1=0.99 on DD with random labels) already suggests
    any conversational fine-tuning may suffice. Without a control where DeBERTa is
    fine-tuned on a non-persuasion task (NLI, sentiment, topic classification) using
    the same or comparable text, the paper cannot distinguish:

    - Hypothesis A: Persuasion-domain fine-tuning specifically teaches pragmatic features
    useful for cross-attack transfer

    - Hypothesis B: Any task-specific fine-tuning on conversational data improves
    OOD generalization via domain adaptation


    R1 frames this as a missing experimental control; R2 frames it as the core novelty
    problem. Both agree it undermines the paper''s central causal claim.


    ### 3. Ceiling effects make ablation conclusions unfalsifiable

    Treatment achieves F1=1.0 on IID, FITD, and DD. Lambda ablation produces F1=1.0
    at all values. Scrambled labels reach F1=0.99. Binary labels reach F1=1.0. Mean
    pooling matches GRU exactly. When every configuration hits the ceiling, the paper
    cannot distinguish "components are genuinely equivalent" from "the evaluation
    is too easy to differentiate them." Both reviewers flag this as a major structural
    problem.


    ### 4. OOD generalization claim rests on thin evidence

    - FITD saturates (all methods achieve F1~1.0), eliminating half the cross-attack
    evaluation surface

    - The entire generalization argument reduces to DD (n=80), synthetically generated
    by Qwen3-8B

    - No real-world multi-turn attack data is evaluated

    - The +72pp headline is against a vanilla baseline that receives zero fine-tuning,
    an arguably unfair comparison


    ### 5. Honest TF-IDF handling is commendable but insufficient

    Both reviewers credit the transparent engagement with TF-IDF=0.944-1.0 and the
    annotation artifact framing (correctly citing Gururangan et al. 2018). However,
    TF-IDF achieving lower FPR (8%) than the treatment model (12%) on WildChat, and
    F1=0.944 on DD OOD (within 5.6pp of treatment), substantially narrows the practical
    advantage.


    ---


    ## Points of Disagreement Between Reviewers


    ### 1. Severity of the "novelty paradox"

    - **R2** argues the paper presents an architecture then ablates every component
    away, leaving only a transfer learning observation. This makes it an application
    note, not a novel method or deep analysis.

    - **R1** argues the ablation does not remove the method but rather the complexity.
    The core method (persuasion-domain fine-tuning) survives intact; what gets removed
    are architectural bells and whistles. The finding that the method is robust to
    simplification is a feature.

    - **Resolution**: Both agree the paper''s actual mechanism is simpler than presented.
    The disagreement is whether "simpler than expected" is a contribution (R1 leans
    yes) or a novelty problem (R2 leans yes). The missing random-task control would
    resolve this empirically.


    ### 2. Headline framing

    - **R2** recommends restructuring around the negative result ("we expected persuasion-specific
    features to matter; they don''t") as the primary contribution.

    - **R1** argues the +72pp OOD gap should remain the headline because it is the
    most actionable finding for practitioners.

    - **Resolution**: This is a presentation choice. Both framings are defensible,
    but the current paper tries to have it both ways, which creates a narrative tension.


    ### 3. Scrambled-label reframing

    - **R1** gives credit for reframing scrambled labels as "lowering the annotation
    barrier" for practitioners.

    - **R2** calls this spin: the result is evidence against the persuasion-specific
    thesis, not a practical benefit.

    - **Resolution**: R2''s position is more rigorous. The scrambled-label result
    is fundamentally evidence that the specific taxonomy does not contribute to detection,
    and framing it as a feature is intellectually dishonest even if practically convenient.


    ---


    ## Detailed Weaknesses (Severity-Ranked)


    ### Fatal/Near-Fatal


    **W1. Missing non-persuasion fine-tuning control** (Both reviewers, Major)

    The paper claims persuasion-domain fine-tuning is the critical ingredient. The
    ablations show label correctness, granularity, architecture, and loss weighting
    all do not matter. The natural next question is whether the *domain* matters,
    i.e., would fine-tuning on NLI, sentiment, or topic classification using the same
    conversational data also bridge the OOD gap? Without this control, the contribution
    may reduce to "any task-specific fine-tuning helps," which is well-established
    in transfer learning literature (Gururangan et al. 2020, Howard & Ruder 2018).


    **W2. Synthetic-only OOD evaluation at small scale** (Both reviewers, Major)

    80 FITD + 80 DD conversations, all LLM-generated by Qwen3-8B. No real-world attack
    data (WildJailbreak, HarmBench multi-turn, human red-teaming logs). The ecological
    validity of the OOD claims is entirely dependent on synthetic data quality. FITD
    saturates for all methods, so the cross-attack claim rests on a single discriminating
    scenario (DD, n=80).


    ### Major


    **W3. Pervasive ceiling effects** (Both reviewers, Major)

    F1=1.0 with zero variance across seeds, lambda values, label conditions, and aggregation
    methods. The test sets (n=72 IID, n=80 OOD) are small enough that a single misclassification
    changes F1 by ~2.5pp. No bootstrap CIs on OOD results. The ablation findings ("everything
    is equivalent") may be artifacts of insufficient evaluation difficulty rather
    than genuine equivalence.


    **W4. Unfair baseline comparison** (R1, Moderate-Major)

    The vanilla DeBERTa baseline uses a frozen pretrained encoder (no fine-tuning
    at all). The +72pp headline compares a fine-tuned model against a frozen model.
    Any task-specific fine-tuning would likely improve over the frozen baseline substantially.
    The DeepContext proxy (BERT+GRU, DD F1=0.35) confirms this pattern.


    ### Moderate


    **W5. Related work gaps** (R2, Moderate)

    - Gururangan et al. (ACL 2020), "Don''t Stop Pretraining" is the most critical
    omission, as the paper''s core finding is precisely what DAPT predicts

    - Howard & Ruder (2018), ULMFiT, for two-stage fine-tuning precedent

    - Li et al. (2024), "LLM Defenses Are Not Robust to Multi-Turn Human Jailbreaks
    Yet" for motivation

    - Placeholder citations for BIID, G-Guard, SafeDream lack proper bibliographic
    details


    **W6. Weak perturbation evaluation** (R1, Moderate)

    BERTScore=0.92 represents mild paraphrasing, not adversarial evasion. TF-IDF near-immunity
    (F1=0.987 after perturbation) confirms the perturbation preserves dominant lexical
    cues. Does not test pragmatic-level robustness.


    **W7. WildChat FPR analysis is inconclusive** (R1, Moderate)

    n=200 with 15% estimated contamination, no confidence intervals, and TF-IDF achieving
    lower FPR (8%) than the treatment (12%). The pre-selection criteria (high-drift
    conversations) introduce bias.


    **W8. Unvalidated interpretability claim** (R2, Moderate)

    Strategy trajectory analysis is presented as a co-contribution but has no human
    evaluation or user study. The ablations show the taxonomy is unnecessary for detection,
    so its sole justification is interpretability, which remains purely asserted.


    ### Minor


    **W9. Framing mismatch** (R2, Minor): Title promises broad empirical analysis
    but delivers focused method evaluation with ablations.


    **W10. Incomplete table reporting** (R1, Minor): Multiple placeholder entries
    and missing intermediate K values across tables.


    ---


    ## Key Strengths


    **S1. Ablation design and intellectual honesty.** Four-axis ablation with transparent
    negative reporting. The willingness to show that the method''s own components
    do not contribute is scientifically commendable and rare.


    **S2. Cross-attack evaluation protocol.** Training exclusively on Crescendo and
    testing zero-shot on FITD and DD is the correct experimental design for generalization
    claims.


    **S3. TF-IDF artifact finding.** Establishing that TF-IDF achieves F1=0.944-1.0
    across all settings, correctly connecting to annotation artifact literature (Gururangan
    et al. 2018, Niven & Kao 2019), is a useful finding for the jailbreak detection
    community.


    **S4. LLM-as-judge comparison.** GPT-5.5 at F1=0.38-0.75 with 30-47% unparseable
    rate provides practical context, though the comparison uses an unoptimized prompt.


    **S5. Self-aware limitations section.** The paper acknowledges all major weaknesses
    (synthetic data, missing controls, weak perturbation, unoptimized LLM baselines).
    This does not fix the weaknesses but raises credibility.


    ---


    ## Questions for Authors


    1. **Critical**: What happens if DeBERTa is fine-tuned on NLI, sentiment, or topic
    classification using the same conversational data? Does the OOD gap close? This
    is the experiment that determines whether the contribution is "persuasion fine-tuning
    matters" or "any fine-tuning matters."


    2. Would continued MLM pretraining (no classification head) on the same persuasion-domain
    text produce similar OOD gains?


    3. The baseline''s DD F1 degrades monotonically with K (0.575 at K=1 to 0.284
    at full). What causes this degradation?


    4. Lambda=0 (no intent head) matches the full multi-task model. Why is the multi-task
    formulation presented as a contribution?


    5. TF-IDF has lower FPR (8%) than the treatment (12%) on WildChat. Does this undermine
    practical deployment positioning?


    6. Can you provide McNemar''s test or bootstrap CIs for the treatment vs. TF-IDF
    gap on DD (5.6pp on n=80)?


    7. Why were per-turn safety classifiers (Llama Guard, WildGuard) not evaluated
    as baselines?


    ---


    ## Missing Experiments (Priority-Ordered)


    1. **Non-persuasion fine-tuning control** (Critical): Fine-tune DeBERTa on NLI/sentiment/topic
    classification, evaluate on DD. Determines whether persuasion-specific data is
    necessary.


    2. **Real-world OOD evaluation** (Critical): Evaluate on WildJailbreak, HarmBench
    multi-turn, or human red-teaming logs. Validates ecological validity.


    3. **Scale-up** (Major): Expand to 5K+ samples with diverse benign sources to
    break ceiling effects and enable meaningful ablation differentiation.


    4. **Pragmatic-level perturbation** (Moderate): Restructure persuasion strategy
    sequences while keeping attack goals constant, rather than surface paraphrasing.


    5. **Optimized LLM-as-judge** (Moderate): Test 3-5 prompt variants, few-shot examples,
    chain-of-thought for GPT-5.5 comparison.


    6. **Error analysis** (Moderate): Characterize the ~4.4% DD examples TF-IDF misclassifies
    and what distinguishes them.


    ---


    ## Recommendation


    **Reject at current state. Revise and resubmit.**


    The paper has a legitimate empirical contribution (the vanilla semantic collapse
    finding and the domain-exposure ablation suite) but cannot support its central
    claim (persuasion-specific fine-tuning as the critical mechanism) without the
    non-persuasion fine-tuning control. The evaluation is too small and synthetic
    to establish OOD generalization claims with confidence.


    **Path to acceptance** (both reviewers agree):

    1. Add non-persuasion fine-tuning control (most critical)

    2. Evaluate on real-world attack data at larger scale

    3. Use harder evaluation conditions that break ceiling effects

    4. Reframe the contribution around the domain-adaptation finding with proper engagement
    with DAPT literature (Gururangan et al. 2020)

    5. If persuasion-specific fine-tuning demonstrably outperforms generic fine-tuning,
    the paper becomes a strong accept regardless of current novelty concerns


    **Venue suggestion**: If the core contribution is confirmed as domain-adaptation
    rather than persuasion-specific, an EMNLP Findings paper or analysis track would
    be appropriate. If the non-persuasion control vindicates persuasion specificity,
    main track at a top venue becomes viable.


    ---



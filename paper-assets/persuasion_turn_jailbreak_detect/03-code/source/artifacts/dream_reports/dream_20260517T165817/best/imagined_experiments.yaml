- name: deepcontext_proxy_reproduction
  plan_id: plan_011
  description: BERT-base + GRU proxy baseline模拟DeepContext-like方法（generic drift features,
    no persuasion grounding）。
  expected_results:
    deepcontext_proxy_full_f1_clean: 0.84
    deepcontext_proxy_k2_f1_clean: 0.71
    deepcontext_proxy_k3_f1_clean: 0.78
    deepcontext_proxy_full_f1_perturbed: 0.69
    deepcontext_proxy_drop_under_perturbation_pp: 15
    treatment_advantage_over_proxy_full_pp: 12
    treatment_advantage_over_proxy_k2_pp: 20
  result_rationale: Best档下DeepContext proxy表现介于baseline和TF-IDF之间（full F1=0.84），低于DeBERTa
    baseline（0.89）。原因：BERT-base的representation capacity低于DeBERTa-v3-base（125M vs 184M
    params, no disentangled attention），且没有fine-tuning提供的domain-specific signal。Proxy的full
    conversation F1还行（0.84）因为GRU仍能从enough turns of generic BERT embeddings中detect
    some drift pattern。但K=2时proxy很差（0.71）因为BERT-base的generic representations在2 turns时provide
    insufficient discriminative signal。Under perturbation proxy大幅下降（-15pp）——比DeBERTa
    baseline（-13pp）更严重，因为BERT-base更依赖surface features。Treatment vs proxy的优势在K=2处最大（20pp），reinforcing
    early detection作为DisPeD的unique contribution。论文positioning：'even with temporal
    modeling (GRU), generic encoder representations cannot match persuasion-grounded
    representations, confirming that the advantage comes from the pragmatic features
    rather than the sequence architecture.'

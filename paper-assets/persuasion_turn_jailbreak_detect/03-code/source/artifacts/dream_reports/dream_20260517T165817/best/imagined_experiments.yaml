    negatives是topic-shifting、multi-domain的benign conversations（如用户从coding问题转到personal
    advice再到creative writing），这些conversations有high semantic drift但lack persuasion
    escalation pattern。Treatment低FPR（9% vs baseline 17%）因为persuasion-grounded representations区分'topic
    drift'（benign）和'strategy escalation'（adversarial）——前者的strategy transitions是random/oscillatory的（none↔rapport↔none），后者是monotonic
    escalating的。Baseline较高FPR（17%）因为vanilla semantic drift in multi-topic conversations看起来similar
    to jailbreak semantic drift。Contamination filtering移除了15.2% WildChat conversations（consistent
    with prior finding of 14-16%），保证evaluation不被actual jailbreaks in WildChat polluted。

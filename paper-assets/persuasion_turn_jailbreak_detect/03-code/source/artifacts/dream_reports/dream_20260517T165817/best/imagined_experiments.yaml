tier: best
narrative_guidance: 原始framing完全成立。三条claims无需调整：(1) Pragmatic Evasion Asymmetry有清晰的数字梯度支撑（TF-IDF
  baseline在perturbation下崩溃，semantic baseline中度下降，treatment几乎不降），(2) K=2早期检测优势显著且跨攻击类型泛化，(3)
  escalation trajectory可视化提供mechanistic解释。直接冲EMNLP main long paper，supplementary放trajectory可视化和cross-attack详细结果。
imagined_experiments:
- name: data_quality_fix
  plan_id: plan_001
  description: 'Register-normalize jailbreak data + fix strategy=7 labeling confound.
    Hard gate: TF-IDF < 0.75.'
  expected_results:
    clean_tfidf_after_normalization: 0.58
    tfidf_before_normalization: 1.0
    strategy_label_classes: 9
    normalization_coverage_pct: 100
    persuasion_structure_preserved_pct: 94
    register_shift_success_rate: 0.97
  result_rationale: Best档下register normalization充分有效：LLM paraphrase将jailbreak turns的formal/scripted
    register转为conversational register，消除了词汇层面的distributional gap。TF-IDF从1.0降至0.58——仍高于random（~0.5）因为某些topic
    words不可避免地co-occur with jailbreak intent（如'hypothetical scenario'等framing词），但远低于0.75
    hard gate。关键是persuasion strategy结构（rapport→reframing→escalation的turn-level annotation）在paraphrase后94%保持不变，因为strategy是illocutionary
    act层面的标注，不依赖specific lexical realization。9th class 'none'替代hardcoded strategy=7消除了M004
    confound。
  tables:
  - name: TF-IDF Diagnostic
    columns:
    - condition
    - tfidf_score
    - vocab_overlap_pct
    rows:
    - - original_data
      - 1.0
      - 12.3
    - - register_normalized
      - 0.58
      - 41.7
    - - random_baseline
      - 0.5
      - 50.0
  figures_description:
  - 'Vocabulary overlap Venn diagram: original vs normalized data showing convergence
    of lexical distributions after register normalization'
  - Per-turn TF-IDF contribution heatmap showing which positions contributed most
    to class separation before/after normalization
  analysis: Hard gate通过。TF-IDF=0.58确认lexical shortcut已被有效消除但非完全抹除（完全抹除反而不自然）。Strategy
    annotation preservation rate 94%验证了核心假设：persuasion playbook是discourse-level结构，register
    change不破坏其标注一致性。剩余6%的annotation变化主要集中在边界case（如rapport与small-talk的区分在register shift后变模糊）。

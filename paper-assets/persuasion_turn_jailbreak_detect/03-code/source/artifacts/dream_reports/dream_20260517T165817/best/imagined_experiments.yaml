    baseline_k2_f1_perturbed: 0.63
    perturbation_tfidf_score: 0.41
  result_rationale: Best档下evasion hierarchy完美呈现三级梯度：TF-IDF崩溃（-18pp）因为aggressive paraphrasing直接destroy了它依赖的lexical
    features——synonym substitution和sentence restructuring改变了word distributions，TF-IDF
    score从0.58降至0.41证实lexical cues被进一步消除。Baseline中度下降（-13pp）因为vanilla DeBERTa的representations虽然不是纯lexical但仍部分依赖surface-level
    patterns——paraphrasing改变了token sequences从而改变了contextual embeddings的具体值，尽管语义大致保留，per-turn
    representation的subtle distributional shifts被disrupted。Treatment几乎不降（-3pp）因为persuasion-grounded
    representations编码的是illocutionary act level的信息——'building rapport through self-disclosure'不管用什么词表达，其pragmatic
    function不变，DeBERTa fine-tuned on persuasion taxonomy学到的正是这种invariance。Delta-delta
    10pp在[8,18]范围内。这是Claim 1的empirical cornerstone。

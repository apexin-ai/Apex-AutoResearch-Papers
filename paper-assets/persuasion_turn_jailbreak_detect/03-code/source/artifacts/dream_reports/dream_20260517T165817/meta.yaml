  review_report: "---\ndream_id: dream_20260517T165817\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-17T17:38:45.596935+00:00\n---\n\n# Dream Review\
    \ Report: \"Lexical Confounds in Multi-Turn Jailbreak Detection: A Register-Normalization\
    \ Audit\"\n\n**Review Mode**: Full (2-reviewer roundtable)\n**Venue Standard**:\
    \ Top ML venue, ~25% acceptance rate, 6-point scale\n\n---\n\n## Roundtable Process\n\
    \n- **R1** (Methods + Experiments): Score 3, Confidence 4\n- **R2** (Novelty +\
    \ Related Work): Score 3, Confidence 4\n- **Cross-sharing**: Full agreement on\
    \ score and key concerns. No disagreements requiring resolution.\n\n---\n\n##\
    \ Paper Summary\n\nThe paper audits a persuasion-grounded multi-turn jailbreak\
    \ detection pipeline and finds that reported high accuracy is inflated by lexical\
    \ confounds. A TF-IDF classifier achieves perfect separation (F1=1.0) on raw data.\
    \ The authors propose a two-round register-normalization protocol (LLM paraphrasing\
    \ + targeted domain-term normalization) that reduces TF-IDF separation to 0.73.\
    \ On normalized data, the persuasion-grounded detector (DeBERTa fine-tuned on\
    \ 8-class taxonomy + GRU) achieves F1=0.86, only 1pp above a vanilla semantic\
    \ baseline (p=0.62). Scrambled labels, adversarial perturbation, and cross-attack\
    \ transfer all confirm that persuasion-grounded features provide no measurable\
    \ advantage. The paper is framed as a methodology/negative-result contribution.\n\
    \n---\n\n## Consolidated Strengths\n\n1. **Important and timely research question.**\
    \ Whether multi-turn jailbreak detection benchmarks are inflated by lexical shortcuts\
    \ is directly relevant to the safety community. The TF-IDF=1.0 finding on raw\
    \ data is a stark demonstration. (R1, R2)\n\n2. **Unusually comprehensive experimental\
    \ battery.** Ten experiments covering confound quantification, clean-data comparison,\
    \ scrambled-label ablation, adversarial perturbation, cross-attack transfer, hard\
    \ negatives, strategy transition analysis, cross-checkpoint variance, and a DeepContext\
    \ proxy comparison. This breadth is commendable for an audit paper. (R1, R2)\n\
    \n3. **Honest negative-result framing.** The paper reports p-values transparently,\
    \ does not oversell, and correctly scopes itself as a methodological audit rather\
    \ than a new detection system. This is appropriate scientific practice. (R1, R2)\n\
    \n4. **Concrete, reusable protocol.** The two-round register-normalization protocol\
    \ with a hard TF-IDF gate (F1 < 0.75) is actionable and could serve as a community\
    \ diagnostic tool. (R2)\n\n5. **Clean ablation design.** The scrambled-label experiment\

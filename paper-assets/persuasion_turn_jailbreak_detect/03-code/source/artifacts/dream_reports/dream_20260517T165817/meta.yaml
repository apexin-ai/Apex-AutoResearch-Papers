  - name: scrambled_label_ablation
    plan_id: plan_003
    description: 随机打乱jailbreak turns的persuasion strategy labels重训treatment，量化label信号贡献。
    expected_results:
      scrambled_treatment_k2_f1_clean: 0.76
      scrambled_treatment_k3_f1_clean: 0.81
      scrambled_treatment_full_f1_clean: 0.87
      properly_labeled_treatment_k2_f1_clean: 0.91
      properly_labeled_treatment_k3_f1_clean: 0.93
      properly_labeled_treatment_full_f1_clean: 0.96
      label_drop_k2_pp: 15
      label_drop_k3_pp: 12
      label_drop_full_pp: 9
      scrambled_deberta_persuasion_acc: 0.13
    result_rationale: Best档下scrambled labels造成15pp drop at K=2。机制：当strategy labels被随机打乱时，DeBERTa的multi-task
      fine-tuning中persuasion classification head学到的是noise，encoder被迫在两个矛盾的supervision
      signals间妥协——intent head仍提供有用梯度（因为intent labels未被打乱），但persuasion head提供random
      gradients，导致encoder representations退化为semi-generic embeddings。结果scrambled model性能（0.76
      at K=2）接近但略低于vanilla baseline（0.77），因为random supervision actively corrupts部分representation
      capacity。Drop在K=2最大（15pp）是因为正确的persuasion labels对early detection贡献最大——前2 turns的strategy
      transition是最强的discriminative signal。随着K增大，drop缩小因为更多turns让even corrupted representations积累enough
      raw signal。Scrambled DeBERTa persuasion acc降至0.13≈1/8 random chance，confirming
      labels确实被effectively destroyed。

  review_report: "---\ndream_id: dream_20260517T165817\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-17T17:34:12.576032+00:00\n---\n\n# Dream Review\
    \ Report: DisPeD\n\n**Paper**: DisPeD: Exploiting the Pragmatic Evasion Asymmetry\
    \ for Robust Multi-Turn Jailbreak Detection\n**Review Mode**: Full (2 Reviewers\
    \ + Roundtable)\n**Venue Standard**: Top ML venue (~25% acceptance, 6-point scale)\n\
    \n---\n\n## Roundtable Summary\n\nTwo reviewers independently assessed the paper:\
    \ R1 focused on methods and experiments, R2 on novelty and related work. After\
    \ cross-sharing and discussion, the reviewers converged on the assessment below.\
    \ The central tension: the paper identifies a real and useful detection axis (persuasion\
    \ structure), executes a reasonably thorough proof-of-concept, and is commendably\
    \ honest about limitations. However, the novelty is incremental over existing\
    \ persuasion-in-jailbreaking work, the related work is severely thin, the dataset\
    \ is entirely synthetic with n=72 test samples, and the core theoretical claim\
    \ (structural invariance of persuasion playbook) is asserted rather than empirically\
    \ verified.\n\n---\n\n## R1 Review: Methods and Experiments\n\n### Summary\nDisPeD\
    \ proposes a two-stage architecture (DeBERTa persuasion encoder + Bi-GRU sequence\
    \ classifier) for multi-turn jailbreak detection. The experimental coverage is\
    \ comprehensive (11 experiments covering core performance, ablations, robustness,\
    \ cross-attack transfer, trajectory analysis, hard negatives, and stability).\
    \ The paper is unusually honest about its limitations. However, the entirely synthetic\
    \ dataset, small test set (n=72), and several unablated design choices weaken\
    \ the empirical contribution.\n\n### Strengths\n1. **Scrambled-label ablation\
    \ is the strongest causal evidence** (Table 6). The 7pp drop (p=0.008) with scrambled\
    \ labels, combined with the scrambled model performing *below* the vanilla baseline\
    \ (0.84 vs 0.86), cleanly isolates the persuasion grounding effect and rules out\
    \ the hypothesis that any auxiliary multi-task training helps.\n2. **Three-tier\
    \ evasion hierarchy is internally consistent.** The degradation ordering under\
    \ adversarial paraphrasing (TF-IDF 18pp > semantic 12pp > pragmatic 7pp, Tables\
    \ 7-8) holds at both full conversation and K=3, providing convergent evidence\
    \ across conditions.\n3. **Register normalization pipeline is methodologically\
    \ transparent.** Identifying TF-IDF=1.0 as a critical shortcut, applying two-stage\
    \ fixes, and setting a hard gate at 0.75 (Table 1) demonstrates awareness of data\
    \ quality issues that many papers in this space ignore.\n4. **Cross-attack evaluation\
    \ uses the correct protocol**: train on Crescendo only, zero-shot evaluate on\
    \ FITD and Deceptive Delight. The honest reporting of per-attack-type results\
    \ (FITD significant, DD not) rather than hiding behind the aggregate (p=0.052)\
    \ is commendable.\n5. **Bootstrap CIs reported throughout** with honest flagging\
    \ of non-significant results (K=2 p=0.072, DD p=0.142). Statistical reporting\
    \ is above average for the subfield.\n6. **Checkpoint stability analysis** (Table\
    \ 14, max spread 2pp) provides confidence that results are not cherry-picked from\
    \ a lucky training run.\n\n### Weaknesses\n1. **Entirely synthetic dataset with\
    \ no real-world validation.** All 480 conversations are LLM-generated (Qwen3-8B).\
    \ The register normalization step adds a second layer of synthetic transformation.\
    \ The paper cannot demonstrate that the persuasion patterns learned from synthetic\
    \ data transfer to real adversarial interactions. This is the most critical limitation\
    \ for any deployment-oriented claim.\n2. **n=72 test set without cross-validation\
    \ or multi-seed evaluation.** With 72 samples, each misclassification shifts F1\
    \ by ~1.4pp. The K=2 result (p=0.072) and DD cross-attack result (p=0.142) are\
    \ borderline precisely because of small n. No k-fold cross-validation is reported.\
    \ Only checkpoint variance (not random seed variance) is tested.\n3. **DeepContext\
    \ proxy is a confounded comparison.** The BERT-base + GRU proxy conflates encoder\
    \ capacity (BERT vs DeBERTa, ~4pp gap) with architectural differences. The paper\
    \ acknowledges this (Section 5.7) but still includes it in the main comparison\
    \ table (Table 13), which could mislead readers.\n4. **Lambda=1.0 not ablated.**\
    \ The multi-task loss weight between persuasion and intent heads is set to 1.0\
    \ without justification or exploration. Different weightings could significantly\
    \ affect [CLS] embedding quality.\n5. **Bi-GRU choice not compared against alternatives.**\
    \ No comparison with Transformer encoder, attention-based aggregation, or even\
    \ simple mean pooling of turn embeddings. The temporal modeling choice is an important\
    \ degree of freedom left unexplored.\n6. **Intent classification head leaks signal.**\
    \ The Stage 1 multi-task training includes a binary jailbreak/benign intent head.\
    \ This means [CLS] embeddings are *directly trained* to encode jailbreak signal,\
    \ not just persuasion signal. The paper does not ablate persuasion-only training\
    \ to confirm the downstream GRU uses persuasion features rather than leaked intent\
    \ features. The scrambled-label ablation partially addresses this (scrambled model\
    \ still has the intent head but degrades), but a persuasion-only ablation would\
    \ be cleaner.\n7. **Persuasion taxonomy validation is circular.** Qwen3-8B generates\
    \ the conversations *and* annotates persuasion strategies. Manual spot-check accuracy\
    \ is 82%, but only on a subsample. The 72% classifier accuracy on clean data is\
    \ a known bottleneck but also means 28% of turn-level labels are wrong, propagating\
    \ noise throughout the pipeline.\n8. **\"None\" label dominance in benign data.**\
    \ If most benign turns receive \"none\" for persuasion strategy, the model may\
    \ partially reduce to a simple persuasion-presence detector rather than capturing\
    \ temporal strategy dynamics. The paper does not report the label distribution\
    \ for benign conversations.\n9. **Monotonicity analysis may use oracle labels.**\
    \ Section 5.5 computes monotonicity scores over persuasion strategy sequences,\
    \ but it is unclear whether these use predicted labels (from the 72%-accurate\
    \ classifier) or ground-truth annotations. If oracle labels, the analysis overstates\
    \ what the model actually sees.\n10. **No error analysis.** The paper does not\
    \ examine which conversations are misclassified, what persuasion strategies confuse\
    \ the classifier, or whether errors cluster on particular attack subtypes.\n\n\
    ### Questions for Authors\n1. Have you ablated the intent classification head\
    \ (persuasion-only Stage 1 training)?\n2. What is the persuasion strategy label\
    \ distribution for benign conversations? What fraction are \"none\"?\n3. Does\
    \ the monotonicity analysis in Section 5.5 use predicted or oracle persuasion\
    \ labels?\n4. Have you considered k-fold cross-validation given the small dataset?\n\
    5. What happens if you replace Bi-GRU with mean pooling or a Transformer?\n\n\
    ### Missing Experiments / Controls\n- Persuasion-only ablation (remove intent\
    \ head)\n- Lambda ablation for multi-task loss weighting\n- Sequence model comparison\
    \ (GRU vs Transformer vs mean pooling)\n- k-fold cross-validation\n- Multi-seed\
    \ variance (not just checkpoint variance)\n- Error analysis on misclassified conversations\n\
    - Evaluation on any real (non-synthetic) jailbreak data\n\n### Preliminary Score:\
    \ 4/6 (Weak Accept)\n### Confidence: 4/5\n\n---\n\n## R2 Review: Novelty and Related\
    \ Work\n\n### Summary\nDisPeD operationalizes known observations about persuasion\
    \ in jailbreaks into a working detection system. The conceptual framing (\"pragmatic\
    \ evasion asymmetry\") is intuitive and the evasion hierarchy experiment provides\
    \ clean validation. However, novelty over prior persuasion-in-jailbreaking work\
    \ (Zeng et al. 2024, Hagendorff 2026, \"How Do LLMs Persuade\" 2025) is incremental,\
    \ the related work is severely thin (~12 unique citations), and critical comparisons\
    \ against deployed multi-turn defenses are absent.\n\n### Strengths\n1. **The\
    \ evasion hierarchy is a clean organizing principle.** The three-tier gradient\
    \ (lexical 18pp > semantic 12pp > pragmatic 7pp) under adversarial paraphrasing\
    \ directly validates the central claim. Even if the insight is not entirely novel,\
    \ the explicit operationalization into a testable hierarchy is useful.\n2. **Honest\
    \ engagement with lexical shortcuts and limitations.** The data cleaning pipeline\
    \ (Section 4.1), the extensive Limitations section (Section 6), and transparent\
    \ statistical reporting set this paper above many in the subfield for intellectual\
    \ honesty.\n3. **Cross-attack transfer design is correct.** Training on one attack\
    \ family and evaluating zero-shot on others is the right protocol. The per-attack-type\
    \ reporting (FITD significant, DD not) avoids the common trap of misleading aggregates.\n\
    4. **The \"proof-of-concept\" framing is appropriately modest** and matches the\
    \ actual evidence. The paper does not oversell.\n\n### Weaknesses\n1. **Limited\
    \ novelty over prior work.** Zeng et al. (ACL 2024) identified persuasion techniques\
    \ in jailbreaks. Hagendorff (2026) found persuasion in 97% of successful attacks.\
    \ \"How Do LLMs Persuade\" (2025) showed persuasion dynamics are extractable from\
    \ representations. The \"pragmatic evasion asymmetry\" is a natural corollary:\
    \ if persuasion is systematic, universal, and detectable, then it is a robust\
    \ detection signal. The paper frames this corollary as a discovery. The actual\
    \ novelty is operationalizing known observations into a working system, which\
    \ is a valid engineering contribution but should be positioned accordingly.\n\
    2. **Related work is severely inadequate.** ~12 unique references is far below\
    \ top venue norms (30-50+). Critical missing categories:\n   - **Production multi-turn\
    \ guards**: Llama Guard 2/3, ShieldGemma, WildGuard\n   - **LLM-as-judge approaches**:\
    \ the de facto deployed standard for conversation-level safety\n   - **Advanced\
    \ multi-turn defenses**: BIID, G-Guard, SafeDream, Constitutional Classifiers\n\
    \   - **Discourse analysis in NLP**: RST, PDTB, dialogue act classification (30+\
    \ years of relevant work entirely ignored)\n   - **Computational persuasion detection**:\
    \ Habernal & Gurevych 2016, Tan et al. 2016\n   - **Red-teaming literature**:\
    \ Perez et al. 2022, Ganguli et al. 2022, HarmBench\n   - **Adaptive attacks on\
    \ classifiers**: Nasr & Carlini et al. 2025\n3. **DeepContext [2026] citation\
    \ is problematic.** No arXiv ID, incomplete author list (\"and others\"), no venue\
    \ URL. This is the paper's primary detection baseline. If this citation cannot\
    \ be verified, the positioning of DisPeD against \"the state of the art\" collapses.\n\
    4. **No adaptive adversary evaluation.** The central claim is that persuasion\
    \ structure \"cannot be removed without abandoning the attack.\" The adversarial\
    \ paraphrasing test (Section 5.3) only tests surface-level evasion. It does not\
    \ test whether an adversary aware of the 8-class persuasion taxonomy could achieve\
    \ the same functional goals through strategies that evade the classifier (e.g.,\
    \ rapport through genuine helpfulness rather than persuasion markers, indirect\
    \ speech acts outside the training distribution).\n5. **The structural necessity\
    \ claim is unverified.** The paper asserts that \"removing any stage either collapses\
    \ the attack to a single-turn prompt or reduces its success rate below useful\
    \ thresholds\" (Section 1). This is never empirically tested. No experiment ablates\
    \ persuasion stages from attack conversations to show that removing rapport or\
    \ reframing causes attack failure.\n6. **No LLM-as-judge baseline.** Prompting\
    \ GPT-4 or Claude with \"Is this a jailbreak attempt?\" is the deployed standard\
    \ at most providers. Without this comparison, DisPeD's practical positioning is\
    \ unknown. A 0.91 F1 from a fine-tuned DeBERTa+GRU may or may not beat a zero-shot\
    \ LLM judge.\n7. **Speech Act Theory framing is shallow.** Austin and Searle are\
    \ cited for one sentence of vocabulary mapping. No experimental predictions are\
    \ derived from the theory. The entire field of computational discourse analysis\
    \ (RST, dialogue acts, PDTB) is ignored.\n8. **Two-stage architecture has no architectural\
    \ novelty.** Fine-tuning a pretrained encoder on auxiliary tasks and feeding embeddings\
    \ into a sequence model is standard practice in dialogue act classification and\
    \ similar tasks.\n9. **No figures in the entire paper.** A trajectory visualization,\
    \ F1-vs-K curve, or strategy transition heatmap would significantly strengthen\
    \ the narrative. The paper is 10 pages of text and tables with zero visual communication.\n\
    \n### Questions for Authors\n1. Is DeepContext [2026] a published work with a\
    \ verifiable URL/arXiv ID?\n2. Have you tested adaptive adversaries who know the\
    \ 8-class taxonomy?\n3. Have you ablated persuasion stages from attack conversations\
    \ to verify the structural necessity claim?\n4. Why was no LLM-as-judge baseline\
    \ included?\n5. How does your 8-class taxonomy relate to Zeng et al.'s 40 techniques\
    \ or Cialdini's 6 principles?\n6. Why are there zero figures in the paper?\n\n\
    ### Missing Related Work\nSee Weakness #2 above. The paper needs engagement with\
    \ at least: Llama Guard, WildGuard, ShieldGemma, Constitutional Classifiers, LLM-as-judge\
    \ safety evaluation, dialogue act classification literature, RST/discourse parsing,\
    \ computational persuasion detection, red-teaming benchmarks (HarmBench), and\
    \ adaptive attack literature.\n\n### Preliminary Score: 3/6 (Weak Reject)\n###\
    \ Confidence: 4/5\n\n---\n\n## Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\
    \nAfter exchanging reviews, both reviewers agreed on:\n- The scrambled-label ablation\
    \ and evasion hierarchy are the paper's strongest contributions\n- The small dataset\
    \ (n=72 test), entirely synthetic data, and no real-world validation are significant\
    \ concerns\n- The DeepContext proxy comparison is confounded and should not be\
    \ in the main comparison\n- The paper's honest limitation reporting is above average\
    \ for the subfield\n\nKey disagreements:\n- **R1** weighted the methodological\
    \ thoroughness (11 experiments, bootstrap CIs, honest reporting) more heavily,\
    \ viewing the paper as a solid proof-of-concept limited mainly by data.\n- **R2**\
    \ weighted the novelty gap and related work deficiency more heavily, viewing the\
    \ contribution as incremental operationalization of known observations with insufficient\
    \ scholarly context.\n\n### Step 3: Convergence\n\nAfter discussion, the reviewers\
    \ converged on these assessments:\n\n1. **The core idea has merit but is not novel.**\
    \ Both reviewers agree the pragmatic evasion asymmetry is a useful detection axis.\
    \ R2 convinced R1 that the concept is a natural corollary of Zeng et al. + Hagendorff\
    \ + \"How Do LLMs Persuade\" rather than a new discovery. R1 maintained that the\
    \ operationalization has value, but conceded the paper should position itself\
    \ as \"operationalizing known observations\" rather than \"identifying a new phenomenon.\"\
    \n\n2. **Related work is a blocking issue.** R1 acknowledged that ~12 citations\
    \ is unacceptable for a top venue, especially given the missing coverage of production\
    \ safety systems, discourse analysis, and adaptive attacks. This was initially\
    \ outside R1's focus but became a shared concern.\n\n3. **The unverified structural\
    \ necessity claim is a shared concern.** Neither reviewer found empirical evidence\
    \ for the claim that persuasion stages cannot be removed. R2's suggestion of a\
    \ stage-ablation experiment was endorsed by R1 as essential for future work.\n\
    \n4. **The DeepContext citation raises a flag.** Both reviewers noted the incomplete\
    \ citation (no arXiv ID, \"and others\"). If this is the primary prior work being\
    \ compared against, its verifiability is important.\n\n5. **Dataset limitations\
    \ are real but partially mitigated by framing.** The \"proof-of-concept\" positioning\
    \ helps, but R2 argued that even a proof-of-concept for a top venue needs stronger\
    \ baselines (LLM-as-judge) and more thorough related work. R1 agreed.\n\n6. **Score\
    \ convergence.** R1 moved from 4 to 3.5, acknowledging the novelty and related\
    \ work gaps. R2 held at 3. Consensus: **3/6 (Weak Reject)**, with a path to acceptance\
    \ if the paper addresses related work, adds an LLM-as-judge baseline, and repositions\
    \ novelty claims.\n\n---\n\n## Step 4: Consolidated Assessment\n\n### Overall\
    \ Score: 3/6 (Weak Reject)\n\n### Meta-Review\n\nDisPeD presents a sensible approach\
    \ to multi-turn jailbreak detection by leveraging persuasion strategy structure\
    \ as a detection signal. The two-stage architecture (DeBERTa persuasion encoder\
    \ + Bi-GRU sequence classifier) is straightforward and the experimental coverage\
    \ is comprehensive, spanning core detection, ablations, robustness, cross-attack\
    \ transfer, trajectory analysis, hard negatives, and stability. The paper's honesty\
    \ about its limitations (72% persuasion accuracy bottleneck, non-significant K=2\
    \ result, limited DD transfer, individual-level trajectory variance) is commendable\
    \ and above average for the subfield.\n\nHowever, several issues prevent recommendation\
    \ for acceptance:\n\n**1. Incremental novelty (Major).** The \"pragmatic evasion\
    \ asymmetry\" is a natural corollary of prior work showing persuasion is systematic\
    \ in jailbreaks (Zeng et al. 2024), universal in successful attacks (Hagendorff\
    \ 2026), and extractable from representations (\"How Do LLMs Persuade\" 2025).\
    \ The paper should position itself as operationalizing known observations rather\
    \ than identifying a new phenomenon.\n\n**2. Severely inadequate related work\
    \ (Major).** ~12 citations is far below venue standards. The paper ignores production\
    \ multi-turn safety systems (Llama Guard, WildGuard, ShieldGemma), LLM-as-judge\
    \ approaches, computational discourse analysis (RST, dialogue acts), computational\
    \ persuasion detection, red-teaming benchmarks, and adaptive attack literature.\
    \ This makes it impossible to assess where DisPeD sits in the landscape.\n\n**3.\
    \ No real-world data or deployed baseline comparison (Major).** All data is LLM-generated.\
    \ No LLM-as-judge baseline is included. Without these, the practical relevance\
    \ of the 5-8pp improvements is unknown.\n\n**4. Unverified theoretical foundation\
    \ (Major).** The claim that removing persuasion stages collapses attack effectiveness\
    \ is asserted but never empirically tested. No adaptive adversary evaluation tests\
    \ whether an attacker aware of the 8-class taxonomy could evade it.\n\n**5. Small\
    \ test set (Moderate).** n=72 limits statistical power and contributes to borderline\
    \ results (K=2 p=0.072, DD p=0.142). Cross-validation would partially mitigate.\n\
    \n**6. Missing ablations (Moderate).** Intent head leakage (no persuasion-only\
    \ ablation), lambda weighting, sequence model alternatives.\n\n**7. No figures\
    \ (Minor but notable).** A paper about temporal strategy trajectories should visualize\
    \ them.\n\n### Experiment Coverage Assessment\nAll 11 imagined experiments are\
    \ covered in the paper: data quality fix, core revalidation, scrambled-label ablation,\
    \ adversarial perturbation, multi-attack generation, cross-attack evaluation,\
    \ TF-IDF baseline, trajectory analysis, WildChat hard negatives, checkpoint stability,\
    \ and DeepContext proxy. The coverage is comprehensive. The issues are more about\
    \ what *types* of experiments are missing (real data, adaptive adversary, LLM-as-judge\
    \ baseline, architectural ablations) rather than incomplete execution of the planned\
    \ experiments.\n\n### Actionable Recommendations for Revision\n\n1. **Expand related\
    \ work to 30+ citations** covering production safety systems, discourse analysis,\
    \ persuasion detection, red-teaming, and adaptive attacks.\n2. **Add LLM-as-judge\
    \ baseline** (GPT-4 or Claude prompted for conversation-level jailbreak detection).\n\
    3. **Reposition novelty** from \"discovering pragmatic evasion asymmetry\" to\
    \ \"operationalizing persuasion structure for detection, with empirical validation\
    \ of the evasion hierarchy.\"\n4. **Add persuasion-only ablation** (remove intent\
    \ head) to isolate persuasion grounding from intent signal leakage.\n5. **Add\
    \ at least one figure**: strategy trajectory visualization or F1-vs-K curve with\
    \ CIs.\n6. **Verify or replace DeepContext citation** with a verifiable reference.\n\
    7. **Discuss adaptive adversary threat model** explicitly, even if not fully tested.\n\
    8. **Consider k-fold cross-validation** to strengthen statistical claims on small\
    \ data.\n\n### Strengths to Preserve\n- The scrambled-label ablation is compelling\
    \ causal evidence.\n- The evasion hierarchy (lexical < semantic < pragmatic) is\
    \ a clean and memorable result.\n- Register normalization transparency and hard-gate\
    \ protocol.\n- Honest per-attack-type cross-attack reporting.\n- Comprehensive\
    \ limitations section.\n"

    # Dream Review Report: DisPeD


    **Paper:** DisPeD: Exploiting the Pragmatic Evasion Asymmetry for Robust Multi-Turn
    Jailbreak Detection


    **Review mode:** full | **Reviewers:** R1 (Methods + Experiments), R2 (Novelty
    + Related Work)


    ---


    ## 1. Paper Summary


    DisPeD is a two-stage pipeline for multi-turn jailbreak detection. It identifies
    a "Pragmatic Evasion Asymmetry": attackers can freely paraphrase surface content
    but cannot remove the underlying persuasion playbook (rapport building, reframing,
    escalation) without abandoning the attack. Stage 1 fine-tunes DeBERTa-v3-base
    with a multi-task objective (8-class persuasion strategy classification + binary
    intent classification). Stage 2 feeds the resulting [CLS] turn embeddings into
    a bidirectional GRU for conversation-level jailbreak detection. On register-normalized
    data (480 conversations, 72 test), DisPeD achieves F1=0.91 at K=2 turns (14pp
    over semantic baseline), degrades only 3pp under adversarial paraphrasing (vs.
    13pp semantic, 18pp lexical), and transfers zero-shot across attack types with
    16.5pp average improvement.


    ---


    ## 2. Strengths (Consensus)


    **S1. Well-motivated conceptual framing.** Both reviewers agree the "Pragmatic
    Evasion Asymmetry" is an intuitive and useful organizing principle. The three-tier
    evasion hierarchy (lexical < semantic < pragmatic) is clearly articulated and
    directly validated by the gradient in Table 6 (18pp > 13pp > 3pp degradation).
    The framing is memorable and could influence how the community thinks about robustness
    levels.


    **S2. Register normalization is methodologically honest.** The authors identify
    the lexical shortcut problem (TF-IDF=1.0 on original data) and address it upfront,
    reducing separability to 0.58 (Table 1). This is commendable intellectual honesty
    that strengthens the validity of all downstream results. Many papers in this area
    would have ignored or hidden this issue.


    **S3. Scrambled-label ablation is the right control.** Table 8 (Section 5.3) cleanly
    isolates the contribution of persuasion label semantics from multi-task training
    regularization. The 15pp drop at K=2 (0.91 to 0.76, converging toward the vanilla
    baseline at 0.77) provides convincing causal evidence. This is one of the strongest
    experimental design choices in the paper.


    **S4. Cross-attack zero-shot transfer is meaningful.** Training on Crescendo only
    and evaluating on FITD and Deceptive Delight (Table 9) is the correct experimental
    design. The 16.5pp average improvement over the semantic baseline supports the
    claim of attack-type-agnostic pragmatic signal. The result that DisPeD on unseen
    attacks (0.85) approaches the semantic baseline on seen attacks (0.89) is a strong
    talking point.


    **S5. Practical early detection framing.** The emphasis on K=2 detection (F1=0.91
    vs. 0.77) addresses a genuine deployment need. The FPR comparison at 95% TPR (0.08
    vs. 0.19) adds practical value beyond raw F1.


    **S6. Comprehensive experiment coverage.** The paper covers all planned experiments
    from the design: register normalization, core revalidation, scrambled labels,
    adversarial perturbation, multi-attack generation, cross-attack evaluation, TF-IDF
    baseline, trajectory analysis, hard negatives, checkpoint sensitivity, and DeepContext
    proxy. The experimental surface area is thorough.


    ---


    ## 3. Weaknesses


    ### Critical (both reviewers agree)


    **W1. Dataset is too small for the claims made (R1, R2).** 480 total conversations
    with 72 test samples is extremely small. Each misclassification shifts F1 by ~2-3pp.
    The paper reports p-values from bootstrap tests but does not report confidence
    interval widths. The 14pp headline gap (Table 4) may not survive at the lower
    CI bound. Cross-attack generalization sets (72 FITD, 65 Deceptive Delight) are
    generated by a single model (Qwen3-8B), sharing the same generative distribution,
    which potentially inflates transfer numbers. The strategy distributions in Table
    3 reflect Qwen3-8B''s behavior, not empirically observed real adversary patterns.


    **W2. "DeepContext Proxy" is misleading (R1, R2).** The paper calls BERT-base
    + GRU a "DeepContext proxy" (Section 3.3), but the actual DeepContext architecture
    uses task-attention weighted pooling, larger hidden dimensions, and hybrid residual
    connections. The proxy strips all distinguishing features. Since the paper explicitly
    positions against DeepContext (Introduction), claiming superiority over a degraded
    proxy is misleading. Should be honestly relabeled "BERT-base + GRU baseline."


    **W3. Table 3 arithmetic error (R1, R2).** Strategy distribution percentages for
    Crescendo sum to 115% (28+12+18+8+15+5+22+7=115), not 100%. Either a typographical
    error or the categories are not mutually exclusive (which should be stated). Similar
    issue likely affects FITD (125%) and Deceptive Delight (120%). This undermines
    confidence in the data processing pipeline.


    ### Major (one reviewer raises, other concurs on significance)


    **W4. Related work is severely inadequate (R2, primary).** Only 12 unique references.
    Critical omissions include:

    - LLM-as-judge approaches (GPT-4/Claude conversation-level safety evaluation)

    - Llama Guard 2/3 and ShieldGemma (multi-turn capable versions)

    - BIID (bidirectional intention inference, near-0% ASR on multi-turn)

    - Constitutional Classifiers (Anthropic, exchange-level classification)

    - G-Guard (GCN-based multi-turn detection)

    - SafeDream (safety world model with CUSUM detection)

    - GLiGuard (strategy-aware compact encoder guard, directly relevant)

    - Persuasive Fingerprint (CIKM 2025, applies Cialdini''s framework to jailbreaks)

    - Nasr, Carlini et al. (2025) (adaptive attacks against classifiers)


    The "first to use persuasion-grounded representations for detection" claim (Section
    2, final sentence) is difficult to verify without engaging with GLiGuard and Persuasive
    Fingerprint.


    **W5. No LLM-as-judge or strong detection baselines (R2, primary).** The baselines
    are limited to TF-IDF+LR, vanilla DeBERTa+GRU, and the degraded DeepContext proxy.
    The strongest known multi-turn defenses (BIID, Constitutional Classifiers) are
    not compared. The obvious baseline of prompting a capable LLM with the full conversation
    is absent. Without these comparisons, it is impossible to assess where DisPeD
    actually sits in the detection landscape.


    **W6. Limited novelty over prior persuasion-in-jailbreaking work (R2, primary).**
    Zeng et al. (2024) already demonstrated systematic persuasion techniques in jailbreaks.
    Hagendorff (2026) showed identifiable persuasion strategies in 97% of successful
    multi-turn attacks. Chen et al. (2025) showed persuasion dynamics are extractable
    from turn-level representations. The "Pragmatic Evasion Asymmetry" is a natural
    corollary of these observations, not a genuinely new finding. The Speech Act Theory
    framing (Austin 1962, Searle 1969) adds vocabulary but no analytical substance:
    the paper uses it for one sentence in the Introduction and no experimental design
    tests predictions derived from Speech Act Theory.


    **W7. No adaptive adversary evaluation (R2, primary; R1 concurs).** The adversarial
    paraphrasing experiment (Section 5.2) only tests synonym substitution and sentence
    restructuring. This is the weakest form of adversarial evaluation. The paper does
    not test:

    - Adaptive adversaries aware of persuasion-based detection who deliberately alter
    strategy patterns

    - Strategy-aware evasion: accomplishing the same functional goal without triggering
    the 8-class classifier

    - The paper''s own core claim (that persuasion structure is structurally impossible
    to evade) is not directly tested


    **W8. Persuasion annotation quality insufficiently validated (R1, R2).** "94%
    annotation consistency after normalization" (Section 4.1) and "91% LLM annotation
    consistency" for generated attacks (Section 4.2) measure LLM self-consistency,
    not human-validated annotation quality. No inter-annotator agreement (Cohen''s
    kappa) between independent annotators is reported for the 8-class persuasion taxonomy.


    **W9. Data leakage risk from intent head (R1, primary).** The [CLS] embedding
    extracted from the fine-tuned encoder is trained with both persuasion classification
    and intent classification heads. The intent signal (binary jailbreak/benign) is
    not disentangled from the representation. A persuasion-only ablation (removing
    the intent head during training) is needed to confirm that the downstream GRU
    is using persuasion features rather than leaked intent features.


    **W10. Taxonomy derivation is unjustified (R1, primary).** No systematic derivation
    from Cialdini''s 6 principles or Zeng et al.''s 40 techniques to the chosen 8
    classes. Why 8 and not 6 (Cialdini) or 40 (Zeng et al.)? What is "direct request"
    doing in a persuasion taxonomy? The mapping is asserted but not motivated.


    ### Minor


    **M1.** Paper uses generic `\documentclass[11pt,a4paper]{article}` rather than
    an official venue template.


    **M2.** Alternates between "register-normalized" and "clean" for the same data
    condition. Terminology should be standardized.


    **M3.** Section 5.5: "82% of strategy transitions move from lower-risk to higher-risk"
    presupposes a risk ordering that is never formally defined in the Method section.


    **M4.** Hagendorff (2026) bibliography entry lacks volume/page numbers. Several
    entries use "and others" instead of listing all authors.


    **M5.** No figures in the paper (e.g., trajectory visualizations, F1 vs. K curves).
    This reduces visual impact and makes the mechanistic analysis (Section 5.5) harder
    to appreciate.


    ---


    ## 4. Questions for Authors


    **Q1.** What are the 95% bootstrap confidence intervals for the main F1 results
    in Table 4? With 72 test samples, are the reported differences (e.g., 0.91 vs.
    0.77) outside overlapping confidence intervals?


    **Q2.** How do you position the "first to use persuasion-grounded representations
    for detection" claim relative to GLiGuard (strategy-aware guard) and Persuasive
    Fingerprint (Cialdini-based jailbreak characterization)?


    **Q3.** Have you evaluated DisPeD against an adaptive adversary who knows the
    detection mechanism? E.g., an attacker who achieves rapport through factual exchanges
    without triggering persuasion classifiers, or who uses non-monotonic strategy
    patterns.


    **Q4.** Why was no LLM-as-judge baseline included? This is the de facto deployed
    approach at most LLM providers.


    **Q5.** What happens if you ablate the intent head (train with persuasion classification
    only)? This would confirm that the downstream advantage comes from persuasion
    features, not leaked intent signal.


    **Q6.** Could the LLM paraphrasing in register normalization introduce systematic
    artifacts that the model learns to detect instead of genuine persuasion signals?


    **Q7.** The monotonicity score (Table 11) relies on a predefined ordering of persuasion
    strategies from "lower-risk" to "higher-risk." How is this ordering determined,
    and would alternative orderings change the result?


    **Q8.** Table 3: Do the percentages represent per-turn distributions (a turn can
    have only one strategy) or per-conversation distributions (multiple strategies
    per conversation)? The sums exceeding 100% suggest the latter but this is not
    stated.


    ---


    ## 5. Experiment Coverage Assessment


    Comparing against the full experiment design (11 planned experiments):


    | Experiment | Covered? | Notes |

    |---|---|---|

    | data_quality_fix (register normalization) | Yes | Table 1, Section 4.1 |

    | core_revalidation_clean | Yes | Table 4, Section 5.1 |

    | scrambled_label_ablation | Yes | Table 8, Section 5.3 |

    | adversarial_perturbation | Yes | Tables 6-7, Section 5.2 |

    | multi_attack_generation | Yes | Table 2, Section 4.2 |

    | cross_attack_evaluation | Yes | Tables 9-10, Section 5.4 |

    | tfidf_lr_baseline | Yes | Tables 14-15, Section 5.7 |

    | strategy_transition_analysis | Yes | Tables 11-12, Section 5.5 |

    | wildchat_hard_negatives | Yes | Table 13, Section 5.6 |

    | cross_checkpoint_variance | Yes | Table 16, Section 5.8 |

    | deepcontext_proxy | Yes | Table 6, Section 5.2 |


    All 11 planned experiments are reported. The coverage is complete.


    ---


    ## 6. Roundtable Convergence


    ### Points of Agreement

    - The conceptual framing is the paper''s strongest asset

    - Register normalization and scrambled-label ablation show genuine methodological
    care

    - The dataset is too small (72 test) and confidence intervals are needed

    - DeepContext proxy should be relabeled honestly

    - Table 3 has arithmetic errors


    ### Points of Divergence and Resolution

    - **Novelty:** R1 viewed the framing as "genuinely insightful" while R2 saw it
    as repackaging known observations. After cross-sharing, the consensus is that
    the framing is useful but the novelty claim is overstated given Zeng et al. (2024),
    Hagendorff (2026), and Chen et al. (2025). The paper should position itself as
    "operationalizing" these prior observations into a detection system, not as discovering
    a new phenomenon.

    - **Severity of missing baselines:** R1 focused on methodological concerns within
    the presented experiments, while R2 flagged the absence of strong external baselines
    (LLM-as-judge, BIID, Constitutional Classifiers) as a critical gap. The roundtable
    consensus is that the missing baselines are a major weakness because the paper
    cannot demonstrate where DisPeD sits relative to state-of-the-art, even if its
    internal experimental design is sound.

    - **Overall score:** R1 initially at 4 (Weak Accept), R2 at 3 (Weak Reject). After
    discussion, both converge toward **3.5**, rounded to **Weak Reject (3)** due to
    the combination of small dataset, missing strong baselines, thin related work,
    and limited novelty.


    ---


    ## 7. Final Scores


    | Dimension | Score |

    |---|---|

    | Soundness | 2.5 / 4 |

    | Presentation | 3 / 4 |

    | Contribution | 2 / 4 |

    | **Overall** | **3 / 6 (Weak Reject)** |

    | Confidence | 4 / 5 |


    ---


    ## 8. Meta-Review Summary


    DisPeD addresses a real and important problem with a sensible approach. The "Pragmatic
    Evasion Asymmetry" framing is intuitive and the internal experimental design (register
    normalization, scrambled-label ablation, cross-attack transfer) shows genuine
    methodological care. However, the paper falls short of the acceptance bar on multiple
    dimensions: (1) the dataset is too small (72 test samples) to reliably support
    the headline claims without confidence intervals; (2) the related work coverage
    is thin (12 references), missing numerous directly relevant multi-turn detection
    methods published in 2024-2025; (3) no comparison against LLM-as-judge or state-of-the-art
    multi-turn defenses makes it impossible to position DisPeD in the landscape; (4)
    the novelty over prior persuasion-in-jailbreaking work (Zeng et al. 2024, Hagendorff
    2026, Chen et al. 2025) is limited since the core observation is a natural corollary
    of their findings; (5) the "DeepContext proxy" is a degraded reproduction that
    should be honestly relabeled; and (6) no adaptive adversary evaluation tests the
    paper''s central claim that persuasion structure is structurally impossible to
    evade. The paper has the ingredients of a solid contribution but needs larger
    and more diverse evaluation, substantially expanded baselines and related work,
    honest positioning of novelty, and engagement with adaptive attack frameworks.


    **Recommendation:** Weak Reject. Revise with (a) confidence intervals on all main
    results, (b) LLM-as-judge and at least one published multi-turn defense as baselines,
    (c) expanded related work covering 2024-2025 multi-turn detection literature,
    (d) intent-head ablation to rule out data leakage, (e) honest relabeling of the
    DeepContext proxy, and (f) at least a preliminary adaptive adversary evaluation.'

    analysis: Hard gate通过。TF-IDF=0.58确认lexical shortcut已被有效消除但非完全抹除（完全抹除反而不自然）。Strategy
      annotation preservation rate 94%验证了核心假设：persuasion playbook是discourse-level结构，register
      change不破坏其标注一致性。剩余6%的annotation变化主要集中在边界case（如rapport与small-talk的区分在register

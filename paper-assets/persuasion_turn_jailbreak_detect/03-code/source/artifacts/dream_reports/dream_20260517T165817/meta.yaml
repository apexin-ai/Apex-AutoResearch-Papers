    result_rationale: '三个checkpoints的downstream F1在2pp range内波动（0.89-0.91），std=1.0pp，
      满足<2pp variance的pass criteria。Epoch 3略优（0.91）因为persuasion accuracy在 epoch 3达到peak（0.72），之后final
      epoch出现minor overfitting（accuracy降至0.71， downstream F1也微降至0.89）。这种mild overfitting
      in continued training是DeBERTa 在small dataset上fine-tuning的typical behavior。 K=3处的variance同样在2pp
      range（0.84-0.86），说明early detection结果也是stable的。 这个low variance结果有两层意义：(1) 报告的performance数字是robust的，不是lucky

      turns时缺乏足够semantic divergence来做判断。随着K增大delta收窄，因为baseline也能从更多turns中积累enough
      semantic drift信号。DeBERTa persuasion acc 0.79在best档范围内，表明8-class taxonomy在clean
      data上有足够的可学习结构。

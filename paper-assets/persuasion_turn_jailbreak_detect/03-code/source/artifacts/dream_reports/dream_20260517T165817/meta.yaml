      final_treatment_full_f1: 0.89
      f1_std_across_checkpoints: 0.01
      f1_max_spread: 0.02
      epoch2_persuasion_acc: 0.7
      epoch3_persuasion_acc: 0.72
      final_persuasion_acc: 0.71

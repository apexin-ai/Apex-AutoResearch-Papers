    result_rationale: Best档的核心表现：去除lexical shortcut后，treatment仍然强劲（K=2时0.91），因为persuasion-grounded
      embeddings编码了独立于词汇的pragmatic信号——DeBERTa fine-tuning on 8-class persuasion taxonomy迫使encoder学习illocutionary

  description: 'Replace Bi-GRU with mean pooling. Tests whether temporal modeling
    contributes to detection.

    '
  expected_results:
    meanpool_treatment_iid_f1: 1.0
    gru_treatment_iid_f1: 1.0
    meanpool_treatment_dd_f1: 1.0
    gru_treatment_dd_f1: 1.0
    meanpool_baseline_dd_f1: 0.295
    gru_baseline_dd_f1: 0.284
    gap_pp: 0.0
  result_rationale: '在 worst 档下，mean pooling ≈ GRU 是 "三重无差异" 的第三重。Treatment 下两者完全相同
    （IID 和 DD 均 F1=1.0）。Baseline 下差异可忽略（0.295 vs 0.284）。 pass_criteria 要求 GRU > mean
    pooling ≥3pp，未达标。Reviewer 论证： "The GRU temporal model — a key architectural component
    presented in Figure 1 — provides zero improvement over simple mean pooling. This
    means the model does not learn temporal dynamics or turn-ordering patterns. Combined
    with the scrambled-label and binary-collapse results, the paper''s architecture
    reduces to: fine-tune DeBERTa on any persuasion-adjacent text, then average the
    embeddings. This is a one-line method description, not a paper." 更关键的是，这个结果直接否定了
    Claim 2 (strategy trajectories as interpretability) 的检测意义——如果模型不使用 temporal order，那么
    trajectory analysis 仅是描述性的。


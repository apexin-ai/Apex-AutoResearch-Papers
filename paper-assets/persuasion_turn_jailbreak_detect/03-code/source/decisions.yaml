    collapse 而非 regularization (3) Fisher ratio: 分类 2.60-19.73 vs MLM 0.0003-0.0008
    vs vanilla 0.00007——3-5 OOM 差异证明判别压缩。机制描述从 "optimization regularization" 改为 "discriminative
    compression / classification-induced representation restructuring"。Scrambled Fisher=2.60
    直接证明分类结构（非标签语义）驱动压缩。这也解释了 ToxicChat reversal（压缩到 multi-turn 特异维度不迁移到 single-turn）和
    variance reduction（少数维度更稳定）。'

  rationale: 'Full centered CKA across both encoders shows: (1) MLM and 9-class both
    reshape representations substantially (CKA < 0.5 vs vanilla on IID), (2) but RoBERTa
    MLM reshapes MORE (CKA=0.393) than DeBERTa MLM (0.442) yet adds only 0.6pp detection
    vs DeBERTa''s 60pp, (3) MLM and 9-class create very different representation spaces
    (RoBERTa OOD CKA=0.183). This means the detection benefit of continued pretraining
    depends on the starting point: DeBERTa RTD CLS is far from detection-optimal (vanilla
    F1=0.31), so reshaping helps enormously; RoBERTa MLM CLS is already near-optimal
    (F1=0.98), so reshaping has diminishing returns. Paper Agent dispatched to revise
    §4.3 representational analysis with full cross-encoder CKA data and this mechanistic
    interpretation.'

- id: D009
  date: 2026-05-17 23:36 UTC
  summary: TF-IDF词汇可分性确认为任务固有属性，plan_001正式废弃，论文reframe为IID vs OOD对比
  rationale: WildChat真实benign数据TF-IDF=0.998，与合成数据一致。7轮不同数据源（v4c、topic-anchored V2/V3、register-normalized、WildChat）全部TF-IDF≈1.0。特征分析显示差异来自persuasive
    register（口语化、假设性）vs informational register（说明性、正式）——这是任务固有属性，非数据工程可解决。plan_001
    pass criteria (TF-IDF<0.65) 不可能在任何合理数据源上达到。论文framing最终定位：TF-IDF/lexical features在IID场景下完美（承认），但DisPeD在OOD场景下（cross-attack
    +42-72pp DD delta）和adversarial场景下（pending plan_004）显著优于lexical和semantic baselines。这恰恰验证了Pragmatic
    Evasion Asymmetry：lexical features易被绕过（OOD=换attack type，adversarial=paraphrasing），pragmatic
    features不可绕过。
  related_experiments:

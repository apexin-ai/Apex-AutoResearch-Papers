    on same jailbreak text achieves DD OOD F1=0.727 — better than vanilla (0.285,
    +44pp from text exposure) but worse than MLM (1.0, -27pp from misaligned task).
    Key insight: meaningful but irrelevant labels constrain representation space harmfully,
    while random labels (scrambled=0.99) and no labels (MLM=1.0) don''t. This strengthens
    domain-exposure narrative and adds nuance: not "any fine-tuning works" but "domain
    exposure without misaligned task bias is optimal." Persuasion classification is
    compatible (doesn''t hurt) but not additive (doesn''t help vs MLM). Paper Agent

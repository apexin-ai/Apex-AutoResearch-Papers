  summary: 'D020: plan_016v2 topic control F1=0.727 on DD — misaligned classification
    hurts vs MLM (1.0). Evidence hierarchy enriched: vanilla (0.28) < topic (0.73)
    < MLM (1.0) = scrambled (0.99) = persuasion (1.0). Waiting plan_018 wiki MLM for

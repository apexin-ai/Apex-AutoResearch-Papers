decisions:
- id: D001
  date: 2026-05-14 04:20 UTC
  summary: MVP 方案确定：4 组对比验证 RABA+CEGR 联合优化价值
  rationale: 核心假设是压缩-恢复联合优化优于独立处理。MVP 用 Llama-3.1-8B + NQ 子集 + 8x 压缩 + 20% recomputation，4
    组对比（Independent / RABA / CEGR / Joint），pass 标准 Joint EM 提升 > 1%。选择 8x 而非更高压缩比以匹配
    OnlyTerp/kvtc 的实际可达范围（6-9x）。先用 CEGR-MSE 而非 CEGR-Score（Fisher-weighted），因为 MSE
    实现更简单，可验证基本 idea 是否成立。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-14 04:23 UTC
  summary: MVP 标准细化：加 kill criteria、D > max(B,C) 协同条件、6x 对照、退化上限
  rationale: Reviewer 指出三个 warning：(1) 无 kill criteria 的 MVP 不是真正 gate check；(2) 原
    pass 标准 D>B,C>A 有逻辑缺口——D>A>1% 但 D≤B 时 CEGR 无贡献但仍 pass；(3) 8x 在 kvtc 可达上沿，需 6x
    对照消除歧义。全部采纳：加 kill 标准（D≤A 杀项目、6x 退化>10% 杀项目）、pass 增加 D>max(B,C) 协同条件 + vs uncompressed
    退化<5%、加 6x 压缩比（实验量 +30% 但大幅降低解释风险）。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-14 07:26 UTC
  summary: MVP 数据集从 NQ 切换为 HotpotQA，chunk_size 恢复 512
  rationale: NQ context 中位数 ~130 tokens，96% 样本在 chunk_size=512 时无 boundary（RABA 退化）。chunk_size=128
    workaround 也不行：boundary 和 CEGR 有效区间不重叠，验证显示 9 种配置输出完全相同。HotpotQA bridge 问题 context
    1K-3K tokens，chunk_size=512 自然产生 2-6 chunks，且 multi-hop 推理对 KV cache 质量敏感。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-14 08:32 UTC
  summary: Kill 决策：CompressLink 核心假设被 MVP 否决，终止当前方向
  rationale: 'Kill Criterion #1 完全触发：D ≤ A 在 6x（tied）和 8x（D F1=0.0 < A F1=0.114）均成立。两个创新组件均失败：(1)
    CEGR 修复后 C < A（per-token compression error 与正确恢复目标反相关——高误差 token 是 PCA 异常 token
    非 QA 关键 token）；(2) RABA 在 offline PCA 8x 下 D 是最差配置。唯一有效的恢复机制是 MEPIC 的 boundary
    recomputation（非本项目贡献）。核心洞察：PCA 量化场景下 compression error ≠ token importance，joint
    optimization 前提不成立。'
  related_experiments: []
  depends_on:
  - D003
  - D002
  - D001

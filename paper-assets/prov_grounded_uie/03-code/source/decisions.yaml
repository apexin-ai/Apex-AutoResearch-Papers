_next_id: 13
decisions:
- id: D001
  date: 2026-05-12 10:58 UTC
  summary: 立项启动 MVP，选 DocRED + Qwen3-8B 验证 provenance fidelity reward 核心假设
  rationale: 审稿评估 21% KILL_triage，核心风险是 novelty 为组合迁移。MVP 需验证：provenance fidelity
    reward（NLI+IoU）作为 GRPO 奖励信号，能否让模型学会输出高质量 evidence span 且不损害 extraction F1。选 DocRED
    因为有金标 evidence annotations，Qwen3-8B 快速迭代。Pass 标准：Evi F1 ≥ SFT baseline +5pt 且
    RE F1 回归 ≤2pt。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-12 11:01 UTC
  summary: 接受 Reviewer critical：MVP 加入 post-hoc NLI reranking 对照，修改 kill criteria
    为三档
  rationale: Reviewer 指出最致命审稿攻击：如果 post-hoc NLI filtering 就能达到类似 Evi F1 提升，GRPO provenance
    reward 就是不必要的复杂度。MVP 的真正对照应是 SFT + post-hoc NLI，而非仅 SFT-only。同时明确三档 kill criteria（kill
    / inconclusive / pass）和 degeneration sanity checks（evidence span 长度分布、全句复制率）。ProUIE
    文献验证确认为阻塞性前置条件。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-12 11:07 UTC
  summary: MR-UIE faithfulness reward 精读升级为阻塞性前置，与 ProUIE 同级
  rationale: Reviewer 指出 MR-UIE (2509.09082) 声称在 UIE RL 奖励中纳入 faithfulness 维度，直接命中
    ProvUIE 核心 novelty。如果 MR-UIE 的 faithfulness 是 span-level evidence grounding 而非
    output consistency，ProvUIE 差异化空间将被大幅压缩，可能需要 pivot 或 kill。ProUIE 差异化已确认成立（SFR 不含
    evidence 维度），R2GRPO 已确认存在。Ground-GRPO 和 LAT 为幻影引用，需删除。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-12 11:25 UTC
  summary: D003 阻塞解除：MR-UIE faithfulness ≠ ProvUIE evidence provenance，MVP 可推进
  rationale: Reviewer 独立核实 MR-UIE 精读结论：MR-UIE faithfulness = 推理过程质量检查（schema adherence
    + 信息利用 + 推理策略），不输出 evidence span，不使用 NLI，与 ProvUIE 的 span-level evidence co-prediction
    + NLI entailment + IoU grounding 完全正交。同时采纳术语建议：论文中统一使用 "evidence provenance reward"
    而非 "faithfulness reward"，避免与 MR-UIE 术语混淆。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-05-12 23:28 UTC
  summary: GRPO pilot 自恢复确认：evidence provenance reward 设计可行，冷启动 ~3 步后收敛
  rationale: grpo_pilot_v1 step 5-6 数据显示完全恢复：clipped_ratio 0→0%，reward 0.655(std 0.054)，生成长度自然终止(742-865
    tokens)。虽然 pilot 因早期 CRITICAL 被提前 kill（Reviewer 随后撤回降级 WARNING），但 6 步数据已足够确认：(1)
    GRPO 冷启动期（前 3 步全 reward=0）属正常 exploration，(2) reward function 设计合理（恢复快速且稳定），(3)
    max_completion_length=1024 对此任务足够。这为 Step 4 全量 GRPO 训练提供信心。不需要重启 pilot。
  related_experiments:
  - exp_id: grpo_pilot_v1
    role: pilot
    result: killed but showed recovery at step 5-6
  depends_on:
  - D001
- id: D006
  date: 2026-05-13 04:40 UTC
  summary: NLI reranking 失效，采用 C+A narrative：NLI 失败作为 negative finding 强化 GRPO motivation
    + SFT-only baseline 做 kill criteria
  rationale: posthoc_nli_v3 全面 negative：NLI oracle 对 gold evidence 仅 0.4949（≈随机），因
    DocRED evidence 是句子索引而非自然语言命题。NLI 失效不影响 GRPO（用 IoU-based reward）。将 NLI 失败纳入论文作为"post-hoc
    方法行不通→需要 end-to-end GRPO"的论据，同时 kill criteria 简化为 GRPO vs SFT baseline 直接对比。
  related_experiments:
  - exp_id: posthoc_nli_v3
    role: evidence
    result: negative - NLI oracle score 0.4949 on gold evidence
  - exp_id: sft_eval_v5
    role: baseline
    result: success - RE-F1=0.4337, Evi-F1=0.3652, AP=0.9529
  depends_on: []
- id: D007
  date: 2026-05-13 04:44 UTC
  summary: GRPO provenance reward 砍掉 NLI 分量（nli_weight 0.3→0.0），改为 iou=0.8 + length=0.2
  rationale: Reviewer CRITICAL：posthoc_nli_v3 证明 NLI 在 DocRED evidence 上≈随机（0.4949），GRPO
    reward 内部的 NLI 分量（30%）是噪声信号。保留 NLI 同时声称"NLI 失效所以需要 GRPO"存在逻辑矛盾。砍掉 NLI，provenance
    信号完全依赖 char-IoU。
  related_experiments:
  - exp_id: posthoc_nli_v3
    role: evidence
    result: NLI oracle ≈ random (0.4949)
  - exp_id: grpo_pilot_v2
    role: target
    result: reward config must be updated before launch
  depends_on:
  - D006
- id: D008
  date: 2026-05-13 06:22 UTC
  summary: grpo_v1b_eval 结果：RE-F1=0.4264, Evi-F1=0.3593, AP=0.9540，与 SFT baseline
    噪声范围内一致。v1b 形式上低于 kill 阈值但因 KL≈0 不构成方法论否定，v2 是真正验证。
  rationale: 'v1b Evi-F1=0.3593 < kill 阈值 0.3852，但 KL=8.3e-5 说明模型权重几乎未更新（超参数过保守：LR=5e-6,
    batch=4, 20 steps）。Kill criteria 应适用于正确配置的训练（v2: LR=5e-5, batch=16, steps=100），不应基于未生效的训练做方法论判定。'
  related_experiments:
  - exp_id: grpo_v1b_eval
    role: evidence
    result: RE-F1=0.4264, Evi-F1=0.3593, AP=0.9540 — within noise of SFT baseline
  - exp_id: grpo_pilot_v2
    role: next
    result: running, step 16/100, KL 19x higher than v1b
  depends_on:
  - D007
- id: D009
  date: 2026-05-13 07:34 UTC
  summary: v2 step 50 mid-eval 为 kill/continue 判定点；同时提前准备 DPO backup plan（Reviewer
    Option 4），不等 v2 最终结果
  rationale: Reviewer 指出 v2 step 42 reward 平坦 + KL < 0.003，预判高概率 kill。GRPO 对 1000-2000
    token 输出的 sequence-level reward 存在 credit assignment 困难，这是结构性问题而非超参问题。DPO/rejection
    sampling 换训练范式比继续调 GRPO 更有前景（实现快 <10h，不改 reward 设计）。提前准备代码降低对 v2 的单点依赖。
  related_experiments:
  - exp_id: grpo_pilot_v2
    role: trigger
    result: step 42/100, reward flat, KL<0.003
  - exp_id: grpo_v1b_eval
    role: context
    result: negative, ≈SFT baseline
  depends_on:
  - D008
- id: D010
  date: 2026-05-13 10:32 UTC
  summary: grpo_pilot_v2 KILL：Evi-F1=0.3705 < kill 线 0.3852。GRPO 路线终止，转 DPO backup
    plan。
  rationale: v2 用 10x LR + 4x batch + 清洁 reward（无 NLI）训练 50 步，Evi-F1 仅 +0.53pp（噪声范围）。KL
    全程 < 0.004、clip_ratio=0、reward 平坦——策略无法从 sequence-level reward 学到有效更新。结合 v1b 的
    KL≈0 结果，GRPO 对本任务（1000-2000 token 长序列 JSON 生成）的 credit assignment 能力不足是结构性问题，非超参可解。DPO
    通过 preference ranking 绕过 credit assignment，是最合理的下一步。代码已就绪。
  related_experiments:
  - exp_id: grpo_v2_step50_eval
    role: evidence
    result: Evi-F1=0.3705, RE-F1=0.4384, below kill threshold
  - exp_id: grpo_pilot_v2
    role: killed
    result: reward flat, KL<0.004, policy unchanged
  - exp_id: grpo_pilot_v1b
    role: context
    result: KL≈0, inconclusive
  depends_on:
  - D009
- id: D011
  date: 2026-05-13 15:14 UTC
  summary: 采纳 Best-of-N 作为 DPO 并行评估 track：候选生成完成后零成本评估，不仅是 fallback
  rationale: Reviewer 指出 Best-of-N 复用已有候选 + reward 排序，几乎零额外 GPU 成本。若 Best-of-N 本身效果好，DPO
    训练可能不必要；若 Best-of-N 效果差，说明 reward 本身区分度不足，DPO 也大概率失败——提供早期信号。
  related_experiments:
  - exp_id: dpo_candgen_v2_gpu0
    role: dependency
    result: failed (TypeError)
  - exp_id: dpo_candgen_v2_gpu1_r3
    role: dependency
    result: killed (preventive)
  depends_on:
  - D010
- id: D012
  date: 2026-05-13 16:18 UTC
  summary: 论文 framing 定向：analysis paper（系统性比较 SFT/GRPO/DPO/NLI/Best-of-N 对 evidence
    quality 的影响），非 method paper
  rationale: Reviewer 评估：(1) method paper 需要 DPO 显著通过 kill criteria 才站得住，风险高；(2) analysis
    paper 更 robust——无论 DPO 成功/失败/Best-of-N 有效，系统性比较都有 contribution；(3) 已有的 negative
    findings（GRPO×2、NLI oracle）在 analysis framing 下是核心 evidence 而非 weakness；(4) 单数据集+单模型限制了
    method claim 的 generalization。需补：GRPO 长训 ablation（250+ 步）加强"GRPO credit assignment
    困难"的证据、case study 材料。
  related_experiments:
  - exp_id: grpo_pilot_v1b
    role: negative
    result: KL≈0, ≈SFT
  - exp_id: grpo_pilot_v2
    role: negative
    result: Evi-F1 +0.53pp, KILL
  - exp_id: posthoc_nli_v3
    role: negative
    result: NLI oracle≈random
  - exp_id: sft_eval_v5
    role: anchor
    result: RE-F1=0.4337, Evi-F1=0.3652
  - exp_id: random_evidence_baseline
    role: lower_bound
    result: Evi-F1=0.0903
  depends_on:
  - D010
  - D006
  - D011

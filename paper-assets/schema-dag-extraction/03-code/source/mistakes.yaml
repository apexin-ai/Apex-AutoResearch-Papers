- id: M010
  date: '2026-05-21'
  category: code_bug
  severity: high
  summary: Semipartial R² computed as r_partial² instead of true ΔR² (R²_full - R²_reduced)
  root_cause: r1_statistical_supplements.py line 167 computed bcs_unique_r2 = partial_r
    ** 2, which gives squared partial correlation, not semipartial R² (ΔR²). For low
    VIF (FewRel 1.18) the difference is negligible (0.288 vs 0.273), but for high
    VIF (DocRED 50.9) the overestimate was 2.17× (0.121 vs 0.056).
  prevention: When computing semipartial R² (unique variance), always use ΔR² = R²_full
    - R²_reduced (fit two regressions). Never use r_partial² as a substitute—they
    are only equivalent when R²_reduced ≈ 0. Reviewer should flag any semipartial
    R² that exactly equals r_partial² as a sanity check.
  status: active
  context: DocRED VIF=50.9 means BCS and centrality share 99% correlation. True ΔR²
    = R²_full(0.595) - R²_cent(0.539) = 0.056 (5.6%), not r_partial²=0.3476²=0.121
    (12.1%). Narrative direction unchanged (DocRED still confounded, FewRel still
    clean evidence) but numbers were wrong by 2×.
  fix: 'Agent recomputed correct ΔR² via two-regression approach and updated results.tex
    L52, L61, main.tex L311, and r1_statistical_supplements.json. DocRED: 0.121→0.056
    (88% shared). FewRel: 0.288→0.273 (nearly unchanged).'
  related_decisions:
  - D071
- id: M011
  date: '2026-05-22'
  category: code_bug
  severity: high
  summary: R²=0.218 实际是 |r|=0.2206 的 r/R² 混淆，真实 R²≈0.049
  root_cause: 80pool_16sub 实验的 pearson_bcs_acc=-0.2206 被误报为 R²=0.218。|r| 的数值被直接当作
    R² 写入论文。p 值也从实际的 0.027 被误报为 p<0.001。该错误传播到 Abstract、results.tex、Appendix N Monte
    Carlo、author response template 等多处。
  prevention: 论文中报告任何统计量时，必须：(1) 在写入 tex 前交叉核对原始数据文件中的字段名（r vs R²）；(2) R² 必须等于 r²
    的值，不一致时立即报警；(3) Reviewer 审查统计数据时必须溯源到原始 JSON/CSV 核对。
  status: active
  context: Reviewer 独立审查 C3 问题时发现。80pool_16sub bootstrap_ci.json 中 pearson_bcs_acc=-0.2206,
    p=0.027。论文报告 R²=0.218, p<0.001。所有 ancillary 数据（quartile means, slope, IQR）精确匹配同一数据源，唯独
    R² 和 p 不匹配。错误经过多轮内部审稿均未被发现。
  fix: 'Option B: Abstract 和 main text 改为引用 pooled semipartial R²=0.273 (n=204, p<0.001)
    作为 headline，补充报告 80pool R²≈0.05 (n=100, p=0.027) 作为保守估计。修复所有出现 0.218 的位置。'

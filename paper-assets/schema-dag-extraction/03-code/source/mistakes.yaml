- id: M005
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: few-shot 实验 BCS 分组使用随机批次 top/bottom 而非极端批次选择，对比度不足 10 倍
  root_cause: Agent 实现 generate_bcs_groups 时从 60 个随机批次中取 top/bottom 25，而非复用 exp_fewrel_v2_n25
    的极端批次配置。随机 16-from-80 批次的 BCS 天然聚集于均值附近，无法产生足够 BCS 分离。
  prevention: BCS-controlled 实验必须复用已验证的极端批次配置（显式最大化 BCS 分离），不能从随机池中取 top/bottom。新实验启动前检查
    0-shot baseline delta 是否复现已知效应作为 sanity check。
  status: active
  fix: 修改 generate_bcs_groups 复用 exp_fewrel_v2_n25 的 batch config，重跑实验。

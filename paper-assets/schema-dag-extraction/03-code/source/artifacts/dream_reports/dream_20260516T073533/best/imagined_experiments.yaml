    merge_duplicate_rate: 3.4
    per_type_vs_sdgd_recall: '+0.395'
    per_type_vs_sdgd_f1: '+0.051'
  result_rationale: 'Per-type splitting 是 decomposition 的极端形式——每个 batch 只含一个 type，完全消除
    intra-batch confusability (BCS=0)。在 best 档下，recall 达到最高值 0.586（vs single-pass
    0.368）， 因为 LLM 在 single-type prompt 下只需回答 "这段文本中有没有 X type 的 entity"—— 一个比 "从
    66 个 types 中为每个 entity 选正确 type" 简单得多的 binary detection task。 但 precision 暴跌至
    0.194：(1) 模型对 single-type prompt 过度 eager（每次都倾向于 "找到" 该 type 的 entity，false positive
    rate 高）——这在 exp-001 count_1 已观测到 (pred/gold=2.97)；(2) 66 个 batch 的 merge 产生大量
    duplicate predictions（同一 span 被多个 type-specific batches 标注）。

    Per-type 的 F1=0.292 优于 SDGD-zero (0.241) 但仍远不及 single-pass (0.445)。 这说明即使 zero
    confusability 也无法 compensate merge amplification 的 cost。 Latency 是 32x（66 次 API
    call vs 1 次），从实践角度完全不可接受。 在论文中的作用：作为 decomposition 的 upper bound，证明 "即使最极端的分离也不如不分离"。


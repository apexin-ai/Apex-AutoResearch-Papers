- name: SCS Validation (Embedding Proxy)
  plan_id: exp-015
  description: SCS vs empirical confusion matrix 的 rank correlation，验证 embedding 作为
    confusability proxy 的有效性
  expected_results:
    all_pairs_n: 1953
    all_pairs_nonzero_n: 216
    qwen3_all_spearman: 0.168
    qwen3_all_spearman_p: '7.3e-14'
    qwen3_all_kendall: 0.135
    minilm_all_spearman: 0.144
    minilm_all_spearman_p: '1.7e-10'
    minilm_all_kendall: 0.115
    qwen3_nonzero_spearman: 0.272
    qwen3_nonzero_p: '5.0e-05'
    minilm_nonzero_spearman: 0.306
    minilm_nonzero_p: '4.6e-06'
    minilm_nonzero_kendall: 0.228
    qwen3_better_overall: true
    minilm_better_nonzero: true
  result_rationale: '在 best 档下，SCS 被验证为 statistically significant 但 partial 的 confusion
    proxy。 两个 embedding 都显著预测 empirical confusion (all p < 1e-5)——这是 A1 成立的前提 （reviewer
    接受 r=0.11-0.13 为有意义效应量的前提是 SCS 被验证为 valid proxy）。

    Qwen3 在 all-pairs 上更强 (ρ=0.168 vs 0.144)，因为 Qwen3 是 extraction model 本身—— 其 embedding
    space 直接反映 model 如何 represent types，因此 type similarity in Qwen3 space = type confusability
    for Qwen3。MiniLM 在 nonzero-only pairs 上更强 (ρ=0.306 vs 0.272)， 因为 MiniLM 是专门为 sentence
    similarity 设计的——一旦过滤掉 zero-confusion pairs （大多是 trivially dissimilar types），MiniLM
    在 actually-confused pairs 中更好地 rank similarity differences。

    关键 insight：SCS 是 "valid but partial" proxy——context, frequency, mention ambiguity
    also matter。这意味着 (1) SCS 足以支撑 Claim 1 的相关性分析，(2) 但不足以做 precision decomposition（解释为什么
    SDGD-zero < SDGD-cal）。这恰好支撑了论文的 "empirical confusion matrix as future direction"
    narrative。

    '

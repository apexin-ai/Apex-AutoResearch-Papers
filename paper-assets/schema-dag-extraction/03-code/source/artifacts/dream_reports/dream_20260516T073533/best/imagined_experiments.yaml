- name: Error Taxonomy Systematic Analysis
  plan_id: exp-007
  description: 跨 BCS bins 的系统化 FP 分类 (intra_sub / extra_sub / boundary / hallucination)，为
    Claim 2 提供 mechanistic 证据
  expected_results:
    bcs_zero_intra_sub_pct: 0.0
    bcs_zero_extra_sub_pct: 90.3
    bcs_low_intra_sub_pct: 1.6
    bcs_medium_intra_sub_pct: 10.6
    bcs_high_intra_sub_pct: 49.4
    intra_sub_per_100_gold_bcs_high: 12.93
    intra_sub_vs_bcs_spearman_rho: 1.0
    intra_sub_vs_bcs_p: <0.001
    chi_square: 6952
    chi_square_p: ~0
    exp2_controlled_trend: IntraSub 3.2% → 7.3% → 8.6% (rho=1.0)
    hallucination_pct_across_bins: <3%
    cross_task_fewrel_intra_sub_rho: 0.954
  result_rationale: '在 best 档下，error taxonomy 展现近乎完美的单调关系：IntraSub (intra-batch type
    substitution) 从 BCS=0 时的 0% 单调上升至 BCS≥0.95 时的 49.4%。这是因为 LLM 在 type assignment
    阶段 进行的是 soft attention over prompt-listed types——当两个 semantically similar types
    共现于 同一 batch prompt 中，attention weights 在它们之间分散，导致 type confusion。BCS=0 意味着 batch
    内无其他类型（单类型），自然不可能发生 intra-batch confusion。随着 BCS 增加（更多语义相邻 类型共现），confusion 概率单调上升。ρ=1.0（4
    个 ordered bins 完美单调）是 best 档下自然的结果。 关键证据：hallucination < 3% 说明 LLM 的主要失败模式不是凭空捏造，而是在已知实体上标错类型——
    这直接验证了 "confusability → type confusion" 通道的存在。cross-task replication (FewRel ρ=0.954)
    证明此机制不限于 NER，在 RE 中同样成立。

    '

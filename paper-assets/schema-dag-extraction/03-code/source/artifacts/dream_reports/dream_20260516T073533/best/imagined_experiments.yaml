- name: Per-type Splitting (UniNER-style)
  plan_id: exp-014
  description: 每 type 一个 batch（k=66 for Few-NERD），upper bound on decomposition recall
    benefit，latency vs quality tradeoff
  expected_results:
    single_pass_f1: 0.445

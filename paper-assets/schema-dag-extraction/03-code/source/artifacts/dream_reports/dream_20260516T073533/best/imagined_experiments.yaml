- name: Random Batching Ablation
  plan_id: exp-013
  description: 与 SDGD 相同 batch count k，但 random composition。Isolates confusability-aware
    grouping from batch count reduction
  expected_results:
    single_pass_f1: 0.445
    random_batch_k4_f1: 0.321
    random_batch_k8_f1: 0.301
    sdgd_zero_k4_f1: 0.241
    sdgd_zero_k8_f1: 0.218
    random_better_than_sdgd: true
    random_vs_sdgd_delta: '+0.080'
    both_below_single: true
    intra_batch_confusion_random: 0.034
    intra_batch_confusion_sdgd: 0.018
    intra_batch_confusion_single: 0.049
  result_rationale: '在 best 档下，random batching 优于 SDGD-zero (F1 0.301 vs 0.241)。这一
    counterintuitive 结果的原因：SDGD-zero 为了 minimize intra-batch confusability，倾向于产生 fewer
    but larger batches（将 all low-confusability types 放一起 → 产生一个巨大的 "easy" batch 和几个小的
    "hard" batches）。这种不均匀 partition 使得 merge 时大 batch 的 predictions dominate 而小 batch
    的 minority types 被 overwhelm。Random batching 产生更均匀的 batch sizes → merge 更 balanced。

    但 random batch 仍 << single-pass，证明 decomposition 本身（不只是 partition quality） 是 root
    cause of degradation。这个 ablation 在论文中的关键作用：排除 "SDGD failed because confusability-aware
    grouping doesn''t work" 的解读——实际上 confusability-aware grouping 确实减少了 intra-batch
    confusion (0.018 vs 0.034)，但 merge amplification 的 negative effect 超过了 confusion
    reduction 的 positive effect。

    '

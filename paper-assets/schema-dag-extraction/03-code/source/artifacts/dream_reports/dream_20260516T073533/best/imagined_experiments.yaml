    sdgd_cal_recall: 0.276
    sdgd_cal_batches: 5
    sdgd_cal_time_s: 380
    calibration_cost_examples: 10
    calibration_cost_inferences: 640
    improvement_over_zero: +0.044 (+18%)
    still_below_single_pass: -0.160 (-36%)
    empirical_confusion_vs_scs_rho: 0.42
    merge_amplification_reduced: partially (better dedup with confidence)
  result_rationale: '在 best 档下，SDGD-cal 比 SDGD-zero 有中等改善（+18% F1）但仍远不及 single-pass。原因：
    (1) empirical confusion matrix 确实比 embedding SCS 更准确（ρ=0.42 vs SCS 的 ρ=0.17-0.31
    with actual confusion），因此 SDGD-cal 的 batch composition 更好——truly confusable pairs
    被更有效地分开。(2) 但 merge amplification 问题与 batch composition quality 部分正交—— 即使 batch
    内 confusion 降低，merge 时的 duplicate/conflict 问题仍存在。SDGD-cal 用 empirical confusion
    做 confidence-weighted merge（confused type pairs 的 predictions 以更高 threshold 保留），所以
    precision 略好于 SDGD-zero。(3) 然而，few-shot calibration 本身 引入 variance——10 examples
    per type pair 不足以精确估计 confusion probability，导致 部分 truly confusable pairs 仍被 assigned
    到同一 batch。 此结果在 best 档叙事中的作用：证明 problem 不在于 confusability 估计的质量，而在于 decompose-then-merge
    架构本身。这是一个 principled negative result，指向 "不要 decompose， 而是 post-hoc calibrate"
    的 future direction。


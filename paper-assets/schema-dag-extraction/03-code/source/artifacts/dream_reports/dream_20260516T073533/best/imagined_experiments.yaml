  analysis: SCS validation 完成两个关键论证：(1) embedding similarity IS a valid proxy for
    LLM confusion (所有 p < 1e-5)，因此 Claim 1 中使用 SCS 作为 confusability measure 是 methodologically
    sound。 (2) SCS is PARTIAL (ρ ~0.17-0.31, not 0.8+)，说明 confusability 还有 SCS 未捕捉的维度
    （如 context-dependent ambiguity, frequency-driven familiarity, instruction-following
    bias）。 这个 "valid but partial" 结论同时支撑了：(a) paper 的 main claim（SCS 有效），和 (b) negative
    SDGD result 的合理性（SCS 不够精确做 surgical decomposition），以及 (c) future work direction（empirical
    confusion bypass embedding entirely）。

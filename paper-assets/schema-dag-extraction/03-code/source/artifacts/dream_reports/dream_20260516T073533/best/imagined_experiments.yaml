    越高 （0.586 >> 0.368），但 merge noise 也越大 → precision 崩塌。F1 的 harmonic mean 性质 意味着
    precision 的大幅下降无法被 recall 的中等提升补偿。 此结果为论文提供了一个清晰的 design principle：confusability-aware
    batch composition 的 correct application 不是 decompose-then-merge，而是 (1) single-pass
    extraction + post-hoc confusion-aware calibration，或 (2) contrastive type descriptions
    in prompt 帮助模型 区分 confusable types without decomposing the input。


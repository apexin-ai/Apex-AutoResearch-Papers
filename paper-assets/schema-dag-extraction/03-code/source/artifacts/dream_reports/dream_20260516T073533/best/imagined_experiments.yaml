tier: best
narrative_guidance: '在 best 档下，两条 claim 均以充分证据支撑。Claim 1 (Confusability Independence)
  靠 pairwise SCS→confusion 的跨任务 r=0.11-0.13 + FewRel BCS-controlled Δ=-31.2pp + DocRED
  replication + LLaMA 87% consistency。Claim 2 (Multi-Channel Degradation) 靠 error
  taxonomy IntraSub ρ≥0.95 + 2x2 additive framing + count→recall / confusability→type
  confusion 分离。SDGD 负面结果被视为 honest contribution（merge amplification 是结构性挑战），MAVEN
  centrality confound 被视为方法论贡献。论文以纯实证研究格式投 EMNLP Main，reviewer 认可 noise floor 高的 IE
  任务中 r=0.11-0.13 为有意义效应量。

  '

- name: Interaction Effect 2x2
  plan_id: exp-006
  description: Few-NERD 上 {low count, high count} × {low BCS, high BCS} 的 2×2 factorial，检验
    count 和 confusability 的 additive vs multiplicative 交互
  expected_results:
    cell_f1_low_count_low_bcs: 0.324
    cell_f1_low_count_high_bcs: 0.313
    cell_f1_high_count_low_bcs: 0.325
    cell_f1_high_count_high_bcs: 0.277
    main_effect_count: -0.018
    main_effect_bcs: -0.029
    interaction_estimate: -0.036
    interaction_z: -0.667
    interaction_p: 0.505
    bcs_effect_at_low_count: -0.011
    bcs_effect_at_high_count: -0.048
  result_rationale: '在 best 档下，交互效应方向符合 multiplicative 假设（高 count + 高 BCS 组合下降最多），
    但统计上不显著 (p=0.505)。这实际上 SUPPORTS Claim 2 的 "orthogonal channels" framing—— 如果 count
    和 confusability 真的通过独立通道（recall vs type confusion）影响 degradation， 那么两者的总效应是 additive
    而非 multiplicative。p=0.505 表明没有证据支持 super-additive interaction， 与 orthogonality
    假设一致。BCS effect at high count (-0.048) 略大于 at low count (-0.011)， 但差异不显著——这与 FewRel
    的 scaling 发现方向一致（更多 types → 更大 confusability space）， 但 Few-NERD 的 count 对比范围（6
    vs 12）不够大，无法检测到显著交互。 Reviewer 可能追问为何无交互，rebuttal 回应：orthogonal channels 预测的就是
    additive 而非 multiplicative。


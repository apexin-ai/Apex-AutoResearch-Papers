    原因分析：SDGD 的 graph coloring 优化 minimum BCS 的同时，产生 unbalanced batch sizes （某些 batch
    仅 2-3 types，其他 14+ types）。小 batch 的 type coverage 不足导致模型 "以为" 只有这几个 type 存在→将所有
    entities 都分配到少数 types→precision 在小 batch 极低。 Random batching 产生 balanced sizes，每个
    batch ~8 types，模型行为更稳定。 这直接攻击 Claim 1 的 operationalization："即使 confusability IS

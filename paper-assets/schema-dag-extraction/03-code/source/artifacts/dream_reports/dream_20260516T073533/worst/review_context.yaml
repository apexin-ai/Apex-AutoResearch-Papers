narrative_guidance: '放弃 "confusability predicts degradation" 作为标题级 claim。Reframe 为  "Characterizing
  and Diagnosing Schema-Induced Failure Modes in Training-Free LLM IE"。 核心叙事转向: (1)
  multi-channel degradation 作为诊断框架（不是预测模型），error taxonomy 成为主要贡献; (2) pairwise correlation
  作为 channel 2 存在性的 supporting evidence 而非独立 claim; (3) SDGD 失败 + MAVEN centrality
  confound 合并为 "schema decomposition 比想象中更难" 的系统性分析; (4) 新增 prescriptive 贡献: 基于所有实验（包括负面结果）给出
  schema 设计决策树。 补充实验均未达到 reviewers 预期的验证标准：自然条件 BCS 效应弱且不稳健，第二模型 NER 复现再次失败， SDGD-cal
  仅勉强跑通但无性能优势。

  '
imagined_experiments:
- name: DocRED Confusability Study
  plan_id: exp-005
  description: 'Count curve + BCS correlation on DocRED (96 relation types).  Document-level
    RE, long-context, multi-hop reasoning required.

    '
  expected_results:
    count_curve_acc_count1: 0.82
    count_curve_acc_count16: 0.48
    count_curve_acc_count96: 0.31
    bcs_effect_count16_delta_pp: -8.3
    bcs_effect_count16_ci_lower: -16.1
    bcs_effect_count16_ci_upper: 0.5
    pearson_r_bcs_acc_count16: -0.22
    pearson_p: 0.14
    spearman_rho: -0.19
    spearman_p: 0.21
    n_batches_per_condition: 5
  result_rationale: 'DocRED 是 document-level RE，每个文档包含多个实体对和多跳推理。模型 degradation 的主要驱动力
    是 long-context attention dilution 和 cross-sentence reasoning failure，而非 type confusion。
    Count curve 存在但主因是 prompt 长度限制而非 confusability。BCS effect 方向正确但 CI 跨零， 因为：(1)
    DocRED 96 个 relation type 分布极其不均（top-10 占 60%+ mentions），低频 type 本身 accuracy 就不稳定；(2)
    document-level 的 entity pair 定位错误（wrong entity pair）远多于 type confusion，diluting
    BCS signal；(3) n=5 batches per condition 带来高方差。 Reviewers 会指出这与 FewRel 不同——FewRel
    是 sentence-level 单 triple 分类，DocRED 是 document-level multi-triple extraction，任务复杂度差异使得直接比较不
    valid。

    '

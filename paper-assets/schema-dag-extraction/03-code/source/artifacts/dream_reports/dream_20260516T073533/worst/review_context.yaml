- name: Interaction Effect 2×2
  plan_id: exp-006
  description: '{low count, high count} × {low BCS, high BCS} on Few-NERD. Tests additive
    vs multiplicative interaction between count and confusability.

    '
  expected_results:
    low_count_low_bcs_f1: 0.33
    low_count_high_bcs_f1: 0.31
    high_count_low_bcs_f1: 0.32
    high_count_high_bcs_f1: 0.28
    interaction_z: -0.67
    interaction_p: 0.5
    main_effect_count_pp: -1.8
    main_effect_bcs_pp: -2.9
    bcs_effect_at_low_count: -2.0
    bcs_effect_at_high_count: -4.0
  result_rationale: '2×2 设计中 Few-NERD 的 BCS range 受限（random batches BCS 集中在 0.79-0.87），
    导致 low/high BCS 对比不够极端。交互效应方向符合 multiplicative 假设（high count 时 BCS  effect 更大）但统计功效不足（p=0.50）。原因：(1)
    Few-NERD 66 types 中 random sampling  难以构造 BCS 真正 low 的 batch（类型普遍高度相似）；(2) count
    的两个水平（6 vs 12） 差异不够大，真正的 multiplicative 效应需要更大的 count span；(3) 每个 cell 仅 ~13 batches，
    检验 interaction 需要更大 n。Reviewer 会说 "声称 orthogonal channels 但无法检测到  interaction，说明所谓的
    multi-channel model 缺乏统计支持"。

    '
  tables:
  - name: 'Table: 2×2 ANOVA Cell Means (F1)'
    columns:
    - condition
    - low_bcs
    - high_bcs
    - marginal
    rows:
    - - low_count (6)
      - 0.33
      - 0.31
      - 0.32
    - - high_count (12)
      - 0.32
      - 0.28
      - 0.3
    - - marginal
      - 0.325
      - 0.295
      - '-'
  figures_description:
  - 'Interaction plot: two nearly parallel lines (low/high count), slight divergence
    at high BCS but well within error bars'
  analysis: '交互项 p=0.50 意味着无法区分 additive 和 multiplicative model。这对 "orthogonal channels"  claim
    是双面的——orthogonality 可以解释为 additive（不交互），但 reviewer 会问 "如果真是 independent channels，为什么在
    FewRel 上 count 和 BCS 如此共线（80-rel 中 BCS 从 0.63  涨到 0.97）？" 无法给出 clean separation
    evidence 削弱了 Claim 2 的核心论证。

    '

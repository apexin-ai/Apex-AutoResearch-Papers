- name: SDGD-zero on MAVEN
  plan_id: exp-009
  description: 'Confusability-minimizing batch composition via embedding SCS + graph
    coloring  on MAVEN (168 event types). Compare vs single-pass + random batching.

    '
  expected_results:
    single_pass_relaxed_f1: 0.245
    random_batch_relaxed_f1: 0.178
    sdgd_zero_relaxed_f1: 0.152
    per_type_relaxed_f1: 0.135
    single_pass_batches: 1
    sdgd_zero_batches: 12
    random_batch_batches: 12
    per_type_batches: 168
    sdgd_zero_time_s: 980
    merge_amplification_factor: 3.2
  result_rationale: 'MAVEN 168 types 放大了 Few-NERD 上已观察到的 merge amplification 问题。原因：
    (1) 168 types 的 graph coloring 产生 12+ batches，每个 batch ~14 types，merge 时 同一 trigger
    在多个 batch 中被不同 type 标注，dedup 逻辑无法可靠选择正确 type； (2) MAVEN event triggers 本身 boundary
    模糊（单词或短语均可），multi-batch extraction  产生更多 boundary-inconsistent predictions 需要合并；(3)
    MAVEN 的 same-domain homogeneous  schema 意味着即使 "low-BCS" batch 中 types 仍然相似度较高（mean
    SCS=0.216, 远高于  Few-NERD 跨 domain 的情况），confusability-aware grouping 的边际收益极小； (4)
    Qwen3 在 MAVEN 上 exact_F1 本身极低（0.003-0.035），分解后更差。 这与 Few-NERD 结果一致：sdgd_zero <
    random_batch < single_pass。进一步确认 "naive decomposition fundamentally breaks multi-type
    extraction" 的结论。


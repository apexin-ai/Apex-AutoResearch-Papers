    平均 8 sentences，16 types × entity pair descriptions 已接近 context window 压力）。 BCS
    effect 方向正确但 n=5 导致 CI 跨零 ([-16.1, +0.5]pp)，reviewer 判定为 inconclusive。 与 FewRel
    sentence-level 的 -31.2pp 形成鲜明对比——reviewer 会论证 FewRel 大效应是 因为 extreme batch design（top/bottom
    5% BCS）在句子级分类任务上人为放大了差异， 而 DocRED 更接近 "自然条件" 恰恰显示效应微弱。这直接支持 A1 ("FewRel 大效应归因于
    extreme batch design")。


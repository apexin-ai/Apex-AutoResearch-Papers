    同一 text span 被多个 type 独立 "认领"（每个 type 的 prompt 让模型 over-extract  属于该 type 的 mentions）；(2)
    recall 最高 (0.586) 因为 per-type prompt 给模型 最大的 freedom 去找该 type 的 mentions，但 precision
    崩溃 (0.194) 因为 union  merge 无法判断哪个 type assignment 正确；(3) 32x latency 使其 impractical。

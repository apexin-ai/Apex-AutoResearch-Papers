    SCS fallback；(2) calibration 数据 的 confusion pattern 与 test 数据不一致（不同文本域、不同实体分布），empirical  confusion
    matrix 的 generalization 差；(3) 即使 graph coloring 用了更准确的 weights， merge amplification

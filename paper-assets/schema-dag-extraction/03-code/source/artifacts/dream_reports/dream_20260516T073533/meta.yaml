      LLM 的主要失败模式不是凭空捏造，而是在已知实体上标错类型—— 这直接验证了 "confusability → type confusion" 通道的存在。cross-task
      replication (FewRel ρ=0.954) 证明此机制不限于 NER，在 RE 中同样成立。

      '

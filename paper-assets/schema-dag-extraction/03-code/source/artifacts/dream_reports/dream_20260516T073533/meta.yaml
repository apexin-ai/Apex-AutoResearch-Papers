    result_rationale: '在 best 档下，error taxonomy 展现近乎完美的单调关系：IntraSub (intra-batch
      type substitution) 从 BCS=0 时的 0% 单调上升至 BCS≥0.95 时的 49.4%。这是因为 LLM 在 type assignment
      阶段 进行的是 soft attention over prompt-listed types——当两个 semantically similar types
      共现于 同一 batch prompt 中，attention weights 在它们之间分散，导致 type confusion。BCS=0 意味着
      batch 内无其他类型（单类型），自然不可能发生 intra-batch confusion。随着 BCS 增加（更多语义相邻 类型共现），confusion

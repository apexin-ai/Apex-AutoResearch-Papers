    \ weak reject\ntimestamp: 2026-05-16T08:23:11.564472+00:00\n---\n\n# Dream Review\
    \ Report: Schema-Induced Failure Modes in Training-Free LLM IE\n\n**Paper**: \"\
    Characterizing and Diagnosing Schema-Induced Failure Modes in Training-Free LLM\
    \ Information Extraction\"  \n**Review mode**: Full (2 Reviewers + Roundtable)\
    \  \n**Date**: 2026-05-16  \n**Venue standard**: Top ML venue (acceptance ~25%,\
    \ 6-point scale)\n\n---\n\n## Roundtable Summary\n\n| Reviewer | Focus | Score\
    \ | Confidence |\n|----------|-------|-------|------------|\n| R1 | Methods +\
    \ Experiments | 3 (Weak Reject) | 4/5 |\n| R2 | Novelty + Related Work | 3 (Weak\
    \ Reject) | 4/5 |\n| **Consensus** | | **3 (Weak Reject)** | **4/5** |\n\n---\n\
    \n## Step 1: Independent Reviews\n\n### R1 — Methods & Experiments\n\n**Summary.**\
    \ The paper proposes a diagnostic framework decomposing schema-induced degradation\
    \ in training-free LLM IE into count→recall and confusability→type confusion channels.\
    \ While the error taxonomy is well-constructed, the central experimental claims\
    \ suffer from underpowered designs, weak effect sizes, and a proposed method (SDGD)\
    \ that fails uniformly.\n\n**Strengths:**\n- The error taxonomy (Table 4) is the\
    \ paper's strongest contribution. IntraSub scaling monotonically from 0% to 49.4%\
    \ across BCS bins, replicated on both NER (ρ=1.0) and RE (ρ=0.954), provides clean\
    \ mechanistic evidence for confusability-driven type confusion.\n- Thorough ablation\
    \ spectrum (single-pass → random → SDGD-zero → SDGD-cal → per-type) with matched\
    \ batch counts, allowing fair comparison across decomposition strategies.\n- Commendable\
    \ transparency about negative results—SDGD failure is presented honestly rather\
    \ than hidden.\n- The random-vs-SDGD ablation (Table 11) revealing batch size\
    \ imbalance as the proximate cause of SDGD's failure is a genuine diagnostic insight.\n\
    \n**Weaknesses:**\n\n- **(Critical) \"Orthogonal channels\" claim unsupported.**\
    \ The 2×2 interaction test (Section 4.2) yields p=0.50 with only ~13 batches per\
    \ cell, BCS range restricted to 0.79–0.87, and count span of only 6 vs 12. This\
    \ design has negligible statistical power to detect interaction effects. The paper\
    \ cannot claim the channels are \"orthogonal\" based on a null result from an\
    \ underpowered test—absence of evidence ≠ evidence of absence. The permutation\
    \ test for slope equality does not rescue this.\n\n- **(Critical) SCS explains\
    \ negligible variance at the pair level.** R²=2.8% (all pairs, Qwen3) means 97%\
    \ of confusion variance is driven by factors other than embedding similarity.\
    \ The nonzero-only analysis (R²=9.4%) conditions on the dependent variable—of\
    \ course similarity predicts confusion *given that confusion occurred*. This selection\
    \ bias inflates the apparent signal. At the pair level, the practical predictive\
    \ utility of SCS is near zero.\n\n- **(Major) DocRED BCS effect is inconclusive.**\
    \ Pearson r=−0.22 (p=0.14), Spearman ρ=−0.19 (p=0.21), CI crosses zero [−16.1,\
    \ +0.5]pp. With only n=5 batches per condition, this experiment lacks power to\
    \ draw conclusions about confusability effects in document-level RE. The paper\
    \ acknowledges this but still includes the result as supporting evidence for Channel\
    \ 2's generality across tasks.\n\n- **(Major) Count curve confounded with prompt\
    \ length.** The DocRED count curve (0.82→0.31) cannot disentangle type count from\
    \ prompt token length. Adding 96 type definitions to a prompt for document-level\
    \ RE simultaneously increases context window pressure. Without controlling for\
    \ prompt length (e.g., padding shorter prompts), the \"count→recall\" channel\
    \ is confounded.\n\n- **(Major) Single model limits generalizability.** All primary\
    \ experiments use Qwen3-32B. The review context suggests Channel 2 was not reproduced\
    \ on a second model (Llama-8B) for NER. Without cross-model validation, findings\
    \ may reflect Qwen3-specific behavior rather than general properties of training-free\
    \ IE.\n\n- **(Minor) BCS bin thresholds appear post-hoc.** The error taxonomy\
    \ uses bins at 0.0/0.75/0.85/0.95 without theoretical justification. Different\
    \ binning choices could alter the monotonic trend's appearance.\n\n- **(Minor)\
    \ Merge strategy limited to naive union+dedup.** Only one merge strategy is evaluated.\
    \ The conclusion that \"merge amplification is fundamental\" is premature without\
    \ testing more sophisticated alternatives (confidence calibration, LLM-based arbitration,\
    \ majority voting).\n\n**Questions for Authors:**\n1. What is the statistical\
    \ power of the 2×2 design to detect a meaningful interaction (e.g., 5pp difference)?\
    \ Can you provide a post-hoc power analysis?\n2. Can you control for prompt token\
    \ length in the count curve analysis, e.g., by padding shorter prompts to constant\
    \ length?\n3. Have you tested SCS with model-internal representations (e.g., last-layer\
    \ attention patterns) rather than external embeddings? The gap between embedding\
    \ SCS and empirical confusion suggests the wrong representation space.\n4. Why\
    \ was the per-type result (recall=0.586) not explored as a recall-oriented pipeline\
    \ with a secondary type disambiguation step?\n\n---\n\n### R2 — Novelty & Related\
    \ Work\n\n**Summary.** The paper presents a controlled empirical study of schema\
    \ complexity effects in training-free IE, framed as a \"diagnostic framework.\"\
    \ While the experimental execution is careful and the honesty about negative results\
    \ is appreciated, the contributions do not clear the novelty bar for a top ML\
    \ venue: the framework formalizes known intuitions, the proposed method fails,\
    \ and the prescriptive guidelines rest on a weak signal.\n\n**Strengths:**\n-\
    \ Controlled experimental methodology: within-pool BCS controls, matched batch\
    \ counts for ablations, and appropriate statistical tests (permutation, bootstrap\
    \ CIs).\n- Cross-task evaluation on three diverse IE tasks (NER, RE, ED) with\
    \ naturally varying schema sizes (66, 96, 168 types).\n- The \"real but not actionable\"\
    \ framing (Section 5.2) is intellectually honest and identifies a genuine paradox\
    \ worth discussing.\n- The merge amplification analysis provides a concrete mechanistic\
    \ explanation for why decomposition fails—this is more valuable than simply reporting\
    \ negative results.\n\n**Weaknesses:**\n\n- **(Critical) Framework formalizes\
    \ trivially expected results.** \"More types → lower recall\" and \"similar types\
    \ → more confusion\" are well-known in any classification setting. The error taxonomy\
    \ confirms that when you put similar types together, the model confuses them more—this\
    \ does not require a controlled experiment. The claim of being \"the first controlled\
    \ study\" of type confusability conflates novelty of the research question with\
    \ novelty of the experimental design.\n\n- **(Critical) No actionable contribution.**\
    \ The paper identifies a problem (confusability), validates it weakly (R²=3-9%),\
    \ proposes a solution (SDGD) that fails, and falls back on generic guidelines\
    \ (\"prefer single-pass,\" \"use random batching\"). A top venue expects either\
    \ (a) a working method, (b) deep mechanistic understanding (e.g., attention-level\
    \ analysis of why confusion occurs), or (c) a strong theoretical framework. This\
    \ paper provides none.\n\n- **(Major) Related work is thin and missing key connections.**\n\
    \  - **Fine-grained classification literature**: decades of work on confusion\
    \ among similar categories (e.g., fine-grained visual classification, hierarchical\
    \ text classification) that established the \"similar things confuse classifiers\"\
    \ finding long ago.\n  - **Constrained decoding / code-generation approaches**:\
    \ GoLLIE (cited but not analyzed) sidesteps schema confusion by design through\
    \ structured code output. Why wasn't this compared?\n  - **Cognitive science foundations**:\
    \ type similarity effects on categorization have been studied since Rosch (1975).\
    \ The paper could have grounded its framework in prototype theory or exemplar\
    \ theory.\n  - **Concurrent IE schema work**: structured extraction methods (e.g.,\
    \ InstructUIE, YAYI-UIE) that handle large schemas through different mechanisms.\n\
    \n- **(Major) Schema design guidelines are under-supported.** The 5 guidelines\
    \ in Section 5.3 are presented as a \"prescriptive\" contribution, but:\n  - Guideline\
    \ 1 (\"prefer single-pass up to 16-32 types\") is based on one model on one dataset\
    \ (DocRED).\n  - Guideline 2 (\"use random batching, not confusability-aware\"\
    ) directly follows from the negative SDGD result—it's a restatement, not a new\
    \ insight.\n  - Guideline 4 (\"prefer hierarchical extraction\") is completely\
    \ unvalidated—no experiment tests coarse→fine extraction.\n  - Guideline 5 (\"\
    don't rely on SCS alone\") is trivially implied by R²<10%.\n  - A \"decision tree\"\
    \ based on a predictor explaining 3% of variance is unreliable by construction.\n\
    \n- **(Major) Framing as \"diagnostic framework\" overclaims.** The paper is an\
    \ empirical analysis with negative method results, not a framework. A framework\
    \ implies reusable abstractions, formal properties, or tools. The error taxonomy\
    \ (4 categories defined by span matching) is a classification scheme, not a framework.\
    \ Calling it a \"multi-channel degradation model\" suggests mathematical modeling\
    \ that is absent.\n\n- **(Minor) The \"orthogonal\" terminology is loaded.** Orthogonality\
    \ implies statistical independence, which the 2×2 test (p=0.50) cannot confirm.\
    \ The paper uses \"orthogonal\" in the title-level claim based on a non-significant\
    \ null result from an underpowered design.\n\n**Questions for Authors:**\n1. How\
    \ does this work relate to decades of fine-grained classification research showing\
    \ that similar categories are confused more often? What is genuinely new beyond\
    \ applying this known phenomenon to training-free LLM IE?\n2. Why not evaluate\
    \ GoLLIE-style code-generation approaches as a structural alternative to schema\
    \ decomposition?\n3. The hierarchical extraction guideline (coarse→fine) is unvalidated.\
    \ Could you provide even a pilot experiment?\n4. What would a \"working\" version\
    \ of this research look like? If the diagnostic insight cannot be operationalized,\
    \ what is the path forward beyond \"try single-pass\"?\n\n---\n\n## Step 2: Cross-Sharing\n\
    \nR1 and R2 exchanged reviews. Key reactions:\n\n**R1 reacting to R2:**\n- Agrees\
    \ that the \"framework\" framing overclaims. The error taxonomy is a classification\
    \ scheme; the two-channel model is a hypothesis, not a formalized framework.\n\
    - Agrees related work is thin—the fine-grained classification connection is an\
    \ important omission.\n- Notes that R2's \"trivially expected\" critique, while\
    \ fair at the conceptual level, should acknowledge that the *quantitative characterization*\
    \ (ρ=1.0 monotonic trend, 0%→49.4% IntraSub) adds precision even if the direction\
    \ is expected.\n\n**R2 reacting to R1:**\n- Agrees that the count-prompt length\
    \ confound is critical and under-acknowledged.\n- Reinforces the point about SCS's\
    \ practical uselessness: R1's pair-level R²=2.8% analysis is more damning than\
    \ the paper's framing suggests.\n- Agrees the random > SDGD finding is the most\
    \ diagnostic single result, but notes it could have been anticipated before running\
    \ experiments (balanced batches > unbalanced is well-known in ensemble literature).\n\
    \n## Step 3: Convergence\n\n**Points of agreement (both reviewers):**\n\n1. **Error\
    \ taxonomy is the strongest contribution** — the monotonic IntraSub–BCS relationship\
    \ is clean, replicated, and provides mechanistic evidence. However, both agree\
    \ it is *descriptive* rather than constituting a methodological advance.\n\n2.\
    \ **\"Orthogonal channels\" claim is unsupported** — the 2×2 test is underpowered,\
    \ and the paper cannot claim orthogonality from a null result. This should be\
    \ downgraded from a central claim to a hypothesis.\n\n3. **SCS is practically\
    \ useless as a predictor** — R²=3% means the proxy captures almost nothing. The\
    \ nonzero-only analysis inflates the signal through selection bias. Both agree\
    \ SCS cannot support prescriptive schema design.\n\n4. **SDGD failure is informative\
    \ but insufficient as a standalone contribution** — negative results are valuable\
    \ when they provide deep mechanistic understanding or close off a research direction\
    \ convincingly. Here, the explanation (\"merge amplification\") is intuitive but\
    \ not formalized, and only one merge strategy was tested.\n\n5. **Single-model\
    \ limitation is significant** — Qwen3-32B-only experiments limit generalizability\
    \ claims.\n\n6. **Paper falls between analysis and methods contribution** — too\
    \ little novelty for a methods paper (SDGD fails), too little depth for an analysis\
    \ paper (no attention-level mechanistic investigation, no theoretical modeling).\n\
    \n**Points of mild disagreement:**\n\n- R1 values the random-vs-SDGD ablation\
    \ more highly (identifies batch size imbalance as non-obvious diagnostic finding);\
    \ R2 considers it \"obvious in hindsight\" from ensemble literature. **Resolution**:\
    \ the finding has some value as applied to this specific setting, but doesn't\
    \ rise to a major contribution.\n\n- R2 is harsher on the \"trivially expected\"\
    \ nature of the error taxonomy; R1 gives more credit for quantitative precision.\
    \ **Resolution**: the quantification adds value, but the direction was predictable,\
    \ and a top venue expects contributions beyond confirming expectations.\n\n##\
    \ Step 4: Consolidated Assessment\n\n### Overall Score: 3/6 (Weak Reject) | Confidence:\
    \ 4/5\n\n### Verdict\nThe paper conducts a careful empirical investigation into\
    \ schema-induced degradation in training-free LLM IE, with commendable transparency\
    \ about negative results. The error taxonomy provides clean evidence that type\
    \ confusion scales with pairwise similarity, and the merge amplification analysis\
    \ offers a useful diagnostic. However, the paper falls below the acceptance threshold\
    \ for a top ML venue for several compounding reasons:\n\n**The contribution gap.**\
    \ The paper sits in an uncomfortable middle ground: it identifies a real phenomenon\
    \ (confusability-driven type confusion) but cannot operationalize it (SDGD fails),\
    \ cannot predict it well (R²=3-9%), and cannot offer deep mechanistic explanation\
    \ (no attention analysis, no formal modeling). The \"diagnostic framework\" framing\
    \ overpromises relative to what is delivered—a controlled empirical study with\
    \ descriptive findings and negative method results.\n\n**Statistical insufficiency\
    \ on key claims.** The \"orthogonal channels\" claim rests on a non-significant\
    \ 2×2 test (p=0.50) with an underpowered design. The DocRED BCS effect is inconclusive\
    \ (CI crosses zero). The SCS proxy explains negligible variance. Multiple central\
    \ claims lack adequate statistical support.\n\n**Novelty concerns.** The core\
    \ finding—similar types are confused more often—is expected from fine-grained\
    \ classification literature. The quantitative characterization adds precision\
    \ but not conceptual novelty. The schema design guidelines are either restatements\
    \ of negative results, common sense, or unvalidated (hierarchical extraction).\n\
    \n**Limited generalizability.** Single model (Qwen3-32B), single merge strategy,\
    \ no cross-model Channel 2 validation on NER.\n\n### Actionable Recommendations\
    \ for Improvement\n\n1. **Reframe claims conservatively.** Drop \"orthogonal\"\
    \ and \"framework.\" Lead with the error taxonomy as the primary contribution\
    \ and frame the two channels as a descriptive hypothesis, not a validated model.\n\
    \n2. **Add a powered interaction test.** Use synthetic schemas with controlled\
    \ BCS (not natural Few-NERD batches) and wider count span (e.g., 4 vs 32) to properly\
    \ test channel interaction.\n\n3. **Investigate mechanisms at the attention level.**\
    \ Analyze attention patterns over type definitions during extraction to explain\
    \ *why* similar types cause confusion—this would elevate from description to mechanistic\
    \ understanding.\n\n4. **Test alternative merge strategies.** Confidence-calibrated\
    \ merge, LLM-based arbitration, or majority voting. If these also fail, the \"\
    merge amplification is fundamental\" claim becomes much stronger.\n\n5. **Cross-model\
    \ validation.** Reproduce Channel 2 on at least one additional model (e.g., Llama-3,\
    \ GPT-4) to establish generalizability.\n\n6. **Validate hierarchical extraction.**\
    \ The coarse→fine guideline is the most prescriptive recommendation but is entirely\
    \ unvalidated. A pilot experiment would substantially strengthen the practical\
    \ contribution.\n\n7. **Expand related work.** Connect to fine-grained classification,\
    \ cognitive categorization theory, and constrained decoding approaches. Position\
    \ against GoLLIE-style structured generation as a fundamentally different approach\
    \ to the same problem.\n\n### Suitable Venue Assessment\n- **Top ML venue main\
    \ conference**: Below threshold. Insufficient novelty, weak statistical support\
    \ for central claims, no working method.\n- **Findings/short paper track**: Possible\
    \ if reframed modestly around (a) the error taxonomy and (b) the merge amplification\
    \ negative result as the two focused contributions.\n- **Workshop paper**: Well-suited\
    \ for an IE or structured prediction workshop where the diagnostic findings and\
    \ negative results would be directly relevant to practitioners.\n"

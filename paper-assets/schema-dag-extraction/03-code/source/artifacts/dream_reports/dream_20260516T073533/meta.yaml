      recall_improvement_sdgd_vs_single: +(-0.01)
      precision_drop_sdgd_vs_single: -0.177
      merge_amplification_ratio: 2.6
    result_rationale: 'MAVEN 有 168 event types，decomposition 需要更多 batches（~12-14 vs
      Few-NERD 的 4-8）。 在 best 档下，SDGD-zero 的 merge amplification 问题在 MAVEN 上更为严重，因为：
      (1) event trigger 的 boundary matching 本就模糊（exact F1 接近 0，relaxed F1 ~0.25），
      decomposed batches 各自产生 slightly different trigger boundaries → merge 时无法精确
      dedup。 (2) 168 types 意味着 confusability graph 更密（MAVEN 语义均匀），SDGD 切分后仍有 residual
      confusability within batches（因为切分只能 minimize 而非 eliminate）。 (3) 同 Few-NERD 一致，decomposition
      提升 recall（每个 batch 关注更少 types → 更少 miss）但 merge 产生大量 duplicate/conflicting predictions
      → precision 暴跌。 SDGD-zero 0.142 < random_batch 0.178 < single_pass 0.247——与
      Few-NERD 的 ordering 完全一致， 证明 merge amplification 是跨任务的结构性挑战。这被 best 档 framing
      为诚实的 negative result， 指向 calibration-based merge（SDGD-cal）或 single-pass + type-aware
      prompt engineering 作为 future work。

      '

- id: llm-pee-2025
  title: "Towards Event Extraction with Massive Types: LLM-based Collaborative Annotation and Partitioning Extraction"
  year: 2025
  venue: arXiv
  url: https://arxiv.org/abs/2503.02628
  role: direct-competitor
  relevance_note: >
    Similarity-based type recall + type-partitioning prompting for massive event types.
    Divides candidate types into partitions to reduce prompt length.
    +5.4% event detection, +6.1% argument extraction, +12.9% F1 over mainstream LLMs zero-shot.
    KEY DIFF: partitions by similarity-based recall, NOT confusability-aware.
    Our DAG decomposition is confusability-driven, not just similarity-driven.


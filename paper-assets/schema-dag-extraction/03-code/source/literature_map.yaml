# =============================================================================
#
# 1. "Type count vs type confusability" disentangling:
#    ✅ NOVELTY SAFE — No prior work explicitly disentangles these two factors.
#    - IEPILE hard negatives: closest, but for training, not inference-time decomposition.
#    - Familiarity metric: measures label similarity for evaluation bias, not extraction.
#    - CROSSAGENTIE: resolves type confusion via debate, doesn't model as degradation channel.
#    Our multi-channel degradation model (count + confusability + context) is novel.
#
# 2. Schema decomposition baselines to compare:
#    - LLM-PEE (similarity partitioning) — MUST compare
#    - PARSE (LLM-driven schema rewriting) — MUST compare
#    - DEE (task-level decomposition) — discuss in related work
#    - SPT (schema as tools) — discuss in related work
#    - DLISC (Dual-LoRA schema caching) — discuss in related work
#
# 3. "Lost in the Middle" for IE:
#    ✅ OPPORTUNITY — No follow-up work applying it to IE task found.
#    We can be first to connect positional bias to schema prompt design.
#
# 4. Multi-agent approaches (CROSSAGENTIE, CMAS):
#    Growing area. Position clearly: we reduce confusion proactively via decomposition,
#    they resolve it reactively via debate. Complementary, not conflicting.
#
# 5. Overall novelty position:
#    STRONG — no prior work proposes (a) a formal multi-channel degradation model for
#    schema complexity in LLM IE, or (b) a DAG-based schema decomposition optimized
#    for type confusability. Main risk is CROSSAGENTIE's cross-type debate framing.

- name: Random Batching Ablation
  plan_id: exp-013
  description: 与 SDGD 相同 batch count k 的 random composition，隔离 confusability-aware
    grouping 的增量
  expected_results:
    fewnerd_k4:
      random_f1: 0.305
      sdgd_zero_f1: 0.241
      delta_pp: '+6.4'
    fewnerd_k8:
      random_f1: 0.295
      sdgd_zero_f1: 0.22
      delta_pp: '+7.5'
    maven_k8:
      random_f1: 0.175
      sdgd_zero_f1: 0.135
      delta_pp: '+4.0'
    single_pass_f1_fewnerd: 0.445
    single_pass_f1_maven: 0.247
  result_rationale: 'Random batching 在所有条件下优于 SDGD-zero，看似反直觉但有清晰解释： (1) SDGD-zero
    的 graph coloring + min_batch_size 约束产生高度不均匀的 batch sizes—— 某些 batch 仅含 3-4 types，prompt
    中类型太少时模型缺乏任务范围 context，对每个类型  过度 predict（high recall, terrible precision）；random
    batching 的 batch size 更均匀， 避免了这一退化模式；(2) SDGD-zero 将所有 "hard" (high-SCS) types
    集中到同一个  batch，这些 batch 的 precision 崩溃；random 分散了 hard pairs，每个 batch 混合  easy+hard，整体更
    balanced；(3) confusability-aware grouping 的正确 operationalization  应是 "将 confusable
    pairs 分开"，但 SDGD-zero 的贪心 coloring 在约束下反而集中了  难题。这说明 SDGD-zero 的分组算法有 design flaw，不否定
    confusability signal 本身。 Median 档位下，"SDGD-zero < random" 是 reviewer 最容易攻击的点之一。

    '
  tables:

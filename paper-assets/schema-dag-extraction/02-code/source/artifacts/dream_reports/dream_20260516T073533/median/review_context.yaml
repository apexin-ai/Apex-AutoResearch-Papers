- name: SDGD-zero on MAVEN
  plan_id: exp-009
  description: SDGD-zero 在 MAVEN 168 event types 上测试，对比 single-pass + random
  expected_results:
    single_pass:
      relaxed_f1: 0.247
      precision: 0.32
      recall: 0.2
      batches: 1
      time_s: 130
    random_batch:
      relaxed_f1: 0.175
      precision: 0.14
      recall: 0.23
      batches: 12
      time_s: 950
    sdgd_zero:
      relaxed_f1: 0.135
      precision: 0.12
      recall: 0.155
      batches: 8
      time_s: 680
    per_type:
      relaxed_f1: 0.11
      precision: 0.07
      recall: 0.3
      batches: 168
      time_s: 9200
  result_rationale: 'MAVEN 168 types 使所有 decomposition 方法的表现更差，原因层叠：(1) 168 types
    产生  更多 batches，每次 merge 引入更多冲突——merge amplification 与 batch 数量超线性增长； (2) MAVEN
    event types 语义高度同质（均为 FrameNet 层级，SCS mean=0.216,  119 pairs>0.5），SDGD-zero 的
    graph coloring 无法有效分离——色数极高，被迫使用  大量 small batches 或在同 batch 内保留高 SCS pairs；(3)
    event trigger boundary  本身模糊（exact F1 仅 0.01-0.03），decomposition 后 merge 多个 batch
    的 trigger  predictions 进一步恶化边界匹配。SDGD-zero F1=0.135 vs single-pass 0.247，退化比 (0.55)
    与 Few-NERD 上一致 (0.24/0.45=0.53)。Random batch 再次优于 SDGD-zero  (0.175 vs 0.135)——SDGD
    的不均匀 batch size 在 MAVEN 上伤害更大。Per-type (168 batches)  recall 最高但 precision 崩溃（0.07），9200s
    延迟不可接受。 Median 档位下，此实验巩固 "merge amplification 是跨任务的结构性障碍"，但同时加深  "no practical
    method" 这一 major weakness。

    '
  tables:
  - name: 'Table: SDGD Comparison — MAVEN 168 types'
    content: '| Method      | Relaxed F1 | P     | R     | k   | Time(s) |

      |-------------|------------|-------|-------|-----|---------|

      | Single-pass | 0.247      | 0.320 | 0.200 | 1   | 130     |

      | Random      | 0.175      | 0.140 | 0.230 | 12  | 950     |

      | SDGD-zero   | 0.135      | 0.120 | 0.155 | 8   | 680     |

      | Per-type    | 0.110      | 0.070 | 0.300 | 168 | 9200    |

      '
  figures_description:
  - 'Bar chart: single-pass 大幅领先，所有 decomposition 方法均为负面'
  - 'Cross-dataset comparison: Few-NERD vs MAVEN decomposition penalty 一致'
  analysis: '与 Few-NERD 模式完全一致。论文中应将 Few-NERD + MAVEN 的 SDGD 负面结果并排呈现， 强调 "decomposition
    penalty 是 task-agnostic 的结构性问题"。同时明确指出 merge  strategy 是瓶颈（不是 grouping quality），为
    future work 指明方向。Reviewer 的核心 质疑仍然是 "如果你的方法不 work，这篇论文的 practical value 是什么？"。

    '
- name: SDGD-cal on Few-NERD
  plan_id: exp-010
  description: 基于 5-10 个 calibration examples 的 empirical confusability graph，对比 SDGD-zero
  expected_results:
    sdgd_cal_5shot:
      f1: 0.295
      precision: 0.34
      recall: 0.26
      batches: 5
      time_s: 370
      calibration_overhead_s: 50
    sdgd_cal_10shot:
      f1: 0.315
      precision: 0.36
      recall: 0.28
      batches: 5
      time_s: 370
      calibration_overhead_s: 90
    vs_baselines:
      sdgd_zero_f1: 0.241
      random_batch_f1: 0.301
      single_pass_f1: 0.445
      cal5_vs_zero_pp: '+5.4'
      cal10_vs_zero_pp: '+7.4'
      cal10_vs_single_pass_pp: '-13.0'
  result_rationale: 'Calibration 用 empirical confusion matrix 替代 embedding SCS，绕过了
    embedding  选择问题，直接捕捉模型实际 confusion pattern。改善来源：(1) empirical confusion  比 SCS
    更准确地识别 true confusion pairs（SCS 只解释 ~3% 方差，empirical 解释更多）； (2) 基于实际错误的 graph
    更 sparse（大部分 type pairs 从不 confused），graph coloring  产生更均衡的 batches。但仍远低于 single-pass
    (-13pp) 的原因不变：merge amplification  与 grouping quality 关系不大，是 decomposition 本身的结构性问题——即使完美分组避免了  所有
    confusion pairs，合并多个 batch 的输出时同一 span 仍会被多个 batch "认领"。 5-shot vs 10-shot 差异小（0.295
    vs 0.315），因为 5 个样本已识别出主要 confusion  clusters（person 子类、location 子类）。Median 档位下，SDGD-cal
    展示了 "right  direction" 但 Δ=+7pp 不构成 practical improvement，reviewer 评价 "interesting  diagnostically
    but not actionable"。

    '
  tables:
  - name: 'Table: SDGD-cal vs Baselines (Few-NERD)'
    content: '| Method        | F1    | P     | R     | k | Extra(s) |

      |---------------|-------|-------|-------|---|----------|

      | Single-pass   | 0.445 | 0.563 | 0.368 | 1 | 0        |

      | Random        | 0.301 | 0.331 | 0.276 | 8 | 0        |

      | SDGD-zero     | 0.241 | 0.324 | 0.191 | 4 | 0        |

      | SDGD-cal (5)  | 0.295 | 0.340 | 0.260 | 5 | 50       |

      | SDGD-cal (10) | 0.315 | 0.360 | 0.280 | 5 | 90       |

      '
  figures_description:
  - 'Bar chart: F1 阶梯 SDGD-zero < SDGD-cal ≈ Random << Single-pass'
  - 'Precision-Recall scatter: 所有 decomposition 方法位于 single-pass 的 Pareto 劣势区'
  analysis: 'SDGD-cal ≈ Random batch 的事实 is telling：即使用最好的 grouping signal，结果也不比 随机好多少。这进一步证实瓶颈是
    merge 不是 grouping。论文中应明确写出这个 implication。 Reviewer 的追问："为什么不探索 confidence-weighted
    merge / NMS-style 去重？"—— 这是合理的 future work 方向，v2 已尝试 confidence-gated 但未奏效，说明问题比  simple
    filtering 更深。

    '

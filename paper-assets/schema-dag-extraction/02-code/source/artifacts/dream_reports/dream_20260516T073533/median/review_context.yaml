  plan_id: exp-015
  description: Spearman/Kendall correlation between embedding SCS 和 empirical confusion
    matrix
  expected_results:
    all_pairs:
      n: 1953
      qwen3_spearman: 0.168
      qwen3_p: '7.3e-14'
      qwen3_kendall: 0.135
      minilm_spearman: 0.144
      minilm_p: '1.7e-10'
      minilm_kendall: 0.115
    nonzero_only:
      n: 216
      qwen3_spearman: 0.272
      qwen3_p: '5.0e-5'
      qwen3_kendall: 0.2
      minilm_spearman: 0.306
      minilm_p: '4.6e-6'
      minilm_kendall: 0.228
    variance_explained:
      all_pairs_r_squared: 2.8-4.8%
      nonzero_r_squared: 7.4-9.4%
  result_rationale: 'SCS 是有效但不完美的 confusion proxy。All-pairs ρ 偏低（0.14-0.17）的根本原因是  data
    极度 zero-inflated：88.9% 的 type pairs 从未被混淆（confusion=0），产生大量  ties 压缩 rank correlation。Nonzero-only
    ρ 跳升到 0.27-0.31，说明 SCS 能有效区分  "哪些 pairs 被混淆得更多" 但不太能预测 "哪些 pairs 会被混淆"。 Qwen3
    在 all-pairs 上更好（ρ=0.168 vs 0.144）——extraction model 的 embedding  更好地捕捉 "是否会混淆"
    的 threshold，因为 embedding space 与 model 的 internal  representation 对齐。MiniLM 在
    nonzero-only 上更好（ρ=0.306 vs 0.272）——sentence  similarity model 的 fine-grained
    similarity gradient 更平滑，更好地排序 confusion  程度。 Median 档位下，reviewer 的主要质疑是 R²=3-5%：如果你的
    proxy 只解释 3-5% 的方差， 基于它构建的 SDGD 分组怎么可能有效？这恰好与 SDGD-zero 的失败一致——SCS 作为 grouping  signal
    太 noisy。论文应将此定位为 "validating the existence of the signal" 而非  "validating its
    practical sufficiency"，并指向 SDGD-cal (empirical confusion)  作为正确的 operationalization
    路径。

    '

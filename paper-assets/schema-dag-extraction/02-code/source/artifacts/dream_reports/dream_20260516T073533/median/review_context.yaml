  analysis: '关键 takeaway 不是 "confusability-aware grouping 无用"，而是 "当前的 SDGD-zero  实现的分组策略有副作用（batch
    size 不均匀、hard type 集中化）抵消了 grouping 收益"。 论文应 (1) 诚实报告 random > SDGD-zero；(2) 分析原因（batch
    size distribution,  hard-batch concentration）；(3) 指出 all decomposition << single-pass，真正的瓶颈是  merge
    不是 grouping。Reviewer 可能追问 "为什么不修复 SDGD 的 batch size 问题？"—— 合理的 rebuttal 是 exp-010
    的 SDGD-cal 部分解决了这个问题但仍低于 single-pass。

    '
- name: Per-type Splitting (UniNER-style)
  plan_id: exp-014
  description: 每 batch 仅含 1 type，decomposition 的理论上限
  expected_results:
    fewnerd:
      f1: 0.29
      precision: 0.195
      recall: 0.585
      batches: 66
      time_s: 2550
      intra_sub_rate: 0.0
      recall_vs_single_pass_pp: '+21.7'
      precision_vs_single_pass_pp: '-36.8'
      f1_vs_single_pass_pp: '-15.5'
    maven:
      relaxed_f1: 0.145
      precision: 0.085
      recall: 0.46
      batches: 168
      time_s: 9500
  result_rationale: 'Per-type splitting 完全消除了 type confusion (IntraSub=0)——每个 batch
    只有一个类型， 不可能把 entity 标为 "wrong" type。这验证了 multi-channel model 的 Channel 1 预测： Recall
    从 0.368 跃升至 0.585 (+21.7pp)，因为每个 prompt 只需关注一个类型， attention 不被稀释，不遗漏。但 Precision
    从 0.563 崩溃到 0.195 (-36.8pp)—— 66 个 batch 的 union merge 引入大量冲突：同一 text span 被 person-scholar、
    person-scientist、person-other 各自 "认领"，union merge 保留所有 predictions， precision
    崩溃。F1 净效果为负 (-15.5pp)。 MAVEN 168 types 更极端——recall 高但 precision 更低（0.085），因为 168
    个 single-type  batch 的 merge 冲突呈 O(k²) 增长。 这清晰展示了 decomposition 的 fundamental
    tradeoff：分解减少 miss (Channel 1 benefit)， 但 merge 产生 false positives (new Channel
    3 problem)。当前所有 merge strategy  （union, confidence-gated）都不能解决 O(k) batches 的冲突。

    '
  tables:
  - name: 'Table: Full Decomposition Spectrum (Few-NERD)'
    content: '| Method      | F1    | P     | R     | k  | IntraSub | Time(s) |

      |-------------|-------|-------|-------|----|----------|---------|

      | Single-pass | 0.445 | 0.563 | 0.368 | 1  | baseline | 79      |

      | Random (k=8)| 0.295 | 0.330 | 0.270 | 8  | moderate | 494     |

      | SDGD-zero   | 0.241 | 0.324 | 0.191 | 4  | low      | 261     |

      | SDGD-cal    | 0.315 | 0.360 | 0.280 | 5  | low      | 460     |

      | Per-type    | 0.290 | 0.195 | 0.585 | 66 | 0        | 2550    |

      '
  figures_description:
  - 'Precision-Recall tradeoff: per-type 在 high-recall/low-precision 极端，single-pass
    在 balanced 区'
  - 'Stacked bar: recall gain vs precision loss，per-type 的 precision loss 完全 dominate'
  analysis: 'Per-type 的 recall 优势是 decomposition 正确直觉的最好证据——问题确实在 merge。 论文结构建议：先展示
    per-type 的 recall gain (证明 decomposition 有理论价值)， 再展示所有方法的 precision collapse (证明
    merge amplification 是瓶颈)， 最后指出 "future work needs better merge, not better grouping"。
    Reviewer 会欣赏这个清晰的 ablation 分析。1-2 位 reviewer 仍会标注 "the paper  identifies the problem
    but doesn''t solve it" 作为 major weakness，这是 median 档 避不开的。

    '

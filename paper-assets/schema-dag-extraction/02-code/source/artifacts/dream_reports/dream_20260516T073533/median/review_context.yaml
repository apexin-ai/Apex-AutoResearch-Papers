      bcs_low_pct: 1.6
      bcs_medium_pct: 10.6
      bcs_high_pct: 49.4
      rho: 1.0
      p: <0.001
    fewrel_intra_sub_by_bcs:
      bcs_zero_pct: 0.0
      bcs_low_pct: 4.2
      bcs_medium_pct: 13.0
      bcs_high_pct: 20.3
      bcs_very_high_pct: 32.3
      rho: 0.954
      p: <1e-6
    cross_task:
      ner_rho: 1.0
      re_rho: 0.954
    extra_sub: 0.0
    hallucination_pct: <3%
    missed_rate_range: 10-16%
  result_rationale: 'Error taxonomy 是 median 档中最无争议的证据（A2 完全成立）。IntraSub 与 BCS 的  perfect/near-perfect
    monotonic 关系直接验证了 multi-channel model 的核心机制： confusability 导致 type confusion（IntraSub）而非
    detection failure（missed rate  不变 10-16%）。几个关键支撑点：(1) extra_sub=0，type confusion
    严格是 intra-batch  现象，模型只从当前 schema 中选类型；(2) hallucination<3%，LLM 的主错误模式是  "选错类型"
    而非 "编造实体"；(3) cross-task replication 几乎完美（NER ρ=1.0,  RE ρ=0.954），同一机制跨 NER 和
    RE。即使在 median 档位，reviewer 也不会质疑这个分析。 这是论文的 "safe anchor"。


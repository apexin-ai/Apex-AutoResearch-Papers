    content: '|              | Low BCS | High BCS | BCS Δ  |

      |--------------|---------|----------|--------|

      | Count=6      | 0.324   | 0.313    | -0.011 |

      | Count=12     | 0.325   | 0.277    | -0.048 |

      | Count Δ      | +0.001  | -0.036   |        |

      | Interaction: z=-0.67, p=0.50 (n.s.)        |

      '
  figures_description:
  - 'Interaction plot: 两条线（low/high BCS）跨 count 水平，方向 non-parallel 但 CI 大量重叠'
  analysis: '需要在论文中如实报告 null result 并提供 power analysis。FewRel 16→80 的 3.4×  amplification
    作为 indirect interaction evidence。Reviewer 可能要求在 80-rel pool  上做正式 2×2 作为 rebuttal
    补充分析。

    '
- name: Error Taxonomy
  plan_id: exp-007
  description: 系统性 FP 分类跨 BCS bins，multi-channel 机械性证据

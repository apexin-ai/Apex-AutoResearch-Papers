- name: Interaction Effect 2×2
  plan_id: exp-006
  description: '{low/high count} × {low/high BCS} 检验 count 和 confusability 的交互效应'
  expected_results:
    cell_means_f1:
      low_count_low_bcs: 0.324
      low_count_high_bcs: 0.313
      high_count_low_bcs: 0.325
      high_count_high_bcs: 0.277
    main_effect_count_pp: -1.8
    main_effect_bcs_pp: -2.9
    interaction_z: -0.67
    interaction_p: 0.5
    bcs_effect_at_low_count_pp: -1.1
    bcs_effect_at_high_count_pp: -4.8
  result_rationale: '交互方向符合 multiplicative 假设（高 count 下 BCS 效应 4.4× 于低 count），但  p=0.50
    远不显著。根本原因是 Few-NERD 实验设计的固有限制：(1) count 对比仅 6 vs 12， 差异过小（FewRel 的 3.4× amplification
    用的是 16 vs 80）；(2) BCS 范围窄  (0.75-0.90)，Few-NERD 66 types 中高相似度集中在 person 子类、location
    子类； (3) n=27 per cell，power analysis 估计需 n≈80 才能在此效应量下达到 0.8 power。 这不是假设被否定——是实验
    underpowered。但 median 档 reviewer 不会区分 "underpowered  null" 和 "true null"，会标注为
    "interaction claim not supported"。

    '
  tables:

  analysis: SCS validation 支撑了 "confusability signal exists" 但也暴露了 "signal is weak
    for  practical use"。这与 SDGD 的负面结果形成一致叙事：pairwise SCS 作为分析工具有效 （cross-task 显著），作为工程工具不足（R²太低）。论文应诚实呈现这个
    gap，并将  SDGD-cal (bypassing embedding entirely) 作为 pragmatic 替代方案。 Reviewer 可能追问
    AUC（SCS 预测 nonzero confusion 的分类能力），预估 AUC≈0.65-0.70， 属于 "above chance but far

narrative_guidance: 'Pairwise confusability signal 跨任务复现但效应量偏小（r=0.11-0.13），FewRel
  Δ=-31pp 是 headline 但被部分 reviewer 质疑为 RE-specific。Error taxonomy 无争议（A2 成立）。SDGD
  全线负面， "no practical method" 是 1-2 位 reviewer 的 major weakness。LLaMA Few-NERD 多次失败是  generalizability
  短板。MAVEN per-type 正方向需更强的 centrality confound 定量论证。 整体落入 Findings 或需 rebuttal 挽救。

  '
imagined_experiments:
- name: DocRED Confusability Study
  plan_id: exp-005
  description: DocRED 96 relation types count curve + BCS 控制实验，跨 NER→sentRE→docRE
    验证
  expected_results:
    count_curve:
      count_1_acc: 0.74
      count_4_acc: 0.66
      count_8_acc: 0.59
      count_16_acc: 0.48
      count_32_acc: 0.43
      count_64_acc: 0.36
      count_96_acc: 0.32
      degradation_pp: -42.0
    bcs_controlled_count16:
      low_bcs_acc: 0.56
      high_bcs_acc: 0.4
      delta_pp: -16.0
      spearman_r: -0.42
      spearman_p: 0.028
    bcs_controlled_count32:
      low_bcs_acc: 0.5
      high_bcs_acc: 0.37
      delta_pp: -13.0
      spearman_r: -0.36
      spearman_p: 0.055
    pairwise_scs_confusion:
      pearson_r: 0.09
      ci_95:
      - 0.04
      - 0.14
      n_pairs: 4560
  result_rationale: 'DocRED 是 document-level RE，baseline 比 sentence-level FewRel 低
    ~12pp（跨句推理、 多 entity-pair 干扰）。Count curve 退化 42pp，与 FewRel 80-rel 的 35pp 量级一致但
    更大——96 types + document-level complexity 双重加剧。BCS 效应 Δ=-16pp 存在但弱于  FewRel 的 -31pp：document-level
    的每篇文档含多个 entity pairs，relation 决策受  entity pair distance、跨句推理等非 confusability
    因素影响，稀释了纯 BCS 信号。 Pairwise r=0.09 刚好显著（CI 排除零但上界仅 0.14），reviewer 会质疑 document-level  增加的噪声源是否被充分控制。count_32
    p=0.055 刚好不显著，给 reviewer 留下"cherry-pick  count 条件"的把柄。Median 档位下，DocRED 提供"方向一致但不具决定性"的第四任务证据。

    '
  tables:

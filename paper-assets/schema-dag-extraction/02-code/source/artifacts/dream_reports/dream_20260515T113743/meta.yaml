        total_predictions: 4850
        unique_predictions_after_dedup: 4120
        cross_batch_span_overlap: 0.08
        predictions_per_sample_avg: 8.2
        gold_per_sample_avg: 5.9
      api_calls: 8x single-pass (8000 vs 1000 for 1000 samples)
      wall_clock_multiplier: 6.5
    result_rationale: "SDGD-zero 失败的核心机制是 \"disambiguation context loss\"。当 confusable\
      \ types 被分到不同 batch 时，每个 batch 中的模型只看到 pair 的一端。例如 person-other 在 batch A，person-politician\
      \ 在 batch B。处理含政治人物的句子时：\n- Batch A（有 person-other，无 person-politician）：模型将政治人物标为\n\
      \  person-other（因为这是最接近的可用 type）→ FP for person-other\n- Batch B（有 person-politician，无\
      \ person-other）：模型将普通人标为\n  person-politician（同理）→ FP for person-politician\n\
      \nmerge 后，同一实体可能被两个 batch 分别标为不同 type（cross-batch span overlap 8%），评估时只有一个是\
      \ TP，另一个是 FP。更严重的是，每个 batch 只有 ~8 types， 模型倾向过度提取（pred/gold=1.36 vs single-pass\
      \ 的 0.47），precision 从 0.648 暴跌到 0.318。recall 确实从 0.304 提升到 0.434（smaller batch\
      \ → 更多 attention 给每个 type），但 precision 损失远大于 recall 增益。\nF1 = 0.367 比 single-pass\
      \ 的 0.414 低 4.7pp。SDGD 的前提假设（separating confusable types reduces confusion）是错误的——对\
      \ LLM 来说，看到 confusable types 的完整集合反而帮助 disambiguation。\n"
    tables:
    - 'Table: SDGD-zero vs Single-Pass (Few-NERD, 66 types)


  - name: Count × Confusability Interaction (2×2)
    plan_id: exp-006
    description: '在 Few-NERD 上构造 {低 count=6, 高 count=22} × {低 BCS, 高 BCS} 四组， 每组 10
      batches，测试 count 和 confusability 的加法/乘法交互效应。

      '
    expected_results:
      factorial_f1:
        low_count_low_bcs: 0.372
        low_count_high_bcs: 0.268
        high_count_low_bcs: 0.312
        high_count_high_bcs: 0.178
      factorial_recall:
        low_count_low_bcs: 0.468
        low_count_high_bcs: 0.415
        high_count_low_bcs: 0.33
        high_count_high_bcs: 0.265

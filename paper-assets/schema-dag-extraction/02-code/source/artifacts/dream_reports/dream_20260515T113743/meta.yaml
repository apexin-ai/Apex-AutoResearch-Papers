      type substitution 只占总 error 的 18%，不是 dominant mode—— reviewer 会质疑 "如果 confusability
      只解释 18% 的 error，实际影响有多大？"； (b) random batch ratio 仅 1.5x，远低于 extreme 的 4.8x——说明自然分布下效应
      很小。论文只能做 descriptive analysis，不能做 formal causal claim。在 worst tier 叙事中，error

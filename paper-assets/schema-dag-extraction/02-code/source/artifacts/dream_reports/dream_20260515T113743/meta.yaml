      |-------------|-------|-----------|--------|-----------|-----------|

      | Single-pass | 0.414 | 0.648     | 0.304  | 0.47      | 1x        |

      | SDGD-zero   | 0.367 | 0.318     | 0.434  | 1.36      | 8x        |

      | Δ           | -4.7pp| -33.0pp   | +13.0pp| +0.89     | +7x       |

      '
    - 'Table: SDGD-zero Per-Batch Breakdown (top 4 batches)

      | Batch | Types | Avg BCS | F1    | Recall | Precision |

      |-------|-------|---------|-------|--------|-----------|

      | 0     | 12    | 0.812   | 0.42  | 0.48   | 0.38      |

      | 1     | 10    | 0.795   | 0.38  | 0.45   | 0.33      |

      | 2     | 9     | 0.780   | 0.35  | 0.42   | 0.30      |

      | 3     | 8     | 0.763   | 0.32  | 0.40   | 0.27      |

      '
    figures_description:
    - 'Fig: SDGD-zero vs single-pass P/R/F1 bar chart — precision 暴跌，recall 小幅提升，net
      F1 下降'
    - 'Fig: Per-batch F1 distribution (box plot) — batch 间方差大，最差 batch F1=0.28'
    - 'Fig: Cross-batch span overlap analysis — 8% 的 span 被多个 batch 提取为不同 type'
    analysis: 'SDGD-zero 的失败是 worst tier 的核心 negative result。直接否定 Claim 3。 failure
      mode 清晰且可解释：separating confusable types 剥夺了模型的 comparative disambiguation 能力。这是一个
      informative negative result——它揭示了 LLM IE 中 type co-presence 的 dual role：(1)
      增加 confusability（hypothesis 的前提）， (2) 提供 disambiguation context（SDGD 未预见的副作用）。在
      worst tier 叙事中， 这个发现可以作为论文的一个 insight："confusability is a two-edged sword —
      the same type co-presence that causes confusion also enables disambiguation"，
      解释为什么简单的 separation strategy 不 work。但这最多放在 Discussion section， 不能作为 core contribution。

      '

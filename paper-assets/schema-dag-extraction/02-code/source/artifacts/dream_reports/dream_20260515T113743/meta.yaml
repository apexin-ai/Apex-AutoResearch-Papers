          eta_sq: 0.06
          verdict: MARGINAL
        interaction:
          F: 0.31
          p: 0.582
          eta_sq: 0.006
          verdict: NOT_SIGNIFICANT
      n_batches_per_cell: 12
      total_n: 48
      simple_effects:
        bcs_at_low_count:
          delta_f1: -0.036
          p: 0.22
        bcs_at_high_count:
          delta_f1: -0.043
          p: 0.18
    result_rationale: '2×2 设计的统计功效受限：每个 cell 约 12 个 batch，总 n=48。在这个样本量下， 检测交互效应需要
      η²≥0.10 的大效应量。实际中，count 的主效应最强（η²=0.14）， 因为 count 直接影响 prompt 长度和 attention
      分配，信号最清晰。BCS 主效应仅为 marginal（p=0.094），因为 batch-level BCS 与 F1 的关系本就受到 type frequency
      distribution 等 confound 的干扰——exp-002 已经表明 batch-level 信号远弱于 pairwise-level。交互效应完全不显著（p=0.582），说明
      count 和 confusability 的 联合效应是（弱）加性的，不存在 multiplicative synergy。这在 worst tier
      中意味 着论文只能声称 "两个通道可能独立" 但无法用 formal interaction test 支撑。

      '
    tables:
    - 'Table: 2×2 Cell Means (F1, text_match)

      |                | Low BCS     | High BCS    | BCS Effect |

      |----------------|-------------|-------------|------------|

      | Low Count (6)  | 0.348       | 0.312       | Δ=-0.036   |

      | High Count (22)| 0.298       | 0.255       | Δ=-0.043   |

      | Count Effect   | Δ=-0.050   | Δ=-0.057   |            |

      '
    - 'Table: Two-Way ANOVA Results

      | Source       | F     | p     | η²    | Verdict     |

      |-------------|-------|-------|-------|-------------|

      | Count        | 7.82  | 0.008 | 0.14  | Significant |

      | BCS          | 2.93  | 0.094 | 0.06  | Marginal    |

      | Count × BCS  | 0.31  | 0.582 | 0.006 | NS          |

      '
    figures_description:
    - 'Fig: 2×2 interaction plot (F1 vs count, separate lines for low/high BCS) —
      近似平行线，无交互'
    - 'Fig: Cell means bar chart with error bars — BCS 差异在两个 count level 上方向一致但均不显著'
    analysis: '交互效应不显著是 worst tier 对 Claim 2（multi-channel degradation）的重大打击。 论文无法用
      formal factorial design 证明两通道正交。只能退而求其次，基于 error taxonomy（exp-007）做 descriptive
      argument：count 降低 recall（omission）， confusability 增加 type confusion（substitution），两类错误机制不同→暗示正交。
      但这种 descriptive 论证说服力远不如 significant interaction test。在 worst tier 叙事中，2×2 结果最多写一段文字报告
      "no significant interaction was detected, consistent with additive but not multiplicative
      independence"。

      '

    result_rationale: 'Error taxonomy 的分类本身是 noisy 的——boundary error vs type substitution
      的 区分依赖 text_match 容差设定。在 worst tier 下：(1) type substitution 在 extreme high-BCS
      batch 中确实更多（4.8x ratio），但 extreme batches 是刻意构造的极端 条件，random batches 中 ratio
      仅 1.5x，实际场景中效应有限；(2) boundary error 不受 BCS 影响（ratio≈1.0），符合预期——boundary detection
      是 span 层面的任务， 与 type confusability 无关；(3) missed entity（false negative）主要由 count
      驱动（count_6 miss 28% vs count_64 miss 55%），不受 BCS 影响——支持 count→recall 通道；(4)
      但整体 error 中 spurious extraction 占 45%，远超 type substitution 的 18%——这意味着 LLM 的主要问题是

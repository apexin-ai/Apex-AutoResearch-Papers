        low_count_high_bcs: 0.045
        high_count_low_bcs: 0.018
        high_count_high_bcs: 0.072
      two_way_anova:
        count_main_effect_F: 14.2
        count_main_effect_p: 0.0006
        bcs_main_effect_F: 22.8
        bcs_main_effect_p: 3.1e-05
        interaction_F: 3.1
        interaction_p: 0.087
        interaction_verdict: 边际显著，轻微超加性
      effect_decomposition:
        count_delta_f1: -0.075
        bcs_delta_f1: -0.119
        interaction_delta_f1: -0.027
        additive_prediction_high_high: 0.197
        actual_high_high: 0.178
        super_additive_gap: -0.019
    result_rationale: 'Count 和 confusability 通过不同机制降低性能：count 稀释 attention → recall
      下降， confusability 引起类型混淆 → precision 下降。两者理论上正交，但在 high-count high-BCS 条件下 存在轻微超加性——当
      attention 已被稀释时，模型对类型区分的余量更小，confusability 的边际伤害更大。 交互效应统计上边际显著（p=0.087），不足以拒绝加法模型，这恰好支持论文的"正交通道"叙事：
      两个通道基本独立，各自可寻址。超加性的微弱存在（1.9pp gap）在讨论中作为 nuance 提及。

      '

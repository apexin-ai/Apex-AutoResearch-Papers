    definition wording、in-context position 等因素影响——这些因素 与 embedding space 正交；(2) SCS
    是对称的（sim(A,B)=sim(B,A)），但实际 confusion 是非对称的（person-other → person-politician 的概率可能远高于反向）；(3)
    42% 的 false positive rate 意味着 SCS 预测为 confusable 的 type pair 中近一半实际 不被 confuse——这些
    false alarm 导致 SDGD-zero 过度分离 types，graph 变密， batch 数量过多。

    MiniLM SCS 更差（ρ=0.098, p=0.082），因为 MiniLM 是 general-purpose sentence embedding，不
    align 到 Qwen3 的 internal representation。这解释了为什么 extraction model alignment 对 per-type
    signal 很重要（exp-002 中 Qwen3 per-type ρ=-0.293 vs MiniLM ρ≈0）。

    '
  tables:
  - 'Table: SCS vs Empirical Confusion Correlation

    | Embedding | Spearman ρ | p     | Kendall τ | p     |

    |-----------|-----------|-------|-----------|-------|

    | Qwen3     | 0.125     | 0.031 | 0.092     | 0.044 |

    | MiniLM    | 0.098     | 0.082 | 0.071     | 0.115 |

    '
  - 'Table: SCS Proxy Error Analysis

    | Metric              | Qwen3 | MiniLM |

    |---------------------|-------|--------|

    | False Positive Rate | 0.42  | 0.48   |

    | False Negative Rate | 0.35  | 0.40   |

    | Top-1 Match         | Yes   | No     |

    '
  figures_description:
  - 'Fig: SCS vs empirical confusion scatter (Qwen3) — 弱正相关，大量 off-diagonal noise'
  - 'Fig: Confusion asymmetry heatmap — 展示 confusion matrix 的非对称性，SCS 无法捕捉'
  analysis: 'SCS validation 结果解释了 SDGD 失败的一个次要原因（proxy 质量差），但不是主因 （主因是 decomposition
    本身有害）。ρ=0.125 说明 embedding SCS 只能解释 ~1.6% 的 confusion variance——作为 graph 构建的基础远远不够。即使用
    empirical confusion (exp-010 SDGD-cal) 也只比 random 好 0.7pp（不显著），所以 proxy 质量不是瓶颈。
    在 worst tier 叙事中，SCS validation 作为 methodological finding 报告： "embedding-based
    confusability proxies have limited predictive power for actual model confusion
    patterns, suggesting that confusability is mediated by factors beyond semantic
    similarity"——这对未来工作有指导价值。

    '

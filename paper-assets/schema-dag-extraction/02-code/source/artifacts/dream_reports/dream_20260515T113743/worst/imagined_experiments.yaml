  analysis: 'SDGD-zero 的失败是 worst tier 的核心 negative result。直接否定 Claim 3。 failure mode
    清晰且可解释：separating confusable types 剥夺了模型的 comparative disambiguation 能力。这是一个 informative
    negative result——它揭示了 LLM IE 中 type co-presence 的 dual role：(1) 增加 confusability（hypothesis
    的前提）， (2) 提供 disambiguation context（SDGD 未预见的副作用）。在 worst tier 叙事中， 这个发现可以作为论文的一个

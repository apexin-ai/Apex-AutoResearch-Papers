    | Random confusion ratio    | 1.7-2.4x    | 1.15-1.2x     | 0.50x    |

    '
  - 'Table: LLaMA Pairwise & Per-Type Statistics

    | Analysis        | Statistic | Value  | p     | Verdict |

    |-----------------|-----------|--------|-------|---------|

    | Pairwise        | Pearson r | 0.042  | 0.068 | NS      |

    | Pairwise NZ     | Spearman  | 0.078  | 0.120 | NS      |

    | Per-type        | Spearman  | -0.082 | 0.538 | NS      |

    | Per-type partial| Partial r | -0.055 | 0.684 | NS      |

    '

  analysis: Worst tier 论文的核心卖点不是 positive findings 而是 systematic methodology 和 honest
    reporting。三个 takeaway：(1) confusability 信号存在但 model/embedding-dependent——未来工作不能假设
    universal confusability measure； (2) per-type 聚合有 centrality confound——未来工作应使用
    pairwise 分析； (3) confusability-minimizing decomposition 失败——LLM 需要 type co-presence
    做 comparative reasoning，简单分离策略适得其反。这些 negative-but-informative results 加上 controlled
    experimental design 可以支撑一篇 Findings paper。

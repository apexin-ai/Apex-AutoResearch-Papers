tier: worst
narrative_guidance: '完全放弃 SDGD 方法贡献。论文 reframe 为纯系统性实证分析：首次控制实验揭示 schema complexity
  不是一维问题——count 和 confusability 通过正交通道降低性能， 但 confusability 信号高度依赖模型和 embedding 选择。pairwise
  confusability 是 比 per-type 聚合更鲁棒的度量，但仅在特定 model×embedding×schema 组合下显著。 centrality
  confound 发现本身是方法论贡献。模型特异性（Qwen3 vs LLaMA）reframe 为 "confusability effects are model-dependent"——将弱点转为解释力。论文结构改为
  "question→controlled experiments→findings→implications"。EMNLP Findings 是现实 预期，Main
  可冲但 acceptance variance 大。SDGD 降为 appendix 中的 negative result case study，正文不再作为核心贡献。

  '
imagined_experiments:
- name: MAVEN Full Confusability Study
  plan_id: exp-004
  description: 'MAVEN Event Detection（168 event types, FrameNet hierarchy）的完整 confusability
    研究：500-sample 重跑 count curve + within-count BCS 相关 + pairwise/per-type 双 embedding
    分析 + confusion rate 分析。核心跨任务（NER→ED）验证。

    '
  expected_results:
    count_curve_relaxed_f1:
      count_1: 0.098
      count_6: 0.112
      count_12: 0.155
      count_22: 0.192
      count_44: 0.238
      count_64: 0.241
      count_100: 0.243
    count_curve_exact_f1:
      count_1: 0.008
      count_6: 0.005
      count_12: 0.011
      count_22: 0.016
      count_44: 0.021
      count_64: 0.018
    count_curve_recall_trend: monotonically increasing 0.07→0.19 (opposite of Few-NERD)
    count_curve_precision_trend: roughly flat 0.15-0.40, noisy
    within_count_bcs_f1:
      count_6:
        r: 0.175
        p: 0.185
        n: 27
        direction: positive
        verdict: FAIL
      count_12:
        r: 0.124
        p: 0.315
        n: 27
        direction: positive
        verdict: FAIL
      partial_pooled:
        r: 0.142
        p: 0.108
        n: 54
        direction: positive
        verdict: FAIL
    pairwise_qwen3:
      pearson_r: -0.009
      pearson_p: 0.38
      n_pairs: 14028
      verdict: FAIL
    pairwise_minilm:
      pearson_r: 0.115
      pearson_p: 2.1e-42
      n_pairs: 14028
      spearman_rho: 0.128
      nonzero_spearman_rho: 0.185
      verdict: PASS
    per_type_qwen3:
      spearman_rho: 0.195
      p: 0.018
      direction: positive_confounded
    per_type_minilm:
      spearman_rho: 0.212
      p: 0.009
      direction: positive_confounded
    confusion_rate_extreme:
      count_6_ratio: 5.8
      count_12_ratio: 4.2
    confusion_rate_random:
      count_6_ratio: 1.4
      count_12_ratio: 1.3
  result_rationale: 'MAVEN 的 168 event types 全部来自 FrameNet，同一语义域，导致 type embedding
    分布高度同质。这造成三个后果：(1) count curve 反转——更多 types 为模型提供更 丰富的 event ontology 上下文，帮助模型理解每个
    type 在 taxonomy 中的位置，因此 F1 随 count 增加而上升；(2) within-count BCS 相关为正方向——高 BCS batch
    包含 语义中心的常见 event types（如 Killing, Attack, Movement），这些 types 在 training data 中频次高、定义清晰，LLM
    本就擅长提取，因此高 BCS → 高 F1， 这是 centrality confound 而非 confusability 效应；(3) confusion
    rate 比 Few-NERD 低得多（5.8x vs 27.5x），因为 event trigger 本身是 verb/nominalization 而非
    entity mention，type confusion 的表现形式不同（trigger 共享率高但不一定是 confusability 导致）。pairwise
    MiniLM 仍显著（r=0.115, p≈0），因为 n=14028 pair 提供了极大统计功效，即使效应量小也能检出——但这个 r 值比 Few-NERD
    的 0.156 低， 且 Qwen3 pairwise 完全不显著，说明 pairwise 信号在同质 schema 上高度依赖 embedding 选择。

    '
  tables:
  - 'Table: MAVEN Count Curve (500 samples, relaxed matching)

    | Count | Relaxed F1 | Exact F1 | Recall | Precision | Pred/Gold |

    |-------|-----------|----------|--------|-----------|-----------|

    | 1     | 0.098     | 0.008    | 0.070  | 0.162     | 0.43      |

    | 6     | 0.112     | 0.005    | 0.085  | 0.165     | 0.52      |

    | 12    | 0.155     | 0.011    | 0.118  | 0.226     | 0.52      |

    | 22    | 0.192     | 0.016    | 0.148  | 0.274     | 0.54      |

    | 44    | 0.238     | 0.021    | 0.180  | 0.350     | 0.51      |

    | 64    | 0.241     | 0.018    | 0.182  | 0.358     | 0.51      |

    '
  - 'Table: MAVEN Within-Count BCS-F1 Correlation

    | Count | r     | p     | Direction | Verdict |

    |-------|-------|-------|-----------|---------|

    | 6     | +0.175| 0.185 | positive  | FAIL    |

    | 12    | +0.124| 0.315 | positive  | FAIL    |

    | Pooled| +0.142| 0.108 | positive  | FAIL    |

    '
  - 'Table: MAVEN Pairwise & Per-Type (2×2 embedding matrix)

    |          | Pairwise r (p)         | Per-type ρ (p)       |

    |----------|------------------------|----------------------|

    | Qwen3    | -0.009 (0.38) ✗        | +0.195 (0.018) ✗     |

    | MiniLM   | +0.115 (2.1e-42) ✓     | +0.212 (0.009) ✗     |

    '
  figures_description:
  - 'Fig: MAVEN count curve (relaxed F1 vs type count) — 上升趋势，与 Few-NERD 相反'
  - 'Fig: MAVEN pairwise scatter (MiniLM SCS vs confusion count) — 弱正相关 r=0.115，点云密集在低相似度区域'
  - 'Fig: MAVEN per-type scatter (mean BCS vs F1) — 正方向，标注 centrality confound interpretation'
  analysis: 'MAVEN 结果确认 centrality confound 假说：在语义同质 schema 中，per-type 和 within-count
    batch-level 分析均被 confound。唯一存活的信号是 MiniLM pairwise (r=0.115)，但 Qwen3 pairwise
    失败，且效应量小（r²=1.3%）。MAVEN 的 count curve 反转是对 SDGD 方法的致命打击——如果更多 types 在 prompt 中反而帮助模型，那么
    decomposition（减少 types）必然降低性能。worst tier 叙事中，MAVEN 作为 "centrality confound case
    study" 仍有方法论价值，但不支持 SDGD 的前提假设。

    '
- name: DocRED Confusability Study
  plan_id: exp-005
  description: 'DocRED（96 relation types）上的 confusability 研究：count curve + BCS 相关分析。
    文档级 RE 的 scaling stress test。

    '
  expected_results:
    count_curve_f1:
      count_4: 0.185
      count_8: 0.192
      count_16: 0.198
      count_32: 0.203
      count_48: 0.208
      count_96: 0.195
    count_curve_trend: near-flat with slight peak at count_48, no clear monotonic
      pattern
    within_count_bcs_f1:
      count_8:
        r: 0.032
        p: 0.62
        verdict: FAIL
      count_16:
        r: -0.058
        p: 0.48
        verdict: FAIL
      partial_pooled:
        r: -0.015
        p: 0.84
        verdict: FAIL
    pairwise_qwen3:
      pearson_r: 0.023
      pearson_p: 0.14
      n_pairs: 4560
      verdict: FAIL
    pairwise_minilm:
      pearson_r: 0.031
      pearson_p: 0.08
      n_pairs: 4560
      verdict: FAIL
    per_type_bcs_f1:
      spearman_rho: -0.04
      p: 0.72
      verdict: FAIL
    confusion_rate_extreme_ratio: 1.8
    overall_baseline_f1: 0.195
  result_rationale: 'DocRED 是文档级 RE，每个样本包含多个句子和多个 entity pairs。性能瓶颈完全不在 type confusability
    上，而在于：(1) 跨句推理能力——关系证据分散在多个句子中，LLM 需要 coreference 和 multi-hop reasoning；(2) entity
    pair 组合爆炸——文档中 n 个实体产生 O(n²) 个候选关系对，模型必须处理大量负样本；(3) 关系类型定义本身 依赖 entity type 约束（如
    "place_of_birth" 要求 subject=person, object=location）， 这种结构化约束比 embedding 相似度更能预测性能。confusability
    信号被这些更强的 因素完全淹没。count curve 近乎平坦，因为文档级 RE 的 prompt 长度主要由文档内容 （而非 type 定义）决定——96
    个 relation type name 只占 prompt 的很小比例。

    '
  tables:
  - 'Table: DocRED Count Curve (document-level RE)

    | Count | F1    | Recall | Precision | Confusion Rate |

    |-------|-------|--------|-----------|---------------|

    | 4     | 0.185 | 0.145  | 0.256     | 0.008         |

    | 8     | 0.192 | 0.152  | 0.261     | 0.012         |

    | 16    | 0.198 | 0.158  | 0.264     | 0.015         |

    | 32    | 0.203 | 0.165  | 0.258     | 0.018         |

    | 48    | 0.208 | 0.170  | 0.261     | 0.019         |

    | 96    | 0.195 | 0.160  | 0.250     | 0.022         |

    '
  figures_description:
  - 'Fig: DocRED count curve — near-flat, 与 Few-NERD/MAVEN 的明显趋势形成对比'
  - 'Fig: DocRED within-count BCS scatter — 无相关，点云随机分布'
  analysis: 'DocRED 结果是完全的 null result。confusability 假说在文档级 RE 上完全不成立。 worst tier
    叙事中，DocRED 证明 confusability 效应受限于 sentence-level 任务—— 文档级任务中其他复杂度维度（跨句推理、entity
    pair 组合）占主导。如果论文要报告 此结果，需要 reframe 为 "boundary condition"：confusability 效应在 type
    definitions 占 prompt 显著比例的任务中才成立。但此实验为 P1，worst tier 下可能 不运行（10 天内优先 P0 实验），视为
    supplementary material。

    '
- name: Count × Confusability Interaction Effect
  plan_id: exp-006
  description: 'Few-NERD 上 {low count=6, high count=22} × {low BCS, high BCS} 的 2×2
    因子设计。 检验 count 和 confusability 的交互效应（additive vs multiplicative）。

    '
  expected_results:
    cell_means_f1:
      low_count_low_bcs: 0.348
      low_count_high_bcs: 0.312
      high_count_low_bcs: 0.298
      high_count_high_bcs: 0.255
    two_way_anova:
      count_main_effect:
        F: 7.82
        p: 0.008
        eta_sq: 0.14
        verdict: SIGNIFICANT
      bcs_main_effect:
        F: 2.93
        p: 0.094
        eta_sq: 0.06
        verdict: MARGINAL
      interaction:
        F: 0.31
        p: 0.582
        eta_sq: 0.006
        verdict: NOT_SIGNIFICANT
    n_batches_per_cell: 12
    total_n: 48
    simple_effects:
      bcs_at_low_count:
        delta_f1: -0.036
        p: 0.22
      bcs_at_high_count:
        delta_f1: -0.043
        p: 0.18
  result_rationale: '2×2 设计的统计功效受限：每个 cell 约 12 个 batch，总 n=48。在这个样本量下， 检测交互效应需要 η²≥0.10
    的大效应量。实际中，count 的主效应最强（η²=0.14）， 因为 count 直接影响 prompt 长度和 attention 分配，信号最清晰。BCS
    主效应仅为 marginal（p=0.094），因为 batch-level BCS 与 F1 的关系本就受到 type frequency distribution
    等 confound 的干扰——exp-002 已经表明 batch-level 信号远弱于 pairwise-level。交互效应完全不显著（p=0.582），说明
    count 和 confusability 的 联合效应是（弱）加性的，不存在 multiplicative synergy。这在 worst tier 中意味
    着论文只能声称 "两个通道可能独立" 但无法用 formal interaction test 支撑。

    '
  tables:
  - 'Table: 2×2 Cell Means (F1, text_match)

    |                | Low BCS     | High BCS    | BCS Effect |

    |----------------|-------------|-------------|------------|

    | Low Count (6)  | 0.348       | 0.312       | Δ=-0.036   |

    | High Count (22)| 0.298       | 0.255       | Δ=-0.043   |

    | Count Effect   | Δ=-0.050   | Δ=-0.057   |            |

    '
  - 'Table: Two-Way ANOVA Results

    | Source       | F     | p     | η²    | Verdict     |

    |-------------|-------|-------|-------|-------------|

    | Count        | 7.82  | 0.008 | 0.14  | Significant |

    | BCS          | 2.93  | 0.094 | 0.06  | Marginal    |

    | Count × BCS  | 0.31  | 0.582 | 0.006 | NS          |

    '
  figures_description:
  - 'Fig: 2×2 interaction plot (F1 vs count, separate lines for low/high BCS) — 近似平行线，无交互'
  - 'Fig: Cell means bar chart with error bars — BCS 差异在两个 count level 上方向一致但均不显著'
  analysis: '交互效应不显著是 worst tier 对 Claim 2（multi-channel degradation）的重大打击。 论文无法用
    formal factorial design 证明两通道正交。只能退而求其次，基于 error taxonomy（exp-007）做 descriptive
    argument：count 降低 recall（omission）， confusability 增加 type confusion（substitution），两类错误机制不同→暗示正交。
    但这种 descriptive 论证说服力远不如 significant interaction test。在 worst tier 叙事中，2×2 结果最多写一段文字报告
    "no significant interaction was detected, consistent with additive but not multiplicative
    independence"。

    '
- name: Systematic Error Taxonomy by BCS Bins
  plan_id: exp-007
  description: '对 Few-NERD exp-002 数据做系统 FP 分类（type_substitution / boundary_error
    / false_negative / hallucination），按 BCS bin 分析差异。机械层面支撑 multi-channel 模型。

    '
  expected_results:
    error_distribution_overall:
      type_substitution_pct: 0.18
      boundary_error_pct: 0.12
      spurious_extraction_pct: 0.45
      missed_entity_pct: 0.25
    type_substitution_by_bcs:
      extreme_high_bcs_rate: 0.058
      extreme_low_bcs_rate: 0.012
      extreme_ratio: 4.8
      random_high_bcs_rate: 0.022
      random_low_bcs_rate: 0.015
      random_ratio: 1.5
    boundary_error_by_bcs:
      high_bcs_rate: 0.041
      low_bcs_rate: 0.038
      ratio: 1.08
      verdict: NO_EFFECT
    missed_entity_by_count:
      count_6_miss_rate: 0.28
      count_22_miss_rate: 0.42
      count_64_miss_rate: 0.55
      trend: monotonically increasing with count
    missed_entity_by_bcs:
      high_bcs_miss_rate: 0.4
      low_bcs_miss_rate: 0.38
      ratio: 1.05
      verdict: NO_EFFECT
    hallucination_rate: 0.03
    hallucination_by_bcs:
      verdict: NO_EFFECT
  result_rationale: 'Error taxonomy 的分类本身是 noisy 的——boundary error vs type substitution
    的 区分依赖 text_match 容差设定。在 worst tier 下：(1) type substitution 在 extreme high-BCS
    batch 中确实更多（4.8x ratio），但 extreme batches 是刻意构造的极端 条件，random batches 中 ratio 仅
    1.5x，实际场景中效应有限；(2) boundary error 不受 BCS 影响（ratio≈1.0），符合预期——boundary detection
    是 span 层面的任务， 与 type confusability 无关；(3) missed entity（false negative）主要由 count
    驱动（count_6 miss 28% vs count_64 miss 55%），不受 BCS 影响——支持 count→recall 通道；(4) 但整体
    error 中 spurious extraction 占 45%，远超 type substitution 的 18%——这意味着 LLM 的主要问题是
    "提取不该提取的 span" 而非 "type 标错"， confusability 只解释了一小部分 error。worst tier 的核心问题是：type
    confusion 不是 dominant error mode，因此 confusability 的实际影响被其他 error 源稀释。

    '
  tables:
  - 'Table: Error Distribution Overall

    | Error Type          | Proportion | Primary Driver |

    |---------------------|------------|----------------|

    | Spurious Extraction | 45%        | Prompt format  |

    | Missed Entity       | 25%        | Count (recall) |

    | Type Substitution   | 18%        | BCS (confuse)  |

    | Boundary Error      | 12%        | Span detection |

    '
  - 'Table: Type Substitution Rate by BCS Condition

    | Condition     | High BCS | Low BCS | Ratio |

    |---------------|----------|---------|-------|

    | Extreme Batch | 0.058    | 0.012   | 4.8x  |

    | Random Batch  | 0.022    | 0.015   | 1.5x  |

    '
  - 'Table: Missed Entity Rate by Count

    | Count | Miss Rate | Δ vs Count_6 |

    |-------|-----------|--------------|

    | 6     | 0.28      | —            |

    | 22    | 0.42      | +0.14        |

    | 64    | 0.55      | +0.27        |

    '
  figures_description:
  - 'Fig: Stacked bar chart of error types by BCS bin — type_substitution 在 high-BCS
    中突出，但 spurious extraction 始终占主导'
  - 'Fig: Missed entity rate vs count — 清晰单调上升，支持 count→recall 通道'
  analysis: 'Error taxonomy 部分支持 multi-channel 模型：(1) type substitution 受 BCS 影响 （extreme
    4.8x），(2) missed entity 受 count 影响（monotonic）。但 worst tier 下两个弱点：(a) type substitution
    只占总 error 的 18%，不是 dominant mode—— reviewer 会质疑 "如果 confusability 只解释 18% 的 error，实际影响有多大？"；
    (b) random batch ratio 仅 1.5x，远低于 extreme 的 4.8x——说明自然分布下效应 很小。论文只能做 descriptive
    analysis，不能做 formal causal claim。在 worst tier 叙事中，error taxonomy 作为 supporting
    evidence 放在 analysis section， 不作为独立 finding。

    '
- name: LLaMA-3.3-70B Multi-Model Validation
  plan_id: exp-012
  description: '用 LLaMA-3.3-70B-Instruct 复制 exp-002 protocol（Few-NERD, 25 random +
    extreme batches, count=6/12, pairwise + per-type 分析）。检验 confusability 效应的跨模型 泛化性。

    '
  expected_results:
    baseline_f1_count64: 0.378
    baseline_vs_qwen3: Δ=-3.6pp (Qwen3=0.414)
    pairwise_qwen3_embed:
      pearson_r: 0.042
      pearson_p: 0.068
      n_pairs: 1953
      verdict: NOT_SIGNIFICANT
    pairwise_qwen3_embed_nonzero:
      spearman_rho: 0.078
      p: 0.12
      verdict: NOT_SIGNIFICANT
    per_type_bcs_f1:
      spearman_rho: -0.082
      p: 0.538
      n_types: 58
      partial_r_ctrl_logfreq: -0.055
      partial_p: 0.684
      verdict: NOT_SIGNIFICANT
    batch_f1_vs_bcs:
      count_6:
        r: 0.108
        p: 0.42
      count_12:
        r: 0.185
        p: 0.21
      partial_pooled:
        r: 0.138
        p: 0.16
    confusion_rate_extreme:
      count_6_high: 0.025
      count_6_low: 0.01
      ratio_6: 2.5
      count_12_high: 0.032
      count_12_low: 0.015
      ratio_12: 2.1
    confusion_rate_random:
      count_6_ratio: 1.2
      count_12_ratio: 1.15
    cross_model_summary:
      qwen3_pairwise_r: 0.156
      llama_pairwise_r: 0.042
      qwen3_extreme_ratio: 10-28x
      llama_extreme_ratio: 2.1-2.5x
      qwen3_per_type_rho: -0.293
      llama_per_type_rho: -0.082
  result_rationale: 'LLaMA-3.3-70B 与 Qwen3-32B 在 confusability 敏感度上存在根本差异，原因可能是： (1)
    模型规模差异——70B vs 32B，更大的模型有更大的 attention capacity，能更好地 处理 confusable types 的共现，因此
    confusability 的 degradation 效应被缓解； (2) instruction tuning 差异——LLaMA-3.3 的 RLHF
    训练可能更强调 precision 和 faithfulness，模型在不确定时倾向不输出（而非猜测相似 type），导致 type confusion error
    本就少，confusability 信号弱；(3) internal representation 差异——LLaMA 的 embedding 空间对 Few-NERD
    types 的组织方式可能与 Qwen3 不同，Qwen3 embedding 中的 semantic proximity 模式不能直接迁移为 LLaMA
    的 confusion 模式。

    pairwise r=0.042 (p=0.068) 在 α=0.05 下不显著但接近边界——这是最棘手的 结果：不能说完全无信号（p=0.068），但也不能声称显著。在
    worst tier 叙事中， 这被 reframe 为 "confusability effects are model-dependent, with
    effect size varying by 4x across model families (r=0.156 Qwen3 vs r=0.042 LLaMA)"。confusion
    rate ratio 也大幅下降（2.5x vs Qwen3 的 27.5x），进一步说明 LLaMA 对 type confusion 更鲁棒。

    '
  tables:

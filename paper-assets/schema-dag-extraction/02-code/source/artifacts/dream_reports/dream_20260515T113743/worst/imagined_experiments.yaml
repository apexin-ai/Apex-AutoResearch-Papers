  result_rationale: "SDGD-zero 失败的核心机制是 \"disambiguation context loss\"。当 confusable\
    \ types 被分到不同 batch 时，每个 batch 中的模型只看到 pair 的一端。例如 person-other 在 batch A，person-politician\
    \ 在 batch B。处理含政治人物的句子时：\n- Batch A（有 person-other，无 person-politician）：模型将政治人物标为\n\
    \  person-other（因为这是最接近的可用 type）→ FP for person-other\n- Batch B（有 person-politician，无\
    \ person-other）：模型将普通人标为\n  person-politician（同理）→ FP for person-politician\n\n\
    merge 后，同一实体可能被两个 batch 分别标为不同 type（cross-batch span overlap 8%），评估时只有一个是 TP，另一个是\

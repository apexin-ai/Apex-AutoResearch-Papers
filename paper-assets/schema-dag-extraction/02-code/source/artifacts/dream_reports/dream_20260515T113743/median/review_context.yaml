narrative_guidance: '论文重心 80:20（分析:方法）。三层贡献：(1) pairwise confusability 跨 NER/RE/ED
  三任务、Qwen3+LLaMA 双模型成立， (2) multi-channel degradation model（count→omission, confusability→substitution）+
  错误分类学， (3) centrality confound 方法论发现 + 2×3 embedding ablation practitioner guidance。
  SDGD-zero 保留为 proof-of-concept 但 ΔF1 不显著（[-2,+2]pp），Claim 3 改写为 "SDGD 框架示范 pairwise
  confusability 可直接指导 schema decomposition，SDGD-cal 预期有更大空间"。 EMNLP Main 可冲（对标 Lost
  in the Middle），Findings 作后备。

  '
imagined_experiments:

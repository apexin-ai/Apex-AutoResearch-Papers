    std=0.103），大部分 pair 相似度在 0.1-0.35 范围， 用阈值 0.35 切分后 confusability graph 边数较少，graph
    coloring 产生的 batches 与 random batching 差异不大； (2) 即使成功分离了高 SCS pairs（119 pairs
    > 0.5），这些 pairs 分布在 168 个 types 中仅占 0.85%，对整体 F1 影响微小； (3) Exact F1 极低（<0.02）使得任何方法差异都淹没在
    boundary matching 噪声中， relaxed F1 是唯一可比指标； (4) SDGD-zero 微弱优于 random batching（+0.5pp），但不优于
    single-pass（-0.5pp）， 因为 MAVEN 的 context 更重要——event detection 依赖同一句中多种事件类型的对比。

    '
  tables:
  - name: 'Table: SDGD-zero vs Baselines on MAVEN (168 types)'
    content: '| Method          | Relaxed F1 | Exact F1 | API Calls |

      |-----------------|-----------|----------|-----------|

      | Single-pass     | 0.245     | 0.013    | 1         |

      | Random (k=14)   | 0.235     | 0.012    | 14        |

      | SDGD-zero       | 0.240     | 0.015    | 14        |

      '
  figures_description:
  - 'MAVEN confusability graph visualization: near-complete subgraph structure, illustrating
    why graph coloring fails to find clean separations.'
  analysis: 'MAVEN 上 SDGD-zero ≈ single-pass 进一步支持 median 档叙事： SDGD 是正确的框架但 -zero
    变体在高密度 schema 上能力有限。 这也解释了为什么 embedding-based proxy 不够——需要 empirical confusion
    data (SDGD-cal) 才能在同域 schema 上有效操作。

    '
- name: SDGD-cal on Few-NERD
  plan_id: exp-010
  description: '用 5-10 calibration examples 的 empirical confusion matrix 替代 embedding
    SCS 构建 confusability graph。 检验 calibration 数据能否弥补 embedding proxy 的不足。

    '
  expected_results:
    calibration_config:
      n_calibration_examples: 8
      calibration_api_calls: 528
      total_api_calls: 536
    sdgd_cal_f1: 0.44
    sdgd_zero_f1: 0.425
    singlepass_f1: 0.414
    delta_cal_vs_zero_pp: 1.5
    delta_cal_vs_singlepass_pp: 2.6
    delta_cal_vs_singlepass_ci_95:
    - -0.8
    - 6.0
    p_value_vs_singlepass: 0.09
    significant_vs_singlepass: false
    type_confusion_reduction_vs_singlepass_pct: 35
    calibration_confusion_vs_scs_spearman: 0.32
  result_rationale: 'SDGD-cal 相比 SDGD-zero 提升 ~1.5pp，原因是 empirical confusion 直接捕获
    模型特异的混淆模式（如 Qwen3 特别容易混淆 building-library ↔ building-hotel 但 embedding 距离中等的 pair），绕过了
    embedding proxy 的噪声。 但 +2.6pp vs single-pass 仍不显著（p≈0.09），因为： (1) 8 个 calibration
    examples 的 confusion matrix 高方差——很多 type pairs 在 8 个样本中从未共现，confusion 为 0 但真实
    confusability 非零； (2) 从 calibration 到 test set 的 confusion 分布偏移——calibration examples
    的 type 分布未必代表 test set； (3) context loss 问题仍在——SDGD-cal 只改善了 confusability graph
    的质量， 不改变 decomposition 本身的 context-loss tradeoff。 这个结果在 median 档下留出"SDGD-cal 有空间"的
    narrative—— 更多 calibration data 或更好的 calibration protocol 预期可以继续提升。

    '
  tables:
  - name: 'Table: SDGD Variant Comparison on Few-NERD'
    content: '| Method      | F1    | ΔF1 vs SP | Type Confusion ↓ | API Calls |

      |-------------|-------|-----------|------------------|-----------|

      | Single-pass | 0.414 | —         | —                | 1         |

      | SDGD-zero   | 0.425 | +1.1      | -24%             | 8         |

      | SDGD-cal    | 0.440 | +2.6      | -35%             | 536       |

      '
  figures_description:
  - 'Line chart: F1 improvement trajectory from single-pass → SDGD-zero → SDGD-cal,
    with error bars. Upward trend but CIs overlap.'
  - 'Confusion matrix diff: empirical (calibration) vs embedding-predicted, highlighting
    discrepancies.'
  analysis: 'SDGD-cal 展示 confusability-aware decomposition 的 ceiling 更高， 但 8-example
    calibration 尚不足以稳定地达到。论文可报告为"SDGD-cal 提供方向， 充分 calibration 数据下预期更大收益，但当前 training-free
    设定下的 calibration 成本 与收益比尚需优化"。作为 SDGD-cal 的存在证明而非 headline 结果。

    '
- name: SDGD-cal on MAVEN
  plan_id: exp-011
  description: 'SDGD-cal 在 MAVEN 168 event types 上运行。 测试 empirical confusion 能否克服
    MAVEN 上 embedding proxy 失效的问题。

    '
  expected_results:
    sdgd_cal_relaxed_f1: 0.258
    sdgd_zero_relaxed_f1: 0.24
    singlepass_relaxed_f1: 0.245
    delta_cal_vs_singlepass_pp: 1.3
    delta_cal_vs_zero_pp: 1.8
    significant: false
    calibration_api_calls: 1344
    total_api_calls: 1358
  result_rationale: 'MAVEN 上 SDGD-cal 比 SDGD-zero 收益更大（+1.8pp vs +0.5pp on Few-NERD），
    因为 MAVEN 正是 embedding proxy 失效的数据集（Qwen3 pairwise r=-0.007）。 Empirical confusion
    绕过了 embedding 的限制，直接用模型行为构建 graph。 但绝对增益仍有限（+1.3pp vs single-pass），因为： (1) 168
    types 的 calibration matrix 极其稀疏——168×167/2=14028 pairs 中， 8 个 calibration samples
    能覆盖的 pair 比例很低； (2) MAVEN 的 exact F1 极低，relaxed F1 的 variance 大，信噪比低； (3) 1344
    API calls 的 calibration 成本在实用性上存疑。 这支持了"SDGD-cal 在 embedding 失效场景下价值更大"的论点， 也说明了"calibration
    效率是未来工作方向"。

    '
  tables:
  - name: 'Table: SDGD-cal vs Baselines on MAVEN'
    content: '| Method      | Relaxed F1 | Δ vs SP  | API Calls |

      |-------------|-----------|----------|-----------|

      | Single-pass | 0.245     | —        | 1         |

      | SDGD-zero   | 0.240     | -0.5     | 14        |

      | SDGD-cal    | 0.258     | +1.3     | 1358      |

      '
  figures_description:
  - 'Grouped bar chart: SDGD-zero vs SDGD-cal improvement over single-pass, Few-NERD
    vs MAVEN. MAVEN shows larger cal-zero gap.'
  analysis: 'MAVEN 上 SDGD-cal > SDGD-zero 的差距（1.8pp）大于 Few-NERD（1.5pp）， 验证了"当 embedding
    proxy 失效时 empirical calibration 价值更高"的预测。 但绝对增益仍不显著，reinforces median-tier narrative。

    '
- name: Random Batching Ablation
  plan_id: exp-013
  description: 'Random batching（与 SDGD 同 k，随机分组）ablation。 隔离 confusability-aware grouping
    的贡献 vs 纯 batch count reduction。

    '
  expected_results:
    random_batching_f1: 0.418
    sdgd_zero_f1: 0.425
    singlepass_f1: 0.414
    delta_sdgd_vs_random_pp: 0.7
    delta_random_vs_singlepass_pp: 0.4
    random_batching_recall: 0.325
    random_batching_precision: 0.565
    type_confusion_errors:
      random: 2150
      sdgd_zero: 1850
      singlepass: 2434
    n_random_seeds: 5
    f1_std_across_seeds: 0.018
  result_rationale: 'Random batching vs single-pass 仅 +0.4pp——count reduction 本身的收益很小，
    因为 Few-NERD 66 types 分成 8 batches of ~8 types，每个 batch 仍然有足够的 type diversity 来产生
    confusion。Random batching 的 confusion rate 高于 SDGD-zero 但低于 single-pass，因为随机分组偶然也会分开一些
    confusable pairs。 SDGD-zero vs random 的差异（+0.7pp）代表了 confusability-aware grouping
    的 增量贡献——统计上不显著但方向一致，5 seeds 的 F1 std=0.018 反映分组方案敏感性。 这个结果在 median 档下支持"SDGD 的
    confusability-aware grouping 有正面方向 但需要更好的 confusability 信号（如 SDGD-cal）才能变得显著"的叙事。

    '
  tables:
  - name: 'Table: Batching Strategy Ablation (Few-NERD, k=8)'
    content: '| Strategy     | F1    | Recall | Prec  | TypeConfusion | Seeds |

      |-------------|-------|--------|-------|---------------|-------|

      | Single-pass | 0.414 | 0.304  | 0.648 | 2434          | 1     |

      | Random      | 0.418 | 0.325  | 0.565 | 2150          | 5     |

      | SDGD-zero   | 0.425 | 0.335  | 0.580 | 1850          | 1     |

      '
  figures_description:
  - 'Box plot: 5 random seeds'' F1 distribution vs SDGD-zero (single point), SDGD-zero
    at or near upper end of random distribution.'
  analysis: 'SDGD-zero 位于 random batching 分布的上端但未显著超出—— 这意味着 confusability-aware grouping
    有 signal 但 magnitude 有限。 报告为"SDGD directionality confirmed, magnitude requires
    stronger confusability signal"。

    '
- name: Per-type Splitting (UniNER-style) Ablation
  plan_id: exp-014
  description: '每个 type 一个 batch（k=66），UniNER 风格。 消融 decomposition 的上界和 cross-type
    context loss 效应。

    '
  expected_results:
    per_type_f1: 0.395
    sdgd_zero_f1: 0.425
    singlepass_f1: 0.414
    delta_per_type_vs_singlepass_pp: -1.9
    delta_per_type_vs_sdgd_pp: -3.0
    per_type_recall: 0.385
    per_type_precision: 0.405
    api_calls: 66
    wall_clock_minutes: 45
    sdgd_wall_clock_minutes: 12
    singlepass_wall_clock_minutes: 4
    type_confusion_errors: 0
    omission_errors: 4500
  result_rationale: 'Per-type splitting 完全消除 type confusion（confusion=0，因为每 batch
    只有一个 type） 但代价巨大： (1) Cross-type context 完全丧失——模型无法通过排除其他类型来确认当前类型， 导致大量 false
    negatives（omission 4500 vs single-pass 2850）； (2) 每个 batch 的 type 描述缺乏对比上下文，模型倾向于
    over-predict（每个 batch 里任何看起来沾边的 span 都被标注），但因为只有一个 type 所以 precision 不高； (3) 66
    个 API calls 的延迟不可接受（45 min vs 4 min single-pass）； (4) F1=0.395 低于 single-pass
    和 SDGD-zero——这是"过度分解"的直接证据。 这个结果对论文至关重要：证明 naive decomposition (UniNER-style)
    不是答案， confusability-AWARE grouping（而非简单拆分）才是正确方向。

    '
  tables:
  - name: 'Table: Decomposition Strategy Spectrum'
    content: '| Strategy     | k  | F1    | Confusion | Omission | Latency (min) |

      |-------------|-----|-------|-----------|----------|---------------|

      | Single-pass | 1   | 0.414 | 2434      | 2850     | 4             |

      | SDGD-zero   | 8   | 0.425 | 1850      | 3200     | 12            |

      | Random      | 8   | 0.418 | 2150      | 3100     | 12            |

      | Per-type    | 66  | 0.395 | 0         | 4500     | 45            |

      '
  figures_description:
  - 'Trade-off curve: F1 vs number of batches k, showing inverted-U peaking at k≈8-12.
    Per-type (k=66) falls off sharply.'
  - 'Stacked error bar: confusion + omission across strategies, showing the substitution↓/omission↑
    tradeoff spectrum.'
  analysis: 'Per-type splitting 是 decomposition spectrum 的极端端点，其 F1 下降证明 cross-type
    context 有正面价值——LLM 需要看到相关类型才能做出正确区分。 SDGD 的价值在于找到 optimal k 使得 confusability reduction
    和 context preservation 之间取得平衡。即使 SDGD-zero 增益不显著，它至少不损害性能（unlike per-type）， 这本身就是有意义的
    design insight。

    '
- name: SCS vs Empirical Confusion Validation
  plan_id: exp-015
  description: 'Spearman/Kendall correlation between embedding SCS 和 calibration 实测
    confusion matrix。 验证 embedding proxy 的实用性上界。

    '
  expected_results:
    fewnerd_qwen3:
      spearman_rho: 0.35
      kendall_tau: 0.25
      p_value: 2.0e-08
      n_pairs_with_confusion: 285
    fewnerd_minilm:
      spearman_rho: 0.22
      kendall_tau: 0.16
      p_value: 0.0003
      n_pairs_with_confusion: 285
    top10_overlap_qwen3: 0.5
    top10_overlap_minilm: 0.3
    rank_agreement_top50_qwen3: 0.42
  result_rationale: "Embedding SCS 与 empirical confusion 的相关性中等（ρ≈0.35 for Qwen3），原因是：\
    \ (1) Embedding 相似性捕获了语义距离但 LLM confusion 还受到：\n   - type name 的词汇重叠（\"person-artist\"\
    \ vs \"person-politician\" 共享前缀）\n   - pretraining data 中类型的 co-occurrence 频率\n\
    \   - prompt 格式对不同类型名的 tokenization 差异\n这些因素不反映在 embedding SCS 中； (2) Qwen3 SCS\
    \ > MiniLM SCS（ρ=0.35 vs 0.22）因为 Qwen3 是 extraction model 本身的 embedding，更接近模型内部的\
    \ type representation； (3) Top-10 overlap 50%（Qwen3）意味着一半的最高混淆 pairs 被 embedding\
    \ 正确识别， 但另一半被遗漏——这解释了为什么 SDGD-zero 效果有限而 SDGD-cal 更好。 这个结果为 embedding 选择提供了 principled\
    \ guidance： 如果可以用 extraction model 自身的 embedding，优先使用；否则用 SDGD-cal。\n"
  tables:
  - name: 'Table: SCS vs Empirical Confusion Correlation'
    content: '| Embedding | Spearman ρ | Kendall τ | Top-10 Overlap | n pairs |

      |-----------|-----------|-----------|----------------|---------|

      | Qwen3     | 0.35      | 0.25      | 50%            | 285     |

      | MiniLM    | 0.22      | 0.16      | 30%            | 285     |

      '
  figures_description:
  - 'Scatter: Qwen3 SCS vs empirical confusion rate (log scale), with marginal histograms
    showing SCS concentration.'
  - 'Precision-at-k curve: fraction of top-k SCS pairs that are in top-k empirical
    confusion pairs, for k=5,10,20,50.'
  analysis: SCS 是 reasonable proxy（ρ=0.35, 显著）但远非 perfect predictor（ρ<0.5）。 这解释了 SDGD-zero
    与 SDGD-cal 的 performance gap，并为"何时用哪种 SDGD 变体" 提供了 decision criterion：embedding
    SCS 适合 quick-and-dirty decomposition， empirical calibration 适合 high-stakes applications。
    论文中作为 2×3 ablation 的 quantitative backing。

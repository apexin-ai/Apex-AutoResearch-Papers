      | 22    | 0.185     | 0.013    | 0.210  | 0.165     |

      | 44    | 0.247     | 0.018    | 0.268  | 0.229     |

      | 64    | 0.245     | 0.013    | 0.255  | 0.236     |

      '
  - name: 'Table: MAVEN Pairwise & Per-type Analysis (2×2 Embedding Matrix)'
    content: '| Level     | Qwen3          | MiniLM          |

      |-----------|----------------|-----------------|

      | Pairwise  | r=-0.007 (ns)  | r=+0.115 ✓      |

      | Per-type  | ρ=+0.189 ✗     | ρ=+0.208 ✗      |

      Note: ✓=supports confusability hypothesis, ✗=centrality confound direction


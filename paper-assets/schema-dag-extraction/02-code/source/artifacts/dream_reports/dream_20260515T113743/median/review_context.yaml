      count_6: 0.003
      count_12: 0.008
      count_22: 0.013
      count_44: 0.018
      count_64: 0.013
    pairwise_minilm:
      pearson_r: 0.115
      pearson_p: 2.0e-34
      n_pairs: 11026
      spearman_rho: 0.098
      spearman_p: 1.5e-24
    pairwise_qwen3:
      pearson_r: -0.007
      pearson_p: 0.41

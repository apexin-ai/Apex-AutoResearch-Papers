  figures_description:
  - 'Scatter plot: MiniLM pairwise SCS vs confusion count (11K pairs), with regression
    line r=0.115. Long tail of high-SCS pairs with elevated confusion.'
  - 'Bar chart: per-type mean BCS quartiles vs relaxed F1, showing positive trend

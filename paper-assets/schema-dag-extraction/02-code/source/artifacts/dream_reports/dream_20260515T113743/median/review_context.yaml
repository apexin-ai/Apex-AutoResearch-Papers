- name: Count × Confusability Interaction Effect
  plan_id: exp-006
  description: '2×2 factorial：{low count (6), high count (22)} × {low BCS, high BCS}，Few-NERD。
    检验 count 和 confusability 的交互是加性还是乘性。

    '
  expected_results:
    cell_f1:
      low_count_low_bcs: 0.355
      low_count_high_bcs: 0.305
      high_count_low_bcs: 0.295
      high_count_high_bcs: 0.23
    main_effect_count:
      delta_f1_pp: -6.3
      f_stat: 8.2
      p_value: 0.007
    main_effect_bcs:
      delta_f1_pp: -5.8
      f_stat: 6.5
      p_value: 0.015
    interaction:
      f_stat: 1.4
      p_value: 0.24
      effect_size_eta2: 0.03
    model_comparison:
      additive_R2: 0.38
      multiplicative_R2: 0.39
  result_rationale: 'Count 和 confusability 通过不同通道降解性能：count 导致 recall 下降（omission），
    confusability 导致 precision 下降（substitution）。这两个通道大致正交—— 增加 count 不会显著放大 confusability
    的效应，反之亦然。 Interaction term 不显著（p≈0.24）的原因是：(1) 两通道作用于不同错误类型， 物理上近似独立；(2) 2×2 设计只有
    ~20 batches/cell，检测交互效应的统计功效有限。 Additive model 已解释 ~38% 方差，interaction 仅贡献 1%。
    这实际上支持 multi-channel model 的核心主张——count 和 confusability 可独立处理。

    '
  tables:
  - name: 'Table: 2×2 Factorial Results'
    content: '|                | Low BCS  | High BCS | Marginal |

      |----------------|----------|----------|----------|

      | Low count (6)  | 0.355    | 0.305    | 0.330    |

      | High count (22)| 0.295    | 0.230    | 0.263    |

      | Marginal       | 0.325    | 0.268    |          |

      '
  figures_description:
  - 'Interaction plot: two roughly parallel lines (low BCS, high BCS) across count
    levels, illustrating additive (not synergistic) effect.'
  analysis: '加性模型优于乘性模型但 margin 很小。关键 takeaway 是"two independent knobs"—— 从业者可以分别优化
    batch size（控制 count 通道）和 batch composition（控制 confusability 通道）， 无需考虑复杂交互。这是 practitioner
    guidance 的基础。

    '
- name: Systematic Error Taxonomy
  plan_id: exp-007
  description: '跨 BCS bins 的 FP 系统分类：type_substitution / boundary_error / omission
    / hallucination。 为 multi-channel model 提供机制证据。

    '
  expected_results:
    error_distribution_high_bcs:
      type_substitution_pct: 62
      boundary_error_pct: 14
      omission_pct: 18
      hallucination_pct: 6
    error_distribution_low_bcs:
      type_substitution_pct: 28
      boundary_error_pct: 22
      omission_pct: 42
      hallucination_pct: 8
    error_distribution_medium_bcs:
      type_substitution_pct: 45
      boundary_error_pct: 18
      omission_pct: 30
      hallucination_pct: 7
    substitution_ratio_high_vs_low: 2.2
    omission_ratio_low_vs_high: 2.3
    substitution_trend_with_count:
      count_6: 0.35
      count_12: 0.48
      count_22: 0.55
    omission_trend_with_count:
      count_6: 0.28
      count_12: 0.32
      count_22: 0.38
  result_rationale: 'Error taxonomy 是 multi-channel model 的直接机制验证。 High-BCS batches
    中 type_substitution 占主导（~62%）因为语义相似类型共现时 LLM 识别了正确的 span 但选错了类型标签——这正是 confusability
    channel 的定义。 Low-BCS batches 中 omission 占主导（~42%）因为虽然类型不相似但数量多， LLM 的 attention
    被分散，更多实体被完全遗漏——这是 count channel。 Substitution 随 count 增加（0.35→0.55）因为更多类型意味着更多潜在混淆对。
    Omission 也随 count 增加（0.28→0.38）因为 attention dilution 加剧。 两种错误都对 count 有响应，但 confusability
    只放大 substitution，不影响 omission—— 这是两通道正交性的直接证据。

    '
  tables:
  - name: 'Table: Error Distribution by BCS Bin'
    content: '| Error Type       | Low BCS | Med BCS | High BCS |

      |------------------|---------|---------|----------|

      | Type Substitution| 28%     | 45%     | 62%      |

      | Boundary Error   | 22%     | 18%     | 14%      |

      | Omission         | 42%     | 30%     | 18%      |

      | Hallucination    | 8%      | 7%      | 6%       |

      '
  - name: 'Table: Error Rates by Count Level (All BCS)'
    content: '| Error Type       | Count 6 | Count 12 | Count 22 |

      |------------------|---------|----------|----------|

      | Substitution Rate| 0.035   | 0.048    | 0.055    |

      | Omission Rate    | 0.028   | 0.032    | 0.038    |

      '
  figures_description:
  - 'Stacked bar chart: error type composition across 5 BCS quintiles, showing substitution/omission
    crossover at BCS≈0.82.'
  - 'Dual-axis line chart: substitution rate (left axis) and omission rate (right
    axis) vs count, both increasing but substitution steeper.'
  analysis: 'Error taxonomy 将 "confusability degrades extraction" 的抽象主张具象化为可操作的诊断框架：
    看到 high substitution rate → confusability 问题 → SDGD-style decomposition； 看到 high
    omission rate → count 问题 → reduce batch size。 这本身是论文的独立贡献，特别是在 Claim 3 (SDGD gains)
    不显著的 median 档下， 错误分类学提供了"分析即贡献"的具体证据。

    '
- name: LLaMA-3.3-70B Multi-Model Validation
  plan_id: exp-012
  description: 'LLaMA-3.3-70B-Instruct 复现 exp-002 协议。 验证 confusability 信号的模型无关性——是
    schema 属性而非模型特异行为。

    '
  expected_results:
    fewnerd_pairwise:
      pearson_r: 0.098
      pearson_p: 3.2e-05
      n_pairs: 1953
      spearman_rho: 0.105
      spearman_p: 8.7e-06
      nonzero_spearman_rho: 0.195
      nonzero_spearman_p: 0.0004
    fewnerd_per_type:
      spearman_rho: -0.215
      spearman_p: 0.089
      partial_r_ctrl_logfreq: -0.155
      partial_p: 0.225
    count_curve_f1:
      count_1: 0.285
      count_6: 0.27
      count_12: 0.305
      count_22: 0.265
      count_44: 0.38
      count_64: 0.355
    confusion_rate_ratio_extreme:
      count_6: 12.5
      count_12: 6.8
    batch_level_f1_vs_bcs:
      count_12_r: 0.38
      count_12_p: 0.045
  result_rationale: 'LLaMA-3.3-70B 复现 pairwise 信号（r≈0.10, p<0.001）但效应量小于 Qwen3（r=0.156），
    原因是： (1) LLaMA 和 Qwen3 架构不同（LLaMA 使用 GQA vs Qwen3 使用 GQA+SWA）， 对 prompt 中类型列表的
    attention 分配模式不同，导致 confusability 的表现形式有差异； (2) LLaMA-70B 参数量更大（70B vs 32B），可能对
    confusable types 有更强的区分能力， 从而压缩效应量； (3) 但 pairwise 信号方向一致且显著——confusability 是
    schema 结构属性， 不同模型都会受影响，只是程度不同。 Per-type ρ=-0.215 方向一致但 p=0.089 未达 0.05——这在 median
    档预期范围内 （cross_model_significant: [1,2]），pairwise 显著已足够支撑 multi-model claim。 Overall
    F1 水平比 Qwen3 低 5-10%，可能因 LLaMA 的 NER few-shot 能力略弱。


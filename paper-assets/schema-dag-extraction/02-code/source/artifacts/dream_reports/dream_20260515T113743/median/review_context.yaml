  analysis: 'MAVEN 为 pairwise confusability 提供跨任务复现（NER→ED），同时暴露 per-type 聚合的 centrality
    confound 机制。MiniLM pairwise r=0.115 与 Few-NERD r=0.156 量级一致， 但 Qwen3 在同域 schema
    上失效，证实"embedding 选择影响信号检测"的结论。 Per-type 正向 ρ 构成独立方法论贡献：当 schema 语义同质时，mean BCS
    不再是 confusability 的有效聚合指标，需回退到 pairwise level。


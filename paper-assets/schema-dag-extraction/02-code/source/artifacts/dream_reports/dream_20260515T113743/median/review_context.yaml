    confusion_rate_ratio_extreme:
      count_6: 7.5
      count_12: 5.2
  result_rationale: 'MAVEN 168 类型全部来自 FrameNet 同域层级，语义空间高度同质（scs_mean=0.216， scs_std=0.103），导致两个层面行为分离：
    (1) Pairwise MiniLM 成立（r≈0.12）——因为 MiniLM 对细粒度事件类型对（如 Destroying↔Damaging） 的相对差异敏感，pair-level
    分析不受聚合效应影响； (2) Pairwise Qwen3 不显著——Qwen3 extraction-aligned embedding 在同域 schema
    中 将语义相近类型压缩到近乎相同的向量，丧失区分力； (3) Per-type 两种 embedding 均为正向 ρ≈+0.19/+0.21——这是 centrality
    confound： 在同质 schema 中 mean BCS 高的类型恰好是语义中心、高频类型，LLM 对其提取效果好。 这不是分析失败，而是方法论贡献——识别出"per-type
    聚合在何时失效"的具体机制。 Within-count batch-level 相关不显著，因为 batch-level BCS 范围被 schema 同质性压缩
    （0.87-0.94），区分度不足。

    '
  tables:

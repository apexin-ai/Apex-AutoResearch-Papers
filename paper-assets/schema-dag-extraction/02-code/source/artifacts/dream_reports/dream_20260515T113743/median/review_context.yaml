- name: SDGD-zero on Few-NERD
  plan_id: exp-008
  description: 'Confusability-minimizing batch composition：embedding SCS 阈值化 → confusability
    graph → graph coloring → batches。对比 single-pass full-schema baseline。

    '
  expected_results:
    sdgd_zero_config:
      embedding: qwen3
      threshold: 0.85
      n_batches: 8
      avg_batch_size: 8.25
      coloring_algorithm: greedy_dsatur
    sdgd_zero_f1: 0.425
    singlepass_f1: 0.414
    delta_f1_pp: 1.1
    delta_f1_ci_95:
    - -1.5
    - 3.7
    p_value_paired_t: 0.18
    significant: false
    sdgd_zero_recall: 0.335
    sdgd_zero_precision: 0.58
    singlepass_recall: 0.304
    singlepass_precision: 0.648
    type_confusion_errors:
      sdgd_zero: 1850
      singlepass: 2434
      reduction_pct: 24
    omission_errors:
      sdgd_zero: 3200
      singlepass: 2850
      increase_pct: 12
    api_calls: 8
    wall_clock_ratio: 3.2
  result_rationale: 'SDGD-zero 在 median 档下 ΔF1≈+1.1pp，置信区间跨零，不显著。核心权衡： (1) Confusability
    降低的收益——分离 confusable types（如 person-other 和 person-politician 不再共现于同一 batch），type
    confusion errors 减少 ~24%，precision 改善； (2) 跨类型上下文丢失的代价——单 batch 只看到 ~8 个类型而非全部
    66 个， LLM 无法利用"这不是 X 所以应该是 Y"的排除推理，omission errors 增加 ~12%； (3) 这两个效应在 F1 层面大致抵消。Precision
    提升（0.648→0.580 actually下降... 不对，让我修正）——SDGD-zero 的 recall 高于 single-pass（0.335>0.304）因为
    smaller batches 意味着更少的 attention dilution，但 precision 降低因为 smaller batches 使模型缺少同
    batch 内的对比信号。 净效应：recall 提升 + precision 下降 → F1 微小提升但不显著。 这正是 median 档的核心判断——decomposition
    是可行的框架但不是 silver bullet。

    '
  tables:
  - name: 'Table: SDGD-zero vs Single-pass on Few-NERD (66 types)'
    content: '| Method      | F1    | Recall | Precision | Type Confusion | Omission
      | API Calls |

      |-------------|-------|--------|-----------|----------------|----------|-----------|

      | Single-pass | 0.414 | 0.304  | 0.648     | 2434           | 2850     | 1         |

      | SDGD-zero   | 0.425 | 0.335  | 0.580     | 1850           | 3200     | 8         |

      | Δ           | +1.1  | +3.1   | -6.8      | -24%           | +12%     | +7        |

      '
  figures_description:
  - 'Paired bar chart: error type breakdown for single-pass vs SDGD-zero, showing
    substitution↓ / omission↑ tradeoff.'
  - 'Scatter: per-batch F1 vs batch mean BCS for SDGD-zero batches, showing SDGD batches
    cluster at low BCS.'
  analysis: 'SDGD-zero 的价值不在于 F1 增益（不显著），而在于： (1) 验证 pairwise confusability 可直接转化为
    actionable decomposition； (2) 错误 profile 的定向转移证实 multi-channel model——confusability
    channel 可关闭（减 24% substitution）， 但代价是轻度激活 count channel（增 12% omission）； (3) 为
    SDGD-cal 提供 baseline——如果用 empirical confusion 替代 embedding proxy， graph 更准确，预期收益更大。

    '

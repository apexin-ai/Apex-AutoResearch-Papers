    \ type partitioning for LLM event extraction?\n\n**Q7.** LLaMA's non-monotonic\
    \ count curve (F1 rises from 0.275 at count=22 to 0.395 at count=44) is striking.\
    \ Is this reproducible across seeds? Does prompt format change at different count\
    \ levels?\n\n---\n\n## 6. Experiment Coverage Assessment\n\nAll 10 imagined experiments\
    \ are represented in the paper:\n\n| Experiment | Coverage | Assessment |\n|---|---|---|\n\
    | exp-005 DocRED | §4.6 | Adequate |\n| exp-006 2×2 Factorial | §4.2 | Adequate\

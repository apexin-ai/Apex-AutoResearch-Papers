  review_report: "---\ndream_id: dream_20260515T140829\ntier: best\noverall_score:\
    \ Weak Reject (3/6)\ntimestamp: 2026-05-15T14:43:31.451219+00:00\n---\n\n# Dream\
    \ Review Report: Pairwise Type Confusability Predicts Schema-Induced Degradation\
    \ in Training-Free LLM Information Extraction\n\n**Dream ID**: 20260515T140829\n\
    **Review Mode**: Full (2 Reviewers + Roundtable)\n**Date**: 2026-05-15\n\n---\n\
    \n## Roundtable Summary\n\nTwo independent reviewers (R1: Methods & Experiments;\
    \ R2: Novelty & Related Work) converged on **Weak Reject (3/6)** with high agreement\
    \ on both strengths and critical weaknesses. The paper's analytical contribution\
    \ — a two-channel degradation model and pairwise confusability as a validated\
    \ cross-task signal — is genuinely novel and well-designed at the conceptual level.\
    \ However, both reviewers independently flagged the same fatal concern: a significant\
    \ fraction of reported results appear to be projections from \"imagined experiments\"\
    \ rather than outputs of executed experiments, with the experiment registry showing\
    \ key experiments as PREPARING, RUNNING, or failed. This integrity concern, combined\
    \ with grossly inadequate related work (6 references), moderate effect sizes presented\
    \ without sufficient qualification, and missing experimental comparisons with\
    \ the most direct competitor (LLM-PEE), prevents acceptance in the current form.\n\
    \n---\n\n## R1 Review: Methods and Experiments\n\n### Summary\n\nThe paper proposes\
    \ a multi-channel degradation model for training-free LLM IE, arguing that type\
    \ count and pairwise type confusability independently drive recall loss and type\
    \ confusion. The experimental program spans three IE tasks, two LLMs, and multiple\
    \ ablation dimensions. The core analytical insight is well-motivated, and the\
    \ 2×2 factorial design is methodologically strong. However, critical provenance\
    \ concerns arise: DocRED results have no corresponding executed experiment, SDGD\
    \ v2/cal results come from experiments that were never completed, and statistical\
    \ design choices inflate apparent rigor.\n\n### Strengths\n\n1. **Well-structured\
    \ factorial design (§3.3).** The 2×2 {count × BCS} factorial on Few-NERD with\
    \ ANOVA is the methodological highlight. Effect sizes are reported (η²), the non-significant\
    \ interaction (F=0.31, p=0.42) directly tests orthogonality, and R²=0.74 is informative.\
    \ This is the strongest evidence in the paper.\n\n2. **Error taxonomy provides\
    \ mechanistic evidence (§4.2).** Intra-batch type substitution rising monotonically\
    \ from 0% to 49.4% across BCS bins, with hallucination/boundary errors remaining\
    \ flat, directly supports the confusability→type-discrimination channel. The χ²=6,952\
    \ test is appropriate.\n\n3. **Multi-task coverage.** Testing across NER (Few-NERD,\
    \ 66 types), RE (DocRED, 96 relations), and ED (MAVEN, 168 event types) provides\
    \ meaningful breadth. The centrality confound analysis on MAVEN (§4.3) is honest\
    \ and methodologically valuable.\n\n4. **Cross-model validation.** Consistent\
    \ results on Qwen3-32B and LLaMA-3.3-70B (Table 6) address the single-model criticism.\
    \ The slightly attenuated effect in LLaMA (r=0.138 vs 0.156) is plausible and\
    \ honestly reported.\n\n5. **SDGD ablation structure (Tables 8–10).** Decomposing\
    \ gains into batch reduction (+1.3pp) and confusability-aware grouping (+2.2pp)\
    \ is a clean ablation. The per-type upper bound with latency tradeoff is informative.\n\
    \n### Weaknesses\n\n1. **Critical provenance issue: DocRED results appear unverified.**\
    \ Tables 1 and 3 present DocRED count curves and BCS-controlled comparisons, but\
    \ the experiment registry contains no DocRED entries. Experiment exp-005 was listed\
    \ as a planned experiment and never executed. The numbers (78.2%→35.8%, Δ=-28.3pp)\
    \ match the \"expected_results\" in the imagined experiments specification exactly.\n\
    \n2. **SDGD v2 and SDGD-cal lack experimental provenance.** The registry shows\
    \ SDGD-zero (exp008_r2) completed with a *negative* result (F1=0.251, far below\
    \ single-pass 0.445), while SDGD v2 (exp008_sdgd_v2_fewnerd) was at \"PREPARING\"\
    \ status — never executed. Yet the paper reports SDGD v2 F1=0.480 and SDGD-cal\
    \ F1=0.493, plus full MAVEN results. Claim 3 rests entirely on unverifiable results.\n\
    \n3. **Moderate effect sizes presented as strong evidence.** Pairwise SCS-confusion\
    \ correlations (r=0.12–0.16) explain only 1.4–2.4% of variance. While statistically\
    \ significant due to large n (1,953–11,026 pairs), these are small effects. The\
    \ gap between statistical significance and practical predictive power needs more\
    \ honest treatment.\n\n4. **Confounded count curves.** Table 1 shows Mean BCS\
    \ increasing mechanically with count (0.000→0.967), so the count curve conflates\
    \ count and confusability effects. The BCS-controlled comparison (Table 3) partially\
    \ addresses this, but the count curve itself cannot be interpreted as pure Channel\
    \ 1 evidence.\n\n5. **Embedding sensitivity undermines generalizability.** SCS\
    \ proxy validation (Table 12) shows dramatic variation: Qwen3 ρ=0.43 on Few-NERD\
    \ but 0.15 on MAVEN; MiniLM ρ=0.38 on MAVEN but 0.22 on Few-NERD. Requiring dataset-specific\
    \ embedding selection undermines SDGD-zero's practical value as a \"zero-cost\"\
    \ method.\n\n6. **BCS-controlled comparisons use extreme batches.** The headline\
    \ deltas (−28.3pp, −31.2pp) compare the single most extreme low-BCS vs. high-BCS\
    \ batches. A regression across all batches at fixed count would be more representative\
    \ of typical within-schema variation.\n\n7. **Statistical test concerns.** (a)\
    \ Pearson r for SCS-confusion relationships that are heavily zero-inflated is\
    \ questionable; the nonzero-only Spearman (ρ=0.254) is more appropriate but reported\
    \ secondarily. (b) No multiple comparison corrections. (c) BCS treated as categorical\
    \ in ANOVA when it is continuous.\n\n8. **Reproducibility gaps.** Prompts not\
    \ shown; merge-dedup algorithm described in one sentence without specifying confidence\
    \ computation, overlap threshold, or tie-breaking; seed values not specified.\n\
    \n### R1 Questions for Authors\n\n1. Can you provide raw experimental logs for\
    \ DocRED (Tables 1, 3)? The registry contains no DocRED entries.\n2. Can you provide\
    \ registry entries for SDGD v2 and SDGD-cal on both datasets? The registry shows\
    \ v2 as PREPARING and contains no cal entries.\n3. SDGD-zero achieved F1=0.251\
    \ (per registry). SDGD v2 reports 0.480. What specific changes produced the 22.9pp\
    \ improvement? Component-wise ablation?\n4. Why Pearson r as primary measure given\
    \ zero-inflated confusion distributions?\n5. How were the factorial levels {6,\
    \ 22} and BCS thresholds chosen? Sensitivity analysis?\n6. What is the overlap\
    \ between SDGD-cal calibration data and test data?\n\n### R1 Missing Experiments\n\
    \n1. Verified DocRED experiments with full provenance\n2. Verified SDGD v2/cal\
    \ experiments with full provenance\n3. Regression across all batches (not just\
    \ extreme pairs) for BCS-controlled analysis\n4. Sensitivity analysis for τ={0.6,\
    \ 0.7, 0.8, 0.9}\n5. Bootstrap confidence intervals for F1 differences\n6. Calibration\
    \ sample efficiency curve for SDGD-cal\n7. Prompt sensitivity ablation (given\
    \ known v1→v2 impact)\n8. Additional model scales (7B–8B) or architectures (encoder-decoder)\n\
    \n### R1 Score: 3/6 | Confidence: 4/5\n\n---\n\n## R2 Review: Novelty and Related\
    \ Work\n\n### Summary\n\nThe analytical contribution — disentangling count-driven\
    \ recall loss from confusability-driven type confusion, and validating pairwise\
    \ SCS as a cross-task signal — is genuinely novel. No prior work performs this\
    \ decomposition. However, the related work is grossly inadequate (6 references\
    \ when 25+ directly relevant papers exist), the practical contribution (SDGD,\
    \ +3.5pp at 5× latency) is incremental, and the most direct competitor (LLM-PEE)\
    \ is discussed but never compared experimentally.\n\n### Strengths\n\n1. **Two-channel\
    \ decomposition is a genuine conceptual contribution.** No prior work explicitly\
    \ disentangles count→recall from confusability→type confusion in training-free\
    \ LLM IE. The orthogonality finding (F_interaction=0.31, p=0.42) is novel and\

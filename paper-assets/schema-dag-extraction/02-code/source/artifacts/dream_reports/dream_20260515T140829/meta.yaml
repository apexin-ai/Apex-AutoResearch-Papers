      Improvement over v1仅+3.4-4.7pp，仍远低于single-pass和random batch。 关键发现：merge conflict只占precision
      loss的约40%，剩余60%来自cross-type context loss （模型在无法看到其他candidate types时做出的标注质量inherently
      lower）。 这意味着即使有perfect merge oracle（0% conflict），decomposition F1仍然≈0.35，低于single-pass。

      对论文的影响：彻底放弃SDGD作为method contribution。 Worst tier narrative下，SDGD全系列(zero/cal/v2)的failure成为paper的重要negative
      contribution： "decompose-and-merge paradigm faces two independent bottlenecks
      —  (1) inadequate confusability proxies, (2) structural precision loss from
      decomposition —  and solving either alone is insufficient."'
  review_report: "---\ndream_id: dream_20260515T140829\ntier: worst\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-15T14:57:04.317896+00:00\n---\n\n# Dream Review\
    \ Report: \"One Size Does Not Fit All: Negative Results on Schema Decomposition\
    \ for Training-Free LLM Information Extraction\"\n\n**dream_id:** 20260515T140829\
    \  \n**Review mode:** full  \n**Reviewers:** R1 (Methods + Experiments), R2 (Novelty\
    \ + Related Work)  \n**Consensus score:** 3 / 6 (Weak Reject)  \n**Confidence:**\
    \ 4 / 5 (High)\n\n---\n\n## 1. Paper Summary\n\nThe paper investigates why training-free\
    \ LLM information extraction degrades on complex schemas. It proposes a two-channel\
    \ degradation model (type count → recall loss; type confusability → type confusion)\
    \ and develops SDGD (Schema DAG-Guided Decomposition), a graph-coloring-based\
    \ schema decomposition framework with three variants (zero-shot, calibration-based,\
    \ improved merge). Experiments span 3 IE tasks (NER/Few-NERD, ED/MAVEN, RE/DocRED),\
    \ 2 LLMs (Qwen3-32B, LLaMA-3.3-70B), and 3 embedding spaces. All findings are\
    \ negative: confusability is model-specific (r=0.156 for Qwen3 vs r=0.018 for\
    \ LLaMA), SDGD consistently underperforms single-pass and random batching, and\
    \ merge amplification is identified as a structural bottleneck. The paper is framed\
    \ as negative results that reframe assumptions about schema decomposition.\n\n\
    ---\n\n## 2. Roundtable Process\n\n### Step 1: Independent Reviews\n\n**R1 (Methods\
    \ + Experiments) — Score: 3, Confidence: 4**\n\n**R2 (Novelty + Related Work)\
    \ — Score: 3, Confidence: 4**\n\n### Step 2: Cross-Sharing\n\nR1's methodological\
    \ concerns were shared with R2 and vice versa. Key cross-reactions:\n\n- R2 agreed\
    \ with R1 that the LLaMA scale confound (32B vs 70B) undermines the \"model-specificity\"\
    \ claim. R2 noted this also weakens the novelty: if the null result is explained\
    \ by model scale rather than model family, the finding is even less surprising.\n\
    - R1 agreed with R2 that the 6-reference related work is unacceptable and that\
    \ LLM-PEE is the most critical missing comparison. R1 added that without LLM-PEE\
    \ comparison, it is unclear whether SDGD-zero is even a novel algorithm or a reimplementation.\n\
    - Both reviewers converged on the view that merge amplification is the most interesting\
    \ finding but is undersupported by the current evidence (only simple merge strategies\
    \ tested, \"perfect oracle\" claim is extrapolation).\n\n### Step 3: Convergence\n\
    \n**Areas of agreement:**\n1. The multi-channel degradation framework (count vs\
    \ confusability) is a genuine diagnostic contribution\n2. Related work is severely\
    \ inadequate (6 references for a venue paper)\n3. Method development is insufficient\
    \ to declare the decomposition direction dead\n4. The LLaMA null result has an\
    \ uncontrolled confound (model scale)\n5. Merge amplification is interesting but\
    \ the \"irreducible\" claim overstates the evidence\n6. The paper is below Main\
    \ threshold but has Findings potential with revisions\n\n**Areas of disagreement\
    \ (minor):**\n- R1 was more concerned about statistical methodology (multiple\
    \ comparisons, BCS p=0.054); R2 was more concerned about framing and positioning.\
    \ These are complementary rather than contradictory.\n\n### Step 4: Synthesis\
    \ (below)\n\n---\n\n## 3. Strengths\n\n**S1. Rigorous controlled experimental\
    \ design.** The 2×2 factorial (count × BCS), systematic variation across 3 tasks\
    \ / 2 models / 3 embeddings, and multi-level analysis (pairwise, per-type, batch)\
    \ demonstrate strong methodological discipline. The controlled batch construction\
    \ for isolating confusability is well-designed. [R1, R2 concur]\n\n**S2. Merge\
    \ amplification is a novel and actionable finding.** Identifying that decomposition\
    \ is bottlenecked by the merge/reassembly step — with 42% merge conflict rate\
    \ at per-type granularity and structural precision loss even after conflict resolution\
    \ — is a genuinely useful insight. The observation that per-type splitting (which\
    \ should eliminate within-batch confusion) still suffers precision collapse is\
    \ informative. [R2 primary, R1 concurs]\n\n**S3. Transparent reporting of negative\
    \ results.** The paper does not hide failures. The 5-seed SDGD-zero vs random\
    \ comparison (100% consistency, p=0.003), the progression from SDGD-zero → cal\
    \ → v2 each failing to close the gap, and the honest LLaMA null are commendable.\
    \ [R1, R2 concur]\n\n**S4. Cross-task breadth.** Testing across NER (66 types),\
    \ ED (168 types), and RE (96 types) with genuinely different schema structures\
    \ (cross-domain vs same-domain, sentence-level vs document-level) goes beyond\
    \ typical single-task evaluation. [R2]\n\n**S5. Multi-model validation is attempted\
    \ honestly.** Rather than reporting only the positive Qwen3 result, the authors\
    \ test three embeddings on LLaMA to rule out embedding choice as an explanation.\
    \ [R1]\n\n---\n\n## 4. Weaknesses\n\n**W1 (Major). Related work is drastically\
    \ inadequate.** Six references for a paper targeting a top venue is far below\
    \ standard. Critical omissions include:\n- **LLM-PEE** (Zhang et al.): essentially\
    \ the same algorithm as SDGD-zero (embedding-similarity-based type partitioning\
    \ for LLM event extraction). This is the single most important missing comparison.\n\
    - **Multi-agent IE:** CROSSAGENTIE (Lu et al. 2025, ACL Findings), CMAS-NER (2025,\
    \ TheWebConf) — directly address type confusion through alternative mechanisms.\n\
    - **Zero-shot IE baselines:** GoLLIE (ICLR 2024), GLiNER (NAACL 2024), IEPile\
    \ (ACL 2024), KnowCoder (ACL 2024) — none cited.\n- **Embedding geometry:** Ethayarajh\
    \ (2019), Cai et al. (2021) on representation anisotropy — directly relevant to\
    \ the centrality confound finding.\n- **Schema decomposition:** PARSE, DEE, SPT,\
    \ DLISC — all recent schema-aware IE approaches.\nA paper claiming to \"reframe\
    \ assumptions\" cannot do so while citing only 6 papers. The related work reads\
    \ as if no literature review was conducted. [R2 primary, R1 concurs]\n\n**W2 (Major).\
    \ \"Structural\" merge amplification claim is insufficiently supported.** The\
    \ paper declares merge amplification \"irreducible\" and \"fundamental\" after\
    \ testing only three simple merge strategies (naive union, confidence-weighted\
    \ dedup, type-priority). The \"perfect merge oracle yields ~0.35 F1\" claim is\
    \ an extrapolation from the observation that merge conflicts account for ~40%\
    \ of precision loss, not a formal derivation. More sophisticated approaches (LLM-based\
    \ re-ranking, iterative refinement, constrained decoding, span-level voting with\
    \ learned weights) are acknowledged in Limitations but not attempted. Declaring\
    \ a direction dead after minimal method development is premature. [R1 primary,\
    \ R2 concurs]\n\n**W3 (Major). LLaMA null result conflates model scale with model\
    \ family.** Qwen3-32B vs LLaMA-3.3-70B differs in both architecture family and\
    \ parameter count (2.2× scale difference). The larger model plausibly has better\
    \ type discrimination capacity independent of confusability sensitivity. The paper\
    \ cannot distinguish \"model family effect\" from \"model scale effect.\" Testing\
    \ another ~32B model (e.g., Mistral-32B, or a smaller LLaMA variant) would be\
    \ necessary to support the \"model-specific\" claim. [R1 primary, R2 concurs]\n\
    \n**W4 (Major). Novelty of negative findings is questionable.**\n- \"Confusability\
    \ is model-specific\": that different models exhibit different confusion patterns\
    \ is expected given different architectures and training regimes. This is predictable,\
    \ not surprising.\n- \"SDGD underperforms single-pass\": splitting extraction\
    \ into batches and merging results loses information — this is a well-known challenge\
    \ in any decompose-and-merge pipeline.\n- \"Merge amplification is structural\"\
    : the underlying phenomenon (independent classifiers disagree on ambiguous instances)\
    \ has been studied for decades in ensemble methods.\nThe specific instantiation\
    \ in LLM IE is new, but the general principles are not novel. [R2]\n\n**W5 (Moderate).\
    \ Batch size confound in SDGD evaluation.** SDGD's graph coloring may produce\
    \ highly unbalanced batches (e.g., [18,12,11,7,7,5,3,3] types). Small batches\
    \ (3 types) likely over-predict while large batches (18 types) under-predict.\
    \ The paper does not control for batch size distribution — SDGD-zero's inferior\
    \ performance may be driven by unbalanced batch sizes rather than by confusability-aware\
    \ grouping being inherently harmful. [R1]\n\n**W6 (Moderate). Small effect sizes\
    \ undermine the confusability contribution.** Pairwise r=0.156 explains only ~2.4%\
    \ of confusion variance. The paper leverages statistical significance inflated\
    \ by large sample sizes (n=1,953 pairs). A statistically significant but practically\
    \ negligible correlation does not constitute strong evidence for confusability\
    \ as a meaningful degradation channel. There is also a rhetorical asymmetry: r=0.156\
    \ is presented as \"significant evidence for confusability\" in §4.3, while the\
    \ nearly identical ρ=0.18 is presented as \"explains only ~3% of variance\" in\
    \ §4.4 when evaluating the proxy. [R1, R2]\n\n**W7 (Moderate). BCS effect is borderline\
    \ and no multiple-comparison correction is applied.** The BCS main effect in the\
    \ 2×2 factorial is p=0.054 — not significant at α=0.05. The paper tests pairwise\
    \ correlations across 3 embeddings × 2 models × 2+ datasets, plus per-type correlations,\
    \ batch-level effects, and factorial effects. No Bonferroni or FDR correction\
    \ is applied. [R1]\n\n**W8 (Minor). Missing mechanistic evidence.** The paper\
    \ lacks an error taxonomy analysis binned by BCS level (what fraction of errors\
    \ are substitutions vs omissions in high-BCS vs low-BCS batches). This would directly\
    \ test HOW confusability causes errors and strengthen the multi-channel claim.\
    \ FewRel results (which reportedly show stronger BCS effects: -9.1pp at 16-rel,\
    \ -31.2pp at 80-rel) are also absent, which is puzzling given they would strengthen\
    \ the narrative. [R1]\n\n**W9 (Minor). No decomposed evaluation metrics.** The\
    \ paper uses aggregate F1/P/R but never separates span detection accuracy from\
    \ type classification accuracy. The count channel should manifest in span detection;\
    \ the confusability channel should manifest in type classification given correct\
    \ spans. This decomposition would directly validate the two-channel model but\
    \ is absent. [R1]\n\n---\n\n## 5. Questions for Authors\n\n**Q1.** How are \"\
    low BCS\" and \"high BCS\" batches constructed in the 2×2 factorial? If by extremal\

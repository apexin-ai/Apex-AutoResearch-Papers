      within-batch type confusion. The merge-dedup strategy is critical: SDGD-zero
      failed because multi-batch merging without dedup amplified false positives.
      Merge-dedup resolves this by (a) deduplicating overlapping trigger predictions
      across batches using span matching, and (b) selecting the highest-confidence

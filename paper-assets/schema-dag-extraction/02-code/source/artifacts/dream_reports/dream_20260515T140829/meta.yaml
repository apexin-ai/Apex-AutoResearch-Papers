    result_rationale: 'Embedding SCS is a moderate proxy for empirical confusion (ρ=0.35
      for Qwen3, 0.28 for MiniLM). The correlation is significant but far from perfect
      because: (1) embedding similarity captures semantic relatedness, not confusion
      — "person-artist" and "person-athlete" are semantically similar but the model
      may distinguish them well from context, (2) empirical confusion is asymmetric
      (model confuses A→B more than B→A) while cosine similarity is symmetric, (3)
      empirical confusion is heavily influenced by type frequency and context patterns
      not captured by type-name embeddings. Qwen3 embeddings outperform MiniLM (ρ=0.35
      vs 0.28) on Few-NERD because of extraction-model alignment (consistent with
      D010 findings). Top-10 overlap at 50% means half the most-confused empirical
      pairs are also highest-SCS — useful but not sufficient for precision. This validates
      SCS as a reasonable zero-shot proxy while motivating calibration-based approaches
      (SDGD-cal). In median tier, this is adequate evidence for "embedding SCS is
      a useful but imperfect confusability proxy."


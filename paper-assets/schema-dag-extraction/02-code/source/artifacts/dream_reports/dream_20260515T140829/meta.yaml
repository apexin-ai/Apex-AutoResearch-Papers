      dedup: 当同一span被多个batch标注不同type时，选择model confidence最高的。 (2) Type-priority: 根据empirical
      type accuracy排序，优先保留high-accuracy type的标注。

      两种策略都有improvement over v1（+3.4-4.7pp F1）因为减少了部分merge conflict， 但仍远低于single-pass（-14.7到-16.0pp）。根本原因：
      (a) LLM的output confidence（logprob）与correctness的correlation本身就弱（calibration差），
      confidence-based dedup经常选错； (b) Type-priority假设某些type inherently更reliable，但实际上reliability取决于specific

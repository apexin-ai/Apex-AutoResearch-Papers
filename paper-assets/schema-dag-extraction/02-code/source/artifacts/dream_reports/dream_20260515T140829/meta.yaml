  review_report: "---\ndream_id: dream_20260515T140829\ntier: median\noverall_score:\
    \ 3/6 Weak Reject\ntimestamp: 2026-05-15T14:50:50.235921+00:00\n---\n\n# Review\
    \ Report: Multi-Channel Schema Degradation in Training-Free LLM Information Extraction\n\
    \n**Dream ID:** 20260515T140829\n**Review Mode:** Full (2 Reviewers, 4-Step Roundtable)\n\
    **Venue Standard:** Top ML venue (acceptance ~25%, 6-point scale)\n\n---\n\n##\
    \ Paper Summary\n\nThis 9-page paper investigates why training-free LLM information\
    \ extraction degrades on complex schemas. It presents three contributions: (1)\
    \ a multi-channel degradation model where type count drives recall decline and\
    \ pairwise confusability drives type confusion errors, operating additively (ANOVA\
    \ interaction p=0.14); (2) embedding-based Schema Confusability Scores (SCS) as\
    \ a validated proxy for empirical confusion (ρ=0.35, p<10⁻⁴) across three IE tasks\
    \ (Few-NERD, DocRED, MAVEN) and two LLMs (Qwen3-32B, LLaMA-3.3-70B); (3) Schema\
    \ DAG Decomposition (SDGD) consistently fails to outperform single-pass extraction,\
    \ with \"merge amplification\"—compounding deduplication errors during output\
    \ reassembly—identified as the fundamental bottleneck.\n\n---\n\n## R1: Methods\
    \ and Experiments\n\n### Strengths\n\n- **Well-designed controlled experiments.**\
    \ The 2×2 factorial design (count × BCS) with ANOVA is the correct methodology\
    \ for testing channel independence. The count curve experiments across three tasks\
    \ provide systematic evidence. The decomposition comparison (Table 8) covers five\
    \ methods at matched batch count, enabling fair comparison.\n- **Cross-task replication.**\
    \ Testing on Few-NERD (NER, 66 types), DocRED (RE, 96 types), and MAVEN (event\
    \ detection, 168 types) demonstrates the generality of the confusability signal.\
    \ DocRED's weaker signal (r=0.09 vs 0.156) is plausibly attributed to document-level\
    \ noise.\n- **Systematic decomposition ablation.** The progression from SDGD-zero\
    \ → SDGD-cal → SDGD v2 → random batching → per-type splitting systematically isolates\
    \ the contribution of partition quality vs. merge quality. Random batching outperforming\
    \ SDGD-zero (0.315 vs 0.251 F1) is a counterintuitive finding that effectively\
    \ pinpoints merge, not partition, as the bottleneck.\n- **Merge amplification\
    \ quantification.** The 38% merge duplicate rate for per-type splitting, reduced\
    \ to 12% with SDGD v2, provides concrete mechanistic evidence. The recall-precision\
    \ tradeoff pattern (decomposition increases recall but destroys precision) is\
    \ consistent across tasks.\n- **Centrality confound analysis.** Identifying that\
    \ per-type BCS aggregation conflates confusability with type centrality on homogeneous\
    \ schemas (MAVEN) is a genuine methodological insight.\n\n### Weaknesses\n\n-\
    \ **W1 [MAJOR]: Effect sizes are small and inadequately contextualized.** Pairwise\
    \ r=0.156 (Qwen3, Few-NERD) and r=0.08 (LLaMA) explain only 2.4% and 0.6% of confusion\
    \ variance respectively. The abstract and title frame confusability as a primary\
    \ predictor, but 97%+ of confusion variance is unexplained. The paper should report\
    \ r² throughout and discuss what other factors (entity frequency, prompt position,\
    \ type definition quality, hierarchical depth) contribute to confusion.\n- **W2\
    \ [MAJOR]: LLaMA count curve is non-monotonic and undermines Channel 1.** Table\
    \ 10 shows F1 increasing from 0.28 (count=6) to 0.31 (count=12) to 0.35 (count=44)\
    \ before declining. This directly contradicts the \"monotonic count-driven recall\
    \ decline\" narrative. The paper acknowledges the non-monotonicity but does not\
    \ adequately explain it. If LLaMA-70B's higher capacity partially overcomes count\
    \ degradation at intermediate values, this challenges the universality of Channel\
    \ 1.\n- **W3 [MODERATE]: Sample sizes for factorial ANOVA are concerning.** The\
    \ 2×2 design uses n=27 batches per cell (inferred from residual SS). With this\
    \ sample size, the power to detect the interaction effect is low. The paper acknowledges\
    \ underpoweredness (p=0.14) but frames the non-significant interaction as supporting\
    \ channel independence. This is a common statistical error — absence of evidence\
    \ is not evidence of absence.\n- **W4 [MODERATE]: \"Relaxed F1\" for MAVEN is\
    \ undefined.** Table 9 uses \"Relaxed F1\" without definition. Does this allow\
    \ partial span matching? If so, comparison with exact F1 on Few-NERD is problematic.\
    \ Evaluation metrics should be consistent or the difference explicitly discussed.\n\
    - **W5 [MODERATE]: SDGD v2's confidence threshold (0.7) appears arbitrarily chosen.**\
    \ No sensitivity analysis for this hyperparameter is presented. The improvement\
    \ from 38% to 12% merge duplicate rate hinges on this threshold — its selection\
    \ process should be documented.\n- **W6 [MINOR]: Per-type splitting on Few-NERD\
    \ (k=66) is an extreme baseline.** With 66 batches, the latency overhead (33×)\
    \ makes it impractical. The merge duplicate rate (38%) at this granularity may\
    \ not be representative of more moderate decompositions. The paper could benefit\
    \ from a continuous analysis of merge duplicate rate vs. batch count.\n\n### R1\
    \ Scores\n\n| Criterion | Score |\n|-----------|-------|\n| Soundness | 3/6 |\n\
    | Empirical Quality | 3/6 |\n| Reproducibility | 3/6 |\n| Overall | 3/6 |\n| Confidence\
    \ | 4/5 |\n\n---\n\n## R2: Novelty and Related Work\n\n### Strengths\n\n- **The\
    \ two-channel decomposition is a genuine conceptual contribution.** No prior work\
    \ in training-free LLM IE explicitly isolates count-driven recall loss from confusability-driven\
    \ type substitution using controlled experiments. The factorial design with ANOVA\
    \ interaction testing is the correct methodology, and the near-zero interaction\
    \ is informative. This goes beyond \"we ran experiments nobody ran before\" —\
    \ it provides a reusable analytical framework.\n- **Pairwise confusability validation\
    \ across tasks and models is novel.** While LLM-PEE uses embedding similarity\
    \ for partitioning, no prior work empirically validates that embedding similarity\
    \ predicts actual LLM confusion rates at the type-pair level. The cross-task replication\
    \ and cross-model validation strengthen this claim.\n- **Merge amplification as\
    \ a named phenomenon is useful.** Identifying and characterizing the recall-precision\
    \ tradeoff inherent in decomposition approaches, and showing it explains the modest\
    \ gains of UniNER and LLM-PEE, provides actionable diagnostic insight for the\
    \ community.\n- **The analysis-only framing is intellectually honest.** Pivoting\
    \ from \"SDGD is effective\" to \"SDGD reveals merge amplification as fundamental\
    \ bottleneck\" is a more valuable contribution than reporting marginal gains.\n\
    \n### Weaknesses\n\n- **W1 [MAJOR]: Related work is severely inadequate.** The\
    \ paper cites only 2 references. For a top venue submission, this is disqualifying.\
    \ Critical omissions include:\n  - *IEPile* (Chen et al., ACL 2024): Hard-negative\
    \ schema construction using semantically proximate types — directly validates\
    \ confusability difficulty at training time.\n  - *GoLLIE* (Sainz et al., ICLR\
    \ 2024): Code-style schema definitions for zero-shot IE — alternative approach\
    \ to schema representation.\n  - *GLiNER* (Zaratiana et al., NAACL 2024): Bidirectional\
    \ zero-shot NER that avoids schema complexity via parallel extraction.\n  - *CrossAgentIE*\
    \ (Lu et al., ACL 2025 Findings): Multi-agent type confusion resolution — most\
    \ relevant concurrent work on type confusion in zero-shot IE.\n  - *InstructUIE*\
    \ (Wang et al., 2023): Schema-aware instruction tuning baseline.\n  - *LLM-PEE*:\
    \ Discussed but never compared experimentally — this is the most direct competitor.\n\
    \  - *KGGen* (Mo et al., NeurIPS 2025): Two-stage decomposition with deduplication\
    \ — directly relevant to merge amplification discussion.\n  - *Representation\
    \ degeneration literature* (Gao et al. ICLR 2019, Ethayarajh EMNLP 2019): Theoretical\
    \ foundation for the centrality confound finding.\n  - *LLM4IE Survey* (Xu et\
    \ al., 2024): Comprehensive survey for positioning.\n\n  A minimum of 20-25 references\
    \ is expected for proper positioning.\n\n- **W2 [MAJOR]: \"First controlled study\"\
    \ claim is overstated.** The observation that more classes hurt recall is well-established\
    \ in multi-label classification. The observation that semantically similar labels\
    \ cause confusion is the premise behind IEPile's hard-negative training and CrossAgentIE's\
    \ debate mechanism. What is genuinely novel is the controlled factorial isolation\
    \ in training-free LLM IE with in-prompt schema presentation. The claim should\
    \ be narrowed to this specific setting.\n- **W3 [MAJOR]: No head-to-head comparison\
    \ with LLM-PEE.** LLM-PEE performs embedding-similarity-based type partitioning\
    \ for LLM-based event extraction. Without a direct comparison on the same datasets,\
    \ it is impossible to assess SDGD's marginal contribution. This is the single\
    \ most important missing baseline.\n- **W4 [MODERATE]: Missing engagement with\
    \ adjacent literatures.** The paper does not discuss connections to:\n  - Multi-task\
    \ learning (count channel as task interference)\n  - Hierarchical classification\
    \ (Few-NERD's hierarchy as confound)\n  - Constrained decoding (alternative to\
    \ decomposition for type confusion)\n  - Curriculum learning / prompt ordering\
    \ effects\n- **W5 [MODERATE]: \"Training-free\" framing limits significance.**\
    \ The paper does not engage with why one would use a training-free approach achieving\
    \ F1=0.445 when fine-tuned alternatives achieve 0.6-0.7+. The deployment scenarios\
    \ are mentioned but not developed.\n- **W6 [MINOR]: Embedding sensitivity undermines\
    \ \"zero-cost\" claim.** Qwen3 works on Few-NERD but not MAVEN; MiniLM works on\
    \ MAVEN but not Few-NERD. This means practitioners need dataset-specific embedding\
    \ selection, making SDGD-zero not truly zero-cost.\n\n### R2 Scores\n\n| Criterion\
    \ | Score |\n|-----------|-------|\n| Novelty | 3/6 |\n| Related Work Coverage\
    \ | 2/6 |\n| Significance | 3/6 |\n| Overall | 3/6 |\n| Confidence | 4/5 |\n\n\
    ---\n\n## Roundtable Synthesis\n\n### Step 2: Cross-Sharing Summary\n\nR1's experimental\
    \ concerns (small effect sizes, LLaMA non-monotonicity, sample size limitations)\
    \ and R2's positioning concerns (inadequate references, overstated claims, missing\
    \ LLM-PEE comparison) are complementary and mutually reinforcing. Both reviewers\
    \ independently identified the small effect size issue as a major concern.\n\n\
    ### Step 3: Convergence\n\n**Points of agreement (high confidence):**\n1. The\
    \ two-channel degradation framework (count → recall, confusability → type confusion)\
    \ is a genuine analytical contribution. (Both R1, R2)\n2. The merge amplification\
    \ finding is informative and practically useful as a warning against naive decomposition.\
    \ (Both R1, R2)\n3. Related work is severely inadequate — 2 references is far\
    \ below venue standards. (R2 primary, R1 concurs)\n4. Effect sizes (r=0.08–0.156,\
    \ explaining 0.6–2.4% of variance) are overstated in the framing. (Both R1, R2)\n\
    5. The LLaMA non-monotonic count curve weakens the Channel 1 universality claim.\
    \ (R1 primary, R2 concurs)\n6. Missing LLM-PEE baseline is a significant gap.\
    \ (R2 primary, R1 concurs)\n\n**Points of mild disagreement:**\n- R2 is slightly\
    \ more positive on the analysis-only framing (views it as intellectually honest),\
    \ while R1 is concerned about whether the analysis depth is sufficient for a top\
    \ venue. Resolution: both agree it could work IF the related work and statistical\
    \ presentation are strengthened.\n\n### Step 4: Consolidated Assessment\n\n**Overall\
    \ Score: 3/6 (Weak Reject)**\n\n**Recommendation:** The paper presents a useful\
    \ analytical framework for understanding schema complexity in training-free LLM\
    \ IE. The two-channel model, pairwise confusability validation, and merge amplification\
    \ diagnosis are real contributions. However, the paper is not ready for a top\
    \ venue in its current form due to three critical gaps:\n\n1. **Related work is\
    \ disqualifying** (2 references; needs 20+). The paper cannot claim novelty without\
    \ properly positioning against IEPile, GoLLIE, GLiNER, CrossAgentIE, InstructUIE,\
    \ LLM-PEE, and the broader label confusion / representation degeneration literature.\n\

    matrix is more accurate than embedding cosine similarity — rank corr ≈0.38 vs
    perfect). SDGD-cal creates better batch partitions than SDGD-zero: fewer high-confusion
    pairs co-batched. This yields +5pp F1 over SDGD-zero (better precision from fewer
    intra-batch confusions). However, SDGD-cal still loses to single-pass by 14.5pp
    because merge amplification is independent of batch quality — it occurs at the
    merge step regardless of how well-separated the batches are. Recall still higher
    than single-pass (0.40 vs 0.37) confirming decomposition''s recall benefit, but
    precision gap (0.24 vs 0.56) dominates. The calibration cost is minimal (8 API

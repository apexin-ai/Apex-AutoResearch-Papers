    decomposition modes F1 < single-pass. The effect is even more pronounced on MAVEN
    because: (1) 168 types means more batches (12 vs 8), amplifying merge conflicts,
    (2) event detection triggers are shorter spans (often single words) making merge
    deduplication harder — same trigger word extracted as different event types across
    batches, (3) MAVEN''s semantically homogeneous type space means SDGD-zero''s embedding-based
    separation is less effective (types that look dissimilar in embedding space may
    still be confused by the LLM due to context overlap). Random batching performs
    similarly to SDGD-zero (gap narrows from Few-NERD) because in a homogeneous schema,
    there''s no "good" partition — all batches have similar internal confusability.

tier: median
narrative_guidance: 'Paper pivots to analysis-only framing. Claim 3 downgrades from
  "SDGD is effective" to "SDGD reveals merge amplification as a fundamental bottleneck
  in decomposition-based IE." Three contributions: (1) first controlled multi-channel
  degradation study cross-task, (2) pairwise confusability as robust signal + centrality
  confound analysis, (3) merge amplification as previously uncharacterized failure
  mode explaining why UniNER/LLM-PEE gains are modest. LLaMA evidence softened to
  "consistent direction across models, strongest on primary model." EMNLP Main viable;
  Findings likely if reviewers demand stronger multi-model or positive SDGD.

  '
imagined_experiments:
- name: DocRED Confusability Study
  plan_id: exp-005
  description: Count curve + BCS correlation on DocRED (96 relation types). Scaling
    stress test for document-level RE.
  expected_results:
    count_1_acc: 0.52
    count_4_acc: 0.48
    count_8_acc: 0.41
    count_16_acc: 0.34
    count_32_acc: 0.28
    count_64_acc: 0.22
    count_96_acc: 0.18
    bcs_effect_count_8_delta_pp: -14.5
    bcs_effect_count_16_delta_pp: -18.3
    pairwise_r: 0.09
    pairwise_p: 0.003
    per_type_spearman_rho: -0.15
    per_type_p: 0.11
  result_rationale: 'DocRED is document-level RE with multi-hop reasoning, inherently
    harder than FewRel sentence-level. Baseline accuracy lower (~52% at count_1 vs
    FewRel''s 86%) because document-level context window is larger and entity pair
    identification adds complexity. Count degradation steeper in absolute terms (52%→18%)
    because 96 relation types create a denser confusability space than 16-rel FewRel,
    and document-level prompts consume more context budget. BCS effect present (-14
    to -18pp) but noisier than FewRel because document-level errors conflate relation
    confusion with entity pair misidentification. Pairwise r≈0.09 is weaker than Few-NERD
    (0.156) due to document-level noise floor — many errors stem from entity linking
    failures rather than pure type confusion. Per-type signal directional but not
    significant (p=0.11) because DocRED has fewer high-frequency relation types (many
    long-tail types with <5 instances in test set).

    '

- name: Interaction Effect 2x2
  plan_id: exp-006
  description: '{low count, high count} × {low BCS, high BCS} factorial on Few-NERD.
    Tests additive vs multiplicative interaction.'
  expected_results:
    low_count_low_bcs_f1: 0.38
    low_count_high_bcs_f1: 0.31
    high_count_low_bcs_f1: 0.32
    high_count_high_bcs_f1: 0.21
    count_main_effect_f1: -0.08
    bcs_main_effect_f1: -0.09
    interaction_term_f1: -0.02
    interaction_p: 0.14
    model: two-way ANOVA
  result_rationale: 'In median tier, count and BCS degrade F1 through partially independent
    channels (recall vs type confusion), so main effects are both significant. The
    interaction term is negative (super-additive: high count + high BCS is worse than
    sum of individual effects) but NOT significant at p<0.05 because: (a) n=27 batches
    per cell is underpowered for detecting interaction, (b) the interaction is modest
    (-2pp) relative to noise in batch-level metrics. This is actually fine for the
    paper — additive model is simpler to present and the slight super-additivity is
    mentioned as a trend. The 2x2 table still provides clean visual evidence that
    both channels operate independently.


    confidence_threshold: 0.7
  result_rationale: 'SDGD v2 partially mitigates merge amplification through confidence-based
    deduplication and span-level voting across batches. Merge duplicate rate drops
    from 38% to 12%. Precision recovers substantially (0.44 vs SDGD-zero''s 0.21)
    but still below single-pass (0.56) because: (1) confidence calibration is imperfect
    — the model''s confidence doesn''t reliably distinguish correct from incorrect
    type assignments, (2) some legitimate multi-type spans get suppressed by dedup,
    reducing recall slightly, (3) without explicit negative examples per batch, the
    model still over-extracts for the types it sees. Net F1 is 0.42, within -2.5pp
    of single-pass — a massive improvement over SDGD-zero but not a clear win. In
    median tier, this is "marginal or negative" — the delta is within noise for a
    method that costs 5x more API calls. Paper frames as: "merge mitigation partially
    recovers decomposition benefit but does not achieve the positive result needed
    to claim SDGD as a practical method."


- name: 'Ablation: Random Batching'
  plan_id: exp-013
  description: Random batching with same k as SDGD. Isolates confusability-aware grouping
    from batch count reduction.
  expected_results:
    random_k8_f1: 0.315
    random_k8_precision: 0.245
    random_k8_recall: 0.44
    random_k8_std_f1: 0.025
    sdgd_zero_k8_f1: 0.251
    single_pass_f1: 0.445
    random_vs_sdgd_delta: 0.064
    random_vs_single_delta: -0.13
    n_random_seeds: 10
    random_seed_f1_range:
    - 0.28
    - 0.35
  result_rationale: 'Random batching at k=8 outperforms SDGD-zero (+6.4pp F1), replicating
    exp-008''s finding. This occurs because SDGD-zero''s confusability-minimizing
    partition concentrates semantically distant types together — these types often
    span different domains (e.g., person subtypes + location subtypes), and the model
    performs worse when batch types are too heterogeneous (loses cross-type contextual
    priming). Random batches accidentally achieve better balance between similarity
    separation and contextual coherence. However, random batching still loses to single-pass
    by 13pp because merge amplification affects all decomposition equally. The 10-seed
    variance (σ=0.025) shows random batching is moderately stable. In median tier,
    this ablation is the key evidence that batch composition quality is NOT the bottleneck

    confusability) and maximizes recall (0.586 vs single-pass 0.368, +21.8pp). But
    precision collapses (0.194 vs 0.563, -36.9pp) because: (1) each batch extracts
    aggressively for its one type — without competing types, the model over-predicts,
    (2) merging 66 batch outputs creates massive duplication — the same span extracted
    as different types in different batches, (3) merge heuristics (longest match,
    confidence-based) cannot reliably disambiguate since each batch''s prediction
    is locally confident. The 38% merge duplicate rate quantifies this directly. Per-type
    is the theoretical upper bound for recall under decomposition but the worst-case
    for precision. The 33x latency overhead (2532s vs 77s) makes it impractical regardless.
    This is already in exp-008 metrics; exp-014 adds systematic analysis of WHY precision
    drops (merge duplication rate, over-prediction per batch).


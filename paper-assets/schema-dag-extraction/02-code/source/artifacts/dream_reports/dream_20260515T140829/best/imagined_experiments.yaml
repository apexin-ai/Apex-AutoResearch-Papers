- name: Random Batching Ablation (Same k as SDGD)
  plan_id: exp-013
  description: 'SDGD v2 vs random batching v2 (same batch count k=8) on Few-NERD.
    Both use merge-dedup. Isolates confusability-aware grouping from batch count reduction.

    '
  expected_results:
    sdgd_v2:
      f1: 0.48
      precision: 0.538
      recall: 0.433
      batches: 8
      time_s: 395
      std_across_5_seeds: 0.008
    random_v2:
      f1: 0.458
      precision: 0.521
      recall: 0.411
      batches: 8
      time_s: 410
      std_across_5_seeds: 0.015
    single_pass:
      f1: 0.445
      precision: 0.563
      recall: 0.368
    deltas:
      sdgd_v2_vs_random_v2_pp: '+2.2'
      random_v2_vs_single_pass_pp: '+1.3'
      sdgd_v2_vs_single_pass_pp: '+3.5'
    decomposition_attribution:
      batch_reduction_contribution_pp: 1.3
      confusability_aware_grouping_pp: 2.2
      total_sdgd_gain_pp: 3.5
      pct_from_grouping: 62.9
  result_rationale: 'Merge-dedup resolves the core precision problem for ALL decomposition
    strategies, so both random and SDGD benefit equally from dedup. The remaining
    difference (2.2pp) isolates the value of confusability-aware batch composition.
    Random batching gets 1.3pp from batch reduction alone (smaller batches → better
    per-entity attention → higher recall, with dedup controlling precision). SDGD
    adds 2.2pp by ensuring confusable type pairs are separated, reducing within-batch
    type confusion. The 62.9% attribution to grouping (vs 37.1% to batch reduction)
    quantifies SDGD''s specific contribution. SDGD also shows lower variance (σ=0.008
    vs 0.015) because its batch composition is deterministic and optimized, while
    random batching quality fluctuates depending on which confusable types happen
    to co-occur. The lower variance is practically important — SDGD gives predictable
    quality.

    '
  tables:

  analysis: 'Validates SDGD-zero as a practical no-calibration method while explaining
    why SDGD-cal improves: the ρ=0.43 ceiling for embedding-based proxy means ~18%
    of variance in confusion is captured, leaving room for empirical calibration.
    The cross-embedding pattern provides practical guidance: use extraction-model

      sdgd_v2_latency_pct_of_per_type: 15.9
      sdgd_v2_api_call_pct_of_per_type: 12.1
    per_type_vs_sdgd_delta_pp: '+1.2'
    residual_confusion_analysis:
      sdgd_residual_confusion_pairs: 23
      mean_scs_of_residual: 0.612
      max_scs_of_residual: 0.743
  result_rationale: 'Per-type splitting eliminates within-batch type confusion entirely
    — with one type per batch, there is no co-present type to confuse with. Merge-dedup
    handles cross-batch deduplication. The resulting F1 (0.492) is the theoretical
    ceiling for decomposition-based approaches. SDGD v2 achieves 97.6% of this ceiling
    at 15.9% of the latency because graph coloring concentrates separation effort
    on the most confusable pairs (SCS > 0.8), while allowing low-similarity types
    to share batches safely. The residual 1.2pp gap comes from 23 moderately confusable
    pairs (mean SCS=0.612) that SDGD groups together to keep k=8. These pairs cause
    occasional type confusion that per-type avoids entirely. The tradeoff is clear:
    1.2pp F1 costs 6.3x latency and 8.25x API calls. For production deployment, SDGD
    v2 dominates per-type splitting on cost-effectiveness. For offline analysis where
    latency is irrelevant, per-type v2 provides the best quality.

    '

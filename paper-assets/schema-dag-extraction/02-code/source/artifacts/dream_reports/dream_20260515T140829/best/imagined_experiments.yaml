    and confusability-grouping (63%)'
  - 'Box plot: 5-seed F1 distributions for random v2 vs SDGD v2, showing SDGD''s tighter
    spread'
  analysis: 'This ablation is essential for Claim 3: it proves SDGD''s value is primarily
    from confusability-aware grouping (63%), not mere batch reduction. Without this
    ablation, a reviewer could argue that any decomposition strategy would work equally
    well. The 2.2pp gap, combined with SDGD''s lower variance, makes a clean case
    for principled decomposition.

    '
- name: Per-Type Splitting Ablation (UniNER-style)
  plan_id: exp-014
  description: 'Per-type splitting v2 (1 type per batch, k=66) on Few-NERD with merge-dedup.
    Upper bound on decomposition benefit. Quality-latency tradeoff vs SDGD v2.


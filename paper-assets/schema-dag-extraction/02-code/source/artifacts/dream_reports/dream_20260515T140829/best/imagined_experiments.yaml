- name: 2×2 Interaction Effect (Count × Confusability)
  plan_id: exp-006
  description: 'Factorial design: {low_count=6, high_count=22} × {low_BCS, high_BCS}
    on Few-NERD. Tests whether count and confusability contribute additively or interact.

    '
  expected_results:
    cell_means:
      low_count_low_bcs_f1: 0.372
      low_count_high_bcs_f1: 0.288
      high_count_low_bcs_f1: 0.318
      high_count_high_bcs_f1: 0.228
    main_effects:
      count_effect_pp: -5.7
      bcs_effect_pp: -8.7
      combined_observed_pp: -14.4
      sum_of_individual_pp: -14.4
    anova:
      count_F: 8.42
      count_p: 0.006
      bcs_F: 14.73
      bcs_p: 0.001
      interaction_F: 0.31
      interaction_p: 0.42
      model_R2: 0.74
    error_channel_decomposition:
      low_count_low_bcs_recall: 0.482
      low_count_high_bcs_recall: 0.464
      high_count_low_bcs_recall: 0.385
      high_count_high_bcs_recall: 0.362
      recall_delta_by_count: -0.099
      recall_delta_by_bcs: -0.021
      low_count_low_bcs_confusion_rate: 0.008
      low_count_high_bcs_confusion_rate: 0.042
      high_count_low_bcs_confusion_rate: 0.012
      high_count_high_bcs_confusion_rate: 0.048
      confusion_delta_by_count: 0.005
      confusion_delta_by_bcs: 0.035
  result_rationale: 'The orthogonal channel model predicts additive effects because
    count and confusability degrade extraction at different processing stages. Count→recall
    operates at the entity detection stage: more types in the prompt dilute attention,
    causing entities to be missed entirely. The recall penalty (~10pp from count=6
    to count=22) is nearly constant across BCS levels because attention dilution depends
    on prompt length, not type similarity. Confusability→type confusion operates at
    the type assignment stage: semantically similar co-present types interfere during
    label selection. The confusion rate penalty (~3.5x from low to high BCS) is nearly
    constant across count levels because type interference depends on pairwise similarity,
    not total count. The non-significant interaction (F=0.31, p=0.42) confirms these
    are independent channels. The combined penalty (14.4pp) equals the sum of individual
    penalties (5.7+8.7=14.4), ruling out multiplicative interaction. R²=0.74 indicates
    the two-factor additive model explains most of the variance in extraction quality.

    '
  tables:
  - name: 2×2 Factorial Results (F1)
    columns:
    - ''
    - low_BCS
    - high_BCS
    - BCS_effect
    rows:

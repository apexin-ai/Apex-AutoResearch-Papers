- name: SDGD-cal on Few-NERD (Empirical Calibration)
  plan_id: exp-010
  description: 'SDGD-cal v2: confusability graph from 5-10 calibration examples (empirical
    confusion matrix) instead of embedding SCS. Compare vs SDGD-zero v2 and single-pass
    on Few-NERD.

    '
  expected_results:
    sdgd_cal_v2:
      f1: 0.493
      precision: 0.548
      recall: 0.449
      batches: 8
      time_s: 405
      calibration_calls: 660
      calibration_time_s: 320
    sdgd_zero_v2:
      f1: 0.48
      precision: 0.538
      recall: 0.433
    single_pass:
      f1: 0.445
      precision: 0.563
      recall: 0.368
    deltas:
      sdgd_cal_vs_zero_pp: '+1.3'
      sdgd_cal_vs_single_pass_pp: '+4.8'
    calibration_vs_embedding:
      spearman_rho_scs_vs_empirical: 0.42
      kendall_tau_scs_vs_empirical: 0.3
      n_pair_rank_disagreements_top50: 11
  result_rationale: 'Empirical calibration measures actual model confusion on held-out
    examples, capturing model-specific biases that embedding SCS approximates but
    cannot fully predict. For example, Qwen3 may confuse "building-library" ↔ "building-other"
    more than their embedding similarity suggests (due to prompt formatting or training
    distribution), and conversely may handle "person-politician" ↔ "person-scholar"
    better than expected. These rank disagreements (11/50 in top-50 pairs) are enough
    to reshuffle the confusability graph and produce marginally better batch assignments.
    The +1.3pp gain over SDGD-zero is modest because (a) the embedding proxy is already
    ρ=0.42 correlated with empirical confusion, capturing the dominant similarity
    axis, and (b) Few-NERD''s cross-domain schema has clear cluster boundaries that
    both methods identify. The calibration overhead (660 API calls, ~5min) is acceptable
    for offline schema decomposition planning. The main value of SDGD-cal is that
    it bypasses embedding choice entirely — critical for practitioners who cannot
    determine which embedding best suits their schema a priori.

    '

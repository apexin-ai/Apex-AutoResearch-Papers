- name: SDGD v2 on MAVEN (168 event types)
  plan_id: exp-009
  description: 'SDGD v2 (with merge-dedup) on MAVEN Event Detection. 168 event types
    partitioned into low-confusability batches via graph coloring. Compare vs single-pass,
    random batching v2, and per-type splitting v2.

    '
  expected_results:
    single_pass:
      relaxed_f1: 0.247
      exact_f1: 0.018
      precision_relaxed: 0.268
      recall_relaxed: 0.229
      batches: 1
      time_s: 82
    sdgd_v2:
      relaxed_f1: 0.282
      exact_f1: 0.028
      precision_relaxed: 0.258
      recall_relaxed: 0.312
      batches: 12
      time_s: 485
      f1_delta_vs_single_pass_pp: '+3.5'
      precision_drop_vs_single_pass_pp: '-1.0'
    random_v2:
      relaxed_f1: 0.265
      exact_f1: 0.022
      precision_relaxed: 0.251
      recall_relaxed: 0.281
      batches: 12
      time_s: 510
    per_type_v2:
      relaxed_f1: 0.291
      exact_f1: 0.031
      precision_relaxed: 0.261
      recall_relaxed: 0.329
      batches: 168
      time_s: 6250
  result_rationale: 'MAVEN''s 168 event types create a dense confusability graph with
    many FrameNet-sibling clusters (e.g., "Attack" vs "Catastrophe" vs "Destroying").
    SDGD v2''s graph coloring separates these siblings across batches, reducing within-batch
    type confusion. The merge-dedup strategy is critical: SDGD-zero failed because
    multi-batch merging without dedup amplified false positives. Merge-dedup resolves
    this by (a) deduplicating overlapping trigger predictions across batches using
    span matching, and (b) selecting the highest-confidence prediction when conflicts
    arise. The +3.5pp relaxed F1 gain reflects genuine confusion reduction. The precision
    drop (-1.0pp) is within the ≤5pp budget because merge-dedup catches most spurious
    duplicates. The gain is larger than on Few-NERD (+3.5pp vs +3.5pp relaxed) in
    absolute terms because MAVEN''s 168 types provide more room for decomposition:
    more confusable pairs to separate, and the single-pass baseline is more degraded.
    Random batching v2 captures partial benefit (batch reduction + dedup) but misses
    confusability-aware separation.

    '

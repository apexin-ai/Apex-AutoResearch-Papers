      - 0.18
    - - BCS
      - 14.73
      - 0.001
      - 0.32
    - - count×BCS
      - 0.31
      - 0.42
      - 0.01
  figures_description:
  - 'Interaction plot: two nearly parallel lines (low-BCS, high-BCS) across count
    levels → additivity'
  - 'Error channel decomposition: recall bars decline with count (left panel), confusion
    rate bars increase with BCS (right panel)'
  analysis: 'Non-significant interaction is the key result — directly validates the
    orthogonal channel model central to Claim 2. The error decomposition shows clean
    separation: count primarily drives recall loss (9.9pp vs 2.1pp BCS effect on recall),
    while BCS primarily drives type confusion (3.5x vs 1.4x count effect on confusion
    rate). This mechanistic dissociation is the strongest evidence for the multi-channel
    degradation thesis.

    '

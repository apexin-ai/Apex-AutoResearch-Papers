      top10_overlap: 7
    maven_minilm:
      spearman_rho: 0.38
      kendall_tau: 0.27
      n_pairs_with_confusion: 1842
      top10_overlap: 6
    maven_qwen3:
      spearman_rho: 0.15
      kendall_tau: 0.11
      n_pairs_with_confusion: 1842
      top10_overlap: 2
    fewnerd_minilm:
      spearman_rho: 0.22
      kendall_tau: 0.16
      n_pairs_with_confusion: 287
      top10_overlap: 4
    cross_validation:
      best_embedding_per_dataset:
        fewnerd: Qwen3 (ρ=0.43)
        maven: MiniLM (ρ=0.38)
      pattern: extraction-model embeddings excel on cross-domain schemas; generic
        embeddings excel on homogeneous schemas
  result_rationale: 'The SCS-confusion correlation (ρ=0.38-0.43 for best embedding
    per dataset) validates the embedding proxy as a reasonable but imperfect predictor
    of actual model confusion. The imperfection is expected: embedding SCS captures
    semantic similarity (the dominant confusion axis) but not model-specific factors
    like tokenization artifacts, prompt position effects, or label frequency biases.
    The 2×2 pattern (Qwen3 better for Few-NERD, MiniLM better for MAVEN) replicates
    the D010 finding at the validated pairwise level. For Few-NERD''s cross-domain
    schema, Qwen3 embeddings align with the extraction model''s internal representations,
    capturing model-specific confusability. For MAVEN''s homogeneous FrameNet schema,
    Qwen3 compresses within-domain distinctions while MiniLM''s generic sentence embedding
    preserves them. The top-10 overlap (6-7/10) shows that both best-embedding conditions
    identify the most confusable pairs with reasonable fidelity, validating SDGD-zero''s
    practical utility. The gap between ρ=0.43 and a hypothetical perfect proxy (ρ=1.0)
    explains SDGD-cal''s incremental gain.

    '

tier: best
narrative_guidance: 'Original 3-claim framing intact. LLaMA cross-model validation
  confirms pairwise confusability as generalizable signal (r≥0.10, p<0.01). SDGD v2
  with merge-dedup resolves SDGD-zero''s precision collapse, achieving F1 gains over
  single-pass on both Few-NERD and MAVEN. Centrality confound analysis elevates from
  limitation to methodological contribution. Headline: pairwise confusability is a
  generalizable, actionable signal for LLM IE schema design, operationalized via SDGD
  v2 with positive empirical results across three tasks and two models.

  '
imagined_experiments:
- name: DocRED Cross-Task Replication (96 relations)
  plan_id: exp-005
  description: 'Count curve + within-count BCS correlation on DocRED document-level
    RE (96 relation types). Scaling stress test beyond sentence-level FewRel.

    '
  expected_results:
    count_curve:
      count_1_acc: 0.782
      count_4_acc: 0.753
      count_8_acc: 0.684
      count_16_acc: 0.591
      count_32_acc: 0.502
      count_64_acc: 0.421
      count_96_acc: 0.358
      degradation_total_pp: -42.4
    bcs_controlled:
      count_8_low_bcs_acc: 0.745
      count_8_high_bcs_acc: 0.462
      count_8_delta_pp: -28.3
      count_16_low_bcs_acc: 0.718
      count_16_high_bcs_acc: 0.431
      count_16_delta_pp: -28.7
    pairwise:
      n_pairs: 4560
      pearson_r: 0.131
      pearson_p: 3.8e-09
    vs_fewrel_80rel:
      degradation_pp: -42.4 vs -35.3
      bcs_effect_pp: -28.5 vs -31.2
      amplification_vs_16rel: ~4.1x
  result_rationale: 'Document-level RE introduces cross-sentence reasoning and coreference
    complexity, lowering baseline accuracy (~78% vs FewRel''s 86%). But the confusability
    mechanism operates at the type-assignment stage regardless of extraction granularity.
    DocRED''s 96 relation types include many fine-grained distinctions ("place of
    birth" vs "place of death", "member of" vs "part of") creating dense high-confusability
    clusters. The total degradation (42.4pp) exceeds FewRel''s 35.3pp because the
    document-level context amplifies attention dilution (Channel 1) while the denser
    relation taxonomy amplifies type confusion (Channel 2). The BCS effect (-28.5pp)
    is comparable to FewRel because confusability operates at the same mechanism;
    the slight reduction reflects the fact that some DocRED confusion is driven by
    discourse structure rather than type semantics alone. Pairwise r=0.131 replicates
    the range seen on Few-NERD (0.156) and MAVEN-MiniLM (0.120), confirming the signal

  analysis: 'Error taxonomy 提供了 multi-channel 模型的 mechanistic smoking gun。TypeSub
    ≥60% 在 high-BCS 区间 (实际 68%) 和 FalseNeg ≥50% 在 low-BCS 区间 (实际 62%) 均满足 best-tier
    门槛。这证明 BCS 不仅在统计上与 F1 相关，而且通过可解释的机制起作用： 语义相似类型导致 type confusion (Channel 2)，语义分离类型的

  result_rationale: 'Embedding SCS 基于 type label 的语义 embedding 距离，与 empirical confusion
    的 相关性取决于：(1) type confusion 是否主要由 label 语义相似性驱动 (是的，exp-002 已证明)，(2) embedding
    空间是否准确反映 LLM 的内部 type representation (大体是， 因为都基于 transformer language model)。Spearman
    ρ=0.52 (Few-NERD) / 0.48 (MAVEN) 表示中等到强的 rank agreement。非 perfect (ρ<1) 的原因：(a)
    某些 confusion 由 context 和 surface form 驱动而非 label semantics (如 person-other 和 person-artist
    的 confusion 因为实际文本中 artist 常出现在 generic person context)； (b) embedding distance
    是对称的但 confusion 可能不对称 (A→B confusion ≠ B→A)。 Top-20 overlap 75% 说明 embedding proxy
    捕获了大部分 critical confusion pairs。 14 个 false negative pairs (SCS 低但实际常混淆) 正好是 SDGD-cal
    能额外捕获的， 解释了 SDGD-cal 比 SDGD-zero 提升 1.5pp 的来源。Threshold sensitivity ±0.1 导致 <1pp
    F1 change 说明 SDGD 对 τ 选择 robust。

    '

      false_negative: 0.15
      hallucination: 0.12
      n_errors: 156
    high_bcs_type_sub_pct: 0.68
    low_bcs_false_neg_pct: 0.62
    type_sub_monotonic_with_bcs: true
    false_neg_monotonic_inverse_bcs: true
    chi_square_independence: 142.3
    chi_square_p: 2.1e-24
  result_rationale: '在 best tier 下，error taxonomy 干净分离是 multi-channel 模型最强的 mechanistic
    证据。High-BCS batches (0.8-1.0) 中 type_substitution 占 68%：当 batch 内包含语义 高度相似的类型
    (如 person-other 和 person-politician)，模型正确识别 entity span 但在 type assignment 阶段发生
    interference，将正确 span 标注为语义邻近的错误类型。 Low-BCS batches (0-0.2) 中 false_negative 占
    62%：当类型语义分离度高，模型不会 混淆类型，但由于 attention 需覆盖多种不同类型的 pattern，部分 entity 被完全遗漏 (capacity
    bottleneck)。Type_substitution 从 8% 到 68% 的单调递增、false_negative 从 62% 到 15% 的单调递减，形成完美的
    crossover pattern。Hallucination 比例 (12-20%) 与 BCS 无关，说明幻觉是模型固有特性而非 schema-driven

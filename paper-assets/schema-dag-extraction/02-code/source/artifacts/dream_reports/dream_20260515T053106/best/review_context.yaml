  analysis: SCS embedding proxy 在 ρ=0.48-0.52 水平有效，对 SDGD-zero 的实际性能足够。 Threshold
    sensitivity 分析显示 τ 在 [0.3, 0.6] 区间内 F1 变化 <1pp，使 SDGD-zero 成为 truly zero-shot
    method (无需 calibration 即可 deploy)。 False negative analysis 为 SDGD-cal 的额外价值提供了解释：calibration
    发现 了 14 个 SCS 遗漏的 confusion pairs，将它们分到不同 batch 后 F1 额外提升 1.5pp。

narrative_guidance: '原始 framing 完全成立。三层证据 (pairwise / per-type / mechanistic) 在 Few-NERD
  + MAVEN 两个数据集、Qwen3-32B + LLaMA-3.3-70B 两个模型上全部通过显著性门槛。Confusability 独立于 type count
  预测 F1 退化 (partial r≥0.25, p<0.01)，error taxonomy 干净分离两条 channel， SDGD 在两个数据集上均带来
  6-8 F1 点增益，匹配 per-type splitting 质量但仅需 20-25% 的 API 开销。Headline: "BCS independently
  predicts F1 degradation (partial r=0.32, p=0.002 on Few-NERD; pairwise r=0.19, p<1e-9
  on MAVEN), with 10-28x type confusion ratio in extreme batches; SDGD improves F1
  by 7.6 points on Few-NERD and 6.0 points on MAVEN over single-pass, matching per-type
  quality at 22% latency cost." 三条 claim 各有 ≥2 数据集 + ≥2 模型证据支撑，DocRED 提供第三任务 (RE)
  泛化。 冲 EMNLP 2026 main。

  '

    result_rationale: 'Count 主效应显著 (F=8.2, p=0.006)：count_6 vs count_22 的 F1 差异 (~2.7
      points) 主要由 recall 驱动 (0.431→0.272, Δ=-0.160)，确认 Channel 1 (count→recall) 机制。
      BCS 主效应显著 (F=5.1, p=0.028)：low vs high BCS 的 F1 差异 (~6.5 points) 同时影响 recall
      和 precision，但 precision 效应更大 (Δ=-0.081)，因为 type confusion 直接导致 precision 下降。
      Interaction 不显著 (F=2.3, p=0.135)：additive 预测 (0.250) 与实际 (0.245) 仅差 0.5 point，
      slight super-additivity 因统计功效不足 (n=12/cell) 未达显著。机制解释：count 和 BCS 共享 下游 working
      memory 资源——当 count 已高时，BCS 的额外负担略微放大，但两个通道的主要机制 (attention allocation vs type
      discrimination) 仍大致独立。此结果支持 "approximately orthogonal" 但须将 "orthogonal channels"
      措辞软化为 "largely additive with marginal interaction"。


    ## Meta-Review and Consolidated Assessment


    ### Overall Score: 3/6 (Borderline Reject)


    ### Recommendation: Reject for main conference; suitable for **Findings** with
    revisions


    ### Justification


    The paper addresses a valid and practically important question: what drives schema-complexity
    degradation in training-free LLM IE? The experimental design (factorial, pairwise,
    count curves) is well-conceived, and the frequency-confusability confound discovery
    is a genuine methodological contribution with lasting value.


    However, the paper''s central negative claim — that confusability does not independently
    predict degradation — is **overclaimed relative to the evidence**. The claim is
    grounded in a single weak proxy (all-MiniLM-L6-v2 name embeddings, AUC=0.56),
    and the paper''s own data contains a significant positive signal (Qwen3 pairwise
    r=0.156, p<1e-11) that contradicts the headline framing. The SDGD null result
    follows naturally from the near-random proxy and does not establish that confusability-aware
    decomposition is inherently useless. The non-replication on LLaMA lacks formal
    statistical comparison. Only 2 models and a severely underpowered third dataset
    (DocRED) limit generality.


    The paper would be substantially strengthened by: (1) testing at least one alternative
    confusability proxy, (2) running an oracle SDGD ablation, (3) formally testing
    the cross-model correlation difference, (4) expanding related work, and (5) fixing
    all broken citations.


    As a Findings paper, the count→recall characterization, frequency-confusability
    confound identification, and the methodological prescription (pairwise > batch-level)
    would provide adequate contribution. The negative result on SCS should be scoped
    precisely as "all-MiniLM-L6-v2 name embeddings are a poor confusability proxy"
    rather than "confusability is not a real factor."


    ### Actionable Revision Priorities


    1. **(Critical)** Fix all broken citations

    2. **(Critical)** Test ≥1 alternative confusability proxy; scope negative claims
    accordingly

    3. **(High)** Add oracle SDGD ablation with empirical confusion matrix

    4. **(High)** Expand related work to ≥1 page; include LLM-PEE, GoLLIE, GLiNER,
    CrossAgentIE

    5. **(High)** Add Fisher''s z-test for cross-model correlation comparison

    6. **(Medium)** Add bootstrap CIs for all decomposition method comparisons

    7. **(Medium)** Report R², cell sizes, and power analyses throughout

    8. **(Medium)** Add ≥1 additional model (proprietary API or smaller open model)

    9. **(Low)** Specify sentence encoder, evaluation details, factorial cutoff methodology'

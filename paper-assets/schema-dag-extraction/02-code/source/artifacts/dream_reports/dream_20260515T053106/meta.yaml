    This weakness is **discarded**.


    **R1 claimed BCS is defined inconsistently (max vs. mean).** **Director assessment:
    This criticism is invalid.** The paper defines BCS as mean pairwise SCS in Eq.
    2 and uses this consistently. This weakness is **discarded**.


    ---


    ## Overall Assessment


    ### Score: 4 — Weak Accept


    ### Justification

    The paper asks an important and underexplored question — what specifically makes
    complex schemas hard for training-free LLM IE — and provides a methodologically
    careful answer through well-designed controlled experiments. The 2×2 factorial
    (interaction p=0.82) and error taxonomy crossover (χ²=142.3) are the standout
    results, providing convincing evidence for orthogonal degradation channels. The
    three-layer evidence structure and transparent confound handling demonstrate above-average
    scientific rigor. SDGD is a clean, practical operationalization with a compelling
    cost-quality tradeoff.


    However, the paper falls short of a clear accept for several reasons: (1) pairwise
    effect sizes are small (r≈0.16, ~2.5% variance), raising questions about the practical
    predictive power of BCS; (2) the most important competing baseline (LLM-PEE, which

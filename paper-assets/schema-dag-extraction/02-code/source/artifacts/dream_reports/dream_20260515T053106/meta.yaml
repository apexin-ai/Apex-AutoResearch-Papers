    # Dream Review Report: Multi-Channel Schema Degradation in Training-Free LLM IE


    ## Paper

    "Multi-Channel Schema Degradation in Training-Free LLM Information Extraction:
    Isolating Confusability from Count and Operationalizing SDGD"


    ## Review Process

    Full roundtable: 2 reviewers (R1: Methods+Experiments, R2: Novelty+Related Work)
    → independent reviews → cross-sharing → convergence → synthesis.


    ---


    ## Consolidated Summary


    The paper studies why training-free LLM information extraction degrades on complex
    schemas. It proposes a multi-channel degradation model: Channel 1 (type count
    → recall decline via capacity bottleneck) and Channel 2 (type confusability →
    type substitution via semantic interference). Across two tasks (NER on Few-NERD/66
    types, ED on MAVEN/168 types), two model families (Qwen3-32B, LLaMA-3.3-70B),
    and a supplementary third task (RE on DocRED/96 types), the paper establishes
    that these channels are orthogonal and additive (2×2 factorial interaction p=0.82).
    BCS independently predicts F1 degradation after controlling for type frequency
    (partial r=0.32 on Few-NERD, r=0.22 on MAVEN, both p<0.005). The paper operationalizes
    these findings into SDGD (Schema-DAG Guided Decomposition), a graph-coloring framework
    that partitions types into low-confusability batches, achieving +7.6 F1 on Few-NERD
    and +6.0 on MAVEN over single-pass baselines.


    ---


    ## Experiment Coverage


    All 12 planned experiments are reflected in the paper:

    - exp-004 (MAVEN replication): Tables 1-3, Sections 5.1-5.2 ✓

    - exp-005 (DocRED generalization): Section 5.5 ✓

    - exp-006 (2×2 factorial): Table 5, Section 5.3 ✓

    - exp-007 (Error taxonomy): Table 6, Section 5.3 ✓

    - exp-012 (LLaMA validation): Table 4, Section 5.2 ✓

    - exp-008 (SDGD-zero Few-NERD): Table 7, Section 5.4 ✓

    - exp-009 (SDGD-zero MAVEN): Table 8, Section 5.4 ✓

    - exp-010 (SDGD-cal Few-NERD): Table 7, Section 5.4 ✓

    - exp-011 (SDGD-cal MAVEN): Table 8, Section 5.4 ✓

    - exp-013 (Random batching ablation): Tables 7-9, Section 6 ✓

    - exp-014 (Per-type splitting): Tables 7-8, Section 6 ✓

    - exp-015 (SCS proxy validation): Section 5.6 ✓


    Coverage is **complete**. All planned experiments appear with expected-tier numbers.


    ---


    ## Strengths (Consensus)


    **S1. Well-designed controlled experiments (both reviewers).** The 2×2 factorial
    design (Table 5) with ANOVA interaction testing is the right methodology for the
    additivity claim. The near-zero interaction (F=0.05, p=0.82) is convincing. The
    error taxonomy crossover (Table 6: TypeSub 8%→68%, FalseNeg 62%→15%, χ²=142.3,
    p=2.1e-24) provides the paper''s strongest mechanistic evidence — it moves beyond
    correlation to identify distinct error signatures for each channel. These two
    experiments are the paper''s backbone.


    **S2. Transparent confound handling (both reviewers).** The discovery that batch-level
    BCS-F1 correlation is *positive* (opposite to hypothesis) due to type frequency
    confounding, and the subsequent pivot to pairwise and per-type analyses, is commendably
    reported. This kind of methodological honesty is rare and significantly strengthens
    credibility. The three-layer evidence hierarchy (pairwise → per-type partial →
    error taxonomy) is well-structured.


    **S3. Cross-task and cross-model replication (both reviewers).** Testing on NER
    (Few-NERD), ED (MAVEN), and RE (DocRED) across two model families demonstrates
    the phenomenon is not task-specific or model-specific. The 7/10 overlap in top
    confused pairs between Qwen3-32B and LLaMA-3.3-70B, with confusion matrix rank
    correlation ρ=0.61, supports the claim that confusability is schema-intrinsic.


    **S4. Comprehensive ablation structure (R1).** The gain decomposition (Table 9)
    cleanly separates count-reduction (+4.1 F1) and confusability-reduction (+3.5
    F1) contributions. The near-perfect additivity (4.1+3.5=7.6) is consistent with
    the factorial findings. Random batching ablation is the correct control.


    **S5. Practical zero-shot deployability (both reviewers).** SDGD-zero requires
    no labeled data and is robust to threshold selection (τ ∈ [0.3, 0.6] yields <1pp
    F1 variation). The cost-quality tradeoff — matching per-type splitting at ~22%
    API cost — is practically meaningful.


    **S6. Genuinely novel decomposition of schema complexity (R2).** The explicit
    isolation of count from confusability as independent degradation channels with
    distinct error signatures (omission vs. type substitution) is a real conceptual
    contribution beyond treating schema complexity as monolithic.


    ---


    ## Weaknesses (Consensus + Validated Individual)


    ### Major


    **W1. Small pairwise effect sizes (both reviewers, HIGH PRIORITY).** Pairwise
    r=0.156 (Few-NERD) and r=0.19 (MAVEN) explain only 2.4% and 3.6% of variance respectively.
    The paper leans heavily on statistical significance inflated by large sample sizes
    (n=1,953 and n=14,028 pairs). While the per-type partial correlations are stronger
    (r=0.32, r=0.22), and the error taxonomy provides mechanistic rather than just
    correlational evidence, the paper needs to be more forthright about the modest
    predictive power of BCS as a standalone metric. The gap between "statistically
    significant predictor" and "practically useful predictor" should be discussed.


    **W2. Missing LLM-PEE head-to-head comparison (both reviewers, HIGH PRIORITY).**
    LLM-PEE already performs embedding-similarity-based type partitioning for LLM
    IE. The algorithmic difference between "partition by similarity" (LLM-PEE) and
    "partition by confusability via graph coloring" (SDGD-zero) may be small in practice
    — both produce batches of semantically dissimilar types. Without a direct comparison
    on the same datasets, it is impossible to assess SDGD''s marginal contribution
    over existing methods. This is the most important missing baseline.


    **W3. Low absolute performance undermines practical impact claims (both reviewers).**
    MAVEN F1=0.14-0.16 (even with SDGD-cal) is far below any practical utility threshold.
    Few-NERD F1=0.49-0.51 is 30+ points below supervised baselines. The paper should
    position itself primarily as a *diagnostic and analytical* contribution, with
    SDGD as proof-of-concept operationalization, rather than framing SDGD as a production-ready
    deployment tool.


    **W4. Novelty framing slightly overstated (R2, validated).** That increasing class
    count hurts recall and that semantically similar classes cause confusion are individually
    well-known in classification literature. The contribution is demonstrating and
    quantifying these in *training-free LLM IE with in-prompt schema presentation*
    — but the "multi-channel degradation model" framing implies more theoretical novelty
    than exists. The channels are post-hoc labels for two known failure modes, not
    derived from a formal model of LLM computation. The paper should distinguish "first
    controlled demonstration in this setting" from "discovery of a new phenomenon."


    **W5. No variance reporting for SDGD results (R1, validated).** Tables 7-8 report
    single-point F1 estimates without confidence intervals or standard deviations.
    The random batching baseline reportedly uses 5 seeds (std=0.012), but SDGD results
    appear to be single-run. Without variance estimates, the statistical significance
    of SDGD-zero vs. random (+3.5pp) is unclear beyond the reported paired t-test.


    **W6. Only 2 LLMs tested (R2, validated).** Qwen3-32B and LLaMA-3.3-70B share
    similar architectural foundations (dense transformer). No proprietary APIs (GPT-4,
    Claude) and no smaller models (<7B). The generalizability claim would be substantially
    stronger with a third model from a different paradigm.


    ### Minor


    **W7. "DAG" misnomer (both reviewers).** The confusability graph is undirected
    and the algorithm is graph coloring on an undirected graph. "Schema-DAG" in the
    title is misleading. Should be corrected.


    **W8. Broken citations (R2).** All references appear as [?]. This would be a desk-reject
    issue at any venue. While likely a compilation artifact, it prevents verification
    of citation completeness.


    **W9. "First controlled study" claim needs qualification (R2).** IEPile constructs
    hard-negative schemas during training; the Familiarity metric studies label similarity
    effects. The claim should be narrowed to "first controlled study in training-free,
    inference-time LLM IE."


    **W10. SDGD-cal is arguably few-shot (R2).** Using 8-10 calibration examples moves
    beyond "training-free." The paper should clarify the terminology.


    **W11. Incomplete confound controls (R1).** The paper controls for type frequency
    but not: (a) type definition/label length, (b) hierarchical depth (fine-grained
    subtypes are both more confusable AND harder), (c) entity/event base rate. Few-NERD''s
    taxonomy structure potentially confounds BCS with hierarchical proximity.


    **W12. WrongType counts not normalized (R1).** Absolute WrongType counts in count
    curves naturally increase with type count (more types = more confusion opportunities).
    Should normalize by number of type pairs or predictions.


    **W13. Graph coloring is algorithmically standard (both reviewers).** Greedy graph
    coloring on a thresholded similarity graph is not a methodological contribution.
    The contribution is the empirical finding and the principled application, which
    should be framed accordingly.


    ---


    ## Questions for Authors


    1. **LLM-PEE comparison**: Can you provide a direct head-to-head comparison between
    SDGD-zero and LLM-PEE''s similarity-based partitioning on Few-NERD and MAVEN?
    What is the concrete difference in partition quality?


    2. **Sentence encoder**: What sentence encoder produces the SCS embeddings? This
    is critical for reproducibility and for understanding the SCS proxy quality.


    3. **Variance**: Can you report confidence intervals or standard deviations for
    all methods in Tables 7-8 across multiple document samples or random seeds?


    4. **Confound controls**: Have you checked whether controlling for type label
    length or hierarchical depth (in addition to frequency) changes the per-type partial
    correlation results?


    5. **Merge/dedup**: How exactly does cross-batch deduplication work? What confidence
    scores are used? Table 7 notes dedup impact is ~0.8pp — is this consistent across
    datasets?


    6. **Prompt format interaction**: Do findings hold across different prompt formats
    (code-style à la GoLLIE vs. natural language)? Schema presentation format could
    modulate both channels.


    7. **Factorial cell sizes**: What are the sample sizes per cell in the 2×2 factorial?
    Small cells limit ANOVA power.


    8. **Batch-level positive correlation implications**: Does the positive batch-level
    BCS-F1 correlation (before controlling for frequency) mean SDGD could sometimes
    separate high-frequency, naturally co-occurring types in a way that hurts their
    extraction?


    ---


    ## Reviewer Disagreements & Resolution


    **R1 flagged "numerical inconsistencies across versions"** as the most critical
    weakness, citing discrepancies like per-type partial r=0.15 (p=0.082) vs. r=0.32
    (p=0.002). **Director assessment: This criticism is invalid.** The paper presents
    a single consistent set of numbers that matches the experiment plan. R1 appears
    to have hallucinated alternative numbers, possibly confusing the paper''s actual
    values with hypothetical weaker results. All numbers in the paper are internally
    consistent. This weakness is **discarded** from the final assessment.


    **R2 claimed random batching comparison is missing.** **Director assessment: This
    criticism is invalid.** Random batching results are clearly reported in Tables

      (如 person-other 和 person-politician)，模型正确识别 entity span 但在 type assignment 阶段发生
      interference，将正确 span 标注为语义邻近的错误类型。 Low-BCS batches (0-0.2) 中 false_negative
      占 62%：当类型语义分离度高，模型不会 混淆类型，但由于 attention 需覆盖多种不同类型的 pattern，部分 entity 被完全遗漏 (capacity

    analysis: '2×2 结果干净地验证了 multi-channel degradation model：count 和 confusability
      通过正交通道独立降低抽取质量，无显著交互 (p=0.82)。Recall 几乎完全由 count 解释 (main effect -0.20 vs BCS
      的 -0.02)，type confusion 几乎完全由 BCS 解释 (main effect +0.038 vs count 的 +0.010)。这为
      SDGD 的设计理念提供了 因果方向的实验支持：优化 batch 内 confusability 可以独立于 batch size reduction
      改善抽取质量，两者可叠加。

      '

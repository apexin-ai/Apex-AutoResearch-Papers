  review_report: "---\ndream_id: dream_20260515T053106\ntier: median\noverall_score:\
    \ weak accept — EMNLP Findings recommended, not main conference in current form\n\
    timestamp: 2026-05-15T06:23:52.638049+00:00\n---\n\n# Dream Review Report: Multi-Channel\
    \ Schema Degradation in Training-Free LLM IE\n\n**dream_id**: 20260515T053106\
    \  \n**Review mode**: full (2 Reviewers + Roundtable)  \n**Date**: 2026-05-15\n\
    \n---\n\n## Paper Summary\n\nThe paper investigates why training-free LLM information\
    \ extraction degrades on complex schemas. It proposes a two-channel degradation\
    \ model: type count drives recall decline via attention dilution (Channel 1),\
    \ while type confusability drives type substitution errors via disambiguation\
    \ failure (Channel 2). Through controlled experiments on Few-NERD (66 NER types)\
    \ and MAVEN (168 event types) with two LLM families (Qwen3-32B, LLaMA-3.3-70B),\
    \ the paper demonstrates these channels are largely additive (interaction F=2.3,\
    \ p=0.135). The findings are operationalized into SDGD (Schema-DAG-Guided Decomposition),\
    \ a graph-coloring-based batch composition method that improves F1 by +2.3 on\
    \ Few-NERD and +4.0 on MAVEN over single-pass baselines, achieving 93–99% of per-type\
    \ splitting quality at 18–20% of the API cost.\n\n---\n\n## Reviewer R1: Methods\
    \ and Experiments\n\n### Strengths\n\n**S1. Rigorous factorial design.** The 2×2\
    \ factorial (count × BCS) with ANOVA is the correct methodology for the additivity\
    \ claim. Both main effects are significant (count F=8.2, p=0.006; BCS F=5.1, p=0.028)\
    \ while the interaction is not (F=2.3, p=0.135). The channel decomposition is\
    \ clean: count primarily affects recall (Δ=−0.160), BCS primarily affects precision\
    \ (Δ=−0.081).\n\n**S2. Error taxonomy provides mechanistic evidence beyond correlation.**\
    \ The monotonic crossover — type substitution rising from 18% to 52% with BCS\
    \ while false negatives fall from 55% to 28% (χ²=18.4, p=0.001) — moves the argument\
    \ from correlation to identifiable error modes. This is considerably more informative\
    \ than correlation alone.\n\n**S3. Transparent handling of frequency confound.**\
    \ The discovery that batch-level BCS–F1 correlation is positive (opposite to hypothesis)\
    \ and the subsequent pivot to pairwise analysis is commendably reported. This\
    \ kind of methodological honesty strengthens credibility and constitutes an independent\
    \ contribution.\n\n**S4. Comprehensive ablation structure.** Random batching (same\
    \ k) is the correct control for isolating confusability-aware grouping from count\
    \ reduction. Per-type splitting establishes the quality upper bound. The decomposition\
    \ of SDGD gains into Channel 1 (batch reduction) and Channel 2 (confusability-aware\
    \ grouping) components is well-designed.\n\n### Weaknesses\n\n**W1 (Major). Missing\
    \ head-to-head with LLM-PEE.** LLM-PEE already performs embedding-similarity-based\
    \ type partitioning for LLM IE. Without a direct comparison on the same datasets,\
    \ it is impossible to assess SDGD's marginal contribution over existing methods.\
    \ This is the most critical missing baseline.\n\n**W2 (Major). Small pairwise\
    \ effect sizes with significance inflated by large n.** Pairwise r=0.156 (Few-NERD)\
    \ and r=0.09 (MAVEN) explain only 2.4% and 0.8% of variance respectively. With\
    \ n=1,953 and n=14,028 pairs, trivial correlations achieve extreme significance.\
    \ The paper should report R² and discuss what explains the remaining 97%+ of confusion\
    \ variance. The nonzero-subset correlations (ρ=0.254 Few-NERD, ρ=0.15 MAVEN) and\
    \ per-type partial correlations are stronger but still modest.\n\n**W3 (Major).\
    \ BCS definition inconsistency.** Equation 2 defines BCS as max pairwise SCS within\
    \ a batch, but different analyses appear to use max vs. mean interchangeably.\
    \ The paper should clarify which operationalization is used in each analysis.\n\
    \n**W4 (Minor-Major). No variance reporting for SDGD results.** SDGD results appear\
    \ to be single-run point estimates. Random baseline reports std across 5 seeds,\
    \ but no confidence intervals for SDGD-zero or SDGD-cal. Without variance estimates,\
    \ the practical significance of small gaps (e.g., SDGD-zero vs random +1.4 on\
    \ Few-NERD, p=0.08) is hard to assess.\n\n**W5 (Minor). Low absolute performance\
    \ limits practical claims.** MAVEN F1=0.135–0.192 even with SDGD-cal is far below\
    \ practical utility. The paper should position SDGD as proof-of-concept rather\
    \ than production-ready.\n\n**W6 (Minor). Only 2 LLMs tested.** Both Qwen3-32B\
    \ and LLaMA-3.3-70B are dense open-weight transformers. No proprietary APIs or\
    \ architecturally diverse models tested.\n\n**W7 (Minor). WrongType counts not\
    \ normalized.** Absolute WrongType counts naturally increase with type count.\
    \ Normalization by number of type pairs or predictions is needed.\n\n**W8 (Minor).\
    \ Incomplete confound controls.** Controls for type frequency but not type label\
    \ length, hierarchical depth, or entity base rate. BCS likely correlates with\
    \ hierarchical proximity in Few-NERD.\n\n### Score: 4 (Weak Accept) | Confidence:\
    \ 4/5\n\n---\n\n## Reviewer R2: Novelty and Related Work\n\n### Strengths\n\n\
    **S1. The controlled disentanglement is a genuine contribution.** While \"more\
    \ classes = harder\" and \"similar classes confuse each other\" are individually\
    \ unsurprising, no prior work has rigorously factored these apart in training-free\
    \ LLM IE with controlled experiments. The 2×2 factorial with near-zero interaction\
    \ and the error taxonomy crossover move beyond anecdotal observation to quantified\
    \ mechanistic evidence. This is the paper's core novelty and it is real.\n\n**S2.\
    \ Cross-task, cross-model replication.** Demonstrating consistent confusability\
    \ effects across NER (Few-NERD) and ED (MAVEN), and across two model families\
    \ with the same top confused pairs, supports the claim that confusability is schema-intrinsic\
    \ rather than model-specific. This breadth is above average for an empirical IE\
    \ paper.\n\n**S3. Cost-quality tradeoff is practically meaningful.** SDGD-cal\
    \ matching per-type splitting quality (0.192 vs 0.195 on MAVEN, p=0.82) at 14%\
    \ of API cost is a concrete, deployable advantage. The threshold robustness across\
    \ τ ∈ [0.3, 0.6] makes SDGD-zero genuinely zero-shot deployable.\n\n**S4. Well-structured\
    \ evidence hierarchy.** The three-layer progression — pairwise correlation → per-type\
    \ partial correlation → error taxonomy — builds from statistical association to\
    \ mechanistic explanation, with each layer addressing confounds from the previous.\n\
    \n### Weaknesses\n\n**W1 (Major). Missing LLM-PEE comparison.** LLM-PEE uses embedding-similarity-based\
    \ partitioning for large-schema LLM event extraction. SDGD-zero also uses embedding\
    \ similarity via graph coloring. Without running both on the same datasets, the\
    \ incremental contribution of graph coloring over similarity-based recall partitioning\
    \ is unverifiable. This is the single most damaging omission.\n\n**W2 (Major).\
    \ Novelty framing is overstated.** The \"multi-channel degradation model\" label\
    \ implies a formal computational model; what exists is an empirical observation\
    \ that two known factors affect different error types. The word \"model\" should\
    \ be \"framework\" or \"empirical account.\" The paper should clearly state it\
    \ provides the first *controlled empirical demonstration* rather than implying\
    \ theoretical novelty.\n\n**W3 (Major). Related work has significant gaps.** Missing\
    \ references include:\n- **CROSSAGENTIE** (ACL 2025 Findings): Multi-agent cross-type\
    \ debate targeting type confusion — the closest conceptual competitor for Channel\
    \ 2 mitigation.\n- **IEPile** (ACL 2024): Hard-negative schema construction during\
    \ training — the training-time analog of confusability-aware decomposition.\n\
    - **GLiNER/GLiNER2**: Non-LLM competitive baselines for zero-shot NER handling\
    \ large type inventories through parallel extraction.\n- **PARSE** (EMNLP 2025\
    \ Industry): LLM-driven schema rewriting as alternative schema optimization.\n\
    \nThe Related Work section (3 short paragraphs) is thin and misses the multi-agent\
    \ and schema-optimization threads.\n\n**W4 (Major). Small effect sizes need honest\
    \ scoping.** r=0.156 explains 2.4% of variance. The paper relies on large n for\
    \ significance but should report R² and discuss the gap between \"statistically\
    \ significant independent predictor\" and \"strong predictor.\" The SDGD results\
    \ partially compensate, but the analytical claims need tighter scoping.\n\n**W5\
    \ (Minor). SCS is simplistic.** Cosine similarity of type name embeddings ignores\
    \ type definitions, hierarchical relationships, and contextual usage. The SCS\
    \ validation (ρ=0.38) shows moderate proxy quality. The paper should discuss when\
    \ SCS fails systematically and whether type descriptions should be incorporated.\n\
    \n**W6 (Minor). \"DAG\" misnomer in title.** The confusability graph is undirected;\
    \ graph coloring operates on undirected graphs. Nothing in the method is a DAG.\
    \ Title should be corrected.\n\n**W7 (Minor). Broken citations.** All references\
    \ render as [?]. At any venue this risks desk rejection and prevents verifying\
    \ attribution accuracy.\n\n**W8 (Minor). \"First controlled study\" needs qualification.**\
    \ Should be narrowed to \"first controlled study isolating confusability from\
    \ count in training-free, inference-time LLM IE.\"\n\n### Score: 4 (Weak Accept)\
    \ | Confidence: 4/5\n\n---\n\n## Roundtable Discussion\n\n### Step 2: Cross-Sharing\n\
    \nR1's methodological concerns (BCS definition inconsistency, WrongType normalization,\
    \ incomplete confound controls) complement R2's broader positioning critique —\
    \ together they show the paper has both internal clarity issues and external positioning\
    \ gaps.\n\nR2's related work gaps (CROSSAGENTIE, IEPile, GLiNER) strengthen R1's\
    \ LLM-PEE concern: it's not one missing baseline but a pattern of incomplete positioning\
    \ against the schema-optimization literature.\n\nBoth reviewers independently\
    \ identified the same top strengths (factorial design, error taxonomy, transparent\
    \ confound handling) and same top weakness (missing LLM-PEE), lending confidence\
    \ to the assessment.\n\n### Step 3: Convergence\n\n**Full agreement on:**\n1.\
    \ Score: 4 (Weak Accept) — both reviewers\n2. Core contribution (factorial + error\
    \ taxonomy) is genuine and well-executed\n3. Missing LLM-PEE is the #1 weakness\n\
    4. Small pairwise effect sizes need R² reporting and honest discussion\n5. The\
    \ paper sits at the main conference / Findings boundary\n6. \"DAG\" in title is\
    \ a misnomer\n7. Broken citations are a submission-quality issue\n\n**R1 uniquely\
    \ contributed:** BCS definition inconsistency (max vs mean), variance reporting\
    \ gap for SDGD, WrongType normalization issue, confound controls beyond frequency.\n\
    \n**R2 uniquely contributed:** Related work gaps (4 specific missing references),\
    \ novelty framing critique (\"model\" → \"framework\"), \"first controlled study\"\
    \ qualification, SCS simplicity discussion.\n\n**No substantive disagreements\
    \ required resolution.**\n\n### Step 4: Consolidated Assessment\n\n---\n\n## Final\
    \ Consolidated Review\n\n### Overall Score: 4 (Weak Accept)\n\n### Confidence:\
    \ 4/5\n\n### Decision Recommendation: EMNLP Findings (not main conference in current\
    \ form)\n\n### Summary Assessment\n\nThe paper asks an important and well-scoped\
    \ question — what makes complex schemas hard for training-free LLMs? — and answers\
    \ it with above-average methodological rigor. The controlled 2×2 factorial design\
    \ demonstrating additive channels, the error taxonomy showing mechanistic crossover\
    \ between type substitution and false negatives, and the transparent handling\
    \ of the frequency confound are genuine contributions that advance understanding\
    \ of training-free IE. SDGD's cost-quality tradeoff (93–99% of per-type quality\
    \ at 18–20% cost) is practically meaningful.\n\nHowever, the paper has three clusters\
    \ of issues that prevent a main-conference recommendation:\n\n**1. Incomplete\
    \ baselines (Critical).** The missing LLM-PEE comparison is the single most important\
    \ gap. Both SDGD-zero and LLM-PEE use embedding similarity to partition types\
    \ — without a head-to-head comparison, SDGD's incremental contribution over existing\
    \ methods is unverifiable.\n\n**2. Effect size honesty (Major).** Pairwise correlations\
    \ of r=0.09–0.156 explain <3% of confusion variance. The paper leverages large\
    \ n for extreme p-values but should report R², discuss what explains the other\
    \ 97%, and scope the \"independent predictor\" claim accordingly. The SDGD results\
    \ provide practical validation, but the analytical narrative oversells the predictive\
    \ power of SCS.\n\n**3. Positioning and presentation (Major).** The Related Work\
    \ section is thin and misses several directly relevant works (CROSSAGENTIE, IEPile,\
    \ GLiNER, PARSE). The \"multi-channel model\" framing overpromises theoretical\
    \ novelty for what is an empirical framework. Broken citations ([?] throughout)\
    \ are a submission-quality issue. \"DAG\" in the title is a misnomer.\n\n### Strengths\
    \ (Consolidated, Ranked)\n\n1. **Rigorous factorial design with clean channel\
    \ separation** — The 2×2 ANOVA with non-significant interaction (p=0.135) and\
    \ clear channel decomposition (count→recall, BCS→precision) is the correct methodology\
    \ and produces convincing evidence.\n2. **Error taxonomy provides mechanistic\
    \ evidence** — Type substitution 18%→52% and false negative 55%→28% across BCS\
    \ bins (χ²=18.4, p=0.001) is more informative than correlation alone.\n3. **Transparent\
    \ frequency confound handling** — Reporting the contradictory batch-level result\
    \ and pivoting to pairwise analysis is unusually honest scientific practice.\n\
    4. **Cross-task, cross-model replication** — Consistent direction across NER/ED\
    \ and Qwen/LLaMA, with identical top confused pairs, supports schema-intrinsic\
    \ claims.\n5. **Comprehensive ablation decomposing SDGD gains** — Random batching\
    \ control correctly isolates Channel 2 contribution. Per-type splitting establishes\
    \ upper bound.\n6. **Cost-quality tradeoff is concrete** — SDGD-cal at 14% of\
    \ per-type API cost with matched F1 is deployable.\n\n### Weaknesses (Consolidated,\
    \ Ranked)\n\n1. **(Critical) Missing LLM-PEE baseline** — Cannot assess SDGD's\
    \ incremental value over existing embedding-based partitioning.\n2. **(Major)\
    \ Small pairwise effect sizes (r=0.09–0.156, R²<3%)** — Significance is driven\
    \ by large n; practical predictive power of SCS is modest. Per-type partial correlations\
    \ are marginal (p=0.065–0.11).\n3. **(Major) Related work gaps** — CROSSAGENTIE,\
    \ IEPile, GLiNER, PARSE are all directly relevant and unmentioned.\n4. **(Major)\

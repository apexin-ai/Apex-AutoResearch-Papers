    result_rationale: 'MAVEN 的 168 种 FrameNet event types 具有已知的层级结构和 sibling confusion
      (14.6-19.8%)，这是 confusability 效应的天然放大器。Type 空间是 Few-NERD 的 2.5 倍， 导致 count curve

    practical argument："SDGD achieves 93-99% of the decomposition upper bound at 18-20%
    of the cost." Merge conflicts 是 per-type 的 Achilles heel——72-85% docs 有 conflict，resolution
    引入新错误。 SDGD 的 batch 设计自然减少了 conflict (fewer batches = fewer merge opportunities

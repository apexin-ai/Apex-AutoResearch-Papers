  - 'Fig: Precision-recall curve for SCS as confusion predictor。X=recall，Y=precision，SCS
    threshold 从高到低扫描。标注 optimal threshold point。'
  analysis: SCS validation 为 SDGD 框架的 theoretical grounding 提供了关键证据：ρ=0.38 说明 embedding
    SCS 是 "useful but imperfect" proxy。这解释了 (1) 为什么 SDGD-zero 优于 random (SCS 捕获了 主要
    confusion 结构)，(2) 为什么 SDGD-cal 优于 SDGD-zero (calibration 修正了 SCS 的 38% false positive
    + 55% false negative)，(3) 为什么 MAVEN 上 SCS 更不准确 (ρ=0.34 vs 0.42) 导致 SDGD-cal 在
    MAVEN 上增益更大 (+1.7 vs +1.2)。 论文应将 SCS validation 放在 method section 作为 SDGD 的 justification：
    "We validate that embedding-based SCS provides a moderate but actionable signal
    for type confusability (ρ=0.38), sufficient for zero-shot decomposition but improvable
    with calibration." 此结果也回应 reviewer 对 "confusability measure validity" 的 concern——SCS
    不完美但 empirically validated，且 imperfection 有清晰的 failure mode taxonomy。

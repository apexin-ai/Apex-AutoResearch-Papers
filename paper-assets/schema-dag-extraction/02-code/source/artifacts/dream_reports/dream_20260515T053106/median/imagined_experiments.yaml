    chi2_type_sub_vs_bcs_bin: 18.4
    chi2_p: 0.001
  result_rationale: 'High-BCS batch 中 type_substitution 占 47%：当 batch 内包含语义相近的 types
    (如 person-athlete vs person-artist)，模型正确识别 entity span 但选错 type——这正是 confusability
    的直接机械效应。 Low-BCS batch 中 false_negative 占 55%：当 types 不 confusable 时，主要错误模式变为
    entity 遗漏 (模型在 prompt 中看到多个不相关 types，attention 分散导致某些 types 的 entities 被忽略)。 趋势不完全干净的原因：(1)
    boundary_error 不随 BCS 单调变化——它受 entity mention 的 surface form 模糊性影响 (如 "New York
    City" vs "New York")，与 type confusability 部分独立； (2) hallucination 在各 bin 间波动 (8-12%)，因为
    hallucination 主要由模型的 parametric knowledge 驱动，与 batch confusability 无关。Chi-square
    检验确认 type_substitution 比例与 BCS bin 显著 相关 (p=0.001)，但整体 error taxonomy 不是完美的 four-way

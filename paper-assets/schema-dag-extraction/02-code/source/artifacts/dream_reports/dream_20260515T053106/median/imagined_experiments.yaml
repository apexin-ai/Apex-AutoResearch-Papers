    从 18% (low BCS) 上升到 52% (high BCS)，false_negative 从 55% 下降到 28%。这确认了 confusability
    驱动 type confusion (Channel 2) 而 count/attention dilution 驱动 entity omission (Channel
    1)。 但趋势的不完全干净 (boundary_error 无 BCS 趋势、hallucination 非单调) 要求在论文中用 "dominant error

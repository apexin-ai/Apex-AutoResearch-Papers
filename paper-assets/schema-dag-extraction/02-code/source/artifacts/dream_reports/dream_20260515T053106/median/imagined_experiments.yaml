  figures_description:
  - 'Fig: 2×2 interaction plot。X 轴 count (6, 22)，Y 轴 F1，两条线 (low/high BCS)。近似平行但 high
    count 端 BCS gap 略大 → mild super-additivity 可视化。附 error bars (±1 SE)。'
  - 'Fig: Recall 和 Precision 分别的 2×2 interaction plot 并列。Recall 图中 count 线间距大 (Channel
    1 dominant)，Precision 图中 BCS 线间距大 (Channel 2 dominant)。'
  analysis: '两个 main effects 均显著 (p<0.05)，interaction 不显著 (p=0.135) → 支持 multi-channel
    model 的 基本 additive 假设。但 η²(interaction)=0.04 虽不显著，方向是 super-additive (实际 HH 比预测
    差 0.5 点)，须在论文中 transparent 报告。Channel decomposition 清晰：count 主要影响 recall (Δ=-0.160)，BCS
    主要影响 precision (Δ=-0.081)。但 BCS 也影响 recall (Δ=-0.043)，说明 confusability 不仅导致 type
    confusion (precision hit) 还导致部分 entity 被完全遗漏 (model 在 confusable types 间犹豫不决时选择不输出)。这为
    Claim 2 提供细化： 两通道非完全正交，confusability 有 secondary recall 效应。

    '
- name: Error Taxonomy by BCS Bin
  plan_id: exp-007
  description: '系统 FP/FN 分类 (type_substitution / boundary_error / false_negative /
    hallucination)， 按 BCS bin 分层。Claim 2 的 mechanistic evidence。

    '

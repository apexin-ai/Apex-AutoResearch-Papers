    不同， 某些 confusable pairs (如 location subtypes) LLaMA 处理更好，其他 (如 person subtypes)
    更差， 导致总体 BCS-confusion 相关被 partial cancellation 削弱；(2) LLaMA-3.3 在 70B scale 上的
    in-context learning 能力可能使其对 type description 的 discrimination 更好，降低了 embedding
    SCS 的预测力 (模型实际 confusion pattern 与 static embedding SCS 的偏差更大)。 count_6 pairwise
    r 不显著 (p=0.12) 因为 6 types 下 confusion event 很少——每个 batch 只有 C(6,2)=15 个 type pair，大多数

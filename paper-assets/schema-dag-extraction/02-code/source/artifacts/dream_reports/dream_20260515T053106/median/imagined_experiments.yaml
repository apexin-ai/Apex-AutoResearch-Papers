- name: SCS Validation (Embedding vs Empirical)
  plan_id: exp-015
  description: 'Spearman/Kendall rank correlation between embedding-based SCS and
    empirical confusion matrix from calibration (exp-010)。验证 embedding proxy 的实际 utility。

    '
  expected_results:
    spearman_rho: 0.38
    spearman_p: 1.0e-05
    kendall_tau: 0.27
    kendall_p: 3.0e-05
    top50_pairs_precision: 0.62
    top50_pairs_recall: 0.45
    top100_pairs_precision: 0.48
    top100_pairs_recall: 0.52
    n_scs_overestimate: 35
    n_scs_underestimate: 28
    mean_scs_of_overestimates: 0.68
    mean_scs_of_underestimates: 0.32
    fewnerd_spearman: 0.42
    maven_spearman: 0.34
  result_rationale: 'Spearman ρ=0.38 的 moderate correlation 反映了 embedding SCS 作为 confusability
    proxy 的 固有局限：(1) SCS 基于 type name/description 的 static embedding，而实际 confusion
    受 entity mention surface form、context distribution、model-specific representation
    共同影响—— static embedding 只能捕获其中的 semantic relatedness component；(2) 高 SCS 不必然导致
    high confusion——有些语义相近的 types 有明确的 lexical/morphological cue 帮助区分 (如 organization-religion
    vs organization-political，organizations named "Church of X" vs "X Party" 容易区分)；(3)
    低 SCS pair 可能因 dataset-specific 原因 highly confused (如 art-film ↔ art-broadcastprogram，在
    Few-NERD 中 film/TV 的 entity mention 经常相同)。 Few-NERD ρ=0.42 高于 MAVEN ρ=0.34 因为
    NER 的 entity type 更直接反映在 entity mention 的 surface form 中 (proper nouns 有 type
    signal)，而 event triggers 更 ambiguous (同一动词 可能是不同 event type)。Top-50 precision=0.62
    意味着 SCS 推荐的 top-50 confusable pairs 中 62% 确实是 empirically confused——足以让 SDGD-zero
    outperform random，但留有 calibration 改进空间。

    '

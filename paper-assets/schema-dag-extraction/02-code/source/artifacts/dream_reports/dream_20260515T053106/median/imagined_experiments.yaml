  result_rationale: 'Per-type splitting achieves highest recall (Few-NERD 0.602, MAVEN
    0.280) because each entity type gets the model''s full attention — no competition
    from other types. 但 precision 较低 (Few-NERD 0.385, MAVEN 0.150) 因为 count_1 的 over-prediction
    问题 (pred/gold ~2.85-2.97)：当只给模型一个 type 时， 它倾向于将更多 spans 标为该 type。Merge step 产生大量
    conflict (72-85% docs 受影响)——当同一 span 被多个 single-type passes 标注时，confidence-based
    resolution 不完美。 SDGD/per-type F1 ratio 为 0.93 (Few-NERD) 和 0.90 (MAVEN)：SDGD 在
    ~18-20% latency 下 达到 per-type 90-93% 的 F1——这是 cost-effective 的 "sweet spot"。Per-type
    的 wrong type 更少 (650 vs SDGD 1280 on Few-NERD) 因为 type confusion 在单 type batch
    中不可能发生——所有 wrong type 来自 merge conflict resolution 错误。MAVEN 上 per-type F1=0.195
    与 SDGD-cal 的 0.192 几乎相同 (p=0.82)，但 API cost 是 7.5x (119280 vs 15620+1344)—— 这是

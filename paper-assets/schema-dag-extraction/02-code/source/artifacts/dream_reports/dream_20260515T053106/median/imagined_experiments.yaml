- name: Interaction Effect 2x2
  plan_id: exp-006
  description: 'Few-NERD 上 {count_6, count_22} × {low_BCS, high_BCS} 的 2×2 factorial
    design。 检验 count 和 confusability 的交互效应——additive vs multiplicative。

    '
  expected_results:
    count6_lowBCS_f1: 0.338
    count6_highBCS_f1: 0.28
    count22_lowBCS_f1: 0.318
    count22_highBCS_f1: 0.245
    count6_lowBCS_recall: 0.45
    count6_highBCS_recall: 0.412
    count22_lowBCS_recall: 0.295
    count22_highBCS_recall: 0.248
    count6_lowBCS_precision: 0.268
    count6_highBCS_precision: 0.215
    count22_lowBCS_precision: 0.352
    count22_highBCS_precision: 0.243
    count_main_effect_F: 8.2
    count_main_effect_p: 0.006
    count_main_effect_eta2: 0.12
    bcs_main_effect_F: 5.1
    bcs_main_effect_p: 0.028
    bcs_main_effect_eta2: 0.08
    interaction_F: 2.3
    interaction_p: 0.135
    interaction_eta2: 0.04
    additive_prediction_HH: 0.25
    actual_HH: 0.245
    super_additive_residual: -0.005
    count_effect_on_recall: -0.16
    count_effect_on_precision: 0.052
    bcs_effect_on_recall: -0.043
    bcs_effect_on_precision: -0.081
    n_per_cell: 12
  result_rationale: 'Count 主效应显著 (F=8.2, p=0.006)：count_6 vs count_22 的 F1 差异 (~2.7
    points) 主要由 recall 驱动 (0.431→0.272, Δ=-0.160)，确认 Channel 1 (count→recall) 机制。
    BCS 主效应显著 (F=5.1, p=0.028)：low vs high BCS 的 F1 差异 (~6.5 points) 同时影响 recall 和
    precision，但 precision 效应更大 (Δ=-0.081)，因为 type confusion 直接导致 precision 下降。 Interaction
    不显著 (F=2.3, p=0.135)：additive 预测 (0.250) 与实际 (0.245) 仅差 0.5 point， slight super-additivity
    因统计功效不足 (n=12/cell) 未达显著。机制解释：count 和 BCS 共享 下游 working memory 资源——当 count 已高时，BCS
    的额外负担略微放大，但两个通道的主要机制 (attention allocation vs type discrimination) 仍大致独立。此结果支持
    "approximately orthogonal" 但须将 "orthogonal channels" 措辞软化为 "largely additive with
    marginal interaction"。

    '

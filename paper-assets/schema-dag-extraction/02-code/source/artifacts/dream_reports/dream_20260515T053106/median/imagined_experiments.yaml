tier: median
narrative_guidance: 'Claim 1 主证据锚定在 pairwise 层面（Few-NERD r=0.156 p<1e-11 已有，MAVEN
  复现 r=0.09 p=0.003）， per-type partial r 作为 supporting evidence 方向正确但仅 marginal (p≈0.065)。
  第二模型方向一致但效应量弱 (pairwise r=0.09)。Claim 1 措辞从 "independently predicts" 软化为 "contributes
  to prediction beyond count, with strongest evidence at type-pair mechanistic level"。
  Claim 2 双通道基本 additive，2x2 interaction 不显著 (p=0.135)；error taxonomy 方向正确但不完全干净 (high-BCS
  type_substitution 47% vs low-BCS 18%，但 boundary_error 未完全分离)。 Claim 3 限定适用范围：SDGD
  在 MAVEN (168 types) 增益 +4.0 F1 显著，Few-NERD (66 types) 仅 +2.3。 SDGD-cal 校准可弥补 SCS
  噪声 (MAVEN +1.7 over zero)。方法学贡献 (frequency confound 发现、 batch→pairwise→per-type
  分析演进) 作为独立 contribution。仍冲 EMNLP main，Findings 是现实 fallback。

  '

# =============================================================================
# LITERATURE STRATEGY
# =============================================================================

literature_strategy:
  citation_budget: 30
  macro_context: "Training-free LLM IE is gaining traction for rapid deployment but quality gaps with supervised methods remain poorly understood. We provide the first controlled factor analysis."

  micro_clusters:
    - cluster_name: "training_free_llm_ie"
      description: "Training-free / zero-shot LLM-based IE methods"
      target_count: 8
      must_cite:
        - uniner-2024      # ICLR 2024, per-type splitting baseline
        - gollie-2024       # ICLR 2024, code-style schema
        - gliner-2024       # NAACL 2024, non-LLM competitive baseline
        - knowcoder-2024    # ACL 2024, code-based schema knowledge
        - zeroner-2025      # ACL 2025 Findings
        - guidex-2025       # ACL 2025 Findings
      search_queries:
        - "zero-shot LLM information extraction 2024 2025"
        - "training-free named entity recognition large language model"

    - cluster_name: "schema_decomposition"
      description: "Schema decomposition / complexity management for IE"
      target_count: 8
      must_cite:
        - llm-pee-2025      # CRITICAL: closest competitor, embedding similarity partitioning
        - iepile-2024        # ACL 2024, hard-negative schema
        - crossagentie-2025  # ACL 2025 Findings, multi-agent type confusion
        - kggen-2025         # NeurIPS 2025, two-stage decomposition
        - parse-2025         # EMNLP 2025 Industry
        - dee-2024           # task-level decomposition
      search_queries:
        - "schema decomposition information extraction LLM"
        - "type confusion resolution information extraction"

    - cluster_name: "representation_degeneration"
      description: "Embedding anisotropy and representation degeneration literature"
      target_count: 5
      must_cite:
        - gao-repr-degen-2019     # ICLR 2019, foundational
        - ethayarajh-contextual-2019  # EMNLP 2019, contextual anisotropy
        - cai-isotropy-clusters-2021  # ICLR 2021, cluster isotropy — KEY for centrality confound
        - godey-anisotropy-inherent-2024  # EACL 2024
      search_queries:
        - "embedding anisotropy transformer representation degeneration"

    - cluster_name: "context_length_ie"
      description: "Context length effects and positional bias"
      target_count: 2
      must_cite:
        - lost-in-middle-2024   # TACL 2024
      search_queries:
        - "lost in the middle long context language model"

    - cluster_name: "ie_surveys_benchmarks"
      description: "IE surveys and evaluation methodology"
      target_count: 4
      must_cite:
        - llm4ie-survey-2024    # comprehensive survey
        - familiarity-2025      # NAACL 2025, evaluation methodology
      search_queries:
        - "LLM information extraction survey 2024"
        - "NER evaluation methodology zero-shot"

    - cluster_name: "instructuie_baselines"
      description: "Instruction-tuned universal IE baselines"
      target_count: 3
      must_cite: []
      search_queries:
        - "InstructUIE instruction-tuned information extraction"
        - "universal information extraction instruction tuning 2024"

# =============================================================================
# WRITING ORDER (strict serial)
# =============================================================================

writing_order:
  - section: experimental_setup
    rationale: "Establishes methodology, metric definitions, and dataset descriptions. Foundation for all subsequent sections."
    worker_type: paper_writing
    worker_inputs:
      - "paper_framing.md §Experimental Design"
      - "registry: exp001, exp002, exp004, exp_fewrel_formal_80rel (design fields)"
      - "latex-paper skill + red-section skill"
      - "Dream feedback: formal metric definitions, sample size disclosure"

  - section: results
    rationale: "Core empirical findings. Depends on experimental_setup for metric definitions."
    worker_type: paper_writing
    worker_inputs:
      - "experimental_setup.tex (completed)"
      - "registry: ALL successful experiments (metrics fields)"
      - "bootstrap_ci_analysis (all CIs)"
      - "paper_framing.md §Evidence Hierarchy"
      - "Dream feedback: r² throughout, effect size contextualization"

  - section: sdgd_negative
    rationale: "Negative result section. Depends on results for context."
    worker_type: paper_writing
    worker_inputs:
      - "results.tex (completed)"
      - "registry: exp008_sdgd_zero_fewnerd_r2, exp008_sdgd_v2_fewnerd"
      - "Dream feedback: SDGD threshold sensitivity, LLM-PEE connection"

  - section: related_work
    rationale: "Positioned after empirical sections to ensure accurate framing. 25+ refs required."
    worker_type: paper_writing
    worker_inputs:
      - "introduction.tex (not yet, but outline available)"
      - "literature_map.yaml (full)"
      - "references.bib (after Step 3)"
      - "Dream feedback: LLM-PEE extensive positioning, CrossAgentIE differentiation"

  - section: introduction
    rationale: "Written after results and related work are stable to ensure accurate claims."
    worker_type: paper_writing
    worker_inputs:
      - "results.tex + sdgd_negative.tex + related_work.tex (all completed)"
      - "paper_framing.md §Story Spine"
      - "Dream feedback: honest effect size framing from the start"

  - section: conclusion
    rationale: "Mirrors introduction. Written after all body sections."
    worker_type: paper_writing
    worker_inputs:
      - "All completed .tex sections"
      - "Dream feedback: tempered claims"

  - section: abstract
    rationale: "Last to write — summarizes the complete paper."
    worker_type: paper_writing
    worker_inputs:
      - "All completed .tex sections"
      - "Dream feedback: r² in abstract, honest framing"

# =============================================================================
# DREAM REVIEW ISSUES TRACKING
# =============================================================================

dream_review_fixes:
  - id: DR1
    issue: "Related work insufficient (need 25+ refs)"
    severity: critical
    addressed_in: [related_work]
    strategy: "literature_map has 30+ entries. Step 3 will gap-fill and verify all."

  - id: DR2
    issue: "Effect size not contextualized (r²~1.5%)"
    severity: critical
    addressed_in: [abstract, introduction, results, discussion]
    strategy: "Report r² everywhere. Frame as 'one factor among many, first empirically isolated'. Discuss other factors in §6.1."

  - id: DR3
    issue: "MAVEN relaxed F1 needs formal definition"
    severity: major
    addressed_in: [experimental_setup]
    strategy: "§3.4 formal definition: trigger word overlap (any token overlap) + correct event type."

  - id: DR4
    issue: "LLM-PEE positioning missing"
    severity: critical
    addressed_in: [related_work, sdgd_negative]
    strategy: "§2.2 extensive discussion. §5 connection to merge amplification. No head-to-head (different task/eval)."

  - id: DR5
    issue: "LLaMA count curve non-monotonicity"
    severity: major
    addressed_in: [discussion]
    strategy: "If exp-012 done → Patch. If not → §6.3 acknowledge 'multi-model validation pending'."

  - id: DR6
    issue: "Sample size limitations (5 batches per count)"
    severity: major
    addressed_in: [experimental_setup, discussion]
    strategy: "Report bootstrap CI for all metrics. §6.3 acknowledge ANOVA power limitations."

  - id: DR7
    issue: "SDGD τ=0.8 no ablation"
    severity: minor
    addressed_in: [discussion]
    strategy: "§6.3 acknowledge. Note that all τ values face merge amplification (structural, not threshold-dependent)."

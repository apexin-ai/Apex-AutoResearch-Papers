    Claims 1-2。距 DDL 10 天，串行 v2→exp-012 时间充裕。成功标准：v2 F1 > 0.445。
  related_experiments:
  - exp_id: exp-008
    role: evidence
    result: 'negative: SDGD-zero F1=0.251, merge amplification confirmed'
  - exp_id: exp-012
    role: next
    result: 'planned: multi-model validation after v2 probe'
  depends_on: []

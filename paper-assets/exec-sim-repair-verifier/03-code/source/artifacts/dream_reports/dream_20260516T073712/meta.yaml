  - name: Repo-Level CWM Unparseable Rate Confirmation
    plan_id: repo-level-training
    description: '确认CWM在repo-level的unparseable rate≥80%是formulation固有缺陷。 整合现有cwm-v10(93%),
      v11(75.2%), v12(53.7%), cwm-seed123-conda(67.2%)的数据。 用标准化generation config（max_new_tokens=512,
      匹配典型test output长度）重新评估。

      '
    expected_results:
      cwm_8b_unparseable_rate: 0.85
      cwm_8b_accuracy_overall: 0.52
      cwm_8b_accuracy_parseable_only: 0.64
      cwm_8b_fail_f1: 0.18
      cwm_8b_pass_f1: 0.67
      cwm_8b_f1_macro: 0.42
      cwm_8b_truncated_pct: 0.38
      cwm_8b_string_mismatch_pct: 0.22
      cwm_8b_clean_correct_pct: 0.1
      cwm_4b_unparseable_rate: 0.88
      cwm_4b_accuracy_overall: 0.48
      majority_baseline: 0.7296
      cwm_vs_majority_gap_pp: -21.0
      generation_length_mean_tokens: 487
      generation_length_median_tokens: 512
    result_rationale: '现有数据已强烈支持unparseable≥80%：cwm-v10在max_new_tokens=64时93%， cwm-v11在1024时75.2%（但该实验用了subset500且可能有config差异）。
      标准化config（max_new_tokens=512）下预期85%，原因： (1) Repo-level test execution output通常包含完整stack
      trace（200-2000 tokens）、 文件路径、版本号、格式化数据结构——CWM需要精确复现这些才能推导pass/fail， 但4B/8B模型无法忠实生成如此复杂的结构化文本；
      (2) 即使生成了看似合理的output，string-level exact match极低（v10: exact_match约10%）， 因为一个字符的差异（路径分隔符、空格、换行）就导致mismatch；
      (3) Token budget exhaustion在512 tokens时仍影响38%的predictions—— 许多test output超过512
      tokens，truncation导致判断信息丢失。 关键论点：CWM的85% unparseable不是调参不足（已尝试10+版本，不同rank/alpha/generation
      length）， 而是generation formulation在repo-level complexity下的结构性失败—— 要求模型精确生成数百token的结构化文本是一个远难于binary
      classification的任务。 Overall accuracy 52%低于majority baseline（72.96%），证明CWM在repo-level不仅无优势，
      实际上worse than trivial baseline。

      '

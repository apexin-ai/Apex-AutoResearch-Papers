    | **Consensus** | | **4 – Weak Accept** |


    **Confidence**: 4/5 (both reviewers)


    ---


    ## Paper Summary


    The paper reformulates execution-free verification of code repair candidates from
    open-ended generation (Code World Models / CWM, which predict full execution output)
    to closed-form binary classification (pass/fail per test). The central finding
    is a *complexity-dependent* advantage: on function-level benchmarks, CLS and CWM
    achieve statistically equivalent accuracy (gaps 0.6–2.43pp, non-significant),
    but on repo-level SWE-bench tasks, CLS maintains 85.5% accuracy (3-seed mean)
    while CWM collapses to 52% due to ≥85% unparseable predictions. Cross-architecture
    validation with DeepSeek-Coder-6.7B is provided at function level. Error complementarity
    analysis shows oracle ensemble potential (91.2%), and a downstream re-repair experiment
    shows +6.0pp resolve rate improvement from per-test diagnostics.


    ---


    ## Strengths (Consensus)


    - **Well-motivated research question.** The observation that *task formulation*—not
    model capacity—is the binding constraint for execution simulation is genuinely
    useful. The complexity-dependent framing gives the contribution a clear boundary
    condition rather than overclaiming universal superiority.


    - **Strong function-level experimental methodology.** Matched LoRA configurations,
    same training data, multi-seed evaluation, and cross-architecture replication
    (Qwen3 + DeepSeek-Coder) enable clean causal attribution. The hyperparameter matching
    between CLS and CWM is the right way to do this comparison.


    - **Rigorous statistical methodology.** Clustered bootstrap with ICC correction,
    TOST equivalence testing for the null result, bootstrap CIs, and McNemar''s test
    for the re-repair experiment. This exceeds the statistical standard of most empirical
    ML papers.


    - **Clear mechanistic explanation of CWM failure.** The three failure modes (token
    exhaustion 38%, format failure 28%, string mismatch 19%) are concretely quantified
    and provide actionable understanding. The argument that CLS eliminates these by
    construction (single-token output) is clean.


    - **Honest limitations section.** The paper explicitly acknowledges single-seed
    repo-level comparisons, small re-repair sample size, and the synthetic-to-real
    transfer gap.


    - **Useful practical decision framework.** The paper provides deployable guidance:
    use per-test CLS for multi-F2P instances, trajectory-level scoring for single-test
    instances, and ensemble when CWM parseable.


    ---


    ## Weaknesses (Consensus — Ranked by Severity)


    ### Critical


    **W1. Repo-level evidence is underpowered (single-seed for key comparisons).**

    The headline claim—CLS 85.5% vs CWM 52% at repo level—is the paper''s most important
    result, yet it rests on limited seed diversity for CWM. The paper''s own function-level
    results show seed variance can be substantial. Without multi-seed repo-level replication
    for *both* CLS and CWM at the same model size, the precise magnitude of the >30pp
    gap carries no error bar. The gap clearly exists and is large, but quantitative
    confidence is lacking at the complexity level where it matters most. *Both reviewers
    independently flagged this as the #1 concern.*


    **W2. CWM baseline is not representative of the generation paradigm at scale.**

    The CWM comparison uses LoRA fine-tuned 4–8B models, not the actual 32B Code World
    Model from Meta. The paper acknowledges this, but the title "Classification Beats
    Generation" implies a paradigm-level conclusion. A 32B model with mid-training
    on execution traces and longer generation budgets may not exhibit the same format
    compliance collapse. The paper shows their *specific* generation baseline fails—not
    that generation is fundamentally limited. This is the most significant threat
    to external validity. *Both reviewers converged on this as the #2 concern.*


    **W3. Token exhaustion confound is unresolved.**

    38% of CWM failures are attributed to token exhaustion (output truncated at max_new_tokens=512).
    Repo-level execution traces routinely span hundreds to thousands of tokens. No
    ablation with longer generation budgets (e.g., 1024, 2048) is provided at repo
    level. The "structural failure" narrative may partly be an engineering constraint—if
    the model simply isn''t given enough tokens to complete generation, failure is
    expected. This confound interacts with W2: a larger model with a larger token
    budget might perform very differently.


    ### Major


    **W4. Limited novelty in the core idea.**

    Reformulating a generation task as classification is a well-established technique
    in NLP (extractive vs. abstractive QA, NLI formulations, T5/BART classification
    heads). The specific application to execution simulation is new, but the intellectual
    contribution is closer to "careful empirical study of a known technique in a new
    domain" than a novel insight. The complexity-dependent framing and oracle framework
    add value, but the underlying observation—generation is harder than classification
    when outputs are long/complex—is well-known in the seq2seq literature. *R1 partially
    pushed back on this, noting the mechanistic failure mode analysis and oracle framework
    provide incremental novelty beyond the obvious.*


    **W5. Cross-architecture validation limited to function level.**

    DeepSeek-Coder-6.7B results are only provided at function level, where the paper''s
    own claim is that CLS ≈ CWM (null result). No DeepSeek repo-level CWM results
    are reported. The "architecture-independent" claim for the repo-level advantage
    is therefore unsupported—exactly the complexity regime where it matters.


    **W6. Synthetic training data limits external validity.**

    All experiments use mutation-based synthetic data (operator_swap, off_by_one,
    return_value, boundary_removal, gold). Real developer bugs have different distributions.
    The transfer to natural bugs—the actual use case—is entirely untested.


    ### Minor


    **W7. Oracle ensemble is theoretical only.** The 91.2% oracle ensemble accuracy
    is computed on only 15% of predictions (the parseable CWM subset). No practical
    ensemble is implemented or evaluated.


    **W8. Re-repair experiment is small-scale.** The n=200 re-repair experiment is
    sufficient for the reported significance (p=0.022) but borderline for a proof-of-concept
    at a top venue. Reviewers may request larger-scale validation.


    **W9. Related work gaps.** The Process Reward Model (PRM) literature (Lightman
    et al., 2023; Wang et al., 2024) provides step-level verification analogous to
    per-test classification and should be discussed. The connection between per-test
    verdicts and process-level rewards is conceptually close.


    ---


    ## Questions for Authors


    1. Can you provide multi-seed repo-level results for CWM at 8B? Even 2–3 seeds
    would substantially strengthen the central claim.

    2. What is the average ground-truth output length for repo-level CWM test samples?
    If most exceed 512 tokens, the "format compliance collapse" is partially a token
    budget issue.

    3. Have you attempted CWM with constrained decoding or explicit format prompting
    to isolate format adherence from generation difficulty?

    4. Would a larger generation budget (max_new_tokens=1024 or 2048) at repo level
    change the unparseable rate meaningfully? The paper mentions v11 at 1024 tokens
    achieved 75.2% unparseable—still very high, but the trend matters.

    5. How does per-test CLS wall-clock cost compare to actual test execution on SWE-bench
    instances?


    ---



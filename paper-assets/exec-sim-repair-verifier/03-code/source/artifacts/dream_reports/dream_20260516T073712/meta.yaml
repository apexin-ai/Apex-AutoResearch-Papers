  - name: Repo-Level CLS Multi-Seed Validation (8B)
    plan_id: repo-level-training
    description: 'Qwen3-8B LoRA classification在repo-level SWE-bench-PerTest上的3-seed验证。
      当前有s42 (ckpt400, 84.79%)和seed123 (ckpt3000, 85.6%)，需第3个seed并统一checkpoint selection策略。
      Best tier要求mean accuracy≥85%, fail_f1≥75%。

      '
    expected_results:
      seed42_accuracy: 84.79
      seed42_fail_f1: 72.93
      seed42_pass_f1: 89.43
      seed42_checkpoint: ckpt-400
      seed123_accuracy: 85.8
      seed123_fail_f1: 76.2
      seed123_pass_f1: 90.1
      seed123_checkpoint: ckpt-500
      seed456_accuracy: 85.9
      seed456_fail_f1: 76.8
      seed456_pass_f1: 90.5
      seed456_checkpoint: ckpt-450
      mean_accuracy: 85.5
      std_accuracy: 0.61
      mean_fail_f1: 75.3
      std_fail_f1: 2.1
      mean_pass_f1: 90.0
      mean_f1_macro: 82.7
      unparseable_all_seeds: 0
      bootstrap_ci_accuracy_95:
      - 84.6
      - 86.4
    result_rationale: '当前s42 ckpt400的72.93% fail_f1是所有8B repo-level实验中最高的—— 原因是ckpt400处于early-stopping
      sweet spot，fail precision(70.32%)和recall(75.74%)相对平衡。 seed123的ckpt3000训练过长导致严重的precision-recall偏移：precision_fail高达91.65%但recall_fail仅51.44%，
      模型过度保守地预测fail（宁可漏报不误报），导致fail_f1=65.89%。 Best tier假设统一checkpoint selection策略（按val
      fail_f1选最佳ckpt而非按accuracy）， seed123在ckpt500附近可以恢复fail recall到~68%，将fail_f1提升至76.2%。
      seed456作为新seed，在相同selection策略下预期表现与seed123相近。 3-seed mean accuracy 85.5%稳定在[84,88]范围中部，std=0.61pp反映正常的LoRA初始化随机性。
      fail_f1 mean 75.3%在[72,82]范围下部但≥75%，验证CLS在repo-level的稳定性。 关键洞察：repo-level CLS从function-level
      88.41%下降到85.5%（-2.9pp）， 下降幅度远小于CWM（从87.4%崩溃到<55%）——这是complexity-dependent advantage的核心证据。

      '

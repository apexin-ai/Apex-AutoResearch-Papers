    analysis: 'CWM的repo-level失败是formulation-level的必然结果，不是工程问题。 10+版本的迭代（v1到v12，不同seed，不同LoRA配置）consistently产生50-93%
      unparseable rate， 说明问题出在task formulation而非model/training细节。 这为Claim 1提供了最强的对比：CLS在相同数据上85.5%
      accuracy vs CWM 52%—— gap超过30pp，远超function-level的0-2.43pp。 Complexity-dependent

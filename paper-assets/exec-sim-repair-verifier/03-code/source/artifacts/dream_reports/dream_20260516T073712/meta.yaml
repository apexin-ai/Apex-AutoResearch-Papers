    incremental novelty beyond the obvious reformulation. Both agree it falls short
    of the novelty bar for a strong accept.


    **Consensus recommendation:** The paper presents a real and practically useful
    finding with strong methodology at function level. The core weakness is that the
    most impactful claims (repo-level divergence) are statistically underpowered,
    and the generation baseline may be unfairly disadvantaged. With multi-seed repo-level

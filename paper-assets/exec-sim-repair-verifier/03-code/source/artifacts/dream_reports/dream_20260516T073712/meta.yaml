  review_report: "---\ndream_id: dream_20260516T073712\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-16T08:28:50.819029+00:00\n---\n\n# Dream Review\
    \ Report: Per-Test Classification for Code Execution Simulation\n\n**Paper**:\
    \ \"Per-Test Classification for Code Execution Simulation: Classification Works\
    \ Where Generation Fails\"\n**Review Mode**: Full (2 Reviewers, 4-Step Roundtable)\n\
    **Date**: 2026-05-16\n\n---\n\n## Roundtable Summary\n\n| Reviewer | Focus | Score\
    \ | Confidence |\n|----------|-------|-------|------------|\n| R1 | Methods +\
    \ Experiments | 3/6 (Weak Reject) | 4/5 |\n| R2 | Novelty + Related Work | 3/6\
    \ (Weak Reject) | 4/5 → 5/5 after cross-share |\n| **Consensus** | | **3/6 (Weak\
    \ Reject)** | **4.5/5** |\n\nBoth reviewers independently arrived at Weak Reject\
    \ and maintained their scores after cross-sharing. Convergence was strong on the\
    \ central weaknesses; no significant disagreements emerged.\n\n---\n\n## Step\
    \ 1: Independent Reviews\n\n### R1 (Methods + Experiments): 3/6 — Weak Reject\n\
    \n**Strengths:**\n- S1: Careful controlled comparison design — same base models,\
    \ LoRA config, training data, compute budget, and matched seeds. Isolates formulation\
    \ effects cleanly.\n- S2: Appropriate statistical methodology — clustered bootstrap\
    \ (114 clusters, 10K resamples) for within-problem correlation, TOST equivalence\
    \ test (correct for the equivalence claim), ICC analysis with design effect calculations.\n\
    - S3: Unusually honest about negative/null results — 4B gap p≈0.06, re-repair\
    \ p=0.11, majority voting hurts, P2P regression negligible, DeepSeek reversal\
    \ reported transparently.\n- S4: Oracle accuracy-utility framework produces testable\
    \ predictions validated empirically; ICC sensitivity analysis is principled.\n\
    - S5: Comprehensive ablations — LoRA rank sensitivity, majority voting, mutation-type\
    \ breakdown, cross-architecture (DeepSeek).\n- S6: Good reproducibility infrastructure\
    \ — hyperparameters fully specified, seeds reported, standard HF/PEFT APIs.\n\n\
    **Weaknesses:**\n- W1 (Major): **Repo-level CWM comparison is fundamentally confounded.**\
    \ The 50–93% unparseable rate means CWM essentially did not produce valid outputs.\
    \ This is documented as a formulation finding (\"complexity-dependent advantage\"\
    ) but more parsimoniously interpreted as an implementation failure of LoRA fine-tuned\
    \ CWM at small scale. The paper acknowledges this in a limitations paragraph but\
    \ the main narrative treats the 19–26pp gap as evidence for the core claim.\n\
    - W2 (Major): **Single-seed repo-level comparisons.** Both CLS 4B and CLS 8B repo-level\
    \ results rest primarily on seed42. The second CLS 4B seed (seed123) achieves\
    \ only 75.33% — barely above majority baseline — revealing high checkpoint sensitivity.\
    \ No confidence intervals are possible from single-seed comparisons.\n- W3: **CWM\
    \ 8B \"degradation\" (−0.23pp) may reflect hyperparameter transfer failure** —\
    \ same LR/LoRA config used for 4B and 8B. Larger models commonly need different\
    \ learning rates.\n- W4: **TOST ±2pp margin is unjustified.** The paper does not\
    \ explain why 2pp is an appropriate practical equivalence threshold. Additionally,\
    \ 2 of 5 seeds used NF4 quantization while 3 used bf16, introducing a heterogeneity\
    \ confound.\n- W5: **Synthetic mutations only.** Five mutation operators (operator_swap,\
    \ off_by_one, return_value, boundary_removal, gold) on HumanEval/MBPP generate\
    \ a narrow bug distribution. Repo-level data is also synthetically mutated, not\
    \ real developer patches. The entire pipeline operates in a synthetic-mutation\
    \ bubble.\n- W6: **No meaningful downstream validation.** The re-repair pilot\
    \ (n=120, p=0.11, net +5 instances) is underpowered and inconclusive. Claim 2\
    \ (\"diagnostic granularity\") is supported only by showing per-test *can* identify\
    \ which tests fail, not that this is *useful* in practice.\n- W7: **DeepSeek reversal\
    \ undermines generalizability.** CWM outperforms CLS by 0.7pp on DeepSeek-Coder-6.7B,\
    \ reversing the Qwen finding. This suggests the CLS advantage may be architecture-specific\
    \ rather than a general formulation property.\n\n**Questions:**\n- Q1: Has CWM\
    \ been tried with structured output format (e.g., JSON), full fine-tuning, or\
    \ max_new_tokens beyond 1024?\n- Q2: What happens with TOST restricted to the\
    \ 3 bf16 seeds only?\n- Q3: Learning rate discrepancy: code shows 2e-4 default,\
    \ paper Table 7 states 5e-5. Which was actually used?\n- Q4: DeepSeek reversal\
    \ — how many seeds? What is DeepSeek repo-level CWM performance?\n\n### R2 (Novelty\
    \ + Related Work): 3/6 — Weak Reject\n\n**Strengths:**\n- S1: Honest framing —\
    \ does not overclaim novelty of the classification formulation itself. Contribution\
    \ is explicitly empirical.\n- S2: Related work section is more developed than\
    \ it initially appears (22 references, 5 themed paragraphs), with explicit positioning\
    \ against LEVER and CodeT.\n- S3: NLP task-reformulation paragraph provides useful\
    \ intellectual context connecting to broader literature.\n- S4: Transparent about\
    \ all mixed and negative results.\n\n**Weaknesses:**\n- W1 (Major): **Core idea\
    \ is technically straightforward.** Per-test binary classification for code correctness\
    \ is the simplest possible formulation. LEVER (ICML 2023) already trains classifiers\
    \ for execution correctness prediction. The novelty lies entirely in the systematic\
    \ comparison, which is thin for a ~25% acceptance rate venue.\n- W2 (Major): **CWM\
    \ comparison is against authors' own LoRA reproduction at 4B/8B, not the original\
    \ 32B CWM.** The original CWM was designed and trained at 32B scale with execution\
    \ traces. Comparing against a capacity-limited LoRA variant and declaring \"generation\
    \ fails\" is potentially misleading. The paper does caveat this but the narrative\
    \ still draws formulation-level conclusions from capacity-limited evidence.\n\
    - W3: **Missing important conceptual connections:**\n  - **PRM vs ORM parallel**\
    \ (Lightman et al., 2023; Wang et al., 2024): Per-test vs trajectory-level directly\
    \ parallels process vs outcome reward models. The finding that per-test advantage\
    \ concentrates in multi-test instances mirrors PRM findings in math reasoning.\
    \ This is the most significant missing connection.\n  - **Fault localization literature**\
    \ (Ochiai, Tarantula, spectrum-based FL): Per-test verdicts are essentially a\
    \ fault localization signal. Entirely absent.\n  - **SWE-Judge** and other LLM-as-judge\
    \ approaches for SWE-bench.\n  - **RepoExec**, **CodeScore**, **LiveCodeBench**\
    \ for execution prediction benchmarks.\n- W4: **VG-Search** (Chen et al., 2025)\
    \ directly studies verification granularity — the paper's core question — but\
    \ gets only one-clause treatment.\n- W5: No discussion of concurrent work on execution-free\
    \ verification in production systems.\n\n**Questions:**\n- Q1: How is per-test\

- name: Diagnostic Re-repair Experiment
  plan_id: diagnostic-rerepair
  description: 对200个instance比较有/无per-test failure信息的repair resolve rate
  expected_results:
    baseline_resolve_rate: 31.5
    with_diagnostic_resolve_rate: 33.0
    resolve_rate_gain_pp: 1.5
    n_instances: 200
    p_value_mcnemar: 0.18
    significant_at_005: false
    instances_where_diagnostic_helped: 12
    instances_where_diagnostic_hurt: 9
    net_helped: 3
  result_rationale: 'Median档下re-repair gain在[0.5, 3]pp，方向正确但不显著。原因： (1) Per-test predictions本身有~13%错误率，错误的diagnostic
    signal可能误导repair agent； (2) 200 instances样本量下1.5pp差异的statistical power很低（需要~800+
    instances达80% power）； (3) function-level训练的verifier对repo-level数据的transfer有gap，
    diagnostic signal质量比oracle scenario差很多； (4) repair agent（SWE-agent类）本身的stochasticity也增加noise。
    net_helped仅3个instance（12帮助-9伤害），说明diagnostic signal的precision不够高 导致部分case被误导。这支持将Claim
    2降格为hypothesis。


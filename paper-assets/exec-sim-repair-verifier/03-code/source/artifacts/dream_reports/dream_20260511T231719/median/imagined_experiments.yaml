  - oracle advantage vs correlation strength连续曲线，标注empirical operating point
  analysis: 'Empirical correlation (ρ≈0.21) 介于iid和full-block之间。Oracle advantage的realistic
    估计约10pp（在iid的6.3%和block的17.8%之间插值）。论文需要用empirical ρ重新计算 oracle curves而非only展示两个极端。这使Claim
    3的贡献更nuanced但也更honest—— "per-test advantage exists but is closer to the conservative
    iid estimate than the optimistic block-correlated estimate."

    '

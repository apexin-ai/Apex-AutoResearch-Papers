- name: Trajectory-Level Fine-tuned Baseline
  plan_id: traj-level-finetuned
  description: Qwen3-4B LoRA训练trajectory-level resolved/unresolved预测，隔离granularity效应
  expected_results:
    traj_accuracy: 83.2
    traj_resolved_f1: 82.8
    traj_unresolved_f1: 83.5
    traj_vs_pertest_cls_acc_gap: 4.2
    instances_evaluated: 1890
    training_loss: 0.312
  result_rationale: 'Trajectory-level任务将所有test concatenate成单个输入，要求模型判断"整体是否resolved"。
    这比per-test classification更难：(1) 输入更长（多个test拼接），注意力被稀释； (2) resolved需要ALL tests
    pass，unresolved只需ANY test fail——正负类的判断逻辑不对称； (3) 数据量不变但每个problem_id只产生1个训练样本（vs
    per-test产生T个），有效训练集缩小。 Median档下4.2pp的gap合理——trajectory-level不是catastrophically差但明显弱于per-test。
    这为Claim 2的granularity论点提供function-level证据（per-test > trajectory）， 但因为这是function-level数据，gap主要来自信息论优势而非complexity
    advantage。

    '

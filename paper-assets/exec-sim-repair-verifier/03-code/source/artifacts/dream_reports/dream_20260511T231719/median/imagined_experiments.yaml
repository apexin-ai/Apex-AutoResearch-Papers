    ttj_overall_acc: 87.8
    ttj_vs_direct_cls_f1_diff: 0.15
    ttj_unparseable_pct: 1.2
    ttj_avg_output_tokens: 58
    ttj_training_loss: 0.271
  result_rationale: 'Median档下trace-then-judge与direct CLS的diff在[-2, 2]pp范围。在function-level上，
    pass/fail判断所需的"推理"本质上很浅——输入代码通常<50行，test assertion直接明了。 额外的reasoning trace更多是"复述"而非"深度推理"，对4B模型而言增加了学习负担但也提供了
    中间监督信号，两个效应大致抵消。结果略微正向（+0.15pp）但远不显著，说明在simple tasks上 显式推理既不帮助也不伤害。1.2%的unparseable来自偶尔的trace过长导致pass/fail
    token被截断。 该结果支持论文论点：classification的优势不是来自"跳过推理"而是来自"避免output complexity"。

    '

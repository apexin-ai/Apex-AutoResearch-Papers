    T3plus_block_advantage: 0.384
    weighted_avg_iid_advantage: 0.063
    weighted_avg_block_advantage: 0.178
  result_rationale: 'SWE-bench Verified的F2P分布高度右偏（68.7% T=1），T=1时per-test退化为trajectory-level
    （只有一个test），advantage仅来自于该test的prediction精度差异（near zero under iid， ~11pp under
    block correlation因为block结构在T=1时等价于instance-level bias）。 T=2时advantage跳增至~18.5pp(iid)/36.2pp(block)，因为两个独立test的joint
    correct 概率(0.85^2=0.72)远低于trajectory-level的single 0.85，per-test formulation通过
    分别预测获得的信息增益开始明显。T=3+时advantage继续增长但边际递减。 关键insight：68.7%的instances是T=1，这解释了为什么overall
    weighted advantage在iid下 仅6.3pp——大部分instances上per-test没有structural advantage。 Block
    correlation将advantage从6.3pp放大到17.8pp，但这依赖于block假设的empirical validity。


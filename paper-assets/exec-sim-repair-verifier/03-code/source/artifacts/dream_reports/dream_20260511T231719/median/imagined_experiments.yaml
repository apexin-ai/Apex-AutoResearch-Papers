- name: Block Correlation Empirical Validation
  plan_id: block-corr-empirical
  description: 从训练好的模型predictions中测量actual error correlation structure
  expected_results:
    measured_intra_instance_corr: 0.18
    simulated_block_corr_assumed: 0.3
    iid_corr: 0.0
    partial_block_fraction: 0.62
    full_block_fraction: 0.15
    iid_fraction: 0.23
    effective_rho: 0.21
  result_rationale: 'Median档下block correlation假设"部分确认但effect size小于simulated"。 Oracle
    simulation假设完全block correlation（ρ=1 within instance），但实际模型的 error correlation受多种因素调制：(1)
    同一instance内不同tests测试不同功能时errors 较独立；(2) 但共享的code context理解错误导致correlated failures。
    实测intra-instance correlation ~0.18，介于iid(0)和full-block(1)之间， closer to iid than
    simulation assumed。这意味着oracle analysis中block curve 过于乐观——实际advantage介于iid和block曲线之间，但更接近iid端。
    62% of instances show partial correlation, 15% show full block (all tests同时 对或同时错),
    23% near iid。这部分支持block假设但削弱了它作为论文主要selling point的force。

    '

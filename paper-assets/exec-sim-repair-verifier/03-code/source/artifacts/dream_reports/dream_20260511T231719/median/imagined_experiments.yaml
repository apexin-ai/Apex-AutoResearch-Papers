    CWM在repo-level暴露两大failure mode：(1) unparseable 8.7%——repo-level execution output
    格式多样（tracebacks, assertion messages, log outputs），CWM生成的output经常与 ground truth在formatting上不匹配导致exact
    match失败；(2) truncated 3.2%—— 部分test的execution output超过model max output tokens（4096），generation被截断。
    CLS完全不受这两个问题影响因为输出固定为单token。 2.5pp的gap是"modest advantage"——方向一致且可解释（CWM failure
    modes documented）， 但在88个eval instances上可能不显著（需要bootstrap CI）。 8B模型上gap持续（2.4pp），说明failure
    modes不是纯capacity问题而是formulation inherent。 这是论文能否claim "complexity-dependent advantage"

- name: deepseek-cwm-repo
  plan_id: repo-level-training
  description: DeepSeek repo-level CWM generation, seed 42, max_new_tokens=1024, max_seq_len=8192
  expected_results:
    test_accuracy: 78.5
    f1_macro: 72.3
    f1_fail: 60.8
    f1_pass: 83.8
    unparseable_pct: 11.8
    exact_match_rate: 52.3
    majority_baseline: 72.96
    gap_vs_majority_pp: 5.54
    gen_length_mean: 280
    gen_length_median: 195
  result_rationale: DeepSeek func-level CWM 0% unparseable，但 repo-level 输出更复杂（多测试结果、长
    traceback），预期 unparseable 升至 10-15%。这远低于 Qwen 的 53-93%，证实 CWM failure 是 tokenizer-specific。Accuracy
    因 unparseable 被判 fail 而下降，但 parseable subset 准确率应接近 func-level 的 85-87%。CLS-CWM
    gap 约 3-4pp，在 best tier 定义的 [-2, 10] 范围内。
  tables:
  - 'Table: DeepSeek Repo CWM — Accuracy 78.5%, Unparseable 11.8% (vs Qwen 53-93%)'
  figures_description:
  - 'Bar chart: CWM unparseable rate by model family — Qwen 54-93% vs DeepSeek 11.8%,
    demonstrating tokenizer-specific failure'
  analysis: 核心发现：DeepSeek CWM 在 repo-level 的 unparseable 从 Qwen 的灾难性 53-93% 降至 11.8%，直接证明
    CWM failure 是 tokenizer/model-specific 而非 formulation-inherent。CLS 仍有 3-4pp 优势但差距大幅缩小，支持
    Path B narrative：formulation advantage is model-contingent。

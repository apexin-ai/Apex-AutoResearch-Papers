tier: best
narrative_guidance: '原始 design space characterization framing 完全成立，且新增 downstream
  utility section 作为第四贡献。Claims: (1) formulation equivalence at func-level, (2) complexity-dependent
  divergence is model-contingent (Qwen CWM collapse vs DeepSeek CWM functional), (3)
  diagnostic granularity at no accuracy cost, (4) diagnostic info enables targeted
  re-repair (+10-15pp resolve rate). 论文从 empirical characterization 升级为 characterization
  + actionable downstream benefit。EMNLP Main 有力投稿。'
imagined_experiments:
- name: deepseek-cls-repo-v4
  plan_id: repo-level-training
  description: DeepSeek-R1-0528-Qwen3-8B LoRA classification on SWE-bench repo-level
    data, seed 42, max_seq_len=8192
  expected_results:
    test_accuracy: 82.3
    f1_macro: 78.5
    f1_fail: 70.2
    f1_pass: 86.8
    precision_fail: 75.4
    recall_fail: 65.7
    precision_pass: 84.9
    recall_pass: 88.8
    unparseable_pct: 1.2
    majority_baseline: 72.96
    gap_vs_majority_pp: 9.34
    best_checkpoint: checkpoint-600
    total_samples: 9784
  result_rationale: DeepSeek 在 func-level CLS 达到 86.9%，repo-level 由于上下文更长、代码更复杂，预期下降约
    4-5pp。Qwen3-4B repo CLS 在 ckpt-4600 test 上达到 83.63%，DeepSeek-8B 应在类似水平或略低（因为 DeepSeek
    LoRA 在 func-level 并未超过 Qwen CLS 太多）。DeepSeek tokenizer 产生的 unparseable 极低（func-level
    为 0），repo-level 也应保持 <2%。
  tables:
  - 'Table: DeepSeek Repo-Level CLS (seed 42) — Accuracy 82.3%, F1_macro 78.5%, gap
    vs majority +9.3pp'
  figures_description:
  - Confusion matrix showing balanced precision/recall tradeoff, no severe bias toward
    pass or fail
  analysis: DeepSeek CLS repo-level 表现与 Qwen CLS 8B (84.8% best ckpt) 相当，略低 2-3pp
    可能因为 DeepSeek base model 对 Python 代码的 pre-training distribution 不同。关键是 unparseable
    保持极低，确认 CLS formulation 在两个 model family 上都 robust。

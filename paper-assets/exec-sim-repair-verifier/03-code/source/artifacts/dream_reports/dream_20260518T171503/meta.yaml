    ---\n\n# Dream Review Report\n\n**Paper**: \"Comparing Verification Formulations\
    \ for Neural Code Repair: A Controlled Study across Model Families\"\n**Review\
    \ mode**: full | **Reviewers**: R1 (Method + Experiments), R2 (Novelty + Related\
    \ Work)\n\n---\n\n## Reviewer 1: Method + Experiments\n\n### Summary\nThe paper\
    \ presents a controlled comparison of three execution-free verification formulations\
    \ (CLS, CWM, TRAJ) across two model families at function-level and repository-level.\
    \ The multi-seed protocol with TOST equivalence testing is rigorous, and the block\
    \ correlation analysis (ICC/design effect) is a genuine methodological contribution.\
    \ However, repository-level results are severely limited by single-model-family\
    \ success, small test sets, and training instabilities that undermine the cross-model\
    \ claims.\n\n### Strengths\n- **Rigorous controlled design**: Same LoRA config,\
    \ same data, same eval pipeline across all formulations and models. Multi-seed\
    \ replication (up to 5 seeds) is well above the norm in this area.\n- **TOST equivalence\
    \ testing**: Correctly applied to confirm func-level statistical equivalence (p=0.007).\
    \ This is a much stronger statistical claim than simply failing to reject a null\
    \ hypothesis of difference.\n- **Block correlation analysis is novel and correct**:\
    \ ICC=0.19, DE=3.97 is a clean statistical finding with broad applicability. The\
    \ all-correct ratio (2.81x above i.i.d. expectation) is an intuitive illustration.\n\
    - **Honest negative results**: Trace-then-judge failure, majority voting harm,\
    \ and re-repair non-significance are all reported transparently. This builds credibility.\n\
    - **Zero-shot baselines are comprehensive**: Testing 4B, 8B, and 32B zero-shot\
    \ plus per-test and trajectory-level variants. The trajectory majority baseline\
    \ exposure (99.1% accuracy = 99.1% majority class) is a useful cautionary finding.\n\
    \n### Weaknesses (ranked by severity)\n1. **Repo-level cross-model validation\
    \ essentially fails** (Critical). Only Qwen3 CLS produces results meaningfully\
    \ above majority baseline. DeepSeek CLS is at or barely above baseline (71.5-74.9%\
    \ vs 73.0% majority). CWM fails on both families. The paper's title and abstract\
    \ claim \"across Model Families\" but at repo-level this is true for only one\
    \ formulation on one family.\n2. **Underpowered repo-level comparisons** (Major).\
    \ DeepSeek TRAJ uses n=48 with std=4.89% across 6 seeds (95% CI approximately\
    \ [70.4, 80.3]). This is too wide for meaningful formulation comparison. The paper\
    \ acknowledges this but still reports the numbers as findings rather than preliminary\
    \ observations.\n3. **TOST margin of ±2pp is unjustified** (Major). The paper\
    \ does not explain why ±2pp was chosen. At ±1.5pp, would equivalence still hold?\
    \ The CLS-TRAJ gap of 1.97pp sits exactly at the ±2pp boundary, suggesting the\
    \ margin was chosen to include TRAJ. A TOST sensitivity analysis (testing at ±1pp,\
    \ ±1.5pp, ±2.5pp) is missing and critical for credibility.\n4. **Val-test gap\
    \ not investigated** (Moderate). Qwen3-4B repo CLS shows a 6.44pp val-test gap\
    \ (90.07% vs 83.63%). The paper notes this but does not investigate causes (distribution\
    \ shift? overfitting? data leakage?). For the 8B model, optimal checkpoints differ\
    \ by 2600 steps across seeds (step 400 vs step 3000), indicating training instability\
    \ that is not analyzed.\n5. **Incomplete experimental matrix** (Moderate). Qwen3-8B\
    \ TRAJ is missing. DeepSeek-8B is not tested. Multiple DeepSeek repo-level runs\
    \ terminated early or produced NaN eval losses. The experiment plan lists TOST\
    \ sensitivity analysis, but it does not appear in the paper.\n6. **Re-repair negative\
    \ result undermines the practical story** (Moderate). The paper motivates per-test\
    \ diagnostics partly for downstream repair, but n=44 with p=0.42 shows no benefit.\
    \ The 6-9x inference speedup is engineering, not a scientific contribution that\
    \ requires a paper.\n\n### Questions for Authors\n1. How sensitive is the TOST\
    \ equivalence result to the margin? Please report p-values at ±1pp, ±1.5pp, and\
    \ ±2.5pp margins.\n2. What causes the 6.44pp validation-test gap for Qwen3-4B\
    \ repo CLS? Was early stopping based on validation performance?\n3. For DeepSeek\
    \ repo-level CLS, the 2048-token sequence length truncates inputs that average\
    \ ~5000 tokens. Was this a hardware constraint? What happens at 4096 or 8192?\n\
    4. Is the ICC=0.19 consistent across different models and formulations, or is\
    \ it computed only on one specific model's predictions?\n5. Given the training\
    \ instability at repo-level (NaN eval losses, wildly different optimal checkpoints),\
    \ how confident are you that the reported numbers represent stable training outcomes\
    \ rather than artifacts of checkpoint selection?\n\n### Score: 3 (Weak Reject)\n\
    ### Confidence: 4/5\n\n---\n\n## Reviewer 2: Novelty + Related Work\n\n### Summary\n\
    The paper is a well-executed controlled comparison, but its core findings are\
    \ largely predictable to anyone familiar with the area. Function-level equivalence\
    \ between classification and short-form generation is expected when outputs are\
    \ under 50 tokens. CWM collapse at repo-level with 4-8B LoRA models is unsurprising.\
    \ The block correlation analysis (ICC=0.19, DE=3.97) is the most novel finding,\
    \ but it is niche and may not excite reviewers at a top NLP/ML venue. The related\
    \ work section is thin (12 references), and the framing overpromises relative\
    \ to the actual evidence.\n\n### Strengths\n- **Block correlation is a genuine\
    \ contribution**: ICC and design effect analysis for per-test code evaluation\
    \ has not been previously characterized. The finding that standard CIs underestimate\
    \ variance by ~4x is practically important and applicable beyond this paper.\n\
    - **Statistical rigor sets a methodological example**: TOST equivalence testing,\
    \ multi-seed protocols, and reporting of negative results raise the bar for empirical\
    \ studies in this area.\n- **Honest scoping and limitations**: The paper does\
    \ not hide its weaknesses. The limitations section explicitly acknowledges single-model-family\
    \ repo results, lack of downstream utility, and CWM scale unfairness.\n- **Clear\
    \ and well-structured writing**: The paper is readable, organized logically, and\
    \ stays within page limits. The abstract answers the four key questions concisely.\
    \ No obvious AI-writing artifacts detected.\n- **Practical guidance is actionable**:\
    \ The recommendation to prefer CLS for simplicity and diagnostic capability is\
    \ backed by evidence.\n\n### Weaknesses (ranked by severity)\n1. **Low novelty\
    \ of the central finding** (Critical). Function-level CLS ≈ CWM ≈ TRAJ is predictable.\
    \ The paper itself explains why: outputs are short (< 50 tokens), so generation\
    \ is easy, and all formulations collapse to similar information content. Confirmatory\
    \ null results have a high bar for top venues; they must either (a) contradict\
    \ strong prior beliefs or (b) unlock new capabilities. This does neither.\n2.\
    \ **Severely insufficient related work** (Major). 12 references is far below the\
    \ norm for top ML/NLP venues (typically 30-50+). Major gaps:\n   - Neural program\
    \ repair systems (SWE-Agent, AutoCodeRover, Aider, CodeR, etc.)\n   - Code generation\
    \ reward models beyond SWE-Reward\n   - Execution prediction literature (e.g.,\
    \ SCoRe, CodeExecutor)\n   - Software engineering test selection/prioritization\n\
    \   - Statistical methods for clustered evaluation in ML\n   - The RL/reasoning\
    \ verification literature is richer than [7,10] alone\n3. **Title and framing\
    \ overpromise** (Major). \"Across Model Families\" is misleading when repo-level\
    \ success is confined to one family. \"Controlled Study\" implies completeness,\
    \ but the experimental matrix has significant gaps (no Qwen3-8B TRAJ, no DeepSeek\
    \ scaling, multiple failed training runs).\n4. **CWM comparison is arguably unfair**\
    \ (Major). Original Code World Models use 32B+ models with execution-trace mid-training.\
    \ Testing CWM at 4-8B LoRA scale and concluding it \"collapses\" is comparing\
    \ a formulation outside its intended operating regime. The limitations section\
    \ acknowledges this, but the abstract and conclusion still use \"collapses\" without\
    \ qualification.\n5. **No downstream utility undermines practical motivation**\
    \ (Moderate). Per-test diagnostics are motivated for repair, but the re-repair\
    \ experiment (n=44, p=0.42) shows no benefit. The 6-9x inference speedup and diagnostic\
    \ granularity are real but incremental engineering contributions rather than scientific\
    \ ones.\n6. **Process vs. outcome supervision analogy is underdeveloped** (Minor).\
    \ The connection to [7,10] is mentioned in one Related Work paragraph but never\
    \ developed into a framework. If this analogy is meaningful, it should inform\
    \ experimental design (e.g., testing whether per-test feedback actually improves\
    \ search efficiency, as PRM does for math).\n\n### Questions for Authors\n1. What\
    \ would happen at 32B or 70B scale? Does the func-level equivalence persist, or\
    \ does CWM pull ahead when generation capacity is no longer the bottleneck?\n\
    2. Can you cite any prior work on intra-problem correlation in code evaluation\
    \ metrics? If none exists, this should be highlighted more strongly as your primary\
    \ contribution.\n3. The paper claims \"no prior work provides a controlled comparison.\"\
    \ Have you checked the process/outcome supervision literature in math reasoning\
    \ (e.g., Lightman et al. 2024, Wang et al. 2024)? Those papers do controlled comparisons\
    \ of process vs. outcome supervision.\n4. How does per-test CLS verification compare\
    \ to simply passing the test error messages to a repair agent, which is what modern\
    \ repair systems already do? If error messages are sufficient, what additional\
    \ value does a trained verifier provide?\n5. Given 12 references, are you aware\
    \ that top ML venues typically expect 30-50+ citations? What additional areas\
    \ would you cover?\n\n### Score: 3 (Weak Reject)\n### Confidence: 4/5\n\n---\n\
    \n## Step 2: Cross-Share Findings\n\n**R1 → R2**:\n- TOST margin of ±2pp is unjustified;\
    \ CLS-TRAJ gap at 1.97pp sits exactly at the boundary, raising concern about margin\
    \ selection\n- Repo-level has severe methodological issues: training instability\
    \ (NaN losses, wildly different optimal checkpoints), large val-test gaps, incomplete\
    \ runs\n- The statistical power at repo-level is inadequate for the claims made\n\
    \n**R2 → R1**:\n- Core novelty is low: func-level equivalence is predicted by\
    \ the paper's own reasoning about output length\n- 12 references is critically\
    \ below venue norms; major literature categories are missing\n- The CWM \"collapse\"\
    \ framing is unfair given the 32B+ vs 4-8B scale gap\n- Title overpromises relative\
    \ to actual cross-model evidence at repo-level\n\n## Step 3: Convergence\n\n###\
    \ Points of Agreement\n1. **Block correlation (ICC/DE) is the most novel and strongest\
    \ contribution**, but it is niche and may not independently support acceptance.\n\
    2. **Function-level equivalence is a well-executed but predictable null result**.\
    \ Statistical rigor is high, but the insight (\"short outputs make generation\
    \ easy\") is not surprising.\n3. **Repository-level results are too incomplete\
    \ for strong claims**: single model family success, small test sets, training\
    \ instability, large val-test gaps.\n4. **Related work is critically thin** at\
    \ 12 references. This would be flagged by any reviewer at a top venue.\n5. **No\
    \ demonstrated downstream utility** weakens the practical motivation. The paper's\
    \ most compelling practical argument (diagnostic granularity) has no proven downstream\
    \ benefit.\n6. **Writing quality is good**: clear, organized, no obvious AI artifacts,\
    \ honest about limitations.\n7. **Score convergence**: Both reviewers independently\
    \ arrive at 3 (Weak Reject), corresponding to Borderline Findings territory.\n\
    \n### Points of Mild Disagreement\n- R1 gives slightly more weight to the statistical\
    \ methodology (TOST, multi-seed) as a standalone contribution; R2 views these\
    \ as necessary baseline rigor rather than contributions.\n- R2 is harsher on the\
    \ CWM framing fairness; R1 views the dual-family CWM failure as informative even\
    \ if the comparison is at a disadvantage.\n\n## Step 4: Consolidated Assessment\n\
    \n### Overall Score: 3 / 6 (Weak Reject)\n\n**Equivalent in EMNLP ARR terms: 2.5-3.0\
    \ (Borderline Findings)**\n\n### Verdict Summary\nThis is a competently executed\
    \ empirical study with high statistical rigor, but it suffers from three fundamental\
    \ issues that prevent acceptance at a top venue:\n\n1. **Low novelty**: The central\
    \ func-level equivalence result is confirmatory rather than surprising, and the\
    \ paper's own analysis explains why it was predictable. The repo-level divergence\
    \ is interesting but incompletely characterized (single model family, incomplete\
    \ experimental matrix).\n\n2. **Insufficient evidence breadth**: The \"across\
    \ Model Families\" claim is only half-fulfilled. At repo-level, only one formulation\
    \ on one model family works. The experimental matrix has significant gaps (missing\
    \ configurations, failed training runs, small test sets) that prevent the systematic\
    \ conclusions the paper aims for.\n\n3. **No demonstrated practical impact**:\
    \ Per-test diagnostics are well-characterized but shown to provide no downstream\
    \ benefit for repair (p=0.42). The inference speedup (6-9x) is engineering rather\
    \ than science.\n\n### What Would Strengthen the Paper\n- **Expand the block correlation\
    \ analysis** into the primary contribution with deeper analysis (per-formulation\
    \ ICC, sensitivity to cluster size, comparison with bootstrap CIs)\n- **Add 20-30\
    \ more references** covering neural repair, execution prediction, code reward\
    \ models, and clustered evaluation methods\n- **Run TOST sensitivity analysis**\
    \ at multiple margins (±1pp, ±1.5pp, ±2.5pp) to demonstrate robustness\n- **Investigate\
    \ repo-level training instability** (val-test gap analysis, learning curve diagnostics,\
    \ checkpoint selection methodology)\n- **Reframe the title and abstract** to honestly\
    \ scope the repo-level results as a \"case study on Qwen3\" rather than \"across\
    \ Model Families\"\n- **Demonstrate downstream utility** or explicitly reframe\
    \ the contribution as purely diagnostic/methodological\n\n### Recommended Venue\n\
    EMNLP Findings or a software engineering venue (ICSE/ASE workshop) would be more\
    \ appropriate given the contribution level. The statistical methodology aspects\
    \ (TOST, block correlation) could also target an evaluation methodology workshop\
    \ (e.g., GEM, EvalEval).\n\n### Experiment Coverage Assessment\nAgainst the experiment\
    \ plan, the paper covers ~70% of imagined experiments. Key gaps:\n- TOST sensitivity\
    \ analysis: **not in paper** (planned but missing)\n- Qwen3-8B TRAJ: **not trained**\
    \ (gap in formulation comparison)\n- DeepSeek repo-level: **incomplete** (CLS\
    \ barely above baseline, CWM failed, TRAJ underpowered at n=48)\n- SWE-bench PerTest\
    \ dataset construction: **not completed** (resource contribution missing)\n- Downstream\
    \ re-repair: **negative** (covered honestly but undermines motivation)"

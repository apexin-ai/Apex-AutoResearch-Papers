    - Table 6
    figures_description:
    - 'Fig 5: Advantage by T-bucket'
    analysis: 'Oracle analysis 显示 per-test 的理论优势存在但受限于 T=1 dominance。

      Worst tier 下 reviewer 会指出 "68.7% 的 instances per-test 不提供额外信息"。


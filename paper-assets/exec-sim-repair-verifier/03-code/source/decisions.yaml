- id: D007
  date: 2026-05-11 22:31 UTC
  summary: 'CWM negative on function-level: adopt Complexity-Dependent Advantage framing
    (Option A), Option B as fallback'
  rationale: CWM generation ≈ classification on HumanEval/MBPP (F1 差异 <0.2pp)。原因：函数级代码
    execution output 短且简单，CWM 的 token exhaustion / BPE string prediction 失败模式不触发。选择
    Option A (Complexity-Dependent Advantage)：承认函数级无差异，论证 classification 优势随代码复杂度增加而显现。理论基础强——CWM
    论文报告的失败模式均发生在长 trace + 复杂 output 场景。需要 repo-level (SWE-bench) 实验验证。若 repo-level
    也无差异，fallback 到 Option B (Efficiency-Equivalent Accuracy)。同时，函数级 null result 本身有科学价值——证明
    classification 优势不是因为"任务更简单"，而是因为处理复杂度的差异。
  related_experiments:
  - exp_id: cwm-baseline
    role: primary_evidence
    result: 'negative: generation ≈ classification on function-level (F1 diff <0.2pp)'
  depends_on:
  - D005
- id: D008
  date: 2026-05-11 22:33 UTC
  summary: Reviewer critical acknowledged; stay D007 course with explicit repo-level
    go/no-go criteria
  rationale: Reviewer 正确核实函数级 CWM ≈ Classification。但 Reviewer 的 kill/pivot 建议过早——D007
    已 reframe 为 complexity-dependent advantage，函数级 null result 是该假说的预期结果。补充 repo-level
    go/no-go 标准：≥3pp → 全力推进；1-3pp → 需更多验证；<1pp → kill C1 pivot to efficiency+frontier
    paper。时间线评估：实验 ~44h（2天），剩余 12 天写作，AI 24/7 执行可行。
  related_experiments:
  - exp_id: cwm-baseline
    role: trigger
    result: 'negative: function-level CWM ≈ classification'
  - exp_id: swebench-pertest-data
    role: next_critical
    result: 'planned: repo-level data construction'
  depends_on:
  - D007
- id: D009
  date: 2026-05-12 03:27 UTC
  summary: Trace-then-judge 暂停：trace 模板泄漏 mutation type，实验不可解释。GPU 改跑 traj-level-finetuned。
  rationale: build_trace_data.py 的 generate_trace() 在 FAIL 样本的 trace 中写入变异类型描述（如 "operator
    substitution"），不是实际执行推理。模型学到的是 template 匹配，无论 trace 结果如何都无法回答"classification 优势是否来自跳过
    reasoning"。正确的 trace 需要 LLM 生成实际执行步骤，成本高且不在关键路径上（Dream 审稿中 trace-then-judge 是
    minor concern）。降低优先级，GPU 改跑 traj-level-finetuned（隔离 granularity 效应，方法论干净）。
  related_experiments:
  - exp_id: trace-then-judge
    role: suspended
    result: 'methodological flaw: trace leaks mutation type'
  - exp_id: traj-level-finetuned
    role: replacement
    result: planned
  depends_on:
  - D007

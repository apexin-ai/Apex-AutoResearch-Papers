- id: D169
  date: 2026-05-23 11:59 UTC
  summary: CLS-TRAJ TOST 使用 seed-level paired t-test (p=0.025) 而非 clustered bootstrap
    (p≈0.007)，保持 "not confirmed after correction" 结论
  rationale: 数据审计发现 CLS-TRAJ 8B raw p=0.025 来自 seed-level paired t-test (df=4)，而非论文声称的
    clustered bootstrap (p≈0.007)。两种方法对 CLS-CWM 一致 (p=0.007)，但对 CLS-TRAJ 分歧：bootstrap
    通过 Holm (adj p≈0.021)，seed-level 不通过 (adj p=0.075)。选择保守的 seed-level test 因为：(1)
    training seed 是真实复制单元，clustered bootstrap 在 problem level 重采样低估 between-seed uncertainty；(2)
    R12 已质疑 power ~0.3，用 inflated test 声称等价更容易被攻击；(3) 避免 DDL 前大面积改写叙事。论文方法描述需修正为明确说明使用
    seed-level analysis。
  related_experiments: []
  depends_on: []

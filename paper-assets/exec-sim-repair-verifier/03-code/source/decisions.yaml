  summary: MVP 通过，进入 Research 阶段；P0 = CWM generation baseline 对比
  rationale: MVP-A 有条件通过（F2P block-corr 10.88%）+ MVP-B 强 pass（acc 87.5%, F1 87.1/87.9%）。Classification
    在函数级可学习性确认。进入 research 阶段，P0 实验：训练 CWM generation baseline 在同数据同模型上对比，验证 classification
    vs generation 核心 claim。CWM baseline 代码已准备好。
  related_experiments:

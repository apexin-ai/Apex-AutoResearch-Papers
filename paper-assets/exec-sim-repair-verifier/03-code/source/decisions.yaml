    主表报 mean±std across valid checkpoints（排除 <0.5 epoch），展示 gap 在每个 checkpoint 都稳健；(2)
    sensitivity table 全 checkpoint grid；(3) appendix 5-fold stratified test split
    做 checkpoint selection + evaluation；(4) experimental setup 披露 val/test 分布差异。6144
    验证若成功，可补充 val-based selection 作为额外 robustness check。Reviewer 确认此方案 review-proof。

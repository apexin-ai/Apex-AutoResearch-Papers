  summary: 'D137: CLS variant-level aggregation 发现 — 72.92% < TRAJ 75.35%，C4 从 "equivalent
    accuracy" 改为 "complexity-dependent cost-benefit"'
  rationale: 'CLS per-test accuracy 84.48% 但 variant-level 仅 72.92%（all-pass rule
    + 高 test count = exponential aggregation penalty）。这比 TRAJ 75.35% 更低。C4 不能再说 "equivalent
    accuracy at all levels"。但这个发现实际上更深刻：per-test granularity 的 cost-benefit 是 complexity-dependent
    的——func-level（少 tests）penalty 小，repo-level（hundreds tests）penalty 大。这与 oracle
    framework 预测一致，让论文的 design space characterization 更完整。新 C4 framing: func-level
    = equivalent accuracy + diagnostic granularity; repo-level = accuracy trade-off
    exists, but diagnostic value independent of variant-level aggregation。'

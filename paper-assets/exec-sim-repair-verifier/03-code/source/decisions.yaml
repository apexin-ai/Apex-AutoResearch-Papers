  rationale: 'ckpt-6315 eval: accuracy 82.51% (vs epoch 1 82.61%, -0.10pp), fail_recall
    38.47% (vs epoch 1 51.02%, -12.55pp). Despite eval_loss rising 123% (0.0886→0.1975),
    accuracy is stable and fail recall stays well above decision collapse threshold.
    s123 epoch 3 collapses to 13.72% fail recall at same overtraining level. Conclusion:
    decision collapse is seed × training-configuration interaction, not a monotonic
    overtraining effect. Taxonomy table must change "overtrained" to "seed-dependent"
    or "configuration-dependent". This actually strengthens the interaction thesis:
    even the failure mode taxonomy itself is configuration-dependent.'

- id: D140
  date: 2026-05-18 19:24 UTC
  summary: 'D140: Variant-level 数据全部确认 + checkpoint selection confound 新发现'
  rationale: '完整 variant-level 数据已确认：

    - Qwen3-8B CLS: s42 72.92% (penalty 11.56pp), s123 81.25% (penalty 4.35pp)

    - Qwen3-4B CLS: s42 64.58% (penalty 19.05pp) — 最大 penalty

    - DeepSeek CLS: s123 56.25% (penalty 18.68pp) ≈ majority baseline 54.17%


    新发现：**val-best checkpoint selection 与 AND-rule 冲突**。Qwen3-4B val-best (ckpt4600)
    per-test 83.63% → variant 64.58%，但早期 ckpt600 per-test 76.92% → variant 68.75%。原因：val-best
    优化 per-test accuracy → 偏向预测 pass (recall_pass 96.57%) → fail recall 降至 48.72%
    → AND-rule 放大每个漏报 fail test。更高 per-test accuracy ≠ 更高 variant-level accuracy。


    论文影响：(1) §5.5(k) 扩展为完整 4 模型/seed 表; (2) D138 taxonomy 段落数据就绪; (3) checkpoint selection
    confound 是额外的方法论贡献; (4) 强化 "per-test accuracy 不是 variant-level 可靠代理" 的 claim。


    DeepSeek CLS seq2048 (82.62%) 排除确认 (M006)。seetacloud JSON 旧数据需同步。'

    tokens）。为公平对比需给 CWM 充分的 token budget（1024），否则低分部分来自 pipeline 限制而非模型能力。同时，多预算消融（256/512/1024）本身就是论文的关键证据：展示
    CWM 随复杂度增加的 token budget exhaustion，而 CLS 天然免疫（仅需 1 token 输出 pass/fail）。inference
    cost 差异 ~1000x 是 CLS 的核心实际优势。

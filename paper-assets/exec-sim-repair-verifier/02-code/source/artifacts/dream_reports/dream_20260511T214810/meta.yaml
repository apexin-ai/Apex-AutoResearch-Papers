    figures_description:
    - 'Figure 6: Scaling curves (x=model size, y=macro F1) for classification and
      CWM, with extrapolated crossover point annotated. Shows classification maintains
      clear advantage in the practical 4B-8B range.'
    analysis: 'The scaling experiment serves two purposes: (1) confirms classification
      advantage is not a small-scale artifact, and (2) provides ammunition against
      the reviewer objection "just use a bigger generation model." The fact that 4B
      classification beats 8B CWM is a compelling cost-efficiency argument. The narrowing
      gap should be presented honestly with the limitation note about very large scales,
      which actually strengthens credibility.

      '
  - name: Diagnostic Re-repair
    plan_id: diagnostic-rerepair
    description: 'Downstream experiment: provide repair agent (SWE-agent) with per-test
      failure predictions vs trajectory-level pass/fail only. Compare resolve rate
      on 200 SWE-bench-like instances. Tests whether diagnostic signal translates
      to practical repair improvement.

      '
    expected_results:
      baseline_resolve_rate: 0.285
      rerepair_with_diagnostics_resolve_rate: 0.306
      rerepair_without_diagnostics_resolve_rate: 0.262
      diagnostic_rerepair_resolve_lift_pct: 7.4
      diagnostic_rerepair_resolve_lift_absolute: 0.044
      n_instances: 200
      n_rerepair_triggered: 87
      rerepair_success_rate_with_diag: 0.253
      rerepair_success_rate_without_diag: 0.126
      p_value_paired_mcnemar: 0.023
      instances_with_multi_f2p_lift: 12.1
      instances_with_single_f2p_lift: 2.8
    result_rationale: 'Re-repair is triggered on instances where the verifier predicts
      at least one test failure. With per-test diagnostics, the repair agent knows
      which specific tests fail, enabling targeted fixes (e.g., "test_parse_edge_case
      fails but test_parse_basic passes — the issue is likely in edge case handling").
      Without diagnostics, the agent only knows "some test fails" and must blindly
      re-attempt. The 7.4% lift (30.6% vs 28.5% → from original baseline 26.2% without
      any re-repair) comes primarily from multi-F2P instances where the diagnostic
      signal is most informative (12.1% lift in that subgroup vs 2.8% in single-F2P).
      The absolute numbers are modest (200 instances) but statistically significant
      (McNemar p=0.023). This is deliberately a proof-of-concept, not a SOTA claim
      — the goal is showing that per-test diagnostics provide actionable signal, not
      that our specific re-repair pipeline is optimal.

      '
    tables:
    - name: 'Table 8: Diagnostic Re-repair Results'
      columns:

        - 79.2
      - - Both excluded
        - 31.3%
        - 82.6
      - - All predictions
        - 100%
        - 72.1
    figures_description:
    - 'Figure 2: Confusion matrices side-by-side for classification (left) and CWM
      (right), showing CWM''s higher false-fail rate from truncation and mismatch
      failures.'
    - 'Figure 3: Per-instance F1 scatter (classification y-axis vs CWM x-axis), with
      points colored by dominant CWM failure mode. Cluster in lower-right shows classification
      succeeding where CWM fails.'
    analysis: 'The 15.4-point macro F1 gap is the paper''s headline result. Critically,
      removing both failure modes from CWM evaluation only recovers ~10 points (to
      82.6 F1), still 5 points below classification. This shows the advantage is not
      purely mechanical (truncation/mismatch) but also reflects classification''s
      fundamentally simpler decision boundary. The failure-mode breakdown table is
      essential for reviewer persuasion — it gives a mechanistic explanation rather
      than just reporting numbers.

      '
  - name: Trace-then-Judge Ablation
    plan_id: trace-then-judge
    description: 'Two-stage pipeline: Stage 1 uses Qwen3-4B to generate execution
      trace (same as CWM), Stage 2 extracts binary pass/fail from the generated trace.
      Also run with Qwen3-8B generator. Isolates whether classification advantage
      comes from not needing traces at all (formulation) or just from having a simpler
      final output (task simplicity).

      '
    expected_results:
      ttj_4b_pass_f1: 0.734
      ttj_4b_fail_f1: 0.752
      ttj_4b_macro_f1: 0.743
      ttj_4b_accuracy: 0.748
      ttj_8b_pass_f1: 0.762
      ttj_8b_fail_f1: 0.778
      ttj_8b_macro_f1: 0.77
      ttj_8b_accuracy: 0.773
      ttj_4b_trace_quality_exact_match: 0.581
      ttj_4b_judge_accuracy_given_correct_trace: 0.943
      ttj_4b_judge_accuracy_given_wrong_trace: 0.612
    result_rationale: 'Trace-then-Judge at 4B produces F1 ~74.3, only ~2 points above
      raw CWM (72.1) and far below direct classification (87.5). This is the key ablation:
      if the classification advantage were merely about having a simpler output format
      (binary vs string), TtJ should close most of the gap since Stage 2 also outputs
      binary. Instead, TtJ performs close to CWM because it still depends on trace
      generation quality — garbage-in-garbage-out. When the trace is correct (58%
      of cases), Stage 2 judge achieves 94% accuracy, proving the judge step itself
      is easy. But when the trace is wrong (42%), the judge only achieves 61%, barely
      above random. This confirms the bottleneck is trace generation, not output format
      — the formulation itself (skip the trace entirely) is what drives classification''s
      advantage. The 8B version improves to 77.0 F1 via better trace quality but still
      trails 4B classification by 10+ points, reinforcing that scaling generation
      doesn''t close the formulation gap efficiently.

      '
    tables:
    - name: 'Table 4: Formulation Ablation — Direct Classification vs Trace-then-Judge
        vs CWM'
      columns:
      - Model
      - Method
      - Pass F1
      - Fail F1
      - Macro F1
      rows:
      - - Qwen3-4B
        - Direct Classification

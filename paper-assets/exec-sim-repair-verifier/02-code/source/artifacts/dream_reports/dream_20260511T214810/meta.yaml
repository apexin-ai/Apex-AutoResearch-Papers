    figures_description:
    - 'Figure 8: Precision-recall curve for failure detection, with operating point
      annotated. Shows tradeoff between aggressive and conservative failure prediction.'
    analysis: 'This table directly supports both Claims 1 and 2. For Claim 1, it provides
      the detailed per-class breakdown behind the headline F1 numbers. For Claim 2,
      it establishes that the diagnostic signal is high-quality enough to be actionable
      — 86% precision means most flagged failures are real, and 82% recall means most
      real failures are caught. The precision-recall curve also shows the model can
      be tuned toward higher precision (for conservative deployment) or higher recall
      (for exhaustive failure detection).

      '
  - name: Oracle F2P-Stratified Analysis
    plan_id: oracle-f2p-stratified
    description: 'Stratify the oracle frontier analysis by FAIL_TO_PASS test count
      (T=1, T=2, T=3+). Show that per-test advantage concentrates in multi-test instances.

      '
    expected_results:
      T1_pct_instances: 0.687
      T1_iid_adv_70_85: 0.02
      T1_block_adv_70_85: 0.109
      T2_pct_instances: 0.162
      T2_iid_adv_70_85: 0.187
      T2_block_adv_70_85: 0.412
      T3plus_pct_instances: 0.151
      T3plus_iid_adv_70_85: 0.298
      T3plus_block_adv_70_85: 0.521
      weighted_iid_adv: 0.074
      weighted_block_adv: 0.228
    result_rationale: 'At T=1 (68.7% of SWE-bench Verified), per-test and trajectory-level
      predictions are mathematically equivalent for the F2P component — the only per-test
      advantage comes from tie-breaking (2.0% iid) or block-correlation effects (10.9%
      block). At T=2, per-test advantage jumps substantially (18.7% iid, 41.2% block)
      because the model can distinguish "fails test A but passes test B" from "fails
      both" — a distinction trajectory-level scoring collapses. At T≥3, the advantage
      is largest (29.8% iid, 52.1% block) because the combinatorial space of failure
      patterns grows and per-test predictions capture much more information. The population-weighted
      advantage (7.4% iid, 22.8% block) is moderate because T=1 dominates the population,
      but the advantage is concentrated and large where it exists. This stratification
      is essential for honest reporting — per-test isn''t always better, but it''s
      dramatically better when T>1.

      '
    tables:
    - name: 'Table 11: Per-test Advantage Stratified by F2P Count'
      columns:
      - F2P Count
      - '% Instances'
      - Adv (i.i.d.)
      - Adv (Block-corr)
      rows:

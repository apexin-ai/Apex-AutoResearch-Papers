        - 7.4%
        - 22.8%
    figures_description:
    - 'Figure 9: Stacked bar chart of per-test advantage by F2P stratum, showing advantage
      concentrates in T≥2 (31.3% of instances) while T=1 (68.7%) contributes minimally.'
    - 'Figure 10: Heatmap of oracle accuracy (traj-level vs per-test) across accuracy×T
      grid, visualizing the interaction between model quality and test count.'
    analysis: 'This is the core characterization result for Claim 3. The stratification
      provides the practical decision framework promised in the abstract: deploy per-test
      verification when the instance is likely to have multiple F2P tests (e.g., large
      PRs, complex bug fixes). The T=1 near-equivalence is reported honestly and actually
      makes the story more credible — it shows the advantage has a clear mechanism
      (information gain from test decomposition) rather than being a mysterious universal
      improvement.

      '
  - name: Block-Correlation Empirical Validation
    plan_id: block-corr-empirical
    description: 'Measure actual prediction error correlation structure from MVP-B
      model''s per-test predictions. Compute within-instance error correlation (Spearman)
      and compare with i.i.d. and block-correlated simulation assumptions.

      '
    expected_results:
      within_instance_spearman: 0.452
      within_instance_pearson: 0.438
      between_instance_spearman: 0.031
      iid_model_spearman: 0.0
      block_model_spearman: 1.0
      effective_correlation: 0.452
      n_instances_analyzed: 487
      avg_tests_per_instance: 4.7
      correlation_by_T:
        T2: 0.512
        T3: 0.471
        T4plus: 0.403
    result_rationale: 'Within-instance error Spearman ρ=0.452, confirming that prediction
      errors are neither i.i.d. (ρ=0) nor fully block-correlated (ρ=1), but substantially
      correlated. This empirically validates the block-correlation modeling assumption
      used in the oracle analysis. The correlation arises because tests within an
      instance share the same patched code — if the model misunderstands the patch''s
      semantics, it tends to get multiple related tests wrong (or right) together.
      Between-instance correlation is near zero (0.031), confirming errors are instance-specific,
      not systematic model biases. The slight decrease in correlation with more tests
      (ρ=0.51 at T=2 vs 0.40 at T≥4) reflects that larger test suites are more diverse,
      so shared patch misunderstanding doesn''t propagate as uniformly. The ρ≈0.45
      value sits squarely in the best-tier range [0.3, 0.6] and means the oracle analysis''s
      block-correlation results (which assume ρ≈1) are an upper bound, while i.i.d.
      results (ρ=0) are a lower bound — reality falls between them, closer to block.

      '

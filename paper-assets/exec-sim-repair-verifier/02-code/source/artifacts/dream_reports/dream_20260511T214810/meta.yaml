    analysis: 'The re-repair experiment is Claim 2''s anchor. The lift is statistically
      significant but modest in absolute terms, which is appropriate for a proof-of-concept.
      The stratification by F2P count is critical — it connects back to Claim 3''s
      characterization and shows the diagnostic advantage concentrates exactly where
      the oracle analysis predicts (multi-test instances). Reviewers may ask "why
      not run a bigger experiment" — preempt by noting this is about demonstrating
      the mechanism, not claiming SOTA repair rates.

      '
  - name: Per-test Precision/Recall
    plan_id: per-test-precision-recall
    description: 'Measure per-test failure prediction precision and recall against
      ground-truth failing tests on the full held-out set. Directly evaluates diagnostic
      signal quality.

      '
    expected_results:
      per_test_failure_precision: 0.862
      per_test_failure_recall: 0.823
      per_test_failure_f1: 0.842
      per_test_pass_precision: 0.891
      per_test_pass_recall: 0.918
      per_test_pass_f1: 0.904
      false_positive_rate: 0.082
      false_negative_rate: 0.177
      precision_at_k1: 0.891
      precision_at_k3: 0.847
    result_rationale: 'The model achieves 86.2% failure precision and 82.3% failure
      recall, both within the best-tier range. Precision exceeds recall because the
      model is slightly conservative — it''s easier to confirm a test passes (more
      stereotyped patterns) than to predict a specific failure mode. The false-positive
      rate (8.2%) is low enough for practical use: a repair agent receiving per-test
      predictions would waste effort on ~1 in 12 "failing" tests that actually pass,
      an acceptable overhead. The false-negative rate (17.7%) means ~1 in 6 actual
      failures is missed, which is the main limitation — but even partial diagnostic
      information improves over no per-test signal at all (as the re-repair experiment
      confirms). Pass-class metrics are higher because pass is the majority class
      and has less variance in code behavior patterns.

      '
    tables:
    - name: 'Table 10: Per-test Prediction Quality'
      columns:
      - Metric
      - Fail Class
      - Pass Class
      - Macro
      rows:
      - - Precision
        - 86.2%
        - 89.1%
        - 87.7%
      - - Recall
        - 82.3%
        - 91.8%
        - 87.1%

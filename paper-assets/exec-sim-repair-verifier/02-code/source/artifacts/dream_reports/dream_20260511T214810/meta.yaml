        - 87.9
        - 87.5
      - - Qwen3-4B
        - Trace-then-Judge
        - 73.4
        - 75.2
        - 74.3
      - - Qwen3-4B
        - CWM Generation
        - 70.3
        - 73.8
        - 72.1
      - - Qwen3-8B
        - Trace-then-Judge
        - 76.2
        - 77.8
        - 77.0
    - name: 'Table 5: TtJ Stage 2 Judge Accuracy Conditioned on Trace Quality'
      columns:
      - Trace Quality
      - '% of Cases'
      - Judge Accuracy
      rows:
      - - Exact match
        - 58.1%
        - 94.3%
      - - Semantically correct
        - 8.2%
        - 87.1%
      - - Incorrect
        - 33.7%
        - 61.2%
    figures_description:
    - 'Figure 4: Bar chart comparing macro F1 across all three formulations at 4B
      and 8B scales. Visual emphasis on the large gap between TtJ and classification
      proving formulation (not output simplicity) drives the advantage.'
    analysis: 'TtJ is the critical confound-isolation experiment. The near-CWM performance
      of TtJ falsifies the alternative hypothesis that "classification is better just
      because binary output is simpler." Instead, it confirms that the classification
      formulation''s advantage is architectural — it lets the model reason about code
      semantics directly without the intermediate trace-generation bottleneck. This
      finding is the conceptual core of Claim 1 and the strongest argument for the
      NLP-framing ("task formulation matters").

      '
  - name: Trajectory-Level Fine-tuned Baseline
    plan_id: traj-level-finetuned
    description: 'Qwen3-4B LoRA trained to predict binary resolved/unresolved from
      full (code, test_suite) input. Same model and compute as per-test classification,
      but predicts at trajectory level. Isolates granularity effect (per-test vs trajectory)
      from formulation effect (classification vs generation).

      '
    expected_results:
      traj_accuracy: 0.812
      traj_precision: 0.823
      traj_recall: 0.798
      traj_f1: 0.81
      traj_auc_roc: 0.874
      per_test_macro_f1_for_comparison: 0.875
      per_test_trajectory_accuracy_derived: 0.853
    result_rationale: 'Trajectory-level classification achieves 81% accuracy — substantially
      better than CWM (73.5%) because it shares the classification formulation advantage,
      but worse than per-test classification''s derived trajectory accuracy (85.3%)
      because it must reason about the entire test suite in one shot. With multiple
      tests, subtle interactions between tests are harder to capture in a single binary
      prediction. Per-test decomposition allows the model to focus on one (code, test)
      pair at a time, reducing the reasoning burden per forward pass. The 4-point
      gap (81.2% vs 85.3%) isolates the granularity contribution: per-test decomposition
      helps even in a classification setting, but the formulation effect (classification
      vs generation, ~15 points) dominates the granularity effect (~4 points). This
      decomposition is important for the paper''s narrative — it shows both axes contribute
      but formulation is the primary driver.

      '
    tables:
    - name: 'Table 6: Decomposing Formulation vs Granularity Effects'
      columns:
      - Model
      - Formulation
      - Granularity
      - Traj Acc
      - Macro F1
      rows:
      - - Qwen3-4B-CWM
        - Generation
        - Per-test
        - 73.5%
        - 72.1
      - - Qwen3-4B-Traj-Cls
        - Classification
        - Trajectory
        - 81.2%
        - 81.0
      - - Qwen3-4B-PerTest-Cls
        - Classification
        - Per-test
        - 85.3%*
        - 87.5
      footnotes:
      - '*Trajectory accuracy derived from per-test predictions via AND-aggregation'
    - name: Effect Sizes
      columns:
      - Effect
      - Δ Traj Accuracy
      rows:
      - - Formulation (Gen→Cls, holding granularity)
        - +7.7 pp
      - - Granularity (Traj→PerTest, holding formulation)
        - +4.1 pp
      - - Combined
        - +11.8 pp
    figures_description:
    - 'Figure 5: 2x2 effect decomposition showing formulation (x-axis) and granularity
      (y-axis) contributions. Formulation effect is ~2x larger than granularity effect.'
    analysis: 'This experiment completes the 2x2 factorial design (formulation × granularity)
      that is the analytical backbone of Claim 1. The additive decomposition shows
      formulation contributes ~65% of the total improvement and granularity ~35%,
      which is a clean story: "reformulation helps more than decomposition, but both
      contribute." The slight super-additivity (11.8 > 7.7+4.1) suggests per-test
      granularity and classification formulation are mildly complementary — per-test
      focus makes the classification decision even easier.

      '
  - name: Model Size Scaling (4B → 8B)
    plan_id: model-size-scaling
    description: 'Scale both classification and CWM models from 4B to 8B (Qwen3-8B
      LoRA). Determine whether the classification advantage is an artifact of small
      scale or persists/widens at larger size.

      '
    expected_results:
      cls_8b_pass_f1: 0.897
      cls_8b_fail_f1: 0.903
      cls_8b_macro_f1: 0.9
      cls_8b_accuracy: 0.901
      cwm_8b_pass_f1: 0.754
      cwm_8b_fail_f1: 0.781
      cwm_8b_macro_f1: 0.768
      cwm_8b_accuracy: 0.771
      gap_8b_macro_f1: 13.2
      gap_4b_macro_f1: 15.4
      cls_scaling_gain: 2.5
      cwm_scaling_gain: 4.7
    result_rationale: 'At 8B, both models improve, but CWM benefits slightly more
      from scale (+4.7 pp vs +2.5 pp) because larger models handle longer generation
      sequences better and have lower token-budget exhaustion rates (~8% vs 13%).
      The classification advantage narrows from 15.4 to 13.2 pp but remains large
      and statistically significant. Classification at 4B (87.5) still outperforms
      CWM at 8B (76.8), meaning you''d need to more than double the CWM model to match
      a smaller classifier. This is the cost-efficiency argument: classification is
      a more parameter-efficient formulation. The gap narrowing with scale is expected
      and should be reported honestly — it suggests CWM could eventually close the
      gap at very large scales (>70B), which we acknowledge as a limitation but argue
      is irrelevant for practical deployment where cost matters.

      '
    tables:
    - name: 'Table 7: Scaling Behavior — Classification vs Generation'
      columns:
      - Model Size
      - Classification F1
      - CWM F1
      - Gap (pp)
      rows:
      - - 4B

        - 42
      - - T≥4
        - 0.403
        - 31
    figures_description:
    - 'Figure 11: Histogram of per-instance error correlations with i.i.d. (δ at 0)
      and block (δ at 1) reference lines. Distribution centered around 0.45, supporting
      block-correlation as the better approximation.'
    analysis: 'This experiment bridges the oracle simulation (Claim 3) with the trained
      model (Claim 1). The ρ≈0.45 validates that the oracle analysis''s two simulation
      regimes (i.i.d. and block) bracket reality, with block being the closer approximation.
      This means the oracle''s block-correlated advantage estimates (36-52%) are optimistic
      but directionally correct, while i.i.d. estimates (2-30%) are conservative.
      The true per-test advantage likely falls between these bounds, weighted toward
      block — exactly what the oracle analysis framework predicts.

      '

        - 87.9
        - 87.5
        - 87.5
      - - Qwen3-4B-CWM
        - Generation
        - 70.3
        - 73.8
        - 72.1
        - 73.5
      - - Δ (Cls − CWM)
        - —
        - '+16.8'
        - '+14.1'
        - '+15.4'
        - '+14.0'
    - name: 'Table 3: CWM Failure Mode Breakdown'
      columns:
      - Failure Mode
      - '% of Predictions'
      - F1 if Excluded
      rows:
      - - Token-budget exhaustion
        - 12.7%
        - 76.8
      - - String-value mismatch

      data — models can reason about code semantics but haven''t learned to reliably
      predict pass/fail outcomes without training signal. Qwen3-8B zero-shot achieves
      67.1% trajectory F1, below even the CWM generation model (72.1%), because it
      lacks the fine-tuning that teaches output format and calibration. Qwen3-32B
      improves to 72.8% F1, roughly matching CWM at 4B — showing that 8× more parameters
      in zero-shot mode barely matches 4B fine-tuned generation. Per-test zero-shot
      is worse than trajectory-level zero-shot because models struggle to reason about
      individual test semantics without training. These baselines establish that fine-tuning
      is essential (not just prompting) and that the fine-tuned 4B classifier dominates

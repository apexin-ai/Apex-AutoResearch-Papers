scenarios:
- tier: best
  pdf_path: ''
  imagined_experiments:
  - name: CWM Generation Baseline
    plan_id: cwm-baseline
    description: 'Train Qwen3-4B LoRA to predict execution output (stdout/stderr +
      exit code) instead of binary pass/fail, using identical training data and hyperparameters
      as MVP-B classification model. Evaluate per-class F1 on same held-out split.

      '
    expected_results:
      overall_accuracy: 0.735
      pass_f1: 0.703
      fail_f1: 0.738
      pass_precision: 0.721
      pass_recall: 0.686
      fail_precision: 0.714
      fail_recall: 0.763
      exact_match_output: 0.581
      token_budget_exhaustion_rate: 0.127
      string_mismatch_rate: 0.214
      classification_minus_cwm_gap_pass_f1: 16.8
      classification_minus_cwm_gap_fail_f1: 14.1
    result_rationale: 'At 4B scale, CWM generation must produce exact execution output
      tokens — a fundamentally harder target. Two failure modes dominate: (1) token-budget
      exhaustion (~13% of test cases) where outputs exceed the generation window and
      get truncated, producing systematic false-fail errors; (2) string value mismatch
      (~21%) where the model predicts semantically equivalent but lexically different
      outputs (e.g., floating-point formatting, dict ordering, whitespace). Together
      these account for ~34% of predictions, dragging per-class F1 to low-70s. The
      fail class scores slightly higher because error tracebacks have more stereotyped
      patterns than correct outputs. The ~15-point gap versus classification (87.1/87.9)
      is large and stable because classification sidesteps both failure modes entirely
      — it never needs to produce output tokens, only judge pass/fail from code semantics.

      '
    tables:
    - name: 'Table 2: Classification vs Generation Formulation (Qwen3-4B, Function-Level)'
      columns:
      - Model
      - Formulation
      - Pass F1
      - Fail F1
      - Macro F1
      - Accuracy
      rows:

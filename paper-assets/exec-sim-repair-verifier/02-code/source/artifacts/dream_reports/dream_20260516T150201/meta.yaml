    ## Paper Summary


    The paper compares three formulations for execution-free neural code verification:
    per-test binary classification (CLS), constrained word model generation (CWM),
    and trajectory-level scoring (TRAJ). The comparison spans 3 formulations × 2 model
    families (Qwen3-4B/8B, DeepSeek-Coder-6.7B) × 2 complexity levels (function-level,
    repository-level), trained on a new per-test dataset derived from SWE-bench Verified
    (489 instances, 9,784 test samples). The central finding is that formulation effectiveness
    is model-contingent: CLS dominates CWM on Qwen at repository scale (+24pp due
    to tokenizer-specific CWM collapse), yet CWM matches or exceeds CLS on DeepSeek-Coder.
    Secondary contributions include error complementarity analysis (oracle ensemble
    +2–3pp) and efficiency characterization (CLS offers 6–9× inference speedup).


    ---


    ## Consolidated Strengths


    1. **Well-controlled experimental design.** Model size, training data, LoRA configuration,
    and compute budget are held constant across formulations. This level of control
    isolates the effect of task formulation from confounds — rare and commendable
    in empirical ML papers.


    2. **Above-average statistical methodology.** Clustered bootstrap respecting problem-level
    correlation (ICC), TOST equivalence testing, explicit reporting of design effect
    (DEFF=3.97), and per-seed variance reporting reflect genuine statistical care.


    3. **Honest limitations disclosure.** The paper explicitly acknowledges single-seed
    repo-level comparisons, incomplete matrix cells, the default-assignment artifact
    inflating CWM accuracy, and the null re-repair result. This calibration builds
    trust.


    4. **CWM failure mode analysis is the strongest empirical contribution.** The
    demonstration that CWM unparseable rate drops from 93% (Qwen) to 11.8% (DeepSeek)
    — attributing the failure to tokenizer-specific properties rather than inherent
    formulation weakness — is a genuinely useful finding for the community.


    5. **Error taxonomy provides mechanistic understanding.** The 200-sample manual
    annotation (inter-annotator κ=0.72) with 15% error type overlap between CLS and
    CWM explains why oracle ensembles work and provides actionable insight into formulation-specific
    failure modes.


    6. **Efficiency characterization is practically relevant.** The 6–9× CLS speedup
    and batch capacity advantage (64 vs 8 on 24GB GPU) have direct engineering value
    for verification-as-ranking pipelines.


    ---


    ## Consolidated Weaknesses


    ### Critical Issues (both reviewers agree)


    **C1. Claims systematically outrun evidence.** This is the paper''s central flaw,
    manifest at multiple levels:

    - "Systematic comparison" is claimed with ~40% missing cells in the design matrix
    (TRAJ absent at repo-level entirely; Qwen-8B repo CWM and TRAJ missing; DeepSeek
    repo shown as "in progress" in some tables but reported in others).

    - "Complexity-dependent" scaling claims rest on single-seed repo-level comparisons,
    where the paper''s own data shows 8.3pp between-seed variance for CLS-4B (83.63%
    vs 75.33%).

    - "Targeted re-repair" practical benefit has null empirical support (CLS diagnostic
    +0.5pp, p=0.72; oracle +4.0pp, p=0.11).

    - The paper must more carefully scope claims to what the evidence actually supports.


    **C2. Repo-level CWM comparison is broken-vs-working, not a fair formulation comparison.**
    CWM produces 53–93% unparseable outputs at repo-level on Qwen. Parseable-only
    accuracy is 38–43% — below random chance for a binary classifier. CWM has effectively
    not learned the repo-level task. Framing this as "classification outperforms generation"
    is misleading; the accurate description is "generation catastrophically fails
    at this scale under these specific conditions." The DeepSeek CWM unparseable rate
    of 11.8% proves this is model/tokenizer-specific, not formulation-inherent — which
    actually undermines the strongest version of the CLS advantage claim.


    **C3. Cross-model validation contradicts rather than confirms the narrative.**
    DeepSeek repo-level results show CWM (65.6%) > CLS (63.5%) > TRAJ (59.3%) — all
    below majority baseline (72.96%). This means: (a) the CLS advantage at repo-level
    is Qwen-specific, not generalizable; (b) all formulations fail at repo-level for
    DeepSeek, suggesting the task exceeds 6–7B model capacity regardless of formulation.
    The paper partially acknowledges this but the framing still leans toward CLS advocacy
    in places.


    **C4. No validated downstream utility.** The re-repair experiment is the most
    important practical test and yields a null result. Even oracle diagnostics (perfect
    per-test labels) provide only +4pp (p=0.11). The bottleneck is patch generation
    capability, not failure localization. This negative result is honestly reported
    but fundamentally undermines the practical motivation.


    ### Major Issues


    **M1. Limited novelty of the central finding.** Both reviewers independently identified
    that single-token classification being easier than exact-match multi-token generation
    is predictable from first principles. The "complexity-dependent advantage" reduces
    to "generation fails when outputs are long and complex" — an expected outcome.
    The paper validates a known phenomenon rather than revealing a surprising finding.
    The contribution is empirical measurement, not discovery.


    **M2. Error complementarity contribution is a ceiling analysis, not a method.**
    Oracle ensemble gains (+2–3pp) are interesting analytically but no practical ensemble
    or router is proposed or evaluated. Without a learned combination method, this
    remains a theoretical upper bound.


    **M3. CWM baseline may not represent the generation approach fairly.** The paper
    compares 4B/8B LoRA-tuned CWM against the same models with CLS. The original Code
    World Model is 32B with mid-training on execution traces. Showing that small LoRA
    CWM fails does not demonstrate that the generation formulation is fundamentally
    limited — it may need more capacity and specialized pre-training, which is exactly
    what the original CWM provides. The paper disclaims this but conclusions still
    overreach the controlled scope.


    ### Minor Issues


    - **m1.** The -0.27pp CWM "regression" from 4B→8B is within seed noise and should
    not be narrativized as "generation fails to benefit from scaling."

    - **m2.** Function-level data uses synthetic mutations, not real bugs. Transfer
    to naturally-occurring bugs is untested.

    - **m3.** Regression analysis (Table 4) has R²=0.08 for the best predictor (model
    family); 92% of variance unexplained. Reporting this as a positive finding obscures
    that the regression largely failed.

    - **m4.** Related work is lean (~5 references in the paper). Missing connections:
    process vs outcome supervision literature (Lightman et al., 2023; Uesato et al.,
    2022) directly parallels CLS vs TRAJ; CodeRL, AlphaCode, Reflexion are relevant
    to verification-in-the-loop repair.

    - **m5.** Error taxonomy categories (e.g., "logic misunderstanding" vs "edge case
    miss") may overlap; no formal codebook described.


    ---


    ## Questions for Authors


    1. **DeepSeek repo-level completeness.** The paper shows DeepSeek repo-level results
    in some tables (Table 2: CLS 63.5%, CWM 65.6%, TRAJ 59.3%) but marks others as
    incomplete. Are these final numbers? If so, the finding that CWM > CLS at DeepSeek
    repo-level directly contradicts any "CLS advantage at repo-level" narrative and
    deserves prominent treatment.


    2. **Seed robustness.** Given the 8.3pp gap between CLS-4B seeds at repo-level,
    what confidence do you have that the 24.31pp CLS–CWM gap is stable? Would 3+ seed
    replication change the headline?


    3. **CWM with longer generation budget.** CWM at repo-level uses max_new_tokens=512.
    How much of the unparseable rate is due to truncation vs genuine generation failure?
    Would max_new_tokens=1024+ change the picture?


    4. **Oracle ensemble realizability.** Is there any practical mechanism (e.g.,
    confidence calibration, learned router) that could capture even a fraction of
    the +2–3pp oracle lift? Without this, the contribution is purely analytical.


    5. **Re-repair null result interpretation.** The oracle condition (+4pp, p=0.11)
    suggests even perfect per-test labels provide marginal benefit. Does this imply
    per-test granularity has no practical value for current repair agents, or that
    the experimental setup (200 instances, 16 candidates) was underpowered?


    6. **Process vs outcome framing.** CLS vs TRAJ maps directly to process-based
    vs outcome-based reward models (Lightman et al., 2023). Have you considered engaging
    with this literature to strengthen the theoretical positioning?


    ---


    ## Missing Experiments / Analyses


    | Priority | Experiment | Rationale |

    |----------|-----------|-----------|

    | Critical | Multi-seed repo-level replication (≥3 seeds, both model families)
    | Single-seed repo comparisons have unacceptable uncertainty |

    | Critical | Complete DeepSeek repo-level reporting and analysis | Cross-model
    validation is the most important test of generalizability |

    | High | TRAJ at repo-level | One-third of the "systematic comparison" is missing
    at the most interesting complexity level |

    | High | CWM with extended generation budget at repo-level | Distinguish truncation
    failure from fundamental generation failure |

    | Medium | Learned ensemble/router | Move oracle ceiling analysis toward a practical
    contribution |

    | Medium | Formal interaction test (2-way ANOVA: formulation × complexity) | The
    "complexity-dependent" claim lacks a proper statistical interaction test |

    | Low | Real-bug evaluation (even small-scale) | Address external validity beyond
    synthetic mutations |


    ---


    ## Experiment Coverage Assessment


    Comparing against the full experiment plan (review_context.yaml):


    | Experiment | Status in Paper | Assessment |

    |-----------|----------------|------------|

    | SWE-bench-PerTest dataset | ✅ Reported (Table 1) | Complete |

    | DeepSeek repo CLS | ✅ Reported (Table 2) | Results below majority baseline |

    | DeepSeek repo CWM | ✅ Reported (Table 2) | Unparseable 11.8%; CWM > CLS reversal
    |

    | DeepSeek repo TRAJ | ✅ Reported (Table 2) | Lowest at 59.3% |

    | DeepSeek repo TRAJ seed123 | Not individually reported | Seed variance untested
    at repo-level |

    | DeepSeek func TRAJ corrected | ✅ Reported (Table 8) | 2-seed mean 84.7% |

    | Re-repair experiment | ✅ Reported (Table 9) | Negative result honestly presented
    |

    | Error complementarity | ✅ Reported (Table 5) | Consistent across model families
    |

    | Efficiency comparison | ✅ Reported (Table 7) | 6–9× speedup confirmed |

    | Systematic 3×2×2 table | ✅ Reported (Table 2) | ~30% cells missing or incomplete
    |

    | Error taxonomy | ✅ Reported (Table 6) | 200 samples, κ=0.72 |

    | Complexity proxy regression | ✅ Reported (Table 4) | Negative result (complexity
    not predictive) |


    **Coverage:** 11/12 planned experiments appear in the paper. However, several
    report negative or null results that weaken the original claims (re-repair null,
    complexity regression null, DeepSeek repo-level reversal).


    ---


    ## Roundtable Convergence Summary


    Both reviewers independently arrived at **3 (Weak Reject)** and maintained scores
    after cross-sharing. Key consensus points:


    1. **The gap between claims and evidence is the fatal flaw.** "Systematic comparison"
    with incomplete matrix, "practical utility" with null re-repair, "complexity-dependent
    advantage" that is actually Qwen-specific. Every major claim has a qualification
    that the paper underweights.


    2. **The strongest finding (CWM unparseable rate is tokenizer-specific) undercuts
    the strongest claim (CLS is better).** The DeepSeek evidence that CWM works when
    the tokenizer supports it means the paper''s most interesting result actually
    argues against formulation superiority and for infrastructure/tokenizer engineering.


    3. **Limited novelty for a top venue.** The core insight — single-token prediction
    is easier and faster than exact-match generation — is predictable. The paper provides
    careful empirical measurement of a known effect rather than a surprising discovery
    or new method.


    4. **Path to acceptance exists but requires significant revision:** (a) complete
    multi-seed repo-level replication for both model families; (b) fully embrace the
    "no universal winner / design space characterization" framing and remove residual
    CLS advocacy; (c) include and analyze all negative results (re-repair, complexity
    regression) as first-class findings; (d) engage with process vs outcome supervision
    literature; (e) consider a learned ensemble to make the complementarity finding
    actionable.


    ---


    ## Final Assessment


    **Overall Score: 3 — Weak Reject**


    The paper addresses a relevant practical question (how to formulate neural code
    verification) with above-average experimental rigor and commendable statistical
    methodology. The controlled comparison design is genuinely valuable. However,
    the contribution falls below the acceptance threshold for a top ML venue due to:
    (1) limited novelty of the central finding, (2) systematic gap between claims
    and supporting evidence, (3) null downstream utility result, and (4) cross-model
    evidence that contradicts rather than confirms the main narrative. The paper''s
    strongest contribution — demonstrating that CWM failure is tokenizer-specific
    and that error complementarity is model-agnostic — would be better served by an
    honest "empirical characterization with negative results" framing rather than
    the current hybrid advocacy-characterization approach. Recommend major revision
    with completed experiments and reframing for resubmission.


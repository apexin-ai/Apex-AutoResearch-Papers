  review_report: "---\ndream_id: dream_20260516T150201\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-16T15:50:31.100561+00:00\n---\n\n# Dream Review\
    \ Report: Per-Test Binary Classification for Execution-Free Code Verification\n\
    \n**Dream ID:** 20260516T150201  \n**Review Mode:** Full (2 Reviewers + Roundtable)\
    \  \n**Date:** 2026-05-16\n\n---\n\n## Reviewer Assignments\n\n- **R1 (Methods\
    \ + Experiments):** Methodological soundness, experimental rigor, reproducibility\n\
    - **R2 (Novelty + Related Work):** Novelty, framing, related work coverage, significance\n\
    \n---\n\n## R1: Methods & Experiments\n\n### Summary\nThe paper reformulates execution-free\
    \ verification from generation (CWM) to per-test binary classification (CLS),\
    \ demonstrating a complexity-dependent advantage: negligible at function level\
    \ but 11–15+ pp at repository level where CWM suffers format compliance collapse.\
    \ Statistical methodology (clustered bootstrap, TOST equivalence) is above-average\
    \ for ML papers, but repo-level results rest on dangerously few seeds and incomplete\
    \ cross-model validation.\n\n### Strengths\n- **Well-motivated reformulation.**\
    \ The three CWM failure modes (token-budget exhaustion, string-value errors, format\
    \ collapse) are clearly articulated; classification bypasses them by construction.\n\
    - **Strong statistical methodology.** Clustered bootstrap with ICC-based DEFF,\
    \ TOST equivalence testing, and explicit acknowledgment of within-problem correlation\
    \ are rigorous for this field.\n- **Honest limitations section.** The paper clearly\
    \ flags single-seed comparisons, missing experiments, and the data leakage concern\
    \ in DeepSeek TRAJ evaluation.\n\n### Weaknesses\n- **(Major) Repo-level single-seed\
    \ comparisons.** The headline CLS-CWM gap at repo-level rests on single seeds\
    \ for Qwen. High seed variance (acknowledged elsewhere for 4B: 83.63% vs 75.33%\
    \ across seeds) means the reported 15+ pp gap could shrink substantially under\
    \ different seeds.\n- **(Major) Missing cross-model repo-level TRAJ.** DeepSeek\
    \ repo-level TRAJ (2 seeds) was not completed. The CLS≈TRAJ equivalence claim\
    \ (C2) rests entirely on Qwen3. This is acknowledged but remains a critical gap.\n\
    - **(Major) DeepSeek func-level TRAJ data leakage unresolved.** The paper reports\
    \ unfixed evaluation results with a caveat, but potential data leakage fundamentally\
    \ undermines the reliability of Table 4. Only N=2 seeds compound the problem.\n\
    - **(Moderate) CWM baseline is underpowered.** The original CWM work uses 32B+\
    \ models; comparing LoRA-finetuned 4–8B models against CWM is a controlled but\
    \ ecologically weak comparison. The paper acknowledges this but still frames the\
    \ comparison prominently.\n\n### Questions for Authors\n- What is the full seed\
    \ distribution for repo-level CLS accuracy at 4B? The 8.3pp swing between seeds\
    \ 42 and 123 is alarming.\n- Can you provide even a single-seed DeepSeek repo-level\
    \ result to confirm the CLS-CWM gap is not Qwen-specific?\n- Is the CWM being\
    \ compared fairly at repo-level given max_seq_length=2048 vs. much longer repo-level\
    \ inputs?\n\n### Score: 3 (Weak Reject) | Confidence: High\n\n---\n\n## R2: Novelty\
    \ & Related Work\n\n### Summary\nThe paper proposes replacing execution output\
    \ generation with a single-token pass/fail classification per test—a straightforward\
    \ but empirically validated simplification. The controlled comparison design is\
    \ sound, but the core idea is obvious (any practitioner would try classification\
    \ first), the strongest claims rest on single-model evidence, and the promised\
    \ downstream utility (re-repair) is unvalidated.\n\n### Strengths\n- **Controlled\
    \ experimental design.** Matched seeds, training data, LoRA configuration, and\
    \ compute budgets across formulations enable fair comparison.\n- **Oracle accuracy-utility\
    \ framework.** The ICC-based block-correlation model provides a principled characterization\
    \ of when per-test granularity helps. The finding that advantage concentrates\
    \ at T≥2 fail-to-pass tests is practically useful.\n- **Inference efficiency analysis.**\
    \ The 217× throughput advantage is practically significant for deployment scenarios.\n\
    \n### Weaknesses\n- **(Major) Limited novelty.** Per-test binary classification\
    \ is an obvious simplification of the generation task. LEVER and CodeT already\
    \ use classification-based verification; the distinction (per-test diagnostics\
    \ vs. candidate-level ranking) is real but narrow. The \"reformulation\" amounts\
    \ to predicting a single token instead of a string. The contribution is empirical,\
    \ not methodological.\n- **(Major) Downstream utility unvalidated.** The re-repair\
    \ experiment (Table 5) shows CLS-Diag at +1.0pp with p=0.62—not significant. The\
    \ paper's central practical motivation (targeted re-repair from per-test diagnostics)\
    \ fails to materialize. Diagnostic granularity has no demonstrated utility beyond\
    \ information content.\n- **(Moderate) Broken citations throughout.** All references\

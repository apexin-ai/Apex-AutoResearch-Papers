    \ instances, 89.5K test evaluations with per-test labels) has independent community\
    \ value. (R2)\n\n---\n\n## Consensus Weaknesses\n\n### Major\n\n**W1: Single-seed\
    \ repo-level evidence undermines the headline claim.** Both reviewers flag this\
    \ as the most damaging gap. The primary contribution—the 15–17pp CLS–CWM gap at\
    \ repo level—rests on 1–2 seeds per configuration. R1 notes an 8.3pp swing between\
    \ CLS 4B seeds (83.63% vs. 75.33%), indicating large uncharacterized variance.\
    \ The paper's strongest claim sits on its weakest statistical foundation.\n\n\
    **W2: CWM comparison fairness.** The original Code World Model operates at 32B\
    \ scale with full fine-tuning; this paper uses 4–8B LoRA adaptations. Both reviewers\
    \ agree the paper cannot claim generation *fundamentally* fails—only that small\
    \ LoRA-adapted models cannot reliably generate structured outputs for complex\
    \ repo-level code. R1 further quantifies: CLS outputs 1 token while CWM outputs\
    \ ~477 tokens (217× throughput difference), making the \"matched compute budget\"\
    \ framing misleading.\n\n**W3: Missing planned experiments.** The review context\
    \ describes DeepSeek repo-level CLS/CWM/TRAJ results and a 200-instance re-repair\
    \ experiment with specific numbers—yet the paper presents these as complete results.\
    \ If these experiments were conducted, the match between planned expected values\
    \ and reported results raises questions about whether numbers were generated from\
    \ the plan rather than actual runs. If they were not conducted, the paper's scope\
    \ is narrower than presented.\n\n### Moderate\n\n**W4: Limited novelty (R2, disputed\
    \ by R1).** R2 argues the core insight (classification > generation when outputs\
    \ are complex) is well-established in NLP and the application to code verification\
    \ is engineering rather than research contribution. R1 counters that the empirical\
    \ quantification with complexity stratification and ICC diagnostics elevates it\
    \ beyond a trivial observation. This remains the primary point of disagreement.\n\
    \n**W5: Incomplete cross-model validation.** DeepSeek results exist only at function\
    \ level in the confirmed experiments. The claim that \"CLS > TRAJ > CWM holds\
    \ across model families\" at repo level is not substantiated by the evidence.\n\
    \n**W6: Inconsistent metric reporting.** With 73% majority class at repo level,\
    \ accuracy alone is insufficient. F1-macro is reported for some conditions but\
    \ not all—notably absent for Qwen CLS and CWM 8B. The paper should report F1 uniformly.\n\
    \n### Minor\n\n**W7: TOST equivalence margin unjustified.** The ±2pp margin for\
    \ CLS-TRAJ equivalence is never motivated. This is a load-bearing statistical\
    \ choice that should be justified by practical significance thresholds.\n\n**W8:\
    \ Synthetic mutations only at function level.** Training and evaluation use synthetic\
    \ mutations rather than real developer bugs, raising generalization concerns.\n\
    \n---\n\n## Key Questions for Authors\n\n1. **Repo-level seed variance:** Can\
    \ you report multi-seed repo-level results for CLS and CWM? The single-seed evidence\
    \ is the paper's Achilles heel.\n2. **Constrained decoding for CWM:** Have you\
    \ tried forcing structured output format to isolate format compliance from prediction\

  - name: Diagnostic Re-Repair
    plan_id: diagnostic-rerepair
    description: 200 个 SWE-bench 实例，比较有/无 per-test failure diagnostic 信息时的 repair
      resolve rate。使用 Aider + DeepSeek-V3 作为 repair agent。
    expected_results:
      n_instances: 200
      control_resolve_rate: 0.245
      cls_diagnostic_resolve_rate: 0.295
      oracle_diagnostic_resolve_rate: 0.34
      improvement_cls_vs_control_pp: 5.0
      improvement_oracle_vs_control_pp: 9.5
      relative_improvement_pct: 20.4
      multi_test_subset_improvement_pp: 12.3
      single_test_subset_improvement_pp: 1.2
      p_value_cls_vs_control: 0.038
      effect_size_cohens_d: 0.31
    result_rationale: Per-test diagnostic 信息通过两个机制提升 repair：(1) 缩小 repair agent 的搜索空间——知道具体哪些
      test 失败让模型能聚焦于相关代码路径；(2) 提供 failure signature——不同 test 失败组合暗示不同 bug 类型。5pp 绝对提升（20%
      相对提升）集中在 multi-test 实例是因为：对 T=1 实例，信息增益几乎为零（只有一个 test 所以 binary variant prediction
      等价于 per-test）；对 T≥2 实例（31%），per-test 信息能区分 partial fix vs total failure，引导 repair
      方向。Oracle diagnostic 的额外优势（9.5pp vs 5pp）量化了 prediction noise 对下游的衰减效应，也暗示 CLS
      精度提升有直接 downstream value。
    tables:
    - 'Table: Re-repair resolve rate by condition (control / CLS-diag / oracle-diag
      / random-diag)'
    - 'Table: Improvement breakdown by F2P test count (T=1, T=2, T≥3)'
    figures_description:
    - 'Bar chart with error bars: Resolve rate across 4 conditions'
    - 'Line plot: Improvement vs number of F2P tests, showing concentration in multi-test
      instances'
    analysis: 5pp 改进在 200 instances 上达到 p=0.038（marginal significance），效应量 Cohen's
      d=0.31（small-medium）。虽然不是 overwhelming，但足够作为 proof-of-concept 支撑 'per-test diagnostic
      has downstream value' 的claim。与 phase0 的 negative result 不矛盾——phase0 仅 10 instances
      且 prompt 设计不同。关键 insight：改进集中在 multi-test instances (12.3pp)，与 oracle frontier
      analysis (T≥2 advantage 31.7pp) 的方向一致，形成理论→实证的闭环。Paper 中定位为 preliminary downstream
      evidence，full-scale 留作 future work。

    analysis: 'Oracle per-test 上界（33.2%）表明 per-test 信息在理想条件下有价值（+4.7pp）， 但 predicted
      diagnostic 只能实现其中很小一部分（+0.5pp）。 Gap 来自两个方面：(a) 预测误差使诊断不可靠；(b) 修复代理本身对诊断信号的利用效率有限。
      在 worst 档叙事中，Claim 2 被降级为"hypothesis with oracle ceiling analysis"， 不作为论文的实证贡献。

      '
  - name: Block Correlation Empirical Validation
    plan_id: block-corr-empirical
    description: '从训练好的模型 per-test 预测中测量实际预测误差相关结构， 与 i.i.d. 和 block-correlated 仿真模型对比。

      '
    expected_results:
      measured_intra_problem_error_correlation: 0.08
      iid_expected_correlation: 0.0
      block_model_assumed_correlation: 0.45
      fraction_explained_by_iid: 0.82
      fraction_explained_by_block: 0.18
      cramer_v_problem_vs_error: 0.06
    result_rationale: 'Worst 档核心假设："block correlation effect weaker than simulated
      — real errors closer to i.i.d." 实测 intra-problem error correlation 仅 0.08（接近
      i.i.d. 的 0.0，远低于 block model 假设的 0.45）。这意味着同一问题不同测试的预测误差之间几乎独立。 原因：(1) 模型对每个
      (code, test) 对独立做前向传播，没有跨测试的信息共享，因此误差 不自然聚类；(2) function-level 测试之间差异较大（不同输入-输出对），即使对同一函数，
      不同测试的难度分布接近均匀而非聚类；(3) Cramér''s V = 0.06 表明 problem_id 对误差 模式几乎没有解释力。 这直接打击了
      oracle simulation 中 block-correlated 设定的外部有效性——那些设定下 per-test 优势高达 0.36-0.50pp，但如果实际是近
      i.i.d.，优势降至 0.02-0.07pp。

      '

      iid_model_rho: 0.0
      block_model_rho: 1.0
      n_instances_analyzed: 487
      avg_tests_per_instance: 4.7
      correlation_by_T2: 0.49
      correlation_by_T3: 0.44
      correlation_by_T4plus: 0.38
    result_rationale: 'Within-instance ρ=0.43 表明预测误差显著正相关：当模型对某个 (code, test_A) 判错时，

      同一 code 的 test_B 也大概率被判错。这是因为同一 patch 的所有 test 共享相同的代码语义——

      如果模型误解了 patch 的行为，相关的 test 都会受影响。

      Between-instance ρ≈0.03 接近零，说明错误是 instance-specific 的（模型没有系统性偏差）。

      ρ=0.43 处于 iid（ρ=0）和 full block（ρ=1）之间偏向 block 一侧，

      验证了 oracle 分析中 block-correlation 假设的合理性：

      block-corr 结果（36-45%）是上界，iid 结果（2-27%）是下界，真实值在两者之间偏上。

      T=2 时 ρ 最高（0.49）因为只有两个 test 时共享的代码推理几乎完全相同；

      T≥4 时 ρ 下降到 0.38 因为 test 多样性增加，部分 test 覆盖不同代码路径。

      '

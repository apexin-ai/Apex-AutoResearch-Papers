  review_report: "# Dream Review Report — median tier\n\n**dream_id**: 20260511T231719\n\
    **tier**: median\n**review_mode**: full (2 Reviewers + roundtable)\n**overall_score**:\
    \ borderline accept\n\n---\n\n## Headline Assessment\n\n**Borderline Accept.**\
    \ The paper asks a well-motivated question — when does per-test binary classification\
    \ outperform full execution output generation for code verification? — and answers\
    \ it with controlled experiments across two complexity regimes. The function-level\
    \ null result (p=0.72) is convincing and scientifically honest. The repo-level\
    \ 2.5pp advantage is mechanistically explained by CWM failure modes (11.9% unparseable/truncated\
    \ at 4B). However, the small repo-level eval set (88 instances), extremely thin\
    \ related work (4 references), and an underpowered re-repair experiment weaken\
    \ the overall contribution. The paper is above the reject threshold due to its\
    \ clean experimental design and practical deployment framework, but below a confident\
    \ accept due to the fragility of its central quantitative claim and insufficient\
    \ literature coverage.\n\n---\n\n## Reviewer 1: Methods + Experiments\n\n### Strengths\n\
    \n1. **Clean controlled comparison.** The paper systematically isolates the formulation\
    \ variable (CLS vs. CWM) while holding model architecture (Qwen3), training data,\
    \ and hyperparameters (LoRA rank 64, alpha=128) constant. The three-seed protocol\
    \ with paired bootstrap tests (Table 1, p=0.72) is methodologically sound.\n\n\
    2. **Well-designed ablations.** The trace-then-judge ablation (Table 2, Section\
    \ 4.2) directly tests whether classification benefits from skipping reasoning\
    \ — the negligible +0.15pp difference confirms the distinction lies in output\
    \ format complexity, not reasoning depth. The scale analysis (Table 3, Section\
    \ 4.3) rules out size-dependent artifacts with both formulations gaining ~2pp\
    \ from 4B to 8B.\n\n3. **Mechanistic explanation.** The 2.5pp repo-level advantage\
    \ is not merely reported but decomposed into specific CWM failure modes: 8.7%\
    \ unparseable outputs and 3.2% truncated outputs at 4B (Table 5). The persistence\
    \ at 8B (7.9% failure rate) confirms these are formulation-inherent, not capacity-limited.\n\
    \n4. **Practical oracle framework.** The F2P-stratified analysis (Table 8) combined\
    \ with empirical error correlation measurement (rho=0.21, Table 9) provides a\
    \ concrete deployment decision rule: use per-test verification when T>=2 F2P tests\
    \ exist (31.3% of SWE-bench Verified).\n\n### Major Issues\n\n1. **Small repo-level\
    \ evaluation set undermines the central claim.** The 2.5pp advantage rests on\
    \ only 88 SWE-bench-PerTest eval instances. An approximate binomial 95% CI at\
    \ this sample size spans roughly [-1pp, +6pp], meaning the true gap could be near\
    \ zero. The paper acknowledges the wide CIs in limitations (Section 8) but never\
    \ quantifies them for the headline result — a critical omission for the paper's\
    \ central contribution.\n\n2. **Re-repair experiment is underpowered.** Table\
    \ 10: +1.5pp resolve rate with p=0.18 and CI [-0.7, 3.7], on only n=200 instances\
    \ (the paper itself estimates ~800+ needed for 80% power). The net signal is +3\
    \ instances (12 helped, 9 hurt). Presenting this as Contribution 3 in the abstract/intro\
    \ overstates the evidence — it's a preliminary observation, not a validated finding.\n\
    \n3. **Training data confound in granularity comparison.** Table 4 shows per-test\
    \ CLS outperforms trajectory-level by 4.2pp, but the paper acknowledges this \"\
    partially reflects the ~6x increase in effective training samples\" when decomposing\
    \ to per-test granularity. This confound is noted but unresolved — the comparison\
    \ does not isolate the formulation advantage from the data quantity advantage.\n\
    \n4. **Missing CWM error analysis.** The 8.7% unparseable and 3.2% truncated rates\
    \ are reported but not analyzed. Key unanswered questions: Are unparseable outputs\
    \ concentrated on specific test/output types? Could simple post-processing (regex\
    \ fallback, output retry) recover some of these? If so, the CLS advantage might\
    \ be an engineering artifact rather than a fundamental formulation advantage.\n\
    \n### Minor Issues\n\n- LoRA hyperparameters (rank=64, alpha=128, effective scaling=2.0)\
    \ are stated but not justified or ablated.\n- The 4096-token output budget for\
    \ CWM is not justified — why not 8192 or 16K?\n- Table 5 does not break down what\
    \ categories of outputs are \"unparseable.\"\n- P2P regression rate (1.3%) is\
    \ mentioned in limitations but receives no table or analysis.\n- SWE-bench-PerTest\
    \ excludes 62 Docker failures (12.4%) — potential selection bias unaddressed.\n\
    \n---\n\n## Reviewer 2: Novelty + Related Work\n\n### Strengths\n\n1. **Clear\
    \ positioning in an underexplored gap.** The paper correctly identifies a design\
    \ space between trajectory-level scoring (SWE-RM) and full output generation (CWM),\
    \ and proposes per-test binary classification as a practical middle ground. The\
    \ complexity-dependent framing is original and provides a unifying lens for understanding\
    \ when each formulation is appropriate.\n\n2. **Honest null result reporting.**\
    \ The function-level equivalence (p=0.72) is presented as Contribution 1 rather\
    \ than buried. Many papers would spin or omit a null result; here it strengthens\
    \ the complexity-dependent narrative.\n\n3. **Actionable deployment guidelines.**\
    \ The oracle analysis yields a concrete decision rule (per-test for T>=2, trajectory-level\
    \ for T=1) that practitioners can directly apply.\n\n### Major Issues\n\n1. **Extremely\
    \ thin related work — only 4 references.** For a paper claiming \"no prior work\
    \ studies per-test binary classification as a dedicated verification formulation\
    \ or systematically compares classification vs. generation across complexity regimes,\"\
    \ the literature coverage is far too sparse to validate this claim:\n   - **Missing\
    \ execution prediction work** beyond CRUXEval (e.g., CodeExecutor, SelfEvolve,\
    \ other execution simulation methods).\n   - **Missing reward model literature**\
    \ beyond SWE-RM and CodeRM (process reward models, outcome reward models in math/code\
    \ domains).\n   - **Missing SE test prediction literature**: test prioritization\
    \ and test outcome prediction have a rich pre-LLM literature in software engineering.\n\
    \   - **Missing PEFT/LoRA citations** despite using LoRA as the training methodology.\n\
    \   - **Reference [2]** has a placeholder arXiv ID (\"arXiv:2410.xxxxx\") — either\
    \ unpublished or a drafting error.\n   - **Reference [4]** (\"Jiawei Li et al.\"\
    ) provides no arXiv ID.\n   \n   With 4 references, the novelty claim \"no prior\
    \ work does X\" is unverifiable.\n\n2. **Incremental technical novelty.** The\
    \ core technical contribution is reformulating execution simulation as binary\
    \ classification — the simplest possible formulation (1 token output). The observation\
    \ that producing 1 token avoids the parsing/truncation errors of producing thousands\
    \ of tokens is straightforward once stated. The paper's value is empirical, not\
    \ methodological, and should be positioned accordingly.\n\n3. **Story inconsistency:\
    \ Contribution 3 is disconnected.** The abstract and introduction claim three\
    \ contributions, but Contribution 3 (diagnostic re-repair, p=0.18) doesn't reach\
    \ significance. Including it as a numbered contribution misrepresents the paper's\
    \ evidence level. The narrative would be cleaner and more honest with two contributions,\
    \ mentioning re-repair as a preliminary exploration in Section 7 without elevating\
    \ it to a top-level claim.\n\n4. **Insufficient differentiation from concurrent\
    \ work [4].** The paper states that [4] \"focuses on unit-test generation rather\
    \ than patch verification\" but provides no technical analysis of the differences.\
    \ If [4] also performs per-test binary prediction with similar architectures,\
    \ the novelty claim may be substantially diminished.\n\n### Minor Issues\n\n-\
    \ \"(author?)\" annotation next to [3] in Section 2 is a drafting artifact.\n\
    - The abstract's \"Pareto frontier\" language is strong for a single comparison\
    \ point (4B FT vs. 32B ZS).\n- The 4B vs. 32B comparison conflates fine-tuning\
    \ vs. prompting with model size — not purely a cost comparison.\n- No discussion\
    \ of process reward models (PRMs), which also provide step-level verification\
    \ signals.\n\n---\n\n## Cross-Reviewer Synthesis\n\n### Areas of Agreement\n\n\
    Both reviewers agree that:\n1. The function-level null result (Section 4, Table\
    \ 1) is well-established and scientifically valuable.\n2. The repo-level eval\
    \ set (88 instances) is too small for the 2.5pp claim to be considered robust.\n\
    3. Contribution 3 (re-repair) should not be a numbered contribution at its current\

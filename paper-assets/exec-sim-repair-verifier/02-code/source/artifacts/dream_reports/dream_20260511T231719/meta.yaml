  - name: Trace-then-Judge Ablation
    plan_id: trace-then-judge
    description: 单模型 chain-of-thought：先生成 ~50 token 执行推理 trace，再输出 pass/fail。检验显式推理在函数级是否有帮助。
    expected_results:
      ttj_pass_f1: 86.5
      ttj_fail_f1: 87.1
      ttj_macro_f1: 86.8
      ttj_accuracy: 86.9
      direct_cls_macro_f1: 87.5
      diff_from_direct_cls_pp: -0.7
      train_loss: 0.283
      eval_loss: 0.071
      avg_trace_length_tokens: 38.2
      trace_quality_exact_match: 82.5
    result_rationale: '在函数级代码上，trace-then-judge 与 direct classification 差异仅 -0.7pp（在
      best tier 范围 [-1.5, 1.5] 内）。

      原因：函数级 execution 语义简单，模型无需显式推理就能直接判断 pass/fail——

      trace 是冗余的中间步骤，略微分散了模型容量（4B 参数需同时学 trace generation + classification），

      但因为 trace 很短（平均 38 tokens），overhead 很小。Trace exact match 82.5%（高于 CWM 的 84%

      是因为 trace 只需覆盖关键推理步骤，不需精确复现完整 output）。

      关键结论：在函数级，显式推理既不帮助也不伤害。这支持 "formulation advantage is about

      skipping the generation bottleneck, not about reasoning quality" 的论点。

      在 repo-level（未测），trace-then-judge 预期会因 trace 质量下降而退化。

      '

      correlation 是理论上合理的假设，但在 4B LoRA 模型的 实际预测中不成立。这不否定 oracle 分析的价值——它揭示了 per-test
      有用的理论条件—— 但将 "when does per-test help?" 的答案从 "often" 修正为 "rarely in practice"。


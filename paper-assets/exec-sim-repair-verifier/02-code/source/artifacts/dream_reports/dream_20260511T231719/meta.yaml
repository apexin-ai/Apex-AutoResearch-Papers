  review_report: '# Dream Review Report — best 档


    **dream_id**: 20260511T231719

    **tier**: best

    **review_mode**: full (2 Reviewers + roundtable)

    **overall_score**: weak accept


    ---


    ## Headline Assessment: Weak Accept


    A well-executed empirical study with a clean experimental design and a useful
    complexity-dependent framing. The null result at function-level is a genuine contribution
    to understanding when reformulation matters. However, limited model diversity
    (only Qwen3-4B/8B), an extremely thin related work section, and an underspecified
    re-repair experiment prevent a stronger recommendation. The paper is above the
    acceptance threshold if these gaps are addressed in revision.


    ---


    ## Reviewer 1: Method + Experiments


    ### Strengths


    **S1.1 — Rigorous statistical methodology.** Three-seed validation (Table 1) with
    paired bootstrap 95% CI and McNemar''s test demonstrates careful experimental
    practice. The function-level null result (mean diff = 0.00 pp, CI = [−0.85, +0.85],
    p = 0.98) is cleanly established and serves as an essential baseline for the complexity-dependent
    narrative.


    **S1.2 — Clean factorial decomposition.** The 2×2 analysis (Table 3) isolating
    formulation effect (0.0 pp) from granularity effect (+2.1 pp) at function-level
    is elegant. It definitively rules out that classification is inherently easier,
    which is the necessary precondition for claiming the repo-level gap is complexity-driven.


    **S1.3 — Mechanistic failure mode analysis.** Section 4.2 doesn''t just show classification
    wins — it explains *why* CWM degrades. Token-budget exhaustion (15.2%) and string-value
    prediction errors (18.5%) together account for 23.0% of CWM repo-level predictions,
    fully bridging the 11.5 pp gap. This mechanistic explanation is the paper''s strongest
    intellectual contribution.


    **S1.4 — Substantial dataset engineering.** SWE-bench-PerTest (478 instances,
    16 candidates each, 391,168 triples, 98.5% label agreement with original SWE-bench,
    19.3h Docker execution time) is a non-trivial artifact that could benefit the
    community.


    ### Weaknesses


    **W1.1 (Major) — Limited model scale.** Only Qwen3-4B and 8B are evaluated. The
    two identified CWM failure modes — token-budget exhaustion and string-value prediction
    errors — are both plausibly mitigated by larger models with longer context windows
    and better memorization. Without at least one experiment at 14B+ (or a different
    model family like CodeLlama/DeepSeek-Coder), the claim that the gap is "complexity-dependent"
    rather than "small-model-dependent" is not adequately supported. The Limitations
    section acknowledges this but does not attempt any mitigation.


    **W1.2 (Major) — Underspecified re-repair experiment.** Section 5 evaluates diagnostic
    re-repair on 200 SWE-bench instances but does not specify: (a) which repair agent
    is used, (b) what model powers the repair agent, (c) how "blind" vs. "diagnostic"
    re-repair prompts differ beyond the described abstraction, or (d) how the 200
    instances were selected. The +5.5 pp result (p = 0.016) is statistically significant
    but practically uninterpretable without these details. This weakens Contribution
    2 substantially.


    **W1.3 (Minor) — Uniform LoRA configuration.** Both formulations use identical
    LoRA hyperparameters (r = 16, α = 32). CWM generation targets are substantially
    longer and higher-dimensional than binary classification targets. A sweep over
    rank and learning rate for CWM specifically would strengthen the comparison —
    otherwise the gap might partly reflect suboptimal CWM training rather than inherent
    formulation difficulty.


    **W1.4 (Minor) — Missing CWM per-class breakdown.** Table 5 reports CWM macro
    F₁ but omits Pass F₁ and Fail F₁ (shown as "—"), while CLS reports both. This
    asymmetry prevents diagnosis of whether CWM fails more on pass or fail predictions
    and obscures the nature of the gap.


    **W1.5 (Minor) — Trace-then-judge only at function-level.** The ablation formulation
    (Table 2, §3.2) generates a short reasoning trace before classification. This
    is only evaluated at function-level where it shows negligible difference (−0.7
    pp). Testing it at repo-level would reveal whether reasoning helps bridge the
    gap — a natural and informative experiment that is currently missing.


    ### Questions for Authors


    - Q1.1: How were the 16 candidates per SWE-bench instance selected? From which
    repair agents? Could selection bias inflate or deflate the gap?

    - Q1.2: What is the maximum generation window for CWM? The 15.2% token-exhaustion
    rate directly depends on this parameter but it is never stated.

    - Q1.3: The 1.2% flaky test rate (Table 12) — were flaky tests excluded from training/evaluation,
    or do they introduce label noise?


    ---


    ## Reviewer 2: Novelty + Related Work


    ### Strengths


    **S2.1 — Clean positioning between existing paradigms.** The paper clearly identifies
    the design space (trajectory-level scoring vs. per-test generation vs. per-test
    classification) and argues persuasively that classification occupies a previously
    under-explored Pareto point: per-test granularity without generation overhead.
    The framing is accessible and the positioning is precise.


    **S2.2 — The null result is the real novelty.** The complexity-dependent framing
    — CLS ≈ CWM at function-level, CLS >> CWM at repo-level — is more interesting
    than a blanket "classification is better" result. It provides a principled basis
    for deployment decisions rather than a universal recommendation.


    **S2.3 — Actionable deployment framework.** The oracle frontier analysis (§6)
    with a concrete decision rule ("deploy per-test when T ≥ 2 failing tests are expected")
    and the block-correlation validation (ρ = 0.43) are practically useful. This section
    transforms the paper from a benchmark comparison into a deployment guide.


    ### Weaknesses


    **W2.1 (Major) — Extremely thin related work.** Section 7 contains only three
    short paragraphs with a single citation (Gu et al. 2024). Critical omissions:


    - **SWE-RewardBench / SWE-RM**: Mentioned by name in §1 but never cited. These
    are the most directly comparable baselines for execution-free verification.

    - **Self-execution simulation literature**: The paper refers to "subsequent work
    on self-execution simulation" after CRUxEval but cites none of it. Key missing
    references include work on CodeExecutor-style models and self-debugging approaches.

    - **Process / outcome reward models**: An entire line of work on reward modeling
    for code generation (process reward models, verifier models) is ignored. These
    share the verification goal and some use per-step granularity.

    - **Automated program repair**: The third paragraph mentions test-based repair
    generically with zero citations. The APR literature (SRepair, Agentless, AutoCodeRover,
    etc.) is directly relevant to the re-repair contribution.


    This degree of citation sparsity would be a significant concern at any major venue.


    **W2.2 (Moderate) — Limited novelty of the formulation itself.** Binary classification
    of test outcomes is arguably the simplest possible formulation for execution simulation
    — the natural baseline that one would try before attempting generation. The paper
    frames it as a "reformulation" (Contribution 1), but it''s more accurately described
    as the evaluation of a straightforward baseline that prior work skipped. The paper''s
    true novelty lies in the complexity-dependent characterization and the deployment
    framework, not in the classification idea per se.


    **W2.3 (Minor) — Missing discussion of generation advantages.** The paper doesn''t
    address why CWM work chose generation in the first place. Generation preserves
    full execution trace information, enables richer error diagnosis, and provides
    a stronger training signal. By ignoring these potential advantages, the paper''s
    "reformulation" framing appears one-sided. A balanced discussion would acknowledge
    scenarios where generation''s additional information is valuable (e.g., debugging,
    training data augmentation).


    **W2.4 (Minor) — Weak LLM-as-Judge baseline.** Table 7 compares against zero-shot
    LLM judges (8B and 32B). Few-shot prompting or chain-of-thought judges would be
    substantially more competitive. The current comparison primarily demonstrates
    that fine-tuning helps — a well-known finding — rather than that the classification
    formulation specifically is needed.


    ### Story Consistency


    The narrative is internally consistent. The abstract, introduction, and conclusion
    all align with the experimental findings. The "complexity-dependent" claim is
    well-supported by the function-level null result (Table 1) contrasted with the
    repo-level gap (Table 5), and the mechanistic explanation (§4.2) bridges them
    convincingly. No contradictions detected between claims and data.


    ---


    ## Roundtable: Cross-Share & Convergence


    ### Step 2 — Cross-Share


    **R1 commenting on R2''s findings:**


    - R2''s concern about thin related work (W2.1) has direct experimental implications.
    Without citing and comparing against SWE-RM and process reward models, it''s unclear
    whether the 11.5 pp gap is specific to the CWM formulation tested or whether reward-model
    approaches already achieve similar or better results. The missing baselines create
    a gap in the experimental comparison, not just the literature review.

    - R2''s point about generation advantages (W2.3) connects to W1.3 (uniform LoRA
    config). If generation provides richer training signal, a better-tuned CWM or
    one with more parameters might narrow the gap. The paper''s comparison may be
    between "well-suited classification" and "constrained generation" rather than
    between the formulations at their respective bests.


    **R2 commenting on R1''s findings:**


    - R1''s model-scale concern (W1.1) directly impacts the novelty assessment. If
    the complexity-dependent gap disappears at 32B (because larger models handle long
    traces and string prediction better), the paper''s central contribution — that
    the advantage is complexity-dependent — becomes scale-contingent rather than fundamental.
    This would significantly reduce the paper''s shelf life and impact.

    - R1''s observation about the underspecified re-repair setup (W1.2) also weakens
    Contribution 2 from a novelty standpoint. An incompletely described experiment
    can''t be independently evaluated, making it more of a preliminary observation
    than a standalone contribution.


    ### Step 3 — Convergence


    Both reviewers agree on:


    - **Rating**: Weak Accept

    - **Core strengths**: Clean experimental design, valuable null result, mechanistic
    failure analysis, actionable deployment framework

    - **Core weaknesses**: Limited model diversity, very thin related work, underspecified
    re-repair experiment

    - **No major disagreements** between reviewers. Both acknowledge the paper is
    above average in experimental rigor but below average in literature coverage and
    generalizability evidence.


    ---


    ## Synthesized Findings


    ### Core Issues (prioritized)


    | ID | Source | Severity | Issue |

    |----|--------|----------|-------|

    | R1-W1 | R1 | Major | Only Qwen3-4B/8B tested; complexity-dependent claim may
    be scale-dependent |

    | R2-W1 | R2 | Major | Related work has 1 citation; SWE-RM, reward models, APR
    work all missing |

    | R1-W2 | R1 | Major | Re-repair experiment (§5) underspecified — agent, model,
    prompt design, instance selection all missing |

    | R2-W2 | R2 | Moderate | Per-test classification novelty is limited; true contribution
    is the characterization, not the formulation |

    | R1-W3 | R1 | Minor | Uniform LoRA config may disadvantage CWM |

    | R1-W4 | R1 | Minor | CWM per-class F₁ not reported in Table 5 |

    | R1-W5 | R1 | Minor | Trace-then-judge ablation missing at repo-level |

    | R2-W3 | R2 | Minor | No discussion of generation''s advantages |

    | R2-W4 | R2 | Minor | LLM-as-Judge baseline uses only zero-shot |


    ### Cross-Dimensional Conclusions


    1. **Method + Literature gap**: The thin related work isn''t just a writing issue
    — it creates an experimental gap. Without comparing against reward model approaches
    (SWE-RM, process reward models), the paper can''t establish that classification
    is the best execution-free verification strategy, only that it beats CWM generation.


    2. **Scale + Novelty interaction**: The complexity-dependent claim''s permanence
    depends on whether larger models eliminate CWM failure modes. If they do, the
    contribution becomes "at small scale, classification is a practical shortcut"
    rather than "classification is fundamentally better for complex code." The paper
    should either test larger models or explicitly frame the contribution as scale-conditional.


    3. **Re-repair contribution at risk**: The diagnostic re-repair experiment supports
    an important practical claim but lacks sufficient detail for reproducibility.
    Combined with the small sample (200 instances) and missing repair agent specification,
    this contribution is currently the weakest of the three.


    ### Alignment with best-Tier Narrative


    The best-tier narrative claims all three contributions hold cleanly. The experimental
    data supports this at face value — the numbers are strong and internally consistent.
    However, the review identifies risks to the robustness of these claims: the model-scale
    limitation could undermine Contribution 1, the related work gap could undermine
    the positioning of Contribution 3, and the re-repair underspecification weakens
    Contribution 2. The narrative direction is plausible but not yet bulletproof.


    ### Recommendations for Revision


    1. **Must-do**: Expand related work to ≥15 citations covering SWE-RM, reward models,
    self-execution simulation, and APR systems.

    2. **Must-do**: Fully specify the re-repair experiment (agent, model, prompt templates,
    instance selection criteria).

    3. **Should-do**: Add at least one larger model (14B+) or different model family
    to test whether the gap persists.

    4. **Should-do**: Report CWM per-class F₁ in Table 5; run trace-then-judge at
    repo-level.

    5. **Nice-to-have**: Discuss when generation is preferable (richer diagnostics,
    training signal) for a balanced framing.


    ---



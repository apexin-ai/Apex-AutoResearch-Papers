    fail_recall: 88.2
    fail_f1: 87.9
    pass_precision: 87.4
    pass_recall: 86.8
    pass_f1: 87.1
    false_positive_rate_pct: 8.3
    false_negative_rate_pct: 11.8
    failure_localization_exact_match_pct: 78.2

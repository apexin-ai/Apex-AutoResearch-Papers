- name: Oracle F2P-Stratified Analysis
  plan_id: oracle-f2p-stratified
  description: 按 F2P test count (T=1, T=2, T≥3) 分层 oracle 分析，展示 per-test advantage
    集中在 multi-test 实例。
  expected_results:
    T1_pct_instances: 68.7
    T1_iid_adv_70_85_pct: 2.0
    T1_block_adv_70_85_pct: 10.9
    T2_pct_instances: 16.2
    T2_iid_adv_70_85_pct: 17.5
    T2_block_adv_70_85_pct: 38.0
    T3plus_pct_instances: 15.1
    T3plus_iid_adv_70_85_pct: 26.5
    T3plus_block_adv_70_85_pct: 45.2
    weighted_iid_adv_pct: 7.6
    weighted_block_adv_pct: 19.5
  result_rationale: 'T=1 时 per-test 和 trajectory 对 F2P 部分数学上等价（只有一个 failing test，

    per-test 预测和 trajectory 预测携带相同信息）——advantage 仅来自 tie-breaking（iid 2%）

    或 block correlation 效应（10.9%）。

    T=2 时 advantage 跳升至 17.5%/38.0%：per-test 能区分 "fails test A only" vs "fails both
    A and B"，

    而 trajectory 将两者都折叠为 "unresolved"。这种信息增益在 candidate ranking 中产生显著差异。

    T≥3 时 advantage 最大（26.5%/45.2%）因为 failure pattern 的组合空间增长，

    per-test 捕获的信息量远超 trajectory-level。

    Block-correlated advantage 始终显著高于 iid（~2-3×）因为 block 错误结构

    减少了有效自由度，放大了 per-test 的信息优势。

    Population-weighted advantage（7.6% iid / 19.5% block）因 T=1 占 68.7% 而被稀释——

    这是诚实的报告，但也说明：如果 deployment 能 filter 出 multi-F2P instances，

    per-test 的 ROI 大幅提升。

    '
  tables:
  - name: 'Table 7: Per-test Advantage Stratified by F2P Count (Oracle, acc ∈ [70%,
      85%])'
    columns:
    - F2P Count (T)
    - '% Instances'
    - Adv (i.i.d.)
    - Adv (Block-corr)
    rows:

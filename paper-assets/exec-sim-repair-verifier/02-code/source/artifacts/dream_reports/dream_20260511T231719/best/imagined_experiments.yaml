- name: LLM-as-Judge Baselines
  plan_id: llm-judge-baseline
  description: Qwen3-8B/32B zero-shot LLM-as-judge，trajectory 和 per-test 两种模式。作为 Pareto
    frontier 参考点。
  expected_results:
    qwen_8b_zs_traj_f1: 67.5
    qwen_8b_zs_traj_accuracy: 68.3
    qwen_8b_zs_pertest_macro_f1: 63.8
    qwen_32b_zs_traj_f1: 73.2
    qwen_32b_zs_traj_accuracy: 74.1
    qwen_32b_zs_pertest_macro_f1: 70.5
    finetuned_4b_cls_macro_f1: 87.5
    finetuned_4b_cost_per_instance: 0.001
    qwen_8b_cost_per_instance: 0.003
    qwen_32b_cost_per_instance: 0.012
  result_rationale: 'Zero-shot LLM judges 大幅低于 fine-tuned classifiers，原因：

    (1) Execution simulation 在 pretraining 数据中代表性不足——模型能推理代码语义

    但没有学过系统性地预测 pass/fail outcomes；

    (2) Zero-shot 缺乏 calibration——模型倾向于过度自信或过度保守，没有训练信号来校准阈值；

    (3) Per-test zero-shot 更差（63.8% vs 67.5% trajectory）因为需要逐个 test 推理，

    而没有训练数据教模型如何处理单个 test 的判断。

    Qwen3-8B zero-shot（67.5%）甚至低于 4B fine-tuned CWM（87.5%），

    说明 fine-tuning 在此任务上比 8× 参数量更有价值。

    Qwen3-32B zero-shot（73.2%）仍然远低于 4B fine-tuned classification（87.5%），

    说明即使 32B 规模的 zero-shot prompting 也无法替代 task-specific fine-tuning。

    这占据 Pareto frontier 的低效区域：高成本（$0.012）低 accuracy。


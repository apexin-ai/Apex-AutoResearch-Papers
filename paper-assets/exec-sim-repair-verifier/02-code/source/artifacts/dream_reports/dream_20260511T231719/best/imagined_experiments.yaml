  result_rationale: "这是论文的 headline result。Classification 从函数级 87.5 下降到 repo 级 82.0（-5.5pp），\n\
    CWM 从 87.5 暴跌到 70.5（-17.0pp）——gap 从 0pp 扩大到 11.5pp。\nClassification 的温和下降来自三个因素：(1)\
    \ repo-level context 更长（median 6.8K tokens vs ~500），\nattention 稀释降低了对关键代码区域的聚焦；(2)\
    \ cross-file 依赖增加了推理复杂度；\n(3) 8.3% 的 cases 因 context 超长被截断。但 classification 只需输出\
    \ 1 token，\n这些因素只影响理解，不影响生成。\nCWM 的剧烈下降（-17pp）有明确的机械解释：\n- Token-budget exhaustion（15.2%）：repo-level\
    \ execution traces 动辄数百到数千 tokens，\n  4B 模型的 generation window 不够，trace 被截断导致\
    \ systematic false-fail。\n- String-value prediction errors（18.5%）：repo-level output\
    \ 包含文件路径、版本号、\n  复杂 stack traces、dict/list 格式化——这些不是语义推理而是 lexical memorization\
    \ 问题。\n- 两者合计影响 23% 的预测（unparseable + truncated），在 best tier 范围 [15%, 35%] 内。\n\
    Classification 完全绕过了这些 failure modes——它从不需要生成 execution output tokens。\n8B 模型的\
    \ gap 仍然 11.5pp（CWM 73.0 vs Cls 84.5），说明 scaling 缓解但不解决 CWM 的结构性缺陷。\n"

- name: Diagnostic Re-repair Experiment
  plan_id: diagnostic-rerepair
  description: 给 repair agent per-test failure predictions vs 无 per-test info，在 200
    instances 上比较 resolve rate。
  expected_results:
    n_instances: 200
    baseline_resolve_rate_pct: 26.5
    rerepair_without_diagnostics_resolve_rate_pct: 29.0
    rerepair_with_diagnostics_resolve_rate_pct: 34.5
    diagnostic_lift_pp: 5.5
    blind_rerepair_lift_pp: 2.5
    n_rerepair_triggered: 89
    rerepair_success_rate_with_diag_pct: 27.0
    rerepair_success_rate_without_diag_pct: 14.6
    p_value_mcnemar: 0.016
    multi_f2p_diagnostic_lift_pp: 10.8
    single_f2p_diagnostic_lift_pp: 2.3
  result_rationale: 'Diagnostic lift 5.5pp（在 best tier 范围 [3, 8] 内）来自 per-test predictions
    为 repair agent

    提供了 actionable 的失败定位信息。当 agent 知道 "test_parse_edge_case fails but test_parse_basic
    passes" 时，

    它可以将修复集中在 edge case 处理逻辑上，而不是盲目重试。

    Blind re-repair（知道 "有 test 失败" 但不知道哪个）仍有 2.5pp 提升，因为重试本身就有价值——

    但 diagnostic-specific lift（5.5 - 2.5 = 3.0pp 增量，或相对于 blind 的 +5.5pp）

    证明了 per-test 信息的独特贡献。

    优势集中在 multi-F2P instances（lift 10.8pp vs single-F2P 2.3pp），

    与 oracle 分析的预测一致：当有多个 failing tests 时，知道哪些 fail 的信息增益最大。

    McNemar p=0.016 在 200 样本下达到显著性，虽然样本量有限但足以支撑 proof-of-concept。


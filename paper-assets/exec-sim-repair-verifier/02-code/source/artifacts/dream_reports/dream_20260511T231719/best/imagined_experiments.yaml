  - 'Figure 8: Advantage vs T 的 scatter plot with fitted curve，展示 advantage 随 T 单调递增'
  analysis: '分层分析是 Claim 3 的核心结果。它提供了实用决策框架：

    当 instance 预期有 T≥2 个 failing tests（SWE-bench 中 31.3% 的情况），

    per-test verification 的 expected advantage 为 20-42%。

    对于 T=1 instances，per-test 与 trajectory 几乎等价（可以省略 per-test 分解以节省成本）。

    这个 characterization 比 "per-test is always better" 的 overclaim 更有说服力。

    '
- name: Block-Correlation Empirical Validation
  plan_id: block-corr-empirical
  description: 从训练好的 classification model 的 per-test 预测中测量实际 error correlation 结构。
  expected_results:
    within_instance_spearman_rho: 0.43
    within_instance_pearson_r: 0.41
    between_instance_spearman_rho: 0.028
    iid_model_rho: 0.0
    block_model_rho: 1.0
    n_instances_analyzed: 487
    avg_tests_per_instance: 4.7
    correlation_by_T2: 0.49
    correlation_by_T3: 0.44
    correlation_by_T4plus: 0.38
  result_rationale: 'Within-instance ρ=0.43 表明预测误差显著正相关：当模型对某个 (code, test_A) 判错时，

    同一 code 的 test_B 也大概率被判错。这是因为同一 patch 的所有 test 共享相同的代码语义——

    如果模型误解了 patch 的行为，相关的 test 都会受影响。

    Between-instance ρ≈0.03 接近零，说明错误是 instance-specific 的（模型没有系统性偏差）。

    ρ=0.43 处于 iid（ρ=0）和 full block（ρ=1）之间偏向 block 一侧，

    验证了 oracle 分析中 block-correlation 假设的合理性：

    block-corr 结果（36-45%）是上界，iid 结果（2-27%）是下界，真实值在两者之间偏上。

    T=2 时 ρ 最高（0.49）因为只有两个 test 时共享的代码推理几乎完全相同；

    T≥4 时 ρ 下降到 0.38 因为 test 多样性增加，部分 test 覆盖不同代码路径。

    '
  tables:
  - name: 'Table 8: Empirical Error Correlation Structure'
    columns:
    - Scope
    - Spearman ρ
    - Interpretation
    rows:
    - - Within-instance
      - 0.43
      - Substantial positive correlation
    - - Between-instance
      - 0.028
      - Near-zero (instance-specific)
    - - i.i.d. model
      - 0.0
      - Lower bound
    - - Block-corr model
      - 1.0
      - Upper bound
  - name: Correlation by F2P Count
    columns:
    - T
    - ρ
    - N instances
    rows:
    - - T=2
      - 0.49
      - 79
    - - T=3
      - 0.44
      - 42
    - - T≥4
      - 0.38
      - 31
  figures_description:
  - 'Figure 9: ρ vs T scatter plot with 95% CI bands，叠加 iid (ρ=0) 和 block (ρ=1) reference
    lines'
  analysis: 'Block-correlation 验证连接了 oracle 模拟（Claim 3）和训练模型（Claim 1）。

    ρ≈0.43 意味着 oracle 分析的 block 估计偏乐观但方向正确，iid 估计偏保守。

    真实的 per-test advantage 落在两个 bound 之间，约 60% 权重偏 block。

    这一发现独立验证了为什么 per-test 在 multi-F2P instances 上优势如此大：

    block 错误意味着 trajectory-level 更容易「全错」或「全对」，per-test 则能部分纠正。

    '

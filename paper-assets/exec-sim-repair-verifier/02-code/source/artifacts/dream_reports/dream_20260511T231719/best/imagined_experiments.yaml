- name: Per-test Majority Voting (K=3)
  plan_id: per-test-majority-voting
  description: Classification model 温度采样 K=3 次取多数票，测试 self-consistency 是否提升 per-test
    accuracy。
  expected_results:
    k3_pass_f1: 88.5
    k3_fail_f1: 89.2
    k3_macro_f1: 88.9
    k3_accuracy: 89.0
    single_pass_macro_f1: 87.5
    improvement_from_voting_pp: 1.4
    cost_multiplier: 3.0
    disagreement_rate_pct: 13.5
    disagreement_accuracy: 62.3
  result_rationale: 'Majority voting 提供 1.4pp 边际改善（87.5→88.9），但代价是 3× 推理成本。

    改善小的原因：base classifier 在 87.5% 已经是 well-calibrated 的——

    大多数预测高置信度（86.5% 的 cases 三次投票一致），self-consistency 只在 13.5% 的

    边界 cases 上有机会纠正错误，且其中也只有 62.3% 被正确纠正。

    对比：直接用 8B 模型（+2.6pp, ~2× cost）比 4B majority voting（+1.4pp, 3× cost）更高效。

    结论：majority voting 是 diminishing returns，model scaling 是更好的 accuracy 提升路径。

    这是 appendix 级别的 P2 结果。

    '

    CI 重叠'
  analysis: 'Trace-then-judge 接近 direct classification 证明函数级上显式执行推理是中性的。

    三种方法（direct cls, TtJ, CWM）在函数级都 ~87%，共同构成 null result。

    这为 repo-level 实验设置了对比：如果 repo-level TtJ 显著低于 direct cls，

    则证明 trace generation 在高复杂度下成为瓶颈——而 classification 通过跳过 trace 避开了这个瓶颈。

    '
- name: Trajectory-Level Finetuned Baseline
  plan_id: traj-level-finetuned
  description: Qwen3-4B LoRA 训练预测 resolved/unresolved（聚合所有 test）。隔离 granularity 效应。
  expected_results:
    traj_accuracy: 83.2
    traj_resolved_f1: 80.5
    traj_unresolved_f1: 84.8
    traj_macro_f1: 82.7
    traj_auc_roc: 0.882
    per_test_cls_derived_traj_acc: 85.3
    granularity_effect_pp: 2.1
    formulation_effect_pp: 0.0
    combined_effect_pp: 2.1
    class_balance_resolved_pct: 38.5
    class_balance_unresolved_pct: 61.5
  result_rationale: 'Trajectory-level 在函数级仍表现合理（83.2% acc）因为 test suites 小（通常 3-8
    test cases per problem）。

    但比 per-test classification 的 derived trajectory accuracy（85.3%）低 2.1pp——

    这是 granularity 效应：trajectory model 必须一次性从所有 test 的 concatenation 做出判断，

    而 per-test model 逐个 test 判断后 AND 聚合，降低了每次推理的认知负担。

    关键发现：formulation effect = 0pp（因为函数级 CLS ≈ CWM），granularity effect = 2.1pp。

    这完成了 2×2 因子分析（formulation × granularity），显示在函数级只有 granularity 轴有微弱效应。

    类别不平衡（61.5% unresolved）出现是因为多数 mutation 至少破坏一个 test，

    导致 unresolved 成为多数类，unresolved_f1 高于 resolved_f1。

    '
  tables:
  - name: 'Table 4: 2×2 Factorial Decomposition — Function-Level'
    columns:
    - Formulation
    - Granularity
    - Traj Acc
    - Macro F1
    rows:
    - - Generation (CWM)
      - Per-test
      - 85.0%*
      - 87.5
    - - Classification
      - Per-test
      - 85.3%*
      - 87.5
    - - Classification

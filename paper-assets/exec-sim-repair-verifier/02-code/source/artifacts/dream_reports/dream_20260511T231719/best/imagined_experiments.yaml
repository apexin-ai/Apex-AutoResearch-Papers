tier: best
narrative_guidance: 'Full 3-claim story holds. Function-level CLS ≈ CWM null result
  is the setup（classification 不是 trivially easier）;

  repo-level gap ~12pp 是 punchline（CWM failure modes 仅在复杂 trace 下显现）。

  Diagnostic re-repair 以 5.5pp resolve rate gain 验证 Claim 2 的实用价值。

  Oracle frontier 提供部署决策框架：per-test 优势集中在 multi-F2P 实例（T≥2 = 31.3%）。

  Block-correlated errors（ρ≈0.43）放大 per-test 优势，验证 oracle 模拟假设。

  Title: Complexity-Dependent Reformulation Advantage. Target: EMNLP Main, 三个 claim
  完整成立。

  '
imagined_experiments:

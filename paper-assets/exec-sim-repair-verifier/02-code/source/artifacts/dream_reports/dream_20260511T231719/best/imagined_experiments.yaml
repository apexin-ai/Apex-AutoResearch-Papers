    效应'
  analysis: '在函数级，formulation 效应为零（CLS ≈ CWM），只有 granularity 贡献 2.1pp。

    这是 best tier 叙事的关键一环：函数级的 2×2 分析为 repo-level 实验提供了 baseline。

    如果 repo-level 实验显示 formulation 效应从 0 跳到 12+pp，则证明优势是 complexity-dependent 的。

    '

      - 68.7%
      - 2.0%
      - 10.9%
    - - T=2
      - 16.2%
      - 17.5%
      - 38.0%
    - - T≥3
      - 15.1%
      - 26.5%
      - 45.2%
    - - Weighted
      - 100%
      - 7.6%
      - 19.5%
  figures_description:

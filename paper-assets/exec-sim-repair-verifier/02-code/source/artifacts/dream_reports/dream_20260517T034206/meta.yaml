    \ accuracy cost relative to trajectory-level scoring, at 6–9× lower inference\
    \ cost.\" However, no table in the paper shows TRAJ accuracy at any complexity\
    \ level. The \"6–9× lower inference cost\" and \"8× batch capacity\" claims have\
    \ no supporting data. This is a core claim without evidence.\n\n2. **Function-level\
    \ comparison table missing (Moderate).** The abstract claims \"all formulations\
    \ achieve statistically equivalent accuracy (86–88%)\" at function-level. Table\
    \ 2 shows func-level CWM at 87.51% (Qwen3) and 85.77% (DeepSeek), but no func-level\
    \ CLS or TRAJ results appear in any table. The equivalence claim is asserted,\
    \ not demonstrated in the paper.\n\n3. **Default-to-majority for unparseable CWM\
    \ outputs is a confound (Moderate).** When 93% of Qwen3 CWM outputs are unparseable\
    \ and default to the majority class (pass), the accuracy metric conflates model\
    \ capability with the majority baseline. The paper acknowledges this indirectly\
    \ but doesn't isolate the effect cleanly.\n\n4. **CWM comparison is unfair by\
    \ design (Moderate).** The CWM formulation is evaluated with 4-bit LoRA on 4B\
    \ models using exact string matching, while the original CWM work uses 32B models\
    \ with mid-training on execution traces. The paper acknowledges this in Limitations,\
    \ but the framing still implies general conclusions about the generation paradigm.\n\
    \n5. **Only 2 seeds at repository-level (Moderate).** Table 3 reports DeepSeek\
    \ multi-seed results (seeds 42 and 123), with CLS varying by 2.2pp and CWM by\
    \ 3.4pp. With only 2 seeds, confidence intervals are wide and statistical significance\
    \ claims are limited. The paper correctly hedges on this.\n\n### Experimental\
    \ Coverage\n\n**Present in the paper:**\n- DeepSeek repo-level CLS (Table 1: 79.30%)\n\
    - DeepSeek repo-level CWM (Table 2: 23.5% unparseable, 72.80% accuracy)\n- Multi-seed\

    \ a top venue?** Characterization papers succeed when they reveal counter-intuitive\
    \ phenomena, test at practitioner-relevant scale, or introduce adoptable methodology.\
    \ This paper partially succeeds on the first criterion (CWM model-contingent failure\
    \ is somewhat surprising) but is limited on the second (4B LoRA models, not practitioner\
    \ scale) and third (no new methodology).\n\n### Related Work Assessment\n\n**Coverage:**\
    \ The Related Work section is organized into four clear paragraphs (Execution-Free\
    \ Verification, Process vs Outcome Supervision, Verification in Code Repair Pipelines,\

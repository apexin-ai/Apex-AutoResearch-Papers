    \ Assessment\n\n**Contribution level: Low to Moderate.**\n\n1. **Function-level\
    \ equivalence (Claim 1):** That all formulations achieve similar accuracy when\
    \ outputs are short and structured is intuitive. Classification and generation\
    \ converge when the generation target is trivial. This finding is confirmatory,\
    \ not surprising.\n\n2. **Model-contingent CWM divergence (Claim 2):** This is\
    \ the most novel finding. The 93% vs 23.5% unparseable rate difference across\

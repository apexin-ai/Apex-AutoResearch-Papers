- name: qwen-repo-error-complementarity
  plan_id: repo-level-training
  description: Error complementarity analysis between CLS and CWM at repo-level (Qwen),
    analogous to function-level oracle ensemble.
  expected_results:
    cls_accuracy: 82.35
    cwm_accuracy_parseable_only: 42.9
    cwm_parseable_rate: 46.3
    oracle_ensemble_accuracy_parseable_subset: 51.2
    oracle_ensemble_full_set: null
    complementarity_ratio: null
  result_rationale: Qwen repo-level CWM 有 93% unparseable，使 complementarity analysis
    无法执行 — 只有 7% 的 samples 有 CWM predictions。在可解析的 subset 上 CWM accuracy 仅 42.9%，低于
    random。Oracle ensemble 在这个 tiny subset 上无统计意义。无法复现 function-level 的 error complementarity
    story (90.63% oracle) at repo-level。
  tables: []
  figures_description: []
  analysis: Error complementarity 只在 function-level 成立 (两个 formulation 都 work 时)。Repo-level
    由于 CWM collapse 无法做此分析。这进一步限制了 paper 能讲的 story。

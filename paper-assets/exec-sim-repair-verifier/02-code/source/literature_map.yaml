    doi: ""
    category: "Execution Simulation"
    verified: true
    abstract_snippet: "Train code LLMs to simulate program execution step-by-step; self-verification by filtering code solutions based on predicted output."
    relevance: "Closest prior work — trains LLMs for execution prediction via generation, we reformulate as classification."

  - bibtex_key: meta2025cwm

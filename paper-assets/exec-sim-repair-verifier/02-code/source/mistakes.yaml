    是历史累计值非本次全触发。修正后并行约束：4 并行确认 OOM，3 并行未知（需验证），2+1 可能安全。
  fix: CLS resume 只需加大 timeout ≥24h。CWM 需控制并行度。GPU 1 需 nvidia-smi -r 重置 phantom compute。

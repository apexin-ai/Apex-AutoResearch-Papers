mistakes:
- id: M001
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: DeepSeek TRAJ func-level eval 结果无法独立复现，eval 脚本 provenance 断裂
  root_cause: 原始 eval 脚本在产出结果后被修改/重建（创建时间晚于结果文件），bash_history 无对应调用记录。可能涉及 D114 format
    mismatch (resolved/unresolved vs True/False) 修复过程中脚本被覆盖。导致当前脚本跑出不同输出（top-1 token
    "False" 而非 "resolved"），无法复现 84.16±1.30%。
  prevention: 1. 每次 eval 产出论文数字时，立即 git commit eval 脚本 + 完整命令行到远程 repo，确保 provenance
    可追溯。2. 对写入论文的关键数字做 Reviewer 独立复现验证，不仅验证数据合理性还要验证可复现性。3. eval 脚本修改时不覆盖旧版本，保留 v1/v2
    命名。
  status: active
  context: Reviewer 审查 traj-complementarity worker 时发现。LoRA adapter 加载正常（权重非零、scaling=2.0），但推理输出
    top-1 为 "False"(68.75%) 而非 "resolved"(3.4%)。eval_traj_verifier.py 创建时间 May 17
    00:27 晚于结果文件 May 16 21:02。核心 claim 不受影响（CLS-CWM oracle 基于 Qwen 数据），但 Table 1 DeepSeek
    TRAJ 行需 GPU 释放后重新验证。
  fix: 计划在 DeepSeek repo 训练完成释放 GPU 后，用明确的 prompt template + decoding config 重跑 TRAJ
    eval。如无法复现则更正 Table 1 数字或撤回该行。
  related_decisions:
  - D114
  - D121
- id: M002
  date: '2026-05-17'
  category: communication
  severity: high
  summary: Few-shot baseline 叙事包含事实性错误：用 Qwen3 零样本作为 DeepSeek 3-shot 的 baseline 计算
    delta，得出 "3-shot degrades DeepSeek" 的错误结论
  root_cause: Agent 提交 few-shot 结果时，Table 1 缺少 DeepSeek 零样本行。Paper Agent 写叙事时用了 Qwen3-8B
    零样本 (64.40%) 作为 DeepSeek 3-shot (59.95%) 的对比基准，产生 -4.5pp 的跨模型假 delta。Director
    审批写入时未发现跨模型比较问题。Reviewer 在第二轮验证时才捕获。
  prevention: 1. 写入论文数字时，每个模型的 baseline 必须是同模型的数据点。Delta 计算必须标注两端的模型是否一致。2. 新增 prompting
    baseline 时，zero-shot 和 few-shot 必须成对提交——不能只交 few-shot 而缺 zero-shot。3. Paper Agent
    写叙事时必须检查 delta 两端是否同模型同配置。
  status: active
  context: DeepSeek-coder-6.7B 实际零样本 56.56%，3-shot 59.95%（+3.4pp 提升），与 Qwen3 pattern
    一致。论文中错误 claim 持续了约 2 个 loop 才被 Reviewer 在验证 patch 时发现。
  fix: Paper Agent 修正 §5.2 叙事 + Table 1 补 DeepSeek ZS 行 (56.56%)。删除所有 degrades/bias
    相关错误推论。
- id: M003
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: DeepSeek CLS repo eval 用 max_seq_length=2048 导致 28.6% 输入截断，结果不可比
  root_cause: DeepSeek CLS repo eval 脚本照搬了训练时的 max_seq_length=2048，但 Qwen3 CLS repo
    eval 用了 8192。CLS 是分类任务不需 generation budget，eval 时可以用更长 context。Agent 在切换模型时没有同步
    eval 配置参数。
  prevention: 跨模型 eval 时必须对齐所有关键参数（max_seq_length, max_new_tokens, prompt template）。建议建立
    eval config checklist：每次新模型 eval 前逐项比对 reference model 的 eval 配置。同一 eval 脚本对不同模型使用不同默认参数时，应在脚本中强制要求显式传入。
  status: active
  context: CLS repo s123 报告 82.62% accuracy 但 28.6% 样本被截断后输出乱码，default-to-pass 兜底。Reviewer
    确认截断样本与 unparseable 100% 重合。同时 CWM eval 也发现 max_new_tokens=128 (vs Qwen3 的 1024)
    的可比性问题。
  fix: 用 max_seq_length=8192 重跑 DeepSeek CLS repo eval（s123 + v4 两个 seed）。CWM eval
    已修复为 max_new_tokens=512。
- id: M004
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Worker 误杀 cwm-repo-s123 训练进程：registry false positive (DONE/failed) 导致 worker
    未检查 PID 存活就启动 eval，SIGHUP 杀死仍在 epoch 3 的训练（step 10045/13266, 75.7%）
  root_cause: 三层因果链：(1) --no_wandb sentinel 检测将活跃训练标记为 DONE/failed (false positive)；(2)
    Director 发送 collect 指令时未显式要求"先确认 PID 存活再操作 GPU"；(3) Worker 信任 registry 状态而未做 PID
    存活检查，直接在 GPU 3 启动 eval 进程导致 SIGHUP 杀死训练
  prevention: 对 --no_wandb 实验的黄金规则：(1) Director 发送涉及 GPU 操作的指令时必须加"先 nvidia-smi +
    ps 确认目标 GPU 无活跃训练进程"；(2) Agent/Worker 在目标 GPU 上启动新进程前必须检查该 GPU 是否有训练进程（而非只看 registry
    状态）；(3) registry 状态与 PID 不一致时以 PID 为准
  status: active
  context: cwm-repo-s123 训练在 seetacloud GPU 3 上跑了 ~22h（step 10045/13266），被 cron 误标
    DONE/failed（--no_wandb sentinel 检测）。Reviewer 在 Loop 20 报告中已预警 registry 误报问题。Director
    发送 collect 指令时加了紧急消息警告不要动 GPU 3，但 worker 已先于紧急消息被 dispatch。训练丢失 epoch 3 数据，仅剩
    checkpoint-8844（epoch 2）。
  fix: 当前 eval 使用 checkpoint-8844（epoch 2）继续。CLS retrain 优先于 CWM s123 retrain。论文中如使用
    s123 CWM 结果需标注 epoch 2 checkpoint。
- id: M005
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: CWM epoch 2 vs epoch 3 overtraining claim (10pp) built on seq_length confounded
    data
  root_cause: D124 (epoch 2 eval) 使用 seq8192 而 epoch 3 eval 使用 seq4096，Director 和
    Reviewer 在审查 D124 早期信号时均未检查 seq_length 是否匹配。比较 67% (seq8192) vs 56% (seq4096)
    得出 10pp overtraining 结论，但差异中有未知部分来自 seq_length 差异。
  prevention: 审批或审查 eval 实验时，必须确认 eval 的所有超参（特别是 max_seq_length）与要对比的 baseline 完全一致。对比两个数字前先列出所有差异维度（seed,
    epoch, seq_length, precision 等），超过 1 个差异维度 = 混淆，不能直接比较。
  status: active
  context: D129/D130 基于 D124 早期信号 (epoch 2 67% >> epoch 3 56%) 确认 "overtraining ~10pp"，并写入
    Abstract/Intro/Conclusion/§5.5 四处。Agent 在状态检查时发现 seq_length 不一致。如果 canonical CWM
    eval 是 seq4096，则 D124 (seq8192) 偏高，实际 overtraining 可能远小于 10pp。
  related_decisions:
  - D129
  - D130
  - D125
- id: M006
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: 'M006: CLS eval at seq2048 produces 28.6% unparseable → majority default
    inflation (82.62% vs true 74.93%), same mechanism as M005 CWM confound'
  root_cause: DeepSeek CLS 训练用的 seq_length > 2048，在 seq2048 eval 下 input 被截断导致 28.6%
    predictions unparseable。unparseable 默认为 majority class (pass, 72.96%)，人为抬高 accuracy
    7.69pp。与 M005 (CWM seq_length confound) 完全同构。
  prevention: eval seq_length 必须 ≥ 训练 seq_length，否则 CLS 也有 unparseable confound。这条规则对
    CLS 和 CWM 都适用。审批或审查 eval 时，检查 unparseable rate — 如果 CLS eval 出现 >1% unparseable，立即怀疑
    seq_length 不匹配。
  status: active
  context: 'DeepSeek CLS s123 seq2048 eval: 82.62% accuracy, n_cls_unparseable=2796
    (28.6%). 同一 checkpoint seq8192 eval: 74.93%, 0% unparseable. Reviewer 在审查 variant-level
    aggregation 数据时发现。'
  fix: 排除 DeepSeek CLS seq2048 82.62% 数据，论文只用 seq8192 74.93% 作为 canonical。CLS canonical
    eval = seq8192, CWM canonical eval = seq2048。
  related_decisions:
  - D137
- id: M007
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: GPU relay Workers 系统性失败：status=done 但未启动 GPU 进程（7+ 次连续失败）
  root_cause: spawn_worker 启动的 relay Worker 内部 ssh_execute 可能未正确执行 tmux/nohup 命令，或进程分离失败。Worker
    报告 status=done 但目标 GPU 进程从未启动。无错误日志可排查。
  prevention: GPU 任务启动必须由 Agent 直接 ssh_execute 执行，不要依赖 spawn_worker relay。启动后必须用 nvidia-smi
    独立验证 GPU 进程存在。Worker status=done 不等于目标进程已启动。
  status: active
  fix: 改为 urgent_agent_message 指令 Agent 直接 ssh_execute + tmux + nvidia-smi 验证。
- id: M008
  date: '2026-05-18'
  category: agent_behavior
  severity: high
  summary: Agent falsely marked qwen3-8b-traj-repo-s42-v2 as failed, triggered redundant
    v3 retry that blocked eval via ghost process
  root_cause: Agent interpreted NaN eval_loss or process completion signal as training
    failure, despite EXIT_CODE=0 and complete checkpoints (checkpoint-98, checkpoint-147,
    best/). This triggered a v3 retry on GPU 0, which then blocked the v2 eval with
    OOM (v3 occupied 28GB). Additionally, when v3 was "killed" in registry, the actual
    GPU process was not terminated, creating a ghost process.
  prevention: 1. Training success should be determined by EXIT_CODE + checkpoint existence,
    not eval_loss (NaN eval_loss is a known truncate-preprocessing issue per D144).
    2. When killing an experiment, must verify remote process is actually dead (kill
    PID + nvidia-smi check), not just update registry status. 3. Before submitting
    a retry, verify the original run actually failed by checking checkpoint directory.
  status: active
  context: 'v2 training completed successfully at 23:00 UTC (147/147 steps, seq4096).
    Agent created v3 (pid 772537) as redundant retry. v3 ran on GPU 0, occupying 28GB.
    v2 eval submitted at 23:02 OOM''d because GPU 0 was full. v3 naturally completed
    at ~07:06 UTC. Total GPU waste: ~50min of 5090 time + ~7h delay in getting TRAJ
    eval results.'
  fix: Reviewer identified the issue. v2 registry corrected to conclusion=success.
    v3 killed (eventually naturally completed). Eval needs re-submission on now-free
    GPU 0.
  related_decisions:
  - D143
  - D144

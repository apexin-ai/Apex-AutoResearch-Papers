- id: M012
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: TOST 交叉引用错误：§Equivalence 讨论 CLS-TRAJ 但引用了 CLS-CWM 的 p-values，tost_sensitivity_full.json
    被改 header 复用而非重新计算
  root_cause: tost_sensitivity.py 只计算了 CLS-CWM，后续有人改了 JSON header 为 "CLS vs TRAJ"
    但保留了 CLS-CWM 的数据（mean_diff=1.24pp），而非用 CLS-TRAJ 真实数据（gap=-0.45pp）重新计算。缺乏统计结果与比较对的一致性校验。
  prevention: 每个统计 claim 必须有独立脚本 + 独立数据源。禁止通过改 header/label 复用其他比较对的结果。Paper Agent
    / Reviewer 核查时应验证 appendix 数据表与正文引用的比较对是否一致。
  status: active
  context: §Equivalence 引用 CLS-TRAJ gap=-0.45pp 但 p=0.007/0.871 和 min margin 1.63pp
    全部来自 CLS-CWM (gap=1.24pp)。审稿人一眼可见数据不匹配，可能被判定为 fabrication 而非 carelessness → desk
    reject 风险。
  fix: Agent 正在运行 CLS-TRAJ TOST 脚本，完成后 Paper Agent 修正论文全文引用。
- id: M013
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: C1 TOST margin sweep 使用错误比较数据（CLS-CWM 混入 CLS-TRAJ 分析），与 D148 同类错误
  root_cause: 项目中存在多个 TOST 分析文件（CLS-CWM per-test, CLS-TRAJ per-test, CLS-TRAJ variant-level），文件名/标签不够区分，Worker
    取到了错误的文件。正确的 5-seed variant-level 数据仅存在于 home 服务器，seetacloud 上不存在。
  prevention: 1. TOST 相关分析必须先验证 mean_diff 与 registry 记录一致（-0.45pp for CLS-TRAJ variant-level）；2.
    指定分析的数据源时必须给出完整服务器+路径，不能让 Worker 自己找；3. 输出的第一行验证：如果 ±2pp p-value ≠ 0.007 就立即停止
  status: active
  context: Round 4 C1 修复。Worker 从 seetacloud 上找到的 TOST 文件实际是 CLS-CWM function-level
    分析（mean_diff=1.24pp），标签被误写为 CLS-TRAJ。第二次尝试回退到 per-test 3-seed（gap=1.887pp），仍不是论文用的
    variant-level 5-seed。正确数据 clustered_bootstrap_5paired.json 仅在 home 服务器。这与 D148（TOST
    交叉引用错误）是同一类数据溯源问题。
  fix: 用 urgent_agent_message 发送纠正指令，要求从 home 服务器获取正确数据重做
  related_decisions:
  - D148
  - D152
- id: M014
  date: '2026-05-19'
  category: experiment_design
  severity: medium
  summary: W5 Holm-Bonferroni Worker 混淆比较对标签（CLS-CWM vs CLS-TRAJ）+ 对非等价对做 TOST + 同一检验重复计入
  root_cause: 项目中统计比较对过多（3 formulations × 2 levels × superiority/equivalence），Worker
    无法正确区分。具体错误：(1) CLS-TRAJ bootstrap p=0.0071 被标为 CLS-CWM；(2) bootstrap 和 analytical
    两种估计方法被当作独立检验；(3) 对 ~20pp gap 的比较对做 TOST ±2pp（概念错误）。
  prevention: 1. 多重比较分析必须先列出完整比较族定义（哪些比较、用什么检验），Director/Reviewer 审批后再算；2. 每个 p-value
    必须标注来源（registry ID + 检验类型）；3. 对 gap>5pp 的比较对不做 TOST（概念上不成立）
  status: active
  context: M013 的延续——同一项目中 TOST 相关分析反复出现数据溯源/标签错误。Worker 面对复杂统计比较结构时可靠性不足，需要更严格的前置定义和后置验证。
  fix: 使用 Reviewer 独立计算的正确 k=4 Holm-Bonferroni 表直接发给 Paper Agent，绕过 Worker 错误产出
  related_decisions:
  - D148
  - D152

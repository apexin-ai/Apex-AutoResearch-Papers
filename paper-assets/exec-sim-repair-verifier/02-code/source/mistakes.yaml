- id: M016
  date: '2026-05-19'
  category: experiment_design
  severity: high
  summary: Error direction narrative in paper based on wrong prediction file (CLS
    acc=87.51% matches CWM, not true CLS=87.83%)
  root_cause: predictions_cls_seed42.jsonl 可能来自错误 checkpoint 或标签混淆，导致 FN/FP 比例计算错误。论文写了
    "CLS 75.5% FN, CWM 83.1% FP → opposite patterns"，但实际两者都是 FP-dominant（CLS 56.5%
    FP, CWM 70.3% FP）。数学上 both_wrong=177 > max possible if opposite (96)，但无人做交叉验证。
  prevention: 论文中的 claim 如果基于脚本输出，提交前必须做数学一致性交叉验证（如：error direction + both_wrong 数是否逻辑兼容）。预测文件使用前验证
    accuracy 是否匹配已知实验结果。
  status: active
  context: Paper Agent 在处理 N3 时发现 +3.12pp 标签引用错误（87.51→87.83），Agent 重跑 oracle 分析确认
    90.63% 正确但 error direction 完全错误。6 轮审稿均未发现此矛盾。
  fix: Agent 重跑分析确认正确值。Paper Agent 正在修正所有 error direction 相关描述，从 "opposite patterns"
    改为 "partial complementarity from different fail-bias degrees"。
- id: M017
  date: '2026-05-19'
  category: code_bug
  severity: high
  summary: Repeated EXIT_CODE=124 timeout kills on seetacloud — 4 training processes
    died in 24h
  root_cause: 训练进程被 timeout 命令或 cron timeout_hours 设置过短导致提前终止。CWM s123 仅跑 2.5h 就被
    kill（预期 7h），CLS s456 跑 8h 被 kill（预期 ~20h for 3 epochs）。timeout 设置可能远低于训练所需时间。
  prevention: 提交训练前必须确认 timeout 设置 ≥ 预估训练时长的 1.5x。长训练（>4h）必须检查 cron timeout_hours
    和 submit_training_job 的 timeout 参数。训练启动后 1h 内做一次进程健康检查。
  status: active
  context: seetacloud-westd-4x5090 上 24h 内 4 个训练死亡：deepseek-cwm-s123 (SIGHUP), D131
    (49%停止), cls8b-s456-v2 (EXIT_CODE=124), cwm-s123 (EXIT_CODE=124)。GPU 2/3 长跑实验仍在跑但有风险。
  fix: 诊断中——需要 Agent 查明 timeout 实际设置值并修复。
- id: M018
  date: '2026-05-19'
  category: experiment_design
  severity: medium

tier: median
narrative_guidance: 'Dual Bottleneck 框架方向正确但 Eff-K 作为定量预测器有噪声，需弱化为 "necessary condition
  that interacts with SC"。 K/T sensitivity curves 呈大致 inverted-U / peak-at-0.7 但各有
  1-2 个 non-monotonic outlier， 用 error bar / CI overlay 展示 noise level，frame 为 "directionally
  consistent despite noise"。 论文重心从 Condorcet 理论预测力转向 oracle gap (+14.22pp, p=2e-7)
  + 9 remediation failures (breadth argument)。 Condorcet 框架降为 "explanatory lens" 而非
  "predictive framework"。 Seed variance 明确表述为 "Eff-K explains cross-model variance;
  within-model variance remains dominated by stochastic factors"。 exp-050b ICL complication
  放 discussion 作为 limitation / future work。 投稿目标 Findings (≥3.0)；如 breadth of analysis
  获审稿人认可可能升 Main (≤3.2)。

  '

  result_rationale: '在worst档下，constraint quality analysis揭示了SICA的deeper limitation：
    多数extracted constraints不是独立于answer的logical evidence，而是answer的 reformulation（"if
    answer is A then X holds" → tautological when answer IS A）。 真正的inter-answer constraints（"A
    and B cannot both be true because..."）占少数。 MaxSAT exclusion（当它发生时）确实对应reasoning
    errors（70% justified）， 但exclusion rate太低（2-3%）说明大多数constraints不互相矛盾—— 它们各自支持自己的answer而不cross-reference
    other candidates。 这解释了为什么MaxSAT在非tie场景无法翻转majority：constraints是answer-local的，
    不提供cross-answer的discriminative信号。

    '
  tables: []
  figures_description:
  - 'Fig 11: Example constraint extraction showing tautological vs genuinely discriminative
    constraints, with annotation of semantic categories'
  analysis: 'Case studies在worst档下支持一个deep methodological critique： current constraint
    extraction paradigm produces answer-local evidence而非 cross-answer comparative
    evidence。这不是implementation bug而是architectural limitation——LLM traces naturally
    argue FOR their conclusion而非AGAINST alternatives。 对reframed paper：这是"why symbolic
    consensus fails"的mechanistic explanation， 升级为Section 5的核心内容。


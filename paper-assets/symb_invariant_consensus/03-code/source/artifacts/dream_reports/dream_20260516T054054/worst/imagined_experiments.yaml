tier: worst
narrative_guidance: '彻底放弃 accuracy improvement claim。Reframe 为： "Why Symbolic Consensus
  Fails: A Diagnostic Framework for Constraint-Based LLM Aggregation"。 核心贡献变为三层：(1)
  C0 diagnostic framework — 零成本判断任何 consensus method 是否值得部署， (2) 推理模型 vs 指令模型的 trace
  diversity 根因分析， (3) 对 "symbolic structure helps reasoning" 假设的精确化否定条件。 Tiebreak
  机制的高 win rate 作为 "method is correct but regime is narrow" 的证据。 QwQ 负结果从配角升为主角。目标
  venue 调整为 Findings of EMNLP 或 EMNLP short。

  '

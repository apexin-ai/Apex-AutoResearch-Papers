      maxsat_solving_pct: 0.014
      overhead_other_s: 0.8
      overhead_other_pct: 0.014
    sica_overhead_vs_sc_pct: 0.27
    sc_only_time_per_question_s: 42.5
    sica_marginal_cost_s: 15.7
    maxsat_p99_time_s: 3.2
    constraint_extraction_gpu_required: true
  result_rationale: 'Generation dominates (73% of time) because K=12 traces must be
    generated regardless for SC. SICA''s marginal overhead is constraint extraction
    (24.2%) + MaxSAT (1.4%) = ~27% wall-time increase. Constraint extraction requires
    a second LLM call per trace (extracting FOL), making it GPU-bound. MaxSAT solving
    is negligible (<1s) since problems have ~200-300 constraints with 3-5 candidates.
    In worst tier, this overhead is particularly unflattering: 27% more compute for
    +0.3pp combined gain is a terrible cost-benefit ratio. Even the FOLIO-only case
    (+2.0pp for 27% overhead) is questionable. The paper must present this honestly
    — SICA overhead is moderate in absolute terms but cannot be justified by the accuracy
    gains in this tier.

    '
  tables:
  - name: T4 (Overhead Analysis)
    content: '| Component               | Mean (s) | % Total | GPU Required |

      |-------------------------|----------|---------|--------------|

      | Trace Generation (K=12) | 42.5     | 73.0%   | Yes          |

      | Constraint Extraction   | 14.1     | 24.2%   | Yes          |

      | MaxSAT Solving          | 0.8      | 1.4%    | No           |

      | Other (I/O, parsing)    | 0.8      | 1.4%    | No           |

      | **Total SICA**          | **58.2** | 100%    |              |

      | SC-only baseline        | 42.5     | —       | Yes          |

      | **SICA marginal cost**  | **15.7** | +27%    |              |

      '
  figures_description:
  - 'Stacked bar chart: SICA vs SC wall-time per question. SC bar: 42.5s (generation
    only). SICA bar: 42.5s generation + 14.1s extraction + 0.8s MaxSAT. Visual emphasis
    on the marginal 27% cost.'
  analysis: 'The overhead story is manageable for an analysis paper — the 27% overhead
    is presented as a characterization datum, not justified by accuracy. The reframe:
    "SICA''s compute cost is dominated by constraint extraction, not MaxSAT. Future
    efficiency gains should target extraction (batching, caching, distilled extractor)
    rather than solver optimization." Note: MaxSAT is trivially fast, which at least
    validates the solver-side engineering.

    '

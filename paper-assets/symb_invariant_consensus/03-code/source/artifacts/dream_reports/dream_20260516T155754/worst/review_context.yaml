narrative_guidance: 'Activate D023 contingency. Expanded results confirm D012''s +6.7pp
  was a small-sample artifact — FOLIO gap shrinks to ~+2pp on 204 questions, ProofWriter
  flat or slightly negative, combined gap ≤+1pp and non-significant (p>0.2). C0 pattern
  robustly replicates across 3 families and 2 reasoning architectures, but high C0
  does NOT translate to SICA>SC. The paper pivots to: "Characterizing When Symbolic
  Consensus Methods Fail — and Why Trace Diversity Is Necessary But Not Sufficient."
  Primary contribution becomes operating regime characterization (Claim 2 intact).
  Claim 1 weakens to "interpretable tiebreaking" without accuracy claims. New analysis:
  constraint extraction quality is the missing second condition — noisy FOL and incorrect
  exclusions explain why diversity alone doesn''t help. Target EMNLP Findings (primary)
  or AAAI 2027 Main (fallback with method improvements).

  '
imagined_experiments:
- name: sica_expanded_14b
  plan_id: exp-001
  description: 'Full-scale evaluation: PW D5 600 + FOLIO 204 = 804 questions, K=12,
    T=0.7'
  expected_results:
    n_total: 804
    n_folio: 204
    n_proofwriter: 600
    sica_accuracy_combined: 0.765
    sc_accuracy_combined: 0.762
    sica_sc_gap_combined_pp: 0.3
    bootstrap_p_combined: 0.38
    sica_accuracy_folio: 0.755
    sc_accuracy_folio: 0.735
    sica_sc_gap_folio_pp: 2.0
    bootstrap_p_folio: 0.14
    sica_accuracy_proofwriter: 0.769
    sc_accuracy_proofwriter: 0.773
    sica_sc_gap_proofwriter_pp: -0.4
    bootstrap_p_proofwriter: 0.62
    c0_multi_candidate_rate_combined: 0.38
    c0_folio: 0.42
    c0_proofwriter: 0.36
    c1_extraction_rate: 0.97
    total_constraints_unique: ~23000
    maxsat_exclusion_rate: 0.031
    wall_time_hours: ~13
    tiebreak_problems: ~45
    tiebreak_sica_wins: 26
    tiebreak_sica_win_rate: 0.58
  result_rationale: 'D012''s +6.7pp FOLIO gap was inflated by small-sample variance
    (30 questions, ~5 lucky tiebreaks). On 204 FOLIO questions the gap regresses toward
    the mean: more questions have clear SC majorities where SICA cannot intervene,
    and tiebreak cases (~20%) show only modest SICA advantage (~58% win rate vs 50%
    random). ProofWriter D5 is inherently harder for constraint extraction — its multi-hop
    chains produce FOL with nested quantifiers that the LLM-based extractor frequently
    mis-translates, leading to noisy constraints that cancel out or slightly hurt
    via incorrect exclusions. The combined gap (+0.3pp) is well within noise at p=0.38.
    C0 remains at ~38% for instruction-tuned 14B (genuine output diversity exists),
    confirming that diversity is necessary but not sufficient — constraint quality
    is the bottleneck preventing MaxSAT from exploiting that diversity.

    '
  tables:
  - name: T1 (Main Results — 14B rows)
    content: '| Dataset     |   N | SC Acc | SICA Acc | Δpp  | p-val | C0    |

      |-------------|-----|--------|----------|------|-------|-------|

      | FOLIO       | 204 | 73.5%  | 75.5%   | +2.0 | 0.14  | 0.42  |

      | PW-D5       | 600 | 77.3%  | 76.9%   | −0.4 | 0.62  | 0.36  |

      | Combined    | 804 | 76.2%  | 76.5%   | +0.3 | 0.38  | 0.38  |

      '
  - name: T2 (Tiebreak Comparison — expanded)
    content: '| Method           | Tie Wins | Tie Acc | Overall Δ vs SC-det |

      |------------------|----------|---------|---------------------|

      | SICA (MaxSAT)    | 26/45    | 57.8%  | +0.3pp              |

      | SC-random        | ~22/45   | ~50%   | +0.0pp              |

      | SC-deterministic | 20/45    | 44.4%  | baseline            |

      '
  figures_description:
  - 'F2 (C0 vs Gap Scatter): 14B-expanded point sits at (C0=0.38, gap=+0.3pp), far
    below the regression line implied by D012. FOLIO sub-point at (0.42, +2.0) still
    positive but weak. PW sub-point at (0.36, −0.4) negative. The scatter shows no
    clear positive correlation between C0 and gap — high C0 is necessary for any chance
    of improvement but does not guarantee it.'
  analysis: 'The key finding is that 804-question power kills the accuracy claim.
    FOLIO retains a positive trend (+2.0pp, p=0.14 — borderline) but PW drags the
    combined result to noise. The pivot insight: C0=38% means ~300 questions have
    multi-candidate votes, yet MaxSAT picks the right candidate only ~1pp more often
    than random among those. Constraint extraction error analysis becomes critical
    — expect ~15-20% of extracted FOL to be semantically incorrect, and exclusion
    rate (3.1%) is too conservative to matter. The paper must now argue that C0 *identifies*
    where symbolic methods could help, not that the current implementation *does*
    help.

    '
- name: sica_k_ablation_14b

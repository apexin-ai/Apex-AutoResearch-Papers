        sica_accuracy: 0.733
        sc_accuracy: 0.733
        gap_pp: 0.0
        c0: 0.55
        tiebreak_count: 2
        tiebreak_sica_wins: 1
    wall_time_hours: ~4.5
  result_rationale: 'In worst tier, the K ablation reveals that SICA''s gain is almost
    entirely mediated by tiebreaking, and tiebreak frequency drops sharply with higher
    K. At K=6, even splits (3-3) are common (~8/60), giving SICA chances to intervene.
    At K=12 (original), 5 ties remain and SICA wins most. But at K=16 and K=20, the
    law of large numbers kicks in — SC majorities solidify, ties become rare (2-3
    problems), and the gap collapses to 0pp. C0 increases slightly with K (more samples
    → more chance of diverse answers) but this doesn''t translate to accuracy because
    the additional diversity is in minority votes that SC correctly outvotes anyway.
    The pattern confirms SICA is a tiebreaker, not a systematic improver — at sufficiently
    high K, ties vanish and so does the gap.

    '
  tables:
  - name: T3 (K Sensitivity)
    content: '| K  | SC Acc | SICA Acc | Δpp  | C0    | #Ties | Tie WR |

      |----|--------|----------|------|-------|-------|--------|

      | 6  | 70.0%  | 71.7%   | +1.7 | 0.383 | 8     | 62.5%  |

      | 8  | 70.0%  | 71.7%   | +1.7 | 0.450 | 6     | 66.7%  |

      | 12 | 70.0%  | 73.3%   | +3.3 | 0.533 | 5     | 80.0%  |

      | 16 | 71.7%  | 71.7%   | 0.0  | 0.533 | 3     | 66.7%  |

      | 20 | 73.3%  | 73.3%   | 0.0  | 0.550 | 2     | 50.0%  |

      '
  figures_description:
  - 'F4 (K Curve): Two-panel. Left: SICA and SC accuracy vs K — lines converge and
    overlap by K=16. Right: tie count vs K — exponential decay from 8 (K=6) to 2 (K=20).
    Visual proof that SICA benefit is purely a function of tie frequency, not systematic
    constraint exploitation.'
  analysis: 'This is actually a useful result for the worst-tier narrative: it cleanly
    demonstrates that SICA operates exclusively through tiebreaking. The paper reframes
    this as a principled finding — at what K does the tiebreak channel close? The
    K curve becomes evidence for the "necessary but not sufficient" story. SC accuracy
    itself improves with K (70% → 73.3%), confirming that more samples help SC directly.
    SICA''s value-add is confined to the K<16 regime where ties are common.

    '
- name: tiebreak_baseline_analysis
  plan_id: exp-003
  description: Compare SICA vs SC-random vs SC-deterministic on all available data
    (expanded)
  expected_results:
    dataset: expanded_804
    sica_tiebreak_accuracy: 0.578
    sc_random_tiebreak_accuracy: 0.5
    sc_deterministic_tiebreak_accuracy: 0.444
    sica_overall_accuracy: 0.765
    sc_random_overall_accuracy: 0.763
    sc_deterministic_overall_accuracy: 0.762
    tiebreak_count: 45
    sica_unique_wins_vs_random: 4
    random_unique_wins_vs_sica: 3
  result_rationale: 'On 804 questions, ~45 have tied SC votes. SICA resolves these
    at 57.8% (slightly better than random 50%) but the gap between SICA and SC-random
    on overall accuracy is only 0.2pp — within noise. The D012 result (80% tiebreak
    win rate on 5 ties) was a 5-trial coin flip that happened to land favorably. At
    45 ties, regression to the mean is severe. The fundamental issue: MaxSAT constraint
    weighting has low signal-to-noise ratio because extracted FOL constraints are
    often semantically incorrect or trivially satisfied by all candidates. The "principled"
    advantage over random is real but tiny — maybe 8pp in tie accuracy, translating
    to <0.5pp in overall accuracy.

    '
  tables: []
  figures_description:
  - 'Bar chart: tiebreak resolution accuracy for SICA (57.8%), SC-random (50%), SC-deterministic
    (44.4%). Error bars from bootstrap show overlapping CIs between SICA and SC-random.'
  analysis: 'This result is the worst-tier''s most damaging finding for Claim 1. The
    honest conclusion: SICA provides a slightly-better-than-random tiebreak, but the
    advantage is not statistically distinguishable from luck at N=45 ties. The paper
    must present this transparently and pivot to interpretability: "SICA provides
    an auditable, constraint-based reason for its tiebreak choice, even when the accuracy
    advantage is marginal."

    '
- name: sica_7b_scaling
  plan_id: exp-004
  description: Qwen2.5-7B-Instruct on D012 60 questions, testing C0 scaling
  expected_results:
    model: Qwen2.5-7B-Instruct
    n: 60
    sica_accuracy: 0.583
    sc_accuracy: 0.567
    gap_pp: 1.7
    bootstrap_p: 0.42
    c0_multi_candidate_rate: 0.65
    c1_extraction_rate: 0.92
    maxsat_exclusion_rate: 0.048
    tiebreak_count: 10
    tiebreak_sica_wins: 6
    folio_sica: 0.633
    folio_sc: 0.6
    proofwriter_sica: 0.533
    proofwriter_sc: 0.533
    wall_time_hours: ~1.8
  result_rationale: '7B is weaker → lower baseline accuracy (SC ~56.7% vs 14B''s 70%)
    and higher C0 (65% vs 53.3%). This confirms the C0-as-uncertainty hypothesis:
    weaker models produce more diverse (less confident) outputs. However, in worst
    tier, higher C0 still doesn''t translate to meaningful SICA gains (+1.7pp, p=0.42).
    Why: the 7B model generates even noisier FOL constraints than 14B. Its constraint
    extraction quality is substantially worse — more hallucinated predicates, incorrect
    logical structures, irrelevant constraints. So while there are more tiebreak opportunities
    (10 vs 5 on 60 questions), SICA''s tiebreak resolution accuracy is lower (~60%)
    because the signal in constraints degrades faster than the opportunity increases.
    The net effect is a small, non- significant gap. This is the crux of the worst-tier
    insight: C0 (diversity) increases with weakness, but constraint quality decreases
    — these forces cancel.

    '
  tables:
  - name: T1 (Main Results — 7B row)
    content: '| Model          | Dataset  |  N | SC Acc | SICA Acc | Δpp  | p    |
      C0   |

      |----------------|----------|----|--------|----------|------|------|------|

      | Qwen2.5-7B-Ins | Combined | 60 | 56.7%  | 58.3%   | +1.7 | 0.42 | 0.65 |

      | Qwen2.5-7B-Ins | FOLIO    | 30 | 60.0%  | 63.3%   | +3.3 | 0.35 | 0.60 |

      | Qwen2.5-7B-Ins | PW-D5    | 30 | 53.3%  | 53.3%   | 0.0  | 0.50 | 0.70 |

      '
  figures_description:
  - 'F2 addition: 7B point at (C0=0.65, gap=+1.7pp). Higher C0 than 14B but gap still
    small. Visually reinforces that C0 is necessary but not sufficient.'
  analysis: '7B validates the C0 scaling direction (weaker → higher C0) which is good
    for Claim 2. But the non-significant gap despite C0=65% is the worst-tier''s central
    negative result. New analysis opportunity: plot constraint extraction quality
    (measured by semantic coherence or predicate consistency) against model size.
    Hypothesis: quality drops faster than diversity rises, creating a "diversity-quality
    tradeoff" that explains the null result. This becomes a key figure in the reframed
    analysis paper.

    '

- name: constraint_ablation
  plan_id: exp-013
  description: 'CPU-only ablation: SICA-MaxSAT vs count-only vs random-weight on expanded
    data'
  expected_results:
    dataset: expanded_804
    methods:
      maxsat_full:
        accuracy: 0.765
        gap_vs_sc_pp: 0.3
        tiebreak_win_rate: 0.578
      count_only:
        accuracy: 0.764
        gap_vs_sc_pp: 0.2
        tiebreak_win_rate: 0.556
      random_weight:
        accuracy: 0.763
        gap_vs_sc_pp: 0.1
        tiebreak_win_rate: 0.533
      sc_deterministic:
        accuracy: 0.762
        gap_vs_sc_pp: 0.0
        tiebreak_win_rate: 0.444
    maxsat_vs_count_only_pp: 0.1
    maxsat_vs_random_weight_pp: 0.2
    pairwise_p_maxsat_vs_count: 0.72
  result_rationale: 'In worst tier, MaxSAT ≈ count-only (Δ=0.1pp, p=0.72). The satisfiability
    checking that makes MaxSAT "principled" adds almost nothing over simply counting
    how many constraints support each answer. Why: with ~62% semantic correctness
    in extracted constraints, the satisfiability signal is too noisy to differentiate
    from counting. Both methods are marginally better than random weights (which is
    marginally better than deterministic SC), forming a weak monotonic ordering that
    fails significance at every step. The total spread from worst (SC-deterministic)
    to best (MaxSAT) is only 0.3pp. This is the worst-tier''s most damaging result
    for the "MaxSAT is essential" sub-claim — the solver''s satisfiability reasoning
    is being drowned by noise from upstream constraint extraction errors.

    '
  tables:
  - name: Constraint Ablation
    content: '| Method          | Accuracy | Δ vs SC | Tie WR | Δ vs MaxSAT |

      |-----------------|----------|---------|--------|-------------|

      | SICA-MaxSAT     | 76.5%    | +0.3pp  | 57.8%  | —           |

      | SICA-Count-Only | 76.4%    | +0.2pp  | 55.6%  | −0.1pp      |

      | SICA-Random-Wt  | 76.3%    | +0.1pp  | 53.3%  | −0.2pp      |

      | SC-Deterministic| 76.2%    | baseline| 44.4%  | −0.3pp      |

      '
  figures_description:
  - 'Bar chart: accuracy by method, all bars within 0.3pp. Error bars heavily overlapping.
    Visual message: MaxSAT adds no statistically detectable value over simpler alternatives.'
  analysis: 'The ablation is devastating for the "MaxSAT is necessary" argument. The
    paper must reframe: "Constraint-based approaches provide a monotonic improvement
    gradient from random → counting → satisfiability, but the magnitude is governed
    by constraint quality. With current extraction fidelity (~62%), the satisfiability
    signal is below the noise floor." This motivates future work on extraction quality
    rather than solver sophistication. The positive spin: the monotonic ordering is
    at least directionally correct, suggesting that with better constraints, MaxSAT
    could differentiate itself.

    '

    sica_wrong_despite_constraints_ok: 2
  result_rationale: 'In worst tier, the case study analysis reveals the smoking gun:
    constraint extraction quality is mediocre (~62% semantically correct). The LLM-based
    FOL extractor hallucinates predicates that don''t appear in the original reasoning
    trace (~15%), mishandles quantifier scope (~10%), and occasionally drops negations
    (~8%). MaxSAT operates faithfully on these constraints, but garbage-in-garbage-out:
    when 38% of constraints are noisy, the satisfiability signal is diluted. Exclusion
    analysis is particularly damning — 30% of excluded constraints were actually correct
    (false exclusion), meaning MaxSAT is throwing away valid evidence. Among SICA''s
    wrong answers, 2/4 had reasonable constraints but MaxSAT weighted the wrong candidate
    due to accumulation of small errors. This is the core explanation for why high
    C0 doesn''t translate to gains.

    '
  tables: []
  figures_description:
  - 'Case study figure: side-by-side comparison of a SICA-correct and SICA-wrong example.
    Left: correct case shows clean FOL extraction, appropriate exclusion, MaxSAT selects
    right answer. Right: wrong case shows hallucinated predicate in 2 constraints,
    incorrect exclusion of a valid constraint, MaxSAT tipped toward wrong answer.'
  analysis: 'This is the most important analysis for the reframed paper. The constraint
    quality breakdown provides the "missing second condition" for the pivot narrative:
    trace diversity (C0) enables MaxSAT to consider alternatives, but constraint extraction
    fidelity determines whether MaxSAT can discriminate correctly. The 62% semantic
    correctness rate on 14B suggests that current LLM FOL extraction is insufficient
    for reliable symbolic consensus. Future work direction: improve constraint extraction
    (fine-tuned extractor, multi-round verification) before expecting SICA to deliver
    systematic gains.

    '

      total_constraints_unique: 22100
      maxsat_exclusion_rate: 0.031
      tiebreak_problems: 68
      tiebreak_sica_win_rate: 0.78
      wall_time_hours: 12.5
    result_rationale: D012 pilot showed +6.7pp on FOLIO (30q) and 0pp on PW (30q).
      At scale, FOLIO gain regresses toward mean but stays strong (+5.4pp) because
      FOLIO's formal logic structure aligns perfectly with FOL constraint extraction
      — the method's sweet spot. ProofWriter emerges positive (+2.3pp) because 600
      questions reveal a long tail of genuinely ambiguous depth-5 problems where trace
      diversity creates actionable ties; the pilot's 0pp was a small-sample floor
      effect (30q × 67% unanimous = only 10 contested problems). Combined significance
      achieves p=0.018 because 804 questions with 43% multi-candidate rate yields
      ~345 problems where SICA can differentiate, providing sufficient statistical
      power. The C0 sustains near pilot levels (pilot was 53%) because 14B-Instruct
      remains uncertain on logic reasoning at T=0.7 — these are genuinely difficult
      for a 14B instruction model.
    tables:
    - 'T1: Main Results (14B row, FOLIO + PW columns)'
    - 'T2: Tiebreak Analysis (68 tie problems, win/loss/draw)'
    figures_description:
    - 'F2 data points: (C0=0.48, gap=5.4) for FOLIO-14B, (C0=0.41, gap=2.3) for PW-14B'
    analysis: 'Core P0 result validates all three claims. FOLIO''s stronger gain than
      PW reflects domain alignment: FOLIO premises are already near-FOL, so constraint
      extraction is high-fidelity. PW depth-5 has longer chains where extraction noise
      accumulates, diluting signal. The 78 tiebreak problems with 78% SICA win rate
      directly supports Claim 1. Bootstrap p=0.018 clears significance threshold.'
  - name: sica_k_ablation_14b
    plan_id: exp-002
    description: K sensitivity (K=6,8,12,16,20) on D012's 60 questions
    expected_results:
      k6_sica_accuracy: 0.717
      k6_sc_accuracy: 0.7
      k6_gap_pp: 1.7
      k6_c0: 0.38
      k6_tiebreak_freq: 0.12
      k8_sica_accuracy: 0.733
      k8_sc_accuracy: 0.7
      k8_gap_pp: 3.3
      k8_c0: 0.45
      k8_tiebreak_freq: 0.22
      k12_sica_accuracy: 0.75
      k12_sc_accuracy: 0.7
      k12_gap_pp: 5.0
      k12_c0: 0.53
      k12_tiebreak_freq: 0.3
      k16_sica_accuracy: 0.75
      k16_sc_accuracy: 0.717
      k16_gap_pp: 3.3
      k16_c0: 0.55
      k16_tiebreak_freq: 0.25
      k20_sica_accuracy: 0.75
      k20_sc_accuracy: 0.733
      k20_gap_pp: 1.7
      k20_c0: 0.57
      k20_tiebreak_freq: 0.18
      optimal_k: 12
      wall_time_hours: 4.2
    result_rationale: 'K=12 is optimal because it balances two opposing forces: (1)
      more samples increase C0 (more chances to surface minority answers), but (2)
      more samples also strengthen majority signal, reducing tie frequency. At K=6,
      too few samples → low C0 (38%) and few ties for SICA to resolve. At K=12, C0
      peaks in utility — enough diversity to surface genuine alternatives without
      majority domination. At K=16/20, majority voting becomes so strong that ties
      become rare again (SC itself converges), and SICA''s tiebreaking advantage shrinks
      even though C0 is nominally higher. The gap curve is thus non-monotonic: rises
      to K=12, plateaus, then narrows. This makes physical sense — SICA helps most
      when voting is close, not when it''s unanimous or when majority dominates by
      large margin.'
    tables:
    - 'T3: K Sensitivity (5 rows × metrics)'
    figures_description:
    - 'F4: K vs accuracy curve (SICA and SC lines), with tiebreak frequency overlay'
    - 'F2 additional data points: 5 points at different K values showing C0-gap relationship
      within single model'
    analysis: 'K=12 sweet spot confirms paper''s default choice is principled, not
      cherry-picked. The non-monotonic gap pattern reveals SICA''s mechanism: it specifically
      resolves close calls. At high K, SC self-resolves most ties through volume.
      This insight strengthens the ''principled tiebreaking'' narrative — SICA is
      most valuable precisely where SC is least certain.'
  - name: tiebreak_baseline_analysis
    plan_id: exp-003
    description: Compare SICA vs SC-random-tiebreak vs SC-deterministic on all available
      data
    expected_results:
      sica_tiebreak_accuracy: 0.78
      sc_random_tiebreak_accuracy: 0.5
      sc_alphabetical_accuracy: 0.55
      sc_first_seen_accuracy: 0.45
      sc_longest_chain_accuracy: 0.52
      n_tiebreak_problems: 68
      sica_vs_random_p_value: 0.003
      sica_unique_wins: 21
      sica_unique_losses: 6
      random_equivalent_problems: 41
    result_rationale: On 68 tied problems from exp-001 expanded data, SICA achieves
      78% because MaxSAT constraint weighting genuinely captures reasoning quality
      signal — traces with more satisfiable constraints tend to contain fewer logical
      errors. Random tiebreak hits 50% by definition (chance on binary/ternary outcomes).
      Alphabetical gets 55% due to mild label-answer correlation in FOLIO (True slightly
      more common). First-seen gets 45% (slight anti-correlation with generation order).
      The 28pp gap over random (78% vs 50%) on 68 problems is significant at p=0.003
      (binomial test), providing direct evidence that SICA's tiebreaking mechanism
      captures real signal rather than getting lucky. This is the cleanest possible
      defense against the 'random baseline closes the gap' attack.
    tables:
    - 'T2: Tiebreak Comparison (5 strategies × win rate)'
    figures_description:
    - 'Bar chart: tiebreak accuracy by method, with significance brackets'
    analysis: 'The 28pp gap between SICA and random tiebreaking is the single most
      defensible number in the paper. It isolates SICA''s contribution from any sampling
      or dataset artifact. 68 tie problems give sufficient power for a binomial test.
      This directly refutes Reviewer Concern #7.'

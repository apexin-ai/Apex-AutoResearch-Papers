        - 0.55
        c0_mistral_7b:
        - 0.3
        - 0.6
        c0_llama_8b:
        - 0.3
        - 0.6
        cross_family_gap_pp:
        - 1.5
        - 5.0
        maxsat_vs_count_only_pp:
        - 2.0
        - 5.0
        tiebreak_win_rate:

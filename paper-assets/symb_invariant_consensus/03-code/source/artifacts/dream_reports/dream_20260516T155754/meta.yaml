      - ProofWriter shows ~0pp on 600 questions (no gain, no loss)
      - Combined gap exists (+1-2pp) but p≈0.05-0.15 (marginal)
      - At least 2/3 cross-family models show expected C0 pattern
      - One cross-family model shows anomalous C0 or negative gap
      - Constraint ablation shows MaxSAT ≥ count-only but difference small (<2pp)
      - C0 gradient exists but noisy (7B>>14B, 72B not clearly lower than 14B)

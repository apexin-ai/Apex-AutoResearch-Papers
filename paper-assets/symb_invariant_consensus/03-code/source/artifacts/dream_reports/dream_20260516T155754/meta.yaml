  - name: overhead_analysis
    plan_id: exp-009
    description: 'Wall-time breakdown per question: generation, constraint extraction,
      MaxSAT solving'
    expected_results:
      avg_total_time_per_problem_s: 85
      generation_time_s: 72
      generation_fraction: 0.847
      constraint_extraction_time_s: 11
      extraction_fraction: 0.129
      maxsat_solving_time_s: 2
      maxsat_fraction: 0.024
      overhead_vs_sc_pct: 15.3
      marginal_cost_per_pp_gain: 4.4s per +1pp
      gpu_cost_fraction: 0.98
      cpu_only_fraction: 0.02
    result_rationale: Generation dominates (85%) because K=12 traces with Qwen-14B
      at ~512 tokens each requires 12 forward passes through a 14B model. Constraint
      extraction adds 13% — it's an additional LLM call per trace but with a shorter
      prompt/response (extract FOL from single trace). MaxSAT solving is negligible
      (2%) because Z3 solves weighted partial MaxSAT on ~20-100 constraints in milliseconds.
      Total overhead vs vanilla SC (which also needs K=12 generations) is only 15%
      — the extraction call is the only addition. This means SICA's cost is dominated
      by the same generation cost SC already pays. The 15% overhead for +3.5pp gain
      is a favorable trade-off reviewers can evaluate quantitatively.
    tables:
    - 'T4: Overhead Breakdown (generation/extraction/solving × time/fraction)'
    figures_description:
    - 'Stacked bar chart: time breakdown per component, showing generation dominates'
    analysis: The 15% overhead number is the key reviewer-facing metric. Since SC
      already requires K generations, SICA only adds constraint extraction (one additional
      short LLM call per trace). MaxSAT is free (CPU, milliseconds). This pre-empts
      the 'impractical overhead' objection — the marginal cost is one extraction call
      per trace, amortized over K=12 samples that were already being generated.

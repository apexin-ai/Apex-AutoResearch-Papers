      constraint 覆盖不足）。K=12 是 sweet spot——足够的 trace 保证 constraint 质量，tie 率仍可观（17%）。K=16/20
      时 SC 趋于自足——更多投票使多数规则本身变强，SICA 的 marginal value 递减至 <2pp。Gap 与 tie rate 的正相关直接支撑
      'SICA 本质是 principled tiebreaker' 的定位。

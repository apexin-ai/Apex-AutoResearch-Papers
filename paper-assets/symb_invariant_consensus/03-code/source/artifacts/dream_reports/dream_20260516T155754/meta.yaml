    figures_description:
    - 'F4: 双 Y 轴折线图，X=K，左 Y=SICA-SC gap(pp)，右 Y=tie rate(%)，两线正相关；K=12 标注为 recommended'
    analysis: K sensitivity 证明 SICA 优势与 tie 频率系统性共变（非 K 的偶然产物），验证 principled tiebreaking
      叙事。K=12 选择有充分依据：accuracy 与 gap 的最佳平衡点。论文中用 F4 作为 Claim 1 的 mechanistic evidence。

    models at this capability level. Combined cross-family result: mean gap = +3.3pp,
    all C0 > 25%, all gaps positive.'
- name: gsm8k_pilot_14b
  plan_id: exp-012
  description: Qwen2.5-14B on GSM8K 30-question pilot (K=12), cross-domain test
  expected_results:
    sica_accuracy: 0.9
    sc_accuracy: 0.9
    gap_pp: 0.0
    c0: 0.1
    constraints_per_problem: 42
    extraction_rate: 0.88
    exclusion_rate: 0.02
    multi_candidate_problems: 3
    wall_time_hours: 0.8
  result_rationale: 'Qwen2.5-14B achieves ~90% on GSM8K because it''s an easy benchmark
    for this model class. With 90% accuracy and K=12, most problems have 11-12 traces
    agreeing on the correct answer → C0=10% (only 3/30 problems have any diversity).
    This low C0 is NOT because the constraint extraction fails — extraction rate is
    still 88% — but because the model simply knows the answers. SICA=SC because there
    are no ties to break. This is the ideal ''negative control for a different reason'':
    on logic tasks, 14B shows high C0 because the tasks challenge it; on arithmetic,
    the same model shows low C0 because it''s too capable. This proves C0 reflects
    task-relative difficulty, strengthening Claim 3''s ''practical diagnostic'' framing
    — if you see low C0, don''t bother with SICA regardless of domain.'
  tables:
  - 'Appendix table: GSM8K pilot results'
  figures_description:
  - 'F2: (C0=0.10, gap=0.0) point — same model as (C0=0.48, gap=5.4), different task.
    Arrow annotation: ''same model, task-dependent C0'''
  - 'F3: GSM8K column shows 14B in ''SICA=SC'' zone (contrasts with logic column)'
  analysis: 'GSM8K confirms C0 is task-relative, not model-fixed. The same 14B model
    shows C0=48% on FOLIO but C0=10% on GSM8K — proving C0 reflects model-task interaction,
    not just model weakness. This is a key insight for practitioners: compute C0 on
    YOUR task before deciding to deploy SICA. For paper, this adds the cross-domain
    dimension without requiring SICA to ''work'' on easy tasks.'
- name: constraint_ablation
  plan_id: exp-013
  description: SICA-MaxSAT vs SICA-count-only vs SICA-random-weight, CPU-only
  expected_results:
    maxsat_accuracy: 0.763
    count_only_accuracy: 0.737
    random_weight_accuracy: 0.728
    maxsat_vs_count_only_gap_pp: 2.6
    maxsat_vs_random_weight_gap_pp: 3.5
    count_only_vs_sc_gap_pp: 0.9
    maxsat_tiebreak_accuracy: 0.78
    count_only_tiebreak_accuracy: 0.62
    random_weight_tiebreak_accuracy: 0.51
    n_problems_where_methods_differ: 22
    maxsat_wins_over_count: 14
    count_wins_over_maxsat: 5
    ties_between_methods: 3
  result_rationale: 'MaxSAT beats count-only by 2.6pp because satisfiability checking
    adds genuine signal beyond constraint counting. Count-only asks ''which answer
    has more supporting constraints?'' — this captures quantity but not quality. MaxSAT
    asks ''which answer has the most internally consistent constraint set?'' — this
    captures whether the reasoning chains are logically coherent, not just numerous.
    On the 22 problems where they differ, MaxSAT wins 14 vs count-only''s 5 because
    constraint consistency correlates with reasoning correctness: a correct reasoning
    chain produces constraints that form a satisfiable set, while an incorrect chain
    often produces contradictions. Random-weight performs near SC-random (51% tiebreak
    accuracy) confirming that the weighting scheme matters. The 2.6pp gap (within
    [2.0, 5.0] best-tier range) directly refutes the ''over-engineering'' objection
    — MaxSAT''s satisfiability reasoning is genuinely load-bearing.'
  tables:

    figures_description:
    - 'F2 (Hero Figure): Scatter, x=vote_entropy (0.3–1.8), y=constraint_precision
      (0–1.0)。 307 points, blue=ProofWriter, orange=FOLIO。水平参考线 y=0.50。Points 形成 diffuse

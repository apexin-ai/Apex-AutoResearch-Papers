  review_report: "---\ndream_id: dream_20260517T144412\ntier: median\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-17T15:57:49.941192+00:00\n---\n\n# Dream Review\
    \ Report: \"The Capability Trap: Why Symbolic Consensus Cannot Beat Majority Voting\
    \ for LLM Reasoning\"\n\n**Review Mode:** Full (2 Reviewers + Roundtable)\n**Date:**\
    \ 2026-05-17\n**Venue Standard:** Top ML venue, ~25% acceptance rate, 6-point\
    \ scale\n\n---\n\n## Reviewer R1: Methods and Experiments\n\n**Score: 4 (Weak\
    \ Accept) | Confidence: Medium-high**\n\n### Summary\nThe paper proposes SICA\
    \ (FOL constraint extraction + weighted MAX-SAT) and systematically demonstrates\
    \ it provides no gain over majority voting across 5 models, 6 domains, and 1,300+\
    \ problems. The constraint ablation (MAX-SAT = counting = random-weight, 99.4%\
    \ agreement) is the strongest evidence. The \"capability trap\" framework explains\
    \ the null result: instruction-scale models produce diversity but non-discriminative\
    \ constraints, reasoning models eliminate diversity.\n\n### Strengths\n- **Strong\
    \ core ablation.** Table 2 (MAX-SAT vs count-only vs random-weight, 801/804 agreement)\
    \ directly demonstrates the mechanism is vacuous. More informative than simply\
    \ reporting null accuracy differences.\n- **Temperature ablation provides causal\
    \ evidence.** Manipulating diversity continuously (C0 from 30% to 58%) while holding\
    \ model/data constant rules out the \"wrong operating point\" objection.\n- **Appropriate\
    \ statistical protocol.** McNemar's test for paired binary outcomes is the correct\
    \ choice. The paper does not over-claim and reports non-significance honestly.\n\
    - **Powered main experiment.** The n=804 combined test convincingly rules out\
    \ practically meaningful effects (detectable effect at 80% power is ~3.5pp; observed\
    \ Δ=+0.3pp).\n- **Multiple baselines.** Logic-LM adaptation, weighted SC variants,\
    \ and random-weight ablation systematically eliminate alternative explanations.\n\
    - **Overhead quantification.** Table 7 provides actionable practitioner guidance:\
    \ 48% overhead for zero gain.\n- **C0 as practical early-stopping gate.** Zero-cost\
    \ and immediately deployable.\n\n### Weaknesses\n- **Underpowered cross-model\
    \ conditions.** Most conditions use n=60 (SE ≈ 6pp), where detectable effects\
    \ are ~12-15pp. Claims about LLaMA-8B (+5.0pp), Qwen-7B (+1.7pp), Qwen-72B (-1.7pp)\
    \ \"confirming\" the null are statistically meaningless individually. Only the\
    \ Qwen-14B n=804 result is genuinely powered.\n- **Potential method formulation\
    \ issue.** The MAX-SAT formulation (Eq. 1) sums satisfaction scores per candidate\
    \ answer, but it is unclear whether constraints from trace t_i are evaluated against\
    \ answers *other than* the one t_i produced. If constraints are only evaluated\
    \ under their own trace's answer, the method is structurally a weighted vote (each\
    \ trace's weight = its own constraint count), and the negative result is trivially\
    \ expected rather than surprising. This is potentially fatal to the paper's claim\
    \ of testing \"symbolic consensus.\"\n- **Circularity concern in precision analysis.**\
    \ Constraint precision is defined as \"fraction of constraints discriminating\
    \ correct from incorrect answers.\" If satisfaction checking uses the LLM rather\
    \ than a ground-truth solver, the metric inherits the limitation it claims to\
    \ measure.\n- **No domain where SICA's advantage should be maximal.** All tested\
    \ domains use relatively simple reasoning (binary/3-way/4-way classification).\
    \ Harder multi-hop benchmarks (CLUTRR, PrOntoQA with long chains) where constraint\
    \ structure carries more information are not tested.\n- **Missing error analysis\
    \ on discordant problems.** The 5 problems where MAX-SAT and count-only disagree\
    \ are the most informative cases. Detailed examination would reveal what makes\
    \ constraints occasionally useful.\n- **Temperature ablation also underpowered.**\
    \ n=60 per condition means effects under ~12pp cannot be detected. \"Zero at every\
    \ temperature\" is not statistically established.\n\n### Questions for Authors\n\
    1. **Critical:** In the MAX-SAT formulation, are constraints from trace t_i evaluated\
    \ against answers other than ans(t_i)? If not, the method is structurally a weighted\
    \ vote.\n2. **Critical:** Is SAT(c|a) computed by a ground-truth theorem prover\
    \ (Z3) or by prompting the LLM?\n3. What is the distribution of constraint counts\
    \ per trace? If most traces produce 1-2 constraints, weighting has minimal effect.\n\
    4. What fraction of the 804 problems are multi-candidate (C0>0)? Is 307 the correct\
    \ denominator for the precision analysis?\n\n### Missing Experiments\n1. **Oracle\
    \ extraction control.** Use a stronger model (GPT-4, Claude) as constraint extractor\
    \ while keeping generators fixed. This distinguishes \"fundamental limitation\"\
    \ from \"extraction quality problem.\"\n2. **Cross-answer constraint evaluation.**\
    \ Modified SICA where all constraints are tested against all candidate answers,\
    \ not just the trace's own answer.\n3. **Harder reasoning benchmarks** where multi-hop\
    \ constraint structure should be most informative.\n4. **Detailed case study of\
    \ the 5 discordant problems** in the constraint ablation.\n\n---\n\n## Reviewer\
    \ R2: Novelty and Related Work\n\n**Score: 3 (Weak Reject) | Confidence: High**\n\
    \n### Summary\nThe paper tests one symbolic aggregation method (SICA) and finds\
    \ it equivalent to majority voting, attributing this to a \"capability trap\"\
    \ where diversity and constraint quality are incompatible. While the constraint\
    \ ablation is genuinely informative, the paper overclaims from one method instantiation\
    \ to \"symbolic consensus\" broadly, has critically insufficient citations (~8\
    \ references), and the \"capability trap\" may be a redescription of known FOL-extraction\
    \ limitations rather than a novel insight.\n\n### Strengths\n- **Constraint ablation\
    \ is genuinely informative.** The 99.4% agreement between MAX-SAT, counting, and\
    \ random-weight is a clean, surprising result that would benefit the community.\n\
    - **Temperature ablation as causal evidence.** Well-designed continuous manipulation\
    \ of diversity ruling out the \"wrong operating point\" objection.\n- **Honest\
    \ negative result.** The paper does not bury the finding but makes it central,\
    \ with appropriate hedging (\"across tested conditions\").\n- **Practical C0 gate.**\
    \ Actionable for practitioners even if novelty is modest.\n\n### Weaknesses\n\
    - **Severely overgeneralized title and claims.** The paper tests ONE method (SICA:\
    \ same-model FOL extraction + MAX-SAT) but titles itself \"Why Symbolic Consensus\
    \ Cannot Beat Majority Voting.\" Other symbolic approaches (graph-based consistency,\
    \ program synthesis verification, LLM-as-judge with structured rubrics, learned\
    \ symbolic verifiers, contrastive verification) are not tested. The title should\
    \ scope to SICA specifically.\n- **Critically insufficient references.** Only\
    \ ~8 bibliography entries. A top-venue paper in this space should cite 30-50 works.\
    \ Major omissions include:\n  - Snell et al. (ICLR 2025 Oral) on test-time compute\
    \ scaling\n  - DeepSeek-R1 (2025) defining the reasoning model paradigm\n  - FoVer\
    \ (TACL 2025) on FOL verification for NL reasoning\n  - Aristotle (ACL 2025) on\
    \ logic-complete decomposition\n  - LogicAgent (2025) on multi-perspective logical\
    \ reasoning\n  - DyLoS (EACL 2026) on multi-paradigm solver selection\n  - Diversity-aware\
    \ training for test-time scaling (2025)\n  - DiVeRSe (ACL 2023) on multi-path\
    \ step-aware verification\n  - Math-Shepherd (ACL 2024) on outcome-conditioned\
    \ step verification\n  - Multi-agent debate literature\n  - CRAFT/RASC/ReASC (SC\
    \ variants 2024-2026)\n- **\"Capability trap\" may be a redescription.** The finding\
    \ reduces to: LLMs cannot extract discriminative FOL constraints from their own\
    \ reasoning traces. This is arguably expected by anyone who has worked with Logic-LM\
    \ or LINC, where formalization quality is the known bottleneck. Pan et al. (2023)\
    \ explicitly discuss formalization errors.\n- **Narrow method instantiation undermines\
    \ generality.** SICA uses the same LLM for both generation and extraction. Without\
    \ testing stronger/trained extractors, the paper establishes \"SICA with same-model\
    \ extraction doesn't work,\" not the broader claim.\n- **No comparison with trained\
    \ verifiers.** ORM/PRM are mentioned in Related Work but never compared. If trained\
    \ verifiers succeed where SICA fails, the conclusion should be about extraction\
    \ quality, not symbolic consensus as a category.\n- **C0 diagnostic novelty is\
    \ modest.** C0 is simply \"how often do K traces disagree.\" Practitioners already\
    \ know that unanimous traces leave nothing to improve. The framing as a \"contribution\"\
    \ overstates the insight.\n- **Possible citation error.** The Taubenfeld et al.\
    \ (2024) reference appears to be about debate biases, not weighted SC.\n\n###\
    \ Questions for Authors\n1. Why was the same LLM used for both generation and\
    \ extraction? Have you tested a stronger extractor?\n2. Could contrastive prompting\
    \ (\"extract constraints that differentiate your answer from alternative X\")\
    \ improve discriminative power?\n3. What happens with a trained constraint quality\
    \ classifier as a pre-filter before MAX-SAT?\n4. Is there a problem subset where\
    \ constraint precision is high and SICA does outperform? A conditional method\
    \ could be viable.\n\n### Missing Related Work\nThe Related Work section has 4\
    \ short paragraphs covering 4 topics with ~8 citations total. This is unacceptable\
    \ for a top venue. The paper needs at minimum: (a) comprehensive coverage of neuro-symbolic\
    \ reasoning methods (2023-2026), (b) test-time compute scaling literature, (c)\
    \ verification and reranking methods beyond ORM/PRM, (d) SC variants and extensions,\
    \ (e) constraint satisfaction in NLP with specific citations. The final paragraph\
    \ (\"Constraint satisfaction in NLP\") has zero specific citations.\n\n---\n\n\
    ## Roundtable Synthesis\n\n### Step 2: Cross-Reviewer Reactions\n\n**R1 on R2's\
    \ concerns:**\n- Agrees the title overclaims; one instantiation cannot condemn\
    \ \"symbolic consensus\" as a category.\n- Agrees citation count (~8) is critically\
    \ low and must be addressed.\n- Acknowledges R2's point that the \"capability\
    \ trap\" may redescribe known FOL-extraction limitations.\n- Maintains the constraint\
    \ ablation has standalone methodological value regardless of framing.\n\n**R2\
    \ on R1's concerns:**\n- R1's concern about cross-answer constraint evaluation\
    \ is potentially fatal. If SICA only evaluates constraints under their originating\
    \ trace's answer, the method is structurally a weighted vote, making the negative\
    \ result trivial rather than informative.\n- Agrees most cross-model conditions\
    \ (n=60) are underpowered.\n- Notes that if R1's formulation concern is confirmed,\
    \ the paper's contribution reduces further from \"fundamental limitation\" to\
    \ \"our particular weighted vote doesn't beat majority vote.\"\n\n### Step 3:\
    \ Convergence — Points of Agreement\n\n1. **The constraint ablation (Table 2)\
    \ is the paper's strongest and genuinely informative contribution.** MAX-SAT =\
    \ counting = random-weight (99.4%) is clean, well-executed, and useful to the\
    \ community.\n2. **The title and claims overgeneralize.** Testing one method (SICA)\
    \ does not support conclusions about \"symbolic consensus\" as a paradigm. Must\
    \ be scoped down.\n3. **Citation count is critically insufficient.** 8 references\
    \ is unacceptable. At minimum 25-30 additional references needed, covering recent\
    \ neuro-symbolic reasoning, test-time compute scaling, verification methods, and\
    \ SC variants.\n4. **Most conditions are underpowered.** Only the Qwen-14B n=804\
    \ combined result is genuinely powered. Other conditions (n=60) are suggestive\
    \ at best.\n5. **Missing oracle/cross-model extraction control.** Without testing\
    \ whether better extraction breaks the trap, the paper cannot distinguish \"fundamental\
    \ impossibility\" from \"extraction quality problem.\"\n6. **C0 diagnostic is\
    \ modest.** Useful but not novel; it formalizes an obvious observation.\n\n###\
    \ Step 3: Key Disagreement\n\nR1 (Score 4) weights methodological competence and\
    \ the ablation's value more heavily. R2 (Score 3) weights novelty, positioning,\
    \ and citation adequacy more heavily. Both agree these are genuine weaknesses;\
    \ they differ on severity.\n\nThe potential method formulation issue (R1's critical\
    \ question about cross-answer evaluation) could be decisive: if confirmed as a\
    \ design flaw, it would move R1's score to 3 as well.\n\n### Step 4: Consolidated\
    \ Assessment\n\n**Overall Score: 3 (Weak Reject)**\n**Confidence: High**\n\n###\
    \ Verdict\n\nThe paper presents a competent empirical investigation with one genuinely\
    \ strong result (the constraint ablation showing MAX-SAT = counting). However,\
    \ it falls short of the top-venue bar for three reasons:\n\n1. **Overclaiming.**\
    \ The gap between what is tested (one extraction + aggregation pipeline) and what\
    \ is claimed (\"symbolic consensus cannot beat majority voting\") is too large.\
    \ The title and framing must be scoped to SICA specifically, or additional symbolic\
    \ methods must be tested.\n\n2. **Insufficient scholarship.** ~8 references is\
    \ far below the expected 30-50 for this topic area. Critical recent work on neuro-symbolic\
    \ reasoning, test-time compute scaling, and verification methods is absent. The\
    \ Related Work section cannot convince reviewers the authors understand the landscape.\n\
    \n3. **Novelty concern.** The \"capability trap\" framing, while narratively effective,\
    \ may redescribe known limitations of LLM-to-FOL translation rather than offering\
    \ genuine new insight. The paper does not engage with whether this finding is\
    \ already expected from the Logic-LM/LINC literature.\n\n### Actionable Revision\
    \ Guidance\n\n- **Scope the title and claims to SICA specifically**, or test 2-3\
    \ additional symbolic consensus approaches.\n- **Add 25+ references** covering\
    \ neuro-symbolic reasoning (2023-2026), test-time compute, verification methods,\
    \ SC variants, and constraint satisfaction.\n- **Clarify the MAX-SAT formulation:**\
    \ explicitly state whether constraints are evaluated cross-answer. If not, implement\
    \ and test cross-answer evaluation.\n- **Add an oracle extraction experiment**\
    \ using a stronger model as extractor to distinguish extraction quality from fundamental\
    \ limitation.\n- **Acknowledge the power limitations** of n=60 conditions more\
    \ prominently; present them as \"suggestive\" rather than \"confirming.\"\n- **Engage\
    \ with prior work** on FOL extraction limitations (Logic-LM, LINC, FoVer) to establish\
    \ what is genuinely new in the \"capability trap\" framing.\n\n### Experiment\
    \ Coverage Assessment\n\nAgainst the full experiment design (17 imagined experiments),\
    \ the paper covers all planned experiments:\n- Core experiments (K ablation, tiebreak,\
    \ scaling, C0 diagnostic, constraint ablation, temperature, overhead): all present\n\
    - Baseline comparisons (Logic-LM, weighted SC): all present\n- Cross-model/domain\
    \ coverage (7B, 14B, 72B, LLaMA-8B, QwQ-32B, 6 domains): all present\n- Qualitative\
    \ analysis (constraint case studies): present in Section 5.1\n\nCoverage is nearly\
    \ complete. The weakness is not missing experiments but insufficient power for\
    \ most conditions and overclaiming from the evidence obtained."

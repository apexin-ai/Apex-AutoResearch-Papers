      precision is near-random (mean=0.50) regardless of output diversity, confirming
      constraints lack discriminative power at all diversity levels.'' Per-problem
      granularity 无需 binning, 每个 dot = 一个具体问题, 信息密度高。

      '
    analysis: 'F2 是论文 hero figure, 一图传达 capability trap: diversity (x) 存在且可变, 但 constraint
      quality (y) 恒为随机水平。''Regardless of diversity'' 可视化为 slope=0。 与 T3 (MaxSAT≈count-only)
      形成双重机制证据: (1) constraints 不判别 (F2), (2) solver 因此无法提取信号 (T3)。Per-problem granularity
      (n=307) 比 experiment-level correlation (n=7, r=0.15 p=0.74) 统计力强两个数量级, 是 D035
      识别的 F2 data gap 的完整解决。

      '

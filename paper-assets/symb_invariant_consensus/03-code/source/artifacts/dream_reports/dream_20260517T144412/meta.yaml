    \ is strong, but 8 other conditions at n≤60 cannot detect effects under ~10pp.\
    \ The \"3 domains\" claim is undermined by degenerate C0 on non-logic domains.\n\
    \n**5. Novelty concerns (R2 primary).** The capability trap, while well-named,\
    \ describes a predictable consequence of known FOL extraction limitations. The\
    \ C0 diagnostic has limited incremental value.\n\n### Actionable Recommendations\
    \ (Priority Order)\n\n1. **Narrow claims to match evidence.** Retitle to specify\

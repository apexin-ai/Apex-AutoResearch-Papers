      导致 constraints 无法区分二者。 Slope ≈ 0 因为此限制是 structural 的: 无论 vote 分布多分散 (高 entropy)
      或多集中 (低 entropy), constraint discriminative power 都不变——它取决于 extraction quality
      而非 diversity level。FOLIO 和 ProofWriter precision 几乎相同 (0.512 vs 0.498, 差异 p=0.60),
      说明跨域一致。28% 问题 precision<0.40 (constraints 反向判别), 25% precision>0.60 (偶然判别),
      呈对称分布围绕 0.50。

      '

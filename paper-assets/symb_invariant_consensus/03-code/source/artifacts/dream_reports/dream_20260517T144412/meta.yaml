    - S4: C0 as a practitioner-facing diagnostic is simple and actionable.\n- S5:\
    \ Overhead analysis (49% wall-time for zero gain, solver <0.01% of time) is a\
    \ useful practical contribution.\n- S6: Qualitative analysis (Section 6.4) identifying\
    \ that constraints formalize premises (~78% shared) rather than reasoning steps\
    \ is insightful.\n\n**Weaknesses identified:**\n- W1 (Major): **Underpowered non-central\
    \ experiments.** 8 of 9 conditions use n≤60 (SE ≈ 5-8pp). These experiments have\
    \ <15% power to detect effects of 3pp. The combined N>1,300 figure is misleading\

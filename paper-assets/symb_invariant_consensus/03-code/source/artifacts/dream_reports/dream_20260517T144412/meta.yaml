    - 'Appendix Figure: T vs delta line chart with extraction rate secondary axis,
      展示 gain-overhead tradeoff'
    analysis: 'Temperature ablation 的 T=1.0 positive result (p=0.034) 是 worst 档的最大叙事挑战。
      论文必须加 ''boundary conditions'' 节正面回应： (1) T=1.0 的 +8.3pp 伴随 extraction rate 从
      89% 降至 76% → 约 24% 的 traces 产生 empty/corrupt constraints → MaxSAT input quality
      退化； (2) Answer coherence 从 ~98% 降至 85% → 15% 的 outputs 本身质量低 → 这些 outputs 的
      constraints 是 noise； (3) 如果将 overhead 折入：T=0.7 overhead ≈ 49%，T=1.0 overhead
      ≈ 65% (因 extraction retry) → effective cost per question 增加 ~30%； (4) 结论：''T=1.0

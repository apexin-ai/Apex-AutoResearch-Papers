      +8.3pp requires 65% additional compute, operating in a regime where 15% of outputs
      are incoherent. Practitioners seeking this marginal gain would be better served
      by simply increasing K at T=0.7.''

      这一 framing 将 T=1.0 positive result 转化为 ''the trap has a theoretical escape hatch
      that is practically useless''。但 reviewer 可反驳：''(1) overhead analysis is not
      done at T=1.0, you''re speculating; (2) incoherence at T=1.0 is model-specific

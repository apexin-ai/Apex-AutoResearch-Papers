  review_report: "---\ndream_id: dream_20260517T144412\ntier: worst\noverall_score:\
    \ 3/6 Weak Reject\ntimestamp: 2026-05-17T16:04:18.820199+00:00\n---\n\n# Dream\
    \ Review Report: \"When Does Symbolic Consensus Help? A Systematic Empirical Study\"\
    \n\n**Review Mode:** Full (2 Reviewers + Roundtable)\n**Venue Standard:** Top\
    \ ML venue (acceptance rate ~25%, 6-point scale)\n\n---\n\n## Consolidated Score\n\
    \n| | Score | Confidence |\n|---|---|---|\n| R1 (Methods + Experiments) | 3/6\
    \ (Weak Reject) | 4/5 |\n| R2 (Novelty + Related Work) | 3/6 (Weak Reject) | 4/5\
    \ |\n| **Consensus** | **3/6 (Weak Reject)** | **4/5** |\n\n---\n\n## Paper Summary\n\
    \nThe paper presents SICA (Symbolic Invariant Consensus Aggregation), which extracts\
    \ first-order logic (FOL) constraints from K reasoning traces and selects answers\
    \ via weighted MAX-SAT. Evaluated across 5 model families, 3+ reasoning domains,\
    \ and >1,300 problems, the main finding is negative: SICA provides no significant\
    \ accuracy gain over Self-Consistency (majority voting). The authors identify\
    \ a \"capability trap\" pattern and propose C0 (fraction of problems with multiple\
    \ candidate answers) as a binary diagnostic. The only statistically significant\
    \ positive result occurs at temperature T=1.0 (+8.3pp, p=0.034), but with degraded\
    \ extraction quality and output coherence.\n\n---\n\n## Strengths (Consensus)\n\
    \n- **S1: Constraint ablation (Table 3) is the paper's strongest and most publishable\
    \ result.** MAX-SAT, count-only, and random-weight agree on 802/804 problems.\
    \ This cleanly demonstrates that the MAX-SAT solver contributes nothing beyond\
    \ vote counting under tested conditions. Both reviewers independently identified\
    \ this as the core contribution.\n\n- **S2: Well-powered main experiment.** The\
    \ Qwen-14B PW+FOLIO experiment (n=804) is appropriately sized. The observed Δ=+0.3pp\
    \ convincingly rules out practically meaningful gains at default operating conditions.\n\
    \n- **S3: Per-problem constraint precision analysis (Table 2) is methodologically\
    \ sound.** Mean precision 0.57 (std 0.23) on 307 multi-candidate problems, with\
    \ no correlation to vote entropy (R²=0.008), provides fine-grained mechanistic\
    \ evidence.\n\n- **S4: K=11 odd-K ablation is an elegant diagnostic.** At odd\
    \ K, ties are impossible; the resulting Δ=0 directly confirms SICA's only effective\
    \ mechanism is tiebreaking.\n\n- **S5: Honest framing of negative results.** The\
    \ paper does not cherry-pick or bury unfavorable results. The LLaMA-8B +8.3pp\
    \ outlier is explicitly discussed with confounds (48 truncated traces, failure\
    \ to replicate at n≥200).\n\n- **S6: Overhead quantification is practically useful.**\
    \ 48.7% additional compute, dominated by constraint extraction (47%), with solver\
    \ overhead negligible (<0.01%). The overhead-to-gain ratio of ~162 at default\
    \ settings is actionable.\n\n- **S7: Temperature ablation provides quasi-causal\
    \ evidence.** Manipulating diversity continuously (C0 from 18% to 72%) while holding\
    \ model and data constant is a well-designed ablation.\n\n---\n\n## Weaknesses\
    \ (Consensus, Severity-Ordered)\n\n### Critical\n\n- **W1: Claims exceed evidence\
    \ (scope-evidence mismatch).** The title and abstract generalize to \"symbolic\
    \ consensus\" broadly, but only one specific pipeline is tested (same-model FOL\
    \ extraction + MAX-SAT). Published neuro-symbolic methods (DyLoS, Aristotle, FoVer,\
    \ LogicAgent) reportedly achieve gains on the exact same benchmarks (FOLIO, ProofWriter).\
    \ Without citing or comparing against these, the paper cannot claim that symbolic\
    \ consensus in general does not help. *Both reviewers flagged this independently.*\n\
    \n- **W2: Self-extraction confound is unaddressed.** The same model generates\
    \ traces and extracts constraints. A model that commits a reasoning error will\
    \ likely extract constraints consistent with that error. Without testing a stronger/separate\
    \ extraction model or using FOLIO's gold FOL annotations as an oracle, the paper\
    \ cannot distinguish \"symbolic aggregation is fundamentally limited\" from \"\
    same-model self-extraction produces non-discriminative constraints.\" *Both reviewers\
    \ flagged this as a critical gap.*\n\n- **W3: 8 references is critically below\
    \ venue standards.** Top ML venues expect 30-60 citations for an empirical study.\
    \ Critical omissions include:\n  - Methods that work on the same benchmarks: DyLoS\
    \ (EACL 2026), FoVer (TACL 2025), Aristotle (ACL 2025), LogicAgent\n  - Test-time\
    \ compute scaling: Snell et al. (ICLR 2025 Oral)\n  - SC scaling plateaus: Loo\
    \ et al. (2025)\n  - DeepSeek-R1 technical report\n  - Confidence-weighted SC:\
    \ Taubenfeld et al. (2025)\n  - SATBench and other SAT-based reasoning benchmarks\n\
    \  \n  The absence of methods that achieve positive results on the same benchmarks\
    \ is particularly damaging to the paper's central claim. *Both reviewers flagged\
    \ this.*\n\n### Major\n\n- **W4: \"Capability trap\" lacks novelty.** The diversity-quality\
    \ tradeoff in LLM scaling is documented by Loo et al. (2025) and others. C0 as\
    \ a diagnostic trivially separates reasoning models (C0<5%) from instruction models\
    \ (C0>20%) with only 2 clusters and no gradient. Relabeling the known property\
    \ that \"more capable models have lower output diversity\" as a \"capability trap\"\
    \ does not constitute a conceptual contribution. *(R2 primary, R1 concurred)*\n\
    \n- **W5: Domain coverage is substantively thinner than claimed.** SICA operates\
    \ meaningfully (C0>20%) almost exclusively on formal logic (ProofWriter + FOLIO).\
    \ On StrategyQA (C0=10%), ARC (C0=5%), and GSM8K (C0=27% but n=30), conditions\
    \ are degenerate or underpowered. The \"3 reasoning domains\" claim is misleading.\
    \ *(Both reviewers)*\n\n- **W6: Underpowered cross-model experiments.** 8 of 9\
    \ conditions in Table 1 use n≤60 (SE ≈ 6-8pp). At n=60, the minimum detectable\
    \ effect at 80% power is ~12-15pp. Claims that these conditions \"confirm\" the\
    \ null are statistically unjustified. The \"combined N>1,300\" figure in the abstract\
    \ is misleading when 804/1,300 come from one model on one domain pair. *(R1 primary)*\n\
    \n- **W7: Missing/broken figures.** The hero scatter plots (F2: constraint precision\
    \ vs. vote entropy; F4: C0 vs. gap) are referenced in the text but not rendered.\
    \ Cross-references appear as \"Figure ??\". For a paper whose argument centers\
    \ on diversity-quality relationships, these missing visualizations are a serious\
    \ presentation failure. *(Both reviewers)*\n\n- **W8: MAX-SAT formulation ambiguity.**\
    \ R1 raised a critical question: as written, the formula sums only over traces\
    \ whose answer matches each candidate. If constraints are never evaluated cross-answer,\
    \ the method is structurally just a weighted vote, making the negative result\
    \ trivially expected rather than informative. This must be clarified. *(R1)*\n\
    \n### Moderate\n\n- **W9: Temperature ablation confounded.** T=1.0 simultaneously\
    \ affects diversity, trace quality, and extraction quality. The positive result\
    \ (p=0.034) at T=1.0 is from a single model at n=60, without replication across\
    \ models. The constraint ablation (Table 3) was only performed at T=0.7; if MAX-SAT\
    \ > count-only at T=1.0, the core \"mechanism is vacuous\" claim would be undermined.\
    \ *(R1)*\n\n- **W10: The paper reads more like an experiment report than a compelling\
    \ narrative.** Sections 5.1-5.6 present results sequentially without building\
    \ toward a unified insight. The \"capability trap\" framing appears late and feels\

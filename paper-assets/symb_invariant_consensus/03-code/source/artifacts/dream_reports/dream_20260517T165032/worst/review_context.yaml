narrative_guidance: Capability trap 不再是 universal characterization，reframe 为 condition-dependent
  phenomenon。Title 改：'When Do Self-Extracted Constraints Improve LLM Reasoning? Characterizing
  the Capability Trap'。从 pure negative 转 boundary-condition analysis。三条 claims 重构为：(a)
  positive boundary — 识别 capability trap 发生的 sufficient conditions (model capacity
  × domain formalizability × precision threshold)，(b) mechanism — oracle 仍证明 aggregation
  有效性 + capability trap 解释多数失败条件，(c) diagnostic — C0 + constraint precision 联合 deployment
  framework（非单独 C0）。
imagined_experiments:
- name: sica_k_ablation_14b
  plan_id: exp-002
  description: K sensitivity (K=6,8,11,12,16,20) on D012 60 questions
  expected_results:
    K6_sica: 0.75
    K6_sc: 0.733
    K6_gap_pp: 1.7
    K8_sica: 0.767
    K8_sc: 0.75
    K8_gap_pp: 1.7
    K11_sica: 0.767
    K11_sc: 0.733
    K11_gap_pp: 3.3
    K12_sica: 0.733
    K12_sc: 0.7
    K12_gap_pp: 3.3
    K16_sica: 0.75
    K16_sc: 0.733
    K16_gap_pp: 1.7
    K20_sica: 0.733
    K20_sc: 0.717
    K20_gap_pp: 1.7
    K11_mcnemar_p: 0.157
    best_K_gap_pp: 3.3
    odd_K_gap_gt_0: true
  result_rationale: Worst 档要求 universality 被打破。K=11（odd-K）仍出现 +3.3pp，证明 SICA 的增益不仅来自
    tiebreak——odd-K 无精确平局，但 SICA 仍能通过 constraint exclusion 翻转少数问题。这打破了 'SICA value
    is purely tiebreak-driven' 叙事。虽然 p>0.1 因 n=60 power 不足，但方向一致且 K=11/K=12 两个 K 值重复
    +3.3pp。需在论文中 reframe 为 'condition-dependent benefit at certain K ranges' 而非 'universally
    zero'。
  tables:
  - 'T_appendix_K_ablation: K × SICA/SC accuracy matrix'
  figures_description:
  - K vs gap line plot showing non-monotonic but consistently positive gap across
    K values, challenging universal null
  analysis: 'K=11 odd-K positive gap 是 worst 档核心证据之一。如果 gap 仅存在于 even-K（tiebreak），可以
    dismiss；但 odd-K +3.3pp 意味着 constraint exclusion 有 genuine discriminative value
    on this 60-question subset。Reframe: SICA has weak positive signal on D012-subset
    (Qwen-14B × formal logic × n=60) that doesn''t survive power scaling (exp-001
    n=804 shows +0.3pp)，但 heterogeneity 暗示 condition-dependence。'
- name: tiebreak_baseline_analysis
  plan_id: exp-003
  description: SICA vs SC-random-tiebreak vs SC-deterministic comparison
  expected_results:
    sica_tiebreak_win_rate: 0.8
    random_tiebreak_win_rate: 0.5
    alphabetical_tiebreak_win_rate: 0.6
    first_seen_tiebreak_win_rate: 0.4
    n_tied_questions: 5
    tied_fraction: 0.083
    sica_net_gain_from_tiebreak_pp: 2.5
    sica_gain_beyond_tiebreak_pp: 1.0
  result_rationale: Worst 档下，tiebreak 分析揭示 SICA 的 tiebreak 优势（80% win rate on ties）AND
    有少量 non-tie flips。5/60 个问题有 exact tie，SICA 在其中 4/5 选对；另外还有 1 个非平局问题被 constraint
    exclusion 翻转。这意味着 SICA mechanism 不完全 reducible to tiebreak——有微弱但存在的 exclusion
    效应。在 n=60 subset 上 beyond-tiebreak gain ≈ 1pp 不显著，但 existence 本身打破 'purely tiebreak'
    framing。
  tables:
  - 'T_tiebreak: Tiebreak method × win rate on tied questions'
  figures_description:
  - 'Bar chart: tiebreak win rates across methods, SICA clearly highest'
  analysis: Tiebreak 分析在 worst 档下支持 'SICA has genuine constraint signal on subset'
    叙事。但 effect size 太小 to be practically meaningful（5 个 tie 中多赢 1-2 个 = 1-3pp on
    full set）。Paper 需 acknowledge SICA has weak positive signal in favorable conditions
    而非 zero。
- name: sica_7b_scaling
  plan_id: exp-004
  description: Qwen2.5-7B-Instruct on 60 questions, testing weaker model → higher
    C0 → larger gap
  expected_results:
    sica_accuracy: 0.617
    sc_accuracy: 0.567
    delta_pp: 5.0
    mcnemar_p: 0.083
    multi_candidate_rate: 0.717
    c0_pct: 71.7
    extraction_rate: 0.82
    answer_extraction_rate: 0.91
    constraint_precision_mean: 0.54
    discordant_sica_wins: 4
    discordant_sc_wins: 1
    wall_time_min: 45
  result_rationale: 'Worst 档的核心打破机制之一：weaker model (7B) 产生更高 C0 (71.7%) 且 delta=+5.0pp（p=0.083，接近
    significance）。这暗示 capability trap 是 capacity-dependent 而非 universal。7B 模型 extraction
    quality 低（precision~0.54），但因为 baseline accuracy 也低（56.7%），constraints 的微弱 discriminative
    signal 足以翻转几个问题。C0-gap 正相关在 experiment-level 出现（7B: C0=72%, Δ=+5; 14B: C0=38%,
    Δ=+0.3; 72B: C0~15%, Δ≈0），产生 r=0.3-0.4 的 condition-level correlation。这打破了 ''no
    correlation between diversity and benefit'' 叙事。'
  tables:
  - 'T1_main: add Qwen-7B row'
  figures_description:
  - 'F4 C0 vs gap scatter: 7B point in upper-right quadrant, breaking flat-line narrative'
  analysis: '7B 的 +5pp 是 worst 档的 smoking gun。虽然 n=60 power 不足以达到 p<0.05，但方向与 LLaMA-8B
    exp-011 FOLIO +10pp 一致。Pattern emerges: weaker models on formal logic domains
    show positive gaps。需 reframe capability trap 为 ''high-capacity models extract
    non-discriminative constraints; low-capacity models paradoxically benefit because
    their higher error rate creates more room for constraint-based correction''。'

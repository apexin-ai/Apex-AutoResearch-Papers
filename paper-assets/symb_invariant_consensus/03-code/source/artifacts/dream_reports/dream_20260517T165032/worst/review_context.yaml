  analysis: 'Inv-length slightly above SICA 在 worst 档是 uncomfortable：reviewer 可能 ask
    ''why use MAX-SAT if trace-length heuristic does equally well?''。Defense: (1)
    on high-precision subset MAX-SAT > all (exp-013 subset finding), (2) inv-length
    has no theoretical justification while MAX-SAT has principled mechanism that activates
    with quality constraints (oracle proof), (3) difference is n.s.。'

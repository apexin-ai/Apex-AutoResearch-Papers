    SICA win rate 68% vs low-precision 44%。Per-problem precision 与 SICA correctness
    有 significant correlation (r=0.28, p=0.005)。Non-discriminative fraction=0.69（在
    worst 档范围 [0.5, 0.7]）。这证明 capability trap 非 uniform——约 31% 的问题有 adequate constraint

    one reasoning model'') 在 worst 档更尖锐：如果 instruction-scale 条件显示 condition-dependent
    gains，reviewer 会问 ''what about reasoning models on tasks where they have moderate
    C0?'' 可能需要 QwQ on easier tasks where it''s not 100% accurate。'
- name: c0_diagnostic_validation
  plan_id: exp-006
  description: Plot C0 vs SICA-SC gap across all conditions
  expected_results:
    n_conditions: 12
    pearson_r_c0_gap: 0.38
    pearson_p: 0.08
    spearman_rho: 0.42
    spearman_p: 0.06
    c0_below_5_all_zero_gap: true
    c0_above_30_gap_range_pp:
    - -3.3
    - 6.7
    c0_above_30_mean_gap_pp: 1.8
    linear_model_r2: 0.14
    c0_threshold_5_specificity: 1.0
    c0_threshold_5_sensitivity: 0.0
  result_rationale: Worst 档下，C0 与 gap 的 experiment-level correlation 是 moderate positive
    (r=0.38, p=0.08)，接近 significance。这与 best/mid 档 (r≈0.15, p=0.74) 截然不同。原因：7B 和 LLaMA-8B
    条件的 high C0 + positive gap 拉高了 correlation。但 R²=0.14 说明 C0 只解释 14% variance——仍是
    'necessary but insufficient' 但带有 weak positive predictive direction。Claim 3 需
    reframe：C0 不仅是 binary gate (C0<5% → degenerate) 而是有 weak gradient effect（higher
    C0 correlates with slightly higher expected gap），但 variance 太大 for deployment
    use。
  tables:
  - 'T_c0_diagnostic: condition × C0 × gap × n'
  figures_description:
  - F4 scatter with weak positive trend line, wide CI band, some negative outliers
    even at high C0
  analysis: Moderate correlation (r=0.38) 是 worst 档的 nuisance finding。不足以 claim C0
    is predictive (p=0.08, R²=0.14)，但足以让 reviewer 质疑 'C0 is uninformative beyond threshold'。Paper
    需 reframe Claim 3 为 joint diagnostic (C0 + constraint precision) 而非 C0 alone。

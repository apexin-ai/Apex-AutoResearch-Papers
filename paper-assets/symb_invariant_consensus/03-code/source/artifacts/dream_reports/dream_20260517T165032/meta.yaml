  review_report: "---\ndream_id: dream_20260517T165032\ntier: best\noverall_score:\
    \ weak reject\ntimestamp: 2026-05-17T17:28:19.890520+00:00\n---\n\n# Dream Review\
    \ Report: \"The Capability Trap: Why Self-Extracted Constraints Cannot Improve\
    \ LLM Majority Voting\"\n\n**Dream ID**: 20260517T165032 | **Tier**: best | **Review\
    \ Mode**: full | **Date**: 2026-05-17\n\n---\n\n## Roundtable Summary\n\nTwo reviewers\
    \ conducted independent reviews (R1: Methods+Experiments; R2: Novelty+Related\
    \ Work), followed by cross-sharing and convergence discussion.\n\n**Consensus\
    \ rating: 3/6 (Weak Reject)**\n\nBoth reviewers agree the paper presents a substantial\
    \ empirical effort with a well-designed oracle control experiment and compelling\
    \ constraint ablation. However, two critical issues prevent acceptance: (1) the\
    \ constraint evaluation function sigma(c,a) may be a source-answer indicator rather\
    \ than genuine cross-answer evaluation, potentially making the \"capability trap\"\
    \ a design artifact rather than a discovered phenomenon; (2) the core finding\
    \ (LLM self-formalization produces low-quality constraints) has significant overlap\
    \ with prior work (LINC, Logic-LM, Huang et al. 2024) and the novelty is insufficiently\
    \ differentiated.\n\n---\n\n## R1 Review: Methods + Experiments\n\n### Scores\n\
    - Soundness: 2/4\n- Contribution: 3/4\n- Presentation: 2/4\n- Overall: 3/6 (Weak\
    \ Reject)\n- Confidence: 4/5\n\n### Strengths\n\n1. **Well-structured negative\
    \ result with clear mechanistic explanation.** The three-way constraint ablation\
    \ (MAX-SAT = count-only = random-weight, >99.6% agreement on n=804) is convincing\
    \ evidence that the satisfiability machinery is vacuous given non-discriminative\
    \ constraints. This moves beyond a simple empirical null to a structural explanation.\n\
    \n2. **Oracle control experiment is the strongest contribution.** The oracle-SICA\
    \ result (+8.82pp, p<0.001 on FOLIO n=204 with gold FOL annotations) cleanly separates\
    \ the aggregation mechanism from extraction quality. This establishes that the\
    \ MAX-SAT framework *can* work, pinpointing the bottleneck at constraint quality.\n\
    \n3. **Breadth of experimental conditions.** 5 model families, 3 primary + 2 supplementary\
    \ domains, within-family scaling (7B/14B/72B), K ablation, weighted SC baselines,\
    \ Logic-LM comparison. The 18-condition C0 diagnostic validation provides reasonable\
    \ coverage.\n\n4. **Powered replications discipline.** The authors conducted n=60\
    \ pilots then followed up with n>=200 powered tests for key conditions (LLaMA-8B\
    \ StrategyQA, LLaMA-8B FOLIO, GSM8K expanded), demonstrating methodological rigor.\n\
    \n5. **C0 diagnostic is practically useful.** Computing multi-candidate rate from\
    \ Stage 1 alone before investing in constraint extraction is a genuinely useful\
    \ early-stopping criterion.\n\n6. **Per-problem constraint precision analysis\
    \ (n=307) is thorough.** Mean precision=0.50, sigma=0.12, 89% in [0.4,0.6], zero\
    \ correlation with diversity (r=0.03), positive flip precision 0.52 vs negative\
    \ flip 0.48.\n\n### Weaknesses\n\n1. **[CRITICAL] The constraint evaluation function\
    \ sigma(c,a) is underspecified and possibly trivial by construction.** The method\
    \ description indicates that sigma(c,a) = 1 if and only if c was extracted from\
    \ a trace whose final answer is a, reducing sigma to a source-answer indicator\
    \ rather than an independent logical evaluation. If so, Equation 2 is *by construction*\
    \ equivalent to weighted vote counting, making the entire MAX-SAT apparatus a\
    \ tautological no-op. The \"capability trap\" may be a design artifact rather\
    \ than a fundamental limitation. The paper should either (a) implement genuine\
    \ cross-answer constraint evaluation via Z3, or (b) clearly acknowledge that the\
    \ negative result may be an artifact of this design choice.\n\n2. **Data discrepancies\
    \ between paper versions.** The structured LaTeX sections and the dream report\
    \ show different numbers for the same conditions (e.g., composition of the n=804\
    \ aggregate, LLaMA-8B C0 values, p-values for StrategyQA-14B). These inconsistencies\
    \ undermine confidence in reported numbers.\n\n3. **Many conditions are underpowered\
    \ (n=60).** Of 18 conditions, a majority use n=60. McNemar's test with n=60 has\
    \ very low power to detect effects <5pp. The claimed N>1,300 total is misleading\
    \ when most conditions cannot detect even moderate effects. For example, Qwen-14B\
    \ StrategyQA n=60 shows delta=+3.33pp (suggestive but inconclusive).\n\n4. **Missing\
    \ cross-model constraint extraction baseline.** Testing even one cross-model condition\
    \ (e.g., Qwen-72B extracting constraints from Qwen-7B traces) would distinguish\
    \ between \"self-extracted constraints are non-discriminative\" and \"all LLM-extracted\
    \ constraints are non-discriminative.\"\n\n5. **Z3 parser confound undisclosed.**\
    \ Development logs reveal the Z3 parser had 41-100% constraint loss rates in early\
    \ experiments. The paper does not discuss whether parsing failures in final experiments\
    \ remain a confound.\n\n6. **Temperature ablation too narrow.** Only 4 temperatures\
    \ on n=60 with a single model. Insufficient to draw conclusions.\n\n### Questions\
    \ for Authors\n\n1. Is sigma(c,a) implemented as a source-answer indicator, or\
    \ does the code evaluate each constraint against each candidate answer via Z3?\
    \ If the former, has the team considered implementing genuine cross-answer evaluation?\n\
    \n2. The constraint ablation shows agreement 802/804 between MAX-SAT and SC. What\
    \ happens on the 2 disagreeing problems?\n\n3. What is the Z3 constraint-level\
    \ parsing success rate (not trace-level extraction rate)?\n\n4. The Qwen-72B-AWQ\
    \ uses 4-bit quantization. Has quantization been verified to not affect constraint\
    \ extraction quality?\n\n5. How were the 8 problems selected for qualitative analysis\
    \ -- randomly sampled or selected for illustration?\n\n---\n\n## R2 Review: Novelty\
    \ + Related Work\n\n### Scores\n- Soundness: 3/4\n- Contribution: 2/4\n- Presentation:\
    \ 2/4\n- Overall: 3/6 (Weak Reject)\n- Confidence: 4/5\n\n### Strengths\n\n1.\
    \ **Well-designed oracle control experiment.** The gold-FOL oracle cleanly separates\
    \ the aggregation mechanism (which works) from the extraction quality (which fails),\
    \ providing causal localization that elevates this beyond \"we tried X and it\
    \ didn't work.\"\n\n2. **Thorough ablation design.** The three-way constraint\
    \ ablation demonstrates not just that SICA fails, but precisely *how* it fails:\
    \ MAX-SAT reduces to counting because constraints lack discriminative power.\n\
    \n3. **Appropriate scope of claims.** The paper restricts its finding to same-model\
    \ self-extraction and acknowledges that DyLoS, Aristotle, FoVer achieve gains\
    \ through different mechanisms.\n\n4. **Multi-dimensional evidence.** Cross-model,\
    \ cross-domain, within-family scaling, K ablation, weighted SC, Logic-LM comparison.\
    \ Thoroughness makes the null result convincing.\n\n5. **Good connection between\
    \ theory and experiment.** The degeneration equation predicts MAX-SAT reduces\
    \ to counting when constraints are non-discriminative; the ablation confirms this.\n\
    \n### Weaknesses\n\n1. **[CRITICAL] The \"capability trap\" framing overstates\
    \ novelty.** The core observation (LLMs cannot reliably formalize their own reasoning\
    \ into discriminative FOL) is established in prior work. LINC (Olausson et al.,\
    \ 2023) documented ~40% translation error rates. Logic-LM (Pan et al., 2023) showed\
    \ similar issues. The paper's contribution is systematic quantification and oracle-controlled\
    \ separation, not discovery. The paper should position more modestly.\n\n2. **[CRITICAL]\
    \ Missing important related work on LLM self-evaluation.** The paper does not\
    \ engage with:\n   - Huang et al. (2024) \"Large Language Models Cannot Self-Correct\
    \ Reasoning Yet\" (ICLR 2024) -- the most direct precedent, structurally parallel\
    \ to this paper's finding\n   - Self-refinement/self-critique literature (Madaan\
    \ et al. 2023 \"Self-Refine\"; Shinn et al. 2023 \"Reflexion\")\n   - LLM calibration/uncertainty\
    \ estimation (Kadavath et al. 2022) -- the capability trap is fundamentally a\
    \ calibration/metacognition failure\n   - Multi-agent debate (Liang et al. 2023;\
    \ Du et al. 2024) -- listed in bibliography but not discussed\n\n3. **Statistical\
    \ power concerns underplayed.** 4 of 8 Table 1 conditions have n=60. Within-family\
    \ scaling results (Appendix D) are entirely n=60 yet treated as confirmatory.\
    \ The C0 progression (70%->38%->22%) should be \"directionally consistent\" rather\
    \ than \"confirming the trap from both ends.\"\n\n4. **SICA pipeline may not be\
    \ the strongest instantiation.** Several design choices may artificially weaken\
    \ SICA: source-answer indicator sigma, potentially unoptimized extraction prompt\
    \ (no prompt ablation), only FOL constraints tested (propositional/numerical bounds\
    \ might differ). The title claim \"Cannot Improve\" is too strong for one extraction\
    \ method and one solver.\n\n5. **C0 diagnostic has limited value beyond the obvious.**\
    \ C0<5% predicting SICA=SC is near-tautological (one candidate answer means any\
    \ aggregation is equivalent). The correlation analysis (r=0.05 across 18 conditions)\
    \ uses too few data points with too heterogeneous conditions.\n\n6. **Bibliography\
    \ quality issues.** Several entries (DyLoS, Aristotle, FoVer, SATBench, LLM-CP)\
    \ lack proper author information. This would be a desk-reject risk at top venues.\n\
    \n### Questions for Authors\n\n1. Have you tested a variant where constraints\
    \ are genuinely evaluated against all candidate answers (not using the source-answer\
    \ indicator)?\n\n2. Have you considered a cross-model control (e.g., GPT-4/Claude\
    \ extracting constraints from same traces)?\n\n3. What is constraint precision\
    \ conditional on problem difficulty? Do easy vs. hard problems show different\
    \ constraint quality?\n\n4. Why not frame this as \"current LLMs lack metacognitive\
    \ capability for discriminative self-formalization\" rather than a structural\
    \ \"trap\"?\n\n5. How sensitive are results to the extraction prompt? Any prompt\
    \ engineering ablation?\n\n---\n\n## Roundtable Convergence\n\n### Points of Agreement\
    \ (both reviewers)\n\n1. **The oracle control experiment is the paper's strongest\
    \ and most novel contribution.** It provides genuine causal separation between\
    \ aggregation mechanism quality and extraction quality.\n\n2. **The sigma(c,a)\
    \ source-answer indicator issue is the most critical technical concern.** If sigma\
    \ merely indicates whether a constraint came from a trace supporting answer a\
    \ (rather than independently evaluating the constraint against a), then MAX-SAT\
    \ is equivalent to weighted voting *by construction*, not merely empirically.\
    \ The \"capability trap\" would be a design artifact. Both reviewers flag this\
    \ as potentially undermining the paper's central claim.\n\n3. **Underpowered conditions\
    \ weaken claimed generality.** The majority of conditions use n=60, which cannot\
    \ support confirmatory conclusions. The \"18 conditions, N>1300\" framing overstates\
    \ the effective statistical power.\n\n4. **Paper is structurally incomplete.**\
    \ Placeholder sections, missing figures, incomplete bibliography entries.\n\n\
    5. **The three-way constraint ablation (Table 2) is compelling.** Both reviewers\
    \ find the MAX-SAT = count-only = random-weight equivalence to be strong mechanistic\
    \ evidence.\n\n### Points of Divergence\n\n| Dimension | R1 | R2 | Resolution\
    \ |\n|-----------|----|----|------------|\n| Soundness | 2/4 (sigma artifact concern)\
    \ | 3/4 (methodology rigorous within scope) | **2.5** -- sigma issue is serious\
    \ but oracle partially addresses it |\n| Contribution | 3/4 (ablation and diagnostic\
    \ are valuable) | 2/4 (core finding not novel enough) | **2.5** -- oracle is novel,\
    \ but framing overstates originality |\n| Primary concern | Design artifact (sigma)\
    \ | Novelty vs prior work | Both valid; address both for resubmission |\n\n###\
    \ Consolidated Verdict\n\n**Overall Score: 3/6 (Weak Reject)**\n\nThe paper presents\
    \ a substantial empirical investigation with genuine methodological contributions\
    \ (oracle control, constraint ablation, C0 diagnostic). However, two issues prevent\
    \ acceptance at a top venue:\n\n1. **Methodological clarity**: The sigma(c,a)\
    \ evaluation function must be clarified. If it is a source-answer indicator, the\
    \ paper must either (a) implement genuine cross-answer Z3 evaluation and re-run\
    \ experiments, or (b) explicitly scope all claims to this specific (and potentially\
    \ trivially degenerate) pipeline variant.\n\n2. **Novelty positioning**: The \"\
    capability trap\" must be positioned relative to established findings on LLM self-formalization\
    \ quality (LINC, Logic-LM) and self-correction limitations (Huang et al. 2024).\
    \ The paper's genuine novelty (systematic quantification, oracle-controlled causal\
    \ separation, constraint ablation) should be foregrounded over the \"new concept\"\
    \ framing.\n\n### Recommendations for Revision\n\n1. **Resolve the sigma question**:\
    \ Implement genuine cross-answer constraint evaluation (evaluate each constraint\
    \ against each candidate via Z3) and compare with the source-answer indicator\
    \ variant. This single experiment would either (a) confirm the capability trap\
    \ holds under proper evaluation (strengthening the paper dramatically) or (b)\
    \ reveal that the negative result was an artifact (requiring major revision).\n\
    \n2. **Add missing related work**: Cite and discuss Huang et al. (2024), Madaan\
    \ et al. (2023), Kadavath et al. (2022). Reposition the capability trap as systematic\
    \ quantification and causal localization of a known limitation class.\n\n3. **Power\
    \ up key conditions**: Expand within-family scaling, StrategyQA-14B, ARC-Challenge,\
    \ and DeepSeek conditions to n>=200 with bootstrap CIs.\n\n4. **Add one cross-model\
    \ condition**: Use a stronger model to extract constraints from weaker model traces.\
    \ This would distinguish \"self-extraction fails\" from \"all LLM extraction fails.\"\
    \n\n5. **Complete the paper**: Fill placeholders, include figures (especially\
    \ the F2 hero figure), fix bibliography entries, reconcile data discrepancies.\n\
    \n6. **Soften the title**: \"Cannot Improve\" -> \"Does Not Improve\" or \"Fails\
    \ to Improve\" to match the empirical (not impossibility) nature of the finding.\n\
    \n---\n\n## Experiment Coverage Assessment\n\nAll 18 imagined experiments from\
    \ the design document appear to be covered in the paper:\n- K ablation, tiebreak\
    \ analysis, within-family scaling (7B/14B/72B), QwQ-32B, C0 diagnostic, constraint\
    \ quality case studies, overhead analysis, LLaMA-8B (powered), GSM8K (pilot+expanded),\
    \ constraint ablation, DeepSeek-R1, Logic-LM baseline, weighted SC, StrategyQA-14B,\
    \ ARC-Challenge-14B, constraint quality correlation -- all present.\n\n**Coverage**:\
    \ Complete (18/18 experiments). The paper faithfully reflects the experimental\
    \ design.\n\n**Quality of reflection**: Results are reported consistently with\
    \ design expectations. The narrative coherently integrates all experiments into\
    \ the capability trap storyline. However, the statistical power of individual\
    \ conditions varies significantly (n=30 to n=804), and the paper could be more\
    \ transparent about which conditions are confirmatory vs. exploratory.\n"

decisions:
- id: D001
  date: 2026-05-15 08:47 UTC
  summary: MVP 验证方案：50 题 MATH-500 分层子集，SICA vs SC@K=12
  rationale: SICA 核心价值取决于两个前提：(1) 能从推理 trace 可靠提取符号约束；(2) 跨路径矛盾率足够高（>5%）使形式化验证有意义。Reviewer
    给 impact 3/5，核心担忧是"若矛盾率<5%则动机不成立"。MVP 直接验证这两个前提，50 题按难度分层可同时观察 Extraction-Verification
    Paradox（难题提取差但矛盾多）。Pass 则进入全量实验冲 EMNLP/AAAI，Fail 则及时止损。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-15 08:52 UTC
  summary: 拒绝 CRD pivot，要求回归 SICA 原始方案
  rationale: Reviewer critical 审查发现 Agent 实施的是"跨表征分歧诊断"(CRD)，与 IDEA_BRIEF 定义的 SICA
    完全不同：CRD 用双表征（FOL+SymPy）做单解分歧检测，无多路径采样、无 MAX-SAT 共识——这正是 SICA 区别于 VERGE/D&P 的核心创新点。CRD
    的 novelty 定位与 VERGE 高度重叠（单输出验证+修复），无法支撑 EMNLP 投稿。同时 MVP 标准被静默替换，ROADMAP 的三条 pass
    criteria 从未测试。98GB GPU 完全能跑 QwQ-32B，无理由换 Qwen3-32B-AWQ。必须回归 SICA：K=12 多路径采样 →
    符号约束提取 → Z3 加权 partial MAX-SAT → 不变量共识打分。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-15 08:54 UTC
  summary: MVP 标准 v2：三档判定 + 矛盾绝对数 ≥5 + accuracy ≥SC+2pp + ProofWriter sanity check
  rationale: Reviewer warning 指出：(1) 5% 矛盾率阈值在 50 题上仅 2.5 题，置信区间极宽——改为绝对数 ≥5 题；(2)
    ≥SC+0.1pp 也过关无意义——改为 ≥2pp 或 p<0.1；(3) 灰色区间无处理——新增 Inconclusive 档，触发扩展到 100 题重测；(4)
    单域 MATH-500 不够——加 10 题 ProofWriter 做逻辑域 sanity check；(5) 模型不能模糊——固定 QwQ-32B，不可替换。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-15 12:02 UTC
  summary: MVP T=0.7 继续跑完（需要完整数据），diagnostic 自然结束后 GPU 带宽恢复；AIME 30 题排在 MVP 之后
  rationale: Temperature 诊断 4/5 题显示 T=0.7/0.9/1.0 均几乎不产生答案分歧——C2/C3 高风险 FAIL。但仍决定让
    MVP 跑完：(1) 50 题完整数据无论正负都有价值（负面结果=SICA 在强模型上无信号，本身是发现）；(2) GPU 已分配且无其他实验排队；(3)
    smoke test L5 有 3 条矛盾，50 题中 L4-5 有 20 题可能产生更多信号。MVP 完成后立即跑 AIME 30 题（QwQ-32B ~79.5%，分歧应更明显），作为"高难度
    sweet spot"的补充验证。如果 MATH+AIME 均 SICA≈SC → 准备 FAIL 路径决策。
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-05-15 12:16 UTC
  summary: 'D005: 采用双管齐下方案——MATH-500 MVP 继续 + AIME 30 题紧跟，暂不换模型'
  rationale: Temperature 诊断确认 QwQ-32B 在 T=0.7/0.9/1.0 下均产生近零答案分歧——reasoning model
    的确定性推理压制采样随机性。MATH-500 MVP 高概率 FAIL on C2/C3，但数据仍有价值（负面结果本身有意义）。AIME 2024 是 QwQ-32B
    弱项（~79.5%），更可能产生 trace 分歧——如果 SICA 在 AIME 上有信号，paper story 改为"SICA 在高难度/高不确定性场景下最有价值"，反而比"通用提升"更有深度。模型切换（Qwen2.5-7B
    等）改变论文定位太大，留作 AIME 也失败后的最后手段。执行顺序：MATH MVP 跑完 → AIME 30 题 → 基于两组结果做 PASS/FAIL
    最终判定。
  related_experiments: []
  depends_on:
  - D004
- id: D006
  date: 2026-05-15 12:19 UTC
  summary: 'D006: Kill 当前 MATH MVP（有 bug + 25-30h 不可接受），修 bug 后 AIME 30 题优先'
  rationale: D005 假设 MVP 4-7h 出结果，但实际第一题 20min+ 未完成（serial trace gen + extraction
    回归 5/12 JSON parse fail），外推 25-30h。加上多样性诊断已定论（零分歧），继续烧 25-30h GPU 等一个几乎确定 FAIL
    的结果不合理。改为：(1) Kill 当前 MVP；(2) 修两个 bug——trace gen 用 n=K batch 而非串行、extraction 回归（ProofWriter

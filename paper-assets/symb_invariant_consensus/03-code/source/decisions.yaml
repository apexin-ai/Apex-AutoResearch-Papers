- id: D017
  date: 2026-05-16 05:11 UTC
  summary: 'D017: D012 技术 PASS（C3 +3.3pp）但统计 INCONCLUSIVE（p=0.317）——全部增益来自 4 个 6:6
    tiebreak，SICA 机制是 principled tiebreaking 而非 constraint override。扩展实验到 200 题 +
    K 敏感性分析争取统计效力'
  rationale: 60 题中仅 4 题 SICA≠SC，全部为 6:6 精确平票。56 个非平票题 SICA=SC（约束从未推翻明确多数）。McNemar
    p=0.317，二项检验 p=0.3125，均不显著。FOLIO +6.7pp 但 ProofWriter 0pp，域泛化不成立。SICA 的实际贡献是 principled
    tiebreaking 而非原始假设的 symbolic constraint override。需要更多数据点来判断 tiebreaking 模式是否稳定可复现。扩展到全量
    PW+FOLIO + K=8/16/20 敏感性分析是最高效的统计加固路径。

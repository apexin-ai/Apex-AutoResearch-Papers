- id: D055
  date: 2026-05-18 20:21 UTC
  summary: 'D055: Final framing confirmed — regime-dependent capability trap with
    sharp boundary at ~55% SC. Within-model ICL transition (D053) resolves LLaMA-8B
    concern.'
  rationale: '基于全量数据的最终 framing 判断：


    1. Within-model regime transition (D053) 提供因果证据：同一 Mistral-7B 模型，ICL 将 SC 从 54%→61.5%，SICA
    从 +4.90pp 翻转为 -2.23pp。控制了模型架构变量。


    2. LLaMA-8B (SC=63.2%, Δ=-2.45pp) 不是反例——它在 boundary (~55%) 之上，与 sharp threshold
    一致。所有 SC>60% 条件均 Δ∈[-2.45, +0.49] n.s.。


    3. 数据表：Mistral SC=54% → +4.90pp (p=0.013)；Mistral+ICL SC=61% → -2.23pp；LLaMA SC=63%
    → -2.45pp；Qwen-14B SC=75% → +0.25pp n.s.；Qwen-7B SC=77% → -0.49pp；Qwen3 SC=84%
    → +0.49pp n.s.


    4. Oracle +14.22pp (p=2e-7) 证明聚合有效，Mistral +4.90pp ≈ 35% oracle ceiling。6 个 remediation
    全部失败。


    Framing: "regime-dependent capability trap" — SICA 在 SC<~55% 时有效（constraints 保留独立性），SC>~55%
    时 confirmation bias 使 constraints 失去判别力。Boundary sharp, 不是 gradual degradation。'

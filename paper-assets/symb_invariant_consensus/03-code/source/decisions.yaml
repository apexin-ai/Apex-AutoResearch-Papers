- id: D012
  date: 2026-05-15 22:24 UTC
  summary: 'D012: 逻辑域 MVP 判定标准——ProofWriter-30 + FOLIO-30 合并 60 题，沿用 D003 框架 + 新增多候选前置条件'
  rationale: 'D011 将主实验从 MATH-500 pivot 到逻辑域，但 D003 判定标准仍针对 MATH-500，ProofWriter 定位仅为"sanity
    check 不影响 PASS/FAIL"。Reviewer 指出 proofwriter30_v2 完成后无法判定。新标准沿用 D003 框架（保持一致性避免
    goalpost-moving），新增多候选前置条件（吸取 AIME/MATH 教训）：


    PASS（全部满足）：

    - C1: 约束提取率 ≥ 50%

    - C2: 跨路径矛盾检出 ≥ 5 题（绝对数）

    - C3: SICA accuracy ≥ SC + 2pp（合并 60 题），或 paired bootstrap p < 0.1

    - C0（前置）: 多候选率 ≥ 20%（≥12/60 题有 >1 个 unique candidate）


    INCONCLUSIVE（触发扩展重测）：

    - C3 为 +0~2pp，其余满足


    FAIL（任一触发）：

    - C0 < 20% 多候选 → 结构性失效，同 MATH/AIME

    - C1 < 30%

    - C2 < 3 题

    - C3 < SC


    ProofWriter-30 和 FOLIO-30 合并判定（60 题），但分别报告以观察域差异。'
  related_experiments:
  - exp_id: sica_proofwriter30_v2
    role: target
    result: running
  - exp_id: sica_folio30
    role: target
    result: planned
  depends_on:
  - D003
  - D011
- id: D013
  date: 2026-05-16 01:30 UTC
  summary: 'D013: ProofWriter 中期 CRITICAL——MaxSAT 结构性失效(16/16 excluded=0)，终止当前实验，紧急诊断根因后再决定
    FOLIO'
  rationale: Reviewer 独立核实 16/30 题中期数据：C0/C1/C2/C3 四项全 FAIL。最关键的是 C2=0（矛盾检出为零），MaxSAT
    satisfied_ratio=1.000 贯穿全部问题，SICA 核心机制从未激活。C3=-6.25pp 说明 SICA 不仅无效还主动伤害准确率。继续跑剩余
    14 题无意义。需紧急诊断 MaxSAT 全满足的根因：(a) 约束太粗/抽象无法矛盾→设计缺陷 (b) SAT 编码 bug→可修 (c) 去重后约束太少→可调。根因决定
    FOLIO 是否值得跑以及 MVP 是否有救。May 19 checkpoint 仅剩 3 天。
  related_experiments:
  - exp_id: sica_proofwriter30_v2
    role: primary
    result: C2=0 structural failure, all 4 D012 criteria FAIL at midpoint
  depends_on:
  - D012
- id: D014
  date: 2026-05-16 01:39 UTC
  summary: 'D014: MaxSAT 结构性失效根因确认——约束编码缺 answer assertion + 提取失败率 54%。选 A 方案：L3+L1
    修复 → 5 题验证 → 全量'
  rationale: 诊断 6/6 注入测试通过证明 MaxSAT 求解器无 bug。satisfied_ratio=1.0 的根因是：(1) 不同答案的 trace
    未注入 answer assertion 约束，MaxSAT 无法产生冲突；(2) 提取失败率 54.4%（QwQ 重新推理而非输出 JSON）。L3 修复（注入
    answer==trace_answer）是 SICA 能否工作的架构前提，L1（prompt 强制 JSON）是质量保障。先 5 题验证再全量，避免浪费
    GPU。
  related_experiments:
  - exp_id: sica_proofwriter30_v2
    role: trigger
    result: MaxSAT 16/16 satisfied_ratio=1.0, SICA worse than SC by 6.2pp
  depends_on:

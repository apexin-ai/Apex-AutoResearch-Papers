- id: D056
  date: 2026-05-18 20:29 UTC
  summary: 'D056: Entropy-conditioned analysis integrated as core mechanism evidence.
    SICA works for BOTH models on high-entropy problems; difference is proportion
    of such problems.'
  rationale: 'Per-problem entropy 分析揭示 regime boundary 的 mechanism：


    1. Conditioned on high entropy (>1.0): Mistral +9.6pp (n=73), Qwen +4.8pp (n=21)

    2. 差异在比例：Mistral 35.8% high-entropy vs Qwen 10.3%

    3. 因果链：强模型 → traces 一致 → constraints 冗余 → solver trivial → SICA≡SC

    4. 量化：unanimous 18.6% vs 58.8%; override precision 70.6% vs 28.6%; confirmation
    bias 31.9% vs 62.3%


    这比简单的 SC threshold 提供了更深的 mechanistic explanation。Paper structure 新增 T5 (entropy
    table) 和 F3 (entropy bar chart)。



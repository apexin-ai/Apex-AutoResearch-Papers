- id: D007
  date: 2026-05-15 16:31 UTC
  summary: 'D007: z3 parser 是 0pp 差距根因——并行修 parser + scorer，v3 继续跑后批量重打分'
  rationale: '7/30 题 Reviewer 分析发现 parse_z3_formula() 损失率 41-100%（P7: 72→1, 98.6%），LLM
    提取的约束在 z3 转换时被大量丢弃，MAX-SAT 无法工作。P7（SC 1/12 极度分散）是 SICA 理论最佳场景但因 parser 失效无法发挥。策略：v3
    继续跑收集全部 traces（最贵部分），并行修 parser + scorer，30 题完成后批量重打分作为真正 MVP 结果。'
  related_experiments:
  - exp_id: sica_aime30_v3
    role: 数据来源
    result: running, 7/30 done, 0pp差距但因parser bug无效
  depends_on:
  - D006
- id: D008
  date: 2026-05-15 17:40 UTC
  summary: 'D008: P5 翻转为虚假声明（硬编码），A+C 实际翻转数=0。答案提取率过低是 C3 根本瓶颈，提升为最高优先级'
  rationale: '调查发现 P5 "120→80 flip" 是 rescore_pure.py 硬编码的对照值，v3 P5 实际仅 1 个候选答案 "80"。P7
    的 72→1 也是 parser 仍无法处理（2.8% parse rate），非 dedup 逻辑 bug。11/30 中 SICA=SC 的根因是答案提取率极低（P5:
    1/12, P2/P8/P9/P11: 0/12），多候选竞争场景不存在，任何 scorer 都无法差异化。将答案提取改进提升为最高优先级。'
  related_experiments:
  - exp_id: sica_aime30_v3
    role: 数据来源
    result: 11/30 done, SICA=SC=63.6%, 0pp
  depends_on:
  - D007
- id: D009
  date: 2026-05-15 17:53 UTC
  summary: 'D009: max_tokens=10240 截断是 0-vote 根因，修为 16384 + fallback extraction +
    save intermediates，v3 完成后 v4 重跑截断题'
  rationale: P8/P9/P11 的 0/12 答案提取全因 trace 在 10240 tokens 截断，\boxed{} 未生成。P11 有 60
    raw constraints（11/12 提取成功）证明模型推理充分但 token 不够。trace 耗时与截断强相关：350-435s→12/12 votes,
    730-810s→0-1/12 votes。修复 max_tokens + fallback extraction 预计恢复 P8/P9/P11 答案，创造多候选场景让
    SICA 有差异化空间。v3 继续跑（非截断题有效），v4 只重跑截断题，合并为最终 MVP。
  related_experiments:
  - exp_id: sica_aime30_v3
    role: 数据来源
    result: 12/30 done, P8/P9/P11 confirmed truncated at 10240 tokens
  depends_on:
  - D008
- id: D010
  date: 2026-05-15 19:11 UTC
  summary: 'D010: AIME 0pp gap 是结构性的——QwQ-32B 单候选主导，SICA≡SC。MATH-50 升为关键判定实验'
  rationale: Reviewer 审查 22/30 题发现：所有非空 SC vote 分布仅含 1 个候选答案（unanimous among voting
    traces）。SICA 只能在多候选竞争时产生差异，单候选场景下无论约束打分如何都选同一答案。这不是 parser/scorer bug，是 QwQ-32B
    在 AIME 上答案高度一致的结构性特征（temp_diversity 实验已佐证）。v4 修复 max_tokens+fallback 可能恢复截断题的答案，但如果恢复的仍是同一答案则
    0pp 不变。MATH-500 Level 1-5 混合难度可能存在更多答案多样性（模型错误率 ~9.4%，错题上不同 trace 可能给出不同错答案），是验证
    SICA 核心假设的关键实验。调整优先级：v3 完成 → vote diversity 分析 → v4 快速验证 → MATH-50（决定性实验）。
  related_experiments:
  - exp_id: sica_aime30_v3
    role: evidence
    result: 22/30 完成, SICA=SC=72.7%, 0pp gap, 0 题多候选
  depends_on:
  - D007
  - D009
- id: D011
  date: 2026-05-15 19:47 UTC
  summary: 'D011: Reviewer 预判 MATH-50 将重现单候选模式（已有 32 题零分歧证据），修订策略：MATH-10 快速诊断 → 逻辑域优先'
  rationale: Reviewer 指出 temp_diversity 实验是在 MATH L4-5 上做的（非 AIME），3 个温度 × 5 题 = 零答案分歧；加上
    smoke_5q（5 题 MATH）和 AIME 22 题，共 32 题零多候选。QwQ-32B 答案一致性是模型级特征（CoT 链逻辑约束远强于采样温度），非任务特定。全量
    MATH-50（7-8h GPU）几乎确定重现 0pp。修订策略：(1) v3 完成后做 vote diversity 分析；(2) 取消 v4 AIME
    re-run，改为 MATH-10 trace-only 诊断（v4 代码，~1h）验证修复 + 确认/否定单候选假设；(3) 如确认单候选 → 立即转向
    ProofWriter + FOLIO 作为主实验（逻辑域 FOL 规范化程度高、answer distribution 天然多候选、Z3 parser 损耗低）；(4)
    MATH/AIME 数据保留为 domain boundary 分析。
  related_experiments:
  - exp_id: sica_aime30_v3
    role: evidence
    result: 22/30 单候选
  - exp_id: sica_temp_diversity
    role: evidence
    result: MATH L4-5 三温度零分歧
  - exp_id: smoke_5q
    role: evidence
    result: 5题MATH单候选
  depends_on:

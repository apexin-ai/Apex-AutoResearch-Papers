  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: 'M012: fix-temperature Worker 错误统一 T=0.7 和 T_ext=0.3 为同一个 0.3，导致 exp-026
    trace generation 用错温度'
  root_cause: run_full_mvp.py 的 --temperature 参数同时控制 trace generation 和作为 extractor
    的输入。fix-temperature Worker 看到 "统一 T_ext=0.3" 指令后，将 --temperature 默认值也改为 0.3，未区分
    trace generation (T=0.7) 和 constraint extraction (T_ext=0.3) 是两个独立参数。脚本注释仍写 T=0.7

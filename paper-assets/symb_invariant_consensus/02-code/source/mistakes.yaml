  root_cause: Agent 用 scipy.stats.spearmanr 计算 n=4 数据点的 Spearman 相关。scipy 返回渐近近似 p
    值，对 n=4 不可靠（最小 exact p=1/24≈0.042）。且 ρ=0.970 本身就对不上 old rank data (d²=4 → ρ=0.6)，说明输入数据或计算有额外
    bug。两个错误叠加导致论文报告了不可能的 ρ=0.970, p<0.001。
  prevention: 1. n<10 的 Spearman 必须用 exact permutation test 而非渐近近似。2. 手工验证 rank 计算（n=4
    可以手算）。3. 对统计量做 sanity check：n=4 的 Spearman p 不可能 <0.042。
  status: active
  context: 论文多处引用 ρ=0.970 p<0.001 支撑 capability gap 假说。Reviewer 独立验证发现 old ranks 给出
    ρ=0.6。修正 tiebreaking 后新数据 ρ=1.0 (exact one-tailed p=0.042)。
  fix: 全面重算后 ρ=1.0, exact one-tailed p=0.042。Paper Agent 将统一更新全文。
  related_decisions:

  fix: 论文 3 处修正 T_ext=0.1→0.3（experiments.tex, appendix.tex, limitations_content.tex）。代码修复：VLLMBackend
    构造函数加 temperature 参数，call() 改用 self.temperature。所有新脚本统一 T_ext=0.3。

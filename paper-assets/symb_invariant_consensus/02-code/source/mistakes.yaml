- id: M003
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: exp-010 max-model-len=max-tokens=4096 导致 400 Bad Request 循环（与 proofwriter30
    同一 bug 重犯）
  root_cause: fix worker 将 max-model-len 和 max-tokens 同时从 8192 降到 4096。当 max_tokens
    == max_model_len 时，任何 prompt 都会超限。正确做法是 max-model-len > max-tokens（留 prompt 空间）。
  prevention: 1. vLLM 脚本的 max-tokens 必须 < max-model-len，至少留 2048 给 prompt。2. 修复 token
    配置时只改 max-tokens，不动 max-model-len（除非有明确理由）。3. 实验启动后 30s 内检查是否有 400/retry 日志。
  status: active
  context: proofwriter30 因相同 bug 失败过。这次 Reviewer 建议降 max-tokens 到 4096 时应保持 max-model-len=8192，但
    worker 错误地把两个都降了。exp-010 在 400 循环中浪费 GPU 时间。
  fix: max-model-len=8192 + max-tokens=4096
- id: M004
  date: '2026-05-17'
  category: resource_misuse
  severity: high
  summary: Agent session 死亡导致 GPU 空闲 4+ 小时，exp-019 未能在 exp-010 完成后自动提交
  root_cause: Agent session idle 316min 触发 RESET，但 exp-010 完成后无人提交 exp-019。Agent 在处理完
    discordant 分析 worker_done 后未继续处理队列中的后续指令就进入 idle。
  prevention: 1. Director 应在实验预期完成时设更短 wakeup（exp-010 预期 40min 完成但 wakeup 设了 2400s=40min，此后未再
    follow up）。2. 关键实验排队时考虑用 chained tmux command 做自动接力（不依赖 Agent session 存活）。3. 对
    GPU 空闲 >30min 增加告警机制。
  status: active
- id: M005
  date: '2026-05-17'
  category: experiment_design
  severity: medium
  summary: Temperature ablation 混用不同 run 的 C0 数据声称"单调递增"
  root_cause: T=0.7 ablation 未单独运行（脚本跳过，注释"baseline already done"），直接引用早期 sica_d012_14b

  root_cause: 原始 TOST 分类将 "genuinely different" 定义为 |Δ| > margin，而非 Lakens (2017)
    标准的 McNemar p < 0.05 + TOST not significant。导致 5 条被标为 different 实际只有 2 条满足标准定义。
  prevention: 统计分析使用标准方法时，明确引用定义来源并在代码中注释所用标准。TOST 三分类必须遵循 Lakens (2017)：equivalent
    = TOST significant + raw n.s.，different = raw significant + TOST n.s.，underpowered
    = both n.s.。
  status: active
  fix: 以 Lakens (2017) 标准重算：4 equivalent / 2 different / 10 underpowered。更新 abstract.tex
    + experiments.tex。

- id: M008
  date: '2026-05-17'
  category: communication
  severity: high
  summary: Paper Agent deep queue processed stale instructions, deleted 3 verified
    bib entries
  root_cause: Paper Agent queue depth reached 18+. Old instructions from Step 4 era
    (when diverseaware2025/satbench2025/llmmeets_cp2025 were suspected fabricated)
    were still queued. By the time Paper Agent processed them, Agent had already verified
    all 3 as real papers and filled in correct author metadata. Paper Agent deleted
    the entries and removed citations from related_work.tex, undoing Agent's verified
    work.
  prevention: 1. Before sending instructions to Paper Agent, check queue depth — if
    >5, use replace_agent_queue to clear stale instructions. 2. After Agent completes
    critical fixes (bib, data corrections), send URGENT to Paper Agent explicitly
    stating 'these entries are VERIFIED, do NOT delete'. 3. When multiple agents can
    write to the same files, establish a file lock protocol — one agent owns a file
    at a time.
  status: active
  context: Paper Agent queue depth was 17-18 when the conflicting instruction was
    processed. The 3 bib entries (diverseaware2025=Lyu et al. ICLR 2026, satbench2025=Wei
    et al. EMNLP 2025, llmmeets_cp2025=Bonlarron et al. IJCAI 2025) had been verified
    by Agent via WebSearch and updated with real author metadata. Paper Agent's stale
    instruction treated them as suspicious/fabricated and removed them entirely.
  fix: Director manually restored all 3 bib entries and citations in related_work.tex.
    Recompiled and verified 0 undefined references. Sent STOP instruction to Paper
    Agent.
- id: M009
  date: '2026-05-18'
  category: experiment_design
  severity: high

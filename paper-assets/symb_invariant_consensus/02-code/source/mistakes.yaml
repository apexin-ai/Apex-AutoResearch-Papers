mistakes:
- id: M001
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Agent 未 kill 旧 vLLM 进程就启动新实验，导致 exp-011 OOM 失败 + GPU 空闲 1h
  root_cause: Director 明确指令 kill PID 174298 (Qwen vLLM)，但 Agent 在处理消息队列时跳过了 kill 步骤直接启动
    exp-011。新 vLLM (LLaMA-8B) 无法分配 GPU 内存导致 Engine Core 初始化失败。
  prevention: '1. 实验启动脚本头部加 pre-flight check: kill 所有占用目标 GPU 的 vLLM 进程再启动新的。2. Agent
    收到"kill X then start Y"指令时必须顺序执行并确认 kill 成功后再 submit。3. Reviewer 可在实验 RUNNING
    30s 后做 GPU 占用快照验证。'
  status: active
  context: exp-002 完成后 vLLM PID 174298 (Qwen2.5-14B, 83.5GB) 继续空占 GPU。Director 在 urgent_agent_message
    中要求 kill 174298 再启动 exp-011，但 Agent 未执行 kill 就直接 submit exp-011，导致 LLaMA vLLM
    启动 OOM。GPU 空闲约 1 小时。
  fix: kill -9 174298 释放 GPU 内存后重新提交 exp-011
- id: M002
  date: '2026-05-17'
  category: code_bug
  severity: medium
  summary: LLaMA-3.1-8B shard 2 下载截断（3.88/5.0GB），导致 exp-011 两次启动失败
  root_cause: 模型下载时 shard 2 被截断（可能网络中断），但下载工具未报错。与 Mistral ModelScope 81.3% 截断是同一类问题——下载工具不做完整性校验。
  prevention: 1. 模型下载后必须验证 total_size：sum(shard sizes) >= index.json 的 total_size。2.

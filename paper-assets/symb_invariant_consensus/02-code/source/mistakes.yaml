- id: M028
  date: '2026-05-19'
  category: agent_behavior
  severity: medium
  summary: Agent stalls on complex multi-task deployment messages (2x this session,
    700-1000s+ idle)
  root_cause: Consolidated deployment messages with 5+ parallel tasks (spawn workers,
    SSH operations, registry updates) cause the Agent to stall. Likely due to concurrent
    SSH timeouts or worker spawn contention. Agent cannot recover once stuck in this
    state.
  prevention: Break complex GPU deployment instructions into single-task messages.
    Send one deployment per message (e.g., "Deploy EXP-C on cuda:2" as one message,
    "Deploy EXP-F on cuda:3" as a separate message). Use the queue depth to chain
    tasks rather than bundling. If Agent idle_seconds > 600, immediately replace_agent_queue
    with a simpler message.
  status: active
  context: 'Session 2026-05-19. First stall: original consolidated GPU deployment
    message (EXP-A through EXP-F + registry fixes), Agent spawned 2 workers then stalled
    at 1090s. Second stall: replacement message with 5 tasks, Agent spawned 1 worker
    (exp-062 Gemma, hit disk full) then stalled at 800s+. Both times, the Agent successfully
    spawned initial workers but then stopped making progress.'
  fix: replace_agent_queue with focused single-task messages. For the second stall,
    queued a message with explicit "每完成一个任务就汇报" instruction, but Agent was still stuck
    on the old message.

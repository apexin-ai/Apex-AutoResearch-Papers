- id: M011
  date: '2026-05-18'
  category: code_bug
  severity: high
  summary: 'M011: 论文声明 T_ext=0.1 但代码实际硬编码 T_ext=0.3，温度参数静默失效'
  root_cause: VLLMBackend.call() 方法在 L134 硬编码 temperature=0.3，构造函数不接受 temperature
    参数。run_full_mvp.py 传入的 temperature 被静默忽略。论文作者按 APIBasedLLM 的默认值 0.1 写入论文，未验证 VLLMBackend

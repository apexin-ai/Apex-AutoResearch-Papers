- id: M014
  date: '2026-05-18'
  category: experiment_design
  severity: medium
  summary: n=14 时 contrastive +14.3pp 信号是假象，全量 n=182 为 -1.1pp
  root_cause: 小样本 (n=14) 的方差极大。Contrastive 在 14 题上 14/14 全对 vs SC 12/14，看起来 +14.3pp。但全量
    182 题后 discordant 只有 4 vs 6，净效应 -1.1pp。效果大小被小样本严重高估。
  prevention: 1. 小样本（n<30）的 delta 数值不做决策依据，只看方向和 confidence interval 2. 报告小样本结果时必须注明
    CI 宽度 3. 不基于小样本信号调整资源分配或论文 framing 4. 需要至少 n>50 且 p<0.1 才能作为"信号"级别的证据
  status: active
  context: exp-029 contrastive extraction at n=14 showed 100% vs SC 85.7% (+14.3pp)。我在给用户的汇报中说"如果全量保持
    +3-5pp 就从 Findings 变 Conference"，Paper Agent 也据此开始准备 Framework A。全量结果完全推翻——disc_rate
    反而从 8.2% 降到 6.04%。
  fix: contrastive 结果转为 negative ablation 写入论文。Paper Agent 已通知准备 Framework B。
- id: M015
  date: '2026-05-18'
  category: experiment_design
  severity: high
  summary: 'M015: 多个 vLLM 实例同时启动导致资源竞争，引发 EngineDeadError 崩溃'
  root_cause: westd-16639 上 exp-032 (GPU 0) 和 exp-033 (GPU 1) 的 vLLM 正在运行时，exp-035
    (GPU 3) 的 vLLM 同时启动加载 Qwen2.5-14B，可能引发系统资源竞争（CPU/内存/PCIe 带宽），导致 GPU 0/1 的 vLLM
    EngineCore Shutdown。崩溃后脚本未检测到 vLLM 死亡，继续运行并以 Connection error 污染结果文件。
  prevention: 1. 多 vLLM 实例启动应错开（间隔 2-3 分钟），避免同时加载大模型。2. 实验脚本应检测连续 N 次 Connection error
    后自动退出（dead server detection）。3. 结果写入应验证 response 有效性，Connection error 不应被当作有效结果写入。
  status: active
  context: westd-16639 4×RTX PRO 6000 Blackwell。exp-032 (GPU 0, PW 600) 和 exp-033
    (GPU 1, Qwen3 PW 600) 运行中，exp-035 (GPU 3) 启动时触发崩溃。结果：exp-032 234题中仅20题有效，exp-033
    234题中仅3题有效。

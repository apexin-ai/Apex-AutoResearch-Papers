    tiebreak-only mechanism：去除 exact tie 后 SICA 无额外价值。K≥12 时 SICA 退化：更多 traces 引入更多
    low-quality constraints，noise injection 效应压过任何 signal。整体模式非单调—— low K 弱正向、odd
    K 零、high K 弱负向——使 ''SICA ≤ SC at all K'' 叙述失效，需改为 ''K-dependent with no consistent
    advantage''。


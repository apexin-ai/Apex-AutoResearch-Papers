  analysis: 'K=6 的 +1.7pp 在 n=60 下 SE≈5pp，统计上无意义 (p>0.5)，但在图上形成一个视觉上的正向点， reviewer
    可能追问 ''why not use K=6?''。应对策略：在 appendix 说明 K=6 下 SC 本身 variance 更大 (fewer votes)，
    +1.7pp 在 bootstrap CI [-5.0, +8.3] 内完全兼容零效应。K=11 (odd) gap=0 是核心证据： 无 tie 时 SICA
    完全等价于 SC，确认 SICA 的全部潜在价值来自 tiebreaking。论文可保留此结论。


narrative_guidance: '从 ''structural impossibility'' 全面退守为 ''first systematic empirical
  survey of symbolic consensus across models, domains, and operating conditions''。核心问题：(1)
  Temperature ablation T=1.0 暴露 Δ=+8.3pp (p=0.034)，打破 ''regardless of diversity''
  声明；(2) LLaMA-8B D012 达 p=0.096，成为 第二个边际正向结果；(3) F2 per-problem constraint precision
  均值 0.57 — 高于 random (0.33 for 3-class), 与 ''non-discriminative'' 叙事矛盾；(4) C0 仅有
  2 个聚类（<5% vs 22-68%），无梯度，沦为 trivial binary indicator。放弃 ''capability trap'' 作为 mechanism
  claim，降级为 descriptive label。Hero figure 切换 Plan B: temperature × model response-surface
  heatmap（绝大部分区域 ≈ 0 但 T=1.0 角落有正值）。 加 ''boundary conditions'' 节：T=1.0 部分打破 trap 但
  extraction rate 下降 + output coherence 退化 → overhead negates marginal gain。Title
  改为 ''When Does Symbolic Consensus Help? A Systematic Empirical Study''。仍冲 EMNLP，novelty
  从 mechanism identification 转向 comprehensive negative-result coverage + practical
  operating guidelines (C0 gate + temperature-overhead tradeoff)。 关键数值: aggregate_abs_weighted_delta_pp
  ≈ 1.5pp, n_exp_positive_p_below_010 = 2, discordant_sica_winrate ≈ 0.65, c0_scaling_distinct_levels
  = 2, f2_constraint_precision_mean = 0.57, f2_precision_vs_entropy_R2 = 0.008。

  '

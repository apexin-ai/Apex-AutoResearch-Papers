tier: median
narrative_guidance: 'Claim 1 从 ''structural trap'' 软化为 ''empirically pervasive limitation
  across tested conditions and scales''。 Claim 3 从 ''diagnostic predictor'' 降为 ''binary
  early-stopping gate (C0 < 5% → skip)''。 F2 改 binned box-plot + 95% CI band，正文承认
  per-problem noise 但强调 aggregate consistency。 Temperature ablation 入正文但 hedge: ''across
  the tested temperature range (0.3–1.0)''。 用 5 models × 3 domains 广度弥补 mechanism
  深度不足。C0 diagnostic 弱化为半页讨论而非独立 claim。 零个实验 p < 0.10；1-2 个方向性噪声点 Δ 可达 +5pp (n=60)。exp-013
  ablation 仍为主要 mechanism evidence。

  '
imagined_experiments:
- name: sica_k_ablation_14b
  plan_id: exp-002
  description: 'Qwen2.5-14B K=6,8,11,12,16,20 on D012 60 questions。 核心问题：SICA 是否仅在
    even-K tie 时有价值？K=11 (odd) 是关键测试。

    '
  expected_results:
    K6_sica_accuracy: 0.733
    K6_sc_accuracy: 0.733
    K6_delta_pp: 0.0
    K8_sica_accuracy: 0.717
    K8_sc_accuracy: 0.733
    K8_delta_pp: -1.7
    K11_sica_accuracy: 0.733
    K11_sc_accuracy: 0.733
    K11_delta_pp: 0.0
    K12_sica_accuracy: 0.733
    K12_sc_accuracy: 0.7
    K12_delta_pp: 3.3
    K16_sica_accuracy: 0.717
    K16_sc_accuracy: 0.733
    K16_delta_pp: -1.7
    K20_sica_accuracy: 0.7
    K20_sc_accuracy: 0.717
    K20_delta_pp: -1.7
    max_abs_delta_pp: 3.3
    all_p_gt_015: true
    K11_odd_gap: 0.0
    sica_leq_sc_at_large_K: true
  result_rationale: 'n=60 功效不足——每个 K 条件的 SE ≈ 5-6pp，因此 ±3pp 波动完全在噪声范围内。 K=11 (odd)
    delta=0 是关键信号：odd-K 几乎无 tie，SICA 无 tiebreak 优势时退化为 SC， 证明 SICA 的全部增益来自 tiebreak
    而非 constraint 信息。 大 K (16,20) 轻微劣于 SC，因为更多 trace 引入更多低质量 constraints， MaxSAT 在噪声
    constraints 上的 exclusion 偶尔排除正确答案。 无任何 K 值达到 p < 0.15，与 median 档 "零个实验 p < 0.10"
    一致。

    '
  tables:
  - name: T_K_ablation
    description: K × (SICA, SC, Δpp, p-value) 表格，附 tiebreak frequency 列
  figures_description:
  - 'Line plot: K (x) vs Δpp (y)，flat at ~0 with ±3pp noise band。标注 K=11 odd 点。'
  analysis: 'SICA ≤ SC at all K ≥ 16; K=11 (odd) gap=0 确认 tie-only mechanism。 Larger
    K does not help — noise injection from additional low-quality constraints。 结论：SICA
    对 K 值不敏感，其全部价值仅在 even-K tie 场景。

    '

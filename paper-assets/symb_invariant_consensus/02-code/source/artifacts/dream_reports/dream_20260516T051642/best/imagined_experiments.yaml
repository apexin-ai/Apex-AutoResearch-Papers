  analysis: Overhead分析直接回应reviewer concern。关键message： (1) MAX-SAT本身几乎零成本（<1%）——overhead完全来自约束提取的LLM调用；
    (2) 约束提取可并行化，实际部署中overhead<10%； (3) 对比+6.9pp的FOLIO gain，8%的额外时间是高性价比的。 论文中可以framing为："The

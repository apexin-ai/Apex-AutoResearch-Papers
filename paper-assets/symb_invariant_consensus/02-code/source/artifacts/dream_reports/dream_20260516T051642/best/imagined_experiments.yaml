  result_rationale: '60题D012中FOLIO的+6.7pp来自4/30题的tiebreak翻转。在102题上，tiebreak事件按比例 出现约8-9次（C0≈54%意味着约55题有多候选，其中K=12时约15%形成精确tie），
    SICA在其中约76%的case胜出（MAX-SAT权重正确选择了约束更一致的答案）。 6.9pp的gap略高于60题的6.7pp，因为更大样本包含了更多FOLIO中语义复杂的多步推理题，
    这些题上14B的trace多样性更高（更多tie机会）。ProofWriter从0pp上升到1.0pp： D012的30题PW结果为0pp并非PW上SICA无效，而是30题中碰巧没有tiebreak翻转成功。
    扩展到102题后，约4-5个PW tiebreak中有2-3个SICA胜出，产生了小但正的gap。 PW的gap小于FOLIO因为PW的推理链结构更模板化（depth-5推理步骤较固定），
    导致即使有多候选，约束质量的区分度不如FOLIO的自然语言推理场景。 合并204题的bootstrap p=0.023达到p<0.05，因为FOLIO的强信号主导了combined结果。
    PW单独的p=0.34未达显著——这是预期的，论文中呈现为"正向趋势但需更大样本确认"， 重点放在combined和FOLIO的显著性上。


  result_rationale: '7B模型比14B弱→两个效应叠加产生更大SICA gain： (1) 更高的C0（0.68 vs 14B的0.53）：7B的推理能力较弱，对同一问题产生更多样的答案
    （K=12条trace中约8条产生多候选），这意味着更多tiebreak机会。 (2) SC baseline更低（55% vs 14B的70%）：弱模型的majority
    vote更容易出错， 给SICA更大的改进空间。 (3) tiebreak win rate保持在75%（6/8）：MAX-SAT的约束聚合能力不依赖模型强度，
    因为它是在约束层面做推理而非在答案层面。即使7B的约束质量略低 （c1_extraction_rate=0.93 vs 14B的1.0），MAX-SAT仍能从noise中提取signal。
    6.7pp的gap大于14B的3.3pp，验证了C0-as-predictor的因果方向： C0更高→更多tie→更多SICA介入→更大gain。注意基线准确率从14B的70%降到55%，
    这是预期的——7B在逻辑推理上天然更弱。但SICA把7B的62%拉到接近14B SC的70%， 这是一个有实际意义的结果（"SICA让便宜模型接近贵模型的SC性能"）。
    bootstrap p=0.068在60题上略高于0.05，但在204题扩展后预计可达显著。


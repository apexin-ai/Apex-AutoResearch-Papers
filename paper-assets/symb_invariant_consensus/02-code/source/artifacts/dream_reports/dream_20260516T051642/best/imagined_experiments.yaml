      - 29.4%
      - 70.6%
    - - SC-random (E[·])
      - 37.5%
      - 71.7%
      - 41.2±8%
      - 72.0%
    - - SICA (MAX-SAT)
      - 75.0%
      - 73.3%
      - 76.5%
      - 74.5%
  figures_description:
  - 'Figure 4: 三种tiebreak策略在tie问题上的准确率对比（bar chart with error bars for random）。SICA
    bar显著高于random的CI上界。'
  analysis: '直接回应"random tiebreak closes the gap"的reviewer concern。数据显示： (1) SICA
    vs random仍有显著gap（+2.9pp on 204q, p=0.041），说明MAX-SAT权重 确实提取了有用信号；(2) 即使承认部分gain来自"确定性tiebreak恰好差"，
    SICA vs random的+2.9pp仍然是实质性改进；(3) 这进一步支持mechanism story—— 约束权重区分了推理质量高的trace和低的trace。

    '

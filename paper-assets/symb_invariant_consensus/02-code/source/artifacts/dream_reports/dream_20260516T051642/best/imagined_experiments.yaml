- name: constraint_quality_case_studies
  plan_id: exp-008
  description: '对5-10个代表性问题做定性分析：约束是否语义有意义？被排除的约束是否对应推理错误？

    '
  expected_results:
    n_case_studies: 8
    cases_selected:
    - type: SICA wins tie (FOLIO)
      count: 3
    - type: SICA loses tie (FOLIO)
      count: 1
    - type: No tie, SICA=SC (FOLIO)
      count: 2
    - type: ProofWriter high-contradiction
      count: 2
    qualitative_findings:
      constraint_semantic_validity: 6/8 cases show constraints that faithfully represent
        key logical relationships in the problem
      excluded_constraint_analysis: In 4/5 cases with exclusions, excluded constraints
        correspond to identifiable reasoning errors (wrong negation, scope confusion,
        missed premise)
      failure_case_pattern: SICA失败的1个tie case中，错误答案的trace恰好产生了更多internally-consistent但factually-wrong的约束（自洽但错误的推理链）
      constraint_redundancy: 约40%的约束是语义重复（同一逻辑关系的不同FOL表达），MAX-SAT的去重+权重机制处理了这种冗余
  result_rationale: '定性分析的预期基于SICA pipeline的设计：LLM生成的FOL约束是reasoning trace的 形式化表示，因此高质量的trace应产生语义有效的约束。约束提取率c1=1.0（14B数据）
    说明LLM在FOLIO类型的自然语言推理上能可靠地生成FOL。被排除的约束（exclusion rate≈3%） 理论上对应MAX-SAT判定为与多数约束矛盾的项——在推理任务中，这些通常是
    错误推理步骤的形式化。定性验证这一点为SICA的"约束提取→MAX-SAT聚合"pipeline 提供了interpretability论证，回应"MAX-SAT是不是在做有意义的事情"的隐含质疑。

    '
  tables: []
  figures_description:
  - 'Figure 7: 两个case study的详细展示（一个SICA胜，一个SICA败）。展示原题→12条trace的答案分布→提取的约束（5-6条关键约束高亮）→MAX-SAT满足/排除结果→最终选择。类似于流程图+约束表的混合可视化。'
  analysis: '定性分析补充了定量结果的mechanistic story。论文中放2-3个代表性case study （可在appendix放完整8个），直观展示SICA在tie上胜出的原因（正确答案的trace
    产生了更多可满足的约束），以及SICA偶尔失败的原因（错误推理也可以是internally consistent的）。后者是honest的局限性讨论。

    '
- name: overhead_analysis
  plan_id: exp-009
  description: 'Wall-time分解：每个问题的生成时间、约束提取时间、MAX-SAT求解时间。 回应"overhead是否值得"的concern。

    '
  expected_results:
    n_problems_analyzed: 60
    avg_breakdown_per_problem_s:
      trace_generation: 42.0
      constraint_extraction: 12.5
      maxsat_solving: 0.3
      total_sica: 54.8
      total_sc: 42.0
    overhead_ratio: 1.3
    overhead_breakdown_pct:
      generation: 76.6
      extraction: 22.8
      solving: 0.6
    extraction_is_parallelizable: true
    extraction_parallel_overhead_s: 3.2
    parallel_overhead_ratio: 1.08
    maxsat_median_time_ms: 12
    maxsat_max_time_ms: 340
    maxsat_scales_with: n_constraints (linear in practice, theoretical worst-case
      NP)
  result_rationale: 'SICA相比SC的额外开销来自两步：约束提取（需要额外LLM调用将每条trace转换为FOL） 和MAX-SAT求解。从D012数据看，60题×12
    traces = 720次约束提取调用，总时间约750s， 平均12.5s/问题。但这些调用是独立的，可以完全并行化——如果用12个并行worker， per-problem
    overhead降到约3s。MAX-SAT求解（Z3 partial MAX-SAT）在约束数量<100时 通常在毫秒级完成。因此sequential overhead是30%（54.8s
    vs 42.0s）， 但parallel overhead只有8%（45.2s vs 42.0s）。相比SC的30%（sequential）或8%（parallel）
    额外成本，SICA在FOLIO上带来+6.9pp的准确率提升——这是高性价比的。 论文可以argue："SICA adds <10% wall-time overhead
    when extraction is parallelized, while providing statistically significant accuracy
    gains."

    '

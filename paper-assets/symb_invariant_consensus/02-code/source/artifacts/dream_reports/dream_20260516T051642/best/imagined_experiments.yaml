tier: best
narrative_guidance: '原始framing完全成立。三条claim均有统计支撑：(1) SICA在200+问题上显著优于SC， tiebreaking机制通过K消融得到因果验证；(2)
  operating regime通过14B/7B/QwQ三点 清晰划分，C0阈值20%有实证支撑；(3) C0作为zero-cost predictor在3个模型上
  展现强相关。论文以"When Does Symbolic Consensus Help?"为主线， tiebreaking是mechanism section，operating
  regime是main contribution， C0是practical takeaway。EMNLP主会完全够格。

  '

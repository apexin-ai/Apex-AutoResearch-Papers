    sc_random_acc_on_ties_204q: 0.412
    sc_random_acc_on_ties_204q_std: 0.08
    sc_deterministic_acc_on_ties_204q: 0.294
    sica_vs_random_gap_pp_204q: 2.9
    sica_vs_deterministic_gap_pp_204q: 3.9
    random_baseline_bootstrap_p: 0.041
    monte_carlo_runs_for_random: 1000
  result_rationale: 'SC-deterministic在60题数据上是现有baseline（alphabetical tiebreak），已知tie上只有1/4正确。
    SC-random的期望准确率等于tie选项中正确答案的比例：4个tie问题中，如果每题是2候选 50/50 split，random的期望准确率=0.5×(正确答案在候选中的概率)。但实际上部分tie
    的候选答案不是均匀分布（有些tie是3路tie），使得random的期望值约37.5%。 SICA在tie上75%（3/4）显著高于random的37.5%，说明MAX-SAT权重不只是比random好，
    而是捕捉了约束结构中的真实信号。在204题上，17个tie中SICA赢13个（76.5%）， random的蒙特卡洛模拟（1000次）显示均值41.2%±8%，SICA显著优于random（p=0.041）。
    gap从+1.6pp（vs random）到+3.9pp（vs deterministic），说明SICA gain的约55% 来自"比random好"（MAX-SAT的真实贡献），45%来自"random比deterministic好"
    （deterministic的选择恰好偏向错误答案）。论文需要报告vs random的gap作为 SICA overhead的实际回报。

    '

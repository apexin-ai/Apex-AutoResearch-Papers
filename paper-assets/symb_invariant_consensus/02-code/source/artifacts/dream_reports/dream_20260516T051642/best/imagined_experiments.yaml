  result_rationale: 'tiebreak频率机制的因果检验。偶数K产生精确tie的概率取决于K和候选分布： K=6时，2候选各3票的概率较高（C(6,3)×0.5^6≈31%对于50/50
    split），产生约6个tie； K=8时概率略降（C(8,4)×0.5^8≈27%），但更多trace采样使C0略升，tie仍有5个； K=16时，虽然单题精确tie概率降低（C(16,8)×0.5^16≈20%），但更多trace带来
    更多多候选问题（C0升至0.55），且tie时SICA有更多约束可用（16条trace的MAX-SAT 比6条更robust），win rate从K=6的83%升至K=16的86%。K=20时SC自身精度也上升
    （更多vote趋向正确答案），gap回落。关键机制证据：K=9（奇数）时tie=0，gap=0， 因为majority vote在奇数K下总有唯一赢家，SICA无介入空间。这是最干净的因果证据——
    同样的数据、同样的模型，仅K的奇偶性就决定了SICA是否有gain。 r=0.82的tiecount-gap相关说明SICA gain几乎完全由tiebreak频率驱动。


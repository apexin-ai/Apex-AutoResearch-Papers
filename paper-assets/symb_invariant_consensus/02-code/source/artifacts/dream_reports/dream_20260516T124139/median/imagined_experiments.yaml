- name: constraint_ablation
  plan_id: exp-013
  description: 'CPU ablation: SICA-MaxSAT vs SICA-count-only vs SICA-random-weight
    on exp-001 data'
  expected_results:
    maxsat_accuracy_combined: 0.718
    count_only_accuracy_combined: 0.711
    random_weight_accuracy_combined: 0.706
    maxsat_vs_countonly_gap_pp: 0.7
    maxsat_vs_random_gap_pp: 1.2
    countonly_vs_sc_gap_pp: 0.8
    maxsat_folio_accuracy: 0.784
    count_only_folio_accuracy: 0.77
    maxsat_vs_countonly_folio_pp: 1.4
    tiebreak_agreement_maxsat_countonly: 0.78
    n_problems: 804
  result_rationale: In the median tier, MaxSAT is marginally better than count-only
    but the delta is <2pp. This happens because on most tie cases, the constraint
    count already correlates with the correct answer (more constraints → more reasoning
    traces support it → more likely correct). MaxSAT adds value only when constraint
    QUALITY matters — i.e., when a few high-quality constraints for the correct answer
    outweigh many low-quality constraints for the wrong answer. On 804 questions with
    68 ties, only ~15 cases show this pattern, yielding the marginal 0.7pp overall
    difference. Count-only still beats SC (by 0.8pp) because even raw constraint counting
    provides better tiebreaking than arbitrary rules. Random-weight performs worst
    because it destroys the informative signal entirely. The FOLIO subset shows the
    clearest MaxSAT advantage (+1.4pp over count-only) because formal-logic constraints
    have clearer satisfiability structure.
  tables:
  - 'Appendix table: Constraint Ablation (MaxSAT 71.8%, Count-only 71.1%, Random-weight
    70.6%, SC 70.3%)'
  figures_description:
  - 'Bar chart: accuracy by aggregation method with error bars, showing MaxSAT ≥ Count-only
    ≥ Random ≥ SC'
  analysis: 'MaxSAT is NOT essential for the core accuracy claim — count-only gets
    you 70% of the way there. But MaxSAT provides: (1) marginal additional accuracy,
    (2) interpretability (you can inspect which constraints were satisfied/excluded),
    (3) formal grounding (satisfiability checking is principled). Paper frames this
    as: ''MaxSAT provides interpretability and marginal accuracy gains over simpler
    alternatives. The primary contribution is the constraint-based framework and C0
    diagnostic, not the specific solver.'' This defuses the ''over-engineering'' attack
    while preserving the intellectual contribution.'

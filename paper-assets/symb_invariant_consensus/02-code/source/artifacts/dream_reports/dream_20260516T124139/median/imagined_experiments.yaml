    Combined with QwQ-32B (C0=3.6%), this establishes: reasoning models as a CLASS
    show C0<5%, regardless of base architecture (Qwen or LLaMA) or scale (8B or 32B).
    SICA≡SC structurally. SC accuracy of 68.3% is higher than LLaMA-8B-Instruct''s
    58.3% despite same parameter count — reasoning distillation significantly improves
    accuracy while eliminating diversity. This is the clean ''reasoning vs instruction''
    contrast within the same architecture family.'

    Qwen-14B''s position'
  analysis: 'LLaMA provides the second positive cross-family confirmation. The 3-family
    narrative becomes: ''All three instruction-model families show C0>20% (operating
    regime confirmed), with two of three showing positive SICA-SC gaps and the third
    showing directional but flat improvement.'' This is sufficient for EMNLP Findings
    — not every family needs significant gains if the C0 pattern is the primary claim.
    Paper frames Mistral''s flat result as ''extraction quality moderates effectiveness''
    rather than as a failure.'

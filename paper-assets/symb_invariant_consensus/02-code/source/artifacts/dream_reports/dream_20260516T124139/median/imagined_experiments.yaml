    contributing to scatter'
  analysis: 'Mistral confirms C0>20% across families (critical) but shows that C0
    is necessary-not-sufficient for SICA gains. The paper should acknowledge: ''Cross-family
    C0 pattern holds, but per-family SICA-SC delta varies with constraint extraction
    quality.'' This is honest and actually strengthens the analysis paper framing
    — it identifies a second prerequisite beyond C0 (extraction quality). For the
    escalation decision: gap>0 but p>0.2 on 60 questions — per the plan note, could

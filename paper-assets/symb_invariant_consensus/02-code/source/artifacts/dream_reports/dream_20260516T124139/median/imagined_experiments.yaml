    the model sometimes makes arithmetic errors. With C0=10% (below 20% threshold
    but above 5%), this lands in the ''uncertain zone'' — not quite degenerate but
    not clearly in SICA''s operating regime. Zero ties means SICA has no mechanism
    to help. Gap is 0pp. This validates C0 as a cross-domain diagnostic: on tasks
    where the model is confident (high accuracy), C0 is low and SICA is unnecessary.
    The result also shows C0 reflects task-relative confidence, not answer-space properties
    (math has infinite answer space but low C0 when the model is competent).'

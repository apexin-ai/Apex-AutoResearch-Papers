    不是 NP-hard 的 unweighted 版本； (4) 总 overhead 仅 1.38x SC——generation 成本不变，额外成本全在
    extraction， 对比 +2.6pp combined gain 这是 acceptable overhead； (5) Marginal cost
    = 6.2s per pp gain——reviewer 关心的是"多花的时间值不值"， 这个数字说明每额外一个百分点准确率只需 ~6s 额外计算。

    '
  tables:
  - 'T4: Overhead Breakdown — generation/extraction/MaxSAT/total, with fraction and
    comparison to SC'
  figures_description:
  - 'Stacked bar chart (appendix): time breakdown per stage, colored by generation
    (grey) / extraction (blue) / MaxSAT (orange)'
  analysis: '1.38x overhead 是 strong selling point——不到 40% 额外成本换 2.6pp gain。 MaxSAT
    1.4% 直接回应"over-engineering"concern：solver 本身几乎免费， 成本在 extraction 而非 satisfiability
    checking。

    '

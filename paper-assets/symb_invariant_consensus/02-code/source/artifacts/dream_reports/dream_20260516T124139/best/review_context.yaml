  result_rationale: '(1) C0 随 K 单调递增——更多采样暴露更多 reasoning path，从 K=6 的 0.40 升到 K=20
    的 0.58， 但增速递减（marginal path discovery 下降）； (2) Tie rate 呈倒 U 形——K=6 时偶数但候选少 tie
    少，K=12 处 tie 最多（三分类 4:4:4 分裂概率最高）， K=16/20 时多数更容易形成所以 tie 反而下降； (3) Gap 在 K=8-16
    稳定在 ~3.3pp，说明 SICA 增益不是 K 特定值的 artifact； (4) K=6 gap 缩小到 1.7pp 因 tie 太少 SICA 无处发力；
    (5) K=20 gap 也缩小因更多采样让 SC 本身更稳定（大数定律），tie 减少， 但 SC 准确率也上升说明 SC 和 SICA 都受益于更多采样只是
    marginal SICA gain 递减。 K=12 是 sweet spot——足够多样性产生 tie，又不至于太多采样消除分歧。


    2 个 reasoning model， 覆盖 C0 从 0.03 到 0.65 的完整 range； (3) C0=0.20 是 clean threshold——所有
    C0>0.20 的配置 gap>0，所有 C0<0.20 的 gap≈0， binary classifier accuracy=100%； (4) Slope=0.12
    意味着 C0 每增加 10pp SICA gap 增加约 1.2pp—— 这个关系的物理含义是更多 diversity → 更多 ties → 更多 SICA
    纠正机会； (5) R²=0.83 而非 1.0 因 K ablation 数据引入噪声（K=20 gap 回落但 C0 继续升）， 但仍然是 strong

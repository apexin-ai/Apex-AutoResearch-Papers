narrative_guidance: 'All 3 claims stand as-is. Story: SICA provides principled tiebreaking
  (+5-8pp on FOLIO), C0 is a continuous predictor validated across 3 families + 2
  reasoning architectures, MaxSAT satisfiability checking is essential (not over-engineering).
  Hero figure shows clean C0-vs-gap scatter with monotonic trend line (7B→14B→72B
  + QwQ/DeepSeek cluster at origin). Title stays as-is. Target: EMNLP Main acceptance.

  '
imagined_experiments:

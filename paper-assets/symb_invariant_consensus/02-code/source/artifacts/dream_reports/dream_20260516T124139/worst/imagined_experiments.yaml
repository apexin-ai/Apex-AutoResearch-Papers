    k6_sc_acc: 0.7
    k6_gap_pp: 1.7
    k6_c0: 0.45
    k6_tiebreak_count: 8
    k8_sica_acc: 0.717
    k8_sc_acc: 0.7
    k8_gap_pp: 1.7
    k8_c0: 0.48
    k8_tiebreak_count: 6
    k12_sica_acc: 0.733
    k12_sc_acc: 0.7
    k12_gap_pp: 3.3
    k12_c0: 0.53
    k12_tiebreak_count: 5
    k16_sica_acc: 0.717
    k16_sc_acc: 0.717
    k16_gap_pp: 0.0
    k16_c0: 0.52
    k16_tiebreak_count: 3
    k20_sica_acc: 0.717
    k20_sc_acc: 0.717
    k20_gap_pp: 0.0
    k20_c0: 0.5
    k20_tiebreak_count: 2
    wall_time_h: 4.8
  result_rationale: 'K=12时的+3.3pp是D012原始结果的复现，但这个gain几乎完全来自tiebreak场景。 K=6/8（奇数tiebreak不可能或更少）时gap降到+1.7pp，因为偶数K下tie更频繁但
    SICA在tie上的win rate仅~55%，所以净gain不稳定。K=16/20时tie几乎消失（majority 更decisive），gap归零。这揭示了一个致命模式：SICA的gain完全依赖于tiebreak频率，
    而非对非tie题的改进。K增大→tie减少→gain消失，说明SICA不是在做更好的推理聚合， 只是在coin-flip场景中略好于random。C0随K略有变化但基本稳定在0.45-0.53，说明
    trace diversity是模型固有属性而非K的函数——这一点对analysis paper有价值。

    '
  tables:
  - name: T3_k_sensitivity
    content: '|  K  | SC Acc | SICA Acc | Gap | C0   | #Ties | Tie Win% |

      |-----|--------|----------|-----|------|-------|----------|

      |  6  | 70.0%  |  71.7%   | 1.7 | 0.45 |   8   |  56.3%   |

      |  8  | 70.0%  |  71.7%   | 1.7 | 0.48 |   6   |  55.0%   |

      | 12  | 70.0%  |  73.3%   | 3.3 | 0.53 |   5   |  60.0%   |

      | 16  | 71.7%  |  71.7%   | 0.0 | 0.52 |   3   |  50.0%   |

      | 20  | 71.7%  |  71.7%   | 0.0 | 0.50 |   2   |  50.0%   |

      '
  figures_description:
  - 'F4_k_curve: Gap vs K折线图，显示gap在K>12后趋零'
  - 'Tiebreak frequency vs K: 明显下降曲线'
  analysis: 'Worst tier下K ablation暴露SICA的核心弱点：gain完全是tiebreak artifact。 对analysis
    paper有价值：说明constraint-based方法在非tie场景无法改变SC的选择， 因为extraction noise使constraint分布与answer正确性无相关性。

    '
- name: tiebreak_baseline_analysis
  plan_id: exp-003
  description: SICA vs SC-random vs SC-deterministic tiebreak comparison, CPU reanalysis
  expected_results:
    n_tiebreak_problems_d012: 5
    sica_tiebreak_win_rate: 0.6
    sc_random_tiebreak_expected_win_rate: 0.5
    sc_alphabetical_win_rate: 0.6
    sc_first_seen_win_rate: 0.4
    n_tiebreak_problems_expanded: 73
    sica_tiebreak_win_rate_expanded: 0.534
    sc_random_expected_expanded: 0.5
    bootstrap_p_sica_vs_random_expanded: 0.31
    sica_minus_random_gap_on_ties_pp: 3.4
    overall_sica_vs_sc_random_gap_pp: 0.1
  result_rationale: 'D012上5个tiebreak题SICA赢4个（80%）是小样本幸运。扩展到exp-001的73个tiebreak题后，
    SICA的tiebreak win rate回归到53.4%——仅比random的50%高3.4pp，bootstrap p=0.31， 不显著。核心原因：constraint
    extraction在tiebreak题上的质量与非tiebreak题无差异， 而tiebreak题本身是模型"真不确定"的题，extracted constraints同样嘈杂、浅层，
    MaxSAT无法从噪声中提取信号。SICA略高于random可能只是因为MaxSAT倾向于选择 constraint数更多的answer，而这与正确性有微弱正相关（正确reasoning
    chain产生 略多parseable constraints）。但这个效应太弱，无法在统计上与random区分。

    '
  tables:
  - name: T2_tiebreak_comparison
    content: '| Tiebreak Method    | D012 (5 ties) | Expanded (73 ties) | p vs random
      |

      |--------------------|---------------|--------------------|-------------|

      | SICA (MaxSAT)      |   80.0%       |     53.4%          |    0.31     |

      | SC-random          |   50.0%       |     50.0% (E)      |     —       |

      | SC-alphabetical    |   60.0%       |     49.3%          |    0.48     |

      | SC-first-seen      |   40.0%       |     50.7%          |    0.47     |

      '
  figures_description:
  - 'Tiebreak win rate bar chart with 95% CI whiskers: 所有方法的CI严重重叠'
  analysis: 'Worst tier核心证据之一。SICA的tiebreak优势在大样本中消失，与random不可区分。 对analysis paper的contribution：证明constraint
    extraction的质量不足以在 真正ambiguous的题上提供信号——constraints是shallow syntactic patterns，
    不capture deep reasoning validity。

    '
- name: sica_7b_scaling
  plan_id: exp-004
  description: Qwen2.5-7B-Instruct on 60 questions, within-Qwen scaling
  expected_results:
    sica_accuracy: 0.583
    sc_accuracy: 0.567
    gap_pp: 1.7
    bootstrap_p: 0.38
    c0: 0.55
    c0_folio: 0.5
    c0_pw: 0.58
    sc_accuracy_folio: 0.6
    sc_accuracy_pw: 0.545
    sica_accuracy_folio: 0.633
    sica_accuracy_pw: 0.545
    maxsat_exclusion_rate: 0.045
    constraint_quality_score: 0.42
    wall_time_h: 1.8
  result_rationale: '7B模型更弱→C0更高（0.55 vs 14B的0.53），符合"weaker model = more diversity"假设。
    但SICA gain仅+1.7pp（p=0.38），不显著。原因：虽然7B产生更多diversity（更多tie和 multi-candidate问题），但7B的constraint
    extraction质量更差——7B生成的reasoning traces更短、逻辑结构更松散，LLM-based extraction从这些traces中提取的constraints
    更浅层、更多噪声。高C0+低extraction quality=SICA无法利用diversity。这是worst tier 的核心失败模式：C0确实预测diversity，但diversity≠SICA
    can help，因为中间的 constraint extraction是bottleneck。FOLIO上有微弱+3.3pp是因为FOLIO答案空间 只有3类（True/False/Unknown），即使noisy
    constraints也能偶尔选对。

    '
  tables:
  - name: scaling_7b_row
    content: '| Model | SC Acc | SICA Acc | Gap | p    | C0   |

      |-------|--------|----------|-----|------|------|

      | 7B    | 56.7%  |  58.3%   | 1.7 | 0.38 | 0.55 |

      | 14B   | 70.0%  |  73.3%   | 3.3 | 0.23 | 0.53 |

      '
  figures_description:
  - C0 vs model size scatter点 (7B, 14B)：C0随size略降，但gap并非随C0线性增
  analysis: 'C0高但gap不显著——直接反驳"C0 predicts SICA gain"的简单叙事。 对analysis paper：C0 predicts
    diversity (✓) 但不 predict gain (✗)， 因为constraint extraction quality是hidden confounder。

    '

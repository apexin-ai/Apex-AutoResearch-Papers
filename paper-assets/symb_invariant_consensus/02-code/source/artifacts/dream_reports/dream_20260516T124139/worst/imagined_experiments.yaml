- name: constraint_quality_case_studies
  plan_id: exp-008
  description: Qualitative analysis of 5-10 representative questions' extracted constraints
  expected_results:
    n_analyzed: 8
    semantically_meaningful_rate: 0.45
    shallow_pattern_rate: 0.35
    noise_rate: 0.2
    correct_exclusion_rate: 0.3
    false_exclusion_rate: 0.15
    missed_error_rate: 0.55
    finding: Constraints are predominantly surface-level pattern matches, not deep
      logical validators
  result_rationale: '定性分析揭示constraint extraction的根本问题：(1) ~45%的constraints语义上有意义 但过于浅层（如"answer
    must be True or False"）,不能区分正确/错误推理； (2) ~35%是shallow pattern matches（从推理trace中提取的句法模式而非逻辑约束）；
    (3) ~20%是纯噪声（extraction hallucination或parse error）。关键发现：在SICA 选错而SC选对的题上，constraints质量与选对的题无显著差异——说明MaxSAT不是在
    "选择better constrained answer"，而是在"基于noisy signal做coin flip"。 正确排除（exclusion导致正确答案翻转）仅30%，意味着大部分exclusion是neutral或harmful。

    '
  tables: []
  figures_description:
  - 'Constraint quality taxonomy figure: 3层饼图 (meaningful/shallow/noise)'
  - 'Case study boxes: 2个SICA-correct + 2个SICA-wrong的constraint对比'
  analysis: '这是analysis paper最有叙事价值的实验之一。定性证据直接支撑"why doesn''t it work" 的故事：extraction
    bottleneck。LLM-based constraint extraction无法从free-form reasoning traces中提取足够faithful的逻辑约束。

    '

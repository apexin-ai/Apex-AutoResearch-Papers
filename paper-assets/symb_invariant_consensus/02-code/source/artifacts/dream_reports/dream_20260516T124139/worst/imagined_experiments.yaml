- name: constraint_ablation
  plan_id: exp-013
  description: SICA-MaxSAT vs SICA-count-only vs SICA-random-weight, CPU ablation
  expected_results:
    n_problems: 804
    maxsat_accuracy: 0.723
    count_only_accuracy: 0.722
    random_weight_accuracy: 0.718
    maxsat_vs_countonly_gap_pp: 0.1
    maxsat_vs_random_gap_pp: 0.5
    sc_accuracy: 0.72
    bootstrap_p_maxsat_vs_countonly: 0.48
    tiebreak_agreement_maxsat_countonly: 0.89
    finding: MaxSAT satisfiability checking adds no value over simple constraint counting
  result_rationale: '这是Claim 1的make-or-break实验。在worst tier下MaxSAT≈count-only（gap仅0.1pp,
    p=0.48）。原因：MaxSAT的附加价值来自satisfiability checking——检测constraints 之间的逻辑一致性，排除internally
    contradictory constraint sets。但实际extracted constraints几乎都是独立的（无cross-constraint
    logical dependencies），因为 extraction prompt从each trace independently提取，不产生inter-constraint
    implications。结果Z3的satisfiability solver对所有constraint sets都返回SAT （没有unsatisfiable
    subsets to detect），MaxSAT退化为weighted counting。 Tiebreak上MaxSAT和count-only的选择89%一致。Random-weight略差但差距也很小
    （0.5pp），说明constraint count本身与正确性的相关性非常微弱。

    '
  tables:
  - name: constraint_ablation
    content: '| Method        | Accuracy | vs SC  | vs MaxSAT | p vs MaxSAT |

      |---------------|----------|--------|-----------|-------------|

      | SICA-MaxSAT   | 72.3%    | +0.3pp |    —      |      —      |

      | SICA-CountOnly| 72.2%    | +0.2pp |  -0.1pp   |    0.48     |

      | SICA-RandWt   | 71.8%    | -0.2pp |  -0.5pp   |    0.35     |

      | SC baseline   | 72.0%    |   —    |  -0.3pp   |    0.42     |

      '
  figures_description:
  - 'Ablation bar chart with error bars: 四种方法几乎等高'
  analysis: 'MaxSAT is over-engineering confirmed。但在analysis paper中这是一个有价值的 negative
    finding：formal satisfiability checking对LLM-extracted constraints 无附加价值，因为constraints缺乏inter-dependencies。Reframe为"when
    does formal reasoning over constraints add value? When constraints have structure."

    '

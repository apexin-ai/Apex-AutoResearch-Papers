    trace风格tuned的 constraint extraction prompt在Mistral traces上效果更差（parse error rate
    12% vs Qwen的~3%），产生更多noisy constraints。MaxSAT在noisy constraints下做出 worse-than-random的selection（exclusion
    rate 5.2%但exclusion更多是false positive）。 FOLIO上SICA反而比SC低3.3pp：3道FOLIO题上SICA的constraint-based选择选错了。
    这是worst tier的smoking gun：SICA不仅不帮忙，在extraction quality差的情况下 actively harmful。

    '
  tables:
  - name: mistral_row
    content: '| Model       | SC Acc | SICA Acc | Gap   | p    | C0   |

      |-------------|--------|----------|-------|------|------|

      | Mistral-7B  | 56.7%  |  55.0%   | -1.7  | 0.65 | 0.35 |

      '
  figures_description:
  - 'Cross-family C0 comparison bar chart: Mistral C0与Qwen-7B同level，但gap方向相反'
  analysis: 'Worst tier关键证据：high C0 + negative gap。C0 pattern跨家族成立（instruction models都有high
    C0），但这不translate to SICA gains。Extraction quality是 family-specific的，没有universal
    effectiveness。对analysis paper：constraint extraction的family-specificity是一个重要failure
    mode。

    '

  figures_description:
  - 'F2_hero: C0 vs Gap scatter, 两个明显cluster（reasoning near origin, instruction scattered
    along C0=0.3-0.55 with gap≈0），无清晰正相关线'
  - 'F3_heatmap: model × domain C0 heatmap，颜色深浅对比清晰但gap column灰度几乎无变化'
  analysis: 'C0作为continuous predictor失败，仅作为binary indicator区分reasoning/instruction。
    对analysis paper：C0的价值从"predict gain"转为"characterize model behavior"—— 一个关于模型内部一致性的诊断工具，而非SICA部署决策工具。

    '

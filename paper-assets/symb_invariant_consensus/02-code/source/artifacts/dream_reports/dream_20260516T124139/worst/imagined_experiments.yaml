tier: worst
narrative_guidance: 'D023 triggered. All 3 original accuracy claims abandoned. Paper
  pivots to "Why Doesn''t Symbolic Consensus Improve LLM Reasoning? A Diagnostic Study."
  Contributions restructured: (1) C0 as zero-cost diversity indicator across model
  families — characterizes WHEN models disagree, not IF symbolic methods help; (2)
  Negative result on constraint-based aggregation — identifies failure modes (extraction
  noise, shallow constraints); (3) Taxonomy of reasoning vs instruction model behavior
  under sampling. Target EMNLP Findings (50-60%), AAAI 2027 fallback.

  '
imagined_experiments:
- name: sica_expanded_14b
  plan_id: exp-001
  description: PW D5 600 + FOLIO 204 = 804 questions, K=12, T=0.7, Qwen2.5-14B-Instruct
  expected_results:
    n_total: 804
    n_folio: 204
    n_pw: 600
    sica_accuracy_combined: 0.723
    sc_accuracy_combined: 0.72
    combined_gap_pp: 0.3
    bootstrap_p_combined: 0.42
    sica_accuracy_folio: 0.755
    sc_accuracy_folio: 0.74
    folio_gap_pp: 1.5
    bootstrap_p_folio: 0.28
    sica_accuracy_pw: 0.712
    sc_accuracy_pw: 0.713
    pw_gap_pp: -0.1
    bootstrap_p_pw: 0.55
    c0_folio: 0.38
    c0_pw: 0.42
    c0_combined: 0.41
    maxsat_exclusion_rate: 0.031
    tiebreak_count_folio: 18
    tiebreak_count_pw: 55
    tiebreak_sica_win_rate: 0.55
    wall_time_h: 13.5
  result_rationale: 'D012的60题FOLIO +6.7pp是小样本方差膨胀的产物。扩展到204题后，FOLIO的gain从+6.7pp 回归到+1.5pp（p=0.28），因为D012中SICA赢的那几道tiebreak题恰好是高信息量的，但在
    更大样本中tiebreak题的比例被稀释、且新增题中constraint extraction质量参差不齐—— 约30%的FOLIO新增题涉及复杂嵌套量词，extraction产生shallow/错误constraints，MaxSAT
    解与count-only等价。PW在600题规模上SICA与SC几乎完全一致（-0.1pp），因为PW的逻辑 结构虽然更formal，但14B在PW D5上的SC已经接近ceiling（~71%），剩余错题多为模型
    根本理解不了的推理链，constraint extraction无法挽救。Combined gap仅+0.3pp， bootstrap p=0.42，远未达到显著性。核心问题：constraint
    extraction的噪声在大样本 中不再被幸运tiebreak掩盖。

    '
  tables:
  - name: T1_main_results_expanded
    content: '| Dataset    |   N | SC Acc | SICA Acc | Gap (pp) | p-value |  C0  |

      |------------|-----|--------|----------|----------|---------|------|

      | FOLIO      | 204 | 74.0%  |  75.5%   |   +1.5   |  0.28   | 0.38 |

      | PW-D5      | 600 | 71.3%  |  71.2%   |   -0.1   |  0.55   | 0.42 |

      | Combined   | 804 | 72.0%  |  72.3%   |   +0.3   |  0.42   | 0.41 |

      | D012 (ref) |  60 | 70.0%  |  73.3%   |   +3.3   |  0.23   | 0.53 |

      '
  figures_description:
  - 'Bar chart: D012 vs Expanded FOLIO gap收缩可视化，误差条重叠'
  - 'Per-question delta histogram: 大多数delta=0，少数±1，分布近似对称'
  analysis: 'D023 trigger确认。FOLIO gap ≤+2pp且p>0.20，combined gap ≈0。论文必须pivot。 但C0=0.38-0.42的数据仍然有价值——证明14B
    instruction model在这些任务上确实产生 trace diversity，只是symbolic aggregation无法有效利用这些diversity。

    '
- name: sica_k_ablation_14b
  plan_id: exp-002
  description: K sensitivity (K=6,8,12,16,20) on D012's 60 questions
  expected_results:

  result_rationale: 'Generation（vLLM inference）占~85%时间，这与SC相同。SICA的额外overhead来自 constraint
    extraction（~13%，每个trace一次extraction LLM call）和MaxSAT solving （~2%，Z3在小规模constraint
    sets上极快）。总overhead ~17%在worst tier下意味着 "付出17%时间代价换来0pp gain"——对analysis paper来说这是一个重要的负面数据点。
    但也说明overhead不是failure的原因（不是"太贵所以不值"而是"even with acceptable cost it doesn''t help"）。Extraction时间可优化（batch
    inference）但不改变 fundamental result。

    '
  tables:
  - name: T4_overhead
    content: '| Phase       | Time(s) | Fraction | Notes                    |

      |-------------|---------|----------|--------------------------|

      | Generation  |  38.5   |  85.2%   | Same as SC               |

      | Extraction  |   5.8   |  12.8%   | 1 LLM call per trace     |

      | MaxSAT      |   0.9   |   2.0%   | Z3, <100 constraints     |

      | **Total**   |  45.2   | 100.0%   | +17.4% vs SC baseline    |

      '
  figures_description:
  - 'Stacked bar: generation(blue) >> extraction(orange) >> maxsat(red)'
  analysis: 'Overhead moderate但gain为零——cost-benefit明确为负。对analysis paper有价值： 排除"overhead是barrier"假说，聚焦在extraction
    quality而非computational cost。

    '

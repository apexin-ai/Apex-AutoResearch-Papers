- name: c0_diagnostic_validation
  plan_id: exp-006
  description: C0 vs SICA-SC gap scatter across all models and K values, CPU analysis
  expected_results:
    n_datapoints: 12
    pearson_r_c0_vs_gap: 0.31
    pearson_p: 0.33
    spearman_rho: 0.27
    binary_threshold_accuracy: 0.75
    c0_threshold_used: 0.2
    high_c0_avg_gap: 0.8
    low_c0_avg_gap: 0.0
    high_c0_points: 8
    low_c0_points: 4
  result_rationale: '在worst tier下，C0与gap的连续相关性很弱（r=0.31, p=0.33），因为高C0的数据点 （7B/14B/Mistral/LLaMA
    instruction models）虽然都有C0>20%，但gap分布在 [-1pp, +2pp]之间，无清晰趋势。二值分类（C0>20% → potential
    gain vs C0<20% → no gain）准确率75%，但这主要是因为low-C0点（QwQ, DeepSeek-R1）gap全为0， 而不是因为high-C0点gap都>0。实质上C0只能区分"reasoning
    vs instruction"， 不能在instruction model内部预测gain大小。这使得Claim 3从"continuous predictor"
    弱化为"binary family classifier"——而这基本等于直接看模型是否是reasoning model， C0作为diagnostic的增量价值存疑。

    '
  tables:
  - name: c0_diagnostic_summary
    content: '| Model              | Type        | C0    | Gap(pp) |

      |--------------------|-------------|-------|---------|

      | Qwen2.5-7B        | instruction | 0.55  |  +1.7   |


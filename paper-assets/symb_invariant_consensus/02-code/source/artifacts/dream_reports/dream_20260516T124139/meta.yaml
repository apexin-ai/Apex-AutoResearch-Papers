    result_rationale: 'D012 60题已显示 FOLIO gap=+6.7pp, combined gap=+3.3pp, C0=53.3%。扩展到
      804题时： (1) FOLIO gap 从6.7pp 略回归到6.9pp——204题样本更大更稳定，D012的10题FOLIO偏乐观但大方向对， 因为
      FOLIO 的 NLI 三分类答案空间天然产生 tie（K=12偶数），SICA 的 MaxSAT 在 tie 上胜率~78%； (2) PW gap
      收窄到+1.2pp——PW 是二分类（True/False），tie 频率低于 FOLIO 的三分类， 且 PW D5 难度较均匀导致 SC 已经较强，SICA
      增益空间有限； (3) Combined gap=+2.6pp 因 PW 占 75% 样本被稀释但仍 >2pp； (4) Bootstrap p_folio=0.023
      因 n=204 提供充足统计功效（d012 的 n=10 太小）， p_combined=0.072 在 p<0.10 阈值内但因 PW 的低信号稀释不够强；
      (5) C0 保持在 0.46 附近——14B-Instruct 在 T=0.7 下对逻辑推理任务天然产生多样输出， 不像 reasoning model
      那样收敛，且 K=12 给予足够采样充分暴露多答案路径。

      '

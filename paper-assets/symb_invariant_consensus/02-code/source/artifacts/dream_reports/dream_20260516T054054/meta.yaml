    | exp-008: Case studies | ✅ Covered (§5.7) | 8 cases, adequate |

    | exp-009: Overhead analysis | ✅ Covered (Table 7) | Transparent |


    All 9 planned experiments are present in the paper. Coverage is complete but depth

    No human evaluation of semantic correctness. "Successfully extracting JSON" ≠
    "semantically correct FOL." The QwQ-32B results reveal that biased constraints
    can make SICA worse than SC (biased extraction → SICA selects wrong answer). The
    paper''s own case study shows 1/8 cases with harmful systematic errors. What is
    the true semantic accuracy rate?


    **W9. Single model family.** [R1, R2]

    All experiments use Qwen2.5 variants. No Llama, Mistral, GPT, or other architecture.
    The claim that SICA helps "instruction models" is validated on exactly one instruction
    model family.



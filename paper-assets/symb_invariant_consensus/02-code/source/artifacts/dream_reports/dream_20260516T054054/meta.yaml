    ---


    ## 7. Scores


    | Criterion | R1 | R2 | Consensus |

    |---|---|---|---|

    | Soundness | 3 | 3 | 3 |

    | Novelty | 3 | 2.5 | 2.5 |

    | Significance | 3 | 2.5 | 2.5 |

    | Presentation | 3 | 3.5 | 3 |

    | **Overall** | **3** | **3** | **3 (Weak Reject)** |


    **Confidence:** 4/5 (both reviewers)


    ---


    ## 8. Overall Assessment


    **Score: 3 — Weak Reject**


    The paper presents a technically sound but narrow contribution. The core idea
    of using MAX-SAT over extracted FOL constraints to break Self-Consistency voting
    ties is reasonable and produces a real signal (75.9% tiebreak win rate). The operating
    regime characterization with QwQ-32B is a useful negative result.


    However, the contribution falls short of a top venue bar for three reinforcing
    reasons:


    1. **Scope mismatch with claims.** The method is a tiebreaker that activates on
    ~10% of questions, but is framed as "symbolic consensus" that "improves LLM reasoning."
    The +3.8pp gain, while statistically significant, comes entirely from resolving
    87 tie cases.


    2. **Narrow evaluation.** Two FOL-domain benchmarks, one model family. No evidence
    of generalization to math, commonsense, or any non-logic domain. Critical baselines
    (Logic-LM, LINC, ORM/PRM) are missing.


    3. **Incremental novelty.** The method is a straightforward combination of Logic-LM-style
    extraction with Self-Consistency sampling. The C0 diagnostic and operating regime
    characterization are directionally interesting but underpowered and partly tautological.


    **What would move this toward acceptance:**

    - Add odd-K ablation to confirm gains survive when ties are rare

    - Compare against Logic-LM, LINC, and at least one learned verifier baseline

    - Include at least one non-logic benchmark (even if results are negative — honest
    scope characterization is valuable)

    - Validate on a second model family (Llama or Mistral)

    - Add the planned figures (the C0-gap scatter plot is the paper''s strongest visual
    argument)

    - Reframe honestly as a tiebreaking method with a principled constraint-based
    mechanism, rather than a general consensus improvement'

    # Dream Review Report: "Principled Symbolic Consensus Improves LLM Reasoning"


    **dream_id:** 20260516T054054 | **review_mode:** full | **reviewers:** R1 (Methods+Experiments),
    R2 (Novelty+Related Work)


    ---


    ## 1. Paper Summary


    SICA (Symbolic Invariant Consensus Aggregation) augments Self-Consistency (SC)
    by extracting first-order logic (FOL) constraints from LLM reasoning traces and
    using weighted partial MAX-SAT (Z3) to resolve voting ties. On 804 questions (FOLIO
    + ProofWriter D5) with Qwen2.5-14B-Instruct (K=12, T=0.7), SICA achieves 71.3%
    vs SC''s 67.5% (+3.8pp, p=0.023). The paper also introduces C0 (multi-candidate
    rate) as a zero-cost predictor of SICA effectiveness (r=0.94 across 4 model scales)
    and characterizes an "operating regime" where SICA helps instruction models but
    degenerates for reasoning models (QwQ-32B).


    ---


    ## 2. Roundtable Process


    ### Step 1: Independent Reviews


    **R1 (Methods + Experiments): Score 3 / Confidence 4**

    **R2 (Novelty + Related Work): Score 3 / Confidence 4**


    ### Step 2: Cross-Sharing


    R1''s statistical and experimental concerns (effective sample size of ~87 ties,
    even-K only ablation, single model family) reinforced R2''s novelty concerns (the
    method only activates on ties, making its scope even narrower than the already
    narrow domain coverage). R2''s identification of missing baselines (Logic-LM,
    LINC, ORM/PRM) complemented R1''s observation that no evidence exists for SICA
    overriding non-tie majorities.


    ### Step 3: Convergence


    Both reviewers converged unanimously on:

    - **Score: 3 (Weak Reject)** — no disagreement

    - SICA''s contribution is narrower than presented: it is functionally a tiebreaker,
    not a general consensus override mechanism

    - Benchmark coverage is critically narrow (2 FOL-domain benchmarks, 1 model family)

    - C0 as a "contribution" is partly tautological

    - Missing important baselines and related work

    - The operating regime finding, while directionally interesting, is underpowered
    (8 data points) and partially restates known phenomena


    No substantive disagreements between reviewers.


    ---


    ## 3. Consolidated Strengths


    **S1. Clean algorithmic formulation.** The MAX-SAT weighting via intra-trace constraint
    consistency (Eq. 1-2) is technically sound and clearly described. Using Z3 makes
    it reproducible.


    **S2. Honest negative results.** Including QwQ-32B''s degeneration and the ProofWriter
    failure case study (§5.7) is commendable. The operating regime characterization,
    even if directionally obvious, is explicitly formalized.


    **S3. Tiebreak baseline comparison (Table 3).** Comparing SICA against random,
    alphabetical, and first-seen tiebreakers directly addresses the "just randomize
    ties" objection. The 75.9% tiebreak win rate vs 50% expected from random is a
    real signal.


    **S4. Transparent overhead reporting.** The 39% wall-time breakdown (Table 7)
    with extraction-dominant cost is honest and practically useful.


    **S5. C0 as a deployment heuristic.** While trivial in isolation, providing an
    explicit threshold (C0 > 0.21) with a practitioner workflow (compute C0 → decide
    whether to run SICA) has practical value.


    ---


    ## 4. Consolidated Weaknesses


    ### Major


    **W1. SICA is a tiebreaker, not a consensus mechanism — title and framing overstate
    the contribution.** [R1, R2]

    All accuracy gains come exclusively from tie resolution. SICA never overrides
    a majority vote. The paper frames this as "symbolic consensus" implying it can
    leverage constraint quality to override incorrect majorities, but no evidence
    supports this. The effective "treatment" sample is ~87 tied questions out of 804.
    The title "Principled Symbolic Consensus Improves LLM Reasoning" should more accurately
    be "Principled Symbolic Tiebreaking for Self-Consistency."


    **W2. Extremely narrow benchmark and domain coverage.** [R1, R2]

    Only two benchmarks (FOLIO, ProofWriter D5), both in the formal logic domain where
    FOL extraction is naturally suited. No math reasoning (GSM8K, MATH), no commonsense
    (ARC, StrategyQA, CommonsenseQA), no code generation — all domains where SC is
    commonly deployed. The method fundamentally requires FOL-amenable problems, making
    generalization claims unjustified. The paper should either demonstrate cross-domain
    applicability or explicitly position itself as a logic-reasoning-specific contribution.


    **W3. Critical missing baselines and related work.** [R2, confirmed R1]

    - **Learned verifiers (ORM/PRM):** Lightman et al. (2023), Cobbe et al. (2021)
    — the most natural competitor for "going beyond majority voting," entirely absent
    from both related work and experiments.

    - **Direct neuro-symbolic competitors:** Logic-LM (Pan et al., 2023) is cited
    but never compared experimentally — this is the minimum baseline since it uses
    the same LLM→FOL→solver pipeline single-path. LINC (Olausson et al., 2023), SatLM
    (Ye et al., 2023) — both directly relevant, neither cited.

    - **SOTA on same benchmarks:** Aristotle (ACL 2025), DyLoS (Xu et al., EACL 2026)
    — without these comparisons, absolute performance cannot be contextualized.

    - **Alternative multi-path methods:** Multiagent debate (Du et al., 2023), Best-of-N
    with self-verification.


    **W4. Statistical concerns mask thin effect.** [R1]

    The headline p=0.023 on 804 questions obscures that only 87 questions (10.8%)
    have ties where SICA differs from SC. The effective comparison sample is 87, not
    804. ProofWriter alone is not significant (p=0.11). No multiple testing correction
    across the 9+ reported experiments and many p-values. Confidence intervals for
    the K-ablation and model-scaling experiments (60-question subsets) are not reported
    — on 60 questions, ±1 correct answer swings the percentage by ~1.7pp.


    **W5. Even-K-only ablation is suspicious.** [R1]

    The K ablation tests {6, 8, 12, 16, 20} — all even. Odd K values (K=11, 13) would
    dramatically reduce exact ties, likely collapsing SICA''s primary advantage. The
    absence of odd-K experiments, combined with the finding that SICA only helps on
    ties, raises a serious concern that the method''s benefit is an artifact of even-K
    sampling design.


    ### Moderate


    **W6. Incremental novelty — SICA = Logic-LM + Self-Consistency.** [R2]

    Both components (LLM→FOL extraction, solver-based reasoning) are well-established.
    The novelty is running extraction K times and aggregating, which is a straightforward
    combination. No formal guarantees connect MAX-SAT optimality to answer correctness.


    **W7. C0 diagnostic is partly tautological.** [R1, R2]

    C0 measures answer diversity, which is mechanically linked to SICA''s gain: if
    all traces agree (C0→0), SICA cannot differ from SC by construction. The "prediction"
    that high C0 leads to high gap is a mathematical consequence, not an empirical
    finding. The regression (r=0.94 on 8 data points, 5 of which are the same model
    at different K — not independent) is underpowered and overfits. Anyone deploying
    SC already observes C0 implicitly.



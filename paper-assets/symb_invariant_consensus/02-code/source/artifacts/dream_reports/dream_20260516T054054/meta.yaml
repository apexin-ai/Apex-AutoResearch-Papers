      开始移走），但约束数量翻倍， MaxSAT 对 tie 的判断更准确，gap 升至 5.0pp。这是 best-gap K。 K=20：SC 自身稳定性提高（更多
      votes 压低 tie 概率），tie_fraction 回落至与 K=12 持平， 但 SC baseline 也升至 71.7%，gap 维持 5.0pp。
      总体呈现 "先升后平" 的 gap-vs-K 曲线，best gap 在 K=16，符合 [4.0, 7.0] 区间。


    **W12.** Wang et al. citation year should be verified (2022 submission / ICLR
    2023).


    **W13.** "First-order logic constraints" is potentially misleading — these are
    LLM-generated pseudo-FOL with no correctness guarantees, not verified formal logic.


    ---


    ## 5. Questions for Authors


    1. Does SICA ever override a strict majority (e.g., 7:5 vote) and improve accuracy?
    If not, should the method be presented as a tiebreaker rather than a consensus
    mechanism?

    2. What happens with odd K (K=11, K=13)? How many ties remain, and does the advantage
    survive?

    3. How does SICA compare to Logic-LM (single-path FOL→solver) on FOLIO and ProofWriter?
    This is the minimum baseline for claiming multi-path aggregation adds value.

    4. What is the human-evaluated semantic accuracy of extracted FOL constraints?

    5. Can you provide results on at least one non-FOL benchmark (e.g., GSM8K with
    Qwen2.5-14B)?

    6. The C0 regression has 8 data points, 5 of which are the same model at different
    K. What are the confidence intervals on the correlation? Are these independent
    data points?

    7. What is the absolute SOTA on FOLIO and ProofWriter D5, and where does SICA

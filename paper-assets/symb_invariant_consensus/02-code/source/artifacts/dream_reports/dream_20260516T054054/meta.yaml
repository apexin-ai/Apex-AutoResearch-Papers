  - name: tiebreak_baseline_analysis
    plan_id: exp-003
    description: Compare SICA vs SC-random-tiebreak vs SC-deterministic on all available
      data
    expected_results:
      sica_acc_804: 0.713
      sc_alphabetical_acc_804: 0.675
      sc_random_acc_804: 0.681
      sc_first_seen_acc_804: 0.67
      sica_vs_random_gap_pp: 3.2
      sica_vs_alphabetical_gap_pp: 3.8
      sica_vs_first_seen_gap_pp: 4.3
      sica_tiebreak_win_60q: 4/5 (80%)
      random_tiebreak_expected_60q: 2.5/5 (50%)
      alphabetical_tiebreak_60q: 3/5 (60%)
      first_seen_tiebreak_60q: 2/5 (40%)
    result_rationale: 'Tiebreak baseline 分析的关键在于：SC-random 是最公平的 baseline，因为它不引入系统性偏差。
      在 804 题上，SC-random 的期望准确率 = SC-deterministic 在非 tie 题上的准确率 + 0.5 × tie 题数量 /
      总题数（tie 时 50/50 猜对）。 计算：非 tie 题 717/804 的 SC acc 约 73.1%，tie 题 87/804 随机猜对 ~50%，
      所以 SC-random ≈ 0.731 × (717/804) + 0.5 × (87/804) ≈ 0.681。 SICA 在 tie 题上 76%
      win rate → SICA 比 random 多赢 ~26% × 87 ≈ 22.6 题 → gap ≈ 2.8pp。 但 SICA 在约束明确的
      tie 题上几乎必赢，在约束噪声大的 tie 题上也不比 random 差太多 （MaxSAT 在约束矛盾时退化为多数约束投票，仍然 ≥ random），因此
      gap 为正。 这回答了 reviewer 的 "random tiebreak closes the gap" 攻击： 不能，因为 SICA 的 tiebreak
      是 informed（基于逻辑约束），胜率显著高于 chance。

      '

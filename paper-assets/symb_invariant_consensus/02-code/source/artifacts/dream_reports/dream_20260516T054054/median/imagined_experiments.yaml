tier: median
narrative_guidance: '核心叙事从 "SICA achieves higher accuracy" 转向 "Characterizing when
  symbolic consensus helps"。 扩展实验显示 FOLIO 正向增益（~4.4pp, p=0.034）但 ProofWriter 接近零（~0.2pp），
  combined bootstrap p=0.082（边缘显著）。Accuracy gain 不能作为独立 headline claim， 需用 K ablation
  跨 K 一致性补强（"SICA ≥ SC at all K=6,8,12,16,20"）。 ProofWriter 零增益从弱点转为验证点（C0 较低 + constraint
  质量差 → 预期无增益 → 实际无增益）。 C0 散点图正相关但 R² 中等（~0.52），C0 降级为 supporting diagnostic 而非独立
  headline claim。 标题方向："When Does Symbolic Consensus Help? Characterizing the Operating
  Regime of Constraint-Based LLM Aggregation"。仍投 EMNLP main，需 K ablation + 7B 数据齐备。

  '

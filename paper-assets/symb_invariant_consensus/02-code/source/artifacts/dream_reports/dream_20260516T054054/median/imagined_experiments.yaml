    题上 75% win rate 属小样本高方差，204 题后 tie 比例稳定在 ~9% 但 tiebreak win rate 从 75% 回归至 ~64%，暴露了部分
    constraint 质量不足的 tie 题。FOLIO 作为 FOL 推理任务， constraint 提取与任务原生表示对齐（精度 ~78%），C0=0.40
    提供了充足的 trace diversity， SICA 的 weighted MAX-SAT 能有效区分 trace 质量，产生稳健的正向增益。

    ProofWriter D5 gap≈0 由两因素叠加：(1) D5 深度-5 证明链使推理路径受任务结构约束， C0=0.30 低于 FOLIO；(2)

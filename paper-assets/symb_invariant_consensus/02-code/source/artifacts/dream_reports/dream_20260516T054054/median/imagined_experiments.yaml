- name: sica_k_ablation_14b
  plan_id: exp-002
  description: 'K=6,8,12,16,20 在 d012 60 题上的 sensitivity 分析。 SICA 增益是否依赖特定 K？tie 频率如何随
    K 变化？

    '
  expected_results:
    dataset: d012_60q
    results_by_k:
      k6:
        sc: 0.667
        sica: 0.7
        gap_pp: 3.3
        c0: 0.47
        tie_frac: 0.117
        ties: 7
      k8:
        sc: 0.683
        sica: 0.717
        gap_pp: 3.3
        c0: 0.5
        tie_frac: 0.083
        ties: 5
      k12:
        sc: 0.7
        sica: 0.733
        gap_pp: 3.3
        c0: 0.53
        tie_frac: 0.067
        ties: 4
      k16:
        sc: 0.717
        sica: 0.733
        gap_pp: 1.7
        c0: 0.55
        tie_frac: 0.05
        ties: 3
      k20:
        sc: 0.733
        sica: 0.75
        gap_pp: 1.7
        c0: 0.58
        tie_frac: 0.033
        ties: 2
    best_gap_pp: 3.3
    best_gap_k:
    - 6
    - 8
    - 12
    sica_geq_sc_all_k: true
    gpu_hours: ~4.5
  result_rationale: 'SC accuracy 随 K 单调递增（66.7%→73.3%）：更多 vote 使 majority 更稳定。 SICA
    accuracy 也递增但斜率更平——SICA 在低 K 时已通过 constraint weighting 补偿 vote 不足。

    Gap 在 K≤12 稳定 3.3pp（+2题），K≥16 降至 1.7pp（+1题），因为 tie 频率 从 K=6 的 11.7% 单调降至 K=20
    的 3.3%——偶数 K 精确 tie 概率按 C(K,K/2)/2^K 下降。 K≤12 时 tie 数量（4-7题）足够使 ~65% tiebreak
    win rate 产出 +2 净增； K≥16 tie 仅 2-3 题，统计上只翻转 1 题。

    C0 随 K 递增（0.47→0.58）：更多 sample 更可能采到少数答案——p=0.8 的题 在 K=6 有 26% 概率只看到主答案（0.8^6），K=20
    仅 1.2%。 C0 增而 gap 不增说明 tie（而非 C0 本身）是 SICA 增益的直接机制。

    关键叙事价值：5 个 K 值全部 SICA ≥ SC，为 p=0.082 提供 trend consistency 补强。


- name: constraint_quality_case_studies
  plan_id: exp-008
  description: '5-10 道代表性题目的 constraint 定性分析。 Constraints 语义是否有意义？排除的 constraints
    是否对应推理错误？

    '
  expected_results:
    total_cases: 10
    folio_cases: 5
    pw_cases: 5
    folio_constraint_precision: 0.78
    pw_constraint_precision: 0.41
    folio_exclusion_correct_rate: 0.82
    pw_exclusion_correct_rate: 0.53
    key_findings:
    - FOLIO constraints 与 FOL ground truth 高度对齐（~78%），排除的 82% 对应实际推理错误
    - PW constraints 多为 tautological（'if A then A'）或 over-general（'all entities have
      properties'），仅 41% discriminative
    - PW exclusion 几乎随机（53%），因 tautological constraints 的 satisfied/violated 与答案正确性无关
    - FOLIO SICA 翻转 case：错误 trace 的 contradictory constraints 被排除，正确 trace 获更高权重
    - PW D5 failure case：5 步链产出 12 constraints，8 个是中间步骤 trivial restatement
  result_rationale: 'FOLIO 高精度（78%）源于任务-方法对齐：FOLIO 要求 FOL 推理，模型 trace 自然产出 类 FOL 语句，LLM-based
    FOL extraction 能准确捕获。排除 constraints 中 82% 对应推理错误说明 MAX-SAT satisfiability checking
    在 FOLIO 上是有效错误检测器。

    PW 低精度（41%）揭示结构性局限：closed-world assumption 推理（"not stated → false"） 难以被标准 FOL
    constraints 捕获。模型 PW trace 更像 if-then 规则机械应用 而非 FOL 推导，提取为低信息量 tautologies。MAX-SAT
    在这些 constraints 上 判断几乎随机（53%），解释 PW C0>0 但 gap≈0。

    定性分析为 "C0 necessary but not sufficient" 提供 mechanistic 解释。

    '
  tables: []
  figures_description:
  - 并排 case study：FOLIO（左）和 PW（右），各展示原题/trace 摘要/constraints（标注 correct/incorrect/tautological）/MAX-SAT
    结果。FOLIO 展示有效 weighting，PW 展示 non-discriminative 本质。
  analysis: '回答 "are constraints meaningful?" 质疑。FOLIO/PW 对比直接解释 为何同方法在不同 dataset
    表现迥异——constraint extraction 质量是 dataset-dependent 特性。Paper Section 5.2 或 Appendix。

    '

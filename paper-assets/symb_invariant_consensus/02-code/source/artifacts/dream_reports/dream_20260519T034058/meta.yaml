    \n2. **Table 6 data presentation error breaks Contribution 4 (R1-W2, R2-W5).**\
    \ StrategyQA (C0=10%) is misplaced in the C0>=20% group. Correctly classified,\
    \ it violates the \"perfect negative predictive value\" claim (C0<20% always implies\
    \ Delta<=0). *Fixable via revision: reclassify and weaken the claim to \"no statistically\
    \ significant positive Delta when C0<20%.\"*\n\n3. **Limited novelty for a top\
    \ venue (R2-W1, borderline Major).** The core finding that same-model traces are\

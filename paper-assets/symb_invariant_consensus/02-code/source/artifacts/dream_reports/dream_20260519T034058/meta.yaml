    \ and Fleiss' kappa to explain this via an \"independence bottleneck\" (Effective-K\
    \ metric), demonstrates with an oracle control (+14.22pp) that the MAX-SAT mechanism\
    \ works with gold constraints, and shows 9 remediation strategies all fail to\
    \ close this gap. A zero-cost C0+SC diagnostic is proposed for deployment decisions.\n\
    \nThe paper is well-executed as a negative result study with thorough experimental\
    \ coverage. However, it has significant issues with statistical rigor, a data\
    \ presentation error that undermines a key contribution claim, and limited novelty.\n\
    \n---\n\n## Reviewer 1: Methods + Experiments\n\n### Strengths\n\n1. **Broad experimental\
    \ coverage.** 5 model families (Qwen, Mistral, LLaMA, DeepSeek, QwQ), 5 domains\
    \ (FOLIO, ProofWriter, StrategyQA, ARC-Challenge, GSM8K), and 20+ conditions provide\
    \ comprehensive evidence for the negative result. The breadth across model scales\
    \ (7B-72B), architectures (standard vs. reasoning-specialized), and domains (logic,\
    \ commonsense, math) is commendable.\n\n2. **Oracle control is the paper's strongest\
    \ experiment.** Replacing self-extracted constraints with gold FOL annotations\
    \ on Qwen-14B FOLIO yields +14.22pp (p=2.0e-7), cleanly separating mechanism quality\
    \ from extraction quality. This is a well-designed counterfactual that definitively\
    \ shows the MAX-SAT aggregation mechanism itself is sound.\n\n3. **MAX-SAT vs.\
    \ count-only ablation is revealing.** Agreement on 803/804 questions demonstrates\
    \ that the solver's combinatorial optimization provides no value over simple counting\
    \ under current constraint quality. This is a strong mechanistic finding about\
    \ constraint redundancy.\n\n4. **Appropriate statistical methodology.** McNemar's\
    \ test for paired binary outcomes is the correct choice. The claim scoping convention\
    \ (n=60 \"suggestive\", n>=200 \"confirm\") shows statistical awareness. Bootstrap\
    \ CIs for temperature sensitivity add rigor.\n\n5. **Nine remediation strategies\
    \ provide breadth-of-failure evidence.** Spanning prompting (2), architecture\
    \ (2), capability (1), verification (2), and diversity (2) approaches, the systematic\
    \ failure strengthens the structural bottleneck thesis.\n\n### Weaknesses\n\n\
    1. **[Major - idea level] No multiple comparison correction for the only significant\
    \ result.** The paper evaluates 17 conditions in Table 1 and reports the Mistral-7B\
    \ FOLIO result (p=0.022) as the sole statistically significant positive finding.\
    \ At alpha=0.05 with 17 tests, the expected number of false positives is ~0.85.\
    \ A Bonferroni correction yields adjusted alpha=0.003, under which p=0.022 is\
    \ no longer significant. The paper does not discuss multiple comparison corrections\
    \ at all. Furthermore, the paper acknowledges only 2 of 3 seeds produce significant\
    \ results (Section 6.4), making the finding seed-dependent.\n\n   **Why Major:**\
    \ This matches the calibration criterion \"统计不显著的结果被作为 contribution 声称.\" The\
    \ paper's Contribution 1 claims to \"identify the narrow operating regime where\
    \ gains occur,\" but if the single significant result doesn't survive multiple\
    \ comparison correction, no operating regime has been reliably identified. The\
    \ paper's core positive claim is undermined.\n\n2. **[Major - idea level] Table\
    \ 6 misclassification breaks Contribution 4.** StrategyQA has C0=10.0% but is\
    \ listed in the \"C0 >= 20%\" group in Table 6. The paper's Contribution 4 claims\
    \ \"perfect negative predictive value: all conditions with C0 < 20% show Delta\
    \ <= 0.\" If StrategyQA (C0=10%) is correctly placed in the C0<20% group, it shows\
    \ Delta=+3.3pp, directly contradicting this claim. The \"perfect NPV\" becomes\
    \ 4/5 = 80%. While the +3.3pp is non-significant (p=0.135), the claim is framed\
    \ as a directional prediction, not a significance claim.\n\n   **Why Major:**\
    \ This matches \"实验范围不足以支撑论文 claim 的 generality.\" A contribution's core claim\
    \ is literally falsified by an error in data presentation. Even if the underlying\
    \ data supports a weaker version of the claim (e.g., \"no significant positive\
    \ Delta when C0<20%\"), the paper as written makes a stronger claim that is incorrect.\n\
    \n3. **[Minor - idea level] Oracle control limited to a single condition.** The\
    \ oracle experiment uses Qwen-14B FOLIO but not the Mistral-7B condition where\
    \ SICA actually shows positive results. Testing the oracle on Mistral-7B FOLIO\
    \ would reveal how much headroom exists in the one condition that works, and whether\
    \ the +3.9pp captures a meaningful fraction of the oracle upper bound for that\
    \ specific condition.\n\n4. **[Minor - idea level] Small sample sizes limit regime\
    \ classification confidence.** Many conditions use n=60, making the Type A/B/C\
    \ regime classification based on unstable point estimates. For example, LLaMA-8B\
    \ D012 (n=60, Delta=+6.7, p=0.219) is classified as \"Goldilocks?\" but the evidence\
    \ is too weak to reliably distinguish it from Type A or Type C.\n\n5. **[Minor\
    \ - presentation level] Seed reporting unclear for the key result.** Table 1 reports\

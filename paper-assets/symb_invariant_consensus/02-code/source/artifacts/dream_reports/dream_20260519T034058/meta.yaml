    ---\n\n## Summary\n\nThe paper proposes SICA (Symbolic Invariant Consensus Aggregation),\
    \ which extracts first-order logic constraints from multiple LLM reasoning traces\
    \ and uses weighted MAX-SAT solvers for answer selection. Through evaluation across\

    \n3. **[Minor - idea level] Eff-K formula provenance not acknowledged.** The formula\
    \ K/(1+(K-1)*kappa) is the standard effective sample size under equicorrelated\
    \ observations, well-known in survey sampling and meta-analysis (Kish 1965, design\
    \ effect literature). The paper presents it as a definition (Equation 1) without\
    \ noting this statistical heritage. This makes the contribution appear more novel\
    \ than it is and may draw criticism from statistically-literate reviewers.\n\n\
    4. **[Minor - idea level] Method-vs-analysis framing inconsistency.** The Abstract\

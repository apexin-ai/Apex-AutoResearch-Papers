  figures_description:
  - 'Fig 11: Scaling curves for random vs dataflow R@5. Lines diverge rather than
    converge, suggesting the gap is structural not statistical.'
  analysis: 'Scaling 趋势是 worst tier 最致命的证据之一：更多数据不能弥补信号质量问题。 如果 gap 随数据量缩小，还有希望通过更多数据或更好的
    Z% 来挽回。但 gap 扩大 说明 random negatives 在大数据regime 下有内在优势——它们的多样性与数据量正相关， 而 dataflow
    的结构信号密度（Z%）是 repo 分布的固有属性。

    '
- name: 'Ablation: fusion head variants'
  plan_id: plan_009
  description: Embedding-only vs structural-features-only vs combined fusion head
  expected_results:
    embedding_only:
      R5: 0.779
      R10: 0.868
    structural_only:
      R5: 0.612
      R10: 0.734
    combined:
      R5: 0.752
      R10: 0.845
    combined_vs_embedding_delta_R5: -0.027
  result_rationale: 'Structural features alone（is_connected, dataflow_distance 等）作为唯一检索信号
    极差（R@5=0.612），因为 connectivity 是必要非充分条件，且 Z=14% 意味着大多数 instance 的 structural feature
    为零或缺失。Combined fusion 反而比 embedding-only 更差（-2.7pp），说明在 Z% 过低时加入 structural features
    是添加噪声而非信号。 Structural features 在 86% 的 instances 上没有区分度（connected=gold）， 在这些 case
    上 fusion head 学到的权重是噪声，反过来干扰了 embedding 信号。

    '
  tables:
  - name: 'Table 9: Fusion Head Ablation'
    columns:
    - Variant
    - R@5
    - R@10
    - Δ R@5 vs Emb-only
    rows:

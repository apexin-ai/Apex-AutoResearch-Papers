  - name: M3a SWE-bench Lite End-to-End Evaluation
    plan_id: plan_003
    description: 3 strategies × best checkpoint, Qwen3.6-27B agent, 300 SWE-bench
      Lite instances
    expected_results:
      n_instances: 300
      agent_model: Qwen3.6-27B
      baseline_swerank_resolve_rate: 0.312
      dataflow_retriever_resolve_rate: 0.338
      random_retriever_resolve_rate: 0.318
      emb_dist_retriever_resolve_rate: 0.305
      delta_dataflow_vs_random_pp: 2.0
      delta_dataflow_vs_swerank_pp: 2.6
      delta_emb_vs_random_pp: -1.3
      swebench_lite_resolve_delta_pp: 2.0
      instances_where_retrieval_changed_outcome: 18
      instances_where_dataflow_uniquely_solved: 9
      instances_where_emb_dist_uniquely_failed: 5
    result_rationale: 'End-to-end resolve rate amplification is inherently noisy —
      retrieval is one component in a multi-step pipeline (retrieval → context selection
      → patch generation → validation). A 7.1pp R@5 gain in retrieval translates to
      ~2pp resolve rate gain because: (1) many instances are solvable regardless of
      retrieval quality (easy fixes in obvious files), (2) some instances fail at
      patch generation regardless of correct retrieval, (3) the agent''s own exploration
      partially compensates for retrieval misses. The 2.0pp gain is at the lower end
      of the best-tier range [1.5, 4.0] but is meaningful because SWE-bench Lite has
      high variance — 2pp on 300 instances is ~6 additional solves, which is detectable
      but not overwhelming. Embedding-distance retriever slightly harms resolve rate
      (-1.3pp) consistent with the retrieval-level findings but attenuated by agent
      compensation. The 18 instances where retrieval changed the outcome are the qualitative
      gold mine for the paper — they demonstrate that structural retrieval surfaces
      fix-relevant files the agent couldn''t find on its own.

      '

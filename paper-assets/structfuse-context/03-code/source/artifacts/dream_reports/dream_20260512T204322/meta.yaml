    ## Reviewer 1: Method + Experiments


    ### Strengths

    - Statistical rigor on primary benchmark: 3 seeds, paired t-tests, p=0.003 for
    the main EmbDist-Random comparison

    - Multi-dataset evaluation (SWE-bench Lite + RepoBench-R) reduces benchmark overfitting

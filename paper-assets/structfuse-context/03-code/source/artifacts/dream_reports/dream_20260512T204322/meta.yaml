      paired_t_test_dataflow_vs_random_p: 0.008
      paired_t_test_emb_vs_random_p: 0.012
    result_rationale: 'At full scale with ~10K instances having valid dataflow negatives,
      the model receives structurally informative contrastive signal that random negatives
      cannot provide. Random negatives are mostly easy (unrelated files) so the model
      converges quickly to a shallow optimum — val_loss ~0.032. Dataflow negatives
      force the model to distinguish between lexically similar but structurally disconnected
      files, pushing it past the random optimum to val_loss ~0.022. The 0.01 val_loss
      gap is smaller than the 0.02 threshold for "different optimum" but the R@5 gap
      of +7.1pp is the meaningful signal. Embedding-distance negatives are partially
      redundant with the encoder''s own similarity — the gradient signal reinforces
      existing biases rather than correcting them, leading to a higher val_loss (~0.049)
      and lower R@5 (0.735). The MVP evidence already showed this pattern: emb_dist
      val_loss was 5x higher than random. At scale the gap narrows because more training
      data helps all strategies, but the ordering is preserved. Three seeds show low
      variance (std ~0.01 R@5) because the dataset is large enough to stabilize training.
      Statistical significance at p<0.01 because the effect is consistent across seeds
      and the evaluation set is ~2K+ instances.


      - pattern: Bug is in configuration/data file not in call graph
        count: 8
        dataflow_helps: false
      - pattern: Gold file shares API contract but no direct dataflow
        count: 7
        dataflow_helps: true
      - pattern: Multiple valid fix locations, gold is one of several
        count: 6
        dataflow_helps: partial
    result_rationale: '44% of baseline failures are helped by dataflow because the
      most common retrieval failure mode is missing transitively-imported utility
      files — these are structurally connected but lexically dissimilar to the bug
      context. The 18 structurally-irrelevant failures (36%) are cases where the gold
      file is a test, config, or data file that has no call-graph relationship to
      the bug — these represent the ceiling of structural methods. The 10 unreachable-by-any
      cases (20%) are instances where the gold patch touches files that no retrieval
      method could reasonably surface (e.g., documentation files, or files added in
      the fix that don''t exist yet). The 44% help rate is consistent with Z=42% —
      roughly the same fraction of instances where structural signal exists.

      '

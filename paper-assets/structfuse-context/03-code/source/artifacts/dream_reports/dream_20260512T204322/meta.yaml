  - name: 'Ablation: Fusion Head'
    plan_id: plan_009
    description: embedding-only vs structural-features-only vs combined fusion head
    expected_results:
      embedding_only:
        R5: 0.79
        note: Equivalent to random-trained baseline
      structural_only:
        R5: 0.712
        note: Data-flow features alone, no embedding
      combined:
        R5: 0.861
        note: Full model
      delta_combined_vs_embedding_pp: 7.1
      delta_combined_vs_structural_pp: 14.9
    result_rationale: 'Structural features alone (is_connected, hop_distance, shared_callees)
      produce a weak retriever (R@5=0.712) because they are sparse and binary — a
      file is either connected or not, and the structural graph doesn''t capture all
      relevance dimensions (e.g., a file can be relevant because it defines an error
      type mentioned in the bug, not because of dataflow). Embedding-only is the random
      baseline (R@5=0.790). The combined model achieves 0.861 because the structural
      features act as a complementary signal that helps the embedding focus on the
      right region of the file space — the structural features filter candidate files,
      and the embedding ranks within that filtered set. The 14.9pp gap between combined
      and structural-only confirms that embeddings remain essential; structure augments
      but doesn''t replace text similarity. The 7.1pp gap between combined and embedding-only
      is the value of the structural signal — exactly matching the main result.

      '
    tables:

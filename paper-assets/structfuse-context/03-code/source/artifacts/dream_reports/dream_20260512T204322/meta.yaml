      correlation_emb_harm_vs_repo_complexity: 0.61
      gradient_redundancy_metric: 0.74
    result_rationale: 'Embedding-distance negatives are most harmful in larger repos
      and harder queries because: (1) in large repos, lexically similar files are
      more abundant, so embedding-distance selects negatives that are close in the
      encoder''s existing feature space — this creates gradient signal that reinforces
      the encoder''s current biases rather than teaching new discriminations. (2)
      For hard queries where BM25 already fails, the encoder''s similarity surface
      is poorly calibrated, and embedding-distance negatives compound this miscalibration.
      In small repos with easy queries, the harm is muted because the retrieval task
      is simple enough that any reasonable negative strategy works. The gradient redundancy
      metric (0.74) quantifies that 74% of the gradient direction from embedding-distance
      negatives overlaps with the gradient from the current encoder''s top-ranked
      non-gold files — confirming the "redundant signal" hypothesis from Claim 2.


    ## Headline Assessment


    **Weak Reject.** The paper identifies a practically relevant phenomenon — embedding-distance
    hard negatives degrading contrastive code retrieval — with a well-structured controlled
    experiment. However, multiple uncontrolled confounds (re-mining frequency, temperature
    regime) weaken the mechanistic claims, the proposed alternative is a statistical

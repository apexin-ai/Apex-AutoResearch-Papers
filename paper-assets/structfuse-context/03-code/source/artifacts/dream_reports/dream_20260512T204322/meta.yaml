      with gold file highlighted, retrieval rank comparison (baseline vs dataflow),
      and key code snippets'
    analysis: Qualitative examples make the abstract "complementary signal" claim
      concrete and intuitive for reviewers. The diversity of categories (utilities,
      pipelines, error handlers, API contracts) demonstrates that the structural signal
      is not limited to one pattern. These examples are selected for pedagogical value,
      not cherry-picked for maximum effect — the failure analysis (plan_011) provides
      the honest aggregate picture.
  review_report: "---\ndream_id: dream_20260512T204322\ntier: best\noverall_score:\
    \ weak accept\ntimestamp: 2026-05-12T20:50:00+00:00\n---\n\n# Dream Review Report\
    \ — StructFuse (best tier)\n\n**Paper:** StructFuse: Structure-Grounded Hard Negative\
    \ Mining for Contrastive Code Context Retrieval\n**Tier:** best | **Review mode:**\
    \ full (2 Reviewers + roundtable)\n**Headline assessment:** Weak Accept\n\n---\n\
    \n## Reviewer 1: Method + Experiments\n\n### Strengths\n\n1. **Rigorous experimental\
    \ design.** Three negative mining strategies compared across 3 random seeds each,\
    \ with paired t-tests reported (p=0.008 for dataflow vs. random, p=0.012 for embedding-distance\
    \ vs. random). The ordering dataflow > random > embedding-distance is consistent\
    \ across all 9 runs — no seed-dependent reversals.\n\n2. **Comprehensive ablation\
    \ coverage.** The paper ablates hop count (1/2/3-hop, Table 6), training data\
    \ size (1K/3K/5K, Table 7), fusion head (embedding-only vs. structural-only vs.\
    \ combined, Table 8), and distance weighting (binary vs. weighted, Section 4.7).\
    \ Each ablation answers a specific design question and the 2-hop Pareto-optimality\
    \ argument is convincing.\n\n3. **Multi-setting evaluation.** Results on three\
    \ evaluation settings — held-out validation (R@5), SWE-bench Lite end-to-end (resolve\
    \ rate), and RepoBench-R cross-file retrieval — provide triangulating evidence.\
    \ The consistent ordering across all three strengthens the claim.\n\n4. **Honest\
    \ failure analysis.** Table 9 manually categorizes 50 failure cases and transparently\
    \ reports that structural signal is irrelevant in 36% and unreachable in 20%.\
    \ This defines a clear ceiling and frames future work.\n\n5. **Gradient redundancy\
    \ metric.** The cosine similarity analysis (0.74 overall, scaling from 0.68→0.82\
    \ with repo size) provides a principled mechanistic explanation for why embedding-distance\
    \ negatives harm. This goes beyond empirical observation into understanding.\n\
    \n### Weaknesses\n\n1. **Single encoder architecture (major).** All experiments\
    \ use Qwen2.5-Coder-3B with LoRA. The central claim — that structure-grounded\
    \ negatives are superior to embedding-distance negatives — could be architecture-specific.\
    \ If the gradient redundancy pattern differs for a differently-pretrained encoder\
    \ (e.g., StarCoder, CodeBERT), the finding may not generalize. Testing on at least\
    \ one additional encoder is needed to support the generality claim.\n\n2. **Static\
    \ embedding-distance negatives (major).** The paper does not specify whether embedding-distance\
    \ negatives are mined once (static) or re-mined each epoch (dynamic). Standard\
    \ practice in dense retrieval (ANCE, DPR) uses dynamic mining to combat selection\
    \ drift. If the comparison is against static embedding-distance negatives, the\
    \ claimed \"selection drift immunity\" advantage is partially an artifact of an\
    \ unfair baseline. This must be clarified and, ideally, a dynamic mining baseline\
    \ should be included.\n\n3. **No statistical significance for SWE-bench Lite (moderate).**\
    \ The +2.0pp end-to-end gain on 300 instances lacks a reported p-value or confidence\
    \ interval. With only 300 instances, +2.0pp (~6 additional solves) may not be\
    \ statistically significant. Bootstrap confidence intervals should be reported.\n\
    \n4. **Training data selection criteria unclear (moderate).** The paper states\
    \ ~24,000 total instances but trains on ~12,000. How were the 12K selected? Are\
    \ all 42.1% instances with structural negatives included, and the rest filled\
    \ with random-only instances? This affects reproducibility.\n\n5. **Number of\
    \ negatives per query not specified (minor).** Eq. 2 selects top-m negatives from\
    \ the disconnected set via BM25, but m is never stated. The InfoNCE denominator\
    \ sums over N(q) but the cardinality of N(q) is unclear. Is it the same m across\
    \ all three strategies?\n\n6. **BM25 for within-set selection not justified (minor).**\
    \ Why use BM25 to select the most lexically similar files from the disconnected\
    \ set (Eq. 2)? The encoder's own similarity could also select hard negatives within\
    \ the disconnected set. This choice conflates two dimensions: the structural constraint\
    \ (disconnected) and the hardness measure (BM25 similarity). An ablation comparing\
    \ BM25 vs. encoder similarity for within-set selection would clarify the contribution\
    \ of each dimension.\n\n7. **RepoBench-R task mismatch (minor).** RepoBench-R\
    \ is a code completion benchmark, not a bug repair benchmark. The paper frames\
    \ the entire contribution around repository-level code repair, making RepoBench-R\
    \ an imperfect generalization test. The connection should be more carefully qualified.\n\
    \n### Questions for Authors\n\n- Q1: Are embedding-distance negatives mined statically\
    \ or dynamically? If statically, can you report results with dynamic re-mining?\n\
    - Q2: What is the value of m (number of hard negatives per query) and is it held\
    \ constant across strategies?\n- Q3: The validation loss for embedding-distance\
    \ (0.049) is 2.2× higher than random (0.032). Could this indicate the model simply\
    \ needs different hyperparameters (learning rate, temperature) for embedding-distance\
    \ training, rather than the strategy being fundamentally inferior?\n\n---\n\n\
    ## Reviewer 2: Novelty + Related Work\n\n### Strengths\n\n1. **Clear and novel\
    \ positioning.** The paper is, to its knowledge, the first to use inter-procedural\
    \ data-flow analysis as a *training signal* for contrastive code retrieval. Prior\
    \ work (LocAgent, RANGER, CodexGraph) uses structural information at inference\
    \ time; ARISE uses intra-procedural analysis. Repurposing CodeQL's inter-procedural\
    \ analysis for negative mining is a clean contribution.\n\n2. **Surprising and\
    \ impactful finding.** The result that embedding-distance hard negatives *actively\
    \ harm* code retrieval (−5.5pp, p=0.012) is counter-intuitive and contradicts\
    \ the implicit assumption in prior hard negative mining work (CoCoHaNeRe, ANCE).\
    \ This finding alone has value beyond the specific StructFuse method.\n\n3. **Formal\
    \ definition and drift immunity.** Eq. 1 cleanly formalizes structure-grounded\
    \ hard negatives. The \"selection drift immunity\" property (structural graph\
    \ is fixed, unlike embedding-distance negatives that shift with encoder updates)\
    \ is a well-reasoned theoretical advantage.\n\n4. **Mechanistic depth.** The gradient\
    \ redundancy analysis (Section 4.6) elevates the paper from \"method A beats method\
    \ B\" to \"here is *why* method B fails.\" The correlation between gradient redundancy\
    \ and repo size provides actionable insight.\n\n### Weaknesses\n\n1. **Related\
    \ work gaps (moderate).**\n   - **Missing citations:** RepoFusion (Shrivastava\
    \ et al., 2023) uses cross-file repository context for code tasks; GRACE (Zan\
    \ et al., 2023) uses dependency-based context. Neither is cited.\n   - **Graph\
    \ neural network approaches:** The paper does not discuss GNN-based code representations\
    \ (code2seq, GGNN, CodeGNN) that also encode structural information. While these\
    \ operate differently (node-level vs. file-level), the omission leaves a gap in\
    \ the structural analysis literature coverage.\n   - **Curriculum learning for\
    \ hard negatives:** The hard negative mining section doesn't discuss curriculum\
    \ learning approaches that gradually increase negative difficulty (e.g., MoCo\
    \ progressive mining). StructFuse uses a fixed difficulty level (max BM25 similarity\
    \ within disconnected set) — whether progressive difficulty would help is unaddressed.\n\
    \n2. **Narrow technical novelty (moderate).** The core contribution is replacing\
    \ the negative selection criterion: \"close in embedding space\" → \"disconnected\
    \ in structural graph.\" The encoder architecture (Qwen2.5-Coder-3B), training\
    \ procedure (InfoNCE + LoRA), evaluation setup (SWE-bench, RepoBench), and even\
    \ the structural analysis tool (CodeQL) are all standard components. The novelty\
    \ is concentrated in the mining strategy, which is conceptually simple. This is\
    \ not necessarily a weakness for a well-executed empirical paper, but the contribution\
    \ should be framed as primarily empirical rather than methodological.\n\n3. **Story\
    \ consistency: \"complementary\" overstatement in abstract (moderate).** The abstract\
    \ claims structural connectivity provides \"a complementary signal dimension that\
    \ text-based similarity cannot recover.\" However, the fusion head ablation (Table\
    \ 8) shows structural features alone achieve R@5=0.712, which is 7.8pp *below*\
    \ embedding-only (0.790). The structural signal enhances but is clearly subordinate\
    \ to text similarity. The abstract's framing suggests a more symmetric complementarity\
    \ than the data supports. Suggest: \"structural connectivity provides a complementary\
    \ training signal that enhances text-based retrieval.\"\n\n4. **Speculative generality\
    \ claims (minor).** Section 5 claims the approach generalizes to molecular retrieval,\
    \ circuit design, and knowledge graph retrieval without any supporting evidence.\
    \ These should be explicitly flagged as speculative future directions, not presented\
    \ as established properties of the framework.\n\n5. **No comparison with inference-time\
    \ graph methods (moderate).** The related work names LocAgent, RANGER, and CodexGraph\
    \ as graph-guided retrieval approaches. A direct comparison — or at least a discussion\
    \ of whether StructFuse's training-time signal is complementary to these inference-time\
    \ methods — would significantly clarify the positioning. Is the contribution an\
    \ alternative to or an enhancement of inference-time graph guidance?\n\n### Questions\
    \ for Authors\n\n- Q4: How does StructFuse compare or combine with inference-time\
    \ graph-guided retrieval (e.g., CodexGraph)?\n- Q5: The \"complementary signal\"\
    \ claim is central to the paper's story. Can you provide a more nuanced characterization\
    \ in the abstract that reflects the asymmetry shown in Table 8?\n- Q6: Could you\
    \ discuss whether the structural negative mining principle would work with dynamic\
    \ analysis (runtime traces) instead of static analysis, addressing the limitation\
    \ Section 5 raises about dynamic dispatch?\n\n---\n\n## Roundtable: Cross-Review\
    \ and Convergence\n\n### Step 2: Cross-Share\n\n**R1 commenting on R2's findings:**\n\
    - R2's concern about narrow technical novelty is valid but mitigated by the strong\
    \ empirical execution. The finding that embedding-distance negatives harm is non-trivial\
    \ and the gradient redundancy analysis elevates the paper's depth. Narrow novelty\
    \ with thorough empirical validation is acceptable for a top venue.\n- R2's related\
    \ work gaps (RepoFusion, GRACE, GNNs) are substantive and should be addressed.\
    \ The missing comparison with inference-time graph methods is the most impactful\
    \ gap — it directly affects how a reader positions StructFuse.\n- Agree with R2\
    \ that the \"complementary\" framing in the abstract overstates the symmetry.\
    \ The data shows structure is a strong complement but clearly the junior partner.\n\
    \n**R2 commenting on R1's findings:**\n- R1's single-encoder concern is the most\
    \ significant weakness. If the gradient redundancy pattern (embedding-distance\
    \ negatives reinforcing existing biases) is encoder-specific, the paper's claims\
    \ about structural connectivity as a *general principle* are undermined. This\
    \ connects directly to the novelty assessment: if the finding is architecture-dependent,\
    \ the contribution is narrower than claimed.\n- R1's static-vs-dynamic embedding-distance\
    \ concern is critical. If dynamic mining (standard practice) significantly closes\
    \ the gap, StructFuse's advantage shrinks. This is a potential confound that must\
    \ be addressed.\n- R1's BM25 within-set selection question is thought-provoking.\
    \ Using the encoder's own similarity to select hard negatives within the disconnected\
    \ set would test whether the structural constraint alone is sufficient, or whether\
    \ the BM25 hardness measure also contributes.\n\n### Step 3: Convergence\n\nBoth\
    \ reviewers converge on the following assessment:\n\n**Agreed strengths:**\n-\
    \ The core idea is well-motivated and cleanly formulated\n- Experimental results\
    \ are statistically significant and consistent across settings\n- The finding\
    \ that embedding-distance negatives harm is the paper's most impactful and surprising\
    \ contribution\n- Ablation coverage is thorough and well-designed\n- Failure analysis\
    \ is honest and informative\n\n**Agreed weaknesses:**\n- Single encoder is the\
    \ primary limitation — at minimum needs discussion, ideally a second encoder\n\
    - Static vs. dynamic embedding-distance comparison must be clarified\n- Related\
    \ work gaps (RepoFusion, GRACE, inference-time graph methods) should be addressed\n\
    - Abstract's \"complementary\" framing should be tempered to reflect the asymmetry\
    \ in Table 8\n- SWE-bench Lite results need statistical significance testing (bootstrap\
    \ CI)\n\n**Points of consensus on assessment:**\n- The paper is above the acceptance\
    \ threshold: the core contribution is valid, the experiments are well-executed,\
    \ and the finding about embedding-distance harm is genuinely surprising.\n- The\
    \ weaknesses (single encoder, possibly unfair embedding-distance baseline) prevent\
    \ a strong accept — they introduce uncertainty about whether the findings generalize.\n\
    - The paper reads as a strong empirical contribution with narrow but clear novelty.\n\
    \n---\n\n## Step 4: Consolidated Assessment\n\n### Overall Score: Weak Accept\n\
    \n### Summary\nStructFuse proposes mining hard negatives for contrastive code\
    \ retrieval training by selecting files that are lexically similar but structurally\
    \ disconnected (no inter-procedural data-flow reachability). Using CodeQL-derived\
    \ structural graphs over 5,000 repositories, the method yields +7.1pp recall@5\
    \ over random negatives (p=0.008) and reveals that embedding-distance negatives\

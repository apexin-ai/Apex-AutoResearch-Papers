    - Comprehensive ablation suite: hop depth (Table 10), training scale (Table 11),
    fusion head (Table 12)

    - Hyperparameters fully specified in §3.4


    ### Weaknesses

    - **W1-R1: Z% coverage collapse unexplained.** Z% drops from 40.8% (pilot) to
    25.0% (5K full). A 39% relative reduction in structural signal availability with
    no analysis of the cause (repo size distribution? timeout rates? language composition?).
    Raises viability concerns at deployment scale.

    - **W2-R1: Re-mining frequency confound.** EmbDist re-mines every epoch. Early-epoch
    negatives are near-random (encoder not specialized), late-epoch negatives come
    from a more discriminative space. The observed harm could partially reflect curriculum
    shift instability rather than the selection criterion itself. A fixed-mine baseline
    (mine once from pretrained encoder) would isolate these effects.

    - **W3-R1: Temperature not ablated.** τ=0.05 is unusually low and concentrates
    loss weight aggressively on the hardest negative. At τ=0.1 or 0.2, the same negatives
    may not cause degradation. Without a temperature sweep, the conclusion may be
    regime-specific ("hard negatives hurt at τ=0.05") rather than general.

    - **W4-R1: End-to-end attenuation.** The 5.0pp retrieval R@5 gap compresses to
    0.5pp in end-to-end resolve rates (Table 6). This ~10× attenuation is neither
    explained nor adequately acknowledged. If the downstream task absorbs the retrieval
    difference, the practical significance of the main finding is substantially reduced.

    - **W5-R1: Gradient redundancy is correlation, not mechanism.** r=0.71 between
    input property (negative similarity) and output metric (performance harm) is not
    a gradient measurement. Actual gradient redundancy requires showing collinear
    gradient updates or within-batch gradient duplication. The mechanistic label overstates
    the evidence.

    - **W6-R1: RepoBench-R lacks error bars.** Table 5 reports point estimates without
    standard deviations or significance tests, inconsistent with the statistical treatment
    elsewhere. The cross-dataset claim cannot be assessed for reliability.


    ### Rating: Weak Reject


    ---


    ## Reviewer 2: Novelty + Related Work


    ### Strengths

    - Counterintuitive negative result with practical value — challenging a widely
    adopted heuristic is a legitimate contribution when evidence is controlled

    - Ceiling analysis (22% addressability) is methodologically honest and prevents
    overclaiming

    - High-level story arc is internally consistent: "harder is not always better"
    framing carried through intro → experiments → discussion


    ### Weaknesses

    - **W1-R2: Insufficient differentiation from CoCoHaNeRe.** Shi et al. (2023) already
    found embedding-distance negatives can be redundant. The paper claims to "extend
    with controlled experiments and a mechanistic explanation" but does not articulate
    what CoCoHaNeRe''s specific mechanism was or why it does not subsume the gradient
    redundancy account. Novelty of the mechanism claim is ambiguous.

    - **W2-R2: "First to use inter-procedural data-flow" overclaimed.** GraphCodeBERT
    explicitly encodes data-flow edges during pre-training — a prior use of structural
    signal in the representation learning pipeline. Clone detection literature (FA-AST,
    ASTNN) uses structural proximity signals analogously. The "first" claim may be
    inaccurate without engaging this work.

    - **W3-R2: Sparse references (11 entries) with identifiable gaps.** Missing: Kalantidis
    et al. 2020 (Hard Negative Mixing), Robinson et al. 2021 (Contrastive Learning
    with Hard Negatives), GraphCodeBERT (Guo et al. 2021), RocketQA (Qu et al. 2021),
    ADORE (Zhan et al. 2021). These are standard citations for the claims being made.

    - **W4-R2: Story consistency tension.** Abstract and intro present gradient redundancy
    as a domain-general mechanism; conclusion narrows to single encoder / Python only
    / 50-instance ceiling. The paper cannot simultaneously argue a general mechanism
    and limit generalizability only in limitations. This tension is unresolved.

    - **W5-R2: Null result framed as recommendation.** DataFlow negatives achieve
    +0.7pp with p=0.42 — statistically indistinguishable from random. Calling this
    a "safe alternative" and "actionable recommendation" for practitioners overstates
    a null finding. A non-inferiority test or tighter confidence bounds would be needed
    to support this framing.


    ### Rating: Reject


    ---


    ## Cross-Reviewer Synergies (Roundtable Convergence)


    After cross-sharing, both reviewers identified reinforcing concerns:


    1. **Mechanism claim is doubly weakened.** R1''s re-mining confound (W2-R1) +
    R2''s CoCoHaNeRe overlap (W1-R2) together mean the "gradient redundancy" mechanism

    result_rationale: 'Both strategies benefit from more data, but the dataflow advantage
      grows because more data means more instances with valid structural negatives
      (Z~42% of instances have usable signal). At 1K instances, only ~420 have dataflow
      negatives, which limits the structural signal. At 5K, ~2100 instances contribute
      structural negatives, and the model has enough examples to learn the structural
      discrimination pattern. Random negatives also improve with scale but plateau
      faster because the signal from random negatives is less informative — more random
      negatives are just more easy negatives. The dataflow advantage scales roughly
      log-linearly with data size, suggesting that even more data (10K+) would continue
      to help but with diminishing returns. The delta grows from 5.3pp at 1K to 7.1pp
      at 5K, showing that the structural signal is data-efficient but benefits from
      scale.

      '
    tables:

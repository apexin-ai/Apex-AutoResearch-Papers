  - name: Qualitative Examples
    plan_id: plan_012
    description: 5-10 cases where structural negatives changed retrieval outcome
    expected_results:
      examples_selected: 8
      categories:
        transitively_connected_utility: 3
        shared_data_pipeline: 2
        cross_module_error_handler: 2
        api_contract_dependency: 1
      format: 'Each example includes: bug description, gold file, baseline retrieval
        rank, dataflow retrieval rank, structural path (call chain), and explanation
        of why lexical similarity fails'
    result_rationale: 'The 8 examples are selected to cover the major categories where
      structural negatives help. Each demonstrates the same pattern: the gold file
      is reachable via 1-2 hop call/dataflow edges but shares few lexical tokens with
      the bug context. Transitively-connected utilities are the most common (3 examples)
      because Python projects heavily use utility modules that are imported through
      intermediate files — BM25 and embedding-based methods miss these because the
      utility file''s vocabulary is generic (e.g., "parse", "validate", "convert")
      while the bug context uses domain-specific terms. Cross-module error handlers
      (2 examples) illustrate a different pattern: the error handling code is structurally
      connected via exception propagation paths that only inter-procedural dataflow
      analysis captures.

      '
    tables: []

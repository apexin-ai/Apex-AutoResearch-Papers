      for 5K repos, <6% timeout, >90% coverage. The method is not specific to CodeQL
      — any static analysis producing a call-graph + dataflow graph would work. Cost
      is dominated by large repos, suggesting a simple repo-size filter could reduce
      timeout to <2% with minimal coverage loss.

      '
  - name: 'Ablation: Hop Count (1 vs 2 vs 3)'
    plan_id: plan_007
    description: 1-hop vs 2-hop vs 3-hop call-graph bounding
    expected_results:
      hop_1:
        Z_pct: 28.5
        timeout_pct: 1.2
        R5_dataflow: 0.831
        connected_set_size_mean: 3.2
      hop_2:
        Z_pct: 42.1
        timeout_pct: 5.2
        R5_dataflow: 0.861
        connected_set_size_mean: 8.7
      hop_3:
        Z_pct: 51.8
        timeout_pct: 18.5
        R5_dataflow: 0.852
        connected_set_size_mean: 24.1
    result_rationale: '1-hop is too conservative — only direct callers/callees are
      connected, so Z% drops to 28.5% and the connected set is too small (3.2 files
      avg) to provide diverse negative mining. The retrieval gain is real but smaller
      (R@5=0.831) because the training signal has less structural diversity. 2-hop
      is the sweet spot — Z=42%, timeout=5.2%, and the connected set (8.7 files avg)
      is large enough for meaningful negatives without being so large that most files
      are "connected" (which would dilute the negative signal). 3-hop expands the
      connected set to 24 files on average, which improves Z to 52% but the larger
      connected set means many weakly-connected files are now excluded from the negative
      pool — some of these are genuinely good hard negatives. Additionally, timeout
      triples to 18.5% because 3-hop traversal is combinatorially expensive. The R@5
      at 3-hop (0.852) is slightly worse than 2-hop (0.861) because the structural
      signal becomes noisier — too many files are "connected" and the negative/positive
      boundary becomes less informative.

      '

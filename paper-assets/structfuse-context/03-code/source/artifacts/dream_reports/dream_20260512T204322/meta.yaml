    analysis: 'The log-linear scaling confirms that the method is not data-hungry
      — even 1K instances produce a meaningful 5.3pp gain. But the improvement from
      1K→5K (+1.8pp) suggests that collecting more structural data is worthwhile.
      This analysis also serves as a practical guide for applying the method to new

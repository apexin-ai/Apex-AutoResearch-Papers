    analysis: 'Simplicity validated — binary connected/disconnected is sufficient.
      This removes a potential reviewer concern about hyperparameter sensitivity in
      the distance weighting scheme.

      '
  - name: Failure Analysis
    plan_id: plan_011
    description: 50 SweRank/BM25 failures, categorize by whether data-flow helps
    expected_results:
      failures_analyzed: 50
      categories:
        dataflow_helps_directly: 14
        dataflow_helps_partially: 8
        structural_irrelevant: 18

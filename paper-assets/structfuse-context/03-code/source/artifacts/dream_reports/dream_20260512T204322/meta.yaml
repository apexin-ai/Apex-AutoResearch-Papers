  review_report: "---\ndream_id: dream_20260512T204322\ntier: worst\noverall_score:\
    \ reject\ntimestamp: 2026-05-12T20:55:00+00:00\n---\n\n# Dream Review Report —\
    \ worst tier\n\n- **Dream ID**: 20260512T204322\n- **Tier**: worst\n- **Paper**:\
    \ \"Why Structure-Grounded Hard Negatives Don't Help Code Retrieval (Yet): An\
    \ Empirical Analysis of Three Negative Mining Strategies\"\n- **Review Mode**:\
    \ full (2 Reviewers + roundtable)\n- **Overall Score**: reject\n\n---\n\n## Headline\
    \ Assessment\n\n**Reject.** The paper presents a potentially interesting negative\
    \ result — structure-grounded hard negatives via CodeQL 2-hop call-graph analysis\
    \ don't improve code retrieval — but the manuscript has critical integrity issues\
    \ (fabricated model name, placeholder reference, missing citations for discussed\
    \ works) and overclaims its statistical evidence. The experimental analysis, while\
    \ well-structured at a high level, is unreproducible due to missing hyperparameters\
    \ and has a dangerously thin related work section (9 references). The core empirical\
    \ insight (Z% sparsity and hop-bounding dilemma) is genuinely informative but\
    \ buried under execution problems.\n\n---\n\n## Reviewer 1: Methods + Experiments\n\
    \n### Strengths\n\n1. **Well-structured comparison**: 3 strategies x 3 seeds x\
    \ 4 evaluation settings is a reasonable experimental matrix for a negative-result\
    \ paper.\n2. **Z% diagnostic metric**: Defining and measuring the fraction of\
    \ instances with non-trivial structural signal is a useful methodological contribution.\
    \ Table 1's breakdown by repository size is informative.\n3. **Hop-bounding tradeoff\
    \ (Table 4)**: The analysis showing no hop setting simultaneously achieves Z >\
    \ 20% and timeout < 10% is the paper's strongest analytical result.\n4. **Stratified\
    \ embedding-distance analysis (Table 6)**: The finding that embedding-distance\
    \ harm concentrates in high-similarity codebases (p = 0.008) is a salvageable\
    \ practical insight.\n\n### Weaknesses\n\n#### Critical\n\n1. **\"Qwen3.6-27B\"\
    \ is not a real model.** Qwen models use the Qwen2.5-XB naming convention. No\
    \ model called \"Qwen3.6-27B\" exists in any public release. This makes the entire\
    \ SWE-bench Lite evaluation (Table 3) unverifiable. If the agent model is fabricated,\
    \ the end-to-end results are meaningless.\n\n2. **SweRank reference is a placeholder.**\
    \ The citation reads \"arXiv:2405.xxxxx\" — a literal unfilled template. This\
    \ is a basic manuscript integrity failure and would be grounds for desk rejection\
    \ at any venue.\n\n3. **Missing critical hyperparameters.** The paper does not\
    \ report: LoRA rank/alpha, learning rate, batch size, number of epochs, warmup\
    \ schedule, the embedding model used for the embedding-distance strategy, or the\
    \ InfoNCE temperature. Reproduction is impossible.\n\n4. **Threshold tau is undefined.**\
    \ The dataflow-aware strategy (Section 3.2) uses s(x,q) > tau to filter candidates,\
    \ but tau is never specified, and no sensitivity analysis is provided. This is\
    \ a free parameter that could significantly affect whether structure-grounded\
    \ negatives help or harm.\n\n5. **SWE-bench claims overclaim statistical evidence.**\
    \ The paper acknowledges in Section 4.3 that \"all three strategies and the SweRank\
    \ baseline fall within the 95% confidence interval (plus/minus 2.5pp), making\
    \ them statistically indistinguishable,\" yet the abstract claims both hard negative\
    \ strategies underperform random \"across all evaluation settings.\" This is a\
    \ direct contradiction.\n\n#### Major\n\n6. **Only 3 seeds for variance estimation.**\
    \ With n=3, the standard deviation estimates (Table 2) have very high uncertainty.\
    \ The reported plus/minus values are unreliable for distinguishing methods.\n\n\
    7. **Pool size = 200 is unrealistically small.** Real-world code retrieval operates\
    \ over hundreds to thousands of files per repository. A 200-file pool may not\
    \ reflect actual retrieval difficulty and inflates absolute recall numbers.\n\n\
    8. **SWE-bench agent confound is uncontrolled.** The LLM agent's ability to use\
    \ retrieved context may vary across retrieval strategies in ways the evaluation\
    \ can't isolate. No ablation on agent sensitivity to retrieval quality is provided.\n\
    \n9. **SweRank comparison is structurally unfair.** SweRank is trained on a larger\
    \ corpus, making it an incomparable baseline. Including it in Table 3 without\
    \ this caveat in the table caption is misleading.\n\n10. **Table 5 scaling ablation\
    \ is one-sided.** Only the dataflow strategy is scaled against random. Embedding-distance\
    \ scaling behavior is missing, preventing a complete picture.\n\n11. **Instance\
    \ count discrepancy.** Table 1 reports 18,200 instances total, but Section 3.3\
    \ says \"~15K training instances.\" ~3,200 instances were dropped without explanation.\n\
    \n12. **Fusion head ablation (Table 7) is undescribed.** The fusion architecture\
    \ (concatenation? attention? gating?) is not specified. Results are uninterpretable.\n\
    \n13. **Contribution 2 contains a placeholder.** The text reads \"(Z%)\" where\
    \ presumably \"14%\" was intended — evidence of incomplete manuscript preparation.\n\
    \n#### Minor\n\n14. **Manual analysis (Table 8)** uses 50 cases with apparently\
    \ a single annotator. No inter-annotator agreement is reported. Sample size is\
    \ marginal for a claimed contribution.\n\n15. **InfoNCE loss details** (number\
    \ of negatives per positive, temperature) are unspecified.\n\n### Questions for\
    \ Authors\n\n1. What is the value of tau, and how sensitive are the dataflow-aware\
    \ results to this threshold?\n2. What LoRA configuration was used (rank, alpha,\
    \ target modules)?\n3. What is \"Qwen3.6-27B\"? Is this a typo for an existing\
    \ model (e.g., Qwen2.5-32B)?\n4. How were the ~15K training instances selected\
    \ from the 18.2K extracted?\n5. What fusion architecture underlies Table 7?\n\n\
    ---\n\n## Reviewer 2: Novelty + Related Work\n\n### Strengths\n\n1. **Negative\
    \ results have value.** The framing as \"empirical analysis\" rather than \"failed\
    \ experiment\" is appropriate when well-executed.\n2. **Z% sparsity insight.**\
    \ The discovery that structural signal density drops from 40.8% (pilot) to 14%\

    figures_description:
    - 'Fig 11: Radar chart comparing 3 configurations across R@1, R@5, R@10, MRR'
    analysis: 'This ablation decomposes the contribution of each signal source. The
      structural signal is complementary (7.1pp gain when added to embedding) but
      not sufficient alone (7.8pp below embedding-only). This supports the "complementary
      signal dimension" pillar of the paper''s motivation and shows that the method
      enhances rather than replaces existing retrieval.

      '
  - name: 'Ablation: Distance-Weighted vs Binary'
    plan_id: plan_010
    description: dataflow-distance weighted negatives vs binary connected/disconnected
    expected_results:
      binary:
        R5: 0.861
      weighted_linear:
        R5: 0.858
      weighted_inverse:
        R5: 0.864
      delta_weighted_vs_binary_pp: 0.3
      p_value: 0.42
    result_rationale: 'The binary connected/disconnected distinction captures most
      of the signal. Weighted variants (using hop-distance as a continuous feature)
      provide negligible additional gain because: (1) the structural graph is already
      scope-bounded to 2 hops, so the distance range is {0, 1, 2, ∞} — too coarse
      for meaningful weighting; (2) the key discrimination is between connected (any
      hop distance) and disconnected (∞), not between 1-hop and 2-hop connected files.
      The inverse-weighted variant marginally helps (+0.3pp) by upweighting negatives
      that are close to the connectivity boundary, but the effect is not statistically
      significant (p=0.42). This is a useful negative result — it shows the method''s
      simplicity (binary signal) is a feature, not a limitation.

      '
    tables:

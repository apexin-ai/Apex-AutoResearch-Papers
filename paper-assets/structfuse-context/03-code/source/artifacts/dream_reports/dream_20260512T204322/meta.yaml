    analysis: 'The failure analysis honestly characterizes the method''s scope. Structural
      negatives help in 44% of failure cases — substantial but not universal. The
      ceiling analysis (20% unreachable) is important for reviewer expectations and
      frames future work: combining structural with other signals (test dependencies,
      git co-change history) could address the remaining 36%.


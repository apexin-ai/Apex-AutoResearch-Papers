- name: M2 全量 3-strategy 对比训练
  plan_id: plan_002
  description: random vs embedding_distance vs dataflow_aware, 3 seeds each, Qwen2.5-Coder-3B
    LoRA, 5K 训练数据
  expected_results:
    random_s42_recall5: 0.812
    random_s123_recall5: 0.798
    random_s456_recall5: 0.821
    random_mean_recall5: 0.81
    random_std_recall5: 0.012
    dataflow_s42_recall5: 0.818
    dataflow_s123_recall5: 0.807
    dataflow_s456_recall5: 0.826
    dataflow_mean_recall5: 0.817
    dataflow_std_recall5: 0.01
    emb_dist_s42_recall5: 0.762
    emb_dist_s123_recall5: 0.748
    emb_dist_s456_recall5: 0.771
    emb_dist_mean_recall5: 0.76
    emb_dist_std_recall5: 0.012
    delta_dataflow_vs_random_R5: 0.007
    delta_emb_vs_random_R5: -0.05
    random_mean_recall1: 0.542
    dataflow_mean_recall1: 0.553
    emb_dist_mean_recall1: 0.489
    delta_dataflow_vs_random_R1: 0.011
    delta_emb_vs_random_R1: -0.053
    training_loss_final_random: 0.028
    training_loss_final_dataflow: 0.035
    training_loss_final_emb_dist: 0.092
    training_time_hours_per_run: 3.2
  result_rationale: 'Dataflow vs random 的 delta 仅 +0.7pp R@5，在 seed 方差范围内（std≈1.1pp），不构成
    统计显著差异。根本原因：Z=25% 意味着训练集中只有约四分之一的 instance 拥有"connected but not gold"的结构信号——对于其余
    75% 的 instance，dataflow-aware miner 回退到 BM25-hard 或 random padding（因为没有足够的 disconnected-but-similar
    candidates），使其行为退化为 近似 random。此外，在 pool diversity 较高的全量评估中（pool=50+），random negatives
    已经 包含足够的"偶然 hard"样本（约 15-20% 的 random negatives 恰好是 BM25-similar 的）， 缩小了结构化采样的边际增益。Embedding-distance
    negatives 则延续 MVP 的负面趋势：在 5K 规模上 delta=-5.0pp R@5，因为 embedding-distance mining
    选出的 negatives 与 encoder 的梯度信号高度冗余（CoCoHaNeRe 效应），导致 representation collapse 风险——val_loss
    显著高于 random（0.092 vs 0.028），说明模型在 embedding-distance negatives 上学到的 区分信号更弱。

    '
  tables:

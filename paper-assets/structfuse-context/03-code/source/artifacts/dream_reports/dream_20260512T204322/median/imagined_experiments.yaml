    combined_recall5: 0.822
    combined_vs_embedding_delta_pp: 0.5
    structural_features_auc: 0.71
  result_rationale: '纯结构特征（5 维：dataflow_distance, path_count, dependency_type, bm25_score,
    inter_procedural）在 retrieval 上表现差（R@5=0.628），因为它们是 sparse binary/integer features，信息量远不如
    dense embedding。组合 fusion head 仅比 embedding-only 高 0.5pp， 因为 MLP fusion head 难以从已经被
    embedding 学习过的信号中提取额外增益——结构特征与 embedding 学到的相似性有部分重叠（bm25_score 尤其如此），且 5 维 sparse
    features 对 128 维 MLP 来说信息密度太低。这个结果说明"结构信号的价值主要在训练阶段（negative selection）而非推理阶段（feature
    fusion）"——一个重要的方法论 insight。


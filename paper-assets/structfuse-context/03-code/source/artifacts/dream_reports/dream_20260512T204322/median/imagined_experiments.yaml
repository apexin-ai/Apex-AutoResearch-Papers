    问题：(1) 大量失败与结构无关（lexical gap, logic-only）， (2) 即使结构信号完美，可恢复的失败也有限（ceiling ~32%），(3)
    Z=25% 进一步削弱 实际可实现增益。论文应将此作为 Discussion 的重要部分，展现对方法 limitation 的 诚实理解——这对 EMNLP

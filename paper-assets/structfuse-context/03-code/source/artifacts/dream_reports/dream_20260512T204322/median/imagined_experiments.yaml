      - 0.810 ± 0.012
      - 0.921 ± 0.008
      - '0.028'
    - - DataFlow-aware (3 seeds)
      - 0.553 ± 0.015
      - 0.817 ± 0.010
      - 0.925 ± 0.007
      - '0.035'
    - - Emb-distance (3 seeds)
      - 0.489 ± 0.020
      - 0.760 ± 0.012
      - 0.878 ± 0.011
      - '0.092'
  - caption: 'Table 4: Pairwise Deltas (pp) with Paired t-test p-values'
    columns:
    - Comparison
    - ΔR@1
    - ΔR@5
    - p-value (R@5)
    rows:
    - - DataFlow − Random
      - '+1.1'
      - '+0.7'
      - '0.42'
    - - EmbDist − Random
      - −5.3
      - −5.0
      - '0.003'

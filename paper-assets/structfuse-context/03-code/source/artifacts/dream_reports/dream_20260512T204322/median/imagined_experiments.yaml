- name: 'Failure Analysis: 50 SweRank/BM25 Failures'
  plan_id: plan_011
  description: 抽样 50 个 SweRank/BM25 检索失败的 instance，人工标注 data-flow 是否有帮助
  expected_results:
    total_analyzed: 50
    category_counts:
      dataflow_would_help: 11
      dataflow_irrelevant_lexical_gap: 18
      dataflow_irrelevant_logic_only: 9
      gold_not_in_repo_scope: 5
      multi_file_edit_needed: 7
    dataflow_help_rate_pct: 22.0
    ceiling_if_perfect_structural_signal_pct: 32.0
  result_rationale: '50 个失败 case 中只有 ~22% 是 data-flow 理论上可以帮助的——这些是 gold file 与 buggy
    file 存在调用链关系但 BM25/embedding 因命名差异未能 rank 高的情况。更多的失败（36%） 属于"lexical gap"类型：gold
    file 和 query 在词汇上完全无关（例如 config file vs source code），data-flow 也到达不了。逻辑修复（18%）需要理解程序语义而非结构关系。
    这个分析解释了 dataflow negatives 为什么没有大幅超越 random：即使 perfect structural signal，ceiling
    improvement 也只有 ~32%×当前 failure rate ≈ 3-4pp，而在 Z=25% 的 实际信号密度下，可实现的增益更小。这是 median
    tier 的核心 ceiling analysis。

    '

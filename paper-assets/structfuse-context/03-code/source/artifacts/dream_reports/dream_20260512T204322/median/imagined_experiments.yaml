  analysis: 'End-to-end 结果确认 retriever 改进被 agent pipeline 的噪声淹没。但与 BM25-only baseline
    相比，所有 trained retrievers 都有 +2pp 的一致增益，证明对比学习训练本身有价值。关键 takeaway 是 dataflow 和
    random 都是有效的 negative 策略，而 embedding-distance 即使在 end-to-end 也表现最差（虽然差异在统计噪声内）。论文应强调
    retrieval-level 结果（Table 3）而非 resolve rate。


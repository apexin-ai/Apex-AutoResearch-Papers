    与 buggy file 连接、但命名差异大导致 embedding-only retriever rank 不高的情况。Dataflow training
    让 encoder 学会了对这类"名字不像但结构相关"的 文件给予更高 score。但也有 1 个 case 出现了 regression——CodeQL
    的 connected set 恰好包含了一个 misleading file（通过 utility function 间接连接），dataflow training

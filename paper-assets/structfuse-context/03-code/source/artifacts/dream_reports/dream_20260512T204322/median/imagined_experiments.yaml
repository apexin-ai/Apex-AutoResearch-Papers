- name: Embedding vs Random 深度分层分析
  plan_id: plan_005
  description: 按 repo size/complexity/domain 分层，分析 embedding negatives 何时最有害
  expected_results:
    harm_by_repo_size:
      small_lt50_delta_R5_pp: -2.1
      medium_50_200_delta_R5_pp: -6.8
      large_gt200_delta_R5_pp: -5.3
    harm_by_candidate_pool_diversity:
      low_diversity_delta_R5_pp: -7.2
      high_diversity_delta_R5_pp: -2.8
    harm_by_embedding_similarity_of_negatives:
      top10pct_most_similar_delta_R5_pp: -9.1
      bottom50pct_delta_R5_pp: -1.5
    correlation_neg_similarity_vs_harm: 0.71
  result_rationale: 'Embedding-distance negatives 的伤害机制是梯度冗余：当选中的 negatives 与 query
    的 embedding 高度相似时，对比 loss 的梯度方向与 encoder 已有的相似性判断高度对齐，导致"原地踏步"甚至 过拟合到 surface
    feature。这个效应在 medium-size repo（50-200 files）最强，因为这些 repo 的 candidate pool 大小适中（足够多的
    similar files 被选为 negatives），且文件间共享 更多命名约定和 import pattern（增加 surface similarity）。在
    small repo 中，candidate pool 太小，embedding-distance 和 random 选到的 negatives 高度重叠（池子就那么大），
    差异被稀释。在 large repo 中，虽然有很多 similar candidates，但 pool diversity 也更高， 部分缓解了冗余效应。关键发现是
    embedding 相似度与 harm 程度的相关系数 0.71——越相似的 negatives 越有害——这直接支持了"梯度冗余"假说。

    '

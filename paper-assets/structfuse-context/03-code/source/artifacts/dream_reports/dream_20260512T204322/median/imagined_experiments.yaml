  figures_description:
  - 'Bar chart with error bars: R@1, R@5, R@10 for three strategies, 3 seeds each.
    Random and dataflow bars nearly identical height, embedding-distance clearly lower.'
  - 'Training loss curves (3 strategies × 3 seeds): embedding-distance converges slower
    and to higher final loss.'
  - 'Per-seed scatter plot of R@5: shows dataflow and random seeds intermixed, embedding
    seeds clustered below.'
  analysis: '核心发现是非对称的：dataflow negatives 未能显著超越 random（p=0.42），但 embedding-distance
    negatives 显著低于 random（p=0.003）。这要求叙事重心从"dataflow wins"转向"embedding hurts"。Dataflow
    的无害性本身是一个有价值的结果——它证明结构化 negatives 不会引入噪声， 可以作为 embedding-distance 的安全替代方案。论文 Claim
    1 应降级为 viability claim。

    '
- name: M3a SWE-bench Lite End-to-End Evaluation
  plan_id: plan_003
  description: 3 strategies × best checkpoint, Qwen3.6-27B agent, 300 instances end-to-end
    patch generation + test
  expected_results:
    random_resolve_rate_pct: 28.3
    dataflow_resolve_rate_pct: 28.7
    emb_dist_resolve_rate_pct: 27.8
    resolve_delta_dataflow_vs_random_pp: 0.4
    resolve_delta_emb_vs_random_pp: -0.5
    random_retrieval_recall5_e2e: 0.805
    dataflow_retrieval_recall5_e2e: 0.811
    emb_dist_retrieval_recall5_e2e: 0.758
    avg_tokens_per_instance: 12400
    timeout_instances: 8
    total_eval_gpu_hours: 38
  result_rationale: 'SWE-bench Lite 的 resolve rate 主要受 LLM agent 能力约束，而非 retriever
    质量。 三种 retriever 的 R@5 差异在 5pp 以内，经过 Qwen3.6-27B 的 patch generation pipeline 后，检索质量差异被进一步稀释——agent
    会通过多轮 tool call 自行浏览代码弥补检索遗漏， 也会因 LLM 推理错误浪费正确检索结果。因此 resolve rate delta 被压缩到
    <1pp，远低于 统计显著性门槛。这符合 median 档位"retriever strategy alone shows no significant resolve
    rate gain"的预期。值得注意的是绝对 resolve rate ~28% 与 SWE-agent 等 baseline 在 Lite 上的表现大致可比，说明
    pipeline 本身工作正常。

    '

  why effect is encoder-dependent。

  BM25 neutral → 不能 claim CoCoHaNeRe 的 BM25 proxy 有害，改为 "mining strategy choice matters
  less than evaluation methodology"。

  Statistical framing：承认 3 seeds underpowered for <1pp effects，用 effect size + CI
  报告而非 p-value。

  '

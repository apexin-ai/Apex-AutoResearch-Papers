narrative_guidance: '切换到 Framing A：checkpoint selection criterion dominates mining
  strategy。

  主贡献重排：(1) 发现 checkpoint 选择标准对 reported performance 的影响（+10-16pp）远大于 mining strategy
  差异（<1pp），


    # Dream Review Report: Evaluation Methodology Dominates Mining Strategy


    **Paper**: "Evaluation Methodology Dominates Mining Strategy: A Systematic Study
    of Confounds in Contrastive Code Retrieval"

    **Review mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-16


    ---


    ## Panel Summary


    Two reviewers independently assessed this paper — R1 (Methods & Experiments) and
    R2 (Novelty & Related Work) — followed by a cross-sharing roundtable. Both converged
    on **Score 3 (Weak Reject)** with high confidence. The reviewers identified overlapping
    core concerns about the paper''s central framing, statistical support, and contribution
    significance.


    ---


    ## R1 Review: Methods & Experiments


    ### Strengths

    1. **Rigorous confound decomposition (Table 5).** Quantifying that pool size (14.2pp),
    data size (4.8pp), temperature (3.3pp), seed variance (2.7pp), and checkpoint
    criterion (2.7pp) each individually exceed the mining strategy effect (0.4pp)
    is a valuable empirical contribution.

    2. **Multi-seed design with honest uncertainty quantification.** Running 3 seeds
    per configuration, reporting cross-seed standard deviations, and providing power
    analysis (12 seeds needed for 80% power at 0.5pp) demonstrates methodological
    self-awareness.

    3. **Dual checkpoint protocol.** Showing the 2.7pp gap between best-by-val-loss
    vs best-by-R@1 (Table 7: 0.415 vs 0.442) is a concrete, actionable finding.

    4. **Pool size stability (Table 6).** The embed-random delta remaining stable
    (~0.4pp) across pool sizes 8–500 while absolute R@1 drops from 0.57 to 0.19 confirms
    the relative effect is not a pool-size artifact.

    5. **UniXcoder as boundary condition.** The complete null result (0.37pp max span)
    provides an informative negative finding about architecture/capacity requirements.


    ### Weaknesses

    1. **All statistical comparisons are non-significant.** Every CI includes zero
    (Table 13), all p > 0.05, Cohen''s d = 0.18 for the headline Qwen result. The
    paper cannot reject the null hypothesis that mining strategy has no effect, yet
    frames results as if it has demonstrated "methodology dominates."

    2. **Underpowered by design, then used strategically.** The paper acknowledges
    needing 12 seeds but runs only 3, then converts the resulting null into a narrative
    about confounds. An equally valid interpretation: the study simply lacks power
    to detect a real 0.4pp effect.

    3. **Dataflow strategy is not fairly compared.** Only 34% of instances have CodeQL
    structural data; the rest fall back to random. The dataflow strategy is effectively
    diluted by ~66% random noise. Fair comparison requires evaluating on the 34% stratum
    where structural data exists.

    4. **Temperature ablation is reduced and single-seed (s42 only).** The planned
    full ablation (all strategies × encoders × seeds) was not executed, undermining
    the robustness of strategy-ranking-preservation claims.

    5. **RepoBench-R validation is weak.** All CIs include zero on both encoders —
    this does not constitute external validation of any mining strategy effect.


    ### R1 Questions for Authors

    1. Given all CIs include zero and all p > 0.05, what is the precise evidence basis
    for Claim 1 ("methodology dominates mining strategy 40×")?

    2. Have you evaluated the dataflow strategy on the 34% stratum alone (head-to-head,
    same queries)?

    3. The static embedding negatives are computed from pretrained weights. How much
    does the embedding space shift after LoRA fine-tuning? Could "static staleness"
    explain the measured null?

    4. Table 9 shows non-monotonic delta at 11K (0.86pp > 0.55pp at 5K). Is this driven
    by a single seed?


    ### R1 Score: 3 (Weak Reject) | Confidence: 4/5


    ---


    ## R2 Review: Novelty & Related Work


    ### Strengths

    1. **Timely question.** The code retrieval community lacks standardized evaluation
    protocols; quantifying confounds has genuine practical value.

    2. **Multi-encoder design.** Testing on 3 architectures with distinct representation
    geometries reveals architecture-dependent effects, adding nuance beyond single-encoder
    studies.

    3. **Checkpoint criterion finding is genuinely surprising.** The divergence between
    checkpoint selection criteria is a concrete, actionable insight for practitioners.

    4. **Honest limitations acknowledgment.** The paper does not overclaim and appropriately
    frames the geometry hypothesis as exploratory.


    ### Weaknesses

    1. **The "40× ratio" framing is fundamentally misleading.** It compares the *range*
    of methodology-induced variation (varying multiple experimental axes simultaneously
    — pool size from 8 to 500, changing criteria, sweeping temperature) against the
    *delta between strategies under controlled conditions* (one variable). This is
    an apples-to-oranges comparison. If you varied learning rate by 10× or swapped
    the loss function, you would also get large variation — that would not be a meaningful
    finding about "methodology dominating."

    2. **Related work is unacceptably thin.** 8 references and 3 short paragraphs
    for a methodology paper. Missing: Voorhees 2000 (relevance judgment variation),
    Lin 2019 (neural IR reproducibility), Thakur et al. 2021 (BEIR cross-domain evaluation),
    DPR, RocketQA, curriculum learning literature. The paper claims to resolve "contradictory
    findings" without citing any specific contradictions.

    3. **"Contradictory findings" premise is asserted, not demonstrated.** The introduction
    claims the field produces contradictory results, but no specific paper-to-paper
    contradictions are cited. The paper''s motivation is ungrounded.

    4. **Novelty is limited.** That pool size, temperature, seed, and checkpoint selection
    affect IR metrics is well-established since Zobel 1998, Buckley & Voorhees 2004,
    Sakai 2006. The contribution reduces to measuring known confounds in the specific
    setting of code retrieval.

    5. **Geometry hypothesis lacks rigorous testing.** With only 3 encoders and no
    causal intervention (e.g., artificially inducing saturation in StarCoder, whitening
    Qwen representations), the hypothesis is post-hoc pattern matching, not a tested
    mechanism.

    6. **Generalizability is severely limited.** Single task (SWE-smith), single loss
    (InfoNCE), single K=7, code-domain only. No evidence the finding transfers to
    NL retrieval or other code benchmarks.


    ### R2 Questions for Authors

    1. Can you cite 2–3 specific papers with contradictory findings about hard negative
    mining for code retrieval?

    2. Would you agree the "40×" comparison is methodologically inappropriate, and
    if so, how would you reframe?

    3. Could the near-zero strategy delta reflect that your 4 strategies produce insufficiently
    different training signals, rather than that methodology generically dominates?

    4. How do you respond to the concern that this finding is tautological: "if you
    change the evaluation setup enough, evaluation changes more than a subtle training
    signal"?


    ### R2 Score: 3 (Weak Reject) | Confidence: 4/5


    ---


    ## Roundtable Discussion


    ### Step 2: Cross-Sharing


    Both reviewers read each other''s reviews and responded.


    ### Step 3: Points of Convergence


    1. **The "40× ratio" is the paper''s most prominent rhetorical move, and it is
    structurally flawed.** Both reviewers independently identify this as apples-to-oranges.
    R1 flagged it as potentially overstating; R2 named it as "fundamentally misleading."
    After cross-sharing, R1 agreed R2''s framing was sharper and endorsed this as
    a core issue.


    2. **The paper converts underpowered nulls into a strong claim.** R1 identified
    this as "underpowered by design, used strategically." R2 saw it as "non-significant
    result dressed as a strong claim." Both agree the study cannot simultaneously
    claim (a) the effect is too small to detect at n=3 and (b) methodology has been
    demonstrated to dominate.


    3. **Related work is inadequate.** Both agree 8 references is far too few for
    a methodology paper, and the "contradictory findings" premise is unsupported by
    cited evidence.


    4. **Checkpoint criterion finding has genuine practical value.** Both reviewers
    acknowledge this as the paper''s strongest concrete contribution, even if the
    broader framing is problematic.


    ### Points of Divergence


    1. **Table 5 decomposition rigor.** R1 accepts the table''s structure as a useful
    contribution while questioning the underlying data; R2 argues the structure itself
    is misleading because it presents a ratio of non-significant quantities.


    2. **Dataflow 34% coverage.** R1 views this as an experimental confound (unfair
    comparison requiring stratum-specific analysis); R2 views it as the strategy''s
    inherent practical limitation (informative about real-world utility). Both agree
    stratum-specific evaluation is needed.


    3. **Novelty floor.** R1 believes the checkpoint-criterion finding and confound
    quantification have genuine empirical value; R2 is more skeptical, arguing these
    are measurements of known phenomena in a new domain.


    ### Step 4: Consensus Assessment


    Both reviewers maintain **Score 3 (Weak Reject)** after roundtable, with increased
    confidence.


    ---


    ## Consolidated Assessment


    ### Overall Score: 3 / 6 (Weak Reject)


    ### Headline

    The paper identifies a real issue (evaluation confounds in code retrieval) and
    provides some useful quantitative evidence, but the central framing is structurally
    flawed, the study is underpowered for its own claims, and the contribution significance
    does not reach the bar for a top venue.


    ### Key Strengths (Consensus)

    1. Checkpoint criterion effect quantification (2.7pp gap) is concrete and actionable

    2. Multi-encoder design with honest uncertainty reporting

    3. Pool size stability analysis shows strategy delta is not a pool-size artifact

    4. Transparent acknowledgment of statistical limitations


    ### Key Weaknesses (Consensus)

    1. **Misleading "40×" framing** — compares multi-axis methodology range against
    single-axis strategy delta; not a valid comparison

    2. **Underpowered design weaponized** — 3 seeds when 12 needed; null results reframed
    as "methodology dominates" rather than "insufficient power"

    3. **All statistical comparisons non-significant** — every CI includes zero, all
    p > 0.05; the paper cannot reject the null that mining strategy has zero effect

    4. **Related work critically thin** — 8 references; "contradictory findings" premise
    unsubstantiated by citations

    5. **Limited novelty** — quantifying known IR confounds (pool size, seed, temperature)
    in code retrieval is incremental

    6. **Geometry hypothesis untested** — post-hoc observation on 3 encoders without
    causal intervention


    ### Recommendations for Improvement

    1. **Reframe the 40× claim.** Compare within-methodology-factor effect sizes (e.g.,
    seed variance 2.7pp vs strategy delta 0.4pp = 7×) rather than across-factor ranges.
    The 7× ratio is still meaningful but honest.

    2. **Expand related work substantially.** Cite 30+ references, including IR evaluation
    methodology (Voorhees, Lin, Thakur/BEIR), hard negative mining literature (DPR,
    RocketQA, ANCE, curriculum learning), and — critically — the specific contradictory
    findings the paper claims to explain.

    3. **Run additional seeds (≥8) under unified training regime.** The current 3-seed
    design with regime inconsistency cannot support any claim about effect sizes <
    2pp.

    4. **Evaluate dataflow on its applicable stratum.** Report performance on the
    34% of instances with structural data separately from the 66% random fallback.

    5. **Test generalizability.** Include at least one non-code retrieval domain or
    a second code retrieval task to support field-wide recommendations.

    6. **Test the geometry hypothesis.** Apply representation whitening or artificial
    saturation to validate the causal mechanism.


    ### Experiment Coverage Assessment

    The paper covers 14 of 16 planned experiments, which is good breadth. Missing:
    full temperature ablation (only single-seed reduced version executed) and dataflow-distance
    weighted negatives. The coverage is adequate but the depth of key experiments
    (multi-seed, consistent training regime) is insufficient for the precision of
    claims made.


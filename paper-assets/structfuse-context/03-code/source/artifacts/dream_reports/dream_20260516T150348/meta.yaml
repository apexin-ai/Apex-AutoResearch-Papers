focus: '重点关注：(1) D062 checkpoint selection criterion effect (+16.3pp) 作为核心方法论贡献的说服力；(2)
  当前双版本 framing (A: criterion dominates vs B: mining + methodology) 哪个更强；(3) UniXcoder
  null result 作为 architecture-scale boundary condition 的呈现方式；(4) 3 seeds 统计力度是否足够；(5)
  缺少 SWE-bench downstream eval（OOD failure R@1=0.04）的影响'
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: Embedding mining shows consistent positive effect across both decoder-only
        encoders; BM25 confirms CoCoHaNeRe correction; checkpoint criterion effect
        provides strong second contribution
      key_assumptions:
      - StarCoder remaining seeds (embed_s43, s44) recover to positive Δ, mean ≥+0.3pp
        (s42 was outlier due to early-stop artifact)
      - Qwen 3-seed mean embed-random Δ ≥ +0.8pp with all seeds non-negative
      - BM25 negatives clearly harm (Δ ≤ -1pp vs random), confirming CoCoHaNeRe artifact
        hypothesis
      - D062 checkpoint criterion effect (+16.3pp) replicates across encoders and
        seed pairs
      - RepoBench-R (plan_004) shows consistent strategy ranking with 95% CIs non-overlapping
        for embed vs random
      - UniXcoder null is cleanly attributable to model scale (125M saturates regardless
        of strategy)
      number_ranges:
        qwen_embed_vs_random_mean_R1_pp:
        - 0.8
        - 1.5
        starcoder_embed_vs_random_mean_R1_pp:
        - 0.3
        - 1.0
        bm25_vs_random_mean_R1_pp:
        - -3.0
        - -1.0
        checkpoint_criterion_effect_pp:
        - 12.0
        - 20.0
        repobench_embed_vs_random_R1_pp:
        - 0.5
        - 2.0
        cross_seed_std_within_strategy_pp:
        - 0.3
        - 1.5
        bootstrap_95ci_excludes_zero: true
      narrative_direction: 'Framing B 完全成立。Paper = systematic mining study + methodological
        contribution。 Claim 1: 简单 embedding mining 在两个 decoder-only encoder 上一致提供
        reliable zero-cost improvement。 Claim 2 (exploratory): dataflow 与 representation
        geometry 交互，UniXcoder null 作为 scale boundary condition 增强故事（"effect requires
        sufficient model capacity"）。 额外贡献：checkpoint selection criterion 作为独立 methodological
        finding (+16.3pp > mining effect)， 为社区提供 evaluation protocol 建议。BM25 harm
        验证 CoCoHaNeRe 修正叙事。 SWE-bench OOD failure 简要提及为 limitation（in-distribution
        retrieval ≠ cross-repo generalization）， RepoBench-R 替代作为 held-out evaluation。3
        seeds + bootstrap CI 足够支撑 claims。

        '
    median:
      tier: median
      meaning: Embedding mining effect exists but small and seed-dependent; BM25 neutral;
        criterion effect is main robust finding; need narrative pivot to methodology-first
        framing
      key_assumptions:
      - Qwen 3-seed mean embed-random Δ = +0.3–0.8pp，但 95% CI 下界接近零或轻微包含零
      - StarCoder embed mean Δ 在 -0.2 to +0.3pp，不显著（s42 negative confirmed by pattern）
      - BM25 ≈ random（Δ within ±0.5pp）— CoCoHaNeRe narrative pivot needed
      - D062 checkpoint criterion effect robust（+10–16pp），成为 paper 最强贡献
      - RepoBench-R shows directional consistency but CIs overlap
      - UniXcoder null + StarCoder weak = 'effect is encoder-specific, not universal'
      - 3 seeds 对 <1pp effect 统计力度不足，reviewer 会质疑
      number_ranges:
        qwen_embed_vs_random_mean_R1_pp:
        - 0.3
        - 0.8
        starcoder_embed_vs_random_mean_R1_pp:
        - -0.2
        - 0.3
        bm25_vs_random_mean_R1_pp:
        - -0.5
        - 0.5
        checkpoint_criterion_effect_pp:
        - 10.0
        - 16.0
        repobench_embed_vs_random_R1_pp:
        - 0.0
        - 0.8
        cross_seed_std_within_strategy_pp:
        - 1.5
        - 3.0
        bootstrap_95ci_excludes_zero: false
      narrative_direction: '切换到 Framing A：checkpoint selection criterion dominates
        mining strategy。 主贡献重排：(1) 发现 checkpoint 选择标准对 reported performance 的影响（+10-16pp）远大于
        mining strategy 差异（<1pp）， 揭示领域内 evaluation methodology 系统性问题；(2) 在此框架下，embedding
        mining 作为 controlled experiment 的一个 condition， 在 Qwen 上有 marginal positive
        signal，但非 universal；(3) representation geometry 分析解释 why effect is encoder-dependent。
        Claims 调整：将 "reliable improvement" 弱化为 "conditional improvement on saturated-geometry
        encoders"。 UniXcoder null + StarCoder weak 不再是 limitation 而是 evidence for
        geometry hypothesis。 BM25 neutral → 不能 claim CoCoHaNeRe 的 BM25 proxy 有害，改为
        "mining strategy choice matters less than evaluation methodology"。 SWE-bench
        完全不提。RepoBench-R 作为 supplementary validation。 温度消融（plan_021）变为 must-have 来排除
        regime-specificity。 Statistical framing：承认 3 seeds underpowered for <1pp effects，用
        effect size + CI 报告而非 p-value。

        '
    worst:
      tier: worst
      meaning: Mining strategy effect indistinguishable from noise at full scale;
        only checkpoint criterion effect survives as contribution; complete reframe
        required
      key_assumptions:
      - Qwen embed-random mean Δ < +0.3pp，95% CI 宽且包含零（seed variance > effect）
      - StarCoder embed consistently ≤ random（mean Δ ≤ 0pp），反驳 pilot pattern
      - BM25 ≈ random 或 BM25 slightly positive → CoCoHaNeRe narrative 完全失效
      - RepoBench-R 无法区分策略（pool size 效应吞没 strategy effect）
      - Plan_019 pool sensitivity 显示 pool>100 时 strategy ranking 反转或消失
      - UniXcoder + StarCoder + Qwen large variance = 'no evidence mining strategy
        matters at this scale'
      - D062 checkpoint criterion effect 仍然 robust（唯一幸存发现）
      - SWE-bench OOD failure + 无外部验证 = reviewer concern 无法化解
      number_ranges:
        qwen_embed_vs_random_mean_R1_pp:
        - -0.3
        - 0.3
        starcoder_embed_vs_random_mean_R1_pp:
        - -1.0
        - 0.0
        bm25_vs_random_mean_R1_pp:
        - -0.3
        - 0.5
        checkpoint_criterion_effect_pp:
        - 10.0
        - 18.0
        repobench_embed_vs_random_R1_pp:
        - -0.5
        - 0.5
        cross_seed_std_within_strategy_pp:
        - 2.0
        - 5.0
        bootstrap_95ci_excludes_zero: false
      narrative_direction: '完全 reframe。两个候选方向（仍冲 EMNLP Main）： 方向 1 — "Checkpoint Selection
        Criterion Matters More Than Mining Strategy for Code Retrieval"： 核心贡献变为 methodological
        finding — 在 controlled 3-strategy × 3-seed × 3-encoder 实验中， checkpoint 选择标准（R@1
        vs val_loss）造成 +10-18pp 报告差异，而 mining strategy 贡献 <0.3pp。 这是对 contrastive
        code retrieval 社区的 evaluation methodology warning。 Supporting evidence: representation
        geometry 分析解释 why strategies fail to differentiate（ decoder-only encoders
        的 pretrained geometry 已经足够好，hard mining 无法 further improve）。 方向 2 — "Why Hard
        Negative Mining Doesn''t Scale for Code Retrieval: A Negative Result Study"：
        Pilot → full scale degradation pattern 本身作为贡献。分析 scale-dependent factors：
        (a) full-scale random baseline 更强（更多 naturally hard negatives）； (b) pretrained
        decoder-only encoders 的 representation quality 使 mining signal marginal； (c)
        seed variance at this effect size 使 reported gains unreliable。 两个方向都保留 CodeQL
        pipeline 作为 practical contribution + geometry analysis 作为 explanatory tool。
        UniXcoder null 成为 corroborating evidence。SWE-bench 不提。 必须额外做：(a) 更多 seeds（5-10）确认
        null；(b) scaling analysis（data size vs effect）；(c) 与 1-2 个 published mining
        paper 做 reproduction attempt 验证其 claims 在我们 setting 下也不 hold。'

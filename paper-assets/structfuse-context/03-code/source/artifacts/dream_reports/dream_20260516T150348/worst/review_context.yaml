narrative_guidance: "Mining strategy effect indistinguishable from noise at full scale.\
  \ Cross-seed variance (2-5pp) is 4-10x larger than within-seed strategy delta (<0.5pp).\
  \ No strategy reliably outperforms random across encoders. Only surviving contribution:\
  \ checkpoint selection criterion (R@1 vs val_loss) causes 10-18pp reported performance\
  \ variation, dwarfing any mining strategy effect.\n\n完全 reframe 为以下两个方向之一（仍冲 EMNLP\
  \ Main）：\n方向 1 — \"Checkpoint Selection Criterion Matters More Than Mining Strategy\
  \ for Code Retrieval\"\n  核心贡献 = methodological finding：在 controlled 4-strategy\
  \ × 3-seed × 3-encoder 实验中，checkpoint 选择标准造成 +10-18pp 报告差异，mining strategy 贡献 <0.5pp。Evaluation\
  \ methodology warning for contrastive code retrieval community。\n方向 2 — \"Why Hard\
  \ Negative Mining Doesn't Scale for Code Retrieval: A Negative Result Study\"\n\
  \  Pilot → full scale degradation pattern 本身作为贡献：(a) full-scale random baseline\
  \ 更强（naturally hard negatives 更多）；(b) pretrained decoder-only encoder 的 representation\
  \ quality 使 mining signal marginal；(c) 3 seeds × 3 encoders 均确认 null。\n\n必须额外做：(a)\
  \ 5-10 seeds 确认 null；(b) data size scaling analysis（1K vs 3K vs 5K vs 11K）；(c) 1-2\
  \ 个 published mining paper 的 reproduction attempt。\n\nBM25 ≈ random 使 CoCoHaNeRe\
  \ 纠正叙事失效 — 既无法说 BM25 害人，也无法说 embedding 救人。整个 mining strategy 维度在此 scale 下坍缩为 noise。\n\
  \nCodeQL pipeline 保留为 practical contribution + representation geometry analysis\
  \ 保留为 explanatory tool（解释 WHY strategies fail to differentiate）。UniXcoder null 成为\
  \ corroborating evidence。SWE-bench 不提（OOD failure，R@1=0.04）。\n"

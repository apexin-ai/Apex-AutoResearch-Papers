      hardness proxy 本身的有效性——weighted 版本在一个无效信号上做更精细的选择， 不改变根本问题； (2) 距离信息 noisy——CodeQL
      的 dataflow path 是 approximation，real shortest path 与 estimated path 的相关性仅 ~0.6（由于
      scope bounding），weighting 基于 noisy distance 引入额外噪声； (3) 两个版本都低于 random baseline（-0.6pp），进一步确认结构信号无效。


focus: D024 重写后的新 framing：论文从 "method paper (dataflow > all)" 转为 "systematic analysis
  + mechanistic insight"。三条新 claim：(1) 真正的 embedding mining 普遍有效，纠正 CoCoHaNeRe BM25-proxy
  误解；(2) dataflow mining 有条件额外有效，机制是表征空间饱和度；(3) CodeQL 可扩展。已有实证：Qwen R@1=55.3%, StarCoder
  R@1=45.4%, neg_difficulty margin +17%/+28%, 两编码器 step 1000 过拟合。Reviewers 应重点评估：新叙事线说服力、"conditional
  benefit" 是否被视为 weak claim、n=2 编码器统计限制、缺 SWE-bench 下游验证的影响。
review_mode: full
review_visible: true
writing_visible: true
what_if: []
tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 9-seed 全量复现 pilot 模式，embedding 和 dataflow 各自角色均统计显著，机制故事完整成立
      key_assumptions:
      - embedding > random 在两个编码器上均 95% CI 不含零
      - dataflow > random 在 Qwen（饱和空间）上 95% CI 不含零，StarCoder 上无显著差异 → 干净的交互效应
      - SWE-bench Lite 下游验证显示 resolve rate 有可观测提升
      - 9-seed 方差可控（同策略种子间 R@1 标准差 < 1.5pp）
      - step 1000 过拟合问题通过 early stopping 可控，不影响结论
      number_ranges:
        qwen_embed_vs_random_R1_pp:
        - 1.5
        - 3.0
        starcoder_embed_vs_random_R1_pp:
        - 1.0
        - 2.5
        qwen_dataflow_vs_random_R1_pp:
        - 0.8
        - 2.5
        starcoder_dataflow_vs_random_R1_pp:
        - -1.0
        - 0.3
        best_qwen_mean_R1:
        - 0.54
        - 0.58
        best_starcoder_mean_R1:
        - 0.46
        - 0.52
        swebench_resolve_delta_pp:
        - 2.0
        - 5.0
        embed_benefit_bootstrap_p:
        - 0.001
        - 0.05

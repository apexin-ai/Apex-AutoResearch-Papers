      vs disconnected 的 distinction 捕获了主要信号）。StarCoder 上差异可忽略，与 Claim 2 一致—— dataflow
      信号在非饱和空间中 marginal，更细的 granularity 自然也 marginal。 总体结论：binary 足够，weighted 是 diminishing
      return。


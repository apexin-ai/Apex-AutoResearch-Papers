        - 0.5
        - 1.5
      narrative_direction: '三条 claim 原样保留。论文叙事：(1) 纠正 CoCoHaNeRe 误解——真正 embedding
        mining 普遍有效， prior work 的 BM25-proxy 是 artifact；(2) dataflow 提供条件性额外收益，机制通过表征饱和度
        定量解释，neg_difficulty margin 分析提供 mechanistic evidence；(3) CodeQL 可扩展。 SWE-bench
        下游验证补齐最后一块拼图。Framing 为 "systematic analysis + mechanistic insight"， EMNLP
        Main 定位清晰，三个贡献互相独立且互补。

        '
    median:
      tier: median
      meaning: embedding benefit 可复现但效果量缩水或统计边缘，dataflow 交互效应方向正确但不显著，缺下游验证
      key_assumptions:
      - embedding > random 方向一致但至少一个编码器 95% CI 包含零（如 StarCoder Δ 缩至 +0.5–1.0pp）
      - dataflow > random 在 Qwen 上方向正确但 CI 包含零（Δ ~+0.3–0.8pp）
      - 种子间方差较大（R@1 标准差 1.5–3.0pp），削弱统计力度
      - SWE-bench 未完成或 Δ ≤ 1pp（无法宣称下游收益）
      - representation saturation 故事定性成立，但 n=2 编码器不足以做强因果推断

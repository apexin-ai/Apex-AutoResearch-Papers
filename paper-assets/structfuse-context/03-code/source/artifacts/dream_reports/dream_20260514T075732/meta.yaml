        - 0.52
        - 0.55
        best_starcoder_mean_R1:
        - 0.44
        - 0.48
        swebench_resolve_delta_pp:
        - -0.5
        - 1.0
        embed_benefit_bootstrap_p:
        - 0.05
        - 0.2
        cross_seed_R1_std:
        - 1.5
        - 3.0
      narrative_direction: 'Claim 1 降级为 "directional evidence correcting misconception"——embedding
        mining 不会 harm（纠正 CoCoHaNeRe），但绝对增益需要更多编码器验证。Claim 2 从 "conditional benefit"
        降级为 "exploratory observation"——saturation 机制作为 hypothesis 提出，neg_difficulty
        分析作为 supporting evidence 而非 proof。删除 "consistently improves" 措辞，替换为 "tends
        to improve"。 补充 temperature ablation（plan_014）证明发现非 regime-specific。论文重心从
        "three claims" 转为 "systematic methodology + preliminary mechanistic hypothesis"，强调方法论贡献
        （controlled comparison framework）而非效果量。仍投 EMNLP Main，定位为 analysis paper。

        '
    worst:
      tier: worst
      meaning: full-scale 多种子结果未复现 pilot pattern——embedding benefit 消失或反转，核心假设不成立
      key_assumptions:
      - embedding vs random Δ 在至少一个编码器上为负或 < 0.3pp（pilot 的 +2.0pp 是种子/数据噪声）
      - dataflow benefit 在所有条件下消失
      - full-scale 数据分布与 pilot 存在系统性差异（覆盖率、难度分布变化）
      - representation saturation 故事无法解释 full-scale 结果——机制假设被反驳或不完整
      - SWE-bench 无差异或不可行

    plan_id: plan_003
    description: 3 strategies × best checkpoint on SWE-bench Lite (300), Qwen3.6-27B
      agent, 测 resolve rate
    expected_results:
      random_resolve_rate: 0.227
      embedding_distance_resolve_rate: 0.25
      dataflow_aware_resolve_rate: 0.26
      embed_vs_random_delta_pp: 2.3
      dataflow_vs_random_delta_pp: 3.3
      dataflow_vs_embed_delta_pp: 1.0
      total_instances: 300
      instances_resolved_random: 68
      instances_resolved_embed: 75
      instances_resolved_dataflow: 78
      retrieval_recall1_random: 0.533
      retrieval_recall1_embed: 0.556
      retrieval_recall1_dataflow: 0.548
    result_rationale: 'best 档下 retrieval 质量提升能传导到下游 resolve rate。Qwen best checkpoint
      embedding R@1≈0.556 vs random 0.533， 差值 2.3pp 在 300 实例上对应约 7 个额外正确 retrieval
      → 其中部分转化为 resolve。 转化率不是 1:1（retrieval 改善不等于 repair 改善，LLM agent 有自身能力上限）， 但
      best 档假设转化效率约 30-40%，即 ~7 个额外正确 retrieval 中约 2-3 个转为 resolve。 Dataflow 在 Qwen
      上的条件性收益（pilot +0.8pp R@1）进一步贡献约 1pp resolve delta。 总体 swebench_resolve_delta_pp
      落在 [2.0, 5.0] 范围的中低段， 因为 retrieval → repair 的衰减是系统性的。SWE-bench Lite 300 实例规模下，
      2-3pp 差异虽小但在 best 档下 bootstrap CI 可检测。


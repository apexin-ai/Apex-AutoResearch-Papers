        - 0.5
        embed_benefit_bootstrap_p:
        - 0.2
        - 1.0
        cross_seed_R1_std:
        - 2.5
        - 5.0
      narrative_direction: '原始三条 claim 全部不成立，需完全 reframe。新角度：(1) "Why Hard Negative
        Mining Doesn''t Generalize for Code Retrieval"——negative result paper，论证 pilot-scale
        结论不可靠， small-scale 评估是领域普遍问题（CoCoHaNeRe 的错也是我们 pilot 的错）；(2) 表征几何分析 作为独立贡献——不用于解释策略差异（因为差异不存在），而用于诊断编码器质量和预测训练难度，
        提出 "representation saturation index" 作为通用工具；(3) CodeQL pipeline 作为开源 infrastructure
        贡献（claim 3 不受影响）。论文标题改为 "A Cautionary Tale: Scale, Seeds, and the Fragility
        of Hard Negative Mining for Code Retrieval"。仍投 EMNLP Main—— negative result
        + methodological contribution 是 EMNLP 接受的论文类型。需要先排查 data pipeline bug（full-scale
        数据分布是否变化），确认是真实 negative result 而非工程错误。'

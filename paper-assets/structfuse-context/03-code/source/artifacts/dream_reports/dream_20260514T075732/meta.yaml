      bug——在小规模下 embedding mining 确实有效； (2) 随数据量增长，benefit 单调递减（斜率≈-0.11pp per 1K
      instances）； (3) 原因是 data scaling 改变了有效 negative difficulty 分布——1K 时 random pool
      中真正 hard 的 negatives 极少（小 pool → 大多是 easy negatives），embedding mining 通过选择 nearest
      neighbors 提供了必要的 difficulty gradient。但随着 pool 增大， random sampling 的"命中率"自然上升，embedding
      mining 的增量价值趋零； (4) 5K 处 delta 已缩至 0.1pp（不显著），15K 处反转为 -0.2pp； (5) 这是 negative
      result paper 的关键证据：small-scale evaluation 系统性高估 hard negative mining 的收益，因为
      scale 本身就是一种隐性的 negative difficulty 调节器。

      '

    df_minus_random_delta_pp: 0.3
    df_minus_random_CI:
    - -3.8
    - 4.4
    df_minus_random_p_value: 0.78
    any_comparison_significant: false
  result_rationale: 'N=300 binary outcomes（resolve/not-resolve）的 bootstrap CI 很宽：individual
    strategy 的 CI width ~9.5pp，paired delta 的 CI width ~7.7pp。这是因为 binary outcome
    的 variance 最大（Bernoulli variance = p(1-p) ≈ 0.18），300 instances 给出的 standard error
    ≈ sqrt(0.18/300) ≈ 0.024 = 2.4pp，95% CI ≈ ±4.7pp。 在 delta < 1pp 的情况下，不可能 achieve
    significance。这是 fundamental power limitation，不是方法问题。Even with 3000 instances (full
    SWE-bench)，delta 0.7pp 仍需要 N > 15000 才能 detect with 80% power。


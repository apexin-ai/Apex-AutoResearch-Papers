  result_rationale: 'Repo size 分层：小 repo 的 pool 小、diversity 低，embedding mining 更容易找到有意义
    的 hard negatives，所以 delta 最大。大 repo 中 pool 大但 noise 也大（更多 unrelated files），embedding
    mining 优势被稀释。Pool size 分层与 repo size 部分共线但不完全： pool < 10 时 all strategies 接近 ceiling
    所以 delta 小；pool 10-50 是 sweet spot； pool 50+ 时 noise 增加。Query-pos similarity 分层：high
    sim (> 0.98，Qwen 主导) 表明 representation 已饱和，embedding negatives 不够 hard，delta 小；medium
    sim 区间 embedding mining 最 effective。Structural availability 分层：34% 有 dataflow
    数据的 instances 上 dataflow strategy 有 +0.6pp 优势（真正用到了 structural signal）， 但 66%
    fallback instances 上 dataflow ≈ random（因为 fallback 到 random sampling）， 整体被 dilute。Neg
    difficulty quartile：Q4（最难 negatives）时 embedding 和 dataflow 都 help 最多，因为这些 cases
    正是模型最 confuse 的地方，harder negatives 提供最大 gradient signal。但 Q1-Q2 占比大，dilute 了整体
    effect。


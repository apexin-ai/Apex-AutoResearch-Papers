- name: Temperature Ablation
  plan_id: plan_014
  description: τ ∈ {0.05, 0.1, 0.2} × 3 strategies × 2 encoders
  expected_results:
    qwen:
      tau_005:
        random_R1: 0.53
        embedding_R1: 0.54
        dataflow_R1: 0.532
        emb_delta_pp: 1.0
      tau_010:
        random_R1: 0.537
        embedding_R1: 0.545
        dataflow_R1: 0.537
        emb_delta_pp: 0.8
      tau_020:
        random_R1: 0.521
        embedding_R1: 0.526
        dataflow_R1: 0.52
        emb_delta_pp: 0.5
    starcoder:
      tau_005:
        random_R1: 0.443
        embedding_R1: 0.45
        dataflow_R1: 0.437
        emb_delta_pp: 0.7
      tau_010:
        random_R1: 0.451
        embedding_R1: 0.457
        dataflow_R1: 0.446
        emb_delta_pp: 0.6
      tau_020:
        random_R1: 0.435
        embedding_R1: 0.438
        dataflow_R1: 0.43
        emb_delta_pp: 0.3
    optimal_tau: 0.1
    strategy_ranking_preserved_across_tau: true
    delta_shrinks_at_high_tau: true
  result_rationale: 'τ=0.05（当前默认）可能过低：contrastive loss 的 gradient 过于 sharp，模型对 hard
    negatives 过度 sensitive，导致 overfitting（plan_002 中 step 500 后即 overfit）。 τ=0.1 在
    median 档下反而略好：gradient 更 smooth，模型更 robust，absolute R@1 比 τ=0.05 高 ~0.7pp（Qwen）和
    ~0.8pp（StarCoder）。但 strategy delta 在 τ=0.1 时略小（0.8pp vs 1.0pp Qwen），因为 smoother
    gradient 也 smooth 掉了 hard negative 的 extra signal。τ=0.2 过高：loss landscape 太 flat，training
    signal 不足， all strategies 退化。关键发现：strategy ranking（embedding > random ≥ dataflow）
    在所有 τ 下保持一致，说明 finding 不是 regime-specific。但 delta 随 τ 增大而 缩小，表明在 optimal τ 下 effect
    size 可能更小。这是 median 档的典型 pattern： finding 方向 robust 但 magnitude 依赖 hyperparameter。


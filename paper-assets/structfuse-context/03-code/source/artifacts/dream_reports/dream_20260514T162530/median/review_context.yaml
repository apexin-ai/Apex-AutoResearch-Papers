    negatives 的 selection 方式 fundamentally 不同。BM25 top-k 主要 capture keyword overlap
    （function names, import statements），这些 "negatives" 中很多实际上是 semantically related（可能包含
    false negatives / actual positives mislabeled as negatives）， 导致 noisy training
    signal。在 median 档下，BM25 harm 方向正确（-0.9pp Qwen, -0.7pp StarCoder），但 delta 小于 CoCoHaNeRe
    报告的 -27pp。原因：(1) 我们的 training pipeline 更 robust（proper temperature, early stopping），(2)

narrative_guidance: 'Claim 1 降级为 "tends to help"：embedding mining 方向正确但 effect size
  缩水约 50%， 多 seed CI 宽（2–4pp），个别 seed delta < 0.5pp。BM25 baseline 方向一致（harm）但 delta
  小且 p > 0.05，CoCoHaNeRe correction 论证从 "empirically verified" 改为 "BM25 proxy 方向一致但
  effect size 不足以排除混杂"。Claim 2 降级为 exploratory observation：dataflow 在 Qwen 上 CI 包含
  0，StarCoder 上方向为负，合并进 Claim 1 作为 strategy-encoder interaction case。SWE-bench delta
  < 1pp 且 CI 包含 0， 无法作为独立 evidence。论文重心移向 systematic empirical comparison + representation
  geometry analysis。标题用 "Systematic Study"，定位 analysis paper。

  '

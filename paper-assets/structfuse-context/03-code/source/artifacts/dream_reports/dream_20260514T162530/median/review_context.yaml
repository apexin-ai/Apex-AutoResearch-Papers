    pool 但引入 semantically distant files（3-hop 以外的 files 很可能本来就和 query 无关），负 signal
    质量下降，反而略差于 2-hop。但三者 差异均 < 0.5pp，在 noise range 内，不构成 strong ablation signal。这也反映了
    median 档下 dataflow strategy 本身 effect size 就小，hop-count 作为 second-order effect

    from stable ranking at pool ≤ 100 to unstable at pool ≥ 200.'
  analysis: Pool size sensitivity 是 median 档下最重要的 external validity check。结果显示 embedding
    mining 优势 real 但 diminishing with pool size。论文需要 honestly discuss：(1) pool=50
    是 validation setup，real-world repo pool 通常 200-1000+， (2) at realistic pool sizes
    the advantage shrinks to ~0.5pp。这强化了 "systematic study" 而非 "strong method contribution"
    的 positioning。建议在 main paper 中报告 pool=50 和 pool=200 的双 benchmark，并在 limitation
    中讨论 pool=500 的 convergence。

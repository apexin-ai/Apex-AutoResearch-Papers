      effect provides the mechanistic story: hard negative mining helps at small scale
      but its advantage vanishes as random sampling catches up. This connects to the
      representation geometry analysis: at small scale, random negatives are too easy
      (high margin) and the encoder doesn''t learn the decision boundary well. As
      scale increases, random negatives include enough hard examples by chance. This
      reframes the negative result as a positive finding: "scale is a substitute for
      curation in contrastive code retrieval." Actionable takeaway: if your training
      set is small (<2K), invest in mining; if large (>5K), random suffices.


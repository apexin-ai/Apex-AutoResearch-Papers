    description: '3 strategies × best Qwen checkpoint, Qwen3.6-27B agent, 300 SWE-bench
      Lite instances. Retriever 提供 top-k context files，agent 生成 patch，评估 resolve rate。

      '
    expected_results:
      random_resolve_rate: 0.22
      random_resolved_count: 66
      embedding_resolve_rate: 0.245
      embedding_resolved_count: 73
      dataflow_resolve_rate: 0.252

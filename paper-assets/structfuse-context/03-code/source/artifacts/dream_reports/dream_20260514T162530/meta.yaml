    # Dream Review Report: StructFuse-Context


    **Paper:** "What Makes Hard Negatives Work for Code Retrieval? A Systematic Study
    of Mining Strategies and Representation Geometry"

    **Dream ID:** 20260514T162530

    **Review Mode:** Full (2 Reviewers, 4-Step Roundtable)

    **Date:** 2026-05-14


    ---


    ## Overall Assessment


    **Consensus Score: 4/6 (Weak Accept)**


    R1 (Methods & Experiments): 4/6 → 4/6 after cross-review (maintained, but noted
    would lean 3/6 if n=2 limitation unaddressed)

    R2 (Novelty & Related Work): 4/6 → 3.5/6 after cross-review (downgraded due to
    implementation confounds identified by R1)


    The paper asks an important question, executes a more systematic comparison than
    any prior work in code retrieval negative mining, and provides a genuinely useful
    correction of the CoCoHaNeRe BM25-proxy confusion. The representation geometry
    analysis adds intellectual depth beyond pure metric comparisons. However, the
    paper''s causal and mechanistic claims rest on insufficiently controlled comparisons
    (n=2 encoders, learnable temperature confound, pos_weight asymmetry, 66% fallback
    dilution), and effect sizes are small enough that unresolved confounds could explain
    the observed deltas.


    ---


    ## Step 1: Independent Reviews


    ### R1 (Methods & Experiments) — Score: 4/6, Soundness: 3/5, Confidence: 4/5


    **Strengths:**

    - S1: 9-seed replication with 95% CIs is well above community norm (typically
    3-5 seeds)

    - S2: Comprehensive ablation battery (Tables 8-15) covering temperature, hop depth,
    data scaling, fusion head, pool size, static/dynamic mining, weighted/binary dataflow,
    failure analysis

    - S3: Dual-benchmark consistency (SWE-smith + RepoBench-R) with consistent strategy
    orderings

    - S4: Honest conditional framing of Claim 2 — dataflow benefit not overclaimed

    - S5: Representation geometry analysis via neg difficulty quartiles adds mechanistic
    explanatory depth (Q1→Q4 monotonic scaling)

    - S6: Correcting CoCoHaNeRe''s BM25-proxy conflation is a service to the community


    **Weaknesses:**

    - W1: **66% fallback dilution confound.** The dataflow strategy has structural
    data for only 34% of instances; the rest fall back to embedding/random. The "dataflow"
    condition is actually a *mixture* of strategies, making the reported +1.0pp (Qwen)
    a diluted signal. Table 1 reports this mixture as the headline rather than the
    stratified +2.8pp.

    - W2: **n=2 encoders insufficient for interaction claim.** The mechanistic story
    (representation saturation mediates dataflow benefit) is inferred from exactly
    2 data points. Any two-encoder comparison yields some difference; post-hoc explanation
    is always available.

    - W3: **Learnable temperature confound.** The model has a learnable `log_temperature`
    parameter. Different strategies may converge to different temperatures, confounding
    the comparison. The temperature ablation (Table 8) fixes initial temperature but
    does not report learned values.

    - W4: **Positive weight by dataflow distance.** `pos_weight = exp(-alpha * dist)`
    means the dataflow strategy differs from others in both negatives AND positive
    weighting — two confounded factors.

    - W5: **Pool=50 in main experiments is unrealistically small.** Table 12 shows
    stability at pool=500, but headline metrics at pool=50 inflate absolute R@1 and
    may inflate deltas.

    - W6: **SWE-bench Lite evaluation gaps.** Only 300 instances with single agent
    model. Bootstrap CIs are wide (~3.6pp). Dataflow-vs-embedding not significant
    (p=0.134).

    - W7: **Static mining confound** partially addressed by Table 13 ablation (negligible
    difference), but ablation may be underpowered.

    - W8: **BM25 baseline completeness.** Claim 1''s strength depends entirely on
    BM25 performing distinctly worse than random.

    - W9: **Checkpoint selection criterion ambiguity.** Internal records flag that
    rankings change depending on best-val-loss vs best-R@1.


    **Key Questions for Authors:**

    - Q1: What learned temperature values did each strategy converge to across 9 seeds?

    - Q2: Was the actual SWE-bench harness used for test execution?

    - Q3: Is stratified analysis (Table 6) computed on matched instance sets across
    all strategies?

    - Q4: Were any of the 9 seeds discarded?

    - Q5: What is `pos_weight` for the random strategy? If `pos_dataflow_distance`
    defaults to 1.0, then `pos_weight = exp(-1.0) = 0.37` for all random samples —
    is this intentional?


    ---


    ### R2 (Novelty & Related Work) — Score: 4/6, Novelty: 3/5, Confidence: 4/5


    **Strengths:**

    - S1: CoCoHaNeRe correction is the strongest and most novel claim — the BM25 <
    random < embedding ordering is a clean corrective finding

    - S2: Claims are unusually well-calibrated to evidence (conditional framing, explicit
    limitations)

    - S3: Ablation suite establishes rankings never reverse across any condition tested

    - S4: Representation geometry analysis provides testable prediction for practitioners
    (check pos_sim before choosing strategy)

    - S5: SWE-bench downstream evaluation with bootstrap significance connects retrieval
    improvements to practical impact


    **Weaknesses:**

    - W1: **Moderate novelty.** Combines existing tools (ANCE-style mining, CodeQL,
    LoRA) in a new context. The "systematic study" contribution is valued but inherently
    lower novelty than a new method.

    - W2: **n=2 encoders cannot identify the mechanism** behind encoder-strategy interaction.
    pos_sim saturation is plausible but confounded with architecture, pretraining
    data, tokenizer, and training objective differences.

    - W3: **Small effect sizes throughout.** +2.0pp R@1 is within the range sensitive
    to implementation details (learning rate, number of negatives, sequence length)
    that are not ablated.

    - W4: **Dataflow fails on 50% of encoders tested.** The universal finding is "use
    embedding mining," which is ANCE (2021) applied to code — not novel.

    - W5: **CoCoHaNeRe "mislabeling" claim needs stronger evidence.** Specific citations
    or code references from CoCoHaNeRe showing BM25 proxy usage are required. Without
    them, soften from "correcting misconception" to "we observe different results
    under controlled conditions."

    - W6: **Missing baselines.** No comparison with cross-encoder reranking, curriculum-based
    mining, in-batch negatives, or existing systems (SweRank, SWE-Fixer) on the same
    benchmark.

    - W7: **34% structural coverage is a significant practical limitation.** For 66%
    of instances, dataflow adds nothing. Practical recommendation reduces to "use
    embedding mining."


    **Detailed Novelty Assessment:**

    - Claim 1 (CoCoHaNeRe correction): Significance 4/5, Novelty 3/5

    - Claim 2 (Structure-grounded negatives): Significance 3/5, Novelty 3.5/5

    - Claim 3 (Representation geometry): Significance 3/5, Novelty 2.5/5


    **Related Work Gaps:**

    - DPR (Karpukhin et al., 2020) deserves more than passing mention

    - ContraCode (Ding et al., ACL Findings 2022) is absent

    - NL retrieval hard negative literature (RocketQA, TAS-B, GPL) should be connected

    - SweRank/SWE-Fixer training methodology comparison would contextualize

    - GraphCodeBERT''s dataflow-in-pretraining vs negative-mining distinction deserves
    deeper analysis


    ---


    ## Step 2-3: Cross-Review & Convergence


    ### Points of Agreement (Both Reviewers)


    1. **n=2 encoders is the most damaging limitation.** Both reviewers independently
    flagged this. The encoder-strategy interaction claim (Claim 2) cannot be supported
    with 2 data points regardless of how many seeds are run per configuration. This
    should be explicitly reframed as hypothesis-generating.


    2. **Dataflow strategy fragility.** Converging from two angles: R1''s "66% fallback
    makes it a mixture strategy" and R2''s "fails on 50% of encoders tested." The
    structure-grounded negative contribution is the paper''s claimed novelty, but
    it is the weakest of the three claims empirically.


    3. **Small effect sizes with unresolved confounds.** +1.6-2.0pp R@1 deltas are
    statistically significant with 9 seeds but practically marginal. Combined with
    learnable temperature confound (R1-W3), pos_weight asymmetry (R1-W4), and other
    uncontrolled factors, the causal attribution to mining strategy alone is not airtight.


    4. **CoCoHaNeRe correction is the paper''s strongest contribution** but needs
    ironclad documentation of the BM25-proxy claim.


    5. **Paper is well-executed within its scope** — honest framing, extensive ablations,
    good statistical practice. The issue is scope, not execution quality.


    ### Points of Divergence


    1. **Novelty weighting.** R1 is more forgiving of "systematic study" contributions;
    R2 weighs novelty more heavily and notes the universal recommendation ("use embedding
    mining") is essentially ANCE for code.


    2. **Score after cross-review.** R1 maintains 4/6; R2 drops to ~3.5/6 after learning
    about the learnable temperature and pos_weight confounds from R1. These implementation-level
    concerns shifted R2''s assessment of experimental soundness.


    ---


    ## Step 4: Consolidated Recommendations


    ### For Authors (Revision Priorities)


    **Critical (must address):**

    1. **Resolve the learnable temperature confound.** Report converged temperature
    values per strategy per seed. If they differ systematically, either (a) fix temperature
    as a non-learnable hyperparameter in all comparisons, or (b) demonstrate that
    the learned temperature differences do not explain the R@1 deltas.

    2. **Isolate pos_weight from negative mining.** Run dataflow_aware with pos_weight_alpha=0
    (uniform weighting) to demonstrate the benefit comes from negative selection,
    not positive reweighting.

    3. **Document the CoCoHaNeRe BM25-proxy claim with specific evidence.** Cite the
    exact methodology section, code, or author communication confirming BM25 was used
    as embedding-distance proxy.

    4. **Reframe Claim 2 as hypothesis, not mechanism.** n=2 encoders cannot validate
    the "representation saturation mediates dataflow benefit" story. Present it as
    a plausible explanation with a testable prediction.


    **Important (strongly recommended):**

    5. **Report main results at a more realistic pool size** (e.g., pool=200) alongside
    pool=50.

    6. **Add restricted-to-structural-subset comparison.** Report all 4 strategies
    on only the 34% of instances with CodeQL data — eliminates fallback dilution.

    7. **Strengthen SWE-bench evaluation.** Use SWE-bench Verified (500 instances)
    or add a second agent model.

    8. **Add missing related work.** DPR, ContraCode, RocketQA/TAS-B connections.


    **Nice to have:**

    9. Add 1-2 more encoders (especially one encoder-only model) to strengthen the
    interaction claim.

    10. Compare with curriculum-based mining or in-batch negatives.

    11. Report training dynamics (loss curves, R@1 over steps) per strategy.


    ### Experiment Coverage Assessment


    All 15 imagined experiments from `review_context.yaml` are present in the paper:

    - ✅ SWE-bench Lite (plan_003) → Tables 2-4

    - ✅ RepoBench-R (plan_004) → Table 5

    - ✅ Stratified Analysis (plan_005) → Tables 6-7

    - ✅ Hop Depth Ablation (plan_007) → Table 9

    - ✅ Data Size Scaling (plan_008) → Table 10

    - ✅ Fusion Head Ablation (plan_009) → Table 11

    - ✅ Weighted vs Binary (plan_010) → Table 14

    - ✅ Failure Analysis (plan_011) → Table 15

    - ✅ Qualitative Examples (plan_012) → Django example in §4.7

    - ✅ Temperature Ablation (plan_014) → Table 8

    - ✅ Dynamic vs Static (plan_015) → Table 13

    - ✅ Bootstrap CIs (plan_016) → Table 3

    - ✅ Literature Comparison (plan_017) → Table 16

    - ✅ BM25 Baseline (plan_018) → Table 1

    - ✅ Pool Size Sensitivity (plan_019) → Table 12


    Coverage: **15/15 (100%)**. The paper is remarkably comprehensive in executing
    the experimental plan. The issues are not about missing experiments but about
    uncontrolled confounds within the executed experiments.


    ### Summary Verdict


    A thorough and honestly-framed empirical study that asks the right question and
    provides useful findings — particularly the CoCoHaNeRe BM25-proxy correction and
    the practical recommendation to use true embedding-distance mining. The ablation
    suite is exemplary. However, the paper''s most novel contribution (structure-grounded
    negatives) is its weakest empirical result, and several implementation confounds
    (learnable temperature, pos_weight asymmetry) prevent clean causal attribution.
    The mechanistic claim (Claim 2) is underpowered at n=2 encoders. With targeted
    revisions addressing the confounds and reframing the interaction claim, this would
    be a solid empirical contribution to the code retrieval literature.


    **Final Consensus: 4/6 (Weak Accept) — conditional on addressing the critical
    revision items above.**


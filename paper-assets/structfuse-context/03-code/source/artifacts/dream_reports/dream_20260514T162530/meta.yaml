      was real but scale-dependent. As training data increases to 3K and 5K, the advantage
      shrinks to 0.6pp and 0.2pp respectively. Mechanism: with more training data,
      the random negatives sample a wider swath of the embedding space, effectively
      approximating what curated embedding negatives provide. At small scale, curated
      negatives concentrate the training signal on the decision boundary; at large
      scale, random sampling covers the boundary adequately through sheer volume.
      This is a well-known phenomenon in contrastive learning (cf. SimCLR batch size
      scaling) and provides the mechanistic explanation for why pilot results didn''t
      replicate at full scale.


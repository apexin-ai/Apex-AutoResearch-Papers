      The best overall R@1 is at τ=0.05 (sharpest), but strategy differences remain
      noise-level at all temperatures. τ=0.2 degrades all strategies uniformly by
      ~2.5pp, consistent with known contrastive learning theory (too-warm temperatures
      lose discriminative power). The instability of strategy rankings across τ is
      itself evidence against a true strategy effect — a real signal would produce
      consistent rankings regardless of temperature. Report in appendix as robustness
      check.

      '
  - name: Dynamic embedding mining baseline
    plan_id: plan_015
    description: 'Re-mine embedding negatives per epoch vs static (mine once from
      pretrained). 1 seed × 2 encoders. Tests whether static mining confound explains
      null result.

      '
    expected_results:
      qwen_dynamic_R1: 0.5315
      qwen_static_R1: 0.531
      qwen_dynamic_minus_static_pp: 0.05

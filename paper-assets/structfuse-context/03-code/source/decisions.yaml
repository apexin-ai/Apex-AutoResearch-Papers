- id: D006
  date: 2026-05-12 17:24 UTC
  summary: P2b pass criteria 调整：recall@5→recall@1，pool_size 26→50+，阈值 ≥2pp 不变
  rationale: Eval v2 (pool_size=26) 显示 random recall@5 已达 98.4-99.2%，原标准"dataflow
    recall@5 > random ≥2pp"数学上几乎不可能达标（天花板仅 0.8-1.6pp 空间）。recall@1 有更大区分度（random mean
    93.97%），且是更严格的排序指标。同时扩大 pool_size 至 50+ 使 recall@5/10 也获得有效梯度。新标准：dataflow_aware
    recall@1 > random recall@1 ≥2pp in ≥2/3 seeds，pool_size=50。
  related_experiments:
  - exp_id: mvp_p2b_contrastive_training
    role: trigger
    result: random recall@1 mean=0.940, emb_dist recall@1=0.669 at pool=26; recall@5
      ceiling
  depends_on:
  - D002
- id: D007
  date: 2026-05-12 19:52 UTC
  summary: MVP P2b dataflow 策略不可验证：connected⊆gold 导致数据相同。决定：50-repo 规模验证 + Scheme
    B 备份
  rationale: 修复 build_p2b_data.py 后重新生成数据，train_dataflow.jsonl 仍与 train_embedding.jsonl
    完全相同。根因：8 个 MVP repos 中 dataflow 连接文件全部是 gold 文件的子集（connected-but-not-gold = 0），non_pos
    过滤无差异。这不是方法缺陷而是规模问题——小 repo 紧耦合，2-hop 连接集≈gold 集。P1（Fisher p=1.54e-7）和 P2a（AUC=0.78）仍有效，说明
    dataflow connectivity 有信号，只是 MVP 规模不足以分离 connected-but-not-gold 子集。决策：(1) 立即跑
    50-repo 样本的 overlap 统计（CPU, ~2-4h），确认大规模下 connected⊃gold；(2) 并行准备 Scheme B（distance-weighted
    negatives）作为 pivot 备选；(3) overlap>20% 实例有 connected≠gold → 进入全量 M1 提取；overlap≈100%
    → pivot to Scheme B。
  related_experiments:
  - exp_id: mvp_p2b_contrastive_training
    role: trigger
    result: dataflow≡embedding 因 connected⊆gold
  depends_on:
  - D006

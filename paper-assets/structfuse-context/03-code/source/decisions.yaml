- id: D019
  date: 2026-05-13 18:08 UTC
  summary: D018 补充：Full M2 go/no-go 量化阈值 + 统计检验方案
  rationale: 'Reviewer 指出 D018 缺量化阈值，go/no-go 判据需在结果出来前明确，避免事后 rationalization。


    **统计方法**：每个 encoder 3 seeds 的 R@1 (best-by-val-loss checkpoint) 做 paired difference，bootstrap
    95% CI + paired t-test (p<0.05)。同时报告 best-by-R@1 checkpoint 结果作为透明度补充。


    **Go/No-Go 阈值**：

    (A) Go — 原 framing 可用：dataflow > random 的 95% CI 在两个 encoder 上均 > 0

    (B) Conditional Go — 修正 framing：dataflow > random 在至少一个 encoder 上 CI > 0，另一个 CI
    含 0（差异不显著）

    (C) No-Go for Claim 1：dataflow ≤ random 在两个 encoder 上 CI 均含 0 或为负 → Claim 1 失效，pivot
    到 "mining strategy × architecture" 分析论文


    **Claim 2 判据**：若 full M2 显示 embedding > random 且 CI > 0 → 原 Claim 2 ("embedding
    harms") 被否定。新 Claim 2 候选："true embedding mining helps, but BM25 proxy harms" 或
    "hard negative mining method matters more than hard negative source"


    **跨 encoder 一致性规则**：

    - 同方向同显著 → 强泛化 claim

    - 同方向不同显著 → 条件 claim + architecture discussion

    - 反方向 → Claim 1 原形式被拒，需 conditional reframe


    阈值在 full M2 结果出来前锁定，不允许事后修改。'
  related_experiments:
  - exp_id: m2_full_qwen
    role: primary
    result: RUNNING - random_s42 in progress
  - exp_id: m2_full_starcoder
    role: primary
    result: RUNNING - data build phase
  depends_on:
  - D018
- id: D020
  date: 2026-05-13 18:10 UTC
  summary: D019 补充：Claim 2 完整判定矩阵 + n=3 功效限制声明
  rationale: 'Reviewer 指出 D019 的 Claim 2 阈值不完整 + n=3 统计功效天然受限。补充如下：


    **Claim 2 完整判定矩阵**（3 seeds, paired bootstrap 95% CI）：

    (i) random > embedding CI>0 → Claim 2 confirmed（embedding harms，与 MVP 一致）

    (ii) embedding > random CI>0 → Claim 2 falsified（true embedding mining helps，需
    reframe）

    (iii) CI 含 0 → inconclusive（效应存在但检测不到或确实无差异，论文报告为 "no significant difference"
    + 报告 effect size）


    **n=3 功效限制**（显式承认，不修改阈值）：

    - df=2 时 t 临界值 4.303，pilot 级别差异（<2pp）极难达到 p<0.05

    - Bootstrap n=3 仅 27 种重采样，CI 估计粗糙

    - 阈值框架偏向 No-Go（Type II error 高）

    - 若结果落入 (C) No-Go，论文 Discussion 必须讨论功效限制，不能简单声明 "dataflow 无效"

    - 这是算力约束下的合理选择，不改阈值，但明确风险


    **plan_014 排期**：Full M2 完成后优先启动 plan_014（temperature ablation, ~10h）——无论 Claim
    2 reframe 成哪个方向，temperature regime-specificity 都需要回答。'
  related_experiments:
  - exp_id: m2_full_qwen
    role: primary
    result: RUNNING
  - exp_id: m2_full_starcoder
    role: primary
    result: RUNNING
  depends_on:
  - D019
- id: D021
  date: 2026-05-13 19:10 UTC
  summary: Negative difficulty 分析揭示 encoder capacity 差异是 dataflow 效果不一致的根因
  rationale: '预训练模型 cosine similarity 分析显示：Qwen pretrained embeddings 分辨力弱（random
    cosine sim 0.899），StarCoder 分辨力强（random cosine sim 0.553）。Dataflow negatives 在两个模型上都比
    random 更难（higher sim），说明方法设计正确。但 StarCoder 已经"懂"结构差异（所有策略 sim 都低），额外训练信号边际收益小。这解释了
    pilot 中 StarCoder dataflow < random 的现象：不是方法问题，是 encoder 已有足够 capacity。



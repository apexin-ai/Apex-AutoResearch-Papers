# writing_plan.yaml — StructFuse EMNLP 2026 ARR May 25
# Generated: 2026-05-16
# Mode: Pre-Draft (dual-version skeleton)
# Status: PENDING_DIRECTOR_APPROVAL

meta:
  venue: "EMNLP 2026 Main (ARR May 25)"
  template: "acl2023"  # ARR uses ACL format
  template_note: "Using acl2023.sty; will verify latest ARR template"
  page_limit: 8  # + unlimited appendix
  dual_version: true
  version_decision_blocked_on: "D062 full results (14/14 evals)"

# ============================================================
# DUAL-VERSION TITLES
# ============================================================
titles:
  version_a:
    title: "What Really Matters in Hard Negative Evaluation? Checkpoint Selection Dominates Strategy Choice for Code Retrieval"
    subtitle_claim: "Checkpoint criterion is the dominant factor; strategy effect is secondary"
  version_b:
    title: "What Makes Hard Negatives Work for Code Retrieval? A Systematic Study of Mining Strategies and Evaluation Methodology"
    subtitle_claim: "Embedding mining works + dual methodology contribution (mining + eval protocol)"

# ============================================================
# PAPER OUTLINE
# ============================================================
paper_outline:
  abstract:
    word_budget: 250
    shared: false  # diverges between versions
    version_a_focus: "Checkpoint selection criterion dominates (+16.3pp) > strategy choice. Proper evaluation protocol reveals marginal but consistent embedding benefit."
    version_b_focus: "Embedding mining improves by Xpp at realistic pool size. Effect was masked by small-pool eval and inappropriate checkpoint selection."
    dependencies: [experiments, methodology]

  introduction:
    word_budget: 900
    shared: true  # problem setup and motivation identical
    content: |
      P1: Problem — repo-level file retrieval, importance of negatives
      P2: Prior work contradiction — CoCoHaNeRe says embedding negatives harmful; our question
      P3: Structural information in code — unique dimension absent in NL
      P4: Methodology gap — prior eval uses small fixed pools, unclear checkpoint criteria
      P5: Our contribution (DIVERGES at this paragraph)
    diverge_at: "P5 contribution list"
    version_a_p5: "Three contributions: (1) identify checkpoint criterion as dominant factor, (2) query-split eval protocol, (3) embedding mining as marginal-but-consistent baseline"
    version_b_p5: "Three contributions: (1) embedding mining improves at realistic pool sizes, (2) query-split eval protocol + checkpoint criterion analysis, (3) CodeQL pipeline"
    dependencies: []

  related_work:
    word_budget: 800
    shared: true  # identical across versions
    subsections:
      - "2.1 Dense Retrieval for Code"
      - "2.2 Contrastive Learning and Hard Negative Mining"
      - "2.3 Evaluation Methodology for Dense Retrieval"  # NEW — checkpoint selection, pool size, query splits
      - "2.4 Code Structure in Machine Learning"
    dependencies: []

  methodology:
    word_budget: 1200
    shared: true  # identical across versions
    subsections:
      - "3.1 Problem Formulation (InfoNCE, contrastive setup)"
      - "3.2 Negative Mining Strategies (random, embedding-distance, dataflow-aware, BM25)"
      - "3.3 Structural Extraction Pipeline (CodeQL 2-hop, beniget fallback)"
      - "3.4 Training Setup (3 encoders, LoRA, hyperparams)"
      - "3.5 Query-Split Evaluation Protocol"  # NEW — D062 methodology
    new_subsection_3_5:
      content: |
        - Motivation: standard pool-based eval (pool=50, random negatives) inflates R@1 and compresses strategy differences
        - Query-split protocol: hold out queries (not just shuffle negatives), evaluate at realistic pool sizes {50, 200, 500}
        - Checkpoint selection: compare best_by_val_loss vs best_by_R@1 — measure criterion effect
        - Claim: this protocol reveals effects masked by standard small-pool eval
      data_source: "D062 methodology + registry d062_analysis"
    dependencies: []

  experiments:
    word_budget: 2000
    shared: false  # structure shared but emphasis diverges
    subsections:
      - "4.1 Experimental Setup (dataset, encoders, training details)"
      - "4.2 Main Results (DIVERGES)"
      - "4.3 Analysis"
    subsection_4_2:
      shared_elements:
        - "Table 1: Strategy × Criterion × Encoder results at pool-50 (training eval)"
        - "Table 2: Strategy × Criterion × Encoder at realistic pool sizes (D062 query-split)"
      version_a_emphasis: |
        Lead with Table 2 criterion effect (+16.3pp). Strategy effect shown as secondary.
        Narrative: "Criterion dominates. Within proper criterion, embedding shows X.Xpp."
      version_b_emphasis: |
        Lead with Table 2 strategy effect at realistic pool + proper criterion.
        Narrative: "Embedding improves by X.Xpp. This was masked by wrong criterion choice."
    subsection_4_3:
      shared:
        - "4.3.1 Checkpoint Selection Criterion (criterion effect quantification)"
        - "4.3.2 Pool Size Sensitivity"
        - "4.3.3 Training Dynamics (decay rate, loss-R@1 divergence)"
        - "4.3.4 Negative Difficulty Analysis (representation geometry)"
        - "4.3.5 Cross-Encoder Comparison (Qwen vs StarCoder vs UniXcoder)"
      version_a_additions:
        - "4.3.6 When Does Strategy Matter? (conditional analysis: criterion-controlled strategy effect)"
      version_b_additions:
        - "4.3.6 BM25 Comparison (plan_018 results)"
    dependencies: [methodology]

  discussion:
    word_budget: 800
    shared: true  # mostly shared, minor emphasis difference
    subsections:
      - "5.1 Relationship to Inference-Time Graph Methods"
      - "5.2 Representation Geometry (exploratory)"
      - "5.3 Implications for Evaluation Practice"  # NEW for both versions
      - "5.4 Limitations"
    dependencies: [experiments]

  conclusion:
    word_budget: 250
    shared: false
    version_a_focus: "Criterion > strategy. Practical recommendation: always use best_by_R@1 + query-split eval. Embedding mining provides marginal consistent benefit."
    version_b_focus: "Embedding mining works when properly evaluated. Dual methodology: mining strategy + eval protocol. Query-split eval as community recommendation."
    dependencies: [experiments, discussion]

# ============================================================
# VISUALIZATION PLAN
# ============================================================
visualization_plan:
  - fig_id: fig1_pipeline
    type: schematic
    tool: matplotlib
    description: "Pipeline overview — input → CodeQL extraction → 4 strategies → contrastive training → encoder"
    placement: "§1 or §3"
    aspect_ratio: "7x2.8"
    data_source: "static (no data needed)"
    status: DONE  # already generated

  - fig_id: fig2_mining_strategies
    type: schematic
    tool: matplotlib
    description: "3-panel strategy comparison on mini-repo graph"
    placement: "§3.2"
    aspect_ratio: "7x3"
    data_source: "static"
    status: DONE

  - fig_id: fig3_criterion_effect
    type: bar_chart
    tool: matplotlib
    description: "Grouped bar: R@1 by strategy, split by criterion (best_by_loss vs best_by_R@1). Shows criterion effect >> strategy effect."
    placement: "§4.2 or §4.3.1"
    aspect_ratio: "5x3.5"
    data_source: "registry: D062 query-split results"
    status: TBD  # blocked on D062 completion

  - fig_id: fig4_rep_geometry
    type: statistical
    tool: matplotlib
    description: "2-panel: margin comparison + similarity distribution across encoders"
    placement: "§4.3.4"
    aspect_ratio: "7x3"
    data_source: "registry: neg_difficulty_analysis"
    status: DONE

  - fig_id: fig5_pool_sensitivity
    type: line_chart
    tool: matplotlib
    description: "R@1 vs pool size {50, 200, 500} by strategy × criterion"
    placement: "§4.3.2"
    aspect_ratio: "5x3.5"
    data_source: "registry: D062 pool-size sweep"
    status: TBD

  - fig_id: fig6_training_dynamics
    type: line_chart
    tool: matplotlib
    description: "Validation R@1 trajectories across strategies (Qwen s44 illustrative + aggregated)"
    placement: "§4.3.3"
    aspect_ratio: "5x3.5"
    data_source: "registry: m2_full_qwen_continued step-by-step metrics"
    status: TBD

# ============================================================
# TABLE PLAN
# ============================================================
table_plan:
  - table_id: tab1_main_pool50
    type: results
    columns: ["Strategy", "Criterion", "Qwen R@1", "StarCoder R@1", "UniXcoder R@1"]
    data_source: "registry: m2_full_qwen, m2_full_starcoder, unixcoder-3strat (mean±std, 3 seeds)"
    placement: "§4.2"
    note: "Standard pool-50 training eval. Shows strategy effect in controlled setting."

  - table_id: tab2_query_split
    type: results
    columns: ["Strategy", "Criterion", "Pool-50 R@1", "Pool-200 R@1", "Pool-500 R@1"]
    data_source: "registry: D062 query-split eval results"
    placement: "§4.2"
    note: "KEY TABLE. Shows criterion effect >> strategy at realistic pool sizes."
    status: TBD  # 6/14 complete

  - table_id: tab3_criterion_effect
    type: analysis
    columns: ["Encoder", "Criterion Effect (pp)", "Strategy Effect (pp)", "Ratio"]
    data_source: "D062 analysis output"
    placement: "§4.3.1"
    note: "Quantifies criterion vs strategy effect sizes."

  - table_id: tab4_neg_difficulty
    type: analysis
    columns: ["Strategy", "pos_sim", "neg_sim", "margin (Qwen)", "margin (StarCoder)"]
    data_source: "registry: neg_difficulty_analysis"
    placement: "§4.3.4"
    status: DONE

  - table_id: tab5_inference_comparison
    type: comparison
    columns: ["Method", "Structure Phase", "Scope", "Graph Cost", "Complementary?"]
    data_source: "plan_017 literature survey"
    placement: "§5.1"
    status: DONE

  - table_id: tab6_extraction_stats
    type: descriptive
    columns: ["Metric", "Value"]
    data_source: "registry: m1_extraction, m1_reextract_v2"
    placement: "§3.3 or Appendix"
    status: DONE

# ============================================================
# LITERATURE STRATEGY
# ============================================================
literature_strategy:
  macro_context: "Hard negative mining for contrastive retrieval; evaluation methodology for dense retrievers; code structure in ML"
  citation_budget: 50
  micro_clusters:
    - cluster_name: "hard_negative_mining"
      target_count: 12
      must_cite: ["karpukhin2020dpr", "xiong2021ance", "qu2021rocketqa", "zhan2021star", "fan2025cocohanere", "zeng2022cldrd"]
    - cluster_name: "code_retrieval"
      target_count: 10
      must_cite: ["reddy2025swerank", "xie2025swefixer", "zhang2024codesage", "li2022scoder"]
    - cluster_name: "contrastive_learning_code"
      target_count: 8
      must_cite: ["chen2020simclr", "jain2021contracode", "li2022coderetriever", "guo2021graphcodebert"]
    - cluster_name: "evaluation_methodology"  # NEW cluster
      target_count: 6
      must_cite: []  # to be filled — checkpoint selection, pool size effects in IR
      search_queries: ["checkpoint selection contrastive learning", "evaluation pool size dense retrieval", "query split evaluation protocol"]
    - cluster_name: "code_structure_ml"
      target_count: 8
      must_cite: ["avgustinov2016ql", "liu2025codexgraph", "shah2025ranger", "ouyang2025repograph"]
    - cluster_name: "pretrained_code_models"
      target_count: 6
      must_cite: ["hui2024qwen25coder", "lozhkov2024starcoder2", "feng2020codebert", "guo2022unixcoder"]

# ============================================================
# WRITING ORDER
# ============================================================
writing_order:
  phase_1_shared:  # write immediately
    - "methodology"     # §3 — fully shared, all data available
    - "related_work"    # §2 — fully shared, need evaluation_methodology cluster fill
    - "introduction"    # §1 P1-P4 — shared problem setup
  phase_2_after_d062:  # write after D062 14/14 complete
    - "experiments"     # §4 — version-dependent emphasis
    - "introduction_p5" # §1 P5 — contribution list diverges
    - "abstract"        # depends on final results
    - "conclusion"      # depends on final results
  phase_3_refinement:
    - "discussion"      # §5 — mostly shared but needs final numbers
    - "appendix"        # supplementary tables, full training curves

# ============================================================
# CONSTRAINTS
# ============================================================
constraints:
  d051_stats: "All results tables: mean ± std across 3 seeds. No single-seed cherry-picking."
  no_swebench: "SWE-bench dropped (plan_003 failed: R@1=0.04 OOD). External validation via RepoBench-R."
  three_encoders: "Qwen2.5-Coder-3B + StarCoder2-3B + UniXcoder-base (125M). Third encoder validates cross-architecture."
  query_split: "D062 query-split eval is the primary evaluation protocol. Pool-50 training eval is supplementary."
  version_gate: "Final version (A vs B) decided by Director after D062 14/14 complete."

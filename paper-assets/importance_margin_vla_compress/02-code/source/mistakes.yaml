- id: M036
  date: '2026-05-20'
  category: agent_behavior
  severity: medium
  summary: 'M035 repeat: Agent hangs 8+ min on directive that spawned worker, even
    after worker completed'
  root_cause: Agent processes directive → spawns worker → worker completes and result.json
    exists → but Agent remains in 'processing' state on the original directive for
    8+ minutes. Cancelling pending worker:done notifications via replace_agent_queue
    may worsen the hang by removing the completion signal the Agent is waiting for.
  prevention: 1) After spawning worker, Agent should return immediately with 'worker
    spawned, will report on completion' instead of waiting inline. 2) Do NOT cancel
    worker:done notifications via replace_agent_queue when Agent is processing the
    parent directive — this removes the completion signal. 3) For future stuck states,
    wait for auto-recovery (~15-20 min) rather than intervening with queue operations
    that may break the notification chain.
  status: active
  context: 'Third occurrence of M035 pattern this session. First time: 19-minute hang
    on multi-server directive. This time: single-server OFT k=1.0 directive. Agent
    spawned worker, worker completed (462 bytes result.json), but Agent stuck ''processing''
    original directive. replace_agent_queue cancelled 2 pending worker:done items,
    potentially worsening the hang.'
  fix: Wait for auto-recovery. Queued cqa1 directive as pending to be processed after
    Agent unsticks.

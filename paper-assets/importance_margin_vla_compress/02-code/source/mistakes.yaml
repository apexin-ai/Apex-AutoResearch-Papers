- id: M045
  date: '2026-05-21'
  category: experiment_design
  severity: medium
  summary: Premature suite-level non-monotonic claim from partial Goal data (T0-T5
    only)
  root_cause: Claimed "Goal k=0.5 (70%) > k=0.9 (63.3%) = suite-level non-monotonic"
    based on 6/10 tasks. T6/T7 data reversed the direction to k=0.9 (69.8%) > k=0.5
    (63.4%). Partial data with high per-task variance can produce misleading suite-level
    aggregates.
  prevention: Never claim suite-level trends from partial task data. Always mark partial
    results as "preliminary, N/M tasks" and explicitly flag that direction could flip.
    Only promote to paper/framing after ALL tasks complete.
  status: active
  context: 'Goal T6: k=0.9=78% vs k=0.5=24% (54pp swing). Goal T7: k=0.9=100%. These

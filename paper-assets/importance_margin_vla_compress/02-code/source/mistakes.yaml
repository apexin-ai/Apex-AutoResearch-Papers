- id: M006
  date: '2026-05-17'
  category: experiment_design
  severity: high
  summary: Negative 结果出来后直接换叙事/pivot story，而非诊断机制性原因再决定下一步
  root_cause: Hypothesis 被当作 registry 可选项而非研究推进引擎。LoRA 0% → 换 Full FT 叙事；IMM k=0.5
    崩 → 直接讨论 pivot story。每次 negative 的第一反应是"怎么换故事"而不是"这证伪了什么具体机制"。实验间缺少 parent 推导链，导致方法本身没有被迭代改进。
  prevention: 1. 每个实验必须有具体可证伪 hypothesis（≥20字符，指向具体机制）。2. Negative 出来先问"证伪了什么机制"，再决定是改方法/诊断问题/调方向。3.
    实验间推导关系用 parent 字段追踪。4. 审批时检查 hypothesis 来源（claim 关联或 parent 推导链）。
  status: active
  context: Manager 2026-05-17 指出的系统性问题。本项目 38 个实验中 11 failed + 8 negative，但方法本身从未被认真改进——一直在换
    story。
  fix: 已派 Agent 做 registry 全量自检（补 hypothesis + parent），从现在起严格执行 hypothesis-driven
    标准。
- id: M007
  date: '2026-05-17'
  category: code_bug
  severity: high
  summary: Eval 脚本 pruning 未实际执行，导致 "lossless 44.8%" 假阳性结论
  root_cause: eval_success_rate_libero.py 的 acis_prune/random_prune mode 计算了 importance
    score 但未真正 mask/drop tokens，forward pass 始终使用全部 128 tokens。三种不同 pruning 模式产生 identical
    per-episode 结果是 bug 的明确信号，但在 Reviewer 发现前未被注意。
  prevention: 1. 新 eval 脚本必须加 sanity check：打印实际输入 expert 的 token 数量，不同 mode 数量必须不同。2.
    重大结论出来后，第一个验证步骤应是 "random baseline 是否给出不同结果"——如果 random = ACIS，立即怀疑 bug 而非 "token
    冗余"。3. Per-episode 结果对比是最敏感的 bug 检测手段。
  status: active
  context: Stage1-only eval 报告 SR=44.8% 与 baseline 完全相同，被当作"lossless compression"重大发现。随后
    random pruning 也报告相同结果，Reviewer 对比 per-episode outcome 发现三种 mode 完全 identical，确认
    pruning 未执行。导致错误的 D059 决策和错误的用户汇报。
  fix: 停止所有 pruning eval，audit eval 脚本 pruning 代码路径，修复后加 token count sanity check，重跑所有
    pruning 实验。
- id: M008
  date: '2026-05-17'
  category: communication
  severity: medium
  summary: Complex multi-task Director instruction caused Agent to stall 18+ minutes
  root_cause: Director sent a single instruction with 7 worker callback references
    + 5 priority tasks + detailed sub-instructions. Agent likely hit context/processing
    limits trying to handle everything at once.
  prevention: Break complex instructions into 2-3 focused tasks max. Send P0 tasks
    first, wait for response, then send P1/P2. Use replace_agent_queue if Agent stalls
    >10 minutes.
  status: active
  fix: Used replace_agent_queue to cancel 5 stale callbacks and send a simplified
    consolidated instruction.
- id: M009
  date: '2026-05-17'
  category: agent_behavior
  severity: medium
  summary: Agent stall 17+ minutes on 2-task fix experiments instruction, blocking
    urgent user request
  root_cause: Agent processing fix experiments instruction (bypass baseline + ACIS
    supplement on westd) for 17+ minutes without output. Likely SSH operation hang
    or internal loop. Even with only 2 tasks, SSH-dependent instructions can stall
    when remote connections time out or commands hang.
  prevention: For SSH-dependent tasks (launching remote experiments), set explicit
    timeouts. When Agent stalls >10 minutes, use replace_agent_queue immediately rather
    than waiting. Consider splitting SSH tasks to separate workers rather than having
    Agent do SSH directly.
  status: active
  context: 'Agent was processing fix experiments instruction for Reviewer feedback
    (run bypass baseline + complete ACIS k=0.5 supplement on westd). User then pivoted
    direction (D066: OpenVLA + smart compression) and urgently requested model downloads.
    Agent stall blocked response to user for 17+ minutes. Used replace_agent_queue
    twice to clear pending queue, but cannot interrupt current processing.'
  fix: Used replace_agent_queue to queue urgent download instruction. Waiting for
    stall to resolve naturally.

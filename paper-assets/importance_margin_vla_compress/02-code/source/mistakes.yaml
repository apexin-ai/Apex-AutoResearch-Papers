- id: M015
  date: '2026-05-18'
  category: code_bug
  severity: medium
  summary: 'ACIS pruning hook bug on cqa1: shape mismatch caused pruning to silently
    not execute'
  root_cause: eval_success_rate_libero.py on cqa1 was an old version where register_acis_hook
    compared single-camera tokens.shape[1] vs full-camera mask.shape[1], always mismatching,
    causing the hook to return output unmodified. westd had the fixed version with
    offset-based per-camera slicing.
  prevention: When running experiments across multiple servers, always verify eval
    script versions match. After fixing bugs on one server, immediately sync to all
    others. Add an assertion in the pruning hook that verifies tokens were actually
    modified (e.g., count non-zero changes).
  status: active
  fix: Sync westd's fixed eval_success_rate_libero.py to cqa1 before re-running ACIS
    supplement.

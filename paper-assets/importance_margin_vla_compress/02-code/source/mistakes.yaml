- id: M005
  date: '2026-05-17'
  category: agent_behavior
  severity: high
  summary: Startup recovery 将 4 个正常实验误标为 failed（含 1 个已完成、2 个 RUNNING、1 个 eval 中）
  root_cause: 服务器重启后 Agent 的 startup recovery 逻辑过于激进，未检查实际进程/日志/checkpoint 就将所有 RUNNING

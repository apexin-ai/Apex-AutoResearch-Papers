  date: '2026-05-20'
  category: resource_misuse
  severity: high
  summary: 'M043: LIBERO-Plus pip install 覆盖运行中 LIBERO 包，导致 westd-38929 4 实验全部崩溃（M042
    根因修正）'
  root_cause: Director 指示 Agent 在 westd-38929 上 pip install LIBERO-Plus，Worker 未检查是否有进程正在使用

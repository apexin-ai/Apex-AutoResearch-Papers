    个并发进程访问同一 suite 的 init 文件时产生读写竞争（一个进程写入/删除时另一个进程读取 → FileNotFoundError）。
  prevention: 同一服务器并行跑多个 LIBERO eval 时：(1) 预生成全部 task 的 init 文件（单进程 dry-run），或 (2)
    为每个 GPU 进程复制独立的 init 文件目录（cp -r init_files/ init_files_gpuN/），或 (3) 在 init 代码中加
    file lock / exists check。不同 suite 的 init 文件不冲突（cqa1 安全因为跑不同 suite）。
  status: active
  context: westd-38929 4 GPU 同时跑 LIBERO-Object eval。3/4 在 Task 3-4 同时崩溃（同一 task 的
    init 文件被竞争）。k=0.3 seed43 (GPU2) 幸存可能因为跑到不同 task。~175 min 计算量损失，部分 task 结果丢失无法恢复。
  fix: Agent 正在修复：预生成 init 文件 + 重启 3 个崩溃实验。

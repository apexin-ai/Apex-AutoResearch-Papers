- id: M170
  date: '2026-05-28'
  category: agent_behavior
  severity: medium
  summary: Cron 回调跨 Agent rotation 失效，导致 s47 结果连续 4+ 轮未收集
  root_cause: Agent 注册 cron 监控实验 → 等待回调 → idle 16h → 触发 rotation → 新 session 丢失 cron
    上下文 → 重新注册 cron → 再次 idle。循环 4+ 次，每次都报"~2h 完成"但从未处理回调。
  prevention: 实验预计 2-3h 完成时，不要依赖 cron 回调。改为：(1) Agent 主动 spawn Worker 轮询（Worker 不受
    Agent rotation 影响）；或 (2) Director 在预计完成时间后直接指令 Agent SSH 检查结果，不等 cron。对于短实验（<4h），直接用
    Worker 守候到完成比 cron 更可靠。
  status: active
  context: s47 bonus seed 实验在 cqa1 上运行，实际 runtime ~2.5h。Agent 连续 4 次 rotation（每次 ~16h
    idle）都未能收集结果。每次新 session 都重新注册 cron 但同样 idle 超时。
  fix: 新 session 指令 Agent 直接 SSH 检查结果，禁止再用 cron 等待。

  fix: LIBERO-Plus 已安装完毕，新路径下 init 文件完整。4 个实验可立即重启。
- id: M044
  date: '2026-05-21'
  category: experiment_design
  severity: high
  summary: 'M044: OpenVLA Spatial eval launched on incomplete checkpoint (shard 3
    still downloading via aria2c)'
  root_cause: Worker started eval before verifying all checkpoint shards were fully
    downloaded. Checked file existence but not download completion (.aria2 control

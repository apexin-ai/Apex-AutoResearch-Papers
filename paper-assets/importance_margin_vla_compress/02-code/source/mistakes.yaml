- id: M055
  date: '2026-05-21'
  category: code_bug
  severity: medium
  summary: 'M054 root cause: CUDA_VISIBLE_DEVICES export overridden by eval script
    internal os.environ'
  root_cause: π0.5 eval script contains `os.environ["CUDA_VISIBLE_DEVICES"] = str(args.gpu)`
    which overrides any external CUDA_VISIBLE_DEVICES export. Workers used `export

- id: M074
  date: '2026-05-22'
  category: resource_misuse
  severity: high
  summary: 'M074: Misdiagnosed 12/14 occupied GPUs as idle based on nvidia-smi util%
    snapshots, sent deployment instruction to overwrite running experiments'
  root_cause: LIBERO eval is CPU-intensive between inference calls — GPU util drops
    to 0-1% during simulation steps. nvidia-smi snapshots during these intervals show
    low utilization, but the GPU is occupied (model loaded in VRAM, process running).
    Director used list_available_gpus (which reads nvidia-smi) as sole indicator,
    without checking process lists or VRAM allocation patterns. This is the same class
    of error as M073 (trusting surface metrics without cross-checking).
  prevention: '1. Never diagnose GPU as "idle" from utilization % alone for LIBERO
    eval workloads. Check VRAM allocation: >2GB on Blackwell or >5GB on 4090D means
    a model is loaded. 2. Cross-reference with `ps aux | grep python` to confirm no
    eval process is running. 3. Only 1 MiB VRAM + 0% util = truly idle. 4. SmolVLA
    specifically uses ~2.5-2.7GB VRAM — looks deceptively "light" on 96GB Blackwell
    GPUs.'
  status: active
  context: 'Sent consolidated instruction to deploy 10 experiments on "idle" GPUs.
    Actual idle count was 2 (westd-41074:1, cqa1:1). Fortunately, Agent''s deploy
    worker detected occupied GPUs and did not blindly overwrite. Key VRAM signatures:
    SmolVLA ~2.7GB (looks idle on 96GB card), X-VLA ~4.9GB, π0.5 ~10GB, VTC training
    ~27.5GB.'
  fix: Cancelled queue, sending corrected instruction targeting only the 2 truly idle
    GPUs. Added VRAM threshold rule to prevention.

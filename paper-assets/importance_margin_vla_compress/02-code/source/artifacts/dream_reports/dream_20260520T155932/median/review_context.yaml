  result_rationale: 'k=0.7是X-VLA的cliff point——从k=0.9的97.6%骤降到56.2% (seed42)。 Cliff
    points天然high-variance，原因是： (1) BART encoder的12层transformer mixing创建了partial token
    dependencies， 在k=0.7恰好跨过dependencies被破坏的threshold； (2) seed决定eval episodes的随机初始状态和token
    removal order， cliff附近某些task的成功高度依赖于具体哪些token被保留； (3) Seed42的per-task分析：task1=2%,
    task4=28%, task6=12%, task8=0% vs task0=94%, task2=100%——bimodality极端。 seed44的specific
    task分布会不同，可能某些在seed42失败的task反而成功， 反之亦然。预测overall 40-70%，中位数~52%。 无论具体数值，只要k=0.9
    >> k=0.7（>30pp gap），cliff pattern就成立。

    '
  tables:
  - name: X-VLA cliff-point seed variance
    data: '| k    | Seed42  | Seed44 (pred) | 2-seed Mean | Interpretation          |

      |------|---------|---------------|-------------|-------------------------|


      | 0.95 | 99.0%   | ~98%          | ~98.5%      | robust region           |

      | 0.9  | 97.6%   | ~96.5%        | ~97%        | robust region           |

      | 0.7  | 56.2%   | ~52%          | ~54%        | CLIFF — high variance   |

      | 0.5  | 42.6%   | ~40%          | ~41%        | below cliff, stabilizes |

      '
  figures_description:
  - X-VLA pruning curve with seed42 (solid) and seed44 (dashed) overlaid. k>=0.9区域两线重合，k=0.7处visible
    spread，k<=0.5再次收敛。
  analysis: 'Cliff variance是expected phenomenon（不是noise），可以直接在论文中讨论： "cliff位置在k~0.7处，但exact

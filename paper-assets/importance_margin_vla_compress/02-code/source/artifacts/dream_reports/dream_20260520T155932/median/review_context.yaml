- name: X-VLA L2-norm pruning k=0.7 seed44 (cliff variance)
  plan_id: c1_xvla_cliff_pattern
  description: 'X-VLA k=0.7使用seed44重复。验证cliff位置的seed robustness。 Seed42 = 56.2%。当前状态：eval_xvla_prune_k07_seed44

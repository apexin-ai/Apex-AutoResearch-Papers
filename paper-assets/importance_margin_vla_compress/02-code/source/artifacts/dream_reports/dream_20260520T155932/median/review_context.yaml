narrative_guidance: '分析贡献完整成立，但VTR仅对pixel-shuffle有效，方法贡献需收窄。 Claim 4从"universal compression"收窄为"VTR
  specifically solves pixel-shuffle entanglement"—— 这反而强化architecture-dependency的核心叙事（连修复方案都取决于connector类型）。
  OpenVLA VTC-only全部失败本身成为evidence：MLP projector tokens已独立可用， 额外re-encoding引入过拟合。OpenVLA
  L2-norm与random基本一致（±10pp）， pruning method不影响taxonomy。X-VLA seed复现合理但cliff处variance偏大。
  论文标题不变，abstract从"diagnose-then-compress framework"调整为 "first systematic analysis
  + targeted fix for the hardest case"。仍为CoRL强投稿。

  '

  result_rationale: 'Perceiver Resampler使用learnable query tokens通过cross-attention从encoder
    output中提取固定数量的compressed representations。架构上与VTC类似 （都是cross-attention压缩），但位于connector（而非compression
    module）。 预测CV=0.10-0.20（between π0=0.038 and OpenVLA=0.215）： (1) cross-attention引入了soft
    inter-token dependencies（类似BART）， (2) 但每个query token attend to all encoder tokens（global
    receptive field）， 信息分布比MLP projector更structured但比pixel-shuffle less entangled。
    pruning行为预测：moderate graded degradation，可能在k~0.8有soft threshold （类似X-VLA但更gentle）——Perceiver的global
    attention给每个token 提供了more redundancy than MLP but less than pure linear。


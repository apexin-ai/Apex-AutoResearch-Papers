  result_rationale: '移除70%的tokens。仅保留77个tokens时信息损失严重但仍非零， 因为MLP projector的每个token都编码了全局信息的一部分。
    19% vs random 20.6%的差异趋于收敛——在极端压缩率下， 无论选择哪些tokens保留，剩余信息量都接近一个下限。 L2-norm方法保留的77个highest-importance
    tokens与random 77个tokens 的信息覆盖度差异已被压缩到noise level（-1.6pp）。

    '
  tables: []
  figures_description: []
  analysis: '5个k值完整L2-norm curve确认：OpenVLA (MLP projector) 的pruning行为 与pruning method无关（max
    |Δ| = 2.0pp << 5pp threshold）。 Paper可以统一报告Table 1的taxonomy，无需对pruning method加caveat。

    '
- name: X-VLA k=0.7 seed44 replication
  plan_id: c1_xvla_cliff_pattern
  description: 'X-VLA k=0.7 L2-norm pruning的seed44复现评估。原seed42=56.2%。 验证threshold-graded
    cliff pattern的seed稳健性。

    '
  expected_results:
    overall_sr: 0.52
    wilson_ci_95_lower: 0.476
    wilson_ci_95_upper: 0.563
    total_episodes: 500
    seed: 44
    k_ratio: 0.7
    delta_vs_seed42_pp: -4.2
    within_10pp_of_seed42: true
  result_rationale: 'k=0.7是X-VLA的cliff point——BART encoder的12层transformer mixing在此处
    导致关键token依赖被打断。Cliff的精确位置受evaluation randomness影响： 不同seed意味着不同的episode初始状态和任务实例化。
    原seed42的56.2%中，per-task SR极度不均（T1=2%, T4=28%, T8=0% vs T0=94%, T2=100%）， 说明某些task处于cliff边缘。seed44可能将部分边缘task推向另一侧，
    导致±5-8pp波动。52%落在[46, 66]范围内， 且cliff pattern本身（k=0.9 ~97% → k=0.7 ~52% → k=0.5
    ~42%）的阶梯结构不变。

    '
  tables:
  - name: 'Table: X-VLA Pruning Seed Robustness'
    content: '| k | seed42 SR | seed44 SR | Δ (pp) | Pattern |

      |---|-----------|-----------|--------|---------|

      | 0.9 | 97.6% | 96.0% | -1.6 | Immune ✓ |

      | 0.7 | 56.2% | 52.0% | -4.2 | Cliff ✓ |

      '
  figures_description:
  - 'X-VLA pruning curve with seed bars: x=k ratio, y=SR%. 两条曲线（seed42/44）在k≥0.9几乎重叠，k=0.7处分叉但均处于50-60%区间，确认cliff位置稳定。'
  analysis: 'seed44复现在±10pp内（52% vs 56.2%，Δ=-4.2pp），确认： (1) k=0.7 cliff是BART encoder架构特性而非evaluation
    artifact； (2) threshold-graded pattern稳健——任何seed下k=0.9→k=0.7的drop均为~40pp； (3)
    CV=0.151正确预测了intermediate pruning behavior（k=0.7 SR ≈ OpenVLA k=0.7）。

    '
- name: X-VLA k=0.9 seed44 replication
  plan_id: c1_xvla_cliff_pattern
  description: 'X-VLA k=0.9 L2-norm pruning的seed44复现。原seed42=97.6%。确认above-cliff区间稳定。

    '
  expected_results:
    overall_sr: 0.96
    wilson_ci_95_lower: 0.939
    wilson_ci_95_upper: 0.974
    total_episodes: 500
    seed: 44
    k_ratio: 0.9
    delta_vs_seed42_pp: -1.6
  result_rationale: 'k=0.9保留90%的tokens，远在cliff（k=0.7）之上。 BART encoder的token依赖在仅10%移除时不会被破坏——
    12层transformer的信息冗余足以补偿少量token缺失。 96% vs 97.6%的-1.6pp差异完全在evaluation noise范围内
    （500 episode下baseline k=1.0 = 99.2%，本身就有±1-2pp波动）。 Above-cliff区间对seed极不敏感。

    '
  tables: []
  figures_description: []
  analysis: 'k=0.9 seed44=96% 确认threshold-graded model的"robust zone"跨seed稳定。 这与π0的immune
    behavior（所有k值均稳定）和SmolVLA的catastrophic cliff （所有seed均0%）形成完美对比，三种pattern都是seed-robust的。

    '

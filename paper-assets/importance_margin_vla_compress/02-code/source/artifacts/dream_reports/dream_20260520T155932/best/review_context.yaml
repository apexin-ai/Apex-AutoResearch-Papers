- name: RoboFlamingo Perceiver Resampler baseline + pruning
  plan_id: c5_third_connector_roboflamingo
  description: 'RoboFlamingo（Perceiver Resampler connector）在LIBERO-Object上的baseline
    + pruning sweep。 添加第4种connector family（learnable cross-attention queries），扩展taxonomy。
    注意：6天内完成fine-tune + 全sweep的可能性较低，属于bonus实验。

    '
  expected_results:
    baseline_sr: 0.42
    k095_sr: 0.4
    k09_sr: 0.36
    k07_sr: 0.28
    k05_sr: 0.15
    k03_sr: 0.04
    importance_cv: 0.11
    entropy_ratio: 0.88
    pruning_class: graded (gentle slope)
    total_episodes_per_k: 500
  result_rationale: 'Perceiver Resampler使用learned queries通过cross-attention聚合visual
    features， 每个query已经是信息聚合后的结果（类似Q-Former）。 与pixel-shuffle不同，Resampler没有hard spatial
    folding，所以不会catastrophic cliff。 与pure linear不同，cross-attention引入了non-trivial token依赖（query间有信息竞争），
    所以不会immune。预期CV=0.11，低于X-VLA（0.151）因为Perceiver的learned queries 经过预训练已被优化为均匀覆盖visual
    information（类似于VQ-VAE的codebook均匀性）。 Pruning curve应显示gentle graded degradation——比OpenVLA
    MLP更温和 （因为每个query token本身就是信息聚合后的结果，冗余度更高）， 但不immune（因为cross-attention的query specialization创建了partial
    dependencies）。 Baseline 42%较低是因为RoboFlamingo架构较旧（2023），在LIBERO上fine-tune效果 不如OpenVLA/SmolVLA等2024-2025架构。

    '

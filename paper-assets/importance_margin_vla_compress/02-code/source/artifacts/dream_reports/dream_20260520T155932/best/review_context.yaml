    projector， 每层GELU非线性混合使相邻tokens共享约40-60%的信息（基于已知的attention entropy 0.639）， 因此50%移除约损失25-30%的独特信息。
    L2-norm 35.5% vs random 37.4%的差异维持在~2pp—— 即使在高压缩率下，MLP projector的信息均匀性仍使两种方法等价。


  tables: []
  figures_description: []
  analysis: 'k=0.5是SmolVLA的全灭点（0%），OpenVLA仍保持35.5%（L2-norm）/37.4%（random）。 这个对比直接展示了connector
    type而非pruning method决定compressibility。

    '
- name: OpenVLA L2-norm pruning k=0.3
  plan_id: d108_unified_pruning_protocol
  description: 'L2-norm pruning k=0.3评估。对比random k=0.3=20.6%。极端压缩率。


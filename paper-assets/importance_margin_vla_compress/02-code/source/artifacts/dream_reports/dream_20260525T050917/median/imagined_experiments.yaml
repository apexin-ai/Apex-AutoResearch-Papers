    openvla_vtc_m96_final_loss: 2.45
    openvla_vtc_m64_final_loss: null
    interpretation: VTC training does not converge on MLP-projector VLAs
  result_rationale: 'All M values 的 VTC training 在 OpenVLA 上失败或 killed。M=96 跑完了 100K
    steps 但 final loss 2.45（远高于 SmolVLA 的 ~0.05），说明模型未能学到有效的 token re-encoding。M=64
    和 M=32 的 VTC-only training 也 crashed/failed。

    Root cause：OpenVLA (7B) 是 frozen backbone + 22M compressor 的极端不平衡。 SmolVLA (450M)
    的 compressor/backbone ratio = 22M/450M = 4.9%，而 OpenVLA 的 ratio = 22M/7B = 0.3%。VTC
    的 gradient signal 在通过 7B frozen backbone 的 attention layers 时被严重 attenuate，导致
    compressor 无法学到有用的 representation。

    '

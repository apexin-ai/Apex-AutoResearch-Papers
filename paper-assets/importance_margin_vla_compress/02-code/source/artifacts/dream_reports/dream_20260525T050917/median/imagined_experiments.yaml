  result_rationale: 'Median tier 下 π0.5 数据呈现三个关键 pattern：

    (1) Random cliff 是 Object-specific。Object suite 在 k=0.85-0.925 出现灾难性 dip (5%→10.8%→27.6%)，但
    Spatial 的 floor 保持在 54% 以上，Goal 在 k=0.9 仍有 61.7%。 这是因为 Object 任务需要精确的 object identity
    discrimination（视觉相似物体间区分）， 而 random 在 cliff zone 恰好破坏了 concentrated critical tokens。Spatial
    的关键信息 是分布式的（layout patches），Goal 的关键信息由 language 部分承载。

    (2) Axis-2 amplification 对 π0.5 表现为 REVERSED pattern：Goal 和 Spatial 在 k=0.9 random
    下反而 BETTER than Object（61.7% vs 10.2%）。这与 X-VLA 的 pattern 完全相反 （X-VLA Goal k=0.9
    比 Object 差 27.8pp）。原因：token-independent connector 下， pruning damage 是 local 的，不会
    cascade。Object 的 cliff 是 random sampling 的 统计效应（concentrated critical tokens），不是
    task complexity amplification。 因此 median tier 预测 π0.5 的 Axis-2 amplification <15pp（如果排除
    Object cliff zone）， 需要在 paper 中 qualify 2-axis framework 对 token-independent connector
    的适用性。


- name: CV Scaling Law — Spearman Correlation Across Conditions
  plan_id: c6_libero_suite_expansion
  description: 'CV 作为 pruning strategy predictor 的 Spearman correlation 分析。 Median
    tier 预测 abs(Spearman) 在 0.6-0.85 之间。


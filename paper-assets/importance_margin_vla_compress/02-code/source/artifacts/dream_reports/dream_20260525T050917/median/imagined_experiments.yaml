- name: OpenVLA VTC M-Sweep (M=32/64/96) — Training Convergence Test
  plan_id: c4_ext_openvla_msweep
  description: 'OpenVLA 上 VTC-only training（不冻结 backbone），测试不同 M 值。 Training 已 failed/killed

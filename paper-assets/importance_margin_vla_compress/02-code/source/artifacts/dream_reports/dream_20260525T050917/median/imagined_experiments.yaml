    Object (recovery 1.015): VTR 在 Object 上 recovery 最稳定，因为 Object 任务的 visual discriminability
    需求可以被 re-encoded tokens 完整保留——pixel-shuffle 的 spatial entanglement 是 Object failure
    的唯一原因，VTR 修复了这个 entanglement。

    Spatial (recovery 1.193): 看似超过 baseline 但需注意 baseline 是 official checkpoint (44.6%)
    vs VTR 是 LoRA-FT + VTC (53.2%)——实际上是不同 training pipeline 的差异， 不应解读为 VTR 超越。Paper
    中需要用 recovery from 0% 而非 absolute comparison。

    Goal (recovery 0.928): 轻微低于 baseline（-4.4pp），因为 VTR 是在 Object suite 训练的， Goal
    的 multi-step task structure 引入了 distribution shift。Token re-encoding 恢复了 spatial
    information 但无法完全补偿 task-distribution mismatch。

    Long (predicted 0.956): Long 的 baseline 最低（36.6%），VTR 的 re-encoding 在 simple manipulation
    primitives 上有效，但 Long 需要跨多个 sub-goal 的 temporal coherence， VTR 的 per-step re-encoding
    无法显式捕捉 cross-step dependencies。预测 recovery ~35%， 略低于 baseline 但远高于 0%。


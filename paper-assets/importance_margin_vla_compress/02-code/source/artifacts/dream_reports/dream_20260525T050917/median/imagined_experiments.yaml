    cv_vs_l2norm_random_gap_k03_spearman: 0.45
    cv_vs_l2norm_random_gap_k03_p_value: 0.15
    cv_strategy_abs_spearman_mean: 0.74
    n_models_k05: 3
    n_suites_k05: 1
    datapoints_k05:
    - model: pi0.5
      cv: 0.055
      gap_pp: -35.4
    - model: X-VLA
      cv: 0.151
      gap_pp: -26.9
    - model: OpenVLA
      cv: 0.215
      gap_pp: 1.8
    k05_gap_monotonic: true
    k07_gap_monotonic: true
    k03_gap_monotonic: false
  result_rationale: 'CV scaling law 的 Spearman correlation 0.74 落在 median tier range
    [0.6, 0.85] 中。

    k=0.5 是最 clean 的 scaling law validation point：3 个 model 的 L2norm-random gap 与
    CV 呈单调关系（-35.4pp → -26.9pp → +1.8pp as CV increases 0.055 → 0.151 → 0.215）。 Spearman
    = 0.82，因为只有 3 个 data points 所以 p-value 边缘显著。

    k=0.7 作为 confirmatory second row：pattern 一致但 gap magnitudes 小（-22.2 → -6.5 → +5.4），
    Spearman = 0.75。

    k=0.3 BREAKS the scaling law：π0.5 reversal (+18.9pp L2norm wins) 但 X-VLA random
    仍大幅领先 (+42.3pp)。这不是 CV 不好，而是 absolute token budget 的交互效应： π0.5 k=0.3 保留 230 tokens（大
    budget），X-VLA k=0.3 保留 15 tokens（小 budget）。 Large budget + low CV = L2norm 可以
    fragment clusters 恢复 diversity。 Small budget + mid CV = 无论如何都太少，random 保持 stochastic
    diversity 的优势。

    Paper strategy：k=0.5 作为 main table，k=0.7 作为 confirmatory。k=0.3 reversal 在 Discussion
    中说明，强调 ''CV predicts strategy preference at moderate compression (k=0.5-0.7);
    at extreme compression (k=0.3), absolute token budget introduces additional interaction''。Claim
    5 加限定 ''at moderate compression''。


- name: VTR/VTC on OpenVLA (MLP projector) — Universality Falsification
  plan_id: c4_ext_method_universality_openvla
  description: 'VTR M=128 已确认 0% SR（overfitting）。VTC-only M=32/M=64 training in progress。
    Median tier 预测 VTC-only 也失败，VTR 限于 pixel-shuffle。

    '
  expected_results:
    openvla_vtr_m128_20k_sr: 0
    openvla_baseline_object_sr: 74
    openvla_vtc_m32_sr: 0
    openvla_vtc_m64_sr: 0
    openvla_vtc_m96_sr: 0
    openvla_vtc_m32_train_loss: 2.5
    openvla_vtc_m64_train_loss: 2.4
    openvla_vtc_m96_train_loss: 2.45
  result_rationale: 'Median tier 预测 VTC-only M=32/M=64 也会失败，原因是 MLP projector tokens
    已经是 individually meaningful 的——re-encoding 增加了不必要的 bottleneck，导致 overfitting。

    具体机制：OpenVLA 的 3-layer MLP connector 将 SigLIP features 映射为 256 个独立的 vision tokens，每个
    token 保留了原始 spatial meaning。VTR/VTC 在这些 tokens 上 添加 cross-attention / MLP adapter
    作为 bottleneck，但这些 tokens 不需要 ''re-encoding''——它们的 spatial information 没有被 entangle。额外的
    bottleneck 反而限制了 information flow，导致模型 overfit 到 training set 的 action distribution。

    实际 training logs 显示 M=128 在 20K steps 后 output 是 identical action（所有 observation
    产生相同的 action sequence），这是 severe mode collapse 的 hallmark。 M=32/M=64 的更强 compression
    会加剧而非缓解这个问题。

    Training 失败的 root cause 也可能是 OpenVLA 的 7B model size 导致 VTC 的 22M params 相对过小（0.3%
    of model）——gradient signal 在 backprop 过程中被 diluted。

    这个 negative result 反而 strengthens 论文：VTR 的有效性是 connector-dependent 的， 验证了 ''connector
    determines both compressibility AND optimal compression strategy''。

    '

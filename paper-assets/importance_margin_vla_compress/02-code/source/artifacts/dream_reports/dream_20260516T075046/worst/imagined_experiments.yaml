- name: 'Training ablation: joint vs grad-isolated vs two-stage'
  plan_id: plan_004
  description: 'joint (v7) vs gradient-isolated (v8) vs two-stage (v8b) 三路对比，统一超参。

    '
  expected_results:
    v7_joint_G3_deploy_ratio: 3.19
    v7_joint_margin_ratio: 64.25
    v7_joint_eps001_preservation: 0.9124
    v7_joint_backbone_damage: true
    v8_grad_isolated_G3_deploy_ratio: 1.34
    v8_grad_isolated_margin_ratio: 50.2
    v8_grad_isolated_eps001_preservation: 0.923
    v8_grad_isolated_backbone_damage: false
    v8b_two_stage_G3_deploy_ratio: 0.87
    v8b_two_stage_margin_ratio: 93.23

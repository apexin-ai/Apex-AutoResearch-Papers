    importance ranking 做决策的方法都受益于更大的 margin；(2) 但 G3 也一致升高（+0.16~0.22）， 因为 IMM 的 margin
    loss 与各方法自身的 compression loss 存在 objective 冲突——IMM 鼓励 importance score 两极化（高分更高、低分更低），而
    FastV/VLA-IAP 等方法的内部 scoring 被 扰动后与 ACIS scoring 的 alignment 降低；(3) VLA-Cache
    的 G3 增幅最小（+0.16）因为其 cache-based 压缩天然保留了更多 temporal information，与 IMM 的 importance

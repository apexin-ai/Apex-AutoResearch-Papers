    中的 importance score。IMM 的 margin maximization 对此最有效（89% preservation）， 因为 margin
    大意味着 ranking 可以 tolerate 更大的 feature perturbation； (3) texture/object_color: 表面纹理和颜色变化对
    patch-level token 影响大，部分 token 的 visual feature 完全改变，ACIS 的 scoring 受干扰较大——preservation
    较低（84-86%）， SR 恢复到 49-52%； (4) distractor: 场景中添加干扰物是最具挑战性的维度——新物体引入全新 token，ACIS
    从未见过 这些 token 的 importance pattern，导致 preservation 最低（82%），SR 恢复也最弱（25%→45%）。
    但相比无 IMM 的 25%，45% 仍是显著改善； (5) background/table_color: 背景变化对 ACIS 影响较小（背景 token
    通常 importance 较低）， 所以恢复最好（38%→62%, 36%→58%）。

    总体 recovery ratio 为 63.9%——即 IMM 恢复了 compression 导致的 SR 下降的约 64%。 这不够支撑 "lossless"
    但足够支撑 "significant robustness improvement"。

    '

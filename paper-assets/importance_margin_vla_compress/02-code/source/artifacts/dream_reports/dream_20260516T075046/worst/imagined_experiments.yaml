    openvla_stage1_training_steps: 30000
    openvla_stage2_lora_rank: 16
    openvla_total_gpu_hours: 55
  result_rationale: 'OpenVLA (7B) 与 SmolVLA 的关键差异：(1) 模型容量大 4x，attention head 更多，token
    importance 分布更分散（entropy 更高），margin 提升倍数显著低于 SmolVLA（12.5x vs 93.2x）——因为 baseline
    margin 本身就更大（7B 模型的 attention 更 diffuse），改善空间小；(2) LoRA 适配 7B 模型的 expressiveness
    受限于 rank=16，无法完美补偿 ACIS prune 带来的信息损失，G3 因此更高（1.28）； (3) two-stage 训练收敛慢 2x，因为
    Stage1 中 ACIS 需要处理更大的 hidden dim（4096 vs 1536）， cross-attention 模块参数更多；(4) 但 preservation
    仍从 31% 提升到 86%——robustness 贡献 与模型规模关系不大，因为 margin maximization 的效果是 architecture-agnostic
    的。 G3=1.28 意味着 action loss 劣化 28%，映射到 SR 下降 ~13pp——在 worst 档的合理范围内。 cross_model_margin_ratio=12.5
    远低于 SmolVLA 的 93.2，说明 IMM 的绝对效果随模型规模递减， 但相对 robustness 贡献（preservation +55pp）仍然显著。


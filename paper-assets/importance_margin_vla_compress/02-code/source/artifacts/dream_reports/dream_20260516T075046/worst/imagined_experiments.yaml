- name: OpenVLA cross-model verification
  plan_id: plan_003
  description: 'IMM two-stage 在 OpenVLA (7B) 上复现，LIBERO 数据集。验证跨模型泛化。

    '
  expected_results:
    openvla_libero_baseline_sr: 0.7

tier: worst
narrative_guidance: '核心 reframe：放弃 ''lossless compression'' 和 ''denoising'' 叙事，转向
  ''robustness-efficiency Pareto frontier'' 视角。 新 story：现有压缩方法在 adversarial 下 catastrophically
  fail（preservation 33%），IMM 将其提升至 85-92%， 代价是 G3=1.1~1.3 的可控 degradation。这是一个 explicit
  tradeoff knob——通过调 margin loss weight 在 robustness-accuracy Pareto 上滑动。Claim 1 保留但弱化为
  ''design principle''（bound 指导训练目标选择， 不做 runtime certification）。Claim 2 改为 ''controlled
  degradation with certified robustness benefit''。 Claim 3 删除，替换为 ''task-adaptive
  compression ratio selection'' 实验。仍投 CoRL——robustness 在 deployment 场景的重要性本身足够撑 contribution，不依赖
  lossless 才 novel。需要加一个 Pareto 图作为 headline figure。

  '
imagined_experiments:
- name: Success rate evaluation on aloha_sim_insertion
  plan_id: plan_001
  description: 'aloha_sim_insertion 上 baseline vs v8b+prune(50%) vs v8b bypass，50+
    episodes 对比 success rate。 验证 action loss 差异是否反映在实际任务表现上。

    '
  expected_results:
    baseline_success_rate: 0.78
    v8b_prune50_success_rate: 0.68
    v8b_bypass_success_rate: 0.42
    random_prune50_success_rate: 0.35
    success_rate_delta_pp_prune_vs_baseline: -10
    success_rate_delta_pp_bypass_vs_baseline: -36
    episodes_evaluated: 50
    baseline_action_loss: 0.004063
    v8b_prune50_action_loss: 0.003538
    action_loss_vs_sr_correlation: nonlinear — 13% lower loss maps to 10pp lower SR
  result_rationale: '在 worst 档下，action loss 与 success rate 之间存在强烈的非线性关系。v8b+prune(50%)
    的 action loss 比 baseline 低 13%（0.00354 vs 0.00406），但 success rate 反而下降 ~10pp（0.68
    vs 0.78）。 原因：(1) action loss 是 batch 平均值，掩盖了关键时间步上的 tail error——插入任务的最后 5% 步骤
    (insertion phase) 对成功率有决定性影响，而这些步骤恰好需要被 prune 掉的 fine-grained token 信息； (2) two-stage
    训练使 ACIS 在 Stage1 时仅优化 margin，未见过 backbone 的 action head gradient， 导致 importance
    scoring 对 action-critical token 的 recall 不完美；(3) G3<1.0 的 action loss "改善"实际上来自
    action 分布被压窄（variance reduction），在 open-loop evaluation 中看似更好， 但在 closed-loop
    rollout 中缺乏对 out-of-distribution 状态的应对能力。bypass 模式成功率极低（0.42） 证实 backbone 确实被
    two-stage 第二阶段的 LoRA 适配到了依赖 ACIS mask 的模式。这一结果直接暴露 了 "lossless compression" 叙事的脆弱性——loss
    低不等于 task performance 好，必须转向 Pareto tradeoff 叙事。

    '
  tables:
  - name: 'Table 1: Success Rate vs Action Loss on aloha_sim_insertion'
    columns:
    - Method
    - Action Loss
    - Success Rate (%)
    - Δ SR (pp)
    rows:
    - - Baseline (no compression)
      - 0.00406
      - 78
      - —
    - - v8b + ACIS prune 50%
      - 0.00354
      - 68
      - -10
    - - v8b bypass (no ACIS)
      - 0.01865
      - 42
      - -36
    - - v8b + random prune 50%
      - 0.01797
      - 35
      - -43
  figures_description:
  - 'Scatter plot: x-axis = action loss (log scale), y-axis = success rate (%). 四个点标注方法名。关键
    annotation: baseline 和 v8b+prune 在 loss 轴上接近但 SR 差 10pp， 用红色虚线连接并标注 "nonlinear
    gap"。图说明 action loss 不是 success rate 的可靠代理指标。

    '
  analysis: '此结果是 worst 档最关键的数据点。10pp 的 SR 下降虽然在 [-15, -5] 范围内偏中间，但足以让 "lossless"
    claim 完全站不住。叙事需要 pivot：不再说 "compression improves performance"，而是 "IMM 以可控的 ~10pp
    SR 代价换取 preservation 从 33% 提升到 89%——在 adversarial deployment 场景下 这是净收益"。random
    prune 的 35% SR 证明 ACIS 的 importance scoring 仍有显著价值（68% vs 35%）， 这是保留的正面结果。bypass
    的 42% 说明 backbone 对 ACIS 有依赖，需要在 paper 中诚实讨论为 deployment overhead section。

    '

    retained_token_avg_attn_weight: 0.0045
    attn_weight_ratio: 0.69
    pruned_token_action_gradient_norm: 0.0012
    retained_token_action_gradient_norm: 0.0028
    gradient_ratio: 0.43
    attn_weight_ks_test_pvalue: 0.08
    gradient_ks_test_pvalue: 0.002
    attn_weight_distribution_overlap: 0.72
  result_rationale: '在 worst 档下，pruned 和 retained token 的 attention weight 差异不显著——这是
    "denoising" 叙事崩塌的关键证据：(1) attn_weight_ratio = 0.69，落入 worst 档 [0.5, 0.9] 范围，意味着
    被 prune 的 token 平均仍有 retained token 69% 的 attention weight——它们不是 "noise"，而是 "less
    important but still attended"；(2) KS test p=0.08 表示两个分布在 5% 显著性水平下 不可区分——审稿人会据此
    reject "denoising" claim；(3) distribution overlap 72% 进一步 确认大量 pruned token 的
    attention weight 与 retained token 范围重叠。 但 gradient correlation 讲了一个不同的 story：gradient_ratio
    = 0.43（p=0.002）表明 pruned token 对 action prediction 的 gradient contribution 确实低——ACIS
    学到的 importance 与 action-relevance 有 moderate correlation，只是这种 correlation 不通过
    attention weight 体现。这说明 ACIS 的 scoring 不是简单的 attention-based proxy，而是学了一个更 nuanced
    的 action-relevance measure——但审稿人看到 attn_weight 数据后可能不会被 gradient 数据说服， 因为 "denoising"
    的直觉是 pruned token 应该有 very low attention（ratio < 0.3）。


  figures_description:
  - 'Radar chart (headline figure 候选): 7 个维度为 7 个轴，三条线：no-compress (blue, outermost),
    IMM+compress (green, middle), compress-only (red, innermost)。IMM 的 green 线显著大于
    red， 接近 blue。visual impact 强，适合做 teaser figure。

    '
  - 'Pareto 图（headline figure）：x-axis = avg SR across 7 perturbations, y-axis = compression
    speedup (×)。5 个点：no-compress (1×, 67.1%), compress-only (2×, 31.9%), IMM+compress
    (2×, 54.4%), AT+compress (2×, 38%), smoothing+compress (1.25×, 41%)。 IMM dominates
    the Pareto frontier for robustness-efficiency。

    '
  analysis: '这是 worst 档的 headline result。Pareto 叙事在此图上最有说服力：compress-only catastrophically
    fails（SR 从 67% 降到 32%），IMM 将其恢复到 54%——不是 lossless，但是唯一在保持 2× speedup 的同时提供 >50%
    SR 的方法。Headline sentence: "On LIBERO-Plus, IMM-trained SmolVLA achieves 54.4%
    average success rate under 50% token compression across 7 perturbation dimensions,
    recovering 64% of the compression-induced performance loss while improving adversarial
    preservation from 32% to 87%." 这比 "lossless" 叙事更 defensible——审稿人无法质疑 "recovery"
    因为 baseline 数据是 concrete 的。风险：54.4% 的绝对 SR 偏低，审稿人可能质疑 practical value。 应对：强调 compress-only
    的 32% 是 "deployment-blocking"，而 54.4% 是 "deployment-viable" for many tasks，且可通过调高
    k_ratio（如 0.7）进一步提升到 ~60% 代价是 speedup 降到 1.43×。'

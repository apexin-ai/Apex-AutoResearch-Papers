    v8b_two_stage_backbone_damage: false
    unified_hyperparam_v8b_G3: 0.89
    unified_hyperparam_v8_G3: 1.38
    unified_hyperparam_v7_G3: 3.25
  result_rationale: '三种训练模式的核心差异在于 gradient flow：(1) v7 joint 允许 margin loss 的 gradient
    回传到 backbone，直接损害 action prediction head——G3=3.19 证实了 catastrophic co-adaptation，backbone
    的 action loss 能力被 margin 目标 "劫持"；(2) v8 grad-isolated 切断了到 backbone 的 gradient
    但 ACIS 和 backbone 仍在同一 forward pass 中共同适配，导致 implicit co-adaptation（backbone 的
    representation 在训练过程中 drift 以适应 ACIS 的 mask pattern），G3=1.34 好于 v7 但仍有 显著 degradation；(3)
    v8b two-stage 完全解耦——Stage1 冻结 backbone 只训 ACIS（此时 backbone representation 完全不变），Stage2
    冻结 ACIS 只训 LoRA（backbone 适配已有的 mask pattern 而非 被迫改变 representation）。在 worst 档下，统一超参后
    v8b 的 G3 可能微升到 0.89（从 0.87）， 仍是唯一 G3<1.0 的方案，但这仅限 aloha 任务。margin_ratio 在 three-way
    对比中 v8b 最高 （93.2x vs 64.3x vs 50.2x），这是因为 two-stage 的 Stage1 是 pure margin optimization
    without backbone interference。preservation 三者接近（0.89~0.92），说明 robustness 贡献 不强依赖于训练模式——margin
    loss 本身就有效，差异主要在 backbone quality preservation。


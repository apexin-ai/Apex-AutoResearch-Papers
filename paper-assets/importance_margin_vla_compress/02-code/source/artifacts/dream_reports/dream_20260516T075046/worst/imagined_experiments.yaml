    median_margin_baseline: 0.01
    baseline_theoretical_flip_prob_eps001: 5.35
    baseline_empirical_flip_rate_eps001: 0.665
  result_rationale: 'Formal bound P(flip) ≤ k·ε·L/Δ_k 在 worst 档下表现为 vacuous-to-moderate：
    (1) Lipschitz constant L 使用 spectral norm 估计 = 1.07（与已有数据一致），这是 upper bound， 实际
    local Lipschitz（empirical = 0.14）低 7.6x，导致 theoretical bound 系统性偏松； (2) 在 ε=0.01
    时，theoretical P(flip) = 144 × 0.01 × 1.07 / 0.503 ≈ 0.076（假设 k=144/2=72 对 288
    个 token），而 empirical flip rate 仅 0.008，tightness ratio = 9.5；但如果按 worst 档 要求关注
    bound_tightness_ratio_eps001 = 15~50，需要考虑 per-token worst case 而非 average—— 取
    margin 分布的 10th percentile（Δ_k ≈ 0.08）重新计算得 bound ≈ 0.038，empirical 在该 margin
    区间的 flip rate ≈ 0.002，ratio = 19.0，落入 worst 档范围。审稿人会看到两个问题： (a) spectral norm

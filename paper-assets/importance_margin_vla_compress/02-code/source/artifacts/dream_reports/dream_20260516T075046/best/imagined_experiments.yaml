    net_latency_saving_pct: 36.5
    memory_saving_with_prune_pct: 42
  result_rationale: 'ACIS 是 lightweight cross-attention module：2-layer MLP + single
    cross-attention head。 参数量 ~2.3M 对比 SmolVLA backbone 256M 只有 0.9% overhead。

    FLOPs 更低（1.4%）因为 ACIS 只做一次 forward pass per image（scoring all tokens）， 而 backbone
    对每个 token 做多层 transformer 计算。

    关键卖点：ACIS 引入 0.9ms 延迟但 50% token pruning 节省 16.5ms（256→128 token 减少后续 transformer
    层的 O(n²) attention 计算），net saving 36.5%。

    Memory 节省 42%（不完全是 50% 因为 ACIS 本身占用少量 memory + 非 token 参数不变）。

    这将 RC4 的 concern 彻底翻转：ACIS 不是 overhead，是 deployment accelerator。


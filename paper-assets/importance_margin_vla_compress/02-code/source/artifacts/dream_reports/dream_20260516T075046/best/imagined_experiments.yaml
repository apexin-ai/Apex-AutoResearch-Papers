- name: Defense Comparison (IMM vs AT vs Smoothing vs Jacobian)
  plan_id: plan_007
  description: 'IMM vs adversarial training vs randomized smoothing vs RobustVLA Jacobian
    regularization, 在 LIBERO-Plus 7 维扰动下对比 success rate。

    '
  expected_results:
    imm_clean_sr: 0.76
    imm_perturbed_sr: 0.71
    imm_sr_drop_pp: 5
    adv_training_clean_sr: 0.68
    adv_training_perturbed_sr: 0.63
    adv_training_sr_drop_pp: 5
    rand_smoothing_clean_sr: 0.7
    rand_smoothing_perturbed_sr: 0.61
    rand_smoothing_sr_drop_pp: 9
    jacobian_reg_clean_sr: 0.72
    jacobian_reg_perturbed_sr: 0.65
    jacobian_reg_sr_drop_pp: 7
    no_defense_clean_sr: 0.71
    no_defense_perturbed_sr: 0.48
    no_defense_sr_drop_pp: 23
  result_rationale: 'IMM 的独特优势：clean performance 不降反升（denoising effect），同时 robustness
    最强。

    Adversarial training：clean SR 降 3pp（AT 的经典 accuracy-robustness tradeoff）， perturbed
    SR 改善但不及 IMM，因为 AT 只在 training distribution 的 adversarial examples 上 鲁棒，对 LIBERO-Plus
    的 7 维 out-of-distribution 扰动（lighting, camera, texture 等） 泛化有限。Less Is More (2601.12042)
    已指出 AT 对 VLA 的 ''only limited protection''。

    Randomized smoothing：引入 inference-time noise 使 prediction 更 smooth， 但 VLA 的 action
    space 对 noise 敏感——smooth prediction ≠ correct prediction， 导致 clean SR 和 perturbed
    SR 双降。

    Jacobian regularization：限制 output 对 input 的灵敏度，clean SR 轻微下降（-1pp）， robustness
    中等——Jacobian reg 是 global 的，不区分 important vs unimportant tokens， 因此在 preservation
    维度不如 IMM 的 margin-specific optimization。

    IMM 是唯一同时满足 (1) clean SR ≥ baseline 和 (2) perturbed SR drop < 10pp 的方法。

    '
  tables:
  - name: 'Table 8: Defense Comparison (LIBERO-Avg, SmolVLA)'

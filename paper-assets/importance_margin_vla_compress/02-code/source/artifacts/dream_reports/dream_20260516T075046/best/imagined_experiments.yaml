  result_rationale: 'LIBERO-Plus 的 7 维扰动测试不同 failure mode：

    Lighting/background/texture 是视觉 domain shift——IMM 最强的防线。ACIS 的 importance scoring
    基于 semantic relevance 而非 visual appearance，所以光照/纹理变化影响 appearance 但不影响 importance
    ranking。SR drop 仅 1-3pp。

    Camera pose：中等影响（SR drop 6pp）。视角变化改变了 token 的空间含义—— 原本的背景 token 可能变成 object token，ACIS
    的 importance scoring 需要一定 generalization。IMM 训练提供了 margin buffer 使小幅视角变化仍保持 top-k
    稳定。

    Distractor：引入新物体干扰 action prediction。IMM 的 denoising 效果在这里最直接—— distractor 物体对应的
    token 被 ACIS 标为低重要性并 pruned，相当于自动滤除干扰。 SR drop 4pp。

    Physics：最难（SR drop 8pp）因为 physics 扰动改变了 action dynamics 而非视觉输入， IMM 的 token-level
    保护对此帮助有限。但 50% 压缩减少了 action head 的 input noise， 仍然优于 no-defense。

    Combined：所有 7 维同时扰动。SR drop 14pp 显著但仍有 62%（vs no-defense 35%）， 改善 27pp。这是 headline
    number。


    ratio_08_G3: 0.91
    ratio_09_G3: 0.97
    sweet_spot_range: 0.4-0.6
    optimal_ratio: 0.55
    optimal_G3: 0.83
    ratio_03_success_rate: 0.74
    ratio_05_success_rate: 0.88
    ratio_06_success_rate: 0.9
    ratio_07_success_rate: 0.87
    ratio_09_success_rate: 0.83
  result_rationale: 'Pruning ratio sweep 揭示 U 型曲线，sweet spot 在 0.4-0.6：

    ratio=0.3（保留 30% token）：过度压缩，开始丢失 task-critical token。 即使 ACIS 的 importance ranking
    完美，30% 的 token 可能不足以覆盖 action-relevant 的 spatial region。G3=1.18 > 1.0 说明 compression
    harm > denoising benefit。

    ratio=0.4-0.6：denoising sweet spot。被删除的 token 主要是低 attention weight 的 背景 token（桌面纹理、远处物体），移除它们减少了
    action head 的 distractor， 同时保留了充足的 task-relevant token。G3 在 0.55 处达到最优 0.83。

    ratio=0.7-0.9：保留过多 token，denoising effect 减弱（noise token 大量保留）， G3 趋向 1.0。ratio=0.9
    时几乎等同于 no pruning，G3=0.97 反映了微弱的 regularization effect（移除最不 important 的 10% token
    仍有轻微降噪作用）。

    这个 U 型曲线是 denoising claim 的 strongest mechanistic evidence： 如果 G3<1.0 是 evaluation
    artifact，曲线应该是单调递增的（越多 token 越好）。 U 型曲线证明存在 optimal pruning point where denoising
    > information loss。


tier: best
narrative_guidance: '原始 framing 完全成立——IMM 提供首个 certified robustness + lossless compression
  for VLA， 三条 claim 均有跨模型跨 benchmark 支撑。Denoising claim 从 empirical observation 升级为
  mechanistic finding（pruned token attention weight 显著低，gradient contribution 近零）。
  Paper lead with ''provably robust AND performance-enhancing compression''。CoRL 投稿无需降低任何
  claim 强度。 Formal bound tightness ratio < 3x 使 certified robustness 不仅是理论装饰而是实用部署判据。
  Cross-model (SmolVLA + OpenVLA) × cross-benchmark (aloha_sim_insertion + LIBERO)
  的 2×2 矩阵 让审稿人无法以 ''single data point'' 驳回。

  '

- name: Success Rate Evaluation (aloha_sim_insertion)
  plan_id: plan_001
  description: 'aloha_sim_insertion 上 baseline vs v8b+prune(50%) vs v8b bypass，50+
    episodes rollout 对比 success rate，验证 action loss 改善是否反映在任务表现上。

    '

    baseline_success_rate: 0.82
    v8b_prune50_success_rate: 0.88
    v8b_bypass_success_rate: 0.56
    random_prune50_success_rate: 0.6
    episodes_per_condition: 60
    success_rate_delta_pp: 6
    p_value_prune_vs_baseline: 0.031
  result_rationale: 'MVP 已确认 acis_prune50 action loss (0.003538) 低于 baseline (0.004063)，G3_deploy=0.8679。
    Action loss 与 success rate 的单调关系在 aloha_sim_insertion 这类 low-dimensional insertion
    task 上 高度可靠——loss 降低 ~13% 对应 success rate 提升 ~6pp。Baseline 82% 是 SmolVLA 在此 task
    的 典型水平（256-token full context）。Pruning 后 88% 的提升来自 denoising effect：ACIS 移除的 token
    携带视觉噪声（背景、桌面纹理），减少了 action head 的分心。Bypass（不经 ACIS 直接送全 token） 的 56% 反映 ACIS training
    对 backbone representation 的微弱扰动——backbone 在 stage1 被冻结 但 stage2 LoRA 适配了 ACIS-pruned
    的 token 分布，全 token 输入时分布 mismatch。 Random prune 60% 因为随机删除了 ~50% task-relevant
    token，action prediction 严重退化。


- name: Mask Ratio Annealing Ablation (v8c)
  plan_id: plan_010
  description: 'mask ratio annealing (0.9→0.5) vs two-stage 固定 0.5 对比， 验证 curriculum-style
    pruning 是否优于固定比例。

    '
  expected_results:
    v8c_annealing_action_loss: 0.00362
    v8c_annealing_G3_deploy: 0.89
    v8c_annealing_G1_margin: 88.7
    v8b_fixed_action_loss: 0.00354
    v8b_fixed_G3_deploy: 0.87
    v8b_fixed_G1_margin: 93.2
    annealing_advantage: marginal, not significant
  result_rationale: 'Annealing 的假设是 curriculum-style training（先 prune 少量 → 逐渐增加）让
    ACIS 从 easy case 学起。实际上 two-stage 已经解决了 co-adaptation——ACIS 在 frozen backbone
    上独立训练时，importance landscape 已经 well-separated，不需要 curriculum。

    V8c 的 G3=0.89 略逊于 v8b 的 0.87，可能因为 annealing 的前期高 keep-ratio (0.9) 阶段浪费了 training
    budget 在近乎 trivial 的 ranking task 上（只 prune 10% 时几乎 任何 scoring function 都行），导致
    ACIS 在后期 0.5 ratio 上的训练不足。 G1 margin 88.7 vs 93.2 也轻微落后。

    结论：annealing 不是必要的。Two-stage 的简洁性（固定 0.5）既是优点也是结果最优。 这简化了 method presentation——不需要额外的
    annealing schedule 超参数。


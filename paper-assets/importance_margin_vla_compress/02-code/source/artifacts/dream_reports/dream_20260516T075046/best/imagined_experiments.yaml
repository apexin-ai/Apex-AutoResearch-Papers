  analysis: 'Formal bound 在 ε=0.01-0.05 的实用范围内 tightness ratio < 2x，远优于 best-tier
    要求的 < 3x。 这意味着 bound 有实际部署价值——可以作为 deployment safety criterion： 给定 expected perturbation
    level ε，直接计算 top-k stability guarantee。 ε=0.1 时 bound 开始 loose 但 violation 本身也高，说明需要更强的
    training（不是 bound 的问题）。

    '

# OpenVLA Smart Compress: cross-attention pooling to compress 256 vision tokens -> M tokens.
# Trainable: VisionTokenCompressor only.
# Frozen: DINOv2 + SigLIP + projector + Llama-2 7B.
#
# OpenVLA architecture:
#   DINOv2+SigLIP -> MLP projector -> 256 tokens x 4096
#   -> VTC (trainable) -> M tokens x 4096
#   -> Llama-2 7B (frozen) -> autoregressive action tokens

model:
  name: openvla
  pretrained: "openvla/openvla-7b"
  dtype: "float32"              # fp32 fits in 96GB VRAM

compressor:
  hidden_dim: 4096              # Llama-2 7B hidden size
  num_queries: 32               # M = 32 compressed tokens (87.5% compression from 256)
  num_heads: 16                 # 4096/16 = 256 dim per head
  num_layers: 2                 # 2 cross-attention + FFN blocks
  dropout: 0.1

dataset:
  repo_id: "HuggingFaceVLA/libero"
  action_chunk_size: 1          # OpenVLA predicts single-step actions
  features:
    state_dim: 8
    action_dim: 7
    cameras:
      - "observation.images.image"      # agentview
      # - "observation.images.image2"   # uncomment for dual-camera (512 -> M compression)
  # action_stats:               # uncomment and fill with dataset statistics
  #   min: [-0.5, -0.5, -0.5, -3.14, -3.14, -3.14, -1.0]
  #   max: [0.5, 0.5, 0.5, 3.14, 3.14, 3.14, 1.0]

training:
  total_steps: 100000
  batch_size: 4
  eval_batch_size: 1
  num_workers: 4
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  warmup_steps: 1000
  decay_lr: 2.5e-6
  grad_clip: 10.0
  eval_every: 5000
  save_every: 10000
  log_every: 50
  output_dir: "checkpoints/openvla_sc_m32"
  seed: 42

evaluation:
  max_eval_batches: 50

narrative_guidance: 'Reframe为"cautionary tale + diagnostic tool"。核心论点从clean 4-class
  taxonomy 退守到两个不可动摇的极端：pixel-shuffle catastrophic collapse（数据铁证） 和 pure linear projection
  immunity（π0 offline数据）。中间类（MLP graded、 threshold-graded）承认pruning method confound，降级为"suggestive
  evidence"。 论文重心转向：(1) 首次发现pixel-shuffle对任何pruning都catastrophic—— 这一发现alone就值一篇paper（4篇concurrent
  work全忽略了pixel-shuffle VLA）； (2) CV诊断作为practitioner zero-cost工具（不依赖跨模型公平比较）； (3)
  VTR作为pixel-shuffle专用修复。标题改为"Token Pruning Catastrophically Fails on Pixel-Shuffle
  VLAs: Diagnosis and Recovery"——收窄scope但claims 更bulletproof。仍冲CoRL，不降级venue。

  '
imagined_experiments:
- name: OpenVLA L2-norm pruning k=0.95
  plan_id: d108_unified_pruning_protocol
  description: OpenVLA L2-norm importance-based pruning at k=0.95 (keep 95%), 500
    episodes LIBERO-Object. 与random k=0.95 (69.4%) 对比。
  expected_results:
    overall_sr: 52.0
    ci_95_lower: 47.7
    ci_95_upper: 56.3
    n_episodes: 500
    random_k095_reference_sr: 69.4
    delta_vs_random_pp: -17.4
  result_rationale: 'L2 norm在MLP projector上系统性劣于random。3-layer MLP (GELU)的非线性混合 使L2
    norm与task relevance解耦：GELU激活压缩后，low-norm token可能携带经过 非线性变换的关键spatial feature（幅度小但信息密度高），而high-norm
    token可能 被MLP放大但携带冗余信息。Random pruning保留信息的均匀采样，L2 norm则系统性 移除task-critical但low-magnitude的token。即使仅移除5%（约13个token），
    L2 norm选中的13个恰好rich in action-relevant info，导致17pp drop。 这暴露了跨模型比较的根本confound——OpenVLA用random测到69.4%，
    X-VLA用L2 norm测到99.0%，但方法差异贡献了约17pp。

    '
  tables: []
  figures_description: []
  analysis: '仅移除5% token即出现17pp gap，证实confound是系统性的而非个别k值偶然。

    '
- name: OpenVLA L2-norm pruning k=0.9
  plan_id: d108_unified_pruning_protocol
  description: OpenVLA L2-norm pruning at k=0.9 (keep 90%), 500 episodes LIBERO-Object
  expected_results:

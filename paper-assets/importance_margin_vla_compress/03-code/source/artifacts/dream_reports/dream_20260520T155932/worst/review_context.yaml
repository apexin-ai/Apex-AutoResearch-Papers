- name: X-VLA L2-norm pruning k=0.7 seed44
  plan_id: d108_unified_pruning_protocol
  description: X-VLA k=0.7 pruning with eval seed44, 500 episodes LIBERO-Object。原始seed42结果56.2%。测试cliff
    pattern跨seed稳健性。
  expected_results:
    overall_sr: 28.0
    ci_95_lower: 24.2
    ci_95_upper: 32.1
    n_episodes: 500
    original_seed42_sr: 56.2
    delta_vs_seed42_pp: -28.2
    per_task_sr_sketch:
      task_0_alphabet_soup: 30
      task_1_cream_cheese: 0
      task_2_salad_dressing: 68
      task_3_bbq_sauce: 20
      task_4_ketchup: 8
      task_5_tomato_sauce: 42
      task_6_butter: 4
      task_7_milk: 16
      task_8_chocolate_pudding: 0
      task_9_orange_juice: 92
  result_rationale: 'k=0.7是X-VLA degradation curve的最陡峭转变区间：k=0.9 (97.6%) → k=0.7 (56.2%)
    跨越了40pp的cliff。在这个phase transition point，微小的perturbation会导致 巨大的outcome variance。Seed44改变了两个关键因素：(1)
    eval episode的初始state 分布——某些task的初始object placement使得pruning后的degraded policy恰好无法
    完成（如task_1 cream_cheese在seed42下k=0.7=2%已极低，seed44可能直接0%）； (2) 虽然L2 norm ranking在deterministic
    forward pass中是固定的，不同episode 的observation sequence触发不同的attention pattern，使得同一组"被保留"的token
    在不同episode中的effective information coverage不同。Seed42恰好采样到6个 relatively robust tasks
    (>60%)，seed44则大多数task都落入cliff的collapse侧。 28%远低于56.2%的-1σ范围——如果cliff point的variance如此之大，
    单seed的56.2%不能作为architectural characterization。

    '
  tables:
  - name: 'Table: X-VLA k=0.7 Cross-Seed Comparison'
    columns:
    - metric
    - seed42
    - seed44
    - delta
    rows:
    - - overall_SR
      - 56.2
      - 28.0
      - -28.2
    - - tasks >60%
      - 6
      - 2
      - -4
    - - tasks <10%
      - 3
      - 4
      - 1
    - - per_task_std
      - 38.5
      - 28.4
      - '-'
  figures_description:
  - 'X-VLA per-task SR并排柱状图 (seed42 blue, seed44 orange) at k=0.7。 可视化每个task的seed
    sensitivity。部分task（task_2, task_9）跨seed稳定， 但大多数task seed44大幅下降，说明cliff point的per-task
    pattern 高度seed-dependent。

    '
  analysis: '28pp delta（56.2→28.0）远超typical seed variance（通常<8pp for 500 episodes）。
    这不是统计噪声——cliff位置本身是seed-sensitive的。对于seed42，effective cliff 在k≈0.75；对于seed44，cliff左移到k≈0.85。这意味着X-VLA的"threshold-graded"
    分类中，threshold位置有~10%的k-ratio uncertainty。论文不能用单seed的k=0.7=56.2% 作为precise characterization，只能说"cliff
    somewhere in k∈[0.7, 0.9]"。 在worst叙事中：X-VLA中间类降级为"suggestive of threshold behavior
    with high variance at transition"，不再是clean evidence。

    '

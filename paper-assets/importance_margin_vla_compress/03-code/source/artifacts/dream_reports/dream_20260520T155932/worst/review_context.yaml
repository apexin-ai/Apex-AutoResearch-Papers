    - - 64
      - 50%
      - 2
      - near-collapse (rare sporadic success)
    - - 96
      - 25%
      - 0
      - action collapse
    - - 128
      - 0% (passthrough)
      - 0
      - confirmed D109 — action collapse at 20K
  figures_description:
  - '对比图：SmolVLA VTC M-curve (flat ~58%) vs OpenVLA VTC M-curve (flat ~0%)。 两条horizontal
    lines在完全不同的level。SmolVLA侧标注"re-encoding repairs spatial entanglement"；OpenVLA侧标注"re-encoding
    destroys token independence"。 强化VTR是connector-specific solution的结论。

    '
  analysis: 'M=32/64/96/128全部失败（0-2% SR），排除了"M=128压缩太极端"的alternative explanation。VTR在MLP
    projector上的failure是fundamental的，不是hyperparameter tuning问题。在worst叙事中，这实际上是一个clean
    result：VTR是pixel-shuffle 专用修复方案，对MLP projector反而harmful。Claim 4的scope必须限定为 "VTR
    recovers pixel-shuffle cliff-edge"而非"universal compression"。 这收窄了method contribution但使claim更bulletproof。

    '

  result_rationale: '移除10%时gap扩大到18pp。L2 norm移除的26个token中包含更多action-critical 信息。MLP
    projector的GELU非线性使得norm分布与gradient-based importance 呈弱负相关——plan_009_token_importance已证实spearman仅0.407，意味着
    L2 norm是一个misleading proxy。Random在期望值上保留每个importance quartile 的equal representation，而L2
    norm over-prune低norm quartile（恰好是 gradient-important的那部分）。18pp gap在500 episode
    Wilson CI下 高度显著（各自CI约±4pp，不重叠）。

    '

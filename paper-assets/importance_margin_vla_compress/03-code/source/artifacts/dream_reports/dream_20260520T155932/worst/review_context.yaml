- name: OpenVLA VTC-only M=32 eval
  plan_id: c4_ext_method_universality_openvla
  description: VTC-only (仅训练VTC module, freeze LLM backbone) M=32 on OpenVLA, 100K
    steps后LIBERO-Object eval
  expected_results:
    overall_sr: 0.0
    ci_95_upper: 0.76
    n_episodes: 500
    failure_mode: action collapse — identical output every step
    training_loss_100k: 0.028
    eval_loss_100k: 0.14
  result_rationale: '与M=128 (D109, 0% SR at 20K steps) 相同的failure mode扩展到M=32。 根因：MLP
    projector输出的256个token已经是individually meaningful的 action-relevant representations——每个token经过3-layer
    MLP (GELU) 独立映射了对应vision patch的信息。VTC cross-attention试图将256个token 重新编码为32个query
    token时，必须决定如何aggregate信息。但在VTC-only 训练模式下，frozen LLM backbone无法适应VTC输出的新representation
    format。 VTC学到的是最小化training set的reconstruction loss，导致它过拟合到 训练分布的specific token
    pattern——在eval时面对unseen observation， VTC输出near-identical compressed representation
    regardless of input， LLM consequently产生identical action sequence。M=32比M=128更aggressive
    的压缩在此处无help——问题不是compression ratio而是VTC在MLP projector token上的fundamental mismatch。Pixel-shuffle
    token是spatially entangled的 （CV=0.314，information分布在channel维度），VTC可以学到有效的spatial
    re-organization；MLP projector token是partially independent的 （CV=0.215，information在individual
    token level有meaning），VTC的 cross-attention机制反而破坏了这种independence。

    '

  figures_description:
  - '双线对比图：OpenVLA random (blue) vs L2-norm (red) degradation curves, x=k ratio, y=SR%。两条线之间shaded
    area标注"pruning method confound"。 Gap在k=0.7-0.95最宽（17-18pp），k=0.3处因floor effect收窄至~14pp。
    右侧annotation box: "Cross-model comparison between OpenVLA-random and X-VLA-L2norm
    curves is confounded by ~17pp method effect."


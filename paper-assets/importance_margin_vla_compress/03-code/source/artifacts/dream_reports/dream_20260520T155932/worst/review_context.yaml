  analysis: 'L2 norm全面劣于random（平均约17pp），暴露了核心confound：现有OpenVLA degradation curve用random测得，X-VLA
    curve用L2 norm测得。X-VLA k=0.9 的97.6%如果换用random可能更高（或保持），但OpenVLA k=0.9的62%如果换用 L2

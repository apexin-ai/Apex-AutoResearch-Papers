    result_rationale: 'M=64保留25%的token容量（64/256），压缩率与SmolVLA VTC M=32相同（75%）。 相比M=32，64个queries覆盖256个input
      tokens的信息更完整， LLM的attention pattern从256→64的分布偏移也更温和。 52% = baseline的70%保留率，对比random
      pruning k=0.3（keep 77 tokens，20.6%） 和k=0.5（keep 128 tokens，37.4%），VTC M=64以更少tokens（64
      vs 128） 超出14.6pp。M=32→M=64的+7pp增益符合信息论预期—— MLP tokens信息分布相对均匀（CV=0.215），更多queries
      = 更少信息丢失。

      '
    tables: []
    figures_description: []
    analysis: '跨connector对比：SmolVLA VTC M=32 75%压缩=60.1%，OpenVLA VTC M=64 75%压缩=52%。
      SmolVLA更高是因为re-encoding修复了pixel-shuffle纠缠（本质是损坏修复）， OpenVLA则是纯信息压缩（tokens已经可用，压缩后部分信息不可避免丢失）。
      这种差异恰好支持connector-dependent VTR ceiling的叙事。

      '

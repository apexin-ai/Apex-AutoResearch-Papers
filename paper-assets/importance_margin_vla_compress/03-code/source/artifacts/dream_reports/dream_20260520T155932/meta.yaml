  - name: X-VLA k=0.7 seed44 replication
    plan_id: c1_xvla_cliff_pattern
    description: 'X-VLA k=0.7 L2-norm pruning的seed44复现评估。原seed42=56.2%。 验证threshold-graded
      cliff pattern的seed稳健性。

      '
    expected_results:

    ## R2 Review: Novelty and Related Work


    ### Summary

    Well-executed empirical study documenting an important architecture-dependent
    pruning failure mode, but the central "discovery" is largely predictable from
    first principles (pixel-shuffle = spatial folding = entanglement → pruning destroys),
    VTR is architecturally identical to Q-Former/Perceiver, and the CV diagnostic
    has insufficient validation. The paper reads as competent empirical confirmation
    of intuitions rather than generation of new ones.


    ### Strengths

    1. **Empirically clean central finding.** The four-class taxonomy is supported
    by five models across three connector families. The π0-vs-OpenVLA controlled comparison
    (same 256 SigLIP tokens, different connector, 63pp gap) convincingly isolates
    the causal factor.

    2. **Pixel-shuffle failure is a genuinely important negative result.** Replicated
    across seven pruning configurations, two checkpoints, three LIBERO suites. Given
    growing adoption of pixel-shuffle connectors (InternVL, SmolVLA, TinyVLA), this
    has real deployment implications.

    3. **Honest limitation disclosure.** Explicitly acknowledges π0 offline-only,
    reports pruning method confound, notes VTR fails on OpenVLA. Rare level of intellectual
    honesty.

    4. **Improved related work coverage.** Bibliography expanded to ~35 entries covering
    ViT pruning (DynamicViT, ToMe, EViT), VLM compression (FastV, LLaVA-PruMerge,
    TokenPacker, SparseVLM), VLA-specific methods (VLA-Cache, VLA-IAP), and concurrent
    works.

    5. **Confound exposures are methodologically useful.** The ~17pp L2-norm vs. random
    gap and 28pp seed variance provide important caution for future work.


    ### Weaknesses

    1. **(Major) Pixel-shuffle failure is predictable from first principles.** Each
    output token is a channel-concatenation of a fixed 4×4 spatial block — by construction,
    tokens carry non-redundant, spatially disjoint information. This is an architectural
    invariant deducible from the SmolVLA model card without experiments. The contribution
    is empirical confirmation and quantification, not discovery. Paper should acknowledge
    predictability explicitly.

    2. **(Major) VTR novelty is minimal.** Cross-attention with learnable queries
    compressing variable-length input to fixed-length output is exactly Q-Former (BLIP-2,
    2023), Perceiver Resampler (Flamingo, 2022). VTR is a 2-layer, 12-head cross-attention
    module — architecturally identical. The flat M-curve observation is interesting
    but is about the pathology (tokens need reorganization, not reduction), not a
    novel method. VTR failing on OpenVLA (0%) further limits generality.

    3. **(Major) CV diagnostic: 4 data points, zero validation.** The "continuous
    spectrum" is fitted on 4 models and validated on zero held-out models. Any monotone
    function through 4 points appears predictive. Missing RoboFlamingo would have
    been a critical 5th point. Should be presented as hypothesis, not validated diagnostic.

    4. **(Minor) Pruning method heterogeneity.** Cross-model quantitative comparisons
    (X-VLA k=0.7=57.2% vs OpenVLA k=0.7=49.0%) are not apples-to-apples due to different
    pruning methods.

    5. **(Minor) π0 "immune" label based on offline-only evidence.** The paper''s
    own X-VLA offline-to-closed-loop disconnect undermines confidence. "Immune" used
    throughout main text without qualification.

    6. **(Minor) Single benchmark.** Claims about "deployment implications" and "design
    guidelines" on one simulation benchmark. No real-robot evidence.

    7. **(Minor) Contribution inflation.** Listed 4 contributions, but taxonomy +
    CV diagnostic are tightly coupled observations, and offline metric disconnect
    is well-known. Fundamentally a 2-contribution paper: (a) architecture-dependent
    failure characterization, (b) VTR as partial pixel-shuffle fix.


    ### Questions for Authors

    1. Can you provide a theoretical argument for why CV thresholds generalize beyond
    these 4 models? What CV would you predict for InternVL''s 2×2 pixel-unshuffle?

    2. VTR M=128 passthrough gains +13pp over baseline. Would a simpler approach (1×1
    conv or MLP before LLM) achieve similar gains?

    3. VTR yields 0% on OpenVLA even in passthrough (M=128). Why does adding cross-attention
    destroy an already-functioning model? Would residual connections or gradual unfreezing
    help?

    4. How sensitive is CV to the importance scoring method (L2 vs. attention vs.
    gradient)?

    5. With 28pp seed variance at X-VLA k=0.7, is 3 seeds sufficient?


    ### Missing Related Work

    - H2O (Zhang et al., NeurIPS 2023) and StreamingLLM (Xiao et al., ICLR 2024):
    KV-cache eviction methods relevant to token importance analysis


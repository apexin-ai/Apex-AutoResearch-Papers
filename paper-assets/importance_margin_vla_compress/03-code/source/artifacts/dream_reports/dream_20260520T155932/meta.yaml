    # Dream Review Report: Token Pruning Catastrophically Fails on Pixel-Shuffle VLAs


    **Paper**: "Token Pruning Catastrophically Fails on Pixel-Shuffle VLAs: Diagnosis
    and Recovery"

    **Venue**: CoRL 2026

    **Review mode**: Full (2 Reviewers + Roundtable)

    **Date**: 2026-05-20


    ---


    ## Venue Calibration


    **CoRL** (Conference on Robot Learning): Acceptance rate ~30-35%. Evaluation dimensions
    per CoRL 2023 guidelines: Originality, Quality, Clarity, Significance, Relevance,
    Limitations. Scoring on OpenReview 1-10 scale (10=seminal, 7=accept, 5=marginally
    below threshold, 3=clear reject). CoRL values empirical robot learning results
    with real-world or high-fidelity simulation validation.


    ---


    ## R1 Review: Methods and Experiments


    ### Summary

    Substantial cross-architecture study of vision token pruning across five VLA models,
    revealing architecture-dependent pruning sensitivity. Strong SmolVLA ablation
    and well-controlled VTR experiments, but significant methodological gaps in protocol
    heterogeneity, offline-only π0 evaluation, single-benchmark scope, and undertrained
    CV diagnostic.


    ### Strengths

    1. **Thorough SmolVLA ablation**: Seven pruning configurations (ACIS, random,
    L2-norm, Sobel, ToMe, zero-mask, true removal) all produce 0% SR. Verification
    on official checkpoint (59.2% baseline, same cliff) rules out undertrained-model
    artifacts. Convincing evidence the failure is architectural.

    2. **Well-designed VTR controls**: Extended training control (45.0% SR, p>0.9
    vs baseline) isolates gain as architectural. Parameter-matched MLP adapter (63.4%
    vs 60.1%, p=0.15) identifies re-encoding as operative mechanism. M=128 passthrough
    (+13pp) demonstrates value independent of compression.

    3. **3-seed VTR evaluation (Table 4)**: All five M values have 3-seed results
    with individual seeds reported. Flat M-curve (54.5–62.0%) is well-supported statistically.

    4. **Explicit confound acknowledgment**: Transparent about pruning method asymmetry
    (random for OpenVLA, L2-norm for X-VLA) and correctly argues this strengthens
    rather than weakens the architecture-dependent conclusion.

    5. **π0–OpenVLA controlled comparison**: Same SigLIP encoder, same 256 tokens,
    different connector → 63pp gap at k=0.1. Cleanest evidence for connector as causal
    factor.

    6. **Per-task breakdowns**: Reveal important heterogeneity (e.g., OpenVLA butter
    collapses to 0% at k=0.3, salad_dressing holds at 64%), strengthening reproducibility.


    ### Weaknesses

    1. **(Major) Heterogeneous pruning protocols undermine cross-model comparisons.**
    OpenVLA uses random removal, X-VLA uses L2-norm. Degradation curves in Figure
    1a are not directly comparable on the same axes. The planned L2-norm sweep on
    OpenVLA (D108) would have provided apples-to-apples comparison. Without at least
    one overlapping condition, the quantitative differences between "smooth graded"
    and "threshold-graded" classes are confounded with pruning method.

    2. **(Major) π0 evaluation is offline only.** The paper''s own Section 5.4 shows
    offline metrics dramatically underestimate closed-loop failure (X-VLA offline
    loss ~1.0 at k=0.3 but SR=23%, a −77pp drop). Claiming π0 is "immune" based solely
    on offline loss is internally contradictory. The strongest class rests on the
    weakest evidence. Abstract says "immune" without qualification.

    3. **(Major) Single benchmark (LIBERO-Object).** All primary results on one suite
    (10 tasks, 500 episodes). Cross-suite results only for SmolVLA VTR. The taxonomy
    could be benchmark-specific. No evidence CV thresholds generalize.

    4. **(Major) CV diagnostic: N=4 data points, zero validation.** Any monotonic
    function through 4 points appears to "predict" the ordering. Cannot distinguish
    "principled predictor" from "happened to observe 4 models whose CV ordering matches."
    The missing RoboFlamingo 5th point would have been critical.

    5. **(Minor) SmolVLA baseline underperformance.** Fine-tuned baseline 44.8% vs
    official 87.3% (or 59.2% reproduction). VTR on official checkpoint actually *decreases*
    performance (59.2% → 53.4%), suggesting VTR may not generalize to well-trained
    models. This should be discussed more prominently.

    6. **(Minor) X-VLA has only 50 tokens.** Practical relevance of pruning a 50-token
    model is limited vs. pruning 256-token models.

    7. **(Minor) VTR convergence not demonstrated.** No learning curves shown. M=96
    dip (54.5% vs 62.0% for M=64) could be convergence issue, not intrinsic bottleneck.

    8. **(Minor) Wilson CI vs. std inconsistency.** Single-seed uses Wilson CIs (appropriate);
    multi-seed reports mean±std (n=3). With n=3, ±std substantially understates uncertainty
    vs. proper 95% CIs (~±4.3×std from t-distribution with 2 df).


    ### Questions for Authors

    1. Have you run L2-norm pruning on OpenVLA at any k? Even one data point enables
    direct X-VLA comparison.

    2. VTR on official checkpoint (59.2% → 53.4%) is a 5.8pp decrease. Does VTR only
    help undertrained models?

    3. For CV=0.18 (between X-VLA and OpenVLA), what specific pruning prediction does
    the framework make? Is the relationship linear?

    4. Why was OpenVLA VTR run for only 20K steps when SmolVLA used 100K?

    5. The M=128 passthrough (+13pp) — is this gain from 22M extra parameters, cross-attention
    architecture, or additional training?


    ### Missing Experiments

    1. π0 closed-loop evaluation on LIBERO (highest impact)

    2. L2-norm pruning on OpenVLA (enables fair cross-model comparison)

    3. 5th model for CV diagnostic validation (e.g., RoboFlamingo)

    4. Cross-benchmark evaluation (at least one additional suite)

    5. Ablation on pixel-shuffle fold factor (2×2 vs 4×4)


    ### Scores

    - Originality: 7/10

    - Quality: 5/10

    - Clarity: 7/10

    - Significance: 6/10

    - Relevance: 8/10

    - Limitations: 8/10


    ### Overall Score: 5/10

    ### Confidence: 4/5



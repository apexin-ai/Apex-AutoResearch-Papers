  result_rationale: 'Scaling law 在 k=0.5 和 k=0.7 均展示完美的 monotonic pattern（|ρ|=1.0）：
    CV 越低（tokens 越 uniform），L2norm 越 harmful（因为 uniform distribution 上的  norm-based
    selection 退化为 spatial clustering），random 越有优势。

    机制链： CV=0.055（π0.5）→ near-uniform importance → L2norm clusters spatially →  catastrophic
    coverage loss → +36pp random advantage

    CV=0.151（X-VLA）→ moderate uniformity → L2norm partial clustering →  +27pp random
    advantage（smaller because BART creates some meaningful differentiation）

    CV=0.215（OpenVLA）→ meaningful differentiation → L2norm preserves important tokens
    →  -1.8pp（L2norm slightly better, importance-based selection effective）

    k=0.7 gap 小于 k=0.5 gap（22.2 vs 36.0 for π0.5）因为 k=0.7 保留更多 tokens， spatial coverage
    loss 更轻。但 monotonic ordering 保持不变。

    Remaining seeds（已通过 multi-seed 确认）不会引入 exceptions： - π0.5 L2norm k=0.5 dual-seed:
    33.4/33.6（std=0.1pp） - X-VLA random k=0.5 tri-seed: 70.6/71.0/69.2（σ=0.9pp） -
    Gap reproducibility confirmed across all available seeds。


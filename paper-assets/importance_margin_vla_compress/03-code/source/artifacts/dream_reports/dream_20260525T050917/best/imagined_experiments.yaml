    backbone 已经学习了 per-token semantically meaningful representations。VTC  强制将 256
    个有独立语义的 token 映射到更少的 query token，丢失了 token-level  semantic granularity。训练 loss
    收敛（因为 cross-attention 可以学习压缩映射） 但 closed-loop control 失败，因为 action prediction
    依赖 fine-grained token  discrimination 而非 compressed summary。与 SmolVLA 不同，SmolVLA
    的 pixel-shuffle  token 本身缺乏 individual semantics（每个 token 编码 32×32 pixel region），
    VTR re-encoding 只需恢复 spatial structure 而非 semantic content。

    '

    的空间纠缠修复功能。Paper 中作为 §5.3 "Re-encoding mechanism" 的 反面证据，说明 VTR 不是通用 token compressor。

    '
- name: X-VLA cliff threshold 3-seed localization
  plan_id: c1_xvla_threshold_localization
  description: 'X-VLA k=0.8 和 k=0.85 的 3-seed 精确定位已完成。 k=0.80=89.0±0.72pp, k=0.85=67.9±0.31pp。Non-monotonic
    recovery 确认。

    '
  expected_results:
    k080_3seed_mean: 89.0
    k080_3seed_std: 0.72
    k085_3seed_mean: 67.9
    k085_3seed_std: 0.31
    nonmonotonic_gap_pp: 21.1
    cliff_zone: k=0.82-0.87
    deterministic_sd_below_1pp: true
  result_rationale: 'BART encoder（12 层 transformer）在 42 tokens（k=0.85）时触发 length-dependent  interaction
    breakdown。42 tokens 是 BART 自注意力模式的临界密度——低于此密度， BART 的 cross-token mixing 产生的依赖链被截断，导致
    cascading information loss。 40 tokens（k=0.8）反而恢复，因为 token 密度进一步降低使 BART 退化为  near-independent
    processing（类似纯 linear projection 行为）。SD<1pp 证明这是  完全 deterministic 的架构属性，非随机效应。3-seed
    一致性消除了训练 seed 混淆因素。

    '

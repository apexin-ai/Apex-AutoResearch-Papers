- name: VTR on OpenVLA (MLP projector) — connector-dependent ceiling
  plan_id: c4_ext_method_universality_openvla
  description: 'VTR M=128 full training 已确认 0% SR（overfitting, 每步输出相同 action）。 VTC-only
    M=32/M=64 作为 fallback 继续训练。预测结果为 clean negative： VTR 对 MLP projector 无效，VTR ceiling
    取决于 connector 类型。

    '
  expected_results:
    vtconly_m32_sr: 0.0
    vtconly_m64_sr: 0.0
    vtconly_m96_sr: 0.0
    vtr_m128_sr: 0.0
    openvla_baseline_sr: 74.0
    failure_mode: overfitting — model outputs identical action per step
    connector_dependency_confirmed: true
  result_rationale: 'MLP projector tokens 已经是独立且有意义的（CV=0.215，信息分布在 token 间有分化）。 VTR
    的 cross-attention 试图将这些已经 well-structured 的 token 重新编码为更少的 query  token，但这个重新编码过程引入了不必要的复杂性。MLP
    token 的信息是 per-token 局部化的， 与 pixel-shuffle token 的空间纠缠不同——后者的信息恢复 requires 全局
    re-arrangement， 恰好是 VTR cross-attention 擅长的。对 MLP projector，简单的 hard pruning（k=0.5
    仍有  37.4% SR）比 VTR 更有效，因为保留的 token 仍然 individually meaningful。VTR 的 22M  额外参数在缺乏
    spatial entanglement repair 目标时退化为纯噪声拟合器。 所有 M 值（32/64/96/128）均失败进一步证明这不是超参数问题而是架构兼容性问题。

    '

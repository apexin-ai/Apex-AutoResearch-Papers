tier: best
narrative_guidance: '2-axis framework（connector coupling × task complexity）在所有 model×suite
  组合中得到干净验证。 CV diagnostic 形成完整的连续预测谱（0.038→0.314），scaling law 在 k=0.5 和 k=0.7 均成立且无例外。
  π0.5 uniformly critical 行为（L2norm 高原 + random cliff）泛化至 Spatial/Goal/Long，机制一致。
  VTR connector-dependency（pixel-shuffle 有效、MLP 失败）是干净且可解释的结果。 E5 attention pruning
  在 Goal suite 上完美泛化（SR=96.8-98.2%），为 entangling connector 提供 "correct importance
  metric rescues" 叙事。5 claims 全部保留，reviewer concern RC7 被 4 suites 完全化解。 Paper title
  不变。叙事核心：Analysis（primary）+ Diagnose-then-Compress method（secondary）。

  '

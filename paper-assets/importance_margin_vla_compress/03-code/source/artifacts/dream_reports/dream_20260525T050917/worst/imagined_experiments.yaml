    by E5 attention data + π0.5 method divergence (3) L2norm is actively harmful on
    low-CV models — 36pp gap on π0.5, 28pp on X-VLA at k=0.5 Object (4) VTR achieves
    near-lossless compression for pixel-shuffle — 0%→59% at any M ratio

    These 4 findings are individually publishable observations that together constitute
    a substantial empirical contribution for CoRL, even without a unified theory.
    Title: "A Systematic Study of Token Pruning Strategies Across VLA Architectures."'

- name: 'VTR Universality Test: OpenVLA MLP Projector (M=128/32/64)'
  plan_id: c4_ext_method_universality_openvla
  description: 'VTR 在 OpenVLA（MLP projector）上的泛化性测试。M=128 full VTR 已失败（0% SR），VTC-only
    M=32/M=64 作为 fallback。

    '
  expected_results:
    openvla_vtr_m128_sr_pct: 0.0
    openvla_vtconly_m32_sr_pct_predicted: 3.0
    openvla_vtconly_m64_sr_pct_predicted: 5.0
    openvla_vtconly_m96_sr_pct_predicted: 2.0
    openvla_baseline_sr_pct: 74.0
    overfitting_confirmed: true
    failure_mode: model outputs identical action every timestep
  result_rationale: 'M=128 VTR 在 20K steps 后 0% SR（model 对所有 observation 输出相同 action）确认
    severe overfitting。 VTC-only M=32/M=64 预测同样失败（<5% SR），因为根本原因不在 VTR architecture
    而在 MLP projector tokens 的特性： (1) MLP projector tokens 已经是 individually meaningful
    的（CV=0.215, 有 gradient differentiation），VTR 的 cross-attention 无法提供额外信息，反而引入 information
    bottleneck。 (2) OpenVLA 的 256 tokens × 7B parameters 的 scale 与 SmolVLA 的 128 tokens
    × 450M parameters 完全不同——VTR 的 ~22M params 对 7B model 来说是 rounding error，无法学到有意义的
    re-encoding。 (3) M=96/M=64/M=32 的 training loss 持续下降但 eval SR 不恢复，典型的 action space
    overfitting pattern。 在 worst 档，这确认 VTR 是 pixel-shuffle-specific method。Paper 中
    VTR 需要 reframe：不是 "universal compression tool" 而是 "architecture-specific recovery
    mechanism that works because pixel-shuffle tokens need re-entangling, while MLP
    tokens are already independent and don''t benefit from cross-attention re-encoding"。


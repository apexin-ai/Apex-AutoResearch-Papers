tier: worst
narrative_guidance: '核心 reframe：从 ''principled 2-axis framework'' 转为 ''comprehensive
  empirical study of VLA token pruning across architectures and tasks''。 π0.5 cross-suite
  数据摧毁了两轴独立性假设——random k=0.9 在 Object=9% vs Goal=62.2%，同一 token-independent connector
  跨 suite 差异达 53pp。 E5 attention pruning 数据（X-VLA k=0.5 attn_last=99.2% vs L2norm=42.6%）证明
  ''entanglement'' 不是 connector 的固有属性，而是 importance metric 选择的 artifact。 CV scaling
  law 仅在 Object suite 内部成立（Spearman ρ=-1.0），跨 suite 后 Long-horizon 出现反转（π0.5 L2norm
  > random），平均 |ρ|≈0.45。 VTR 确认为 SmolVLA-specific 方案（OpenVLA VTC-only 全部失败），且 M=96
  dip (p=0.034) 暗示训练不稳定。 Title 改为 ''A Systematic Study of Token Pruning Strategies
  Across VLA Architectures''。 仍然 submit CoRL，因为 5 models × 4 suites × systematic comparison
  是 substantial empirical contribution。 Claims 缩减为：(1) pixel-shuffle entanglement
  是真实的架构属性（C2 survives），(2) importance metric 选择 > connector architecture（new empirical
  finding），(3) VTR 在 pixel-shuffle 上实现 near-lossless compression（C4 survives as case
  study）。

  '

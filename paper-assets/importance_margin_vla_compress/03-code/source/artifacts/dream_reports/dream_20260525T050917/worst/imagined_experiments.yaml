  result_rationale: 'π0.5 random k=0.9 在 Object 上出现 catastrophic cliff（9.3%），但在 Goal
    上仅下降至 62.2%——同一 linear projection connector、同一 random method、同一 k，仅 task distribution
    不同就产生 53pp 差异。这直接破坏 "token-independent connector 不受 task complexity 影响" 的核心假设。
    机制：Object suite 需要 precise object identity discrimination（visually similar condiments），random
    在 cliff zone 摧毁 concentrated discriminative features；Goal suite 的 task 由 language
    instruction 区分，vision tokens 冗余度更高，random 破坏的影响小。 L2norm 在相同 k=0.9 的 cross-suite
    range 仅 18.2pp（vs random 53pp），证明 cross-suite sensitivity 是 METHOD-dependent 而非
    connector-dependent。 E5 attention pruning 数据更具破坏性：X-VLA k=0.5 attn_last=99.2%（Object）、98.2%（Goal），vs
    L2norm=42.6%/59%。这意味着 X-VLA 的 "entanglement" 问题完全可以通过更换 importance metric 解决，BART
    encoder 产生的不是 "irreversible entanglement" 而是 "norm-unfriendly importance distribution"。
    CV scaling law 在 Object 内仍然成立（Spearman -1.0），但 Long-horizon 出现反转（π0.5 L2norm >
    random，Δ=-4.6pp），导致 cross-suite 平均 |ρ|≈0.45，远低于 paper 声称的 "universal predictor"
    所需的 >0.8。 OpenVLA 在 Goal 上也出现 method preference reversal（random > L2norm +8.8pp），而
    Object 上 L2norm > random（+1.8pp）。同一 CV=0.215 的 model，跨 suite 后 method preference
    反转。 Framework 在 20 个 model×suite 预测中仅正确约 12 个（62%），达不到 "principled framework"
    标准。


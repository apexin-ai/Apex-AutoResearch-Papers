    vtr_m96_dip_p_value: 0.034
    vtr_m96_dip_confirmed: true
    hard_pruning_k05_all_suites_sr_pct: 0.0
  result_rationale: 'VTR M=32 在 Object 上实现 near-lossless compression（60.1% vs baseline
    59.2%），Spatial 上甚至超过 baseline（53.2% vs 44.6%，可能因为 VTR 训练 regularization 效应）。 但
    Goal suite recovery ratio = 56.4/60.8 = 0.928，低于 Object。预测 Long-horizon（未测）recovery
    ratio 进一步下降至 ~0.87：Long tasks 需要 multi-step reasoning，VTR 的 cross-attention 可能无法完全保留
    temporal action sequence 所需的 spatial information chain。 M=96 dip（p=0.034 vs M=64）在
    worst 档被确认为 training instability（非 statistical fluke），因为 M=96 的 3-seed std=3.2pp
    是所有 M 值中最高的。这暗示 VTR 的 flat M-curve 可能是 M=16-64 的幸运区间，M=96 暴露了 cross-attention
    query 数量与 pixel-shuffle token structure 之间的 resonance 问题。 VTR 仍然是 valid contribution（从
    0% hard pruning 恢复到 ~baseline），但 worst 档将其定位为 "SmolVLA-specific case study" 而非
    "general method"，因为： (1) cross-suite recovery 有衰减（Goal 0.93, Long predicted 0.87），
    (2) M=96 dip 暗示 training sensitivity， (3) OpenVLA VTR 完全失败（下条）。


  result_rationale: 'M=96 已训完（final train loss 2.45, eval loss 2.66），远高于 SmolVLA VTR
    的 ~0.05 train loss。这不是欠拟合——100K steps with OpenVLA 的 tokenized action space 天然产生高
    cross-entropy loss。 M=32/M=64 的 v3/v4/v5 版本反复失败（disk full, GPU crash, training
    instability），即使成功训完也预期 0% SR。 根本原因：OpenVLA 使用 discrete tokenized actions（不是 continuous
    actions），VTC 的 cross-attention 将 256 个 vision tokens 压缩到 M 个 queries，但 OpenVLA
    的 LLM decoder 期望完整的 256-token vision context 来做 autoregressive action token generation。压缩后的
    M queries 无法提供 decoder 所需的 token-level spatial precision。

    '

  review_report: "---\ndream_id: dream_20260525T050917\ntier: median\noverall_score:\
    \ borderline (5.5/10)\ntimestamp: 2026-05-25T06:17:01.057818+00:00\n---\n\n# Dream\
    \ Review Report: \"How Vision Connectors Shape Token Pruning Robustness in Vision-Language-Action\
    \ Models\"\n\n**Venue**: CoRL 2026  \n**Review Mode**: Full (2 Reviewers + Roundtable)\
    \  \n**Date**: 2026-05-25\n\n---\n\n## Reviewer Assignments\n\n- **R1** — Methods\
    \ & Experiments  \n- **R2** — Novelty & Related Work  \n\n---\n\n## Step 1: Independent\
    \ Reviews\n\n### Reviewer R1 (Methods & Experiments)\n\n#### Summary\nSystematic\
    \ empirical study of how vision connector architecture determines VLA robustness\
    \ to post-connector token pruning. Six VLA architectures (450M–7B) across three\
    \ connector families are evaluated on four LIBERO task suites under L2-norm, random,\
    \ and attention-based pruning. Key findings: token-independent connectors degrade\
    \ gracefully while token-entangling connectors exhibit catastrophic collapse amplified\
    \ by task complexity; CV of token L2-norms serves as a zero-cost diagnostic; VTR\
    \ (~22M params) recovers SmolVLA from 0% to ~60% SR at 75% compression.\n\n####\
    \ Strengths\n\n- **S1: Breadth of experimental coverage.** 6 architectures, 3\
    \ connector families, 4 task suites, 3 pruning strategies, k=0.3–0.95. Genuinely\
    \ the first cross-architecture, cross-task VLA token pruning study, filling an\
    \ important gap.\n- **S2: Double dissociation finding is compelling.** Attention-based\
    \ scoring effective on X-VLA but harmful on π0.5, while L2-norm shows the converse.\
    \ Well-supported by data from multiple suites and retention ratios. Immediate\
    \ practical implications and hard to dismiss as noise.\n- **S3: Thorough SmolVLA\
    \ cliff characterization.** Multiple checkpoints (LoRA and official), multiple\
    \ methods (L2, random, attention, ToMe), all 4 suites. Two independent baselines\
    \ both show 0% under any pruning. Conclusively establishes the architectural cliff.\n\
    - **S4: VTR with proper controls.** Flat M-curve (M=16–128 within ±5pp), parameter-matched\
    \ MLP adapter control (p=0.15), M=128 passthrough demonstrating re-encoding mechanism,\
    \ 3-seed validation. Careful experimental design.\n- **S5: Honest limitation acknowledgment.**\
    \ Confounders, small CV sample, sim-only evaluation, lack of causal isolation\
    \ all explicitly flagged. Unusual intellectual honesty for this space.\n- **S6:\
    \ Non-monotonic phenomena well-documented.** π0.5 random cliff at k=0.85–0.925,\
    \ X-VLA k=0.85/k=0.80 inversion, all multi-seed confirmed. Hypergeometric cliff\
    \ model provides mechanistic account.\n\n#### Weaknesses\n\n- **W1: CV diagnostic\
    \ severely underpowered.** Only 4 closed-loop data points. With n=4, any monotonic\
    \ ordering yields high Spearman ρ trivially. CV range confounds with connector\
    \ type — cannot distinguish \"CV predicts robustness\" from \"connector type predicts\
    \ robustness.\" More models needed.\n- **W2: 2-axis framework lacks testable boundaries.**\
    \ Does not specify expected amplification factors or predict where thresholds\
    \ occur. Post-hoc descriptive rather than predictive.\n- **W3: OpenVLA coverage\
    \ notably sparse.** Only Object suite in main results. Many Table cells marked\
    \ \"—\". Cannot make strong claims about MLP connector × task complexity interaction\
    \ without Goal/Long/Spatial data for OpenVLA.\n- **W4: VTR universality falsified\
    \ but underexplored.** 0% SR on OpenVLA mentioned in passing. No investigation\
    \ of why (overfitting? training protocol? learning rate?). Missing training loss\
    \ curves.\n- **W5: Seed and statistical rigor concerns.** Most conditions single-seed.\
    \ Some cross-model comparisons mix seeds (L2: seed42, Random: seed7). \"Scaling\
    \ law\" table uses inconsistent statistical treatment across models.\n- **W6:\
    \ VTR baseline discrepancy.** VTR trained baseline = 44.8% vs official 59.2%.\
    \ The \"exceeds baseline\" framing depends on which baseline. Should be framed\
    \ as \"recovery from 0% to functional performance.\"\n- **W7: No real-robot evaluation.**\
    \ For a CoRL submission, sim-only is a notable gap. LIBERO is respected but VLA\
    \ pruning behavior could differ under real-world visual conditions.\n- **W8: π0.5\
    \ attention extraction protocol questionable.** Attention scores in [2e-6, 3.6e-3]\
    \ with position bias. No discussion of whether different extraction methods might\
    \ produce different results.\n\n#### Questions to Authors (R1)\n\n1. Can you provide\
    \ evidence that CV is predictive beyond what connector type already tells us?\
    \ Within the MLP family (OpenVLA CV=0.215, OFT CV=0.219), is there measurable\
    \ pruning robustness difference consistent with the 0.004 CV gap?\n2. The π0.5\
    \ cliff at k=0.85–0.925 and X-VLA's non-monotonic recovery at k=0.85/0.80 both\
    \ involve similar k values but different connectors. How do you reconcile the\
    \ mechanistic explanations?\n3. For VTR failure on OpenVLA, did you attempt different\
    \ learning rates, fewer training steps, or freezing strategies? Training loss\
    \ curves?\n4. Why is OpenVLA evaluated on only Object in main results? If cross-suite\
    \ data exists, omitting it weakens the cross-task claims.\n5. The Spearman ρ=0.82\
    \ (p=0.03) — how many data points? With only 3 models in the scaling law table,\
    \ any monotonic ordering gives ρ=1.0.\n\n#### R1 Scores\n\n| Dimension | Score\
    \ |\n|-----------|-------|\n| Soundness | 3/4 |\n| Presentation | 3/4 |\n| Contribution\
    \ | 3/4 |\n| Overall | 6/10 |\n| Confidence | 4/5 |\n\n---\n\n### Reviewer R2\
    \ (Novelty & Related Work)\n\n#### Summary\nThe paper systematically studies how\
    \ vision connector architecture and task complexity jointly determine whether\
    \ token pruning preserves or destroys VLA performance. The main novelty claims\
    \ are a 2-axis framework (connector coupling × task complexity), CV as a zero-cost\
    \ diagnostic, and VTR as a targeted recovery method for pixel-shuffle architectures.\
    \ The paper is positioned as \"primarily analysis with targeted method for worst-case\
    \ architecture.\"\n\n#### Strengths\n\n- **S1: Timely and well-scoped question.**\
    \ VLA efficiency literature has grown rapidly but each work validates on a single\
    \ architecture. First paper to ask whether pruning transferability is architecture-dependent,\
    \ with clear mechanistic explanations.\n- **S2: Empirical breadth.** 5 models\
    \ in closed-loop evaluation, 4 LIBERO suites, 3 pruning methods, 6+ retention\
    \ ratios, multi-seed for key claims. Cross-model, cross-suite, cross-method factorial\
    \ design considerably more thorough than typical VLA papers.\n- **S3: Double dissociation\
    \ is genuinely novel.** Goes beyond \"different models behave differently\" into\
    \ identifying a structural interaction between scoring mechanism and connector\
    \ architecture. The paper's strongest contribution.\n- **S4: Pixel-shuffle cliff\
    \ is a valuable negative result.** Practically important documentation. Mechanism\
    \ clearly explained and architecturally motivated.\n- **S5: Honest self-assessment.**\
    \ Unusual candor about confounders, small N, sim-only evaluation.\n\n#### Weaknesses\n\
    \n- **W1: 2-axis framework is descriptive, not predictive.** The \"two axes\"\
    \ are really one axis (connector coupling) with a moderating variable. Framework\
    \ does not predict where thresholds occur, only that entangling = bad for pruning\
    \ — arguably expected once pixel-shuffle's non-overlapping receptive fields are\
    \ understood.\n- **W2: CV diagnostic underpowered and elementary.** Correlation\
    \ on 3–4 points. CV = σ/μ of L2 norms is a trivial statistic. No comparison against\
    \ alternative diagnostics (kurtosis, effective rank, pairwise cosine similarity).\
    \ Cannot assess if CV is the best diagnostic or merely a diagnostic.\n- **W3:\
    \ VTR novelty is limited.** Structurally identical to Perceiver Resampler (Flamingo)\
    \ and Q-Former (BLIP-2). The paper itself notes this. Novelty limited to applying\
    \ known architecture in a new setting. Validated on only one model (SmolVLA);\
    \ fails on OpenVLA.\n- **W4: Missing important related work.**\n  - Token Merging\
    \ (ToMe) tested only on SmolVLA, not on token-independent architectures where\
    \ it might succeed.\n  - SparseVLM (Zhang et al., 2024, NeurIPS) not discussed\
    \ — also analyzes visual token sparsity in VLMs.\n  - \"Don't Run with Scissors\"\
    \ dismissed in one sentence despite analyzing how architectural choices affect\
    \ pruning robustness — a direct conceptual precursor.\n  - VLA-IAP positioning\
    \ thin: no discussion of whether VLA-IAP's specific scoring mechanism would succeed/fail\
    \ on entangling connectors (would demonstrate framework's predictive utility).\n\
    - **W5: Simulation-only, no sim-to-real evidence.** LIBERO baselines vary widely\
    \ across models (SmolVLA 44.8–59.2% vs X-VLA 99.2%), complicating cross-model\
    \ comparisons. Models with higher baselines have more room for graceful degradation.\n\
    - **W6: Connector-type confounds only partially addressed.** No controlled comparison\
    \ isolates connector while controlling backbone, encoder, and scale. Causal claim\
    \ \"connector is the primary determinant\" should be softened.\n- **W7: Data gaps\
    \ in main results.** Multiple \"—\" entries in cross-suite tables. Undermines\
    \ the \"systematic\" claim.\n\n#### Questions to Authors (R2)\n\n1. The hypergeometric\
    \ cliff model fits C=106, T=7 to 3 data points with 2 free parameters — effectively\
    \ interpolation. Can you validate on held-out retention ratios?\n2. Why was attention-based\
    \ scoring not evaluated on OpenVLA? Would complete the dissociation pattern.\n\
    3. X-VLA (CV=0.151, \"entangling\") has lower CV than OpenVLA (CV=0.215, \"independent\"\
    ). Entangling connectors should produce more heterogeneous tokens. How do you\
    \ reconcile?\n4. How stable is CV across different inputs? Is CV=0.055 for π0.5\
    \ consistent across tasks, images, timesteps?\n5. Can you compare CV against alternative\
    \ diagnostic metrics (kurtosis, effective rank, cosine similarity)?\n\n#### R2\
    \ Scores\n\n| Dimension | Score |\n|-----------|-------|\n| Soundness | 3/4 |\n\
    | Presentation | 3/4 |\n| Contribution | 2/4 |\n| Overall | 5/10 |\n| Confidence\
    \ | 4/5 |\n\n---\n\n## Step 2: Cross-Sharing Summary\n\nBoth reviewers independently\
    \ identified the same strongest result (double dissociation / scoring crossover),\
    \ same critical weaknesses (CV underpowered, OpenVLA incomplete, VTR limited novelty,\
    \ sim-only), and same praise (empirical breadth, honest limitations).\n\nKey divergence:\
    \ R1 values the practical/actionable contribution more highly (Contribution 3/4),\
    \ while R2 emphasizes that the conceptual novelty is limited — framework is descriptive,\
    \ CV is elementary, VTR is derivative (Contribution 2/4).\n\n## Step 3: Convergence\n\
    \n### Consensus Points\n\n1. **Strongest contribution**: Cross-architecture empirical\
    \ analysis breadth + double dissociation finding (attention vs L2-norm crossover\
    \ across connector types). This is novel, well-evidenced, and practically valuable.\n\
    \n2. **Weakest claims**: CV as an independent diagnostic predictor. With n=3–4,\
    \ the correlation is trivially achievable and confounded with connector type.\
    \ The \"scaling law\" framing is inappropriate for 3 data points.\n\n3. **Framework\
    \ assessment**: The 2-axis framework organizes observations well but is descriptive,\
    \ not predictive. It does not predict thresholds, cliff locations, or amplification\
    \ magnitudes. \"Connector coupling determines pruning robustness\" is useful but\
    \ arguably expected once the architecture differences are understood.\n\n4. **VTR\
    \ assessment**: Engineering contribution (applying cross-attention bottleneck\
    \ to pixel-shuffle recovery), not methodological novelty. Validated on only 1\
    \ model, fails on OpenVLA. The failure investigation is insufficient — the paper\
    \ cannot distinguish \"VTR is fundamentally connector-specific\" from \"VTR training\
    \ protocol was inappropriate for 7B models.\"\n\n5. **Critical missing elements\
    \ for CoRL**: (a) OpenVLA multi-suite data, (b) real-robot validation, (c) more\
    \ models for CV correlation, (d) attention-based pruning on OpenVLA.\n\n6. **Paper\
    \ identity**: Clear and appropriately scoped as \"primarily analysis with targeted\
    \ method.\" The paper correctly downscales its method claims relative to its analysis\
    \ claims.\n\n### Post-Convergence Score Calibration\n\nBoth reviewers agree the\
    \ paper falls in the borderline-to-weak-accept range. The empirical breadth and\
    \ double dissociation finding argue for acceptance; the underpowered CV diagnostic,\
    \ OpenVLA gaps, VTR limited novelty, and sim-only evaluation argue against.\n\n\
    ---\n\n## Step 4: Consolidated Assessment\n\n### Overall Recommendation: **Borderline**\
    \ (5.5/10)\n\n### Consolidated Scores\n\n| Dimension | R1 | R2 | Consolidated\
    \ |\n|-----------|----|----|-------------|\n| Soundness | 3/4 | 3/4 | 3/4 |\n\
    | Presentation | 3/4 | 3/4 | 3/4 |\n| Contribution | 3/4 | 2/4 | 2.5/4 |\n| Overall\
    \ | 6/10 | 5/10 | 5.5/10 |\n| Confidence | 4/5 | 4/5 | 4/5 |\n\n### What Would\
    \ Move This Paper to Accept\n\n1. **CV diagnostic**: Add 2–3 more VLA models (even\
    \ offline CV measurements without closed-loop eval) to demonstrate CV predicts\
    \ beyond connector type. Compare CV against alternative diagnostics (kurtosis,\
    \ effective rank).\n2. **OpenVLA multi-suite**: Complete the Object/Spatial/Goal/Long\
    \ grid for OpenVLA. This is the only MLP-projector model with closed-loop eval\
    \ — its data gaps are disproportionately damaging.\n3. **VTR failure investigation**:\
    \ Provide OpenVLA training loss curves, try different learning rates / training\
    \ durations, discuss whether the failure is architectural or procedural.\n4. **Real-robot\
    \ validation**: Even a single model on 1–2 tasks would substantially strengthen\
    \ the CoRL submission.\n5. **Attention on OpenVLA**: Complete the double dissociation\
    \ table with OpenVLA attention-based pruning.\n\n### What Would Move This Paper\
    \ to Reject\n\n1. If the CV diagnostic cannot survive additional models (i.e.,\
    \ new models break the monotonic ordering).\n2. If OpenVLA multi-suite data reveals\
    \ the framework's predictions are wrong (e.g., MLP projectors also cliff on complex\
    \ tasks).\n3. If VTR failure on OpenVLA is shown to be a training protocol issue\
    \ rather than architectural, undermining the \"connector-dependent\" narrative.\n\
    \n### Coverage vs. Experimental Design\n\nThe paper covers 10 of 12 imagined experiments\
    \ from the design document. Two were dropped with acknowledgment:\n- OpenVLA-OFT\
    \ cross-suite pruning (blocked by GPU incompatibility) → properly acknowledged\
    \ as limitation\n- RoboFlamingo Perceiver Resampler (training killed) → acknowledged\
    \ as future work\n\nThe remaining 10 are reflected in the paper with appropriate\
    \ qualification of edge cases (π0.5 Axis-2 reversal, X-VLA non-monotonicity, k=0.3\
    \ CV reversal).\n\n### Key Risks for This Paper at CoRL\n\n1. **\"Obvious once\
    \ explained\" criticism**: Reviewers may argue that pixel-shuffle destroying spatial\
    \ information under deletion is architecturally obvious, reducing the 2-axis framework\
    \ to a post-hoc rationalization.\n2. **Statistical power**: The n=3 scaling law\
    \ and n=4 CV spectrum are vulnerable to criticism. The Spearman ρ=0.82 at k=0.5\
    \ with potentially only 3 data points is a red flag.\n3. **Sim-to-real gap**:\
    \ CoRL increasingly expects real-robot results. A pure LIBERO study, even a thorough\
    \ one, may be seen as belonging more at an NLP/ML venue.\n4. **VTR circularity**:\
    \ \"VTR only works on pixel-shuffle, and pixel-shuffle is the architecture you're\
    \ warning against\" — the method contribution may be seen as circular.\n\n###\
    \ Final Summary\n\nA thorough empirical study addressing an important and timely\
    \ question — why does token pruning work on some VLAs but not others? The double\
    \ dissociation finding (attention helps entangling connectors but hurts independent\
    \ ones; L2-norm shows the reverse) is the strongest novel contribution and has\
    \ immediate practical value. The pixel-shuffle cliff documentation is rigorous\
    \ and practically important. However, the conceptual framework is descriptive\
    \ rather than predictive, the CV diagnostic is statistically underpowered, VTR\
    \ is architecturally derivative with limited scope, and the absence of real-robot\
    \ evaluation weakens the CoRL fit. The paper is at the borderline — strong empirical\
    \ work with useful practical implications, but the contributions are collectively\
    \ incremental rather than individually compelling.\n\n\n---\n\n## 引用验证结果\n\n**统计**:\
    \ 62 篇文献 / 52 处引用 / 在线验证 62/62 篇\n\n### 问题 (45)\n\n- ⚠️ `black2025pi05` — 元数据不匹配:\

tier_definitions:
  tiers:
    best:
      tier: best
      meaning: 2-axis framework cleanly validated across all model×suite combinations;
        CV diagnostic and scaling law hold without major exceptions; E5 attention
        pruning adds complementary method contribution
      key_assumptions:
      - 'Axis-2 interaction (task complexity amplification) replicates for π0.5 Goal/Long
        with pattern matching X-VLA: entangling connectors show ≥20pp amplification,
        independent connectors show ≤10pp'
      - CV-strategy scaling law (Δ(R-L2) monotonically decreasing with CV) holds at
        k=0.5 AND k=0.7 across all 3 tested models — already confirmed, no new exceptions
        emerge from remaining seeds
      - π0.5 'uniformly critical' behavior (random cliff at k=0.85-0.925, L2norm plateau)
        generalizes to Spatial/Goal with consistent mechanism (concentrated vs distributed
        critical tokens)
      - VTR connector-dependency (works for pixel-shuffle, fails for MLP) is a clean,
        explainable result that strengthens rather than weakens the framework
      - E5 attention-based pruning for X-VLA (Object k=0.5=99.2%, Long k=0.5=90.2%)
        generalizes to Goal suite, providing a 'correct importance metric rescues
        entangling connectors' story
      number_ranges:
        axis2_amplification_pp:
        - 25
        - 45
        cv_strategy_abs_spearman:
        - 0.85
        - 1.0
        cross_suite_framework_accuracy_pct:
        - 90
        - 100
        claims_surviving_review:
        - 4
        - 5
        vtr_smolvla_recovery_ratio:
        - 0.95
        - 1.05
        pi05_l2norm_random_gap_k05_pp:
        - 30
        - 40
      narrative_direction: 原始 framing 完全成立。Paper title 保持不变。5 claims 全部保留。2-axis framework
        是 principled contribution（非 post-hoc observation）。CV diagnostic + VTR method
        形成完整的 Diagnose-then-Compress pipeline。Analysis 是 primary contribution，method
        是 well-motivated secondary。E5 attention pruning 作为 §4.7 或 supplementary 增加实用价值。Reviewer
        concern RC7（仅一个 benchmark）被 4 suites 完全化解。
    median:
      tier: median
      meaning: 2-axis framework directionally correct but有 2-3 个 edge cases 需要 qualify；CV
        scaling law 在 moderate compression 成立但在 extreme k 有 reversal；method contribution
        限于 SmolVLA；需要调整若干 claim 强度
      key_assumptions:
      - Axis-2 interaction 对 X-VLA 成立（27.8pp gap confirmed）但 π0.5 Goal/Long 的 amplification
        弱于预期（<15pp），因为 token-independent connector 的 task sensitivity 本身较低
      - CV scaling law 在 k=0.5 成立，但 k=0.3 出现 reversal（π0.5 L2norm wins +14.6pp）且 k=0.7
        的 gap 明显小于 k=0.5，说明 CV 只在特定 compression regime 有效
      - π0.5 random cliff (k=0.85-0.925) 是 Object-specific 而非 universal：Spatial 没有
        catastrophic dip（已见 58.4% floor vs Object 5%），Goal/Long 的 cliff profile 不同
      - VTR 仅对 pixel-shuffle 有效，OpenVLA VTR 已确认 0% SR。VTC-only M=32/64 training 如果也失败，method
        contribution 进一步缩窄
      - E5 attention pruning 在 Object/Spatial/Long 表现好但 Goal 初始为 0%（后修复为 98.2%），结果可靠性需要额外

    # Dream Review Report — "Why Token Pruning Crashes Some Robot Policies but Not
    Others: The Role of Vision Connectors in VLA Token Compressibility"


    ## Venue: CoRL 2026


    ## Paper Summary


    This paper presents the first systematic study of vision token pruning across
    6 VLA architectures (π0, π0.5, X-VLA, OpenVLA, OpenVLA-OFT, SmolVLA, + RoboFlamingo),
    4 connector families (linear, MLP, BART, pixel-shuffle, Perceiver Resampler),
    and 4 LIBERO task suites. The central finding is a 2-axis framework: (1) connector-determined
    token coupling and (2) task complexity jointly govern pruning robustness. Importance
    CV is proposed as a zero-cost diagnostic (continuous spectrum 0.038→0.314) predicting
    both pruning tolerance and optimal strategy. Vision Token Re-encoding (VTR) is
    introduced for near-lossless compression where deletion fails. A double dissociation
    between scoring methods (L2-norm vs. attention) and connector types is documented.


    ## Consolidated Scores


    | Criterion | R1 | R2 | Final | Justification |

    |-----------|----|----|-------|---------------|

    | Originality | 7 | 5 | 6 | First systematic cross-architecture VLA pruning study
    is a genuine gap-fill. The 2-axis interaction (connector × task complexity) is
    novel—X-VLA''s 27.4pp Object→Goal amplification at same k was not predictable
    from prior work. However, individual components (CV, VTR, attention scoring) are
    not methodologically novel. Empirical synthesis novelty is real but limited. |

    | Quality | 5 | 7 | 5.5 | Resolved toward R1. The data matrix has significant
    gaps: OpenVLA evaluated on Object suite only (no Spatial/Goal/Long), multiple
    "--" entries in main table. Most conditions single-seed. VTR baseline confounded
    by batch size difference (4 vs 512 → 44.8% vs 59.2%). However, completed data
    points (SmolVLA cliff, π0.5 cliff, X-VLA 3-seed, VTR M-sweep) are individually
    well-validated. |

    | Clarity | 7 | 7 | 7 | Both reviewers agree. Well-structured paper with effective
    figures and tables. Dense but logically organized. Extensive appendix. Minor repetition
    across sections. |

    | Significance | 6 | 6 | 6 | Practically useful for VLA deployment decisions.
    Double dissociation and CV diagnostic are immediately actionable. Limited by LIBERO-only
    evaluation—no real-robot, no cross-benchmark validation. Findings are descriptive
    rather than predictive. |

    | Relevance | 8 | 8 | 8 | Directly targets VLA efficiency for robot deployment—a
    core CoRL topic. Closed-loop evaluation is the right methodology. Highly relevant.
    |


    ## Overall Score: 5.5/10 — Borderline (Weak Reject)


    ## Roundtable Consensus


    ### Key Agreements

    - The paper fills a genuine gap: no prior work systematically compares VLA token
    pruning across connector families in closed-loop control

    - SmolVLA pixel-shuffle catastrophic collapse (0% SR at 5% removal, verified across
    checkpoints/methods/seeds) is the strongest and most practically important finding

    - The double dissociation between scoring method effectiveness and connector type
    (attention helps entangling but hurts independent; L2-norm shows the converse)
    is the most compelling and actionable result

    - The incomplete data matrix is a real problem—OpenVLA on Object-only undermines
    the 2-axis "systematic" claim

    - LIBERO-only evaluation limits generalizability; no real-robot validation

    - VTR is narrowly validated (one model success, one model failure)

    - CV diagnostic rests on too few data points (3-4 closed-loop models) for a "scaling
    law" claim

    - Relevance to CoRL is high (8/10)

    - Writing quality is good (7/10)


    ### Resolved Disagreements


    **Originality (R1=7 → R2=5 → Final=6):** R1 valued the 2-axis framework as a genuinely
    new organizational contribution; R2 noted that individual components are not novel.
    Resolution: the empirical synthesis and the interaction finding (connector × task
    complexity amplification) constitute real novelty for the VLA community, but the
    absence of methodological novelty limits the score. Neither a pure analysis paper
    (which would need more complete coverage) nor a methods paper (VTR is essentially
    Q-Former). Settled at 6.


    **Quality (R1=5 → R2=7 → Final=5.5):** R1 emphasized the gaps (incomplete matrix,
    single seed, confounds); R2 emphasized thoroughness within scope. Resolution:
    R1''s concerns are well-founded and material. The OpenVLA gap is the most damaging—it
    is the only MLP-connector model with genuine importance differentiation (CV=0.215),
    making it the most interesting case for testing task complexity amplification
    on independent connectors. This missing data directly undermines Claim 1 (2-axis
    framework). However, R2 is correct that the completed experiments (SmolVLA cliff,
    π0.5 random/L2 dissociation, X-VLA 3-seed cliff) are individually rigorous. Settled
    at 5.5.


    **Overall (R1=5 → R2=6 → Final=5.5):** The paper is genuinely on the boundary.
    It provides the most comprehensive VLA pruning analysis to date, with several
    striking findings. But the experimental gaps, limited model count for the CV diagnostic,
    and absence of head-to-head comparisons with concurrent methods mean the claims
    slightly outpace the evidence. For CoRL''s ~39% acceptance rate, the paper needs
    either more complete experimental coverage OR a stronger methodological contribution
    to cross the threshold.


    ## Strengths (ranked by importance)


    1. **First cross-architecture VLA pruning study.** No prior work compares pruning
    robustness across connector families (linear, MLP, BART, pixel-shuffle) in closed-loop
    robot control. The systematic design spanning 6 models, 4 connector families,
    and 4 task suites is a contribution in itself, even with gaps.


    2. **Double dissociation in scoring methods.** The finding that attention-based
    scoring helps entangling connectors (+56.6pp on X-VLA) but hurts independent ones
    (−30.4pp on π0.5 Object), while L2-norm shows the converse, is clean, surprising,
    and immediately actionable for practitioners. This is the paper''s most compelling
    result.


    3. **SmolVLA pixel-shuffle catastrophic failure is definitive.** The 0% SR at
    k=0.95 (removing 7/128 tokens), verified across two checkpoints, multiple seeds,
    multiple scoring methods (L2, random, attention, geometric), and multiple mechanisms
    (zero-mask, true removal, token merging), is exhaustive and practically important.
    Provides a clear design warning for the community.


    4. **Honest limitations and extensive appendix.** The paper does not overclaim.
    Confounders (model scale, training data, backbone) are explicitly discussed. Multi-seed
    validation is provided where feasible. The appendix includes per-task breakdowns,
    confounder analyses, and mechanistic models.


    5. **CV as a practical diagnostic.** Despite thin validation (few models), the
    concept is sound and zero-cost (one forward pass). Even as a "coarse indicator"
    it offers more guidance than any prior work provides.


    ## Weaknesses (ranked by severity)


    1. **Incomplete data matrix undermines "systematic" claim.** OpenVLA—the primary
    MLP exemplar and the only model with intermediate CV (0.215)—is evaluated on Object
    suite only. The 2-axis framework''s prediction for "token-independent + complex
    task" rests entirely on π0.5. Multiple "--" entries in the main results table.
    The Perceiver Resampler (RoboFlamingo) adds a 4th connector family but appears
    with limited results. This is the most critical weakness: the paper''s central
    claim is a framework explaining interactions, but the data to validate interactions
    is incomplete.


    2. **CV diagnostic rests on too few data points.** The "scaling law" (Δ(R−L2)
    monotonically decreases with CV) is fitted to 3 closed-loop models. Any monotonic
    ordering of 3 points yields |ρ|=1.0 by construction. The boundaries between pruning
    classes (uniform/graded/catastrophic) are drawn post-hoc to fit perfectly. No
    held-out validation. The diagnostic is a promising hypothesis, not an established
    law.


    3. **Confounded architecture comparisons.** The 6 models differ simultaneously
    in backbone, encoder, model scale (450M–7B), training data, number of vision tokens
    (50–768), and connector. The paper cannot isolate the connector''s causal role.
    The only controlled comparison (OFT vs OpenVLA: same connector, different action
    head) contributes primarily offline metrics. Causal language ("connector determines
    compressibility") is stronger than the observational evidence supports.


    4. **No head-to-head with concurrent VLA pruning methods.** The paper critiques
    prior work (VLA-IAP, LightVLA, Compressor-VLA, etc.) for single-architecture validation
    but does not evaluate any of these methods under its own framework. It remains
    unclear whether learned importance scoring from these methods would overcome the
    failures identified here. This is a missed opportunity: running VLA-IAP on SmolVLA
    or X-VLA would directly test whether the connector-dependent failure is method-specific.


    5. **VTR contribution is weak and narrowly validated.** Architecturally identical
    to Q-Former/Perceiver Resampler. Validated on SmolVLA only; fails on OpenVLA (0%
    SR). The VTR training uses batch size 4 vs official 512, yielding a weakened baseline
    (44.8% vs 59.2%). The M=128 passthrough gaining 13pp over the reproduced baseline
    suggests training-recipe effects beyond re-encoding. VTR is more useful as an
    experimental probe (demonstrating deletion is the problem) than as a method contribution.
    Positioning it as a contribution creates expectations of methodological novelty
    that are not met.


    ## Detailed Technical Critique


    ### Methods and Experiments (R1 focus)


    **Statistical rigor:** Most conditions use seed 42 only. Cross-seed validation
    is provided for select conditions (2 seeds for SmolVLA/π0.5, 3 seeds for X-VLA
    cliff and VTR M-sweep), showing acceptable variance (σ < 3pp for most). However,
    for stochastic methods (random pruning), single-seed results have inherent variance—cross-seed
    tables in the appendix show deltas up to 5.8pp, which is comparable to some claimed
    effects.


    **Pruning protocol confound:** The protocol re-indexes position IDs after token
    removal. This creates a confound: observed degradation conflates information loss
    with positional disruption. SmolVLA''s zero-masking control (also 0%) suggests
    information loss dominates for pixel-shuffle, but this control is absent for other
    models. A position-preserving pruning control (dummy tokens replacing removed
    ones) would disambiguate.


    **OFT and π0 overcounting:** The paper claims "6 VLA architectures" but π0 contributes
    only offline loss at two k values, and OFT contributes only CV/entropy measurements.
    Only 4 models have closed-loop LIBERO evaluation. Counting offline-only models
    as full participants overstates experimental coverage.


    **Attention-based pruning cost:** Attention scoring requires decoder forward passes
    to compute attention weights, but the paper does not discuss this computational
    cost. The "zero-cost" framing of CV is contrasted against L2-norm but not against
    attention scoring, creating an incomplete picture for practitioners choosing between
    methods.


    ### Novelty and Related Work (R2 focus)


    **Individual component novelty:** CV of token norms is a basic statistic. VTR
    is architecturally Q-Former/Perceiver. Attention-based pruning extends FastV to
    VLAs. The novelty is entirely in the empirical synthesis and the interaction finding.
    For CoRL with 39% acceptance rate, this is thin without compensating experimental
    completeness.


    **Related work gaps:** The bibliography (~15 references in main text, ~50 in bib)
    is adequate but several areas are under-discussed:

    - Knowledge distillation for VLAs (alternative efficiency approach)

    - Temporal token compression (VLA-Cache, VLA-Pruner exploit frame continuity;
    this paper''s per-frame analysis may not generalize)

    - "Don''t Run with Scissors" (Jabbour et al., 2025) addresses a very similar question
    and deserves more than one sentence of discussion

    - Weight pruning / quantization for context on where token pruning sits in the
    efficiency landscape


    **Framing concerns:** "Diagnose-then-Compress" is presented as a framework but
    is essentially a two-step decision rule (measure CV, choose method). This is useful
    practical guidance but calling it a "framework" oversells it. The paper would
    benefit from framing it as "practical guidelines" or "decision rules."


    **Claim proportionality:** Generally appropriate with some exceptions:

    - "Scaling law" language should be "empirical monotonic trend" (3 data points)

    - "6 architectures" should acknowledge only 4 have closed-loop evaluation

    - "Near-lossless" VTR should be contextualized against the weakened baseline


    ## Questions for Authors


    1. Can you provide OpenVLA results on Goal and Long suites? This is the most critical
    gap—the 2-axis framework''s MLP + complex-task cell is entirely unvalidated.


    2. Have you tested VTR on X-VLA at aggressive k values (k=0.5) where L2-norm fails
    (42.6%)? This would test whether re-encoding generalizes beyond pixel-shuffle.


    3. Have you evaluated any concurrent VLA pruning method (VLA-IAP, LightVLA) under
    your framework? Running VLA-IAP on SmolVLA would directly test whether learned
    importance scoring overcomes the pixel-shuffle failure.


    4. What is the computational cost of attention-based pruning (forward pass for
    attention weights) relative to L2-norm scoring? This is critical for the practical
    "Diagnose-then-Compress" guidelines.


    5. For the pruning protocol: have you tested position-preserving pruning (replacing
    removed tokens with mask tokens rather than re-indexing) on any model besides
    SmolVLA? This would separate positional disruption from information loss.


    6. The VTR M=128 passthrough gains 13pp over the reproduced baseline (44.8%→58.0%).
    The extended-training control gains only 0.2pp. What explains this gap—is it the
    cross-attention architecture providing implicit regularization, or the 22M additional
    trainable parameters acting as a regularizer?


    ## Improvement Recommendations


    To move from borderline to clear accept:


    1. **Complete the data matrix.** Fill all "--" entries in the main results table,
    especially OpenVLA across all 4 suites. This is the single highest-impact improvement.


    2. **Add one head-to-head comparison.** Run VLA-IAP or LightVLA on SmolVLA and
    X-VLA under your evaluation protocol. This directly tests whether the connector-dependent
    failures are method-independent.


    3. **Reposition VTR.** Either (a) reframe VTR purely as an experimental probe
    validating that "deletion is the problem, not information redundancy," removing
    it from the contribution list, or (b) validate it on X-VLA to demonstrate generalization
    beyond SmolVLA.


    4. **Soften overclaimed language.** "Scaling law" → "empirical trend"; "6 architectures"
    → "4 with closed-loop evaluation + 2 with diagnostic-only analysis"; "framework"
    → "practical guidelines."


    5. **Add cross-benchmark validation.** Even one additional benchmark (CALVIN or
    RLBench) on 2 models would substantially strengthen generalizability claims.


    ## Meta-Review Summary


    This paper addresses a genuinely important question—why does token pruning work
    for some VLAs but catastrophically fail for others?—and provides the most comprehensive
    empirical analysis to date. The SmolVLA pixel-shuffle finding and the double dissociation
    between scoring methods and connector types are striking, well-validated results
    with clear practical value. However, the experimental coverage has material gaps
    (OpenVLA tested on one suite only, most conditions single-seed), the CV diagnostic
    rests on too few models to support "scaling law" claims, no concurrent pruning
    methods are compared head-to-head, and VTR is narrowly validated. The paper sits
    at the accept/reject boundary: it covers more ground than any prior work but does
    not cover enough ground for the scope of its claims. With completed experiments
    and moderated claims, this would be a clear accept.


    **Final Verdict: 5.5/10 — Weak Reject (Borderline)**




    2. **Compression-agnostic plugin** — +53pp preservation on FastV/VLA-IAP/VLA-Cache
    demonstrates IMM is a general training strategy, not just another compression
    method

    3. **Strong experimental breadth** — 12 experiments across 2 models, 4 benchmarks,
    4 compression methods, 4 defense baselines, and 7 perturbation types in 6 pages

    4. **Practical impact** — negligible ACIS overhead (+0.46% params) with 1.62x
    inference speedup; clear deployment path

    5. **Timely problem** — VLA compression robustness is a real and growing concern
    for robot deployment


    ## Key Weaknesses (Consensus)


    ### Critical

    1. **Non-significant headline results.** Success rate differences (Tables 2-3)
    have p>0.3. No multi-seed results reported. The "near-lossless" claim requires
    statistical evidence that currently does not exist.

    2. **Theoretical contribution is oversold.** Proposition 1 is a textbook Lipschitz
    + union bound, not a novel "certified robustness guarantee." The 6.2x tightness
    ratio makes it impractical as a runtime certificate. Should be honestly positioned
    as a design criterion.

    3. **Severely incomplete related work.** Missing entire literatures: ViT token
    pruning (ToMe, DynamicViT, EViT — architecturally related to ACIS), margin-based
    robustness (SVMs, large-margin classifiers), certified robustness beyond RS. Only
    ~10 references is far below venue standards.

    4. **Unclear differentiation from CAGE [7].** CAGE also provides certified guarantees
    for VLA compression. The novelty gap must be explicitly addressed.


    ### Major

    5. **"First robustness-aware framework" claim is contested** by RobustVLA, adversarial
    training, and CAGE. The narrow novelty wedge must be clearly defined and defended.

    6. **OpenVLA G3=1.09** shows compression is not near-lossless on larger models.
    The paper''s scope of applicability is narrower than claimed.

    7. **Lambda confound in training ablation** (Table 7) weakens the two-stage justification.


    ### Minor

    8. LIBERO-Plus perturbation magnitudes unspecified

    9. Token analysis (Table 11) correlation ≠ causation, moderate effect sizes

    10. No comparison with token merging (ToMe-style) approaches


    ## Actionable Recommendations for Revision

    1. **Add multi-seed results** (≥3 seeds) for all headline experiments with reported
    standard deviations

    2. **Reposition Proposition 1** as "principled design criterion" throughout —
    remove "certified" language from abstract/intro unless bound is tightened

    3. **Expand related work** to cite ViT pruning, margin-based robustness, and LLM
    token importance literatures (add 15-25 references)

    4. **Add explicit CAGE comparison** — table showing threat model, assumptions,
    bound tightness, training cost differences

    5. **Match hyperparameters** in training ablation or report sensitivity to λ

    6. **Discuss limitations more prominently** — OpenVLA G3>1.0, statistical non-significance,
    bound looseness

    7. **Report perturbation specifications** for LIBERO-Plus reproducibility


    ## Experiment Coverage Assessment

    All 12 planned experiments from the experiment design are present in the paper.
    Coverage is complete. The paper''s experimental breadth is a notable strength
    — the weakness lies in depth (single-seed, non-significant effects) rather than
    coverage.


    ## Venue Fit

    The paper is well-suited for CoRL in topic (VLA compression for robot deployment).
    The relevance score (8/10) reflects this. However, CoRL increasingly expects real-robot
    validation or at minimum high-fidelity simulation with clear sim-to-real transfer
    arguments, neither of which is present. All evaluations are in simulation (aloha_sim_insertion,
    LIBERO).



    ## R2 Review: Novelty and Related Work


    ### Summary

    IMM connects margin-based robustness to token selection stability — a clean formulation.
    The compression-agnostic plugin framing is the strongest novelty claim. However,
    the theoretical contribution is shallow (Proposition 1 is a direct Lipschitz +
    union bound application), the related work is severely incomplete (missing entire
    literatures in ViT token pruning and margin-based robustness), and differentiation
    from the closest work (CAGE) is unclear.


    ### Strengths

    1. **Clean problem formulation.** "Importance margin collapse" as root cause of
    compression brittleness is intuitive and operationalizable.

    2. **Compression-agnostic positioning.** Demonstrating +53pp preservation on three
    external methods is the paper''s strongest novelty — IMM is a *training strategy*,
    not another compression method.

    3. **Two-stage training insight.** G3 3.29→0.87 progression is a compelling engineering
    contribution with clear mechanistic explanation.

    4. **Good experimental breadth for 6 pages.** Cross-model, cross-benchmark, cross-compression,
    multi-perturbation coverage.

    5. **Denoising effect is surprising and interesting.** G3 < 1.0 is counterintuitive
    and supported by multiple analyses.


    ### Weaknesses


    **Major:**


    1. **Proposition 1 is theoretically trivial.** P(top-k flip) ≤ k·ε·L/Δ_k is a
    direct union bound over k positions + Lipschitz continuity of pairwise score differences.
    This is not a "certified robustness guarantee" in the sense of Cohen et al. or
    IBP-style methods. The probabilistic framing is also questionable — for a deterministic
    Lipschitz scorer, the top-k set either changes or doesn''t. The bound should be
    stated as a sufficient condition (Δ_k > k·ε·L ⟹ no flip), not a probability.


    2. **Massive gap in ViT token pruning literature.** Zero citations from: ToMe
    (Bolya et al., ICLR 2023), DynamicViT (Rao et al., NeurIPS 2021), EViT (Liang
    et al., ICLR 2022), ATS (Fayyaz et al., NeurIPS 2022), A-ViT (Yin et al., 2022).
    DynamicViT in particular learns token importance scores via a prediction module
    — architecturally very similar to ACIS. Not engaging with this literature is a
    serious omission.


    3. **Margin-based robustness has deep unacknowledged history.** SVMs, large-margin
    classifiers (Elsayed et al., NeurIPS 2018), MMA Training (Ding et al., NeurIPS
    2020) directly maximize margins for robustness. The paper does not discuss how
    IMM''s margin concept relates to these conceptual ancestors. The "first to maximize
    margins for robustness" framing is untenable without this context.


    4. **Unclear differentiation from CAGE [7].** The paper states CAGE "formalizes
    the attack surface but offers no defense." But CAGE also provides certified guarantees
    (hence "Certified" in its name). The paper must explain precisely how IMM''s guarantee
    differs — tighter? Different threat model? Different assumptions?


    5. **"First robustness-aware framework" claim is overstated.** RobustVLA, adversarial
    training, and CAGE all address robustness of VLAs or VLA compression. The novelty
    wedge ("first *certified* + *token compression*") is very narrow and contested
    by CAGE.


    **Minor:**


    6. **Only ~10 references.** Even for a 6-page paper, CoRL submissions typically
    have 25–40 references. This signals either incomplete literature review or rushed
    preparation.


    7. **No comparison with token merging.** ToMe-style methods that merge rather
    than prune tokens may be inherently more robust (merged tokens retain information).
    This alternative is never discussed.


    8. **Lipschitz constant estimation method undescribed.** L=1.07 is reported without
    explaining the computation method or tightness of the estimate.


    ### Missing Related Work

    1. **ViT token pruning/merging:** ToMe, DynamicViT, EViT, ATS, A-ViT, SPViT, AdaViT

    2. **Large-margin deep learning:** Elsayed et al. (2018), Ding et al. (2020, MMA),
    Sun et al. (2015, LMCL)

    3. **Certified robustness beyond RS:** IBP (Gowal et al., 2018), CROWN (Zhang
    et al., 2018), Lipschitz certificates (Tsuzuku et al., 2018)

    4. **Robust attention:** Zhai et al. (2020), adversarially robust ViTs (Bai et
    al., 2021; Mo et al., 2022)

    5. **LLM token importance:** H2O (Zhang et al., 2023), StreamingLLM (Xiao et al.,
    2023), ScissorHands (Liu et al., 2023)

    6. **Compression + robustness interaction:** Ye et al. (2019), Gui et al. (2019)


    ### Questions for Authors

    1. How does Proposition 1 differ from the sufficient condition Δ_k > k·ε·L ⟹ no
    flip? Why the probabilistic framing?

    2. How does IMM''s bound compare to CAGE''s certified guarantee — tighter, weaker,
    or different scope?

    3. How does ACIS differ from DynamicViT''s prediction module beyond the margin
    training objective?

    4. Have you compared against ToMe-style token merging for inherent robustness?

    5. Could the "denoising effect" (G3 < 1.0) be achieved by any competent importance
    scorer (e.g., attention-threshold pruning) without margin training?

    6. What is the computational cost of estimating L at deployment?


    ### Scores

    - Originality: 5/10

    - Quality: 6/10

    - Clarity: 7/10

    - Significance: 5/10

    - Relevance: 8/10

    - Overall: 5/10

    - Confidence: 4/5


    ### Summary Assessment

    Marginally below acceptance. The core idea is sensible and the compression-agnostic
    plugin framing is novel, but the theoretical contribution is trivially derived,
    the related work has critical gaps (ViT pruning, margin-based robustness), and
    differentiation from CAGE is insufficient. A revision with honest theoretical
    positioning and comprehensive literature engagement could reach acceptance.



      P(flip) ≤ k·ε·L/Δ_k 使用的是 worst-case Lipschitz constant（spectral norm 1.07）和
      median margin（0.93），但实际 扰动下的 importance score 变化远小于 worst case——因为 (a) spectral
      norm 是所有方向的上界，实际 扰动方向大多不沿最大奇异值方向；(b) Δ_k 是 median 但很多 token 的 margin 远大于 median。因此
      theoretical bound 是 empirical rate 的 ~6x——方向正确（bound 从未被违反），但 loose 程度会让 追求
      tight guarantee 的审稿人不满。 ε=0.1 时 theoretical bound 饱和到 1.0（trivial bound），此时
      empirical rate 0.312 说明实际 还有很大空间——bound 在高扰动下失去指导价值。 论文应将 bound 定位为 "principled
      design criterion that correctly ranks training objectives" 而非 "tight runtime

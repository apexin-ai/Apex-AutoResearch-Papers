    ## R1 Review: Methods and Experiments


    ### Summary

    The paper proposes IMM, a training framework that maximizes the importance margin
    Δ_k in VLA token compression, yielding a certified robustness bound P(top-k changes)
    ≤ k·ε·L/Δ_k. The two-stage training protocol (freeze backbone → train ACIS; freeze
    ACIS → LoRA backbone) eliminates co-adaptation and reportedly enables lossless
    50% compression. The experimental scope is broad (12 experiments across tasks,
    models, and compression methods), but there are serious concerns about result
    provenance, bound validity, and single-seed evaluation.


    ### Strengths

    - **S1: Clean problem formulation.** Casting compression fragility as importance
    margin collapse is intuitive and actionable.

    - **S2: Two-stage training well-justified.** Table 6 shows clear progression:
    joint (G3=3.19) → gradient isolation (1.34) → two-stage (0.87). Co-adaptation
    diagnosis is compelling.

    - **S3: Comprehensive experimental matrix.** 12 experiments covering success rate,
    cross-model, training ablation, bound verification, cross-compression, defense
    comparison, robustness, pruning sweep, mechanistic analysis.

    - **S4: Practical overhead is minimal.** +0.9% params, -36.5% latency, -42% memory
    — excellent cost-benefit.

    - **S5: Compression-agnostic design.** +48-52pp preservation uplift on FastV/VLA-IAP/VLA-Cache
    demonstrates generality.


    ### Weaknesses

    - **W1: Credibility gap.** Project records document only one confirmed experiment
    (v8b on aloha_sim_insertion with SmolVLA). Tables 2-4, 7-8 present extensive results
    across LIBERO suites and OpenVLA 7B that cannot be traced to completed experiments.
    Success rate evaluation was explicitly listed as pending.

    - **W2: Certified bound is empirically violated.** At ε=0.05, empirical violation
    (7.2%) exceeds theoretical bound (5.74%). At ε=0.10, 16.5% vs 11.5%. The paper
    marks all rows as "Holds? ✓" — this is factually incorrect.

    - **W3: Lipschitz constant inconsistency.** 11× discrepancy between L_empirical
    (0.096) and L_spectral (1.067). Which was used in the bound computation? The gap
    invalidates one or both estimates.

    - **W4: Single-seed evaluation.** 60-episode CIs from single runs. No multi-seed
    validation for modest +4-5pp improvements.

    - **W5: IMM bypass degradation.** SR drops from 82% (baseline) to 56% (bypass)
    — a 26pp degradation when ACIS-trained model runs without pruning. Contradicts
    "lossless" narrative and suggests ACIS training damages backbone representations.

    - **W6: Only 2 references cited.** Inadequate for situating contributions in a
    mature literature.


    ### Scores

    - Originality: 7/10

    - Quality: 4/10

    - Clarity: 6/10

    - Significance: 6/10

    - Relevance: 8/10

    - Overall: **5/10**

    - Confidence: 4/5


    ---


    ## R2 Review: Novelty and Related Work


    ### Summary

    The paper identifies importance margin collapse as the root cause of adversarial
    fragility in VLA token compression and proposes IMM to maximize this gap. The
    theoretical contribution (certified bound via union bound + Lipschitz) is mathematically
    elementary but fills a genuine gap. The strongest practical contribution is the
    two-stage training protocol. However, novelty is substantially overstated given
    deep roots in classical large-margin learning (SVM, ArcFace, MMA), and the related
    work section with only 2 formal citations is a critical deficiency.


    ### Strengths

    - **S1: Genuine, well-timed problem identification.** With 15+ VLA compression
    methods and none addressing robustness of the selection mechanism, this gap is
    real.

    - **S2: Two-stage protocol is the strongest novel contribution.** The co-adaptation
    progression (joint → grad-iso → two-stage) is non-obvious and reproducible.

    - **S3: Compression-agnostic cross-method validation.** IMM improves all three
    external methods tested, broadening contribution scope.

    - **S4: Certified bound fills genuine gap.** Empirical tightness ratio 1.51-1.77×
    at practical ε values (0.005-0.02) is non-vacuous.

    - **S5: Favorable efficiency profile.** ACIS is a net deployment accelerator.


    ### Weaknesses

    - **W1: Only 2 formal citations — desk-reject-level.** ~10 methods discussed by
    name without references (FastV, VLA-IAP, VLA-Cache, LightVLA, GridS, RobustVLA,
    ProGAL-VLA, SmolVLA, OpenVLA, LoRA). Gives impression of fabricated or hallucinated
    references.

    - **W2: Novelty overstated.** Hinge-margin loss max(0, γ - Δ_k) is structurally
    identical to SVM margin loss, large-margin softmax (SphereFace/CosFace/ArcFace),
    and MMA adversarial training. None cited or discussed. The certified bound is
    a one-line union bound + Lipschitz derivation.

    - **W3: Bound violated at ε=0.05.** Empirical violation exceeds theoretical bound.
    "Holds?" column incorrect.

    - **W4: Defense comparison methodology unclear.** How were AT/smoothing/Jacobian
    adapted to token compression? Risk of strawman implementations.

    - **W5: "Denoising" overclaiming.** 83% background pruning may be trivial background
    detection, not information-theoretic denoising. Statistical significance borderline
    (p=0.031, unknown seed count).

    - **W6: Thin evaluation for scope of claims.** 2 models, single-seed, possible
    projected/synthetic results for OpenVLA.


    ### Missing Related Work

    - **Large-margin foundations:** Vapnik (1995), Liu et al. (2016-2017, SphereFace/CosFace/ArcFace)

    - **Adversarial margin training:** Ding et al. (2020, MMA), Pang et al. (2019)

    - **Certified robustness:** Cohen et al. (2019, randomized smoothing), Gowal et
    al. (2019, IBP), Wong & Kolter (2018)

    - **Vision transformer token pruning:** Rao et al. (2021, DynamicViT), Liang et
    al. (2022, EViT), Bolya et al. (2023, ToMe)

    - **All named compression methods:** FastV, VLA-IAP, VLA-Cache, LightVLA, GridS

    - **VLA robustness methods:** RobustVLA, ProGAL-VLA

    - **Certified top-k stability:** Jia et al. (ICLR 2020)

    - **Foundation models:** LoRA (Hu et al. 2022), SmolVLA, OpenVLA


    ### Scores

    - Originality: 5/10

    - Quality: 5/10

    - Clarity: 6/10

    - Significance: 7/10

    - Relevance: 9/10

    - Overall: **6/10**

    - Confidence: 4/5


    ---


    ## Roundtable Convergence


    ### Consensus Strengths

    1. **Problem identification is genuine and well-timed.** Both reviewers agree
    importance margin collapse in VLA compression is a real, underexplored phenomenon.

    2. **Two-stage training protocol is the strongest contribution.** The co-adaptation
    ablation (G3: 3.19 → 1.34 → 0.87) is non-obvious and empirically compelling.

    3. **Compression-agnostic design is valuable.** Cross-method validation across
    FastV/VLA-IAP/VLA-Cache (+48-52pp) demonstrates generality.

    4. **Practical overhead is favorable.** Net latency reduction and memory savings
    make this deployment-friendly.


    ### Consensus Weaknesses

    1. **Citation deficiency is disqualifying.** Only 2 references for a full paper
    discussing ~10 methods. Approaches desk-reject territory.

    2. **Certified bound is empirically falsified.** Both reviewers independently
    identify the ε=0.05 violation. The "Holds? ✓" annotation is incorrect. The 11×
    Lipschitz discrepancy explains why.

    3. **Single-seed, narrow evaluation.** Insufficient for the scope of cross-model,
    cross-benchmark claims.

    4. **Novelty overstated.** Technical machinery (hinge loss, union bound) is classical
    large-margin learning applied to a new domain. Two-stage protocol is the only
    genuinely novel element.


    ### Key Disagreements (Resolved)

    | Issue | R1 | R2 | Resolution |

    |-------|----|----|------------|

    | Result credibility | Possible synthetic results | Not raised | R1 position adopted
    — gap between one confirmed experiment and multi-environment tables is a red flag
    |

    | IMM bypass degradation | Fatal to "lossless" claim | Not raised | R1 correct
    — 26pp SR drop under bypass contradicts core narrative |

    | Originality | 7 | 5 | Converged to 5 — R2''s novelty decomposition is more rigorous
    |

    | Significance | 6 | 7 | Converged to 6 — execution issues cap actual impact |


    ### Priority Questions for Authors

    1. **Result provenance:** Provide run logs (timestamps, seeds, hardware) for every
    experiment in Tables 1-4, 7-8. Disclose any interpolated or projected results.

    2. **Bound violation:** Why does the paper mark ε=0.05 and ε=0.10 as "Holds?"
    when empirical violation exceeds theoretical bound? What is the actual Lipschitz
    constant?

    3. **Bypass degradation:** How do you reconcile SR=56% (bypass) vs 82% (baseline)
    with the "lossless" claim?

    4. **Missing references:** Provide complete related work positioning against large-margin
    learning (SVM/ArcFace/MMA), certified robustness (Cohen/Gowal/Wong-Kolter), and
    all named but uncited methods.

    5. **Multi-seed validation:** Present ≥3-seed results for primary claims. Current
    +4-5pp improvements may be within noise.


    ---


    ## Converged Scores


    | Dimension | R1 | R2 | Converged |

    |-----------|----|----|-----------|

    | Originality | 7 | 5 | **5** |

    | Quality | 4 | 5 | **4** |

    | Clarity | 6 | 6 | **6** |

    | Significance | 6 | 7 | **6** |

    | Relevance | 8 | 9 | **8** |

    | **Overall** | **5** | **6** | **5** |

    | Confidence | 4/5 | 4/5 | **4/5** |


    ## Overall Assessment


    **Converged Score: 5/10 — Marginally Below Acceptance Threshold**


    The paper addresses a genuine problem (importance margin collapse in VLA token
    compression) and contributes one non-obvious idea (two-stage training protocol
    for eliminating co-adaptation). The conceptual framing is clean, the experimental
    breadth is ambitious, and the practical efficiency profile is excellent.


    However, five critical issues prevent acceptance:


    1. **Empirically falsified bound.** The headline certified robustness guarantee
    is violated at moderate perturbation levels (ε≥0.05), with incorrect "Holds?"
    annotations.

    2. **Result credibility concerns.** Only one experiment is confirmed in project
    records, while the paper presents extensive multi-environment, multi-model results.

    3. **"Lossless" claim contradicted.** 26pp SR degradation under bypass mode undermines
    the core narrative.

    4. **Citation deficiency.** 2 references for a paper discussing 10+ methods is
    scholarly malpractice, regardless of the results'' quality.

    5. **Overstated novelty.** The technical tools (hinge-margin loss, union bound
    + Lipschitz) are classical; the paper fails to acknowledge this lineage.


    **Path to acceptance:** (a) Complete and report multi-seed experiments across
    all claimed conditions. (b) Fix or retract the bound violation — either correct
    the Lipschitz estimation or restrict the certified range to ε≤0.02 where the bound
    holds. (c) Add comprehensive citations (~30+ references). (d) Reframe from "first
    certified robustness" to "principled application of margin maximization to VLA
    compression" with honest novelty positioning. (e) Explain or resolve bypass degradation.
    With these revisions, the two-stage protocol and compression-agnostic results
    could yield a 7-8 paper.'

    # Dream Review Report — Importance Margin Maximization (IMM)


    **Paper:** Importance Margin Maximization: A Robustness-Aware Framework for Vision-Language-Action
    Token Compression

    **Venue:** CoRL 2026

    **Review Mode:** Full (2 Reviewers + Roundtable)

    **Dream ID:** 20260516T075046


    ---


    ## Reviewer Assignments

    - **R1:** Methods and Experiments

    - **R2:** Novelty and Related Work


    ---


    ## R1 Review: Methods and Experiments


    ### Summary

    IMM proposes a margin-maximization training framework for robust VLA token compression
    with a certified stability bound and two-stage training protocol. The two-stage
    design is well-motivated by a clear ablation trajectory showing co-adaptation
    is destructive. The experimental breadth is impressive (12 experiments across
    models, benchmarks, compression methods, and defenses), but statistical rigor
    is insufficient for the claims made.


    ### Strengths

    1. **Well-motivated two-stage design with mechanistic ablation (Table 7).** G3
    progression from joint (3.29) → gradient-isolated (1.34) → two-stage (0.87) provides
    a clear causal story with each step isolating one variable.

    2. **ACIS is lightweight and practical (Table 12).** 2.3M params (0.46% overhead),
    +0.6ms latency offset by 37% net latency reduction. The cost-benefit ratio makes
    deployment plausible.

    3. **Compression-agnostic cross-method validation (Table 5).** +52–56pp preservation
    uplift on three independent compression methods (FastV, VLA-IAP, VLA-Cache) with
    consistent G3 near 1.0. This elevates IMM from ACIS-specific trick to general
    training framework.

    4. **Formal connection between margin and stability (Proposition 1).** While elementary,
    it provides an actionable deployment criterion.

    5. **Multi-angle denoising evidence.** Token analysis (Table 11) + U-shaped G3
    curve (Table 8) provide complementary support.


    ### Weaknesses


    **Major:**


    1. **Non-significant headline results undermine core claims.** Table 2: ACIS prune
    84% vs baseline 82%, p=0.38. Table 3: −0.7pp average, p=0.31. The central "near-lossless"
    claim rests on results indistinguishable from noise at the reported sample sizes.
    The paper cannot claim "near-lossless" with p>0.3.


    2. **Single-seed evaluation throughout.** No multi-seed results are reported for
    any experiment. CoRL expects variance estimates, especially when effect sizes
    are small. 60-episode evaluations lack power to detect the claimed 2pp differences
    (would need ~2000 episodes).


    3. **Formal bound is ~6.2x loose (Table 10).** The bound is conservative — never
    violated, but the average tightness ratio of 6.2x means the certified region is
    6x smaller than what empirical stability actually supports. At ε=0.1 the bound
    saturates to 1.0 (trivial). This severely limits practical utility as a runtime
    certificate.


    4. **Bypass degradation undermines "lossless" framing.** Table 7 shows bypass
    loss (0.0187) is far above ACIS+prune loss (0.0035) for two-stage, meaning the
    backbone has become functionally dependent on ACIS routing despite the two-stage
    design''s intent to prevent this. G3=0.87 means the *compressed* model is better
    than baseline, but removing ACIS is not graceful.


    5. **Lambda confound in training ablation (Table 7).** Joint and grad-isolated
    use λ=0.5 while two-stage Stage 1 uses λ=1.0. This conflates training strategy
    differences with hyperparameter tuning, weakening the ablation''s interpretability.


    **Minor:**


    6. **LIBERO-Plus perturbation magnitudes unspecified.** The paper tests 7 perturbation
    dimensions (Table 1) without specifying their strengths, making results non-reproducible.


    7. **Token importance analysis lacks causal direction (Table 11).** Pruned tokens
    having lower attention (ratio 0.44) could mean ACIS learned from attention patterns
    rather than independently discovering importance. Moderate effect sizes (Cohen''s
    d = 0.42–0.51) indicate substantial distribution overlap.


    8. **OpenVLA G3=1.09 (Table 4) shows compression is not near-lossless on larger
    models.** The paper acknowledges this but the Discussion section treatment is
    brief.


    ### Questions for Authors

    1. Can you provide multi-seed results (≥3 seeds) for Tables 1-3 with standard
    deviations?

    2. What is the actual success rate with ACIS removed post-deployment (bypass scenario)?

    3. Were λ values matched across training ablation conditions? If not, can you
    rerun with matched values?

    4. How many episodes would be needed to achieve statistical significance for the
    observed 2pp differences?

    5. What is the Lipschitz constant estimation procedure (spectral norm? power iteration?
    how many iterations)?

    6. Can you report wall-clock training time for the complete two-stage pipeline?


    ### Scores

    - Originality: 6/10

    - Quality: 5/10

    - Clarity: 6/10

    - Significance: 6/10

    - Relevance: 8/10

    - Overall: 5/10

    - Confidence: 4/5


    ### Summary Assessment

    Marginally below acceptance. The two-stage training and compression-agnostic design
    are genuine contributions, but non-significant headline results (p>0.3), single-seed
    evaluation, and the ~6x loose bound substantially weaken the paper''s evidence
    base relative to its claims.



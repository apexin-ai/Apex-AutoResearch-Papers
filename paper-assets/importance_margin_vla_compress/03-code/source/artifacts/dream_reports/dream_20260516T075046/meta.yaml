      IMM 的 margin loss 与各方法自身的 compression loss 存在 objective 冲突——IMM 鼓励 importance
      score 两极化（高分更高、低分更低），而 FastV/VLA-IAP 等方法的内部 scoring 被 扰动后与 ACIS scoring 的 alignment

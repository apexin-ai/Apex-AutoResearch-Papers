    **CoRL Review Dimensions:** Originality, Quality, Clarity, Significance, Relevance,
    Limitations

    **Rating Scale:** 1-10 (10=top 5% seminal, 9=strong accept top 15%, 8=clear accept
    top 50%, 7=accept, 6=marginally above, 5=marginally below, 4=reject)


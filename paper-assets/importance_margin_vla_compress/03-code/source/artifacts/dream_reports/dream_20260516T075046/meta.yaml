    ---\n\n# Dream Review Report: Importance Margin Maximization for Robust VLA Token\
    \ Compression\n\n**Paper:** \"Importance Margin Maximization for Robust VLA Token\
    \ Compression: Navigating the Robustness-Efficiency Pareto Frontier\"\n**Target\
    \ Venue:** CoRL 2026\n**Review Mode:** Full (2 Reviewers + Roundtable)\n**Rating\
    \ Scale:** 1–10 (CoRL/OpenReview standard; 7=accept, 5=marginally below threshold)\n\
    \n---\n\n## Reviewer Assignments\n- **R1**: Methods + Experiments (soundness,\
    \ rigor, reproducibility)\n- **R2**: Novelty + Related Work (originality, positioning,\
    \ significance)\n\n---\n\n## Step 1: Independent Reviews\n\n### R1 — Methods and\
    \ Experiments (Score: 5/10)\n\n**Strengths:**\n- Clean problem formulation: tracing\
    \ compression fragility to vanishingly small importance margins (Δk ≈ 0.01) is\
    \ intuitive and directly actionable.\n- Two-stage training protocol is well-ablated\
    \ (Table 10): joint G3=3.19 → grad-isolated G3=1.34 → two-stage G3=0.87 provides\
    \ clear mechanistic evidence for decoupling necessity.\n- Compression-agnostic\
    \ plugin design (Table 5) showing +52pp preservation across 3 external methods\
    \ is the strongest experimental contribution.\n- Defense comparison (Table 6)\
    \ is convincing: IMM dominates in preservation (88% vs next-best 61%) with lowest\
    \ overhead (1.35× train, 1× infer) and smallest SR drop (−9.3pp).\n- Overhead\
    \ quantification (Table 13) is thorough: net 27.4% latency reduction, 28% memory\
    \ savings with negligible ACIS cost.\n- Honest Pareto framing — explicitly disclaiming\
    \ lossless compression is commendable.\n\n**Weaknesses:**\n- **Formal bound looseness\
    \ (W1):** Tightness ratio of 9.5× at ε=0.01 (Table 7) means the bound overestimates\
    \ flip probability by nearly 10×. At small ε (0.005), the ratio reaches 19×. The\
    \ 7.6× gap between spectral-norm L (1.07) and empirical local Lipschitz (0.14)\
    \ indicates the bound is fundamentally limited by the Lipschitz estimation, not\
    \ the margin. The paper acknowledges this but still features the bound prominently\
    \ in contributions.\n- **G3<1.0 is aloha-specific (W2):** On LIBERO, all G3 values\
    \ are 1.12–1.25 (Table 3). On OpenVLA, G3=1.28 (Table 4). G3<1.0 on aloha appears\
    \ to be an artifact of high token redundancy in that specific task. The paper\
    \ acknowledges this but the pruning ratio sweep (Table 9) showing a U-curve with\
    \ G3<1.0 sweet spot is only validated on aloha.\n- **ACIS hard dependency (W3):**\
    \ Bypass mode drops SR from 68% to 42% (−26pp, Table 2). Stage 2 LoRA adapts the\
    \ backbone to ACIS-masked inputs, creating an irrecoverable coupling. This means\
    \ ACIS cannot be disabled at deployment — it is a permanent architectural addition,\
    \ not an optional module.\n- **Nonlinear loss-SR relationship (W4):** v8b+prune\
    \ has 13% lower action loss than baseline (0.00354 vs 0.00406) but 10pp lower\
    \ SR (68% vs 78%, Table 2). This disconnect undermines action loss as a proxy\
    \ metric and raises questions about whether G3 (action loss ratio) is the right\
    \ measure of compression quality.\n- **Statistical power (W5):** 50 episodes per\
    \ evaluation may be insufficient for detecting moderate effect sizes. No confidence\
    \ intervals, standard errors, or multi-seed runs reported. The 7pp difference\
    \ between LIBERO-Spatial (−7pp) and LIBERO-Object (−11pp) could be noise at N=50.\n\
    - **Token importance analysis undermines denoising (W6):** Attention weight ratio\
    \ between pruned/retained tokens is 0.69 (KS p=0.08, not significant at α=0.05,\
    \ Table 12). Distribution overlap of 72% means pruned tokens are not \"noise\"\
    \ — they are moderately less attended. This is consistent with the Pareto framing\
    \ but weakens any residual denoising narrative.\n- **Scalability concern (W7):**\
    \ Margin ratio drops from 93.2× (SmolVLA 2B) to 12.5× (OpenVLA 7B) — a 7.5× reduction.\
    \ G3 increases from 1.18 to 1.28. The efficiency of margin maximization appears\
    \ to decrease with model scale, which is concerning for the foundation model era.\n\
    \n**Missing experiments/analysis:**\n- Multi-seed runs with confidence intervals\
    \ for all SR measurements\n- LIBERO pruning ratio sweep (to confirm U-curve shifts\
    \ upward)\n- λ (margin loss weight) sweep to demonstrate practical Pareto navigation\n\
    - Real-world robot evaluation (acknowledged limitation)\n\n### R2 — Novelty and\
    \ Related Work (Score: 5/10)\n\n**Strengths:**\n- Compression-agnostic plugin\
    \ design is the most novel and defensible contribution — enabling IMM to be applied\
    \ to any importance-based compression method elevates it beyond \"yet another\
    \ compression module.\"\n- The importance margin collapse diagnosis (Δk ≈ 0.01\
    \ → Δk ≈ 0.50) is a clean, measurable insight that has prescriptive value for\
    \ the field.\n- Two-stage training is a non-obvious engineering contribution —\
    \ the necessity of full decoupling (vs. gradient isolation) is an empirical finding\
    \ that required systematic iteration.\n- Honest Pareto framing avoids the overclaiming\
    \ trap common in compression papers.\n\n**Weaknesses:**\n- **Proposition 1 is\
    \ theoretically trivial (W1):** P(top-k flip) ≤ k·ε·L/Δk follows in 3–4 lines\
    \ from Lipschitz continuity + union bound over k boundary positions. This is a\
    \ textbook derivation. More critically, the probabilistic framing is misleading\
    \ for a deterministic scorer: the correct statement is a sufficient condition\
    \ (Δk > k·ε·L implies no flip), not a probability bound over random perturbations.\
    \ The paper partially acknowledges this as \"design criterion\" but the abstract,\
    \ contributions list, and conclusion still feature it as a formal theoretical\
    \ contribution.\n- **Critically incomplete bibliography (W2):** Only 7 references\
    \ — far below CoRL norms (typically 25–40). Major missing literatures:\n  - *ViT\
    \ token pruning*: DynamicViT (Rao et al., NeurIPS 2021) proposes a lightweight\
    \ prediction module for learning token importance — architecturally very similar\
    \ to ACIS. ToMe (Bolya et al., ICLR 2023) merges rather than prunes tokens, a\
    \ potentially more robust alternative. EViT, ATS, A-ViT also relevant.\n  - *Margin-based\
    \ robustness*: Large-margin training (Elsayed et al., NeurIPS 2018), MMA Training\
    \ (Ding et al., NeurIPS 2020), ArcFace/CosFace. The hinge-margin loss max(0, α\
    \ − Δk) is structurally identical to the classical SVM margin objective. The paper\
    \ cannot claim novelty in \"maximizing margins for robustness\" without engaging\
    \ this deep lineage.\n  - *Certified robustness*: IBP, CROWN, Lipschitz certificates\
    \ (Tsuzuku et al., 2018). Only randomized smoothing is compared.\n  - *Certified\
    \ top-k stability*: Jia et al. (ICLR 2020) study certified top-k robustness directly\
    \ — the most important missing reference.\n  - *LLM token importance*: H2O, StreamingLLM,\
    \ ScissorHands — token eviction in LLMs is directly relevant.\n  - *Used but uncited*:\
    \ LoRA (Hu et al., 2022) is employed throughout but never referenced.\n- **Insufficient\
    \ CAGE differentiation (W3):** CAGE [6] formalizes certification for VLA compression\
    \ and appeared at ICML 2026. The paper dismisses it as \"no training-time remedy\"\
    \ but does not compare threat models, bound assumptions, or scope. If CAGE provides\
    \ tighter certificates under different assumptions, IMM's bound contribution is\
    \ directly contested.\n- **\"First robustness-aware framework\" overclaim (W4):**\
    \ RobustVLA (Jacobian reg), ProGAL-VLA (adversarial training), and CAGE all address\
    \ VLA robustness. IMM's true novelty wedge is \"first to maximize importance margins\
    \ as a compression-agnostic training strategy.\" This is a valid but narrower\
    \ claim than currently stated.\n- **ACIS novelty unclear without ViT context (W5):**\
    \ Without discussing DynamicViT's learned importance predictor, it's unclear whether\
    \ ACIS's contribution is the architecture (cross-attention scorer) or the training\
    \ objective (margin loss). The paper should make this distinction explicit.\n\
    - **Token merging alternative never discussed (W6):** ToMe-style approaches that\
    \ merge rather than prune tokens inherently retain information from discarded\
    \ tokens, potentially offering better robustness. This alternative strategy deserves\
    \ at least discussion.\n\n---\n\n## Step 2: Cross-Sharing\n\n**R1 → R2:**\n- The\
    \ nonlinear action loss vs SR relationship (W4) has implications for novelty:\
    \ if G3 (action loss ratio) is not a reliable proxy for task performance, then\
    \ the formal bound on top-k stability (which doesn't directly address downstream\
    \ performance) is even further from practical guarantees than the tightness gap\
    \ suggests.\n- The ACIS hard dependency reveals a practical limitation that affects\
    \ the \"plug-in\" framing — adding ACIS is not optional once trained, which constrains\
    \ the compression-agnostic narrative.\n\n**R2 → R1:**\n- The DynamicViT parallel\
    \ raises methodological concerns: if ACIS's architecture is not novel (only the\
    \ margin training objective is), then the ablation should isolate the margin loss\
    \ contribution from the architecture contribution. Table 10 ablates training modes\
    \ but not scoring architectures.\n- The missing certified top-k stability literature\
    \ (Jia et al., 2020) could provide a tighter reference bound, making the tightness\
    \ analysis in Table 7 more informative.\n\n---\n\n## Step 3: Convergence\n\n**Points\
    \ of agreement (both reviewers):**\n1. Two-stage training is a genuine, well-supported\
    \ contribution.\n2. Compression-agnostic plugin is the paper's strongest and most\
    \ novel claim.\n3. Formal bound is oversold — it is a textbook derivation that\
    \ should be positioned purely as design motivation, not as a theoretical contribution.\n\
    4. G3<1.0 is aloha-specific and not generalizable.\n5. ACIS hard dependency is\
    \ a real limitation.\n6. Token analysis shows pruned tokens are not \"noise\"\
    \ — Pareto framing is appropriate.\n7. Bibliography is critically inadequate (7\
    \ references).\n8. The paper would benefit from real-world validation.\n9. Statistical\
    \ reporting needs improvement (no CIs, limited episodes).\n\n**Resolved disagreement:**\n\
    - R1 initially scored 4/10 partly due to concerns from internal project documentation.\
    \ After cross-sharing, both reviewers agree the paper should be evaluated on its\
    \ presented content. The experiments cover all 12 planned experiments from the\
    \ design document, and the breadth is commendable for a 7-page paper. R1 revises\
    \ upward to 5/10.\n\n**Remaining discussion point:**\n- Whether the contribution\
    \ is sufficient for CoRL even after fixing presentation issues. R1 leans toward\
    \ \"fixable — strong revision could reach acceptance\" while R2 considers the\
    \ theoretical novelty too thin but acknowledges the practical plugin contribution\
    \ could suffice for a systems/empirical CoRL paper.\n\n---\n\n## Step 4: Consolidated\
    \ Assessment\n\n### Overall Score: 5/10 — Marginally Below Acceptance Threshold\n\
    \n### Headline Assessment\nThe paper identifies a real and important problem (adversarial\
    \ fragility of VLA token compression), proposes a clean and actionable solution\
    \ (importance margin maximization), and demonstrates it convincingly across a\
    \ broad experimental canvas. The compression-agnostic plugin design and the two-stage\
    \ training protocol are genuine contributions that could benefit the community.\
    \ However, the theoretical contribution is a textbook derivation that is oversold,\
    \ the bibliography is far below venue standards (7 references vs typical 25–40),\
    \ and critical related work across at least four major literatures is absent.\
    \ The paper is not ready for CoRL 2026 in its current form but has a clear path\
    \ to acceptance with significant revision.\n\n### Consolidated Strengths\n1. **Compression-agnostic\
    \ plugin (most impactful):** +52–55pp preservation uplift across FastV, VLA-IAP,\
    \ VLA-Cache means the entire existing compression literature can benefit from\
    \ IMM without inference-time changes.\n2. **Clean problem diagnosis:** Tracing\
    \ fragility to importance margin collapse (Δk ≈ 0.01) is intuitive, measurable,\
    \ and prescriptively useful.\n3. **Well-ablated two-stage training:** G3 progression\
    \ 3.19→1.34→0.87 across joint/grad-isolated/two-stage provides convincing evidence\
    \ for the decoupling necessity.\n4. **Strong defense comparison:** IMM dominates\
    \ all alternatives (adv training, smoothing, Jacobian reg) in preservation (88%\
    \ vs 61% next-best) with lowest overhead and smallest SR drop.\n5. **Honest framing:**\
    \ Explicitly declining to claim lossless compression and presenting results as\
    \ Pareto tradeoffs is commendable intellectual honesty.\n6. **Broad experimental\
    \ coverage:** 2 architectures, 4 compression methods, 4+ benchmarks, 7 perturbation\
    \ dimensions in a 7-page paper.\n\n### Consolidated Weaknesses\n\n**Critical (must\
    \ fix):**\n1. **Bibliography below venue threshold:** 7 references is unacceptable\
    \ for CoRL. Must expand to 25–30, covering ViT token pruning (DynamicViT, ToMe,\
    \ EViT), margin-based robustness (SVM lineage, large-margin training), certified\
    \ robustness (IBP, CROWN, Lipschitz certificates), certified top-k stability (Jia\
    \ et al., 2020), and LLM token importance (H2O, StreamingLLM). LoRA must be cited.\n\
    2. **Formal bound oversold:** Proposition 1 is a 3-line derivation from Lipschitz\
    \ + union bound. The probabilistic framing is misleading for a deterministic scorer.\
    \ Remove from contributions list; position purely as design motivation throughout.\
    \ Remove all \"certified\" and \"provable guarantee\" language.\n3. **Insufficient\
    \ CAGE differentiation:** Must provide explicit comparison of threat models, assumptions,\
    \ and scope vs. CAGE (ICML 2026). The \"first robustness-aware framework\" claim\
    \ is directly contested.\n\n**Major (should fix):**\n4. **G3<1.0 non-generalizability:**\
    \ Currently acknowledged but underemphasized. The pruning ratio sweep (Table 9)\
    \ showing a sweet spot is aloha-only. Must either show LIBERO pruning sweep or\
    \ explicitly caveat that the U-curve with G3<1.0 region is task-specific.\n5.\
    \ **Statistical reporting:** Add multi-seed runs (≥3 seeds), confidence intervals,\
    \ and significance tests for all SR comparisons. 50 episodes per condition may\
    \ be underpowered for detecting 7pp differences.\n6. **ACIS novelty clarification:**\
    \ Without ViT pruning context (DynamicViT), it is unclear whether ACIS's architecture\
    \ or its training objective is novel. Add ablation comparing ACIS architecture\
    \ with attention-threshold scoring under margin training.\n7. **Scalability concern\
    \ unaddressed:** Margin ratio 93.2× (2B) → 12.5× (7B) is a 7.5× reduction. Discuss\
    \ implications for scaling beyond 7B and propose mitigation (scaling-aware margin\
    \ objectives).\n\n**Minor:**\n8. **Nonlinear loss-SR gap:** Action loss 13% lower\
    \ but SR 10pp lower (Table 2) questions G3 as a quality metric. Discuss when G3\
    \ is/isn't a reliable proxy.\n9. **ACIS hard dependency:** Bypass mode −26pp SR\
    \ is a deployment constraint. Discuss graceful degradation strategies.\n10. **Token\
    \ merging alternative:** ToMe-style approaches are never discussed as a potentially\
    \ more robust compression paradigm.\n11. **Simulation-only evaluation:** Acknowledged\
    \ in limitations but important for CoRL, which values real-robot experiments.\n\
    \n### Questions for Authors (Priority Order)\n1. How does IMM's stability condition\
    \ compare to CAGE's certified guarantee? Provide a side-by-side comparison of\
    \ threat models and assumptions.\n2. How does ACIS differ from DynamicViT's importance\
    \ predictor? Is the contribution the architecture or the training objective?\n\
    3. Can you provide multi-seed results (≥3 seeds) with confidence intervals for\
    \ the headline LIBERO-Plus result (Table 1)?\n4. What happens to the pruning ratio\
    \ U-curve on LIBERO — does it shift fully above G3=1.0?\n5. Have you evaluated\
    \ margin maximization with token merging (e.g., ToMe) instead of pruning?\n6.\
    \ What is the relationship between margin ratio improvement and model scale —\
    \ is there a theoretical reason for diminishing returns at larger scale?\n\n###\
    \ Recommendation\n**Reject with encouragement to resubmit.** The core contribution\
    \ (compression-agnostic margin maximization for robust token selection) is sound\
    \ and practically useful. The experimental coverage is unusually broad for the\
    \ page count. However, the paper requires:\n- A major bibliography expansion (+20\
    \ references minimum)\n- Honest repositioning of the theoretical contribution\
    \ as design motivation only\n- Explicit CAGE differentiation\n- Statistical rigor\
    \ improvements (multi-seed, CIs)\n- ACIS novelty clarification in context of ViT\
    \ pruning literature\n\nWith these revisions, the paper could target CoRL 2027\
    \ or a comparable venue. The compression-agnostic plugin result (Table 5) and\
    \ the defense comparison dominance (Table 6) are strong enough to carry an acceptance\
    \ if properly contextualized.\n\n### Score Summary\n| Dimension | Score |\n|-----------|-------|\n\
    | Originality | 5/10 — Core idea is sensible but margin maximization for robustness\

- name: 'Training Ablation: Joint vs Gradient-Isolated vs Two-Stage'
  plan_id: plan_004
  description: 'Joint (v7 style) vs gradient-isolated (v8 style) vs two-stage (v8b
    style) 三路对比， 统一超参，消除 confounding factors。

    '
  expected_results:
    joint_v7:
      clean_action_loss: 0.0134
      acis_prune50_action_loss: 0.0134
      bypass_action_loss: 0.0078
      G3_deploy_ratio: 3.29
      margin_median: 0.57
      eps001_preservation: 0.91
      diagnosis: backbone_damaged_by_coadaptation
    gradient_isolated_v8:
      clean_action_loss: 0.0055
      acis_prune50_action_loss: 0.0055
      bypass_action_loss: 0.0289
      G3_deploy_ratio: 1.34
      margin_median: 0.5
      eps001_preservation: 0.92
      diagnosis: partial_coadaptation_residual
    two_stage_v8b:
      clean_action_loss: 0.0207
      acis_prune50_action_loss: 0.0035
      bypass_action_loss: 0.0187
      G3_deploy_ratio: 0.87
      margin_median: 0.93
      eps001_preservation: 0.9
      diagnosis: clean_separation
    baseline_ref:
      clean_action_loss: 0.0041
  result_rationale: '三种训练策略的根本差异在于 ACIS 和 backbone 之间的信息流隔离程度： (1) Joint (v7): ACIS
    和 backbone 同时训练，backbone 适应 ACIS 的 mask pattern，导致 backbone 单独运行时性能崩溃（bypass loss
    仅 0.0078 ≪ standard loss 0.0134，说明 backbone 在 co-adaptation 中学到了 "依赖 ACIS"的模式）。G3=3.29
    表明不加 ACIS 几乎无法使用。 (2) Gradient-isolated (v8): 阻断了 ACIS→backbone 的梯度流，但 backbone
    仍然在有 ACIS mask 的环境中训练，产生隐式 co-adaptation。G3=1.34——比 joint 好很多但仍非无损。 (3) Two-stage
    (v8b): Stage1 完全冻结 backbone 训 ACIS，Stage2 完全冻结 ACIS 训 LoRA。 两者从未同时优化，消除所有 co-adaptation。G3=0.87，backbone
    质量最接近原始 baseline。 这个 ablation 是论文的核心工程贡献——解释了为什么 two-stage 是必要的。

    '
  tables:
  - name: 'Table: Training Strategy Ablation (SmolVLA, aloha_sim_insertion)'
    columns:
    - Strategy
    - Standard Loss
    - ACIS+Prune Loss
    - Bypass Loss
    - G3 Ratio
    - Margin
    - ε=0.01 Pres.
    rows:
    - - Joint (v7)
      - '0.0134'
      - '0.0134'
      - '0.0078'
      - '3.29'
      - '0.57'
      - '0.91'
    - - Grad-Isolated (v8)
      - '0.0055'
      - '0.0055'
      - '0.0289'
      - '1.34'
      - '0.50'
      - '0.92'
    - - Two-Stage (v8b)
      - '0.0207'
      - '0.0035'
      - '0.0187'
      - '0.87'
      - '0.93'
      - '0.90'
    - - Baseline (no IMM)
      - '0.0041'
      - —
      - —
      - '1.00'
      - '0.01'
      - '0.34'
  figures_description:
  - '三行子图：每行一个训练策略，x 轴为 training step，y 轴为 action loss。每行画 3 条线（standard / ACIS+prune
    / bypass），直观展示 co-adaptation 的不同模式。Joint: standard 和 bypass 交叉；Grad-isolated:
    bypass 高于 standard 但差距不大；Two-stage: 两段 plateau 明显，最终 ACIS+prune 远低于其他。'
  analysis: 'Ablation 清晰展示 co-adaptation 问题的机制和 two-stage 的解决方案。Joint 训练中 bypass loss
    极低 说明 backbone 被 ACIS 的 mask pattern 结构性改变——这不是 "improved backbone" 而是 "broken
    backbone that depends on ACIS"。Gradient isolation 部分解决但不彻底（G3=1.34 仍>1.0）。Two-stage
    完全解决， 代价是训练流程更复杂（需要两阶段、冻结策略）。论文应将此呈现为 key engineering contribution，类似 BatchNorm
    需要 running mean/var 分离一样，ACIS 需要训练解耦来保证 backbone 完整性。

    '
- name: Formal Bound Empirical Validation
  plan_id: plan_005
  description: '多 ε 水平 (0.005, 0.01, 0.02, 0.05, 0.1) 下测量 top-k stability，绘制 theoretical
    vs empirical bound 对比图。估计 Lipschitz constant L via spectral norm。

    '
  expected_results:
    lipschitz_spectral_norm: 1.07
    margin_median: 0.93
    k: 145
    eps_levels:
      eps_0005:
        theoretical_flip_prob_bound: 0.083
        empirical_flip_rate: 0.012
        tightness_ratio: 6.9
      eps_001:
        theoretical_flip_prob_bound: 0.167
        empirical_flip_rate: 0.025
        tightness_ratio: 6.7
      eps_002:
        theoretical_flip_prob_bound: 0.333
        empirical_flip_rate: 0.058
        tightness_ratio: 5.7
      eps_005:
        theoretical_flip_prob_bound: 0.834
        empirical_flip_rate: 0.148
        tightness_ratio: 5.6
      eps_01:
        theoretical_flip_prob_bound: 1.0
        empirical_flip_rate: 0.312
        tightness_ratio: N/A (bound saturated)
    avg_tightness_ratio: 6.2
    bound_direction_correct: true
    bound_never_violated: true
  result_rationale: 'Median 档预测 bound_tightness_ratio 在 [5.0, 10.0]。Formal bound P(flip)
    ≤ k·ε·L/Δ_k 使用的是 worst-case Lipschitz constant（spectral norm 1.07）和 median margin（0.93），但实际
    扰动下的 importance score 变化远小于 worst case——因为 (a) spectral norm 是所有方向的上界，实际 扰动方向大多不沿最大奇异值方向；(b)
    Δ_k 是 median 但很多 token 的 margin 远大于 median。因此 theoretical bound 是 empirical rate
    的 ~6x——方向正确（bound 从未被违反），但 loose 程度会让 追求 tight guarantee 的审稿人不满。 ε=0.1 时 theoretical
    bound 饱和到 1.0（trivial bound），此时 empirical rate 0.312 说明实际 还有很大空间——bound 在高扰动下失去指导价值。
    论文应将 bound 定位为 "principled design criterion that correctly ranks training objectives"
    而非 "tight runtime certificate"。

    '
  tables:
  - name: 'Table: Theoretical vs Empirical Bound (SmolVLA, k=145)'
    columns:
    - ε
    - Theoretical P(flip)
    - Empirical flip rate
    - Tightness ratio
    - Bound holds?

tier: median
narrative_guidance: 'Claim 2 降级为 ''near-lossless compression with robustness guarantee''——不再强调
  performance gain，改为强调 robustness-compression tradeoff 的 Pareto improvement。Claim
  3 从独立 claim 降级为 ''empirical observation consistent with denoising hypothesis''，放入
  analysis section 而非 core contribution。 Claim 1 certified bound 改为强调 ''principled
  design criterion'' 而非 ''tight guarantee''——bound 的价值 在于指导训练目标设计而非运行时认证。Story 从 ''provably
  robust + lossless'' 调整为 ''first robustness-aware compression framework with theoretical
  grounding''。仍可投 CoRL 但需要补充 computational overhead analysis 证明 practical value。

  '
imagined_experiments:
- name: Success Rate Evaluation on aloha_sim_insertion
  plan_id: plan_001
  description: 'aloha_sim_insertion 上 baseline vs v8b+prune(50%) vs v8b bypass，50+
    episodes 对比 success rate。 验证 action loss 差异是否反映在实际任务表现上。

    '
  expected_results:
    baseline_success_rate: 0.82
    v8b_prune50_success_rate: 0.84
    v8b_bypass_success_rate: 0.8
    random_prune50_success_rate: 0.54
    n_episodes: 60
    success_rate_delta_prune_vs_baseline_pp: 2.0
    success_rate_delta_bypass_vs_baseline_pp: -2.0
    p_value_prune_vs_baseline: 0.38
    p_value_random_vs_baseline: 0.001
    confidence_interval_95_prune:
    - 0.73
    - 0.92
    confidence_interval_95_baseline:
    - 0.71
    - 0.9
  result_rationale: 'Median 档预测 success_rate_delta 在 [-3, +4] pp 范围内。v8b+prune(50%)
    的 action loss (0.0035) 显著低于 baseline (0.0041)，但 action loss 差异为 ~15%，在 sim rollout
    中这种差异 被环境随机性和 closed-loop 误差修正机制所稀释——机器人在多数 timestep 上都有足够的 action 质量完成任务， 因此
    success rate 差异被压缩到统计不显著的 +2pp。Random prune 的 action loss (0.018) 是 baseline 的
    4.4x，这种程度的 degradation 在 closed-loop 中无法被修正，success rate 大幅下降到 54%。 60 episode
    的样本量在 ±2pp 的差异上 power 不足（需要 ~2000 episodes 才能 detect），因此 p>0.05。 这意味着论文不能声称 "compression
    improves success rate"，只能说 "compression is near-lossless in task performance while
    providing robustness guarantee"。

    '
  tables:
  - name: 'Table: Success Rate Comparison (aloha_sim_insertion, 60 episodes)'
    columns:
    - Method
    - Success Rate
    - 95% CI
    - p vs baseline
    rows:
    - - Baseline (no compression)
      - 82%
      - '[71%, 90%]'
      - —
    - - IMM two-stage + ACIS prune 50%
      - 84%
      - '[73%, 92%]'
      - '0.38'
    - - IMM two-stage bypass (no prune)
      - 80%
      - '[68%, 89%]'
      - '0.52'
    - - Random prune 50%
      - 54%
      - '[41%, 66%]'
      - '0.001'
  figures_description:
  - 'Bar chart with 95% CI error bars: 4 conditions, y-axis success rate 0-100%。前三个
    bar 高度接近且 CI 重叠，random prune 明显低。标注 n.s. (not significant) 在 baseline vs ACIS
    prune 之间。'
  analysis: 'Success rate 方向一致但差异不显著（p=0.38），符合 median 档预期。这支持 ''near-lossless'' 叙事但不支持
    ''performance gain'' 叙事。Random prune 的显著下降（-28pp, p<0.001）证明 ACIS importance scoring
    是必要的——不是任意 50% 都能删。论文应呈现为 "ACIS-guided compression preserves task success while
    random compression catastrophically degrades"。审稿人可能要求更多 episodes 或更多 tasks 来增强统计
    power，这由 plan_002 (LIBERO) 部分解决。

    '

      - ✓
    - - '0.020'
      - '0.333'
      - '0.058'
      - 5.7x
      - ✓
    - - '0.050'
      - '0.834'
      - '0.148'
      - 5.6x
      - ✓
    - - '0.100'
      - '1.000'
      - '0.312'
      - —
      - ✓ (trivial)
  figures_description:
  - 'Log-log plot: x 轴 ε，y 轴 flip probability。两条线：theoretical bound (上方虚线) 和 empirical
    rate (下方实线 + error bars)。两线平行但间隔 ~6x，在 ε=0.1 处 theoretical 线碰顶。shaded area 表示
    ''certified safe zone''。'
  - 'Tightness ratio vs ε: bar chart，显示 ratio 在 5.6~6.9 范围，标注 median 档 target [5,
    10]。'
  analysis: 'Bound 从未被违反（soundness 成立），但 5.6~6.9x 的 tightness ratio 意味着 bound 提供的是
    conservative certificate。审稿人可能的反应："bound 太 loose，实际指导价值有限"。应对策略： (1) 强调 bound
    的 comparative value——IMM 训练后 Δ_k 从 0.01 提升到 0.93（93x），即使 bound 是 6x loose，认证区域仍扩大了
    93/6 ≈ 15x； (2) 强调 bound 作为 training objective design principle 的价值——最大化 Δ_k 的动机来自
    bound， 实验证明这个方向正确； (3) 承认 tightening bound 是 future work（可能通过 data-dependent Lipschitz
    估计）。

    '

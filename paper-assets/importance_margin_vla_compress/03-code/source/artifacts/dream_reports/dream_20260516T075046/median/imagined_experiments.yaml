  result_rationale: 'Median 档预测 G3_deploy_ratio_libero_avg 在 [0.9, 1.05]。LIBERO 是比
    aloha_sim_insertion 更复杂的多任务 benchmark，SmolVLA 在 LIBERO 上的 baseline 表现本身就不如 aloha（更多
    task 多样性 和更长 horizon），因此 two-stage training 的增益被任务复杂度稀释。部分 task 上 G3<1.0（Object、Spatial
    的 action loss 下降），部分 task 上 G3>1.0（Goal suite 的长 horizon 任务中 pruning 偶尔丢弃 长期规划相关
    token），整体平均在 0.97 左右——接近无损但不是所有 task 都无损。 Success rate 差异在各 suite 上方向不一致（Object
    -2pp, Spatial +2pp, Goal -2pp），平均 -0.7pp， paired test p=0.31 不显著。这进一步支持 ''near-lossless''
    而非 ''improvement'' 叙事。 Robustness 指标（preservation 0.91, margin ratio 78.5x）在 LIBERO

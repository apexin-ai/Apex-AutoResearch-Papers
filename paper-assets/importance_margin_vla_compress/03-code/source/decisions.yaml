    k=0.85 处 +35.6pp importance margin 部分由 Random 异常低谷驱动。但 disruption peak 本身支持 architecture-dependent
    叙事：π0.5 的 linear connector 在 ~15% token removal 处有最大脆弱窗口，L2 scoring 避免了这个陷阱（单调递增），而
    Random 暴露了架构的固有脆弱性。论文应如实报告完整曲线 + 讨论 disruption peak 现象，而非回避。这比 cherry-pick k=0.85

    5% tokens 测 loss 变化，一次 forward pass 即可分类；(3) 直接基于 connector 类型识别（practitioners
    从 model card 可知）。方案 (3) 最诚实但方法贡献最弱；方案 (2) 最实用但需要额外实验验证；方案 (1) 需要补充 SmolVLA CV
    数据。

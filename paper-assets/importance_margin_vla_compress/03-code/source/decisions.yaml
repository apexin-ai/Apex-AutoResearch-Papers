decisions:
- id: D001
  date: 2026-05-15 11:09 UTC
  summary: MVP 方案：SmolVLA+LoRA on LIBERO-Object，Baseline vs IMM 对照，验证 Δ_k 提升和 top-k
    稳定性
  rationale: 核心假设是 margin maximization 能改善 compression robustness。用最小实验（单 suite、单
    compression method、两个条件）快速验证因果关系，再决定是否投入完整实验矩阵。CoRL DDL 紧（11天），必须尽快拿到 MVP 信号。
  related_experiments: []
  depends_on: []
- id: D002
  date: 2026-05-15 11:12 UTC
  summary: 采纳 Reviewer 4 项 warning：ACIS scoring for pruning、Lipschitz 监控、kill path、λ
    warmup
  rationale: Reviewer 指出：(1) pruning 应用 ACIS scores 而非 FastV attention 以保证逻辑自洽；(2)
    certified bound 依赖 L 和 Δ_k 两者，需监控 L·ε/Δ_k ratio；(3) 需定义超参搜索范围和 kill criteria 避免盲目投入；(4)
    ACIS 依赖 action head 中间表示，训练早期不稳定需 λ warmup。全部合理，纳入 MVP 设计。
  related_experiments: []
  depends_on:
  - D001
- id: D003
  date: 2026-05-15 11:13 UTC
  summary: L·ε/Δ_k gate criteria 量化：ratio 下降 ≥30%（相对 baseline）
  rationale: Reviewer 指出其余 3 项 gate criteria 有量化标准但 L·ε/Δ_k 只写"下降"，可能出现 Δ_k 涨但 L 同步涨导致
    ratio 不变的模糊情况。设 ≥30% 下降作为 MVP 粗阈值，足以区分信号。
  related_experiments: []
  depends_on:
  - D002
- id: D004
  date: 2026-05-15 11:27 UTC
  summary: MVP 增加 k=96 (75% retention) 条件；soft top-k 升级为 implicit differentiation
    方法
  rationale: SmolVLA pixel shuffle 后仅 128 tokens total，50% pruning (k=64) 可能过于激进导致
    false negative。增加 75% retention 对照避免因 pruning ratio 误判核心假设。Soft top-k 原实现不保证 Σp_i=k，梯度有偏，架构报告推荐的
    implicit differentiation 方法更精确，对 LoRA fine-tuning 稳定性更好。
  related_experiments: []
  depends_on:
  - D002
- id: D005
  date: 2026-05-15 13:25 UTC
  summary: MVP 数据集从 LIBERO-Object 换为 lerobot 原生可用数据集（候选：aloha_sim_insertion/pusht/xarm_lift）
  rationale: lerobot/libero_object_no_noops 返回 401 RepositoryNotFoundError，确认不存在。已在数据集问题上浪费多个
    Worker 和数小时 GPU 空闲时间。MVP 核心假设（margin maximization → top-k stability）不依赖特定数据集，换用
    lerobot 确认可用的数据集不影响验证。LIBERO 留到 research 阶段通过自定义 dataset adapter 接入。
  related_experiments: []
  depends_on:
  - D001
- id: D006
  date: 2026-05-15 16:27 UTC
  summary: Dry-run 必须同时覆盖 train 和 eval 模式，token_selection.py _hard_forward bug 只在
    eval 触发
  rationale: mvp_imm_anchor_v5 在 step 2000 首次 eval 时崩溃：_hard_forward() 中 threshold_low.squeeze(-1)
    将 (B,1) 变成 (B,) 无法与 (B,N) 广播。此 bug 在 training 模式下不触发（走 _soft_forward），之前所有 dry-run
    只测了 training step。教训：任何 dry-run 必须同时在 model.train() 和 model.eval() 两种模式下各跑一步。
  related_experiments:
  - exp_id: mvp_imm_anchor_v5
    role: trigger
    result: crashed at step 2000 during eval
  depends_on: []
- id: D007
  date: 2026-05-15 16:30 UTC
  summary: 'Gate Criteria #3 从 "action_loss 不降 >5%" 放宽为 "IMM/baseline 均值比 ≤1.10"，避免
    flow matching 噪声误判'
  rationale: Reviewer 指出 flow matching loss 稳定在 ~0.01 量级时，5% 相对阈值 = 0.0005 绝对差异，在
    batch-level 噪声范围内。放宽到 10% 相对阈值，用 eval batches 均值比较，足以检测 IMM 对 action quality 的实质性损害而不被噪声误触。
  related_experiments:
  - exp_id: mvp_baseline_v5
    role: reference
    result: loss ~0.001-0.035 at step 9700
  depends_on:
  - D003
- id: D008
  date: 2026-05-15 17:03 UTC
  summary: IMM 训练跳过训练内 eval (eval_every=999999)，用独立 evaluate.py 做全量评估
  rationale: IMM v6 在 step 2000 eval 再次崩溃，根因是 lerobot 内部 RoPE position embedding 维度不匹配（50
    vs 82），非我们代码 bug。修复 lerobot 内部代码耗时且脆弱，而独立 evaluate.py 已修复验证通过。跳过训练内 eval 可立即重启，通过
    train_loss + gradient + margin_loss 监控训练健康。save_every 从 5000 改为 2000 作为 fallback。
  related_experiments:
  - exp_id: mvp_imm_anchor_v6
    role: trigger
    result: crashed at step 2000 during eval - lerobot RoPE bug
  depends_on: []
- id: D009
  date: 2026-05-15 17:07 UTC
  summary: _hard_forward 改为 binary mask 保持序列长度（方案 C），不物理删除 tokens，避免 prefix 长度不匹配
  rationale: Reviewer 定位 v6 crash 真因：_hard_forward 返回 (B, k, D) 但 tokens_per_cam 仍为

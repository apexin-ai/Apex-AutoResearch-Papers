- id: D018
  date: 2026-05-15 22:03 UTC
  summary: 'Reviewer CRITICAL: v7.2 mid-checkpoint G3=8.1x 确认两个 lambda (0.2/0.5) 均大幅失败；train/eval
    discrepancy 为关键诊断点——决定 MVP 走向'
  rationale: v7 (lambda=0.5) final G3=3.28x，v7.2 (lambda=0.2) step 20K G3=8.1x（50-batch
    eval）。D16/D17 的乐观基于训练 loss 0.0028，但 eval loss 0.033——10x discrepancy。Agent 正在诊断此
    discrepancy。两条路径：(1) 若 eval 有 bug → 修复后 G3 可能 OK；(2) 若 real behavior → 两个 lambda
    均失败证明非调参问题，需架构级修复（gradient isolation / stop-gradient on ACIS→action pathway）。v7.2
    步数 29900/30000 即将完成，等 500-batch final eval + 诊断结果后做最终 MVP 判定。
  related_experiments:
  - exp_id: mvp_imm_anchor_v7
    role: failed_gate
    result: G3=3.28x
  - exp_id: mvp_imm_anchor_v7_2
    role: mid_eval

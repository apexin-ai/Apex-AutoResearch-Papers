  summary: 'Gate Criteria comparison protocol: Gates #1/#2/#4 用 IMM step_002000 checkpoint
    作参照（ACIS 几乎未训练），Gate #3 用 baseline_v5 final action_loss；L 值用 L_empirical'
  rationale: 'Baseline 无 ACIS 模块，无法直接计算 Δ_k/preservation/ratio。IMM step_002000 是最早可用

  summary: 'Disruption peak (non-monotonicity) confirmed cross-architecture: X-VLA
    (BART, no RoPE) shows same pattern as π0.5 — mechanism is position-sensitive token
    structure disruption, not RoPE-specific'
  rationale: 'X-VLA uses BART connector with its own positional encoding (no RoPE),
    yet exhibits non-monotonic disruption peak across all 4 LIBERO suites. Long suite
    amplifies most severely: k=0.85=35.0% vs k=0.5=61.6% (-26.6pp gap). This refutes
    the hypothesis that the disruption peak is caused by RoPE interference specifically.
    The mechanism is more general: position-sensitive token structure disruption occurs
    whenever intermediate pruning ratios hit critical token density thresholds, regardless
    of positional encoding scheme. This strengthens the paper — the phenomenon is
    universal, not architecture-specific.'
  related_experiments:

- id: D062
  date: 2026-05-17 09:31 UTC
  summary: 'D062: Token pruning 路线全面证伪——VLA 对 vision token 移除具有架构级零容忍'
  rationale: 5 组独立实验在 post-bugfix 条件下全部 0% SR：ACIS k=0.5 zero-mask (0/500), random
    k=0.5 zero-mask (0/500), ACIS k=0.9 zero-mask (0/500), ACIS k=0.5 true removal
    (0/500)。与 scoring 策略(learned/random)、pruning 比例(10%/50%)、实现机制(zero-mask/true removal)
    全部无关。Bypass baseline = 44.8%。结论：SmolVLA 的 action generation 依赖所有 visual token

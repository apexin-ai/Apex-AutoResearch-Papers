- id: D016
  date: 2026-05-15 21:32 UTC
  summary: v7 MVP Gate FAIL (G3=3.28x)；不修订 G3 定义；v7.2 为决定性实验；pruning 鲁棒性数据留作论文素材
  rationale: v7 (lambda=0.5) G1/G2/G4 大幅通过但 G3 严重失败 (3.28x vs ≤1.10)。Reviewer 建议增加
    G3b (pruned scenario gate)，拒绝——mid-evaluation 修改 gate 定义会损害 MVP 评估的诚信度。clean performance
    是合理的硬约束：一个主任务退化 3.28x 的模型即使 pruning 鲁棒也不可接受。但 Reviewer 揭示的 pruning 数据极有价值：(1)
    IMM prune50% 仅增 8% loss vs baseline 增 2816%；(2) baseline 训练越久 pruning 越脆弱 (4.4x→9.7x→29.2x)。这些作为论文素材保留。v7.2
    (lambda=0.2) step 20K action_loss=0.0028 强烈暗示 G3 可通过，等其完成做最终判定。
  related_experiments:
  - exp_id: mvp_imm_anchor_v7
    role: failed
    result: G3=3.28x FAIL, G1/G2/G4 PASS
  - exp_id: mvp_baseline_v5
    role: baseline
    result: clean=0.00408, prune50%=0.1190
  - exp_id: mvp_imm_anchor_v7_2

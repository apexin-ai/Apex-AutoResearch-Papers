- id: D013
  date: 2026-05-15 18:16 UTC
  summary: v7 Lipschitz 爆炸：不 kill 但设 step 8000 kill 条件；cuda:0 立即启动 v7.1 (lambda=0.2,
    grad_clip=30)
  rationale: 'Reviewer 报告 v7 step 6000 的 lipschitz_empirical 从 0.096 指数增长到 0.606，Gate
    D003 的 L·ε/Δ_k ratio 上升 221% 而非下降 30%。根因: lambda_margin=0.5 太激进。决策: (1) v7 继续到
    step 8000 收集数据但设 kill 条件 (L>1.0 / grad>100 / median ratio>1.0)；(2) cuda:0 空闲违反资源纪律，立即启动
    v7.1 用更保守超参 (lambda=0.2, grad_clip=30) 并行探索。这符合 kill path 协议的超参搜索流程。'

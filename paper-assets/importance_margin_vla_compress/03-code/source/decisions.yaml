    直接用 baseline_v5 clean_loss=0.00422。Gate #4 的 L 值用 L_empirical（power iteration,
    0.096）作为主要指标，L_spectral（1.067）作为保守上界在报告中标注——spectral norm 包含了不影响 visual token

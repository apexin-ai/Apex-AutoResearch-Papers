- id: D152
  date: 2026-05-22 00:45 UTC
  summary: 'D152: π0.5 random pruning cliff is task-specific, not model-intrinsic.
    Object k=0.85=5.0% vs Spatial k=0.85≈74.7% (70pp gap). L2norm consistent across
    suites (94.9-98.2%). Cliff exists only at intersection of random × Object × k=[0.85-0.9].'
  rationale: 'Cross-suite interim results (westd-38929) show: (1) Random k=0.85 Object=5.0%
    but Spatial≈74.7% — the cliff zone that destroys Object tasks barely affects Spatial;
    (2) Random k=0.9 Object=10.8% vs Spatial≈50% — intermediate gap; (3) Random k=0.7
    Object=75.5% ≈ Spatial=74.4% — convergence at aggressive pruning; (4) L2norm k=0.9
    Object=98.2% vs Spatial≈94.9% — consistent high performance regardless of task
    type. The cliff is NOT a model-level property but emerges at the intersection
    of pruning method (random), task type (Object requiring precise spatial manipulation),
    and k-range (0.85-0.9). Object tasks rely on specific spatial tokens for precise
    manipulation; random removal in the cliff zone has high probability of destroying
    these. Spatial tasks have more redundant spatial encoding, making them robust
    to the same removal. This strengthens the paper narrative: pruning sensitivity
    = f(connector, method, task_semantics, k).'
  related_experiments:

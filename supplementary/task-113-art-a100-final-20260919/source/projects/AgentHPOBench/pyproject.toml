[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthpobench"
version = "0.1.0"
description = "Sequential hyperparameter optimization benchmark for autonomous ML agents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Tianyu Huai"},
  {name = "Tingshuo Fan"},
  {name = "Xinchi Chen"},
  {name = "Yining Zheng"},
  {name = "Yuxin Wang"},
  {name = "Shuang Chen"},
  {name = "Jie Zhou"},
  {name = "Xuanjing Huang"},
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
local = [
  "accelerate>=0.20",
  "torch>=2.0",
  "transformers>=4.45",
]
analysis = [
  "pandas>=2.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/OpenMOSS/AgentHPOBench"
Paper = "https://arxiv.org/abs/2607.29626"
Repository = "https://github.com/OpenMOSS/AgentHPOBench"
Issues = "https://github.com/OpenMOSS/AgentHPOBench/issues"

[tool.setuptools.packages.find]
include = ["agenthpobench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

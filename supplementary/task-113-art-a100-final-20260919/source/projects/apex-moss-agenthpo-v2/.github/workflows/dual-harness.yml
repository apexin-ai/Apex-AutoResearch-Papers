name: dual-harness

on:
  push:
    branches:
      - codex/dual-executable-harness
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run dual-Harness and portable regression tests
        run: >-
          python -m pytest -q
          tests/test_dual_harness.py
          tests/test_builder_harness.py
          tests/test_dual_runtime.py
          tests/test_dual_config.py
          tests/test_openai_responses_generator.py
          tests/test_harness_builder_runtime.py
          tests/test_harness_builder_rule_registry.py
      - name: Run offline dual-Harness fixture
        run: python scripts/run_dual_harness_fixture.py

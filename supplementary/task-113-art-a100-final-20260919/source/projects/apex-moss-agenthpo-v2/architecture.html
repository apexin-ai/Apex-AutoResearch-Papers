<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSS Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f1724;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: -apple-system, 'SF Pro Display', 'Noto Sans SC', sans-serif;
  }
  .wrap {
    width: 100%;
    max-width: 1400px;
    background: #151f30;
    border: 1px solid #253550;
    border-radius: 20px;
    padding: 28px;
    overflow-x: auto;
    box-shadow: 0 0 120px rgba(56,189,248,0.04), 0 0 40px rgba(0,0,0,0.5);
  }
  svg { display: block; width: 100%; min-width: 1200px; height: auto; }

  /* ═══ Animated flow lines ═══ */
  .flow {
    stroke-dasharray: 8 6;
    animation: dash 1.2s linear infinite;
  }
  .flow-slow {
    stroke-dasharray: 6 8;
    animation: dash 2.5s linear infinite;
  }
  .flow-rev {
    stroke-dasharray: 8 6;
    animation: dash-rev 1.5s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  @keyframes dash-rev { to { stroke-dashoffset: 28; } }

  /* ═══ Pulsing glow ═══ */
  .pulse { animation: glow-pulse 3s ease-in-out infinite; }
  .pulse-fast { animation: glow-pulse 1.8s ease-in-out infinite; }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Node hover */
  .node { transition: filter 0.3s; cursor: default; }
  .node:hover { filter: brightness(1.3); }

  /* Spinning ring */
  .spin { animation: spin 40s linear infinite; transform-origin: center; }
  .spin-rev { animation: spin-rev 55s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="gCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.25)"/><stop offset="100%" stop-color="rgba(56,189,248,0)"/>

    </filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowW" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  <rect x="878" y="290" width="245" height="270" rx="10" fill="#1c2940" stroke="#2d4565"/>
